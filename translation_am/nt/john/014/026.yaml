  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ δὲ παράκλητος, τὸ πνεῦμα τὸ ἅγιον ὃ πέμψει ὁ πατὴρ ἐν τῷ ὀνόματί μου, ἐκεῖνος ὑμᾶς διδάξει πάντα καὶ ὑπομνήσει ὑμᾶς πάντα ἃ εἶπον ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/026.yaml
  text: But the Advocate[a], the Holy Spirit, whom the Father will send in my name, he will teach you all things and remind you of all that I said to you.
translation:
  language: am
  text: ነገር ግን ረዳት የሆነው መንፈስ ቅዱስ፣ አብ በስሜ የሚልከው፣ እርሱ ሁሉን ያስተምራችኋል፤ እኔ የነገርኳችሁንም ሁሉ ያስታውሳችኋል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παράκλητος
  choice: ረዳቱ
  rationale: ቃሉ ሕጋዊ ተሟጋችነትን፣ ድጋፍን፣ ምክርንና ማጽናናትን ሊያመለክት ይችላል። «ረዳቱ» በዘመናዊ አማርኛ ተፈጥሯዊና ሰፊ ትርጉም ያለው ሲሆን፣ ሌሎቹ እውነተኛ አማራጮች በግርጌ ማስታወሻ ተጠብቀዋል።
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: መንፈስ ቅዱስ
  rationale: በዘመናዊ መደበኛ አማርኛ የተለመደውንና የግሪኩን መጠሪያ በቀጥታ የሚያስተላልፈውን አገላለጽ ይጠቀማል።
- source_word: ἐν τῷ ὀνόματί μου
  choice: በስሜ
  rationale: የወኪልነትን፣ የሥልጣንንና የአገልግሎትን ሊሆኑ የሚችሉ ፍቺዎች ሳይገድብ የግሪኩን አገላለጽ ይጠብቃል።
- source_word: ἐκεῖνος
  choice: እርሱ
  rationale: አጽንዖት ያለውን ወንድ ፆታ አመልካች ተውላጠ ስም ይወክላል፤ የመንፈስ ቅዱስን ግላዊ አድራጊነትም በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: διδάξει ὑμᾶς πάντα
  choice: ሁሉን ያስተምራችኋል
  rationale: የተስፋውን ስፋትና የወደፊት ጊዜ አድራጎት በግልጽና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ὑπομνήσει ὑμᾶς πάντα ἃ εἶπον ὑμῖν
  choice: እኔ የነገርኳችሁንም ሁሉ ያስታውሳችኋል
  rationale: የὑπομιμνῄσκωን ምክንያታዊ ትርጉም («እንድታስታውሱ ያደርጋል») በአጭርና ተፈጥሯዊ መልኩ ያስተላልፋል።
theological_decisions:
- issue: ለመንፈስ ቅዱስ ግላዊ አገላለጽ መጠቀም
  choice: «እርሱ» በሚለው ግላዊ ተውላጠ ስም መጥቀስ
  alternative: ግላዊ ያልሆነ አገላለጽ መጠቀም
  rationale: ጥቅሱ ገለልተኛ ፆታ ካለው πνεῦμα ጋር ወንድ ፆታ ያለውን παράκλητος እና አጽንዖታዊውን ἐκεῖνος ያገናኛል፤ በተጨማሪም ማስተማርና ማስታወስ የተባሉ ግላዊ ድርጊቶችን ይሰጠዋል።
- issue: የπαράκλητος ትርጉም
  choice: ረዳቱ
  alternative: ተሟጋቹ፣ አማካሪው፣ አጽናኙ
  rationale: አንድ የአማርኛ ቃል የግሪኩን ሙሉ የትርጉም ክልል አይይዝም። «ረዳቱ» ሰፊውንና ንቁውን ሚና በተፈጥሯዊ ቋንቋ ያሳያል፤ ሕጋዊ፣ የምክርና የማጽናናት ፍቺዎቹ ግን በማስታወሻ ተጠብቀዋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «ማለትም» የሚለው ቃል παράκλητος እና መንፈስ ቅዱስ አንድን አካል እንደሚጠቁሙ የግሪኩን አፖዚሽን በግልጽ ያሳያል።
