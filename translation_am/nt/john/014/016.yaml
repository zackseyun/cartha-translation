  text: And I will ask the Father[a], and he will give you another Advocate, so that he may be with you forever,
translation:
  language: am
  text: እኔም አብን እለምነዋለሁ፤ እርሱም ከእናንተ ጋር ለዘላለም እንዲሆን ሌላ ጠበቃ[a] ይሰጣችኋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ለግሪኩ παράκλητος ወይም “ረዳት፣” “አማካሪ፣” ወይም በባህላዊ አተረጓጎም “አጽናኝ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: እኔም
  rationale: καί + ἐγώ ያለውን አያያዥነትና መጠነኛ አጽንዖት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐρωτήσω
  choice: እለምነዋለሁ
  rationale: በዚህ አውድ የሚቀርብን ጥያቄ ወይም ልመና በክብር የሚገልጽ ሲሆን፣ ጸሎትን በግድ አያስገባም።
- source_word: τὸν πατέρα
  choice: አብን
  rationale: የዮሐንስን አጠቃቀም በተከበረና በተለመደ አማርኛ ይጠብቃል፤ በግሪኩ የሌለውን ‘የእኔ’ አይጨምርም።
- source_word: ἄλλον
  choice: ሌላ
  rationale: ከአሁን በፊት ካለው ጋር በንጽጽር ‘ሌላ’ የሚለውን ቀጥተኛ ትርጉም ይጠብቃል።
- source_word: παράκλητον
  choice: ጠበቃ
  rationale: ቃሉ ያለውን የግል፣ የውክልናና የሕግ ነክ ገጽታ በዘመናዊ አማርኛ በአጭሩ ይገልጻል፤ ሌሎች ትርጉማዊ አማራጮች በማስታወሻ ተጠብቀዋል።
- source_word: δώσει ὑμῖν
  choice: ይሰጣችኋል
  rationale: የወደፊት ጊዜውንና ተቀባዮቹ ብዙ ቁጥር መሆናቸውን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἵνα ᾖ
  choice: እንዲኖር
  rationale: የἵνα ሐረጉን ዓላማ ወይም ውጤት ሳያጠፋ በተፈጥሯዊ የአማርኛ ንዑስ ሐረግ ይገልጻል።
- source_word: μεθ’ ὑμῶν
  choice: ከእናንተ ጋር
  rationale: μετά ከባለቤት ዘር ጋር ያለውን ‘ከ…ጋር’ ትርጉም በቀጥታ ያስተላልፋል።
- source_word: εἰς τὸν αἰῶνα
  choice: ለዘላለም
  rationale: በዮሐንስ አውድ ያለውን የማያቋርጥ ቆይታ በግልጽና በተለመደ አማርኛ ይገልጻል።
