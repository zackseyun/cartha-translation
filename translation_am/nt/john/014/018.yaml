  verdict: revise
  source_fidelity: The draft correctly retains the familial image of ὀρφανούς and leaves the referent of ἔρχομαι πρὸς ὑμᾶς open. However, «ብቻችሁን» (“alone”) adds an element not explicitly present in the Greek, and the first clause is more cumbersome than necessary.
  naturalness: «ወላጅ አልባ ልጆች እንደሆናችሁ» is clear, idiomatic modern standard Amharic and directly expresses the comparison in the source. The future-negative form «አልተዋችሁም» naturally conveys “I will not leave you” in this context.
  terminology: «ወላጅ አልባ ልጆች» preserves the concrete image of children deprived of parental care without forcing an interpretive sense such as emotional abandonment. «ወደ እናንተ እመጣለሁ» is appropriate and does not resolve the debated referent of Jesus’ coming.
  issues:
