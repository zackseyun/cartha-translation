  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἰ ⸀ἐγνώκειτέ με, καὶ τὸν πατέρα μου ⸂ἂν ᾔδειτε⸃· ⸀ἀπ’ ἄρτι γινώσκετε αὐτὸν καὶ ἑωράκατε ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/007.yaml
  text: If you had known me, you would have known my Father also. From now on you do know him and have seen him.
translation:
  language: am
  text: ብታውቁኝ ኖሮ፣ አባቴንም ባወቃችሁት ነበር። ከአሁን ጀምሮ ታውቁታላችሁ፤ አይታችሁታል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγνώκειτέ / ᾔδειτε / γινώσκετε
  choice: ብታውቁኝ / ባወቃችሁት / ታውቁታላችሁ
  rationale: የግሪክ ጽሑፉ ሁለት የ‘ማወቅ’ ግሶችን ቢጠቀምም፣ በዚህ አውድ ግልጽ የትርጉም ልዩነት ማስገደድ አያስፈልግም፤ ተፈጥሯዊው የአማርኛ ‘ማወቅ’ ተጠብቋል።
- source_word: ἀπ’ ἄρτι
  choice: ከአሁን ጀምሮ
  rationale: ከዚህ ጊዜ ወዲያ የሚለውን ጊዜያዊ ሽግግር በዘመናዊና ግልጽ አማርኛ ያሳያል።
- source_word: ἑωράκατε
  choice: አይታችሁታል
  rationale: የፍጹም ጊዜውን እስከአሁን የሚደርስ ውጤት በአማርኛ ፍጹም አገላለጽ ያቀርባል።
theological_decisions:
- issue: ደቀ መዛሙርቱ አብን ማወቃቸውና ማየታቸው
  choice: ‘ከአሁን ጀምሮ ታውቁታላችሁ፤ አይታችሁታልም’ በሚል ቀጥተኛ አገላለጽ ተተርጉሟል።
  alternative: ‘ልታውቁት ነው’ ወይም ምሳሌያዊ ማብራሪያ መጨመር።
  rationale: ጽሑፉ የአሁን ጊዜ ማወቅንና የተፈጸመ ማየትን በግልጽ ያስቀምጣል፤ ይህን ሥነ-መለኮታዊ ውጥረት ያለ ትርጓሜያዊ ማለዘብ ጠብቀናል።
- issue: የመጀመሪያው ሁኔታዊ ንግግር ጊዜና አይነት
  choice: ‘ብታውቁኝ ኖሮ … ባወቃችሁት ነበር’
  alternative: ‘ታውቁኝ ከሆነ፣ አባቴንም ታውቁታላችሁ’
  rationale: የቀረበው SBLGNT ጽሑፍ ያልተፈጸመ የቀድሞ ሁኔታን ይጠቁማል፤ አማርኛው ይህን ቅርጽ በግልጽ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። ‘ኖሮ … ነበር’ የግሪኩን ያልተፈጸመ ሁኔታ በተፈጥሯዊ አማርኛ ያቀርባል፤ ምንም የግርጌ ማስታወሻ አልተጨመረም።
