  text: καὶ ὅ τι ἂν αἰτήσητε ἐν τῷ ὀνόματί μου τοῦτο ποιήσω, ἵνα δοξασθῇ ὁ πατὴρ ἐν τῷ υἱῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/013.yaml
  text: And whatever you ask in my name[a], this I will do, so that the Father may be glorified in the Son.
translation:
  language: am
  text: በስሜ የምትለምኑትን ሁሉ እኔ አደርገዋለሁ፤ ይህም አብ በወልድ[a] እንዲከበር ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በወልድ በኩል።” ግሪኩ “በወልድ” ይላል፤ ይህም አብ የሚከበርበትን ሁኔታ ወይም መንገድ ሊገልጽ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ὅ τι ἂν
  choice: የምትለምኑትን ሁሉ
  rationale: ከἄν ጋር የተሠራው አንጻራዊ አገላለጽ ሰፊና ያልተወሰነ ወሰን አለው፤ ‘ሁሉ’ ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: αἰτήσητε
  choice: የምትለምኑትን
  rationale: αἰτέω መጠየቅን ወይም መለመንን ያመለክታል፤ በዚህ የጸሎት አውድ ‘መለመን’ ተፈጥሯዊና ክብር ያለው ነው። የብዙ ሰዎች ሁለተኛ መደብ ቅርጹም ተጠብቋል።
- source_word: ἐν τῷ ὀνόματί μου
  choice: በስሜ
  rationale: የግሪኩን አጭርና ባለብዙ ንብርብር አገላለጽ ይጠብቃል፤ ‘በሥልጣኔ’ ወይም ‘ከፈቃዴ ጋር ተስማምታችሁ’ ብሎ ወደ አንድ ትርጓሜ አያጠበውም።
- source_word: τοῦτο
  choice: እኔ አደርገዋለሁ
  rationale: በአማርኛው የቀደመው የተሳቢ አገላለጽ ‘የምትለምኑትን ሁሉ’ በግሱ ውስጥ ባለው ‘-ው-’ ተመልሶ ተጠቅሷል፤ ‘እኔ’ የግሪኩን አጽንዖት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ποιήσω
  choice: አደርገዋለሁ
  rationale: ποιέω እዚህ ሰፊና ቀጥተኛ ትርጉም ስላለው ‘አደርገዋለሁ’ ትክክለኛና ተፈጥሯዊ ነው።
- source_word: ἵνα
  choice: ይህም … እንዲ… ነው
  rationale: የἵναን የዓላማ ኃይል በግልጽ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: δοξασθῇ
  choice: እንዲከብር
  rationale: የግሪኩን ተገብሮ ንድፍና የክብር ቃላት ይጠብቃል፤ ከቀላሉ ‘እንዲመሰገን’ ይልቅ δοξάζωን በስፋት ያስተላልፋል።
- source_word: ὁ πατὴρ
  choice: አብ
  rationale: በዮሐንስ ውስጥ እንደ ልዩ መለኮታዊ መጠሪያ የሚሠራውን ‘አብ’ ይጠብቃል፤ ግሪኩ ‘አባቴ’ አይልም።
- source_word: ἐν τῷ υἱῷ
  choice: በወልድ
  rationale: ἐνን ወደ ‘በወልድ በኩል’ ብቻ ሳያጠብ፣ አብ የሚከብርበትን መስክ ወይም መንገድ ሊያመለክት የሚችለውን አሻሚነት ይጠብቃል።
theological_decisions:
- issue: ‘በስሜ’ የሚለው አገላለጽ ትርጉም
  choice: ‘በስሜ’ ተብሎ ያለ ማብራሪያዊ ማስፋት ተጠብቋል።
  alternative: ‘በሥልጣኔ’፣ ‘ከእኔ ጋር በአንድነት’ ወይም ‘ከባሕርዬና ከፈቃዴ ጋር ተስማምታችሁ’
  rationale: በዮሐንስ አውድ ይህ አገላለጽ ውክልናን፣ ግንኙነትንና ከኢየሱስ ጋር መስማማትን ጨምሮ ብዙ ንብርብር አለው፤ አንዱን ብቻ መምረጥ የጽሑፉን ሀብት ያጠባል።
- issue: የἐν τῷ υἱῷ ኃይል
  choice: ‘በወልድ’ ተብሎ ተተርጉሟል።
  alternative: ‘በወልድ በኩል’
  rationale: ἐν እዚህ አብ የሚከብርበትን መስክ ወይም መንገድ ሊገልጽ ይችላል፤ ዋናው ጽሑፍ ትርጉሙን ወደ አንድ አማራጭ አይወስነውም፣ ሌላው ንባብ ግን በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘አብ’ እና ‘ወልድ’ በመጽሐፍ ቅዱሳዊ አጠቃቀም የታወቁ ሲሆኑ ከልክ ያለፈ ጥንታዊ አገባብ ተወግዷል። በቀረበው የእንግሊዝኛ ጽሑፍ የማስታወሻው ምልክት ‘በስሜ’ ከሚለው በኋላ ቢታይም፣ የማስታወሻው ይዘት ἐν τῷ υἱῷን ስለሚመለከት በአማርኛው ‘በወልድ’ ከሚለው በኋላ ተቀምጧል።
