base_translation:
  language: en
  yaml_path: translation/nt/john/014/003.yaml
  text: And if I go and prepare a place for you[a], I am coming again and will take you to myself, so that where I am[b], you also may be.
translation:
  language: am
  text: ሄጄ ስፍራ ካዘጋጀሁላችሁ፣ ዳግመኛ እመጣለሁ[a][b]፤ እኔ ባለሁበት እናንተም እንድትሆኑ፣ ወደ ራሴ እወስዳችኋለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ዳግመኛ እመጣ።” ግሪኩ የአሁን ጊዜ ቅርጽ ያለውን ግስ በወደፊት ትርጉም ይጠቀማል።
    reason: lexical_alternative
  - marker: b
    text: “ዳግመኛ እመጣለሁ” የሚለው በተለይ የኢየሱስን በመጨረሻ የሚያደርገውን መምጣት፣ ከትንሣኤው በኋላ ያደረጋቸውን መገለጦች፣ የመንፈስ ቅዱስን መምጣት፣ ወይም ከእነዚህ ከአንድ በላይ የሚያካትት ተደራራቢ ተስፋ ማመልከቱን በተመለከተ ትርጓሜዎች ይለያያሉ።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν πορευθῶ
  choice: ከሄድሁ
  rationale: ἐάν ከአኦሪስት ንዑስ አንቀጽ ጋር የወደፊት ሁኔታን ያመለክታል፤ ‘ከሄድሁ’ ቀጥተኛና በዐውዱ ተፈጥሯዊ ነው።
- source_word: ἑτοιμάσω τόπον ὑμῖν
  choice: ስፍራ ካዘጋጀሁላችሁ
  rationale: ἑτοιμάζω ‘ማዘጋጀት’ን፣ τόπος ‘ስፍራ’ን ያመለክታሉ፤ ስፍራው ምን እንደሆነ ጽሑፉ ከሚለው በላይ አልተብራራም።
- source_word: πάλιν ἔρχομαι
  choice: ዳግመኛ እመጣለሁ
  rationale: πάλιν የመደገምን ሐሳብ ይገልጣል፤ ἔρχομαι በግሪክ የአሁን ጊዜ ቅርጽ ቢኖረውም እዚህ የወደፊት ትርጉም አለው። ‘እመጣለሁ’ በአማርኛ ተፈጥሯዊ የወደፊት ተስፋን ያስተላልፋል።
- source_word: παραλήμψομαι ὑμᾶς πρὸς ἐμαυτόν
  choice: ወደ ራሴ እንድወስዳችሁ
  rationale: παραλαμβάνω እዚህ ሰዎችን ከራስ ጋር ወይም ወደ ራስ መውሰድን ይገልጣል፤ πρὸς ἐμαυτόν ያለውን ግላዊና ዝምድናዊ አቅጣጫ ቃሉ ይጠብቃል።
- source_word: ἵνα
  choice: ይህም … እንድትኖሩ … እንድወስዳችሁ ነው
  rationale: ἵνα ዓላማን ያስገባል፤ የአማርኛው ‘እንድ-’ አወቃቀር ይህን ዓላማ በተፈጥሯዊ መንገድ ያሳያል።
- source_word: ὅπου εἰμὶ ἐγὼ
  choice: እኔ ባለሁበት
  rationale: ግልጽ የሆነው ἐγώ ያለው አጽንዖት ‘እኔ’ በማለት ተጠብቋል።
- source_word: καὶ ὑμεῖς ἦτε
  choice: እናንተም እንድትኖሩ
  rationale: καί ‘-ም’ በሚለው አገናኝ ተወክሏል፤ ἦτε ከἵνα ጋር ያለው የዓላማ ንዑስ አንቀጽ ‘እንድትኖሩ’ ተብሎ ተተርጉሟል። ‘መኖር’ እዚህ ‘ባለበት መገኘት’ን በተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: በπάλιν ἔρχομαι የተገባው የኢየሱስ ዳግመኛ መምጣት ባሕርይ
  choice: የመምጣቱን ሁኔታና ጊዜ ሳይወስን ‘ዳግመኛ እመጣለሁ’ የሚል የወደፊት ተስፋ
  alternative: ከትንሣኤ በኋላ መገለጡ፣ የመንፈስ ቅዱስ መምጣት፣ የመጨረሻው ዳግም ምጽአት፣ ወይም ከእነዚህ ከአንድ በላይ የሚያካትት ተደራራቢ ተስፋ
  rationale: ጥቅሱ ኢየሱስ ተመልሶ ደቀ መዛሙርቱን ወደ ራሱ እንደሚወስድ ይገልጣል፤ ነገር ግን መምጣቱን በአንድ ብቻ ክስተት ላይ እንዲወሰን ትርጉሙ አያስገድድም።
