id: JHN.14.9
reference: John 14:9
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· ⸂Τοσούτῳ χρόνῳ⸃ μεθ’ ὑμῶν εἰμι καὶ οὐκ ἔγνωκάς με, Φίλιππε; ὁ ἑωρακὼς ἐμὲ ἑώρακεν τὸν πατέρα· ⸀πῶς σὺ λέγεις· Δεῖξον ἡμῖν τὸν πατέρα;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/009.yaml
  text: Jesus said to him[a], “Have I been with you for so long, and you still have not known me, Philip? The one who has seen me has seen the Father. How can you say, ‘Show us the Father’?”
translation:
  language: am
  text: ኢየሱስም እንዲህ አለው፦ “ፊልጶስ ሆይ፣ ይህን ያህል ጊዜ[a] ከእናንተ ጋር ከቆየሁ፣ አሁንም አላወቅኸኝም? እኔን ያየ አብን አይቷል፤ ታዲያ አንተ፣ ‘አብን አሳየን’ እንዴት ትላለህ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ይህን ሁሉ ጊዜ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοσούτῳ χρόνῳ
  choice: ይህን ያህል ጊዜ
  rationale: የጊዜውን ርዝመትና የጥያቄውን ወቀሳዊ ኃይል በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: μεθ’ ὑμῶν εἰμι
  choice: ከእናንተ ጋር ስኖር
  rationale: የግሪኩን የአሁን ጊዜ ቅርጽ ቃል በቃል ከመከተል ይልቅ፣ እስከ ንግግሩ ጊዜ የቀጠለውን አብሮነት በአማርኛ በተፈጥሮ ይገልጣል፤ ὑμῶν ብዙ ቁጥር በ‘እናንተ’ ተጠብቋል።
- source_word: οὐκ ἔγνωκάς με
  choice: አሁንም አላወቅኸኝም
  rationale: የፍጹም ጊዜውን ውጤታዊ ሁኔታና ከረጅም አብሮነት በኋላ የሚሰማውን ወቀሳ ያስተላልፋል።
- source_word: Φίλιππε
  choice: ፊልጶስ ሆይ
  rationale: የጥሪ ቅርጹን በተለመደው የአማርኛ መጠሪያ አገላለጽ ያቀርባል።
- source_word: ὁ ἑωρακὼς ἐμὲ
  choice: እኔን ያየ
  rationale: ስም ሆኖ የቀረበውን ፍጹም አሳታፊ ቅርጽ አጭርና ተፈጥሯዊ በሆነ አገላለጽ ይይዛል።
- source_word: ἑώρακεν τὸν πατέρα
  choice: አብን አይቷል
  rationale: የግሪኩን ቀጥተኛና ጠንካራ ንግግር ሳያዳክም ይጠብቃል፤ ‘አብ’ የዮሐንስን ሥነ መለኮታዊ አጠራር ያስተላልፋል።
- source_word: πῶς σὺ λέγεις
  choice: ታዲያ … እንዴት ትላለህ
  rationale: πῶς ያለውን የመደነቅና የተቃውሞ ድምፅ በተፈጥሯዊ የአማርኛ አገላለጽ ያሳያል።
- source_word: Δεῖξον ἡμῖν τὸν πατέρα
  choice: አብን አሳየን
  rationale: የቀጥታ ትእዛዙንና የብዙ ቁጥር ተቀባይን በግልጽ ሁኔታ ይጠብቃል።
theological_decisions:
- issue: ኢየሱስን በማየትና አብን በማየት መካከል ያለው ግንኙነት
  choice: “እኔን ያየ አብን አይቷል” ተብሎ ቀጥታ ተተርጉሟል።
  alternative: “አብ ምን እንደሚመስል አይቷል” ብሎ ማለዘብ፣ ወይም በኋላ የተቀመሩ የሃይማኖት ቃላትን ጨምሮ ማብራራት።
  rationale: የግሪኩ ጠንካራ ክርስቶሎጂያዊ ንግግር መጠበቅ አለበት፤ ሆኖም ጽሑፉ ያላለውን የአንድነት ወይም የውክልና ማብራሪያ በትርጉሙ ውስጥ መጨመር የለበትም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ነጠላ ተናጋሪ (‘ትላለህ’) እና ብዙ ቁጥር ቡድን (‘ከእናንተ፣’ ‘አሳየን’) ልዩነት ተጠብቋል።
