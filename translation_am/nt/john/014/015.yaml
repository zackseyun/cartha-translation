    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: ብትወዱኝ
  rationale: ἐάν ከተያያዘው የንዑስ አንቀጽ ግስ ጋር ሁኔታን ያመለክታል፤ በአማርኛ ‘ብት-’ ይህን በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: ἀγαπᾶτέ με
  choice: ብትወዱኝ
  rationale: የሁለተኛ መደብ ብዙ ቁጥርንና ‘እኔን’ የሚለውን ቀጥተኛ ተሳቢ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: τὰς ἐντολὰς τὰς ἐμὰς
  choice: ትእዛዞቼን
  rationale: የግሪኩን ብዙ ቁጥርና የባለቤትነት አጽንዖት በአጭርና ተፈጥሯዊ መልኩ ይጠብቃል።
- source_word: τηρήσετε
  choice: ትጠብቃላችሁ
  rationale: የወደፊት ጊዜ አመልካች ቅርጹን ይጠብቃል። ‘ጠበቀ’ ትእዛዝን ማክበር፣ መፈጸምና አጥብቆ መያዝን ሊያካትት ስለሚችል ከ‘መታዘዝ’ የሰፋውን የτηρέω ትርጉም ያቆያል።
theological_decisions:
- issue: τηρήσετε እንደ ትእዛዝ ወይስ እንደ የወደፊት ጊዜ ንግግር መተርጎም
  choice: የወደፊት ጊዜ ንግግር፦ ‘ትጠብቃላችሁ’
  alternative: ቀጥተኛ ትእዛዝ፦ ‘ጠብቁ’
  rationale: የግሪኩ ቅርጽ የወደፊት ጊዜ አመልካች እንጂ ትእዛዛዊ አይደለም። ስለዚህ ለኢየሱስ ያለ ፍቅር ትእዛዞቹን በመጠበቅ እንደሚገለጥ የሚያሳየውን ሥነ መለኮታዊ ውጥረት ያለ መፍታት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። የሁለተኛ መደብ ብዙ ቁጥር በ‘ትወዱ’ እና ‘ትጠብቃላችሁ’ ተጠብቋል።
