  text: I have spoken these things to you while staying with you[a].
translation:
  language: am
  text: ከእናንተ ጋር ሳለሁ[a] እነዚህን ነገሮች ተናግሬአችኋለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከእናንተ ጋር እየቆየሁ።” የግሪኩ ቃል “መቆየት፣ መኖር” የሚል ሲሆን በዮሐንስ ጽሑፎች ተደጋግሞ ይገኛል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: እነዚህን ነገሮች
  rationale: የግሪኩን ገለጻዊ ተውላጠ ስም ብዙ ቁጥር ይጠብቃል፤ ኢየሱስ ከዚህ በፊት ያስተማራቸውን ነገሮች ያመለክታል።
- source_word: λελάληκα
  choice: ተናግሬአችኋለሁ
  rationale: የፍጹም ጊዜውን ቅርጽና ቀጣይ አግባብ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ የተናገረው ቃል አሁንም ጠቀሜታ እንዳለው ያሳያል።
- source_word: ὑμῖν
  choice: አችኋለሁ (እናንተ)
  rationale: የሁለተኛ መደብ ብዙ ቁጥር ተቀባይን በግሱ ቅጥያ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: παρ’ ὑμῖν
  choice: ከእናንተ ጋር
  rationale: παρά ከዳቲቭ ጋር የሚገልጸውን አብሮነትና በአጠገብ መገኘት በግልጽና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: μένων
  choice: ሳለሁ
  rationale: የአሁን ጊዜ አሳታፊውን በአማርኛ የጊዜ ተያያዥ አንቀጽ በተፈጥሯዊ ሁኔታ ያስተላልፋል፤ ‘እየቆየሁ’ ከሚለው ይልቅ በዚህ ዐውድ የተለመደ ነው።
theological_decisions:
- issue: በዮሐንስ ወንጌል ተደጋግሞ የሚመጣውን μένω የቃላት ትስስር መጠበቅ
  choice: በዋናው ጽሑፍ ‘ሳለሁ’፣ በማስታወሻ ‘እየቆየሁ’
  alternative: ከእናንተ ጋር እየቆየሁ
  rationale: ‘ሳለሁ’ በአማርኛ ዐውዱን በተፈጥሯዊና ግልጽ መንገድ ያቀርባል፤ የμένω ቀጥተኛ የቃል ትስስርና ትርጉማዊ አማራጭ ግን በማስታወሻው ይጠበቃል፣ ምንም ተጨማሪ የእምነት ትርጓሜ ሳይጫን።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ። የብዙ ቁጥር አድራሻው በ‘እናንተ’ና በግሱ ‘-አችኋለሁ’ ቅጥያ ግልጽ ተደርጓል።
