  text: And you know the way where I am going[a].
translation:
  language: am
  text: እኔም ወደምሄድበት ስፍራ የሚያደርሰውን መንገድ ታውቃላችሁ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች፣ «እኔም ወዴት እንደምሄድ ታውቃላችሁ፤ መንገዱንም ታውቃላችሁ» ይላሉ።
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: -ም
  rationale: ቀላል አያያዥ ስለሆነ ከ«እኔ» ጋር የተያያዘው «-ም» በአማርኛ ተፈጥሯዊ ቅንጅትን ይሰጣል።
- source_word: ὅπου
  choice: ወደምሄድበት
  rationale: የቦታ ግንኙነቱን «ወደ…በት» በሚለው ተፈጥሯዊ የአማርኛ አንጻራዊ አወቃቀር ይገልጣል።
- source_word: ἐγὼ
  choice: እኔ
  rationale: በግሪኩ በግልጽ የተጠቀሰውን ተውላጠ ስም ይጠብቃል።
- source_word: ὑπάγω
  choice: ምሄድ
  rationale: በዐውዱ ያለውን የአሁንና የቅርብ ጊዜ መሄድ በተፈጥሯዊ አማርኛ ይገልጣል፤ «ምለይ» የሚለውን ተጨማሪ ፍቺ አያስገባም።
- source_word: οἴδατε
  choice: ታውቃላችሁ
  rationale: οἶδα የአሁን ጊዜ ትርጉም ስላለው፣ ለብዙ ሰዎች የተነገረውን «ታውቃላችሁ» በትክክል ይገልጣል።
- source_word: τὴν ὁδόν
  choice: መንገድ
  rationale: «መንገድ» የቃሉን የመንገድ፣ የአቅጣጫ ወይም የመድረሻ ዘዴ ሊሆን የሚችለውን ስፋት ይጠብቃል፣ የሚቀጥለውን ቁጥርም አስቀድሞ አይተረጉምም።
theological_decisions:
- issue: «ወደምሄድበት» ከ«መንገድ» ጋር ያለው ሰዋሰዋዊ ግንኙነትና የሐረጎቹ ቅደም ተከተል
  choice: እኔም ወደምሄድበት መንገድ ታውቃላችሁ።
  alternative: እኔ ወዴት እንደምሄድና መንገዱን ታውቃላችሁ።
  rationale: ዋናው ጽሑፍ ደቀ መዛሙርቱ ኢየሱስ ወደሚሄድበት መንገድ እንደሚያውቁ ይናገራል። የአማርኛው አወቃቀር ይህን ግንኙነት በተፈጥሯዊነት ያሳያል፤ መድረሻውንና መንገዱን ለይቶ እንደሚያውቁ የሚናገረው አማራጭ ግን ሌላ የእጅ ጽሑፍ ንባብ ነው።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «ወደምሄድበት መንገድ» የግሪኩን አጭር አወቃቀር በተፈጥሯዊ አማርኛ ይወክላል።
