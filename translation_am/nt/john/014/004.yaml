    text: አንዳንድ የእጅ ጽሑፎች፣ «እኔም ወዴት እንደምሄድ ታውቃላችሁ፤ መንገዱንም ታውቃላችሁ» ይላሉ።
    reason: textual_variant
  revision_rationale: The revision preserves the main-text reading, in which the disciples are said to know the way in relation to Jesus’ destination, while removing a likely Amharic ambiguity. “ስፍራ የሚያደርሰውን መንገድ” explicates the inherent destination relation of “way” without converting the main text into the alternate reading that says they know both the destination and the way.
