base_translation:
  language: en
  yaml_path: translation/nt/john/014/012.yaml
  text: Truly[a], truly, I say to you, the one who believes in me will also do the works that I do; and he will do greater works than these[b], because I am going to the Father.
translation:
  language: am
  text: እውነት እውነት እላችኋለሁ፤ በእኔ የሚያምን እኔ የማደርጋቸውን ሥራዎች እርሱም[b] ያደርጋል፤ ከእነዚህ የሚበልጡ ሥራዎችንም[a] ያደርጋል፤ ምክንያቱም እኔ ወደ አብ እሄዳለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “ከእነዚህ የሚበልጡትንም።” በግሪኩ ‘ሥራዎች’ የሚለው ቃል ከቀደመው ሐረግ በትርጉም ይሟላል።
    reason: lexical_alternative
  - marker: b
    text: “በእኔ የሚያምን … እርሱ” የሚለው በግሪክ ሰዋስው ተባዕታይ ነጠላ ቅርጽ ያለው ወካይ አገላለጽ ሲሆን፣ በአጠቃላይ ማንኛውንም አማኝ ያመለክታል።
    reason: cultural_note
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: እውነት እውነት
  rationale: የተደገመውን አጽንዖትና የንግግሩን ክብደት በዘመናዊና ግልጽ አማርኛ ያስተላልፋል።
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: በእኔ የሚያምን
  rationale: አንቀጽ ያለውን የአሁን ጊዜ ተሳቢ ግስ እንደ አጠቃላይ ወካይ ነጠላ ያቀርባል፤ πιστεύω εἰς የሚለውንም የዮሐንስ አጠቃቀም በተፈጥሮ ይገልጣል።
- source_word: τὰ ἔργα
  choice: ሥራዎች
  rationale: በዮሐንስ ወንጌል የኢየሱስን ድርጊቶችና ምልክቶች የሚያገናኘውን ቁልፍ ቃል ይጠብቃል።
- source_word: ἃ ἐγὼ ποιῶ
  choice: እኔ የማደርጋቸውን
  rationale: የግሪኩን ቀላል የአሁን ጊዜ አገላለጽ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: κἀκεῖνος ποιήσει
  choice: እርሱም ያደርጋል
  rationale: κἀκεῖνος ያለውን ‘ያም ደግሞ’ የሚል አጽንዖት በ‘-ም’ ይጠብቃል፤ ከቀደመው ποιῶ ጋርም የግሱን ወጥነት ያስቀጥላል።
- source_word: καὶ μείζονα τούτων ποιήσει
  choice: ከእነዚህ የሚበልጡ ሥራዎችንም ያደርጋል
  rationale: μείζονα ገለልተኛ ብዙ ቁጥር ሲሆን፣ ከቀደመው ‘ሥራዎች’ የተወሰደ ስም እንዳለው ይገባል። ስሙን በአማርኛ መድገም ንግግሩን ግልጽና ተፈጥሯዊ ያደርገዋል፤ የግሪኩ አጭር አወቃቀር በማስታወሻ ተጠብቋል።
- source_word: ὅτι
  choice: ምክንያቱም
  rationale: የኢየሱስ ወደ አብ መሄድ ለቀደመው ቃል ምክንያት መሆኑን የሚገልጠውን የምክንያት ኃይል ያሳያል።
- source_word: πρὸς τὸν πατέρα πορεύομαι
  choice: እኔ ወደ አብ እሄዳለሁ
  rationale: በዐውዱ ያለውን ቅርብ የወደፊት ትርጉም በተፈጥሯዊ አማርኛ ያቀርባል፤ የግሪኩን ‘ወደ አብ’ ይጠብቃል እንጂ ‘ወደ አባቴ’ ብሎ አይጨምርም።
theological_decisions:
