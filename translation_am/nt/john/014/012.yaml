  choice: አማኙ ኢየሱስ ከሚያደርጋቸው ሥራዎች የሚበልጡ ሥራዎችን እንደሚያደርግና ይህም ኢየሱስ ወደ አብ ከመሄዱ ጋር እንደተያያዘ ብቻ ተገልጿል።
  alternative: በስፋት የሚበልጡ፣ በቤዛዊ ታሪክ ጠቀሜታ የሚበልጡ፣ ወይም በመንፈስ በተሰጠ የቤተ ክርስቲያን አገልግሎት የሚፈጸሙ ሥራዎች
  rationale: ጥቅሱ ‘የሚበልጡ’ የሚለው በምን አንጻር እንደሆነ አይወስንም። ስለዚህ ትርጉሙ አንድን ሥነ መለኮታዊ ማብራሪያ በጽሑፉ ውስጥ አላስገባም።
