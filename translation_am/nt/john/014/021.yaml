  text: ὁ ἔχων τὰς ἐντολάς μου καὶ τηρῶν αὐτὰς ἐκεῖνός ἐστιν ὁ ἀγαπῶν με· ὁ δὲ ἀγαπῶν με ἀγαπηθήσεται ὑπὸ τοῦ πατρός μου, κἀγὼ ἀγαπήσω αὐτὸν καὶ ἐμφανίσω αὐτῷ ἐμαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/021.yaml
  text: The one who has my commandments and keeps them is the one who loves me[a]. And the one who loves me will be loved by my Father[c][b], and I will love him and reveal myself to him.
translation:
  language: am
  text: ትእዛዞቼን የያዘና የሚጠብቃቸው እርሱ የሚወደኝ ነው። የሚወደኝም በአባቴ ይወደዳል፤ እኔም እወደዋለሁ፣ ራሴንም ለእርሱ እገልጣለሁ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ትእዛዞቼን የያዘና የሚጠብቃቸው ሰው … ያንን ሰው እወደዋለሁ፣ ራሴንም ለዚያ ሰው እገልጣለሁ” ተብሎም ሊተረጎም ይችላል። የግሪኩ ጽሑፍ ወንድ ነጠላ ቅርጾችን በተወካይ አገባብ ይጠቀማል። “ራሴን ለእርሱ አሳያለሁ” የሚል ትርጉምም ይቻላል፤ ግሱ ራስን ማስታወቅን ወይም ማሳየትን ሊያመለክት ይችላል።
    reason: የተወካይ ወንድ ነጠላ ቅርጽንና የἐμφανίζωን አማራጭ ትርጉም ለማብራራት።
lexical_decisions:
- source_word: ὁ ἔχων τὰς ἐντολάς μου
  choice: ትእዛዞቼን የተቀበለ
  rationale: ἔχω በቀጥታ ‘ያለው’ ሊባል ቢችልም፣ ትእዛዝን በተመለከተ በአማርኛ ‘የተቀበለ’ ማለት ትእዛዞቹን ማወቅና እንደ ገዢ ቃል መያዝን በተፈጥሯዊ ሁኔታ ያሳያል፤ ከቀጣዩ τηρῶν ጋርም አይደባለቅም።
- source_word: ἐντολάς
  choice: ትእዛዞቼን
  rationale: ‘ትእዛዝ’ የἐντολήን ሥልጣናዊ ኃይል ይጠብቃል፤ ብዙ ቁጥሩም እንደ ምንጩ ተጠብቋል።
- source_word: τηρῶν
  choice: የሚጠብቃቸው
  rationale: τηρέω በዮሐንስ ትእዛዝን መጠበቅ፣ በታማኝነት መከተልና መፈጸምን ያካትታል። ‘የሚጠብቃቸው’ ይህን ስፋት ከ‘የሚታዘዘው’ ይልቅ ይጠብቃል።
- source_word: ἐκεῖνός ἐστιν ὁ ἀγαπῶν με
  choice: እርሱ የሚወደኝ ነው
  rationale: አጽንዖታዊው ἐκεῖνος ‘እርሱ’ በሚለው ተጠብቋል፤ ሐረጉም ትእዛዞቹን የሚጠብቀውን ከኢየሱስ ወዳጅ ጋር ይለያል እንጂ የሽልማት ምክንያት አያደርገውም።
- source_word: ἀγαπῶν / ἀγαπηθήσεται / ἀγαπήσω
  choice: የሚወደኝ / ይወደዳል / እወደዋለሁ
  rationale: የἀγαπάω ቃል ድግግሞሽ በ‘መውደድ’ ቤተ ቃል ተጠብቋል።
- source_word: ὁ δὲ ἀγαπῶν με
  choice: የሚወደኝም
  rationale: δέ እዚህ ጠንካራ ተቃርኖ ሳይሆን የሐሳብ ቀጣይነት ስለሚያሳይ፣ በአማርኛው አያያዥ ‘-ም’ ተተርጉሟል።
- source_word: ἀγαπηθήσεται ὑπὸ τοῦ πατρός μου
  choice: በአባቴ ይወደዳል
  rationale: የወደፊት ጊዜ ተደራጊ ቅርጹና ‘አባቴ’ የሚለው የዝምድና ቃል በቀጥታ ተጠብቀዋል።
- source_word: κἀγὼ
  choice: እኔም
  rationale: καὶ ἐγώ ያለውን ተጨማሪና አጽንዖታዊ ኃይል ‘እኔም’ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐμφανίσω αὐτῷ ἐμαυτόν
  choice: ራሴንም ለእርሱ እገልጣለሁ
  rationale: ἐμφανίζω ራስን ማሳየትን ወይም ማስታወቅን ሊያመለክት ይችላል። ‘ራሴን … እገልጣለሁ’ አካላዊ መታየትን ብቻ ሳያስገድድ የግል ራስን መግለጥን ይጠብቃል።
theological_decisions:
- issue: በፍቅርና በትእዛዝ መጠበቅ መካከል ያለው ግንኙነት
  choice: ትእዛዞቹን የተቀበለና የሚጠብቀው ሰው ኢየሱስን የሚወድ መሆኑን በመለያ አነጋገር ማቅረብ
