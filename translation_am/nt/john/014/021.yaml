  rationale: የግሪኩ አገባብ መለያን ያቀርባል፤ የዓላማ ወይም የዋጋ አገባብ አይጨምርም። ትርጉሙ ፍቅርና ታማኝ መጠበቅን በጥብቅ ያያይዛል፣ ነገር ግን መለኮታዊ ፍቅር የሚገባ ደመወዝ ነው የሚል ትምህርት አያስገባም።
- issue: የኢየሱስ ራስን መግለጥ ባሕርይ
  choice: ራሴን ለእርሱ እገልጣለሁ
