- issue: ተወካይ ወንድ ነጠላ ቅርጽ
  choice: እርሱ / ለእርሱ የሚሉትን የምንጩን ነጠላ ወንድ ቅርጾች መጠበቅ፣ ተወካይነታቸውን በግርጌ ማብራራት
  alternative: ሁሉም / እነርሱ በሚሉ ብዙ ወይም ጾታ-ገለልተኛ ቅርጾች መተካት
  rationale: የግሪኩ ቅርጾች ወንድ ነጠላ ቢሆኑም ተወካይ ኃይል አላቸው። ዋናው ጽሑፍ የምንጩን ቅርጽ ይጠብቃል፤ ግርጌው ደግሞ ቃሉ ለወንዶች ብቻ እንዳልተገደበ ያብራራል።
