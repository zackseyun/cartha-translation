  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ἐάν τις ἀγαπᾷ με τὸν λόγον μου τηρήσει, καὶ ὁ πατήρ μου ἀγαπήσει αὐτόν, καὶ πρὸς αὐτὸν ἐλευσόμεθα καὶ μονὴν παρ’ αὐτῷ ⸀ποιησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/023.yaml
  text: Jesus answered and said to him[a], “If anyone loves me, he will keep my word, and my Father will love him[b], and we will come to him and make our dwelling with him.”
translation:
  language: am
  text: ኢየሱስም መልሶ እንዲህ አለው፤ “ማንም ቢወደኝ ቃሌን[a] ይጠብቃል፤ አባቴም ይወደዋል። እኛም ወደ እርሱ እንመጣለን፤ ከእርሱም ጋር መኖሪያችንን[b] እናደርጋለን።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ቃሌን” ወይም “የምለውን” ወይም “ትምህርቴን” ሊባልም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “መኖሪያችንን” ወይም “ማደሪያችንን” ወይም “ቤታችንን” ሊባልም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν αὐτῷ
  choice: መልሶ እንዲህ አለው
  rationale: የግሪክኛውን የመመለስና የመናገር ሁለት ግሶች ትርጉም በተፈጥሯዊ የአማርኛ አገላለጽ ያቆያል።
- source_word: Ἐάν τις ἀγαπᾷ με
  choice: ማንም ቢወደኝ
  rationale: ሁኔታዊነቱንና ለማንኛውም ሰው ክፍት የሆነውን አጠቃላይ አመልካች ያሳያል።
- source_word: τὸν λόγον μου
  choice: ቃሌን
  rationale: λόγος እዚህ የኢየሱስን ቃል፣ መልእክት ወይም ትምህርት ያመለክታል፤ “ቃሌን” የዮሐንስን አገላለጽና ሰፊውን የቃሉን ትርጉም ይጠብቃል።
- source_word: τηρήσει
  choice: ይጠብቃል
  rationale: τηρέω ቃሉን መጠበቅ፣ መከተልና መታዘዝን የሚያካትት ስለሆነ “ይጠብቃል” ሰፊ የትርጉም ክልሉን ያቆያል።
- source_word: ὁ πατήρ μου ἀγαπήσει αὐτόν
  choice: አባቴም ይወደዋል
  rationale: የአብን ስያሜና የፍቅርን ግስ በቀጥታና በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: πρὸς αὐτὸν ἐλευσόμεθα
  choice: ወደ እርሱ እንመጣለን
  rationale: πρός የሚገልጠውን ወደ ሰውየው የመቅረብ እንቅስቃሴና የግሪክኛውን የመምጣት ግስ ይጠብቃል።
- source_word: μονὴν παρ’ αὐτῷ ποιησόμεθα
  choice: ከእርሱም ጋር መኖሪያችንን እናደርጋለን
  rationale: μονή የመኖሪያ ወይም የማደሪያ ስፍራን ያመለክታል፤ አገላለጹ የጋራ መገኘትንና “ማድረግ” የሚለውን የግሪክኛ ቅርጽ ሳያጠፋ በግልጽ አማርኛ ያቀርባል።
theological_decisions:
- issue: “እንመጣለን…እናደርጋለን” የሚለው ብዙ ቁጥር ተናጋሪ
  choice: ኢየሱስና አብ በአንድነት ወደ ወዳጁ እንደሚመጡና ከእርሱ ጋር መኖሪያቸውን እንደሚያደርጉ ብዙ ቁጥሩን በግልጽ ማቆየት
  alternative: ብዙ ቁጥሩን በቅጥ ለማለስለስ ወይም የሁለቱን ልዩነት ለማደብዘዝ ነጠላ ወይም ተገብሮ አገላለጽ መጠቀም
  rationale: ἐλευσόμεθα እና ποιησόμεθα በግልጽ የመጀመሪያ ሰው ብዙ ቁጥር ግሶች ናቸው፤ ትርጉሙ የጋራ ድርጊቱንና የተናጋሪዎቹን ልዩነት ያለ ተጨማሪ ዶግማዊ ማብራሪያ ይጠብቃል።
- issue: τις እና αὐτόν የሚገልጡት አጠቃላይ ነጠላ ሰው
  choice: “ማንም” በማለት ሁሉን አቀፍነቱን ማሳየት፣ ከዚያም “ይወደዋል/እርሱ” በሚለው ሰዋሰዋዊ ነጠላ ቅርጽ መቀጠል
  alternative: በሁሉም ሐረጎች ብዙ ቁጥር መጠቀም
  rationale: ግሪክኛው ክፍት የሆነ አጠቃላይ ነጠላ ግንባታ ይጠቀማል፤ አማርኛውም ይህን ወሰንና ቁጥር በተፈጥሯዊ ሁኔታ ያቆያል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “ቃልን መጠበቅ” የሚለው የመጽሐፍ ቅዱስ ዘይቤ የተለመደና ትርጉሙም ግልጽ ስለሆነ ተጠብቋል። የግሪክኛው መደበኛ ሥርዓት እንዲገለጥ የእግር ማስታወሻ ምልክቶቹ ከሚያብራሯቸው “ቃሌን” እና “መኖሪያችንን” ጋር ተያይዘው ተቀምጠዋል።
