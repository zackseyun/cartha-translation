  text: λέγει αὐτῷ Ἰούδας, οὐχ ὁ Ἰσκαριώτης· Κύριε, ⸀τί γέγονεν ὅτι ἡμῖν μέλλεις ἐμφανίζειν σεαυτὸν καὶ οὐχὶ τῷ κόσμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/022.yaml
  text: Judas (not Iscariot) said to him[a], “Lord[b], what has happened that you are going to reveal yourself to us and not to the world?”
translation:
  language: am
  text: አስቆሮቱ ያልሆነው ይሁዳ፣ “ጌታ ሆይ፣ ራስህን ለእኛ ልትገልጥ እንጂ ለዓለም ላትገልጥ ምን ሆኖ ነው?” አለው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: አለው
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ አገላለጽ በዘመናዊ አማርኛ ትረካ በተፈጥሮ ባለፈ ጊዜ ይቀርባል፤ የድርጊቱንም ተቀባይ በ«ው» ያሳያል።
- source_word: Ἰούδας, οὐχ ὁ Ἰσκαριώτης
  choice: አስቆሮቱ ያልሆነው ይሁዳ
  rationale: በግሪኩ ያለውን ከአስቆሮቱ ይሁዳ የሚለየውን ግልጽ ማብራሪያ ያለ ተጨማሪ መለያ ይጠብቃል።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: ቀጥተኛ ጥሪን፣ ክብርንና የማዕረጉን ሥነ መለኮታዊ ክብደት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τί γέγονεν ὅτι
  choice: ምን ሆኖ ነው?
  rationale: ፍጹም ጊዜው የተፈጠረ ሁኔታ አሁን ያለውን ውጤት እንዳመጣ ያመለክታል፤ «ምን ሆኖ ነው?» ይህን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: μέλλεις
  choice: ልትገልጥ
  rationale: የወደፊት ዓላማን ወይም የታቀደ ድርጊትን በአማርኛው የንዑስ አንቀጽ አወቃቀር ያሳያል፤ አፋጣኝነቱን ከመጠን በላይ አያጎላም።
- source_word: ἐμφανίζειν σεαυτόν
  choice: ራስህን … ልትገልጥ
  rationale: ግሱ ራስን ማሳየትን ወይም ማሳወቅን ሊያመለክት ይችላል፤ «ራስህን መግለጥ» የአንጸባራቂውን ኃይል ጠብቆ ሁለቱንም ገጽታዎች ሳይገድብ ያቀርባል።
- source_word: κόσμῳ
  choice: ለዓለም
  rationale: በዮሐንስ ወንጌል ያለውን ሰፊና ሥነ መለኮታዊ ጥልቀት ያለውን ቃል ይጠብቃል፤ «የማያምኑ ሰዎች» ብሎ ትርጉሙን አስቀድሞ አይወስንም።
theological_decisions:
- issue: በዮሐንስ ጽሑፍ ውስጥ የκόσμος ትርጉም
  choice: ዓለም
  alternative: የዓለም ሰዎች፤ ከእግዚአብሔር የራቀው የሰው ሥርዓት
  rationale: በዚህ ስፍራ ቃሉ የሰውን ዘር በአጠቃላይ ወይም እግዚአብሔርን የሚቃወመውን ዓለም ሊያመለክት ይችላል። «ዓለም» ማለት ጽሑፉ ያለውን ሥነ መለኮታዊ ውጥረትና ጥልቀት ሳይፈታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «እንጂ» በἡμῖν … καὶ οὐχὶ τῷ κόσμῳ ያለውን ጠንካራ ንጽጽር በተፈጥሯዊ ሁኔታ ያሳያል። የእንግሊዝኛው የግርጌ ማስታወሻ ምልክቶችና ይዘቶች የማይጣጣሙ ስለሆኑ፣ ከግሪክ ምንጩ የሚያስፈልግ የትርጉም ማስታወሻ አልተጨመረም።
