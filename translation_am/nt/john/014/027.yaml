review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the repeated gift of peace, the contrast with the world's giving, and the paired prohibitions. However, አይፍራም is indicative ('it will not fear') rather than the negative imperative required by μηδὲ δειλιάτω.
  naturalness: The comparison clause in the draft is understandable but syntactically awkward. Reordering it as “ዓለም እንደምትሰጥ እኔ አልሰጣችሁም” is idiomatic modern standard Amharic and retains the Greek contrast.
  terminology: ሰላም and ዓለም appropriately preserve the breadth of εἰρήνη and κόσμος. የእኔን ሰላም is a natural rendering of the emphatic possessive without adding a doctrinal specification. አይፍራ appropriately conveys fear/loss of courage without the moralizing force of ‘ፈሪ’.
  issues:
  - severity: high
    issue: The final verb አይፍራም is not in the required prohibitive/jussive form.
    rationale: μηδὲ δειλιάτω is a present imperative prohibition. In Amharic, አይፍራ (‘let it not fear/be afraid’) preserves the command, whereas አይፍራም normally states a future or habitual negative fact.
  - severity: medium
    issue: The worldly-giving comparison is awkwardly phrased.
    rationale: “እኔ የምሰጣችሁ ዓለም እንደሚሰጥ አይደለም” leaves the comparison structurally strained. A reordered finite clause makes the contrast clear without changing its force.
  revised_text: ሰላምን ትቼላችኋለሁ፤ የእኔን ሰላም እሰጣችኋለሁ። ዓለም እንደምትሰጥ እኔ አልሰጣችሁም። ልባችሁ አይታወክ፤ አይፍራ[a]።
