  text: εἰρήνην ἀφίημι ὑμῖν, εἰρήνην τὴν ἐμὴν δίδωμι ὑμῖν· οὐ καθὼς ὁ κόσμος δίδωσιν ἐγὼ δίδωμι ὑμῖν. μὴ ταρασσέσθω ὑμῶν ἡ καρδία μηδὲ δειλιάτω.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/027.yaml
  text: Peace I leave with you; my peace I give to you. I do not give to you as the world gives. Do not let your heart be troubled[a], nor let it be fearful.
translation:
  language: am
  text: ሰላምን ትቼላችኋለሁ፤ የእኔን ሰላም እሰጣችኋለሁ። ዓለም እንደምትሰጥ እኔ አልሰጣችሁም። ልባችሁ አይታወክ፤ አይፍራ[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ድፍረቱን አያጣ።” የግሪኩ ግስ መፍራትን ወይም ድፍረት ማጣትን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήνην
  choice: ሰላምን
  rationale: የግሪኩን መደበኛና ሰፊ ትርጉም ይጠብቃል፤ በዐውዱ ውስጣዊ ጸጥታን ብቻ ወይም ግጭት አለመኖርን ብቻ ብሎ አያጠብም።
- source_word: ἀφίημι
  choice: ትቼላችኋለሁ
  rationale: ኢየሱስ ለደቀ መዛሙርቱ ሰላምን እንደሚተው በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ‘አወርሳችኋለሁ’ የሚለውን ከመጠን ያለፈ ኑዛዜያዊ ትርጓሜ አያስገባም።
- source_word: τὴν ἐμὴν
  choice: የራሴን
  rationale: በግሪኩ ያለውን አጽንዖት በተፈጥሯዊ አማርኛ ይጠብቃል፤ የኢየሱስን ሰላም ከዓለም ስጦታ ይለያል።
- source_word: δίδωμι
  choice: እሰጣችኋለሁ
  rationale: የአሁን ጊዜውን የመስጠት ተግባርና ከዓለም አሰጣጥ ጋር ያለውን ንጽጽር በግልጽ ይጠብቃል።
- source_word: οὐ καθὼς ὁ κόσμος δίδωσιν
  choice: እኔ የምሰጣችሁ ዓለም እንደሚሰጥ አይደለም
  rationale: የግሪኩን አጽንዖታዊ ንጽጽር ግልጽና ተፈጥሯዊ በሆነ የአማርኛ አገባብ ያቀርባል።
- source_word: κόσμος
  choice: ዓለም
  rationale: በዮሐንስ ወንጌል ያለውን ሰፊ ድምፀት ሳያጠብ የተለመደውን ቀጥተኛ አቻ ይጠቀማል።
- source_word: μὴ ταρασσέσθω
  choice: አይታወክ
  rationale: የልብን መረበሽና መናወጥ ያስተላልፋል፤ ከዮሐንስ 14፥1 ጋርም የቃል ወጥነትን ለመጠበቅ ይረዳል።
- source_word: ὑμῶν ἡ καρδία
  choice: ልባችሁ
  rationale: በግሪኩ ያለውን ከብዙ ባለቤት ጋር የተጠቀሰ ነጠላ ስም በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: μηδὲ δειλιάτω
  choice: አይፍራም
  rationale: δειλιάω የሚያመለክተውን መፍራት ወይም ድፍረት ማጣት በቀላልና ዘመናዊ አማርኛ ያቀርባል፤ ከ‘መታወክ’ የተለየውን ሁለተኛ ትእዛዝ ይጠብቃል።
theological_decisions:
- issue: ኢየሱስ የሚሰጠው ሰላም ባሕርይ
  choice: በዋናው ጽሑፍ ‘ሰላም’ እና ‘የራሴን ሰላም’ ተብሎ በሰፊው ተተርጉሟል።
  alternative: ውስጣዊ ጸጥታ፣ ኪዳናዊ/የፍጻሜ ሙሉነት፣ ወይም ከእግዚአብሔር ጋር እርቅ ብሎ ማብራራት
  rationale: ጥቅሱ ራሱ የሰላሙን ትርጉም ወደ አንድ ገጽታ አያጠብም፤ ስለዚህ ሰፊው መለኮታዊ ድምፀትና ውጥረት ተጠብቋል።
- issue: የδειλιάω ሥነ ምግባራዊ ክብደት
  choice: ‘አይፍራም’ ተብሎ ተተርጉሟል።
  alternative: ‘ፈሪ አይሁን’ ወይም ‘ድፍረቱን አያጣ’
  rationale: ‘ፈሪ’ የሚለው ከጽሑፉ የበለጠ የሥነ ምግባር ውግዘት ሊያስገባ ይችላል፤ ዋናው ንባብ ፍርሃትን ያሳያል፣ የድፍረት ማጣት አማራጭ ግን በማስታወሻ ተጠብቋል።
