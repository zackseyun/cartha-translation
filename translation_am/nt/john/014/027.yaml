  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ነጠላው ‘ልባችሁ’ የግሪኩን የጋራ ነጠላ አገባብ ይጠብቃል፤ የግሶቹ ነጠላ ቅርጽም ከእርሱ ጋር ተስማምቷል።
