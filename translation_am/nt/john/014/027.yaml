  to: ሰላምን ትቼላችኋለሁ፤ የእኔን ሰላም እሰጣችኋለሁ። ዓለም እንደምትሰጥ እኔ አልሰጣችሁም። ልባችሁ አይታወክ፤ አይፍራ[a]።
