  text: ἐξῆλθεν οὖν ὁ Πιλᾶτος ⸀ἔξω πρὸς αὐτοὺς καὶ ⸀φησίν· Τίνα κατηγορίαν φέρετε ⸀κατὰ τοῦ ἀνθρώπου τούτου;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/029.yaml
  text: So Pilate went outside to them and said, “What accusation do you bring against this man?”
translation:
  language: am
  text: ስለዚህ ጲላጦስ ወደ ውጭ ወጥቶ ወደ እነርሱ ሄደ፤ እንዲህም አላቸው፦ “በዚህ ሰው ላይ የምታቀርቡት ክስ ምንድን ነው?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν … ἔξω
  choice: ወደ ውጭ ወጥቶ
  rationale: ἐξέρχομαι ከውስጥ ወደ ውጭ መንቀሳቀስን ያመለክታል፤ ἔξωም ይህንኑ የቦታ አቅጣጫ ያጠናክራል። የአማርኛው አገላለጽ ሁለቱንም በተፈጥሯዊ መንገድ ይወክላል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: በቀደመው ትረካ ምክንያት የተከተለውን እርምጃ የሚያገናኝ የውጤትና የትረካ ቅደም ተከተል አመልካች ነው።
- source_word: πρὸς αὐτούς
  choice: ወደ እነርሱ
  rationale: πρός ከተሳቢ ጋር ወደ ሰዎች መቅረብን ወይም መንቀሳቀስን ያሳያል።
- source_word: φησίν
  choice: አላቸው
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ ግስ በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜ ሆኖ ተተርጉሟል፤ ብዙ ተቀባዮችንም ያመለክታል።
- source_word: Τίνα κατηγορίαν
  choice: ክስ ምንድን ነው?
  rationale: κατηγορία በዚህ ዐውድ ሕጋዊ ክስን ያመለክታል፤ “ክስ” አጭር፣ ዘመናዊና የፍርድ ዐውዱን የሚጠብቅ ቃል ነው።
- source_word: φέρετε
  choice: የምታቀርቡት
  rationale: በሕጋዊ አጠቃቀም φέρω ክስን ማምጣት ወይም ማቅረብ ማለት ነው፤ “ማቅረብ” በአማርኛ ከ“ክስ” ጋር ተፈጥሯዊ ነው።
- source_word: κατὰ τοῦ ἀνθρώπου τούτου
  choice: በዚህ ሰው ላይ
  rationale: κατά ከዝርያ ቅጽ ጋር በፍርድ ዐውድ “በ…ላይ/በ…ላይ የቀረበ” የሚል ተቃራኒ አቅጣጫ አለው፤ ἄνθρωπος እዚህ የተወሰነውን ወንድ ሰው ያመለክታል።
