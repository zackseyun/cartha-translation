  text: ⸀ἀπεκρίθη Ἰησοῦς· ⸂Ἀπὸ σεαυτοῦ⸃ σὺ τοῦτο λέγεις ἢ ἄλλοι ⸂εἶπόν σοι⸃ περὶ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/034.yaml
  text: Jesus answered[a], “Are you saying this on your own, or did others tell you about me?”
translation:
  language: am
  text: ኢየሱስም መልሶ፣ “አንተ ይህን ከራስህ[a] ነው የምትለው ወይስ ሌሎች ስለ እኔ ነገሩህ?” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በራስህ።” ግሪክኛው ቃል በቃል “ከራስህ” ይላል፤ ጥያቄው ይህ ጥያቄ በግል ከጲላጦስ የመነጨ መሆኑን ይጠይቃል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: መልሶ … አለው
  rationale: በወንጌላዊ ትረካ ውስጥ ለጥያቄ የተሰጠን ምላሽ በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: Ἀπὸ σεαυτοῦ
  choice: ከራስህ
  rationale: ἀπό የምንጭን ወይም የመነሻን ሐሳብ ስለሚያመለክት፣ የጲላጦስ ንግግር ከራሱ የመነጨ መሆኑን ይጠይቃል፤ ይህ አገላለጽም ያንን ምስል ጠብቆ በአማርኛ ግልጽ ነው።
- source_word: σὺ
  choice: አንተ
  rationale: በግሪክኛው በግልጽ የተጠቀሰውንና አጽንዖት ያለውን ተውላጠ ስም ይጠብቃል።
- source_word: τοῦτο
  choice: ይህን
  rationale: ጲላጦስ ቀደም ሲል የጠየቀውን ጥያቄ በቀጥታ ያመለክታል።
- source_word: λέγεις
  choice: የምትለው
  rationale: በወቅቱ እየተካሄደ ያለውን ንግግር በተፈጥሯዊ የአማርኛ ጥያቄ አወቃቀር ያቀርባል።
- source_word: ἢ
  choice: ወይስ
  rationale: በጥያቄ ውስጥ ሁለት አማራጮችን ለማነጻጸር የሚመች የአማርኛ አያያዥ ነው።
- source_word: ἄλλοι
  choice: ሌሎች
  rationale: ከጲላጦስ በቀር ያሉ ሰዎችን አጭርና ግልጽ በሆነ መንገድ ያመለክታል።
- source_word: εἶπόν σοι
  choice: ነገሩህ
  rationale: የግሪክኛውን ቀላል ያለፈ ድርጊት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: περὶ ἐμοῦ
  choice: ስለ እኔ
  rationale: περί ከወራጅ ቅጽ ጋር ያለውን “ስለ/በተመለከተ” ትርጉም በግልጽ ዘመናዊ አማርኛ ይሰጣል።
theological_decisions:
- issue: የኢየሱስ ጥያቄ ኃይል
  choice: ጥያቄውን የጲላጦስ ንግግር ከራሱ የመነጨ ነው ወይስ ከሌሎች የሰማው ነው በሚል የምንጭ ጥያቄ መተርጎም
  alternative: “ይህን የምትጠይቀው በራስህ ተነሳሽነት ነውን?” ብሎ የውስጥ ዓላማውን በበለጠ ትርጓሜያዊ ሁኔታ ማቅረብ
  rationale: ግሪክኛው በቀጥታ የሚያተኩረው በንግግሩ ምንጭ ላይ ነው፤ ትርጉሙ የጲላጦስን ዓላማ ወይም ሥነ መለኮታዊ አንድምታ አስቀድሞ አይወስንም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። “ከራስህ” የግሪክኛውን የምንጭ ምስል ሲጠብቅ፣ “አንተ” የሚለው ደግሞ የσὺን አጽንዖት ያሳያል።
