base_translation:
  language: en
  yaml_path: translation/nt/john/018/018.yaml
  text: The servants and the officers were standing there[a], having made a charcoal fire because it was cold, and they were warming themselves[b]. Peter also was standing with them and warming himself.
translation:
  language: am
  text: ባሪያዎቹ[a]ና ጠባቂዎቹ[b]፣ ብርድ ስለነበር የከሰል እሳት አንድደው፣ ቆመው ይሞቁ ነበር። ጴጥሮስም ከእነርሱ ጋር ቆሞ ይሞቅ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “አገልጋዮች” ተብሎም ሊተረጎም ይችላል፤ እዚህ “ባሪያዎች” የተባለው የቤቱ ሠራተኞች በባርነት ሥር የነበሩ መሆናቸውን ለማስጠበቅ ነው።
    reason: lexical_alternative
  - marker: b
    text: “ሥልጣናዊ አገልጋዮች” ተብሎም ሊተረጎም ይችላል፤ ቃሉ ምናልባት ከቤተ መቅደሱ ወይም ከሊቀ ካህናቱ አስተዳደር ጋር የተያያዙ ባለሥልጣን አገልጋዮችን ያመለክታል።
    reason: lexical_alternative
