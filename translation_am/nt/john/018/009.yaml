id: JHN.18.9
reference: John 18:9
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἵνα πληρωθῇ ὁ λόγος ὃν εἶπεν ὅτι Οὓς δέδωκάς μοι οὐκ ἀπώλεσα ἐξ αὐτῶν οὐδένα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/009.yaml
  text: 'so that the word that he had spoken might be fulfilled: “Of those whom you have given me[a], I lost not one.”'
translation:
  language: am
  text: ይህ የሆነው፣ እርሱ፣ “ከሰጠኸኝ መካከል አንድም አላጣሁም” ብሎ የተናገረው ቃል እንዲፈጸም ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: እንዲፈጸም
  rationale: የዓላማንና የውጤትን ግንኙነት በተፈጥሯዊ የአማርኛ የንዑስ አረፍተ ነገር አወቃቀር ያሳያል።
- source_word: πληρωθῇ
  choice: እንዲፈጸም
  rationale: የተነገረው ቃል በክስተቱ እውን መሆኑን ያሳያል፤ በዮሐንስ የፍጻሜ አገላለጽንም ይጠብቃል።
- source_word: ὁ λόγος ὃν εἶπεν
  choice: እርሱ … ብሎ የተናገረው ቃል
  rationale: λόγος በዚህ ስፍራ የኢየሱስን የቀድሞ ንግግር እንጂ እንደ መጠሪያ የሚያገለግለውን ‘ቃል’ አያመለክትም።
- source_word: Οὓς δέδωκάς μοι
  choice: ከሰጠኸኝ ሰዎች
  rationale: የግሪኩን ፍጹም ጊዜ ውጤታዊ ሁኔታ በአማርኛው ‘ሰጠኸኝ’ በተፈጥሯዊነት ያቀርባል፤ ብዙ ቁጥር ያለውን አንጻራዊ ሐረግም ግልጽ ያደርጋል።
- source_word: ἀπώλεσα
  choice: አላጣሁም
  rationale: በአውዱ የተሰጡትን ደቀ መዛሙርት ከእንክብካቤው ማጣትን ያመለክታል፤ ‘አጠፋሁ’ የሚለውን ንቁ የማጥፋት ትርጉም አያስገባም።
- source_word: ἐξ αὐτῶν οὐδένα
  choice: አንድም
  rationale: ‘ከእነርሱ አንድም’ የሚለውን አጽንዖት አጭርና ተፈጥሯዊ በሆነ አማርኛ ይጠብቃል።
theological_decisions:
- issue: የፍጻሜ ቋንቋ ባሕርይ
  choice: የኢየሱስ ቀድሞ የተናገረው ቃል ‘እንዲፈጸም’ ተብሎ ተተርጉሟል።
  alternative: ‘እውን እንዲሆን’ ወይም ‘እንዲደርስ’
  rationale: ጽሑፉ የኢየሱስን ንግግር መፈጸም ይናገራል፤ ይህንን የመለኮታዊ ዓላማና የትረካ እውንነት ክብደት ይጠብቃል፣ ነገር ግን ከጽሑፉ በላይ መደበኛ የትንቢት ቀመር አያስገባም።
- issue: ἀπώλεσα ስለ ደቀ መዛሙርቱ ያለው ትርጉም
  choice: ‘አላጣሁም’
  alternative: ‘አንዳቸውንም አላጠፋሁም’ ወይም ‘አንዳቸውም እንዲጠፋ አልተውኩም’
  rationale: የቅርብ አውዱ ኢየሱስ በእስር ጊዜ ደቀ መዛሙርቱን መጠበቁን ያሳያል፣ ከዮሐንስ 17፥12 ጋርም ይስማማል። ‘አላጣሁም’ የጥበቃውን ሐሳብና የዮሐንስን ሥነ መለኮታዊ ውጥረት ያለ አንድ የእምነት ሥርዓት ገደብ ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ይጠቀማል። የግሪኩ ክፍላዊ አገላለጽ ‘ከ… አንድም’ በዋናው ጽሑፍ በግልጽ ስለተወከለ የእንግሊዝኛው አማራጭ የአነጋገር ማስታወሻ በአማርኛ አላስፈለገም።
