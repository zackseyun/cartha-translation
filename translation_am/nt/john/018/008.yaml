- source_word: ἐγώ εἰμι
  choice: እኔ ነኝ
  rationale: ሐረጉ በዚህ አውድ የማንነት መግለጫ ሲሆን፣ አማርኛው የግሪኩን አጭርነትና ሊኖረው የሚችለውን ሰፊ የሥነ መለኮት ጭብጥ ሳይደመስስ ተፈጥሯዊ ነው።
- source_word: ζητεῖτε
  choice: የምትፈልጉ
  rationale: በዚህ የፍለጋና የእስር አውድ ζητέωን በግልጽና ተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἄφετε … ὑπάγειν
  choice: ይሂዱ ተዉአቸው
  rationale: እነርሱ እንዲሄዱ መፍቀድን ይገልጻል፤ ‘ልቀቋቸው’ የሚለው ገና በእስር እንደያዟቸው ከግሪኩ በላይ ሊወስን ስለሚችል አልተመረጠም።
- source_word: τούτους
  choice: እነዚህን
  rationale: በቅርብ ያሉትን የኢየሱስ ተከታዮች የሚያመለክተውን ጠቋሚ ቃል ያለ አላስፈላጊ ጭማሪ ይጠብቃል።
