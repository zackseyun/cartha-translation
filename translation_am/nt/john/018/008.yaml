  text: Jesus answered[a], “I told you that I am he. So if you are seeking me, let these men go.”
translation:
  language: am
  text: ኢየሱስም መልሶ፣ “እኔ ነኝ ብዬ ነግሬአችኋለሁ። እንግዲህ እኔን የምትፈልጉ ከሆነ፣ እነዚህ እንዲሄዱ ፍቀዱላቸው።” አለ።
