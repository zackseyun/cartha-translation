lexical_decisions:
- source_word: ἀπεκρίθη
  choice: መልሶ … አለ
  rationale: በትረካዊ ውይይት ውስጥ ἀποκρίνομαιን በተፈጥሯዊና በክብር የሚገልጽ የአማርኛ አገላለጽ ነው።
- source_word: Εἶπον ὑμῖν
  choice: ነግሬአችኋለሁ
