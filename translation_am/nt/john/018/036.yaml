  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የዓለም፣ የመንግሥትና የምንጭ ተደጋጋሚ ቃላት የግሪኩን አጽንዖት ለመጠበቅ እንዳሉ ተደግመዋል።
