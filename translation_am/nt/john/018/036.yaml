source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Ἡ βασιλεία ἡ ἐμὴ οὐκ ἔστιν ἐκ τοῦ κόσμου τούτου· εἰ ἐκ τοῦ κόσμου τούτου ἦν ἡ βασιλεία ἡ ἐμή, οἱ ὑπηρέται ⸂οἱ ἐμοὶ ἠγωνίζοντο ἄν⸃, ἵνα μὴ παραδοθῶ τοῖς Ἰουδαίοις· νῦν δὲ ἡ βασιλεία ἡ ἐμὴ οὐκ ἔστιν ἐντεῦθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/036.yaml
  text: Jesus answered[a], “My kingdom is not from this world. If my kingdom were from this world, my servants would be fighting so that I might not be handed over to the Jews. But as it is, my kingdom is not from here.”
translation:
  language: am
  text: ኢየሱስም እንዲህ ሲል መለሰ፤ “መንግሥቴ ከዚህ ዓለም አይደለችም። መንግሥቴ ከዚህ ዓለም ብትሆን ኖሮ፣ ለአይሁድ[a] አሳልፈው እንዳይሰጡኝ አገልጋዮቼ ይዋጉ ነበር። አሁን ግን መንግሥቴ ከዚህ አይደለችም።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ለይሁዳውያን።” በዚህ አውድ በተለይ የይሁዳ ባለሥልጣናትን ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: βασιλεία
  choice: መንግሥት
  rationale: በንጉሣዊው አውድ ውስጥ ግዛትንም ሆነ ንጉሣዊ አገዛዝን ሊያመለክት የሚችል፣ የተለመደና ተፈጥሯዊ አማርኛ ነው።
- source_word: ἐκ τοῦ κόσμου τούτου
  choice: ከዚህ ዓለም
  rationale: ἐκ የመነሻንና የምንጭን ሐሳብ ስለሚያጎላ፣ መንግሥቱ መገኘቱን ሳይክድ ምንጩ ይህ ዓለም እንዳልሆነ ያስተላልፋል።
- source_word: κόσμος
  choice: ዓለም
  rationale: የዮሐንስን ሰፊ የቃል አጠቃቀም ሳያጠብ ቀጥተኛና ግልጽ ትርጉም ይሰጣል።
- source_word: ὑπηρέται
  choice: አገልጋዮች
  rationale: በሥልጣን ሥር ያሉትን ሰዎች ይገልጣል፤ በንጉሣዊው አውድ ተስማሚ ሲሆን ቃሉን በግድ የፖሊስ ወይም የባለሥልጣን ሚና አያሰጠውም።
- source_word: ἠγωνίζοντο ἄν
  choice: ይዋጉ ነበር
  rationale: ከእውነታ ተቃራኒ በሆነው መላምታዊ ሁኔታ ውስጥ ቀጣይ ትግልን የሚያሳየውን የግሪክ አገባብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἵνα μὴ παραδοθῶ
  choice: አሳልፈው እንዳይሰጡኝ
  rationale: የዓላማውን አንቀጽና παραδίδωμι ያለውን በሌላ እጅ አሳልፎ የመስጠት ፍቺ በዘመናዊና ግልጽ አማርኛ ይጠብቃል።
- source_word: τοῖς Ἰουδαίοις
  choice: ለአይሁድ
  rationale: የግሪኩን ሰፊ የቃል ፍቺ በዋናው ጽሑፍ ይጠብቃል፤ በዚህ አውድ የይሁዳን ሰዎች ወይም በተለይ የአይሁድን ባለሥልጣናት ሊያመለክት መቻሉ በማስታወሻ ተገልጿል።
- source_word: νῦν δὲ
  choice: አሁን ግን
  rationale: ከቀደመው መላምታዊ ሁኔታ ጋር በማነጻጸር እውነተኛውን ሁኔታ የሚያስተዋውቅ ቀጥተኛና ተፈጥሯዊ አገላለጽ ነው።
- source_word: ἐντεῦθεν
  choice: ከዚህ
  rationale: የቦታ ወይም የምንጭ አመልካች የሆነውን ‘ከዚህ’ የሚለውን አጭር ድምዳሜ ይጠብቃል።
theological_decisions:
- issue: የኢየሱስ መንግሥት ከዓለም ጋር ያለው ግንኙነት
  choice: “ከዚህ ዓለም አይደለችም” ተብሎ የምንጭ ወይም የመነሻ ሐሳብ ተጠብቋል።
  alternative: “የዚህ ዓለም አይደለችም” ወይም “የዚህ ዓለም ክፍል አይደለችም”
  rationale: ጥቅሱ በዋነኝነት የመንግሥቱን ምንጭና ባሕርይ ይናገራል፤ በዓለም ውስጥ መገኘቱን አይክድም። ይህ አተረጓጎሙን ያለምክንያት ወደ ዓለማዊ ጉዳዮች ፈጽሞ መራቅ አያጠብበውም።
- issue: በዮሐንስ ወንጌል Ἰουδαῖοι የሚያመለክተው
  choice: በዋናው ጽሑፍ “አይሁድ” ተብሎ፣ የአውዱ ጠባብ አማራጭ በማስታወሻ ቀርቧል።
  alternative: “የይሁዳ ሰዎች” ወይም “የአይሁድ ባለሥልጣናት”
  rationale: ዋናው ጽሑፍ የግሪኩን ሰፊ ትርጉም ይጠብቃል፤ አውዱ ግን ቃሉ በተለይ በይሁዳ ያሉትን ባለሥልጣናት ሊያመለክት እንደሚችል ስለሚያሳይ ይህ አማራጭ በማስታወሻ ተጠብቋል።
