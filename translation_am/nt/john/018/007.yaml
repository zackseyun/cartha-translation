  rationale: ዋናው ጽሑፍ የግሪክኛውን የመለያ ቅጽል በቅርብ ይጠብቃል፤ በቦታ አመልካች ሐረግ የሚቀርበው የተለመደ አማራጭ ግን በማስታወሻ ተጠብቋል። ስያሜው ታሪካዊና መዝገበ ቃላዊ መለያ እንጂ ተጨማሪ የእምነት አቋም አይጫንበትም።
