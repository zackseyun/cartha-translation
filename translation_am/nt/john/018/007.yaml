- source_word: Τίνα ζητεῖτε
  choice: ማንን ትፈልጋላችሁ?
  rationale: Τίνα ተሳቢ መሆኑን “ማንን” ይጠብቃል፤ ζητεῖτε የአሁኑን ፍለጋ በግልጽ አማርኛ ይገልጣል።
- source_word: οἱ δὲ εἶπαν
  choice: እነርሱም … አሉት
  rationale: δέን እንደ ቀላል የትረካ ሽግግር በ“-ም” ያሳያል፤ በአማርኛ ተፈጥሯዊ የሆነውን የንግግር አቀራረብ ይከተላል።
- source_word: Ἰησοῦν τὸν Ναζωραῖον
