base_translation:
  language: en
  yaml_path: translation/nt/john/018/035.yaml
  text: Pilate answered[a], “I am not a Jew, am I? Your own nation and the chief priests handed you over to me. What have you done?”
translation:
  language: am
  text: ጲላጦስም እንዲህ ሲል መለሰ፤ “እኔ አይሁዳዊ[a] አይደለሁም አይደል? የገዛ ሕዝብህና የካህናት አለቆች ለእኔ አሳልፈው ሰጡህ። ምን አደረግህ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እኔ የይሁዳ ሰው አይደለሁም አይደል?” የግሪኩ ቃል እንደ አውዱ “አይሁዳዊ” የሚለውን የብሔር/የሃይማኖት ማንነት ወይም “የይሁዳ ሰው” የሚለውን ክልላዊ ማንነት ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
