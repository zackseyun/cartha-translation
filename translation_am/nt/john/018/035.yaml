  rationale: ሰውን ለሥልጣን አካል አሳልፎ የመስጠትን የፍርድ አውድ ያስቀምጣል፤ “ከዱህ” የሚለውን ተጨማሪ ሥነ ምግባራዊ ፍርድ አያስገባም።
