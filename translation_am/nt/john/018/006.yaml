  text: እንግዲህ እርሱ፣ «እኔ ነኝ»[a] ባላቸው ጊዜ፣ ወደ ኋላ ሄዱ፤ መሬት ላይም ወደቁ።
  philosophy: optimal-equivalence
  footnotes:
