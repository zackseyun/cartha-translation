id: JHN.18.32
reference: John 18:32
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἵνα ὁ λόγος τοῦ Ἰησοῦ πληρωθῇ ὃν εἶπεν σημαίνων ποίῳ θανάτῳ ἤμελλεν ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/032.yaml
  text: so that the word of Jesus would be fulfilled[a], which he had spoken[c][b], indicating by what kind of death he was about to die.
translation:
  language: am
  text: ይህም ኢየሱስ በምን ዓይነት ሞት ሊሞት እንደነበር አመልክቶ የተናገረው ቃል[a] እንዲፈጸም ነበር።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «አባባል»።
    reason: lexical_alternative
  - marker: b
    text: ኢየሱስ የሚሞትበትን የሞት ዓይነት አመልክቶ ነበር፤ ይህም ስቅለትን የሚጠቁም ይመስላል። ዮሐንስ 12፥32–33ን ያነጻጽሩ።
    reason: cross_reference
lexical_decisions:
- source_word: ἵνα
  choice: እንዲፈጸም ነበር
  rationale: የዓላማን ወይም የውጤትን ግንኙነት በተፈጥሯዊ የአማርኛ አገባብ ያሳያል።
- source_word: ὁ λόγος τοῦ Ἰησοῦ
  choice: ኢየሱስ ... የተናገረው ቃል
  rationale: λόγος እዚህ የኢየሱስን የተነገረ ንግግር ወይም አባባል ያመለክታል፤ የዮሐንስ 1፥1 ማዕረግን አያመለክትም።
- source_word: πληρωθῇ
  choice: እንዲፈጸም
  rationale: በዮሐንስ ወንጌል ያለውን የፍጻሜ ቃላዊና ሥነ መለኮታዊ ክብደት ይጠብቃል።
- source_word: ὃν εἶπεν σημαίνων
  choice: ሲያመለክት የተናገረው
  rationale: σημαίνων ከεἶπεν ጋር ያለውን የአንድ ጊዜ ተጓዳኝ ድርጊት በተፈጥሯዊ አማርኛ ይገልጣል፤ ንግግሩ የሞቱን ዓይነት እንዳመለከተ ያሳያል።
- source_word: ποίῳ θανάτῳ
  choice: በምን ዓይነት ሞት
  rationale: ποίῳ የሞቱን እውነታ ብቻ ሳይሆን ዓይነቱን ወይም አፈጻጸሙን እንደሚጠይቅ ይጠብቃል።
- source_word: ἤμελλεν ἀποθνῄσκειν
  choice: ሊሞት እንደነበረ
  rationale: ወደፊት ሊፈጸም የነበረውን ሞት ያሳያል፤ በግሪኩ ከተገለጠው በላይ የዕጣ ፈንታ ወይም የግድ ትርጉም አያስገባም።
theological_decisions:
- issue: የኢየሱስ ቀደምት ንግግር መፈጸም
  choice: «ቃል ... እንዲፈጸም» የሚለውን ግልጽ የፍጻሜ ቋንቋ መጠበቅ
  alternative: «ኢየሱስ ያለው እውን እንዲሆን»
  rationale: πληρωθῇ በዮሐንስ ውስጥ ክብደት ያለውን የፍጻሜ ሐሳብ ይይዛል፤ ቀለል ያለው አማራጭ ይህን ጭብጥ ያዳክማል።
- issue: μέλλω እና የኢየሱስ ሞት
  choice: «ሊሞት እንደነበረ»
  alternative: «ለመሞት እንደተወሰነለት»
  rationale: ጽሑፉ ወደፊት ስለሚሆነው ሞት ይናገራል፤ በዚህ ሐረግ ውስጥ የግድ አስቀድሞ መወሰንን ማስገባት አያስፈልግም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የግሪኩን የፍጻሜ ቋንቋና በሞቱ ዓይነት ላይ ያለውን አጽንዖት ይጠብቃል።
