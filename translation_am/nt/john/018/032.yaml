  terminology: «ቃል» appropriately represents λόγος here without importing the Johannine title of John 1:1. «እንዲፈጸም» preserves the fulfillment idiom, and «በምን ዓይነት ሞት» accurately expresses ποίῳ θανάτῳ. The footnote should avoid presenting crucifixion as more than an interpretive contextual identification.
