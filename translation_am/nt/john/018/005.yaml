base_translation:
  language: en
  yaml_path: translation/nt/john/018/005.yaml
  text: They answered him, “Jesus the Nazarene.” He said to them, “I am he.” Now Judas, who was betraying him, was also standing with them.
translation:
  language: am
  text: እነርሱም፣ “የናዝሬቱን ኢየሱስ” ብለው መለሱለት። እርሱም፣ “እኔ ነኝ” አላቸው። አሳልፎ የሚሰጠው ይሁዳም ከእነርሱ ጋር ቆሞ ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: የናዝሬቱን ኢየሱስ
  rationale: የግሪኩን የመድረሻ ቅርጽ እና ናዝሬትን የሚያመለክተውን መጠሪያ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: Ἐγώ εἰμι
  choice: እኔ ነኝ
  rationale: አጭሩን እና አጽንዖት ያለውን የግሪክ አገላለጽ ይጠብቃል፤ በአውዱም ‘የምትፈልጉት እኔ ነኝ’ የሚል ተፈጥሯዊ ትርጉም አለው።
- source_word: ὁ παραδιδοὺς αὐτὸν
  choice: አሳልፎ የሚሰጠው
  rationale: የአሁን ጊዜ ክፍለ አንቀጹን ይጠብቃል፣ ድርጊቱም በሂደት ላይ መሆኑን ያሳያል።
- source_word: εἱστήκει
  choice: ቆሞ ነበር
  rationale: የግሪኩን ቀደም ብሎ የተፈጸመና የቀጠለ የመቆም ሁኔታ በተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: Ἐγώ εἰμι የሚለው አገላለጽ ትርጉም
  choice: እኔ ነኝ
  alternative: እኔው ነኝ / እኔ እርሱ ነኝ
  rationale: ምንጩ ተሳቢ ስም ሳይጨምር የቀረበ በመሆኑ፣ አጭርነቱንና በዮሐንስ ወንጌል ውስጥ ሊኖረው የሚችለውን ሰፊ አስተጋባ ይጠብቃል፤ አውዱ ግን የማንነት መግለጫ መሆኑን ግልጽ ያደርጋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። የንግግር ቅደም ተከተሉና የይሁዳ ከተቃዋሚዎቹ ጋር መቆም በግልጽ ተጠብቀዋል።
