- source_word: Τί ἐστιν ἀλήθεια;
  choice: እውነት ምንድን ነው?
  rationale: ἀλήθεια ያለ መስተዋድድ በአጠቃላይ ‘እውነት’ ይላል፤ ጥያቄውን ሳያጠብ ቀጥተኛና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: Καὶ τοῦτο εἰπὼν
  choice: ይህን ካለ በኋላ
  rationale: የአኦሪስት አጋዥ ግስ የድርጊቶቹን ቅደም ተከተል በግልጽና ተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: πάλιν ἐξῆλθεν
  choice: እንደገና … ወጥቶ
  rationale: πάλιν የድርጊቱን መደገም፣ ἐξῆλθεν ደግሞ ከውስጥ ወደ ውጭ መውጣትን ይገልጣሉ።
- source_word: πρὸς τοὺς Ἰουδαίους
  choice: ወደ አይሁድ[a]
  rationale: ዋናው ጽሑፍ የἸουδαίουςን ቀጥተኛ የቃል ዋጋ ይጠብቃል፤ በዚህ ዐውደ ንባብ ቃሉ በተለይ የአይሁድ መሪዎችን ወይም ኢየሱስን የሚከሱትን ወካይ ቡድን ሊያመለክት እንደሚችል የግርጌ ማስታወሻው ያብራራል።
- source_word: Ἐγὼ οὐδεμίαν εὑρίσκω ἐν αὐτῷ αἰτίαν
  choice: እኔ በእርሱ ላይ አንዳችም የክስ ምክንያት አላገኘሁም
  rationale: αἰτία በፍርድ ዐውድ የክስ መሠረትን ወይም ምክንያትን ያመለክታል፤ ‘የክስ ምክንያት’ ሕጋዊ ትርጉሙን ከጠበቀ በአማርኛም ግልጽ ነው። ‘እኔ’ የሚለው የἘγώን አጽንዖት ይጠብቃል።
