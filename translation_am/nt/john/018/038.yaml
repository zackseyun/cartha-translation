  yaml_path: translation/nt/john/018/038.yaml
  text: Pilate said to him[a], “What is truth?” After saying this, he went out again to the Jews and said to them, “I find no case against him.”
translation:
  language: am
  text: ጲላጦስም፣ “እውነት ምንድን ነው?” አለው። ይህን ካለ በኋላ እንደገና ወደ አይሁድ[a] ወጥቶ፣ “እኔ በእርሱ ላይ ምንም የክስ ምክንያት አላገኘሁበትም” አላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወደ አይሁድ መሪዎች።” በዮሐንስ ወንጌል “አይሁድ” የሚለው ቃል አንዳንድ ጊዜ በተለይ የይሁዳን ባለሥልጣናት ወይም በዚያው ዐውድ ኢየሱስን የሚቃወመውን ወካይ ቡድን ሊያመለክት ይችላል።
