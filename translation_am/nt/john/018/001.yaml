  choice: እርሱና ደቀ መዛሙርቱም ወደዚያ ገቡ
  rationale: εἰς የሚያሳየውን ወደ ውስጥ የሚደረግ እንቅስቃሴ በ«ወደዚያ ገቡ» ይጠብቃል፤ αὐτόςም ያለ አላስፈላጊ አጽንዖ «እርሱ» ተብሏል።
