    text: ወይም፣ «የቄድሮንን ዥረት ተሻገረ» ወይም «ከቄድሮን ወንዝ ማዶ ሄደ»። የግሪክኛው ቃል በወቅታዊ ዝናብ ውኃ የሚፈስበትን ዥረት ወይም ሸለቆ ያመለክታል።
