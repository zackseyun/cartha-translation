  text: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Εἰ μὴ ἦν οὗτος ⸂κακὸν ποιῶν⸃, οὐκ ἄν σοι παρεδώκαμεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/030.yaml
  text: They answered and said to him[a], “If this man were not an evildoer, we would not have handed him over to you.”
translation:
  language: am
  text: እነርሱም መልሰው፣ “ይህ ሰው ክፉ ነገር የሚያደርግ[a] ባይሆን ኖሮ፣ ለአንተ አሳልፈን ባልሰጠነው ነበር” አሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ክፉ አድራጊ።”
    reason: κακὸν ποιῶν የሚለው የግሪክ ሐረግ እንደ ድርጊት ገለጻም ሆነ እንደ ሰውየው መጠሪያ ሊተረጎም ይችላል።
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: እነርሱም መልሰው … አሉት
  rationale: የግሪኩን ድርብ የትረካ አገላለጽ በተፈጥሯዊ አማርኛ ያቀርባል፤ “መልሰው” የመመለስን፣ “አሉት” ደግሞ የመናገርንና ተቀባዩ ጲላጦስ መሆኑን ያሳያል።
- source_word: Εἰ μὴ ἦν
  choice: ባይሆን ኖሮ
  rationale: ከእውነታው ተቃራኒ የሆነውን ሁኔታዊ አነጋገር በግልጽና ተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: οὗτος
  choice: ይህ ሰው
  rationale: ኢየሱስን የሚያመለክተውን ጠቋሚ ቃልና በከሳሾቹ ንግግር ያለውን ርቀት ያለ ተጨማሪ ንቀት ይጠብቃል።
- source_word: κακὸν ποιῶν
  choice: ክፉ ነገር የሚያደርግ
  rationale: ποιῶν ያለውን የድርጊት ኃይል ይጠብቃል፤ ሐረጉን እንደ የተወሰነ ሕጋዊ ክስ ወይም ቋሚ መጠሪያ አያቀርበውም።
- source_word: οὐκ ἄν σοι παρεδώκαμεν αὐτόν
  choice: ለአንተ አሳልፈን ባልሰጠነው ነበር
  rationale: ከእውነታው ተቃራኒ የሆነውን ውጤት ይገልጻል፤ “አሳልፈን ሰጠን” ደግሞ παραδίδωμι በዚህ የፍርድ አውድ ያለውን ትርጉም ያስተላልፋል።
theological_decisions:
- issue: ከሳሾቹ ስለ ኢየሱስ ያቀረቡት ክስ ኃይልና ስፋት
  choice: “ክፉ ነገር የሚያደርግ” በማለት አጠቃላይ የክፉ ድርጊት ክስ ሆኖ ቀርቧል።
  alternative: “ክፉ አድራጊ” ወይም “ወንጀለኛ”
  rationale: κακὸν ποιῶν ከተወሰነ ቴክኒካዊ የሕግ መጠሪያ ይልቅ ሰፊ የሆነ የድርጊት ገለጻ ነው። ዋናው ትርጉም የከሳሾቹን ያልተወሰነ ክስ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “መልሰው … አሉት” የምንጩን የትረካ ቀመር በአማርኛ ሳይጎረብጥ ያቀርባል።
