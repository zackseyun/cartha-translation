- source_word: ἀπέκοψεν
  choice: የቆረጠው
  rationale: ከንግግሩ በፊት የተፈጸመውን የጴጥሮስን ድርጊት በአማርኛ አንጻራዊ ሐረግ ውስጥ በግልጽ ያቀርባል።
- source_word: ὠτίον
  choice: ጆሮውን
  rationale: የግሪኩን ስም ቀጥተኛና የተለመደ ትርጉም ይሰጣል፤ የአነስተኛነት ቅርጹን በአማርኛ ማስገባት አያስፈልግም።
- source_word: Οὐκ ἐγώ σε εἶδον
  choice: ያየሁህ እኔ አይደለሁምን?
  rationale: አዎንታዊ መልስ የሚጠብቀውን አሉታዊ ጥያቄና በἐγώ ላይ ያለውን አጽንዖት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐν τῷ κήπῳ
