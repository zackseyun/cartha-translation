base_translation:
  language: en
  yaml_path: translation/nt/john/018/026.yaml
  text: One of the high priest’s servants[a], being a relative of the man whose ear Peter had cut off, said, “Didn’t I see you in the garden with him?”
translation:
  language: am
  text: የሊቀ ካህናቱ ባሪያዎች[a] አንዱ፣ ጴጥሮስ ጆሮውን የቆረጠው ሰው ዘመድ የነበረው፣ “ከእርሱ ጋር በአትክልት ስፍራ ያየሁህ እኔ አይደለሁምን?” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “አገልጋዮች” ተብሎም ሊተረጎም ይችላል። የግሪኩ δοῦλος እንደ ዐውዱ “ባሪያ” ወይም “አገልጋይ” ማለት ሊሆን ይችላል፤ እዚህ “ባሪያዎች” የተባለው ቃሉ የሚያመለክተውን የባርነት ማኅበራዊ ሁኔታ ለማስጠበቅ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: δούλων
  choice: ባሪያዎች
  rationale: በዚህ የቤተሰብ አገልግሎት ዐውድ ቃሉ ከሊቀ ካህናቱ ቤት ጋር በባርነት የተሳሰሩ ሰዎችን ያመለክታል፤ ‘አገልጋዮች’ የሚለው አማራጭ በግርጌ ማስታወሻ ተጠቅሷል።
- source_word: ἀρχιερέως
  choice: ሊቀ ካህናቱ
  rationale: በዮሐንስ የሕማማት ትረካ ውስጥ ያለውን ዋናውን የክህነት ሥልጣን የሚያመለክት መደበኛ አገላለጽ ነው።
- source_word: συγγενὴς ὢν
