  yaml_path: translation/nt/john/018/023.yaml
  text: Jesus answered him[a], “If I spoke wrongly, testify about the wrong; but if rightly[b], why do you strike me?”
translation:
  language: am
  text: ኢየሱስም መልሶ፣ “የተሳሳተ ነገር ተናግሬ ከሆነ፣ ስለዚያ ስህተት መስክር፤[a] በትክክል ተናግሬ ከሆነ ግን፣ ለምን ትመታኛለህ?”[b] አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ስለ ክፉው ነገር መስክር” ወይም “የተሳሳተውን ነገር ግለጽ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ለምን ትደበድበኛለህ?” የግሪኩ ግስ በሰፊው መምታትን፣ በአንዳንድ አውድም መደብደብን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ Ἰησοῦς
  choice: ኢየሱስም መልሶ … አለው
  rationale: የግሪኩን የመልስ አሰጣጥና የተናጋሪውን ተቀባይ በተፈጥሯዊ የአማርኛ የትረካ አወቃቀር ያቀርባል።
- source_word: κακῶς ἐλάλησα
  choice: በስህተት ተናግሬ
  rationale: κακῶς ንግግሩ ስህተት፣ ክፉ ወይም ተገቢ ያልሆነ መሆኑን ሊያመለክት ይችላል፤ “በስህተት” በዚህ የፍርድ አውድ ተፈጥሯዊ ሲሆን ከ“በትክክል” ጋር ያለውን ተቃርኖ ይጠብቃል።
- source_word: μαρτύρησον περὶ τοῦ κακοῦ
  choice: ስለ ስህተቱ መስክር
  rationale: μαρτύρησον ያለውን የሕግና የምስክርነት ገጽታ “መስክር” ይጠብቃል፤ περὶ τοῦ κακοῦ ደግሞ በንግግሩ ውስጥ አለ የተባለውን ስህተት ያመለክታል።
- source_word: εἰ δὲ καλῶς
  choice: በትክክል ተናግሬ ከሆነ ግን
  rationale: የግሪኩን ሁለተኛ ሁኔታዊ ሐረግና ከκακῶς ጋር ያለውን ግልጽ ተቃርኖ ይጠብቃል። ግሱ በግሪክ ቢታወቅም በአማርኛ ለግልጽነት ተደግሟል።
- source_word: τί με δέρεις
  choice: ለምን ትመታኛለህ?
  rationale: τί በዚህ አገባብ “ለምን” ማለት ነው፤ δέρεις መምታትን ወይም መደብደብን ሊያመለክት ስለሚችል “ትመታኛለህ” ስፋቱን የሚጠብቅ አገላለጽ ነው።
theological_decisions:
- issue: ኢየሱስ ለተፈጸመበት ዓመፅ የሰጠው ምላሽ ባሕርይ
  choice: ምላሹ ተገቢ ምስክርነትን የሚጠይቅና ያለማስረጃ መመታቱን የሚጠይቅ ሕጋዊና ሥነ ምግባራዊ ክርክር ሆኖ ቀርቧል።
  alternative: የፍትሕ መጓደሉን በማብራሪያ የሚያጎላ ትርጉም ወይም የሕጋዊውን ገጽታ የሚያለዝብ አገላለጽ።
  rationale: ጽሑፉ ራሱ ምስክርነትን እና የመምታቱን ምክንያት ይጠይቃል፤ ትርጉሙ ይህን አመክንዮ ይጠብቃል እንጂ ተጨማሪ የእምነት ወይም የሥነ ምግባር ማብራሪያ አያስገባም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። “መስክር” የሚለው ቃል የፍርድ አውዱን ሲጠብቅ፣ “በስህተት/በትክክል” የሚለው ጥንድ ደግሞ የግሪኩን ተቃርኖ በተፈጥሯዊ አማርኛ ያቀርባል።
