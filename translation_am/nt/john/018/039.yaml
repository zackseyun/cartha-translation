  text: ἔστιν δὲ συνήθεια ὑμῖν ἵνα ἕνα ⸂ἀπολύσω ὑμῖν⸃ ἐν τῷ πάσχα· βούλεσθε οὖν ⸄ἀπολύσω ὑμῖν⸅ τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/039.yaml
  text: But you have a custom that I release one man for you at the Passover[a]. So do you want me to release to you the King of the Jews?
translation:
  language: am
  text: ነገር ግን፣ በፋሲካ አንድ ሰው እንድፈታላችሁ ልማድ አላችሁ። እንግዲህ የአይሁድን ንጉሥ[a] እንድፈታላችሁ ትፈልጋላችሁን?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የይሁዳ ሰዎችን ንጉሥ።” የግሪኩ ቃል እንደ አውዱ “አይሁድ” ወይም “የይሁዳ ሰዎች” ሊያመለክት ይችላል፤ እዚህ ግን በኢየሱስ ሕማማት ትረካ ውስጥ እንደ ተወሰነ ማዕረግ የተጠቀሰ ይመስላል።
    reason: alternative_reading
lexical_decisions:
- source_word: συνήθεια
  choice: ልማድ
  rationale: በዚህ የፍርድና የበዓል አውድ የተመሠረተ ማኅበራዊ አሠራርን በተፈጥሯዊ አማርኛ ያመለክታል።
- source_word: ἵνα ἕνα ἀπολύσω ὑμῖν
  choice: አንድ ሰው እንድፈታላችሁ
  rationale: ἕνα በግሪክ በቀጥታ ‘አንድ’ ቢልም፣ በአማርኛ የሰው ተጠቃሽነቱን ‘አንድ ሰው’ ብሎ መግለጽ ግልጽና ተፈጥሯዊ ነው፤ እንድፈታላችሁ ደግሞ ለእነርሱ ጥቅም መፍታቱን ይጠብቃል።
- source_word: ἀπολύω
  choice: መፍታት
  rationale: በእስረኛ የፍርድ አውድ ‘መፍታት’ ከእስር ነፃ ማውጣትን በትክክልና በተለመደ ቋንቋ ይገልጻል፤ በሁለቱም መከሰቻዎች አንድነቱ ተጠብቋል።
- source_word: ἐν τῷ πάσχα
  choice: በፋሲካ
  rationale: የበዓሉን ጊዜ በአጭርና በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: βούλεσθε οὖν
  choice: እንግዲህ … ትፈልጋላችሁን?
  rationale: οὖν የሚያሳየውን የውሳኔ ሽግግር ‘እንግዲህ’ ያስተላልፋል፤ βούλεσθε ደግሞ በዘመናዊ አማርኛ ‘ትፈልጋላችሁን?’ ተብሏል።
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: የአይሁድን ንጉሥ
  rationale: በሕማማት ትረካው ውስጥ የኢየሱስን ንጉሣዊ ማዕረግና ክስ የሚገልጸውን የተወሰነ ሐረግ ይጠብቃል።
theological_decisions:
- issue: በτὸν βασιλέα τῶν Ἰουδαίων ውስጥ Ἰουδαίωνን መተርጎም
  choice: የአይሁድን ንጉሥ
  alternative: የይሁዳ ሰዎችን ንጉሥ
  rationale: በዮሐንስ የሕማማት ትረካ ሐረጉ ከኢየሱስ ጋር የተያያዘ የታወቀ ንጉሣዊ/መሲሐዊ ማዕረግና ክስ ሆኖ ይሠራል። ‘አይሁድ’ ይህን ታሪካዊና ትረካዊ አጠቃቀም ይጠብቃል፤ Ἰουδαῖοι እንደ አውዱ ‘የይሁዳ ሰዎች’ ሊል ስለሚችል አማራጩ በማስታወሻ ተገልጿል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘እንድፈታላችሁ’ የሕግ አውዱን ሳያጣ ተፈጥሯዊ ነው፤ የግሪኩ የቃል ቅደም ተከተል ለአማርኛ ንባብ ተስተካክሏል።
