  source_fidelity: The draft accurately conveys Judas's knowledge of the place and the causal explanation that Jesus repeatedly met/gathered there with his disciples. However, the main rendering of the present participle παραδιδοὺς is less idiomatic in Amharic than a present relative form, and the wording for the repeated meetings can be made more natural without losing the gathering sense.
  naturalness: “እርሱን ይከዳ የነበረው” is grammatically interpretable but marked and less natural than “እርሱን የሚከዳው.” “ይገናኝ ነበር” is a natural standard-Amharic expression for the contextual intransitive sense of συνήχθη.
  terminology: “ይሁዳ,” “ኢየሱስ,” “ደቀ መዛሙርቱ,” and “ቦታው” are appropriate. “የሚከዳው” retains the betrayal sense of παραδιδοὺς, while the footnote retains the more literal alternative, “አሳልፎ የሚሰጠው.”
  issues:
