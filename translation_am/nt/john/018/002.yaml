    rationale: The phrase “እርሱን ይከዳ የነበረው” is not the most idiomatic modern-Amharic way to render the Greek present participle. “እርሱን የሚከዳው” is clearer and preserves its ongoing/identifying force.
  - severity: low
    issue: The main rendering of συνήχθη is less idiomatic than the supplied alternative.
    rationale: Although “ይሰበሰብ ነበር” can be understood, “ይገናኝ ነበር” more naturally expresses that Jesus repeatedly met there with his disciples, the contextual sense of the singular passive verb.
