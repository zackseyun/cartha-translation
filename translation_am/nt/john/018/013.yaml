  text: And they led him first to Annas, for he was the father-in-law of Caiaphas, who was high priest that year.
translation:
  language: am
  text: ከዚያም መጀመሪያ ወደ ሐና ወሰዱት፤ ሐና የቀያፋ ሚስት አባት ነበርና፤ ቀያፋም በዚያ ዓመት ሊቀ ካህናት ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγαγον
  choice: ወሰዱት
  rationale: ἄγω መምራትን ወይም መውሰድን ያመለክታል፤ በእስር ሥር አድርገው ከቦታ ወደ ቦታ ስላዘዋወሩት፣ «ወሰዱት» በአማርኛ ተፈጥሯዊና አውዱን የሚጠብቅ ነው።
- source_word: πρὸς Ἅνναν
  choice: ወደ ሐና
  rationale: πρός ከተሳቢ ጋር ወደ አንድ ሰው የሚደረግን እንቅስቃሴ ያሳያል፤ «ወደ ሐና» ቀጥተኛ አቻ ነው።
- source_word: πρῶτον
  choice: መጀመሪያ
  rationale: ቃሉ የቅደም ተከተል ተውሳከ ግስ ሆኖ፣ ሐና የመጀመሪያው መድረሻ መሆኑን ያሳያል።
- source_word: πενθερὸς
  choice: አማች
  rationale: πενθερός በዚህ አውድ የሚስት አባትን ያመለክታል። «አማች» በዘመናዊ አማርኛ ተፈጥሯዊ ቢሆንም የዝምድናውን አቅጣጫ በቃሉ ብቻ አይለይም፤ አውዱ ሐና የቀያፋ የሚስት አባት መሆኑን ያመለክታል።
- source_word: ἀρχιερεὺς
  choice: ሊቀ ካህናት
  rationale: ይህ ለአይሁድ ዋና የክህነት ሹመት በአማርኛ የተለመደና ግልጽ አቻ ነው።
- source_word: τοῦ ἐνιαυτοῦ ἐκείνου
  choice: በዚያ ዓመት
  rationale: የግሪኩን ጊዜያዊ መለያ ተፈጥሯዊ በሆነ አማርኛ ያቀርባል።
- source_word: Ἅνναν
  choice: ሐና
  rationale: በአማርኛ የመጽሐፍ ቅዱስ ስም አጠራር የተለመደው ቅርጽ ተጠብቋል።
- source_word: Καϊάφα
  choice: ቀያፋ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ ስም አጠራር የተለመደው ቅርጽ ተጠብቋል።
