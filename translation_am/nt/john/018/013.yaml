  rationale: በግሪኩ ὃς በተፈጥሮ ቅርብ ወዳለው Καϊάφα ይመለሳል። በአማርኛም «የነበረው የቀያፋ አማች» የሚለው አቀማመጥ ሊቀ ካህናት የነበረው ቀያፋ መሆኑን ያብራራል።
