source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτῷ ὁ Πιλᾶτος· Οὐκοῦν βασιλεὺς εἶ σύ; ἀπεκρίθη ⸀ὁ Ἰησοῦς· Σὺ λέγεις ὅτι βασιλεύς ⸀εἰμι. ἐγὼ εἰς τοῦτο γεγέννημαι καὶ εἰς τοῦτο ἐλήλυθα εἰς τὸν κόσμον ἵνα μαρτυρήσω τῇ ἀληθείᾳ· πᾶς ὁ ὢν ἐκ τῆς ἀληθείας ἀκούει μου τῆς φωνῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/037.yaml
  text: 'Then Pilate said to him[a], “So then, are you a king?” Jesus answered, “You say that I am a king. For this I have been born, and for this I have come into the world: that I should bear witness to the truth. Everyone who is of the truth listens to my voice.”'
translation:
  language: am
  text: ጲላጦስም፣ “እንግዲያው አንተ ንጉሥ ነህ?” አለው። ኢየሱስም፣ “እኔ ንጉሥ እንደሆንሁ አንተ ትላለህ።[a] ለዚህ ተወልጃለሁ፤ ለዚህም ወደ ዓለም መጥቻለሁ፤ ይኸውም ለእውነት እንድመሰክር ነው። ከእውነት የሆነ ሁሉ ድምፄን ያዳምጣል” ብሎ መለሰ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አንተ እንዲህ ትላለህ፤ እኔ ንጉሥ ነኝ።” ወይም፣ “ንጉሥ እንደሆንሁ በትክክል ተናገርህ።” የግሪክኛው አገላለጽ አጭር ሲሆን ገደብ ያለውን ማረጋገጫ ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐκοῦν
  choice: እንግዲያው
  rationale: ጲላጦስ ከቀደመው ንግግር የሚያወጣውን ድምዳሜ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: βασιλεὺς
  choice: ንጉሥ
  rationale: በሮማዊው ምርመራ አውድ የቃሉን ፖለቲካዊና መሲሐዊ ፍቺ የሚጠብቅ መደበኛ ትርጉም ነው።
- source_word: Σὺ λέγεις ὅτι βασιλεύς εἰμι
  choice: እኔ ንጉሥ እንደሆንሁ አንተ ትላለህ
  rationale: የግሪክኛውን አጭርና በከፊል አሻሚ አገላለጽ በቅርብ ይጠብቃል፤ ግልጽ ማረጋገጫ ወይም እምቢታ አድርጎ አይፈታውም።
- source_word: γεγέννημαι
  choice: ተወልጃለሁ
  rationale: የፍጹም ጊዜውን የአሁን ጠቀሜታ በተፈጥሯዊ አማርኛ ያቀርባል፤ አውዱ የማይጠይቀውን ሥነ መለኮታዊ ፍቺ አያስገባም።
- source_word: ἐλήλυθα εἰς τὸν κόσμον
  choice: ወደ ዓለም መጥቻለሁ
  rationale: የመምጣቱን የተጠናቀቀ ነገር ግን አሁንም ውጤት ያለው ተግባር ይጠብቃል፤ የዮሐንስን የተልእኮና የመነሻ አንድምታም አያጠፋም።
- source_word: μαρτυρήσω τῇ ἀληθείᾳ
  choice: ለእውነት እንድመሰክር
  rationale: የἵνα ዓላማንና የሕጋዊ ምስክርነት ቃላትን በግልጽ አማርኛ ይጠብቃል።
- source_word: πᾶς ὁ ὢν ἐκ τῆς ἀληθείας
  choice: ከእውነት የሆነ ሁሉ
  rationale: ἐκ የሚገልጸውን የምንጭ ወይም የዝምድና አንድምታ ሳይተረጉም በቅርብ ያስቀምጣል።
- source_word: ἀκούει μου τῆς φωνῆς
  choice: ድምፄን ያዳምጣል
  rationale: ተራ ድምፅ መስማትን ብቻ ሳይሆን በትኩረትና በምላሽ መቀበልን ያመለክታል፤ “ድምፄን” የሚለውንም የዮሐንስ አገላለጽ ይጠብቃል።
theological_decisions:
- issue: የኢየሱስ ለጲላጦስ የሰጠው መልስ ስሜት (Σὺ λέγεις ὅτι βασιλεύς εἰμι)
  choice: ገደብ ያለውን ማረጋገጫ በግሪክኛው ቅርጽ በቅርብ የሚያቀርብ “እኔ ንጉሥ እንደሆንሁ አንተ ትላለህ”
  alternative: “ንጉሥ እንደሆንሁ በትክክል ተናገርህ” የሚል ጠንካራ ማረጋገጫ፣ ወይም “ይህ የአንተ አባባል ነው” የሚል ርቀት ያለው መልስ
  rationale: ግሪክኛው ከአንድ በላይ የድምፅ ስሜት ሊያስተላልፍ ይችላል፤ ጥቅሱ ግን ጠንካራ ማረጋገጫንም ሆነ እምቢታን በግልጽ አይጨምርም። ስለዚህ ዋናው ጽሑፍ አሻሚነቱን ይጠብቃል፣ አማራጮቹም በማስታወሻ ቀርበዋል።
- issue: “ተወልጃለሁ” እና “ወደ ዓለም መጥቻለሁ” የሚሉት የተልእኮ አገላለጾች
  choice: ሁለቱን ንግግሮች ሳይዋሐዱ ለየብቻ ማቆየት
  alternative: ሁለቱን ወደ አንድ አጠቃላይ የተልእኮ አባባል መጠቅለል
  rationale: የዮሐንስ አገላለጽ መወለዱንና ወደ ዓለም መምጣቱን ለይቶ ያቀርባል፤ ይህም የሥጋ መልበስ አንድምታ ሊኖረው ይችላል። ትርጉሙ ጽሑፉ ያልጨመረውን የትምህርት ማብራሪያ ሳይጨምር ሁለቱንም ይጠብቃል።
