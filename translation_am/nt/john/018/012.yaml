  yaml_path: translation/nt/john/018/012.yaml
  text: So the cohort[a], the commander, and the officers of the Jews seized Jesus and bound him.
translation:
  language: am
  text: ስለዚህ የጦር ክፍሉ፣ አዛዡና የአይሁድ[a] ጠባቂዎች ኢየሱስን ያዙትና አሰሩት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: እንደ አውዱ፣ “የአይሁድ መሪዎች” ወይም “የይሁዳ ሰዎች” ሊባልም ይችላል፤ ዮሐንስ “አይሁድ” የሚለውን ቃል ብዙ ጊዜ መላውን የአይሁድ ሕዝብ ሳይሆን የተወሰኑ ሰዎችን ለማመልከት ይጠቀምበታል።
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: ስለዚህ
  rationale: የቀደመውን ትረካ ከዚህ ድርጊት ጋር የሚያገናኘውን የትረካ ቀጣይነትና ውጤት ያሳያል።
- source_word: σπεῖρα
  choice: የጦር ክፍሉ
  rationale: ቃሉ የተደራጀ ወታደራዊ ክፍልን ያመለክታል፤ ይህ አተረጓጎም በአማርኛ ግልጽ ሲሆን ‘ሮማዊ’ የሚለውን በግሪክ ስም ውስጥ ያልተገለጠ መረጃ አይጨምርም።
- source_word: χιλίαρχος
  choice: አዛዡ
  rationale: የጦር ክፍሉን የሚመራውን ባለሥልጣን በተፈጥሯዊና ለዘመናዊ አንባቢ በሚገባ ቃል ይገልጣል።
- source_word: ὑπηρέται
  choice: ጠባቂዎች
  rationale: በዮሐንስ አውድ ቃሉ የቤት አገልጋዮችን ሳይሆን በባለሥልጣናት ሥር የሚሠሩና በእስሩ የተሳተፉ ሰዎችን ያመለክታል፤ ‘ጠባቂዎች’ ሚናቸውን ሳያበዛ ያስተላልፋል።
- source_word: τῶν Ἰουδαίων
  choice: የአይሁድ
  rationale: የግሪኩን ሐረግ በቀጥታ ይጠብቃል፤ በዮሐንስ ይህ አገላለጽ አንዳንድ ጊዜ የተወሰኑ የአይሁድ ባለሥልጣናትን ወይም የይሁዳ ነዋሪዎችን ሊያመለክት ስለሚችል ይህ ልዩነት በማስታወሻ ተጠብቋል።
- source_word: συνέλαβον
  choice: ያዙት
  rationale: የአካላዊ መያዝንና በቁጥጥር ሥር ማዋልን ያሳያል፤ ‘አሰሩት’ ብቻ ቢባል ከሚቀጥለው የማሰር ድርጊት ጋር ሊደበላለቅ ይችላል።
- source_word: ἔδησαν
  choice: አሰሩት
  rationale: በዚህ ቅደም ተከተል ከ‘ያዙት’ በኋላ መምጣቱ በገመድ ወይም በማሰሪያ ማሰራቸውን በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: በዮሐንስ ወንጌል τῶν Ἰουδαίων የሚለው አገላለጽ ማንን እንደሚያመለክት
  choice: በዋናው ጽሑፍ ‘የአይሁድ’ ተብሎ በቀጥታ ተተርጉሟል።
  alternative: ‘የአይሁድ መሪዎች’ ወይም ‘የይሁዳ ሰዎች’
  rationale: ጥቅሱ ራሱ ‘መሪዎች’ ብሎ አይገልጽም፤ ስለዚህ ዋናው ጽሑፍ የግሪኩን ሰፊ አገላለጽ ይጠብቃል። ሆኖም ቃሉ መላውን የአይሁድ ሕዝብ ያመለክታል ተብሎ እንዳይወሰድ፣ በዮሐንስ አውድ ያሉት የተወሰኑ አማራጮች በማስታወሻ ተገልጠዋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የትረካ አማርኛ ተጠቅሟል። ‘የጦር ክፍል’ እና ‘አዛዥ’ የወታደራዊውን አውድ በግልጽ ያሳያሉ፤ ከምንጩ በላይ የሆነ ታሪካዊ ዝርዝር አልተጨመረም።
