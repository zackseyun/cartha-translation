- source_word: πάντες οἱ Ἰουδαῖοι
  choice: አይሁድ ሁሉ
  rationale: ቀጥተኛ አተረጓጎም ሲሆን በዚህ አውድ በምኩራብና በቤተ መቅደስ የሚሰበሰቡትን ሰፊውን የአይሁድ ማኅበረሰብ ያመለክታል፤ የቃሉ አውዳዊ አሻሚነት በእግር ማስታወሻ ተጠብቋል።
- source_word: συνέρχονται
