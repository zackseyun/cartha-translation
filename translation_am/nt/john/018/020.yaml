base_translation:
  language: en
  yaml_path: translation/nt/john/018/020.yaml
  text: Jesus answered him[a], “I have spoken openly to the world. I always taught in the synagogue and in the temple, where all the Jews gather[b], and I said nothing in secret.”
translation:
  language: am
  text: ኢየሱስም እንዲህ ሲል መለሰለት፦ “እኔ ለዓለም በግልጽ ተናግሬአለሁ። ሁልጊዜ በምኩራብና በቤተ መቅደስ[a]፣ አይሁድ[b] ሁሉ በሚሰበሰቡበት ስፍራ፣ አስተማርኩ፤ በስውር ምንም አልተናገርኩም።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “በቤተ መቅደሱ አደባባዮች” ወይም “በቤተ መቅደሱ ግቢ።” የግሪኩ ἱερόν የውስጠኛውን መቅደስ ብቻ ሳይሆን መላውን የቤተ መቅደስ ግቢ ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም “የአይሁድ ሕዝብ ሁሉ፤” በዮሐንስ ውስጥ እንደ አውዱ “የይሁዳ ነዋሪዎች ሁሉ” ማለትም ሊሆን ይችላል። የግሪኩ Ἰουδαῖοι ትርጉም በአውዱ ይወሰናል።
    reason: lexical_alternative
