  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Σίμων οὖν Πέτρος ἔχων μάχαιραν εἵλκυσεν αὐτὴν καὶ ἔπαισεν τὸν τοῦ ἀρχιερέως δοῦλον καὶ ἀπέκοψεν αὐτοῦ τὸ ⸀ὠτάριον τὸ δεξιόν. ἦν δὲ ὄνομα τῷ δούλῳ Μάλχος.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/010.yaml
  text: Then Simon Peter[a], having a sword, drew it and struck the high priest’s servant and cut off his right ear. Now the servant’s name was Malchus.
translation:
  language: am
  text: ከዚያም ሰይፍ የያዘው ስምዖን ጴጥሮስ ሰይፉን መዝዞ የሊቀ ካህናቱን ባሪያ[a] መታው፤ ቀኝ ጆሮውንም ቆረጠው። የባሪያውም ስም ማልኮስ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «አገልጋይ»። የግሪኩ δοῦλος (ዱሎስ) የሚለው ቃል እንደ አገባቡ «ባሪያ» ወይም «አገልጋይ» ማለት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: ከዚያም
  rationale: በትረካው ውስጥ የሚቀጥለውን ድርጊት በተፈጥሯዊ አማርኛ ያገናኛል፤ አገናኙን ከልክ በላይ እንደ ምክንያታዊ ድምዳሜ አያቀርበውም።
- source_word: ἔχων μάχαιραν
  choice: ሰይፍ የያዘው
  rationale: μάχαιρα አጭር ሰይፍን ወይም ትልቅ ስለታማ መሣሪያን ሊያመለክት ቢችልም፣ «ሰይፍ» ሰፊና የተለመደ አቻ ነው፤ የተሳቢውም አወቃቀር በተፈጥሯዊ አማርኛ ተጠብቋል።
- source_word: εἵλκυσεν αὐτὴν
  choice: ሰይፉን መዝዞ
  rationale: መሣሪያን ከሰገባው ማውጣትን የሚገልጽ ተፈጥሯዊና ትክክለኛ የአማርኛ አገላለጽ ነው።
- source_word: ἔπαισεν
  choice: መታው
  rationale: ድርጊቱን በቀጥታ፣ በግልጽና በዘመናዊ አማርኛ ይገልጻል።
- source_word: τὸν τοῦ ἀρχιερέως δοῦλον
  choice: የሊቀ ካህናቱን ባሪያ
  rationale: δοῦλος በዚህ የባለቤትነት ግንኙነት ውስጥ ከቅጥር አገልጋይነት ይልቅ በባርነት ሥር ያለን ሰው ስለሚያመለክት «ባሪያ» ተመርጧል፤ «አገልጋይ» በማስታወሻ ተጠብቋል።
- source_word: ἀπέκοψεν
  choice: ቆረጠው
  rationale: በመቁረጥ አካልን መለየት የሚለውን የግሱን ቀጥተኛ ትርጉም ያስተላልፋል፤ ከ«ጆሮውን» ጋር ሲነበብ ሙሉ በሙሉ መቆረጡ ግልጽ ነው።
- source_word: ὠτάριον τὸ δεξιόν
  choice: ቀኝ ጆሮውን
  rationale: ὠτάριον በዚህ አገባብ በመደበኛነት «ጆሮ» ማለት ነው፤ እንደ «የጆሮ ጫፍ» ማቅረብ ምንጩ ያልገለጸውን ዝርዝር ይጨምራል። «ቀኝ» የትኛው ጆሮ እንደሆነ ያስቀምጣል።
- source_word: ἦν δὲ ὄνομα τῷ δούλῳ Μάλχος
  choice: የባሪያውም ስም ማልኮስ ነበር
  rationale: δέ በ«-ም» በተፈጥሯዊ የትረካ ቅጥ ተወክሏል፤ የዳቲቭ አወቃቀሩ በአማርኛ የባለቤትነት ሐረግ ተገልጿል፣ Μάλχοςም «ማልኮስ» ተብሎ ተጽፏል።
theological_decisions:
- issue: የδοῦλος አተረጓጎም
  choice: ባሪያ
  alternative: አገልጋይ
  rationale: የግሪኩ ቃል ሁለቱንም ትርጉሞች ሊይዝ ይችላል። እዚህ ሰውየው «የሊቀ ካህናቱ» መሆኑ የተገለጸ በመሆኑ፣ የተገዢነትና የባለቤትነት ግንኙነቱን ሳያለዝብ «ባሪያ» በዋናው ጽሑፍ ተመርጧል፤ አገባቡን «አገልጋይ» ብሎ የመረዳት አማራጭ በእግር ማስታወሻ ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለውን የትረካ ቅጥ ይጠቀማል። «መዝዞ» የመሣሪያውን ከሰገባ መውጣት በተፈጥሯዊ አማርኛ ያሳያል፤ «መታው፤ ቀኝ ጆሮውንም ቆረጠው» ደግሞ የግሪኩን ተከታታይ ድርጊቶች በግልጽ ያቀርባል።
