  text: εἶπεν οὖν αὐτοῖς ⸀ὁ Πιλᾶτος· Λάβετε αὐτὸν ὑμεῖς, καὶ κατὰ τὸν νόμον ὑμῶν κρίνατε αὐτόν. ⸀εἶπον αὐτῷ οἱ Ἰουδαῖοι· Ἡμῖν οὐκ ἔξεστιν ἀποκτεῖναι οὐδένα·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/031.yaml
  text: So Pilate said to them[a], “Take him yourselves and judge him according to your law.” The Jews said to him, “It is not lawful for us to put anyone to death.”
translation:
  language: am
  text: ስለዚህ ጲላጦስ፣ “እናንተው ውሰዱትና በሕጋችሁ መሠረት ፍረዱበት” አላቸው። አይሁድም[a]፣ “እኛ ማንንም መግደል በሕግ አልተፈቀደልንም” አሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክ “አይሁድ” (οἱ Ἰουδαῖοι)። በዚህ አውድ ቃሉ ከጲላጦስ ጋር የሚናገሩትን የአይሁድ ባለሥልጣናት ወይም ከሳሾች ያመለክታል እንጂ መላውን የአይሁድ ሕዝብ አይደለም።
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: ስለዚህ
  rationale: የቀደመውን ንግግር ተከትሎ ያለውን ድምዳሜያዊና ትረካዊ ፍሰት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Λάβετε αὐτὸν ὑμεῖς
  choice: እናንተው ውሰዱት
  rationale: ግልጽ ተውላጠ ስም ὑμεῖς የሚሰጠውን አጽንዖት “እናንተው” ይጠብቃል፤ የትእዛዙ ቅርጽም በተፈጥሯዊ አማርኛ ተላልፏል።
- source_word: κατὰ τὸν νόμον ὑμῶν
  choice: በሕጋችሁ መሠረት
  rationale: κατά እዚህ ከአንድ መሥፈርት ጋር መስማማትን ያመለክታል፤ ይህ አተረጓጎም ጲላጦስ ሕጉን “የእናንተ” ብሎ ማራቁንም ይጠብቃል።
- source_word: κρίνατε αὐτόν
  choice: ፍረዱበት
  rationale: κρίνω ያለውን ሰፊ የሕግ ፍርድ ትርጉም ይጠብቃል፤ ከግሪኩ በላይ የተወሰነ የሮማውያን የፍርድ ሂደት አያስገባም።
- source_word: οἱ Ἰουδαῖοι
  choice: አይሁድ
  rationale: የግሪኩን መደበኛ የቡድን ስያሜ ይጠብቃል፤ በዚህ አውድ ግን ቃሉ በጲላጦስ ፊት የቀረቡትን የአይሁድ ባለሥልጣናት ወይም ከሳሾች እንደሚያመለክት በእግር ማስታወሻ ተብራርቷል።
- source_word: οὐκ ἔξεστιν
  choice: በሕግ አልተፈቀደልንም
  rationale: በዚህ የፍርድ አውድ ἔξεστιν ሕጋዊ ፈቃድን ያመለክታል፤ ቅርጹም “ለእኛ” የሚለውን ἡμῖν በተፈጥሯዊ አማርኛ ይይዛል።
- source_word: ἀποκτεῖναι οὐδένα
  choice: ማንንም መግደል
  rationale: የግሪኩን መሠረታዊ ትርጉምና የοὐδέναን አጠቃላይ ወሰን ይጠብቃል፤ የፍርድ አውዱ ሞት መቅጣትን ቢያመለክትም “መግደል” የቃሉን ስፋት አያጠብም።
theological_decisions:
- issue: በዮሐንስ ወንጌል οἱ Ἰουδαῖοι የሚያመለክተው ቡድን
  choice: በዋናው ጽሑፍ “አይሁድ” ተብሎ ተተርጉሞ፣ አውዱ በጲላጦስ ፊት የሚናገሩትን ባለሥልጣናት ወይም ከሳሾች እንደሚወስን በማስታወሻ ተገልጿል።
  alternative: “የአይሁድ መሪዎች” ወይም “ይሁዳውያን”
  rationale: ይህ የግሪኩን አገላለጽና ያለውን የትርጉም ስፋት ይጠብቃል፤ በተመሳሳይም ንግግሩ ሁሉንም የአይሁድ ሕዝብ እንደሚወክል ከሚያስመስል የተሳሳተ ንባብ ይከላከላል።
- issue: ἀποκτεῖναι በፍርድ አውድ
  choice: “መግደል”
  alternative: “በሞት መቅጣት”
  rationale: “በሞት መቅጣት” የአውዱን ሕጋዊ ኃይል በግልጽ ያሳያል፣ ነገር ግን ἀποκτείνω በራሱ ሰፊውን “መግደል” ይላል። ስለዚህ ዋናው ጽሑፍ የቃሉን ስፋት ጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “እናንተው” የግሪኩን አጽንዖት በተፈጥሯዊ መንገድ ይገልጣል፤ “ፍረዱበት” ደግሞ ሕጋዊ አውዱን ሳያጠብ ይጠብቃል።
