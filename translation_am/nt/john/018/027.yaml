  rationale: የጴጥሮስ ክህደት መደገሙን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ጥያቄና ምላሽ ጋር ያለውን የውጤትና የትረካ ቅደም ተከተል ይጠብቃል።
- source_word: ἠρνήσατο
  choice: ካደው
  rationale: በዐውዱ የቀደመውን ጥያቄ ወይም ክስ እንደካደ ያመለክታል፤ የግሪኩ ጽሑፍ ግን ተሳቢውን በግልጽ አይጠቅስም።
- source_word: Πέτρος
  choice: ጴጥሮስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደው የስሙ ቅርጽ ነው።
- source_word: καὶ
  choice: ም
  rationale: ሁለተኛውን ክስተት ከመጀመሪያው ጋር በተፈጥሯዊ የአማርኛ አያያዝ ያገናኛል።
- source_word: εὐθέως
  choice: ወዲያው
  rationale: የዶሮው መጮኽ ከክህደቱ በኋላ ወዲያው መሆኑን ይገልጣል።
- source_word: ἀλέκτωρ
  choice: ዶሮ
  rationale: በዐውዱ ወንድ ዶሮን የሚያመለክት ተፈጥሯዊና የተለመደ የአማርኛ ቃል ነው።
- source_word: ἐφώνησεν
  choice: ጮኸ
  rationale: ዶሮ ባለበት ዐውድ የግሪኩን ‘ድምፅ አሰማ’ የሚለውን ፍቺ በተፈጥሯዊ አማርኛ ይገልጣል።
