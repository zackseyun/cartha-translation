  source_fidelity: The draft correctly conveys Peter's repeated denial and the rooster's immediate crowing. However, ስለዚህ is more strongly consequential ('therefore') than the Greek οὖν requires in this narrative context, and the main text supplies an object (ካደው) that the Greek leaves unstated.
  naturalness: The wording is generally clear and idiomatic, but እንግዲህ more naturally carries the modest sequential/inferential force here. እንደገና is a direct, natural expression for πάλιν, and አውራ ዶሮ precisely identifies the crowing male bird.
  terminology: ጴጥሮስ is the established Amharic biblical form. ካደ preserves the source's unexpressed object; the contextual-object option belongs in the footnote rather than the main line.
  issues:
  - severity: medium
    issue: The main text reads ካደው ('denied it/him').
    rationale: ἠρνήσατο has no explicit object in the Greek text. Although the preceding question supplies the sense contextually, the main translation should retain the source's ellipsis, with any supplied-object rendering noted.
  - severity: low
    issue: ስለዚህ overstates οὖν.
    rationale: In this narrative transition οὖν is suitably rendered by a lighter sequential/inferential expression such as እንግዲህ, rather than a strongly causal 'therefore.'
  - severity: low
    issue: ዶሮ is less specific than ἀλέκτωρ.
    rationale: While understandable in context, አውራ ዶሮ directly represents the male chicken denoted by the Greek word.
  revised_text: እንግዲህ ጴጥሮስ እንደገና ካደ[a]፤ ወዲያውም አውራ ዶሮ ጮኸ።
