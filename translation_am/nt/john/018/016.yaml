base_translation:
  language: en
  yaml_path: translation/nt/john/018/016.yaml
  text: But Peter was standing outside at the door[a]. So the other disciple, who was known to the high priest[b], went out and spoke to the doorkeeper and brought Peter in.
translation:
  language: am
  text: ጴጥሮስ ግን በውጭ በበሩ አጠገብ ቆሞ ነበር። እንግዲህ ከሊቀ ካህናቱ ዘንድ የሚታወቀው[a] ሌላው ደቀ መዝሙር ወደ ውጭ ወጥቶ በር ጠባቂዋን[b] አነጋገራት፤ ጴጥሮስንም ወደ ውስጥ አስገባው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከሊቀ ካህናቱ ጋር የሚተዋወቀው።” የግሪኩ ቃል ግንኙነታቸው ምን ያህል የቀረበ እንደነበር አይገልጽም።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “የመግቢያውን ጠባቂ።” የግሪኩ ቃል በመግቢያው የተመደበችውን ሴት ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: εἱστήκει
  choice: ቆሞ ነበር
  rationale: የጴጥሮስን ቀጣይ አቋም የሚገልጸውን የግሱን ቀጣይነት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: πρὸς τῇ θύρᾳ ἔξω
  choice: በውጭ በበሩ አጠገብ
  rationale: ἔξω የሚገልጸውን ውጫዊ ቦታና πρὸς τῇ θύρᾳ የሚገልጸውን ከመግቢያው አጠገብ መሆን ሁለቱንም ጠብቆ ያቀርባል።
- source_word: ὁ μαθητὴς ὁ ἄλλος
  choice: ሌላው ደቀ መዝሙር
  rationale: በወንጌላት ትረካ ውስጥ μαθητής የሚያመለክተውን የተከታይነትና የተማሪነት ግንኙነት የሚያስተላልፍ የተለመደ አገላለጽ ነው።
- source_word: ὁ γνωστὸς τοῦ ἀρχιερέως
  choice: ሊቀ ካህናቱ የሚያውቀው
  rationale: γνωστός የሚፈቅደውን የመታወቅ ትርጉም ይይዛል፤ የግንኙነቱን ቅርበት ከጽሑፉ በላይ አይወስንም።
- source_word: ἀρχιερεύς
  choice: ሊቀ ካህናት
  rationale: የአይሁድን ከፍተኛ የክህነት ሹመት በትክክል የሚገልጽ የተለመደ አማርኛ ቃል ነው።
- source_word: θυρωρῷ
  choice: በር ጠባቂዋን
  rationale: ቃሉ በመግቢያው የተመደበችውን ሰው ሚና ይገልጻል፤ የግሪኩ አንቀጽም ሴት መሆኗን ስለሚያሳይ የአማርኛው ቅጥያ ይህን ያንጸባርቃል።
- source_word: εἶπεν τῇ θυρωρῷ
  choice: በር ጠባቂዋን አነጋገራት
  rationale: የተነገረው ቃል በቀጥታ ስላልተጠቀሰ፣ ‘አነጋገራት’ ተፈጥሯዊና ትርጉሙን የሚጠብቅ ነው።
- source_word: εἰσήγαγεν τὸν Πέτρον
  choice: ጴጥሮስንም ወደ ውስጥ አስገባው
  rationale: εἰσάγω የሚገልጸውን ከውጭ ወደ ውስጥ የማስገባት ድርጊት በግልጽ አማርኛ ያስተላልፋል።
