- source_word: Τίνα ζητεῖτε;
  choice: ማንን ትፈልጋላችሁ?
  rationale: “ማንን” የጥያቄውን ቀጥተኛ ተሳቢነት፣ የብዙ ቁጥር ግስ ደግሞ ζητεῖτε የሚያመለክተውን ቡድን በግልጽ ያሳያል።
theological_decisions:
- issue: በትረካው ውስጥ የኢየሱስ አስቀድሞ ማወቅ
  choice: ኢየሱስ ሊደርስበት ያለውን ሁሉ እንዳወቀ በግልጽ ተጠብቋል።
