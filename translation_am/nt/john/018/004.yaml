  rationale: የግሪኩን ትረካዊና አመክንዮአዊ ቅጥያ በአማርኛ ተፈጥሯዊ የአያያዝ ቅጥያ ያሳያል፤ “ስለዚህ” የሚለውን ከመጠን በላይ ጠንካራ የምክንያት ትርጉም አያስገባም።
