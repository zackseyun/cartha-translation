  rationale: የመውጣትን መሠረታዊ ትርጉም ይጠብቃል፤ -ና ቀጣዩን የንግግር ድርጊት በተፈጥሯዊ ሁኔታ ያገናኛል።
- source_word: λέγει αὐτοῖς
  choice: አላቸው
