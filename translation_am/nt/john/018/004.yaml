- source_word: πάντα τὰ ἐρχόμενα ἐπ’ αὐτόν
  choice: ሊደርስበት ያለውን ሁሉ
  rationale: πάντα የሚያሳየውን ሙሉነት ይጠብቃል፤ ἐρχόμενα ἐπ’ αὐτόν ደግሞ በእርሱ ላይ የሚመጡትን ቅርብ ክስተቶች በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐξῆλθεν
