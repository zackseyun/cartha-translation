review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the narrative sequence, the mourners’ presence and consoling activity, Mary’s quick departure, their following her, and their inference. However, it omits ἐκεῖ (“there”) from the purpose clause. The quoted wording also slightly shifts the Greek indirect content into direct speech; indirect reporting more closely preserves the source construction.
  naturalness: The Amharic is generally clear and suitably modern. Recasting the participial description as “ከእርሷ ጋር የነበሩና የሚያጽናኗት” is smoother and expresses the contemporaneous action naturally. “ወደ መቃብር” avoids the potentially possessive sense of “መቃብሩ.”
  terminology: “አይሁድ” is a valid direct rendering of Ἰουδαῖοι here, and the lexical-alternative footnote appropriately preserves “የይሁዳ ሰዎች.” “መቃብር” appropriately renders μνημεῖον in this burial context.
  issues:
  - severity: medium
    issue: The adverb ἐκεῖ (“there”) is absent from the translation.
    rationale: The Greek explicitly says that they thought Mary was going to the tomb in order to weep there. Adding “በዚያ” restores this element without interpretive expansion.
  - severity: low
    issue: The direct quotation is less source-close than indirect reporting.
    rationale: δόξαντες ὅτι introduces their supposition in indirect content. Rendering it as “ወደ መቃብር ሄዳ በዚያ ልታለቅስ እንደምትሄድ አስበው” preserves this structure naturally.
  - severity: low
    issue: “መቃብሩ” can be read as “his tomb.”
    rationale: The Greek has the contextual definite noun τὸ μνημεῖον, not an explicitly possessive form. “ወደ መቃብር” is idiomatic in the directional phrase and does not introduce possessive wording.
