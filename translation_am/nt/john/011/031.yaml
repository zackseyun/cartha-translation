    text: ወይም፣ “የይሁዳ ሰዎች።” በዮሐንስ ወንጌል Ἰουδαῖοι የሚለው ቃል አንዳንድ ጊዜ በተለይ የይሁዳን ሰዎች ወይም የአይሁድን መሪዎች ሊያመለክት ይችላል፤ እዚህ ግን ከማርያም ጋር ሆነው የሚያጽናኗትን ቡድን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
