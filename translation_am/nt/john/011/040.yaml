  text: λέγει αὐτῇ ὁ Ἰησοῦς· Οὐκ εἶπόν σοι ὅτι ἐὰν πιστεύσῃς ⸀ὄψῃ τὴν δόξαν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/040.yaml
  text: Jesus said to her, “Did I not tell you that if you believe, you will see the glory of God?”
translation:
  language: am
  text: ኢየሱስ እንዲህ አላት፤ “ብታምኚ የእግዚአብሔርን ክብር ታያለሽ ብዬ አልነገርኩሽምን?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει αὐτῇ ὁ Ἰησοῦς
  choice: ኢየሱስም እንዲህ አላት
  rationale: የግሪኩን ታሪካዊ የአሁን ጊዜ ቅርጽ በተፈጥሯዊ የአማርኛ ትረካ እንደ አለፈ ድርጊት ይገልጻል፤ የሴት ተቀባይም በ‘አላት’ ተጠብቋል።
- source_word: Οὐκ εἶπόν σοι
  choice: ብዬ አልነገርኩሽምን?
  rationale: አዎንታዊ መልስ የሚጠብቀውን የግሪክ አሉታዊ የአጠያየቅ ቅርጽ እና ለማርታ የተነገረውን የሴት ነጠላ አድራሻ ይጠብቃል።
- source_word: ἐὰν πιστεύσῃς
  choice: ብታምኚ
  rationale: ሁኔታዊውን አገባብ በአጭርና ተፈጥሯዊ አማርኛ ያቀርባል፤ πιστεύωንም ያለ ተጨማሪ የእምነት ትርጓሜ ‘ማመን’ ብሎ ያስተላልፋል።
- source_word: ὄψῃ
  choice: ታያለሽ
  rationale: የወደፊቱን ተስፋ እና የሴት ነጠላ አድራሻ በግልጽ ይጠብቃል።
- source_word: τὴν δόξαν τοῦ θεοῦ
  choice: የእግዚአብሔርን ክብር
  rationale: δόξαን በተለመደውና በክብር ባለው ‘ክብር’ ይተረጉማል፤ የጄኒቲቭ ግንኙነቱንም ሳይገድብ ‘የእግዚአብሔርን’ ብሎ ያቀርባል።
theological_decisions:
- issue: እምነት ከእግዚአብሔር ክብር ማየት ጋር ያለው ግንኙነት
  choice: ንግግሩን ለማርታ እንደተሰጠ ቀጥተኛ ሁኔታዊ ተስፋ ማቅረብ
  alternative: እንደ አጠቃላይ የእምነትና የተአምራት መርሕ መተርጎም፣ ወይም ለአልዓዛር ትንሣኤ ብቻ የተገደበ ተስፋ አድርጎ መግለጽ
  rationale: ጥቅሱ ራሱ የትኛውንም ሰፊ የሥነ መለኮት ክርክር አይፈታም፤ ስለዚህ ትርጉሙ ሁኔታዊውን ንግግርና በአውዱ ያለውን ውጥረት እንዳለ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። ‘እንዲህ አላት’ የቀጥታ ንግግሩን ተፈጥሯዊ ያደርጋል፤ ‘አልነገርኩሽምን?’ የግሪኩን የአጠያየቅ ኃይል ይጠብቃል።
