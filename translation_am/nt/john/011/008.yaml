  rationale: ዋናው ጽሑፍ የቃሉን መሠረታዊ ትርጉም ይይዛል። ነገር ግን የዮሐንስ አጠቃቀም ብዙ ጊዜ ከአይሁድ ሕዝብ በሙሉ ይልቅ በይሁዳ ያሉ የኢየሱስ ተቃዋሚዎችን ስለሚያመለክት፣ ይህ ዐውዳዊ አማራጭ በግርጌ ማስታወሻ ተገልጿል።
