  yaml_path: translation/nt/john/011/008.yaml
  text: The disciples said to him[a], “Rabbi, just now the Jews were seeking to stone you, and are you going there again?”
translation:
  language: am
  text: ደቀ መዛሙርቱም፣ “ረቢ፣ አይሁድ[a] ከጥቂት ጊዜ በፊት በድንጋይ ሊወግሩህ ይፈልጉ ነበር፤ እንደገናም ወደዚያ ትሄዳለህ?” አሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የይሁዳ ሰዎች” ወይም፣ በዐውዱ፣ “የአይሁድ መሪዎች” ሊተረጎም ይችላል። ዮሐንስ “አይሁድ” የሚለውን ቃል ብዙ ጊዜ ለአይሁድ ሕዝብ በሙሉ ሳይሆን፣ በይሁዳ ለነበሩት የኢየሱስ ተቃዋሚዎች ይጠቀምበታል።
