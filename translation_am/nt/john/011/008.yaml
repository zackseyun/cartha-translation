lexical_decisions:
- source_word: λέγουσιν
  choice: አሉት
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ አገላለጽ በተፈጥሯዊ የአማርኛ ትረካ በአለፈ ጊዜ ተተርጉሟል።
- source_word: Ῥαββί
  choice: ረቢ
  rationale: በግሪኩ የተጻፈውን የሴማዊ መጠሪያ በድምፅ ቅርበት ማቆየት የደቀ መዛሙርቱን የአነጋገር መንገድና የዮሐንስን አጻጻፍ ይጠብቃል።
- source_word: νῦν
  choice: ከጥቂት ጊዜ በፊት
  rationale: ቃሉ በዚህ ዐውድ የድርጊቱን ቅርብ ጊዜነት ያመለክታል፤ ይህ ሐረግ ያንን ኃይል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐζήτουν
  choice: ይፈልጉ ነበር
  rationale: ያልተፈጸመ ወይም ቀጣይ የነበረ ሙከራን የሚያሳየውን የግሪክ ያልተጠናቀቀ ጊዜ ይጠብቃል።
- source_word: λιθάσαι
  choice: በድንጋይ ሊወግሩህ
  rationale: የድንጋይ ውግረትን በቀጥታ ይገልጣል፤ በግሪኩ በግልጽ ያልተጠቀሰውን “ሊገድሉህ” የሚል ቃል አይጨምርም።
- source_word: οἱ Ἰουδαῖοι
  choice: አይሁድ
  rationale: ይህ የቃሉን መሠረታዊ ትርጉም ይጠብቃል፤ በዮሐንስ ዐውድ ለይሁዳ ነዋሪዎች ወይም ለአይሁድ መሪዎች ሊያመለክት የሚችለው ጠባብ ትርጉም በማስታወሻ ተጠብቋል።
- source_word: πάλιν
  choice: እንደገና
  rationale: የቃሉ ቀጥተኛና ተፈጥሯዊ የአማርኛ አቻ ነው።
- source_word: ὑπάγεις
  choice: ትሄዳለህ
  rationale: ከተጠቀሰው ስፍራ ጋር ተያይዞ ወደዚያ መሄድን በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐκεῖ
  choice: ወደዚያ
  rationale: ቀድሞ የተጠቀሰውን አደገኛ ስፍራ፣ ይሁዳን፣ የሚመለከት የቦታ ተውሳክ ነው።
theological_decisions:
- issue: በዮሐንስ ወንጌል οἱ Ἰουδαῖοι የሚያመለክተው
  choice: አይሁድ
