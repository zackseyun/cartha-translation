review_pass:
  verdict: revise
  source_fidelity: The draft preserves Bethany, Jerusalem, the approximate force of ὡς, and the ancient measure. However, it renders the explicit spatial-nearness statement (ἐγγὺς) only indirectly through a distance expression, and its phrasing is not idiomatic Amharic.
  naturalness: “ከኢየሩሳሌም … ርቀት ላይ ነበረች” is awkward; a place is not naturally said to be “on a distance.” A direct statement of proximity followed by the approximate distance is clear and natural in modern standard Amharic.
  terminology: ቢታንያ and ኢየሩሳሌም are appropriate conventional biblical forms. ስታድዮን appropriately retains the source-culture unit. The footnote should be anchored to that unit rather than after the sentence-ending punctuation.
  issues:
  - severity: medium
    issue: The explicit sense of ἐγγὺς (‘near’) is not directly expressed.
    rationale: The source first characterizes Bethany as near Jerusalem, then gives the approximate distance. The revision preserves both elements.
  - severity: medium
    issue: The expression “ርቀት ላይ ነበረች” is unnatural Amharic.
    rationale: Using “ቅርብ ነበረች” and “የሚያህል ርቀት ላይ” supplies a natural locative construction.
  - severity: low
    issue: Footnote marker placement is detached from the measured term.
    rationale: The cultural note explains “ስታድዮን,” so its marker belongs immediately after that word and before the sentence punctuation.
  revised_text: ቢታንያ ለኢየሩሳሌም ቅርብ ነበረች፤ ከእርሷም አሥራ አምስት ስታድዮን[a] ያህል ርቀት ላይ ነበረች።
