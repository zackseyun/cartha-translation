- source_word: ἀπὸ σταδίων δεκαπέντε
  choice: አሥራ አምስት ስታድዮን … ርቀት ላይ
  rationale: የጥንቱን የርቀት መለኪያ በዋናው ጽሑፍ ጠብቆ፣ ἀπό የሚያሳየውን ከኢየሩሳሌም የተለካ ርቀት በግልጽ የአማርኛ አገባብ ያቀርባል።
