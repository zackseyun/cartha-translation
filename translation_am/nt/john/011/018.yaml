- source_word: Βηθανία
  choice: ቢታንያ
  rationale: የቦታው ስም በተለመደው የአማርኛ መጽሐፍ ቅዱሳዊ አጻጻፍ ተጽፏል።
- source_word: ἐγγὺς τῶν Ἱεροσολύμων
  choice: ከኢየሩሳሌም … ርቀት ላይ
