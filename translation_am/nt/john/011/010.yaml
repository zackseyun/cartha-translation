  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐὰν δέ τις περιπατῇ ἐν τῇ νυκτί, προσκόπτει, ὅτι τὸ φῶς οὐκ ἔστιν ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/010.yaml
  text: But if anyone walks in the night[a], he stumbles, because the light is not in him.
translation:
  language: am
  text: ነገር ግን ማንም በሌሊት ቢሄድ ብርሃኑ በውስጡ ስለሌለ ይሰናከላል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ብርሃኑ ከእርሱ ጋር ስለሌለ።» የግሪኩ ቃል በቀጥታ «በውስጡ» ይላል፤ ይህም ውጫዊ ብርሃን ከመጥፋቱ የበለጠ ነገር ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν δέ
  choice: ነገር ግን … ቢ-
  rationale: δέ የሚያሳየውን ንጽጽር በ«ነገር ግን»፣ ἐὰν የሚያሳየውን ሁኔታዊ አገላለጽ ደግሞ በ«ቢ-» ይጠብቃል።
- source_word: τις
  choice: ማንም
  rationale: ክፍትና አጠቃላይ የሆነውን የግሪኩን ያልተወሰነ ተውላጠ ስም በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: περιπατῇ
  choice: ቢሄድ
  rationale: የመራመድን ምስል ሳያጠፋ በዐውዱ ውስጥ ተፈጥሯዊ አማርኛን ይሰጣል፤ ዘይቤያዊ ኃይሉንም አይዘጋም።
- source_word: ἐν τῇ νυκτί
  choice: በሌሊት
  rationale: የሌሊትን ቀጥተኛ ምስል ይጠብቃል፤ ቀድሞ ወደ «ጨለማ» ትርጓሜ አይለውጠውም።
- source_word: προσκόπτει
  choice: ይሰናከላል
  rationale: አካላዊ መሰናከልንና ዘይቤያዊ ፍቺን አብሮ ሊሸከም የሚችል የተለመደ አማርኛ ነው።
- source_word: ὅτι
  choice: ስለ-
  rationale: የመሰናከሉን ምክንያት በግልጽ የምክንያት ግንኙነት ያቀርባል።
- source_word: τὸ φῶς
  choice: ብርሃኑ
  rationale: የግሪኩን የተወሰነ አመልካች በ«-ኑ» ይጠብቃል፣ በዐውዱም የታወቀውን ብርሃን ያመለክታል።
- source_word: οὐκ ἔστιν ἐν αὐτῷ
  choice: በውስጡ ስለሌለ
  rationale: ἐν αὐτῷ የሚለውን ቀጥተኛ «በውስጡ» ትርጉም ይጠብቃል፤ ንግግሩን ወደ ውጫዊ ብርሃን እጥረት ብቻ አይገድበውም።
theological_decisions:
- issue: «ብርሃኑ በውስጡ የለም» የሚለው አገላለጽ ፍቺ
  choice: ውስጣዊውን አገላለጽ «በውስጡ» እንዳለ ማቆየት
  alternative: «ብርሃኑ ከእርሱ ጋር የለም» ብሎ ለውጫዊ ብርሃን እጥረት ብቻ ማድረግ
  rationale: ἐν በተፈጥሮ «በ/ውስጥ» ማለት ነው። የዮሐንስ የብርሃንና የጨለማ አገላለጽ ጥልቅ መንፈሳዊ አንድምታ ሊኖረው ስለሚችል፣ «በውስጡ» ማለት ቀጥተኛውንና ጥልቅ ፍቺውን ሳይለያይ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የመራመድ፣ የሌሊት፣ የመሰናከልና የብርሃን ምስሎች ተጠብቀዋል፤ «በውስጡ» የሚለውም የግሪኩን እውነተኛ የፍቺ ውጥረት ይጠብቃል።
