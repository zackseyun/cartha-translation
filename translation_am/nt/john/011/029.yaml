  yaml_path: translation/nt/john/011/029.yaml
  text: And when she heard it[a], she got up quickly and went to him.
translation:
  language: am
  text: እርሷም ይህን በሰማች ጊዜ ፈጥና ተነሥታ ወደ እርሱ ሄደች።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκείνη
  choice: እርሷ
  rationale: አመልካቹ ቃል በቅርብ አውድ ያለችውን ማርያምን ያመለክታል፤ በአማርኛ «እርሷ» ተፈጥሯዊና ግልጽ ነው።
- source_word: δὲ
  choice: -ም
  rationale: እዚህ ጠንካራ ተቃርኖ ሳይሆን ትረካውን የሚያስቀጥል ለስላሳ አያያዥ ነው፤ የአማርኛው «-ም» ይህን ፍሰት በተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: ὡς
  choice: በ…ጊዜ
  rationale: ከአኦሪስት ግስ ጋር ያለው ὡς የጊዜ ግንኙነትን ያሳያል፤ «በሰማች ጊዜ» የግሪኩን ትርጉም ያለ አስፈላጊነት «ወዲያው» ብሎ ሳያጠናክር ያቀርባል።
- source_word: ἤκουσεν
  choice: ይህን በሰማች
  rationale: ግሱ «ሰማች» ማለት ሲሆን፣ «ይህን» የሚለው በቀደመው ቁጥር የተነገራትን መልእክት ያመለክታል።
- source_word: ἠγέρθη
  choice: ተነሥታ
  rationale: ምንም እንኳ ቅርጹ መደበኛ ተደራጊ ቢሆንም፣ በዚህ አውድ ራስ-ተነሳሽ «ተነሣች» የሚለውን ትርጉም ይሰጣል፤ ውጫዊ አድራጊን አያመለክትም።
- source_word: ταχὺ
  choice: ፈጥና
  rationale: ቃሉ ፈጣን ምላሽን ያሳያል፤ «ፈጥና» ወቅታዊ፣ ግልጽና ተፈጥሯዊ አገላለጽ ነው።
- source_word: ἤρχετο
  choice: ሄደች
  rationale: ኢምፐርፌክቱ ወደ እርሱ በመጓዝ ላይ መሆኗን ሊያጎላ ቢችልም፣ በአማርኛ ትረካ «ሄደች» የድርጊቱን ቅደም ተከተል በተፈጥሯዊ ሁኔታ ያቀርባል።
- source_word: πρὸς αὐτόν
  choice: ወደ እርሱ
  rationale: πρός ከተሳቢ ቅርጽ ጋር ወደ ሰው የሚደረግን እንቅስቃሴ ያመለክታል፤ «ወደ እርሱ» አቅጣጫውን በታማኝነት ይጠብቃል።
