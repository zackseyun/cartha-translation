id: JHN.11.11
reference: John 11:11
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ταῦτα εἶπεν, καὶ μετὰ τοῦτο λέγει αὐτοῖς· Λάζαρος ὁ φίλος ἡμῶν κεκοίμηται, ἀλλὰ πορεύομαι ἵνα ἐξυπνίσω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/011.yaml
  text: After saying these things[a], he said to them, “Lazarus our friend has fallen asleep, but I am going so that I may wake him up.”
translation:
  language: am
  text: እነዚህን ከተናገረ በኋላ እንዲህ አላቸው፦ “ወዳጃችን አልዓዛር አንቀላፍቷል።[a] እኔ ግን ላነቃው እሄዳለሁ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ይበልጥ ግልጽ በሆነ አነጋገር፣ “ሞቷል።” ኢየሱስ በዚህ ስፍራ ሞትን በእንቅልፍ ዘይቤ ይገልጻል፤ ደቀ መዛሙርቱም በሚቀጥሉት ቁጥሮች መጀመሪያ ይህን አልተረዱም።
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα εἶπεν, καὶ μετὰ τοῦτο
  choice: ይህን ከተናገረ በኋላ
  rationale: በግሪክ ያለውን የቀደመ ንግግርና የጊዜ ቅደም ተከተል በተፈጥሯዊ አማርኛ ያሳያል፤ የταῦταን ብዙ ቁጥር በቃል ባይደግምም በዐውዱ የቀደመውን ንግግር በሙሉ ያመለክታል።
- source_word: λέγει αὐτοῖς
  choice: አላቸው
  rationale: ታሪካዊውን የአሁን ጊዜ ግስ በተፈጥሯዊ የአማርኛ ትረካ ያቀርባል፣ የተናገረላቸውንም ተቀባዮች በግስ ውስጥ ያሳያል።
- source_word: Λάζαρος
  choice: አልዓዛር
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የተለመደውን የስሙን ቅርጽ ይከተላል።
- source_word: ὁ φίλος ἡμῶν
  choice: ወዳጃችን
  rationale: የግሪኩን የግንኙነትና የጋራ ባለቤትነት አጽንዖት በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: κεκοίμηται
  choice: አንቀላፍቷል
  rationale: ፍጹም ጊዜው የአሁኑን ሁኔታ ያሳያል፤ ለሞት የተጠቀመውን የእንቅልፍ ዘይቤ ጠብቆ በሚቀጥሉት ቁጥሮች ያለውን የደቀ መዛሙርቱን አለመረዳት አያስወግድም።
- source_word: ἀλλὰ πορεύομαι
  choice: እኔ ግን … እሄዳለሁ
  rationale: ἀλλά የሚያሳየውን ንፅፅር ግን በማለት፣ የπορεύομαιን ቅርብ የዓላማ ጉዞ ደግሞ እሄዳለሁ በማለት ያቀርባል።
- source_word: ἵνα ἐξυπνίσω αὐτόν
  choice: ከእንቅልፉ ላነቃው
  rationale: ἵνα ያለውን የዓላማ ኃይል በአማርኛ የዓላማ ግስ ይገልጣል፤ ἐξυπνίσω የእንቅልፍ ዘይቤውን በግልጽ ሁኔታ ይቀጥላል።
theological_decisions:
- issue: κεκοίμηται በቀጥታ «ሞቷል» ተብሎ ይተርጎም ወይስ የእንቅልፍ ዘይቤው ይጠበቅ?
  choice: ዘይቤውን «አንቀላፍቷል» በማለት በዋናው ጽሑፍ መጠበቅ
  alternative: «ሞቷል»
  rationale: ኢየሱስ ሞትን በእንቅልፍ ዘይቤ ይናገራል፤ ደቀ መዛሙርቱም በሚቀጥለው ትረካ ቃሉን በቀጥታ ይረዱታል። ዘይቤውን መጠበቅ ይህን የትረካ ውጥረትና የሞት ሥነ መለኮታዊ አገላለጽ እንዳለ ይተዋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «አንቀላፍቷል/ከእንቅልፉ ላነቃው» የሚለው ጥንድ የግሪኩን ተያያዥ ዘይቤ ይጠብቃል።
