base_translation:
  language: en
  yaml_path: translation/nt/john/011/027.yaml
  text: She said to him[a], “Yes, Lord; I have believed that you are the Messiah, the Son of God[b], the one coming into the world.”
translation:
  language: am
  text: እርሷም እንዲህ አለችው፦ “አዎን፣ ጌታ ሆይ፤ አንተ መሲሑ[a]፣ የእግዚአብሔር ልጅ፣ ወደ ዓለም የሚመጣው[b] እንደሆንህ አምኛለሁ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ክርስቶስ።” የግሪኩ Χριστός (ክሪስቶስ) እንደ ማዕረግ “የተቀባው” ማለት ሲሆን፣ እዚህ “መሲሕ” ተብሎ ተተርጉሟል።
    reason: alternative_reading
  - marker: b
    text: ወይም “ወደ ዓለም የሚመጣ።” የግሪኩ አካፋይ አገላለጽ ከኢየሱስ ማንነት ጋር እንደ ተያያዘ ገላጭ ሐረግም ሊቀርብ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: እርሷም እንዲህ አለችው
  rationale: የግሪኩ ግስ ታሪካዊ የአሁን ጊዜ ቢሆንም፣ በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜ ተመርጧል፤ የሴት ተናጋሪዋ ማርታ መሆኗ ከአውዱ ይታወቃል።
- source_word: Ναί
  choice: አዎን
  rationale: በውይይቱ ውስጥ ቀጥተኛና ተፈጥሯዊ ማረጋገጫ ነው።
- source_word: κύριε
  choice: ጌታ ሆይ
  rationale: የቀጥታ ንግግር ቅርጽንና በእምነት ኑዛዜው አውድ ያለውን አክብሮታዊ ክብደት ይጠብቃል።
- source_word: πεπίστευκα
  choice: አምኛለሁ
  rationale: የግሪኩ ፍጹም ጊዜ ቀድሞ የተመሠረተና አሁንም የጸና እምነትን ያመለክታል፤ ይህ ቅርጽ በዘመናዊ አማርኛ ተፈጥሯዊ ሆኖ የአሁኑን የእምነት ሁኔታ ይገልጣል።
- source_word: ὅτι
  choice: እንደሆንህ
  rationale: ማርታ ያመነችውን ይዘት ያስገባል እንጂ ምክንያትን አያመለክትም።
- source_word: ὁ χριστός
  choice: መሲሑ
  rationale: Χριστός በዚህ ስፍራ ስም ሳይሆን የተቀባውን የሚያመለክት መሲሐዊ ማዕረግ ነው።
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: የእግዚአብሔር ልጅ
  rationale: የተወሰነውን ክርስቶሎጂያዊ ማዕረግ በግልጽና በተለመደ አማርኛ ያስተላልፋል።
- source_word: ὁ εἰς τὸν κόσμον ἐρχόμενος
  choice: ወደ ዓለም የሚመጣው
  rationale: በመስተዋድድ የተወሰነውን የአሁን ጊዜ አካፋይ ቅርጽ እና የሚጠበቀው መጪ የመሆን ስሜት ይጠብቃል።
- source_word: κόσμον
