theological_decisions:
- issue: Χριστόςን በእምነት ኑዛዜ ውስጥ መተርጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: ጽሑፉ የኢየሱስን ማንነት በማዕረግ ይናገራል፤ “መሲሑ” የተቀባው የሚለውን አይሁዳዊና ንጉሣዊ ትርጉም በግልጽ ይጠብቃል።
- issue: κύριε በማርታ ንግግር ያለው ኃይል
  choice: ጌታ ሆይ
  alternative: ጌታዬ / ክቡርነትዎ
  rationale: በቀጣዩ የመሲሕና የእግዚአብሔር ልጅ ኑዛዜ አውድ፣ ከተራ ጨዋነት የላቀውን አክብሮታዊ እና ሃይማኖታዊ ክብደት ሳያጋንን ይጠብቃል።
- issue: የπεπίστευκα ፍጹም ጊዜ ኃይል
  choice: አምኛለሁ
  alternative: አምኜ ነበር / ለማመን ደርሻለሁ
  rationale: ቀድሞ የተመሠረተና በአሁኑ ጊዜ የቀጠለ እምነትን በተፈጥሯዊ አማርኛ ይገልጣል፤ አማራጮቹ ወይም የቀጣይነቱን ኃይል ያዳክማሉ ወይም ተጨማሪ የእድገት ሐሳብ ያስገባሉ።
