  rationale: የአልዓዛርን ሁኔታ በግልጽ፣ ተፈጥሯዊና ከልክ በላይ ሕክምናዊ ባልሆነ ቃል ይገልጻል።
- source_word: οὐκ ἔστιν πρὸς θάνατον
  choice: ለሞት አይደለም
  rationale: πρός ከተሳቢ ጋር የሚገልጸውን መድረሻ፣ ውጤት ወይም ዓላማ በአጭር አማርኛ ይጠብቃል፤ አልዓዛር በትረካው ውስጥ መሞቱን ሳይክድ፣ ሞት የሕመሙ የመጨረሻ ውጤት አለመሆኑን ለመረዳት ቦታ ይሰጣል።
- source_word: ὑπὲρ τῆς δόξης τοῦ θεοῦ
  choice: ለእግዚአብሔር ክብር
  rationale: ὑπέρ እዚህ የሚያሳየውን ዓላማ ወይም ጥቅም ያስተላልፋል፤ δόξα ደግሞ “ክብር” ተብሎ ተጠብቋል።
- source_word: ἵνα δοξασθῇ
  choice: እንዲከብር
  rationale: ἵνα የሚያሳየውን ዓላማ በአማርኛው “እንዲ-” አወቃቀር ይገልጻል፤ የግሪኩ ተደራጊ ቅርጽም በአማርኛ ተፈጥሯዊ በሆነ መንገድ ተላልፏል።
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: የእግዚአብሔር ልጅ
  rationale: የክርስቶስን ማዕረግ በመደበኛና ግልጽ አማርኛ በቀጥታ ይተረጉማል።
- source_word: δι’ αὐτῆς
