  alternative: “አይገድልም” ወይም “ሞትን አያስከትልም” ብሎ እንደ ፍጹም ትንቢት መተርጎም
  rationale: በዮሐንስ 11፥14 አልዓዛር እንደሞተ በግልጽ ይነገራል። ስለዚህ የπρόςን የመድረሻ/ዓላማ ኃይል ጠብቆ የትረካውን ውጥረት ሳይፈታ ማቅረብ ተመራጭ ነው።
- issue: የእግዚአብሔር ክብርና የእግዚአብሔር ልጅ መክበር ያላቸው ግንኙነት
  choice: ሁለቱንም አረፍተ ነገሮች ለየብቻ በግልጽ ማቆየት
  alternative: ሁለቱን በአንድ አጠቃላይ የመለኮታዊ ክብር ንግግር ውስጥ ማዋሃድ
  rationale: ግሪኩ ሕመሙ ለእግዚአብሔር ክብር መሆኑንና በእርሱም የእግዚአብሔር ልጅ እንዲከብር የሚለውን ዓላማ በግልጽ ያስተሳስራል።
