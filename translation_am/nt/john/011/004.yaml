base_translation:
  language: en
  yaml_path: translation/nt/john/011/004.yaml
  text: But when Jesus heard it[a], he said, “This sickness is not unto death, but for the glory of God, so that the Son of God may be glorified through it.”
translation:
  language: am
  text: ኢየሱስም ይህን ሲሰማ፣ “ይህ ሕመም ለሞት አይሆንም[a]፤ ነገር ግን በዚህ ሕመም የእግዚአብሔር ልጅ እንዲከበር ለእግዚአብሔር ክብር ነው” አለ።
  philosophy: optimal-equivalence
  footnotes:
