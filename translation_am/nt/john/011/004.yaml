lexical_decisions:
- source_word: ἀκούσας δὲ ὁ Ἰησοῦς
  choice: ኢየሱስም ይህን ሲሰማ
  rationale: የግሪኩን የጊዜ አገናኝ ተሳቢ ግስ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ “ይህን” የሚለው ከአውዱ የታወቀውን ስለ አልዓዛር ሕመም የመጣውን ወሬ ያመለክታል። δέ ደግሞ በ“-ም” ቀላል የትረካ ሽግግር ሆኖ ተገልጧል።
- source_word: ἀσθένεια
