- from: ኢየሱስም ይህን ሲሰማ፣ “ይህ ሕመም ለሞት አይደለም[a]፤ ነገር ግን የእግዚአብሔር ልጅ በእርሱ እንዲከብር፣ ለእግዚአብሔር ክብር ነው” አለ።
  to: ኢየሱስም ይህን ሲሰማ፣ “ይህ ሕመም ለሞት አይሆንም[a]፤ ነገር ግን በዚህ ሕመም የእግዚአብሔር ልጅ እንዲከበር ለእግዚአብሔር ክብር ነው” አለ።
