- source_word: τὸ πάσχα τῶν Ἰουδαίων
  choice: የአይሁድ ፋሲካ
  rationale: የግሪኩን የባለቤትነት አወቃቀርና በዮሐንስ የሚደጋገመውን አገላለጽ በግልጽ ሁኔታ ይጠብቃል።
- source_word: ἀνέβησαν
