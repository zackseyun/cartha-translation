base_translation:
  language: en
  yaml_path: translation/nt/john/011/055.yaml
  text: The Passover of the Jews was near[b][a], and many went up to Jerusalem from the countryside before the Passover to purify themselves.
translation:
  language: am
  text: የአይሁድ ፋሲካ[a] ቀርቦ ነበር፤ ብዙዎችም ከፋሲካው በፊት ራሳቸውን ለማንጻት[b] ከገጠር ወደ ኢየሩሳሌም ወጡ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ግሪኩ ቃል በቃል “የአይሁድ ፋሲካ” ይላል፤ ይህ በዮሐንስ የሚደጋገም አገላለጽ ነው። ትርጉሙም “አይሁዳዊው ፋሲካ” ሊባል ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ይህም ለፋሲካው ለመዘጋጀት የሥርዓት ንጽሕናን መፈጸም ማለት ነው።
    reason: cultural_note
lexical_decisions:
