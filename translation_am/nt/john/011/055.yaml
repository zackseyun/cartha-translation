- source_word: ἵνα ἁγνίσωσιν ἑαυτούς
  choice: ራሳቸውን ለማንጻት
  rationale: ἵνα የሚያሳየውን ዓላማ ይጠብቃል፤ የሥርዓታዊ ንጽሕናውን ሙሉ ማብራሪያ ግን ወደ ማስታወሻው ያስተላልፋል።
