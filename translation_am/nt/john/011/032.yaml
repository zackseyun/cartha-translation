  edition: SBLGNT
  text: ἡ οὖν ⸀Μαριὰμ ὡς ἦλθεν ὅπου ⸀ἦν Ἰησοῦς ἰδοῦσα αὐτὸν ἔπεσεν αὐτοῦ ⸀πρὸς τοὺς πόδας, λέγουσα αὐτῷ· Κύριε, εἰ ἦς ὧδε οὐκ ἄν ⸂μου ἀπέθανεν⸃ ὁ ἀδελφός.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/032.yaml
  text: So when Mary came where Jesus was and saw him[a], she fell at his feet, saying to him, “Lord, if you had been here, my brother would not have died.”
translation:
  language: am
  text: እንግዲህ ማርያም ኢየሱስ ወዳለበት ስፍራ በደረሰችና ባየችው ጊዜ፣ በእግሩ ሥር ወደቀችና፣ “ጌታ ሆይ[a]፣ አንተ እዚህ ብትገኝ ኖሮ፣ ወንድሜ ባልሞተ ነበር” አለችው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ጌታ ሆይ” ወይም “ክቡር ሆይ።” የግሪክኛው κύριε በአክብሮት የሚነገር አጠራር ሊሆን ይችላል፤ እዚህ ግን κύριος በተለምዶ “ጌታ” ተብሎ ስለሚተረጎምና ወንጌሉ ኢየሱስን ከሚያቀርብበት መንገድ ጋር ስለሚስማማ “ጌታ ሆይ” ተብሏል።
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ትረካ ጋር ያለውን የውጤትና የትረካ ቀጣይነት ያሳያል።
- source_word: ὡς ἦλθεν ὅπου ἦν Ἰησοῦς
  choice: ኢየሱስ ወዳለበት ቦታ በደረሰች ... ጊዜ
  rationale: ὡς የጊዜ አገናኝ መሆኑንና ὅπου ἦν Ἰησοῦς የሚያመለክተውን ስፍራ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἰδοῦσα αὐτόν
  choice: ባየችው ጊዜ
  rationale: የአንቀጹን አብሮ የተከናወነ ሁኔታ በተፈጥሯዊ የአማርኛ ጊዜ አገባብ ያቀርባል።
- source_word: ἔπεσεν αὐτοῦ πρὸς τοὺς πόδας
  choice: በእግሩ ሥር ወድቃ
  rationale: በአንድ ሰው እግር ፊት መውደቅን የሚገልጸውን ግሪክኛ አገላለጽ በተለመደ አማርኛ ያስተላልፋል።
- source_word: λέγουσα αὐτῷ
  choice: አለችው
  rationale: ተሳቢውንና የቀጥታ ንግግሩን በአማርኛ ተፈጥሯዊ አወቃቀር ያቀርባል።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: κύριε የአክብሮት አጠራር ሊሆን ቢችልም፣ የዮሐንስን ትረካዊና ሥነ መለኮታዊ ክብደት ሳያሳንስ የተለመደውን የκύριος ትርጉም ይጠብቃል።
- source_word: εἰ ἦς ὧδε ... οὐκ ἄν ἀπέθανεν
  choice: አንተ እዚህ ብትኖር ኖሮ ... ባልሞተም ነበር
  rationale: በቀድሞ ጊዜ ያልተፈጸመ ተቃራኒ-ሐቅ ሁኔታንና ውጤቱን ትክክለኛ በሆነ የአማርኛ ሁኔታዊ አገባብ ይገልጻል።
- source_word: μου ὁ ἀδελφός
  choice: ወንድሜ
  rationale: የμουን ባለቤትነት በአማርኛ የተፈጥሮ ቅጥያ ያሳያል።
theological_decisions:
- issue: ማርያም ኢየሱስን κύριε ብላ መጥራቷ
  choice: ጌታ ሆይ
  alternative: ጌታዬ ሆይ / ክቡር ሆይ
  rationale: “ጌታ ሆይ” የκύριοςን መደበኛ ትርጉምና በዮሐንስ ወንጌል ያለውን ክብደት ይጠብቃል፤ ሆኖም ቃሉ በራሱ ብቻ የሙሉ ሥነ መለኮታዊ እምነት መግለጫ መሆኑን አያስገድድም።
