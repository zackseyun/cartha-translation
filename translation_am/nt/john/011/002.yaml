base_translation:
  language: en
  yaml_path: translation/nt/john/011/002.yaml
  text: It was Mary who had anointed the Lord with perfume and wiped his feet with her hair[a], whose brother Lazarus was sick.
translation:
  language: am
  text: ጌታን በሽቶ[a] ቀብታ፣ እግሮቹንም በጸጉሯ ያበሰችው ማርያም ነበረች፤ ወንድሟ አልዓዛር ታሞ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በቅባት» ወይም «መዓዛ ባለው ዘይት»፤ የግሪኩ ቃል መዓዛ ያለውን ዘይት ወይም ቅባት ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ Μαριὰμ ἡ ἀλείψασα
  choice: ይህች ማርያም … ቀብታ … ያበሰችው ነበረች
  rationale: የግሪኩ አንቀጽና ያለፈ ጊዜ አሳታፊ ቅርጽ ማርያምን በሠራችው ድርጊት ይለያታል። በአማርኛ ይህን በተፈጥሯዊ የአንጻራዊ ሐረግ አወቃቀር ተርጉሟል፤ δέ በዐውዱ ውስጥ ያለውን ቀላል ሽግግር እንጂ ግልጽ የጊዜ ቃል አያመለክትም።
- source_word: τὸν κύριον
  choice: ጌታን
  rationale: κύριος እዚህ ለኢየሱስ የተሰጠ የክብር ማዕረግ ነው፤ «ጌታ» የተለመደና ክብደቱን የሚጠብቅ አቻ ነው።
- source_word: μύρῳ
  choice: በሽቶ
  rationale: μύρον መዓዛ ያለውን ዘይት ወይም ቅባት ያመለክታል። «ሽቶ» ለዘመናዊ አንባቢ ግልጽ ሲሆን የቃሉ ሌሎች ቅርብ አቻዎች በማስታወሻ ተጠቅሰዋል።
- source_word: καὶ ἐκμάξασα τοὺς πόδας αὐτοῦ ταῖς θριξὶν αὐτῆς
  choice: እግሮቹን በጸጉሯ ያበሰችው
  rationale: ἐκμάσσω ማበስን ወይም ጠርጎ ማድረቅን ያመለክታል፤ የመሣሪያ ዳቲቩም በአማርኛ «በጸጉሯ» ተብሎ በተፈጥሮ ተገልጿል።
- source_word: ἧς ὁ ἀδελφὸς Λάζαρος ἠσθένει
  choice: የታመመው አልዓዛር ወንድሟ ነበር
  rationale: የዝምድናውን ግንኙነትና የአልዓዛርን ሕመም በግልጽና ተፈጥሯዊ የአማርኛ ቃል ቅደም ተከተል ይጠብቃል።
theological_decisions:
- issue: κύριος ለኢየሱስ ሲያገለግል አተረጓጎሙ
  choice: ጌታ
  alternative: መምህር / አለቃ
  rationale: «ጌታ» የትረካውንና የሥነ መለኮት ክብደት ሳያቀልል የክብር ማዕረጉን ይጠብቃል፤ ከዐውዱ በላይ የሆነ ልዩ ትርጓሜም አይጭንም።
