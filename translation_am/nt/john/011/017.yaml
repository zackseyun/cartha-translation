  text: Ἐλθὼν οὖν ὁ Ἰησοῦς εὗρεν αὐτὸν τέσσαρας ⸂ἤδη ἡμέρας⸃ ἔχοντα ἐν τῷ μνημείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/017.yaml
  text: So when Jesus arrived, he found that Lazarus had already been in the tomb four days.
translation:
  language: am
  text: ኢየሱስም በደረሰ ጊዜ፣ አልዓዛር በመቃብር ውስጥ አስቀድሞ አራት ቀን እንደቆየ አገኘ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλθὼν
  choice: በደረሰ ጊዜ
  rationale: የግሪኩ የቀደመ ድርጊት አመልካች አንቀጽ ከዋናው ግስ ጋር ያለውን ጊዜያዊ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ትረካ ጋር ያለውን ውጤታዊና ትረካዊ ትስስር ያስቀጥላል።
- source_word: εὗρεν
  choice: አገኘ
  rationale: በትረካው ውስጥ የεὑρίσκωን መሠረታዊ ትርጉም ቀጥተኛና ተፈጥሯዊ በሆነ አማርኛ ይገልጣል።
- source_word: αὐτὸν
  choice: አልዓዛር
  rationale: ተውላጠ ስሙ በአውዱ አልዓዛርን ያመለክታል፤ ስሙን በግልጽ ማቅረብ በአማርኛ የማጣቀሻ ግራ መጋባትን ያስወግዳል።
- source_word: τέσσαρας ἤδη ἡμέρας ἔχοντα
  choice: ከገባ አራት ቀን እንደሆነው
  rationale: የግሪኩን የቆይታ ጊዜ አገላለጽ በተፈጥሯዊ አማርኛ ያቀርባል፤ ἤδη የሚያሳየው ጊዜው አስቀድሞ መሙላቱ በዐውደ ንግግሩ ውስጥ ተጠብቋል።
- source_word: μνημείῳ
  choice: መቃብር
  rationale: በዚህ ዐውድ ቃሉ የቀብር ስፍራን ያመለክታል፤ “መቃብር” ትክክለኛ፣ የተለመደና ክብር ያለው የአማርኛ አቻ ነው።
theological_decisions:
- issue: የαὐτόνን ማጣቀሻ በስም መግለጽ
  choice: “አልዓዛር” ብሎ በግልጽ መጥቀስ
  alternative: “እርሱን” ብሎ ተውላጠ ስሙን ማቆየት
  rationale: ይህ የሥነ መለኮት ክርክር ሳይሆን የግልጽነት ውሳኔ ነው። በግሪኩ ማጣቀሻው ከአውዱ ግልጽ ነው፤ በአማርኛ ስሙን መጥቀስ ትርጉሙን ሳይጨምር ግራ መጋባትን ይከላከላል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። አስፈላጊ ያልሆነ ጥንታዊ አገላለጽ አልገባም።
