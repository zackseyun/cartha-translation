review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies Jesus, Lazarus, the tomb, and the four-day duration. However, «ከገባ» (“since he entered”) introduces a specific action not expressed in the Greek, while the wording does not explicitly render ἤδη (“already”).
  naturalness: «ከገባ አራት ቀን እንደሆነው አገኘ» is not idiomatic modern standard Amharic for this duration statement. «አስቀድሞ አራት ቀን እንደቆየ አገኘ» is clear and natural.
  terminology: «ኢየሱስ», «አልዓዛር», and «መቃብር» are appropriate standard biblical terms. Explicitly naming Lazarus is a permissible clarity rendering of αὐτόν.
  issues:
  - severity: medium
    issue: «ከገባ» adds an action absent from the source.
    rationale: ἔχοντα ἐν τῷ μνημείῳ states that Lazarus had already been/in the tomb for four days; it does not explicitly say “since he entered.”
  - severity: medium
    issue: ἤδη (“already”) is not explicitly represented.
    rationale: The Greek adverb is part of the stated temporal emphasis and should be retained in the Amharic wording.
  - severity: medium
    issue: The duration clause is awkward in modern Amharic.
    rationale: «ከገባ አራት ቀን እንደሆነው» is structurally unnatural; a verb of remaining/staying provides an idiomatic duration expression without adding meaning.
  revised_text: ኢየሱስም በደረሰ ጊዜ፣ አልዓዛር በመቃብር ውስጥ አስቀድሞ አራት ቀን እንደቆየ አገኘ።
  revised_footnotes: []
