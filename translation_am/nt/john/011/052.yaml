source:
  edition: SBLGNT
  text: καὶ οὐχ ὑπὲρ τοῦ ἔθνους μόνον, ἀλλ’ ἵνα καὶ τὰ τέκνα τοῦ θεοῦ τὰ διεσκορπισμένα συναγάγῃ εἰς ἕν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/052.yaml
  text: and not for the nation only[b][a], but also so that he might gather into one the scattered children of God.
translation:
  language: am
  text: እንዲሁም ለአይሁድ ሕዝብ[a] ብቻ ሳይሆን፣ ተበታትነው ያሉትን የእግዚአብሔር ልጆችም አንድ አድርጎ እንዲሰበስብ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «የአይሁድ» የሚለው ከዐውዱ የተገለጸ ነው፤ ግሪኩ ቃል በቃል «ሕዝቡ» ወይም «ብሔሩ» ይላል።
    reason: cultural_note
lexical_decisions:
- source_word: ἔθνους
  choice: የአይሁድ ሕዝብ
  rationale: በቅርብ ዐውዱ ἔθνος የአይሁድን ሕዝብ ያመለክታል። በአማርኛ «ሕዝብ» የአንድን ማኅበረሰብ ድምር ማንነት በተፈጥሯዊ ሁኔታ ያስተላልፋል፤ «የአይሁድ» ደግሞ ከዐውዱ የተገኘውን ማጣቀሻ ግልጽ ያደርጋል።
- source_word: ἵνα
  choice: እንዲሰበስብ
  rationale: የዓላማን ኃይል በተፈጥሯዊ የአማርኛ ተያያዥ ግስ ያስተላልፋል።
- source_word: τέκνα τοῦ θεοῦ
  choice: የእግዚአብሔር ልጆች
  rationale: τέκνα ወንድና ሴትን የሚያካትት «ልጆች» ነው፤ የወንድ ልጅነትን ብቻ አያመለክትም።
- source_word: τὰ διεσκορπισμένα
  choice: ተበታትነው ያሉትን
  rationale: ፍጹም ተደራጊ አካፋይ የሚገልጸውን፣ ከመበታተናቸው የተነሣ አሁን በተበታተነ ሁኔታ መኖራቸውን ይጠብቃል።
- source_word: συναγάγῃ
  choice: እንዲሰበስብ
  rationale: ከἵνα ጋር ያለውን የዓላማ አንቀጽ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: εἰς ἕν
  choice: አንድ አድርጎ
  rationale: ግሪኩ ያልገለጸውን «አካል» ወይም «ኅብረት» ሳይጨምር፣ ወደ አንድነት የማምጣትን ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: καὶ οὐχ ὑπὲρ τοῦ ἔθνους μόνον, ἀλλ’
  choice: ለአይሁድ ሕዝብ ብቻ ሳይሆን … ልጆችም
  rationale: ከቀደመው ቁጥር የሚቀጥለውን፣ ኢየሱስ ስለሌሎች መሞቱን የሚገልጽ የὑπέρ ግንኙነት በ«ለ» ይጠብቃል፤ οὐ…μόνον ἀλλά καί የሚለውም «ብቻ ሳይሆን…ም» ተብሎ ተላልፏል።
theological_decisions:
- issue: «የእግዚአብሔር ልጆች» ማንነት
  choice: ከአይሁድ ሕዝብ የሰፋ፣ በኢየሱስ ሞት አንድ የሚሆን ተበታትኖ ያለ የእግዚአብሔር ሕዝብ በሚል ክፍት አገላለጽ መተርጎም
  alternative: የዲያስፖራ አይሁድ ብቻ፣ ወይም ከአይሁድና ከአሕዛብ የተመረጡ አማኞች ብቻ ብሎ መወሰን
  rationale: ጥቅሱ «ሕዝቡን» ከሰፊውና ከተበታተነው የእግዚአብሔር ልጆች ጋር ያነጻጽራል፤ ትርጉሙ ግሪኩ ያልወሰነውን ትክክለኛ ወሰን አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። የዓላማ አንቀጹና የεἰς ἕν አጭር ሥነ መለኮታዊ ስፋት ተጠብቀዋል።
