  text: So the Jews were saying[a], “See how he loved him!”
translation:
  language: am
  text: ስለዚህ አይሁድ[a]፣ “እንዴት ይወደው እንደ ነበር ተመልከቱ!” እያሉ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ በአውዱ ውስጥ በዚያ የነበሩትን አይሁዳውያን ታዛቢዎች በክልላዊ ሁኔታ ካመለከተ፣ “የይሁዳ አውራጃ ሰዎች።”
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγον
  choice: ይሉ ነበር
  rationale: ያልተፈጸመው የግሪክ ግስ በትዕይንቱ ውስጥ ንግግሩ ቀጣይ ወይም ተደጋጋሚ እንደነበር ያሳያል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ቁጥር ከኢየሱስ ማልቀስ የተነሣውን መደምደሚያ ወይም የትረካ ቅጥልጥል ያስተላልፋል።
- source_word: οἱ Ἰουδαῖοι
  choice: አይሁድ
  rationale: የግሪኩን የተለመደ የዮሐንስ አጠራር በቀጥታ ያስቀምጣል፤ በዚህ አውድ ግን በስፍራው የነበሩትን አይሁዳውያን ታዛቢዎች ያመለክታል።
- source_word: Ἴδε
  choice: ተመልከቱ
  rationale: ትኩረትን የሚጠራ ትእዛዝ ሲሆን በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: πῶς
  choice: እንዴት
  rationale: የፍቅሩን ሁኔታም ሆነ መጠን የሚያሳየውን የግሪኩን አሻሚነት ሳይወስን ይጠብቃል።
- source_word: ἐφίλει
  choice: ይወደው እንደነበር
  rationale: φιλέω በዚህ ስፍራ የግል ፍቅርና ቅርበትን ያመለክታል፤ ‘ይወደው’ ይህን በተፈጥሯዊና ክብር ባለው አማርኛ ይገልጣል።
- source_word: αὐτόν
  choice: ይወደው
  rationale: በግሱ ውስጥ ያለው ‘-ው’ ተሳቢ ተውላጠ ስም አልዓዛርን ያመለክታል።
theological_decisions:
- issue: በዮሐንስ ወንጌል οἱ Ἰουδαῖοι የሚለውን መተርጎም
  choice: አይሁድ
  alternative: የይሁዳ አውራጃ ሰዎች
  rationale: ዋናው ጽሑፍ የምንጩን ሰፊ አጠራር ይጠብቃል። አውዱ ግን አጠቃላይ የዘር ውንጀላን ሳይሆን በዚያ የነበሩትን አይሁዳውያን ሐዘንተኞችና ታዛቢዎች ያመለክታል፤ ክልላዊው አማራጭ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የአማርኛ አገላለጽ ተጠቅሟል። የቀጣይ ንግግር ገጽታ ‘ይሉ ነበር’ በሚለው ተጠብቋል፤ πῶς የሚያሳየው የሁኔታና የመጠን አሻሚነትም ‘እንዴት’ በሚለው ሳይፈታ ቀርቷል።
