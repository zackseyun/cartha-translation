  edition: SBLGNT
  text: οὐδὲ ⸀λογίζεσθε ὅτι συμφέρει ⸀ὑμῖν ἵνα εἷς ἄνθρωπος ἀποθάνῃ ὑπὲρ τοῦ λαοῦ καὶ μὴ ὅλον τὸ ἔθνος ἀπόληται.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/050.yaml
  text: Nor do you consider that it is better for you that one man die for the people[a], and not that the whole nation perish.
translation:
  language: am
  text: ደግሞም አንድ ሰው ስለ ሕዝቡ[a] ቢሞት፣ መላው ብሔር ከሚጠፋ ይልቅ፣ ለእናንተ እንደሚሻል አታስቡም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በሕዝቡ ወገን”፤ ሐረጉ “በሕዝቡ ፈንታ” የሚል ትርጉምም ሊይዝ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: ደግሞም ... አታስቡም
  rationale: ከቀደመው ነቀፋ ጋር የሚያያዘውን አሉታዊ አገናኝ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: λογίζεσθε
  choice: አታስቡም
  rationale: በዐውዱ ውስጥ ማመዛዘንንና ጥቅምን አስልቶ ማሰብን ያመለክታል፤ ይህ አገላለጽ ለዘመናዊ አንባቢ ቀጥተኛና ተፈጥሯዊ ነው።
- source_word: συμφέρει ὑμῖν
  choice: ለእናንተ እንደሚሻል
  rationale: ለተናጋሪዎቹ የሚገኘውን ተግባራዊ ጥቅም ወይም የተሻለ አማራጭ ያሳያል።
- source_word: εἷς ἄνθρωπος
  choice: አንድ ሰው
  rationale: የግሪኩን ነጠላነትና አንድን ግለሰብ ለይቶ የማቅረብ ኃይል ይጠብቃል።
- source_word: ἀποθάνῃ
  choice: ቢሞት
  rationale: በἵνα ሐረግ ያለውን የግስ ይዘት በተፈጥሯዊ የአማርኛ ሁኔታዊ አገላለጽ ያቀርባል።
- source_word: ὑπὲρ τοῦ λαοῦ
  choice: ስለ ሕዝቡ
  rationale: ለሕዝቡ ጥቅም፣ በሕዝቡ ወገን ወይም በሕዝቡ ፈንታ የሚለውን ሰፊ የትርጉም ክልል ሳያጠብ ይይዛል፤ ዋናው ጽሑፍ አንዱን ብቻ እንዳይወስን አማራጩ በማስታወሻ ተጠቅሷል።
- source_word: ὅλον τὸ ἔθνος
  choice: መላው ብሔር
  rationale: ከλαός ‘ሕዝብ’ የሚለውን ለይቶ፣ በዚህ ዐውድ የፖለቲካና የዘር ማኅበረሰብ አጠቃላይነትን ያሳያል።
- source_word: ἀπόληται
  choice: ባይጠፋ
  rationale: የሙሉ ብሔሩን ጥፋት ወይም ውድመት በአጭርና ከባድ አገላለጽ ያስተላልፋል።
theological_decisions:
- issue: ὑπὲρ የሚለው ቃል ከኢየሱስ ሞት ጋር ያለው ትርጉም
  choice: በዋናው ጽሑፍ “ስለ ሕዝቡ” ተብሎ በሰፊው ተተርጉሟል።
  alternative: “ለሕዝቡ ጥቅም”፣ “በሕዝቡ ወገን” ወይም “በሕዝቡ ፈንታ”
  rationale: ቀያፋ በቅርብ ዐውዱ የፖለቲካ ጥቅምን እየገለጸ ሲሆን፣ ወንጌላዊው በቀጣዩ ቁጥር ንግግሩን ሳያውቅ እንደተናገረው ትንቢት ያቀርበዋል። ሰፊው አገላለጽ የፖለቲካ ጥቅሙንም ሆነ የመሥዋዕትና የምትክነት ፍንጩን አንዱን ብቻ ሳያስገድድ ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። “ሕዝብ” እና “ብሔር” በመለየት የλαός እና ἔθνος ልዩነት ተጠብቋል።
