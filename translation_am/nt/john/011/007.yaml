  yaml_path: translation/nt/john/011/007.yaml
  text: Then after this he says to the disciples[a], “Let us go into Judea again.”
translation:
  language: am
  text: ከዚህም በኋላ ለደቀ መዛሙርቱ፣ “እንደገና ወደ ይሁዳ[a] እንሂድ” ይላል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪክ መስተዋድድ በዚህ አውድ “ወደ ይሁዳ” ወይም “ወደ ይሁዳ ውስጥ” ተብሎ ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα μετὰ τοῦτο
  choice: ከዚህም በኋላ
  rationale: ሁለቱንም የጊዜ ቅደም ተከተል መግለጫዎች በተፈጥሯዊ አማርኛ ያስተላልፋል፤ በቃል መደጋገም ሳይከብድ የግሪኩን ትኩረት ይጠብቃል።
- source_word: λέγει
  choice: ይላቸዋል
  rationale: በዮሐንስ ትረካ የተጠቀሰውን ታሪካዊ የአሁን ጊዜ ግስ ይጠብቃል፤ የተናገረላቸውን ሰዎችም በተፈጥሯዊ አማርኛ በግሱ ውስጥ ያመለክታል።
- source_word: τοῖς μαθηταῖς
  choice: ደቀ መዛሙርቱን
  rationale: በዐውዱ የታወቁትን ደቀ መዛሙርት ያመለክታል፤ በግሪኩ በግልጽ ያልተጻፈውን ‘የእርሱን’ የሚል ቃል አይጨምርም።
- source_word: Ἄγωμεν
  choice: እንሂድ
  rationale: የአንደኛ መደብ ብዙ ቁጥር አበረታች ንዑስ አንቀጽን በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: εἰς τὴν Ἰουδαίαν
  choice: ወደ ይሁዳ
  rationale: ወደ ስፍራ የሚደረግን እንቅስቃሴ በተለመደ አማርኛ ይገልጣል፤ εἰς የመድረስንም ሆነ ወደ ውስጥ የመግባትን አቅጣጫ ሊያመለክት የሚችለው ልዩነት በማስታወሻ ተጠብቋል።
- source_word: πάλιν
  choice: እንደገና
  rationale: ቀድሞ ወደተጎበኘው ክልል መመለስን በቀጥታና በተፈጥሯዊ ሁኔታ ይገልጣል።
theological_decisions:
- issue: በዮሐንስ ትረካ የተጠቀሰው ታሪካዊ የአሁን ጊዜ
  choice: የአሁን ጊዜውን ‘ይላቸዋል’ በማለት መጠበቅ
  alternative: ወደ አለፈ ጊዜ በማለስ ‘አላቸው’ ማለት
  rationale: ይህ በዋነኝነት የትርጉምና የትረካ ዘይቤ ውሳኔ ነው። የአሁን ጊዜውን መጠበቅ የዮሐንስን ሕያው የትረካ ቅርጽ ያንጸባርቃል፤ ልዩ የሥነ መለኮት ትርጓሜ አይጨምርም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። ‘ደቀ መዛሙርት’ የተለመደውን መጽሐፍ ቅዱሳዊ ቃል ይጠብቃል፤ የዐረፍተ ነገሩ አወቃቀር ግን ተፈጥሯዊ የዘመናዊ አማርኛ ነው።
