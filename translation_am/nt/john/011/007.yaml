  verdict: revise
  source_fidelity: The draft accurately conveys the sequence, the historical-present narration, the hortatory invitation, the destination, and the sense of return. However, the form ደቀ መዛሙርቱን with ይላቸዋል treats the disciples both as a direct object and as recipients; the Greek has a dative recipient (“to the disciples”).
  naturalness: The revised wording uses the ordinary Amharic indirect-object construction and retains a clear, dignified modern biblical register. The quotation and its footnote anchor remain natural and clear.
  terminology: ደቀ መዛሙርት, ይሁዳ, and እንደገና are appropriate established terms. The footnote is adjusted to modern spelling and phrasing while preserving the stated lexical alternative.
  issues:
  - severity: medium
    issue: Recipient case/construction for τοῖς μαθηταῖς
    rationale: In ደቀ መዛሙርቱን፣ “...” ይላቸዋል, the accusative marker -ን does not appropriately mark the Greek indirect object, while -ላቸው already supplies a recipient. Using ለደቀ መዛሙርቱ ... ይላል directly represents “he says to the disciples” and is idiomatic.
  revised_text: ከዚህም በኋላ ለደቀ መዛሙርቱ፣ “እንደገና ወደ ይሁዳ[a] እንሂድ” ይላል።
