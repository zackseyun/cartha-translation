  verdict: revise
  source_fidelity: The temporal clause, reported present (ἔρχεται), mild contrast (δέ), and imperfect state of Mary’s sitting are conveyed accurately. However, ልትቀበለው ሄደች can suggest welcoming/receiving Jesus rather than specifically going to meet him; ልትገናኘው ሄደች more directly represents ὑπήντησεν without adding that she went outside.
  naturalness: The verse is clear and uses modern standard Amharic. The revised wording is equally natural. The existing footnote’s phrase ብላ በሰማች is syntactically awkward, since Martha is not represented as herself saying the quoted words.
  terminology: The established Amharic biblical forms ማርታ፣ ማርያም፣ and ኢየሱስ are appropriate. No theological terminology is at issue.
  issues:
  - severity: medium
    issue: The rendering of ὑπήντησεν is slightly broader than the source.
    rationale: ልትቀበለው may mean ‘to welcome/receive him,’ whereas the Greek verb denotes going to meet someone. Replacing it with ልትገናኘው preserves the directional meeting sense.
  - severity: low
    issue: Footnote alternative is awkwardly phrased.
    rationale: The wording ኢየሱስ እየመጣ ነው ብላ በሰማች can imply that Martha herself said the words. A reported-message formulation is clearer and preserves the present-tense alternative.
