    text: ወይም፣ “ኢየሱስ እየመጣ ነው” ተብሎ በተነገራት ጊዜ። ግሪክኛው በተዘዋዋሪ ንግግር ውስጥ የአሁን ጊዜ ግስ ይጠቀማል፤ ይህም ሕያው የትረካ ቅርጽ ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
