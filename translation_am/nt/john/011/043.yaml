review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents ταῦτα as plural, preserves the prior action of εἰπών, and conveys the loud cry of φωνῇ μεγάλῃ ἐκραύγασεν. The name አልዓዛር is the established Amharic biblical form. However, ወደ ውጭ ና is less idiomatic for summoning someone from within a tomb and can suggest movement toward an external location rather than emerging from it. ውጣ directly and naturally conveys δεῦρο ἔξω in this context.
  naturalness: The sentence is otherwise clear, modern, and appropriately dignified. Replacing ወደ ውጭ ና with ውጣ makes the command forceful and idiomatic in modern standard Amharic.
  terminology: በታላቅ ድምፅ, ጮኸ, and አልዓዛር are suitable standard biblical Amharic choices. No theological terminology is at issue.
  issues:
  - severity: medium
    issue: The command ወደ ውጭ ና is awkward in this immediate context.
    rationale: Although it attempts to reflect δεῦρο ('come') and ἔξω ('outside'), Amharic naturally commands a person enclosed in a tomb to emerge with ውጣ. This retains the source command's intended sense without introducing an unnatural directional formulation.
  revised_text: እነዚህንም ነገሮች ከተናገረ በኋላ፣ “አልዓዛር፣ ውጣ!” ብሎ በታላቅ ድምፅ ጮኸ።
  revised_footnotes: []
  revision_rationale: The revision changes only the final command to the natural Amharic imperative ውጣ (“come out/emerge”), which faithfully communicates δεῦρο ἔξω in its narrative setting. Word order has also been slightly adjusted so that በታላቅ ድምፅ directly modifies ጮኸ. No Amharic footnote is needed; the English footnote records an English stylistic alternative rather than a source-text ambiguity requiring reproduction.
