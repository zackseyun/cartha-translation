  choice: ወደ ውጭ ና
  alternative: ወደዚህ ውጣ
  rationale: ግልጽና ተፈጥሯዊ ዘመናዊ አማርኛን እየተጠቀመ የδεῦρο ἔξωን ቀጥተኛና ኃይለኛ ጥሪ ይጠብቃል፤ ልዩ የእምነት አቋም አያስገባም።
