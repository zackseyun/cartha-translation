lexical_decisions:
- source_word: ταῦτα
  choice: እነዚህን ነገሮች
  rationale: የግሪኩን ብዙ ቁጥር በግልጽ ሁኔታ ይጠብቃል፤ በአማርኛም ተፈጥሯዊ ነው።
- source_word: εἰπὼν
  choice: ከተናገረ በኋላ
  rationale: የአኦሪስት አጋዥ ግስ ከዋናው ድርጊት በፊት የተፈጸመ መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: φωνῇ μεγάλῃ
  choice: በታላቅ ድምፅ
  rationale: የድምፁን ከፍተኛነት በክቡርና በተለመደ አገላለጽ ያቀርባል።
- source_word: ἐκραύγασεν
  choice: ጮኸ
  rationale: κραυγάζω የሚያመለክተውን ከፍ ያለ ጥሪ በአጭርና በኃይለኛ ዘመናዊ አማርኛ ይገልጻል።
- source_word: Λάζαρε
  choice: አልዓዛር
  rationale: በአማርኛ የመጽሐፍ ቅዱስ ልማድ የታወቀውን የስሙን ቅርጽ ይጠቀማል።
- source_word: δεῦρο ἔξω
  choice: ወደ ውጭ ና
  rationale: δεῦρο የጥሪ ትእዛዝን፣ ἔξωም ወደ ውጭ መውጣትን ያሳያሉ፤ ይህ አተረጓጎም ግልጽ፣ ቀጥተኛና ዘመናዊ ነው።
