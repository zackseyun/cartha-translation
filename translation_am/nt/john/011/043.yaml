  rationale: The revision changes only the final command to the natural Amharic imperative ውጣ (“come out/emerge”), which faithfully communicates δεῦρο ἔξω in its narrative setting. Word order has also been slightly adjusted so that በታላቅ ድምፅ directly modifies ጮኸ. No Amharic footnote is needed; the English footnote records an English stylistic alternative rather than a source-text ambiguity requiring reproduction.
