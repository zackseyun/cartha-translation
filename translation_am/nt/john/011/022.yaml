translation:
  language: am
  text: ነገር ግን አሁንም[a] ከእግዚአብሔር የምትለምነውን ሁሉ[b] እግዚአብሔር እንደሚሰጥህ አውቃለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እና አሁንም።» የግሪኩ አያያዥ ቃል «እና» ተብሎ ብቻ ሊተረጎም ይችላል፤ በዐውዱ ግን ማርታ ስለ አልዓዛር ሞት ከተናገረችው በኋላ የንግግር ተቃርኖንም ያሳያል።
    reason: lexical_alternative
  - marker: b
    text: በግሪክ፣ «እግዚአብሔርን የምትለምነውን ሁሉ።» በአማርኛ ይህ አገላለጽ በተፈጥሮ «ከእግዚአብሔር የምትለምነውን» ተብሎ ይቀርባል።
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: ነገር ግን አሁንም
  rationale: καί በመሠረቱ «እና» ሊባል ቢችልም፣ ከቀደመው ሐሳብ በኋላ ያለውን የንግግር ለውጥና νῦν የሚያሳየውን «አሁንም» የሚል ጊዜያዊ አጽንዖት ይህ አተረጓጎም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: οἶδα
  choice: አውቃለሁ
  rationale: ፍጹም ቅርጽ ቢኖረውም የአሁን ጊዜ ትርጉም ያለው መደበኛ አገላለጽ ነው፤ «እርግጠኛ ነኝ» ከማለት ይልቅ ለቃሉ ቀጥተኛ ነው።
- source_word: ὅτι
  choice: እንደሚ…
  rationale: የሚታወቀውን ይዘት የሚያስገባው ὅτι በአማርኛ በተፈጥሯዊ የይዘት አንቀጽ «እንደሚሰጥህ» ተገልጿል።
- source_word: ὅσα ἂν
  choice: የምትለምነውን ሁሉ
  rationale: ከἄν ጋር ያለው አንጻራዊ ተውላጠ ስም ያልተወሰነና ሰፊ ወሰን ያሳያል፤ «…ሁሉ» ይህን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: αἰτήσῃ τὸν θεόν
  choice: ከእግዚአብሔር የምትለምነውን
  rationale: αἰτέω እዚህ በጸሎት አውድ ውስጥ መጠየቅን ያመለክታል። «ከእግዚአብሔር መለመን» በአማርኛ ተፈጥሯዊ ሲሆን በግሪክ ያልተገለጸ የጥያቄ ዕቃ አይጨምርም።
- source_word: δώσει σοι ὁ θεός
  choice: እግዚአብሔር እንደሚሰጥህ
  rationale: የወደፊት ጊዜ ግስና በግልጽ የተጠቀሰው ባለቤት በቀጥታ ተጠብቀዋል፤ «ይሰጥሃል» የሚለው ሐሳብ በይዘት አንቀጹ ምክንያት «እንደሚሰጥህ» ሆኗል።
- source_word: θεός / ὁ θεός
  choice: እግዚአብሔር … እግዚአብሔር
  rationale: ሁለቱም θεός በመሆናቸው ሁለቱም በተመሳሳይ ቃል ተተርጉመዋል፤ ጽሑፉ ያልጨመረው «አብ» የሚል ማብራሪያ አልተጨመረም።
theological_decisions:
- issue: ማርታ ኢየሱስ ከእግዚአብሔር እንደሚለምንና እግዚአብሔርም እንደሚሰጠው የተናገረችው ንግግር ከጽሑፉ በላይ በክርስቶሎጂ ሊተረጎም ይችላል።
  choice: የማርታን ንግግር ያለ ዶግማዊ ማስፋፊያ በግልጽ ቃሉ ማቆየት።
  alternative: የበታችነት ስሜትን ለማስወገድ ሐረጉን መተርጎም ወይም «እግዚአብሔር»ን «አብ» ብሎ ማስፋት።
  rationale: ቁጥሩ የማርታን ንግግር ይዘግባል። የዮሐንስን ትረካዊና ሥነ መለኮታዊ ውጥረት ሳያለሰልስ በተነገረው መልኩ ማቅረብ ይገባል።
