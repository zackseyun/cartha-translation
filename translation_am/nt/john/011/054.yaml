base_translation:
  language: en
  yaml_path: translation/nt/john/011/054.yaml
  text: So Jesus no longer walked openly among the Jews[a], but departed from there to the region near the wilderness, to a city called Ephraim, and stayed there with the disciples.
translation:
  language: am
  text: ስለዚህ ኢየሱስ ከዚያ በኋላ በአይሁድ[a] መካከል በግልጽ አይመላለስም ነበር፤ ነገር ግን ከዚያ ወጥቶ ወደ ምድረ በዳው አቅራቢያ ወዳለ አካባቢ፣ ኤፍሬም ወደምትባል ከተማ ሄደ፤ በዚያም ከደቀ መዛሙርቱ ጋር ቆየ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በይሁዳ ሰዎች መካከል።” በዮሐንስ ወንጌል “አይሁድ” የሚለው ቃል እንደ ዐውዱ በተለይ የይሁዳን ነዋሪዎች ወይም የአይሁድን ባለሥልጣናት ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው በኢየሱስ ላይ ከተደረገው ሴራ የተነሣውን ትረካዊ ውጤት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οὐκέτι παρρησίᾳ περιεπάτει
  choice: ከእንግዲህ ... በግልጽ አይዘዋወርም ነበር
  rationale: οὐκέτι የቀድሞ ሁኔታ መቋረጡን፣ παρρησίᾳ በይፋ መታየትን፣ περιεπάτει ደግሞ በየቦታው መንቀሳቀስን ያመለክታሉ፤ ይህ አገላለጽ ሦስቱንም ገጽታዎች በተፈጥሯዊ መንገድ ይይዛል።
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: በአይሁድ መካከል
  rationale: Ἰουδαῖοι በዮሐንስ ወንጌል እንደ ዐውዱ አይሁድን፣ የይሁዳ ነዋሪዎችን ወይም ባለሥልጣናትን ሊያመለክት ይችላል። የተለመደው እና ግልጽ ትርጉም በዋናው ጽሑፍ ተቀምጦ፣ ክልላዊው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ἀπῆλθεν ἐκεῖθεν
  choice: ከዚያ ተነሥቶ ... ሄደ
  rationale: ከቀደመው ቦታ ርቆ መሄዱን በተፈጥሯዊ የአማርኛ የጉዞ አገላለጽ ይሰጣል።
- source_word: χώραν ἐγγὺς τῆς ἐρήμου
  choice: በምድረ በዳው አቅራቢያ ወዳለው አካባቢ
  rationale: χώρα ከዘመናዊ አገር ይልቅ ክልልን ወይም አካባቢን ያመለክታል፤ ἔρημος ደግሞ ሰው የማይበዛበትን ምድረ በዳ ይገልጣል።
- source_word: εἰς Ἐφραὶμ λεγομένην πόλιν
  choice: ኤፍሬም ወደምትባል ከተማ
  rationale: የቦታውን ስምና πόλις የሚለውን ቀጥተኛ ትርጉም በግልጽ አማርኛ ያቀርባል።
- source_word: κἀκεῖ ἔμεινεν μετὰ τῶν μαθητῶν
  choice: በዚያም ከደቀ መዛሙርቱ ጋር ቆየ
  rationale: በጉዞ ትረካ ውስጥ μένω መቆየትን ያመለክታል። ግሪኩ ‘ከደቀ መዛሙርቱ’ የሚለውን የባለቤትነት ቅጥያ በግልጽ ባይይዝም፣ በአማርኛ ዐውዱን በተፈጥሯዊና ግልጽ መንገድ ያስተላልፋል።
theological_decisions:
- issue: በዮሐንስ ውስጥ የἸουδαῖοι አመልካች
  choice: በአይሁድ መካከል
  alternative: በይሁዳ ሰዎች መካከል
  rationale: ቃሉ የዘር፣ የክልል ወይም የአመራር ፍቺ ሊኖረው ይችላል። ይህ ቁጥር ኢየሱስ በአካባቢው በይፋ መንቀሳቀሱን ይናገራል እንጂ ስለ አይሁድ ሁሉ አጠቃላይ የሥነ መለኮት ፍርድ አይሰጥም። ዋናው ጽሑፍ የታወቀውን አጠራር ይዞ፣ ክልላዊውን ፍቺ በማስታወሻ ይጠብቃል።
