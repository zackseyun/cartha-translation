review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the deceased man, the binding of hands and feet with burial strips, and the cloth around his face. However, “ይሂድ” alone weakens/omits the permissive imperative ἄφετε (“let/allow”); the object is also only implicit. The revision explicitly retains both commands.
  naturalness: The opening participial construction using repeated “እንደ...” is understandable but less natural than a main narrative clause followed by a descriptive clause. The revised wording is fluent modern standard Amharic while retaining the source’s details.
  terminology: “ቀብር ጨርቅ ማሰሪያዎች” appropriately conveys κειρίαις without over-specifying their exact form. “ፊት መሸፈኛ ጨርቅ” distinguishes the σουδάριον from the binding strips and is clear for contemporary readers.
  issues:
  - severity: medium
    issue: The second command is reduced to “ይሂድ.”
    rationale: ἄφετε αὐτὸν ὑπάγειν explicitly commands the listeners to allow him to go. “እንዲሄድ ተዉት” preserves the permissive force and the object.
  - severity: low
    issue: The descriptive opening is somewhat awkward in Amharic.
    rationale: Rendering the binding and face cloth as coordinated descriptive clauses after “ወጣ” is more idiomatic and maintains the same information.
  revised_text: የሞተው ሰው ወጣ፤ እግሮቹና እጆቹ በቀብር ጨርቅ ማሰሪያዎች ታስረው ነበር፣ ፊቱም በፊት መሸፈኛ ጨርቅ ተጠቅልሎ ነበር። ኢየሱስም፣ “ፍቱትና እንዲሄድ ተዉት” አላቸው።
