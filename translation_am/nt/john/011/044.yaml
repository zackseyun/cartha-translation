id: JHN.11.44
reference: John 11:44
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀ἐξῆλθεν ὁ τεθνηκὼς δεδεμένος τοὺς πόδας καὶ τὰς χεῖρας κειρίαις, καὶ ἡ ὄψις αὐτοῦ σουδαρίῳ περιεδέδετο. λέγει ⸂αὐτοῖς ὁ Ἰησοῦς⸃· Λύσατε αὐτὸν καὶ ἄφετε ⸀αὐτὸν ὑπάγειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/044.yaml
  text: The man who had died came out, his feet and hands bound with burial cloths, and his face wrapped with a cloth. Jesus says to them, “Unbind him and let him go.”
translation:
  language: am
  text: የሞተው ሰው ወጣ፤ እግሮቹና እጆቹ በቀብር ጨርቅ ማሰሪያዎች ታስረው ነበር፣ ፊቱም በፊት መሸፈኛ ጨርቅ ተጠቅልሎ ነበር። ኢየሱስም፣ “ፍቱትና እንዲሄድ ተዉት” አላቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τεθνηκώς
  choice: የሞተው ሰው
  rationale: ፍጹም አድራጊ አንቀጹ ቀድሞ ሞቶ የነበረውን ሰው ይጠቁማል፤ ይህ አገላለጽ በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: κειρίαις
  choice: በመገነዣ ጨርቆች
  rationale: ቃሉ ለቀብር የሚጠቀሙባቸውን የጨርቅ ማሰሪያዎች ያመለክታል፤ ከተራ ‘ጨርቆች’ ይልቅ የቀብር አውዱን ያሳያል።
- source_word: σουδαρίῳ
  choice: በጨርቅ
  rationale: ፊቱን የሸፈነውን የተለየ ጨርቅ በቀላልና የተለመደ አማርኛ ያሳያል፤ የቃሉን ትክክለኛ ቅርጽ ከሚፈታው በላይ አይገድብም።
- source_word: Λύσατε
  choice: ፍቱት
  rationale: የብዙ ቁጥር ትእዛዙ የታሰረውን እንዲፈቱ በቀጥታ ይጠይቃል።
- source_word: ἄφετε αὐτὸν ὑπάγειν
  choice: ይሂድ
  rationale: በዐውዱ ‘እንዲሄድ ተዉት/ፍቀዱለት’ የሚለውን ፈቃድ በተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: የλέγει የግስ ጊዜ
  choice: አላቸው
  alternative: ይላቸዋል
  rationale: የግሪክ ታሪካዊ የአሁን ጊዜ በአማርኛ ትረካ በተፈጥሯዊ ያለፈ ጊዜ ተተርጉሟል፤ ይህ የንግግሩን ይዘት ወይም ሥነ መለኮታዊ አንድምታ አይለውጥም።
- issue: የἄφετε አገላለጽ
  choice: ይሂድ
  alternative: እንዲሄድ ተዉት
  rationale: አጭሩ አማርኛ የመፍቀድን ኃይል ይይዛል፤ ኢየሱስ ከታሰረበት እንዲፈታና በነፃ እንዲሄድ ያዘዘውን ሳያሰፋ ያቀርባል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ የትረካ አማርኛ። የግሪኩን የአረፍተ ነገር ቅደም ተከተል በአማርኛ ተፈጥሯዊ ሰዋስው ተስተካክሏል።
