  text: ስለዚህ ኢየሱስ እርሷ ስታለቅስ እና ከእርሷ ጋር የመጡት አይሁድ[a] ሲያለቅሱ ባየ ጊዜ፣ በመንፈሱ እጅግ ተናወጠ[b]፤ በራሱም ታወከ።
  philosophy: optimal-equivalence
  footnotes:
