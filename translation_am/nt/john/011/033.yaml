    text: ግሱ «እጅግ ተበሳጨ»፣ «ተቆጣ» ወይም «በጥልቅ ተነሳሳ» የሚል ትርጉምም ሊኖረው ይችላል፤ ብርቱ ውስጣዊ መናወጥን ይገልጣል።
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: ስለዚህ
  rationale: የቀደመውን ትረካ ከዚህ ክስተት ጋር የሚያገናኘውን የምክንያትና የቀጣይነት ኃይል ይጠብቃል።
- source_word: ὡς εἶδεν
  choice: ባየ ጊዜ
  rationale: ὡς ከአኦሪስት ግስ ጋር እዚህ የጊዜ ግንኙነትን ስለሚገልጥ፣ ተፈጥሯዊ የአማርኛ አገላለጽ ተመርጧል።
- source_word: κλαίουσαν / κλαίοντας
  choice: ስታለቅስ / ሲያለቅሱ
  rationale: κλαίω የሚሰማ ልቅሶን ሊያመለክት ይችላል፤ «ማልቀስ» ይህን ሳያጋንን በክብር ያቀርባል።
- source_word: συνελθόντας αὐτῇ
  choice: ከእርሷ ጋር የመጡት
  rationale: ከማርያም ጋር አብረው የመጡትን ሰዎች ቀጥተኛና ግልጽ በሆነ መንገድ ይገልጣል።
- source_word: Ἰουδαίους
  choice: አይሁድ
  rationale: ቀጥተኛውን የቃሉን ትርጉም ይጠብቃል፤ በዚህ አውድ ግን ሕዝቡን በሙሉ ሳይሆን ከማርያም ጋር የነበሩትን አይሁዳውያን አልቃሾች እንደሚያመለክት በማስታወሻ ተብራርቷል።
- source_word: ἐνεβριμήσατο
  choice: እጅግ ተናወጠ
  rationale: ግሱ ብርቱ ውስጣዊ ስሜትን፣ ቁጣን ወይም መበሳጨትን ሊያካትት ይችላል። ይህ አገላለጽ የስሜቱን ጥንካሬ ይጠብቃል፣ ዓይነቱን ግን ከግሪኩ በላይ አይወስንም።
- source_word: τῷ πνεύματι
  choice: በመንፈሱ
  rationale: የስሜታዊው መናወጥ የተከሰተበትን ውስጣዊ ስፍራ በቀጥታ ያሳያል።
- source_word: ἐτάραξεν ἑαυτόν
  choice: ራሱንም አወከ
  rationale: በግሪኩ ያለውን ግልጽ የራስ አመልካች አገላለጽ ይጠብቃል፤ በተራ ተደራጊ ሁኔታ «ታወከ» ብሎ አያለዝበውም።
