    text: ወይም፣ «አይሁዳውያን»። በዚህ ስፍራ ቃሉ የአይሁድን ሕዝብ በሙሉ ሳይሆን፣ ከማርያም ጋር የመጡትን አይሁዳውያን አልቃሾች ያመለክታል።
    reason: lexical_alternative
