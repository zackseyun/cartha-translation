  yaml_path: translation/nt/john/011/053.yaml
  text: So from that day on they planned to kill him.
translation:
  language: am
  text: ስለዚህ ከዚያ ቀን ጀምሮ እርሱን ለመግደል ተማከሩ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπ’ ἐκείνης ... τῆς ἡμέρας
  choice: ከዚያን ቀን ጀምሮ
  rationale: ἀπό የድርጊቱን የጊዜ መነሻ ያመለክታል፤ ይህ አገላለጽ ከዚያ ቀን ወዲህ የቀጠለ ዕቅድ መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ቃሉ ይህ ውሳኔ ቀደም ሲል ከተገለጠው የሸንጎው ውይይት የተነሣ ውጤት መሆኑን ያገናኛል።
- source_word: ἐβουλεύσαντο
  choice: ተማከሩ
  rationale: ግሱ በጋራ መምከርንና ወደተወሰነ ዕቅድ መድረስን ያመለክታል፤ «ተማከሩ» ይህን የሴራ ምክክር ሳያለዝብ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἵνα ἀποκτείνωσιν
  choice: ለመግደል
  rationale: ἵνα ከዚህ የምክክር ግስ ጋር ዓላማውን ወይም የዕቅዱን ይዘት ይገልጣል፤ «ለመግደል» የግሪኩን ግልጽ ትርጉም ያለ ፍርድ ሂደት ተጨማሪ ሐሳብ ያቀርባል።
- source_word: αὐτόν
  choice: እርሱን
  rationale: ተውላጠ ስሙ በአውዱ ኢየሱስን ያመለክታል፤ የግሪኩን ተውላጠ ስም ቅርጽ ለመጠበቅ ስሙ በትርጉሙ አልተጨመረም።
theological_decisions:
- issue: የመሪዎቹ ዓላማ ምንነት
  choice: እርሱን ለመግደል ያደረጉትን የተወሰነ ምክክር በቀጥታ መግለጽ
  alternative: ስለ መግደሉ ተወያዩ፤ ሊገድሉት አሰቡ
  rationale: ግሪኩ ተራ ውይይትን ወይም ገና ያልተወሰነ ሐሳብን ሳይሆን ወደ ግድያ ያመራ የጋራ ምክክርን ያቀርባል፤ ከዚህ በላይ የሕግ ወይም የትምህርተ መለኮት ትርጓሜ አልተጨመረም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። «ተማከሩ» የጋራ ምክክሩን ይጠብቃል፤ «ከዚያን ቀን ጀምሮ» ደግሞ የጊዜውን መነሻና ቀጣይነት በተፈጥሯዊ አገላለጽ ያሳያል።
