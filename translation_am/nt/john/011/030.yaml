  yaml_path: translation/nt/john/011/030.yaml
  text: Jesus had not yet come into the village[a], but was still in the place where Martha had met him.
translation:
  language: am
  text: ኢየሱስ ወደ መንደሩ ገና አልገባም ነበር፤ ማርታ የተገናኘችው ቦታ[a] ላይ ግን አሁንም ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ይበልጥ ግልጽ አድርጎ፦ “ማርታ ሊገናኘው ወጥታ የተገናኘችው ቦታ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔπω
  choice: ገና … አልገባም ነበር
  rationale: οὔπω ድርጊቱ እስከዚያ ጊዜ አለመፈጸሙን ያመለክታል፤ በአማርኛ ‘ገና … አል…ም ነበር’ ይህን በተፈጥሮ ያሳያል።
- source_word: δὲ
  choice: ፤
  rationale: δέ እዚህ ላይ ቀላል የትረካ ሽግግርን ያሳያል፤ በአማርኛ የአረፍተ ነገሩ ፍሰትና ሥርዓተ ነጥቡ ይህን ያስተላልፋሉ፣ ተጨማሪ ‘አሁንም’ የሚል ቃል አያስፈልግም።
- source_word: ἐληλύθει εἰς
  choice: ወደ … አልገባም ነበር
  rationale: ወደ መንደሩ መምጣትንና ያ ከቀደመው የትረካ ጊዜ በፊት አለመፈጸሙን ተፈጥሯዊ በሆነ አማርኛ ያሳያል።
- source_word: κώμην
  choice: መንደሩ
  rationale: κώμη በተለምዶ ከተማ ያልሆነ አነስተኛ ሰፈርን ያመለክታል፤ ‘መንደር’ ትክክለኛና የተለመደ አቻ ነው።
- source_word: ἀλλ’
  choice: ፤
  rationale: የመንደሩን አለመግባትና በቀድሞው ቦታ መቆየት የሚያነጻጽረው ቅርጽ በሁለቱ ንዑስ ዐረፍተ ነገሮች አወቃቀርና በሰረዝ ነጥብ ግልጽ ሆኗል።
- source_word: ἔτι
  choice: እንደነበረ ነበር
  rationale: በዚያው ቦታ መቆየቱን ያሳያል፤ የአማርኛው ቅርጽ ቀጣይነቱን በተፈጥሮ ይገልጣል።
- source_word: τόπῳ
  choice: ቦታ
  rationale: τόπος አጠቃላይ የቦታ መጠሪያ ነው፤ ‘ቦታ’ ቀላልና ቀጥተኛ አቻ ነው።
- source_word: ὅπου
  choice: ባ…ው ቦታ
  rationale: የቦታ አንጻራዊ አረፍተ ነገሩን በተፈጥሯዊ የአማርኛ ቅርጽ ያቀርባል።
- source_word: ὑπήντησεν αὐτῷ
  choice: ማርታ ባገኘችው
  rationale: ὑπαντάω ‘መገናኘት’ ወይም ‘ለመገናኘት መውጣት’ ሊል ይችላል። ዋናው ጽሑፍ ቦታውን በአጭሩ ይለያል፤ የዓውዱ ይበልጥ ግልጽ አማራጭ በማስታወሻ ተጠብቋል።
