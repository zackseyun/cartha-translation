lexical_decisions:
- source_word: εἰρήκει
  choice: ተናግሮ ነበር
  rationale: የግሪኩን የቀደመ ጊዜ አመልካች ቅርጽ ይጠብቃል፤ የኢየሱስ ንግግር ከደቀ መዛሙርቱ ስህተት በፊት እንደነበር ያሳያል።
- source_word: δὲ ... δὲ
  choice: ግን ... ግን
  rationale: የመጀመሪያው δέ ቀላል የንግግር ሽግግርን፣ ሁለተኛውም በኢየሱስ ዓላማና በደቀ መዛሙርቱ ግንዛቤ መካከል ያለውን ንጽጽር ያሳያል።
- source_word: περὶ τοῦ θανάτου αὐτοῦ
  choice: ስለ ሞቱ
  rationale: περί ከዘር ቅጽ ጋር ‘ስለ’ ማለት ነው፤ ሞቱም θάνατοςን በቀጥታ ይተረጉማል። የተውላጠ ስሙን ቅርጽ ጠብቆ አውዱ አልዓዛርን እንዲያመለክት ይተዋል።
- source_word: ἐκεῖνοι
  choice: እነርሱ
  rationale: በአውዱ አስቀድመው የተጠቀሱትን ደቀ መዛሙርት የሚያመለክት ተፈጥሯዊ የአማርኛ ተውላጠ ስም ነው።
- source_word: ἔδοξαν
  choice: አሰቡ
  rationale: በዚህ አውድ δοκέω የተሳሳተ ግምታቸውን ያመለክታል፤ ‘አሰቡ’ ግልጽና ወቅታዊ ነው።
- source_word: περὶ τῆς κοιμήσεως τοῦ ὕπνου
  choice: ስለ ተኝቶ ማረፍ
  rationale: የግሪኩ ቃል በቃል ‘ስለ እንቅልፍ መተኛት’ የሚል ድግግሞሽ አለው። ‘ተኝቶ ማረፍ’ ደቀ መዛሙርቱ ቃሉን እውነተኛ እንቅልፍ አድርገው መረዳታቸውን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: λέγει
  choice: የተናገረው ... እንደሆነ
  rationale: በግሪኩ ታሪካዊ አሁን ጊዜ የቀረበውን ግስ በአማርኛ የተዘዋዋሪ ንግግር ተፈጥሯዊ ቅርጽ ያቀርባል።
theological_decisions:
- issue: ‘እንቅልፍ’ የሚለው ምሳሌያዊ አገላለጽ ስለ ሙታን ሁኔታ የተወሰነ ትምህርት ያመለክት እንደሆነ
  choice: ኢየሱስ ሞትን እንዳመለከተ፣ ደቀ መዛሙርቱ ግን ተኝቶ ማረፍን እንደተረዱ ብቻ መተርጎም
  alternative: ቃሉን ስለ ሙታን መካከለኛ ሁኔታ የሚናገር ትምህርት አድርጎ ማስፋት
  rationale: ጥቅሱ የሚያጎላው በኢየሱስ ምሳሌያዊ አጠቃቀምና በደቀ መዛሙርቱ ቃል በቃል ግንዛቤ መካከል ያለውን ልዩነት ነው፤ ከዚያ በላይ የሥነ መለኮት ድምዳሜ አይጨመርም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩ የቀደመ ጊዜ ስሜትና የሁለቱ አረዳዶች ንጽጽር ተጠብቋል፤ ቃል በቃል ድግግሞሹ በዋናው ጽሑፍ ተፈጥሯዊ ሆኖ፣ በማስታወሻው ደግሞ በግልጽ ቀርቧል።
