- from: ኢየሱስ ግን ስለ ሞቱ ተናግሮ ነበር፤ እነርሱ ግን የተናገረው ስለ ተኝቶ ማረፍ[a] እንደሆነ አሰቡ።
  to: ኢየሱስ ግን ስለ አልዓዛር ሞት ተናግሮ ነበር፤ እነርሱ ግን ስለ ተራ እንቅልፍ[a] እየተናገረ እንደሆነ አሰቡ።
  rationale: The antecedent of ‘his death’ has been made explicit as Lazarus to prevent the Amharic reader from assigning the death to Jesus. The disciples’ misunderstanding is rendered with the idiomatic phrase ተራ እንቅልፍ, while the footnote records the Greek’s emphatic/redundant sleep expression and explains its literal sense. The historical-present force of λέγει is naturally represented by እየተናገረ እንደሆነ.
