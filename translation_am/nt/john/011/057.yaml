  verdict: revise
  source_fidelity: The draft accurately conveys the pluperfect action, the conditional knowledge clause, the present-state sense of ποῦ ἐστιν, the reporting requirement, and the purpose of seizing Jesus. However, plural ἐντολὰς should be represented as plural in the Amharic text.
