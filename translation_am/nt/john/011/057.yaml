id: JHN.11.57
reference: John 11:57
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: δεδώκεισαν ⸀δὲ οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι ⸀ἐντολὰς ἵνα ἐάν τις γνῷ ποῦ ἐστιν μηνύσῃ, ὅπως πιάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/057.yaml
  text: The chief priests and the Pharisees had given orders that if anyone knew where he was[a], he should report it[b], so that they might seize him.
translation:
  language: am
  text: የካህናት አለቆችና ፈሪሳውያን ማንም እርሱ የት እንዳለ ቢያውቅ እንዲያሳውቃቸው፣ እነርሱም እንዲይዙት ትእዛዞችን ሰጥተው ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεδώκεισαν
  choice: ሰጥተው ነበር
  rationale: የግሪኩን አስቀድሞ የተፈጸመ ድርጊት የሚያመለክት የኃላፊ ጊዜ ቅርጽ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: δὲ
  choice: (በተለየ ቃል አልተተረጎመም)
  rationale: እዚህ ጠንካራ ተቃርኖ ሳይሆን የትረካ ቀጣይነትን ያመለክታል፤ በአማርኛው የዓረፍተ ነገሩ ፍሰት በቂ ነው።
- source_word: οἱ ἀρχιερεῖς
  choice: የካህናት አለቆች
  rationale: በዮሐንስና በሁለተኛው ቤተ መቅደስ ዘመን አገባብ የካህናትን መሪዎች ያመለክታል።
- source_word: οἱ Φαρισαῖοι
  choice: ፈሪሳውያን
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የተለመደውን የቡድኑን ስም ይጠቀማል።
- source_word: ἐντολὰς
  choice: ትእዛዝ
  rationale: በዚህ የሥልጣንና የአስተዳደር አገባብ የተሰጠን ይፋዊ መመሪያ በግልጽ ያሳያል።
- source_word: ἵνα ἐάν τις γνῷ
  choice: ማንም … ቢያውቅ እንዲያሳውቃቸው
  rationale: የትእዛዙን ይዘትና በሁኔታ ላይ የተመሠረተውን አወቃቀር በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ποῦ ἐστιν
  choice: የት እንዳለ
  rationale: የግሪኩን የአሁን ጊዜ ‘አለ’ ይጠብቃል፤ የአማርኛ ቀጥተኛ ያልሆነ ንግግርም ይህን በተፈጥሮ ይቀበላል።
- source_word: μηνύσῃ
  choice: እንዲያሳውቃቸው
  rationale: መረጃውን ለባለሥልጣኖቹ ማድረስን ያሳያል፤ በግሪኩ ያልተገለጸው ተቀባይ ከአገባቡ በግልጽ የሚታወቅ በመሆኑ በአማርኛ በተፈጥሮ ተገልጿል።
- source_word: ὅπως πιάσωσιν αὐτόν
  choice: እነርሱም እንዲይዙት
  rationale: የዓላማውን ግንኙነት ያሳያል፤ πιάζω ከመደበኛ ሕጋዊ ‘ማሰር’ ይልቅ ሰፊውን ‘መያዝ’ ይደግፋል።
theological_decisions: []
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለሕዝብ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ የአሁን ጊዜ ‘ἐστιν’ በ‘እንዳለ’ ተጠብቋል፤ ስለዚህ የእንግሊዝኛውን የጊዜ ለውጥ የሚያብራራ የግርጌ ማስታወሻ አላስፈለገም። ‘መያዝ’ የምንጩን ስፋት ስለሚጠብቅ ‘ማሰር’ በግርጌ ማስታወሻ ሳይጨመር ቀርቷል።
