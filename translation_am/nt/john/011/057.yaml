    issue: Singular ትእዛዝ renders plural ἐντολὰς.
    rationale: Although a singular collective can be intelligible in Amharic, the Greek explicitly says that the authorities had issued orders/directives. Plural ትእዛዞችን preserves this detail without reducing naturalness.
