base_translation:
  language: en
  yaml_path: translation/nt/john/011/038.yaml
  text: Jesus[a], then, again deeply moved within himself, came to the tomb. Now it was a cave, and a stone was lying against it.
translation:
  language: am
  text: ኢየሱስም እንደገና በውስጡ እጅግ ተረብሾ[a] ወደ መቃብሩ መጣ። መቃብሩም ዋሻ ነበር፤ በፊቱም ድንጋይ ተጋድሞ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በውስጡ ተቆጥቶ” ወይም “በውስጡ እጅግ ታውኮ።” የግሪኩ ግስ እጅግ ጠንካራ ሲሆን፣ ከሐዘን ብቻ የበለጠ ስሜትን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: -ም
  rationale: በአማርኛ ትረካ የቀደመውን ሁኔታ ከሚቀጥለው ድርጊት ጋር በተፈጥሮ ያገናኛል፤ የግሪኩን የትረካ ቅጥያ ኃይል ይጠብቃል።
- source_word: πάλιν
  choice: እንደገና
  rationale: በቀደመው አውድ የታየው የኢየሱስ ጠንካራ ውስጣዊ ስሜት መደገሙን በግልጽ ያሳያል።
- source_word: ἐμβριμώμενος ἐν ἑαυτῷ
  choice: በውስጡ እጅግ ተነክቶ
  rationale: የቃሉን ጠንካራ የስሜት መነሳሳት ያስተላልፋል፤ ስሜቱን በሐዘን ወይም በቁጣ ብቻ አይወስንም። ጠንከር ያሉ አማራጮች በማስታወሻ ተጠብቀዋል።
- source_word: ἔρχεται
  choice: መጣ
  rationale: በግሪኩ ታሪካዊ የአሁን ጊዜ ቢሆንም፣ በዘመናዊ አማርኛ ትረካ ቀላል ያለፈ ጊዜ ተፈጥሯዊ ነው።
- source_word: μνημεῖον
  choice: መቃብር
  rationale: የቀብር ስፍራን ያመለክታል፤ የሚቀጥለው የዋሻና የመዝጊያ ድንጋይ መግለጫም ይህን ይደግፋል።
- source_word: σπήλαιον
  choice: ዋሻ
  rationale: የግሪኩ ስም ቀጥተኛና ዘመናዊ አማርኛ አቻ ነው።
- source_word: λίθος
  choice: ድንጋይ
  rationale: በመቃብር አውድ መግቢያውን የሚዘጋውን ድንጋይ ያመለክታል።
- source_word: ἐπέκειτο ἐπ’ αὐτῷ
  choice: በመግቢያውም ላይ ድንጋይ ተጋድሞበት ነበር
  rationale: ድንጋዩ የዋሻውን መግቢያ ዘግቶ መቀመጡን በተፈጥሮ ያስተላልፋል። «መግቢያው» በአውዱ የተገነዘበውን ተግባራዊ ሁኔታ ግልጽ ያደርጋል፣ አግድም በሆነ ገጽ ላይ መቀመጥንም አያስገድድም።
theological_decisions:
- issue: ἐμβριμώμενος የሚገልጸው የኢየሱስ ስሜት ትክክለኛ አይነት
  choice: ኢየሱስ በውስጡ በጣም እንደተነሳሳ መግለጽ፣ ስሜቱን ግን በሐዘን ወይም በቁጣ ብቻ አለመወሰን
  alternative: «በውስጡ ተቆጥቶ» ወይም «በውስጡ እጅግ ታውኮ»
  rationale: ግሱ እጅግ ጠንካራ የስሜት መነሳሳትን፣ አንዳንዴም ቁጣን ወይም አለመደሰትን ሊያመለክት ይችላል። ይህ ጥቅስ የስሜቱን ትክክለኛ ዓይነት በግልጽ ስለማይወስን፣ ዋናው ጽሑፍ ጥንካሬውን ጠብቆ የትርጓሜውን ውጥረት ክፍት ያደርጋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «በውስጡ እጅግ ተነክቶ» የስሜቱን ጥንካሬ ሳያጠፋ የግሪኩን የትርጉም ስፋት ይጠብቃል።
