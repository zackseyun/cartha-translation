base_translation:
  language: en
  yaml_path: translation/nt/john/011/009.yaml
  text: Jesus answered[a], “Are there not twelve hours in the day? If anyone walks in the day, he does not stumble[c][b], because he sees the light of this world.”
translation:
  language: am
  text: ኢየሱስም መልሶ፣ “በቀን አሥራ ሁለት ሰዓታት የሉምን?[a] ማንም በቀን ቢሄድ፣ የዚህን ዓለም ብርሃን ስለሚያይ አይሰናከልም።[b]” አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የቀኑ ሰዓታት አሥራ ሁለት አይደሉምን?”
    reason: lexical_alternative
  - marker: b
    text: “የዚህ ዓለም ብርሃን” የሚለው አገላለጽ በዮሐንስ ወንጌል ውስጥ ስለ መለኮታዊ ብርሃን ያለውን ሰፊ ጭብጥ ሊያስተጋባ ይችላል፤ ዋናው ጽሑፍ ግን አገላለጹን እንዳለ ይተወዋል።
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: መልሶ ... አለ
  rationale: በአማርኛ የትረካ ንግግር ውስጥ የግሪኩን ‘መለሰ’ ተፈጥሯዊና የተሟላ አድርጎ ያቀርባል።
- source_word: Οὐχὶ
  choice: የለውምን?
  rationale: አዎንታዊ መልስ የሚጠብቀውን የግሪክ አጠያየቅ በተፈጥሯዊ የአማርኛ አሉታዊ ጥያቄ ይገልጣል።
- source_word: δώδεκα ὧραί εἰσιν τῆς ἡμέρας
  choice: ቀኑ አሥራ ሁለት ሰዓት የለውምን?
  rationale: በዚህ አውድ ‘ቀን’ የብርሃንን ጊዜ ያመለክታል፤ አገላለጹም የግሪኩን የባለቤትነት ግንኙነት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐάν τις περιπατῇ
  choice: ማንም በቀን ቢመላለስ
  rationale: τις ያለውን አጠቃላይ ወካይ ትርጉም ‘ማንም’ ያስተላልፋል፤ ‘ቢመላለስ’ ደግሞ ሁኔታዊውን አወቃቀርና የቀጣይ መሄድን ምስል ይጠብቃል።
- source_word: προσκόπτει
  choice: አይሰናከልም
  rationale: ቃሉ ቀጥተኛውን የመሰናከል ምስልና ሊኖረው የሚችለውን ሰፊ ምሳሌያዊ ኃይል አብሮ ይጠብቃል።
- source_word: τὸ φῶς τοῦ κόσμου τούτου
  choice: የዚህን ዓለም ብርሃን
  rationale: የግሪኩን ሰዋሰዋዊ ግንኙነትና ጠቋሚውን ‘ይህ’ ይጠብቃል፤ የዮሐንስን ሰፊ የብርሃን ጭብጥ ያለ ትርጓሜያዊ ጭማሪ ክፍት ያደርጋል።
- source_word: βλέπει
  choice: ስለሚያይ
  rationale: ‘ማየት’ የሚለውን ቀጥተኛ ትርጉም ይጠብቃል፤ ὅτι ያለውን ምክንያታዊ ግንኙነት ‘ስለ-’ ያስተላልፋል።
theological_decisions:
- issue: በዮሐንስ አውድ የ‘ብርሃን’ ምሳሌያዊ ኃይል
  choice: በዋናው ጽሑፍ ‘የዚህ ዓለም ብርሃን’ የሚለውን የቃሉን ቀጥተኛ ምስል ማቆየት
  alternative: ብርሃኑን በግልጽ ከኢየሱስ ወይም ከመለኮታዊ መሪነት ጋር አንድ ማድረግ
  rationale: አፋጣኙ ንግግር ቀንና ሌሊትን በሚያነጻጽር ተምሳሌታዊ አባባል ይሠራል፤ የዮሐንስ ሰፊ ሥነ መለኮታዊ ድምፅ ግን አልተዘጋም።
- issue: τις ... βλέπει ያለው ወካይ ነጠላ
  choice: ‘ማንም’ በሚለው አጠቃላይ ነጠላ መግለጽ፣ በተከታዩ ግስ ውስጥ ጾታን አለመጨመር
  alternative: በግልጽ ወንድ ተውላጠ ስም ‘እርሱ’ መጨመር
  rationale: ግሪኩ βλέπει በራሱ ሰዋሰዋዊ ጾታ አያመለክትም፤ አማርኛም ‘ማንም ... ያይ’ በሚለው ተፈጥሯዊ አወቃቀር ወካዩን ነጠላ ሳያጠፋ ያቀርባል።
