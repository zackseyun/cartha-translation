  edition: SBLGNT
  text: λέγει ὁ Ἰησοῦς· Ἄρατε τὸν λίθον. λέγει αὐτῷ ἡ ἀδελφὴ τοῦ ⸀τετελευτηκότος Μάρθα· Κύριε, ἤδη ὄζει, τεταρταῖος γάρ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/039.yaml
  text: Jesus said[a], “Take away the stone.” Martha, the sister of the dead man, said to him, “Lord, by now he smells[c][b], for he has been dead four days.”
translation:
  language: am
  text: ኢየሱስ፣ “ድንጋዩን አንሱት” አለ። የሞተው እኅት የሆነችው ማርታ፣ “ጌታ ሆይ፣ አሁንማ ይሸታል፤[b] ከሞተ አራት ቀን ሆኖታልና”[c] አለችው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ወይም፣ “ክፉ ሽታ ያወጣል።” የግሪኩ ግስ “ሽታ ማውጣት” ማለት ነው።
    reason: በአውዱ መጥፎ ሽታ መሆኑ ግልጽ ቢሆንም፣ ግሱ ራሱ ሽታ ማውጣትን ብቻ ይገልጣል።
  - marker: c
    text: ቃል በቃል፣ “የአራተኛ ቀን ሰው ነውና፤” ማለትም ከሞተ አራት ቀን ሆኖታል።
    reason: τεταρταῖος የሚለውን ልዩ የግሪክ አገላለጽና በዋናው ጽሑፍ በግልጽ የተተረጎመውን ትርጉም ያሳያል።
lexical_decisions:
- source_word: Ἄρατε τὸν λίθον
  choice: ድንጋዩን አንሱት
  rationale: የብዙ ቁጥር ትእዛዙ በቦታው ያሉት ሰዎች የመቃብሩን ድንጋይ እንዲያስወግዱ ያዛል፤ “አንሱት” በአማርኛ ተፈጥሯዊ ሲሆን ድንጋዩን ከመግቢያው ማስወገድን ያመለክታል።
- source_word: τοῦ τετελευτηκότος
  choice: የሞተው ሰው
  rationale: ፍጹም አንቀጽ የሞተና በሞት ሁኔታ ያለውን ሰው ያመለክታል፤ ይህ አተረጓጎም ግልጽና ተፈጥሯዊ ነው።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: የማርታን አክብሮታዊ ንግግር እና በዮሐንስ ወንጌል ያለውን የቃሉን ክብደት ይጠብቃል።
- source_word: ἤδη ὄζει
  choice: አሁንማ ይሸታል
  rationale: ἤδη ሁኔታው በዚያን ጊዜ አስቀድሞ መኖሩን ያሳያል፤ ὄζει ደግሞ ሽታ ማውጣትን ይገልጣል። “ይሸታል” በአውዱ መጥፎ ሽታን ሲያመለክትም ከግሪኩ ይልቅ ኃይለኛ ቃል አይጨምርም።
- source_word: τεταρταῖος γάρ ἐστιν
  choice: ከሞተ አራት ቀን ሆኖታልና
  rationale: የግሪኩ ቅጽ ቃል በቃል “የአራተኛ ቀን ሰው ነው” የሚል ሲሆን፣ በአውዱ ከሞተ አራት ቀን መሆኑን በተፈጥሯዊ አማርኛ ይገልጣል። γάρ የምክንያት ግንኙነቱን “-ና” በሚለው ቅጥያ ይጠብቃል።
theological_decisions:
- issue: ማርታ ኢየሱስን Κύριε ብላ መጥራቷ
  choice: ጌታ ሆይ
  alternative: ጌታዬ / ክቡር ሆይ
  rationale: “ጌታ ሆይ” ሁለቱንም አክብሮታዊ አድራሻና በዮሐንስ ወንጌል ሊኖረው የሚችለውን ጥልቅ ክርስቶሳዊ ክብደት ይጠብቃል፤ ነገር ግን በዚህ ቁጥር ብቻ የማይገኝ የተሟላ የእምነት ኑዛዜ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “አሁንማ” የማርታን የጊዜ አጽንዖት በተፈጥሯዊ ንግግር ያስተላልፋል፤ “ይሸታል” ደግሞ ክብር ያለው ሆኖ የምንጩን የቃል ደረጃ ይጠብቃል።
