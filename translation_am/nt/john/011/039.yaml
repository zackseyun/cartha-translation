review_pass:
  verdict: revise
  source_fidelity: The draft conveys Jesus’ plural command, Martha’s relation to the deceased, her respectful address, the odor, and the explanatory statement that he has been dead four days. The wording for the four days is faithful and the footnote anchors are present. However, the additive form ማርታም (“Martha also”) adds a discourse element not present in Greek.
  naturalness: የሞተው ሰው እኅት ማርታም is somewhat awkward as a narrative subject, and the final -ም is both unnecessary and source-expansive. የሞተው እኅት የሆነችው ማርታ is clear, natural modern Amharic and maintains the Greek relationship.
  terminology: ጌታ ሆይ appropriately retains Κύριε without imposing more than the source states. ይሸታል naturally conveys ὄζει in this context without unnecessarily strengthening it to “stinks.” አንሱት is an acceptable plural command for removing the tomb stone.
  issues:
  - severity: medium
    issue: The text reads ማርታም.
    rationale: The enclitic -ም normally contributes “also/too” or a related additive emphasis. Greek merely identifies Martha as the speaker and supplies no corresponding additive particle. It should be removed.
  - severity: low
    issue: The phrase identifying Martha is stylistically compressed.
    rationale: የሞተው ሰው እኅት is understandable, but የሞተው እኅት የሆነችው ማርታ is more idiomatic and unambiguously attaches the relational phrase to Martha.
  revised_text: ኢየሱስ፣ “ድንጋዩን አንሱት” አለ። የሞተው እኅት የሆነችው ማርታ፣ “ጌታ ሆይ፣ አሁንማ ይሸታል፤[b] ከሞተ አራት ቀን ሆኖታልና”[c] አለችው።
