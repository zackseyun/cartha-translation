id: JHN.11.42
reference: John 11:42
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ᾔδειν ὅτι πάντοτέ μου ἀκούεις· ἀλλὰ διὰ τὸν ὄχλον τὸν περιεστῶτα εἶπον, ἵνα πιστεύσωσιν ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/042.yaml
  text: But I knew that you always hear me[a]. Yet I said this because of the crowd standing around[b], so that they may believe that you sent me.
translation:
  language: am
  text: እኔ ግን ሁልጊዜ እንደምትሰማኝ አውቅ ነበር፤ ነገር ግን ይህን ያልሁት በዙሪያ ስለቆመው ሕዝብ[a]፣ አንተ እንደላክኸኝ እንዲያምኑ ነው[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በዙሪያ ለቆመው ሕዝብ ስል።”
    reason: διά ከተሳቢ ጋር ምክንያትን ወይም ለአንድ ሰው ሲባል የተደረገን ነገር ሊገልጽ ይችላል።
  - marker: b
    text: ግሪክኛው “አንተ እንደላክኸኝ” ብሎ በ“አንተ” ላይ አጽንዖት ይሰጣል።
    reason: በምንጭ ጽሑፉ ውስጥ ያለው ግልጽ ተውላጠ ስም σύ አጽንዖት እንዳለው ይገልጣል።
lexical_decisions:
- source_word: ᾔδειν
  choice: አውቅ ነበር
  rationale: የοἶδα ያለፈ ጊዜ ተግባርን በተፈጥሯዊ አማርኛ ያሳያል፤ ከአስፈላጊው በላይ የቀደመ ጊዜ ትርጉም አያስገባም።
- source_word: πάντοτέ
  choice: ሁልጊዜ
  rationale: የ‘always’ መደበኛ፣ ግልጽና ዘመናዊ የአማርኛ አቻ ነው።
- source_word: μου ἀκούεις
  choice: እንደምትሰማኝ
  rationale: በጸሎት አውድ ውስጥ ἀκούω የሚያመለክተውን መስማትና ተቀባይነት ይጠብቃል፤ ‘ትታዘዘኛለህ’ የሚል ያልተገባ ትርጉም አያስገባም።
- source_word: ἀλλὰ διὰ τὸν ὄχλον
  choice: ነገር ግን ... ስላለው ሕዝብ
  rationale: ἀλλά ያለውን ንፅፅርና διά ከተሳቢ ጋር ያለውን የምክንያት/ሲባል ስሜት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τὸν περιεστῶτα
  choice: በዙሪያዬ ቆሞ ስላለው
  rationale: ሕዝቡ በኢየሱስ ዙሪያ በዚያ ቆሞ መኖሩን የፍጹም ጊዜውን የአሁን ውጤት ጨምሮ በተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: εἶπον
  choice: ይህን ያልሁት
  rationale: ኢየሱስ ከዚህ በፊት በድምፅ የተናገረውን እንደሚጠቅስ በአማርኛ ግልጽ ያደርጋል፤ ‘ይህን’ የሚለው ከአውዱ የተገኘ አነስተኛ ማሟያ ነው።
- source_word: ἵνα πιστεύσωσιν
  choice: እንዲያምኑ
  rationale: የἵνα ዓላማ አመልካች ኃይልን በአማርኛ የዓላማ ንዑስ አረፍተ ነገር በቀጥታ ይገልጣል።
- source_word: ὅτι σύ με ἀπέστειλας
  choice: አንተ እንደላክኸኝ
  rationale: ግልጽ የሆነውን σύ በ‘አንተ’ በማስቀመጥ አጽንዖቱን ይጠብቃል፤ ἀπέστειλας ደግሞ በቀላሉ ‘ላክኸኝ’ ተብሏል።
theological_decisions:
- issue: አብ ኢየሱስን ሁልጊዜ ስለመስማቱ የተነገረው ኃይል
  choice: አብ ኢየሱስን ሁልጊዜ እንደሚሰማውና ኢየሱስም ሕዝቡን ሲል በይፋ እንደተናገረ ቀጥታ ቀርቧል።
  alternative: ንግግሩ ስለ አብና ወልድ ልዩ ግንኙነት ሳይሆን በአጠቃላይ ስለሚመለስ ጸሎት እንደሚያተኩር ሊወሰድ ይችላል።
  rationale: ቅርብ አውዱ አልዓዛርን ከማስነሳቱ በፊት ያለው የኢየሱስ ጸሎት ነው። ትርጉሙ የአብና የወልድን ቅርበትና ለሕዝቡ የተነገረበትን ዓላማ ይጠብቃል፤ ከጽሑፉ በላይ የኋለኛ ዘመን ዶክትሪናዊ ቀመር አያስገባም።
- issue: በይፋ የተነገረው ጸሎት ዓላማ
  choice: በዙሪያው ያለው ሕዝብ አብ ኢየሱስን እንደላከው እንዲያምን የታሰበ ነው።
  alternative: ዓላማው ይህን ተአምር ብቻ ለማረጋገጥ እንደሆነ በጠባብ መንገድ ሊተረጎም ይችላል።
  rationale: ግልጹ የἵνα ንዑስ አረፍተ ነገር እምነቱን ‘አንተ እንደላክኸኝ’ በሚለው ላይ ያተኩራል። ትርጉሙ ይህን ሳያጠብብ ወይም ሳያሰፋ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ቀላል የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ሕዝብ’ የሚለው ቃል ὄχλοςን በመጽሐፍ ቅዱሳዊ ክብር ሳይከብድ ያቀርባል። የግሪክኛው σύ አጽንዖት ‘አንተ’ በሚለው ግልጽ ተውላጠ ስም በዋናው ጽሑፍ ተጠብቋል።
