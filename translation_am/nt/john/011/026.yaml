  yaml_path: translation/nt/john/011/026.yaml
  text: And everyone who lives and believes in me will certainly never die forever. Do you believe this?
translation:
  language: am
  text: ሕያው ሆኖ በእኔ የሚያምን ሁሉ ለዘላለም ከቶ አይሞትም። ይህን ታምኛለሽ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ ζῶν καὶ πιστεύων εἰς ἐμέ
  choice: በሕይወት የሚኖርና በእኔ የሚያምን ሁሉ
  rationale: የግሪኩን ሁለት ተያያዥ የአሁን ጊዜ አገላለጾች በተፈጥሯዊ አማርኛ ያቆያል፤ εἰς ἐμέ የሚያመለክተውን በክርስቶስ ላይ የተደረገ እምነት ‘በእኔ የሚያምን’ በማለት ያሳያል።
- source_word: οὐ μὴ ἀποθάνῃ
  choice: ከቶ አይሞትም
  rationale: οὐ μή የሚሰጠውን ጠንካራ እምቢታ ‘ከቶ’ በሚለው ቃል ግልጽ ያደርጋል።
- source_word: εἰς τὸν αἰῶνα
  choice: ለዘላለም
  rationale: በዚህ አገባብ የጊዜን ዘላቂነት በተለመደና ክቡር አማርኛ ይገልጻል።
- source_word: πιστεύεις τοῦτο;
  choice: ይህን ታምኛለሽ?
  rationale: ጥያቄው ለማርታ በቀጥታ የተነገረ ስለሆነ የሴት ነጠላ ሁለተኛ ሰው ቅርጽን ተጠቅሟል።
theological_decisions:
- issue: ‘ከቶ አይሞትም’ እና በአካል መሞት
  choice: የግሪኩን ጠንካራና ፍጹም አነጋገር ‘ለዘላለም ከቶ አይሞትም’ በማለት በቀጥታ ማቆየት
  alternative: ‘መንፈሳዊ ሞት አይሞትም’ ወይም ‘ቢሞትም እንኳ በመጨረሻ ይኖራል’ ብሎ መተርጎም
  rationale: ጽሑፉ የሞትን ዓይነት እዚህ በግልጽ አይወስንም፤ ከቀደመው ቁጥር ጋር ያለውን የትንሣኤና የሕይወት ውጥረት ትርጉሙ ሳይፈታ ያቆየዋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር መደበኛ አማርኛ። ‘በሕይወት የሚኖር’ የሚለው አገላለጽ ὁ ζῶνን ከቀላሉ ‘የሚኖር’ ይልቅ በዐውዱ ግልጽ ያደርገዋል።
