review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the universal subject, continuing belief in Jesus, the emphatic Greek negation οὐ μὴ, the enduring temporal expression εἰς τὸν αἰῶνα, and the direct question addressed to Martha. However, “በሕይወት የሚኖር” is an unnecessarily expanded and somewhat tautological rendering of ὁ ζῶν (“the one who is alive/living”).
  naturalness: “በሕይወት የሚኖር” is understandable but less idiomatic than “ሕያው ሆኖ.” The revised wording is natural modern standard Amharic while retaining the source’s present participial sense.
  terminology: “በእኔ የሚያምን,” “ለዘላለም,” and “ከቶ አይሞትም” appropriately preserve the Greek sense without adding an interpretation of the kind of death meant. The feminine singular question appropriately reflects the immediate addressee, Martha.
  issues:
  - severity: low
    issue: The phrase “በሕይወት የሚኖር” is stylistically redundant.
    rationale: Its literal components amount to “one who lives in life.” Greek ὁ ζῶν simply identifies one who is living/alive; “ሕያው ሆኖ” expresses this more naturally and precisely in Amharic.
  revised_text: ሕያው ሆኖ በእኔ የሚያምን ሁሉ ለዘላለም ከቶ አይሞትም። ይህን ታምኛለሽ?
