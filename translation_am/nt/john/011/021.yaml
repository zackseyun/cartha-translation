review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys Martha's address, the contrary-to-fact sense, and the result that her brother would not have died. However, ብትኖር means “if you lived,” whereas εἰ ἦς ὧδε means “if you had been/were here.”
  naturalness: The revision uses a more idiomatic past counterfactual construction in modern standard Amharic and avoids the slightly redundant ኢየሱስን … አለችው structure without an introductory speech expression.
  terminology: ጌታ ሆይ is appropriate, retaining both the respectful-address sense and possible theological resonance of κύριε. The footnote is tightened so that it presents “ጌታ ሆይ” and “ክቡር ሆይ” as alternatives without introducing the possessive “my lord,” which is not expressed in Greek.
  issues:
  - severity: medium
    issue: The conditional clause uses ብትኖር.
    rationale: This normally means “if you lived,” and can imply residence or continued life. The Greek imperfect ἦς with ὧδε refers specifically to Jesus' prior presence at that place. እዚህ በነበርክ ኖሮ expresses the past unreal condition more precisely.
  - severity: low
    issue: The footnote's alternative ጌታዬ ሆይ adds a possessive element.
    rationale: κύριε is vocative “Lord/Sir” and does not contain μου (“my”). The note should retain alternatives that do not add an unexpressed possessive.
  revised_text: ማርታም ኢየሱስን እንዲህ አለችው፤ “ጌታ ሆይ፣ እዚህ በነበርክ ኖሮ፣ ወንድሜ ባልሞተ ነበር።”[a]
