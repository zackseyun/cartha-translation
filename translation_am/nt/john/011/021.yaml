  text: εἶπεν οὖν ⸀ἡ Μάρθα πρὸς ⸀τὸν Ἰησοῦν· Κύριε, εἰ ἦς ὧδε ⸂οὐκ ἂν ἀπέθανεν ὁ ἀδελφός μου⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/021.yaml
  text: So Martha said to Jesus[a], “Lord, if you had been here, my brother would not have died.”
translation:
  language: am
  text: ማርታም ኢየሱስን እንዲህ አለችው፤ “ጌታ ሆይ፣ እዚህ በነበርክ ኖሮ፣ ወንድሜ ባልሞተ ነበር።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ጌታ ሆይ” የሚለው “ክቡር ሆይ” ተብሎም ሊተረጎም ይችላል፤ የግሪኩ κύριε የአክብሮት አጠራር ሊሆን ቢችልም፣ “ጌታ” የሚለው በዮሐንስ ወንጌል ሊኖረው የሚችለውን ሥነ መለኮታዊ ክብደትም ይጠብቃል።
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: ስለዚህ
  rationale: በትረካው ውስጥ ያለውን ከቀደመው ሁኔታ ጋር የሚያገናኝ የቀጣይነትና የውጤት ኃይል ይጠብቃል።
- source_word: εἶπεν ... πρὸς τὸν Ἰησοῦν
  choice: ማርታ ኢየሱስን ... አለችው
  rationale: በዘመናዊ አማርኛ የንግግሩን ተቀባይ ተፈጥሯዊ በሆነ መንገድ ይገልጣል፤ የማርታን ሴትነትም በግሱ ያሳያል።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: እንደ አክብሮታዊ አጠራር ሊሠራ የሚችለውንና በዮሐንስ ወንጌል ሊኖረው የሚችለውን ሥነ መለኮታዊ ክብደት ሳያጠፋ ይጠብቃል።
- source_word: εἰ ἦς ὧδε
  choice: እዚህ ብትኖር ኖሮ
  rationale: በአለፈ ጊዜ ያልተፈጸመ ተቃራኒ-እውነታዊ ሁኔታን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: οὐκ ἂν ἀπέθανεν
  choice: ባልሞተም ነበር
  rationale: የአለፈ ጊዜውን ያልተፈጸመ ውጤት በአማርኛ የሁኔታ አገላለጽ በትክክል ያስተላልፋል።
- source_word: ὁ ἀδελφός μου
  choice: ወንድሜ
  rationale: በዐውዱ የማርታን ወንድም አልዓዛርን በቀጥታና በተፈጥሯዊ አማርኛ ይጠቅሳል።
theological_decisions:
- issue: ማርታ ኢየሱስን κύριε ብላ የጠራችበት አጠራር
  choice: ጌታ ሆይ
  alternative: ጌታዬ ሆይ / ክቡር ሆይ
  rationale: “ጌታ ሆይ” የአክብሮት አጠራሩንና ሊኖረው የሚችለውን ክርስቶሳዊ ክብደት ሁለቱንም ይጠብቃል፤ ጥቅሱ ብቻውን የትኛውን ገጽታ እንደሚያጎላ በማያስገድድ መልኩ ክፍትነቱን ያስቀራል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ተቃራኒ-እውነታዊ አገላለጽ “ብትኖር ኖሮ ... ባልሞተም ነበር” በሚለው ተፈጥሯዊ መዋቅር ተላልፏል።
