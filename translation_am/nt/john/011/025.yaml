- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: በእኔ የሚያምን ሰው
  rationale: ስማዊ የአሁን ጊዜ አንቀጹን እንደ አጠቃላይ ባሕርይ ያቀርባል፤ πιστεύω εἰς የሚለውም በተፈጥሯዊው ‘በ… ማመን’ ተተርጉሟል።
- source_word: κἂν ἀποθάνῃ
  choice: ቢሞት እንኳ
  rationale: የቅናሽ ሁኔታውን ‘even if’ በተፈጥሯዊና ግልጽ የአማርኛ አወቃቀር ያስተላልፋል።
- source_word: ζήσεται
  choice: ይኖራል
  rationale: ‘ደግሞ ሕያው ይሆናል’ ወይም ‘ይነሣል’ ብሎ ጽሑፉ ያልገለጠውን ሳይጨምር፣ ሰፊውን ‘ይኖራል/ሕያው ይሆናል’ ትርጉም ይጠብቃል።
