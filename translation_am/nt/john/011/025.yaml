  text: ኢየሱስም እንዲህ አላት፦ “እኔ ትንሣኤና ሕይወት ነኝ፤ በእኔ የሚያምን ሰው፣ ቢሞት እንኳ ይኖራል።”[a]
  philosophy: optimal-equivalence
  footnotes:
