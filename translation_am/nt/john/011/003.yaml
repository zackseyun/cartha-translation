  edition: SBLGNT
  text: ἀπέστειλαν οὖν αἱ ἀδελφαὶ πρὸς αὐτὸν λέγουσαι· Κύριε, ἴδε ὃν φιλεῖς ἀσθενεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/003.yaml
  text: So the sisters sent word to him, saying, “Lord, look, the one you love is sick.”
translation:
  language: am
  text: ስለዚህ እህቶቹ፣ “ጌታ ሆይ፣ እነሆ፣ የምትወደው ታሟል” ብለው ወደ እርሱ መልእክት ላኩ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλαν ... πρὸς αὐτόν
  choice: ወደ እርሱ መልእክት ላኩ
  rationale: ግሪኩ በቀጥታ ‘ወደ እርሱ ላኩ’ ቢልም፣ በአማርኛ የተላከው የቃል መልእክት መሆኑን ‘መልእክት’ በማከል በተፈጥሯዊ ሁኔታ ይገልጻል።
- source_word: ἴδε
  choice: እነሆ
  rationale: ትኩረትን የሚስበውን የግሪክ አገላለጽ በክብር ያለውና የተለመደ የአማርኛ ቃል ይጠብቃል።
- source_word: ὃν φιλεῖς
  choice: የምትወደው ሰው
  rationale: የፍቅርን የግል ቅርበት በቀላልና ተፈጥሯዊ አማርኛ ያስተላልፋል፤ ‘ሰው’ የተተወውን ስም ግልጽ ያደርጋል።
- source_word: ἀσθενεῖ
  choice: ታሟል
  rationale: በዚህ አውድ ያለውን ‘ታሞአል/በሽተኛ ነው’ የሚለውን ትርጉም በዘመናዊና ተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: φιλέω የሚገልጸው የፍቅር ዓይነት
  choice: የምትወደው
  alternative: ወዳጅህ
  rationale: ግሱን በአጠቃላይ ‘መውደድ’ ብሎ መተርጎም የግል ቅርበቱን ይጠብቃል፣ ነገር ግን ጽሑፉ በግልጽ ያልወሰነውን ልዩ የፍቅር መደብ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ፤ ‘ጌታ ሆይ’ የቀጥታ ንግግሩን አክብሮታዊ አቀራረብ ይጠብቃል።
