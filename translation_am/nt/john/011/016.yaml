review_pass:
  verdict: revise
  source_fidelity: The draft conveys the principal sense of the Greek, including Thomas’s epithet, his appeal to the other disciples, the inclusive force of καὶ ἡμεῖς, and the unqualified prospect of dying with Jesus. However, ለአብረውት ደቀ መዛሙርት is not idiomatic or grammatically sound for τοῖς συμμαθηταῖς.
  naturalness: Replace the malformed expression ለአብረውት ደቀ መዛሙርት with the natural modern Amharic ለባልንጀሮቹ ደቀ መዛሙርት. እንግዲህ is a more natural narrative-continuative rendering of οὖν here than the more strongly causal ስለዚህ.
  terminology: ቶማስ, መንታ, ደቀ መዛሙርት, and ከእርሱ ጋር are appropriate. Translating Δίδυμος as መንታ makes a footnote explaining its meaning unnecessary.
  issues:
  - severity: medium
    issue: ለአብረውት ደቀ መዛሙርት is not a natural or well-formed expression.
    rationale: τοῖς συμμαθηταῖς means ‘to his fellow disciples.’ ለባልንጀሮቹ ደቀ መዛሙርት expresses this relationship idiomatically and retains the referential association with Thomas.
  - severity: low
    issue: ስለዚህ may overstate the causal force of οὖν.
    rationale: In this narrative setting οὖν can mark continuation or response as well as inference. እንግዲህ preserves that connection without making the logic more explicit than the Greek.
  revised_text: እንግዲህ መንታ የሚባለው ቶማስ ለባልንጀሮቹ ደቀ መዛሙርት፣ “እኛም ከእርሱ ጋር እንድንሞት እንሂድ” አላቸው።
