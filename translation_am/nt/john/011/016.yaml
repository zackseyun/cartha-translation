  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἶπεν οὖν Θωμᾶς ὁ λεγόμενος Δίδυμος τοῖς συμμαθηταῖς· Ἄγωμεν καὶ ἡμεῖς ἵνα ἀποθάνωμεν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/016.yaml
  text: So Thomas[a], called Didymus, said to his fellow disciples, “Let us also go, so that we may die with him.”
translation:
  language: am
  text: እንግዲህ መንታ የሚባለው ቶማስ ለባልንጀሮቹ ደቀ መዛሙርት፣ “እኛም ከእርሱ ጋር እንድንሞት እንሂድ” አላቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ንግግር የሚከተለውን ምክንያታዊና ትረካዊ ቅጥልጥል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Θωμᾶς
  choice: ቶማስ
  rationale: የግል ስሙን በተለመደው የአማርኛ አጻጻፍ ያቀርባል።
- source_word: ὁ λεγόμενος Δίδυμος
  choice: መንታ የሚባለው
  rationale: Δίδυμος ትርጉሙ ‘መንታ’ ስለሆነ ትርጉም ያለውን መጠሪያ በግልጽ አማርኛ ያቀርባል።
- source_word: τοῖς συμμαθηταῖς
  choice: ለአብረውት ደቀ መዛሙርት
  rationale: የቶማስን ከሌሎቹ ደቀ መዛሙርት ጋር ያለውን አብሮነት በተፈጥሯዊ አገላለጽ ይገልጣል።
- source_word: Ἄγωμεν
  choice: እንሂድ
  rationale: የመጀመሪያ መደብ ብዙ ቁጥር የማበረታቻ ንዑስ አንቀጽን በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: καὶ ἡμεῖς
  choice: እኛም
  rationale: ቶማስና ሌሎቹም ከኢየሱስ ጋር እንዲሄዱ የተናገረውን አካታች አጽንዖት ይጠብቃል።
- source_word: ἵνα ἀποθάνωμεν
  choice: እንድንሞት
  rationale: ἵνα ከንዑስ አንቀጹ ጋር የሚያመለክተውን ዓላማ ወይም የሚጠበቅ ውጤት ሳይወስን በግልጽ ያቀርባል።
- source_word: μετ’ αὐτοῦ
  choice: ከእርሱ ጋር
  rationale: አብሮ መሆንን በቀጥታ ያሳያል፤ ተውላጠ ስሙ ከአውዱ ኢየሱስን ያመለክታል።
theological_decisions:
- issue: የቶማስ ንግግር ድምፀትና ዓላማ
  choice: ንግግሩን ትርጓሜያዊ ቀለም ሳይጨመርበት በቀጥታ ማቅረብ
  alternative: እንደ ደፋር ታማኝነት፣ ተስፋ እንደቆረጠ እጅ መስጠት፣ ወይም እንደ ምጸታዊ ተስፋ መቁረጥ ማብራራት
  rationale: ግሪክኛው የቶማስን ቃል ይዘግባል እንጂ ድምፀቱን ወይም ሥነ ልቦናዊ ዓላማውን አይወስንም፤ ትርጉሙም ይህን አሻሚነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የግሪክኛውን Δίδυμος ድምፅ ብቻ ከመጻፍ ይልቅ ትርጉሙ ‘መንታ’ በዋናው ጽሑፍ ቀርቧል፤ ስለዚህ የግርጌ ማስታወሻ አያስፈልግም።
