id: JHN.11.5
reference: John 11:5
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἠγάπα δὲ ὁ Ἰησοῦς τὴν Μάρθαν καὶ τὴν ἀδελφὴν αὐτῆς καὶ τὸν Λάζαρον.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/005.yaml
  text: Jesus loved Martha and her sister and Lazarus.
translation:
  language: am
  text: ኢየሱስም ማርታን፣ እህቷንና አልዓዛርን ይወዳቸው ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγάπα
  choice: ይወዳቸው ነበር
  rationale: የἀγαπάω ያለፈ ጊዜ ያልተፈጸመ አኳኋን (imperfect) ኢየሱስ ለሦስቱ የነበረውን ቀጣይ ፍቅር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: δὲ
  choice: -ም
  rationale: δὲ እዚህ ጠንካራ ተቃርኖ ሳይሆን ቀላል የንግግር ማያያዣ ነው፤ ከግስ ባለቤቱ ጋር የተያያዘው «-ም» ይህን ፍሰት በተፈጥሯዊ መንገድ ይገልጣል።
- source_word: τὴν Μάρθαν
  choice: ማርታን
  rationale: የግል ስሙን በተለመደው የአማርኛ አጻጻፍ ያቀርባል፤ «-ን» የቀጥተኛ ተሳቢነቱን ያመለክታል።
- source_word: τὴν ἀδελφὴν αὐτῆς
  choice: እህቷን
  rationale: ግሪኩ በዚህ ቁጥር ስሟን አይጠቅስም፤ «እህቷን» የባለቤትነቱን ግንኙነት በአጭርና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: τὸν Λάζαρον
  choice: አልዓዛርን
  rationale: ስሙን በተለመደው የአማርኛ መጽሐፍ ቅዱሳዊ አጻጻፍ ያቀርባል፤ «-ን» የቀጥተኛ ተሳቢነቱን ያሳያል።
- source_word: καὶ ... καὶ
  choice: ፣ ... -ና
  rationale: የግሪኩን ሦስት ተሳቢዎች ዝርዝር በዘመናዊ አማርኛ ተፈጥሯዊ የዝርዝር አወቃቀር ያቀርባል።
theological_decisions:
- issue: ἠγάπα የተባለው ያልተፈጸመ የግስ አኳኋን ስለ ኢየሱስ ፍቅር የሚያሳየው
  choice: ኢየሱስ ማርታን፣ እህቷንና አልዓዛርን በቀጣይነት ይወድ እንደነበር የሚገልጽ መደበኛ ንግግር
  alternative: «መውደድ ጀመረ» ወይም በእጅጉ አጽንዖት ያለው «እየወደዳቸው ነበር»
  rationale: የግሱ imperfect አኳኋን በያለፈው ጊዜ የቀጠለ ሁኔታን በተሻለ ሁኔታ ያሳያል፤ ጥቅሱ ከሚለው በላይ ስሜታዊ ወይም አስተምህሯዊ ፍቺ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። የግሪኩ ቀላል ማያያዣ በ«ኢየሱስም» ተጠብቋል፤ የእህቷ ስም በጥቅሱ ስላልተጠቀሰ አልተጨመረም።
