- source_word: ὅτι ἀσθενεῖ
  choice: መታመሙን
  rationale: በአልዓዛር ትረካ ውስጥ ἀσθενέω የአካል ሕመምን ያመለክታል። «መታመሙን» በአማርኛ የተፈጥሮ ያለው የተዘዋዋሪ ንግግር ነው፤ የግሪኩን የአሁን ጊዜ ቅርጽ ግን በግልጽ አይወስንም፣ ስለዚህ አማራጩ በማስታወሻ ቀርቧል።
- source_word: τότε μὲν
