  rationale: ጥቅሱ ኢየሱስ ሕመሙን እንደሰማና ከዚያም ሁለት ቀን እንደቆየ ሆን ብሎ ጎን ለጎን ያቀርባል። ትርጉሙ ይህን ሥነ መለኮታዊ ውጥረት ሊጠብቅ እንጂ በራሱ ሊፈታው አይገባም።
