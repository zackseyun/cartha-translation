  edition: SBLGNT
  text: ⸂πολλοὶ δὲ⸃ ἐκ τῶν Ἰουδαίων ἐληλύθεισαν πρὸς ⸀τὴν Μάρθαν καὶ ⸀Μαριὰμ ἵνα παραμυθήσωνται αὐτὰς περὶ τοῦ ⸀ἀδελφοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/019.yaml
  text: Many of the Jews had come to Martha and Mary to comfort them about their brother[a].
translation:
  language: am
  text: ከአይሁድ መካከልም[a] ብዙዎች ማርታንና ማርያምን ስለ ወንድማቸው ሊያጽናኗቸው መጥተው ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከይሁዳውያን መካከል ብዙዎች።” የግሪኩ ቃል በአጠቃላይ አይሁድን፣ በዮሐንስ ወንጌል በአንዳንድ አውዶች ደግሞ በተለይ የይሁዳ ሰዎችን ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: πολλοὶ δὲ
  choice: ብዙዎች … -ም
  rationale: πολλοί የሚለውን “ብዙዎች” በማለት ተርጉሟል፤ δέ ደግሞ ጠንካራ ተቃርኖን ሳያመለክት የንግግር ቅጥያ በሆነው “-ም” ተገልጿል።
- source_word: ἐκ τῶν Ἰουδαίων
  choice: ከአይሁድ
  rationale: ἐκ ያለውን ከአንድ ማኅበር መካከል የመሆን ትርጉም “ከ-” ያሳያል። Ἰουδαῖοι እዚህ በሐዘን ላይ ያሉትን እህቶች ለማጽናናት የመጡ አይሁድን ያመለክታል፤ የቦታ ትርጉሙ ግን በማስታወሻ ተጠብቋል።
- source_word: ἐληλύθεισαν
  choice: መጥተው ነበር
  rationale: የግሪኩ የቀድሞ ፍጹም ጊዜ ከትረካው ጊዜ በፊት መምጣታቸውን ያሳያል፤ “መጥተው ነበር” ይህን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: πρὸς τὴν Μάρθαν καὶ Μαριὰμ
  choice: ወደ ማርታና ማርያም
  rationale: πρός ከተሳቢ ሙያ ጋር ወደ ሰዎቹ መሄድን ወይም መጎብኘትን ያመለክታል። ስሞቹ በተለመደው የአማርኛ መጽሐፍ ቅዱስ አጻጻፍ ቀርበዋል።
- source_word: ἵνα παραμυθήσωνται αὐτὰς
  choice: ሊያጽናኗቸው
  rationale: ἵνα ከንዑስ አንቀጽ ጋር የዓላማ ትርጉም አለው፤ παραμυθέομαι በሐዘን ውስጥ ማጽናናትን ያመለክታል። የሴት ብዙ ተሳቢው በአማርኛ “-ኗቸው” ተገልጿል።
- source_word: περὶ τοῦ ἀδελφοῦ
  choice: ስለ ወንድማቸው
  rationale: περί ከባለቤት ሙያ ጋር “ስለ/በተመለከተ” ማለት ነው። ግሪኩ “ወንድሙ” የሚል ቢሆንም፣ ማርታና ማርያም የሚጋሩትን ወንድም ስለሚያመለክት “ወንድማቸው” ተፈጥሯዊና ግልጽ ነው።
theological_decisions:
- issue: በዮሐንስ ወንጌል የἸουδαίων አተረጓጎም
  choice: አይሁድ
  alternative: ይሁዳውያን
  rationale: አውዱ ጠላትነትን ሳይሆን ለቅሶ ቤት የመጡ ሰዎችን ይገልጣል፤ ስለዚህ ሰፊው የሕዝብና የሃይማኖት መለያ “አይሁድ” ይበልጥ ይስማማል። ሆኖም ቃሉ በዮሐንስ አንዳንድ አውዶች “ይሁዳውያን” ሊል ስለሚችል አማራጩ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ሊያጽናኗቸው” የሐዘኑን አውድ በተፈጥሯዊ ሁኔታ ያስተላልፋል፤ የግሪኩ የጊዜ ግንኙነትም “መጥተው ነበር” በሚለው ተጠብቋል።
