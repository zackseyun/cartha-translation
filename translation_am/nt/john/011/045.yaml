  verdict: revise
  source_fidelity: The draft retains the inferential οὖν, the partitive sense of ἐκ τῶν Ἰουδαίων, the two attributive participles, and πιστεύω εἰς αὐτόν. A small reordering makes the Greek modifiers and their common referent clearer in Amharic.
