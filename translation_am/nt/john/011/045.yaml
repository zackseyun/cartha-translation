  terminology: “አይሁድ” and “በእርሱ አመኑ” are appropriate. The note should use “የይሁዳ ነዋሪዎች” rather than the less precise “የይሁዳ ሰዎች” for the possible sense “Judeans.”
  issues:
  - severity: low
    issue: Awkward placement of the partitive noun phrase and relative clauses
    rationale: The source identifies many members of the Jewish group and then qualifies them as those who came to Mary and saw what Jesus did. Reordering preserves this structure while reading more smoothly in Amharic.
  - severity: low
    issue: Footnote’s possible rendering of Ἰουδαῖοι is imprecise
    rationale: “የይሁዳ ነዋሪዎች” is the clearer modern Amharic equivalent of “Judeans” and avoids implying merely people belonging to Judah in an undefined sense.
