  text: Πολλοὶ οὖν ἐκ τῶν Ἰουδαίων, οἱ ἐλθόντες πρὸς τὴν ⸀Μαριὰμ καὶ θεασάμενοι ⸀ἃ ⸀ἐποίησεν, ἐπίστευσαν εἰς αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/045.yaml
  text: Therefore many of the Jews who had come to Mary and had seen what he had done believed in him[a].
translation:
  language: am
  text: ስለዚህ ከአይሁድ መካከል ወደ ማርያም የመጡትና እርሱ ያደረገውን ያዩት ብዙዎቹ በእርሱ አመኑ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ከአይሁድ» ተብሎም ሊተረጎም ይችላል፤ በአንዳንድ የዮሐንስ አውዶች Ἰουδαῖοι «የይሁዳ ነዋሪዎች» ተብሎ ሊተረጎም እንደሚችል ይታሰባል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλοὶ
  choice: ብዙዎች
  rationale: ቁጥራቸው ያልተወሰነ ነገር ግን ከፍተኛ መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከአልዓዛር መነሣት ትረካ ጋር ያለውን ውጤታዊ ወይም ምክንያታዊ ግንኙነት ይጠብቃል።
- source_word: ἐκ τῶν Ἰουδαίων
  choice: ከአይሁድ
  rationale: የግሪኩን ከአንድ ስብስብ የተወሰደ ክፍል የሚያመለክት አገላለጽ በግልጽ ሁኔታ ይጠብቃል፤ በአውዱ ውስጥ «አይሁድ» ተፈጥሯዊው ምርጫ ነው።
- source_word: οἱ ἐλθόντες πρὸς τὴν Μαριὰμ
  choice: ወደ ማርያም መጥተው የነበሩት
  rationale: የአንቀጹን መግለጫዊ ተግባርና መምጣቱ ከዋናው ድርጊት በፊት መሆኑን ያሳያል።
- source_word: θεασάμενοι
  choice: ያዩት
  rationale: በትኩረት ማየትን ሊያመለክት የሚችለውን ግስ በአውዱ ተፈጥሯዊና በቂ በሆነ አማርኛ ያቀርባል።
- source_word: ἃ ἐποίησεν
  choice: እርሱ ያደረገውን
  rationale: የግሪኩን ገለልተኛ ብዙ ቁጥር ዝምድናዊ ሐረግ በተፈጥሯዊ አማርኛ ይተረጉማል።
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: በእርሱ አመኑ
  rationale: በዮሐንስ አጠቃቀም ወደ ኢየሱስ የተመራውን የግል እምነት ያለ ተጨማሪ ትርጓሜ በመደበኛ አማርኛ ይገልጻል።
theological_decisions:
- issue: በዮሐንስ የድነት እምነት አውድ ውስጥ πιστεύω εἰς የሚለውን መተርጎም
  choice: በእርሱ አመኑ
  alternative: በእርሱ ታመኑ
  rationale: «በእርሱ አመኑ» የግሪኩን የተለመደ አገላለጽ ይጠብቃል፤ «ታመኑ» የመታመንን ክፍል ይበልጥ አጉልቶ ሊያቀርብ ስለሚችል አልተመረጠም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ክፍላዊ አገላለጽ «ከአይሁድ» ተጠብቋል፤ የትርጉም አማራጩ በማስታወሻ ቀርቧል።
