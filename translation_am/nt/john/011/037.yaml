    reason: ποιῆσαι ἵνα … μὴ ἀποθάνῃ የሚለውን ውጤት አስከታይ አገላለጽ ‘ከመሞት መጠበቅ’ በሚል ተፈጥሯዊ አማርኛ ማቅረብ ይቻላል።
