id: JHN.11.47
reference: John 11:47
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: συνήγαγον οὖν οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι συνέδριον, καὶ ἔλεγον· Τί ποιοῦμεν ὅτι οὗτος ὁ ἄνθρωπος πολλὰ ⸂ποιεῖ σημεῖα⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/047.yaml
  text: So the chief priests and the Pharisees gathered a council and were saying[a], “What are we doing? For this man is doing many signs.”
translation:
  language: am
  text: ስለዚህ ዋነኞቹ ካህናትና ፈሪሳውያን ሸንጎ[a] ሰብስበው፣ “ምን እያደረግን ነው? ይህ ሰው ብዙ ምልክቶችን እያደረገ ነውና” እያሉ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሳንሄድሪን”፤ የአይሁድ ገዥ ሸንጎ።
    reason: alternative_reading
lexical_decisions:
- source_word: συνήγαγον
  choice: ሰብስበው
  rationale: የግሪኩን አኦሪስት ንቁ ግስ በተፈጥሯዊ አማርኛ ይገልጻል፤ συνέδριονን እንደ ቀጥተኛ ተሳቢ ይይዛል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከአልዓዛር መነሣት በኋላ የተከተለውን ትረካዊና ምክንያታዊ ውጤት ያሳያል።
- source_word: ἀρχιερεῖς
  choice: የካህናት አለቆች
  rationale: ብዙ ሊቃነ ካህናት እንዳሉ ሳያስመስል፣ መሪ የክህነት ባለሥልጣናትን በትክክል ይጠቁማል።
- source_word: Φαρισαῖοι
  choice: ፈሪሳውያን
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የቡድኑን ስም ይጠብቃል።
- source_word: συνέδριον
  choice: ሸንጎ
  rationale: ለውሳኔና ለምክክር የሚሰበሰብን ገዥ ምክር ቤት በአጭርና ተፈጥሯዊ አማርኛ ይገልጻል፤ የተወሰነው ተቋማዊ መጠሪያ በማስታወሻ ቀርቧል።
- source_word: ἔλεγον
  choice: ይሉ ነበር
  rationale: የኢምፐርፌክት ግሱን ቀጣይ ወይም ተደጋጋሚ የንግግር ገጽታ ይጠብቃል።
- source_word: Τί ποιοῦμεν
  choice: ምን እያደረግን ነው?
  rationale: የግሪኩን የአሁን አመልካች ቅርጽ ይጠብቃል፤ ጥያቄው ያለውን የመደናገጥና የድርጊት እጥረት ስሜትም አያጠፋም።
- source_word: ὅτι
  choice: ነውና
  rationale: ለቀደመው ጥያቄ ምክንያት የሚሰጠውን ሐረግ በተፈጥሯዊ አማርኛ ያገናኛል።
- source_word: οὗτος ὁ ἄνθρωπος
  choice: ይህ ሰው
  rationale: የተናጋሪዎቹን ርቀት ያለውና በመጠኑ አቃላይ አጠራር በቀጥታ ይጠብቃል።
- source_word: πολλὰ ποιεῖ σημεῖα
  choice: ብዙ ምልክቶችን እያደረገ ነው
  rationale: የአሁን ጊዜውን ቀጣይነት ይጠብቃል፤ σημεῖαን ‘ተአምራት’ ብሎ በመተርጎም የዮሐንስን ከድርጊቶቹ በላይ ወደ ኢየሱስ ማንነት የሚያመለክት አጽንዖት አያጠፋም።
theological_decisions:
- issue: በዮሐንስ አውድ σημεῖαን መተርጎም
  choice: ምልክቶች
  alternative: ተአምራት / ተአምራዊ ምልክቶች
  rationale: ዮሐንስ የኢየሱስን ሥራዎች ከራሳቸው ባሻገር ማንነቱን እንደሚገልጡ አድርጎ ያቀርባል። ‘ምልክቶች’ ይህን ክብደት ያለ ትርጓሜያዊ ጭማሪ ይጠብቃል።
- issue: συνέδριον እንደ አጠቃላይ ሸንጎ ወይም እንደ ሳንሄድሪን መግለጽ
  choice: ሸንጎ
  alternative: ሳንሄድሪን
  rationale: ዋናው ጽሑፍ የግሪኩን ስም ትርጉም ያቀርባል እንጂ የተወሰነውን ቴክኒካዊ ስያሜ በግድ አያስገባም። ሊሆን የሚችለው ተቋማዊ መለያ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። የትርጓሜ ማስታወሻው ምልክት [a] በሚገልጸው “ሸንጎ” ላይ ተቀምጧል፤ ይህም ማስታወሻው ከሚመለከተው συνέδριον ጋር በትክክል ያያይዘዋል።
