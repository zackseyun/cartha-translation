lexical_decisions:
- source_word: εἶπεν
  choice: አለ
  rationale: λέγω መደበኛው የመናገር ግስ ነው። ንግግሩ ጥያቄ ቢሆንም «ጠየቀ» ብሎ በትርጓሜ ከመለወጥ ይልቅ የግሪኩን አገላለጽ «አለ» በማለት መጠበቅ ተገቢ ነው።
- source_word: Ποῦ
