- source_word: ἔρχου καὶ ἴδε
  choice: መጥተህ እይ
  rationale: ሁለቱ ትእዛዛዊ ቅርጾች በተፈጥሯዊ አማርኛ ቀዳሚውን ድርጊት በአያያዥ ግስ፣ ዋናውን ጥሪ ደግሞ በትእዛዛዊ ቅርጽ በማቅረብ «መጥተህ እይ» ተብለዋል።
