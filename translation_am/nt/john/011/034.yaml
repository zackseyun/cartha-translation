  rationale: በግሪክ የታሪክ አሁን ጊዜ ቢሆንም፣ የአማርኛ ትረካ በተፈጥሮ ያለፈ ጊዜን ይጠቀማል። «-ት» የሚለው ቅጥያ αὐτῷን ይወክላል።
