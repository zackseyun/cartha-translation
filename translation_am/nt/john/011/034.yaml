  rationale: ተባዕታይ ነጠላ ተውላጠ ስም ሲሆን አልዓዛርን ያመለክታል፤ በአማርኛ «አኖራችሁት» በሚለው ግስ ውስጥ በተሳቢ ቅጥያ ተገልጿል።
- source_word: λέγουσιν
