review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Martha's statement, her certainty, the future rising, and the eschatological resurrection. However, the subject suffix -ም in ማርታም normally adds an unrepresented sense such as “Martha too/also” (or a marked connective force). It should not be retained for the unmarked Greek subject ἡ Μάρθα.
  naturalness: The revised wording uses clear modern standard Amharic. Placing the speech introducer before the quotation and expressing the closely linked phrases as “the resurrection that will occur on the last day” is natural while retaining the source's temporal and definite reference.
  terminology: ትንሣኤ is the established and appropriate Amharic term for ἀνάστασις. መጨረሻው ቀን accurately renders the Johannine expression “the last day.” No doctrinal expansion is introduced.
  issues:
  - severity: medium
    issue: The subject is marked as ማርታም.
    rationale: The enclitic -ም ordinarily contributes “also/too” or a discourse-linking emphasis. The Greek simply identifies Martha as speaker and does not express this addition. Use ማርታ instead.
  - severity: low
    issue: The main wording places two bare በ-phrases together in a way that is somewhat stiff and can momentarily obscure their relation.
    rationale: A relative construction naturally expresses that the resurrection is associated with the last day, while preserving the verse's future eschatological reference.
  revised_text: ማርታ እንዲህ አለችው፤ “በመጨረሻው ቀን በሚሆነው ትንሣኤ[a] እንደሚነሣ አውቃለሁ።”
