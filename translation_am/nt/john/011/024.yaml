base_translation:
  language: en
  yaml_path: translation/nt/john/011/024.yaml
  text: Martha said to him[a], “I know that he will rise again in the resurrection on the last day.”
translation:
  language: am
  text: ማርታ እንዲህ አለችው፤ “በመጨረሻው ቀን በሚሆነው ትንሣኤ[a] እንደሚነሣ አውቃለሁ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በትንሣኤው፣ በመጨረሻው ቀን።”
    reason: የግሪኩን ሁለት ተከታታይ ἐν ሐረጎች በቅርብ የሚከተል አማራጭ አቀራረብ ነው።
lexical_decisions:
- source_word: λέγει αὐτῷ ἡ Μάρθα
  choice: ማርታም … አለችው
  rationale: የግሪኩን ታሪካዊ የአሁን ጊዜ ግስ በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜ መልክ ያቀርባል፤ የተናገረችው ማርታ መሆኗንና ንግግሩ ለእርሱ መሆኑን የግሱ ሴታዊ ቅርጽና የተውላጠ ስም ቅጥያ ያሳያሉ።
- source_word: Οἶδα
  choice: አውቃለሁ
  rationale: የማርታን እርግጠኛ የእውቀት ንግግር በቀጥታና በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἀναστήσεται
  choice: እንደሚነሣ
  rationale: የወደፊት ጊዜውንና በትንሣኤ አውድ ከሞት መነሣትን ይጠብቃል፤ ግሪኩ እንደሚያደርገው ድርጊቱን ንቁ በሆነ አቀራረብ እንጂ ‘እንደሚነሣለት’ በሚል ተደራጊ መልክ አያቀርብም።
- source_word: ἐν τῇ ἀναστάσει
  choice: በትንሣኤው
  rationale: ἐν የሚለውን ቅድመ አገባብና የተወሰነውን የፍጻሜ ዘመን ትንሣኤ በአጭርና በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: በመጨረሻው ቀን
  rationale: የጊዜ ማመልከቻውን እና ἐσχάτῃ የሚለውን ‘መጨረሻ’ ትርጉም በተለመደው የአማርኛ አገላለጽ ያስተላልፋል።
theological_decisions:
- issue: የፍጻሜ ዘመን ትንሣኤ
  choice: ‘በመጨረሻው ቀን በትንሣኤው’ በማለት ወደፊት የሚሆነውን ከሞት መነሣት በግልጽ መጥቀስ
  alternative: ከሞት በኋላ ስላለ ሕይወት ብቻ የሚናገር አጠቃላይ ተስፋ አድርጎ ማቅረብ
  rationale: ἀναστήσεται እና ἀνάστασις የሚሉት ድርብ የትንሣኤ ቃላት ‘በመጨረሻው ቀን’ ከሚለው ጋር ተያይዘው የወደፊቱን ትንሣኤ ያመለክታሉ። ትርጉሙ ከጽሑፉ በላይ ተጨማሪ የእምነት ሥርዓት ዝርዝር አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ትንሣኤ’ በመጽሐፍ ቅዱሳዊ አጠቃቀም የታወቀ ቃል በመሆኑ ተጠብቋል፤ የውይይቱ ተፈጥሯዊ ፍሰት እንዲኖር የንግግር መግለጫው ከጥቅሱ በኋላ ቀርቧል።
