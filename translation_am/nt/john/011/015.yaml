  yaml_path: translation/nt/john/011/015.yaml
  text: And I am glad for your sake that I was not there[a], so that you may believe. But let us go to him.
translation:
  language: am
  text: በዚያ ባለመገኘቴ ስለ እናንተ ደስ ይለኛል፤ እናንተ እንድታምኑ[a]። ነገር ግን ወደ እርሱ እንሂድ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ወደ እምነት እንድትመጡ።» የግሪኩ የአዎሪስት ሰብጃንክቲቭ ቅርጽ ወደ እምነት መምጣትን ሊያጎላ ይችላል፤ በዋናው ጽሑፍ ግን ሰፊውና የትርጓሜ ጭነት ያነሰው «እንድታምኑ» ተጠቅሟል።
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρω
  choice: ደስ ብሎኛል
  rationale: የአሁን ጊዜውን አዎንታዊ ስሜት በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል፤ «ሐሴት አደርጋለሁ» ከዐውዱ አንጻር ከመጠን በላይ ሥነ ሥርዓታዊ ሊሰማ ይችላል።
- source_word: δι’ ὑμᾶς
  choice: ስለ እናንተ
  rationale: διά ከተሳቢ ጋር ያለውን ለእነርሱ ጥቅም የሚያመለክት ሐሳብ በተፈጥሯዊ አማርኛ ይገልጣል፤ ኢየሱስ ደስ ያለው ሁኔታው ለደቀ መዛሙርቱ እምነት ጥቅም ስለሚሆን ነው።
- source_word: ἵνα πιστεύσητε
  choice: እናንተ እንድታምኑ
  rationale: ἵνα ከአዎሪስት ሰብጃንክቲቭ ጋር የዓላማ ሐሳብን ያሳያል። «እንድታምኑ» የπιστεύωን ሰፊ ትርጉም ይጠብቃል፤ «ወደ እምነት እንድትመጡ» የሚለው አማራጭ መነሻዊ ኃይሉን ሊያጎላ ቢችልም ከጽሑፉ በላይ የቀድሞ አለማመንን ሊያስገባ ይችላል።
- source_word: ὅτι οὐκ ἤμην ἐκεῖ
  choice: በዚያ ባለመኖሬ
  rationale: ὅτι ኢየሱስ ደስ ያለውን ነገር ይዘት ያስተዋውቃል። የአማርኛው ምክንያታዊ ግንባታ ተፈጥሯዊ ሆኖ «በዚያ አልነበርኩም» የሚለውን ይዘት ሳይቀይር ያቀርባል።
- source_word: ἀλλὰ ἄγωμεν πρὸς αὐτόν
  choice: ነገር ግን ወደ እርሱ እንሂድ
  rationale: ἀλλά ንግግሩን ከማብራሪያ ወደ ተግባር የሚያሸጋግር ተቃርኖ ነው፤ ἄγωμεν የማበረታቻ የመጀመሪያ መደብ ብዙ ቁጥር ሰብጃንክቲቭ ስለሆነ «እንሂድ» ተገቢ ነው፤ πρὸς αὐτόν ደግሞ ወደ ሰውየው መንቀሳቀስን ያሳያል።
theological_decisions:
- issue: በዮሐንስ ዐውድ የπιστεύσητε ኃይል
  choice: እንድታምኑ
