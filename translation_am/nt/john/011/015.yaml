  rationale: የአዎሪስት ሰብጃንክቲቭ ቅርጽ ወደ እምነት መግባትን ሊያጎላ ይችላል፤ ሆኖም ጽሑፉ ደቀ መዛሙርቱ ከዚህ በፊት ፈጽሞ አላመኑም የሚል ጠንካራ ድምዳሜ አያስገድድም። «እንድታምኑ» ይህን ሥነ መለኮታዊ ውጥረት ሳይፈታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩን የዓላማ አወቃቀር ለአማርኛ ተፈጥሯዊነት በማስቀደም ተደርድሯል፤ የእምነት ግሱ ያለው እውነተኛ አሻሚነት በማስታወሻ ተጠብቋል።
