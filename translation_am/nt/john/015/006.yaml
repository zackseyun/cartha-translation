  text: ἐὰν μή τις ⸀μένῃ ἐν ἐμοί, ἐβλήθη ἔξω ὡς τὸ κλῆμα καὶ ἐξηράνθη, καὶ συνάγουσιν αὐτὰ καὶ εἰς τὸ πῦρ βάλλουσιν καὶ καίεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/006.yaml
  text: If anyone does not remain in me[a], he is thrown out like the branch and dries up; and they gather them and throw them into the fire[b], and they are burned.
translation:
  language: am
  text: ማንም በእኔ ካልኖረ፣ እንደ ወይን ቅርንጫፍ ወደ ውጭ ይጣላል፤ ይደርቃልም። እነዚህንም ሰብስበው ወደ እሳት ይጥሏቸዋል[a]፤ ይቃጠላሉም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይህ ምስል መገለልንና በእሳት መቃጠልን ያስጠነቅቃል፤ ሆኖም ቁጥሩ ራሱ ይህ የእውነተኛ ደቀ መዝሙርነት መጥፋትን ወይም የሐሰት ቁርኝት መጋለጥን እንደሚገልጽ አይወስንም።
    reason: alternative_reading
lexical_decisions:
- source_word: μένῃ
  choice: የማይኖር
  rationale: μένω በዮሐንስ ወንጌል የቀጣይነትንና የግንኙነትን ጽናት የሚገልጽ ቁልፍ ቃል ነው። «መኖር» በአማርኛ ተፈጥሯዊ ሲሆን «በእኔ» ከሚለው ጋር የምሳሌውን ጥልቅ ግንኙነት ይጠብቃል።
- source_word: ἐν ἐμοί
  choice: በእኔ
  rationale: የግሪኩን ቅርበትና ከኢየሱስ ጋር የመቀጠልን ሥነ መለኮታዊ ኃይል ይጠብቃል፤ «ከእኔ ጋር» ተብሎ አልተለወጠም።
- source_word: ἐβλήθη ἔξω
  choice: ወደ ውጭ ይጣላል
  rationale: የግሪኩን ተደራጊ አቀራረብ ይጠብቃል። ያለፈ ጊዜው በምሳሌያዊው አጠቃላይ ማስጠንቀቂያ ውስጥ በአማርኛ ተፈጥሯዊ በሆነ አሁን/ወደፊት ጊዜ ተተርጉሟል።
- source_word: ὡς τὸ κλῆμα
  choice: እንደ ወይን ቅርንጫፍ
  rationale: κλῆμα በአውዱ የወይን ተክል ቅርንጫፍን ያመለክታል፤ «ወይን» መጨመሩ ምሳሌውን ለዘመናዊ አንባቢ ግልጽ ያደርጋል።
- source_word: ἐξηράνθη
  choice: ይደርቃል
  rationale: ቃሉ መድረቅን ወይም መጠውለግን ይገልጣል፤ «ይደርቃል» የቅርንጫፉን ምስል በቀጥታ ይጠብቃል።
- source_word: συνάγουσιν αὐτὰ
  choice: እነርሱንም ሰብስበው
  rationale: συνάγουσιν ያልተገለጸ የሦስተኛ መደብ ብዙ ቁጥር ፈጻሚ አለው። የአማርኛው ግስ ፈጻሚዎቹን ሳይለይ ይጠብቃል፤ αὐτά የብዙ ቁጥር ቅርንጫፎችን ያመለክታል።
- source_word: εἰς τὸ πῦρ βάλλουσιν
  choice: ወደ እሳት ይጥሏቸዋል
  rationale: የመወርወርንና የእሳቱን ቀጥተኛ ምስል በዘመናዊ አማርኛ ይጠብቃል።
- source_word: καίεται
  choice: ይቃጠላሉ
  rationale: ግሪኩ ነጠላ ቁጥር ቢሆንም ከብዙ ቁጥሩ αὐτά በኋላ ቅርንጫፎቹን በአጠቃላይ ማቃጠሉን ይገልጣል። በአማርኛ «ይቃጠላሉ» ተፈጥሯዊ ሲሆን የተደራጊነቱን ስሜትም ይጠብቃል።
- source_word: τις
  choice: ማንም ቢኖር
  rationale: በአሉታዊ ሁኔታዊ ንግግር ውስጥ ያለውን ጠቅላላ ነጠላ ማጣቀሻ በተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: ማስጠንቀቂያው እውነተኛ ደቀ መዝሙር መውደቅን ወይም የሐሰት ቁርኝት መጋለጥን ይገልጽ እንደሆነ
  choice: ምሳሌያዊውን ማስጠንቀቂያ ያለ ትርጓሜያዊ መስፋፋት በቀጥታ ማቅረብ
  alternative: እውነተኛ አማኞች መውደቅን ወይም በእውነት ከኢየሱስ ጋር ያልተጣበቁ ስመ ደቀ መዛሙርት መገለጥን በግልጽ መወሰን
  rationale: ቁጥሩ የቅርንጫፍና የፍርድ ምስል ይጠቀማል፣ ነገር ግን የተገለጸውን ሰው ቀድሞ የነበረ መንፈሳዊ ሁኔታ በቀጥታ አይወስንም። ስለዚህ የእምነት ቡድን የተለየ መደምደሚያ አልገባም።
