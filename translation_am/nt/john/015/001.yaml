review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the identification, the qualifier ἀληθινή, and the Father's role. However, ἄμπελος is most idiomatically represented in this sustained agricultural metaphor as “የወይን ግንድ,” and γεωργός itself has the broad sense “farmer/cultivator,” rather than specifically a horticultural gardener.
  naturalness: “እውነተኛው የወይን ተክል እኔ ነኝ” is understandable, but “እኔ እውነተኛው የወይን ግንድ ነኝ” is more natural and established modern Amharic for this image. “የወይን አትክልተኛ” is somewhat awkward; “ገበሬው” is natural and retains the lexical breadth of γεωργός.
  terminology: Use “የወይን ግንድ” for the vine image and “ገበሬ” for γεωργός. A footnote may give the context-specific alternative “የወይን አራሽ.”
  issues:
  - severity: medium
    issue: “የወይን አትክልተኛ” is an overly specific and less idiomatic rendering of γεωργός.
    rationale: γεωργός denotes one who cultivates land, broadly a farmer or cultivator. In this context “የወይን አራሽ” can be supplied as an alternative, but “ገበሬው” best preserves the Greek word's breadth in the main text.
  - severity: low
    issue: “የወይን ተክል” is intelligible but less idiomatic for the Johannine vine metaphor.
    rationale: “የወይን ግንድ” directly and naturally evokes the vine/stem image, including its connection with the branches in the following verse.
  revised_text: እኔ እውነተኛው የወይን ግንድ ነኝ፤ አባቴም ገበሬው[a] ነው።
