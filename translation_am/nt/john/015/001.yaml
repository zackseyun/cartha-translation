  text: Ἐγώ εἰμι ἡ ἄμπελος ἡ ἀληθινή, καὶ ὁ πατήρ μου ὁ γεωργός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/001.yaml
  text: I am the true vine[a], and my Father is the vinegrower.
translation:
  language: am
  text: እኔ እውነተኛው የወይን ግንድ ነኝ፤ አባቴም ገበሬው[a] ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የወይን አራሽ።” የግሪኩ γεωργός ቃል መሬትን የሚያለማ ሰው፣ ማለትም ገበሬ ወይም አልሚ፣ ያመለክታል፤ በዚህ የወይን ግንድ አውድ “የወይን አራሽ” የሚል ይበልጥ የተለየ አማራጭ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: እኔ ነኝ
  rationale: ግልጽና ተፈጥሯዊ የአማርኛ አገላለጽ ሲሆን፣ Ἐγώ ያለውን አጽንዖትም በግልጽ የተውላጠ ስም ይጠብቃል።
- source_word: ἄμπελος
  choice: የወይን ተክል
  rationale: በዘመናዊ አማርኛ የወይንን ተክል በግልጽ ይጠቁማል፤ ምሳሌያዊውን ምስል ሳያብራራ እንዳለ ያቆያል።
- source_word: ἀληθινή
  choice: እውነተኛው
  rationale: ‘እውነተኛ፣ ትክክለኛ፣ በሙሉ ከእውነታው ጋር የሚስማማ’ የሚለውን የዮሐንስ አጠቃቀም ስፋት ሳያጠብ ይጠብቃል።
- source_word: πατήρ μου
  choice: አባቴ
  rationale: የኢየሱስን ግላዊ ዝምድና በቀጥታና በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: γεωργός
  choice: የወይን አትክልተኛው
  rationale: ቃሉ መሬትን የሚያለማን ሰው ያመለክታል፤ በዚህ የወይን ተክል አውድ ግን ይህ አገላለጽ ምስሉን በግልጽና በተፈጥሯዊ ሁኔታ ያስተላልፋል።
theological_decisions:
- issue: “እኔ ነኝ” በሚለው ንግግር ውስጥ ያለው ምሳሌያዊ መለያ
  choice: “እውነተኛው የወይን ተክል እኔ ነኝ” ብሎ ምሳሌውን በቀጥታ ማቆየት
  alternative: “እኔ እውነተኛው ወይን ነኝ”
  rationale: ጽሑፉ ምሳሌውን ራሱ እንዲናገር ይተዋል፤ ትርጉሙ የምስሉን ሥነ መለኮታዊ ፍቺ በማብራሪያ አይገድበውም።
- issue: γεωργός ከአብ ጋር ሲያያዝ የሚኖረው ትርጉም
  choice: በዋናው ጽሑፍ “የወይን አትክልተኛ” ማለት
  alternative: “ገበሬ” ወይም “አልሚ”
  rationale: ይህ ምርጫ የወይን ተክሉን አውድ ግልጽ ያደርጋል፤ የግሪኩን ሰፊ የ‘መሬት አልሚ’ ትርጉም ግን በግርጌ ማስታወሻ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የአረፍተ ነገሩ አወቃቀር የአማርኛን ተፈጥሯዊ ቅደም ተከተል ሲከተል፣ የግሪኩን አጽንዖትና ምሳሌያዊ ተቃርኖ ይጠብቃል።
