base_translation:
  language: en
  yaml_path: translation/nt/john/015/022.yaml
  text: If I had not come and spoken to them[a], they would not have sin[c][b]; but now they have no excuse for their sin.
translation:
  language: am
  text: መጥቼ ባልናገራቸው ኖሮ፣ ኃጢአት አይኖራቸውም ነበር[a]፤ አሁን ግን ስለ ኃጢአታቸው ምንም ማመካኛ[b] የላቸውም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በኃጢአት ጥፋተኞች አይሆኑም ነበር።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ሰበብ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὴ ἦλθον καὶ ἐλάλησα αὐτοῖς
  choice: እኔ መጥቼ ባልነግራቸው ኖሮ
  rationale: ያልተፈጸመ ያለፈ ሁኔታን የሚገልጠውን የግሪክ አወቃቀር በተፈጥሯዊ የአማርኛ ቅርጽ ያቀርባል፤ ἐλάλησα αὐτοῖς የሚለውም በአውዱ ‘ባልነግራቸው’ ተብሎ ተሰጥቷል።
- source_word: ἁμαρτίαν οὐκ εἴχοσαν
  choice: ኃጢአት ባልኖራቸው ነበር
  rationale: ‘ኃጢአት አይኖራቸውም ነበር’ የሚለውን የግሪኩን አገላለጽ ሳይፈታ ‘ጥፋተኛ አይሆኑም ነበር’ ወደሚል ትርጓሜ አያስፋፋውም።
- source_word: νῦν δὲ
  choice: አሁን ግን
  rationale: በምናባዊው ሁኔታና በአሁኑ እውነታ መካከል ያለውን ጠንካራ ንጽጽር ያሳያል።
- source_word: πρόφασιν οὐκ ἔχουσιν
  choice: ምንም ማመካኛ የላቸውም
  rationale: πρόφασις በዚህ አውድ ሰበብ፣ ማስተባበያ ወይም ማመካኛ ማለት ነው፤ ‘ማመካኛ’ በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: περὶ τῆς ἁμαρτίας αὐτῶν
  choice: ስለ ኃጢአታቸው
  rationale: περί ከዘር አመልካች ጋር ‘ስለ/በተመለከተ’ የሚለውን ትርጉም ይሰጣል፤ ይህ አገላለጽ የግሪኩን ቅርጽ ይጠብቃል።
theological_decisions:
- issue: ἁμαρτίαν οὐκ εἴχοσαν ፍጹም ኃጢአት አልባነትን ወይስ ኢየሱስን በመቃወማቸው ረገድ ያለውን ተጠያቂነት ያመለክታል?
  choice: ኃጢአት ባልኖራቸው ነበር
  alternative: በኃጢአት ጥፋተኞች ባልሆኑ ነበር
  rationale: የቅርብ አውዱ ኢየሱስ መጥቶ ከተናገራቸው በኋላ እርሱን በመቃወማቸው ስላለባቸው ተጠያቂነት ቢሆንም፣ ግሪኩ በቀጥታ ‘ኃጢአት አይኖራቸውም ነበር’ ይላል። ስለዚህ ዋናው ጽሑፍ የሥነ መለኮት ውጥረቱን ሳይፈታ ይጠብቀዋል።
- issue: πρόφασις እውነተኛ ማመካኛን ወይስ የይስሙላ ሰበብን ያመለክታል?
  choice: ማመካኛ
  alternative: ሰበብ
  rationale: ቃሉ ሁለቱንም ጥላዎች ሊይዝ ይችላል። ‘ማመካኛ’ በዚህ አውድ ግልጽ ሲሆን ‘ሰበብ’ የሚለው አማራጭ በማስታወሻ ተጠቅሷል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። ‘ኃጢአት ባልኖራቸው ነበር’ የሚለው አገላለጽ ትንሽ መደበኛ ቢሆንም የዮሐንስን ‘ኃጢአት መኖር’ የሚል ልዩ አነጋገር ለመጠበቅ ተመርጧል።
