base_translation:
  language: en
  yaml_path: translation/nt/john/015/007.yaml
  text: If you remain in me and my words remain in you[a], ask whatever you want[b], and it will be done for you.
translation:
  language: am
  text: በእኔ ብትኖሩ፣ ቃሎቼም በእናንተ ቢኖሩ[a]፣ የምትፈልጉትን ሁሉ[b] ለምኑ፤ ይሆንላችኋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በእኔ ብትቆዩ፣ ቃሎቼም በእናንተ ቢቆዩ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “የምትመኙትን ሁሉ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: μείνητε / μείνῃ (μένω)
  choice: ብትኖሩ / ቢኖሩ
  rationale: “መኖር” በዮሐንስ ወንጌል ያለውን ቀጣይ ኅብረትና በአንድ ውስጥ መጽናት በተፈጥሯዊ አማርኛ ያሳያል። በሁለቱም ቦታ አንድ ግስ በመጠቀም የግሪኩ ድግግሞሽ ተጠብቋል።
- source_word: ἐν ἐμοὶ
  choice: በእኔ
  rationale: የኅብረትንና የውስጣዊ ግንኙነትን አገላለጽ ሳያዳክም ἐν የሚለውን ቀጥተኛ ትርጉም ይጠብቃል።
- source_word: τὰ ῥήματά μου
  choice: ቃሎቼ
  rationale: የኢየሱስን የተነገሩ ቃላት በአጭር፣ ግልጽና ተፈጥሯዊ መንገድ ይገልጣል።
- source_word: ὃ ἐὰν θέλητε
  choice: የምትፈልጉትን ሁሉ
  rationale: የግሪኩን ክፍትና ያልተወሰነ የፍላጎት ነገር በዘመናዊ አማርኛ ያስተላልፋል፤ በጥቅሱ ያልተገለጸ ተጨማሪ ገደብም አያስገባም።
- source_word: αἰτήσασθε
  choice: ለምኑ
  rationale: በዚህ የጸሎትና የልመና አውድ ውስጥ ጥያቄ ከመጠየቅ ይልቅ ጥያቄን ለአንድ ሰው ማቅረብ የሚለውን የαἰτέω ኃይል በትክክል ያሳያል።
- source_word: γενήσεται ὑμῖν
  choice: ይሆንላችኋል
  rationale: “ይሆንላችኋል” የመሆንን ወይም ወደ ፍጻሜ የመምጣትን የγίνομαι ፍቺ በተፈጥሯዊ አማርኛ ያቀርባል፤ በግሪኩ ያልተገለጸውን ፈጻሚም አይጨምርም።
theological_decisions:
- issue: የጸሎት ተስፋው ሁኔታዊ መሆን
  choice: “በእኔ ብትኖሩ፣ ቃሎቼም በእናንተ ቢኖሩ” የሚለው ሁኔታ በግልጽ ተጠብቋል።
  alternative: የልመናውን ተስፋ ከቀዳሚው ሁኔታ ለይቶ እንደ ሁኔታ አልባ ተስፋ ማቅረብ።
  rationale: የἐὰν ሐረግ የልመናውንና የውጤቱን ተስፋ በኢየሱስ ውስጥ ከመኖርና ቃሎቹ በደቀ መዛሙርቱ ውስጥ ከመኖራቸው ጋር ያያይዛል።
- issue: በተስፋው ውስጥ የድርጊቱ ፈጻሚ
  choice: “ይሆንላችኋል” በማለት በግሪኩ ያልተገለጸው ፈጻሚ ክፍት ተትቷል።
  alternative: “እግዚአብሔር ያደርግላችኋል” በማለት ፈጻሚውን በግልጽ መጨመር።
  rationale: γενήσεται በግልጽ የተጠቀሰ ፈጻሚ የለውም፤ ትርጉሙ በአውዱ የሚገባውን መለኮታዊ አሠራር ሳይክድ የምንጩን አገላለጽ አያሰፋም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ሁኔታዊ አወቃቀር፣ የμένω ድግግሞሽና በγενήσεται ያለው የፈጻሚ አለመገለጽ ተጠብቀዋል።
