source:
  edition: SBLGNT
  text: οὐχ ὑμεῖς με ἐξελέξασθε, ἀλλ’ ἐγὼ ἐξελεξάμην ὑμᾶς, καὶ ἔθηκα ὑμᾶς ἵνα ὑμεῖς ὑπάγητε καὶ καρπὸν φέρητε καὶ ὁ καρπὸς ὑμῶν μένῃ, ἵνα ὅ τι ἂν αἰτήσητε τὸν πατέρα ἐν τῷ ὀνόματί μου δῷ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/016.yaml
  text: You did not choose me[a], but I chose you and appointed you so that you should go and bear fruit, and that your fruit should remain, so that whatever you ask the Father in my name[c][b], he may give you.
translation:
  language: am
  text: እናንተ እኔን አልመረጣችሁም፤ ነገር ግን እኔ እናንተን መረጥኋችሁ[a]፣ ሾምኋችሁም፤ እንድትሄዱና ፍሬ እንድታፈሩ፣ ፍሬያችሁም እንዲቆይ[b]፣ ይህም ከአብ[c] በስሜ የምትለምኑትን ሁሉ እንዲሰጣችሁ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ለየኋችሁ»። ግሱ «መምረጥ» ወይም «መለየት» ማለት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «እንዲኖር»። ዮሐንስ ይህን ግስ ለመቀጠል፣ ለመኖር ወይም ለመቆየት ብዙ ጊዜ ይጠቀምበታል።
    reason: lexical_alternative
  - marker: c
    text: የግሪኩ ጽሑፍ «አብ» ይላል፤ «አባቴ» አይልም።
    reason: textual_precision
lexical_decisions:
- source_word: ἐξελέξασθε / ἐξελεξάμην
  choice: መረጣችሁ / መረጥኋችሁ
  rationale: «መምረጥ» የግሱን መደበኛ ትርጉምና በኢየሱስና በደቀ መዛሙርቱ መካከል ያለውን ተቃርኖ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ የኋለኛውን ቴክኒካዊ የሥነ መለኮት ቃል አያስገባም።
- source_word: ἔθηκα
  choice: ሾምኋችሁ
  rationale: ቃሉ በመሠረቱ «አኖርኩ/አደረግሁ» ሊሆን ቢችልም፣ በዚህ አውድ ለመሄድና ፍሬ ለማፍራት የተሰጠን ዓላማ ያመለክታል፤ «ሾምኋችሁ» ይህን የተልእኮ ስሜት ያስተላልፋል፣ ሆኖም ወደ ልዩ የቤተ ክርስቲያን ሹመት አይገድበውም።
- source_word: ἵνα
  choice: እንድት… / እንዲ…
  rationale: ሁለቱንም የዓላማ ንዑስ ሐረጎች በተፈጥሯዊ የአማርኛ የዓላማ አወቃቀር ያቀርባል።
- source_word: ὑπάγητε
  choice: እንድትሄዱ
  rationale: «መሄድ» የግሱን ሰፊ ትርጉም ይጠብቃል፤ የተልእኮ አውዱን ያሳያል እንጂ በትርጉሙ ውስጥ ተጨማሪ ሐሳብ አያስገባም።
- source_word: καρπὸν φέρητε
  choice: ፍሬ እንድታፈሩ
  rationale: በዮሐንስ ወንጌል ያለውን የፍሬ ዘይቤ በተለመደና ግልጽ አማርኛ ይጠብቃል።
- source_word: μένῃ
  choice: ጸንቶ እንዲኖር
  rationale: μένω መቆየትን፣ መኖርን ወይም መጽናትን ሊያመለክት ይችላል። «ጸንቶ እንዲኖር» ፍሬው ቀጣይና ዘላቂ መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὅ τι ἂν αἰτήσητε
  choice: የምትለምኑትን ሁሉ
  rationale: ἄν ያለበት አንጻራዊ ሐረግ የሚያሳየውን «ማንኛውንም/ሁሉ» ስፋት ይጠብቃል፤ «መለመን» በጸሎት አውድ የαἰτέωን ስሜት በግልጽ ሁኔታ ያቀርባል።
- source_word: ἐν τῷ ὀνόματί μου
  choice: በስሜ
  rationale: የግሪኩን የተለመደ አገላለጽ ሳይተነትን ይጠብቃል፤ ከኢየሱስ ስም ጋር ተያይዞ የሚቀርበውን ልመና ያመለክታል።
- source_word: δῷ
  choice: እንዲሰጣችሁ
  rationale: በἵνα ሥር ያለውን የዓላማ/ውጤት አወቃቀር በአማርኛ ይጠብቃል፤ እንደ ቀላል የወደፊት ጊዜ ንግግር አያጸናውም።
- source_word: τὸν πατέρα
  choice: አብን
  rationale: ግሪኩ «አብን» ይላል እንጂ «አባቴን» አይልም፤ ትርጉሙ ይህንን ልዩነት ይጠብቃል።
theological_decisions:
- issue: ἐξελεξάμην ከሥነ መለኮታዊ ምርጫ ትምህርት ጋር እንዴት እንደሚዛመድ
  choice: በቅርብ የደቀ መዝሙርነትና የተልእኮ አውድ «መረጥኋችሁ» ተብሎ ተተርጉሟል።
  alternative: በቴክኒካዊ የሥነ መለኮት ቃል ተርጉሞ የዘላለማዊ ምርጫን ትምህርት በቀጥታ ማጉላት።
  rationale: ንባቡ የኢየሱስን ቀዳሚ እርምጃ በግልጽ ያስቀምጣል፤ ነገር ግን ተርጓሚው ግሱን ከአውዱ በላይ በኋለኛ ሥርዓታዊ ምድብ ሊገድበው አይገባም።
- issue: ἔθηκα ὑμᾶς የሚያመለክተው ሹመት
  choice: ለመሄድና ፍሬ ለማፍራት የተሰጠ ተልእኮ/ምደባ ተደርጎ ተገንዝቧል።
  alternative: «አኖርኋችሁ» ብሎ ቃል በቃል መተርጎም፣ ወይም ለተወሰነ የቤተ ክርስቲያን ማዕረግ ሹመት ብቻ መገደብ።
  rationale: ተከታዮቹ የዓላማ ሐረጎች የድርጊትና የፍሬ ተልእኮን ያሳያሉ፤ ጽሑፉ ግን ልዩ የቤተ ክርስቲያን ሥልጣንን በግልጽ አይጠቅስም።
- issue: የመጨረሻው ἵνα ሐረግ ኃይል
  choice: «እንዲሰጣችሁ» በሚል የዓላማ/ውጤት ሐረግ ተተርጉሟል።
  alternative: «ይሰጣችኋል» ብሎ እንደ ቀጥተኛና ገለልተኛ የወደፊት ጊዜ ተስፋ መተርጎም።
  rationale: የግሪኩ ἵνα ከምርጫ፣ ከሹመትና ከፍሬ ማፍራት ጋር የጸሎትን ሐረግ ያገናኛል። የአማርኛው የዓላማ አወቃቀር ይህን ግንኙነት ሳያጠፋ ያቀርባል።
