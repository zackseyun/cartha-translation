  naturalness: The proposed revision uses a clear modern Amharic temporal clause (‘…ሲመጣ’) and marks the appositional identification with dashes. It also makes the future sending and its recipient explicit and idiomatic.
  terminology: ‘ጠበቃ’ is an acceptable context-sensitive rendering of παράκλητος, with alternatives retained in the footnote. ‘አብ,’ ‘የእውነት መንፈስ,’ ‘ከአብ ዘንድ የሚወጣው,’ and ‘ይመሰክራል’ are faithful, established, and suitably formal-modern renderings.
