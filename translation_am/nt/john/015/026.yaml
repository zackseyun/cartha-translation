  text: ⸀Ὅταν ἔλθῃ ὁ παράκλητος ὃν ἐγὼ πέμψω ὑμῖν παρὰ τοῦ πατρός, τὸ πνεῦμα τῆς ἀληθείας ὃ παρὰ τοῦ πατρὸς ἐκπορεύεται, ἐκεῖνος μαρτυρήσει περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/026.yaml
  text: When the Advocate comes[a], whom I will send to you from the Father—the Spirit of truth[c][b], who proceeds from the Father—he will testify about me.
translation:
  language: am
  text: “እኔ ከአብ ዘንድ ወደ እናንተ የምልከው ጠበቃ[a]—ከአብ ዘንድ የሚወጣው የእውነት መንፈስ—ሲመጣ፣ እርሱ ስለ እኔ ይመሰክራል።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ረዳት”፣ “አማካሪ”፣ “አጽናኝ”፤ የግሪኩ ቃል παράκλητος (ጰራቅሊጦስ) ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν ἔλθῃ
  choice: በመጣ ጊዜ
  rationale: የወደፊት ጊዜ የሚጠበቅ ክስተትን የሚያመለክተውን ὅταν ከአዎንታዊ ንዑስ አንቀጽ ጋር በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ὁ παράκλητος
  choice: ጠበቃ[a]
  rationale: ቃሉ ለመርዳት፣ ለመወከል ወይም ለመሟገት ከጎን የተጠራን ሰው ያመለክታል፤ በቅርብ ዐውድ ካለው ‘ይመሰክራል’ ጋር ‘ጠበቃ’ የውክልናና የምስክርነት ኃይሉን ይጠብቃል።
- source_word: ὃν ἐγὼ πέμψω ὑμῖν παρὰ τοῦ πατρός
  choice: ከአብ ዘንድ የምልክላችሁ
  rationale: πέμψωን በወደፊት ጊዜ፣ ὑμῖνን እንደ ተዘዋዋሪ ተሳቢ፣ παρά ከዘር አመልካች ጋር ያለውንም የምንጭ ትርጉም ‘ከ…ዘንድ’ በሚል ያሳያል።
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: የእውነት መንፈስ
  rationale: የግሪኩን የዘር አገናኝ ቅርጽና የዮሐንስን መጠሪያ በቀጥታ ይጠብቃል።
- source_word: ὃ παρὰ τοῦ πατρὸς ἐκπορεύεται
  choice: ከአብ የሚወጣው
  rationale: ἐκπορεύεται ከውስጥ ወደ ውጭ የመውጣትን ልዩ ግስ ያሳያል፤ ‘የሚወጣው’ በአማርኛ ግልጽና ከግሪኩ ቅርብ ሲሆን ከጽሑፉ በኋላ የተነሱ ሥነ መለኮታዊ ዝርዝሮችን አይጨምርም።
- source_word: ἐκεῖνος μαρτυρήσει περὶ ἐμοῦ
  choice: እርሱ ስለ እኔ ይመሰክራል
  rationale: ἐκεῖνος ያለውን ግላዊና አጽንዖታዊ ማመልከቻ ‘እርሱ’ ይጠብቃል፤ μαρτυρήσειም የምስክርነት ፍቺውን በተለመደው ‘ይመሰክራል’ ያቀርባል።
theological_decisions:
- issue: παράκλητοςን በሥላሴያዊ ዐውድ መተርጎም
  choice: ጠበቃ
  alternative: ረዳት፣ አማካሪ፣ አጽናኝ፣ ጰራቅሊጦስ
  rationale: παράκλητος ብዙ ፍቺ ያለው ቃል ነው። ‘ጠበቃ’ በቅርብ ዐውዱ ከሚገኘው የምስክርነት ሥራ ጋር የሚስማማውን ግላዊና የውክልና ገጽታ ይጠብቃል፤ ሌሎች ተቀባይነት ያላቸው ፍቺዎች በማስታወሻ ቀርበዋል።
- issue: መንፈስን በግላዊ መስተዋድድ ማመልከት
  choice: እርሱ … ይመሰክራል
  alternative: እሱ/ይህ … ይመሰክራል
  rationale: πνεῦμα በግሪክ ሰዋስው ገለልተኛ ፆታ ቢሆንም ἐκεῖνος በወንድ ፆታና በአጽንዖት ወደ ጠበቃው/መንፈሱ ይመለሳል። ‘እርሱ’ ይህን ግላዊ አቀራረብ ይጠብቃል።
- issue: ἐκπορεύεταιን መተርጎም
  choice: ከአብ የሚወጣው
  alternative: ከአብ የሚመጣው፣ ከአብ የሚፈልቀው
  rationale: ‘የሚወጣው’ የግሪኩን የግስ ልዩነት ከ‘ይመጣል’ ይልቅ በትክክል ይጠብቃል፤ በኋለኛው የሥላሴ ውይይት የተጨመረውን ክርክር በጽሑፉ ላይ አይጭንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘አብ’ እና ‘የእውነት መንፈስ’ የተለመዱትን መጽሐፍ ቅዱሳዊ መጠሪያዎች ይጠብቃሉ፤ የዓረፍተ ነገሩ ቅደም ተከተል ዋናውን ጉዳይ ‘ጠበቃ’ ቀድሞ በማቅረብ የግሪኩን አወቃቀር በተፈጥሯዊ አማርኛ ያንጸባርቃል።
