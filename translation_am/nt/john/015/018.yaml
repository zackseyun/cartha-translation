id: JHN.15.18
reference: John 15:18
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Εἰ ὁ κόσμος ὑμᾶς μισεῖ, γινώσκετε ὅτι ἐμὲ πρῶτον ⸀ὑμῶν μεμίσηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/018.yaml
  text: If the world hates you[a], know that it has hated me before you.
translation:
  language: am
  text: ዓለም ቢጠላችሁ፣ እኔን ከእናንተ በፊት ጠልቶኛል ብላችሁ ዕወቁ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ዓለም ከእናንተ በፊት እኔን መጀመሪያ ጠልቶኛል።» በግሪኩ «መጀመሪያ» የሚለው ቃል ከ«እናንተ» ጋር ተያይዞ የጊዜ ቀዳሚነትን ይገልጣል።
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμος
  choice: ዓለም
  rationale: በዮሐንስ ወንጌል ይህ ቃል ብዙ ጊዜ እግዚአብሔርን በመቃወም የቆመውን የሰው ዓለም ያመለክታል፤ ሆኖም «ዓለም» የሚለው ትርጉም ሰፊነቱንና የጽሑፉን ውጥረት ሳይገድብ ይጠብቃል።
- source_word: μισεῖ
  choice: ቢጠላችሁ
  rationale: በሁኔታዊው ሐረግ ውስጥ ያለውን አሁናዊና አጠቃላይ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: γινώσκετε
  choice: ዕወቁ
  rationale: ቅርጹ አመልካች ወይም ትእዛዛዊ ሊሆን ቢችልም፣ በዐውዱ የማሳሰቢያ ትእዛዝ ሆኖ መረዳቱ የተፈጥሮ ነው።
- source_word: πρῶτον ... ὑμῶν
  choice: ከእናንተ በፊት
  rationale: ከጄኒቲቭ ὑμῶν ጋር ያለው πρῶτον የጊዜ ቀዳሚነትን ያመለክታል፤ «ከእናንተ በፊት» ይህን በግልጽና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: μεμίσηκεν
  choice: እንደጠላ
  rationale: የግሪክ ፍጹም ጊዜው ቀድሞ የተፈጸመና አሁንም ጠቀሜታ ያለውን ድርጊት ያሳያል፤ አማርኛው በዐውዱ ይህን ቀዳሚ ድርጊት በተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: ἐμέ
  choice: እኔን
  rationale: ግልጽ ተውላጠ ስሙን መጠቀም በግሪኩ ያለውን አጽንዖት ይጠብቃል።
theological_decisions:
- issue: በዮሐንስ ሥነ መለኮት የκόσμος ትርጉም
  choice: በዋናው ጽሑፍ «ዓለም» ተብሎ እንዲቀመጥ
  alternative: «እግዚአብሔርን የሚቃወመው ዓለም» ወይም «ዓለማዊ ሥርዓት»
  rationale: ዐውዱ ዓለም ኢየሱስንና ደቀ መዛሙርቱን እንደሚቃወም ያሳያል፤ ነገር ግን ትርጉሙን በማብራሪያ መስፋት ጽሑፉ የጠበቀውን ስፋትና ሥነ መለኮታዊ ውጥረት ሊያጠብ ይችላል።
- issue: γινώσκετε አመልካች ወይም ትእዛዛዊ መሆኑ
  choice: «ዕወቁ» በሚል ትእዛዛዊ ማሳሰቢያ መተርጎም
  alternative: «ታውቃላችሁ»
  rationale: የግሪኩ ቅርጽ ሁለቱንም ሊፈቅድ ቢችልም፣ ከሁኔታዊው ሐረግ በኋላ ያለው የንግግር ፍሰት የማሳሰቢያ ትእዛዙን ይደግፋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። «ዕወቁ» የሚለው ቅርጽ ክብርን ጠብቆ ግልጽ ማሳሰቢያን ያቀርባል።
