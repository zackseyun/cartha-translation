id: JHN.15.8
reference: John 15:8
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐδοξάσθη ὁ πατήρ μου ἵνα καρπὸν πολὺν φέρητε καὶ ⸀γένησθε ἐμοὶ μαθηταί.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/008.yaml
  text: 'In this my Father is glorified: that you bear much fruit and become my disciples.'
translation:
  language: am
  text: በዚህ አባቴ ይከብራል፤ ይኸውም ብዙ ፍሬ እንድታፈሩና የእኔ ደቀ መዛሙርት እንድትሆኑ ነው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: በዚህ
  rationale: The demonstrative is retained without over-specifying whether it points backward, forward, or to the whole fruit-bearing reality described in context.
- source_word: ἐδοξάσθη
  choice: ይከብራል
  rationale: In natural Amharic this expresses the divine passive sense that the Father is glorified; the Greek aorist is idiomatic in this maxim-like statement and need not be forced into a completed past event.
- source_word: καρπὸν πολὺν φέρητε
  choice: ብዙ ፍሬ በማፍራታችሁ
  rationale: Uses the established and intelligible Amharic fruit-bearing metaphor while connecting it directly to the Father's glorification.
- source_word: γένησθε ἐμοὶ μαθηταί
  choice: የእኔ ደቀ መዛሙርት በመሆናችሁ
  rationale: Preserves γένησθε as becoming/being disciples rather than replacing it with the textually distinct reading 'you will prove yourselves.'
theological_decisions:
- issue: Relation between bearing fruit and becoming disciples
  choice: Render both coordinated clauses as the content or means of the Father's glorification.
  alternative: 'Translate the second clause as a result or proof: ''and so prove to be my disciples.'''
  rationale: The SBLGNT reading γένησθε is coordinated with φέρητε by καί. The translation avoids introducing an explicit evidential theology not grammatically stated.
- issue: Referent of 'in this'
  choice: Keep the expression open as 'በዚህ'.
  alternative: Specify only the following acts or only the preceding abiding/answered prayer.
  rationale: The Greek demonstrative can naturally gesture toward the following ἵνα clauses while remaining connected to the preceding discourse; preserving the demonstrative retains that tension.
translation_notes:
  register: Modern standard Amharic in Ge'ez script; dignified but accessible. The sentence is reordered for natural Amharic flow while retaining 'በዚህ' and both coordinated actions. 'ደቀ መዛሙርት' is retained as the widely understood biblical term.
