id: JHN.15.10
reference: John 15:10
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐὰν τὰς ἐντολάς μου τηρήσητε, μενεῖτε ἐν τῇ ἀγάπῃ μου, καθὼς ἐγὼ ⸂τὰς ἐντολὰς τοῦ πατρός μου⸃ τετήρηκα καὶ μένω αὐτοῦ ἐν τῇ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/010.yaml
  text: If you keep my commandments, you will remain in my love, just as I have kept my Father's commandments and remain in his love.
translation:
  language: am
  text: ትእዛዞቼን ብትጠብቁ፣ በፍቅሬ ትኖራላችሁ፤ እኔም የአባቴን ትእዛዞች ጠብቄ በፍቅሩ እንደምኖር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν
  choice: ብትጠብቁ
  rationale: የግሪኩን እውነተኛ ሁኔታዊ አገላለጽ በተፈጥሯዊ የአማርኛ ሁኔታዊ ግስ ያቀርባል።
- source_word: ἐντολάς
  choice: ትእዛዞች
  rationale: የሥልጣን እና የግዴታ ኃይል ያለውን ትርጉም በዘመናዊና ግልጽ አማርኛ ይጠብቃል።
- source_word: τηρήσητε / τετήρηκα
  choice: ብትጠብቁ / እንደጠበቅሁ
  rationale: τηρέω ትእዛዝን በታማኝነት መጠበቅና መፈጸምን ያመለክታል፤ ተመሳሳዩ የአማርኛ ግስ በሁለቱም ስፍራ የምንጩን ቃላዊ ትስስር ይጠብቃል።
- source_word: μενεῖτε / μένω
  choice: ትኖራላችሁ / እንደምኖር
  rationale: በዮሐንስ የተደጋገመውን μένω እንደ ቀጣይ ግንኙነታዊ መኖር ያቀርባል፤ በሁለቱም ስፍራ የግሱን ትስስር ይጠብቃል።
- source_word: ἐν τῇ ἀγάπῃ μου / αὐτοῦ ἐν τῇ ἀγάπῃ
  choice: በፍቅሬ / በፍቅሩ
  rationale: የ‘በፍቅር ውስጥ’ ግንኙነታዊ ምስልን በተፈጥሯዊ አማርኛ ያስተላልፋል፤ የባለቤትነት ቅጥያዎቹም የግሪኩን ትይዩነት ይጠብቃሉ።
- source_word: καθὼς
  choice: እንደ… እናንተም
  rationale: በኢየሱስ ምሳሌና በደቀ መዛሙርቱ ድርጊት መካከል ያለውን ንጽጽር በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τοῦ πατρός μου
  choice: የአባቴን
  rationale: የግሪኩን የባለቤትነት ግንኙነት በተፈጥሯዊ የአማርኛ አወቃቀር ያቀርባል።
theological_decisions:
- issue: ታዛዥነትና በኢየሱስ ፍቅር መኖር ያላቸው ግንኙነት
  choice: ንግግሩን እንደ እውነተኛ ሁኔታዊ ግንኙነት በቀጥታ ማቅረብ
  alternative: ታዛዥነት ፍቅርን የሚያስገኝ ዋጋ ነው ብሎ መተርጎም፣ ወይም የሁኔታውን ኃይል በማጥፋት ታዛዥነት ምልክት ብቻ ነው ብሎ ማቅረብ
  rationale: ግሪኩ ግልጽ ሁኔታንና ከኢየሱስ ታዛዥነት ጋር የሚደረግ ንጽጽርን ያቀርባል፤ ስለ ዋጋ፣ ድነት ወይም ጽናት ያለውን ሰፊ ክርክር ግን አይፈታም።
- issue: ἀγάπη እና የባለቤትነት አገላለጹ
  choice: ፍቅር፤ ‘በፍቅሬ’ እና ‘በፍቅሩ’
  alternative: ፍቅሩ የሚፈቅረውን ወይም የሚቀበለውን ፍቅር እንደሆነ በትርጉሙ ውስጥ በግልጽ መወሰን
  rationale: የግሪኩ የባለቤትነት አገላለጽ የፍቅሩን አቅጣጫ በዚህ ሐረግ ብቻ አይወስንም፤ አማርኛውም ይህን ትርጉማዊ ስፋት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ትእዛዝ’፣ ‘መጠበቅ’፣ ‘መኖር’ የሚሉት ቃላት የዮሐንስን ትይዩ አወቃቀርና የተደጋገመ ቃላዊ ትስስር ይጠብቃሉ።
