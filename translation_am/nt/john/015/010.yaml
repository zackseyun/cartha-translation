review_pass:
  verdict: revise
  source_fidelity: The draft preserves the conditional relation, the repeated commandment/keeping vocabulary, and the Father–Son comparison. However, its reordered clause makes the comparison syntactically less direct, and እንደጠበቅሁ does not adequately convey the Greek perfect τετήρηκα (“I have kept,” with present relevance).
  naturalness: The language is generally modern and clear. Restoring the source order produces a more natural and immediately understandable Amharic sentence, with the condition and its result adjacent.
  terminology: ትእዛዝ, መጠበቅ, ፍቅር, and መኖር are suitable modern-standard renderings. Retaining the same verb roots appropriately reflects the Greek repetition. The perfect is best represented by ጠብቄ ... እኖራለሁ, which expresses the completed keeping in relation to the present remaining.
  issues:
  - severity: medium
    issue: The result clause is displaced after the comparison clause.
    rationale: The Greek states the condition and result first—“If you keep ... you will remain ...”—then adds the comparison. The draft inserts the comparison before the result, weakening the clear conditional progression.
  - severity: low
    issue: The rendering of τετήρηκα as እንደጠበቅሁ underrepresents the perfect aspect.
    rationale: The Greek perfect marks Jesus’ keeping of the Father’s commandments as accomplished with continuing relevance. ጠብቄ, followed by the present “I remain,” better preserves this force without overexplaining it.
  revised_text: ትእዛዞቼን ብትጠብቁ፣ በፍቅሬ ትኖራላችሁ፤ እኔም የአባቴን ትእዛዞች ጠብቄ በፍቅሩ እንደምኖር።
