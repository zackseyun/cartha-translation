base_translation:
  language: en
  yaml_path: translation/nt/john/015/002.yaml
  text: Every branch in me that does not bear fruit[a], he removes; and every branch that bears fruit[b], he prunes so that it may bear more fruit.
translation:
  language: am
  text: 'በእኔ ያለና ፍሬ የማያፈራውን ቅርንጫፍ ሁሉ እርሱ ያስወግደዋል፤[a] ፍሬ የሚያፈራውን ቅርንጫፍ ሁሉ ደግሞ የበለጠ ፍሬ እንዲያፈራ ይቆረጥመዋል።[b]


    [a] “ያስወግደዋል” የተባለው “ይወስደዋል” ተብሎም ሊተረጎም ይችላል፤ አንዳንዶች ግን እዚህ ላይ “ከፍ ያደርገዋል” ማለት እንደሆነ ይረዱታል።

    [b] “ይቆረጥመዋል” ተብሎ የተተረጎመው ግስ “ያነጻዋል” ማለትም ሊሆን ይችላል፤ ቃሉ ከወይን እርሻው ምሳሌ ጋር የሚስማማ ሲሆን፣ በሚቀጥለው ቁጥር “ንጹሓን” ከሚለው ቃል ጋርም ይዛመዳል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ያስወግደዋል” የተባለው “ይወስደዋል” ተብሎም ሊተረጎም ይችላል፤ አንዳንዶች ግን እዚህ ላይ “ከፍ ያደርገዋል” ማለት እንደሆነ ይረዱታል።
