    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν κλῆμα
  choice: ቅርንጫፍ ሁሉ
  rationale: ነጠላ ስም ጋር የመጣው πᾶν እያንዳንዱን ለየብቻ የሚያመለክት ነው፤ “ቅርንጫፍ ሁሉ” ይህን ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐν ἐμοὶ
  choice: በእኔ ያለ
  rationale: የዮሐንስን “በእኔ” የሚለውን ግንኙነታዊና ሥነ መለኮታዊ አገላለጽ ያለ ትርጓሜያዊ ማስፋፊያ ይጠብቃል።
- source_word: μὴ φέρον καρπὸν
  choice: ፍሬ የማያፈራውን
  rationale: የተሳቢውን ቀጣይ ድርጊት በግልጽና ተፈጥሯዊ የአማርኛ አንጻራዊ ሐረግ ያቀርባል።
- source_word: αἴρει
  choice: ያስወግደዋል
  rationale: በወይን ተክል ምሳሌው ውስጥ ፍሬ የሌለው ቅርንጫፍ ከመቆረጡ ጋር የሚስማማው “ማስወገድ” ነው፤ “መውሰድ” እና “ከፍ ማድረግ” የሚሉት አማራጮች በማስታወሻ ተጠብቀዋል።
- source_word: καρπός
  choice: ፍሬ
  rationale: በወይን ተክል ምሳሌና በዮሐንስ አጠቃቀም ውስጥ መደበኛና ቀጥተኛ አቻ ቃል ነው።
- source_word: καθαίρει
  choice: ይቆረጥመዋል
  rationale: በእርሻ አውዱ ፍሬያማውን ቅርንጫፍ ለበለጠ ፍሬ መቁረጥን በተፈጥሯዊ አማርኛ ያሳያል፤ “ማንጻት” የሚለው የቃሉ ሌላ ትርጉምና ከቀጣዩ ቁጥር ጋር ያለው የቃል ግንኙነት በማስታወሻ ተገልጿል።
- source_word: ἵνα καρπὸν πλείονα φέρῃ
  choice: የበለጠ ፍሬ እንዲያፈራ
  rationale: ἵνα የዓላማ ሐረግን፣ πλείονα ደግሞ የንጽጽር መጠንን በግልጽ ያስተላልፋሉ።
- source_word: καὶ πᾶν τὸ καρπὸν φέρον
  choice: ፍሬ የሚያፈራውን ቅርንጫፍ ሁሉ ደግሞ
  rationale: በግሪኩ ከቀደመው κλῆμα የሚታወቀውን “ቅርንጫፍ” በአማርኛ መድገም ትይዩነቱንና ግልጽነቱን ይጠብቃል።
theological_decisions:
- issue: በመጀመሪያው ሐረግ αἴρει የሚለው ትርጉም
  choice: ያስወግደዋል
  alternative: ይወስደዋል፤ ከፍ ያደርገዋል
  rationale: የቅርብ አውዱ ፍሬ የማያፈራው ቅርንጫፍ መወገዱንና ፍሬ የሚያፈራው መቆረጡን ያነጻጽራል። “ያስወግደዋል” ይህን ንጽጽር ይጠብቃል፤ ስለ እምነት መተው ወይም ስለ ጽናት የአንድ ወገን ዶክትሪን አያስገባም። ሌሎቹ አማራጮች እውነተኛውን የቃል ክርክር ለመጠበቅ በማስታወሻ ቀርበዋል።
- issue: καθαίρει የእርሻ እና የማንጻት ሁለትዮሽ ድምፅ
  choice: ይቆረጥመዋል
  alternative: ያነጻዋል
  rationale: ዋናው ጽሑፍ የወይን እርሻውን ተግባር በግልጽ ያቀርባል፤ ሆኖም ቃሉ ከκαθαροί ጋር ያለው የቃል ጨዋታ በማስታወሻ ተጠብቋል።
