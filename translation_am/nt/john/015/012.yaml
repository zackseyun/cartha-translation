  source_fidelity: 'The draft correctly conveys the reciprocal command and the comparison with Jesus’ prior love. However, «እኔ የማዝዛችሁ ይህን ነው» is not a sound or natural rendering of «Αὕτη ἐστὶν ἡ ἐντολὴ ἡ ἐμή»: it changes the source noun ‘my command’ into an awkward verbal construction and uses the accusative «ይህን» where the identification clause calls for «ይህ». The revised text retains the Greek aorist with simple past «ወደድኳችሁ».'
