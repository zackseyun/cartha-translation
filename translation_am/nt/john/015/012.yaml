lexical_decisions:
- source_word: Αὕτη
  choice: ይህን
  rationale: ጠቋሚው ተውላጠ ስም ኢየሱስ የሚገልጠውን ትእዛዝ ለይቶ ያመለክታል፤ ከአማርኛው አገባብ ጋር ለመስማማት በተሳቢ ቅርጽ «ይህን» ተብሏል።
- source_word: ἐντολή
  choice: የማዝዛችሁ
  rationale: «ትእዛዝ» የሚለውን ስም በተፈጥሯዊ የአማርኛ የግስ አገባብ ይገልጣል፤ የኢየሱስን ሥልጣንና ለተከታዮቹ የተሰጠውን ትእዛዝ ያስጠብቃል።
- source_word: ἡ ἐμὴ
  choice: እኔ የማዝዛችሁ
  rationale: የግል ባለቤትነቱንና አጽንዖቱን በ«እኔ» ይጠብቃል፤ ትእዛዙ ከኢየሱስ እንደሚመጣ ግልጽ ያደርጋል።
- source_word: ἵνα
  choice: ይህን ነው፤ … ተዋደዱ
  rationale: በዚህ ስፍራ ἵνα የትእዛዙን ይዘት ያስተዋውቃል። የአማርኛው ሰረዝና ቀጥተኛ የትእዛዝ ቅርጽ ይህን ግንኙነት በተፈጥሯዊ ሁኔታ ያሳያሉ።
- source_word: ἀγαπᾶτε
  choice: ተዋደዱ
  rationale: የጋራ የፍቅር ተግባርን የሚያዝ ተፈጥሯዊና የተለመደ የአማርኛ ትእዛዛዊ ቅርጽ ነው።
- source_word: ἀλλήλους
  choice: እርስ በርሳችሁ
  rationale: የግሪኩን የመደጋገፍ ትርጉም በግልጽ ሁኔታ የሚያስተላልፍ መደበኛ የአማርኛ አገላለጽ ነው።
- source_word: καθὼς
  choice: እንደ
  rationale: የኢየሱስ ፍቅር የደቀ መዛሙርቱ ፍቅር ምሳሌና መለኪያ መሆኑን በተፈጥሯዊ አማርኛ የሚያሳይ የንጽጽር ቃል ነው።
- source_word: ἠγάπησα
  choice: ወደድኳችሁ
