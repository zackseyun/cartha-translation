- source_word: ὑμᾶς
  choice: -ኳችሁ
  rationale: የብዙ ቁጥር ተሳቢ ቅጥያው ኢየሱስ ለደቀ መዛሙርቱ በጋራ እንደሚናገር ያሳያል።
theological_decisions:
- issue: የἀγαπάω ትርጉም
  choice: መውደድ / ተዋደዱ
  alternative: ፍቅር አድርጉ
  rationale: «መውደድ» በዘመናዊ አማርኛ የፍቅርን ትርጉም በቀጥታና በተፈጥሯዊነት ይገልጣል፤ የተወሰነ የቤተ እምነት ትርጓሜ አያስገባም።
