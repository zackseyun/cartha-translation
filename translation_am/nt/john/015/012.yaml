  rationale: «እንደ» የኢየሱስን ፍቅር እንደ ምሳሌና መለኪያ ያቀርባል፤ «በ…መጠን» ግን ጽሑፉ ከሚለው በላይ የመጠን ትርጉምን ሊያጠብቅ ይችላል።
- issue: የἠγάπησα ጊዜያዊ አገላለጽ
  choice: ወደድኳችሁ
  alternative: ወድጃችኋለሁ
  rationale: ቀላል ያለፈ ጊዜው የግሪኩን አኦሪስት በቅርብ ይከተላል፤ ፍጹም ጊዜውም በዐውደ ንባቡ የአሁን ጠቀሜታን ሊያጎላ ስለሚችል በማስታወሻ ተጠቅሷል።
