id: JHN.15.19
reference: John 15:19
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἰ ἐκ τοῦ κόσμου ἦτε, ὁ κόσμος ἂν τὸ ἴδιον ἐφίλει· ὅτι δὲ ἐκ τοῦ κόσμου οὐκ ἐστέ, ἀλλ’ ἐγὼ ἐξελεξάμην ὑμᾶς ἐκ τοῦ κόσμου, διὰ τοῦτο μισεῖ ὑμᾶς ὁ κόσμος.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/019.yaml
  text: If you were from the world[a], the world would love its own. But because you are not from the world, but I chose you out of the world, for this reason the world hates you.
translation:
  language: am
  text: እናንተ ከዓለም ብትሆኑ ኖሮ፣ ዓለም የራሷ የሆነውን ይወድ ነበር። ነገር ግን እናንተ ከዓለም ስላልሆናችሁ፣ እኔ ከዓለም ስለመረጥኳችሁ፣ ስለዚህ ዓለም ይጠላችኋል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ τοῦ κόσμου
  choice: ከዓለም
  rationale: “ከ-” የምንጭንም ሆነ የወገንነትን ጥላ ሊይዝ ይችላል፤ በጥቅሱ ውስጥ ያለውን ድግግሞሽም ያሳያል።
- source_word: κόσμος
  choice: ዓለም
  rationale: የዮሐንስን ሰፊ ሥነ መለኮታዊ አጠቃቀም ሳያጠብ የግሪኩን መደበኛ ትርጉም ይጠብቃል።
- source_word: ἂν ... ἐφίλει
  choice: ይወድ ነበር
  rationale: “ብትሆኑ ኖሮ” ከሚለው ጋር ተጣምሮ ከእውነታ ተቃራኒ የሆነውን መላምታዊ ውጤት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τὸ ἴδιον
  choice: የራሱ የሆነውን
  rationale: ግሪኩ በግልጽ ሁኔታ “ሕዝቡን” ሳይል የዓለም የሆነውን ወይም የራሱን የሚለውን አሻሚነት ይጠብቃል።
- source_word: φιλέω
  choice: ይወድ
  rationale: ከμισέω ጋር ያለውን ግልጽ ተቃርኖ በተለመደና ተፈጥሯዊ ቃል ያሳያል።
- source_word: ἐξελεξάμην
  choice: መረጥኳችሁ
  rationale: የመምረጥን ቀጥተኛ ትርጉም ይጠብቃል፤ የመካከለኛውን ድምፅ ከልክ በላይ “ለራሴ” ብሎ አያሰፋውም።
- source_word: διὰ τοῦτο
  choice: ስለዚህ
  rationale: የምክንያትና የውጤት ግንኙነቱን በግልጽና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: μισεῖ
  choice: ይጠላችኋል
  rationale: የአሁን ጊዜውን ቀጣይ እውነታና ከ“ይወድ” ጋር ያለውን ጠንካራ ተቃርኖ ሳያለዝብ ያቀርባል።
theological_decisions:
- issue: በዮሐንስ አውድ “ዓለም” የሚለው ትርጉም
  choice: በዋናው ጽሑፍ “ዓለም” ተብሎ ተጠብቋል።
  alternative: “እግዚአብሔርን የሚቃወም የዓለም ሥርዓት” ወይም “እግዚአብሔርን የሚቃወም ማኅበረሰብ”
  rationale: የዮሐንስን ሥነ መለኮታዊ ምድብ ይጠብቃል፤ በጽሑፉ ያልተገለጸ ጠባብ ትርጓሜ አያስገባም።
- issue: በἐξελεξάμην ውስጥ ያለው የመምረጥ አንድምታ
  choice: “እኔም ከዓለም ስለመረጥኳችሁ” ተብሎ ቀጥተኛ ንግግሩ ተጠብቋል።
  alternative: ከቅድመ ውሳኔ ወይም ከአንድ የእምነት ወገን ሥርዓት ጋር የተያያዘ የተስፋፋ አገላለጽ
  rationale: ጥቅሱ የኢየሱስን ምርጫ ያስረግጣል፣ ነገር ግን በኋላ የተነሡ የወገን ክርክሮችን በራሱ አይፈታም።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ ነው። የግሪኩ ἐκ τοῦ κόσμου ሦስት ጊዜ መደገሙ “ከዓለም” በሚለው ተመሳሳይ አገላለጽ ተጠብቋል። በአማርኛ “ከዓለም” የምንጭና የወገንነት ጥላዎቹን በቂ ሁኔታ ስለሚይዝ የግድ የግርጌ ማስታወሻ አልተጨመረም።
