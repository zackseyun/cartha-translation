review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the threefold ἐκ τοῦ κόσμου as «ከዓለም», the contrary-to-fact conditional, Jesus’ choosing, the causal conclusion, and the love/hate contrast. However, «እኔም» means “I also,” whereas ἀλλ’ ἐγώ is adversative (“but I”), not additive.
  naturalness: The sentence is clear and suitably modern in register. Changing «የራሱ የሆነውን» to the feminine-agreeing «የራሷ የሆነውን» is more idiomatic with «ዓለም» while retaining the Greek’s non-specific “its own.”
  terminology: «ዓለም», «መረጥኳችሁ», «ይወድ», and «ይጠላችኋል» are appropriate and do not impose interpretive or denominational meaning. No footnote is required in Amharic, since the repeated «ከዓለም» preserves the source/belonging nuance without artificial phrasing.
  issues:
  - severity: medium
    issue: «እኔም» introduces an additive sense.
    rationale: The Greek has ἀλλά (“but”) followed by emphatic ἐγώ (“I”), not καί (“also”). The rendering should be «እኔ» in the existing adversative clause.
  - severity: low
    issue: Gender of the reflexive possessive with «ዓለም».
    rationale: «ዓለም» is normally feminine in Amharic; «የራሷ የሆነውን» is more natural than masculine «የራሱ የሆነውን» and retains the non-specific sense of τὸ ἴδιον.
  revised_text: እናንተ ከዓለም ብትሆኑ ኖሮ፣ ዓለም የራሷ የሆነውን ይወድ ነበር። ነገር ግን እናንተ ከዓለም ስላልሆናችሁ፣ እኔ ከዓለም ስለመረጥኳችሁ፣ ስለዚህ ዓለም ይጠላችኋል።
