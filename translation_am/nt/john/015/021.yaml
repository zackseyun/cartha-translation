- source_word: τὸν πέμψαντά με
  choice: የላከኝን
  rationale: የግሪኩን ገላጭ ተሳቢ በአጭርና ተፈጥሯዊ አማርኛ ይተረጉማል፤ ‘አብ’ የሚለውን በግልጽ ሳይጨምር ግለሰባዊ ማጣቀሻውን ያቆያል።
