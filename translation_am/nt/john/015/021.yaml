    text: ወይም፣ “እነዚህን ሁሉ በእናንተ ላይ ያደርጋሉ።” የግሪኩ ሐረግ በደቀ መዛሙርቱ ላይ የሚመሩ ድርጊቶችን፣ በተለይም በጠላትነት ሊፈጸሙ የሚችሉ ድርጊቶችን፣ ሊያመለክት ይችላል።
