id: JHN.15.4
reference: John 15:4
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: μείνατε ἐν ἐμοί, κἀγὼ ἐν ὑμῖν. καθὼς τὸ κλῆμα οὐ δύναται καρπὸν φέρειν ἀφ’ ἑαυτοῦ ἐὰν μὴ ⸀μένῃ ἐν τῇ ἀμπέλῳ, οὕτως οὐδὲ ὑμεῖς ἐὰν μὴ ἐν ἐμοὶ ⸀μένητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/004.yaml
  text: Remain in me[a], and I in you. Just as the branch is not able to bear fruit by itself unless it remains in the vine, so neither can you unless you remain in me.
translation:
  language: am
  text: በእኔ ኑሩ[a]፤ እኔም በእናንተ። ቅርንጫፉ በወይኑ ውስጥ ካልኖረ በራሱ ፍሬ ማፍራት እንደማይችል፣ እናንተም በእኔ ካልኖራችሁ ፍሬ ማፍራት አትችሉም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በእኔ ቆዩ።” μένω የሚለው ግስ “መቆየት” ወይም “መኖር” ተብሎም ሊተረጎም ይችላል፤ ቀጣይ መቆየትን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: μείνατε / μένῃ / μένητε
  choice: ኑሩ / ካልኖረ / ካልኖራችሁ
  rationale: የμένωን የመቆየትና ቀጣይ ግንኙነት ሐሳብ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል፤ በቁጥሩ ውስጥ ያለውን የቃል ድግግሞሽም ይጠብቃል።
- source_word: ἐν ἐμοί
  choice: በእኔ
  rationale: ἐν የሚያመለክተውን ጥልቅ ኅብረት ሳያቀልል በቀጥታ ይጠብቃል፤ ‘ከእኔ ጋር’ የሚለውን የቅርበት ትርጉም ብቻ አያስገባም።
- source_word: κἀγὼ ἐν ὑμῖν
  choice: እኔም በእናንተ
  rationale: በግሪኩ ያልተገለጸውን ግስ ሳይጨምር አጭሩንና ተመላላሹን አገላለጽ ይጠብቃል።
- source_word: τὸ κλῆμα
  choice: ቅርንጫፉ
  rationale: በወይን ተክል ምሳሌው ውስጥ ያለውን ቅርንጫፍ በግልጽና በተለመደ አማርኛ ይገልጻል።
- source_word: καρπὸν φέρειν
  choice: ፍሬ ማፍራት
  rationale: የእርሻውን ምሳሌ በተፈጥሯዊ የአማርኛ አገላለጽ ያቀርባል።
- source_word: ἀφ’ ἑαυτοῦ
  choice: በራሱ
  rationale: ቅርንጫፉ ብቻውን ወይም ከራሱ ኃይል ፍሬ ማፍራት እንደማይችል በአጭር ይገልጻል።
- source_word: ἐν τῇ ἀμπέλῳ
  choice: በወይኑ ግንድ ላይ
  rationale: ἀμπέλοςን በዐውዱ ውስጥ እንደ ወይን ተክል/ግንድ ይገልጻል፤ ‘ላይ’ የሚለው ቅርንጫፉ ከግንዱ ጋር ያለውን ተፈጥሯዊ ግንኙነት በአማርኛ ግልጽ ያደርጋል።
- source_word: οὐ δύναται / οὐδὲ ὑμεῖς
  choice: ማፍራት እንደማይችል / ማፍራት አትችሉም
  rationale: የችሎታ እጦቱን ግልጽ ያደርጋል፤ በሁለተኛው ክፍል ከቀደመው ሐረግ የሚገባውን ግስ በተፈጥሯዊ አማርኛ ይሞላል።
theological_decisions:
- issue: μένω በደቀ መዝሙርነትና በኅብረት ዐውድ
  choice: በእኔ ኑሩ
  alternative: በእኔ ጸንታችሁ ኑሩ
  rationale: ‘ኑሩ’ ቀጣይ ኅብረትንና መቆየትን ሁለቱንም ይይዛል፤ ‘ጸንታችሁ’ የሚለው ትርጉሙን ሊያብራራ ቢችልም በግሪኩ ያልተገለጸ አጽንዖት ሊጨምር ይችላል።
- issue: κἀγὼ ἐν ὑμῖν የሚለው ግስ የሌለው ተመላላሽ ሐረግ
  choice: እኔም በእናንተ
  alternative: እኔም በእናንተ እኖራለሁ
  rationale: የግሪኩን አሻሚ ሰዋስዋዊ አጭርነት ይጠብቃል፤ እንደ ተስፋ ቃል የወደፊት ግስ በግልጽ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የወይን ግንድና የቅርንጫፍ ምሳሌ ተጠብቋል፤ የግሪኩ ግስ የሌለው ተመላላሽ ሐረግም ሳይፈታ ቀርቧል።
