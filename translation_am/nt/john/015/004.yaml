review_pass:
  verdict: revise
  source_fidelity: The central command, reciprocal elliptical clause, fruit-bearing metaphor, conditional structure, and inability expressed by δύναται are accurately conveyed. However, “በወይኑ ግንድ ላይ” specifies both “trunk” and a locative relation (“on”) where ἐν τῇ ἀμπέλῳ simply says “in the vine.” “ግንድ” is an unnecessary narrowing of the vine image.
  naturalness: The draft is generally clear, idiomatic modern standard Amharic. Replacing the expanded botanical expression with “በወይኑ ውስጥ” preserves the metaphor and gives a natural parallel to the repeated “በእኔ.”
  terminology: “በእኔ ኑሩ,” “ፍሬ ማፍራት,” and “አትችሉም” appropriately preserve the key relational and agricultural terminology. The footnote’s proposed “ጸንታችሁ” adds the distinct idea of firmness/steadfastness and should be replaced by a closer lexical alternative, “ቆዩ.”
  issues:
  - severity: medium
    issue: The phrase “በወይኑ ግንድ ላይ” adds “trunk” and changes the source’s ἐν (“in”) to “on.”
    rationale: ἀμπέλος denotes the vine, not specifically its trunk. The added specification slightly narrows and explicates the image beyond the Greek.
  - severity: low
    issue: The footnote alternative “በእኔ ጸንታችሁ ኑሩ” introduces an extra nuance.
    rationale: “ጸንታችሁ” can suggest steadfastness, which is not explicitly present in μένω. “ቆዩ” is a closer modern Amharic alternative for the lexical note.
  revised_text: በእኔ ኑሩ[a]፤ እኔም በእናንተ። ቅርንጫፉ በወይኑ ውስጥ ካልኖረ በራሱ ፍሬ ማፍራት እንደማይችል፣ እናንተም በእኔ ካልኖራችሁ ፍሬ ማፍራት አትችሉም።
