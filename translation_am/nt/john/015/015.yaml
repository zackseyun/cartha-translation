  text: οὐκέτι ⸂λέγω ὑμᾶς⸃ δούλους, ὅτι ὁ δοῦλος οὐκ οἶδεν τί ποιεῖ αὐτοῦ ὁ κύριος· ὑμᾶς δὲ εἴρηκα φίλους, ὅτι πάντα ἃ ἤκουσα παρὰ τοῦ πατρός μου ἐγνώρισα ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/015.yaml
  text: I no longer call you servants[a], because the servant does not know what his master is doing. But I have called you friends[b], because I have made known to you everything that I heard from my Father.
translation:
  language: am
  text: ከእንግዲህ ወዲህ ባሪያዎች[a] ብዬ አልጠራችሁም፤ ምክንያቱም ባሪያው ጌታው[b] የሚያደርገውን አያውቅም። እናንተን ግን ወዳጆች ብዬ ጠርቻችኋለሁ፤ ምክንያቱም ከአባቴ የሰማሁትን ሁሉ አሳውቄአችኋለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ δούλος “ባሪያ” ወይም “አገልጋይ” ሊባል ይችላል። እዚህ “ባሪያ” የተባለው ከወዳጅነት ጋር የተነጻጸረውን የበታችነት ሁኔታ ለማሳየት ነው።
    reason: lexical_alternative
  - marker: b
    text: በግሪክ “ጌታ” ይላል፤ እዚህ ቃሉ በባሪያና በጌታው ግንኙነት ያለውን ባለሥልጣን ያመለክታል፤ መለኮታዊ ወይም መሲሐዊ ማዕረግ አይደለም።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: ከእንግዲህ ወዲህ ... አል...ም
  rationale: የቀድሞው ሁኔታ መቀየሩን የሚያሳየውን ጊዜያዊ እምቢታ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: λέγω ὑμᾶς
  choice: ባሪያዎች አልላችሁም
  rationale: λέγω በዚህ አገባብ “ብሎ መጥራት/መሰየም” ማለት ነው፤ የግሪኩ የአሁን ጊዜ አገላለጽም ተጠብቋል።
- source_word: δούλους / δοῦλος
  choice: ባሪያዎች / ባሪያው
  rationale: ከ“ወዳጆች” ጋር ያለው ንጽጽር የበታችነትንና የታሰረ ማኅበራዊ ደረጃን ስለሚያጎላ፣ “ባሪያ” ከ“አገልጋይ” ይበልጥ የምንጩን ኃይል ይጠብቃል።
- source_word: οἶδεν τί ποιεῖ
  choice: የሚያደርገውን አያውቅም
  rationale: οἶδα እውቀትን፣ τί ποιεῖ ደግሞ በሂደት ላይ ያለን ድርጊት ያመለክታሉ።
- source_word: αὐτοῦ ὁ κύριος
  choice: ጌታው
  rationale: እዚህ κύριος በባሪያና በጌታ የቤት አስተዳደር ንጽጽር ውስጥ ያለውን ባለሥልጣን እንጂ መለኮታዊ ማዕረግን አያመለክትም።
- source_word: εἴρηκα φίλους
  choice: ወዳጆች ብያችኋለሁ
  rationale: የግሪኩ ፍጹም ጊዜ ያለፈው ስያሜ እስካሁን ጸንቶ መኖሩን ያሳያል፤ የአማርኛው ውሁድ ፍጹም ይህን ውጤታዊ ኃይል ይጠብቃል።
- source_word: πάντα ἃ ἤκουσα παρὰ τοῦ πατρός μου
  choice: ከአባቴ የሰማሁትን ሁሉ
  rationale: πάντα ἃ ያለውን ሙሉ አካታችነት፣ ἀκούω ያለውን የመስማት ትርጉም፣ παρά ያለውንም የምንጭ ግንኙነት በቀጥታ ያስተላልፋል።
- source_word: ἐγνώρισα ὑμῖν
  choice: አሳውቄአችኋለሁ
  rationale: γνωρίζω “ማሳወቅ/መግለጥ” ማለት ነው፤ አገላለጹ የተፈጸመው ማሳወቅ አሁንም ውጤት እንዳለው ይገልጣል።
theological_decisions:
- issue: በደቀ መዛሙርትና በወዳጆች ንጽጽር ውስጥ δοῦλοςን መተርጎም
  choice: ባሪያ
  alternative: አገልጋይ
  rationale: ንጽጽሩ ከበታች ደረጃ የተነሣ አለማወቅን ከወዳጅነት የተነሣ መገለጥ ጋር ያነጻጽራል። “ባሪያ” ይህን ማኅበራዊ ልዩነት በግልጽ ይጠብቃል።
- issue: κύριοςን በመለኮታዊ ያልሆነ የቤት አስተዳደር ምሳሌ ውስጥ መተርጎም
  choice: ጌታ
  alternative: ጌታ የሚለውን እንደ መለኮታዊ ማዕረግ መረዳት
  rationale: የቃሉ ማጣቀሻ በባሪያ ላይ ሥልጣን ያለው ሰው ነው፤ በዚህ ስፍራ የክርስቶስ ወይም የእግዚአብሔር ማዕረግ አይደለም።
- issue: የεἴρηκα እና ἐγνώρισα የግስ ገጽታ
  choice: ብያችኋለሁ ... አሳውቄአችኋለሁ
  alternative: አልኋችሁ ... አሳወቅኋችሁ
  rationale: ውሁድ ፍጹሙ ያለፈው ድርጊት አሁን ያለውን ውጤት ይጠብቃል፤ ይህም የግሪኩን ፍጹም/ውጤታዊ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
