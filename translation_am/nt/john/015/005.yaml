  text: ἐγώ εἰμι ἡ ἄμπελος, ὑμεῖς τὰ κλήματα. ὁ μένων ἐν ἐμοὶ κἀγὼ ἐν αὐτῷ οὗτος φέρει καρπὸν πολύν, ὅτι χωρὶς ἐμοῦ οὐ δύνασθε ποιεῖν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/005.yaml
  text: I am the vine[a]; you are the branches. The one who remains in me, and I in him, bears much fruit[b], because apart from me you are not able to do anything.
translation:
  language: am
  text: እኔ የወይን ተክል ነኝ፤ እናንተ ቅርንጫፎቹ ናችሁ። በእኔ የሚኖር[a]፣ እኔም በእርሱ[b] የምኖርበት ሰው ብዙ ፍሬ ያፈራል፤ ምክንያቱም ከእኔ ተለይታችሁ ምንም ማድረግ አትችሉም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በእኔ ጸንቶ የሚቆየው” ተብሎም ሊተረጎም ይችላል። የግሪኩ ግስ፣ በተለይም በዮሐንስ ጽሑፎች፣ ቀጣይነት ያለውን የግንኙነት ጽናት ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “በእርሱ” የሚለው የግሪክ ቃል ወንድ ነጠላ ቅርጽ አለው፤ ነገር ግን በኢየሱስ የሚኖርን ማንኛውንም ደቀ መዝሙር በተወካይነት ይመለከታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄμπελος
  choice: የወይን ተክል
  rationale: ቃሉ የወይንን ተክል በሙሉ ያመለክታል፤ “ግንድ” ማለት ምስሉን ወደ አንድ የተክሉ ክፍል ሊያጠብበው ስለሚችል “የወይን ተክል” ተመርጧል።
- source_word: κλήματα
  choice: ቅርንጫፎቹ
  rationale: በወይን እርሻ አውድ ቃሉ የወይን ተክልን ቅርንጫፎች ወይም ቀንበጦች ያመለክታል፤ “ቅርንጫፎቹ” ምስሉን በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ὁ μένων
  choice: የሚኖረው
  rationale: μένω በዮሐንስ አጠቃቀም ቀጣይነት ያለውን ግንኙነትና ጸንቶ መቆየትን ይገልጣል፤ “የሚኖረው” ይህን ትርጉም በተነባቢ ዘመናዊ አማርኛ ያቀርባል።
- source_word: ἐν ἐμοὶ ... ἐν αὐτῷ
  choice: በእኔ ... በእርሱ
  rationale: የግሪኩ ἐν የሚገልጠውን የጋራ ውስጣዊ ኅብረት ሳያዳክም “በ” ተጠብቋል።
- source_word: κἀγώ
  choice: እኔም
  rationale: የግሪኩን “እኔም” የሚል ተመላላሽ አወቃቀር በቀጥታ ይጠብቃል።
- source_word: φέρει καρπὸν πολύν
  choice: ብዙ ፍሬ ያፈራል
  rationale: “ፍሬ ማፍራት” በአማርኛ ተፈጥሯዊ አገላለጽ ሲሆን የወይኑን ምስልም ይጠብቃል።
- source_word: χωρὶς ἐμοῦ
  choice: ከእኔ ተለይታችሁ
  rationale: χωρίς ከኢየሱስ የመለየትን ሐሳብ ይዟል፤ ይህ አገላለጽ ከእርሱ እርዳታ አለማግኘትን ብቻ ሳይሆን ከእርሱ ተነጥሎ መኖርን ያሳያል።
- source_word: οὐ δύνασθε ποιεῖν οὐδέν
  choice: ምንም ማድረግ አትችሉም
  rationale: አገላለጹ ክልከላን ሳይሆን አለመቻልን ይገልጣል፤ የግሪኩን አሉታዊ አወቃቀር በተፈጥሯዊ አማርኛ ያስተላልፋል።
