  text: እርስ በርሳችሁ እንድትዋደዱ፣ እነዚህን ነገሮች አዝዛችኋለሁ[b][a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የማዝዛችሁ ይህ ነው፤ እርስ በርሳችሁ ተዋደዱ።” የግሪኩ ἵνα አንቀጽ ዓላማን ወይም የትእዛዙን ይዘት የሚገልጽ ሆኖ ሊገባ ይችላል።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ “እነዚህን ነገሮች እያዘዝኳችሁ ነው።”
    reason: previous_rendering
lexical_decisions:
- source_word: ταῦτα
  choice: እነዚህን ነገሮች
  rationale: ገለልተኛ ብዙ ቁጥር አመልካች ቃል ስለሆነ ብዙ ቁጥሩን በግልጽ ያስቀምጣል፤ ከዚህ በፊት የተነገሩትንም ትእዛዛት ያመለክታል።
- source_word: ἐντέλλομαι
  choice: አዝዛችኋለሁ
  rationale: ‘አዝዛችኋለሁ’ የትእዛዝን ቀጥተኛ ኃይል በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል። የአማርኛው ፍጹም ቅርጽ በዚህ ንግግር ውስጥ የአሁን ጊዜ ቀጥተኛ ትእዛዝን ተፈጥሯዊ ሁኔታ ሊገልጽ ይችላል።
- source_word: ὑμῖν
  choice: -አችኋለሁ
  rationale: የሁለተኛ መደብ ብዙ ቁጥር ተቀባይ በግሱ ውስጥ ተዋሕዶ ተገልጿል።
- source_word: ἵνα
  choice: እንድት-
  rationale: የዓላማን ወይም የታሰበ ውጤትን ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል፤ በአውዱ የትእዛዙን ይዘት ወደሚገልጽ ንባብም ሊቀርብ ይችላል።
- source_word: ἀγαπᾶτε
  choice: ትዋደዱ
  rationale: የἀγαπάωን መሠረታዊ ትርጉም በጋራ ተግባር እና በዓላማ አንቀጽ ውስጥ በተፈጥሯዊ ሁኔታ ይገልጻል።
- source_word: ἀλλήλους
  choice: እርስ በርሳችሁ
  rationale: በቡድኑ አባላት መካከል ያለውን የጋራ ተግባር በመደበኛ አማርኛ በግልጽ ያሳያል።
theological_decisions:
- issue: በትእዛዙና በἵνα አንቀጹ መካከል ያለው ግንኙነት
  choice: አንቀጹ የዓላማን ግንኙነት እንዲያሳይ ‘እንድትዋደዱ’ ተብሎ ተተርጉሟል።
  alternative: ‘የማዝዛችሁ ይህን ነው፤ እርስ በርሳችሁ ተዋደዱ’ ተብሎ እንደ ትእዛዙ ይዘት ሊነበብ ይችላል።
  rationale: ἵνα በዋናነት ዓላማን ወይም የታሰበ ውጤትን ያሳያል፤ በዮሐንስ አጻጻፍ ግን የትእዛዙን ይዘት ወደሚገልጽ አጠቃቀም ሊቀርብ ስለሚችል አማራጩ በማስታወሻ ተጠብቋል።
