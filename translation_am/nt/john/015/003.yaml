  text: Already you are clean because of the word that I have spoken to you[a].
translation:
  language: am
  text: እናንተ ከወዲሁ ለእናንተ በተናገርኩት ቃል ምክንያት ንጹሓን ናችሁ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለእናንተ በተናገርኩት ቃል አማካይነት።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: አሁን
  rationale: በአሁኑ ጊዜ አስቀድሞ ተፈጽሞ ያለን ሁኔታ ያመለክታል፤ በአማርኛ ዓረፍተ ነገሩ ውስጥ ‘አሁን’ ይህን በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: ὑμεῖς
  choice: እናንተ
  rationale: ግልጽ ተውላጠ ስም መጠቀሙ በግሪኩ ያለውን አጽንዖት ይጠብቃል።
- source_word: καθαροί
  choice: ንጹሓን
  rationale: ‘ንጹሓን’ የንጽሕናን ምስል ይጠብቃል፤ በዙሪያው ካለው የወይን ግንድና የማጽዳት/መግረዝ ምሳሌ ጋርም ይገናኛል።
- source_word: διὰ τὸν λόγον
  choice: በተናገርኩት ቃል ምክንያት
  rationale: διά ከተሳቢ ጋር በዚህ ስፍራ ምክንያትን ወይም መንስኤን ሊገልጽ ይችላል፤ ‘ምክንያት’ ዋናውን ንባብ ያሳያል፣ ‘በ…በኩል’ የሚለው የመሣሪያ ንባብ ግን በማስታወሻ ተጠብቋል።
- source_word: λόγον
  choice: ቃል
  rationale: የዮሐንስን የቃል አጠቃቀም የሚጠብቅ ቀጥተኛና የተለመደ አማርኛ ነው።
- source_word: ὃν λελάληκα ὑμῖν
  choice: እኔ ለእናንተ በተናገርኩት
  rationale: የግሪኩ ፍጹም ጊዜ ያለፈውን ንግግርና የቀጠለውን ውጤቱን ያሳያል፤ የአማርኛው አንጻራዊ ግስ ይህን በተፈጥሯዊ አገባብ ያቀርባል።
theological_decisions:
- issue: የደቀ መዛሙርቱ ንጽሕና ባሕርይ
  choice: ንጹሓን ናችሁ
  alternative: የሥርዓተ አምልኮ መንጻት፣ ወይም በሕግ ፊት ጻድቅ መባልን በቴክኒካዊ መንገድ መግለጽ
  rationale: ጽሑፉ ንጽሕናውን ከኢየሱስ ከተናገረው ቃልና ከወይኑ ምሳሌ ጋር ያያይዘዋል። ትርጉሙ ይህን ምስልና ሥነ መለኮታዊ ክፍትነት ይጠብቃል እንጂ ወደ አንድ የኋላ ዘመን ዶክትሪናዊ ምድብ አያጠበውም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። ‘ንጹሓን’ የሚለው ቃል የጽሑፉን የማጽዳት ምስል ይጠብቃል።
