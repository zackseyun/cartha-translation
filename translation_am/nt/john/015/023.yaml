id: JHN.15.23
reference: John 15:23
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ ἐμὲ μισῶν καὶ τὸν πατέρα μου μισεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/023.yaml
  text: The one who hates me also hates my Father.
translation:
  language: am
  text: እኔን የሚጠላ አባቴንም ይጠላል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... μισῶν
  choice: የሚጠላ
  rationale: መስተዋድዱ ከአሁን ጊዜ አካፋይ ጋር ሆኖ ተግባሩ የሚለይበትን ሰው በአጠቃላይ ያመለክታል፤ በአማርኛ «የሚጠላ» ይህን አጠቃላይ ነጠላ ኃይል በተፈጥሮ ያስተላልፋል።
- source_word: ἐμὲ
  choice: እኔን
  rationale: ቀጥተኛ ተሳቢ ተውላጠ ስም ነው፤ የግሪኩን ጎላ ያለ ቅርጽ በተፈጥሯዊው «እኔን» ይጠብቃል።
- source_word: μισῶν / μισεῖ
  choice: የሚጠላ / ይጠላል
  rationale: μισέω «መጥላት» ማለት ነው። በሁለቱም ስፍራ «ጠላ» የሚለውን ተመሳሳይ ግስ መጠቀም የግሪኩን ቃላዊ ድግግሞሽና አጠቃላይ የአሁን ጊዜ ኃይል ይጠብቃል።
- source_word: καὶ
  choice: -ም
  rationale: ከስም ጋር የተያያዘው «-ም» እዚህ «ደግሞ/እንዲሁም» የሚለውን አካታች ኃይል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τὸν πατέρα μου
  choice: አባቴን
  rationale: πατέρα ከμου ጋር በተፈጥሯዊ አማርኛ «አባቴን» ይሆናል፤ የንብረት ግንኙነቱንና ቀጥተኛ ተሳቢነቱን በአንድ ቃል ያሳያል።
theological_decisions:
- issue: «አባቴ» እግዚአብሔርን የሚያመለክት የግንኙነት መጠሪያ መሆኑ
  choice: አባቴን
  alternative: የእኔን አባት
  rationale: በዮሐንስ ወንጌል ዐውድ ይህ የኢየሱስን ከእግዚአብሔር ጋር ያለውን ልዩ ግንኙነት ያመለክታል። የግዕዝ ፊደል ትልቅና ትንሽ ፊደል ልዩነት ስለሌለው ይህ ከዐውዱ ይታወቃል፤ «አባቴን» ግን ትርጉሙን ሳያሰፋ በግልጽ ያቀርባል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ቀጥተኛ የሆነ አማርኛ። የግሪኩ አጭር አወቃቀር፣ የ«መጥላት» ድግግሞሽና በኢየሱስ ላይ ያለው ጥላቻ አባቱንም እንደሚመለከት የሚያሳየው ጥብቅ ግንኙነት ተጠብቋል።
