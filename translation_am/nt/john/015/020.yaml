source:
  edition: SBLGNT
  text: μνημονεύετε τοῦ λόγου οὗ ἐγὼ εἶπον ὑμῖν· Οὐκ ἔστιν δοῦλος μείζων τοῦ κυρίου αὐτοῦ· εἰ ἐμὲ ἐδίωξαν, καὶ ὑμᾶς διώξουσιν· εἰ τὸν λόγον μου ἐτήρησαν, καὶ τὸν ὑμέτερον τηρήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/020.yaml
  text: 'Remember the word that I said to you: ‘A servant is not greater than his master.’ If they persecuted me[a], they will also persecute you; if they kept my word[b], they will also keep yours.'
translation:
  language: am
  text: “እኔ የነገርኋችሁን ቃል አስታውሱ፤ ‘ባሪያ[a] ከጌታው አይበልጥም።’ እኔን ካሳደዱኝ፣ እናንተንም ያሳድዷችኋል፤ ቃሌን ጠብቀው ከሆነ[b]፣ የእናንተንም ቃል ይጠብቃሉ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አገልጋይ።” የግሪኩ δοῦλος እንደ ዐውዱ “ባሪያ” ወይም “አገልጋይ” ሊባል ይችላል፤ እዚህ ከጌታ ጋር ያለው ንጽጽር የበታችነትን ደረጃ ያጎላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ቃሌን ታዝዘው ከሆነ።” በዮሐንስ “ቃልን መጠበቅ” የኢየሱስን መልእክት መቀበልንና በታዛዥነት መኖርን ሁለቱንም ሊያካትት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημονεύετε
  choice: አስታውሱ
  rationale: የአሁን ጊዜ ትእዛዛዊውን ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል፤ የቀድሞውን ንግግር በአእምሮ መያዝን ያመለክታል።
- source_word: λόγου
  choice: ቃል
  rationale: እዚህ ኢየሱስ አስቀድሞ የተናገረውን የተወሰነ አባባል ያመለክታል፤ በቁጥሩ ውስጥ ያለውን የλόγος ድግግሞሽም ይጠብቃል።
- source_word: δοῦλος
  choice: ባሪያ
  rationale: ከκύριος ጋር ያለው ንጽጽር የበታችነትንና የጌታ ሥልጣንን ያጎላል፤ ‘ባሪያ’ ይህን ማኅበራዊ ግንኙነት ከ‘አገልጋይ’ ይበልጥ በግልጽ ያሳያል።
- source_word: μείζων
  choice: አይበልጥም
  rationale: የደረጃና የሥልጣን ንጽጽሩን ሳያጠብ በተለመደ አማርኛ ያቀርባል።
- source_word: κυρίου
  choice: ጌታው
  rationale: በባሪያና በጌታ መካከል ያለውን የሥልጣን ግንኙነት ይገልጣል፤ በዚህ አባባል ውስጥ ቃሉ በቀጥታ መለኮታዊ ማዕረግ አይደለም።
- source_word: ἐδίωξαν / διώξουσιν
  choice: ካሳደዱኝ / ያሳድዷችኋል
  rationale: በዐውዱ ያለውን ጥላቻ፣ ጫናና ስደት የሚያካትት ትርጉም በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐτήρησαν / τηρήσουσιν
  choice: ጠብቀው ከሆነ / ይጠብቃሉ
  rationale: በዮሐንስ የሚታየውን ‘ቃልን መጠበቅ’ የሚለውን የቃላት ትስስር ይጠብቃል፤ መልእክቱን መቀበልንና መታዘዝን ሁለቱንም ሊያካትት ይችላል።
- source_word: τὸν λόγον μου ... τὸν ὑμέτερον
  choice: ቃሌን ... የእናንተንም ቃል
  rationale: በኢየሱስ ቃልና በደቀ መዛሙርቱ የሚነገር ቃል መካከል ያለውን ትይዩነት በግልጽ ያሳያል።
theological_decisions:
- issue: δοῦλος በደረጃ ንጽጽር ውስጥ እንዴት እንደሚተረጎም
  choice: ባሪያ
  alternative: አገልጋይ
  rationale: አባባሉ በδοῦλοςና κύριος መካከል ባለው ያልተመጣጠነ የሥልጣን ግንኙነት ላይ የተመሠረተ ስለሆነ፣ ‘ባሪያ’ የግሪኩን ኃይል ይበልጥ ይጠብቃል።
- issue: τηρέω ከ‘ቃል’ ጋር ያለው ትርጉም
  choice: ቃልን መጠበቅ
  alternative: ቃልን መታዘዝ
  rationale: ‘መጠበቅ’ የዮሐንስን አገላለጽ ይጠብቃል፤ መልእክቱን መቀበልና በእርሱ መሠረት መኖር የሚሉትን ሁለቱንም ገጽታዎች ሳይለያይ ይተዋል።
- issue: የሁለቱ εἰ አረፍተ ነገሮች ሁኔታዊ ኃይል
  choice: ካሳደዱኝ ... ጠብቀው ከሆነ
  alternative: ስላሳደዱኝ ... ስለጠበቁ
  rationale: የግሪኩን ትይዩ ሁኔታዊ አቀራረብ በግልጽ ይጠብቃል፤ ሁለተኛውን አባባል በስፋት እውነት ነው ብሎ በግድ አይወስንም።
