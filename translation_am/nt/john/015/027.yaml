id: JHN.15.27
reference: John 15:27
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς δὲ μαρτυρεῖτε, ὅτι ἀπ’ ἀρχῆς μετ’ ἐμοῦ ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/027.yaml
  text: And you also testify[b][a], because you have been with me from the beginning.
translation:
  language: am
  text: እናንተም ትመሰክራላችሁ፤ ምክንያቱም ከመጀመሪያ ጀምሮ ከእኔ ጋር ናችሁ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ὑμεῖς δὲ
  choice: እናንተም
  rationale: ግልጽ የሆነውን ተውላጠ ስም አጽንዖትና ከቀደመው ቁጥር ከተጠቀሰው የመንፈስ ምስክርነት ጋር ያለውን ተጨማሪነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: μαρτυρεῖτε
  choice: ትመሰክራላችሁ
  rationale: የምስክርነትን ሕጋዊና ታሪካዊ ስሜት የሚጠብቅ ተፈጥሯዊ ዘመናዊ አገላለጽ ነው። የግሪኩ ቅርጽ እንደ አረጋጋጭ ንግግር ወይም እንደ ትእዛዝ ሊነበብ መቻሉ በማስታወሻ ተጠብቋል።
- source_word: ὅτι
  choice: ስለሆናችሁ
  rationale: ከኢየሱስ ጋር ከመጀመሪያው መኖራቸው ለምስክርነታቸው ምክንያት መሆኑን በግልጽ ያሳያል።
- source_word: ἀπ’ ἀρχῆς
  choice: ከመጀመሪያው ጀምሮ
  rationale: የሐረጉን ጊዜያዊ አመልካችነት የሚጠብቅ የተለመደ የአማርኛ አገላለጽ ነው፤ መጀመሪያው በትክክል ምንን እንደሚያመለክት በትርጉሙ ውስጥ አይወስንም።
- source_word: μετ’ ἐμοῦ ἐστε
  choice: ከእኔ ጋር ስለሆናችሁ
  rationale: ከኢየሱስ ጋር ያላቸውን ኅብረትና ከቀድሞ ጀምሮ እስከ አሁን የቀጠለውን ሁኔታ በአማርኛ የአሁን ጊዜ አገላለጽ ይጠብቃል።
theological_decisions:
- issue: “ከመጀመሪያው” የሚለው ሐረግ ወሰን
  choice: ሐረጉ ያለ ተጨማሪ ማብራሪያ “ከመጀመሪያው ጀምሮ” ተብሎ ተተርጉሟል።
  alternative: የኢየሱስን የሕዝብ አገልግሎት ወይም የደቀ መዛሙርቱን ተከታይነት መጀመሪያ በግልጽ መጨመር፤ ወይም ፍጹም የሆነን መጀመሪያ እንደሚያመለክት መተርጎም።
  rationale: ቅርብ ዐውዱ ደቀ መዛሙርቱ ከኢየሱስ ጋር በታሪክ ውስጥ መኖራቸው ለምስክርነታቸው መሠረት መሆኑን ይጠቁማል፤ ሆኖም ዋናው ጽሑፍ ከምንጩ በላይ ዝርዝር አይጨምርም።
- issue: μαρτυρεῖτε የንግግር ዓይነት
  choice: በዋናው ጽሑፍ “ትመሰክራላችሁ” ተብሎ እንደ አረጋጋጭ ንግግር ቀርቧል።
  alternative: “መስክሩ” ብሎ እንደ ትእዛዝ ማቅረብ።
  rationale: የግሪኩ ቅርጽ ሁለቱንም ንባቦች ሊፈቅድ ቢችልም፣ ከቀደመው “ይመሰክራል” ጋር ያለው ትይዩነት አረጋጋጭ ንባቡን ይደግፋል፤ ሌላው ንባብ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ትመሰክራላችሁ” የምስክርነትን ዋና ፍቺ ሳያጠፋ ተፈጥሯዊ ነው፤ “ከመጀመሪያው ጀምሮ ... ስለሆናችሁ” ደግሞ ከቀድሞ እስከ አሁን የቀጠለውን ሁኔታ ያሳያል።
