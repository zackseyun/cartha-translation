  rationale: ክፍሉ በኢየሱስ ልዩ ሥራዎች ፊት ያለውን የጨመረ ተጠያቂነት ቢያመለክትም፣ ትርጉሙ የጽሑፉን ሰፊና ውጥረት ያለበት አገላለጽ ወደ አንድ የዶክትሪን ትርጓሜ አያጠብም።
