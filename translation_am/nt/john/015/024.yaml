base_translation:
  language: en
  yaml_path: translation/nt/john/015/024.yaml
  text: If I had not done among them the works that no one else did[a], they would not have sin[b]; but now they have both seen and hated both me and my Father.
translation:
  language: am
  text: በመካከላቸው ሌላ ማንም ያላደረጋቸውን ሥራዎች ባላደርግ ኖሮ፣ ኃጢአት አይኖራቸውም ነበር፤[a] አሁን ግን አይተዋል፣ እኔንም አባቴንም ጠልተዋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “ኃጢአት አይኖራቸውም ነበር።” እንዲሁም፣ “በኃጢአት ጥፋተኞች አይሆኑም ነበር” ሊባል ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔργα
  choice: ሥራ
  rationale: “ሥራ” በዮሐንስ ወንጌል የኢየሱስን ማንነትና ተልዕኮ የሚገልጡ ተግባራትን በተፈጥሯዊ አማርኛ ያመለክታል። በግሪክ ያለው ብዙ ቁጥር በአማርኛ የወል ስም ሊገለጽ ይችላል።
- source_word: ἐποίησα ἐν αὐτοῖς
  choice: በመካከላቸው … ባላደርግ ኖሮ
  rationale: ἐν αὐτοῖς ኢየሱስ በእነርሱ መካከልና በፊታቸው ያደረገውን ያመለክታል፤ የማይፈጸም ግምታዊ ሁኔታውም “ባላደርግ ኖሮ” ተብሎ በተፈጥሯዊ አማርኛ ተገልጧል።
- source_word: ἃ οὐδεὶς ἄλλος ἐποίησεν
  choice: ሌላ ማንም ያላደረገውን
  rationale: የኢየሱስን ሥራዎች ልዩነት ያለ ተጨማሪ ትርጓሜ በግልጽ ያስተላልፋል።
- source_word: ἁμαρτίαν οὐκ εἴχοσαν
  choice: ኃጢአት አይኖርባቸውም ነበር
  rationale: የዮሐንስን “ኃጢአት መኖር” አገላለጽ በአማርኛ ሊነበብ በሚችል መልኩ ያቆያል፤ “ጥፋተኞች አይሆኑም ነበር” ብሎ ትርጉሙን አያጠብም።
- source_word: νῦν δὲ
  choice: አሁን ግን
  rationale: በግምታዊው ሁኔታና በእውነተኛው ውጤት መካከል ያለውን ንጽጽር በግልጽ ያሳያል።
- source_word: καὶ ἑωράκασιν καὶ μεμισήκασιν
  choice: አይተዋል፣ … ጠልተዋል
  rationale: የግሪኩን ፍጹም ጊዜ ያለፈ ድርጊት አሁንም ውጤት እንዳለው በተፈጥሯዊ አማርኛ ያቀርባል፤ ሁለቱን ግሶች ለማጉላት የግሪኩን καί በሁለት “ም” መድገም በአማርኛ የነገሩን ፍሰት ያከብድ ነበር።
- source_word: καὶ ἐμὲ καὶ τὸν πατέρα μου
  choice: እኔንም አባቴንም
  rationale: የተደገመውን καί እና በሁለቱም ላይ ያለውን አጽንዖት በአማርኛው “-ም … -ም” አወቃቀር ይጠብቃል።
