lexical_decisions:
- source_word: μακάριοι
  choice: ብፁዓን ናቸው
  rationale: በብፅዕና ንግግሮች የተለመደውን፣ የእግዚአብሔርን ሞገስና መልካም ሁኔታ የሚያመለክተውን ክብደት ይጠብቃል፤ ተራ ስሜታዊ ደስታን ብቻ አያመለክትም።
- source_word: οἱ ἐλεήμονες
  choice: መሐሪዎች
  rationale: በግሪኩ ያለውን ስም ሆኖ የሚሠራ ቅጽል በአጭርና ተፈጥሯዊ አማርኛ ይገልጻል፤ ከቀጣዩ የምሕረት ቃል ጋርም ያለውን የቃል ግንኙነት ይጠብቃል።
- source_word: ὅτι
  choice: -ና
  rationale: የብፅዕናውን ምክንያት ወይም መሠረት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: αὐτοὶ
  choice: -ላቸው
  rationale: ተስፋው በተለይ ለመሐሪዎቹ እንደሆነ በግሱ ውስጥ በተፈጥሯዊ አማርኛ ያሳያል፤ «እነርሱ ራሳቸው» ማለት ንግግሩን ከባድ ያደርገዋል።
- source_word: ἐλεηθήσονται
  choice: ምሕረት ይደረግላቸዋል
  rationale: የወደፊት ጊዜ ተደራጊ ቅርጹን እና ከ«መሐሪዎች» ጋር ያለውን የምሕረት ቃላዊ ድግግሞሽ ይጠብቃል፤ የምሕረቱን አድራጊ አይጠቅስም።
theological_decisions:
- issue: የተስፋው ምሕረት አድራጊ
  choice: ምሕረት ይደረግላቸዋል
  alternative: እግዚአብሔር ምሕረት ያደርግላቸዋል
  rationale: የግሪኩ ተደራጊ ግስ አድራጊውን አይጠቅስም። በዐውዱ መለኮታዊ ምሕረት በጽኑ ቢጠቁምም፣ ትርጉሙ ጽሑፉ ያልገለጸውን አድራጊ በግልጽ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና በቀላሉ የሚገባ መደበኛ አማርኛ ተጠቅሟል። «ብፁዓን» የብፅዕና ንግግሮችን የታወቀ ሥነ ጽሑፋዊና መጽሐፍ ቅዱሳዊ ቅርጽ ይጠብቃል፤ የተቀረው አገላለጽ ግን ተፈጥሯዊ ነው።
