- source_word: ἕως ἂν παρέλθῃ ὁ οὐρανὸς καὶ ἡ γῆ
  choice: ሰማይና ምድር እስኪያልፉ ድረስ
  rationale: παρέρχομαι ያለውን የማለፍ ትርጉምና የአጽናፈ ዓለም ስፋት በቀጥታ ይገልጣል።
- source_word: ἰῶτα ἓν
  choice: አንድ ኢዮታም
