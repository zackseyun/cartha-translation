base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/018.yaml
  text: For truly I say to you[a], until heaven and earth pass away[c][b], not one iota or one stroke will ever pass away from the law until all things happen.
translation:
  language: am
  text: እውነት እላችኋለሁና፤ ሰማይና ምድር እስኪያልፉ ድረስ፣ ከሕጉ አንድ ኢዮታ[a] ወይም አንዲት ትንሽ የፊደል ምልክት[b] እንኳ ከቶ አያልፍም፤ ሁሉ እስኪፈጸም ድረስ።[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ኢዮታ» በግሪክ ፊደላት ውስጥ እጅግ ትንሹ ፊደል ነው፤ ወይም፦ «አንድ እጅግ ትንሽ ፊደል»።
    reason: lexical_alternative
  - marker: b
    text: ፊደሎችን የሚለይ እጅግ ትንሽ የጽሑፍ መስመር ወይም ጫፍ ነው።
    reason: lexical_alternative
  - marker: c
    text: ወይም፦ «ሁሉ እስኪሆን ድረስ» ወይም «ሁሉ እስኪፈጸም ድረስ»፤ ግሪኩ ሁሉ ነገር መከሰቱን ወይም ወደ ፍጻሜ መድረሱን ሊያመለክት ይችላል።
    reason: alternative_reading
