  rationale: ሐረጉ ክስተትንም ሆነ ፍጻሜን ሊያመለክት ይችላል። «እስኪፈጸም» በዐውዱ ተፈጥሯዊ ሲሆን ልዩ የፍጻሜ ዘመን ሥርዓትን አይጭንም፤ ሌላው አማራጭ በማስታወሻ ተገልጿል።
