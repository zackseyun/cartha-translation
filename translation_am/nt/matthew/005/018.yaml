  rationale: ጥቅሱ ከቀደመው ንግግር ጋር ያለው የማብራሪያ ግንኙነት በዐውዱ ይታያል፤ «ምክንያቱም» ማለት በአማርኛ ንባብ ከባድ ያደርገዋል።
- source_word: λέγω ὑμῖν
  choice: እላችኋለሁ
