  text: ὅπως γένησθε υἱοὶ τοῦ πατρὸς ὑμῶν τοῦ ⸀ἐν οὐρανοῖς, ὅτι τὸν ἥλιον αὐτοῦ ἀνατέλλει ἐπὶ πονηροὺς καὶ ἀγαθοὺς καὶ βρέχει ἐπὶ δικαίους καὶ ἀδίκους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/045.yaml
  text: so that you may become sons of your Father in heaven[a], because he makes his sun rise on evil and good[c][b], and sends rain on righteous and unrighteous.
translation:
  language: am
  text: በሰማያት ያለው የአባታችሁ ልጆች[a] እንድትሆኑ ዘንድ፣ እርሱ ፀሐዩን በክፉዎችና በበጎዎች ላይ ያወጣል፤ በጻድቃንና በዓመፀኞችም ላይ ዝናብን ያዘንባል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፦ “ወንድ ልጆች”። በዚህ አውድ ቃሉ የኢየሱስን ደቀ መዛሙርት በአጠቃላይ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως γένησθε
  choice: እንድትሆኑ ነው
  rationale: የዓላማን ወይም የውጤትን ኃይል በተፈጥሯዊ አማርኛ ያቀርባል። γένησθε ያለውን ‘መሆን/ወደ መሆን መምጣት’ ኃይል ይጠብቃል፤ ዐውዱም የአብን ቸርነት በመምሰል የልጅነት ባሕርይን መግለጥ ነው።
- source_word: υἱοὶ
  choice: ልጆች
  rationale: ግሪኩ በቀጥታ ‘ወንዶች ልጆች’ ቢልም፣ በአማርኛ ‘የአባታችሁ ወንዶች ልጆች’ የሚለው ከባድና የወንዶችን ፆታ ብቻ የሚያመለክት ሆኖ ሊሰማ ይችላል። ‘ልጆች’ የደቀ መዛሙርቱን አጠቃላይ ውክልና በተፈጥሯዊ ሁኔታ ይገልጣል፤ የምንጩ የወንድ ልጅነት ቃል በማስታወሻ ተጠብቋል።
- source_word: τοῦ πατρὸς ὑμῶν τοῦ ἐν οὐρανοῖς
  choice: በሰማያት ያለው የአባታችሁ
  rationale: የግሪኩን የብዙ ቁጥር οὐρανοῖς በ‘ሰማያት’ ግልጽ አድርጎ ይይዛል፤ የአባታችሁ የሚለውንም ከቦታው ሐረግ ጋር አያዋህድም።
- source_word: τὸν ἥλιον αὐτοῦ ἀνατέλλει
  choice: ፀሐዩን ... ያወጣል
  rationale: ‘ፀሐዩን’ የሚለው αὐτοῦ ያለውን ባለቤትነት ያሳያል፤ ‘ያወጣል’ ደግሞ እግዚአብሔር ፀሐይን እንዲወጣ የማድረጉን ኃይል በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐπὶ πονηροὺς καὶ ἀγαθοὺς
  choice: በክፉዎችና በበጎዎች ላይ
  rationale: ስሞች ሆነው የሚሠሩትን ቅጽሎች ግልጽና ሚዛናዊ በሆነ ጥንድ ይተረጉማል።
- source_word: βρέχει
  choice: ዝናብን ያዘንባል
  rationale: ቃሉ በቀጥታ ‘ያዘንባል’ ሲሆን፣ ይህ አተረጓጎም መለኮታዊውን አድራጊነት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐπὶ δικαίους καὶ ἀδίκους
  choice: በጻድቃንና በዓመፀኞችም ላይ
  rationale: የሥነ ምግባር ተቃርኖውን በተለመደው የመጽሐፍ ቅዱስ አማርኛ ይገልጣል፤ ‘ዓመፀኞች’ ἄδικοι ያለውን የጽድቅ ተቃራኒ ሐሳብ ይይዛል።
theological_decisions:
- issue: የυἱοὶ ፆታዊና የልጅነት ቋንቋ
  choice: ልጆች፣ ቃል በቃል አማራጩን በማስታወሻ ማሳየት
  alternative: ወንዶች ልጆች
  rationale: ምንጩ የወንድ ልጅነትን ቃል ይጠቀማል፤ ነገር ግን ዐውዱ ሁሉንም ደቀ መዛሙርት ይወክላል። ዋናው ጽሑፍ ተፈጥሯዊና አካታች ሆኖ፣ የምንጩ ቅርጽ በማስታወሻ እንዳይጠፋ ተደርጓል።
- issue: γένησθε እና መለኮታዊ ልጅነት
  choice: እንድትሆኑ
  alternative: መሆናችሁን እንድታሳዩ
  rationale: ‘እንድትሆኑ’ የግሪኩን የግስ ኃይልና አሻሚነት ይጠብቃል፤ ‘መሆናችሁን እንድታሳዩ’ ማለት ጽሑፉ በግልጽ ያልወሰነውን ትርጓሜ ይጨምራል። ቃሉ በሰው ድርጊት የድነት ልጅነት ይፈጠራል የሚል ሥርዓት ሳይጨመርበት ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። ‘ሰማያት፣ ጻድቃን፣ ዓመፀኞች’ የሚሉት ቃላት የመጽሐፍ ቅዱስን ክብር ሲጠብቁ በዘመናዊ አጠቃቀምም የሚገቡ ናቸው።
