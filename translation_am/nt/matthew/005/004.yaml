  text: μακάριοι οἱ πενθοῦντες, ὅτι αὐτοὶ παρακληθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/004.yaml
  text: Blessed are those who mourn[a], because they will be comforted.
translation:
  language: am
  text: የሚያዝኑ[a] የተባረኩ ናቸው፤ ምክንያቱም እነርሱ ይጽናናሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የሚተክዙ።” የግሪኩ ቃል ሰፊ ትርጉም ያለው ሲሆን የሐዘኑን መንስኤ አይገልጽም።
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: የተባረኩ ናቸው
  rationale: የብፅዕናውን አዋጅ እና ከግለሰብ ስሜት የሰፋውን የእግዚአብሔር ይሁንታ ያስተላልፋል፤ ‘ደስተኞች’ የሚለው ግን ሐዘኑን ሊቃረንና በስሜት ብቻ ሊወሰን ይችላል።
- source_word: οἱ πενθοῦντες
  choice: የሚያዝኑ
  rationale: መንስኤውን ሳይወስን በኪሳራ፣ በመከራ፣ በኃጢአት ወይም በሌላ ምክንያት የሚኖርን ጥልቅ ሐዘን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ὅτι
  choice: ምክንያቱም
  rationale: ለብፅዕናው አዋጅ የሚሰጠውን ምክንያት በግልጽ ዘመናዊ አማርኛ ያሳያል።
- source_word: αὐτοὶ
  choice: እነርሱ
  rationale: በግሪክ ያለውን መጠነኛ አጽንዖት ይጠብቃል፤ በአማርኛም የተስፋው ተቀባዮች እነዚያው የሚያዝኑት መሆናቸውን ያጎላል።
- source_word: παρακληθήσονται
  choice: ይጽናናሉ
  rationale: የወደፊት ጊዜ ተደራጊ ቅርጹን በተፈጥሯዊ አማርኛ ይጠብቃል፤ ማጽናናትን የሚቀበሉ መሆናቸውን ይገልጣል።
theological_decisions:
- issue: የሐዘኑ ወሰንና መንስኤ
  choice: መንስኤውን ሳይገድብ ‘የሚያዝኑ’ ተብሎ በሰፊው ተተርጉሟል።
  alternative: ‘በኃጢአታቸው የሚያዝኑ’ ወይም ‘ስለ እስራኤል ሁኔታ የሚያለቅሱ’ ብሎ ማጥበብ።
  rationale: የግሪኩ ጽሑፍ የሐዘኑን ነገር አይጠቅስም። ስለዚህ የግል ኪሳራን፣ ኃጢአትን፣ ጭቆናን ወይም የመጨረሻውን ዘመን ናፍቆት ብቻ ሳይመርጥ የቃሉን ሥነ መለኮታዊና መጋቢያዊ ስፋት ይጠብቃል።
- issue: የማጽናናቱ ፈጻሚ
  choice: ተደራጊው ‘ይጽናናሉ’ ተጠብቋል።
  alternative: ‘እግዚአብሔር ያጽናናቸዋል’ ብሎ ፈጻሚውን በግልጽ መጨመር።
  rationale: አውዱ መለኮታዊ ፈጻሚን ሊያመለክት ቢችልም የግሪኩ ጽሑፍ ፈጻሚውን በስም አይገልጽም፤ ስለዚህ ተደራጊ ቅርጹ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የተለመደው መጽሐፍ ቅዱሳዊ ‘ብፁዓን’ ከሚለው ይልቅ ወቅታዊና በቀላሉ የሚገባው ‘የተባረኩ ናቸው’ ተመርጧል።
