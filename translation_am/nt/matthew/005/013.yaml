id: MAT.5.13
reference: Matthew 5:13
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ὑμεῖς ἐστε τὸ ἅλας τῆς γῆς· ἐὰν δὲ τὸ ἅλας μωρανθῇ, ἐν τίνι ἁλισθήσεται; εἰς οὐδὲν ἰσχύει ἔτι εἰ μὴ ⸂βληθὲν ἔξω⸃ καταπατεῖσθαι ὑπὸ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/013.yaml
  text: You are the salt of the earth. But if the salt becomes tasteless[a], with what will it be made salty? It is no longer good for anything except to be thrown out and trampled underfoot by men.
translation:
  language: am
  text: እናንተ የምድር ጨው ናችሁ። ጨው ግን ጣዕሙን ቢያጣ፣ በምን እንደገና ጨዋማ ይሆናል? ወደ ውጭ ተጥሎ በሰዎች ከመረገጥ በቀር ከእንግዲህ ለምንም አይጠቅምም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς
  choice: እናንተ
  rationale: ግልጽ ተውላጠ ስሙ በግሪክ አጽንዖት አለው፤ አማርኛውም «እናንተ»ን በግልጽ በማስቀመጥ ይህን ይጠብቃል።
- source_word: τὸ ἅλας τῆς γῆς
  choice: የምድር ጨው
  rationale: γῆ ምድር፣ መሬት ወይም አገር ሊሆን ቢችልም፣ በዚህ ሰፊ ዘይቤ «ምድር» ተፈጥሯዊና ትክክለኛ ነው።
- source_word: μωρανθῇ
  choice: ጣዕሙን ቢያጣ
  rationale: ቃሉ ከ«ሞኝ» ጋር ዝምድና ቢኖረውም፣ ከጨው ጋር ሲውል ጣዕም ማጣትን ያመለክታል።
- source_word: ἐν τίνι ἁλισθήσεται;
  choice: በምን እንደገና ጨዋማ ይሆናል?
  rationale: የወደፊት ጊዜ ተደራጊ ቅርጹ ጨው በምን መንገድ ጨዋማነቱን ሊያገኝ እንደሚችል ይጠይቃል፤ «እንደገና» የአውዱን አንድምታ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: εἰς οὐδὲν ἰσχύει ἔτι
  choice: ከእንግዲህ ለምንም አይጠቅምም
  rationale: ἰσχύω እዚህ ላይ ተግባራዊ ጥቅም ወይም ውጤታማነትን ያመለክታል።
- source_word: εἰ μὴ βληθὲν ἔξω
  choice: ወደ ውጭ ተጥሎ … ከመረገጥ በቀር
  rationale: «ወደ ውጭ» የἔξωን ቦታዊ ኃይል ይጠብቃል፤ የ«ከ…በቀር» አወቃቀርም በአማርኛ ተፈጥሯዊ ነው።
- source_word: καταπατεῖσθαι
  choice: መረገጥ
  rationale: ግሱ በእግር መርገጥን ወይም ረግጦ ማዋረድን ያሳያል፤ አማርኛው በቂ ምስላዊነት አለው።
- source_word: ὑπὸ τῶν ἀνθρώπων
  choice: በሰዎች
  rationale: ἄνθρωποι እዚህ ወንዶችን ብቻ ሳይሆን ሰዎችን በአጠቃላይ ያመለክታል፤ «በሰዎች» ይህንን ትርጉም በቀጥታ ያስተላልፋል።
theological_decisions:
- issue: ὑπὸ τῶν ἀνθρώπων የሚለው አጠቃላይ ሰብአዊ ማመልከቻ
  choice: በሰዎች
  alternative: በወንዶች
  rationale: የግሪኩ ቃል በዚህ አውድ ጾታዊ ገደብ የሌለውን ሰው ሁሉ ያመለክታል። የአማርኛው «ሰዎች» የቃሉን እውነተኛ ወሰን ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የጨው ዘይቤና የጥያቄው ኃይል ተጠብቀዋል።
