id: MAT.5.6
reference: Matthew 5:6
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: μακάριοι οἱ πεινῶντες καὶ διψῶντες τὴν δικαιοσύνην, ὅτι αὐτοὶ χορτασθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/006.yaml
  text: Blessed are those who hunger and thirst for righteousness[a], because they will be filled.
translation:
  language: am
  text: ጽድቅን[a] የሚራቡና የሚጠሙ የተባረኩ ናቸው፤ እነርሱ ይጠግባሉና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ፍትሕን»። የግሪኩ ቃል ጽድቅን፣ ፍትሕን ወይም በእግዚአብሔር ፊት ትክክል የሆነውን ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: የተባረኩ ናቸው
  rationale: የብፅዕናውን የማወጅ እና ሃይማኖታዊ ክብደት ይጠብቃል፤ ከስሜት ሁኔታ ብቻ ጋር ከሚያያዘው «ደስተኞች» ይልቅ ተስማሚ ነው።
- source_word: οἱ πεινῶντες καὶ διψῶντες
  choice: የሚራቡና የሚጠሙ
  rationale: የግሪኩን የአሁን ጊዜ አጋኝ ቅርጽና ቀጣይ ጉጉት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τὴν δικαιοσύνην
  choice: ጽድቅን
  rationale: δικαιοσύνη የግል ቅንነትን፣ በእግዚአብሔር ፊት ትክክል መሆንንና ፍትሐዊ ሥርዓትን ሊያካትት ይችላል። «ጽድቅ» የቃሉን ሃይማኖታዊ ስፋት ይጠብቃል፤ «ፍትሕ» በማስታወሻ ተጠብቋል። ቀጥተኛው ተሳቢ «ጽድቅን» ከ«የሚራቡና የሚጠሙ» ጋር በአማርኛ ተፈጥሯዊ ነው።
- source_word: ὅτι
  choice: ና
  rationale: የብፅዕናውን ምክንያት በተፈጥሯዊ የአማርኛ አንቀጽ መጨረሻ ያሳያል።
- source_word: αὐτοὶ
  choice: እነርሱ
  rationale: በግሪኩ ያለውን አጽንዖት ይጠብቃል፤ ጽድቅን የሚራቡና የሚጠሙት ራሳቸው እንደሚጠግቡ ያሳያል።
- source_word: χορτασθήσονται
  choice: ይጠግባሉ
  rationale: የወደፊት ጊዜ ተስፋውንና የረሃብና የጥማት ምስሉን ይጠብቃል። የግሪኩ ሰዋሰዋዊ ተገብሮ በአማርኛ ተፈጥሯዊ በሆነ ኢ-ተሻጋሪ ግስ ተገልጿል፤ አሟይው ማን እንደሆነ በግልጽ አልተጨመረም።
theological_decisions:
- issue: የδικαιοσύνη ትርጉም
  choice: ጽድቅ
  alternative: ፍትሕ
  rationale: በዚህ አውድ ቃሉ የግልንና የማኅበራዊን ትክክለኛነት ሊያካትት ይችላል። ዋናው ጽሑፍ «ጽድቅ» በማለት ሰፊውን መጽሐፍ ቅዱሳዊ ጥቅም ይጠብቃል፤ «ፍትሕ» የሚለው እውነተኛ አማራጭ በእግር ማስታወሻ ቀርቧል።
- issue: የχορτασθήσονται መለኮታዊ ተገብሮ
  choice: ይጠግባሉ
  alternative: እግዚአብሔር ያጠግባቸዋል
  rationale: የግሪኩ ተገብሮ አሟይውን በስም አይገልጽም። መለኮታዊ ተገብሮ መሆኑ ሊገባ ቢችልም፣ ዋናው ጽሑፍ ያንን በግልጽ በመጨመር የምንጩን አሻሚነት አያስወግድም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። «የተባረኩ» የብፅዕናውን መጽሐፍ ቅዱሳዊ የማወጅ ቃና ይጠብቃል፤ ዐረፍተ ነገሩም የአማርኛን ተፈጥሯዊ ምክንያታዊ አወቃቀር ይከተላል።
