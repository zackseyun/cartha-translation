language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐὰν γὰρ ἀγαπήσητε τοὺς ἀγαπῶντας ὑμᾶς, τίνα μισθὸν ἔχετε; οὐχὶ καὶ οἱ τελῶναι ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/046.yaml
  text: For if you love those who love you[a], what reward do you have? Do not even the tax collectors do the same?
translation:
  language: am
  text: ምክንያቱም፣ የሚወዷችሁን ብትወዱ፣ ምን ሽልማት አላችሁ?[a] ቀረጥ ሰብሳቢዎችስ እንኳ ይህንኑ አያደርጉምን?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ምን ደመወዝ አላችሁ?» የግሪኩ ቃል «ደመወዝ» ወይም «ክፍያ» እንዲሁም «ሽልማት» ማለት ሊሆን ይችላል፤ በዚህ ዐውድ ለድርጊት የሚሰጥ ሽልማት ወይም ተከፋይ ምላሽ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: '... ብትወዱ'
  rationale: ἐάν የሁኔታ አንቀጽን በተፈጥሯዊው የአማርኛ ቅርጽ «ብት-» ያሳያል። γάρ በአማርኛ የሐሳብ ፍሰት ውስጥ በግልጽ አያያዝ ተወክሏል፤ «ምክንያቱም» ማለት ንግግሩን ከባድ ያደርገዋል።
- source_word: ἀγαπήσητε / τοὺς ἀγαπῶντας ὑμᾶς
  choice: የሚወዷችሁን ... ብትወዱ
  rationale: የግሪኩን ተመሳሳይ የἀγαπάω ቃል በሁለቱም ስፍራ «መውደድ» በማለት ጠብቋል። «ብቻ» በዐውደ ንባቡ ያለውን የተመላሽ ፍቅር ንጽጽር በተፈጥሯዊ አማርኛ ግልጽ ያደርጋል።
- source_word: τίνα μισθὸν ἔχετε
  choice: ምን ዋጋ አላችሁ?
  rationale: μισθός ደመወዝን፣ ክፍያን ወይም ዋጋን/ሽልማትን ሊያመለክት ይችላል። «ዋጋ» በኢየሱስ ሥነ ምግባራዊ ትምህርት ዐውድ የሚገኘውን ትርጉም ይገልጻል፤ የገንዘብ ደመወዝ ብቻ እንዳይመስልም ያደርጋል።
- source_word: οὐχὶ καὶ οἱ τελῶναι τὸ αὐτὸ ποιοῦσιν
  choice: ቀረጥ ሰብሳቢዎችስ እንኳ ይህንኑ አያደርጉምን?
  rationale: οὐχί አዎንታዊ መልስ የሚጠብቀውን የአጽንኦት ጥያቄ «አያደርጉምን?» በማለት ያሳያል። καί «እንኳ» ተብሎ የንጽጽሩን አጽንኦት ጠብቋል፤ τελῶναι ደግሞ በግልጽና በተለመደው «ቀረጥ ሰብሳቢዎች» ተተርጉሟል።
theological_decisions:
- issue: በኢየሱስ ሥነ ምግባራዊ ትምህርት ውስጥ የμισθός ትርጉም
  choice: ዋጋ
  alternative: ደመወዝ፣ ክፍያ ወይም ሽልማት
  rationale: «ዋጋ» የድርጊቱን ከእግዚአብሔር የሚገኝ ምላሽ ወይም እውቅና ሊያመለክት የሚችለውን የቃሉን ስፋት ይጠብቃል፤ የግዴታ ደመወዝ ወይም የሰው ብቃት ብቻ የሚያስገኘው ሽልማት የሚል የአስተምህሮ ድምዳሜ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «አያደርጉምን?» የጥንታዊ ግሪኩን አዎንታዊ መልስ የሚጠብቅ የአጽንኦት ጥያቄ በክብር ባለው የመጽሐፍ ቅዱስ አጻጻፍ ያስተላልፋል።
