  rationale: በማቴዎስ የብዙ ቁጥሩ አጠቃቀም ተደጋጋሚ ሲሆን፣ አማርኛው «ሰማያት» ተፈጥሯዊ በመሆኑ የምንጩን ቅርጽ ያለ የእምነት ትርጓሜ ጫና መጠበቅ ይቻላል።
- issue: የሽልማቱ መገኛ
  choice: አገላለጹ ሽልማቱ በሰማያት እንዳለ ያቀርባል።
  alternative: ሐረጉን በሌላ መንገድ በማያያዝ ሽልማቱ ከሰማይ እንደሚመጣ ማብራራት።
  rationale: ἐν የቦታ አመልካች ስለሆነ ትርጉሙ ከምንጩ አይርቅም፤ ጽሑፉ ያልገለጸው ተጨማሪ የአፈጻጸም ሥርዓት አልተጫነበትም።
