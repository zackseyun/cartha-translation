base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/012.yaml
  text: Rejoice and be very glad[a], because your reward is great in the heavens; for in this way they persecuted the prophets who were before you.
translation:
  language: am
  text: ደስ ይበላችሁ፤ እጅግም ተደሰቱ፤ በሰማያት[a] ያለው ሽልማታችሁ ታላቅ ነውና። ከእናንተ በፊት የነበሩትን ነቢያት እንዲሁ አሳደዱአቸውና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ «በሰማይ።» ማቴዎስ ብዙ ጊዜ የብዙ ቁጥሩን «ሰማያት» ይጠቀማል፤ በአማርኛ ግን ነጠላው «ሰማይ» የዚያኑ ሐሳብ ሊገልጽ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρετε
  choice: ደስ ይበላችሁ
  rationale: የብዙ ሰዎችን ቀጣይ የደስታ ምላሽ የሚጠይቀውን የአሁን ጊዜ ትእዛዝ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἀγαλλιᾶσθε
  choice: እጅግም ሐሴት አድርጉ
  rationale: ከχαίρετε የበለጠ ከፍተኛና ግልጽ የደስታ መግለጫን ያሳያል፤ «እጅግ» የግሱን ጥንካሬ ይጠብቃል።
- source_word: μισθὸς
  choice: ሽልማት
  rationale: በስደት ጽናት አውድ ውስጥ ከእግዚአብሔር የሚገኘውን ብድራት በግልጽ አማርኛ ያመለክታል፤ የቅጥር ደመወዝ ትርጉምን አያስገድድም።
- source_word: πολὺς
  choice: ታላቅ
  rationale: የሽልማቱን ብዛትና ክብደት በተፈጥሯዊ አገላለጽ ይገልጣል።
- source_word: ἐν τοῖς οὐρανοῖς
  choice: በሰማያት
  rationale: የግሪኩን ብዙ ቁጥር በቀጥታ ይጠብቃል፤ በአማርኛም የተለመደና ሊገባ የሚችል ነው።
- source_word: οὕτως
  choice: እንዲሁ
  rationale: ደቀ መዛሙርቱ ከሚደርስባቸው ስደት ጋር የነቢያቱን ልምድ በአኳኋን ያነጻጽራል።
- source_word: ἐδίωξαν
  choice: አሳድደዋቸዋል
  rationale: በአውዱ ያለውን የጠላትነት ስደት ትርጉም ይይዛል፤ ያልተገለጸውን የብዙ ቁጥር ፈጻሚም አይሰይምም።
- source_word: προφήτας
  choice: ነቢያት
  rationale: ለእስራኤል ነቢያት የተለመደውና ግልጽ አማርኛ ቃል ነው።
- source_word: τοὺς πρὸ ὑμῶν
  choice: ከእናንተ በፊት የነበሩትን
  rationale: ከደቀ መዛሙርቱ በታሪክ ቀድመው የነበሩትን ነቢያት እንደሚያሻሽል በግልጽ ያሳያል።
theological_decisions:
- issue: «በሰማያት» የሚለው ሐረግ ቁጥርና ትርጉም
  choice: የግሪኩን ብዙ ቁጥር በመጠበቅ «በሰማያት» ተብሏል።
