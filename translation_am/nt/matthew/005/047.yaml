  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ሰላም ብትሉ» የግሪኩን ማኅበራዊ ሰላምታ በተፈጥሯዊ አገላለጽ ያቀርባል፤ «ከተለመደው የላቀ» ደግሞ περισσόν ያለውን ከመደበኛው በላይ የመሆን ሐሳብ ይጠብቃል።
