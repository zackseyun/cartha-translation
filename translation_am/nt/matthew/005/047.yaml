base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/047.yaml
  text: And if you greet only your brothers[c][b][a], what are you doing that is extraordinary? Do not even the Gentiles do the same?
translation:
  language: am
  text: ወንድሞቻችሁን[a] ብቻ ሰላም ብትሉ፣ ከተለመደው የላቀ ምን ታደርጋላችሁ?[b] አሕዛብም[c] ያንኑ አያደርጉምን?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ወንድሞቻችሁንና እህቶቻችሁን»፤ የግሪኩ ቃል «ወንድሞች» ይላል፣ ነገር ግን የራስን ወገን አባላት በሰፊው ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ «ምን የበለጠ ታደርጋላችሁ?»
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ «አረማውያን»።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσησθε
  choice: ሰላም ብትሉ
  rationale: ግሱ ሰውን በሰላምታ መቀበልን ወይም ሰላምታ ማቅረብን ያመለክታል፤ «ሰላም ማለት» በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: ἀδελφοὺς
  choice: ወንድሞቻችሁን
  rationale: የግሪኩን ተባዕታይ ብዙ ቁጥር ቅርጽ በቀጥታ ይጠብቃል፤ ቃሉ የራስን ወገን በሰፊው ሊያመለክት የሚችልበት አጋጣሚ በማስታወሻ ተጠብቋል።
- source_word: μόνον
  choice: ብቻ
  rationale: ድርጊቱ በተወሰነ ወገን ላይ ብቻ መገደቡን በግልጽ ያሳያል።
- source_word: τί περισσὸν ποιεῖτε
  choice: ከተለመደው የላቀ ምን ታደርጋላችሁ?
  rationale: περισσόν ከመደበኛው የሚበልጥ፣ የላቀ ወይም የተለየ ነገርን ያመለክታል፤ ይህ አተረጓጎም የጥያቄውን ሥነ ንግግራዊ ኃይል ይጠብቃል።
- source_word: ἐθνικοὶ
  choice: አሕዛብ
  rationale: በዚህ አይሁዳዊ አውድ ቃሉ አይሁድ ያልሆኑትን ያመለክታል፤ «አሕዛብ» የዘርና የኪዳን አውዱን ያለ አላስፈላጊ ኃይማኖታዊ ፍርድ ይጠብቃል።
- source_word: τὸ αὐτὸ
  choice: እንዲሁ
  rationale: «ያንኑ ማድረግ» የሚለውን ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: የἀδελφοὺς ወሰን
  choice: በዋናው ጽሑፍ «ወንድሞቻችሁን» ተብሎ ተተርጉሟል።
  alternative: «ወንድሞቻችሁንና እህቶቻችሁን» ወይም «የገዛ ወገኖቻችሁን»
  rationale: የግሪኩ ቅርጽ ተባዕታይ ብዙ ቁጥር ቢሆንም፣ በአውዱ የራስን ቡድን ወይም ወገን በሰፊው ሊያመለክት ይችላል። ዋናው ጽሑፍ ቅርጹን ሲጠብቅ ሰፊው አማራጭ በማስታወሻ ተገልጿል።
- issue: የἐθνικοὶ ትርጉም
  choice: «አሕዛብ»
  alternative: «አረማውያን» ወይም «ሕዝቦች»
  rationale: በአውዱ ዋናው ማመልከቻ አይሁድ ያልሆኑ ሰዎች ነው። «አረማውያን» ከግሪኩ ይልቅ ጠንካራ አሉታዊ ኃይማኖታዊ ስሜት ሊጨምር ስለሚችል «አሕዛብ» ተመርጧል።
