    text: ወይም፦ “ሴትን በወሲባዊ ምኞት የሚመለከት ሁሉ።”
    reason: lexical_alternative
  - marker: b
    text: የግሪኩ γυνή የሚለው ቃል እንደ ዐውዱ “ሴት” ወይም “ሚስት” ማለት ሊሆን ይችላል።
    reason: lexical_alternative
