  text: እኔ ግን እላችኋለሁ፤ ሴትን ለመመኘት ብሎ የሚመለከት ሁሉ፣ በልቡ ከእሷ ጋር አስቀድሞ አመንዝሯል[a][b][c]።
  philosophy: optimal-equivalence
  footnotes:
