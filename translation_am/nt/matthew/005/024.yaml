base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/024.yaml
  text: leave your gift there before the altar[a], and go; first be reconciled to your brother[b], and then come and offer your gift.
translation:
  language: am
  text: ስጦታህን በዚያ በመሠዊያው ፊት ትተህ ሂድ፤ አስቀድመህ ከወንድምህ ጋር ታረቅ[a]፤ ከዚያም መጥተህ ስጦታህን አቅርብ።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከወንድምህ ጋር እርቅ ፍጠር።”
    reason: lexical_alternative
  - marker: b
    text: “ወንድም” ተብሎ የተተረጎመው የግሪክ ቃል ተባዕታይ ነጠላ ነው፤ በዐውዱ ግን የዕርቅ መርሁ ከዚህ የሰፋ ተግባራዊነት ሊኖረው ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφες
  choice: ትተህ
  rationale: በዚህ ዐውደ ንባብ ስጦታውን ባለበት ማስቀመጥን ያመለክታል፤ ከ«ሂድ» ጋር ተያይዞ በአማርኛ ተፈጥሯዊ የትእዛዝ ቅደም ተከተል ይፈጥራል።
- source_word: ἐκεῖ
  choice: በዚያ
  rationale: ስጦታው በማቅረቢያው ስፍራ እንዲቀር የሚያሳየውን የቦታ አጽንዖት ይጠብቃል።
- source_word: τὸ δῶρόν σου
  choice: ስጦታህን
  rationale: δῶρον ለእግዚአብሔር የሚቀርብ ስጦታ ወይም መባ ሊያመለክት ይችላል፤ «ስጦታ» የቃሉን ሰፊ የትርጉም ወሰን ይጠብቃል፣ የመሠዊያው ዐውድም ሃይማኖታዊ መባ መሆኑን ያሳያል።
- source_word: ἔμπροσθεν τοῦ θυσιαστηρίου
  choice: በመሠዊያው ፊት
  rationale: የቦታውን ግንኙነት በቀጥታና በተለመደ አማርኛ ይገልጣል።
- source_word: ὕπαγε
  choice: ሂድ
  rationale: አጭርና ተፈጥሯዊ የእንቅስቃሴ ትእዛዝ ነው።
- source_word: πρῶτον
  choice: አስቀድመህ
  rationale: ከስጦታው መቅረብ በፊት እርቅ ቅድሚያ እንዳለው ያስገነዝባል።
- source_word: διαλλάγηθι
  choice: ታረቅ
  rationale: የግሪኩ ተገብሮአዊ ትእዛዝ ወደ ዕርቅ ሁኔታ መግባትን ያመለክታል፤ «ታረቅ» በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: τῷ ἀδελφῷ σου
  choice: ከወንድምህ ጋር
  rationale: ከδιαλλάγηθι ጋር ያለውን ዳቲቭ በተፈጥሯዊ የአማርኛ የጋራ ግንኙነት አገላለጽ ይተረጉማል፤ «ወንድም» የግሪኩን ተባዕታይ ነጠላ ቅርጽ ይጠብቃል።
- source_word: τότε
  choice: ከዚያም
  rationale: ከእርቁ በኋላ የሚከተለውን ጊዜያዊ ቅደም ተከተል ያሳያል።
- source_word: ἐλθὼν
  choice: ተመልሰህ መጥተህ
  rationale: ወደ መሠዊያው የሚደረገውን መመለስ በአማርኛ ግልጽ ያደርጋል፤ «ተመልሰህ» በዐውዱ የተገኘ ማብራሪያ እንጂ ራሱን የቻለ ትምህርታዊ ጭማሪ አይደለም።
- source_word: πρόσφερε
  choice: አቅርብ
  rationale: በመሠዊያ ዐውድ መባን ወይም ስጦታን ለእግዚአብሔር ማቅረብን የሚገልጽ መደበኛ ቃል ነው።
theological_decisions:
- issue: διαλλάγηθι እና የግንኙነቱ አቅጣጫ
  choice: ከወንድምህ ጋር ታረቅ
  alternative: ለወንድምህ ታረቅ
  rationale: የግሪኩ ዳቲቭ በቃል ቅርብ ሁኔታ «ለወንድምህ» ሊቀርብ ቢችልም፣ አማርኛ «ከ…ጋር ታረቅ» የጋራ ዕርቅን በተፈጥሯዊ ሁኔታ ይገልጣል፤ የግሪኩን ተገብሮአዊ ጉልበትም ወደ አንድ ወገን ብቻ አያዞርም።
- issue: ἀδελφός በግለሰባዊ ሥነ ምግባር ዐውድ
  choice: ወንድምህ
  alternative: ወንድምህ ወይም እኅትህ / ባልንጀራህ
  rationale: የግሪኩ ቃል ተባዕታይ ነጠላ ነው፤ ዋናው ጽሑፍ ይህን ቅርጽ ይጠብቃል። ሆኖም የዕርቅ መርሁ በዐውዱ ሰፋ ያለ ተግባራዊነት ሊኖረው እንደሚችል በማስታወሻ ተገልጿል።
