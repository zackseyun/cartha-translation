  text: ἴσθι εὐνοῶν τῷ ἀντιδίκῳ σου ταχὺ ἕως ὅτου εἶ ⸂μετ’ αὐτοῦ ἐν τῇ ὁδῷ⸃, μήποτέ σε παραδῷ ὁ ἀντίδικος τῷ κριτῇ, καὶ ὁ ⸀κριτὴς τῷ ὑπηρέτῃ, καὶ εἰς φυλακὴν βληθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/025.yaml
  text: Be well-disposed toward your accuser quickly[a], while you are with him on the way, lest your accuser hand you over to the judge, and the judge to the officer, and you be thrown into prison.
translation:
  language: am
  text: ከከሳሽህ ጋር በመንገድ ላይ ሳለህ፣ ፈጥነህ ለእርሱ በጎ ዝንባሌ አሳይ፤[a] አለዚያ ከሳሽህ ለዳኛው አሳልፎ እንዳይሰጥህ፣ ዳኛውም ለፍርድ ቤት አገልጋይ አሳልፎ እንዳይሰጥህ፣ ወደ ወኅኒም እንዳትጣል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ በዚህ የሕግ አውድ ይበልጥ ፈሊጣዊ በሆነ አገላለጽ፣ “ፈጥነህ ከከሳሽህ ጋር እርቅ ፍጠር።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴσθι εὐνοῶν
  choice: በበጎ ሁኔታ ተስማማው
  rationale: εὐνοέω የበጎ አመለካከትን ዋና ፍቺ ይይዛል፤ በዚህ የሕግ አውድ ግን ተግባራዊ ዕርቅንም ያመለክታል። ይህ አተረጓጎም ሁለቱንም ገጽታዎች በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἀντιδίκῳ / ἀντίδικος
  choice: ከሳሽህ
  rationale: ዳኛ፣ የፍርድ ቤት አገልጋይና ወኅኒ የሚሉት ቃላት የሕግ አውድን ስለሚያሳዩ፣ ከሳሽ የቃሉን ፍርዳዊ ሚና በግልጽ ያስተላልፋል።
- source_word: ταχὺ
  choice: ፈጥነህ
  rationale: የትእዛዙን አስቸኳይነት በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: ἕως ὅτου εἶ μετ’ αὐτοῦ ἐν τῇ ὁδῷ
  choice: ከከሳሽህ ጋር በመንገድ ላይ ሳለህ
  rationale: የመንገዱን ተጨባጭ ምስል ይጠብቃል፤ ‘ወደ ፍርድ ቤት’ የሚለውን በአውዱ የሚገመት ነገር በጽሑፉ ላይ አይጨምርም።
- source_word: μήποτέ
  choice: አለዚያ
  rationale: የማስጠንቀቂያውን ኃይል በግልጽና በዘመናዊ አማርኛ ያቀርባል።
- source_word: παραδῷ
  choice: አሳልፎ ይሰጥህ
  rationale: በፍርድ ሂደት አንድን ሰው ለባለሥልጣን የማስረከብን ሐሳብ ያስተላልፋል።
- source_word: κριτῇ / κριτὴς
  choice: ዳኛ
  rationale: በዚህ የሕግ አውድ የተለመደና ግልጽ ትርጉም ነው።
- source_word: ὑπηρέτῃ
  choice: የፍርድ ቤት አገልጋይ
  rationale: በዳኛው ሥር ሆኖ ትእዛዙን የሚፈጽመውን ባለሥልጣን ያመለክታል፤ ከባህል ጋር የተገደበ የሥራ ማዕረግ አያስገባም።
- source_word: εἰς φυλακὴν
  choice: ወደ ወኅኒ
  rationale: የእስር ቦታን በክቡርና በተለመደ የመጽሐፍ ቅዱስ አማርኛ ይገልጻል።
- source_word: βληθήσῃ
  choice: ትጣላለህ
  rationale: የβάλλωን ጠንካራና ሕያው ምስል ከለሰለሰ ‘ትገባለህ’ ይልቅ ይጠብቃል።
theological_decisions:
- issue: የመክፈቻው ትእዛዝ የበጎ አመለካከትን ብቻ ይገልጽ ወይስ በሕግ አውድ ዕርቅ መፍጠርን ያመልክት?
  choice: በበጎ ሁኔታ ተስማማው
  alternative: በበጎ አመለካከት ተመልከተው / ፈጥነህ ከከሳሽህ ጋር እርቅ ፍጠር
  rationale: የግሪኩ ቃል በጎ ዝንባሌን ይገልጻል፤ የፍርድ አውዱ ግን ይህ ዝንባሌ ወደ ስምምነት እንደሚያመራ ያመለክታል። ዋናው ጽሑፍ ሁለቱን ያጣምራል፣ ማስታወሻውም ይበልጥ ፈሊጣዊውን አማራጭ ያሳያል።
