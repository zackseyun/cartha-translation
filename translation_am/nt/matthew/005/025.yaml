  register: ዘመናዊ፣ ግልጽና ክቡር አማርኛ ተጠቅሟል። ‘ወኅኒ’ የተለመደ መጽሐፍ ቅዱሳዊ ክብደትን ሲጠብቅ፣ የቀረው ሐረግ ለዘመናዊ አንባቢ ቀጥተኛና ተፈጥሯዊ ሆኖ ተቀርጿል።
