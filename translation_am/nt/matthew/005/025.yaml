    rationale: ‘ተስማማው’ states that the parties should reach an agreement, while the Greek wording more directly commands a favorable disposition. The legal-settlement reading remains suitable as a footnote alternative.
  - severity: medium
    issue: The judicial-transfer warning is syntactically compressed and potentially ambiguous.
    rationale: In the draft, both the accuser and judge precede one ‘አሳልፎ ይሰጥህ,’ which obscures the successive transfers expressed in Greek. Repeating the handover clause clearly represents each agent and preserves the warning structure.
