review_pass:
  verdict: revise
  source_fidelity: The main choice «ክፉውን ሰው» responsibly reflects the personal-generic reading of τῷ πονηρῷ, and footnote a preserves the viable abstract and personal-specific alternatives. However, the example in Greek shifts to singular (σε, αὐτῷ), while the draft retains plural second-person forms. The rendering «አዙራችሁ ስጡት» also adds “give/offer,” which is not expressed by στρέψον.
  naturalness: The opening is natural modern standard Amharic. A singular generic formulation after the plural audience address is both natural and closer to the Greek. «በቀኝ ጉንጭህ ላይ ጥፊ ቢመታህ» clearly and idiomatically conveys a slap on the right cheek. «ወደ እርሱ አዙር» retains the image of turning without adding an offer/give nuance.
  terminology: «አትቃወሙ» suitably preserves the broad force of μὴ ἀντιστῆναι. «ጥፊ መምታት» appropriately conveys ῥαπίζει in this cheek-striking context. The explicit repetition «ጉንጭ» in the final clause is a safe clarification of the understood τὴν ἄλλην.
  issues:
  - severity: medium
    issue: The illustrative conditional and command use plural second-person forms.
    rationale: Greek has singular σε (“you”) and στρέψον (“turn,” singular) in the generic example, following the plural audience address. The Amharic should preserve this shift where natural.
  - severity: medium
    issue: «አዙራችሁ ስጡት» introduces an additional ‘give/offer’ action.
    rationale: στρέψον means “turn”; αὐτῷ identifies the person toward whom it is turned. The added «ስጡት» narrows and expands the wording beyond the source.
  - severity: low
    issue: Footnote b does not reflect the singular imperative of the source.
    rationale: Its wording should be updated along with the corrected singular main text.
