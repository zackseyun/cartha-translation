  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ἀντιστῆναι τῷ πονηρῷ· ἀλλ’ ὅστις σε ⸀ῥαπίζει ⸀εἰς τὴν δεξιὰν ⸀σιαγόνα, στρέψον αὐτῷ καὶ τὴν ἄλλην·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/039.yaml
  text: But I say to you[a], do not resist the evil person. Instead, if anyone slaps you on the right cheek[b], turn the other to him as well.
translation:
  language: am
  text: እኔ ግን እላችኋለሁ፤ ክፉውን ሰው አትቃወሙ[a]። ይልቁንም፣ ማንም በቀኝ ጉንጭህ ላይ ጥፊ ቢመታህ፣ ሌላውንም ጉንጭ ወደ እርሱ አዙር[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ክፋትን አትቃወሙ»፤ አለዚያም፣ «ክፉውን አትቃወሙ»።
    reason: alternative_reading
  - marker: b
    text: ቃል በቃል፣ «ሌላውንም ወደ እርሱ አዙር»።
    reason: literal_rendering
lexical_decisions:
- source_word: μὴ ἀντιστῆναι
  choice: አትቃወሙ
  rationale: ἀνθίστημι ራስን በተቃራኒ ማቆም ወይም መቃወምን ያመለክታል። «አትቃወሙ» ትርጉሙን ለሕጋዊ ተቃውሞ ወይም ለበቀል ብቻ ሳያጠብ ቀጥተኛውን ኃይል ይጠብቃል።
- source_word: τῷ πονηρῷ
  choice: ክፉውን ሰው
  rationale: በግሪክ አገባቡ «ክፉ ነገርን/ክፋትን»፣ «ክፉውን ሰው» ወይም «ክፉውን» ሊያመለክት ይችላል። ቀጥሎ ያለው የሚመታ ሰው ምሳሌ የሰው አመልካችነቱን ስለሚደግፍ «ክፉውን ሰው» ተመርጧል፤ ሌሎቹ አማራጮች በማስታወሻ ተጠብቀዋል።
- source_word: ῥαπίζει
  choice: ቢመታ
  rationale: ῥαπίζω በእጅ መምታትን፣ በተለይም ጥፊ መምታትን ያመለክታል። «ጉንጫችሁን ቢመታ» በአማርኛ ተፈጥሯዊ ሲሆን የጥፊው ሐሳብ ከጉንጫ አውዱ ግልጽ ነው።
- source_word: εἰς τὴν δεξιὰν σιαγόνα
  choice: ቀኝ ጉንጫችሁን
  rationale: σιαγών «መንጋጋ» ወይም «ጉንጭ» ሊሆን ይችላል፤ በመምታት አውድ «ጉንጭ» ተፈጥሯዊና ግልጽ ነው።
- source_word: στρέψον αὐτῷ καὶ τὴν ἄλλην
  choice: ሌላውንም ጉንጫ አዙራችሁ ስጡት
  rationale: στρέφω በቀጥታ «ማዞር» ማለት ነው። በአማርኛ «አዙራችሁ ስጡት» የማዞሩን ምስል ይጠብቃል፣ αὐτῷ የሚያመለክተውንም ተቀባይ ተፈጥሯዊ ያደርጋል።
- source_word: ὅστις
  choice: ማንም … ቢ-
  rationale: ይህ አወቃቀር የὅστιςን ያልተወሰነና ሁኔታዊ ኃይል በዘመናዊ አማርኛ ተፈጥሯዊ ሁኔታ ያቀርባል።
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: እኔ ግን እላችኋለሁ
  rationale: «ግን» የδέን ንጽጽራዊ ኃይል ይጠብቃል፤ «እኔ» የተገለጸውን ተውላጠ ስም አጽንዖት ያሳያል።
theological_decisions:
- issue: የτῷ πονηρῷ ትርጉም
  choice: ሰዋዊና አጠቃላይ፦ «ክፉውን ሰው»
  alternative: ረቂቅ፦ «ክፋትን»፤ ወይም የተወሰነ ግለሰባዊ አመልካች፦ «ክፉውን»
  rationale: ሐረጉ በሰዋስው አሻሚ ነው። ወዲያው የሚከተለው ምሳሌ ጥቃት የሚፈጽምን ሰው ስለሚጠቅስ ዋናው ጽሑፍ «ክፉውን ሰው» ይላል፤ ነገር ግን አሻሚነቱ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የብዙ ቁጥር አድራሻ («እላችኋለሁ»፣ «ጉንጫችሁን») የግሪኩን ὑμῖν/σε በአማርኛ ለጉባኤ የሚደረግ ንግግር ተፈጥሯዊነት በማስቀደም ያቀርባል፤ «ሌላውንም ጉንጫ» ለግልጽነት የተደገመ ነው።
