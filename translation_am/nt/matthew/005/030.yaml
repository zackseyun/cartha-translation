base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/030.yaml
  text: And if your right hand causes you to stumble[a], cut it off and throw it away[c][b]. For it is better for you that one of your members should perish than that your whole body should go into Gehenna.
translation:
  language: am
  text: ቀኝ እጅህም ቢያሰናክልህ፣[a] ቁረጠውና ከአንተ አርቀህ ጣለው። ከአካል ክፍሎችህ አንዱ ቢጠፋ፣ መላ ሰውነትህ ወደ ገሃነም[b] ከሚሄድ ይሻልሃልና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ኃጢአት እንድትሠራ ቢያደርግህ።” የግሪኩ ግስ ቃል በቃል “እንድትሰናከል ቢያደርግህ” ማለት ነው።
    reason: lexical_alternative
