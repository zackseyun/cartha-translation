theological_decisions:
- issue: የγέεννα አተረጓጎም
  choice: ገሃነም
  alternative: ሲኦል / ጌሄና
  rationale: ‘ገሃነም’ ከግሪኩ γέεννα ጋር በታሪክ የተያያዘና በዘመናዊ አማርኛ የሚታወቅ ነው። ‘ሲኦል’ የተለየ የመጽሐፍ ቅዱስ ቃልን ሊያስተላልፍ ስለሚችል አልተመረጠም፤ የቃሉ ታሪካዊ ዳራ በማስታወሻ ተገልጿል።
- issue: የσκανδαλίζει ዘይቤ
  choice: ቢያሰናክልህ
  alternative: ኃጢአት እንድትሠራ ቢያደርግህ
  rationale: የግሪኩን የመሰናከል ምስል ይጠብቃል፤ በዐውዱ ያለው የኃጢአት ትርጉም በማስታወሻ ተብራርቷል።
