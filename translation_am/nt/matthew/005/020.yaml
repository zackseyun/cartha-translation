review_pass:
  verdict: revise
  source_fidelity: The draft conveys the necessary negative condition, the comparison with the righteousness of the scribes and Pharisees, the emphatic exclusion, and Matthew’s distinctive “kingdom of heaven.” However, its conditional wording is syntactically compressed and less clear than it should be in modern standard Amharic.
  naturalness: The phrase “ጽድቃችሁ … ጽድቅ ካልበለጠ” is awkward because the subject and comparative construction are insufficiently explicit. Placing the introductory “እላችኋለሁና” after the full conditional assertion also gives the sentence a less natural flow. A fronted direct-speech formula and an explicit predicate for the comparative condition improve readability.
  terminology: “ጽድቅ,” “ጸሐፍት,” “ፈሪሳውያን,” and “የሰማያት መንግሥት” are appropriate. The lexical-alternative footnote appropriately preserves “ፍትሕ” without displacing the contextually preferable “ጽድቅ.”
  issues:
  - severity: medium
    issue: The comparative conditional clause is grammatically and stylistically compressed.
    rationale: In “ጽድቃችሁ ከጸሐፍትና ከፈሪሳውያን ጽድቅ ካልበለጠ,” the construction leaves the comparison less smoothly expressed in Amharic. “ከ… ጽድቅ የላቀ ካልሆነ” explicitly and naturally states that the readers’ righteousness must surpass that of the two groups.
  - severity: low
    issue: The placement of the explanatory speech formula is less natural.
    rationale: Beginning with “እንዲህ እላችኋለሁና፤” better represents λέγω γὰρ ὑμῖν and lets the conditional statement conclude with the emphatic consequence.
