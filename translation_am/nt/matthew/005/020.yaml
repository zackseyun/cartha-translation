    text: ወይም፣ “ፍትሓችሁ።” የግሪኩ ቃል ጽድቅንም ፍትሕንም ሊያመለክት ይችላል፤ በማቴዎስ 5 ዐውደ ንባብ ግን “ጽድቅ” ይበልጥ ይስማማል።
