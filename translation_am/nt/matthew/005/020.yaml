- source_word: οὐ μὴ εἰσέλθητε
  choice: ፈጽሞ እንደማትገቡ
  rationale: οὐ μή ያለውን ጠንካራ አሉታዊ አጽንዖት ‘ፈጽሞ’ ይጠብቃል፤ ተያያዥ ንግግሩም ከ‘እላችኋለሁ’ ጋር ተፈጥሯዊ ነው።
- source_word: βασιλείαν τῶν οὐρανῶν
