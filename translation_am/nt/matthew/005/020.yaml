  rationale: በንጽጽሩ ውስጥ በመጠን ወይም በጥራት የላቀ መሆንን በግልጽ ያሳያል።
- source_word: ὑμῶν ἡ δικαιοσύνη
  choice: ጽድቃችሁ
  rationale: δικαιοσύνη በዚህ ዐውደ ንባብ ትክክለኛ ኑሮንና ከእግዚአብሔር ፈቃድ ጋር የሚስማማ ምግባርን የሚያካትት ሲሆን፣ ‘ጽድቅ’ ይህን በተለመደና ሥነ መለኮታዊ ጭነቱን በማያጠብ መንገድ ይገልጣል።
- source_word: πλεῖον τῶν γραμματέων καὶ Φαρισαίων
  choice: ከጸሐፍትና ከፈሪሳውያን ጽድቅ
