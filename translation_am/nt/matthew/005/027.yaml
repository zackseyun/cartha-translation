    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκούσατε
  choice: ሰምታችኋል
  rationale: የግሪኩ የአንድ ጊዜ ያለፈ ድርጊት ቅርጽ ቢሆንም፣ በዚህ ተደጋጋሚ የንግግር መግቢያ ውስጥ አድማጮቹ ቀድሞ ሰምተው አሁንም የሚያውቁትን ትምህርት ያመለክታል፤ ስለዚህ “ሰምታችኋል” ተፈጥሯዊና ትክክለኛ ነው።
- source_word: ὅτι ἐρρέθη
  choice: እንደተባለ
  rationale: ὅτι የተሰማውን ይዘት ያስገባል፤ ἐρρέθη ደግሞ ድርጊት ፈጻሚውን ሳይጠቅስ “ተባለ” የሚል ተገብሮ ቅርጽ ነው። ሁለቱን “እንደተባለ” ብሎ መተርጎም በአማርኛ ተፈጥሯዊ ነው።
- source_word: Οὐ μοιχεύσεις
  choice: አታመንዝር
  rationale: የወደፊት አመልካች ቅርጹ እዚህ ክልከላን ይገልጣል፤ “አታመንዝር” የትእዛዙን አጭርና ሕጋዊ ቅርጽ ጠብቆ የጋብቻ ታማኝነትን የሚጥስ ዝሙትን በትክክል ይጠቁማል።
theological_decisions:
- issue: ከአሥርቱ ትእዛዛት ጥቅስ ጋር ያለው ግንኙነት
  choice: “አታመንዝር” የሚለውን የተለመደ አጭር የትእዛዝ ቅርጽ መጠቀም
  alternative: “ዝሙት አትፈጽም”
  rationale: ኢየሱስ በአሥርቱ ትእዛዛት የሚታወቀውን ክልከላ ይጠቅሳል። “አታመንዝር” ቀጥተኛውን የትእዛዝ ቅርጽና የመጽሐፍ ቅዱስ ውስጣዊ ትስስር ይጠብቃል፣ ተጨማሪ ሥነ መለኮታዊ ትርጓሜም አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ አማርኛ ተጠቅሟል። የጥቅሱን ክብደት ለመጠበቅ “አታመንዝር” የሚለው አጭር የትእዛዝ ቅርጽ ተመርጧል።
