id: MAT.5.34
reference: Matthew 5:34
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ὀμόσαι ὅλως· μήτε ἐν τῷ οὐρανῷ, ὅτι θρόνος ἐστὶν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/034.yaml
  text: 'But I say to you, do not swear at all: neither by heaven, because it is the throne of God;'
translation:
  language: am
  text: እኔ ግን እላችኋለሁ፤ ፈጽሞ አትማሉ፤ በሰማይም አትማሉ፤ ምክንያቱም ሰማይ የእግዚአብሔር ዙፋን ነው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: እኔ ግን እላችኋለሁ
  rationale: የንጽጽር አጽንዖቱንና ለብዙ አድማጮች የተነገረውን ሁለተኛ መደብ ብዙ ቁጥር ይጠብቃል።
- source_word: μὴ ὀμόσαι ὅλως
  choice: ፈጽሞ አትማሉ
  rationale: ὅλως የሚያሳየውን ፍጹም ክልከላ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: μήτε ἐν τῷ οὐρανῷ
  choice: በሰማይም አትማሉ
  rationale: ἐν በመሐላ አውድ ‘በ’ ተብሎ ይተረጎማል፤ ግሱን መድገም በአማርኛ ዓረፍተ ነገሩን ግልጽ ያደርገዋል።
- source_word: ὅτι θρόνος ἐστὶν τοῦ θεοῦ
  choice: ምክንያቱም ሰማይ የእግዚአብሔር ዙፋን ነው
  rationale: ὅτιን እንደ ምክንያት ይገልጻል፤ በግሪክኛው የተገነዘበውን የ‘ሰማይ’ ተሳቢ ለአማርኛ ግልጽነት ይደግማል።
theological_decisions:
- issue: የመሐላው ክልከላ ወሰን
  choice: ‘ፈጽሞ አትማሉ’ የሚለውን ያልተገደበ አገላለጽ መጠበቅ
  alternative: ክልከላውን ለውሸት ወይም ለተራ መሐላ ብቻ መገደብ
  rationale: ጥቅሱ ራሱ ὅλως በማለት ሰፊ ክልከላ ያቀርባል፤ የአተረጓጎም ገደብ ወደ ጽሑፉ አልተጨመረም።
- issue: ሰማይና የእግዚአብሔር ዙፋን
  choice: ‘ሰማይ የእግዚአብሔር ዙፋን ነው’ ብሎ ቀጥተኛውን ምሳሌያዊ አገላለጽ መጠበቅ
  alternative: ‘እግዚአብሔር የሚኖርበት ቦታ’ ብሎ ማብራራት
  rationale: θρόνος የሚለውን ምስል ሳይፈታ የምንጩን ቃልና ሥነ-መለኮታዊ ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘አትማሉ’ በብዙ ቁጥር የቀረበ ሲሆን የግሪክኛውን የአድማጮች ቁጥር ይጠብቃል።
