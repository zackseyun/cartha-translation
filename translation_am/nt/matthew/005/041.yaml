  text: And whoever forces you to go one mile[c][b][a], go with him two miles.
translation:
  language: am
  text: ደግሞ፣ ማንም አንድ ማይል እንድትሄድ ቢያስገድድህ[a]፣ ከእርሱ ጋር ሁለት ማይል ሂድ[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «በግድ እንድታገለግል ቢያደርግህ» ተብሎም ሊተረጎም ይችላል። ግሱ በባለሥልጣን ትእዛዝ ለአገልግሎት መገደድን ሊያመለክት ይችላል፤ ምናልባትም በሮም ዘመን የነበረውን የግዳጅ አገልግሎት ያስታውሳል።
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ «አንድ ማይል … ሁለት»፤ በሁለተኛው ሐረግ «ማይል» የሚለው በሐሳብ ይገባል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: ማንም
  rationale: ያልተወሰነ አጠቃላይ ሁኔታን ያመለክታል፤ «ማንም» በዘመናዊ አማርኛ ተፈጥሯዊና ሰፊ አገላለጽ ነው።
- source_word: ἀγγαρεύσει
  choice: እንድትሄድ ቢያስገድድህ
  rationale: ግሱ በሥልጣን ወይም በግድ አገልግሎት ላይ ማሰማራትን ያመለክታል። ከርቀት መግለጫው ጋር ተያይዞ የመሄድን እንቅስቃሴ በግልጽ አማርኛ ያሳያል።
- source_word: μίλιον ἕν
  choice: አንድ ማይል
  rationale: የሮምን ማይል የሚያመለክተውን ተጨባጭ የርቀት መለኪያ ሳይተረጉም በቀጥታ ያቆያል።
- source_word: ὕπαγε
  choice: ሂድ
  rationale: ቀጥተኛውን የትእዛዝ አኳኋን በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: μετ’ αὐτοῦ
  choice: ከእርሱ ጋር
  rationale: አብሮ መሄድን በቀጥታና በግልጽ ያሳያል።
- source_word: δύο
  choice: ሁለት ማይል
  rationale: በግሪክኛው «ማይል» በሁለተኛው ሐረግ በሐሳብ ቢገባም አልተደገመም፤ በአማርኛ ለተፈጥሯዊነትና ለግልጽነት የተገባው ስም ተደግሟል።
theological_decisions:
- issue: በሥልጣን የሚፈጸም የግዳጅ አገልግሎት ታሪካዊና ማኅበራዊ ዳራ
  choice: ንግግሩን ለግዳጅ ጥያቄ እንደሚሰጥ ምላሽ መተርጎም፣ ነገር ግን በዋናው ጽሑፍ የሮም ወታደሮችን በስም አለመጥቀስ
  alternative: የሮም ወታደራዊ የግዳጅ አገልግሎት ብሎ በግልጽ መተርጎም
  rationale: ግሱና «ማይል» የሚለው መለኪያ የሮምን ዘመን የግዳጅ አገልግሎት በጽኑ ያስታውሳሉ፤ ሆኖም የግሪክኛው ጽሑፍ ወታደሮችን በግልጽ አይጠቅስም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪክኛው ሁለተኛ ነጠላ ወንድ ቅርጽ በቀጥታ ተጠብቋል፤ የግዳጅ ስሜቱ ግልጽ ሲሆን ያልተጠቀሰ የሮም ወታደር ወደ ዋናው ጽሑፍ አልገባም።
