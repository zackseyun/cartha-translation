  text: μήτε ἐν τῇ κεφαλῇ σου ὀμόσῃς, ὅτι οὐ δύνασαι μίαν τρίχα λευκὴν ⸂ποιῆσαι ἢ μέλαιναν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/036.yaml
  text: Nor shall you swear by your head[a], because you are not able to make one hair white or black.
translation:
  language: am
  text: በራስህም አትማል፤ አንድ ጠጉር ነጭ ወይም ጥቁር ማድረግ አትችልምና።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “አንድ ጠጉር እንኳ ነጭ ወይም ጥቁር ማድረግ አትችልም።”
    reason: μίαν የሚያጎላውን ኃይል “እንኳ” በማለት በግልጽ የሚያቀርብ የትርጉም አማራጭ።
lexical_decisions:
- source_word: μήτε
  choice: በ…ም አት…
  rationale: ከቀደሙት ክልከላዎች ጋር የተቀናጀውን አሉታዊ ተከታታይነት በተፈጥሯዊ የአማርኛ አገባብ ያሳያል።
- source_word: ἐν τῇ κεφαλῇ σου
  choice: በራስህ
  rationale: ከመማል ግስ ጋር ሲያያዝ ራስን የመሐላ ማረጋገጫ አድርጎ መጥራትን ያመለክታል።
- source_word: ὀμόσῃς
  choice: አትማል
  rationale: የግሪኩን ቀጥተኛ ክልከላ በዘመናዊና ግልጽ አማርኛ ያቀርባል።
- source_word: ὅτι
  choice: …ና
  rationale: የክልከላውን ምክንያት በተፈጥሯዊ የአማርኛ ምክንያታዊ ቅጥያ ያሳያል።
- source_word: οὐ δύνασαι
  choice: አትችልም
  rationale: በጽሑፉ የተገለጠውን የሰው አለመቻል በቀጥታና በግልጽ ይገልጣል።
- source_word: μίαν τρίχα
  choice: አንዲትን ጠጉር
  rationale: μίαν የሚያጎላውን አንድነት ጠብቆ፣ እጅግ ትንሽ ነገርን እንኳ ሰው በሥልጣኑ መለወጥ እንደማይችል ያሳያል።
- source_word: λευκὴν … ἢ μέλαιναν
  choice: ነጭ ወይም ጥቁር
  rationale: የምንጩን መሠረታዊ የቀለም ንፅፅር ያለ ትርጓሜያዊ ማለስለስ ይጠብቃል።
- source_word: ποιῆσαι
  choice: ማድረግ
  rationale: አንድን ነገር በተጠቀሰው ሁኔታ እንዲሆን ማድረግን በቀጥታ ይገልጣል።
theological_decisions:
- issue: በመሐላ ላይ የተሰጠው ክልከላ ወሰን
  choice: ንግግሩን በራስ መማልን እንደሚከለክል ቀጥተኛ ትእዛዝ አቅርብ።
  alternative: በሁሉም ሁኔታ ማንኛውንም መሐላ እንደሚከለክል ማስፋት፣ ወይም የተንኮል መሐላ ቀመሮችን ብቻ እንደሚኮንን መገደብ።
  rationale: ቁጥሩ ራሱ በራስ መማልን በተለይ ይጠቅሳል፤ ምክንያቱንም በሰው አለመቻልና በፍጡርነት ውስንነት ላይ ያደርጋል። ትርጉሙ ከጽሑፉ በላይ ያለውን ሰፊ የሥነ መለኮት ክርክር አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ። “አትማል” የቀጥተኛውን ክልከላ ይጠብቃል፤ “በራስህም” ደግሞ ከአውዱ ጋር ያለውን ቅንጅት ያሳያል።
