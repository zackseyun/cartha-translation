  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν, ἀγαπᾶτε τοὺς ἐχθροὺς ⸀ὑμῶν καὶ προσεύχεσθε ὑπὲρ ⸀τῶν διωκόντων ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/044.yaml
  text: But I say to you[a], love your enemies and pray for those who persecute you.
translation:
  language: am
  text: እኔ ግን እላችኋለሁ፤ ጠላቶቻችሁን ውደዱ፤ ስለሚያሳድዷችሁም ጸልዩ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ለሚያሳድዷችሁ ጸልዩ።»
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: እኔ ግን እላችኋለሁ
  rationale: ἐγώ የሚሰጠውን አጽንዖትና δέ የሚያሳየውን ንጽጽራዊ ሽግግር ይጠብቃል፤ በዘመናዊ አማርኛም ተፈጥሯዊና ክቡር አገላለጽ ነው።
- source_word: ἀγαπᾶτε
  choice: ውደዱ
  rationale: የትእዛዝ ኃይሉን በቀጥታ ያስተላልፋል፤ ድርጊቱን ከጽሑፉ በላይ በመዘርዘር አይተረጉምም።
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: ጠላቶቻችሁን
  rationale: የግንኙነት ጥላቻን የያዘውን ἐχθρός በቀጥታና በተለመደ አማርኛ ያቀርባል።
- source_word: προσεύχεσθε
  choice: ጸልዩ
  rationale: የግሪኩን የትእዛዝ ቅርጽ በቀጥታ የሚያስተላልፍ መደበኛ አማርኛ ነው።
- source_word: ὑπὲρ
  choice: ስለ
  rationale: በዚህ አውድ ለሰዎቹ ጥቅም ወይም በእነርሱ ፈንታ መጸለይን ሊያመለክት ይችላል፤ «ስለ» በዋናው ጽሑፍ ተፈጥሯዊ ሲሆን ሙሉ አገባቡን አይገድብም።
- source_word: τῶν διωκόντων ὑμᾶς
  choice: የሚያሳድዷችሁ
  rationale: የተሳቢ የአሁን ጊዜ አሳታፊውን የቀጣይ ወይም የተደጋጋሚ ስደት ስሜት በተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: ለጠላቶች የተሰጠው ትእዛዝ ወሰን
  choice: ሁለቱንም ትእዛዞች—መውደድንና መጸለይን—ያለ ትርጓሜያዊ ማስፋፊያ በቀጥታ ማቅረብ
  alternative: «መውደድ»ን የበጎ ድርጊት ብቻ እንደሆነ መግለጽ፣ ወይም ጸሎቱ ለበረከት ወይም ለንስሐ መሆኑን መጨመር
  rationale: ጥቅሱ ጠላቶችን መውደድና ስለ አሳዳጆች መጸለይን ያዛል፤ ነገር ግን ሁሉንም ተግባራዊ ትርጉሞቹን ወይም የጸሎቱን የተወሰነ ይዘት አይገልጽም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር መደበኛ አማርኛ ተጠቅሟል። የንጽጽሩ አጽንዖት በ«እኔ ግን» ተጠብቋል፤ አጭር የትእዛዝ ቅርጾቹም የግሪኩን ቀጥተኛ ኃይል ያስተላልፋሉ።
