id: MAT.5.10
reference: Matthew 5:10
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: μακάριοι οἱ δεδιωγμένοι ἕνεκεν δικαιοσύνης, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/010.yaml
  text: Blessed are those who have been persecuted because of righteousness[a], for theirs is the kingdom of heaven.
translation:
  language: am
  text: ስለ ጽድቅ[a] የተሰደዱ ብፁዓን ናቸው፤ የሰማያት መንግሥት የእነርሱ ናትና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ስለ ፍትሕ።” የግሪክኛው ቃል የሞራል ትክክለኛነትንም ሆነ ከቃል ኪዳን ጋር የተያያዘ ትርጉምን ሊይዝ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: ብፁዓን ናቸው
  rationale: የብፅዕና ንግግሩን እንደ የቃል ኪዳን እና የእግዚአብሔር ሞገስ መግለጫ ያቆያል፤ ከስሜታዊው ‘ደስተኞች’ የተሻለ ነው።
- source_word: οἱ δεδιωγμένοι
  choice: የተሰደዱ
  rationale: በግሪክኛው ያለውን ተገብሮአዊ ፍጹም አንቀጽ እና ከድርጊቱ የተገኘውን የአሁን ሁኔታ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἕνεκεν
  choice: ስለ
  rationale: የስደቱን ምክንያት ‘በ… ምክንያት’ በሚል ትርጉም በአጭሩና በተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: δικαιοσύνης
  choice: ጽድቅ
  rationale: የግሪክኛውን የሞራል፣ የቃል ኪዳን እና ከእግዚአብሔር ፈቃድ ጋር የመስማማት ሰፊ የትርጉም ክልል የሚይዝ መደበኛ መጽሐፍ ቅዱሳዊ ቃል ነው።
- source_word: ὅτι
  choice: ና
  rationale: የብፅዕናውን ምክንያት በተፈጥሯዊ የአማርኛ ምክንያታዊ አያያዥ ያስተዋውቃል።
- source_word: αὐτῶν
  choice: የእነርሱ
  rationale: አጽንዖታዊውን የባለቤትነት ሐሳብ ግልጽ አድርጎ ያቀርባል።
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: የሰማያት መንግሥት
  rationale: የማቴዎስን ባሕርያዊ አገላለጽና የግሪክኛውን ብዙ ቁጥር ‘ሰማያት’ በቀጥታ ያቆያል።
theological_decisions:
- issue: የ δικαιοσύνη አተረጓጎም
  choice: ጽድቅ
  alternative: ፍትሕ
  rationale: በዚህ ዐውድ ቃሉ ከእግዚአብሔር ፈቃድ ጋር የተስማማ ሕይወትንና ትክክለኛ ምግባርን በሰፊው ሊያመለክት ስለሚችል ‘ጽድቅ’ በዋናው ጽሑፍ ተመርጧል፤ ‘ፍትሕ’ የሚለው ትርጉም ግን እውነተኛ የቃሉ ገጽታ በመሆኑ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። ‘ብፁዓን’ እና ‘የሰማያት መንግሥት’ የተለመደውን መጽሐፍ ቅዱሳዊ ክብር ሲጠብቁ፣ የዓረፍተ ነገሩ አወቃቀር ግን ተፈጥሯዊ እንዲሆን ተደርጓል።
