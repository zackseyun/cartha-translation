language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ τῷ θέλοντί σοι κριθῆναι καὶ τὸν χιτῶνά σου λαβεῖν, ἄφες αὐτῷ καὶ τὸ ἱμάτιον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/040.yaml
  text: And to the one who wants to sue you and take your tunic[b][a], let him have your cloak also.
translation:
  language: am
  text: ደግሞ ሊከስስህ[a]ና የውስጥ ልብስህን ሊወስድ ለሚፈልግ ሰው፣ ካባህንም ጭምር ተውለት።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወደ ፍርድ ቤት ሊወስድህ።” የግሪኩ ቃል በቀጥታ በሕግ ፊት መዳኘትን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: “የውስጥ ልብስ” ከሰውነት አጠገብ የሚለበሰውን፣ “ካባ” ደግሞ በላዩ ላይ የሚደረበውን የውጭ ልብስ ያመለክታሉ።
    reason: cultural_note
lexical_decisions:
- source_word: τῷ θέλοντί
  choice: ለሚፈልግ ሰው
  rationale: መስተዋድዱንና በአንቀጽ የተጠቀሰውን የአሁን ጊዜ አሳቢ አጠቃላይ ሰውን እንደሚያመለክት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: σοι κριθῆναι
  choice: ሊከስስህ
  rationale: ቃሉ በቀጥታ በሕግ ፊት መዳኘትን ወይም ወደ ፍርድ መሄድን ያመለክታል፤ ከልብሱን ለመውሰድ ከተገለጸው ዓላማ ጋር ‘ሊከስስህ’ የሕጋዊ ክርክሩን ሁኔታ በአጭሩ ያሳያል።
- source_word: χιτῶνά
  choice: የውስጥ ልብስ
  rationale: ከሰውነት አጠገብ የሚለበሰውን ልብስ በግልጽ ያመለክታል፤ ከἱμάτιον ጋር ያለውን ልዩነትም ይጠብቃል።
- source_word: λαβεῖν
  choice: ሊወስድ
  rationale: በሕጋዊው አውድ ንብረቱን መውሰድን ወይም በእጅ ማስገባትን ቀጥተኛና ተፈጥሯዊ በሆነ አማርኛ ይገልጣል።
- source_word: ἄφες
  choice: ተውለት
  rationale: የትእዛዝ ኃይሉን ጠብቆ ሌላው ሰው እንዲወስደው መፍቀድን ወይም ለእርሱ መልቀቅን በተፈጥሯዊ አገላለጽ ያስተላልፋል።
- source_word: ἱμάτιον
  choice: ካባ
  rationale: ከውስጥ ልብስ በላይ የሚደረበውን የውጭ ልብስ የሚያመለክት ሲሆን የሁለቱን ልብሶች ንፅፅር ይጠብቃል።
- source_word: καὶ ... καὶ
  choice: ደግሞ ... ም ጭምር
  rationale: የመጀመሪያውን καί ከቀደመው ንግግር ጋር እንደሚያያዝ ያሳያል፤ ሁለተኛውም የውጭ ልብሱን በተጨማሪ መልቀቅን ጎላ አድርጎ ያቀርባል።
theological_decisions:
- issue: በሕጋዊ ክርክር ውስጥ የኢየሱስ ትእዛዝ ሥነ ምግባራዊ ኃይል
  choice: የበቀል እርምጃን ትቶ ከተጠየቀው በላይ እንኳ ለመልቀቅ የሚያዝ ቀጥተኛና ከባድ ትእዛዝ እንደሆነ ማቅረብ
  alternative: መብትን ስለመተው እንደ አጠቃላይ ምሳሌ ብቻ ማለስለስ
  rationale: ἄφες የሚለው ቀጥተኛ ትእዛዝና የሁለቱ ልብሶች ተጨባጭ ምስል የትምህርቱን ጥልቅ ጥሪ ያሳያሉ። ትርጉሙ ይህን ኃይል ሳያለሰልስና የተለየ የእምነት ሥርዓት ሳይጭን ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘የውስጥ ልብስ’ እና ‘ካባ’ የጥንቱን የልብስ ልዩነት ያለ አስፈላጊ ጥንታዊ ቃላት ይገልጣሉ።
