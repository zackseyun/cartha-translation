id: MAT.5.26
reference: Matthew 5:26
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἀμὴν λέγω σοι, οὐ μὴ ἐξέλθῃς ἐκεῖθεν ἕως ἂν ἀποδῷς τὸν ἔσχατον κοδράντην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/026.yaml
  text: Truly I tell you[b][a], you will certainly not get out of there until you have paid the last quadrans.
translation:
  language: am
  text: እውነት እልሃለሁ፤ የመጨረሻውን ቆድራንጤስ[a] እስክትከፍል ድረስ ከዚያ ፈጽሞ አትወጣም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቆድራንጤስ አነስተኛ ዋጋ የነበረው የሮማውያን ሳንቲም ነበር።
    reason: cultural_note
lexical_decisions:
- source_word: ἀμὴν
  choice: እውነት
  rationale: በወንጌላት ውስጥ የሚገኘውን ክቡድና ሥልጣናዊ ማረጋገጫ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል፤ ቃሉን ‘አሜን’ ብሎ መተው እዚህ ያለውን አገልግሎቱን ለሁሉም አንባቢ ግልጽ አያደርግም።
- source_word: λέγω σοι
  choice: እልሃለሁ
  rationale: ቀጥተኛውን የነጠላ ወንድ አድራሻና የንግግሩን ሥልጣናዊነት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: οὐ μὴ ἐξέλθῃς
  choice: ፈጽሞ አትወጣም
  rationale: οὐ μή ከአኦሪስት ሳብጃንክቲቭ ጋር የሚሰጠውን ጠንካራ እምቢታ ‘ፈጽሞ’ በማለት ያሳያል።
- source_word: ἐκεῖθεν
  choice: ከዚያ
  rationale: ከተጠቀሰው ስፍራ ወደ ውጭ መንቀሳቀስን በአጭርና ተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἕως ἂν ἀποδῷς
  choice: እስክትከፍል ድረስ
  rationale: የቀደመው ሁኔታ የሚያበቃበትን የወደፊት ወሰን ይጠብቃል፤ በዕዳና በእስር ምስል ውስጥ ‘መክፈል’ ተፈጥሯዊ ነው።
- source_word: τὸν ἔσχατον
  choice: የመጨረሻውን
  rationale: የሚከፈለው መጠን ሙሉ በሙሉ እስኪያልቅ ድረስ የሚለውን የመጨረሻነት ሐሳብ ይጠብቃል።
- source_word: κοδράντην
  choice: ቊድራንጤስ
  rationale: የተወሰነውን የሮማውያን ሳንቲም ስም በድምፅ ቅርበት ያቆያል፤ በዘመናዊ ገንዘብ ስም መተካት የታሪክ አውዱንና ዋጋውን ሊያሳስት ይችላል።
theological_decisions:
- issue: ንግግሩ የመጨረሻ ፍርድን፣ ከሞት በኋላ መንጻትን ወይም ተራ የሕግና የእስር ሁኔታን እንደሚያመለክት በትርጉሙ መወሰን
  choice: የዕዳ ክፍያና የእስር ምስሉን ብቻ መጠበቅ
  alternative: እንደ መለኮታዊ ፍርድ ወይም እንደ ድኅረ ሞት መንጻት በግልጽ መተርጎም
  rationale: የግሪኩ ጽሑፍ ሰውየው ዕዳውን ሙሉ በሙሉ እስኪከፍል እንደማይወጣ ይናገራል፤ ከዚያ በላይ የሆነውን የትርጓሜ ወይም የዶክትሪን ድምዳሜ በትርጉሙ ላይ አይጭንም።
- issue: ‘እስክትከፍል ድረስ’ የሚለው በመጨረሻ መክፈልና መውጣት እንደሚቻል ያረጋግጥ እንደሆነ
  choice: የጊዜ ወሰኑን ማቆየት ነገር ግን ክፍያው በእርግጥ እንደሚፈጸም አለማከል
  alternative: ‘በመጨረሻ ከፍለህ ትወጣለህ’ በሚል መተርጎም
  rationale: ἕως ἄν የሁኔታውን ወሰን ይገልጻል፣ ነገር ግን ክፍያው በእርግጥ እንደሚፈጸም በራሱ አያረጋግጥም።
translation_notes:
  register: ዘመናዊ፣ ክቡድና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የነጠላ ወንድ አድራሻው ‘እልሃለሁ/እስክትከፍል/አትወጣም’ በሚሉት ቅርጾች ተጠብቋል። የግሪኩ ἐκεῖθεν በ‘ከዚያ’ በቀጥታ ስለተወከለ የእንግሊዝኛው ‘of there/from there’ ልዩነት በአማርኛ ተጨማሪ ማስታወሻ አያስፈልገውም።
