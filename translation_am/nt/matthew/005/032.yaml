  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘መፍታት፣ ዝሙት፣ ማመንዘር’ የሚሉት ቃላት በመጽሐፍ ቅዱሳዊ ንባብ የታወቁ ሲሆኑ አሁንም ሊገቡ የሚችሉ ናቸው።
