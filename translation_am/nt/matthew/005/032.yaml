  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι ⸂πᾶς ὁ ἀπολύων⸃ τὴν γυναῖκα αὐτοῦ παρεκτὸς λόγου πορνείας ποιεῖ αὐτὴν ⸀μοιχευθῆναι, καὶ ὃς ἐὰν ἀπολελυμένην γαμήσῃ μοιχᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/032.yaml
  text: But I say to you that everyone who divorces his wife[a], except on the ground of sexual immorality, makes her commit adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: am
  text: እኔ ግን እላችኋለሁ፤ ከዝሙት[a] ጉዳይ በቀር ሚስቱን የሚፈታ ሁሉ እሷን አመንዝራ እንድትሆን ያደርጋታል[b]፤ የተፈታች ሴትንም የሚያገባ ያመነዝራል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ዝሙት” የግሪኩን πορνεία (ፖርኔያ) ይተረጉማል፤ ይህም ሕገወጥ የሆነን ወሲባዊ ምግባር በሰፊው የሚያመለክት ቃል ነው።
    reason: lexical_alternative
  - marker: b
    text: የግሪኩ μοιχευθῆναι በቅርጹ ተደራጊ የግስ ስም ነው፤ ስለዚህ “አመንዝራ እንድትሆን” የሚለው አገላለጽ የቅርጹን ውጤታዊ ልዩነት ያሳያል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύων / ἀπολελυμένην
  choice: የሚፈታ / የተፈታች
  rationale: ቃሉ በአጠቃላይ ‘መልቀቅ’ ወይም ‘መስደድ’ ሊል ቢችልም፣ በዚህ የትዳር አውድ ‘መፍታት’ ማለትም ፍቺ መፈጸምን ያመለክታል። በሁለቱም ስፍራ ተመሳሳይ ሥር መጠቀሙ የግሪኩን ትስስር ይጠብቃል።
- source_word: γυναῖκα
  choice: ሚስቱን
  rationale: γυνή ‘ሴት’ ወይም ‘ሚስት’ ሊሆን ይችላል፤ የባለቤትነት ተውላጠ ስም αὐτοῦ እና የፍቺው አውድ ‘ሚስቱን’ የሚለውን ያስፈልጋሉ።
- source_word: παρεκτὸς λόγου πορνείας
  choice: ከዝሙት ምክንያት በቀር
  rationale: παρεκτός ልዩ ሁኔታን ያሳያል፤ λόγου እዚህ ‘ምክንያት/ጉዳይ’ ማለት ነው። ‘ዝሙት’ የπορνείαን ሰፊ የሕገወጥ ወሲባዊ ምግባር ትርጉም ይይዛል።
- source_word: ποιεῖ αὐτὴν μοιχευθῆναι
  choice: እሷን አመንዝራ እንድትሆን ያደርጋታል
  rationale: ποιέω ከግስ ስም ጋር ‘እንዲሆን ማድረግ’ የሚል አስደራጊ ኃይል አለው። μοιχευθῆναι በቅርጹ ተደራጊ ስለሆነ፣ ‘ዝሙት እንድትፈጽም’ ከማለት ይልቅ ‘አመንዝራ እንድትሆን’ የሚለው ውጤታዊና ተደራጊውን ልዩነት በተሻለ ይጠብቃል።
- source_word: ὃς ἐὰν ... γαμήσῃ
  choice: የሚያገባ
  rationale: ከἐάν ጋር ያለው አንጻራዊ ሐረግ አጠቃላይና ያልተወሰነ ሁኔታን ይገልጣል፤ በአማርኛ ‘የሚያገባ’ በተፈጥሮ ይህን ያስተላልፋል።
- source_word: μοιχᾶται
  choice: ያመነዝራል
  rationale: ይህ በአማርኛ የጋብቻ ታማኝነትን መጣስ የሚያመለክተው ቀጥተኛና አጭር አገላለጽ ነው።
- source_word: πᾶς ὁ ἀπολύων
  choice: የሚፈታ ሁሉ
  rationale: የግሪኩን አጠቃላይ ኃይል ይጠብቃል፤ ወንድ የሚሆነው ማኅበራዊ አውድም ‘ሚስቱን’ በሚለው ቃል ግልጽ ነው።
theological_decisions:
- issue: የπαρεκτὸς λόγου πορνείας ልዩ ሁኔታ ወሰን
  choice: እንደ እውነተኛ ልዩ ሁኔታ ‘ከዝሙት ምክንያት በቀር’ ተብሎ ተተርጉሟል።
  alternative: ‘ከዝሙት ጉዳይ በቀር’ ወይም ይህን ሕገወጥ ጋብቻ ብቻ እንደሚያመለክት ማቅረብ።
  rationale: ግሪኩ ልዩ ሁኔታን በግልጽ ያቀርባል፤ ነገር ግን πορνεία በትክክል የሚያካትተውን ከጽሑፉ በላይ ማጥበብ የለበትም። ይህ የሥነ መለኮት ውጥረቱን ሳይፈታ የጽሑፉን ኃይል ያቆያል።
- issue: ከποιεῖ በኋላ ያለው የμοιχευθῆναι ተደራጊ ቅርጽ
  choice: ‘አመንዝራ እንድትሆን ያደርጋታል’ ተብሎ ተተርጉሟል።
  alternative: ‘ዝሙት እንድትፈጽም ያደርጋታል’ ወይም ‘በእሷ ላይ ዝሙት እንዲፈጸም ያደርጋል።’
  rationale: የግሪኩ ግስ ስም በቅርጹ ተደራጊ ነው። የተመረጠው አገላለጽ የምክንያትና የውጤት ግንኙነቱን ያሳያል፣ ተደራጊውንም ልዩነት ከንቁ አገላለጽ ይልቅ በተሻለ ይጠብቃል፤ ሌላው የትርጓሜ አማራጭ በማስታወሻ ተጠብቋል።
