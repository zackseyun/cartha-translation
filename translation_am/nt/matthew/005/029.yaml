  text: εἰ δὲ ὁ ὀφθαλμός σου ὁ δεξιὸς σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου βληθῇ εἰς γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/029.yaml
  text: But if your right eye causes you to stumble[a], tear it out and throw it away from you[b]. For it is better for you that one of your members should perish than that your whole body should be thrown into Gehenna.
translation:
  language: am
  text: ነገር ግን ቀኝ ዓይንህ እንድትሰናከል የሚያደርግህ ከሆነ[a]፣ አውጥተህ ከአንተ አርቀህ ጣለው። ከሰውነትህ ክፍሎች አንዱ ቢጠፋ ይሻልሃልና፤ ሰውነትህ በሙሉ ወደ ገሃነም[b] ከሚጣል ይልቅ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “ኃጢአት እንድትሠራ የሚያደርግህ።”
    reason: lexical_alternative
  - marker: b
    text: “ገሃነም” ከሂኖም ሸለቆ ስም የመጣ ቃል ነው።
    reason: historical_term
lexical_decisions:
- source_word: σκανδαλίζει
  choice: እንድትሰናከል የሚያደርግህ
  rationale: የግሪኩን የመሰናከል ምስል ጠብቆ በዘመናዊ አማርኛ በተፈጥሮ ይገልጸዋል፤ በዐውዱ ኃጢአትን ማድረግ ማለት መሆኑ በማስታወሻ ተጠቅሷል።
- source_word: ἔξελε
  choice: አውጥተህ
  rationale: ዓይንን ከቦታው የማውጣትን ኃይለኛ ትእዛዝ በግልጽና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: βάλε ἀπὸ σοῦ
  choice: ከአንተ ራቅ አድርገህ ጣለው
  rationale: βάλε ያለውን የመጣል ኃይልና ἀπὸ σοῦ ያለውን ከራስ የማራቅ ሐሳብ ሁለቱንም ይጠብቃል።
- source_word: συμφέρει
  choice: ይሻልሃል
  rationale: ጥቅምንና ንጽጽራዊ ብልጫን በአጭርና ተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἀπόληται
  choice: ቢጠፋ
  rationale: የአንድ የሰውነት ክፍል መጥፋትን በክብደት ይገልጻል፤ የጥፋቱን ባሕርይ ከጽሑፉ በላይ አይወስንም።
- source_word: μέλος
  choice: የሰውነት ክፍል
  rationale: ዓይንን ጨምሮ ማንኛውንም የአካል ክፍል የሚያካትት ግልጽ ዘመናዊ አገላለጽ ነው።
- source_word: βληθῇ
  choice: ከሚጣል
  rationale: የβάλλωን ተገብሮአዊ እና ኃይለኛ ትርጉም በቀጥታ ይጠብቃል።
- source_word: γέενναν
  choice: ገሃነም
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የግሪኩን γέεννα ልዩ ስም የሚወክል የተለመደ ቃል ነው፤ ከአጠቃላዩ 'ሲኦል' ጋር አልተቀላቀለም።
- source_word: ὁ δεξιὸς
  choice: ቀኝ
  rationale: በምንጩ ያለውን የቀኝ ዓይን ዝርዝር በቀጥታ ይጠብቃል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከቀደመው ንግግር ጋር ያለውን መጠነኛ ተቃርኖና ቀጣይነት ያሳያል።
theological_decisions:
- issue: የγέεννα አተረጓጎም
  choice: ገሃነም
  alternative: ሲኦል / የእሳት ፍርድ ስፍራ
  rationale: ‘ገሃነም’ ከሂኖም ሸለቆ ስም የመጣውን ልዩ ቃል በአማርኛ ቅርጹ ይጠብቃል፤ ወደ ሰፊ ወይም ከጊዜ በኋላ ወደተደነገገ ዶክትሪናዊ ትርጉም አያጠቃልለውም።
- issue: የσκανδαλίζω ዘይቤያዊ ኃይል
  choice: እንድትሰናከል የሚያደርግህ
  alternative: ኃጢአት እንድትሠራ የሚያደርግህ
  rationale: ዋናው ጽሑፍ የግሪኩን የመሰናከል ዘይቤ ይጠብቃል፤ ዐውዳዊው የኃጢአት ትርጉም ግን እንደ አማራጭ በማስታወሻ ቀርቧል።
- issue: የንግግሩ ኃይለኛ ምስል
  choice: የዓይንን ማውጣትና መጣል በቀጥታ ማቅረብ
  alternative: አስቸጋሪውን ምስል ማለዘብ
  rationale: ጽሑፉ የሚያቀርበው ግልጽና ኃይለኛ ምስል ሳይለዘብ ተጠብቋል፤ ትርጉሙ ይህን በዶክትሪናዊ ማብራሪያ አይተካውም።
