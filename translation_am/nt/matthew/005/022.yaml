  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ ὀργιζόμενος τῷ ἀδελφῷ ⸀αὐτοῦ ἔνοχος ἔσται τῇ κρίσει· ὃς δ’ ἂν εἴπῃ τῷ ἀδελφῷ αὐτοῦ· Ῥακά, ἔνοχος ἔσται τῷ συνεδρίῳ· ὃς δ’ ἂν εἴπῃ· Μωρέ, ἔνοχος ἔσται εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/022.yaml
  text: But I say to you that everyone who is angry with his brother will be liable to the judgment[a]; and whoever says to his brother, ‘Raca,’ will be liable to the council; and whoever says[e][d][c][b], ‘Fool,’ will be liable to the Gehenna of fire.
translation:
  language: am
  text: እኔ ግን እላችኋለሁ፤ በወንድሙ[d] ላይ የሚቆጣ ሁሉ ለፍርድ ተጠያቂ ይሆናል፤[a] ለወንድሙ፣ ‘ራቃ!’[b] የሚል ሁሉ በሸንጎው[c] ፊት ተጠያቂ ይሆናል፤ ደግሞም፣ ‘አንተ ሞኝ!’ የሚል ሁሉ ወደ የእሳት ገሃነም[e] ተጠያቂ ይሆናል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች “በወንድሙ ላይ ያለ ምክንያት የሚቆጣ” የሚል ይጨምራሉ። ቀደምትና በጠንካራ ማስረጃ የተደገፈው ንባብ ግን “ያለ ምክንያት” የሚለውን አያካትትም።
    reason: textual_variant
  - marker: b
    text: “ራቃ” የአራማይክ የንቀት ቃል ሲሆን፣ በግምት “ባዶ ራስ” ወይም “የማይረባ” ማለት ነው።
    reason: cultural_note
  - marker: c
    text: ወይም “በሳንሄድሪን ፊት”፤ ይህም የአይሁድ የበላይ ገዥ ሸንጎ ነው።
    reason: alternative_reading
  - marker: d
    text: “ወንድም” ተብሎ የተተረጎመው ቃል ተባዕታይ ነጠላ ቅርጽ ቢኖረውም ሌሎችንም ወክሎ ሊሠራ ይችላል፤ ትምህርቱ በወንድ ወንድም ብቻ አይወሰንም።
    reason: lexical_alternative
  - marker: e
    text: “ገሃነም” ከሂኖም ሸለቆ ምስል የመጣውንና ከፍርድ ጋር የተያያዘውን ልዩ ቃል ይጠብቃል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: እኔ ግን እላችኋለሁ
  rationale: ἐγώ ያለውን አጽንዖትና δέ ያለውን ንጽጽር በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: πᾶς ὁ ὀργιζόμενος τῷ ἀδελφῷ αὐτοῦ
  choice: በወንድሙ ላይ የሚቆጣ ሁሉ
  rationale: የአሁን ጊዜ አሳታፊውን አጠቃላይ ባሕርይ ያስቀምጣል፤ የዳቲቭ ግንኙነቱም በአማርኛ ‘በ…ላይ’ ተፈጥሯዊ ነው።
- source_word: ἔνοχος ἔσται
  choice: ተጠያቂ ይሆናል
  rationale: በሦስቱም ማስጠንቀቂያዎች ያለውን ሕጋዊ ተጠያቂነትና ለቅጣት መጋለጥ ያሳያል።
- source_word: τῇ κρίσει
  choice: ለፍርድ
  rationale: ቃሉ ፍርድን ወይም የፍርድ ሂደትን ሊያመለክት የሚችለውን ክፍትነት ይጠብቃል፤ የአካባቢ ፍርድ ቤት ነው ብሎ አይወስንም።
- source_word: Ῥακά
  choice: ራቃ
  rationale: በግሪክ ጽሑፍ የተጠበቀውን የአራማይክ የንቀት ቃል በድምፅ ቅርበት ያቀርባል፤ ትርጉሙ በማስታወሻ ተገልጿል።
- source_word: τῷ συνεδρίῳ
  choice: በሸንጎው ፊት
  rationale: συνέδριον የሚለውን ‘ምክር ቤት/ሸንጎ’ ትርጉም በተፈጥሯዊ ሕጋዊ አማርኛ ያቀርባል፤ በተለይ ሳንሄድሪንን ያመለክታል የሚለው አማራጭ በማስታወሻ ቀርቧል።
- source_word: Μωρέ
  choice: አንተ ሞኝ
  rationale: የጥሪ ቅርጹንና ቀጥተኛ ስድቡን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: εἰς τὴν γέενναν τοῦ πυρός
  choice: ለእሳት ገሃነም
  rationale: γέεννα ያለውን ታሪካዊና ሥነ መለኮታዊ ምስል ‘ገሃነም’ በሚለው የተለመደ የአማርኛ ቅርጽ ይጠብቃል፤ τοῦ πυρός ደግሞ ‘የእሳት’ በሚል ተጠብቋል።
theological_decisions:
- issue: γέεννα አተረጓጎም
  choice: ገሃነም
  alternative: ሲኦል / የእሳት ሲኦል
  rationale: ‘ገሃነም’ ከሂኖም ሸለቆ የመጣውን ልዩ ቃልና የፍርድ ምስሉን ይጠብቃል፤ ‘ሲኦል’ ግን ከመቃብር/የሙታን ዓለም ቃል ጋር ሊያደባልቅ ይችላል።
- issue: ἀδελφός የጾታና የወካይነት አጠቃቀም
  choice: ወንድሙ
  alternative: ወንድሙን ወይም እኅቱን / ሌላውን ሰው
  rationale: የግሪኩን ተባዕታይ ነጠላ ቅርጽ በዋናው ጽሑፍ ይጠብቃል፤ ትምህርቱ ግን በወንድ ዘመድ ብቻ እንደማይወሰን በማስታወሻ ተብራርቷል።
- issue: የቁጣው የጽሑፍ ልዩነት
  choice: ያለ ‘ያለ ምክንያት’
  alternative: ያለ ምክንያት የሚቆጣ
  rationale: SBLGNT እና ቀደምት ጠንካራ ምስክርነት ‘ያለ ምክንያት’ የሚለውን አያካትቱም፤ ልዩነቱ በማስታወሻ ተጠቅሷል።
