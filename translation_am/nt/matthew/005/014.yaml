review_pass:
  verdict: revise
  source_fidelity: 'The first sentence accurately preserves the explicit plural address, direct metaphor, and genitive relation: «እናንተ የዓለም ብርሃን ናችሁ።» The second sentence retains the impossibility, city, elevated location, and the participial idea of a city situated there. However, «ልትሰወር» can suggest that the city hides itself rather than expressing the passive «be hidden» of κρυβῆναι.'
  naturalness: «የተቀመጠች» is understandable, but «የምትገኝ» is more idiomatic modern standard Amharic for a city located on a mountain. «ልትደበቅ አትችልም» naturally expresses that such a city cannot be hidden.
  terminology: «ዓለም», «ብርሃን», «ከተማ», and «ተራራ» are appropriate standard terms. Rendering ὄρος as «ተራራ» is defensible and preserves the source's broader hill/mountain sense without doctrinal or interpretive addition.
  issues:
  - severity: medium
    issue: The verb «ልትሰወር» is not the clearest passive rendering of κρυβῆναι.
    rationale: The Greek infinitive is passive, ‘to be hidden.’ Replacing it with «ልትደበቅ» clearly conveys the passive sense in natural Amharic.
  - severity: low
    issue: «የተቀመጠች» is slightly less idiomatic for a city's topographical location.
    rationale: «የምትገኝ» directly and naturally renders κειμένη (‘lying/situated’) without adding the more specific notion of being built or deliberately placed.
  revised_text: እናንተ የዓለም ብርሃን ናችሁ። በተራራ ላይ የምትገኝ ከተማ ልትደበቅ አትችልም።
