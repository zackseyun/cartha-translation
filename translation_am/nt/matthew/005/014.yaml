  rationale: The revision makes the passive force of κρυβῆναι explicit and uses a more natural Amharic expression for κειμένη, while retaining the source text's direct metaphor, plural address, and mountain/hill ambiguity at the level permitted by «ተራራ». No footnote is required because the revised wording does not introduce a material alternative needing explanation.
