id: MAT.5.14
reference: Matthew 5:14
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ὑμεῖς ἐστε τὸ φῶς τοῦ κόσμου. οὐ δύναται πόλις κρυβῆναι ἐπάνω ὄρους κειμένη·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/014.yaml
  text: You are the light of the world[a]. A city set on a hill cannot be hidden.
translation:
  language: am
  text: እናንተ የዓለም ብርሃን ናችሁ። በተራራ ላይ የምትገኝ ከተማ ልትደበቅ አትችልም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς
  choice: እናንተ
  rationale: በግሪክ የተገለጸውንና አጽንዖት ያለውን የሁለተኛ መደብ ብዙ ቁጥር ተውላጠ ስም በቀጥታ ያስተላልፋል።
- source_word: τὸ φῶς
  choice: ብርሃን
  rationale: የብርሃንን ቀጥተኛ ዘይቤ በተፈጥሯዊ አማርኛ ይጠብቃል፤ የግሪኩ መስተዋድድ ከ«የዓለም» ጋር ባለው የተወሰነ የስም ሐረግ በቂ ሁኔታ ተንጸባርቋል።
- source_word: τοῦ κόσμου
  choice: የዓለም
  rationale: የግሪኩን የባለቤትነት አገባብ በቅርብ ይከተላል፣ «ለዓለም» በማለትም የዓላማ ትርጉም አይጨምርም።
- source_word: οὐ δύναται
  choice: አትችልም
  rationale: አለመቻልን በተፈጥሯዊና አጭር የአማርኛ አገላለጽ ያስተላልፋል።
- source_word: πόλις
  choice: ከተማ
  rationale: የπόλις መደበኛና በዚህ ምሳሌያዊ ንግግር ተገቢ የአማርኛ አቻ ነው።
- source_word: κρυβῆναι
  choice: ልትሰወር
  rationale: የግሪኩን የተደራጊ ቅርጽና የመደበቅ ሐሳብ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐπάνω ὄρους
  choice: በተራራ ላይ
  rationale: ὄροςን «ተራራ» ብሎ በቀጥታ በመተርጎም የከፍታውን ስፍራ ያለ ማቅለል ይጠብቃል።
- source_word: κειμένη
  choice: የተቀመጠች
  rationale: «የምትገኝ/የተዘረጋች» የሚለውን ሁኔታ በከተማ ላይ በተለመደና ግልጽ አማርኛ ያቀርባል።
theological_decisions:
- issue: ደቀ መዛሙርቱ ከብርሃን ጋር በቀጥታ መለየታቸው
  choice: «እናንተ የዓለም ብርሃን ናችሁ» የሚለው ቀጥተኛ ዘይቤ ተጠብቋል።
  alternative: «እናንተ ለዓለም ብርሃን ናችሁ»
  rationale: የምንጩን የቀጥታ መለያ አነጋገር ይጠብቃል፤ «ለዓለም» በማለት የተግባር ወይም የዓላማ ትርጓሜ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ὄρος በዋናው ጽሑፍ «ተራራ» ተብሎ ስለተተረጎመ የእንግሊዝኛውን «hill/mountain» ልዩነት የሚያብራራ ግርጌ ማስታወሻ አላስፈለገም።
