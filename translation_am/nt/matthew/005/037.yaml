lexical_decisions:
- source_word: ἔστω
  choice: ይሁን
  rationale: የεἰμί ሦስተኛ መደብ የአሁን ጊዜ ትእዛዛዊ ቅርጽ ነው፤ ‘ይሁን’ ምክሩን በተፈጥሯዊና ክብር ባለው አማርኛ ያቀርባል።
- source_word: λόγος
