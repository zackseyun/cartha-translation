  rationale: በዚህ አውድ λόγος ሰው በዕለት ተዕለት የሚናገረውን ያመለክታል፤ ‘ንግግራችሁ’ በአማርኛ ከ‘ቃላችሁ’ ይልቅ ይህን ሐሳብ በግልጽ ያስተላልፋል።
- source_word: ναὶ ναί, οὒ οὔ
  choice: ‘አዎን፣ አዎን’ ወይም ‘አይደለም፣ አይደለም’
  rationale: የግሪኩን ድግግሞሽና አጽንዖት ይጠብቃል፤ ‘ወይም’ ደግሞ ሁለቱን ተቃራኒ መልሶች በተፈጥሯዊ አማርኛ ያገናኛል።
- source_word: περισσὸν
  choice: የሚያልፈው
  rationale: በስም ተግባር የዋለው ቅጽ ከተጠቀሱት ቀጥተኛ መልሶች በላይ የሚጨመረውን ያመለክታል።
- source_word: τούτων
  choice: ከዚህ
  rationale: ግሪኩ ብዙ ቁጥር ቢሆንም፣ የአማርኛው ‘ከዚህ’ ቀደም ብለው የተጠቀሱትን ሁለት የመልስ ቅርጾች በተፈጥሯዊ ሁኔታ ይመለከታል።
- source_word: ἐκ
  choice: ከ… ነው
  rationale: የምንጭን ወይም የመነሻን ሐሳብ በቀጥታ ያስተላልፋል።
- source_word: τοῦ πονηροῦ
