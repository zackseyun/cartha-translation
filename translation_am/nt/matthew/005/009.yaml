  yaml_path: translation/nt/matthew/005/009.yaml
  text: Blessed are the peacemakers[a], because they will be called sons of God.
translation:
  language: am
  text: ሰላም የሚያሰፍኑ ብፁዓን ናቸው፤ እነርሱ የእግዚአብሔር ልጆች[a] ይባላሉና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ‘የእግዚአብሔር ወንድ ልጆች።’ የግሪኩ ቃል ‘ወንዶች ልጆች’ የሚል ወንድ ብዙ ቁጥር ነው፤ በዚህ አጠቃቀም ግን ተወካይና አካታች ኃይል አለው።
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: ብፁዓን ናቸው
  rationale: የመለኮታዊ ሞገስንና የተባረከ ሁኔታን የሚገልጸውን የብፅዕና ንግግር በተለመደውና ክቡር የአማርኛ አገላለጽ ያስቀምጣል፤ እንደ ስሜታዊው ‘ደስተኞች’ አያጠብበውም።
- source_word: εἰρηνοποιοί
  choice: ሰላምን የሚያደርጉ
  rationale: የግሪኩን ውሁድ ስም በቀጥተኛና ተፈጥሯዊ ሐረግ በመተርጎም ሰላምን በንቃት የሚፈጥሩትን ወይም የሚያሰፍኑትን ሰዎች ያመለክታል።
- source_word: ὅτι
  choice: -ና
  rationale: በአማርኛ ተፈጥሯዊ በሆነ የምክንያት አያያዥ የብፅዕናውን ምክንያት ያስተዋውቃል።
- source_word: αὐτοὶ
  choice: እነርሱ
  rationale: ግልጽ ተውላጠ ስም በመጠቀም በግሪኩ ያለውን አጽንዖት ያንጸባርቃል።
- source_word: υἱοὶ θεοῦ
  choice: የእግዚአብሔር ልጆች
  rationale: ‘ልጆች’ በዘመናዊ አማርኛ ወንዶችንና ሴቶችን በተፈጥሮ የሚያካትት ሲሆን የመወለድና የቤተሰብ ዝምድናውን ይጠብቃል፤ የግሪኩ ቀጥተኛ ወንድ ብዙ ቁጥር በማስታወሻ ተገልጿል።
- source_word: κληθήσονται
  choice: ይባላሉ
  rationale: የወደፊት ተገብሮ ቅርጹን በአማርኛ ተፈጥሯዊ አነጋገር ያቀርባል፤ ‘እንደ ... ይታወቃሉ’ በማለት አይተረጉመውም።
theological_decisions:
- issue: በυἱοὶ θεοῦ ያለው ጾታዊ የልጅነት አገላለጽ
  choice: በዋናው ጽሑፍ ‘የእግዚአብሔር ልጆች’
  alternative: ‘የእግዚአብሔር ወንዶች ልጆች’
  rationale: υἱοί በቅርጹ ወንድ ብዙ ቁጥር ቢሆንም እዚህ ተወካይና አካታች ኃይል አለው። በአማርኛ ‘ወንዶች ልጆች’ ማለት ሴቶችን እንደሚያገል በቀላሉ ስለሚሰማ፣ ‘ልጆች’ የትርጉም ክልሉን በተሻለ ሁኔታ ይጠብቃል፤ የምንጩ ወንድ ቅርጽ ግን በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። ‘ብፁዓን’ የመጽሐፍ ቅዱስ የብፅዕና ንግግርን ይጠብቃል፤ የአረፍተ ነገሩ አወቃቀር የአማርኛን ተፈጥሯዊ ሥርዓት ይከተላል።
