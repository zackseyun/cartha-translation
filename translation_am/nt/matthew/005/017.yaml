source:
  edition: SBLGNT
  text: Μὴ νομίσητε ὅτι ἦλθον καταλῦσαι τὸν νόμον ἢ τοὺς προφήτας· οὐκ ἦλθον καταλῦσαι ἀλλὰ πληρῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/017.yaml
  text: Do not think that I came to abolish the Law or the Prophets[b][a]; I did not come to abolish them but to fulfill them.
translation:
  language: am
  text: “ሕጉን ወይም ነቢያትን ለመሻር እንደ መጣሁ አታስቡ፤ ለመሻር ሳይሆን ለመፈጸም[b] መጣሁ።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “መጣሁ” በሚለው በሁለቱም ስፍራ “መጥቻለሁ” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “መፈጸም” የሚለው “ወደ ፍጻሜ ማድረስ” ወይም “ሙሉ በሙሉ መግለጥ” ተብሎም ሊገባ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: አይምሰላችሁ
  rationale: μή ከአውሪስት ሰብጅንክቲቭ ጋር የሚሰጠውን የክልከላ ኃይል በተፈጥሯዊና ቀጥተኛ አማርኛ ይገልጣል።
- source_word: ἦλθον
  choice: መጣሁ / የመጣሁ
  rationale: የግሪኩን ቀላል የአውሪስት መልክ በተፈጥሯዊ አማርኛ ያቀርባል፤ በመጀመሪያው ሐረግ ለአማርኛ አገባብ ሲባል በዘመድ አንቀጽ ተቀርጿል።
- source_word: καταλῦσαι
  choice: ለመሻር
  rationale: ከሕጉና ከነቢያት ጋር በዚህ ዐውድ የሚያመለክተውን ማስወገድ፣ ዋጋ ማሳጣት ወይም ከሥራ ውጭ ማድረግ የሚለውን ሕጋዊ ኃይል በግልጽ ይይዛል።
- source_word: τὸν νόμον
  choice: ሕጉን
  rationale: ከ“ነቢያት” ጋር የተጣመረው አጠቃቀም የእስራኤልን ቅዱሳት መጻሕፍት፣ በተለይም ቶራን፣ እንደሚያመለክት ያሳያል።
- source_word: τοὺς προφήτας
  choice: ነቢያትን
  rationale: በ“ሕጉ ወይም ነቢያት” በሚለው የታወቀ ጥምረት ውስጥ የመጽሐፍ ቅዱስን ክፍል ወይም የነቢያትን ጽሑፎች ያመለክታል።
- source_word: ἀλλὰ πληρῶσαι
  choice: ሳይሆን ለመፈጸም
  rationale: “መፈጸም” ቃሉ ወደታሰበለት ሙላት ማድረስ፣ ማሟላት ወይም ፍጻሜውን ማምጣት የሚሉትን የπληρόω ሰፊ ትርጉሞች አንዱን ብቻ ሳይገድብ ይጠብቃል።
theological_decisions:
- issue: ኢየሱስ ከ“ሕጉ ወይም ነቢያት” ጋር ያለውን ግንኙነት πληρῶσαι እንዴት እንደሚገልጥ
  choice: “ለመፈጸም” የሚለውን ሰፊ አገላለጽ መጠበቅ
  alternative: “ወደ ፍጻሜ ለማድረስ፣” “ሙሉ መገለጫውን ለመስጠት፣” ወይም “ለማጽናት”
  rationale: ጥቅሱ ብዙ ሥነ መለኮታዊ ትርጓሜዎችን የሚፈቅድ ስለሆነ፣ ዋናው ጽሑፍ አንድን ትርጓሜ ብቻ አያስገድድም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “ሕጉን ወይም ነቢያትን” የሚለው ቅርጽ የግሪኩን አማራጭ አያያዥ ጠብቆ የመጽሐፍ ቅዱሳዊውን ጥምረት ያስተላልፋል።
