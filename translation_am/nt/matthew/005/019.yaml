  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὃς ἐὰν οὖν λύσῃ μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων καὶ διδάξῃ οὕτως τοὺς ἀνθρώπους, ἐλάχιστος κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν· ὃς δ’ ἂν ποιήσῃ καὶ διδάξῃ, οὗτος μέγας κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/019.yaml
  text: Therefore[a], whoever relaxes one of the least of these commandments and teaches others to do so will be called least in the kingdom of heaven; but whoever does them and teaches them[b], this one will be called great in the kingdom of heaven.
translation:
  language: am
  text: ስለዚህ፣ ከእነዚህ እጅግ ታናናሽ ትእዛዛት አንዱን የሚያላላ[a]፣ ሰዎችንም እንዲሁ እንዲያደርጉ የሚያስተምር ሁሉ በሰማያት መንግሥት እጅግ ታናሽ ይባላል፤ የሚፈጽማቸውና የሚያስተምራቸው ግን፣ ይህ በሰማያት መንግሥት ታላቅ ይባላል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የሚሽር” ወይም “የሚጥስ።” የግሪኩ ግስ ቃል በቃል “የሚፈታ” ማለት ሲሆን፣ እዚህ የትእዛዙን ኃይል ማዳከምን ወይም አስገዳጅ እንዳልሆነ መቁጠርን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ንግግር የሚወጣውን ድምዳሜ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: λύσῃ
  choice: የሚያላላ
  rationale: የግሪኩን ‘መፍታት/ማላላት’ ምሳሌያዊ ኃይል ይጠብቃል፤ ትእዛዙን አስገዳጅ እንዳልሆነ ማድረግን ወይም ኃይሉን ማዳከምን ያመለክታል።
- source_word: μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων
  choice: ከእነዚህ እጅግ ታናናሽ ትእዛዛት አንዱን
  rationale: አንዱ ትእዛዝ ‘እጅግ ታናናሽ’ ከተባሉት ምድብ መሆኑንና የደረጃ ንጽጽሩን ይጠብቃል።
- source_word: διδάξῃ οὕτως τοὺς ἀνθρώπους
  choice: ሰዎችንም እንዲሁ እንዲያደርጉ የሚያስተምር
  rationale: οὕτως ወደ ትእዛዙን ማላላት የሚመለስ መሆኑን ግልጽ ያደርጋል፤ ἀνθρώπους በዚህ ስፍራ ሰዎችን በአጠቃላይ ያመለክታል።
- source_word: ἐλάχιστος κληθήσεται
  choice: እጅግ ታናሽ ይባላል
  rationale: የወደፊት ተደራጊ ቅርጹንና ከ μέγας ጋር ያለውን ንጽጽር ይጠብቃል።
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: በሰማያት መንግሥት
  rationale: የማቴዎስን ባሕርያዊ አገላለጽና οὐρανῶν የብዙ ቁጥር ቅርጽ ይጠብቃል።
- source_word: ποιήσῃ καὶ διδάξῃ
  choice: የሚፈጽማቸውና የሚያስተምራቸው
  rationale: ποιέω ከትእዛዛት ጋር ሲያያዝ ‘መፈጸም’ ተፈጥሯዊና ትክክለኛ ነው፤ የሁለቱንም ግሶች ተመሳሳይ ተሳቢ ይገልጻል።
- source_word: οὗτος μέγας κληθήσεται
  choice: ይህ ... ታላቅ ይባላል
  rationale: οὗτος የሚሰጠውን አጽንዖት በ‘ይህ’ ይጠብቃል፤ μέγαςን በቀጥታ ‘ታላቅ’ ይተረጉማል።
theological_decisions:
- issue: በመንግሥቱ ውስጥ ‘እጅግ ታናሽ/ታላቅ’ የመባል ትርጉም
  choice: ጥቅሱ እንደሚለው በመንግሥቱ ውስጥ ያለ ንጽጽራዊ ደረጃ ብቻ ተገልጿል።
  alternative: ‘እጅግ ታናሽ’ ማለት ከመንግሥቱ መገለል ነው ወይም ‘ታላቅ’ ቴክኒካዊ የሽልማት ደረጃ ነው ብሎ መተርጎም።
  rationale: ግሪኩ ‘በሰማያት መንግሥት’ እጅግ ታናሽ ይባላል እንጂ ከመንግሥቱ ውጭ ይሆናል አይልም፤ ስለ ድነት፣ ደረጃ ወይም ሽልማት ያለው የነገረ መለኮት ውይይት አልተፈታም።
- issue: τοὺς ἀνθρώπους አጠቃላይ አመልካችነት
  choice: ሰዎችን
  alternative: ወንዶችን
  rationale: በዚህ ዐውድ የግሪኩ ቃል ወንዶችን ብቻ ሳይሆን ሰዎችን በአጠቃላይ ያመለክታል፤ ‘ሰዎች’ በዘመናዊ አማርኛ ትርጉሙን በቀጥታ ያስተላልፋል።
