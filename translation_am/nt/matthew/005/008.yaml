    text: “እግዚአብሔርን ያያሉ” የሚለው ተስፋ በእግዚአብሔር ፊት በቀጥታ መቅረብን፣ የዚህንም ተስፋ የወደፊት ፍጻሜ ጨምሮ፣ ሊያመለክት ይችላል፤ ትርጉሙ ግን ይህን ትርጉም ሳያጠብ የጽሑፉን ቀጥተኛ አነጋገር ጠብቋል።
