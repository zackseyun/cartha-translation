  text: በልባቸው ንጹሓን የሆኑ የተባረኩ ናቸው፤[a] እነርሱ እግዚአብሔርን ያያሉና።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ልባቸው ንጹሕ የሆኑ።”
