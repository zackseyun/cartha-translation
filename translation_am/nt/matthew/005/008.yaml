lexical_decisions:
- source_word: μακάριοι
  choice: የተባረኩ ናቸው
  rationale: የመለኮታዊ ሞገስንና የተመረጠ ሁኔታን የሚጠቁመውን የብፁዓን ንግግር በግልጽ ዘመናዊ አማርኛ ያቀርባል፤ ትርጉሙን ወደ ጊዜያዊ ደስታ ብቻ አያጠብም።
- source_word: καθαροὶ
  choice: ንጹሓን
  rationale: በዚህ አውድ ያለውን ውስጣዊና ሥነ ምግባራዊ ንጽሕና ያስተላልፋል፤ ‘ንጹሓን’ የተፈጥሮ የብዙ ቁጥር ቅጽ ነው።
- source_word: τῇ καρδίᾳ
  choice: በልባቸው
  rationale: የዳቲቭ ቅርጹን ንጽሕናው የሚገለጥበት ውስጣዊ ዘርፍ አድርጎ ያቀርባል፤ ‘ልብ’ ከስሜት ብቻ ይልቅ ውስጣዊውን ሰው ያመለክታል።
- source_word: ὅτι
  choice: -ና
  rationale: የበረከቱን ምክንያት በተፈጥሯዊ የአማርኛ ዓረፍተ ነገር መዋቅር ያሳያል።
- source_word: αὐτοὶ
  choice: እነርሱ
  rationale: በግሪክኛው ያለውን አጽንዖት በግልጽ ተውላጠ ስም ይጠብቃል፤ እነዚሁ ሰዎች የተስፋው ተቀባዮች መሆናቸውን ያጎላል።
- source_word: τὸν θεὸν
  choice: እግዚአብሔርን
  rationale: ቀጥተኛውን ተሳቢ በመደበኛውና በክብር የተሞላው የአማርኛ ስያሜ ያቀርባል።
- source_word: ὄψονται
  choice: ያያሉ
  rationale: የወደፊት ተስፋውን በቀጥታና በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል፤ ከግሪክኛው በላይ ትርጓሜ አይጨምርም።
theological_decisions:
- issue: “እግዚአብሔርን ማየት” የሚለው ትርጉም
  choice: “እግዚአብሔርን ያያሉ” ተብሎ ያለ ትርጓሜያዊ ማስፋፊያ ተጠብቋል።
  alternative: “በእግዚአብሔር ፊት ይቀርባሉ” ወይም “በመጨረሻው ዘመን እግዚአብሔርን ይመለከታሉ።”
  rationale: ሐረጉ ወደ እግዚአብሔር ፊት ቀጥተኛ መቅረብንና የወደፊት ፍጻሜን ሊያካትት ይችላል፤ ግሪክኛው ግን አጭርና ግልጽ በመሆኑ ያንን ሥነ መለኮታዊ ስፋት ሳይጠብ ቃሉ በቀጥታ ተተርጉሟል።
