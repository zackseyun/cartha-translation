  yaml_path: translation/nt/matthew/005/023.yaml
  text: Therefore, if you are offering your gift on the altar, and there remember that your brother has something against you,
translation:
  language: am
  text: ስለዚህ፣ መባህን በመሠዊያው ላይ ስታቀርብ፣ በዚያም ወንድምህ በአንተ ላይ ቅሬታ እንዳለው ብታስታውስ፣[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ወንድምህ ወይም እህትህ»፤ የግሪኩ ጽሑፍ «ወንድም» የሚል በወንድ ፆታ ነጠላ ቁጥር ያለ ቃል ይጠቀማል፤ በዚህ አውድ ግን ወካይ ሆኖ ሊያገለግል ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: ስለዚህ፣ … ብታስታውስ
  rationale: οὖν ከቀደመው ትምህርት የሚወጣውን ድምዳሜ በ«ስለዚህ» ያሳያል፤ ἐὰν የሁኔታ አንቀጽ መሆኑ በአማርኛው «ብታስታውስ» ቅርጽ ተጠብቋል።
- source_word: προσφέρῃς τὸ δῶρόν σου
  choice: መባህን … ስታቀርብ
  rationale: προσφέρω በመሥዋዕታዊ አውድ «ማቅረብ» ነው፤ δῶρον እዚህ በመሠዊያ የሚቀርብ ስጦታ ስለሆነ «መባ» ተፈጥሯዊና አውዳዊ ነው። የድርጊቱ በሂደት ላይ መሆን «ስታቀርብ» በሚለው ተገልጧል።
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: በመሠዊያው ላይ
  rationale: θυσιαστήριον «መሠዊያ» ነው፤ ἐπί ከተያያዘው የአቅጣጫ ቅርጽ ጋር መባውን በመሠዊያው ላይ የማቅረብን ሁኔታ ያሳያል።
- source_word: κἀκεῖ μνησθῇς
  choice: በዚያም … ብታስታውስ
  rationale: κἀκεῖ የቦታውን አጽንዖትና አያያዥነት በ«በዚያም» ይጠብቃል፤ μνησθῇς ያለ ተጨማሪ ምክንያታዊ ትርጓሜ «ብታስታውስ» ተብሏል።
- source_word: ὁ ἀδελφός σου
  choice: ወንድምህ
  rationale: የግሪኩ ቃል በወንድ ፆታ ነጠላ ቁጥር ነው፤ «ወንድምህ» የምንጩን ግልጽ ቅርጽ ይጠብቃል። በአውዱ ወካይ አጠቃቀም ሊኖረው እንደሚችል በማስታወሻ ተገልጧል።
- source_word: ἔχει τι κατὰ σοῦ
  choice: በአንተ ላይ አንዳች እንዳለው
  rationale: ይህ አገላለጽ አንድ ሰው በሌላው ላይ ቅሬታ ወይም ክስ እንዳለው ያመለክታል። «አንዳች» የτιን ሆን ተብሎ ያልተወሰነ ትርጉም ይጠብቃል።
theological_decisions:
- issue: ፆታን የሚገልጸው የዝምድና ቃል ἀδελφός
  choice: ወንድምህ
