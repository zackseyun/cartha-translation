  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «መባ» እና «መሠዊያ» የአምልኮውን አውድ በተፈጥሯዊ መንገድ ይገልጻሉ፤ ዓረፍተ ነገሩ በቀጣዩ ቁጥር የሚሟላ የሁኔታ አንቀጽ መሆኑ በመጨረሻው ሰረዝ ተጠብቋል።
