source:
  edition: SBLGNT
  text: Ἐρρέθη ⸀δέ· Ὃς ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ, δότω αὐτῇ ἀποστάσιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/031.yaml
  text: But it was said[a], ‘Whoever divorces his wife, let him give her a certificate of divorce.’
translation:
  language: am
  text: “ሚስቱን የሚፈታ ሁሉ የፍቺ ወረቀት ይስጣት” ተብሎም ነበር።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሚስቱን የሚያሰናብት ሁሉ ... የፍቺ ሰነድ።” የግሪኩ ግስ “ማሰናበት” ማለት ሊሆን ይችላል፤ እዚህ ግን በጋብቻ ሕጋዊ አውድ ፍቺን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρρέθη
  choice: ተብሎ ነበር
  rationale: የግሱን የተደርጎ ቅርጽና በዙሪያው ባሉት ንግግሮች የሚታየውን የጥቅስ መግቢያ በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: δέ
  choice: -ም
  rationale: δέ ከቀደመው ክፍል ወደ አዲስ ነጥብ የሚያሸጋግር ሲሆን፣ እዚህ ላይ “ተብሎም” በሚለው ቅርጽ ሽግግሩን በተፈጥሯዊ አማርኛ ያሳያል፤ ከቀጣዩ ቁጥር በፊት ከባድ ተቃርኖ አያስገባም።
- source_word: Ὃς ἂν
  choice: የሚ... ሁሉ
  rationale: ያልተወሰነውን አጠቃላይ ሁኔታ በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἀπολύσῃ
  choice: የሚፈታ
  rationale: ἀπολύω በአጠቃላይ “መልቀቅ/ማሰናበት” ሊሆን ቢችልም፣ ከἀποστάσιον ጋር ባለው የጋብቻ ሕጋዊ አውድ “መፍታት” ፍቺን በግልጽ ያመለክታል።
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: ሚስቱን
  rationale: የጋብቻና የፍቺ አውዱ γυνήን “ሚስት” ብሎ እንዲተረጎም ያደርጋል፤ የወንድ ባለቤትነት ቅርጹም ተጠብቋል።
- source_word: δότω αὐτῇ
  choice: ይስጣት
  rationale: የሦስተኛ መደብ ትእዛዛዊ ቅርጹንና “ለእርሷ” የሚለውን ተቀባይ በአንድ ተፈጥሯዊ የአማርኛ ግስ ይይዛል።
- source_word: ἀποστάσιον
  choice: የፍቺ ወረቀት
  rationale: ቃሉ ፍቺን የሚያረጋግጥ የጽሑፍ ሰነድ መሆኑን በቀላልና በዘመናዊ አማርኛ ያሳያል።
theological_decisions:
- issue: የኢየሱስ አባባል ከሙሴ የፍቺ ድንጋጌ ጋር ያለው ዝምድና
  choice: ንግግሩን እንደ ሕጋዊ አባባል ጥቅስ ማቅረብ፣ በዚህ ቁጥር ብቻ ይሁንታንም ሆነ ተቃውሞን አለመጨመር
  alternative: ፍቺን የሚያጸድቅ ቀጥተኛ ትእዛዝ አድርጎ መተርጎም፣ ወይም ተራ የተለመደ አስተምህሮ አድርጎ ማቅረብ
  rationale: ይህ ቁጥር ኢየሱስ በቀጣዩ ቁጥር የሚመልስበትን የቀድሞ አባባል ያስተዋውቃል። ስለዚህ ትርጉሙ የጥቅሱን ሕጋዊ ቅርጽ ይጠብቃል፣ ሰፊውን የፍቺ ሥነ መለኮታዊ ክርክር ግን እዚህ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የጥቅሱ ትእዛዛዊ ኃይል በ“ይስጣት” ተጠብቋል፤ የአማርኛ ተፈጥሯዊ አወቃቀር ስለሚጠይቅም የጥቅስ መግቢያው ከጥቅሱ በኋላ ተቀምጧል።
