- source_word: αὐτούς
  choice: -አቸው
  rationale: ተውላጠ ስሙን «እነርሱን» በሚያመለክተው የተሳቢ ቅጥያ ያቀርባል፤ በዚህ ቁጥር ብቻ ያልተገለጸውን ማንነታቸውን «ደቀ መዛሙርቱ» ወይም «ሕዝቡ» ብሎ አይወስንም።
- source_word: λέγων
  choice: እንዲህ እያለ
  rationale: ትምህርቱን የሚከተለውን ቀጥተኛ ንግግር በተፈጥሯዊ አማርኛ ያስተዋውቃል፣ የአሁን ጊዜ አሳታፊውንም ከዋናው ግስ ጋር ያገናኛል።
