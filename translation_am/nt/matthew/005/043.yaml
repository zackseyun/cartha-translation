  yaml_path: translation/nt/matthew/005/043.yaml
  text: You have heard that it was said[a], ‘You shall love your neighbor and hate your enemy.’
translation:
  language: am
  text: “እንዲህ ተብሎ ሰምታችኋል፦ ‘ባልንጀራህን ውደድ፤ ጠላትህንም ጥላ።’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የመጀመሪያው ሐረግ ዘሌዋውያን 19፥18ን ያስተጋባል። “ጠላትህንም ጥላ” የሚለው ሁለተኛው ሐረግ ግን ቀጥተኛ የብሉይ ኪዳን ጥቅስ አይደለም፤ ኢየሱስ የሚያርመውን የተለመደ ትምህርት ያንጸባርቃል።
    reason: cross_reference
lexical_decisions:
- source_word: Ἠκούσατε
  choice: ሰምታችኋል
  rationale: በዚህ ተደጋጋሚ የማስተማር መግቢያ ውስጥ ያለፈውን የመስማት ተግባርና አሁን ያለውን ውጤቱን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐρρέθη
  choice: እንደተባለ
  rationale: ተናጋሪውን ሳይወስን የግሪኩን የተደራጊ አቀራረብ ይጠብቃል።
- source_word: Ἀγαπήσεις
  choice: ውደድ
  rationale: የወደፊት አመልካቹ እዚህ የትእዛዝ ኃይል ስላለው፣ የአማርኛ ቀጥተኛ ትእዛዝ ያንን ኃይል በተፈጥሮ ያስተላልፋል።
- source_word: τὸν πλησίον σου
  choice: ባልንጀራህን
  rationale: በሥነ ምግባራዊውና በዘሌዋውያን 19፥18 ዐውድ ውስጥ የታወቀውን ‘neighbor’ ትርጉም የሚያስተላልፍ የመጽሐፍ ቅዱስ አማርኛ ቃል ነው።
- source_word: μισήσεις
  choice: ጥላ
  rationale: ከመጀመሪያው ትእዛዝ ጋር ትይዩ የሆነውን የትእዛዝ ኃይል በአጭርና ተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: τὸν ἐχθρόν σου
  choice: ጠላትህን
  rationale: በተቃርኖው ሥነ ምግባራዊ ዐውድ ውስጥ የἐχθρόςን ቀጥተኛና የተለመደ ትርጉም ይሰጣል።
theological_decisions:
- issue: ‘ጠላትህንም ጥላ’ የሚለው ሐረግ ያለው ደረጃ
  choice: ኢየሱስ ሰዎቹ እንደሰሙት በጠቀሰው አንድ ንግግር ውስጥ እንዳለ ተተርጉሟል፤ ነገር ግን ቀጥተኛ የብሉይ ኪዳን ጥቅስ እንደሆነ አልተገለጸም።
  alternative: መላውን ንግግር በእኩል ደረጃ ቀጥተኛ የቅዱሳት መጻሕፍት ጥቅስ አድርጎ ማቅረብ፣ ወይም ሁለተኛውን ሐረግ በዋናው ጽሑፍ ውስጥ የትውፊት ትርጓሜ ብቻ ብሎ መለየት።
  rationale: የግሪኩ ጽሑፍ ሁለቱንም ሐረጎች ‘እንደተባለ ሰምታችኋል’ በሚለው አንድ የተዘገበ ንግግር ሥር ያቀርባል። የግሪኩን አወቃቀር በመጠበቅ፣ ሁለተኛው ሐረግ ቀጥተኛ የብሉይ ኪዳን ትእዛዝ እንዳልሆነ በማስታወሻው ተብራርቷል።
