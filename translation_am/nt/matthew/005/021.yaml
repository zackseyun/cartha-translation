review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the discourse formula, the recipient sense of τοῖς ἀρχαίοις, the command, and the legal liability. However, its word order places the quoted tradition before ‘እንደተባለ ሰምታችኋል,’ which is less direct and less natural than the source’s introductory formulation.
  naturalness: The individual expressions are clear modern standard Amharic, but the sentence is more idiomatic and easier to follow when ‘ሰምታችኋል’ introduces what was said before the citation. Removing the outer quotation marks also avoids presenting Jesus’ entire statement as a quotation within the verse.
  terminology: ‘አትግደል’ is an established, concise rendering of the command and is acceptable in this legal context. ‘ተጠያቂ ይሆናል’ and ‘ለፍርድ’ appropriately preserve the judicial sense of ἔνοχος ἔσται τῇ κρίσει without overdefining the court or penalty.
  issues:
  - severity: medium
    issue: The main clause and cited saying are ordered awkwardly.
    rationale: Greek begins, ‘You have heard that it was said to those of old,’ and then gives the citation. The draft reverses this order, making the sentence read like a quotation followed by a reporting clause. Reordering preserves the source’s discourse structure and improves natural Amharic.
  revised_text: ለቀድሞ ሰዎች፣ ‘አትግደል፤ የገደለ ሁሉ ለፍርድ ተጠያቂ ይሆናል’ ተብሎ እንደተነገረ ሰምታችኋል።
