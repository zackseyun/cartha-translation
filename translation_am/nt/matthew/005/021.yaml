  text: Ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐ φονεύσεις· ὃς δ’ ἂν φονεύσῃ, ἔνοχος ἔσται τῇ κρίσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/021.yaml
  text: You have heard that it was said to the ancients[a], ‘You shall not murder[c][b]; and whoever murders will be liable to judgment.’
translation:
  language: am
  text: ለቀድሞ ሰዎች፣ ‘አትግደል፤ የገደለ ሁሉ ለፍርድ ተጠያቂ ይሆናል’ ተብሎ እንደተነገረ ሰምታችኋል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠκούσατε
  choice: ሰምታችኋል
  rationale: የግሪኩ የአወራርድ ቅርጽ በአማርኛ ተቀባይ የሆነንና እስከአሁን የሚመለከት የተሰማ ትምህርት ለመግለጽ በፍጹም ጊዜ ተተርጉሟል።
- source_word: ἐρρέθη
  choice: እንደተባለ
  rationale: ተናጋሪውን ሳይወስን የግሪኩን ተደራጊ አነጋገር ይጠብቃል።
- source_word: τοῖς ἀρχαίοις
  choice: ለቀድሞ ሰዎች
  rationale: የድሮ ዘመን ሰዎች የንግግሩ ተቀባዮች መሆናቸውን በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: Οὐ φονεύσεις
  choice: አትግደል
  rationale: በአማርኛ የትእዛዝ አሉታዊ ቅርጽ ተፈጥሯዊ ነው፤ በዚህ የሕግ አውድ ግሱ የወንጀል ግድያን ያመለክታል።
- source_word: ὃς δ’ ἂν φονεύσῃ
  choice: የገደለም ሁሉ
  rationale: ከἄν እና ከንዑስ አንቀጹ የሚገኘውን አጠቃላይና ያልተወሰነ ሁኔታ ‘ሁሉ’ በማለት ያስተላልፋል።
- source_word: ἔνοχος ἔσται
  choice: ተጠያቂ ይሆናል
  rationale: በሕጋዊ አውድ ለውሳኔ ወይም ለቅጣት ተጋላጭና መልስ ሰጪ መሆንን ይገልጣል።
- source_word: τῇ κρίσει
  choice: ለፍርድ
  rationale: ቃሉ የፍርድ ውሳኔን ወይም የፍርድ ሂደትን ሊያመለክት ስለሚችል ‘ፍርድ’ ያንን መጠነኛ አሻሚነት ይጠብቃል።
theological_decisions:
- issue: የስድስተኛው ትእዛዝ ትርጉም
  choice: አትግደል
  alternative: ሰውን አትግደል / ነፍስ አታጥፋ
  rationale: φονεύω በአውዱ ሕገ ወጥ ሰው መግደልን ያመለክታል። የተመረጠው አጭር ቅርጽ የትእዛዙን የታወቀ አነጋገር ይጠብቃል፤ ግን ስለ ማንኛውም ዓይነት ግድያ ከግሪኩ በላይ የሆነ ፍጹም የሥነ መለኮት ድምዳሜ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ምንጩ በቀጥታ የሚጠበቅ አስፈላጊ የንባብ ልዩነት ስለሌለ የግርጌ ማስታወሻ አልተጨመረም።
