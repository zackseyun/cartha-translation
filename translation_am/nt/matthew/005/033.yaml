  text: Πάλιν ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐκ ἐπιορκήσεις, ἀποδώσεις δὲ τῷ κυρίῳ τοὺς ὅρκους σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/033.yaml
  text: Again[a], you have heard that it was said to those of old, ‘You shall not swear falsely[b], but you shall fulfill your oaths to the Lord.’
translation:
  language: am
  text: ደግሞ፣ “በሐሰት አትማል[a]፤ ነገር ግን መሐላዎችህን ለጌታ[b] ፈጽም” ተብሎ ለቀድሞ ሰዎች እንደተነገረ ሰምታችኋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “መሐላዎችህን አታፍርስ።” ግሱ በሐሰት መማልን ወይም መሐላን መጣስን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ለእግዚአብሔር።” ይህ አተረጓጎም በብሉይ ኪዳን ዳራ ያለውን የቃል ኪዳኑን መለኮታዊ ስም ያንጸባርቃል።
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν
  choice: ደግሞም
  rationale: በተከታታይ የቀረቡትን ምሳሌዎች የሚያያይዝ ሲሆን “እንደገና” ከሚለው ይልቅ በዚህ አውድ ተፈጥሯዊ ነው።
- source_word: ἠκούσατε
  choice: ሰምታችኋል
  rationale: የቀመር አገላለጹንና ንግግሩ ለአድማጮቹ ያለውን ወቅታዊ ጠቀሜታ ያስቀምጣል።
- source_word: ἐρρέθη
  choice: እንደተባለ
  rationale: ተናጋሪውን ሳይወስን የግሪኩን ኢ-ገቢር ቅርጽ ይጠብቃል።
- source_word: τοῖς ἀρχαίοις
  choice: ለቀድሞዎቹ
  rationale: አረጋውያንን ሳይሆን የቀድሞ ትውልድ ሰዎችን እንደሚያመለክት በአጭርና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Οὐκ ἐπιορκήσεις
  choice: በሐሰት አትማል
  rationale: የሐሰት መሐላን በቀጥታ ይገልጣል፤ ግሱ መሐላን ማፍረስንም ሊያመለክት ስለሚችል ያ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ἀποδώσεις
  choice: ፈጽም
  rationale: በመሐላ የተገባውን ግዴታ መፈጸምን በግልጽ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: τῷ κυρίῳ
  choice: ለጌታ
  rationale: የግሪኩን κύριος ቀጥተኛ ትርጉም ይጠብቃል፤ በአውዱ የሚያመለክተው እግዚአብሔርን ነው።
- source_word: τοὺς ὅρκους σου
  choice: መሐላዎችህን
  rationale: ὅρκος በትክክል መሐላን ያመለክታል፤ የብዙ ቁጥርና የባለቤትነት ቅርጹም ተጠብቋል።
theological_decisions:
- issue: በእስራኤል መጻሕፍት ላይ በተመሠረተው ንግግር κύριοςን መተርጎም
  choice: ጌታ
  alternative: እግዚአብሔር
  rationale: የግሪኩ ጽሑፍ κυρίῳ ይላል፣ ኢየሱስም የቀድሞውን ትምህርት እያጠቃለለ እንጂ የዕብራይስጡን መለኮታዊ ስም በቀጥታ እየጠቀሰ አይደለም፤ ስለዚህ “ጌታ” በዋናው ጽሑፍ ተመርጦ የቃል ኪዳኑ ስም ዳራ በማስታወሻ ተጠብቋል።
- issue: የἐπιορκέω የትርጉም ወሰን
  choice: በሐሰት መማል
  alternative: መሐላን ማፍረስ
  rationale: ግሱ በሐሰት መማልንም የተደረገን መሐላ መጣስንም ሊያመለክት ይችላል። ዋናው ጽሑፍ የመጀመሪያውን አገላለጽ ሲይዝ ሌላውን በማስታወሻ ያስቀምጣል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የሕጋዊውን ንግግር ክብደት ለመጠበቅ “መሐላ” እና “ፈጽም” የሚሉት ቃላት ተመርጠዋል፤ የምንጩ እውነተኛ የቃላት አሻሚነት በማስታወሻዎች ተጠብቋል።
