id: MAT.5.42
reference: Matthew 5:42
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τῷ αἰτοῦντί σε ⸀δός, καὶ τὸν θέλοντα ἀπὸ σοῦ δανίσασθαι μὴ ἀποστραφῇς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/042.yaml
  text: Give to the one who asks you[a], and do not turn away from the one who wants to borrow from you.
translation:
  language: am
  text: ለሚጠይቅህ ስጥ፤ ከአንተም ሊበደር ከሚፈልገው ፊትህን አታዙር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰτοῦντί
  choice: ለሚለምን
  rationale: በመስተዋድድና በአንቀጽ የተገለጸው የአሁን ጊዜ ተሳቢ በአጠቃላይ የሚጠይቅን ሰው ያመለክታል። «ለሚለምን» የግሪኩን የግል ጥያቄ ኃይልና ከ«ስጥ» ጋር ያለውን ተቀባይነት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: δός
  choice: ስጥ
  rationale: የδίδωμι ቀጥተኛ ትእዛዛዊ ቅርጽ ነው፤ «ስጥ» ተጨማሪ የግዴታ አገላለጽ ሳይጨምር ትእዛዙን በቀጥታ ያቀርባል።
- source_word: θέλοντα
  choice: ከሚፈልግ ሰው
  rationale: በአንቀጽ የተገለጸው ተሳቢ ሰውን ወክሎ ይሠራል። «ከሚፈልግ ሰው» ፍላጎቱን በግልጽና በዘመናዊ አማርኛ ያሳያል።
- source_word: ἀπὸ σοῦ
  choice: ከአንተ
  rationale: መስተዋድዱ የመበደሩን ምንጭ ያመለክታል፤ «ከአንተ» በአማርኛ ቀጥተኛና ተፈጥሯዊ ነው።
- source_word: δανίσασθαι
  choice: ሊበደር
  rationale: በዚህ አውድ ግሱ አንድን ነገር በብድር መውሰድን ያመለክታል። ዕቃው ወይም ገንዘቡ ስላልተገለጸ «ሊበደር» የጽሑፉን ስፋት ይጠብቃል።
- source_word: μὴ ἀποστραφῇς
  choice: ፊትህን አትመልስ
  rationale: የክልከላ ትእዛዙ የἀποστρέφωን የመዞር ምስል ይዟል። «ፊትህን አትመልስ» ምስሉንና የእምቢታውን ተግባራዊ ስሜት በተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: የኢየሱስ ሥነ ምግባራዊ ትእዛዝ ወሰንና ኃይል
  choice: ሁለቱንም ንግግሮች ሳይለዝቡና በጽሑፉ ያልተገለጸ ገደብ ሳይጨምሩ እንደ ቀጥተኛ ትእዛዝ ማቅረብ።
  alternative: ትእዛዙን ለተወሰኑ «የሚገባቸው» ጠያቂዎች ብቻ መገደብ፣ ወይም ምስላዊውን አገላለጽ «እምቢ አትበል» ብሎ መተርጎም።
  rationale: የግሪኩ ጽሑፍ ቀጥተኛና አጠቃላይ ትእዛዞችን ይሰጣል። ትርጉሙ በጽሑፉ ያልተጠቀሱ ብቁነቶችን ወይም የኋላ ዘመን ገደቦችን አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «ፊትህን አትመልስ» የምንጩን ምስል በተፈጥሯዊ አገላለጽ ይጠብቃል።
