review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the two direct commands and the broad sense of borrowing. However, ለሚለምን narrows αἰτοῦντί (‘the one asking’) to begging, and the initial ከአንተ incorrectly attaches ‘from you’ to the first clause rather than solely to borrowing in the second clause.
  naturalness: The revised wording is clear, modern standard Amharic. ፊትህን አታዙር is an idiomatic and faithful rendering of the metaphor ‘do not turn away.’
  terminology: ለሚጠይቅህ preserves the general request sense without implying begging. ሊበደር and ከአንተ retain the unspecified object and source of the loan.
  issues:
  - severity: medium
    issue: The first clause uses ለሚለምን and adds ከአንተ.
    rationale: αἰτέω is general ‘ask/request,’ not specifically ‘beg,’ and the Greek places ἀπὸ σοῦ with the person wishing to borrow. The draft both narrows the asking and shifts the source phrase to the wrong clause.
  - severity: low
    issue: ፊትህን አትመልስ is less idiomatic than ፊትህን አታዙር.
    rationale: Both preserve the turning image, but ፊትን ማዞር is the more natural modern Amharic expression in this context.
  revised_text: ለሚጠይቅህ ስጥ፤ ከአንተም ሊበደር ከሚፈልገው ፊትህን አታዙር።
  revised_footnotes: []
  revision_rationale: 'The revision restores the broad, generic force of αἰτοῦντί, places ‘from you’ with borrowing as in the Greek, and uses an idiomatic Amharic expression that retains the source image of turning away. No footnote is needed: the English audit footnote records an English lexical alternative and does not require a corresponding Amharic note.'
