  - marker: b
    text: ወይም፣ «ምድሪቱን»። ይህ ንግግር መዝሙር 37፥11ን የሚያስተጋባ ይመስላል፤ በዚያም ተስፋው የቃል ኪዳኑን ምድር ሊያመለክት እንደሚችል ሁሉ፣ ሰፋ ባለ ትርጉምም ሊሰማ ይችላል።
