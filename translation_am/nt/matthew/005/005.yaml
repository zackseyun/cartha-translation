lexical_decisions:
- source_word: μακάριοι
  choice: የተባረኩ ናቸው
  rationale: መለኮታዊ ሞገስንና በረከትን የሚያመለክተውን የብፅዕና ንግግር ይጠብቃል፤ ቃሉን ወደ ጊዜያዊ ስሜት ብቻ አያወርደውም።
- source_word: οἱ πραεῖς
  choice: የዋሆች
  rationale: በዘመናዊ አማርኛ ትሕትና የተሞላበትን ገርነትና ራስን መግዛት ሊገልጽ ይችላል፤ ድካምን ወይም ፍርሃትን እንደማያመለክት በማስታወሻ ተብራርቷል።
- source_word: ὅτι
  choice: —ና
  rationale: ለብፅዕናው ንግግር ምክንያት የሚሰጠውን ግንኙነት በተፈጥሯዊ የአማርኛ አገባብ ይገልጻል።
- source_word: αὐτοὶ
  choice: በግሱ ውስጥ የተገለጸው የሦስተኛ መደብ ብዙ ቁጥር
  rationale: የግሪኩ ተውላጠ ስም አጽንዖት ቢኖረውም፣ «እነርሱ»ን በግልጽ መድገም በዚህ አጭር ንግግር ከባድ ይሆናል፤ ተስፋው በቀጥታ ለየዋሆቹ መሆኑ ከአውዱ ግልጽ ነው።
- source_word: κληρονομήσουσι
  choice: ይወርሳሉ
  rationale: የወደፊቱን ተስፋና እንደ ርስት የመቀበልን ትርጉም በቀጥታ ይጠብቃል፤ የቃል ኪዳን ርስትን የሚያስታውሰውንም ድምፀት አያጠፋም።
- source_word: τὴν γῆν
  choice: ምድርን
  rationale: «ምድር» ሰፊውን ‘earth’ ትርጉም ይሸከማል፤ በመዝሙር 37፥11 አስተጋብኦ ውስጥ ‘land’ ወይም የተስፋይቱ ምድር ትርጉምም ሊሰማበት ስለሚችል አማራጩ በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: የτὴν γῆν ወሰን
  choice: ምድር
  alternative: ሀገር / የተስፋይቱ ምድር
  rationale: γῆ መላውን ምድር ወይም የተወሰነች ምድርን ሊያመለክት ይችላል። ዋናው ጽሑፍ ሰፊውን ተስፋ በተፈጥሯዊ አማርኛ ያቀርባል፤ የመዝሙር 37፥11 የቃል ኪዳን ምድር አስተጋብኦ ግን በማስታወሻ ተጠብቋል።
- issue: የπραεῖς ሥነ መለኮታዊና ሥነ ምግባራዊ ትርጉም
  choice: የዋሆች
  alternative: ገሮች / ትሑታን
  rationale: ቃሉ ድካምን ወይም ተገዢ ፍርሃትን አያስተምርም፤ ትሕትና ያለበትን ገርነትና የተገራ ኃይልን ያመለክታል። ዋናው ትርጉም የታወቀውን መጽሐፍ ቅዱሳዊ ቃል ይጠብቃል፤ አሻሚነቱንም ማስታወሻው ያብራራል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የብፅዕናውን አጭር ምት ለመጠበቅ ቀጥተኛ አወቃቀር ተመርጧል፤ የግሪኩ የγῆ አሻሚነትና የπραεῖς ትርጉም በማስታወሻዎች ተጠብቀዋል።
