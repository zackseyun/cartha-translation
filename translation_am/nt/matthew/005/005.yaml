  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ገሮች» ወይም «ትሑታን»። እዚህ «የዋሆች» ማለት ደካሞች ማለት ሳይሆን፣ ትሑትና ገር የሆኑ ሰዎች ማለት ነው።
