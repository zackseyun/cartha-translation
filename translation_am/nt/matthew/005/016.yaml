review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the imperative, the collective singular ‘your light,’ the generic sense of ἀνθρώπων, the good works, and the plural ‘heavens.’ However, the construction ‘ይህም ... እንዲ... ነው’ weakens and awkwardly recasts the direct ὅπως purpose clause. ‘ክብር እንዲሰጡ’ expresses δοξάσωσιν more precisely than the broader ‘እንዲያከብሩ.’
  naturalness: The opening is natural. Recasting the second clause directly as an Amharic purpose clause makes the sentence smoother, clearer, and more idiomatic in modern standard Amharic.
  terminology: ‘ብርሃናችሁ,’ ‘መልካም ሥራዎቻችሁ,’ and ‘በሰማያት’ are appropriate. ‘ክብር እንዲሰጡ’ preserves the God-directed force of δοξάζω without importing doctrinal interpretation.
  issues:
  - severity: medium
    issue: The purpose clause is expressed by ‘ይህም ... እንዲ... ነው.’
    rationale: Although understandable, this is an unnecessarily indirect and somewhat awkward formulation of ὅπως with the subjunctives. A direct purpose construction better preserves the Greek syntax and flow.
  - severity: low
    issue: ‘እንዲያከብሩ’ is less specific than the source verb δοξάσωσιν.
    rationale: The verb can mean honor, but in this context ‘give glory’ is more exact. ‘ክብር እንዲሰጡ’ is clear and idiomatic.
  revised_text: እንዲሁ ብርሃናችሁ በሰዎች ፊት ይብራ፤ ሰዎችም መልካም ሥራዎቻችሁን አይተው በሰማያት[a] ላለው አባታችሁ ክብር እንዲሰጡ።
