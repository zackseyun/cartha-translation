base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/016.yaml
  text: In the same way[a], let your light shine before men[b], so that they may see your good works and glorify your Father who is in the heavens.
translation:
  language: am
  text: እንዲሁ ብርሃናችሁ በሰዎች ፊት ይብራ፤ ሰዎችም መልካም ሥራዎቻችሁን አይተው በሰማያት[a] ላለው አባታችሁ ክብር እንዲሰጡ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በሰማይ ላለው።” በግሪኩ ጽሑፍ “ሰማያት” በብዙ ቁጥር ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: እንዲሁ
  rationale: ከቀደመው የመብራትና የብርሃን ምሳሌ ጋር ያለውን የአኳኋን ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: λαμψάτω
  choice: ይብራ
  rationale: የሦስተኛ መደብ ነጠላ ትእዛዝን በአጭርና ተፈጥሯዊ መልኩ ይገልጣል።
- source_word: τὸ φῶς ὑμῶν
  choice: ብርሃናችሁ
  rationale: የግሪኩን ነጠላ ‘ብርሃን’ እና የብዙ ሰው ባለቤትነት ይጠብቃል።
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: በሰዎች ፊት
  rationale: ἄνθρωποι በዚህ ስፍራ ወንዶችን ብቻ ሳይሆን ሰዎችን በአጠቃላይ ያመለክታል፤ ‘በሰዎች ፊት’ ይህን በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: ὅπως
  choice: ይህም ... እንዲ... ነው
  rationale: የተግባሩን ዓላማ ግልጽ በሆነ የአማርኛ አገባብ ያሳያል።
- source_word: ἴδωσιν
  choice: አይተው
  rationale: ከሚከተለው ‘እንዲያከብሩ’ ጋር በተፈጥሯዊ የቅደም ተከተል ግንኙነት የሚሠራ የአማርኛ አገባብ ነው።
- source_word: τὰ καλὰ ἔργα
  choice: መልካም ሥራዎቻችሁ
  rationale: καλά ያለውን የመልካምነትና የተመሰገነነት ሐሳብ በተለመደ አማርኛ ይገልጣል።
- source_word: δοξάσωσιν
  choice: እንዲያከብሩ
  rationale: ለእግዚአብሔር ክብር መስጠትን በግልጽና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τὸν πατέρα ὑμῶν τὸν ἐν τοῖς οὐρανοῖς
  choice: በሰማያት ያለውን አባታችሁን
  rationale: የአባትነት ግንኙነቱንና በግሪክ ያለውን ብዙ ቁጥር ‘ሰማያት’ ይጠብቃል።
theological_decisions:
- issue: የἀνθρώπων አጠቃላይ ትርጉም
  choice: በሰዎች ፊት
  alternative: በወንዶች ፊት
  rationale: በዚህ ዐውድ የግሪኩ ቃል የሰው ልጆችን በአጠቃላይ እንጂ ወንዶችን ብቻ አያመለክትም፤ ‘ሰዎች’ የትርጉሙን ስፋት በትክክል ይጠብቃል።
- issue: የοὐρανοῖς ብዙ ቁጥር
  choice: በሰማያት
  alternative: በሰማይ
  rationale: ዋናው ጽሑፍ የግሪኩን ብዙ ቁጥር ይጠብቃል፤ በአማርኛ የተለመደው ነጠላ አቀራረብ ግን በማስታወሻ ተጠቅሷል።
