  register: ዘመናዊ፣ ግልጽና የተከበረ አማርኛ ተጠቅሟል። ‘ይብራ’ የትእዛዙን ኃይል ይጠብቃል፤ ‘ይህም ... እንዲ... ነው’ ደግሞ የዓላማውን አገባብ ለዘመናዊ አንባቢ ተፈጥሯዊ ያደርገዋል።
