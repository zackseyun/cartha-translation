  yaml_path: translation/nt/matthew/005/001.yaml
  text: Seeing the crowds[a], he went up the mountain; and when he sat down[c][b], his disciples came to him.
translation:
  language: am
  text: 'ሕዝቡን አይቶ[a] ወደ ተራራው[c] ወጣ፤ በተቀመጠ ጊዜ[b] ደቀ መዛሙርቱ ወደ እርሱ ቀረቡ።


    [a] ወይም፣ “ሕዝቡን ባየ ጊዜ።”


    [b] ወይም፣ “ከተቀመጠ በኋላ።” በግሪኩ የgenitive absolute አወቃቀር ነው።


    [c] ወይም፣ “ተራራው ላይ ወጣ።”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሕዝቡን ባየ ጊዜ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ከተቀመጠ በኋላ።” በግሪኩ የgenitive absolute አወቃቀር ነው።
