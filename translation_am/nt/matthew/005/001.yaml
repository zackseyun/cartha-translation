- issue: καθίσαντος αὐτοῦ የሚያመለክተው የትረካ ቅደም ተከተል
  choice: በተቀመጠ ጊዜ
  alternative: ከተቀመጠ በኋላ
  rationale: የግሪኩ አወቃቀር የጊዜ ወይም የአጋጣሚ ግንኙነትን ያሳያል፤ ዋናው ትርጉም ጥብቅ ቅደም ተከተልን ወይም ልዩ ሥርዓታዊ የማስተማር አቋምን አይጨምርም።
