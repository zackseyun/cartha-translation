  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። “ደቀ መዛሙርቱ” በሰፊው የታወቀ መጽሐፍ ቅዱሳዊ ቃል ሲሆን፣ የተቀረው አገላለጽ ከጥንታዊ ወይም ከባድ አጻጻፍ ተቆጥቧል።
