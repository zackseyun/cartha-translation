  - marker: c
    text: ወይም፣ “ተራራው ላይ ወጣ።”
    reason: previous_rendering
lexical_decisions:
- source_word: Ἰδὼν
  choice: አይቶ
  rationale: የግሪኩን የተውሳከ ግስ ቅርጽና ከዋናው ግስ ጋር ያለውን ትስስር በተፈጥሯዊ አማርኛ ያቆያል፤ ትክክለኛውን የጊዜ ግንኙነት ከሚገባው በላይ አይወስንም።
- source_word: δὲ
  choice: —
  rationale: እዚህ ላይ ቀላል የትረካ ሽግግር ስለሚያመለክት፣ “ነገር ግን” ብሎ መተርጎም የሌለ ተቃርኖ ይጨምራል። በአማርኛው የአረፍተ ነገር ፍሰት ይህን ሽግግር ያሳያል።
- source_word: τοὺς ὄχλους
  choice: ሕዝቡን
  rationale: የግሪኩ ቃል ብዙ የሰዎች ስብስቦችን ያመለክታል፤ “ሕዝቡ” በዘመናዊ አማርኛ ብዙ ሰዎችን በጥቅል የሚገልጽ ተፈጥሯዊ ስብስባዊ ስም ነው።
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: ወደ ተራራው ወጣ
  rationale: ወደ ከፍታው የተደረገውን እንቅስቃሴ በተፈጥሯዊ አማርኛ ይገልጻል፤ የተወሰነውን አመልካች በ“ተራራው” ያቆያል።
- source_word: καὶ καθίσαντος αὐτοῦ
  choice: እርሱም በተቀመጠ ጊዜ
  rationale: የግሪኩን genitive absolute የጊዜ ወይም የአብሮነት ግንኙነት በተፈጥሯዊ መንገድ ያቀርባል፤ “በኋላ” ብሎ ቅደም ተከተሉን ከጽሑፉ በላይ አያጠናክርም።
- source_word: προσῆλθαν αὐτῷ
  choice: ወደ እርሱ ቀረቡ
  rationale: ወደ አንድ ሰው መምጣትንና መቅረብን በግልጽና በተለመደ አማርኛ ይገልጻል።
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ደቀ መዛሙርቱ
  rationale: የመምህርና የተከታይ ግንኙነቱን የሚገልጽ፣ በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የታወቀና ለአንባቢዎች ግልጽ ቃል ነው።
theological_decisions:
