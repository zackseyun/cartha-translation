  yaml_path: translation/nt/matthew/005/015.yaml
  text: Nor do people light a lamp and put it under a basket[a], but on a lampstand[b], and it gives light to everyone in the house.
translation:
  language: am
  text: መብራትን አብርተው ከቅርጫት[a] በታች አያስቀምጡትም፤ ይልቁንም በየመብራት ማቆሚያ ላይ ያስቀምጡታል፤ መብራቱም በቤት ውስጥ ላሉት ሁሉ ያበራል[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከመስፈሪያ ቅርጫት በታች።” የግሪክ ቃል μόδιος የደረቅ ነገር መስፈሪያን፣ ከዚያም የዚያን መስፈሪያ ዕቃ ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በቤት ውስጥ ላሉት ሁሉ ይበራል።”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: … አያስቀምጡትም
  rationale: ከቀደመው አሉታዊ ምሳሌ ጋር የሚያያዘውን ኃይል በአማርኛ ተፈጥሯዊ በሆነ አሉታዊ አነጋገር ያስተላልፋል።
- source_word: καίουσιν λύχνον
  choice: መብራትን አብርተው
  rationale: λύχνος ተጨባጭ የዘይት መብራትን ያመለክታል፤ καίω ደግሞ በዚህ አውድ ‘ማብራት’ ተብሎ በተፈጥሮ ይተረጎማል።
- source_word: τιθέασιν αὐτόν
  choice: ያስቀምጡት
  rationale: ዕቃን በአንድ ቦታ ማኖርን በቀላልና ዘመናዊ አማርኛ ይገልጣል።
- source_word: ὑπὸ τὸν μόδιον
  choice: ከቅርጫት በታች
  rationale: μόδιος የደረቅ ነገር መስፈሪያንና የመስፈሪያውን ዕቃ ሊያመለክት ይችላል፤ ‘ቅርጫት’ ምስሉን ለዘመናዊ አንባቢ በግልጽ ያቀርባል።
- source_word: ἀλλ’ ἐπὶ τὴν λυχνίαν
  choice: ይልቁንም በመብራት ማስቀመጫ ላይ
  rationale: ἀλλά ያለውን ግልጽ ንፅፅር ‘ይልቁንም’ ያስተላልፋል፤ λυχνία ደግሞ መብራት የሚቀመጥበትን መደገፊያ ያመለክታል።
- source_word: λάμπει
  choice: ያበራል
  rationale: ‘ያበራል’ የመብራቱን መብራትና ለሌሎች ብርሃን መስጠቱን በተፈጥሮ ይገልጣል።
- source_word: πᾶσιν τοῖς ἐν τῇ οἰκίᾳ
  choice: በቤቱ ውስጥ ላሉት ሁሉ
  rationale: πᾶσιν ያለውን ሁሉን አቀፍ ስፋትና οἰκίᾳ ያለውን ቦታዊ ትርጉም ይጠብቃል።
theological_decisions:
