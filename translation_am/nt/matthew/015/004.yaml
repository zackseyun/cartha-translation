  rationale: θανάτῳ τελευτάτω የቅጣቱን ከባድነትና እርግጠኝነት ያሳያል፤ ዋናው ትርጉም ይህን እያስጠበቀ የማስገደሉን አስፈጻሚ ከግሪኩ በላይ አይገልጽም።
