  text: ὁ γὰρ θεὸς ⸀εἶπεν· Τίμα τὸν πατέρα καὶ τὴν μητέρα, καί· Ὁ κακολογῶν πατέρα ἢ μητέρα θανάτῳ τελευτάτω·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/004.yaml
  text: For God said[a], ‘Honor your father and your mother,’ and, ‘Whoever speaks evil of father or mother must surely die.’
translation:
  language: am
  text: እግዚአብሔር እንዲህ አለ፦ “አባትህንና እናትህን አክብር፤” እንዲህም፦ “አባትን ወይም እናትን የሚሰድብ[a] በእርግጥ ይሙት።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አባትን ወይም እናትን የሚረግም ይገደል።”
    reason: κακολογῶν ‘የሚረግም’ ተብሎ፣ θανάτῳ τελευτάτωም አስፈጻሚነቱን የበለጠ ግልጽ በሚያደርግ መንገድ ‘ይገደል’ ተብሎ ሊተረጎም ይችላል።
lexical_decisions:
- source_word: ὁ γὰρ θεὸς
  choice: እግዚአብሔር … ብሎአልና
  rationale: γάρ የኢየሱስን ማብራሪያና ምክንያት ያስገባል፤ በአማርኛ በግስ ላይ የተጨመረው ‘-ና’ ይህን ምክንያታዊ ግንኙነት በተፈጥሮ ያሳያል።
- source_word: εἶπεν
  choice: ብሎአል
  rationale: λέγω በዚህ ስፍራ የቅዱስ ጽሑፍ ጥቅስን ያስገባል፤ ‘ብሎአል’ የቃሉን ቀጥተኛ ትርጉም ይጠብቃል፣ ‘አዟል’ የሚለውን የበለጠ ጠንካራ ፍቺም አይጨምርም።
- source_word: Τίμα
  choice: አክብር
  rationale: τιμάω ለወላጆች የሚገባውን ክብር መስጠትን ያመለክታል፤ ‘አክብር’ የትእዛዙን ሥነ ምግባራዊ ክብደት ይጠብቃል።
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: አባትህንና እናትህን
  rationale: የአሥርቱ ትእዛዛት ጥቅስ በአማርኛ በተፈጥሮ የሚነበበው በሁለተኛ መደብ ነጠላ ባለቤትነት ነው፤ ይህም በጥቅሱ ምንጭ ያለውን ሐሳብ ያንጸባርቃል።
- source_word: Ὁ κακολογῶν
  choice: የሚሰድብ
  rationale: κακολογέω ክፉ መናገርን፣ መስደብን ወይም መርገምን ሊያመለክት ይችላል፤ ‘የሚሰድብ’ በዘመናዊ አማርኛ ግልጽና ክብረ ቃሉን የሚጠብቅ ነው።
- source_word: πατέρα ἢ μητέρα
  choice: አባትን ወይም እናትን
  rationale: በግሪክ አገላለጹ ዕቃዎቹ አጠቃላይ ናቸው፤ የባለቤትነት ቅጥያ ሳይጨመር ትርጉሙ በቅርብ ተጠብቋል።
- source_word: θανάτῳ τελευτάτω
  choice: በእርግጥ ይሙት
  rationale: ይህ በጥቅሱ ውስጥ ያለ ጠንካራ የሞት ቅጣት አገላለጽ ነው፤ ‘በእርግጥ ይሙት’ ክብደቱን ይጠብቃል፣ ግሪኩ በግልጽ ያልጠቀሰውን የሰው አስፈጻሚነትም በዋናው ጽሑፍ አይጨምርም።
theological_decisions:
