  yaml_path: translation/nt/matthew/015/037.yaml
  text: And they all ate and were satisfied[a], and they picked up seven full baskets of the leftover pieces.
translation:
  language: am
  text: ሁሉም በልተው ጠገቡ፤ ከቁርስራሾቹ የተረፈውንም ሰብስበው ሰባት ሙሉ ቅርጫቶች የሚሆን ሞሉ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφαγον
  choice: በሉ
  rationale: የግሪኩ ግስ ቀጥተኛውን ‘በሉ’ የሚል ትርጉም ይሰጣል፤ በአማርኛ በአገባቡ ከ‘ሁሉም’ ጋር በግስ ተውሳክ ቅርጽ ‘በልተው’ ተብሏል።
- source_word: πάντες
  choice: ሁሉም
  rationale: በሕዝቡ ውስጥ ማንም እንዳልቀረ የሚያሳየውን ሁሉን አቀፍ ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐχορτάσθησαν
  choice: ጠገቡ
  rationale: እስኪበቃቸው ድረስ መብላታቸውን በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τὸ περισσεῦον τῶν κλασμάτων
  choice: ከተረፉት ቁርስራሾች
  rationale: τὸ περισσεῦον የተረፈውን፣ κλασμάτων ደግሞ የተሰባበሩ የምግብ ቁራጮችን ያመለክታል፤ ‘ቁርስራሾች’ ሁለቱንም የተረፈና የተቆራረሰ ምግብ ሐሳብ በተፈጥሯዊ መንገድ ይይዛል።
- source_word: ἦραν
  choice: ሰብስበው ... አነሡ
  rationale: αἴρω በቀጥታ ‘አነሡ’ ማለት ቢሆንም፣ በዚህ የተረፈውን የማከማቸት አገባብ ‘ሰብስበው’ የሚለውን ተፈጥሯዊ ሐሳብ ያካትታል።
- source_word: ἑπτὰ
  choice: ሰባት
  rationale: የቁጥሩ ቀጥተኛ ትርጉም ነው።
- source_word: σπυρίδας
  choice: ቅርጫቶች
  rationale: σπυρίς ቅርጫትን ያመለክታል፤ ቃሉ ከሌሎች የመመገብ ዘገባዎች ቅርጫት ይልቅ ትልቅ ዓይነትን ሊያመለክት ስለሚችል ይህ ልዩነት በማስታወሻ ተጠብቋል።
- source_word: πλήρεις
  choice: ሙሉ
  rationale: ቅርጫቶቹ እንደሞሉ በቀጥታና በተፈጥሯዊ ቋንቋ ይገልጣል።
