lexical_decisions:
- source_word: Καὶ
  choice: -ም
  rationale: የግሪኩን ቀላል ትስስር በአማርኛ ተፈጥሯዊ በሆነው አያያዥ ቅጥያ ያሳያል፤ ተጨማሪ የጊዜ ትርጉም አያስገባም።
- source_word: προσκαλεσάμενος
  choice: ወደ እርሱ ጠርቶ
  rationale: የአኦሪስት ሚድል ቦዝ አንቀጹን በተፈጥሯዊ የአማርኛ ቅደም ተከተል ያቀርባል፤ ‘ወደ እርሱ’ የግሱን አቅጣጫዊ ኃይል ይጠብቃል።
- source_word: τὸν ὄχλον
  choice: ሕዝቡን
  rationale: በቦታው የተሰበሰበውን ሰፊ የሰዎች ቡድን በግልጽና በተለመደ አማርኛ ይገልጣል።
- source_word: εἶπεν αὐτοῖς
  choice: አላቸው
  rationale: ‘እነርሱን አለ’ የሚለውን ትርጉም በአጭርና ተፈጥሯዊ የአማርኛ ንግግር ያቀርባል።
- source_word: Ἀκούετε
  choice: አድምጡ
  rationale: የብዙ ቁጥር ትእዛዙን በዘመናዊ አማርኛ በተፈጥሯዊ ሁኔታ ያስተላልፋል፤ ‘ስሙ’ የሚለውም ትክክለኛ የቃል አማራጭ በማስታወሻ ተጠብቋል።
- source_word: συνίετε
  choice: አስተውሉም
  rationale: የሚሰማውን ትርጉም በአእምሮ መገንዘብን ይገልጣል፤ -ም ሁለቱን ትእዛዛት በተፈጥሯዊ ሁኔታ ያገናኛል።
