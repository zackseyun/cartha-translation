  yaml_path: translation/nt/matthew/015/014.yaml
  text: Leave them alone[a]; they are blind guides of the blind. But if a blind man guides a blind man[c][b], both will fall into a pit.
translation:
  language: am
  text: እነርሱን ተዋቸው፤ የዕውሮች ዕውር መሪዎች ናቸው።[a] ዕውር ዕውርን ቢመራ፣[b] ሁለቱም ወደ ጉድጓድ ይወድቃሉ።[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለዕውሮች ዕውር መሪዎች ናቸው።”
    reason: lexical_alternative
  - marker: b
    text: እዚህ “ዕውር” የሚለው ነጠላ ቃል በምሳሌያዊው አነጋገር ማንኛውንም ሰው ይወክላል፤ አባባሉ ለወንዶች ብቻ የተወሰነ አይደለም።
    reason: cultural_note
  - marker: c
    text: ወይም፣ “ወደ ቦይ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφετε αὐτούς
  choice: እነርሱን ተዉአቸው
  rationale: በዚህ አውድ ἀφίημι ማለት ይቅር ማለት ሳይሆን መተው ወይም እንዳሉ መተው ነው፤ አገላለጹም የትእዛዙን ቀጥተኛ ኃይል ይጠብቃል።
- source_word: τυφλοί
  choice: ዕውር
  rationale: የመንፈሳዊ አለማስተዋልን የሚያመለክተውን ዋናውን ዘይቤ ያለ ተጨማሪ ትርጓሜ ይጠብቃል።
- source_word: ὁδηγοὶ τυφλῶν
  choice: ዕውሮችን የሚመሩ ዕውር መሪዎች
  rationale: የመሪነቱን ምስልና የግሪኩን የዝምድና አገላለጽ በተፈጥሯዊ አማርኛ ያቀርባል። “መሪዎች” ቀጣዩን “ቢመራ” ከሚለው ጋር የቃል ተዛምዶውን ይጠብቃል።
- source_word: τυφλὸς ... τυφλὸν
  choice: ዕውር ዕውርን
  rationale: የምንጩን ነጠላና ምሳሌያዊ አወቃቀር በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐὰν ὁδηγῇ
  choice: ቢመራ
  rationale: ከንዑስ አንቀጹ ጋር አጠቃላይ ሁኔታን የሚገልጸውን የግሪክ አወቃቀር በተለመደ የአማርኛ ሁኔታዊ ግስ ያቀርባል።
- source_word: ἀμφότεροι
  choice: ሁለቱም
  rationale: በሁለቱ ላይ የሚደርሰውን አንድ ውጤት በግልጽ ያሳያል።
- source_word: εἰς βόθυνον
  choice: ወደ ጉድጓድ
  rationale: βόθυνος ጉድጓድን፣ ቦይን ወይም ጉድባን ሊያመለክት ይችላል፤ “ጉድጓድ” ሰፊና ግልጽ አማራጭ ሲሆን “ቦይ” በማስታወሻ ቀርቧል።
- source_word: πεσοῦνται
  choice: ይወድቃሉ
  rationale: የሁኔታውን የወደፊት ውጤት በተፈጥሯዊ የአማርኛ ግስ ይገልጻል።
theological_decisions:
- issue: “ዕውር” የሚለው ዘይቤ
  choice: ዘይቤውን “ዕውር” በማለት በዋናው ጽሑፍ ማቆየት
  alternative: “በመንፈሳዊ ዓይን ዕውር” ወይም “የማያስተውል መሪ” ብሎ መተርጎም
  rationale: ምንጩ ትርጉሙን አይዘረዝርም፤ በመሆኑም ምስሉን በቀጥታ ማቆየት የኢየሱስን ብርቱ ምሳሌያዊ አነጋገር ይጠብቃል።
- issue: በምሳሌያዊው አነጋገር ያለው ነጠላ ቅርጽ
  choice: “ዕውር ዕውርን” የሚለውን ነጠላ ቅርጽ ማቆየትና አጠቃላይ ወካይነቱን በማስታወሻ ማብራራት
  alternative: በዋናው ጽሑፍ “ዕውር ሰው ሌላ ዕውር ሰውን” ብሎ ማስፋት
  rationale: አጭሩ አገላለጽ የግሪኩን ምሳሌያዊ ጥቅስ ቅርጽ ይጠብቃል፤ ማስታወሻውም አባባሉ በአጠቃላይ ሰዎችን እንደሚመለከት ያብራራል።
