  register: ዘመናዊ፣ ክቡርና በቀላሉ የሚገባ መደበኛ አማርኛ ተጠቅሟል። አጭሩ ምሳሌያዊ አቀራረብ፣ የ“ዕውር” ተደጋጋሚ ምስልና በ“መሪዎች/ቢመራ” መካከል ያለው የቃል ተዛምዶ ተጠብቋል።
