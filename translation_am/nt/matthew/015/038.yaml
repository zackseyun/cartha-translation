- source_word: χωρὶς γυναικῶν καὶ παιδίων
  choice: ሴቶችና ልጆች ሳይቆጠሩ
  rationale: χωρίς እዚህ ሴቶችና ልጆች በተጠቀሰው አራት ሺህ ቁጥር ውስጥ እንዳልተካተቱ ያመለክታል፤ ይህ አገላለጽ ትርጉሙን በግልጽና በዘመናዊ አማርኛ ያቀርባል።
