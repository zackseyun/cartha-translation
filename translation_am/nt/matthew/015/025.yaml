  verdict: revise
  source_fidelity: 'The verse is represented accurately overall: the contrast (δέ), the woman’s movement, her reverent bodily action toward Jesus, and her urgent plea are retained. However, «ቀርባ» more specifically means “having approached/drawn near,” whereas ἐλθοῦσα directly states that she came. «መጥታ» is the closer, natural equivalent and does not add a nuance absent from the source.'
  naturalness: The register and syntax are clear, idiomatic modern standard Amharic. «መጥታ … ተንበረከከችና … አለች» is especially smooth and preserves the narrative sequence.
  terminology: «ጌታ ሆይ» appropriately renders Κύριε, and «እርዳኝ» directly conveys βοήθει μοι. «በፊቱ ተንበረከከች» is a suitably non-overdetermined rendering of προσκυνέω; the footnote responsibly preserves «ሰገደችለት» and explains the semantic range without imposing a theological conclusion.
  issues:
  - severity: low
    issue: «ቀርባ» is slightly narrower than ἐλθοῦσα.
    rationale: It can imply “having approached” rather than simply “having come.” Replacing it with «መጥታ» more directly reflects the Greek movement verb while remaining natural in Amharic.
