  text: ἡ δὲ ἐλθοῦσα ⸀προσεκύνει αὐτῷ λέγουσα· Κύριε, βοήθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/025.yaml
  text: But she came and knelt before him[a], saying, “Lord, help me.”
translation:
  language: am
  text: እርሷ ግን መጥታ በፊቱ ተንበረከከችና፣[a] “ጌታ ሆይ፣ እርዳኝ” አለች።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሰገደችለት።” የግሪኩ ግስ እንደ ዐውዱ በአክብሮት መጎንበስን፣ ክብር መስጠትን ወይም ማምለክን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ግን
  rationale: ከቀደመው ንግግር በተቃራኒ ሴቲቱ ልመናዋን እንደቀጠለች የሚያሳየውን መጠነኛ ንፅፅር ያስተላልፋል።
- source_word: ἐλθοῦσα
  choice: ቀርባ
  rationale: ወደ ኢየሱስ መምጣቷን በተፈጥሯዊ አማርኛ ያሳያል፤ የግሪኩን ቦዝ አንቀጽ ከዋናው ድርጊት ጋር ያያይዛል።
- source_word: προσεκύνει αὐτῷ
  choice: በፊቱ ተንበረከከች
  rationale: ቃሉ መስገድን፣ በአክብሮት መጎንበስን ወይም አምልኮን ሊያመለክት ይችላል። ዋናው ጽሑፍ የሰውነት ድርጊቱንና አክብሮቱን ያሳያል፤ የአምልኮ ትርጉሙን ግን በማስታወሻ ይጠብቃል።
- source_word: λέγουσα
  choice: አለች
  rationale: ቀጥተኛውን ንግግር በተፈጥሯዊና አጭር የአማርኛ አገላለጽ ያስተዋውቃል።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: κύριος እዚህ ለኢየሱስ የቀረበ ክብር ያለውና ክብደት ያለው የጥሪ ቃል ነው፤ የአማርኛው የጥሪ ቅርጽም በ«ሆይ» ተገልጿል።
- source_word: βοήθει μοι
  choice: እርዳኝ
  rationale: አስቸኳይና ቀጥተኛ ልመናውን በአጭር፣ ተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: ወደ ኢየሱስ የተደረገውን προσκυνέω መተርጎም
  choice: በፊቱ ተንበረከከች
  alternative: ሰገደችለት
  rationale: የግሪኩ ግስ የአክብሮት መጎንበስን፣ ክብር መስጠትን ወይም ማምለክን ሊገልጽ ይችላል። ዋናው ንባብ የሴቲቱን አካላዊ እንቅስቃሴና አክብሮት ይጠብቃል፤ «ሰገደችለት» የሚለው አማራጭ ደግሞ በማስታወሻ ቀርቦ ቃሉ ሊኖረው የሚችለውን የአምልኮ ትርጉም ሳይዘጋ ይተዋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። «ቀርባ» የሴቲቱን ወደ ኢየሱስ መምጣት በተፈጥሯዊነት ያሳያል፤ «በፊቱ ተንበረከከች» ደግሞ የቃሉን የትርጉም ስፋት ሳያጠብ ትዕይንቱን በግልጽ ያቀርባል።
