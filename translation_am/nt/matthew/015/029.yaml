base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/029.yaml
  text: And departing from there[a], Jesus came along the Sea of Galilee, and after going up on the mountain[b], he sat there.
translation:
  language: am
  text: ኢየሱስም ከዚያ ተነሥቶ በየገሊላ ባሕር ዳር መጣ፤[a] ወደ ተራራውም ወጥቶ በዚያ ተቀምጦ ነበር።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በየገሊላ ባሕር ዳር መጣ” የሚለው “የገሊላን ባሕር ዳር ተከትሎ መጣ” ወይም “ከየገሊላ ባሕር አጠገብ መጣ” ተብሎም ሊተረጎም ይችላል። የግሪኩ መስተዋድድ በዳርቻው ተከትሎ መንቀሳቀስን ወይም በዳርቻው አጠገብ መሆንን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “ተቀምጦ ነበር” በቀላሉ “ተቀመጠ” ተብሎም ሊተረጎም ይችላል፤ ሆኖም የግሪኩ ያልተፈጸመ የጊዜ ቅጽ በዚያ ተቀምጦ መቆየቱን ያሳያል።
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταβὰς ἐκεῖθεν
  choice: ከዚያ ተነሥቶ
  rationale: የቀደመ እንቅስቃሴን የሚገልጠውን የግሪክ የአኦሪስት አንቀጽ በተፈጥሯዊ የአማርኛ ትረካ ያቀርባል፤ ἐκεῖθεν የመነሻ ቦታውን “ከዚያ” ብሎ ያሳያል።
- source_word: ἦλθεν
  choice: መጣ
  rationale: የἔρχομαι ቀጥተኛና በወንጌል ትረካ የተለመደ ትርጉም ነው።
- source_word: παρὰ τὴν θάλασσαν τῆς Γαλιλαίας
  choice: በገሊላ ባሕር ዳር
  rationale: παρά ከተሳቢ ጋር በዳርቻው አጠገብ ወይም በዳርቻው ተከትሎ የሚደረግን እንቅስቃሴ ሊያመለክት ስለሚችል፣ አጭርና ተፈጥሯዊው “በ…ዳር” ተመርጧል።
- source_word: ἀναβὰς εἰς τὸ ὄρος
  choice: ወደ ተራራው ወጥቶ
  rationale: የአቅጣጫውን εἰς እና የመውጣቱን ἀναβαίνω በግልጽ ሁኔታ ይጠብቃል፤ ὄρος እዚህ “ተራራ” ተብሏል።
- source_word: ἐκάθητο ἐκεῖ
  choice: በዚያ ተቀመጠ
  rationale: κάθημαι የመቀመጥን ሁኔታ ይገልጣል። አማርኛ በትረካ ውስጥ “ተቀመጠ” ብሎ በተፈጥሮ ያቀርበዋል፤ አውዱም በዚያ መቆየቱን ያስችላል።
