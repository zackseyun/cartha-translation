id: MAT.15.11
reference: Matthew 15:11
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὐ τὸ εἰσερχόμενον εἰς τὸ στόμα κοινοῖ τὸν ἄνθρωπον, ἀλλὰ τὸ ἐκπορευόμενον ἐκ τοῦ στόματος τοῦτο κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/011.yaml
  text: It is not what enters into the mouth that defiles the man[b][a], but what comes out of the mouth—this defiles the man.
translation:
  language: am
  text: ወደ አፍ የሚገባው ሰውን አያረክስም፤ ነገር ግን ከአፍ የሚወጣው፣ ይህ ሰውን ያረክሳል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ያረክሳል» የሚለው «ርኩስ ያደርገዋል» ተብሎም ሊተረጎም ይችላል፤ የግሪኩ ግስ በንጽሕና ረገድ አንድን ሰው ርኩስ ማድረግን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: κοινοῖ
  choice: ያረክሳል
  rationale: በንጽሕና አውድ ውስጥ ያለውን ሥርዓታዊና ሥነ ምግባራዊ የርኩሰት ኃይል ሁለቱንም ሊይዝ የሚችል፣ በዘመናዊ አማርኛም የተለመደ ምርጫ ነው።
- source_word: τὸ εἰσερχόμενον εἰς τὸ στόμα
  choice: ወደ አፍ የሚገባው
  rationale: በግሪክ እንደ ስም የሚሠራውን ቦዝ አንቀጽ በተፈጥሯዊ አማርኛ ይገልጣል፤ የእንቅስቃሴውንም አቅጣጫ ይጠብቃል።
- source_word: τὸ ἐκπορευόμενον ἐκ τοῦ στόματος
  choice: ከአፍ የሚወጣው
  rationale: የምንጩን ከውስጥ ወደ ውጭ የመውጣት ምስል በግልጽና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἄνθρωπον
  choice: ሰውን
  rationale: ἄνθρωπος በዚህ ስፍራ አንድን ወንድ ብቻ ሳይሆን ማንኛውንም ሰብዓዊ ፍጡር በወካይነት ያመለክታል፤ «ሰው» ይህን በአማርኛ በትክክል ይይዛል።
- source_word: τοῦτο
  choice: እርሱ
  rationale: ሁለተኛውን አካል አጽንዖት ሰጥቶ የሚመልሰውን የግሪኩን አመልካች ቃል በግልጽ ያሳያል።
- source_word: οὐ ... ἀλλὰ
  choice: አይደለም ... ነገር ግን ...
  rationale: በአንቀጹ ውስጥ «አያረክስም፤ ነገር ግን ... ያረክሳል» ተብሎ የተተገበረው የእምቢታና የንጽጽር መዋቅር የምንጩን ጠንካራ ተቃርኖ ይጠብቃል።
theological_decisions:
- issue: በκοινόω ውስጥ ያለው የንጽሕና ትርጉም
  choice: «ያረክሳል» ተብሎ ተተርጉሟል።
  alternative: «ርኩስ ያደርገዋል»
  rationale: «ያረክሳል» ንግግሩን በሥርዓታዊ ርኩሰት ብቻ ሳይገድብ ሥነ ምግባራዊ አንድምታውንም ይጠብቃል።
- issue: የἄνθρωπον አጠቃላይ ወካይነት
  choice: «ሰውን» ተብሎ ተተርጉሟል።
  alternative: «ወንድን»
  rationale: ቃሉ በዚህ አውድ ፆታዊ ገደብ የሌለው አጠቃላይ የሰው ልጅ ማመልከቻ ነው፤ «ወንድን» ማለት የምንጩን ክልል ያጠባል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ንጽጽርና በτοῦτο ላይ ያለው አጽንዖት «እርሱ» በሚለው ተጠብቋል። የእንግሊዝኛው ሁለተኛ ማስታወሻ በአማርኛ አላስፈለገም፤ «ሰው» በተፈጥሮው አጠቃላይ ነው።
