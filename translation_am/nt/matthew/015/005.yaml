id: MAT.15.5
reference: Matthew 15:5
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ λέγετε· Ὃς ἂν εἴπῃ τῷ πατρὶ ἢ τῇ μητρί· Δῶρον ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/005.yaml
  text: But you say[a], ‘Whoever says to his father or his mother, “Whatever you would have benefited from me is a gift,”’
translation:
  language: am
  text: እናንተ ግን፣ “ማንም ለአባቱ ወይም ለእናቱ፣ ‘ከእኔ ልትጠቀምበት የነበረው ማንኛውም ነገር ስጦታ[a] ነው’ ቢል፣” ትላላችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “መባ ነው።” አሳቡ፣ ወላጆችን ለመርዳት ሊውል የሚችለው ነገር ለእግዚአብሔር እንደ ተለየ መገለጹ ነው። “ቁርባን” የሚለውን ቃል የሚጠቀመውን ማርቆስ 7፥11 ያነጻጽሩ።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: እናንተ ግን … ትላላችሁ
  rationale: ግን የδὲን ከቀደመው ትእዛዝ ጋር ያለ ተቃርኖ ያሳያል፤ እናንተ የሚለውም የὑμεῖςን አጽንዖት ይጠብቃል።
- source_word: Ὃς ἂν εἴπῃ
  choice: ማንም … ቢል
  rationale: ከἄν እና ከአዮሪስት ሰብጃንክቲቭ ጋር ያለው ያልተወሰነ አጠቃላይ ሁኔታ በተፈጥሯዊ አማርኛ በዚህ መልክ ተገልጿል።
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: ለአባቱ ወይም ለእናቱ
  rationale: የዳቲቭን ተዘዋዋሪ ተሳቢነትና የነጠላ ሦስተኛ መደብ ባለቤትነትን በግልጽ አማርኛ ያስተላልፋል።
- source_word: Δῶρον
  choice: ስጦታ
  rationale: የቃሉን መሠረታዊ ‘ስጦታ’ ትርጉም ይጠብቃል፤ በዐውደ ንባቡ ለእግዚአብሔር የተለየ መባ መሆኑ በማስታወሻ ተብራርቷል።
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: ከእኔ ልትጠቀምበት የሚገባው ማንኛውም ነገር
  rationale: ἐξ ἐμοῦን ‘ከእኔ’ ብሎ በቀጥታ ይጠብቃል፤ የὠφεληθῇςን ከተናጋሪው ሊገኝ የነበረ ጥቅም በተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: የማርቆስ 7፥11ን ‘ቁርባን’ የሚል ቴክኒካዊ ቃል ወደ ማቴዎስ ጽሑፍ ማስገባት ወይም አለማስገባት
  choice: የማቴዎስን δῶρον ‘ስጦታ’ ብሎ መተርጎም
  alternative: ቁርባን፤ ወይም ለእግዚአብሔር የተሰጠ መባ
  rationale: ማቴዎስ δῶρονን ይጠቀማል እንጂ በማርቆስ 7፥11 የሚገኘውን κορβᾶν አይጠቀምም። ስለዚህ ዋናው ጽሑፍ የማቴዎስን ቃል ይጠብቃል፤ ሃይማኖታዊ አገባቡ በግርጌ ማስታወሻ ይብራራል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የቀጥታ ንግግሩ በአማርኛ የተፈጥሮ ዓረፍተ ነገር አወቃቀር ቀርቧል።
