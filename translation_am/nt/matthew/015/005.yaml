review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the contrast in ὑμεῖς δὲ λέγετε, the indefinite general force of Ὃς ἂν εἴπῃ, the singular parental addressees, and δῶρον as “ስጦታ.” However, “የሚገባው” expresses obligation (“what ought to be”) rather than the support/benefit that the parent would have received, and should be corrected.
  naturalness: The overall register is clear modern standard Amharic. Recasting the benefit clause with “የነበረው” makes the unrealized, prospective support more natural and accurate.
  terminology: “ስጦታ” is an appropriate nontechnical rendering of δῶρον. The note appropriately gives “መባ” as an alternative and explains the dedication context without importing “ቁርባን” into Matthew’s main text.
  issues:
