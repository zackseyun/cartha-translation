  text: This people honors me with their lips[a], but their heart is far from me.
translation:
  language: am
  text: “ይህ ሕዝብ በከንፈሮቻቸው ያከብረኛል፤ ልባቸው ግን ከእኔ የራቀ ነው።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ልቦቻቸው።” በግሪክ ጽሑፍ “ልብ” ነጠላ ነው፤ ሕዝቡን በአንድነት የሚያመለክት ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ λαὸς οὗτος
  choice: ይህ ሕዝብ
  rationale: λαός በአንድነት የታየን ሕዝብ ያመለክታል፤ οὗτος ያለውን ጠቋሚ ኃይልም “ይህ” ይጠብቃል።
- source_word: τοῖς χείλεσίν
  choice: በከንፈሮቻቸው
  rationale: መሣሪያዊውን ዳቲቭ “በ—” ይገልጻል፤ የከንፈርን ተጨባጭ ምስል ከማጥፋት ይልቅ ይጠብቃል።
- source_word: τιμᾷ με
  choice: ያከብረኛል
  rationale: τιμάω እዚህ ክብር መስጠትን ያመለክታል፤ የቀጥታ ተሳቢው με በግሱ ውስጥ “-ኛል” ተካትቷል።
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: ልባቸው ግን
  rationale: καρδία በነጠላ ቁጥር ሲሆን αὐτῶν የብዙ ቁጥር ባለቤትነትን ያሳያል፤ “ልባቸው” በአማርኛ ይህን የጋራ ነጠላ አገላለጽ በተፈጥሮ ይጠብቃል። δέ የንጽጽሩን ኃይል “ግን” በማለት ያሳያል።
- source_word: πόρρω ἀπέχει ἀπ’ ἐμοῦ
  choice: ከእኔ የራቀ ነው
  rationale: ሐረጉ ርቀትን ይገልጻል፤ ይህ አተረጓጎም በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን በአውዱ ያለውን የግንኙነት ርቀትም ሳያብራራ ያስተላልፋል።
theological_decisions:
- issue: የጋራ ነጠላ “ልብ” ወይስ የየግል ብዙ “ልቦች”
  choice: የግሪኩን ነጠላ በመጠበቅ “ልባቸው”
  alternative: “ልቦቻቸው”
  rationale: ነጠላው καρδία ሕዝቡን አንድ የጋራ ውስጣዊ አቋም እንዳለው አካል ሊያቀርብ ይችላል። “ልባቸው” በአማርኛ የነጠላውን ቅርጽና የጋራውን ኃይል ይጠብቃል፤ “ልቦቻቸው” ግን ሊቻል የሚችል የየግል ንባብ ነው።
