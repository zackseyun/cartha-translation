  yaml_path: translation/nt/matthew/015/023.yaml
  text: But he did not answer her a word[a]. And his disciples came and kept asking him, saying, “Send her away[b], because she is crying out behind us.”
translation:
  language: am
  text: እርሱ ግን አንዲት ቃልም አልመለሰላትም። ደቀ መዛሙርቱም ወደ እርሱ ቀርበው፣ “ከኋላችን[b] እየጮኸች ነውና አሰናብታት[a]” እያሉ ደጋግመው ጠየቁት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አርቃት።” ደቀ መዛሙርቱ “ጥያቄዋን ፈጽሞላት አሰናብታት” ማለታቸው ወይም “ከእኛ አርቃት” ማለታቸው በግሪኩ ቃል በግልጽ አልተወሰነም።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ “ተከትላን።” የግሪኩ ቃል ከኋላችን መሆንን ወይም እኛን ተከትላ መሄድን ሊያመለክት ይችላል።
    reason: lexical_alternative
