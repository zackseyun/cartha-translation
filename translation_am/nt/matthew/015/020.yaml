  rationale: የእጅ መታጠብን ጉዳይ በግልጽና ተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: φαγεῖν
  choice: መብላት
  rationale: የግሪኩን የግስ ስም ቅርጽና አጠቃላይ አባባል በቀጥታ ይጠብቃል።
- source_word: ταῦτά ἐστιν τὰ
  choice: እነዚህ ናቸው
  rationale: የጠቋሚውን አጽንዖት ጠብቆ በተፈጥሯዊ አማርኛ የቀደመውን ዝርዝር ያመለክታል።
