  text: These are the things that defile the man[b][a], but to eat with unwashed hands does not defile the man.
translation:
  language: am
  text: ሰውን የሚያረክሱት እነዚህ ናቸው፤[a] ነገር ግን ባልታጠቡ እጆች መብላት ሰውን አያረክስም።
  philosophy: optimal-equivalence
  footnotes:
