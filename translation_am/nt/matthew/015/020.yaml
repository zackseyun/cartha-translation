    text: ወይም፣ «ርኩስ ማድረግ»። የግሪኩ ግስ አንድን ሰው በሥርዓታዊ ሁኔታ ርኩስ ማድረግን ሊያመለክት ይችላል፤ እዚህ «ማርከስ» የንጽሕናውን ዐውድ እና በኢየሱስ ትምህርት ውስጥ ያለውን ሰፊ የሞራል ብልሹነት ሐሳብ ያስቀራል።
    reason: lexical_alternative
lexical_decisions:
- source_word: κοινοῦντα / κοινοῖ
  choice: የሚያረክሱት / አያረክስም
  rationale: በንጽሕና ክርክሩ ውስጥ κοινόω ሰውን ርኩስ ማድረግን ያመለክታል፤ «ማርከስ» ሥርዓታዊ ርኩሰትንም ሆነ ሰፊውን የሞራል እድፈት ፍቺ ሊሸከም ይችላል።
- source_word: ἄνθρωπον
