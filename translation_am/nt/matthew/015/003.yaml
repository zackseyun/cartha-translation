review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the question, the contrastive force of καὶ ὑμεῖς, God’s commandment, and the causal/purposive nuance of διὰ τὴν παράδοσιν ὑμῶν. However, ትተላለፋላችሁ is less idiomatic here for violating a command; ትጥሳላችሁ is the clear and established modern Amharic expression.
  naturalness: The overall register is clear and suitably dignified. መልሶ እንዲህ አላቸው is acceptable, but መልሶም አላቸው is more concise and natural without losing the source sense. Replacing ትተላለፋላችሁ improves idiomatic readability substantially.
  terminology: የእግዚአብሔርን ትእዛዝ and ወጋችሁ appropriately retain the contrast between divine command and the opponents’ transmitted tradition. The wording does not imply a condemnation of all tradition. The footnote appropriately preserves the possible ‘for the sake of’ shade of διά with the accusative.
  issues:
  - severity: medium
    issue: ትተላለፋላችሁ for παραβαίνετε
    rationale: Although it can suggest crossing or overstepping, it is not the most natural Amharic collocation with ትእዛዝ and may sound spatial or ambiguous. ትእዛዝን መጣስ directly and naturally conveys violation of a command.
  - severity: low
    issue: እንዲህ in the introductory clause
    rationale: The Greek says ‘answered and said to them’ but does not contain a deictic equivalent of ‘thus.’ The addition is not misleading, yet omitting it gives a closer and smoother rendering.
  revised_text: እርሱ ግን መልሶም አላቸው፦ “እናንተስ ደግሞ በወጋችሁ ምክንያት[a] የእግዚአብሔርን ትእዛዝ ለምን ትጥሳላችሁ?”
