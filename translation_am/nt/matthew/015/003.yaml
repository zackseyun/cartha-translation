id: MAT.15.3
reference: Matthew 15:3
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Διὰ τί καὶ ὑμεῖς παραβαίνετε τὴν ἐντολὴν τοῦ θεοῦ διὰ τὴν παράδοσιν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/003.yaml
  text: But he answered and said to them[a], “Why do you also transgress the commandment of God for the sake of your tradition?”
translation:
  language: am
  text: እርሱ ግን መልሶም አላቸው፦ “እናንተስ ደግሞ በወጋችሁ ምክንያት[a] የእግዚአብሔርን ትእዛዝ ለምን ትጥሳላችሁ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለወጋችሁ ስትሉ።”
    reason: διά ከተሳቢ ጋር የሚገልጸውን የምክንያት ፍቺ ያስቀምጣል፤ በዚህ አውድ ሊኖረው የሚችለውን ‘ለወጋችሁ ስትሉ’ የሚል ጥላም ይጠብቃል።
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: መልሶ እንዲህ አላቸው
  rationale: የግሪክኛውን የሴማዊ ቅርጽ ክብደት ሳያጠፋ፣ በዘመናዊ አማርኛ ተፈጥሯዊ የሆነውን ‘መልሶ … አላቸው’ ይጠቀማል።
- source_word: Διὰ τί
  choice: ለምን
  rationale: ምክንያትን የሚጠይቀውን ጥያቄ በተፈጥሯዊና ግልጽ አማርኛ ያቀርባል።
- source_word: καὶ ὑμεῖς
  choice: እናንተስ ደግሞ
  rationale: ኢየሱስ ቀደም ሲል ለቀረበው ክስ የሚመልሰውን ‘እናንተም’ የሚል ንጽጽራዊ ኃይል ይጠብቃል።
- source_word: παραβαίνετε
  choice: ትተላለፋላችሁ
  rationale: ትእዛዝን ማለፍ ወይም መጣስ የሚለውን ፍቺ በመጽሐፍ ቅዱሳዊ ክብርና በዘመናዊ ግልጽነት ያስተላልፋል።
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: የእግዚአብሔርን ትእዛዝ
  rationale: የመለኮታዊውን ትእዛዝ ሥልጣን የሚጠብቅ ቀጥተኛና የተለመደ አተረጓጎም ነው።
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: በወጋችሁ ምክንያት
  rationale: διά ከተሳቢ ጋር እዚህ የሚገልጸውን ምክንያት ያሳያል፤ ‘ወጋችሁ’ ደግሞ የተላለፈ ልማድን ይገልጻል እንጂ ባሕልን ሁሉ አያወግዝም።
theological_decisions:
- issue: በእግዚአብሔር ትእዛዝና በሰው ወግ መካከል ያለው ንጽጽር
  choice: ‘የእግዚአብሔርን ትእዛዝ’ እና ‘ወጋችሁ’ የሚሉትን ቀጥተኛ ንጽጽር መጠበቅ
  alternative: παράδοσιςን ‘ትምህርት’ ወይም ‘ልማድ’ ብሎ መተርጎም
  rationale: ቁጥሩ የሚነቅፈው በጉዳዩ ላይ ያለውን ‘የእናንተ ወግ’ ነው፤ ወግን ወይም ባሕልን ሁሉ እንደሚያወግዝ ተደርጎ እንዳይሰፋ ባለቤትነቱ በግልጽ ተጠብቋል።
- issue: διά የሚያመለክተው ምክንያት ወይም ጥቅም
  choice: በወጋችሁ ምክንያት
  alternative: ለወጋችሁ ስትሉ
  rationale: ዋናው ጽሑፍ የምክንያትን ፍቺ ይጠብቃል፤ በአውዱ ሊሰማ የሚችለው የ‘ለወጉ ሲባል’ ጥላ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ ነው። ‘እናንተስ ደግሞ’ የመልሱን ንጽጽራዊ ኃይል ይጠብቃል፤ ‘ወግ’ ደግሞ ከ‘ትእዛዝ’ ጋር ያለውን ዋና ንጽጽር ሳያደበዝዝ ተፈጥሯዊ አማርኛ ይሰጣል።
