  terminology: “ጌታ ሆይ” appropriately retains the possible range of κύριε in address to Jesus. “ትንንሽ ውሾች” safely represents the diminutive κυνάρια without importing the unsupported age-specific sense ‘puppies.’ “ጌቶቻቸው” is suitable within the household metaphor.
  issues:
