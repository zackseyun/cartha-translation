  verdict: revise
  source_fidelity: The draft preserves the principal imagery and the diminutive nuance of κυνάρια, but it renders καὶ γάρ adversatively as “ነገር ግን” (‘but’), whereas the Greek is explanatory and intensifying (‘for even’). It also makes the crumbs the direct object rather than retaining the source’s ‘eat from the crumbs’ construction.
