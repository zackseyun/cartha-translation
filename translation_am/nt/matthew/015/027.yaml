  text: እርሷ ግን፣ “አዎን፣ ጌታ ሆይ፤[a] ምክንያቱም ትንንሽ ውሾች እንኳ[b] ከጌቶቻቸው ማዕድ ከሚወድቁት ፍርፋሪዎች ይበላሉ” አለች።
  philosophy: optimal-equivalence
  footnotes:
