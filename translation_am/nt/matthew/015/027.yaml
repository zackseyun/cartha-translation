    rationale: καὶ γάρ introduces the woman’s supporting explanation and includes an intensifying ‘even’; it does not mean ‘but.’
  - severity: medium
    issue: The draft says the dogs eat the falling crumbs, rather than eat from crumbs that fall.
    rationale: 'The Greek has ἐσθίει ἀπὸ τῶν ψιχίων: ‘eat from the crumbs.’ Retaining ከ (‘from’) better reflects the source relationship and preserves the wording of the metaphor.'
