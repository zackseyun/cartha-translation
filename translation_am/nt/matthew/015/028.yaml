id: MAT.15.28
reference: Matthew 15:28
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τότε ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτῇ· Ὦ γύναι, μεγάλη σου ἡ πίστις· γενηθήτω σοι ὡς θέλεις. καὶ ἰάθη ἡ θυγάτηρ αὐτῆς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/028.yaml
  text: Then Jesus answered her[a], “O woman, great is your faith[b]; let it be done for you as you desire.” And her daughter was healed from that hour.
translation:
  language: am
  text: ከዚያም ኢየሱስ መልሶ፣ “አንቺ ሴት ሆይ፣ እምነትሽ[a] ታላቅ ነው፤ እንደፈለግሽ ይሁንልሽ” አላት። ሴት ልጇም ከዚያች ሰዓት[b] ጀምሮ ተፈወሰች።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “መታመንሽ።” የግሪኩ πίστις በዚህ አውድ ‘እምነት’ ወይም ‘መታመን’ የሚል ስሜት ሊኖረው ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ከዚያች ቅጽበት።” ግሪኩ ቃል በቃል “ከዚያች ሰዓት” ይላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: ከዚያም
  rationale: የኢየሱስን ምላሽ ከቀደመው ውይይት ጋር የሚያገናኝ ተፈጥሯዊ የጊዜና የትረካ አገናኝ ነው።
- source_word: ἀποκριθεὶς … εἶπεν αὐτῇ
  choice: መልሶ … አላት
  rationale: የግሪኩን ሁለት የንግግር ግሶች በተፈጥሯዊ የአማርኛ አነጋገር ያቀርባል፤ αὐτῇ የሚያመለክተውም በ‘አላት’ ተጠብቋል።
- source_word: Ὦ γύναι
  choice: አንቺ ሴት ሆይ
  rationale: ቀጥተኛውን አድራሻና የὮን አጽንዖት ይጠብቃል፤ በዚህ አውድ ንቀትን ሳይጨምር የተከበረ ቃና አለው።
- source_word: μεγάλη σου ἡ πίστις
  choice: እምነትሽ ታላቅ ነው
  rationale: ትርጉሙንና አጽንዖቱን በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: γενηθήτω σοι
  choice: ይሁንልሽ
  rationale: የግሪኩን ትእዛዛዊና ፈጻሚ ኃይል በአጭር ተፈጥሯዊ አማርኛ ያስተላልፋል፤ σοι በ‘ልሽ’ ተጠብቋል።
- source_word: ὡς θέλεις
  choice: እንደፈለግሽ
  rationale: የሴቲቱን ፈቃድ ወይም ምኞት በዘመናዊና ክቡር አገላለጽ ያቀርባል።
- source_word: ἰάθη
  choice: ተፈወሰች
  rationale: የግሪኩን ተደራጊ ቅርጽና በተአምሩ አውድ ያለውን የመፈወስ ትርጉም ይጠብቃል።
- source_word: ἡ θυγάτηρ αὐτῆς
  choice: ሴት ልጇ
  rationale: θυγάτηρ በግልጽ ሴት ልጅን ስለሚያመለክት የዝምድናውን ቃል በትክክል ይገልጣል።
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: ከዚያች ሰዓት ጀምሮ
  rationale: የግሪኩን ቃል በቃል የጊዜ አገላለጽ ይጠብቃል፤ በአውዱ ‘ከዚያች ቅጽበት’ የሚለውንም ሐሳብ ሊያመለክት ይችላል።
theological_decisions:
- issue: በኢየሱስ ምስጋና ውስጥ πίστις የሚለው ቃል
  choice: እምነት
  alternative: መታመን
  rationale: በዚህ አውድ ሴቲቱ በኢየሱስ ላይ ያደረገችውን እምነትና ተማምኖ መለመኗን ያመለክታል። ‘እምነት’ ዋናውን ሥነ መለኮታዊ ቃል ሲጠብቅ፣ ‘መታመን’ የሚለው ተቀራራቢ ስሜት በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር አማርኛ ተጠቅሟል። ‘ሆይ’ የὮን ቀጥተኛ አድራሻና አጽንዖት ለማቆየት ተመርጧል፤ አገላለጹ በዚህ አውድ አክብሮታዊ እንጂ ጨካኝ አይደለም።
