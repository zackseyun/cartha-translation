id: MAT.15.32
reference: Matthew 15:32
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς προσκαλεσάμενος τοὺς μαθητὰς αὐτοῦ εἶπεν· Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον, ὅτι ἤδη ἡμέραι τρεῖς προσμένουσίν μοι καὶ οὐκ ἔχουσιν τί φάγωσιν· καὶ ἀπολῦσαι αὐτοὺς νήστεις οὐ θέλω, μήποτε ἐκλυθῶσιν ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/032.yaml
  text: Then Jesus called his disciples to him and said[a], “I have compassion on the crowd, because they have already remained with me for three days and have nothing to eat. And I do not want to send them away hungry[d][c][b], lest they collapse on the way.”
translation:
  language: am
  text: ከዚያም ኢየሱስ ደቀ መዛሙርቱን ወደ እሱ ጠርቶ እንዲህ አለ፤ “ለሕዝቡ ርኅራኄ አለኝ፤ አሁን ሦስት ቀን ከእኔ ጋር ቆይተዋልና፣ የሚበሉትም የላቸውም።[a] በመንገድ እንዳይዝሉ ምግብ ሳይበሉ እንዲሄዱ ልሰዳቸው አልፈልግም።”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለሕዝቡ ጥልቅ ርኅራኄ ተሰምቶኛል።”
    reason: lexical_alternative
  - marker: b
    text: “እንዳይዝሉ” የሚለው “እንዳይደክሙ” ወይም “እንዳይወድቁ” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: ወደ እሱ ጠርቶ
  rationale: የመካከለኛ ድምፁንና ደቀ መዛሙርቱን ወደ ራሱ መጥራቱን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Σπλαγχνίζομαι
  choice: አዝንላቸዋለሁ
  rationale: ጥልቅ ርኅራኄን በዘመናዊና ለአንባቢ ግልጽ በሆነ አገላለጽ ያስተላልፋል፤ እዚህ ‘ማዘን’ ርኅራኄን ማሳየት እንጂ ሐዘንን ብቻ አያመለክትም።
- source_word: ὄχλον
  choice: ሕዝቡ
  rationale: በትረካው የተሰበሰበውን ብዙ ሰው የሚያመለክት ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
- source_word: ἤδη ἡμέραι τρεῖς προσμένουσίν μοι
  choice: ከእኔ ጋር ሦስት ቀን ሙሉ ስለቆዩ
  rationale: ከኢየሱስ ጋር በቀጣይነት መቆየታቸውንና የጊዜውን ርዝመት ያሳያል፤ ‘ሙሉ’ ἤδη ከሦስቱ ቀናት ጋር የሚሰጠውን አጽንዖት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: οὐκ ἔχουσιν τί φάγωσιν
  choice: የሚበሉት ስለሌላቸው
  rationale: ምግብ እንደሌላቸው የሚገልጠውን የግሪክ ፈሊጥ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἀπολῦσαι
  choice: ልሰዳቸው
  rationale: የተሰበሰበውን ሕዝብ መልቀቅን ወይም ወደየቤቱ መላክን በአውዱ በግልጽ ያሳያል።
- source_word: νήστεις
  choice: ሳይበሉ
  rationale: ቃሉ በቀጥታ ያለ ምግብ መሆንን ያመለክታል፤ እዚህ ሃይማኖታዊ ጾም ሳይሆን ምግብ አለመብላት መሆኑን አገላለጹ ያስጠብቃል።
- source_word: μήποτε ἐκλυθῶσιν
  choice: እንዳይዝሉ
  rationale: μήποτε የሚገልጠውን የተፈራ ውጤትና ἐκλύομαι የሚያመለክተውን በድካም መዛል በአንድ ተፈጥሯዊ አማርኛ ሐረግ ይይዛል።
- source_word: ἐν τῇ ὁδῷ
  choice: በመንገድ
  rationale: ወደሚሄዱበት ሲጓዙ የሚለውን ትርጉም በአጭርና ተፈጥሯዊ መንገድ ይገልጣል።
