  text: But he said[a], “Are you also still without understanding?”
translation:
  language: am
  text: እርሱ ግን፣ “እናንተም እስካሁን ማስተዋል የጎደላችሁ ናችሁን?” አለ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: ግን
  rationale: በደቀ መዛሙርቱ ጥያቄና በኢየሱስ መልስ መካከል ያለውን መጠነኛ ንጽጽርና የንግግር ሽግግር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὁ … εἶπεν
  choice: እርሱ … አለ
  rationale: ὁ በዚህ ስፍራ ኢየሱስን የሚያመለክት ተውላጠ ስማዊ ተግባር አለው፤ εἶπεν ደግሞ በትረካ የተለመደውን ‘አለ’ ይሰጣል።
- source_word: Ἀκμὴν
  choice: እስካሁን
  rationale: ደቀ መዛሙርቱ ከቀደመው ትምህርት በኋላም ግንዛቤ እንደጎደላቸው የሚያሳየውን ‘እስከዚህ ጊዜ ድረስ’ የሚለውን ጊዜያዊ አጽንዖት ይጠብቃል።
- source_word: καὶ ὑμεῖς
  choice: እናንተም
  rationale: ግልጽ የሆነውን ὑμεῖς እና የመደመር አጽንዖት ያለውን καὶ በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀσύνετοί ἐστε
  choice: የማታስተውሉ ናችሁን?
  rationale: ቃሉ የግንዛቤና የማስተዋል እጥረትን ይገልጣል። ይህ አገላለጽ ጥያቄውንና ተግሣጹን ሳያከብድ በዘመናዊ አማርኛ በግልጽ ያቀርባል።
theological_decisions:
- issue: ኢየሱስ ለደቀ መዛሙርቱ የሰጠው ተግሣጽ ድምፀት
  choice: ቀጥተኛ ሆኖም ያልተጋነነ የቀጣይ አለማስተዋል ጥያቄ
  alternative: “እናንተም ገና ደንቆሮዎች ናችሁን?”
  rationale: ἀσύνετοι በዚህ አውድ የማስተዋል እጥረትን ያመለክታል፤ ከዚያ በላይ ከባድ የሞራል ውግዘት ማስገባት የግሪኩን ቃና ያጋንናል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። በእንግሊዝኛው የቀረበው [a] ማስታወሻ ከዋናው ንባብ ጋር ተመሳሳይ ስለሆነና በቀረበው የግሪክ ማስረጃ ላይ ትርጉማዊ አማራጭ ስለማያቀርብ አልተካተተም።
