base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/026.yaml
  text: But he answered[a], “It is not right to take the children's bread and throw it to the little dogs.”
translation:
  language: am
  text: እርሱ ግን መልሶ እንዲህ አለ፤ “የልጆቹን ዳቦ ወስዶ ለትንንሽ ውሾች[a] መጣል ተገቢ አይደለም።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ለቤት ውሾች” ወይም “ለቡችሎች”፤ የግሪኩ ቃል አነስተኛ ቅርጽ ያለው ሲሆን፣ በጎዳና ከሚዞሩ ውሾች ይልቅ ትንንሽ ወይም የቤት ውሾችን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: መልሶ … አለ
  rationale: የግሪኩን ተሳቢ ግስና ዋና ግስ በተፈጥሯዊ የአማርኛ አገላለጽ ያቀርባል፤ ንግግሩም ለቀደመው ንግግር ምላሽ መሆኑን ይጠብቃል።
- source_word: καλὸν
  choice: ተገቢ
  rationale: በዚህ አገባብ ቃሉ ስለ ተገቢነት ወይም ስለ አግባብነት ይናገራል፤ “ተገቢ” ይህን ፍቺ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: λαβεῖν
  choice: ወስዶ
  rationale: ነገሩን ማንሳትና ወደ ሌላ መውሰድ የሚለውን ቀጥተኛ የአገባቡን ፍቺ ያሳያል።
- source_word: ἄρτον
  choice: እንጀራ
  rationale: በአማርኛ የዕለት ምግብንና የተጋገረ መብልን በተፈጥሯዊ ሁኔታ የሚገልጽ ቃል ሲሆን የምሳሌውን ምስል ይጠብቃል።
- source_word: τέκνων
  choice: የልጆችን
  rationale: τέκνα ጾታን ሳይለይ “ልጆች” ማለት ነው፤ የባለቤትነት ዝምድናውም በአማርኛ በግልጽ ተጠብቋል።
- source_word: βαλεῖν
  choice: መጣል
  rationale: የβάλλωን ቀጥተኛና ሕያው ምስል ይጠብቃል፤ “መስጠት” ብሎ አያለዝበውም።
- source_word: κυναρίοις
  choice: ለትንንሽ ውሾች
  rationale: የግሪኩ ቃል አነስተኛ ቅርጽ ያለው ስለሆነ “ትንንሽ” ያንን ልዩነት ይጠብቃል፤ ቃሉ የቤት ውሾችን ወይም ቡችሎችንም ሊያመለክት ይችላል።
theological_decisions:
- issue: የልጆችና የውሾች ምሳሌ ማንን እንደሚወክልና የንግግሩ ቃና
  choice: ምሳሌውን “የልጆችን እንጀራ” እና “ለትንንሽ ውሾች” ብሎ በቀጥታ ማቆየት
  alternative: በዋናው ጽሑፍ ልጆቹና ውሾቹ የሚወክሏቸውን ወገኖች በትርጓሜ መግለጽ
  rationale: ቁጥሩ ራሱ የምሳሌውን ተወካዮች በግልጽ አይሰይምም። ስለዚህ ትርጉሙ የአውዱን ውጥረትና እውነተኛ አሻሚነት ይጠብቃል እንጂ በዋናው ጽሑፍ አይፈታውም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ። “ተገቢ አይደለም” የκαλόνን የአግባብነት ፍቺ ያቀርባል፤ “ትንንሽ ውሾች” ደግሞ የκυνάριαን አነስተኛ ቅርጽ ሳያስወግድ ምሳሌውን በቀጥታ ያቆያል።
