id: MAT.15.12
reference: Matthew 15:12
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Τότε προσελθόντες οἱ ⸀μαθηταὶ ⸀λέγουσιν αὐτῷ· Οἶδας ὅτι οἱ Φαρισαῖοι ἀκούσαντες τὸν λόγον ἐσκανδαλίσθησαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/012.yaml
  text: Then the disciples came and said to him[b][a], “Do you know that the Pharisees were offended when they heard this word?”
translation:
  language: am
  text: ከዚያም ደቀ መዛሙርቱ ወደ እርሱ ቀርበው፣ “ፈሪሳውያን ይህን ንግግር[b] ሲሰሙ ቅር እንደተሰኙ[a] ታውቃለህ?” አሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ተከፉ”፤ ይበልጥ ቃል በቃል፣ “ተሰናከሉ።”
    reason: lexical_alternative
  - marker: b
    text: “ይህ ንግግር” የሚያመለክተው ኢየሱስ ከዚህ በፊት የተናገረውን ነው።
    reason: cross_reference
lexical_decisions:
- source_word: Τότε
  choice: ከዚያም
  rationale: በትረካው ውስጥ ቀጥሎ የተፈጸመውን ክስተት የሚያስተዋውቅ ተፈጥሯዊ የጊዜ ማያያዣ ነው።
- source_word: προσελθόντες
  choice: ወደ እርሱ ቀርበው
  rationale: ወደ ኢየሱስ መቅረባቸውን በግልጽ ያሳያል፤ ከዋናው ግስ ጋር ያለውን የግሪክ አሳታፊ ግስ አወቃቀርም በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: οἱ μαθηταὶ
  choice: ደቀ መዛሙርቱ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደና ለዘመናዊ አንባቢም የሚታወቅ ቃል ነው፤ ግሪኩ ‘የእርሱ’ የሚል ባለቤትነት በግልጽ ስለሌለው አልተጨመረም።
- source_word: λέγουσιν αὐτῷ
  choice: አሉት
  rationale: ታሪካዊውን የአሁን ጊዜ ግስ በአማርኛ ትረካ የተለመደው ባለፈ ጊዜ በተፈጥሯዊነት ይገልጻል።
- source_word: Οἶδας
  choice: ታውቃለህ?
  rationale: ቀጥተኛውን ጥያቄ ያለ ተጨማሪ ትርጓሜ ያቀርባል።
- source_word: οἱ Φαρισαῖοι
  choice: ፈሪሳውያን
  rationale: የቡድኑ ስም በአማርኛ የተለመደበት መልክ ነው።
- source_word: ἀκούσαντες τὸν λόγον
  choice: ይህን ንግግር ሲሰሙ
  rationale: λόγος በዚህ ዐውድ ኢየሱስ ቀደም ሲል የተናገረውን ሐሳብ ያመለክታል፤ ‘ንግግር’ ይህን በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἐσκανδαλίσθησαν
  choice: ቅር እንደተሰኙ
  rationale: በዐውዱ የፈሪሳውያንን አሉታዊ ምላሽ በተፈጥሯዊ አማርኛ ይገልጻል፤ ቃሉ በቀጥታ ‘መሰናከል’ የሚለውን ምስል እንደሚይዝ በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: σκανδαλίζω በዚህ ዐውድ የሚያመለክተው ምላሽ
  choice: ቅር እንደተሰኙ
  alternative: እንደተሰናከሉ
  rationale: ዐውዱ በመጀመሪያ ደረጃ ፈሪሳውያን በኢየሱስ ንግግር ቅር መሰኘታቸውን ያሳያል። ስለ እምነት መውደቅ ወይም ስለ ክህደት ያልተገለጸ መደምደሚያ አልተጨመረም፤ የቃሉ ቀጥተኛ ምስል ግን በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ አሳታፊ ግሶች በአማርኛ ተፈጥሯዊ የዓረፍተ ነገር ቅደም ተከተል ቀርበዋል፤ የትርጉም አማራጮችና የቀደመው ንግግር ማጣቀሻ በማስታወሻዎች ተገልጸዋል።
