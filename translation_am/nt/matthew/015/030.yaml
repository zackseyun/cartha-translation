  text: καὶ προσῆλθον αὐτῷ ὄχλοι πολλοὶ ἔχοντες μεθ’ ἑαυτῶν ⸂κωφούς, τυφλούς, χωλούς, κυλλούς⸃, καὶ ἑτέρους πολλούς, καὶ ἔρριψαν αὐτοὺς παρὰ τοὺς πόδας ⸀αὐτοῦ, καὶ ἐθεράπευσεν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/030.yaml
  text: And large crowds came to him[a], bringing with them the mute, the blind, the lame, the crippled, and many others, and they laid them at his feet[b], and he healed them.
translation:
  language: am
  text: ብዙ ሰዎችም ዲዳዎችን[a]፣ ዕውሮችን፣ አንካሶችን፣ እጅ ወይም እግራቸው ላይ እክል ያለባቸውን[b]፣ እና ሌሎች ብዙዎችን ይዘው ወደ እርሱ መጡ፤ በእግሩም አጠገብ አስቀመጧቸው፤ እርሱም ፈወሳቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ደንቆሮዎች»። የግሪኩ κωφούς ቃል መስማት የማይችሉ፣ መናገር የማይችሉ፣ ወይም ሁለቱንም ሊያመለክት ይችላል፤ እንደ አውዱ ይወሰናል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «አካላቸው የጎደለ ወይም የተጣመመ ሰዎች»። የግሪኩ κυλλούς ቃል በስፋት የእጅ ወይም የእግር እክል፣ ጉዳት ወይም መጣመም ያለባቸውን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον
  choice: ወደ እርሱ መጡ
  rationale: ወደ አንድ ሰው መቅረብን ወይም መምጣትን በተፈጥሯዊ የአማርኛ አገላለጽ ያሳያል።
- source_word: ὄχλοι πολλοὶ
  choice: ብዙ ሕዝብ
  rationale: በአማርኛ የሰዎችን ብዛት በተፈጥሯዊና በጋራ ስም ይገልጣል።
- source_word: ἔχοντες μεθ’ ἑαυτῶν
  choice: ይዘው
  rationale: ቃል በቃል ‘ከእነርሱ ጋር ኖሯቸው’ የሚለውን በዐውዱ የማምጣት ትርጉም በአጭርና ተፈጥሯዊ መንገድ ያቀርባል።
- source_word: κωφούς
  choice: ዲዳዎችን
  rationale: κωφός መስማት ወይም መናገር ያለመቻልን፣ አንዳንዴም ሁለቱንም ሊያመለክት ይችላል። በቅርብ ዐውድ ቁጥር 31 ላይ ዲዳዎች መናገራቸው ስለሚጠቀስ ‘ዲዳዎች’ ተመርጧል።
- source_word: τυφλούς
  choice: ዕውሮችን
  rationale: τυφλόςን በትክክልና በተለመደ መንገድ ይተረጉማል።
- source_word: χωλούς
  choice: አንካሶችን
  rationale: በእግር እንቅስቃሴ ችግር ያለባቸውን ሰዎች የሚገልጽ ተለምዶ ያለው አጭር ቃል ነው።
- source_word: κυλλούς
  choice: እጅና እግራቸው የተጎዳባቸውን
  rationale: ቃሉ የእጅ ወይም የእግር መጉደልን፣ መጣመምን ወይም ከባድ መጎዳትን በስፋት ያመለክታል። ይህ አገላለጽ የቃሉን ስፋት ያለ አስከፊ ስያሜ ያስተላልፋል።
- source_word: ἑτέρους πολλούς
  choice: ሌሎች ብዙዎችን
  rationale: ከተዘረዘሩት በተጨማሪ ብዙ ሌሎች ሰዎች መኖራቸውን በቀጥታ ያሳያል።
- source_word: ἔρριψαν
  choice: አስቀመጧቸው
  rationale: ግሱ በቃል ትርጉሙ ‘ወረወሩ’ ሊሆን ቢችልም፣ በዚህ ዐውድ ሰዎቹን በኢየሱስ እግር አጠገብ ማኖርን ያመለክታል፤ ‘ወረወሩ’ ያልተጠቆመ ጭካኔ ሊያሰማ ይችላል።
- source_word: παρὰ τοὺς πόδας αὐτοῦ
  choice: በእግሩ አጠገብ
  rationale: παρά ከተሳቢ ጋር የቅርበትን ቦታ—በእግሮቹ አጠገብ—ያሳያል።
- source_word: ἐθεράπευσεν
  choice: ፈወሳቸው
  rationale: በወንጌላት የፈውስ ትረካ ውስጥ θεραπεύωን በተለመደና ትክክለኛ መንገድ ይተረጉማል።
