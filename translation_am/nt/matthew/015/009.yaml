  text: μάτην δὲ σέβονταί με, διδάσκοντες διδασκαλίας ἐντάλματα ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/009.yaml
  text: But they worship me in vain[b][a], teaching as doctrines the commandments of men.
translation:
  language: am
  text: ነገር ግን፣ የሰዎችን ትእዛዛት እንደ ትምህርቶች እያስተማሩ፣ በከንቱ ያመልኩኛል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “የሰዎችን ትእዛዛት ትምህርቶች አድርገው እያስተማሩ።”
    reason: የግሪክ ሐረጉን የአገባብ አማራጭ ለማሳየት።
lexical_decisions:
- source_word: μάτην
  choice: በከንቱ
  rationale: ‘ያለ ፍሬ፣ ያለ ጥቅም’ የሚለውን ፍቺና የትንቢታዊውን ወቀሳ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: በዐውዱ ያለውን ቀላል ተቃርኖና የወቀሳ ኃይል ያሳያል።
- source_word: σέβονταί με
  choice: ያመልኩኛል
  rationale: ለእግዚአብሔር የቀረበ አምልኮን በግልጽና በተለመደ መንፈሳዊ ቃል ይገልጻል።
- source_word: διδάσκοντες
  choice: እያስተማሩ
  rationale: የአምልኳቸውን ከንቱነት የሚያብራራውን ተጓዳኝ ድርጊት ሳያጠብብ ያቆያል።
- source_word: διδασκαλίας
  choice: እንደ ትምህርት
  rationale: የሰዎች ትእዛዛት የሥልጣን ትምህርት አድርገው እንደሚያቀርቧቸው ያሳያል።
- source_word: ἐντάλματα
  choice: ትእዛዛት
  rationale: የታዘዙ ደንቦችን የሚያመለክተውን መደበኛ ሃይማኖታዊ ፍቺ ይጠብቃል።
- source_word: ἀνθρώπων
  choice: የሰዎችን
  rationale: ቃሉ ወንዶችን ብቻ ሳይሆን ሰውን በአጠቃላይ የሚያመለክት ስለሆነ፣ ከመለኮታዊ ትእዛዝ ጋር ያለውን ተቃርኖ በትክክል ያስተላልፋል።
theological_decisions:
- issue: የδιδασκαλίας ἐντάλματα ἀνθρώπων አገባብ
  choice: የሰዎችን ትእዛዛት እንደ ትምህርት እያስተማሩ
  alternative: ትምህርቶችን፣ የሰዎችን ትእዛዛት፣ እያስተማሩ
  rationale: የግሪክ አገባቡ የተጨመቀ ቢሆንም፣ የሰው ትእዛዛትን እንደ ሥልጣን ያለው ትምህርት ማቅረባቸውን ይጠቁማል፤ የተመረጠው አተረጓጎም ይህን በተፈጥሯዊ አማርኛ ያቀርባል።
- issue: የἀνθρώπων አጠቃላይ ፍቺ
  choice: የሰዎች
  alternative: ሰብአዊ
  rationale: ምንጩ ሰውን በአጠቃላይ ከመለኮታዊው ጋር ያነጻጽራል፤ ‘የሰዎች’ የጾታ ገደብ ሳያስገባ ይህን ንጽጽር ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ትእዛዛት’ የሚለው መጽሐፍ ቅዱሳዊ ክብደትን ሲጠብቅ፣ ‘የሰዎች’ የሚለው ደግሞ የግሪኩን አጠቃላይ ሰብአዊ ፍቺ ያስተላልፋል።
