  verdict: revise
  source_fidelity: The draft accurately conveys μάτην (‘በከንቱ’), the God-directed worship, and the attendant participle ‘teaching.’ However, διδασκαλίας is plural; singular ‘እንደ ትምህርት’ slightly levels the source’s plural expression.
  naturalness: The sentence is otherwise clear, dignified, and natural in modern standard Amharic. Using plural ‘ትምህርቶች’ is equally natural and improves precision.
  terminology: ‘ያመልኩኛል,’ ‘ትእዛዛት,’ and ‘የሰዎች’ are appropriate. ‘የሰዎች’ correctly retains the generic-human contrast without introducing a male-only sense.
  issues:
