    issue: The rendering of διδασκαλίας is singular.
    rationale: The Greek has the plural accusative διδασκαλίας. Rendering it ‘እንደ ትምህርቶች’ preserves the plurality and the compressed relationship in which human commands are presented as authoritative teachings.
