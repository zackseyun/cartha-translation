id: MAT.15.31
reference: Matthew 15:31
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὥστε ⸂τὸν ὄχλον⸃ θαυμάσαι βλέποντας κωφοὺς λαλοῦντας ⸂κυλλοὺς ὑγιεῖς⸃ ⸀καὶ χωλοὺς περιπατοῦντας καὶ τυφλοὺς βλέποντας· καὶ ἐδόξασαν τὸν θεὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/031.yaml
  text: so that the crowd marveled as they saw the mute speaking, the crippled made well, the lame walking, and the blind seeing; and they glorified the God of Israel.
translation:
  language: am
  text: ከዚህም የተነሣ ሕዝቡ ዲዳዎች ሲናገሩ፣ አካላቸው የተጎዳ ሰዎች ደኅና ሲሆኑ፣ አንካሶች ሲራመዱ፣ ዕውሮችም ሲያዩ ባየ ጊዜ ተደነቀ፤ የእስራኤልንም አምላክ አከበሩ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: ተደነቁ
  rationale: የὥστεን ውጤታዊ ኃይል በአማርኛው ተከታታይ አወቃቀር ውስጥ በተፈጥሮ ተካቷል፤ ቀዳሚው ፈውስ ሕዝቡን ለመደነቅ እንዳደረሰ ያሳያል።
- source_word: τὸν ὄχλον
  choice: ሕዝቡ
  rationale: በትረካው የተሰበሰበውን ብዙ ሰው በተፈጥሯዊና ግልጽ ዘመናዊ አማርኛ ይገልጣል።
- source_word: θαυμάσαι
  choice: ተደነቁ
  rationale: ተአምራቱን በማየታቸው የተነሣውን እጅግ የመገረም ምላሽ ያስተላልፋል።
- source_word: βλέποντας
  choice: ተመልክተው
  rationale: የሕዝቡ መደነቅ በዓይናቸው ባዩት ነገር ምክንያት መሆኑን ይገልጣል።
- source_word: κωφοὺς
  choice: ዲዳዎች
  rationale: κωφός ደንቆሮ ወይም ዲዳ ሊል ቢችልም፣ λαλοῦντας ‘ሲናገሩ’ የሚለው ቅርብ አውድ ንግግር የማይችሉትን እንደሚያመለክት ያሳያል።
- source_word: λαλοῦντας
  choice: ሲናገሩ
  rationale: የተመለሰውን የመናገር ችሎታ ቀጥተኛና ተፈጥሯዊ በሆነ አማርኛ ያቀርባል።
- source_word: κυλλοὺς
  choice: እጅና እግራቸው የጎደለ ሰዎች
  rationale: ቃሉ የተጎዳ፣ የጎደለ ወይም ቅርጹ የተበላሸ እጅና እግር ያላቸውን ሰዎች ያመለክታል፤ ይህ አገላለጽ χωλούς ከሚያመለክተው ‘አንካሶች’ ይለየዋል።
- source_word: ὑγιεῖς
  choice: ጤነኛ ሲሆኑ
  rationale: የግሪኩን ቅጽል ‘ጤነኛ/ደኅና’ በቀጥታ ያንጸባርቃል፣ በአማርኛም ከሌሎቹ አሁናዊ ተሳቢ አገላለጾች ጋር ተፈጥሯዊ ነው።
- source_word: χωλοὺς
  choice: አንካሶች
  rationale: መራመድ የማይችሉትን ወይም በችግር የሚራመዱትን በተለመደ የፈውስ ትረካ ቃል ይገልጣል።
- source_word: περιπατοῦντας
  choice: ሲራመዱ
  rationale: በዚህ የተአምራት ዝርዝር ውስጥ ቃሉ ቀጥተኛውን የመራመድ ትርጉም ይይዛል።
- source_word: τυφλοὺς βλέποντας
  choice: ዕውሮችም ሲያዩ
  rationale: የዕውሮች የማየት ችሎታ መመለሱን የግሪኩን አጭርና ቀጥተኛ ቅርጽ በመከተል ይገልጣል።
- source_word: ἐδόξασαν
  choice: አከበሩ
  rationale: ለአምላክ ክብር መስጠታቸውን በተፈጥሯዊና ክብር ባለው አማርኛ ያስተላልፋል።
- source_word: τὸν θεὸν Ἰσραήλ
  choice: የእስራኤልን አምላክ
  rationale: የግሪኩን የባለቤትነት ግንኙነት በቀጥታና በተለመደ መጽሐፍ ቅዱሳዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: በκωφοὺς λαλοῦντας ውስጥ የκωφούς ትርጉም
  choice: ዲዳዎች ሲናገሩ
  alternative: ደንቆሮዎች ሲናገሩ
  rationale: κωφός ሁለቱንም ትርጉሞች ሊይዝ ይችላል፤ ነገር ግን ‘ሲናገሩ’ የሚለው አገላለጽ ከዚህ በፊት መናገር የማይችሉትን ያመለክታል።
- issue: δοξάζω ለአምላክ ሲውል የሚኖረው አገላለጽ
  choice: የእስራኤልንም አምላክ አከበሩ
  alternative: የእስራኤልንም አምላክ አመሰገኑ / ለእስራኤል አምላክ ክብርን ሰጡ
  rationale: ‘አከበሩ’ ተአምራቱን ተከትሎ ለአምላክ ክብር የመስጠትን ጠንካራ ሃይማኖታዊ ምላሽ በአጭሩ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ተከታታይ የአሁን ጊዜ ተሳቢዎች በ‘ሲ-’ አወቃቀር ተደግመው የተአምራቱን ዝርዝርና ምት ጠብቀዋል። κυλλοί እና χωλοί እንዳይደባለቁ በተለያዩ ግልጽ አገላለጾች ተተርጉመዋል።
