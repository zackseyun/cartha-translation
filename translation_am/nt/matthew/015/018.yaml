  edition: SBLGNT
  text: τὰ δὲ ἐκπορευόμενα ἐκ τοῦ στόματος ἐκ τῆς καρδίας ἐξέρχεται, κἀκεῖνα κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/018.yaml
  text: But the things that come out of the mouth come from the heart[a], and those defile the man.
translation:
  language: am
  text: ከአፍ የሚወጡት ግን ከልብ ይወጣሉ፤ እነዚያም ሰውን ያረክሳሉ[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሰውን ርኩስ ያደርጋሉ።”
    reason: κοινοῖ በዚህ ዐውድ “ማርከስ” ወይም “ርኩስ ማድረግ” የሚል ትርጉም ሊሰጥ ይችላል።
lexical_decisions:
- source_word: τὰ ... ἐκπορευόμενα
  choice: ከአፍ የሚወጡት
  rationale: በግሪክኛው ብዙ ቁጥር ያለው አገላለጽ በስም ፈንታ የቆመ ሲሆን፣ ከአፍ የሚወጡ ነገሮችን፣ በዐውዱም በተለይ ንግግርን ያመለክታል። ትርጉሙ የምንጩን ብዙ ቁጥርና ምስላዊ አነጋገር በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: στόματος
  choice: አፍ
  rationale: ቀጥተኛውን የአካል ምስል ይጠብቃል፤ በዐውዱም የሚነገርን ነገር ያመለክታል።
- source_word: καρδίας
  choice: ልብ
  rationale: “ልብ” የሰውን ውስጣዊ ማንነት፣ ሐሳብና የሥነ ምግባር ዝንባሌ ሊያመለክት የሚችለውን የመጽሐፍ ቅዱስ አገላለጽ ይጠብቃል።
- source_word: ἐξέρχεται
  choice: ይወጣሉ
  rationale: የሚወጡት ነገሮች ምንጫቸው ልብ መሆኑን ያሳያል። በግሪክኛ ግሱ ከገለልተኛ ብዙ ቁጥር ርዕሰ ጉዳይ ጋር በነጠላ ቁጥር ቢቀርብም፣ በአማርኛ የብዙ ቁጥር ግስ ተፈጥሯዊ ነው።
- source_word: κἀκεῖνα
  choice: እነርሱም
  rationale: “እነዚያም/እነርሱም” የሚለውን አመልካች ትርጉም በመጠበቅ ከአፍ ወደሚወጡት ነገሮች መልሶ ያመለክታል።
- source_word: κοινοῖ
  choice: ያረክሳሉ
  rationale: በንጽሕና ዐውድ ውስጥ ግሱ ሰውን ማርከስ ወይም ርኩስ ማድረግን ያመለክታል። “ያረክሳሉ” አጭር፣ የተለመደና የዐውዱን ሥነ ምግባራዊና የንጽሕና ገጽታ የማያጠፋ ነው።
- source_word: τὸν ἄνθρωπον
  choice: ሰውን
  rationale: የግሪክኛው ነጠላ ቁጥር ተወካይ አገላለጽ ነው። “ሰውን” በአማርኛ ወንድንና ሴትን በአጠቃላይ በተፈጥሮ የሚያመለክት ሲሆን የምንጩን ነጠላ ቁጥርም ይጠብቃል።
theological_decisions:
- issue: የሚያረክሰው ነገር ውስጣዊ ምንጭ
  choice: ከአፍ የሚወጡት ከልብ እንደሚመነጩና እነርሱ ሰውን እንደሚያረክሱ ተተርጉሟል።
  alternative: ንግግር የሚያስከትለውን ሥርዓታዊ ርኩሰት ብቻ የሚያመለክት አተረጓጎም።
  rationale: ቅርብ ዐውዱ ከውጭ የሚገባውን ከውስጥ ከሚወጣው ጋር ያነጻጽራል። “ልብ” እና “ያረክሳሉ” የሚሉት ቃላት የጽሑፉን ውስጣዊና የንጽሕና ውጥረት ያለ አላስፈላጊ ማብራሪያ ይጠብቃሉ።
- issue: የτὸν ἄνθρωπον ተወካይ ነጠላ ቁጥር
  choice: ሰውን
  alternative: ወንዱን ወይም ግለሰቡን
  rationale: እዚህ ἄνθρωπος አንድን ወንድ ብቻ ሳይሆን ሰውን በአጠቃላይ የሚወክል ነጠላ ቁጥር ነው። “ሰውን” ይህን አጠቃላይ ኃይል በተፈጥሯዊ አማርኛ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ አማርኛ ተጠቅሟል። ትይዩ የሆነው “ከአፍ… ከልብ” አወቃቀር እና የመውጣት ምስል ተጠብቀዋል።
