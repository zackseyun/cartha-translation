    issue: The predicate ትንቢት ተናግሯል is less direct and idiomatic than ተነበየ.
    rationale: ἐπροφήτευσεν is a single finite verb, and ተነበየ is the standard modern Amharic equivalent that retains the prophetic register without unnecessary periphrasis.
  - severity: low
    issue: እንዲህም አለ is acceptable but less closely aligned with λέγων than a participial quotation introduction.
    rationale: እንዲህ ሲል naturally introduces the following quotation and mirrors the Greek participial linkage.
