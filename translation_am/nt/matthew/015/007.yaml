lexical_decisions:
- source_word: ὑποκριταί
  choice: እናንተ ግብዞች
  rationale: የብዙ ቁጥር ቀጥተኛ ጥሪውንና የኢየሱስን ኃይለኛ ወቀሳ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: καλῶς
  choice: በትክክል
  rationale: የኢሳይያስ ትንቢት ለተናጋሪዎቹ ተገቢና እውነተኛ መሆኑን በግልጽ አማርኛ ያሳያል፤ ‘በሚገባ’ የሚለው አማራጭም የግሪኩን ስፋት ይጠብቃል።
- source_word: ἐπροφήτευσεν
  choice: ትንቢት ተናግሯል
  rationale: የነቢያዊ ንግግሩን መዝገብና ከኢሳይያስ ጋር ያለውን ግንኙነት ይጠብቃል።
- source_word: περὶ ὑμῶν
  choice: ስለ እናንተ
  rationale: περί ከወራሽ ቅጽ ጋር ያለውን ‘ስለ/በተመለከተ’ ትርጉም ተፈጥሯዊ በሆነ አማርኛ ያቀርባል።
- source_word: Ἠσαΐας
  choice: ኢሳይያስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የነቢዩን ስም ይጠቀማል።
- source_word: λέγων
  choice: እንዲህም አለ፦
  rationale: ተከትሎ የሚመጣውን ጥቅስ በግልጽና ተፈጥሯዊ ሁኔታ ያስተዋውቃል።
theological_decisions:
- issue: የኢየሱስ ቀጥተኛ ወቀሳ ኃይል
  choice: ‘እናንተ ግብዞች’ የሚል ቀጥተኛና ኩነኔያዊ ጥሪ
  alternative: ‘አስመሳዮች’ የሚል የለዘበ አገላለጽ
  rationale: ὑποκριταί በዚህ አውድ ከባድ ሥነ ምግባራዊና ሃይማኖታዊ ክስ ነው፤ ማለዘብ የኢየሱስን ፍርድና ከሚቀጥለው የኢሳይያስ ጥቅስ ጋር ያለውን ትስስር ያዳክማል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው አማርኛ ተጠቅሟል። ‘እናንተ ግብዞች’ ቀጥተኛውን ጥሪ በተፈጥሯዊ አነጋገር ይጠብቃል፤ የጥቅስ መግቢያውም በ፦ ተዘግቷል።
