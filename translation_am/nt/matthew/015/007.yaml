  text: 'Hypocrites[a], Isaiah rightly prophesied about you, saying:'
translation:
  language: am
  text: እናንተ ግብዞች፣ ኢሳይያስ ስለ እናንተ በትክክል[a] ተነበየ፣ እንዲህ ሲል፦
  philosophy: optimal-equivalence
