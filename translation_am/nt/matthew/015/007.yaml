  verdict: revise
  source_fidelity: The draft preserves the plural vocative force of ὑποκριταί, the referential sense of περὶ ὑμῶν, the affirmative force of καλῶς, and the quotation-introducing function of λέγων. However, ተነበየ is the more direct, idiomatic Amharic verbal equivalent of ἐπροφήτευσεν than the periphrastic ትንቢት ተናግሯል.
  naturalness: The wording is clear and appropriately forceful. Replacing ትንቢት ተናግሯል with ተነበየ and rendering λέγων as እንዲህ ሲል makes the sentence more natural and more closely reflects the Greek quotation-introducing participle.
  terminology: እናንተ ግብዞች is a suitable strong direct address. ኢሳይያስ is the standard biblical form. በትክክል appropriately conveys καλῶς here; the alternative በሚገባ is valid.
  issues:
