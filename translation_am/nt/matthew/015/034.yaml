base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/034.yaml
  text: And Jesus said to them[a], “How many loaves do you have?” And they said, “Seven, and a few small fish.”
translation:
  language: am
  text: ኢየሱስም፦ «ስንት እንጀራ አላችሁ?» አላቸው። እነርሱም፦ «ሰባት እንጀራና ጥቂት ትንንሽ ዓሦች[a] አሉን» አሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ዓሦች» ብቻ፤ የግሪኩ ቃል የማሳነሻ ቅርጽ ስለሆነ ትንንሽ ዓሦችን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: አላቸው
  rationale: የግሪኩ ግስ በታሪካዊ የአሁን ጊዜ ቅርጽ ቢቀርብም፣ በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ድርጊትን በሚገልጽ ቅርጽ ተተርጉሟል።
- source_word: Πόσους ἄρτους
  choice: ስንት እንጀራ
  rationale: ἄρτους ሊቆጠሩ የሚችሉ የእንጀራ ክፍሎችን ያመለክታል፤ «ስንት እንጀራ» በአማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: ἔχετε
  choice: አላችሁ
  rationale: የብዙ ሰዎችን ይዞታ የሚጠይቀውን የአሁን ጊዜ ጥያቄ በቀጥታ ይገልጻል።
- source_word: οἱ δὲ εἶπαν
  choice: እነርሱም … አሉት
  rationale: δέ እዚህ ጠንካራ ተቃርኖን ሳይሆን የትረካውን ቀጣይነት ያሳያል፤ «-ም» ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: Ἑπτά
  choice: ሰባት
  rationale: ቁጥሩን በቀጥታ ይተረጉማል፤ የሚቆጠረው እንጀራ መሆኑ ከቀደመው ጥያቄ ግልጽ ነው።
- source_word: ὀλίγα
  choice: ጥቂት
  rationale: አነስተኛና በትክክል ያልተወሰነ ብዛትን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἰχθύδια
  choice: ትንንሽ ዓሦች
  rationale: የግሪኩ ቃል የማሳነሻ ቅርጽ ስላለው፣ የትንሽነቱ ሐሳብ በዋናው ጽሑፍ ተጠብቋል።
