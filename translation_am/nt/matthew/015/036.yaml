id: MAT.15.36
reference: Matthew 15:36
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀ἔλαβεν τοὺς ἑπτὰ ἄρτους καὶ τοὺς ἰχθύας ⸀καὶ εὐχαριστήσας ἔκλασεν καὶ ⸀ἐδίδου τοῖς ⸀μαθηταῖς οἱ δὲ μαθηταὶ ⸂τοῖς ὄχλοις⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/036.yaml
  text: He took the seven loaves and the fish[a], and after giving thanks he broke them and kept giving them to the disciples, and the disciples to the crowds.
translation:
  language: am
  text: ሰባቱን እንጀራዎችና ዓሦቹን ወሰደ፤ አመስግኖም እንጀራዎቹን ቆርሶ ለደቀ መዛሙርቱ ይሰጣቸው ነበር፤ ደቀ መዛሙርቱም ለሕዝቡ ይሰጡ ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαβεν
  choice: ወስዶ
  rationale: በዚህ የድርጊት ቅደም ተከተል ውስጥ ኢየሱስ ምግቡን በእጁ ማንሣቱን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἑπτὰ ἄρτους
  choice: ሰባቱን እንጀራዎች
  rationale: ἄρτος በዚህ የማብላት ትረካ ተጨባጭ የእንጀራ ቁራጮችን ወይም ሙሉ እንጀራዎችን ያመለክታል፤ ብዙ ቁጥሩም ተጠብቋል።
- source_word: ἰχθύας
  choice: ዓሦቹን
  rationale: የግሪኩን ብዙ ቁጥርና የተወሰነ መስተዋድድ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: εὐχαριστήσας
  choice: ካመሰገነ በኋላ
  rationale: የአኦሪስት አሳታፊው ድርጊት ከመቁረሱ በፊት መፈጸሙን በግልጽ ያሳያል፤ በግሪኩ ያልተገለጸውን የምስጋና ተቀባይ አይጨምርም።
- source_word: ἔκλασεν
  choice: ቆራርሶ
  rationale: በማከፋፈል ዐውድ እንጀራዎቹን ወደ ብዙ ቁራጮች መቁረሱን የሚገልጽ ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
- source_word: ἐδίδου
  choice: ይሰጣቸው ነበር
  rationale: የኢምፐርፌክት ጊዜውን ቀጣይነት ወይም ተደጋጋሚ ማከፋፈል ያስተላልፋል።
- source_word: μαθηταῖς
  choice: ለደቀ መዛሙርቱ
  rationale: ዳቲቩ የስጦታውን ተቀባዮች ያመለክታል፤ የአማርኛው የተወሰነነት ቅጥያ በዐውዱ የታወቁትን ደቀ መዛሙርት ያመለክታል።
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: ደቀ መዛሙርቱም ለሕዝቡ ይሰጡ ነበር
  rationale: በግሪኩ በሁለተኛው ሐረግ የተተወውን ግስ በአማርኛ ለግልጽነት ይደግማል፤ ὄχλοι በዐውዱ የተሰበሰበውን ብዙ ሕዝብ ያመለክታል።
theological_decisions:
- issue: የεὐχαριστήσας የቁርባን ድምፀት ሊኖረው መቻል
  choice: ካመሰገነ በኋላ
  alternative: የቁርባን ሥርዓታዊ ትርጉምን ይበልጥ የሚያጎላ ቃል መጠቀም
  rationale: ቃሉ ከጌታ እራት ትረካ ጋር ድምፀት ሊኖረው ቢችልም፣ ጥቅሱ በቀጥታ የሚተርከው በምግብ ላይ ማመስገንን ነው፤ ትርጉሙ ጽሑፉ ያልገለጸውን ሥርዓታዊ ትርጓሜ አያክልም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። በግሪኩ ያለው ቀጣይ የማከፋፈል ገጽታ በ«ይሰጣቸው ነበር» ተጠብቋል፤ የግሪኩ አጭር ሁለተኛ ሐረግ በአማርኛ ግልጽ እንዲሆን ግሱ ተደግሟል።
