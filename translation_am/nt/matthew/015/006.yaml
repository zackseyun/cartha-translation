- issue: ዋናውን ጽሑፍ ከአጎራባች ዐውድ ወይም ከተጓዳኝ ምንባብ ጋር ማስማማት
  choice: በSBLGNT ያሉትን ነጠላ «አባቱን» እና «የእግዚአብሔርን ቃል» መከተል
  alternative: «አባቱን ወይም እናቱን» ብሎ ማስፋት ወይም «የእግዚአብሔርን ትእዛዝ» የሚለውን ልዩ ንባብ በዋናው ጽሑፍ ማስገባት
  rationale: የቀረበው የመነሻ ጽሑፍ ቅድሚያ ተሰጥቶታል፤ ጉልህ የጽሑፍ ልዩነቱ ግን በማስታወሻ ተጠብቋል።
