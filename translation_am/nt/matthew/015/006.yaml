  text: he certainly need not honor his father[b][a]. And you have nullified the word of God for the sake of your tradition.
translation:
  language: am
  text: እርሱ አባቱን ፈጽሞ ማክበር[b] አያስፈልገውም። እናንተም በትውፊታችሁ ምክንያት የእግዚአብሔርን ቃል[a] ከንቱ አድርጋችኋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች «የእግዚአብሔርን ቃል» በሚለው ፈንታ «የእግዚአብሔርን ትእዛዝ» ይላሉ።
    reason: textual_variant
  - marker: b
    text: እዚህ «ማክበር» የሚለው አክብሮት ማሳየትን ብቻ ሳይሆን፣ ወላጆችን በተግባር መደገፍንና መንከባከብንም ሊያካትት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ
  choice: ፈጽሞ … አያስፈልገውም
  rationale: ድርብ አሉታው ያለውን አጽንዖት «ፈጽሞ» ያስተላልፋል፤ በዐውዱም የወላጅን የማክበር ግዴታ የሚያስቀር ፈቃድ እንጂ የወደፊት ትንቢት አይደለም።
- source_word: τιμήσει
  choice: ማክበር
  rationale: የግሪኩን መደበኛ ትርጉምና ከወላጆችን ማክበር ትእዛዝ ጋር ያለውን ቃላዊ ትስስር ይጠብቃል፤ በዐውዱ የሚገኘው ቁሳዊ ድጋፍ በማስታወሻ ተገልጿል።
- source_word: πατέρα αὐτοῦ
  choice: አባቱን
  rationale: የቀረበው የግሪክ ጽሑፍ በነጠላ ቁጥር «አባቱን» ይላል፤ ወደ «አባቱንና እናቱን» አልተስፋፋም።
- source_word: ἠκυρώσατε
  choice: ከንቱ አድርጋችኋል
  rationale: ἀκυρόω የሚገልጸውን ማፍረስ፣ ከሥራ ውጭ ማድረግ ወይም ዋጋ ማሳጣት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: የእግዚአብሔርን ቃል
  rationale: የSBLGNT ዋና ንባብ λόγον («ቃል») ስለሆነ በቀጥታ ተከትሏል፤ «ትእዛዝ» የሚለው የጽሑፍ ልዩነት በማስታወሻ ቀርቧል።
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: በወጋችሁ ምክንያት
  rationale: διά ከአኩዛቲቭ ጋር የሚገልጸውን ምክንያት ያሳያል፤ παράδοσις በዚህ ዐውድ ትውፊት ወይም ከትውልድ የተቀበለ ወግ ነው። «ወጋችሁ» ተፈጥሯዊና ግልጽ ነው።
