review_pass:
  verdict: revise
  source_fidelity: The draft conveys the interrogative, the violation of an inherited elders’ tradition, the causal γάρ clause, and the customary temporal clause. However, modern Amharic እንጀራ normally denotes injera, whereas ἄρτος here literally denotes bread; ዳቦ is the safer literal equivalent. ይተላለፋሉ can be understood as ‘pass along/transmit’ in current usage and is less precise than ይጥሳሉ for παραβαίνουσιν.
  naturalness: The sentence is generally clear and suitably dignified. Replacing ወግ with ትውፊት more directly conveys a received tradition, and placing each footnote directly after its relevant expression improves readability and anchoring.
  terminology: ደቀ መዛሙርት and ሽማግሌዎች are appropriate. ትውፊት preserves the sense of παράδοσις as inherited tradition without specifying a denominational interpretation. The cultural note should refer to a tradition-associated handwashing practice without recasting the main text as a hygiene claim.
  issues:
  - severity: medium
    issue: እንጀራ is used for ἄρτον.
    rationale: In modern standard Amharic, እንጀራ ordinarily means injera, a particular food, while the Greek noun literally means bread. ዳቦ preserves the source wording more accurately.
  - severity: medium
    issue: ይተላለፋሉ is potentially ambiguous for παραβαίνουσιν.
    rationale: The Greek verb means violate or transgress. ይጥሳሉ clearly expresses breaking a norm, whereas ይተላለፋሉ may also suggest passing something on.
  - severity: low
    issue: Footnote anchors are not adjacent to their respective referents.
    rationale: The handwashing cultural note is best anchored at ‘እጆቻቸውን,’ and the lexical alternative at ‘ዳቦ,’ matching their stated scope.
