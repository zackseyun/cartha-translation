base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/002.yaml
  text: Why do your disciples break the tradition of the elders? For they do not wash their hands when they eat bread[a][b].
translation:
  language: am
  text: “ደቀ መዛሙርትህ የሽማግሌዎችን ትውፊት ለምን ይጥሳሉ? ዳቦ[b] ሲበሉ እጆቻቸውን[a] አይታጠቡምና።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይህ የሚያመለክተው በሽማግሌዎች ትውፊት የተደነገገውን የእጅ መታጠብ ልማድ ነው፤ ጉዳዩ ተራ የጤና ንጽሕና ብቻ አይደለም።
    reason: cultural_note
  - marker: b
    text: ወይም፣ “ምግብ ሲበሉ።” በግሪክኛ “ዳቦ” የሚለው ቃል አንዳንድ ጊዜ ምግብን በአጠቃላይ ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τί
  choice: ለምን
  rationale: ምክንያትን የሚጠይቀውን የግሪክ አገላለጽ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: οἱ μαθηταί σου
  choice: ደቀ መዛሙርትህ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ ንባብ የተለመደና ክብር ያለው ትክክለኛ አገላለጽ ነው።
- source_word: παραβαίνουσιν
  choice: ይተላለፋሉ
  rationale: የተቀመጠን ወግ ወይም ደንብ መጣስን በተፈጥሯዊ አማርኛ ይገልጣል፤ ‘ይጥሳሉ’ም ሊባል ይችላል።
- source_word: τὴν παράδοσιν τῶν πρεσβυτέρων
  choice: የሽማግሌዎችን ወግ
  rationale: παράδοσις የተላለፈና ሥልጣን ያለውን ልማድ ያመለክታል፤ ‘ወግ’ ከተራ ልማድ የበለጠ የተቀባይነት ኃይል እንዳለው ያሳያል። ‘ሽማግሌዎች’ እዚህ ተራ በዕድሜ የገፉ ሰዎችን ሳይሆን የቀድሞ የአይሁድ ባለሥልጣናትን ያመለክታል።
- source_word: οὐ γὰρ νίπτονται τὰς χεῖρας αὐτῶν
  choice: እጆቻቸውን አይታጠቡምና
  rationale: νίπτω በተለይ እጅን ወይም እግርን ማጠብን ያመለክታል፤ ‘-ምና’ የሚለው ቅጥ γάρ የሚሰጠውን ምክንያታዊ ግንኙነት ያስጠብቃል።
- source_word: ὅταν ἄρτον ἐσθίωσιν
  choice: እንጀራ ሲበሉ
  rationale: ὅταν ከአሁን ጊዜ ንዑስ አንቀጽ ጋር የተደጋጋሚ ሁኔታን ያሳያል፤ ‘ሲበሉ’ ይህን በተፈጥሯዊ አማርኛ ያቀርባል። ἄρτος በቀጥታ ‘እንጀራ/እንጀራ ዓይነት ምግብ’ ማለት ሲሆን አንዳንድ ጊዜ ሙሉ ምግብንም ሊወክል ይችላል።
theological_decisions:
- issue: የእጅ መታጠቡ ባሕርይ
  choice: በዋናው ጽሑፍ ጉዳዩን ከሽማግሌዎች ወግ ጋር ብቻ ማያያዝ
  alternative: ‘ሥርዓታዊ መንጻት’ ወይም ‘የንጽሕና ልማድ’ ብሎ በግልጽ መተርጎም
  rationale: ጥቅሱ ራሱ ክርክሩን የሽማግሌዎችን ወግ ከመጠበቅ ጋር ያያይዘዋል፤ ሥርዓታዊ ንጽሕና ወይም ተራ የጤና ንጽሕና እንደሆነ ትርጉሙ በዋናው ጽሑፍ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ደቀ መዛሙርት’ የተለመደውን መጽሐፍ ቅዱሳዊ ቃል ሲጠብቅ፣ የዓረፍተ ነገሩ አወቃቀር ግን ዘመናዊና ተፈጥሯዊ ነው።
