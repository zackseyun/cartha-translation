  text: And the disciples said to him[c][b][a], “Where could we get enough bread in this desolate place to satisfy so large a crowd?”
translation:
  language: am
  text: ደቀ መዛሙርቱም፣ “በምድረ በዳ[a] እንዲህ ያለውን ብዙ ሕዝብ ለማጥገብ[b] የሚበቃ ዳቦ[c] ከየት እናገኛለን?” አሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በሰው አልባ ስፍራ» ወይም «በገለልተኛ ስፍራ»።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «በሚገባ ለመመገብ።» የግሪኩ ግስ ምግብ ሰጥቶ ማጥገብን ወይም እስኪበቃ ማብላትን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: c
    text: ቃል በቃል፣ «ይህን ያህል ብዙ ዳቦ ቁርሶች።» «ዳቦ» እዚህ በአማርኛ እንደ ጥቅል ስም ተጠቅሟል።
    reason: lexical_alternative
