  text: ከልብ ክፉ ሐሳቦች፣ ግድያዎች፣ ምንዝሮች፣ የፆታ ብልግናዎች፣ ስርቆቶች፣ የሐሰት ምስክርነቶችና ስም ማጥፋቶች[a] ይወጣሉና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ስድቦች።” የግሪኩ ቃል እንደ አውዱ በሰዎች ላይ የሚነገርን ስም ማጥፋት ወይም በእግዚአብሔር ላይ የሚነገርን የስድብ ንግግር ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
