  rationale: ἐκ የምንጭን ምስል፣ γάρ ደግሞ የማብራሪያን ኃይል ያስቀምጣሉ፤ ይህ አገላለጽ በአማርኛ ተፈጥሯዊ ሆኖ ሁለቱንም ይጠብቃል።
