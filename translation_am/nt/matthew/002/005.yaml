id: MAT.2.5
reference: Matthew 2:5
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν αὐτῷ· Ἐν Βηθλέεμ τῆς Ἰουδαίας· οὕτως γὰρ γέγραπται διὰ τοῦ προφήτου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/005.yaml
  text: And they said to him[a], “In Bethlehem of Judea[b], for thus it has been written through the prophet:”
translation:
  language: am
  text: እነርሱም፣ “በይሁዳ ቤተ ልሔም ነው፤ ምክንያቱም በነቢዩ አማካይነት እንዲህ ተጽፏል፦” አሉት።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: እነርሱም
  rationale: በቀደመው ቁጥር የተጠቀሱትን የካህናት አለቆችና የሕዝቡን ጸሐፍት ይመለከታል፤ -ም የδέን ቀላል አያያዥነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: εἶπαν αὐτῷ
  choice: አሉት
  rationale: ‘ለእርሱ አሉ’ የሚለውን ቀጥተኛ ትርጉም በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: Ἐν Βηθλέεμ τῆς Ἰουδαίας
  choice: በይሁዳ ቤተ ልሔም ነው
  rationale: የግሪኩ የቦታ አገላለጽ ይሁዳ ውስጥ ያለችውን ቤተ ልሔም ይለያል። በአማርኛ ሙሉና ተፈጥሯዊ መልስ እንዲሆን ‘ነው’ ተጨምሯል።
- source_word: οὕτως γὰρ
  choice: ምክንያቱም … እንዲህ
  rationale: γάρ የመልሱን ምክንያት ያስገባል፤ οὕτως ደግሞ ቀጥሎ ወደሚመጣው የትንቢት ጥቅስ ይጠቁማል።
- source_word: γέγραπται
  choice: ተጽፎአል
  rationale: የግሪኩን ፍጹም ተደራጊ አወቃቀርና በቅዱስ መጽሐፍ ጥቅስ መግቢያ የተለመደውን አነጋገር ይጠብቃል።
- source_word: διὰ τοῦ προφήτου
  choice: በነቢዩ በኩል
  rationale: διά ከወራሽ ቅጽ ጋር የመካከለኛ አስተላላፊነትን ይገልጣል፤ ‘በኩል’ ከ‘በነቢዩ’ ብቻ ይልቅ ይህን ልዩነት ይጠብቃል።
theological_decisions:
- issue: የትንቢታዊ መልእክት አስተላላፊነት
  choice: በነቢዩ በኩል
  alternative: በነቢዩ
  rationale: ይህ አገላለጽ ነቢዩን የመልእክቱ አስተላላፊ አድርጎ የሚያቀርበውን የግሪክ አወቃቀር ይጠብቃል፤ የመልእክቱን የመጨረሻ ምንጭ በትርጉም ውስጥ አይጨምርም ወይም አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የግሪኩ አጭር የቦታ መልስ በአማርኛ የተሟላ እንዲሆን ‘ነው’ ተጨምሯል፤ ሴሚኮሎኑ መልሱን ከቅዱስ መጽሐፍ ማስረጃው ይለያል።
