reference: Matthew 2:20
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ πορεύου εἰς γῆν Ἰσραήλ, τεθνήκασιν γὰρ οἱ ζητοῦντες τὴν ψυχὴν τοῦ παιδίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/020.yaml
  text: saying[a], “Get up, take the child and his mother, and go to the land of Israel, for those seeking the child’s life are dead.”
translation:
  language: am
  text: እንዲህ ሲል፦ “ተነሥተህ ልጁንና እናቱን ይዘህ ወደ እስራኤል ምድር ሂድ፤ የልጁን ሕይወት የሚፈልጉት ሞተዋልና።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων
  choice: እንዲህ ሲል
  rationale: የአሁን ጊዜውን አሳታፊ ቅርጽ ከቀደመው ንግግር ጋር በተፈጥሮ ያያይዛል።
- source_word: Ἐγερθείς
  choice: ተነሥተህ
  rationale: ከትእዛዙ በፊት የሚመጣውን አሳታፊ ቅርጽ በተፈጥሯዊ የአማርኛ አነጋገር ያስተላልፋል።
- source_word: παράλαβε
  choice: ይዘህ
  rationale: ሰዎቹን ከራስ ጋር ይዞ መሄድን በአጭርና ተፈጥሯዊ መንገድ ይገልጣል።
- source_word: τὸ παιδίον
  choice: ሕፃኑን
  rationale: የግሪኩን አጠቃላይ የልጅነት ትርጉም ያለ ተጨማሪ የዕድሜ ገደብ ይጠብቃል።
- source_word: τὴν μητέρα αὐτοῦ
  choice: እናቱን
  rationale: ባለቤትነቱን በተፈጥሯዊና ግልጽ የአማርኛ ቅርጽ ያሳያል።
- source_word: πορεύου
  choice: ሂድ
  rationale: ቀጥተኛውን ትእዛዝ በቀላልና በግልጽ ቃል ያስተላልፋል።
- source_word: εἰς γῆν Ἰσραήλ
  choice: ወደ እስራኤል ምድር
  rationale: የመድረሻውን አቅጣጫና የክልሉን መልክዓ ምድራዊ ትርጉም ይጠብቃል።
- source_word: τεθνήκασιν
  choice: ሞተዋል
  rationale: የፍጹም ጊዜውን ውጤታዊ ሁኔታ፣ ማለትም አሁን በሕይወት አለመኖራቸውን፣ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: οἱ ζητοῦντες
  choice: ይፈልጉ የነበሩት
  rationale: ከትረካው ጊዜና ከሞታቸው ሁኔታ ጋር ተስማሚ ሆኖ የቀደመውን ቀጣይ ዓላማ ይገልጣል፤ የአሁን ጊዜው ቃል በቃል ቅርጽ በማስታወሻው ቀርቧል።
- source_word: τὴν ψυχὴν τοῦ παιδίου
  choice: የሕፃኑን ሕይወት
  rationale: በዚህ የሞት ማስፈራሪያ አውድ ψυχή የሰውን ሕይወት እንጂ ከሥጋ የተለየች ነፍስን አያመለክትም።
theological_decisions:
- issue: በሞት ማስፈራሪያ አውድ ψυχήን መተርጎም
  choice: ሕይወት
  alternative: ነፍስ
  rationale: “የአንድን ሰው ψυχή መፈለግ” በዚህ አውድ ሰውየውን ለመግደል መፈለግ ማለት ነው፤ “ነፍስ” ማለት በአውዱ ያልተጠየቀ ሥነ መለኮታዊ ልዩነት ሊያስገባ ይችላል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “እንዲህ ሲል” ከቀደመው ቁጥር ጋር ያለውን ሰዋሰዋዊ ትስስር ይጠብቃል።
