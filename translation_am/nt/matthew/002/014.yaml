  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ νυκτὸς καὶ ἀνεχώρησεν εἰς Αἴγυπτον,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/014.yaml
  text: So he got up[a], took the child and his mother during the night, and departed for Egypt.
translation:
  language: am
  text: እርሱም ተነሥቶ፣ ሕፃኑንና እናቱን በሌሊት ይዞ ወደ ግብፅ ሄደ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: እርሱም
  rationale: δέ ትረካውን የሚያስቀጥል ቀላል አያያዥ ነው፤ «-ም» በአማርኛ ይህን ፍሰት በተፈጥሮ ያሳያል።
- source_word: ἐγερθεὶς
  choice: ተነሥቶ
  rationale: የቀደመውን ትእዛዝ ተከትሎ ዮሴፍ ወዲያው መነሣቱንና ቀጣዩን ድርጊት መፈጸሙን ያሳያል።
- source_word: παρέλαβε
  choice: ይዞ
  rationale: እዚህ παραλαμβάνω ሰዎችን ከራስ ጋር ይዞ መሄድን ያመለክታል፤ «ይዞ» ቀላልና ተፈጥሯዊ ነው።
- source_word: τὸ παιδίον
  choice: ሕፃኑን
  rationale: παιδίον በቀጥታ ሕፃንን ወይም ትንሽ ልጅን ያመለክታል፤ ከአውዱ ጋር «ሕፃኑን» ግልጽ ነው።
- source_word: τὴν μητέρα αὐτοῦ
  choice: እናቱን
  rationale: αὐτοῦ ወደ ሕፃኑ ይመለሳል፤ በአማርኛ «ሕፃኑንና እናቱን» ይህን ግንኙነት በተፈጥሮ ያሳያል።
- source_word: νυκτὸς
  choice: በሌሊት
  rationale: የጊዜ ገላጭ የሆነው ይህ ቃል ድርጊቱ ሌሊት መፈጸሙን ያሳያል፤ «በሌሊት» ዘመናዊና ግልጽ ነው።
- source_word: ἀνεχώρησεν
  choice: ሄደ
  rationale: ἀναχωρέω ከአንድ ስፍራ መሄድን ወይም መራቅን ያመለክታል፤ «ሄደ» እንቅስቃሴውን ሳያብራራ በተፈጥሮ ይገልጣል።
- source_word: εἰς Αἴγυπτον
  choice: ወደ ግብፅ
  rationale: εἰς የጉዞውን መድረሻ ያመለክታል፤ «ወደ ግብፅ» ቀጥተኛና ተፈጥሯዊ አተረጓጎም ነው።
