translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለውን የአማርኛ ትረካ ይጠቀማል። በእንግሊዝኛው የማማከሪያ ጽሑፍ ያለው [a] ምልክትና «Or ‘to Egypt.’» የሚለው ማስታወሻ ከተመለከተው ቦታ ጋር የማይጣጣሙ ስለሆኑ፣ በግሪክ ምንጭ ላይ የተመሠረተ አስፈላጊ የትርጉም አማራጭ እንደማይጨምሩ ተወግደዋል።
