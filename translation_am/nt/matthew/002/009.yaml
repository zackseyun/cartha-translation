source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες τοῦ βασιλέως ἐπορεύθησαν, καὶ ἰδοὺ ὁ ἀστὴρ ὃν εἶδον ἐν τῇ ἀνατολῇ προῆγεν αὐτούς, ἕως ἐλθὼν ⸀ἐστάθη ἐπάνω οὗ ἦν τὸ παιδίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/009.yaml
  text: After hearing the king[a], they went on their way, and behold, the star that they had seen in the east went before them until it came and stood over where the child was.
translation:
  language: am
  text: እነርሱም ንጉሡን ከሰሙ በኋላ ጉዟቸውን ቀጠሉ። እነሆ፣ በምሥራቅ[a] ያዩት ኮከብ ከፊታቸው ይሄድ ነበር፤ ደርሶም ልጁ ባለበት ስፍራ በላይ እስኪቆም ድረስ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በመውጫው።” የግሪኩ አገላለጽ “በምሥራቅ” የሚል የቦታ ወይም የአቅጣጫ ትርጉም ሊኖረው ይችላል፤ ወይም ኮከቡ በሚወጣበት ጊዜ መታየቱን ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσαντες τοῦ βασιλέως
  choice: ንጉሡን ከሰሙ በኋላ
  rationale: የግሪኩ የቀደመ ድርጊት ዋናውን ግስ እንደሚቀድም ያሳያል፤ አማርኛውም ይህን ቅደም ተከተል በተፈጥሯዊ ሁኔታ ያቀርባል። “ንጉሡ” የግሪኩን ግልጽ አጠራር ይጠብቃል፤ “ሄሮድስ” የሚለውን ከአውዱ አይጨምርም።
- source_word: ἐπορεύθησαν
  choice: ጉዟቸውን ቀጠሉ
  rationale: በንጉሡ ዘንድ ከነበራቸው ቆይታ በኋላ መሄዳቸውን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: ἰδοὺ
  choice: እነሆም
  rationale: የትረካውን ድንገተኛ ትኩረትና ሕያውነት የሚያስጠብቅ የአማርኛ የትኩረት ምልክት ነው።
- source_word: ἀστήρ
  choice: ኮከብ
  rationale: የቃሉ መደበኛና ቀጥተኛ አማርኛ ፍቺ ነው።
- source_word: ὃν εἶδον
  choice: ያዩት
  rationale: ኮከቡን ማየታቸው ከአሁኑ የትረካ ክስተት በፊት መሆኑን በአማርኛ በቂ ሁኔታ ያሳያል።
- source_word: ἐν τῇ ἀνατολῇ
  choice: በምሥራቅ
  rationale: የቦታውን ትርጉም በተለመደና ግልጽ አማርኛ ያቀርባል፤ የኮከብ መውጣትን ሊያመለክት የሚችለው አማራጭ ትርጉም በማስታወሻ ተጠብቋል።
- source_word: προῆγεν αὐτούς
  choice: ከፊታቸው ይሄድ ነበር
  rationale: ኮከቡ ከእነርሱ ቀድሞ መጓዙን ይገልጣል፤ የመምራቱን ዘዴ ግን ከጽሑፉ በላይ አይወስንም።
- source_word: ἕως ἐλθὼν ἐστάθη
  choice: ደርሶ እስኪቆም ድረስ
  rationale: መድረስን ተከትሎ መቆም የሚለውን የግሪኩን ቅደም ተከተል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐπάνω οὗ ἦν τὸ παιδίον
  choice: ልጁ ካለበት በላይ
  rationale: ኮከቡ ልጁ ካለበት ስፍራ በላይ መቆሙን በአጭርና ግልጽ አማርኛ ያሳያል። “ልጁ” παιδίον የሚለውን ያለ ተጨማሪ የዕድሜ አጽንዖት ይተረጉማል።
theological_decisions:
- issue: በኮከቡ ትረካ ውስጥ ἐν τῇ ἀνατολῇ የሚለው ሐረግ ትርጉም
  choice: በምሥራቅ
  alternative: ሲወጣ / በመውጫው
  rationale: የግሪኩ ሐረግ ምሥራቅ የሚባለውን አቅጣጫ ወይም ክልል ሊያመለክት ይችላል፤ እንዲሁም ኮከብ ሲወጣ ማየትን የሚገልጽ የሥነ ፈለክ አገላለጽ ሊሆን ይችላል። ዋናው ጽሑፍ የተለመደውን የቦታ ትርጉም ይዟል፤ እውነተኛው አሻሚነት ግን በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “እነሆም” የጽሑፉን ትረካዊ ትኩረት ለማቆየት ተይዟል።
