lexical_decisions:
- source_word: ἰδόντες
  choice: ባዩ ጊዜ
  rationale: የአኦሪስት ተሳቢው ከዋናው ግስ በፊት የሆነውን ጊዜያዊ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: δὲ
  choice: -ም
  rationale: እዚህ ጠንካራ ተቃርኖን ሳይሆን ትረካውን የሚያስቀጥል ለስላሳ አያያዥ ነው፤ በአማርኛም ከ‘ኮከቡን’ ጋር የተያያዘው ‘-ም’ ይህን ተግባር በተፈጥሮ ይፈጽማል።
- source_word: τὸν ἀστέρα
  choice: ኮከቡን
  rationale: በአውዱ አስቀድሞ የተጠቀሰውን የተወሰነ ኮከብ ያመለክታል።
- source_word: ἐχάρησαν
  choice: ተደሰቱ
  rationale: ቅርጹ ተገብሮአዊ/ዲፖነንት ቢመስልም ትርጉሙ ንቁ ነው፤ ‘ተደሰቱ’ በዘመናዊ አማርኛ ተፈጥሯዊና ክብር ያለው አገላለጽ ነው።
- source_word: χαρὰν μεγάλην
  choice: ታላቅ ደስታ
  rationale: ከተመሳሳይ ሥር የመጣው ስምና ግስ የደስታውን ጥንካሬ ያጎላሉ፤ ድግግሞሹን ‘ደስታ ተደሰቱ’ በማለት ተጠብቋል።
- source_word: σφόδρα
  choice: እጅግ
  rationale: መላውን የደስታ አገላለጽ በጣም የሚያጠናክር ተውሳክ ስለሆነ ‘እጅግ’ ጥንካሬውን በግልጽና ተፈጥሯዊ አማርኛ ያስተላልፋል።
