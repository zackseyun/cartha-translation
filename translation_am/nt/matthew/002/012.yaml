  yaml_path: translation/nt/matthew/002/012.yaml
  text: And having been warned in a dream not to return to Herod[b][a], they departed for their own country by another route.
translation:
  language: am
  text: በሕልም ወደ ሄሮድስ እንዳይመለሱ ማስጠንቀቂያ ተቀብለው[a]፣ በሌላ መንገድ[b] ወደ አገራቸው ሄዱ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “መለኮታዊ ማስጠንቀቂያ ተቀብለው።” የግሪኩ ተደራጊ አገላለጽ ማስጠንቀቂያው ከእግዚአብሔር እንደመጣ ያመለክታል፤ በቁጥሩ ውስጥ ግን እግዚአብሔር በግልጽ አልተጠቀሰም።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በሌላ ጎዳና።”
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηματισθέντες
  choice: ማስጠንቀቂያ ተቀብለው
  rationale: በዚህ ዐውድ የግሱ ተደራጊ ቅርጽ ከእግዚአብሔር የመጣ ማስጠንቀቂያ ወይም መመሪያ መቀበልን ያመለክታል። ይህ አተረጓጎም መለኮታዊውን ምንጭ ሳይክድ፣ በግሪክ ጽሑፉ በግልጽ ያልተጠቀሰውን ‘ከእግዚአብሔር’ የሚለውን አይጨምርም።
- source_word: κατ’ ὄναρ
  choice: በሕልም
  rationale: በሕልም የተቀበሉትን መገለጥ ወይም ማስጠንቀቂያ በተፈጥሯዊና ግልጽ አማርኛ ያሳያል።
- source_word: μὴ ἀνακάμψαι
  choice: እንዳይመለሱ
  rationale: μή ከወሰን የሌለው ግስ ጋር የማስጠንቀቂያውን ይዘት ይገልጻል፤ በጉዞው ዐውድ ‘እንዳይመለሱ’ ተፈጥሯዊ ነው።
- source_word: πρὸς Ἡρῴδην
  choice: ወደ ሄሮድስ
  rationale: πρός ከተሳቢ ቅጽ ጋር ወደ አንድ ሰው የሚደረግን እንቅስቃሴ ያመለክታል።
- source_word: δι’ ἄλλης ὁδοῦ
  choice: በሌላ መንገድ
  rationale: ὁδός መንገድን፣ ጎዳናን ወይም የጉዞ አቅጣጫን ሊያመለክት ይችላል፤ ‘በሌላ መንገድ’ በዚህ የጉዞ ትረካ ግልጽና ተፈጥሯዊ ነው።
- source_word: ἀνεχώρησαν
  choice: ሄዱ
  rationale: ግሱ መሄድን፣ መነሳትን ወይም ራቅ ማለትን ያመለክታል። ‘ሄዱ’ በአማርኛ የትረካውን የጉዞ ቅደም ተከተል በቀላሉ ያስተላልፋል።
- source_word: εἰς τὴν χώραν αὐτῶν
  choice: ወደ አገራቸው
  rationale: χώρα አገርን፣ ምድርን ወይም ክልልን ሊያመለክት ይችላል። ጠቢባኑ ወደ መጡበት ስፍራ እየሄዱ በመሆኑ ‘ወደ አገራቸው’ መድረሻውንና የαὐτῶνን ባለቤትነት በተፈጥሯዊ ሁኔታ ይገልጻል።
theological_decisions:
