  choice: ዋናው ጽሑፍ ‘ማስጠንቀቂያ ተቀብለው’ በማለት ተደራጊውን አገላለጽ ይጠብቃል፤ ‘ከእግዚአብሔር’ ብሎ አይጨምርም።
  alternative: ‘መለኮታዊ ማስጠንቀቂያ ተቀብለው’ ወይም ‘እግዚአብሔር አስጠንቅቋቸው’
  rationale: ዐውዱና χρηματισθέντες የሚለው ተደራጊ ቅርጽ መለኮታዊ አድራጊን አጥብቀው ያመለክታሉ፤ ነገር ግን በዚህ ቁጥር እግዚአብሔር በስም አልተጠቀሰም። ትርጉሙ ይህን አንድምታ ሳያጠፋ ያልተጻፈን ግልጽ ባለቤት አይጨምርም።
