id: MAT.2.16
reference: Matthew 2:16
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Τότε Ἡρῴδης ἰδὼν ὅτι ἐνεπαίχθη ὑπὸ τῶν μάγων ἐθυμώθη λίαν, καὶ ἀποστείλας ἀνεῖλεν πάντας τοὺς παῖδας τοὺς ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς ἀπὸ διετοῦς καὶ κατωτέρω, κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/016.yaml
  text: Then Herod[a], seeing that he had been tricked by the magi, became very angry, and sending men, he killed all the boys in Bethlehem and in all its surrounding districts, from two years old and under[b], according to the time that he had determined from the magi.
translation:
  language: am
  text: ከዚያም ሄሮድስ፣ ሰብአ ሰገሎቹ[b] እንዳታለሉት[a] ባየ ጊዜ፣ እጅግ ተቆጣ፤ ሰዎችንም ልኮ፣ በቤተ ልሔምና በዙሪያዋ ባሉት አካባቢዎች ሁሉ የነበሩ የሁለት ዓመት ወይም ከዚያ በታች ዕድሜ ያላቸውን ወንድ ልጆች ሁሉ፣ ከሰብአ ሰገሎቹ በትክክል ባጣራው ጊዜ መሠረት፣ ገደለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ይበልጥ ቃል በቃል፣ “እንዳፌዙበት።”
    reason: lexical_alternative
  - marker: b
    text: “ሰብአ ሰገል” የግሪኩን ማጎይ የሚወክል ባህላዊ ስያሜ ነው፤ ቃሉ ከምሥራቅ የመጡ ኮከብ ተመልካች ጠቢባንን ያመለክታል።
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: ከዚያም
  rationale: የተከታታይ ክስተትን ጊዜያዊ ሽግግር በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: ἐνεπαίχθη
  choice: እንዳታለሉት
  rationale: በዐውዱ ሰብአ ሰገሎቹ ወደ ሄሮድስ ባለመመለሳቸው እንዳሞኙት ያሳያል፤ የበለጠ ቀጥተኛው ‘እንዳፌዙበት’ በማስታወሻ ተጠብቋል።
- source_word: μάγων
  choice: ሰብአ ሰገሎቹ
  rationale: በአማርኛ የታወቀውን ባህላዊ ስያሜ ይጠቀማል፤ ታሪካዊና ባህላዊ ትርጉሙ በማስታወሻ ተብራርቷል።
- source_word: ἐθυμώθη λίαν
  choice: እጅግ ተቆጣ
  rationale: የግሱን ቁጣና የλίανን ማጠናከሪያ አጭርና ግልጽ በሆነ አማርኛ ያስተላልፋል።
- source_word: ἀποστείλας
  choice: ሰዎችንም ልኮ
  rationale: ሄሮድስ ግድያውን እንዲፈጽሙ ወኪሎችን እንደላከ በዐውዱ የተገለጠውን ተሳታፊ ግስ ተፈጥሯዊ በሆነ አማርኛ ይገልጣል።
- source_word: πάντας τοὺς παῖδας
  choice: ወንድ ልጆች ሁሉ
  rationale: በዚህ ዐውድ παῖδας የሚያመለክተው ወንድ ሕፃናትን ስለሆነ ጾታውን በግልጽ ያሳያል።
- source_word: ἐν πᾶσι τοῖς ὁρίοις αὐτῆς
  choice: በዙሪያዋ ባሉት አካባቢዎች ሁሉ
  rationale: ὅρια እዚህ የቤተ ልሔምን ዙሪያ ግዛቶች ወይም አካባቢዎች ያመለክታል፤ ቃል በቃል ‘ድንበሮች’ ከማለት ይልቅ ትርጉሙን በተፈጥሮ ያቀርባል።
- source_word: ἀπὸ διετοῦς καὶ κατωτέρω
  choice: የሁለት ዓመት ዕድሜና ከዚያ በታች የሆኑትን
  rationale: ሁለት ዓመትን ጨምሮ ከዚያ በታች ያለውን የዕድሜ ወሰን በግልጽ ያሳያል።
- source_word: κατὰ τὸν χρόνον ὃν ἠκρίβωσεν
  choice: በጥንቃቄ ባጣራው ጊዜ መሠረት
  rationale: κατά የሚያሳየውን ‘በ...መሠረት’ ግንኙነትና ἠκρίβωσεν ያለውን በትክክል የማጣራት ሐሳብ ይጠብቃል።
theological_decisions:
- issue: μάγοι እንዴት እንደሚተረጎም
  choice: ሰብአ ሰገል
  alternative: ጠቢባን / ማጎች
  rationale: የአማርኛው የታወቀ ስያሜ ሲጠበቅ፣ ቃሉ ከምሥራቅ የመጡ ኮከብ ተመልካች ጠቢባንን እንደሚያመለክት በማስታወሻ ተገልጧል፤ በኋላ የተፈጠሩ ባህላዊ ምስሎች አልተጨመሩም።
- issue: ἐνεπαίχθη ያለው ሁለትዮሽ ትርጉም
  choice: እንዳታለሉት
  alternative: እንዳፌዙበት
  rationale: ዐውዱ ሄሮድስ ባለመመለሳቸው እንደተታለለ ያመለክታል፤ ነገር ግን የግሪኩ ግስ ‘ማፌዝ’ የሚለውንም ትርጉም ስለሚይዝ ይህ አማራጭ በማስታወሻ ተጠብቋል።
- issue: የሄሮድስ የዕድሜ ወሰን መሠረት
  choice: ከሰብአ ሰገሎቹ ባጣራው ጊዜ መሠረት
  alternative: ኮከቡ የታየበት ጊዜ መሠረት
  rationale: ጥቅሱ የሚለው ‘ጊዜ’ ብቻ ነው፤ ዐውዱ የኮከቡን መታየት ቢያመለክትም፣ ትርጉሙ ይህን በግልጽ በመጨመር የምንጩን አገላለጽ አልገደበም።
