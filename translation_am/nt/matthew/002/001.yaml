id: MAT.2.1
reference: Matthew 2:1
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Τοῦ δὲ Ἰησοῦ γεννηθέντος ἐν Βηθλέεμ τῆς Ἰουδαίας ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως, ἰδοὺ μάγοι ἀπὸ ἀνατολῶν παρεγένοντο εἰς Ἱεροσόλυμα
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/001.yaml
  text: After Jesus was born in Bethlehem of Judea in the days of Herod the king[a], behold, wise men from the east arrived in Jerusalem,
translation:
  language: am
  text: ኢየሱስ በይሁዳ ቤተ ልሔም፣ በንጉሥ ሄሮድስ ዘመን ከተወለደ በኋላ፣ እነሆ፣ ከምሥራቅ የመጡ ጠቢባን[a] ኢየሩሳሌም ደረሱ፤
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ማጎች።” የግሪኩ ቃል ከምሥራቅ የመጡ ምሁራንን ያመለክታል፤ እነርሱም ምናልባት ከከዋክብት ጥናት ወይም ከቤተ መንግሥት ጥበብ ጋር የተያያዙ ነበሩ።
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γεννηθέντος
  choice: ኢየሱስ ... ከተወለደ በኋላ
  rationale: የግሪኩ ጄኒቲቭ አብሶሉት ለዋናው ድርጊት የቀደመውን የጊዜ ሁኔታ ይገልጣል፤ ይህ አተረጓጎም በዘመናዊ አማርኛ ተፈጥሯዊ ነው። δέ እዚህ ለስላሳ የትረካ መሸጋገሪያ ስለሆነ በተለየ ቃል አልተተረጎመም።
- source_word: Βηθλέεμ τῆς Ἰουδαίας
  choice: በይሁዳ ቤተ ልሔም
  rationale: የቦታውን ስም በተለመደው የአማርኛ ቅርጽ ያቀርባል፤ ይሁዳም ይህችን ቤተ ልሔም ከሌሎች ይለያል።
- source_word: ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως
  choice: በንጉሥ ሄሮድስ ዘመን
  rationale: የታሪኩን ጊዜ በተፈጥሯዊና በክብር ባለው ዘመናዊ አማርኛ ይገልጣል።
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: ቀጥሎ ለሚነገረው ነገር ትኩረት የሚስብ የትረካ ምልክት መሆኑን ይጠብቃል።
- source_word: μάγοι
  choice: ጠቢባን
  rationale: በአማርኛ ለአንባቢዎች የሚገባ ሲሆን ቁጥራቸውን ወይም ነገሥታት መሆናቸውን የመሳሰሉ ከኋላ የተጨመሩ ወጎችን አያስገባም። የቃሉ የበለጠ ቴክኒካዊ ትርጉም በማስታወሻ ተገልጧል።
- source_word: ἀπὸ ἀνατολῶν
  choice: ከምሥራቅ የመጡ
  rationale: የብዙ ቁጥሩን የአቅጣጫ አገላለጽ በአማርኛ ተፈጥሯዊ በሆነ የአካባቢ ስያሜ ያቀርባል።
- source_word: παρεγένοντο εἰς Ἱεροσόλυμα
  choice: ኢየሩሳሌም ደረሱ
  rationale: ግሱ ወደ ስፍራው መምጣትንና መድረስን ያመለክታል፤ ይህ በአማርኛ ከመድረሻው ጋር ተፈጥሯዊ አገላለጽ ነው።
theological_decisions:
- issue: μάγοι የሚለውን ቃል የኋለኛውን ትውፊት ሳያስገቡ መተርጎም
  choice: ጠቢባን
  alternative: ማጎች
  rationale: ቃሉ ከምሥራቅ የመጡ፣ ምናልባትም ከከዋክብት ጥናት ወይም ከቤተ መንግሥት ጥበብ ጋር የተያያዙ ምሁራንን ያመለክታል። «ጠቢባን» ሚናቸውን በግልጽ ያስተላልፋል፤ ቁጥራቸውን ወይም ነገሥታት መሆናቸውን አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። «እነሆ» የምንጩን ልዩ የትኩረት ምልክት ለመጠበቅ ተቀምጧል፤ የዓረፍተ ነገሩ አወቃቀርም የግሪኩን የጀርባ ሁኔታና ዋና ድርጊት በተፈጥሯዊ አማርኛ ይለያል።
