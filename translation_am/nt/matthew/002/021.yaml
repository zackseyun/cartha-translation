  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ ⸀εἰσῆλθεν εἰς γῆν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/021.yaml
  text: So he rose, took the child and his mother, and entered the land of Israel.
translation:
  language: am
  text: እርሱም ተነሥቶ ሕፃኑንና እናቱን ይዞ ወደ እስራኤል ምድር ገባ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: -ም
  rationale: እዚህ δέ ተቃርኖን ሳይሆን የትረካውን ቀጣይነት ያመለክታል፤ ከ«እርሱ» ጋር የተያያዘው «-ም» ይህን ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐγερθεὶς
  choice: ተነሥቶ
  rationale: በዚህ ዐውድ የተከታታይ ድርጊትን፣ ‘ተነሥቶ/ተነስቶ’ የሚለውን፣ ያመለክታል፤ የአማርኛው ግስ አገባብ የግሪኩን ቦዝ አንቀጽ በተፈጥሯዊነት ያንጸባርቃል።
- source_word: παρέλαβε
  choice: ይዞ
  rationale: παραλαμβάνω እዚህ ከራስ ጋር ይዞ መሄድን ያመለክታል፤ «ይዞ» በአማርኛ ትረካ ተፈጥሯዊ ሲሆን ተከታዩን የመግባት ድርጊት ያገናኛል።
- source_word: τὸ παιδίον
  choice: ሕፃኑን
  rationale: παιδίον በቀላሉ ሕፃንን ወይም ልጅን ያመለክታል፤ «ሕፃኑን» የተወሰነውን ልጅ በግልጽ እና በክብር ያቀርባል።
- source_word: τὴν μητέρα αὐτοῦ
  choice: እናቱን
  rationale: αὐτοῦ በተፈጥሮ ወደ ሕፃኑ ይመለሳል፤ «እናቱን» ይህን በአጭርና ግልጽ ሁኔታ ያስተላልፋል።
- source_word: εἰσῆλθεν
  choice: ገባ
  rationale: εἰσέρχομαι ወደ ስፍራ መግባትን ያመለክታል፤ «ገባ» ቀጥተኛና ተፈጥሯዊ ነው።
- source_word: εἰς γῆν Ἰσραήλ
  choice: ወደ እስራኤል ምድር
  rationale: εἰς አቅጣጫን ያሳያል፤ γῆ Ἰσραήλ ደግሞ ብሔራዊና መልክዓ ምድራዊ ትርጉሙን በሚጠብቅ መንገድ «የእስራኤል ምድር» የሚለውን ሐሳብ ይገልጣል። ከ«ወደ» ጋር «ወደ እስራኤል ምድር» ተፈጥሯዊ ነው።
