id: MAT.2.6
reference: Matthew 2:6
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Καὶ σύ, Βηθλέεμ γῆ Ἰούδα, οὐδαμῶς ἐλαχίστη εἶ ἐν τοῖς ἡγεμόσιν Ἰούδα· ἐκ σοῦ γὰρ ἐξελεύσεται ἡγούμενος, ὅστις ποιμανεῖ τὸν λαόν μου τὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/006.yaml
  text: And you[a], Bethlehem, land of Judah, are by no means least among the rulers of Judah[b]; for from you will come a ruler who will shepherd my people Israel.
translation:
  language: am
  text: አንቺም፣ በይሁዳ ምድር ያለሽ ቤተ ልሔም፣ በይሁዳ ገዢዎች መካከል ከቶ ከሁሉ የምትታነሽ አይደለሽም፤ ሕዝቤን፣ እስራኤልን፣ እንደ እረኛ የሚጠብቅ[b] ገዢ ከአንቺ ይመጣልና[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ከአንቺ ይወጣል»።
    reason: lexical_alternative
  - marker: b
    text: «እንደ እረኛ የሚጠብቅ» የሚለው «የሚገዛ» የሚለውንም ሐሳብ ሊይዝ ይችላል፤ ይህም ከእረኝነት እንክብካቤ ጋር የንጉሣዊ አመራርን ምስል ያቆያል።
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆ
  choice: ምድር
  rationale: ከ«ቤተ ልሔም» ጋር በተያያዘ የይሁዳን ክልል ወይም አገር ያመለክታል፤ «ምድር» ይህን መልክዓ ምድራዊ ትርጉም ይጠብቃል።
- source_word: οὐδαμῶς
  choice: ከቶ ... አይደለሽም
  rationale: ተራውን እምቢታ ከማቅረብ ይልቅ የግሪኩን ጠንካራ አሉታዊ አጽንዖት ያስተላልፋል።
- source_word: ἐλαχίστη
  choice: ታናሽ
  rationale: በዚህ አውድ የመጠንንም ሆነ የደረጃንና የጠቀሜታን ዝቅተኝነት ሊያመለክት የሚችለውን ንጽጽር ሳያጠብ ያቀርባል።
- source_word: ἡγεμόσιν
  choice: ገዢዎች
  rationale: ቃሉ ገዥዎችን፣ መሪዎችን ወይም በጥቅሱ አውድ የይሁዳን ጎሳዊ ክፍሎች ሊያመለክት ይችላል፤ «ገዢዎች» የአስተዳደርን ሐሳብ ይጠብቃል።
- source_word: ἐξελεύσεται
  choice: ይመጣል
  rationale: ከቤተ ልሔም የሚነሣውን ሰው በተፈጥሯዊ አማርኛ ያሳያል፤ «ይወጣል» የሚለው ይበልጥ ቀጥተኛ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ἡγούμενος
  choice: ገዢ
  rationale: በስም አገልግሎት የገባው የግሪክ አሳታፊ ቅጽ የሚመጣውን ሰው የመምራትና የመግዛት ሚና ያመለክታል።
- source_word: ποιμανεῖ
  choice: እንደ እረኛ የሚጠብቅ
  rationale: የእረኝነትን ምስል በግልጽና ተፈጥሯዊ አማርኛ ይጠብቃል፤ በተመሳሳይ ጊዜ ቃሉ የመግዛትን ሐሳብ ሊይዝ እንደሚችል በማስታወሻ ተገልጿል።
- source_word: λαόν μου τὸν Ἰσραήλ
  choice: ሕዝቤን እስራኤልን
  rationale: የቃል ኪዳኑን «ሕዝቤ» አገላለጽና «እስራኤል» በተጨማሪ መግለጫነት የቆመበትን የግሪክ አወቃቀር ይጠብቃል።
theological_decisions:
- issue: በሚመጣው ሰው መግለጫ ውስጥ ያለው የንጉሣዊ አገዛዝና የእረኝነት እንክብካቤ ጥምረት
  choice: ἡγούμενοςን «ገዢ»፣ ποιμανεῖን ደግሞ «እንደ እረኛ የሚጠብቅ» በማለት ሁለቱንም ገጽታዎች ማቆየት
  alternative: ሁለቱንም በፖለቲካዊ ቃላት («መሪ»/«ይገዛል») ወይም ሁለቱንም በእረኝነት ቃላት መተርጎም
  rationale: ጥቅሱ የአገዛዝንና የእረኝነትን ምስሎች አጣምሮ ያቀርባል፤ ሁለቱንም ማቆየት ትርጉሙን ወደ አንድ ወገን ብቻ ከማጥበብ ይቆጠባል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ለቤተ ልሔም የቀረበው ቀጥተኛ ንግግር በአንስታይ ነጠላ ቅጽ («አንቺ»፣ «አይደለሽም»፣ «ከአንቺ») ተጠብቋል።
