id: MAT.2.4
reference: Matthew 2:4
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ συναγαγὼν πάντας τοὺς ἀρχιερεῖς καὶ γραμματεῖς τοῦ λαοῦ ἐπυνθάνετο παρ’ αὐτῶν ποῦ ὁ χριστὸς γεννᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/004.yaml
  text: And gathering together all the chief priests and scribes of the people[a], he was inquiring of them where the Messiah was to be born.
translation:
  language: am
  text: የሕዝቡን የካህናት አለቆችና የሕግ ጸሐፊዎች ሁሉ ሰብስቦ፣ መሲሑ[a] የት እንደሚወለድ ይጠይቃቸው ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ክርስቶስ።” የግሪኩ Χριστός “የተቀባው” የሚል ማዕረግ ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: συναγαγὼν
  choice: ሰብስቦ
  rationale: የቀደመውን የአኦሪስት አሳታፊ ድርጊት በተፈጥሯዊ የአማርኛ ተከታታይ ግስ ይገልጻል።
- source_word: πάντας
  choice: ሁሉ
  rationale: የግሪኩን አጠቃላይነት ያለ ተጨማሪ ትርጓሜ ይጠብቃል።
- source_word: ἀρχιερεῖς
  choice: የካህናት አለቆች
  rationale: ብዙ ሊቀ ካህናት እንዳሉ ሳያስመስል የከፍተኛውን የክህነት አመራር በግልጽ ያሳያል።
- source_word: γραμματεῖς
  choice: የሕግ ጸሐፊዎች
  rationale: በዚህ ዐውድ የሙሴን ሕግ የሚያውቁና የሚያስተምሩ ጸሐፍትን የሚያመለክት ግልጽና የተለመደ አገላለጽ ነው።
- source_word: τοῦ λαοῦ
  choice: የሕዝቡን
  rationale: የምንጩን የባለቤትነት/ዝምድና አገላለጽ ይጠብቃል፤ በአማርኛ የግስ ሐረጉ መዋቅር ምክንያት በቀዳሚው ስም ሐረግ ላይ ተቀምጧል።
- source_word: ἐπυνθάνετο
  choice: ይጠይቃቸው ነበር
  rationale: የኢምፐርፌክት ግሱን ቀጣይ ወይም ተደጋጋሚ የጥያቄ ተግባር በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ποῦ
  choice: የት
  rationale: ቀጥተኛውን የቦታ ጥያቄ በትክክል ይተረጉማል።
- source_word: ὁ χριστὸς
  choice: መሲሑ
  rationale: በአይሁድ ትንቢታዊ ዐውድ የሚጠበቀውን የተቀባ ገዥ የሚያመለክተውን ማዕረግ ይጠብቃል።
- source_word: γεννᾶται
  choice: እንደሚወለድ
  rationale: በተዘዋዋሪ ጥያቄው ውስጥ ያለውን የሚጠበቅ ልደት በተፈጥሯዊ የአማርኛ አገላለጽ ያቀርባል።
theological_decisions:
- issue: ὁ χριστός የሚለውን ማዕረግ መተርጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: ሄሮድ የሚጠይቀው በአይሁድ ትንቢት የሚጠበቀው የተቀባ ንጉሥ የት እንደሚወለድ ስለሆነ፣ ቃሉ እዚህ እንደ ስም ሳይሆን እንደ ማዕረግ ይሠራል። አማራጩ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “የካህናት አለቆች” የሚለው ብዙ ሊቃነ ካህናት እንዳሉ የሚፈጠረውን የተሳሳተ ግንዛቤ ይቀንሳል፤ “ይጠይቃቸው ነበር” ደግሞ የግሪኩን ኢምፐርፌክት ገጽታ ይጠብቃል።
