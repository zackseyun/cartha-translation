  text: ἀκούσας δὲ ⸂ὁ βασιλεὺς Ἡρῴδης⸃ ἐταράχθη καὶ πᾶσα Ἱεροσόλυμα μετ’ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/003.yaml
  text: When King Herod heard this[a], he was troubled[b], and all Jerusalem with him.
translation:
  language: am
  text: ንጉሥ ሄሮድስ ይህን በሰማ ጊዜ ታወከ፤[a] ኢየሩሳሌምም ሁሉ ከእርሱ ጋር ታወከች።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ደነገጠ» ወይም «ተረበሸ»።
    reason: lexical_alternative
  - marker: b
    text: «ኢየሩሳሌም ሁሉ» የሚለው የከተማይቱን ስም ለነዋሪዎቿ የሚጠቀም አገላለጽ ነው፤ በከተማይቱ የተስፋፋውን ድንጋጤ በጥቅል ወይም በማጋነን ሊገልጽ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: ይህን በሰማ ጊዜ
  rationale: የግሪኩ የአኦሪስት አጋዥ ግስ ጊዜን የሚገልጽ ነው። «ይህን» የሚለው ከቅርብ አውዱ፣ ሰብአ ሰገል ካመጡት ወሬ፣ የተገኘውን ተዘዋዋሪ ማሟያ ያሳያል።
- source_word: δὲ
  choice: —
  rationale: ይህ ቀላል የንግግር ማያያዣ በአማርኛው «በሰማ ጊዜ» በሚለው የጊዜ አገላለጽ ውስጥ በተፈጥሮ ተወክሏል፤ ራሱን የቻለ ቃል መጨመር አያስፈልግም።
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: ንጉሥ ሄሮድስ
  rationale: የንግሥናውን ማዕረግና የግለሰቡን ስም በተፈጥሯዊ ዘመናዊ የአማርኛ ቅደም ተከተል ያቀርባል።
- source_word: ἐταράχθη
  choice: ታወከ
  rationale: ቃሉ ውስጣዊ መረበሽን፣ ድንጋጤን ወይም መታወክን ያመለክታል። «ታወከ» ስሜታዊ ኃይሉን ሳያጋንን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: πᾶσα Ἱεροσόλυμα
  choice: ኢየሩሳሌምም ሁሉ
  rationale: ግሪኩ የከተማውን ስም ለነዋሪዎቿ በውክልና ይጠቀማል። ይህ አተረጓጎም ያንኑ ዘይቤ ጠብቆ «ሕዝቡ» ወይም «መሪዎቹ» የሚል ያልተጻፈ ገደብ አይጨምርም።
- source_word: μετ’ αὐτοῦ
  choice: ከእርሱ ጋር
  rationale: የμετά ከጄኒቲቭ ጋር ያለውን ቀጥተኛ ትርጉም ያቀርባል፤ የኢየሩሳሌም መታወክ ከሄሮድስ ጋር መሆኑን ይጠብቃል።
theological_decisions:
- issue: የπᾶσα Ἱεροσόλυμα ወሰን
  choice: ከተማይቱን እና ነዋሪዎቿን በጥቅል የሚወክል አገላለጽ
  alternative: ብዙ የኢየሩሳሌም ሰዎችን የሚያመለክት ማጋነን፣ ወይም በተለይ የከተማይቱን መሪዎች የሚያመለክት ንባብ
  rationale: ግሪኩ ከተማይቱን በጥቅል ይጠራል። ትርጉሙ ይህን የትረካ ውጥረት ጠብቆ ጥቅሱ ከሚናገረው በላይ ማኅበራዊ ወይም ፖለቲካዊ ዝርዝር አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ለኢየሩሳሌም የተሰጠው የነጠላ ሴት ግስ «ታወከች» ከተማይቱን እንደ ሰዋሰዋዊ ነጠላ ስም ይዞ የግሪኩን ውክልናዊ አገላለጽ ይጠብቃል።
