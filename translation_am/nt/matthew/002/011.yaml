id: MAT.2.11
reference: Matthew 2:11
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἐλθόντες εἰς τὴν οἰκίαν εἶδον τὸ παιδίον μετὰ Μαρίας τῆς μητρὸς αὐτοῦ, καὶ πεσόντες προσεκύνησαν αὐτῷ, καὶ ἀνοίξαντες τοὺς θησαυροὺς αὐτῶν προσήνεγκαν αὐτῷ δῶρα, χρυσὸν καὶ λίβανον καὶ σμύρναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/011.yaml
  text: 'And when they came into the house[a], they saw the child with Mary his mother, and falling down they paid homage to him, and opening their treasures they offered him gifts: gold and frankincense and myrrh.'
translation:
  language: am
  text: ወደ ቤት ገብተው ልጁን ከእናቱ ከማርያም ጋር አዩት፤ ወድቀውም ሰገዱለት[a]። የሀብት ማስቀመጫዎቻቸውንም ከፍተው ስጦታዎችን አቀረቡለት፤ እነዚህም ወርቅ፣ ዕጣንና ከርቤ ነበሩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «አመለኩት።» የግሪኩ ግስ እንደ አውዱ ማምለክን ወይም በታላቅ አክብሮት መስገድን ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκίαν
  choice: ቤቱ
  rationale: ቃሉ የመኖሪያ ቤትን በቀጥታ ያመለክታል፤ «ቤቱ» ተጨማሪ ትርጓሜ ሳይጨምር ተጨባጩን ስፍራ ይጠብቃል።
- source_word: παιδίον
  choice: ሕፃኑን
  rationale: παιδίον ሕፃንን ወይም ትንሽ ልጅን ያመለክታል፤ «ሕፃኑ» ፆታውን ከግሪኩ በላይ ሳይወስን ተፈጥሯዊ ነው።
- source_word: μετὰ Μαρίας τῆς μητρὸς αὐτοῦ
  choice: ከእናቱ ከማርያም ጋር
  rationale: μετά አብሮነትን ያሳያል፤ ይህ አገላለጽ ማርያም እናቱ መሆኗን ግልጽና ተፈጥሯዊ በሆነ አማርኛ ያስቀምጣል።
- source_word: πεσόντες
  choice: ወድቀውም
  rationale: የአካል እንቅስቃሴውን በቀጥታ ይጠብቃል፤ ከተከታዩ የመስገድ ግስ ጋር በመጣመር የመደፋቱን ሁኔታ ያሳያል።
- source_word: προσεκύνησαν
  choice: ሰገዱለት
  rationale: «መስገድ» በአማርኛ የክብር መደፋትንም ሆነ አምልኮን ሊያመለክት ስለሚችል የግሪኩን የትርጉም ስፋት ይጠብቃል።
- source_word: θησαυροὺς
  choice: የሀብት ማከማቻዎቻቸውን
  rationale: ቃሉ ሀብትን ወይም ሀብት የተቀመጠበትን ማከማቻ ሊያመለክት ይችላል። «ከፍተው» ከሚለው ግስ ጋር ማከማቻውን ማመልከት ተፈጥሯዊ ሲሆን «ሣጥን» ብሎ ቅርጹን አይወስንም።
- source_word: προσήνεγκαν ... δῶρα
  choice: ስጦታ አቀረቡለት
  rationale: የስጦታ አቀራረቡን መደበኛና ክብር ያለው ቃና በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: λίβανον
  choice: ዕጣን
  rationale: በዚህ አውድ የሚጠቀሰውን frankincense በአማርኛ በተለመደው ስሙ ይገልጻል።
- source_word: σμύρναν
  choice: ከርቤ
  rationale: σμύρναን በትክክል የሚወክለው የተለመደ የአማርኛ ስም ነው።
theological_decisions:
- issue: προσκυνέω ለሕፃኑ ኢየሱስ የተደረገውን ድርጊት እንዴት ማቅረብ እንደሚገባ
  choice: ሰገዱለት
  alternative: አመለኩት
  rationale: የግሪኩ ግስ ለንጉሥ የሚደረግን እጅግ የጠለቀ ክብር ወይም በጠንካራ ሃይማኖታዊ ትርጉም አምልኮን ሊገልጽ ይችላል። «ሰገዱለት» ይህን ውጥረት በዋናው ጽሑፍ ይጠብቃል፤ «አመለኩት» ደግሞ በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ዓረፍተ ነገር ተከታታይነት ተጠብቆ ለአማርኛ ንባብ በሥርዓተ ነጥብ ተከፍሏል። የግብዓቱ የእግር ማስታወሻ ምልክት ከ«ቤት» ቀጥሎ ተቀምጦ ቢሆንም ይዘቱ προσκυνέωን ስለሚመለከት፣ [a] በትክክለኛው ሐረግ «ሰገዱለት» ላይ ተቀምጧል።
