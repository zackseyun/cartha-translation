    reason: alternative_reading
  revision_rationale: The revision removes the possessive not present in the source, represents δῶρα as plural, and smooths the expression for the treasures. It retains the established ambiguity of προσκυνέω in both the main text and footnote, with the footnote anchor correctly placed after «ሰገዱለት».
