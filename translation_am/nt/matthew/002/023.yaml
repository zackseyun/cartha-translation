  rationale: የግሪኩ የቀደመ ድርጊት አመልካች አሳታፊ ግስ፣ ከዋናው ግስ በፊት የሆነውን መምጣት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: κατῴκησεν
  choice: ኖረ
  rationale: በአንድ ስፍራ መኖርን ወይም መኖሪያ ማድረግን በግልጽና በዘመናዊ አማርኛ ይገልጣል፤ ከግሱ በላይ የዘላቂነት ሐሳብ አይጨምርም።
- source_word: εἰς πόλιν λεγομένην Ναζαρέτ
  choice: ናዝሬት በተባለች ከተማ
  rationale: ከκατοικέω ጋር ያለው εἰς በአማርኛ በቦታ አመልካች አገባብ በተፈጥሮ ይተረጎማል፤ πόλις ደግሞ ‘ከተማ’ ተብሎ ቀጥተኛ ትርጉሙን ይዞአል።
- source_word: ὅπως πληρωθῇ
  choice: እንዲፈጸም ነው
  rationale: የዓላማና የውጤት ግንኙነቱን እንዲሁም የማቴዎስን የትንቢት ፍጻሜ አገላለጽ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: τὸ ῥηθὲν
  choice: ተብሎ የተነገረው
  rationale: የተነገረውን ይዘት የሚያመለክተውን የግሪኩን አንቀጻዊ አሳታፊ ግስ በተለመደ አማርኛ ያቀርባል።
- source_word: διὰ τῶν προφητῶν
  choice: በነቢያት አማካይነት
  rationale: διά ከወራሽ ቅጽ ጋር ያለውን የመካከለኛ ወኪልነት ትርጉም ይጠብቃል፤ ነቢያት የመለኮታዊው መልእክት አስተላላፊዎች መሆናቸውን ያሳያል።
- source_word: Ναζωραῖος
  choice: ናዝራዊ
  rationale: በዚህ አውድ ከናዝሬት ጋር የተያያዘውን መጠሪያ ይገልጣል፤ ከናዝራዊነት ስእለት ጋር እንዳይደባለቅ የትንቢታዊ ዳራው አለመረጋገጥ በማስታወሻ ተገልጧል።
- source_word: κληθήσεται
  choice: ይባላል
