base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/015.yaml
  text: and was there until the death of Herod[a], so that what was spoken by the Lord through the prophet might be fulfilled, saying[c][b], “Out of Egypt I called my son.”
translation:
  language: am
  text: ሄሮድ እስኪሞት ድረስ በዚያ ነበረ፤ ይህም ጌታ በነቢዩ አማካይነት የተናገረው[a] እንዲፈጸም ነበር፤ ሲል፦ “ከግብፅ[b] ልጄን ጠራሁ።”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ጌታ በነቢዩ በኩል የተናገረው።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ከግብፅ ውስጥ።”
    reason: lexical_alternative
  - marker: c
    text: ማቴዎስ ሆሴዕ 11፥1ን ይጠቅሳል። በሆሴዕ የመጀመሪያ ዐውድ “ልጄ” የሚለው እስራኤልን ያመለክታል፤ እዚህ ግን ማቴዎስ ይህ ቃል በኢየሱስ እንደተፈጸመ ያቀርባል።
    reason: cross_reference
lexical_decisions:
- source_word: ἦν ἐκεῖ
  choice: በዚያ ነበረ
  rationale: የግሪኩን ቀላል አገላለጽ በቀጥታ ያስቀምጣል፤ “ቆየ” የሚለውን ተጨማሪ ፍቺ አያስገባም።
- source_word: ἕως τῆς τελευτῆς Ἡρῴδου
  choice: ሄሮድ እስኪሞት ድረስ
  rationale: τελευτή በዚህ ስፍራ ሞትን ያመለክታል፤ የተመረጠውም አገላለጽ በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: ἵνα πληρωθῇ
  choice: እንዲፈጸም ሆነ
  rationale: የዓላማና የውጤት ኃይሉን ሳይደመስስ የማቴዎስን የፍጻሜ አገላለጽ ይጠብቃል።
- source_word: τὸ ῥηθὲν ὑπὸ κυρίου διὰ τοῦ προφήτου
  choice: ጌታ በነቢዩ አማካይነት የተናገረው
  rationale: ጌታን የቃሉ ዋና ምንጭ፣ ነቢዩንም መካከለኛ አድርጎ የሚያቀርበውን የግሪኩን ልዩነት ይጠብቃል።
- source_word: λέγοντος
  choice: እንዲህ ይላል
  rationale: ጥቅሱን በተፈጥሯዊ አማርኛ ያስተዋውቃል፣ የ“ሲል”ንም ትርጉም ያስተላልፋል።
- source_word: Ἐξ Αἰγύπτου
  choice: ከግብፅ
  rationale: ἐξ የሚያመለክተውን ከቦታ መውጣት በተለመደና ግልጽ አማርኛ ያቀርባል።
- source_word: ἐκάλεσα
  choice: ጠራሁት
  rationale: καλέω የሚለውን “መጥራት” በቀጥታ ይተረጉማል፤ የአድራጊውንና የተሳቢውን ግንኙነትም በአማርኛ ግስ ውስጥ በተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: τὸν υἱόν μου
  choice: ልጄን
  rationale: የወንድ ልጅነት ግንኙነቱን በዐውዱ ግልጽ አድርጎ የሚያቀርብ ተፈጥሯዊ አማርኛ ነው፤ “ወንድ ልጄን” በዚህ ስፍራ ከባድ ይሆናል።
theological_decisions:
- issue: የሆሴዕ 11፥1 ጥቅስና የፍጻሜ አገላለጽ
  choice: ማቴዎስ ኢየሱስ ከግብፅ መመለሱን የቃሉ ፍጻሜ አድርጎ እንዳቀረበ በቀጥታ ማስተላለፍ
  alternative: ጥቅሱን ቀጥተኛ ትንቢት ብቻ ወይም የእስራኤልን ታሪክ እንደገና መፈጸም ብቻ አድርጎ መተርጎም
  rationale: ጽሑፉ ፍጻሜን በግልጽ ያስታውቃል፣ ነገር ግን የፍጻሜውን ዘዴ አይገድብም፤ ስለዚህ ትርጉሙ ያለውን ሥነ መለኮታዊ ውጥረት አይፈታም።
- issue: κύριος በፍጻሜው አገላለጽ
  choice: ጌታ
  alternative: እግዚአብሔር
  rationale: የግሪኩ κύριος በቀጥታ “ጌታ” ነው፤ የዕብራይስጡን መለኮታዊ ስም በዋናው ጽሑፍ ውስጥ ገብቶ መወሰን አያስፈልግም።
- issue: “ልጄ” በሆሴዕና በማቴዎስ ዐውድ
  choice: ዋናውን ጥቅስ ሳይለውጥ የሁለቱን ዐውድ በማስታወሻ መግለጽ
  alternative: “ልጄ”ን በዋናው ጽሑፍ “እስራኤል” ወይም “መሲሑ” ብሎ ማብራራት
  rationale: υἱός የሚለውን ግልጽ የልጅነት ቃል መጠበቅ እና የትርጓሜ ውሳኔን በጽሑፉ ላይ አለመጫን ያስፈልጋል።
