- source_word: ἐν τῇ ἀνατολῇ
  choice: በምሥራቅ
  rationale: ሐረጉን እንደ አቅጣጫ ያቀርባል፤ “በወጣ ጊዜ” የሚለው እውነተኛ ሥነ ፈለካዊ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ἤλθομεν
  choice: መጥተናል
  rationale: የመምጣታቸው ድርጊት ተፈጽሞ በንግግሩ ጊዜ ያለውን ውጤት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: προσκυνῆσαι αὐτῷ
  choice: ልንሰግድለት
  rationale: “መስገድ” በአማርኛም ለንጉሥ የሚቀርብ ክብርን ወይም ሃይማኖታዊ አምልኮን ሊያመለክት ስለሚችል የግሪኩን የትርጉም ስፋት ይጠብቃል።
