  yaml_path: translation/nt/matthew/002/002.yaml
  text: saying[b][a], “Where is the one who has been born king of the Jews? For we saw his star in the east and have come to pay him homage.”
translation:
  language: am
  text: እንዲህም አሉ፦ “የአይሁድ ንጉሥ ሆኖ የተወለደው የት ነው? ምክንያቱም ኮከቡን በምሥራቅ[a] አይተን ልንሰግድለት[b] መጥተናል።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ኮከቡ ሲወጣ።” የግሪኩ ሐረግ “በምሥራቅ” ማለት ወይም የኮከቡን መውጣት ማመልከት ይችላል።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ “እሱን ልናመልክ።” የግሪኩ ግስ እንደ ዐውዱ ለንጉሥ መስገድን ወይም ማምለክን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
