  text: Ἀναχωρησάντων δὲ αὐτῶν ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ φεῦγε εἰς Αἴγυπτον, καὶ ἴσθι ἐκεῖ ἕως ἂν εἴπω σοι· μέλλει γὰρ Ἡρῴδης ζητεῖν τὸ παιδίον τοῦ ἀπολέσαι αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/013.yaml
  text: After they had departed[a], behold, an angel of the Lord appeared to Joseph in a dream, saying, “Get up, take the child and his mother, and flee to Egypt, and stay there until I tell you[c][b]; for Herod is about to seek the child in order to destroy him.”
translation:
  language: am
  text: እነርሱም ከሄዱ በኋላ፣ እነሆ፣ የጌታ መልአክ ለዮሴፍ በሕልም ታይቶ፣ “ተነሥ፤ ሕፃኑንና እናቱን ይዘህ ወደ ግብፅ ሽሽ፤ እስከምነግርህም ድረስ በዚያ ቆይ። ሄሮድ ሕፃኑን ሊያጠፋው ሊፈልግ ነውና” አለው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ሊያጠፋው” ማለት በዚህ ዐውድ “ሊገድለው” ማለት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναχωρησάντων δὲ αὐτῶν
  choice: እነርሱም ከሄዱ በኋላ
  rationale: የግሪኩ ገለልተኛ የባለቤት አገባብ ከዋናው ድርጊት በፊት የተፈጸመውን መሄድ ያሳያል፤ ይህ አተረጓጎም ቅደም ተከተሉን በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: የማቴዎስን ድንገተኛና ትኩረት ሰጪ የትረካ ምልክት ይጠብቃል።
- source_word: ἄγγελος κυρίου
  choice: የጌታ መልአክ
  rationale: κύριοςን በተለመደው መጽሐፍ ቅዱሳዊ ማዕረግ ‘ጌታ’ ይተረጉማል፤ የአማርኛው የባለቤት አገባብ የግሪኩን ትርጉም በተፈጥሯዊ መንገድ ያቀርባል።
- source_word: φαίνεται κατ’ ὄναρ
  choice: በሕልም ታይቶ
  rationale: የታሪኩን ያለፈ ጊዜ በአማርኛ ይጠብቃል፤ κατ’ ὄναρ የእንቅልፍ ሁኔታን ብቻ ሳይሆን ‘በሕልም’ ማለት ነው።
- source_word: Ἐγερθεὶς
  choice: ተነሥ
  rationale: ሰዋስዋዊ መልኩ ቦዝ አንቀጽ ቢሆንም በትእዛዝ ቅደም ተከተል ውስጥ የትእዛዝ ኃይል አለው።
- source_word: παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ
  choice: ሕፃኑንና እናቱን ይዘህ
  rationale: παράλαβε ከራስ ጋር ይዞ መሄድን ያመለክታል፤ ‘ይዘህ’ ይህን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: φεῦγε εἰς Αἴγυπτον
  choice: ወደ ግብፅ ሽሽ
  rationale: φεῦγε በአደጋ ምክንያት በአስቸኳይ ማምለጥን ያሳያል፤ ‘ሽሽ’ የቃሉን ኃይል ይጠብቃል።
- source_word: ἴσθι ἐκεῖ ἕως ἂν εἴπω σοι
  choice: እስከምነግርህም ድረስ በዚያ ቆይ
  rationale: ቃል በቃል ‘በዚያ ሁን’ የሚለው በዐውዱ ቀጣይ ቆይታን ያመለክታል፤ የወደፊቱን ያልተወሰነ የጊዜ ገደብም ይጠብቃል።
- source_word: μέλλει γὰρ Ἡρῴδης ζητεῖν
  choice: ሄሮድ … ሊፈልገው ነውና
  rationale: μέλλει በቅርቡ ሊፈጸም ያለን ዓላማ ወይም ድርጊት ያሳያል፤ የአማርኛው ‘ሊ… ነው’ ይህን የቅርብ እቅድ ይገልጣል።
- source_word: τοῦ ἀπολέσαι αὐτό
  choice: ሊያጠፋው
  rationale: ἀπόλλυμι ማጥፋትን ይገልጣል፤ በዚህ ዐውድ የሕፃኑን ሞት ማስከተል ማለት ነው።
theological_decisions:
- issue: በἄγγελος κυρίου ውስጥ የκύριος አተረጓጎም
  choice: ጌታ
  alternative: ባለቤት
  rationale: ‘ጌታ’ በዚህ የመጽሐፍ ቅዱስ አገባብ የተለመደና ትክክለኛ ማዕረግ ነው፤ ጽሑፉ ከሚለው በላይ የመልአኩን ማንነት አይወስንም።
- issue: ἀπολέσαι በዚህ ዐውድ
  choice: ሊያጠፋው
  alternative: ሊገድለው
  rationale: ‘ሊያጠፋው’ የግሪኩን ሰፊ የቃል ቅርጽ ይጠብቃል፤ ዐውዱ ግን ውጤቱ መግደል መሆኑን ያሳያል።
