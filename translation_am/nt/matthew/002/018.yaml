  rationale: θέλω ፈቃድን ወይም መፈለግን ይገልጣል፤ ይህ ትርጉም ‘እምቢ አለች’ ከሚለው ይልቅ የግሪኩን አገላለጽ በቅርብ ይጠብቃል። παρακληθῆναι በዚህ አውድ መጽናናት ማለት ነው።
