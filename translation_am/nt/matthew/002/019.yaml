  text: Τελευτήσαντος δὲ τοῦ Ἡρῴδου ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ ἐν Αἰγύπτῳ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/019.yaml
  text: But after Herod died[a], behold, an angel of the Lord appears in a dream to Joseph in Egypt.
translation:
  language: am
  text: ሄሮድስ ከሞተ በኋላ ግን፣ እነሆ፣ የጌታ መልአክ[a] በግብፅ ለነበረው ለዮሴፍ በሕልም ታየ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የጌታ መልአኩ።” በግሪኩ ጽሑፍ “መልአክ” ከሚለው ቃል በፊት መስተዋድድ የለም።
    reason: alternative_reading
lexical_decisions:
- source_word: Τελευτήσαντος ... τοῦ Ἡρῴδου
  choice: ሄሮድስ ከሞተ በኋላ
  rationale: የዘርፍ ፍጹም አንቀጽን በተፈጥሯዊ የጊዜ ሐረግ ይገልጣል፤ ድርጊቱ ከመልአኩ መታየት በፊት መፈጸሙን ያሳያል።
- source_word: δὲ
  choice: ግን
  rationale: በትረካው ውስጥ ያለውን ለስላሳ ንፅፅርና ሽግግር ይጠብቃል።
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: የማቴዎስን ግርማ ያለው የትኩረት ጥሪ በተለመደ የአማርኛ መጽሐፋዊ ቃል ያስተላልፋል።
- source_word: ἄγγελος κυρίου
  choice: አንድ የጌታ መልአክ
  rationale: ἄγγελος ያለ መስተዋድድ ስለመጣ፣ በዋናው ጽሑፍ ያልተወሰነነቱን ለማሳየት ‘አንድ’ ተጠቅሟል፤ κυρίου ደግሞ ‘የጌታ’ ተብሏል።
- source_word: φαίνεται
  choice: ታየው
  rationale: ቃሉን በቀጥታና በተፈጥሯዊ አማርኛ ያስተላልፋል። የግሪኩ ታሪካዊ የአሁን ጊዜ በአማርኛ በአሁን ጊዜ ቢቀርብ እንደ ቀጣይ ወይም አጠቃላይ ድርጊት ሊሰማ ስለሚችል፣ ተፈጥሯዊው ያለፈ ጊዜ ተመርጧል።
- source_word: κατ’ ὄναρ
  choice: በሕልም
  rationale: በሕልም የተቀበለውን መለኮታዊ መገለጥ በተለመደና አጭር አማርኛ ይገልጣል።
- source_word: τῷ Ἰωσὴφ ἐν Αἰγύπτῳ
  choice: በግብፅ ለነበረው ለዮሴፍ
  rationale: ዮሴፍ በዚያን ጊዜ በግብፅ እንደነበርና መልአኩ ለእርሱ እንደታየ ግልጽና ተፈጥሯዊ በሆነ የአማርኛ አወቃቀር ያቀርባል።
theological_decisions:
- issue: κυρίου በἄγγελος κυρίου ውስጥ እንዴት እንደሚተረጎም
  choice: የጌታ
  alternative: የገዢው
  rationale: በዚህ መለኮታዊ አገባብ κύριος የተለመደውን ‘ጌታ’ የሚለውን ትርጉም ይፈልጋል፤ ‘ገዢ’ የሚለው የፖለቲካ ወይም የሰው ሥልጣን ሊያሰማ ይችላል።
- issue: ἄγγελος ያለ መስተዋድድ መምጣቱ
  choice: አንድ የጌታ መልአክ
  alternative: የጌታ መልአኩ
  rationale: የግሪኩ ጽሑፍ ከ‘መልአክ’ በፊት መስተዋድድ ስለሌለው፣ ዋናው ትርጉም መልአኩን በቀጥታ ከአንድ ልዩ መለኮታዊ ማንነት ጋር አያያይዘውም። ሆኖም የተወሰነው አቀራረብ በትርጉም ባህልና በመጽሐፍ ቅዱሳዊ ትስስር የሚታወቅ ስለሆነ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለሕዝብ ቀላል የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘እነሆ’ የትረካውን ግርማና ድንገተኛ ትኩረት ለመጠበቅ ተቀምጧል።
