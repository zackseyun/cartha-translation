id: MAT.2.8
reference: Matthew 2:8
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ πέμψας αὐτοὺς εἰς Βηθλέεμ εἶπεν· Πορευθέντες ⸂ἐξετάσατε ἀκριβῶς⸃ περὶ τοῦ παιδίου· ἐπὰν δὲ εὕρητε, ἀπαγγείλατέ μοι, ὅπως κἀγὼ ἐλθὼν προσκυνήσω αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/008.yaml
  text: And after sending them to Bethlehem[a], he said, “Go and search carefully for the child, and when you find him, report to me, so that I too may come and worship him.”
translation:
  language: am
  text: ወደ ቤተ ልሔም ከላካቸው በኋላ፣ “ሂዱ፤ ስለ ልጁ በጥንቃቄ አጣሩ። ባገኛችሁትም ጊዜ ንገሩኝ፤ እኔም መጥቼ እንድሰግድለት” አላቸው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “እንድሰግድለት” የሚለው “እንዳመልከው” ወይም “በፊቱ ጎንበስ ብዬ ክብር እንድሰጠው” ተብሎም ሊተረጎም ይችላል። የግሪኩ ግስ አምልኮን ወይም በንጉሣዊ ሰው ፊት የሚደረግን የክብር ስግደት ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: πέμψας
  choice: ላካቸውና
  rationale: የግሪኩ የቀደመ ድርጊት አመልካች ቦዝ አንቀጽ ከዋናው ግስ በፊት የተፈጸመውን መላክ ያሳያል፤ በአማርኛ ‘ላካቸውና … አላቸው’ የድርጊቶቹን ቅደም ተከተል ተፈጥሯዊ አድርጎ ያቀርባል።
- source_word: Πορευθέντες
  choice: ሂዱ
  rationale: ቦዝ አንቀጹ ከἐξετάσατε ጋር የትእዛዝ ኃይል አለው፤ ‘ሂዱ’ በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: ἐξετάσατε ἀκριβῶς
  choice: በጥንቃቄ ፈልጉ
  rationale: የግሱና የተውሳከ ግሱ ጥምረት ዝርዝርና ትክክለኛ ፍለጋን ወይም ምርመራን ያመለክታል፤ ይህ አገላለጽ በትረካው አውድ ተስማሚ ነው።
- source_word: περὶ τοῦ παιδίου
  choice: ስለ ሕፃኑ
  rationale: περί በቀጥታ ‘ስለ/በተመለከተ’ የሚል ወሰን አለው። ‘ስለ ሕፃኑ በጥንቃቄ ፈልጉ’ የልጁን ቦታና ሁኔታ በጥንቃቄ እንዲያጣሩ የተሰጠውን ትእዛዝ ሳያጠብ ያቀርባል።
- source_word: παιδίου
  choice: ሕፃኑ
  rationale: παιδίον ልጅን ወይም ትንሽ ልጅን ያመለክታል፤ ‘ሕፃን’ በዚህ የልደት ትረካ ውስጥ ተፈጥሯዊና በቂ ነው።
- source_word: ἐπὰν δὲ εὕρητε
  choice: ባገኛችሁትም ጊዜ
  rationale: ἐπάν ከንዑስ አንቀጽ ጋር የወደፊት ጊዜያዊ ሁኔታን ይገልጣል። ይህ አገላለጽ ‘ስታገኙት/ባገኛችሁት ጊዜ’ የሚለውን የሚጠበቅ ነገር ግን ገና ያልተፈጸመ ሁኔታ ይጠብቃል።
- source_word: ἀπαγγείλατέ μοι
  choice: ንገሩኝ
  rationale: ግሱ ወሬ ወይም ሪፖርት መልሶ ማቅረብን ያመለክታል፤ ‘ንገሩኝ’ በአማርኛ አውዱ ውስጥ ይህን በተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: ὅπως
  choice: ዘንድ
  rationale: ὅπως የዓላማ ንዑስ አንቀጽን ያስገባል፤ ‘ዘንድ’ ዓላማውን በክቡር ነገር ግን ተረዳሽ የአማርኛ አገላለጽ ያሳያል።
- source_word: κἀγὼ
  choice: እኔም
  rationale: κἀγώ የκαί እና ἐγώ ውህደት ሲሆን ‘እኔም’ የሄሮድስን የጋራ ዓላማ ይገባኛል የሚል አስመሳይ አባባል በአጭሩ ይይዛል።
- source_word: ἐλθὼν προσκυνήσω αὐτῷ
  choice: ሄጄ እሰግድለት
  rationale: ቦዝ አንቀጹና ዋናው ግስ በአማርኛ በተከታታይ ድርጊት ‘ሄጄ እሰግድለት’ ተብለው ተፈጥሯዊ ሆነው ይቀርባሉ። προσκυνέω በአካል መጎንበስን፣ ለንጉሥ ክብር መስጠትን ወይም ማምለክን ሊገልጽ ይችላል፤ ‘መስገድ’ ይህን ሆን ተብሎ ያልተፈታ ስፋት ይጠብቃል።
theological_decisions:
- issue: προσκυνήσω αὐτῷ ሕፃኑን በተመለከተ የሚሰጠው ትርጉም
  choice: እሰግድለት
  alternative: አመልከው ዘንድ / ክብር ልሰጠው
  rationale: προσκυνέω ለንጉሥ በመጎንበስ ክብር መስጠትንም ሆነ ሃይማኖታዊ አምልኮን ሊያመለክት ይችላል። የአማርኛው ‘መስገድ’ ተመሳሳይ የትርጉም ስፋት ስላለው በሄሮድስ የውሸት ንግግርና በማቴዎስ ሰፊ የኢየሱስ አቀራረብ መካከል ያለውን ውጥረት ሳይፈታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር የአማርኛ ትረካ ተጠቅመናል። ‘ዘንድ’ የዓላማ ግንኙነቱን በአጭር መንገድ ያሳያል፤ ‘መስገድ’ ደግሞ የግሪኩን ሥነ ቃላዊና ሥነ መለኮታዊ አሻሚነት ይጠብቃል። የግርጌ ማስታወሻው ምልክት [a] በዋናው ጽሑፍ ተካትቷል።
