revisions:
- from: ከዚያም ወደ ቤተ ልሔም ላካቸውና፣ “ሂዱ፤ ስለ ሕፃኑ በጥንቃቄ ፈልጉ። ባገኛችሁትም ጊዜ እኔም ሄጄ እሰግድለት ዘንድ ንገሩኝ” አላቸው።[a]
  to: ወደ ቤተ ልሔም ከላካቸው በኋላ፣ “ሂዱ፤ ስለ ልጁ በጥንቃቄ አጣሩ። ባገኛችሁትም ጊዜ ንገሩኝ፤ እኔም መጥቼ እንድሰግድለት” አላቸው።[a]
  rationale: 'The revision clarifies the source-text sequence and purpose relation: the visitors must report after finding the child, so that Herod too may come and bow down/pay homage/worship. It also replaces “ሄጄ” with “መጥቼ” for ἐλθών and uses a natural broad equivalent for παιδίον. The footnote anchor and lexical ambiguity are preserved.'
