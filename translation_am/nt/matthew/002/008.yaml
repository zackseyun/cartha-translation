review_pass:
  verdict: revise
  source_fidelity: The draft generally reflects the Greek well, including the careful inquiry, the expected future condition, Herod's claimed shared intent, and the semantic breadth of προσκυνέω. However, the placement of “ንገሩኝ” after the purpose clause obscures the required sequence—find the child, report to Herod, then Herod may come—and “ሄጄ” does not adequately represent ἐλθών (“having come”).
  naturalness: The proposed revision uses clear, modern standard Amharic and makes the instruction sequence explicit. “መጥቼ እንድሰግድለት” naturally conveys the purposive sense without turning the final clause into an awkward fragment.
  terminology: “ልጁ” is a natural, appropriately broad rendering of παιδίον. “እሰግድለት” retains the deliberate ambiguity of προσκυνέω; the footnote appropriately gives both worship and royal-homage senses.
  issues:
  - severity: medium
    issue: The reporting command is syntactically attached too closely to Herod's purpose clause.
    rationale: The source directs the visitors to report to Herod when they find the child, with the report serving the purpose that Herod himself may come and proskynēsō. Reordering the clauses makes this relation unambiguous in Amharic.
  - severity: low
    issue: “ሄጄ” renders the motion as “having gone,” rather than ἐλθών, “having come.”
    rationale: “መጥቼ” more closely preserves the Greek motion verb from Herod's stated perspective.
  revised_text: ወደ ቤተ ልሔም ከላካቸው በኋላ፣ “ሂዱ፤ ስለ ልጁ በጥንቃቄ አጣሩ። ባገኛችሁትም ጊዜ ንገሩኝ፤ እኔም መጥቼ እንድሰግድለት” አላቸው።[a]
