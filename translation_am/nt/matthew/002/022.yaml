id: MAT.2.22
reference: Matthew 2:22
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὅτι Ἀρχέλαος ⸀βασιλεύει τῆς Ἰουδαίας ἀντὶ ⸂τοῦ πατρὸς αὐτοῦ Ἡρῴδου⸃ ἐφοβήθη ἐκεῖ ἀπελθεῖν· χρηματισθεὶς δὲ κατ’ ὄναρ ἀνεχώρησεν εἰς τὰ μέρη τῆς Γαλιλαίας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/022.yaml
  text: But when he heard that Archelaus was reigning over Judea in place of his father Herod[a], he was afraid to go there. And after being warned in a dream, he withdrew to the regions of Galilee,
translation:
  language: am
  text: ነገር ግን አርኬላዎስ በአባቱ በሄሮድስ ፈንታ በይሁዳ እየነገሠ እንደሆነ በሰማ ጊዜ፣ ወደዚያ ለመሄድ ፈራ። በሕልም ማስጠንቀቂያ ከተሰጠው በኋላም፣ ወደ ገሊላ አካባቢዎች አቀና።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: በሰማ ጊዜ
  rationale: የቀደመውን ሁኔታ የሚያመለክተውን የአኦሪስት አሳታፊ ቅርጽ በተፈጥሯዊ አማርኛ የጊዜ ሐረግ ያስተላልፋል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ዮሴፍ ሊመለስ ካሰበው ነገር ጋር የተፈጠረውን ተቃራኒ ሁኔታና የትረካውን ለውጥ ያሳያል።
- source_word: βασιλεύει τῆς Ἰουδαίας
  choice: በይሁዳ እየነገሠ
  rationale: βασιλεύω ያለውን የንጉሣዊ አገዛዝ ፍቺ ይጠብቃል፤ በአማርኛም ከቦታ ጋር ‘በይሁዳ ነገሠ’ ተፈጥሯዊ ነው።
- source_word: ἀντὶ τοῦ πατρὸς αὐτοῦ Ἡρῴδου
  choice: በአባቱ በሄሮድስ ፈንታ
  rationale: ἀντί የሚያመለክተውን መተካት ወይም በሌላው ስፍራ መሆን በግልጽ መንገድ ይገልጣል።
- source_word: ἐφοβήθη ἐκεῖ ἀπελθεῖν
  choice: ወደዚያ ለመሄድ ፈራ
  rationale: የፍርሃቱን ምክንያታዊ ዓላማ በተፈጥሯዊና ቀጥተኛ አማርኛ ያቀርባል።
- source_word: χρηματισθεὶς
  choice: ከተጠነቀቀ በኋላ
  rationale: ተገብሮ ያለውን ቅርጽና የማስጠንቀቅ ፍቺ ይጠብቃል፤ በግሪኩ ያልተገለጠውን ፈጻሚ ‘እግዚአብሔር’ ብሎ አይጨምርም።
- source_word: κατ’ ὄναρ
  choice: በሕልም
  rationale: በማቴዎስ የተለመደውን በእንቅልፍ ጊዜ የተቀበለ መልእክት የሚገልጥ አጭርና ተፈጥሯዊ አባባል ነው።
- source_word: ἀνεχώρησεν
  choice: ሄደ
  rationale: በዐውዱ ውስጥ ከአደጋ በመራቅ ወደ ሌላ ስፍራ መሄድን ያመለክታል፤ ‘አፈገፈገ’ ወታደራዊ ወይም ከመጠን ያለፈ ስሜት ሊሰጥ ስለሚችል ቀላሉ ቃል ተመርጧል።
- source_word: εἰς τὰ μέρη τῆς Γαλιλαίας
  choice: ወደ ገሊላ አውራጃዎች
  rationale: የμέρηን ብዙ ቁጥር በመጠበቅ የገሊላን ክፍሎች ወይም አካባቢዎች ያመለክታል።
theological_decisions:
- issue: በχρηματισθείς ውስጥ የማስጠንቀቂያውን መለኮታዊ ምንጭ በግልጽ መጨመር ወይም አለመጨመር
  choice: ‘በሕልምም ከተጠነቀቀ በኋላ’ ተብሎ ፈጻሚው ሳይጨመር ቀርቧል።
  alternative: ‘እግዚአብሔር በሕልም ካስጠነቀቀው በኋላ’ ወይም ‘መለኮታዊ መመሪያ ከተቀበለ በኋላ’
  rationale: ቃሉ በማቴዎስ ብዙ ጊዜ መለኮታዊ ማስጠንቀቂያን ቢያመለክትም፣ የግሪኩ ጽሑፍ ፈጻሚውን አይጠቅስም። ስለዚህ የጽሑፉ አሻሚነት ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ብዙ ቁጥር ‘μέρη’ በ‘አውራጃዎች’ ተንጸባርቋል፤ የχρηματισθείς ፈጻሚ ግን እንደ ምንጩ ጽሑፍ ሳይገለጥ ቀርቷል።
