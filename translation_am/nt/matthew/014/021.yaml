  yaml_path: translation/nt/matthew/014/021.yaml
  text: Those who ate were about five thousand men[a], besides women and children.
translation:
  language: am
  text: ሴቶችና ልጆች ሳይቆጠሩ[a]፣ የበሉት ወንዶች አምስት ሺህ ያህል ነበሩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ከሴቶችና ከልጆች በቀር»።
    reason: χωρίς በቁጥሩ ውስጥ አለመካተትን ያመለክታል፤ «ሳይቆጠሩ» ዋናውን ትርጉም በግልጽ ያሳያል፣ «በቀር» ደግሞ ቅርብ የሆነ አማራጭ አገላለጽ ነው።
lexical_decisions:
- source_word: οἱ δὲ ἐσθίοντες
  choice: የበሉትም
  rationale: በመስተዋድድ የቀረበው የአሁን ጊዜ አጋማሽ ግስ ምግቡን የተካፈሉትን ሰዎች ያመለክታል፤ «የበሉት» በአማርኛ ተፈጥሯዊ ነው፣ δέ ደግሞ በ«ም» ቀላል የትረካ ትስስር አግኝቷል።
- source_word: ἦσαν
  choice: ነበሩ
  rationale: የεἰμί ያልተፈጸመ ጊዜ ቅርጽ እዚህ ቁጥሩን በቀላሉ ይገልጣል፤ «ነበሩ» ተፈጥሯዊው አማርኛ አቻ ነው።
- source_word: ἄνδρες
  choice: ወንዶች
  rationale: ቃሉ በተለይ ወንድ ሰዎችን ያመለክታል፤ ሴቶችና ልጆች በተለየ መጠቀሳቸውም ይህን ያረጋግጣል።
- source_word: ὡσεὶ
  choice: ያህል
  rationale: የግምት ቁጥርን ያመለክታል፤ «ያህል» በቁጥር አጠገብ የተለመደና ተፈጥሯዊ ነው።
- source_word: πεντακισχίλιοι
  choice: አምስት ሺህ
  rationale: የግሪኩን የቁጥር እሴት በቀጥታ ያስተላልፋል።
- source_word: χωρὶς
  choice: በቀር
  rationale: ከመቁጠሩ መለየትን ወይም አለመካተትን ያሳያል፤ «በቀር» ቃሉን በቅርብ ይከተላል፣ የታሰበውንም ልዩነት ይጠብቃል።
- source_word: γυναικῶν
  choice: ሴቶች
  rationale: በዚህ የቁጥር አውድ ውስጥ γυνή የጋብቻ ግንኙነትን ሳይሆን ሴቶችን በአጠቃላይ ያመለክታል።
- source_word: παιδίων
  choice: ልጆች
  rationale: παιδίον ልጅን ያመለክታል፤ «ልጆች» ዕድሜያቸውን ሳያስፈልግ የሚያጠብ ተፈጥሯዊ ትርጉም ነው።
theological_decisions:
- issue: በተቀላቀለ ሕዝብ ውስጥ ፆታን ለይቶ የሚገልጥ የቁጥር ቃል
  choice: ἄνδρεςን «ወንዶች» ብሎ መተርጎምና ሴቶችና ልጆች በቁጥሩ እንዳልተካተቱ መግለጽ
  alternative: «ሰዎች» ወይም «ሕዝብ»
  rationale: ግሪኩ ወንድ ሰዎችን በተለይ ይቆጥራል፣ ሴቶችንና ልጆችንም ለይቶ ይጠቅሳል። «ሰዎች» ማለት ይህን የቃሉን ልዩነት ያጠፋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የትረካ ትስስር በ«ም» ተወክሏል፤ የግምት ቁጥሩና በፆታ የተለየው ቆጠራ ተጠብቀዋል።
