    issue: Ambiguity in the main rendering of χωρίς
    rationale: «ከሴቶችና ከልጆች በቀር» can grammatically attach awkwardly to «ወንዶች» and may suggest an exception rather than that women and children were not included in the stated count. Rendering the exclusion explicitly as «ሳይቆጠሩ» best communicates the source sense.
  revised_text: ሴቶችና ልጆች ሳይቆጠሩ[a]፣ የበሉት ወንዶች አምስት ሺህ ያህል ነበሩ።
