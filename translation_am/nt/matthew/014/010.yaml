  choice: ሰዎችን ልኮ … አስከፋው
  alternative: ልኮ … አንገቱን ቆረጠው
  rationale: ግሪኩ ዋናውን ግስ ለሄሮድ ይመድባል፣ ነገር ግን πέμψας ድርጊቱ በተላኩ አገልጋዮች እንደተፈጸመ ያሳያል። አማርኛው የሄሮድን ኃላፊነትም ሆነ የአፈጻጸሙን መካከለኛነት ይጠብቃል።
translation_notes:
