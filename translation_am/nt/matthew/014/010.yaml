lexical_decisions:
- source_word: καὶ
  choice: -ም
  rationale: ቀዳሚውን ትረካ የሚያስቀጥለውን ቀላል አያያዥ በተፈጥሯዊ የአማርኛ አገላለጽ ያሳያል።
- source_word: πέμψας
  choice: ሰዎችን ልኮ
  rationale: የግሪኩ የአኦሪስት ቦዝ አንቀጽ ከዋናው ድርጊት በፊት ሰዎች መላካቸውን ያሳያል፤ የተላኩት እነማን እንደሆኑ ግን አይገልጽም።
- source_word: ἀπεκεφάλισεν
  choice: አስከፋው
  rationale: ግስ በቀጥታ ‘አንገቱን ቆረጠ’ ማለት ሲሆን፣ የላከው ሄሮድ ድርጊቱን በተላኩ ሰዎች እንዳስፈጸመ የሚገባውን አማርኛ አስደራጊ አቀራረብ ይጠብቃል።
- source_word: τὸν Ἰωάννην
  choice: ዮሐንስን
  rationale: በጽሑፉ ያለውን የግል ስም ብቻ ይተረጉማል፤ ‘መጥምቁ’ የሚለውን በዚህ ቁጥር የሌለ መረጃ አይጨምርም።
- source_word: ἐν τῇ φυλακῇ
  choice: በወኅኒ
  rationale: φυλακή በዚህ አውድ የእስር ቦታን ያመለክታል፤ ‘በወኅኒ’ አጭር፣ ግልጽና የተከበረ ዘመናዊ አገላለጽ ነው።
