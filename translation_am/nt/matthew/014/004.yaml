    reason: የἔξεστινን የሕጋዊነት ስሜት የሚያሳይ ተለዋጭ አገላለጽ።
lexical_decisions:
- source_word: ἔλεγεν
  choice: እያለው ነበር
  rationale: የግሪኩ ያልተፈጸመ የኃላፊ ጊዜ አወቃቀር በቀድሞ ጊዜ የቀጠለውን ወይም ተደጋጋሚውን ንግግር ያሳያል፤ ይህ አማርኛ አገላለጽ ያንን ቀጣይነት በተፈጥሮ ይገልጣል።
- source_word: γὰρ
  choice: ነበርና
  rationale: γάρ ከቀደመው ትረካ ጋር የሚያያዝ ምክንያታዊ ማብራሪያ ነው፤ የአማርኛው ‘-ና’ ይህን ግንኙነት በተፈጥሮ ያስተላልፋል።
- source_word: αὐτῷ
  choice: እያለው
  rationale: በ‘-ው’ የተገለጠው ተዘዋዋሪ ተሳቢ ንግግሩ ለእርሱ እንደተነገረ ያሳያል።
- source_word: ὁ Ἰωάννης
  choice: ዮሐንስ
  rationale: ምንጩ ተናጋሪውን በስሙ ብቻ ይጠራዋል፤ ዐውዱም ማንነቱን አስቀድሞ ያሳውቃል።
- source_word: Οὐκ ἔξεστίν
  choice: ሕጋዊ አይደለም
  rationale: ἔξεστιν ፈቃድን ወይም በሕግ መፈቀድን ይገልጣል፤ በዚህ ዐውድ ‘ሕጋዊ አይደለም’ የተግሣጹን ሕጋዊና ሥነ ምግባራዊ ኃይል ይጠብቃል።
- source_word: σοι
  choice: ለአንተ
  rationale: ከግላዊ ያልሆነው ἔξεστιν ጋር ያለው የመዳረሻ ቅጽ ፈቃዱ ወይም ክልከላው ለማን እንደሆነ ያመለክታል።
- source_word: ἔχειν
  choice: ማግባት
  rationale: ቃሉ በቀጥታ ‘መያዝ/እንደ ራስ ማድረግ’ ሊሆን ቢችልም፣ በዚህ ዐውድ ሴቲቱን እንደ ሚስት መያዝን ያመለክታል። ‘እርሷን መያዝ’ በዘመናዊ አማርኛ የጋብቻውን ትርጉም ግልጽ ስለማያደርግ ‘ማግባት’ ተመርጧል።
- source_word: αὐτήν
  choice: እርሷን
  rationale: ተውላጠ ስሙ በቀጥታ ሄሮድያዳን ያመለክታል፤ ‘እርሷን’ የምንጩን ተውላጠ ስም ይጠብቃል።
theological_decisions:
