lexical_decisions:
- source_word: καὶ
  choice: እነርሱም
  rationale: የትረካውን ቀጣይነት በአማርኛ ተፈጥሯዊ በሆነው አያያዥ «-ም» ያሳያል፤ በግሪክኛው የግል ተውላጠ ስም የተገለጸውን ባለቤትም በግልጽ ያቀርባል።
- source_word: ἀναβάντων αὐτῶν
