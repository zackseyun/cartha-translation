  choice: እነርሱ ወደ ጀልባው ሲገቡ ነፋሱ መቆሙን ብቻ በግልጽ መተርጎም
  alternative: ተአምራዊ ሥልጣኑን በትርጉሙ ውስጥ በተጨማሪ ቃላት ማጉላት
  rationale: የክስተቱ ሥነ መለኮታዊ ፍቺ ከአውዱ ይታያል፤ ነገር ግን ግሪክኛው በዚህ ቁጥር ላይ የማብራሪያ ቃላትን አልጨመረም።
