- source_word: πλοῖον
  choice: ጀልባ
  rationale: በገሊላ ባሕር ላይ ያለውን የዓሣ ማጥመጃ መርከብ በትክክለኛ መጠንና በዘመናዊ አጠቃቀም ይገልጻል።
- source_word: ἐκόπασεν
  choice: ቆመ
  rationale: κοπάζω ለነፋስ ሲነገር «መቆም፣ መብረድ» ማለት ነው። «ቆመ» ድርጊቱ መቋረጡን አጭርና ተፈጥሯዊ በሆነ አማርኛ ይገልጻል፤ በግሪክኛው ያልተገለጸ ቀስ በቀስ የመረጋጋት ሂደት አይጨምርም።
- source_word: ὁ ἄνεμος
  choice: ነፋሱ
  rationale: የተወሰነውን ስም በአማርኛው የትውቅነት ቅጥያ «-ው» በቀጥታ ያቀርባል።
