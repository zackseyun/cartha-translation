source:
  edition: SBLGNT
  text: ὀψίας δὲ γενομένης προσῆλθον αὐτῷ οἱ ⸀μαθηταὶ λέγοντες· Ἔρημός ἐστιν ὁ τόπος καὶ ἡ ὥρα ἤδη παρῆλθεν· ἀπόλυσον τοὺς ὄχλους, ἵνα ἀπελθόντες εἰς τὰς κώμας ἀγοράσωσιν ἑαυτοῖς βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/015.yaml
  text: When evening came[a], the disciples came to him and said, “The place is deserted, and the hour is already late. Send the crowds away[b], so that they may go into the villages and buy food for themselves.”
translation:
  language: am
  text: ምሽት ሲሆን ደቀ መዛሙርቱ ወደ እርሱ ቀርበው፣ “ቦታው ሰው የማይኖርበት ነው፤ ሰዓቱም አርፍዷል።[a] ሕዝቡን አሰናብት፤ ወደ መንደሮች ሄደው ለራሳቸው ምግብ እንዲገዙ” አሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “ሰዓቱ አልፎአል።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψίας δὲ γενομένης
  choice: ምሽት በሆነ ጊዜ
  rationale: የጊዜ ሽግግሩን በተፈጥሯዊ አማርኛ ያሳያል፤ δέ የትረካ ቅደም ተከተልን ስለሚያገናኝ ያልተገለጸ ‘አሁን’ አልተጨመረም።
- source_word: προσῆλθον αὐτῷ
  choice: ወደ እርሱ ቀርበው
  rationale: ወደ ኢየሱስ መምጣትንና መቅረብን በተፈጥሯዊ የትረካ አገላለጽ ያስተላልፋል።
- source_word: οἱ μαθηταὶ
  choice: ደቀ መዛሙርቱ
  rationale: መስተዋድዱ ቀደም ሲል የታወቀውን ቡድን ያመለክታል፤ በምንጩ የሌለው የባለቤትነት ቅጽ አልተጨመረም።
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: ይህ ቦታ ሰው የማይኖርበት ነው
  rationale: ἔρημος እዚህ ሰፈራ የሌለበትን ወይም ከሰው መኖሪያ የራቀን ቦታ ያመለክታል፤ ‘ምድረ በዳ’ የተወሰነ የመሬት ዓይነት እንዳያስመስል ግልጽ አገላለጽ ተመርጧል።
- source_word: ἡ ὥρα ἤδη παρῆλθεν
  choice: ሰዓቱም አርፍዷል
  rationale: ቃል በቃል ‘ሰዓቱ አልፎአል’ የሚለውን የቀኑ መርፈድ ትርጉም በተፈጥሯዊ አማርኛ ይገልጻል፤ ቃል በቃሉ ቅርጽ በማስታወሻ ተጠብቋል።
- source_word: ἀπόλυσον τοὺς ὄχλους
  choice: ሕዝቡን … ስደዳቸው
  rationale: በዚህ አውድ ἀπολύω ሰዎቹን እንዲሄዱ መልቀቅ ወይም መስደድ ማለት ነው፤ የብዙ ቁጥር ማመሳከሪያው በአማርኛ ተፈጥሯዊ ነው።
- source_word: ἵνα ἀπελθόντες εἰς τὰς κώμας
  choice: ወደ መንደሮች ሄደው … እንዲገዙ
  rationale: የተሳቢውንና የዓላማ ንዑስ አረፍተ ነገርን ቅደም ተከተል በተፈጥሯዊ አማርኛ ይጠብቃል፤ በምንጩ የሌለው ‘አቅራቢያ’ አልተጨመረም።
- source_word: ἀγοράσωσιν ἑαυτοῖς βρώματα
  choice: ለራሳቸው ምግብ እንዲገዙ
  rationale: βρώματα በግልጽ ሁኔታ ‘ምግብ’ ሲሆን ἑαυτοῖς የተባለውም ‘ለራሳቸው’ በሚል ተጠብቋል።
