  yaml_path: translation/nt/matthew/014/016.yaml
  text: But Jesus said to them[a], “They have no need to go away; you yourselves give them something to eat.”
translation:
  language: am
  text: ኢየሱስ ግን፣ “እነርሱ መሄድ አያስፈልጋቸውም፤ እናንተው የሚበሉትን ስጧቸው” አላቸው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እነርሱ መሄድ አያስፈልጋቸውም፤ እናንተው ምግብ ስጧቸው።”
    reason: φαγεῖν ከδότε ጋር ያለው አገባብ ‘የሚበሉትን’ ወይም በአጭሩ ‘ምግብ’ ተብሎ በተፈጥሯዊ አማርኛ ሊቀርብ ይችላል።
lexical_decisions:
- source_word: δὲ
  choice: ግን
  rationale: ደቀ መዛሙርቱ ሕዝቡን ለመሸኘት ካቀረቡት ሐሳብ ጋር ያለውን መጠነኛ ንፅፅር ያሳያል።
- source_word: εἶπεν αὐτοῖς
  choice: አላቸው
  rationale: በዘመናዊ አማርኛ የንግግር መግቢያውንና የብዙ ተቀባዮቹን ማጣቀሻ በተፈጥሯዊ ሁኔታ ይገልጻል።
- source_word: Οὐ χρείαν ἔχουσιν
  choice: አያስፈልጋቸውም
  rationale: ‘ፍላጎት/አስፈላጊነት የላቸውም’ የሚለውን የግሪኩን ፈሊጥ በግልጽና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἀπελθεῖν
  choice: መሄድ
  rationale: ሕዝቡ ከቦታው እንዲሄድ የቀረበውን ሐሳብ ያለ ተጨማሪ ትርጓሜ ይገልጻል።
- source_word: δότε
  choice: ስጧቸው
  rationale: የሁለተኛ መደብ ብዙ ቁጥር ትእዛዙንና ተቀባዮቹን በአማርኛ በግልጽ ያሳያል።
- source_word: ὑμεῖς
  choice: እናንተው
  rationale: በግሪኩ በግልጽ የተጠቀሰውን አጽንዖታዊ ተውላጠ ስም ጠብቆ፣ ምግብ እንዲሰጡ የታዘዙት ደቀ መዛሙርቱ ራሳቸው መሆናቸውን ያሳያል።
- source_word: φαγεῖν
  choice: የሚበሉትን
  rationale: ከ‘ስጡ’ ጋር የተያያዘውን የዓላማ ፍቺ ‘የሚበላ ነገር’ በሚለው ተፈጥሯዊ የአማርኛ አገላለጽ ያቀርባል።
theological_decisions:
- issue: በትእዛዙ ውስጥ በደቀ መዛሙርቱ ሚና ላይ የተሰጠው አጽንዖት
  choice: ὑμεῖς የሚለውን ‘እናንተው’ ብሎ በአጽንዖት መተርጎም
