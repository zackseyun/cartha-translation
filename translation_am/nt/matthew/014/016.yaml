  rationale: ይህ ምርጫ ኢየሱስ ትእዛዙን በቀጥታ ለደቀ መዛሙርቱ መስጠቱን በግሪኩ ያለውን አጽንዖት ጠብቆ ያሳያል፤ ተጨማሪ ሥነ መለኮታዊ ትርጓሜ አይጨምርም።
