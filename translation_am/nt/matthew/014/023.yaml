  text: καὶ ἀπολύσας τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος κατ’ ἰδίαν προσεύξασθαι. ὀψίας δὲ γενομένης μόνος ἦν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/023.yaml
  text: And after dismissing the crowds[a], he went up on the mountain by himself to pray. When evening came, he was there alone.
translation:
  language: am
  text: ሕዝቡንም ካሰናበተ በኋላ፣ ለብቻው[a] ሊጸልይ ወደ ተራራው ወጣ። በመሸም ጊዜ በዚያ ብቻውን ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በግሉ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύσας
  choice: ካሰናበተ በኋላ
  rationale: የቀደመውን ድርጊት የሚያመለክተውን የአኦሪስት ተሳቢ ግስ በተፈጥሯዊ የአማርኛ ጊዜ አገላለጽ ያቀርባል፤ ‘አሰናበተ’ ሕዝቡን መልቀቁን ያለ ተጨማሪ ፍቺ ይገልጣል።
- source_word: τοὺς ὄχλους
  choice: ሕዝቡን
  rationale: በአማርኛ ‘ሕዝቡን’ በቦታው የተሰበሰቡትን ብዙ ሰዎች በተፈጥሯዊ ሁኔታ ይጠቅሳል። የግሪኩ ብዙ ቁጥር በአማርኛ የስብስብ ስም ተወክሏል።
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: ወደ ተራራው ወጣ
  rationale: ወደ ከፍተኛው የተራራ ስፍራ የተደረገውን እንቅስቃሴ በቀጥታና በዘመናዊ አማርኛ ይገልጣል።
- source_word: κατ’ ἰδίαν
  choice: ለብቻው
  rationale: ከሌሎች ተለይቶ በግሉ መሆኑን በተፈጥሯዊ አማርኛ ይገልጣል፤ ‘በግሉ’ የሚለው አማራጭም በማስታወሻ ተጠብቋል።
- source_word: προσεύξασθαι
  choice: ሊጸልይ
  rationale: የወጣበትን ዓላማ የሚገልጠውን የግሪክ ኢንፊኒቲቭ በአማርኛ የዓላማ ግስ ቅርጽ ያስተላልፋል።
- source_word: ὀψίας δὲ γενομένης
  choice: በመሸም ጊዜ
  rationale: የግሪኩን የጊዜ ሁኔታ በአጭርና ተፈጥሯዊ አማርኛ ያቀርባል፤ ‘ም’ የትረካውን ሽግግር ያገናኛል።
- source_word: μόνος ἦν ἐκεῖ
  choice: በዚያ ብቻውን ነበር
  rationale: ἐκεῖ የሚለውን የቦታ ማመልከቻና μόνος የሚያጎላውን ብቸኝነት ሁለቱንም በግልጽ ሁኔታ ይጠብቃል።
