  choice: ጌታ ሆይ
  alternative: መምህር ሆይ / ጌታዬ
  rationale: ቃሉን ተራ የአክብሮት ጥሪ ብቻ አድርጎ ሳይገድብ፣ በማቴዎስ ውስጥ ሊኖረው የሚችለውን ሥነ መለኮታዊ ክብደት ክፍት ያደርጋል።
