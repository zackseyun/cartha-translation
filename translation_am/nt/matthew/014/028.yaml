    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ αὐτῷ ὁ Πέτρος εἶπεν
  choice: ጴጥሮስም መልሶ … አለው
  rationale: የግሪኩን የትረካ ቀመር በተፈጥሯዊ አማርኛ ያቀርባል፤ -ም የδέን የትስስር ሚና ይይዛል፣ አለውም αὐτῷን ያካትታል።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: ቀጥተኛ ጥሪውንና ቃሉ ሊኖረው የሚችለውን ክርስቶሳዊ ክብደት ሳያሳንስ ይጠብቃል።
- source_word: εἰ σὺ εἶ
  choice: አንተ ከሆንክ
  rationale: በዐውዱ ያለውን የማንነት ማረጋገጫ ‘if it is you’ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: κέλευσόν με ἐλθεῖν πρὸς σὲ
  choice: ወደ አንተ እንድመጣ እዘዘኝ
  rationale: κελεύω ያለውን የሥልጣን ትእዛዝ ኃይል ይጠብቃል፤ πρὸς σέ ደግሞ እንቅስቃሴው ወደ ኢየሱስ መሆኑን ያሳያል።
- source_word: ἐπὶ τὰ ὕδατα
  choice: በውኆቹ ላይ
  rationale: የግሪኩን ብዙ ቁጥር τὰ ὕδατα ይጠብቃል፤ በአማርኛም ግልጽና የተከበረ አገላለጽ ነው።
