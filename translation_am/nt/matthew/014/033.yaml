  rationale: θεοῦ በግሪኩ የወሰን አመልካች ባይኖረውም፣ የትንቢታዊ ስም ክፍሉ አወቃቀርና የማቴዎስ ዐውድ ሐረጉን እንደ ታወቀ ክርስቶሳዊ ማዕረግ ያቀርቡታል። ‘አንድ … ልጅ’ ማለት ያልተወሰነ ኃይል በመጨመር ንግግሩን ያዳክማል።
