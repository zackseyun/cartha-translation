base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/030.yaml
  text: But seeing the strong wind[a], he became afraid, and beginning to sink, he cried out, saying, “Lord[b], save me.”
translation:
  language: am
  text: ነገር ግን ኃይለኛውን ነፋስ[a] ባየ ጊዜ ፈራ፤ መስጠምም ሲጀምር፣ “ጌታ ሆይ፣ አድነኝ![b]” ብሎ ጮኸ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ኃይል የበዛበትን ነፋስ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ታደገኝ!” የግሪኩ ግስ ከቅርብ አደጋ መታደግንም ሆነ በሰፊው መዳንን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπων
  choice: ባየ ጊዜ
  rationale: የአሁን ጊዜው አንቀጽ ከዋናው ግስ ጋር በአንድ ጊዜ የተፈጸመውን ማየት ያሳያል፤ “ባየ ጊዜ” ይህን ትስስር በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ጴጥሮስ በውኃው ላይ መሄዱን ተከትሎ የመጣውን ድንገተኛ የትረካ ተቃርኖ ያሳያል።
- source_word: ἄνεμον ἰσχυρόν
  choice: ኃይለኛውን ነፋስ
  rationale: ἰσχυρός የነፋሱን ብርታት በቀጥታ ይገልጣል፤ “ኃይለኛ ነፋስ” ትክክለኛና ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
- source_word: ἐφοβήθη
  choice: ፈራ
  rationale: የፍርሃቱን መከሰት በአጭርና በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἀρξάμενος καταποντίζεσθαι
  choice: መስጠምም ሲጀምር
  rationale: ድርጊቱ ገና መጀመሩን ይጠብቃል፤ ሙሉ በሙሉ መስጠሙን ወይም መሞቱን አያመለክትም።
- source_word: ἔκραξεν λέγων
  choice: ብሎ ጮኸ
  rationale: የጥሪውን አስቸኳይነትና ከፍተኛ ድምፅ በተፈጥሯዊ የአማርኛ አወቃቀር ያስተላልፋል።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: በቀጥታ ጥሪ ውስጥ κύριοςን በትክክል ይተረጉማል፤ “ሆይ” የጥሪውን ቅርጽ ያሳያል።
- source_word: σῶσόν με
  choice: አድነኝ
  rationale: ከቅርብ አደጋ የመታደግን ትርጉም ሲያቀርብ የσῴζωን ሰፊ የማዳን ድምፀትም ይጠብቃል።
theological_decisions:
- issue: በቀጥታ ለኢየሱስ የቀረበውን κύριος መተርጎም
  choice: ጌታ ሆይ
  alternative: መምህር ሆይ
  rationale: “ጌታ” የቃሉን መደበኛ ትርጉምና በማቴዎስ ትረካ ያለውን ክርስቶሳዊ ክብደት ይጠብቃል፤ ጽሑፉ ከሚለው በላይ ግን አይጨምርም።
- issue: በቅርብ የአካል አደጋ ውስጥ σῴζωን መተርጎም
  choice: አድነኝ
  alternative: ታደገኝ
  rationale: “አድነኝ” በዚህ ስፍራ ከአደጋ ማዳንን በግልጽ ያሳያል፤ ቃሉ ሊኖረው የሚችለውን ሰፊ የመዳን ድምፀትም ሳያጠብ ይጠብቃል።
