  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ተሳቢ አንቀጾች በተፈጥሯዊ የአማርኛ የጊዜና የተከታታይነት አወቃቀር ቀርበዋል።
