base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/026.yaml
  text: But when the disciples saw him walking on the sea[a], they were terrified, saying, “It is a ghost!” And they cried out from fear.
translation:
  language: am
  text: ደቀ መዛሙርቱ ግን በባሕሩ ላይ ሲራመድ ባዩት ጊዜ ደነገጡ፤ “መናፍስት ነው!”[a] ብለው አሉ። ከፍርሃታቸውም የተነሣ ጮኹ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “የታየ መንፈስ” ወይም “ምናምንቴ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ግን
  rationale: በትረካው ውስጥ ቀላል ንፅፅርንና ወደ ደቀ መዛሙርቱ ድንጋጤ የሚደረገውን ሽግግር ያሳያል።
- source_word: μαθηταὶ
  choice: ደቀ መዛሙርቱ
  rationale: የተወሰነውንና በዐውዱ የታወቀውን የኢየሱስ ደቀ መዛሙርት ቡድን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἰδόντες αὐτὸν
  choice: ባዩት ጊዜ
  rationale: የግሪኩን የቀደመ ድርጊት በተፈጥሯዊ የጊዜ ሐረግ ያቀርባል፤ የተሳቢው ቅጥያም ያዩት እርሱን እንደሆነ ያሳያል።
- source_word: ἐπὶ τῆς θαλάσσης περιπατοῦντα
  choice: በባሕሩ ላይ ሲራመድ
  rationale: በባሕሩ ገጽ ላይ የመራመድን እንቅስቃሴ በግልጽና በቀጥተኛ አገላለጽ ያስተላልፋል።
- source_word: ἐταράχθησαν
  choice: ደነገጡ
  rationale: በድንገተኛው እይታ ምክንያት የተነሣውን ከፍተኛ መረበሽና ፍርሃት ያሳያል።
- source_word: λέγοντες
  choice: አሉ
  rationale: ከዋናው ግስ ጋር ተመሳሳይ ጊዜ ያለውን ንግግር በተፈጥሯዊ የአማርኛ ትረካ ይገልጣል።
- source_word: Φάντασμά ἐστιν
  choice: ምትሐት ነው!
  rationale: φάντασμα የሚያመለክተውን ያልተለመደ የመንፈስ መሰል መገለጥ ያስተላልፋል፤ ቃሉም የደቀ መዛሙርቱን ፈሪ ግምት እንጂ የትረካውን የማንነት ፍርድ አይገልጥም።
- source_word: ἀπὸ τοῦ φόβου
  choice: ከፍርሃታቸውም የተነሣ
  rationale: ἀπό እዚህ የሚገልጠውን የምክንያት ወይም የምንጭ ግንኙነት በግልጽ አማርኛ ይጠብቃል።
- source_word: ἔκραξαν
  choice: ጮኹ
  rationale: κράζω የሚያመለክተውን ከፍ ያለ የድምፅ ጩኸት አጭርና ተፈጥሯዊ በሆነ ቃል ይገልጣል።
theological_decisions:
- issue: ደቀ መዛሙርቱ φάντασμα ብለው የገለጹት ነገር ባሕርይ
  choice: በዋናው ጽሑፍ “ምትሐት” ተብሎ ተተርጉሟል።
  alternative: “የታየ መንፈስ” ወይም “ጥላ”
  rationale: ንግግሩ የሚዘግበው የፈሩትን ደቀ መዛሙርት የተሳሳተ ግምት ነው፤ ስለ መናፍስት ሕልውና በራሱ የሚያስተምር የነገረ መለኮት መግለጫ አይደለም። “ምትሐት” ይህን የታየ ነገር ስሜት ያስተላልፋል፤ የማያስፈልግ ዶክትሪናዊ ውሳኔም አያክልም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ የትረካ ቋንቋ ተጠቅሟል። “ደቀ መዛሙርቱ” የተለመደውን መጽሐፍ ቅዱሳዊ ቃል ሲጠብቅ፣ የሐረጉ አወቃቀር ግን ቀጥተኛና ወቅታዊ ነው።
