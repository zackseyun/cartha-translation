  text: καὶ ⸂λυπηθεὶς ὁ βασιλεὺς διὰ⸃ τοὺς ὅρκους καὶ τοὺς συνανακειμένους ἐκέλευσεν δοθῆναι,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/009.yaml
  text: And the king[a], though grieved, because of his oaths and those dining with him[b], commanded it to be given.
translation:
  language: am
  text: ንጉሡም ቢያዝንም፣ ስለ መሐላዎቹና ከእርሱ ጋር በማዕድ ተቀምጠው ስለ ነበሩት[a] እንዲሰጥ አዘዘ[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ «ከእርሱ ጋር በማዕድ የተደገፉት»። ግሪኩ በዚያ ዘመን በምግብ ጊዜ የነበረውን ተደግፎ የመቀመጥ ልማድ ያንጸባርቃል።
    reason: cultural_note
  - marker: b
    text: ግሪኩ ቃል በቃል «እንዲሰጥ» ወይም «እንዲሰጥ እንዲደረግ» የሚል ተደራጊ ቅጽ ይጠቀማል፤ የሚሰጠውን ነገር በግልጽ አይጠቅስም። የታሰበው በቀደመው አውድ የተጠየቀው ነገር ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπηθεὶς
  choice: ቢያዝንም
  rationale: የግስ ቅጹ ንጉሡ ማዘኑን ሲገልጥ፣ ከዚያ በተቃራኒ ትእዛዙን መስጠቱን ያሳያል፤ «ቢያዝንም» ይህን የተቃርኖ ኃይል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ὁ βασιλεὺς
  choice: ንጉሡ
  rationale: βασιλεύς በቀጥታ «ንጉሥ» ማለት ነው፤ የውስንነት አመልካቹም በ«-ሡ» ተገልጧል።
- source_word: διὰ τοὺς ὅρκους
  choice: ስለ ማሎቹ
  rationale: διά ከተሳቢ ጋር ምክንያትን ያመለክታል፤ ὅρκους ደግሞ የተማላቸውን መሐላዎች ያመለክታል። «ማሎቹ» በአማርኛ የተፈጥሮ አገላለጽ ሲሆን ብዙ ቁጥሩንም ይጠብቃል።
- source_word: τοὺς συνανακειμένους
  choice: ከእርሱ ጋር በማዕድ የተቀመጡት
  rationale: ቃሉ በዚያ ዘመን ልማድ በማዕድ አብረው ተደግፈው የተቀመጡትን ያመለክታል። ዋናው ጽሑፍ በዘመናዊና ግልጽ አማርኛ የምግብ ማዕዱን አውድ ይጠብቃል፤ ልዩው የአቀማመጥ ልማድ በማስታወሻ ተገልጧል።
- source_word: ἐκέλευσεν
  choice: አዘዘ
  rationale: κελεύω ትእዛዝ መስጠትን ያመለክታል፤ «አዘዘ» አጭር፣ ግልጽና ለትረካው ክብር የሚስማማ ነው።
- source_word: δοθῆναι
  choice: እንዲሰጣት
  rationale: ይህ ተደራጊ የድርጊት ስም «እንድትሰጥ» የሚል ኃይል አለው። ግሪኩ የሚሰጠውን ነገር በግልጽ አይጠቅስም፤ የአማርኛው «-ት» ከቀደመው አውድ ወደሚታወቀው ሴት ጥያቄ ይመልሳል እንጂ ነገሩን አይጨምርም።
