  text: καὶ κελεύσας τοὺς ὄχλους ἀνακλιθῆναι ἐπὶ ⸂τοῦ χόρτου⸃, λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας, ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κλάσας ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους οἱ δὲ μαθηταὶ τοῖς ὄχλοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/019.yaml
  text: And after ordering the crowds to recline on the grass[a], he took the five loaves and the two fish, looked up to heaven, blessed, and after breaking the loaves he gave them to the disciples, and the disciples to the crowds.
translation:
  language: am
  text: ሕዝቡ በሣሩ ላይ እንዲቀመጥ ካዘዘ በኋላ፣ አምስቱን ዳቦዎችና ሁለቱን ዓሦች ወስዶ ወደ ሰማይ አሻቅቦ ተመለከተ፤ ባረከ[a]፤ ዳቦዎቹንም ቆርሶ ለደቀ መዛሙርቱ ሰጣቸው፤ ደቀ መዛሙርቱም ለሕዝቡ ሰጡ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እግዚአብሔርን ባረከ» ወይም «የበረከት ጸሎት አደረገ።» የግሪክ ጽሑፉ ተሳቢውን በግልጽ ሳይጠቅስ «ባረከ» ብቻ ይላል።
    reason: alternative_reading
lexical_decisions:
- source_word: κελεύσας
  choice: ካዘዘ በኋላ
  rationale: የትእዛዙን ጥንካሬና ከዋናው ድርጊት በፊት መፈጸሙን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τοὺς ὄχλους
  choice: ሕዝቡ
  rationale: ብዙ የተሰበሰቡ ሰዎችን በአማርኛ በተፈጥሯዊ የስብስብ ስም ይገልጻል።
- source_word: ἀνακλιθῆναι
  choice: እንዲቀመጥ
  rationale: ግሱ ለምግብ መደርደርን ወይም መደገፍን ሊያመለክት ቢችልም፣ በዘመናዊ አማርኛ ‘እንዲቀመጥ’ ትዕይንቱን በግልጽና ተፈጥሯዊ ሁኔታ ያቀርባል።
- source_word: ἐπὶ τοῦ χόρτου
  choice: በሣሩ ላይ
  rationale: ማቴዎስ የሰጠውን የቦታ መግለጫ ያለ ተጨማሪ ዝርዝር በቀጥታ ይተረጉማል።
- source_word: τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας
  choice: አምስቱን እንጀራና ሁለቱን ዓሣ
  rationale: ἄρτοι በዚህ የምግብ አውድ የዳቦ እንጀራዎችን ያመለክታል፤ ‘እንጀራ’ በመጽሐፍ ቅዱሳዊ አማርኛ የተለመደና እዚህ ተፈጥሯዊ ነው።
- source_word: ἀναβλέψας εἰς τὸν οὐρανόν
  choice: ወደ ሰማይ አሻቅቦ ተመለከተ
  rationale: ወደ ላይ የማየቱን አቅጣጫና ‘ሰማይ’ የሚለውን ምንጭ በግልጽ ያስቀምጣል።
- source_word: εὐλόγησεν
  choice: ባረከም
  rationale: ግሪኩ ቀጥተኛ ተሳቢ ሳይጠቅስ ‘ባረከ’ ይላል፤ ትርጉሙም ይህን ክፍትነት ሳይዘጋ ይጠብቃል።
- source_word: κλάσας
  choice: እንጀራዎቹንም ቆርሶ
  rationale: የተቆረሰው ነገር ከአውዱ እንጀራዎቹ መሆኑን በግልጽ ያሳያል፤ ድርጊቱም ከመስጠቱ በፊት ነው።
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: ደቀ መዛሙርቱም ለሕዝቡ ሰጡ
  rationale: በግሪኩ የተተወውን ነገር ግስ በአማርኛ ለግልጽነት ይመልሳል።
theological_decisions:
- issue: የεὐλόγησεν (‘ባረከ’) ተሳቢ
  choice: ቀጥተኛ ተሳቢ ሳይጨመር ‘ባረከም’ ተብሎ ተተርጉሟል።
  alternative: ‘እግዚአብሔርን ባረከ’፣ ‘የበረከት ጸሎት አደረገ’ ወይም ምግቡን ‘ባረከው’ ተብሎ ሊገባ ይችላል።
  rationale: የግሪክ ጽሑፉ የበረከቱን ተሳቢ በግልጽ አይናገርም። ዋናው ጽሑፍ ይህን አሻሚነት ይጠብቃል፤ የተለመደው የምግብ ጸሎት ትርጉም በማስታወሻ ተጠቅሷል።
