  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ተከታታይ ክፍሎች ለአማርኛ ተነባቢነት በአጫጭር ዓረፍተ ነገሮች ቀርበዋል፤ የ‘ባረከ’ ተሳቢ ግን ሆን ተብሎ አልተጨመረም።
