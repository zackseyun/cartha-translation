    issue: The main text uses a locative phrase, በጌንሳሬጥ አገር, for a Greek destination construction.
    rationale: ἐπὶ τὴν γῆν εἰς Γεννησαρέτ depicts arrival onto land in/to the Gennesaret region. በ ('in/at') can describe their location after arrival but does not directly represent εἰς ('to/into').
  - severity: low
    issue: The place-name spelling differs from the customary Amharic biblical form.
    rationale: Using ጌንሴሬጥ provides recognizable, consistent biblical nomenclature while still transliterating Γεννησαρέτ.
