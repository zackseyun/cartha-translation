lexical_decisions:
- source_word: διαπεράσαντες
  choice: ከተሻገሩም በኋላ
  rationale: የግሪኩ የአኦሪስት ቦዝ አንቀጽ ከዋናው ግስ በፊት የተፈጸመን ድርጊት ያሳያል፤ አገላለጹም በውኃ ላይ ከአንዱ ወገን ወደ ሌላው መሻገራቸውን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἦλθον
  choice: ደረሱ
  rationale: በመድረሻ ሐረግ የተከተለውን ἔρχομαι በዘመናዊ አማርኛ በተፈጥሮ ይገልጻል፤ ከውኃ ጉዞ በኋላ ወደ ቦታው መድረሳቸውን እንጂ ሌላ ዝርዝር አይጨምርም።
- source_word: ἐπὶ τὴν γῆν εἰς Γεννησαρέτ
  choice: በጌንሳሬጥ አገር
  rationale: የግሪኩ ድርብ መድረሻ አገላለጽ—‘በምድሪቱ ላይ’ እና ‘ወደ ጌንሳሬጥ’—በጌንሳሬጥ ክልል ያለውን የብስ መድረሻ ያመለክታል። ‘አገር’ γῆን ያንጸባርቃል፤ እንደ ‘ዳርቻ’ የሚል ተጨማሪ ትርጓሜ አያስገባም።
- source_word: Γεννησαρέτ
  choice: ጌንሳሬጥ
  rationale: የቦታው ስም በአማርኛ የመጽሐፍ ቅዱስ አጠራር ልማድ መሠረት በፊደል ተላልፏል።
