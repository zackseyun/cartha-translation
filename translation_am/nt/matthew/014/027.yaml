id: MAT.14.27
reference: Matthew 14:27
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀εὐθὺς δὲ ἐλάλησεν ⸂αὐτοῖς ὁ Ἰησοῦς⸃ λέγων· Θαρσεῖτε, ἐγώ εἰμι· μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/027.yaml
  text: But immediately Jesus spoke to them[a], saying, “Take courage; it is I. Do not be afraid.”
translation:
  language: am
  text: ኢየሱስ ግን ወዲያውኑ ተናገራቸው፤ እንዲህም አላቸው፦ “አይዟችሁ! እኔ ነኝ፤[a] አትፍሩ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ አገላለጽ ቃል በቃል “እኔ ነኝ” ይላል። በዚህ ዐውድ ኢየሱስ ራሱን እየለየ መሆኑን ያሳያል፤ ሆኖም አንዳንድ አንባቢዎች በዚህ አገላለጽ ውስጥ የመለኮታዊ ራስን መግለጥ ማስተጋባት ሊያዩ ይችላሉ።
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθύς
  choice: ወዲያውኑ
  rationale: የቃሉን ፈጣን ጊዜያዊ ትርጉም በተፈጥሯዊና በዘመናዊ አማርኛ ያስተላልፋል።
- source_word: δὲ
  choice: ግን
  rationale: ከደቀ መዛሙርቱ ፍርሃት ወደ ኢየሱስ የማጽናኛ ንግግር የሚደረገውን መጠነኛ ንጽጽርና የትረካ ሽግግር ይገልጣል።
- source_word: ἐλάλησεν αὐτοῖς ὁ Ἰησοῦς λέγων
  choice: ኢየሱስ … ብሎ ተናገራቸው
  rationale: የግሪኩን ‘ተናገረላቸው፣ እንዲህ ሲል’ መዋቅር ያለ አላስፈላጊ ድግግሞሽ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: Θαρσεῖτε
  choice: አይዟችሁ
  rationale: የብዙ ቁጥር ትእዛዙን የማበረታቻና የማጽናኛ ኃይል ለዘመናዊ አማርኛ አንባቢ በተለመደ አገላለጽ ያስተላልፋል።
- source_word: ἐγώ εἰμι
  choice: እኔ ነኝ
  rationale: በአማርኛ ተፈጥሯዊ የሆነ ራስን የመለየት አገላለጽ ሲሆን የግሪኩን ቀጥተኛ ‘እኔ ነኝ’ ቅርጽም ይጠብቃል፤ ሊኖረው የሚችለውን ሰፊ ሥነ መለኮታዊ ገደል በማስታወሻ ይገልጣል።
- source_word: μὴ φοβεῖσθε
  choice: አትፍሩ
  rationale: የብዙ ቁጥር ከልካይ ትእዛዙን በግልጽ፣ በአጭርና በተፈጥሯዊ አማርኛ ያቀርባል፤ ‘መፍራታችሁን አቁሙ’ የሚለውን ያልተረጋገጠ የጊዜ ገጽታ አያስገባም።
theological_decisions:
- issue: ἐγώ εἰμι ተራ ራስን መለየት ብቻ ነው ወይስ የመለኮታዊውን ‘እኔ ነኝ’ መጠሪያ ሊያስተጋባ ይችላል?
  choice: በዋናው ጽሑፍ ‘እኔ ነኝ’ ተብሎ ተተርጉሟል፤ ይህም በቅርብ ዐውድ ኢየሱስ ራሱን መሆኑን ለፈሩት ደቀ መዛሙርት መግለጹን ያሳያል።
  alternative: ትርጉሙን በግልጽ ‘ኢየሱስ የመለኮት ስም ተጠቀመ’ ብሎ መወሰን፣ ወይም እንደ ‘እኔው ነኝ’ በማለት የራስ መለያነቱን ብቻ አጥብቆ መግለጽ።
  rationale: የቅርብ ትረካው ዐውድ ቀላል ራስን መለየትን ይደግፋል፤ ሆኖም የግሪኩ ቀጥተኛ ቅርጽ አንዳንድ አንባቢዎች ዘንድ መለኮታዊ ራስን መግለጥን ሊያስተጋባ ይችላል። ትርጉሙ ይህን ውጥረት አይዘጋውም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። ‘አይዟችሁ’ የΘαρσεῖτεን የማበረታቻ ቃና በተፈጥሯዊ ሁኔታ ያስተላልፋል፤ ‘አትፍሩ’ ደግሞ አጭርና ግልጽ ነው።
