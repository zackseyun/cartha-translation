base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/017.yaml
  text: But they said to him[a], “We have nothing here except five loaves and two fish.”
translation:
  language: am
  text: እነርሱ ግን፣ “ከአምስት እንጀራና ከሁለት ዓሣ በቀር እዚህ ምንም የለንም” አሉት።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: እነርሱ ግን
  rationale: የግሪኩ መስተዋድድ አንቀጽ ቀደም ሲል የተጠቀሱትን ደቀ መዛሙርት ያመለክታል፤ δέ ደግሞ ከኢየሱስ ቀዳሚ ትእዛዝ ጋር ያለውን ቀላል ንፅፅር በተፈጥሯዊው “ግን” ያሳያል።
- source_word: λέγουσιν αὐτῷ
  choice: አሉት
  rationale: ግሪኩ ታሪካዊ የአሁን ጊዜን ቢጠቀምም፣ በአማርኛ ትረካ “አሉት” ተፈጥሯዊ ነው፤ αὐτῷ የሚያመለክተውም ኢየሱስን ነው።
- source_word: Οὐκ ἔχομεν ὧδε εἰ μὴ
  choice: ከ… በቀር እዚህ ምንም የለንም
  rationale: አሉታዊው የባለቤትነት አገላለጽና εἰ μή አንድ ላይ “ከ… በቀር … ምንም የለንም” ተብለው በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ሆነው ይተረጎማሉ።
- source_word: πέντε ἄρτους
  choice: አምስት እንጀራ
  rationale: ἄρτος እዚህ ሊቆጠር የሚችል የተጋገረ እንጀራን ያመለክታል፤ “አምስት እንጀራ” በአማርኛ የተለመደውን መጽሐፍ ቅዱሳዊ አጠቃቀም ይጠብቃል።
- source_word: δύο ἰχθύας
  choice: ሁለት ዓሣ
  rationale: ἰχθύας የዓሣ ብዙ ቁጥር ነው፤ ከቁጥር በኋላ “ሁለት ዓሣ” የሚለው አገላለጽ በአማርኛ ተፈጥሯዊ ነው።
