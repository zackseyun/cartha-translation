base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/008.yaml
  text: And she, having been prompted by her mother, says, “Give me here on a platter the head of John the Baptizer.”
translation:
  language: am
  text: እርሷም በእናቷ ተነሳስታ፣ “የአጥማቂውን ዮሐንስ[a] ራስ እዚህ በወጭት ላይ ስጠኝ” አለች።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ በተለመደው አጠራር፣ “መጥምቁ ዮሐንስ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: προβιβασθεῖσα
  choice: ተገፋፍታ
  rationale: የእናቷ ቀዳሚ ተጽዕኖ በልጅቱ ላይ እንደደረሰ የሚያሳየውን ተሳቢ አገላለጽ ይጠብቃል፤ መደበኛ ትእዛዝ እንደተሰጣት አድርጎ አይወስንም።
- source_word: ὑπὸ τῆς μητρὸς αὐτῆς
  choice: በእናቷ
  rationale: ὑπό ከባለቤት አገናዛቢ ጋር በተሳቢው ግስ የድርጊቱን ፈጻሚ ያመለክታል።
- source_word: Δός μοι
  choice: ስጠኝ
  rationale: የነጠላ ቀጥተኛ ትእዛዙን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: φησίν
  choice: አለች
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ ቅርጽ በአማርኛ ትረካ በተፈጥሯዊ ያለፈ ጊዜ ተተርጉሟል፤ የንግግሩ ቀጥተኛነት በጥቅስ ውስጥ ተጠብቋል።
- source_word: ὧδε
  choice: እዚህ
  rationale: የቦታንና በዚያው ስፍራ የመፈጸምን አጽንዖት በቀጥታ ይጠብቃል።
- source_word: ἐπὶ πίνακι
  choice: በትልቅ ወጭት ላይ
  rationale: πίναξ በድግሱ አውድ ምግብ ለማቅረብ የሚያገለግል ሰፊ ወጭትን ያመለክታል፤ ‘ትልቅ ወጭት’ ከብድር ቃል ይልቅ ግልጽ ነው።
- source_word: τὴν κεφαλὴν
  choice: ራስ
  rationale: የትረካውን አስከፊ ግልጽነት ሳያለዝብ በቀጥታ ያስተላልፋል።
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: የአጥማቂውን ዮሐንስ
  rationale: βαπτιστής የዮሐንስን የማጥመቅ ተግባር የሚገልጥ የማዕረግ ስም ነው፤ ‘አጥማቂው’ የግሪኩን የፈጻሚ ስም ግልጽ ያደርጋል።
theological_decisions:
- issue: የዮሐንስ ማዕረግ βαπτιστής አተረጓጎም
  choice: አጥማቂው ዮሐንስ
  alternative: መጥምቁ ዮሐንስ
  rationale: ‘አጥማቂው’ ማዕረጉ የዮሐንስን ተግባር እንደሚገልጥ በዘመናዊ አማርኛ ግልጽ ያደርጋል፤ የተለመደው ‘መጥምቁ’ በማስታወሻ ተጠብቋል።
