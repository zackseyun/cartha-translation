  text: καὶ ἔφαγον πάντες καὶ ἐχορτάσθησαν, καὶ ἦραν τὸ περισσεῦον τῶν κλασμάτων δώδεκα κοφίνους πλήρεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/020.yaml
  text: And they all ate and were satisfied[a], and they picked up twelve full baskets of the leftover pieces.
translation:
  language: am
  text: ሁሉም በልተው ጠገቡ፤ ከተረፉት ቁርጥራጮችም[a] አሥራ ሁለት ሙሉ ቅርጫቶችን አነሱ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “ቁርስራሾች።” የግሪክ ቃሉ ከምግቡ በኋላ የቀሩትን የተቆራረሱ ቁርጥራጮች ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: በልተው
  rationale: የትረካውን ቀጣይነት በተፈጥሯዊ አማርኛ ለማሳየት ከቀጣዩ ግስ ጋር በማያያዝ ተተርጉሟል።
- source_word: πάντες
  choice: ሁሉም
  rationale: ቃሉ መላውን ሕዝብ ያጠቃልላል፤ ‘ሁሉም’ ይህን ሁለንተናዊ ስፋት በግልጽ ያስተላልፋል።
- source_word: ἐχορτάσθησαν
  choice: ጠገቡ
  rationale: በቂ እስኪሆንላቸው ድረስ መብላታቸውን በተፈጥሯዊና አጭር አማርኛ ይገልጻል።
- source_word: ἦραν
  choice: አነሱ
  rationale: αἴρω በቀጥታ ‘ማንሳት’ ማለት ነው፤ በዚህ አውድ የተረፈውን ከቦታው ሰብስቦ ማንሳትን ያመለክታል።
- source_word: τὸ περισσεῦον τῶν κλασμάτων
  choice: የተረፉትን ቁርጥራጮች
  rationale: τὸ περισσεῦον የተረፈውን ነገር፣ κλάσματα ደግሞ የተቆራረሱ ቁርጥራጮችን ያመለክታል። ትርጉሙ የሁለቱንም ቃላት ሐሳብ ይጠብቃል።
- source_word: δώδεκα κοφίνους πλήρεις
  choice: አሥራ ሁለት ቅርጫት ሙሉ
  rationale: ቁጥሩን፣ የዕቃውን ዓይነትና ቅርጫቶቹ መሙላታቸውን በተፈጥሯዊ የአማርኛ አገላለጽ ያስተላልፋል።
theological_decisions:
- issue: የተአምራዊው ምገባ ውጤት በቀላል የጥጋብ ቃል መገለጹ
  choice: ጠገቡ
  alternative: በልተው ረኩ
  rationale: ‘ጠገቡ’ ሁሉም ሰው ሙሉ በሙሉ እንደበላ ያሳያል፤ ጽሑፉ ከሚለው በላይ የሥነ መለኮት ትርጓሜ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ቅርጫት’ ከጥንታዊው ‘መሶብ’ ይልቅ κόφινος የሚለውን አጠቃላይ የቅርጫት ትርጉም በቀላሉ ያስተላልፋል።
