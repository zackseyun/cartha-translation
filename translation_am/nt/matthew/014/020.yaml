    rationale: “ቅርጫት” should be plural with twelve baskets, and “ሙሉ” should modify the baskets in a clear construction. Recasting with “ከተረፉት ቁርጥራጮች አሥራ ሁለት ሙሉ ቅርጫቶችን” preserves the source relation and is idiomatic.
