  verdict: revise
  source_fidelity: The request to touch only the fringe of his garment is conveyed accurately. However, «የነኩትም ሁሉ» is grammatically liable to mean “all that they touched,” rather than “all who touched,” and «ፈጽመው ዳኑ» is not a natural Amharic rendering for the contextual physical healing denoted by διεσώθησαν.
  naturalness: «የነኩም ሁሉ ተፈወሱ» is clear, idiomatic modern standard Amharic. It also avoids the somewhat awkward adverbial expression «ፈጽመው ዳኑ».
  terminology: «ዘርፍ» suitably renders κράσπεδον without prematurely deciding between border, hem, and tassel. «ተፈወሱ» correctly expresses the healing sense required by the immediate narrative context; the note preserves the verb’s broader lexical range.
