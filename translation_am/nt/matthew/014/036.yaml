  rationale: ያልተቋረጠ ወይም ተደጋጋሚ ልመናን የሚያመለክተውን ያልተፈጸመ የግስ መልክ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἵνα μόνον ἅψωνται
  choice: ብቻ እንዲነኩ
  rationale: ἵνα ከንዑስ አንቀጽ ጋር የልመናውን ይዘት ያሳያል፤ μόνον ደግሞ መንካቱ ብቻ እንደተጠየቀ ያጎላል።
- source_word: κρασπέδου
  choice: ዘርፍ
  rationale: የልብስን ጠርዝ፣ ዘርፍ ወይም እንደ ዘለላ ያለ ጫፍ ሊያመለክት የሚችለውን ሰፊ ትርጉም ሳያጠብ ይገልጻል።
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: የልብሱን
  rationale: ἱμάτιον በአጠቃላይ ልብስን፣ በተለይም የውጭ ልብስን ያመለክታል፤ «ልብስ» ካባ ወይም ቀሚስ ብሎ ከልክ በላይ አይወስንም።
- source_word: ὅσοι ἥψαντο
  choice: የነኩትም ሁሉ
  rationale: ὅσοι ያለውን መጠናዊና አከፋፋይ ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ የግሱ ቅጥያ የተነካውን ነገር ከዐውዱ ያመለክታል።
- source_word: διεσώθησαν
  choice: ፈጽመው ዳኑ
  rationale: διασῴζω ከአደጋ ሙሉ በሙሉ መዳንን፣ መዳን/መትረፍን ወይም ጤና መመለስን ሊገልጽ ይችላል። «ፈጽመው ዳኑ» የግሱን ሙሉ መመለስ ኃይል ይጠብቃል፤ ዐውዱም ይህ አካላዊ ፈውስ እንደሆነ ያሳያል።
theological_decisions:
- issue: በተአምራዊ ፈውስ ዐውድ ውስጥ የ διεσώθησαν ትርጉም
  choice: «ፈጽመው ዳኑ»—በዐውዱ ከሕመማቸው መፈወስ
  alternative: «ተፈወሱ» ወይም በሰፊው «ዳኑ/ተረፉ»
  rationale: የቅርብ ዐውዱ አካላዊ ፈውስን ያመለክታል፤ ሆኖም ግሪክኛው ግስ ከ«መፈወስ» የሰፋ የመዳንና የመትረፍ ክልል አለው። ዋናው ጽሑፍ «ዳኑ»ን በመጠቀም ይህን ስፋት ይጠብቃል፤ የግርጌ ማስታወሻው የዐውዱን አካላዊ ፈውስ ያብራራል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። «ዘርፍ» መጽሐፍ ቅዱሳዊ ክብር ያለው ሆኖ የግሪክኛውን የትርጉም ክልል ይጠብቃል፤ «ፈጽመው ዳኑ» ደግሞ የግሱን ጥንካሬና ሆን ብሎ ያልተወገደውን የትርጉም ስፋት ያሳያል።
