    issue: Relative-clause form «የነኩትም ሁሉ»
    rationale: 'The suffixed form የነኩት can be read as “what they touched,” whereas Greek ὅσοι ἥψαντο identifies people: “as many as touched.” «የነኩም ሁሉ» unambiguously identifies those persons.'
  - severity: medium
    issue: «ፈጽመው ዳኑ» for διεσώθησαν
    rationale: Although διασῴζω can have broader rescue/salvation senses, the immediate context is bodily healing. The proposed phrase is not idiomatic in this context and may suggest a theological or general-deliverance sense not intended by the narrative. «ተፈወሱ» is direct and contextually faithful.
