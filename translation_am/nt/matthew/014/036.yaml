    text: ወይም «ጠርዝ» ወይም «ጫፍ»፤ የግሪክኛው ቃል የልብስን ዘርፍ ወይም ጠርዝ፣ ምናልባትም በልብሱ ጫፍ ያለን ዘለላ ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም «ዳኑ» ወይም «ጤናቸው ተመለሰ»፤ የግሪክኛው ግስ በሰፊው መዳንን ወይም መትረፍንም ሊገልጽ ይችላል፤ በዚህ ዐውድ ግን አካላዊ ፈውስን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλουν
