  text: εὐθέως δὲ ὁ Ἰησοῦς ἐκτείνας τὴν χεῖρα ἐπελάβετο αὐτοῦ καὶ λέγει αὐτῷ· Ὀλιγόπιστε, εἰς τί ἐδίστασας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/031.yaml
  text: Immediately Jesus stretched out his hand[a], took hold of him, and said to him, “You of little faith, why did you doubt?”
translation:
  language: am
  text: ወዲያውኑም ኢየሱስ እጁን ዘርግቶ ያዘው፤ “አነስተኛ እምነት ያለህ፣ ለምን ተጠራጠርክ?[a]” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “ለምን አመነታህ?” የግሪኩ ግስ ከመጠራጠር በተጨማሪ ማመንታትን ወይም መወላወልንም ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: ወዲያውኑ
  rationale: የድርጊቱን ፈጣንነትና የትረካውን አጣዳፊነት በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: δὲ
  choice: -ም
  rationale: ቀላል ትረካዊ ሽግግሩን በአማርኛ በተፈጥሯዊ ሁኔታ ያሳያል፤ ግልጽ ተቃርኖ አያስገባም።
- source_word: ἐκτείνας τὴν χεῖρα
  choice: እጁን ዘርግቶ
  rationale: ተጨባጩን ምስልና የድርጊቶቹን ቅደም ተከተል ይጠብቃል።
- source_word: ἐπελάβετο αὐτοῦ
  choice: ያዘው
  rationale: ኢየሱስ ጴጥሮስን እንደያዘው በአጭርና ተፈጥሯዊ አማርኛ ይገልጻል፤ ከምንጩ በላይ የአያያዙን ሁኔታ አይወስንም።
- source_word: λέγει αὐτῷ
  choice: አለው
  rationale: የግሪኩን ታሪካዊ የአሁን ጊዜ ቅርጽ በተፈጥሯዊው የአማርኛ ትረካ ያለፈ ጊዜ ያቀርባል።
- source_word: Ὀλιγόπιστε
  choice: አንተ እምነት የጎደለህ
  rationale: ተግሣጹ የሚያመለክተው የእምነት ማነስን እንጂ ፈጽሞ እምነት አልባ መሆንን አይደለም።
- source_word: εἰς τί
  choice: ለምን
  rationale: በዚህ ጥያቄ ውስጥ ያለውን የምክንያት ፍቺ በተፈጥሯዊ አማርኛ ይሰጣል።
- source_word: ἐδίστασας
  choice: ተጠራጠርክ
  rationale: ዋናውን የመጠራጠር ፍቺ በግልጽ ቋንቋ ያቀርባል፤ የማመንታት ወይም የመወላወል አማራጭ ፍቺ በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: Ὀλιγόπιστε ከ πίστις ጋር ያለው የፍቺ ግንኙነት
  choice: አንተ እምነት የጎደለህ
  alternative: አንተ እምነትህ ያነሰ
  rationale: ቃሉ የእምነትን ማነስ ይገልጻል፤ ጴጥሮስን ፈጽሞ እምነት አልባ ወይም ታማኝነት የሌለው አድርጎ አይገልጸውም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ተሳቢ አወቃቀር በአማርኛ ተፈጥሯዊ የድርጊት ቅደም ተከተል “ዘርግቶ ያዘውና” ተብሎ ቀርቧል፤ የἐδίστασας የፍቺ ስፋት በእግር ማስታወሻ ተጠብቋል።
