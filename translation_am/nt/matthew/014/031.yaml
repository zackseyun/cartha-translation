review_pass:
  verdict: revise
  source_fidelity: The sequence of immediate action, extending the hand, taking hold, and the direct question are conveyed accurately. However, «እምነት የጎደለህ» normally means “lacking faith” and can suggest an absence of faith, whereas Ὀλιγόπιστε denotes one with little/insufficient faith.
  naturalness: The wording is generally clear modern Amharic. Replacing the chained «ያዘውና» with sentence punctuation makes the action and following speech more natural and unambiguous.
  terminology: «አነስተኛ እምነት ያለህ» preserves the πίστις/“faith” terminology and expresses limited faith without portraying Peter as faithless. The footnote appropriately preserves the hesitation/wavering nuance of ἐδίστασας.
  issues:
  - severity: medium
    issue: The rendering of Ὀλιγόπιστε overstates the deficiency of faith.
    rationale: «እምነት የጎደለህ» idiomatically suggests that faith is absent or lacking. The Greek compound rebukes Peter for having little faith, not necessarily none; «አነስተኛ እምነት ያለህ» retains this distinction.
  - severity: low
    issue: The connective in «ያዘውና፣ … አለው» is less smooth than needed.
    rationale: The Greek coordinates the actions and then introduces speech. Ending the action clause with a semicolon produces a clearer, natural Amharic narrative sequence without altering meaning.
  revised_text: ወዲያውኑም ኢየሱስ እጁን ዘርግቶ ያዘው፤ “አነስተኛ እምነት ያለህ፣ ለምን ተጠራጠርክ?[a]” አለው።
