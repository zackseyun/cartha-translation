    reason: lexical_alternative
lexical_decisions:
- source_word: πλοῖον
  choice: ጀልባዪቱ
  rationale: በገሊላ ባሕር የመሻገር ዐውድ ውስጥ መጠኑን ሳያጋንን ተፈጥሯዊ የሆነው ዘመናዊ አማርኛ ቃል ነው፤ የውሳኔው ቅጥያም ቀደም ሲል የተጠቀሰችውን ጀልባ ያመለክታል።
- source_word: ἤδη
  choice: በዚያን ጊዜ
  rationale: በትረካው በዚህ ደረጃ ሁኔታው ተፈጥሮ እንደነበር በተፈጥሯዊ አማርኛ ያሳያል፤ ‘አስቀድሞ’ ከሚለው ይልቅ በዚህ ዐውድ የተቀላጠፈ ነው።
- source_word: σταδίους πολλοὺς
  choice: ብዙ ስታዲዮን
  rationale: ምንጩ የጥንቱን የርቀት መለኪያ ስለሚጠብቅ፣ በዋናው ጽሑፍ ውስጥ አልተቀየረም፤ ትርጉሙ በማስታወሻ ተብራርቷል።
- source_word: ἀπὸ τῆς γῆς
  choice: ከምድር
  rationale: γῆ በቀጥታ ‘ምድር/መሬት’ ማለት ሲሆን እዚህ ከውኃው በተቃራኒ የብስ ክፍሉን ያመለክታል፤ ‘ከዳርቻ’ የሚለው ዐውዳዊ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ἀπεῖχεν
  choice: ርቃ ነበር
  rationale: የቦታ ርቀትን በተፈጥሯዊና ግልጽ አማርኛ ይገልጣል።
- source_word: βασανιζόμενον
  choice: ትናወጥ ነበር
  rationale: ቃሉ ጽኑ መከራን ወይም መጎሳቆልን ሊገልጥ ይችላል፤ በባሕር ዐውድ ግን ጀልባዪቱ በማዕበል በኃይል መመታቷንና መናወጧን ያመለክታል። ጽኑነቱ በአማራጭ ማስታወሻ ተጠብቋል።
- source_word: ὑπὸ τῶν κυμάτων
  choice: በማዕበሉ
  rationale: κύματα የውኃውን ማዕበል ያመለክታል፤ የአማርኛው ‘በ’ የመናወጡን አድራጊ ወይም መንስኤ ተፈጥሯዊ አድርጎ ይገልጣል።
- source_word: ἐναντίος
  choice: በተቃራኒያቸው ይነፍስ
  rationale: ግሪኩ የተቃውሞውን ተቀባይ በግልጽ አይጠቅስም፤ ዐውዱ ግን ነፋሱ በጀልባይቱ ውስጥ ባሉት ሰዎች የጉዞ አቅጣጫ ላይ ተቃራኒ እንደሆነ ያሳያል። ብዙ ቁጥር ተውላጠ ስም በአማርኛ የተፈጥሮ ንግግርን ይጠብቃል።
- source_word: δὲ
  choice: ግን
  rationale: ከኢየሱስ በምድር ላይ መሆን ወደ ጀልባዪቱ አስቸጋሪ ሁኔታ የሚደረገውን ለስላሳ የትረካ ንጽጽር ያሳያል።
- source_word: γάρ
  choice: ስለነበር
  rationale: የጀልባዪቱን መናወጥ ምክንያት የሚያብራራውን ግንኙነት በተፈጥሯዊ አማርኛ ይገልጣል።
