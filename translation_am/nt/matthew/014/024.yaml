    text: ወይም፣ “ከዳርቻ።” የግሪኩ ጽሑፍ በቀጥታ “ከምድር” ይላል።
    reason: lexical_alternative
  - marker: b
    text: ስታዲዮን የጥንት የርቀት መለኪያ ሲሆን፣ አንድ ስታዲዮን በግምት 185 ሜትር ነው።
    reason: cultural_note
  - marker: c
