    text: “ሰው ወደማይኖርበት ስፍራ” ወይም “ወደ ገለል ያለ ስፍራ” ተብሎም ሊተረጎም ይችላል። የግሪኩ ቃል ከሰው መኖሪያ የራቀን ወይም ሰው የማይኖርበትን ስፍራ ያመለክታል፤ የግድ የአሸዋ በረሃ መሆኑን ግን አያመለክትም።
