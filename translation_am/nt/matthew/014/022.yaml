  text: ወዲያውኑ፣ ሕዝቡን እስኪያሰናብት ድረስ፣ ደቀ መዛሙርቱ በጀልባው እንዲገቡና ከእርሱ ቀድመው ወደ ማዶ እንዲሄዱ አስገደዳቸው።
