  text: καὶ ἠνέχθη ἡ κεφαλὴ αὐτοῦ ἐπὶ πίνακι καὶ ἐδόθη τῷ κορασίῳ, καὶ ἤνεγκεν τῇ μητρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/011.yaml
  text: And his head was brought on a platter and given to the girl[a], and she brought it to her mother.
translation:
  language: am
  text: ራሱም በትሪ[a] ላይ ቀረበ፤ ለልጅቲቱም ተሰጠ፤ እሷም ለእናቷ አመጣችው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ትሪ» ተብሎ የተተረጎመው የግሪክ ቃል πίναξ ምግብ ማቅረቢያ ሰፊ ሳህን ወይም ትሪ ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνέχθη
  choice: ተደርጎ መጣ
  rationale: የφέρω ያለፈ ጊዜ ተደራጊ ቅርጽ ነው። በአማርኛ «ተደርጎ መጣ» ነገሩ በሌሎች ተሸክሞ እንደቀረበ በተፈጥሯዊ አነጋገር ያሳያል።
- source_word: ἡ κεφαλὴ αὐτοῦ
  choice: ራሱ
  rationale: የግሪኩን «የእርሱ ራስ» በቀጥታና ያለ ለስላሳ አገላለጽ ያስተላልፋል፤ በአማርኛ ባለቤትነቱ በቅጥያው ተገልጧል።
- source_word: ἐπὶ πίνακι
  choice: በትሪ ላይ
  rationale: πίναξ ምግብ ለማቅረብ የሚያገለግል ሰፊ ዕቃን ያመለክታል፤ «ትሪ» በዘመናዊ አማርኛ ግልጽና የተለመደ ቃል ነው።
- source_word: ἐδόθη
  choice: ተሰጣት
  rationale: የδίδωμι ያለፈ ጊዜ ተደራጊ ቅርጽን ጠብቆ፣ ራሱ ለልጅቱ እንደተሰጠ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τῷ κορασίῳ
  choice: ለልጅቱ
  rationale: κοράσιον ሴት ልጅን ወይም ወጣት ሴትን ያመለክታል፤ «ልጅቱ» በዐውዱ ግልጽና ዘመናዊ ነው።
- source_word: ἤνεγκεν
  choice: ወሰደችው
  rationale: የφέρω ያለፈ ጊዜ አድራጊ ቅርጽ ነው። መድረሻው «ወደ እናቷ» ተብሎ ስለተገለጠ፣ «ወሰደችው» በአማርኛ ተፈጥሯዊ ሲሆን የነገሩን ማጓጓዝ ያሳያል።
- source_word: τῇ μητρὶ αὐτῆς
  choice: ወደ እናቷ
  rationale: የልጅቱን እናት እንደሚያመለክት በግልጽ ያስተላልፋል፤ «ወደ» ከእንቅስቃሴ ግሱ ጋር ተፈጥሯዊ ነው።
