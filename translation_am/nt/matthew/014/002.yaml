  rationale: ቃሉ ተአምራዊ ኃይልን የሚያመለክት ቢሆንም፣ “ኃይላት” የግሪኩን ስም በቀጥታ በመጠበቅ ኃይሉን ከውጤቱ ማለትም ከተአምራት ጋር አያዋህድም።
