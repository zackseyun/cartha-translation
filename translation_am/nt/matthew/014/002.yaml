- source_word: ἐν αὐτῷ
  choice: በእርሱ
  rationale: “በእርሱ” ἐν የሚያሳየውን የመሥራት ስፍራ ወይም መስክ ሳይወስን ይጠብቃል፤ “በእርሱ አማካይነት” የሚለውን ትርጓሜ በዋናው ጽሑፍ ላይ አያስገባም።
