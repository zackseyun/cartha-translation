base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/002.yaml
  text: And he said to his servants[a], “This is John the Baptist. He has been raised from the dead, and for this reason these powers are at work in him.”
translation:
  language: am
  text: እርሱም ለአገልጋዮቹ፣ “ይህ መጥምቁ ዮሐንስ ነው፤ እርሱ ከሙታን ተነሥቷል፤ ስለዚህም ኃይሎቹ[a] በእርሱ ይሠራሉ” አላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ተአምራዊ ኃይሎች”፤ ይበልጥ በትርጓሜ፣ “ተአምራት።” የግሪኩ ጽሑፍ “ኃይሎች” (αἱ δυνάμεις) ይላል፤ ይህም በኃያላን ሥራዎች የሚገለጥ ከተፈጥሮ በላይ ኃይልን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: παισὶν
  choice: አገልጋዮቹ
  rationale: παῖς እንደ ዐውዱ ልጅ፣ አገልጋይ ወይም አሽከር ሊያመለክት ይችላል። እዚህ ሄሮድስ በቤተ መንግሥቱ ለሚያገለግሉት ሰዎች እየተናገረ ስለሆነ፣ “አገልጋዮቹ” ማኅበራዊ ግንኙነቱን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ὁ βαπτιστής
  choice: መጥምቁ
  rationale: “መጥምቁ ዮሐንስ” በአማርኛ የተለመደውን መጠሪያ በመጠበቅ የሚያጠምቅ ሰው የሚለውን የግሪኩን ትርጉም ያስተላልፋል።
- source_word: ἠγέρθη
