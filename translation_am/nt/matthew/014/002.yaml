- source_word: ἀπὸ τῶν νεκρῶν
  choice: ከሙታን
  rationale: የግሪኩን “ከሙታን መካከል” የሚለውን ሐሳብ በአጭርና በተለመደ አማርኛ ያስተላልፋል።
- source_word: διὰ τοῦτο
  choice: ስለዚህም
  rationale: ሐረጉ ሄሮድስ በዮሐንስ መነሣትና በኃይላቱ መሥራት መካከል ያደረገውን የምክንያት ግንኙነት ያሳያል።
- source_word: αἱ δυνάμεις
  choice: እነዚህ ኃይላት
  rationale: δύναμις በዚህ ዐውድ በታላላቅ ሥራዎች የሚገለጥን ከተፈጥሮ በላይ ኃይል ያመለክታል። “ኃይላት” የሚለው ዋናውን ስም ሳይቀይር ግልጽ ያደርገዋል፤ “እነዚህ” ደግሞ በዐውዱ የተሰሙትን ኃያላን ሥራዎች ያመለክታል።
- source_word: ἐνεργοῦσιν
  choice: ይሠራሉ
