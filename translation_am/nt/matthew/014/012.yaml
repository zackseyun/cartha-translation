  text: καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ἦραν τὸ ⸀πτῶμα καὶ ἔθαψαν ⸀αὐτόν, καὶ ἐλθόντες ἀπήγγειλαν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/012.yaml
  text: And his disciples came[a], took the body, and buried him; then they went and reported it to Jesus.
translation:
  language: am
  text: ደቀ መዛሙርቱም መጥተው አስከሬኑን[a] ወሰዱና ቀበሩት፤ ከዚያም ሄደው ለኢየሱስ አሳወቁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ «የሞተ አካል»። የግሪኩ ቃል የሞተ ሰውን አካል ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: መጥተው
  rationale: በዐውደ ንባቡ ደቀ መዛሙርቱ ወደ ስፍራው መቅረባቸውን የሚገልጽ ተፈጥሯዊ የአማርኛ አተረጓጎም ነው፤ ‘ቀርበው’ም ይቻላል።
- source_word: μαθηταὶ αὐτοῦ
  choice: ደቀ መዛሙርቱ
  rationale: የμαθηταίን የተማሪነትና የተከታይነት ግንኙነት የሚጠብቅ የተለመደ መጽሐፍ ቅዱሳዊ ቃል ነው። ከዐውደ ንባቡ እነዚህ የመጥምቁ ዮሐንስ ደቀ መዛሙርት ናቸው።
- source_word: ἦραν
  choice: ወሰዱ
  rationale: αἴρω በቀጥታ ማንሳት ወይም መውሰድን ያመለክታል፤ በቀብር ዐውድ ‘ወሰዱ’ ተፈጥሯዊና ያልተስፋፋ አተረጓጎም ነው።
- source_word: πτῶμα
  choice: አስከሬኑን
  rationale: ቃሉ የሞተ ሰውን አካል በግልጽ ያመለክታል። ‘አስከሬን’ በዘመናዊ አማርኛ ይህን ትርጉም በትክክል ይገልጻል።
- source_word: ἔθαψαν αὐτόν
  choice: ቀበሩት
  rationale: θάπτω በቀጥታ ‘መቅበር’ ማለት ነው፤ በመቃብር እንዳኖሩት የሚል ያልተጠቀሰ ዝርዝር አልተጨመረም።
- source_word: ἐλθόντες
  choice: ከዚያም ሄደው
  rationale: የቀጣዩን እንቅስቃሴና የድርጊቶቹን ቅደም ተከተል በተፈጥሯዊ የአማርኛ ትረካ ያሳያል።
- source_word: ἀπήγγειλαν
  choice: ነገሩት
  rationale: ቃሉ ማሳወቅን ወይም ዜና መናገርን ያመለክታል። ‘ነገሩት’ በዚህ ትረካ ተፈጥሯዊ ሲሆን የነገሩት ጉዳይ ከዐውደ ንባቡ ይታወቃል።
- source_word: τῷ Ἰησοῦ
  choice: ለኢየሱስ
  rationale: በአማርኛ የተለመደውን የስሙን አጻጻፍ ይከተላል።
theological_decisions:
- issue: ‘ደቀ መዛሙርቱ’ የሚለው ተውላጠ ስም ማንን እንደሚያመለክት
  choice: በአቅራቢያው ዐውደ ንባብ መሠረት የመጥምቁ ዮሐንስ ደቀ መዛሙርት ናቸው፤ ሆኖም ጽሑፉ የግሪኩን ‘ደቀ መዛሙርቱ’ አገላለጽ ጠብቋል።
  alternative: የኢየሱስ ደቀ መዛሙርት
  rationale: ቀዳሚው ዐውደ ንባብ የዮሐንስን ሞትና የአስከሬኑን አያያዝ ስለሚናገር፣ αὐτοῦ በተፈጥሮ ዮሐንስን ያመለክታል። ስሙን በጽሑፉ ውስጥ መጨመር ግን የግሪኩን አሻሚነት ከሚገባው በላይ ይፈታዋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው የትረካ አማርኛ ተመርጧል። ‘ደቀ መዛሙርቱ’ የተለመደውን መጽሐፍ ቅዱሳዊ ቃል ይጠብቃል፤ ‘አስከሬን’ ደግሞ πτῶμα የሚያመለክተውን የሞተ አካል በግልጽ ያሳያል።
