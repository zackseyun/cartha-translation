review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the sequence of actions: John''s disciples came, took up his dead body, buried him, and subsequently went and reported to Jesus. ‘አስከሬን’ faithfully conveys πτῶμα, a dead body/corpse, without importing details about a tomb.'
  naturalness: The narration is generally clear and idiomatic modern Amharic. However, ‘ለኢየሱስ ነገሩት’ is less smooth because the explicit dative phrase is paired with the object suffix -ት. ‘ለኢየሱስ አሳወቁ’ naturally expresses the Greek’s report-to-Jesus construction while leaving the content contextually implicit, as in the source.
  terminology: ‘ደቀ መዛሙርቱ,’ ‘አስከሬን,’ ‘ቀበሩት,’ and ‘ኢየሱስ’ are appropriate established terms and register. The footnote is source-faithful, but adding its lexical alternative makes its stated purpose clearer.
  issues:
  - severity: low
    issue: The final reporting clause is stylistically awkward.
    rationale: ‘ለኢየሱስ ነገሩት’ combines an explicit recipient (‘ለኢየሱስ’) with -ት, and can sound redundant. ‘ለኢየሱስ አሳወቁ’ is more natural and accurately renders ἀπήγγειλαν τῷ Ἰησοῦ.
  - severity: low
    issue: The lexical-alternative footnote does not explicitly state an alternative rendering.
    rationale: Since its reason is lexical_alternative, identifying ‘የሞተ አካል’ as an alternative/explication better aligns the note with its anchor and purpose.
  revised_text: ደቀ መዛሙርቱም መጥተው አስከሬኑን[a] ወሰዱና ቀበሩት፤ ከዚያም ሄደው ለኢየሱስ አሳወቁ።
