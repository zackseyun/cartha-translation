  text: But he said[a], “Bring them here to me.”
translation:
  language: am
  text: እርሱ ግን፣ “ወደ እኔ እዚህ አምጧቸው[a]” አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይህም በቀደመው ቁጥር የተጠቀሱትን እንጀራዎችና ዓሦች ማለት ነው።
    reason: cross_reference
lexical_decisions:
- source_word: δὲ
  choice: ግን
  rationale: δὲ ለስላሳ አያያዥ ሲሆን፣ የደቀ መዛሙርቱን ንግግር ተከትሎ የኢየሱስን ምላሽ በቀላል ንጽጽር ያቀርባል።
- source_word: εἶπεν
  choice: አለ
  rationale: የλέγω ቀላል ያለፈ ጊዜ ቅርጽ በተፈጥሯዊ አማርኛ “አለ” ተብሎ ይተረጎማል፤ በግሱ ውስጥ የሌለ ተጨማሪ የማዘዝ ፍቺ አይጨምርም።
- source_word: Φέρετέ
  choice: አምጧቸው
  rationale: የφέρω ሁለተኛ መደብ ብዙ ቁጥር ትእዛዛዊ ቅርጽ ነው፤ “አምጧቸው” የተጠቀሱትን ነገሮች እንዲያመጡ የሚሰጠውን ትእዛዝ ተፈጥሯዊ በሆነ አማርኛ ያሳያል።
- source_word: μοι
  choice: ወደ እኔ
  rationale: የአንደኛ መደብ ነጠላ ቁጥር ተውላጠ ስም ድርጊቱ ወደ ተናጋሪው መቅረቡን ያመለክታል፤ “ወደ እኔ” ይህን አቅጣጫ ግልጽ ያደርጋል።
- source_word: ὧδε
  choice: እዚህ
  rationale: ὧδε ቦታን የሚያመለክት “እዚህ” ማለት ነው፤ በግሪኩ ያለውን የቦታ አጽንዖት ይጠብቃል።
- source_word: αὐτούς
  choice: -አቸው
  rationale: የወንድ ጾታ ብዙ ቁጥር ተውላጠ ስም በዐውዱ ቀደም ሲል የተጠቀሱትን እንጀራዎችና ዓሦች በጋራ ያመለክታል፤ የአማርኛው “-አቸው” ቅጥያ ይህን በተፈጥሯዊነት ያስተላልፋል።
