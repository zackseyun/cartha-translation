id: MAT.14.29
reference: Matthew 14:29
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ἐλθέ. καὶ καταβὰς ἀπὸ τοῦ ⸀πλοίου Πέτρος περιεπάτησεν ἐπὶ τὰ ὕδατα ⸂καὶ ἦλθεν⸃ πρὸς τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/029.yaml
  text: And he said[a], “Come.” So Peter got down from the boat, walked on the water, and came toward Jesus.
translation:
  language: am
  text: እርሱም፣ “ና” አለ። ጴጥሮስም ከጀልባው ወርዶ በውኃው ላይ ተራመደ፤ ወደ ኢየሱስም ሄደ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ኢየሱስ ዘንድም ደረሰ።” የግሪኩ አገላለጽ ወደ ኢየሱስ አቅጣጫ መንቀሳቀሱን ያጎላል።
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐλθέ
  choice: ና
  rationale: የἔρχομαι ቀጥተኛ ትእዛዝ ነው። “ና” በዘመናዊ አማርኛ አጭርና ተፈጥሯዊ ሲሆን ተጨማሪ ቃል ሳያስገባ የጥሪውን ኃይል ያስተላልፋል።
- source_word: καταβὰς ἀπὸ τοῦ πλοίου
  choice: ከጀልባው ወርዶ
  rationale: የግሪክ አሳታፊ ግስ ከቀጣዮቹ ድርጊቶች በፊት መውረዱን ያሳያል፤ “ከጀልባው ወርዶ” ይህን ቅደም ተከተል በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: πλοίου
  choice: ጀልባ
  rationale: በገሊላ ባሕር የትረካ አውድ “ጀልባ” ከ“መርከብ” ይልቅ ተገቢና ለዘመናዊ አንባቢ ግልጽ ነው።
- source_word: περιεπάτησεν
  choice: ተራመደ
  rationale: περιπατέω እዚህ በቀጥታ መራመድን ያመለክታል። “ተራመደ” መጀመርን ወይም ወዲያ ወዲህ መንቀሳቀስን ሳይጨምር ትርጉሙን ይጠብቃል።
- source_word: ἐπὶ τὰ ὕδατα
  choice: በውኃው ላይ
  rationale: ἐπί ከተከሳሽ ቅርጽ ጋር እዚህ በውኃው ገጽ ላይ የሚደረግ እንቅስቃሴን ያሳያል፤ ነጠላው “ውኃ” በአማርኛ ተፈጥሯዊ ነው።
- source_word: καὶ ἦλθεν πρὸς τὸν Ἰησοῦν
  choice: ወደ ኢየሱስም ሄደ
  rationale: πρός ወደ ኢየሱስ አቅጣጫ የተደረገውን እንቅስቃሴ ያመለክታል። “ወደ ኢየሱስም ሄደ” መድረሱን በግድ ሳያረጋግጥ አቅጣጫውን ይጠብቃል።
- source_word: δὲ
  choice: -ም
  rationale: δὲ እዚህ ቀላል የትረካ አያያዥ ነው፤ በ“እርሱም” ያለው “-ም” ፍሰቱን ያቆያል እንጂ ጠንካራ ተቃርኖ አያስገባም።
theological_decisions:
- issue: ጴጥሮስ ወደ ኢየሱስ ያደረገው እንቅስቃሴ
  choice: ወደ ኢየሱስም ሄደ
  alternative: ኢየሱስ ዘንድም ደረሰ
  rationale: πρός በዋናነት አቅጣጫን ያሳያል፤ ሐረጉ ጴጥሮስ በእርግጥ መድረሱን ከሚገልጸው ይልቅ ወደ ኢየሱስ መንቀሳቀሱን ያጎላል። ይህ አተረጓጎም የትረካውን ውጥረት አይፈታም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። “ጀልባ” ከ“መርከብ” ይልቅ ለአውዱ ተመርጧል፤ የአማርኛ የግስ ቅደም ተከተልና “-ም” አያያዥ ለተፈጥሯዊ የትረካ ፍሰት ተጠቅመዋል።
