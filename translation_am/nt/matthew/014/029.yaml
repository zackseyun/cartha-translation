review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the summons, Peter's descent from the boat, walking on the water, and his movement toward Jesus. However, “አለው” adds an indirect-object sense (“he said to him”) not expressed in the Greek; the direct quotation itself does not require it.
  naturalness: The verse is otherwise clear, fluent modern standard Amharic. “አለ” is the natural unmarked reporting verb here and avoids the added pronoun.
  terminology: “ጀልባ,” “በውኃው ላይ ተራመደ,” and “ወደ ኢየሱስም ሄደ” are appropriate. The final wording preserves the directional force of πρός without asserting arrival.
  issues:
  - severity: medium
    issue: “አለው” introduces an unexpressed recipient.
    rationale: The suffix -ው normally means “to him.” SBLGNT has only ὁ δὲ εἶπεν followed by direct speech, without an indirect object. Replace it with “አለ.”
  revised_text: እርሱም፣ “ና” አለ። ጴጥሮስም ከጀልባው ወርዶ በውኃው ላይ ተራመደ፤ ወደ ኢየሱስም ሄደ።[a]
