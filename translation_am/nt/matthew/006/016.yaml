id: MAT.6.16
reference: Matthew 6:16
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ὅταν δὲ νηστεύητε, μὴ γίνεσθε ⸀ὡς οἱ ὑποκριταὶ σκυθρωποί, ἀφανίζουσιν γὰρ τὰ πρόσωπα αὐτῶν ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/016.yaml
  text: And whenever you fast[a], do not become gloomy like the hypocrites, for they disfigure their faces so that they may appear to people to be fasting. Truly I say to you, they have received their reward in full.
translation:
  language: am
  text: እናንተም በጾማችሁ ጊዜ፣ እንደ ግብዞች ፊታችሁን አታጨልሙ፤ እነርሱ ለሰዎች እየጾሙ እንደሆኑ እንዲታዩ ፊታቸውን ያበላሻሉና። እውነት እላችኋለሁ፣ ዋጋቸውን ሙሉ በሙሉ ተቀብለዋል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅταν δὲ νηστεύητε
  choice: እናንተም በጾማችሁ ጊዜ
  rationale: ὅταν ከንዑስ አንቀጹ ጋር ተደጋጋሚ ወይም አጠቃላይ ጊዜን ያመለክታል፤ በአማርኛ «በጾማችሁ ጊዜ» ይህን በተፈጥሯዊ ሁኔታ ያስተላልፋል። δέ የቀደሙትን ትምህርቶች ስለሚያያይዝ «-ም» ተጠቅሟል።
- source_word: μὴ γίνεσθε ... σκυθρωποί
  choice: ፊታችሁን አታጨፍግጉ
  rationale: σκυθρωπός የጨለመ፣ የተከዘ የፊት ገጽታን ያመለክታል። «ፊትን ማጨፍገግ» ይህን ሆን ብሎ የሚያሳይ ገጽታ በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ὡς οἱ ὑποκριταὶ
  choice: እንደ ግብዞች
  rationale: ὑποκριτής በዚህ አውድ ሃይማኖተኛ መስሎ የሚታይን ግብዝ ሰው ያመለክታል፤ «ግብዞች» የተለመደና ግልጽ አቻ ነው።
- source_word: ἀφανίζουσιν ... τὰ πρόσωπα αὐτῶν
  choice: ፊታቸውን ያበላሻሉ
  rationale: ἀφανίζω መልክን ማበላሸት፣ ማደብዘዝ ወይም የተጎሳቆለ እንዲመስል ማድረግን ሊገልጥ ይችላል። «ያበላሻሉ» የግስን ሆን ተብሎ የሚደረግ ድርጊት ሳያጠብ ያቀርባል።
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες
  choice: እየጾሙ መሆናቸው ለሰዎች እንዲታይ
  rationale: ὅπως ዓላማን፣ φανῶσιν ደግሞ መታየትን ያመለክታል። ἄνθρωποι እዚህ ሰዎችን በአጠቃላይ ስለሚያመለክት «ለሰዎች» ተብሏል።
- source_word: ἀμὴν λέγω ὑμῖν
  choice: እውነት እላችኋለሁ
  rationale: የኢየሱስን ክብደት ያለው የማረጋገጫ አገላለጽ በግልጽና በተለመደ የአማርኛ ቅርጽ ያስተላልፋል።
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: ዋጋቸውን ሙሉ በሙሉ ተቀብለዋል
  rationale: ἀπέχω በንግድ አገላለጽ ሙሉ ክፍያን ተቀብሎ መጨረስን ያመለክታል። «ሙሉ በሙሉ» የቀረ ጥያቄ እንደሌለ የሚያሳየውን ፍቺ ይጠብቃል። μισθός በዚህ አውድ «ዋጋ» ተብሏል።
theological_decisions:
- issue: τοῖς ἀνθρώποις የሚያመለክተው የሰዎች ወሰን
  choice: ለሰዎች
  alternative: ለወንዶች
  rationale: ἄνθρωποι ሰዎችን በአጠቃላይ የሚያመለክት እንጂ በዚህ አውድ ወንዶችን ብቻ አይወስንም። «ሰዎች» የምንጩን አጠቃላይ ኃይል በተፈጥሯዊ አማርኛ ይጠብቃል።
- issue: ἀπέχουσιν የሚያመለክተው የሙሉ መቀበል ፍቺ
  choice: ዋጋቸውን ሙሉ በሙሉ ተቀብለዋል
  alternative: ዋጋቸው አላቸው
  rationale: ግሱ በዚህ አገባብ ዋጋው ሙሉ በሙሉ እንደተከፈለ ያሳያል፤ ይህም የሰው እውቅና የፈለጉትን ዋጋ እንዳገኙ የሚገልጠውን የንባቡን ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የፊት ገጽታን የሚገልጡት ሁለት ሐረጎች በአማርኛ ተፈጥሯዊ እንዲሆኑ ተለያይተው ቀርበዋል፤ የግሪኩ ዓላማ፣ የማስመሰል ባሕርይና የሙሉ ዋጋ መቀበል ፍቺ ተጠብቀዋል።
