id: MAT.6.29
reference: Matthew 6:29
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι οὐδὲ Σολομὼν ἐν πάσῃ τῇ δόξῃ αὐτοῦ περιεβάλετο ὡς ἓν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/029.yaml
  text: But I tell you that not even Solomon in all his glory was clothed like one of these[a].
translation:
  language: am
  text: እኔ ግን እላችኋለሁ፤ ሰሎሞን እንኳ በክብሩ ሁሉ ከእነዚህ አንዱ ያህል አልለበሰም።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በግርማው ሁሉ።”
    reason: δόξα በዚህ አውድ ክብርን ወይም የንጉሥነት ግርማን ሊያመለክት ይችላል።
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: እኔ ግን እላችኋለሁ
  rationale: λέγω ከὑμῖν ጋር ‘እላችኋለሁ’ ተብሎ በተፈጥሮ ይተረጎማል፤ δέ ደግሞ ከቀደመው ሐሳብ ጋር ያለውን ቀላል ንጽጽር ‘ግን’ በማለት ያሳያል።
- source_word: οὐδὲ
  choice: እንኳ … አል…ም
  rationale: የοὐδέን አጽንዖት በተፈጥሯዊ የአማርኛ አሉታዊ አገባብ ያስተላልፋል።
- source_word: Σολομὼν
  choice: ሰሎሞን
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደው የስሙ ቅርጽ ነው።
- source_word: ἐν πάσῃ τῇ δόξῃ αὐτοῦ
  choice: በክብሩ ሁሉ
  rationale: δόξα እዚህ የንጉሥነትን ድምቀትና ግርማ ያመለክታል፤ ‘ክብር’ የምንጩን ቃል ሰፊ የትርጉም ክልል ይጠብቃል።
- source_word: περιεβάλετο
  choice: አልለበሰም
  rationale: በዚህ አውድ περιβάλλω ልብስ መልበስን ወይም መጎናጸፍን ያመለክታል፤ ንጉሡን ከአበቦቹ ገጽታ ጋር የሚያነጻጽረውን ምስል ይጠብቃል።
- source_word: ὡς ἓν τούτων
  choice: ከእነዚህ ከአንዱ ጋር እኩል
  rationale: ἓν ያለውን ነጠላ ንጽጽር በግልጽ አማርኛ ያስተላልፋል፤ ‘እነዚህ’ በአቅራቢያው አውድ ወደተጠቀሱት አበቦች ይመለሳል።
theological_decisions:
- issue: ለሰሎሞን የተጠቀሰው የδόξα ትርጉም
  choice: ክብር
  alternative: ግርማ ወይም ድምቀት
  rationale: አውዱ የሰሎሞንን ምድራዊ የንጉሥነት ግርማ ከአበቦቹ ውበት ጋር ያነጻጽራል፤ ‘ክብር’ የመለኮታዊ ክብር ልዩ ትርጉምን ሳያስገድድ የግሪኩን ቃል ያንጸባርቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ንጽጽርና የ‘አንዱ’ ነጠላነት ተጠብቀዋል።
