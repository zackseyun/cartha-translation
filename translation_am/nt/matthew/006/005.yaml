- source_word: ὅταν προσεύχησθε
  choice: በምትጸልዩበትም ጊዜ
  rationale: ያልተወሰነና ተደጋጋሚ ጊዜን የሚያመለክተውን ‘በምትጸልዩበት ጊዜ ሁሉ’ የሚል ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: οὐκ ἔσεσθε ὡς οἱ ὑποκριταί
  choice: እንደ ግብዞች አትሁኑ
  rationale: የወደፊት ጊዜ አመልካች ግሱ እዚህ የክልከላ ትእዛዝ ኃይል ስላለው በዘመናዊ አማርኛ ቀጥተኛ መመሪያ ሆኖ ተተርጉሟል።
- source_word: ὑποκριταί
  choice: ግብዞች
  rationale: ለሰው ታይታ ሃይማኖተኛ መስለው የሚቀርቡ አስመሳዮችን በተለመደና ትክክለኛ ቃል ይገልጣል።
- source_word: ἐν ταῖς συναγωγαῖς
  choice: በምኩራቦች
  rationale: የአይሁድን ታሪካዊ የስብሰባና የአምልኮ ቦታ ልዩነት የሚጠብቀው የተለመደ አማርኛ ቃል ነው።
- source_word: ἐν ταῖς γωνίαις τῶν πλατειῶν
  choice: በሰፋፊ መንገዶች ማዕዘኖች
  rationale: የግሪክኛውን ‘ሰፊ መንገድ/የሕዝብ መተላለፊያ’ ሐሳብ በቅርብ ይጠብቃል፤ ይበልጥ ፈሊጣዊ የሆነው ‘በመንገድ ማዕዘኖች’ በማስታወሻ ቀርቧል።
- source_word: ἑστῶτες προσεύχεσθαι
  choice: ቆመው መጸለይ
  rationale: የድርጊቶቹን ቅደም ተከተልና የቆመው አኳኋን ከጸሎቱ ጋር ያለውን ግንኙነት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις
  choice: ይህንም የሚያደርጉት በሰዎች ለመታየት ነው
  rationale: የዓላማ አንቀጹን በግልጽ አማርኛ ያቀርባል፤ ‘ሰዎች’ የሚለውም በአውዱ ወንድና ሴትን በአጠቃላይ የሚያመለክተውን ἀνθρώποις ያንጸባርቃል።
- source_word: ἀμὴν λέγω ὑμῖν
  choice: እውነት እላችኋለሁ
  rationale: የኢየሱስን ክብደት ያለው የማረጋገጫ አባባል በተለመደ፣ ክቡርና ግልጽ አማርኛ ያቀርባል።
- source_word: ἀπέχουσι τὸν μισθὸν αὐτῶν
  choice: ዋጋቸውን ተቀብለዋል
  rationale: μισθός የሚያመለክተውን ዋጋ/ሽልማት እና ἀπέχουσι በክፍያ አገባብ ያለውን ‘ተቀብለዋል’ ሐሳብ ይጠብቃል፤ ‘ሙሉ በሙሉ’ የሚለው ትርጉም በዋናው ጽሑፍ ሳይጨመር በማስታወሻ ቀርቧል።
theological_decisions:
- issue: τοῖς ἀνθρώποις የሚለውን አጠቃላይ ሰዋዊ ማጣቀሻ መተርጎም
  choice: በሰዎች
  alternative: በወንዶች / በሰው ፊት
  rationale: በዚህ አውድ ቃሉ የሰው ታዛቢዎችን በአጠቃላይ እንጂ ወንዶችን ብቻ አያመለክትም፤ ስለዚህ ‘ሰዎች’ የምንጩን ዓላማ በትክክል ያስተላልፋል።
- issue: ἀπέχουσι የሚለው ግስ ለዋጋው የሚሰጠው ኃይል
  choice: ዋጋቸውን ተቀብለዋል
  alternative: ዋጋቸውን ሙሉ በሙሉ ተቀብለዋል / ዋጋቸው አላቸው
  rationale: ዋናው ጽሑፍ የግሱን የክፍያ መቀበል ሐሳብ ይጠብቃል፤ በአገባቡ ሊኖር የሚችለው ‘ሙሉ ክፍያ’ ትርጉም ግን የትርጓሜ መጠኑን ሳያልፍ በማስታወሻ ተገልጧል።
