  text: ὅπου γάρ ἐστιν ὁ θησαυρός ⸀σου, ἐκεῖ ἔσται καὶ ἡ καρδία ⸁σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/021.yaml
  text: For where your treasure is[a], there your heart will be also.
translation:
  language: am
  text: ሀብትህ ባለበት ልብህም በዚያ ይሆናልና።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ሀብትህ ባለበት ልብህም በዚያ ነውና።» አንዳንድ ትርጉሞች አባባሉን ዘወትራዊ እውነት አድርገው በአሁን ጊዜ ይተረጉሙታል፤ የግሪኩ ግስ ግን የወደፊት ጊዜ ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπου
  choice: ባለበት
  rationale: የቦታ አንጻራዊ ሐረጉን በተፈጥሯዊ አማርኛ ይገልጣል፤ ከἐκεῖ ጋርም «ባለበት ... በዚያ» የሚለውን ትይዩነት ይጠብቃል።
- source_word: γάρ
  choice: -ና
  rationale: ከቀደመው ትምህርት ጋር ያለውን የምክንያትና የማብራሪያ ግንኙነት በተፈጥሯዊ የአማርኛ አገባብ ያሳያል።
- source_word: ὁ θησαυρός σου
  choice: ሀብትህ
  rationale: θֶησαυρός የሚያመለክተውን የተከማቸ ውድ ነገር እና በዐውዱ ያለውን ዘይቤያዊ ኃይል ሳያጠብ በዘመናዊና ተረዳሽ አማርኛ ይገልጣል።
- source_word: ἐκεῖ
  choice: በዚያ
  rationale: ከὅπου ጋር ያለውን «ባለበት ... በዚያ» የቦታ ትይዩነት በአጭርና ግልጽ ሁኔታ ይጠብቃል።
- source_word: ἔσται
  choice: ይሆናል
  rationale: የግሪኩን የወደፊት ጊዜ ግስ በግልጽ ሁኔታ ይጠብቃል፤ ንግግሩን ወደ ዘወትራዊ የአሁን ጊዜ መግለጫ አያለሰልስም።
- source_word: ἡ καρδία σου
  choice: ልብህ
  rationale: καρδία የሚይዘውን የፍላጎት፣ የታማኝነትና የውስጣዊ አቅጣጫ ሰፊ ትርጉም «ልብ» በተለመደና ተፈጥሯዊ ሁኔታ ይጠብቃል።
- source_word: καὶ
  choice: -ም
  rationale: ልብን ከሀብት ጋር የሚያያይዘውን ጭማሪ አጽንዖት በተፈጥሯዊ የአማርኛ ቅጥያ ያሳያል።
theological_decisions:
- issue: በጥበባዊ አባባሉ ውስጥ የἔσται ጊዜያዊ ኃይል
  choice: የወደፊት ጊዜውን «ይሆናል» ብሎ መጠበቅ
  alternative: ዘወትራዊ እውነትን ለመግለጽ «ነው» የሚለውን የአሁን ጊዜ መጠቀም
  rationale: የግሪኩ ግስ የወደፊት ጊዜ ቅርጽ አለው። ይህን መጠበቅ አባባሉ ሀብትና ልብ ብቻ አብረው እንዳሉ ሳይሆን ልብ ሀብት ወዳለበት እንደሚያመራም እንዲያሳይ ያደርጋል፤ ይሁንና ጽሑፉ ከሚለው በላይ የተወሰነ ዶክትሪናዊ ማብራሪያ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ባለበት ... በዚያ» የሚለው ቅርጽ የግሪኩን የቦታ ትይዩነት ሲጠብቅ፣ «ይሆናል» የወደፊት ጊዜውን ግልጽ አድርጎ ያቆያል።
