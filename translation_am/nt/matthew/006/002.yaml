id: MAT.6.2
reference: Matthew 6:2
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ὅταν οὖν ποιῇς ἐλεημοσύνην, μὴ σαλπίσῃς ἔμπροσθέν σου, ὥσπερ οἱ ὑποκριταὶ ποιοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς ῥύμαις, ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων· ἀμὴν λέγω ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/002.yaml
  text: Therefore[a], whenever you give alms, do not sound a trumpet before you, as the hypocrites do in the synagogues and in the streets, so that they may be glorified by people. Truly I say to you[e][d][c][b], they have received their reward in full.
translation:
  language: am
  text: 'ማቴዎስ 6፥2


    ስለዚህ ምጽዋት ስትሰጥ[a]፣ ግብዞች በምኵራቦችና በጎዳናዎች በሰዎች ዘንድ እንዲከበሩ እንደሚያደርጉት፣ በፊትህ መለከት አትንፋ[b]። እውነት እላችኋለሁ፣ ዋጋቸውን ሙሉ በሙሉ ተቀብለዋል[c]።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ለችግረኞች ስትሰጥ» ወይም «የምሕረት ተግባር ስታደርግ»። የግሪኩ አገላለጽ ለድሆች የሚደረግን የበጎ አድራጎት ስጦታ ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ «በፊትህ መለከት አትንፋ»። ይህ ማጋነን ወይም ምሳሌያዊ አነጋገር ሊሆን ይችላል፤ የግሪኩ ጽሑፍ ግን መለከትን በግልጽ ይጠቅሳል።
    reason: lexical_alternative
  - marker: c
    text: «ዋጋቸውን ሙሉ በሙሉ ተቀብለዋል» የሚለው የንግድ አገላለጽ ነው፤ የሚያገኙትን ዋጋ ሁሉ አስቀድመው እንደተቀበሉ ያመለክታል።
    reason: cultural_note
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: ስለዚህ … ስትሰጥ
  rationale: οὖν ከቀደመው ትምህርት ጋር ያለውን የሐሳብ ትስስር «ስለዚህ» በማለት ያሳያል፤ ὅταν ከተያያዘው ንዑስ አንቀጽ ጋር አጠቃላይና ተደጋጋሚ ሁኔታን በተፈጥሯዊው «ስትሰጥ» አገላለጽ ይወክላል።
- source_word: ποιῇς ἐλεημοσύνην
  choice: ምጽዋት ስትሰጥ
  rationale: የግሪኩ አገላለጽ ለችግረኞች የሚደረግን የርኅራኄ ስጦታ ያመለክታል። «ምጽዋት መስጠት» በአማርኛ የታወቀ፣ አጭርና ትክክለኛ አቻ ነው።
- source_word: μὴ σαλπίσῃς ἔμπροσθέν σου
  choice: በፊትህ መለከት አትንፋ
  rationale: የምንጩን ግልጽና ሕያው ምስል ሳይፈታ ይጠብቃል፤ «በፊትህ» ደግሞ ἔμπροσθέν σουን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: οἱ ὑποκριταὶ
  choice: ግብዞች
  rationale: ሃይማኖታዊ ተግባራቸውን ለትዕይንት የሚያደርጉ አስመሳዮችን የሚያመለክት መደበኛና በቀላሉ የሚገባ ቃል ነው።
- source_word: ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς ῥύμαις
  choice: በምኵራቦችና በጎዳናዎች
  rationale: «ምኵራብ» የአይሁድን መሰብሰቢያ በትክክል ይጠቅሳል፤ «ጎዳናዎች» ደግሞ ለሕዝብ የተጋለጡትን መንገዶች በተፈጥሯዊ ቋንቋ ያሳያል።
- source_word: ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων
  choice: በሰዎች ዘንድ እንዲከበሩ
  rationale: የዓላማውን አንቀጽና የδοξάζωን ጠንካራ የክብር ትርጉም ይጠብቃል። ἄνθρωποι እዚህ ሁሉንም ሰው በአጠቃላይ ስለሚያመለክት «ሰዎች» ተብሏል።
- source_word: ἀμὴν λέγω ὑμῖν
  choice: እውነት እላችኋለሁ
  rationale: የኢየሱስን የተረጋገጠና ሥልጣናዊ መግለጫ በክቡርና በተለመደ አማርኛ ያቀርባል።
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: ዋጋቸውን ሙሉ በሙሉ ተቀብለዋል
  rationale: ἀπέχω በንግድ አገላለጽ ‘ሙሉ ክፍያን ተቀብሎ መጨረስ’ የሚል ኃይል አለው። «ዋጋ» የμισθόςን የክፍያና የሽልማት ገጽታ ይይዛል።
theological_decisions:
- issue: δοξασθῶσιν የሚለውን የክብር ቃል ጥንካሬ
  choice: በሰዎች ዘንድ እንዲከበሩ
  alternative: በሰዎች እንዲወደሱ
  rationale: «እንዲከበሩ» የግሪኩን ጠንካራ የክብር ሐሳብ ይጠብቃል፤ ዐውዱም ይህ ከሰው የሚገኝ ሕዝባዊ ክብር መሆኑን ግልጽ ያደርጋል።
- issue: ἀνθρώπων ጾታን ያልለየ አጠቃላይ አመልካች መሆኑ
  choice: ሰዎች
  alternative: ወንዶች
  rationale: በዚህ ዐውድ ቃሉ ወንዶችን ብቻ ሳይሆን ሰብዓዊ ተመልካቾችን በአጠቃላይ ያመለክታል።
- issue: ἀπέχουσιν የሚያመለክተው የሽልማት ፍጹምነት
  choice: ዋጋቸውን ሙሉ በሙሉ ተቀብለዋል
  alternative: ዋጋቸው አላቸው
  rationale: ምንጩ የሚጠቀመው የንግድ ፈሊጥ ከዚህ በኋላ ሌላ የሚጠበቅ ዋጋ እንደሌለ ያሳያል፤ ትርጉሙ ይህን ኃይል በግልጽ ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። «ምጽዋት» እና «ምኵራብ» በመጽሐፍ ቅዱሳዊ ንግግር የታወቁ ቃላት ሲሆኑ፣ የመጀመሪያው ቃል ትርጉም በግርጌ ማስታወሻ ተብራርቷል።
