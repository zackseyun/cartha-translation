base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/028.yaml
  text: 'And why are you anxious about clothing? Consider the lilies of the field[a], how they grow: they do not labor[c][b], nor do they spin.'
translation:
  language: am
  text: ስለ ልብስስ ለምን ትጨነቃላችሁ? የሜዳ ሊሊዎች[a] እንዴት እንደሚያድጉ በጥሞና ተመልከቱ፤ አይለፉም፣ አይፈትሉምም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የሜዳ አበቦች።” የግሪኩ ቃል በቀጥታ “ሊሊዎች” የሚል ቢሆንም፣ በዐውዱ የሜዳ አበቦችን በሰፊው ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ ἐνδύματος
  choice: ስለ ልብስ
  rationale: ἔνδυμα በዚህ ዐውድ አንድን የተወሰነ ልብስ ሳይሆን ልብስን እንደ አጠቃላይ ፍላጎት ያመለክታል።
- source_word: τί μεριμνᾶτε
  choice: ለምን ትጨነቃላችሁ?
  rationale: μεριμνάω እዚህ ተራ ማሰብን ሳይሆን በውስጥ መጨነቅን ያመለክታል፤ τί ደግሞ በአማርኛ በተፈጥሮ ‘ለምን’ ተብሎ ይገለጻል።
- source_word: καταμάθετε
  choice: በጥሞና ተመልከቱ
  rationale: ቃሉ ከቀላል ማየት በላይ በትኩረት ተመልክቶ መረዳትን የሚጋብዝ ትእዛዝ ነው።
- source_word: τὰ κρίνα τοῦ ἀγροῦ
  choice: የሜዳ አበቦች
  rationale: κρίνα በጥብቅ አገላለጽ ‘ሊሊዎች’ ሊሆን ቢችልም፣ በዐውዱ በሜዳ የሚበቅሉ አበቦችን በሰፊው ሊያመለክት ይችላል፤ በዘመናዊ አማርኛ ‘የሜዳ አበቦች’ ግልጽና ተፈጥሯዊ ነው። የተወሰነው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: πῶς αὐξάνουσιν
  choice: እንዴት እንደሚያድጉ
  rationale: αὐξάνω እዚህ የተፈጥሮ እድገትን ያመለክታል።
- source_word: οὐ κοπιῶσιν
  choice: አይደክሙም
  rationale: κοπιάω ከባድ ሥራ በመሥራት መድከምን ወይም መጣርን ያመለክታል፤ ‘አይደክሙም’ አጭርና ከሚቀጥለው ግስ ጋር ትይዩነቱን ይጠብቃል።
- source_word: οὐδὲ νήθουσιν
  choice: አይፈትሉምም
  rationale: νήθω ክር መፍተልን ያመለክታል፤ አማርኛው ግስ ድርጊቱን በቀጥታና በአጭሩ ይገልጻል።
theological_decisions:
