  choice: የሜዳ አበቦች
  alternative: የሜዳ ሊሊዎች
  rationale: የግሪኩ ቃል ‘ሊሊዎች’ የሚለውን ቀጥተኛ ትርጉም ይደግፋል፣ ነገር ግን በዐውዱ ሰፋ ያለ የዱር ወይም የሜዳ አበቦች ስብስብ ሊሆን ይችላል። ግልጽ የሆነው ሰፊ አገላለጽ በዋናው ጽሑፍ፣ ጠባቡ ትርጉም በማስታወሻ ተቀምጧል።
