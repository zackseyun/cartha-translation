  rationale: ዐውዱ ተራ ጥንቃቄን ወይም ኃላፊነት ያለበትን ማሰብ አይከለክልም፤ ስለ ቁሳዊ ፍላጎት ያለን ውስጣዊ ጭንቀት ይመለከታል።
