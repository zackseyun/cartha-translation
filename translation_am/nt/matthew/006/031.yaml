id: MAT.6.31
reference: Matthew 6:31
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: μὴ οὖν μεριμνήσητε λέγοντες· Τί φάγωμεν; ἤ· Τί πίωμεν; ἤ· Τί περιβαλώμεθα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/031.yaml
  text: Therefore do not worry[a], saying, ‘What will we eat?’ or ‘What will we drink?’ or ‘What will we wear?’
translation:
  language: am
  text: ስለዚህ፣ “ምን እንበላለን?” ወይም “ምን እንጠጣለን?” ወይም “ምን እንለብሳለን?” እያላችሁ አትጨነቁ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አትታወኩ።”
    reason: μεριμνάω በዚህ አውድ ስለ ቁሳዊ ፍላጎቶች ያለን የጭንቀት ስጋት ያመለክታል፤ «አትታወኩ» ተፈጥሯዊ የቃላት አማራጭ ነው።
lexical_decisions:
- source_word: μὴ οὖν μεριμνήσητε
  choice: ስለዚህ … አትጨነቁ
  rationale: οὖν ከቀደመው ሐሳብ የሚወጣውን ድምዳሜ በ«ስለዚህ» ያሳያል፤ μεριμνάω በዚህ አውድ ስለ ምግብ፣ መጠጥና ልብስ በጭንቀት መያዝን ያመለክታል። «አትጨነቁ» ክልከላውን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: λέγοντες
  choice: እያላችሁ
  rationale: ተያያዥ የሆነውን የአነጋገር ሁኔታ በተፈጥሯዊ አማርኛ ይገልጣል፤ ጭንቀቱ በእነዚህ ጥያቄዎች እንደሚገለጥ ያሳያል።
- source_word: Τί φάγωμεν;
  choice: ምን እንበላለን?
  rationale: የግሪኩን የምክክር/የወደፊት ጥያቄ በዘመናዊ አማርኛ ተፈጥሯዊ በሆነ መንገድ ያቀርባል።
- source_word: Τί πίωμεν;
  choice: ምን እንጠጣለን?
  rationale: ከφάγωμεν ጋር ያለውን ትይዩነትና ስለ ወደፊት አቅርቦት ያለውን ጥያቄ ይጠብቃል።
- source_word: Τί περιβαλώμεθα;
  choice: ምን እንለብሳለን?
  rationale: περιβάλλω በዚህ ስፍራ ልብስ መልበስን ያመለክታል፤ «ምን እንለብሳለን?» ትርጉሙን ግልጽና ተፈጥሯዊ አድርጎ ያቀርባል።
- source_word: ἤ ... ἤ ... ἤ
  choice: ወይም … ወይም …
  rationale: በሦስቱ ቀጥተኛ ጥያቄዎች መካከል ያለውን ተደጋጋሚ አማራጭ ይጠብቃል።
theological_decisions:
- issue: ስለ ቁሳዊ ፍላጎቶች የኢየሱስ ክልከላ ምንነት
  choice: μεριμνήσητεን በጭንቀት እንዳይያዙ የተሰጠ ክልከላ አድርጎ «አትጨነቁ» ብሎ መተርጎም
  alternative: «ፈጽሞ አታስቡ» ወይም ኃላፊነት ያለበትን እቅድ ሁሉ እንደሚከለክል መተርጎም
  rationale: ቅርብ አውዱ የሚናገረው ስለ አቅርቦት በጭንቀት መያዝን እንጂ በጥንቃቄ ማቀድን አይደለም። ትርጉሙ ከጽሑፉ በላይ የሚሄድ ፍጹማዊ ክልከላ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። ቀጥተኛዎቹ ጥያቄዎች በተፈጥሯዊ የአማርኛ አገባብ ተደርድረዋል፤ ዋናው ክልከላ በመጨረሻ መቀመጡ የ«እያላችሁ … አትጨነቁ»ን ተፈጥሯዊ አወቃቀር ይጠብቃል።
