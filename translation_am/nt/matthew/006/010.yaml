  rationale: የግሪክ ጽሑፍ ሥርዓተ ነጥብ በዘመናዊ አርታኢዎች የተወሰነ ስለሆነ የሐረጉ ወሰን ፍጹም የተዘጋ አይደለም። በአቅራቢያው ካለው ሁለተኛ ልመና ጋር ማያያዝ ሰዋስዋዊና ተፈጥሯዊ ሲሆን፣ ሁለቱንም ልመናዎች የሚያካትተው ንባብ በማስታወሻ ተጠብቋል።
