lexical_decisions:
- source_word: ἐλθέτω
  choice: ትምጣ
  rationale: የሦስተኛ መደብ ነጠላ የትእዛዝ/ምኞት ቅርጽ ሲሆን፣ በጸሎት ውስጥ ወደ እግዚአብሔር የሚቀርብን ልመና በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: βασιλεία
  choice: መንግሥት
  rationale: ቃሉ ንግሥናን፣ አገዛዝን ወይም መንግሥትን ሊያመለክት ይችላል፤ «መንግሥት» በማቴዎስ ዐውድና በዚህ የጸሎት አነጋገር የተለመደና የንጉሣዊ አገዛዝንም ሐሳብ ሊሸከም የሚችል ነው።
- source_word: γενηθήτω
  choice: ይፈጸም
  rationale: ከθέλημα ጋር ሲገናኝ ፈቃድ በተግባር እንዲሆን ወይም እውን እንዲሆን የሚገልጽ ሲሆን፣ «ይፈጸም» ይህን ትርጉም በተፈጥሯዊና ክቡር አማርኛ ያስተላልፋል።
- source_word: θέλημα
  choice: ፈቃድ
  rationale: አንድ ሰው የሚወደውን፣ የሚሻውን ወይም ያቀደውን ያመለክታል፤ «ፈቃድ» ሐሳቡን ሳያጠብ የሚያቀርብ የተለመደ አቻ ነው።
- source_word: ὡς
  choice: እንደሚፈጸመው
  rationale: ὡς ንጽጽርን ያስገባል። በአማርኛ ሙሉና ተፈጥሯዊ ንጽጽር ለመፍጠር ከአውዱ የተገኘው ግስ ተደግሟል፤ አዲስ ይዘት አይጨምርም።
- source_word: ἐν οὐρανῷ
  choice: በሰማይ
  rationale: ἐν ከዳቲቭ ጋር የቦታ ሐሳብን ይገልጻል፤ «በሰማይ» በአማርኛ ተፈጥሯዊና ከዐውዱ ጋር የሚስማማ ነው።
- source_word: ἐπὶ γῆς
  choice: በምድር
  rationale: ἐπί ከጄኒቲቭ ጋር «በ/ላይ» የሚል የቦታ ትርጉም አለው፤ «በምድር» ከ«በሰማይ» ጋር ያለውን ተቃርኖ በተለመደ አማርኛ ያሳያል።
- source_word: καὶ
  choice: እንዲሁ
  rationale: ቃሉ በቀጥታ «እና/ደግሞ» ማለት ቢችልም፣ ὡς ... καὶ ... በሚለው የንጽጽር አወቃቀር «እንደ... እንዲሁ...» ብሎ ማቅረብ ተፈጥሯዊ ነው።
theological_decisions:
- issue: የὡς ἐν οὐρανῷ καὶ ἐπὶ γῆς ንጽጽራዊ ሐረግ ወሰን
  choice: በዋናው ጽሑፍ ሐረጉ በአቅራቢያው ካለው «ፈቃድህ ... ይፈጸም» ልመና ጋር ተያይዟል።
