  yaml_path: translation/nt/matthew/006/010.yaml
  text: May your kingdom come; may your will be done[a], as in heaven, so also on earth.
translation:
  language: am
  text: መንግሥትህ ትምጣ፤ ፈቃድህም በሰማይ እንደሚፈጸመው እንዲሁ በምድር ይፈጸም።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በሰማይ እንደሚፈጸሙ እንዲሁ በምድርም» የሚለው የንጽጽር ሐረግ «መንግሥትህ ትምጣ» እና «ፈቃድህ ይፈጸም» የሚሉትን ሁለቱንም ልመናዎች እንደሚመለከት ሊገባ ይችላል።
