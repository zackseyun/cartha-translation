- source_word: καταφρονήσει
  choice: ይንቃል
  rationale: ሰውን እንደ ከንቱ የማየትና የመናቅን ጠንካራ ሐሳብ በአጭርና በተፈጥሯዊ ቃል ይገልጣል።
