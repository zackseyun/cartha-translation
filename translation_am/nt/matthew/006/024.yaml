- source_word: δουλεύειν
  choice: ማገልገል
  rationale: ግሱ እንደ ባሪያ የመገዛትና የማገልገል ሐሳብ አለው፤ ከ‘ጌቶች’ ጋር ሲነበብ ‘ማገልገል’ በአማርኛ ተፈጥሯዊ ሆኖ የግንኙነቱን ክብደት ይጠብቃል።
- source_word: μισήσει / ἀγαπήσει
  choice: ይጠላል / ይወዳል
