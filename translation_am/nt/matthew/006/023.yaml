  text: ἐὰν δὲ ὁ ὀφθαλμός σου πονηρὸς ᾖ, ὅλον τὸ σῶμά σου σκοτεινὸν ἔσται. εἰ οὖν τὸ φῶς τὸ ἐν σοὶ σκότος ἐστίν, τὸ σκότος πόσον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/023.yaml
  text: But if your eye is bad[a], your whole body will be dark. If then the light in you is darkness, how great is the darkness!
translation:
  language: am
  text: ነገር ግን ዓይንህ መጥፎ[a] ከሆነ፣ መላ ሰውነትህ ጨለማ ይሆናል። እንግዲህ በውስጥህ ያለው ብርሃን ጨለማ ከሆነ፣ ጨለማው ምንኛ ታላቅ ነው!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ክፉ» ወይም «ጤናማ ያልሆነ»፤ የ«ዓይን»ን ፈሊጣዊ አጠቃቀምና ዐውደ ንባቡን ስንመለከት፣ «ስስታማ» ወይም «ለጋስ» የሚል ፍቺም ሊኖረው ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηρὸς
  choice: መጥፎ
  rationale: “መጥፎ” የግሪኩን ሰፊ የትርጉም ክልል ይጠብቃል፤ ክፉነትን፣ ጤናማ አለመሆንን ወይም በዐውደ ንባቡ ያለጋስነትን ሊያመለክት የሚችለውን የ‘ዓይን’ ፈሊጥ በአንድ ትርጉም አይወስንም።
- source_word: σκοτεινὸν
  choice: ጨለማ
  rationale: የግሪኩን ቀጥተኛ ገላጭ ኃይል በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: φῶς
  choice: ብርሃን
  rationale: መንፈሳዊ ወይም ሥነ ምግባራዊ ግንዛቤን ሊያመለክት ቢችልም፣ የብርሃን ዘይቤው በቀጥታ ተጠብቋል።
- source_word: σκότος
  choice: ጨለማ
  rationale: ከ‘ብርሃን’ ጋር ያለውን ንጽጽርና በመጨረሻው ሐረግ ያለውን አጽንዖት ይጠብቃል።
- source_word: πόσον
  choice: ምንኛ ታላቅ
  rationale: አጭሩን የግሪክ የአጋኖ ሐረግ በተፈጥሯዊና ኃይለኛ አማርኛ ይገልጻል።
- source_word: ὀφθαλμός
  choice: ዓይን
  rationale: ለእይታ፣ ለዝንባሌና ለሥነ ምግባራዊ አቅጣጫ የሚያገለግለው የአካል ዘይቤ በቀጥታ ተጠብቋል።
- source_word: ὅλον τὸ σῶμά σου
  choice: መላ ሰውነትህ
  rationale: ὅλον የሚሰጠውን የሙሉነት አጽንዖት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τὸ φῶς τὸ ἐν σοὶ
  choice: በውስጥህ ያለው ብርሃን
  rationale: የግሪኩን አወቃቀርና ዘይቤ ይጠብቃል፤ ‘ውስጣዊ ብርሃንህ’ ብሎ ከሚገባው በላይ አይተረጉምም።
theological_decisions:
