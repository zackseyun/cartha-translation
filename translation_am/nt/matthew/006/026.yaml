  text: ἐμβλέψατε εἰς τὰ πετεινὰ τοῦ οὐρανοῦ ὅτι οὐ σπείρουσιν οὐδὲ θερίζουσιν οὐδὲ συνάγουσιν εἰς ἀποθήκας, καὶ ὁ πατὴρ ὑμῶν ὁ οὐράνιος τρέφει αὐτά· οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/026.yaml
  text: Look at the birds of the sky[a], that they do not sow or reap or gather into barns, and your heavenly Father feeds them[b]. Are you not of much more value than they are?
translation:
  language: am
  text: የሰማይን ወፎች[a] ተመልከቱ፤ እነርሱ አይዘሩም፣ አያጭዱም፣ ወደ ጎተራዎችም አያከማቹም፤ በሰማይ ያለው አባታችሁ ግን ይመግባቸዋል። እናንተ ከእነርሱ እጅግ የምትበልጡ አይደላችሁምን?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የአየር ወፎች»፤ ወይም፣ «የሰማይ ወፎች»።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «እናንተ ከእነርሱ እጅግ የበለጠ ዋጋ ያላችሁ አይደላችሁምን?»
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβλέψατε
  choice: ተመልከቱ
  rationale: የታዘዘ ቀጥተኛ ትኩረትን ያሳያል፤ በዘመናዊ አማርኛም ተፈጥሯዊና ግልጽ ነው።
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: የሰማይን ወፎች
  rationale: πετεινάን በተለመደው «ወፎች»፣ οὐρανοῦንም በዚህ የሚታየውን ሰማይ በሚያመለክተው «የሰማይ» ይተረጉማል።
- source_word: σπείρουσιν ... θερίζουσιν ... συνάγουσιν
  choice: አይዘሩም፣ አያጭዱም፣ ... አያከማቹም
  rationale: የግሪኩን ሦስት ተከታታይ የእርሻ ድርጊቶችና ትይዩ አወቃቀር ይጠብቃል።
- source_word: εἰς ἀποθήκας
  choice: ወደ ጎተራ
  rationale: የእህል ወይም የእርሻ ምርት ማከማቻን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: የሰማዩ አባታችሁ
  rationale: የአባትነት ግንኙነቱንና οὐράνιος የሚያመለክተውን ሰማያዊ መገኛ በአጭርና በተለመደ አገላለጽ ያቆያል።
- source_word: τρέφει
  choice: ይመግባቸዋል
  rationale: በአውዱ የምግብ አቅርቦትን በቀጥታ ይገልጻል።
- source_word: οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
  choice: እናንተ ከእነርሱ እጅግ የበለጠ ዋጋ የላችሁምን?
  rationale: አዎንታዊ መልስ የሚጠብቀውን የክርክር ጥያቄ፣ μᾶλλον የሚሰጠውን አጽንዖትና διαφέρω በዚህ አውድ ያለውን የዋጋ ብልጫ ያስተላልፋል።
theological_decisions:
- issue: በኢየሱስ ክርክር ውስጥ የሰዎችና የወፎች አንጻራዊ ዋጋ
  choice: ጥቅሱ አድማጮቹ ከወፎች እጅግ የበለጠ ዋጋ እንዳላቸው ያረጋግጣል፤ ለዚህ ዋጋ የሥነ መለኮት ምክንያት ግን አይጨምርም።
  alternative: ብልጫውን በእግዚአብሔር መልክ መፈጠር ወይም በቃል ኪዳን ግንኙነት ብቻ ላይ በግልጽ ማመሥረት።
  rationale: ግሪኩ የዋጋ ብልጫውን ይገልጻል፣ መሠረቱን ግን በዚህ ጥቅስ አይጠቅስም፤ ስለዚህ ትርጉሙ ያልተገለጸ የእምነት ማብራሪያ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። የእርሻ ምስሉና የግሪኩ የክርክር ጥያቄ ተጠብቀዋል፤ ὅτι በአማርኛ የዓረፍተ ነገር ፍሰት በሥርዓተ ነጥብ ተወክሏል።
