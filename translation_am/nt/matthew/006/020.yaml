  text: θησαυρίζετε δὲ ὑμῖν θησαυροὺς ἐν οὐρανῷ, ὅπου οὔτε σὴς οὔτε βρῶσις ἀφανίζει, καὶ ὅπου κλέπται οὐ διορύσσουσιν οὐδὲ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/020.yaml
  text: But store up for yourselves treasures in heaven[a], where neither moth nor decay destroys[b], and where thieves do not break in and steal.
translation:
  language: am
  text: ነገር ግን ለራሳችሁ በሰማይ ሀብቶችን አከማቹ፤ በዚያ ብልም ሆነ መበስበስ[a] አያጠፋቸውም፣ ሌቦችም ሰርስረው[b] አይገቡም፣ አይሰርቁምም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ዝገት።” የግሪኩ ቃል ነገርን ቀስ በቀስ የሚበላ መበላሸትን ወይም መሸርሸርን በሰፊው ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “ቆፍረው አያልፉም።” ይህ ምናልባት ሌቦች በቤት ግድግዳ ውስጥ ቆፍረው ወይም ሰርስረው መግባታቸውን ያመለክታል።
    reason: cultural_note
