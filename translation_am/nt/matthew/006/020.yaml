  choice: መበስበስ
  alternative: ዝገት
  rationale: ‘መበስበስ’ የሚበሉና የሚጠፉ ምድራዊ ንብረቶችን ሰፊ ንጽጽር ይጠብቃል፤ ‘ዝገት’ ግን ሐሳቡን በብረት መበላሸት ብቻ ሊወስነው ይችላል።
