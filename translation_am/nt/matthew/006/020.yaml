- source_word: ὑμῖν
  choice: ለራሳችሁ
  rationale: የጥቅም ተቀባይነትንና በዚህ አገባብ ያለውን አንጸባራቂ ኃይል ይጠብቃል።
- source_word: θησαυροὺς
  choice: ሀብቶችን
  rationale: የግሪኩን ብዙ ቁጥርና የከበረ ነገር ምሳሌያዊ ሐሳብ ይጠብቃል።
- source_word: ἐν οὐρανῷ
