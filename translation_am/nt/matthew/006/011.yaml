lexical_decisions:
- source_word: τὸν ἄρτον ἡμῶν
  choice: የዕለት እንጀራችንን
  rationale: ἄρτος በቀጥታ ‘እንጀራ/ዳቦ’ ማለት ነው፤ በአማርኛ የጌታ ጸሎት ውስጥ ‘እንጀራ’ ተፈጥሯዊና የተለመደ ሲሆን የምግብና የዕለት ጉርስ ምስሉን ይጠብቃል። ἡμῶν በ‘-ችን’ ተገልጿል።
- source_word: τὸν ἐπιούσιον
  choice: የዕለት
  rationale: ἐπιούσιος እጅግ አልፎ አልፎ የሚገኝና ትክክለኛ ትርጉሙ አከራካሪ የሆነ ቃል ነው። ‘የዕለት’ የዕለት ተዕለት አቅርቦትን በግልጽና በተለመደ አማርኛ ያሳያል፤ ሌሎቹ ዋና አማራጮች በማስታወሻ ተጠብቀዋል።
- source_word: δὸς ἡμῖν
  choice: ስጠን
  rationale: δὸς ቀጥተኛ ትእዛዛዊ ግስ ‘ስጥ’ ነው፤ ἡμῖν የሚለው ተቀባይ ‘-ን’ በሚለው ቅጥያ በተፈጥሯዊ አማርኛ ተካቷል።
- source_word: σήμερον
  choice: ዛሬ
  rationale: σήμερον በቀጥታ ‘ዛሬ’ ማለት ስለሆነ የጊዜ አመልካቹ በዘመናዊና ግልጽ አማርኛ ተጠብቋል።
