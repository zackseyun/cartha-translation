  text: εἰ δὲ τὸν χόρτον τοῦ ἀγροῦ σήμερον ὄντα καὶ αὔριον εἰς κλίβανον βαλλόμενον ὁ θεὸς οὕτως ἀμφιέννυσιν, οὐ πολλῷ μᾶλλον ὑμᾶς, ὀλιγόπιστοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/030.yaml
  text: But if God so clothes the grass of the field[a], which is here today and tomorrow is thrown into an oven, will he not much more clothe you[b], you of little faith?
translation:
  language: am
  text: እግዚአብሔር ዛሬ ያለውንና ነገ ወደ ምድጃ[b] የሚጣለውን የሜዳ ሣር[a] እንዲህ የሚያለብሰው ከሆነ፣ እናንተ እምነት ጥቂቶች፣ እናንተን ይበልጥ አያለብሳችሁምን?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «የሜዳ ሣር» የሚለው አገላለጽ ሣርን ብቻ ሳይሆን በሜዳ የሚበቅሉ አጭር ዕድሜ ያላቸውን እፅዋትም ሊያካትት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: «ምድጃ» የሚለው የመጋገሪያ ምድጃን ያመለክታል፤ የደረቀ ሣርና የሜዳ ተክሎች እንደ ማገዶ ሊጠቀሙባቸው ይችሉ ነበር።
    reason: cultural_note
lexical_decisions:
