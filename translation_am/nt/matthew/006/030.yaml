  alternative: ጥያቄውን ወደ ቀጥተኛ የዜና አረፍተ ነገር መለወጥ።
  rationale: የግሪኩ አወቃቀርና የመጨረሻው ቀጥተኛ አድራሻ አጽንዖታዊ ጥያቄን ይደግፋሉ፤ ይህም ተጨማሪ የእምነት ሥርዓት ሳይጫን በቂ አለመታመንን የሚገሥጸውን ኃይል ይጠብቃል።
