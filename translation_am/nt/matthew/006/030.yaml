  choice: የሜዳ ሣር
  rationale: χόρτος ሣርን ወይም የሜዳ ተክልን ሊያመለክት ይችላል፤ በዚህ አውድ አጭር ዕድሜ ያለውን የዱር እፅዋት በተፈጥሯዊ አማርኛ ለማመልከት «የሜዳ ሣር» ተመርጧል።
- source_word: σήμερον ὄντα
  choice: ዛሬ ያለውን
  rationale: የግሪኩን የአሁን መኖር ቀጥተኛ ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: αὔριον εἰς κλίβανον βαλλόμενον
  choice: ነገ ወደ ምድጃ የሚጣለውን
  rationale: κλίβανος የመጋገሪያ ምድጃን ያመለክታል፤ βαλλόμενον ያለው ተደራጊ ቅርጽም «የሚጣለውን» ተብሎ ተጠብቋል።
- source_word: οὕτως ἀμφιέννυσιν
  choice: እንዲህ የሚያለብሰው
  rationale: ἀμφιέννυμι በመሠረቱ «ማልበስ» ማለት ነው፤ የክርክሩን ምስል ሳያስፋፋ በግልጽ ያቀርባል።
- source_word: οὐ πολλῷ μᾶλλον
  choice: እንዴት አብልጦ አያለብሳችሁ?
  rationale: ከታናሹ ወደ ታላቁ የሚሄደውን ክርክርና የአጽንዖት የአዎንታ መልስ የሚጠብቀውን ጥያቄ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ὀλιγόπιστοι
  choice: እናንተ እምነታችሁ የጎደለ ሰዎች
  rationale: የብዙ ቁጥር ቀጥተኛ አድራሻና ለበቀ ተግሣጽ ተጠብቋል፤ «እምነት የሌላችሁ» ከማለት በመቆጠብ ጥቂትነትን ወይም ጉድለትን ያሳያል።
- source_word: εἰ δὲ
  choice: … ከሆነ
  rationale: በአማርኛ የሁኔታ ንዑስ አረፍተ ነገር መጨረሻ የሚመጣው «ከሆነ» የ εἰን ኃይል በተፈጥሯዊ አወቃቀር ይይዛል፤ δέ የሚያሳየው ለስላሳ ሽግግር በአውዱና በአረፍተ ነገሩ አወቃቀር ተገልጧል።
theological_decisions:
- issue: ከታናሹ ወደ ታላቁ የሚሄድ የመለኮታዊ እንክብካቤ ክርክር
