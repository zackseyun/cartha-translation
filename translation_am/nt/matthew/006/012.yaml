  yaml_path: translation/nt/matthew/006/012.yaml
  text: And forgive us our debts[b][a], as we also have forgiven our debtors.
translation:
  language: am
  text: ዕዳዎቻችንንም[a] ይቅር በለን፤ እኛም ለእኛ ዕዳ ያለባቸውን ይቅር እንዳልንላቸው[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “በደሎቻችንን”። ግሪኩ በቀጥታ “ዕዳዎቻችንን” ይላል፤ እዚህ የዕዳ ምሳሌው ኃጢአትን ወይም በደልን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም “ይቅር እንደምንላቸው”። ግሪኩ የተፈጸመ ድርጊትን የሚያሳይ አኦሪስት ይጠቀማል፤ ስለዚህ “ይቅር እንዳልንላቸው” የሚለው ቀደም ሲል የተደረገ ይቅርታን ያሳያል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφες
  choice: ይቅር በለን
  rationale: በጸሎት አውድ ውስጥ ያለውን የይቅርታ ጥያቄ በተፈጥሯዊና በተለመደ አማርኛ ይገልጣል።
- source_word: τὰ ὀφειλήματα ἡμῶν
  choice: ዕዳችንን
  rationale: የግሪኩን ‘የሚገባን/የምንከፍለው ዕዳ’ የሚለውን ምሳሌያዊ አነጋገር ጠብቆ ያቆያል፤ በአውዱ ግን ኃጢአትን ወይም በደልን ያመለክታል።
- source_word: ὡς
  choice: እንዳልን
  rationale: መለኮታዊ ይቅርታን ከሰዎች ይቅርታ ጋር የሚያነጻጽረውን ኃይል በአማርኛው የ‘እንደ’ አወቃቀር ይይዛል።
- source_word: καὶ ἡμεῖς
  choice: እኛም
  rationale: ሁለተኛውን καὶ እና በግልጽ የተጠቀሰውን ἡμεῖς በማስቀመጥ ‘እኛም’ የሚለውን አጽንዖት ይጠብቃል።
- source_word: ἀφήκαμεν
  choice: ይቅር እንዳልን
  rationale: የግሪኩን አኦሪስት እንደ ተፈጸመ ድርጊት ያቀርባል፤ አማርኛው በዚህ አውድ ያለፈ ድርጊትን ተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: τοῖς ὀφειλέταις ἡμῶν
  choice: ዕዳ ያለባቸውን
  rationale: ከ‘ዕዳችን’ ጋር ያለውን የቃል ግንኙነት እየጠበቀ፣ በዘመናዊ አማርኛ ‘ባለዕዳዎቻችን’ ከሚለው ይበልጥ ግልጽና ተፈጥሯዊ ነው።
theological_decisions:
- issue: የὀφειλήματα የሞራል ዕዳ ምሳሌ
  choice: በዋናው ጽሑፍ ‘ዕዳ’ የሚለውን ምሳሌ ማቆየት
  alternative: ‘በደል’ ወይም ‘ኃጢአት’ ብሎ በቀጥታ መተርጎም
  rationale: ምንጩ የዕዳን ቃል በሁለቱም የንጽጽሩ ክፍሎች ይጠቀማል። ምሳሌውን ማቆየት ለግሪኩ ታማኝ ሲሆን የሞራል ትርጉሙን በማስታወሻ ማብራራት የገንዘብ ዕዳ ብቻ እንዳይመስል ይረዳል።
- issue: የἀφήκαμεν ጊዜያዊ ልዩነት
  choice: ‘ይቅር እንዳልን’ ብሎ እንደ ተፈጸመ ድርጊት ማቅረብ
  alternative: ‘ይቅር እንደምንል’ ብሎ እንደ ልማድ ወይም ቀጣይ ድርጊት ማቅረብ
  rationale: SBLGNT ἀφήκαμεν የሚለውን አኦሪስት ንባብ ይዟል፤ ስለዚህ ትርጉሙ ይቅርታውን እንደ ተፈጸመ ድርጊት ያቀርባል፣ ይህንም ወደ ቀጣይ ልማድ አይለውጠውም።
