  yaml_path: translation/nt/matthew/006/022.yaml
  text: The eye is the lamp of the body. Therefore[a], if your eye is healthy, your whole body will be full of light.
translation:
  language: am
  text: የሰውነት መብራት ዓይን ነው። ስለዚህ ዓይንህ ጤናማ[a] ከሆነ፣ ሰውነትህ ሁሉ ብርሃን የተሞላ ይሆናል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም «ነጠላ»፣ «ጥርት ያለ» ወይም «ጤናማ»፤ የግሪኩ ቃል ያልተከፋፈለ መሆንን፣ በአንዳንድ አውዶችም ለጋስነትን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  choice: መብራት
  rationale: ቃሉ በተለምዶ የሚያበራ መሣሪያን ያመለክታል፤ «መብራት» ዓይንን የሰውነት ማብሪያ አድርጎ የሚያቀርበውን ተጨባጭ ምሳሌ ይጠብቃል።
- source_word: σῶμα
  choice: ሰውነት
  rationale: የአካላዊውን ምስል በተፈጥሯዊ አማርኛ የሚያስተላልፍ መደበኛ ትርጉም ነው።
- source_word: ὀφθαλμός
  choice: ዓይን
  rationale: ለአካላዊው ምስልም ሆነ ለሞራላዊው ፍንጭ ቀጥተኛና ተፈጥሯዊ ትርጉም ነው።
- source_word: ἐὰν οὖν
  choice: ስለዚህ … ከሆነ
  rationale: οὖν ከቀደመው ንግግር የሚመጣውን ድምዳሜ ሲያመለክት፣ ἐὰν የሁኔታ አንቀጹን ያስገባል፤ ይህ አቀራረብ ሁለቱንም በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἁπλοῦς
  choice: ጤናማ
  rationale: በዓይንና በሰውነት መብራት ምሳሌ ውስጥ በትክክል የሚሠራን ዓይን በግልጽ ያስተላልፋል። የቃሉ ሌሎች ሊሆኑ የሚችሉ ፍቺዎች በማስታወሻ ተጠብቀዋል።
- source_word: ὅλον
  choice: ሁሉ
  rationale: የሰውነቱን ሙሉነት በተፈጥሯዊ የአማርኛ አገላለጽ ይገልጣል።
- source_word: φωτεινὸν
  choice: ብርሃን የተሞላ
  rationale: ቀጥተኛው «ብሩህ» የሚለው ትርጉም የሚያመለክተውን የመብራት ምስል ግልጽና ተፈጥሯዊ በሆነ አማርኛ ያቀርባል።
- source_word: ἔσται
  choice: ይሆናል
  rationale: በግሪኩ ያለውን የወደፊት ጊዜ በግልጽ ይጠብቃል።
theological_decisions:
- issue: በዓይን ምሳሌ ውስጥ የἁπλοῦς ትርጉም
  choice: በዋናው ጽሑፍ «ጤናማ» ተብሎ ተተርጉሟል።
  alternative: «አንድ ዓላማ ያለው/ያልተከፋፈለ»፣ «ጥርት ያለ»፣ «ትክክለኛ» ወይም በአንዳንድ አውዶች «ለጋስ»።
  rationale: ቅርብ አውዱ ዓይንን የሰውነት መብራት አድርጎ ያቀርባል፣ ቀጣዩም ቁጥር ከመጥፎ ዓይን ጋር ያነጻጽራል። ስለዚህ የዓይንን ትክክለኛ አሠራር የሚገልጽ «ጤናማ» ምሳሌውን በዘመናዊ አማርኛ በግልጽ ይጠብቃል፤ ሆኖም የግሪኩ ቃል ሊይዛቸው የሚችላቸው ሌሎች ፍቺዎች እንዳይጠፉ በማስታወሻ ቀርበዋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ጥቅም ላይ ውሏል። «የሰውነት መብራት ዓይን ነው» የሚለው አወቃቀር የግሪኩን አጽንኦት ሳይጭን ይጠብቃል፤ የምሳሌውን የትርጉም ግልጽነት ለመጨመር «ብርሃን የተሞላ» ተመርጧል።
