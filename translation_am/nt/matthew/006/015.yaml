  text: ἐὰν δὲ μὴ ἀφῆτε τοῖς ⸀ἀνθρώποις, οὐδὲ ὁ πατὴρ ὑμῶν ἀφήσει τὰ παραπτώματα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/015.yaml
  text: But if you do not forgive people[a], neither will your Father forgive your trespasses.
translation:
  language: am
  text: ነገር ግን ለሰዎች ይቅር ባትሉ፣ አባታችሁም በደሎቻችሁን[a] ይቅር አይልም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «በደሎቻችሁን» የሚለው «መተላለፎቻችሁን» ወይም «ጥፋቶቻችሁን» ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ μὴ
  choice: ነገር ግን ... ባትሉ
  rationale: ἐὰν ከμή ጋር አሉታዊ ሁኔታን ይገልጣል፤ δέ ደግሞ ከቀደመው ቁጥር ጋር ያለውን ንጽጽር «ነገር ግን» በማለት ያሳያል።
- source_word: ἀφῆτε
  choice: ይቅር ባትሉ
  rationale: ἀφίημι በዚህ አውድ ለሌሎች የፈጸሙትን በደል ይቅር ማለትን ያመለክታል፤ ይህም ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
- source_word: τοῖς ἀνθρώποις
  choice: ለሰዎች
  rationale: ἄνθρωποι ወንዶችን ብቻ ሳይሆን ሰዎችን በአጠቃላይ ያመለክታል። የግሪኩ ንባብ የይቅርታውን ተቀባዮች በግልጽ ስለሚጠቅስ «ለሰዎች» ተብሏል።
- source_word: οὐδὲ
  choice: '...ም ... አይልም'
  rationale: በአማርኛ የ«neither» አሉታዊ ትይዩነት በ«ም» እና በአሉታዊው ግስ በተፈጥሯዊ ሁኔታ ተገልጧል።
- source_word: ὁ πατὴρ ὑμῶν
  choice: አባታችሁ
  rationale: ምንጩ «አባታችሁ» ብቻ ይላል፤ «የሰማዩ» የሚለውን በዚህ ቁጥር ላይ አይጨምርም።
- source_word: ἀφήσει
  choice: ይቅር አይልም
  rationale: ከመጀመሪያው ἀφίημι ጋር ያለው የቃል ድግግሞሽ «ይቅር ማለት» በሚለው ተመሳሳይ አገላለጽ ተጠብቋል።
- source_word: τὰ παραπτώματα ὑμῶν
  choice: በደላችሁን
  rationale: παραπτώματα ጥፋትን፣ በደልን ወይም መተላለፍን ያመለክታል። «በደል» በዘመናዊ አማርኛ ግልጽ፣ ክብደቱንም የሚጠብቅ ምርጫ ነው።
theological_decisions:
- issue: በሰው ይቅርታና በእግዚአብሔር ይቅርታ መካከል ያለው ሁኔታዊ ግንኙነት
  choice: የምንጩ ቀጥተኛ ሁኔታዊ አነጋገር ሳይለዘብ ተጠብቋል።
  alternative: ይህን እንደ ማስረጃ ብቻ መተርጎም፣ ወይም የሚጠፋው ይቅርታ ሳይሆን ኅብረት ብቻ ነው ብሎ ማብራራት።
  rationale: ግሪኩ ቀጥተኛ ሁኔታና ውጤት ያቀርባል። ትርጉሙ ሰፊውን ሥነ መለኮታዊ ውይይት በማብራሪያ ሳይወስን የጽሑፉን ውጥረት እንዳለ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ለሰዎች ይቅር ማለት» የግሪኩን ተቀባይ በግልጽ ሲጠብቅ በአማርኛም ተፈጥሯዊ ነው።
