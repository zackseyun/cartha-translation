- from: ይህም እየጾምህ መሆንህ ለሰዎች እንዳይታይ፣ በስውር[a] ላለው አባትህ ግን እንዲታይ ነው፤ በስውር የሚያይ አባትህም ይከፍልሃል።
  to: እየጾምህ መሆንህ ለሰዎች እንዳይታይ፣ በስውር[a] ላለው ለአባትህ ግን እንዲታይ ዘንድ ነው፤ በስውር የሚያይ አባትህም ዋጋውን ይሰጥሃል።
