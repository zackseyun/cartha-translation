review_pass:
  verdict: revise
  source_fidelity: The draft accurately reflects the purpose clause, the generic human observers, the contrast with the Father, the repeated hidden/secret sphere, and the future divine recompense. However, the opening construction «ይህም … ነው» is more explanatory than a direct Amharic purpose clause, and the second occurrence of «እንዲታይ» benefits from explicitly retaining the dative sense as appearance before the Father.
  naturalness: Most wording is clear modern standard Amharic. Recasting the first clause with «… ዘንድ» gives a more natural, directly purposive sentence and avoids the somewhat stiff framing «ይህም … ነው».
  terminology: «ሰዎች» correctly conveys the generic force of ἀνθρώποις. «በስውር» is a sound, consistent rendering of ἐν τῷ κρυφαίῳ and preserves its ambiguity. «ይከፍልሃል» is possible, but «ዋጋውን ይሰጥሃል» more naturally expresses positive recompense in this context without implying commercial payment.
  issues:
  - severity: medium
    issue: The purpose construction is not fully idiomatic/direct.
    rationale: «ይህም … ነው» recasts ὅπως as an explanatory assertion. «… ዘንድ» directly expresses the Greek purpose, “so that.”
  - severity: low
    issue: The contrast needs slightly clearer dative phrasing in Amharic.
    rationale: Adding «ለአባትህ» after the descriptive phrase makes clear that the fasting is to appear before the Father, not that the Father himself is being made visible.
  - severity: low
    issue: The recompense verb can be made more contextually natural.
    rationale: «ይከፍልሃል» can suggest payment; «ዋጋውን ይሰጥሃል» naturally communicates reward/recompense in a devotional context.
  revised_text: እየጾምህ መሆንህ ለሰዎች እንዳይታይ፣ በስውር[a] ላለው ለአባትህ ግን እንዲታይ ዘንድ ነው፤ በስውር የሚያይ አባትህም ዋጋውን ይሰጥሃል።
