language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὅπως μὴ φανῇς τοῖς ἀνθρώποις νηστεύων ἀλλὰ τῷ πατρί σου τῷ ἐν τῷ ⸀κρυφαίῳ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸁κρυφαίῳ ἀποδώσει σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/018.yaml
  text: so that you may not appear to men to be fasting[a], but to your Father who is in secret[b]; and your Father who sees in secret will reward you.
translation:
  language: am
  text: እየጾምህ መሆንህ ለሰዎች እንዳይታይ፣ በስውር[a] ላለው ለአባትህ ግን እንዲታይ ዘንድ ነው፤ በስውር የሚያይ አባትህም ዋጋውን ይሰጥሃል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በስውር ስፍራ»።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: ይህም … እንዳይታይ … እንዲታይ ነው
  rationale: የዓላማ አገናኝነቱን ከቀደመው ቁጥር ጋር ያስቀጥላል፤ በአማርኛም የተፈጥሮ ፍሰት ይኖረዋል።
- source_word: μὴ φανῇς τοῖς ἀνθρώποις νηστεύων
  choice: እየጾምህ መሆንህ ለሰዎች እንዳይታይ
  rationale: የጾሙን ቀጣይ ድርጊትና በሰዎች ፊት መታየትን በግልጽና ተፈጥሯዊ አማርኛ ያስተላልፋል። ሰዎች የሚለው ἄνθρωποι እዚህ ያለውን አጠቃላይ የሰው ታዛቢዎች ትርጉም ይጠብቃል።
- source_word: ἀλλὰ τῷ πατρί σου
  choice: በስውር ላለው አባትህ ግን እንዲታይ
  rationale: ἀλλά የሚያሳየውን ተቃርኖ በ«ግን» ያቀርባል፤ በግሪክ የተተወውን «መታየት» በአማርኛ ለግልጽነት ይደግማል።
- source_word: ἐν τῷ κρυφαίῳ
  choice: በስውር
  rationale: ሁለቱንም የሐረጉ ክስተቶች በተመሳሳይ ቃል በመተርጎም የጽሑፉን ድግግሞሽና የስውር አምልኮን ጭብጥ ይጠብቃል።
- source_word: ὁ βλέπων ἐν τῷ κρυφαίῳ
  choice: በስውር የሚያይ
  rationale: «የተደረገውን» የሚል በምንጩ የሌለ ተሳቢ ሳይጨምር አጭሩንና ክፍት አገላለጽ ይጠብቃል።
- source_word: ἀποδώσει σοι
  choice: ይከፍልሃል
  rationale: በዚህ አውድ ያለውን የምላሽ ወይም የብድራት ሐሳብ በተለመደ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: የτοῖς ἀνθρώποις አጠቃላይ ወሰን
  choice: ለሰዎች
  alternative: ለሰው ታዛቢዎች
  rationale: በዚህ አውድ ቃሉ ወንዶችን ብቻ ሳይሆን ሰዎችን በአጠቃላይ ያመለክታል፤ «ሰዎች» ይህን ያለ ተጨማሪ ማብራሪያ በትክክል ያሳያል።
- issue: የἐν τῷ κρυφαίῳ ትርጉም
  choice: በስውር
  alternative: በስውር ስፍራ
  rationale: ሐረጉ ስውርነትን ወይም ስውር ስፍራን ሊጠቁም ይችላል። «በስውር» የቦታ ትርጉሙን ሳይክድ የምንጩን ክፍትነት ይጠብቃል።
- issue: በἀλλὰ τῷ πατρί σου ውስጥ የተተወው ግስ
  choice: «እንዲታይ» በግልጽ ተደግሟል
  alternative: «በስውር ላለው አባትህ ግን» ብሎ መተው
  rationale: የግሪኩ ተቃርኖ «ለሰዎች ሳይሆን ለአባት» የሚለውን ተረድቶ የሚሞላ ነው። በአማርኛ ግሱን መድገም ይህን ሳይቀይር ዓረፍተ ነገሩን ግልጽ ያደርገዋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «እየጾምህ መሆንህ» የድርጊቱን ቀጣይነት ያሳያል፤ የ«በስውር» ድግግሞሽም የግሪኩን አጻጻፍ ይጠብቃል።
