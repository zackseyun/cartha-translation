  naturalness: The first two clauses are clear, natural modern standard Amharic. Recasting the final maxim with “እያንዳንዱ ቀን” is natural and explicitly retains the distributive/generic force of the Greek dative.
  terminology: “ጭንቀት/መጨነቅ” and “ችግር” are appropriate, accessible choices. The footnote responsibly preserves “ክፋት” as a lexical alternative without forcing an inappropriate moral sense into the main text.
