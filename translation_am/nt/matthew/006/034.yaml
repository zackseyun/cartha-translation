id: MAT.6.34
reference: Matthew 6:34
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: μὴ οὖν μεριμνήσητε εἰς τὴν αὔριον, ἡ γὰρ αὔριον μεριμνήσει ⸀αὑτῆς· ἀρκετὸν τῇ ἡμέρᾳ ἡ κακία αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/034.yaml
  text: Therefore do not worry about tomorrow[a], for tomorrow will worry about itself. Each day has enough trouble of its own.
translation:
  language: am
  text: ስለዚህ ስለ ነገ አትጨነቁ፤ ነገ ስለ ራሱ ይጨነቃልና። ለእያንዳንዱ ቀን የራሱ ችግር ይበቃዋል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለእያንዳንዱ ቀን የራሱ ክፋት ይበቃዋል።” የግሪኩ ቃል “ክፋት” ማለት ይችላል፤ እዚህ ግን የቀኑን ችግር ወይም መከራ የሚያመለክት ይመስላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: μεριμνήσητε
  choice: አትጨነቁ
  rationale: በማቴዎስ 6፥25-34 ያለውን የጭንቀት ጭብጥ በተፈጥሯዊና በዘመናዊ አማርኛ ይገልጻል።
- source_word: εἰς τὴν αὔριον
  choice: ስለ ነገ
  rationale: ከμεριμνάω ጋር ሲያያዝ ጭንቀቱ ወደፊቱን እንደሚመለከት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἡ αὔριον
  choice: ነገ
  rationale: ‘ነገ’ን የድርጊቱ ባለቤት አድርጎ በማቅረብ በግሪኩ ያለውን ሰውኛ አገላለጽ ይጠብቃል።
- source_word: μεριμνήσει αὑτῆς
  choice: ስለ ራሱ ይጨነቃል
  rationale: ከቀደመው ‘አትጨነቁ’ ጋር ያለውን የግስ ድግግሞሽና የንግግሩን ሰውኛ ምስል ይጠብቃል።
- source_word: ἀρκετὸν
  choice: ይበቃዋል
  rationale: ‘በቂ ነው’ የሚለውን ፍቺ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τῇ ἡμέρᾳ
  choice: ለዕለቱ
  rationale: የግሪኩን ዳቲቭ ቅርጽ በቅርብ ሁኔታ ሲወክል እያንዳንዱን ቀን የሚያመለክተውን አጠቃላይ ምሳሌያዊ ንግግር ያስተላልፋል።
- source_word: κακία
  choice: ችግር
  rationale: ቃሉ ‘ክፋት’ ማለት ቢችልም፣ በዚህ የጭንቀት አውድ የዕለቱን መከራ፣ አስቸጋሪነት ወይም ጣጣ ያመለክታል።
- source_word: αὐτῆς
  choice: የራሱ
  rationale: ተውላጠ ስሙ ወደ ‘ዕለት’ መመለሱንና የእያንዳንዱ ቀን ችግር ለዚያው ቀን መሆኑን ያሳያል።
theological_decisions:
- issue: በጭንቀት ላይ በተሰጠው ጥበባዊ ንግግር ውስጥ የκακία ፍቺ
  choice: ‘ችግር’ ተብሎ ተተርጉሟል
  alternative: ‘ክፋት’
  rationale: የአንቀጹ አውድ ስለወደፊት ከመጨነቅ ይልቅ የእያንዳንዱ ቀን ሸክም ለዚያው ቀን በቂ መሆኑን ያስተምራል። ‘ችግር’ ይህን ተግባራዊ ፍቺ ያስተላልፋል፤ ‘ክፋት’ የሚለው እውነተኛ የቃላት አማራጭ ግን በግርጌ ማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ነገ ... ይጨነቃል’ የሚለው ሰውኛ አገላለጽና በሁለቱ ሐረጎች ያለው የግስ ድግግሞሽ ተጠብቋል።
