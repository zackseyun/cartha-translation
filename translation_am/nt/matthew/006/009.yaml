base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/009.yaml
  text: 'Therefore[a], you should pray like this: Our Father in the heavens, may your name be treated as holy[b],'
translation:
  language: am
  text: ስለዚህ እናንተ እንዲህ ጸልዩ፦ “በሰማያት[a] የምትኖር አባታችን ሆይ፣ ስምህ ይቀደስ፣”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በሰማይ የምትኖር” ተብሎም ሊተረጎም ይችላል፤ የግሪኩ ቃል በቀጥታ “በሰማያት” የሚል የብዙ ቁጥር ቅርጽ ነው።
