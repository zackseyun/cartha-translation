- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ትምህርት የሚመጣውን ድምዳሜ በግልጽ ያሳያል።
- source_word: προσεύχεσθε ὑμεῖς
  choice: እናንተ ... ጸልዩ
  rationale: የብዙ ቁጥር ትእዛዙንና በግልጽ ተውላጠ ስም ὑμεῖς የተሰጠውን አጽንዖት ይጠብቃል።
- source_word: Πάτερ ἡμῶν
  choice: አባታችን ሆይ
  rationale: የጥሪውን ቅርጽና የጋራ ብዙ ቁጥር ባለቤትነትን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: በሰማያት የምትኖር
  rationale: τοῖς οὐρανοῖς የሚለውን የብዙ ቁጥር ቅርጽ ‘ሰማያት’ ብሎ ይጠብቃል፤ ὁ ያለውን አዛማጅ ኃይልም በአማርኛ አንቀጽ በግልጽ ያቀርባል።
- source_word: ἁγιασθήτω
  choice: ይቀደስ
  rationale: የግሪኩን ተገብሮ ትእዛዛዊ የልመና ኃይል በአጭር፣ በተለመደና ክብር ባለው አማርኛ ይገልጻል።
- source_word: τὸ ὄνομά σου
  choice: ስምህ
  rationale: የምንጩን ‘ስም’ በቀጥታ ይጠብቃል፤ ዝና፣ ማንነት ወይም ባሕርይ ብሎ በትርጓሜ አይተካውም።
theological_decisions:
- issue: የአምላክን አባትነትና ልዕልና የሚያጣምረው የጸሎቱ መክፈቻ
  choice: በሰማያት የምትኖር አባታችን ሆይ
  alternative: በሰማይ ያለህ አባታችን ሆይ / የሰማይ አባታችን ሆይ
  rationale: ‘ሰማያት’ የግሪኩን ብዙ ቁጥር ይጠብቃል፤ ‘የሰማይ አባት’ ደግሞ የቦታ ሐረጉን ወደ ገላጭ ቅጽል ስለሚለውጥ አልተመረጠም።
- issue: ἁγιασθήτω የሚለውን ልመና መተርጎም
  choice: ስምህ ይቀደስ
  alternative: ስምህ እንደ ቅዱስ ይከበር
  rationale: ‘ይቀደስ’ የልመናውን ተገብሮ ቅርጽና የቅድስና ቃል ግንኙነት በቀጥታ ይጠብቃል፤ ‘እንደ ቅዱስ ይከበር’ ግልጽ ቢሆንም የትርጓሜ ማብራሪያን ይጨምራል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለሕዝብ ንባብ ተስማሚ አማርኛ ተጠቅሟል። ‘እናንተ’ የምንጩን አጽንዖት ይጠብቃል፤ ‘ይቀደስ’ ደግሞ የተለመደውን መጽሐፍ ቅዱሳዊ ክብር ሳይጥል ለዘመናዊ አንባቢ ግልጽ ነው። የግሪኩ ብዙ ቁጥር ‘ሰማያት’ በዋናው ጽሑፍ ተጠብቋል።
