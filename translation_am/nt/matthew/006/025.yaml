  text: Διὰ τοῦτο λέγω ὑμῖν· μὴ μεριμνᾶτε τῇ ψυχῇ ὑμῶν τί ⸀φάγητε, μηδὲ τῷ σώματι ὑμῶν τί ἐνδύσησθε· οὐχὶ ἡ ψυχὴ πλεῖόν ἐστι τῆς τροφῆς καὶ τὸ σῶμα τοῦ ἐνδύματος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/025.yaml
  text: Therefore I tell you[a], do not worry about your life, what you will eat, or about your body, what you will wear. Is not life more than food, and the body than clothing?
translation:
  language: am
  text: “ስለዚህ እላችኋለሁ፤ ስለ ሕይወታችሁ[a] ምን እንደምትበሉ፣ ወይም ስለ ሰውነታችሁ ምን እንደምትለብሱ አትጨነቁ። ሕይወት ከምግብ አትበልጥምን? ሰውነትስ ከልብስ አይበልጥምን?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ሕይወት” ለሚለው የግሪክ ቃል ψυχή “ነፍስ” ተብሎም ሊተረጎም ይችላል፤ ነገር ግን እዚህ ስለ መብላትና ስለ መልበስ ያለው አውድ “ሕይወት” የሚለውን ይደግፋል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: ስለዚህ
  rationale: ከቀደመው ትምህርት የሚወጣውን ድምዳሜ በተፈጥሯዊና ግልጽ አማርኛ ያሳያል።
- source_word: μεριμνᾶτε
  choice: አትጨነቁ
  rationale: ግሱ የጭንቀት እንክብካቤንና በኑሮ ፍላጎቶች መዋጥን ያመለክታል፤ ይህ አገላለጽ በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: ψυχῇ
  choice: ሕይወታችሁ
  rationale: ከመብላትና ከሰውነታዊ ፍላጎቶች አውድ አንጻር ψυχή እዚህ የሰውን ሕይወት ወይም ራስነት ያመለክታል፤ በቀጥታ የማይታየውን ‘ነፍስ’ ብቻ አያመለክትም።
- source_word: τί φάγητε
  choice: ምን እንደምትበሉ
  rationale: ከμεριμνάω ጋር ያለውን ወደፊት ያተኮረ ቀጥተኛ ያልሆነ ጥያቄ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: σώματι
  choice: ሰውነታችሁ
  rationale: ከልብስ ጋር በንጽጽር የቀረበውን አካላዊ ሰውነት በቀጥታ ይገልጣል።
- source_word: τί ἐνδύσησθε
  choice: ምን እንደምትለብሱ
  rationale: የመልበስን ወደፊት ያተኮረ ጉዳይ በተለመደና ግልጽ አማርኛ ያቀርባል።
- source_word: οὐχὶ
  choice: አይበልጥምን?
  rationale: አዎንታዊ መልስ የሚጠበቅበትን አነጋጋሪ ጥያቄ የአማርኛው -ምን ቅርጽ በተፈጥሯዊነት ያስተላልፋል።
- source_word: πλεῖόν
  choice: ይበልጣል
  rationale: ሕይወትና ሰውነት ከሚያገለግሏቸው ምግብና ልብስ እንደሚልቁ የሚያሳየውን ንጽጽር ይጠብቃል።
- source_word: τροφῆς
  choice: ምግብ
  rationale: ሕይወትን የሚያኖር ምግብን በግልጽና ቀጥተኛ ቃል ይገልጣል።
- source_word: ἐνδύματος
  choice: ልብስ
  rationale: በአጠቃላይ የሚለበሰውን ነገር የሚያመለክት ተለምዷዊና ከ‘ምግብ’ ጋር የሚመጣጠን ቃል ነው።
theological_decisions:
- issue: በኢየሱስ ትምህርት ውስጥ የψυχή ትርጉም
  choice: ‘ሕይወት’ ተብሎ ተተርጉሟል
  alternative: ‘ነፍስ’
  rationale: አውዱ ስለ መብላት፣ ስለ ሰውነትና ስለ ልብስ ስለሚናገር ψυχή እዚህ ምድራዊ ሕይወትን ወይም ሰውየውን ራሱን ያመለክታል። ‘ሕይወት’ ማለት ጥቅሱ ያልወሰነውን የአካልና የነፍስ ሥነ መለኮታዊ ልዩነት እንዳያስገባ ያደርጋል፤ የ‘ነፍስ’ አማራጭም በማስታወሻ ተጠብቋል።
