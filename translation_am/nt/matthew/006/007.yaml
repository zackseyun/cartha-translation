  text: Προσευχόμενοι δὲ μὴ βατταλογήσητε ὥσπερ οἱ ἐθνικοί, δοκοῦσιν γὰρ ὅτι ἐν τῇ πολυλογίᾳ αὐτῶν εἰσακουσθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/007.yaml
  text: And when you pray[a], do not heap up empty words like the Gentiles[b], for they think that they will be heard because of their many words.
translation:
  language: am
  text: ስትጸልዩም፣ እንደ አሕዛብ[a] ባዶ ቃላትን አታደራርቡ[b]፤ እነርሱ በቃላቸው ብዛት እንደሚሰሙላቸው ያስባሉና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም «እንደ አረማውያን»። የግሪኩ ቃል በቀጥታ ከቃል ኪዳኑ ሕዝብ ውጭ ያሉትን አሕዛብ ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም «አትንተባተቡ» ወይም «ትርጉም የሌለውን ድግግሞሽ አታድርጉ»። የግሪኩ ግስ ብርቅዬ ሲሆን፣ ቅን የሆነን ተደጋጋሚ ጸሎት ሳይሆን ባዶ፣ ሜካኒካዊ ወይም ከመጠን ያለፈ ንግግርን የሚያመለክት ይመስላል።
    reason: lexical_alternative
