    rationale: “እንደ እነርሱ አትደረጉ” normally means something like “do not be done,” not “do not be made/become like them.” It should be replaced by a natural alternative that signals the passive nuance without asserting an impossible wooden literalism.
  - severity: low
    issue: The main prohibition is slightly more imitation-focused than the Greek.
    rationale: ὁμοιωθῆτε concerns being or becoming like the referenced people. “እንደ እነርሱ አትሁኑ” more directly preserves that sense in natural Amharic.
