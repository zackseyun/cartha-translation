  yaml_path: translation/nt/matthew/006/008.yaml
  text: Therefore[a], do not become like them, for your Father knows what you need before you ask him.
translation:
  language: am
  text: እንግዲህ እንደ እነርሱ አትሁኑ[a]፤ አባታችሁ እርሱን ከመለመናችሁ በፊት የሚያስፈልጋችሁን ያውቃልና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እነርሱን አትምሰሉ»፤ የግሪኩ ተገብሮአዊ ቅርጽ፣ «እንደ እነርሱ እንዳትሆኑ» የሚል ሐሳብ ያሳያል።
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ οὖν
  choice: እንግዲህ … አት-
  rationale: οὖν ከቀደመው ማስጠንቀቂያ ጋር ያለውን የውሳኔ ግንኙነት ያሳያል፤ μή ደግሞ ክልከላውን በአማርኛው አሉታዊ ትእዛዝ ያቀርባል።
- source_word: ὁμοιωθῆτε
  choice: አትምሰሉ
  rationale: የእነርሱን የጸሎት አካሄድ እንዳይከተሉ የሚሰጠውን ክልከላ በተፈጥሯዊና ግልጽ አማርኛ ይገልጣል፤ የግሪኩ ተገብሮአዊ ቅርጽ በማስታወሻ ተጠብቋል።
- source_word: αὐτοῖς
  choice: እነርሱን
  rationale: በቅርብ አውድ የተጠቀሱትን ሰዎች የሚመለከት ተውላጠ ስም ነው፤ ተጨማሪ መለያ አያስፈልገውም።
- source_word: οἶδεν
  choice: ያውቃል
  rationale: οἶδα በቅርጹ ፍጹም ቢሆንም እዚህ የአሁን ጊዜ ትርጉም ስላለው «ያውቃል» ተብሏል።
- source_word: ὁ πατὴρ ὑμῶν
  choice: አባታችሁ
  rationale: ምንጩ «አባታችሁ» ብቻ ይላል፤ «የሰማዩ» የሚለው በዚህ ሐረግ ውስጥ ስለሌለ አልተጨመረም።
- source_word: ὧν χρείαν ἔχετε
  choice: የሚያስፈልጋችሁን
  rationale: የፍላጎታቸውን ይዘት በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν
  choice: እናንተ እርሱን ከመለመናችሁ በፊት
  rationale: πρὸ τοῦ ከግስ ስም ጋር የቀደመ ጊዜን ያመለክታል፤ የግል ተሳቢውም «እርሱን» ተብሎ በግልጽ ተጠብቋል።
theological_decisions:
- issue: ከጸሎት ጋር በተያያዘ የእግዚአብሔር ቀድሞ ማወቅ
  choice: አብ ደቀ መዛሙርቱ ሳይለምኑት በፊት ፍላጎታቸውን እንደሚያውቅ ንግግሩን በቀጥታ ማቅረብ
  alternative: ጸሎት መረጃ ለመስጠት ሳይሆን ለግንኙነት ነው የሚል ማብራሪያ መጨመር፣ ወይም ስለ ፍጹም ቀድሞ ማወቅ የዶክትሪን ቃላትን ማስገባት
  rationale: ጥቅሱ የአብን ቀድሞ ማወቅ ይናገራል እንጂ ጸሎት ለምን እንደሚያስፈልግ አያብራራም፤ ስለዚህ በጽሑፉ ያለው የሥነ መለኮት ውጥረት ሳይፈታ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «እንግዲህ» የአውዱን ምክንያታዊ ትስስር ይጠብቃል፤ «ያውቃልና» ደግሞ ሁለተኛው ሐረግ ለክልከላው ምክንያት መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
