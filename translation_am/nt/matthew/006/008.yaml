  naturalness: The sentence is generally clear, but placing “አባታችሁ” before the clause referring to asking him makes the referent and sentence flow more natural. “እንደ እነርሱ አትሁኑ” is standard, direct modern Amharic.
  terminology: “አባታችሁ,” “የሚያስፈልጋችሁን,” and “መለመን” are suitable and preserve the text without importing “heavenly” or doctrinal explanation.
