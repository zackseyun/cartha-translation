review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the adversative δέ, the priority expressed by πρῶτον, the paired objects “his kingdom and his righteousness,” and the future passive sense of προστεθήσεται. However, the plural future passive predicate should agree naturally with “እነዚህ ሁሉ.”
  naturalness: The main sentence is clear, reverent, and suitably modern-standard Amharic. Replacing “ይጨመሩላችኋል” with “ይጨመራሉ” gives the natural plural future passive form. The footnote contains a negation/construction error that reverses its intended explanation and needs repair.
  terminology: “መንግሥት” appropriately retains the established Matthean rendering of βασιλεία, and “ጽድቅ” is an appropriate broad rendering of δικαιοσύνη. The alternative “ፍትሕ” is properly retained in the footnote without narrowing the main text.
  issues:
  - severity: medium
    issue: The verbal form “ይጨመሩላችኋል” is not the natural plural future passive agreement for “እነዚህ ሁሉ.”
    rationale: προστεθήσεται is future passive, with ταῦτα πάντα as its plural subject in sense. “ይጨመራሉ” naturally states that these things will be added; “ለእናንተ” may be expressed separately to preserve the recipient.
  - severity: high
    issue: The footnote says, in effect, that the term does not include right relationship and conduct before God, because of “እንጂ ... ስለማያካትት.”
    rationale: This reverses the intended lexical explanation and conflicts with both the source-context rationale and the chosen rendering. It should state that the word includes such right relationship and conduct and is not limited to judicial or social justice.
  revised_text: ነገር ግን አስቀድማችሁ የእርሱን መንግሥትና ጽድቁን[a] ፈልጉ፤ እነዚህ ሁሉ ለእናንተ ይጨመራሉ።
