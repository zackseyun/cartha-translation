  text: ζητεῖτε δὲ πρῶτον τὴν ⸀βασιλείαν καὶ τὴν δικαιοσύνην αὐτοῦ, καὶ ταῦτα πάντα προστεθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/033.yaml
  text: But seek first his kingdom and his righteousness[a], and all these things will be added to you.
translation:
  language: am
  text: ነገር ግን አስቀድማችሁ የእርሱን መንግሥትና ጽድቁን[a] ፈልጉ፤ እነዚህ ሁሉ ለእናንተ ይጨመራሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ፍትሑን»። የግሪኩ ቃል ጽድቅን ወይም ፍትሕን ሊያመለክት ይችላል፤ በዚህ አውድ ግን ፍርዳዊ ወይም ማኅበራዊ ፍትሕን ብቻ ሳይሆን፣ በእግዚአብሔር ፊት ያለ ትክክለኛ ግንኙነትንና ምግባርንም ስለሚያካትት፣ «ጽድቅ» የሚለው ተጠብቋል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητεῖτε
  choice: ፈልጉ
  rationale: የአሁን ጊዜ ብዙ ቁጥር ትእዛዝ ንቁና ቀጣይ ፍለጋን ያመለክታል፤ «ፈልጉ» በዘመናዊ አማርኛ ተፈጥሯዊና ቀጥተኛ ነው።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከቀደመው ስለ ምግብ፣ መጠጥና ልብስ አለመጨነቅ ከሚናገረው ክፍል ጋር ያለውን ተቃርኖ ያሳያል።
- source_word: πρῶτον
  choice: አስቀድማችሁ
  rationale: የጊዜንም ሆነ የቅድሚያን ሐሳብ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: βασιλείαν
  choice: መንግሥት
  rationale: የንጉሣዊ አገዛዝንና የግዛትን ስፋት ሳያጠብ በማቴዎስ ወንጌል የተለመደውን መጽሐፍ ቅዱሳዊ አገላለጽ ይጠብቃል።
- source_word: δικαιοσύνην
  choice: ጽድቅ
  rationale: «ጽድቅ» ከእግዚአብሔር ፈቃድ ጋር የሚስማማ ትክክለኛ ግንኙነትንና ምግባርን ጨምሮ የግሪኩን ሰፊ ትርጉም ይጠብቃል፤ «ፍትሕ» የሚለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: αὐτοῦ
  choice: የእርሱን / ጽድቁን
  rationale: የግሪኩን ተውላጠ ስም ይጠብቃል፤ ከአውዱ አመልካቹ እግዚአብሔር መሆኑ ግልጽ ነው።
- source_word: ταῦτα πάντα
  choice: እነዚህም ሁሉ
  rationale: በቅርብ አውድ ወደተጠቀሱት ምግብ፣ መጠጥና ልብስ የሚያመለክተውን ጠቋሚ ኃይል ይጠብቃል።
- source_word: προστεθήσεται
  choice: ይጨመሩላችኋል
  rationale: የወደፊት ጊዜ ተደራጊ ቅርጹንና ከዋናው ፍለጋ በተጨማሪ እንደሚሰጡ ያለውን ሐሳብ ይጠብቃል።
- source_word: ὑμῖν
  choice: -ላችኋል
  rationale: የብዙ ቁጥር ተቀባይን «ለእናንተ» በሚል ተፈጥሯዊ የግስ ቅጥያ ይወክላል።
theological_decisions:
- issue: የδικαιοσύνη አተረጓጎም
  choice: ጽድቅ
  alternative: ፍትሕ
  rationale: በዚህ የማቴዎስ አውድ ቃሉ ፍትሐዊ ድርጊትን ብቻ ሳይሆን ከእግዚአብሔር ፈቃድ ጋር የሚስማማ አቋምንና ኑሮንም ያካትታል፤ «ጽድቅ» ይህን ስፋት ይሻላል።
- issue: የαὐτοῦ አመልካች
  choice: እርሱ
  alternative: እግዚአብሔር
  rationale: ዋናው ጽሑፍ የግሪኩን ተውላጠ ስም ይጠብቃል፤ አመልካቹ አብ/እግዚአብሔር መሆኑን አውዱ በቂ ያደርገዋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። «መንግሥት» እና «ጽድቅ» የሚሉት የታወቁ መጽሐፍ ቅዱሳዊ ቃላት ተጠብቀዋል፤ ዓረፍተ ነገሩ ግን ተፈጥሯዊ የአማርኛ አወቃቀር አለው።
