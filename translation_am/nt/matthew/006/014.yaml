    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “አባታችሁ፣ ሰማያዊው”፤ በተለምዶ “በሰማይ ያለው አባታችሁ” ተብሎ ይተረጎማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: … ብትሉ … ይላችኋልና
  rationale: ἐάν የሚያመለክተውን እውነተኛ ሁኔታዊ አነጋገር “ብትሉ” ይጠብቃል፤ γάρ ከቀደመው ጸሎት ጋር ያለውን ማብራሪያዊ ግንኙነት በአማርኛው የመጨረሻ “-ና” በተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: ἀφῆτε / ἀφήσει
