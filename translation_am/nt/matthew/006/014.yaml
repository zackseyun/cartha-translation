  rationale: በሁለቱም ቦታዎች የἀφίημιን አንድ የትርጉም ሥር በመጠበቅ፣ በሰዎች መካከልና በእግዚአብሔር ዘንድ ያለውን ይቅርታ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τοῖς ἀνθρώποις
  choice: ለሰዎች
  rationale: ἄνθρωποι እዚህ ወንዶችን ብቻ ሳይሆን ሰዎችን በአጠቃላይ ያመለክታል።
- source_word: τὰ παραπτώματα αὐτῶν
  choice: በደላቸውን
  rationale: παράπτωμα የሞራል መሰናከልን፣ በደልን ወይም መተላለፍን ሊያመለክት ይችላል። “በደል” በይቅርታ አውድ ተፈጥሯዊና ግንኙነታዊ ኃይሉን የሚጠብቅ ነው። የባለቤትነት ቅጥያው αὐτῶνን ያንጸባርቃል።
- source_word: καὶ ὑμῖν
  choice: እናንተንም
  rationale: “-ም” የκαίን ‘ደግሞ/እንዲሁ’ ኃይል በአጭርና ተፈጥሯዊ መንገድ ያሳያል፤ የአማርኛው ቀጥተኛ ተሳቢ ቅርጽ ὑμῖνን በትርጉም ይወክላል።
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: ሰማያዊው አባታችሁ
