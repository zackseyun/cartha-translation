  text: For if you forgive people their trespasses[b][a], your heavenly Father will also forgive you.
translation:
  language: am
  text: ምክንያቱም፣ ለሰዎች በደላቸውን[a] ይቅር ብትሉ፣ ሰማያዊው አባታችሁ[b] እናንተንም ይቅር ይላችኋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
