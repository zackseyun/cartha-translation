- source_word: ὁ βλέπων ἐν τῷ κρυπτῷ
  choice: በስውር የሚያየው
  rationale: በግሪኩ ያለውን ἐν τῷ κρυπτῷ የሚለውን ድግግሞሽ ‘በስውር’ ብሎ በመድገም የሕዝብ ፊት ማሳየትንና ስውር እውነተኝነትን የሚያነጻጽረውን አጽንዖት ይጠብቃል።
- source_word: ἀποδώσει σοι
  choice: ዋጋህን ይሰጥሃል
  rationale: ἀποδίδωμι ‘መመለስ፣ መክፈል፣ ዋጋ መስጠት’ ሊል ይችላል። በዚህ አውድ ‘ዋጋህን ይሰጥሃል’ አዎንታዊውን የሽልማት ሐሳብ ያስተላልፋል፤ የሚሰጠው ነገር ምን እንደሆነ ግን አይወስንም።
