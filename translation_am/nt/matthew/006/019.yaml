  text: 19 በምድር ላይ ለራሳችሁ ሀብት አታከማቹ፤ በዚያ ብልና መበስበስ[a] ያጠፋሉ፤ ሌቦችም ሰርስረው ገብተው[b] ይሰርቃሉ።
  philosophy: optimal-equivalence
  footnotes:
