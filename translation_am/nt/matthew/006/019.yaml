  rationale: ገንዘብን ብቻ ሳይሆን ዋጋ ያላቸውን የምድር ንብረቶች በስፋት ያካትታል፤ ከ‘ማከማቸት’ ጋርም ተፈጥሯዊ የአማርኛ አገላለጽ ይፈጥራል።
- source_word: ἐπὶ τῆς γῆς
