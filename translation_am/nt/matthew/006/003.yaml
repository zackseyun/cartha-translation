  yaml_path: translation/nt/matthew/006/003.yaml
  text: But when you give to the needy[a], do not let your left hand know what your right hand is doing,
translation:
  language: am
  text: አንተ ግን ለድሆች ስትሰጥ፣[a] ቀኝ እጅህ የሚያደርገውን ግራ እጅህ አይወቅ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ምጽዋት ስታደርግ።” የግሪኩ ቃል ለድሆች የሚደረግ የርኅራኄ ስጦታን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: σοῦ δὲ ποιοῦντος
  choice: አንተ ግን … ስትሰጥ
  rationale: የዘር ባለቤት ፍጹም አገባቡን በተፈጥሯዊ አማርኛ የጊዜ ንዑስ ሐረግ በማድረግ፣ δέ የሚያሳየውን ንፅፅር ‘ግን’ ጠብቋል። ποιέω ከἐλεημοσύνην ጋር በዚህ አውድ መስጠትን ያመለክታል።
- source_word: ἐλεημοσύνην
  choice: ለድሆች ስትሰጥ
  rationale: ቃሉ በተለምዶ ለድሆች የሚደረግ ምጽዋትን ወይም የርኅራኄ ስጦታን ያመለክታል። ይህ አተረጓጎም ለዘመናዊ አንባቢ ግልጽና ተፈጥሯዊ ነው፤ ‘ምጽዋት’ የሚለው የቅርብ ቃላዊ አማራጭ በማስታወሻው ተጠብቋል።
- source_word: μὴ γνώτω
  choice: አይወቅ
  rationale: የሦስተኛ መደብ ክልከላዊ ትእዛዙን በአማርኛ ቀጥተኛና ተፈጥሯዊ በሆነ ክልከላዊ ቅርጽ ያቀርባል።
- source_word: ἡ ἀριστερά σου
  choice: ግራ እጅህ
  rationale: የእጆቹን ሕያው ሰውኛ አገላለጽና የንግግሩን ትውስታ የሚቀር ምስል በቀጥታ ይጠብቃል።
- source_word: τί ποιεῖ ἡ δεξιά σου
  choice: ቀኝ እጅህ የሚያደርገውን
  rationale: የግሪኩን የአሁን ጊዜ እርምጃና የእጆቹን ሰውኛ አገላለጽ በተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: ግራ እጅ ቀኝ እጅ የሚያደርገውን እንዳያውቅ የሚለው ንግግር ትርጉም
  choice: ምስላዊውን አገላለጽ ሳይፈታ እንዳለ ማቆየት፣ በመስጠት ጊዜ ራስን ከማሳየት መራቅንና እጅግ ስውር መሆንን እንዲያስተላልፍ
  alternative: ንግግሩን ስለ ትሕትና ብቻ እንደ ግነት መተርጎም፣ ወይም ሁሉንም በሕዝብ ፊት የሚደረግ ልግስና ያለ ልዩነት እንደሚከለክል ማብራራት
  rationale: ጽሑፉ ሰውኛ አገላለጽና ግነት ያለውን ምስል ይጠቀማል። ምስሉን ማቆየት ከጽሑፉ በላይ ጥብቅ የሆነ ዶክትሪናዊ ድምዳሜ ሳይጨምር የኢየሱስን ስውር ልግስና ላይ ያለ አጽንዖት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የእጆቹ ሰውኛ ምስልና የግሪኩ ንፅፅር ተጠብቀዋል።
