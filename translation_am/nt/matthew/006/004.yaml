  text: ὅπως ᾖ σου ἡ ἐλεημοσύνη ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸀κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/004.yaml
  text: so that your giving to the poor may be in secret[b][a]; and your Father who sees in secret will reward you.
translation:
  language: am
  text: ለድሆች የምትሰጠው ስጦታ በስውር እንዲሆን፤ በስውር የሚያይ አባትህም ይሸልምሃል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ይመልስልሃል።”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως ᾖ
  choice: እንዲሆን
  rationale: የὅπως ዓላማ አመልካች ኃይልንና የመኖር ግስ ንዑስ አዋዋይን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἡ ἐλεημοσύνη σου
  choice: ለድሆች የምትሰጠው ስጦታ
  rationale: ቃሉ አጠቃላይ ምሕረትን ሳይሆን በተለይ ለተቸገሩ የሚደረግን ስጦታ ያመለክታል፤ ይህ አገላለጽ ለዘመናዊ አንባቢ ግልጽ ነው።
- source_word: ἐν τῷ κρυπτῷ
  choice: በስውር
  rationale: ከሕዝብ ዓይን የተሰወረ መሆንን በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል፤ በሁለቱም ሐረጎች ያለውን ድግግሞሽም ይጠብቃል።
- source_word: ὁ πατήρ σου
  choice: አባትህ
  rationale: የግሪኩን 'አባትህ' ብቻ ይከተላል፤ በዚህ ቁጥር የሌለውን 'የሰማይ' አይጨምርም።
- source_word: ὁ βλέπων
  choice: የሚያይ
  rationale: ስማዊ አገልግሎት ያለውን አሁናዊ አሳታፊ በተፈጥሯዊ የአማርኛ አንጻራዊ ሐረግ ያቀርባል።
- source_word: ἀποδώσει σοι
  choice: ዋጋህን ይከፍልሃል
  rationale: ግሱ መልሶ መስጠትን፣ መካስን ወይም ዋጋ መክፈልን ሊያመለክት ይችላል። በዚህ አውድ አዎንታዊውን መለኮታዊ ምላሽ ያስተላልፋል፤ የሽልማቱን መልክ ግን አይወስንም።
theological_decisions:
- issue: በἀποδώσει የተገለጠው መለኮታዊ ምላሽ
  choice: ዋጋህን ይከፍልሃል
  alternative: ይመልስልሃል
  rationale: በስውር ለተደረገ በጎ ሥራ እግዚአብሔር አዎንታዊ ምላሽ እንደሚሰጥ ያሳያል፤ ምላሹ ጊዜያዊ፣ ዘላለማዊ፣ ቁሳዊ ወይም መንፈሳዊ መሆኑን አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ተደጋጋሚ 'በስውር' አገላለጽ ተጠብቋል፤ በምንጩ የሌለው 'የሰማይ' የሚል ቅጽል አልተጨመረም።
