language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τίς δὲ ἐξ ὑμῶν μεριμνῶν δύναται προσθεῖναι ἐπὶ τὴν ἡλικίαν αὐτοῦ πῆχυν ἕνα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/027.yaml
  text: And which of you[a], by being anxious, can add one cubit to his stature?
translation:
  language: am
  text: ከእናንተስ መካከል በመጨነቅ በሕይወት ዘመኑ[a] ላይ አንድ ክንድ መጨመር የሚችል ማን ነው?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በቁመቱ ላይ።” የግሪኩ ቃል “ዕድሜ” ወይም “የሕይወት ዘመን” እንዲሁም “ቁመት” ማለት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: τίς δὲ ἐξ ὑμῶν
  choice: ከእናንተስ ውስጥ ... ማን ነው?
  rationale: የግሪኩን ‘ከእናንተ መካከል ማን?’ የሚለውን ፈሊጣዊ ጥያቄ በተፈጥሯዊ አማርኛ ያቀርባል፤ -ስ ደግሞ δέ ያለውን ቀላል የንግግር ቅጥልጥል ያሳያል።
- source_word: μεριμνῶν
  choice: በመጨነቁ
  rationale: በአውዱ ያለውን መጨነቅ ይገልጣል፤ የአሳታፊውንም የመንገድ/የምክንያት ኃይል ‘በመ-’ ቅርጽ ያስተላልፋል።
- source_word: δύναται προσθεῖναι
  choice: ሊጨምር የሚችል
  rationale: የመቻልንና የመጨመርን ትርጉም በግልጽና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐπὶ τὴν ἡλικίαν αὐτοῦ
  choice: በዕድሜው ላይ
  rationale: ἡλικία ዕድሜን/የሕይወት ዘመንን ወይም ቁመትን ሊያመለክት ይችላል። በጭንቀትና በሕይወት ላይ ባለው አውድ ‘ዕድሜ’ ተመርጧል፤ ሌላው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: πῆχυν ἕνα
  choice: አንድ ክንድ
  rationale: የጥንቱን የርዝመት መለኪያና የንግግሩን ምስላዊ አገላለጽ ሳይተረጉም ይጠብቃል።
theological_decisions:
- issue: በዚህ ንግግር ውስጥ የἡλικία ትርጉም
  choice: ዕድሜ / የሕይወት ዘመን
  alternative: ቁመት
  rationale: ስለ ጭንቀትና እግዚአብሔር ለሕይወት ስለሚያደርገው እንክብካቤ ከሚናገረው ሰፊ አውድ ጋር ‘ዕድሜ’ ይስማማል። ሆኖም የግሪኩ ቃል ‘ቁመት’ ማለትም ስለሚችል ይህ እውነተኛ አሻሚነት በማስታወሻ ተገልጧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ክንድ’ መጽሐፍ ቅዱሳዊ የመለኪያ ቃል ቢሆንም የግሪኩን ተጨባጭ ምስል ለመጠበቅ ተይዟል።
