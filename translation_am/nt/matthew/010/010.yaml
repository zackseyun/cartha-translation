id: MAT.10.10
reference: Matthew 10:10
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: μὴ πήραν εἰς ὁδὸν μηδὲ δύο χιτῶνας μηδὲ ὑποδήματα μηδὲ ⸀ῥάβδον· ἄξιος γὰρ ὁ ἐργάτης τῆς τροφῆς ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/010.yaml
  text: do not take a traveler's bag for the road[a], or two tunics, or sandals, or a staff; for the worker is worthy of his food.
translation:
  language: am
  text: ለጉዞ የሚሆን የጉዞ ከረጢት፣ ሁለት ቀሚሶች፣ ጫማ፣ ወይም በትር[a] አትያዙ፤ ሠራተኛው ምግቡ ይገባዋልና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንዶች፣ በተለይም በትር መያዝን ከሚፈቅደው ከማርቆስ 6፥8 አንጻር፣ ይህን ንግግር «ተጨማሪ በትር አትያዙ» ማለት እንደሆነ ይረዱታል።
    reason: alternative_reading
lexical_decisions:
- source_word: πήραν
  choice: የጉዞ ከረጢት
  rationale: ቃሉ በጉዞ ጊዜ በተለይም ስንቅ ለመያዝ የሚያገለግል ከረጢትን ያመለክታል፤ ይህ አተረጓጎም የጉዞውን አውድ በግልጽ ያሳያል።
- source_word: εἰς ὁδὸν
  choice: ለመንገድ የሚሆን
  rationale: ሐረጉ ለጉዞ ተብሎ የሚወሰድን ነገር ያመለክታል፤ በአማርኛ ተፈጥሯዊ ሆኖ ከየጉዞ ከረጢት ጋር ይያያዛል።
- source_word: δύο χιτῶνας
  choice: ሁለት ቀሚሶች
  rationale: χιτών በሰውነት ላይ በቀጥታ የሚለበሰውን መሠረታዊ ልብስ ያመለክታል፤ «ቀሚስ» ከአጠቃላዩ «ልብስ» ይልቅ ታሪካዊ ቅርጹን ይጠብቃል።
- source_word: ὑποδήματα
  choice: ጫማ
  rationale: ቃሉ በእግር ሥር ታስሮ የሚደረግ የእግር ልብስን ያመለክታል፤ «ጫማ» ለዘመናዊ አንባቢ ግልጽና ተፈጥሯዊ ነው።
- source_word: ῥάβδον
  choice: በትር
  rationale: በዚህ አውድ ቃሉ ተጓዥ የሚይዘውን በትር ያመለክታል። የማቴዎስን ግልጽ ክልከላ ይጠብቃል እንጂ ከማርቆስ 6፥8 ጋር ለማስማማት አይለውጠውም።
- source_word: ἄξιος
  choice: ይገባዋል
  rationale: የብቁነትንና በፍትሕ የሚገባውን የማግኘት ሐሳብ በዘመናዊና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὁ ἐργάτης
  choice: ሠራተኛው
  rationale: ማንኛውንም ሥራ የሚሠራ ሰው የሚለውን መሠረታዊ ትርጉም ይጠብቃል፤ ልዩ ሃይማኖታዊ የሥልጣን ስያሜ አያስገባም።
- source_word: τῆς τροφῆς αὐτοῦ
  choice: ምግቡ
  rationale: τροφή በቀጥታ ምግብን ወይም ሲሳይን ያመለክታል፤ «ምግቡ» የግሪኩን ተጨባጭ ትርጉም ከአጠቃላዩ «ድጋፍ» ይልቅ በቅርብ ይጠብቃል።
theological_decisions:
- issue: በትይዩ ወንጌላት የተፈቀዱ የጉዞ ዕቃዎችን አስመልክቶ ሊታይ የሚችል ልዩነት
  choice: በዋናው ጽሑፍ «ወይም በትር አትያዙ» ተብሎ የማቴዎስ ክልከላ እንዳለ ተጠብቋል።
  alternative: ክልከላው ተጨማሪ በትርን ብቻ እንደሚመለከት መተርጎም፣ ወይም ከማርቆስ 6፥8 ጋር እንዲስማማ በሰፊው መተርጎም።
  rationale: የግሪኩ ጽሑፍ ῥάβδονን ከተከለከሉት ዕቃዎች መካከል በግልጽ ይዘረዝራል። ስለዚህ በወንጌላቱ መካከል ያለው የአነጋገር ውጥረት በትርጉሙ አልተወገደም፤ አማራጭ ግንዛቤው በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ቀላል የሆነ አማርኛ ተጠቅሟል። «አትያዙ» የብዙ ቁጥር ትእዛዝን ይጠብቃል፤ የዝርዝሩ ተያያዥነትም በሥርዓተ ነጥብ ግልጽ ተደርጓል።
