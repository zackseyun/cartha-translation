reference: Matthew 10:19
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀παραδῶσιν ὑμᾶς, μὴ μεριμνήσητε πῶς ἢ τί λαλήσητε· δοθήσεται γὰρ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τί ⸀λαλήσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/019.yaml
  text: But when they hand you over[a], do not worry about how or what you should speak[b], for what you should speak will be given to you in that hour.
translation:
  language: am
  text: ነገር ግን አሳልፈው በሚሰጧችሁ ጊዜ፣ እንዴት ወይም ምን እንደምትናገሩ አትጨነቁ፤ የምትናገሩት በዚያች ሰዓት ይሰጣችኋልና።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ይሰጣችኋል» የሚለው ተደራጊ አነጋገር ሰጪውን በዚህ ቁጥር በግልጽ አይጠራም፤ ቀጣዩ ቁጥር ግን የአባታችሁ መንፈስ በእናንተ የሚናገር መሆኑን ይገልጣል።
    reason: cross_reference
lexical_decisions:
- source_word: ὅταν δὲ
  choice: ነገር ግን ... በሚሰጧችሁ ጊዜ
  rationale: δέ ከቀደመው ማስጠንቀቂያ ጋር ያለውን ለስላሳ ተቃርኖ በ«ነገር ግን» ያሳያል፤ ὅταν ደግሞ ወደፊት ሊፈጸም የሚችልን ሁኔታ በተፈጥሯዊው የአማርኛ «... ጊዜ» አገባብ ይገልጣል።
- source_word: παραδῶσιν ὑμᾶς
  choice: አሳልፈው በሚሰጧችሁ
  rationale: «አሳልፎ መስጠት» በአውዱ ያለውን ለባለሥልጣን ወይም ለፍርድ የማስረከብ ትርጉም ይጠብቃል፤ «መክዳት» የሚለውን ያልተገለጸ ሐሳብ አይጨምርም።
- source_word: μὴ μεριμνήσητε
  choice: አትጨነቁ
  rationale: በመጪው ምስክርነት ላይ አስቀድሞ በጭንቀት እንዳይዋጡ የሚሰጠውን ክልከላ በዘመናዊና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: πῶς ἢ τί λαλήσητε
  choice: እንዴት ወይም ምን እንደምትናገሩ
  rationale: «እንዴት» የንግግሩን አኳኋን፣ «ምን» ደግሞ ይዘቱን ይለያሉ፤ ἤ ያለውን «ወይም» በቀጥታ ይጠብቃል።
- source_word: δοθήσεται
  choice: ይሰጣችኋል
  rationale: የግሪኩን የተደራጊ አነጋገር ይጠብቃል፤ ሰጪውን በዚህ ቁጥር ሳይጠራ እንዳለ ይተዋል።
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: በዚያች ሰዓት
  rationale: እርዳታው በሚያስፈልግበት ጊዜ እንደሚሰጥ ያለውን ፈጣንነትና ቅርበት ይጠብቃል።
- source_word: τί λαλήσητε
  choice: የምትናገሩት
  rationale: λαλέω ከቀደመው አጠቃቀም ጋር «መናገር» ተብሎ የቃሉን ድግግሞሽ ይጠብቃል።
theological_decisions:
- issue: በδοθήσεται ውስጥ ያልተጠቀሰው ሰጪ
  choice: «ይሰጣችኋል» የሚለውን ተደራጊ አነጋገር መጠበቅ
  alternative: «እግዚአብሔር ይሰጣችኋል» ወይም «መንፈስ ቅዱስ ይሰጣችኋል»
  rationale: የግሪኩ ጽሑፍ በዚህ ቁጥር ሰጪውን በግልጽ አይጠራም። ቀጣዩ ቁጥር የመንፈሱን አድራጊነት ቢገልጥም፣ ይህ ትርጉም የአሁኑን ቁጥር መጠነኛ አነጋገር ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «አሳልፈው መስጠት» የፍርድ አውዱን ይጠብቃል፤ «አትጨነቁ» ደግሞ የጭንቀት ሐሳቡን ተፈጥሯዊ በሆነ አነጋገር ያቀርባል።
