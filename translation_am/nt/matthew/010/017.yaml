id: MAT.10.17
reference: Matthew 10:17
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: προσέχετε δὲ ἀπὸ τῶν ἀνθρώπων· παραδώσουσιν γὰρ ὑμᾶς εἰς συνέδρια, καὶ ἐν ταῖς συναγωγαῖς αὐτῶν μαστιγώσουσιν ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/017.yaml
  text: But beware of people[a], for they will hand you over to councils, and in their synagogues they will flog you.
translation:
  language: am
  text: ነገር ግን ከሰዎች ተጠንቀቁ፤ ምክንያቱም ለሸንጎዎች አሳልፈው ይሰጧችኋል፣ በምኩራቦቻቸውም ይገርፏችኋል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσέχετε
  choice: ተጠንቀቁ
  rationale: የብዙ ሰዎች ትእዛዛዊ ቅርጽ ሲሆን፣ ከሚመጣ አደጋ ንቁ እንዲሆኑ የሚሰጠውን ማስጠንቀቂያ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከቀደመው መመሪያ ወደ ማስጠንቀቂያ የሚደረገውን መጠነኛ ንጽጽርና ሽግግር ያሳያል።
- source_word: ἀπὸ τῶν ἀνθρώπων
  choice: ከሰዎች
  rationale: ἀπό ከπροσέχω ጋር የአደጋውን ምንጭ ያመለክታል። ἄνθρωποι እዚህ ወንዶችን ብቻ ሳይሆን ሰዎችን በአጠቃላይ ያመለክታል።
- source_word: παραδώσουσιν
  choice: አሳልፈው ይሰጧችኋል
  rationale: ለባለሥልጣናት ወይም ለፍርድ አካል አሳልፎ የመስጠትን ሕጋዊ አውድ ይጠብቃል፤ ‘ይከዷችኋል’ ግን በጽሑፉ ያልተገለጸ የግል ክህደትን ሊያክል ይችላል።
- source_word: συνέδρια
  choice: ሸንጎዎች
  rationale: ቃሉ የአካባቢ ገዢ ወይም ዳኝነት ምክር ቤቶችን በብዙ ቁጥር ያመለክታል፤ የኢየሩሳሌሙን ሸንጎ ብቻ አያመለክትም።
- source_word: συναγωγαῖς αὐτῶν
  choice: በምኵራቦቻቸው
  rationale: የአይሁድን የስብሰባና የአምልኮ ቦታዎች በተለመደው የአማርኛ መጽሐፍ ቅዱሳዊ ቃል ይገልጻል፤ αὐτῶν የባለቤትነት/የግንኙነት ሐሳብ በ‘-ቻቸው’ ተጠብቋል።
- source_word: μαστιγώσουσιν
  choice: ይገርፏችኋል
  rationale: በጅራፍ ወይም በግርፋት የሚፈጸምን ከባድ የአካል ቅጣት ግልጽና ክብር ባለው ዘመናዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: የἀνθρώπων ጾታዊ አተረጓጎም
  choice: ሰዎች
  alternative: ወንዶች
  rationale: የግሪኩ ቃል በሰዋሰው ወንዳዊ ብዙ ቁጥር ቢሆንም፣ በዚህ አውድ ጠላት የሆኑ ሰዎችን በአጠቃላይ እንጂ ወንዶችን ብቻ አያመለክትም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ሸንጎዎች’ እና ‘ምኵራቦች’ የተቋማቱን ታሪካዊ አውድ ይጠብቃሉ። የግሪኩ ἀνθρώπων አጠቃላይ ስለሆነ ‘ሰዎች’ በትክክል ያስተላልፈዋል፤ በአማርኛ ልዩ የጾታ አማራጭ ማስታወሻ አያስፈልግም።
