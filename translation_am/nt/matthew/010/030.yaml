lexical_decisions:
- source_word: ὑμῶν
  choice: የራሳችሁ
  rationale: የሁለተኛ መደብ ብዙ ቁጥር ባለቤትነትን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከቀደመው ማበረታቻ ጋር ያለውን ረጋ ያለ ንጽጽርና የንግግር ሽግግር ይጠብቃል።
- source_word: καὶ
  choice: እንኳ
  rationale: ትልልቅ ጉዳዮች ብቻ ሳይሆኑ እያንዳንዱ ጠጉር እንኳ እንደሚታወቅ የሚያጎላውን አጽንዖት ያስተላልፋል።
- source_word: αἱ τρίχες τῆς κεφαλῆς
  choice: የራሳችሁ ጠጉር
  rationale: የግሪኩን የባለቤትነት አወቃቀር በተፈጥሯዊና በግልጽ የአማርኛ አገላለጽ ይሰጣል፤ ጠጉር በአማርኛ በነጠላ መልክ የስብስብ ትርጉም ሊሰጥ ይችላል።
- source_word: πᾶσαι
  choice: ሁሉ
  rationale: ምንም ሳይቀር ሙሉ በሙሉ የሚለውን አጽንዖት በአጭርና ተፈጥሯዊ መንገድ ይጠብቃል።
- source_word: ἠριθμημέναι εἰσίν
  choice: ተቈጥሯል
  rationale: የተፈጸመ ድርጊትና አሁንም የሚቆይ ውጤቱን የሚያመለክተውን ፍጹም ተደራጊ አወቃቀር በተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: ንግግሩ የሚያመለክተው የመለኮታዊ እውቀትና እንክብካቤ ስፋት
  choice: ጠጉሩ ሁሉ እንደተቈጠረ የሚናገረውን ተጨባጭ ምስል በቀጥታ ማቅረብ
  alternative: ስለ እግዚአብሔር ጥበቃ ወይም ሉዓላዊ ቁጥጥር በትርጓሜ ማስፋት
  rationale: ጥቅሱ ራሱ ጠጉር መቈጠሩን ይናገራል፤ የነገረ መለኮት አንድምታው ከዐውዱ እንዲገኝ እንጂ በትርጉሙ ውስጥ ትርጓሜያዊ ሐረግ አልተጨመረም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “ተቈጥሯል” የሚለው አጻጻፍ የቃሉን አነባበብ በግልጽ ያሳያል።
