    text: ቃል በቃል፣ “ተቈጥረው አሉ።” የግሪኩ ፍጹም ተደራጊ ቅርጽ የተጠናቀቀ ድርጊትና አሁንም የሚቀጥል ውጤት ሊያጎላ ይችላል።
