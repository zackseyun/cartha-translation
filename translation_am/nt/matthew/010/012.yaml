  text: As you enter the house[a], greet it.
translation:
  language: am
  text: ወደ ቤቱ[a] ስትገቡ፣ ሰላምታ ስጡት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ለቤተሰቡ ሰላምታ ስጡ።» የግሪኩ ጽሑፍ ቃል በቃል «ሰላምታ ስጡት» ይላል፤ «ቤቱ» የሚለው በውስጡ የሚኖሩትን ሰዎች በዘይቤ የሚያመለክት መሆኑ ይታሰባል።
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσερχόμενοι
  choice: ስትገቡ
  rationale: የአሁን ጊዜ ቦዝ አንቀጽ ሲሆን ከትእዛዙ ጋር በጊዜ የተያያዘውን ተግባር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: δὲ
  choice: ም
  rationale: ቀላል አያያዥነቱን ከ«ቤቱ» ጋር በተያያዘው «ም» ማያያዣ በተፈጥሯዊ ሁኔታ ያሳያል፤ እንደ ጠንካራ ተቃርኖ አልተተረጎመም።
- source_word: οἰκίαν
  choice: ቤቱ
  rationale: ቃሉ ሕንፃውን ወይም በውስጡ ያሉትን ቤተሰቦች ሊያመለክት ይችላል። የመግባት አውድ ስላለ በዋናው ጽሑፍ «ቤቱ» ተመርጧል።
- source_word: ἀσπάσασθε
  choice: ሰላምታ ስጡት
  rationale: የሁለተኛ መደብ ብዙ ቁጥር ቀጥተኛ ትእዛዝ ነው። «ሰላምታ ስጡ» በዘመናዊ አማርኛ ግልጽና ክቡር አገላለጽ ነው።
- source_word: αὐτήν
  choice: ት (በ«ስጡት»)
  rationale: የግሪኩ ነጠላ ሴት ፆታ ተውላጠ ስም οἰκίανን ይመለከታል። አማርኛ ለ«ቤት» በተለምዶ የወንድ ፆታ ስምምነት ስለሚጠቀም፣ ነጠላ ተሳቢው «-ት» በግሱ ውስጥ ተጠብቋል፤ ለነዋሪዎቹ በግልጽ የሚያመለክተው ትርጉም በማስታወሻ ቀርቧል።
theological_decisions:
- issue: ቤቱን በዘይቤ መጥቀስ ወይም ነዋሪዎቹን በግልጽ መጥቀስ
  choice: በዋናው ጽሑፍ «ሰላምታ ስጡት» በማለት የግሪኩን ዘይቤያዊ አገላለጽ ማቆየት
  alternative: «ለቤተሰቡ ሰላምታ ስጡ» ወይም «በውስጡ ያሉትን ሰላም በሉ»
  rationale: የግሪኩ αὐτήν በቀጥታ οἰκίανን ይመለከታል። የታሰበው ማኅበራዊ ተቀባይ ነዋሪዎቹ ሊሆኑ ቢችሉም፣ ይህን በዋናው ጽሑፍ በመግለጥ የምንጩን ዘይቤና አሻሚነት አልተወገደም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር አማርኛ ተጠቅሟል። «ሰላምታ ስጡት» የምንጩን ነጠላ ተሳቢና ዘይቤያዊ አገላለጽ ሲጠብቅ፣ ለአማርኛ አንባቢም ተፈጥሯዊ ነው።
