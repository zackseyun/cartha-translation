  text: ὁ εὑρὼν τὴν ψυχὴν αὐτοῦ ἀπολέσει αὐτήν, καὶ ὁ ἀπολέσας τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/039.yaml
  text: The one who finds his life will lose it[a], and the one who loses his life for my sake will find it.
translation:
  language: am
  text: ሕይወቱን ያገኘ ያጣታል፤ ስለ እኔም ሕይወቱን ያጣ ያገኛታል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በሁለቱም ሐረጎች “ነፍሱን” ተብሎም ሊተረጎም ይችላል፤ የግሪኩ ψυχή “ሕይወት” ወይም “ነፍስ” ማለት ሊሆን ይችላል። እዚህ ግን ሰው በደቀ መዝሙርነት ሕይወቱን ስለማጣትና ስለማግኘት ስለሚናገር “ሕይወት” ከአውዱ የበለጠ ይስማማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εὑρὼν
  choice: ያገኘ
  rationale: መስተዋድዱና የአኦሪስት አሳታፊው በአንድነት አጠቃላይ ሰውን ያመለክታሉ፤ በአማርኛ የዝምድና ግስ ይህን በተፈጥሯዊ አነጋገር ያስተላልፋል።
- source_word: ψυχὴν
  choice: ሕይወቱን
  rationale: በዚህ የደቀ መዝሙርነት አውድ ψυχή በዋናነት የሰውን ሕይወት ያመለክታል፤ ‘ነፍስ’ ግን እዚህ ላይ አካል ከሌለው የሰው ክፍል ጋር እንዳይወሰን በማስታወሻ ተጠብቋል።
- source_word: ἀπολέσει / ὁ ἀπολέσας
  choice: ያጣታል / ያጣ
  rationale: ἀπόλλυμι በዚህ አውድ መጥፋትን ወይም ማጣትን እንጂ ማጥፋትን አያመለክትም፤ ‘ማጣት’ ከ‘ማግኘት’ ጋር ያለውን የንግግር ተቃርኖ ይጠብቃል።
- source_word: ἕνεκεν ἐμοῦ
  choice: ስለ እኔ
  rationale: ምክንያትንና ለኢየሱስ ያለን ታማኝነት የሚያመለክተውን ሐረግ በተፈጥሯዊና ክቡር ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: εὑρήσει
  choice: ያገኛታል
  rationale: ከመጀመሪያው εὑρὼν ጋር ያለውን ሆን ተብሎ የተሠራ የቃል ድግግሞሽና ትይዩነት ይጠብቃል።
- source_word: αὐτοῦ / αὐτήν
  choice: -ቱ / -ታል
  rationale: የግሪኩን ነጠላ ወካይ አወቃቀር የአማርኛ ባለቤትነትና ተሳቢ ቅጥያዎች በተፈጥሯዊ ሁኔታ ያንጸባርቃሉ።
theological_decisions:
- issue: በደቀ መዝሙርነት ተቃርኖ ውስጥ ψυχήን መተርጎም
  choice: ሕይወት
  alternative: ነፍስ
  rationale: ንግግሩ ሰው ራሱን ለማቆየት መሞከሩንና ለኢየሱስ ሲል ሕይወቱን መስጠቱን ያነጻጽራል። ‘ሕይወት’ ይህን አውድ በቀጥታ ይገልጣል፤ የψυχή ሰፊ ፍቺ ግን ‘ነፍስ’ በሚለው አማራጭ ማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ቀጥተኛ አማርኛ ተጠቅሟል። አጭሩ ትይዩ አወቃቀርና ‘ማግኘት/ማጣት’ ተቃርኖ የግሪኩን ተረታዊ ኃይል ይጠብቃሉ። የግሪኩ καί በሁለተኛው ሐረግ ‘-ም’ ተብሎ ተያይዟል።
