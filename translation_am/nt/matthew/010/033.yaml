id: MAT.10.33
reference: Matthew 10:33
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὅστις ⸂δ’ ἂν⸃ ἀρνήσηταί με ἔμπροσθεν τῶν ἀνθρώπων, ἀρνήσομαι ⸂κἀγὼ αὐτὸν⸃ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/033.yaml
  text: But whoever denies me before men[b][a], I also will deny him before my Father who is in heaven.
translation:
  language: am
  text: ነገር ግን በሰዎች ፊት የሚክደኝን ሁሉ፣ እኔም በሰማያት ባለው በአባቴ ፊት እክደዋለሁ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅστις δ’ ἂν
  choice: ነገር ግን … የሚ…ን ሁሉ
  rationale: δέ ከቀደመው ቁጥር ጋር ያለውን ንጽጽር “ነገር ግን” በማለት ያሳያል፤ ὅστις ከἄν ጋር ያለው አጠቃላይ ሁኔታዊ ኃይል በተፈጥሯዊው “የሚ…ን ሁሉ” አወቃቀር ተጠብቋል።
- source_word: ἀρνήσηταί με
  choice: የሚክደኝን
  rationale: “ካደ” በሕዝብ ፊት ኢየሱስን አለማወቅ ወይም የእርሱ መሆንን አለመቀበል የሚለውን የἀρνέομαι መሠረታዊ ትርጉም በቀጥታ ያስተላልፋል።
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: በሰዎች ፊት
  rationale: ἔμπροσθεν የመገኘትንና የሕዝብ ፊት የሚደረግ ድርጊትን ያመለክታል። ἀνθρώπων እዚህ አጠቃላይ የሰው ልጆች ማመልከቻ ስለሆነ “ሰዎች” ተፈጥሯዊና ትክክለኛ ነው።
- source_word: ἀρνήσομαι κἀγὼ αὐτόν
  choice: እኔም … እክደዋለሁ
  rationale: κἀγώ ያለውን አጸፋዊ አጽንዖት “እኔም” ያሳያል፤ ለሁለቱም የἀρνέομαι አጠቃቀሞች “ካደ” መጠቀሙ የንግግሩን ትይዩነት ይጠብቃል።
- source_word: ἔμπροσθεν τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: በሰማያት ባለው በአባቴ ፊት
  rationale: “አባቴ” የኢየሱስን የዝምድና አጠራር ያለ ማብራሪያ ይጠብቃል። የግሪኩ οὐρανοῖς ብዙ ቁጥር በተፈጥሯዊውና በተለመደው የአማርኛ መጽሐፍ ቅዱሳዊ አገላለጽ “ሰማያት” ተጠብቋል።
theological_decisions:
- issue: የመካድ አጸፋዊ ትይዩነት
  choice: የሚክደኝን … እኔም … እክደዋለሁ
  alternative: የሚክደኝን … እኔም … አልቀበለውም
  rationale: በሁለቱም ስፍራ አንድ ግስ መጠቀም የግሪኩን ግልጽና ከባድ አጸፋዊ ንጽጽር ይጠብቃል፤ የመካዱን ሥነ መለኮታዊ ውጤት ከጽሑፉ በላይ አይተረጉምም።
- issue: ἀνθρώπων የሚያመለክተው አጠቃላይ የሰው ወገን
  choice: በሰዎች ፊት
  alternative: በወንዶች ፊት
  rationale: ἀνθρώπων በዚህ አውድ ወንዶችን ብቻ ሳይሆን ሰዎችን በአጠቃላይ ያመለክታል። “ሰዎች” ይህን ኃይል በዘመናዊ አማርኛ ያለ ማዛባት ያስተላልፋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለመደበኛ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “በሰማያት ባለው በአባቴ ፊት” የግሪኩን ብዙ ቁጥርና የዘመድ አንቀጽ ይጠብቃል፤ የግስ ድግግሞሹም የቁጥሩን አጸፋዊ ክብደት ያሰማል።
