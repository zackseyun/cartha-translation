    reason: lexical_alternative
  - marker: b
    text: ይህም በግል የተሰማው በይፋ እንዲነገር ማለት ነው። “በቤት ጣራዎች ላይ” የሚለው በጥንት ጊዜ ለሕዝብ ለማወጅ እንደ ከፍተኛና የሚታይ ቦታ ያገለግሉ የነበሩትን ጠፍጣፋ የቤት ጣራዎች ያመለክታል።
