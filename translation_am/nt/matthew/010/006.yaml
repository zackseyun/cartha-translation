  text: but go instead to the lost sheep of the house of Israel[a].
translation:
  language: am
  text: ነገር ግን ይልቁን የእስራኤል ቤት የጠፉት በጎች[a] ወደ ሂዱ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ይልቁን ከእስራኤል ቤት የጠፉት በጎች ወደ ሂዱ።»
    reason: lexical_alternative
lexical_decisions:
- source_word: πορεύεσθε
  choice: ሂዱ
  rationale: የሁለተኛ መደብ ብዙ ቁጥር ትእዛዝ ስለሆነ፣ በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ የሆነው «ሂዱ» ተመርጧል።
- source_word: δὲ μᾶλλον
  choice: ነገር ግን ይልቁን
  rationale: δὲ ከቀደመው ክልከላ ጋር ንፅፅርን፣ μᾶλλον ደግሞ ወደ ሌላ አቅጣጫ መመለስን ያሳያል፤ ይህ ጥምረት ሁለቱንም ኃይሎች ይጠብቃል።
- source_word: πρὸς
  choice: ወደ
  rationale: ከእንቅስቃሴ ግስ ጋር የመድረሻ አቅጣጫን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: τὰ πρόβατα
  choice: በጎች
  rationale: የግሪኩን ግልጽ የእረኝነት ምስል ሳያብራራ ወይም ወደ «መንጋ» ሳይለውጥ ይጠብቃል።
- source_word: τὰ ἀπολωλότα
  choice: ወደጠፉት
  rationale: ፍጹም አንቀጽ ያለፈ ድርጊት የፈጠረውን የአሁን ሁኔታ ይገልጻል፤ በበግ ምስሉ ውስጥ «የጠፉ» ተፈጥሯዊ ሲሆን የአካላዊ ጥፋትን ትርጉም አያስገድድም።
- source_word: οἴκου Ἰσραήλ
  choice: የእስራኤል ቤት
  rationale: የመጽሐፍ ቅዱስን የሕዝብና የቃል ኪዳን አጠራር ይጠብቃል፤ «የእስራኤል ሕዝብ» ብሎ በመተርጎም ምስሉን አያስወግድም።
theological_decisions:
- issue: እስራኤልን በበግ ምስል መግለጽ
  choice: «የእስራኤል ቤት የጠፉት በጎች» የሚለውን ምስል ማቆየት
  alternative: «የተሳሳቱት እስራኤላውያን» ብሎ መተርጎም
  rationale: በግሪኩ ውስጥ ምስሉ ግልጽ ነው፣ ከብሉይ ኪዳን የእረኛና የበግ ምሳሌዎችም ጋር ያገናኛል። ትርጉሙ ይህን ምስል ከመፍታት ይልቅ ለአንባቢው ያቆየዋል።
- issue: οἴκου Ἰσραήλ ከ«ጠፉት» ጋር ያለው ሰዋሰዋዊ ግንኙነት
  choice: በዋናው ጽሑፍ በጎቹ የእስራኤል ቤት እንደሆኑ የሚገልጸውን ንባብ መከተል
  alternative: በጎቹ «ከእስራኤል ቤት እንደጠፉ» መረዳት
  rationale: የግሪኩ የገናኝ ቅርጽ ሁለተኛውን ግንኙነትም ሊፈቅድ ስለሚችል በአማራጭ ማስታወሻ ተጠብቋል፤ ዋናው ንባብ ግን በአውዱ የተለመደውን የባለቤትነት/የማንነት ግንኙነት ይከተላል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «የእስራኤል ቤት» የሚለው የመጽሐፍ ቅዱስ አጠራር በዘመናዊ አገባብ ተጠብቋል፤ የግሪኩ ድግግሞሽ በአማርኛ «ወደ ... ወደ...» አወቃቀር ለግልጽነት ተንጸባርቋል።
