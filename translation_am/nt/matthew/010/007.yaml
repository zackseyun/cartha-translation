  text: And as you go[a], proclaim, saying[c][b], ‘The kingdom of heaven has drawn near.’
translation:
  language: am
  text: ስትሄዱም፣ “የሰማያት መንግሥት[a] ቀርባለች[b]” ብላችሁ አውጁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ማቴዎስ “የሰማያት መንግሥት” የሚለውን አገላለጽ አዘውትሮ ይጠቀማል፤ ሌሎቹ ወንጌላት በተመሳሳይ ስፍራ ብዙ ጊዜ “የእግዚአብሔር መንግሥት” ይላሉ።
    reason: cross_reference
  - marker: b
    text: ወይም “ቀርባ መጥታለች” ወይም “ቅርብ ናት።” የግሪኩ ፍጹም ግስ ቅርበቱ መድረሱንና ውጤቱ እንደቀጠለ ያጎላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευόμενοι δὲ
  choice: ስትሄዱም
  rationale: የአሁን ጊዜውን አጋዥ ግስ ከዋናው ትእዛዝ ጋር አብሮ የሚፈጸም ተግባር አድርጎ በተፈጥሯዊ አማርኛ ያቀርባል፤ -ም ደግሞ δὲ ያለውን ለስላሳ አያያዥነት ይጠብቃል።
- source_word: κηρύσσετε
  choice: አውጁ
  rationale: ግሱ መልእክትን በይፋና በሥልጣን ማሰማትን ያመለክታል፤ “አውጁ” ይህን ስሜት ያለ አላስፈላጊ ቤተ ክርስቲያናዊ ጠባብነት ያስተላልፋል።
- source_word: λέγοντες
  choice: ብላችሁ
  rationale: የሚታወጀውን ትክክለኛ ይዘት የሚያስገባውን አጋዥ ግስ በተፈጥሯዊ የአማርኛ የጥቅስ አወቃቀር ይጠብቃል።
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: የሰማያት መንግሥት
  rationale: የማቴዎስን ልዩ አገላለጽ ይጠብቃል፤ “መንግሥት” ንጉሣዊ አገዛዝንም ሆነ ግዛትን ሊያካትት ይችላል። የግሪኩ ብዙ ቁጥር οὐρανῶν “ሰማያት” ተብሎ ተጠብቋል።
- source_word: Ἤγγικεν
  choice: ቀርባለች
  rationale: የግሪኩ ፍጹም ጊዜ ወደ ቅርብ መምጣቱንና የዚያ ቅርበት ውጤት አሁንም መኖሩን ያሳያል። “ቀርባለች” በዘመናዊ አማርኛ ሁለቱንም ገጽታዎች በአጭርና በተፈጥሯዊ ሁኔታ ያቀርባል።
theological_decisions:
- issue: “የሰማያት መንግሥት” የሚለው አገላለጽ
  choice: የማቴዎስ ቃል እንዳለ “የሰማያት መንግሥት” ተብሎ ተጠብቋል።
  alternative: “የእግዚአብሔር መንግሥት” ወይም “የሰማይ አገዛዝ”
  rationale: ከሌሎች ወንጌላት አገላለጽ ጋር ማስማማት ወይም ትርጉሙን ወደ “አገዛዝ” ብቻ ማጥበብ በጽሑፉ ያለውን ስፋትና የማቴዎስን ልዩ ቃል ያጠፋል።
- issue: የἬγγικεν የጊዜና የገጽታ ኃይል
  choice: ቀርባለች
  alternative: “ቅርብ ናት” ወይም “ወደ ቅርብ መጥታለች”
  rationale: ይህ ምርጫ ቅርበቱ መድረሱንና አሁንም ተፈጻሚ መሆኑን ይጠብቃል፤ ስለ መንግሥቱ የበለጠ ሥነ መለኮታዊ ድምዳሜ ግን አይጨምርም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። “ብላችሁ አውጁ” የግሪኩን λέγοντες እና κηρύσσετε ሳይደባልቅ በተፈጥሯዊ አማርኛ ያቀርባል።
