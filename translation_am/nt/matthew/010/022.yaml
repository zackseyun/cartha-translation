review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the future passive sense of μισούμενοι, the comprehensive personal agency of ὑπὸ πάντων, endurance εἰς τέλος, and the appropriately broad sense of σωθήσεται. However, the enclitic ም in «በስሜም ምክንያት» adds an unwarranted sense of ‘also/too’; the Greek says simply ‘because of my name.’
  naturalness: The wording is generally clear modern standard Amharic. Removing the unnecessary ም also makes the first clause more idiomatic. The resumptive «እርሱ» is possible but somewhat marked after the relative clause; «የሚጸናው ግን ይድናል» is natural while retaining the contrast and the focused subject.
  terminology: «ስም» faithfully retains the biblical breadth of ὄνομα, and «ይድናል» properly preserves the contextual range of σωθήσεται without deciding between physical rescue and final salvation. «ጽናት» is suitable terminology for ὑπομένω in this persecution context.
  issues:
  - severity: medium
    issue: Unwarranted additive enclitic in «በስሜም ምክንያት».
    rationale: The ም normally contributes ‘also/too’ or an emphatic connective force. No corresponding additive element occurs in διὰ τὸ ὄνομά μου. «በስሜ ምክንያት» directly expresses the Greek causal phrase.
  - severity: low
    issue: The explicit resumptive «እርሱ» is slightly stiff in this relative-clause construction.
    rationale: Although it can reflect the emphasis of οὗτος, standard Amharic more naturally expresses the focused subject with the definite relative form «የሚጸናው». This does not impose additional theological interpretation.
  revised_text: በስሜ ምክንያት በሁሉም ዘንድ የተጠላችሁ ትሆናላችሁ።[a] ነገር ግን እስከ መጨረሻ የሚጸናው ይድናል።[b][c]
