  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου· ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/022.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: am
  text: በስሜ ምክንያት በሁሉም ዘንድ የተጠላችሁ ትሆናላችሁ።[a] ነገር ግን እስከ መጨረሻ የሚጸናው ይድናል።[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ «ስለ ስሜ»።
    reason: lexical_alternative
  - marker: b
    text: «የሚጸናው» የሚለው «በጽናት የሚቀጥለው» ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: c
    text: «ይድናል» የሚለው እንደ ዐውዱ «ይታደጋል» ወይም «ነፃ ይወጣል» ተብሎም ሊገባ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: μισούμενοι ὑπὸ πάντων
  choice: በሁሉም ዘንድ የተጠላችሁ ትሆናላችሁ
  rationale: የግሪኩ የወደፊት ጊዜ አገላለጽ የሚቀጥል ሁኔታን ያሳያል፤ ὑπὸ πάντων ደግሞ ጥላቻውን የሚያደርሱትን ሰዎች በአጠቃላይ ይጠቁማል።
- source_word: διὰ τὸ ὄνομά μου
  choice: በስሜም ምክንያት
  rationale: διά ከተሳቢ ጋር ምክንያትን ያመለክታል፤ ‘ስሜ’ የኢየሱስን ማንነትና ከእርሱ ጋር ያለን ወገንተኝነት በሰፊው እንዲይዝ ተጠብቋል።
- source_word: ὁ δὲ ὑπομείνας εἰς τέλος
  choice: ነገር ግን እስከ መጨረሻ የሚጸና
  rationale: ὑπομένω በስደት አውድ መቋቋምንና ጸንቶ መቆየትን ያመለክታል፤ εἰς τέλος ደግሞ እስከ መጨረሻው ነጥብ ድረስ የሚደርስ ጽናትን ይገልጣል።
- source_word: οὗτος σωθήσεται
  choice: እርሱ ይድናል
  rationale: ‘እርሱ’ የοὗτοςን አጽንዖት በተፈጥሯዊ አማርኛ ይጠብቃል፤ ‘ይድናል’ ደግሞ መዳን፣ መታደግ ወይም ነፃ መውጣትን ሊያካትት የሚችለውን የσωθήσεται ስፋት ይይዛል።
theological_decisions:
- issue: የመጨረሻ መዳን ከጽናት ጋር ያለው ግንኙነት
  choice: ‘ይድናል’ የሚለውን ሰፊ አገላለጽ መጠበቅ
  alternative: ከሥጋዊ አደጋ ይታደጋል፤ ወይም የመጨረሻውን ዘመን መዳን ያገኛል
  rationale: ጥቅሱ ጽናትን ከመዳን ጋር ያገናኛል፤ ሆኖም መዳኑ ጊዜያዊ መታደግ ነው ወይስ የመጨረሻ ዘመን መዳን የሚለውን በትርጉሙ ላይ በግድ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የግሪኩን οὗτος አጽንዖት ‘እርሱ’ በማለት በተፈጥሯዊ ሁኔታ ተጠብቋል።
