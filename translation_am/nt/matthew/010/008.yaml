  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἀσθενοῦντας θεραπεύετε, ⸂νεκροὺς ἐγείρετε⸃, λεπροὺς καθαρίζετε, δαιμόνια ἐκβάλλετε· δωρεὰν ἐλάβετε, δωρεὰν δότε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/008.yaml
  text: Heal the sick[a], raise the dead, cleanse lepers, cast out demons. Freely you received; freely give.
translation:
  language: am
  text: የታመሙትን ፈውሱ፣ ሙታንን አስነሱ፣ ለምጻሞችን[a] አንጹ፣ አጋንንትን አስወጡ። በነጻ ተቀበላችሁ፤ በነጻ ስጡ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከባድ የቆዳ በሽታ ያለባቸውን።” በባሕላዊ መንገድ “ለምጻሞች” ተብሎ የሚተረጎመው ቃል፣ በመጽሐፍ ቅዱሳዊ አጠቃቀሙ ከዘመናዊው የሥጋ ደዌ በሽታ ብቻ ይልቅ ሰፋ ያሉ ከባድ የቆዳ ሕመሞችን ሊያመለክት ይችላል።
    reason: cultural_note
lexical_decisions:
- source_word: ἀσθενοῦντας
  choice: የታመሙትን
  rationale: በዚህ የፈውስ አውድ የታመሙ ሰዎችን ያመለክታል፤ ተፈጥሯዊና ግልጽ የአማርኛ አገላለጽ ነው።
- source_word: θεραπεύετε
  choice: ፈውሱ
  rationale: በተአምራዊ አገልግሎት አውድ ያለውን ‘ማዳን/መፈወስ’ ትርጉም በቀጥታ ያስተላልፋል።
- source_word: νεκροὺς ἐγείρετε
  choice: ሙታንን አስነሱ
  rationale: ከሞት ማስነሳትን እንጂ ከእንቅልፍ መቀስቀስን እንደማያመለክት በግልጽ ይገልጣል።
- source_word: λεπροὺς
  choice: ለምጻሞችን
  rationale: በመጽሐፍ ቅዱሳዊ አጠቃቀም የታወቀውን ቃል ይጠብቃል፤ ከዘመናዊው የሥጋ ደዌ ፍቺ የሰፋ ሊሆን እንደሚችል በማስታወሻ ተገልጿል።
- source_word: καθαρίζετε
  choice: አንጹ
  rationale: አካላዊ መፈወስንና ሥርዓታዊ ንጽሕናን የሚያካትተውን የግሪኩን ሰፊ ስሜት ይጠብቃል።
- source_word: δαιμόνια ἐκβάλλετε
  choice: አጋንንትን አስወጡ
  rationale: አጋንንትን በኃይል ማስወጣትን በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: δωρεὰν
  choice: በነጻ
  rationale: ያለ ክፍያ ወይም እንደ ስጦታ የሚለውን ስሜት ይገልጣል፤ በሁለቱም ሐረጎች መደገሙም የግሪኩን ትይዩነት ይጠብቃል።
- source_word: ἐλάβετε
  choice: ተቀበላችሁ
  rationale: ደቀ መዛሙርቱ አስቀድመው የተቀበሉትን በቀላል ያለፈ ጊዜ ይገልጣል።
- source_word: δότε
  choice: ስጡ
  rationale: የብዙ ቁጥር ቀጥተኛ ትእዛዝን በአጭርና ግልጽ መንገድ ያስተላልፋል።
theological_decisions:
- issue: የተአምራዊ ትእዛዛቱ ወሰን
  choice: በዚህ የተልእኮ ንግግር ውስጥ ለአሥራ ሁለቱ የተሰጡ ቀጥተኛ ትእዛዛት ሆነው ተተርጉመዋል።
  alternative: ድርጊቶቹን እንደ ዘይቤ ወይም ለኋለኛው የቤተ ክርስቲያን ልማድ ብቻ እንደሚያመለክቱ መተርጎም።
  rationale: የግሪኩ ጽሑፍ በተጨባጭ የአገልግሎት ድርጊቶች ዝርዝር ውስጥ የብዙ ቁጥር ቀጥተኛ ትእዛዛትን ያቀርባል፤ ትርጉሙ አፈጻጸማቸውን ሳያሰፋም ሆነ ሳያጠብ የጽሑፉን ኃይል ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። አጭር የብዙ ቁጥር ትእዛዛትና “በነጻ ... በነጻ ...” የሚለው ምት ተጠብቀዋል። የማስታወሻው ምልክት ከሚያብራራው “ለምጻሞችን” ቃል ጋር ተያይዟል።
