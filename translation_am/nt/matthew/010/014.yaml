  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ስትወጡ’ እና ‘አራግፉ’ የብዙ ቁጥር አድራሻውን ይጠብቃሉ።
