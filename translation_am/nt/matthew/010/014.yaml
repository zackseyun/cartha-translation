  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν μὴ δέξηται ὑμᾶς μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν, ἐξερχόμενοι ⸀ἔξω τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης ἐκτινάξατε τὸν κονιορτὸν τῶν ποδῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/014.yaml
  text: And whoever does not receive you or listen to your words[a], as you go out of that house or that town[c][b], shake off the dust from your feet.
translation:
  language: am
  text: ማንም እናንተን የማይቀበል ወይም ቃላችሁን የማይሰማ ከሆነ፣ ከዚያ ቤት ወይም ከዚያች ከተማ ስትወጡ፣ ከእግራችሁ ላይ ትቢያውን አራግፉ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ከእግር ላይ ትቢያን ማራገፍ መልእክቱን የማይቀበሉ ሰዎችን መለየትንና በእነርሱ ላይ ፍርድ መኖሩን የሚያመለክት ምሳሌያዊ ድርጊት ነበር።
    reason: cultural_note
lexical_decisions:
- source_word: ὃς ἂν μὴ
  choice: …የማይ… ማንም ቢኖር
  rationale: የግሪኩን አጠቃላይና ሁኔታዊ ‘ማንም/ማንኛውም ቢሆን’ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δέξηται ὑμᾶς
  choice: እናንተን የማይቀበል
  rationale: ‘መቀበል’ መልእክተኞቹን በእንግድነት ማስተናገድንም ሆነ ተልእኳቸውን በበጎ መቀበልን ሊያካትት ይችላል።
- source_word: μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν
  choice: ወይም ቃላችሁን የማይሰማ
  rationale: ‘መስማት’ በአማርኛ ማዳመጥንና መልእክቱን ለመቀበል ጆሮ መስጠትን በተፈጥሮ ሊገልጽ ይችላል፤ ከግሪኩ በላይ ‘መታዘዝ’ የሚል ትርጉም አይጨምርም።
- source_word: ἐξερχόμενοι ἔξω
  choice: ስትወጡ
  rationale: ተያያዥ ድርጊቱን ‘ስትወጡ’ በሚል አጭርና ተፈጥሯዊ አገላለጽ ያቀርባል።
- source_word: τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης
  choice: ከዚያ ቤት ወይም ከዚያች ከተማ
  rationale: ጠቋሚውን በሁለቱም ስሞች ጋር ግልጽ ያደርጋል፤ ‘ከተማ’ የπόλιςን መኖሪያ ስፍራ ትርጉም ያለአስፈላጊ የመጠን ልዩነት ያስተላልፋል።
- source_word: ἐκτινάξατε τὸν κονιορτὸν τῶν ποδῶν ὑμῶν
  choice: ከእግራችሁ ላይ ትቢያውን አራግፉ
  rationale: ትእዛዙንና ተጨባጩን ምሳሌያዊ ድርጊት ሳይተረጉም በግልጽ ያቆያል።
theological_decisions:
- issue: መልእክቱን በሚ拒ት ላይ የሚደረገው ምሳሌያዊ ድርጊት
  choice: ‘ከእግራችሁ ላይ ትቢያውን አራግፉ’ የሚለውን ተጨባጭ ትእዛዝ በዋናው ጽሑፍ እንዳለ ማቆየት
  alternative: ከትይዩ ክፍሎች ‘በእነርሱ ላይ ምስክር እንዲሆን’ የሚል ማብራሪያ መጨመር ወይም ‘ለፍርድ ተዋቸው’ ብሎ መተርጎም
  rationale: ይህ ቁጥር ድርጊቱን ይዛል እንጂ ትርጉሙን በቀጥታ አይገልጽም፤ ስለዚህ ከትይዩ ክፍሎች ቃል ሳይጨመር የጽሑፉ ሥነ መለኮታዊ ውጥረት ተጠብቋል።
