id: MAT.10.16
reference: Matthew 10:16
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ἰδοὺ ἐγὼ ἀποστέλλω ὑμᾶς ὡς πρόβατα ἐν μέσῳ λύκων· γίνεσθε οὖν φρόνιμοι ὡς οἱ ὄφεις καὶ ἀκέραιοι ὡς αἱ περιστεραί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/016.yaml
  text: Look, I am sending you out as sheep in the midst of wolves; therefore be wise as the snakes and innocent as the doves.
translation:
  language: am
  text: “እነሆ፣ እኔ በተኩላዎች መካከል እንዳሉ በጎች እልካችኋለሁ፤ ስለዚህ እንደ እባቦች ብልሆች፣ እንደ ርግቦችም ንጹሓን ሁኑ።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: እነሆ
  rationale: የተናጋሪውን አጽንዖትና ትኩረት የመጥራት ተግባር በክብር ያለውና በዘመናዊ የመጽሐፍ ቅዱስ አማርኛ የሚታወቅ አገላለጽ ይጠብቃል።
- source_word: ἀποστέλλω
  choice: እልካችኋለሁ
  rationale: የአሁን ጊዜውን ንቁ ግስና ኢየሱስ ራሱ ላኪ መሆኑን በቀጥታ ያሳያል።
- source_word: ὡς πρόβατα ἐν μέσῳ λύκων
  choice: በተኩላዎች መካከል እንዳሉ በጎች
  rationale: ደቀ መዛሙርቱ ወደ አደገኛ አካባቢ መላካቸውን የሚያሳየውን ምስል በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: φρόνιμοι
  choice: ብልሆች
  rationale: በሁኔታው የሚጠየቀውን ጥንቃቄ ያለው ተግባራዊ ማስተዋል ይገልጻል፤ ተንኮልን አያመለክትም።
- source_word: ἀκέραιοι
  choice: ንጹሓን
  rationale: ቃሉ የማይቀላቀል፣ ያልተበላሸ ወይም ጉዳት የማያደርስ ባሕርይን ሊያመለክት ይችላል፤ ‘ንጹሓን’ ከእባቦች ብልሃት ጋር የተቃረነውን የርግብ ምስል በአጭሩ ያስተላልፋል።
theological_decisions:
- issue: ብልሃትና ንጽሕና በአንድነት መቅረባቸው
  choice: ሁለቱንም ትዕዛዞች በእኩል ክብደት ማቅረብ
  alternative: ‘ብልህ’ን እንደ ‘ተንኮለኛ’ ወይም ‘ንጹሕ’ን እንደ ‘የዋህ’ በማብራራት ውጥረቱን ማስወገድ
  rationale: የግሪክ ጽሑፉ በአደጋ ውስጥ ያለ ጥንቃቄንና የማይበድል ንጽሕናን አብሮ ይጠይቃል፤ አንዱን በሌላው አይሽርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና በቀላሉ የሚገባ የአማርኛ አገላለጽ። ‘እነሆ’ የጥንታዊ ንግግር ጣዕም ቢኖረውም የἸδοὺን አጽንዖት በግልጽ ይጠብቃል። የግሪኩ ግልጽ መስተዋድድ በአማርኛ ተፈጥሯዊ እንዲሆን ‘እንዳሉ’ ተጨምሯል።
