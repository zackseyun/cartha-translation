  terminology: “ደቀ መዛሙርቱ,” “ርኩሳን መናፍስት,” and “ሥልጣን” are suitable established biblical terms. The note’s alternative “ኃይል” responsibly explains the possible lexical rendering without displacing the more precise “ሥልጣን.”
