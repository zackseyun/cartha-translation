  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενος τοὺς δώδεκα μαθητὰς αὐτοῦ ἔδωκεν αὐτοῖς ἐξουσίαν πνευμάτων ἀκαθάρτων ὥστε ἐκβάλλειν αὐτὰ καὶ θεραπεύειν πᾶσαν νόσον καὶ πᾶσαν μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/001.yaml
  text: And calling his twelve disciples to himself[a], he gave them authority over unclean spirits[c][b], to cast them out and to heal every disease and every sickness.
translation:
  language: am
  text: አሥራ ሁለቱን ደቀ መዛሙርቱን ወደ እርሱ ጠርቶ፣ በርኩሳን መናፍስት ላይ ሥልጣን[a] ሰጣቸው፤ እነርሱንም እንዲያስወጡና በሽታን ሁሉ እና ደዌን ሁሉ እንዲፈውሱ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ኃይል”፤ የግሪኩ ἐξουσία ብዙ ጊዜ የተሰጠ ሥልጣንን ወይም የመፈጸም መብትን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: ወደ እርሱ ጠርቶ
  rationale: የግሱን ወደ ራስ መጥራት ትርጉምና የቀደመ ተግባርነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τοὺς δώδεκα μαθητὰς αὐτοῦ
  choice: አሥራ ሁለቱን ደቀ መዛሙርቱን
  rationale: μαθητής በወንጌላት አውድ ‘ደቀ መዝሙር’ ነው፤ αὐτοῦ ደግሞ በባለቤትነት ቅጥ ተገልጧል።
- source_word: ἔδωκεν
  choice: ሰጣቸው
  rationale: ቀጥተኛውን ‘ሰጠ’ ትርጉም ይጠብቃል፤ ተቀባዮቹም በተውላጠ ስም ቅጥ ተካትተዋል።
- source_word: ἐξουσίαν
  choice: ሥልጣን
  rationale: በአውዱ ጥሬ ኃይልን ብቻ ሳይሆን የተሰጠ የመፈጸም ሥልጣንን ያመለክታል።
- source_word: πνευμάτων ἀκαθάρτων
  choice: ርኩሳን መናፍስትን ... በእነርሱ ላይ
  rationale: ‘ርኩሳን መናፍስት’ የወንጌላትን መደበኛ አገላለጽ ይጠብቃል፤ የግሪኩ ጄኒቲቭ ከἐξουσία ጋር ያለው ግንኙነት ‘በእነርሱ ላይ’ ተብሎ ተገልጧል።
- source_word: ὥστε
  choice: እንዲያስወጡና ... እንዲፈውሱ
  rationale: ከግስ ማስደገፊያዎቹ ጋር የዓላማና የውጤት ንባብን ሳይገድብ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐκβάλλειν αὐτά
  choice: ርኩሳን መናፍስትን እንዲያስወጡ
  rationale: በአውዱ መናፍስቱን ከሰዎች ማስወጣትን በግልጽ ይገልጣል።
- source_word: θεραπεύειν
  choice: እንዲፈውሱ
  rationale: በሽታንና ደዌን የማዳን ትርጉሙን በወቅታዊና ክቡር አማርኛ ይገልጣል።
- source_word: πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: በሽታን ሁሉ እና ደዌን ሁሉ
  rationale: ሁለቱን ተዛማጅ የግሪክ ቃላት ሳያዋሕድ፣ የπᾶσαν ድግግሞሽንም ይጠብቃል።
theological_decisions:
- issue: የደቀ መዛሙርቱ ተልእኮ ባሕርይ
  choice: ኢየሱስ በርኩሳን መናፍስት ላይ የመግዛትና እነርሱን የማስወጣት ሥልጣን ሰጣቸው
  alternative: ‘ኃይል’ ብሎ መተርጎም
  rationale: ἐξουσία በዚህ አውድ ከኢየሱስ የተሰጠ ሥልጣንን ያጎላል፤ ጥሬ ኃይል ብቻ እንደሆነ አያስተረጉምም።
- issue: የὥστε ትርጉም—ዓላማ ወይስ ውጤት
  choice: በ‘እንዲ-’ ቅርጽ ዓላማንና የሚጠበቅ ውጤትን ክፍት ማድረግ
  alternative: እንደ ንጹሕ ዓላማ ብቻ ወይም እንደ ተፈጸመ ውጤት ብቻ መግለጽ
  rationale: ὥστε ከግስ ማስደገፊያዎቹ ጋር በዓላማና ውጤት መካከል ያለውን ውጥረት ሊይዝ ይችላል፤ የአማርኛው ‘እንዲ-’ ይህን ሳይዘጋ ያቀርባል።
translation_notes:
  register: ትርጉሙ ወቅታዊ፣ ክቡርና ለተራ አንባቢ ግልጽ ነው። ‘ደቀ መዛሙርቱን’ እና ‘ርኩሳን መናፍስት’ የታወቁ መጽሐፍ ቅዱሳዊ አገላለጾች ሆነው ሲጠበቁ፣ የአረፍተ ነገሩ አወቃቀር ተፈጥሯዊ አማርኛ እንዲሆን ተደርጓል።
