base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/020.yaml
  text: For it is not you who are speaking[b][a], but the Spirit of your Father speaking in you.
translation:
  language: am
  text: ምክንያቱም የሚናገሩት እናንተ አይደላችሁም፤ በእናንተ ውስጥ የሚናገረው የአባታችሁ መንፈስ ነው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በእናንተ በኩል የሚናገረው የአባታችሁ መንፈስ።” ግሪኩ “በእናንተ ውስጥ” ይላል፤ ይህም ንግግሩ በደቀ መዛሙርቱ በኩል እንደሚገለጥ ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: … ነውና
  rationale: γάρ ከቀደመው ማረጋገጫ ጋር ያለውን ምክንያታዊ ግንኙነት ያሳያል፤ በአማርኛ የዓረፍተ ነገሩ መጨረሻ ያለው ‘ነውና’ ይህን በተፈጥሯዊ መንገድ ይገልጣል።
- source_word: ὑμεῖς ἐστε οἱ λαλοῦντες
  choice: የምትናገሩት እናንተ ሳትሆኑ
  rationale: ግልጽ የሆነውን ὑμεῖς እና ተናጋሪዎቹን የሚለየውን አገባብ በ‘እናንተ’ ላይ አጽንዖት በማድረግ ያቆያል።
- source_word: ἀλλὰ
  choice: … ነው
  rationale: የ‘ሳትሆኑ … ነው’ ተቃርኖ በዘመናዊ አማርኛ የἀλλάን ጠንካራ ንጽጽር በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: τὸ πνεῦμα τοῦ πατρὸς ὑμῶν
  choice: የአባታችሁ መንፈስ
  rationale: የግሪኩን የባለቤትነት ግንኙነት በቀጥታ ይጠብቃል፤ በጥቅሱ የሌለውን ‘የሰማይ’ አይጨምርም።
- source_word: τὸ λαλοῦν
  choice: የሚናገረው
  rationale: ተውሳከ ግሱ መንፈስን እንደሚገልጽ ግልጽ ያደርጋል፤ የአሁን ጊዜውንም ቀጣይ ድርጊት ይጠብቃል።
- source_word: ἐν ὑμῖν
  choice: በእናንተ ውስጥ
  rationale: የἐνን ቀጥተኛ የቦታ ትርጉም ይጠብቃል፤ በአውዱ ‘በእናንተ በኩል’ የሚል የመሣሪያነት ፍቺ ሊኖረው ቢችልም ያንን በዋናው ጽሑፍ አይወስንም።
theological_decisions:
- issue: ἐν ὑμῖν ውስጣዊ መኖርን ወይስ በደቀ መዛሙርቱ በኩል መናገርን እንደሚያመለክት
  choice: በእናንተ ውስጥ
  alternative: በእናንተ በኩል
  rationale: ἐν በቀጥታ ‘ውስጥ’ ማለት ነው። አውዱ መንፈስ በደቀ መዛሙርቱ በኩል እንደሚናገር ቢያመለክትም፣ ዋናው ጽሑፍ በግሪኩ ያለውን ክፍት ፍቺ ይጠብቃል፤ ሌላው ፍቺ በግርጌ ማስታወሻ ተጠቅሷል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። ‘የምትናገሩት እናንተ ሳትሆኑ … ነው’ የሚለው አወቃቀር የግሪኩን አጽንዖትና ተቃርኖ በተፈጥሯዊ መንገድ ይጠብቃል።
