id: MAT.10.29
reference: Matthew 10:29
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὐχὶ δύο στρουθία ἀσσαρίου πωλεῖται; καὶ ἓν ἐξ αὐτῶν οὐ πεσεῖται ἐπὶ τὴν γῆν ἄνευ τοῦ πατρὸς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/029.yaml
  text: Are not two sparrows sold for an assarion? Yet not one of them will fall to the ground apart from your Father[a][b].
translation:
  language: am
  text: ሁለት ድንቢጦች በአንድ አሳርዮን[b] አይሸጡምን? ሆኖም ከእነርሱ አንዱም እንኳ ከአባታችሁ ውጭ[a] ወደ ምድር አይወድቅም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ያለ አባታችሁ።” ሐረጉ ያለ እርሱ እውቀት፣ እንክብካቤ ወይም ፈቃድ ማለትን ሊያመለክት ይችላል፤ ግሪኩ ግን ከእነዚህ የትኛው እንደሆነ አይገልጽም።
    reason: alternative_reading
  - marker: b
    text: አሳርዮን ዋጋው እጅግ ዝቅተኛ የሆነ ትንሽ የሮማ የመዳብ ሳንቲም ነበር።
    reason: cultural_note
lexical_decisions:
- source_word: στρουθία
  choice: ድንቢጦች
  rationale: በዚህ አውድ ቃሉ በተለምዶ ድንቢጦችን ያመለክታል፤ ከአጠቃላዩ ‘ትናንሽ ወፎች’ ይልቅ የተወሰነና ተፈጥሯዊ ነው።
- source_word: ἀσσαρίου
  choice: አንድ አሳርዮን
  rationale: የተወሰነውን ጥንታዊ የሮማ ሳንቲም ስም በመጠበቅ ታሪካዊ ልዩነቱን ያስቀራል፤ ዋጋው በማስታወሻ ተብራርቷል።
- source_word: πωλεῖται
  choice: አይሸጡምን?
  rationale: የግሪኩን የአሁን ጊዜ ተደራጊ አነጋገርና አዎንታዊ መልስ የሚጠብቀውን የንግግር ጥያቄ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἓν ἐξ αὐτῶν
  choice: ከእነርሱ አንዱም እንኳ
  rationale: ከቡድኑ አንዱን የሚለየውን አገላለጽ በተፈጥሯዊ አማርኛ ያቀርባል፤ ‘እንኳ’ የአጽንዖቱን ኃይል ያሳያል።
- source_word: πεσεῖται ἐπὶ τὴν γῆν
  choice: ወደ ምድር አይወድቅም
  rationale: የእንቅስቃሴውን አቅጣጫ ጠብቆ የግሪኩን የወደፊት ትርጉም በአማርኛ አሉታዊ የአሁን/ወደፊት አገላለጽ በተፈጥሯዊነት ያቀርባል።
- source_word: ἄνευ τοῦ πατρὸς ὑμῶν
  choice: ከአባታችሁ ውጭ
  rationale: የአብን እውቀት፣ ፈቃድ፣ እንክብካቤ ወይም ተሳትፎ አንዱን ብቻ ሳይወስን የግሪኩን ሰፊ አሻሚነት ይጠብቃል።
- source_word: καὶ
  choice: ሆኖም
  rationale: የድንቢጦቹ ዝቅተኛ ዋጋ ቢኖርም አንዱም ከአብ ውጭ እንደማይወድቅ የሚያሳየውን ተቃርኖ በግልጽ ያቀርባል።
theological_decisions:
- issue: ‘ከአባታችሁ ውጭ’ የሚለው ሐረግና መለኮታዊ ጥበቃ
  choice: ከአባታችሁ ውጭ
  alternative: አባታችሁ ሳያውቅ / ያለ አባታችሁ ፈቃድ
  rationale: ጥቅሱ የአብን ጥበቃዊ ግንኙነት ያረጋግጣል፤ ሆኖም ግሪኩ ይህ ግንኙነት እውቀት፣ ፈቃድ፣ እንክብካቤ ወይም ሌላ መሆኑን አይወስንም። ስለዚህ ዋናው ጽሑፍ አሻሚነቱን ጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የጥያቄው አጽንዖትና የመለኮታዊ ጥበቃ ሐረግ አሻሚነት ተጠብቀዋል።
