id: MAT.10.40
reference: Matthew 10:40
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ὁ δεχόμενος ὑμᾶς ἐμὲ δέχεται, καὶ ὁ ἐμὲ δεχόμενος δέχεται τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/040.yaml
  text: The one who receives you receives me[a], and the one who receives me receives the one who sent me.
translation:
  language: am
  text: እናንተን የሚቀበል እኔን ይቀበላል፤[a] እኔንም የሚቀበል የላከኝን ይቀበላል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ያስተናግዳል»፤ የግሪኩ ግስ በተለይ መልእክተኛን በመቀበል ዐውድ መቀበልን፣ ተቀባይነት መስጠትን ወይም ማስተናገድን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ δεχόμενος
  choice: የሚቀበል
  rationale: በመስተዋድድ የተገለጸውን የአሁን ጊዜ ተሳቢ አጠቃላይ ሰውን በሚያመለክት ተፈጥሯዊ የአማርኛ አነጋገር ይገልጻል።
- source_word: δέχομαι / δέχεται
  choice: ይቀበላል
  rationale: ግሱ የመቀበል፣ የማስተናገድ ወይም ተቀባይነት የመስጠት ሐሳብ ሊኖረው ይችላል። «ይቀበላል» ሰፊውን ትርጉምና በሐረጉ ውስጥ ያለውን ሆን ተብሎ የተደጋገመ ግስ ይጠብቃል።
- source_word: ὑμᾶς
  choice: እናንተን
  rationale: የሁለተኛ መደብ ብዙ ቁጥር ተሳቢ መሆኑን በግልጽ ያሳያል፤ በዐውዱ የኢየሱስን ደቀ መዛሙርት ያመለክታል።
- source_word: ἐμέ
  choice: እኔን
  rationale: ኢየሱስን የሚያመለክተውን የመጀመሪያ መደብ ነጠላ ቁጥር ተሳቢ በቀጥታ ያስተላልፋል።
- source_word: τὸν ἀποστείλαντά με
  choice: የላከኝን
  rationale: መስተዋድድ ያለውን ያለፈ ጊዜ ተሳቢ በተፈጥሯዊና አጭር የአማርኛ አገላለጽ ይተረጉማል፤ ላኪውን ጽሑፉ ከገለጸው በላይ አይሰይምም።
theological_decisions:
- issue: በኢየሱስ ንግግር ውስጥ የላኪው ማንነት
  choice: «የላከኝን» ብሎ በጽሑፉ የተገለጸውን ብቻ መተርጎም
  alternative: «የላከኝን አብ» ብሎ መግለጽ
  rationale: ዐውዱና የማቴዎስ ሥነ መለኮታዊ አቀራረብ ላኪው አብ መሆኑን በጽኑ ቢያመለክቱም፣ የግሪክ ጽሑፉ «የላከኝን» ብቻ ይላል። ትርጉሙ ይህን ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ይቀበላል» የሚለው ድግግሞሽ በሐረጉ ውስጥ ያለውን የውክልና ሰንሰለት ለማስጠበቅ ተይዟል።
