  yaml_path: translation/nt/matthew/010/011.yaml
  text: Into whatever city or village you enter[a], find out who in it is worthy[b], and stay there until you leave.
translation:
  language: am
  text: 'ወደ ማንኛውም ከተማ ወይም መንደር ስትገቡ፣ በዚያ ብቁ የሆነው ማን እንደሆነ አጣሩ[a]፤ ከዚያም እስክትወጡ ድረስ በዚያው ቆዩ።[b]


    [a] ወይም፣ “ጠይቃችሁ እወቁ” ወይም “መርምሩ።”


    [b] “ብቁ” የሚለው ቃል እዚህ መልእክተኞቹን ለመቀበል ተስማሚ ወይም ፈቃደኛ የሆነን ሰው ሊያመለክት ይችላል፤ ሰውየው የእግዚአብሔርን ሞገስ በሥራው አግኝቷል ማለት ግን አይደለም።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ጠይቃችሁ እወቁ” ወይም “መርምሩ።”
    reason: lexical_alternative
  - marker: b
    text: “ብቁ” የሚለው ቃል እዚህ መልእክተኞቹን ለመቀበል ተስማሚ ወይም ፈቃደኛ የሆነን ሰው ሊያመለክት ይችላል፤ ሰውየው የእግዚአብሔርን ሞገስ በሥራው አግኝቷል ማለት ግን አይደለም።
    reason: lexical_alternative
