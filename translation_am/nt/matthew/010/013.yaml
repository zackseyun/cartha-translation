  text: ቤቱ[ሀ] ብቁ[ለ] ከሆነ፣ ሰላማችሁ በቤቱ ላይ ይምጣ፤ ብቁ ካልሆነ ግን፣ ሰላማችሁ ወደ እናንተ ይመለስ[ሐ]።
