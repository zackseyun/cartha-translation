  choice: የተገባ
  rationale: የብቁነትንና ተስማሚነትን ግምገማ ይጠብቃል፤ ቃሉን ‘ተቀባይ’ ብሎ በጠባብ ሁኔታ አይተረጉመውም።
- source_word: ἐλθάτω
  choice: ይምጣ
  rationale: የሦስተኛ መደብ ትእዛዛዊ ኃይሉን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: εἰρήνη
  choice: ሰላም
  rationale: መደበኛውን ቀጥተኛ አቻ ይጠቀማል፤ የደኅንነትና የበረከት ሰፊ ሴማዊ ይዘቱን ዐውዱ እንዲያሳይ ይተዋል።
- source_word: ἐπ’ αὐτήν
  choice: በእርሱ ላይ
  rationale: ሰላም በቤቱ ላይ የመምጣቱን አቅጣጫዊ ምስል ይጠብቃል፤ ‘እርሱ’ ወደ ቤቱ ይመለከታል።
- source_word: πρὸς ὑμᾶς
  choice: ወደ እናንተ
  rationale: የπρόςን አቅጣጫዊ ትርጉም በግልጽ ሁኔታ ይወክላል።
- source_word: ἐπιστραφήτω
  choice: ይመለስ
  rationale: ሰላሙ በዚያ ሳይቀር ወደ ደቀ መዛሙርቱ መመለሱን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: μὲν ... δὲ
  choice: ከሆነ ... ካልሆነ ግን
  rationale: የሁለቱን ሁኔታዎች ንጽጽር በዘመናዊና ለማንበብ ቀላል በሆነ አማርኛ ያቀርባል።
theological_decisions:
- issue: የ«ሰላማችሁ» ባሕርይ
  choice: የደቀ መዛሙርቱ ሰላም በቤቱ ላይ ሊመጣ ወይም ወደ እነርሱ ሊመለስ እንደሚችል የጽሑፉን ምስል በቀጥታ ማቆየት
  alternative: ‘የሰላም ሰላምታችሁ’ ወይም ‘የተናገራችሁት በረከት’ ብሎ መተርጎም
  rationale: ጽሑፉ ሰላምን ከሚስዮናዊ መልእክተኞቹ ጋር የተያያዘና ሊያርፍ ወይም ሊመለስ የሚችል አድርጎ ይገልጠዋል፤ ትርጉሙ ይህን ምስጢራዊ ውጥረት ሳያቃልል ይጠብቃል።
- issue: የ«የተገባ» የሥነ ምግባር ወሰን
  choice: ቃሉን እንደ ብቁነት ግምገማ ማቆየት
  alternative: ‘መልእክተኞቹን የሚቀበል’ ብሎ በዋናው ጽሑፍ ማብራራት
  rationale: ዐውዱ መልእክተኞቹንና ሰላማቸውን ለመቀበል ተስማሚ መሆንን ያመለክታል፤ ይሁን እንጂ ዋናው ጽሑፍ ትርጉሙን በ‘ተቀባይነት’ ብቻ እንዳይገድብ ‘የተገባ’ ተብሎ ተቀምጧል።
