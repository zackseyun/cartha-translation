    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκία
  choice: ቤት
  rationale: ቀጥተኛና ተፈጥሯዊ አማርኛ ነው፤ በዐውዱ በቤቱ የሚኖሩትንም ሊያካትት ቢችልም፣ ዋናውን የግሪክ ቃል ትርጉም ይጠብቃል።
