  text: «በምድር ላይ ሰላምን ለማምጣት እንደመጣሁ አታስቡ[a]፤ ሰላምን ለማምጣት አልመጣሁም፤ ሰይፍን ለማምጣት እንጂ[b]።»
  philosophy: optimal-equivalence
