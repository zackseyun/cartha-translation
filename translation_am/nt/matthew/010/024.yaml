  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ትይዩ አወቃቀር በሁለቱም ክፍሎች «ከ… በላይ አይደለም» በማለት ተጠብቋል።
