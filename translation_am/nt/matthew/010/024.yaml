  text: Οὐκ ἔστιν μαθητὴς ὑπὲρ τὸν διδάσκαλον οὐδὲ δοῦλος ὑπὲρ τὸν κύριον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/024.yaml
  text: A disciple is not above the teacher[b][a], nor a slave above his master.
translation:
  language: am
  text: ደቀ መዝሙር ከአስተማሪው በላይ አይደለም፤ ባሪያም[a] ከጌታው[b] በላይ አይደለም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ባሪያ» ተብሎ የተተረጎመው የግሪክ ቃል (δοῦλος) እንደ አውዱ «አገልጋይ» ተብሎም ሊተረጎም ይችላል።
    reason: alternative_reading
  - marker: b
    text: እዚህ «ጌታ» (κύριος) የሚለው በምሳሌው ውስጥ ያለውን ሰብዓዊ ባለቤት ወይም የበላይ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητὴς
  choice: ደቀ መዝሙር
  rationale: በወንጌሉ አውድ ያለውን ከመምህር የመማርና የመከተል ግንኙነት ያስጠብቃል፤ «ተማሪ» ከሚለው የትምህርት ቤት ትርጉም የሰፋ ነው።
- source_word: ὑπὲρ
  choice: በላይ
  rationale: ከተውሳከ ስም ጋር በዚህ አጠቃቀም የደረጃ ወይም የሥልጣን ብልጫን ያመለክታል።
- source_word: διδάσκαλον
  choice: አስተማሪ
  rationale: የቃሉን ቀጥተኛ ትርጉም በዘመናዊና ግልጽ አማርኛ ያቀርባል፤ ከሚከተለው κύριος ጋርም አያምታታም።
- source_word: δοῦλος
  choice: ባሪያ
  rationale: ከκύριος ጋር ያለው ንጽጽር የተገዥነትንና የባለቤትነትን ማኅበራዊ ሁኔታ ስለሚያጎላ፣ «ባሪያ» የንጽጽሩን ኃይል ከ«አገልጋይ» በተሻለ ያስጠብቃል።
- source_word: κύριον
  choice: ጌታ
  rationale: በአማርኛ «ጌታ» ሰብዓዊ ባለቤትን ወይም የበላይንም ሊያመለክት ይችላል፤ እዚህ ከባሪያ ጋር በተደረገው ማኅበራዊ ንጽጽር ያንን ትርጉም ይዟል።
- source_word: αὐτοῦ
  choice: ጌታው
  rationale: በባለቤትነት ቅጥያው ባሪያው ከራሱ ጌታ ጋር ያለውን ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οὐδὲ
  choice: ባሪያም … አይደለም
  rationale: የግሪኩን ሁለተኛ አሉታዊ ንጽጽር በአማርኛው «-ም» አያያዥና በተደገመው አሉታዊ ግስ በተፈጥሯዊ ሁኔታ ያቀርባል።
theological_decisions:
- issue: በሥነ ድኅነት ያልተወሰነ ምሳሌ ውስጥ δοῦλοςን መተርጎም
  choice: ባሪያ
  alternative: አገልጋይ
  rationale: ንግግሩ ደቀ መዝሙር/አስተማሪ እና ባሪያ/ጌታ የሚሉ የደረጃ ንጽጽሮችን ይጠቀማል። «ባሪያ» የታሰረውን የተገዥነት ግንኙነት ያስጠብቃል፤ ሌላው አማራጭ በማስታወሻ ተጠቅሷል።
- issue: κύριος በሰብዓዊ የቤት አስተዳደር አውድ መተርጎም
  choice: ጌታ
  alternative: ባለቤት / የበላይ
  rationale: እዚህ κύριος መለኮታዊ ማዕረግ ሳይሆን በባሪያና በጌታ ንጽጽር ውስጥ ያለ ሰብዓዊ የበላይ ነው። «ጌታ» የቃሉን ሰፊ የትርጉም ክልል ይጠብቃል፤ አውዱ በማስታወሻ ተብራርቷል።
