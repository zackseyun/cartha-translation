source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν ποτίσῃ ἕνα τῶν μικρῶν τούτων ποτήριον ψυχροῦ μόνον εἰς ὄνομα μαθητοῦ, ἀμὴν λέγω ὑμῖν, οὐ μὴ ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/042.yaml
  text: And whoever gives one of these little ones even a cup of cold water in the name of a disciple[a], truly I say to you[b], he will certainly not lose his reward.
translation:
  language: am
  text: ማንም ከእነዚህ ታናናሾች አንዱን ደቀ መዝሙር በመሆኑ አንድ ጽዋ ቀዝቃዛ ውሃ ብቻ ቢያጠጣው፣ እውነት እላችኋለሁ፣ ሽልማቱን ፈጽሞ አያጣም።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ታናናሾች” የሚለው በዚህ አውድ ከኢየሱስ ተከታዮች መካከል ዝቅ ተደርገው የሚታዩትን ሊያመለክት ይችላል፤ የግድ ሕፃናትን ብቻ አያመለክትም። “ደቀ መዝሙር በመሆኑ” የሚለው በቃል ቅርብ መልኩ “በደቀ መዝሙር ስም” ሊተረጎም ይችላል፤ ድርጊቱ የሚፈጸመው ተቀባዩ ደቀ መዝሙር በመሆኑ ምክንያት መሆኑን ያመለክታል።
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς ἂν
  choice: ማንም … የሚያጠጣ
  rationale: አንጻራዊው ተውላጠ ስም ከἄν ጋር ያለውን ክፍትና አጠቃላይ ሁኔታ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ποτίσῃ
  choice: የሚያጠጣ
  rationale: ግሡ ‘እንዲጠጣ መስጠት’ የሚለውን ቀጥተኛ ፍቺ በተፈጥሯዊና አጭር አማርኛ ይገልጣል።
- source_word: ἕνα τῶν μικρῶν τούτων
  choice: ከእነዚህ ታናናሾች አንዱን
  rationale: μικρός የሚያመለክተውን ዝቅተኝነት፣ አነስተኛ ደረጃ ወይም ተጋላጭነት ሳይገድብ የቅርጹን አሻሚነት ይጠብቃል።
- source_word: ποτήριον ψυχροῦ
  choice: አንድ ጽዋ ቀዝቃዛ ውሃ
  rationale: ከψυχροῦ ጋር የታሰበውን ‘ውሃ’ በግልጽ ያቀርባል፤ የስጦታውንም ቀላልነት ይጠብቃል።
- source_word: μόνον
  choice: ብቻ
  rationale: የሚሰጠው ነገር እጅግ ቀላልና አነስተኛ መሆኑን በቀጥታ ያሳያል።
- source_word: εἰς ὄνομα μαθητοῦ
  choice: ደቀ መዝሙር ስለሆነ
  rationale: ድርጊቱ የሚፈጸመው ተቀባዩ ደቀ መዝሙር በመሆኑ ምክንያት መሆኑን በዘመናዊና ግልጽ አማርኛ ያስተላልፋል።
- source_word: ἀμὴν λέγω ὑμῖν
  choice: እውነት እላችኋለሁ
  rationale: የኢየሱስን የተከበረና ሥልጣናዊ ማረጋገጫ በተለመደ መጽሐፍ ቅዱሳዊ አማርኛ ይገልጣል።
- source_word: οὐ μὴ ἀπολέσῃ
  choice: ፈጽሞ አያጣም
  rationale: ድርብ አሉታዊውን ጠንካራ ማረጋገጫ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: τὸν μισθὸν αὐτοῦ
  choice: ሽልማቱን
  rationale: በዚህ የደቀ መዝሙርነት አውድ μισθός የሚያመለክተውን ዋጋ ወይም ምንዳ በተረዳ ቃል ይገልጣል።
theological_decisions:
- issue: ‘ታናናሾች’ የሚያመለክታቸው
  choice: ቃሉን ‘ከእነዚህ ታናናሾች’ በማለት ሳይገደብ ማቆየት
  alternative: ሕፃናት ብቻ፤ አዲስ አማኞች ብቻ፤ ዝቅተኛ ደረጃ ያላቸው ደቀ መዛሙርት
  rationale: አውዱ የኢየሱስን ደቀ መዛሙርት መቀበልን ቢያመለክትም፣ ግሪኩ ቃሉን ወደ ሕፃናት ወይም ወደ አንድ የተወሰነ የአማኞች ክፍል አይገድብም።
- issue: εἰς ὄνομα μαθητοῦ የሚለው ሐረግ
  choice: ‘ደቀ መዝሙር ስለሆነ’ ተብሎ ምክንያታዊ ኃይሉን ማስተላለፍ
  alternative: ‘በደቀ መዝሙር ስም’
  rationale: ሐረጉ ድርጊቱ በተቀባዩ የደቀ መዝሙርነት ማንነት ምክንያት መፈጸሙን ያሳያል፤ ቀመራዊ ወይም ሥርዓታዊ ፍቺ አይጨመርበትም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መዝገብ ተጠቅሟል። ‘ጽዋ’ እና ‘ደቀ መዝሙር’ የተለመዱ መጽሐፍ ቅዱሳዊ ቃላት ሲሆኑ፣ የዓረፍተ ነገሩ አወቃቀር ግን ተፈጥሯዊ ዘመናዊ አማርኛ ነው።
