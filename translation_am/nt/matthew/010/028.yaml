  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ μὴ ⸀φοβεῖσθε ἀπὸ τῶν ἀποκτεννόντων τὸ σῶμα τὴν δὲ ψυχὴν μὴ δυναμένων ἀποκτεῖναι· ⸁φοβεῖσθε δὲ μᾶλλον τὸν δυνάμενον ⸀καὶ ψυχὴν ⸁καὶ σῶμα ἀπολέσαι ἐν γεέννῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/028.yaml
  text: And do not fear those who kill the body but are not able to kill the soul. Rather[a], fear the one who is able to destroy both soul and body in Gehenna.
translation:
  language: am
  text: ሥጋን የሚገድሉ ነገር ግን ነፍስን ሊገድሉ የማይችሉ ሰዎችን አትፍሩ። ይልቁንም ነፍስንና ሥጋን በጌሄና[a] ሊያጠፋ የሚችለውን ፍሩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “በገሃነም።” ግሪክ፦ “በጌሄና።” ይህ ስያሜ ከሂኖም ሸለቆ ስም የመጣ ሲሆን፣ ለመጨረሻ ፍርድ ስፍራ ይጠቀምበት ነበር።
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβεῖσθε
  choice: አትፍሩ / ፍሩ
  rationale: በሁለቱም ንፅፅራዊ ክፍሎች የግሪኩን ተመሳሳይ ግስ በተመሳሳይ የአማርኛ ሥር ያቀርባል፤ የማስጠንቀቂያውንም ኃይል ይጠብቃል።
- source_word: ἀπὸ τῶν ἀποκτεννόντων
  choice: የሚገድሉትን
  rationale: በመስተአምር የተጠቀሰውን አሁናዊ አሳታፊ ግስ እንደ አጠቃላይ የሰዎች ምድብ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: σῶμα
  choice: ሥጋ
  rationale: ለአካላዊው ሰውነት የተለመደና ቀጥተኛ መጽሐፍ ቅዱሳዊ አማርኛ ቃል ነው።
- source_word: ψυχήν
  choice: ነፍስ
  rationale: ከሥጋ ጋር በተደረገው ግልጽ ንፅፅር የሰውን ኢ-አካላዊ ገጽታ ያመለክታል፤ ‘ሕይወት’ ቢባል ንፅፅሩ ይደበዝዛል።
- source_word: μὴ δυναμένων ἀποκτεῖναι
  choice: ሊገድሉ የማይችሉትን
  rationale: የግሪኩን የአቅም ማጣት አገላለጽ በግልጽና በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: μᾶλλον
  choice: ይልቁንም
  rationale: ‘እነዚያን አትፍሩ፤ ይህን ግን ፍሩ’ የሚለውን ንፅፅርና እርማት ያሳያል።
- source_word: τὸν δυνάμενον
  choice: ሊያጠፋ የሚችለውን
  rationale: ግሪኩ ማንነቱን በስም ሳይገልጽ ያቀረበውን አንድ ወገን በተመሳሳይ ክፍትነት ይጠብቃል።
- source_word: ἀπολέσαι
  choice: ሊያጠፋ
  rationale: የወሳኝ ጥፋትና ፍርድ ክብደትን ይጠብቃል፤ የጥፋቱን ሥነ ሕልውናዊ ሁኔታ ግን ከጽሑፉ በላይ አይወስንም።
- source_word: ἐν γεέννῃ
  choice: በገሃነም
  rationale: ‘ገሃነም’ በአማርኛ የተለመደውን ከጌሄና የመጣ ስያሜ ይጠብቃል፤ ታሪካዊ መነሻው በማስታወሻ ተብራርቷል።
theological_decisions:
- issue: በገሃነም ነፍስንና ሥጋን ሊያጠፋ የሚችለው ማንነት
  choice: በዋናው ጽሑፍ ‘የሚችለውን’ ተብሎ ማንነቱ በስም አልተገለጸም።
  alternative: ‘እግዚአብሔርን’ ወይም ‘ሰይጣንን’ ብሎ በግልጽ መሰየም።
  rationale: ዐውደ ንባቡ የመጨረሻ የፍርድ ሥልጣን ያለውን እግዚአብሔርን በተፈጥሮ ቢያመለክትም፣ የግሪኩ ሐረግ ማንነቱን በስም አይጠቅስም። ትርጉሙም ይህን ክፍትነት ጠብቋል።
- issue: የγέεννα አተረጓጎም
  choice: ገሃነም
  alternative: የመጨረሻ ፍርድ ስፍራ ወይም ሲኦል
  rationale: ከግሪኩ ቃልና ከአይሁድ ታሪካዊ ዳራው ጋር ያለውን ግንኙነት ይጠብቃል፤ ሰፋ ያለው ትርጉም በማስታወሻ ተገልጿል።
