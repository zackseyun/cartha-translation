review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the authorities, cause, and the neutral orientation of the testimony. However, ትቀርባላችሁ (“you will appear/come before”) does not clearly retain the future passive force of ἀχθήσεσθε (“you will be brought/led”). The conjunction-like force of καὶ is also better represented without making “me” emphatic by በእኔም.
  naturalness: The proposed revision is natural, modern standard Amharic. በ… ፊት ትወሰዳላችሁ is a clear and idiomatic judicial-context expression.
  terminology: ገዥዎች, ነገሥታት, ምስክር, and አሕዛብ are suitable. The footnotes preserve the lexical alternative for τοῖς ἔθνεσιν and the contextual, but not grammatically compelled, adversative possibility for αὐτοῖς.
  issues:
  - severity: medium
    issue: The passive sense of ἀχθήσεσθε is not explicit in ትቀርባላችሁ.
    rationale: The Greek states that the disciples will be brought or led before rulers. ትቀርባላችሁ can describe their own appearance and can therefore weaken the stated passive agency. Replacing it with ትወሰዳላችሁ retains the source’s future passive without adding force.
  - severity: low
    issue: በእኔም ምክንያት can give an unintended additive emphasis to “me.”
    rationale: The -ም attaches to እኔ rather than naturally rendering initial καὶ. Using እናም at the beginning and በእኔ ምክንያት preserves both the connective and the unmarked personal reference.
  revised_text: እናም በእኔ ምክንያት በገዥዎችና በነገሥታት ፊት ትወሰዳላችሁ፤ ይህም ለእነርሱ[b]ና ለአሕዛብ[a] ምስክር እንዲሆን ነው።
