id: MAT.10.18
reference: Matthew 10:18
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἐπὶ ἡγεμόνας δὲ καὶ βασιλεῖς ἀχθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς καὶ τοῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/018.yaml
  text: And you will be brought before governors and kings because of me[b][a], as a testimony to them and to the Gentiles.
translation:
  language: am
  text: እናም በእኔ ምክንያት በገዥዎችና በነገሥታት ፊት ትወሰዳላችሁ፤ ይህም ለእነርሱ[b]ና ለአሕዛብ[a] ምስክር እንዲሆን ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለብሔራት።”
    reason: lexical_alternative
  - marker: b
    text: በዚህ አውድ “በእነርሱ ላይ” ተብሎም ሊገባ ይችላል፤ የግሪኩ ሰጪ ቅጽ ግን ይህን በግልጽ አይወስንም።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ ἡγεμόνας ... καὶ βασιλεῖς
  choice: በገዥዎችና በነገሥታት ፊት
  rationale: ἐπί ከወንድ ተሳቢ ጋር ከἀχθήσεσθε በኋላ በሥልጣን ፊት መቅረብን ያመለክታል፤ ይህ አገላለጽ የፍርድ ወይም የምርመራ አውዱን በተፈጥሮ ያስተላልፋል።
- source_word: ἀχθήσεσθε
  choice: ትቀርባላችሁ
  rationale: የἄγω የወደፊት ተደራጊ ቅርጽ ነው። በባለሥልጣናት ፊት ስለመወሰድ በአማርኛ ተፈጥሯዊ የሆነውን የፍርድ አገላለጽ ይጠቀማል፤ በግሪኩ ያልተገለጸ የግፍ ኃይል አያክልም።
- source_word: ἕνεκεν ἐμοῦ
  choice: በእኔ ምክንያት
  rationale: ἕνεκεν ከባለቤት ቅጽ ጋር ምክንያትን ይገልጣል፤ ዘመናዊና ግልጽ አማርኛ ሲሆን ወደ ኢየሱስ የሚያመለክተውን ግላዊ ማጣቀሻ ይጠብቃል።
- source_word: εἰς μαρτύριον
  choice: ምስክር እንዲሆን
  rationale: εἰς እዚህ ዓላማን ወይም ውጤትን ያመለክታል። በባለሥልጣናት ፊት መቅረባቸው እንደ ምስክርነት እንደሚሠራ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: αὐτοῖς
  choice: ለእነርሱ
  rationale: ተውላጠ ስሙ በቀዳሚነት ወደ ገዥዎችና ነገሥታት ይመለሳል። የግሪኩ ሰጪ ቅጽ በራሱ ተቃዋሚ ትርጉም ስለማያስገድድ፣ ገለልተኛው አተረጓጎም አሻሚነቱን ይጠብቃል።
- source_word: τοῖς ἔθνεσιν
  choice: ለአሕዛብ
  rationale: ἔθνη በማቴዎስ ብዙ ጊዜ ከእስራኤል ውጭ ያሉ ሕዝቦችን ያመለክታል። «አሕዛብ» መደበኛውን የአዲስ ኪዳን አገባብ ይጠብቃል፤ «አሕዛብ/ብሔራት» የሚለው የቃሉ ስፋት በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: የμαρτύριον αὐτοῖς አቅጣጫ
  choice: ገለልተኛው «ለእነርሱ ምስክር»
  alternative: «በእነርሱ ላይ ምስክር»
  rationale: αὐτοῖς የተቃውሞን አቅጣጫ በግልጽ አይጠቁም። ስለዚህ ምስክሩ ለመስማት የቀረበ ወይም ባለመቀበላቸው በእነርሱ ላይ የሚሆን መሆኑን ጽሑፉ እንደተወው ሳይፈታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «በ…ፊት መቅረብ» የፍርድ አውዱን በተፈጥሮ ያስተላልፋል፤ «ለእነርሱ» የግሪኩን ትርጉማዊ አሻሚነት ይጠብቃል።
