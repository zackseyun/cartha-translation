  to: እናም በእኔ ምክንያት በገዥዎችና በነገሥታት ፊት ትወሰዳላችሁ፤ ይህም ለእነርሱ[b]ና ለአሕዛብ[a] ምስክር እንዲሆን ነው።
  rationale: The revision makes the source’s future passive verb explicit and avoids unintended emphasis on “me,” while retaining the judicial setting, the purpose/result nuance of εἰς μαρτύριον, and the deliberately neutral rendering of αὐτοῖς. Footnote anchors and their associated content remain intact.
