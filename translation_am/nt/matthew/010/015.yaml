  - severity: low
    issue: The current footnote a gives “ይበልጥ ቀላል ይሆናል” without stating what is easier, and footnote b redundantly explains the wording already used in the main text.
    rationale: The revised footnotes provide a clear lexical alternative for ἀνεκτότερον and preserve the πόλις alternative found in the audit trail.
