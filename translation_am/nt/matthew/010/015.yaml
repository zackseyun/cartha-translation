  text: ἀμὴν λέγω ὑμῖν, ἀνεκτότερον ἔσται γῇ Σοδόμων καὶ Γομόρρων ἐν ἡμέρᾳ κρίσεως ἢ τῇ πόλει ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/015.yaml
  text: Truly I say to you[c][b][a], it will be more bearable for the land of Sodom and Gomorrah on the day of judgment than for that town.
translation:
  language: am
  text: እውነት እላችኋለሁ፤ በፍርድ ቀን ለሰዶምና ለገሞራ ምድር ከዚያች ከተማ ይልቅ የበለጠ ሊታገሥ የሚችል ይሆናል።[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ይበልጥ ቀላል ይሆናል።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ከዚያች ከተማ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: እውነት እላችኋለሁ
  rationale: የንግግሩን አጽንዖትና ቀጥተኛ አቀራረብ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἀνεκτότερον
  choice: ይበልጥ የሚታገሥ
  rationale: በንጽጽሩ ውስጥ ‘ለመታገሥ የቀለለ’ ወይም ‘የበለጠ ሊታገሡት የሚችሉት’ የሚለውን ኃይል ይጠብቃል።
- source_word: γῇ Σοδόμων καὶ Γομόρρων
  choice: ለሰዶምና ለገሞራ ምድር
  rationale: የግሪኩን ‘የሰዶምና የገሞራ ምድር’ የሚለውን መልክ ይጠብቃል፤ የቦታ ስሞቹም በአማርኛ የተለመደውን አጻጻፍ ይከተላሉ።
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: በፍርድ ቀን
  rationale: የመለኮታዊ ፍርድን የወደፊት ቀን በአጭርና በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τῇ πόλει ἐκείνῃ
  choice: ከዚያች ከተማ
  rationale: πόλιςን በሰፊ የአማርኛ አጠቃቀም ‘ከተማ’ ብሎ ያቀርባል፤ ἐκείνῃ ደግሞ ቀደም ሲል የተጠቀሰችውን የተወሰነች ከተማ ያመለክታል።
theological_decisions:
- issue: የ‘ፍርድ ቀን’ ባሕርይ
  choice: ጽሑፉ እንደሚለው የወደፊት የፍርድ ቀን ተብሎ ቀርቧል።
  alternative: በአጠቃላይ የፍርድ ጊዜ ተብሎ ሊተረጎም ይችላል።
  rationale: ዐውዱ የመጨረሻውን መለኮታዊ ፍርድ ያመለክታል፤ ሆኖም ትርጉሙ ጽሑፉ ከሚናገረው በላይ የተወሰነ የእምነት ሥርዓት አያክልም።
- issue: ለሰዶምና ለገሞራ የሚሆነው ፍርድ ንጽጽር
  choice: ‘ይበልጥ የሚታገሥ’ በሚል የደረጃ ልዩነቱ እንዳለ ተጠብቋል።
  alternative: ፍርዱ ቀላል ይሆናል ብሎ በግልጽ መተርጎም።
  rationale: ግሪኩ የንጽጽር ደረጃን ይገልጣል እንጂ የፍርዱን ትክክለኛ ባሕርይ አይዘረዝርም፤ ስለዚህ ያለው የሥነ መለኮት ውጥረት ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የንጽጽር አወቃቀር ተጠብቆ የአማርኛው የቃላት ቅደም ተከተል ተፈጥሯዊ እንዲሆን ተደርጓል።
