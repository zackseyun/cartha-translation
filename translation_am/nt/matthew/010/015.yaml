  verdict: revise
  source_fidelity: The comparative force, the future judgment setting, and the reference to the land of Sodom and Gomorrah are retained. However, “ይበልጥ የሚታገሥ ይሆናል” is not a well-formed or clear Amharic rendering of the impersonal comparative ἀνεκτότερον ἔσται.
  naturalness: The opening and overall word order are natural modern Amharic. Recasting the comparative as “የበለጠ ሊታገሥ የሚችል” makes the predicate grammatical and clear without specifying details beyond the Greek.
  terminology: “እውነት እላችኋለሁ,” “በፍርድ ቀን,” and “ከዚያች ከተማ ይልቅ” are appropriate. “ሰዶምና ገሞራ” preserves the established Amharic biblical place names. A footnote for πόλις should retain the viable alternative “city.”
  issues:
