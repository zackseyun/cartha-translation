id: MAT.10.26
reference: Matthew 10:26
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Μὴ οὖν φοβηθῆτε αὐτούς· οὐδὲν γάρ ἐστιν κεκαλυμμένον ὃ οὐκ ἀποκαλυφθήσεται, καὶ κρυπτὸν ὃ οὐ γνωσθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/026.yaml
  text: Therefore, do not fear them, for nothing is covered that will not be revealed, and hidden that will not be made known.
translation:
  language: am
  text: ስለዚህ አትፍሯቸው፤ ምክንያቱም የተሸፈነ ሁሉ ይገለጣል፣ የተሰወረም ሁሉ ይታወቃል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ οὖν φοβηθῆτε αὐτούς
  choice: ስለዚህ አትፍሯቸው
  rationale: οὖν የምክንያታዊ ትስስሩን በ«ስለዚህ» ያሳያል፤ αὐτούς የሚያመለክተውን ብዙ ሰዎች በ«-አቸው» ይጠብቃል።
- source_word: κεκαλυμμένον
  choice: የተሸፈነ
  rationale: የግሱን መሠረታዊ የመሸፈን ምስላዊ ትርጉም ይጠብቃል፤ በቀጣዩ «ይገለጣል» ጋርም ተፈጥሯዊ ተቃርኖ ይፈጥራል።
- source_word: ἀποκαλυφθήσεται
  choice: ይገለጣል
  rationale: የወደፊት ጊዜ ተገብሮ አድራጊ ቅርጹን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: κρυπτὸν
  choice: የተሰወረ
  rationale: ከመሸፈን የተለየውን የመደበቅ ወይም የመሰወር ሐሳብ በአጭርና በተለመደ ቃል ይገልጣል።
- source_word: γνωσθήσεται
  choice: ይታወቃል
  rationale: የወደፊት ጊዜ ተገብሮ አድራጊውን ቅርጽና «እንዲታወቅ መደረግ» የሚለውን ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: የሚገልጠውና የሚያሳውቀው አካል
  choice: ተገብሮ አድራጊ አገላለጽን መጠበቅ
  alternative: «እግዚአብሔር ይገልጠዋል/ያሳውቀዋል» ብሎ በግልጽ መጨመር
  rationale: ግሪኩ ድርጊቱን የሚፈጽመውን አካል አይጠቅስም፤ ትርጉሙም ያንን ግልጽ ባለማድረግ የምንጩን ክፍትነት ይጠብቃል።
- issue: οὐδὲν ... ὃ οὐκ የሚለው አሉታዊ አወቃቀር
  choice: ትርጉሙን በአዎንታዊ ሁለንተናዊ አገላለጽ ማቅረብ
  alternative: «የማይገለጥ የተሸፈነ ነገር የለም» ብሎ የግሪኩን አሉታዊ ቅርጽ መከተል
  rationale: «የተሸፈነ ሁሉ ይገለጣል» ተመሳሳይ አጠቃላይ ትርጉምና አጽንዖት ይሰጣል፣ በዘመናዊ አማርኛም ይበልጥ ተፈጥሯዊ ነው።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለሕዝብ ንባብ ግልጽ የሆነ አማርኛ። የሁለቱ ንጽጽር ሐረጎች ሚዛናዊነት በ«ሁሉ ...፣ ...ም ሁሉ» ተጠብቋል።
