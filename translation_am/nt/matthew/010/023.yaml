id: MAT.10.23
reference: Matthew 10:23
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὅταν δὲ διώκωσιν ὑμᾶς ἐν τῇ πόλει ταύτῃ, φεύγετε εἰς τὴν ⸀ἑτέραν· ἀμὴν γὰρ λέγω ὑμῖν, οὐ μὴ τελέσητε τὰς πόλεις ⸀τοῦ Ἰσραὴλ ἕως ⸀ἂν ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/023.yaml
  text: But whenever they persecute you in this city[a], flee to the next one. For truly I say to you[c][b], you will certainly not finish going through the cities of Israel until the Son of Man comes.
translation:
  language: am
  text: ነገር ግን በዚህች ከተማ ሲያሳድዷችሁ፣ ወደ ሌላ ከተማ ሽሹ።[a] እውነት እላችኋለሁ፤ የሰው ልጅ እስኪመጣ ድረስ የእስራኤልን ከተሞች መዞር በፍጹም አትጨርሱም።[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወደ ሌላ ሽሹ።” የግሪኩ ቃል በቃል “ወደ ሌላዋ/ወደ ሌላው” ይላል፤ “ከተማ” የሚለው ከቀደመው ሐረግ የሚገባ ነው።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “የእስራኤልን ከተሞች በፍጹም አትጨርሱም።” “መዞር” የሚለው በተልእኮው ዐውድ የተገመተውን ከከተማ ወደ ከተማ መሄድ ግልጽ ያደርጋል።
    reason: lexical_alternative
  - marker: c
    text: “የሰው ልጅ እስኪመጣ ድረስ” የሚለው ሆን ተብሎ ክፍት ተትቷል። ይህ የኢየሱስን መክበር፣ በፍርድ መምጣቱን፣ ወይም የመጨረሻ ዳግም ምጽአቱን ያመለክታል የሚለውን በተመለከተ አስተርጓሚዎች ይለያያሉ።
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν
  choice: በሚያሳድዷችሁ ጊዜ
  rationale: ὅταν ያልተወሰነ ወይም ሊደጋገም የሚችል ጊዜን ያመለክታል፤ ይህ አገላለጽ ‘በሚያሳድዷችሁ ጊዜ’ በሚል ተፈጥሯዊ አማርኛ ያስተላልፈዋል።
- source_word: διώκωσιν
  choice: በሚያሳድዷችሁ
  rationale: በዚህ የተልእኮ ንግግር ዐውድ ግሱ ተራ መከተልን ሳይሆን ጠላትነት ያለበትን ስደት ያመለክታል።
- source_word: πόλει ταύτῃ
  choice: በዚህች ከተማ
  rationale: የቅርብ አመልካቹን ‘በዚህች’ በማለት የኢየሱስን ቀጥተኛ መመሪያ ይጠብቃል።
- source_word: φεύγετε
  choice: ሽሹ
  rationale: ትእዛዛዊው ግስ በስደት ጊዜ አስቸኳይ መሄድን ያሳያል፤ ‘ሽሹ’ አጭርና ኃይለኛ ነው።
- source_word: εἰς τὴν ἑτέραν
  choice: ወደ ሌላይቱ
  rationale: ‘ከተማ’ የሚለው ስም ከቀደመው ሐረግ የሚገባ ሲሆን፣ የግሪኩን ‘ወደ ሌላይቱ’ የሚል አጭር አወቃቀር ይጠብቃል።
- source_word: ἀμὴν
  choice: እውነት እላችኋለሁ
  rationale: በሲኖፕቲክ ወንጌላት የኢየሱስን ታላቅ ሥልጣን ያለው ማረጋገጫ የሚያስገባ ቀመር ስለሆነ፣ በዘመናዊ አማርኛ ግልጽ በሆነው ‘እውነት እላችኋለሁ’ ተተርጉሟል።
- source_word: οὐ μὴ τελέσητε
  choice: አዳርሳችሁ ከመጨረሳችሁ በፊት
  rationale: οὐ μή ጠንካራ አሉታዊ ማረጋገጫ ነው፤ τελέω ደግሞ መጨረስን ያመለክታል። የአማርኛው የ‘ከመ... በፊት’ አወቃቀር ከሚከተለው ‘ይመጣል’ ጋር ተፈጥሯዊ ሆኖ ድርጊቱ ፈጽሞ እንደማይጠናቀቅ ያሳያል።
- source_word: τὰς πόλεις τοῦ Ἰσραήλ
  choice: የእስራኤልን ከተሞች
  rationale: የግሪኩን የዝምድና አወቃቀር ቀጥታና ግልጽ በሆነ አማርኛ ይወክላል።
- source_word: ἕως ἂν ἔλθῃ
  choice: ከመጨረሳችሁ በፊት ... ይመጣል
  rationale: የወደፊት መድረሻ ነጥብን የሚያመለክተው ጊዜያዊ ግንኙነት በአማርኛ ተፈጥሯዊ የሆነ ተመጣጣኝ አወቃቀር ተላልፏል።
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: የሰው ልጅ
  rationale: የራስ መጠሪያውን ቃል በቃል ትርጉምና ከዳንኤል ጋር ያለውን ሥነ መለኮታዊ ድምፅ የሚጠብቅ የተለመደ አማርኛ አገላለጽ ነው።
theological_decisions:
- issue: በዚህ ዐውድ ‘የሰው ልጅ ይመጣል’ የሚለው ትርጉም
  choice: ‘የሰው ልጅ ይመጣል’ የሚለውን ያለ ትርጓሜያዊ ጭማሪ መጠበቅ
  alternative: የኢየሱስ በትንሣኤ መክበር፣ በኢየሩሳሌም ላይ የፍርድ መምጣት፣ ወይም የመጨረሻው ዳግም ምጽአት ብሎ መወሰን
  rationale: የግሪኩ ሐረግ በራሱ ከእነዚህ አተረጓጎሞች አንዱን አይወስንም፤ ስለዚህ ሥነ መለኮታዊው ውጥረትና ክፍትነት በዋናው ጽሑፍ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ አጽንዖት እና የመምጣቱ ትርጓሜያዊ ክፍትነት ተጠብቀዋል።
