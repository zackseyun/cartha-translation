  text: ὁ φιλῶν πατέρα ἢ μητέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος· καὶ ὁ φιλῶν υἱὸν ἢ θυγατέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/037.yaml
  text: The one who loves father or mother more than me is not worthy of me[a], and the one who loves son or daughter more than me is not worthy of me.
translation:
  language: am
  text: አባትን ወይም እናትን ከእኔ ይልቅ የሚወድ ለእኔ ብቁ አይደለም፤ ወንድ ልጅን ወይም ሴት ልጅን ከእኔ ይልቅ የሚወድም ለእኔ ብቁ አይደለም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ φιλῶν
  choice: የሚወድ
  rationale: መስተዋድዱንና የአሁን ጊዜ አሳታፊውን በአማርኛ ተፈጥሯዊ የሆነ አጠቃላይ ሰውን የሚያመለክት አንቀጽ ያደርገዋል።
- source_word: πατέρα ἢ μητέρα
  choice: አባትን ወይም እናትን
  rationale: በግሪክ ያልተገለጸውን የባለቤትነት ተውላጠ ስም ሳይጨምር የዝምድና ስሞቹን በቀጥታ ያቀርባል።
- source_word: ὑπὲρ ἐμέ
  choice: ከእኔ ይልቅ
  rationale: በዚህ ንጽጽራዊ አገባብ ὑπέρ ሌላውን ከኢየሱስ የበለጠ መውደድን ያመለክታል፤ ይህ በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: οὐκ ἔστιν μου ἄξιος
  choice: ለእኔ የተገባ አይደለም
  rationale: ἄξιος ከጄኒቲቭ μου ጋር ያለውን ግንኙነት በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ወደ ‘የእኔ ለመሆን’ ወይም ‘ለእኔ ብቁ’ ወደሚል ትርጓሜያዊ ማስፋት አይሄድም።
- source_word: καὶ
  choice: -ም
  rationale: የግሪኩን ቀላል ማያያዣ በአማርኛ ተፈጥሯዊ በሆነው አያያዥ ቅጥያ በማቅረብ ትይዩ አወቃቀሩን ይጠብቃል።
- source_word: υἱὸν ἢ θυγατέρα
  choice: ወንድ ልጅን ወይም ሴት ልጅን
  rationale: በአማርኛ የፆታ ልዩነቱን ግልጽ በማድረግ ‘ወንድ ልጅ’ እና ‘ሴት ልጅ’ የግሪኩን υἱός እና θυγάτηρ በትክክል ይለያሉ።
theological_decisions:
- issue: የኢየሱስ ጥያቄና ለቤተሰብ ያለ ፍቅር
  choice: ንጽጽሩ ኢየሱስን ከቅርብ የቤተሰብ ግንኙነቶች በላይ ማስቀደምን እንደሚጠይቅ በቀጥታ ተተርጉሟል።
  alternative: ‘እኔን ያህል የማይወድ’ ብሎ ማለስለስ፣ ወይም ቤተሰብን መጥላት እንደሚጠይቅ ትርጓሜ መጨመር።
  rationale: ግሪኩ የፍቅርን ንጽጽራዊ ቅድሚያና የተገቢነትን ፍርድ ያስቀምጣል። ትርጉሙ የደቀ መዝሙርነትን ጥብቅ ጥያቄ ሳያለሰልስ፣ የቤተሰብ ፍቅርን በራሱ ክፉ እንደሆነም አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ሁለት ትይዩ ክፍሎችና ጠንካራ ድግግሞሽ ተጠብቀዋል። ‘ከእኔ ይልቅ’ የሚለው ቀጥተኛ አገላለጽ የὑπὲρ ἐμέን ንጽጽራዊ ፍቺ በቂ ስለሚያሳይ የእግር ማስታወሻ አልተጨመረም።
