lexical_decisions:
- source_word: δὲ
  choice: በተለየ ቃል አልተተረጎመም
  rationale: እዚህ δέ ቀላል የንግግር ሽግግርን ያመለክታል፤ በአማርኛ የዓረፍተ ነገሩ አወቃቀር ይህን በተፈጥሮ ስለሚያሳይ፣ ጊዜን የሚጨምር ቃል አልገባም።
- source_word: δώδεκα ἀποστόλων
  choice: የአሥራ ሁለቱ ሐዋርያት
  rationale: «ሐዋርያት» በወንጌል አውድ ኢየሱስ የላካቸውንና በዚህ ስያሜ የሚታወቁትን ቡድን በተለመደና ትክክለኛ መንገድ ይገልጣል።
- source_word: τὰ ὀνόματά ἐστιν ταῦτα
  choice: ስሞች እነዚህ ናቸው
  rationale: የግሪኩን አመልካች አወቃቀር በተፈጥሯዊ ዘመናዊ አማርኛ ይጠብቃል።
- source_word: πρῶτος
  choice: የመጀመሪያው
  rationale: በዝርዝሩ ውስጥ የመጀመሪያነትን በቀጥታ ይገልጣል፤ ከዚህ በላይ የሥልጣን ደረጃ አያስገባም።
- source_word: ὁ λεγόμενος Πέτρος
  choice: ጴጥሮስ የተባለው
  rationale: ስምዖን ጴጥሮስ በሚለው ስም እንደሚጠራ በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὁ ἀδελφὸς αὐτοῦ
  choice: ወንድሙ
  rationale: ἀδελφός እዚህ የሥጋ ወንድምነትን ያመለክታል፤ በመጀመሪያው ስፍራ ተውላጠ ስሙ ስምዖንን፣ በሁለተኛው ያዕቆብን ይመለከታል።
- source_word: ὁ τοῦ Ζεβεδαίου
  choice: የዘብዴዎስ ልጅ
  rationale: የግሪኩ የዘር መለያ አገላለጽ ዘብዴዎስ አባቱ መሆኑን ያመለክታል፤ «ልጅ» በአማርኛ ግልጽና ፈሊጣዊ ነው።
theological_decisions:
- issue: πρῶτος ከስምዖን/ጴጥሮስ ጋር ያለው ትርጉም
  choice: በዋናው ጽሑፍ «የመጀመሪያው» ተብሎ የዝርዝሩን ቅደም ተከተል ያሳያል።
  alternative: ቃሉ በአሥራ ሁለቱ መካከል ታላቅነትን ወይም ቀዳሚነትንም ሊያመለክት ይችላል።
  rationale: ግሪኩ ቃል የቅደም ተከተል መጀመሪያነትን በቀጥታ ይገልጣል፤ የታላቅነት ፍንጭም ሊኖረው ስለሚችል ይህ አማራጭ በማስታወሻ ተጠብቋል፣ ነገር ግን የቡድን ሥልጣንን የሚመለከት የእምነት ድምዳሜ በዋናው ጽሑፍ አልተጨመረም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግል ስሞች በተለመደው የአማርኛ መጽሐፍ ቅዱስ አጻጻፍ ቀርበዋል፤ ስለ πρῶτος ያለው እውነተኛ የትርጉም ስፋት በማስታወሻ ተጠብቋል።
