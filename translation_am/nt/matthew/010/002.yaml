  yaml_path: translation/nt/matthew/010/002.yaml
  text: 'These are the names of the twelve apostles: first[a], Simon who is called Peter, and Andrew his brother; James the son of Zebedee, and John his brother,'
translation:
  language: am
  text: የአሥራ ሁለቱ ሐዋርያት ስሞች እነዚህ ናቸው፤ በመጀመሪያ[a]፣ ጴጥሮስ የሚባለው ስምዖን፣ ወንድሙም እንድርያስ፤ የዘብዴዎስ ልጅ ያዕቆብ፣ ወንድሙም ዮሐንስ፣
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በመጀመሪያ» የሚለው ቃል በዝርዝሩ ውስጥ መጀመሪያ መሆኑን ብቻ ሳይሆን፣ በአሥራ ሁለቱ መካከል ያለውን ቀዳሚነት ሊያመለክት ይችላል።
