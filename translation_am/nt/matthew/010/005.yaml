  alternative: አሕዛብና ሳምራውያን በዘላቂነት እንደተገለሉ የሚያስመስል ጠንካራ ወይም ማብራሪያዊ አተረጓጎም
  rationale: ጥቅሱ በዚህ ልዩ የመላክ አጋጣሚ የተሰጠውን ክልከላ ይዘግባል፤ ትርጉሙ የክልከላውን ኃይል ሳያዳክም ጥቅሱ የማይናገረውን ዘላቂ የሥነ መለኮት ድምዳሜ አያስገባም።
