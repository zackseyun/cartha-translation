    text: ወይም፣ “ወደ አሕዛብ መንገድ አትሂዱ።” የግሪኩ አገላለጽ ቃል በቃል “ወደ አሕዛብ መንገድ” የሚል ሲሆን፣ ወደ አሕዛብ ክልል በሚያመራ መንገድ መሄድን ሊያመለክት ይችላል።
