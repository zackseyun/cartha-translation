review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies the twelve, Jesus’ sending, and the two prohibitions. However, the first footnote offers a non-equivalent alternative by changing ‘go’ (ἀπέλθητε) to ‘enter,’ and its explanation overstates a debated directional implication. The Samaritan-town wording can be made clearer and more idiomatic while retaining the Greek genitive sense.
  naturalness: The wording ‘ወደ ሳምራውያንም ከተማ’ is understandable but is less natural and leaves the singular indefinite town relationship unclear. ‘ወደ አንዲት የሳምራውያን ከተማ’ is clear modern standard Amharic. ‘በአሕዛብ መንገድ አትሂዱ’ is a natural idiomatic rendering that retains the road/path expression.
  terminology: ‘አሕዛብ,’ ‘ሳምራውያን,’ and ‘ኢየሱስ’ are appropriate established biblical terms. The revision retains them and avoids the potentially misleading feminine-person form ‘ሳምራዊት’ for a town.
  issues:
  - severity: medium
    issue: Footnote a changes the verb in its proposed alternative.
    rationale: The main text has ‘አትሂዱ’ for μὴ ἀπέλθητε, but the footnote alternative says ‘አትግቡ’ (‘do not enter’). This introduces the sense of εἰσέλθητε from the second prohibition and is not a lexical alternative for the first clause.
  - severity: medium
    issue: Footnote a overstates the interpretation of εἰς ὁδὸν ἐθνῶν.
    rationale: The statement that the phrase cannot fail to indicate travel toward Gentile territory resolves an expression whose precise force is disputed. The note should describe the literal road/path language and present the territorial implication as possible rather than certain.
  - severity: low
    issue: The Samaritan-town phrase and footnote b need idiomatic clarification.
    rationale: ‘ወደ ሳምራውያንም ከተማ’ is awkward, while ‘ሳምራዊት ከተማ’ can naturally be understood as involving a Samaritan woman rather than a Samaritan town. A genitive construction is both clear and close to the Greek.
