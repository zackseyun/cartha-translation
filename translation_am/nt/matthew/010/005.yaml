- source_word: εἰς πόλιν Σαμαριτῶν
  choice: ወደ ሳምራውያንም ከተማ
  rationale: πόλιςን ‘ከተማ’ ብሎ እና የΣαμαριτῶνን የባለቤትነት አወቃቀር በቅርበት ይጠብቃል፤ ‘ወደ ሳምራዊት ከተማ’ የሚለው ተፈጥሯዊ አማራጭ በማስታወሻ ቀርቧል።
- source_word: μὴ εἰσέλθητε
