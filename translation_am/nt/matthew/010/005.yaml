    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτους τοὺς δώδεκα
  choice: እነዚህን አሥራ ሁለቱን
  rationale: በግሪክ ያለውን አመልካች ቃልና ቁጥር በቀጥታ ይጠብቃል፤ በጥቅሱ ውስጥ የሌለውን ‘ደቀ መዛሙርት’ አይጨምርም።
- source_word: ἀπέστειλεν
  choice: ላካቸው
  rationale: ለተልእኮ መላክን በተፈጥሯዊ አማርኛ ያሳያል፤ ‘ሾማቸው’ ወይም ‘አሰማራቸው’ የሚሉትን ተጨማሪ ትርጉሞች አያስገባም።
- source_word: παραγγείλας αὐτοῖς λέγων
  choice: እንዲህም ሲል አዘዛቸው
  rationale: παραγγέλλω ያለውን የትእዛዝ ኃይል ይጠብቃል፤ λέγων ደግሞ ቀጥተኛውን ንግግር በ‘እንዲህም ሲል’ ያስገባል።
- source_word: Εἰς ὁδὸν ἐθνῶν
  choice: ወደ አሕዛብ መንገድ
  rationale: ὁδός የሚለውን የመንገድ ምስል ይጠብቃል፤ የግሪኩ የባለቤትነት አገላለጽ ግን መንገዱ ወደ አሕዛብ ክልል እንደሚያመራ ወይም የእነርሱ መንገድ እንደሆነ ሊገባ ስለሚችል አሻሚነቱ በማስታወሻ ተጠብቋል።
- source_word: ἐθνῶν
  choice: አሕዛብ
  rationale: በዚህ የአይሁድ ተልእኮ አውድ አይሁድ ያልሆኑትን ሕዝቦች የሚያመለክት የተለመደ መጽሐፍ ቅዱሳዊ ቃል ነው።
- source_word: μὴ ἀπέλθητε
