id: MAT.10.25
reference: Matthew 10:25
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἀρκετὸν τῷ μαθητῇ ἵνα γένηται ὡς ὁ διδάσκαλος αὐτοῦ, καὶ ὁ δοῦλος ὡς ὁ κύριος αὐτοῦ. εἰ τὸν οἰκοδεσπότην Βεελζεβοὺλ ⸀ἐπεκάλεσαν, πόσῳ μᾶλλον τοὺς οἰκιακοὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/025.yaml
  text: It is enough for the disciple that he become like his teacher[a], and the slave like his master. If they called the master of the house Beelzebul, how much more those of his household.
translation:
  language: am
  text: ለደቀ መዝሙር እንደ መምህሩ መሆን፣ ለባሪያም እንደ ጌታው መሆን ይበቃል። የቤቱን ባለቤት “ብዔልዜቡል”[a] ብለው ከጠሩት፣ የቤተሰቡን አባላት ምንኛ ይልቅ ይጠሯቸዋል!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ብዔልዜቡብ” ተብሎም ይጻፋል፤ ይህ በትውፊታዊ አጠቃቀም የታወቀ ሌላ ቅርጽ ነው።
    reason: የስሙን በትውፊት የታወቀ ሌላ ቅርጽ ለማሳወቅ፣ ዋናው ጽሑፍ ግን የSBLGNTን Βεελζεβοὺλ እንዲከተል።
lexical_decisions:
- source_word: ἀρκετὸν
  choice: ይበቃል
  rationale: በግሪክ ያለውን የበቂነት ሐሳብ በተፈጥሯዊና ቀጥተኛ አማርኛ ያቀርባል።
- source_word: μαθητῇ
  choice: ለደቀ መዝሙሩ
  rationale: በወንጌሉ አውድ ያለውን የተከታይነትና የመማር ግንኙነት ይጠብቃል።
- source_word: ἵνα γένηται
  choice: መሆን
  rationale: ከ‘ይበቃል’ ጋር ተያይዞ የግሪኩን የውጤት/ዓላማ አወቃቀር በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: διδάσκαλος
  choice: መምህር
  rationale: ከ‘ደቀ መዝሙር’ ጋር ያለውን የማስተማር ግንኙነት በግልጽ ያሳያል።
- source_word: δοῦλος
  choice: ባሪያ
  rationale: ከκύριος ጋር ባለው የማዕረግና የሥልጣን ንጽጽር ውስጥ ያለውን የታሰረ ተገዥነት ከ‘አገልጋይ’ ይልቅ በትክክል ይጠብቃል።
- source_word: κύριος
  choice: ጌታ
  rationale: በዚህ የቤትና የባሪያ ምሳሌ ውስጥ የባሪያውን ባለሥልጣን ያመለክታል፤ አማርኛው ‘ጌታ’ ይህን ማኅበራዊ ትርጉም በተፈጥሮ ይይዛል።
- source_word: οἰκοδεσπότην
  choice: የቤቱን ጌታ
  rationale: ቤተሰቡን የሚመራውን ሰው የሚያመለክተውን የተዋሃደ ግሪክ ቃል በግልጽ ይተረጉማል።
- source_word: Βεελζεβοὺλ
  choice: ብዔልዜቡል
  rationale: የSBLGNTን የግሪክ ቅርጽ በግዕዝ ፊደል በቅርብ ይከተላል፤ የታወቀው ሌላ ቅርጽ በማስታወሻ ቀርቧል።
- source_word: ἐπεκάλεσαν
  choice: ብለው ከጠሩት
  rationale: በዚህ አውድ ግሱ አንድን ሰው በስም መጥራትን ወይም ስያሜ መስጠትን ያመለክታል።
- source_word: πόσῳ μᾶλλον
  choice: እንዴት አብልጠው
  rationale: ከታላቁ ወደ ታናሹ የሚደረገውን አጽንዖታዊ ንጽጽር በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: οἰκιακοὺς
  choice: የቤተሰቡን አባላት
  rationale: ቃሉ ባሮችን ብቻ ሳይሆን በቤቱ ያሉትን ሰዎች በስፋት ስለሚያመለክት ይህ አገላለጽ ሙሉ ስፋቱን ይጠብቃል።
theological_decisions:
- issue: κύριος በቤትና በባሪያ ምሳሌ ውስጥ ያለው ትርጉም
  choice: ጌታ
