  terminology: ‘ደቀ መዝሙር’፣ ‘መምህር’፣ ‘ባሪያ’ እና ‘ጌታ’ ተስማሚ ናቸው። οἰκοδεσπότηςን ‘የቤቱ ባለቤት’ ማለት ከκύριος ጋር ያለውን ልዩነት በግልጽ ይጠብቃል፤ οἰκιακοί ግን ‘የቤተሰቡ አባላት’ በሚለው ሰፊ ቃል በቂ ሆኖ ቀርቧል። Βεελζεβούλ የሚለው ‘ብዔልዜቡል’ እና የ‘ብዔልዜቡብ’ የአማራጭ ቅርጽ ማስታወሻ ተገቢ ናቸው።
