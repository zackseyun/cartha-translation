  rationale: የቅርብ አውዱ ከδοῦλος ጋር ያለ ማኅበራዊ የሥልጣን ግንኙነት ነው፤ ስለዚህ ቃሉን ቀጥተኛ መለኮታዊ ማዕረግ አድርጎ ሳይወስን ‘ጌታ’ ተመርጧል።
- issue: δοῦλος የሚያመለክተው ማኅበራዊ ደረጃ
  choice: ባሪያ
