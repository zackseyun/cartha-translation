- source_word: πατὴρ τέκνον
  choice: አባትም ልጁን
  rationale: τέκνον ከ‘ወንድ ልጅ’ የሰፋ ስለሆነ ‘ልጅ’ ተብሏል፤ የባለቤትነት ቅጥያው በአማርኛ ግንኙነቱን በተፈጥሮ ያሳያል።
- source_word: ἐπαναστήσονται
  choice: ይነሣሉ
