  text: ወንድምም ወንድሙን ለሞት አሳልፎ ይሰጣል[a]፤ አባትም ልጁን ለሞት አሳልፎ ይሰጣል። ልጆችም በወላጆቻቸው ላይ ይነሣሉ፤ ይገድሏቸዋል።
  philosophy: optimal-equivalence
