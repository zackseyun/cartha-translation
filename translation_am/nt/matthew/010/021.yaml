- source_word: ἀδελφὸς ... ἀδελφὸν
  choice: ወንድምም ወንድሙን
  rationale: ወንድ ጾታን የሚገልጠውን የቤተሰብ ቃልና ወካይ ነጠላውን ይጠብቃል።
- source_word: εἰς θάνατον
  choice: ለሞት
