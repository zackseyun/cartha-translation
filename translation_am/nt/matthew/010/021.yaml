- source_word: τέκνα
  choice: ልጆች
  rationale: ቃሉ ሁለቱንም ጾታዎች ያካትታል፤ ‘ልጆች’ ተፈጥሯዊና ትክክለኛ ነው።
- source_word: ἐπὶ γονεῖς
  choice: በወላጆቻቸው ላይ
  rationale: ἐπί በዚህ የጠላትነት አውድ ‘በ...ላይ/በ...ላይ ተነሥቶ’ የሚል ፍቺ አለው፤ የባለቤትነት ቅጥያው በአማርኛ ግንኙነቱን ግልጽ ያደርጋል።
- source_word: θανατώσουσιν
  choice: ይገድሏቸውማል
  rationale: ሆን ብሎ ሞትን ማድረስ የሚለውን የግሱን ከባድ ፍቺ በዘመናዊና ግልጽ አማርኛ ያስተላልፋል።
