  text: Ἐν ἐκείνῳ τῷ καιρῷ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ⸀ἔκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/025.yaml
  text: At that time Jesus answered and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding[b], and revealed them to little children.”
translation:
  language: am
  text: በዚያን ጊዜ ኢየሱስ መልሶ እንዲህ አለ፦ “አባት ሆይ፣ የሰማይና የምድር ጌታ ሆይ፣ እነዚህን ነገሮች ከጥበበኞችና ከአስተዋዮች ሰውረህ ለሕፃናት[b] ስለገለጥህላቸው አመሰግንሃለሁ[a]።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አወድስሃለሁ።” የግሪኩ ግስ ምስጋናን፣ ውዳሴን ወይም በግልጽ እውቅና መስጠትን ሊገልጥ ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ለሕፃናት ልጆች።” ቃሉ በቀጥታ ሕፃናትን ሊያመለክት ይችላል፤ በዚህ አውድ ግን ለልጅነት ተቀባይነት ወይም ለትሕትና በዘይቤ የተጠቀመ ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: በዚያን ጊዜ
  rationale: የትረካውን የጊዜ አውድ በተፈጥሯዊና በተለመደ አማርኛ ይገልጣል።
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: መልሶ እንዲህ አለ
  rationale: ምንም እንኳ ከዚህ በፊት ግልጽ ጥያቄ ባይኖርም፣ ሁለቱንም ግሶችና የግሪኩን የትረካ ቅርጽ ይጠብቃል።
- source_word: Ἐξομολογοῦμαί σοι
  choice: አመሰግንሃለሁ
  rationale: በአማርኛ የግሱን ምስጋናና የአደባባይ እውቅና ሐሳብ በተፈጥሯዊ መንገድ ያስተላልፋል፤ የኃጢአት ኑዛዜን የሚያስመስል አተረጓጎምንም ያስወግዳል።
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: አባት ሆይ፣ የሰማይና የምድር ጌታ ሆይ
  rationale: ሁለቱን የቀጥታ ጥሪዎች በክብር ያቆያል፤ κύριος የሚያመለክተውንም ሉዓላዊነት በመጽሐፍ ቅዱሳዊው ‘ጌታ’ ያስተላልፋል።
- source_word: ὅτι
  choice: ስለ...
  rationale: የምስጋናውን ምክንያት በግልጽ የአማርኛ ምክንያታዊ አወቃቀር ያሳያል።
- source_word: ἔκρυψας
  choice: ሰውረህ
  rationale: የግሪኩን ቀጥተኛ የአድራጊነት ቅርጽና ‘መደበቅ’ የሚለውን ፍቺ ይጠብቃል።
- source_word: ταῦτα ... αὐτά
  choice: እነዚህን ነገሮች ... ለ...ገለጥህላቸው
  rationale: ‘እነዚህ ነገሮች’ የሚያመለክቱትን በአውዱ ክፍት ያደርጋል፤ የአማርኛው የተዋሃደ ተውላጠ ስም የαὐτάን የተመለሰ ማጣቀሻ በተፈጥሯዊ አወቃቀር ይይዛል።
- source_word: ἀπὸ σοφῶν καὶ συνετῶν
  choice: ከጥበበኞችና ከአስተዋዮች
  rationale: σοφόςና συνετός ያላቸውን የጥበብና የማስተዋል ልዩነት በሁለት ስማዊ ቅጾች ይጠብቃል።
- source_word: ἀπεκάλυψας
  choice: ገለጥህላቸው
  rationale: መለኮታዊ መግለጥን የሚያሳይ መደበኛና ግልጽ አማርኛ ነው።
- source_word: νηπίοις
  choice: ለሕፃናት
  rationale: ቃሉ በቀጥታ ሕፃናትን ሊያመለክት ስለሚችል፣ የሕፃንነትን ምስል ይጠብቃል፤ ‘ትሑታን’ ብሎ ዘይቤውን አይፈታውም።
theological_decisions:
- issue: እግዚአብሔር መሰወሩና መግለጡ
  choice: ‘ሰውረህ ... ገለጥህላቸው’ በማለት ድርጊቶቹን በቀጥታ ለአብ መመደብ
  alternative: ‘እንዲሰወሩ ፈቀድህ’ በማለት የፈቃድ ትርጉም ማስገባት
  rationale: የግሪኩ ጽሑፍ አብን የሁለቱም ንቁ ግሶች አድራጊ ያደርጋል። ትርጉሙ ይህን ሥነ መለኮታዊ ውጥረት ያለ ማለስለስና ያለ ተጨማሪ አስተምህሮ ይጠብቃል።
- issue: የνηπίοις ዘይቤያዊ አጠቃቀም
  choice: የሕፃናትን ምስል በ‘ለሕፃናት’ ማቆየት
  alternative: ትርጉሙን በመፍታት ‘ለትሑታን’ ወይም ‘እንደ ሕፃናት ለሚቀበሉ’ ማለት
  rationale: አውዱ ዘይቤያዊ ንፅፅርን ቢጠቁምም፣ ምንጩ በግልጽ ‘ትሑታን’ አይልም። ስለዚህ ምስሉ ተጠብቆ የፍቺው ስፋት በማስታወሻ ይገለጣል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ የሚገባ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ የትረካ ቅርጽና የአብ ቀጥተኛ አድራጊነት ተጠብቀዋል። ‘ሕፃናት’ የሚለው ቃል ምስሉን ሳይፈታ ይይዛል።
