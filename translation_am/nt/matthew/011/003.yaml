  text: and said to him, “Are you the Coming One, or should we expect another?”
translation:
  language: am
  text: እንዲህም አለው፤ “እርስዎ የሚመጣው[a] ነዎት? ወይስ ሌላ እንጠብቅ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሊመጣ ያለው” ወይም “መጪው።” የግሪክ አገላለጽ መሲሐዊ ማዕረግ ሆኖ ሊያገለግል ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: እንዲህም አለው
  rationale: εἶπεν αὐτῷ በቀጥታ ‘እርሱን አለው’ የሚል ቢሆንም፣ በዘመናዊ አማርኛ ቀጥተኛ ንግግርን ለማስገባት ‘እንዲህም አለው’ ተፈጥሯዊ ነው፤ ‘ም’ የትረካውን ቀጣይነት ያሳያል።
- source_word: Σὺ εἶ
  choice: እርስዎ ነዎትን?
  rationale: ግልጽ የሆነው σύ በ‘እርስዎ’ ተጠብቋል፤ የጥያቄው ቅርጽ በ‘ነዎትን?’ በተፈጥሯዊና በክብር አነጋገር ተገልጿል።
- source_word: ὁ ἐρχόμενος
  choice: የሚመጣው
  rationale: ይህ አንቀጽ ያለው የአሁን ጊዜ ተሳቢ ግስ በስም ተግባር ላይ ነው። ‘የሚመጣው’ የግሪኩን ቅርጽ ይጠብቃል፣ በአውዱም መሲሐዊ ማዕረግ ሊሆን የሚችለውን ፍቺ ሳይገድብ ያስተላልፋል።
- source_word: ἢ
  choice: ወይስ
  rationale: በቀጥተኛ ጥያቄ ውስጥ ሁለት አማራጮችን ለማነጻጸር ‘ወይስ’ የተለመደና ትክክለኛ ነው።
- source_word: ἕτερον
  choice: ሌላ
  rationale: ἕτερον ‘ሌላ/የተለየ’ ማለት ነው፤ ሰውን እንደሚያመለክት ከአውዱ ግልጽ ስለሆነ ‘ሌላ’ ብቻውን ተፈጥሯዊ ነው።
- source_word: προσδοκῶμεν
  choice: እንጠብቅ
  rationale: በዚህ የአማራጭ ጥያቄ አውድ የመጠበቅንና የመጣበቅን ሐሳብ የሚያካትተው ‘እንጠብቅ?’ ተፈጥሯዊ የውሳኔ ጥያቄ ነው።
theological_decisions:
- issue: የὁ ἐρχόμενος መሲሐዊ/ማዕረጋዊ ኃይል
  choice: የሚመጣው
  alternative: መጪው፤ ሊመጣ ያለው፤ መሲሑ
  rationale: አውዱ የሚጠበቀውን መሲሐዊ ሰው ያመለክታል፤ ሆኖም ግሪኩ ‘መሲሕ’ የሚለውን ስም በግልጽ አይጠቀምም። ‘የሚመጣው’ የማዕረግነቱን ዕድልና የቃሉን ቀጥተኛ ምስል አብሮ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለመደበኛ አንባቢ ቀላል የሆነ አማርኛ ተጠቅሟል። ኢየሱስን ለማናገር ‘እርስዎ/ነዎት’ የሚለው የክብር ቅርጽ ተመርጧል።
