  yaml_path: translation/nt/matthew/011/012.yaml
  text: But from the days of John the Baptist until now[a], the kingdom of heaven suffers violence, and violent men seize it.
translation:
  language: am
  text: ከመጥምቁ ዮሐንስ ዘመን ጀምሮ እስከ አሁን ድረስ[a]፣ የሰማያት መንግሥት ጥቃት ይደርስበታል፤ ግፈኞችም በኃይል ይነጥቁታል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የሰማያት መንግሥት በኃይል እየሰፋ ነው፣ ብርቱዎችም ይይዙታል።” “ጥቃት ይደርስበታል” ተብሎ የተተረጎመው የግሪክ ግስ በመካከለኛ አንቀጽ ትርጉምም ሊረዳ ይችላል።
