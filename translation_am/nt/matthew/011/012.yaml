lexical_decisions:
- source_word: ἀπὸ δὲ
  choice: ከ… ጀምሮ
  rationale: ἀπό የጊዜውን መነሻ ያመለክታል። δέ እዚህ ረጋ ያለ የንግግር ሽግግር ነው፤ በአማርኛው የዓረፍተ ነገሩ ፍሰት ውስጥ ያለ ግልጽ ተቃርኖ እንዳይጨመር በተናጠል አልተተረጎመም።
- source_word: τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ
  choice: የመጥምቁ ዮሐንስ ዘመን
  rationale: ቃል በቃል ‘ቀኖች’ ማለት በዘመናዊ አማርኛ እንግዳ ስለሚመስል፣ የግሪኩን የጊዜ ማመልከቻ በተፈጥሯዊው ‘ዘመን’ ተላልፏል።
- source_word: ἕως ἄρτι
  choice: እስከ አሁን ድረስ
  rationale: ከዮሐንስ ዘመን እስከ ተናጋሪው ወቅት ያለውን ቀጣይነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: የሰማያት መንግሥት
  rationale: የማቴዎስን ልዩ አገላለጽ እና የግሪኩን ብዙ ቁጥር οὐρανῶν የሚጠብቅ፣ በአማርኛ የተለመደ ቅርጽ ነው።
- source_word: βιάζεται
  choice: ግፍ ይደርስበታል
  rationale: ዋናው ጽሑፍ የግሱን ተደራጊ ትርጉም ይከተላል። አገላለጹ መንግሥቱ የኃይል ጥቃት እንደሚደርስበት ያሳያል፤ የመካከለኛ/ኢ-ተሻጋሪ ንባብ በማስታወሻ ተጠብቋል።
- source_word: βιασταὶ
  choice: ግፈኞች
  rationale: ኃይልን ወይም ግፍን የሚጠቀሙ ሰዎችን በአጭርና በተፈጥሯዊ አማርኛ ይገልጣል። የአማርኛው ብዙ ቁጥር ቅርጽ የግሪኩን ወንድ ጾታ በተናጠል አያሳይም፣ ነገር ግን ‘ግፈኛ ወንዶች’ ማለት በአውዱ ውስጥ ያልተፈጥሯዊና ከመጠን በላይ የተገደበ ይሆናል።
- source_word: ἁρπάζουσιν αὐτήν
  choice: በኃይል ይይዙታል
  rationale: ἁρπάζω ያለውን የመንጠቅና በኃይል የመውሰድ ስሜት ይጠብቃል፤ ተውላጠ ስሙም መንግሥቱን ይመለከታል።
