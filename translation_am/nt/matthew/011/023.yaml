id: MAT.11.23
reference: Matthew 11:23
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ᾅδου ⸀καταβήσῃ· ὅτι εἰ ἐν Σοδόμοις ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν σοί, ⸀ἔμεινεν ἂν μέχρι τῆς σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/023.yaml
  text: And you[a], Capernaum, will you be exalted to heaven? You will go down to Hades. For if the mighty works done in you had happened in Sodom, it would have remained until today.
translation:
  language: am
  text: አንቺስ፣ ቅፍርናሆም፣ እስከ ሰማይ ድረስ ከፍ ትደረጊያለሽን? ወደ ሙታን ዓለም[a] ትወርጃለሽ። በአንቺ የተደረጉት የኃይል ሥራዎች በሰዶም ተደርገው ቢሆኑ ኖሮ፣ እስከ ዛሬ ድረስ በቆየች ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክ «ሃዴስ» የሚለው ቃል ነው፤ ገሃነም አይደለም።
    reason: ᾅδηςን ከገሃነም ሳያመሳስል የግሪኩን ቃል ለማብራራት።
lexical_decisions:
- source_word: Καφαρναούμ
  choice: ቅፍርናሆም
  rationale: በዘመናዊ የአማርኛ መጽሐፍ ቅዱስ አጠራር የተለመደውን የቦታውን ስም አጻጻፍ ይጠብቃል።
- source_word: μὴ ἕως οὐρανοῦ ὑψωθήσῃ;
  choice: እስከ ሰማይ ከፍ ከፍ ትደረጊያለሽን?
  rationale: μή ከወደፊት ጊዜ ግስ ጋር አሉታዊ መልስ የሚጠብቅ የአጽንዖት ጥያቄ መሆኑን ጠብቆ፣ የὑψόωን ተገብሮ ቅርጽና የሰማይን ምሳሌያዊ አቅጣጫ ያስቀራል።
- source_word: ἕως ᾅδου καταβήσῃ
  choice: እስከ ሙታን ዓለም ትወርጃለሽ
  rationale: καταβαίνωን ‘መውረድ’ በሚለው ቀጥተኛ ግስ ይተረጉማል፤ ᾅδηςንም ከገሃነም ጋር ሳያመሳስል በተፈጥሯዊ አማርኛ ‘የሙታን ዓለም’ ብሎ ያቀርባል።
- source_word: δυνάμεις
  choice: የኃይል ሥራዎች
  rationale: የተፈጸሙ ተጨባጭ ሥራዎችንና በእነርሱ የተገለጠውን ኃይል በአንድነት ያስቀራል፤ ‘ተአምራት’ ብሎ ትርጉሙን አያጠብም።
- source_word: γενόμεναι ἐν σοί
  choice: በአንቺ የተደረጉት
  rationale: ከተማዋ በሴት ነጠላ ተውላጠ ስም መጠራቷንና ሥራዎቹ በውስጧ መፈጸማቸውን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐγενήθησαν
  choice: ተደርገው ቢሆኑ ኖሮ
  rationale: ከእውነታ ተቃራኒ የሆነውን ሁኔታዊ አንቀጽ በአማርኛ የተሟላ ያለፈ ጊዜ ቅርጽ ያቀርባል።
- source_word: ἔμεινεν ἂν
  choice: በኖረች ነበር
  rationale: ሰዶምን እንደ ከተማ በሴት ነጠላ በመውሰድ፣ ያልተፈጸመውን ውጤት ‘በ... ነበር’ በሚለው የአማርኛ ሁኔታዊ ቅርጽ ይገልጣል።
- source_word: μέχρι τῆς σήμερον
  choice: እስከ ዛሬ
  rationale: የግሪኩን ጊዜያዊ ወሰን በአጭርና በዘመናዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: የᾅδης አተረጓጎም
  choice: የሙታን ዓለም
  alternative: ሲኦል፤ ሃዴስ፤ ገሃነም
  rationale: ‘የሙታን ዓለም’ የግሪኩን ሰፊ ሐሳብ በግልጽ አማርኛ ያስተላልፋል፤ ᾅδηςን ከገሃነም ጋር በማመሳሰል በጽሑፉ ላይ የሌለ የመጨረሻ ፍርድ ልዩ ትርጉም አይጭንም።
- issue: μή ያለበት ሐረግ ጥያቄ ወይስ ቀጥተኛ አሉታ
  choice: አሉታዊ መልስ የሚጠብቅ የአጽንዖት ጥያቄ
  alternative: ‘እስከ ሰማይ ከፍ አትደረጊም’ የሚል ቀጥተኛ አሉታ
  rationale: μή ከወደፊት ጊዜ ግስ ጋር ያለው አገባብና የቀጣዩ የፍርድ ንግግር የአጽንዖት ጥያቄውን ይደግፋሉ፤ ጥያቄው አሉታዊ መልስ እንደሚጠብቅ በአማርኛው አገባብ ይታያል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ለከተሞቹ የሴት ነጠላ አመልካቾች የግሪኩን ቀጥተኛ ንግግር ይጠብቃሉ፤ የንግግሩም ከባድ የፍርድ ቃና ሳይለሰልስ ቀርቧል።
