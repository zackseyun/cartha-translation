  verdict: revise
  source_fidelity: 'The draft accurately conveys the invitation, the inclusive addressees, and the broad promise of rest. However, ደክማችሁ can describe a resultant state of being tired more readily than the active, ongoing labor denoted by οἱ κοπιῶντες. Also, ሸክም የተጫነባችሁ more directly represents the perfect passive πεφορτισμένοι: people upon whom a burden has been placed and who remain so burdened.'
  naturalness: The revised wording is idiomatic, clear, and appropriately dignified modern standard Amharic. Placing the invitation first follows the Greek order and makes the direct address flow naturally.
  terminology: ዕረፍት እሰጣችኋለሁ is a sound broad rendering of ἀναπαύσω ὑμᾶς and does not specify the nature of the promised rest. The revised footnotes place lexical alternatives at their appropriate terms.
  issues:
  - severity: medium
    issue: The active nuance of οἱ κοπιῶντες is weakened.
    rationale: ደክማችሁ primarily says ‘being tired,’ whereas the Greek present participle identifies those who are laboring/toiling. የምትለፉ preserves the active sense naturally.
  - severity: low
    issue: The loaded-down nuance of πεφορτισμένοι is not explicit.
    rationale: ሸክም የከበደባችሁ is intelligible, but ሸክም የተጫነባችሁ better reflects the perfect passive participle without becoming unnatural.
  - severity: medium
    issue: The sole footnote is attached to the whole sentence while its content concerns only ἀναπαύσω.
    rationale: A lexical note should be anchored to the term it explains. A separate note for πεφορτισμένοι preserves the relevant perfect-passive alternative and resolves the misleading anchor.
