  yaml_path: translation/nt/matthew/011/028.yaml
  text: Come to me[a], all who labor and are burdened[b], and I will give you rest.
translation:
  language: am
  text: “ወደ እኔ ኑ፤ የምትለፉና ሸክም የተጫነባችሁ[a] ሁላችሁ፣ እኔም ዕረፍት እሰጣችኋለሁ።”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሸክም የከበደባችሁ።” የግሪኩ ፍጹም ተደራጊ አካፋይ ሸክም ተጭኖባቸው በዚያ ሁኔታ የቀጠሉ ሰዎችን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “አሳርፋችኋለሁ” ወይም “አድሳችኋለሁ።” የግሪኩ ግስ አንድን ሰው ማሳረፍን ወይም ማደስን ሊያመለክት ይችላል።
    reason: lexical_alternative
