id: MAT.11.9
reference: Matthew 11:9
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἀλλὰ τί ἐξήλθατε⸂; προφήτην ἰδεῖν⸃; ναί, λέγω ὑμῖν, καὶ περισσότερον προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/009.yaml
  text: But what did you go out to see? A prophet? Yes[a], I tell you, and more than a prophet.
translation:
  language: am
  text: ነገር ግን፣ ምን ለማየት ወጣችሁ? ነቢይን? አዎ፣ እላችኋለሁ፤ ከነቢይም የሚበልጥን።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: ነገር ግን
  rationale: ከቀደመው የንግግር ጥያቄ ጋር ያለውን ንፅፅር በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: τί ἐξήλθατε … ἰδεῖν
  choice: ምን ለማየት ወጣችሁ?
  rationale: τί እዚህ ‘ምን’ ሲሆን ἰδεῖν የዓላማ ግስ ነው፤ ስለዚህ ጥያቄው የወጡበትን ዓላማና ሊያዩት የጠበቁትን ነገር ይጠይቃል።
- source_word: προφήτην
  choice: ነቢይን
  rationale: በጥያቄው ውስጥ የተጠቀሰውን ያልተወሰነ ነጠላ ስም በተፈጥሯዊ አማርኛ ይወክላል።
- source_word: ναί
  choice: አዎ
  rationale: ለንግግር ጥያቄው የተሰጠውን ቀጥተኛ ማረጋገጫ በግልጽ ሁኔታ ያቀርባል።
- source_word: λέγω ὑμῖν
  choice: እላችኋለሁ
  rationale: የግሪኩን የንግግር ቀመር በአጭር፣ ክቡርና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: καὶ περισσότερον προφήτου
  choice: ከነቢይም የሚበልጥን
  rationale: የንፅፅር አገባቡን ጠብቆ፣ በአማርኛ የጥያቄው የተገመተ ቀጥተኛ ተሳቢ እንዲታወቅ ያደርጋል፤ ነገር ግን ዮሐንስ እንዴት እንደሚበልጥ አይጨምርም።
theological_decisions:
- issue: በኢየሱስ ንግግር ውስጥ የመጥምቁ ዮሐንስ ማንነትና ደረጃ
  choice: ከነቢይም የሚበልጥን
  alternative: ከተራ ነቢይ የሚበልጥን
  rationale: ጽሑፉ ዮሐንስን ከነቢይ በላይ ያደርገዋል፣ ግን በዚህ አንቀጽ የበለጠው በምን መልኩ እንደሆነ አይገልጽም። ‘ተራ’ የሚለውን መጨመር በግሪኩ ያልተገለጸ ትርጓሜ ያስገባል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክቡር የአማርኛ አገላለጽን ይጠቀማል። የግሪኩን የንግግር ጥያቄ ቅርጽና የንፅፅር ኃይል ጠብቋል። በእንግሊዝኛው ማስታወሻ የቀረበው አማራጭ በአማርኛው ዋና ጽሑፍ ውስጥ በተፈጥሯዊነት ስለተወከለ የግርጌ ማስታወሻ አላስፈለገም።
