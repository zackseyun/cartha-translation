  text: πλὴν λέγω ὑμῖν ὅτι γῇ Σοδόμων ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ σοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/024.yaml
  text: But I tell you that it will be more tolerable for the land of Sodom on the day of judgment than for you[a].
translation:
  language: am
  text: ነገር ግን እላችኋለሁ፤ በፍርድ ቀን ለሰዶም ምድር ከአንቺ ይልቅ የበለጠ ሊታገሥ የሚችል ይሆናል[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የበለጠ ቀላል ይሆናል።”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: ነገር ግን
  rationale: በቀደመው ንግግር ላይ ጠንካራ ንፅፅርን የሚያስገባ ተቃራኒ መሸጋገሪያ ነው።
- source_word: λέγω ὑμῖν
  choice: እልሻለሁ
  rationale: የግሪኩ ተውላጠ ስም ብዙ ቁጥር ቢሆንም በዐውዱ ከተማይቱ በነጠላ ሴት እንደተናገራት በአማርኛ የግስ ቅርጹ ከቀጣዩ σοί ጋር ተስማምቷል፤ ሆኖም የቁጥር ልዩነቱን ሙሉ በሙሉ ማሳየት አይቻልም።
- source_word: γῇ Σοδόμων
  choice: ለሰዶም ምድር
  rationale: γῇ የሚለውን ‘ምድር/አገር’ በግልጽ ያቆያል፣ ስሙን ብቻ ‘ሰዶም’ ብሎ አያሳጥርም።
- source_word: ἀνεκτότερον
  choice: የሚታገሥ
  rationale: በፍርድ ዐውድ ‘መታገሥ የሚቻል’ የሚለውን ንፅፅራዊ ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: በፍርድ ቀን
  rationale: የፍርዱን የወደፊት ጊዜ በአጭርና በተለመደ አማርኛ ይገልጣል።
- source_word: ἢ σοί
  choice: ከአንቺ ይልቅ
  rationale: σοί ነጠላ ሲሆን በዐውዱ ከተማይቱን በሴት ነጠላ ተውላጠ ስም በቀጥታ ይጠራል።
theological_decisions:
- issue: የነጠላው σοί ተጠቃሽ
  choice: ከተማይቱን በሴት ነጠላ ‘አንቺ’ ብሎ በቀጥታ መጥራት
  alternative: ‘ከእናንተ’ ብሎ ነዋሪዎቿን ማመልከት
  rationale: የግሪኩ ቅርጽ ነጠላ ነው፤ በዐውዱም ከተማይቱ ሰው እንደሆነች በትንቢታዊ ዘይቤ ተጠርታለች። ትርጉሙ ይህን የንግግር ኃይል ይጠብቃል።
- issue: የፍርዱ ንፅፅር
  choice: ‘ከአንቺ ይልቅ ለሰዶም ምድር’ በማለት ንፅፅሩን በቀጥታ ማቆየት
  alternative: የቅጣት ደረጃዎችን በማብራራት መተርጎም
  rationale: ጽሑፉ የተለያየ የፍርድ ክብደትን ይጠቁማል እንጂ ሥርዓተ እምነታዊ ዝርዝር አይሰጥም፤ ስለዚህ ውጥረቱ ሳይፈታ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ የሚገባ አማርኛ ተጠቅሟል። ከተማን በሴት ነጠላ መጥራት የዐውዱን ትንቢታዊ ሰውኛ አነጋገር ይጠብቃል።
