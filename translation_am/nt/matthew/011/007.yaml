  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Τούτων δὲ πορευομένων ἤρξατο ὁ Ἰησοῦς λέγειν τοῖς ὄχλοις περὶ Ἰωάννου· Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι; κάλαμον ὑπὸ ἀνέμου σαλευόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/007.yaml
  text: 'As these men were going away[b][a], Jesus began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed being shaken by the wind?”'
translation:
  language: am
  text: እነዚህም እየሄዱ ሳሉ፣ ኢየሱስ ስለ ዮሐንስ ለሕዝቡ መናገር ጀመረ፤ “ወደ ምድረ በዳ ምን ለማየት ወጣችሁ? በነፋስ የሚወዛወዝ ሸምበቆ?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በነፋስ የሚወዛወዝ ሸምበቆ የሚለው ምስል በአቋም አለመጽናትን ወይም ወላዋይነትን ሊያመለክት ይችላል፤ የኢየሱስ ጥያቄ ስለ ዮሐንስ “አይደለም” የሚል መልስ ይጠብቃል።
    reason: cultural_note
lexical_decisions:
- source_word: Τούτων δὲ πορευομένων
  choice: እነዚህም ሄደው ሳሉ
  rationale: የግሪኩን genitive absolute በተፈጥሯዊ የአማርኛ ጊዜያዊ ሐረግ ይወክላል። “እነዚህ” የሚለው ከቀደመው አውድ የዮሐንስን ደቀ መዛሙርት ያመለክታል፤ ስማቸውን በግልጽ በመጨመር ሳይፈታ የምንጩን አመልካች ጠብቋል።
- source_word: ἤρξατο ... λέγειν
  choice: መናገር ጀመረ
  rationale: ἄρχομαι ከ infinitive ጋር ያለውን “ጀመረ” የሚል አወቃቀር በቀጥታና ተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: τοῖς ὄχλοις
  choice: ለሕዝቡ
  rationale: ὄχλοι በቁጥር ብዙ ቢሆንም፣ በዚህ የአማርኛ ትረካ ውስጥ “ሕዝቡ” የተሰበሰቡትን ሰዎች በተፈጥሯዊ የስብስብ ስም ይገልጻል።
- source_word: περὶ Ἰωάννου
  choice: ስለ ዮሐንስ
  rationale: περί ከ genitive ጋር እዚህ የንግግሩን ርዕስ ያመለክታል፤ “ስለ” ቀጥተኛና ዘመናዊ ነው።
- source_word: Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι;
  choice: ወደ ምድረ በዳ ምን ለማየት ወጣችሁ?
  rationale: τί ን “ምን” ብሎ በመተርጎም “ለምን” የሚለውን የምክንያት ጥያቄ አያስገባም። θεάομαι ን “ማየት” ብሎ መተርጎም ቀጥተኛና ተፈጥሯዊ ሲሆን ἔρημος ደግሞ “ምድረ በዳ” ተብሏል።
- source_word: κάλαμον
  choice: ሸምበቆ
  rationale: በዚህ ምስላዊ ጥያቄ ውስጥ κάλαμος የሚያመለክተውን ተጣጣፊ የውኃ ዳር ተክል የሚገልጽ የተለመደ የአማርኛ ቃል ነው።
- source_word: ὑπὸ ἀνέμου σαλευόμενον
  choice: በነፋስ የሚወዛወዝ
  rationale: የpassive participle ተከታታይ እንቅስቃሴን በተፈጥሯዊ አማርኛ ያሳያል፤ “የሚወዛወዝ” የነፋሱን ተጽዕኖና የሸምበቆውን ወዲያ ወዲህ መንቀሳቀስ ይጠብቃል።
theological_decisions:
- issue: የΤούτων (“እነዚህ”) አመልካች
  choice: “እነዚህ” ተብሎ የምንጩ አመልካች ተጠብቋል
  alternative: “የዮሐንስ ደቀ መዛሙርት” ብሎ በግልጽ መጥቀስ
  rationale: የቀደመው አውድ አመልካቹን ቢያብራራም፣ ግሪኩ ስማቸውን እዚህ አይደግምም። ስለዚህ አሻሚነቱን ሳያስወግድ በታማኝነት ተጠብቋል።
- issue: በነፋስ የሚወዛወዝ ሸምበቆ የሚለው ምስል
  choice: ምስሉን በዋናው ጽሑፍ ሳይፈታ ማቆየት፣ የተለመደውን አንድምታ በማስታወሻ መግለጽ
  alternative: “በአቋሙ የማይጸና ሰው” ብሎ ትርጉሙን በዋናው ጽሑፍ መተካት
  rationale: ጥያቄው ስለ ዮሐንስ አሉታዊ መልስን የሚጠብቅ ቢሆንም፣ ምስሉን በትርጓሜ መተካት የጽሑፉን ሥነ ንግግር ያጠፋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለመደበኛ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ምድረ በዳ” እና “ሸምበቆ” መጽሐፍ ቅዱሳዊ ክብርን ሳያጡ በዘመናዊ አማርኛ የሚገቡ ቃላት ናቸው።
