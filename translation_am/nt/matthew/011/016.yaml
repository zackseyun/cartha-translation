  text: 'ነገር ግን ይህን ትውልድ ከምን ጋር ላመሳስለው? በገበያ ስፍራዎች[a] ተቀምጠው ለሌሎቹ[b] እየጠሩ ካሉ ልጆች ጋር ይመሳሰላል።


    [a] ወይም፣ “በገበያ አደባባዮች።” የግሪኩ ቃል ἀγοραῖς ሰዎች የሚሰበሰቡባቸውን የሕዝብ ገበያ ስፍራዎች ያመለክታል።


    [b] ወይም፣ “ለሌሎቹ ልጆች።” የግሪኩ ጽሑፍ “ለሌሎቹ” ብቻ ይላል፤ እነማን እንደሆኑ ከምሳሌው ዐውድ ይገባል።'
