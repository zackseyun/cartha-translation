source:
  edition: SBLGNT
  text: Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ἐγένοντο αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ μετενόησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/021.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works done among you had taken place in Tyre and Sidon, they would have repented long ago in sackcloth and ashes.
translation:
  language: am
  text: “ወዮልሽ፣ ኮራዚን! ወዮልሽ፣ ቤተ ሳይዳ! በእናንተ መካከል የተደረጉት የኃይል ሥራዎች[a] በጢሮስና በሲዶና ቢደረጉ ኖሮ፣ ከጥንት በማቅና በአመድ ንስሐ በገቡ ነበር።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ተአምራት”፤ የግሪኩ ቃል የኃይል መገለጫ የሆኑ ሥራዎችን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαί σοι
  choice: ወዮልሽ
  rationale: የነቢያዊ ውግዘትንና ሐዘንን ድርብ ኃይል ይጠብቃል። ንግግሩ ለእያንዳንዱ ከተማ በነጠላ የተነገረ ሲሆን፣ ከተማን በአማርኛ በእንስታዊ ነጠላ መጥራት ተፈጥሯዊ ነው።
- source_word: Χοραζίν / Βηθσαϊδά
  choice: ኮራዚን / ቤተ ሳይዳ
  rationale: የቦታ ስሞቹ በተለመደው የአማርኛ መጽሐፍ ቅዱሳዊ አጻጻፍ ተጽፈዋል።
- source_word: αἱ δυνάμεις
  choice: የኃይል ሥራዎች
  rationale: δυνάμεις በዚህ አውድ የመለኮታዊ ኃይል መገለጫ የሆኑ ድርጊቶችን ያመለክታል። “የኃይል ሥራዎች” የቃሉን ከኃይል ጋር ያለውን ግንኙነት ይጠብቃል፤ “ተአምራት” በግርጌ ማስታወሻ ተሰጥቷል።
- source_word: ἐν ὑμῖν
  choice: በእናንተ መካከል
  rationale: ብዙ ሰዎችን የሚወክለው ὑμῖν ሥራዎቹ በውስጣቸው ሳይሆን በመካከላቸው መፈጸማቸውን ያሳያል።
- source_word: πάλαι
  choice: ከጥንት
  rationale: ንስሐው ከዚያ ጊዜ እጅግ ቀደም ብሎ ይፈጸም እንደነበር በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: μετενόησαν
  choice: ንስሐ በገቡ
  rationale: በፍርድ አውድ የሚጠበቀውን ከኃጢአት መመለስ በዘመናዊና በተለመደ አማርኛ ይገልጣል።
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: ማቅ ለብሰውና አመድ ነስንሰው
  rationale: የሐዘንና የንስሐ ባህላዊ ምስሉን በአማርኛ ግልጽና ተፈጥሯዊ በሆነ አገላለጽ ያቀርባል።
theological_decisions:
- issue: ኢየሱስ ኮራዚንንና ቤተ ሳይዳን ከጢሮስና ከሲዶና ጋር ያደረገው ንጽጽር
  choice: የኢየሱስን የኃይል ሥራዎች አይተው ንስሐ ያልገቡት ከተሞች የበለጠ ተጠያቂነት እንዳለባቸው የሚገልጽ እውነተኛ ተቃራኒ-ሁኔታዊ ንጽጽር
  alternative: እውነተኛ የፍርድ ንጽጽር የሌለው የንግግር ማጋነን
  rationale: εἰ ከἄν ጋር ያለው አወቃቀር ያልተፈጸመን ተቃራኒ ሁኔታ በግልጽ ያቀርባል። ትርጉሙ ይህን የሞራል ንጽጽር ይጠብቃል፤ ከጽሑፉ በላይ የሆነ ዶክትሪናዊ ድምዳሜ ግን አይጨምርም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። “ወዮልሽ”፣ “ማቅ” እና “ንስሐ” የጽሑፉን ነቢያዊና መጽሐፍ ቅዱሳዊ ክብደት የሚጠብቁ የታወቁ ቃላት ናቸው።
