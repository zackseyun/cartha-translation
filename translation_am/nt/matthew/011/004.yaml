review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Jesus’ reply, the command to go, the reporting to John, and the paired present observations of hearing and seeing. However, “ለዮሐንስ ንገሩት” redundantly marks John both with “ለ-” and the object suffix “-ት”; the Greek has one indirect object, Ἰωάννῃ.
  naturalness: The overall register is clear modern standard Amharic. Removing the redundant object suffix and rendering the attendant participle imperativally as “ሂዱና” yields a more direct and natural command sequence.
  terminology: “ኢየሱስ,” “ዮሐንስ,” and “መልሶ አላቸው” are suitable. No doctrinally loaded terminology is involved.
  issues:
  - severity: low
    issue: Redundant recipient marking in “ለዮሐንስ ንገሩት.”
    rationale: “ለዮሐንስ” already identifies the recipient. The suffix in “ንገሩት” repeats that recipient and makes the phrasing less idiomatic, although it does not materially alter the meaning.
  - severity: low
    issue: “ሄዳችሁ” is acceptable but less forceful than an imperative coordination.
    rationale: Πορευθέντες functions as an attendant participle with imperatival force alongside ἀπαγγείλατε. “ሂዱና … ንገሩ” naturally expresses the Greek command sequence.
  revised_text: ኢየሱስም መልሶ አላቸው፤ “ሂዱና የምትሰሙትንና የምታዩትን ለዮሐንስ ንገሩ፤”
  revised_footnotes: []
  revision_rationale: The revision retains the source’s narrative reply formula in idiomatic Amharic, represents the attendant participle and imperative as coordinated commands, and removes redundant recipient marking. The source’s open-ended “what you hear and see” remains fully preserved.
