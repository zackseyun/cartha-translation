reference: Matthew 11:4
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Πορευθέντες ἀπαγγείλατε Ἰωάννῃ ἃ ἀκούετε καὶ βλέπετε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/004.yaml
  text: And Jesus answered them[a], “Go and report to John what you hear and see:”
translation:
  language: am
  text: ኢየሱስም መልሶ አላቸው፤ “ሂዱና የምትሰሙትንና የምታዩትን ለዮሐንስ ንገሩ፤”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν αὐτοῖς
  choice: መልሶ እንዲህ አላቸው
  rationale: የግሪኩን የንግግር መግቢያ በተፈጥሯዊና ክብር ባለው ዘመናዊ አማርኛ ያቀርባል፤ ἀποκριθεὶς ያለውን የመመለስ ትርጉምና εἶπεν ያለውን የመናገር ተግባር ሁለቱንም ይጠብቃል።
- source_word: Πορευθέντες
  choice: ሄዳችሁ
  rationale: ከትእዛዙ ጋር የተያያዘውን ቀዳሚ ተግባርና የእንቅስቃሴ ኃይል በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἀπαγγείλατε
  choice: ንገሩት
  rationale: መልእክተኞቹ ያዩትንና የሰሙትን ወደ ዮሐንስ መልሰው እንዲያደርሱ የተሰጠውን ትእዛዝ በግልጽ ይገልጣል። የነገሩ ተቀባይ ዮሐንስ መሆኑን “-ት” ያመለክታል።
- source_word: Ἰωάννῃ
  choice: ለዮሐንስ
  rationale: የዳቲቭ ተዘዋዋሪ ተቀባይነትን “ለ-” በሚለው መስተዋድድ በቀጥታ ያቀርባል።
- source_word: ἃ ἀκούετε καὶ βλέπετε
  choice: የምትሰሙትንና የምታዩትን
  rationale: የዘመድ ተውላጠ ስሙንና ሁለቱን ወቅታዊ የምልከታ ተግባራት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: καὶ
  choice: -ም / -ና
  rationale: የመጀመሪያው καί የትረካ ቅጥያ በ“-ም”፣ በመስማትና በማየት መካከል ያለው ማያያዣ ደግሞ በ“-ና” ተወክሏል።
theological_decisions:
- issue: ἀποκριθεὶς ... εἶπεν የሚለውን የግሪክ ትረካ ቀመር መተርጎም
  choice: መልሶ እንዲህ አላቸው
  alternative: መልሶ አላቸው
  rationale: የግሪኩን ሁለት የንግግር ክፍሎች ያለ ከባድና እንግዳ ድግግሞሽ ይጠብቃል። ይህ የአጻጻፍና የትርጉም ምርጫ እንጂ የእምነት አቋም አይደለም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። “እንዲህ አላቸው” የቀጥታ ንግግሩን በተፈጥሯዊ መንገድ ያስገባል፤ የግሪኩን ትርጉም ሳያጣ ቃል በቃል የሆነ እንግዳ አገላለጽን ያስወግዳል።
