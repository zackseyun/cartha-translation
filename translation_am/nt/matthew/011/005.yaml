base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/005.yaml
  text: The blind receive sight and the lame walk[a], lepers are cleansed and the deaf hear[b], and the dead are raised and the poor have good news proclaimed to them.
translation:
  language: am
  text: ዕውሮች ያያሉ፣ አንካሶችም ይራመዳሉ፤ ለምጻሞች ይነጻሉ፣ ደንቆሮዎችም ይሰማሉ፤ ሙታንም ይነሣሉ፣ ለድሆችም የምሥራች ይነገራቸዋል።[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለድሆችም ወንጌል ይሰበካል።” የግሪኩ ግስ ተደራጊ ነው፤ ቃል በቃል፣ “ለድሆች የምሥራች ይነገራቸዋል” የሚል ሐሳብ አለው።
    reason: lexical_alternative
  - marker: b
    text: ይህ ዝርዝር ኢሳይያስ 35፥5-6ንና 61፥1ን ያስተጋባል፤ ከመሲሑ ሥራ ጋር የተያያዙ ምልክቶችንም ያቀርባል።
    reason: cross_reference
lexical_decisions:
- source_word: τυφλοὶ ἀναβλέπουσιν
  choice: ዕውሮች ያያሉ
  rationale: በፈውስ አውድ ἀναβλέπω የማየት ችሎታን ማግኘት ወይም መልሶ ማየትን ያመለክታል፤ አጭሩ አማርኛ የድርጊቶቹን ዝርዝር ተፈጥሯዊ ያደርገዋል።
- source_word: χωλοὶ περιπατοῦσιν
  choice: አንካሶችም ይራመዳሉ
  rationale: χωλός በመደበኛ ሁኔታ መራመድ የማይችሉትን ያመለክታል፤ ‘አንካሶች’ አጭርና የተለመደ ነው።
- source_word: λεπροὶ καθαρίζονται
  choice: ለምጻሞች ይነጻሉ
  rationale: καθαρίζονται ተደራጊ ቅርጽ ሲሆን አካላዊ ፈውስንና ሥርዓታዊ ንጽሕናን አብሮ ሊያመለክት ስለሚችል ‘ይነጻሉ’ የሚለው ከ‘ይፈወሳሉ’ ይልቅ ሙሉ ነው።
- source_word: κωφοὶ ἀκούουσιν
  choice: ደንቆሮዎችም ይሰማሉ
  rationale: κωφός ደንቆሮ ወይም ዲዳ ሊሆን ቢችልም፣ ከἀκούουσιν ጋር በመጣቱ እዚህ የመስማት ችግር ያለባቸውን ያመለክታል።
- source_word: νεκροὶ ἐγείρονται
  choice: ሙታንም ይነሣሉ
  rationale: ἐγείρονται ተደራጊ ቅርጽን የሚያሳይ ሲሆን፣ ‘ይነሣሉ’ በአማርኛ የሙታንን መነሣት በተፈጥሯዊና በቅዱስ ጽሑፋዊ ክብር ይገልጻል።
- source_word: πτωχοὶ εὐαγγελίζονται
  choice: ለድሆችም የምሥራች ይሰበካል
  rationale: εὐαγγελίζονται ተደራጊ ቅርጽ ስለሆነ ድሆች የምሥራቹ ተቀባዮች መሆናቸውን ይጠብቃል፤ ‘የምሥራች’ የቃሉን መሠረታዊ ትርጉምና ኢሳይያሳዊ ድምፅ ያስቀራል።
theological_decisions:
- issue: የεὐαγγελίζονται የወንጌል ቃላት አተረጓጎም
  choice: ለድሆችም የምሥራች ይሰበካል
  alternative: ድሆችም ወንጌልን ይሰማሉ
  rationale: የተመረጠው አተረጓጎም ተደራጊውን ቅርጽ እና የ‘መልካም ዜና’ን ቀጥተኛ ሐሳብ ይጠብቃል፤ በኋለኛ ዘመን ቴክኒካዊ የቤተ ክርስቲያን ቃል ብቻ እንዳይመስልም ያደርጋል።
- issue: ዝርዝሩ የመሲሑ ሥራ ምልክት መሆኑ
  choice: በዋናው ጽሑፍ ድርጊቶቹን ብቻ በቀጥታ ማቅረብ
  alternative: ‘ትንቢቱን ለመፈጸም’ የሚል ገላጭ ሐረግ መጨመር
  rationale: ጽሑፉ ኢሳይያስ 35፥5-6ንና 61፥1ን በግልጽ ያስተጋባል፤ ሆኖም በግሪክ ጽሑፉ ውስጥ የፍጻሜ ማብራሪያ በቀጥታ አልተጨመረም።
