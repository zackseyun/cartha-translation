  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩ አጭር ትይዩ ዝርዝር በ፣ እና በ፤ ምልክቶች ተጠብቋል፤ ተደራጊ ቅርጾቹም በተቻለ መጠን ተይዘዋል።
