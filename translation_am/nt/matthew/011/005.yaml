    rationale: εὐαγγελίζονται identifies the poor as recipients of good news. “የምሥራች ይነገራቸዋል” clearly retains this. “ድሆች የምሥራች ይበሰራሉ” is not a natural or accurate Amharic explanation of the passive.
  - severity: low
    issue: Footnote anchor a should be placed directly after the clause it explains.
    rationale: This makes the lexical alternative unambiguous; the cross-reference note can remain at the end of the verse.
