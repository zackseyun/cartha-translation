lexical_decisions:
- source_word: πλὴν
  choice: ሆኖም
  rationale: ከቀደመው የኩነኔ ንግግር ጋር ያለውን ጠንካራ ንፅፅር በተፈጥሯዊና በክብር ባለው ዘመናዊ አማርኛ ያሳያል።
- source_word: λέγω ὑμῖν
  choice: እላችኋለሁ
  rationale: የግሪኩን ቀጥተኛና አጽንዖት ያለው የንግግር ቅርጽ ይጠብቃል፤ የሁለተኛ መደብ ብዙ ቁጥርም በግስ ውስጥ ግልጽ ነው።
- source_word: Τύρῳ καὶ Σιδῶνι
  choice: ለጢሮስና ለሲዶና
  rationale: ተነጻጻሪው ሁኔታ ለማን እንደሚቀል የሚያመለክተውን የዳቲቭ አገባብ በአማርኛ ‘ለ-’ በትክክል ይገልጻል።
- source_word: ἀνεκτότερον
  choice: መታገሡ ይቀላል
  rationale: ቃሉ ሊታገሡት ወይም ሊሸከሙት የሚቻልን ሁኔታ በንፅፅር ይገልጻል። ይህ አተረጓጎም በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን ‘የበለጠ ሊታገሥ የሚችል’ የሚለውን ፍቺ ይጠብቃል።
- source_word: ἔσται
  choice: ይቀላል
  rationale: የወደፊት ጊዜ ፍቺው በዐውደ ንባቡና በ‘በፍርድ ቀን’ የጊዜ ሐረግ ግልጽ ሲሆን፣ በአማርኛ ተፈጥሯዊ የሆነውን የንፅፅር አገላለጽ ይፈጥራል።
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: በፍርድ ቀን
  rationale: የፍርዱን ጊዜ በአጭር፣ ግልጽና በአማርኛ የተለመደ አገላለጽ ያስቀምጣል።
- source_word: κρίσεως
  choice: ፍርድ
  rationale: ቃሉን እንደ የፍርድ ክስተት ያቀርባል፤ ‘ኩነኔ’ ብሎ ውጤቱን ብቻ በማጥበብ የሌለ ትርጉም አይጨምርም።
- source_word: ἢ ὑμῖν
  choice: ከእናንተ ይልቅ
  rationale: የንፅፅሩን ሁለተኛ ወገንና የብዙ ቁጥር አድራሻውን በግልጽ አማርኛ ያሳያል።
theological_decisions:
- issue: የሚመጣው ፍርድ ባሕርይ
  choice: በፍርድ ቀን
  alternative: በአንድ የፍርድ ቀን
  rationale: በግሪኩ ሐረግ የተወሰነ አመልካች ባይኖርም፣ በማቴዎስ ዐውደ ንባብ የሚታወቀውን የወደፊት የፍርድ ቀን ያመለክታል። ትርጉሙ ጽሑፉ ያልገለጸውን ተጨማሪ የዶክትሪን ዝርዝር አያስገባም።
- issue: በፍርድ ውስጥ የደረጃ ንፅፅር
  choice: ከእናንተ ይልቅ … መታገሡ ይቀላል
  alternative: እናንተ ከጢሮስና ከሲዶና የበለጠ ትኮነናላችሁ
  rationale: ግሪኩ የመታገሥን ንፅፅር ይናገራል እንጂ የኩነኔውን ትክክለኛ ባሕርይ ወይም መጠን አይወስንም። ስለዚህ ትርጉሙ የጽሑፉን ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የከተሞቹ ስሞች በተለመደው የአማርኛ መጽሐፍ ቅዱሳዊ አጻጻፍ ‘ጢሮስ’ እና ‘ሲዶና’ ተብለው ቀርበዋል። የግሪኩ ግላዊ ያልሆነ አገባብ ቃል በቃል ቢተረጎም በአማርኛ የማይፈስ ስለሆነ፣ ፍቺው ‘መታገሡ ይቀላል’ በሚል ተፈጥሯዊ ቅርጽ ተሰጥቷል።
