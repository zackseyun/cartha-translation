review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the adversative transition, direct plural address, Tyre and Sidon, the day of judgment, and the comparative relation. However, «ለጢሮስና ለሲዶና መታገሡ ይቀላል» is syntactically awkward and can suggest that the cities themselves are the subject of an abstract infinitive. The revision makes the recipients of the comparative experience clear and explicitly preserves the future force of ἔσται.
  naturalness: «ጢሮስና ሲዶና ከእናንተ ይልቅ መታገስ ይቀላቸዋል» is idiomatic modern standard Amharic. It uses the city names metonymically for their inhabitants, as the Greek does, without adding an interpretive explanation.
  terminology: «ፍርድ ቀን» appropriately renders ἡμέρᾳ κρίσεως and retains the judicial-event sense rather than narrowing it to condemnation. The established Amharic biblical spellings «ጢሮስ» and «ሲዶና» are retained. The footnote is revised because its prior wording had an unanchored singular participle and was not a natural alternative expression.
  issues:
  - severity: medium
    issue: Ambiguous and unnatural construction in the main clause
    rationale: The phrase «ለጢሮስና ለሲዶና መታገሡ ይቀላል» does not clearly identify who will find the judgment more endurable. Recasting the cities as metonymic subjects and using «ይቀላቸዋል» resolves this without changing the source's sense.
  - severity: medium
    issue: Footnote alternative is grammatically incomplete
    rationale: «የሚታገሥ ይሆናል» has a singular participle without a clear referent and does not naturally express the comparative predicate. The replacement gives a usable lexical alternative for ‘more tolerable.’
