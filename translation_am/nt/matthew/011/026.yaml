  yaml_path: translation/nt/matthew/011/026.yaml
  text: Yes[a], Father, because this was pleasing in your sight.
translation:
  language: am
  text: አዎን[a]፣ አባት ሆይ፤ እንዲህ መሆኑ በፊትህ ደስ የሚያሰኝ ነበርና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በእርግጥ፣ አባት ሆይ፤ እንዲህ መሆን በጎ ፈቃድህ ነበርና።”
    reason: ναί ለ“በእርግጥ” እና εὐδοκία ለ“በጎ ፈቃድ” የሚሆኑ ተለዋጭ አቀራረቦችን ያሳያል።
lexical_decisions:
- source_word: ναί
  choice: አዎን
  rationale: በጸሎቱ ውስጥ ያለውን ማረጋገጥና መስማማት በቀጥታና በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ὁ πατήρ
  choice: አባት ሆይ
  rationale: በግሪክኛው የጥሪ ተግባር ያለውን ስም በዘመናዊና በክብር የተሞላ የአማርኛ አጠራር ያስተላልፋል።
- source_word: ὅτι
  choice: —ና
  rationale: የምክንያት ግንኙነቱን በተፈጥሯዊው የአማርኛ ሐረግ መጨረሻ ቅጥያ ይገልጣል።
- source_word: οὕτως
  choice: ይህ
  rationale: በቀደመው ቁጥር የተገለጠውን የአብን አሠራር ወደ ኋላ በተፈጥሯዊ ሁኔታ ያመለክታል።
- source_word: εὐδοκία
  choice: ደስ የሚያሰኝ
  rationale: ቃሉ የሚገልጠውን ደስታና ተቀባይነት ያስተላልፋል፤ ትርጉሙን ወደ ውሳኔ ወይም ወደ ዕቅድ ብቻ አያጠብበውም።
- source_word: ἐγένετο
  choice: ሆኗል
  rationale: የγίνομαιን ‘መሆን/ሆኖ መገኘት’ ሐሳብ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἔμπροσθέν σου
  choice: በፊትህ
  rationale: የግሪክኛውን ቀጥተኛ ምስል ጠብቆ ‘በአንተ እይታ/በአንተ ዘንድ’ የሚለውን ግንኙነታዊ ሐሳብ በግልጽ ያስተላልፋል።
theological_decisions:
- issue: εὐδοκία መለኮታዊ ደስታንና ተቀባይነትን ወይስ የተወሰነ መለኮታዊ ውሳኔን/ዕቅድን እንደሚያመለክት
  choice: ደስ የሚያሰኝ
  alternative: በጎ ፈቃድህ
  rationale: ዋናው ትርጉም የአብን ደስታና ተቀባይነት ያሳያል፤ ከቃሉ በላይ ጠንካራ የውሳኔ ወይም የዕቅድ ትርጉም አያስገባም። አማራጩ ግን በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው የጸሎት ቋንቋ ተጠቅሟል። “አባት ሆይ” የቀጥታ አድራሻውን ጠብቋል፤ የምክንያት ግንኙነቱም በ“—ና” ተገልጧል።
