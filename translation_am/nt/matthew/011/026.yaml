  revision_rationale: The revision uses እንዲህ መሆኑ to express οὕτως adverbially while referring back to the preceding divine action, and ነበር to represent ἐγένετο without importing a present-perfect nuance. It retains the non-doctrinal sense of εὐδοκία as what was pleasing before the Father.
