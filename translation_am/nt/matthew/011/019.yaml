base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/019.yaml
  text: The Son of Man came eating and drinking[a], and they say, ‘Look, a glutton and a drunkard[b], a friend of tax collectors and sinners!’ And wisdom was justified by her works.
translation:
  language: am
  text: የሰው ልጅ እየበላና እየጠጣ መጣ፤ እነርሱም፣ “እነሆ፣ ሆዳምና ሰካራም ሰው፣ የቀረጥ ሰብሳቢዎችና የኃጢአተኞች ወዳጅ!” ይላሉ። ጥበብም በሥራዎቿ ትክክል መሆኗ ተረጋገጠ።[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ጥበብም በሥራዎቿ ትክክል መሆኗ ታየ።”
    reason: lexical_alternative
  - marker: b
    text: አንዳንድ የእጅ ጽሑፎች “ሥራዎች” በሚለው ፈንታ “ልጆች” ይላሉ፤ “ጥበብም በልጆቿ ትክክል መሆኗ ተረጋገጠ።”
    reason: textual_variant
lexical_decisions:
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: የሰው ልጅ
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የተለመደውን ማዕረግ ይጠብቃል፤ ሴማዊ ዳራውንና መሲሐዊ ጥልቀቱን ያለ ትርጓሜያዊ ማስፋፋት ያስቀራል።
- source_word: ἐσθίων καὶ πίνων
  choice: እየበላና እየጠጣ
  rationale: ተሳቢ ግሶቹን ቀጥተኛና ተፈጥሯዊ በሆነ መልኩ ያስተላልፋል፤ ‘ሲበላና ሲጠጣ’ ሊባልም ቢችል፣ ይህ አቀራረብ ከ‘መጣ’ ጋር በተፈጥሮ ይያያዛል።
- source_word: Ἰδοὺ
  choice: እነሆ
  rationale: የሕዝብ ፊት የሚቀርብ ወቀሳ አመልካችና አጽንዖታዊ ኃይል ያለውን ቃል በክቡር ነገር ግን ግልጽ አማርኛ ይጠብቃል።
- source_word: φάγος
  choice: ሆዳም
  rationale: ገለልተኛ ‘ብዙ የሚበላ’ ሳይሆን የስድብና የወቀሳ ስሜቱን የሚያስተላልፍ ተፈጥሯዊ የአማርኛ ቃል ነው።
- source_word: οἰνοπότης
  choice: ሰካራም
  rationale: ቃሉ በወይን ጠጅ መጠጣትን ብቻ ሳይሆን ከመጠን በላይ ጠጪነትን እንደ ክስ ያቀርባል፤ ‘ሰካራም’ ይህን የዘለፋ ኃይል ይጠብቃል።
- source_word: τελωνῶν φίλος καὶ ἁμαρτωλῶν
  choice: የቀረጥ ሰብሳቢዎችና የኃጢአተኞች ወዳጅ
  rationale: የግሪኩን የባለቤትነት አወቃቀርና የቡድኖቹን ማኅበራዊና ሃይማኖታዊ መለያ በግልጽ አማርኛ ይጠብቃል።
- source_word: ἐδικαιώθη
  choice: ትክክል መሆኗ ተረጋገጠ
  rationale: በዚህ አባባል δικαιόω የሚያመለክተው ‘ትክክል መሆን በውጤት መታየት’ ነው። ቀጥተኛው ‘ጸደቀች’ በዘመናዊ አማርኛ በዚህ ዐውድ ለብዙ አንባቢዎች የሕግ ወይም የድነት ትርጉም ሊያጠብብ ስለሚችል፣ ይህ አገላለጽ ዐውዳዊ ትርጉሙን ያቀርባል።
- source_word: ἡ σοφία
  choice: ጥበብ
  rationale: ግለሰባዊ ምስል የተሰጣትን ጥበብ ያለ ተጨማሪ መለያ ይጠብቃል። የሴት ፆታ ቅጥያዎቹ ‘መሆኗ’ እና ‘ሥራዎቿ’ ይህን ሰውኛ አቀራረብ ያንጸባርቃሉ።
- source_word: ἀπὸ τῶν ἔργων αὐτῆς
  choice: በሥራዎቿ
  rationale: ἀπό ከባለቤት ቅጽ ጋር በዚህ ፈሊጣዊ አጠቃቀም ማስረጃውን ወይም መገለጫውን ያመለክታል፤ ‘በሥራዎቿ’ ቀጥተኛ፣ አጭርና ተፈጥሯዊ ነው።
theological_decisions:
- issue: በመጨረሻው ሐረግ ‘ጥበብ’ ማንን ወይም ምንን እንደምታመለክት
  choice: ‘ጥበብ’ የሚለውን ሰውኛ አገላለጽ ማንነቱን ሳይወስኑ ማቆየት
  alternative: ጥበብን በግልጽ ከኢየሱስ ጋር ወይም ከእግዚአብሔር የማዳን ዕቅድ ጋር ማመሳሰል
  rationale: ጽሑፉ ራሱ መለያውን አይወስንም፤ ስለዚህ የአባባሉን ሥነ ጽሑፋዊ ኃይልና ሥነ መለኮታዊ ውጥረት ሳናጠብብ መጠበቅ ይገባል።
- issue: የመጨረሻው ሐረግ የጽሑፍ ቅርጽ
  choice: የSBLGNTን ἔργων፣ ‘ሥራዎች’፣ በዋናው ጽሑፍ መከተል
  alternative: τέκνων፣ ‘ልጆች’፣ የሚለውን ተለዋጭ ንባብ በዋናው ጽሑፍ መጠቀም
  rationale: የቀረበው የመነሻ ጽሑፍ ἔργων ይላል፤ ታዋቂው ‘ልጆች’ የሚል ተለዋጭ ንባብ ግን ለጽሑፋዊ ግልጽነት በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር አማርኛ ተጠቅሟል። በተናጋሪዎቹ የተሰነዘሩት ‘ሆዳም’ እና ‘ሰካራም’ የስድብ ቃላት ስለሆኑ የምንጩ የወቀሳ ኃይል እንዳይለዝብ ተጠብቀዋል። የመጨረሻው καί በ‘ም’ ተያያዥ ቅጥያ ተተርጉሞ በምንጩ ያልተገለጸ ተቃርኖ አልተጨመረም። የማስታወሻ ምልክቶቹ [a] እና [b] በዋናው ጽሑፍ ተካትተዋል።
