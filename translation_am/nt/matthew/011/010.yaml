id: MAT.11.10
reference: Matthew 11:10
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀οὗτός ἐστιν περὶ οὗ γέγραπται· Ἰδοὺ ἐγὼ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν σου ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/010.yaml
  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face, who will prepare your way before you.’'
translation:
  language: am
  text: ይህ ሰው፣ “እነሆ፣ መልእክተኛዬን በፊትህ እልካለሁ፤ እርሱም መንገድህን ከፊትህ ያዘጋጃል” ተብሎ የተጻፈለት ነው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτός
  choice: ይህ ... ነው
  rationale: አመልካች ተውላጠ ስሙ ዮሐንስን በአጽንዖት የሚለይ ነው፤ ይህ አገላለጽ በአማርኛ ተፈጥሯዊ የመለያ አወቃቀር ነው።
- source_word: περὶ οὗ
  choice: ስለ እርሱ
  rationale: περί ከዘር አመልካች ጋር ያለውን ‘ስለ/በተመለከተ’ ትርጉም በግልጽ ያስተላልፋል።
- source_word: γέγραπται
  choice: ተብሎ የተጻፈለት
  rationale: የቅዱስ መጽሐፍ ጥቅስ መግቢያ መሆኑንና የተጻፈው ነገር ይህን ሰው እንደሚመለከት ያሳያል፤ የፍጹም ተገብሮ ግስ ውጤታዊ ኃይልም ይጠበቃል።
- source_word: Ἰδοὺ
  choice: እነሆ
  rationale: የትንቢታዊውን ጥቅስ ከፍ ያለና ትኩረት የሚጠራ አነጋገር ይጠብቃል።
- source_word: ἀποστέλλω
  choice: እልካለሁ
  rationale: በጥቅሱ ያለውን የአሁን ጊዜ ቅርጽና ቅርብ/ወደፊት ድርጊት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἄγγελόν
  choice: መልእክተኛዬን
  rationale: በዐውዱ የሚጠቀሰው ሰው ዮሐንስ ስለሆነ ‘መልእክተኛ’ የቃሉን ዐውዳዊ ትርጉም ያሳያል፤ ‘መልአክ’ የሰማያዊ ፍጡር ግንዛቤን ሊያስገባ ይችላል።
- source_word: πρὸ προσώπου σου
  choice: በፊትህ
  rationale: በአማርኛ ‘ፊት’ን የያዘው ተፈጥሯዊ አገላለጽ የግሪኩን ግልጽ ምስል ይጠብቃል፤ እንደ ‘ከአንተ ቀድሞ’ ያለውን ፍቺም ያስተላልፋል።
- source_word: κατασκευάσει
  choice: የሚያዘጋጅ
  rationale: የወደፊት ድርጊቱ በአማርኛው አንጻራዊ ሐረግ ውስጥ ተፈጥሯዊ በሆነ መንገድ ተገልጿል።
- source_word: τὴν ὁδόν σου
  choice: መንገድህን
  rationale: የὁδόςን ቀጥተኛ የመንገድ ምስልና ዘይቤያዊ ድምፅ ሁለቱንም ይጠብቃል።
- source_word: ἔμπροσθέν σου
  choice: በፊትህ
  rationale: ‘በፊትህ/ከፊትህ’ የሚለውን ቦታዊ ፍቺ በአጭርና በክብር ባለው አገላለጽ ያሳያል።
theological_decisions:
- issue: በጥቅሱ ውስጥ የተደጋገሙትን πρὸ προσώπου σου እና ἔμπροσθέν σου መተርጎም
  choice: ሁለቱንም ‘በፊትህ’ በማለት በዋናው ጽሑፍ ማቆየት
  alternative: ሁለቱን በአንድ ጊዜ ‘ከአንተ ቀድሞ’ ብሎ በማለስለስ መተርጎም ወይም አንዱን መተው
  rationale: የግሪኩ ጥቅስ ሁለቱንም ሐረጎች ይዟል። መደጋገሙን ማቆየት የመጽሐፍ ቅዱሳዊውን ጥቅስ ቅርጽና አጽንዖት ይጠብቃል፤ በአማርኛም ግልጽ ነው።
translation_notes:
  register: ዘመናዊ፣ ግልጽና የተከበረ መዝገብ ተጠቅሟል። ‘እነሆ’ የትንቢታዊ ጥቅሱን ከፍ ያለ ድምፅ ይጠብቃል፤ የፊት ሐረጎቹ መደጋገም ሆን ተብሎ አልተለሰለሰም።
