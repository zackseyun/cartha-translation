- from: ይህ ስለ እርሱ፣ “እነሆ፣ መንገድህን በፊትህ የሚያዘጋጅ መልእክተኛዬን በፊትህ እልካለሁ” ተብሎ የተጻፈለት ነው።
  to: ይህ ሰው፣ “እነሆ፣ መልእክተኛዬን በፊትህ እልካለሁ፤ እርሱም መንገድህን ከፊትህ ያዘጋጃል” ተብሎ የተጻፈለት ነው።
