  text: ὁ γὰρ ζυγός μου χρηστὸς καὶ τὸ φορτίον μου ἐλαφρόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/030.yaml
  text: For my yoke is kind, and my burden is light.
translation:
  language: am
  text: ምክንያቱም ቀንበሬ ደግ ነው፤ ሸክሜም ቀላል ነው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζυγός
  choice: ቀንበር
  rationale: ቃሉ በቀጥታ ቀንበርን ያመለክታል፤ በዚህ አውድ የጌታነትና የደቀ መዝሙርነት ምሳሌያዊ ስዕልን ይጠብቃል።
- source_word: χρηστός
  choice: ደግ
  rationale: χρηστός እዚህ ‘ለመሸከም ቀላል’ ብቻ ሳይሆን ደግነትን፣ መልካምነትንና ለሰው ተስማሚ መሆንን ሊያመለክት ይችላል፤ ‘ደግ’ ከἐλαφρόν ጋር ያለውን ልዩነትም ይጠብቃል።
- source_word: φορτίον
  choice: ሸክም
  rationale: የሚሸከም ጭነትን በተፈጥሯዊና በተለመደ አማርኛ ይገልጣል።
- source_word: ἐλαφρόν
  choice: ቀላል
  rationale: የክብደት እጥረትን የሚገልጠውን ዋና ትርጉም በቀጥታ ያስተላልፋል።
- source_word: γάρ
  choice: ምክንያቱም
  rationale: ከቀደመው ጥቅስ ጋር ያለውን ምክንያታዊ ግንኙነት በግልጽ ያሳያል።
theological_decisions:
- issue: χρηστόςን እንደ ‘ቀላል’ ወይም ‘ደግ’ መተርጎም
  choice: ደግ
  alternative: ቀላል / ለመሸከም ምቹ
  rationale: ‘ቀላል’ ቢባል በቀጣዩ ἐλαφρόν ጋር ልዩነቱ ይጠፋል። ‘ደግ’ የχρηστόςን ሰፊ የመልካምነትና የዋህነት ገጽታ ሳይገድብ ያቆያል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። ‘ቀንበር’ የመጽሐፍ ቅዱስን ምሳሌያዊ ምስል ለማቆየት ተጠብቋል።
