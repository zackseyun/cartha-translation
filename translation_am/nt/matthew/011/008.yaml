  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἀλλὰ τί ἐξήλθατε ἰδεῖν; ἄνθρωπον ἐν ⸀μαλακοῖς ἠμφιεσμένον; ἰδοὺ οἱ τὰ μαλακὰ φοροῦντες ἐν τοῖς οἴκοις τῶν ⸀βασιλέων ⸀εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/008.yaml
  text: But what did you go out to see? A man dressed in soft clothes? Look[b][a], those who wear soft clothes are in the houses of kings.
translation:
  language: am
  text: ነገር ግን፣ ምን ለማየት ወጣችሁ? ለስላሳ ልብስ የለበሰ ሰው? እነሆ፣ ለስላሳ ልብስ የሚለብሱ በነገሥታት ቤቶች ይገኛሉ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: ነገር ግን
  rationale: ከቀደመው የኢየሱስ ጥያቄ ጋር የሚቀጥለውን ተቃርኖ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τί ἐξήλθατε ἰδεῖν
  choice: ምን ለማየት ወጣችሁ
  rationale: τίን እንደ «ምን» ጠብቆ፣ የἐξήλθατε እና ἰδεῖνን የዓላማ ግንኙነት በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἄνθρωπον
  choice: ሰው
  rationale: ነጠላውን ሰው፣ በአውዱም መጥምቁ ዮሐንስን፣ በቀጥታ ያመለክታል።
- source_word: ἐν μαλακοῖς ἠμφιεσμένον
  choice: ለስላሳ ልብስ የለበሰ
  rationale: μαλακοῖς የሚለውን ተጨባጭ «ለስላሳ» ትርጉምና የἠμφιεσμένονን የለበሰ ሁኔታ ይጠብቃል፤ የቅንጦት ልብስ ስሜቱ ከአውዱ ይገኛል።
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: የትኩረት ጥሪውን በክቡርና በተለመደ መጽሐፍ ቅዱሳዊ አማርኛ ያስተላልፋል።
- source_word: οἱ τὰ μαλακὰ φοροῦντες
  choice: ለስላሳ ልብስ የሚለብሱ
  rationale: φοροῦντες የሚያመለክተውን የተለመደ መልበስ ያሳያል፤ «ለስላሳ ልብስ»ንም ከቀደመው ሐረግ ጋር ወጥ አድርጎ ይደግማል።
- source_word: ἐν τοῖς οἴκοις τῶν βασιλέων εἰσίν
  choice: በነገሥታት ቤቶች ይኖራሉ
  rationale: የግሪኩን ብዙ ቁጥር «የነገሥታት ቤቶች» ይጠብቃል፤ εἰσίνን በአማርኛ አውድ ተፈጥሯዊ በሆነ «ይኖራሉ» ያቀርባል።
