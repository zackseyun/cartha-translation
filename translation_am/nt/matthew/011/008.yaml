review_pass:
  verdict: revise
  source_fidelity: The draft accurately carries the adversative question, the repeated reference to soft clothing, and the plural ‘houses of kings.’ However, «ይኖራሉ» adds the specific sense ‘live/reside,’ whereas εἰσίν simply states that such people are found/are in kings’ houses.
  naturalness: The phrasing is generally clear and appropriate for modern standard Amharic. The second rhetorical question is more natural without repeating «ለማየት», since it is elliptically dependent on the preceding question.
  terminology: «ለስላሳ ልብስ» consistently reflects μαλακοῖς/τὰ μαλακά, retaining its contextual implication of delicate or luxurious attire without over-interpreting it. «እነሆ» suitably conveys ἰδού in a dignified biblical register.
  issues:
  - severity: medium
    issue: «ይኖራሉ» for εἰσίν
    rationale: The Greek verb means ‘are’; ‘live’ narrows the statement to residence. «ይገኛሉ» is natural Amharic and preserves the broader locative assertion.
  - severity: low
    issue: Repeated «ለማየት» in the second question
    rationale: The Greek’s second question consists of the object phrase alone. Removing the repeated purpose phrase produces a more natural rhetorical ellipsis in Amharic while retaining the meaning.
  revised_text: ነገር ግን፣ ምን ለማየት ወጣችሁ? ለስላሳ ልብስ የለበሰ ሰው? እነሆ፣ ለስላሳ ልብስ የሚለብሱ በነገሥታት ቤቶች ይገኛሉ።
  revised_footnotes: []
  revision_rationale: The revision avoids adding the notion of permanent residence and follows the Greek rhetorical ellipsis more closely. It otherwise preserves the draft’s sound lexical choices, modern-standard register, and the source’s repeated concrete wording.
