  text: ጆሮዎች ያለው[a] ይስማ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ጆሮ ያለው ሁሉ ይስማ።” ይህ የአማርኛ ፈሊጣዊ አገላለጽ ነው፤ ግሪኩ በነጠላ ቁጥር የቀረበ አጠቃላይ አገላለጽ ሲጠቀም፣ “ጆሮዎች” የሚለው ቃል ግን በብዙ ቁጥር ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: ያሉት
  rationale: መስተዋድዱና የአሁን ጊዜ አንቀጸ ግስ በስም ምትክ በመሆን ጆሮዎች ያሉትን ማንኛውንም ሰው በነጠላ ቁጥር ያመለክታሉ። “ያሉት” በዘመናዊ አማርኛ ተፈጥሯዊ ሆኖ ይህን ነጠላና አጠቃላይ ኃይል ይጠብቃል።
- source_word: ὦτα
  choice: ጆሮዎች
  rationale: የግሪኩ ቃል ብዙ ቁጥር ስለሆነ “ጆሮዎች” ቅርጹን በቀጥታ ይጠብቃል፤ አውዱም በጥንቃቄ የመስማትና ትርጉሙን የመቀበል ጥሪን ያመለክታል።
- source_word: ἀκουέτω
  choice: ይስማ
  rationale: የሦስተኛ መደብ ነጠላ ትእዛዛዊ ግስን በተፈጥሯዊ አማርኛ ያስተላልፋል። “መስማት” ድምፅን ከመቀበል ባለፈ ትኩረት ሰጥቶ መቀበልንም ሊያካትት ስለሚችል የምንጩን ስፋት ይጠብቃል።
theological_decisions:
- issue: በነጠላ ቁጥር የቀረበ አጠቃላይ አገላለጽ
  choice: ጆሮዎች ያሉት ይስማ።
  alternative: ጆሮ ያለው ሁሉ ይስማ።
  rationale: ግሪኩ በሰዋስው ወንድ ፆታና ነጠላ ቁጥር የሆነን አጠቃላይ አገላለጽ ይጠቀማል። ትርጉሙ አንድን የተወሰነ ወንድ ብቻ ሳይሆን ቃሉን ሊሰማ የሚችልን ማንኛውንም ሰው ይጋብዛል። የተመረጠው አገላለጽ የነጠላ ቁጥሩን ኃይልና አጠቃላይ ትርጉሙን አንድ ላይ ይጠብቃል።
translation_notes:
  register: ትርጉሙ አጭር፣ ክብር ያለውና ለዘመናዊ አማርኛ አንባቢ ተፈጥሯዊ ነው። የግሪኩን ብዙ ቁጥር “ጆሮዎች” እና የትእዛዝ ኃይል “ይስማ” በግልጽ ይጠብቃል።
