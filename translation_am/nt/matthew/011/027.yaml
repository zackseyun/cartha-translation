id: MAT.11.27
reference: Matthew 11:27
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς ἐπιγινώσκει τὸν υἱὸν εἰ μὴ ὁ πατήρ, οὐδὲ τὸν πατέρα τις ἐπιγινώσκει εἰ μὴ ὁ υἱὸς καὶ ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/027.yaml
  text: All things have been handed over to me by my Father[a], and no one knows the Son except the Father[b], nor does anyone know the Father except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: am
  text: ሁሉ ነገር ከአባቴ ተሰጥቶኛል፤ ከአብ በቀር ወልድን ማንም አያውቀውም፤ ከወልድና ወልድ ሊገልጥለት ከሚወደው ሰው በቀር አብን ማንም አያውቀውም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάντα
  choice: ሁሉም ነገር
  rationale: የግሪኩን ሰፊና አጠቃላይ ወሰን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: παρεδόθη
  choice: ተሰጥቶኛል
  rationale: ድርጊቱ በአብ መፈጸሙንና ውጤቱ አሁንም መኖሩን በተፈጥሯዊ አማርኛ ይገልጣል፤ ‘በአደራ ተሰጠ’ የሚል ተጨማሪ ገደብ አያስገባም።
- source_word: ὑπὸ τοῦ πατρός μου
  choice: ከአባቴ
  rationale: ተሰጥቶኛል ከሚለው ግስ ጋር የሚስማማ ተፈጥሯዊ የአማርኛ ወኪል/ምንጭ አገላለጽ ሲሆን የግል ዝምድናውንም ይጠብቃል።
- source_word: ἐπιγινώσκει
  choice: ያውቃል
  rationale: በዚህ አውድ የግሪኩ ግስ ጥልቅ የግል እውቀትን ሊያመለክት ቢችልም፣ በግልጽ የሌለውን ‘ሙሉ በሙሉ’ የሚል አጠናካሪ ወደ ዋናው ጽሑፍ እንዳይጨመር ‘ያውቃል’ ተመርጧል።
- source_word: τὸν υἱὸν / τὸν πατέρα
  choice: ወልድን / አብን
  rationale: በኢትዮጵያዊ የመጽሐፍ ቅዱስ አማርኛ የታወቁ፣ የተከበሩና የእርስ በርስ ማዕረጋዊ ግንኙነቱን የሚጠብቁ ቃላት ናቸው።
- source_word: εἰ μὴ
  choice: በቀር
  rationale: ከአሉታዊ አረፍተ ነገር በኋላ ያለውን ማግለያ በቀጥታና በተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι
  choice: ወልድ ሊገልጥለት ከሚፈልገው ሰው
  rationale: የወልድን ፈቃድና የመግለጥ ተነሳሽነት ይጠብቃል፤ የግሪኩን ግልጽ ያልሆነ የβούλομαι ልዩነት በአንድ የዶክትሪን አተረጓጎም አይወስነውም።
- source_word: ἀποκαλύψαι
  choice: ሊገልጥለት
  rationale: መለኮታዊ መግለጥን በቀጥታ የሚያስተላልፍ ተፈጥሯዊ ቃል ነው፤ በአማርኛው የግሱ ግብዓት አብን እንደሚያመለክት ከአውዱ ግልጽ ነው።
theological_decisions:
- issue: በἐπιγινώσκω ውስጥ የሚታሰበው የእውቀት ጥልቀት
  choice: ያውቃል
  alternative: ሙሉ በሙሉ ያውቃል / በጥልቅ ያውቃል
  rationale: ግሱ ጥልቅ ወይም ቅርብ እውቀትን ሊያመለክት ቢችልም የቅጥያው አጠናካሪነት በሁሉም አውድ የግድ አይደለም። ስለዚህ የአብና የወልድ ልዩ የእርስ በርስ እውቀት በማግለያው አወቃቀር እንዲገለጥ ተደርጓል፣ በግልጽ ያልተጻፈ ደረጃ ግን አልተጨመረም።
- issue: በβούληται የተገለጠው የወልድ ፈቃድ
  choice: ሊገልጥለት ከሚፈልገው
  alternative: ሊገልጥለት ከሚመርጠው / ሊገልጥለት ከሚወደው
  rationale: ‘የሚፈልገው’ በዘመናዊ አማርኛ ፈቃድንና ፍላጎትን በአንድነት ይገልጣል። ‘የሚመርጠው’ የምርጫ ሂደትን ከግሪኩ በላይ ሊያጎላ ስለሚችል አልተመረጠም።
- issue: የአብና የወልድ ልዩ የእርስ በርስ እውቀት
  choice: ሁለቱን አንቀጾች በተመጣጣኝ ማግለያ አወቃቀር መተርጎም
  alternative: አንዱን አንቀጽ ከሌላው በበለጠ የዶክትሪን ቃላት ማብራራት
  rationale: ጽሑፉ የሚያቀርበውን ትይዩ አወቃቀርና መለኮታዊ መግለጥ በወልድ ፈቃድ መሆኑን ይጠብቃል፤ ከጽሑፉ በላይ የሆነ የቤተ እምነት ቃላት አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። ‘አባቴ’ የቀጥታ የዝምድና ንግግሩን ይጠብቃል፤ ‘አብ/ወልድ’ ደግሞ የትይዩ ማዕረጋቱን ክብርና በአማርኛ መጽሐፍ ቅዱሳዊ ንባብ ያላቸውን ተለምዶ ይጠብቃሉ። በዋናው ጽሑፍ ያልተጠቀሰ የግርጌ ማስታወሻ የለም።
