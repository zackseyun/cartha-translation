  yaml_path: translation/nt/matthew/011/013.yaml
  text: For all the prophets and the Law prophesied until John[a].
translation:
  language: am
  text: ምክንያቱም ነቢያት ሁሉና ሕጉ እስከ ዮሐንስ ድረስ ትንቢት ተናገሩ[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እስከ ዮሐንስ ዘመን ድረስ»። ሐረጉ ዮሐንስን የትንቢታዊው ምስክርነት ፍጻሜ አድርጎ ሊያቀርበው ወይም የሽግግሩን ወሰን ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: ሁሉ
  rationale: ከ«ነቢያት» ጋር በመያያዝ መላውን የነቢያት ስብስብ ያመለክታል፤ «ሁሉ» ተፈጥሯዊና ትክክለኛ አተረጓጎም ነው።
- source_word: γὰρ
  choice: ምክንያቱም
  rationale: ከቀደመው ንግግር ጋር ያለውን የማብራሪያና የምክንያት ግንኙነት በዘመናዊ አማርኛ በግልጽ ያሳያል።
- source_word: οἱ προφῆται
  choice: ነቢያት
  rationale: በእግዚአብሔር ስም ትንቢታዊ መልእክት ለሚናገሩት መደበኛውና የታወቀው አማርኛ ቃል ነው።
- source_word: ὁ νόμος
  choice: ሕጉ
  rationale: አጠቃላይ ሕግን ሳይሆን የእስራኤልን የቅዱሳት መጻሕፍት ክፍል፣ ማለትም የሙሴን ሕግ፣ እንደሚያመለክት የተወሰነው «ሕጉ» ያሳያል።
- source_word: ἕως Ἰωάννου
  choice: እስከ ዮሐንስ ድረስ
  rationale: ጊዜያዊውን ወሰን በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ዮሐንስ በዚያ ዘመን ውስጥ መካተቱን ወይም የሽግግሩን ወሰን ብቻ ማመልከቱን በግድ አይወስንም።
- source_word: ἐπροφήτευσαν
  choice: ትንቢት ተናገሩ
  rationale: የግሱን ንቁ ትንቢታዊ ተግባር በቀጥታ ያስተላልፋል፤ «ሕጉ»ም ከነቢያት ጋር የግሱ ባለቤት ሆኖ መቅረቡን በመጠበቅ የጽሑፉን ሰውኛ አድርጎ የመናገር ኃይል ይጠብቃል።
theological_decisions:
- issue: ὁ νόμος አጠቃላይ ሕግን ወይስ የቅዱሳት መጻሕፍትን ክፍል ማመልከቱ
  choice: ሕጉ
  alternative: ሕግ
  rationale: ከ«ነቢያት» ጋር ያለው ጥምረት የእስራኤልን የተቀበለ የቅዱሳት መጻሕፍት ምስክርነት ያመለክታል፤ የተወሰነው ቅጽ ይህን ያሳያል።
- issue: ἕως Ἰωάννου ዮሐንስን በትንቢታዊው ዘመን ውስጥ ያካትታል ወይስ የዘመኑን ፍጻሜ ብቻ ያመለክታል
  choice: እስከ ዮሐንስ ድረስ
  alternative: እስከ ዮሐንስ ዘመን ድረስ
  rationale: የግሪኩ ሐረግ ዮሐንስ የትንቢታዊ ምስክርነቱ ፍጻሜ መሆኑን ወይም የሽግግሩን ወሰን ማመልከቱን በሙሉ አይወስንም፤ የተመረጠው አተረጓጎም ይህን አሻሚነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ሕጉ» የቅዱሳት መጻሕፍት ስያሜ መሆኑን ያመለክታል፤ «ትንቢት ተናገሩ» ደግሞ ሕጉንና ነቢያቱን በአንድ ግስ ሥር በማቆየት የግሪኩን አወቃቀር ጠብቋል።
