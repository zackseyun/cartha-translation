  text: ἦλθεν γὰρ Ἰωάννης μήτε ἐσθίων μήτε πίνων, καὶ λέγουσιν· Δαιμόνιον ἔχει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/018.yaml
  text: For John came neither eating nor drinking[a], and they say, ‘He has a demon.’
translation:
  language: am
  text: ምክንያቱም ዮሐንስ ሳይበላም ሳይጠጣም መጣ፤ “ጋኔን አለበት” ይላሉ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦλθεν
  choice: መጣ
  rationale: የግሱን የተፈጸመ መምጣትና ዮሐንስ በሕዝብ ፊት መታየቱን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: γὰρ
  choice: -ና
  rationale: ቁጥሩ ለቀደመው ንግግር የሚሰጠውን ማብራሪያዊ ግንኙነት በአማርኛ የዓረፍተ ነገሩ ቅንብር ውስጥ በተፈጥሯዊ ሁኔታ ያቀርባል።
- source_word: Ἰωάννης
  choice: ዮሐንስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደው የስሙ ቅርጽ ነው።
- source_word: μήτε ἐσθίων μήτε πίνων
  choice: ሳይበላም ሳይጠጣም
  rationale: የμήτε...μήτεን ትይዩ አሉታዊ አወቃቀር ይጠብቃል፤ በግሪኩ የሌሉትን እንጀራና ወይን የሚሉ ዝርዝሮች አይጨምርም።
- source_word: καὶ λέγουσιν
  choice: ይላሉ
  rationale: የግሪኩን ሕያው የአሁን ጊዜና ያልተገለጸውን ብዙ ቁጥር ባለቤት ሳይወስን ይጠብቃል።
- source_word: Δαιμόνιον ἔχει
  choice: ጋኔን አለበት
  rationale: ‘ጋኔን አለው’ ከሚለው ግድፈት ይልቅ በዘመናዊ አማርኛ ተፈጥሯዊ ሆኖ፣ የግሪኩን ‘ጋኔን አለው’ የሚል ቀጥተኛ ፈሊጥ ያቀርባል፤ ‘በጋኔን ተይዟል’ የሚለውን የበለጠ ትርጓሜያዊ አቀራረብ አያስገባም።
theological_decisions:
- issue: Δαιμόνιον ἔχει የሚለውን ክስ መተርጎም
  choice: ጋኔን አለበት
  alternative: በጋኔን ተይዟል
  rationale: ንግግሩ በዮሐንስ ላይ የቀረበ ክስ እንጂ የተራኪው ማረጋገጫ አይደለም። ቀጥተኛው አቀራረብ የምንጩን ቃላት ይጠብቃል፣ ከግሪኩም በላይ የሆነ ሥነ መለኮታዊ ትርጓሜ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ አጭርና ትይዩ አወቃቀር ተጠብቋል። የእንግሊዝኛው ማስታወሻ ትርጉማዊ አማራጭን ቢጠቅስም፣ ‘ጋኔን አለበት’ በአማርኛ ግልጽና ተፈጥሯዊ ስለሆነ የእግር ማስታወሻ አላስፈለገም።
