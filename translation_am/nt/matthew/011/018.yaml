  rationale: The revision changes only the rendering of γάρ, replacing the potentially sequential linker -ና with ‘ምክንያቱም’ to retain the explicit explanatory relation. The concise ascetic description and the literal reported accusation are preserved; no footnote is required because the Amharic wording is clear and does not add an interpretive claim.
