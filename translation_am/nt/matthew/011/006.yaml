  yaml_path: translation/nt/matthew/011/006.yaml
  text: And blessed is the one who is not offended by me[a].
translation:
  language: am
  text: እናም በእኔ የማይሰናከል ብፁዕ ነው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በእኔ ምክንያት ቅር የማይሰኝ» ወይም «በእኔ የማይቀየም»።
    reason: lexical_alternative
lexical_decisions:
- source_word: καί
  choice: —
  rationale: በአማርኛ አጭር ንግግሩን በ«እና» መጀመር ከባድ ስለሚሆን ከቀደመው አውድ ያለው ትስስር በአነጋገሩ ተጠብቋል።
- source_word: μακάριος
  choice: ብፁዕ
  rationale: የብፅዕና ንግግርንና መንፈሳዊ ክብደቱን ይጠብቃል፤ «ደስተኛ» ከሚለው የግል ስሜት ትርጉም የሰፋ ነው።
- source_word: ὃς ἐὰν μὴ
  choice: የማይ… ሰው
  rationale: ማንኛውንም ሰው የሚመለከተውን ሁኔታዊና አጠቃላይ አገላለጽ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: σκανδαλισθῇ
  choice: የማይሰናከል
  rationale: የመሰናከልን ምስላዊ ኃይል ይጠብቃል፤ በአማርኛም በእምነት መደናቀፍን ወይም መሸሽን ሊያመለክት ይችላል።
- source_word: ἐν ἐμοί
  choice: እኔን ምክንያት አድርጎ
  rationale: ኢየሱስ የመሰናከሉ አጋጣሚ ወይም ምክንያት መሆኑን በተፈጥሯዊ አማርኛ ያሳያል፤ «በእኔ» ብቻ ከሚለው የጠራ ነው።
theological_decisions:
- issue: የσκανδαλισθῇን ኃይል እንደ ተራ ስሜታዊ ቅሬታ የማቅለል አደጋ
  choice: በዋናው ጽሑፍ «የማይሰናከል» የሚለውን ምስላዊ አገላለጽ መጠበቅ
  alternative: በእኔ የማይቀየም / በእኔ ምክንያት የማይከፋው
  rationale: ቃሉ ከስሜታዊ ቅሬታ በላይ በኢየሱስ ምክንያት በእምነት መደናቀፍን ወይም ወደ ኋላ ማለትን ሊያካትት ይችላል። ምስሉን መጠበቅ ይህን መለኮታዊ ውጥረት አይዘጋውም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። «ብፁዕ» የመጽሐፍ ቅዱሳዊ ብፅዕናን ክብደት ሲጠብቅ፣ «የማይሰናከል» ዋናውን ምስልና ሆን ብሎ ያልተፈታውን የትርጉም ስፋት ይጠብቃል።
