  rationale: The revision restores the connective, replaces an awkward causal expansion with direct «በእኔ», and retains «የማይሰናከል» as the main-text equivalent of σκανδαλισθῇ. The alternatives in the footnote indicate the offense sense without making it the sole interpretation.
