lexical_decisions:
- source_word: καὶ εἰ θέλετε δέξασθαι
  choice: ይህን ለመቀበል ፈቃደኞች ከሆናችሁ
  rationale: θέλετε ከድርጊት ስም δέξασθαι ጋር ፈቃደኛነትን ያመለክታል። በግሪኩ ያልተገለጸው ተሳቢ በአማርኛ ለተፈጥሯዊነት ‘ይህን’ ተብሎ ቀርቧል፤ ይህም ኢየሱስ ስለ ዮሐንስ የተናገረውን መቀበልን ያመለክታል። καὶ በዚህ አውድ በተፈጥሯዊ አማርኛ በማያስፈልግ ጊዜ በተናጠል አልተተረጎመም።
- source_word: αὐτός
  choice: እርሱ
  rationale: ተውላጠ ስሙ ወደ መጥምቁ ዮሐንስ ይመለሳል፤ ‘እርሱ ነው’ የሚለው አወቃቀር የግሪኩን አጽንዖት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐστιν Ἠλίας
  choice: ኤልያስ እርሱ ነው
  rationale: ግሪኩ መታወቂያውን በቀጥታ ስለሚገልጽ ‘ኤልያስ’ ተብሎ ቀርቧል፤ ‘ኤልያስን ይመስላል’ ወይም ‘የኤልያስን ሚና ይፈጽማል’ ተብሎ አልለዘበም።
- source_word: ὁ μέλλων ἔρχεσθαι
  choice: ይመጣ ዘንድ የነበረው
  rationale: μέλλων ከἔρχεσθαι ጋር ትንቢታዊ መጠበቅን ያሳያል። ‘ይመጣ ዘንድ የነበረው’ በንግግሩ ጊዜ ከነበረው እይታ አንጻር የተጠበቀውን መምጣት ያስተላልፋል፤ ፈጣን ወይም ቅርብ መምጣትን አይጨምርም።
theological_decisions:
- issue: መጥምቁ ዮሐንስ ከኤልያስ ጋር መለየቱ
  choice: ‘ኤልያስ እርሱ ነው’ የሚለውን ቀጥተኛ መግለጫ ከ‘ለመቀበል ፈቃደኞች ከሆናችሁ’ ከሚለው ቅድመ ሁኔታ ጋር ማቆየት
  alternative: ‘የኤልያስን ሚና ይፈጽማል’ ወይም ‘እንደ ኤልያስ ነው’
  rationale: αὐτός ἐστιν Ἠλίας ቀጥተኛ መለያ ነው፤ ሆኖም ኢየሱስ ይህን ከሰሚዎቹ ፈቃደኛ መቀበል ጋር ያያይዘዋል። ትርጉሙ ይህን ኃይልና ከሚልክያስ ትንቢት ጋር ያለውን የትርጓሜ ውጥረት ሳይፈታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ዘንድ’ የሚለው አወቃቀር ትንቢታዊውን ቃና ሳይጠፋ በቅዱስ ቃሉ አጠቃቀም የተለመደ ነው።
