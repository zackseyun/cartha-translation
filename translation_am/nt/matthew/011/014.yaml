  text: And if you are willing to accept it[b][a], he is Elijah who is to come.
translation:
  language: am
  text: ይህን ለመቀበል ፈቃደኞች ከሆናችሁ፣[a] እርሱ ሊመጣ የሚጠበቀው ኤልያስ ነው።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ይህን ለመቀበል ፈቃዳችሁ ከሆነ።”
    reason: lexical_alternative
  - marker: b
    text: ይህ ቃል መጥምቁ ዮሐንስን ከሊመጣ የሚጠበቀው ኤልያስ ጋር በቀጥታ ያለያል፤ ሚልክያስ 4፥5 እና ማቴዎስ 17፥10–13ን ያነጻጽሩ።
