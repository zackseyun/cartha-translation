base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/039.yaml
  text: And going a little farther[a], he fell on his face, praying and saying, “My Father, if it is possible, let this cup pass from me; yet not as I will[b], but as you will.”
translation:
  language: am
  text: ጥቂት ወደ ፊት ሄዶ በፊቱ ተደፍቶ ወደቀ[a]፤ እንዲህም ሲል ጸለየ፦ “አባቴ ሆይ፣ የሚቻል ከሆነ ይህ ጽዋ[b] ከእኔ ይለፍ፤ ነገር ግን እኔ እንደምፈልገው ሳይሆን፣ አንተ እንደምትፈልገው ይሁን።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ፊቱን ወደ መሬት አድርጎ ወደቀ።”
    reason: lexical_alternative
  - marker: b
    text: “ይህ ጽዋ” የተመደበን ዕጣ፣ በተለይም መከራን፣ የሚያመለክት መጽሐፍ ቅዱሳዊ ምስል ነው፤ ማቴዎስ 20፥22 እና 26፥42ን ይመልከቱ።
    reason: cross_reference
lexical_decisions:
- source_word: προελθὼν μικρὸν
  choice: ጥቂትም ወደ ፊት ሄዶ
  rationale: የአኦሪስት አሳታፊውን ቅድመ ድርጊትና μικρόν የሚያመለክተውን አጭር ርቀት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ
  choice: በግንባሩ ወደቀ
  rationale: የመሬት ላይ በፊት መውደቅንና የስግደት አቀማመጥን በአጭርና ግልጽ አገላለጽ ያሳያል።
- source_word: προσευχόμενος καὶ λέγων
  choice: እንዲህም ሲል ጸለየ
  rationale: ሁለቱን በአንድ ጊዜ የሚከናወኑ ድርጊቶች በተፈጥሯዊ የአማርኛ ትረካ ያቀርባል።
- source_word: Πάτερ μου
  choice: አባቴ ሆይ
  rationale: የባለቤትነት ቅርበቱንና የጥሪውን ክብር ሳይጨምር ይጠብቃል።
- source_word: εἰ δυνατόν ἐστιν
  choice: የሚቻል ከሆነ
  rationale: ሙሉውን የሁኔታ አንቀጽ በዘመናዊና ግልጽ አማርኛ ይሰጣል።
- source_word: παρελθάτω ἀπ’ ἐμοῦ
  choice: ከእኔ ይለፍ
  rationale: የልመና ትእዛዛዊ ቅርጹንና ‘ከእኔ’ የሚለውን የመለየት ሐሳብ ይጠብቃል።
- source_word: τὸ ποτήριον τοῦτο
  choice: ይህ ጽዋ
  rationale: የምንጩን ቀጥተኛ ምስል እና ስለ ተመደበ መከራ ያለውን መጽሐፍ ቅዱሳዊ ጥልቀት ይጠብቃል።
- source_word: πλὴν
  choice: ነገር ግን
  rationale: ቀዳሚውን ልመና በጠንካራ ንጽጽር የሚያስተካክለውን ትርጉም በተለመደ አማርኛ ያሳያል።
- source_word: οὐχ ὡς ἐγὼ θέλω ἀλλ’ ὡς σύ
  choice: አንተ እንደምትፈልገው እንጂ እኔ እንደምፈልገው አይሁን
  rationale: በግሪክ ያለውን ንጽጽር እና በሁለተኛው ክፍል የተተወውን ግስ በአማርኛ ግልጽ ያደርጋል፤ የኢየሱስን ፈቃድ ለአብ ፈቃድ መገዛትም ሳያደበዝዝ ያቀርባል።
theological_decisions:
- issue: በኢየሱስ ጸሎት ውስጥ ያለው የ‘ጽዋ’ ምሳሌ
  choice: በዋናው ጽሑፍ ‘ይህ ጽዋ’ የሚለው ቀጥተኛ ምስል ተጠብቋል።
  alternative: ይህ መከራ፤ ይህ ዕጣ
  rationale: ποτήριον ቀጥተኛ ቃል ሆኖ በምሳሌያዊ ሁኔታ ተመድቦ የሚሰጥን ዕጣ፣ በተለይም መከራን፣ ያመለክታል። ምስሉን መጠበቅ ትርጉሙን አስቀድሞ ከመወሰን ይቆጠባል።
- issue: የኢየሱስ ፈቃድና የአብ ፈቃድ ግንኙነት
  choice: ሁለቱም θέλω በ‘እንደምፈልገው/እንደምትፈልገው’ ተተርጉመው ንጽጽሩ ተጠብቋል።
  alternative: እኔ እንደምወደው ሳይሆን አንተ እንደምትወደው
  rationale: አገላለጹ የኢየሱስን እውነተኛ ፈቃድና ለአብ ፈቃድ መገዛቱን በአንድነት ያቆያል፤ ውጥረቱን ወደ ተራ ምርጫ አያቀልለውም።
