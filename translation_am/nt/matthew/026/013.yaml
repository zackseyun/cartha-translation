  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὅπου ἐὰν κηρυχθῇ τὸ εὐαγγέλιον τοῦτο ἐν ὅλῳ τῷ κόσμῳ, λαληθήσεται καὶ ὃ ἐποίησεν αὕτη εἰς μνημόσυνον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/013.yaml
  text: Truly I tell you, wherever this good news is proclaimed in the whole world, what this woman has done will also be spoken of in memory of her.
translation:
  language: am
  text: እውነት እላችኋለሁ፤ ይህ የምሥራች[a] በዓለም ሁሉ በሚሰበክበት ስፍራ ሁሉ፣ ይህች ሴት ያደረገችውም ለእርሷ መታሰቢያ እንዲሆን ይነገራል።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ይህ ወንጌል።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “እርሷን ለማስታወስ ይነገራል።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: እውነት
  rationale: የኢየሱስን የተከበረ እና አጽንዖት ያለው ማረጋገጫ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: λέγω ὑμῖν
  choice: እላችኋለሁ
  rationale: ቀጥተኛውን የብዙ ሰዎች አድራሻ በአጭርና ተፈጥሯዊ መልኩ ይጠብቃል።
- source_word: ὅπου ἐὰν
  choice: በሚሰበክበት ቦታ ሁሉ
  rationale: የግሪኩን ያልተወሰነ የቦታ ሐሳብ፣ ‘የትም/ባለበት ሁሉ’ የሚለውን፣ በግልጽ አማርኛ ያቀርባል።
- source_word: κηρυχθῇ
  choice: በሚሰበክበት
  rationale: የሕዝብ ፊት ማወጅን የሚያመለክተውን ተገብሮአዊ ቅርጽ ይጠብቃል፤ ‘መስበክ’ም በአማርኛ ለወንጌል ስርጭት የተለመደ ነው።
- source_word: τὸ εὐαγγέλιον τοῦτο
  choice: ይህ የምሥራች
  rationale: εὐαγγέλιον የሚያመለክተውን ‘መልካም ዜና’ በተለመደና ክቡር የአማርኛ ቃል ይገልጻል፤ ‘ይህ ወንጌል’ የሚለውም ትክክለኛ ባህላዊ አማራጭ ነው።
- source_word: ἐν ὅλῳ τῷ κόσμῳ
  choice: በዓለም ሁሉ
  rationale: ሰፊውንና ዓለም አቀፋዊውን የቦታ ወሰን በቀጥታ ያስተላልፋል።
- source_word: λαληθήσεται
  choice: ይነገራል
  rationale: የወደፊት ጊዜ ተገብሮአዊውን ሐሳብ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ὃ ἐποίησεν αὕτη
  choice: ይህች ሴት ያደረገችው
  rationale: αὕτη በአውዱ የተጠቀሰችውን ሴት እንደሚያመለክት ግልጽ ያደርጋል፤ ὃ ደግሞ ድርጊቷን ይወክላል።
- source_word: εἰς μνημόσυνον αὐτῆς
  choice: እርሷን ለማስታወስ
  rationale: የመታሰቢያና የመታወስ ኃይልን በተፈጥሯዊ አማርኛ ያቀርባል፤ ‘ለእርሷ መታሰቢያ እንዲሆን’ የሚለውን አማራጭ ግን አይሽርም።
theological_decisions:
- issue: የεὐαγγέλιον አተረጓጎም
  choice: የምሥራች
  alternative: ወንጌል
  rationale: ‘የምሥራች’ የግሪኩን መሠረታዊ ትርጉም ለዘመናዊ አንባቢ በቀጥታ ያሳያል፤ ‘ወንጌል’ ግን የተለመደና ሥነ መለኮታዊ ክብደት ያለው አማራጭ ስለሆነ በማስታወሻ ተጠብቋል።
- issue: የεἰς μνημόσυνον αὐτῆς ዓላማ/ውጤት
  choice: እርሷን ለማስታወስ
  alternative: ለእርሷ መታሰቢያ እንዲሆን
  rationale: ዋናው ጽሑፍ የመታወስን ዓላማ በቀላሉ ያቀርባል፤ የግሪኩ ሐረግ ግን ድርጊቱ መታሰቢያ እንደሚሆንላት ሊገለጽ ስለሚችል ይህ ትርጉም በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለሕዝብ ንባብ ተስማሚ የሆነ አገላለጽ ተመርጧል። ‘እውነት እላችኋለሁ’ የኢየሱስን አጽንዖታዊ መግቢያ ይጠብቃል፤ የዓረፍተ ነገሩ አወቃቀር ደግሞ በአማርኛ ተፈጥሯዊ ሆኖ የግሪኩን ትይዩ ሐሳቦች አያጠፋም።
