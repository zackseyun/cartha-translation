lexical_decisions:
- source_word: πῶς
  choice: እንዴት
  rationale: የንግግሩን ጥያቄያዊና አጽንዖታዊ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: οὖν
  choice: ታዲያ
  rationale: ከቀደመው ስለ ኃይል መጠቀም ከተነገረው ሐሳብ ጋር ያለውን ድምዳሜያዊ ግንኙነት በተፈጥሯዊ መንገድ ያሳያል።
- source_word: πληρωθῶσιν
  choice: ይፈጸማሉ
  rationale: የቅዱሳት መጻሕፍት ቃል ወደ ፍጻሜ መድረሱን የሚገልጽ የተለመደ አገላለጽ ነው፤ በጥያቄው ውስጥ ያለው የእድል ወይም የማይቻልነት ስሜት በአጠቃላይ አወቃቀሩ ይታያል።
- source_word: αἱ γραφαὶ
  choice: ቅዱሳት መጻሕፍት
  rationale: ቃሉ በብዙ ቁጥር የእስራኤልን ቅዱሳን ጽሑፎች ስለሚያመለክት፣ በአማርኛ የተለመደው ግልጽ መጠሪያ ተመርጧል።
- source_word: ὅτι
  choice: እንዳለበት
  rationale: ὅτι የመጻሕፍትን ይዘት ያስገባል፤ በአማርኛ ይህን ይዘት ከ‘የሚናገሩት’ ጋር በተፈጥሯዊ ሰዋስው ያገናኛል።
- source_word: οὕτως
  choice: እንዲህ
  rationale: በዚያ ጊዜ እየተከናወኑ ያሉትን የእስርና የመከራ ሁኔታዎች የሚያመለክት ቀጥተኛና ዘመናዊ አገላለጽ ነው።
- source_word: δεῖ
  choice: መሆን እንዳለበት
  rationale: በጽሑፉ ያለውን አስፈላጊነት ያስጠብቃል፤ ምንጩን ከግሪኩ በላይ በመጨመር አይተረጉምም።
- source_word: γενέσθαι
  choice: መሆን
  rationale: በዚህ አውድ የክስተቶቹን መፈጸም በተፈጥሯዊና አጭር አማርኛ ይገልጻል።
