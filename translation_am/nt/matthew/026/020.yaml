lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: ማታም በሆነ ጊዜ
  rationale: የግሪኩ የጊዜ አመልካች ሐረግ ድርጊቱ በማታ መሆኑን ያሳያል፤ ይህ አተረጓጎም በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: ἀνέκειτο
  choice: ለማዕድ ተቀመጠ
  rationale: ግሱ በጥንቱ የምግብ አቀራረብ ልማድ መሠረት ተደግፎ ወይም ተጋድሞ ለመብላት መቀመጥን ያመለክታል። «ተጋደመ» በዘመናዊ አማርኛ ተራ መተኛትን ሊያስመስል ስለሚችል፣ የማዕድ አውዱን በግልጽ የሚያሳየው «ለማዕድ ተቀመጠ» ተመርጧል።
- source_word: μετὰ
  choice: ጋር
  rationale: ከዘር ቅጥያው ጋር ያለው μετά አብሮነትን ያመለክታል፤ «ጋር» ቀጥተኛና ተፈጥሯዊ አቻው ነው።
- source_word: τῶν δώδεκα μαθητῶν
  choice: ከአሥራ ሁለቱ ደቀ መዛሙርት
  rationale: በSBLGNT ዋና ጽሑፍ μαθητῶν በግልጽ ስለሚገኝ፣ «ደቀ መዛሙርት» ተብሎ ተተርጉሟል። «አሥራ ሁለቱ» የታወቀውን የኢየሱስ ደቀ መዛሙርት ቡድን ያመለክታል።
