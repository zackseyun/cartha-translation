  yaml_path: translation/nt/matthew/026/047.yaml
  text: And while he was still speaking[a], behold, Judas, one of the twelve, came, and with him a large crowd with swords and clubs[b], from the chief priests and elders of the people.
translation:
  language: am
  text: እርሱ ገና ሲናገር፣ እነሆ፣ ከአሥራ ሁለቱ አንዱ ይሁዳ መጣ፤ ከእርሱም ጋር ሰይፎችና ዱላዎች[b] የያዘ ብዙ ሕዝብ ከካህናት አለቆችና ከሕዝቡ ሽማግሌዎች ዘንድ[a] መጣ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በካህናት አለቆችና በሕዝቡ ሽማግሌዎች ተልኮ።» የግሪኩ ቃል በቀጥታ፣ «ከካህናት አለቆችና ከሕዝቡ ሽማግሌዎች ዘንድ» ይላል።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ «እንጨቶች።» የግሪኩ ቃል በቀጥታ የእንጨት ቁራጮችን ያመለክታል፤ በዚህ አውድ ግን እንደ መሣሪያ የሚያገለግሉ ዱላዎችን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
