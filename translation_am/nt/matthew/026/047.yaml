  choice: እርሱም ገና ሲናገር
  rationale: የግሪኩን በአንድ ጊዜ መከናወን የሚያመለክተውን አገባብ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ «ገና» ἔτιን ይወክላል።
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: የትረካውን ድንገተኛ ትኩረትና ሕያውነት ሳያጋንን የሚጠብቅ የተለመደ የአማርኛ አመልካች ነው።
- source_word: Ἰούδας
  choice: ይሁዳ
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የተለመደው የስሙ ቅርጽ ነው።
- source_word: εἷς τῶν δώδεκα
  choice: ከአሥራ ሁለቱ አንዱ
  rationale: የክፍል ግንኙነቱን በቀጥታና በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἦλθεν
  choice: መጣ
  rationale: የἔρχομαιን ቀላል የትረካ አኦሪስት በቀጥታ ይተረጉማል።
- source_word: ὄχλος πολὺς
  choice: ብዙ ሰዎች
  rationale: ብዛቱን በዘመናዊና ተፈጥሯዊ አማርኛ ያሳያል፤ «ወንበዴ ቡድን» የሚል ተጨማሪ የጥላቻ ፍቺ አያስገባም።
- source_word: μετὰ μαχαιρῶν
  choice: ሰይፍ የያዙ
  rationale: μάχαιρα ሰይፍን ወይም አጭር ሰይፍን ሊያመለክት ቢችልም፣ «ሰይፍ» በዚህ የመያዝ አውድ ሰፊና ግልጽ ቃል ነው።
- source_word: καὶ ξύλων
  choice: ዱላ
