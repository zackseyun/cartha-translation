- source_word: ἀπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων τοῦ λαοῦ
  choice: ከካህናት አለቆችና ከሕዝቡ ሽማግሌዎች ዘንድ
  rationale: ἀπό የምንጭ ወይም የመነሻ ግንኙነትን እንደሚገልጥ ይጠብቃል፤ «ተልከው» የሚለውን በዋናው ጽሑፍ አይጨምርም።
theological_decisions:
