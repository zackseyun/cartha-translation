  text: Ὁ δὲ Πέτρος ⸂ἐκάθητο ἔξω⸃ ἐν τῇ αὐλῇ· καὶ προσῆλθεν αὐτῷ μία παιδίσκη λέγουσα· Καὶ σὺ ἦσθα μετὰ Ἰησοῦ τοῦ Γαλιλαίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/069.yaml
  text: Peter was sitting outside in the courtyard[a], and one servant girl came up to him, saying, “You also were with Jesus the Galilean.”
translation:
  language: am
  text: ጴጥሮስ ግን በግቢው ውስጥ፣ ከቤት ውጭ ተቀምጦ ነበር። አንዲት አገልጋይ ልጃገረድ[a] ወደ እሱ ቀርባ፣ “አንተም ከገሊላዊው ኢየሱስ ጋር ነበርክ” አለችው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አገልጋይት” ወይም “ባሪያ ልጃገረድ።” የግሪኩ παιδίσκη ወጣት ሴት አገልጋይን ሊያመለክት ይችላል፤ አንዳንዴም የባርነት ሁኔታን ያካትታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ግን
  rationale: በትረካው ፍሰት የቦታና የትኩረት ሽግግርን በቀላሉ ያሳያል፤ ጠንካራ ተቃርኖን አያስገድድም።
- source_word: ἐκάθητο ἔξω
  choice: ከቤት ውጭ ተቀምጦ ነበር
  rationale: የግሱን ቀጣይ ያለፈ ሁኔታ በ‘ተቀምጦ ነበር’ ይጠብቃል፤ ‘ከቤት ውጭ’ የሚለውም ከውስጥ ከነበረው ምርመራ አንጻር ቦታውን ግልጽ ያደርጋል።
- source_word: αὐλή
  choice: ግቢ
  rationale: በቤቱ ዙሪያ ወይም መካከል ያለውን ክፍት ግቢ በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል።
- source_word: προσῆλθεν αὐτῷ
  choice: ወደ እሱ ቀርባ
  rationale: ወደ ጴጥሮስ በአካል መቅረቧን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: μία παιδίσκη
  choice: አንዲት አገልጋይ ልጃገረድ
  rationale: μία የምታስተዋውቀውን አንዲት ግለሰብ ይጠብቃል፤ παιδίσκη ደግሞ ወጣት ሴት አገልጋይን፣ አንዳንዴም ባሪያ የሆነችን ሴት ሊያመለክት ስለሚችል የዋናው ጽሑፍ ምርጫ ማኅበራዊ ሚናዋን ያሳያል።
- source_word: λέγουσα
  choice: አለችው
  rationale: የግሪኩ ተያያዥ ተሳቢ ግስ በአማርኛ ቀጥተኛ ንግግርን በተፈጥሯዊ ሁኔታ በሚዘጋው ውሱን ግስ ተተርጉሟል።
- source_word: Καὶ σὺ
  choice: አንተም
  rationale: ጴጥሮስም ከኢየሱስ ጋር ከነበሩት አንዱ መሆኑን የሚያጎላውን καί በ‘-ም’ ይጠብቃል።
- source_word: ἦσθα μετὰ
  choice: ከ… ጋር ነበርክ
  rationale: ግንኙነቱን ያለ ትርጓሜያዊ ማስፋፋት ቀጥታ ይገልጻል።
- source_word: Ἰησοῦ τοῦ Γαλιλαίου
  choice: ገሊላዊው ኢየሱስ
  rationale: Γαλιλαῖος ኢየሱስን የሚለይ የአካባቢ መጠሪያ መሆኑን በአማርኛ የተፈጥሮ ቅደም ተከተል ያቀርባል።
