  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Σὺ εἶπας· πλὴν λέγω ὑμῖν, ἀπ’ ἄρτι ὄψεσθε τὸν υἱὸν τοῦ ἀνθρώπου καθήμενον ἐκ δεξιῶν τῆς δυνάμεως καὶ ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/064.yaml
  text: Jesus said to him[a], “You have said so. But I tell you[c][b], from now on you will see the Son of Man seated at the right hand of Power and coming on the clouds of heaven.”
translation:
  language: am
  text: ኢየሱስም እንዲህ አለው፤ “አንተው አልኸው።[a] ነገር ግን እላችኋለሁ፤ ከአሁን ጀምሮ የሰው ልጅ በኃይል ቀኝ ተቀምጦ፣ በሰማይ ደመናዎች ላይ ሲመጣ ታያላችሁ።[b][c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አንተ እንዳልኸው ነው።” የግሪኩ አነጋገር ማረጋገጫን የሚገልጽ ፈሊጣዊ መልስ ነው።
    reason: lexical_alternative
  - marker: b
    text: “ኃይል” የሚለው እግዚአብሔርን በአክብሮት የሚጠቅስ አጠራር ነው።
    reason: cultural_note
  - marker: c
    text: ይህ አባባል ዳንኤል 7፥13ንና መዝሙር 110፥1ን ያመለክታል።
    reason: cross_reference
lexical_decisions:
- source_word: Σὺ εἶπας
  choice: አንተው አልኸው
  rationale: የግሪኩን አነጋገር በግልጽ ሁኔታ ጠብቆ፣ መልሱ ማረጋገጫ መሆኑን ያሳያል፤ ሆኖም በቀጥታ ‘አዎን’ ብሎ ከምንጩ በላይ አያብራራውም።
- source_word: πλὴν
  choice: ነገር ግን
  rationale: ከአጭሩ መልስ ወደሚከተለው ጥብቅ መግለጫ የሚደረገውን ተቃርኖ ያለው ሽግግር በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀπ’ ἄρτι
  choice: ከአሁን ጀምሮ
  rationale: ከዚህ ጊዜ ወዲህ የሚጀምር ሁኔታን ያመለክታል፤ ወደ አንድ ቅጽበታዊ ክስተት ብቻ አይገድበውም።
- source_word: ὄψεσθε
  choice: ታያላችሁ
  rationale: የወደፊት ጊዜ ቅርጹንና የብዙ ቁጥር አድራሻውን በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: የሰው ልጅ
  rationale: የተለመደውን መጽሐፍ ቅዱሳዊ መጠሪያና ከዳንኤል 7 ጋር ያለውን ድምፀት ይጠብቃል።
- source_word: καθήμενον
  choice: ተቀምጦ
  rationale: ተሳቢውን ቅርጽ ይጠብቃል፤ በዐውዱም የክብርና የሥልጣን ዙፋናዊ አቀማመጥን ሊያመለክት ይችላል።
- source_word: ἐκ δεξιῶν
  choice: በ… ቀኝ
  rationale: የክብር፣ የሥልጣንና የቅርበት መጽሐፍ ቅዱሳዊ ፈሊጥን በተለመደ አማርኛ ያቀርባል።
- source_word: τῆς δυνάμεως
  choice: ኃይሉ
  rationale: የግሪኩን አክብሮታዊ የእግዚአብሔር መጠሪያ ሳይዘረጋ ‘ኃይሉ’ ብሎ ይጠብቃል፤ ዋቢው በማስታወሻ ይብራራል።
- source_word: ἐρχόμενον
  choice: ሲመጣ
  rationale: የመምጣትን እንቅስቃሴና የዳንኤል 7 ድምፀትን ይጠብቃል።
- source_word: ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: በሰማይ ደመናዎች ላይ
  rationale: የመስተዋድዱን ቀጥተኛ ምስልና ከዳንኤል 7፥13 ጋር ያለውን ግንኙነት ይጠብቃል።
theological_decisions:
- issue: Σὺ εἶπας የሚለው የኢየሱስ መልስ ኃይል
  choice: ማረጋገጫውንና የምንጩን ልዩ አነጋገር አብሮ የሚጠብቀው ‘አንተው አልኸው’
  alternative: ቀጥተኛ ‘አዎን’ ወይም መልስ የማይሰጥ አባባል
  rationale: አገላለጹ በዐውዱ ማረጋገጫ ነው፤ ነገር ግን ‘አዎን’ ብቻ ማለት ኢየሱስ የተጠቀመበትን ቃል ያጠፋል፣ እንደ ማምለጫ መልስ መውሰድም ዐውዱን ያዳክማል።
- issue: τῆς δυνάμεως (‘ኃይሉ’) ዋቢ
  choice: ለእግዚአብሔር የተጠቀመ አክብሮታዊ አጠራር ሆኖ በጽሑፉ ‘ኃይሉ’ ተብሎ እንዲቆይ
  alternative: በቀጥታ ‘እግዚአብሔር’ ወይም ‘ኃያሉ’ ብሎ ማብራራት
  rationale: ዋቢው እግዚአብሔር መሆኑ የሚታወቅ ቢሆንም፣ ትርጉሙ የግሪኩን አክብሮታዊ ገደብ ሳያልፍ የምንጩን አጠራር ይጠብቃል።
- issue: ‘ታያላችሁ’ ከመቀመጥና ከመምጣት ጋር ያለው የጊዜ ወሰን
  choice: ዙፋናዊ ከፍታንና በደመና መምጣትን በአንድነት ማቅረብ፣ አንድ የጊዜ ሥርዓት ሳይጫን
  alternative: ሁሉን በቅርብ ጊዜ የተፈጸመ ወይም ወደ ዳግም ምጽአት ብቻ የሚያመለክት ብሎ መገደብ
  rationale: ግሪኩ ሁለቱንም ተሳቢዎች የሚታየው ነገር አድርጎ ያጣምራል፤ ትርጉሙ ይህን የትንቢታዊ ድምፀትና የጊዜ ውጥረት ሳይፈታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ፈሊጥ፣ አክብሮታዊ የመለኮት አጠራርና የዳንኤል/መዝሙር ድምፀት ተጠብቀዋል።
