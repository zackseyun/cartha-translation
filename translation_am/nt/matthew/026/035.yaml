  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Πέτρος· Κἂν δέῃ με σὺν σοὶ ἀποθανεῖν, οὐ μή σε ⸀ἀπαρνήσομαι. ⸀ὁμοίως καὶ πάντες οἱ μαθηταὶ εἶπαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/035.yaml
  text: Peter said to him[a], “Even if I must die with you, I will certainly not deny you.” Likewise all the disciples also said the same.
translation:
  language: am
  text: ጴጥሮስም፣ “ከአንተ ጋር መሞት ቢያስፈልገኝ እንኳ፣ ፈጽሞ አልክድህም።[a]” አለው። ደቀ መዛሙርቱም ሁሉ እንደዚሁ አሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በፍጹም አልክድህም።” በግሪክኛው οὐ μή የሚለው ጠንካራ አሉታዊ አገላለጽ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: አለው
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ ቅርጽ በአማርኛ ትረካ ተፈጥሯዊ በሆነ ያለፈ ጊዜ ተተርጉሟል፤ የተውላጠ ስም ቅጥያውም αὐτῷን ያሳያል።
- source_word: Κἂν δέῃ με
  choice: ቢኖርብኝ እንኳ
  rationale: የመፈጸሙን አስገዳጅነትና የሁኔታውን አሳልፎ መቀበል ‘እንኳ’ በሚለው ተፈጥሯዊ የአማርኛ አቀራረብ ይገልጣል።
- source_word: σὺν σοὶ ἀποθανεῖν
  choice: ከአንተ ጋር መሞት
  rationale: አብሮነትንና ሞትን ቀጥተኛና ተፈጥሯዊ በሆነ አማርኛ ያስተላልፋል።
- source_word: οὐ μή ... ἀπαρνήσομαι
  choice: ፈጽሞ አልክድህም
  rationale: οὐ μή የሚያሳየውን እጅግ ጠንካራ አሉታዊ አጽንዖት ‘ፈጽሞ’ ይጠብቃል፤ ‘አልክድህም’ ደግሞ የወደፊት እምቢታውን በተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: ὁμοίως
  choice: እንደዚሁ
  rationale: ሌሎቹ ደቀ መዛሙርት የጴጥሮስን አባባል በተመሳሳይ ሁኔታ እንደደገሙ ያሳያል።
- source_word: πάντες οἱ μαθηταὶ εἶπαν
  choice: ደቀ መዛሙርቱም ሁሉ ... አሉ
  rationale: πάντες የሚያሳየውን ሙሉነት ይጠብቃል፤ የአማርኛው መድረሻ ‘-ቱ’ በዐውደ ንባቡ የተወሰኑትን ደቀ መዛሙርት ያመለክታል።
theological_decisions:
- issue: የጴጥሮስ እምቢታ ያለው አጽንዖት
  choice: ‘ፈጽሞ አልክድህም’ ተብሎ የοὐ μή ጠንካራ አሉታዊ ኃይል ተጠብቋል።
  alternative: ‘በፍጹም አልክድህም’ ወይም ‘ፈጽሞ አልክድህም’ ያለ ማስታወሻ
  rationale: ቃሉ ጴጥሮስ በራሱ ላይ ያለውን ጽኑ እምነት ያሳያል፤ ንባቡ የሚፈጥረውን ትምክህትና በኋላ የሚሆነውን መካድ መካከል ያለውን ውጥረት ሳይፈታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ደቀ መዛሙርት’ የተለመደውን መጽሐፍ ቅዱሳዊ ቃል ይጠብቃል፤ አገባቡ ግን ከጥንታዊ እና ከከባድ ስነ ቃል ተቆጥቧል።
