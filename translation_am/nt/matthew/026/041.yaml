  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ነቅታችሁ ጠብቁ’ በአውዱ ያለውን ከእንቅልፍ መንቃትና በንቃት መጠበቅ አንድ ላይ ያስተላልፋል።
