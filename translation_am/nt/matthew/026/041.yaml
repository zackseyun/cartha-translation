base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/041.yaml
  text: Stay awake and pray[a], so that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.
translation:
  language: am
  text: ንቁና ጸልዩ፤ ወደ ፈተና[a] እንዳትገቡ። መንፈስ ፈቃደኛ ነው፤ ሥጋ ግን ደካማ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ፈተና” ተብሎ የተተረጎመው የግሪክ ቃል ወደ ኃጢአት የሚያባብል ፈተናን ወይም የሙከራ ጊዜን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: ነቅታችሁ ጠብቁ
  rationale: ብዙ ሰዎችን የሚያዝዝ ቀጣይነት ያለው ትእዛዝ ነው። በጌቴሴማኒ የአካል እንቅልፍንም ሆነ መንፈሳዊ ንቃትን የሚያስታውቀውን ሁለትዮሽ ፍቺ ይጠብቃል።
- source_word: προσεύχεσθε
  choice: ጸልዩ
  rationale: የግሪኩን ብዙ ሰዎችን የሚያዝዝ ትእዛዝ በተፈጥሯዊና ግልጽ አማርኛ ያቀርባል።
- source_word: ἵνα μὴ εἰσέλθητε
  choice: እንዳትገቡ
  rationale: የዓላማና የመከላከል አገባቡን እንዲሁም ‘መግባት’ የሚለውን የምንጩን ምስላዊ አነጋገር ይጠብቃል።
- source_word: πειρασμόν
  choice: ፈተና
  rationale: ቃሉ ወደ ኃጢአት የሚያባብል ፈተናንም ሆነ የሚፈትን መከራን ሊያመለክት ይችላል። ‘ፈተና’ በአማርኛ ይህን ስፋት በአጭር ይጠብቃል።
- source_word: τὸ μὲν πνεῦμα
  choice: መንፈስ
  rationale: ከሥጋ ጋር ያለውን ንጽጽር ይጠብቃል፤ በዚህ አውድ የሰውን ውስጣዊ ፈቃድ ሊያመለክት ቢችልም ቃሉን በትርጓሜ አልተካም።
- source_word: πρόθυμον
  choice: ፈቃደኛ ነው
  rationale: ዝግጁነትንና ፈቃደኝነትን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἡ δὲ σὰρξ
  choice: ሥጋ ግን
  rationale: የግሪኩን ቀጥተኛ ምስላዊ ንጽጽር ይጠብቃል፤ ‘ኃጢአተኛ ተፈጥሮ’ ወይም ‘አካል’ ብሎ በመተርጎም የሰውን ደካማነት በቅድሚያ አይወስንም።
- source_word: ἀσθενής
  choice: ደካማ ነው
  rationale: ከፈቃደኛው መንፈስ ጋር የተቃረነውን የሰው ድካም በግልጽና የተለመደ አማርኛ ያሳያል።
theological_decisions:
- issue: የπνεῦμα ዋቢ
  choice: ‘መንፈስ’ ተብሎ የሰውን ውስጣዊ ፈቃድ የሚያመለክት ንባብ
  alternative: መንፈስ ቅዱስ
  rationale: ከ‘ሥጋ’ ጋር ያለው ንጽጽርና ደቀ መዛሙርቱ በልባቸው ፈቃደኞች ሆነው በተግባር መድከማቸው የሰውን ውስጣዊ ዝንባሌ ያመለክታል። ሆኖም ዋናው ጽሑፍ በትርጓሜ ፈንታ ‘መንፈስ’ የሚለውን ቃል ጠብቋል።
- issue: የσάρξ አተረጓጎም
  choice: ሥጋ
  alternative: አካል፤ ኃጢአተኛ ተፈጥሮ
  rationale: እዚህ የሚታየው የተስፋፋ የጳውሎስ ‘ኃጢአተኛ ተፈጥሮ’ ጽንሰ ሐሳብ ሳይሆን የሰው ሥጋዊ ደካማነት ነው። ‘ሥጋ’ የሚለው ምንጩንና የሥነ መለኮት ውጥረቱን ይጠብቃል።
