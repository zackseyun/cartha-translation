review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the two plural imperatives, the prevention-purpose clause, the ‘enter into’ metaphor, and the balanced contrast of spirit and flesh. However, ነቅታችሁ ጠብቁ renders the single γρηγορεῖτε with two near-overlapping commands and adds a distinct ‘keep guard/watch’ element. A single natural imperative better matches the source.
  naturalness: ነቅታችሁ ጠብቁ is understandable but pleonastic in modern standard Amharic. ንቁና ጸልዩ is concise, idiomatic, and retains both physical wakefulness and vigilance in context. The footnote anchor should immediately follow ፈተና, the word it explains.
  terminology: መንፈስ and ሥጋ appropriately retain the source terms and do not resolve the referent of πνεῦμα as the Holy Spirit or interpret σάρξ as ‘sinful nature.’ ፈተና is suitable for πειρασμόν; its semantic alternatives should be stated without narrowing ‘testing’ to suffering alone.
  issues:
  - severity: medium
    issue: The rendering ነቅታችሁ ጠብቁ duplicates γρηγορεῖτε.
    rationale: The Greek has one imperative, ‘be awake/be watchful.’ The two Amharic verbs may overtranslate it and make the command less natural.
  - severity: low
    issue: The footnote marker is placed after the whole sentence rather than after ፈተና.
    rationale: The note is a lexical note on πειρασμόν/ፈተና and should be anchored directly to that term.
  - severity: low
    issue: The footnote’s መከራ can narrow the alternative sense of πειρασμός.
    rationale: The source alternative is broadly ‘testing’ or ‘trial,’ not necessarily suffering. የሙከራ ጊዜ preserves the broader sense.
