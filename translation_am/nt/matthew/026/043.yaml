- source_word: οἱ ὀφθαλμοὶ
  choice: ዓይኖቻቸው
  rationale: የግሪኩን የባለቤትነት አወቃቀር በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: βεβαρημένοι
  choice: ተከብደው
  rationale: የፍጹም ተደራጊ አንቀጹን ውጤታዊ ሁኔታና የክብደት ምስል ይጠብቃል።
