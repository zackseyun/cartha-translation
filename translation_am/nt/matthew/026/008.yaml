  text: But when the disciples saw it[a], they were indignant, saying, “Why this waste?”
translation:
  language: am
  text: ደቀ መዛሙርቱ ግን ይህን አይተው ተቆጡና፣ “ይህ ብክነት[a] ለምንድን ነው?” አሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ይህ ብክነት ለምን ተደረገ?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: ይህን አይተው
  rationale: ያለፈ ድርጊትን የሚያመለክተው አንቀጽ በተፈጥሯዊ አማርኛ በጊዜያዊ ቅደም ተከተል ተተርጉሟል፤ በግሪኩ ያልተገለጸው ተሳቢ ከአውዱ በመወሰድ «ይህን» ተብሏል።
- source_word: δὲ
  choice: ግን
  rationale: ከቀደመው ድርጊት ወደ ደቀ መዛሙርቱ ተቃራኒ ምላሽ የሚደረገውን ቀላል የትረካ ሽግግር ያሳያል።
- source_word: οἱ μαθηταὶ
  choice: ደቀ መዛሙርቱ
  rationale: በወንጌል ትረካ የተለመደውንና በዘመናዊ አማርኛ ግልጽ የሆነውን ቃል ይጠቀማል፤ በምንጩ የሌለው «የእርሱ» አልተጨመረም።
- source_word: ἠγανάκτησαν
  choice: ተቆጡ
  rationale: ቃሉ ጠንካራ አለመደሰትንና ቁጣን ያመለክታል፤ «ተቆጡ» በዘመናዊ አማርኛ አጭር፣ ግልጽና ከአውዱ ጋር የሚስማማ ነው።
- source_word: λέγοντες
  choice: አሉ
  rationale: የግሪኩን ተያያዥ አንቀጽ በተፈጥሯዊ የአማርኛ ቀጥተኛ ንግግር አወቃቀር ያቀርባል።
- source_word: Εἰς τί
  choice: ለምንድን ነው?
  rationale: «ለምን ዓላማ?» ወይም «ወደ ምን ፍጻሜ?» የሚለውን ጥያቄ በተፈጥሯዊና ቀጥተኛ አማርኛ ያስተላልፋል።
- source_word: ἡ ἀπώλεια αὕτη
  choice: ይህ ብክነት
  rationale: ἀπώλεια ጥፋትን፣ ኪሳራን ወይም ብክነትን ሊያመለክት ቢችልም፣ ውድ ሽቱ መፍሰሱን ከሚመለከተው አውድ ጋር «ብክነት» በትክክል ይስማማል።
