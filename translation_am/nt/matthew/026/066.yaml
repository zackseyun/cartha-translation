lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: ምን ይመስላችኋል?
  rationale: δοκέω ከὑμῖν ጋር በዚህ አውድ አስተያየትን ወይም ፍርድን ለመጠየቅ የተጠቀመ ፈሊጣዊ አነጋገር ነው። ይህ አተረጓጎም ቀጥተኛውን ጥያቄ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: οἱ δὲ ἀποκριθέντες εἶπαν
  choice: እነርሱም መልሰው፣ … አሉ
  rationale: የግሪኩ አሳታፊ ግስና ዋና ግስ አብረው የተሠሩበትን ትረካዊ አገላለጽ በአማርኛ ተፈጥሯዊ በሆነው ‘መልሰው … አሉ’ ቅርጽ ያስተላልፋል፤ δέ ያለውን ቀላል አያያዥነት ‘-ም’ ይወክላል።
- source_word: Ἔνοχος θανάτου
  choice: ሞት ይገባዋል
  rationale: ἔνοχος ከθανάτου ጋር ለሞት መጠየቅን ወይም የሞት ቅጣት የሚገባው መሆንን የሚገልጽ ሕጋዊ ፍርድ ነው። ‘ሞት ይገባዋል’ ይህን በአጭር፣ ተፈጥሯዊና ክቡር አማርኛ ያቀርባል።
- source_word: ἐστίν
  choice: ይገባዋል
  rationale: የግሪኩ አሁናዊ አዋዋሽ ግስ በአማርኛው የተዋሐደ የግስ ቅርጽ ውስጥ ተጠብቋል።
theological_decisions:
- issue: የሸንጎው ውሳኔ ሕጋዊ ኃይል
  choice: ሞት ይገባዋል
  alternative: ለሞት ተጠያቂ ነው
  rationale: ንግግሩ ሸንጎው በኢየሱስ ላይ የሰጠውን የሞት ፍርድ ይዘግባል። ትርጉሙ ይህን የፍርድ ባሕርይ ይጠብቃል፤ ነገር ግን ኢየሱስ በእግዚአብሔር ፊት በእውነት ጥፋተኛ ነበር የሚል ተጨማሪ የሥነ መለኮት ድምዳሜ አያስገባም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ቀጥተኛና ክቡር የአማርኛ አነጋገርን ይጠቀማል። ‘ሞት ይገባዋል’ ለተራው አንባቢ ግልጽ ሲሆን የፍርድ ቤት አውዱንም ይጠብቃል።
