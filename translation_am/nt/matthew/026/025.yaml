  text: ἀποκριθεὶς δὲ Ἰούδας ὁ παραδιδοὺς αὐτὸν εἶπεν· Μήτι ἐγώ εἰμι, ῥαββί; λέγει αὐτῷ· Σὺ εἶπας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/025.yaml
  text: Then Judas, the one betraying him, answered and said, “Surely I am not the one, Rabbi?” He said to him, “You have said so.”
translation:
  language: am
  text: እርሱን አሳልፎ የሚሰጠው ይሁዳም መልሶ፣ “መምህር ሆይ፣ እኔ አይደለሁም አይደል?” አለ። ኢየሱስም፣ “አንተው አልኸው” አለው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: አሳልፎ የሚሰጠው
  rationale: የπαραδίδωμιን ቀጥተኛ ምስል ይጠብቃል፤ በዚህ ዐውድ ክህደቱን ያመለክታል።
- source_word: Μήτι ἐγώ εἰμι
  choice: እኔ አይደለሁም አይደል?
  rationale: μήτι አሉታዊ መልስ የሚጠብቅ ጥያቄ መሆኑን በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: ῥαββί
  choice: መምህር ሆይ
  rationale: የአድራሻውን ክብርና የ‘አስተማሪ’ ትርጉም ለዘመናዊ አንባቢ ግልጽ ያደርጋል።
- source_word: Σὺ εἶπας
  choice: አንተው አልኸው
  rationale: የግሪኩን አጭርና በተወሰነ መጠን አሻሚ ምላሽ ይጠብቃል፤ ትርጉሙን ‘አዎ’ ብሎ አይፈታውም።
theological_decisions:
- issue: የኢየሱስ ምላሽ የማረጋገጫ ደረጃ
  choice: አንተው አልኸው
  alternative: አዎ፣ አንተ ነህ
  rationale: Σὺ εἶπας ማረጋገጫን ሊያመለክት ቢችልም ቀጥተኛ ‘አዎ’ አይደለም፤ የምንጩን የንግግር ውጥረትና አሻሚነት ጠብቀናል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። ‘መልሶ … አለ’ የἀποκριθεὶς … εἶπενን የተፈጥሮ አማርኛ አገላለጽ ይከተላል። ግልጽነት እንዲኖር በመጨረሻው ንግግር የተናጋሪው ስም ‘ኢየሱስ’ ተጨምሯል።
