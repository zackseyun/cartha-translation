review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately preserves all principal Greek elements: Peter and the two sons of Zebedee are retained without supplying their names; παραλαβών is rendered as taking them along; and the ingressive force of ἤρξατο with the two coordinated infinitives is maintained. The rendering of ἀδημονεῖν as «እጅግ መጨነቅ» suitably conveys severe inward distress without importing despair.'
  naturalness: «ከእርሱ ጋር ወስዶ» is understandable, but «አብረውት ይዞ» is more idiomatic modern standard Amharic for taking selected companions along with oneself. Moving the footnote marker to the emotional verbal phrase makes its scope clear.
  terminology: «ማዘን» and «እጅግ መጨነቅ» are natural, solemn, and semantically distinct enough to represent λυπεῖσθαι and ἀδημονεῖν. «ዘብዴዎስ» and «ጴጥሮስ» are appropriate established forms.
  issues:
  - severity: low
    issue: The expression «ከእርሱ ጋር ወስዶ» is slightly less idiomatic than a construction explicitly meaning ‘taking them along with himself.’
    rationale: The Greek participle describes Jesus’ action of bringing the three companions along. «አብረውት ይዞ» expresses this relationship naturally and clearly in Amharic.
  - severity: low
    issue: The lexical-alternative footnote marker is placed after the final punctuation rather than at the emotional phrase to which the note pertains.
    rationale: Placing the anchor immediately after «መጨነቅ» clarifies that the note offers an alternative for the paired emotional expression.
  revised_text: ጴጥሮስንና ሁለቱን የዘብዴዎስ ልጆች አብረውት ይዞ፣ ማዘንና እጅግ መጨነቅ[a] ጀመረ።
  revised_footnotes:
