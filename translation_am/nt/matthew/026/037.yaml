  text: καὶ παραλαβὼν τὸν Πέτρον καὶ τοὺς δύο υἱοὺς Ζεβεδαίου ἤρξατο λυπεῖσθαι καὶ ἀδημονεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/037.yaml
  text: And taking Peter and the two sons of Zebedee with him[a], he began to be sorrowful and deeply distressed.
translation:
  language: am
  text: ጴጥሮስንና ሁለቱን የዘብዴዎስ ልጆች አብረውት ይዞ፣ ማዘንና እጅግ መጨነቅ[a] ጀመረ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ማዘንና መታወክ ጀመረ።»
    reason: lexical_alternative
lexical_decisions:
- source_word: παραλαβὼν
  choice: ከእርሱ ጋር ወስዶ
  rationale: የግሪኩ የአኦሪስት አጋዥ ግስ ኢየሱስ የመረጣቸውን ባልንጀሮች አብረውት እንዲሄዱ መውሰዱን ያመለክታል፤ ይህ አተረጓጎም ትርጉሙን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τοὺς δύο υἱοὺς Ζεβεδαίου
  choice: ሁለቱን የዘብዴዎስ ልጆች
  rationale: የግሪኩን ቀጥተኛ መግለጫ ይጠብቃል፤ በዚህ ቁጥር ያዕቆብና ዮሐንስ የሚሉት ስሞች ስላልተጠቀሱ አልተጨመሩም።
- source_word: ἤρξατο
  choice: ጀመረ
  rationale: ግሱ የስሜታዊው ሁኔታ መጀመርን በግልጽ ያሳያል።
- source_word: λυπεῖσθαι
  choice: ማዘን
  rationale: ግሱ ሐዘንንና ጥልቅ የልብ ሥቃይን ይገልጣል፤ «ማዘን» ቀላል፣ የተከበረና ለዘመናዊ አንባቢ ግልጽ ነው።
- source_word: ἀδημονεῖν
  choice: እጅግ መጨነቅ
  rationale: ቃሉ ከባድ ውስጣዊ ጭንቀትንና ሥቃይን ያመለክታል፤ «እጅግ» የሁለተኛውን ግስ ጥንካሬ ያሳያል እንጂ ወደ ተስፋ መቁረጥ አያጋንነውም።
- source_word: καὶ ... καὶ
  choice: -ና ... -ና
  rationale: ተደጋጋሚው καί ባልንጀሮቹንም ሆነ ሁለቱን ስሜታዊ ግሶች ያስተባብራል፤ የአማርኛው «-ና» ይህን በተፈጥሯዊ ፍሰት ይጠብቃል።
theological_decisions:
- issue: የኢየሱስን ስሜታዊ ሁኔታ ከክርስቶሎጂ አንጻር መግለጽ
  choice: ሁለቱንም ግሶች እውነተኛ ሰብአዊ ሐዘንና ከባድ ጭንቀት እንደሚገልጹ በቀጥታ መተርጎም
  alternative: ስሜታዊ ድካምን ለማስወገድ ንግግሩን ማለዘብ፣ ወይም ከቃላቱ ማስረጃ በላይ «ፍርሃት» ወይም «ተስፋ መቁረጥ» ብሎ ማጋነን
  rationale: ጥምር ግሶቹ የኢየሱስን እውነተኛና ከባድ ሰብአዊ ሥቃይ ያሳያሉ። ትርጉሙ ይህን ሳያለዝብ እና የግሪኩን ማስረጃ ወደ ተስፋ መቁረጥ ሳያጋንን ያቀርባል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ የአጋዥ ግስ ከዋናው ግስ በፊት በተፈጥሯዊ የአማርኛ ቅደም ተከተል ቀርቧል፤ የግለሰቦቹ ስሞች ከምንጩ ውጭ አልተጨመሩም።
