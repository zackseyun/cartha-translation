base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/017.yaml
  text: On the first day of Unleavened Bread[a], the disciples came to Jesus, saying[b], “Where do you want us to prepare for you to eat the Passover?”
translation:
  language: am
  text: በቂጣ በዓል በመጀመሪያው ቀን[a] ደቀ መዛሙርቱ ወደ ኢየሱስ መጥተው፣ “ፋሲካውን እንድትበላ የት እንድናዘጋጅልህ ትፈልጋለህ?” አሉት።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ «እርሾ የሌለው ዳቦ የበዓል ቀን የመጀመሪያው ቀን»። ይህ የግሪኩን አገላለጽ በቀጥታ ያንጸባርቃል፤ ስለ ፋሲካ የጊዜ ቅደም ተከተል ያሉ ውይይቶች በትርጉም ብቻ ሊወሰኑ አይገባም።
    reason: cultural_note
  - marker: b
    text: ግሪኩ «ለአንተ እንድትበላ» የሚል ትርጉምን በተፈጥሮ ያመለክታል። አንዳንድ ትርጉሞች ግን ደቀ መዛሙርቱንም በማካተት «እንድንበላ» ብለው ያቀርባሉ።
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ πρώτῃ τῶν ἀζύμων
  choice: በቂጣ በዓል የመጀመሪያው ቀን
  rationale: የግሪኩን ጊዜ ጠቋሚ አገባብና የበዓሉን ስም በተፈጥሯዊ አማርኛ ያቀርባል፤ δέ ቀላል ማያያዣ ስለሆነ የተለየ ቃል አልተጨመረለትም።
- source_word: τῶν ἀζύμων
  choice: በቂጣ በዓል
  rationale: ἄζυμα እርሾ ያልገባበትን እንጀራና በዚህ ስም የሚጠራውን የአይሁድ በዓል ያመለክታል፤ «በቂጣ በዓል» በአማርኛ የተለመደና አጭር ነው።
- source_word: προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ
  choice: ደቀ መዛሙርቱ ወደ ኢየሱስ ቀርበው
  rationale: προσέρχομαι በዚህ አገባብ «መቅረብ» ማለት ነው፤ የሚቀርቡበትም ሰው ኢየሱስ መሆኑን «ወደ» ያሳያል።
- source_word: λέγοντες
  choice: አሉት
  rationale: የግሪኩ ተውሳከ ግስ ከዋናው ግስ ጋር በተያያዘ ቀጥተኛ ንግግሩን ያስገባል፤ በአማርኛ «አሉት» ተፈጥሯዊ ሲሆን «ጠየቁት» በማለት የንግግሩን ተግባር ከጽሑፉ በላይ አይተረጉምም።
- source_word: Ποῦ θέλεις ἑτοιμάσωμέν σοι
  choice: የት እንድናዘጋጅልህ ትፈልጋለህ?
  rationale: θέλω ፍላጎትን ያሳያል፤ የመጀመሪያ መደብ ብዙ ቁጥር ንዑስ አንቀጹና σοι የሚያሳየው ለኢየሱስ ማዘጋጀት «እንድናዘጋጅልህ» በሚለው ተጠብቋል።
- source_word: φαγεῖν τὸ πάσχα
  choice: የፋሲካውን ምግብ እንድንበላ
  rationale: πάσχα በአገባቡ ሊበላ የሚዘጋጀውን የፋሲካ ምግብ ያመለክታል፤ φαγεῖν ያለው የመብላት ዓላማ በግልጽ አማርኛ ተጠብቋል። የግሪኩ የግስ ቅርጽ በራሱ የተገለጸ የሦስተኛ መደብ ባለቤት ስለሌለው፣ ደቀ መዛሙርቱንና ኢየሱስን የሚያካትተው «እንድንበላ» ተመርጧል።
