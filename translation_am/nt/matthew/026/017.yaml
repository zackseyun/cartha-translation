  rationale: ግሪኩ በግልጽ «የበቂጣ በዓል የመጀመሪያው ቀን» ይላል። የወንጌላትን የፋሲካ የጊዜ ቅደም ተከተል ክርክር ትርጉሙ ብቻውን እንዳይወስን፣ ይህ አገላለጽ ሳይስማማ ወይም ሳይለወጥ ተጠብቋል።
- issue: φαγεῖν የሚለው የግስ ስም ባለቤት
  choice: «እንድንበላ» ብሎ የኢየሱስንና የደቀ መዛሙርቱን የጋራ መብላት ማሳየት
  alternative: «እንድትበላ» ብሎ ኢየሱስን ብቻ ማመልከት
