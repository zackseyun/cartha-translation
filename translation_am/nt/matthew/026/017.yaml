review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the temporal setting, the disciples’ approach, and their request to prepare the Passover. However, «እንድንበላ» makes the disciples (and implicitly Jesus) the expressed subject of eating. In the Greek, σοι (‘for you’) most naturally governs the infinitive φαγεῖν, so the request is to prepare a place for Jesus to eat the Passover. The revised wording preserves this.
  naturalness: «በቂጣ በዓል በመጀመሪያው ቀን» is more idiomatic and grammatically complete than «በቂጣ በዓል የመጀመሪያው ቀን». «መጥተው ... አሉት» is natural modern standard Amharic for the narrative sequence.
  terminology: «በቂጣ በዓል», «ደቀ መዛሙርት», «ኢየሱስ», and «ፋሲካ» are suitable established biblical terms. «ፋሲካውን» retains the Greek’s direct reference while the context of eating naturally identifies the meal; no unnecessary expansion to «የፋሲካ ምግብ» is needed.
  issues:
  - severity: medium
    issue: The translation says «ፋሲካውን እንድንበላ».
    rationale: 'This explicitly assigns eating to ‘us,’ whereas the Greek wording ἑτοιμάσωμέν σοι φαγεῖν places σοι (‘for you’) with the preparation/eating request and is best represented in Amharic as Jesus eating: «እንድትበላ».'
  - severity: low
    issue: The opening temporal phrase lacks the expected Amharic locative form.
    rationale: «በቂጣ በዓል በመጀመሪያው ቀን» is more natural than «በቂጣ በዓል የመጀመሪያው ቀን» while retaining the literal festal expression.
  - severity: low
    issue: Footnote b presents the source-faithful reading as merely an alternative to the draft’s less faithful reading.
    rationale: Once the text is corrected to «እንድትበላ», the note should instead document that some translations understand the infinitive collectively, without making that interpretation the main text.
  revised_text: በቂጣ በዓል በመጀመሪያው ቀን[a] ደቀ መዛሙርቱ ወደ ኢየሱስ መጥተው፣ “ፋሲካውን እንድትበላ የት እንድናዘጋጅልህ ትፈልጋለህ?” አሉት።[b]
