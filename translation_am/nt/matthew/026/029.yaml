    issue: Awkward and potentially confusing double-until construction
    rationale: The draft places 'እስከምጠጣው' before 'እስከዚያ ቀን ድረስ,' yielding an unnatural sequence in Amharic. The Greek means 'until that day when I drink it,' which is more clearly expressed with a relative temporal phrase.
  - severity: low
