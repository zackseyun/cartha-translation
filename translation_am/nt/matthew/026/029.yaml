  register: ዘመናዊ፣ ክብር የተሞላና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ጠንካራ እምቢታ፣ የወይን ፍሬ የሚለው ምስላዊ አገላለጽና καινὸν ያለው አሻሚነት ተጠብቀዋል።
