  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: λέγω δὲ ⸀ὑμῖν, οὐ μὴ πίω ἀπ’ ἄρτι ἐκ τούτου τοῦ γενήματος τῆς ἀμπέλου ἕως τῆς ἡμέρας ἐκείνης ὅταν αὐτὸ πίνω μεθ’ ὑμῶν καινὸν ἐν τῇ βασιλείᾳ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/029.yaml
  text: But I tell you[a], from now on I will certainly not drink from this fruit of the vine until that day when I drink it new with you in the kingdom of my Father.
translation:
  language: am
  text: እኔ ግን እላችኋለሁ፤ ከአሁን ጀምሮ ይህን የወይን ፍሬ በአባቴ መንግሥት ከእናንተ ጋር አዲስ የሆነውን በምጠጣበት በዚያ ቀን ድረስ ፈጽሞ አልጠጣም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: እኔ ግን እላችኋለሁ
  rationale: δέ እዚህ ላይ ቀላል የንግግር ሽግግር ወይም ንጽጽር ያሳያል፤ “ግን” ይህን ሳያጋንን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: οὐ μὴ πίω
  choice: ፈጽሞ አልጠጣም
  rationale: οὐ μή ከአዎንታዊ ንዑስ አንቀጽ ግስ ጋር ጠንካራ የወደፊት ጊዜ እምቢታን ያሳያል፤ “ፈጽሞ” አጽንዖቱን በዘመናዊ አማርኛ ይጠብቃል።
- source_word: ἀπ’ ἄρτι
  choice: ከአሁን ጀምሮ
  rationale: ከአሁኑ ጊዜ ጀምሮ የሚቀጥለውን የጊዜ መነሻ በግልጽና ተፈጥሯዊ አነጋገር ያሳያል።
- source_word: ἐκ τούτου τοῦ γενήματος τῆς ἀμπέλου
  choice: ይህን የወይን ፍሬ
  rationale: γένημα የወይኑን ፍሬ ወይም ምርት ያመለክታል። ንግግሩን “ወይን ጠጅ” ብሎ ከመተርጎም ይልቅ የምንጩን ምስላዊ አገላለጽ ይጠብቃል።
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: እስከዚያ ቀን ድረስ
  rationale: ἐκείνης የተወሰነውን የወደፊት ቀን አጽንዖት ሰጥቶ ያመለክታል።
- source_word: ὅταν αὐτὸ πίνω
  choice: እስከምጠጣው
  rationale: ὅταν ከንዑስ አንቀጽ ግስ ጋር ወደፊት የሚፈጸምን ክስተት ያመለክታል፤ በግሱ ላይ ያለው “-ው” ወደ ወይኑ ፍሬ ይመለሳል።
- source_word: καινὸν
  choice: አዲስ ሆኖ
  rationale: καινός በዓይነት ወይም በባሕርይ አዲስነትን ሊያመለክት ይችላል። “አዲስ ሆኖ” ቅጽሉ ወደ ሚጠጣው ነገር መመለሱን ይጠብቃል፤ ሊኖረው የሚችለው “እንደገና” የሚል ፍቺ በማስታወሻ ቀርቧል።
- source_word: μεθ’ ὑμῶν
  choice: ከእናንተ ጋር
  rationale: አብሮነትን በቀጥታና በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐν τῇ βασιλείᾳ τοῦ πατρός μου
  choice: በአባቴ መንግሥት
  rationale: የግሪኩን የቦታ ወይም የክልል ግንኙነት በግልጽ፣ በክብር የተሞላና ተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: የጽዋውን ይዘት “ወይን ጠጅ” ብሎ በግልጽ መጥራት ወይስ የምንጩን አገላለጽ መጠበቅ
  choice: “የወይን ፍሬ” የሚለው አገላለጽ ተጠብቋል
  alternative: ወይን ጠጅ
  rationale: ግሪኩ οἶνος ሳይሆን “የወይኑ ፍሬ/ምርት” ይላል። ይህን መጠበቅ ከጽሑፉ በላይ የሆነ ሥርዓተ እምነታዊ ዝርዝር እንዳይጨመር ያደርጋል።
- issue: καινὸν በመጪው መንግሥት ግብዣ ያለው ትክክለኛ ፍቺ
  choice: በዋናው ጽሑፍ “አዲስ ሆኖ” ተብሏል
  alternative: እንደገና፤ በአዲስ ሁኔታ
  rationale: ቃሉ በዓይነት ወይም በጥራት አዲስነትን ሊያመለክት ቢችልም፣ ጥቅሱ ዝርዝሩን አይወስንም። ዋናው ጽሑፍ አሻሚነቱን ጠብቆ፣ አማራጩን በማስታወሻ ያቀርባል።
