language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: βαλοῦσα γὰρ αὕτη τὸ μύρον τοῦτο ἐπὶ τοῦ σώματός μου πρὸς τὸ ἐνταφιάσαι με ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/012.yaml
  text: For when she poured this perfume on my body[b][a], she did it to prepare me for burial.
translation:
  language: am
  text: ይህች ሴት ይህን ሽቱ በሰውነቴ ላይ በማፍሰስ ለቀብሬ ሊያዘጋጀኝ አደረገችውና።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለቀብሬ።” የግሪኩ ግስ አስከሬንን ለቀብር የማዘጋጀትን ሐሳብ ያካትታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: βαλοῦσα
  choice: ያፈሰሰችው
  rationale: በዚህ አውድ βάλλω ሽቱን በሰውነት ላይ ማፍሰስን ወይም መቀባትን ያመለክታል፤ ቃል በቃል ‘መወርወር’ ማለት ተፈጥሯዊ አይደለም።
- source_word: γὰρ
  choice: ነውና
  rationale: የሴቲቱን ድርጊት የሚያብራራውን የγάρ ምክንያታዊ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: αὕτη
  choice: ይህች ሴት
  rationale: የግሪኩን ጠቋሚ ኃይል ጠብቆ ግልጽና ተፈጥሯዊ አማርኛ ይሰጣል።
- source_word: μύρον
  choice: ሽቱ
  rationale: μύρον ለመቀባት የሚያገለግል መዓዛ ያለውን ዘይት ወይም ቅባት ያመለክታል፤ ‘ሽቱ’ በዚህ አውድ አጭርና ለዘመናዊ አንባቢ ግልጽ ነው።
- source_word: ἐπὶ τοῦ σώματός μου
  choice: በሰውነቴ ላይ
  rationale: ἐπί ከባለቤት አገባብ ጋር እዚህ በሰውነቱ ላይ የተደረገ ንክኪንና ቦታን ያመለክታል።
- source_word: πρὸς τὸ ἐνταφιάσαι με
  choice: ለቀብሬ ልታዘጋጀኝ
  rationale: πρὸς ከጽሑፋዊ የግስ ስም ጋር ዓላማን ያሳያል፤ ἐνταφιάζω ደግሞ አስከሬንን ለቀብር ማዘጋጀትን ያካትታል።
- source_word: ἐποίησεν
  choice: ያፈሰሰችው … ነው
  rationale: የግሪኩ ዋና ግስ ከተካፋዩ ግስ ጋር ያለው ግንኙነት በአማርኛ ትኩረት ሰጪ አወቃቀር ተፈጥሯዊ ሆኖ ተገልጧል።
theological_decisions:
- issue: ἐνταφιάζω ከኢየሱስ ሞት ጋር ያለው ትርጉም
  choice: የሴቲቱ ድርጊት ኢየሱስን ለቀብር እንደማዘጋጀት ተተርጉሟል።
  alternative: ድርጊቱን በአጭሩ ‘ለቀብሬ’ ብቻ ማለት።
  rationale: ἐνταφιάζω የቀብር ዝግጅትን ወይም ሥርዓተ ቀብርን ያመለክታል፤ ትርጉሙ ይህን ቅድመ ዝግጅት ግልጽ ያደርጋል እንጂ ተጨማሪ የእምነት ትርጓሜ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ሽቱ’ ተፈጥሯዊ ሲሆን የመዓዛ ዘይት/ቅባት ትርጉሙን በአውዱ ይይዛል።
