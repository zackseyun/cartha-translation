id: MAT.26.11
reference: Matthew 26:11
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: πάντοτε γὰρ τοὺς πτωχοὺς ἔχετε μεθ’ ἑαυτῶν, ἐμὲ δὲ οὐ πάντοτε ἔχετε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/011.yaml
  text: For you always have the poor with you[a], but you do not always have me.
translation:
  language: am
  text: ድሆች ሁልጊዜ ከእናንተ ጋር አሉና፤ እኔ ግን ሁልጊዜ ከእናንተ ጋር አልገኝም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντοτε
  choice: ሁልጊዜ
  rationale: ቃሉ ቀጣይነትንና ሁልጊዜ መገኘትን ያመለክታል፤ በሁለቱም ሐረጎች መደገሙንም ይጠብቃል።
- source_word: γὰρ
  choice: -ና
  rationale: γάρ ከቀደመው ንግግር ጋር ያለውን የምክንያት ወይም የማብራሪያ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τοὺς πτωχοὺς
  choice: ድሆች
  rationale: ይህ የተሰማ ብዙ ቁጥር ድሆችን በአጠቃላይ ያመለክታል፤ «ድሆች» ግልጽና ተፈጥሯዊ ነው።
- source_word: ἔχετε
  choice: ከእናንተ ጋር አሉ / ከእናንተ ጋር አልኖርም
  rationale: ἐχω እዚህ የባለቤትነትን ሳይሆን የመገኘትንና አብሮ የመሆንን ሐሳብ ይገልጣል። ቃል በቃል «አላችሁ» ማለት በአማርኛ የባለቤትነት ስሜት ሊሰጥ ስለሚችል፣ የአውዱን ትርጉም በተፈጥሯዊ አገላለጽ ተርጉሟል።
- source_word: μεθ’ ἑαυτῶν
  choice: ከእናንተ ጋር
  rationale: ሐረጉ ከደቀ መዛሙርቱ ጋር መገኘትን ያመለክታል፤ ይህም በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: ἐμὲ
  choice: እኔ
  rationale: አጽንኦት ያለውን የመጀመሪያ ሰው ተውላጠ ስም ያስተላልፋል፤ በአማርኛ ሰዋስው የአረፍተ ነገሩ ባለቤት ሆኖ ቀርቧል።
- source_word: δὲ
  choice: ግን
  rationale: በድሆች ቀጣይ መገኘትና በኢየሱስ ጊዜያዊ ሥጋዊ መገኘት መካከል ያለውን ንጽጽር ያሳያል።
- source_word: οὐ πάντοτε
  choice: ሁልጊዜ ... አልኖርም
  rationale: የመጀመሪያውን πάντοτε መደገም ጠብቆ አሉታዊውን ጊዜያዊ ንጽጽር በግልጽ አማርኛ ያቀርባል።
theological_decisions:
- issue: የኢየሱስ መገኘት አንድምታ
  choice: ጥቅሱ ድሆች በቀጣይነት መገኘታቸውን ኢየሱስ በሥጋ ከደቀ መዛሙርቱ ጋር የሚኖርበት ጊዜ ውስን ከመሆኑ ጋር ያነጻጽራል።
  alternative: ንግግሩ ለድሆች የሚደረገውን እንክብካቤ እንደሚያሳንስ ሊተረጎም ይችላል።
  rationale: የግሪኩ አገላለጽ ጊዜያዊ ንጽጽርን እንጂ የድሆችን ዋጋ ማሳነስን አይገልጽም። ትርጉሙ ምጽዋትን ወይም ምሕረትን የሚንቅ ትርጓሜ ሳይጨምር የኢየሱስን ሞት የሚቀድመውን ልዩ ጊዜ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው አማርኛ ተጠቅሟል። «ድሆች» በራሱ ድሆች የሆኑ ሰዎችን በግልጽ ስለሚያመለክት፣ የእንግሊዝኛውን ‘poor people’ አማራጭ የሚያስፈልገው የትርጉም ልዩነት በአማርኛ የለም፤ ስለዚህ የግርጌ ማስታወሻ አልተጨመረም።
