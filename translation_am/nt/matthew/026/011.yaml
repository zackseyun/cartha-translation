revisions:
- from: ድሆች ሁልጊዜ ከእናንተ ጋር አሉና፤ እኔ ግን ሁልጊዜ ከእናንተ ጋር አልኖርም።
  to: ድሆች ሁልጊዜ ከእናንተ ጋር አሉና፤ እኔ ግን ሁልጊዜ ከእናንተ ጋር አልገኝም።
  rationale: The revision retains the explanatory force of γάρ, the repeated temporal contrast of πάντοτε / οὐ πάντοτε, and the contrast marked by δέ. It removes the extra implication of residing or living while preserving the text’s contrast between the ongoing presence of poor people and Jesus’ non-permanent presence with the disciples.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:41:43Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the contrast and repeated “always,” but its second verb, «አልኖርም» (“I do not live”), adds the specific idea of living/residing. The Greek repeats ἔχετε (“have”), referring more broadly to presence or availability, without stating “live.”
  naturalness: «ድሆች ሁልጊዜ ከእናንተ ጋር አሉና» is natural modern Amharic. Replacing «አልኖርም» with «አልገኝም» preserves a natural, dignified register while avoiding the added sense of residence.
  terminology: '«ድሆች», «ሁልጊዜ», «ከእናንተ ጋር», and «ግን» are suitable modern-standard equivalents. No Amharic footnote is needed: «ድሆች» already unambiguously denotes poor people collectively.'
  issues:
  - severity: medium
    issue: «አልኖርም» adds “live/reside.”
    rationale: The source says that the disciples do not always “have” Jesus with them; it does not explicitly say that Jesus does not always live with them. «አልገኝም» more closely conveys limited presence without importing a narrower formulation.
  revised_text: ድሆች ሁልጊዜ ከእናንተ ጋር አሉና፤ እኔ ግን ሁልጊዜ ከእናንተ ጋር አልገኝም።
  revised_footnotes: []
  revision_rationale: The revision retains the explanatory force of γάρ, the repeated temporal contrast of πάντοτε / οὐ πάντοτε, and the contrast marked by δέ. It removes the extra implication of residing or living while preserving the text’s contrast between the ongoing presence of poor people and Jesus’ non-permanent presence with the disciples.
