source:
  edition: SBLGNT
  text: καὶ ἐμνήσθη ὁ Πέτρος τοῦ ⸀ῥήματος Ἰησοῦ ⸀εἰρηκότος ὅτι Πρὶν ἀλέκτορα φωνῆσαι τρὶς ἀπαρνήσῃ με, καὶ ἐξελθὼν ἔξω ἔκλαυσεν πικρῶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/075.yaml
  text: 'And Peter remembered the word Jesus had spoken: “Before a rooster crows[a], you will deny me three times.” And he went outside and wept bitterly.'
translation:
  language: am
  text: ጴጥሮስም ኢየሱስ፣ “ዶሮ ሳይጮኽ[a] ሦስት ጊዜ ትክደኛለህ” ብሎ የተናገረውን ቃል አስታወሰ። ወደ ውጭም ወጥቶ መራር ልቅሶ አለቀሰ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ዶሮው ሳይጮኽ።” በግሪክኛው «ዶሮ» ከሚለው ቃል በፊት የተወሰነ አንቀጽ የለም፤ በአማርኛ ግን እንደ አነጋገሩ “ዶሮ” ወይም “ዶሮው” ሊባል ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμνήσθη
  choice: አስታወሰ
  rationale: በትረካው ውስጥ ጴጥሮስ ቀድሞ የተነገረውን ቃል ወደ አእምሮው ማምጣቱን በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: ῥήματος
  choice: ቃል
  rationale: እዚህ ῥῆμα የተነገረ ነገርን ወይም ንግግርን ያመለክታል፤ “ቃል” አጭርና በዐውዱ ተፈጥሯዊ ነው።
- source_word: εἰρηκότος
  choice: ብሎ የተናገረውን
  rationale: ኢየሱስ ቀድሞ የተናገረውንና አሁንም ጠቀሜታ ያለውን ንግግር ያሳያል፤ ከቀጥታ ጥቅሱ ጋር በአማርኛ የሚፈስ አገላለጽ ነው።
- source_word: Πρὶν ἀλέκτορα φωνῆσαι
  choice: ዶሮ ሳይጮኽ
  rationale: የጊዜ ግንኙነቱን በተፈጥሯዊ አማርኛ ያቀርባል። ἀλέκτορα አመልካች ስለሌለው “ዶሮ” ተብሎ ቀርቧል፤ “ዶሮው” የሚለው አማራጭ በማስታወሻ ተጠቅሷል።
- source_word: τρὶς
  choice: ሦስት ጊዜ
  rationale: ትርጉሙን በግልጽና በዘመናዊ አማርኛ ይገልጣል።
- source_word: ἀπαρνήσῃ
  choice: ትክደኛለህ
  rationale: “እኔን ትክዳለህ” የሚለውን ትርጉም በተፈጥሯዊ አማርኛ ከተውላጠ ስም ጋር በማዋሐድ ያቀርባል፣ የክህደቱንም ክብደት ይጠብቃል።
- source_word: ἐξελθὼν ἔξω
  choice: ወደ ውጭም ወጥቶ
  rationale: በግሪክኛው ያለውን የመውጣት አጽንዖት ሳያጣ በአማርኛ ተፈጥሯዊ አገላለጽ ይሰጣል።
- source_word: ἔκλαυσεν πικρῶς
  choice: መሪር ልቅሶ አለቀሰ
  rationale: ጥልቅ ኀዘንና ጸጸት ያለበትን ልቅሶ ያለ ተጨማሪ ትርጓሜ በክብደት ያሳያል።
theological_decisions:
- issue: ኢየሱስን በስሙ ብቻ መጥቀስ
  choice: ኢየሱስ
  alternative: ጌታ ኢየሱስ
  rationale: የግሪክኛው ጽሑፍ Ἰησοῦ ብቻ ይላል፤ በምንጩ የሌለ ክርስቶሳዊ ማዕረግ አልተጨመረም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። “መሪር ልቅሶ አለቀሰ” የምንጩን ስሜታዊ ክብደት ይጠብቃል።
