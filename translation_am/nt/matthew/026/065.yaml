language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τότε ὁ ἀρχιερεὺς διέρρηξεν τὰ ἱμάτια αὐτοῦ ⸀λέγων· Ἐβλασφήμησεν· τί ἔτι χρείαν ἔχομεν μαρτύρων; ἴδε νῦν ἠκούσατε τὴν ⸀βλασφημίαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/065.yaml
  text: Then the high priest tore his garments[a], saying, “He has blasphemed! What further need do we have of witnesses? See[b], now you have heard the blasphemy.”
translation:
  language: am
  text: በዚያን ጊዜ ሊቀ ካህናቱ ልብሶቹን ቀደደ[a]ና፣ “ስድብ ተናግሯል! ከዚህ በላይ ምስክሮች ምን ያስፈልጉናል? እነሆ፣ አሁን ስድቡን ሰምታችኋል።” አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ልብስን መቅደድ ድንጋጤን፣ ኀዘንን ወይም ከፍተኛ ቁጣን በአደባባይ የሚገልጽ ምልክት ነበር።
    reason: cultural_note
lexical_decisions:
- source_word: τότε
  choice: በዚያን ጊዜ
  rationale: የትረካውን ቀጣይ ክስተት የሚያስገባውን የጊዜ አገናኝ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὁ ἀρχιερεὺς
  choice: ሊቀ ካህናቱ
  rationale: በአይሁድ ሃይማኖታዊ አመራር ውስጥ ያለውን ነጠላ የሥልጣን ባለቤት የሚያመለክት የተለመደ አገላለጽ ነው።
- source_word: διέρρηξεν τὰ ἱμάτια αὐτοῦ
  choice: ልብሶቹን ቀደደ
  rationale: ግሱን ቀጥታ ይገልጣል፤ የብዙ ቁጥር ἱμάτιαንም በ“ልብሶቹን” ይጠብቃል፣ “የክህነት ልብሶቹን” ብሎ ምንጩ ያልገለጸውን ዝርዝር አይጨምርም።
- source_word: Ἐβλασφήμησεν
  choice: ተሳድቧል
  rationale: የሊቀ ካህናቱን አስቸኳይ ሃይማኖታዊና ሕጋዊ ክስ በአጭርና በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τί ἔτι χρείαν ἔχομεν μαρτύρων;
  choice: ከእንግዲህ ምስክሮች ምን ያስፈልጉናል?
  rationale: χρείαν ἔχεινን በተፈጥሯዊ አማርኛ ሲያቀርብ፣ ἔτι ያለውን የ“ከእንግዲህ/ተጨማሪ” ሐሳብ ይጠብቃል።
- source_word: ἴδε νῦν
  choice: እነሆ፣ አሁን
  rationale: ἴδε የአድማጮችን ትኩረት የሚጠራ አገላለጽ ሲሆን νῦν ደግሞ የድርጊቱን አሁናዊነት በግልጽ ይጠብቃል።
- source_word: ἠκούσατε τὴν βλασφημίαν
  choice: ስድቡን ሰምታችኋል
  rationale: የክሱን ቃል ከቀደመው ግስ ጋር ያዛምዳል፤ የፍጹም ጊዜውም አሁን ለቀረበው ፍርድ እንደ ማስረጃ መሰማቱን ያጎላል።
theological_decisions:
- issue: βλασφημέω / βλασφημία የሚገልጸውን ክስ ማቅረብ
  choice: “ተሳድቧል” / “ስድቡን” በማለት እንደ ሊቀ ካህናቱ ክስ ማቅረብ
  alternative: “እግዚአብሔርን ተሳድቧል” / “የእግዚአብሔር ስድብ”
  rationale: ጥቅሱ የሊቀ ካህናቱን ፍርድና ክስ ይዘግባል፤ ተርጓሚው የከሳሹን ፍርድ የተራኪው ማረጋገጫ አድርጎ አያቀርብም። በግሪክ ሐረጉ ውስጥ ያልተጠቀሰውን ቀጥተኛ ተሳዳቢ ተቀባይም አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ሊቀ ካህናቱ” እና “እነሆ” የመጽሐፍ ቅዱስን ክብር ያለው አገባብ ሲጠብቁ፣ የቆየና ለመረዳት የሚከብድ አጻጻፍ ተወግዷል። በቀረበው የእንግሊዝኛ ንባብ የግርጌ ማስታወሻ ምልክቶችና ይዘቶች ተለዋውጠው የታዩ ስለሆነ፣ የባህል ማብራሪያው በቀጥታ “ልብሶቹን ቀደደ” ከሚለው በኋላ [a] ተያይዟል፤ ለጥያቄው ያልቀረበ ትክክለኛ አማራጭ ይዘት ስላልነበር ሌላ ማስታወሻ አልተጨመረም።
