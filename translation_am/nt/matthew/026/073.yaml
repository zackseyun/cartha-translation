  rationale: የግሪኩን ‘ለጴጥሮስ አሉ’ በአማርኛ የንግግር ልማድ መሠረት ‘አሉት’ በማለት ያቀርባል።
- source_word: Ἀληθῶς
  choice: በእርግጥ
  rationale: የተናጋሪዎቹን ጽኑ እርግጠኝነት በተለመደና ክቡር አማርኛ ይገልጣል።
- source_word: καὶ σὺ
