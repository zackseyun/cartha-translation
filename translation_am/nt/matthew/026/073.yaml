base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/073.yaml
  text: After a little while[a], those standing there came up and said to Peter, “Surely you also are one of them, for even your accent makes you evident.”
translation:
  language: am
  text: ከጥቂት ጊዜ በኋላ፣ በዚያ ቆመው የነበሩት ወደ ጴጥሮስ ቀርበው፣ “በእርግጥ አንተም ከእነርሱ አንዱ ነህ፤ ምክንያቱም አነጋገርህ እንኳ ያጋልጥሃል[a]” አሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አነጋገርህ ግልጽ ያደርግሃል።” የግሪኩ λαλιά ንግግር፣ የንግግር ዘይቤ ወይም የአነጋገር ድምፅ ማለት ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ μικρὸν
  choice: ከጥቂት ጊዜ በኋላ
