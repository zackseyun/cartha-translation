- source_word: δῆλόν σε ποιεῖ
  choice: ያጋልጥሃል
  rationale: ቃል በቃል ‘ግልጽ ያደርግሃል’ የሚለውን፣ ማንነቱን ለይቶ እንዲታወቅ የማድረግ አውዳዊ ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
