- source_word: ἐξ αὐτῶν
  choice: ከእነርሱ አንዱ
  rationale: የቡድን አባልነትን በግልጽና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: καὶ γὰρ
  choice: … እንኳ
  rationale: γάρ ምክንያቱን ያቀርባል፤ καί የሚሰጠውን አጽንዖት ‘እንኳ’ ይይዛል። በአማርኛ ሴሚኮሎኑ የምክንያታዊውን ግንኙነት በግልጽ ያሳያል።
