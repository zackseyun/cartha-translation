- source_word: δὲ
  choice: —
  rationale: ትረካውን የሚያራምድ ለስላሳ አያያዥ ስለሆነ፣ በአማርኛ በተለየ ቃል ሳይተረጎም የዓረፍተ ነገሩ ፍሰት ይወክለዋል።
- source_word: προσελθόντες
  choice: ቀርበው
