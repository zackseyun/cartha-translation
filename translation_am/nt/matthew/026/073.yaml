- source_word: οἱ ἑστῶτες
  choice: በዚያ ቆመው የነበሩት
  rationale: ‘ቆመው የነበሩት’ የሚለውን አሳታፊ ቅርጽ ይጠብቃል፤ ‘በዚያ’ ደግሞ በአውዱ ያሉትን ሰዎች በተፈጥሯዊ አማርኛ ያመለክታል።
- source_word: εἶπον τῷ Πέτρῳ
