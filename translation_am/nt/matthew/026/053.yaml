  text: ἢ δοκεῖς ὅτι οὐ ⸀δύναμαι παρακαλέσαι τὸν πατέρα μου, καὶ παραστήσει μοι ⸂ἄρτι πλείω⸃ δώδεκα λεγιῶνας ἀγγέλων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/053.yaml
  text: Or do you think that I cannot appeal to my Father[c][b][a], and he will at once place at my disposal more than twelve legions of angels?
translation:
  language: am
  text: ወይስ አባቴን መለመን[a] እንደማልችል ታስባለህ? እርሱም ወዲያውኑ ከአሥራ ሁለት የሚበልጡ የመላእክት ሌጌዎኖችን[c] በአጠገቤ ያቀርብልኛል[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አባቴን መጥራት” ወይም “አባቴን መጠየቅ።”
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “በአጠገቤ ያቀርብልኛል”፤ ይህም ለእርዳታዬ ዝግጁ እንዲሆኑ ያደርጋቸዋል ማለት ነው።
    reason: lexical_alternative
  - marker: c
    text: ሌጌዎን ብዙ ወታደሮች ያሉበት ትልቅ የሮማውያን ወታደራዊ ክፍል ነበር፤ ይህ አገላለጽ እጅግ ብዙ የሆነ ሰማያዊ ኃይልን ያጎላል።
    reason: cultural_note
lexical_decisions:
- source_word: ἢ
  choice: ወይስ
  rationale: በኢየሱስ ተግሣጽ ውስጥ አማራጭ የሆነ የአጻፋ ጥያቄ ያስገባል፤ “ወይስ” የንግግሩን ፍሰት በተፈጥሮ ይጠብቃል።
- source_word: δοκεῖς
  choice: ታስባለህ
  rationale: ቀጥተኛውን የአጻፋ ጥያቄ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: οὐ δύναμαι
  choice: እንደማልችል
  rationale: ቃሉ ፈቃድን ወይም ፍላጎትን ሳይሆን ችሎታን ይገልጣል።
- source_word: παρακαλέσαι
  choice: መለመን
  rationale: በዚህ አውድ ለእርዳታ በአጽንዖት መጠየቅን ያመለክታል፤ ሌሎቹ የቃል አማራጮች በማስታወሻ ተጠብቀዋል።
- source_word: τὸν πατέρα μου
  choice: አባቴን
  rationale: የግሪኩን ቀጥተኛ የአባትና የልጅ ግንኙነት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: παραστήσει μοι
  choice: ከጎኔ ያቆማል
  rationale: የግሪኩን “ከእኔ ጎን ያቆማል” የሚለውን ምስላዊ አገላለጽ ጠብቆ፣ ለእርዳታ ዝግጁ ማድረግ የሚለውን አውዳዊ ትርጉም በማስታወሻ ያብራራል።
- source_word: ἄρτι
  choice: አሁኑኑ
  rationale: በአውዱ ያለውን ፈጣንነትና ወዲያውኑ መገኘትን በግልጽ አማርኛ ያሳያል።
- source_word: πλείω δώδεκα
  choice: ከአሥራ ሁለት የሚበልጡ
  rationale: ከቁጥሩ በላይ የሆነ መጠንን በቀጥታ ያስተላልፋል።
- source_word: λεγιῶνας
  choice: ሌጌዎን
  rationale: የሮማውያንን ወታደራዊ ምስል የሚጠብቅ የተዋሰ ቃል ነው፤ ባሕላዊ ዳራው በማስታወሻ ተብራርቷል።
- source_word: ἀγγέλων
  choice: መላእክትን
  rationale: በአውዱ የሚጠቁሙት ሰማያዊ ፍጥረታትን እንጂ ሰብአዊ መልእክተኞችን አይደለም።
theological_decisions:
- issue: ኢየሱስ መለኮታዊ እርዳታ ሊጠይቅ ስለመቻሉ፣ ስለመፈቀዱ ወይም ስለመፈለጉ የሚናገረው መሆኑ
  choice: “አባቴን መለመን እንደማልችል” በማለት እንደ ችሎታ ተተርጉሟል።
  alternative: ፍላጎት እንደሌለው ወይም ፈቃድ እንዳልተሰጠው በማመልከት መተርጎም።
  rationale: δύναμαι ችሎታን ወይም ኃይልን ያመለክታል። ጥቅሱ ኢየሱስ እጅግ ብዙ ሰማያዊ እርዳታ ማስገኘት ሙሉ በሙሉ እንደሚችል ያጎላል፤ መያዙም ከአቅም ማጣት እንዳልሆነ የሚፈጥረውን መለኮታዊ ውጥረት ያለ ትርጓሜያዊ ማስፋት ይጠብቃል።
