base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/045.yaml
  text: Then he comes to the disciples and says to them[a], “Sleep on now and take your rest. Look, the hour has drawn near[c][b], and the Son of Man is being handed over into the hands of sinners.”
translation:
  language: am
  text: ከዚያም ወደ ደቀ መዛሙርቱ መጥቶ እንዲህ አላቸው፤ “አሁንስ ተኙ፤ ዕረፉም።[a] እነሆ፣ ሰዓቲቱ ቀርባለች፤[b] የሰው ልጅም ወደ ኃጢአተኞች እጅ እየተሰጠ ነው።”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እስካሁን ተኝታችሁ ታርፋላችሁን?” የግሪኩ አገላለጽ ምላሽ የማይጠብቅ ጥያቄ ሆኖ ሊገባ ይችላል፤ ዋናው ጽሑፍ ግን የአገላለጹን አሻሚነትና ምጸቱን ጠብቋል።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ “ሰዓቲቱ ደርሳለች” ወይም “ሰዓቲቱ በደጅ ናት።”
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “እየተከዳ ነው።” የግሪኩ ቃል በሰፊው “አሳልፎ መስጠት” ወይም “ማስረከብ” ማለት ነው።
    reason: lexical_alternative
lexical_decisions:
