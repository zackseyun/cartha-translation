  rationale: የግሪኩ አገላለጽ እንደ ቃለ አጋኖ/ትእዛዝ ወይም እንደ ምላሽ የማይጠብቅ ጥያቄ ሊነበብ ይችላል። ዋናው ጽሑፍ የቃላቱን ገጽታና ከሚቀጥለው አስቸኳይ ማስታወቂያ ጋር ያለውን ውጥረት ጠብቋል።
- issue: በሕማማቱ ዐውድ የπαραδίδοται ትርጉም
  choice: “አሳልፎ እየተሰጠ ነው”
  alternative: “እየተከዳ ነው” ወይም “እየተላለፈ ነው”
