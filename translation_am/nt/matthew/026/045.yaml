  rationale: በትረካው ውስጥ ቀጣዩን ድርጊት የሚያስተዋውቅ ተፈጥሯዊ የጊዜ አያያዥ ነው።
- source_word: ἔρχεται ... καὶ λέγει αὐτοῖς
  choice: መጥቶ ... አላቸው
  rationale: የግሪኩን ታሪካዊ የአሁን ጊዜ ቅርጽ በአማርኛ ተፈጥሯዊ በሆነ ያለፈ ጊዜ ትረካ ያቀርባል።
- source_word: Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε
  choice: አሁንስ ተኙ፤ ዕረፉም
  rationale: የቃላቱን የትእዛዝ ገጽታና በዐውዱ ያለውን ምጸት ይጠብቃል፤ ‘አሁንስ’ የτὸ λοιπὸνን የቀረው ጊዜ/ገና የሚል ጥላ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: አንባቢው ለሚቀጥለው ከባድ ማስታወቂያ እንዲጠነቀቅ የሚጠራ፣ የተለመደና ክብር ያለው አገላለጽ ነው።
- source_word: ἤγγικεν ἡ ὥρα
  choice: ሰዓቲቱ ቀርባለች
  rationale: የፍጹም ጊዜውን የአሁን ውጤት በአማርኛ ተፈጥሯዊ ሁኔታ ያሳያል፤ ሰዓቱ የደረሰ መሆኑን በፍቺ ሳያጠብ የመቅረቡን ምስል ይጠብቃል።
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: የሰው ልጅ
  rationale: የኢየሱስን የተመሰረተና በዐውዱ አስፈላጊ የሆነ የራስ መጠሪያ በቀጥታ ያስተላልፋል።
- source_word: παραδίδοται
  choice: አሳልፎ እየተሰጠ ነው
  rationale: ከ‘ክዳት’ የሰፋውን የማስረከብ/አሳልፎ መስጠት ፍቺ ይጠብቃል፤ የግሪኩን ተደራጊ ድምፅና ቀርቦ ያለውን ድርጊት ያሳያል።
- source_word: εἰς χεῖρας ἁμαρτωλῶν
  choice: በኃጢአተኞች እጅ
  rationale: በአማርኛ የተለመደውን አገባብ ተጠቅሞ ወደ ኃጢአተኞች ሥልጣንና ቁጥጥር መሰጠቱን ይገልጻል።
theological_decisions:
