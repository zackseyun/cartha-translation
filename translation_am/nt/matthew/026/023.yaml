  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ὁ ἐμβάψας μετ’ ἐμοῦ ⸂τὴν χεῖρα ἐν τῷ τρυβλίῳ⸃ οὗτός με παραδώσει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/023.yaml
  text: He answered[b][a], “The one who dipped his hand with me in the bowl—this one will betray me.”
translation:
  language: am
  text: እርሱም መልሶ፣ “ከእኔ ጋር እጁን በወጭቱ[a] የነከረው፣ እርሱ አሳልፎ ይሰጠኛል[b]” አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በሳህኑ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ይከዳኛል።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: መልሶ … አለ
  rationale: የግሪኩ አሳታፊ ግስና ዋና ግስ በተፈጥሯዊ ዘመናዊ አማርኛ ‘መልሶ … አለ’ ተብሎ የመልስ ሐሳቡን ይገልጣል።
- source_word: ἐμβάψας
  choice: የነከረው
  rationale: በምግብ ወይም በወጥ ውስጥ እጅን ወይም በእጅ የተያዘን ነገር የመንከር ድርጊትን ይገልጣል፤ የተፈጸመውን መለያ ድርጊትም ይጠብቃል።
- source_word: μετ’ ἐμοῦ
  choice: ከእኔ ጋር
  rationale: የአብሮነትን ትርጉም ቀጥተኛና ተፈጥሯዊ በሆነ አማርኛ ያስተላልፋል።
- source_word: τὴν χεῖρα
  choice: እጁን
  rationale: ግሪክ ለአካል ክፍል የተወሰነ አመልካች ሲጠቀም፣ አማርኛ ባለቤትነትን ‘እጁን’ ብሎ በተፈጥሮ ይገልጣል።
- source_word: ἐν τῷ τρυβλίῳ
  choice: በወጭቱ
  rationale: τρύβλιον ምግብ የሚቀርብበትን ወጭት ወይም ሳህን ያመለክታል፤ ‘ወጭት’ በዚህ የጋራ ምግብ አውድ ግልጽ ነው።
- source_word: οὗτός
  choice: እርሱ
  rationale: አመልካቹ የሚሰጠውን አጽንዖት በአማርኛ ግልጽ በሆነው ‘እርሱ’ ይጠብቃል።
- source_word: παραδώσει
  choice: አሳልፎ ይሰጠኛል
  rationale: የግሱን መሠረታዊ ‘በሌሎች እጅ አሳልፎ መስጠት’ ሐሳብ ይጠብቃል፤ በዚህ አውድ ያለው የክህደት ኃይልም እንዲሰማ ያደርጋል።
theological_decisions:
- issue: በይሁዳ አውድ παραδίδωμιን መተርጎም
  choice: አሳልፎ ይሰጠኛል
  alternative: ይከዳኛል
  rationale: ግሱ በቀጥታ ‘አሳልፎ መስጠት’ ማለት ሲሆን፣ በትረካው አውድ ድርጊቱ ክህደት መሆኑ ግልጽ ነው። ዋናው ጽሑፍ የምንጩን ምስል ይጠብቃል፤ ዐውዳዊው አማራጭ በማስታወሻ ቀርቧል።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ ነው። የግሪኩ አጽንዖት በ‘እርሱ’ ተጠብቋል፤ የτρύβλιον እና παραδίδωμι የትርጉም ስፋት በማስታወሻዎች ተመዝግቧል።
