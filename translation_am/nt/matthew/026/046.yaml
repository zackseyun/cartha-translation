- source_word: ὁ παραδιδούς με
  choice: አሳልፎ የሚሰጠኝ
  rationale: የግሡን ተጨባጭ ‘ለሌሎች አሳልፎ መስጠት’ ትርጉምና የአሁን ተሳቢ ቅርጹን ይጠብቃል፤ ከአውዱ የሚገኘውን ‘ከዳተኛ’ ትርጉም ብቻ በዋናው ጽሑፍ አይተካውም።
