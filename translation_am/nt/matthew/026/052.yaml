review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the narrative sequence, Jesus’ command to return the weapon, and the general proverbial warning. However, the imperative መልሰው is plural/honorific while ሰይፍህን is singular familiar; the Greek addresses one person (αὐτῷ) and requires consistent singular address. The footnote is also anchored at the end rather than at the phrase it explains.
  naturalness: The verse is generally clear and suitably formal. Recasting the command as ሰይፍህን ወደ ስፍራው መልስ makes the singular address natural and consistent. The footnote wording needs repair for idiomatic, grammatical modern Amharic.
  terminology: ሰይፍ, በሰይፍ, and ይጠፋሉ appropriately preserve the lexical and proverbial force of μάχαιρα and ἀπολοῦνται. ሰይፍን የሚያነሡ is a good rendering of the generalizing participial expression.
  issues:
  - severity: medium
    issue: Inconsistent grammatical number/register in the command
    rationale: መልሰው is plural or honorific, whereas ሰይፍህን is singular familiar. Since αὐτῷ refers to one person, use the singular imperative መልስ, unless the entire address is consistently made honorific.
  - severity: medium
    issue: Footnote anchor is not attached to the expression it explains
    rationale: The lexical note concerns ‘ሰይፍን የሚያነሡ,’ so [a] should immediately follow that phrase rather than the complete verse.
  - severity: medium
    issue: Footnote sentence is grammatically and logically malformed
    rationale: The construction ‘... ሳይሆን ... ሳይሆን አይቀርም’ is not idiomatic and reverses the intended contrast. It should state directly that the expression may indicate resorting to violent force, not merely holding a weapon.
  revised_text: በዚያን ጊዜ ኢየሱስ፣ “ሰይፍህን ወደ ስፍራው መልስ፤ ሰይፍን የሚያነሡ[a] ሁሉ በሰይፍ ይጠፋሉና” አለው።
