id: MAT.26.52
reference: Matthew 26:52
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τότε λέγει αὐτῷ ὁ Ἰησοῦς· Ἀπόστρεψον ⸂τὴν μάχαιράν σου⸃ εἰς τὸν τόπον αὐτῆς, πάντες γὰρ οἱ λαβόντες μάχαιραν ἐν μαχαίρῃ ⸀ἀπολοῦνται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/052.yaml
  text: Then Jesus said to him[a], “Put your sword back in its place, for all who take up the sword will perish by the sword.”
translation:
  language: am
  text: በዚያን ጊዜ ኢየሱስ፣ “ሰይፍህን ወደ ስፍራው መልስ፤ ሰይፍን የሚያነሡ[a] ሁሉ በሰይፍ ይጠፋሉና” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሰይፍን የሚይዙ”፤ አገላለጹ መሣሪያን በእጅ መያዝን ብቻ ሳይሆን፣ ወደ ግፍ ኃይል መጠቀም መዞርንም ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: በዚያን ጊዜ
  rationale: በትረካው ውስጥ ቀጣዩን ድርጊት የሚያስገባውን የጊዜ ቅደም ተከተል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: λέγει αὐτῷ
  choice: አለው
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ አገላለጽ በተፈጥሯዊ የአማርኛ ትረካ ባለፈ ጊዜ ተተርጉሟል፤ αὐτῷ የሚያመለክተውንም ተቀባይ ያሳያል።
- source_word: Ἀπόστρεψον
  choice: መልሰው
  rationale: የተመዘዘውን መሣሪያ ወደነበረበት እንዲመልስ የሚሰጠውን አፋጣኝ ትእዛዝ በአጭርና ግልጽ አማርኛ ያቀርባል።
- source_word: τὴν μάχαιράν σου
  choice: ሰይፍህን
  rationale: μάχαιρα ቢላዋ፣ ጩቤ ወይም አጭር ሰይፍ ሊያመለክት ቢችልም፣ በዚህ የእስራት ትዕይንትና በሚከተለው ምሳሌያዊ አባባል ‘ሰይፍ’ ግልጽና የተለመደ ነው።
- source_word: εἰς τὸν τόπον αὐτῆς
  choice: ወደ ስፍራው
  rationale: መሣሪያውን ወደሚገባበት ስፍራ መመለስን ያሳያል፤ በአማርኛ ‘ሰይፍ’ ተባዕታይ ስለሆነ ‘ስፍራው’ ተብሏል።
- source_word: πάντες γὰρ οἱ λαβόντες μάχαιραν
  choice: ሰይፍን የሚያነሡ ሁሉ
  rationale: የግሪኩን አጠቃላይና ምሳሌያዊ አወቃቀር ይጠብቃል። ‘ሰይፍን ማንሣት’ መሣሪያን በእጅ ከመያዝ በላይ ወደ ኃይል መጠቀም መዞርን ሊያመለክት ይችላል።
- source_word: ἐν μαχαίρῃ
  choice: በሰይፍ
  rationale: የመሣሪያነት ዳቲቭን በተፈጥሯዊ አማርኛ ይገልጻል፤ የአባባሉን ትይዩነትም ይጠብቃል።
- source_word: ἀπολοῦνται
  choice: ይጠፋሉ
  rationale: የወደፊቱን ጥፋት ወይም ሞት በክብደት ያሳያል፣ ነገር ግን ግሱ ከሚለው በላይ የአጠፋፉን ዘዴ አይወስንም።
theological_decisions:
- issue: ኢየሱስ ስለ ሰይፍ የተናገረው አባባል ወሰን
  choice: ‘ሰይፍን የሚያነሡ ሁሉ’ በሚል አጠቃላይ መርህ መተርጎም
  alternative: ሁሉንም የኃይል አጠቃቀም የሚከለክል ፍጹም ትእዛዝ አድርጎ መጥበብ፣ ወይም ለዚያ ቅጽበትና ለደቀ መዝሙሩ ብቻ የተነገረ ትንቢት አድርጎ መገደብ
  rationale: የግሪኩ አንቀጽ አጠቃላይ የሆነ ምሳሌያዊ አባባል ነው። ትርጉሙ ይህን ስፋት ይጠብቃል፤ ጽሑፉ ራሱ ያልወሰነውን የሰላማዊነት ወይም የኃይል አጠቃቀም የቤተ እምነት አቋም አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የምሳሌያዊው አባባል ትይዩነት—‘ሰይፍን… በሰይፍ’—ተጠብቋል።
