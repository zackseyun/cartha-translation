- source_word: Περίλυπός
  choice: እጅግ አዝናለች
  rationale: περίλυπος ከባድና ጥልቅ ሐዘንን ያመለክታል፤ “እጅግ አዝናለች” ይህን ኃይል በቀላልና ክቡር አማርኛ ያስተላልፋል።
- source_word: ἡ ψυχή μου
  choice: ነፍሴ
  rationale: ግልጽ የሆነውን ψυχή ሳይሰርዝ የኢየሱስን ጥልቅ ውስጣዊ ሐዘን ይጠብቃል፤ ከጽሑፉ በላይ የሥነ ሰው ትምህርት አይጫንም።
- source_word: ἕως θανάτου
  choice: እስከ ሞት ድረስ
  rationale: ሐዘኑ እስከ ሞት የሚደርስ መሆኑን የሚገልጸውን የግሪኩን ኃይለኛ አገላለጽ በቀጥታ ይጠብቃል።
- source_word: μείνατε ὧδε
  choice: እዚህ ቆዩ
  rationale: በዚያ ቦታ እንዲቆዩ የተሰጠውን ትእዛዝ በተፈጥሯዊ አማርኛ ይገልጻል።
