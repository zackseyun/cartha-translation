  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ከባድ ሐዘን፣ ψυχή የሚለው ግልጽ ስም፣ እና γρηγορεῖτε ያለው የመንቃትና የንቃት ፍቺ ተጠብቀዋል።
