theological_decisions:
- issue: በኢየሱስ ንግግር ውስጥ ψυχήን መተርጎም
  choice: ነፍሴ
  alternative: እጅግ አዝኛለሁ
  rationale: ψυχή የሚለውን ስም ወደ ተራ የመጀመሪያ መደብ ግስ ሳይቀንስ የጽሑፉን ቅርጽና የኢየሱስን እውነተኛ ሰብአዊ ሐዘን ይጠብቃል፤ ሆኖም ጽሑፉ ያልወሰነውን ቴክኒካዊ የሥነ ሰው አቋም አያስገባም።
- issue: በዐውዱ ውስጥ የγρηγορεῖτε ኃይል
  choice: ንቁ
  alternative: ነቅታችሁ ቆዩ
  rationale: ትእዛዙ ቃል በቃል ከእንቅልፍ መንቃትንና በንቃት መጠበቅን ሊያካትት ይችላል። “ንቁ” ይህን ሁለትዮሽ ኃይል ሳይዘጋ ይጠብቃል፣ ተጨማሪውም በማስታወሻ ተገልጿል።
