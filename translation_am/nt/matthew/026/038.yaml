  text: τότε λέγει ⸀αὐτοῖς· Περίλυπός ἐστιν ἡ ψυχή μου ἕως θανάτου· μείνατε ὧδε καὶ γρηγορεῖτε μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/038.yaml
  text: Then he says to them[a], “My soul is deeply grieved, even to death[c][b]. Remain here and keep watch with me.”
translation:
  language: am
  text: ከዚያም እንዲህ አላቸው፤ “ነፍሴ እስከ ሞት ድረስ እጅግ አዝናለች።[a] እዚህ ቆዩና ከእኔ ጋር ንቁ።[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ነፍሴ በጣም አዝናለች” ወይም “ነፍሴ በሐዘን ተውጣለች” ማለት ይችላል። “እስከ ሞት ድረስ” የሚለው ሐዘኑ እስከ መሞት ደረጃ የደረሰ መሆኑን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: “ከእኔ ጋር ነቅታችሁ ቆዩ” ወይም “ከእኔ ጋር ነቅታችሁ ጠብቁ” ማለትም ሊሆን ይችላል። የግሪኩ ቃል ከእንቅልፍ ነቅቶ መቆየትንም በንቃት መጠበቅንም ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: ከዚያም
  rationale: የተከታታይ ትረካውን ፍሰት በተፈጥሯዊ ዘመናዊ አማርኛ የሚያስቀጥል የጊዜ አገናኝ ነው።
- source_word: λέγει αὐτοῖς
  choice: እንዲህ አላቸው
