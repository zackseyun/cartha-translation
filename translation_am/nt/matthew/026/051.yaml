lexical_decisions:
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: የትረካውን ድንገተኛነትና ሕያውነት የሚያስጠብቅ፣ በዘመናዊ አማርኛም ግልጽ የሆነ የትኩረት ቃል ነው።
- source_word: εἷς τῶν μετὰ Ἰησοῦ
  choice: ከኢየሱስ ጋር ከነበሩት አንዱ
  rationale: የግሪኩን ከአንድ ቡድን መካከል አንዱ የሚለውን አወቃቀር በተፈጥሯዊ አማርኛ ያቀርባል፤ ግለሰቡንም ከጽሑፉ በላይ አይለይም።
- source_word: ἐκτείνας τὴν χεῖρα
  choice: እጁን ዘርግቶ
  rationale: ሰይፉን ከመምዘዙ በፊት የተደረገውን እንቅስቃሴ በአጭርና ተፈጥሯዊ አገላለጽ ይገልጣል።
- source_word: ἀπέσπασεν τὴν μάχαιραν αὐτοῦ
  choice: ሰይፉን መዘዘ
  rationale: በዚህ የትረካ አውድ ሰይፍን ከሰገባው ማውጣትን የሚያመለክት የተለመደ አማርኛ አገላለጽ ነው።
- source_word: μάχαιραν
  choice: ሰይፍ
  rationale: ቃሉ አጭር ሰይፍ ወይም ትልቅ ቢላዋ ሊያመለክት ቢችልም፣ “ሰይፍ” በዚህ አውድ ትክክለኛና ከመጠን በላይ የማይወስን ምርጫ ነው።
- source_word: πατάξας
  choice: መቶ
  rationale: የተፈጸመውን ኃይለኛ ምት በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: δοῦλον
  choice: ባሪያ
  rationale: ቃሉ በጥንቱ ማኅበራዊ ሁኔታ የነበረውን የተገዥነት ደረጃ በቀጥታ ያሳያል፤ “አገልጋይ” የሚለው አማራጭ በማስታወሻ ቀርቧል።
- source_word: ἀρχιερέως
  choice: የሊቀ ካህናቱን
  rationale: በነጠላ ቁጥር የተጠቀሰውን የአይሁድ ሊቀ ካህናት የሚያመለክት መደበኛ አገላለጽ ነው።
- source_word: ἀφεῖλεν αὐτοῦ τὸ ὠτίον
  choice: ጆሮውን ቆረጠው
  rationale: በግሪኩ “ጆሮውን አስወገደ” የሚለውን የሰይፉ ምት ውጤት በተፈጥሯዊ አማርኛ በግልጽ ያስተላልፋል።
- source_word: ὠτίον
  choice: ጆሮ
  rationale: በዚህ አውድ የቃሉ ተፈጥሯዊ አቻ “ጆሮ” ነው፤ “የጆሮ ጫፍ” ማለት ጽሑፉ ከሚወስነው በላይ ዝርዝር ይጨምራል።
