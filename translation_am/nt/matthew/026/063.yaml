  terminology: ሊቀ ካህናቱ, መሲሑ, and የእግዚአብሔር ልጅ are appropriate. አምልሃለሁ is a suitable elevated judicial/solemn rendering of Ἐξορκίζω and should be retained. Footnotes are supplied with correctly placed anchors, unlike the English audit trail's mismatched anchors.
