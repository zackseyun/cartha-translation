  text: ὁ δὲ Ἰησοῦς ἐσιώπα. ⸀καὶ ὁ ἀρχιερεὺς εἶπεν αὐτῷ· Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος ἵνα ἡμῖν εἴπῃς εἰ σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/063.yaml
  text: 'But Jesus kept silent[a]. And the high priest said to him, “I put you under oath by the living God: tell us if you are the Messiah[b], the Son of God.”'
translation:
  language: am
  text: ኢየሱስ ግን ዝም ብሎ ቀረ። ሊቀ ካህናቱም፣ “በሕያው እግዚአብሔር አምልሃለሁ፤ አንተ መሲሑ[a]፣ የእግዚአብሔር ልጅ እንደሆንህ ንገረን” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ክርስቶስ።” የግሪኩ Χριστός እዚህ እንደ ማዕረግ ስለሚሠራ “መሲሑ” ተብሎ ተተርጉሟል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσιώπα
  choice: ዝም አለ
  rationale: የግሪኩ ኢምፐርፌክት በዚህ ዐውድ ኢየሱስ በቀረቡበት ክሶች ፊት ዝምታውን እንደቀጠለ ያሳያል፤ ተፈጥሯዊው የአማርኛ አገላለጽ ይህን በዐውዱ ያስተላልፋል።
- source_word: ἀρχιερεὺς
  choice: ሊቀ ካህናቱ
  rationale: በዚህ የፍርድ ዐውድ የአይሁድን ዋና የክህነት ሹመት በትክክል የሚገልጽ የተለመደ መጠሪያ ነው።
- source_word: Ἐξορκίζω σε
  choice: አምልሃለሁ
  rationale: እዚህ ግሱ የማስወጣትን ሥርዓት ሳይሆን አንድን ሰው በእግዚአብሔር ስም በመማል እውነት እንዲናገር የማስገደድ ታላቅ ቃለ መሐላ ያመለክታል።
- source_word: κατὰ τοῦ θεοῦ τοῦ ζῶντος
  choice: በሕያው እግዚአብሔር
  rationale: ከἘξορκίζω ጋር ያለውን የመሐላ መሠረትና መለኮታዊ ምስክርነት በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἵνα ἡμῖν εἴπῃς
  choice: ንገረን
  rationale: ከመሐላው ቀጥሎ የተጠየቀውን ቃል ቀጥተኛና ተፈጥሯዊ በሆነ የትእዛዝ አነጋገር ያቀርባል።
- source_word: ὁ χριστὸς
  choice: መሲሑ
  rationale: ቃሉ በዚህ ጥያቄ ውስጥ የግል ስም ሳይሆን የተጠበቀውን የተቀባ አዳኝ የሚያመለክት ማዕረግ ነው፤ “መሲሑ” ይህን መሲሐዊ ዐውድ በግልጽ ያስተላልፋል።
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: የእግዚአብሔር ልጅ
  rationale: ክርስቶሳዊውን ማዕረግ ሳያዳክም ወይም ትርጓሜ ሳይጨምርበት በቀጥታ ይጠብቃል።
- source_word: ὁ δὲ Ἰησοῦς
  choice: ኢየሱስ ግን
  rationale: δέ ከቀደሙት ክሶችና ምስክርነቶች ጋር ያለውን ለስላሳ ንጽጽር ያሳያል።
theological_decisions:
- issue: በቀጥተኛው ክርስቶሳዊ ጥያቄ ውስጥ Χριστόςን መተርጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: በሊቀ ካህናቱ ጥያቄ ውስጥ ቃሉ እንደ ስም ሳይሆን እንደ ማዕረግ ይሠራል። “መሲሑ” የተጠበቀውን የተቀባ ንጉሥና አዳኝ የሚያመለክተውን የአይሁድ መሲሐዊ ዐውድ ይጠብቃል።
- issue: Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος የሚለው ቀመር ኃይል
  choice: በሕያው እግዚአብሔር የተደረገ ከባድ ማስማል
  alternative: ተራ ትእዛዝ
  rationale: ንግግሩ እግዚአብሔርን በመጥራት የፍርድ ሂደቱን ክብደት ይጨምራል፤ “አምልሃለሁ” ይህን የቃለ መሐላ ኃይል ያስተላልፋል።
- issue: “መሲሑ” እና “የእግዚአብሔር ልጅ” ያላቸው ሰዋሰዋዊ ግንኙነት
  choice: ሁለቱን በአንድ ጥያቄ ውስጥ በተከታታይ ማቅረብ
  alternative: ሁለት የተለያዩ ጥያቄዎች አድርጎ መከፈል
  rationale: የግሪኩ አወቃቀር “የእግዚአብሔር ልጅ”ን ከ“መሲሑ” ጋር በጥብቅ ያያይዛል፤ ግንኙነቱን በትርጓሜ ከሚፈታው በላይ አይወስንም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና በሕዝብ ንባብ የሚሰማ መደበኛ አማርኛን ይጠቀማል። የቀረበው የእንግሊዝኛ ምልክትና የግርጌ ማስታወሻ ይዘት የተዛባ ነው፤ [a] ከ“kept silent” በኋላ ቢቀመጥም ማስታወሻው Χριστόςን ይመለከታል፣ [b] ከ“Messiah” በኋላ ቢቀመጥም ማስታወሻው Ἐξορκίζωን ይመለከታል። እነዚህ አማራጮች በአማርኛ ዋና ጽሑፍ ግልጽና ተፈጥሯዊ ስለሆኑ፣ የተሳሳቱ ምልክቶችን ከመድገም ይልቅ ያለ ግርጌ ማስታወሻ ቀርበዋል።
