id: MAT.26.62
reference: Matthew 26:62
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ὁ ἀρχιερεὺς εἶπεν αὐτῷ· Οὐδὲν ἀποκρίνῃ; τί οὗτοί σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/062.yaml
  text: And the high priest stood up and said to him[b][a], “Do you give no answer? What is it that these men are testifying against you?”
translation:
  language: am
  text: ሊቀ ካህናቱም ተነሥቶ፣ “ምንም አትመልስምን? እነዚህ ሰዎች በአንተ ላይ የሚመሰክሩት ምንድን ነው?” አለው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς
  choice: ተነሥቶ
  rationale: የሊቀ ካህናቱን ከመቀመጫ መነሣት በተፈጥሯዊ አማርኛ ይገልጻል፤ የድርጊቶቹንም ቅደም ተከተል ይጠብቃል።
- source_word: ὁ ἀρχιερεὺς
  choice: ሊቀ ካህናቱ
  rationale: በዚህ የአይሁድ ሃይማኖታዊ አውድ ያለውን ነጠላ ከፍተኛ የክህነት ሹመት የሚወክል የተለመደ አማርኛ አገላለጽ ነው።
- source_word: εἶπεν αὐτῷ
  choice: አለው
  rationale: የግሪኩን ‘ለእርሱ አለ’ በአጭርና ተፈጥሯዊ አማርኛ ይገልጻል፤ ተውላጠ ስሙንም አይተካም።
- source_word: Οὐδὲν ἀποκρίνῃ;
  choice: ምንም አትመልስምን?
  rationale: አሉታዊውን οὐδέν እና ቀጥተኛውን ጥያቄ ይጠብቃል፤ በዘመናዊ አማርኛም ተፈጥሯዊ ነው።
- source_word: τί
  choice: ምንድን ነው?
  rationale: ጥያቄው ምስክሮቹ የሚያቀርቡትን የምስክርነት ይዘት እንዲጠይቅ በግልጽ የአማርኛ አወቃቀር ተተርጉሟል።
- source_word: οὗτοί
  choice: እነዚህ ሰዎች
  rationale: በቦታው ያሉትን ምስክሮች የሚያመለክተውን የወንድ ብዙ ቁጥር አመልካች በተፈጥሯዊ ሁኔታ ይገልጻል።
- source_word: σου
  choice: በአንተ ላይ
  rationale: ከκαταμαρτυροῦσιν ጋር ያለውን በተከሳሹ ላይ የሚቀርብ የሕግ ምስክርነት ተቃራኒ አቅጣጫ ያሳያል።
- source_word: καταμαρτυροῦσιν
  choice: የሚመሰክሩት
  rationale: የፍርድ ሂደት ምስክርነትን ያሳያል፤ ‘በአንተ ላይ’ ከሚለው ጋር ተያይዞ ‘በአንተ ላይ ይመሰክራሉ’ የሚለውን ሙሉ ትርጉም ይሰጣል።
