- source_word: ἕως οὗ
  choice: እስክጸልይ ድረስ
  rationale: ‘እስከ’ የሚለውን የግሪክ የጊዜ ወሰን በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἀπελθὼν ἐκεῖ προσεύξωμαι
  choice: እኔ ወደዚያ ሄጄ እስክጸልይ
