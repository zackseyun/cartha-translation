- source_word: χωρίον
  choice: ስፍራ
  rationale: ቃሉ ቦታን ወይም የመሬት ክፍልን ያመለክታል፤ ‘አትክልት ስፍራ’ ማለት ማቴዎስ በዚህ ጥቅስ ያልገለጠውን ዝርዝር ይጨምራል።
- source_word: Γεθσημανί
  choice: ጌቴሴማኒ
  rationale: የቦታው ስም በተለመደው የአማርኛ አጻጻፍ ተጽፏል።
