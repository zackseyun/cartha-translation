  text: Τότε ἔρχεται μετ’ αὐτῶν ὁ Ἰησοῦς εἰς χωρίον λεγόμενον Γεθσημανί, καὶ λέγει τοῖς μαθηταῖς· Καθίσατε αὐτοῦ ἕως οὗ ἀπελθὼν ⸂ἐκεῖ προσεύξωμαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/036.yaml
  text: Then Jesus comes with them to a place called Gethsemane[a], and he says to the disciples, “Sit here while I go over there and pray.”
translation:
  language: am
  text: ከዚያም ኢየሱስ ከእነርሱ ጋር ጌቴሴማኒ ወደሚባል ስፍራ መጣ፤ ደቀ መዛሙርቱንም፣ “እኔ ወደዚያ ሄጄ እስክጸልይ ድረስ[a] እዚህ ተቀመጡ” አላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እኔ ወደዚያ ሄጄ ስጸልይ እዚህ ተቀመጡ።” የግሪኩ አገላለጽ በቀጥታ “እስከ … ድረስ” የሚል ሲሆን፣ እርሱ ሄዶ በሚጸልይበት ጊዜ እዚያው እንዲቆዩም ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: ከዚያም
  rationale: የትረካውን ቀጣይነት በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: ἔρχεται
  choice: መጣ
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ ቅርጽ በአማርኛ ትረካ ተፈጥሯዊ በሆነ ያለፈ ጊዜ ተተርጉሟል፤ የድርጊቱን ቅደም ተከተል አይለውጥም።
- source_word: μετ’ αὐτῶν
  choice: ከእነርሱ ጋር
