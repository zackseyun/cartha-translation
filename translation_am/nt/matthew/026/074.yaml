  yaml_path: translation/nt/matthew/026/074.yaml
  text: Then he began to curse and to swear[a], “I do not know the man.” And immediately a rooster crowed.
translation:
  language: am
  text: ከዚያም መርገምና መማል ጀመረ፤[a] “ያንን ሰው አላውቀውም” አለ። ወዲያውም ዶሮ ጮኸ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እርግማን መጥራትና መማል ጀመረ።” በዚህ አውድ ክህደቱን ለማጽናት እርግማን በራሱ ላይ እንዲደርስ እየተማለ እንደነበር ሊገባ ይችላል፤ ሆኖም በግሪኩ የእርግማኑ ተቀባይ በግልጽ አልተጠቀሰም።
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: ከዚያም
  rationale: የትረካውን ቀጣይ ክስተት በተፈጥሯዊ አማርኛ ያመለክታል።
- source_word: ἤρξατο
  choice: ጀመረ
  rationale: የጴጥሮስን እየተባባሰ የሄደ ክህደት የሚያሳየውን የመጀመር ኃይል ይጠብቃል።
- source_word: καταθεματίζειν
  choice: እርግማን መጥራት
  rationale: ቃሉ ተራ ስድብን ብቻ ሳይሆን እርግማንን መጥራት ወይም መገዘትን ያመለክታል፤ በዋናው ጽሑፍ ያልተገለጸውን የእርግማኑን ተቀባይ አይወስንም።
- source_word: ὀμνύειν
  choice: መማል
  rationale: መሐላ መፈጸምን በአጭርና በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: Οὐκ οἶδα τὸν ἄνθρωπον
  choice: ይህን ሰው አላውቀውም
  rationale: የእውቀትንና የትውውቅን ክደት በግልጽ አማርኛ ያስተላልፋል፤ የአማርኛ አገላለጽ ‘ይህን ሰው’ በዚህ ቀጥተኛ ንግግር ተፈጥሯዊ ነው።
- source_word: καὶ εὐθέως
  choice: ወዲያውም
  rationale: ክስተቱ ወዲያው መፈጸሙንና የትረካውን አጣዳፊነት ይጠብቃል።
- source_word: ἀλέκτωρ ἐφώνησεν
  choice: ዶሮ ጮኸ
  rationale: የዶሮን ድምፅ በዘመናዊ አማርኛ የሚገልጽ ተፈጥሯዊ አገላለጽ ነው።
theological_decisions:
- issue: በጴጥሮስ ክህደት ውስጥ የκαταθεματίζειν ትርጉም
  choice: በዋናው ጽሑፍ ‘እርግማን መጥራት’ ተብሎ ተተርጉሞ፣ ራስን መርገም የሚለው አውዳዊ ግምት በማስታወሻ ቀርቧል።
  alternative: ‘ራሱን መርገም’ ወይም ‘መርገም’ ብቻ ማለት።
  rationale: ከὀμνύειν ጋር መጣመሩ ራስን በእርግማን የሚያስይዝ መሐላ ሊያመለክት ይችላል፤ ሆኖም የግሱ ተቀባይ በግልጽ አልተጠቀሰም። ስለዚህ ዋናው ጽሑፍ አሻሚነቱን ይጠብቃል፣ ማስታወሻውም አውዳዊውን ግንዛቤ ያብራራል።
