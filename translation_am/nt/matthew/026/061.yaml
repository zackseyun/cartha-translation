  rationale: በዚህ የኢየሩሳሌምን መቅደስ በሚመለከት ክስ ውስጥ ግልጽና የተለመደ አማርኛ ነው።
- source_word: τοῦ θεοῦ
  choice: የእግዚአብሔርን
  rationale: የግሪኩን የባለቤትነት/ገላጭ ዝምድና በቀጥታ ያሳያል።
- source_word: διὰ τριῶν ἡμερῶν
