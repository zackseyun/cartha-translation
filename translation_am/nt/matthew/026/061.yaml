- source_word: οἰκοδομῆσαι
  choice: ልሠራው
  rationale: በቀደመው ስም የተገለጸውን ቤተ መቅደስ ተውላጠ ስም በመጠቀም ያመለክታል፤ «እንደገና ልሠራው» የሚለውን በግሪኩ በግልጽ ያልተነገረ ትርጓሜ አያስገባም።
