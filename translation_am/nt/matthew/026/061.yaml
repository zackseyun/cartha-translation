  yaml_path: translation/nt/matthew/026/061.yaml
  text: They said[a], “This man said[b], ‘I am able to destroy the temple of God and to build it in three days.’”
translation:
  language: am
  text: 'እነርሱም፣ “ይህ ሰው፣ ‘የእግዚአብሔርን ቤተ መቅደስ[b] ማፍረስና በሦስት ቀናት[a] ልገነባው እችላለሁ’ ብሎአል” አሉ።


    [a] ወይም፣ “በሦስት ቀናት ውስጥ።” የግሪኩ አገላለጽ ተግባሩ በዚያ የጊዜ ክልል ውስጥ እንደሚፈጸም ሊያመለክት ይችላል።


    [b] በዮሐንስ 2፥19-21 ኢየሱስ ስለዚህ ቤተ መቅደስ የተናገረው ነገር ስለ ራሱ ሰውነት እንደ ነበር ተገልጿል።'
  philosophy: optimal-equivalence
  footnotes:
