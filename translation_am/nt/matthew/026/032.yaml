review_pass:
  verdict: revise
  source_fidelity: The added phrase ከሞት (“from death”) is not stated in the Greek and should not be supplied in the main text. The Greek has a passive resurrection expression, which can be noted without expanding the text. The draft’s እቀድማችኋለሁ communicates precedence, but an explicit construction more clearly conveys “I will go ahead of you” and the movement to Galilee.
  naturalness: ከተነሣሁ በኋላ is natural modern Amharic. ወደ ገሊላ ከእናንተ ቀድሜ እሄዳለሁ is clear, idiomatic, and retains both the plural object and the directional sense.
  terminology: ገሊላ is an appropriate established Amharic form. The resurrection wording is retained without importing an unstated agent or adding “from death.”
  issues:
  - severity: medium
    issue: The main text adds ከሞት (“from death”).
    rationale: ἐγερθῆναί με means “after I am raised”; “from death” is contextually understandable but is not expressed in this verse and unnecessarily narrows/expands the wording.
  - severity: medium
    issue: The footnote’s proposed alternative duplicates the main resurrection wording and does not clearly explain the Greek passive.
    rationale: A lexical-alternative footnote should offer a meaningful alternative and accurately state that the Greek infinitive is passive.
  - severity: low
    issue: እቀድማችኋለሁ is somewhat compressed in this directional context.
    rationale: It can mean “I will precede you,” but an explicit “I will go before you to Galilee” construction is more transparent and natural.
  revised_text: ነገር ግን ከተነሣሁ[a] በኋላ፣ ወደ ገሊላ ከእናንተ ቀድሜ እሄዳለሁ።
