    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ
  choice: ነገር ግን … በኋላ
  rationale: μετά ከተዋሐደው ግስ ስም ጋር የጊዜ ቅደም ተከተልን፣ δέ ደግሞ ከቀደመው ንግግር ጋር ያለውን ለስላሳ ንፅፅር ያሳያል።
- source_word: τὸ ἐγερθῆναί με
  choice: ከሞት ከተነሣሁ
  rationale: የግሪኩ ቃል ተደራጊ ቅርጽ ያለው ‘ከተነሣሁ’ ሲሆን፣ በአማርኛ የትንሣኤን ትርጉም በተፈጥሯዊና ግልጽ ሁኔታ ለማስተላለፍ ‘ከሞት’ ተጨምሯል።
- source_word: προάξω
  choice: እቀድማችኋለሁ
  rationale: ከሌሎች ቀድሞ መሄድን በቀጥታና በተፈጥሯዊ አማርኛ ይገልጣል፤ የመሪነትን ሐሳብ አያስገድድም።
- source_word: ὑμᾶς
  choice: -አችኋለሁ
  rationale: ብዙ ሰዎችን የሚያመለክተው ሁለተኛ መደብ ብዙ ቁጥር በግሱ ውስጥ በትክክል ተገልጧል።
- source_word: εἰς τὴν Γαλιλαίαν
  choice: ወደ ገሊላ
  rationale: εἰς የሚያሳየውን ወደ ስፍራ የሚደረግ እንቅስቃሴ በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
