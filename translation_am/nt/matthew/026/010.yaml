  rationale: የግሪኩ ሐረግ አቅጣጫን ወይም ለአንድ ሰው መደረግን ሊያመለክት ይችላል። “ለእኔ” በዐውዱ ተፈጥሯዊ ነው፤ የአቅጣጫው ጥላ ግን በማስታወሻ ተጠብቋል።
