base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/010.yaml
  text: But Jesus[a], knowing this, said to them[b], “Why are you causing trouble for the woman? For she has done a beautiful work to me.
translation:
  language: am
  text: ኢየሱስ ግን ይህን አውቆ እንዲህ አላቸው፤ “ሴቲቱን ለምን ታስቸግሯታላችሁ?[a] ለእኔ መልካም ሥራ[b] ሠርታለችና።”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሴቲቱን ለምን ትረብሻላችሁ?”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ያማረ ሥራ” ወይም “የተከበረ ተግባር።”
    reason: lexical_alternative
  - marker: c
    text: “ለእኔ” የሚለው “በእኔ ላይ” ወይም “ወደ እኔ” የሚል የአቅጣጫ ጥላም ሊኖረው ይችላል።
    reason: source_ambiguity
lexical_decisions:
- source_word: γνοὺς
