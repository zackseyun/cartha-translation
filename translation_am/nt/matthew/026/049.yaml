- issue: የκατεφίλησεν ግስ ጥንካሬ
  choice: ሳመው
  alternative: አጥብቆ ሳመው፤ ደጋግሞ ሳመው
  rationale: ግሱ አጽንዖት ያለውን ወይም ተደጋጋሚ መሳምን ሊጠቁም ቢችልም፣ የትኛው ልዩ ስሜት እንደታሰበ በግድ አይወስንም። ስለዚህ ዋናው ጽሑፍ አሻሚነቱን ይጠብቃል፣ ልዩ ጥንካሬውም በማስታወሻ ይገለጻል።
