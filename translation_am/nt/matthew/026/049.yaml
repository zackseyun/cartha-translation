- source_word: ῥαββί
  choice: ረቢ
  rationale: ግሪኩ የሴማዊውን ማዕረግ በድምፅ ቅጂ እንዳቆየው ሁሉ፣ ትርጉሙም የይሁዳን የአነጋገር ቅርጽ ይጠብቃል።
- source_word: κατεφίλησεν
  choice: ሳመው
  rationale: ዋናውን ድርጊት ግልጽና ተፈጥሯዊ በሆነ አማርኛ ይገልጻል፤ ግሱ ሊያመለክተው የሚችለው አጽንዖት ወይም ድግግሞሽ በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: የΧαῖρε ሰላምታ አተረጓጎም
