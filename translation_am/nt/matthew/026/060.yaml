    text: ወይም፣ «ምንም አላገኙም»። በግሪክኛው የ«አገኙ» ግስ ተሳቢ በግልጽ አልተጠቀሰም፤ ከዐውዱ ግን የሚፈለገውን ምስክርነት ወይም ክስ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ εὗρον
  choice: ምንም አላገኙም
  rationale: የግሱ ቀጥተኛ ተሳቢ በግሪክ አልተገለጸም፤ ከቁጥር 59 ዐውድ አንጻር የሚፈለገውን ምስክርነት ወይም ክስ ያመለክታል። ተሳቢውን ሳይገድብ «ምንም አላገኙም» ይህን ግልጽ ያደርጋል።
- source_word: πολλῶν προσελθόντων ψευδομαρτύρων
  choice: ብዙ ሐሰተኛ ምስክሮች ቀርበው ነበር፤ ነገር ግን
  rationale: የጄኔቲቭ አብሶሉት ሐረጉ በዐውዱ የተቃርኖ ሐሳብ አለው፤ ብዙ ሐሰተኛ ምስክሮች ቢቀርቡም በቂ ማስረጃ አልተገኘም። «ሐሰተኛ ምስክሮች» የፍርድ ሂደቱን ዐውድ ይጠብቃል።
- source_word: ὕστερον δὲ
  choice: በኋላ ግን
  rationale: የጊዜውን ቅደም ተከተልና ቀላል የተቃርኖ ሽግግሩን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: προσελθόντες δύο
  choice: ሁለት ሰዎች ቀረቡ
  rationale: በፍርድ ሸንጎው ዐውድ προσέρχομαι ለመመስከር መቅረብን ያመለክታል። «ሰዎች» በአማርኛ የተፈጥሮ አገላለጽ ሲሆን ቁጥር 61 እነዚህ ምስክሮች መሆናቸውን ያሳያል።
