  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Ἑταῖρε, ἐφ’ ⸀ὃ πάρει. τότε προσελθόντες ἐπέβαλον τὰς χεῖρας ἐπὶ τὸν Ἰησοῦν καὶ ἐκράτησαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/050.yaml
  text: But Jesus said to him[a], “Friend, do what you came for.” Then they came up, laid hands on Jesus, and seized him.
translation:
  language: am
  text: ኢየሱስ ግን፣ “ወዳጄ፣ የመጣህበትን አድርግ”[a] አለው። ከዚያም ቀርበው በኢየሱስ ላይ እጃቸውን ጫኑና ያዙት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወዳጄ፣ ለምን መጣህ?” የግሪኩ አገላለጽ አጭር ሲሆን እንደ ጥያቄም ሊገባ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑταῖρε
  choice: ወዳጄ
  rationale: ለይሁዳ የተነገረ የጥሪ ቃል ነው። “ወዳጄ” በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን፣ እዚህ ላይ የግድ የቅርብ ወዳጅነትን ሳያመለክት የግሪኩን የተቆጠበ አነጋገር ይጠብቃል።
- source_word: ἐφ’ ὃ πάρει
  choice: የመጣህበትን አድርግ
  rationale: የግሪኩ አገላለጽ እጅግ አጭርና የተጨመቀ ነው፤ በዐውዱ የይሁዳን ዓላማ እንዲፈጽም እንደሚፈቅድ ወይም እንደሚገልጥ ተረድቶ ይህ ንባብ በዋናው ጽሑፍ ተመርጧል። የጥያቄው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: προσελθόντες
  choice: ቀርበው
  rationale: ወደ ኢየሱስ የቀረቡትን ሰዎች እንቅስቃሴ በተፈጥሯዊና አጭር አማርኛ ያሳያል።
- source_word: ἐπέβαλον τὰς χεῖρας ἐπὶ τὸν Ἰησοῦν
  choice: ኢየሱስን እጃቸውን ጫኑበት
  rationale: በጠላትነት ወይም ለመያዝ በአንድ ሰው ላይ እጅን የመጫን አካላዊ ድርጊትን ይገልጣል፤ የግሪኩን ምሳሌያዊ አገላለጽ በግልጽ አማርኛ ይጠብቃል።
- source_word: ἐκράτησαν αὐτόν
  choice: ያዙት
  rationale: በኃይል መያዝን ወይም መቆጣጠርን በቀጥታ ያሳያል፤ “አሰሩት” ከሚለው ይልቅ በግሪኩ ያልተገለጸ መደበኛ ሕጋዊ ትርጉም አያክልም።
- source_word: δὲ
  choice: ግን
  rationale: ከይሁዳ ድርጊት ወደ ኢየሱስ ምላሽ የሚደረገውን ቀላል ንጽጽርና የትረካ ሽግግር ያሳያል።
theological_decisions:
- issue: ኢየሱስ ለይሁዳ ያቀረበው ጥሪና ምላሽ አተረጓጎም
  choice: “ወዳጄ፣ የመጣህበትን አድርግ” ተብሎ የንግግሩ የተቆጠበ ቃናና ውጥረት ተጠብቋል።
  alternative: “ወዳጄ፣ ለምን መጣህ?” ወይም “ወዳጄ፣ ለምን ነገር መጣህ?”
  rationale: የግሪኩ ሐረግ አጭርና በአገባቡ አሻሚ በመሆኑ፣ ኢየሱስን ፍጹም ለዘብተኛ ወይም ፍጹም ኩነኔ ሰጪ አድርጎ አይገልጸውም። ዋናው ጽሑፍ በዐውዱ የተደገፈውን የተግባር ጥሪ ይዟል፤ እውነተኛው የጥያቄ አማራጭ ግን በግርጌ ማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። አጭሩ የኢየሱስ ንግግርና ፈጣኑ የትረካ ቅደም ተከተል ተጠብቀዋል።
