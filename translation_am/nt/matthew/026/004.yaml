lexical_decisions:
- source_word: συνεβουλεύσαντο
  choice: ተማከሩ
  rationale: የጋራ ውይይትንና የታቀደ ውሳኔን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δόλῳ
  choice: በተንኮል
  rationale: ሐሰትን፣ ማታለልን ወይም ስውር ዘዴን የሚያካትተውን የግሪክ ቃል ሰፊ ትርጉም ይጠብቃል።
- source_word: κρατήσωσιν
  choice: ይዘው
  rationale: በዚህ ዐውድ ሰውን በኃይል መያዝን ወይም ማሰርን ያመለክታል፤ ‘ይዘው’ በአማርኛ ከሚከተለው ድርጊት ጋር ተፈጥሯዊ ነው።
- source_word: ἀποκτείνωσιν
  choice: ሊገድሉት
  rationale: የዓላማ አንቀጹን በቀጥታና ግልጽ አማርኛ ያቀርባል።
