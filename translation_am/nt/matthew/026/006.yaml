  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ኢየሱስ በቢታንያ በነበረ ጊዜ»። የግሪኩ አገባብ የትዕይንቱን ጊዜ ያስተዋውቃል።
