lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γενομένου
  choice: ኢየሱስም … ሳለ
  rationale: የግሪኩ ገላጭ የባለቤት መስተዋድድ (genitive absolute) የትዕይንቱን ጊዜና ሁኔታ ያስተዋውቃል። «ሳለ» ይህን ተጓዳኝ የጊዜ ኃይል በተፈጥሯዊ አማርኛ ያቀርባል፤ δὲ ያለውን ቀላል የትረካ ትስስር «-ም» ያሳያል።
- source_word: ἐν Βηθανίᾳ
  choice: በቢታንያ
  rationale: ἐν ከቦታ ስም ጋር ያለውን ቀጥተኛ የቦታ ትርጉም ይጠብቃል።
- source_word: ἐν οἰκίᾳ Σίμωνος
  choice: በ… ስምዖን ቤት
  rationale: የግሪኩን የባለቤትነት አገባብ በተፈጥሯዊ የአማርኛ ስም ቅደም ተከተል ያቀርባል፤ οἰκία በዚህ ስፍራ አካላዊውን ቤት ያመለክታል።
- source_word: τοῦ λεπροῦ
  choice: ለምጻሙ
  rationale: የስምዖንን መለያ ቅጽል በአጭርና በተለመደ መንገድ ይጠብቃል። የግሪኩ ቃል ከዘመናዊው የሐንሰን በሽታ የሕክምና ፍቺ የሰፋ ሊሆን ይችላል።
theological_decisions:
- issue: «ለምጻሙ ስምዖን» የሚለው መለያ ስለ ስምዖን ሁኔታ የሚያስከትለው ግምት
  choice: የትረካውን «ለምጻሙ ስምዖን» የሚል መለያ ማቆየት፣ በዚያን ጊዜ በሽታው እንደነበረበት ወይም ቀድሞ እንደተፈወሰ አለመወሰን
  alternative: «ቀድሞ ለምጻም የነበረው ስምዖን» ወይም «የቆዳ በሽታ ያለበት ስምዖን»
  rationale: የግሪኩ ጽሑፍ መለያ ቅጽል ብቻ ይሰጣል፤ የበሽታውን ጊዜ፣ ፈውስን ወይም ዘመናዊ የሕክምና ምርመራን አይገልጽም።
translation_notes:
