  register: ዘመናዊ፣ ክቡርና ለሰፊው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የጥያቄው የተግሣጽ ኃይልና የኢየሱስ በይፋ ሲያስተምር መቆየቱ ተጠብቀዋል።
