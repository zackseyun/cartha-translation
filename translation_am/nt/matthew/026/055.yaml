base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/055.yaml
  text: At that hour Jesus said to the crowds[a], “Have you come out with swords and clubs to arrest me, as against a robber? Day after day I was sitting in the temple teaching[b], and you did not seize me.”
translation:
  language: am
  text: በዚያ ሰዓት ኢየሱስ ለሕዝቡ እንዲህ አለ፦ “እንደ ወንበዴ[a] ልትይዙኝ ሰይፍና ዱላ ይዛችሁ ወጣችሁን? በየቀኑ በቤተ መቅደስ ተቀምጬ እያስተማርኩ ነበር፤ እናንተም አልያዛችሁኝም።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ዘራፊ” ወይም “አመፀኛ” ተብሎም ሊተረጎም ይችላል፤ የግሪኩ λῃστής ከተራ ሌባ ይልቅ በኃይል የሚዘርፍ ወንበዴን፣ በአንዳንድ አውዶችም አመፀኛን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: በዚያን ሰዓት
  rationale: የግሪኩን ጊዜያዊ አገላለጽና የክስተቱን ቅርበት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: τοῖς ὄχλοις
  choice: ለሕዝቡ
  rationale: የግሪኩ ቃል በቁጥር ብዙ ቢሆንም፣ አማርኛ በዚህ አውድ የተሰበሰቡትን ሰዎች በተፈጥሯዊ ሁኔታ ‘ሕዝቡ’ ብሎ ይገልጻል።
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: ወንበዴ እንደሆንኩ
  rationale: የንጽጽሩን ኃይል በተፈጥሯዊ አማርኛ ያሳያል፤ λῃστής ከተራ ሌባ ይልቅ የኃይል ዘራፊን ወይም አመፀኛን ሊያመለክት ስለሚችል ‘ወንበዴ’ ተመርጧል።
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: ሰይፍና ዱላ ይዛችሁ
  rationale: መሣሪያዎቹንና የጥቃት ተግባራቸውን ግልጽና ወቅታዊ በሆነ አማርኛ ያቀርባል።
- source_word: συλλαβεῖν με
  choice: ልትይዙኝ
  rationale: በአውዱ የሚታየውን የማሰር ዓላማ ሳይጠብብ የግሪኩን ‘መያዝ’ ትርጉም ይጠብቃል።
- source_word: καθ’ ἡμέραν
  choice: በየቀኑ
  rationale: የተደጋጋሚነት ኃይሉን በተለመደ አማርኛ ይገልጻል።
- source_word: ἐν τῷ ἱερῷ
  choice: በቤተ መቅደስ
  rationale: ἱερόν የቤተ መቅደሱን ሰፊ ግቢ ሊያመለክት ቢችልም፣ ‘በቤተ መቅደስ’ በአማርኛ ይህን በቂ ሁኔታ የሚያካትት የተለመደ አገላለጽ ነው።
- source_word: ἐκαθεζόμην διδάσκων
  choice: ተቀምጬ እያስተማርኩ ነበር
  rationale: የግሪኩን ቀጣይና ልማዳዊ ገጽታ በግልጽ አማርኛ ያሳያል።
- source_word: οὐκ ἐκρατήσατέ με
  choice: አልያዛችሁኝም
  rationale: κρατέω የሚያሳየውን በኃይል መያዝ በቀጥታ ይገልጻል፤ በአማርኛ የቀደመውን ግስ መድገም የንግግሩን አጽንዖት ይጠብቃል።
theological_decisions:
- issue: የλῃστής ትርጉም ስፋት
  choice: ወንበዴ
  alternative: ሌባ፣ ወይም አመፀኛ
  rationale: ቃሉ በኃይል የሚዘርፍ ወንበዴን፣ አንዳንድ ጊዜም አመፀኛን ሊያመለክት ይችላል። ‘ወንበዴ’ ዋናውን የአደገኛ ወንጀለኛ ምስል ይጠብቃል፤ የፖለቲካ ትርጉምን ግን በግድ አያስገባም።
