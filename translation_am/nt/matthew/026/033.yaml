base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/033.yaml
  text: But Peter answered him[a], “Even if all fall away because of you, I will never fall away.”
translation:
  language: am
  text: ጴጥሮስ ግን መልሶ፣ “ሁሉም በአንተ ምክንያት ቢሰናከሉ[a] እንኳ፣ እኔ ፈጽሞ አልሰናከልም” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ቢደናቀፉ” ወይም “ቢወድቁ።” የግሪኩ ግስ መደናቀፍን፣ መቅየምን፣ ወይም እንዲሰናከሉ መደረግን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ
  choice: ጴጥሮስ ግን መልሶ … አለው
  rationale: የግሪኩን የትረካ አነጋገር ‘መልሶ አለው’ በተፈጥሯዊ አማርኛ ይወክላል፤ δὲ የሚያሳየውን ንጽጽር ‘ግን’ ያስቀምጣል፣ αὐτῷ ደግሞ ‘አለው’ ውስጥ ተጠብቋል።
- source_word: Εἰ πάντες
  choice: ሁሉም … ቢ… እንኳ
  rationale: εἰ በቅርጹ ሁኔታዊ ቢሆንም፣ በዚህ አውድ ያለውን አፅንዖታዊ የመቀበያ ኃይል ‘ቢ… እንኳ’ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: σκανδαλισθήσονται / σκανδαλισθήσομαι
  choice: ቢሰናከሉ / አልሰናከልም
  rationale: ‘መሰናከል’ የግሪኩን ሰፊ የትርጉም ክልል—መደናቀፍ፣ በአንድ ሰው ምክንያት መሸሽ ወይም ታማኝነትን መተው—ይይዛል፤ ሁለቱንም የግስ ክስተቶች በአንድ ቃል መተርጎም የጽሑፉን ድግግሞሽ ይጠብቃል።
- source_word: ἐν σοί
  choice: በአንተ ምክንያት
  rationale: ከσκανδαλίζω ጋር ያለውን ‘ከአንተ የተነሣ/በአንተ ምክንያት’ የሚል ግንኙነት በግልጽ ዘመናዊ አማርኛ ያቀርባል።
- source_word: ἐγὼ οὐδέποτε
  choice: እኔ ፈጽሞ … አል…ም
  rationale: ግልጽ የሆነው ἐγώ ጴጥሮስን ከ‘ሁሉም’ ጋር በአፅንዖት ያነጻጽራል፤ οὐδέποτε ያለውን ጠንካራ እምቢታ ‘ፈጽሞ … አል…ም’ ያስተላልፋል።
theological_decisions:
- issue: በደቀ መዝሙርነት ውድቀት አውድ ውስጥ σκανδαλίζωን መተርጎም
  choice: መሰናከል
  alternative: መክዳት / መተው / ከእምነት መውደቅ
  rationale: ‘መሰናከል’ የግሪኩን ሆን ብሎ ሰፊ የተደረገ ትርጉምና ሥነ መለኮታዊ ውጥረት ይጠብቃል። ‘መክዳት’ ወይም ‘ከእምነት መውደቅ’ ማለት አውዱን ከግሪኩ ቃል ይልቅ ጠበብ አድርጎ ሊወስን ይችላል።
