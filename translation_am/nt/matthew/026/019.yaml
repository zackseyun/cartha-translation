  rationale: አውዱ በተለይ ለምግቡ የሚደረገውን ዝግጅት ቢያመለክትም፣ የግሪኩ ቃል ከዚያ የሰፋ ነው። ዋናው ጽሑፍ ይህን ስፋት ይጠብቃል፤ አውዳዊው አማራጭ በማስታወሻ ተገልጧል።
