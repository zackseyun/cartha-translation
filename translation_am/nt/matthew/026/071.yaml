  yaml_path: translation/nt/matthew/026/071.yaml
  text: But when he had gone out to the gateway, another woman saw him and says to those there, “This man was with Jesus the Nazarene.”
translation:
  language: am
  text: ነገር ግን ወደ መግቢያው በር በወጣ ጊዜ፣ ሌላ ሴት አየችውና በዚያ ላሉት፣ “ይህ ሰው ከናዝሬታዊው ኢየሱስ ጋር ነበር” ትላለች።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πυλῶνα
  choice: የበር መግቢያው
  rationale: ቃሉ ከውስጠኛው ግቢ ወደ ውጭ የሚያደርሰውን የበር ክፍል ወይም መግቢያ ያመለክታል፤ ይህ አተረጓጎም ቦታውን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἄλλη
  choice: ሌላዋ ሴት
  rationale: የግሪኩ ቅጽ ሴት መሆኗን ያሳያል፤ በአማርኛ ስሙን በግልጽ መጨመር ተፈጥሯዊ ነው።
- source_word: λέγει
  choice: አለች
  rationale: በምንጩ ያለው ታሪካዊ የአሁን ጊዜ በዘመናዊ አማርኛ ትረካ በተፈጥሯዊ ሁኔታ በአለፈ ጊዜ ተተርጉሟል።
- source_word: τοῦ Ναζωραίου
  choice: ከናዝሬቱ
  rationale: መጠሪያው ኢየሱስን ከናዝሬት ጋር ያዛምዳል፤ “ናዝሬታዊው” ከሚለው ይልቅ በቀጥታ ከቦታው ጋር ማያያዝ ለዘመናዊ አንባቢ ግልጽ ነው።
