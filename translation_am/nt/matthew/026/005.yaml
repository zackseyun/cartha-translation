id: MAT.26.5
reference: Matthew 26:5
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἔλεγον δέ· Μὴ ἐν τῇ ἑορτῇ, ἵνα μὴ θόρυβος γένηται ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/005.yaml
  text: But they were saying[a], “Not during the feast[b], lest there be an uproar among the people.”
translation:
  language: am
  text: እነርሱ ግን፣ “በበዓሉ ወቅት አይሁን፤ በሕዝቡ መካከል ሁከት እንዳይነሣ” ይሉ ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: ይሉ ነበር
  rationale: የግሪኩን ያልተፈጸመ ጊዜ አንቀጽ በመጠበቅ፣ በውይይታቸው ይህን ይናገሩ እንደነበር ያሳያል።
- source_word: δέ
  choice: ግን
  rationale: ከቀደመው ቁጥር ጋር ያለውን ቀላል ንጽጽርና የትረካ ሽግግር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Μὴ ἐν τῇ ἑορτῇ
  choice: በበዓሉ ወቅት አይሁን
  rationale: Μὴ የሚያሳየውን አሉታዊ ውሳኔ ያስተላልፋል፤ ἐν እዚህ የጊዜ ትርጉም ስላለው “ወቅት” ተጠቅሟል። ἑορτή በዚህ አውድ የፋሲካን በዓል ያመለክታል።
- source_word: ἵνα μὴ
  choice: እንዳይነሣ
  rationale: ሊፈጠር የሚችለውን ውጤት ለማስቀረት ያላቸውን ዓላማ በተፈጥሯዊ የአማርኛ አሉታዊ ዓላማ አገላለጽ ያቀርባል።
- source_word: θόρυβος
  choice: ሁከት
  rationale: ቃሉ የሕዝብ ግርግርን፣ ረብሻን ወይም ዓመፅ ሊቀሰቅስ የሚችል ብጥብጥን ያመለክታል፤ “ሁከት” የሙሉ ዓመፅን ሳያስገድድ ይህን ስፋት ይጠብቃል።
- source_word: γένηται
  choice: ይነሣ
  rationale: ከ“ሁከት” ጋር በአማርኛ ተፈጥሯዊ የሆነ ጥምረት ሲሆን፣ “ይፈጠር/ይከሰት” የሚለውን የግሪኩን ትርጉም ያስተላልፋል።
- source_word: ἐν τῷ λαῷ
  choice: በሕዝቡ መካከል
  rationale: λαός እዚህ በበዓሉ የተሰበሰበውን ሕዝብ ያመለክታል፤ አገላለጹም የሁከቱን ማኅበራዊ ስፍራ በግልጽ ያሳያል።
theological_decisions: []
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለሰፊው አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። የግሪኩ ἔλεγον ቀጣይነት ባለው “ይሉ ነበር” ተጠብቋል። የቀረበው የእንግሊዝኛ ማስታወሻ ምልክቶች ከሚገልጹት ቃላት ጋር የተዛቡ ስለነበሩ፣ በግሪክ ምንጭ ላይ ተመሥርቶ በዋናው ጽሑፍ ውስጥ አስፈላጊ ያልሆኑ የግርጌ ማስታወሻዎች አልተጨመሩም።
