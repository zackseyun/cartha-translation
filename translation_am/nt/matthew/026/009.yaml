    text: ወይም፣ ‘በብዙ ገንዘብ’ ወይም ‘በከፍተኛ ዋጋ’። የግሪኩ አገላለጽ የመሸጫውን ዋጋ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδύνατο
  choice: ሊሰጥ ይችል ነበር
  rationale: ያለፈ ጊዜ ሊፈጸም ይችል የነበረውን ነገር ይገልጣል፤ በአማርኛ የተቀናጁትን ሁለት ድርጊቶች ‘ተሽጦ ... ሊሰጥ ይችል ነበር’ በማለት በተፈጥሯዊ ሁኔታ ያቀርባል።
- source_word: γὰρ
  choice: ነበርና
  rationale: ከቀደመው ቅሬታ ጋር ያለውን ምክንያታዊና ማብራሪያዊ ግንኙነት ያሳያል።
- source_word: τοῦτο
  choice: ይህ
  rationale: በቀደመው አውድ የተጠቀሰውን ነገር ያመለክታል፤ በግሪኩ ያልተደገመውን ‘ሽቱ’ የሚለውን ስም አያክልም።
- source_word: πραθῆναι
  choice: ተሽጦ
  rationale: የግሪኩን የተደራጊ ትርጉም ይጠብቃል፤ ከ‘ሊሰጥ ይችል ነበር’ ጋር ተያይዞ ያልተፈጸመን ያለፈ ጊዜ አማራጭ ያሳያል።
- source_word: πολλοῦ
  choice: በብዙ ዋጋ
  rationale: የዋጋ መጠንን የሚገልጸውን የግሪክ የባለቤት ቅጽ በግልጽና ተፈጥሯዊ አማርኛ ያስተላልፋል፤ የተወሰነ ገንዘብ አይጨምርም።
- source_word: δοθῆναι
  choice: ሊሰጥ
  rationale: የተደራጊውን ሀሳብ ያቀርባል፤ በአማርኛ ከ‘ለድሆች’ እና ‘ይችል ነበር’ ጋር ሲነበብ ተደራጊነቱ ግልጽ ነው።
- source_word: πτωχοῖς
  choice: ለድሆች
  rationale: በድህነት የሚኖሩ ሰዎችን በቡድን የሚያመለክተውን የግሪኩን የተሰማዒ ብዙ ቁጥር በአጭርና ተፈጥሯዊ ሁኔታ ያስተላልፋል።
