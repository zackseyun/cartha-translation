  text: For this could have been sold for a great deal and given to the poor[a].
translation:
  language: am
  text: ይህ በብዙ ዋጋ[a] ተሽጦ ለድሆች ሊሰጥ ይችል ነበርና።
  philosophy: optimal-equivalence
  footnotes:
