  text: ὁ δὲ ἠρνήσατο ⸀ἔμπροσθεν πάντων λέγων· Οὐκ οἶδα τί λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/070.yaml
  text: But he denied it before them all[a], saying, “I do not know what you are saying.”
translation:
  language: am
  text: እርሱ ግን በሁሉም ፊት፣ “ምን እንደምትዪ አላውቅም” ብሎ ካደ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρνήσατο
  choice: ካደ
  rationale: ግሱ ቀደም ሲል የቀረበውን ክስ ወይም ንግግር መካዱን ያመለክታል። በአማርኛ «ካደ» ያልተገለጸውን ተሳቢ ሳይጨምር ትርጉሙን በተፈጥሮ ያስተላልፋል።
- source_word: ἔμπροσθεν πάντων
  choice: በሁሉም ፊት
  rationale: በተሰበሰቡት ሁሉ ፊት በግልጽና በአደባባይ መካዱን ይገልጣል።
- source_word: λέγων
  choice: ብሎ
  rationale: የግሪኩን ተውሳከ ግስ በተፈጥሯዊ የአማርኛ የቀጥታ ንግግር አወቃቀር ያቀርባል።
- source_word: Οὐκ οἶδα
  choice: አላውቅም
  rationale: የማወቅን ግስ አሉታዊ ቅርጽ ቀጥታና ግልጽ በሆነ ዘመናዊ አማርኛ ይገልጣል።
- source_word: τί λέγεις
  choice: የምትዪውን
  rationale: ቃል በቃል «የምትዪውን» ማለት ሲሆን፣ ሴት አገልጋይዋን እንደሚያነጋግር የአማርኛው የፆታ ምልክት በትክክል ያሳያል።
theological_decisions:
- issue: የጴጥሮስ ክህደት ተሳቢ
  choice: ጴጥሮስ የቀረበበትን ክስ እንደካደ ብቻ ቀርቧል፤ ተሳቢው በግልጽ አልተጨመረም።
  alternative: «ኢየሱስን ካደ» ወይም «ክሱን ካደ» ብሎ ተሳቢውን በግልጽ መጨመር።
  rationale: ግሪኩ ἠρνήσατο የሚለውን ያለ ተገለጸ ተሳቢ ይጠቀማል። «ካደ» የሚለው አማርኛም ይህን አሻሚነት በተፈጥሮ ይጠብቃል፤ ከጽሑፉ በላይ ሥነ መለኮታዊ ዝርዝር አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «የምትዪውን» የቀደመችውን ሴት ተናጋሪ ያመለክታል። የትርጉም አማራጭ የሚያስፈልገው ልዩነት ስለሌለ የግርጌ ማስታወሻ አልተጨመረም።
