lexical_decisions:
- source_word: ὑμνήσαντες
  choice: መዝሙር ከዘመሩ በኋላ
  rationale: የግሪኩ የአኦሪስት አጋዥ ግስ ከዋናው ድርጊት በፊት የተፈጸመውን የዝማሬ ተግባር ያሳያል። «መዝሙር ዘመሩ» በምግቡ አውድ የተፈጥሮ አማርኛ ሲሆን ለእግዚአብሔር የቀረበ ዝማሬ መሆኑን ይጠብቃል።
- source_word: ἐξῆλθον
  choice: ወጡ
  rationale: በቀጥታ «ወጡ» ወይም «ከቦታው ሄዱ» ማለት ነው፤ «ወጡ» አጭር፣ ግልጽና በአውዱ ተፈጥሯዊ ነው።
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: ወደ ደብረ ዘይት
  rationale: ቃል በቃል «ወደ ወይራዎች ተራራ» ማለት ሲሆን፣ «ደብረ ዘይት» በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የታወቀውን የቦታውን ስም በትክክል ያስተላልፋል።
- source_word: καὶ
  choice: —
  rationale: የግሪኩ ቀላል ማያያዣ ነው። በአማርኛ የ«ከ… በኋላ» አወቃቀር ውስጥ ግንኙነቱ በተፈጥሮ ስለሚገለጥ፣ ተጨማሪ «እና» ሳያስፈልግ ትርጉሙ ተጠብቋል።
