  text: ነገር ግን፣ ይህ ሁሉ የሆነው የነቢያት መጻሕፍት እንዲፈጸሙ ነው። ከዚያም ደቀ መዛሙርቱ ሁሉ እርሱን ትተው[a] ሸሹ።
