  text: You know that after two days the Passover is coming[a], and the Son of Man is being handed over to be crucified.
translation:
  language: am
  text: “ከሁለት ቀናት በኋላ ፋሲካ እንደሚሆን፣ የሰው ልጅም ለመሰቀል አሳልፈው እንደሚሰጡት ታውቃላችሁ።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἴδατε
  choice: ታውቃላችሁ
  rationale: ሁለተኛ መደብ ብዙ ቁጥር ሲሆን፣ በግሪክ ፍጹም ቅርጽ ቢኖረውም የአሁን ጊዜ ትርጉም አለው።
- source_word: μετὰ δύο ἡμέρας
  choice: ከሁለት ቀን በኋላ
  rationale: μετά ከተሳቢ ጋር የጊዜ ትርጉም ሰጥቶ ‘ከ…በኋላ’ ማለት ነው፤ የግሪኩን አነጋገር በቀጥታ ያንጸባርቃል።
- source_word: τὸ πάσχα
  choice: ፋሲካ
  rationale: የአይሁድን የፋሲካ በዓል የሚያመለክተውን የተለመደ መጽሐፍ ቅዱሳዊ ስያሜ ይጠቀማል፤ ‘በዓል’ የሚለውን በግልጽ ያልተጻፈ ቃል አይጨምርም።
- source_word: γίνεται
  choice: እንደሚሆን
  rationale: በዚህ አውድ ፋሲካው በቅርቡ መድረሱንና መከበሩን ያመለክታል፤ ‘ይሆናል’ ተፈጥሯዊና ሰፊውን የግሪክ ትርጉም የሚጠብቅ ነው።
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: የሰው ልጅ
  rationale: የኢየሱስን የራስ መጠሪያ በተለመደው መጽሐፍ ቅዱሳዊ አገላለጽ ይጠብቃል።
- source_word: παραδίδοται
  choice: አሳልፎ እንደሚሰጥ
  rationale: የአሁን ጊዜ ተደራጊ ቅርጹ በቅርቡ በእርግጥ የሚፈጸምን ድርጊት ያሳያል። ‘አሳልፎ ይሰጣል’ ክህደትን ሊያካትት ቢችልም ቃሉን በዚያ ትርጉም ብቻ አይገድበውም።
- source_word: εἰς τὸ σταυρωθῆναι
  choice: ለመሰቀል
  rationale: εἰς ከዓላማዊ ግስ ስም ጋር የድርጊቱን ዓላማ ወይም ውጤት ያሳያል፤ የተደራጊውም ትርጉም በአማርኛው አውድ ግልጽ ነው።
theological_decisions:
