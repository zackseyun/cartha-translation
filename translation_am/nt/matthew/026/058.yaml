  text: ὁ δὲ Πέτρος ἠκολούθει αὐτῷ ἀπὸ μακρόθεν ἕως τῆς αὐλῆς τοῦ ἀρχιερέως, καὶ εἰσελθὼν ἔσω ἐκάθητο μετὰ τῶν ὑπηρετῶν ἰδεῖν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/058.yaml
  text: But Peter was following him from a distance[a], as far as the courtyard of the high priest. And after going inside[b], he sat with the officers to see the outcome.
translation:
  language: am
  text: ጴጥሮስ ግን እስከ ሊቀ ካህናቱ ግቢ ድረስ ከሩቅ ይከተለው ነበር። ወደ ውስጥም ገብቶ ውጤቱን[b] ለማየት ከአገልጋዮቹ[a] ጋር ተቀምጦ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም «ከረዳቶቹ ጋር»፣ «ከተላላኪዎቹ ጋር» ወይም «ከጠባቂዎቹ ጋር»። ὑπηρέται የሚለው የግሪክ ቃል በሥልጣን ሥር ያሉ ሠራተኞችን ወይም ረዳቶችን ሊያመለክት ይችላል፤ በዚህ አውድ የተወሰነው ሚናቸው ግልጽ አይደለም።
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል «መጨረሻውን»። τέλος የሚለው የግሪክ ቃል «መጨረሻ» ወይም «ፍጻሜ» ማለት ሊሆን ይችላል፤ እዚህ ግን በኢየሱስ ላይ የሚደረገው ነገር ውጤት የሚያመለክት ይመስላል።
    reason: lexical_alternative
