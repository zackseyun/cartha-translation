- source_word: ἕως τῆς αὐλῆς τοῦ ἀρχιερέως
  choice: እስከ ሊቀ ካህናቱ ግቢ ድረስ
  rationale: ἕως የጉዞውን ወሰን፣ αὐλή ደግሞ የታጠረውን ግቢ ያመለክታሉ።
- source_word: εἰσελθὼν ἔσω
  choice: ወደ ውስጥም ገብቶ
  rationale: ቦዝ አንቀጹ ከዋናው ግስ በፊት የተፈጸመውን ድርጊት ያሳያል።
- source_word: ἐκάθητο
  choice: ተቀምጦ ነበር
  rationale: ያልተጠናቀቀውን የግሱን ገጽታ በመጠበቅ ለተወሰነ ጊዜ ተቀምጦ መቆየቱን ያሳያል።
- source_word: μετὰ τῶν ὑπηρετῶν
  choice: ከአገልጋዮቹ[a] ጋር
  rationale: ὑπηρέται በሥልጣን ሥር ያሉ ረዳቶችን፣ ተላላኪዎችን ወይም ጠባቂዎችን ሊያመለክት ስለሚችል፣ «አገልጋዮች» የሚለው ቃል ትርጉሙን ከልክ በላይ አይወስነውም።
- source_word: ἰδεῖν τὸ τέλος
