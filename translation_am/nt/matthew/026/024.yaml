id: MAT.26.24
reference: Matthew 26:24
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ μὲν υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ, οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· καλὸν ἦν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/024.yaml
  text: The Son of Man indeed goes just as it is written about him[a], but woe to that man through whom the Son of Man is betrayed. It would have been better for him if that man had not been born.
translation:
  language: am
  text: የሰው ልጅስ ስለ እርሱ እንደተጻፈው ይሄዳል፤ ነገር ግን የሰው ልጅን አሳልፎ ለሚሰጥ ለዚያ ሰው ወዮለት። ያ ሰው ባልተወለደ ይሻለው ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὲν υἱὸς τοῦ ἀνθρώπου
  choice: የሰው ልጅስ
  rationale: በአማርኛ የተለመደውን መጠሪያ «የሰው ልጅ» ይጠብቃል፤ -ስ ደግሞ μὲν ከሚከተለው δὲ ጋር የሚፈጥረውን ንጽጽር በተፈጥሯዊ መንገድ ያሳያል።
- source_word: ὑπάγει
  choice: ይሄዳል
  rationale: የግሪኩን የአሁን ጊዜ አገላለጽ ይጠብቃል፤ ቃሉን በቀጥታ «ይሞታል» ብሎ በመተርጎም ዐውደ ንባቡ የሚያመለክተውን ከጽሑፉ በላይ አይወስንም።
- source_word: καθὼς γέγραπται περὶ αὐτοῦ
  choice: ስለ እርሱ እንደተጻፈው
  rationale: γέγραπται የሚያመለክተውን ተጽፎ የጸና ሁኔታ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ
  choice: ነገር ግን ... ለዚያ ሰው ወዮለት
  rationale: δὲ ያለውን ንጽጽር «ነገር ግን» ይገልጣል፤ οὐαί ያለውን ከባድ የፍርድና የዋይታ ኃይል «ወዮለት» ይጠብቃል።
- source_word: δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται
  choice: የሰው ልጅን አሳልፎ ለሚሰጠው
  rationale: παραδίδοται በመሠረታዊ ትርጉሙ «አሳልፎ መስጠት» ተብሎ ተተርጉሟል፤ በዐውደ ንባቡ ክህደትን ቢያካትትም የቃሉን ሰፊ የወኪልነትና የማስረከብ ስሜት አያጠብም።
- source_word: καλὸν ἦν αὐτῷ εἰ οὐκ ἐγεννήθη
  choice: ባልተወለደ ለእርሱ ይሻለው ነበር
  rationale: ተቃራኒ-ሁኔታዊውን አነጋገር በተፈጥሯዊ አማርኛ ያቀርባል፤ καλὸν ἦν በዚህ አባባል «ይሻለው ነበር» ተብሎ በትክክል ይገለጣል።
- source_word: ὁ ἄνθρωπος ἐκεῖνος
  choice: ያ ሰው
  rationale: የἐκεῖνοςን አጽንዖትና ርቀት ይጠብቃል፣ እንዲሁም በግሪኩ ያለውን ድግግሞሽ አያጠፋም።
theological_decisions:
- issue: የተጻፈው ዕቅድና የአሳልፎ ሰጪው የግል ተጠያቂነት
  choice: የሰው ልጅ እንደተጻፈው መሄዱና አሳልፎ የሚሰጠው ሰው በወዮታ ሥር መሆኑ ሁለቱም ተጠብቀዋል።
  alternative: አንዱን በማጉላት መለኮታዊውን ፍጻሜ ወይም የሰውየውን ተጠያቂነት ማዳከም።
  rationale: ግሪኩ ሁለቱንም ያለ ማስታረቅ ያስቀምጣል፤ ትርጉሙም ይህንኑ ሥነ መለኮታዊ ውጥረት ይጠብቃል።
- issue: ባይወለድ ይሻለው ነበር የሚለው የፍርድ አባባል
  choice: አባባሉ በሙሉ ክብደቱ ተተርጉሟል፣ ነገር ግን ጽሑፉ ያልገለጸው ዝርዝር የፍርድ ትምህርት አልተጨመረበትም።
  alternative: እንደ ተራ ግነት ማለዘብ ወይም ለአንድ ዝርዝር የዘላለም ፍርድ ሥርዓት ማስረጃ አድርጎ ማስፋት።
  rationale: ንግግሩ ከባድ ፍርድን ይገልጣል፤ ከዚያ በላይ ግን የፍርዱን ባሕርይ በዝርዝር አይወስንም።
