base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/034.yaml
  text: Jesus said to him, “Truly I tell you, in this very night, before a rooster crows, you will deny me three times.”
translation:
  language: am
  text: ኢየሱስም እንዲህ አለው፦ “እውነት እልሃለሁ፤ በዚህች ሌሊት[a]፣ ዶሮ ሳይጮህ[b] ሦስት ጊዜ ትክደኛለህ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ዛሬ ማታ” ተብሎም ሊተረጎም ይችላል። ግሪኩ ቃል በቃል “በዚህች ሌሊት” ይላል፤ “ይህች” የሚለውም አጽንዖት አለው።
    reason: lexical_alternative
  - marker: b
    text: “ዶሮው ሳይጮህ” ተብሎም ሊተረጎም ይችላል። በግሪኩ የ“ዶሮ” ቃል ከተወሰነ አንቀጽ ጋር አልመጣም።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: ኢየሱስም እንዲህ አለው
  rationale: የትረካውን ቀላል የንግግር ግስ በተፈጥሯዊ አማርኛ ያቀርባል፤ “-ም” ከቀደመው ንግግር ጋር ያያይዛል።
- source_word: Ἀμὴν λέγω σοι
  choice: እውነት እልሃለሁ
  rationale: ንግግሩን የሚያስተዋውቀውን የጽኑ ማረጋገጫ በዘመናዊና ክብር ባለው አማርኛ ያቆያል።
- source_word: ἐν ταύτῃ τῇ νυκτί
  choice: በዚህች ሌሊት
  rationale: ἐνን በ“በ”፣ የταύτῃን ጠቋሚ አጽንዖት ደግሞ በ“ዚህች” በመግለጽ የግሪኩን ቅርጽና አጽንዖት ይጠብቃል።
- source_word: πρὶν ἀλέκτορα φωνῆσαι
  choice: ዶሮ ሳይጮኽ
  rationale: የπρίν የጊዜ ቅድመነትን በተፈጥሯዊው “ሳይ-” ግንባታ ያቀርባል፤ ἀλέκτορα ያለ መስተዋድድ ስለሆነ “ዶሮ” በማለት አሻሚነቱ ይጠበቃል።
- source_word: τρὶς
  choice: ሦስት ጊዜ
  rationale: በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ የድግግሞሽ አገላለጽ ነው።
- source_word: ἀπαρνήσῃ με
  choice: ትክደኛለህ
  rationale: “መካድ” የἀπαρνέομαιን ትርጉም በዚህ ዐውድ በግልጽ ሁኔታ ይሰጣል፤ “-ኛ-” የመጀመሪያ መደብ ተሳቢውን με በትክክል ይወክላል።
theological_decisions:
- issue: የኢየሱስ የመግቢያ አባባል Ἀμὴν λέγω σοι
  choice: እውነት እልሃለሁ
  alternative: አሜን፣ እልሃለሁ
  rationale: የኢየሱስን የጽኑ ማረጋገጫና ሥልጣን ያለውን ንግግር ይጠብቃል፤ “አሜን”ን በዋናው ጽሑፍ ማቆየት ለዘመናዊ አንባቢ የአምልኮ መልስ ብቻ እንደሆነ የሚያስሰማውን ግንዛቤ ያስወግዳል።
- issue: የጴጥሮስ ድርጊት ἀπαρνήσῃ με
  choice: ትክደኛለህ
  alternative: እኔን እንደማታውቅ ትናገራለህ
  rationale: “ትክደኛለህ” የግሪኩን አጭርነትና ሰፊ የትርጉም ክልል ይጠብቃል፤ አማራጩ በትርጓሜ የተስፋፋ ሲሆን የክህደቱን መልክ አስቀድሞ ይወስናል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ የትረካ አማርኛ ተጠቅሟል። “እውነት እልሃለሁ” መደበኛውን መጽሐፍ ቅዱሳዊ ክብር ሳያረጅ ይጠብቃል።
