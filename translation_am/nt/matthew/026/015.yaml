  text: እንዲህም አለ፤ “እናንተ ምን ልትሰጡኝ ትፈልጋላችሁ? እኔም እርሱን አሳልፌ እሰጣችኋለሁ[a]።” እነርሱም ሠላሳ ብር መዘኑለት።
