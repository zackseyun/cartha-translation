  rationale: παραδίδωμι ማስረከብን፣ አሳልፎ መስጠትን፣ በአውዱም ክህደትን ሊያመለክት ይችላል። “አሳልፌ እሰጣችኋለሁ” ሰፊውን የቃሉን ትርጉም ይጠብቃል።
