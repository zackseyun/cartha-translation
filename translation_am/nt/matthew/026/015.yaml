lexical_decisions:
- source_word: Τί θέλετέ μοι δοῦναι
  choice: ምን ልትሰጡኝ ትፈልጋላችሁ?
  rationale: θέλω የፍላጎትን ወይም የፈቃደኝነትን ሐሳብ ሊገልጥ ይችላል፤ ይህ አተረጓጎም በድርድሩ አውድ ውስጥ ሁለቱንም በተፈጥሯዊ አማርኛ ያስተላልፋል።
