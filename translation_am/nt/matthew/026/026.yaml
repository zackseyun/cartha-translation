base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/026.yaml
  text: While they were eating[a], Jesus took bread, and after blessing it, he broke it and gave it to the disciples and said, “Take, eat[d][c][b]; this is my body.”
translation:
  language: am
  text: እነርሱም እየበሉ ሳሉ[a]፣ ኢየሱስ እንጀራ ወስዶ ባርኮ[b] ቆርሶ ለደቀ መዛሙርቱ ሰጣቸውና፣ “ውሰዱ፣ ብሉ[c]፤ ይህ ሰውነቴ ነው[d]” አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሲበሉ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “አመስግኖ።” አንዳንዶች ይህን በእንጀራው ላይ ምስጋና እንደማቅረብ ይረዱታል።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “ውሰዱና ብሉ።”
    reason: lexical_alternative
  - marker: d
    text: ግሪኩ ቃል በቃል፣ “ይህ ሰውነቴ ነው” ይላል። አንዳንዶች “ይህ ሰውነቴን ያመለክታል” ብለው ይተረጉሙታል፤ ትርጉሙ ግን የምንጩን አነጋገር ይጠብቃል።
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐσθιόντων δὲ αὐτῶν
  choice: እነርሱም እየበሉ ሳሉ
  rationale: የግሪኩ የgenitive absolute አወቃቀር ድርጊቱ በመካሄድ ላይ ሳለ የተፈጸመውን ያሳያል፤ “እየበሉ ሳሉ” ይህን ጊዜያዊ ግንኙነት በተፈጥሯዊ አማርኛ ያቀርባል። የδέ ቀላል አያያዥነት በ“ም” ተንጸባርቋል።
- source_word: λαβὼν
  choice: አንሥቶ
  rationale: የቀደመውን የaorist participle ድርጊት በተፈጥሯዊ የአማርኛ ተከታታይ ግስ ያቀርባል።
- source_word: ἄρτον
  choice: እንጀራ
  rationale: ቃሉ በምግብ አውድ ውስጥ ያለውን እንጀራ/ዳቦ በአጠቃላይ ያመለክታል፤ “እንጀራ” በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የታወቀና እዚህ አውድ ተስማሚ ነው።
- source_word: εὐλογήσας
  choice: ባርኮ
  rationale: “ባርኮ” የግሪኩን ቃል ቀጥተኛ ኃይል ይጠብቃል፤ በዋናው ጽሑፍ ያልተገለጸውን ቀጥተኛ ተሳቢ አይጨምርም፣ እንዲሁም ቃሉን በቀጥታ “አመስግኖ” ብሎ አይተካውም።
- source_word: ἔκλασεν
  choice: ቈረሰው
  rationale: በአማርኛ እንጀራን ስለመቁረስ ተፈጥሯዊው “ቈረሰ” ነው፤ “ው” ወደ እንጀራው ይመለሳል።
- source_word: δοὺς τοῖς μαθηταῖς
  choice: ለደቀ መዛሙርቱም ሰጥቶ
  rationale: የparticiple አወቃቀሩን በተፈጥሯዊ የአማርኛ ተከታታይ ግስ ያቀርባል፤ የታወቁት ደቀ መዛሙርት መሆናቸው በወሰን ቅጥያው ተገልጧል።
- source_word: Λάβετε φάγετε
  choice: ውሰዱ፣ ብሉ
  rationale: ሁለቱን ተከታታይ ትእዛዛት ያለ ተጨማሪ “እና” ይጠብቃል፤ ሥርዓተ ነጥቡም የግሪኩን asyndetic አቀራረብ ያንጸባርቃል።
- source_word: τοῦτό ἐστιν
  choice: ይህ … ነው
  rationale: ቀላሉን copular አባባል በቀጥታ ይተረጉማል፤ “ማለት ነው” ወይም “ይወክላል” የሚል ትርጓሜያዊ መፍትሔ አያስገባም።
- source_word: τὸ σῶμά μου
  choice: ሰውነቴ
  rationale: σῶμα በመደበኛነት “ሰውነት/body” ማለት ነው፤ “ሰውነቴ” በዘመናዊ አማርኛ የአካላዊ ሰውነትን ትርጉም በቀጥታ ያስተላልፋል፣ ከσάρξ ጋር ሊያያዝ የሚችለውን “ሥጋ” አይጠቀምም።
theological_decisions:
- issue: በጌታ ራት አባባል ውስጥ ያለው τοῦτό ἐστιν τὸ σῶμά μου
  choice: “ይህ ሰውነቴ ነው” ብሎ ቀጥተኛውን አባባል መጠበቅ
  alternative: “ይህ ሰውነቴን ያመለክታል/ማለት ነው” ብሎ መተርጎም
  rationale: ግሪኩ ቀላሉን ἐστιν (“ነው”) ይጠቀማል። ጽሑፉ በራሱ ያልፈታውን የቁርባን ሥነ መለኮታዊ ውዝግብ ትርጉሙ በአንድ አቅጣጫ እንዳይወስን ቀጥተኛው አባባል ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። “ውሰዱ፣ ብሉ” የምንጩን አጭር ሥነ ንግግር ይጠብቃል፤ “ይህ ሰውነቴ ነው” ደግሞ የእምነት ትርጓሜን ሳይጨምር የግሪኩን ውጥረት ያቆያል።
