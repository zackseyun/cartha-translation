  edition: SBLGNT
  text: τότε ἐνέπτυσαν εἰς τὸ πρόσωπον αὐτοῦ καὶ ἐκολάφισαν αὐτόν, οἱ δὲ ἐράπισαν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/067.yaml
  text: Then they spat in his face and struck him with their fists[c][b][a], and others slapped him.
translation:
  language: am
  text: ከዚያም በፊቱ ላይ ተፉበት፤ በቡጢም መቱት፤ ሌሎቹም በጥፊ መቱት።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: ከዚያም
  rationale: የተከታታዩን ትረካ ቀጣይ ድርጊት በተፈጥሯዊ ዘመናዊ አማርኛ ያመለክታል።
- source_word: ἐνέπτυσαν εἰς τὸ πρόσωπον αὐτοῦ
  choice: በፊቱ ላይ ተፉበት
  rationale: የግሪኩን ‘ወደ ፊቱ’ የሚለውን ፈሊጣዊ አነጋገር እንደ ቀጥተኛ የንቀት ድርጊት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐκολάφισαν αὐτόν
  choice: በቡጢም መቱት
  rationale: κολαφίζω በቡጢ መምታትን የሚጠቁም በመሆኑ የመምታቱን ዓይነት በግልጽ ያሳያል።
- source_word: οἱ δὲ ἐράπισαν
  choice: ሌሎቹም በጥፊ መቱት
  rationale: οἱ የተለየ ቡድንን ‘ሌሎቹ’ ብሎ ያመለክታል፤ ῥαπίζω ደግሞ በክፍት እጅ ወይም በጥፊ መምታትን በተለምዶ ይጠቁማል። በግሪኩ ያልተደገመው ተሳቢ ‘እሱን’ ከአውዱ በአማርኛ ግስ ውስጥ ተገልጧል።
- source_word: δέ
  choice: -ም
  rationale: እዚህ ጠንካራ ተቃርኖ ሳይሆን ወደ ሌላ ቡድንና ድርጊት የሚያሸጋግር ቀላል አያያዥ ነው።
theological_decisions:
- issue: በኢየሱስ ላይ የተፈጸመውን ውርደትና አካላዊ ጥቃት መግለጽ
  choice: መትፋትን፣ በቡጢ መምታትንና በጥፊ መምታትን በቀጥታና በግልጽ መግለጽ
  alternative: እንደ ‘አንገላቱት’ ወይም ‘ደበደቡት’ ያሉ አጠቃላይ ቃላትን መጠቀም
  rationale: ምንጩ የተፈጸሙትን ልዩ ልዩ የንቀትና የጥቃት ድርጊቶች በተጨባጭ ይጠቅሳል፤ ትርጉሙም ሳያለዝብ ይህን የትረካ ኃይል ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው የትረካ አማርኛ ተጠቅሟል። ‘ተፉበት’፣ ‘በቡጢ መቱት’ እና ‘በጥፊ መቱት’ ለተራ አንባቢ ቀጥተኛና ተፈጥሯዊ ናቸው። የምንጩ ትርጉም በዋናው ጽሑፍ በቂ ግልጽ ስለሆነ የግድ የሚያስፈልግ የግርጌ ማስታወሻ አልተጨመረም።
