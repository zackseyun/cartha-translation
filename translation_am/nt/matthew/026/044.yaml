base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/044.yaml
  text: And leaving them again[a], he went away and prayed a third time, saying the same thing again.
translation:
  language: am
  text: ትቷቸው እንደገና ሄዶ፣ ለሦስተኛ ጊዜ ያንኑ ንግግር[a] እንደገና በመናገር ጸለየ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ያንኑ ነገር።” በግሪኩ፣ “ያንኑ ቃል/ንግግር።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφεὶς αὐτοὺς
  choice: ትቶአቸው
  rationale: የግሪኩን ተሳቢ አወቃቀርና ደቀ መዛሙርቱን በዚያ ትቶ መሄዱን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: πάλιν ἀπελθὼν
  choice: እንደገናም … ሄደ
  rationale: πάλιν የድግግሞሽ ምልክት መሆኑን ይጠብቃል፤ ἀπελθών ደግሞ ከእነርሱ ርቆ መሄዱን ያመለክታል።
- source_word: προσηύξατο ἐκ τρίτου
  choice: ሦስተኛ ጊዜም … ጸለየ
  rationale: ἐκ τρίτου በዚህ ዐውድ ‘ለሦስተኛ ጊዜ’ ማለት ነው፤ አማርኛው ተፈጥሯዊ ሆኖ የተደጋገመውን ጸሎት ያሳያል።
- source_word: τὸν αὐτὸν λόγον
  choice: ያንኑ ነገር
  rationale: λόγον ነጠላ ቢሆንም እዚህ የተነገረውን የጸሎት ይዘት ያመለክታል፤ ‘ያንኑ ነገር’ ቁጥሩንና ትርጉሙን በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: εἰπὼν πάλιν
  choice: እንደገና በመናገር
  rationale: የመጨረሻውን πάλιν ሳይተው ጸሎቱን በቃል መድገሙን ያሳያል።
theological_decisions:
- issue: የጸሎቱ ድግግሞሽ
  choice: ሦስተኛ ጊዜ መጸለዩንና ያንኑ የጸሎት ይዘት እንደገና መናገሩን በግልጽ ማቆየት
  alternative: ለቅልጥፍና የመጨረሻውን ‘እንደገና’ መተው
  rationale: በግሪኩ ሁለት πάλιν አሉ፤ ሁለቱንም ማቆየት የትረካውን አጽንዖት ይጠብቃል እንጂ ተጨማሪ ሥነ መለኮታዊ ትርጓሜ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ የትረካ አማርኛ። የግሪኩ ሁለት የድግግሞሽ ምልክቶች በአማርኛውም ተጠብቀዋል።
