base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/019.yaml
  text: When anyone hears the word of the kingdom and does not understand it[a], the evil one comes and snatches away what has been sown in his heart[b]. This is the one sown beside the road.
translation:
  language: am
  text: ማንም የመንግሥቱን ቃል ሰምቶ ሳይረዳው ሲቀር፣ ክፉው[a] መጥቶ በልቡ የተዘራውን ይነጥቃል። በመንገድ ዳር የተዘራው[b] ይህ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ክፉ የሆነው።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በመንገዱ አጠገብ የተዘራው።”
    reason: lexical_alternative
lexical_decisions:
- source_word: παντὸς ἀκούοντος
  choice: ማንም … ሰምቶ … ሲቀር
  rationale: የግሪኩን አጠቃላይና ለእያንዳንዱ ሰው የሚሠራ አገላለጽ በተፈጥሯዊ የአማርኛ ሁኔታዊ አነጋገር ያስተላልፋል።
- source_word: λόγον τῆς βασιλείας
  choice: የመንግሥቱን ቃል
  rationale: λόγος የሚለውን ‘ቃል’ ብሎ በመተርጎም የቃሉና የዘሩን ምሳሌያዊ ግንኙነት ይጠብቃል፤ የግሪኩን የባለቤትነት አወቃቀርም ሳይፈታ ያቆያል።
- source_word: μὴ συνιέντος
  choice: ሳይረዳው ሲቀር
  rationale: ቃሉን በትርጉሙ አለመረዳትን በተፈጥሯዊ አማርኛ ይገልጣል፤ ‘ው’ ወደ መንግሥቱ ቃል ይመለሳል።
- source_word: ὁ πονηρὸς
  choice: ክፉው
  rationale: ያለው የውስንነት አመልካች እዚህ የግል ክፉ ወኪልን እንደሚያመለክት ያሳያል፤ ‘ክፉው’ ይህን ሳያብራራ በአጭሩ ይጠብቃል።
- source_word: ἁρπάζει
  choice: ይነጥቃል
  rationale: ድንገተኛና በኃይል የሚደረግ መውሰድን የሚያሳይ ሕያው አማርኛ ግስ ነው።
- source_word: τὸ ἐσπαρμένον
  choice: የተዘራውን
  rationale: የፍጹም ተደራጊ አሳታፊውን ስማዊ አጠቃቀም እና የመዝራት ምስሉን ይጠብቃል።
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: በልቡ
  rationale: የመነሻውን ነጠላ ተውላጠ ስምና መጽሐፍ ቅዱሳዊውን ‘ልብ’ በቀጥታ ይጠብቃል።
- source_word: ὁ παρὰ τὴν ὁδὸν σπαρείς
  choice: በመንገድ ዳር የተዘራው
  rationale: παράን ‘በ…ዳር’፣ ὁδόςን ‘መንገድ’ ብሎ ይተረጉማል፤ ሰውን ከተዘራው ዘር/አፈር ጋር የሚያመሳስለውን ምሳሌያዊ አሻሚነትም ያቆያል።
theological_decisions:
- issue: የὁ πονηρὸς ማንነት
  choice: የግል ክፉ ወኪል — ‘ክፉው’
  alternative: ረቂቅ ክፋት — ‘ክፋት’
  rationale: የተዘራውን ቃል መጥቶ የሚነጥቀው በአውዱ የግል ወኪል ነው፤ ትርጉሙ ግን ማንነቱን ከጽሑፉ በላይ አይወስንም።
- issue: በὁ παρὰ τὴν ὁδὸν σπαρείς ውስጥ የተዘራው ማንነት
  choice: ‘በመንገድ ዳር የተዘራው’ የሚለውን ዘይቤያዊ መለያ ማቆየት
  alternative: ‘በመንገድ ዳር የወደቀውን ዘር የሚመስለው ሰው’ ብሎ ማብራራት
  rationale: ግሪኩ ሰሚውን፣ ዘሩንና የተዘራበትን ቦታ በምሳሌያዊ መለያ ያቀራርባል፤ ትርጉሙ ይህን ውጥረት አይፈታውም።
- issue: የαὐτοῦ ፆታና ቁጥር
  choice: ነጠላ ተውላጠ ስም — ‘በልቡ’
  alternative: ገለልተኛ ወይም ብዙ ቁጥር — ‘በልባቸው’
  rationale: ግሪኩ ነጠላ ተውላጠ ስም ይጠቀማል። አጠቃላይ ትርጉሙ ‘ማንም’ በሚለው ይታያል፣ ነጠላነቱም ‘በልቡ’ ተብሎ ይጠበቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ቃል’፣ ‘ልብ’ እና ‘የተዘራው’ የሚሉት ቃላት የምሳሌውን የቃልና የዘር ግንኙነት ይጠብቃሉ። ሁለቱም የግርጌ ማስታወሻ ምልክቶች [a] እና [b] በዋናው ጽሑፍ ተካተዋል።
