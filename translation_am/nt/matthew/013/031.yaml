revisions:
- from: ኢየሱስም ሌላ ምሳሌ እንዲህ ብሎ አቀረበላቸው፦ “የሰማያት መንግሥት አንድ ሰው ወስዶ በእርሻው ውስጥ ከዘራው የሰናፍጭ ዘር ጋር ትመሳሰላለች።”
  to: ሌላ ምሳሌም አቀረበላቸው፤ እንዲህ ብሎ፦ “የሰማያት መንግሥት አንድ ሰው ወስዶ በእርሻው የዘራውን የሰናፍጭ ዘር ትመስላለች።”
  rationale: 'The revision removes the unexpressed proper name, preserves παρέθηκεν as presenting a further parable to the audience, and renders the Greek relative construction explicitly and idiomatically: the man took the mustard seed and sowed it in his field. The wording preserves Matthew’s established expression ‘የሰማያት መንግሥት’ without interpreting its theological scope.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:59:44Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft retains the principal images and actions, but it adds ‘ኢየሱስ’ although the verse itself only has an implicit subject. More importantly, its final comparison is grammatically and semantically malformed: ‘ከዘራው ... ጋር ትመሳሰላለች’ treats the seed/action phrase as an inappropriate ‘with’ complement and leaves the seed insufficiently marked as the object of sowing.'
  naturalness: The proposed revision uses natural, modern standard Amharic and clearly expresses the parable-introduction formula and the kingdom-to-seed comparison.
  terminology: ‘ምሳሌ,’ ‘የሰማያት መንግሥት,’ ‘የሰናፍጭ ዘር,’ and ‘እርሻው’ are suitable, consistent renderings. ‘ዘር’ is correctly retained for σπείρω rather than using a more general verb for planting.
  issues:
  - severity: medium
    issue: The explicit subject ‘ኢየሱስ’ is added.
    rationale: παρέθηκεν has an implicit subject in this verse. Although the antecedent is clear from the preceding context, adding a proper name is unnecessary in an optimal-equivalence translation of this verse.
  - severity: high
    issue: 'The comparison and relative clause are malformed: ‘... ከዘራው የሰናፍጭ ዘር ጋር ትመሳሰላለች.’'
    rationale: The Greek says that the kingdom is like a mustard seed, which a man took and sowed. In Amharic, the seed should be the object of ‘የዘራው,’ and the comparison should directly relate the kingdom to that seed.
  revised_text: ሌላ ምሳሌም አቀረበላቸው፤ እንዲህ ብሎ፦ “የሰማያት መንግሥት አንድ ሰው ወስዶ በእርሻው የዘራውን የሰናፍጭ ዘር ትመስላለች።”
  revised_footnotes: []
  revision_rationale: 'The revision removes the unexpressed proper name, preserves παρέθηκεν as presenting a further parable to the audience, and renders the Greek relative construction explicitly and idiomatically: the man took the mustard seed and sowed it in his field. The wording preserves Matthew’s established expression ‘የሰማያት መንግሥት’ without interpreting its theological scope.'
