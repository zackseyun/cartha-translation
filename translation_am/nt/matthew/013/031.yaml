id: MAT.13.31
reference: Matthew 13:31
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν κόκκῳ σινάπεως, ὃν λαβὼν ἄνθρωπος ἔσπειρεν ἐν τῷ ἀγρῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/031.yaml
  text: He set another parable before them, saying, “The kingdom of heaven is like a mustard seed, which a man took and sowed in his field.”
translation:
  language: am
  text: ሌላ ምሳሌም አቀረበላቸው፤ እንዲህ ብሎ፦ “የሰማያት መንግሥት አንድ ሰው ወስዶ በእርሻው የዘራውን የሰናፍጭ ዘር ትመስላለች።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέθηκεν
  choice: አቀረበላቸው
  rationale: በዚህ አውድ ግሱ ምሳሌን ለአድማጮች ማቅረብን ያመለክታል፤ ይህ አተረጓጎም በዘመናዊ አማርኛ ተፈጥሯዊና የምንጩን ምስላዊነት ጠባቂ ነው።
- source_word: παραβολὴν
  choice: ምሳሌ
  rationale: በወንጌላት የትምህርት አውድ παραβολήን ለመግለጽ የተለመደና ግልጽ የአማርኛ ቃል ነው።
- source_word: Ὁμοία ἐστὶν
  choice: ጋር ትመሳሰላለች
  rationale: የንጽጽሩን ቀመር በተፈጥሯዊ አማርኛ ይገልጻል፤ የግሱ የሴት ፆታ ቅርጽም ‘መንግሥት’ን ይከተላል።
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: የሰማያት መንግሥት
  rationale: የማቴዎስን ባሕርያዊ የብዙ ቁጥር አገላለጽ ይጠብቃል፤ ‘መንግሥት’ም የንግሥና ግዛትንና አገዛዝን ሳያጠብ ያስቀራል።
- source_word: κόκκῳ σινάπεως
  choice: የሰናፍጭ ዘር
  rationale: የተጠቀሰውን ተክልና ዘሩን በግልጽና በተለመደ የአማርኛ አገላለጽ ያቀርባል።
- source_word: ὃν λαβὼν ἄνθρωπος
  choice: አንድ ሰው ወስዶ
  rationale: የነጠላውን ተዋናይና የቅድሚያውን ድርጊት ይጠብቃል፤ ἄνθρωπος እዚህ አንድን የታሪኩን ተዋናይ ስለሚያመለክት ‘አንድ ሰው’ ተመርጧል።
- source_word: ἔσπειρεν
  choice: ዘራው
  rationale: σπείρω ዘርን መዝራት ማለት ስለሆነ ‘ተከለ’ ከሚለው ይበልጥ ትክክለኛ ነው።
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: በእርሻው ውስጥ
  rationale: የግብርናውን ስፍራና αὐτοῦ የሚገልጸውን የባለቤትነት ግንኙነት በቀጥታ ያሳያል።
theological_decisions:
- issue: የማቴዎስን βασιλεία τῶν οὐρανῶν ማተርጎም
  choice: የሰማያት መንግሥት
  alternative: የሰማይ አገዛዝ
  rationale: የብዙ ቁጥር ‘ሰማያት’ን እና ቁልፍ ቃሉን ‘መንግሥት’ በመጠበቅ የማቴዎስን ልዩ አገላለጽ ያስቀራል፤ ቃሉን በ‘አገዛዝ’ ብቻ በመተርጎም የትርጉሙን ስፋት አያጠብም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩን የንጽጽር ቅርጽ በአማርኛ ተፈጥሯዊ የአንቀጽ አወቃቀር ለማቅረብ የዘሩ ዘመድ አንቀጽ ‘ከዘራው’ ተብሎ ተዋሕዷል። በግሪኩ ያልተጠቀሰው ‘ኢየሱስ’ በአማርኛ የተግባሩን ባለቤት ግልጽ ለማድረግ ከቀደመው አውድ ተመልሶ ተገልጿል።
