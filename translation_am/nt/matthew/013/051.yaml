  edition: SBLGNT
  text: ⸀Συνήκατε ταῦτα πάντα; λέγουσιν αὐτῷ· ⸀Ναί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/051.yaml
  text: Have you understood all these things? They said to him[a], “Yes.”
translation:
  language: am
  text: “እነዚህን ሁሉ ተረድታችኋልን?[a]” አላቸው። እነርሱም፣ “አዎን።” አሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እነዚህን ሁሉ ትረዳላችሁን?”
    reason: የግሪኩ የግስ ቅርጽ እስከዚያ ጊዜ የደረሰ መረዳትን “ተረድታችኋልን?” ብሎ ሊያቀርብ ይችላል፤ በተፈጥሯዊ አማርኛ ግን እንደ ወቅታዊ የመረዳት ሁኔታ “ትረዳላችሁን?” ተብሎም ሊገለጽ ይችላል።
lexical_decisions:
- source_word: Συνήκατε
  choice: ተረድታችኋልን
  rationale: የግሱን ሁለተኛ መደብ ብዙ ቁጥርና እስከዚህ ነጥብ የተፈጸመ መረዳትን የሚጠይቅ የአዎን/አይደለም ጥያቄ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ταῦτα πάντα
  choice: ይህን ሁሉ
  rationale: ከዚህ በፊት የቀረቡትን ምሳሌዎችና ትምህርቶች በአጠቃላይ የሚያመለክት ተፈጥሯዊና ግልጽ የአማርኛ አገላለጽ ነው።
- source_word: λέγουσιν αὐτῷ
  choice: እነርሱም … አሉት
  rationale: የግሪኩን ታሪካዊ የአሁን ጊዜ ቅርጽ በአማርኛ ትረካ ተፈጥሯዊ በሆነ ያለፈ ጊዜ ይተረጉማል፤ αὐτῷ የሚያመለክተውም በ“-ት” ተጠብቋል።
- source_word: Ναί
  choice: አዎን
  rationale: በምንጩ ያለውን ቀላል አዎንታዊ መልስ ያለ ተጨማሪ ማዕረግ በትክክል ያቀርባል።
theological_decisions:
- issue: የደቀ መዛሙርቱን መልስ በአክብሮት ማዕረግ ማስፋት
  choice: ቀላሉን “አዎን” የሚለውን መልስ መጠበቅ
  alternative: “አዎን፣ ጌታ ሆይ”
  rationale: የSBLGNT ጽሑፍ Ναί ብቻ አለው፤ “ጌታ ሆይ” የሚል ማዕረግ መጨመር በምንጩ የሌለ ሃይማኖታዊ ወይም ስርዓተ አምልኮያዊ ይዘት ማስገባት ይሆናል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የጥያቄው ብዙ ቁጥር ተጠብቋል፤ በምንጩ የሌለ “ጌታ ሆይ” አልተጨመረም።
