  text: ὁ δὲ ἐπὶ τὴν ⸂καλὴν γῆν⸃ σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ ⸀συνιείς, ὃς δὴ καρποφορεῖ καὶ ποιεῖ ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/023.yaml
  text: But the one sown on the good soil—this is the one who hears the word and understands it[a], who indeed bears fruit and produces, in one case a hundred, in another sixty[b], and in another thirty.
translation:
  language: am
  text: በመልካሙ አፈር[a] ላይ የተዘራው ግን ቃሉን የሚሰማና የሚረዳው ሰው ነው፤ እርሱም በእርግጥ ፍሬ ያፈራል፣ ምርትም ይሰጣል፤ አንዱ መቶ፣ ሌላው ስድሳ፣ ሌላውም ሠላሳ[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በመልካሙ መሬት ላይ።”
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “አንዱ መቶ፣ ሌላው ስድሳ፣ ሌላውም ሠላሳ።” ይህም የምርቱ መጠን እንደሚለያይ ያመለክታል፤ “መቶ እጥፍ፣ ስድሳ እጥፍ፣ ሠላሳ እጥፍ” ተብሎም ሊገለጽ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τὴν καλὴν γῆν
  choice: በመልካሙ አፈር ላይ
  rationale: በግብርናዊው ምሳሌ ውስጥ γῆ ዘርን የሚቀበል አፈርን ያመለክታል፤ καλὴν እዚህ ለምና ተስማሚ መሆንን እንጂ ሥነ ምግባራዊ መልካምነትን አያስገድድም።
- source_word: σπαρείς
  choice: የተዘራው
  rationale: የግሪኩን የተዘራ ዘር ምስል የሚጠብቅ ተፈጥሯዊ የአማርኛ ተገብሮ አገላለጽ ነው።
- source_word: ὁ τὸν λόγον ἀκούων
  choice: ቃሉን ሰምቶ የሚረዳው ሰው
  rationale: λόγος ያለውን የወንጌል አገላለጽና ከአውዱ ጋር ያለውን ትስስር ለመጠበቅ “ቃሉን” ተብሏል፤ የአሁን ጊዜ አድራጊ አገላለጹም ባሕርይ የሆነ ተግባርን ያሳያል።
- source_word: συνιείς
  choice: የሚረዳው
  rationale: የሰማውን ቃል ትርጉም መገንዘብን በተፈጥሯዊና ግልጽ አማርኛ ያስተላልፋል።
- source_word: δὴ
  choice: በእርግጥ
  rationale: ቅንጣቱ የሚሰጠውን አጽንዖት በማይከብድ ዘመናዊ አገላለጽ ይጠብቃል።
- source_word: καρποφορεῖ
  choice: ፍሬ ያፈራል
  rationale: የምሳሌውን ዋና የግብርና ምስል እና የደቀ መዝሙርነት አንድምታ ሳይፈታ ይጠብቃል።
- source_word: ποιεῖ
  choice: ምርትም ይሰጣል
  rationale: በዚህ አውድ ποιεῖ የሰብል ውጤት ማምረትን ያመለክታል፤ ከκαρποφορεῖ ጋር ያሉትን ሁለት ግሶች ወደ አንድ ሳይጨምቅ ተፈጥሯዊ አማርኛ ይሰጣል።
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: አንዱ መቶ፣ ሌላው ስድሳ፣ ሌላውም ሠላሳ
  rationale: የተለያዩ የምርት መጠኖችን የሚያሳየውን አከፋፋይ አወቃቀር ይጠብቃል፤ “እጥፍ” በግሪኩ በግልጽ ስላልተጻፈ በዋናው ጽሑፍ አልተጨመረም።
theological_decisions:
- issue: በምሳሌው ውስጥ ለቃሉ የሚሰጠው ምላሽ ባሕርይ
  choice: መልካም አፈር የተባለው ሰሚ ቃሉን ይሰማል፣ ይረዳል፣ በተለያየም መጠን ፍሬ ያፈራል ተብሎ ገላጭ ትርጉም ተሰጥቷል።
  alternative: ትርጉሙ ጽናትን፣ እውነተኛ መለወጥን ወይም ዳግም መወለድን በግልጽ ሊያክል ይችል ነበር።
  rationale: የግሪኩ ጽሑፍ መስማትን፣ መረዳትንና ፍሬ ማፍራትን ያጎላል፤ ነገር ግን በኋላ የተቀረጹ የትምህርተ እምነት ምድቦችን በግልጽ አይናገርም። ትርጉሙ የጽሑፉን ራሱን ምድቦች ብቻ ይጠብቃል።
