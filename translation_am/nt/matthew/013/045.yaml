  text: Again[a], the kingdom of heaven is like a merchant seeking fine pearls.
translation:
  language: am
  text: ደግሞ፣ የሰማያት መንግሥት የተመረጡ ዕንቁዎችን የሚፈልግ ነጋዴ እንደሆነ ሰው ነው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይበልጥ ቃል በቃል፦ “የሰማያት መንግሥት የተመረጡ ዕንቁዎችን የሚፈልግ ሰው፣ ነጋዴን ትመስላለች።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: ደግሞ
  rationale: በተከታታይ ከቀረቡት የመንግሥቱ ምሳሌዎች አንድ ተጨማሪ ንጽጽር እንደሚጀምር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὁμοία ἐστὶν
  choice: ይመሳሰላል
  rationale: የምሳሌውን ንጽጽር በአጭር፣ ተፈጥሯዊና ግልጽ አማርኛ ያቀርባል።
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: የሰማያት መንግሥት
  rationale: የማቴዎስን ልዩ አገላለጽና የτῶν οὐρανῶνን ብዙ ቁጥር ይጠብቃል፤ በአማርኛ የተለመደና የተከበረ አገላለጽም ነው።
- source_word: ἀνθρώπῳ ἐμπόρῳ
  choice: ከነጋዴ ጋር
  rationale: ἔμπορος ሰውየውን በቂ ሁኔታ ስለሚለይ ‘ሰው፣ ነጋዴ’ የሚለውን ቃል በቃል ድግግሞሽ በዋናው ጽሑፍ አያስፈልግም፤ ከὁμοία ጋር ያለውን የንጽጽር ግንኙነት ‘ከ…ጋር’ በግልጽ ያሳያል።
- source_word: ζητοῦντι
  choice: ከሚፈልግ
  rationale: የነጋዴውን ቀጣይ ተግባር ያሳያል፤ አማርኛውም ተፈጥሯዊ ነው።
- source_word: καλοὺς μαργαρίτας
  choice: ጥሩ ዕንቁዎችን
  rationale: καλός በዚህ የንግድ አውድ የጥራትና የተመራጭነት ሐሳብ ይዟል፤ ‘ጥሩ’ ይህን ያለ ትርጓሜያዊ ጭማሪ ያቀርባል።
theological_decisions:
- issue: በምሳሌው ቀመር ውስጥ የንጽጽሩ ቀጥተኛ ወሰን
  choice: መንግሥቱ በቀጥታ ጥሩ ዕንቁዎችን ከሚፈልገው ነጋዴ ጋር እንደሚነጻጸር ተተርጉሟል።
  alternative: መንግሥቱ ነጋዴውን፣ ፍለጋውንና ዕንቁዎቹን ከሚያካትተው አጠቃላይ ሁኔታ ጋር ይነጻጸራል።
  rationale: የግሪኩ አወቃቀር ἀνθρώπῳ ἐμπόρῳን እንደ ቀጥተኛው የንጽጽር ነጥብ ያቀርባል፤ ነገር ግን ሰፊው ምሳሌያዊ ሁኔታ በቀጣዩ ቁጥር ስለሚዘረጋ ትርጉሙ ምሳሌውን ከዚህ በላይ አይፈታውም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛ ተጠቅሟል። ‘የሰማያት መንግሥት’ የማቴዎስን የተለመደ ቃል ጠብቋል፤ የግሪኩ ቃል በቃል አወቃቀር በግርጌ ማስታወሻ ተጠብቋል።
