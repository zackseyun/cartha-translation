review_pass:
  verdict: revise
  source_fidelity: The draft preserves the sequence, the kingdom-of-heaven expression, the merchant, his ongoing search, and the high-quality pearls. However, its comparison construction is less idiomatic and the footnote's literal rendering incorrectly makes “man” and “merchant” separate coordinated referents.
  naturalness: “ከ…ጋር ይመሳሰላል” is understandable but is a less direct, somewhat awkward way to state this parabolic comparison. “እንደ … ነው” is natural modern standard Amharic.
  terminology: “የሰማያት መንግሥት,” “ነጋዴ,” and “ዕንቁዎች” are appropriate. “የተመረጡ” naturally conveys καλούς in this commercial setting, indicating pearls of fine quality without adding a valuation not present in the source.
  issues:
  - severity: medium
    issue: The main comparison construction is awkward.
    rationale: The Greek says that the kingdom is like a merchant. In Amharic, “እንደ … ነው” directly and naturally expresses this, whereas “ከ…ጋር ይመሳሰላል” is less idiomatic here.
  - severity: high
    issue: The footnote structurally misrepresents ἀνθρώπῳ ἐμπόρῳ.
    rationale: “ሰው፣ ነጋዴ” identifies one person—a man who is a merchant. The draft footnote’s “ከ…ሰው፣ ከነጋዴ ጋር” separates them and repeats the comparative construction incorrectly.
  revised_text: ደግሞ፣ የሰማያት መንግሥት የተመረጡ ዕንቁዎችን የሚፈልግ ነጋዴ እንደሆነ ሰው ነው።[a]
