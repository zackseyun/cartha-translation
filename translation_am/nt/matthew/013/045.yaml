revisions:
- from: ደግሞ፣ የሰማያት መንግሥት ጥሩ ዕንቁዎችን ከሚፈልግ ነጋዴ ጋር ይመሳሰላል።[a]
  to: ደግሞ፣ የሰማያት መንግሥት የተመረጡ ዕንቁዎችን የሚፈልግ ነጋዴ እንደሆነ ሰው ነው።[a]
  rationale: The revision uses the standard natural Amharic parable formula “እንደ … ነው,” while retaining the immediate comparison with the merchant. The footnote now represents ἀνθρώπῳ ἐμπόρῳ as one person, “a man, a merchant,” rather than two separate referents. “የተመረጡ” expresses the quality sense of καλούς in context.
