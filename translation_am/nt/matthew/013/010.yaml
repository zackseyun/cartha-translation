base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/010.yaml
  text: Then the disciples came up and said to him[a], “Why do you speak to them in parables?”
translation:
  language: am
  text: ከዚያም ደቀ መዛሙርቱ ወደ እርሱ ቀርበው[a]፣ “ለምን በምሳሌዎች ትናገራቸዋለህ?” አሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ወደ እርሱ መጥተው»፤ የግሪኩ አሳታፊ ግስ ደቀ መዛሙርቱ ከመናገራቸው በፊት ወደ ኢየሱስ እንደቀረቡ ያጎላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: ከዚያም
  rationale: በዚህ የትረካ አውድ καί ቀጣዩን ድርጊት ያስገባል፤ «ከዚያም» ይህን ፍሰት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: προσελθόντες
  choice: ወደ እርሱ ቀርበው
  rationale: የግሱን ወደ ኢየሱስ የመቅረብ እንቅስቃሴና ከመናገራቸው በፊት መሆኑን ያቆያል።
- source_word: οἱ μαθηταὶ
  choice: ደቀ መዛሙርቱ
  rationale: መስተዋድዱ በአውዱ የታወቁትን ደቀ መዛሙርት ይለያል፤ ባለቤትነትን የሚጨምር «የእርሱ» በግሪኩ ግልጽ ስላልሆነ አልተጨመረም።
- source_word: εἶπαν αὐτῷ
  choice: አሉት
  rationale: የግሪኩን «ለእርሱ አሉ» በአጭርና ተፈጥሯዊ አማርኛ ያቀርባል፤ ጥያቄ መሆኑ በቀጥታ ንግግሩ ግልጽ ነው።
- source_word: Διὰ τί
  choice: ለምን
  rationale: የምክንያት ጥያቄውን በመደበኛና ቀጥተኛ አማርኛ ይገልጣል።
- source_word: ἐν παραβολαῖς
  choice: በምሳሌዎች
  rationale: ἐν እዚህ የንግግርን መንገድ ወይም መገናኛ ይገልጣል፤ «በምሳሌዎች» በአማርኛ ተፈጥሯዊና ትክክለኛ ነው።
- source_word: λαλεῖς
  choice: ትናገራቸዋለህ
  rationale: የሁለተኛ መደብ ነጠላ የአሁን ጊዜ ቅርጹን ይጠብቃል፤ የተሳቢ ቅጥያው αὐτοῖςን በተፈጥሯዊ አማርኛ ያካትታል።
- source_word: αὐτοῖς
  choice: -አቸው- (ትናገራቸዋለህ)
  rationale: ኢየሱስ የሚናገራቸውን ሰዎች «ለእነርሱ» ብሎ ያመለክታል፤ በአማርኛ ይህ በግሱ ውስጥ በተሳቢ ቅጥያ በተፈጥሯዊ ሁኔታ ተገልጧል።
