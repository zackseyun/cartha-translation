id: MAT.13.12
reference: Matthew 13:12
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὅστις γὰρ ἔχει, δοθήσεται αὐτῷ καὶ περισσευθήσεται· ὅστις δὲ οὐκ ἔχει, καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/012.yaml
  text: For whoever has[a], more will be given to him, and he will have an abundance; but whoever does not have[b], even what he has will be taken from him.
translation:
  language: am
  text: ምክንያቱም ላለው[a] ይሰጠዋል፣ ይበዛለታል፤ ለሌለው[b] ግን ያለው እንኳ ከእርሱ ይወሰዳል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ያለው’ የሚለው ቃል ምን እንዳለው አይገልጽም፤ የግሪክ ጽሑፉም ይህን ክፍት ያደርገዋል።
    reason: lexical_alternative
  - marker: b
    text: በግሪክ ወንድ ነጠላ ቅርጽ በአጠቃላይ ተወካይነት ጥቅም ላይ ውሏል፤ ንግግሩ ማንኛውንም ሰው ያመለክታል።
    reason: cultural_note
lexical_decisions:
- source_word: ὅστις
  choice: ላለው / ለሌለው
  rationale: ይህ አገላለጽ አጠቃላይ መርሕ የሚያቀርበውን የግሪክ አያያዥ ተውላጠ ስም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: γὰρ
  choice: ምክንያቱም
  rationale: ከቀደመው ንግግር ጋር ያለውን የማብራሪያና የምክንያት ግንኙነት ያሳያል።
- source_word: ἔχει
  choice: ያለው
  rationale: የግሪኩን ቀላል የይዞታ ግስ ይጠብቃል፤ የተያዘው ነገር ምን እንደሆነም እንደ ምንጩ ሳይገለጽ ይቀራል።
- source_word: δοθήσεται αὐτῷ
  choice: ይሰጠዋል
  rationale: የወደፊት ጊዜ ተደራጊ ቅርጹን በተፈጥሯዊ አማርኛ ያቀርባል፤ ግሪኩ በግልጽ የማይጠቅሰውን ‘ተጨማሪ’ የሚል ቃል አያክልም።
- source_word: περισσευθήσεται
  choice: ይበዛለትማል
  rationale: የመትረፍንና የብዛትን ውጤት በአጭር፣ ተፈጥሯዊ አማርኛ ይገልጣል፤ ‘-ማል’ የሚለውም καὶ ያለውን ተጨማሪ አጽንዖት ያንጸባርቃል።
- source_word: δὲ
  choice: ግን
  rationale: በሁለቱ አንቀጾች መካከል ያለውን ግልጽ ንጽጽር ያሳያል።
- source_word: καὶ ὃ ἔχει
  choice: ያለው እንኳ
  rationale: καί እዚህ ያለውን አጽንዖታዊ የ‘እንኳ’ ትርጉም እና የንግግሩን አስገራሚ ንጽጽር ይጠብቃል።
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: ከእርሱ ይወሰዳል
  rationale: የማስወገድን ትርጉምና የግሪኩን ተደራጊ ቅርጽ በቀጥታ ይይዛል።
theological_decisions:
- issue: ‘አለው’ የሚለው ግስ ያልተገለጸ ባለቤት ነገር
  choice: ባለቤት የሆነው ነገር በዋናው ጽሑፍ አልተገለጸም።
  alternative: እውቀት፣ መረዳት፣ ተቀባይነት ወይም የመንግሥቱ ምስጢር ብሎ መግለጽ
  rationale: ዐውደ ንባቡ ከኢየሱስ ትምህርትና ከመንግሥቱ ምስጢር ጋር ቢያያዝም፣ የግሪክ ጽሑፉ ባለቤት የሆነውን ነገር አይገልጽም፤ ትርጉሙም ይህን ክፍትነት ጠብቋል።
- issue: ተወካይ ወንድ ነጠላ ቅርጽ
  choice: የምንጩን ነጠላ ተወካይ አገላለጽ ‘ላለው/ለሌለው’ እና ‘ከእርሱ’ በማለት ተጠብቋል።
  alternative: ወደ ብዙ ቁጥር ወይም ፆታን ወደማያመለክት ሰፊ ዳግም አገላለጽ መቀየር
  rationale: የግሪኩ ቅርጽ ወንድ ነጠላ ቢሆንም አጠቃላይ ተወካይ ኃይል አለው፤ አማርኛውም ቅርጹንና አጠቃላይ ትርጉሙን ሁለቱንም ይጠብቃል።
