  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ምሳሌያዊው አጭርነትና የሁለቱ ክፍሎች ንጽጽር ተጠብቋል።
