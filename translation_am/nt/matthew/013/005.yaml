  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὰ πετρώδη ὅπου οὐκ εἶχεν γῆν πολλήν, καὶ εὐθέως ἐξανέτειλεν διὰ τὸ μὴ ἔχειν βάθος γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/005.yaml
  text: Other seed fell on rocky ground[a], where it did not have much soil, and it sprang up at once because it had no depth of soil,
translation:
  language: am
  text: ሌላ ዘር ደግሞ ብዙ አፈር በሌለበት ድንጋያማ መሬት[a] ላይ ወደቀ፤ አፈሩ ጥልቀት ስላልነበረ ወዲያው በቀለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “በድንጋያማዎቹ ስፍራዎች ላይ”፤ አገላለጹ ከሥሩ ዓለት ያለበትን ቀጭን አፈር ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα δὲ
  choice: ሌላው ዘር ደግሞ
  rationale: ገለልተኛ ፆታ ያለው ብዙ ቁጥር ቅጽ በቀደመው ቁጥር የተጠቀሰውን ዘር ያመለክታል፤ በአማርኛ ተፈጥሯዊነትና ግልጽነት ሲባል ‘ዘር’ በግልጽ ተጨምሯል። ‘ደግሞ’ የδέን የንጽጽር ሽግግር ያሳያል።
- source_word: ἔπεσεν
  choice: ወደቀ
  rationale: ግሱ በቀጥታ ‘ወደቀ’ ማለት ነው፤ ‘ተዘራ’ ማለት ከምንጩ በላይ ትርጓሜ ይጨምራል።
- source_word: ἐπὶ τὰ πετρώδη
  choice: ድንጋያማ መሬት ላይ
  rationale: πετρώδη ድንጋያማ ስፍራዎችን ወይም ከሥሩ ዓለት ያለበትን ቀጭን አፈር ያመለክታል። ‘ድንጋያማ መሬት’ በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን ቃሉን በሰፊው አይተረጉምም።
- source_word: ὅπου οὐκ εἶχεν γῆν πολλήν
  choice: ብዙ አፈር በሌለበት
  rationale: የግሪኩን የቦታ አንቀጽ በተፈጥሯዊ አማርኛ ያቀርባል፤ γῆ በዚህ የእርሻ አውድ ‘አፈር’ ተብሏል።
- source_word: καὶ εὐθέως
  choice: ወዲያው
  rationale: εὐθέως የድርጊቱን ፈጣንነት ያሳያል፤ ‘ወዲያው’ ይህን የጊዜ ኃይል በተለመደ አማርኛ ይጠብቃል።
- source_word: ἐξανέτειλεν
  choice: በቀለ
  rationale: በዘርና በእርሻ አውድ ግሱ ዘሩ ከአፈር መውጣቱንና መብቀሉን ያመለክታል፤ ‘በቀለ’ ቀላልና ትክክለኛ ነው።
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: የአፈሩም ጥልቀት ስላልነበረው
  rationale: διά ከአንቀጻዊ የግስ ስም ጋር ምክንያትን ያመለክታል። አገላለጹ የአፈሩን ጥልቀት አለመኖር የፈጣን ብቅለቱ ምክንያት አድርጎ ያቀርባል።
