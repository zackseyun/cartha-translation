  text: በዚያን ቀን[a] ኢየሱስ ከቤት ወጥቶ በባሕሩ አጠገብ[b] ተቀምጦ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በዚያው ቀን።” ሐረጉ ከቀደመው ክፍል ጋር ያለውን ቀጣይነት የሚያጎላ ከሆነ እንዲህ ሊተረጎም ይችላል።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ “በባሕሩ አቅራቢያ።” የግሪኩ አገላለጽ ከባሕሩ አቅራቢያ ያለን ቦታ ያመለክታል እንጂ ከዳርቻው ያለውን ትክክለኛ ርቀት አይወስንም።
