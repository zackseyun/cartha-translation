lexical_decisions:
- source_word: Ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: በዚያን ቀን
  rationale: የግሪኩን የጊዜ አመልካች ሐረግ በተፈጥሯዊና በዘመናዊ አማርኛ ያስተላልፋል፤ ‘ያው’ የሚለውን አጽንዖት ግን በዋናው ጽሑፍ ላይ አይጨምርም።
- source_word: ἐξελθὼν … τῆς οἰκίας
