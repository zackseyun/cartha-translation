  text: καὶ ἐλάλησεν αὐτοῖς πολλὰ ἐν παραβολαῖς λέγων· Ἰδοὺ ἐξῆλθεν ὁ σπείρων τοῦ σπείρειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/003.yaml
  text: 'And he spoke many things to them in parables, saying: “Look, the sower went out to sow.”'
translation:
  language: am
  text: እርሱም በምሳሌዎች ብዙ ነገር ነገራቸው፤ እንዲህም አለ፦ “እነሆ፣ ዘሪው ሊዘራ ወጣ።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραβολαῖς
  choice: በምሳሌዎች
  rationale: የግሪክ ቃሉ አንድን እውነት በተነጻጻሪ ታሪክ ወይም ምሳሌ ማስተማርን ያመለክታል፤ ‘ምሳሌ’ በአማርኛ የተለመደና ተገቢ ነው።
- source_word: Ἰδού
  choice: እነሆ
  rationale: የአድማጮችን ትኩረት ወደሚቀጥለው ትረካ የሚጠራውን ኃይል በክብር ያለውና ለአንባቢ የሚታወቅ አገላለጽ ይጠብቃል።
- source_word: ὁ σπείρων
  choice: ዘሪው
  rationale: በግሪክ ያለውን ስም የሆነ የአሁን ጊዜ ቦዝ አንቀጽ፣ ‘የሚዘራው ሰው’ የሚለውን፣ በተፈጥሯዊና አጭር የአማርኛ ስም ያቀርባል።
- source_word: τοῦ σπείρειν
  choice: ሊዘራ
  rationale: የዓላማ ትርጉሙን፣ ዘሪው የወጣበትን ዓላማ፣ በተፈጥሯዊ የአማርኛ አገባብ ይገልጻል።
