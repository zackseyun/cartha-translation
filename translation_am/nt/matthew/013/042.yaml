id: MAT.13.42
reference: Matthew 13:42
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/042.yaml
  text: and they will throw them into the furnace of fire[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: am
  text: እነርሱንም በየእሳት እቶን ውስጥ ይጥሏቸዋል፤ በዚያም ልቅሶና ጥርስ ማፋጨት ይሆናል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαλοῦσιν
  choice: ይጥሏቸዋል
  rationale: የግሱን የወደፊት ጊዜና በኃይል የመወርወር ስሜት በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: κάμινον τοῦ πυρός
  choice: ወደ እሳት እቶን
  rationale: የግሪኩን የባለቤትነት አወቃቀር በአማርኛ ተፈጥሯዊ በሆነ ስም-ገላጭ አገላለጽ ያቀርባል፤ የፍርድን ተጨባጭ ምስል አያለዝብም።
- source_word: ἐκεῖ
  choice: በዚያም
  rationale: ቀደም ሲል የተጠቀሰውን ቦታ በግልጽ ያመለክታል፤ ተያያዥነቱንም በ‘ም’ ይጠብቃል።
- source_word: κλαυθμός
  choice: ልቅሶ
  rationale: ሐዘንና ስቃይ የሚገልጸውን ስም በቀጥታና በተለመደ የአማርኛ ቃል ያቀርባል።
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: ጥርስ ማፋጨት
  rationale: የግሪኩን የተለመደ ፈሊጥ በአማርኛ የታወቀና ትክክለኛ አገላለጽ ያቀርባል፤ ሐዘን ወይም ቁጣ ብቻ ብሎ ትርጉሙን አያጠብም።
- source_word: καὶ
  choice: ም
  rationale: በአማርኛ ከቃል ጋር የሚጣበቀው አያያዥ ቅጥያ የግሪኩን ቀላል ትስስር በተፈጥሯዊ ሁኔታ ይጠብቃል።
- source_word: αὐτούς
  choice: እነርሱን / -አቸው
  rationale: ቀደም ሲል የተጠቀሱትን ብዙ ሰዎች የሚያመለክተውን ተውላጠ ስም ያለ አስፈላጊ ማብራሪያ ይጠብቃል።
theological_decisions:
- issue: ‘የእሳት እቶን’ የሚለው የፍርድ ምስል ባሕርይ
  choice: የፍርድን ተጨባጭ ዘይቤ እንዳለ ማቆየት
  alternative: ‘ገሃነም’ ብሎ በኋለኛ የሥነ መለኮት ቃል መተርጎም
  rationale: ምንጩ የእቶንን ምስል ይጠቀማል፤ ትርጉሙም ምስሉን ሳያለዝብ ወይም ከጽሑፉ በላይ ሳይወስን ያቆየዋል።
- issue: ‘ልቅሶና ጥርስ ማፋጨት’ የሚለው አገላለጽ ኃይል
  choice: የማቴዎስን የስቃይና የፍርድ የተለመደ አገላለጽ ማቆየት
  alternative: ጥርስ ማፋጨትን ቁጣ ብቻ ወይም ሐዘን ብቻ አድርጎ መግለጽ
  rationale: አገላለጹ ከባድ ጭንቀትን ይጠቁማል፤ ትርጉሙ ሊኖረው የሚችለውን ሰፊ ስሜታዊ ኃይል አያጠብም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለመደበኛ አንባቢ ግልጽ የሆነ አማርኛ። ‘እቶን’ መጽሐፍ ቅዱሳዊ ክብደቱን ሲጠብቅ አሁንም ሊገባ የሚችል ቃል ነው። የግሪኩ አንድ ዓረፍተ ነገር በሰሚኮሎን ተጠብቋል።
