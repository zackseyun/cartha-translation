id: MAT.13.34
reference: Matthew 13:34
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ταῦτα πάντα ἐλάλησεν ὁ Ἰησοῦς ἐν παραβολαῖς τοῖς ὄχλοις, καὶ χωρὶς παραβολῆς ⸀οὐδὲν ἐλάλει αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/034.yaml
  text: Jesus spoke all these things to the crowds in parables[a], and apart from a parable he said nothing to them.
translation:
  language: am
  text: ኢየሱስ እነዚህን ሁሉ ለሕዝቡ በምሳሌዎች ተናገረ፤ ያለ ምሳሌም ምንም አይናገራቸውም ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα πάντα
  choice: እነዚህን ሁሉ
  rationale: የጠቋሚውንና የሁሉን አቀፍነት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐλάλησεν
  choice: ተናገረ
  rationale: የኢየሱስን ንግግር በአጠቃላይ የሚያጠቃልለውን የግሪክ አውሪስት በተፈጥሯዊ የትረካ አማርኛ ይገልጣል።
- source_word: ἐν παραβολαῖς
  choice: በምሳሌዎች
  rationale: ἐν እዚህ የአነጋገር ዘዴን ወይም መንገድን ያመለክታል፤ የብዙ ቁጥሩም ተጠብቋል።
- source_word: τοῖς ὄχλοις
  choice: ለሕዝቡ
  rationale: ὄχλοι በቅርጹ ብዙ ቁጥር ቢሆንም፣ ብዙ የተሰበሰቡ ሰዎችን በዘመናዊ አማርኛ በተፈጥሮ የሚገልጸው ‘ሕዝቡ’ ነው።
- source_word: χωρὶς παραβολῆς
  choice: ያለ ምሳሌ
  rationale: χωρίς የሚያመለክተውን ‘ያለ/ከ... በቀር’ ትርጉምና የπαραβολῆςን ነጠላ ቁጥር ይጠብቃል።
- source_word: οὐδὲν ἐλάλει αὐτοῖς
  choice: ምንም አይናገራቸውም ነበር
  rationale: አሉታዊውን οὐδέν እና የἐλάλειን ቀጣይነት ወይም ልማዳዊነት በተፈጥሯዊ አማርኛ ይገልጣል፤ αὐτοῖςም በግሱ የተያያዘው ‘-አቸው’ ነው።
theological_decisions:
- issue: በሁለተኛው ሐረግ ያለው የἐλάλει ያልተጠናቀቀ ግስ አጽንዖት
  choice: አይናገራቸውም ነበር
  alternative: ምንም አልተናገራቸውም
  rationale: የግሪክ ኢምፐርፌክት በዚህ አውድ የቀጣይነትን ወይም የተለመደ ተግባርን ሊያመለክት ስለሚችል፣ ‘አይናገራቸውም ነበር’ የሚለው የትረካውን አጽንዖት ሳያጠብ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። ‘ምሳሌ’ በወንጌላዊው አውድ የπαραβολήን የተለመደ መጽሐፍ ቅዱሳዊ ቃል ሆኖ ተጠቅሟል።
