  text: καὶ οὐκ ἐποίησεν ἐκεῖ δυνάμεις πολλὰς διὰ τὴν ἀπιστίαν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/058.yaml
  text: And he did not do many mighty works there because of their unbelief[a].
translation:
  language: am
  text: እናም በእነርሱ አለማመን ምክንያት በዚያ ብዙ የኃይል ሥራዎችን[a] አላደረገም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ብዙ ተአምራትን” ወይም “ብዙ የኃይል ተግባራትን።” የግሪኩ ቃል የኃይል ሥራዎችን ያመለክታል፤ በዚህ ዐውድም ተአምራዊ ሥራዎችን ይጠቁማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὐκ ἐποίησεν
  choice: አላደረገም
  rationale: ποιέω በመሠረቱ ‘ማድረግ’ ማለት ሲሆን፣ ከδυνάμεις ጋር በዚህ ዐውድ የኃይል ሥራዎችን ማድረግን ያመለክታል። καί በአማርኛ የሐረጉ ቅንብር ‘በእነርሱም’ በሚለው -ም ተወክሏል።
- source_word: ἐκεῖ
  choice: በዚያ
  rationale: የቦታ ተውሳክ ሲሆን በዐውዱ የተጠቀሰውን ስፍራ በቀጥታ ያመለክታል።
- source_word: δυνάμεις πολλὰς
  choice: ብዙ የኃይል ሥራዎችን
  rationale: δύναμις በወንጌላት የተአምራዊ ኃይል ተግባራትን ሊያመለክት ይችላል። ‘የኃይል ሥራዎች’ ከኃይል ጋር ያለውን የቃሉን ግንኙነት ሳያጠፋ ዐውዳዊ ትርጉሙን ያቀርባል፤ πολλὰς ደግሞ ‘ብዙ’ ተብሏል።
- source_word: διὰ τὴν ἀπιστίαν αὐτῶν
  choice: በእነርሱም አለማመን ምክንያት
  rationale: διά ከተሳቢ ቅጽ ጋር እዚህ ምክንያትን ያሳያል። ἀπιστία ደግሞ እምነት አለመኖርን ወይም አለማመንን ያመለክታል፤ ‘አለማመን’ የንግግር ተፈጥሯዊነትንና የግሪኩን አሉታዊ ኃይል ይጠብቃል።
theological_decisions:
- issue: ቃሉ ኢየሱስ ማድረግ እንዳልቻለ ወይስ እንዳላደረገ የሚናገር መሆኑ
  choice: ‘ብዙ ... አላደረገም’ ተብሎ የተፈጸመውን ተግባር ብቻ ይገልጻል።
  alternative: ‘ብዙ ተአምራትን ማድረግ አልቻለም’ የሚል ትርጉም።
  rationale: የማቴዎስ ግሪክ οὐκ ἐποίησεν (‘አላደረገም’) ይላል እንጂ አለመቻልን የሚገልጽ ግስ አይጠቀምም። ስለዚህ ጽሑፉ ከሚለው በላይ ሳይጨመር ሥነ መለኮታዊው ውጥረት ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። ‘የኃይል ሥራዎች’ የሚለው አነጋገር የግሪኩን ምስል ይጠብቃል፤ ይበልጥ የተለመደው ‘ተአምራት’ በማስታወሻ ቀርቧል።
