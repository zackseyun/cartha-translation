    reason: lexical_alternative
  - marker: b
    text: “ተሰጥቷችኋል” የሚለው ተሳቢ አገላለጽ ሰጪውን በግልጽ አይጠቅስም፤ በአውዱ ግን መለኮታዊ ሰጪ ሊጠቆም ይችላል።
