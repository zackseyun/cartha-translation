  text: You[a], then, hear the parable of the one who sowed.
translation:
  language: am
  text: እናንተ እንግዲህ የዘራውን ምሳሌ ስሙ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς
  choice: እናንተስ
  rationale: ግልጽ የሆነውንና አጽንዖት የያዘውን የሁለተኛ መደብ ብዙ ቁጥር ተውላጠ ስም ይጠብቃል፤ «-ስ» ደግሞ ከቀደመው ንግግር ጋር ያለውን ንጽጽራዊ ሽግግር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οὖν
  choice: -ስ
  rationale: በዚህ ዐውድ ቃሉ ጠንካራ ምክንያታዊ ድምዳሜን ሳይሆን ከቀደመው ንግግር ወደ ደቀ መዛሙርቱ የሚደረግ ሽግግርን ያመለክታል፤ «እናንተስ» ይህን በአጭርና ተፈጥሯዊ መንገድ ይይዛል።
- source_word: ἀκούσατε
  choice: ስሙ
  rationale: የሁለተኛ መደብ ብዙ ቁጥር ትእዛዛዊ አኳኋንን በቀጥታ ይጠብቃል። «ተረዱ» ማለት በግሪኩ ያልተገለጸውን ትርጉም ይጨምራል።
- source_word: παραβολὴν
  choice: ምሳሌ
  rationale: በወንጌላት የትምህርት ዐውድ παραβολήን ለመግለጽ የተለመደ፣ ግልጽና ተፈጥሯዊ የአማርኛ ቃል ነው።
- source_word: τοῦ σπείραντος
  choice: የዘሪውን
  rationale: ስም ሆኖ የቆመውን ያለፈ ጊዜ አድራጊ አንቀጽ በተፈጥሯዊ አማርኛ ይገልጻል። «የዘራውን ሰው» የቅርጹን ያለፈ ጊዜ በቀጥታ ቢያሳይም፣ «ዘሪ» በዚህ ዐውድ የሚነበብና የታወቀ አጭር አገላለጽ ነው።
