- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: የሰማያት መንግሥት
  rationale: የማቴዎስን የተለመደ አገላለጽ ይጠብቃል፤ βασιλεία የንግሥናን አገዛዝም ሆነ ግዛት ሊያመለክት የሚችልበትን ስፋት አይዘጋም።
- source_word: θησαυρῷ
  choice: ውድ ሀብት
  rationale: በእርሻ ውስጥ ተደብቆ የተገኘ ከፍተኛ ዋጋ ያለው ንብረት መሆኑን በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: κεκρυμμένῳ ἐν τῷ ἀγρῷ
  choice: በእርሻ ውስጥ እንደተሰወረ
  rationale: ፍጹም ተገብሮ አንቀጹ የሚያሳየውን ተሰውሮ የመቆየት ሁኔታ ይጠብቃል።
- source_word: ὃν εὑρὼν ἄνθρωπος
  choice: አንድ ሰው አግኝቶት
  rationale: ἄνθρωπος በዚህ ዐውድ ያልተወሰነን ሰው ያመለክታል፤ በአማርኛም “አንድ ሰው” ተፈጥሯዊ ነው። የተያያዘው ተውላጠ ስም የተገኘውን ሀብት በግልጽ ያመለክታል።
- source_word: ἔκρυψεν
  choice: እንደገና ሰወረው
  rationale: ቀድሞ ተሰውሮ የነበረውን ሀብት ካገኘ በኋላ መልሶ መሰወሩን በአማርኛ ግልጽ ያደርጋል፤ “እንደገና” ከትረካው ቅደም ተከተል የተገኘ ግልጽ ማድረጊያ ነው።
- source_word: ἀπὸ τῆς χαρᾶς αὐτοῦ
  choice: ከደስታውም የተነሣ
  rationale: ἀπό እዚህ የሚያሳየውን አነሳሽ ምክንያት ያስተላልፋል፤ ከየትኛው ግስ ጋር እንደሚያያዝ ያለው አገባባዊ አማራጭ በማስታወሻ [b] ተጠብቋል።
- source_word: ὑπάγει καὶ πωλεῖ πάντα ὅσα ἔχει
  choice: ሄዶ ያለውን ሁሉ ይሸጣል
  rationale: የግሪኩን ሕያው የአሁን ጊዜ ትረካና የሽያጩን ሙሉነት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἀγοράζει τὸν ἀγρὸν ἐκεῖνον
  choice: ያንንም እርሻ ይገዛል
  rationale: ἐκεῖνον የሚሰጠውን በተወሰነው እርሻ ላይ ያለ አጽንዖት “ያንን” በማለት ይጠብቃል።
theological_decisions:
- issue: የβασιλεία ትርጉም
  choice: መንግሥት
  alternative: አገዛዝ
  rationale: “መንግሥት” በአማርኛ የተለመደና የተከበረ መጽሐፍ ቅዱሳዊ ቃል ሲሆን የንጉሣዊ አገዛዝንም የግዛትንም ትርጉም ሊሸከም ይችላል፤ የምሳሌውን ትርጉም በአንድ ትምህርታዊ አቋም አይወስንም።
- issue: የἄνθρωπος አተረጓጎም
  choice: አንድ ሰው
  alternative: አንድ ወንድ
  rationale: ἄνθρωπος ሰውን በአጠቃላይ ሊያመለክት የሚችል ቃል ነው፤ አማርኛ ግሶችም በዚህ ዓረፍተ ነገር ጾታን ስለማያስገድዱ፣ “አንድ ሰው” ከምንጩ በላይ ጾታውን ሳይወስን የውክልና ባሕርዩን ይጠብቃል።
- issue: ሀብቱን መልሶ የመሰወሩ ሥነ ምግባራዊ ግምገማ
  choice: ድርጊቱን እንደ ትረካ ብቻ ማቅረብ
  alternative: ድርጊቱን ማጽደቅ ወይም መኮነን
  rationale: ጥቅሱ ድርጊቱን ይተርካል እንጂ ግልጽ የሥነ ምግባር ፍርድ አይሰጥም፤ ትርጉሙም ያንን ውጥረት ሳይፈታ ይጠብቃል።
