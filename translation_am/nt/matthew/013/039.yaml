base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/039.yaml
  text: And the enemy who sowed them is the devil; the harvest is the end of the age[a], and the harvesters are angels.
translation:
  language: am
  text: እነዚያን የዘራው ጠላት ዲያብሎስ ነው፤ መከሩም የዘመኑ ፍጻሜ[a] ነው፤ አጫጆቹም መላእክት ናቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የዘመኑ መጠናቀቅ”፤ በባህላዊ አተረጓጎም፣ “የዓለም ፍጻሜ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχθρὸς
  choice: ጠላት
  rationale: በዚህ ዐውደ ንባብ የግል ተቃዋሚነትን በግልጽና በተለመደ አማርኛ ያሳያል።
- source_word: ὁ σπείρας
  choice: የዘራው
  rationale: የተፈጸመውን የመዝራት ድርጊት ጠብቆ ጠላቱን በድርጊቱ ይለያል።
- source_word: αὐτά
  choice: እነርሱን
  rationale: በምሳሌው ውስጥ ቀደም ሲል የተጠቀሱትን እንክርዳዶች የሚያመለክት ተፈጥሯዊ ተውላጠ ስም ነው።
- source_word: διάβολος
  choice: ዲያብሎስ
  rationale: ቃሉ እዚህ የታወቀውን መንፈሳዊ ግለሰብ የሚጠቁም መጠሪያ ስለሆነ በአማርኛ የተለመደው መጠሪያ ተመርጧል።
- source_word: θερισμὸς
  choice: መከር
  rationale: የእርሻውን ምስል ጠብቆ በዘመናዊ አማርኛ የመሰብሰቢያውን ጊዜና ሂደት በተፈጥሯዊ ሁኔታ ያመለክታል።
- source_word: συντέλεια αἰῶνός
  choice: የዘመኑ ፍጻሜ
  rationale: αἰών ያለውን ጊዜያዊ ትርጉም ‘ዘመን’ ይጠብቃል፤ ‘ፍጻሜ’ ደግሞ συντέλεια የሚያመለክተውን መደምደሚያና መጠናቀቅ ያስተላልፋል።
- source_word: θερισταὶ
  choice: አጫጆች
  rationale: የሚያጭዱትን ሠራተኞች በቀጥታ የሚጠራና የግብርናውን ምስል የሚጠብቅ ተፈጥሯዊ ቃል ነው።
- source_word: ἄγγελοί
  choice: መላእክት
  rationale: የፍጻሜ ዘመን ዐውደ ንባቡ ሰማያዊ ፍጥረታትን ስለሚጠቁም ‘መልእክተኞች’ ከሚለው ይልቅ ይህ ግልጽ ነው።
- source_word: δὲ
  choice: ም / ሰረዝ
  rationale: በሦስቱ ንዑሳን ሐረጎች ያለውን የሐሳብ እድገት በአማርኛ ተፈጥሯዊ በሆነው ‘-ም’ አያያዥና በሥርዓተ ነጥብ ይወክላል።
theological_decisions:
- issue: በፍጻሜ ዘመን ሐረግ συντέλεια αἰῶνός ውስጥ αἰών የሚለውን መተርጎም
  choice: የዘመኑ ፍጻሜ
  alternative: የዓለም ፍጻሜ / የዘመኑ መጠናቀቅ
  rationale: ‘ዘመን’ የግሪኩን ጊዜያዊ ስሜት ይጠብቃል፤ ‘ዓለም’ ግን ጽሑፉ የግድ የማይጠይቀውን የፍጥረተ ዓለም መጥፋት ሐሳብ ሊያስገባ ይችላል። ‘ፍጻሜ’ የመጨረሻንም ሆነ የመጠናቀቅን ስሜት ሳያጠብ ያስተላልፋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። የግሪኩ ተደጋጋሚ δέ በ‘-ም’ አያያዝና በሰረዝ ተወክሏል፤ የግብርናው ምስል ‘መከር’ና ‘አጫጆች’ በሚሉት ቃላት ተጠብቋል።
