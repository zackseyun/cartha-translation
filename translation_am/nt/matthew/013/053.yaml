  yaml_path: translation/nt/matthew/013/053.yaml
  text: And when Jesus had finished these parables[a], he departed from there.
translation:
  language: am
  text: ኢየሱስም እነዚህን ምሳሌዎች ከጨረሰ በኋላ፣ ከዚያ ሄደ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም ቃል በቃል፦ «እንዲህም ሆነ፤ ኢየሱስ እነዚህን ምሳሌዎች በጨረሰ ጊዜ፣ ከዚያ ሄደ።»
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐγένετο ὅτε
  choice: ከጨረሰ በኋላ
  rationale: የግሪክኛው አገላለጽ የትረካ ሽግግርና የጊዜ ግንኙነት ያሳያል። ቃል በቃል «እንዲህም ሆነ፣ በ…ጊዜ» ከማለት ይልቅ «ከ…በኋላ» በዘመናዊ አማርኛ ተፈጥሯዊ ሆኖ የድርጊቶቹን ቅደም ተከተል ይጠብቃል።
- source_word: ἐτέλεσεν
  choice: ተናግሮ ከጨረሰ
  rationale: τελέω አንድን ነገር ወደ ፍጻሜ ማድረስን ያመለክታል። «ተናግሮ ከጨረሰ» የምሳሌዎቹን ንግግር መጨረሱን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: παραβολὰς ταύτας
  choice: እነዚህን ምሳሌዎች
  rationale: «ምሳሌ» በወንጌላት የማስተማር ዐውድ παραβολήን ለመተርጎም የተለመደና የዘውጉን ትርጉም የሚጠብቅ ቃል ነው፤ «እነዚህን» ደግሞ ቀደም ብለው የተነገሩትን ያመለክታል።
- source_word: μετῆρεν
  choice: ሄደ
  rationale: μεταίρω ከአንድ ቦታ ተነሥቶ መሄድን ያመለክታል። «ሄደ» ድርጊቱን ያለ አላስፈላጊ ክብደት በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: ἐκεῖθεν
  choice: ከዚያ
  rationale: የቦታ መነሻን የሚገልጸውን «ከዚያ» በአጭርና በተለመደ አማርኛ ያስተላልፋል።
