base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/052.yaml
  text: Then he said to them[c][b][a], “Therefore every scribe who has been trained for the kingdom of heaven is like a master of a house who brings out of his treasure new things and old.”
translation:
  language: am
  text: እርሱም፣ “ስለዚህ ለሰማያት መንግሥት የሠለጠነ እያንዳንዱ ጸሐፊ[a] ከግምጃ ቤቱ[b] አዲስና አሮጌ ነገሮችን እንደሚያወጣ የቤት ባለቤት[c] ይመስላል” አላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የሰማያት መንግሥት ደቀ መዝሙር የተደረገ እያንዳንዱ ጸሐፊ።” የግሪኩ አገላለጽ መማርን ወይም መሰልጠንን ብቻ ሳይሆን ደቀ መዝሙር መደረግንም ሊያመለክት ይችላል።
    reason: alternative_reading
  - marker: b
    text: “ግምጃ ቤት” የተከማቸ ሀብትን ወይም ውድ ነገሮች የሚቀመጡበትን ስፍራ ሊያመለክት ይችላል።
    reason: lexical_alternative
