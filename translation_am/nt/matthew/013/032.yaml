  rationale: ምስሉ ሕዝቅኤል 17፥23ን ወይም ዳንኤል 4፥12ን ሊያስታውስ ቢችልም፣ የግሪኩ ጽሑፍ በዚህ ቁጥር ምልክቱን በግልጽ አይተረጉምም።
