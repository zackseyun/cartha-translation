  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὃ μικρότερον μέν ἐστιν πάντων τῶν σπερμάτων, ὅταν δὲ αὐξηθῇ μεῖζον τῶν λαχάνων ἐστὶν καὶ γίνεται δένδρον, ὥστε ἐλθεῖν τὰ πετεινὰ τοῦ οὐρανοῦ καὶ κατασκηνοῦν ἐν τοῖς κλάδοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/032.yaml
  text: It is indeed smaller than all the seeds[a], but when it has grown, it is larger than the garden plants and becomes a tree[b], so that the birds of the sky come and nest in its branches.
translation:
  language: am
  text: ይህ ከዘሮች ሁሉ ያነሰ ቢሆንም፣ ካደገ በኋላ ከአትክልት ተክሎች ይበልጣል፤ ዛፍም ይሆናል፤ የሰማይ ወፎች[a] መጥተው በቅርንጫፎቹ መካከል እስኪሰፍሩ ድረስ።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የአየር ወፎች” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወፎች በቅርንጫፎቹ መካከል የሚሰፍሩበት ይህ ምስል፣ ታላቅ መንግሥትን በዛፍ የሚያሳዩ የብሉይ ኪዳን ምስሎችን ሊያስታውስ ይችላል (ለምሳሌ፣ ሕዝቅኤል 17፥23፤ ዳንኤል 4፥12)፤ ነገር ግን ቁጥሩ ምልክቱን በግልጽ አይተረጉምም።
    reason: cross_reference
lexical_decisions:
- source_word: μικρότερον ... πάντων τῶν σπερμάτων
  choice: ከዘሮች ሁሉ ያነሰ
  rationale: የግሪኩን ንጽጽራዊ ቅርጽ ‘ያነሰ’ በማለት በግልጽ ይጠብቃል፤ በግድ ‘ከሁሉ ትንሹ’ ብሎ አይለውጠውም።
- source_word: μέν ... δέ
  choice: እርሱም ... ነገር ግን
  rationale: በዘሩ ትንሽነትና በኋላው ታላቅ እድገት መካከል ያለውን ንጽጽር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὅταν ... αὐξηθῇ
  choice: ካደገ በኋላ
  rationale: እድገቱ ተፈጽሞ የሚከተለው ውጤት መታየቱን ያሳያል።
- source_word: μεῖζον τῶν λαχάνων
  choice: ከአትክልት ተክሎች ይበልጣል
  rationale: λάχανα የሚለውን ሰፊ የተተከሉ የአትክልት ዓይነቶች ትርጉም ይጠብቃል፤ ‘አትክልቶች’ ብቻ ከሚያመጣው የምግብ አትክልት ጠባብ ግንዛቤም ይርቃል።
- source_word: γίνεται δένδρον
  choice: ዛፍም ይሆናል
  rationale: ግሪኩ ምስሉን በቀጥታ ‘ዛፍ’ ስለሚል፣ ወደ ‘ዛፍ የሚመስል’ በማለት አይለዝበውም።
- source_word: ὥστε ἐλθεῖν
  choice: ስለዚህ ... መጥተው
  rationale: የእድገቱን ውጤት በተፈጥሯዊ የአማርኛ አገናኝ ያቀርባል።
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: የሰማይ ወፎች
  rationale: οὐρανός በዚህ ዐውድ ወፎች የሚበሩበትን ሰማይ ያመለክታል፤ ቀጥተኛውን ምስል ይጠብቃል።
- source_word: κατασκηνοῦν ἐν τοῖς κλάδοις αὐτοῦ
  choice: በቅርንጫፎቹ ላይ ይሰፍራሉ
  rationale: κατασκηνόω የመቀመጥን፣ የመኖርን ወይም ጎጆ የመሥራትን ሐሳብ ሊይዝ ስለሚችል፣ ‘ይሰፍራሉ’ የግሪኩን ስፋት ሳያጠብ በወፎች ዐውድ ተፈጥሯዊ ነው።
theological_decisions:
- issue: በታላቅ ዛፍ ቅርንጫፎች የሚሰፍሩ ወፎች ምስል ሊያመለክተው የሚችለው የብሉይ ኪዳን ጥቅስ
