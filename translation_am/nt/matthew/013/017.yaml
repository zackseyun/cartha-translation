  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν ὅτι πολλοὶ προφῆται καὶ δίκαιοι ἐπεθύμησαν ἰδεῖν ἃ βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/017.yaml
  text: For truly I say to you that many prophets and righteous people longed to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: am
  text: እውነት እላችኋለሁና፣ ብዙ ነቢያትና ጻድቃን[a] እናንተ የምታዩትን ለማየት ናፍቀው ነበሩ፣ ነገር ግን አላዩትም፤ እናንተ የምትሰሙትንም ለመስማት ናፍቀው ነበሩ፣ ነገር ግን አልሰሙትም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ጻድቅ ሰዎች።» የግሪኩ ቃል እንደ ስም የተጠቀመ ቅጽል ሲሆን፣ ጻድቅ የሆኑ ሰዎችን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: እውነት
  rationale: በ«እላችኋለሁ» ቀመር ውስጥ ያለውን የተረጋገጠና የተከበረ አጽንዖት በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: γὰρ
  choice: -ና
  rationale: ከቀደመው ንግግር ጋር ያለውን የማብራሪያ ግንኙነት በ«እላችኋለሁና» የምክንያት ቅጥያ በተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: δίκαιοι
  choice: ጻድቃን
  rationale: በግሪክ እንደ ስም የተጠቀመውን ብዙ ቁጥር ቅጽ በተለመደው የአማርኛ መጽሐፍ ቅዱሳዊ ቃል ይወክላል።
- source_word: ἐπεθύμησαν
  choice: ናፍቀው ነበር
  rationale: ግሱ የሚገልጠውን ጠንካራና ቀጣይ ምኞት ያለ አሉታዊ ፍቺ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἃ βλέπετε / ἃ ἀκούετε
  choice: እናንተ የምታዩትን / እናንተ የምትሰሙትን
  rationale: የግሪኩን አንጻራዊ ሐረጎችና የአሁን ጊዜ ግሶች ግልጽና ተፈጥሯዊ በሆነ አማርኛ ያቆያል።
- source_word: οὐκ εἶδαν / οὐκ ἤκουσαν
  choice: አላዩትም / አልሰሙትም
  rationale: የተመኙትን ነገር በታሪክ እንዳላገኙ የሚገልጠውን አሉታዊ ያለፈ ጊዜ በአጭር አማርኛ ያስተላልፋል።
theological_decisions:
- issue: የδίκαιοι ወሰን
  choice: «ጻድቃን» በማለት ከነቢያት ጎን ያለ ሰፊ የሰዎች ምድብ ሆኖ ቀርቧል።
  alternative: «ጻድቅ ሰዎች» ተብሎ ሊተረጎም ይችላል።
  rationale: ቅጽሉ በግሪክ እንደ ስም የተጠቀመ ሲሆን፣ ነቢያትን ብቻ እንዲያመለክት መገደብ የለበትም።
- issue: የታየውና የተሰማው ነገር
  choice: «የምታዩትን» እና «የምትሰሙትን» በማለት ግልጽ ተጨማሪ መግለጫ ሳይገባ ተቀምጧል።
  alternative: «መሲሑን» ወይም «የመንግሥቱን ምስጢር» በማለት ትርጓሜያዊ ማብራሪያ መጨመር።
  rationale: ዐውደ ንባቡ የኢየሱስን አገልግሎትና የመንግሥቱን መገለጥ ቢያመለክትም፣ ጥቅሱ ራሱ የነገሩን ስም በግልጽ አይጠቅስም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። «ጻድቃን» የተለመደ መጽሐፍ ቅዱሳዊ ቃል ቢሆንም ለአጠቃላይ አንባቢ የሚታወቅ ነው፤ አማራጩም በማስታወሻ ተገልጿል።
