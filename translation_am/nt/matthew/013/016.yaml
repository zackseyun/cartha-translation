base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/016.yaml
  text: But blessed are your eyes[a], because they see, and your ears, because they hear.
translation:
  language: am
  text: ነገር ግን ዓይኖቻችሁ ስለሚያዩ፣ ጆሮዎቻችሁም ስለሚሰሙ ብፁዓን ናቸው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ያያሉና … ይሰማሉና።” እዚህ ያለው የግሪክ አያያዥ ቃል ምክንያትን በሁለቱም መንገድ ሊገልጽ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከቀደመው ስለማያዩና ስለማይሰሙ ከተነገረው ጋር ያለውን ንፅፅር በግልጽ ያሳያል።
- source_word: μακάριοι
  choice: ብፁዓን
  rationale: በብፅዕና ንግግር አውድ የመለኮታዊ ሞገስን ሐሳብ የሚጠብቅ የተለመደ እና ክቡር አገላለጽ ነው።
- source_word: οἱ ὀφθαλμοὶ / τὰ ὦτα ὑμῶν
  choice: ዓይኖቻችሁ / ጆሮዎቻችሁ
  rationale: የግሪኩን ባለቤትነትና ትይዩነት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὅτι βλέπουσιν / ὅτι ἀκούουσιν
  choice: ስለሚያዩ / ስለሚሰሙ
  rationale: ὅτιን እንደ ምክንያት አመልካች በመውሰድ ዓይኖቹና ጆሮዎቹ ብፁዓን የተባሉበትን ምክንያት በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: βλέπουσιν / ἀκούουσιν
  choice: ያያሉ / ይሰማሉ
  rationale: ቀጥተኛውን የስሜት ሕዋሳት ቃላት ይጠብቃል፤ መንፈሳዊውን አንድምታ አውዱ እንዲያቀርብ ይተዋል።
theological_decisions:
- issue: ማየትንና መስማትን በግልጽ መንፈሳዊ ትርጉም ማቅረብ ወይስ ቀጥተኛውን ቋንቋ መጠበቅ
  choice: “ማየት” እና “መስማት” የሚሉትን ቀጥተኛ የስሜት ሕዋሳት ቃላት መጠበቅ
  alternative: “መገንዘብ” ወይም “ማስተዋል” ብሎ መተርጎም
  rationale: አውዱ ጥልቅ መንፈሳዊ አንድምታ ቢኖረውም፣ ጥቅሱ ራሱ የሚጠቀመው ማየትና መስማት የሚሉትን ቃላት ነው። እነሱን መጠበቅ የጽሑፉን ሥነ መለኮታዊ ውጥረት ሳይፈታ ያቆያል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። “ብፁዓን” የመጽሐፍ ቅዱስን የብፅዕና ንግግር ድምፅ ይጠብቃል፤ የዓይንና የጆሮ ትይዩነትም በተፈጥሯዊ የአማርኛ አገባብ ቀርቧል።
