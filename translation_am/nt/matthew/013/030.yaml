source:
  edition: SBLGNT
  text: ἄφετε συναυξάνεσθαι ἀμφότερα ⸀μέχρι τοῦ θερισμοῦ· καὶ ἐν καιρῷ τοῦ θερισμοῦ ἐρῶ τοῖς θερισταῖς· Συλλέξατε πρῶτον τὰ ζιζάνια καὶ δήσατε αὐτὰ εἰς δέσμας πρὸς τὸ κατακαῦσαι αὐτά, τὸν δὲ σῖτον ⸀συναγάγετε εἰς τὴν ἀποθήκην μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/030.yaml
  text: Let both grow together until the harvest[a], and at the time of harvest I will tell the reapers, ‘First collect the weeds and tie them into bundles to burn them, but gather the wheat into my storehouse.’
translation:
  language: am
  text: ሁለቱም እስከ መከሩ ድረስ አብረው እንዲያድጉ ተዉአቸው፤ በመከሩም ጊዜ አጫጆቹን፣ ‘አረሞቹን[a] አስቀድማችሁ ሰብስቡና እንዲቃጠሉ በነዶ ነዶ አስሯቸው፤ ስንዴውን ግን ወደ ጎተራዬ ሰብስቡ’ እላቸዋለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የስንዴ አረሞቹን”፤ በተለምዶ “እንክርዳዱን።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφετε
  choice: ይደጉ
  rationale: ከሚከተለው የማደግ ግስ ጋር ሲያያዝ ፈቃድ ሰጪውን ‘እንዲያድጉ ተዉአቸው’ የሚለውን ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: συναυξάνεσθαι ἀμφότερα
  choice: ሁለቱም … አብረው ይደጉ
  rationale: συν- የሚያመለክተውን አብሮነትና ἀμφότερα የሚያመለክተውን ሁለቱንም በግልጽ ይጠብቃል።
- source_word: μέχρι τοῦ θερισμοῦ
  choice: እስከ መከሩ ድረስ
  rationale: በምሳሌው ውስጥ የተወሰነውን የመከር ክስተት ያሳያል።
- source_word: ἐν καιρῷ τοῦ θερισμοῦ
  choice: በመከሩም ጊዜ
  rationale: የመከሩን ተገቢ ወይም የተወሰነ ጊዜ በቀላልና በቅርብ መንገድ ይገልጻል።
- source_word: θερισταῖς
  choice: አጫጆቹን
  rationale: የእህል አጨዳ ሠራተኞችን የሚጠቁም የተለመደና ትክክለኛ የእርሻ ቃል ነው።
- source_word: Συλλέξατε πρῶτον
  choice: አስቀድማችሁ ሰብስቡ
  rationale: የድርጊቶቹን ቅደም ተከተልና የብዙ ቁጥር ትእዛዙን ይጠብቃል።
- source_word: τὰ ζιζάνια
  choice: አረሙን
  rationale: ለዘመናዊ አንባቢ ግልጽ የሆነውን አጠቃላይ ቃል ይጠቀማል፤ ተክሉ በተለይ የስንዴ አረም (darnel) ሊሆን እንደሚችል በግርጌ ማስታወሻ ተጠብቋል።
- source_word: δήσατε αὐτὰ εἰς δέσμας
  choice: በየነዶው እሰሩት
  rationale: አረሙን ለማቃጠል በተለያዩ ነዶዎች የማሰርን ተግባር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: πρὸς τὸ κατακαῦσαι αὐτά
  choice: እንዲቃጠል
  rationale: የግሪኩን የዓላማ አገባብ ያስተላልፋል፤ ከምሳሌያዊው ምስል ባለፈ ሥነ መለኮታዊ ትርጓሜ አይጨምርም።
- source_word: τὸν δὲ σῖτον συναγάγετε εἰς τὴν ἀποθήκην μου
  choice: ስንዴውን ግን ወደ ጎተራዬ ሰብስቡ
  rationale: δὲ የሚያሳየውን ንጽጽር፣ ወደ ውስጥ የመሰብሰብን እንቅስቃሴና የባለቤትነት ቅጥያውን ይጠብቃል።
theological_decisions:
- issue: የመጨረሻው መለያየት ምሳሌያዊ ምስል
  choice: የእርሻውን ምስል በቀጥታ መጠበቅ
  alternative: ቃጠሎውን በቀጥታ ‘የመጨረሻ ፍርድ’ ወይም ‘ጥፋት’ ብሎ መተርጎም
  rationale: በዚህ ቁጥር ኢየሱስ ምሳሌውን እየተናገረ ነው፤ ትርጓሜው በምዕራፉ ቀጣይ ክፍል ስለሚሰጥ እዚህ ላይ በትርጉሙ ውስጥ አልተጨመረም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የገጠር ምስሉን ለማቆየት ‘አጫጆች፣ ነድ፣ ጎተራ’ የሚሉት የተለመዱ የእርሻ ቃላት ተመርጠዋል።
