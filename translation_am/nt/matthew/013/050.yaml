  rationale: ጥቅሱ በምሳሌው ማብራሪያ ውስጥ ከባድ የፍርድ ምስል ያቀርባል። ትርጉሙ የምስሎቹን ኃይልና ያልተፈታውን ሥነ መለኮታዊ ውጥረት ይጠብቃል።
