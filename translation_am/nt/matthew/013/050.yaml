  language: am
  text: ወደ እሳት እቶን ይጥሏቸዋል፤ በዚያም ልቅሶና ጥርስ ማፋጨት ይሆናል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαλοῦσιν
  choice: ይጥሏቸዋል
  rationale: የወደፊት ጊዜውንና በኃይል የመጣልን ትርጉም በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል፤ የተሳቢውን ተውላጠ ስምም በግሱ ውስጥ ያካትታል።
- source_word: αὐτοὺς
  choice: እነርሱን … -አቸው-
  rationale: በቀደመው አውድ የተጠቀሱትን ክፉዎች ያመለክታል፤ አማርኛው ለግልጽነት ነጻውን ተውላጠ ስምና የግስ ላይ የተሳቢ ምልክትን በተፈጥሮ ይጠቀማል።
- source_word: κάμινον τοῦ πυρός
  choice: የእሳት እቶን
  rationale: የግሪኩን የዝምድና አወቃቀር በቅርብ የሚያንጸባርቅና የፍርድን ተጨባጭ ምስል የሚጠብቅ አገላለጽ ነው።
- source_word: ἐκεῖ
  choice: በዚያም
  rationale: ቦታውን በአጽንዖት የሚያመለክተውን ተውሳከ ግስ በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἔσται
  choice: ይሆናል
  rationale: የግሪኩን የወደፊት ጊዜ ይጠብቃል፤ ከሚከተሉት ስሞች ጋርም በአማርኛ ተፈጥሯዊ ነው።
- source_word: ὁ κλαυθμὸς
  choice: ልቅሶ
  rationale: በሐዘንና በመከራ የሚደረግን ማልቀስ የሚገልጽ የተለመደና ክቡር አማርኛ ቃል ነው።
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: ጥርስ ማፋጨት
  rationale: በማቴዎስ የሚደጋገመውን ምስላዊ አገላለጽ ሳያብራራ ወይም ሳያለዝብ በተለመደ አማርኛ ይጠብቃል።
theological_decisions:
- issue: በፍጻሜ ዘመን አውድ የቀረበውን የፍርድ ምስል መተርጎም
  choice: “የእሳት እቶን” እና “ልቅሶና ጥርስ ማፋጨት” የሚሉትን ተጨባጭ ምስሎች ሳያለዝቡና ትርጓሜ ሳይጨምሩ ማቆየት
