base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/033.yaml
  text: 'He told them another parable: “The kingdom of heaven is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.”'
translation:
  language: am
  text: ሌላ ምሳሌም ነገራቸው፤ “የሰማይ መንግሥት አንዲት ሴት ወስዳ በሦስት ስፍር ዱቄት[b] ውስጥ የደበቀችውን[c] እርሾ[a] ይመስላል፤ ዱቄቱ በሙሉ እስኪቦካ ድረስ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “እርሾ” የሚለው የግሪክ ቃል ሊጥን የሚያቦካ ነገርን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: በግሪክ “ሦስት ሴአ ዱቄት”፤ ይህ እጅግ ብዙ መጠን ነው።
    reason: cultural_note
  - marker: c
    text: ወይም “የቀላቀለችውን” ወይም “ያዋሐደችውን”፤ ግሪኩ በቀጥታ “የደበቀችውን” ይላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς
  choice: ሌላ ምሳሌም ነገራቸው
  rationale: የἄλλην ተጨማሪነትን “ሌላ…ም” ያሳያል፤ ἐλάλησεν በምሳሌ ትረካ መግቢያ ውስጥ “ነገራቸው” ተፈጥሯዊ ነው።
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: የሰማይ መንግሥት
  rationale: በማቴዎስ የተለመደውን አገላለጽ በግልጽና በተከበረ ዘመናዊ አማርኛ ያቀርባል።
- source_word: ζύμῃ
  choice: እርሾ
  rationale: ζύμη ሊጥን የሚያቦካ ነገርን ያመለክታል፤ “እርሾ” በዘመናዊ አማርኛ ተፈጥሯዊና ከአላስፈላጊ ሥነ መለኮታዊ ግምገማ ነጻ ነው።
- source_word: ἐνέκρυψεν εἰς
  choice: ውስጥ … የደበቀችውን
  rationale: የግሪኩን “ደበቀች” የሚለውን ቀጥተኛ ምስል ይጠብቃል፤ “ቀላቀለች” የሚለው እንደ ትርጉም አማራጭ በማስታወሻ ቀርቧል።
- source_word: ἀλεύρου σάτα τρία
  choice: ሦስት ስፍር ዱቄት
  rationale: σάτα τρία ሦስት ሴአ የሚሆን የደረቅ ነገር መስፈሪያ ነው፤ “ስፍር” መለኪያነቱን ያቆያል፣ ባሕላዊ ዝርዝሩም በማስታወሻ ተገልጿል።
- source_word: ἕως οὗ ἐζυμώθη ὅλον
  choice: እስኪቦካ ድረስ
  rationale: የግሪኩን ተደራጊ ቅርጽና ሙሉው ዱቄት በእርሾው መቦካቱን በተፈጥሯዊ አማርኛ ያሳያል፤ “ሦስት ስፍር ዱቄት” የሚለው አንድ ሙሉ መጠን ስለሆነ ነጠላ ግስ ተጠቅሟል።
theological_decisions:
- issue: በመንግሥቱ ምሳሌ ውስጥ የζύμη አዎንታዊ ወይም አሉታዊ ፍቺ
  choice: “እርሾ” ተብሎ ያለ አዎንታዊ ወይም አሉታዊ ገለጻ በገለልተኛነት ተተርጉሟል።
  alternative: እርሾን በሌሎች ክፍሎች አጠቃቀም መሠረት አሉታዊ አድርጎ መተርጎም፣ ወይም የዕለት ተዕለት መጋገሪያ ምስሉን ብቻ ለማጉላት ቃሉን መቀየር።
  rationale: በዚህ አውድ ምስሉ በድብቅ መግባትንና ሙሉውን መቦካትን ያቀርባል፤ ትርጉሙ የምስሉን ሥነ መለኮታዊ ዋጋ አስቀድሞ መወሰን የለበትም።
- issue: ἐνέκρυψεν የሚያመለክተው ድብቅነት ወይም መቀላቀል
  choice: ቀጥተኛው “ደበቀች” በዋናው ጽሑፍ ተጠብቋል።
  alternative: “ቀላቀለች” ወይም “አዋሐደች” ብሎ የመጋገር ሂደቱን ግልጽ ማድረግ።
  rationale: ግሪኩ በቀጥታ “ደበቀች” ይላል፤ ይህን ምስል ማቆየት ሊኖር የሚችለውን የድብቅ እድገት ጭብጥ ሳይፈታ ይጠብቃል።
