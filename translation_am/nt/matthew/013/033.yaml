review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the additional parable, the kingdom comparison, the woman taking and hiding the leaven, and the three measures. However, ὅλον (“the whole/all of it”) is not explicitly represented; the bare singular verb እስኪቦካ does not reliably convey the totality in modern Amharic.
  naturalness: The relative-clause order in the comparison is grammatically possible but somewhat heavy. Moving the temporal clause after the object and explicitly naming the whole flour mass produces clearer, more natural modern Amharic.
  terminology: የሰማይ መንግሥት, እርሾ, and ሦስት ስፍር ዱቄት are suitable. The lexical note correctly retains the literal sense “hid” while offering baking-oriented alternatives. The footnote anchors are present and correspond to their notes.
  issues:
  - severity: medium
    issue: The translation does not explicitly express ὅλον.
    rationale: ἕως οὗ ἐζυμώθη ὅλον states that the whole quantity became leavened. Adding ዱቄቱ በሙሉ makes this source element clear without adding interpretation.
  - severity: low
    issue: The placement of እስኪቦካ ድረስ before የደበቀችውን እርሾ is syntactically burdensome.
    rationale: Placing the temporal result after the leaven object follows the action sequence more naturally in Amharic and avoids momentary ambiguity about what is fermented.
