  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Τότε οἱ δίκαιοι ἐκλάμψουσιν ὡς ὁ ἥλιος ἐν τῇ βασιλείᾳ τοῦ πατρὸς αὐτῶν. ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/043.yaml
  text: Then the righteous will shine like the sun in the kingdom of their Father. The one who has ears, let him hear.
translation:
  language: am
  text: በዚያን ጊዜ ጻድቃን በአባታቸው መንግሥት እንደ ፀሐይ ያበራሉ። ጆሮ ያለው ይስማ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: በዚያን ጊዜ
  rationale: የቀደመውን ማብራሪያ ተከትሎ የሚመጣውን ጊዜ በተፈጥሯዊ አማርኛ ያመለክታል።
- source_word: οἱ δίκαιοι
  choice: ጻድቃን
  rationale: በጽድቅ የተቆጠሩትን ሰዎች የሚገልጽ የተለመደና አጭር የመጽሐፍ ቅዱስ ቃል ነው።
- source_word: ἐκλάμψουσιν
  choice: ያበራሉ
  rationale: የወደፊት ጊዜውንና የመብራትን ምስል በግልጽ ያስተላልፋል፤ ‘እንደ ፀሐይ’ የሚለው ንጽጽር የብርሃኑን ብርታት ያሳያል።
- source_word: ὡς ὁ ἥλιος
  choice: እንደ ፀሐይ
  rationale: የግሪኩን ቀጥተኛ ንጽጽር በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐν τῇ βασιλείᾳ
  choice: በ…መንግሥት
  rationale: በዚህ አውድ βασιλεία የንጉሣዊ አገዛዝንም ሆነ ግዛቱን ሊያመለክት ቢችልም፣ የቦታው ሐረግ ‘መንግሥት’ በሚለው ቃል በተሻለ ሁኔታ ይቀርባል።
- source_word: τοῦ πατρὸς αὐτῶν
  choice: የአባታቸው
  rationale: የባለቤትነት ዝምድናውን በቅርብ ይጠብቃል፤ በግሪኩ የሌለውን ‘የሰማይ’ የሚል ቃል አይጨምርም።
- source_word: ὁ ἔχων ὦτα
  choice: ጆሮ ያለው
  rationale: ነጠላና ተወካይ ጥሪውን የሚጠብቅ፣ በአማርኛም የተፈጥሮ አገላለጽ ነው። የግሪኩ ብዙ ቁጥር ‘ጆሮዎች’ በአማርኛ ከተለመደው ነጠላ ‘ጆሮ’ ጋር በተፈጥሯዊ ሁኔታ ተሰጥቷል።
- source_word: ἀκουέτω
  choice: ይስማ
  rationale: የሦስተኛ መደብ ትእዛዝን በቀጥታ ይገልጻል፤ ከድምፅ መስማት በላይ ልብ ብሎ መቀበልንም በአውዱ ያስተላልፋል።
theological_decisions:
- issue: በመደምደሚያው ምክር ያለው ነጠላ ተወካይ አገላለጽ
  choice: ጆሮ ያለው ይስማ
  alternative: ጆሮ ያላችሁ ስሙ
  rationale: ግሪኩ ነጠላ ተሳቢና ነጠላ ትእዛዝ ስለሚጠቀም፣ ለሁሉም የቀረበውን ጥሪ ነጠላ ተወካይ ቅርጽ በመጠበቅ ተተርጉሟል።
- issue: በዚህ አውድ የβασιλεία ትርጉም
  choice: መንግሥት
  alternative: አገዛዝ
  rationale: ‘በአባታቸው መንግሥት’ የሚለው የቦታ አገባብ የፍጻሜውን ግዛት በተፈጥሯዊ ሁኔታ ያሳያል፤ የንጉሣዊ አገዛዝ ሐሳብንም አይሽርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለመደበኛ አንባቢ ግልጽ የሆነ አማርኛ። በዚህ አጭር ቁጥር ውስጥ ዋናው ጽሑፍ ትርጉሙን በበቂ ሁኔታ ስለሚያስተላልፍ የግድ የሆነ የግርጌ ማስታወሻ አልተጨመረም።
