  text: እህሉ በቅሎ ፍሬ ባፈራ ጊዜ ግን፣ በዚያን ጊዜ እንክርዳዱም[a] ታየ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “አረሙ”፤ ምናልባትም ዳርኔል የተባለ፣ ከስንዴ ጋር የሚመሳሰል የተለየ አረም ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: ነገር ግን … ባፈራ ጊዜ
  rationale: ὅτε የጊዜ ንዑስ ሐረግን ስለሚያስገባ ‘… ጊዜ’ ተብሏል፤ δέ ደግሞ ከቀደመው ትረካ ጋር ያለውን ቀላል ንፅፅር ‘ነገር ግን’ ይገልጣል።
- source_word: ἐβλάστησεν ὁ χόρτος
  choice: እህሉ በቅሎ
  rationale: χόρτος በዚህ የእርሻ ዐውድ ሣርን ሳይሆን የበቀለውን እህል ያመለክታል፤ ἐβλάστησεν ደግሞ መብቀልን ይገልጣል።
- source_word: καρπὸν ἐποίησεν
  choice: ፍሬ ባፈራ
  rationale: ቃል በቃል ‘ፍሬ አደረገ’ የሚለው አገላለጽ ፍሬ ማፍራትን የሚያመለክት ፈሊጥ ነው፤ ‘ፍሬ አፈራ’ ተፈጥሯዊና የእህልን ምርት የሚያካትት ነው።
- source_word: τότε ἐφάνη
  choice: ታየ
  rationale: τότε የሚያመለክተው ቅደም ተከተል በ‘… ጊዜ’ አወቃቀር ውስጥ በተፈጥሮ ተገልጧል፤ ἐφάνη ደግሞ የሚታይ መሆንን ወይም መገለጥን ያመለክታል።
- source_word: καὶ τὰ ζιζάνια
  choice: እንክርዳዱም
  rationale: ζιζάνια በእህል መካከል የሚበቅልን ጎጂ አረም ያመለክታል፤ ‘እንክርዳድ’ በአማርኛ የተለመደና ለዐውዱ ተስማሚ ነው። የ‘-ም’ ቅጥያ καί ያለውን ‘ደግሞ/እንዲሁም’ ትርጉም ያስተላልፋል።
theological_decisions:
- issue: የζιζάνια ትክክለኛ የእፅዋት ዝርያ መለየት
  choice: በዋናው ጽሑፍ ‘እንክርዳድ’ ተብሏል
  alternative: አረም፤ ዶኔል የተባለ ከስንዴ ጋር የሚመሳሰል አረም
  rationale: የግሪክ ቃሉ ጎጂ አረምን በግልጽ ቢያመለክትም የእፅዋቱን ዝርያ በፍጹም አይወስንም። ስለዚህ የተለመደው አማርኛ ቃል በዋናው ጽሑፍ ተጠቅሞ የተለየው ሊሆን የሚችለው ዝርያ በማስታወሻ ተጠብቋል።
