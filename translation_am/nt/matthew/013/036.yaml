  rationale: የትእዛዝ ቅርጹንና «ለእኛ» የሚለውን ተቀባይ በአንድ ተፈጥሯዊ የአማርኛ ግስ ያስተላልፋል።
- source_word: τὴν παραβολὴν
  choice: ምሳሌ
  rationale: በወንጌላት አውድ παραβολήን ለመግለጽ የተለመደ፣ ቀላልና ክብር ያለው አማርኛ ቃል ነው።
- source_word: τῶν ζιζανίων τοῦ ἀγροῦ
  choice: የእርሻውን እንክርዳድ
