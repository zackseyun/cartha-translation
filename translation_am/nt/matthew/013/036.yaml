base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/036.yaml
  text: Then[a], after leaving the crowds, he went into the house. And his disciples came to him, saying, “Explain to us the parable of the weeds of the field.”
translation:
  language: am
  text: ከዚያም ሕዝቡን ትቶ ወደ ቤቱ ገባ። ደቀ መዛሙርቱም ወደ እሱ ቀርበው፣ “የእርሻውን እንክርዳድ[a] ምሳሌ አብራራልን” አሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የእርሻውን የስንዴ አረም”፤ የግሪኩ ቃል በተለይ ስንዴ የሚመስል ዳርኔል የተባለ ጎጂ አረምን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
