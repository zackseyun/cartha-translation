  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ ⸀σπείραντι καλὸν σπέρμα ἐν τῷ ἀγρῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/024.yaml
  text: He set another parable before them[a], saying, “The kingdom of heaven is like a man who sowed good seed in his field.”
translation:
  language: am
  text: ሌላ ምሳሌም እንዲህ ብሎ አቀረበላቸው፦ “የሰማያት መንግሥት በእርሻው መልካም ዘር እንደዘራ ሰው ነው።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄλλην παραβολὴν
  choice: ሌላ ምሳሌ
  rationale: ἄλλην በተከታታይ ከሚቀርቡት ምሳሌዎች አንድ ተጨማሪ ምሳሌ መሆኑን ያሳያል፤ ‘ሌላ ምሳሌ’ ተፈጥሯዊና ቀጥተኛ ነው።
- source_word: παρέθηκεν αὐτοῖς
  choice: አቀረበላቸው
  rationale: παρατίθημι እዚህ ትምህርትን በፊት ማቅረብ ወይም ማስተዋወቅ ማለት ነው፤ ‘አቀረበላቸው’ በዘመናዊ አማርኛ ግልጽ ነው።
- source_word: λέγων
  choice: እንዲህ ብሎ
  rationale: የግሪኩን ተያያዥ አንቀጽ በተፈጥሯዊ የአማርኛ የቀጥታ ንግግር መግቢያ ያቀርባል።
- source_word: Ὡμοιώθη
  choice: መስሏል
  rationale: የአዎሪስት ተገብሮ ቅርጹን ‘ተመስሏል’ ብሎ ቃል በቃል ማቅረብ በአማርኛ ግትር ይሆናል፤ ‘መስሏል’ የንጽጽሩን ኃይል ጠብቆ ተፈጥሯዊ ነው።
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: የሰማያት መንግሥት
  rationale: የማቴዎስን ባሕርይ ያለውን ብዙ ቁጥር οὐρανῶν በቀጥታ ይጠብቃል፤ በአማርኛም የተለመደና የተከበረ አገላለጽ ነው።
- source_word: ἀνθρώπῳ
  choice: ሰው
  rationale: ἄνθρωπος እዚህ የምሳሌውን ግለሰብ ያመለክታል፤ ‘ሰው’ ጾታን ሳያስገድድ የግሪኩን የተለመደ ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: σπείραντι
  choice: የዘራን
  rationale: የአዎሪስት ተሳቢ አንቀጹን በአማርኛ ግልጽ የሆነ የአንጻር አንቀጽ ያደርገዋል፤ ድርጊቱም እንደተፈጸመ ይቀርባል።
- source_word: καλὸν σπέρμα
  choice: መልካም ዘር
  rationale: καλός የዘሩን ጥራትና ጥሩነት ያመለክታል፤ ‘መልካም ዘር’ ቀጣዩን ከእንክርዳድ ጋር ያለውን ንጽጽር ያዘጋጃል።
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: በእርሻው
  rationale: ἀγρός የሚዘራበትን መሬት ያመለክታል፤ የባለቤትነት ቅጥያው αὐτοῦን በ‘-ው’ ይጠብቃል።
theological_decisions:
- issue: የማቴዎስ የመንግሥት አገላለጽ
  choice: የሰማያት መንግሥት
  alternative: የሰማይ መንግሥት
  rationale: ‘ሰማያት’ የግሪኩን ብዙ ቁጥርና የማቴዎስን ልዩ አገላለጽ ይጠብቃል፤ የእግዚአብሔርን ንግሥና ከአንድ ሥፍራ ጋር ብቻ አያመሳስለውም።
- issue: የὩμοιώθη ኃይል በምሳሌው መግቢያ
  choice: መስሏል
  alternative: ተመስሏል / እንደ … ነው
  rationale: ‘መስሏል’ የግሪኩን ግሳዊ ቅርጽና የንጽጽሩን ተግባር ይጠብቃል፤ መንግሥቱ በባሕርዩ ለሰውየው ብቻ እኩል ነው የሚል ከልክ ያለፈ ትርጓሜም አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ምሳሌያዊ መግቢያ በተፈጥሯዊ የአማርኛ አገባብ ቀርቧል፤ የጽሑፍ ልዩነት ወይም ለአንባቢ አስፈላጊ የሆነ የትርጉም አማራጭ ስለሌለ የግርጌ ማስታወሻ አልተጨመረም።
