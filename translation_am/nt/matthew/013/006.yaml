lexical_decisions:
- source_word: ἡλίου δὲ ἀνατείλαντος
  choice: ፀሐይ በወጣች ጊዜ ግን
  rationale: የግሪኩ ጄኔቲቭ አብሶሉት ጊዜያዊውን ሁኔታ ያመለክታል፤ δέ ደግሞ ቀላል ንጽጽርን ወይም የትረካ ቀጣይነትን ስለሚያሳይ «ግን» ተብሏል።
- source_word: ἐκαυματίσθη
  choice: ተቃጠለ
  rationale: በፀሐይ ሙቀት መጎዳትን የሚገልጽ ተደራጊ ግስ ነው፤ «ተቃጠለ» በዘርና በተክል ምስሉ ውስጥ ተፈጥሯዊ ነው።
- source_word: διὰ τὸ μὴ ἔχειν
  choice: ስላልነበረው
  rationale: διά ከአርቲክል ካለው ኢንፊኒቲቭ ጋር ምክንያትን ይገልጻል፤ በአማርኛ ተፈጥሯዊ የምክንያት ሐረግ ሆኖ ተተርጉሟል።
- source_word: ῥίζαν
  choice: ሥር
  rationale: በግሪኩ ነጠላ ስለሆነ ነጠላው «ሥር» ተጠብቋል።
- source_word: ἐξηράνθη
  choice: ደረቀ
  rationale: በተክል አውድ ውስጥ መድረቅን ወይም መጠውለግን ያመለክታል፤ «ደረቀ» አጭር፣ ግልጽና ከግሪኩ ቅርብ ነው።
