  text: ὁ δὲ ἔφη αὐτοῖς· Ἐχθρὸς ἄνθρωπος τοῦτο ἐποίησεν. οἱ δὲ ⸂δοῦλοι αὐτῷ λέγουσιν⸃· Θέλεις οὖν ἀπελθόντες ⸀συλλέξωμεν αὐτά;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/028.yaml
  text: He said to them[a], “An enemy did this.” Then the slaves said to him, “Do you want us to go and gather them up?”
translation:
  language: am
  text: እርሱም፣ “ይህን ያደረገው ጠላት ነው” አላቸው። ባሪያዎቹም[a]፣ “እንግዲህ ሄደን እንድንሰበስባቸው ትፈልጋለህ?” አሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አገልጋዮች።” የግሪኩ δοῦλοι እንደ ዐውዱ “ባሪያዎች” ወይም “አገልጋዮች” ማለት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτοῖς
  choice: አላቸው
  rationale: የተለመደውን የትረካ ንግግር በቀጥታና በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: Ἐχθρὸς ἄνθρωπος
  choice: ጠላት
  rationale: ἄνθρωπος ባላጋራውን እንደ ግለሰብ ያመለክታል፤ በአማርኛ «ጠላት» ብቻውን ይህን ትርጉም በተፈጥሮ ይሰጣል።
- source_word: τοῦτο ἐποίησεν
  choice: ይህን ያደረገው … ነው
  rationale: የግሪኩን ጠቋሚ ቃልና ያለፈ ድርጊት ጠብቆ፣ በአማርኛ ተፈጥሯዊ የሆነ አጽንዖት ይሰጣል።
- source_word: δοῦλοι
  choice: ባሪያዎቹ
  rationale: በምሳሌው የቤትና የእርሻ ሥርዓት ውስጥ ያለውን የባለቤትነትና የበታችነት ማኅበራዊ ሁኔታ «ባሪያዎች» በግልጽ ያሳያል፤ «አገልጋዮች» የሚለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: Θέλεις
  choice: ትፈልጋለህ?
  rationale: ፈቃድን ወይም ፍላጎትን በዘመናዊና ግልጽ አማርኛ ይገልጻል።
- source_word: οὖν
  choice: እንግዲህ
  rationale: በውይይቱ ውስጥ ከቀደመው ንግግር የሚከተለውን ውጤትና ቀጣይ እርምጃ ያሳያል።
- source_word: ἀπελθόντες συλλέξωμεν
  choice: ሄደን እንድንሰበስባቸው
  rationale: የተውሳከ ግሱን ቅደም ተከተል ጠብቆ በተፈጥሯዊ የአማርኛ ግስ ሰንሰለት ያቀርባል።
- source_word: αὐτά
  choice: እነርሱን / -አቸው
  rationale: በዐውዱ ቀደም ብለው የተጠቀሱትን እንክርዳዶች የሚመለከተውን የብዙ ቁጥር ተውላጠ ስም በግሱ ላይ በተፈጥሮ ያሳያል።
theological_decisions:
- issue: በምሳሌያዊ ዐውድ ውስጥ δοῦλοιን መተርጎም
  choice: ባሪያዎቹ
  alternative: አገልጋዮቹ
  rationale: ዋናው ጽሑፍ የግሪኩን የታሰረ አገልግሎትና የበታችነት ማኅበራዊ እውነታ እንዳያደበዝዝ «ባሪያዎቹ» ይላል። ሆኖም δοῦλος እንደ ዐውዱ «አገልጋይ» ሊባል ስለሚችል አማራጩ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። «እንግዲህ» የοὖνን የውይይት ፍሰት ያሳያል፤ «ሄደን … እንድንሰበስባቸው» ደግሞ የግሪኩን የድርጊት ቅደም ተከተል በተፈጥሯዊ አማርኛ ያቀርባል።
