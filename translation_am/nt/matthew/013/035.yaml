    rationale: ‘ከፍጥረት መጀመሪያ አንስቶ’ adds ‘creation’ where the critical Greek text reads only ἀπὸ καταβολῆς. The fuller ‘of the world’ reading belongs in the textual-variant footnote, not the main text.
  - severity: low
    issue: The citation introducer is impersonal.
    rationale: ‘እንዲህም ይላል’ can be understood, but λέγοντος grammatically refers to ‘the prophet.’ ‘እንዲህ ሲል’ makes this relation clear and reads naturally in the fulfillment formula.
