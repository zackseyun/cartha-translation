  edition: SBLGNT
  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τοῦ προφήτου λέγοντος· Ἀνοίξω ἐν παραβολαῖς τὸ στόμα μου, ἐρεύξομαι κεκρυμμένα ἀπὸ ⸀καταβολῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/035.yaml
  text: 'so that what was spoken through the prophet might be fulfilled[a], saying: “I will open my mouth in parables; I will utter things hidden from the foundation of the world.”'
translation:
  language: am
  text: ይህም በነቢዩ አማካይነት የተነገረው እንዲፈጸም ሆነ፤ እንዲህ ሲል፦ “በምሳሌዎች አፌን እከፍታለሁ፤ ከመሠረት አንስቶ የተሰወሩ ነገሮችን እናገራለሁ።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች፣ “ከዓለም መሠረት አንስቶ” ይላሉ።
    reason: textual_variant
lexical_decisions:
- source_word: ὅπως πληρωθῇ
  choice: እንዲፈጸም ይህ ሆነ
  rationale: የዓላማና የውጤት ግንኙነቱን በተፈጥሯዊ አማርኛ ያሳያል፤ የማቴዎስን የትንቢት ፍጻሜ አገላለጽም ይጠብቃል።
- source_word: τὸ ῥηθὲν διὰ τοῦ προφήτου
  choice: በነቢዩ አማካይነት የተነገረው
  rationale: διά ከባለቤት አገናዛቢ ጋር የሚያሳየውን መካከለኛ ወኪልነት ይጠብቃል።
- source_word: ἐν παραβολαῖς
  choice: በምሳሌዎች
  rationale: የማቴዎስን መደበኛ የማስተማር ቃል በግልጽና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: Ἀνοίξω ... τὸ στόμα μου
  choice: አፌን እከፍታለሁ
  rationale: የጥቅሱን ግጥማዊ አገላለጽ በቀጥታ ይጠብቃል።
- source_word: ἐρεύξομαι
  choice: እናገራለሁ
  rationale: ቃሉ የሚያመለክተውን አውጥቶ መናገር በዘመናዊና ክብር ባለው አማርኛ ያስተላልፋል።
- source_word: κεκρυμμένα
  choice: ተሰውረው የነበሩትን
  rationale: የፍጹም ተገብሮ አካፋዩን የቀድሞ ድርጊትና የቀጠለ ሁኔታ ያሳያል፤ ‘ምስጢሮች’ የሚለውን ትርጓሜያዊ ማስፋት ያስወግዳል።
- source_word: ἀπὸ καταβολῆς
  choice: ከፍጥረት መጀመሪያ አንስቶ
  rationale: κόσμου በግሪኩ ባይኖርም አገላለጹ በዚህ አውድ የዓለምን መመሥረት የሚያመለክት በመሆኑ፣ ያልተሟላ አማርኛ ሳይሆን ትርጉሙን በተፈጥሯዊ ሁኔታ ያቀርባል።
theological_decisions:
- issue: የጥቅሱ ምንጭ መግለጫ
  choice: በነቢዩ አማካይነት
  alternative: በአሳፍ ነቢዩ አማካይነት
  rationale: የተሰጠው የSBLGNT ጽሑፍ ስም ሳይጨምር ‘በነቢዩ’ ብቻ ይላል፤ ስለዚህ የጥቅሱን ባለቤት በትርጉሙ ውስጥ አንጨምርም።
- issue: የἀπὸ καταβολῆς ወሰን
  choice: ከፍጥረት መጀመሪያ አንስቶ
  alternative: ከዓለም መመሥረት አንስቶ
  rationale: ዋናው ጽሑፍ κόσμου የሚለውን ቃል አልያዘም፤ ሆኖም አገላለጹን በተፈጥሯዊ አማርኛ ለማቅረብ ‘ፍጥረት መጀመሪያ’ ተመርጧል። ሙሉውን ‘የዓለም’ የሚያካትት የእጅ ጽሑፍ ንባብ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅመናል። የመዝሙራዊው ጥቅስ ግጥማዊ ቅርጽ በትይዩ ሐረጎች ተጠብቋል።
