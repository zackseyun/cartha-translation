    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “ከየዓይነቱ የሚሰበስብ”፤ በዓሣ ማጥመድ ምስሉ ውስጥ “ዓሣ” የሚለው በአውዱ የታሰበ ነው።
