id: MAT.13.8
reference: Matthew 13:8
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὴν γῆν τὴν καλὴν καὶ ἐδίδου καρπόν, ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/008.yaml
  text: But other seed fell on the good soil and was producing fruit—one a hundredfold, another sixty, and another thirty.
translation:
  language: am
  text: ሌላው ዘር ግን በጥሩው አፈር ላይ ወደቀ፤ ፍሬም ያፈራ ነበር፤ አንዱ መቶ እጥፍ፣ ሌላው ስልሳ እጥፍ፣ ሌላውም ሠላሳ እጥፍ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλα
  choice: ሌላው ዘር
  rationale: ገለልተኛ ብዙ ቁጥሩ ቅጽል በስም ምትክ የተጠቀሰ ሲሆን፣ ከቀደመው ዐውደ ንባብ የተዘራውን ዘር ያመለክታል። በአማርኛ ‘ዘር’ በነጠላ የስብስብ ትርጉም በተፈጥሮ ይሠራል።
- source_word: δὲ
  choice: ግን
  rationale: ከቀደሙት ፍሬ አልባ ውጤቶች ጋር ያለውን ንጽጽር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἔπεσεν
  choice: ወደቀ
  rationale: የግሪኩን ቀጥተኛ የመውደቅ ምስል ይጠብቃል፤ ‘ተዘራ’ በማለት የግሱን ምስል አይቀይርም።
- source_word: ἐπὶ τὴν γῆν τὴν καλὴν
  choice: በጥሩው አፈር ላይ
  rationale: በግብርናዊው ዐውድ γῆ ለተክል የሚሆንን አፈር ያመለክታል፤ καλὴν ደግሞ ለም እና ተስማሚ መሆኑን ‘ጥሩ’ በሚለው ይገልጣል።
- source_word: ἐδίδου καρπόν
  choice: ፍሬም ያፈራ ነበር
  rationale: ያልተፈጸመው የግስ አቀራረብ ቀጣይ ወይም ተደጋጋሚ ፍሬ ማፍራትን ያሳያል፤ ‘ያፈራ ነበር’ ይህን ገጽታ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: አንዱ መቶ እጥፍ፣ ሌላው ስልሳ እጥፍ፣ ሌላውም ሠላሳ እጥፍ
  rationale: የግሪኩን አከፋፋይ ‘አንዱ…ሌላው…ሌላውም’ አወቃቀር ይጠብቃል፤ ‘እጥፍ’ በየቁጥሩ መጨመሩ በአማርኛ የምርቱን ብዜት በግልጽ ያሳያል።
