  rationale: የግሪኩን ተሳቢ አንቀጽና ዋና ግስ በተፈጥሯዊ የአማርኛ የንግግር መግቢያ ያቀርባል፤ ምላሽ መስጠቱንም ሆነ ቀጥሎ መናገሩን ይጠብቃል።
