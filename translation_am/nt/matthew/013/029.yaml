source:
  edition: SBLGNT
  text: ὁ δέ ⸀φησιν· Οὔ, μήποτε συλλέγοντες τὰ ζιζάνια ἐκριζώσητε ἅμα αὐτοῖς τὸν σῖτον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/029.yaml
  text: But he said[a], ‘No, lest while gathering the weeds you uproot the wheat along with them.’
translation:
  language: am
  text: እርሱ ግን፣ “አይሆንም፤ እንክርዳዱን[a] ስትሰበስቡ ስንዴውንም ከእነርሱ ጋር እንዳትነቅሉት።” አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አረሙን።” በተለይም፣ በመጀመሪያው የዕድገት ደረጃ ስንዴን ሊመስል የሚችል “ዳርኔል” የተባለ አረም ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: φησιν
  choice: አለ
  rationale: የግሪክ ጽሑፉ ታሪካዊ የአሁን ጊዜን ቢጠቀምም፣ በአማርኛ ትረካ ቀላል ያለፈ ጊዜው ተፈጥሯዊ ነው።
- source_word: Οὔ
  choice: አይሆንም
  rationale: የቤቱን ጌታ ቀጥተኛ እምቢታ በተፈጥሯዊና በክብር ባለው ዘመናዊ አማርኛ ይገልጣል።
- source_word: μήποτε
  choice: እንዳት…
  rationale: የማይፈለግ ውጤት እንዳይከሰት የሚሰጠውን ማስጠንቀቂያ በአማርኛ ተፈጥሯዊ የክልከላ አወቃቀር ያሳያል።
- source_word: συλλέγοντες
  choice: ስትሰበስቡ
  rationale: ድርጊቱ ከመንቀሉ ጋር በአንድ ጊዜ መሆኑንና ንግግሩ ለአገልጋዮቹ መቅረቡን ያሳያል።
- source_word: ζιζάνια
  choice: እንክርዳዱን
  rationale: በስንዴ መካከል የሚበቅልን አረም የሚያመለክት በአማርኛ የታወቀ ቃል ነው፤ የዕፅዋቱ ዝርያ ግን ፍጹም እርግጠኛ ስላልሆነ ማብራሪያ በግርጌ ማስታወሻ ቀርቧል።
- source_word: ἐκριζώσητε
  choice: እንዳትነቅሉት
  rationale: ከሥሩ ነቅሎ ማውጣትን በትክክልና በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἅμα αὐτοῖς
  choice: ከእርሱ ጋር
  rationale: ስንዴው ከእንክርዳዱ ጋር አብሮ የመነቀል አደጋን ግልጽ ያደርጋል፤ ነጠላ ስብስብ ስም ከሆነው እንክርዳድ ጋር የተስማማ ተውላጠ ስም ተጠቅሟል።
- source_word: σῖτον
  choice: ስንዴውን
  rationale: በዚህ የእርሻ አውድ ቃሉ አጠቃላይ እህልን ሳይሆን ስንዴን በተለይ ያመለክታል።
theological_decisions:
- issue: በምሳሌው ውስጥ ζιζάνια የሚለውን ቃል መተርጎም
  choice: እንክርዳድ
  alternative: አረም፤ ዳርኔል የተባለ ከስንዴ ጋር የሚመሳሰል አረም
  rationale: ዋናው ጽሑፍ ለአማርኛ አንባቢ የታወቀውን የእርሻ ቃል ይጠቀማል፤ ግሪክኛው ምናልባት የተወሰነውን ዳርኔል ሊያመለክት ቢችልም ያንን እርግጠኛ በማድረግ አይገድበውም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ የአማርኛ ትረካ ተጠቅሟል። የግሪክኛው ታሪካዊ የአሁን ጊዜ በተፈጥሯዊ የአማርኛ ያለፈ ጊዜ ተተርጉሟል።
