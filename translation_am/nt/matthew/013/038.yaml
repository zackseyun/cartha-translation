  source_fidelity: 'The translation accurately represents all three explanatory clauses: ἀγρός as እርሻ, κόσμος as ዓለም, καλὸν σπέρμα as መልካሙ ዘር, ζιζάνια as እንክርዳድ, and τοῦ πονηροῦ as the personal “የክፉው.” The plural predicate with መልካሙ ዘር naturally conveys the Greek shift to the people represented by the seed; an overt equivalent of οὗτοί is not required in idiomatic Amharic.'
