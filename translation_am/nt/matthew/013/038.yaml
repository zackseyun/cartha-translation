id: MAT.13.38
reference: Matthew 13:38
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ δὲ ἀγρός ἐστιν ὁ κόσμος· τὸ δὲ καλὸν σπέρμα, οὗτοί εἰσιν οἱ υἱοὶ τῆς βασιλείας· τὰ δὲ ζιζάνιά εἰσιν οἱ υἱοὶ τοῦ πονηροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/038.yaml
  text: The field is the world[a], and the good seed—these are the sons of the kingdom. And the weeds are the sons of the evil one[c][b],
translation:
  language: am
  text: እርሻው ዓለም ነው፤ መልካሙም ዘር የመንግሥቱ ልጆች ናቸው። እንክርዳዱም[a] የክፉው ልጆች ናቸው።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “እንክርዳድ” በተለይ ከስንዴ ጋር የሚመሳሰለውን ጎጂ አረም (darnel) ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “ልጆች” የሚለው የዝምድና አገላለጽ ሲሆን፣ የመንግሥቱ ወይም የክፉው ወገን የሆኑትን ያመለክታል።
    reason: cultural_note
lexical_decisions:
- source_word: ἀγρός
  choice: እርሻ
  rationale: በግብርናዊው ምሳሌ ውስጥ የሚዘራበትን መስክ በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: κόσμος
  choice: ዓለም
  rationale: ዘሩ የተዘራበትን ሰፊ የዓለም ዙሪያ በቀጥታ ያስተላልፋል።
- source_word: καλὸν σπέρμα
  choice: መልካሙ ዘር
  rationale: የግብርናውን ምስልና ከእንክርዳዱ ጋር ያለውን ንጽጽር ይጠብቃል።
- source_word: υἱοὶ τῆς βασιλείας
  choice: የመንግሥቱ ልጆች
  rationale: ‘ልጆች’ በአማርኛ የአባልነትንና የባለቤትነትን ዝምድና በተፈጥሯዊ ሁኔታ ያሳያል፤ በዚህ የወንድ ብቻ ቡድን እንደሆነ የሚያስገድድ ዐውድ የለም።
- source_word: ζιζάνια
  choice: እንክርዳድ
  rationale: በሰብል መካከል የሚበቅለውን ጎጂ አረም የሚገልጥ የታወቀ አማርኛ ቃል ነው፤ የተወሰነውን የdarnel ዓይነት ሙሉ በሙሉ ላያመለክት ስለሚችል ማስታወሻ ተጨምሯል።
- source_word: τοῦ πονηροῦ
  choice: የክፉው
  rationale: የግሪኩን በመስተዋድድ የተወሰነ ግላዊ አመልካች ይጠብቃል፤ ከረቂቅ ‘ክፋት’ ይልቅ ‘ክፉው’ የሚለውን ግለሰባዊ ንባብ ያስተላልፋል።
theological_decisions:
- issue: τοῦ πονηροῦ ግላዊ አመልካች ነው ወይስ ረቂቅ ክፋት?
  choice: የክፉው
  alternative: የክፋት
  rationale: መስተዋድዱና የወንድ ነጠላ ቅርጹ በዚህ ዐውድ ግላዊ አመልካችን በጠንካራ ሁኔታ ይደግፋሉ፤ ነገር ግን ጽሑፉ በዚህ ቁጥር ስሙን በቀጥታ ስለማይጠራ ‘ዲያብሎስ’ ተብሎ አልተጨመረም።
- issue: υἱοὶ በአማርኛ ‘ወንዶች ልጆች’ ወይስ ተወካይ የዝምድና አገላለጽ?
  choice: ልጆች
  alternative: ወንዶች ልጆች
  rationale: በአማርኛ ‘ልጆች’ የግሪኩን የዝምድናና የአባልነት ፍቺ በተፈጥሯዊ ሁኔታ ይይዛል፤ ‘ወንዶች ልጆች’ ማለት ዐውዱ የማያስገድደውን የጾታ ገደብ ሊያስገባ ይችላል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ሦስት ተመሳሳይ የማብራሪያ ክፍሎች δὲ በ‘፤’፣ ‘ም’ እና በአጭር ዓረፍተ ነገሮች ተንጸባርቀዋል።
