id: MAT.13.13
reference: Matthew 13:13
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἐν παραβολαῖς αὐτοῖς λαλῶ, ὅτι βλέποντες οὐ βλέπουσιν καὶ ἀκούοντες οὐκ ἀκούουσιν οὐδὲ συνίουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/013.yaml
  text: For this reason I speak to them in parables[a], because seeing they do not see, and hearing they do not hear, nor do they understand.
translation:
  language: am
  text: ስለዚህ በምሳሌዎች እነግራቸዋለሁ፤ ምክንያቱም እያዩ አያዩም፣ እየሰሙም አይሰሙም፣ ደግሞም አያስተውሉም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ስለዚህ
  rationale: የኢየሱስን የንግግር ምክንያት በተፈጥሯዊና አጭር ዘመናዊ አማርኛ ያሳያል።
- source_word: ἐν παραβολαῖς
  choice: በምሳሌዎች
  rationale: ἐν ከዳቲቭ ጋር እዚህ የንግግርን መንገድ ያመለክታል፤ «በምሳሌዎች» የተለመደና ቀጥተኛ ነው።
- source_word: αὐτοῖς λαλῶ
  choice: እነግራቸዋለሁ
  rationale: የመናገርን ተግባርና የተቀባዮቹን ዳቲቭ በተፈጥሯዊ አንድ የአማርኛ ግስ ያቀርባል።
- source_word: ὅτι
  choice: ምክንያቱም
  rationale: አረፍተ ነገሩ የቀደመውን ንግግር ምክንያት እንደሚገልጥ በግልጽ ያሳያል።
- source_word: βλέποντες οὐ βλέπουσιν
  choice: እያዩ አያዩም
  rationale: የግሪኩን ተሳቢ ግስና ዋና ግስ ትይዩ አወቃቀር እና አያዎአዊ ድምፅ ተጨማሪ ትርጓሜ ሳይጫን ይጠብቃል።
- source_word: ἀκούοντες οὐκ ἀκούουσιν
  choice: እየሰሙም አይሰሙም
  rationale: ከማየት ሐረግ ጋር ያለውን ሥነ ንግግራዊ ትይዩነት ይጠብቃል።
- source_word: οὐδὲ συνίουσιν
  choice: ደግሞም አያስተውሉም
  rationale: οὐδὲ የክልከላውን ተከታታይነት ያሳያል፤ συνίημι ደግሞ የሚታየውንና የሚሰማውን ፍቺ በውስጥ መገንዘብን ያመለክታል።
theological_decisions:
- issue: የβλέποντες እና ἀκούοντες ተሳቢ ግሶች ኃይል
  choice: «እያዩ» እና «እየሰሙ» ተብለው ቅርብና አሻሚነቱን በሚጠብቅ መልኩ ተተርጉመዋል
  alternative: «ቢያዩም» እና «ቢሰሙም» በማለት የተቃርኖ ኃይሉን ግልጽ ማድረግ
  rationale: ዐውደ ንባቡ ተቃርኖን ቢያመለክትም የግሪኩ ቅርጽ ያንን በልዩ አገናኝ አይገልጽም። ስለዚህ ውጫዊ ማየትና መስማት ከውስጣዊ ግንዛቤ ጋር ያለው ውጥረት ሳይፈታ ተጠብቋል።
- issue: የσυνίουσιν ትርጉም
  choice: አያስተውሉም
  alternative: አይረዱም
  rationale: «ማስተዋል» ከተራ መረዳት በተጨማሪ የተሰማውንና የታየውን ፍቺ መገንዘብ የሚለውን የσυνίημι ስፋት በዚህ ዐውድ በተፈጥሯዊ መንገድ ያቀርባል፤ የጥፋተኝነት ወይም የአለመቻል ልዩ ዶክትሪናዊ ፍርድ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለሰፊ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የግሪኩ ትይዩና አያዎአዊ አወቃቀር «እያዩ አያዩም፣ እየሰሙም አይሰሙም» ተብሎ ተጠብቋል። ማስታወሻ ስላልተጨመረ በዋናው ጽሑፍ የግርጌ ማስታወሻ ምልክት የለም።
