id: MAT.13.4
reference: Matthew 13:4
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἐν τῷ σπείρειν αὐτὸν ἃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ ⸂ἐλθόντα τὰ πετεινὰ⸃ κατέφαγεν αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/004.yaml
  text: And as he was sowing[a], some seeds fell beside the path, and the birds came and devoured them.
translation:
  language: am
  text: እርሱም ሲዘራ፣ ከዘሩ አንዳንዱ[a] በመንገድ ዳር ወደቀ፤ ወፎችም መጥተው በሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ግሪኩ ቃል በቃል፣ «አንዳንድ ነገሮች በመንገድ ዳር ወደቁ» ይላል፤ «ዘር» የሚለው ከዘሪው ዐውድ የተገነዘበ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ σπείρειν αὐτὸν
  choice: እርሱም ሲዘራ
  rationale: ἐν ከተሰኘው የጊዜ አመልካች አገባብና ከመስደሪያዊው ግስ ጋር በአንድነት ድርጊቶቹ በአንድ ጊዜ መከናወናቸውን ያሳያል፤ «ሲዘራ» ይህን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἃ μὲν
  choice: ከዘሩ አንዳንዱ
  rationale: የግሪኩ አነጋገር ቃል በቃል «አንዳንድ ነገሮች» የሚል ቢሆንም፣ በዐውዱ የሚያመለክተው የሚዘራውን ዘር ነው። አማርኛ «ዘርን» ብዙ ጊዜ በነጠላ የስብስብ ስም ስለሚጠቀም፣ «ከዘሩ አንዳንዱ» ተፈጥሯዊና ግልጽ ነው።
- source_word: ἔπεσεν
  choice: ወደቀ
  rationale: የትረካውን የተፈጸመ ድርጊት በቀላል ያለፈ ጊዜ ይገልጣል።
- source_word: παρὰ τὴν ὁδόν
  choice: በመንገድ ዳር
  rationale: παρά ከተሳቢ ጋር በዚህ ስፍራ ከመንገዱ ጎን ያለውን ቦታ ያመለክታል፤ «በመንገድ ዳር» ይህን በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐλθόντα τὰ πετεινὰ
  choice: ወፎችም መጥተው
  rationale: የግሪኩ አንቀጽ ወፎቹ መጥተው ቀጣዩን ድርጊት እንዳደረጉ ያሳያል። πετεινά እዚህ «ወፎች» ተብሎ በቂ ሁኔታ ይተረጎማል፤ በዚህ ቁጥር የሌለው «የሰማይ» የሚል ቃል አልተጨመረም።
- source_word: κατέφαγεν
  choice: በሉት
  rationale: ግሱ ሙሉ በሙሉ መብላትን ያመለክታል። በአማርኛ «በሉት» በዐውዱ ዘሩን እንዳስወገዱት በተፈጥሯዊና ኃይል ባለው አነጋገር ያሳያል።
- source_word: αὐτά
  choice: -ት (በሉት)
  rationale: የተያያዘው ተውላጠ ስም የወደቀውን ዘር ያመለክታል፤ በአማርኛ በግሱ ላይ የተያያዘው «-ት» ይህን በተፈጥሯዊ ሁኔታ ይወክላል።
