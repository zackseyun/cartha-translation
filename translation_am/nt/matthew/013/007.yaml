id: MAT.13.7
reference: Matthew 13:7
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὰς ἀκάνθας, καὶ ἀνέβησαν αἱ ἄκανθαι καὶ ⸀ἔπνιξαν αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/007.yaml
  text: Other seeds fell among the thorns[a], and the thorns came up and choked them.
translation:
  language: am
  text: ሌሎች ዘሮችም በእሾህ መካከል[a] ወደቁ፤ እሾሆቹም አድገው አነቋቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ግሪኩ ቃል በቃል «በእሾሆቹ ላይ» ይላል፤ በዚህ የእርሻ አውድ ግን ተፈጥሯዊ አማርኛ እንዲሆን «በእሾህ መካከል» ተብሎ ተተርጉሟል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: ሌሎች ዘሮች
  rationale: ገለልተኛ ብዙ ቁጥር ቅጹ በአውዱ በስውር ወደ ዘሮቹ ያመለክታል፤ በአማርኛ ማጣቀሻውን ግልጽና ተፈጥሯዊ ለማድረግ «ዘሮች» ተጨምሯል።
- source_word: δὲ
  choice: -ም
  rationale: እዚህ δέ ከባድ ተቃርኖ ሳይሆን የትረካውን ቅደም ተከተል የሚያስቀጥል ለስላሳ አያያዥ ነው፤ የአማርኛው «-ም» ይህን በተፈጥሮ ያሳያል።
- source_word: ἔπεσεν
  choice: ወደቁ
  rationale: πίπτω በቀጥታ «መውደቅ» ማለት ነው፤ ከአውዱ ተነሥቶ «ተዘሩ» ብሎ ከመተርጎም ይልቅ የምንጩ ግስ ተጠብቋል።
- source_word: ἐπὶ τὰς ἀκάνθας
  choice: በእሾህ መካከል
  rationale: ἐπί ከተሳቢ ጋር በቃል በቃል «በእሾሹ ላይ» ሊባል ቢችልም፣ በእርሻው አውድ ዘሮቹ እሾህ ባለበት መሬት ውስጥ መውደቃቸውን «በእሾህ መካከል» በተፈጥሮ ያስተላልፋል።
- source_word: ἀκάνθας / ἄκανθαι
  choice: እሾህ / እሾሹ
  rationale: ἄκανθα እሾህን ወይም እሾሃማ ተክልን ያመለክታል፤ «እሾህ» በዚህ ምሳሌ ውስጥ የተለመደና ተፈጥሯዊ ምርጫ ነው።
- source_word: ἀνέβησαν
  choice: አድጎ
  rationale: ግሱ ወደ ላይ መውጣትን፣ ስለ ተክልም ማደግን ያመለክታል፤ «አድጎ» በዘመናዊ አማርኛ የተክሉን መውጣት በተፈጥሮ ያሳያል።
- source_word: ἔπνιξαν
  choice: አነቃቸው
  rationale: πνίγω «ማነቅ/መታፈን ማድረግ» ማለት ሲሆን፣ «አነቃቸው» የግሪኩን ግልጽ የማነቅ ምስል ይጠብቃል።
- source_word: αὐτά
  choice: -አቸው
  rationale: ገለልተኛ ብዙ ቁጥር ተውላጠ ስም በስውር ወደ ዘሮቹ/የበቀሉት ተክሎች ያመለክታል፤ የአማርኛው ብዙ ቁጥር ተሳቢ ቅጥያ «-አቸው» ይህን ያስተላልፋል።
