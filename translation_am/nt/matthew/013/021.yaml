    text: ወይም፣ «ከእምነት ይወድቃል» ወይም «ቅር ይሰኛል»፤ የግሪኩ ግስ ሰው እንዲሰናከል መደረጉን ወይም ቅር መሰኘቱን ሊያመለክት ይችላል።
