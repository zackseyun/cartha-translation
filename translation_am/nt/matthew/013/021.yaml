  language: am
  text: ነገር ግን በራሱ ውስጥ ሥር የለውም፤ ለጥቂት ጊዜ ብቻ ይቆያል። በቃሉ ምክንያት መከራ ወይም ስደት ሲመጣ፣ ወዲያው ይሰናከላል።[a]
  philosophy: optimal-equivalence
