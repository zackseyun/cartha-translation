  yaml_path: translation/nt/matthew/013/009.yaml
  text: The one who has ears[a], let him hear.
translation:
  language: am
  text: ጆሮ ያለው ይስማ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων
  choice: ያለው
  rationale: በግሪክኛው መስተዋድድ ከአሁን ጊዜ አሳታፊ ግስ ጋር በስም ተግባር ላይ ውሎ ማንኛውንም ሰው በነጠላ ቁጥር ይጠቁማል። «ያለው» ይህን አጠቃላይና ነጠላ አገላለጽ በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: ὦτα
  choice: ጆሮ
  rationale: የግሪክኛው ቃል በብዙ ቁጥር «ጆሮዎች» ቢሆንም፣ በአማርኛ የተለመደውና ተፈጥሯዊው ፈሊጣዊ አገላለጽ «ጆሮ ያለው» ነው፤ ብዙ ቁጥሩን በግድ ማንጸባረቅ «ጆሮዎች ያሉት» የሚል ከባድ አነጋገር ይፈጥራል።
- source_word: ἀκουέτω
  choice: ይስማ
  rationale: የሦስተኛ መደብ ነጠላ ትእዛዛዊ ኃይሉን «ይስማ» በቀጥታ ያስተላልፋል። ቃሉ ተራ ድምፅ ከመስማት ባለፈ በትኩረት ተቀብሎ የመረዳት ጥሪንም በዐውዱ ይይዛል።
theological_decisions:
- issue: በነጠላ ቁጥር የቀረበው አጠቃላይ የሰው ማመልከቻ
  choice: ጆሮ ያለው ይስማ።
  alternative: ጆሮ ያላችሁ ስሙ።
  rationale: የግሪክኛው አገላለጽ ሰውን በአጠቃላይ ቢያመለክትም በሰዋስው ነጠላ ነው። የአማርኛው «ያለው … ይስማ» ጾታን ሳያጎላ ይህን ነጠላና አጠቃላይ ኃይል ይጠብቃል፤ ወደ ብዙ ቁጥር መቀየር የምንጩን ቅርጽ ሳያስፈልግ ይለውጣል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና በቀላሉ የሚገባ መደበኛ አማርኛ። አጭሩ አገላለጽ የግሪክኛውን ቀጥተኛ የጥሪ ኃይል ይጠብቃል። በዋናው ጽሑፍ የግርጌ ማስታወሻ ስለሌለ ምልክት አልተጨመረም።
