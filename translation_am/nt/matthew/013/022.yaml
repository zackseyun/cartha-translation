id: MAT.13.22
reference: Matthew 13:22
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων, καὶ ἡ μέριμνα τοῦ αἰῶνος ⸀τούτου καὶ ἡ ἀπάτη τοῦ πλούτου συμπνίγει τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/022.yaml
  text: And the one sown among the thorns—this is the one who hears the word[a], but the चिंता of this age and the deceitfulness of wealth choke the word[b], and he becomes unfruitful.
translation:
  language: am
  text: በእሾህ መካከል የተዘራው ደግሞ ቃሉን የሚሰማው ሰው ነው፤ ነገር ግን የዚህ ዘመን ጭንቀት[a]ና የሀብት አታላይነት[b] ቃሉን ያንቁታል፤ እርሱም ፍሬ አልባ ይሆናል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የዚህ ዓለም ጭንቀት።” ግሪኩ ቃል በቃል “የዚህ ዘመን ጭንቀት” ይላል።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ “የሀብት ማታለል።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς
  choice: በእሾህ መካከል የተዘራው ደግሞ
  rationale: የግሪኩን ተገብሮ አንቀጽና ወንድ ነጠላ የግል ማጣቀሻ ይጠብቃል፤ ‘በእሾህ መካከል’ በአማርኛ ተፈጥሯዊ ሲሆን የምሳሌውን ምስል ያስቀጥላል።
- source_word: ὁ τὸν λόγον ἀκούων
  choice: ቃሉን የሚሰማው ሰው
  rationale: የአሁን ጊዜውን አሳታፊ በተፈጥሯዊ የአማርኛ አንጻራዊ ሐረግ ይገልጻል፤ λόγος በዚህ አውድ ‘ቃል’ ተብሎ ተጠብቋል።
- source_word: ἡ μέριμνα τοῦ αἰῶνος τούτου
  choice: የዚህ ዘመን ጭንቀት
  rationale: μέριμνα ያለውን አስጨናቂ እንክብካቤ በ‘ጭንቀት’ ይገልጻል፤ αἰώνን ‘ዘመን’ ማለት ጊዜያዊውንና ሥነ ምግባራዊውን ንጽጽር ከ‘ዓለም’ ይልቅ በቅርብ ያስተላልፋል።
- source_word: ἡ ἀπάτη τοῦ πλούτου
  choice: የሀብት አታላይነት
  rationale: የገንዘብ ብዛት ብቻ ሳይሆን ሀብት ያለውን አታላይ ባሕርይ ያሳያል።
- source_word: συμπνίγει
  choice: ቃሉን ያንቁታል
  rationale: የእሾህ ተክልን አፍኖ ፍሬ እንዳያፈራ የማድረጉን ግብር በግልጽና ሕያው ምስል ያቆያል፤ በአማርኛ ሁለቱን የተጣመሩ ባለቤቶች ተከትሎ ብዙ ቁጥር ግስ ተጠቅሟል።
- source_word: ἄκαρπος γίνεται
  choice: እርሱም ፍሬ አልባ ይሆናል
  rationale: ማብራሪያው ወደ ቃሉን የሚሰማው ሰው ስለሚያመለክት የግል ማጣቀሻውን ያቆያል፤ ቃሉ ራሱ ፍሬ አልባ እንደሚሆን የሚያስመስል ንባብን ያስወግዳል።
theological_decisions:
- issue: የαἰών ትርጉም
  choice: ይህ ዘመን
  alternative: ይህ ዓለም
  rationale: αἰών በቀጥታ ዘመንን ወይም የጊዜ ሥርዓትን ያመለክታል፤ ‘ዘመን’ የአካላዊውን ዓለም ሐሳብ ሳያስገባ የምንጩን ጊዜያዊ አጽንዖት ይጠብቃል።
- issue: በመጨረሻው ሐረግ የሚጠቀሰው ሰው ወይስ ቃሉ መሆኑ
  choice: እርሱም ፍሬ አልባ ይሆናል
  alternative: ቃሉም ፍሬ አልባ ይሆናል
  rationale: ግሪኩ በወንድ ነጠላ ቅርጽ ቃሉን ወደሚሰማው ሰው ይመለሳል፤ ይህም ከተዘራው ምስል ወደ ሰሚው ሰው የሚደረገውን የምሳሌ ማብራሪያ ያቆያል።
