  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግብርናው ምስል ‘ተዘራ’፣ ‘እሾህ’፣ ‘ያንቁታል’ እና ‘ፍሬ አልባ’ በሚሉ ቃላት ተጠብቋል።
