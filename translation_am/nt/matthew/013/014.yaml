id: MAT.13.14
reference: Matthew 13:14
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἀναπληροῦται αὐτοῖς ἡ προφητεία Ἠσαΐου ἡ λέγουσα· Ἀκοῇ ἀκούσετε καὶ οὐ μὴ συνῆτε, καὶ βλέποντες βλέψετε καὶ οὐ μὴ ἴδητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/014.yaml
  text: 'And in them the prophecy of Isaiah is fulfilled[a], which says: ‘You will indeed hear, but never understand, and seeing you will see, but never perceive.’'
translation:
  language: am
  text: 'በእነርሱም የኢሳይያስ ትንቢት ይፈጸማል፤ እንዲህ ይላል፦


    “በእርግጥ ትሰማላችሁ፣ ከቶ ግን አታስተውሉም፤


    እያያችሁ ታያላችሁ፣ ከቶ ግን አትገነዘቡም።”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “በመስማት ትሰማላችሁ … በማየትም ታያላችሁ።” ይህ በግሪክ ጥቅሱ የተጠበቀ የዕብራይስጥ ዓይነት አጽንዖታዊ አገላለጽ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναπληροῦται
  choice: ይፈጸማል
  rationale: የአሁን ጊዜውን ተገብሮአዊ የፍጻሜ ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ‘ሙሉ በሙሉ ይፈጸማል’ በማለት ትርጉሙን አያጠብቅም።
- source_word: αὐτοῖς
  choice: በእነርሱ
  rationale: ትንቢቱ በተጠቀሱት ሰዎች ሁኔታ እውን መሆኑን የሚያሳይ ተፈጥሯዊ አገላለጽ ነው።
- source_word: προφητεία Ἠσαΐου
  choice: የኢሳይያስ ትንቢት
  rationale: የግሪኩን የባለቤትነት ግንኙነት በግልጽና በተለመደ አማርኛ ያቀርባል።
- source_word: ἡ λέγουσα
  choice: እንዲህ ይላል
  rationale: ጥቅሱን በተፈጥሯዊ ሁኔታ ያስተዋውቃል፤ የአንቀጹንም ተግባር ይጠብቃል።
- source_word: Ἀκοῇ ἀκούσετε
  choice: በእርግጥ ትሰማላችሁ
  rationale: በግሪክ የተንጸባረቀውን ሴማዊ አጽንዖት በዘመናዊና ግልጽ አማርኛ ያስተላልፋል፤ ቃል በቃል አወቃቀሩ በማስታወሻው ቀርቧል።
- source_word: οὐ μὴ συνῆτε
  choice: ከቶ ግን አታስተውሉም
  rationale: የοὐ μήን ጠንካራ ክህደት ‘ከቶ’ ይገልጣል፤ συνίημι ደግሞ እዚህ የመረዳትና የማስተዋል ሐሳብ አለው።
- source_word: βλέποντες βλέψετε
  choice: ታያላችሁም
  rationale: ተደጋጋሚው ሴማዊ አጽንዖት በተፈጥሯዊ አማርኛ ቀርቧል፤ ቃል በቃል ቅርጹ በማስታወሻው ተገልጧል።
- source_word: οὐ μὴ ἴδητε
  choice: ከቶ ግን አትገነዘቡም
  rationale: ከቀደመው βλέπω የዓይን ማየት በተለየ ሁኔታ፣ በውስጥ አስተውሎ የመገንዘብን ሐሳብ ያሳያል፤ ‘ከቶ’ ጠንካራውን ክህደት ይጠብቃል።
theological_decisions:
- issue: የትንቢቱ ፍጻሜ ባሕርይ
  choice: ትንቢቱ በእነዚህ ሰዎች ይፈጸማል
  alternative: ትንቢቱ በእነርሱ ምሳሌ ብቻ ይታያል፣ ወይም ፍጻሜው ሙሉ በሙሉ ተጠናቋል
  rationale: ጽሑፉ ራሱ ከሚናገረው በላይ የልብ ድንዛዜን፣ የቀደመ ውሳኔን ወይም የትንቢታዊ ምሳሌነትን ሥርዓት አይወስንም፤ ስለዚህ ያለውን ሥነ መለኮታዊ ውጥረት እንዳለ ይተዋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የጥቅሱ ትይዩ አወቃቀር በሁለቱ መስመሮች ተጠብቋል፤ ቃል በቃል ሲተረጎም የሚከብደው ሴማዊ አጽንዖት በዋናው ጽሑፍ በተፈጥሯዊ አማርኛ፣ በማስታወሻው ደግሞ በቅርብ ቃል በቃል ቅርጽ ቀርቧል።
