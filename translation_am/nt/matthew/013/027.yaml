base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/027.yaml
  text: So the slaves of the master of the house came to him and said[a], ‘Lord, did you not sow good seed in your field? Where then do the weeds come from?’
translation:
  language: am
  text: የቤቱ ጌታ ባሪያዎችም ወደ እርሱ ቀርበው፣ “ጌታ ሆይ፣ በእርሻህ መልካም ዘር የዘራኸው አንተ አይደለህምን? ታዲያ እንክርዳዶቹ[a] ከየት መጡ?” አሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “አረሞቹ”፤ የግሪኩ ቃል በለጋነቱ ስንዴን የሚመስል ዳርኔል የተባለ ጎጂ አረምን ምናልባት ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: ወደ እርሱ ቀርበው
  rationale: የመቅረብን እንቅስቃሴ ይጠብቃል፤ የግሪኩንም ቀዳሚ ተግባር በተፈጥሯዊ የአማርኛ አገባብ ከዋናው ግስ ጋር ያያይዛል።
- source_word: δοῦλοι
  choice: ባሪያዎች
  rationale: ቃሉ ከቤቱ ጌታ ሥልጣን ሥር ያሉ በባርነት የተያዙ ሰዎችን ያመለክታል፤ ‘አገልጋዮች’ ይህን ማኅበራዊ ሁኔታ ሊያለዝብ ይችላል።
- source_word: οἰκοδεσπότου
  choice: የቤቱ ጌታ
  rationale: የοἶκος እና δεσπότηςን የተዋሃደ ትርጉም በግልጽና በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: በዚህ የምሳሌ ውይይት ውስጥ ለቤቱ ጌታ የቀረበ የአክብሮት ጥሪ ሲሆን κύριοςን በቀጥታ ይወክላል።
- source_word: οὐχὶ
  choice: አይደለህምን?
  rationale: አዎንታዊ መልስ የሚጠብቀውን የግሪክ ጥያቄ ኃይል ይጠብቃል።
- source_word: καλὸν σπέρμα
  choice: መልካም ዘር
  rationale: ቀጥተኛ፣ ግልጽና በግብርና አውድ ተፈጥሯዊ ነው።
- source_word: ἔσπειρας
  choice: የዘራኸው
  rationale: σπείρω የሚያመለክተውን ዘር የመዝራት ትክክለኛ የግብርና ተግባር ያስተላልፋል።
- source_word: ἐν τῷ σῷ ἀγρῷ
  choice: በእርሻህ
  rationale: የቦታንና የባለቤትነትን ሐሳብ በአጭርና በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: πόθεν οὖν
  choice: ታዲያ … ከየት
  rationale: πόθεν የምንጭ ጥያቄን፣ οὖν ደግሞ ከቀደመው ንግግር የሚነሳውን ድምዳሜያዊ ግንኙነት ይጠብቃሉ።
- source_word: ἔχει ζιζάνια
  choice: እንክርዳዱ … መጣ
  rationale: የአማርኛ ተፈጥሯዊ አገላለጽን በመከተል እንክርዳዱ ከየት እንደተገኘ ይጠይቃል፤ የዝርያው ልዩ መለያ በማስታወሻ ተጠብቋል።
- source_word: ζιζάνια
  choice: እንክርዳዱ
  rationale: ለእህል ጎጂ የሆነን አረም በተለመደ የአማርኛ ቃል ያቀርባል፤ ግሪኩ በተለይ በለጋነቱ ስንዴን የሚመስል darnel ሊያመለክት ስለሚችል ይህ በእግር ማስታወሻ ተገልጧል።
theological_decisions:
- issue: በምሳሌያዊው የቤት አውድ δοῦλοιን መተርጎም
  choice: ባሪያዎች
  alternative: አገልጋዮች
  rationale: ጥቅሱ ስለ ባርነት የዶክትሪን አቋም አያቀርብም፤ ሆኖም δοῦλοι የሚያመለክተውን በጌታ ሥር ያለ የባርነት ሁኔታ ሳያለዝብ ‘ባሪያዎች’ ያስተላልፋል።
- issue: κύριε በምሳሌው ውስጥ ያለው የአድራሻ ኃይል
  choice: ጌታ ሆይ
  alternative: ጌታዬ / ክቡርነትዎ
  rationale: እዚህ ቃሉ በቀጥታ ክርስቶሎጂያዊ መግለጫ ሳይሆን ለቤቱ ጌታ የቀረበ የአክብሮት ጥሪ ነው፤ ‘ጌታ ሆይ’ የቃሉን መደበኛ ትርጉምና የአድራሻ ቅርጽ ይጠብቃል።
