source:
  edition: SBLGNT
  text: ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου, καὶ τοῖς ὠσὶν βαρέως ἤκουσαν, καὶ τοὺς ὀφθαλμοὺς αὐτῶν ἐκάμμυσαν· μήποτε ἴδωσιν τοῖς ὀφθαλμοῖς καὶ τοῖς ὠσὶν ἀκούσωσιν καὶ τῇ καρδίᾳ συνῶσιν καὶ ἐπιστρέψωσιν, καὶ ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/015.yaml
  text: For this people's heart has grown dull[a], and with their ears they hear heavily, and they have closed their eyes, lest they should see with their eyes and hear with their ears and understand with their heart and turn back[c][b], and I will heal them.
translation:
  language: am
  text: የዚህ ሕዝብ ልብ ደንዝዟልና፤ በጆሮአቸውም ለመስማት ተሳንቷቸዋል[a]፤ ዓይኖቻቸውንም ጨፍነዋል፤ ይህም በዓይኖቻቸው እንዳያዩ፣ በጆሮአቸውም እንዳይሰሙ፣ በልባቸውም እንዳያስተውሉ፣ ተመልሰውም[b][c] እንድፈውሳቸው እንዳይሆን ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በጆሮአቸው በችግር ሰምተዋል።” ቃል በቃል፣ “በከባድ ሰሙ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ዞረው” ወይም “ወደ እኔ ተመልሰው።”
    reason: lexical_alternative
  - marker: c
    text: ከኢሳይያስ 6፥9–10 የተጠቀሰ።
    reason: cross_reference
lexical_decisions:
- source_word: ἐπαχύνθη
  choice: ደንዝዟል
  rationale: ቃሉ በቀጥታ ‘ወፈረ/ወፈረበት’ የሚል ቢሆንም፣ ከ‘ልብ’ ጋር በዚህ አገባብ የማስተዋል ድንዛዜንና ስሜት አልባነትን ያመለክታል።
- source_word: καρδία
  choice: ልብ
  rationale: በዚህ ጥቅስ በተለይ ከማስተዋል ጋር የተያያዘውን ውስጣዊ ሰውነት የሚያመለክት መደበኛ አተረጓጎም ነው።
- source_word: λαοῦ τούτου
  choice: የዚህ ሕዝብ
  rationale: የግሪኩን አመልካች አጽንዖትና የባለቤትነት ግንኙነት በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: βαρέως ἤκουσαν
  choice: በከባድ ሰምተዋል
  rationale: የግሪኩን ‘በከባድ ሰሙ’ የሚለውን ምስላዊ አነጋገርና ያለፈ ጊዜ ቅርጽ በቅርብ ይጠብቃል፤ ትርጉሙ በችግር ወይም ያለፈቃድ መስማትን ሊያካትት ይችላል።
- source_word: ἐκάμμυσαν
  choice: ጨፍነዋል
  rationale: ሕዝቡ ራሱ ዓይኖቹን የዘጋ መሆኑን የሚያሳየውን ንቁ ድርጊት ይጠብቃል።
- source_word: μήποτε
  choice: እንዳይ… እንዳል…
  rationale: አሉታዊ ዓላማ/ውጤትን የሚያመለክተውን የግሪኩን ኃይል ይጠብቃል፤ የፍርድና የሰው ኃላፊነት ውጥረትን አያለዝብም።
- source_word: συνῶσιν
  choice: እንዳያስተውሉ
  rationale: በውስጣዊ ግንዛቤ መረዳትን የሚያሳይ ተፈጥሯዊ ዘመናዊ አማርኛ ነው።
- source_word: ἐπιστρέψωσιν
  choice: ተመልሰው
  rationale: የመዞር/የመመለስን አቅጣጫዊ ኃይል ይጠብቃል፤ ‘ንስሐ ገብተው’ የሚል የበለጠ ትርጓሜያዊ ቃል አያስገባም።
- source_word: ἰάσομαι
  choice: እኔ እንዳልፈውሳቸው
  rationale: የመፈወስ ትርጉሙንና የመጀመሪያ ሰው ተናጋሪውን ይጠብቃል፤ በአማርኛው አሉታዊ የዓላማ/ውጤት ሐረግ ውስጥ በተፈጥሯዊ መንገድ ተዋህዷል።
theological_decisions:
- issue: የፍርድ ዓላማ/ውጤት እና የሰው ኃላፊነት መካከል ያለው ውጥረት
  choice: እንዳያዩ… ተመልሰውም እኔ እንዳልፈውሳቸው
  alternative: አለበለዚያ ያዩ… ይመለሱም ነበር፤ እኔም እፈውሳቸው ነበር
  rationale: μήποτε ያለውን የግሪክ ጽሑፍ የአሉታዊ ዓላማ/ውጤት ገጽታ ሳያለዝብ ይጠብቃል። በተመሳሳይም ሕዝቡ ዓይኖቹን ራሱ መጨፈኑን በግልጽ ያስቀምጣል፤ ስለዚህ የመለኮታዊ ፍርድና የሰው ኃላፊነት ውጥረት አልተፈታም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የምንጩን ተደጋጋሚ ‘ዓይን—ጆሮ—ልብ’ አወቃቀር፣ የሕዝቡን ንቁ ኃላፊነት እና የμήποτε አስቸጋሪ የዓላማ/ውጤት ኃይል ጠብቋል።
