  text: καὶ ἐλθὼν εἰς τὴν πατρίδα αὐτοῦ ἐδίδασκεν αὐτοὺς ἐν τῇ συναγωγῇ αὐτῶν, ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν· Πόθεν τούτῳ ἡ σοφία αὕτη καὶ αἱ δυνάμεις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/054.yaml
  text: And coming to his hometown[a], he was teaching them in their synagogue, so that they were astonished and said, “Where did this man get this wisdom and these powers?”
translation:
  language: am
  text: ወደ አደገበት አካባቢ መጥቶ፣ በምኩራባቸው ያስተምራቸው ነበር፤ ስለዚህም እጅግ ተደንቀው፣ “ይህ ሰው ይህን ጥበብና እነዚህን የኃይል ሥራዎች[a] ከየት አገኘ?” አሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ኃይሎች”፤ ኃይልን የሚያሳዩ ሥራዎችን ያመለክታል፤ ብዙ ጊዜም ተአምራት ተብለው ይታወቃሉ።
    reason: lexical_alternative
lexical_decisions:
- source_word: πατρίδα
  choice: ትውልድ ስፍራው
  rationale: በትረካው ዐውድ ቃሉ ኢየሱስ ያደገበትንና በአካባቢው ሰዎች የሚታወቅበትን ስፍራ ያመለክታል፤ “ትውልድ ስፍራው” የአገር ወይም የመንግሥት ድንበር ትርጉም ሳይጭን ይህን አካባቢያዊ ሐሳብ ያስተላልፋል።
- source_word: ἐδίδασκεν
  choice: ያስተምራቸው ነበር
  rationale: ያልተፈጸመው የግስ ቅርጽ በዚያን ጊዜ ቀጥሎ የነበረውን የማስተማር ተግባር ያሳያል።
- source_word: συναγωγῇ
  choice: ምኩራባቸው
  rationale: በአይሁዳዊው ዐውድ “ምኩራብ” የተቋሙንና የመሰብሰቢያውን ስፍራ በግልጽ ያመለክታል።
- source_word: ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν
  choice: እነርሱም እጅግ ተደንቀው … አሉ
  rationale: ὥστε የማስተማሩን ውጤት ያሳያል፤ የአማርኛው የአረፍተ ነገር ቅርጽ ድንጋጤያቸውንና ቀጥሎ የተናገሩትን በተፈጥሯዊ ሁኔታ ያገናኛል። “እጅግ ተደነቁ” የἐκπλήσσομαιን ጠንካራ ስሜት ያንጸባርቃል።
- source_word: Πόθεν
  choice: ከየት አገኘ?
  rationale: ጥያቄው የጥበቡንና የኃይል ሥራዎቹን ምንጭ ይጠይቃል፤ ይህ በዘመናዊ አማርኛ ተፈጥሯዊ አገላለጽ ነው።
- source_word: τούτῳ
  choice: ይህ ሰው
  rationale: ጠቋሚው ቃል በሕዝቡ ንግግር ውስጥ ያለውን ትንሽ ርቀት ያለው ድምፀት ይጠብቃል።
- source_word: σοφία
  choice: ጥበብ
  rationale: የግሪኩን ቃል ቀጥተኛና በዐውዱ የሚስማማ ትርጉም ይሰጣል።
- source_word: δυνάμεις
  choice: የኃይል ሥራዎች
  rationale: ቃሉ በቀጥታ “ኃይሎች” ማለት ቢሆንም በዚህ ዐውድ ኃይልን የሚገልጡ ድርጊቶችን ያመለክታል። “የኃይል ሥራዎች” ከ“ተአምራት” ይልቅ የግሪኩን የቃል ክፍተት በመጠበቅ በአማርኛም ግልጽ ነው።
theological_decisions:
- issue: δυνάμεις ለኢየሱስ ልዩ ሥራዎች ሲያመለክት የሚሰጠው ትርጉም
  choice: የኃይል ሥራዎች
  alternative: ተአምራት
  rationale: ጽሑፉ የኢየሱስን ከተፈጥሮ በላይ የሆኑ ሥራዎች ያመለክታል፤ ሆኖም δυνάμεις በቃል ደረጃ “ኃይሎች” ነው። “የኃይል ሥራዎች” ድርጊቶቹን ግልጽ ሲያደርግ ቃሉን ወዲያውኑ በ“ተአምራት” ብቻ አይወስነውም።
