  yaml_path: translation/nt/matthew/013/025.yaml
  text: But while the men were sleeping, his enemy came and sowed weeds among the wheat and went away.
translation:
  language: am
  text: ነገር ግን ሰዎቹ ተኝተው ሳሉ፣ ጠላቱ መጥቶ በስንዴው መካከል እንክርዳድ ዘርቶ ሄደ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς ἀνθρώπους
  choice: ሰዎቹ
  rationale: በዐውዱ የተጠቀሱትን ሰዎች በተፈጥሯዊ ዘመናዊ አማርኛ ያመለክታል፤ ἄνθρωπος በተለምዶ ሰውን በአጠቃላይ ይጠቅሳል።
- source_word: ὁ ἐχθρὸς
  choice: ጠላቱ
  rationale: የባለእርሻውን ጠላት የሚያመለክተውን የግሪኩን ባለቤትነትና የተወሰነነት አገላለጽ በአጭሩ ይጠብቃል።
- source_word: ζιζάνια
  choice: እንክርዳድ
  rationale: ከስንዴ መካከል የተዘራውን ጎጂ አረም የሚገልጽ የተለመደ አማርኛ ቃል ነው፤ የእፅዋቱን ዝርያ ከግሪኩ በላይ አይወስንም።
- source_word: ἀνὰ μέσον τοῦ σίτου
  choice: በስንዴው መካከል
  rationale: አረሙ በስንዴው ውስጥ ተቀላቅሎ መዘራቱን በተፈጥሯዊና ታማኝ አገላለጽ ያሳያል።
