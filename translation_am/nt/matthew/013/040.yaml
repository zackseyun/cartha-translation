lexical_decisions:
- source_word: ὥσπερ οὖν
  choice: ስለዚህ … እንደሚቃጠል
  rationale: οὖν የሚያሳየውን ከቀደመው ሐሳብ ጋር ያለ ድምዳሜያዊ ግንኙነት «ስለዚህ» ይጠብቃል፤ ὥσπερ የሚያስገባው ንጽጽር ደግሞ በአማርኛው «እንደ…» አወቃቀር ተገልጧል።
- source_word: συλλέγεται
  choice: ተሰብስቦ
  rationale: የግሱን ተደራጊ ቅርጽና እንክርዳዱን ለማቃጠል የመሰብሰብ የእርሻ ምስል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: τὰ ζιζάνια
  choice: እንክርዳዱ
  rationale: ቃሉ በምሳሌው አስቀድሞ የተጠቀሰውን ጎጂ አረም፣ ምናልባትም ከስንዴ ጋር የሚመሳሰለውን ዳርኔል፣ ያመለክታል። «እንክርዳዱ» ዘመናዊና በቀላሉ የሚገባ ሲሆን የመወሰኛ አንቀጹንም ይጠብቃል።
- source_word: πυρὶ καίεται
  choice: በእሳት እንደሚቃጠል
  rationale: πυρί የመሣሪያን ወይም የአካባቢን ግንኙነት ሊያመለክት የሚችለውን ሳያጠብ፣ እሳትን በግልጽ ይጠቅሳል፤ καίεται ያለውን ቀላል የመቃጠል ትርጉምም ይጠብቃል።
- source_word: οὕτως ἔσται
  choice: እንዲሁ ይሆናል
  rationale: የንጽጽሩን ሁለተኛ ክፍልና የἔσταιን የወደፊት ጊዜ ኃይል በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐν τῇ συντελείᾳ
  choice: በ… ፍጻሜ
  rationale: συντέλεια ቀላል መቋረጥን ብቻ ሳይሆን ወደ ፍጻሜ መድረስን ያመለክታል፤ «ፍጻሜ» ይህን ኃይል በግልጽና በክብር ቋንቋ ያቀርባል።
- source_word: τοῦ αἰῶνος
  choice: የዘመኑ
  rationale: αἰών እዚህ በዋናነት ጊዜያዊ ዘመንን እንጂ ቁሳዊውን ዓለም አያመለክትም። «ዘመኑ» የግሪኩን የመወሰኛ አንቀጽ ይጠብቃል፤ ግሪኩ በግልጽ «ይህ» ስለማይል «የዚህ ዘመን» የሚለው ተጨማሪ ትርጓሜ አልገባም።
theological_decisions:
- issue: የፍጻሜ ዘመን ሐረግ τοῦ αἰῶνος
  choice: የዘመኑ
  alternative: የዓለም
  rationale: «ዘመን» የαἰώνን ጊዜያዊና ታሪካዊ አውድ ይጠብቃል፤ ቃሉን ከቁሳዊው ዓለም ፍጻሜ ጋር ብቻ አያዋህደውም፣ የተወሰነ የፍጻሜ ዘመን ሥርዓትም በጽሑፉ ላይ አይጭንም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የንጽጽሩ አወቃቀርና የወደፊት ጊዜ ኃይል ተጠብቀዋል፤ የእንክርዳዱ ትክክለኛ የዕፅዋት ዝርያና αἰών ሊኖረው የሚችለው አማራጭ አተረጓጎም በማስታወሻ ቀርበዋል።
