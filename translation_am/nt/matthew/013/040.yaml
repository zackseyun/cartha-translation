  text: እንግዲህ፣ እንክርዳዶቹ[a] ተሰብስበው በእሳት እንደሚቃጠሉ፣ በዘመኑ ፍጻሜ[b] እንዲሁ ይሆናል።
  philosophy: optimal-equivalence
  footnotes:
