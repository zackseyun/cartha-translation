    text: የግሪኩ ቃል ጎጂ አረሞችን ያመለክታል፤ ምናልባትም ከስንዴ ጋር የሚመሳሰል ዳርኔል የተባለ አረም ነው።
    reason: lexical_alternative
  - marker: b
    text: ወይም «በዓለም ፍጻሜ»፤ በግሪክኛ ቃል በቃል «በዘመኑ ፍጻሜ» ይላል።
