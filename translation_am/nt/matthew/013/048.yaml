  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἣν ὅτε ἐπληρώθη ἀναβιβάσαντες ἐπὶ τὸν αἰγιαλὸν καὶ καθίσαντες συνέλεξαν τὰ καλὰ εἰς ⸀ἄγγη, τὰ δὲ σαπρὰ ἔξω ἔβαλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/048.yaml
  text: When it was filled[a], they pulled it up onto the shore, sat down, and gathered the good fish into containers[b], but threw the rotten ones out.
translation:
  language: am
  text: መረቡም በሞላ ጊዜ ወደ ዳርቻ ጎትተው አወጡት፤ ተቀምጠውም ጥሩዎቹን ዓሦች በመያዣ ዕቃዎች ውስጥ ሰበሰቡ፤ የበሰበሱትን[a] ግን ወደ ውጭ ጣሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “መጥፎዎቹን” ወይም “የማይጠቅሙትን።” የግሪኩ ቃል የበሰበሰ፣ የተበላሸ ወይም በአጠቃላይ የማይጠቅም ማለት ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν ὅτε ἐπληρώθη
  choice: መረቡም በሞላ ጊዜ
  rationale: ἣν ወደ ቀደመው ቁጥር መረብ ይመለሳል። በአማርኛ ስሙን መድገም ማጣቀሻውን ግልጽ ያደርጋል፤ ἐπληρώθη ደግሞ የመረቡን በዓሣ መሙላት ያመለክታል።
- source_word: ἀναβιβάσαντες ἐπὶ τὸν αἰγιαλόν
  choice: ወደ ዳርቻ ጎትተው አወጡት
  rationale: ድርጊቱ መረቡን ከውኃ ወደ መሬት መጎተትንና ማውጣትን ያሳያል። ዳርቻ የአሸዋ ባሕር ዳርቻ መሆኑን ሳይወስን αἰγιαλόςን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: καθίσαντες συνέλεξαν
  choice: ተቀምጠውም … ሰበሰቡ
  rationale: ሁለቱን ተከታታይ ድርጊቶች በተፈጥሯዊ የአማርኛ ትረካ ያቀርባል።
- source_word: τὰ καλὰ
  choice: ጥሩዎቹን ዓሦች
  rationale: ዓሦች በግሪክ በግልጽ ባይደገምም ከዐውዱ የተገነዘበ ነው፤ በአማርኛ መጨመሩ የሚለዩትን ነገር ግልጽ ያደርጋል።
- source_word: εἰς ἄγγη
  choice: በዕቃዎች ውስጥ
  rationale: ἄγγη አጠቃላይ የመያዣ ዕቃዎችን የሚጠቁም እንጂ ቅርጫትን ብቻ አይወስንም።
- source_word: τὰ δὲ σαπρά
  choice: የበሰበሱትን
  rationale: σαπρά በስባሽነት፣ በመበላሸት ወይም በከንቱነት የተነሣ የማይጠቅሙትን ሊያመለክት ይችላል። ‘የበሰበሱትን’ የዓሣውን ተጨባጭ ምስልና የእሴት ፍርዱን ይጠብቃል።
- source_word: ἔξω ἔβαλον
  choice: ወደ ውጭ ጣሉ
  rationale: የማስወገድንና የመጣልን ኃይል በቀጥታና በዘመናዊ አማርኛ ይገልጻል።
theological_decisions:
- issue: የመለየቱን ምስል ትርጓሜ በቁጥሩ ውስጥ ማስገባት
  choice: ቁጥሩን እንደ ዓሣ ማጥመድና መለየት ትዕይንት በተጨባጭ መተርጎም
  alternative: የመጨረሻውን ፍርድ አስቀድሞ የሚገልጽ ትርጓሜያዊ ቃል መጨመር
  rationale: በዚህ ቁጥር ምሳሌያዊው ትዕይንት ብቻ ይተረካል፤ ማብራሪያው በቀጣዮቹ ቁጥሮች ይመጣል። ስለዚህ ትርጉሙ የኋለኛውን ማብራሪያ በዚህ ቁጥር ውስጥ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። አጭር ተከታታይ ግሶች የትረካውን ፍሰት ይጠብቃሉ።
