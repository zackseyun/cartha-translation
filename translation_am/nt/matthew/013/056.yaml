id: MAT.13.56
reference: Matthew 13:56
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ αἱ ἀδελφαὶ αὐτοῦ οὐχὶ πᾶσαι πρὸς ἡμᾶς εἰσιν; πόθεν οὖν τούτῳ ταῦτα πάντα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/056.yaml
  text: And are not all his sisters with us? Where then did this man get all these things?[a]
translation:
  language: am
  text: እህቶቹስ ሁሉ ከእኛ ጋር አይደሉምን? ታዲያ ይህ ሰው እነዚህን ሁሉ ከየት አገኘ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሴት ዘመዶቹ።” እዚህ ያለው የግሪክ ቃል በተለምዶ “እህቶች” ማለት ነው፤ አንዳንዶች ግን ከጊዜ በኋላ በተነሱ ሥነ መለኮታዊ ውይይቶች አንጻር ሰፋ አድርገው ይተረጉሙታል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφαὶ
  choice: እህቶቹ
  rationale: በአውዱ የቤተሰብ አባላት እየተጠቀሱ ስለሆነ፣ የግሪኩን ቃል የተለመደ ቀጥተኛ ትርጉም ‘እህቶቹ’ ያስተላልፋል።
- source_word: οὐχὶ πᾶσαι
  choice: ሁሉ ... አይደሉምን?
  rationale: አዎንታዊ መልስ የሚጠብቀውን የአጽንዖት ጥያቄና ‘ሁሉ’ የሚለውን ሙሉነት ይጠብቃል።
- source_word: πρὸς ἡμᾶς
  choice: ከእኛ ጋር
  rationale: በማኅበረሰቡ ውስጥ አብረው መኖራቸውን ወይም መገኘታቸውን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: πόθεν οὖν
  choice: ታዲያ ... ከየት
  rationale: πόθεν የምንጩን ጥያቄ ያስጠብቃል፤ ‘ታዲያ’ ደግሞ οὖν የሚያሳየውን የሐሳብ ድምዳሜ በተፈጥሯዊ አነጋገር ያቀርባል።
- source_word: τούτῳ
  choice: ይህ ሰው
  rationale: ሰዎቹ ኢየሱስን በጠቋሚና በመጠኑ አቃላይ አነጋገር መጥቀሳቸውን ያስተላልፋል።
- source_word: ταῦτα πάντα
  choice: ይህን ሁሉ
  rationale: በቅርብ አውድ የተጠቀሱትን ጥበብና ኃይለኛ ሥራዎች በአጠቃላይ የሚያመለክተውን ብዙ ቁጥር ሐሳብ በተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: የኢየሱስ ‘እህቶች’ ማንነት
  choice: ἀδελφαὶ በተለመደው ቀጥተኛ ትርጉሙ ‘እህቶቹ’ ተብሎ ተተርጉሟል።
  alternative: ሴት ዘመዶቹ
  rationale: አውዱ የቤተሰብ ዝምድናን ያመለክታል፤ ትርጉሙ በኋላ የተነሱ ሥነ መለኮታዊ ክርክሮችን በጽሑፉ ላይ ሳይጭን የግሪኩን ግልጽ የቃል ፍቺ ይከተላል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘እህቶቹስ’ ከቀደመው የቤተሰብ ዝርዝር ጋር ያለውን ቀጣይነት ያሳያል፤ ‘ታዲያ’ የሕዝቡን የድምዳሜ ጥያቄ ተፈጥሯዊ አድርጎ ያቀርባል።
