  text: ብዙ ሰዎችም ወደ እርሱ ተሰበሰቡ፤ ስለዚህ እርሱ ወደ ጀልባ ገብቶ ተቀመጠ፣ ሕዝቡም ሁሉ በዳርቻው ቆሞ ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήχθησαν πρὸς αὐτὸν ὄχλοι πολλοί
  choice: ብዙ ሕዝብም ወደ እርሱ ተሰበሰበ
  rationale: የግሪኩን ወደ እርሱ የመሰብሰብ እንቅስቃሴ በተፈጥሯዊ አማርኛ ያሳያል፤ የግሪኩ ብዙ ቁጥር ὄχλοι በአማርኛ በተለምዶ በነጠላ ስብስባዊ ስም ‘ሕዝብ’ ተገልጿል።
- source_word: ὥστε
  choice: ስለዚህ
  rationale: ብዙ ሕዝብ መሰብሰቡ ያስከተለውን ውጤት በግልጽና ተፈጥሯዊ አማርኛ ያገናኛል።
- source_word: εἰς πλοῖον ἐμβάντα καθῆσθαι
  choice: ወደ ጀልባ ገብቶ ተቀመጠ
  rationale: ወደ ጀልባው መግባቱንና ከዚያም መቀመጡን የግሪኩን ቅደም ተከተል በተፈጥሯዊ ትረካ ያቀርባል።
- source_word: πᾶς ὁ ὄχλος
  choice: ሕዝቡም ሁሉ
  rationale: ቀደም ሲል የተጠቀሱትን ሰዎች እንደ አንድ ስብስብ የሚጠቅሰውን የግሪክ ነጠላ ቅርጽ ይጠብቃል።
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: በዳርቻው
