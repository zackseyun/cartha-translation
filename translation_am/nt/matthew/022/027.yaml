  rationale: ὕστερον ከπάντων ጋር በዚህ አገባብ የቅደም ተከተሉን መጨረሻ ያመለክታል፤ «ከሁሉም በኋላ» የግሪኩን ቅርጽና ‘በመጨረሻ’ የሚለውን ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δὲ
