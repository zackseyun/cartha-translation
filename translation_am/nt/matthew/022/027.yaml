- source_word: ἀπέθανεν
  choice: ሞተች
  rationale: ግሱ የሞትን ክስተት በቀጥታ ይገልጻል፤ የሴት ባለቤትን ለማመልከት የአማርኛው ግስ በሴት ፆታ ተዛምዷል።
- source_word: ἡ γυνή
  choice: ሴቲቱ
  rationale: γυνή ‘ሴት’ ወይም ‘ሚስት’ ሊሆን ይችላል። በዚህ ታሪክ ከብዙ ወንድማማቾች ጋር የተጋባችውን አንዲት ሴት ስለሚያመለክት፣ «ሴቲቱ» የግሪኩን ገለልተኛ አጠራር ይጠብቃል።
