  text: οἱ δὲ λοιποὶ κρατήσαντες τοὺς δούλους αὐτοῦ ὕβρισαν καὶ ἀπέκτειναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/006.yaml
  text: But the rest[a], seizing his servants, mistreated them and killed them.
translation:
  language: am
  text: የቀሩት ግን ባሪያዎቹን[a] ይዘው አንገላቷቸው፣ ገደሏቸውም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አገልጋዮቹን።”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: የቀሩት ግን
  rationale: λοιποί ቀደም ሲል ከተጠቀሱት ተጋባዦች የቀሩትን ያመለክታል፤ ግን ደግሞ የδέን ቀላል ንፅፅራዊ ኃይል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: κρατήσαντες
  choice: ይዘው
  rationale: የአኦሪስት አሳታፊውን ከዋናዎቹ ግሶች በፊት እንደተፈጸመ ድርጊት ያቀርባል፤ ይዘው የሚለውም መያዝን እንጂ ተራ አብሮ መውሰድን አያመለክትም።
- source_word: τοὺς δούλους αὐτοῦ
  choice: ባሪያዎቹን
  rationale: δοῦλος ባሪያ ወይም አገልጋይ ሊባል ይችላል። በዚህ ምሳሌ የንጉሡ የበታች መልእክተኞች ስለሆኑ፣ ባሪያዎቹን የግሪኩን ማኅበራዊ አገባብ በግልጽ ሁኔታ ይጠብቃል፤ አገልጋዮቹን የሚለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ὕβρισαν
  choice: አንገላቷቸው
  rationale: ὑβρίζω ከቃላዊ ስድብ በላይ የሆነ አሳፋሪና ጨካኝ በደልን ሊያመለክት ስለሚችል፣ አንገላቷቸው ሰፊውን ትርጉም በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἀπέκτειναν
  choice: ገደሏቸውም
  rationale: የግሱን ቀጥተኛ ትርጉም ይሰጣል፤ በሕጋዊ ወይም በሞራላዊ ግምገማ የተጨመረ ፍቺ አያስገባም።
theological_decisions:
- issue: በምሳሌያዊው አገባብ δοῦλοςን መተርጎም
  choice: ባሪያዎቹን
  alternative: አገልጋዮቹን
  rationale: የግሪኩ ቃል ሁለቱንም ፍቺዎች ሊሸከም ቢችልም፣ እዚህ ከንጉሡ ጋር ያላቸውን የበታችነትና የባለቤትነት ግንኙነት ሳያለዝብ ለማቅረብ ባሪያዎቹን ተመርጧል። ይህ በምሳሌው ላይ ተጨማሪ ሥነ መለኮታዊ ትርጓሜ አይጭንም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ አማርኛን ይጠቀማል። የግሪኩ አሳታፊ አወቃቀር በተፈጥሯዊው “ይዘው” ተገልጿል፤ ሁለቱ ዋና ድርጊቶችም በአማርኛ ተመጣጣኝ ምት ቀርበዋል።
