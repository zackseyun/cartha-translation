  edition: SBLGNT
  text: Διδάσκαλε, ποία ἐντολὴ μεγάλη ἐν τῷ νόμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/036.yaml
  text: Teacher[a], which commandment is greatest in the Law?
translation:
  language: am
  text: “መምህር ሆይ፣ በሕጉ ውስጥ ታላቁ ትእዛዝ የትኛው ነው?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፦ “በሕጉ ውስጥ ታላቅ የሆነው ትእዛዝ የትኛው ነው?”
    reason: የμεγάληን አዎንታዊ የሰዋስው ቅርጽ ለማሳየት፣ ዋናው ጽሑፍ ግን የአውዱን የደረጃ ንጽጽር ኃይል በተፈጥሯዊ አማርኛ ያቀርባል።
lexical_decisions:
- source_word: Διδάσκαλε
  choice: መምህር ሆይ
  rationale: የቀጥታ አድራሻውን የሚገልጽ ተፈጥሯዊና የተከበረ አማርኛ ነው፤ በዚህ አውድ διδάσκαλος የሚለውን መደበኛ ትርጉም ይጠብቃል።
- source_word: ποία
  choice: የትኛው
  rationale: ከሕጉ ትእዛዛት መካከል አንዱን ለይቶ ለመጠየቅ የሚመች የጥያቄ ቃል ነው።
- source_word: ἐντολὴ
  choice: ትእዛዝ
  rationale: በቅዱሳት መጻሕፍትና በሕግ አውድ ἐντολήን በግልጽና በተለመደ መንገድ ይወክላል።
- source_word: μεγάλη
  choice: ታላቁ
  rationale: የግሪክኛው ቃል በቅርጹ አዎንታዊ ደረጃ ቢሆንም፣ ከποία ጋር በዚህ ጥያቄ ውስጥ በደረጃ የበላይ የሆነውን ትእዛዝ የመለየት አገላለጽ ነው። “ታላቁ” ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐν τῷ νόμῳ
  choice: በሕጉ ውስጥ
  rationale: እዚህ νόμος የሙሴን ሕግ ወይም ቶራን ያመለክታል፤ የተወሰነው ቅጥያ “-ጉ” ይህን የታወቀ ማጣቀሻ ያሳያል።
theological_decisions:
- issue: μεγάληን እንደ አዎንታዊ ወይም እንደ ከፍተኛ ደረጃ መተርጎም
  choice: ታላቁ
  alternative: ታላቅ የሆነው
  rationale: μεγάλη በሰዋስው አዎንታዊ ቅርጽ ነው፤ ሆኖም ποία እና የጥያቄው አውድ ከትእዛዛቱ መካከል በደረጃ የሚበልጠውን መለየት ያመለክታሉ። “ታላቁ” ይህን ፈሊጣዊ ኃይል ይጠብቃል፤ ቀጥተኛው አዎንታዊ አገላለጽ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛ። “ሆይ” የግሪክኛውን የጥሪ ቅርጽ በተፈጥሯዊ መጽሐፍ ቅዱሳዊ አገላለጽ ያሳያል።
