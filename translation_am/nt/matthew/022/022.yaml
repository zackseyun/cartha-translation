- source_word: ἀκούσαντες
  choice: ይህንም ሲሰሙ
  rationale: የግሪኩ የአኦሪስት ተሳቢ ግስ ከዋናው ግስ በፊት የሆነውን ድርጊት ያመለክታል። በአማርኛ «ሲሰሙ» የጊዜውን ግንኙነት ተፈጥሯዊ አድርጎ ያቀርባል፤ «ይህን» ደግሞ በግሪኩ በዐውዱ የተገመተውን የመስማት ተሳቢ ያሳያል።
- source_word: ἐθαύμασαν
  choice: ተደነቁ
  rationale: θαυμάζω በዚህ ዐውድ መገረምንና መደነቅን ያመለክታል፤ «ተደነቁ» ዘመናዊ፣ ግልጽና ተፈጥሯዊ ነው።
- source_word: ἀφέντες αὐτὸν
  choice: ትተውትም
  rationale: ἀφίημι እዚህ አንድን ሰው ትቶ መሄድን ያመለክታል። «ትተውት» ቀጥተኛ ሲሆን «ብቻውን» የሚል በምንጩ ያልተገለጸ ሐሳብ አይጨምርም።
- source_word: ἀπῆλθαν
  choice: ሄዱ
  rationale: ἀπέρχομαι ከቦታው መሄድን ወይም መለየትን ያሳያል። ከ«ትተውት» ጋር «ሄዱ» በአማርኛ የመሄዳቸውን አቅጣጫ በቂ ሁኔታ ያሳያል።
- source_word: καὶ ... καὶ
  choice: -ም ... -ም
  rationale: የተደጋገመው καί የድርጊቶቹን ቅደም ተከተልና ትስስር ያሳያል። የአማርኛዎቹ «-ም» አያያዦች ይህን ትስስር ያለ ከባድነት ይጠብቃሉ።
