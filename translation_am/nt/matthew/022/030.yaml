  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐν γὰρ τῇ ἀναστάσει οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται, ἀλλ’ ὡς ἄγγελοι ⸀θεοῦ ἐν ⸀τῷ οὐρανῷ εἰσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/030.yaml
  text: For in the resurrection they neither marry nor are given in marriage[a], but are like the angels of God in heaven.
translation:
  language: am
  text: ምክንያቱም በትንሣኤ[a] ሰዎች አያገቡም፤ ለጋብቻም አይሰጡም፤ ነገር ግን በሰማይ እንዳሉ የእግዚአብሔር መላእክት ናቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በትንሣኤ ጊዜ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν γὰρ τῇ ἀναστάσει
  choice: በትንሣኤ
  rationale: ἐν የትንሣኤን ጊዜ ወይም የትንሣኤን ሕይወት ሁኔታ ሊያመለክት ይችላል። በትንሣኤ የሚለው አጭርና ተፈጥሯዊ አተረጓጎም ይህን ስፋት ይጠብቃል፤ γάρ የሚያሳየው ምክንያታዊ ትስስር በዐውደ ንባቡ ይገባል።
- source_word: γαμοῦσιν
  choice: አያገቡም
  rationale: ግሱ ወደ ጋብቻ መግባትን ያመለክታል፤ ማግባት በዘመናዊ አማርኛ ግልጽና የተለመደ ነው።
- source_word: γαμίζονται
  choice: ለጋብቻም አይሰጡም
  rationale: የግሪኩን ተደራጊ ቅርጽና ከγαμοῦσιν ጋር ያለውን ልዩነት ይጠብቃል።
- source_word: ὡς
  choice: እንዳሉት
  rationale: ὡς ንጽጽርን እንጂ ማንነትን አያመለክትም። ይህ ቅርጽ የተነሡት ሰዎች መላእክት ይሆናሉ የሚል ትርጉም ሳይጭን ከእነርሱ ጋር መመሳሰላቸውን ያሳያል።
- source_word: ἄγγελοι θεοῦ
  choice: የእግዚአብሔር መላእክት
  rationale: θεοῦ የሚለውን የባለቤትነት ገላጭ በግልጽ ሁኔታ ያካትታል።
- source_word: ἐν τῷ οὐρανῷ
  choice: በሰማይ
  rationale: በዚህ ዐውድ οὐρανός የመላእክትን ሰማያዊ መኖሪያ እንጂ የሚታየውን ሰማይ ብቻ አያመለክትም።
theological_decisions:
- issue: ከመላእክት ጋር የተደረገው ንጽጽር ወሰን
  choice: በትንሣኤ ያሉ ሰዎች ከመላእክት ጋር ይመሳሰላሉ፤ መላእክት ይሆናሉ አይባልም።
  alternative: ንጽጽሩን በማስፋት ሰዎች ወደ መላእክት ይለወጣሉ ብሎ መረዳት።
  rationale: ὡς የንጽጽር ቃል ነው፤ ቅርብ ዐውደ ንባቡም ንጽጽሩን ከጋብቻ አለመኖር ጋር ያያይዘዋል። ትርጉሙ መመሳሰልን ይጠብቃል እንጂ የባሕርይ ለውጥን አይጨምርም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። “አያገቡም / ለጋብቻ አይሰጡም” የሚለው ጥንድ የግሪኩን ንቁና ተደራጊ ግሶች ልዩነት ይጠብቃል።
