id: MAT.22.18
reference: Matthew 22:18
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς τὴν πονηρίαν αὐτῶν εἶπεν· Τί με πειράζετε, ὑποκριταί;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/018.yaml
  text: But Jesus[a], knowing their evil intent, said, “Why are you testing me[b], hypocrites?”
translation:
  language: am
  text: ኢየሱስ ግን ክፉ ሐሳባቸውን[a] አውቆ፣ “እናንተ ግብዞች፣ ለምን ትፈትኑኛላችሁ[b]?” አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ክፋታቸውን” ወይም “ተንኮላቸውን።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ለምን ትፈታተኑኛላችሁ?” የግሪኩ ግስ እንደ አውዱ “መፈተን፣” “መሞከር” ወይም “መፈታተን” ማለት ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: አውቆ
  rationale: የግሪኩ የአኦሪስት አጋዥ ግስ ከዋናው ግስ በፊት የነበረውን የኢየሱስን ማወቅ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: δὲ
  choice: ግን
  rationale: በቀደመው የማታለል ንግግርና በኢየሱስ ምላሽ መካከል ያለውን መጠነኛ ንፅፅር ያሳያል።
- source_word: πονηρίαν
  choice: ክፉ ሐሳባቸውን
  rationale: ቃሉ ክፋትን ወይም ተንኮል የተሞላበትን ዓላማ ሊያመለክት ይችላል፤ በዚህ አውድ ከጥያቄያቸው በስተጀርባ ያለውን ክፉ ውስጣዊ ዓላማ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: εἶπεν
  choice: አለ
  rationale: ለትረካዊው የግሪክ ግስ አጭርና መደበኛ የአማርኛ አቻ ነው።
- source_word: Τί
  choice: ለምን
  rationale: τί ከግስ ጋር በዚህ አገባብ ምክንያትን ይጠይቃል፤ “ለምን” በአማርኛ ተፈጥሯዊውን ጥያቄ ይሰጣል።
- source_word: πειράζετε
  choice: ትፈትኑኛላችሁ
  rationale: πειράζω መፈተንን፣ መሞከርን ወይም መፈታተንን ሊያመለክት ይችላል። “ትፈትኑኛላችሁ” እርሱን በጥያቄ ለማጥመድ ያደረጉትን ሙከራ ያሳያል፤ ሌላው የቃሉ ገጽታ በማስታወሻ ተጠብቋል።
- source_word: ὑποκριταί
  choice: ግብዞች
  rationale: ቅን መስለው ክፉ ዓላማቸውን የሚሸፍኑ ሰዎችን የሚገልጽ የተለመደና ትክክለኛ የአማርኛ ቃል ነው።
theological_decisions:
- issue: ኢየሱስ የተቃዋሚዎቹን ውስጣዊ ዓላማ ማወቁ
  choice: ክፉ ሐሳባቸውን አውቆ
  alternative: ክፋታቸውን ተረድቶ / ተንኮላቸውን አውቆ
  rationale: ጥቅሱ ኢየሱስ የአቀራረባቸውን ክፉ ባሕርይና ዓላማ በትክክል እንዳወቀ ይናገራል። ትርጉሙ ይህን ያቆያል እንጂ ጥቅሱ ከሚለው በላይ የሆነ ዶግማዊ ማብራሪያ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ የቃላት ቅደም ተከተል ሳይገደድ፣ ንፅፅሩና ቀጥተኛው ወቀሳ ተጠብቀዋል።
