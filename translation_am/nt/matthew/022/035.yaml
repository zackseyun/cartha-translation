  text: ከእነርሱም አንዱ፣ የሕግ ሊቅ[a]፣ እየፈተነው ጠየቀው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የሕግ አዋቂ።” የግሪኩ ቃል የአይሁድን ሕግ በሚገባ የሚያውቅ ሰው ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: -ም
  rationale: የግሪኩን ቀላል ትስስር በተፈጥሯዊ የአማርኛ አያያዥ ቅጥያ ያሳያል፤ በግሪኩ የሌለ ተጨማሪ የጊዜ ትርጉም አያስገባም።
- source_word: ἐπηρώτησεν
  choice: ጠየቀው
  rationale: ‘ጠየቀ’ የሚለውን መሠረታዊ ትርጉም በተፈጥሯዊ አማርኛ ያቀርባል፤ በግሪኩ በግልጽ ያልተጠቀሰውን ‘ጥያቄ’ የሚል ስም አይጨምርም።
- source_word: εἷς ἐξ αὐτῶν
  choice: ከእነርሱ አንዱ
  rationale: ተናጋሪው ቀደም ሲል ከተጠቀሰው ቡድን አባል መሆኑን የክፍል አመልካቹን አገላለጽ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: νομικὸς
  choice: የሕግ ሊቅ
  rationale: በዚህ የአይሁድ አውድ ቃሉ የሙሴን ሕግ በሚገባ የሚያውቅ ሰው ያመለክታል። ‘የሕግ ሊቅ’ አጭርና ክቡር ሲሆን፣ ከዘመናዊ የፍርድ ቤት ጠበቃ ጋር እንዳይምታታ ማብራሪያ በአስተያየት ቀርቧል።
- source_word: πειράζων
  choice: እየፈተነው
  rationale: ተሳቢው ጥያቄው ከፈተና ወይም ከሙከራ ጋር አብሮ መቅረቡን ያሳያል። ይህ አተረጓጎም ‘ወደ ኃጢአት ፈተነው’ የሚለውን ጠባብ ፍቺ ሳያስገድድ የተቃውሞ ሙከራውን ያስቀምጣል።
- source_word: αὐτόν
  choice: -ው
  rationale: ቀጥተኛው ተሳቢ ኢየሱስን ያመለክታል፤ በአማርኛ ከግሶቹ ጋር በሚጣበቅ የሦስተኛ መደብ ተባዕት ነጠላ ቅጥያ ተተርጉሟል።
theological_decisions:
- issue: πειράζων ኢየሱስን በተመለከተ ያለው የትርጉም ስፋት
  choice: እየፈተነው
  alternative: ሊፈትነው፤ እየፈታተነው
  rationale: የግሪኩ ቃል መፈተንን፣ መሞከርን ወይም ወደ ክፉ ነገር መፈተንን ሊያመለክት ይችላል። በዚህ ትረካ የተቃውሞ ምርመራ ጎልቶ ስለሚታይ፣ ‘እየፈተነው’ የጠላትነት ሙከራውን ያሳያል፤ ነገር ግን ቃሉን ወደ ኃጢአት ማሳት ብቻ አያጠብበውም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ሥርዓተ ነጥቡ ተያያዥ መግለጫውን ‘የሕግ ሊቅ’ ለመለየት ያገለግላል።
