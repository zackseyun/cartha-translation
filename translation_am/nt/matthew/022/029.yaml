base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/029.yaml
  text: But Jesus answered them[a], “You are mistaken, because you know neither the Scriptures nor the power of God.”
translation:
  language: am
  text: ኢየሱስ ግን መልሶ እንዲህ አላቸው፤ “መጻሕፍትንም ሆነ የእግዚአብሔርን ኃይል ስለማታውቁ ተሳስታችኋል።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ተታላችኋል” ወይም “በስሕተት ላይ ናችሁ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: ኢየሱስ ግን መልሶ እንዲህ አላቸው
  rationale: የግሪኩን የመልስ አሰጣጥ ቀመር ያለ አላስፈላጊ ድግግሞሽ በተፈጥሯዊ አማርኛ ያቀርባል፤ δέ ያለውን ቀላል ተቃርኖ ወይም የንግግር ሽግግር “ግን” ይጠብቃል።
- source_word: Πλανᾶσθε
  choice: ተሳስታችኋል
  rationale: በዚህ አውድ የተሳሳተ ግንዛቤ ወይም ከእውነት መራቅን በግልጽና ተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል፤ ቃሉ የውጭ አታላይን ብቻ እንዳያመለክት ይጠነቀቃል።
- source_word: μὴ εἰδότες
  choice: ስለማታውቁ
  rationale: አሳቢው የተሳሳቱበትን ምክንያት ስለሚገልጽ፣ የክፍሉን ምክንያታዊ ግንኙነት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τὰς γραφὰς
  choice: መጻሕፍትን
  rationale: በአይሁድና በቀድሞ ክርስቲያናዊ አጠቃቀም የተቀደሱትን ጽሑፎች የሚያመለክተውን የብዙ ቁጥር ቃል በተለመደው የአማርኛ መጽሐፍ ቅዱሳዊ ቃል ይገልጻል።
- source_word: μηδὲ τὴν δύναμιν τοῦ θεοῦ
  choice: የእግዚአብሔርን ኃይልም ሆነ
  rationale: δύναμιςን “ኃይል”፣ τοῦ θεοῦን “የእግዚአብሔር” ብሎ በቀጥታ ያስተላልፋል፤ “መጻሕፍትንም ሆነ ...” የሚለው አወቃቀር የμὴ ... μηδέን የሁለቱንም አለማወቅ ትርጉም በተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: የሰዱቃውያን ስሕተት ምክንያት
  choice: ስሕተታቸው መጻሕፍትንም የእግዚአብሔርንም ኃይል ካለማወቃቸው እንደመጣ ተተርጉሟል።
  alternative: ንግግሩን ምክንያት ሳያጎላ “መጻሕፍትንና የእግዚአብሔርን ኃይል አታውቁም” ብሎ እንደ ተጨማሪ ክስ ማቅረብ።
  rationale: μὴ εἰδότες የሚለው አሳቢ ከተጣመሩት ሁለት ተሳቢዎች ጋር የΠλανᾶσθεን ምክንያት በተፈጥሮ ያብራራል።
