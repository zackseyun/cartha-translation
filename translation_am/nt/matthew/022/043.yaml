base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/043.yaml
  text: He said to them[a], “How then does David, in the Spirit, call him Lord[b], saying,”
translation:
  language: am
  text: እርሱም እንዲህ አላቸው፦ «ታዲያ ዳዊት በመንፈስ[a] እንዴት ጌታ[b] ብሎ ይጠራዋል? እንዲህ ሲል፦»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በመንፈስ አማካይነት።» የግሪኩ ሐረግ በመንፈስ ውስጥ መሆንን ወይም በመንፈስ አማካይነት መናገርን ሊገልጽ ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «አለቃ።» የግሪኩ κύριος የሚለው ማዕረግ በተለምዶ «ጌታ» ተብሎ ይተረጎማል።
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: አላቸው
  rationale: የግሪኩ የአሁን ጊዜ ግስ በትረካ ውስጥ ታሪካዊ የአሁን ጊዜ ስለሆነ፣ በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜ ሆኖ ተተርጉሟል።
- source_word: Πῶς οὖν
  choice: ታዲያ … እንዴት
  rationale: πῶς ያለውን የጥያቄ ኃይልና οὖν ያለውን ከቀደመው ንግግር የሚነሳ ድምዳሜያዊ ግንኙነት በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: Δαυὶδ
  choice: ዳዊት
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደው የስሙ ቅርጽ ነው።
- source_word: ἐν πνεύματι
  choice: በመንፈስ ሆኖ
  rationale: ἐν የሚያመለክተውን የሁኔታ ወይም የአማካይነት ትርጉም ሳይወስን በአማርኛ ተፈጥሯዊ ሁኔታ ይገልጣል፤ አውዱ መንፈስ ቅዱስን እንደሚያመለክት ያጠናክራል።
- source_word: καλεῖ αὐτὸν κύριον
  choice: ‘ጌታ’ ብሎ ይጠራዋል
  rationale: κύριος በመዝሙር ጥቅሱ ላይ እንደ ማዕረግ የቀረበ ስለሆነ ‘ጌታ’ የቃሉንና የክርክሩን ክብደት ይጠብቃል።
- source_word: λέγων
  choice: እንዲህም ይላል፦
  rationale: ተከትሎ ወደሚመጣው ቀጥተኛ ጥቅስ በግልጽና ተፈጥሯዊ አማርኛ ያሸጋግራል።
theological_decisions:
- issue: በἐν πνεύματι ውስጥ ‘መንፈስ’ የሚያመለክተው
  choice: መንፈስ ቅዱስ
  alternative: የዳዊት የራሱ መንፈስ ወይም መንፈሳዊ ሁኔታ
  rationale: ኢየሱስ ክርክሩን በመንፈስ በተነገረ የቅዱስ መጽሐፍ ቃል ላይ ያቆማል፤ ሆኖም የግሪኩ ሐረግ የሁኔታና የአማካይነት ጥላዎችን ስለሚፈቅድ ይህ በማስታወሻ ተጠብቋል።
- issue: κύριος የሚለው ማዕረግ
  choice: ጌታ
  alternative: አለቃ
  rationale: በመዝሙር 110 ጥቅስ እና በመሲሐዊው ጥያቄ አውድ ‘ጌታ’ የማዕረጉን ክብደትና የጽሑፉን ትስስር ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የጥያቄው ቅደም ተከተል ለአማርኛ ተፈጥሯዊነት ተስተካክሏል፤ የግሪኩ የሁኔታ/የአማካይነት አሻሚነት በማስታወሻ ተጠብቋል።
