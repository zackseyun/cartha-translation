  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀Εἶπεν κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ⸀ὑποκάτω τῶν ποδῶν σου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/044.yaml
  text: The Lord said to my Lord[a], ‘Sit at my right hand until I put your enemies under your feet’?”
translation:
  language: am
  text: “ጌታ ለጌታዬ፣ ‘ጠላቶችህን ከእግሮችህ በታች[a] እስካደርግ ድረስ በቀኝ በኩሌ ተቀመጥ’ አለው” ብሎ አይደለምን?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ የመዝሙር 110፥1ን የዕብራይስጥ ፈሊጥ በመከተል፣ “ጠላቶችህን ለእግሮችህ መረገጫ እስካደርግ ድረስ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: ጌታ
  rationale: በግሪክ ጥቅሱ ሁለቱም ተጠቃሾች κύριος በሚለው አንድ ማዕረግ ተጠርተዋል፤ ‘ጌታ’ ይህን የቃላት መመሳሰል ይጠብቃል።
- source_word: τῷ κυρίῳ μου
  choice: ለጌታዬ
  rationale: የዳቲቭ ቅርጹን እንደ ንግግሩ ተቀባይ ያሳያል፤ μου የሚያሳየውንም የግል ግንኙነት በ‘-ዬ’ ይጠብቃል።
- source_word: Κάθου
  choice: ተቀመጥ
  rationale: ቀጥተኛ ትእዛዝ ሲሆን በዙፋንና በክብር አውድ ውስጥ ተፈጥሯዊ አማርኛ ነው።
- source_word: ἐκ δεξιῶν μου
  choice: በቀኜ
  rationale: በቀኝ በኩል ያለውን የክብርና የሥልጣን ቦታ በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἕως ἂν θῶ
  choice: እስካደርግ ድረስ
  rationale: ἕως ἂν ከአኦሪስት ሰብጅንክቲቭ ጋር ያለውን ወደፊት የሚፈጸም ድርጊት በግልጽ ያሳያል።
- source_word: τοὺς ἐχθρούς σου
  choice: ጠላቶችህን
  rationale: መደበኛ፣ ግልጽና የዘመኑ አማርኛ አቻ ነው።
- source_word: ὑποκάτω τῶν ποδῶν σου
  choice: ከእግሮችህ በታች
  rationale: የማቴዎስን ግሪክ አገላለጽ በቀጥታ ይጠብቃል፤ የዕብራይስጡ ‘የእግር መረገጫ’ ምስል በማስታወሻ ቀርቧል።
theological_decisions:
- issue: በመዝሙር 110፥1 ጥቅስ ውስጥ ሁለቱን κύριος መተርጎም
  choice: ጌታ ለጌታዬ
  alternative: እግዚአብሔር ለጌታዬ / ጌታ ለገዢዬ
  rationale: የግሪክ ጽሑፉ ለሁለቱም ተጠቃሾች አንድን κύριος ይጠቀማል። ‘ጌታ ለጌታዬ’ ይህን እኩል ማዕረግ ሳያጠፋ በ‘-ዬ’ የሁለተኛውን ግንኙነት ይለያል፤ ‘እግዚአብሔር’ የመዝሙሩን የዕብራይስጥ መለኮታዊ ስም ይገልጣል፣ ግን በማቴዎስ ግሪክ ላይ የሌለ የቃል ልዩነት ያስገባል።
- issue: ጠላቶችን ከእግር በታች ማድረግ የሚለው ምስል
  choice: ከእግሮችህ በታች እስካደርግ
  alternative: ጠላቶችህን ለእግሮችህ መረገጫ እስካደርግ
  rationale: የማቴዎስ ግሪክ ὑποκάτω τῶν ποδῶν σου በቀጥታ ‘ከእግሮችህ በታች’ ይላል። ‘የእግር መረገጫ’ የመዝሙር 110፥1 ዕብራይስጥ ፈሊጥን ያንጸባርቃልና እንደ አማራጭ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና በቀላሉ የሚገባ አማርኛ ተጠቅሟል። የጥቅሱ የንግግር ቅርጽና የመጨረሻው የኢየሱስ ጥያቄ ተጠብቀዋል፤ [a] ምልክቱ በዋናው ጽሑፍ ውስጥ ተካትቷል።
