  verdict: revise
  source_fidelity: The draft accurately preserves the two occurrences of κύριος as ጌታ and ጌታዬ, the imperative, the future-oriented ‘until,’ and the direct image ‘under your feet.’ However, the outer quotation and question construction is punctuated and framed awkwardly in Amharic, and the footnote marker should directly follow the phrase to which the alternative pertains.
  naturalness: ‘በቀኜ’ is understandable but less idiomatic and slightly less explicit than ‘በቀኝ በኩሌ’ for the enthronement expression. Recasting the whole Psalm citation as the content of Jesus’ question gives a natural modern Amharic sentence.
  terminology: ጌታ / ጌታዬ appropriately retains the Greek repetition and relational distinction without importing the Hebrew divine name into Matthew’s Greek wording. ‘ከእግሮችህ በታች’ faithfully renders ὑποκάτω τῶν ποδῶν σου. The alternative ‘መረገጫ’ is appropriately confined to the note.
  issues:
  - severity: medium
    issue: The quotation nesting and final interrogative framing are awkward.
    rationale: The draft closes the inner command, adds ‘አለው፤’, and then appends ‘ብሎ አይደለምን?’ outside an incompletely framed citation. The Greek is a cited declaration ending in a question, which is more naturally rendered by enclosing the complete cited declaration before ‘ብሎ አይደለምን?’
  - severity: low
    issue: The footnote anchor is detached from its lexical referent.
    rationale: The note supplies an alternative for ‘ከእግሮችህ በታች’; its marker should immediately follow that phrase rather than the completed quotation.
  - severity: low
    issue: ‘በቀኜ’ is somewhat compressed for the source idiom.
    rationale: ‘በቀኝ በኩሌ’ is natural modern Amharic and clearly expresses the locative relationship in ἐκ δεξιῶν μου.
