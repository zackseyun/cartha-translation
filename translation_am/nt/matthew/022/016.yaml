review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the historical present, the sending of the disciples with the Herodians, the address “Teacher,” and the expressions “the way of God” and “in truth.” The final Greek idiom means that Jesus does not show favoritism based on persons/status. The main-text literalism “የሰዎችን ፊት አትመለከትም” is intelligible but is not natural Amharic and can be understood merely as not looking at people’s faces.
  naturalness: Most of the wording is modern, clear, and suitably respectful. Rendering the final idiom directly as “ለሰዎች አታዳላም” is substantially more idiomatic in modern standard Amharic. The footnote can retain the literal Greek imagery and alternative nuance.
  terminology: “ደቀ መዛሙርታቸውን,” “ሄሮድሳውያን,” “መምህር ሆይ,” “እግዚአብሔር,” and “በእውነት” are appropriate. “ስለ ማንም ግድ የለህም” is formally close but can wrongly suggest general indifference; its explanatory note appropriately limits it to freedom from human influence. Correct the spelling “ተጽዕኖ.”
  issues:
  - severity: medium
    issue: The main rendering of οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων is overly literal and unnatural in Amharic.
    rationale: The Greek is an idiom for impartiality, not a statement about physically looking at faces. “ለሰዎች አታዳላም” communicates the source sense naturally; the literal image can be preserved in a footnote.
  - severity: low
    issue: Footnote a contains a spelling error.
    rationale: Modern standard spelling is “ተጽዕኖ,” not “ተጽእኖ.”
