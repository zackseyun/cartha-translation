  text: And they send to him their disciples along with the Herodians[a], saying, “Teacher, we know that you are true and teach the way of God in truth, and you do not care about anyone[b], for you do not look at the face of men.”
translation:
  language: am
  text: እነርሱም ደቀ መዛሙርታቸውን ከሄሮድሳውያን ጋር ወደ እርሱ ይልካሉ፤ እንዲህም ይሉታል፦ “መምህር ሆይ፣ እውነተኛ እንደሆንክና የእግዚአብሔርን መንገድ በእውነት እንደምታስተምር እናውቃለን። ስለ ማንም ግድ የለህም[a]፤ ለሰዎችም አታዳላም[b]።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይህ አገላለጽ ለሰዎች ግድ እንደማይሰጠው ሳይሆን፣ በማንም ማዕረግ፣ ሥልጣን ወይም አስተያየት ተጽዕኖ እንደማይደርስበት ያመለክታል።
    reason: lexical_alternative
  - marker: b
