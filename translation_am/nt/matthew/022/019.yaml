lexical_decisions:
- source_word: ἐπιδείξατέ
  choice: አሳዩኝ
  rationale: የብዙ ሰዎችን የሚያመለክተውን ትእዛዝና ለእይታ የማቅረብን ፍቺ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: νόμισμα
  choice: ሳንቲም
  rationale: በዝውውር ላይ ያለን የብረት ገንዘብ በግልጽና በዘመናዊ አማርኛ ይገልጻል፤ ቀጣዩ ሐረግም ሳንቲሙ ዲናር እንደሆነ ይለያል።
- source_word: τοῦ κήνσου
  choice: የግብሩን
  rationale: በዐውዱ የተጠቀሰውን የሮማ ግብር በአጭርና ተፈጥሯዊ አገላለጽ ያቀርባል፤ የግለሰብ ወይም የሕዝብ ቆጠራ ግብር የሚለውን የተወሰነ ፍቺ በዋናው ጽሑፍ አይጭንም።
- source_word: προσήνεγκαν
  choice: አመጡለት
  rationale: እቃውን ወደ እርሱ እንዳቀረቡ በተፈጥሯዊ የትረካ አማርኛ ይገልጻል።
- source_word: δηνάριον
  choice: አንድ ዲናር
  rationale: የታሪካዊውን የሮማ ሳንቲም ስም በተጻፈ ድምፀ ተውሶ ይጠብቃል፤ ‘አንድ’ ደግሞ ነጠላ ያልተወሰነውን አገላለጽ በአማርኛ ያሳያል።
