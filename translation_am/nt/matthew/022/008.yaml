  text: Then he says to his servants[a], ‘The wedding feast is ready, but those who were invited were not worthy.’
translation:
  language: am
  text: ከዚያም ለአገልጋዮቹ እንዲህ ይላቸዋል፦ “የሰርጉ ግብዣ ዝግጁ ነው፤ የተጋበዙት[a] ግን ብቁ አልነበሩም።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የተጠሩት።” የግሪኩ ቃል በይበልጥ ቀጥተኛ ትርጉም እንዲህ ሊተረጎም ይችላል፤ በዚህ የግብዣ አውድ ግን ወደ ሰርጉ የተጋበዙትን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: ከዚያም
  rationale: የትረካውን ቅደም ተከተል በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: λέγει
  choice: ይላቸዋል
  rationale: የግሪኩን ታሪካዊ የአሁን ጊዜ በመጠበቅ ለትረካው ሕያውነት ይሰጣል፤ ተቀባዮቹም በግሱ ውስጥ በተፈጥሯዊ ሁኔታ ተገልጠዋል።
- source_word: δούλοις
  choice: ለአገልጋዮቹ
  rationale: በዚህ የንጉሥ ቤት ምሳሌያዊ አውድ ተግባራቸውን በግልጽና በክብር የሚያሳይ ተፈጥሯዊ አማርኛ ነው፤ δοῦλος የባርነት ሕጋዊ ሁኔታንም ሊያመለክት ቢችልም ይህ በቁጥሩ ዋና ነጥብ አይደለም።
- source_word: ὁ γάμος
  choice: የሰርጉ ግብዣ
  rationale: γάμος እዚህ የተዘጋጀውን የሰርግ ድግስ ወይም ግብዣ ያመለክታል፤ ይህ ምርጫ ከጋብቻው ሥነ ሥርዓት ይልቅ የግብዣውን አውድ ግልጽ ያደርጋል።
- source_word: ἕτοιμός ἐστιν
  choice: ዝግጁ ነው
  rationale: የምንጩን ቀላል ገላጭ አወቃቀር ቀጥተኛና ተፈጥሯዊ በሆነ አማርኛ ያስተላልፋል።
- source_word: οἱ δὲ κεκλημένοι
  choice: የተጋበዙት
  rationale: የκαλέω ፍጹም ተደራጊ አካል በዚህ የሰርግ ግብዣ አውድ አስቀድሞ የተጋበዙትን ሰዎች ያመለክታል፤ ቀጥተኛው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: οὐκ ἦσαν ἄξιοι
  choice: የሚገባቸው አልነበሩም
  rationale: የἄξιοςን ‘ብቁ፣ የሚገባው፣ የተገባ’ የሚል ግምገማዊ ኃይል ይጠብቃል፤ ለምን እንዳልተገባቸው በመጨመር አይተረጉምም።
theological_decisions:
- issue: κεκλημένοι የሚለው ቃል ከሥነ መለኮታዊ ‘ጥሪ’ ጋር ሊኖረው የሚችል ትርጉም
  choice: በዋናው ጽሑፍ “የተጋበዙት”
  alternative: “የተጠሩት”
  rationale: በቅርብ አውዱ የሰርግ ግብዣ እንግዶች በግልጽ ስለሚታሰቡ፣ “የተጋበዙት” ዋናውን ማኅበራዊ ትርጉም ያስተላልፋል። “የተጠሩት” የሚለው ቀጥተኛ አማራጭ ግን የቃሉን ሰፊ ትርጉምና ሊኖር የሚችለውን ሥነ መለኮታዊ ድምፀት ሳይጠፋ በእግር ማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የግሪኩ ታሪካዊ የአሁን ጊዜ ተጠብቋል፤ የμὲν…δὲ ንጽጽር በ“ግን” ተገልጧል።
