review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys τότε, δούλοις, γάμος as a wedding feast, ἕτοιμός ἐστιν, and κεκλημένοι in its banquet-context sense. However, “የሚገባቸው አልነበሩም” does not idiomatically express οὐκ ἦσαν ἄξιοι (“were not worthy/fit”) and is grammatically and semantically unclear. The placement of the reporting verb after the entire quotation is also markedly unnatural for modern standard Amharic.
  naturalness: 'A finite reporting clause should naturally introduce the direct speech: “እንዲህ ይላቸዋል፦”. “ብቁ አልነበሩም” is a clear, natural rendering of the evaluative predicate without specifying why they were unworthy.'
  terminology: “አገልጋዮቹ,” “የሰርጉ ግብዣ,” and “የተጋበዙት” suit the register and context. The lexical footnote is retained, but its explanation is made idiomatic and avoids the opaque technical phrase “የግሪኩ አካል.”
  issues:
  - severity: medium
    issue: “የሚገባቸው አልነበሩም” for οὐκ ἦσαν ἄξιοι
    rationale: This construction does not mean “they were not worthy/fit”; it can suggest that something did not belong or suit them. “ብቁ አልነበሩም” directly conveys the source predicate and preserves its unspecified basis.
  - severity: medium
    issue: Reporting clause follows the complete direct quotation
    rationale: “... ይላቸዋል።” after the quotation is awkward and delays the speaker’s action unnaturally. Moving it before the quotation produces standard, clear Amharic while retaining the Greek historical present.
  - severity: low
    issue: Footnote wording “የግሪኩ አካል” is unclear
    rationale: The note can describe the lexical alternative plainly as “የግሪኩ ቃል,” preserving the intended explanation without unnecessary grammatical jargon.
  revised_text: ከዚያም ለአገልጋዮቹ እንዲህ ይላቸዋል፦ “የሰርጉ ግብዣ ዝግጁ ነው፤ የተጋበዙት[a] ግን ብቁ አልነበሩም።”
