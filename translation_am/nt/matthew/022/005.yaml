base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/005.yaml
  text: But they paid no attention and went away[a], one to his own field, another to his business.
translation:
  language: am
  text: እነርሱ ግን ግድ ሳይላቸው ሄዱ[a]፤ አንዱ ወደ ገዛ እርሻው፣ ሌላውም ወደ ንግድ ሥራው።
  philosophy: optimal-equivalence
  footnotes:
