    text: ወይም፣ “ቸል ብለው” ወይም “ሳይጨነቁበት።” በአውዱ ይህ የንጉሡን ግብዣ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμελήσαντες
  choice: ግድ ሳይሰጣቸው
  rationale: ይህ አገላለጽ ግብዣውን አለማስተዋላቸውንና ቸል ማለታቸውን በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል፤ በግሪኩ ያልተገለጸውን ቀጥተኛ ተሳቢ በዋናው ጽሑፍ አይጨምርም።
- source_word: ἀπῆλθον
  choice: ሄዱ
  rationale: ከጥሪው ተለይተው መሄዳቸውን በቀላልና ተፈጥሯዊ የትረካ ቋንቋ ይገልጣል።
- source_word: ὃς μὲν ... ὃς δὲ
  choice: አንዱ ... ሌላውም
  rationale: የግሪኩን ከፋፋይ ንጽጽር በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: εἰς τὸν ἴδιον ἀγρόν
  choice: ወደ ገዛ እርሻው
  rationale: ἀγρόςን ‘እርሻ’ በማለት በቀጥታ ያስተላልፋል፤ ገዛ የሚለውም ἴδιον የሚያሳየውን የግል ባለቤትነት ይጠብቃል።
- source_word: ἐπὶ τὴν ἐμπορίαν αὐτοῦ
  choice: ወደ ንግድ ሥራው
  rationale: ἐμπορία የንግድ ወይም የንግድ እንቅስቃሴ ትርጉም አለው፤ ‘ንግድ ሥራ’ ከሸቀጥ ይልቅ እንቅስቃሴውን በግልጽ ያሳያል።
