  text: καὶ λέγει αὐτῷ· Ἑταῖρε, πῶς εἰσῆλθες ὧδε μὴ ἔχων ἔνδυμα γάμου; ὁ δὲ ἐφιμώθη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/012.yaml
  text: And he says to him[a], ‘Friend, how did you come in here without a wedding garment?’ But he was speechless.
translation:
  language: am
  text: እርሱም፣ “ወዳጄ ሆይ፣ የሰርግ ልብስ ሳይኖርህ እንዴት ወደዚህ ገባህ?” አለው። እርሱ ግን መልስ አጣ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ይበልጥ ቃል በቃል፣ “ዝም ተሰኘ።” የግሪኩ ግስ “አፉ ተለጎመ” ማለትም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑταῖρε
  choice: ወዳጄ ሆይ
  rationale: በቀጥታ የሚቀርብ የአክብሮት አድራሻ ሲሆን፣ በዐውዱ ያለውን የወቀሳ ርቀትና ምፀት ያለ አላስፈላጊ ጠላትነት ይጠብቃል።
- source_word: πῶς
  choice: እንዴት
  rationale: ጥያቄው ስለ መግቢያው ሁኔታ ወይም መንገድ እንጂ ስለ ዓላማው አይደለም።
- source_word: εἰσῆλθες ὧδε
  choice: ወደዚህ ገባህ
  rationale: የተፈጸመውን የመግባት ድርጊት በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: μὴ ἔχων
  choice: ሳይኖርህ
  rationale: ልብሱ በሌለበት ሁኔታ መግባቱን የሚገልጠውን አሳታፊ ሐረግ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἔνδυμα γάμου
  choice: የሰርግ ልብስ
  rationale: ለሰርግ የሚሆንን ልብስ ያመለክታል፤ የልብሱን ዓይነት ከግሪኩ በላይ አይወስንም።
- source_word: ἐφιμώθη
  choice: ምንም መመለስ አልቻለም
  rationale: በዚህ ዐውድ ግለሰቡ ለጥያቄው መልስ ማቅረብ እንዳልቻለ በተፈጥሯዊ አማርኛ ይገልጣል፤ የግሪኩ ቃል ይበልጥ ቀጥተኛ አማራጮች በማስታወሻው ተጠብቀዋል።
theological_decisions:
- issue: አስተናጋጁ ተገቢውን ልብስ ያልለበሰውን እንግዳ የሚጠራበት ቃና
  choice: አክብሮት ያለው ነገር ግን ወቀሳን የሚያመለክት “ወዳጄ ሆይ”
  alternative: ይበልጥ ጠንካራ ወይም ንቀት ያለበት አጠራር
  rationale: ግሪኩ በግልጽ ጠላትነት ወይም በጥልቅ ወዳጅነት እንድንተረጉመው አያስገድድም፤ ይህ አተረጓጎም የትረካውን ውጥረት ይጠብቃል።
- issue: የἐφιμώθη አተረጓጎም
  choice: ውጤቱን የሚገልጥ “ምንም መመለስ አልቻለም”
  alternative: “ዝም ተደረገ” ወይም “አፉ ተለጎመ”
  rationale: ዋናው ጽሑፍ በዘመናዊ አማርኛ በቀላሉ ሊገባ የሚችል የዐውዱን ውጤት ያቀርባል፤ የግሪኩ ተገብሮአዊና ምስላዊ ኃይል ግን በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ወዳጄ ሆይ” የአድራሻውን ሥርዓታዊነት ይጠብቃል፤ “የሰርግ ልብስ” ደግሞ የልብሱን ዓይነት አያጠብብም።
