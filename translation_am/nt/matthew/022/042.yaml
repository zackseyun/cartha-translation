  text: λέγων· Τί ὑμῖν δοκεῖ περὶ τοῦ χριστοῦ; τίνος υἱός ἐστιν; λέγουσιν αὐτῷ· Τοῦ Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/042.yaml
  text: saying[a], “What do you think about the Messiah? Whose son is he?” They said to him, “David’s.”
translation:
  language: am
  text: እንዲህ ሲል፦ “ስለ መሲሑ[a] ምን ታስባላችሁ? የማን ልጅ ነው?” እነርሱም፣ “የዳዊት” አሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ክርስቶስ።” የግሪክ ማዕረግ Χριστός (ክርስቶስ) እዚህ በመሲሐዊ ትርጉሙ ጥቅም ላይ ውሏል።
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: እንዲህ ሲል
  rationale: የኢየሱስን ቀጥተኛ ንግግር የሚያስተዋውቀውን የአሁን ጊዜ አንቀጽ በተፈጥሯዊ የአማርኛ ትረካ ያቀርባል።
- source_word: Τί ὑμῖν δοκεῖ
  choice: ምን ይመስላችኋል?
  rationale: ስለ አድማጮቹ ፍርድ ወይም አስተያየት የሚጠይቀውን ሐረግ በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: περὶ τοῦ χριστοῦ
  choice: ስለ መሲሑ
  rationale: Χριστός በዚህ የአይሁድ መሲሐዊ ውይይት ውስጥ እንደ ማዕረግ ስለተጠቀሰ፣ ‘መሲሕ’ የሚለው ምርጫ የቃሉን ተግባር በግልጽ ያሳያል።
- source_word: τίνος υἱός ἐστιν
  choice: የማን ልጅ ነው?
  rationale: ጥያቄውን በቀጥታ ይጠብቃል፤ ‘ልጅ’ በዚህ አውድ የዘር ሐረግንና የንጉሣዊ ዘር ግንኙነትን ሊያመለክት ይችላል።
- source_word: λέγουσιν αὐτῷ
  choice: እነርሱም … አሉት
  rationale: የግሪኩን ታሪካዊ የአሁን ጊዜ በተፈጥሯዊ የአማርኛ አለፈ ጊዜ ትረካ ያቀርባል፤ αὐτῷ በ‘አሉት’ ውስጥ ተካትቷል።
- source_word: Τοῦ Δαυίδ
  choice: የዳዊት
  rationale: የግሪኩ መልስ ከጥያቄው ‘ልጅ’ የሚለውን ቃል በመገመት የቀረበ አጭር የባለቤትነት ሐረግ ነው፤ ‘የዳዊት’ ይህን ሆን ብሎ የተተወ ቃል ሳይሞላ ይጠብቃል።
theological_decisions:
- issue: የΧριστός አተረጓጎም
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: ቃሉ እዚህ እንደ ግለሰብ ስም ሳይሆን በመሲሐዊ የዘር ሐረግ ጥያቄ ውስጥ እንደ ማዕረግ ያገለግላል። አማራጩ በእግር ማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ አጭር መልስ እና የ‘ልጅ’ የዘር ሐረግ አሻሚነት ተጠብቀዋል።
