id: MAT.22.21
reference: Matthew 22:21
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: λέγουσιν ⸀αὐτῷ· Καίσαρος. τότε λέγει αὐτοῖς· Ἀπόδοτε οὖν τὰ Καίσαρος Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/021.yaml
  text: They said to him[a], “Caesar’s.” Then he said to them, “Therefore render to Caesar the things that are Caesar’s, and to God the things that are God’s.”
translation:
  language: am
  text: እነርሱም “የቄሳር ነው” አሉት። ከዚያም እርሱ “እንግዲህ የቄሳርን ለቄሳር፣ የእግዚአብሔርንም ለእግዚአብሔር መልሱ[a]” አላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ስጡ” ወይም “ክፈሉ።” የግሪኩ ግስ “መልሶ መስጠትን፣ መክፈልን ወይም የሚገባውን መስጠትን” ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν / λέγει
  choice: አሉት / አላቸው
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ አገላለጽ በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜ ተተርጉሟል።
- source_word: Καίσαρος
  choice: የቄሳር ነው
  rationale: በጥያቄው የተጠቆመውን ‘የማን ነው?’ የሚለውን ሙሉና ተፈጥሯዊ የአማርኛ መልስ ያቀርባል።
- source_word: τότε / οὖν
  choice: ከዚያም / እንግዲህ
  rationale: የመጀመሪያው ቃል የክስተቱን ቅደም ተከተል፣ ሁለተኛው ደግሞ ከቀደመው መልስ የሚነሳውን ድምዳሜ ያሳያል።
- source_word: Ἀπόδοτε
  choice: ስጡ
  rationale: አጭር፣ ተፈጥሯዊና ሁለቱንም ግዴታዎች በአንድ ዓይነት የሚገልጽ ምርጫ ነው፤ በግሪኩ ያለው ‘መልሶ መስጠት/መክፈል’ ስፋት በማስታወሻ ተጠብቋል።
- source_word: τὰ Καίσαρος … τὰ τοῦ θεοῦ
  choice: የቄሳርን … የእግዚአብሔርን
  rationale: የግሪኩን ትይዩ አወቃቀርና የባለቤትነት ሐሳብ በአጭር የአማርኛ አገላለጽ ይጠብቃል።
- source_word: θεοῦ / τῷ θεῷ
  choice: የእግዚአብሔር / ለእግዚአብሔር
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ ንግግር ለአንዱ አምላክ የተለመደና የተከበረ ስያሜ ነው።
theological_decisions:
- issue: ለሲቪላዊ ሥልጣንና ለእግዚአብሔር ስለሚገባው ግዴታ የትእዛዙ ወሰን
  choice: ለቄሳርና ለእግዚአብሔር የሚገባውን የሚለየው ትይዩ ትእዛዝ ሳይሰፋ ተጠብቋል።
  alternative: ንግግሩን በግብር ክፍያ ብቻ መገደብ፣ ወይም ለመንግሥታዊ ሥልጣን ፍጹም መታዘዝን እንደሚያጸድቅ ማስፋት።
  rationale: ግሪኩ የሲቪላዊ ግዴታንና የእግዚአብሔርን የበላይ ጥያቄ በውጥረት ውስጥ ያስቀምጣል፤ ትርጉሙ ይህን ከኋለኛ የፖለቲካ ወይም የሃይማኖት ሥርዓት ጋር ሳያዋህድ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩ አጭር ምላሽና የመጨረሻው ንግግር ሚዛናዊ ትይዩነት ተጠብቀዋል።
