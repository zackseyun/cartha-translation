  text: ἦσαν δὲ παρ’ ἡμῖν ἑπτὰ ἀδελφοί· καὶ ὁ πρῶτος ⸀γήμας ἐτελεύτησεν, καὶ μὴ ἔχων σπέρμα ἀφῆκεν τὴν γυναῖκα αὐτοῦ τῷ ἀδελφῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/025.yaml
  text: There were seven brothers among us[a]. The first married and died, and having no offspring[b], he left his wife to his brother.
translation:
  language: am
  text: በመካከላችንም ሰባት ወንድማማቾች ነበሩ። የመጀመሪያው አግብቶ ሞተ፤ ዘር ሳይኖረው[a] ሚስቱን ለወንድሙ ተዋት[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ዘር» የግሪኩን σπέρμα ቃል በቃል ይከተላል፤ እዚህ ልጅን ወይም የዘር ሐረግን ማለት ነው።
    reason: lexical_alternative
  - marker: b
    text: ይህ አባባል የሞተው ሰው ወንድም መበለቲቷን አግብቶ ለሟቹ ዘር እንዲያስነሣ የሚጠበቅበትን ልማድ ያመለክታል፤ ዘዳግም 25፥5ን ይመልከቱ።
    reason: cultural_note
lexical_decisions:
- source_word: παρ’ ἡμῖν
  choice: በመካከላችን
  rationale: παρά ከዳቲቭ ጋር በዚህ አውድ በቡድኑ መካከል መኖርን ያመለክታል፤ «በመካከላችን» ተፈጥሯዊና ግልጽ ነው።
- source_word: ἑπτὰ ἀδελφοί
  choice: ሰባት ወንድማማቾች
  rationale: የሌዊራት ጋብቻ አውድ እነዚህ አንድ ቤተሰብ የሆኑ ወንድ ወንድማማቾች መሆናቸውን ያሳያል።
- source_word: ὁ πρῶτος
  choice: የመጀመሪያው
  rationale: πρῶτος እዚህ በቅደም ተከተል የመጀመሪያውን ያመለክታል፤ የግድ በዕድሜ ታላቁ ማለት አይደለም።
- source_word: γήμας
  choice: አግብቶ
  rationale: የአኦሪስት አሳታፊው ጋብቻው ከሞቱ በፊት መሆኑን ያሳያል፤ «አግብቶ» ቅደም ተከተሉን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐτελεύτησεν
  choice: ሞተ
  rationale: ቀጥተኛውን የሞት ትርጉም ያለ አላስፈላጊ ለዘብተኛ አገላለጽ ያቀርባል።
- source_word: μὴ ἔχων σπέρμα
  choice: ዘርም ስላልነበረው
  rationale: σπέρμα ቃል በቃል «ዘር» ሲሆን በዚህ የቤተሰብና የሕግ አውድ ልጅን ወይም ዘርን ያመለክታል። «ዘር» በአማርኛም ይህን የዘር ሐረግ ትርጉም ይሸከማል።
- source_word: ἀφῆκεν τὴν γυναῖκα αὐτοῦ
  choice: ሚስቱን … ተዋት
  rationale: ἀφίημι እዚህ በሞት ምክንያት ትቶ መሄድን እንጂ ፍቺን ወይም ሆን ብሎ መተውን አያመለክትም፤ ቀድሞ የተጠቀሰው «ሞተ» አገላለጹን ግልጽ ያደርገዋል።
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: ለወንድሙ
  rationale: ዳቲቩ ሚስቲቱ የተተወችለትን በሕይወት ያለ ወንድም ያመለክታል።
theological_decisions:
- issue: የሌዊራት ጋብቻን ዳራ በዋናው ጽሑፍ በግልጽ ማከል ወይም አለማከል
