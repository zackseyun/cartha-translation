  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። «የመጀመሪያው» ቅደም ተከተልን እንጂ የዕድሜ ታላቅነትን አይወስንም። የእንግሊዝኛው የማስታወሻ ምልክቶች ከማስታወሻዎቻቸው ጋር ያልተጣጣሙ ስለነበር፣ [a] ከ«ዘር» ጋር፣ [b] ደግሞ ከሌዊራት ልማድ አንድምታ ጋር እንዲጣጣሙ ተደርገዋል።
