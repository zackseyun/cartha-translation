  text: πολλοὶ γάρ εἰσιν κλητοὶ ὀλίγοι δὲ ἐκλεκτοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/014.yaml
  text: For many are called[b][a], but few are chosen.
translation:
  language: am
  text: ብዙዎች የተጠሩ[a] ናቸውና፤ የተመረጡ[b] ግን ጥቂቶች ናቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የተጋበዙ”፤ በዚህ የሰርግ ግብዣ አውድ ቃሉ የመጋበዝን ፍቺ ሊይዝ ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ምርጦች”።
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: ብዙዎች
  rationale: በስም ተግባር የቀረበውን ብዙ ሰዎች የሚለውን ፍቺ በተፈጥሯዊ አማርኛ ይገልጣል፤ ከ‘ጥቂቶች’ ጋር ያለውንም ተቃርኖ ይጠብቃል።
- source_word: γάρ
  choice: ናቸውና
  rationale: አባባሉ ለቀደመው ምሳሌ ማብራሪያ ወይም ምክንያት መሆኑን በተፈጥሯዊ የአማርኛ አያያዥ ያሳያል።
- source_word: εἰσιν
  choice: ናቸው
  rationale: የεἰμίን ቀላል የአሁን ጊዜ ቅርጽ በአማርኛ በቀጥታ ይወክላል።
- source_word: κλητοὶ
  choice: የተጠሩ
  rationale: ‘የተጠሩ’ የቃሉን ሰፊ ፍቺና ከἐκλεκτοί ጋር ያለውን ትይዩነት ይጠብቃል፤ በሰርግ ግብዣው አውድ ‘የተጋበዙ’ የሚለው ፍቺ በማስታወሻ ተጠብቋል።
- source_word: ὀλίγοι
  choice: ጥቂቶች
  rationale: የπολλοί ቀጥተኛ ተቃራኒ ሲሆን አጭሩንና ምሳሌያዊውን አነጋገር ይጠብቃል።
- source_word: δὲ
  choice: ግን
  rationale: በሁለቱ ሐረጎች መካከል ያለውን ግልጽ ተቃርኖ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐκλεκτοί
  choice: የተመረጡ
  rationale: የግሪኩን ግልጽ የቃል ፍቺ ይሰጣል፤ በኋላ የተደራጁ የሥነ መለኮት ሥርዓቶችን ሳያስገባ በአማርኛ ቀላልና ግልጽ ነው።
theological_decisions:
- issue: በምርጫና በጥሪ ክርክሮች ውስጥ የሚጠቀሰውን ἐκλεκτοί መተርጎም
  choice: የተመረጡ
  alternative: ምርጦች
  rationale: ‘የተመረጡ’ የግሪኩን ቀጥተኛ ፍቺ ይጠብቃል፣ ቃሉንም ስለ ባሕርይ ልቀት እንደሚናገር አያስመስልም፤ ስለ ምርጫው አድራጊ፣ መሠረት ወይም ሂደት ጽሑፉ ያልገለጠውን አይወስንም።
- issue: በግብዣ ምሳሌው አውድ κλητοίን መተርጎም
  choice: የተጠሩ
  alternative: የተጋበዙ
  rationale: ‘የተጋበዙ’ በቅርብ አውዱ ተገቢ ቢሆንም፣ ‘የተጠሩ’ የቃሉን ሰፊ ድምፀትና ከ‘የተመረጡ’ ጋር ያለውን ተቃርኖ ይጠብቃል። የግብዣው ፍቺ በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። አጭሩ ምሳሌያዊ ቅርጽ፣ የ‘ብዙዎች/ጥቂቶች’ ተቃርኖና የ‘የተጠሩ/የተመረጡ’ ትይዩነት ተጠብቀዋል።
