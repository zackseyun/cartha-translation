lexical_decisions:
- source_word: Δευτέρα
  choice: ሁለተኛም
  rationale: በግሪክ ጽሑፍ የወሰን መስጫ የሌለው ቅጽ ስለሆነ፣ ትእዛዙን እንደ ሁለተኛ እየጠቀሰ ያለውን የተራ ትርጉም ከመጠን በላይ ሳይወስን ያስተላልፋል።
- source_word: δὲ
