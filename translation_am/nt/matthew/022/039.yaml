  rationale: እዚህ δέ ጠንካራ ተቃርኖ ሳይሆን ንግግሩን የሚያስቀጥል ለስላሳ አገናኝ ነው፤ የአማርኛው -ም ቅጥያ ይህን በተፈጥሮ ያሳያል።
- source_word: ὁμοία αὐτῇ
  choice: እንደ እርሱ ነው
  rationale: ወደ ቀደመው ትእዛዝ የሚመለሰውን ንጽጽር በግልጽና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: Ἀγαπήσεις
  choice: ውደድ
  rationale: በብሉይ ኪዳን ጥቅስ ውስጥ የወደፊት አመልካች ቅርጽ የትእዛዝ ኃይል አለው፤ ቀጥተኛው የአማርኛ ትእዛዝ ይህን ኃይል በተፈጥሮ ይገልጣል።
- source_word: τὸν πλησίον σου
