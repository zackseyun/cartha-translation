base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/013.yaml
  text: Then the king said to the attendants[a], ‘Bind his feet and hands and throw him out into the outer darkness. In that place there will be weeping and gnashing of teeth.’
translation:
  language: am
  text: ከዚያም ንጉሡ አገልጋዮቹን፣ “እግሮቹንና እጆቹን አስራችሁ ወደ ውጫዊው ጨለማ ጣሉት። በዚያ ልቅሶና ጥርስ ማፋጨት ይሆናል” አላቸው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ «እጆቹንና እግሮቹን አስራችሁ ወደ ውጭ ያለው ጨለማ አውጥታችሁ ጣሉት።»
    reason: lexical_alternative
