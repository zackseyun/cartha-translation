  text: The kingdom of heaven was compared to a king who gave a wedding feast for his son[a][b].
translation:
  language: am
  text: የሰማያት መንግሥት ለልጁ የሰርግ ድግስ ያዘጋጀ ንጉሥ ጋር ተመሰለ[a][b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከ… ጋር ሊመሰል ይችላል።” የግሪኩ ግስ በቃል ቅርብ “ተመሰለ” ወይም “እንደ… ሆነ” ማለት ነው።
    reason: lexical_alternative
  - marker: b
    text: ግሪክኛው “ሰርጎች” የሚል ብዙ ቁጥር ነው፤ ይህም የሰርግ በዓላትን ወይም የሰርግ ድግስን የሚያመለክት አገላለጽ ነው።
    reason: lexical_alternative
lexical_decisions:
