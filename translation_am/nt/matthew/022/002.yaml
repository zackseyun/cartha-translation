- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: የሰማያት መንግሥት
  rationale: የማቴዎስን የተለመደ አገላለጽና የግሪኩን ብዙ ቁጥር ‘ሰማያት’ ይጠብቃል፤ ‘የእግዚአብሔር መንግሥት’ ብሎ አያስማማውም።
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: ንጉሥ
  rationale: በዚህ ሐረግ ἄνθρωπος ከβασιλεύς ጋር ተያይዞ የሰው ንጉሥን ያመለክታል፤ በአማርኛ ‘አንድ ሰው፣ ንጉሥ’ የሚለው ከባድና ያልተፈጥሯዊ ስለሆነ ‘ንጉሥ’ ብቻ በቂ ነው።
