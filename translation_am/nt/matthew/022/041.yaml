  text: While the Pharisees were gathered together, Jesus asked them,
translation:
  language: am
  text: ፈሪሳውያን ተሰብስበው ሳሉ፣ ኢየሱስ ጠየቃቸው፤
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνηγμένων
  choice: ተሰብስበው ሳሉ
  rationale: የግሪኩን ጄኒቲቭ አብሶሉት ሁኔታዊ ዳራ፣ ማለትም ጥያቄው ፈሪሳውያን ተሰብስበው ባሉበት ጊዜ መቅረቡን፣ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: δὲ
  choice: በተለየ ቃል አልተተረጎመም
  rationale: እዚህ ላይ ቃሉ ቀላል የትረካ ሽግግር ያመለክታል፤ በአማርኛ የንዑስ ሐረጉ አወቃቀር ሽግግሩን በቂ ስለሚያሳይ፣ «አሁን» ወይም «ግን» ማከል ያልተገባ ጊዜያዊ ወይም ተቃርኖአዊ ክብደት ሊሰጥ ይችላል።
- source_word: τῶν Φαρισαίων
  choice: ፈሪሳውያን
  rationale: የቡድኑን ስም በዘመናዊ መደበኛ አማርኛ በተለመደው መልኩ ያቀርባል።
- source_word: ἐπηρώτησεν
  choice: ጠየቃቸው
  rationale: በዚህ ዐውድ ግሱ ጥያቄ ማቅረብን ያመለክታል፤ «ጠየቀ» ተፈጥሯዊና ያልተጋነነ አቻ ነው። የተሳቢው ተውላጠ ስምም በ«-አቸው» ተካትቷል።
- source_word: αὐτοὺς
  choice: -አቸው
  rationale: ፈሪሳውያንን የሚያመለክተው የብዙ ቁጥር ተሳቢ ተውላጠ ስም በአማርኛው ግስ ውስጥ በተፈጥሯዊ ሁኔታ ተዋህዷል።
- source_word: ὁ Ἰησοῦς
  choice: ኢየሱስ
  rationale: የግለሰቡ ስም በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም በተለመደውና ለዘመናዊ አንባቢ ግልጽ በሆነው መልክ ቀርቧል።
