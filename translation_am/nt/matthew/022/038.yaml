lexical_decisions:
- source_word: αὕτη
  choice: ይህች
  rationale: ተውላጠ አመልካቹ በቁጥር 37 የተጠቀሰችውን ትእዛዝ ያመለክታል፤ ከሴት ፆታ ስም ‘ትእዛዝ’ ጋር በተፈጥሯዊ አማርኛ ይስማማል።
- source_word: ἐστὶν
  choice: ናት
  rationale: ቀላል የአሁን ጊዜ አያያዥ ግስ ሲሆን ከ‘ትእዛዝ’ ፆታ ጋር ተስማምቶ ተተርጉሟል።
- source_word: μεγάλη
  choice: ታላቂቱ
  rationale: በዚህ አውድ በአስፈላጊነትና በደረጃ ታላቅ መሆንን ይገልጣል፤ የላቀ ደረጃ አመልካች ‘ከሁሉ ታላቂ’ ተብሎ አልተጨመረም።
- source_word: πρώτη
  choice: የመጀመሪያይቱ
  rationale: በቅደም ተከተል ወይም በደረጃ የመጀመሪያ መሆንን በቀጥታ ያስተላልፋል።
- source_word: ἐντολή
  choice: ትእዛዝ
  rationale: በሕግና በቅዱሳት መጻሕፍት አውድ የተለመደ፣ ግልጽና ክብር ያለው ዘመናዊ የአማርኛ ቃል ነው።
theological_decisions:
- issue: μεγάλη እና πρώτη ትእዛዙን የሚገልጹበት ግንኙነት
  choice: ሁለቱንም ቅጽሎች በተቀናጀ መንገድ ‘ታላቂቱና የመጀመሪያይቱ ትእዛዝ’ ብሎ መተርጎም
  alternative: ‘ከሁሉ ታላቂቱና የመጀመሪያይቱ ትእዛዝ’ ወይም ‘ዋነኛይቱ ትእዛዝ’
  rationale: ግሪኩ ሁለት አዎንታዊ ቅጽሎችን በ‘እና’ አስተባብሮ ያቀርባል። ሁለቱንም በግልጽ ማቆየት የጽሑፉን አጽንዖትና በታላቅነትና በቀዳሚነት መካከል ያለውን ልዩነት ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለውን የመጽሐፍ ቅዱስ አማርኛ ይጠቀማል። ‘ታላቂቱና የመጀመሪያይቱ’ የሚለው አነጋገር በተለመደው አማርኛ ትንሽ መደበኛ ቢሆንም የግሪኩን ሁለት የተቀናጁ ቅጽሎች ለመጠበቅ ተመርጧል።
