  text: καὶ ἐξελθόντες οἱ δοῦλοι ἐκεῖνοι εἰς τὰς ὁδοὺς συνήγαγον πάντας ⸀οὓς εὗρον, πονηρούς τε καὶ ἀγαθούς· καὶ ἐπλήσθη ὁ ⸀γάμος ἀνακειμένων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/010.yaml
  text: And those servants went out into the roads and gathered everyone they found[a], both evil and good[c][b]; and the wedding hall was filled with guests reclining at the table.
translation:
  language: am
  text: እነዚያም ባሪያዎች ወደ መንገዶች ወጥተው ያገኟቸውን ሁሉ፣ ክፉዎችንም መልካሞችንም፣ ሰበሰቡ፤ የሰርጉም ድግስ[a] በማዕድ ዙሪያ ተደግፈው በተቀመጡ እንግዶች[b] ተሞላ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክኛው “ሰርጉ” ይላል። በዚህ ዐውድ የሰርግ ድግስን ወይም የዚያን የድግስ ስፍራ ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: በዚያ ዘመን በመደበኛ ድግሶች ላይ ሰዎች ለመብላት ተደግፈው ይቀመጡ ነበር።
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλοι
  choice: ባሪያዎች
  rationale: የቤቱ አገልጋዮች የንጉሡ ንብረትና በሥልጣኑ ሥር ያሉ መሆናቸውን ሳያለዝብ የጥንቱን ማኅበራዊ ሁኔታ ያሳያል።
- source_word: ὁδοὺς
  choice: መንገዶች
  rationale: የከተማ ጎዳናዎችን ብቻ ሳይወስን ሰዎች የሚገኙባቸውን የሕዝብ መተላለፊያዎች በስፋት ያመለክታል።
- source_word: συνήγαγον
  choice: ሰበሰቡ
  rationale: ሰዎችን ከተለያዩ ስፍራዎች አንድ ላይ የማምጣትን ድርጊት በቀጥታና በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: πάντας οὓς εὗρον
  choice: ያገኟቸውን ሁሉ
  rationale: የπάνταςን ሁሉን አቀፍ አጽንዖትና የዝምድና ሐረጉን በግልጽ አማርኛ ያቆያል።
- source_word: πονηρούς τε καὶ ἀγαθούς
  choice: ክፉዎችንም መልካሞችንም
  rationale: የግሪኩን የሥነ ምግባር ንፅፅር ይጠብቃል፤ ግብዣው ሳይለይ ሁለቱንም እንዳካተተ ያሳያል።
- source_word: γάμος
  choice: የሰርጉ አዳራሽ
  rationale: ቃሉ ሰርጉን ወይም የሰርጉን ድግስ ሊያመለክት ቢችልም፣ በተመጋቢዎች 'ተሞላ' መባሉ የድግሱን ስፍራ እንደሚያመለክት በዐውዱ ያሳያል።
- source_word: ἀνακειμένων
  choice: ለማዕድ በተቀመጡ እንግዶች
  rationale: በጥንቱ ልማድ ለመብላት ተደግፎ መቀመጥን ያመለክታል፤ በዘመናዊ አማርኛ የምግብ ዐውዱን በተፈጥሯዊ ሁኔታ ያስተላልፋል።
theological_decisions:
