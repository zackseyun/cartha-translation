  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἰσελθὼν δὲ ὁ βασιλεὺς θεάσασθαι τοὺς ἀνακειμένους εἶδεν ἐκεῖ ἄνθρωπον οὐκ ἐνδεδυμένον ἔνδυμα γάμου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/011.yaml
  text: But when the king came in to look at the guests reclining at the table[b][a], he saw there a man not dressed in wedding clothes.
translation:
  language: am
  text: ነገር ግን ንጉሡ በማዕድ የተቀመጡትን እንግዶች ለማየት በገባ ጊዜ፣[a] በዚያ የሰርግ ልብስ ያልለበሰ አንድ ሰው አየ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክኛው ቃል በድግስ ማዕድ ዙሪያ ተደግፈው የነበሩትን ያመለክታል፤ ይህም በዚያ ዘመን በመደበኛ ድግስ ላይ የተለመደውን አቀማመጥ ያንጸባርቃል።
    reason: cultural_note
lexical_decisions:
- source_word: εἰσελθὼν
  choice: በገባ ጊዜ
  rationale: የግሪኩ ያለፈ ጊዜ አጋዥ ግስ ከዋናው ድርጊት ቀድሞ የሆነውን የንጉሡን መግባት ያሳያል፤ ይህ አተረጓጎም በአማርኛ ተፈጥሯዊ ነው።
- source_word: δὲ
  choice: ነገር ግን
  rationale: በታሪኩ ውስጥ ትንሽ ንፅፅር ያለውን አዲስ ዙር ያስገባል።
- source_word: ὁ βασιλεὺς
  choice: ንጉሡ
  rationale: በንጉሣዊ ምሳሌው አውድ βασιλεύςን በቀጥታና በተለመደ መንገድ ይተረጉማል።
- source_word: θεάσασθαι
  choice: ለማየት
  rationale: የዓላማ የግስ ስም ሲሆን ንጉሡ እንግዶቹን ለመመልከት መግባቱን ያሳያል፤ ‘ለመመርመር’ ብሎ ከሚያጠናክረው ይልቅ የግሪኩን ስፋት ይጠብቃል።
- source_word: τοὺς ἀνακειμένους
  choice: በማዕድ የተቀመጡትን እንግዶች
  rationale: ቃሉ በጥንታዊ ድግስ ጊዜ በማዕድ ዙሪያ ተደግፎ መቀመጥን ያመለክታል። ዋናው ጽሑፍ በተፈጥሯዊ አማርኛ የድግሱን እንግዶች ያመለክታል፤ ባህላዊው አቀማመጥ በማስታወሻ ተገልጿል።
- source_word: εἶδεν
  choice: አየ
  rationale: የὁράωን ቀላል የትረካ ትርጉም በቀጥታ ይሰጣል።
- source_word: ἐκεῖ
  choice: በዚያ
  rationale: የቦታ ተውሳኩን በተፈጥሯዊ አማርኛ ይወክላል።
- source_word: ἄνθρωπον
  choice: አንድ ሰው
  rationale: በታሪኩ ያለውን ነጠላ ግለሰብ ያመለክታል። በአማርኛ ‘ሰው’ ለἄνθρωπος ቀጥተኛና የተለመደ አቻ ነው፤ ዐውደ ንባቡም የአንድን ወንድ ግለሰብ ምስል ይጠብቃል።
- source_word: οὐκ ἐνδεδυμένον
  choice: ያልለበሰ
  rationale: የፍጹም ጊዜ አጋዥ ግሱ በዚያን ጊዜ ልብሱን ለብሶ እንዳልነበረ የሚገልጸውን ሁኔታ ያሳያል።
- source_word: ἔνδυμα γάμου
  choice: የሰርግ ልብስ
  rationale: ነጠላውን ἔνδυμα ይጠብቃል፣ እንዲሁም ለሰርግ የሚሆን ወይም ከሰርግ ጋር የተያያዘ ልብስ የሚለውን የግሪኩን ትርጉም ያለ ትርጓሜያዊ ጭማሪ ያቀርባል።
theological_decisions:
- issue: የድግሱ አቀማመጥ ምስል
  choice: በዋናው ጽሑፍ ‘በማዕድ የተቀመጡትን እንግዶች’ ብሎ በተፈጥሯዊ አማርኛ ማቅረብ፣ ጥንታዊውን የመደገፍ ልማድ በማስታወሻ ማብራራት
  alternative: ‘ተደግፈው የተቀመጡትን’ ብሎ በዋናው ጽሑፍ በይበልጥ ቅርጻዊ ሁኔታ መተርጎም
  rationale: የጥንታዊውን ድግስ ባህል ሳያጠፋ ለዘመናዊ አማርኛ አንባቢ ትዕይንቱን ግልጽና ተፈጥሯዊ ያደርጋል።
- issue: የἄνθρωπον ጾታዊ አመልካችነት
  choice: ‘አንድ ሰው’ ብሎ መተርጎም
  alternative: ‘አንድ ወንድ’ ብሎ ጾታውን በግልጽ ማስገባት
  rationale: ἄνθρωπος በሰዋሰው ወንድ ቢሆንም መሠረታዊ ትርጉሙ ‘ሰው’ ነው። ዐውደ ንባቡ ነጠላ ግለሰብን ያሳያል፤ አማርኛው ‘ሰው’ ይህን በተፈጥሯዊነት ይጠብቃል እንጂ ምንጩ በቃሉ ያላጠናከረውን ጾታ አያጠናክርም።
- issue: የሰርግ ልብሱ ምሳሌያዊ ትርጉም
  choice: ‘የሰርግ ልብስ’ ብሎ ምስሉን እንዳለ ማቆየት
  alternative: ልብሱን ‘ተገቢ ልብስ’ ወይም አንድ የተወሰነ መንፈሳዊ ባሕርይ አድርጎ መግለጽ
  rationale: ቁጥሩ የልብሱን ምሳሌያዊ አቻ በግልጽ አይወስንም። ትርጉሙ ይህን ክፍትነትና ሥነ መለኮታዊ ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘በማዕድ የተቀመጡ’ የሚለው ተፈጥሯዊ አገላለጽ ሲሆን የግሪኩ ባህላዊ ዝርዝር በ[a] ማስታወሻ ተጠብቋል።
