base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/003.yaml
  text: And he sent his servants to call those who had been invited to the wedding feast[c][b][a], and they were unwilling to come.
translation:
  language: am
  text: እርሱም ወደ ሰርጉ ድግስ[c] የተጋበዙትን[b] እንዲጠሩ አገልጋዮቹን[a] ላከ፤ እነርሱ ግን ሊመጡ አልፈለጉም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ባሪያዎቹን።” የግሪኩ ቃል አገልጋዮችንም ሆነ ባሪያዎችን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: በቃል፣ “የተጠሩትን።” ግሪኩ “እንዲጠሩ” ከሚለው ጋር ተመሳሳይ የቃል ሥር ይደግማል፤ በዚህ አውድ ግን አስቀድሞ የተጋበዙትን ያመለክታል።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “ወደ ሰርጉ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: ላከ
  rationale: የግሪኩን ቀላል ያለፈ ጊዜ ተግባር በተፈጥሯዊ አማርኛ ይገልጻል፤ ከዚህ በላይ የሆነ የማሰማራት ወይም የመላክ አጽንዖት አይጨምርም።
- source_word: δούλους
  choice: አገልጋዮቹን
  rationale: ቃሉ ባሪያዎችንም ሆነ አገልጋዮችን ሊያመለክት ይችላል። በዚህ ምሳሌ ትኩረቱ በንጉሡ መልእክተኞችነታቸው ላይ ስለሆነ “አገልጋዮቹን” ተመርጧል፤ ሌላው ትርጉም በማስታወሻ ተጠብቋል።
- source_word: καλέσαι
  choice: እንዲጠሩ
  rationale: ከ“ላከ” በኋላ የዓላማ ግንኙነቱን ያሳያል፤ ቀድሞ ለተጋበዙት የመጡበት ጥሪ እንዲያደርሱ መላካቸውን ይገልጻል።
- source_word: κεκλημένους
  choice: የተጋበዙትን
  rationale: ፍጹም ተደራጊ አሳታፊው አስቀድሞ ጥሪ የደረሳቸውን ሰዎች ያመለክታል። “የተጋበዙትን” በድግስ አውድ ግልጽና ተፈጥሯዊ ነው፤ በግሪኩ ያለው የቃል ሥር ድግግሞሽ በማስታወሻ ተጠብቋል።
- source_word: εἰς τοὺς γάμους
  choice: ወደ ሰርጉ ድግስ
  rationale: በዚህ አውድ γάμοι የሰርጉን ክብረ በዓልና ድግስ ያመለክታል፤ “የሰርግ ድግስ” ከጋብቻው ሥነ ሥርዓት ብቻ ይልቅ ይህን ማኅበራዊ ሁኔታ በግልጽ ያስተላልፋል።
- source_word: οὐκ ἤθελον ἐλθεῖν
  choice: ሊመጡ አልፈለጉም
  rationale: የፈቃድን እጥረት በቀጥታ ይገልጻል። “ለመምጣት እምቢ አሉ” ከሚለው ይልቅ በግሪኩ ያለውን ትርጉም ሳያጠናክር ያቀርባል።
theological_decisions:
- issue: በምሳሌው ውስጥ δοῦλος የሚለውን ቃል መተርጎም
  choice: አገልጋዮቹን
  alternative: ባሪያዎቹን
  rationale: ጽሑፉ በንጉሡ ትእዛዝ ተልከው በሚሄዱት ወኪሎች ሚና ላይ ያተኩራል እንጂ በባርነት ማኅበራዊ ሁኔታቸው ላይ አይደለም። ስለዚህ “አገልጋዮቹን” በአውዱ ተስማሚ ሲሆን አማራጩ በግርጌ ማስታወሻ ተገልጿል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። “ሊመጡ አልፈለጉም” የፈቃድ ጉዳዩን ሳያጠናክር ይጠብቃል፤ ሥርዓተ ነጥቡም የሁለቱን አንቀጾች ተቃርኖ ግልጽ ያደርጋል።
