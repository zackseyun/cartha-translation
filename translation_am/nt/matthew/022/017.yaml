  text: Tell us, then, what do you think? Is it lawful to give the poll tax to Caesar, or not?
translation:
  language: am
  text: እንግዲህ፣ ንገረን፤ ምን ይመስልሃል? ለቄሳር የቆጠራ ግብር መስጠት ይፈቀዳል ወይስ አይፈቀድም?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί σοι δοκεῖ
  choice: ምን ይመስልሃል?
  rationale: የግለሰቡን አስተያየት የሚጠይቀውን የግሪክ አገላለጽ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἔξεστιν
  choice: ተፈቅዷል
  rationale: ጥያቄው አንድ ነገር በሕግ ወይም በሥልጣን የተፈቀደ መሆኑን ይጠይቃል፤ የትኛውን ሕግ እንደሚያመለክት ግን አይወስንም።
- source_word: δοῦναι
  choice: መስጠት
  rationale: የግሪኩን ‘መስጠት’ ቀጥተኛ ትርጉም ይጠብቃል፤ ‘መክፈል’ የሚለውን የተፈጥሮ የግብር አገላለጽ ሳይጨምር የምንጩን አጻጻፍ ያቆያል።
- source_word: κῆνσον
  choice: ግብር
  rationale: የሮምን የግለሰብ ቆጠራ ግብር የሚያመለክተውን ቃል ለተራው አንባቢ ግልጽ በሆነ ቃል ያቀርባል።
- source_word: Καίσαρι
  choice: ለቄሳር
  rationale: የሮም ገዢ ማዕረግን በአማርኛ የተለመደው ‘ቄሳር’ በሚለው ቃል ያቀርባል።
theological_decisions:
- issue: ἔξεστιν የሚያመለክተው የሕጋዊነት ወሰን
  choice: ተፈቅዷል
  alternative: በሕግ ይፈቀዳል
  rationale: ‘በሕግ’ ማለት የሮምን ሕግ ወይም የሙሴን ሕግ በግልጽ ሊያስመርጥ ይችላል፤ ምንጩ ያለውን ክፍት ትርጉም ለመጠበቅ ገለልተኛው አገላለጽ ተመርጧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለሕዝብ ግልጽ የሆነ አማርኛ። በσοι መሠረት ነጠላ ወንድ አድራሻ ‘ይመስልሃል’ ተጠብቋል፤ ἡμῖν ደግሞ ‘ንገረን’ ተብሎ ተላልፏል።
