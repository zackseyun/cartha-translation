  terminology: ‘ፈሪሳውያን’ is the established Amharic designation. ‘በንግግሩ’ is a natural contextual rendering of ἐν λόγῳ and retains the intended reference to something Jesus might say. The footnote gives a legitimate lexical-expansive alternative.
