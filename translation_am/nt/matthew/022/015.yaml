- source_word: παγιδεύσωσιν
  choice: ሊያጠምዱት
  rationale: በወጥመድ የመያዝን ምሳሌያዊ ሐሳብና የጠላትነት ዓላማውን በግልጽ ያስተላልፋል።
- source_word: ἐν λόγῳ
  choice: በንግግሩ
  rationale: λόγος እዚህ ንግግርን ወይም የተነገረ ቃልን ያመለክታል፤ ባለቤትነቱ ከዐውዱ የሚገባ ሲሆን፣ ይህ አተረጓጎም እርሱ በሚናገረው ነገር ሊይዙት መፈለጋቸውን ያሳያል።
theological_decisions:
- issue: በ συμβούλιον ἔλαβον ውስጥ የጠላትነት መጠን
  choice: ሐረጉን በአንጻራዊ ገለልተኛነት ‘ተማከሩ’ ብሎ መተርጎም፣ ክፉ ዓላማቸውንም ‘ሊያጠምዱት’ በሚለው የዓላማ ሐረግ ማሳየት
  alternative: ‘አሴሩ’ ወይም ‘ሴራ ጠነሰሱ’ ብሎ በትርጓሜ ማጠናከር
  rationale: ጥቅሱ የጠላትነት ዓላማን በግልጽ ቢያሳይም፣ ይህ በቀጥታ በπαγιδεύσωσιν ተገልጧል። ስለዚህ የምክር ሐረጉን ከምንጩ የበለጠ በጠንካራ ቃል አለመጫን ይመረጣል።
- issue: ἐν λόγῳ የሚፈቅደው የትርጉም ስፋት
  choice: ‘በንግግሩ’
  alternative: ‘በሚናገረው ነገር’ ወይም ‘በአንድ ቃል’
  rationale: የግሪኩ ሐረግ ንግግርን፣ የተነገረውን ነገር ወይም ቃልን ሊያመለክት ይችላል። ‘በንግግሩ’ አጭርና ተፈጥሯዊ ሲሆን አሻሚነቱንም በአንጻራዊነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ፈሊጥ በቃል በቃል ሳይጫን በተፈጥሯዊ የአማርኛ አገባብ ቀርቧል።
