lexical_decisions:
- source_word: Τότε
  choice: ከዚያም
  rationale: የትረካውን ተከታታይነት በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: πορευθέντες
  choice: ሄደው
  rationale: ከዋናው ግስ በፊት የተፈጸመውን እንቅስቃሴ የአማርኛን ተፈጥሯዊ የግስ ቅደም ተከተል ተከትሎ ይገልጣል።
- source_word: οἱ Φαρισαῖοι
  choice: ፈሪሳውያን
  rationale: የዚህን ሃይማኖታዊ ቡድን ስም በአማርኛ የተለመደውን አጻጻፍ ይጠቀማል።
- source_word: συμβούλιον ἔλαβον
  choice: ተማከሩ
  rationale: የግሪኩን ‘ምክር ያዙ’ የሚለውን ፈሊጣዊ ሐሳብ በተፈጥሯዊ አማርኛ ይገልጣል፤ የጥላቻው ዓላማ ደግሞ ‘ሊያጠምዱት’ በሚለው ይገለጣል።
- source_word: ὅπως
  choice: እንዴት … እንደሚችሉ
  rationale: የምክክራቸውን ይዘትና ዓላማ ከ‘ተማከሩ’ ጋር በሚስማማ የአማርኛ አገባብ ያቀርባል።
- source_word: αὐτὸν
  choice: -ት (ሊያጠምዱት)
