review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the conditional-inferential argument, David, the pronoun's contextual ambiguity, and κύριος as “ጌታ.” However, “ከጠራው” most naturally reads as a completed/past conditional, whereas καλεῖ is present, and “ይሆናል” normally has future force, whereas ἐστιν is present.
  naturalness: The wording is generally clear and suitably formal-modern. Recasting the conditional with “የሚጠራው ከሆነ” and using “ነው” makes the question idiomatic while accurately retaining the source's present-tense relation.
  terminology: “ዳዊት,” “ጌታ,” and “ልጁ” are standard and appropriate. The main text properly does not add “መሲሕ,” preserving the Greek pronoun and the rhetorical tension. The contextual expansion remains appropriate only in the footnote.
  issues:
  - severity: medium
    issue: Tense/aspect in the conditional clause
    rationale: “ከጠራው” is liable to be understood as “if he called,” while Greek καλεῖ is present (“calls”).
  - severity: medium
    issue: Future force in the predicate
    rationale: '“ልጁ ይሆናል?” means approximately “how will he become his son?” The Greek asks about an existing identity: “how is he his son?”'
  revised_text: እንግዲህ ዳዊት እርሱን “ጌታ” ብሎ የሚጠራው ከሆነ፣[a] እንዴት ልጁ ነው?
  revised_footnotes:
