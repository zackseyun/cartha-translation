id: MAT.22.45
reference: Matthew 22:45
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἰ οὖν Δαυὶδ καλεῖ αὐτὸν κύριον, πῶς υἱὸς αὐτοῦ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/045.yaml
  text: If[a], then, David calls him Lord, how is he his son?
translation:
  language: am
  text: እንግዲህ ዳዊት እርሱን “ጌታ” ብሎ የሚጠራው ከሆነ፣[a] እንዴት ልጁ ነው?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም አውዱን ይበልጥ ግልጽ በማድረግ፦ “እንግዲህ ዳዊት መሲሑን ‘ጌታ’ ብሎ የሚጠራው ከሆነ፣ መሲሑ እንዴት የዳዊት ልጅ ነው?”
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ οὖν
  choice: እንግዲህ … ከጠራው
  rationale: የ εἰ ሁኔታዊ ኃይልንና የ οὖν መደምደሚያዊ አገናኝነትን በተፈጥሯዊ ዘመናዊ አማርኛ ያቆያል።
- source_word: Δαυὶδ
  choice: ዳዊት
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የተለመደውን የስሙን ቅርጽ ይከተላል።
- source_word: καλεῖ αὐτὸν κύριον
  choice: እርሱን “ጌታ” ብሎ ከጠራው
  rationale: καλέω ያለውን ‘ብሎ ጠራ’ የሚል ትርጉም ይጠብቃል፤ κύριον ደግሞ የመዝሙር 110፥1ን አስተጋብኦና የክብር ማዕረጉን ለማቆየት “ጌታ” ተብሏል።
- source_word: πῶς
  choice: እንዴት
  rationale: የአመክንዮ ግንኙነቱን የሚጠይቀውን ቀጥተኛ ጥያቄ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: υἱὸς αὐτοῦ ἐστιν
  choice: ልጁ ይሆናል
  rationale: “ልጁ” የልጅነትንና የዳዊት ዘር መሆንን የሚያስተጋባውን ቃል ሳያሰፋ ይጠብቃል፤ የአማርኛው የአገላለጽ ቅርጽ የግሪኩን አሁናዊ የህልውና ጥያቄ በተፈጥሯዊ ሁኔታ ያስተላልፋል።
theological_decisions:
- issue: ዳዊት መሲሑን “ጌታ” ማለቱና መሲሑ የዳዊት ልጅ መሆኑ መካከል ያለው ክርስቶሳዊ ውጥረት
  choice: በዋናው ጽሑፍ “ጌታ” እና “ልጁ” የሚሉትን ቃላት ያለ ትርጓሜያዊ ማስፋት ማቆየት
  alternative: “ዳዊት መሲሑን ‘ጌታ’ ብሎ ከጠራው፣ መሲሑ እንዴት የዳዊት ልጅ ይሆናል?” ብሎ በግልጽ ማስፋት
  rationale: αὐτόν ተውላጠ ስም ከቀደመው አውድ የሚያመለክተውን በዋናው ጽሑፍ “መሲሕ” ብሎ መጨመር ከግሪኩ ግልጽ ቃላት ያልፋል። ይህ ምርጫ የዳዊት ልጅነትንና የጌትነትን ውጥረት ሳይፈታ ያቆያል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ። “እንግዲህ” የክርክሩን ተከታታይነት ያሳያል፤ የጥቅስ ምልክቶቹም “ጌታ” የሚለው ዳዊት የተጠቀመበት መጠሪያ መሆኑን ያጎላሉ።
