lexical_decisions:
- source_word: λέγει
  choice: አላቸው
  rationale: የግሪኩ የአሁን ጊዜ ግስ በትረካ ውስጥ ታሪካዊ የአሁን ጊዜ ነው፤ በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜ መጠቀም ተስማሚ ነው። የተነገረላቸውን αὐτοῖςም በግሱ ቅጥያ ያካትታል።
- source_word: Τίνος
  choice: የማን ነው?
  rationale: የባለቤትነትን ወይም የግንኙነትን ጥያቄ የሚያቀርበውን የግሪክ ዝርያ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: εἰκών
  choice: ምስል
  rationale: በሳንቲሙ ላይ ያለውን የሰው መልክ በትክክል የሚገልጽ እና ሰፊውን መጽሐፍ ቅዱሳዊ የቃሉን ግንኙነት የሚጠብቅ የተለመደ ቃል ነው።
- source_word: αὕτη
  choice: ይህ
  rationale: ተናጋሪው በፊቱ ያለውን በሳንቲሙ ላይ የሚታየውን ምስል እንደሚያመለክት ያሳያል።
- source_word: ἐπιγραφή
  choice: ጽሑፍ
  rationale: በሳንቲሙ ላይ የተጻፈውን ምልክት በግልጽና በተለመደ ዘመናዊ አማርኛ ይገልጻል፤ “የተቀረጸ ጽሑፍ” የሚለውንም ሐሳብ አያስቀርም።
- source_word: καὶ
  choice: እና / -ና
  rationale: ሁለቱን የሳንቲሙን ገጽታዎች፣ ምስሉንና ጽሑፉን፣ ያገናኛል።
