    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: በሰሙ ጊዜ
  rationale: የግሪኩን የአኦሪስት ቦዝ አንቀጽ ጊዜያዊ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል፤ የተሰማው ነገር ከአውዱ የሚታወቀው የኢየሱስ ቀዳሚ መልስ ነው።
- source_word: οἱ ὄχλοι
  choice: ሕዝቡ
  rationale: ግሪኩ ብዙ ቁጥር ቢሆንም፣ በዘመናዊ አማርኛ ‘ሕዝቡ’ ሰብሰብ ያለውን ብዙ ሰው በተፈጥሯዊ ሁኔታ ይገልጻል፤ ‘ሕዝቦቹ’ የተለያዩ ወገኖችን ሊያመለክት ይችላል።
- source_word: ἐξεπλήσσοντο
  choice: ተደነቁ
  rationale: በትምህርቱ የተነሣውን ጠንካራ የመደነቅ ምላሽ በግልጽና በተለመደ አማርኛ ይገልጻል።
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: በትምህርቱ
  rationale: ἐπί ከዳቲቭ ጋር የመደነቃቸውን መሠረት ወይም ምክንያት ያሳያል፤ ‘በትምህርቱ’ አጭር፣ ተፈጥሯዊና διδαχήን በትክክል የሚያስተላልፍ ነው።
- source_word: καὶ
  choice: ም
  rationale: ከቀደመው ትረካ ጋር ያለውን ቀላል አያያዥነት በአማርኛ በተፈጥሯዊ ቅጥያ ያሳያል።
