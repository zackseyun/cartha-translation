  text: ἐν ταύταις ταῖς δυσὶν ἐντολαῖς ὅλος ὁ νόμος ⸂κρέμαται καὶ οἱ προφῆται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/040.yaml
  text: On these two commandments hang the whole Law and the Prophets[a][b].
translation:
  language: am
  text: ሕጉ በሙሉ እና ነቢያት በእነዚህ ሁለት ትእዛዛት ላይ ተንጠልጥለዋል።[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በቀጥታ፣ «በእነዚህ ሁለት ትእዛዛት ውስጥ»። የግሪኩ መስተዋድድ ἐν «በ…ውስጥ» ማለት ነው፤ ነገር ግን ከ«ተንጠልጥለዋል» ከሚለው ምሳሌያዊ ግስ ጋር «በ…ላይ» የሚለው በአማርኛ ይበልጥ ተፈጥሯዊ ነው።
    reason: lexical_alternative
  - marker: b
    text: «ሕጉና ነቢያት» የሚለው አገላለጽ አጠቃላዩን የቅዱሳት መጻሕፍት ምስክርነት ያመለክታል፤ ይህም በእነዚህ ሁለት ትእዛዛት ላይ የተመሠረተና በእነርሱ የተጠቃለለ ነው።
    reason: cross_reference
lexical_decisions:
- source_word: ἐν ταύταις ταῖς δυσὶν ἐντολαῖς
  choice: በእነዚህ ሁለት ትእዛዛት ላይ
  rationale: ἐν በቀጥታ «በ…ውስጥ» ሊባል ቢችልም፣ ከκρέμαται የመንጠልጠል ምሳሌ ጋር በአማርኛ «በ…ላይ ተንጠልጥሏል» ማለት ተፈጥሯዊ ሲሆን የመመርኮዝን ሐሳብም ይጠብቃል።
- source_word: ὅλος ὁ νόμος
  choice: ሕጉ ሁሉ
  rationale: ὅλος ነጠላ ከሆነው νόμος ጋር በመሆን ሙሉነትን ያጎላል፤ «ሕጉ ሁሉ» ይህን አጠቃላይ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: κρέμαται
  choice: ተንጠልጥለዋል
  rationale: የግሱን ግልጽ የመንጠልጠል ምስል ይጠብቃል። የተዋሐደው ርዕሰ ነገር «ሕጉ ሁሉና ነቢያት» በአማርኛ ብዙ ቁጥር ግስን ይፈልጋል።
- source_word: καὶ οἱ προφῆται
  choice: እና ነቢያት
  rationale: «ሕጉና ነቢያት» የሚለውን የተመሰረተ ቅዱሳት መጻሕፍትን የሚያመለክት አገላለጽ ሳይተረጉም ያቆያል።
theological_decisions:
- issue: «ሕጉና ነቢያት» የሚለው አገላለጽ ትርጉም
  choice: ሁለቱ የፍቅር ትእዛዛት የሚደግፉትንና የሚያጠቃልሉትን አጠቃላይ የቅዱሳት መጻሕፍት ምስክርነት የሚያመለክት አገላለጽ
  alternative: የሕግና የነቢያትን ሥነ ምግባራዊ ትምህርት ብቻ የሚያመለክት ጠባብ ትርጉም
  rationale: በማቴዎስ «ሕጉና ነቢያት» ሥልጣን ላለው የቅዱሳት መጻሕፍት አካል ወይም ለአጠቃላይ ትምህርቱ የሚያገለግል የተለመደ አገላለጽ ነው። ትርጉሙ «መጽሐፍ ቅዱስ» ብሎ በመተካት ፈንታ ዋናውን አገላለጽ ያቆያል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የκρέμαται ሕያው ምሳሌ «ተንጠልጥለዋል» ተብሎ ተጠብቋል፤ «ሕጉና ነቢያት» የሚለውም ቀኖናዊ አገላለጽ ሳይብራራ በዋናው ጽሑፍ ቆይቷል።
