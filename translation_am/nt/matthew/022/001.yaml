  text: Καὶ ἀποκριθεὶς ὁ Ἰησοῦς πάλιν εἶπεν ⸂ἐν παραβολαῖς αὐτοῖς⸃ λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/001.yaml
  text: 'And Jesus answered and again spoke to them in parables[a], saying:'
translation:
  language: am
  text: ኢየሱስም መልሶ በምሳሌዎች እንደገና እንዲህ አላቸው፦[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “መልሶም እንደገና በምሳሌዎች እንዲህ አላቸው።” በግሪክኛው በቅርብ አውድ ቀጥተኛ ጥያቄ ባይጠቀስም፣ “መለሰ” የሚለው የተለመደ የትረካ ፈሊጥ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: -ም
  rationale: የግሪኩን ተራኪ አያያዥ በተፈጥሯዊ የአማርኛ ቅጥያ ያስተላልፋል።
- source_word: ἀποκριθεὶς
  choice: መልሶ
  rationale: ቀጥተኛ ጥያቄ ባይቀድምም በትረካ ውስጥ ‘መለሰ’ የሚለውን የተለመደ ፈሊጣዊ አጠቃቀም ይጠብቃል።
- source_word: ὁ Ἰησοῦς
  choice: ኢየሱስ
  rationale: በዘመናዊ መደበኛ አማርኛ የተለመደው የስሙ አጻጻፍ ነው።
- source_word: πάλιν
  choice: እንደገና
  rationale: በንግግሩ ቅደም ተከተል ድርጊቱ መደገሙን በግልጽ ያሳያል።
- source_word: εἶπεν ... αὐτοῖς λέγων
  choice: እንዲህ አላቸው
  rationale: የንግግሩን ተቀባዮችና ቀጥሎ የሚመጣውን ቃል በተፈጥሯዊ አማርኛ ያስተዋውቃል፤ የግሪኩን ‘አለ ... እያለ’ ድግግሞሽ አያስገድድም።
- source_word: ἐν παραβολαῖς
  choice: በምሳሌዎች
  rationale: ἐν እዚህ የንግግርን መንገድ ወይም መሣሪያ ያመለክታል፤ ‘በምሳሌዎች’ ይህን በአጭርና በተለመደ ቋንቋ ያስተላልፋል።
theological_decisions:
- issue: ቀጥተኛ ጥያቄ ሳይጠቀስ ‘ἀποκριθεὶς’ የሚለው መኖሩ
  choice: ‘መልሶ’ የሚለውን ጠብቆ ማስቀመጥ
  alternative: ‘እንደገና ተናገራቸው’ ብሎ ‘መለሰ’ን መተው
  rationale: ይህ ሥነ መለኮታዊ ማብራሪያ ሳይሆን የተለመደ የግሪክ ትረካ ፈሊጥ ነው። ቃሉን መጠበቅ የጽሑፉን የንግግር ቀጣይነት ሳይፈታ ያቆያል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘መልሶ’ የሚለው የምንጩን ፈሊጣዊ ቅርጽ ሲጠብቅ፣ ‘እንዲህ አላቸው’ ደግሞ ቀጣዩን ንግግር በተፈጥሯዊ አማርኛ ያስተዋውቃል።
