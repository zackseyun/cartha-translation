  text: ⸂ὁ δὲ βασιλεὺς⸃ ὠργίσθη, καὶ πέμψας τὰ στρατεύματα αὐτοῦ ἀπώλεσεν τοὺς φονεῖς ἐκείνους καὶ τὴν πόλιν αὐτῶν ἐνέπρησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/007.yaml
  text: But the king became angry, and he sent his troops, destroyed those murderers, and burned their city.
translation:
  language: am
  text: ነገር ግን ንጉሡ ተቆጣ፤ ሠራዊቱንም ልኮ እነዚያን ገዳዮች አጠፋ፣ ከተማቸውንም አቃጠለ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὠργίσθη
  choice: ተቆጣ
  rationale: የግሪኩን የኃይለኛ ቁጣ ትርጉም በተፈጥሯዊና በዘመናዊ አማርኛ ያስተላልፋል።
- source_word: τὰ στρατεύματα αὐτοῦ
  choice: ሠራዊቱን
  rationale: ብዙ ወታደራዊ ኃይሎችን የሚያመለክተውን ሐሳብ አማርኛ በተፈጥሮ በነጠላ የስብስብ ስም ይገልጻል።
- source_word: ἀπώλεσεν
  choice: አጠፋ
  rationale: በዚህ ወታደራዊ አውድ ያለውን መግደልና ማጥፋት በግልጽ ሁኔታ ይገልጻል።
- source_word: τοὺς φονεῖς ἐκείνους
  choice: እነዚያን ገዳዮች
  rationale: የምንጩን ጠቋሚ ቃልና የግድያ አድራጊነት ቀጥታ ይጠብቃል።
- source_word: ἐνέπρησεν
  choice: አቃጠለ
  rationale: ከተማይቱን በእሳት ማቃጠልን በቀጥታና በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: በምሳሌው ያለውን ፍርድ በታሪካዊ ክስተት ላይ ብቻ መወሰን
  choice: የምሳሌውን ድርጊት ብቻ በቀጥታ መተርጎም
  alternative: ንጉሡን፣ ሠራዊቱን ወይም ከተማዋን በትርጉሙ ውስጥ ከተወሰኑ ታሪካዊ ወይም ሥነ መለኮታዊ ተዋናዮች ጋር መለየት
  rationale: ጥቅሱ ራሱ ትርጓሜውን በግልጽ ስለማይወስን፣ የምሳሌው ውጥረትና ክፍትነት እንዲጠበቅ ተደርጓል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ። የግሪኩ ተከታታይ ድርጊቶች በአማርኛ ተፈጥሯዊ በሆነው የግስ ቅደም ተከተል ቀርበዋል፤ የግሪኩ የቅጂ ልዩነት በንጉሡ ሐረግ አቀማመጥ ላይ እንጂ በትርጉም ላይ ጉልህ ለውጥ አያመጣም።
