  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: περὶ δὲ τῆς ἀναστάσεως τῶν νεκρῶν οὐκ ἀνέγνωτε τὸ ῥηθὲν ὑμῖν ὑπὸ τοῦ θεοῦ λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/031.yaml
  text: Concerning the resurrection of the dead[a], have you not read what was spoken to you by God, saying,
translation:
  language: am
  text: ስለ ሙታን ትንሣኤ ግን፣ እግዚአብሔር እንዲህ ሲል ለእናንተ የተናገረውን አላነበባችሁምን?፦
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περὶ δὲ
  choice: ስለ …ስ
  rationale: περί የውይይቱን ርዕስ ያስተዋውቃል፤ δέ ደግሞ ወደ አዲስ ነጥብ መሸጋገርን ያመለክታል። በአማርኛ ‘ስለ …ስ’ ሁለቱንም በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: ἀναστάσεως τῶν νεκρῶν
  choice: የሙታን ትንሣኤ
  rationale: የግሪኩን የባለቤትነት አወቃቀር በቀጥታ ይጠብቃል፤ በዚህ አውድ የሞቱትን መነሣት ያመለክታል።
- source_word: οὐκ ἀνέγνωτε
  choice: አላነበባችሁምን?
  rationale: የኢየሱስን ተግሣጽ ያዘለ የአዎንታ መልስ የሚጠብቅ ጥያቄ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τὸ ῥηθὲν ὑμῖν ὑπὸ τοῦ θεοῦ
  choice: እግዚአብሔር የተናገራችሁን
  rationale: የመለኮታዊውን ተናጋሪነትና ንግግሩ ለአድማጮቹ መቅረቡን ይጠብቃል። ግሪኩ ተገብሮአዊ ቢሆንም፣ ይህ ንቁ አወቃቀር በአማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: λέγοντος
  choice: እንዲህ ይላል፤
  rationale: በሚቀጥለው ቁጥር ወዳለው ቀጥተኛ ጥቅስ በግልጽ ያሸጋግራል፤ የአሁን ጊዜውም የቃሉን ሕያው ንግግር ይጠብቃል።
theological_decisions:
- issue: መጽሐፍ ቅዱስ እንደ እግዚአብሔር ንግግርና ለአድማጮቹ የቀረበ መልእክት
  choice: እግዚአብሔር የተናገራችሁን
  alternative: ለእናንተ በእግዚአብሔር የተነገረውን
  rationale: ምንጩ እግዚአብሔርን የንግግሩ ፈጻሚ አድርጎ ያቀርባል፣ ንግግሩም ለኢየሱስ አድማጮች እንደተነገረ ያሳያል። ንቁው አወቃቀር ይህን ይዘት ሳይቀይር በተፈጥሯዊ አማርኛ ያቀርባል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። ‘ትንሣኤ’ የተለመደውን መጽሐፍ ቅዱሳዊ ቃል ይጠብቃል፤ አረፍተ ነገሩም በቀጣዩ ቁጥር ወዳለው ጥቅስ እንዲፈስ ተደርጓል።
