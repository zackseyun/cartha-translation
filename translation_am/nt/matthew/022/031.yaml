review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the topic of the resurrection of the dead, the rhetorical question, God as speaker, and the addressees. However, the final “እንዲህ ይላል፤” recasts λέγοντος (‘saying’) as an independent present-tense assertion (‘he says’), rather than retaining its direct connection to God’s speech that introduces the following quotation.
  naturalness: “ስለ …ስ” is understandable, but “ስለ … ግን” is the more natural standard-Amharic way to express the topic shift marked by περὶ δέ. Integrating “እንዲህ ሲል” into the clause is smoother and correctly leads into the quotation in the next verse.
  terminology: “የሙታን ትንሣኤ” is an appropriate, established biblical term. “እግዚአብሔር” suitably renders τοῦ θεοῦ. The active Amharic construction naturally preserves divine agency and the address to the hearers without adding doctrinal content.
  issues:
  - severity: low
    issue: The rendering of λέγοντος is structurally detached from the preceding divine speech.
    rationale: 'Greek λέγοντος is a participle dependent on ‘God’: ‘what was spoken to you by God, saying.’ “እንዲህ ይላል፤” makes it a separate present-tense statement. “እንዲህ ሲል” more closely and naturally preserves the quotation-introducing participial relation.'
  - severity: low
    issue: The discourse transition can be more idiomatic.
    rationale: “ስለ ሙታን ትንሣኤስ” is possible, but “ስለ ሙታን ትንሣኤ ግን” more clearly represents περὶ δέ in modern standard Amharic.
  revised_text: ስለ ሙታን ትንሣኤ ግን፣ እግዚአብሔር እንዲህ ሲል ለእናንተ የተናገረውን አላነበባችሁምን?፦
  revised_footnotes: []
  revision_rationale: The revision retains the draft’s sound terminology and its natural active expression of God’s agency, while rendering the Greek transition more idiomatically and keeping the quotation-introducing participle directly linked to God’s speech. The terminal colon appropriately signals that the quotation continues in Matthew 22:32.
