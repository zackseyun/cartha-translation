base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/032.yaml
  text: I am the God of Abraham and the God of Isaac and the God of Jacob. He is not the God of the dead[a], but of the living.
translation:
  language: am
  text: “እኔ የአብርሃም አምላክ፣ የይስሐቅም አምላክ፣ የያዕቆብም አምላክ ነኝ።” እርሱ የሙታን አምላክ ሳይሆን የሕያዋን አምላክ ነው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “አምላክ የሙታን አምላክ ሳይሆን የሕያዋን አምላክ ነው።” የግሪኩ ጽሑፍ በሁለተኛው ዓረፍተ ነገር “አምላክ” የሚለውን በግልጽ ይደግማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: እኔ ... ነኝ
  rationale: የግሪኩን የአሁን ጊዜ ራስን የመግለጥ ቅርጽ ያቆያል፤ በአማርኛም ተፈጥሯዊ አገባብ ነው።
- source_word: ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ
  choice: የአብርሃም አምላክ፣ የይስሐቅም አምላክ፣ የያዕቆብም አምላክ
  rationale: በሦስቱም ስሞች ጋር ‘አምላክ’ የሚለውን የግሪኩን ድግግሞሽና አጽንዖት ይጠብቃል።
- source_word: οὐκ ἔστιν ὁ θεὸς
  choice: እርሱ ... አምላክ ሳይሆን ... አምላክ ነው
  rationale: ‘እርሱ’ ከቀድሞው የተጠቀሰውን አምላክ በተፈጥሯዊ አማርኛ ያመለክታል፤ የአንቀጹን ተቃርኖም ግልጽ ያደርጋል።
- source_word: νεκρῶν
  choice: ሙታን
  rationale: በስም ተግባር የቆመውን ብዙ ቁጥር ቅጽ በአጭርና በተለመደ መንገድ ይተረጉማል።
- source_word: ζώντων
  choice: ሕያዋን
  rationale: ከ‘ሙታን’ ጋር ያለውን አጭርና ጠንካራ ተቃርኖ ይጠብቃል።
theological_decisions:
- issue: በኢየሱስ የትንሣኤ ክርክር ውስጥ አበው በአምላክ ፊት ሕያዋን መሆናቸው የሚያስከትለው ትርጉም
  choice: ንግግሩን በቀጥታ መተርጎም፣ ስለ ትንሣኤ ወይም ስለ መካከለኛው ሁኔታ ገላጭ የእምነት ትምህርት ሳይጨመር
  alternative: ‘እነርሱ አሁንም ለእርሱ ሕያዋን ናቸው’ ብሎ ትርጉሙን ማስፋት
  rationale: ጥቅሱ የኢየሱስን ክርክር ይደግፋል፣ ነገር ግን ትርጉሙ ከግሪኩ ቃላት በላይ የሆነ የአስተምህሮ ማብራሪያ ማስገባት የለበትም።
- issue: በሁለተኛው ዓረፍተ ነገር ὁ θεὸς የሚለውን ግልጽ ድግግሞሽ መያዝ
  choice: በዋናው ጽሑፍ ‘እርሱ’ በማለት ተፈጥሯዊ አማርኛን መጠቀም፣ ቀጥተኛውን ድግግሞሽ በእግር ማስታወሻ ማቅረብ
  alternative: ‘አምላክ የሙታን አምላክ ሳይሆን...’
  rationale: ግሪኩ ‘አምላክ’ የሚለውን በግልጽ ይደግማል፤ ዋናው ትርጉም ተፈጥሯዊነትን ሲጠብቅ እግር ማስታወሻው የምንጩን አወቃቀር ያሳያል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የሦስቱ አበው ስም ጋር ‘አምላክ’ መደገሙ የምንጩን የንግግር ክብደት ይጠብቃል።
