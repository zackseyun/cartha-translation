    text: ወይም ይበልጥ በቃል ትርጉሙ፣ “አፋቸውን እንደሸበበ።” የግሪኩ ግስ በቀጥታ የእንስሳን አፍ መሸበብን ሊያመለክት ይችላል፤ እዚህ ግን በክርክር ዝም ማሰኘትን በምሳሌ ይገልጻል።
