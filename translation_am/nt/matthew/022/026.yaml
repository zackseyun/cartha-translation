lexical_decisions:
- source_word: ὁμοίως
  choice: እንደዚሁም … እንዲሁ ሆነ
  rationale: ቀደም ባለው ወንድም ላይ የሆነው በቀጣዮቹም ላይ እንደተደገመ ያሳያል፤ በአማርኛ ዓረፍተ ነገሩን ተፈጥሯዊ ለማድረግ በዐውዱ የሚገባው ‘ሆነ’ ተጨምሯል።
- source_word: καὶ ὁ δεύτερος καὶ ὁ τρίτος
  choice: በሁለተኛውና በሦስተኛው ላይ
  rationale: መስተዋድዱ ተውሳካዊ ቅጽን ወደ ተፈጥሯዊ አማርኛ ይለውጣል፤ ‘ወንድም’ ከዐውዱ ቢታወቅም በግሪክ ጽሑፍ ስላልተገለጸ አልተጨመረም።
- source_word: ἕως τῶν ἑπτά
  choice: እስከ ሰባቱም ድረስ
  rationale: ድርጊቱ በሰባቱ ሁሉ ላይ እንደቀጠለ በተፈጥሯዊ አማርኛ ያሳያል፤ ‘-ም’ ሙሉውን ቡድን የሚያካትት ስሜት ይሰጣል።
