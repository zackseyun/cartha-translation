review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the principal elements accurately: the temporal setting, the Sadducees’ approach to Jesus, their denial of resurrection, and their questioning of him. However, ““ትንሣኤ የለም” እያሉም ጠየቁት” can read as though they uttered that sentence while asking their question, whereas λέγοντες naturally identifies their characteristic position. Recasting it as a modifying clause better represents the Greek participle.'
  naturalness: The revised sentence is smoother modern standard Amharic and avoids the slightly awkward sequence of approaching, then ‘saying,’ then questioning.
  terminology: ሰዱቃውያን and ትንሣኤ are established and appropriate biblical terms. No theological expansion is introduced.
  issues:
  - severity: medium
    issue: The participial clause is attached to the act of questioning in a way that may suggest a quoted utterance at that moment.
    rationale: λέγοντες μὴ εἶναι ἀνάστασιν functions as a descriptive identification of the Sadducees. In Amharic, ትንሣኤ የለም የሚሉ directly and naturally conveys that function.
  revised_text: በዚያን ቀን፣ ትንሣኤ የለም የሚሉ ሰዱቃውያን[a] ወደ እርሱ ቀርበው ጠየቁት።
