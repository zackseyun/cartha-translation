id: MAT.22.23
reference: Matthew 22:23
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῃ τῇ ἡμέρᾳ προσῆλθον αὐτῷ Σαδδουκαῖοι, ⸀λέγοντες μὴ εἶναι ἀνάστασιν, καὶ ἐπηρώτησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/023.yaml
  text: On that day Sadducees came to him[a], saying there is no resurrection, and they questioned him.
translation:
  language: am
  text: በዚያን ቀን፣ ትንሣኤ የለም የሚሉ ሰዱቃውያን[a] ወደ እርሱ ቀርበው ጠየቁት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “ሰዱቃውያን ወደ እርሱ ቀረቡ፤ ‘ትንሣኤ የለም’ እያሉም ጠየቁት።”
    reason: ይህ አማራጭ የግሪኩን λέγοντες ተሳቢ ቅርጽ ይበልጥ በቅርብ ያሳያል፤ ዋናው ንባብ ግን የሰዱቃውያንን የታወቀ አቋም በተፈጥሯዊ አማርኛ ይገልጻል።
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: በዚያን ቀን
  rationale: የግሪኩን የጊዜ ማመልከቻ በተፈጥሯዊና በዘመናዊ አማርኛ ያስተላልፋል።
- source_word: προσῆλθον αὐτῷ
  choice: ወደ እርሱ ቀረቡ
  rationale: προσέρχομαι በዚህ አውድ ‘ወደ አንድ ሰው መምጣት/መቅረብ’ ማለት ሲሆን፣ ይህ አገላለጽ የትረካውን ፍሰት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: Σαδδουκαῖοι
  choice: ሰዱቃውያን
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የዚህ የአይሁድ ቡድን ስም ይጠቀማል።
- source_word: λέγοντες μὴ εἶναι ἀνάστασιν
  choice: “ትንሣኤ የለም” እያሉም
  rationale: የአሁን ጊዜ ተሳቢውን ቅርጽና የክህደታቸውን ይዘት በቅርብ ይጠብቃል፤ ንግግሩ የሰዱቃውያን አቋም እንጂ የተራኪው ማረጋገጫ እንዳልሆነም ግልጽ ያደርጋል።
- source_word: ἀνάστασιν
  choice: ትንሣኤ
  rationale: በዚህ ሥነ መለኮታዊ አውድ ἀνάστασιςን ለመግለጽ የተለመደውና ትክክለኛው የአማርኛ ቃል ነው።
- source_word: ἐπηρώτησαν αὐτόν
  choice: ጠየቁት
  rationale: የመጠየቅን ድርጊት በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል፤ በአውዱ ያለውን ፈታኝ ጥያቄ ሳያጋንን ይተዋል።
theological_decisions:
- issue: የሰዱቃውያንን የትንሣኤ ክህደት መግለጽ
  choice: “ትንሣኤ የለም” እያሉም
  alternative: ትንሣኤ የለም የሚሉ ሰዱቃውያን
  rationale: ዋናው ንባብ የግሪኩን ተሳቢ አወቃቀር በቅርብ ይከተላል፤ አማራጩ ደግሞ ቃሉ የቡድኑን የታወቀ አቋም እንደሚገልጽ ይበልጥ ግልጽ ያደርጋል። ሁለቱም ንባቦች መግለጫውን የሰዱቃውያን አቋም አድርገው ያቆያሉ፣ በኋላ ያለውን ሥነ መለኮታዊ ክርክርም አስቀድመው አይፈቱም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ትንሣኤ” የተለመደውን መጽሐፍ ቅዱሳዊ ቃል ይጠብቃል፤ የአረፍተ ነገሩ አወቃቀር ግን ዘመናዊና ተፈጥሯዊ ነው።
