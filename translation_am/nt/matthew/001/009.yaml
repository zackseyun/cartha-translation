  text: Ὀζίας δὲ ἐγέννησεν τὸν Ἰωαθάμ, Ἰωαθὰμ δὲ ἐγέννησεν τὸν Ἀχάζ, Ἀχὰζ δὲ ἐγέννησεν τὸν Ἑζεκίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/009.yaml
  text: Uzziah fathered Jotham[a], and Jotham fathered Ahaz, and Ahaz fathered Hezekiah,
translation:
  language: am
  text: ዖዝያስም ኢዮአታምን ወለደ[a]፤ ኢዮአታምም አካዝን ወለደ፤ አካዝም ሕዝቅያስን ወለደ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ወለደ» የተተረጎመው የግሪኩ ἐγέννησεν ነው፤ በዚህ የዘር ሐረግ ውስጥ «አባት ሆነ» የሚል ፍቺ አለው።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀζίας
  choice: ዖዝያስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የሚታወቀውን የንጉሡን ስም ቅርጽ ይጠብቃል።
- source_word: δὲ
  choice: -ም
  rationale: በዘር ሐረጉ ተደጋጋሚ አወቃቀር ውስጥ ያለውን ቀላል አያያዥ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐγέννησεν
  choice: ወለደ
  rationale: በአማርኛ የዘር ሐረግ አገላለጽ ውስጥ የአባትነት ዝምድናን የሚገልጽ፣ አጭርና የተለመደ አቻ ቃል ነው፤ የግሪኩንም ተደጋጋሚ ሥነ ጽሑፋዊ ቅርጽ ይጠብቃል።
- source_word: Ἰωαθάμ
  choice: ኢዮአታም
  rationale: በአማርኛ የመጽሐፍ ቅዱስ ወግ የሚታወቀው የይሁዳ ንጉሥ ስም ነው።
- source_word: Ἀχάζ
  choice: አካዝ
  rationale: የግሪኩን የስም ቅርጽና የተለመደውን የአማርኛ መጽሐፍ ቅዱስ አጠራር ይከተላል።
- source_word: Ἑζεκίαν
  choice: ሕዝቅያስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አንባቢዎች ዘንድ የሚታወቀውን የይሁዳ ንጉሥ ስም ቅርጽ ይጠብቃል።
theological_decisions:
- issue: የγεννάω የዘር ሐረግ ኃይል
  choice: የአባትነት ተከታታይነቱን «ወለደ» በሚል ቀጥተኛ አገላለጽ ማቅረብ
  alternative: «ቅድመ አያት ሆነ» ወይም «አባት ሆነ»
  rationale: ማቴዎስ የተደጋገመውን የዘር ሐረግ ቀመር በቀጥታ ያቀርባል። «ወለደ» የምንጩን ግልጽ አገላለጽና ምት ይጠብቃል፤ ጥቅሱ ራሱ ያልገለጸውን ሰፊ የቅድመ አያትነት ትርጉም አያስገባም።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ ነው። በእያንዳንዱ ሐረግ የተጠቀሰው «-ም» የግሪኩን δὲ ቀላል የትረካ ቅጥያ በተፈጥሯዊ አማርኛ ያቀርባል፤ ሴሚኮሎኖቹም የተደጋጋሚውን ቀመር ክፍሎች በግልጽ ይለያሉ።
