id: MAT.1.3
reference: Matthew 1:3
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ἰούδας δὲ ἐγέννησεν τὸν Φαρὲς καὶ τὸν Ζάρα ἐκ τῆς Θαμάρ, Φαρὲς δὲ ἐγέννησεν τὸν Ἑσρώμ, Ἑσρὼμ δὲ ἐγέννησεν τὸν Ἀράμ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/003.yaml
  text: Judah fathered Perez and Zerah by Tamar[a], Perez fathered Hezron, and Hezron fathered Aram.
translation:
  language: am
  text: ይሁዳ ከትዕማር ፋሬስንና ዛራን ወለደ፤ ፋሬስ ኤስሮምን ወለደ፤ ኤስሮምም አራምን[a] ወለደ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ ትርጉሞች የተለየ የስም አጻጻፍ ወይም ወግ በመከተል እዚህ «ራም» ይላሉ፤ እዚህ የተከተልነው የግሪክ ጽሑፍ ግን «አራም» ይላል።
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰούδας
  choice: ይሁዳ
  rationale: በዚህ የትውልድ ሐረግ ውስጥ የሚጠቀሰውን የእስራኤል አባትና የነገድ ስም በአማርኛ የተለመደውን ቅርጽ ይጠብቃል።
- source_word: δὲ
  choice: ፤ / ም
  rationale: δέ እዚህ ጠንካራ ተቃርኖን ሳይሆን የትውልድ ሐረጉን የሚያያይዝ ለስላሳ አገናኝ ነው፤ በአማርኛ የሐረግ ቅደም ተከተል፣ በሰረዝ ነጥብና በመጨረሻው «ም» በተፈጥሯዊ ሁኔታ ተወክሏል።
- source_word: ἐγέννησεν
  choice: ወለደ
  rationale: በትውልድ ሐረግ አጠቃቀም የአባትነትንና የዘር መውረድን የሚገልጽ፣ በአማርኛ መጽሐፍ ቅዱሳዊ የዘር ሐረግ አጻጻፍ የተለመደና ግልጽ ግስ ነው።
- source_word: Φαρὲς
  choice: ፋሬስ
  rationale: ከዕብራይስጡ ፔሬጽ ጋር የሚዛመደውን ስም በአማርኛ መጽሐፍ ቅዱሳዊ ወግ የታወቀውን ቅርጽ ይጠቀማል።
- source_word: Ζάρα
  choice: ዛራ
  rationale: ከዕብራይስጡ ዜራሕ ጋር የሚዛመደው በአማርኛ የተለመደ የስሙ ቅርጽ ነው።
- source_word: ἐκ τῆς Θαμάρ
  choice: ከትዕማር
  rationale: ἐκ ከእናት ስም ጋር ሲመጣ የእናት ወገን ምንጭን ያመለክታል፤ «ከትዕማር» ይህን በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: Θαμάρ
  choice: ትዕማር
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ ወግ የታወቀው የስሙ ቅርጽ ነው።
- source_word: Ἑσρώμ
  choice: ኤስሮም
  rationale: ከዕብራይስጡ ሔጽሮን ጋር የሚዛመደውን ስም በአማርኛ አንባቢዎች ዘንድ በተለመደው መጽሐፍ ቅዱሳዊ ቅርጽ ያቀርባል።
- source_word: Ἀράμ
  choice: አራም
  rationale: የቀረበው የግሪክ ምንጭ Ἀράμ ብሎ ስለሚያነብ ዋናው ጽሑፍ ይህንኑ በቀጥታ ይከተላል፤ ከሌላ የትውልድ ሐረግ ወግ ጋር ለማስማማት «ራም» ተብሎ አልተቀየረም።
theological_decisions:
- issue: የመጨረሻውን ስም በተለመደው የብሉይ ኪዳን የትውልድ ሐረግ ቅርጽ ማስማማት ወይም የግሪክ ምንጩን መከተል
  choice: አራም
  alternative: ራም
  rationale: የቀረበው SBLGNT ጽሑፍ Ἀράμ ይላል። ስለዚህ የምንጭ ቋንቋውን ቅድሚያ በመስጠት «አራም» በዋናው ጽሑፍ ተቀምጧል፤ አንባቢዎች ሊያውቁት የሚችሉት «ራም» ግን በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለመደበኛ አማርኛ አንባቢ ቀላል የሆነ የትውልድ ሐረግ አጻጻፍ ተጠቅሟል። «ወለደ» በዚህ ዐውድ የዘር ሐረግን የሚገልጽ ባህላዊና ገና ሕያው አገላለጽ ነው።
