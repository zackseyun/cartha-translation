  text: Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰωσὴφ τὸν ἄνδρα Μαρίας, ἐξ ἧς ἐγεννήθη Ἰησοῦς ὁ λεγόμενος χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/016.yaml
  text: And Jacob fathered Joseph[a], the husband of Mary, from whom Jesus was born[b], who is called the Messiah.
translation:
  language: am
  text: ያዕቆብም የማርያምን ባል ዮሴፍን ወለደ፤ ከእርሷ መሲሕ የሚባለው ኢየሱስ ተወለደ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: ም
  rationale: በትውልድ ሐረጉ ውስጥ ቀጣዩን አባል በቀላሉ የሚያያይዝ አማርኛዊ አገናኝ ነው፤ የንፅፅር ክብደት አይጨምርም።
- source_word: ἐγέννησεν
  choice: ወለደ
  rationale: በአማርኛ የዘር ሐረግ አገላለጽ ለወንድ ወላጅነትና ለትውልድ ቅደም ተከተል የተለመደ እና አጭር ቃል ነው።
- source_word: ἄνδρα
  choice: ባል
  rationale: ከማርያም ጋር ያለው የባልነት ግንኙነት በዐውዱ ግልጽ ስለሆነ ‘ሰው’ ሳይሆን ‘ባል’ ተመርጧል።
- source_word: ἐξ ἧς
  choice: ከእርሷም
  rationale: የሴት ነጠላ አመልካች ቃሉ በተለይ ወደ ማርያም መመለሱንና ἐκ የሚያመለክተውን ምንጭ ይጠብቃል።
- source_word: ἐγεννήθη
  choice: ተወለደ
  rationale: ከቀደመው ንቁ ‘ወለደ’ ወደ ተደራጊ ቅርጽ የሚደረገውን ለውጥ ጠብቆ የኢየሱስን መወለድ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ὁ λεγόμενος
  choice: የሚባለው
  rationale: ለኢየሱስ የተሰጠውን መጠሪያ በቀጥታና ተፈጥሯዊ በሆነ ዘመናዊ አማርኛ ያሳያል።
- source_word: χριστός
  choice: መሲሕ
  rationale: እዚህ χριστός እንደ ግል ስም ሳይሆን እንደ ማዕረግ በመለያ ሐረግ ውስጥ ቀርቧል፤ ‘መሲሕ’ የቅቡዕነቱን ማዕረጋዊ ትርጉም ይጠብቃል።
theological_decisions:
- issue: χριστόςን በክርስቶሎጂያዊ መለያ ሐረግ መተርጎም
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: ὁ λεγόμενος χριστός የሚለው አገላለጽ χριστόςን እንደ ማዕረግ ያቀርባል፤ ‘መሲሕ’ ይህን ማዕረጋዊ ኃይል ያስቀራል።
- issue: ከዮሴፍ የዘር ሐረግ ወደ ኢየሱስ ልደት ያለው የሰዋስው ለውጥ
  choice: ያዕቆብ ዮሴፍን ‘ወለደ’፤ ኢየሱስ ግን ከማርያም ‘ተወለደ’
  alternative: ዮሴፍ ኢየሱስን ወለደ
  rationale: ግሪኩ ከንቁ ἐγέννησεν ወደ ተደራጊ ἐγεννήθη ይለወጣል፣ ἐξ ἧςም በግልጽ ወደ ማርያም ይመለሳል። ትርጉሙ ይህን ልዩነት ያለ ተጨማሪ ዶክትሪናዊ ማብራሪያ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ የአማርኛ የዘር ሐረግ አገላለጽ ተጠቅሟል። በግሪኩ ያለው ከንቁ ወደ ተደራጊ ግስ ለውጥና የሴት ነጠላ አመልካች በግልጽ ተጠብቀዋል።
