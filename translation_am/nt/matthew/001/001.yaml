  text: The book of the genealogy of Jesus the Messiah[a], the son of David[b], the son of Abraham.
translation:
  language: am
  text: የዳዊት ልጅና የአብርሃም ልጅ የሆነው ኢየሱስ መሲሑ የዘር ሐረግ መጽሐፍ።[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «የመነሻ መጽሐፍ» ወይም «የልደት መጽሐፍ» ተብሎም ሊተረጎም ይችላል። የግሪኩ ቃል ከዘር ሐረግ የሰፋ የመነሻ ወይም የልደት ትርጉም ሊኖረው ይችላል፤ ነገር ግን ቀጥሎ ካለው የዘር ዝርዝር ጋር «የዘር ሐረግ» ይበልጥ ይስማማል።
    reason: alternative_reading
  - marker: b
    text: ባህላዊ አተረጓጎም፦ «ኢየሱስ ክርስቶስ»። እዚህ «መሲሑ» የግሪኩን Χριστός ማዕረግ ይተረጉማል።
    reason: alternative_reading
lexical_decisions:
- source_word: Βίβλος
  choice: መጽሐፍ
  rationale: ቃሉ መጽሐፍን፣ ጥቅል መጽሐፍን ወይም የተጻፈ መዝገብን ሊያመለክት ይችላል፤ እዚህ እንደ ርእስ ስለሚሠራ፣ «መጽሐፍ» የጽሑፉን ክብርና ቅርጽ ይጠብቃል።
- source_word: γενέσεως
  choice: የትውልድ ሐረግ
  rationale: γένεσις መነሻን፣ ልደትን ወይም የዘር ሐረግን ሊያመለክት ይችላል። ቀጥሎ ካለው የዘር ዝርዝር አንጻር «የትውልድ ሐረግ» በዋናው ጽሑፍ ተመርጧል፤ ሰፊው የመነሻ/ልደት ትርጉም በማስታወሻ ተጠብቋል።
- source_word: Ἰησοῦ
  choice: ኢየሱስ
  rationale: በዘመናዊ መደበኛ አማርኛ የተለመደው የስሙ ቅርጽ ነው።
- source_word: χριστοῦ
  choice: መሲሑ
  rationale: Χριστός እዚህ የግል ስም ክፍል ብቻ ሳይሆን «የተቀባው» የሚለውን ንጉሣዊ ማዕረግ ያመለክታል፤ «መሲሑ» ይህን የማዕረግ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: υἱοῦ Δαυὶδ
  choice: የዳዊት ልጅ
  rationale: υἱός ቃል በቃል «ልጅ» ሲሆን፣ እዚህ ዘርንም ያመለክታል። «የዳዊት ልጅ» የዘር ግንኙነቱንና የመሲሕነት ማዕረጉን አብሮ ይጠብቃል።
- source_word: υἱοῦ Ἀβραάμ
  choice: የአብርሃም ልጅ
  rationale: ቃል በቃል ያለውን «ልጅ» በመጠበቅ የዘር ሐረጉንና ከአብርሃም ጋር ያለውን የቃል ኪዳን ትስስር ያሳያል።
theological_decisions:
- issue: የΧριστός አተረጓጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: ቃሉ በዚህ አውድ የኢየሱስን መሲሐዊ ማንነት የሚገልጽ ማዕረግ ነው። «መሲሑ» ይህን ትርጉም ግልጽ ያደርጋል፤ ባህላዊው «ክርስቶስ» በማስታወሻ ተጠብቋል።
- issue: በርእሱ ያለው የγενέσεως ትርጉም
  choice: የትውልድ ሐረግ
  alternative: መነሻ ወይም ልደት
  rationale: ቀጥሎ ያለው ክፍል የዘር ዝርዝር በመሆኑ «የትውልድ ሐረግ» ለዋናው ጽሑፍ ተመርጧል። ይሁን እንጂ የግሪኩ ቃል የመነሻ ወይም የልደት ሐሳብንም ሊያስተጋባ ስለሚችል ያ ትርጉም በማስታወሻ አልጠፋም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለመደበኛ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩን የርእስ ቅርጽ ለማንጸባረቅ ስማዊ አወቃቀሩ ተጠብቋል፤ ሁለቱም የማስታወሻ ምልክቶች በዋናው ጽሑፍ ተካትተዋል።
