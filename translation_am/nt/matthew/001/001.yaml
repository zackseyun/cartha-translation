review_pass:
  verdict: revise
  source_fidelity: The draft retains all principal Greek elements, but its genitival ordering, «የመሲሑ የኢየሱስ», reverses the intended relationship and can mean “the Messiah’s Jesus,” rather than “Jesus the Messiah.” The revision restores the intended apposition while retaining the genealogical heading and both filial designations.
  naturalness: The revised heading is a natural, dignified modern Amharic nominal title. «የዘር ሐረግ» is more idiomatic and immediately clear for a genealogy than «የትውልድ ሐረግ».
  terminology: «ኢየሱስ መሲሑ» appropriately renders Jesus the Messiah, preserving Χριστός as a title. «የዳዊት ልጅ» and «የአብርሃም ልጅ» transparently preserve the Greek idiom. The notes retain the semantic range of γενέσεως and the traditional rendering «ክርስቶስ».
  issues:
  - severity: high
    issue: The phrase «የመሲሑ የኢየሱስ» has reversed genitival syntax.
    rationale: It does not mean “Jesus the Messiah”; it grammatically presents Jesus as belonging to the Messiah. The source names Jesus and identifies him as Messiah.
  - severity: low
    issue: «የትውልድ ሐረግ» is less idiomatic for a written genealogy.
    rationale: «የዘር ሐረግ» more naturally denotes genealogy in modern standard Amharic and accords with the lineage immediately following.
