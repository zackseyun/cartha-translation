  text: Ἑζεκίας δὲ ἐγέννησεν τὸν Μανασσῆ, Μανασσῆς δὲ ἐγέννησεν τὸν ⸂Ἀμώς, Ἀμὼς⸃ δὲ ἐγέννησεν τὸν Ἰωσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/010.yaml
  text: Hezekiah fathered Manasseh[a], Manasseh fathered Amos, and Amos fathered Josiah.
translation:
  language: am
  text: ሕዝቅያስም ምናሴን ወለደ፤ ምናሴም አሞጽን[a] ወለደ፤ አሞጽም ኢዮስያስን ወለደ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ ትርጉሞች እዚህ ላይ ስሙን በ2 ነገሥት 21 ከተጠቀሰው የይሁዳ ንጉሥ ስም ጋር በማስማማት «አሞን» ይላሉ፤ የማቴዎስ የግሪክ ጽሑፍ ግን «አሞጽ» ይላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγέννησεν
  choice: ወለደ
  rationale: በዘር ሐረግ አውድ የወንድ የትውልድ ግንኙነትን በአጭርና በተለመደ አማርኛ ያሳያል፤ በዚህ ዓይነት የዘር ሐረግ አገላለጽ ሩቅ ዝርያንም ሊያካትት ይችላል።
- source_word: Ἑζεκίας
  choice: ሕዝቅያስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ ስም አጠራር የተለመደውን ቅርጽ ይከተላል።
- source_word: Μανασσῆς
  choice: ምናሴ
  rationale: በዘመናዊ አማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የታወቀው የስሙ ቅርጽ ነው።
- source_word: Ἀμώς
  choice: አሞጽ
  rationale: የSBLGNT የግሪክ ጽሑፍ Ἀμώς የሚለውን ስም ስለሚያቀርብ ዋናው ጽሑፍ ከእርሱ ጋር የሚዛመደውን አሞጽ የሚለውን ቅርጽ ይጠቀማል፤ ከአሞን ጋር አልተስማማም።
- source_word: Ἰωσίας
  choice: ኢዮስያስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ ልማድ የታወቀውን የስም ቅርጽ ይጠብቃል።
- source_word: δέ
  choice: -ም / ፤
  rationale: በተደጋጋሚው የዘር ሐረግ ዝርዝር ውስጥ ቀጣዩን ክፍል የሚያያይዝ ተግባር አለው፤ የአማርኛው -ም እና ሥርዓተ ነጥብ ግንኙነቱን ተፈጥሯዊ አድርገው ያቀርባሉ።
theological_decisions:
- issue: በማቴዎስ የግሪክ ጽሑፍና በብሉይ ኪዳን የንጉሡ ስም መካከል ያለው ልዩነት
  choice: በዋናው ጽሑፍ የግሪኩን Ἀμώς በመከተል «አሞጽ» ማለት
  alternative: ከ2 ነገሥት 21 ከሚታወቀው የይሁዳ ንጉሥ ስም ጋር ለማስማማት «አሞን» ማለት
  rationale: ትርጉሙ የግሪክ ምንጭ ጽሑፉን በቀጥታ ይከተላል፤ የታሪክ ስም ልዩነቱን በስውር ከማስተካከል ይልቅ አማራጩን በግርጌ ማስታወሻ ያስቀምጣል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የዘር ሐረጉን የተደጋጋሚ አወቃቀር ለመጠበቅ «ወለደ» እና አያያዥ -ም በተከታታይ ቀርበዋል።
