  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Πᾶσαι οὖν αἱ γενεαὶ ἀπὸ Ἀβραὰμ ἕως Δαυὶδ γενεαὶ δεκατέσσαρες, καὶ ἀπὸ Δαυὶδ ἕως τῆς μετοικεσίας Βαβυλῶνος γενεαὶ δεκατέσσαρες, καὶ ἀπὸ τῆς μετοικεσίας Βαβυλῶνος ἕως τοῦ χριστοῦ γενεαὶ δεκατέσσαρες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/017.yaml
  text: So all the generations from Abraham to David were fourteen generations[a], and from David to the exile to Babylon fourteen generations[b], and from the exile to Babylon to the Messiah fourteen generations.
translation:
  language: am
  text: ስለዚህ፣ ከአብርሃም እስከ ዳዊት ድረስ ያሉት ትውልዶች ሁሉ አሥራ አራት ናቸው፤ ከዳዊት እስከ ወደ ባቢሎን መማረክ ድረስ አሥራ አራት፣ ከወደ ባቢሎን መማረክ እስከ መሲሑ[a] ድረስ ደግሞ አሥራ አራት ናቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ክርስቶስ።” የግሪኩ χριστός “የተቀባው” የሚል ማዕረግ ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: Πᾶσαι οὖν αἱ γενεαὶ
  choice: እንግዲህ ... ያሉት ትውልዶች ሁሉ
  rationale: «እንግዲህ» የοὖνን ማጠቃለያዊ ኃይል በተፈጥሯዊ አማርኛ ያሳያል፤ «ሁሉ» ደግሞ Πᾶσαιን በግልጽ ያቆያል።
- source_word: γενεαὶ
  choice: ትውልዶች
  rationale: በዚህ የዘር ሐረግ አውድ ቃሉ ተከታታይ ትውልዶችን ያመለክታል።
- source_word: ἀπὸ ... ἕως
  choice: ከ... እስከ...
  rationale: የዘር ሐረጉን ሁለት የጊዜ ወይም የሰው ወሰኖች በተለመደ አማርኛ ይገልጻል።
- source_word: μετοικεσίας Βαβυλῶνος
  choice: ወደ ባቢሎን እስከተሰደዱበት ጊዜ
  rationale: μετοικεσία የሚያመለክተውን በግድ ተወስዶ በስደት መኖርን በተፈጥሯዊ አማርኛ ይገልጻል፤ ባቢሎንም የመድረሻ ስፍራ መሆኗን «ወደ» ያሳያል።
- source_word: τοῦ χριστοῦ
  choice: መሲሑ
  rationale: በዘር ሐረጉ መደምደሚያ ላይ χριστός እንደ ማዕረግ ስለሚሠራ፣ ትርጉሙን የሚያቆየው «መሲሕ» ተመርጧል፤ የግልጽ አመልካች ቅጥያውም የግሪኩን አርቲክል ያንጸባርቃል።
- source_word: γενεαὶ δεκατέσσαρες
  choice: አሥራ አራት ትውልዶች
  rationale: ሦስት ጊዜ የተደገመውን ቀመራዊ አወቃቀርና ቁጥር በግልጽ ያቆያል።
theological_decisions:
- issue: የΧριστός አተረጓጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: እዚህ ቃሉ ከግል ስም ይልቅ የተቀባውን ንጉሥ የሚያመለክት ማዕረግ ሆኖ የዘር ሐረጉን ያጠናቅቃል። «መሲሕ» ይህን ማዕረጋዊ ትርጉም ይጠብቃል፤ የተለመደው «ክርስቶስ» ግን በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለሕዝብ የሚገባ አማርኛ ተጠቅሟል። የሦስቱ የዘር ሐረግ ክፍሎች ትይዩ አወቃቀር ተጠብቋል፤ «ናቸው» በመጀመሪያውና በመጨረሻው ክፍል በመቀመጡ መካከለኛው ክፍል በተፈጥሯዊ አማርኛ አጭር ሆኖ ቀርቧል።
