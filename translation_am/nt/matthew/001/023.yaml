  source_fidelity: 'The translation accurately represents the Greek: Ἰδοὺ is retained with the elevated attention-marker እነሆ; παρθένος is appropriately rendered ድንግል; both future childbirth clauses are preserved; and the indefinite third-person plural καλέσουσιν is retained in ብለው ይጠሩታል. The explanatory rendering of Ἐμμανουήλ as እግዚአብሔር ከእኛ ጋር preserves the compact nominal wording of the Greek without adding theological interpretation.'
