id: MAT.1.23
reference: Matthew 1:23
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ἰδοὺ ἡ παρθένος ἐν γαστρὶ ἕξει καὶ τέξεται υἱόν, καὶ καλέσουσιν τὸ ὄνομα αὐτοῦ Ἐμμανουήλ· ὅ ἐστιν μεθερμηνευόμενον Μεθ’ ἡμῶν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/023.yaml
  text: Behold[a], the virgin will conceive and bear a son, and they will call his name Immanuel—which is translated[d][c][b], 'God with us.'
translation:
  language: am
  text: “እነሆ፣ ድንግል[a] ትፀንሳለች፣ ወንድ ልጅም ትወልዳለች፤ ስሙንም አማኑኤል ብለው[b] ይጠሩታል።” ይህም ሲተረጎም፣ “እግዚአብሔር ከእኛ ጋር” ማለት ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ወጣት ሴት።” በማቴዎስ አውድ ግን የግሪኩ ቃል παρθένος እና በዙሪያው ያለው የውልደት ትረካ “ድንግል” የሚለውን ይደግፋሉ።
    reason: lexical_alternative
  - marker: b
    text: ግሪኩ ቃል በቃል “እነርሱ ይጠሩታል” ይላል፤ ይህ ፈጻሚውን ማንነት የማይወስን የብዙ ቁጥር አገላለጽ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: እነሆ
  rationale: በትንቢታዊው ጥቅስ ውስጥ ያለውን ትኩረት የሚጠራ ከፍ ያለ የንግግር ኃይል በተፈጥሯዊና በተከበረ አማርኛ ይጠብቃል።
- source_word: παρθένος
  choice: ድንግል
  rationale: ቃሉ በማቴዎስ የውልደት ትረካ አውድ ውስጥ ድንግልን ያመለክታል፤ የቃሉ ሰፋ ያለ አጠቃቀም ግን በማስታወሻ ተጠብቋል።
- source_word: ἐν γαστρὶ ἕξει
  choice: ትፀንሳለች
  rationale: ቃል በቃል ‘በማኅፀን ትይዛለች’ የሚለውን ፈሊጥ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: τέξεται υἱόν
  choice: ወንድ ልጅም ትወልዳለች
  rationale: የወደፊት ጊዜውንና የልጁን ጾታ በግልጽ እና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: καλέσουσιν τὸ ὄνομα αὐτοῦ
  choice: ስሙንም … ብለው ይጠሩታል
  rationale: በግሪክ ያለውን ሦስተኛ መደብ ብዙ ቁጥርና ያልተወሰነውን ፈጻሚ ከወደቁ ወደ ተደራጊ ሳይለውጥ ይጠብቃል።
- source_word: Ἐμμανουήλ
  choice: አማኑኤል
  rationale: በአማርኛ የመጽሐፍ ቅዱስና የክርስቲያናዊ አጠቃቀም የተለመደውን የስሙን አጻጻፍ ይከተላል።
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: ይህም ሲተረጎም፣ … ማለት ነው
  rationale: የግሪኩን ገላጭ ሐረግ በግልጽና በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: Μεθ’ ἡμῶν ὁ θεός
  choice: እግዚአብሔር ከእኛ ጋር
  rationale: የስሙን ትርጉም ሳያሰፋ በአማርኛ የተለመደና ግልጽ ቅርጽ ያቀርባል።
theological_decisions:
- issue: በድንግል መፀነስ ትረካ ውስጥ παρθένοςን መተርጎም
  choice: ድንግል
  alternative: ወጣት ሴት
  rationale: ማቴዎስ 1 ያለው የቅርብ ትረካዊ አውድና የግሪኩ ቃል ዋና አጠቃቀም ‘ድንግል’ን ይደግፋሉ፤ ከኢሳይያስ 7፥14 ጋር የተያያዘው ሰፋ ያለ የቃል ውይይት ግን በማስታወሻ ተጠብቋል።
- issue: ‘አማኑኤል’ የሚለውን ስም ትርጉም ማቅረብ
  choice: እግዚአብሔር ከእኛ ጋር
  alternative: ከእኛ ጋር እግዚአብሔር ነው
  rationale: ጥቅሱ ራሱ የሚሰጠውን ትርጉም ይጠብቃል፤ ስለ ሥጋዌ ተጨማሪ የእምነት ማብራሪያ ወደ ጽሑፉ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛ ተጠቅሟል። “እነሆ” የትንቢታዊውን ጥቅስ ከፍ ያለ ድምፅ ሲጠብቅ፣ የቀረው አገላለጽ ለዘመናዊ አንባቢ ተፈጥሯዊ ሆኖ ቀርቧል።
