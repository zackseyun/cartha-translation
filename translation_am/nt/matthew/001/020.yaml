id: MAT.1.20
reference: Matthew 1:20
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ταῦτα δὲ αὐτοῦ ἐνθυμηθέντος ἰδοὺ ἄγγελος κυρίου κατ’ ὄναρ ἐφάνη αὐτῷ λέγων· Ἰωσὴφ υἱὸς Δαυίδ, μὴ φοβηθῇς παραλαβεῖν ⸀Μαρίαν τὴν γυναῖκά σου, τὸ γὰρ ἐν αὐτῇ γεννηθὲν ἐκ πνεύματός ἐστιν ἁγίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/020.yaml
  text: But as he was considering these things, behold, an angel of the Lord appeared to him in a dream, saying, “Joseph, son of David, do not be afraid to take Mary as your wife, for what has been conceived in her is from the Holy Spirit.”
translation:
  language: am
  text: እርሱ ይህን እያሰበ ሳለ፣ እነሆ፣ የጌታ መልአክ በሕልም ታየውና እንዲህ አለው፦ “የዳዊት ልጅ ዮሴፍ ሆይ፣ ሚስትህን ማርያምን ወደ ቤትህ ለመውሰድ አትፍራ፤[a] በእርሷ የተፀነሰው ከመንፈስ ቅዱስ ነውና።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሚስትህን ማርያምን ለመቀበል።” የግሪኩ አገላለጽ በጋብቻ ወደ ቤቱ ወስዶ አብሯት መኖርን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνθυμηθέντος
  choice: እያሰበ ሳለ
  rationale: የዮሴፍን ቀጣይነት ያለው ውስጣዊ ማሰብና መመርመር ያሳያል፤ የተቋጨ ውሳኔ አያመለክትም።
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: የትረካውን ድንገተኛ መቀየርና ጉልህነት የሚያሳይ የንግግር ምልክት በክብር ባለው ተፈጥሯዊ አማርኛ ተጠብቋል።
- source_word: ἄγγελος κυρίου
  choice: የጌታ መልአክ
  rationale: ግሪኩ ἄγγελος ላይ መስተዋድድ ባይኖረውም፣ በአማርኛ የባለቤትነት ሐረጉ በተፈጥሮ ‘የጌታ መልአክ’ ይባላል፤ ይህም ከጽሑፉ በላይ ልዩ መለኮታዊ መገለጥን አያስገድድም።
- source_word: κατ’ ὄναρ ἐφάνη αὐτῷ
  choice: በሕልም ታየው
  rationale: የራእይ መገለጥን በአጭርና ተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: υἱὸς Δαυίδ
  choice: የዳዊት ልጅ
  rationale: የትውልድ ሐረጉንና ከዳዊት ዘር ጋር ያለውን አስተጋብኦ በቀጥታ ይጠብቃል።
- source_word: μὴ φοβηθῇς
  choice: አትፍራ
  rationale: ክልከላውንና የፍርሃትን ስሜት በግልጽ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: παραλαβεῖν Μαρίαν τὴν γυναῖκά σου
  choice: ሚስትህን ማርያምን ወደ ቤትህ ለመውሰድ
  rationale: τὴν γυναῖκά σου ማርያም አስቀድማ ሚስቱ መሆኗን ይገልጻል፤ παραλαβεῖν በዚህ የጋብቻ አውድ ወደ ቤቱ ተቀብሎ መውሰድን ያመለክታል።
- source_word: τὸ ἐν αὐτῇ γεννηθὲν
  choice: በእርሷ የተፀነሰው
  rationale: የግሪኩን ጾታ-አልባ ስማዊ አገላለጽ ይጠብቃል፤ በቅድመ ወሊድ አውድ ‘የተፀነሰው’ ግልጽና ተፈጥሯዊ ነው።
- source_word: ἐκ πνεύματός ἐστιν ἁγίου
  choice: ከመንፈስ ቅዱስ ነው
  rationale: ἐκ የምንጭን ወይም የመነሻን ሐሳብ ያሳያል፤ ‘ከመንፈስ ቅዱስ’ ይህን በቀጥታ ያስተላልፋል።
theological_decisions:
- issue: በἄγγελος κυρίου ውስጥ κυρίου እንዴት እንደሚተረጎም
  choice: የጌታ መልአክ
  alternative: የእግዚአብሔር መልአክ
  rationale: κύριοςን ‘ጌታ’ ብሎ መተርጎም የግሪኩን ቃል በቀጥታ ይከተላል፤ የብሉይ ኪዳንን መለኮታዊ ስም በግድ ወደ ጽሑፉ አያስገባም።
- issue: የπνεύματός ... ἁγίου ማጣቀሻ
  choice: መንፈስ ቅዱስ
  alternative: ቅዱስ መንፈስ፣ የመንፈስ ቅዱስ ኃይል
  rationale: በማቴዎስ የልደት ትረካ ውስጥ ሐረጉ መለኮታዊውን መንፈስ ይጠቁማል፤ ጽሑፉ ያልጨመረውን ‘ኃይል’ መጨመር አያስፈልግም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛ ተጠቅሟል። ‘እነሆ’ የጽሑፉን ትረካዊ አጽንዖት ለመጠበቅ ተቀምጧል። ‘ወደ ቤትህ’ የπαραλαμβάνωን በዚህ አውድ ያለ ትርጉም ግልጽ ያደርጋል፣ ማርያም ከዚያ በፊት ሚስቱ እንዳልነበረች ግን አያመለክትም።
