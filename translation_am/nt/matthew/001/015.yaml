  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ἐλιοὺδ δὲ ἐγέννησεν τὸν Ἐλεάζαρ, Ἐλεάζαρ δὲ ἐγέννησεν τὸν Ματθάν, Ματθὰν δὲ ἐγέννησεν τὸν Ἰακώβ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/015.yaml
  text: Eliud fathered Eleazar, and Eleazar fathered Matthan, and Matthan fathered Jacob.
translation:
  language: am
  text: ኤልዩድም አልዓዛርን ወለደ፤ አልዓዛርም ማታንን ወለደ፤ ማታንም ያዕቆብን ወለደ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλιοὺδ
  choice: ኤልዩድ
  rationale: የግሪኩን የግል ስም ድምፅ በዘመናዊ የአማርኛ ግዕዝ ፊደል በተቻለ መጠን ይከተላል።
- source_word: δὲ
  choice: -ም
  rationale: በዚህ የትውልድ ሐረግ ውስጥ δέ ዝርዝሩን የሚያስቀጥል ቀላል አያያዥ ነው፤ በአማርኛ ከስሙ ጋር የሚጣበቀው «-ም» ይህን ቅደም ተከተል በተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: ἐγέννησεν
  choice: ወለደ
  rationale: በወንድ የዘር ሐረግ አገባብ ውስጥ γεννάω አባትነትንና የዘር ቅደም ተከተልን ያመለክታል፤ «ወለደ» በአማርኛ መጽሐፍ ቅዱሳዊ የትውልድ ዝርዝር ውስጥ የተለመደ፣ አጭርና ግልጽ ነው።
- source_word: τὸν
  choice: -ን
  rationale: የግሪኩ የወንድ ነጠላ ተሳቢ አመልካች አንቀጽ በአማርኛ እንደ ተለየ አንቀጽ አይተረጎምም፤ ስሞቹ የቀጥታ ተሳቢ መሆናቸው በ«-ን» ቅጥያ ተገልጿል።
- source_word: Ἐλεάζαρ
  choice: አልዓዛር
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠራር የተለመደውን የዚህ የግል ስም ቅርጽ ይጠቀማል።
- source_word: Ματθάν
  choice: ማታን
  rationale: የግሪኩን ስም ድምፅ በአማርኛ ፊደል የሚያቀርብ ግልጽ ንበት ነው።
- source_word: Ἰακώβ
  choice: ያዕቆብ
  rationale: የግሪኩ Ἰακώβ በአማርኛ መጽሐፍ ቅዱሳዊ ወግ የተረጋገጠው «ያዕቆብ» ተብሎ ቀርቧል።
