language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀ἐγερθεὶς δὲ ὁ Ἰωσὴφ ἀπὸ τοῦ ὕπνου ἐποίησεν ὡς προσέταξεν αὐτῷ ὁ ἄγγελος κυρίου καὶ παρέλαβεν τὴν γυναῖκα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/024.yaml
  text: Then Joseph[a], having awakened from sleep, did as the angel of the Lord commanded him and took his wife.
translation:
  language: am
  text: ዮሴፍም ከእንቅልፉ ነቅቶ፣ የጌታ መልአክ እንዳዘዘው አደረገ፤ ሚስቱን ተቀበላት[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሚስቱን ወሰዳት” ወይም “ሚስቱን ወደ ቤቱ ወሰዳት።” የግሪኩ ግስ አንድን ሰው ወደ ራስ ወይም ወደ ቤት መቀበልን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθεὶς ... ἀπὸ τοῦ ὕπνου
  choice: ከእንቅልፉ ነቅቶ
  rationale: የግሪክ አንቀጹን ቅደም ተከተልና ከእንቅልፍ የመንቃትን ፍቺ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: δὲ
  choice: -ም
  rationale: እዚህ δέ ጠንካራ ተቃርኖን ሳይሆን የትረካ ቀጣይነትን ያመለክታል፤ ከስሙ ጋር የተያያዘው ‘-ም’ ይህን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐποίησεν ὡς προσέταξεν αὐτῷ
  choice: እንዳዘዘው አደረገ
  rationale: የታዘዘውን በትክክል መፈጸሙን ያሳያል፤ προστάσσω ያለውን የሥልጣን ትእዛዝ ኃይል ‘አዘዘ’ ይጠብቃል።
- source_word: ὁ ἄγγελος κυρίου
  choice: የጌታ መልአክ
  rationale: የግሪክን የባለቤትነት ግንኙነት በግልጽና በተለመደ መጽሐፍ ቅዱሳዊ አማርኛ ያቀርባል።
- source_word: παρέλαβεν
  choice: ወደ እርሱ ወሰዳት
  rationale: παραλαμβάνω አንድን ሰው ወደ ራስ የመቀበል ወይም ወደ ቤት የመውሰድ ፍቺ ሊኖረው ይችላል። ይህ አተረጓጎም የጋብቻውን አውድ ያስተላልፋል፣ የቃሉንም ሰፊ ፍቺ በማስታወሻ ይጠብቃል።
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: ሚስቱን
  rationale: γυνή እንደ አውዱ ‘ሴት’ ወይም ‘ሚስት’ ሊሆን ይችላል፤ በዚህ ሕጋዊና ጋብቻዊ አውድ ‘ሚስቱ’ ተፈጥሯዊው ፍቺ ነው።
theological_decisions:
- issue: ጋብቻው ገና ሳይፈጸም በነበረበት አውድ γυνήን መተርጎም
  choice: ሚስቱን
  alternative: ሴቲቱን
  rationale: ቀደም ያለው ትረካ እጮኝነትን ቢጠቅስም፣ ማቴዎስ ማርያምን በሕጋዊና ማኅበራዊ የጋብቻ ማዕቀፍ ውስጥ ይገልጻታል። ‘ሚስቱ’ ማለት ጋብቻዊ ግንኙነት ተፈጽሟል የሚል ተጨማሪ ግምት ሳያስገባ ይህን ያንጸባርቃል።
- issue: κύριοςን በἄγγελος κυρίου ሐረግ ውስጥ መተርጎም
  choice: የጌታ መልአክ
  alternative: የያህዌ መልአክ
  rationale: ‘ጌታ’ የግሪኩን κύριος በቀጥታ ይወክላል፣ በማቴዎስም ያለውን የተለመደ መጽሐፍ ቅዱሳዊ አገላለጽ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የአረፍተ ነገሩ ቅደም ተከተል የግሪኩን ትረካዊ እንቅስቃሴ ይከተላል፤ በπαρέλαβεν ያለው የቃላት ስፋት በ[a] ማስታወሻ ተጠብቋል።
