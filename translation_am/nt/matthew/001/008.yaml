  yaml_path: translation/nt/matthew/001/008.yaml
  text: Asaph fathered Jehoshaphat[a], Jehoshaphat fathered Joram, and Joram fathered Uzziah.
translation:
  language: am
  text: አሳፍ[a]ም ኢዮሳፍጥን ወለደ፤ ኢዮሳፍጥም ኢዮራምን ወለደ፤ ኢዮራምም ዖዝያንን ወለደ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ ቅጂዎች «አሳፍ» በሚለው ፈንታ «አሳ» ይላሉ፤ «አሳ» የሚለውም በብሉይ ኪዳን የዘር ሐረግ ውስጥ ከተጠቀሰው የይሁዳ ንጉሥ ስም ጋር ይስማማል።
    reason: textual_variant
lexical_decisions:
- source_word: Ἀσὰφ
  choice: አሳፍ
  rationale: በSBLGNT ዋና ጽሑፍ ያለውን Ἀσὰφ በድምፅ ቅርበት ያስተላልፋል፤ ከብሉይ ኪዳን የይሁዳ ንጉሥ አሳ ጋር ለማስማማት ዋናውን ጽሑፍ በዝምታ አያስተካክልም።
- source_word: δὲ
  choice: -ም
  rationale: በትውልድ ሐረጉ ውስጥ δέ ተቃርኖን ሳይሆን ቀላል ቅደም ተከተላዊ አያያዝን ያሳያል፤ የአማርኛው -ም ይህን በተፈጥሮ ያስተላልፋል።
- source_word: ἐγέννησεν
  choice: ወለደ
  rationale: በዘር ሐረግ ውስጥ የአባትነት ትውልዳዊ ግንኙነትን በአጭርና በተለመደ ዘመናዊ አማርኛ ይገልጣል።
- source_word: Ἰωσαφάτ
  choice: ኢዮሳፍጥ
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠራር የሚታወቀውን የይሁዳ ንጉሥ ስም ይጠቀማል።
- source_word: Ἰωράμ
  choice: ኢዮራም
  rationale: የግሪኩን Ἰωράμ ቅርጽ በቅርብ የሚያስተላልፍና በአማርኛ አንባቢዎች ዘንድ የተለመደ ቅርጽ ነው።
- source_word: Ὀζίαν
  choice: ዖዝያን
  rationale: ለይሁዳዊው ንጉሥ የተለመደውን አማርኛ ስም ይጠቀማል፤ የመድረሻው -ን ከስሙ ጋር ተያይዟል።
theological_decisions:
- issue: ተደጋጋሚውን δὲ እና ἐγέννησεν በዘር ሐረጉ መተርጎም
  choice: እያንዳንዱን የአባትና የልጅ ግንኙነት በተሟላ ሐረግ ማቆየት፣ δέንም በ-ም ማስተላለፍ
