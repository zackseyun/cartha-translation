- issue: Ἀσὰφን ከታሪካዊው አሳ ጋር በዋናው ጽሑፍ ማስማማት ወይም አለማስማማት
  choice: በዋናው ጽሑፍ «አሳፍ»ን ማቆየትና «አሳ»ን በግርጌ ማስታወሻ ማቅረብ
  alternative: ከብሉይ ኪዳን የዘር ሐረግ ጋር በማስማማት በዋናው ጽሑፍ «አሳ» ማለት
  rationale: የግሪኩን ዋና ጽሑፍ በቀጥታ ያከብራል፤ በቅጂዎችና በብሉይ ኪዳን የዘር ሐረግ መካከል ያለውን ጉዳይም ሳይደብቅ ያሳያል።
