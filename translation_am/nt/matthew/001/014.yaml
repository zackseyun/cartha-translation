language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ἀζὼρ δὲ ἐγέννησεν τὸν Σαδώκ, Σαδὼκ δὲ ἐγέννησεν τὸν Ἀχίμ, Ἀχὶμ δὲ ἐγέννησεν τὸν Ἐλιούδ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/014.yaml
  text: Azor fathered Zadok, Zadok fathered Achim, and Achim fathered Eliud.
translation:
  language: am
  text: አዞር ሳዶቅን ወለደ፤ ሳዶቅ አኪምን ወለደ፤ አኪምም ኤልዩድን ወለደ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀζώρ
  choice: አዞር
  rationale: የግል ስሙ ከግሪክ አጠራር ጋር ተቀራራቢ ሆኖ በአማርኛ ፊደል ተጽፏል።
- source_word: δέ
  choice: ፤ / ም
  rationale: በትውልድ ሐረጉ ውስጥ ቀላል አያያዥ ነው። የተደጋገመውን ቅደም ተከተል በሰረዝ ነጥብና በመጨረሻው ሐረግ በ«ም» ማሳየት ተፈጥሯዊ አማርኛን ይሰጣል።
- source_word: ἐγέννησεν
  choice: ወለደ
  rationale: በወንድ የዘር ሐረግ አውድ የመውለድንና የአባትነት ዝምድናን በአጭር፣ በተለመደና በክቡር አማርኛ ይገልጣል።
- source_word: τὸν
  choice: በ«-ን» የተመለከተ
  rationale: የግሪኩ የወንድ ነጠላ ተሳቢ አመልካች በአማርኛ እንደ ራሱን የቻለ ቃል ሳይተረጎም፣ ቀጥተኛ ተሳቢው ላይ በ«-ን» ተገልጧል።
- source_word: Σαδώκ
  choice: ሳዶቅ
  rationale: የግሪኩን የግል ስም በአማርኛ ፊደል የሚቀርብ ቅርጽ ነው።
- source_word: Ἀχίμ
  choice: አኪም
  rationale: የግሪኩን χ በዘመናዊ አማርኛ አነባበብ ለአንባቢ ቀላል በሆነ «ኪ» ቅርጽ ያቀርባል።
- source_word: Ἐλιούδ
  choice: ኤልዩድ
  rationale: የግሪኩን የግል ስም በአማርኛ አጠራርና ፊደል የሚቀርብ ቅርጽ ነው።
theological_decisions:
- issue: ἐγέννησεν ቀጥተኛ ወላጅነትን ወይስ ሰፊ የዘር ግንኙነትን ያመለክታል?
  choice: ወለደ
  alternative: አባት ሆነ / የዘር አባት ሆነ
  rationale: የግሪኩን የዘር ሐረግ አገላለጽ በቀጥታ ይጠብቃል፤ ጽሑፉ ራሱ ያልገለጠውን የትውልድ ርቀት አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ የዘር ሐረግ አገላለጽ። የግሪኩ ተደጋጋሚ አወቃቀር ተጠብቆ፣ δέ በአማርኛ የሚፈሰውን አያያዝ በሥርዓተ ነጥብና በ«ም» ተወክሏል።
