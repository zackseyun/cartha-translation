id: MAT.1.6
reference: Matthew 1:6
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ἰεσσαὶ δὲ ἐγέννησεν τὸν Δαυὶδ τὸν βασιλέα. Δαυὶδ ⸀δὲ ἐγέννησεν τὸν Σολομῶνα ἐκ τῆς τοῦ Οὐρίου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/006.yaml
  text: Jesse fathered David the king[a]. David fathered Solomon by the wife of Uriah,
translation:
  language: am
  text: እሴይም ንጉሡን ዳዊትን ወለደ። ዳዊትም ከኦርዮ ሚስት[a] ሰሎሞንን ወለደ፣
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ግሪኩ ቃል በቃል «ከኦርዮ [ሴት]» ይላል፤ ይህም «ከኦርዮ ሚስት» ማለት ነው። ማቴዎስ በዚህ ስፍራ ቤርሳቤህን በስሟ አይጠቅሳትም።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: ወለደ
  rationale: በዘር ሐረግ አውድ γεννάω የወንድ ወላጅነትንና የትውልድ ቅደም ተከተልን ያመለክታል፤ «ወለደ» በአማርኛ የዘር ሐረግ አገላለጽ ተፈጥሯዊና ግልጽ ነው።
- source_word: βασιλέα
  choice: ንጉሡን
  rationale: የግሪኩን የተወሰነ አመልካች ጠብቆ ዳዊትን በተለይ «ንጉሡ» ብሎ በመለየት በዘር ሐረጉ ውስጥ ያለውን ንጉሣዊ ስፍራ ያጎላል።
- source_word: ἐκ τῆς τοῦ Οὐρίου
  choice: ከኦርዮ ሚስት
  rationale: ግሪኩ «ከኦርዮ [ሴት]» የሚል አጭርና ያልተሟላ አገላለጽ ሲሆን «ሚስት» በዐውዱ የተገመተ ነው። ይህ አተረጓጎም ተፈጥሯዊ አማርኛ ሆኖ ማቴዎስ ቤርሳቤህን በስም አለመጥቀሱንና ከኦርዮ ጋር ያላትን ዝምድና መግለጹን ይጠብቃል።
- source_word: Ἰεσσαὶ
  choice: እሴይ
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠራር የተለመደው የስሙ ቅርጽ ነው።
- source_word: Δαυὶδ
  choice: ዳዊት
  rationale: በአማርኛ የተለመደው መጽሐፍ ቅዱሳዊ የስም ቅርጽ ነው።
- source_word: Σολομῶνα
  choice: ሰሎሞን
  rationale: በአማርኛ የተለመደው መጽሐፍ ቅዱሳዊ የስም ቅርጽ ነው።
- source_word: Οὐρίου
  choice: ኦርዮ
  rationale: በአማርኛ የተለመደው መጽሐፍ ቅዱሳዊ የስም ቅርጽ ነው።
- source_word: δέ
  choice: -ም
  rationale: በዘር ሐረጉ ውስጥ ያለውን ለስላሳ አያያዥነት የአማርኛው «-ም» በተፈጥሯዊ ሁኔታ ያሳያል።
theological_decisions:
- issue: ማቴዎስ ቤርሳቤህን በተዘዋዋሪ መጥቀሱ
  choice: «ከኦርዮ ሚስት» የሚለውን ተዘዋዋሪ አገላለጽ መጠበቅ
  alternative: «ከቤርሳቤህ» ወይም «ቀድሞ የኦርዮ ሚስት ከነበረችው»
  rationale: የግሪኩ ጽሑፍ ሴቲቱን በስሟ ሳይጠራ ከኦርዮ ጋር ባላት ዝምድና ይለያታል። ይህም ከ2 ሳሙኤል ታሪክ ጋር ያለውን ሥነ ጽሑፋዊና ሥነ ምግባራዊ ድምፀት ሳያጠፋ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የዘር ሐረጉ አጭርና ተደጋጋሚ ቅርጽ ተጠብቋል፤ የግሪኩ ተዘዋዋሪ አገላለጽም ያለ አስተምህሮአዊ ማስፋፊያ ተላልፏል።
