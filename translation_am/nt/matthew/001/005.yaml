id: MAT.1.5
reference: Matthew 1:5
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Σαλμὼν δὲ ἐγέννησεν τὸν ⸂Βόες ἐκ τῆς Ῥαχάβ, Βόες⸃ δὲ ἐγέννησεν τὸν ⸂Ἰωβὴδ ἐκ τῆς Ῥούθ, Ἰωβὴδ⸃ δὲ ἐγέννησεν τὸν Ἰεσσαί,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/005.yaml
  text: Salmon fathered Boaz by Rahab[a], and Boaz fathered Obed by Ruth, and Obed fathered Jesse,
translation:
  language: am
  text: ሰልሞንም ከረዓብ ቦዔዝን ወለደ፤ ቦዔዝም ከሩት ዖቤድን ወለደ፤ ዖቤድም እሴይን ወለደ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγέννησεν
  choice: ወለደ
  rationale: በዘር ሐረጉ አውድ የወንድ ወላጅነትንና የትውልድ ቅደም ተከተልን ያመለክታል፤ «ወለደ» በአማርኛ መጽሐፍ ቅዱሳዊ የዘር ሐረግ አገላለጽ የተለመደና ግልጽ ነው።
- source_word: ἐκ
  choice: ከ
  rationale: ከእናቶቹ ስም ጋር ያለው ἐκ የእናት ወገን ምንጭን ያሳያል፤ «ከረዓብ ... ወለደ» እና «ከሩት ... ወለደ» የግሪኩን ቅርጽና የእናቶቹን ግልጽ መጠቀስ በተፈጥሯዊ አማርኛ ይጠብቃሉ።
- source_word: δὲ
  choice: ም
  rationale: እዚህ δέ ተቃርኖን ሳይሆን ቀላል ትስስርንና ተከታታይነትን ያሳያል፤ ከስሞቹ ጋር የተያያዘው «-ም» ይህን ፍሰት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: Σαλμὼν
  choice: ሰልሞን
  rationale: በአማርኛ መጽሐፍ ቅዱስ የተለመደውንና ሊታወቅ የሚችለውን የስሙን ቅርጽ ይጠብቃል።
- source_word: Βόες
  choice: ቦዔዝ
  rationale: የብሉይ ኪዳኑን ታዋቂ ሰው በተለመደው የአማርኛ ስም ይጠራል፣ በኪዳናቱም መካከል የስም ቀጣይነትን ይጠብቃል።
- source_word: Ῥαχάβ
  choice: ረዓብ
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የታወቀው የስሙ ቅርጽ ነው።
- source_word: Ἰωβὴδ
  choice: ዖቤድ
  rationale: ከብሉይ ኪዳኑ ሰው ጋር ያለውን መታወቂያና የስም ቀጣይነት የሚጠብቅ የተለመደ ቅርጽ ነው።
- source_word: Ῥούθ
  choice: ሩት
  rationale: የብሉይ ኪዳኑን መጽሐፍና ሰው በአማርኛ በሰፊው በሚታወቀው ስም ያቀርባል።
- source_word: Ἰεσσαί
  choice: እሴይ
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ ወግ የተለመደና ከብሉይ ኪዳን ጋር ቀጣይነትን የሚጠብቅ ቅርጽ ነው።
theological_decisions:
- issue: የዘር ሐረጉ ቀመርና የእናቶቹ መጠቀስ
  choice: የአባትነት የዘር ቅደም ተከተሉን «ወለደ» በሚለው በመጠበቅ፣ ረዓብንና ሩትን «ከ...» በሚለው በግልጽ መጥቀስ።
  alternative: «የ... አባት ሆነ» ማለት፣ ወይም የእናቶቹን ሚና በይበልጥ ትርጓሜያዊ አገላለጽ መግለጽ።
  rationale: የግሪኩ ጽሑፍ ἐκ + የእናት ስምን በመጠቀም እናቶቹን በተለየ ሁኔታ ያሳያል። ትርጉሙ ይህን ገጽታ ሳያጠፋ የአባት ወገን የዘር ሐረጉንም እንደተጠበቀ ያቀርባል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው አማርኛ ተጠቅሟል። የዘር ሐረግ ባህላዊ አገላለጽ «ወለደ» ለተራ አንባቢ የሚገባ ሲሆን የጽሑፉን አጭርና ተከታታይ ምት ይጠብቃል። በአማርኛ «ከረዓብ/ከሩት ... ወለደ» የሚለው የምንጭ ፍቺን በቀጥታ ስለሚያስተላልፍ የእንግሊዝኛው አማራጭ ማስታወሻ አላስፈለገም።
