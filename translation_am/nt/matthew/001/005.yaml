  source_fidelity: 'The translation accurately preserves the three paternal genealogical statements (ἐγέννησεν) and explicitly retains the maternal references introduced by ἐκ: Salmon from/by Rahab, Boaz from/by Ruth, and Obed to Jesse. The sequential -ም appropriately represents the mild connective δέ without introducing contrast.'
