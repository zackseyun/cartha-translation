  terminology: «ወለደ» suitably expresses male begetting in a genealogy. The names ሰልሞን, ቦዔዝ, ረዓብ, ዖቤድ, ሩት, and እሴይ follow recognizable Amharic biblical forms and maintain Old Testament continuity.
