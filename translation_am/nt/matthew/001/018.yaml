  text: Τοῦ δὲ ⸀Ἰησοῦ χριστοῦ ἡ ⸀γένεσις οὕτως ἦν. ⸀μνηστευθείσης τῆς μητρὸς αὐτοῦ Μαρίας τῷ Ἰωσήφ, πρὶν ἢ συνελθεῖν αὐτοὺς εὑρέθη ἐν γαστρὶ ἔχουσα ἐκ πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/018.yaml
  text: 'The birth of Jesus the Messiah happened in this way: when his mother Mary had been betrothed to Joseph[a], before they came together[c][b], she was found to be pregnant from the Holy Spirit.'
translation:
  language: am
  text: የኢየሱስ መሲሕ[a] ልደት እንዲህ ሆነ፤ እናቱ ማርያም ለዮሴፍ ታጭታ ሳለች[b]፣ አንድ ላይ ከመሆናቸው[c] በፊት ከመንፈስ ቅዱስ እርጉዝ ሆና ተገኘች።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የኢየሱስ ክርስቶስ»። የግሪኩ Χριστός በዚህ ስፍራ ማዕረግ ነው፤ «መሲሕ» ተብሎ የተተረጎመው ትርጉሙን ለመጠበቅ ነው።
    reason: alternative_reading
  - marker: b
    text: «ታጭታ» የሚለው ከዘመናዊው ተራ እጮኝነት ይልቅ የጸና፣ በሕግና በማኅበረሰብ እውቅና የነበረውን የጋብቻ ቃል ኪዳን ያመለክታል።
    reason: cultural_note
  - marker: c
    text: «አንድ ላይ ከመሆናቸው» የሚለው የጋብቻ አንድነታቸው በጾታ ግንኙነት ከመፈጸሙ በፊት ማለትንም ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: γένεσις
  choice: ልደት
  rationale: በዚህ ዐውድ ቃሉ የኢየሱስን ወደ ዓለም መምጣትና የልደቱን ታሪክ ያመለክታል፤ «ልደት» ይህን በተፈጥሯዊና ግልጽ አማርኛ ያስተላልፋል።
- source_word: Ἰησοῦ χριστοῦ
  choice: የመሲሑ ኢየሱስ
  rationale: Χριστός እዚህ እንደ ማዕረግ ስለሚሠራ «መሲሕ» ተብሎ ትርጉሙ ተጠብቋል፤ የተወሰነነቱም ስሜት «መሲሑ» በሚለው ቅርጽ ተገልጧል።
- source_word: οὕτως ἦν
  choice: እንዲህ ሆነ
  rationale: የሚቀጥለውን ክስተት አካሄድ የሚያስተዋውቅ ግልጽና የተለመደ አማርኛ ነው።
- source_word: μνηστευθείσης
  choice: ታጭታ ሳለች
  rationale: «ታጭታ» መደበኛ የጋብቻ ቃል ኪዳንን ያመለክታል፤ የአሁኑ ቀላል ፍቅረኛነት ብቻ እንዳይመስል ባህላዊ ማብራሪያ ተጨምሯል።
- source_word: πρὶν ἢ συνελθεῖν αὐτούς
  choice: አንድ ላይ ከመሆናቸው በፊት
  rationale: የግሪኩን ጨዋና በመጠኑ አሻሚ አገላለጽ ይጠብቃል፤ በዐውዱ የትዳር አንድነትን፣ የጾታ ግንኙነትንም ጨምሮ፣ ሊያመለክት እንደሚችል በማስታወሻ ተገልጧል።
- source_word: εὑρέθη
  choice: ተገኘች
  rationale: የግሪኩ ተደራጊ ቅርጽ ተጠብቋል፤ ተጨማሪ አስተርጓሚ ሐሳብ አልገባም።
- source_word: ἐν γαστρὶ ἔχουσα
  choice: እርጉዝ ሆና
  rationale: የግሪኩን ፈሊጣዊ አነጋገር በተፈጥሯዊና ወቅታዊ አማርኛ ያስተላልፋል።
- source_word: ἐκ πνεύματος ἁγίου
  choice: ከመንፈስ ቅዱስ
  rationale: ἐκ የምንጭን ወይም የመነሻን ሐሳብ ያሳያል፤ «ከ» ይህን በቀጥታ ይገልጣል። መንፈስ ቅዱስ እዚህ የተወሰነውን መለኮታዊ መንፈስ ያመለክታል።
theological_decisions:
- issue: የΧριστός አተረጓጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: ቃሉ በዚህ የትረካ መግቢያ ውስጥ እንደ ማዕረግ ይሠራል፤ «መሲሑ» የቅቡዕነቱን ትርጉምና የተወሰነውን ማዕረግ ይጠብቃል።
- issue: የπνεύματος ἁγίου ማመልከቻ
  choice: መንፈስ ቅዱስ
  alternative: ቅዱስ መንፈስ / አንድ ቅዱስ መንፈስ
  rationale: በማቴዎስ የልደት ትረካ ዐውድ ሐረጉ የሚያመለክተው መለኮታዊውን መንፈስ ቅዱስ ነው፤ በግሪክ አመልካች አንቀጽ አለመኖሩ የግድ ያልተወሰነ መሆንን አያመለክትም።
