  yaml_path: translation/nt/matthew/028/014.yaml
  text: And if this is heard by the governor, we will persuade him and keep you out of trouble.
translation:
  language: am
  text: ይህ ነገር ወደ ገዢው ጆሮ ቢደርስ፣[a] እኛ እናሳምነዋለን፤ እናንተንም ምንም እንዳትጨነቁ እናደርጋችኋለን።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ይህ ነገር ለገዢው ቢታወቅ።”
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “እናንተንም ከጭንቀት ነጻ እናደርጋችኋለን።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκουσθῇ
  choice: ለጆሮ ቢደርስ
  rationale: የἀκούω ተደራጊ ቅርጽ ነገሩ መሰማቱን ወይም መታወቁን ያመለክታል፤ ‘ለጆሮ መድረስ’ ይህን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐπὶ τοῦ ἡγεμόνος
  choice: ለገዢው ጆሮ
  rationale: ἐπί ከባለቤት አገናዛቢ ጋር በዚህ የመስማት አውድ ዘገባው ወደ ገዢው ትኩረት መድረሱን ያመለክታል።
- source_word: ἡγεμόνος
  choice: ገዢው
  rationale: በሮማውያን አስተዳደር አውድ ἡγεμών የአውራጃውን ገዢ ያመለክታል፤ እዚህም ጲላጦስ ነው።
- source_word: πείσομεν αὐτόν
  choice: እናሳምነዋለን
  rationale: πείθω በመደበኛነት ‘ማሳመን’ ማለት ነው፤ አገላለጹ የማረጋጋትን ፍንጭ ቢኖረውም የግሪኩን ግልጽ ትርጉም ይጠብቃል።
- source_word: ἀμερίμνους
  choice: ከችግር
  rationale: ቃሉ በቀጥታ ‘ከጭንቀት ነጻ’ ማለት ቢሆንም፣ በትረካው አውድ የወታደሮቹን የቅጣት ወይም የሕግ ችግር ያመለክታል።
- source_word: ποιήσομεν
  choice: እናድናችኋለን
  rationale: ποιέω ከተሳቢ ቅጽል ጋር ‘እንዲሆኑ ማድረግ’ የሚል ውጤታዊ ሐሳብ አለው፤ ‘ከችግር ማዳን’ በዘመናዊ አማርኛ ተፈጥሯዊውን ኃይል ያስተላልፋል።
