  text: καὶ συναχθέντες μετὰ τῶν πρεσβυτέρων συμβούλιόν τε λαβόντες ἀργύρια ἱκανὰ ἔδωκαν τοῖς στρατιώταις
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/012.yaml
  text: And after gathering with the elders and taking counsel[a], they gave a considerable sum of silver to the soldiers,
translation:
  language: am
  text: ከሽማግሌዎቹም ጋር ተሰብስበው ከተማከሩ በኋላ፣ ለወታደሮቹ ብዙ የብር ገንዘብ[a] ሰጧቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከፍተኛ መጠን ያለው ብር።” የግሪኩ ቃል በቀጥታ “ብዙ/ከፍተኛ መጠን ያለው ብር” የሚል ሐሳብ ይገልጻል።
    reason: lexical_alternative
lexical_decisions:
- source_word: συναχθέντες
  choice: ተሰብስበው
  rationale: የግሪኩን የአኦሪስት ተሳቢ ቅጽ በተፈጥሯዊ የአማርኛ ተከታታይ ግስ ይገልጻል፤ አንድ ላይ መምጣታቸውንም ያስቀምጣል።
- source_word: μετὰ τῶν πρεσβυτέρων
  choice: ከሽማግሌዎቹም ጋር
  rationale: μετά ከዝርያ ቅጽ ጋር የሚያመለክተውን አብሮነት በቀጥታ ያስተላልፋል፤ “ሽማግሌዎች” በዚህ የመሪነት አውድ የተለመደ ቃል ነው።
- source_word: συμβούλιόν τε λαβόντες
  choice: ከተማከሩ በኋላ
  rationale: ይህ የግሪክ ፈሊጥ አብሮ መምከርንና ውሳኔ ለማድረግ መወያየትን ያመለክታል፤ ተፈጥሯዊ አማርኛ ሆኖ የድርጊቶቹን ቅደም ተከተል ይጠብቃል።
- source_word: ἀργύρια ἱκανὰ
  choice: ብዙ የብር ገንዘብ
  rationale: ἀργύρια የብር ገንዘብን ሲያመለክት፣ ἱκανὰ በዚህ አውድ መጠኑ ከፍተኛ መሆኑን ይገልጻል። “ብዙ” ለዘመናዊ አንባቢ ግልጽና ተፈጥሯዊ ነው።
- source_word: ἔδωκαν
  choice: ሰጧቸው
  rationale: ቀላሉን የአኦሪስት ዋና ግስ በቀጥታ ይተረጉማል፤ የአማርኛው የተውላጠ ስም ቅጥያ ተቀባዮቹን ያመለክታል።
- source_word: τοῖς στρατιώταις
  choice: ለወታደሮቹ
  rationale: στρατιώτης በቀጥታ “ወታደር” ማለት ነው፤ በአውዱ ጠባቂዎች ሆነው ቢሠሩም የምንጩን የቃል ትርጉም ይጠብቃል።
theological_decisions:
- issue: የተሰወረው የድርጊቱ ባለቤት ማንነት
  choice: የብዙ ቁጥር ግሶችን በመጠቀም ባለቤቱን ከቀደመው ቁጥር እንዲታወቅ ማድረግ
  alternative: “የካህናት አለቆች” የሚለውን ስም እንደገና በግልጽ መጨመር
  rationale: የግሪኩ ጽሑፍ ባለቤቱን በዚህ ቁጥር አይደግምም፤ ከማቴዎስ 28፥11 የሚቀጥሉት የካህናት አለቆች ናቸው። ትርጉሙ ይህን ትስስር ሳያብራራ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የተሳቢ ግሶቹ ቅደም ተከተል በተፈጥሯዊ የአማርኛ አወቃቀር ቀርቧል።
