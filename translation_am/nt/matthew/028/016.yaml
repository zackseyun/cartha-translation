  yaml_path: translation/nt/matthew/028/016.yaml
  text: The eleven disciples went to Galilee[a], to the mountain where Jesus had directed them,
translation:
  language: am
  text: አሥራ አንዱ ደቀ መዛሙርትም ወደ ገሊላ፣ ኢየሱስ የመደበላቸው ተራራ ሄዱ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: -ም
  rationale: በትረካው ውስጥ ያለውን ለስላሳ የሽግግርና የቀጣይነት ግንኙነት ያለ ከባድ ተቃርኖ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἕνδεκα μαθηταὶ
  choice: አሥራ አንዱ ደቀ መዛሙርት
  rationale: የይሁዳን መቅረት የሚያሳየውን ትክክለኛ ቁጥር ጠብቆ፣ μαθηταίን በወንጌላት የተለመደው ቃል ይተረጉማል።
- source_word: ἐπορεύθησαν
  choice: ሄዱ
  rationale: በዚህ ትረካ ውስጥ እንቅስቃሴን በቀላልና ተፈጥሯዊ ሁኔታ ይገልጻል።
- source_word: εἰς τὴν Γαλιλαίαν
  choice: ወደ ገሊላ
  rationale: ወደ አንድ ክልል የሚደረግን እንቅስቃሴ በተለመደ አማርኛ ይገልጻል።
- source_word: εἰς τὸ ὄρος
  choice: ወደ ... ተራራ
  rationale: ὄρος የሚለውን መሠረታዊ ትርጉምና በአመልካች አንቀጹ የተወሰነውን ቦታ ይጠብቃል።
- source_word: οὗ
  choice: ወደ ... ነገራቸው ተራራ
  rationale: የቦታውን ዝምድና በአማርኛ ተፈጥሯዊ በሆነ አንጻራዊ አወቃቀር ያቀርባል።
- source_word: ἐτάξατο αὐτοῖς
  choice: እንዲሄዱ ... ነገራቸው
  rationale: ኢየሱስ አስቀድሞ የመሰብሰቢያውን ቦታ እንደገለጸላቸው በግልጽና ተፈጥሯዊ አማርኛ ያሳያል፤ የግሪኩ ቃል ሌሎች ሊሆኑ የሚችሉ ፍቺዎች በማስታወሻ ተጠብቀዋል።
- source_word: ὁ Ἰησοῦς
  choice: ኢየሱስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የስሙን ቅርጽ ይጠቀማል።
theological_decisions:
- issue: ኢየሱስ የስብሰባውን ቦታ እንዴት እንደወሰነ
  choice: እንዲሄዱ ወደ ነገራቸው
