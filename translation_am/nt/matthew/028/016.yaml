  to: አሥራ አንዱ ደቀ መዛሙርትም ወደ ገሊላ፣ ኢየሱስ የመደበላቸው ተራራ ሄዱ።
  rationale: A complete revision is warranted because the existing relative clause fails to express the source syntax and its footnote is structurally and lexically imprecise. The revised wording preserves the mild connective with “-ም,” the definite group of eleven disciples, movement to Galilee, the specific mountain, and Jesus’ earlier designation of that location. The alternate renderings remain in a footnote without imposing a stronger interpretation than the Greek requires.
  reviewer_model: gpt-5.6-terra
