  rationale: አውዱ ኢየሱስ አስቀድሞ ቦታውን እንደገለጸላቸው ያሳያል። ይህ አተረጓጎም ከጽሑፉ በላይ ሥልጣናዊ ወይም ተቋማዊ ትርጉም ሳይጨምር ትረካዊውን ሐሳብ ያስተላልፋል።
