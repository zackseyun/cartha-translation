  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የግሪኩ ለስላሳ የትረካ ሽግግር በ“-ም” ተገልጿል፤ የἐτάξατο የትርጉም ስፋት በማስታወሻ ተጠብቋል።
