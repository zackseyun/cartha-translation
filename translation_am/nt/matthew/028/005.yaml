  terminology: “መልአኩ,” “ሴቶቹ,” “ኢየሱስ,” and “የተሰቀለውን” are appropriate. The phrase “የተሰቀለውን ኢየሱስ” faithfully identifies Jesus by the completed crucifixion without adding theological interpretation.
