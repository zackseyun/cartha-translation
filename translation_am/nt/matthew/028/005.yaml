- source_word: ὁ ἄγγελος
  choice: መልአኩ
  rationale: በትንሣኤው አውድ የተጠቀሰው ሰማያዊ መልአክ ስለሆነ፣ የተለመደውና ትክክለኛው ቃል ነው።
- source_word: ταῖς γυναιξίν
  choice: ለሴቶቹ
  rationale: በአውዱ የታወቁትን ሴቶች የሚያመለክተውን የግሪክ የተወሰነ ቅርጽ ያንጸባርቃል።
- source_word: Μὴ φοβεῖσθε ὑμεῖς
  choice: እናንተስ አትፍሩ
  rationale: ‘እናንተስ’ የሚለው አገላለጽ ግልጽ ተውላጠ ስሙን እና ለሴቶቹ በተለይ የቀረበውን ማጽናኛ በተፈጥሯዊ አማርኛ ያጎላል።
- source_word: οἶδα γὰρ ὅτι
  choice: እንደምትፈልጉ አውቃለሁና
  rationale: γάρ የሚሰጠውን የምክንያት ኃይል ‘-ና’ በሚለው ተፈጥሯዊ የአማርኛ ቅጥያ ይገልጣል።
- source_word: Ἰησοῦν τὸν ἐσταυρωμένον
  choice: የተሰቀለውን ኢየሱስ
  rationale: የተፈጸመውን የስቅለት ድርጊትና አሁንም ያለውን ገላጭ ኃይል በአጭርና በክብር የተሞላ አማርኛ ያስተላልፋል።
- source_word: ζητεῖτε
  choice: ምትፈልጉ
  rationale: በዚህ አውድ በመካሄድ ላይ ያለውን ፍለጋ በተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: በὑμεῖς የተገለጠው አጽንዖት
  choice: “እናንተስ አትፍሩ” ተብሎ በዋናው ጽሑፍ እንዲታይ ተደርጓል።
  alternative: “አትፍሩ” ወይም “እናንተ ሴቶች አትፍሩ”
  rationale: ግልጽ የሆነው የግሪክ ተውላጠ ስም ማጽናኛው በተለይ ወደ ሴቶቹ መቅረቡን ያጎላል፤ ‘-ስ’ ንጽጽሩን ሳይተረጉም ይጠብቃል።
- issue: የτὸν ἐσταυρωμένον ፍጹም ተገብሮ ቦዝ አንቀጽ
  choice: “የተሰቀለውን ኢየሱስ”
  alternative: “የተሰቀለውን የሆነውን ኢየሱስ” ወይም “የተሰቀለው ኢየሱስ”
  rationale: ድርጊቱ መፈጸሙንና ኢየሱስን የሚለይበትን ቀጣይ ገላጭ ኃይል ይጠብቃል፤ ስለ ስቅለቱ ተጨማሪ ሥነ መለኮታዊ ትርጓሜ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ የተፈጥሮ ፍሰት ያለውና ክብርን የጠበቀ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ አጽንዖት ‘እናንተስ’ በሚለው ቅርጽ ተጠብቋል፤ የንግግር መግቢያው ግን ለአማርኛ ተፈጥሯዊ እንዲሆን ከጥቅሱ በኋላ ተቀምጧል።
