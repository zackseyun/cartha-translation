  text: መልአኩ ግን ለሴቶቹ መልሶ፣ “እናንተስ አትፍሩ[a]፤ የተሰቀለውን ኢየሱስ[b] እንደምትፈልጉ አውቃለሁና።” አላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክ እናንተ የሚለው ተውላጠ ስም በግልጽ ተጠቅሷል፤ ማጽናኛው በተለይ ለሴቶቹ መሆኑን ያጎላል።
    reason: lexical_alternative
  - marker: b
