    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: “ብሎ መለሰላቸው”
  rationale: የግሪኩን የትረካ አነጋገር ‘መልሶ አለ’ የሚለውን ትርጉም በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: δὲ
