  yaml_path: translation/nt/matthew/028/011.yaml
  text: While they were going[a], behold[b], some of the guard came into the city and reported to the chief priests everything that had happened.
translation:
  language: am
  text: እነርሱም እየሄዱ ሳሉ፣ እነሆ፣ ከጠባቂዎቹ አንዳንዶቹ ወደ ከተማው ገብተው የሆነውን ሁሉ ለካህናት አለቆች ነገሯቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πορευομένων δὲ αὐτῶν
  choice: እነርሱም እየሄዱ ሳሉ
  rationale: የግሪኩን ጄኒቲቭ አብሶሉት ጊዜያዊ ዳራ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ መድረሻቸውንም አይጨምርም።
- source_word: ἰδού
  choice: እነሆ
  rationale: ድንገተኛና ትኩረት የሚሻ የትረካ ለውጥን የሚያመለክተውን የግሪክ ቃል በተለመደው ክቡር አገላለጽ ይጠብቃል።
- source_word: τινες τῆς κουστωδίας
  choice: ከጠባቂዎቹ አንዳንዶቹ
  rationale: በመቃብሩ የተመደበውን የጥበቃ ቡድንና ከእነርሱ ከፊሎቹ ብቻ መምጣታቸውን ግልጽ ያደርጋል።
- source_word: ἐλθόντες εἰς τὴν πόλιν
  choice: ወደ ከተማው ገብተው
  rationale: ቀድሞ የተፈጸመውን የተያያዘ ድርጊት በተፈጥሯዊ የአማርኛ ተውሳከ ግስ አወቃቀር ያቀርባል።
- source_word: ἀπήγγειλαν
  choice: ነገሩአቸው
  rationale: ለባለሥልጣናቱ የደረሰውን ነገር ማሳወቃቸውን በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τοῖς ἀρχιερεῦσιν
  choice: ለካህናት አለቆች
  rationale: በሁለተኛው ቤተ መቅደስ ዘመን የአይሁድን የካህናት አመራር የሚያመለክተውን መደበኛ የአማርኛ አጠራር ይጠቀማል።
- source_word: ἅπαντα τὰ γενόμενα
  choice: የሆነውን ሁሉ
  rationale: ἅπαντα የሚያጠናክረውን ሙሉነት እና τὰ γενόμενα የሚያመለክተውን የተፈጸሙ ነገሮች በአጭርና ተፈጥሯዊ አገላለጽ ይጠብቃል።
