    text: በቀጥታ፣ «ወደ ... ስም»። የግሪኩ መስተዋድድ «ወደ» የሚል አቅጣጫዊ ኃይል አለው፤ ይህም ወደ ግንኙነት ወይም መለያ መግባትን ሊያጎላ ይችላል።
