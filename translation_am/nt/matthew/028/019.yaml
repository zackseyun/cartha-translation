lexical_decisions:
- source_word: πορευθέντες
  choice: ሂዱ
  rationale: የግሪኩ የቀደመ ተሳቢ ግስ ከዋናው ትእዛዝ ጋር የተቆራኘ የተልእኮ ኃይል አለው፤ «ሂዱ» ይህን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: በቁጥር 18 ከተገለጠው የኢየሱስ ሥልጣን የሚወጣውን ድምዳሜ በግልጽ ያሳያል።
- source_word: μαθητεύσατε
  choice: ደቀ መዛሙርት አድርጉ
  rationale: ግሱ ሌሎችን ተከታዮች ወይም ተማሪዎች እንዲሆኑ ማድረግን ያመለክታል፤ ይህ አገላለጽ አስከታይ ኃይሉን ይጠብቃል።
- source_word: πάντα τὰ ἔθνη
  choice: ሕዝቦችን ሁሉ
  rationale: በዚህ አውድ ἔθνη አይሁድ ያልሆኑትን ብቻ ሳይሆን ሁሉንም የሰው ሕዝቦች ያካትታል፤ «ሕዝቦች» ይህን ሰፊ ወሰን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: βαπτίζοντες
  choice: እያጠመቃችኋቸው
  rationale: ተሳቢ ግሱ ደቀ መዛሙርት የማድረጉን ተግባር ያብራራል፤ «ማጥመቅ» የክርስቲያን ሥርዓቱን ያመለክታል እንጂ የአፈጻጸሙን ዘዴ አስቀድሞ አይወስንም።
- source_word: εἰς τὸ ὄνομα
  choice: ወደ ... ስም
  rationale: εἰς በቀጥታ «ወደ» የሚል አቅጣጫን ያሳያል፤ እዚህም ወደ ግንኙነት ወይም መለያ መግባትን ሊያጎላ ይችላል። አነጋገሩ በአማርኛ እንግዳ ሊመስል ስለሚችል የተለመደው አማራጭ በማስታወሻ ቀርቧል።
- source_word: τοῦ πατρὸς
  choice: አብ
  rationale: በሦስትዮሽ የጥምቀት ቀመር ውስጥ የመለኮታዊ ግል ማዕረግ ነው።
- source_word: τοῦ υἱοῦ
  choice: ወልድ
  rationale: ከአብና ከመንፈስ ቅዱስ ጋር በተቀናጀው ሐረግ ውስጥ የመለኮታዊ ልጅነት ማዕረግን ይወክላል።
- source_word: τοῦ ἁγίου πνεύματος
  choice: መንፈስ ቅዱስ
  rationale: የመለኮታዊውን ግል ማዕረግ በዘመናዊ አማርኛ የሚያቀርብ የተለመደ ትርጉም ነው።
theological_decisions:
- issue: በጥምቀት ቀመሩ ውስጥ εἰς የሚለውን መስተዋድድ መተርጎም
  choice: ወደ ... ስም
  alternative: በ... ስም
  rationale: «ወደ» የግሪኩን አቅጣጫዊ ኃይል ይጠብቃል፣ ወደ ግንኙነት ወይም መለያ መግባትንም ሊያመለክት ይችላል፤ ሆኖም የተለመደውና በአማርኛ ተፈጥሯዊ የሆነው «በ... ስም» ትክክለኛ አማራጭ ሆኖ በማስታወሻ ቀርቧል።
- issue: አንድ «ስም» ከአብ፣ ከወልድና ከመንፈስ ቅዱስ ጋር መገናኘቱ
  choice: ነጠላውን «ስም» ከሦስቱ መለኮታዊ ማዕረጎች ጋር ማቆየት
  alternative: ሐረጉን ወደ ብዙ ስሞች ማስፋት
  rationale: የግሪኩ ጽሑፍ «ስም»ን በነጠላ ቁጥር አስቀምጦ ሦስቱን በተቀናጀ ሁኔታ ይዘረዝራል፤ ትርጉሙ ይህንን ሰዋሰዋዊና ሥነ መለኮታዊ ውጥረት ያለ ተጨማሪ ማብራሪያ ይጠብቃል።
