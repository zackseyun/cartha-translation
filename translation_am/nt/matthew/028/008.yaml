base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/008.yaml
  text: And leaving the tomb quickly[a], with fear and great joy, they ran to report to his disciples.
translation:
  language: am
  text: እነርሱም በፍርሃት[a]ና በታላቅ ደስታ ከመቃብሩ ፈጥነው ወጥተው፣ ለደቀ መዛሙርቱ ሊነግሩ ሮጡ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በአክብሮታዊ ፍርሃትና በታላቅ ደስታ።” በዚህ አውድ የግሪኩ ቃል ከፍ ያለ አክብሮት የተቀላቀለበትን ፍርሃት ወይም ድንጋጤ ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελθοῦσαι
  choice: ወጥተው
  rationale: የሴቶቹን ከመቃብሩ መሄድ በተፈጥሯዊ አማርኛ ያሳያል፤ ከ«ከመቃብሩ» ጋር ሲነበብ የመለየትን አቅጣጫ በግልጽ ይጠብቃል።
- source_word: ταχὺ
  choice: ፈጥነው
  rationale: የድርጊቱን ችኮላ በቀጥታና በዘመናዊ አማርኛ ይገልጣል።
- source_word: μνημείου
  choice: መቃብሩ
  rationale: በትንሣኤው ትረካ የቀብር ስፍራውን የሚያመለክት መደበኛና ግልጽ ቃል ነው።
- source_word: μετὰ φόβου καὶ χαρᾶς μεγάλης
  choice: በፍርሃትና በታላቅ ደስታ
  rationale: ግሪኩ ሁለቱን ስሜቶች አብሮ ያቀርባል፤ ትርጉሙም ፍርሃትን ወደ አድናቆት ብቻ ሳይለውጥ ያንን ውጥረት ይጠብቃል።
- source_word: ἔδραμον
  choice: ሮጡ
  rationale: የግሪኩን ግልጽና ሕያው አካላዊ ድርጊት ያለማዳከም ያስተላልፋል።
- source_word: ἀπαγγεῖλαι
  choice: ሊነግሩ
  rationale: ከ«ሮጡ» ጋር የዓላማ አገላለጽ ሆኖ ይሠራል፤ በግሪኩ ያልተገለጸ ቀጥተኛ ተሳቢ ሳይጨምር ዜናውን ለማድረስ መሄዳቸውን ይገልጣል።
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: ለደቀ መዛሙርቱ
  rationale: በወንጌላት ትረካ ለኢየሱስ ተማሪዎችና ተከታዮች የሚውለውን የተለመደ ግንኙነታዊ ስያሜ ይጠብቃል።
theological_decisions:
- issue: የሴቶቹ ምላሽ ውስጥ ያለው የስሜት ውጥረት
  choice: በፍርሃትና በታላቅ ደስታ
