translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ይጠቀማል። «ደቀ መዛሙርቱ» የታወቀውን መጽሐፍ ቅዱሳዊ ቃል ይጠብቃል፤ የአረፍተ ነገሩ ቅደም ተከተል ግን ለተፈጥሯዊ አማርኛ ንባብ ተስተካክሏል።
