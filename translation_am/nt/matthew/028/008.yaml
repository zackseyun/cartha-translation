  terminology: «መቃብር», «ፍርሃት», «ታላቅ ደስታ», and «ደቀ መዛሙርቱ» are accurate and established terms. The main text correctly preserves φόβος as «ፍርሃት» rather than resolving it into reverence alone. The footnote responsibly notes the contextual possibility of reverential awe without displacing the primary sense.
