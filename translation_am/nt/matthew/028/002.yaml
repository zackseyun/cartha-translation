review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the great earthquake, the angel’s descent from heaven, the approach, the rolling away of the stone, and the continuing posture of sitting on it. However, the Amharic converbal form አንከባሎ can make the stone-rolling read as merely attendant to the sitting, whereas ἀπεκύλισε is a coordinated, completed main action.
  naturalness: The register is clear and suitably formal modern Amharic. Recasting the sequence with ቀርቦም and the finite verb አንከባለለ gives a smoother narrative progression and clearer clause relations.
  terminology: እነሆ, ታላቅ የምድር መናወጥ, and የጌታ መልአክ are appropriate. No theological expansion is introduced.
  issues:
  - severity: low
    issue: The rolling-away action is expressed as a converb (አንከባሎ).
    rationale: The Greek aorist ἀπεκύλισε presents a distinct completed action coordinated with the angel’s approach. A finite Amharic verb more directly preserves this sequence and avoids attaching the action syntactically to the following sitting posture.
  revised_text: እነሆ፣ ታላቅ የምድር መናወጥ ሆነ፤ ምክንያቱም የጌታ መልአክ ከሰማይ ወርዶ፣ ቀርቦም ድንጋዩን አንከባለለ፤ በላዩም ተቀምጦ ነበር።
  revised_footnotes: []
  revision_rationale: The revision preserves all source-level content and the stated interpretation of γάρ while clarifying that the angel approached and then rolled away the stone as a completed action. It retains the imperfect sense of ἐκάθητο with ተቀምጦ ነበር and keeps the pronoun’s referent naturally tied to the stone.
