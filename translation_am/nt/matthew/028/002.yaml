id: MAT.28.2
reference: Matthew 28:2
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ σεισμὸς ἐγένετο μέγας· ἄγγελος γὰρ κυρίου καταβὰς ἐξ οὐρανοῦ ⸀καὶ προσελθὼν ἀπεκύλισε τὸν ⸀λίθον καὶ ἐκάθητο ἐπάνω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/002.yaml
  text: And behold, there was a great earthquake, for an angel of the Lord had come down from heaven and came up and rolled away the stone and was sitting on it.
translation:
  language: am
  text: እነሆ፣ ታላቅ የምድር መናወጥ ሆነ፤ ምክንያቱም የጌታ መልአክ ከሰማይ ወርዶ፣ ቀርቦም ድንጋዩን አንከባለለ፤ በላዩም ተቀምጦ ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: የትረካውን ድንገተኛነትና ትኩረት የሚጠይቀውን ኃይል በተለመደ እና ክቡር የአማርኛ አገላለጽ ያስተላልፋል።
- source_word: σεισμὸς … μέγας
  choice: ታላቅ የምድር መናወጥ
  rationale: σεισμός በዚህ አውድ የምድር መናወጥን ያመለክታል፤ μέγας የክስተቱን ታላቅነት ይጠብቃል።
- source_word: ἄγγελος κυρίου
  choice: የጌታ መልአክ
  rationale: የግሪኩን የባለቤትነት ግንኙነት በቀጥታ ይጠብቃል፤ ጽሑፉ ያልገለጠውን የተለየ መለኮታዊ ማንነት አያስገባም።
- source_word: προσελθὼν
  choice: ቀረበ
  rationale: ቃሉ ወደ ቦታው ወይም ወደ ድንጋዩ መቅረብን ያመለክታል፤ ‘ወደ ላይ መጣ’ የሚል በምንጩ የሌለ አቅጣጫ አያክልም።
- source_word: ἀπεκύλισε τὸν λίθον
  choice: ድንጋዩን አንከባሎ
  rationale: ድንጋዩን በማንከባለል ከቦታው ማስወገዱን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐκάθητο ἐπάνω αὐτοῦ
  choice: በላዩ ተቀምጦ ነበር
  rationale: የኢምፐርፌክት ግሱን ቀጣይ ሁኔታ እና ἐπάνω αὐτοῦ የሚለውን ‘በድንጋዩ ላይ’ ትርጉም ይጠብቃል።
theological_decisions:
- issue: ἄγγελος κυρίου የሚለው ሐረግ ማንነት
  choice: የጌታ መልአክ
  alternative: የጌታው መልአክ / መለኮታዊ መገለጥ በሚል የተስፋፋ አገላለጽ
  rationale: በግሪክ ጽሑፉ ያለውን ብቻ ይተረጉማል፤ መልአኩን ከአንድ የተለየ መለኮታዊ አካል ጋር በትርጉሙ አያስተካክልም።
- issue: የምድር መናወጡና የመልአኩ መውረድ ግንኙነት
  choice: ‘ምክንያቱም’ በማለት γάρን በግልጽ ማስተላለፍ
  alternative: ሁለቱን ክስተቶች ያለ ምክንያታዊ አገናኝ መደርደር
  rationale: γάρ መልአኩ መውረዱ ለቀደመው ክስተት ማብራሪያ እንደሚሰጥ ያሳያል፤ ትርጉሙ ይህን የጽሑፍ ግንኙነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ትረካዊ ትኩረት፣ ምክንያታዊ አገናኝና የመጨረሻው ግስ ቀጣይ ሁኔታ ተጠብቀዋል።
