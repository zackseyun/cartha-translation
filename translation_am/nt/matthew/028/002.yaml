revisions:
- from: እነሆ፣ ታላቅ የምድር መናወጥ ሆነ፤ ምክንያቱም የጌታ መልአክ ከሰማይ ወርዶ ቀረበ፣ ድንጋዩንም አንከባሎ በላዩ ተቀምጦ ነበር።
  to: እነሆ፣ ታላቅ የምድር መናወጥ ሆነ፤ ምክንያቱም የጌታ መልአክ ከሰማይ ወርዶ፣ ቀርቦም ድንጋዩን አንከባለለ፤ በላዩም ተቀምጦ ነበር።
