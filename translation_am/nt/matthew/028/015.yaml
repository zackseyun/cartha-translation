  naturalness: The verse is fluent, modern standard Amharic. ብሩን, ይህ ወሬ, በአይሁድ መካከል, and እስከ ዛሬ ድረስ are natural in this register.
  terminology: ‘አይሁድ’ accurately renders Ἰουδαίοις in its narrative communal sense here and does not itself add a broader judgment. ‘ወሬ’ appropriately conveys λόγος in context; the lexical note preserves ‘ዘገባ’ as an alternative.
