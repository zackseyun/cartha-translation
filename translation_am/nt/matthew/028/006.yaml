  text: οὐκ ἔστιν ὧδε, ἠγέρθη γὰρ καθὼς εἶπεν· δεῦτε ἴδετε τὸν τόπον ὅπου ⸀ἔκειτο·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/006.yaml
  text: He is not here[a], for he has been raised, just as he said. Come[b], see the place where he was lying.
translation:
  language: am
  text: እርሱ እዚህ የለም፤ ተነሥቷልና[a]፣ እንደተናገረው። ኑ፣ ተጋድሞበት የነበረውን[b] ስፍራ እዩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ ግስ በቅርጹ ተደራጊ ነው፤ ‘ተነሥቷል’ ተብሎ ተተርጉሟል። በአንዳንድ ትርጉሞች ‘ተነሣ’ ተብሎ ይቀርባል።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ ‘የተጋደመበትን’ ወይም ‘የተደረገበትን።’
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔστιν ὧδε
  choice: እርሱ በዚህ የለም
  rationale: በአማርኛ ተፈጥሯዊ የሆነውን የቦታ አገላለጽ ይጠቀማል፤ በአውዱ ግልጽ የሆነው ባለቤትም ‘እርሱ’ ተብሎ ተገልጿል።
- source_word: ἠγέρθη
  choice: ተነሥቷል
  rationale: የግሪኩን ተደራጊ ቅርጽ በተቻለ መጠን እየጠበቀ፣ በዘመናዊ አማርኛ ለትንሣኤ ተፈጥሯዊና የተለመደ አገላለጽ ነው።
- source_word: γὰρ
  choice: -ና
  rationale: ከቀደመው ንግግር ጋር ያለውን የምክንያት ግንኙነት በተፈጥሯዊ የአማርኛ አገባብ ያሳያል።
- source_word: καθὼς εἶπεν
  choice: እንደተናገረው
  rationale: የኢየሱስ ቀደምት ቃል እንደተፈጸመ የሚያሳየውን የመመሳሰል ኃይል ይጠብቃል።
- source_word: δεῦτε
  choice: ኑ
  rationale: ለብዙ ሰዎች የቀረበውን ጥሪ በአጭርና ተፈጥሯዊ መንገድ ያቀርባል።
- source_word: ἴδετε
  choice: እዩ
  rationale: ወዲያውኑ በዓይን እንዲመለከቱ የተሰጠውን ብዙ ቁጥር ትእዛዝ ይጠብቃል።
- source_word: τὸν τόπον
  choice: ስፍራ
  rationale: በመቃብሩ ውስጥ ያለውን የተወሰነ አካላዊ ቦታ በክብር ያለውና ግልጽ ቃል ይገልጣል።
- source_word: ὅπου ἔκειτο
  choice: ተኝቶበት የነበረውን
  rationale: የκεῖμαιን ቀጣይ ሁኔታ—በስፍራው ተኝቶ መኖርን—እና የኢምፐርፌክት ገጽታውን ይጠብቃል፤ በድርጊት እንደተቀመጠ ብቻ አይወስንም።
theological_decisions:
