review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the location statement, the causal relation, Jesus' prior saying, and the plural invitation/command. ተነሥቷል is an acceptable conventional Amharic rendering of ἠγέρθη, though it cannot fully reproduce the Greek passive morphology. However, ተኝቶበት የነበረው suggests sleeping and is therefore not the best rendering of κεῖμαι, which here denotes the body's being laid/lying.
  naturalness: እዚህ is more idiomatic than በዚህ in this locative statement. Reordering the clause to place ተነሥቷልና before እንደተናገረው follows the Greek and reads smoothly. ተጋድሞበት የነበረው naturally expresses bodily lying without implying sleep.
  terminology: ስፍራ, ኑ, and እዩ are appropriate modern-standard, dignified terms. The resurrection expression should remain ተነሥቷል; no explicit agent should be added. The existing second footnote's ተቀምጦ ('sitting') is not a valid lexical alternative for κεῖμαι in this context.
  issues:
  - severity: medium
    issue: ተኝቶበት የነበረውን renders ὅπου ἔκειτο
    rationale: ተኝቶ commonly denotes sleeping, whereas κεῖμαι describes being laid or lying. The context concerns the place where Jesus' body lay, not where he slept.
  - severity: medium
    issue: Footnote b includes ‘ተቀምጦበት የነበረውን’
    rationale: ‘Sitting’ changes the bodily posture and has no lexical basis in κεῖμαι here.
  - severity: low
    issue: በዚህ is less idiomatic than እዚህ
    rationale: The source's ὧδε is most naturally rendered by the simple locative adverb እዚህ.
  revised_text: እርሱ እዚህ የለም፤ ተነሥቷልና[a]፣ እንደተናገረው። ኑ፣ ተጋድሞበት የነበረውን[b] ስፍራ እዩ።
