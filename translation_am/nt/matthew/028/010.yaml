  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ታሪካዊ የአሁን ጊዜ በአማርኛ ትረካ ተፈጥሯዊ በሆነ ያለፈ ጊዜ ቀርቧል፤ የዝምድና ቃሉ በትርጓሜ አልተተካም።
