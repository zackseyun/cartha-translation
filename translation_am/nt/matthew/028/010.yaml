  text: τότε λέγει αὐταῖς ὁ Ἰησοῦς· Μὴ φοβεῖσθε· ὑπάγετε ἀπαγγείλατε τοῖς ἀδελφοῖς μου ἵνα ἀπέλθωσιν εἰς τὴν Γαλιλαίαν, κἀκεῖ με ὄψονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/010.yaml
  text: Then Jesus said to them[a], “Do not be afraid. Go, tell my brothers to go to Galilee[c][b], and there they will see me.”
translation:
  language: am
  text: ከዚያም ኢየሱስ፣ “አትፍሩ። ሄዳችሁ ወንድሞቼ ወደ ገሊላ እንዲሄዱ ንገሯቸው፤ በዚያም ያዩኛል” አላቸው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ወንድሞቼ” የሚለው በዚህ ዐውድ የኢየሱስን ደቀ መዛሙርት ያመለክታል፤ የግሪኩ ቃል በወንድ ፆታ ብዙ ቁጥር ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: ከዚያም
  rationale: የትረካውን ቅደም ተከተል በተፈጥሯዊ ዘመናዊ አማርኛ ያመለክታል።
- source_word: λέγει αὐταῖς
  choice: አላቸው
  rationale: የግሪኩን ታሪካዊ የአሁን ጊዜ ለአማርኛ ትረካ ተፈጥሯዊ በሆነ ያለፈ ጊዜ ይገልጣል፤ ዐውዱ ተቀባዮቹ ሴቶች መሆናቸውን ያሳያል።
- source_word: Μὴ φοβεῖσθε
  choice: አትፍሩ
  rationale: ክልከላውን አጭር፣ ግልጽና ተፈጥሯዊ በሆነ አማርኛ ያቀርባል።
- source_word: ὑπάγετε ἀπαγγείλατε
  choice: ሄዳችሁ … ንገሯቸው
  rationale: ሁለቱን ትእዛዞች ጠብቆ የመልእክት ማድረስን በተለመደ አማርኛ ይገልጣል።
- source_word: τοῖς ἀδελφοῖς μου
  choice: ወንድሞቼ
  rationale: የግሪኩን በወንድ ፆታ የተገለጸ ብዙ ቁጥር በቀጥታ ይጠብቃል፤ በዐውዱ የኢየሱስን ደቀ መዛሙርት ያመለክታል።
- source_word: ἵνα ἀπέλθωσιν εἰς τὴν Γαλιλαίαν
  choice: ወደ ገሊላ እንዲሄዱ
  rationale: ἵνα ከንዑስ አንቀጽ ጋር የሚገልጸውን ቀጥተኛ ያልሆነ ትእዛዝ በአማርኛ በተፈጥሯዊ አቀራረብ ያስተላልፋል።
- source_word: κἀκεῖ με ὄψονται
  choice: በዚያም ያዩኛል
  rationale: καί + ἐκεῖ ያለውን ትስስርና ὄψονται ያለውን መሠረታዊ ‘ማየት’ ትርጉም ሳያጠብ ያቀርባል።
theological_decisions:
- issue: “ወንድሞቼ” የሚለው የሚያመለክታቸው
  choice: የኢየሱስ ወንድ ደቀ መዛሙርትን የሚያመለክተውን የዝምድና ቃል በዋናው ጽሑፍ ማቆየት
  alternative: “ደቀ መዛሙርቴ” ብሎ በትርጓሜ መተካት ወይም ሁሉንም ተከታዮች የሚያካትት ሰፊ አገላለጽ መጠቀም
  rationale: ቅርብ ዐውዱ ደቀ መዛሙርቱን ያመለክታል፤ ሆኖም የግሪኩ የዝምድና ቃል ያለውን ሥነ መለኮታዊ ሙቀትና የቃሉን የወንድ ብዙ ቁጥር በዋናው ጽሑፍ ማቆየት ይገባል።
