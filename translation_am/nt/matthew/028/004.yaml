  language: am
  text: ጠባቂዎቹም ከእርሱ ፍርሃት የተነሣ ተንቀጠቀጡ፤ እንደ ሙታንም ሆኑ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እርሱን በመፍራታቸው ጠባቂዎቹ ተንቀጠቀጡ።”
    reason: ἀπό ከገዢ ቅጽ ጋር ምንጭን ወይም ምክንያትን ሊያመለክት ይችላል፤ ይህ አማራጭ የምክንያት ግንኙነቱን በሌላ ተፈጥሯዊ የአማርኛ አወቃቀር ያቀርባል።
lexical_decisions:
- source_word: ἀπὸ δὲ τοῦ φόβου αὐτοῦ
  choice: እርሱንም ከመፍራታቸው የተነሣ
  rationale: ἀπό ከገዢ ቅጽ ጋር በዚህ ስፍራ ምንጭን ወይም ምክንያትን ያመለክታል። በአማርኛ ‘ከመፍራታቸው የተነሣ’ የምክንያቱን ግንኙነት ግልጽና ተፈጥሯዊ አድርጎ ያቀርባል፤ αὐτοῦ ደግሞ በቀደመው አውድ ያለውን መልአክ ያመለክታል። δέ በ‘ም’ እንደ ለስላሳ ትስስር ተንጸባርቋል።
- source_word: ἐσείσθησαν
  choice: ተንቀጠቀጡ
  rationale: σείω እዚህ በፍርሃት ሰውነት መንቀጥቀጥን ያመለክታል። ‘ተንቀጠቀጡ’ ግልጽ፣ ሕያውና በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: οἱ τηροῦντες
  choice: ጠባቂዎቹ
  rationale: ቃል በቃል ‘የሚጠብቁት’ ሲሆን፣ በአውዱ መቃብሩን የሚጠብቁ ወታደሮችን ያመለክታል። ‘ጠባቂዎቹ’ አጭርና ግልጽ ነው።
- source_word: ἐγενήθησαν
  choice: ሆኑ
  rationale: γίνομαι የሁኔታ ለውጥን ያሳያል፤ ‘ሆኑ’ ይህን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ὡς νεκροί
  choice: እንደ ሞቱ ሰዎች
  rationale: ὡς ንጽጽርን እንጂ በእውነት መሞታቸውን አያመለክትም። ‘እንደ ሞቱ ሰዎች’ ይህን ንጽጽር ግልጽ አድርጎ ይጠብቃል።
theological_decisions:
- issue: የαὐτοῦ (‘እርሱን’) አመልካች
  choice: ተውላጠ ስሙ በቀደመው ቁጥር የተገለጠውን መልአክ ያመለክታል።
  alternative: በአጠቃላይ የሰማያዊውን ክስተት ሁሉ ሊያመለክት ይችላል።
  rationale: በቅርብ ያለው አመልካች መልአኩ ነው፤ መልኩም እንደ መብረቅ እንደነበረ በቀደመው ቁጥር ተገልጧል። ትርጉሙ ‘እርሱን’ ብሎ ተውላጠ ስሙን በመጠበቅ የአውዱን ግንኙነት አስቀምጧል።
