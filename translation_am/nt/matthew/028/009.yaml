base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/009.yaml
  text: And behold[a], Jesus met them, saying, “Greetings!” And they came up, took hold of his feet[b], and worshiped him.
translation:
  language: am
  text: እነሆም፣ ኢየሱስ አገኛቸውና፣ “ሰላም ለእናንተ![a]” አላቸው። እነርሱም ቀርበው እግሮቹን ያዙ፤ ሰገዱለትም።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ደስ ይበላችሁ!” የግሪኩ χαίρετε ቃል በቀጥታ የብዙ ቁጥር ትእዛዝ ቢሆንም፣ በዚህ አውድ እንደ ሰላምታ ያገለግላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “አመለኩት” ወይም “በፊቱ በመስገድ ክብር ሰጡት።” የግሪኩ προσεκύνησαν ቃል መስገድን፣ ክብር መስጠትን ወይም ማምለክን ሊያመለክት ይችላል፤ እዚህ የትንሣኤው አውድ የአምልኮ ትርጉሙን ያጠናክራል።
    reason: alternative_reading
