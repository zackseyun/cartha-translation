  rationale: ሴቶቹ ቀጣዮቹን ድርጊቶች ከመፈጸማቸው በፊት ወደ ኢየሱስ መቅረባቸውን በተፈጥሯዊ የአማርኛ ቅደም ተከተል ያሳያል።
- source_word: ἐκράτησαν αὐτοῦ τοὺς πόδας
  choice: እግሮቹን ያዙ
