  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ταχὺ πορευθεῖσαι εἴπατε τοῖς μαθηταῖς αὐτοῦ ὅτι Ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ ἰδοὺ προάγει ὑμᾶς εἰς τὴν Γαλιλαίαν, ἐκεῖ αὐτὸν ὄψεσθε· ἰδοὺ εἶπον ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/007.yaml
  text: And go quickly and tell his disciples, ‘He has been raised from the dead, and look, he is going ahead of you into Galilee. There you will see him.’ Look, I have told you.
translation:
  language: am
  text: ፈጥናችሁም ሄዳችሁ ለደቀ መዛሙርቱ፣ ‘እርሱ ከሙታን ተነሥቷል፤ እነሆ፣ ከእናንተ ቀድሞ ወደ ገሊላ ይሄዳል። በዚያ ታዩታላችሁ’ በሏቸው። እነሆ፣ ነግሬአችኋለሁ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταχὺ πορευθεῖσαι
  choice: ፈጥናችሁም ሄዳችሁ
  rationale: የብዙ ሴቶች ትእዛዝ የሆነውን አስቸኳይ መሄድ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Ἠγέρθη ἀπὸ τῶν νεκρῶν
  choice: እርሱ ከሙታን ተነሥቷል
  rationale: የግሪኩን የተደርጎበት አቀራረብና የትንሣኤውን እውነታ ይጠብቃል።
- source_word: προάγει ὑμᾶς
  choice: ከእናንተ ቀድሞ ... ይሄዳል
  rationale: ኢየሱስ ከእነርሱ ቀድሞ ወደ ገሊላ እንደሚሄድ የሚያመለክተውን ትርጉም በግልጽ ያቀርባል።
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: በሁለቱም ስፍራ ያለውን የትኩረት ጥሪ በክብር ያለውና በቅዱሳት መጻሕፍት የተለመደ አማርኛ ይገልጣል።
- source_word: ἐκεῖ αὐτὸν ὄψεσθε
  choice: በዚያ ታዩታላችሁ
  rationale: ቀጥተኛና ተፈጥሯዊ ትርጉም ሲሆን ተውላጠ ስሙንም በግስ ውስጥ ይጠብቃል።
theological_decisions:
- issue: የἨγέρθη አድራጊ
  choice: ተነሥቷል
  alternative: እግዚአብሔር ከሙታን አስነሥቶታል
  rationale: ግሪኩ የተደርጎበት ግስ ቢጠቀምም አድራጊውን በግልጽ አይሰይምም፤ ትርጉሙም ያልተጠቀሰውን አድራጊ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩ የብዙ ሴቶች አድራሻ በአማርኛው የብዙ ቁጥር ቅርጾች ተጠብቋል።
