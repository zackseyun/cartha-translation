- source_word: αἰῶνος
  choice: ዘመኑ
  rationale: αἰών እዚህ የሚያመለክተውን ዘመን ወይም የጊዜ ሥርዓት ይጠብቃል፤ በተለይ ቁሳዊውን ዓለም አያመለክትም።
