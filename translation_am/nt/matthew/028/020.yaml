  yaml_path: translation/nt/matthew/028/020.yaml
  text: teaching them to keep all that I commanded you. And behold[a], I am with you all the days, until the end of the age.
translation:
  language: am
  text: ያዘዝኋችሁን ሁሉ እንዲጠብቁ እያስተማራችኋቸው። እነሆ፣ እስከ ዘመኑ ፍጻሜ[a] ድረስ በየቀኑ ከእናንተ ጋር ነኝ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በተለምዶ፣ “እስከ ዓለም ፍጻሜ” ተብሎ ይተረጎማል። ግሪኩ ግን የዘመኑን (αἰών) ፍጻሜ ይናገራል እንጂ በተለይ ስለ ቁሳዊው ዓለም አይናገርም።
    reason: alternative_reading
lexical_decisions:
- source_word: διδάσκοντες
  choice: እያስተማራችኋቸው
  rationale: የአሁን ጊዜ ቦዝ አንቀጽ መሆኑንና በቀደመው ቁጥር ያለው ደቀ መዝሙር የማድረግ ተግባር እንዴት እንደሚፈጸም መግለጹን ይጠብቃል።
- source_word: τηρεῖν
  choice: እንዲጠብቁ
  rationale: ትእዛዝን በጥንቃቄ መያዝንና መታዘዝን በአንድነት የሚያስተላልፍ የተለመደ የአማርኛ አገላለጽ ነው።
- source_word: πάντα ὅσα
  choice: ያዘዝኋችሁን ሁሉ
  rationale: የግሪኩን አጠቃላይና ምንም የማያስቀር ወሰን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐνετειλάμην
  choice: ያዘዝኋችሁን
  rationale: የኢየሱስን ሥልጣናዊ ትእዛዝ ያለ አላስፈላጊ ጭከና ያሳያል።
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: ትኩረትን የሚስብና የንግግሩን ክብር የሚጠብቅ ተፈጥሯዊ መጽሐፍ ቅዱሳዊ አገላለጽ ነው።
- source_word: μεθ’ ὑμῶν εἰμι
  choice: ከእናንተ ጋር ነኝ
  rationale: ቀጥተኛውን የአብሮነትና የመገኘት ትርጉም በግልጽ አማርኛ ያቀርባል።
- source_word: πάσας τὰς ἡμέρας
  choice: በየቀኑ
  rationale: ቃል በቃል ‘ቀኖቹን ሁሉ’ የሚለውን ቀን በቀን የሚቀጥል መገኘት ተፈጥሯዊ በሆነ ዘመናዊ አማርኛ ያስተላልፋል።
