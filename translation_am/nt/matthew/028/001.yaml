  rationale: θεωρέω ሆን ብሎ ማየትን ወይም መመልከትን ያመለክታል። “ለማየት” ድርጊቱን እንደ መርመር ከማጋነን ይቆጠባል፤ τάφος ደግሞ በግልጽ ሁኔታ “መቃብር” ተብሏል።
