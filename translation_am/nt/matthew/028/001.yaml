- source_word: τῇ ἐπιφωσκούσῃ εἰς μίαν σαββάτων
  choice: የሳምንቱ የመጀመሪያ ቀን ሊነጋ ሲል
  rationale: ἐπιφώσκω ብርሃን መምጣቱን ወይም መንጋቱን ያመለክታል፤ μίαν σαββάτων ደግሞ የሳምንቱን የመጀመሪያ ቀን የሚያመለክት ሴማዊ አገላለጽ ነው። εἰς የሚያሳየው ወደዚያ ጊዜ መቃረብ በ“ሊነጋ ሲል” ተገልጧል።
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: መግደላዊት ማርያም
  rationale: የቦታ ዝምድናውን የሚያሳየው ማግዳሌኔ በተለመደውና ግልጽ በሆነው የአማርኛ መጠሪያ “መግደላዊት” ተተርጉሟል።
- source_word: ἡ ἄλλη Μαρία
  choice: ሌላይቱ ማርያም
  rationale: ἄλλη በትረካው ውስጥ ከመግደላዊት ማርያም የተለየችውን ማርያም ያመለክታል፤ “ሌላይቱ” ይህን ልዩነት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: θεωρῆσαι τὸν τάφον
