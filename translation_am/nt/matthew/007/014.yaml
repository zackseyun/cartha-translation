id: MAT.7.14
reference: Matthew 7:14
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀ὅτι στενὴ ἡ πύλη καὶ τεθλιμμένη ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ζωήν, καὶ ὀλίγοι εἰσὶν οἱ εὑρίσκοντες αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/014.yaml
  text: For the gate is narrow and the way that leads to life is hard, and few are those who find it.
translation:
  language: am
  text: በሩ ጠባብ ነው፤ ወደ ሕይወት የሚወስደው መንገድም አስቸጋሪ ነውና፣ መንገዱን የሚያገኙትም ጥቂቶች ናቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στενή
  choice: ጠባብ
  rationale: የበሩን ጠባብነት በቀጥታና በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τεθλιμμένη
  choice: አስቸጋሪ
  rationale: ቃሉ በመሠረቱ መጨናነቅን ወይም መጫንን ያመለክታል፤ እዚህ ግን ስለ መንገድ በምሳሌያዊ አጠቃቀም የሚገልጠውን ከባድነት በተፈጥሯዊ ሁኔታ ‘አስቸጋሪ’ ያስተላልፋል።
- source_word: ἀπάγουσα
  choice: የሚወስደው
  rationale: መንገዱ ወደ ሕይወት መድረሻ እንደሚመራ በግልጽ ያሳያል።
- source_word: ζωήν
  choice: ሕይወት
  rationale: ቃሉን ያለ ተጨማሪ ትርጓሜ በቀጥታ ይተረጉማል፣ የ‘ሕይወት’ንም ሙሉ ሥነ መለኮታዊ ስፋት ይጠብቃል።
- source_word: εὑρίσκοντες αὐτήν
  choice: የሚያገኙት
  rationale: የግሪኩ ተውላጠ ስም ከአማርኛው ግስ ጋር ተዋሕዶ መንገዱን እንደሚያመለክት በተፈጥሯዊ አገላለጽ ያስተላልፋል።
theological_decisions:
- issue: ‘ሕይወት’ የሚለው ቃል ወሰን
  choice: ሕይወት
  alternative: ዘላለማዊ ሕይወት
  rationale: የግሪክ ጽሑፍ ‘ሕይወት’ ብቻ ስለሚል፣ ‘ዘላለማዊ’ የሚለውን በመጨመር ትርጓሜውን በጸጥታ አልወሰነም።
- issue: τεθλιμμένη የሚያመለክተው የመንገዱ ባሕርይ
  choice: አስቸጋሪ
  alternative: የተጨናነቀ / ጠባብ
  rationale: ምንጩ የመጫንና የጭንቀት ምስል ቢኖረውም፣ በዚህ አውድ መንገዱን ‘አስቸጋሪ’ ማለት ምሳሌያዊ ኃይሉን ያቆያል፤ ይህም አስቸጋሪነቱን በአንድ የእምነት ሥርዓት ልዩ ትርጓሜ አይገድበውም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የግሪኩን ምክንያታዊ ὅτι በ‘ነውና’ ተጠብቋል፤ የዓረፍተ ነገሩም ትኩረት በበሩና በመንገዱ ላይ ቀርቷል።
