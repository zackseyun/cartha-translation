revisions:
- from: ወደ ሕይወት የሚወስደው በር ጠባብ፣ መንገዱም አስቸጋሪ ነውና፤ የሚያገኙትም ጥቂቶች ናቸው።
  to: በሩ ጠባብ ነው፤ ወደ ሕይወት የሚወስደው መንገድም አስቸጋሪ ነውና፣ መንገዱን የሚያገኙትም ጥቂቶች ናቸው።
  rationale: The revision relocates “ወደ ሕይወት የሚወስደው” so that it modifies “መንገድ,” as in the Greek. It also states the object of “የሚያገኙት” explicitly, preserving αὐτήν’s reference to the way. No footnote is needed because the correction resolves a grammatical attachment error rather than a disputed textual or lexical ambiguity.
