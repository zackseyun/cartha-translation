  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ κατέβη ἡ βροχὴ καὶ ἦλθον οἱ ποταμοὶ καὶ ἔπνευσαν οἱ ἄνεμοι καὶ προσέπεσαν τῇ οἰκίᾳ ἐκείνῃ, καὶ οὐκ ἔπεσεν, τεθεμελίωτο γὰρ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/025.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it did not fall[b], for it had been founded on the rock.
translation:
  language: am
  text: ዝናቡም ወረደ፤ ወንዞቹም መጡ[a]፤ ነፋሳቱም ነፈሱ፤ ያንንም ቤት መቱት[b]። ነገር ግን ቤቱ በዓለቱ ላይ ተመሥርቶ ስለነበር አልወደቀም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የጎርፍ ውኃዎቹም መጡ።” የግሪክኛው ποταμοί በቀጥታ “ወንዞች” ማለት ነው።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በዚያ ቤት ላይ ወደቁ” ወይም “ያንን ቤት ገጩት።”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: ዝናቡም ወረደ
  rationale: καταβαίνω የሚያመለክተውን ወደ ታች መምጣት በተፈጥሯዊ የአማርኛ አገላለጽ ያስተላልፋል።
- source_word: οἱ ποταμοί
  choice: ወንዞቹ
  rationale: ποταμοί በቀጥታ ‘ወንዞች’ ማለት ነው፤ የጎርፍ ውኃ የሚለው በዐውዱ የሚቻል አማራጭ በማስታወሻ ተጠቅሷል።
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: ነፋሳቱም ነፈሱ
  rationale: የግሪክኛውን ግስና ርዕሰ ጉዳይ በቀጥታና በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: προσέπεσαν τῇ οἰκίᾳ ἐκείνῃ
  choice: ያንንም ቤት መቱት
  rationale: በማዕበሉ ዐውድ προσπίπτω የኃይል ግጭትን ያመለክታል፤ ‘መቱት’ ይህን በግልጽና በተፈጥሯዊ አማርኛ ያስተላልፋል፣ ቀጥተኛ አማራጮቹም በማስታወሻ ተጠብቀዋል።
- source_word: οὐκ ἔπεσεν
  choice: አልወደቀም
  rationale: የግሪክኛውን ቀጥተኛ ትርጉም ይጠብቃል፤ ‘አልፈረሰም’ ከሚለው ይልቅ ትርጉሙን አያጠብም።
- source_word: τεθεμελίωτο
  choice: ተመሥርቶ ስለነበር
  rationale: የቤቱ መመሥረት አስቀድሞ ተፈጽሞ የቆየ ሁኔታ መሆኑን የግሪክኛውን የቀድሞ ፍጹም ተደራጊ ቅርጽ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐπὶ τὴν πέτραν
  choice: በዓለቱ ላይ
  rationale: πέτραን ‘ዓለት’ ብሎ በቀጥታ ይተረጉማል፤ ከጽሑፉ በላይ የሆነ ልዩ መለኮታዊ ትርጓሜ አይጨምርም።
theological_decisions:
- issue: የቤቱ መሠረት ምሳሌያዊ ምስል
  choice: በዓለቱ ላይ
  alternative: በጽኑ የዓለት መሠረት ላይ
  rationale: ቁጥሩ ራሱ ዓለቱን ማንነት በግልጽ አይተረጉምም። ስለዚህ ‘ዓለቱ’ የሚለው የምሳሌውን ምስልና ያልተፈታውን መለኮታዊ ውጥረት ይጠብቃል።
