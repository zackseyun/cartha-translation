  text: τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ ἐν τῷ σῷ ὀφθαλμῷ δοκὸν οὐ κατανοεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/003.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: am
  text: ነገር ግን በወንድምህ[b] ዓይን ያለውን ጉድፍ[a] ለምን ታያለህ፣ በራስህ ዓይን ያለውን ምሰሶ[c] ግን አታስተውልም?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ጉድፍ” የተተረጎመው የግሪክ ቃል (κάρφος) “ትንሽ የእንጨት ስንጣሪ፣” “ጭድ” ወይም “ገለባ ቁራጭ” ሊሆንም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: በግሪክ “ወንድም” ይላል፤ የምንጩ ተባዕታይ ነጠላ ቅጽ በትርጉሙ ተጠብቋል።
    reason: lexical_alternative
  - marker: c
    text: “ምሰሶ” የተተረጎመው የግሪክ ቃል (δοκός) “ትልቅ ግንድ” ወይም “ወፍራም ሳንቃ” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: ለምን
  rationale: ከ“ታያለህ” ጋር በዚህ የጥያቄ አገባብ ውስጥ ያለው τί ቃል በቃል “ምን” ሳይሆን የተግሣጽ ጥያቄውን “ለምን” ብሎ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: δὲ
  choice: ነገር ግን … ግን
  rationale: የመጀመሪያው δέ ከቀደመው ንግግር ጋር ያለውን መጠነኛ ተቃርኖ ያሳያል፤ ሁለተኛው δέ ደግሞ በሌላው ዓይንና በራስ ዓይን መካከል ያለውን ንፅፅር ያጠናክራል።
- source_word: βλέπεις
  choice: ታያለህ
  rationale: የዓይንን ምስል በቀጥታ ይጠብቃል፤ ከκατανοεῖς ጋር ያለውን የቃላት ልዩነትም አያጠፋም።
- source_word: κάρφος
  choice: ጉድፍ
  rationale: በዓይን ውስጥ ሊገባ የሚችልን ትንሽ ደረቅ ቅንጣት በተፈጥሯዊ አማርኛ ይገልጣል፤ ከትልቁ ምሰሶ ጋር ያለውን የተጋነነ ንፅፅርም ይጠብቃል።
- source_word: ἀδελφοῦ
  choice: ወንድምህ
  rationale: የግሪኩን ተባዕታይ ነጠላ የዝምድና ቃል በቀጥታ ይወክላል።
- source_word: σῷ
  choice: በራስህ
  rationale: አጽንዖት ያለውን የባለቤትነት ቅጽ በተፈጥሯዊ አማርኛ ይገልጣል፤ ከ“ወንድምህ” ጋር ያለውን ንፅፅርም ግልጽ ያደርጋል።
- source_word: δοκόν
  choice: ምሰሶ
  rationale: δοκός የሚያመለክተውን ትልቅ የሕንፃ እንጨት በትክክል ይገልጣል፤ የንግግሩን ሆን ተብሎ የተጋነነ ምስልም ይጠብቃል።
- source_word: οὐ κατανοεῖς
  choice: አታስተውልም
  rationale: κατανοέω አንድን ነገር በትኩረት ማየትን፣ ማስተዋልን ወይም ልብ ማለትን ያመለክታል። “አታስተውልም” ከ“ታያለህ” ጋር ያለውን የቃላትና የሐሳብ ንፅፅር ይጠብቃል።
- source_word: ὀφθαλμῷ
  choice: ዓይን
  rationale: በዚህ ተጨባጭ ምሳሌያዊ ምስል ውስጥ የὀφθαλμός መደበኛና ግልጽ አቻ ቃል ነው።
