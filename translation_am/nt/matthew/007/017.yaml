review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the distributive sense of πᾶν δένδρον, the good/bad tree-and-fruit parallel, and the contrast marked by δέ. However, እንዲሁም normally includes an additive sense (“likewise/also”) not present in οὕτως; እንዲሁ better conveys “so/thus” here.
  naturalness: The revised wording is idiomatic modern standard Amharic. ያፈራል is the natural verb for a tree producing fruit, and the parallel clauses retain the proverbial cadence.
  terminology: መልካም, የበሰበሰው, and መጥፎ preserve the concrete agricultural image and its contextual moral resonance without interpreting it. No theological terminology requires adjustment.
  issues:
  - severity: low
    issue: እንዲሁም adds an additive nuance.
    rationale: The enclitic -ም can mean “also/too,” whereas οὕτως introduces the stated comparison or conclusion. Removing it preserves the source relation more precisely.
  revised_text: እንዲሁ፣ መልካም ዛፍ ሁሉ መልካም ፍሬ ያፈራል፤ የበሰበሰው ዛፍ ግን መጥፎ ፍሬ ያፈራል።
