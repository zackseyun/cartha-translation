id: MAT.7.17
reference: Matthew 7:17
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὕτως πᾶν δένδρον ἀγαθὸν καρποὺς καλοὺς ποιεῖ, τὸ δὲ σαπρὸν δένδρον καρποὺς πονηροὺς ποιεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/017.yaml
  text: So[a], every good tree produces good fruit[c][b], but the rotten tree produces bad fruit.
translation:
  language: am
  text: እንዲሁ፣ መልካም ዛፍ ሁሉ መልካም ፍሬ ያፈራል፤ የበሰበሰው ዛፍ ግን መጥፎ ፍሬ ያፈራል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: እንዲሁም
  rationale: ከቀደመው ምሳሌ የሚመጣውን ድምዳሜና ተመሳሳይነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: πᾶν δένδρον
  choice: ዛፍ ሁሉ
  rationale: ከነጠላ ስም ጋር ያለውን የπᾶν አከፋፋይ ትርጉም፣ ማለትም ‘እያንዳንዱ ዛፍ’ የሚለውን፣ ይጠብቃል።
- source_word: ἀγαθὸν
  choice: መልካም
  rationale: የዛፉን መልካም ጥራት በሰፊው ይገልጣል፤ ከ‘መልካም ፍሬ’ ጋርም ያለውን ትይዩነት ይጠብቃል።
- source_word: καρποὺς καλοὺς
  choice: መልካም ፍሬ
  rationale: καλός እዚህ የፍሬውን ጥሩነት ያመለክታል፤ ‘መልካም ፍሬ’ በአማርኛ ተፈጥሯዊ ሲሆን የምሳሌውን ሥነ ምግባራዊ ጥላ አያጠፋም።
- source_word: ποιεῖ
  choice: ያፈራል
  rationale: ግሱ ቃል በቃል ‘ያደርጋል/ይሠራል’ ቢሆንም፣ ከዛፍና ፍሬ ጋር ‘ያፈራል’ የተለመደና ትክክለኛ አማርኛ ነው።
- source_word: τὸ δὲ
  choice: ግን
  rationale: በሁለቱ የዛፍ ዓይነቶች መካከል ያለውን ንጽጽር በግልጽ ያሳያል።
- source_word: σαπρὸν
  choice: የበሰበሰው
  rationale: σαπρός የተበላሸ፣ የበሰበሰ ወይም ዋጋ የሌለው ነገር ሊያመለክት ይችላል፤ በዛፍ ምስል ውስጥ ‘የበሰበሰው’ ግልጽና ሕያው ነው።
- source_word: καρποὺς πονηροὺς
  choice: መጥፎ ፍሬ
  rationale: πονηρός መጥፎነትን ወይም ክፋትን ሊያመለክት ይችላል፤ ‘መጥፎ ፍሬ’ ለግብርናዊው ምስል ተፈጥሯዊ ሲሆን የዐውዱን ሥነ ምግባራዊ አንድምታ ይጠብቃል።
theological_decisions:
- issue: የምስሉ ሥነ ምግባራዊ ኃይል ወይስ ግብርናዊ ትርጉም
  choice: የዛፍና የፍሬውን ተጨባጭ ምስል ሳይተረጉሙ በቀጥታ ማቆየት
  alternative: እንደ ‘ቅን ሰው መልካም ሥራ ይሠራል’ በማለት ምስሉን በሥነ ምግባራዊ ፍቺ መተካት
  rationale: ዐውዱ ስለ ሐሰተኛ ነቢያት ቢናገርም፣ የግሪክ ጽሑፉ ምስሉን እንጂ ቀጥተኛ ፍቺውን አይሰጥም፤ ስለዚህ ዐውዱ ሥነ ምግባራዊውን አንድምታ እንዲያቀርብ ተደርጓል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ቀላል የሆነ መደበኛ አማርኛ። ‘ያፈራል’ በዛፍና ፍሬ ዐውድ ተፈጥሯዊ ነው፤ የግሪኩ ተደጋጋሚ አወቃቀርም በሁለቱ ሐረጎች ተጠብቋል።
