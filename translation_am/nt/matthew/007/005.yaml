id: MAT.7.5
reference: Matthew 7:5
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὑποκριτά, ἔκβαλε πρῶτον ⸂ἐκ τοῦ ὀφθαλμοῦ σοῦ τὴν δοκόν⸃, καὶ τότε διαβλέψεις ἐκβαλεῖν τὸ κάρφος ἐκ τοῦ ὀφθαλμοῦ τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/005.yaml
  text: Hypocrite[a], first remove the beam from your eye[b], and then you will see clearly to remove the speck from your brother’s eye.
translation:
  language: am
  text: አንተ ግብዝ፣ በመጀመሪያ ከዓይንህ ውስጥ ያለውን ምሰሶ[a] አውጣ፤ ከዚያም ከወንድምህ ዓይን ውስጥ ያለውን ጉድፍ[b] ለማውጣት በግልጽ ታያለህ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም «ትልቅ ግንድ» ወይም «ሰሌዳ»፤ የግሪኩ ቃል δοκός ትልቅ የሕንፃ እንጨትን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም «ስንጣሪ» ወይም «የገለባ ቁራጭ»፤ κάρφος እንደዚህ ያለ ትንሽ ደረቅ ቅንጣትን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποκριτά
  choice: አንተ ግብዝ
  rationale: የነጠላ ቁጥር ቀጥተኛ ጥሪና ተግሣጽ ነው፤ «አንተ» በአማርኛ የንግግሩን ቀጥተኛነትና ጥንካሬ በተፈጥሮ ያሳያል።
- source_word: ἔκβαλε / ἐκβαλεῖν
  choice: አውጣ / ለማውጣት
  rationale: የዓይንን እንቅፋት ከውስጥ ማስወገድን በተፈጥሯዊ አማርኛ ይገልጣል፤ የቃሉን ድግግሞሽም ይጠብቃል።
- source_word: πρῶτον
  choice: በመጀመሪያ
  rationale: የተግባሮቹን ቅደም ተከተልና ቀዳሚነት በግልጽ ያሳያል።
- source_word: δοκόν
  choice: ምሰሶ
  rationale: δοκός ትልቅ የሕንፃ እንጨት ማለት ነው፤ «ምሰሶ» ከትንሹ κάρφος ጋር ያለውን ሆን ተብሎ የተጋነነ ንፅፅር ይጠብቃል።
- source_word: ὀφθαλμοῦ
  choice: ዓይን
  rationale: በአካላዊው ምሳሌ ውስጥ የὀφθαλμός ቀጥተኛና መደበኛ ትርጉም ነው።
- source_word: διαβλέψεις
  choice: በግልጽ ታያለህ
  rationale: διαβλέπω በግልጽ ማየትን ይጠቁማል፤ ተራውን «ታያለህ» ብቻ ከማለት ይልቅ የግሪኩን የተጠናከረ ስሜት ይጠብቃል።
- source_word: κάρφος
  choice: ጉድፍ
  rationale: በዓይን ውስጥ የገባ ትንሽ ቅንጣትን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል፤ ከ«ምሰሶ» ጋር ያለውን የመጠን ንፅፅር ያስቀምጣል።
- source_word: ἀδελφοῦ
  choice: ወንድምህ
  rationale: የግሪኩን ወንድ ነጠላ የዝምድና ቃል በቀጥታ ይጠብቃል።
theological_decisions:
- issue: ἀδελφοῦ የሚለው ጾታዊ የዝምድና ቃል
  choice: ወንድምህ
  alternative: የሌላው ሰው / የባልንጀራህ
  rationale: የምንጩ ቃል በሰዋስው ወንድ ነጠላ ስለሆነ ሳይጠቃለል «ወንድምህ» ተብሎ ተጠብቋል፤ ይህም በማኅበረ እምነት ውስጥ ያለውን የግንኙነት አውድ ያስተላልፋል።
