  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የኢየሱስ ቀጥተኛ ተግሣጽ፣ የምሰሶና የጉድፍ የተጋነነ ንፅፅር፣ እንዲሁም በመጀመሪያ ራስን መመርመር የሚለው ቅደም ተከተል ተጠብቀዋል።
