id: MAT.7.9
reference: Matthew 7:9
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἢ τίς ⸀ἐστιν ἐξ ὑμῶν ἄνθρωπος, ὃν ⸀αἰτήσει ὁ υἱὸς αὐτοῦ ἄρτον— μὴ λίθον ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/009.yaml
  text: Or what man is there among you whose son asks him for bread[a], and he will give him a stone?
translation:
  language: am
  text: ወይስ ከእናንተ መካከል ወንድ ልጁ ዳቦ ቢጠይቀው፣ ድንጋይ የሚሰጠው ሰው ማን ነው?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ
  choice: ወይስ
  rationale: ከቀደመው ንግግር ጋር በተፈጥሮ የሚያያይዝ ሲሆን፣ ኢየሱስ ሌላ የንጽጽር ጥያቄ ማቅረቡን ያሳያል።
- source_word: τίς ... ἄνθρωπος / ἐξ ὑμῶν
  choice: ከእናንተ መካከል ... ሰው ማን ነው?
  rationale: የክፍልነት ሐረጉን ‘ከእናንተ መካከል’ ብሎ ይጠብቃል፤ ἄνθρωπος እዚህ አንድን ሰው በወካይነት የሚጠቅስ በመሆኑ ‘ሰው’ ተፈጥሯዊና ትክክለኛ ነው።
- source_word: ὁ υἱὸς αὐτοῦ
  choice: ወንድ ልጁ
  rationale: υἱός የሚለውን የወንድ ልጅ ልዩ ትርጉም በግልጽ ያስቀምጣል፤ ‘ልጁ’ ብቻ በአማርኛ ጾታውን አያመለክትም።
- source_word: αἰτήσει
  choice: ቢጠይቀው
  rationale: የግሪኩን የወደፊት ጊዜ ቅርጽ በአማርኛ ተፈጥሯዊ በሆነ አጠቃላይ መላምታዊ ሁኔታ ይገልጻል፤ እዚህ ‘ጠየቀ’ የሚለው አንድ የተፈጸመ ክስተት አይደለም።
- source_word: ἄρτον
  choice: እንጀራ
  rationale: ἄρτος እዚህ ለመብል የሚሰጥ ዳቦን ያመለክታል፤ ‘እንጀራ’ በመደበኛ አማርኛ ለዳቦ/ዋና ምግብ የሚሠራ ተፈጥሯዊ ምርጫ ነው፣ ነገር ግን ‘ምግብ’ ብሎ ከምንጩ በላይ አያሰፋውም።
- source_word: μὴ λίθον ἐπιδώσει αὐτῷ
  choice: ድንጋይ የሚሰጠው
  rationale: ‘ድንጋይ’ ከ‘እንጀራ’ ጋር ያለውን ቀጥተኛ ንጽጽር ይጠብቃል፤ ሙሉው የ‘ማን ነው?’ አገባብ ምንም ሰው እንደማያደርገው የሚጠበቀውን አሉታዊ መልስ በተፈጥሮ ያስተላልፋል።
theological_decisions:
- issue: ወካይ የሆነ የሰው አጠራር
  choice: ሰው
  alternative: ወንድ / ግለሰብ
  rationale: ἄνθρωπος በዚህ አገባብ የቡድኑን አንድ ወካይ ይጠቅሳል። ‘ሰው’ የምንጩን ሰብዓዊ ማጣቀሻ ሳያጠብ በዘመናዊ አማርኛ ተፈጥሯዊ ነው፤ የወንድ ልጁ መጠቀሱ ግን በተለየ ሁኔታ ተጠብቋል።
- issue: μή የሚጠብቀው አሉታዊ መልስ
  choice: ‘የሚሰጠው ሰው ማን ነው?’ የሚል የአጻጻፍ ጥያቄ
  alternative: ‘ድንጋይ ይሰጠዋልን?’
  rationale: የግሪኩ ጥያቄ ‘አይሰጥም’ የሚል መልስ ይጠብቃል። የተመረጠው አማርኛ ይህን አሉታዊ ግፊት በተፈጥሯዊ የአጻጻፍ ጥያቄ ያስተላልፋል፣ መልሱን ግን በግልጽ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ረጅም አንጻራዊ ሐረግ ወደ ተፈጥሯዊው ‘... የሚሰጠው ሰው ማን ነው?’ አገባብ ተዋቅሯል። አስፈላጊ የትርጉም አማራጭ የሌለ በመሆኑ የግርጌ ማስታወሻ አልተጨመረም።
