review_pass:
  verdict: revise
  source_fidelity: The conditional rhetorical-question structure, the representative ‘person’ (ἄνθρωπος), the son, and the stone are conveyed accurately. However, ἄρτος specifically denotes bread/loaf; እንጀራ normally denotes injera in modern standard Amharic and is therefore an unnecessarily culture-specific substitution.
  naturalness: The recast rhetorical question is natural, clear modern Amharic and appropriately carries the negative expectation of μή without adding an explicit negation.
  terminology: 'Replace እንጀራ with ዳቦ, the ordinary unmarked modern Amharic term for bread. No footnote is needed: the English note on representative ‘man’ does not represent a material ambiguity in the Amharic wording ሰው.'
  issues:
  - severity: medium
    issue: እንጀራ for ἄρτον
    rationale: In contemporary Amharic, እንጀራ ordinarily means the distinctive Ethiopian flatbread, whereas the Greek word is the general bread/loaf term in the bread-versus-stone comparison. ዳቦ preserves the source referent without cultural narrowing.
  revised_text: ወይስ ከእናንተ መካከል ወንድ ልጁ ዳቦ ቢጠይቀው፣ ድንጋይ የሚሰጠው ሰው ማን ነው?
