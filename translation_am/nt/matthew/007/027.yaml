review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the sequence of rain descending, rivers coming, winds blowing and striking the house, the house falling, and the greatness of its fall. The footnote appropriately retains the contextual alternative “floods” while preserving the primary lexical sense of ποταμοί as “rivers.”
  naturalness: The verse is generally fluent modern standard Amharic and preserves the rhythmic accumulation of the Greek. However, «አወዳደቁ» is not the most natural noun for πτῶσις in this context. «ውድቀቱ» is the standard, clear noun for the house’s fall/downfall and maintains the cognate relationship with «ወደቀ».
  terminology: «ዝናቡ ወረደ», «ወንዞች መጡ», and «ነፋሶች ነፈሱ» are accurate and idiomatic. «ውድቀቱ» supplies a more conventional and semantically precise rendering of πτῶσις than «አወዳደቁ», without intensifying the warning into destruction or explicit judgment.
  issues:
  - severity: medium
    issue: «አወዳደቁ» for ἡ πτῶσις αὐτῆς
    rationale: Although understandable, «አወዳደቅ» more readily suggests a manner or repeated action of falling and is less idiomatic here. «ውድቀቱ» naturally denotes the fall/downfall of the house, reflects the Greek abstract noun πτῶσις, and corresponds closely to the preceding «ወደቀ».
  revised_text: ዝናቡም ወረደ፤ ወንዞችም[a] መጡ፤ ነፋሶችም ነፈሱና ያን ቤት መቱ። ቤቱም ወደቀ፤ ውድቀቱም ታላቅ ነበር።
