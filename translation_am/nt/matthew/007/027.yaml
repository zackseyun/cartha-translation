id: MAT.7.27
reference: Matthew 7:27
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ κατέβη ἡ βροχὴ καὶ ἦλθον οἱ ποταμοὶ καὶ ἔπνευσαν οἱ ἄνεμοι καὶ προσέκοψαν τῇ οἰκίᾳ ἐκείνῃ, καὶ ἔπεσεν, καὶ ἦν ἡ πτῶσις αὐτῆς μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/027.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it fell—and its fall was great.
translation:
  language: am
  text: ዝናቡም ወረደ፤ ወንዞችም[a] መጡ፤ ነፋሶችም ነፈሱና ያን ቤት መቱ። ቤቱም ወደቀ፤ ውድቀቱም ታላቅ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ጎርፎችም መጡ።» የግሪኩ ስም በቀጥታ «ወንዞች» ማለት ቢሆንም፣ በዚህ አውድ የጎርፍ ውሃዎችን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: ዝናቡ ወረደ
  rationale: καταβαίνω የመውረድን እንቅስቃሴ ያሳያል፤ «ዝናቡ ወረደ» በአማርኛ ተፈጥሯዊ ሲሆን የግሪኩን ቀጥተኛ ምስል ይጠብቃል።
- source_word: ἦλθον οἱ ποταμοί
  choice: ወንዞች መጡ
  rationale: ποταμοί በቀጥታ «ወንዞች» ማለት ነው፤ በአውዱ ግን ጎርፍ ሆነው የተነሱ ውሃዎችን ሊያመለክቱ ስለሚችሉ አማራጩ በማስታወሻ ቀርቧል።
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: ነፋሶች ነፈሱ
  rationale: የግሪኩን ግስና ስም ቀጥተኛና ተፈጥሯዊ በሆነ የአማርኛ አገላለጽ ያስተላልፋል።
- source_word: προσέκοψαν τῇ οἰκίᾳ ἐκείνῃ
  choice: ያን ቤት መቱት
  rationale: በዚህ የአውሎ ነፋስ አውድ προσκόπτω የመጋጨትን ወይም የመምታትን ኃይል ያሳያል፤ «መቱት» አጭር፣ ግልጽና ተፈጥሯዊ ነው።
- source_word: ἔπεσεν
  choice: ወደቀ
  rationale: የπίπτωን ቀላልና ጠንካራ አገላለጽ ሳያሰፋ ይጠብቃል።
- source_word: ἡ πτῶσις αὐτῆς μεγάλη
  choice: አወዳደቁ ታላቅ ነበር
  rationale: πτῶσις ከ«ወደቀ» ጋር ያለውን የቃል ዝምድና «አወዳደቁ» በማለት ይጠብቃል፤ «ታላቅ ነበር» የጥፋቱን ክብደት ሳይተረጉም ያስተላልፋል።
theological_decisions:
- issue: በምሳሌው መደምደሚያ ያለው የፍርድና የጥፋት ምስል
  choice: «አወዳደቁም ታላቅ ነበር» ተብሎ ተተርጉሟል።
  alternative: «ፈጽሞ ወደመ» ወይም ግልጽ የፍጻሜ ፍርድ ትርጓሜ መጨመር
  rationale: ግሪኩ የቤቱ ውድቀት ታላቅ እንደነበር ብቻ ይናገራል። ትርጉሙ የማስጠንቀቂያውን ኃይል ይጠብቃል፤ ነገር ግን ጽሑፉ በግልጽ ያልጨመረውን ሥነ መለኮታዊ ፍቺ አያክልም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ተደጋጋሚው «-ም» የግሪኩን καί ትረካዊ ምት ይጠብቃል፤ ሥርዓተ ነጥቡ ግን ረጅሙን ዓረፍተ ነገር ለአማርኛ ንባብ ግልጽ ያደርገዋል።
