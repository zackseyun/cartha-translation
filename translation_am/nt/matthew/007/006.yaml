  yaml_path: translation/nt/matthew/007/006.yaml
  text: Do not give what is holy to dogs[a], and do not throw your pearls before pigs[d][c][b], lest they trample them under their feet and turn and tear you to pieces.
translation:
  language: am
  text: 'የተቀደሰውን[a] ለውሾች አትስጡ፤ ዕንቁዎቻችሁንም በእርያዎች ፊት አትጣሉ። በእግራቸው እንዳይረግጧቸውና ዞረው እናንተን እንዳይቦጫጭቁ[b]።


    [a] ወይም፣ “ቅዱስ የሆነውን” ወይም “ቅዱሱን ነገር።” የግሪኩ አገላለጽ ሰፊ ትርጉም ያለው ሲሆን፣ በአጠቃላይ የተቀደሰን ወይም ቅዱስ የሆነን ነገር ሊያመለክት ይችላል።


    [b] ወይም፣ “እንዳይቀዳድዷችሁ።”'
  philosophy: optimal-equivalence
