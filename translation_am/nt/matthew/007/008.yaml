id: MAT.7.8
reference: Matthew 7:8
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ αἰτῶν λαμβάνει καὶ ὁ ζητῶν εὑρίσκει καὶ τῷ κρούοντι ⸀ἀνοιγήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/008.yaml
  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: am
  text: ምክንያቱም የሚለምን ሁሉ ይቀበላል፤ የሚፈልግም ያገኛል፤ ለሚያንኳኳም ይከፈትለታል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς
  choice: ሁሉ
  rationale: ከአንቀጽ ያለው ተሳቢ ጋር በመሆን አጠቃላይ ወሰንን ያሳያል፤ «የሚለምን ሁሉ» ተፈጥሯዊና ምንጩን የጠበቀ ነው።
- source_word: γὰρ
  choice: ምክንያቱም
  rationale: ይህ ቁጥር ከቀደመው ማሳሰቢያ ጋር ያለውን የማብራሪያ ግንኙነት ያስጠብቃል።
- source_word: ὁ αἰτῶν
  choice: የሚለምን
  rationale: በዚህ የጸሎት አውድ «መለመን» ጥያቄን በትሕትና ማቅረብን በተፈጥሯዊ አማርኛ ይገልጣል፤ የአሁን ጊዜው አንቀጽም አጠቃላይና ቀጣይ ተግባርን ሊያመለክት ይችላል።
- source_word: λαμβάνει
  choice: ይቀበላል
  rationale: የግሪኩን መደበኛ ትርጉም ይይዛል፤ ከ«ያገኛል» ጋርም ያለውን የቃላት ልዩነት ያስጠብቃል።
- source_word: ὁ ζητῶν
  choice: የሚፈልግ
  rationale: ቀላል፣ ዘመናዊና የግሪኩን ተሳቢ አወቃቀር የሚወክል ነው።
- source_word: εὑρίσκει
  choice: ያገኛል
  rationale: የመፈለግን ውጤት በቀጥታና በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τῷ κρούοντι
  choice: ለሚያንኳኳ
  rationale: የግሪኩን ዳቲቭ በ«ለ-» ይወክላል፤ የማንኳኳትንም ምስል ያስጠብቃል።
- source_word: ἀνοιγήσεται
  choice: ይከፈትለታል
  rationale: የወደፊት ጊዜ ተደራጊ ቅርጹንና ለሚያንኳኳው መከፈቱን በተፈጥሯዊ አማርኛ ያሳያል፤ ግሪኩ ያልጠቀሰውን «በር» አይጨምርም።
theological_decisions:
- issue: የተስፋው ወሰንና ኃይል
  choice: ቃሉን በአጠቃላይ የተገለጸ ማረጋገጫ አድርጎ ማቅረብ
  alternative: እያንዳንዱ የተጠየቀ ነገር በተጠየቀበት መልክ ይሰጣል ብሎ ማፍጠጥ፣ ወይም ተስፋውን በትርጉሙ ውስጥ ለተወሰኑ መንፈሳዊ ጥያቄዎች ብቻ መገደብ
  rationale: πᾶς የሚለው አጠቃላይ ቃል በግልጽ ተተርጉሟል፤ ነገር ግን ትርጉሙ ከአውዱ ውጭ የሆነ ፍጹም ዋስትናን አያስገባም፣ የሥነ መለኮት ገደብንም አይጨምርም።
- issue: በመጨረሻው ሐረግ የሚከፈተው ነገር
  choice: «በር» ሳይጨመር «ይከፈትለታል» ማለት
  alternative: «በሩ ይከፈትለታል» በማለት በምስሉ የተገመተውን ስም በግልጽ መጨመር
  rationale: የግሪኩ ግስ ግልጽ ሰዋሰዋዊ ባለቤት አይጠቅስም። አማርኛው በርን ሳይጨምር ምስሉንና የምንጩን ክፍትነት በተፈጥሯዊ ሁኔታ ያቆያል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ሦስቱን ትይዩ ሐረጎች ለማጉላት ነጠላ ሰረዞች ተጠቅመዋል። «ይከፈትለታል» ያልተጠቀሰውን «በር» ሳይጨምር በአማርኛ የተሟላ ፍቺ ይሰጣል፤ ስለዚህ የግርጌ ማስታወሻ አላስፈለገም።
