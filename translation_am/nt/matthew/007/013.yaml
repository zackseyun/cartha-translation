base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/013.yaml
  text: Enter through the narrow gate[a]. For wide is the gate and broad is the road that leads to destruction[c][b], and many are those who enter through it.
translation:
  language: am
  text: በጠባቡ በር ግቡ፤ በሩ ሰፊ፣ ወደ ጥፋት[a] የሚወስደው መንገድም ሰፊ ነውና፤ በእርሱም[b] የሚገቡ ብዙዎች ናቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ጥፋት» የሚለው «ውድቀት» ወይም «መፍረስ» ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: «በእርሱ» የሚለው በአውዱ በተለምዶ «በዚያ በር» ማለት እንደሆነ ይገባል፤ የግሪኩ ተውላጠ ስም ግን በሰዋስው «በር» ወይም «መንገድ» ሊያመለክት ይችላል።
    reason: referential_ambiguity
lexical_decisions:
- source_word: Εἰσέλθατε
  choice: ግቡ
  rationale: የሁለተኛ መደብ ብዙ ቁጥር ቀጥተኛ ትእዛዝ መሆኑን በተፈጥሯዊና አጭር አማርኛ ያስተላልፋል።
- source_word: διὰ τῆς στενῆς πύλης
  choice: በጠባቡ በር
  rationale: διά ከዘር አመልካች ጋር በመምጣቱ በአንድ ነገር አልፎ መግባትን ያሳያል፤ «ጠባብ በር» የቦታውን ቀጥተኛ ምስል ይጠብቃል።
- source_word: ὅτι
  choice: ነውና
  rationale: ትእዛዙን የሚያብራራውን ምክንያት በተፈጥሯዊ የአማርኛ አገናኝ ይገልጣል።
- source_word: πλατεῖα ἡ πύλη
  choice: በር ሰፊ
  rationale: πλατεῖα በዚህ የቦታ አጠቃቀም «ሰፊ» ማለት ሲሆን ከጠባቡ በር ጋር ያለውን ግልጽ ተቃርኖ ይጠብቃል።
- source_word: εὐρύχωρος ἡ ὁδός
  choice: መንገዱም ሰፊ
  rationale: εὐρύχωρος ሰፊ ወይም ብዙ ቦታ ያለው የሚል ስሜት አለው፤ «ሰፊ» አጭር፣ ወቅታዊና የጉዞውን ምስል የሚጠብቅ ነው።
- source_word: ἡ ἀπάγουσα
  choice: የሚወስደው
  rationale: መንገዱ ወደሚያደርሰው መጨረሻ የሚያመራ መሆኑን የግሪኩን የአሁን ጊዜ አጋማሽ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: εἰς τὴν ἀπώλειαν
  choice: ወደ ጥፋት
  rationale: ἀπώλεια ጥፋትን፣ መፍረስን ወይም ውድቀትን ሊያመለክት ይችላል፤ «ጥፋት» የማስጠንቀቂያውን ክብደት ሳያጠብ ትርጉሙን በአንድ የእምነት ትርጓሜ አይገድበውም።
- source_word: πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς
  choice: በእርሱም የሚገቡ ብዙዎች ናቸው
  rationale: «ብዙዎች» የሚለውን አጽንዖትና የተሳቢውን አወቃቀር ይጠብቃል፤ «በእርሱ» ደግሞ αὐτῆςን ያለ አላስፈላጊ ስም መደገም ይተረጉማል።
theological_decisions:
- issue: በኢየሱስ ማስጠንቀቂያ ውስጥ የἀπώλεια ትርጉም
  choice: ጥፋት
  alternative: ውድቀት፣ መፍረስ
  rationale: ጥቅሱ አስከፊ መጨረሻን ያስጠነቅቃል፣ ነገር ግን የዚያን መጨረሻ ሙሉ ሥነ መለኮታዊ ባሕርይ በዚህ ቦታ አይገልጽም። «ጥፋት» ክብደቱንና ያልተፈታውን የትርጉም ውጥረት ይጠብቃል።
- issue: የαὐτῆς ተውላጠ ስም ማመልከቻ
  choice: በእርሱ
  alternative: በዚያ በር
  rationale: በግሪክ ቋንቋ πύληና ὁδός ሁለቱም እንስታዊ ስሞች ስለሆኑ αὐτῆς በሰዋስው ሁለቱንም ሊያመለክት ይችላል። «በእርሱ» የምንጩን ተውላጠ ስም ይጠብቃል፤ በአውዱ ግን በበር መግባት ተፈጥሯዊው ግንዛቤ ነው።
