  yaml_path: translation/nt/matthew/007/020.yaml
  text: So then[a], you will recognize them by their fruits.
translation:
  language: am
  text: ስለዚህም[a] በፍሬዎቻቸው ታውቋቸዋላችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እንግዲህ ከፍሬዎቻቸው ታውቋቸዋላችሁ።»
    reason: ἄρα γε ያለውን የድምዳሜ ኃይልና ἀπὸ ያለውን ቀጥተኛ «ከ» አገላለጽ የሚያሳይ የቃላት አማራጭ።
lexical_decisions:
- source_word: ἄρα γε
  choice: ስለዚህም
  rationale: ἄρα የማጠቃለያ ወይም የድምዳሜ ኃይልን፣ γε ደግሞ መጠነኛ አጽንዖትን ይሰጣል፤ «ስለዚህም» ሁለቱንም በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἀπὸ
  choice: በ
  rationale: ከἐπιγινώσκω ጋር በዚህ አውድ የመለየትን መሠረት ወይም መንገድ ያመለክታል፤ «በፍሬዎቻቸው» በአማርኛ ተፈጥሯዊ ነው።
- source_word: καρπῶν
  choice: ፍሬዎቻቸው
  rationale: የግሪኩን ብዙ ቁጥርና የፍሬን ዘይቤ ይጠብቃል፤ ቃሉን «ድርጊቶቻቸው» ወይም «ውጤቶቻቸው» ብሎ በትርጓሜ አያጠብም።
- source_word: ἐπιγνώσεσθε
  choice: ታውቋቸዋላችሁ
  rationale: የወደፊት ጊዜንና የሁለተኛ መደብ ብዙ ቁጥርን ይጠብቃል። በዚህ አውድ «ማወቅ» ሰዎቹን በሚታየው ማስረጃ መለየትን ያካትታል።
- source_word: αὐτούς
  choice: -አቸው
  rationale: በግሱ ላይ የተያያዘው የሦስተኛ መደብ ብዙ ቁጥር ተሳቢ ቅጥያ በግሪኩ ያለውን «እነርሱን» በተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: ሰዎችን ለመለየት «ፍሬ» የሚለው ዘይቤ
  choice: የ«ፍሬ» ዘይቤውን መጠበቅ
  alternative: «በድርጊቶቻቸው» ወይም «በውጤቶቻቸው» ብሎ መተርጎም
  rationale: አውዱ በሚታዩ ውጤቶች መለየትን ቢያመለክትም፣ ጽሑፉ ራሱ የፍሬን ዘይቤ ይጠቀማል። ዘይቤውን ማቆየት ከቅርብ አውዱ ጋር ያለውን ትስስር ይጠብቃል፣ ጠባብ የእምነት ትርጓሜም አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። «ታውቋቸዋላችሁ» ከአውዱ የሚገኘውን የመለየት ስሜት ይይዛል፤ የ«ፍሬ» ዘይቤና ብዙ ቁጥር ተጠብቀዋል።
