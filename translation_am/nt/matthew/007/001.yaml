  rationale: ጥቅሱ በራሱ የተከለከለውን ፍርድ ወሰን ሙሉ በሙሉ አይገልጽም፤ ቀጣዩ አውድ ያብራራዋል። ‘መፍረድ’ የሚለውን ማቆየት የግሪኩን ስፋትና የጥቅሱን ሥነ መለኮታዊ ውጥረት ሳያጠብ ያስተላልፋል።
