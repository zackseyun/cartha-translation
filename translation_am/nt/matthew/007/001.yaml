lexical_decisions:
- source_word: Μὴ κρίνετε
  choice: አትፍረዱ
  rationale: μή ከአሁን ጊዜ ትእዛዛዊ ግስ ጋር ክልከላን ያሳያል፤ ፍረደ ደግሞ κρίνω ያለውን ሰፊ የመፍረድ ትርጉም በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἵνα μὴ κριθῆτε
  choice: እንዳይፈረድባችሁ
  rationale: ἵνα ከአሉታዊ ንዑስ አንቀጽ ጋር ዓላማን ወይም ውጤትን ያመለክታል። የተደራጊው ቅርጽ κριθῆτε በተፈጥሯዊ አማርኛ ‘እንዳይፈረድባችሁ’ ተብሎ ቀርቧል፤ ከመጀመሪያው ግስ ጋር ያለውን የቃል ድግግሞሽም ይጠብቃል።
theological_decisions:
