- issue: “በዚያ ቀን” የሚለው የፍጻሜ ዘመን አመልካችነት
  choice: በዚያ ቀን
  alternative: በፍርድ ቀን
  rationale: ዐውዱ የመጨረሻ ፍርድን ቢያመለክትም፣ ግሪኩ “በዚያ ቀን” ብቻ ይላል። ትርጉሙ ይህን የመጽሐፍ ቅዱስ አገላለጽ ሳይዘረጋ ይጠብቃል።
