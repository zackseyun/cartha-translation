  text: πολλοὶ ἐροῦσίν μοι ἐν ἐκείνῃ τῇ ἡμέρᾳ· Κύριε κύριε, οὐ τῷ σῷ ὀνόματι ἐπροφητεύσαμεν, καὶ τῷ σῷ ὀνόματι δαιμόνια ἐξεβάλομεν, καὶ τῷ σῷ ὀνόματι δυνάμεις πολλὰς ἐποιήσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/022.yaml
  text: Many will say to me on that day[a], ‘Lord, Lord, did we not prophesy in your name, and cast out demons in your name, and do many mighty works in your name?’
translation:
  language: am
  text: በዚያ ቀን ብዙዎች፣ “ጌታ ሆይ፣ ጌታ ሆይ፣ በስምህ ትንቢት አልተናገርንምን? በስምህስ አጋንንትን አላወጣንምን? በስምህስ ብዙ የኃይል ሥራዎችን አላደረግንምን?[a]” ይሉኛል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ብዙ ተአምራትን አላደረግንምን?” ወይም፣ “ብዙ የኃይል ድርጊቶችን አላደረግንምን?” የግሪኩ አገላለጽ ቃል በቃል ብዙ “ኃይሎችን” ያመለክታል፤ በወንጌላት ውስጥ ይህ አገላለጽ ብዙ ጊዜ ተአምራዊ ሥራዎችን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: ብዙዎች
  rationale: ግሪኩ ቅጽሉን በስም ተግባር ይጠቀማል፤ “ብዙዎች” ተጨማሪ “ሰዎች” ሳያስገባ ትርጉሙን በተፈጥሮ ያስተላልፋል።
- source_word: ἐροῦσίν μοι
  choice: ይሉኛል
  rationale: የወደፊት ጊዜውንና ለተናጋሪው የሚቀርበውን ንግግር በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: በዚያ ቀን
  rationale: የግሪኩን የጊዜ አገላለጽ በቀጥታ ይጠብቃል፤ ፍርድን የሚያመለክተውን ዐውድ በማብራሪያ አይተካም።
- source_word: Κύριε κύριε
  choice: ጌታ ሆይ፣ ጌታ ሆይ
  rationale: የቀጥታ ጥሪውንና ድግግሞሹ የሚገልጠውን አጽንዖት ይጠብቃል።
- source_word: οὐ ... ἐπροφητεύσαμεν
  choice: ትንቢት አልተናገርንምን?
  rationale: አዎንታዊ መልስ የሚጠብቀውን አሉታዊ ጥያቄ እና προφητεύω የሚለውን መደበኛ ትርጉም ይጠብቃል።
- source_word: τῷ σῷ ὀνόματι
  choice: በስምህ
  rationale: በአንድ ሰው ስም ወይም ሥልጣን መናገርንና መሥራትን በተፈጥሯዊ አማርኛ ይገልጣል፤ በምንጩ ያለው ሦስት ጊዜ ድግግሞሽም ተጠብቋል።
- source_word: δαιμόνια ἐξεβάλομεν
  choice: አጋንንትን አላወጣንምን?
  rationale: ἐκβάλλω ከδαιμόνια ጋር ሲመጣ አጋንንትን ማስወጣትን ያመለክታል፤ ይህም በአማርኛ የተለመደና ግልጽ ነው።
- source_word: δυνάμεις πολλὰς ἐποιήσαμεν
  choice: ብዙ የኃይል ሥራዎችን አላደረግንምን?
  rationale: δύναμις በወንጌላት ውስጥ የኃይል ድርጊቶችን ወይም ተአምራትን ሊያመለክት ይችላል። “የኃይል ሥራዎች” የቃሉን ከኃይል ጋር ያለውን ዝምድና ይጠብቃል፤ አማራጩም በአጭር ማስታወሻ ተገልጿል።
theological_decisions:
- issue: በኢየሱስ የቀጥታ ጥሪ ውስጥ κύριος የሚለውን መተርጎም
  choice: ጌታ
  alternative: መምህር
