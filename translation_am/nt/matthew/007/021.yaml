id: MAT.7.21
reference: Matthew 7:21
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Οὐ πᾶς ὁ λέγων μοι· Κύριε κύριε εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν, ἀλλ’ ὁ ποιῶν τὸ θέλημα τοῦ πατρός μου τοῦ ἐν ⸀τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/021.yaml
  text: Not everyone who says to me[a], ‘Lord, Lord,’ will enter into the kingdom of heaven[b], but the one who does the will of my Father who is in heaven will enter.
translation:
  language: am
  text: “ጌታ ሆይ፣ ጌታ ሆይ” የሚለኝ ሁሉ ወደ ሰማያት መንግሥት[a] አይገባም፤ ነገር ግን በሰማያት ያለውን የአባቴን ፈቃድ የሚያደርግ ይገባል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክ “የሰማያት መንግሥት” ይላል። ማቴዎስ በሌሎች አውዶች “የእግዚአብሔር መንግሥት” ተብሎ የሚገለጸውን ብዙ ጊዜ በዚህ አገላለጽ ይጠራዋል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ πᾶς ὁ λέγων μοι
  choice: የሚለኝ ሁሉ ... አይገባም
  rationale: Οὐ πᾶς የከፊል አሉታ ነው፤ ‘ሁሉም አይደለም’ የሚለውን እንጂ ‘ማንም አይደለም’ የሚለውን አያመለክትም። የአማርኛው ‘... ሁሉ ... አይ-’ አወቃቀር ይህን በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: Κύριε κύριε
  choice: ጌታ ሆይ፣ ጌታ ሆይ
  rationale: κύριος በዚህ የቀጥታ አድራሻ አውድ ‘ጌታ’ ተብሎ ተተርጉሟል፤ ድግግሞሹና የጥሪ ቅርጹ ለአጽንዖት ተጠብቀዋል።
- source_word: εἰσελεύσεται
  choice: ይገባል
  rationale: የወደፊት ጊዜው በአማርኛ አውዳዊ የወደፊት ቅርጽ ‘ይገባል’ በተፈጥሯዊነት ተላልፏል። በሁለተኛው ንዑስ ሐረግ በግሪኩ የተገመተው ግስ ለግልጽነት ተደግሟል።
- source_word: εἰς τὴν βασιλείαν τῶν οὐρανῶν
  choice: ወደ ሰማያት መንግሥት
  rationale: βασιλεία ‘መንግሥት’ ተብሎ፣ የማቴዎስ ባሕርይ የሆነው ብዙ ቁጥር οὐρανῶν ደግሞ ‘ሰማያት’ ተብሎ ተጠብቋል።
- source_word: ἀλλ’ ὁ ποιῶν
  choice: ነገር ግን ... የሚያደርግ
  rationale: የተወሰነው የአሁን ጊዜ አንቀጽ ሰውን በባሕርዩ የሚገልጽ የአማርኛ አንጻራዊ ቅርጽ ተሰጥቶታል፤ ἀλλά የንጽጽሩን ጥንካሬ ለማቆየት ‘ነገር ግን’ ተብሏል።
- source_word: τὸ θέλημα τοῦ πατρός μου
  choice: የአባቴን ፈቃድ
  rationale: θέλημα በሥነ መለኮታዊና ሥነ ምግባራዊ አውዱ ‘ፈቃድ’ ተብሎ ተተርጉሟል፤ ‘አባቴ’ የኢየሱስን የልጅነት አገላለጽ ይጠብቃል።
- source_word: τοῦ ἐν τοῖς οὐρανοῖς
  choice: በሰማያት ያለውን
  rationale: የመስተዋድዱ ሐረግ ‘አባቴን’ እንደሚገልጽ ተጠብቋል፤ የግሪኩ ብዙ ቁጥር ‘ሰማያት’ ተብሎ ተላልፏል።
theological_decisions:
- issue: ወደ መንግሥቱ መግባት፣ ጌታ ብሎ መጥራትና የአብን ፈቃድ ማድረግ ያላቸው ግንኙነት
  choice: ጥቅሱ በቃል ብቻ ‘ጌታ’ ብሎ መጥራትን ከአብ ፈቃድ ማድረግ ጋር እንደሚያነጻጽር በቀጥታ ተተርጉሟል።
  alternative: ጥቅሱን ብቻውን የሥራ ጽድቅን እንደሚያስተምር ወይም የቃል እምነት ብቻ በቂ እንደሆነ መተርጎም።
  rationale: የግሪኩ ጽሑፍ በመናገርና በማድረግ መካከል ያለውን ግልጽ ንጽጽር ያቀርባል፤ ነገር ግን በዚህ ጥቅስ ብቻ ሙሉ የድነት ሥርዓት አይዘረዝርም። ትርጉሙ ማስጠንቀቂያውንና ሥነ መለኮታዊ ውጥረቱን ሳይፈታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ብዙ ቁጥር ‘ሰማያት’ በሁለቱም ቦታዎች ተጠብቋል፤ በዋናው ጽሑፍ የእግር ማስታወሻ ምልክቱ [a] ተካትቷል።
