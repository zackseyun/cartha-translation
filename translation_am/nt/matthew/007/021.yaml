  source_fidelity: The translation accurately preserves the Greek partial negation ('not everyone'), the emphatic repeated vocative, entry into the kingdom of the heavens, and the contrast between verbal address and doing the Father's will. The explicit repetition of ይገባል in the final clause appropriately supplies the Greek ellipsis without adding meaning.
