    issue: ‘ጉድፍ’ for κάρφος
    rationale: In current Amharic, ‘ጉድፍ’ primarily means a flaw, defect, or blemish. It does not naturally identify the small foreign material in an eye required by the concrete imagery of κάρφος and ἐκβάλω.
  - severity: low
    issue: The final clause is made a separate exclamation
    rationale: The source frames ‘and behold, the beam is in your eye’ within the same rhetorical question. Keeping it within the question better reflects the Greek syntax and argument.
