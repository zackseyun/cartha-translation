  rationale: አሉታዊ መልስ የሚጠብቀውን የግሪክ ጥያቄ በአማርኛ የአጻጻፍ ጥያቄ ቅርጽ ያቀርባል።
- source_word: συλλέγουσιν
  choice: ይለቀማል
  rationale: ፍሬን ከተክል መልቀም በዘመናዊ አማርኛ ተፈጥሯዊና ትክክለኛ ነው፤ አጠቃላይ ሰዋዊ ተግባርን በወገንተኛ አልባ ነጠላ ግስ ያቀርባል።
- source_word: ἀκανθῶν
  choice: እሾህ
  rationale: እሾህን ወይም እሾሃማ ተክልን የሚያመለክተውን ቃል በአጭርና በተለመደ አማርኛ ይተረጉማል።
- source_word: σταφυλάς
  choice: ወይን
  rationale: በዐውዱ የወይን ፍሬን የሚያመለክት የተለመደ አማርኛ ቃል ነው።
- source_word: τριβόλων
  choice: ኩርንችት
  rationale: የሚወጋ አረም ወይም እሾሃማ ተክል የሚለውን ትርጉም የሚይዝ ግልጽ የአማርኛ ስያሜ ነው።
- source_word: σῦκα
  choice: በለስ
  rationale: የበለስ ፍሬን የሚጠራው መደበኛ የአማርኛ ቃል ነው።
- source_word: αὐτῶν / αὐτούς
  choice: -ያቸው / -አቸው
  rationale: ተውላጠ ስሞቹ በዐውዱ ወደተጠቀሱት ሰዎች ይመለሳሉ፤ ‘ፍሬያቸው’ እና ‘ታውቋቸዋላችሁ’ ይህን ግላዊ ማጣቀሻ ይጠብቃሉ።
