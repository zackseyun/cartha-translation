lexical_decisions:
- source_word: καρπῶν
  choice: ፍሬ
  rationale: የግሪኩን ተጨባጭ የእርሻ ምስልና ዘይቤያዊ ኃይል ይጠብቃል፤ በአማርኛ ከባለቤት ቅጥያ ጋር ‘ፍሬያቸው’ የተፈጥሮ አገላለጽ ነው።
