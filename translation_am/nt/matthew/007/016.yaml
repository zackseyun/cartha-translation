  text: በፍሬያቸው ታውቋቸዋላችሁ።[a] ሰዎች ከእሾህ የወይን ፍሬዎችን ወይም ከኩርንችት በለስን ይለቅማሉን?[b]
  philosophy: optimal-equivalence
