  text: ⸀Προσέχετε ἀπὸ τῶν ψευδοπροφητῶν, οἵτινες ἔρχονται πρὸς ὑμᾶς ἐν ἐνδύμασι προβάτων ἔσωθεν δέ εἰσιν λύκοι ἅρπαγες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/015.yaml
  text: Beware of false prophets[a], who come to you in sheep’s clothing[c][b], but inwardly are ravenous wolves.
translation:
  language: am
  text: ከሐሰተኛ ነቢያት ተጠንቀቁ[a]፤ እነርሱ የበግ ልብስ ለብሰው[b] ወደ እናንተ ይመጣሉ፤ በውስጣቸው ግን[c] ነጣቂ ተኩላዎች ናቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “ሐሰተኛ ነቢያትን ተጠባበቁ።”
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፦ “በበጎች ልብስ።”
    reason: lexical_alternative
  - marker: c
    text: ወይም፦ “ከውስጥ ግን ነጣቂ ተኩላዎች ናቸው።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε ἀπὸ
  choice: ከ… ተጠንቀቁ
  rationale: የአሁን ጊዜ ትእዛዙ ቀጣይ ንቃትን የሚጠይቅ ማስጠንቀቂያ ነው፤ ይህ አገላለጽም በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: ψευδοπροφητῶν
  choice: ሐሰተኛ ነቢያት
  rationale: የነቢይነት ሥልጣን በሐሰት የሚጠይቁትን ወይም እንደ ነቢያት ሆነው ሐሰት የሚናገሩትን ያመለክታል።
- source_word: οἵτινες ἔρχονται πρὸς ὑμᾶς
  choice: እነርሱ … ወደ እናንተ ይመጣሉ
  rationale: የተጠቀሱትን ሰዎች ባሕርይ የሚገልጠውን አንጻራዊ ሐረግ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐν ἐνδύμασι προβάτων
  choice: የበግ ልብስ ለብሰው
  rationale: ውጫዊ መልካቸው ንጹሕና ጉዳት የሌለው መስሎ እንደሚታይ የሚያሳየውን ምሳሌያዊ ምስል በግልጽ አማርኛ ይጠብቃል።
- source_word: ἔσωθεν δέ
  choice: በውስጣቸው ግን
  rationale: በውጫዊ መልክና በውስጣዊ እውነታ መካከል ያለውን ጠንካራ ንጽጽር ይጠብቃል።
- source_word: λύκοι ἅρπαγες
  choice: ነጣቂ ተኩላዎች
  rationale: ἅρπαγες የመንጠቅ፣ የማጥቃትና የማጥፋት ባሕርይን ይገልጣል፤ ‘ነጣቂ’ የአደገኛ አዳኝነታቸውን ኃይል ሳያለዝብ ያስተላልፋል።
theological_decisions:
- issue: ስለ አታላይ መንፈሳዊ መሪዎች የተሰጠው ማስጠንቀቂያ
  choice: የውጫዊ መልክና የውስጣዊ እውነታ ንጽጽሩን እንደተጻፈ ማቅረብ
  alternative: ጥቅሱን በኋላ ዘመን ከተፈጠረ የተወሰነ የቤተ ክርስቲያን ምድብ ወይም የኑፋቄ ትርጉም ጋር ማጥበብ
  rationale: ግሪኩ ሐሰተኛ ነቢያትን በመልክና በእውነተኛ ባሕርይ መካከል ባለው ተቃርኖ ይገልጣል፤ ትርጉሙ በጽሑፉ ያልተገለጸ የኋላ ዘመን የቡድን ስያሜ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “የበግ ልብስ” የምሳሌውን ምስል ይጠብቃል፤ “ነጣቂ ተኩላዎች” ደግሞ የግሪኩን አደገኛና አጥፊ ኃይል ያስተላልፋል።
