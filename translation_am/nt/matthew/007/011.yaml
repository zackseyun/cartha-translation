  alternative: “የሰማዩ አባታችሁ” ወይም “በሰማይ ያለው አባታችሁ”
  rationale: ትርጉሙ የግሪኩን ስፍራዊ አገላለጽና ብዙ ቁጥር ይጠብቃል፤ ይህም በትምህርተ እምነት ላይ አዲስ ሐሳብ ሳይጨምር የምንጩን ቅርጽ ያንጸባርቃል።
