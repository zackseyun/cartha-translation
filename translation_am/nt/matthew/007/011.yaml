  yaml_path: translation/nt/matthew/007/011.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will your Father in the heavens give good things to those who ask him.
translation:
  language: am
  text: እንግዲህ እናንተ ክፉዎች ሆናችሁ ለልጆቻችሁ መልካም ስጦታዎችን መስጠት ካወቃችሁ፣ በሰማያት ያለው አባታችሁ[a] እርሱን ለሚለምኑት ምንኛ ይልቅ መልካም ነገሮችን[b] ይሰጣቸዋል?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በባህላዊ አገላለጽ “በሰማይ ያለው አባታችሁ” ሊባል ይችላል። የግሪኩ ቃል ግን ብዙ ቁጥር ሲሆን “በሰማያት” ይላል።
    reason: lexical_alternative
  - marker: b
    text: አንዳንድ ትርጉሞች እዚህ “መልካም ስጦታዎችን” ይላሉ፤ የግሪኩ ጽሑፍ ግን “መልካም ነገሮችን” ብቻ ይላል።
    reason: lexical_alternative
