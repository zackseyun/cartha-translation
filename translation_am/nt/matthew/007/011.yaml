  rationale: ጥቅሱ በሰው ክፋትና በአብ ታላቅ ቸርነት መካከል ያለውን ውጥረት ይጠብቃል፤ አያለዝበውም ወይም ወደ ሙሉ የዶክትሪን መግለጫ አያስፋፋውም።
- issue: ὁ ἐν τοῖς οὐρανοῖς የሚለው ሐረግ
