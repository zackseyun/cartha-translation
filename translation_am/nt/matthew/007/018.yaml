id: MAT.7.18
reference: Matthew 7:18
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὐ δύναται δένδρον ἀγαθὸν καρποὺς πονηροὺς ⸀ποιεῖν, οὐδὲ δένδρον σαπρὸν καρποὺς καλοὺς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/018.yaml
  text: A good tree cannot produce bad fruit[c][b][a], nor can a rotten tree produce good fruit.
translation:
  language: am
  text: መልካም ዛፍ መጥፎ ፍሬ ማፍራት አይችልም፤ የበሰበሰ ዛፍም መልካም ፍሬ ማፍራት አይችልም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δένδρον ἀγαθόν
  choice: መልካም ዛፍ
  rationale: ἀγαθός የሚለውን መሠረታዊ የጥራትና የግምገማ ትርጉም ይጠብቃል፤ «ጤናማ ዛፍ» ከሚለው ይልቅ በአውዱ ያለውን ሥነ ምግባራዊ ንጽጽር ሳይገድብ ያቀርባል።
- source_word: οὐ δύναται ... ποιεῖν
  choice: ማፍራት አይችልም
  rationale: δύναται አለመቻልን ይገልጣል፤ ποιεῖν ከκαρπούς ጋር በዛፍ አውድ «ማፍራት» ተብሎ በተፈጥሯዊ አማርኛ ይተረጎማል።
- source_word: καρποὺς πονηρούς
  choice: መጥፎ ፍሬ
  rationale: πονηρός መጥፎ፣ ክፉ ወይም ጎጂ የሚል ስፋት አለው፤ «መጥፎ ፍሬ» ቃል በቃል ምስሉንና አሉታዊ ግምገማውን በተፈጥሯዊ ሁኔታ ይጠብቃል።
- source_word: οὐδέ
  choice: …ም … አይችልም
  rationale: የሁለተኛውን አሉታዊ አንቀጽ ከመጀመሪያው ጋር በትይዩ ያገናኛል፤ በአማርኛ «ዛፍም … አይችልም» የሚለው አወቃቀር ተፈጥሯዊ ነው።
- source_word: δένδρον σαπρόν
  choice: የበሰበሰ ዛፍ
  rationale: σαπρός የመበስበስንና የመበላሸትን ምስል ይይዛል፤ «የበሰበሰ» ይህን ሕያው ምስል ከ«መጥፎ» ይልቅ በግልጽ ያስተላልፋል።
- source_word: καρποὺς καλούς
  choice: መልካም ፍሬ
  rationale: καλός እዚህ ጥሩ ጥራት ያለውን ፍሬ ያመለክታል፤ «መልካም» ከ«መጥፎ» ጋር ያለውን ንጽጽር በግልጽ ይጠብቃል።
theological_decisions:
- issue: በምሳሌው ውስጥ የተገለጸው አለመቻል ባሕርይ
  choice: «ማፍራት አይችልም» በማለት ድርጊቱ እንደማይቻል በቀጥታ ማቅረብ
  alternative: «ብዙውን ጊዜ አያፈራም» ወይም «ማፍራት የለበትም»
  rationale: οὐ δύναται ግልጽ የሆነ አለመቻልን ይገልጣል። ትርጉሙ ይህን ወደ ዕድል ወይም ወደ ሥነ ምግባራዊ ግዴታ አያለዝበውም፤ ከምሳሌው በላይም ተጨማሪ ዶክትሪናዊ መደምደሚያ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ሁለት ትይዩ አሉታዊ አንቀጾችና ጠንካራው «አይችልም» የሚል አገላለጽ ተጠብቀዋል። የእንግሊዝኛው የግርጌ ማስታወሻዎች በአማርኛ ዋና ጽሑፍ ውስጥ አስፈላጊ ያልሆኑ የቃላት አማራጮች ብቻ ስለሆኑ አልተጨመሩም።
