  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የቁጥሩ ማስጠንቀቂያ ቀጥተኛነትና ከማቴዎስ 7፥24 ጋር ያለው ትይዩ አወቃቀር ተጠብቋል።
