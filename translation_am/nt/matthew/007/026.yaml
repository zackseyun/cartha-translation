  verdict: revise
  source_fidelity: The draft conveys the central contrast, house-building image, and location on sand. However, it adds the meaning “that I spoke” to μου τοὺς λόγους τούτους, whereas the Greek says “these words of mine,” and its perfective ሰምቶ does not best represent the generic present participle ὁ ἀκούων. The present ይመስላል also weakens the explicit future of ὁμοιωθήσεται.
  naturalness: The revised wording is natural, clear modern standard Amharic and preserves the compact proverbial comparison. እንደ … ይሆናል clearly expresses the future comparison without an unnatural passive construction.
  terminology: ቃሎቼን preserves both the possessive μου and the demonstrative τούτους when used with እነዚህን. ሞኝ ሰው is a natural representative expression in Amharic; the note accurately records that the Greek comparison employs the masculine noun ἀνήρ.
  issues:
  - severity: medium
    issue: Added “spoken” sense in እኔ የተናገርኳቸውን
    rationale: The source identifies the words as Jesus’ words but does not explicitly describe them as spoken in this clause. The addition is plausible in context but is not required and reduces formal fidelity.
  - severity: medium
    issue: Aspect and tense are not fully retained in ሰምቶ … ይመስላል
    rationale: The Greek uses a generic present participle (“hears”) and a future passive (“will be likened/is to be like”). A present generic conditional construction and an overt future comparison better preserve these forms.
  revised_text: እነዚህን ቃሎቼን የሚሰማ ነገር ግን የማያደርጋቸው ሁሉ፣ ቤቱን በአሸዋ ላይ እንደ ሠራ ሞኝ ሰው[a] ይሆናል።
