  edition: SBLGNT
  text: καὶ πᾶς ὁ ἀκούων μου τοὺς λόγους τούτους καὶ μὴ ποιῶν αὐτοὺς ὁμοιωθήσεται ἀνδρὶ μωρῷ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν ἄμμον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/026.yaml
  text: And everyone who hears these words of mine and does not do them will be like a foolish man[a], who built his house on the sand.
translation:
  language: am
  text: እነዚህን ቃሎቼን የሚሰማ ነገር ግን የማያደርጋቸው ሁሉ፣ ቤቱን በአሸዋ ላይ እንደ ሠራ ሞኝ ሰው[a] ይሆናል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሞኝ ወንድ።” የግሪኩ ጽሑፍ በንጽጽሩ ውስጥ ወንዳዊ ነጠላ ስም ይጠቀማል፤ ንጽጽሩ ግን በአጠቃላይ ለሰዎች ይሠራል።
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ ἀκούων
  choice: ሰምቶ ... ሁሉ
  rationale: ግሪኩ በአሁን ጊዜ አንቀጽ የቀረበ አጠቃላይ ሰውን ያመለክታል፤ ይህ አገላለጽ በአማርኛ ተፈጥሯዊ ሲሆን አጠቃላይ ኃይሉን ይጠብቃል።
- source_word: μου τοὺς λόγους τούτους
  choice: እኔ የተናገርኳቸውን እነዚህን ቃላት
  rationale: የቃላቱ የኢየሱስ መሆንንና የ‘እነዚህ’ን አመልካች አጽንዖት በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: μὴ ποιῶν αὐτούς
  choice: የማያደርጋቸው
  rationale: ποιέω በዚህ አውድ የተሰማውን መፈጸም ወይም በተግባር ማዋል ማለት ነው፤ ‘ማድረግ’ የግሪኩን ቀጥተኛነትና ከቀደመው ቁጥር ጋር ያለውን ትይዩነት ይጠብቃል።
- source_word: ὁμοιωθήσεται
  choice: ይመስላል
  rationale: የወደፊት ጊዜ ንጽጽሩን በተፈጥሯዊ አማርኛ ያስተላልፋል፤ አውዱ የውጤት ንጽጽር መሆኑን ያሳያል።
- source_word: ἀνδρὶ μωρῷ
  choice: ሞኝ ሰው
  rationale: ἀνήρ በንጽጽሩ ውስጥ ወንድ ሰውን ያመለክታል፤ በአማርኛ ‘ሰው’ በአውዱ የተወካይ ሰውን በተፈጥሯዊ ሁኔታ ይገልጣል። ሙሉውን ወንዳዊ ቅርጽ ለማሳወቅ የግርጌ ማስታወሻ ተጨምሯል።
- source_word: ᾠκοδόμησεν αὐτοῦ τὴν οἰκίαν
  choice: ቤቱን ... የሠራ
  rationale: በምሳሌው ያለውን የግንባታ ምስልና የባለቤትነት ግንኙነት በአጭርና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐπὶ τὴν ἄμμον
  choice: በአሸዋ ላይ
  rationale: የግንባታውን መደገፊያ ቦታ በግልጽ ይገልጣል።
theological_decisions:
- issue: በንጽጽሩ ውስጥ ያለው ወንዳዊ ተወካይ ቋንቋ
  choice: ሞኝ ሰው[a]
  alternative: ሞኝ ወንድ
  rationale: ግሪኩ ἀνήρ የሚለውን ወንዳዊ ነጠላ ስም ይጠቀማል፤ ሆኖም ንጽጽሩ በአጠቃላይ ለሚሰማና ለማያደርግ ሁሉ ይሠራል። ‘ሞኝ ሰው’ በዘመናዊ አማርኛ ተፈጥሯዊ ሆኖ የጾታ ቅርጹን በማስታወሻ ሳይደብቅ የተወካይነቱን ኃይል ያቆያል።
