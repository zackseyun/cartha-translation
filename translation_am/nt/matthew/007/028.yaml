  text: እንዲህም ሆነ[b]፤ ኢየሱስ እነዚህን ቃላት[a] መናገሩን በጨረሰ ጊዜ፣ ሕዝቡ በትምህርቱ ተደንቆ ነበር።
  philosophy: optimal-equivalence
  footnotes:
