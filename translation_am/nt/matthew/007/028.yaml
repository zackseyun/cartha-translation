  - marker: b
    text: ቃል በቃል፣ “እንዲህም ሆነ።” ይህ አገላለጽ የትረካውን ቀጣይነትና መሸጋገር ያሳያል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: እንዲህም ሆነ
  rationale: የግሪኩን የትረካ መሸጋገሪያ አገላለጽ በተፈጥሯዊና በክብር ባለው ዘመናዊ አማርኛ ያቀርባል፤ ቀጣዩንም የጊዜ ንዑስ ነገር ይከፍታል።
- source_word: ὅτε ἐτέλεσεν
  choice: ተናግሮ በጨረሰ ጊዜ
  rationale: ኢየሱስ ንግግሩን ወደ ፍጻሜ ማምጣቱንና የጊዜውን ግንኙነት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τοὺς λόγους τούτους
  choice: እነዚህን ቃላት
  rationale: λόγοι የሚለውን ቀጥተኛ ትርጉምና τούτους የሚያመለክተውን ቅርብ ንግግር ይጠብቃል፤ ‘አባባሎች’ የሚለው አማራጭ በማስታወሻ ቀርቧል።
- source_word: ἐξεπλήσσοντο
  choice: እጅግ ተደነቀ
  rationale: የግሱን ጠንካራ የመገረም ስሜት ‘እጅግ’ በማለት ያሳያል፤ የአማርኛው ነጠላ ግስ ከ‘ሕዝቡ’ ከሚለው የስብስብ ስም ጋር ተፈጥሯዊ ነው።
- source_word: οἱ ὄχλοι
  choice: ሕዝቡ
  rationale: የሰዎችን ስብስብ በዘመናዊ አማርኛ ተፈጥሯዊ በሆነ የስብስብ ስም ይገልጣል፤ ‘ሕዝቦቹ’ ቢባል የተለያዩ ብሔሮች ወይም ወገኖች የሚል ያልተፈለገ ስሜት ሊሰጥ ይችላል።
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: በትምህርቱ
  rationale: ἐπί ከዚህ ግስ ጋር የመደነቁን መሠረት ወይም ምክንያት ያሳያል፤ ‘በትምህርቱ’ ይህን በአጭርና ተፈጥሯዊ ሁኔታ ያቀርባል።
theological_decisions:
- issue: ‘እነዚህን ቃላት’ የሚያመለክተው
  choice: ኢየሱስ ከዚህ በፊት የተናገረውን ትምህርት በቀጥታ እንዲያመለክት ተተርጉሟል።
  alternative: ‘ይህን ስብከት’ ብሎ ማስፋት።
  rationale: ግሪኩ ‘ቃላት/አባባሎች’ ይላል እንጂ ለንግግሩ የትርጓሜ ስያሜ አይሰጥም፤ ስለዚህ ትርጉሙ በምንጩ የሌለ ሥነ መለኮታዊ ወይም ሥነ ጽሑፋዊ መለያ አያክልም።
