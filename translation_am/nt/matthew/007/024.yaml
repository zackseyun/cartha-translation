    issue: «ይመስላል» is used for ὁμοιωθήσεται.
    rationale: It can communicate resemblance, but it is not the clearest rendering of the Greek future passive, “will be likened/compared.” «… ጋር ይመሰላል» better reflects both comparison and passive form.
