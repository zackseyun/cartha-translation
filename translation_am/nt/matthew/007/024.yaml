  text: Πᾶς οὖν ὅστις ἀκούει μου τοὺς λόγους τούτους καὶ ποιεῖ αὐτούς, ⸀ὁμοιωθήσεται ἀνδρὶ φρονίμῳ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/024.yaml
  text: Therefore everyone who hears these words of mine and does them will be like a wise man who built his house on the rock[a][b].
translation:
  language: am
  text: ስለዚህ እነዚህን ቃሎቼን ሰምቶ የሚፈጽማቸው ሁሉ፣ ቤቱን በዓለት ላይ ከሠራ ጥበበኛ ወንድ ሰው ጋር ይመሰላል[a][b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ከ… ጋር ይነጻጸራል» ወይም «ከ… ጋር ይመሳሰላል»።
    reason: lexical_alternative
  - marker: b
    text: ግሪኩ «ጥበበኛ ወንድ ሰው» ይላል፤ በምንጩ ውስጥ ያለው ንጽጽር በሰዋስው ተባዕታይ ነው።
    reason: cultural_note
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: ስለዚህ … ሁሉ
  rationale: οὖν ከቀደመው ትምህርት የሚወጣውን ድምዳሜ ያመለክታል፤ Πᾶς … ὅστις ደግሞ እያንዳንዱን የሚያካትት አጠቃላይ አነጋገር ስለሆነ «… ሁሉ» ተብሏል።
- source_word: ἀκούει μου τοὺς λόγους τούτους
  choice: እነዚህን ቃሎቼን ሰምቶ
  rationale: λόγους በቀጥታ «ቃሎች» ተብሎ ተተርጉሟል፤ μου በ«ቃሎቼን» ተጠብቋል። የአማርኛው ተፈጥሯዊ አገባብ ለማስጠበቅ ἀκούει በ«ሰምቶ» ቀርቧል።
- source_word: καὶ ποιεῖ αὐτούς
  choice: የሚፈጽማቸው
  rationale: ποιεῖ እዚህ የተሰማውን ማድረግን ወይም በተግባር መፈጸምን ያመለክታል፤ «የሚፈጽማቸው» ይህን ትርጉም በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ὁμοιωθήσεται
  choice: ይመስላል
  rationale: የወደፊት ጊዜ ተደራጊ ቅርጹ በአማርኛ «ይመስላል» ተብሎ በተፈጥሯዊ ሁኔታ ቀርቧል፤ «ይመሰላል» የሚለው ይበልጥ ቅርጻዊ አማራጭ በማስታወሻ ተጠቅሷል።
- source_word: ἀνδρὶ φρονίμῳ
  choice: ጥበበኛ ሰውን
  rationale: φρόνιμος በዚህ አውድ «ጥበበኛ» ነው። ἀνήρ በግሪኩ ወንድን የሚያመለክት መሆኑ በግርጌ ማስታወሻ ተገልጿል፤ በዋናው ጽሑፍ «ሰው» የሚለው በአማርኛ የምሳሌውን ተፈጥሯዊ ፍሰት ይጠብቃል።
- source_word: ᾠκοδόμησεν αὐτοῦ τὴν οἰκίαν
  choice: ቤቱን … የሠራ
  rationale: οἰκοδομέω በሕንፃ ምስሉ «መሥራት» ነው፤ αὐτοῦ τὴν οἰκίαν በተፈጥሯዊ አማርኛ «ቤቱን» ተብሏል።
- source_word: ἐπὶ τὴν πέτραν
  choice: በዓለት ላይ
  rationale: πέτρα ትልቅና ጠንካራ ዓለትን ያመለክታል፤ «በዓለት ላይ» ምስሉን ሳያጠብ በቀጥታ ያስተላልፋል።
theological_decisions:
- issue: በምሳሌው ውስጥ ያለው ፆታዊ አገላለጽ
  choice: በዋናው ጽሑፍ «ጥበበኛ ሰው»፣ በማስታወሻ የግሪኩ ተባዕታይነት
  alternative: «ጥበበኛ ወንድ»
  rationale: ἀνήρ በትክክል ወንድ ሰውን ያመለክታል። ሆኖም «ጥበበኛ ወንድ» በዘመናዊ አማርኛ እንግዳ ሊመስልና ዕድሜን ወይም ፆታን በተለየ ሁኔታ እያጎላ ሊሰማ ይችላል። «ጥበበኛ ሰው» ተፈጥሯዊነቱን ይጠብቃል፤ የምንጩ ሰዋሰዋዊ ተባዕታይነትም በግርጌ ማስታወሻ በግልጽ ተጠብቋል።
