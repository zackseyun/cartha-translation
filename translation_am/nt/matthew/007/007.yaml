base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/007.yaml
  text: Ask[a], and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: am
  text: “ለምኑ[a]፣ ይሰጣችኋል፤ ፈልጉ፣ ታገኛላችሁ፤ አንኳኩ፣ ይከፈትላችኋል።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ የአሁን ጊዜ ትእዛዞች ቀጣይነት ባለው ስሜትም ሊገቡ ይችላሉ፦ “መለመናችሁን ቀጥሉ… ፍለጋችሁን ቀጥሉ… ማንኳኳታችሁን ቀጥሉ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Αἰτεῖτε
  choice: ለምኑ
  rationale: የሁለተኛ መደብ ብዙ ቁጥር ትእዛዝ መሆኑን በተፈጥሯዊ አማርኛ ያስተላልፋል። በዚህ የጸሎት አውድ ‘ለምኑ’ ከ‘ጠይቁ’ ይልቅ ተስማሚ ሲሆን፣ ቀጣይነቱ በማስታወሻ ተገልጿል።
- source_word: δοθήσεται ὑμῖν
  choice: ይሰጣችኋል
  rationale: የግሪኩን ወደፊት ጊዜና ተቀባዮቹን ያሳያል፤ ሰጪውን እንደ ምንጩ ሳይጠቅስ የመለኮታዊ ተግባር ገላጭ የሆነውን አማርኛ አገባብ ይጠቀማል።
- source_word: ζητεῖτε
  choice: ፈልጉ
  rationale: ትእዛዙንና ቃሉ ሊኖረው የሚችለውን ቀጥተኛም ሆነ ምሳሌያዊ ትርጉም በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: εὑρήσετε
  choice: ታገኛላችሁ
  rationale: የወደፊት ጊዜ ንቁ ግስንና የብዙ ቁጥር ተደራሲዎችን በግልጽ ሁኔታ ያስተላልፋል።
- source_word: κρούετε
  choice: አንኳኩ
  rationale: በበር ማንኳኳትን የሚገልጸው መደበኛና ተፈጥሯዊ የአማርኛ ትእዛዝ ነው።
- source_word: ἀνοιγήσεται ὑμῖν
  choice: ይከፈትላችኋል
  rationale: የግሪኩን ተደራጊ ቅርጽ በአማርኛ የመለኮታዊ ተግባር ገላጭ አገባብ ይጠብቃል፤ ‘-ላችኋል’ የተጠቃሚነት ግንኙነቱን ያሳያል።
- source_word: καὶ
  choice: ፣
  rationale: በእያንዳንዱ ጥንድ ውስጥ ያለው ቅንጅት በአማርኛ በሥርዓተ ነጥብና በተከታታይ አገባብ ተፈጥሯዊ ሆኖ ይገለጣል፤ ‘እና’ን መድገም አማርኛውን ከባድ ያደርገዋል።
theological_decisions:
- issue: የሦስቱ የአሁን ጊዜ ትእዛዞች የድርጊት አኳኋን
  choice: በዋናው ጽሑፍ ቀላል ትእዛዞች—‘ለምኑ፣ ፈልጉ፣ አንኳኩ’—ተጠቅመው ቀጣይነት ያለውን አማራጭ በእግር ማስታወሻ ማቅረብ
  alternative: ‘ለምናችሁ ቀጥሉ… ፈልጋችሁ ቀጥሉ… ማንኳኳታችሁን ቀጥሉ’ ብሎ ቀጣይነቱን በዋናው ጽሑፍ በግልጽ ማስፋት
  rationale: የግሪኩ የአሁን ጊዜ ትእዛዝ ያልተጠናቀቀ ወይም ቀጣይ የድርጊት አኳኋን ሊያመለክት ይችላል፤ ሆኖም ይህን እንደ አስገዳጅ ትርጉም በዋናው ጽሑፍ ማስፋት አያስፈልግም። አጭሩ ትእዛዝ የግሪኩን ኃይልና የሦስቱን ክፍሎች ምት ይጠብቃል።
- issue: በወደፊት ጊዜ ተደራጊ ግሶች ውስጥ የተው አድራጊ
  choice: ሰጪውንና ከፋቹን በስም አለመጥቀስ
  alternative: ‘እግዚአብሔር ይሰጣችኋል… ይከፍትላችኋል’ ብሎ አድራጊውን መግለጽ
  rationale: አውዱ እግዚአብሔርን እንደ ሰጪ ሊያመለክት ቢችልም፣ የግሪኩ ጽሑፍ አድራጊውን በግልጽ አይሰይምም። የአማርኛው የመለኮታዊ ተግባር ገላጭ አገባብ ይህን አለመግለጽ ይጠብቃል።
