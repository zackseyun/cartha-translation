id: MAT.7.10
reference: Matthew 7:10
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀ἢ καὶ ⸂ἰχθὺν αἰτήσει⸃— μὴ ὄφιν ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/010.yaml
  text: Or if he asks for a fish—he will not give him a snake[b][a], will he?
translation:
  language: am
  text: ወይስ ደግሞ ዓሣ ቢለምነው—እባብ ይሰጠዋልን?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ καὶ
  choice: ወይስ
  rationale: በቀደመው ምሳሌ ላይ ሁለተኛ አማራጭ የሆነ የንጽጽር ጥያቄ ይጨምራል፤ «ወይስ» ይህን ቀጣይነትና የጥያቄ ኃይል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἰχθὺν αἰτήσει
  choice: ዓሣ ቢለምነው
  rationale: የወደፊት አመልካቹ እዚህ አጠቃላይ ግምታዊ ሁኔታን ይገልጣል፤ በአማርኛ «ቢለምነው» ይህን በተፈጥሯዊ ሁኔታ ያቀርባል። የግሱ ተሳቢ በአውዱ አባቱ ሲሆን ጠያቂው ልጁ ነው።
- source_word: ὄφιν
  choice: እባብ
  rationale: በዘመናዊ መደበኛ አማርኛ የተለመደውና የግሪኩን የእንስሳ ስም በቀጥታ የሚያስተላልፈው ቃል ነው።
- source_word: ἐπιδώσει αὐτῷ
  choice: ይሰጠዋልን?
  rationale: ግሱ በዚህ አውድ «መስጠት» ማለት ነው፤ የተውላጠ ስሙ ተቀባይ በግሱ ቅጥያ ተገልጧል።
- source_word: μὴ
  choice: ይሰጠዋልን?
  rationale: μή አሉታዊ መልስ የሚጠብቅ የንግግር ጥያቄን ያመለክታል፤ የአማርኛው «-ን?» የጥያቄ ቅጥያ በአውዱ እንዲህ ያለውን «አይሰጥም» የሚል የሚጠበቅ መልስ ይጠብቃል።
theological_decisions:
- issue: የንግግር ጥያቄው ኃይል
  choice: ጥያቄውን «ይሰጠዋልን?» በማለት አሉታዊ መልስ እንደሚጠብቅ ማቆየት
  alternative: «እባብ አይሰጠውም» ብሎ እንደ ቀጥተኛ አረፍተ ነገር መተርጎም
  rationale: ግሪኩ μή ጥያቄው «አይሰጠውም» የሚል መልስ እንደሚጠብቅ ያሳያል። ይህን የጥያቄ ቅርጽ ማቆየት በአውዱ ያለውን የኢየሱስን ከታናሹ ወደ ታላቁ የሚሄድ ክርክር አያዳክምም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ረጅሙ ሰረዝ በሁኔታዊው ክፍልና በዋናው የንግግር ጥያቄ መካከል ያለውን ድንገተኛ አጽንዖት ያሳያል።
