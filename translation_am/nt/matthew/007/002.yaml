id: MAT.7.2
reference: Matthew 7:2
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐν ᾧ γὰρ κρίματι κρίνετε κριθήσεσθε, καὶ ἐν ᾧ μέτρῳ μετρεῖτε μετρηθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/002.yaml
  text: For with the judgment by which you judge[a], you will be judged, and with the measure by which you measure, it will be measured to you.
translation:
  language: am
  text: በምትፈርዱበት ፍርድ ትፈረዳላችሁና፤ በምትሰፍሩበትም መስፈሪያ ይሰፈርላችኋል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «መልሶ ይሰፈርላችኋል።» የግሪክ ጽሑፍ «መልሶ» የሚለውን ቃል በግልጽ ባያካትትም፣ የመመላለስ ሐሳቡ በአገባቡ ውስጥ አለ።
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίματι / κρίνετε / κριθήσεσθε
  choice: ፍርድ / ምትፈርዱበት / ትፈረዳላችሁ
  rationale: የግሪኩን ተዛማጅ ስምና ግሶች በአማርኛውም ከአንድ ሥር በመተርጎም የቃላቱ ድግግሞሽና የመመላለስ ሐሳብ ተጠብቋል። «መኮነን» ከሚለው ይልቅ «መፍረድ» የκρίνωን ሰፊ ትርጉም ይጠብቃል።
- source_word: μέτρῳ / μετρεῖτε / μετρηθήσεται ὑμῖν
  choice: መስፈሪያ / ምትሰፍሩበት / ይሰፈርላችኋል
  rationale: «መስፈሪያ—መስፈር» የሚለው የተዛማጅ ቃላት አጠቃቀም የግሪኩን ምሳሌያዊ የመለኪያ ሐሳብና የቃል ጨዋታ በተፈጥሯዊ አማርኛ ያስተላልፋል። ὑμῖν በ«ላችኋል» ተገልጿል፤ በግሪኩ በግልጽ የሌለው «መልሶ» በዋናው ጽሑፍ አልተጨመረም።
- source_word: ἐν ᾧ ... ἐν ᾧ
  choice: በምትፈርዱበት ... በምትሰፍሩበትም
  rationale: የመሣሪያን ወይም የመመዘኛን ግንኙነት የሚገልጸው ተደጋጋሚ የግሪክ አገባብ በተመጣጠነ የአማርኛ «በ...በት» አወቃቀር ተላልፏል።
- source_word: γὰρ
  choice: -ና
  rationale: ከቁጥር 1 ጋር ያለውን ምክንያታዊ ግንኙነት በተፈጥሯዊው የአማርኛ አገባብ የግሱ መጨረሻ ላይ በተያያዘው «-ና» ያሳያል።
theological_decisions:
- issue: የተመላላሹ ፍርድ ፈጻሚ ማንነት
  choice: «ትፈረዳላችሁ» እና «ይሰፈርላችኋል» የሚሉት ተደራጊ አገባቦች ፈጻሚውን ሳይጠቅሱ ቀርተዋል።
  alternative: «እግዚአብሔር ይፈርድባችኋል» ወይም «ሰዎች ይፈርዱባችኋል» ብሎ ፈጻሚውን በግልጽ መጨመር።
  rationale: የግሪክ ተደራጊ ግሶች ፈጻሚውን አይገልጹም። ትርጉሙም ይህን ክፍትነት ጠብቆ መለኮታዊ ፍርድን ብቻ ወይም የሰዎችን ምላሽ ብቻ አድርጎ አልወሰነውም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ሁለቱ ሐረጎች ትይዩነታቸውን እንዲጠብቁ ተደርጓል፤ «መስፈሪያ/መስፈር» በዘመናዊ አማርኛ የሚገባ ሲሆን የቃሉን ምሳሌያዊ ኃይልም ይጠብቃል።
