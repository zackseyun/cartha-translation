review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the explanatory force of γάρ, the imperfective past sense of ἦν διδάσκων, the object ‘them,’ and the possessive sense in αὐτῶν. However, its final contrast is awkwardly and incompletely expressed: ‘እንደ ጸሐፍቶቻቸው አልነበረም’ makes Jesus himself, rather than his manner of teaching, the direct subject of comparison.'
  naturalness: ‘ሥልጣን እንዳለው ሰው’ is understandable, but ‘ሥልጣን እንዳለው ሰው ሆኖ’ gives the Greek comparative participial sense naturally in modern Amharic. Rendering the negative comparison as ‘እንደ … ሳይሆን’ clearly attaches it to the teaching.
  terminology: ‘ሥልጣን’ appropriately renders ἐξουσία without importing a specific theological explanation. ‘ጸሐፍቶቻቸው’ retains the established direct historical designation for γραμματεῖς and preserves ‘their.’
  issues:
  - severity: medium
    issue: The negative comparison is syntactically unnatural and weakly attached to the teaching action.
    rationale: The Greek says that he taught them in one manner, ‘and not as their scribes.’ The draft’s ‘እንደ ጸሐፍቶቻቸው አልነበረም’ can sound as though Jesus was not like the scribes personally, rather than that his teaching was not like theirs. A participial negative comparison resolves this while retaining the source contrast.
  revised_text: ምክንያቱም ሥልጣን እንዳለው ሰው ሆኖ ያስተምራቸው ነበርና፤ እንደ ጸሐፍቶቻቸው ሳይሆን።
  revised_footnotes:
  - marker: a
    text: ወይም፣ “በሥልጣን።”
    reason: lexical_alternative
  revision_rationale: The revision preserves the ongoing past teaching, the explanatory connection, and the comparison ‘as one having authority.’ It also makes explicit in idiomatic Amharic that the contrast concerns Jesus’ manner of teaching, not merely his personal identity in relation to the scribes. The footnote remains a valid idiomatic alternative for the Greek expression.
