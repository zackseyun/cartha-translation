  yaml_path: translation/nt/matthew/007/029.yaml
  text: for he was teaching them as one having authority[a], and not as their scribes.
translation:
  language: am
  text: ምክንያቱም ሥልጣን እንዳለው ሰው ሆኖ ያስተምራቸው ነበርና፤ እንደ ጸሐፍቶቻቸው ሳይሆን።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν γὰρ διδάσκων
  choice: ምክንያቱም ... ያስተምራቸው ነበር
  rationale: γάρ ከቀደመው ቁጥር ጋር ያለውን ምክንያታዊ ግንኙነት ‘ምክንያቱም’ ያሳያል፤ ἦν ከየአሁን ጊዜ ቦዝ አንቀጽ ጋር የተሠራው የቀድሞ ጊዜ ቀጣይ ድርጊት ‘ያስተምራቸው ነበር’ ተብሎ ተጠብቋል።
- source_word: αὐτούς
  choice: -አቸው
  rationale: ተሰብሳቢዎቹን ወይም አድማጮቹን የሚያመለክተው ቀጥተኛ ተሳቢ በግሱ ላይ በተያያዘ ተውላጠ ስም ተገልጿል።
- source_word: ὡς ἐξουσίαν ἔχων
  choice: ሥልጣን እንዳለው ሰው
  rationale: የግሪኩን የንጽጽር አወቃቀርና ἐξουσία የሚያመለክተውን ትክክለኛ ሥልጣን ይጠብቃል፤ ወደ ተራ ድፍረት አያሳንሰውም።
- source_word: καὶ οὐχ ὡς
  choice: እንጂ፣ እንደ ... አልነበረም
  rationale: በዘመናዊ አማርኛ ተፈጥሯዊ በሆነ የንጽጽር አገላለጽ አዎንታዊውንና አሉታዊውን ክፍል በግልጽ ያነጻጽራል።
- source_word: οἱ γραμματεῖς αὐτῶν
  choice: ጸሐፍቶቻቸው
  rationale: γραμματεῖς በወንጌሉ አውድ የሕግ ሊቃውንት የሆኑትን ጸሐፍት ያመለክታል፤ የባለቤትነት ቅጥያውም αὐτῶνን ጠብቋል።
theological_decisions:
- issue: የኢየሱስ የማስተማር ሥልጣን ባሕርይ
  choice: ‘ሥልጣን እንዳለው ሰው’ በማለት እውነተኛ ሥልጣን እንዳለው በገላጭ መንገድ ማቅረብ
  alternative: ይህን በግልጽ ‘መለኮታዊ ሥልጣን’ ብሎ ማስፋት፣ ወይም ወደ ተራ በራስ መተማመን ማሳነስ
  rationale: ቁጥሩ ሥልጣኑን እውነተኛ አድርጎ ከጸሐፍት ጋር ያነጻጽራል፤ ነገር ግን የሥልጣኑን ሙሉ ሥነ መለኮታዊ መሠረት በዚህ ቁጥር አይገልጽም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ጸሐፍቶቻቸው’ ቀጥተኛውን ታሪካዊ ስያሜ ይጠብቃል፤ የግሪኩ ቀጣይ ያለፈ ጊዜና ንጽጽርም በተፈጥሯዊ አማርኛ ተወክለዋል።
