revisions:
- from: ምክንያቱም እርሱ ሥልጣን እንዳለው ሰው[a] ያስተምራቸው ነበር እንጂ፣ እንደ ጸሐፍቶቻቸው አልነበረም።
  to: ምክንያቱም ሥልጣን እንዳለው ሰው ሆኖ ያስተምራቸው ነበርና፤ እንደ ጸሐፍቶቻቸው ሳይሆን።
  rationale: The revision preserves the ongoing past teaching, the explanatory connection, and the comparison ‘as one having authority.’ It also makes explicit in idiomatic Amharic that the contrast concerns Jesus’ manner of teaching, not merely his personal identity in relation to the scribes. The footnote remains a valid idiomatic alternative for the Greek expression.
