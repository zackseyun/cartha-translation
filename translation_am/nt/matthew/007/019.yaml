  rationale: εἰς ወደ ውስጥ የሚደረግ እንቅስቃሴን፣ βάλλεται ደግሞ ተደራጊውን «ይጣላል» ያሳያል። ግሪኩ በπῦρ ላይ መስተዋድድ ስለሌለው «ወደ እሳት» የሚለው አሻሚነቱን ይጠብቃል።
theological_decisions:
