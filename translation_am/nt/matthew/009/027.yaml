base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/027.yaml
  text: And as Jesus was passing on from there[a], two blind men followed him, crying out and saying, “Have mercy on us, Son of David.”
translation:
  language: am
  text: ኢየሱስም ከዚያ ሲያልፍ፣ ሁለት ዕውሮች እየጮኹ፣ “የዳዊት ልጅ ሆይ፣[a] ማረን!” እያሉ ተከተሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የዳዊት ልጅ” ኢየሱስ የተስፋ ቃሉ የተሰጠው የዳዊት ዘር ወራሽ መሆኑን የሚያመለክት ንጉሣዊና መሲሐዊ ማዕረግ ነው።
    reason: cross_reference
lexical_decisions:
- source_word: παράγοντι ἐκεῖθεν τῷ Ἰησοῦ
  choice: ኢየሱስም ከዚያ እያለፈ ሲሄድ
  rationale: የድርጊቶቹን በአንድ ጊዜ መከናወንና ኢየሱስ ከዚያ ስፍራ ወደ ፊት መጓዙን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἠκολούθησαν αὐτῷ
  choice: ተከተሉት
  rationale: እዚህ ያለውን በአካል ተከትሎ መሄድ በቀጥታና በተለመደ አገላለጽ ይገልጣል።
- source_word: δύο τυφλοὶ
  choice: ሁለት ዕውሮች
  rationale: የግሪኩን ብዛትና የዓይነ ስውርነት መግለጫ በአጭርና በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: κράζοντες καὶ λέγοντες
  choice: እየጮኹ፣ … እያሉ
  rationale: የጥሪያቸውን ከፍተኛ ድምፅና አጣዳፊነት ይጠብቃል፤ ሁለቱንም የግሪክ ተሳቢ ግሶች በተፈጥሯዊ አማርኛ ያንጸባርቃል።
- source_word: Ἐλέησον ἡμᾶς
  choice: ማረን!
  rationale: ቀጥተኛውን የምሕረት ልመና በአማርኛ የተለመደና ኃይለኛ አገላለጽ ያስተላልፋል።
- source_word: υἱὲ Δαυίδ
  choice: የዳዊት ልጅ ሆይ
  rationale: ቃሉን ወደ ‘ዘር’ በማብራራት ሳይተካ ባሕላዊውን ንጉሣዊና መሲሐዊ ማዕረግ ይጠብቃል።
theological_decisions:
- issue: ‘የዳዊት ልጅ’ የሚለው መሲሐዊ ፍቺ
  choice: በዋናው ጽሑፍ ‘የዳዊት ልጅ ሆይ’ ብሎ እንደ ማዕረግ ማቅረብ
  alternative: ‘የዳዊት ዘር የሆንክ መሲሕ’ የሚል ትርጓሜያዊ አገላለጽ
  rationale: የግሪኩ ጽሑፍ ባሕላዊውን ማዕረግ ያለ ተጨማሪ ማብራሪያ ይጠቀማል። ማዕረጉን እንዳለ ማቆየት ንጉሣዊና መሲሐዊ ድምፁን ሳይጠፋ የማቴዎስ ትረካ ፍቺውን እንዲያብራራ ያደርጋል።
