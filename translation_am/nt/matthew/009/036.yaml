  text: Ἰδὼν δὲ τοὺς ὄχλους ἐσπλαγχνίσθη περὶ αὐτῶν ὅτι ἦσαν ἐσκυλμένοι καὶ ἐρριμμένοι ⸀ὡσεὶ πρόβατα μὴ ἔχοντα ποιμένα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/036.yaml
  text: And when he saw the crowds[a], he had compassion on them, because they were harassed and cast down, like sheep without a shepherd.
translation:
  language: am
  text: ሕዝቡንም ባየ ጊዜ፣ እረኛ እንደሌላቸው በጎች የተጨነቁና የተጣሉ[a] ስለነበሩ ራራላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የተጎሳቆሉና አቅመ ቢስ የሆኑ»። የግሪኩ ቃላት ሕዝቡ በመከራ እንደደከመና ራሱን መርዳት እንዳልቻለ በትርጓሜ ሊገልጹ ይችላሉ።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν δὲ τοὺς ὄχλους
  choice: ሕዝቡንም ባየ ጊዜ
  rationale: የአኦሪስት አንቀጽን በተፈጥሯዊ የጊዜ ሐረግ ይገልጻል፤ δέ የትረካ አያያዥ በሆነው «-ም» ተወክሏል። ὄχλοι ብዙ ተሰብሳቢዎችን ቢያመለክትም «ሕዝቡ» በዚህ አውድ ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
- source_word: ἐσπλαγχνίσθη περὶ αὐτῶν
  choice: አዘነላቸው
  rationale: ጥልቅ ርኅራኄንና ልባዊ መራራትን በአጭር፣ በተፈጥሯዊና በክብር ባለው ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ὅτι ἦσαν ἐσκυλμένοι καὶ ἐρριμμένοι
  choice: ተንገላተውና ወድቀው ስለነበሩ
  rationale: ὅτι የርኅራኄውን ምክንያት በ«ስለ» ያሳያል። «ተንገላተው» መጎሳቆልንና መድከምን፣ «ወድቀው» ደግሞ ἐρριμμένοι ያለውን የተጣሉ/የወደቁ ምስል ይጠብቃል።
- source_word: ὡσεὶ πρόβατα μὴ ἔχοντα ποιμένα
  choice: እረኛ እንደሌላቸው በጎች
  rationale: የንጽጽሩን ምስልና እረኛ የሌላቸውን በጎች ተጋላጭነት በተፈጥሯዊ የአማርኛ ሥርዓት ይጠብቃል።
theological_decisions:
- issue: ለኢየሱስ የተነገረው የርኅራኄ ቃል
  choice: አዘነላቸው
  alternative: ራራላቸው / በርኅራኄ ተነካ
  rationale: የግሪኩን ጥልቅ የርኅራኄ ኃይል ሳያሳንስ የአካል ክፍልን በቃል በቃል ከመተርጎም ይቆጠባል፤ ልዩ የእምነት ትርጓሜም አያስገባም።
- issue: የሕዝቡ ሁኔታ
  choice: ተንገላተውና ወድቀው
  alternative: ተጨንቀውና አቅመ ቢስ ሆነው
  rationale: የሁለቱን የግሪክ ተሳቢ ቅርጾች ጠንካራ ምስል ይጠብቃል፤ «አቅመ ቢስ» የሚለውን አስረጂ ትርጓሜ በዋናው ጽሑፍ ላይ አያስገባም።
