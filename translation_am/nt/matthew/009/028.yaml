  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ታሪካዊ የአሁን ጊዜ በ“ይላቸዋል/ይሉታል” ተጠብቋል፤ የእንግሊዝኛው የግርጌ ማስታወሻ ምልክቶች ከይዘታቸው ጋር የተለዋወጡ ስለነበሩ፣ በአማርኛው [a] ከቤቱ አገላለጽ፣ [b] ደግሞ ከ“ጌታ ሆይ” ጋር በትክክል ተያይዘዋል።
