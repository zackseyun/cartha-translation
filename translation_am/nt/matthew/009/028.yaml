  text: ἐλθόντι δὲ εἰς τὴν οἰκίαν προσῆλθον αὐτῷ οἱ τυφλοί, καὶ λέγει αὐτοῖς ὁ Ἰησοῦς· Πιστεύετε ὅτι δύναμαι τοῦτο ποιῆσαι; λέγουσιν αὐτῷ· Ναί, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/028.yaml
  text: When he entered the house[a], the blind men approached him, and Jesus said to them, “Do you believe that I am able to do this?” They said to him, “Yes[b], Lord.”
translation:
  language: am
  text: ወደ ቤት በገባ ጊዜ፣[a] ዕውሮቹ ወደ እርሱ ቀረቡ። ኢየሱስም፣ “ይህን ማድረግ እንደምችል ታምናላችሁን?” ይላቸዋል። እነርሱም፣ “አዎን፣ ጌታ ሆይ።”[b] ይሉታል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወደ ቤት በገባ ጊዜ፣ ዕውሮቹ ወደ እርሱ መጡ።”
    reason: previous_rendering
  - marker: b
    text: “ጌታ ሆይ” የሚለው እንደ ክብር አጠራር “ጌታ” ተብሎም ሊተረጎም ይችላል። የግሪኩ κύριε የክብር አጠራር ሊሆን ይችላል፤ እዚህ ግን የኢየሱስን ሥልጣን የማወቅ አማራጭ እንዲቀር “ጌታ ሆይ” ተብሏል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλθόντι δὲ εἰς τὴν οἰκίαν
  choice: ወደ ቤቱ በገባ ጊዜ
  rationale: የአዮሪስት አሳታፊውን ጊዜያዊ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል፤ εἰς የመግባትን አቅጣጫ በ“ወደ ... ገባ” ይገልጣል።
- source_word: προσῆλθον αὐτῷ
  choice: ወደ እርሱ ቀረቡ
  rationale: προσέρχομαι ወደ አንድ ሰው መቅረብን ወይም መምጣትን ያመለክታል፤ “ቀረቡ” ከመጀመሪያው የመግባት ድርጊት ጋር የቃል ድግግሞሽን ያስወግዳል።
- source_word: οἱ τυφλοί
  choice: ዕውሮቹ
  rationale: በጽሑፉ ውስጥ ቅጽሉ እንደ ስም የተጠቀመ ሲሆን፣ አማርኛው “ዕውሮቹ” በቅርብ ዐውድ የተጠቀሱትን ሁለት ሰዎች በግልጽ ያመለክታል።
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: ኢየሱስም ... ይላቸዋል
  rationale: የግሪኩን ታሪካዊ የአሁን ጊዜ ቅርጽ በአማርኛም ጠብቆ የትረካውን ሕያውነት ያስቀራል።
- source_word: Πιστεύετε ὅτι δύναμαι τοῦτο ποιῆσαι
  choice: ይህን ማድረግ እንደምችል ታምናላችሁን?
  rationale: πιστεύετεን “ታምናላችሁን”፣ δύναμαιን “እንደምችል” በማለት የጥያቄውን ትኩረት በኢየሱስ ችሎታ ላይ እንዳለ ይጠብቃል።
- source_word: λέγουσιν αὐτῷ· Ναί
  choice: እነርሱም፣ “አዎን ...” ይሉታል
  rationale: λέγουσιν የሚለውን ታሪካዊ የአሁን ጊዜ ቅርጽ ይጠብቃል፤ Ναί ደግሞ በቀጥተኛው “አዎን” ተተርጉሟል።
- source_word: κύριε
  choice: ጌታ ሆይ
  rationale: የቀጥታ አድራሻ ቅርጽ ሲሆን፣ “ጌታ ሆይ” ክብርንና ሊኖረው የሚችለውን የኢየሱስ ሥልጣን እውቅና ሁለቱንም ይጠብቃል።
theological_decisions:
- issue: κύριε ለኢየሱስ በቀጥታ ሲነገር የሚኖረው ትርጉም
  choice: ጌታ ሆይ
  alternative: ጌታዬ / ክቡርነትዎ
  rationale: κύριε የክብር አጠራር ብቻ ሊሆን ቢችልም፣ “ጌታ ሆይ” በዚህ የፈውስ ዐውድ የኢየሱስን ሥልጣን የማወቅ እድልን ሳያጠፋ አሻሚነቱን ይጠብቃል።
- issue: λέγει እና λέγουσιν የሚሉት ታሪካዊ የአሁን ጊዜ ግሶች
  choice: ይላቸዋል / ይሉታል
  alternative: አላቸው / አሉት
  rationale: የአሁን ጊዜ ቅርጾቹን ማቆየት የግሪኩን የትረካ ሕያውነት ያስተላልፋል፤ በአማርኛም ታሪካዊ የአሁን ጊዜ ሊገባ ይችላል።
