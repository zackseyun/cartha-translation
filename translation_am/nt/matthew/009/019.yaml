id: MAT.9.19
reference: Matthew 9:19
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἐγερθεὶς ὁ Ἰησοῦς ⸀ἠκολούθει αὐτῷ καὶ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/019.yaml
  text: And Jesus rose and followed him, and his disciples did too.
translation:
  language: am
  text: ኢየሱስም ተነሥቶ ተከተለው፤ ደቀ መዛሙርቱም እንዲሁ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγερθεὶς
  choice: ተነሥቶ
  rationale: የግሪኩ የቀደመ ድርጊት አመልካች አንቀጽ ኢየሱስ ከነበረበት ተነሥቶ ቀጣዩን ድርጊት እንደፈጸመ ያሳያል፤ «ተነሥቶ» ይህን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἠκολούθει
  choice: ተከተለው
  rationale: ያልተፈጸመ የግሪክ ግስ በትረካው ውስጥ የመከተልን ተግባር ያመለክታል፤ ቀላሉ ያለፈ ጊዜ በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: αὐτῷ
  choice: -ው
  rationale: ከἀκολουθέω ጋር ያለው ተውላጠ ስም በአማርኛ በግሱ ላይ በተያያዘው «-ው» ተተርጉሟል፤ የሚያመለክተውም በቀደመው ቁጥር የተጠቀሰውን አለቃ ነው።
- source_word: μαθηταὶ
  choice: ደቀ መዛሙርቱ
  rationale: «ደቀ መዛሙርት» በወንጌላት የመምህርና የተከታይ ግንኙነትን ለμαθηταί በትክክል የሚገልጽ የተለመደ አማርኛ ቃል ነው።
- source_word: καὶ οἱ μαθηταὶ αὐτοῦ
  choice: ደቀ መዛሙርቱም እንዲሁ
  rationale: ግሪኩ በሁለተኛው አንቀጽ ግሱን አይደግምም። «እንዲሁ» የተተወውን «ተከተሉ» በተፈጥሯዊ አማርኛ ያስገነዝባል፤ «-ቱ» ደቀ መዛሙርቱ የኢየሱስ መሆናቸውን ከዐውዱ ጋር ያሳያል።
