    text: ወይም፣ በቃል ይበልጥ ቀጥተኛ፦ «ፈሪሳውያንም አይተው … ይሉ ነበር።» በግሪኩ «አይተው» የሚለው የታየውን ነገር በግልጽ አይጠቅስም፤ በአውዱ ግን የምግብ ሁኔታውን ያመለክታል።
