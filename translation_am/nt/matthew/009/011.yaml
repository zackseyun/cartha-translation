  text: And when the Pharisees saw it[a], they were saying to his disciples, “Why does your teacher eat with tax collectors and sinners?”
translation:
  language: am
  text: ፈሪሳውያንም ይህን[a] አይተው ለደቀ መዛሙርቱ፣ “መምህራችሁ ከቀረጥ ሰብሳቢዎችና ከኃጢአተኞች ጋር ለምን ይበላል?” ይሉ ነበር።
  philosophy: optimal-equivalence
  footnotes:
