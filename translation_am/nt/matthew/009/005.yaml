  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τί γάρ ἐστιν εὐκοπώτερον, εἰπεῖν· ⸀Ἀφίενταί σου αἱ ἁμαρτίαι, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/005.yaml
  text: 'For which is easier: to say[a], ‘Your sins are forgiven,’ or to say, ‘Get up and walk’?”'
translation:
  language: am
  text: እንግዲህ፣ “ኃጢአቶችህ ይቅር ተብለዋል”[a] ማለት ወይስ “ተነሥና ተራመድ” ማለት፣ ከሁለቱ የትኛው ይቀላል?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ኃጢአቶችህ ተሰርየዋል።” የግሪኩ የአሁን ጊዜ ተደራጊ ቅርጽ ውጤቱ የቀጠለ ሁኔታን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ ἐστιν εὐκοπώτερον
  choice: ከሁለቱ የትኛው ይቀላል?
  rationale: τί ከንጽጽር ቅርጹ εὐκοπώτερον ጋር ሁለት አማራጮችን ያነጻጽራል። በአማርኛ ሐረጉን ከሁለቱ ንግግሮች በኋላ ማስቀመጥ ተፈጥሯዊ ሲሆን የጥያቄውን ኃይል ይጠብቃል፤ γάρ የሚያሳየው ከቀደመው ንግግር ጋር ያለው ማብራሪያዊ ግንኙነት በአማርኛው የሐሳብ ፍሰት በቂ ስለሆነ በተለየ ቃል አልተተረጎመም።
- source_word: εἰπεῖν
  choice: ማለት
  rationale: በሁለቱም ሐረጎች ቀጥተኛ ንግግርን የሚያመለክት ተፈጥሯዊና ወጥ ትርጉም ነው።
- source_word: Ἀφίενταί σου αἱ ἁμαρτίαι
  choice: ኃጢአቶችህ ይቅር ተብለውልሃል
  rationale: የግሪኩ ሐረግ ኃጢአቶቹን የሰዋስው ባለቤት በማድረግ የአሁን ጊዜ ተደራጊ ቅርጽ ይጠቀማል። የአማርኛው አገላለጽ ብዙ ቁጥሩን፣ ባለቤትነቱንና የይቅርታውን ውጤታማ ሁኔታ በተፈጥሯዊ መንገድ ይጠብቃል።
- source_word: ἁμαρτίαι
  choice: ኃጢአቶች
  rationale: የግሪኩን ብዙ ቁጥር በግልጽ ሁኔታ የሚያስተላልፍ መደበኛ ቃል ነው።
- source_word: Ἔγειρε
  choice: ተነሥ
  rationale: በፈውስ አውድ የሚሰጠውን ነጠላ ትእዛዝ በቀጥታና በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: καὶ περιπάτει
  choice: እና ተራመድ
  rationale: περιπάτει ከመነሣቱ በኋላ በእግር እንዲራመድ የሚሰጥ ትእዛዝ ነው። በዋናው ጽሑፍ ‘ተነሥና ተራመድ’ ተብሎ በተፈጥሯዊ የአማርኛ ግንኙነት ቀርቧል።
- source_word: σου
  choice: -ህ / -ልሃል
  rationale: የሁለተኛ መደብ ነጠላ ባለቤትነትና ተጠቃሚነት በአማርኛ የቃል ቅጥያዎች ተገልጧል።
theological_decisions:
- issue: የኢየሱስን የኃጢአት ይቅርታ ንግግር መተርጎም
  choice: ኃጢአቶችህ ይቅር ተብለውልሃል
  alternative: ኃጢአቶችህ ተሰርየውልሃል
  rationale: ዋናው ትርጉም የግሪኩን ተደራጊ ቅርጽና የቀጠለ ውጤት ያለውን ሁኔታ ይጠብቃል፤ የይቅርታውን ጊዜ ወይም ሥነ መለኮታዊ አሠራር ከጽሑፉ በላይ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። ‘ተራመድ’ የπεριπάτειን አካላዊ ትርጉም ከ‘ሂድ’ ይልቅ በትክክል ይጠብቃል።
