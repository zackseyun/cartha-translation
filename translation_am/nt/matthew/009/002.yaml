id: MAT.9.2
reference: Matthew 9:2
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ προσέφερον αὐτῷ παραλυτικὸν ἐπὶ κλίνης βεβλημένον. καὶ ἰδὼν ὁ Ἰησοῦς τὴν πίστιν αὐτῶν εἶπεν τῷ παραλυτικῷ· Θάρσει, τέκνον· ⸀ἀφίενταί ⸂σου αἱ ἁμαρτίαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/002.yaml
  text: And behold[a], they brought to him a paralytic lying on a bed. And when Jesus saw their faith, he said to the paralytic, “Take courage, child[c][b]; your sins are forgiven.”
translation:
  language: am
  text: እነሆ፣ በአልጋ ላይ የተኛ ሽባ ወደ እርሱ አመጡ። ኢየሱስም እምነታቸውን[a] አይቶ ሽባውን፣ “ልጄ ሆይ፣ አይዞህ፤ ኃጢአቶችህ ይቅር ተብለውልሃል” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “እምነታቸውን” የሚለው ብዙ ቁጥር ሽባውንና ያመጡትን ሰዎች ሊያካትት ይችላል፤ ወይም ያመጡትን ሰዎች እንደ ቡድን ብቻ ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: የትረካውን ትኩረት የሚስብ ምልክት በአጭርና በተከበረ ዘመናዊ አማርኛ ይጠብቃል።
- source_word: προσέφερον
  choice: አመጡ
  rationale: ምንም እንኳ ኢምፐርፌክት ቅርጽ ቢሆንም፣ በዚህ የትረካ አውድ ቀላል ያለፈ ጊዜ በአማርኛ ተፈጥሯዊ ነው፤ ግሱም በዋናነት ‘ማምጣት’ን ያመለክታል።
- source_word: παραλυτικὸν
  choice: ሽባ
  rationale: በዘመናዊ አማርኛ የሚታወቅና አጭር አጠራር ነው፤ በግሪኩ ያልተገለጸውን ‘ሰው’ አይጨምርም።
- source_word: ἐπὶ κλίνης βεβλημένον
  choice: በአልጋ ላይ የተኛ
  rationale: የሽባውን አቀማመጥ በተፈጥሯዊ አማርኛ ያሳያል፤ κλίνηን ‘አልጋ’ ማለት ከ‘ምንጣፍ’ ይልቅ በቀጥታ የተደገፈ ነው።
- source_word: πίστιν
  choice: እምነት
  rationale: በተግባር የተገለጠውን መታመን የሚያስተላልፍ መደበኛ አቻ ቃል ነው።
- source_word: Θάρσει
  choice: አይዞህ
  rationale: የማበረታቻውንና የማጽናኛውን ኃይል በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: τέκνον
  choice: ልጄ ሆይ
  rationale: የአድራሻውን ርኅራኄና ቅርበት ይጠብቃል፤ ግሪኩ በቃሉ ራሱ ያልወሰነውን ጾታ ‘ወንድ ልጅ’ በማለት አይጨምርም።
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: ኃጢአቶችህ ተሰርየውልሃል
  rationale: የይቅርታውን አዋጅ በአማርኛ ተፈጥሯዊ ፍጹም ቅርጽ ያቀርባል፤ የድርጊቱን ፈጻሚ አይጠቅስም።
theological_decisions:
- issue: የτὴν πίστιν αὐτῶν ማጣቀሻ
  choice: ‘እምነታቸውን’ ተብሎ ብዙ ቁጥሩ እንዳለ ተጠብቋል።
  alternative: የተሸካሚዎቹ እምነት ብቻ ነው፤ ወይም የሽባው እምነት ብቻ ነው።
  rationale: ግሪኩ ከአንድ በላይ ሰዎችን ያመለክታል፤ ሽባው በቡድኑ ውስጥ መካተቱን ወይም አለመካተቱን ግን አይወስንም። የግሪኩ አሻሚነት በግርጌ ማስታወሻ ተጠብቋል።
- issue: የይቅርታው አዋጅና ፈጻሚው
  choice: ‘ኃጢአቶችህ ተሰርየውልሃል’ በማለት ተገብሮ የተነገረ አዋጅ ሆኖ ቀርቧል።
  alternative: ኢየሱስ ኃጢአቶችህን ይቅር ብሎሃል፤ ወይም እግዚአብሔር ኃጢአቶችህን ይቅር ብሎሃል።
  rationale: ግሪኩ ተገብሮ ነው፣ ፈጻሚውንም በግልጽ አይጠቅስም። ትርጉሙ ተጨማሪ የሥነ መለኮት ማብራሪያ ሳያስገባ ይህን ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ተፈጥሯዊና የተከበረ የመደበኛ አማርኛ አጻጻፍ ተጠቅሟል። ‘እነሆ’ የማቴዎስን ትኩረት ሰጪ የትረካ ቅርጽ ይጠብቃል፤ ‘አይዞህ’ ደግሞ በዘመናዊ ንግግር ቀጥተኛና ሞቅ ያለ ማበረታቻ ነው።
