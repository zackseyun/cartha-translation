  source_fidelity: The draft accurately retains the attention marker ἰδού, the plural and deliberately open reference of “their faith,” the tender direct address τέκνον, and the passive pronouncement of forgiveness without supplying an agent. “አመጡ” is an acceptable idiomatic narrative rendering of προσέφερον, though it does not reproduce the Greek imperfect aspect explicitly.
