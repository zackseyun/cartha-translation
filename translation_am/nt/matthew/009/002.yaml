  - severity: low
    issue: “ኃጢአቶችህ ተሰርየውልሃል” is less transparent as a plural forgiveness construction.
    rationale: “ኃጢአቶችህ ይቅር ተብለውልሃል” is idiomatic modern Amharic, visibly agrees with the plural subject, and keeps the passive agent unspecified.
