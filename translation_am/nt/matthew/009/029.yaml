  text: τότε ἥψατο τῶν ὀφθαλμῶν αὐτῶν λέγων· Κατὰ τὴν πίστιν ὑμῶν γενηθήτω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/029.yaml
  text: Then he touched their eyes[a], saying, “According to your faith, let it be done for you.”
translation:
  language: am
  text: ከዚያም ዓይኖቻቸውን ነክቶ፣ “እንደ እምነታችሁ[a] ይሁንላችሁ” አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እንደ መታመናችሁ ይሁንላችሁ።” የግሪኩ πίστις (ፒስቲስ) የሚለው ቃል “መታመን” ተብሎም፣ በአንዳንድ አውዶች ደግሞ “ታማኝነት” ተብሎ ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: ከዚያም
  rationale: የተከታታዩን ድርጊት ጊዜ በተፈጥሯዊ የአማርኛ ትረካ ያመለክታል።
- source_word: ἥψατο
  choice: ነክቶ
  rationale: በዚህ የፈውስ አውድ ያለውን ቀጥተኛ አካላዊ ንክኪ በግልጽ ያስተላልፋል።
- source_word: τῶν ὀφθαλμῶν αὐτῶν
  choice: ዓይኖቻቸውን
  rationale: ከἅπτομαι ጋር የመጣውን የግሪክ ዘርፍ በተፈጥሯዊ የአማርኛ ቀጥተኛ ተሳቢ ቅርጽ ያቀርባል።
- source_word: λέγων
  choice: … አለ
  rationale: ከዋናው ድርጊት ጋር በአንድ ጊዜ የተነገረውን ቃል በተፈጥሯዊ የአማርኛ የጥቅስ አወቃቀር ይገልጣል።
- source_word: Κατὰ
  choice: እንደ
  rationale: የመመጣጠንን ወይም የመለኪያን ሐሳብ ያስተላልፋል፤ ከግሪኩ በላይ ጠንካራ የምክንያት ትርጉም አያስገባም።
- source_word: τὴν πίστιν ὑμῶν
  choice: እምነታችሁ
  rationale: በዚህ አውድ የዓይነ ስውሮቹን በኢየሱስ ላይ ያደረጉትን እምነትና መታመን የሚያመለክት መደበኛና ተፈጥሯዊ ምርጫ ነው።
- source_word: γενηθήτω
  choice: ይሁን
  rationale: የግሪኩን ተገብሮአዊ ትእዛዛዊ ኃይል እንደ ፈጻሚ አዋጅ በአጭርና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ὑμῖν
  choice: ላችሁ
  rationale: ተጠቃሚውን የሚያመለክተውን ዳቲቭ ከይሁን ጋር በተዋሐደ የአማርኛ ቅርጽ ያቀርባል።
theological_decisions:
- issue: በፈውስ ንግግር ውስጥ πίστιςን መተርጎም
  choice: እምነት
  alternative: መታመን
  rationale: ዋናው ጽሑፍ መደበኛውን የእምነት ቃል ይጠቀማል፤ በቅርብ አውዱ ግን በኢየሱስ የመፈወስ ችሎታ ላይ መታመንን ያካትታል። ይህ አማራጭ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ክፍለ ነገር ግንኙነት በተፈጥሯዊው “ነክቶ … አለ” አወቃቀር ቀርቧል፤ “ይሁንላችሁ” ደግሞ የንግግሩን አዋጅ ባሕርይ ይጠብቃል።
