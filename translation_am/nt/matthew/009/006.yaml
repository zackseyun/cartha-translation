  text: But so that you may know that the Son of Man has authority on earth to forgive sins”—then he says to the paralytic[a], “Get up, pick up your bed[b], and go to your house.”
translation:
  language: am
  text: “ነገር ግን፣ የሰው ልጅ[a] በምድር ላይ ኃጢአቶችን ይቅር የማለት ሥልጣን እንዳለው ታውቁ ዘንድ”—ከዚያም ሽባውን እንዲህ አለው፤ “ተነሥ፤ አልጋህን[b] አንሥተህ ወደ ቤትህ ሂድ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የሰው ልጅ” በቃል በቃል “የሰው ልጅ” ማለት ነው። ይህ የኢየሱስ የታወቀ መጠሪያ ሲሆን፣ ከዳንኤል 7 ጋር ሊኖረው የሚችለውን አስተጋብኦ ለመጠበቅ በዋናው ጽሑፍ እንዳለ ተቀምጧል።
    reason: lexical_alternative
  - marker: b
    text: ወይም “ምንጣፍ።” የግሪኩ κλίνη አልጋን፣ ሶፋን ወይም ቀላል የመኝታ ምንጣፍን ሊያመለክት ይችላል።
    reason: lexical_alternative
