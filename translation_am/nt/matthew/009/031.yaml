  naturalness: The sentence is generally clear and idiomatic, but replacing «የሚነገረውን ወሬ» with «ስለ እርሱ ያለውን ዜና» is more natural in this context and avoids the potentially pejorative nuance of «ወሬ».
  terminology: «አካባቢ» appropriately renders the local sense of γῆ, while the footnote responsibly preserves the lexical alternatives. «ዜና» is a suitable neutral rendering for the content that they spread about Jesus.
  issues:
