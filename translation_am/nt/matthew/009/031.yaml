    issue: «ወሬ» may carry a sense of rumor or gossip.
    rationale: διαφημίζω means to publicize or spread news/fame widely; it does not suggest that what was spread was doubtful or mere gossip. A neutral term such as «ዜና» better preserves the source sense.
