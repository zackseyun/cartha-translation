id: MAT.9.31
reference: Matthew 9:31
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οἱ δὲ ἐξελθόντες διεφήμισαν αὐτὸν ἐν ὅλῃ τῇ γῇ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/031.yaml
  text: But after they went out[a], they spread the news about him throughout that whole region.
translation:
  language: am
  text: እነርሱ ግን ወጥተው ስለ እርሱ ያለውን ዜና በዚያ አካባቢ ሁሉ[a] አሰራጩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በዚያች ምድር ሁሉ»። የግሪኩ ቃል γῆ «ምድር፣» «አገር፣» ወይም «አካባቢ» ማለት ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ግን
  rationale: ኢየሱስ ዝም እንዲሉ ከሰጣቸው ትእዛዝ ጋር ያለውን መጠነኛ ተቃርኖና የትረካውን አቅጣጫ መቀየር ያሳያል።
- source_word: ἐξελθόντες
  choice: ወጥተው
  rationale: የግሪኩ የአኦሪስት አሳታፊ ግስ ከዋናው ድርጊት በፊት የተፈጸመውን ድርጊት ያሳያል፤ በአማርኛም «ወጥተው … አሰራጩ» የተፈጥሮ የድርጊት ቅደም ተከተል ነው።
- source_word: διεφήμισαν
  choice: አሰራጩ
  rationale: ዜናን ወይም ዝናን በስፋት ማስታወቅን ያመለክታል፤ «አሰራጩ» የሰፊ ስርጭቱን ሐሳብ በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: αὐτὸν
  choice: ስለ እርሱ የሚነገረውን ወሬ
  rationale: ግሪኩ ቀጥተኛ ተሳቢውን «እርሱን» ከδιαφημίζω ጋር ያገናኛል፤ በአማርኛ ግን ስለ አንድ ሰው የሚነገረውን ወሬ ማሰራጨት ተፈጥሯዊ አገላለጽ ነው።
- source_word: ἐν ὅλῃ τῇ γῇ ἐκείνῃ
  choice: በዚያ አካባቢ ሁሉ
  rationale: በዚህ የአካባቢያዊ ትረካ አውድ γῆ የተወሰነ ክልልን ወይም አካባቢን ሊያመለክት ይችላል፤ «ሁሉ» ደግሞ ὅλῃ የሚያሳየውን ሙሉ ስፋት ይጠብቃል።
theological_decisions:
- issue: የγῆ መልክዓ ምድራዊ ወሰን
  choice: አካባቢ
  alternative: ምድር፣ አገር
  rationale: አውዱ የኢየሱስ ዝና በአቅራቢያው ክልል መሰራጨቱን ይገልጣል፤ «አካባቢ» ወሰኑን ከልክ በላይ ሳያሰፋ ይህን ያስተላልፋል። የ«ምድር/አገር» ትርጉም ግን በግሪኩ የቃላት ወሰን ውስጥ ስለሆነ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የንግግር ፍሰቱን ለማሳለጥ የግሪኩ ቀጥተኛ ተሳቢ «እርሱን» በተፈጥሯዊው «ስለ እርሱ የሚነገረውን ወሬ» ተገልጿል። የግሪኩ γῆ ያለው የትርጉም ክፍተት በ[a] ማስታወሻ ተጠብቋል።
