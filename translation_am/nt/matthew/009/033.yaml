  text: καὶ ἐκβληθέντος τοῦ δαιμονίου ἐλάλησεν ὁ κωφός. καὶ ἐθαύμασαν οἱ ὄχλοι λέγοντες· Οὐδέποτε ἐφάνη οὕτως ἐν τῷ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/033.yaml
  text: And when the demon had been cast out[a], the mute man spoke. And the crowds were amazed, saying, “Never has anything like this appeared in Israel.”
translation:
  language: am
  text: አጋንንቱ ከተባረረ በኋላ ዲዳው[a] ተናገረ። ሕዝቡም ተደነቀ፤ “በእስራኤል እንዲህ ያለ ነገር ከቶ ታይቶ አያውቅም” እያለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ደንቆሮው።” የግሪኩ ቃል “ደንቆሮ” ወይም “ዲዳ” ማለት ሊሆን ይችላል፤ እዚህ ግን ሰውየው መናገሩ ትኩረት ስለተሰጠው “ዲዳው” የሚለውን ትርጉም አውዱ ይደግፋል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβληθέντος τοῦ δαιμονίου
  choice: አጋንንቱም ከወጣ በኋላ
  rationale: የግሪኩ የጄኒቲቭ አብሶሉት አገባብ ዋናው ድርጊት ከመፈጸሙ በፊት አጋንንቱ መውጣቱን ያሳያል። በአማርኛ ‘ከወጣ በኋላ’ ይህን የጊዜ ቅደም ተከተል በተፈጥሮ ያስተላልፋል፤ የግሪኩ ተገብሮ ቅርጽ በአማርኛ ተፈጥሯዊ አገላለጽ ተቀይሯል።
- source_word: δαιμονίου
  choice: አጋንንቱ
  rationale: በወንጌላት የማስወጣት አውድ δαιμόνιονን በትክክል የሚወክለው የአማርኛ ቃል ‘አጋንንት’ ነው፤ እዚህ ነጠላ ማጣቀሻው በ‘አጋንንቱ’ ተገልጧል።
- source_word: ἐλάλησεν
  choice: ተናገረ
  rationale: ቀላሉን የአንድ ጊዜ ድርጊት ‘ተናገረ’ በቀጥታ ያስተላልፋል፤ ‘መናገር ጀመረ’ የሚል በግሪኩ ያልተገለጸ ጅማሬያዊ ትርጉም አልተጨመረም።
- source_word: ὁ κωφός
  choice: ዲዳው[a]
  rationale: κωφός ደንቆሮን ወይም ዲዳን ሊያመለክት ይችላል፤ ወዲያው ‘ተናገረ’ መባሉ እዚህ የንግግር እክል እንደተጠቀሰ ይደግፋል። እውነተኛው የቃሉ አሻሚነት በእግር ማስታወሻ ተጠብቋል።
- source_word: ἐθαύμασαν οἱ ὄχλοι
  choice: ሕዝቡም ተደንቀው
  rationale: ἐθαύμασαν ከፍተኛ መደነቅን ያሳያል፤ ‘ተደነቁ’ ዘመናዊና ግልጽ ነው። የግሪኩ ὄχλοι ብዙ ቁጥር ቢሆንም፣ በአማርኛ ‘ሕዝቡ’ በስብስብ ትርጉም ተፈጥሯዊ ነው፤ ብዙ አባላትን ለሚያመለክት ስብስብ ስምም ‘ተደንቀው’ የተለመደ ስምምነት ነው።
- source_word: Οὐδέποτε ἐφάνη οὕτως ἐν τῷ Ἰσραήλ
  choice: በእስራኤል እንዲህ ያለ ነገር ከቶ ታይቶ አያውቅም
  rationale: ἐφάνη ቃል በቃል ‘ታየ/ተገለጠ’ ሊባል ቢችልም፣ በዚህ የመደነቅ አባባል ‘ታይቶ አያውቅም’ በአማርኛ ተፈጥሯዊ ሲሆን Οὐδέποτεንም ‘ከቶ’ በማለት ያስተላልፋል። ‘እንዲህ ያለ ነገር’ የοὕτωςን መንገድ/ዓይነት ትርጉም ያብራራል።
theological_decisions:
- issue: በፈውስና አጋንንት ማስወጣት አውድ የκωφός ሰፊ የትርጉም ክልል
  choice: ‘ዲዳው’ ተብሎ በዋናው ጽሑፍ ተተርጉሟል።
  alternative: ‘ደንቆሮው’
  rationale: የቃሉ ትርጉም ሁለቱንም ሊያካትት ቢችልም፣ ወዲያው የተገለጸው ውጤት ‘ተናገረ’ የሚል ስለሆነ በዚህ ቁጥር የተጎዳው የመናገር ችሎታ መሆኑ ይበልጥ ይደገፋል። ደንቆሮነትን በዋናው ጽሑፍ መጨመር አውዱ ያላስገደደውን ሁለተኛ ሁኔታ ሊያስገባ ይችላል፤ አማራጩ ግን በማስታወሻ ተጠብቋል።
