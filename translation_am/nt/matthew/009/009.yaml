- from: ኢየሱስም ከዚያ እያለፈ ሲሄድ፣ ማቴዎስ የሚባል አንድ ሰው በቀረጥ መሰብሰቢያው ተቀምጦ አየ። እርሱንም፣ “ተከተለኝ” አለው፤[a] እርሱም ተነሥቶ ተከተለው።
  to: ኢየሱስም ከዚያ እያለፈ ሲሄድ፣ በየቀረጥ መቀበያ ስፍራው ተቀምጦ የነበረ፣ ማቴዎስ የሚባል አንድ ሰው አየ። እርሱንም፣ “ተከተለኝ” ይለዋል። እርሱም ተነሥቶ ተከተለው።
  rationale: The revision repairs the grammatical attachment so that Jesus is unmistakably the one who saw Matthew and Matthew is unmistakably the one seated at the tax-collection place. It also represents the Greek historical present directly with “ይለዋል”; therefore the explanatory note is no longer needed. No theological interpretation has been added.
