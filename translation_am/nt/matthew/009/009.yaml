id: MAT.9.9
reference: Matthew 9:9
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Καὶ παράγων ὁ Ἰησοῦς ἐκεῖθεν εἶδεν ἄνθρωπον καθήμενον ἐπὶ τὸ τελώνιον, Μαθθαῖον λεγόμενον, καὶ λέγει αὐτῷ· Ἀκολούθει μοι· καὶ ἀναστὰς ἠκολούθησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/009.yaml
  text: And as Jesus was passing on from there[a], he saw a man called Matthew sitting at the tax booth, and he says to him[c][b], “Follow me.” And he rose and followed him.
translation:
  language: am
  text: ኢየሱስም ከዚያ እያለፈ ሲሄድ፣ በየቀረጥ መቀበያ ስፍራው ተቀምጦ የነበረ፣ ማቴዎስ የሚባል አንድ ሰው አየ። እርሱንም፣ “ተከተለኝ” ይለዋል። እርሱም ተነሥቶ ተከተለው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παράγων … ἐκεῖθεν
  choice: ከዚያ እያለፈ ሲሄድ
  rationale: የአሁን ጊዜው ተሳቢ ግስ ቀጣይ እንቅስቃሴን ያሳያል፤ ἐκεῖθεν ደግሞ ከቀድሞው ስፍራ መነሣቱን ይገልጣል።
- source_word: ἄνθρωπον
  choice: አንድ ሰው
  rationale: በዐውዱ የተወሰነውን ወንድ ሰው የሚያመለክት ቢሆንም፣ ተፈጥሯዊው የአማርኛ አገላለጽ ‘አንድ ሰው’ ነው፤ ስሙም ማንነቱን ያብራራል።
- source_word: καθήμενον ἐπὶ τὸ τελώνιον
  choice: በቀረጥ መሰብሰቢያው ተቀምጦ
  rationale: ማቴዎስ ቀረጥ በሚሰበሰብበት ቦታ ተቀምጦ መሆኑን ያሳያል፤ ‘መሰብሰቢያ’ ትንሽ ዳስም ሆነ ቢሮ መሆኑን ሳይወስን የቃሉን ስፋት ይጠብቃል።
- source_word: Μαθθαῖον λεγόμενον
  choice: ማቴዎስ የሚባል
  rationale: ሰውየው በዚህ ስም እንደሚጠራ በቀጥታና በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: λέγει αὐτῷ
  choice: እርሱንም … አለው
  rationale: ግሪኩ ታሪካዊ የአሁን ጊዜን ቢጠቀምም፣ በአማርኛ ትረካ ያለፈ ጊዜው ተፈጥሯዊ ነው፤ የግሪኩ ቅርጽ በማስታወሻ ተገልጧል።
- source_word: Ἀκολούθει μοι
  choice: ተከተለኝ
  rationale: ትእዛዙን በቀጥታ ያቀርባል፤ የደቀ መዝሙርነት ትርጉሙን ይጠብቃል እንጂ በማብራሪያ አያሰፋውም።
- source_word: ἀναστὰς ἠκολούθησεν αὐτῷ
  choice: ተነሥቶ ተከተለው
  rationale: ቅድሚያ መነሣቱን፣ ከዚያም ኢየሱስን መከተሉን የግሪኩን ቀጥተኛ ቅደም ተከተል በተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: የኢየሱስ ጥሪ ባሕርይ
  choice: Ἀκολούθει μοι የሚለውን ‘ተከተለኝ’ ብሎ በቀጥታ ማቅረብ
  alternative: ‘ደቀ መዝሙሬ ሁን’ ወይም ‘ከእኔ ጋር ተቀላቀል’
  rationale: ዐውዱ የደቀ መዝሙርነት ጥሪ መሆኑን ያሳያል፤ ሆኖም ግሪኩ ያልጨመረውን ቴክኒካዊ ወይም ማብራሪያዊ ቃል ሳይጨምር ትእዛዙን ራሱን መጠበቅ ተመርጧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ቀረጥ መሰብሰቢያ’ ከጥንታዊው አሠራር ጋር የማይስማማ ዘመናዊ ተቋማዊ ቢሮ እንዳያመለክት ተመርጧል።
