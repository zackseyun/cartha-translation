review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Jesus’ movement from there, Matthew’s designation, the summons, and his response. However, the first sentence syntactically makes the participial phrase “ተቀምጦ” attach awkwardly and can imply that Matthew, rather than Jesus, performed the seeing. The revision explicitly makes Matthew the seated man whom Jesus saw. The Greek historical present is retained in the revised text.
  naturalness: Most wording is modern and clear, but “ማቴዎስ የሚባል አንድ ሰው በቀረጥ መሰብሰቢያው ተቀምጦ አየ” is not natural Amharic syntax for the intended meaning. “የቀረጥ መቀበያ ስፍራ” naturally denotes the place/booth at which tax was collected without implying a modern office.
  terminology: “ተከተለኝ” appropriately renders the imperative without doctrinal expansion. “የቀረጥ መቀበያ ስፍራ” is a clear, historically noncommittal rendering of τελώνιον.
  issues:
  - severity: high
    issue: Misattached participial construction in the first sentence
    rationale: As written, “... ማቴዎስ ... ተቀምጦ አየ” reads as though Matthew was seated and saw something. The Greek says Jesus saw Matthew while Matthew was sitting at the tax booth; the modifier must be placed inside a relative construction modifying the man.
  - severity: low
    issue: Historical-present footnote becomes unnecessary
    rationale: The revision renders λέγει as “ይለዋል,” preserving the Greek historical present directly rather than smoothing it into a past tense and explaining it in a note.
  revised_text: ኢየሱስም ከዚያ እያለፈ ሲሄድ፣ በየቀረጥ መቀበያ ስፍራው ተቀምጦ የነበረ፣ ማቴዎስ የሚባል አንድ ሰው አየ። እርሱንም፣ “ተከተለኝ” ይለዋል። እርሱም ተነሥቶ ተከተለው።
  revised_footnotes: []
  revision_rationale: The revision repairs the grammatical attachment so that Jesus is unmistakably the one who saw Matthew and Matthew is unmistakably the one seated at the tax-collection place. It also represents the Greek historical present directly with “ይለዋል”; therefore the explanatory note is no longer needed. No theological interpretation has been added.
