translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘እነሆም’ ትንሽ ባህላዊ ቢሆንም የἰδούን ሕያው ትኩረት ሰጪ ኃይል በመጽሐፍ ቅዱሳዊ ክብር ይጠብቃል። የማስታወሻ ምልክቶቹ ከሚመለከተው ‘ዘርፍ’ ቃል በኋላ ተቀምጠዋል።
