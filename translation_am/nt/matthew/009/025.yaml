id: MAT.9.25
reference: Matthew 9:25
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐξεβλήθη ὁ ὄχλος, εἰσελθὼν ἐκράτησεν τῆς χειρὸς αὐτῆς, καὶ ἠγέρθη τὸ κοράσιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/025.yaml
  text: But when the crowd had been put outside[a], he went in and took her by the hand, and the girl rose.
translation:
  language: am
  text: ሕዝቡ ወደ ውጭ ከተላከ በኋላ ግን፣ እርሱ ወደ ውስጥ ገብቶ እጇን ያዘ፤ ልጅቷም ተነሣች።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ልጅቷም ተነሣች።» የግሪኩ ግስ በተገብሮ አነጋገር «ልጅቷም ተነሣች» ወይም «ልጅቷም ተነሥታ ነበር» ተብሎ ሊቀርብ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε δὲ
  choice: ከወጣ በኋላ ግን
  rationale: ὅτε ጊዜያዊ ግንኙነቱን፣ δέ ደግሞ ለስላሳውን የትረካ ሽግግር ያሳያል። በአማርኛ የተከታታይ ድርጊቱን ተፈጥሯዊ ለማድረግ «ከ…በኋላ ግን» ተመርጧል።
- source_word: ἐξεβλήθη ὁ ὄχλος
  choice: ሕዝቡ ወደ ውጭ ከወጣ
  rationale: ግሪኩ ሰዎቹ ወደ ውጭ እንዲወጡ መደረጋቸውን የሚገልጽ ተገብሮ ነው። «ወደ ውጭ ከወጣ» በአማርኛ አውዱን ተፈጥሯዊ ቢያቀርብም የተገብሮውን ኃይል በመጠኑ ያለሰልሳል፤ ከአጋንንት ማስወጣት ጋር ሊያያዝ የሚችል «አስወጣ» የሚለው አልተመረጠም።
- source_word: εἰσελθὼν
  choice: ወደ ውስጥ ገብቶ
  rationale: የአዎሪስት አሳታፊው ከዋናው ድርጊት በፊት የተከናወነውን መግባት በተፈጥሯዊ የአማርኛ ተከታታይ ግስ ያቀርባል።
- source_word: ἐκράτησεν τῆς χειρὸς αὐτῆς
  choice: ልጅቷን እጇን ያዛት
  rationale: κρατέω ከዘር ቅጽ ጋር «መያዝ» ማለት ነው። የአካል ክፍልን በተመለከተ «ልጅቷን እጇን ያዛት» ተፈጥሯዊና ግልጽ የአማርኛ አገላለጽ ነው።
- source_word: ἠγέρθη
  choice: ተነሣች
  rationale: የἐγείρω አዎሪስት ተገብሮ ቅጽ በዚህ አውድ «ተነሣች» ወይም «ተነሥታለች/ተነሣች» በሚል ውጤታዊ አገላለጽ ሊተረጎም ይችላል። «ተነሣች» አድራጊውን ሳይጨምር ውጤቱን ይገልጻል።
- source_word: τὸ κοράσιον
  choice: ልጅቷ
  rationale: κοράσιον ትንሽ ወይም ወጣት ሴት ልጅን ያመለክታል። «ልጅቷ» በዘመናዊ አማርኛ ግልጽና በአውዱ በቂ ነው።
theological_decisions:
- issue: ἠγέρθη በሕይወት መመለስ አውድ ያለው አተረጓጎም
  choice: ተነሣች
  alternative: ተነሣች/ተነሥታለች ወይም ተነሥታ ቆመች በማለት ማብራራት፤ ቃል በቃል «ተነሣች» የተገብሮና የመካከለኛ ትርጉምን ሊሸከም ይችላል
  rationale: ግሪኩ ሰዋሰዋዊ ተገብሮ ሲሆን በአውዱ ግን የመነሣትን ውጤት በተገብሮ ወይም በውስጠ-ግስ መልክ ሊገልጽ ይችላል። «ተነሣች» የተአምሩን አድራጊ ከአውዱ በላይ በቃሉ ውስጥ ሳያስገባ ውጤቱን ያቀርባል፤ አማራጩ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ቀላል የሆነ አማርኛ ተጠቅሟል። የትረካው ፍጥነት በ«ገብቶ…ያዛት» ተጠብቋል፤ የἠγέρθη ትርጉማዊ ክፍተት በዋናው ጽሑፍና በማስታወሻው ተጠብቋል።
