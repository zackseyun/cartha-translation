base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/024.yaml
  text: He was saying[a], “Go away, for the girl has not died, but is sleeping.” And they were laughing at him.
translation:
  language: am
  text: እንዲህ ይላቸው ነበር፦ “ከዚህ ሂዱ፤ ልጅቱ አልሞተችምና፣ ተኝታለች እንጂ።” እነርሱም ይስቁበት ነበር።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ያፌዙበት ነበር።” የግሪኩ ግስ በአንድ ሰው ላይ በፌዝ መሳቅን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: እንዲህ ይላቸው ነበር
  rationale: ያልተፈጸመውን የግስ ገጽታ በመጠበቅ በዚያ ትዕይንት ውስጥ ንግግሩ እየቀጠለ ወይም እየተደገመ እንደነበር ያሳያል።
- source_word: Ἀναχωρεῖτε
  choice: ከዚህ ሂዱ
  rationale: የብዙ ቁጥር ትእዛዙን በተፈጥሯዊና በዘመናዊ አማርኛ ያስተላልፋል።
- source_word: οὐ γὰρ
  choice: አል...ም፤ ... እንጂ
  rationale: በአማርኛ የተፈጥሮ አገላለጽ ትእዛዙ የተሰጠበትን ምክንያትና ተቃርኖውን በአንድነት ያቀርባል።
- source_word: ἀπέθανεν
  choice: አልሞተችም
  rationale: ሞትን እንደ ክስተት ያቀርባል፤ ከአሁኑ ሁኔታዋ ጋር በሚገባ ይዛመዳል።
- source_word: τὸ κοράσιον
  choice: ልጅቱ
  rationale: የሴት ልጅነቷን ከግሱ የሴት ጾታ ቅርጽ ጋር በተፈጥሯዊ አማርኛ ያሳያል፤ በግሪኩ ያልተገለጸ ተጨማሪ የዕድሜ አጽንዖት አያክልም።
- source_word: ἀλλὰ καθεύδει
  choice: ተኝታለች እንጂ
  rationale: የአሁን ሁኔታዋን እና ከሞት ጋር ያለውን ቀጥተኛ ተቃርኖ ይጠብቃል።
- source_word: κατεγέλων αὐτοῦ
  choice: በእርሱ ይስቁ ነበር
  rationale: የመሳቅን ምስልና የዘለቀውን ያልተፈጸመ ገጽታ ይጠብቃል፤ የማፌዝ ትርጉሙ በማስታወሻ ተገልጿል።
theological_decisions:
- issue: ኢየሱስ ልጅቱ “አልሞተችም፤ ተኝታለች” ማለቱ
  choice: “ተኝታለች” የሚለውን ቀጥተኛ ዘይቤ ያለ ትርጓሜያዊ ማስፋፊያ መጠበቅ
  alternative: “ተኝታለች ብቻ” ማለት ወይም እንቅልፉ የሞት ዘይቤ መሆኑን በዋናው ጽሑፍ ማብራራት
  rationale: ምንጩ የኢየሱስን ንግግር በአስገራሚና ውጥረት ባለው መልኩ ያቀርባል። “ተኝታለች” የሚለውን እንዳለ መተርጎም ንግግሩ ዘይቤያዊ፣ ለታየው ሁኔታ የተነገረ ወይም ቀጥሎ የሚሆነውን አስቀድሞ የሚያመለክት ስለመሆኑ ያለውን ያልተፈታ ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩን ያልተፈጸመ ገጽታ “ነበር” በሚለው ቅርጽ ተጠብቋል፤ የትእዛዙ ቦታ በአማርኛ የንግግር ፍሰት መሠረት ከምክንያቱ በኋላ ተቀምጧል።
