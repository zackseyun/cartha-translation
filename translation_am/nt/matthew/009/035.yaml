  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ὁ Ἰησοῦς τὰς πόλεις πάσας καὶ τὰς κώμας, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν ⸀μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/035.yaml
  text: And Jesus went throughout all the cities and villages[b][a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness.
translation:
  language: am
  text: ኢየሱስም በከተሞችና በመንደሮች ሁሉ እየዞረ፣ በምኩራቦቻቸው ያስተምር እና የመንግሥቱን የምሥራች[a] ይሰብክ፣ በሽታን ሁሉና ሕመምን ሁሉ[b] ይፈውስ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የመንግሥቱን ወንጌል»።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «በሽታን ሁሉና ደዌን ሁሉ»።
    reason: lexical_alternative
lexical_decisions:
- source_word: περιῆγεν
  choice: እየዞረ … ነበር
  rationale: የግሪኩ ያለፈ ጊዜ ቀጣይ አኳኋን ኢየሱስ በቦታዎቹ ደጋግሞ ይዘዋወር እንደነበር ያሳያል፤ ይህ አገላለጽ ያንን ቀጣይ እንቅስቃሴ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: πόλεις πάσας καὶ τὰς κώμας
  choice: በከተሞችና በመንደሮች ሁሉ
  rationale: πόλις እና κώμη የሚያመለክቱትን ትልልቅና ትንንሽ ሰፈራዎች ልዩነት ጠብቆ፣ πάσας የሚያሳየውንም አጠቃላይ ወሰን ያስተላልፋል።
- source_word: διδάσκων
  choice: ያስተምር
  rationale: ከሌሎቹ ተጓዳኝ ድርጊቶች ጋር የሚቀጥለውን የማስተማር ተግባር በግልጽና ተፈጥሯዊ መንገድ ይገልጣል።
- source_word: συναγωγαῖς αὐτῶν
  choice: በምኩራቦቻቸው
  rationale: «ምኩራብ» ታሪካዊና ሃይማኖታዊ ቃሉን ይጠብቃል፤ የባለቤትነት ቅጥያውም αὐτῶνን ያስተላልፋል።
- source_word: κηρύσσων
  choice: ይሰብክ
  rationale: የሕዝብ ፊት መልእክትን የማወጅ ኃይል ያለውን κηρύσσω በተለመደና በሚገባ ሁኔታ ይገልጣል።
- source_word: τὸ εὐαγγέλιον τῆς βασιλείας
  choice: የመንግሥቱን የምሥራች
  rationale: εὐαγγέλιον በቀጥታ ያለውን «የምሥራች» ትርጉም ለዘመናዊ አንባቢ ግልጽ ያደርጋል፤ የዝምድናውን ሐረግ ያለ ትርጓሜያዊ ማስፋፋት እንዳለ ይጠብቃል።
- source_word: θεραπεύων
  choice: ይፈውስ
  rationale: በወንጌላት የፈውስ አውድ θεραπεύωን በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: πᾶσαν νόσον
  choice: በሽታን ሁሉ
  rationale: νόσοςን በዘመናዊ አማርኛ በግልጽ ያስተላልፋል፤ πᾶσανም «ሁሉ» በማለት ይጠብቃል።
- source_word: πᾶσαν μαλακίαν
  choice: ሕመምን ሁሉ
  rationale: μαλακία ሕመምን፣ ድካምን ወይም ደዌን ሊያመለክት ይችላል። «ሕመም» በዚህ የፈውስ አውድ ግልጽ ሲሆን ከνόσος ጋር ያለውን ሁለትዮሽ አገላለጽም ይጠብቃል፤ ተለዋጩ በማስታወሻ ተቀምጧል።
theological_decisions:
- issue: የεὐαγγέλιον አተረጓጎም
  choice: የምሥራች
  alternative: ወንጌል
  rationale: ጥቅሱ ባህላዊውን የቤተ ክርስቲያን ቃል ብቻ እንድንጠቀም አያስገድድም። «የምሥራች» የግሪኩን ቀጥተኛ ትርጉም በግልጽ ሲያስተላልፍ፣ «ወንጌል» የሚለው ተለዋጭ በማስታወሻ ተጠብቋል።
- issue: πᾶσαν νόσον καὶ πᾶσαν μαλακίαν የሚገልጸው የፈውስ ወሰን
  choice: በሽታን ሁሉና ሕመምን ሁሉ
  alternative: በሽታን ሁሉና ደዌን ሁሉ
  rationale: የተደገመው πᾶσαν «ሁሉ … ሁሉ» ተብሎ ተጠብቋል፤ ይህም የአረፍተ ነገሩን አጠቃላይ ወሰን ያለማለዘብ ያስተላልፋል። የμαλακία ሰፊ የትርጉም ክልል በተለዋጭ ማስታወሻ ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። «ምኩራብ» የሚለው ታሪካዊ ቃል ተጠብቋል፤ የግሪኩ ቀጣይና ተጓዳኝ ድርጊቶች «እየዞረ … ያስተምር … ይሰብክ … ይፈውስ ነበር» በሚለው ተፈጥሯዊ አወቃቀር ተላልፈዋል።
