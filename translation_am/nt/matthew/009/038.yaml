  yaml_path: translation/nt/matthew/009/038.yaml
  text: Therefore pray earnestly to the Lord of the harvest that he would send out workers into his harvest[a].
translation:
  language: am
  text: ስለዚህ የመከሩን ጌታ፣ ወደ መከሩ ሠራተኞችን እንዲልክ[a] አጥብቃችሁ ለምኑት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ሠራተኞችን እንዲያስወጣ»። የግሪኩ ግስ «መላክ» ከሚለው የበለጠ ኃይለኛ ሲሆን፣ እዚህ ሠራተኞችን ወደ መከሩ ማሰማራትን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: δεήθητε
  choice: አጥብቃችሁ ለምኑት
  rationale: የግሡን የጸሎት አውድና የልመናውን አጽንዖት በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: በፊተኛው ቁጥር ከተገለጸው ብዙ መከርና ጥቂት ሠራተኞች ጋር ያለውን የድምዳሜ ግንኙነት ያሳያል።
- source_word: κυρίου
  choice: ጌታ
  rationale: በመከሩ ላይ ሥልጣንና ባለቤትነት ያለውን ያመለክታል፤ የተለመደውንም መጽሐፍ ቅዱሳዊ አጠራር ይጠብቃል።
- source_word: θερισμοῦ
  choice: መከር
  rationale: የምንጩን የመከር ዘይቤ ያለ ማብራሪያዊ ትርጉም ይጠብቃል።
- source_word: ὅπως
  choice: እንዲልክ
  rationale: የልመናውን ይዘትና ዓላማ በአማርኛ ተፈጥሯዊ በሆነ የተያያዥ ግስ ያቀርባል።
- source_word: ἐκβάλῃ
  choice: እንዲልክ
  rationale: በዚህ አውድ ሠራተኞችን ወደ ሥራ ማሰማራትን በግልጽ አማርኛ ያሳያል፤ የግሪኩ ግስ ያለው የበለጠ ኃይለኛ ትርጉም በግርጌ ማስታወሻ ተጠብቋል።
- source_word: ἐργάτας
  choice: ሠራተኞች
  rationale: በመከሩ ሥራ የሚሰማሩትን በግልጽና በዘመናዊ ቋንቋ ይገልጻል።
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: ወደ መከሩ
  rationale: εἰς የሚያሳየውን ወደ መከሩ የመግባት እንቅስቃሴና αὐτοῦ የሚያሳየውን ባለቤትነት በአማርኛው የቅርብ ስም አመልካች ቅጥያ ይጠብቃል።
theological_decisions:
- issue: የ«መከሩ ጌታ» ማንነት
  choice: «የመከሩ ጌታ» ተብሎ ብቻ ተተርጉሟል።
  alternative: በተለይ አብን፣ ኢየሱስን ወይም እግዚአብሔርን በስም መግለጽ።
  rationale: ቁጥሩ የማዕረጉን ባለቤት ከ«መከሩ ጌታ» በላይ በግልጽ አይለይም፤ ስለዚህ የጽሑፉ ሥነ መለኮታዊ ክፍትነት ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛ ተጠቅሟል። «መከር» የሚለው ዘይቤ እንዳለ ተጠብቋል፤ «አጥብቃችሁ ለምኑት» ደግሞ የδεήθητεን አጽንዖት በተፈጥሯዊ አነጋገር ያሳያል።
