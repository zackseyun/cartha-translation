  text: Καὶ ἐγένετο αὐτοῦ ἀνακειμένου ἐν τῇ οἰκίᾳ, ⸀καὶ ἰδοὺ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ ἐλθόντες συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/010.yaml
  text: And as he was reclining at table in the house[a], behold[b], many tax collectors and sinners came and were reclining at table with Jesus and his disciples.
translation:
  language: am
  text: እርሱም በቤት ውስጥ[b] ማዕድ ላይ ተደግፎ ሳለ፣ እነሆ፣ ብዙ ቀረጥ ሰብሳቢዎችና ኃጢአተኞች መጥተው ከኢየሱስና ከደቀ መዛሙርቱ ጋር ማዕድ ላይ ተደግፈው ተቀምጠው ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ጽሑፉ «በቤት ውስጥ» ብቻ ይላል፤ በዚህ ቁጥር ብቻ ቤቱ የማን እንደሆነ በግልጽ አይናገርም።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγένετο
  choice: … ጊዜ
  rationale: የግሪክኛው አገላለጽ በዚህ ስፍራ የትረካ ሽግግርና የጊዜ ግንኙነት ያሳያል፤ በአማርኛ «… ጊዜ» ተፈጥሯዊ ሆኖ ይህንን ኃይል ያስተላልፋል።
- source_word: ἀνακειμένου / συνανέκειντο
  choice: ማዕድ ላይ ተደግፎ ተቀመጠ / ማዕድ ላይ ተደግፈው ተቀመጡ
  rationale: ግሶቹ በምግብ ጊዜ ተደግፎ መቀመጥንና አብሮ ማዕድ መቀመጥን ያመለክታሉ፤ «በሉ» ብቻ ከሚለው ይልቅ የማዕድ ኅብረቱንና የዘመኑን አቀማመጥ ይጠብቃል።
- source_word: ἐν τῇ οἰκίᾳ
  choice: በቤት ውስጥ
  rationale: ቤቱ የማን እንደሆነ ሳይጨምር የቦታውን መረጃ ያስተላልፋል። «በቤቱ» የሚለው በአማርኛ በቀላሉ «በእርሱ ቤት» ተብሎ ሊገባ ስለሚችል አልተመረጠም።
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: ቀጥሎ ለሚከሰተው ነገር ትኩረት የሚስበውን የትረካ ምልክት በተለመደና ክቡር አማርኛ ይጠብቃል።
- source_word: τελῶναι
  choice: ቀረጥ ሰብሳቢዎች
  rationale: በወንጌላት ዐውድ ውስጥ የመንግሥት ገቢ የሚሰበስቡትን ቡድን በግልጽና በተለመደ ቃል ይገልጣል።
- source_word: ἁμαρτωλοὶ
  choice: ኃጢአተኞች
  rationale: በስም ተግባር የቀረበውን ቅጽ እና በዐውዱ ያለውን ማኅበራዊና ሃይማኖታዊ ምድብ ይጠብቃል።
- source_word: ἐλθόντες
  choice: መጥተው
  rationale: የቀደመውን ተሳቢ ድርጊት በተፈጥሯዊ የአማርኛ ተውሳከ ግስ ያቀርባል።
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: ደቀ መዛሙርቱ
  rationale: የመምህርና የተከታይ ግንኙነቱን የሚጠብቅ በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደ አገላለጽ ነው።
theological_decisions:
- issue: የምግብ ጊዜ አቀማመጥና የማዕድ ኅብረት
  choice: «ማዕድ ላይ ተደግፎ/ተደግፈው ተቀመጠ/ተቀመጡ» የሚለውን ምስል ማቆየት
  alternative: «ሲበላ/አብረው ሲበሉ» ወይም «ማዕድ ተቀመጡ»
  rationale: የግሪክኛው ጽሑፍ የምግቡን አቀማመጥና ከኢየሱስ ጋር ያለውን የጋራ ማዕድ በግልጽ ያሳያል። ትርጉሙ ይህን ምስል ይጠብቃል እንጂ ተጨማሪ ዶግማዊ ፍቺ አይጭንበትም።
- issue: «ቤቱ» የማን እንደሆነ መለየት
  choice: በዋናው ጽሑፍ ባለቤቱን አለመጥቀስ
  alternative: «በእርሱ ቤት» ወይም «በማቴዎስ ቤት»
  rationale: ግሪክኛው «በቤቱ» ብቻ ይላል፤ ይህ ቁጥር በራሱ ቤቱ የማን እንደሆነ አይገልጽም። ስለዚህ ትርጉሙ ከዐውድ ሊደረግ የሚችልን ግምት ወደ ዋናው ጽሑፍ አያስገባም።
