  text: καὶ ἰδού τινες τῶν γραμματέων εἶπαν ἐν ἑαυτοῖς· Οὗτος βλασφημεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/003.yaml
  text: And behold[a], some of the scribes said among themselves, “This man is blaspheming.”
translation:
  language: am
  text: እነሆም፣ ከጻፎች አንዳንዶቹ በልባቸው[a]፣ “ይህ ሰው ስድብ እየተናገረ ነው” አሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለራሳቸው አሉ።” የግሪኩ አገላለጽ በውስጣቸው ማሰባቸውን ወይም በግል መነጋገራቸውን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδού
  choice: እነሆም
  rationale: የκαὶን አያያዥነትና የἰδούን ትኩረት ሳቢ ኃይል በአንድ ተፈጥሯዊና ክቡር የአማርኛ አገላለጽ ያስተላልፋል።
- source_word: τινες τῶν γραμματέων
  choice: ከጻፎች አንዳንዶቹ
  rationale: τινες ያልተወሰነ ንዑስ ቡድንን ያመለክታል፤ γραμματεῖς ደግሞ በወንጌላት አውድ የተለመደውን ‘ጻፎች’ ቃል ይቀበላል።
- source_word: εἶπαν ἐν ἑαυτοῖς
  choice: በልባቸው … አሉ
  rationale: የግሪኩ አገላለጽ ውስጣዊ ማሰብን ወይም በግል መነጋገርን ሊያመለክት ስለሚችል፣ ዋናው ጽሑፍ ተፈጥሯዊውን የአማርኛ አገላለጽ ይጠቀማል፤ አማራጩ በማስታወሻ ተጠብቋል።
- source_word: Οὗτος
  choice: ይህ ሰው
  rationale: ጠቋሚውን በተፈጥሯዊ አማርኛ ያቀርባል፤ በአውዱ ያለውን የተቃውሞ ቅላፄ ሳያጋንን ይጠብቃል።
- source_word: βλασφημεῖ
  choice: እግዚአብሔርን እየተሳደበ ነው
  rationale: በዚህ አውድ βλασφημέω በእግዚአብሔር ላይ የሚደረግ የክብር ነኪ ንግግር ክስ ነው፤ ‘እየተሳደበ ነው’ የአሁን ጊዜውን ቀጣይ ኃይል በዘመናዊ አማርኛ ያሳያል።
theological_decisions:
- issue: ጻፎቹ በኢየሱስ ላይ ያቀረቡትን የስድብ ክስ መተርጎም
  choice: ይህ ሰው እግዚአብሔርን እየተሳደበ ነው
  alternative: ይህ ሰው ስድብ እየተናገረ ነው
  rationale: ትርጉሙ ክሱን አያለዝብም፣ እንዲሁም ጻፎቹ ትክክል እንደሆኑ ወይም እንዳልሆኑ በዚህ ቁጥር አይወስንም፤ የትረካውን ሥነ መለኮታዊ ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘እነሆም’ የትረካውን ትኩረት ሳቢ ቅላፄ ይጠብቃል፤ ‘ጻፎች’ ደግሞ በመጽሐፍ ቅዱሳዊ አውድ የታወቀ ቃል ነው።
