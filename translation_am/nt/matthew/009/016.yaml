  text: οὐδεὶς δὲ ἐπιβάλλει ἐπίβλημα ῥάκους ἀγνάφου ἐπὶ ἱματίῳ παλαιῷ· αἴρει γὰρ τὸ πλήρωμα αὐτοῦ ἀπὸ τοῦ ἱματίου, καὶ χεῖρον σχίσμα γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/016.yaml
  text: But no one puts a patch of unshrunk cloth on an old garment, for the patch pulls away from the garment, and a worse tear results.
translation:
  language: am
  text: ነገር ግን ማንም ያልተኮማተረ ጨርቅ መጠገኛ[a] በአሮጌ ልብስ ላይ አያደርግም፤ መጠገኛው ከልብሱ ይቀደዳልና፣ መቀደዱም የባሰ ይሆናል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ገና ያልተነከረ ጨርቅ መጠገኛ።” የግሪኩ ቃል ገና በማነከር ሂደት ያልተዘጋጀ፣ ስለዚህም ሲኮማተር በአሮጌው ልብስ ላይ መሳብ የሚያስከትል ጨርቅን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς δὲ
  choice: ነገር ግን ማንም
  rationale: δὲ የሚያመለክተውን መጠነኛ ንጽጽር ‘ነገር ግን’ ያሳያል፤ οὐδεὶς ያለው አጠቃላይ አሉታዊ ፍቺ ‘ማንም … አያደርግም’ በሚለው ተፈጥሯዊ አማርኛ ተጠብቋል።
- source_word: ἐπιβάλλει ἐπίβλημα
  choice: መጠገኛ … ላይ አያደርግም
  rationale: ἐπιβάλλει በቀጥታ ‘ያደርጋል/ይጨምራል’ ማለት ስለሆነ ‘ይሰፋል’ የሚለውን በጽሑፉ ያልተገለጸ ዝርዝር አልጨመረም፤ ἐπίβλημα በልብስ አውድ ‘መጠገኛ’ ተብሏል።
- source_word: ῥάκους ἀγνάφου
  choice: ያልተኮማተረ ጨርቅ
  rationale: ἀγνάφου ገና በአግባቡ ያልተነከረና ያልተኮማተረ ጨርቅን ያመለክታል፤ ‘ያልተኮማተረ’ በምሳሌው ውስጥ ጨርቁ በኋላ የሚስብበትን ተግባራዊ ምክንያት በግልጽ ያስተላልፋል።
- source_word: ἐπὶ ἱματίῳ παλαιῷ
  choice: በአሮጌ ልብስ ላይ
  rationale: ἱμάτιον በአጠቃላይ የሚለበስ ልብስን ሊያመለክት ስለሚችል ‘ልብስ’ ትርጉሙን ሳያጠብ በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: αἴρει … ἀπὸ τοῦ ἱματίου
  choice: ከልብሱ ተነጥሎ ይወጣል
  rationale: በዚህ አውድ αἴρει መጠገኛው ከልብሱ የመለየቱን ውጤት ያሳያል፤ ይህ አተረጓጎም የመሳቡን ዘዴ ከማብራራት ይልቅ የግሪኩን የመለየት ሐሳብ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: χεῖρον σχίσμα γίνεται
  choice: መቀደዱም የባሰ ይሆናል
  rationale: χείρον የንጽጽር ፍቺውን ‘የባሰ’ በሚለው ይጠብቃል፤ σχίσμα የልብሱን መቀደድ፣ γίνεται ደግሞ የሚፈጠረውን ውጤት ያሳያሉ።
