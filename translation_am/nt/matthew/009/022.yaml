  text: ὁ δὲ Ἰησοῦς ⸀στραφεὶς καὶ ἰδὼν αὐτὴν εἶπεν· Θάρσει, θύγατερ· ἡ πίστις σου σέσωκέν σε. καὶ ἐσώθη ἡ γυνὴ ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/022.yaml
  text: But Jesus[a], turning and seeing her, said, “Take courage, daughter[d][c][b]; your faith has saved you.” And the woman was healed from that hour.
translation:
  language: am
  text: 'ኢየሱስ ግን ዘወር ብሎ እርሷን አይቶ[a]፣ “አይዞሽ[b]፣ ልጄ[c]፤ እምነትሽ[d] አድኖሻል[e]” አላት። ሴቲቱም ከዚያች ሰዓት ጀምሮ ተፈወሰች።


    [a] ወይም፣ “ዘወር ብሎ፣ እርሷንም አይቶ።”

    [b] ወይም፣ “አይዞሽ፤ ድፍረት ይኑርሽ።”

    [c] ቃል በቃል፣ “ሴት ልጅ ሆይ።”

    [d] እዚህ “እምነት” የሚለው ቃል “መታመን” ተብሎም ሊተረጎም ይችላል።

    [e] ወይም፣ “ፈውሶሻል” ወይም “ደኅና አድርጎሻል።” የግሪኩ ግስ ማዳንን፣ መፈወስን ወይም ደኅና ማድረግን ሊያመለክት ይችላል፤ ዋናው ጽሑፍ በኢየሱስ ንግግር ውስጥ ያለውን ሰፊ ትርጉም ጠብቋል።'
  philosophy: optimal-equivalence
