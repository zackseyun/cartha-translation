    reason: የሁለቱን የግሪክ አሳታፊ ግሶች ትይዩ አወቃቀር የሚያሳይ አማራጭ።
  - marker: b
    text: ወይም፣ “አይዞሽ፤ ድፍረት ይኑርሽ።”
    reason: የΘάρσειን የድፍረትና የመበርታት ሐሳብ በግልጽ የሚያሳይ አማራጭ።
  - marker: c
    text: ቃል በቃል፣ “ሴት ልጅ ሆይ።”
    reason: “ልጄ” ተፈጥሯዊ የአማርኛ የጥሪ ቅርጽ ሲሆን የግሪኩ ቃል በቃል ቅርጽ እንዲታይ።
  - marker: d
    text: እዚህ “እምነት” የሚለው ቃል “መታመን” ተብሎም ሊተረጎም ይችላል።
    reason: የπίστιςን በአውዱ የሚገኝ የመታመን ልዩነት ለመጠበቅ።
  - marker: e
    text: ወይም፣ “ፈውሶሻል” ወይም “ደኅና አድርጎሻል።” የግሪኩ ግስ ማዳንን፣ መፈወስን ወይም ደኅና ማድረግን ሊያመለክት ይችላል፤ ዋናው ጽሑፍ በኢየሱስ ንግግር ውስጥ ያለውን ሰፊ ትርጉም ጠብቋል።
    reason: የσῴζωን የማዳን፣ የመፈወስና ደኅና የማድረግ የትርጉም ክልል ሳይደመሰስ ለማቅረብ።
lexical_decisions:
- source_word: στραφεὶς
  choice: ዘወር ብሎ
  rationale: ግሱ በዚህ አገባብ ኢየሱስ መዞሩን ያሳያል፤ “ዘወር ብሎ” አቅጣጫውን ሳይጨምር ተፈጥሯዊ አማርኛ ነው።
