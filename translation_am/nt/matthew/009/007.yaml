- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: ወደ ቤቱ
  rationale: εἰς የሚገልጸውን አቅጣጫ በ‘ወደ’፣ οἶκος የሚያመለክተውን መኖሪያ ደግሞ በ‘ቤት’ በቀጥታ ያስተላልፋል።
