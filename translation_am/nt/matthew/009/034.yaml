- from: ፈሪሳውያን ግን፣ “እርሱ አጋንንትን የሚያስወጣው በአጋንንት ገዥ ኃይል ነው” ይሉ ነበር።
  to: ፈሪሳውያን ግን፣ “እርሱ አጋንንትን የሚያስወጣው በአጋንንት አለቃ ነው” ይሉ ነበር።
  rationale: The revision removes the unsupported addition «ኃይል» and renders ἄρχοντι with the natural Amharic term «አለቃ». It retains the adversative «ግን», the ongoing/repeated sense of «ይሉ ነበር», and the established term «አጋንንት». No footnote is required in Amharic, since the ruler/prince lexical alternative does not create a distinct necessary reading here.
