id: MAT.9.34
reference: Matthew 9:34
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἔλεγον· Ἐν τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/034.yaml
  text: But the Pharisees were saying[a], “By the ruler of the demons he casts out the demons.”
translation:
  language: am
  text: ፈሪሳውያን ግን፣ “እርሱ አጋንንትን የሚያስወጣው በአጋንንት አለቃ ነው” ይሉ ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: ግን
  rationale: ከቀደመው የሕዝቡ አዎንታዊ ምላሽ ጋር ያለውን ተቃርኖ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Φαρισαῖοι
  choice: ፈሪሳውያን
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የአይሁድ ቡድን ስም ይጠብቃል።
- source_word: ἔλεγον
  choice: ይሉ ነበር
  rationale: የግሪኩን ያልተፈጸመ ጊዜ ቀጣይነት ወይም ድግግሞሽ ይጠብቃል።
- source_word: Ἐν τῷ ἄρχοντι
  choice: በ…ገዥ ኃይል
  rationale: ἐν እዚህ የመሣሪያን ወይም የኃይል ምንጭን ያመለክታል፤ ይህ አገላለጽ ትርጉሙን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἄρχοντι
  choice: ገዥ
  rationale: የሥልጣንና የአለቅነትን ሐሳብ በቀጥታና በዘመናዊ አማርኛ ያስተላልፋል።
- source_word: τῶν δαιμονίων / τὰ δαιμόνια
  choice: የአጋንንት / አጋንንትን
  rationale: δαιμόνια የሚለውን ቃል በትክክል የሚወክለውንና በአማርኛ የተለመደውን ቃል ይጠቀማል።
- source_word: ἐκβάλλει
  choice: ያስወጣል
  rationale: በአጋንንት ማስወጣት አውድ ውስጥ ግልጽ፣ ተፈጥሯዊና የተለመደ አማርኛ ነው።
theological_decisions:
- issue: δαιμόνιαን በአጋንንት ማስወጣት አውድ መተርጎም
  choice: አጋንንት
  alternative: ክፉ መናፍስት
  rationale: የግሪኩ ቃል δαιμόνια እንጂ πνεύματα አይደለም፤ ‘አጋንንት’ የቃሉን ልዩ ትርጉምና የጽሑፉን መለኮታዊ ክብደት ይጠብቃል።
- issue: ἐν τῷ ἄρχοντι የሚያመለክተው ግንኙነት
  choice: በአጋንንት ገዥ ኃይል
  alternative: ከአጋንንት ገዥ ጋር በመሆን
  rationale: ሐረጉ ኢየሱስ የሚጠቀምበት ኃይል ምንጭ የአጋንንት ገዥ ነው የሚል ክስ ያቀርባል፤ አጋርነትን ብቻ እንዳያመለክት ‘ኃይል’ ተጨምሯል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ አማርኛ። የግሪኩ የቀጣይ ወይም የተደጋጋሚ ንግግር ገጽታ ‘ይሉ ነበር’ በሚለው ተጠብቋል።
