  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ፈሊጥ በዋናው ጽሑፍ ተፈጥሯዊ ሆኖ ተተርጉሟል፣ ቃል በቃል ቅርጹም በእግር ማስታወሻ ተጠብቋል።
