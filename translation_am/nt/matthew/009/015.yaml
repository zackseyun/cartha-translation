  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος πενθεῖν ἐφ’ ὅσον μετ’ αὐτῶν ἐστιν ὁ νυμφίος; ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/015.yaml
  text: And Jesus said to them[a], “The wedding attendants cannot mourn as long as the bridegroom is with them, can they? But days will come when the bridegroom is taken away from them[b], and then they will fast.”
translation:
  language: am
  text: ኢየሱስም እንዲህ አላቸው፦ “የሰርጉ ተሳታፊዎች[a] ሙሽራው ከእነርሱ ጋር እስካለ ድረስ ሊያዝኑ ይችላሉን? ነገር ግን ሙሽራው ከእነርሱ የሚወሰድበት[b] ቀኖች ይመጣሉ፤ በዚያን ጊዜም ይጾማሉ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “የሠርጉ አዳራሽ ልጆች”፤ ይህ በሠርጉ ደስታ ላይ የሚሳተፉትን፣ በተለይም የሙሽራውን ጓደኞች ወይም አጃቢዎች፣ የሚያመለክት ፈሊጥ ነው።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ከእነርሱ በሚወገድበት።” ተደራጊው አገላለጽ ከተራ መሄድ የበለጠ ነገር ይጠቁማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱοὶ τοῦ νυμφῶνος
  choice: የሙሽራው ባልደረቦች
  rationale: ቃል በቃል ‘የሙሽራ ክፍል ልጆች’ የሚለው የሴማዊ አነጋገር ፈሊጥ ሲሆን፣ በሰርጉ ላይ ሙሽራውን የሚያጅቡትን ቅርብ ባልደረቦች ያመለክታል። ‘የሙሽራው ባልደረቦች’ ማኅበራዊ ሚናቸውን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: πενθεῖν
  choice: ሊያዝኑ
  rationale: ግሱ ሐዘንንና ልቅሶን ያመለክታል፤ ከጾም ጋር ያለውን ንጽጽርም ‘ማዘን’ በግልጽ ያቆያል።
- source_word: ἐφ’ ὅσον
  choice: እስካለ ድረስ
  rationale: የጊዜውን ቆይታ ‘እስከ…ድረስ’ በሚለው ተፈጥሯዊ የአማርኛ አገላለጽ ያስተላልፋል።
- source_word: νυμφίος
  choice: ሙሽራው
  rationale: በአማርኛ ‘ሙሽራ’ በዐውዱ ወንዱን ሙሽራ በተፈጥሯዊ ሁኔታ ያመለክታል፤ የምሳሌውንም ክብደት ይጠብቃል።
- source_word: ἀπαρθῇ
  choice: የሚወሰድበት
  rationale: የግሪኩን ተደራጊ አቀራረብ ይጠብቃል፤ ከተራ መሄድ ይልቅ ከእነርሱ መወገድን ይጠቁማል፣ ነገር ግን አድራጊውን አይጨምርም።
- source_word: νηστεύσουσιν
  choice: ይጾማሉ
  rationale: ቀጥተኛውን የወደፊት ጊዜ ግስ በአጭርና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: Μὴ δύνανται ... ;
  choice: ሊያዝኑ ይችላሉን?
  rationale: μή አሉታዊ መልስ የሚጠብቀውን የአጠያየቅ ኃይል በአማርኛ የንግግር ጥያቄ ቅርጽ ይጠብቃል።
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: ነገር ግን … ጊዜ ይመጣል
  rationale: ቃል በቃል ‘ቀናት ይመጣሉ’ ቢሆንም፣ ከተከታዩ ὅταν ሐረግ ጋር ‘…የሚሆንበት ጊዜ ይመጣል’ በአማርኛ ተፈጥሯዊ ነው፤ δέ የሚያሳየውን ንጽጽርም ‘ነገር ግን’ ይጠብቃል።
theological_decisions:
- issue: የሙሽራው ምስል ሊኖረው የሚችለው ክርስቶሳዊ ትርጉም
  choice: ‘ሙሽራው’ የሚለውን ምስል ያለ ትርጓሜያዊ ማስፋፊያ ማቆየት
  alternative: ኢየሱስን መሲሐዊው ሙሽራ ብሎ በትርጉሙ ውስጥ በግልጽ መለየት
  rationale: ጥቅሱ የሙሽራውን ምስል ያቀርባል፣ ግን ትርጉሙ ከጽሑፉ በላይ ሄዶ ማንነቱንና መሲሐዊ ፍቺውን ማብራራት የለበትም።
- issue: ‘ይወሰዳል’ የሚለው ተደራጊ አገላለጽ
  choice: አድራጊውንና ትክክለኛውን ክስተት ሳይጨምሩ ተደራጊውን ቅርጽ ማቆየት
  alternative: የኢየሱስን ሞት በግልጽ ጠቅሶ መተርጎም
  rationale: ἀπαρθῇ ከተራ መለየት የበለጠ የመወሰድ ፍንጭ ቢኖረውም፣ ጽሑፉ እዚህ አድራጊውን ወይም የሞቱን ዝርዝር አይገልጽም።
