review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the temporal contrast, mourning, fasting, and the passive force of ἀπαρθῇ. However, ἐλεύσονται ... ἡμέραι (‘days will come’) is unnecessarily reduced to singular ‘time,’ and ባልደረቦች commonly suggests colleagues rather than wedding-party participants.
  naturalness: The sentence is generally clear modern Amharic. Replacing የሙሽራው ባልደረቦች with የሰርጉ ተሳታፊዎች avoids an unintended workplace sense. Retaining plural ‘days’ also produces a natural, faithful formulation.
  terminology: ሙሽራው, ማዘን, መጾም, and the passive ‘ከእነርሱ በሚወሰድበት’ are appropriate. The literal footnote should identify νυμφών as a wedding hall, not a ‘bridegroom’s room.’
  issues:
  - severity: medium
    issue: የሙሽራው ባልደረቦች
    rationale: ባልደረቦች in modern standard Amharic ordinarily means coworkers/colleagues. It does not naturally identify people participating in a wedding celebration.
  - severity: low
    issue: '...ጊዜ ይመጣል'
    rationale: This singularizes the explicit plural ἡμέραι. While idiomatic, retaining ‘days’ is both natural and closer to the source.
  - severity: medium
    issue: የሙሽራ ክፍል ልጆች
    rationale: The footnote’s literal gloss inaccurately makes νυμφών a bridegroom’s room. In this idiom it is the wedding hall/bridal chamber, with the idiomatic reference to those associated with the wedding celebration.
