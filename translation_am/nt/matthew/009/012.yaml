  text: ὁ ⸀δὲ ἀκούσας ⸀εἶπεν· Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/012.yaml
  text: But when he heard it[a], he said, “Those who are well have no need of a physician, but those who are sick do.”
translation:
  language: am
  text: እርሱም ይህን ሰምቶ፣ “ጤነኞች ሐኪም አያስፈልጋቸውም፤ የታመሙት ግን ያስፈልጋቸዋል” አለ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: ይህን ሰምቶ
  rationale: የቀደመውን ንግግር እንደሰማ የሚያመለክተውን የአኦሪስት ቦዝ አንቀጽ በተፈጥሯዊ አማርኛ ያቀርባል፤ በግሪክ የተሰወረውን ተሳቢ ከዐውዱ በመውሰድ «ይህን» ተጨምሯል።
- source_word: δὲ
  choice: -ም
  rationale: δέ የሚያሳየውን ቀላል ሽግግር እና ንፅፅር በአማርኛው ተያያዥ ቅጥያ በተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: εἶπεν
  choice: አለ
  rationale: የግሪኩን መደበኛ የንግግር ግስ ያለ ትርጓሜያዊ ጭማሪ ይተረጉማል።
- source_word: Οὐ χρείαν ἔχουσιν
  choice: አያስፈልጋቸውም
  rationale: χρείαν ἔχειν የሚለውን ፈሊጥ በዘመናዊና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: οἱ ἰσχύοντες
  choice: ጤነኞች
  rationale: ἰσχύω በመሠረቱ ጠንካራ መሆንን ቢያመለክትም፣ እዚህ ከሐኪምና ከታመሙት ጋር ያለው የሕክምና ንፅፅር «ጤነኞች» የሚለውን ፈሊጣዊ ትርጉም ይደግፋል።
- source_word: ἰατροῦ
  choice: ሐኪም
  rationale: የሕክምና ባለሙያን በግልጽ፣ የተለመደና ክቡር አማርኛ ይጠራል።
- source_word: οἱ κακῶς ἔχοντες
  choice: የታመሙት
  rationale: κακῶς ἔχω በዚህ የሕክምና ዐውድ «መታመም» ማለት ነው፤ ምርጫው ግልጽና ተፈጥሯዊ ነው።
theological_decisions:
- issue: ምሳሌው መንፈሳዊ ወይም አካላዊ ትርጉም
  choice: ንግግሩን በቀጥታ የሕክምና ምስል አቀራረብ መተርጎም
  alternative: «ኃጢአተኞች» ወይም «መንፈሳዊ ሕመምተኞች» በማለት አተገባበሩን በግልጽ ማስገባት
  rationale: ዐውዱ ንግግሩን ከኢየሱስና ከኃጢአተኞች ግንኙነት ጋር ቢያያይዘውም፣ የግሪኩ ንግግር ራሱ የሕክምና ምሳሌ ነው። ይህን ምስል መጠበቅ መንፈሳዊ አተገባበሩን ዐውዱ እንዲያሳይ ያደርጋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር መደበኛ አማርኛ። የአማርኛውን ተፈጥሯዊ የትኩረት አደራደር ለመጠበቅ «የታመሙት እንጂ ጤነኞች አይደሉም» የሚለው ቅርጽ ተመርጧል።
