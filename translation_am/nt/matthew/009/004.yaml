source:
  edition: SBLGNT
  text: καὶ ⸀εἰδὼς ὁ Ἰησοῦς τὰς ἐνθυμήσεις αὐτῶν εἶπεν· ⸀Ἱνατί ἐνθυμεῖσθε πονηρὰ ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/004.yaml
  text: And Jesus[a], knowing their thoughts, said, “Why are you thinking evil in your hearts?”
translation:
  language: am
  text: ኢየሱስም ሐሳባቸውን አውቆ[a]፣ “በልባችሁ ክፉ ነገሮችን ለምን ታስባላችሁ?” አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሐሳባቸውን ተገንዝቦ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: አውቆ
  rationale: የግስ አገባቡ ኢየሱስ ያልተነገረውን ውስጣዊ ሐሳባቸውን እንዳወቀ በተፈጥሯዊና አጭር አማርኛ ያሳያል፤ የመገንዘብ ትርጉሙም በማስታወሻው ተጠብቋል።
- source_word: ἐνθυμήσεις
  choice: ሐሳባቸውን
  rationale: ቃሉ ውስጣዊ አሳብን ወይም ምክንያታዊ ማሰላሰልን ያመለክታል፤ ‘ሐሳብ’ ለዘመናዊ አንባቢ ግልጽና ተፈጥሯዊ ነው።
- source_word: Ἱνατί
  choice: ለምን
  rationale: ምክንያትን የሚጠይቀውን ጥያቄ በቀጥታና በተለመደ አማርኛ ይገልጣል።
- source_word: ἐνθυμεῖσθε
  choice: ታስባላችሁ
  rationale: የአሁን ጊዜውን ቀጣይ ውስጣዊ ማሰብ በተፈጥሯዊ የአማርኛ ጥያቄ ያስተላልፋል።
- source_word: πονηρὰ
  choice: ክፉ ነገር
  rationale: ገላጩ ቃል በግሪክ ስማዊ ተግባር ስላለው፣ ‘ክፉ ነገር’ በአማርኛ ዓረፍተ ነገሩን ግልጽ ያደርጋል፤ ሐሳብን ወይም ዓላማን በማከል አይተረጉምም።
- source_word: καρδίαις
  choice: ልባችሁ
  rationale: ‘ልብ’ የሐሳብና የዓላማ ማዕከል የሆነውን የምንጩን ምሳሌያዊና ሥነ መለኮታዊ አገላለጽ ይጠብቃል።
theological_decisions:
- issue: ኢየሱስ ያልተነገረውን ውስጣዊ ሐሳብ ማወቁ
  choice: ኢየሱስም ሐሳባቸውን አውቆ
  alternative: ኢየሱስም ሐሳባቸውን ተገንዝቦ
  rationale: የተመረጠው አገላለጽ ጥቅሱ ኢየሱስ ውስጣዊ ሐሳባቸውን እንዳወቀ የሚናገረውን በቀጥታ ይጠብቃል፤ ይህንንም ከጽሑፉ በላይ ወደ ሰፊ የእምነት መግለጫ አያስፋፋውም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። ‘በልባችሁ’ የምንጩን ምሳሌያዊ አገላለጽ ይጠብቃል።
