  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ትረካዊ ቅደም ተከተል ተጠብቆ፣ በአማርኛ ተፈጥሯዊ እንዲሆን ግሶቹ ተያይዘዋል።
