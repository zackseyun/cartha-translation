id: MAT.9.18
reference: Matthew 9:18
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ταῦτα αὐτοῦ λαλοῦντος αὐτοῖς ἰδοὺ ἄρχων εἷς ⸀ἐλθὼν προσεκύνει αὐτῷ λέγων ὅτι Ἡ θυγάτηρ μου ἄρτι ἐτελεύτησεν· ἀλλὰ ἐλθὼν ἐπίθες τὴν χεῖρά σου ἐπ’ αὐτήν, καὶ ζήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/018.yaml
  text: While he was saying these things to them, look, a ruler came and bowed down before him, saying, “My daughter has just died. But come and lay your hand on her, and she will live.”
translation:
  language: am
  text: እርሱ ይህን ለእነርሱ እየተናገረ ሳለ፣ እነሆ፣ አንድ አለቃ መጥቶ በፊቱ ሰገደና፣ “ሴት ልጄ አሁን ሞተች፤ ነገር ግን መጥተህ እጅህን በእርሷ ላይ አኑር፣ እርሷም ሕያው ትሆናለች” አለ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: የትረካውን ድንገተኛ እድገት እና የአንባቢውን ትኩረት የሚጠራውን ኃይል ጠብቆ የሚያቀርብ የተለመደ የአማርኛ አገላለጽ ነው።
- source_word: ἄρχων
  choice: አለቃ
  rationale: የግለሰቡን የሥልጣን ወይም የአመራር ሚና ይገልጣል፤ ጽሑፉ ያልገለጠውን የተወሰነ ሹመት አይጨምርም።
- source_word: προσεκύνει
  choice: በፊቱ ሰገደ
  rationale: የአካላዊ ስግደትና ክብር መግለጫውን ይጠብቃል፤ በዚህ ቃል ብቻ ድርጊቱን እንደ አምልኮ በግድ አይተረጉምም።
- source_word: ἄρτι ἐτελεύτησεν
  choice: አሁን ሞታለች
  rationale: የሞቷን ቅርብነት በቀጥታና በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ζήσεται
  choice: በሕይወት ትኖራለች
  rationale: የወደፊቱን የመኖር ውጤት በግልጽ ይገልጣል፤ የአለቃውን እምነት ከቃሉ በላይ አያብራራም።
theological_decisions:
- issue: የπροσεκύνει ትርጉም
  choice: በፊቱ ሰገደ
  alternative: አመለከው
  rationale: የግሪኩ ግስ ስግደትን፣ ክብርን ወይም አምልኮን ሊያመለክት ይችላል። አውዱ ብቻ ልዩነቱን በፍጹም ስለማይወስን፣ የአካላዊ ድርጊቱን የሚጠብቅ እና መለኮታዊ አምልኮ እንደሆነ አስቀድሞ የማይወስን አገላለጽ ተመርጧል።
- issue: የζήσεται ኃይል
  choice: በሕይወት ትኖራለች
  alternative: እንደገና ሕያው ትሆናለች
  rationale: ሁለተኛው አማራጭ ከአውዱ ጋር ቢስማማም፣ ‘እንደገና’ የሚለው በግሪኩ በግልጽ አልተጻፈም። ስለዚህ የምንጩን አጭርነትና የውጤቱን ማረጋገጫ ተጠብቋል።
