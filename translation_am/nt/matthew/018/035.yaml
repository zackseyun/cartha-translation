  text: Οὕτως καὶ ὁ πατήρ μου ὁ ⸀οὐράνιος ποιήσει ὑμῖν ἐὰν μὴ ἀφῆτε ἕκαστος τῷ ἀδελφῷ αὐτοῦ ἀπὸ τῶν καρδιῶν ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/035.yaml
  text: So also my heavenly Father will do to you[b][a], if each of you does not forgive his brother from your hearts.
translation:
  language: am
  text: እያንዳንዳችሁ ለወንድሙ[a] ከልባችሁ ይቅር ካላላችሁ፣ ሰማያዊው አባቴም እንዲሁ ያደርግባችኋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ወንድሙ” የሚለው የግሪኩን ተባዕታይ ነጠላ ቃል ያስተላልፋል፤ በዚህ አውድ ግን እያንዳንዱን ሌላ ደቀ መዝሙር ወይም አማኝ በወኪልነት ያመለክታል።
    reason: cultural_note
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: እንዲሁ ...ም
  rationale: የቀደመውን ምሳሌ ከኢየሱስ ማስጠንቀቂያ ጋር የሚያያይዘውን የንጽጽርና የድምዳሜ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: የሰማዩ አባቴ
  rationale: ‘የእኔ’ የሚለውን ባለቤትነትና οὐράνιος የሚያመለክተውን ሰማያዊነት በተለመደና ክቡር አገላለጽ ይጠብቃል።
- source_word: ποιήσει ὑμῖν
  choice: ያደርግባችኋል
  rationale: የጌታውን ድርጊት ወደ ኋላ የሚያመለክተውን ሰፊ የግሱን ትርጉም ይጠብቃል፤ የፍርዱን ዓይነት ከቁጥሩ በላይ አይተረጉምም።
- source_word: ἐὰν μὴ
  choice: ካላላችሁ
  rationale: አሉታዊውን ሁኔታ በተፈጥሯዊ የአማርኛ ሁኔታዊ አወቃቀር ያቀርባል።
- source_word: ἀφῆτε
  choice: ይቅር ካላላችሁ
  rationale: በግለሰቦች መካከል በደልን ስለመተው በሚናገረው አውድ ይቅርታን በግልጽና ተፈጥሯዊ መንገድ ይገልጻል።
- source_word: ἕκαστος
  choice: እያንዳንዳችሁ
  rationale: በብዙ ቁጥር ለተጠሩት ሰዎች ግዴታው በግል በግል እንደሚመለከት ያሳያል።
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: ወንድማችሁን
  rationale: የግሪኩን ተባዕታይ ነጠላ ቅርጽ ይጠብቃል፤ በአማርኛ ከ‘እያንዳንዳችሁ’ ጋር የሚስማማው የስርጭት አገላለጽ ነው። ወኪላዊ አጠቃቀሙ በማስታወሻ ተብራርቷል።
- source_word: ἀπὸ τῶν καρδιῶν ὑμῶν
  choice: ከልባችሁ
  rationale: የውስጥንና እውነተኛ ይቅርታን አጽንዖት በተፈጥሯዊ አማርኛ ይጠብቃል፤ ‘ልብ’ በአማርኛ ከብዙ ተደራሲ ጋር በዚህ መልክ መጠቀሙ የተለመደ ነው።
theological_decisions:
- issue: የማስጠንቀቂያው ወሰንና ኃይል
  choice: በምሳሌው ውስጥ ከተገለጠው ድርጊት ጋር የሚዛመድ ቀጥተኛ መለኮታዊ ማስጠንቀቂያ
  alternative: ‘በተመሳሳይ ሁኔታ ይይዛችኋል’ ብሎ ማለዘብ ወይም ስለ ዘላለማዊ ፍርድና ሽልማት ተጨማሪ ዶግማዊ ማብራሪያ መጨመር
  rationale: ግሪኩ ከባድ ሁኔታዊ ማስጠንቀቂያ ይሰጣል፣ ነገር ግን የፍርዱን ሙሉ ሥነ መለኮታዊ ምድብ በዚህ ቁጥር አይወስንም። ትርጉሙ ክብደቱን ጠብቆ ውጥረቱን ሳይፈታ ያቀርባል።
- issue: በἀδελφῷ ያለው ጾታዊ አገላለጽ
  choice: ወንድማችሁን
  alternative: ወንድማችሁን ወይም እህታችሁን፤ ሌላውን አማኝ
  rationale: የምንጩ ቃል ተባዕታይ ነጠላ ነው። ዋናው ጽሑፍ ይህን ይጠብቃል፤ በአውዱ ለሌሎች ደቀ መዛሙርት በወኪልነት መቆሙ በማስታወሻ ይገለጻል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የአማርኛው ተፈጥሯዊ የሁኔታ አወቃቀር ስለሚጠይቀው የግሪኩ የአንቀጽ ቅደም ተከተል ተለውጧል፣ የትርጉም ኃይሉ ግን ተጠብቋል።
