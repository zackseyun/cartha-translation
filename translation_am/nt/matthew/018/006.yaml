    rationale: Although it intends to render πέλαγος, modern Amharic normally says ‘በክፍት ባሕር.’ This retains the sense of the open sea rather than imposing ‘depth.’
  - severity: low
    issue: ‘በአንገቱ ታስሮ’ is less precise for κρεμασθῇ.
