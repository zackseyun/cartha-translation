  text: Ὃς δ’ ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν τούτων τῶν πιστευόντων εἰς ἐμέ, συμφέρει αὐτῷ ἵνα κρεμασθῇ μύλος ὀνικὸς ⸀εἰς τὸν τράχηλον αὐτοῦ καὶ καταποντισθῇ ἐν τῷ πελάγει τῆς θαλάσσης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/006.yaml
  text: But whoever causes one of these little ones who believe in me to stumble[c][b][a], it is better for him that a donkey millstone be hung around his neck and that he be drowned in the open sea.
translation:
  language: am
  text: ነገር ግን በእኔ ከሚያምኑት ከእነዚህ ታናናሾች አንዱን የሚያሰናክል ማንም ቢሆን፣[a] በአህያ የሚዞር የወፍጮ ድንጋይ[b] በአንገቱ ላይ ተንጠልጥሎ በክፍት ባሕር ቢሰጥም ይሻለዋል።[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በእኔ ከሚያምኑት ከእነዚህ ታናናሾች አንዱን ኃጢአት እንዲሠራ የሚያደርግ።” የግሪኩ ግስ አንድን ሰው ማሰናከል፣ ከእምነት እንዲወድቅ ወይም ኃጢአት እንዲሠራ ማድረግን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “የአህያ ወፍጮ ድንጋይ፤” ይህም በአህያ የሚዞር ትልቅ የወፍጮ ድንጋይ ነው።
    reason: cultural_note
  - marker: c
    text: ወይም፣ “በባሕር ጥልቅ ስፍራ።” የግሪኩ አገላለጽ በተለይ ከዳርቻ የራቀውን ክፍት ባሕር ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίσῃ
  choice: የሚያሰናክል
  rationale: የግሪኩን የመሰናከል ምስል ይጠብቃል፤ በተመሳሳይ ጊዜ ሌላውን ኃጢአት እንዲሠራ፣ ከእምነት እንዲወድቅ ወይም በመንፈሳዊ ጉዞው እንዲሰናከል ማድረግን ሊያካትት ይችላል።
- source_word: μικρῶν τούτων
  choice: ከእነዚህ ታናናሾች
  rationale: በዕድሜ ልጆችን ብቻ ሳይወስን፣ ትሑታንን፣ ደካሞችን ወይም በሰዎች ዓይን አናሳ የተባሉ አማኞችን ሊያመለክት የሚችለውን ስፋት ይጠብቃል።
- source_word: τῶν πιστευόντων εἰς ἐμέ
  choice: በእኔ ከሚያምኑት
  rationale: የአነስተኞቹን መለያ በቀጥታና ተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: συμφέρει αὐτῷ
  choice: ይሻለዋል
  rationale: በዚህ ከባድ የማስጠንቀቂያ ንጽጽር ውስጥ ‘ለእርሱ ይበጃል’ የሚለውን ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: μύλος ὀνικὸς
  choice: በአህያ የሚዞር የወፍጮ ድንጋይ
  rationale: ὀνικός ከአህያ ጋር ያለውን ግንኙነት በግልጽ ያሳያል፤ ይህም በእጅ ከሚዞር ትንሽ ወፍጮ ይልቅ ትልቅ ድንጋይ መሆኑን ያመለክታል።
- source_word: καταποντισθῇ
  choice: ቢሰጥም
  rationale: በጥልቅ ውሃ ውስጥ ገብቶ መስጠምን በግልጽና ተፈጥሯዊ ቃል ይገልጻል።
- source_word: ἐν τῷ πελάγει τῆς θαλάσσης
  choice: በባሕር ክፍት ስፍራ
  rationale: πέλαγος ከዳርቻ የራቀውን ሰፊ ወይም ክፍት ባሕር ያመለክታል፤ ቃሉን እንደ ‘ጥልቀት’ ብቻ አይወስነውም።
theological_decisions:
