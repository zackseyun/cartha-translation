  source_fidelity: The principal sense is retained, including the broad reference of ‘these little ones,’ faith in Jesus, the donkey-operated millstone, and drowning at sea. However, the main wording ‘በባሕር ክፍት ስፍራ’ is not idiomatic modern Amharic, and ‘ታስሮ’ less exactly conveys the millstone’s being hung from the neck.
