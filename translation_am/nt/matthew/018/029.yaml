  text: πεσὼν οὖν ὁ σύνδουλος ⸀αὐτοῦ παρεκάλει αὐτὸν λέγων· Μακροθύμησον ἐπ’ ⸀ἐμοί, καὶ ἀποδώσω σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/029.yaml
  text: So his fellow servant fell down and pleaded with him[a], saying, ‘Be patient with me, and I will repay you.’
translation:
  language: am
  text: ስለዚህ አብሮት ባሪያ የሆነው ወድቆ፣ ‘ታገሠኝ፤ እከፍልሃለሁ’ እያለ ለመነው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύνδουλος
  choice: ባልንጀራው ባሪያ
  rationale: ቃሉ ከሌላው ጋር በአንድ ጌታ ሥር ያለን ባሪያ ያመለክታል። በምሳሌው ውስጥ ያለውን የጌታና የባሪያ ግንኙነት ሳያለዝብ “ባልንጀራው” የአብሮነቱን ሐሳብ ያስተላልፋል።
- source_word: πεσὼν
  choice: ወድቆ
  rationale: በትሕትና ለመለመን በአካል የመውደቁን ድርጊት በአጭሩ ይገልጣል።
- source_word: παρεκάλει
  choice: ለመነው
  rationale: በዕዳ ምክንያት የቀረበውን አጥብቆ የመማጸን ጥያቄ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  choice: ታገሠኝ
  rationale: ለጊዜው ከመቅጣት ወይም ክፍያ ከመጠየቅ ተቆጥቦ በትዕግሥት እንዲጠብቀው የቀረበውን ልመና በተለመደ አጭር አገላለጽ ያስተላልፋል።
- source_word: ἀποδώσω σοι
  choice: እከፍልሃለሁ
  rationale: በዕዳው አውድ ውስጥ የተበደረውን መልሶ የመክፈል ተስፋ በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ንግግሩን ከቀደመው ድርጊት ጋር የሚያያይዘውን የውጤትና የትረካ ቅደም ተከተል ይጠብቃል።
theological_decisions:
- issue: σύνδουλος የሚለውን የባርነት ቃል አተረጓጎም
  choice: ባልንጀራው ባሪያ
  alternative: አብሮት የሚያገለግለው
  rationale: በንጉሥ፣ በዕዳና በሥልጣን ሥር ባሉ ሰዎች ዙሪያ በተገነባው ምሳሌ ውስጥ የታሰረው ማኅበራዊ ሁኔታ ጎልቶ ይታያል። “ባሪያ” ይህን ሁኔታ ይጠብቃል፤ “ባልንጀራው” ደግሞ ሁለቱም አንድ ጌታ እንዳላቸው ያሳያል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ቀላል የሆነ አማርኛ ይጠቀማል። “ባሪያ” የግሪኩን ማኅበራዊ ግንኙነት በግልጽ ይጠብቃል፤ አማራጩ በማስታወሻ ቀርቧል።
