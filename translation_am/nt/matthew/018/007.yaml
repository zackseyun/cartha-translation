- source_word: πλήν
  choice: ነገር ግን
  rationale: ከማሰናከያዎቹ የማይቀር መምጣት ወደ ተጠያቂው ግለሰብ የሚደረገውን ጠንካራ ተቃርኖ ያሳያል።
- source_word: ἀνθρώπῳ
  choice: ሰው
  rationale: የግሪኩ ቃል በዚህ ዐውድ ግለሰባዊ ወኪልን ያመለክታል፤ ‘ሰው’ በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን የነጠላ ቁጥሩን ይጠብቃል። የግሪኩ ሰዋሰዋዊ ወንድ ፆታና ወካይ አጠቃቀም በማስታወሻ ተገልጧል።
- source_word: δι’ οὗ
  choice: በእርሱ በኩል
  rationale: ማሰናከያው የሚመጣበትን ሰብዓዊ አማካይ ወይም ወኪል በግልጽ አማርኛ ይገልጣል።
theological_decisions:
- issue: በἀνάγκη γὰρ ἐλθεῖν τὰ σκάνδαλα ያለው የግድነት ባሕርይ
  choice: ‘መምጣታቸው ግድ ነው’ ተብሎ የግድነት አገላለጹ ተጠብቋል፤ መሠረቱ ግን አልተወሰነም።
  alternative: ‘መምጣት አለባቸው’ ወይም ‘መምጣታቸው አይቀርም’
  rationale: ምንጩ ግድነትን ይገልጣል እንጂ የግድነቱን ምክንያት አይገልጽም። ትርጉሙም ቀጥተኛ መለኮታዊ አስከታይነትን ሳያስገባ ይህን የሥነ መለኮት ውጥረት ይጠብቃል።
- issue: የἀνθρώπῳ ወካይ አጠቃቀም
  choice: በዋናው ጽሑፍ ‘ሰው’ ተብሎ ነጠላ ግለሰብ ተጠቅሷል፤ ማስጠንቀቂያው ግን ማንኛውንም እንዲህ ያለ ግለሰብ እንደሚመለከት በማስታወሻ ተብራርቷል።
  alternative: ‘ለዚያ ሰው’ ወይም ‘ለማንም ሰው’
  rationale: ግሪኩ ሰዋሰዋዊ ወንድ ፆታ ያለው ነጠላ ስም ቢጠቀምም፣ በዐውዱ ወካይ ኃይል አለው። ‘ሰው’ ቁጥሩንና ሰብዓዊ ወኪልነቱን ሳያጠፋ በአማርኛ ተፈጥሯዊ ነው።
