- source_word: κόσμῳ
  choice: ለዓለም
  rationale: አካላዊውን ፍጥረት ብቻ ሳይሆን በኃጢአት የተነካውን ሰፊውን የሰው ዓለም ያመለክታል።
- source_word: ἀπὸ
  choice: በ…ምክንያት
  rationale: እዚህ የመከራውን ምክንያት የሚያሳየውን የግሪኩን ግንኙነት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: σκάνδαλα / σκάνδαλον
  choice: ማሰናከያዎች / ማሰናከያው
