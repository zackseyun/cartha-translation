base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/007.yaml
  text: Woe to the world because of stumbling blocks[a]; for it is necessary that the stumbling blocks come[b], but woe to the man through whom the stumbling block comes.
translation:
  language: am
  text: ለዓለም በማሰናከያዎች[a] ምክንያት ወዮ ነው! ማሰናከያዎች መምጣታቸው ግድ ነውና፤ ነገር ግን ማሰናከያው በሚመጣበት ሰው ላይ ወዮ ነው![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በደሎች፣” “የኃጢአት ምክንያቶች፣” ወይም “ወጥመዶች።” የግሪኩ σκάνδαλον/σκάνδαλα ሰውን እንዲሰናከል የሚያደርግ ነገርን ያመለክታል፤ ይህም ማስቀየም፣ ማታለል ወይም ለኃጢአት አጋጣሚ መሆንን ሊያጠቃልል ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “ሰው” የተተረጎመው የግሪክ ቃል በሰዋሰው ወንድ ፆታና ነጠላ ቁጥር ነው፤ እዚህ ግን ማሰናከያው በእርሱ በኩል የሚመጣበትን ማንኛውንም ግለሰብ በወካይነት ያመለክታል።
    reason: cultural_note
