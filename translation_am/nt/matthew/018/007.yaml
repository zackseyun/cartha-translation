- source_word: ἀνάγκη
  choice: ግድ ነው
  rationale: አስፈላጊነትን ወይም የማይቀርነትን በተፈጥሯዊ አማርኛ ይገልጣል፤ የዚህ ግድ መሠረት መለኮታዊ፣ ሁኔታዊ ወይም ሌላ መሆኑን አይወስንም።
- source_word: γάρ
