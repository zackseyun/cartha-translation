- from: ለዓለም ወዮለት፣ በማሰናከያዎች[a] ምክንያት! ማሰናከያዎች መምጣታቸው ግድ ነውና፤ ነገር ግን ማሰናከያው በእርሱ በኩል ለሚመጣበት ሰው ወዮለት![b]
