id: MAT.18.10
reference: Matthew 18:10
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ὁρᾶτε μὴ καταφρονήσητε ἑνὸς τῶν μικρῶν τούτων, λέγω γὰρ ὑμῖν ὅτι οἱ ἄγγελοι αὐτῶν ἐν οὐρανοῖς διὰ παντὸς βλέπουσι τὸ πρόσωπον τοῦ πατρός μου τοῦ ἐν ⸀οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/010.yaml
  text: See that you do not despise one of these little ones[c][b][a], for I tell you that their angels in heaven continually see the face of my Father who is in heaven.
translation:
  language: am
  text: ከእነዚህ ታናናሾች አንዱን እንኳ እንዳትንቁ ተጠንቀቁ፤[a] ምክንያቱም እላችኋለሁ፤ በሰማይ ያሉ መላእክቶቻቸው[b] በሰማይ ያለውን የአባቴን ፊት ሁልጊዜ ያያሉ።[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “እንዳትንቁ” ወይም “አቅልላችሁ እንዳትመለከቱ።”
    reason: lexical_alternative
  - marker: b
    text: “መላእክቶቻቸው” የሚለው ከእነዚህ ታናናሾች ጋር የተያያዙ ወይም እነርሱን የሚወክሉ መላእክትን ሊያመለክት ይችላል፤ ይህ ቁጥር ብቻውን የጠባቂ መላእክትን ሙሉ አስተምህሮ አይወስንም።
    reason: alternative_reading
  - marker: c
    text: ግሪኩ በሁለቱም ስፍራ “በሰማያት” ይላል፤ በአማርኛ በተፈጥሯዊ አነጋገር “በሰማይ” ተብሎ ተተርጉሟል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁρᾶτε μὴ καταφρονήσητε
  choice: እንዳትንቁ ተጠንቀቁ
  rationale: Ὁρᾶτε የንቃት ማስጠንቀቂያ ነው፤ ከμή እና ከአኦሪስት ሳብጀንክቲቭ ጋር ተያይዞ ክልከላን ይገልጣል። “ተጠንቀቁ” ይህን ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል፤ “እንዳትንቁ” ደግሞ καταφρονέω የሚያመለክተውን ንቀት ይጠብቃል።
- source_word: ἑνὸς τῶν μικρῶν τούτων
  choice: ከእነዚህ ታናናሾች አንዱን እንኳ
  rationale: “ታናናሾች” የእድሜንም ሆነ የዝቅተኛ ሁኔታን ፍቺ ክፍት ያደርጋል፤ “ሕፃናት” ብሎ በመተርጎም ማጥበብን ያስወግዳል። “እንኳ” አንዱም ከክልከላው ውጭ እንዳልሆነ ያጎላል።
- source_word: λέγω γὰρ ὑμῖν
  choice: ምክንያቱም እላችኋለሁ
  rationale: γάρ የምክንያት ግንኙነቱን፣ λέγω ὑμῖν ደግሞ የኢየሱስን ቀጥተኛና አጽንዖታዊ ንግግር ይጠብቃሉ።
- source_word: οἱ ἄγγελοι αὐτῶν
  choice: መላእክቶቻቸው
  rationale: የግሪኩን የባለቤትነት አገናኝ በቀጥታ ይጠብቃል፤ የግል ጠባቂ መላእክት የሚለውን የተወሰነ አስተምህሮ አያስገባም።
- source_word: ἐν οὐρανοῖς
  choice: በሰማይ ያሉ
  rationale: የግሪኩ ብዙ ቁጥር በዚህ አገላለጽ በአማርኛ “በሰማይ” ተብሎ በተፈጥሮ ይተረጎማል።
- source_word: διὰ παντὸς
  choice: ሁልጊዜ
  rationale: አገላለጹ “በሁሉም ጊዜ/ያለማቋረጥ” የሚል ፍቺ አለው፤ “ሁልጊዜ” አጭርና ተፈጥሯዊ ነው።
- source_word: βλέπουσι τὸ πρόσωπον
  choice: ፊት ... ያያሉ
  rationale: በእግዚአብሔር ፊት የመገኘትና ቀጥተኛ መዳረሻ ያለውን መጽሐፍ ቅዱሳዊ ምስል በቀጥታ ይጠብቃል።
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: በሰማይ ያለውን የአባቴን
  rationale: “አባቴ” የኢየሱስን ግልጽ የዝምድና አገላለጽ ይጠብቃል፤ ተከታዩ ሐረግ የአብን ሰማያዊ መኖሪያ ይገልጣል።
theological_decisions:
- issue: “መላእክቶቻቸው” የሚለው ትርጉም
  choice: ሐረጉን በቀጥታ “መላእክቶቻቸው” ብሎ ማቆየት፣ የግል ጠባቂ መላእክት አስተምህሮን አለመወሰን
  alternative: እያንዳንዱ ሕፃን ወይም አማኝ የተመደበለት የግል ጠባቂ መልአክ አለው ብሎ በግልጽ መተርጎም፤ ወይም በአጠቃላይ እነርሱን የሚወክሉ/የሚያገለግሉ መላእክት ብሎ መተርጎም
  rationale: ጽሑፉ የሚለው “መላእክቶቻቸው” ነው፤ የግንኙነቱን ትክክለኛ አሠራር ግን አይገልጽም። ቀጥተኛው ትርጉም ይህን ሥነ መለኮታዊ ክፍትነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለመደበኛ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ታናናሾች” የሚለው ቃል ሕፃናትን ብቻ ሳይወስን የግሪኩን ሰፊ ማጣቀሻ ይጠብቃል። የግሪኩ ሁለት ጊዜ የተጠቀሰው “በሰማይ/ሰማያት” በዋናው ጽሑፍ ሁለቱም ጊዜ ተጠብቋል።
