review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the temporal setting, the disciples’ approach to Jesus, the inferential force of ἄρα, and Matthew’s characteristic ‘kingdom of heaven’ expression. However, ታላቅ የሆነው is positive (‘the one who is great’) and does not retain the comparative morphology of μείζων.
  naturalness: The sentence is fluent, clear modern standard Amharic with an appropriately respectful biblical register. የሚበልጠው is a natural way to retain the unexpressed comparative reference without adding ‘than all’ or ‘greatest.’
  terminology: ደቀ መዛሙርቱ, ኢየሱስ, and የሰማያት መንግሥት are established and suitable terminology. No footnotes are required.
  issues:
  - severity: medium
    issue: The comparative μείζων is rendered by the positive expression ታላቅ የሆነው.
    rationale: The Greek asks who is ‘greater,’ while leaving the comparison group implicit. Replacing it with የሚበልጠው preserves that comparative sense without importing the stronger ‘greatest/of all’ interpretation.
  revised_text: በዚያን ጊዜ ደቀ መዛሙርቱ ወደ ኢየሱስ ቀርበው፣ “ታዲያ በሰማያት መንግሥት የሚበልጠው ማን ነው?” አሉት።
