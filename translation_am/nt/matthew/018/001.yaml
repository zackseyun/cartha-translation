  edition: SBLGNT
  text: Ἐν ἐκείνῃ τῇ ὥρᾳ προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ λέγοντες· Τίς ἄρα μείζων ἐστὶν ἐν τῇ βασιλείᾳ τῶν οὐρανῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/001.yaml
  text: At that time the disciples came to Jesus, saying, “Who then is greater in the kingdom of heaven?”
translation:
  language: am
  text: በዚያን ጊዜ ደቀ መዛሙርቱ ወደ ኢየሱስ ቀርበው፣ “ታዲያ በሰማያት መንግሥት የሚበልጠው ማን ነው?” አሉት።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: በዚያን ጊዜ
  rationale: የግሪኩን ጊዜያዊ አገላለጽ በተፈጥሯዊና በተለመደ አማርኛ ያስተላልፋል።
- source_word: προσῆλθον
  choice: ቀርበው
  rationale: ወደ ኢየሱስ መቅረባቸውን በግልጽ ያሳያል።
- source_word: Τίς ἄρα
  choice: ታዲያ ... ማን
  rationale: ἄρα በአውዱ ያለውን የመደምደሚያ ወይም የቀጣይ ጥያቄ ስሜት ‘ታዲያ’ ያስተላልፋል።
- source_word: μείζων
  choice: ታላቅ የሆነው
  rationale: የግሪኩ ቅጽ ንጽጽራዊ ቢሆንም ጥያቄው በመንግሥቱ ውስጥ የላቀ ደረጃ ያለውን ሰው ይጠይቃል፤ ይህ አገላለጽ የ‘ታላቅ’ ሐሳብን ሳያጋንን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: በሰማያት መንግሥት
  rationale: የማቴዎስን ባህላዊ አገላለጽና የοὐρανῶνን ብዙ ቁጥር ይጠብቃል።
theological_decisions:
- issue: μείζων ንጽጽራዊ ቅጽ
  choice: ታላቅ የሆነው
  alternative: ከሌሎች የሚበልጠው / ከሁሉ የሚበልጠው
  rationale: ምንጩ ንጽጽሩን በግልጽ ‘ከሁሉ’ ብሎ አይገድብም። የተመረጠው አገላለጽ ጥያቄውን ተፈጥሯዊ አድርጎ ሲያቀርብ ያልተገለጸውን የንጽጽር መስፈርት አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። ‘ደቀ መዛሙርቱ’ እና ‘የሰማያት መንግሥት’ የተለመዱ መጽሐፍ ቅዱሳዊ ቃላት ሆነው ተጠብቀዋል።
