  rationale: ጽሑፉ ዘዳግም 19፥15ን ያስተጋባል። የተመረጠው ትርጉም የምስክሮችን ሕጋዊ ሚና ሳያጠብ የሴማዊውን አነጋገር ይጠብቃል፤ «ክስ» ብሎ በማጥበብም አሻሚነቱን አያስወግድም።
