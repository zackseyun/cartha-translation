base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/016.yaml
  text: But if he does not listen[a], take one or two others with you[b], so that by the mouth of two or three witnesses every matter may be established.
translation:
  language: am
  text: ነገር ግን ባይሰማህ፣ ከአንተ ጋር አንድ ወይም ሁለት ሌሎችን ውሰድ፤ ነገር ሁሉ በሁለት ወይም በሦስት ምስክሮች አፍ[a] እንዲጸና ዘንድ።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «በሁለት ወይም በሦስት ምስክሮች አፍ» ማለት፣ በፍቺ፣ «በሁለት ወይም በሦስት ምስክሮች ምስክርነት» ማለት ነው።
    reason: lexical_alternative
  - marker: b
    text: ይህ አነጋገር አንድ ጉዳይ በሁለት ወይም በሦስት ምስክሮች እንዲረጋገጥ የሚያዝዘውን ዘዳግም 19፥15ን ያመለክታል።
    reason: cross_reference
lexical_decisions:
- source_word: ἀκούσῃ
  choice: ባይሰማህ
  rationale: በዚህ የተግሣጽ አውድ ἀκούω ድምፅን መስማትን ብቻ ሳይሆን ምክርን ተቀብሎ መታዘዝን ያመለክታል፤ በአማርኛም «መስማት» ይህን ሁለቱንም ሊይዝ ይችላል። የሁለተኛ ነጠላ ሰው ቅጥያው የቀደመውን የንግግር አውድ ግልጽ ያደርጋል።
- source_word: παράλαβε μετὰ σοῦ
  choice: ከአንተ ጋር ውሰድ
  rationale: የትእዛዝ ኃይሉንና μετά የሚገልጸውን አብሮነት በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἔτι ἕνα ἢ δύο
  choice: አንድ ወይም ሁለት ሌሎችን
  rationale: ἔτι በተጨማሪ የሚለውን ሐሳብ ይዟል፤ «ሌሎችን» እነዚህ ተጨማሪ ሰዎች መሆናቸውን ግልጽ ያደርጋል።
- source_word: ἵνα
  choice: ይህም … እንዲጸና ነው
  rationale: የዓላማ ግንኙነቱን በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐπὶ στόματος
  choice: በ… አፍ
  rationale: የዘዳግም 19፥15ን ሴማዊና ሕጋዊ አነጋገር ይጠብቃል፤ ትርጉሙ «በምስክርነት» መሆኑ በማስታወሻ ተገልጿል።
- source_word: μαρτύρων
  choice: ምስክሮች
  rationale: በሕጋዊና በማኅበረሰባዊ ማረጋገጫ አውድ መደበኛው ቃል ነው።
- source_word: σταθῇ
  choice: እንዲጸና
  rationale: የἵστημι ሕጋዊ አጠቃቀም ጉዳዩ ተረጋግጦ እንዲቆም የሚለውን ያሳያል፤ «ይጽና» የ«መቆም» ምስሉንና የማረጋገጥ ኃይሉን ይጠብቃል።
- source_word: πᾶν ῥῆμα
  choice: ነገሩ ሁሉ
  rationale: በዚህ ሕጋዊ አውድ ῥῆμα አንድን ቃል ብቻ ሳይሆን የሚመረመረውን ጉዳይ ያመለክታል፤ «ነገሩ ሁሉ» የጽሑፉን ስፋት ይጠብቃል።
theological_decisions:
- issue: የብሉይ ኪዳን ሕጋዊ ጥቅስና የማኅበረሰብ ተግሣጽ አውድ
  choice: «በሁለት ወይም በሦስት ምስክሮች አፍ … እንዲጸና» በማለት ሕጋዊውን ኃይልና መጽሐፍ ቅዱሳዊውን አነጋገር ማቆየት
