review_pass:
  verdict: revise
  source_fidelity: The two coordinated conditional verbs and the emphatic negation are represented well. However, ሕፃናት commonly denotes infants or very young children in modern Amharic and is narrower than the generic παιδία; ልጆች is the safer, broader equivalent here.
  naturalness: The sentence is clear and suitably solemn. Replacing ሕፃናት with ልጆች makes the comparison more natural in contemporary standard Amharic without adding an interpreted childlike quality.
  terminology: እውነት እላችኋለሁ, ካልተመለሳችሁ, ፈጽሞ አትገቡም, and የሰማያት መንግሥት appropriately preserve the saying’s register, decisive turning, emphatic οὐ μή, and Matthew’s characteristic kingdom expression.
  issues:
  - severity: medium
    issue: ሕፃናት is overly narrow for παιδία.
    rationale: The Greek παιδία denotes children generally and does not require the more specific sense of infants or very young children. ልጆች retains the generic reference and interpretive openness of the source.
  - severity: low
    issue: The kingdom phrase should explicitly retain the genitive form used in the stated terminology decision.
    rationale: Using የሰማያት መንግሥት clearly expresses ‘kingdom of heaven/the heavens’ in modern standard Amharic.
  revised_text: እንዲህም አለ፦ “እውነት እላችኋለሁ፤ ካልተመለሳችሁና እንደ ልጆች ካልሆናችሁ፣ ወደ የሰማያት መንግሥት ፈጽሞ አትገቡም።”
  revised_footnotes: []
  revision_rationale: 'The revision changes only the child term, avoiding the narrower modern sense of ሕፃናት and preserving παιδία’s broad, concrete reference. The explicit genitive in የሰማያት መንግሥት aligns the text with the established lexical decision. No footnotes are required: the passive/intransitive nuance of στραφῆτε and the force of οὐ μή are adequately represented in the main text.'
