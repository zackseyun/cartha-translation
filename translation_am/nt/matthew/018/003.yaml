id: MAT.18.3
reference: Matthew 18:3
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ἀμὴν λέγω ὑμῖν, ἐὰν μὴ στραφῆτε καὶ γένησθε ὡς τὰ παιδία, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/003.yaml
  text: And he said[a], “Truly I say to you, unless you turn and become like children[c][b], you will certainly not enter the kingdom of heaven.”
translation:
  language: am
  text: እንዲህም አለ፦ “እውነት እላችኋለሁ፤ ካልተመለሳችሁና እንደ ልጆች ካልሆናችሁ፣ ወደ የሰማያት መንግሥት ፈጽሞ አትገቡም።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀμὴν
  choice: እውነት
  rationale: የኢየሱስን የተከበረና ሥልጣናዊ አባባል በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: στραφῆτε
  choice: ካልተመለሳችሁ
  rationale: የግሱን ተገብሮ/ኢ-ተሻጋሪ ቅርጽና የወሳኝ አቅጣጫ ለውጥ ሐሳብ ይጠብቃል፤ ቴክኒካዊ የሃይማኖት ቃል አያስገባም።
- source_word: γένησθε
  choice: ካልሆናችሁ
  rationale: የሁኔታ ለውጥን በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ὡς τὰ παιδία
  choice: እንደ ሕፃናት
  rationale: ሕፃናት የተወሰነ ባሕርይ ሳይጨመርባቸው የንጽጽሩ ተጨባጭ ማጣቀሻ ሆነው ይቀርባሉ፤ በአማርኛ የግልጽ መስተዋድድ እጥረት ስለሌለ ይህ አገላለጽ ግልጽና ተፈጥሯዊ ነው።
- source_word: οὐ μὴ εἰσέλθητε
  choice: ፈጽሞ አትገቡም
  rationale: οὐ μή ያለውን አጽንዖት በጠንካራና ዘመናዊ አማርኛ ይጠብቃል።
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: የሰማያት መንግሥት
  rationale: የማቴዎስን ባሕርያዊ ብዙ ቁጥር ‘τῶν οὐρανῶν’ የሚያንጸባርቅና በአማርኛ መጽሐፍ ቅዱሳዊ ንግግር የተለመደ አገላለጽ ነው።
theological_decisions:
- issue: στραφῆτε የሚያመለክተው መመለስ
  choice: ካልተመለሳችሁ
  alternative: ካልተለወጣችሁ / ካልተለወጣችሁና ካልተመለሳችሁ
  rationale: ጽሑፉ ወሳኝ መመለስን ይጠይቃል፣ ነገር ግን የኋለኛውን ቴክኒካዊ የ‘መለወጥ’ ወይም የ‘ንስሐ’ ትምህርታዊ ቃል አያስገድድም።
- issue: ሕፃናትን መምሰል የሚያመለክተው ባሕርይ
  choice: እንደ ሕፃናት
  alternative: እንደ ትሑት ሕፃናት / እንደ ንጹሓን ሕፃናት
  rationale: ቁጥሩ ራሱ የሕፃንነትን የተወሰነ ባሕርይ አይገልጽም፤ ትሕትናን ወይም ንጽሕናን በትርጉሙ ውስጥ መጨመር የጽሑፉን ክፍት ትርጉም ያጠብባል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪክ አጽንዖት ‘ፈጽሞ’ በሚለው ቃል ተጠብቋል፤ የστραφῆτε አድራጊ ያልተገለጸበት ቅርጽም ‘ካልተመለሳችሁ’ በሚል አገላለጽ ተንጸባርቋል።
