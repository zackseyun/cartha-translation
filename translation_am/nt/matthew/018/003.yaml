revisions:
- from: እንዲህም አለ፦ “እውነት እላችኋለሁ፤ ካልተመለሳችሁና እንደ ሕፃናት ካልሆናችሁ፣ ወደ ሰማያት መንግሥት ፈጽሞ አትገቡም።”
  to: እንዲህም አለ፦ “እውነት እላችኋለሁ፤ ካልተመለሳችሁና እንደ ልጆች ካልሆናችሁ፣ ወደ የሰማያት መንግሥት ፈጽሞ አትገቡም።”
