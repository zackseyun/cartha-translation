theological_decisions:
- issue: κύριος እንደ መለኮታዊ ማዕረግ እንዳይነበብ
  choice: ጌታ ተብሎ ተተርጉሞ፣ በማስታወሻው በምሳሌው ያለውን ሰብዓዊ ጌታ እንደሚያመለክት ተገለጸ
  alternative: ባለቤት / ጌታ የሚለውን ያለ ማብራሪያ መጠቀም
