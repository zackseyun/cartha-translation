  source_fidelity: The draft accurately represents the human master (κύριος), slave (δοῦλος), compassion (σπλαγχνισθείς), release (ἀπέλυσεν), and the specific financial sense of δάνειον as a loan. However, ተወለት is not the clearest or most idiomatic modern Amharic expression for forgiving/canceling a loan; it can sound semantically unclear in this construction. ይቅር አለለት clearly conveys ἀφῆκεν αὐτῷ while retaining the forgiveness resonance.
  naturalness: የዚያ ባሪያ ጌታ and ራርቶለት are natural modern standard Amharic. Replacing ተወለት with ይቅር አለለት makes the financial-remission clause immediately clear and idiomatic.
  terminology: ባሪያ appropriately preserves the socially concrete force of δοῦλος. ጌታ properly denotes the slave's human master in this parable, and ብድር preserves the specificity of δάνειον better than the broader ዕዳ. The footnotes appropriately state the lexical alternatives without imposing a theological identification.
