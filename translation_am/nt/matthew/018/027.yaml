- issue: δοῦλος ያለውን ማኅበራዊ ሁኔታ ማሳየት
  choice: ባሪያ
  alternative: አገልጋይ
  rationale: በዕዳና በሥልጣን ላይ በተመሠረተው ምሳሌ ውስጥ የታሰረው የበታችነት ሁኔታ ስለሚገባ አለሰለሰም።
- issue: ἀφίημι የገንዘብ እና የይቅርታ ድምፅ
  choice: ተወለት
  alternative: ሰረዘለት / ይቅር አለለት
  rationale: በአውዱ የብድር ግዴታውን መሰረዝ ሲሆን፣ ቃሉ በማቴዎስ የሚያስተጋባውን የይቅርታ ትርጉም ሙሉ በሙሉ እንዳያጣ ‘ተወለት’ ተመርጧል።
