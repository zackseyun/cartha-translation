  rationale: የባለቤትነትና የሥልጣን አለመመጣጠን በዚህ የዕዳ ምሳሌ ጉልህ ስለሆነ፣ ከ‘አገልጋይ’ ይልቅ የታሰረውን ማኅበራዊ ሁኔታ በግልጽ ያሳያል።
- source_word: ἀπέλυσεν αὐτόν
