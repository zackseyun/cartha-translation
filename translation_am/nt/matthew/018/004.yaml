  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὅστις οὖν ταπεινώσει ἑαυτὸν ὡς τὸ παιδίον τοῦτο, οὗτός ἐστιν ὁ μείζων ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/004.yaml
  text: Therefore, whoever humbles himself like this child, he is the greatest in the kingdom of heaven.
translation:
  language: am
  text: ስለዚህ እንደዚህ ሕፃን ራሱን ዝቅ የሚያደርግ ማንም ቢሆን፣ በሰማያት መንግሥት ከሁሉ የሚበልጠው እርሱ ነው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταπεινώσει ἑαυτόν
  choice: ራሱን ዝቅ የሚያደርግ
  rationale: የግሪኩን ራስን በፈቃድ ዝቅ የማድረግ አገላለጽ በተፈጥሯዊና ግልጽ አማርኛ ይጠብቃል።
- source_word: ὡς τὸ παιδίον τοῦτο
  choice: እንደዚህ ሕፃን
  rationale: የንጽጽሩን ቀጥተኛነትና ኢየሱስ የጠቀሰውን በፊቱ ያለ ልጅ ይጠብቃል።
- source_word: ὁ μείζων
  choice: ከሁሉ የሚበልጠው
  rationale: በዚህ ዐውድ ያለውን የላቀ ደረጃ የሚያመለክተውን አገላለጽ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: የሰማያት መንግሥት
  rationale: የማቴዎስን ባሕርያዊ ብዙ ቁጥር ‘ሰማያት’ በቀጥታ የሚጠብቅ የተለመደ አገላለጽ ነው።
theological_decisions:
- issue: የታላቅነት መግለጫ
  choice: ከሁሉ የሚበልጠው እርሱ ነው
  alternative: ታላቅ ነው
  rationale: οὗτός ἐστιν ὁ μείζων ያለውን አጽንዖትና ንጽጽራዊ ኃይል ይጠብቃል፤ ትርጉሙን ወደ አጠቃላይ ‘ታላቅ’ አያለዝበውም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። ‘ራሱን ዝቅ ማድረግ’ የሚለው ቀጥተኛ ምስል ተጠብቋል።
