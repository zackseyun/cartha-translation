base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/021.yaml
  text: Then Peter came up to him and said[a], “Lord, how many times will my brother sin against me, and I forgive him? Up to seven times?”
translation:
  language: am
  text: ከዚያም ጴጥሮስ ወደ እርሱ ቀርቦ፣ “ጌታ ሆይ፣ ወንድሜ[a] በእኔ ላይ ኃጢአት ቢሠራ፣ ስንት ጊዜ ይቅር ልበለው? እስከ ሰባት ጊዜ ድረስ?” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወንድሜ ወይም እህቴ”፤ ግሪክኛው “ወንድሜ” ይላል፣ ነገር ግን በዚህ አውድ ቃሉ በሰፊው አብሮ ደቀ መዝሙርን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
