  choice: ከዚያም
  rationale: የትረካውን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: προσελθὼν αὐτῷ
  choice: ወደ እርሱ ቀርቦ
  rationale: ጴጥሮስ ኢየሱስን ቀርቦ መናገሩን በግልጽ ሁኔታ ይገልጣል።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: የቀጥታ ጥሪውን፣ አክብሮቱንና ሊኖረው የሚችለውን ሥነ መለኮታዊ ድምፀት ይጠብቃል።
- source_word: ποσάκις
  choice: እስከ ስንት ጊዜ
  rationale: ከሚከተለው የቁጥር ገደብ ጥያቄ ጋር ተስማሚ የሆነ የድግግሞሽ ጥያቄ ነው።
- source_word: ἁμαρτήσει εἰς ἐμὲ
  choice: በእኔ ላይ ኃጢአት ቢሠራ
  rationale: ወደ ጴጥሮስ የተመራውን በደል ይጠብቃል፤ የግሪክኛው የወደፊት ጊዜ ቅርጽ በአማርኛ ሁኔታዊ ጥያቄ በተፈጥሯዊነት ተተርጉሟል።
- source_word: ὁ ἀδελφός μου
  choice: ወንድሜ
  rationale: የምንጩን ተባዕታይ ነጠላ ቅርጽ በቀጥታ ይጠብቃል።
- source_word: καὶ ἀφήσω αὐτῷ
  choice: ይቅር ብለው
  rationale: በዚህ ሥነ ምግባራዊ አውድ ἀφίημι የሚያመለክተውን ይቅርታ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἕως ἑπτάκις
  choice: እስከ ሰባት ጊዜ
  rationale: ጴጥሮስ ያቀረበውን የላይኛው ገደብ በትክክል ይገልጣል።
theological_decisions:
- issue: በዚህ አውድ የἀδελφός ወሰን
  choice: በዋናው ጽሑፍ “ወንድሜ” ተብሎ ተተርጉሟል።
  alternative: “ወንድሜ ወይም እኅቴ” ወይም “አብሮኝ የሚያምን ሰው”
