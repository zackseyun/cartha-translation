- issue: የወደፊት ጊዜ ግሶች በአማርኛ የጥያቄ አወቃቀር
  choice: “ቢሠራና ይቅር ብለው”
  alternative: “ኃጢአት ይሠራብኝና ይቅር እለዋለሁ”
  rationale: የግሪክኛውን የጊዜ ግንኙነት በተፈጥሯዊ የአማርኛ ሁኔታዊ አገላለጽ ያቀርባል፤ ጥያቄውም ስለ ተደጋጋሚ ሁኔታ መሆኑን ግልጽ ያደርጋል።
