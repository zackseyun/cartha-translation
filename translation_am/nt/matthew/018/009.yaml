  - marker: b
    text: “ገሃነም” የመጨረሻ ፍርድን የሚያመለክት ቃል ነው፤ በተለምዶ “ሲኦል” ወይም “ገሃነም” ተብሎ ይተረጎማል።
    reason: term_explanation
lexical_decisions:
- source_word: σκανδαλίζει
