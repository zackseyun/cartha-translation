- source_word: μονόφθαλμον
  choice: አንድ ዓይን ኖሮህ
  rationale: ‘አንድ ዓይን ያለው’ የሚለውን አካላዊ ምስል በተፈጥሯዊ አገላለጽ ይጠብቃል።
