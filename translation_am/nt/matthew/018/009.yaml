base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/009.yaml
  text: And if your eye causes you to stumble[a], tear it out and throw it away from you. It is better for you to enter into life with one eye than, having two eyes[b], to be thrown into the Gehenna of fire.
translation:
  language: am
  text: ዓይንህም ቢያሰናክልህ፣[a] አውጥተህ ከአንተ አርቀህ ጣለው። አንድ ዓይን ብቻ እያለህ ወደ ሕይወት መግባት፣ ሁለት ዓይኖች እያሉህ ወደ የእሳት ገሃነም[b] ከመጣል ይሻልሃል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ኃጢአት እንድትሠራ ቢያደርግህ።” የግሪኩ ግስ ሰውን ማሰናከል፣ እንዲወድቅ ማድረግ፣ ወይም ወደ ኃጢአት መምራት ሊያመለክት ይችላል።
