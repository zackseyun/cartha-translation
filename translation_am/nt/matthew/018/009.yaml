  rationale: ለስላሳ አገላለጽ የግሪኩን አስደንጋጭ ኃይል ያዳክማል፤ ትርጉሙ ምስሉን ይጠብቃል እንጂ አተገባበሩን በትርጓሜ አይወስንም።
