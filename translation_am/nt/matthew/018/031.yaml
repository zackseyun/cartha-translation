  rationale: σύνδουλοι በአንድ ጌታ ሥር የባሪያነት ሁኔታን የሚጋሩ ሰዎችን ያመለክታል፤ ይህ አገላለጽ ትርጉሙን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τὰ γενόμενα / πάντα τὰ γενόμενα
  choice: የሆነውን / የሆነውን ሁሉ
