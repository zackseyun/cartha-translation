  text: ስለዚህ የእርሱ ባልንጀራ ባሪያዎቹ[a] የተከሰተውን ባዩ ጊዜ እጅግ አዘኑ፤ መጥተውም ለጌታቸው[b] የተከሰተውን ሁሉ በዝርዝር ነገሩት።
  philosophy: optimal-equivalence
