  rationale: ግሱ በግልጽና በሙሉ ማስረዳትን ወይም ማሳወቅን ያመለክታል፤ ይህ ምርጫ የዘገባውን ዝርዝርነት ያሳያል።
- source_word: τῷ κυρίῳ ἑαυτῶν
