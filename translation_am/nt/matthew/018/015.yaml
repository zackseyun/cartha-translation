source:
  edition: SBLGNT
  text: Ἐὰν δὲ ἁμαρτήσῃ ⸂εἰς σὲ⸃ ὁ ἀδελφός σου, ⸀ὕπαγε ἔλεγξον αὐτὸν μεταξὺ σοῦ καὶ αὐτοῦ μόνου. ἐάν σου ἀκούσῃ, ἐκέρδησας τὸν ἀδελφόν σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/015.yaml
  text: But if your brother sins against you[a], go and reprove him between you and him alone. If he listens to you[c][b], you have gained your brother.
translation:
  language: am
  text: ነገር ግን ወንድምህ ቢበድልህ[a]፣ ሄደህ ከእርሱ ጋር ብቻህን ሆነህ ገሥጸው። ቢሰማህ፣ ወንድምህን አትርፈሃል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች “ቢበድልህ” በሚለው ፈንታ “ወንድምህ ኃጢአት ቢሠራ” የሚል አጭር ንባብ አላቸው።
    reason: textual_variant
lexical_decisions:
- source_word: ἁμαρτήσῃ
  choice: ቢበድልህ
  rationale: ἐὰν ከአዮሪስት ሰብጅንክቲቭ ጋር የሚሰጠውን አጠቃላይ ሁኔታዊ አሳብ በተፈጥሯዊ አማርኛ ያቀርባል፤ εἰς σέ የግል በደልን ስለሚገልጽ፣ ‘ቢበድልህ’ የኃጢአትንና በሰሚው ላይ የተደረገ ጥፋትን በአንድነት ያሳያል።
- source_word: εἰς σέ
  choice: -ህ (በ‘ቢበድልህ’)
  rationale: በዋናው የSBLGNT ንባብ ያለውን ‘በአንተ ላይ/አንተን’ የሚለውን አሳብ በተፈጥሯዊ የአማርኛ ግስ ቅጥያ ይገልጻል፤ የአጭሩ ንባብ ልዩነት በማስታወሻ ተጠብቋል።
- source_word: ἀδελφός σου
  choice: ወንድምህ
  rationale: የግሪኩን ወንድ ነጠላ ቅርጽ በቀጥታ ይጠብቃል፤ በዐውዱ የእምነት ወንድም ወይም አብሮ ደቀ መዝሙር ሊያመለክት ይችላል።
- source_word: ὕπαγε
  choice: ሄደህ
  rationale: የትእዛዙን ‘ሂድ’ አሳብ ከቀጣዩ ትእዛዝ ጋር በተፈጥሯዊ አማርኛ ያገናኛል።
- source_word: ἔλεγξον
  choice: ስህተቱን አሳየው
  rationale: ἐλέγχω እዚህ የሰውየውን ጥፋት በግልጽ ማቅረብና ማሳመንን ያመለክታል። ‘ገሥጸው’ ሊበዛ የሚችልን ጥንካሬ ሲያስቀር፣ ይህ አባባል ትርጉሙን በዘመናዊና ግልጽ አማርኛ ይሰጣል።
- source_word: μεταξὺ σοῦ καὶ αὐτοῦ μόνου
  choice: አንተና እርሱ ብቻችሁን ሆናችሁ
  rationale: ውይይቱ የግል እንዲሆንና ሌላ ሰው እንዳይኖር የሚሰጠውን አጽንዖት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἀκούσῃ
  choice: ቢሰማህ
  rationale: ‘መስማት’ እዚህ ቃሉን ተቀብሎ ምላሽ መስጠትን ሊያካትት ይችላል፤ ‘ቢታዘዝህ’ ብሎ ከምንጩ በላይ አያጠናክርም።
- source_word: ἐκέρδησας
  choice: አትርፈሃል
  rationale: κερδαίνω ያለውን ‘ማትረፍ/ማግኘት’ ምሳሌያዊ አገላለጽ ይጠብቃል፤ ‘መልሰህ አግኝተኸዋል’ የሚለውን በምንጩ ግልጽ ያልሆነ ተጨማሪ ሐሳብ አያስገባም።
theological_decisions:
- issue: ἀδελφόςን በአካታች ቃል መተርጎም ወይስ የሰዋሰው ጾታውን መጠበቅ
  choice: ወንድምህ
  alternative: ወንድምህ ወይም እህትህ፤ የእምነት ባልንጀራህ
  rationale: ምንጩ ወንድ ነጠላ ነው፤ ሰፊው አጠቃቀም በዐውዱ ሊገባ ቢችልም ዋናው ጽሑፍ የምንጩን ቅርጽ ይጠብቃል።
- issue: የεἰς σέ የጽሑፍ ልዩነት
  choice: ‘በአንተ ላይ’ የሚለውን በ‘ቢበድልህ’ ውስጥ ማካተት
  alternative: ‘ወንድምህ ኃጢአት ቢሠራ’ የሚለው አጭር ንባብ
  rationale: የተሰጠው SBLGNT ጽሑፍ εἰς σέን ያካትታል። የጽሑፍ ልዩነቱ መመሪያው በግል በደል ብቻ ላይ ይወሰን እንደሆነ ስለሚነካ፣ አጭሩ ንባብ በማስታወሻ ተገልጿል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ምሳሌያዊ ‘ማትረፍ’ ተጠብቋል፤ የጽሑፍ ልዩነቱም ሳይደበቅ በማስታወሻ ቀርቧል።
