review_pass:
  verdict: revise
  source_fidelity: The draft correctly reflects the SBLGNT reading, including the disputed εἰς σέ (‘against you’), the private character of the action, responsive hearing, and the gain/win metaphor. However, ‘ስህተቱን አሳየው’ adds an explicit object not stated in Greek and can reduce ἔλεγξον to merely pointing out an error. ‘ገሥጸው’ is a closer, concise rendering of the imperative in this context.
  naturalness: The translation is generally clear modern standard Amharic. Recasting the privacy phrase as ‘ከእርሱ ጋር ብቻህን ሆነህ’ is more idiomatic and avoids the somewhat cumbersome ‘አንተና እርሱ ብቻችሁን ሆናችሁ.’
  terminology: ‘ወንድምህ’ appropriately preserves the masculine singular form of ἀδελφός. ‘ቢበድልህ’ naturally conveys both sin and its direction against the hearer. ‘አትርፈሃል’ suitably preserves the κερδαίνω metaphor. ‘ገሥጸው’ is formal but remains understandable and is terminologically more exact for ἔλεγξον than ‘ስህተቱን አሳየው.’
  issues:
  - severity: medium
    issue: The rendering ‘ስህተቱን አሳየው’ is less precise for ἔλεγξον.
    rationale: It explicitly supplies ‘his mistake’ and can suggest simply showing or demonstrating an error. The Greek imperative calls for reproof/correction of the person; ‘ገሥጸው’ conveys this more directly without adding an object.
  - severity: low
    issue: The privacy phrase is slightly cumbersome.
    rationale: ‘አንተና እርሱ ብቻችሁን ሆናችሁ’ is comprehensible, but ‘ከእርሱ ጋር ብቻህን ሆነህ’ is smoother while retaining the exclusivity of μεταξὺ σοῦ καὶ αὐτοῦ μόνου.
  revised_text: ነገር ግን ወንድምህ ቢበድልህ[a]፣ ሄደህ ከእርሱ ጋር ብቻህን ሆነህ ገሥጸው። ቢሰማህ፣ ወንድምህን አትርፈሃል።
