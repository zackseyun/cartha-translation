- from: እኔ ለአንተ እንደራራሁልህ፣ አንተም ለባልንጀራህ ባሪያ[a] ልትራራለት አይገባህም ነበርን?
  to: እኔም ለአንተ እንደራራሁልህ፣ አንተም ከአንተ ጋር ባሪያ የሆነውን ልትራራለት አይገባህም ነበር?
  rationale: The revision explicitly represents κἀγώ with ‘እኔም’ and replaces the unnatural phrase for σύνδουλος with an idiomatic relative construction that preserves shared slave status. The interrogative rebuke, the obligation expressed by οὐκ ἔδει, and the repeated mercy vocabulary remain intact.
