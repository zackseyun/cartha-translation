id: MAT.18.33
reference: Matthew 18:33
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὐκ ἔδει καὶ σὲ ἐλεῆσαι τὸν σύνδουλόν σου, ὡς κἀγὼ σὲ ἠλέησα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/033.yaml
  text: Should you not also have had mercy on your fellow servant[a], as I also had mercy on you?
translation:
  language: am
  text: እኔም ለአንተ እንደራራሁልህ፣ አንተም ከአንተ ጋር ባሪያ የሆነውን ልትራራለት አይገባህም ነበር?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔδει
  choice: አይገባህም ነበርን?
  rationale: ἔδει የሞራል ግዴታን ወይም ተገቢነትን ይገልጣል፤ አሉታዊ የአጠያየቅ ቅርጹም የጌታውን ወቀሳ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: καὶ σὲ
  choice: አንተም
  rationale: καί ባሪያው ሊያደርግ በሚገባውና ጌታው ቀድሞ ባደረገው መካከል ያለውን ትይዩነት ያሳያል፤ -ም ይህን በአጭሩ ይገልጣል።
- source_word: ἐλεῆσαι / ἠλέησα
  choice: ልትራራለት / እንደራራሁልህ
  rationale: በሁለቱም ቦታ ተመሳሳዩን የግስ ሥር በመጠቀም የግሪኩ ድግግሞሽ ተጠብቋል፤ ‘መራራት’ እዚህ ምሕረትን በተግባር ማሳየትን ያመለክታል።
- source_word: τὸν σύνδουλόν σου
  choice: ለባልንጀራህ ባሪያ
  rationale: σύνδουλος አንድ ጌታ ያላቸውን አብረው በባርነት ያሉ ሰዎች ያመለክታል። ‘ባልንጀራህ ባሪያ’ የጋራ ደረጃውንና የባርነት ሁኔታውን ይጠብቃል።
- source_word: ὡς κἀγὼ
  choice: እኔ ... እንደ...፣ አንተም
  rationale: ὡς ንጽጽሩን፣ κἀγώ ደግሞ የተናጋሪውን አካታች አጽንዖት ያሳያሉ። የአማርኛው ‘እንደ...፣ ...ም’ አወቃቀር ይህን ትይዩነት በተፈጥሯዊ ሁኔታ ያቀርባል።
theological_decisions:
- issue: የδοῦλος ቤተ-ቃል የሆነው σύνδουλος አተረጓጎም
  choice: ባልንጀራህ ባሪያ
  alternative: አብሮህ አገልጋይ
  rationale: ምሳሌው ስለ ንጉሥ፣ ስለ ዕዳ እና በሥልጣኑ ሥር ስላሉ ባሪያዎች ስለሆነ፣ የታሰረው የጥገኝነት ሁኔታ ጉልህ ነው። ‘ባሪያ’ ይህን ይጠብቃል፤ ለባህላዊው ‘አገልጋይ’ አተረጓጎም ግን የግርጌ ማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የንግግሩ ወቃሽ የአጠያየቅ ኃይልና በሁለቱ የምሕረት ተግባራት መካከል ያለው ትይዩነት ተጠብቀዋል።
