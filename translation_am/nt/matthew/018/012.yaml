  text: τί ὑμῖν δοκεῖ; ἐὰν γένηταί τινι ἀνθρώπῳ ἑκατὸν πρόβατα καὶ πλανηθῇ ἓν ἐξ αὐτῶν, οὐχὶ ⸀ἀφήσει τὰ ἐνενήκοντα ἐννέα ἐπὶ τὰ ὄρη ⸀καὶ πορευθεὶς ζητεῖ τὸ πλανώμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/012.yaml
  text: What do you think? If a man has a hundred sheep[a], and one of them goes astray[c][b], will he not leave the ninety-nine on the mountains and go and seek the one going astray?
translation:
  language: am
  text: ምን ይመስላችኋል? አንድ ሰው መቶ በጎች ቢኖሩትና ከእነርሱ አንዷ ብትባዝን[a]፣ ዘጠና ዘጠኙን በተራሮች ላይ[b] ትቶ ሄዶ የምትባዘነውን[c] አይፈልግምን?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «መንገድ ብትስት»። የግሪኩ ግስ «መባዘን»፣ «መንገድ መሳት» ወይም በአንዳንድ አውድ «መሳሳት» ማለት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «በኮረብቶች ላይ»።
    reason: lexical_alternative
  - marker: c
    text: ቃል በቃል፣ «እየባዘነች ያለችውን»፤ በተለምዶ «የጠፋችውን» ተብሎ ይተረጎማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: ምን ይመስላችኋል?
  rationale: የአድማጮቹን ግምት የሚጠይቀውን ቀጥተኛ ጥያቄ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: ἐὰν γένηταί τινι ἀνθρώπῳ
  choice: አንድ ሰው መቶ በጎች ቢኖሩት
  rationale: ግሪኩ እዚህ የባለቤትነትን ሁኔታ ይገልጣል፤ «አንድ ሰው» ነጠላውን ተወካይ ሰው በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: ἑκατὸν πρόβατα
  choice: መቶ በጎች
  rationale: ቁጥሩንና የእንስሳውን ስም ቀጥታ እና ግልጽ አድርጎ ያቀርባል።
- source_word: πλανηθῇ ἓν ἐξ αὐτῶν
  choice: ከእነርሱ አንዷ መንገድ ብትስት
  rationale: πλανάω የመባዘንን፣ መንገድ የመሳትን ወይም የመሳት ምክንያት መሆንን ሊገልጥ ይችላል። «መንገድ ብትስት» የበጉን ምሳሌያዊ ምስል እና ሰፊውን ሥነ ምግባራዊ ፍንጭ ይጠብቃል፣ ውጫዊ አሳሳችን ግን አይጨምርም።
- source_word: οὐχὶ ἀφήσει
  choice: ትቶ ... አይፈልግምን?
  rationale: οὐχί አዎንታዊ መልስ የሚጠብቅ ጥያቄ ነው፤ «አይፈልግምን?» ይህን በአማርኛ በተፈጥሯዊ ሁኔታ ያሳያል። «ትቶ» ጊዜያዊ መተውን እንጂ ፈጽሞ መተውን አያመለክትም።
- source_word: ἐπὶ τὰ ὄρη
  choice: በተራሮች ላይ
  rationale: ὄρη የሚለውን ተጨባጭ የመልክዓ ምድር ምስል በቅርብ ይጠብቃል።
- source_word: καὶ πορευθεὶς ζητεῖ
  choice: ሄዶ ... አይፈልግምን?
  rationale: ተሳቢውንና ዋናውን ግስ በተፈጥሯዊ የአማርኛ ቅደም ተከተል ያቀርባል፤ «ይፈልጋል» ζητέωን በዚህ አውድ በትክክል ይወክላል።
- source_word: τὸ πλανώμενον
  choice: መንገድ የሳተችውን
  rationale: ከቀደመው πλανηθῇ ጋር ያለውን የቃል ትስስር ይጠብቃል፤ «የጠፋችውን» ከማለት ይልቅ በምንጩ ያለውን ቀጣይ የመሳት ሐሳብ ያሳያል።
theological_decisions:
- issue: የπλανάω ትርጉም በበጉ ምሳሌ ውስጥ
  choice: መንገድ ብትስት / መንገድ የሳተችውን
  alternative: ብትባዝን / የባዘነችውን፤ ብትሳሳት፤ የጠፋችውን
  rationale: ይህ ምርጫ የመንገድ መሳትን ምስልና ሥነ ምግባራዊ ፍንጩን ሳያጠፋ ይይዛል። በጉ በሌላ አካል እንደተሳሳተ ወይም ሙሉ በሙሉ እንደጠፋ አይወስንም።
- issue: ἀνθρώπῳ የሚለው ነጠላ ተወካይ ሰው
  choice: አንድ ሰው
  alternative: አንድ ወንድ፤ ማንኛውም ሰው
  rationale: «አንድ ሰው» የግሪኩን ነጠላ ተወካይነት ይጠብቃል፤ በአማርኛም የጾታ ጉዳይን ሳያሰፋ ተፈጥሯዊ ነው።
translation_notes:
  register: ዘመናዊ፣ ክቡር እና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የአዎንታዊ መልስ ጥያቄው «አይፈልግምን?» በሚለው ተጠብቋል፤ የπλανάω ድግግሞሽም «መንገድ መሳት» በሚለው ሐረግ ተንጸባርቋል።
