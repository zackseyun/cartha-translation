  text: τότε προσκαλεσάμενος αὐτὸν ὁ κύριος αὐτοῦ λέγει αὐτῷ· Δοῦλε πονηρέ, πᾶσαν τὴν ὀφειλὴν ἐκείνην ἀφῆκά σοι, ἐπεὶ παρεκάλεσάς με·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/032.yaml
  text: Then his master summoned him and said to him[a], ‘Wicked servant[b], I forgave you all that debt because you pleaded with me.’
translation:
  language: am
  text: ከዚያም ጌታው ጠርቶ፣ “ክፉ ባሪያ፣ ስለለመንኸኝ ያንን ዕዳ ሁሉ ይቅር አልኩልህ[a]።” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ያንን ዕዳ ሁሉ ሰረዝኩልህ።” የግሪኩ ግስ ዕዳን መተው ወይም መሰረዝ እንዲሁም ይቅር ማለት ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: ከዚያም
  rationale: የታሪኩን ቅደም ተከተል በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: προσκαλεσάμενος
  choice: ጠርቶ
  rationale: አንድን ሰው ወደ ራስ መጥራትን ይገልጣል፤ በአውዱ የጌታው ሥልጣን ግልጽ ስለሆነ ከባድ የሕግ ቃል አያስፈልግም።
- source_word: ὁ κύριος αὐτοῦ
  choice: ጌታው
  rationale: በምሳሌው ውስጥ የባሪያውን ጌታ ያመለክታል፤ እዚህ በቀጥታ መለኮታዊ ማዕረግ አይደለም።
- source_word: Δοῦλε πονηρέ
  choice: አንተ ክፉ ባሪያ
  rationale: ባርነታዊውን ጥገኝነትና የጌታና የባሪያ ግንኙነት ግልጽ ያደርጋል፤ πονηρέ የሥነ ምግባር ውግዘትን ያሳያል።
- source_word: πᾶσαν τὴν ὀφειλὴν ἐκείνην
  choice: ያን ዕዳህን ሁሉ
  rationale: የዕዳውን ሙሉ መጠን በተፈጥሯዊ አማርኛ ይገልጣል፤ የሁለተኛ መደብ ባለቤትነት ከአውዱ ግልጽ ነው።
- source_word: ἀφῆκά σοι
  choice: ይቅር አልኩልህ
  rationale: በአማርኛ ዕዳን ለመተውም ሆነ ሰውን ይቅር ለማለት የሚሠራ በመሆኑ፣ የገንዘብ ምስሉንና የይቅርታ መልእክቱን አብሮ ይጠብቃል።
- source_word: ἐπεὶ παρεκάλεσάς με
  choice: ስለለመንኸኝ
  rationale: ἐπεὶ የምክንያት ግንኙነቱን፣ παρακαλέω ደግሞ ከልብ የሆነውን ልመና በአጭርና ተፈጥሯዊ አገላለጽ ያስተላልፋሉ።
theological_decisions:
- issue: በጌታና በδοῦλος ግንኙነት ውስጥ δοῦλοςን መተርጎም
  choice: ባሪያ
  alternative: አገልጋይ
  rationale: የምሳሌው ማኅበራዊና ሕጋዊ ግንኙነት ባርነታዊ ጥገኝነትን ስለሚያካትት፣ “ባሪያ” የግሪኩን ኃይል ይበልጥ በግልጽ ያሳያል።
- issue: በዕዳ አውድ ἀφίημιን መተርጎም
  choice: ይቅር አልኩልህ
  alternative: ዕዳህን ሰረዝኩልህ
  rationale: ቀጥተኛው ሁኔታ ዕዳን መተው ቢሆንም፣ ማቴዎስ በዕዳና በይቅርታ መካከል ያለውን ትርጉማዊ ትስስር ይጠቀማል። “ይቅር አልኩልህ” ሁለቱንም ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ታሪካዊ የአሁን ጊዜ λέγει በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜ “አለው” ተብሎ ተላልፏል።
