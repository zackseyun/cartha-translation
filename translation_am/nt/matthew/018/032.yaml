  terminology: “ጌታው” appropriately denotes the master in the parable, and “ባሪያ” preserves the salient bonded-status sense of δοῦλος. “ይቅር አልኩልህ” appropriately retains both debt-remission and forgiveness resonance; the note supplies the commercial alternative.
