source:
  edition: SBLGNT
  text: Εἰ δὲ ἡ χείρ σου ἢ ὁ πούς σου σκανδαλίζει σε, ἔκκοψον ⸀αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν εἰσελθεῖν εἰς τὴν ζωὴν ⸂κυλλὸν ἢ χωλόν⸃, ἢ δύο χεῖρας ἢ δύο πόδας ἔχοντα βληθῆναι εἰς τὸ πῦρ τὸ αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/008.yaml
  text: And if your hand or your foot causes you to stumble[a], cut it off and throw it away from you. It is better for you to enter into life maimed or lame than, having two hands or two feet, to be thrown into the eternal fire.
translation:
  language: am
  text: እጅህ ወይም እግርህ እንድትሰናከል ቢያደርግህ[a]፣ ቆርጠህ ከአንተ አርቀህ ጣለው። ሁለት እጆች ወይም ሁለት እግሮች እያሉህ ወደ ዘላለማዊው እሳት ከምትጣል፣ አካልህ ጎድሎ ወይም አንካሳ ሆነህ ወደ ሕይወት መግባት ይሻልሃል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ኃጢአት እንድትሠራ ቢያደርግህ።” የግሪኩ ግስ ቃል በቃል “እንድትሰናከል ያደርግሃል” ማለት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίζει
  choice: እንድትሰናከል ቢያደርግህ
  rationale: የግሪኩን የመሰናከል ምስላዊ አነጋገር ይጠብቃል፤ በዐውዱ ውስጥ ወደ ኃጢአት ማውደቅንም ያመለክታል።
- source_word: ἔκκοψον
  choice: ቆርጠህ
  rationale: ለእጅና ለእግር ተፈጥሯዊ የሆነውን ኃይለኛና ተጨባጭ ትእዛዝ ያስተላልፋል።
- source_word: βάλε ἀπὸ σοῦ
  choice: ከአንተ አርቀህ ጣለው
  rationale: ድርጊቱንም ሆነ ፈጽሞ ከራስ ማራቅን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: καλόν σοί ἐστιν
  choice: ይሻልሃል
  rationale: ከἢ ጋር ያለውን ንጽጽራዊ ትርጉም በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: ወደ ሕይወት መግባት
  rationale: የመግባትን አቅጣጫ ይጠብቃል፤ ζωήንም በምንጩ እንዳለው ‘ሕይወት’ ብቻ ይተረጉማል።
- source_word: κυλλὸν
  choice: እጅህ ጎድሎ
  rationale: በቅርብ ዐውዱ እጅን መቁረጥ ስለተጠቀሰ፣ የአካል ክፍል ጉድለትን በግልጽ ያሳያል።
- source_word: χωλόν
  choice: አንካሳ
  rationale: ከእግር ጉድለት ጋር የተያያዘውን የχωλός ቀጥተኛ ትርጉም ይሰጣል።
- source_word: ἔχοντα
  choice: ኖሮህ
  rationale: ሁለት እጆች ወይም ሁለት እግሮች ያሉትን ሁኔታ በተፈጥሯዊ አማርኛ በግልጽ ይወክላል።
- source_word: βληθῆναι
  choice: ከመጣል
  rationale: የግሪኩን ተደራጊ መልክ በአማርኛ የተለመደ ተደራጊ ግስ ይወክላል።
- source_word: τὸ πῦρ τὸ αἰώνιον
  choice: ዘላለም እሳት
  rationale: በፍርድ ዐውድ αἰώνιος ያለውን የዘላለማዊነት ኃይል በግልጽ ይገልጣል።
theological_decisions:
- issue: σκανδαλίζειን በመሰናከል ምስል መተርጎም ወይስ ‘ኃጢአት ማሠራት’ ብሎ መተርጎም
  choice: እንድትሰናከል ቢያደርግህ
  alternative: ኃጢአት እንድትሠራ ቢያደርግህ
  rationale: ምንጩ የመሰናከልን ምስል ይጠቀማል፤ የሥነ ምግባር ፍቺውን ዐውዱ እንዲያሳይ በማድረግ ምስሉ በዋናው ጽሑፍ ተጠብቋል።
- issue: εἰς τὴν ζωὴν ውስጥ ‘ሕይወት’ የሚለውን ማብራራት
  choice: ሕይወት
  alternative: የዘላለም ሕይወት
  rationale: ዐውዱ የመጨረሻውን ሕይወት ቢያመለክትም፣ የግሪኩ ጽሑፍ ‘ሕይወት’ ብቻ ይላል፤ ስለዚህ ተጨማሪ ቃል አልገባም።
- issue: የአካል ክፍልን ስለመቁረጥ ያለውን ትእዛዝ በዘይቤነት ማብራራት ወይስ የጽሑፉን ጥንካሬ መጠበቅ
  choice: ትእዛዙን ሳያለዝቡ በቀጥታ መተርጎም
  alternative: እንደ ጽኑ የንስሓ ጥሪ በትርጓሜ መግለጽ
  rationale: ጥቅሱ ኃይለኛ ትእዛዛዊ ቋንቋ ይጠቀማል፤ ዘይቤ መሆን አለመሆኑን ትርጉሙ በዋናው ጽሑፍ አይወስንም።
