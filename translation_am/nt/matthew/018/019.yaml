  alternative: ‘ከአባቴ ይሆንላቸዋል’ ብሎ ምንጩን ማጉላት
  rationale: παρά + ዘር አመልካች ሁለቱንም ገጽታዎች ሊሸከም ይችላል። ከγενήσεται ጋር ‘በአባቴ ይደረግላቸዋል’ ግልጽና ተፈጥሯዊ ሲሆን አብ የውጤቱ ምንጭ መሆኑንም አያጠፋም።
