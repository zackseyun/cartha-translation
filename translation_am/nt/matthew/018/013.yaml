  text: καὶ ἐὰν γένηται εὑρεῖν αὐτό, ἀμὴν λέγω ὑμῖν ὅτι χαίρει ἐπ’ αὐτῷ μᾶλλον ἢ ἐπὶ τοῖς ἐνενήκοντα ἐννέα τοῖς μὴ πεπλανημένοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/013.yaml
  text: And if he happens to find it[a], truly I tell you[b], he rejoices over it more than over the ninety-nine that have not gone astray.
translation:
  language: am
  text: እርሱን ማግኘት ቢሆንለት[a]፣ እውነት እላችኋለሁ፤ በእርሱ ያልባዘኑት ዘጠና ዘጠኙ ላይ ከሚደሰተው ይልቅ ደስ ይለዋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እርሱን ቢያገኘው።”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: -ም
  rationale: የኢየሱስን ምሳሌ ፍሰት በተፈጥሯዊ የአማርኛ አያያዥ ይቀጥላል።
- source_word: ἐὰν γένηται εὑρεῖν αὐτό
  choice: እርሱንም ቢያገኘው
  rationale: ሁኔታዊነቱን በተፈጥሯዊ አማርኛ ያሳያል፤ γένηται የሚጨምረውን ‘እንዲህ ቢሆን’ የሚል ስሜት ደግሞ የግርጌ ማስታወሻው ያብራራል።
- source_word: ἀμὴν λέγω ὑμῖν
  choice: እውነት እላችኋለሁ
  rationale: በኢየሱስ ንግግር ያለውን አጽንዖትና ክብደት ግልጽ በሆነ ዘመናዊ አማርኛ ይጠብቃል።
- source_word: χαίρει ἐπ’ αὐτῷ
  choice: በእርሱ ደስ ይለዋል
  rationale: χαίρω የሚያመለክተውን ደስታና ἐπί የሚያሳየውን የደስታ ምክንያት ተፈጥሯዊ በሆነ አገላለጽ ያስተላልፋል።
- source_word: μᾶλλον ἢ
  choice: ይልቅ
  rationale: ንጽጽሩን ሳያለዝብና አንዱን እንደማያስወግድ በቀጥታ ያሳያል።
- source_word: τοῖς ἐνενήκοντα ἐννέα
  choice: ዘጠና ዘጠኙ
  rationale: በጎቹ መሆናቸው ከአውዱ ግልጽ ስለሆነ በግሪኩ እንዳለው ስሙ አልተደገመም።
- source_word: τοῖς μὴ πεπλανημένοις
  choice: ካልባዘኑት
  rationale: የበግን ከመንገድ ወጥቶ መቅበዝበዝ ምስል ይጠብቃል፤ ፍጹም አሳቢው የሚያሳየውን ያልባዘኑ ሁኔታም በአጭሩ ያስተላልፋል።
theological_decisions:
- issue: የእረኛው የደስታ ንጽጽር ትርጉማዊ ኃይል
  choice: በተገኘው አንዱ ላይ ካልባዘኑት ዘጠና ዘጠኙ ይልቅ ደስ እንደሚለው ንጽጽሩን በቀጥታ ማቅረብ
  alternative: እረኛው ለዘጠና ዘጠኙ ግድ የለውም እንዳይመስል ንጽጽሩን ማለዘብ
  rationale: μᾶλλον ἢ እውነተኛ ንጽጽር ያቀርባል። ጽሑፉ ለዘጠና ዘጠኙ ግድ የለውም አይልም፤ ንጽጽሩንም አያለዝብም። ስለዚህ ያለው ሥነ መለኮታዊ ውጥረት ሳይፈታ ተጠብቋል።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ግልጽና ክብር ያለው ነው። የግሪኩ ሁኔታዊነት በዋናው ጽሑፍ በተፈጥሯዊ አማርኛ ቀርቦ፣ ይበልጥ መደበኛው አገላለጽ በግርጌ ማስታወሻ ተጠብቋል።
