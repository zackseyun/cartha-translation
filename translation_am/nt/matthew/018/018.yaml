  text: ἀμὴν λέγω ὑμῖν, ὅσα ⸀ἐὰν δήσητε ἐπὶ τῆς γῆς ἔσται δεδεμένα ⸀ἐν οὐρανῷ καὶ ὅσα ἐὰν λύσητε ἐπὶ τῆς γῆς ἔσται λελυμένα ⸁ἐν οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/018.yaml
  text: Truly I tell you[a], whatever you bind on earth will have been bound in heaven, and whatever you loose on earth will have been loosed in heaven.
translation:
  language: am
  text: “እውነት እላችኋለሁ፤ በምድር የምታስሩት ሁሉ በሰማይ የታሰረ ይሆናል፤ በምድርም የምትፈቱት ሁሉ በሰማይ የተፈታ ይሆናል።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በባህላዊ አተረጓጎም፣ “በሰማይ ይታሰራል … በሰማይ ይፈታል” ሊባልም ይችላል። የግሪኩ ቅርጽ ይህን አተረጓጎም ሊፈቅድ ቢችልም፣ በዋናው ጽሑፍ ያለው አገላለጽ የወደፊት ጊዜ ግስን ከፍጹም ተደራጊ ተሳቢ ጋር ያጣምራል፤ ይህም ሁኔታው በሰማይ አስቀድሞ የተመሠረተ መሆኑን ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: እውነት
  rationale: ንግግሩን በክብደትና በሥልጣን የሚያስተዋውቀውን ማረጋገጫ በዘመናዊና ግልጽ አማርኛ ያስተላልፋል።
- source_word: λέγω ὑμῖν
  choice: እላችኋለሁ
  rationale: ቀጥተኛውን የንግግር ቅርጽና ለብዙ ሰዎች የተደረገውን አድራሻ ይጠብቃል።
- source_word: ὅσα ἐὰν
  choice: የምታስሩት/የምትፈቱት ሁሉ
  rationale: ያልተወሰነውንና ሰፊውን ‘whatever’ ትርጉም በተፈጥሯዊ የአማርኛ አገላለጽ ይይዛል።
- source_word: δήσητε
  choice: የምታስሩት
  rationale: ‘ማሰር’ የሚለው ቃል ዋናውን ምሳሌያዊ ምስል ይጠብቃል፤ ትርጉሙንም ‘መከልከል’ ብቻ ብሎ አያጠብም።
- source_word: ἐπὶ τῆς γῆς
  choice: በምድር
  rationale: ከሰማይ ጋር ያለውን ተቃርኖ በተለመደና ግልጽ አገላለጽ ያሳያል።
- source_word: ἔσται δεδεμένα
  choice: የታሰረ ሆኖ ይኖራል
  rationale: የወደፊት ጊዜ የ‘መሆን’ ግስንና ፍጹም ተደራጊ አንቀጽን በማጣመር፣ ቀድሞ የተፈጸመ ድርጊት ያስከተለውን የሚቀጥል ሁኔታ ለማንጸባረቅ ይሞክራል።
- source_word: ἐν οὐρανῷ
  choice: በሰማይ
  rationale: መለኮታዊውን ዓለም የሚጠቁመውን ነጠላ ቅርጽ በመደበኛ አማርኛ ያቀርባል።
- source_word: λύσητε
  choice: የምትፈቱት
  rationale: ‘መፍታት’ ከ‘ማሰር’ ጋር ያለውን ተቃራኒ የቃል ጥምረት ይጠብቃል፤ ‘መፍቀድ’ ብቻ ወደሚል የሕግ ትርጉምም አያጠብም።
- source_word: ἔσται λελυμένα
  choice: የተፈታ ሆኖ ይኖራል
  rationale: እንደ መጀመሪያው አንቀጽ፣ ከቀድሞ ድርጊት የተገኘንና ወደፊት የሚኖርን ሁኔታ ያሳያል።
theological_decisions:
- issue: የማሰርና የመፍታት አገላለጽ ጊዜያዊና ሥነ መለኮታዊ ኃይል
  choice: “የታሰረ/የተፈታ ሆኖ ይኖራል” ተብሎ ተተርጉሟል።
