  text: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι ἐκέλευσεν αὐτὸν ὁ ⸀κύριος πραθῆναι καὶ τὴν ⸀γυναῖκα καὶ τὰ τέκνα καὶ πάντα ὅσα ⸀ἔχει καὶ ἀποδοθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/025.yaml
  text: But since he was unable to repay[a], the master ordered that he be sold, along with his wife and children and all that he had[b], and that payment be made.
translation:
  language: am
  text: ነገር ግን ሊከፍል ስላልቻለ፣ ጌታው[ሀ] እርሱን፣ ሚስቱን፣ ልጆቹንና ያለውን ሁሉ እንዲሸጡ[ለ]፣ ዕዳውም እንዲከፈል አዘዘ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: ሀ
    text: ጌታ፡ በዚህ ምሳሌ ውስጥ ቃሉ የባሪያውን ሰብዓዊ ጌታ ወይም ባለቤት ያመለክታል።
    reason: lexical_alternative
  - marker: ለ
    text: በጥንታዊው የዕዳ ሁኔታ እርሱና ቤተሰቡ እንዲሸጡ፣ ንብረቱም ለዕዳው ክፍያ እንዲውል ታዝዟል።
    reason: cultural_note
lexical_decisions:
- source_word: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι
  choice: ነገር ግን የሚከፍለው ስላልነበረው
  rationale: የግሪኩ የgenitive absolute አወቃቀር ዕዳውን ለመመለስ ገንዘብ ወይም አቅም እንዳልነበረው የሚገልጽ ምክንያታዊ ሁኔታ ነው፤ ይህ አተረጓጎም በአማርኛ ተፈጥሯዊ ሆኖ የጽሑፉን ትርጉም ይጠብቃል።
- source_word: ὁ κύριος
  choice: ጌታው
  rationale: κύριος በዚህ ምሳሌ ውስጥ የባሪያውን ሰብዓዊ ጌታ ያመለክታል። ጌታው የቃሉን መሠረታዊ ክብደትና የአውዱን ግንኙነት ይጠብቃል።
- source_word: ἐκέλευσεν
  choice: አዘዘ
  rationale: κελεύω በሥልጣን ትእዛዝ መስጠትን ያመለክታል፤ አዘዘ ቀጥተኛና ተፈጥሯዊ አማርኛ ነው።
- source_word: πραθῆναι
  choice: እንዲሸጡ
  rationale: የግሪኩ ተገብሮ የተቀመጠ የሽያጭ ትእዛዝ በአማርኛ እንዲሸጡ በሚል የይዘት ንዑስ ዐረፍተ ነገር ተፈጥሯዊ ይሆናል።
- source_word: τὴν γυναῖκα καὶ τὰ τέκνα
  choice: ሚስቱን፣ ልጆቹን
  rationale: በግሪክ ያለው የወሰን አመልካች በአውዱ ከዕዳ ባለቤቱ ጋር ያላቸውን ዝምድና ያሳያል፤ የአማርኛው ባለቤትነት ቅጥያ ይህን ግልጽ ያደርጋል።
- source_word: πάντα ὅσα ἔχει
  choice: ያለውን ሁሉ
  rationale: ሐረጉ የንብረቱን ሙሉነት ያመለክታል፤ ያለውን ሁሉ ቅርብና ተፈጥሯዊ አተረጓጎም ነው።
- source_word: καὶ ἀποδοθῆναι
  choice: ዕዳው እንዲከፈል
  rationale: ተገብሮ የቀረበው ἀποδίδωμι የሽያጩ ዓላማ ክፍያ እንዲፈጸም መሆኑን ያሳያል። ዕዳው ከቀደመው አውድ በግልጽ የሚገባ ሲሆን በአማርኛ ግልጽነትን ይሰጣል።
theological_decisions:
- issue: በምሳሌው ውስጥ κύριος የሚለውን መተርጎም
  choice: ጌታው
  alternative: ባለቤቱ
  rationale: ቃሉ በታሪኩ ውስጥ ሰብዓዊውን የባሪያው ጌታ ያመለክታል፤ ጌታው የግሪኩን የቃል ክብደት ሳያጠፋ በዚህ አውድ ተፈጥሯዊ ነው። ይህ በቀጥታ መለኮታዊ ማዕረግ እንደሆነ አይወስንም።
- issue: የመጨረሻውን ክፍያ ግልጽ ማድረግ
  choice: ዕዳው እንዲከፈል
  alternative: ክፍያው እንዲፈጸም
  rationale: ግሪኩ የሚከፈለውን ነገር በቀጥታ ባይደግምም፣ የምሳሌው ቅርብ አውድ ዕዳ መሆኑን ያሳያል። ይህ በአማርኛ ግልጽነትን ይሰጣል እንጂ አዲስ ሥነ መለኮታዊ ፍቺ አያክልም።
