  choice: እንደዚህ ያለውን ልጅ በኢየሱስ ስም መቀበል ኢየሱስን ራሱን እንደ መቀበል በቀጥታ ተገልጿል።
  alternative: ድርጊቱ ኢየሱስን ማክበር ብቻ እንደሆነ አለዝቦ መተርጎም።
