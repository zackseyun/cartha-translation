  language: am
  text: እንደዚህ ያለ አንድ ልጅን በስሜ የሚቀበል ሁሉ እኔን ይቀበላል።[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በደስታ ይቀበላል።» የግሪኩ ግስ «መቀበል፣» «በደስታ መቀበል» ወይም «ተቀባይነት መስጠት» ማለት ሊሆን ይችላል።
    reason: lexical_alternative
  - marker: b
