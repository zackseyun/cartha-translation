  register: ዘመናዊ፣ ክብር ያለውና ለሰፊው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። ‘ባሪያ’ የታሪካዊውን የግዴታ ሁኔታ ሆን ብሎ ይጠብቃል።
