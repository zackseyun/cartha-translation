- source_word: ἑκατὸν δηνάρια
  choice: መቶ ዲናር
  rationale: ታሪካዊውን የገንዘብ መለኪያ ይጠብቃል፤ ባህላዊ ዋጋው በማስታወሻ ተብራርቷል።
- source_word: κρατήσας
  choice: ይዞም
  rationale: ኃይል ተጠቅሞ መያዙን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἔπνιγεν
  choice: እያነቀው
  rationale: የኢምፐርፌክት ግሱን ቀጣይ የነበረ ኃይለኛ ድርጊት ያስተላልፋል።
- source_word: Ἀπόδος εἴ τι ὀφείλεις
  choice: ያለብህን ዕዳ ሁሉ ክፈለኝ
  rationale: በዕዳ አውድ ያለውን ጠንካራ የመመለስ ትእዛዝና የεἴ τιን ያልተወሰነ ስፋት በተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: በምሳሌያዊ ትረካ ውስጥ የδοῦλος አተረጓጎም
  choice: ባሪያ / ባልንጀራ ባሪያዎች
  alternative: አገልጋይ / ባልንጀራ አገልጋዮች
  rationale: የታሪኩ የባለቤትነት፣ የዕዳና የግዳጅ ሥልጣን መዋቅር ጎልቶ ስለሚታይ፣ ‘ባሪያ’ የጥንቱን ማኅበራዊ እውነታ ይበልጥ በትክክል ያሳያል።
- issue: የεἴ τι ὀφείλεις ያልተወሰነ አነጋገር
  choice: ያለብህን ዕዳ ሁሉ
  alternative: ዕዳ ካለብህ ክፈለኝ
  rationale: ዋናው ጽሑፍ ተፈጥሯዊ የሆነውን ጠንካራ ጥያቄ ያቀርባል፤ ቃል በቃል የሚቀርበውን አሻሚ አማራጭ ግን በማስታወሻ ይጠብቃል።
