  rationale: በምሳሌው ውስጥ ያለውን የባለቤትነትና የግዴታ ማኅበራዊ ሁኔታ ከ‘አገልጋይ’ ይልቅ በግልጽ ያሳያል።
- source_word: συνδούλων
  choice: ባልንጀራ ባሪያዎቹ
