  text: ἐὰν δὲ παρακούσῃ αὐτῶν, εἰπὸν τῇ ἐκκλησίᾳ· ἐὰν δὲ καὶ τῆς ἐκκλησίας παρακούσῃ, ἔστω σοι ὥσπερ ὁ ἐθνικὸς καὶ ὁ τελώνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/017.yaml
  text: But if he refuses to listen to them[a], tell it to the assembly. And if he also refuses to listen to the assembly, let him be to you like the Gentile and the tax collector.
translation:
  language: am
  text: እነርሱን ለመስማት እምቢ ቢል ግን፣ ጉዳዩን ለጉባኤው[a] ንገር። ጉባኤውንም ለመስማት እምቢ ቢል፣ ለአንተ እንደ አሕዛብ ሰውና እንደ ቀራጭ ይሁን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ጉባኤ» የሚለው የግሪክ ቃል ἐκκλησία ሲሆን፣ «ቤተ ክርስቲያን» ወይም «ማኅበር» ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακούσῃ
  choice: ለመስማት እምቢ ቢል
  rationale: በዚህ የተግሣጽ አውድ ቃሉ በቀላሉ አለመስማትን ሳይሆን ምክርን ለመቀበል አለመፈለግን ያመለክታል፤ ይህ አተረጓጎም የፈቃድ እምቢታውን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: εἰπὸν
  choice: ንገር
  rationale: የግሪኩን ቀጥተኛ ትእዛዝ ይጠብቃል፤ የሚነገረው ጉዳይ ከአውዱ ግልጽ ስለሆነ ተጨማሪ ነገር አልተጨመረም።
- source_word: ἐκκλησίᾳ / ἐκκλησίας
  choice: ጉባኤ / ጉባኤው
  rationale: ቃሉ የተሰበሰበውን ማኅበረሰብ ያመለክታል። «ጉባኤ» ይህን መሠረታዊ ትርጉም ይጠብቃል፣ በኋላ ዘመን የተፈጠሩ ተቋማዊ ግንዛቤዎችንም በግድ አያስገባም።
- source_word: ἔστω σοι
  choice: ለአንተ ... ይሁን
  rationale: የትእዛዙን ኃይልና የσοιን ግላዊ አቅጣጫ ይጠብቃል፤ «እንደዚህ ቁጠረው» ብሎ ከጽሑፉ በላይ አይተረጉምም።
- source_word: ὁ ἐθνικὸς
  choice: አሕዛብ ሰው
  rationale: በአይሁድ አውድ ከቃል ኪዳኑ ማኅበረሰብ ውጭ ያለን ሰው የሚወክለውን ምድብ ያሳያል፤ «አረማዊ» ሊያክለው የሚችለውን የሃይማኖት ፍርድ ያስወግዳል።
- source_word: ὁ τελώνης
  choice: ቀራጭ
  rationale: በመጽሐፍ ቅዱሳዊ አማርኛ የታወቀና በዚህ አውድ ግብር ሰብሳቢን በትክክል የሚያመለክት ቃል ነው።
theological_decisions:
- issue: በትንሣኤ በፊት ባለው የማቴዎስ የተግሣጽ አውድ ἐκκλησίαን መተርጎም
  choice: ጉባኤ
  alternative: ቤተ ክርስቲያን፣ ማኅበር
  rationale: «ጉባኤ» የተሰበሰበውን ማኅበረሰብ ዋና ትርጉም ያስቀድማል፤ የኋለኛውን ዘመን የቤተ ክርስቲያን ተቋማዊ መዋቅር ወደ ንግግሩ አያስገባም። ባህላዊና አውዳዊ አማራጮቹ በማስታወሻ ተጠብቀዋል።
- issue: ንስሓ ያልገባውን ሰው ከውጭ እንዳለ ሰው የመመልከቱ ኃይል
  choice: ለአንተ እንደ አሕዛብ ሰውና እንደ ቀራጭ ይሁን
  alternative: እንደ አሕዛብ ሰውና እንደ ቀራጭ ቁጠረው
  rationale: ትርጉሙ የግሪኩን ንጽጽርና የትእዛዝ ቅርጽ ይጠብቃል፤ ጥቅሱ ራሱ ከሚለው በላይ የተዘረጋ የማስወገድ ሥርዓት አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅመናል። «እምቢ ቢል» የቃሉን ፈቃደኛ አለመሆን በተፈጥሯዊ አነጋገር ያቀርባል፤ «ለአንተ ... ይሁን» ደግሞ የግሪኩን ቅርጽ ሳያጠፋ ሥነ መለኮታዊ ግልጽ ማድረግን ይቆጠባል።
