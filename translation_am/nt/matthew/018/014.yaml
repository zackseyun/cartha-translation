source:
  edition: SBLGNT
  text: οὕτως οὐκ ἔστιν θέλημα ⸀ἔμπροσθεν τοῦ πατρὸς ⸀ὑμῶν τοῦ ἐν οὐρανοῖς ἵνα ἀπόληται ⸀ἓν τῶν μικρῶν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/014.yaml
  text: In the same way, it is not the will of your Father in heaven that even one of these little ones should perish.
translation:
  language: am
  text: እንዲሁ፣ ከእነዚህ ታናናሾች አንዱ እንኳ እንዲጠፋ[a] በሰማያት ያለው የአባታችሁ ፈቃድ አይደለም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “እንዲጠፋ” የሚለው የግሪክ ግስ “እንዲሳት” ወይም “ወደ ጥፋት እንዲደርስ” ማለት ሊሆን ይችላል፤ ወዲያው የቀደመው የጠፋው በግ አውድ የመጀመሪያውን ትርጉም ይደግፋል።
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: እንዲሁም
  rationale: ንግግሩን ከቀደመው የጠፋው በግ ምሳሌ ጋር በተፈጥሯዊ አማርኛ ያገናኛል።
- source_word: θέλημα
  choice: ፈቃድ
  rationale: የፍላጎትንና የዓላማን ሐሳብ በክብር ያለውና የተለመደ አማርኛ ያስተላልፋል።
- source_word: ἔμπροσθεν
  choice: በ…ፊት
  rationale: የግሪኩን ቦታዊ አገላለጽ በግልጽ ሁኔታ ይጠብቃል፤ እዚህ በአብ ዘንድ ወይም በእርሱ እይታ ፈቃድ እንደሌለ ያመለክታል።
- source_word: πατρὸς ὑμῶν τοῦ ἐν οὐρανοῖς
  choice: በሰማያት ባለው አባታችሁ
  rationale: የሁለተኛ መደብ ብዙ ቁጥር ባለቤትነትንና የግሪኩን ብዙ ቁጥር ‘ሰማያት’ በተነባቢ አማርኛ ይጠብቃል።
- source_word: ἵνα ἀπόληται
  choice: እንዲጠፋ
  rationale: የአማርኛው ‘መጥፋት’ በአውዱ መጥፋትን/መሳትንም ሆነ ወደ ጥፋት መድረስን ሊያመለክት ስለሚችል የግሪኩን ሁለት ትርጉማዊ ገጽታዎች ሳይደመስስ ያቀርባል።
- source_word: ἓν
  choice: አንዱ እንኳ
  rationale: ‘እንኳ’ በአውዱ ያለውን ‘አንድም ቢሆን’ የሚል አጽንዖት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τῶν μικρῶν τούτων
  choice: ከእነዚህ ታናናሾች
  rationale: አገላለጹን በሕፃናት ብቻ ሳይገድብ፣ በምዕራፉ አውድ ውስጥ ያለውን ደቀ መዛሙርታዊና ዘይቤያዊ ስፋት ይጠብቃል።
theological_decisions:
- issue: በἀπόληται ውስጥ ያለው የ‘መጥፋት/መሳት’ እና የ‘ወደ ጥፋት መድረስ’ ውጥረት
  choice: እንዲጠፋ
  alternative: ወደ ጥፋት እንዲደርስ
  rationale: ‘እንዲጠፋ’ የሚለው በአማርኛም ሁለቱን ገጽታዎች ሊሸከም ይችላል። ቀደም ያለው የጠፋው በግ አውድ የመሳትን ትርጉም ይደግፋል፤ ግሱ ግን ከባድ ጥፋትንም ሊያመለክት ስለሚችል ይህ ውጥረት አልተወገደም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። ‘ታናናሾች’ የሚለው የዕድሜ ሕፃናትን ብቻ እንዳያመለክት ተመርጧል፤ ‘በ…ፊት’ ደግሞ የምንጩን አገላለጽ በሚነበብ መልኩ ይጠብቃል።
