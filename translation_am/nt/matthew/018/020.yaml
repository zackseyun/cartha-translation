  to: 'ማቴዎስ 18፥20


    ምክንያቱም፣ ሁለት ወይም ሦስት በስሜ የተሰበሰቡበት ስፍራ ሁሉ፣ በዚያ በመካከላቸው[a] አለሁ።


    [a] ወይም፦ «በመሀላቸው»።'
  rationale: The revision explicitly conveys γάρ with ምክንያቱም and improves the relative-clause form to የተሰበሰቡበት. ስፍራ ሁሉ idiomatically expresses the generic locative force of οὗ without defining a mode of Christ’s presence. The spatial wording and its lexical alternative are retained.
