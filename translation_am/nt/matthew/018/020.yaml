id: MAT.18.20
reference: Matthew 18:20
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὗ γάρ εἰσιν δύο ἢ τρεῖς συνηγμένοι εἰς τὸ ἐμὸν ὄνομα, ἐκεῖ εἰμι ἐν μέσῳ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/020.yaml
  text: For where two or three are gathered in my name[a], there I am in their midst.
translation:
  language: am
  text: 'ማቴዎስ 18፥20


    ምክንያቱም፣ ሁለት ወይም ሦስት በስሜ የተሰበሰቡበት ስፍራ ሁሉ፣ በዚያ በመካከላቸው[a] አለሁ።


    [a] ወይም፦ «በመሀላቸው»።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ «በመሀላቸው»።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: በ…ስፍራ
  rationale: የቦታ አገናኝ ሐረጉን በተፈጥሯዊ አማርኛ ይገልጻል፤ ‘በማንኛውም ስፍራ’ የሚለውን ሰፋ ያለ ትርጉም አይጨምርም።
- source_word: γάρ
  choice: አለሁና
  rationale: ‘-ና’ ቅጥያው ይህ ንግግር ከቀደመው አውድ ጋር ያለውን የማብራሪያ ግንኙነት በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: δύο ἢ τρεῖς
  choice: ሁለት ወይም ሦስት
  rationale: የቁጥሩን አገላለጽ በቀጥታ ይጠብቃል።
- source_word: συνηγμένοι
  choice: በተሰበሰቡበት
  rationale: ፍጹም ተደራጊ አሳታፊው የሚገልጸውን ተሰብስቦ የመገኘት ሁኔታ ያስተላልፋል።
- source_word: εἰς τὸ ἐμὸν ὄνομα
  choice: በስሜ
  rationale: ከኢየሱስ ስም፣ ሥልጣን ወይም እርሱን ከመወከል ጋር በተያያዘ መሰብሰብን የሚገልጽ ተፈጥሯዊና ያልተጠበበ የአማርኛ አገላለጽ ነው።
- source_word: ἐκεῖ
  choice: በዚያ
  rationale: ከቀደመው የቦታ ሐረግ ጋር ‘በ…ስፍራ፣ በዚያ’ የሚለውን የግሪኩን ተዛማጅ አወቃቀር ይጠብቃል።
- source_word: εἰμι
  choice: አለሁ
  rationale: ቀላሉን ‘እኔ ነኝ/አለሁ’ የሚል አሁናዊ አገላለጽ በቀጥታ ይጠብቃል፤ ‘እገኛለሁ’ ብሎ በትርጓሜ አያሰፋውም።
- source_word: ἐν μέσῳ αὐτῶν
  choice: በመካከላቸው
  rationale: የግሪኩን የመካከል ምስል በተፈጥሯዊና ግልጽ አማርኛ ይጠብቃል፤ ‘በመሀላቸው’ ተመሳሳይ አማራጭ ነው።
theological_decisions:
- issue: ኢየሱስ በስሙ በተሰበሰቡት መካከል ስለመኖሩ የተናገረው ክርስቶሎጂያዊ አንድምታ
  choice: ንግግሩን ‘በመካከላቸው አለሁ’ ብሎ በቀጥታ ማቅረብ
  alternative: ‘ከእነርሱ ጋር እገኛለሁ’ የሚል የበለጠ ትርጓሜያዊ አቀራረብ፣ ወይም ከተወሰነ ቤተ እምነታዊ የመገኘት አስተምህሮ ጋር ማያያዝ
  rationale: ጥቅሱ የኢየሱስን መገኘት በግልጽ ያረጋግጣል፤ የዚያን መገኘት ዘዴ ግን አይገልጽም። ትርጉሙ ይህን ውጥረት ሳይፈታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለሕዝብ ቀላል የሆነ መደበኛ አማርኛ ተጠቅመናል። ‘ስፍራ’ የቦታ ሐረጉን ግልጽ ያደርጋል፤ ‘አለሁ’ ደግሞ የምንጩን አጭርና ቀጥተኛ አገላለጽ ይጠብቃል።
