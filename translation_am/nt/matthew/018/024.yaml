  text: ἀρξαμένου δὲ αὐτοῦ συναίρειν ⸀προσηνέχθη ⸂αὐτῷ εἷς⸃ ὀφειλέτης μυρίων ταλάντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/024.yaml
  text: And when he began to settle accounts[a], one debtor who owed ten thousand talents was brought to him.
translation:
  language: am
  text: እርሱም ሒሳብ ማወራረድ ሲጀምር፣ አሥር ሺህ ታላንት[a] ዕዳ ያለበት አንድ ባለዕዳ ቀረበለት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ታላንት እጅግ ትልቅ የገንዘብ መለኪያ ነበር፤ በምሳሌው ዐውድ “አሥር ሺህ ታላንት” ለመገመት የሚያዳግት እጅግ ታላቅ ዕዳን ያመለክታል።
    reason: cultural_note
lexical_decisions:
- source_word: ἀρξαμένου δὲ αὐτοῦ
  choice: እርሱም ... ሲጀምር
  rationale: የግሪኩ genitive absolute ዋናው ድርጊት የተፈጸመበትን ጊዜያዊ ሁኔታ ያሳያል፤ ይህ አገላለጽ በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: συναίρειν
  choice: ሒሳብ ማወራረድ
  rationale: በገንዘብና በዕዳ አውድ ውስጥ ሒሳብን መመርመርና መዝጋትን የሚያመለክት ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
- source_word: προσηνέχθη
  choice: ቀረበ
  rationale: የግሪኩ ግስ ተደራጊ ቅርጽ ሰውየው በሌሎች ወደ ንጉሡ እንደቀረበ ያሳያል፤ በአማርኛ ‘ወደ እርሱ ቀረበ’ ይህን በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: αὐτῷ
  choice: ወደ እርሱ
  rationale: ከተደራጊው προσφέρω ጋር ያለውን የአቅጣጫ ግንኙነት በግልጽ አማርኛ ያሳያል።
- source_word: εἷς ὀφειλέτης
  choice: አንድ ባለዕዳ
  rationale: εἷς የሚለውን ግልጽ ቁጥር ‘አንድ’ በማለት ይጠብቃል፤ ‘ባለዕዳ’ም ὀφειλέτηςን በአጭርና በተለመደ ቃል ይተረጉማል።
- source_word: μυρίων ταλάντων
  choice: አሥር ሺህ ታላንት
  rationale: μύριοι የሚለውን ቁጥራዊ ትርጉም ይጠብቃል፤ ታላንት ታሪካዊ የክብደትና የገንዘብ መለኪያ ስለሆነ ወደ ዘመናዊ ምንዛሬ አልተቀየረም።
