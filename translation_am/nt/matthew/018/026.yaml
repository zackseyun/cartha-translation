base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/026.yaml
  text: So the servant fell down before him and kept pleading[a], saying, ‘Be patient with me, and I will repay you everything.’
translation:
  language: am
  text: ስለዚህ ባሪያው በፊቱ ወድቆ ይሰግድለት[a] ነበር፤ ‘ታገሠኝ፤ ሁሉንም እከፍልሃለሁ’ እያለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ‘በፊቱ ተደፋ’። የግሪኩ ግስ በሌሎች አውዶች ‘አመለከ’ ተብሎም ሊተረጎም ይችላል፤ እዚህ ግን በሰው ጌታ ፊት በክብርና በትሕትና መስገድን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: πεσὼν
  choice: ተደፍቶ
  rationale: የባሪያውን ራሱን ዝቅ አድርጎ በጌታው ፊት የመውደቅ አካላዊ ድርጊት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ድርጊቱ በቀደመው ቁጥር ከተነገረው ፍርድ የተነሣ መሆኑን ያገናኛል።
- source_word: δοῦλος
  choice: ባሪያ
  rationale: δοῦλος የሚያመለክተውን በጌታ ሥልጣን ሥር ያለ የታሰረ ማኅበራዊ ሁኔታ ከ‘አገልጋይ’ ይልቅ በግልጽ ያስተላልፋል።
- source_word: προσεκύνει
  choice: በፊቱ ተደፍቶ እየለመነው
  rationale: እዚህ ግሱ በሰው ጌታ ፊት የተደረገን የክብርና የትሕትና ስግደት ያመለክታል፤ ያልተጠናቀቀው የግሱ አቀራረብም የልመናውን ቀጣይነት በ‘እየለመነው’ ያሳያል።
- source_word: λέγων
  choice: አለ
  rationale: ቀጥተኛውን ንግግር በተፈጥሯዊ የአማርኛ አረፍተ ነገር አወቃቀር ያስገባል፤ የልመና ስሜቱ በዋናው ግስ ተገልጧል።
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  choice: ታገሠኝ
  rationale: ፍርዱን ወይም የዕዳውን ክፍያ እንዲያዘገይለትና እንዲታገሠው የሚያቀርበውን ጥያቄ አጭርና ተፈጥሯዊ በሆነ አማርኛ ያቀርባል።
- source_word: πάντα
  choice: ሁሉንም
  rationale: ዕዳውን በሙሉ እንደሚከፍል የገባውን አጠቃላይ ቃል ኪዳን ያሳያል።
- source_word: ἀποδώσω σοι
  choice: እከፍልሃለሁ
  rationale: በዕዳ አውድ ውስጥ ἀποδίδωμι የሚሰጠውን ‘ዕዳን መክፈል’ ትርጉም በቀጥታ ያስተላልፋል።
theological_decisions:
- issue: προσκυνέω ለሰው ጌታ ሲደረግ ያለው ትርጉም
  choice: በፊቱ ተደፍቶ እየለመነው
  alternative: ሰገደለት / አመለከው
  rationale: በምሳሌው ውስጥ ድርጊቱ በሰው ጌታ ፊት የተደረገ የትሕትናና የልመና ስግደት ነው። ‘አመለከው’ ማለት አውዱ የማይጠይቀውን ሃይማኖታዊ ፍቺ ሊጭን ይችላል፤ የግሪኩ ሰፊ የትርጉም ክልል ግን በማስታወሻው ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ባሪያ’ የግሪኩን ማኅበራዊ እውነታ ይጠብቃል፤ ‘ታገሠኝ’ ደግሞ የመታገስና ጊዜ የመስጠትን ጥያቄ በአጭሩ ያሳያል።
