- from: “እናንተ ግብዞች፣ የኦሪት ጸሐፍትና ፈሪሳውያን፣ ወዮላችሁ! የጽዋውንና የሳህኑን ውጭ ታጸዳላችሁ፤ ውስጣቸው ግን በንጥቂያና ራስን በማ indulge ሞልቷል።”
  to: “ወዮላችሁ፣ ጸሐፍትና ፈሪሳውያን ግብዞች! የጽዋውንና የሳህኑን ውጭ ታጸዳላችሁ፤ ውስጦቻቸው ግን በንጥቂያና ራስን ባለመግዛት ሞልተዋል።”
  rationale: The revision removes the untranslated English intrusion, uses a direct and idiomatic Amharic equivalent for ἀκρασία, restores the source order of the prophetic denunciation, and makes the plural reference to the cup and dish explicit. It maintains the vessel metaphor rather than paraphrasing it as the leaders’ inner state.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:40:45Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the denunciatory force, the cup-and-dish imagery, and the stronger exploitative sense of ἁρπαγή as «ንጥቂያ». However, the untranslated English word in the rendering of ἀκρασία is a material defect. The revision renders it with an idiomatic Amharic expression for lack of self-control and retains the plural reference of γέμουσιν.
  naturalness: «ራስን በማ indulge» is not acceptable modern standard Amharic. «ራስን ባለመግዛት» is fully Amharic, natural in a serious public-register translation, and accurately conveys undisciplined lack of self-mastery. «ውስጦቻቸው ... ሞልተዋል» clearly and naturally matches the two vessels.
  terminology: «ወዮላችሁ», «ጸሐፍት», «ፈሪሳውያን», and «ግብዞች» are suitable established terms. «ንጥቂያ» appropriately preserves the possible robbery/plunder/extortion force of ἁρπαγή without weakening it to mere greed. «ራስን ባለመግዛት» accurately renders ἀκρασία.
  issues:
  - severity: high
    issue: The translation contains the English word «indulge» in the Amharic text.
    rationale: This is an unresolved mixed-language expression and fails the required modern standard Amharic target.
  - severity: medium
    issue: The final clause uses singular «ሞልቷል» despite the Greek plural γέμουσιν and two named vessels.
    rationale: A collective singular is possible in Amharic, but an explicit plural is clearer and more closely reflects the source syntax without sacrificing naturalness.
  - severity: low
    issue: The addressees are reordered relative to the Greek.
    rationale: The original begins with the woe and then addresses the scribes, Pharisees, and hypocrites. Restoring this sequence gives a closer optimal-equivalence rendering.
