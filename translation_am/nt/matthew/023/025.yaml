id: MAT.23.25
reference: Matthew 23:25
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι καθαρίζετε τὸ ἔξωθεν τοῦ ποτηρίου καὶ τῆς παροψίδος, ἔσωθεν δὲ γέμουσιν ἐξ ἁρπαγῆς καὶ ⸀ἀκρασίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/025.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you clean the outside of the cup and the dish, but inside they are full of greed and self-indulgence.
translation:
  language: am
  text: “ወዮላችሁ፣ ጸሐፍትና ፈሪሳውያን ግብዞች! የጽዋውንና የሳህኑን ውጭ ታጸዳላችሁ፤ ውስጦቻቸው ግን በንጥቂያና ራስን ባለመግዛት ሞልተዋል።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐαὶ
  choice: ወዮላችሁ
  rationale: የትንቢታዊ ውግዘትንና የፍርድ ማስጠንቀቂያን ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: γραμματεῖς
  choice: የኦሪት ጸሐፍት
  rationale: ቃሉ ተራ ጸሐፊዎችን ሳይሆን በሙሴ ሕግ የተማሩ የሃይማኖት ሊቃውንትን እንደሚያመለክት በግልጽ ያሳያል።
- source_word: Φαρισαῖοι
  choice: ፈሪሳውያን
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የቡድኑን ስም ይጠብቃል።
- source_word: ὑποκριταί
  choice: ግብዞች
  rationale: የሃይማኖትና የሥነ ምግባር አስመሳይነትን በተለመደና ጠንካራ ቃል ይገልጻል።
- source_word: καθαρίζετε
  choice: ታጸዳላችሁ
  rationale: ቀጣይነት ያለውን የአሁን ጊዜ ድርጊት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ποτηρίου καὶ τῆς παροψίδος
  choice: የጽዋውንና የሳህኑን
  rationale: ሁለቱን የማዕድ ዕቃዎች በግልጽ ይለያል፤ ሳህን ለπαροψίς በቂ ስፋት ያለው ዘመናዊ ቃል ነው።
- source_word: ἁρπαγῆς
  choice: ንጥቂያ
  rationale: ቃሉ ከቀላል ስግብግብነት የበለጠ የሌሎችን ነገር በብዝበዛ የመውሰድ ጠንካራ ትርጉም ሊኖረው ስለሚችል ይህን ኃይል ይጠብቃል።
- source_word: ἀκρασίας
  choice: ራስን በማ indulge
  rationale: የራስ ግዛት እጦትንና ያልተገታ ፍላጎትን ለማሳየት የታሰበ ምርጫ ነው።
theological_decisions:
- issue: የውስጥ ርኩሰት ዘይቤያዊ ተጠቃሽ
  choice: ሰዎቹን ‘በውስጣችሁ’ ብሎ በግልጽ ሳይተረጉም፣ የጽዋና የሳህን ምስሉን መጠበቅ
  alternative: “በውስጣችሁ ግን በንጥቂያና ራስን በመለቀቅ ተሞልታችኋል”
  rationale: ግሪኩ በሰዎቹ ላይ እንደሚያመለክት ግልጽ ቢሆንም፣ በሰዋስው ደረጃ የዕቃዎቹን ውስጥ የሚጠቅስ ምስል ይጠብቃል።
- issue: γέμουσιν የብዙ ቁጥር ግስ
  choice: በአማርኛ ተፈጥሯዊነት ምክንያት ‘ውስጣቸው ... ሞልቷል’ የሚል የጋራ ውስጥ አገላለጽ
  alternative: “ውስጦቻቸው ... ሞልተዋል”
  rationale: የግሪኩ ግስ ብዙ ቁጥር ቢሆንም፣ ‘ውስጣቸው’ በአማርኛ ሁለቱንም ዕቃዎች በጋራ በተፈጥሯዊ ሁኔታ ይጠቅሳል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ የውግዘት ንግግር። ነገር ግን ‘ራስን በማ indulge’ የሚለው የተደባለቀ አገላለጽ በመጨረሻ አርትዖት ሙሉ በሙሉ ወደ አማርኛ መቀየር ይገባዋል።
