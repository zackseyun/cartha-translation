source:
  edition: SBLGNT
  text: καὶ πατέρα μὴ καλέσητε ὑμῶν ἐπὶ τῆς γῆς, εἷς γάρ ἐστιν ⸂ὑμῶν ὁ πατὴρ⸃ ὁ ⸀οὐράνιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/009.yaml
  text: And call no man on earth your father[a], for one is your Father[b], the heavenly One.
translation:
  language: am
  text: በምድር ላይም ማንንም ‘አባታችሁ’ ብላችሁ አትጥሩ[a]፤ አባታችሁ አንድ ነውና፣ እርሱም ሰማያዊው ነው[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በምድር ላይ ማንንም ሰው ‘አባታችሁ’ ብላችሁ አትጥሩ።»
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «አባታችሁ አንድ ነው፤ እርሱም ሰማያዊው አባት ነው።» ወይም፣ «አባታችሁ አንድ ነው፤ እርሱም በሰማይ ያለው ነው።»
    reason: lexical_alternative
lexical_decisions:
- source_word: πατέρα μὴ καλέσητε ὑμῶν
  choice: ማንንም ‘አባታችን’ ብላችሁ አትጥሩ
  rationale: μή with the aorist subjunctive gives a direct prohibition. The quotation-style Amharic construction naturally expresses calling or designating someone by the relational title ‘our father,’ while retaining the second-person plural force of ὑμῶν.
- source_word: ἐπὶ τῆς γῆς
  choice: በምድርም ላይ
  rationale: Natural Amharic for the earthly location or sphere, preserving the contrast with οὐράνιος; the conjunction καί is reflected by -ም.
- source_word: εἷς
  choice: አንድ
  rationale: Directly preserves ‘one’ without adding an explicit word for ‘only’; exclusivity remains conveyed by the construction and context.
- source_word: ὑμῶν ὁ πατήρ
  choice: አባታችሁ
  rationale: The possessive suffix naturally represents the genitive pronoun and preserves the personal relation, ‘your Father.’
- source_word: ὁ οὐράνιος
  choice: እርሱም ሰማያዊው ነው
  rationale: Treats the articular adjective substantivally as ‘the heavenly One,’ without silently expanding it to ‘who is in heaven’ or repeating ‘Father.’
theological_decisions:
- issue: የኢየሱስ ክልከላ ወሰን
  choice: The wording remains a stark command not to call anyone on earth ‘our father,’ followed by the affirmation of the one heavenly Father.
  alternative: Explain it either as an absolute ban on every biological or social use of ‘father,’ or weaken it by paraphrasing it solely as a ban on ultimate spiritual honor.
  rationale: The Greek itself does not spell out how the prohibition relates to ordinary kinship language. The translation therefore preserves its force and theological tension without supplying a denominational resolution.
- issue: ὁ οὐράνιος የሚለው ሐረግ
  choice: ሰማያዊው
  alternative: በሰማይ ያለው / ሰማያዊው አባት
  rationale: The chosen form preserves the substantival adjective and its marked wording. The alternatives are legitimate syntactic interpretations and are recorded in a footnote.
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። ‘አባታችን’ የቡድን ንግግርን በተፈጥሯዊ አማርኛ ያሳያል፤ ‘አባታችሁ’ ደግሞ የግሪኩን ሁለተኛ መደብ ብዙ ቁጥር ይጠብቃል።
