id: MAT.23.17
reference: Matthew 23:17
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: μωροὶ καὶ τυφλοί, τίς γὰρ μείζων ἐστίν, ὁ χρυσὸς ἢ ὁ ναὸς ὁ ⸀ἁγιάσας τὸν χρυσόν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/017.yaml
  text: 'You fools and blind men, for which is greater: the gold, or the temple that sanctified the gold?'
translation:
  language: am
  text: እናንተ ሞኞችና ዕውሮች! ለመሆኑ፣ ከሁለቱ የትኛው ይበልጣል፤ ወርቁ ወይስ ወርቁን የቀደሰው[a] መቅደስ[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ወርቁን ቅዱስ ያደረገው»።
    reason: lexical_alternative
  - marker: b
    text: የግሪክኛው ναός በተለይ የቤተ መቅደሱን ውስጣዊ ቅዱስ ክፍል፣ ማለትም መቅደሱን፣ ሊያመለክት ይችላል።
    reason: cultural_note
lexical_decisions:
- source_word: μωροὶ
  choice: ሞኞች
  rationale: የብዙ ቁጥር ቀጥተኛ ጥሪውንና የተግሣጹን ኃይል በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: τυφλοί
  choice: ዕውሮች
  rationale: የግሪክኛውን የብዙ ቁጥር ቀጥተኛ ጥሪ ይጠብቃል፤ በዐውዱም መንፈሳዊ አለማስተዋልን የሚወቅስ ምሳሌያዊ አጠቃቀም ነው።
- source_word: τίς γὰρ μείζων ἐστίν
  choice: ለመሆኑ፣ … ይበልጣል ወይስ …?
  rationale: በሁለት የተጠቀሱ አማራጮች መካከል የሚደረገውን ንጽጽር በተፈጥሯዊ የአማርኛ ጥያቄ ያቀርባል፤ «ለመሆኑ» የγάρን ከቀደመው ተግሣጽ ጋር ያለ ማብራሪያዊ ግንኙነት ያመለክታል።
- source_word: ὁ χρυσὸς / τὸν χρυσόν
  choice: ወርቁ / ወርቁን
  rationale: የመወሰኛ ቅጥያው በዐውዱ የተጠቀሰውን የተወሰነ ወርቅ ያመለክታል፤ መደገሙም የግሪክኛውን የንግግር ትይዩነት ይጠብቃል።
- source_word: ὁ ναὸς
  choice: መቅደስ
  rationale: ναός በተለይ የቤተ መቅደሱን ቅዱስ ሕንፃ ወይም ውስጣዊ መቅደስ ሊያመለክት ይችላል፤ «መቅደስ» ይህን ትርጉም በግልጽና በተለመደ አማርኛ ያቀርባል።
- source_word: ὁ ἁγιάσας
  choice: የቀደሰው
  rationale: የአኦሪስት ንቁ አድራጊ ቦዝ አንቀጹን በቀጥታ ይከተላል፤ መቅደሱ ለወርቁ ቅዱስ ሁኔታ እንደሚሰጥ የሚያሳየውን የአምልኮ ዐውድ ይጠብቃል።
theological_decisions:
- issue: በቤተ መቅደስ ዐውድ የἁγιάζω አተረጓጎም
  choice: የቀደሰው
  alternative: ቅዱስ ያደረገው
  rationale: «ቀደሰ» የቃሉን የአምልኮና የቅድስና መዝገብ ሳያጠብ ያስተላልፋል፤ እንዲሁም መቅደሱ ከወርቁ እንደሚበልጥ የቀረበውን የቅድስና አመክንዮ በግልጽ ያሳያል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና በቀላሉ የሚገባ አማርኛን ይጠቀማል። «እናንተ …!» የቀጥተኛውን ተግሣጽ ኃይል ሲጠብቅ፣ «ለመሆኑ … ወይስ …?» የክርክሩን ማብራሪያዊና ንጽጽራዊ ቅርጽ በተፈጥሯዊ አማርኛ ያቀርባል።
