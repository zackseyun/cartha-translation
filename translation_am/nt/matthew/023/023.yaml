  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ ἄνηθον καὶ τὸ κύμινον, καὶ ἀφήκατε τὰ βαρύτερα τοῦ νόμου, τὴν κρίσιν καὶ ⸂τὸ ἔλεος⸃ καὶ τὴν πίστιν· ⸀ταῦτα ἔδει ποιῆσαι κἀκεῖνα μὴ ⸀ἀφιέναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/023.yaml
  text: 'Woe to you[a], scribes and Pharisees, hypocrites! For you tithe mint and dill and cumin, and have neglected the weightier matters of the law: justice and mercy and faith. These you ought to have done, without neglecting the others.'
translation:
  language: am
  text: “ወዮላችሁ፣ ጸሐፍትና ፈሪሳውያን ግብዞች! ከአዝሙድ፣ ከሽብትና ከከሙን አሥራት ታወጣላችሁ፤ ነገር ግን የሕጉን ይበልጥ ክብደት ያላቸውን ጉዳዮች፣ ማለትም ፍትሕን፣ ምሕረትንና እምነትን[a] ችላ ብላችኋል። እነዚህን ማድረግ፣ እነዚያንም ችላ ሳትሉ ይገባችሁ ነበር።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ታማኝነትን።” የግሪኩ ቃል እምነትን፣ መታመንን ወይም ታማኝነትን ሊያመለክት ይችላል፤ በዚህ ሥነ ምግባራዊ አውድ ብዙዎች “ታማኝነት” ብለው ይረዱታል።
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐαὶ
  choice: ወዮላችሁ
  rationale: የነቢያዊ ውግዘትና የፍርድ ማስጠንቀቂያ ኃይሉን የሚጠብቅ ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
- source_word: γραμματεῖς
  choice: ጸሐፍት
  rationale: በወንጌላት አውድ የተለመደውን ታሪካዊ ቡድን በቀጥታ ይጠቅሳል፤ “የሕግ መምህራን” የሚለው ይበልጥ ትርጓሜያዊ ነው።
- source_word: ὑποκριταί
  choice: ግብዞች
  rationale: በዚህ አውድ ያለውን ሥነ ምግባራዊ የማስመሰል ትርጉም በተለመደና ግልጽ አማርኛ ያስተላልፋል።
- source_word: ἀποδεκατοῦτε
  choice: አሥራት ታወጣላችሁ
  rationale: አንድ አሥረኛ የመስጠትን ሕጋዊና ሃይማኖታዊ ልማድ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἡδύοσμον
  choice: አዝሙድ
  rationale: ሚንት የተባለውን ቅጠላማ ተክል ለመጥቀስ በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የተለመደ ስም ነው።
- source_word: ἄνηθον
  choice: ሽብት
  rationale: ዲል ለተባለው ቅመማ ቅመም የተለመደው ዘመናዊ የአማርኛ ስም ነው።
- source_word: κύμινον
  choice: ከሙን
  rationale: ኩሚን ለተባለው ቅመም ግልጽና የታወቀ የአማርኛ ቃል ነው።
- source_word: ἀφήκατε
  choice: ችላ ብላችኋል
  rationale: እዚህ ቃሉ ጉዳዩን ወደ ጎን መተውንና አለማድረግን ያመለክታል፤ ይህ አገላለጽ ወቀሳውን በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: τὰ βαρύτερα τοῦ νόμου
  choice: ከሕጉ ይበልጥ ክብደት ያላቸውን ጉዳዮች
  rationale: የግሪኩን የ‘ክብደት’ ዘይቤ በመጠበቅ የበለጠ ጠቃሚ የሆኑትን የሕጉ ጉዳዮች ያመለክታል።
- source_word: κρίσιν
  choice: ፍትሕን
  rationale: በዚህ ሥነ ምግባራዊ ሦስትዮሽ ውስጥ የፍርድ ድርጊትን ብቻ ሳይሆን ትክክለኛና ፍትሐዊ አድራጎትን ይገልጣል።
- source_word: ἔλεος
  choice: ምሕረትን
  rationale: የቃሉን ሰፊ መጽሐፍ ቅዱሳዊና የቃል ኪዳን ሥነ ምግባራዊ ድምፀት ይጠብቃል።
- source_word: πίστιν
  choice: እምነትን
  rationale: የቃሉን ዋናና የተለመደ ትርጉም በዋናው ጽሑፍ ይጠብቃል፤ በዚህ ሥነ ምግባራዊ አውድ “ታማኝነት” የሚለው አማራጭ በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: በሥነ ምግባራዊው ሦስትዮሽ ውስጥ πίστιν እንዴት እንደሚተረጎም
  choice: እምነትን
  alternative: ታማኝነትን
  rationale: πίστις እምነት፣ መታመን ወይም ታማኝነት ሊሆን ይችላል። ዋናው ጽሑፍ ሰፊውንና የተለመደውን “እምነት” ይዟል፤ የአውዱን የቃል ኪዳን ታማኝነት ንባብ ሳይዘጋ በግርጌ ማስታወሻ ያቀርባል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የምንጩ የ‘ክብደት’ ዘይቤና የπίστις ትርጉማዊ ክፍትነት ተጠብቀዋል።
