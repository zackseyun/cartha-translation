  yaml_path: translation/nt/matthew/023/008.yaml
  text: But you are not to be called ‘Rabbi,’ for one is your teacher[b][a], and you are all brothers.
translation:
  language: am
  text: እናንተ ግን ‘ረቢ’[a] እንዳትባሉ፤ መምህራችሁ አንድ ነውና፤ እናንተም ሁላችሁ ወንድማማቾች[b] ናችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ‘መምህር።’ ‘ረቢ’ የሚለው የአይሁድ ማዕረግ የመምህርነትን ትርጉም ይይዛል፤ በድምፅ መተርጎሙ ግን ታሪካዊ አውዱን ይጠብቃል፣ በቁጥሩም ቀጥሎ ካለው ‘መምህር’ ጋር እንዳይዋሃድ ያደርጋል።
    reason: lexical_alternative
  - marker: b
    text: ‘ወንድማማቾች’ የሚለው ተባዕታይ ብዙ ቁጥር የሆነውን ἀδελφοί ይተረጉማል። በዚህ አውድ አብረው ያሉትን ደቀ መዛሙርት በጋራ ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ κληθῆτε
  choice: ተብላችሁ አትጠሩ
