- source_word: Ῥαββί
  choice: ረቢ
  rationale: በግሪኩ የተጠበቀውን የአይሁድ ማዕረግ በድምፅ ቅርብ መልክ በማቆየት ታሪካዊ አውዱን ይጠብቃል፤ ከቀጣዩ διδάσκαλος ጋርም አያዋህደውም።
- source_word: εἷς
  choice: አንድ
  rationale: የቁጥርንና የአንድነትን አጽንዖት በቀጥታ ይጠብቃል፤ ‘አንድ ብቻ’ በማለት ከምንጩ የበለጠ አያጠናክርም።
- source_word: ὑμῶν ὁ διδάσκαλος
  choice: መምህራችሁ
  rationale: በደቀ መዛሙርቱና በመምህሩ መካከል ያለውን ዝምድና በተፈጥሯዊና አጭር አማርኛ ያሳያል።
- source_word: πάντες δὲ ὑμεῖς
  choice: እናንተም ሁላችሁ
  rationale: መላው ቡድን እኩል ሁኔታ እንዳለው የሚያሳየውን አጽንዖት ይጠብቃል።
- source_word: ἀδελφοί
  choice: ወንድማማቾች
  rationale: የግሪኩን ተባዕታይ ብዙ ቁጥርና የቤተሰብ ዘይቤ ይጠብቃል፤ በአውዱ ግን የደቀ መዛሙርትን ማኅበር በጋራ ሊያመለክት መቻሉ በማስታወሻ ተገልጿል።
theological_decisions:
- issue: የ‘ረቢ’ ማዕረግ ክልከላ ለሰዎች የሚሰጡ ማዕረጎችን ሁሉ በፍጹም ይከለክላል ወይስ በደቀ መዛሙርት ማኅበር ውስጥ ራስን ከፍ ማድረግን ያነጣጠረ ነው?
  choice: ቀጥተኛው ክልከላና በአንድ መምህር ሥር ያለው የሁሉም ወንድማማችነት እንዳለ ተጠብቋል፤ አተገባበሩ ከቁጥሩ ቃል በላይ አልተስፋፋም።
  alternative: ንግግሩን ሁሉንም የሰው ማዕረጎች ፍጹም እንደሚከለክል መተርጎም፣ ወይም ወደ ግብዝ የሥልጣን ምኞት ብቻ ማጥበብ።
  rationale: ግሪኩ ግልጽ ክልከላና ምክንያት ይሰጣል፤ ነገር ግን ለኋለኛ ዘመናት የሚኖሩትን አተገባበሮች በሙሉ አይዘረዝርም። ስለዚህ ትርጉሙ ክርክሩን አይዘጋም።
