base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/037.yaml
  text: Jerusalem[a], Jerusalem, the one who kills the prophets and stones those sent to her—how often I wanted to gather your children together, the way a hen gathers her chicks under her wings[b], and you were not willing!
translation:
  language: am
  text: ኢየሩሳሌም፣ ኢየሩሳሌም፣ ነቢያትን የምትገድዪና ወደ አንቺ የተላኩትን በድንጋይ የምትወግሪ—ልጆችሽን ለመሰብሰብ ምን ያህል ጊዜ ፈለግሁ፣ ዶሮ[a] ጫጩቶቿን በክንፎቿ ሥር እንደምትሰበስብ፤ እናንተ ግን አልፈለጋችሁም?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወፍ።” የግሪኩ ቃል በአጠቃላይ “ወፍ” ማለት ሊሆን ይችላል፤ ነገር ግን ጫጩቶቿን በክንፎቿ ሥር የምትሰበስብ ምስል በዚህ ዐውድ “ዶሮ” የሚለውን ይደግፋል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰερουσαλὴμ Ἰερουσαλήμ
  choice: ኢየሩሳሌም፣ ኢየሩሳሌም
  rationale: የቦታውን ስም በተለመደው የአማርኛ አጻጻፍ ያቀርባል፤ ድግግሞሹም አጽንዖቱንና የልቅሶ ጥሪውን ይጠብቃል።
- source_word: ἡ ἀποκτείνουσα … καὶ λιθοβολοῦσα
  choice: ነቢያትን የምትገድዪና … በድንጋይ የምትወግሪ
  rationale: የአሁን ጊዜ አሳታፊዎቹን እንደ ቀጣይ ወይም የባሕርይ መገለጫ በተፈጥሯዊ የአማርኛ አንጻራዊ ሐረግ ያቀርባል።
- source_word: τοὺς ἀπεσταλμένους πρὸς αὐτήν
  choice: ወደ አንቺ የተላኩትን
  rationale: የተደራጊ ፍጹም አሳታፊውን ይጠብቃል፤ ከተማዋን እንደ ሰው የሚያናግረውን ምስልም በሴት ነጠላ ተውላጠ ስም ያስቀጥላል።
- source_word: ποσάκις ἠθέλησα
  choice: ስንት ጊዜ ፈለግሁ
  rationale: የልቅሶውን ስሜታዊ ጥያቄና የፈቃድ/ፍላጎት ትርጉም በግልጽ ዘመናዊ አማርኛ ያቀርባል።
- source_word: ἐπισυναγαγεῖν τὰ τέκνα σου
  choice: ልጆችሽን ለመሰብሰብ
  rationale: የመሰብሰብን ድርጊትና የ‘ልጆች’ን ዘይቤ ሳይተረጉም ይጠብቃል።
- source_word: ὄρνις … τὰ νοσσία αὐτῆς
  choice: ዶሮ[a] ጫጩቶቿን
  rationale: ὄρνις በአጠቃላይ ‘ወፍ’ ሊሆን ቢችልም፣ ጫጩቶችን ከክንፍ በታች የምትሰበስብ እናታዊ ምስል በዐውዱ ‘ዶሮ’ የሚለውን ይደግፋል፤ አማራጩ በማስታወሻ ተጠብቋል።
- source_word: καὶ οὐκ ἠθελήσατε
  choice: እናንተ ግን አልፈለጋችሁም
  rationale: የግሪኩን ብዙ ቁጥር በግልጽ ያሳያል፣ እንዲሁም ከ‘ፈለግሁ’ ጋር ያለውን የፈቃድ ተቃርኖ በተመሳሳይ ግስ ይጠብቃል።
theological_decisions:
- issue: በኢየሱስ ፍላጎትና በኢየሩሳሌም ልጆች አለመፈለግ መካከል ያለው ተቃርኖ
  choice: ሁለቱንም θέλω በ‘ፈለገ’ ቤተሰብ መተርጎም
  alternative: የመጀመሪያውን ‘ወሰንሁ’ ወይም ስሜታዊ ናፍቆትን ብቻ በሚያጎላ አባባል መተርጎም
  rationale: ጥቅሱ በሁለቱ ፈቃዶች መካከል እውነተኛ ውጥረት ያቀርባል፤ ትርጉሙ ይህን ሳይፈታ ወይም ወደ ልዩ የትምህርት ሥርዓት ሳያጠብ ይጠብቀዋል።
- issue: ‘ልጆችሽ’ የሚለው ማንነት
  choice: ዘይቤያዊውን ‘ልጆችሽ’ እንዳለ ማቆየት
  alternative: ‘ሕዝብሽ’ ወይም ‘ነዋሪዎችሽ’
  rationale: ጽሑፉ ኢየሩሳሌምን እንደ ሰው አድርጎ ያናግራል፤ ንዑስ ቡድን ሳይወስን የከተማዋን ሕዝብ የሚወክለውን ምስል ይጠብቃል።
