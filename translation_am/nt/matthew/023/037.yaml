review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the vocative repetition, Jerusalem’s personification, the characteristic actions of killing and stoning, and the contrast of Jesus’ desire with the people’s unwillingness. However, it reverses the source order by placing the hen simile before “how often I wanted,” and “ከክንፎቿ በታች” is not idiomatic for ‘under her wings.’
  naturalness: The register is clear modern Amharic. Reordering the comparison after the gathering clause and using “በክንፎቿ ሥር” makes the sentence more natural while more closely reflecting the Greek syntax.
  terminology: “ኢየሩሳሌም,” “ነቢያት,” “የተላኩት,” “ልጆችሽ,” and the repeated volitional verb “ፈለግሁ/አልፈለጋችሁም” are appropriate. “ዶሮ” is an acceptable contextual rendering of ὄρνις, with the broader sense documented in the footnote.
  issues:
  - severity: medium
    issue: The hen comparison precedes the main ‘how often I wanted to gather’ clause.
    rationale: Greek places ποσάκις ἠθέλησα ἐπισυναγαγεῖν τὰ τέκνα σου before the comparison. Restoring this order improves source transparency and Amharic flow.
  - severity: medium
    issue: “ከክንፎቿ በታች” is used for ‘under her wings.’
    rationale: The preposition ከ means ‘from’; “በክንፎቿ ሥር” idiomatically expresses protection and location beneath the wings.
  revised_text: ኢየሩሳሌም፣ ኢየሩሳሌም፣ ነቢያትን የምትገድዪና ወደ አንቺ የተላኩትን በድንጋይ የምትወግሪ—ልጆችሽን ለመሰብሰብ ምን ያህል ጊዜ ፈለግሁ፣ ዶሮ[a] ጫጩቶቿን በክንፎቿ ሥር እንደምትሰበስብ፤ እናንተ ግን አልፈለጋችሁም?
