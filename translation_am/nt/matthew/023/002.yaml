  text: እንዲህ አለ፦ “የሕግ ጸሐፍትና ፈሪሳውያን በሙሴ ወንበር ላይ ተቀምጠዋል።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በሙሴ ወንበር ላይ ተቀምጠዋል” የሚለው “በሙሴ ወንበር ይቀመጣሉ” ወይም “በሙሴ ወንበር ተቀምጠዋል” ተብሎም ሊተረጎም ይችላል። “የሙሴ ወንበር” ከሙሴ ሕግ ጋር የተያያዘ የማስተማር ሥልጣንን የሚያመለክት ምሳሌያዊ አገላለጽ ነው።
