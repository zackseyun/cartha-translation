id: MAT.23.33
reference: Matthew 23:33
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὄφεις γεννήματα ἐχιδνῶν, πῶς φύγητε ἀπὸ τῆς κρίσεως τῆς γεέννης;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/033.yaml
  text: You snakes[a], offspring of vipers! How will you escape from the judgment of Gehenna?
translation:
  language: am
  text: እናንተ እባቦች፣ የእፉኝት ልጆች! ከጌሄና[a] ፍርድ እንዴት ታመልጣላችሁ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ «ከገሃነም ፍርድ»። የግሪኩ ቃል «ጌሄና» ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: ὄφεις
  choice: እባቦች
  rationale: ቀጥተኛውን የጥሪ ስድብና የእባብን ምስል በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: γεννήματα
  choice: ልጆች
  rationale: የተወለዱትን ወይም ዘሮችን ያመለክታል፤ «የእፉኝት ልጆች» በአማርኛ ግልጽና ኃይለኛ ነው።
- source_word: ἐχιδνῶν
  choice: የእፉኝት
  rationale: ከአጠቃላይ እባብ ይልቅ መርዛማውን የእባብ ዓይነት በተለየ ሁኔታ ያሳያል።
- source_word: πῶς
  choice: እንዴት
  rationale: ስለ ማምለጥ ዕድል ወይም መንገድ የሚጠይቀውን አጽንዖታዊ ጥያቄ ይጠብቃል።
- source_word: φύγητε
  choice: ታመልጣላችሁ
  rationale: ከፍርድ ለመዳን ወይም ለማምለጥ የሚደረገውን ድርጊትና የወደፊት አቅጣጫውን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: κρίσεως
  choice: ፍርድ
  rationale: የፍርድ ሂደትንም ሆነ ውጤቱን ሊያመለክት የሚችለውን ሰፊ ትርጉም ይጠብቃል፤ «ኩነኔ» ከሚለው ይልቅ አስቀድሞ ትርጓሜውን አያጠብም።
- source_word: γεέννης
  choice: ጌሄና
  rationale: የግሪኩን ልዩ መጠሪያና አይሁዳዊ ታሪካዊ ዳራ ለመጠበቅ ቃሉ በድምፅ ተቀርቧል፤ የተለመደው «ገሃነም» በማስታወሻ ቀርቧል።
theological_decisions:
- issue: የγέεννα አተረጓጎም
  choice: ጌሄና
  alternative: ገሃነም
  rationale: በምንጩ ያለውን ልዩ ስምና አይሁዳዊ የፍርድ ምስል ይጠብቃል፤ ከጊዜ በኋላ «ገሃነም» ከሚለው ቃል ጋር የተያያዙትን ትርጉሞች ሁሉ በጽሑፉ ላይ አይጭንም።
- issue: የκρίσις የፍርድ ኃይል
  choice: ፍርድ
  alternative: ኩነኔ
  rationale: ጥቅሱ ከባድ መለኮታዊ ፍርድን ቢያመለክትም፣ የግሪኩ ቃል በራሱ «ኩነኔ» ብቻ ተብሎ እንዲጠበብ አያስገድድም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው አማርኛ ተጠቅሟል። የጥቅሱ ከባድ የነቀፋ ቃና፣ የእባብና የእፉኝት ምስል፣ እንዲሁም የአጽንዖታዊው ጥያቄ ኃይል ተጠብቀዋል።
