- source_word: ποιοῦσιν πρὸς τὸ θεαθῆναι τοῖς ἀνθρώποις
  choice: የሚሠሩት በሰዎች ለመታየት ነው
  rationale: የግሪኩን የዓላማ አገባብ ግልጽ አድርጎ ያቆያል፤ ἄνθρωποι ወንዶችን ብቻ ሳይሆን ሰዎችን በአጠቃላይ ያመለክታል።
- source_word: φυλακτήρια
  choice: የቅዱስ ቃል ሳጥኖች
  rationale: አስማታዊ ክታብ የሚል የተሳሳተ ግንዛቤ ሳያስገባ፣ የቅዱስ ቃል ክፍሎችን የያዙትን ትንንሽ የቆዳ መያዣዎች በተረዳ ቋንቋ ይገልጻል።
- source_word: πλατύνουσι
  choice: ያሰፋሉ
  rationale: ‘ሰፊ ያደርጋሉ’ የሚለውን አካላዊ ምስል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: κράσπεδα
  choice: የልብስ ዘርፎች
  rationale: በአይሁድ ልብስ ጠርዝ ላይ የሚደረጉትን የታዘዙ ዘርፎች በተጨባጭ ሁኔታ ይጠቅሳል።
- source_word: μεγαλύνουσι
  choice: ያሳድጋሉ
  rationale: መጠናቸውን ትልቅ ማድረግን ያሳያል፤ ግሪኩ በቀጥታ ርዝመትን ብቻ ስለማይወስን ‘ያስረዝማሉ’ አልተባለም።
theological_decisions:
