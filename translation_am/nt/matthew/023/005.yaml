- issue: γὰρ የሚያሳየውን ማብራሪያዊ ግንኙነት በአማርኛ ማስቀመጥ
  choice: ቀጣዩን ሐረግ ከሴሚኮሎን በኋላ እንደ ማብራሪያ ማቅረብ
  alternative: ‘ምክንያቱም’ ወይም ‘እንዲያውም’ ብሎ በግልጽ አያያዥ መጀመር
  rationale: በአማርኛ ‘ምክንያቱም’ እዚህ ከባድና ከመጠን በላይ ምክንያታዊ ሊሰማ ይችላል፤ ሴሚኮሎኑ ሁለተኛው ክፍል የመጀመሪያውን ክስ በምሳሌ እንደሚያብራራ ያሳያል።
