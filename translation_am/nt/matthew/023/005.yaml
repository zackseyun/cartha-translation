  yaml_path: translation/nt/matthew/023/005.yaml
  text: But they do all their works to be seen by people[b][a], for they widen their phylacteries and enlarge their tassels.
translation:
  language: am
  text: ነገር ግን ሥራቸውን ሁሉ የሚሠሩት በሰዎች ለመታየት ነው፤ ምክንያቱም የቅዱስ ቃል ሳጥኖቻቸውን[a] ያሰፋሉ፣ የልብሳቸውንም ዘርፎች[b] ትልቅ ያደርጋሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የጸሎት ሳጥኖች።” እነዚህ የቅዱስ ቃል ክፍሎችን የያዙ ትንንሽ የቆዳ መያዣዎች ነበሩ፤ አንዳንድ አይሁድም እንደ ዘዳግም 6፥8 ያሉ ትእዛዛትን ለመፈጸም ይለብሷቸው ነበር።
    reason: cultural_note
