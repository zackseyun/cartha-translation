  text: But the greatest among you will be your servant[a].
translation:
  language: am
  text: ነገር ግን በእናንተ መካከል ከሁሉ የሚበልጠው አገልጋያችሁ ይሆናል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “ከእናንተ መካከል የሚበልጠው አገልጋያችሁ ይሆናል።” የግሪኩ ንጽጽራዊ ቅርጽ በዚህ አውድ በቡድኑ ውስጥ ከሁሉ ከፍ ያለውን ሰው ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከቀደመው የማዕረግና የክብር ፍለጋ ጋር ያለውን ተቃርኖ በዘመናዊና ግልጽ አማርኛ ያሳያል።
- source_word: μείζων
  choice: የሚበልጠው
  rationale: የግሪኩን ንጽጽራዊ ቅርጽ ይጠብቃል፤ በዚህ አውድ ግን በቡድኑ ውስጥ ከሁሉ ከፍ ያለውን በተግባር ሊያመለክት ይችላል።
- source_word: ὑμῶν (first)
  choice: ከእናንተ ሁሉ
  rationale: የክፍል አመልካች የሆነውን የግሪክ ባለቤት ቅጽ በተፈጥሯዊ አማርኛ ይገልጻል፤ ‘ሁሉ’ በቡድኑ ውስጥ ከፍተኛው የሚለውን አውዳዊ ትርጉም ግልጽ ያደርጋል።
- source_word: ἔσται
  choice: ይሆናል
  rationale: የወደፊት ጊዜውን በመደበኛና በዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ὑμῶν (second)
  choice: -አችሁ
  rationale: ከδιάκονος ጋር ያለውን የግንኙነት/የባለቤትነት ሐሳብ ‘አገልጋያችሁ’ በሚል ተፈጥሯዊ ቅርጽ ይገልጻል።
- source_word: διάκονος
  choice: አገልጋይ
  rationale: በዚህ አውድ ሌሎችን የሚያገለግል ሰው ማለት ነው፤ የተወሰነ የቤተ ክርስቲያን ሹመት እንዳይመስል ‘ዲያቆን’ አልተመረጠም።
theological_decisions:
- issue: በኢየሱስ ትምህርት ውስጥ ታላቅነትና አገልግሎት
  choice: ከእናንተ ሁሉ የሚበልጠው አገልጋያችሁ ይሆናል
  alternative: ከእናንተ የሚበልጠው አገልጋያችሁ ይሁን
  rationale: ትርጉሙ የክብር ደረጃን በአገልግሎት የሚገለብጠውን አባባል ይጠብቃል። የግሪኩን የወደፊት ጊዜ እንደ ትእዛዝ አይቀይርም፣ የኋለኛውንም ቤተ ክርስቲያናዊ ሹመት ወደ ጽሑፉ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። ‘አገልጋይ’ የአገልግሎትን ማህበራዊ ትርጉም ይጠብቃል፤ ቴክኒካዊ የቤተ ክርስቲያን ሹመትን አያመለክትም።
