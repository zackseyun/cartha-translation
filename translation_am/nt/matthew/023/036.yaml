  text: ἀμὴν λέγω ὑμῖν, ⸀ἥξει ⸂ταῦτα πάντα⸃ ἐπὶ τὴν γενεὰν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/036.yaml
  text: Truly I say to you[b][a], all these things will come upon this generation.
translation:
  language: am
  text: “እውነት እላችኋለሁ፤ እነዚህ ሁሉ[a] በዚህ ትውልድ[b] ላይ ይመጣሉ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “እነዚህ ነገሮች ሁሉ” ማለት ነው፤ “ይህ ሁሉ” ተብሎም ሊተረጎም ይችላል። የግሪኩ ቅጽ ብዙ ቁጥር ነው።
    reason: lexical_alternative
  - marker: b
    text: አንዳንዶች “ይህ ትውልድ” የሚለውን “እነዚህ ሰዎች” ወይም አለማመን የሚለይበትን ሰፊ ትውልድ እንደሚያመለክት ይረዱታል፤ የግሪኩ ቀጥተኛ ንባብ ግን “ይህ ትውልድ” ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: እውነት
  rationale: በወንጌላት ውስጥ ἀμήν ሥልጣን ያለውን ንግግር የሚያስተዋውቅ ጽኑ ማረጋገጫ ነው። “እውነት” ይህን ኃይል በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: λέγω ὑμῖν
  choice: እላችኋለሁ
  rationale: የአሁን ጊዜውን ግስና የብዙ ሰዎች ተቀባይ ቅጽ በአጭርና በተፈጥሯዊ ሁኔታ ያስተላልፋል፤ የተከበረውን የንግግር ቃናም ይጠብቃል።
- source_word: ἥξει
  choice: ይመጣሉ
  rationale: የወደፊት መምጣትን ያሳያል። በአማርኛ ግሱ ከብዙ ነገሮች ርዕሰ ጉዳይ ጋር እንዲስማማ በብዙ ቁጥር ተቀርጿል።
- source_word: ταῦτα πάντα
  choice: እነዚህ ሁሉ
  rationale: የግሪኩን ብዙ ቁጥር የጠቋሚ ቃልና የ“ሁሉ”ነት አጽንዖት ይጠብቃል፤ በአማርኛ “ነገሮች” ሳይደገምም ትርጉሙ ግልጽና ተፈጥሯዊ ነው።
- source_word: ἐπὶ
  choice: በ…ላይ
  rationale: ፍርድ ወይም መዘዝ በአንድ ወገን ላይ መድረሱን የሚገልጽ ቀጥተኛና ተፈጥሯዊ አማርኛ ነው፤ “በ…ላይ ይመጣሉ” የግሪኩን አቅጣጫዊ ኃይል ይጠብቃል።
- source_word: γενεὰν ταύτην
  choice: ይህ ትውልድ
  rationale: γενεά በዚህ አውድ በቀጥታ “ትውልድ” ማለት ነው። ሐረጉ በአማርኛ የግሱ ተደራሽ ስለሆነ “በዚህ ትውልድ ላይ” ተብሎ ቀርቧል።
theological_decisions:
- issue: የ“ይህ ትውልድ” (γενεὰν ταύτην) ወሰንና ማጣቀሻ
  choice: ይህ ትውልድ
  alternative: እነዚህ ሰዎች፤ በአለማመን የሚታወቅ ሰፊ የሰዎች ክፍል፤ ይህ ዘመን
  rationale: ቀጥተኛው የግሪክ ንባብ “ይህ ትውልድ” ነው። ትርጉሙ የሐረጉን ክርክር ያለበት የጊዜና የሰዎች ማጣቀሻ በአንድ የሥነ መለኮት ሥርዓት አይወስንም።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የኢየሱስን ጽኑ የንግግር ቃና “እውነት እላችኋለሁ” ይጠብቃል፤ የ“ይህ ትውልድ” ሥነ መለኮታዊ ውጥረትም ሳይፈታ ተቀምጧል።
