base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/003.yaml
  text: Therefore[a], do and keep everything they tell you, but do not do according to their works, for they say and do not do.
translation:
  language: am
  text: 'ስለዚህ የሚሏችሁን ሁሉ አድርጉ፣ ጠብቁም፤ ነገር ግን እንደ ሥራዎቻቸው አታድርጉ[a]፤ ይናገራሉና፣ ግን አያደርጉም።


    [a] ወይም፣ “እንደሚያደርጉት አታድርጉ።”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እንደሚያደርጉት አታድርጉ።”
    reason: κατὰ τὰ ἔργα αὐτῶν የሚለውን በተፈጥሯዊ የአማርኛ አገላለጽ ያቀርባል፤ የዋናውን ጽሑፍ የ“ሥራ” ቃላዊ ግንኙነት አይተካም።
lexical_decisions:
- source_word: πάντα οὖν ὅσα ἐὰν
  choice: ስለዚህ … ሁሉ
  rationale: οὖν የምክንያታዊ ድምዳሜ ግንኙነቱን “ስለዚህ” በማለት ያሳያል፤ πάντα ὅσα ἐὰν ያለው አጠቃላይ ኃይል “የሚሏችሁን ሁሉ” ተብሎ ተጠብቋል።
- source_word: εἴπωσιν ὑμῖν
  choice: የሚሏችሁን
  rationale: λέγω በቀጥታ “ማለት/መናገር” ማለት ነው። “የሚያስተምሯችሁን” ማለት በግሪኩ ያልተገለጸውን የትምህርት ትርጉም ይጨምራል።
- source_word: ποιήσατε καὶ τηρεῖτε
  choice: አድርጉ፣ ጠብቁም
  rationale: ሁለቱ የተለያዩ ግሶች ሳይዋሃዱ ተጠብቀዋል። ποιέω “ማድረግ” ሲሆን τηρέω እዚህ “መጠበቅ/መፈጸም” የሚለውን ሐሳብ ይይዛል።
- source_word: κατὰ δὲ τὰ ἔργα αὐτῶν μὴ ποιεῖτε
  choice: ነገር ግን እንደ ሥራቸው አታድርጉ
  rationale: κατά የመመሳሰልን ወይም የመከተልን መስፈርት ስለሚገልጽ “እንደ” ተብሏል። ἔργα “ሥራ” ተብሎ በመተርጎም የድርጊት ቃላት ግንኙነት ተጠብቋል።
- source_word: λέγουσιν γὰρ καὶ οὐ ποιοῦσιν
  choice: ይናገራሉና፣ ግን አያደርጉም
  rationale: γάρ የሚሰጠው ምክንያት “-ና” በሚለው አያያዥ ተገልጿል። καί በዚህ አውድ ያለው ተቃርኖ በተፈጥሯዊ አማርኛ “ግን” ተገልጿል፤ ποιέω በድጋሚ “ማድረግ” ተብሎ የንግግሩ ድግግሞሽ ተጠብቋል።
theological_decisions:
- issue: በቀደመው አውድ የተጠቀሱትን ጸሐፍትና ፈሪሳውያን የማስተማር ሥልጣን በዚህ ቁጥር በግልጽ መጨመር ወይም አለመጨመር
  choice: ተሳቢዎቹንና የሚሉትን ነገር ከአውዱ እንዲታወቅ በመተው፣ ቁጥሩ የሚናገረውን ብቻ መተርጎም
  alternative: “የሚያስተምሯችሁን ሁሉ” ወይም “ከሙሴ ወንበር የሚነግሯችሁን ሁሉ” ብሎ ማስፋት
  rationale: ቀዳሚው አውድ ተሳቢዎቹን ይለያል፤ ይህ ቁጥር ግን እነዚያን ዝርዝሮች አይደግምም። ስለዚህ ትርጓሜያዊ ማብራሪያ ወደ ዋናው ጽሑፍ አልተጨመረም።
- issue: ποιέω የሚለውን ግስ ድግግሞሽ ማለስለስ ወይም መጠበቅ
  choice: “አድርጉ … አታድርጉ … አያደርጉም” በማለት ድግግሞሹን መጠበቅ
  alternative: “ፈጽሙ … አትምሰሏቸው … ተግባራዊ አያደርጉም” በሚሉ የተለያዩ ግሶች ማለስለስ
  rationale: የግሱ ድግግሞሽ በንግግርና በተግባር መካከል ያለውን ግጭት ያጎላል፤ ስለዚህ ይህ የአጻጻፍና የሐሳብ ገጽታ ተጠብቋል።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ ነው። “ሥራ” የሚለው ቃል የግሪኩን ἔργα ቅርጽ ይጠብቃል፤ የበለጠ ተፈጥሯዊው አማራጭ በእግር ማስታወሻ ቀርቧል።
