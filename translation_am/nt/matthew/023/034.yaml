id: MAT.23.34
reference: Matthew 23:34
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἰδοὺ ἐγὼ ἀποστέλλω πρὸς ὑμᾶς προφήτας καὶ σοφοὺς καὶ γραμματεῖς· ⸀ἐξ αὐτῶν ἀποκτενεῖτε καὶ σταυρώσετε, καὶ ἐξ αὐτῶν μαστιγώσετε ἐν ταῖς συναγωγαῖς ὑμῶν καὶ διώξετε ἀπὸ πόλεως εἰς πόλιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/034.yaml
  text: Therefore, look, I am sending to you prophets and wise men and scribes. Some of them you will kill and crucify, and some of them you will flog in your synagogues and persecute from city to city.
translation:
  language: am
  text: ስለዚህ እነሆ፣ ነቢያትን፣ ጥበበኞችንና የሕግ መምህራንን ወደ እናንተ እልካለሁ። ከእነርሱ አንዳንዶቹን ትገድላላችሁ፣ ትሰቅሏቸዋላችሁ፤ አንዳንዶቹንም በምኩራቦቻችሁ ትገርፋላችሁ፣ ከከተማም ወደ ከተማ ታሳድዷቸዋላችሁ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: የተናጋሪውን አጽንዖትና ትኩረት የመሳብ ተግባር በተፈጥሯዊና ክብር ባለው አማርኛ ያስተላልፋል።
- source_word: γραμματεῖς
  choice: የሕግ መምህራን
  rationale: በዚህ አውድ ቃሉ ተራ ጸሐፊዎችን ሳይሆን በቅዱሳት መጻሕፍትና በሕግ የተማሩ አስተማሪዎችን ያመለክታል።
- source_word: μαστιγώσετε
  choice: ትገርፋላችሁ
  rationale: ቃሉ በጅራፍ የሚፈጸም አካላዊ ቅጣትን በግልጽ ያሳያል።
- source_word: συναγωγαῖς
  choice: ምኩራቦቻችሁ
  rationale: የአይሁድን የስብሰባና የአምልኮ ቦታ የሚጠቁመውን የተለመደ መጽሐፍ ቅዱሳዊ ቃል ይጠቀማል።
- source_word: διώξετε
  choice: ታሳድዷቸዋላችሁ
  rationale: ከቦታ ወደ ቦታ የሚቀጥል ጠላትነትና ስደት የሚያመለክተውን ኃይለኛ ስሜት ይጠብቃል።
theological_decisions:
- issue: የላኪው ማንነትና ሥልጣን
  choice: «እኔ ... እልካለሁ» የሚለውን ቀጥተኛ ንግግር ጠብቋል
  alternative: ላኪውን እግዚአብሔር ብሎ በትርጓሜ መተካት
  rationale: ግሪክ ጽሑፉ ἐγὼ ἀποστέλλω በማለት ኢየሱስን በቀጥታ እንደ ላኪ ያቀርባል፤ ትርጉሙ ይህን ክርስቶሎጂያዊ ክብደት ሳያስወግድ ይጠብቃል።
- issue: የሚደርስባቸው ድርጊቶች ክፍፍል
  choice: «አንዳንዶቹን ... አንዳንዶቹንም»
  alternative: እያንዳንዱ የተላከ ሰው ሁሉንም ዓይነት ስቃይ እንደሚቀበል ማቅረብ
  rationale: ἐξ αὐτῶν የሚለው ድግግሞሽ ከተላኩት መካከል ለተለያዩ ሰዎች የሚደርሱ ድርጊቶችን ይከፋፍላል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ይጠቀማል። «እነሆ» መጽሐፍ ቅዱሳዊ ክብርን ሲጠብቅ አሁንም በቀላሉ የሚገባ ነው፤ «የሕግ መምህራን» ደግሞ የγραμματεῖςን ታሪካዊ ሚና ከ«ጸሐፊዎች» ይልቅ ግልጽ ያደርጋል።
