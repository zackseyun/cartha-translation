id: MAT.23.4
reference: Matthew 23:4
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: δεσμεύουσιν ⸀δὲ φορτία ⸀βαρέα καὶ ἐπιτιθέασιν ἐπὶ τοὺς ὤμους τῶν ἀνθρώπων, ⸂αὐτοὶ δὲ τῷ⸃ δακτύλῳ αὐτῶν οὐ θέλουσιν κινῆσαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/004.yaml
  text: They tie up heavy burdens and lay them on the shoulders of men[a], but they themselves are unwilling to move them with their finger.
translation:
  language: am
  text: ከባድ ሸክሞችን አስረው በሰዎች ትከሻ ላይ ይጭናሉ፤ እነርሱ ራሳቸው ግን በጣታቸው እንኳ ሊያንቀሳቅሷቸው አይፈልጉም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεσμεύουσιν
  choice: አስረው
  rationale: ግሱ ሸክምን አንድ ላይ የማሰርን ምስል ይጠብቃል፤ ከሚቀጥለው «ይጭናሉ» ጋርም በተፈጥሯዊ አማርኛ ይያያዛል።
- source_word: φορτία βαρέα
  choice: ከባድ ሸክሞችን
  rationale: የአካላዊ ክብደትን ምስልና የሚያደክም ጫናን በአንድነት ያስተላልፋል።
- source_word: ἐπιτιθέασιν ἐπὶ τοὺς ὤμους
  choice: በሰዎች ትከሻ ላይ ይጭናሉ
  rationale: በትከሻ ላይ ሸክም የመጫንን ተጨባጭ ምስል በግልጽና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: τῶν ἀνθρώπων
  choice: በሰዎች
  rationale: ἄνθρωποι እዚህ ሰዎችን በአጠቃላይ የሚወክል በመሆኑ «ሰዎች» የግሪኩን ወሰን በትክክል ያሳያል።
- source_word: αὐτοὶ δὲ
  choice: እነርሱ ራሳቸው ግን
  rationale: አጽንዖታዊውን ተውላጠ ስምና በሌሎች ላይ በሚጭኑትና ራሳቸው በማይረዱት መካከል ያለውን ንጽጽር ይጠብቃል።
- source_word: τῷ δακτύλῳ αὐτῶν
  choice: በጣታቸው እንኳ
  rationale: ነጠላውን «ጣት» ይጠብቃል፤ «እንኳ» የሚለውም ትንሹን ጥረት እንኳ ለማድረግ አለመፈለጋቸውን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οὐ θέλουσιν κινῆσαι αὐτά
  choice: ሊያንቀሳቅሷቸው አይፈልጉም
  rationale: አለመቻልን ሳይሆን ፈቃደኛ አለመሆንን ያሳያል፤ κινέω ያለውንም «ማንቀሳቀስ» ትርጉም በቀጥታ ይጠብቃል።
theological_decisions:
- issue: ሸክሞቹ ቃል በቃል ወይም ምሳሌያዊ መሆናቸው
  choice: «ከባድ ሸክሞች» የሚለውን ተጨባጭ ምስል ማቆየትና ምን እንደሚወክሉ በትርጉሙ ውስጥ አለመግለጽ
  alternative: ሸክሞቹን በግልጽ «የሕግ ግዴታዎች» ወይም «ሃይማኖታዊ ደንቦች» ብሎ መተርጎም
  rationale: አውዱ ጨቋኝ ግዴታዎችን ቢያመለክትም የግሪኩ ጽሑፍ ሸክሞቹን በተወሰነ ስም አይጠራቸውም፤ ምስሉን ማቆየት ጽሑፉ ያልወሰነውን በትርጉም እንዳንወስን ያደርጋል።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ግልጽና ክቡር ነው። «ትከሻ»፣ «ጣት» እና «ማንቀሳቀስ» የሚሉት ቃላት የግሪኩን ተጨባጭ የአካል ምስል ይጠብቃሉ።
