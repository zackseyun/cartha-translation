  text: And whoever swears by the temple swears by it and by the One dwelling in it[a].
translation:
  language: am
  text: በቤተ መቅደሱ የሚምል ሁሉ፣ በእርሱና በውስጡ በሚኖረው ይምላል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በቤተ መቅደሱ ውስጥ የሚምል ሁሉ፣ በእርሱ ውስጥና በውስጡ በሚኖረው ይምላል»፤ የግሪክኛው ቅድመ አቀማመጥ በቀጥታ «ውስጥ» ማለት ቢሆንም፣ በዚህ የመሐላ አገባብ «በ…» የሚለውን ትርጉም ይይዛል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: የሚምል ሁሉ
  rationale: በግሪክኛው ስም ሆኖ የሚሠራው አንቀጽ ያለው ተሳቢ ማንኛውንም ሰው በአጠቃላይ ያመለክታል፤ «የሚምል ሁሉ» ይህን ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐν τῷ ναῷ
  choice: በቤተ መቅደሱ
  rationale: ἐν በቀጥታ «ውስጥ» ሊል ቢችልም፣ በዚህ የመሐላ አገባብ የሚማሉበትን ነገር ያመለክታል፤ የአማርኛው «በ» ይህን የመሐላ ትርጉም በተፈጥሮ ይገልጣል።
- source_word: ναῷ
  choice: ቤተ መቅደሱ
  rationale: ναός በተለይ የቤተ መቅደሱን ቅዱስ ሕንፃ ወይም መቅደስ ሊያመለክት ይችላል፤ «ቤተ መቅደስ» በዚህ አውድ ግልጽና የተለመደ ነው። የወሰን ቅጥያው በአውዱ የታወቀውን የኢየሩሳሌም ቤተ መቅደስ ያመለክታል።
- source_word: ὀμνύει
  choice: ይምላል
  rationale: የአሁን ጊዜ አመልካች ቅርጹ አጠቃላይ መርሕን ይገልጣል፤ «ይምላል» አጭርና ተፈጥሯዊ ነው።
- source_word: ἐν αὐτῷ
  choice: በእርሱ
  rationale: ተውላጠ ስሙ ወደ ቤተ መቅደሱ ይመለሳል፤ ቅድመ አቀማመጡም እንደ ቀደመው በመሐላ አገባብ «በ» ተብሎ ተተርጉሟል።
- source_word: τῷ κατοικοῦντι αὐτόν
  choice: በውስጡ በሚኖረው
  rationale: የአሁን ጊዜ ተሳቢው ስም ሆኖ የሚሠራ ሲሆን፣ በቤተ መቅደሱ ውስጥ የሚኖረውን ያመለክታል። ትርጉሙ ማንነቱን ከአውዱ እንዲታወቅ በማድረግ በግሪክኛው ያለውን ቀጥተኛ አገላለጽ ይጠብቃል።
- source_word: αὐτόν
  choice: ውስጡ
  rationale: ተውላጠ ስሙ በሰዋስው ወንድ የሆነውን ναός ቢከተልም፣ የሚያመለክተው ቤተ መቅደሱን ነው፤ በአማርኛ «ውስጡ» በግልጽ ያስተላልፈዋል።
theological_decisions:
- issue: በቤተ መቅደሱ ውስጥ የሚኖረው ማንነት
  choice: «በውስጡ በሚኖረው» በአውዱ እግዚአብሔርን ያመለክታል
  alternative: «በውስጡ በሚኖረው እግዚአብሔር» ብሎ ስሙን በግልጽ መጨመር
  rationale: አውዱ የቤተ መቅደሱ ነዋሪ እግዚአብሔር መሆኑን ግልጽ ያደርጋል፤ ሆኖም የግሪክኛው ጽሑፍ ስሙን በቀጥታ ስለማይጠቅስ፣ ትርጉሙም ስሙን ሳይጨምር ግልጽ የሆነውን ማጣቀሻ ጠብቋል።
