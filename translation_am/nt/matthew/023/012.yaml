  rationale: ግሪኩ በሰዋሰው የወንድ ነጠላ ቅርጽ ቢጠቀምም አባባሉ አጠቃላይና ወካይ ነው። የአማርኛው ‘ራሱን … ሁሉ’ የምንጩን ነጠላ ቅርጽና አጠቃላይ ኃይል በአንድነት ይጠብቃል።
