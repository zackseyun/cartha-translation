    issue: The main text has a broken and misleading syntactic sequence in its second half.
    rationale: The phrase እስከገደላችሁት wrongly attaches እስከ (‘until/up to’) to ‘you killed,’ while the repeated ነው and inserted ይኸውም disrupt the source’s single construction.
  - severity: medium
    issue: The explanatory word ይኸውም is not represented in the Greek.
    rationale: It unnecessarily recasts the range as an explanation rather than preserving its direct apposition to ‘all righteous blood.’
  - severity: low
    issue: The footnote language and citation punctuation can be made more idiomatic and consistent.
