- source_word: ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου
  choice: ከጻድቁ አቤል ደም ጀምሮ
  rationale: የግሪኩን የባለቤትነት ግንኙነትና ለአቤል የተሰጠውን ‘ጻድቅ’ መግለጫ ይጠብቃል።
