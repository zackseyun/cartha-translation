- source_word: πᾶν αἷμα δίκαιον
  choice: የጻድቃን ደም ሁሉ
  rationale: δίκαιον ደሙን በዘይቤ የሚገልጽ ሲሆን ትርጉሙ የጻድቃን ሰዎች ደም ነው፤ ይህ ቅርጽ በአማርኛ ግልጽና ተፈጥሯዊ ነው።
