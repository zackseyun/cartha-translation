base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/035.yaml
  text: so that upon you may come all the righteous blood being poured out on the earth[a], from the blood of righteous Abel to the blood of Zechariah son of Berechiah[b], whom you murdered between the sanctuary and the altar.
translation:
  language: am
  text: በምድር ላይ የፈሰሰው የጻድቃን ደም ሁሉ፣ ከጻድቁ አቤል ደም ጀምሮ እስከ በራክዩ ልጅ ዘካርያስ ደም ድረስ፣ እርሱንም በመቅደሱና በመሠዊያው መካከል ገደላችሁት፣ በእናንተ ላይ እንዲመጣ።[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በአገሩ ላይ።” የግሪኩ ቃል “ምድር” ወይም “አገር” ማለት ሊሆን ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “የበራክዩ ልጅ ዘካርያስ” ማን እንደሆነ አከራካሪ ነው። አንዳንዶች ይህንን ከነቢዩ ዘካርያስ ጋር ያያይዙታል፤ ሌሎች ደግሞ ከዮዳሄ ልጅ ዘካርያስ (2 ዜና 24፥20–22) ጋር ያያይዙታል። ትርጉሙ የግሪኩን ጽሑፍ እንደተጻፈ ይከተላል።
    reason: alternative_reading
