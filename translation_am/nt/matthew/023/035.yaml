- source_word: μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου
  choice: በመቅደሱና በመሠዊያው መካከል
  rationale: ναός መላውን የቤተ መቅደስ ግቢ ሳይሆን በተለይ መቅደሱን ያመለክታል፤ θυσιαστήριον ደግሞ ‘መሠዊያ’ ነው።
