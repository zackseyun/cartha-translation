  rationale: ‘ቤት’ ሕንፃውን ብቻ ሳይሆን ንብረትንና መተዳደሪያንም ሊወክል የሚችለውን የግሪኩን ሰፊ አገላለጽ ይጠብቃል።
- source_word: προφάσει
