  rationale: ቃሉ በቀጥታ ‘ትበላላችሁ’ ቢልም፣ እዚህ የመበለቶችን ንብረትና ኑሮ ያለርኅራኄ መመዝበርን በዘይቤ ያመለክታል፤ ‘ትበዘብዛላችሁ’ ይህን ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
