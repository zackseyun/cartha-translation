- source_word: περισσότερον κρίμα
  choice: የባሰ ፍርድ
  rationale: ‘ይበልጥ የሆነ ፍርድ’ የሚለውን ሐሳብ በተፈጥሯዊ አማርኛ ይገልጻል፤ κρίμα ፍርድን ወይም የቅጣት ውሳኔን ሊያመለክት የሚችለውን ስፋትም ይጠብቃል።
