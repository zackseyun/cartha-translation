base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/014.yaml
  text: Woe[a] to you, scribes and Pharisees, hypocrites! For you devour widows' houses, and as a pretext make long prayers; therefore you will receive greater condemnation.
translation:
  language: am
  text: እናንተ ጻፎችና ፈሪሳውያን፣ ግብዞች፣ ወዮላችሁ![a] የመበለቶችን ቤቶች ትበዘብዛላችሁ፤ ሰበብ በማድረግም ረጅም ጸሎት ትጸልያላችሁ። ስለዚህ የባሰ ፍርድ ትቀበላላችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይህ ቁጥር በጥንታዊዎቹ የግሪክ የእጅ ጽሑፎች፣ 4ኛው ክፍለ ዘመን በሆኑት ሲናይቲከስና ቫቲካነስን ጨምሮ፣ እንዲሁም በጥንታዊ የቅብጥ ትርጉሞች ውስጥ የለም። ሆኖም በአብዛኛው የባይዛንታይን የእጅ ጽሑፍ ባህል፣ በቀድሞው ላቲን፣ በቩልጌትና በሱርያክ ትርጉሞች ተጠብቋል። ምናልባት በማርቆስ 12፥40ና በሉቃስ 20፥47 ካሉት ተመሳሳይ ንግግሮች ጋር ለማስማማት በኋለኞች ጸሐፍት የተጨመረ ሊሆን ይችላል። ቁጥሩን የያዙ የእጅ ጽሑፎችም በቁጥር 13 ፊት ወይም ከእሱ በኋላ በማስቀመጣቸው ይለያያሉ።
