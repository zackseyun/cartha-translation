  text: Οὐαὶ ὑμῖν, ὁδηγοὶ τυφλοὶ οἱ λέγοντες· Ὃς ἂν ὀμόσῃ ἐν τῷ ναῷ, οὐδέν ἐστιν, ὃς δ’ ἂν ὀμόσῃ ἐν τῷ χρυσῷ τοῦ ναοῦ ὀφείλει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/016.yaml
  text: Woe to you[a], blind guides, who say, ‘Whoever swears by the temple, it is nothing[b]; but whoever swears by the gold of the temple is bound.’
translation:
  language: am
  text: “ወዮላችሁ፣ ዕውራን መሪዎች፣ ‘በቤተ መቅደሱ የሚምል ማንም ሰው መሐላው ምንም አይደለም[a]፤ በቤተ መቅደሱ ወርቅ የሚምል ግን ግዴታ አለበት’ የምትሉ!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ምንም አይደለም” ማለት እንዲህ ያለው መሐላ አስገዳጅ እንዳልሆነ ይቆጠራል ማለት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: ወዮላችሁ
  rationale: የነቢያትን የፍርድና የወቀሳ አነጋገር በተፈጥሯዊና በተለመደ አማርኛ ያስተላልፋል።
- source_word: ὁδηγοὶ τυφλοὶ
  choice: ዕውር መሪዎች
  rationale: ሌሎችን እየመሩ ራሳቸው ማየት ያልቻሉ ሰዎችን የሚያሳየውን ዘይቤ ይጠብቃል፤ ‘መሪዎች’ በዘመናዊ አማርኛ ከ‘መራዎች’ ወይም ‘አስጎብኚዎች’ ይበልጥ ተፈጥሯዊ ነው።
- source_word: οἱ λέγοντες
  choice: ትላላችሁ
  rationale: የግሪኩን ገላጭ አንቀጽ በቀጥታ የሁለተኛ መደብ ንግግር አቀራረብ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: Ὃς ἂν ὀμόσῃ
  choice: የሚምል ማንም
  rationale: ἄν ከንዑስ አንቀጽ ጋር የሚገልጸውን አጠቃላይና ያልተወሰነ ሁኔታ ያስተላልፋል።
- source_word: ἐν τῷ ναῷ
  choice: በቤተ መቅደሱ
  rationale: ἐν በቃል ደረጃ ‘ውስጥ’ ሊሆን ቢችልም፣ እዚህ በመሐላ ቀመር ውስጥ የሚጠራውን ነገር ያመለክታል፤ የአማርኛው ‘በ... መማል’ ይህን ትርጉም በተፈጥሮ ይሰጣል።
- source_word: οὐδέν ἐστιν
  choice: ምንም አይደለም
  rationale: የግሪኩን አጭርና የተዘለለ አነጋገር ይጠብቃል፤ በዐውዱ መሐላው አስገዳጅ እንዳልሆነ መቆጠሩን ያመለክታል።
- source_word: χρυσῷ τοῦ ναοῦ
  choice: በቤተ መቅደሱ ወርቅ
  rationale: በቤተ መቅደሱና በውስጡ ባለው ወርቅ መካከል ያለውን ንጽጽር በግልጽና ተፈጥሯዊ አማርኛ ያቆያል።
- source_word: ὀφείλει
  choice: ግዴታ አለበት
  rationale: ‘ዕዳ አለበት/ግዴታ አለበት’ የሚለውን መሠረታዊ ትርጉም ይይዛል፤ የግሪኩ ያልጠቀሰውን ‘በመሐላው’ የሚል ሙሉ ማብራሪያ ወደ ዋናው ጽሑፍ አያስገባም።
theological_decisions:
- issue: የመሐላው አስገዳጅነትን በተዘለለ አነጋገር መግለጽ
  choice: የመጀመሪያውን አንቀጽ ‘ምንም አይደለም’፣ ሁለተኛውን ‘ግዴታ አለበት’ ብሎ መተርጎም
  alternative: ‘አያስገድድም ... በመሐላው ይገደዳል’ ብሎ ሙሉ ትርጉሙን በግልጽ መዘርጋት
  rationale: ጽሑፉ በመሐላዎች አስገዳጅነት ላይ የተፈጠረን ስልታዊ ልዩነት ይወቅሳል። የተመረጠው አቀራረብ ዐውዱን ግልጽ ሲያደርግ የግሪኩን አጭርነትና የተዘለለ አነጋገር ይጠብቃል።
- issue: ἐν τῷ ναῷ በመሐላ ቀመር ያለው ትርጉም
  choice: ‘በቤተ መቅደሱ የሚምል’
  alternative: ‘በቤተ መቅደሱ ውስጥ የሚምል’
  rationale: ዐውዱ የመሐላውን ቦታ ሳይሆን በመሐላው የሚጠራውን ነገር ይናገራል። ‘በ... መማል’ ይህን የመሐላ ቀመር በአማርኛ በትክክል ይገልጻል።
