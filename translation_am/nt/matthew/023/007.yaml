  to: በገበያ ስፍራዎችም ሰላምታዎችንና በሰዎች ‘ረቢ’ ተብለው መጠራትን ይወዳሉ።
  rationale: The revision preserves the Greek plural “greetings,” avoids adding “receiving,” and retains the verse’s dependence on the preceding context through the explicitly supplied “ይወዳሉ.” No footnote is required because the title is transparently transliterated and no textual ambiguity is introduced.
