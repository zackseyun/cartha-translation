id: MAT.23.7
reference: Matthew 23:7
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ τοὺς ἀσπασμοὺς ἐν ταῖς ἀγοραῖς καὶ καλεῖσθαι ὑπὸ τῶν ἀνθρώπων· ⸀Ῥαββί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/007.yaml
  text: and greetings in the marketplaces, and to be called by men, ‘Rabbi.’
translation:
  language: am
  text: በገበያ ስፍራዎችም ሰላምታዎችንና በሰዎች ‘ረቢ’ ተብለው መጠራትን ይወዳሉ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπασμούς
  choice: ሰላምታ መቀበልን
  rationale: ቃሉ ሰላምታዎችን ወይም የክብር ሰላምታዎችን ያመለክታል፤ ከቀዳሚው ዐውደ ንባብ ጋር ተያይዞ እነርሱ የሚመኙትን ተቀባይነት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἀγοραῖς
  choice: በገበያ ስፍራዎች
  rationale: የሕዝብ መሰብሰቢያና የንግድ ስፍራዎችን የሚያመለክተውን ብዙ ቁጥር ይጠብቃል።
- source_word: ὑπὸ τῶν ἀνθρώπων
  choice: በሰዎች
  rationale: ἄνθρωποι በዚህ አገባብ ሰዎችን በአጠቃላይ ያመለክታል፤ ጾታዊ ገደብ ሳይጨምር ትክክለኛውን ስፋት ይጠብቃል።
- source_word: Ῥαββί
  choice: ረቢ
  rationale: የሴማዊውን የክብርና የመምህርነት ማዕረግ በተለመደው የአማርኛ ፊደል ያስተላልፋል።
theological_decisions:
- issue: ቁጥሩ ከቀዳሚው ዓረፍተ ነገር ጋር ያለው ሰዋሰዋዊ ትስስር
  choice: ‘ይወዳሉ’ን በአማርኛው ጨምሮ ሐሳቡን ሙሉ ዓረፍተ ነገር ማድረግ
  alternative: ግሪክኛውን እንደ ቀጥተኛ የዝርዝር ቅጥያ ብቻ መተው
  rationale: ግሪክኛው ከቁጥር 6 ያለውን φιλοῦσιν (‘ይወዳሉ’) ይቀጥላል፤ በአማርኛ ብቻውን ሲነበብ ግልጽ እንዲሆን ግሱን መድገም የምንጩን ሐሳብ ያስጠብቃል።
- issue: Ῥαββί የሚለውን ማዕረግ መተርጎም ወይም በድምፅ ማስተላለፍ
  choice: ‘ረቢ’ ብሎ በድምፅ ማስተላለፍ
  alternative: ‘መምህር’ ብሎ መተርጎም
  rationale: የመጀመሪያውን ባህላዊ ማዕረግና በቀጣዮቹ ቁጥሮች ያለውን የቃል ድግግሞሽ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የግሪክኛው ቁጥር ከቀዳሚው ቁጥር የሚቀጥል ቢሆንም፣ ለገለልተኛ የቁጥር ንባብ ‘ይወዳሉ’ ተደግሟል።
