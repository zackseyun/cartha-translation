  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὥστε μαρτυρεῖτε ἑαυτοῖς ὅτι υἱοί ἐστε τῶν φονευσάντων τοὺς προφήτας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/031.yaml
  text: So you testify against yourselves that you are sons of those who murdered the prophets[a].
translation:
  language: am
  text: ስለዚህ እናንተ ነቢያትን የገደሉ ሰዎች ልጆች እንደሆናችሁ በራሳችሁ ላይ ትመሰክራላችሁ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለራሳችሁ ትመሰክራላችሁ።” የግሪኩ አገላለጽ ቃል በቃል እንዲህ ሊተረጎም ይችላል፤ በዐውዱ ግን ምስክርነታችሁ ራሳችሁን የሚወነጅል ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: ስለዚህ
  rationale: ከቀደመው ንግግር የሚወጣውን ድምዳሜ በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: μαρτυρεῖτε ἑαυτοῖς
  choice: በራሳችሁ ላይ ትመሰክራላችሁ
  rationale: ἑαυτοῖς ቃል በቃል ‘ለራሳችሁ’ ሊባል ቢችልም፣ በዚህ ዐውደ ንባብ ምስክርነታቸው ራሳቸውን የሚወነጅል መሆኑን ‘በራሳችሁ ላይ’ በግልጽ ያሳያል።
- source_word: ὅτι
  choice: እንደሆናችሁ
  rationale: የምስክርነቱን ይዘት የሚያስገባ ሲሆን በአማርኛ ተዘዋዋሪ ንግግር ተፈጥሯዊ ነው።
- source_word: υἱοί
  choice: ልጆች
  rationale: በአማርኛ ‘ወንዶች ልጆች’ የሚለው በዚህ ዐውድ ከባድና አላስፈላጊ ስለሚሆን፣ ‘ልጆች’ የዘር ግንኙነቱንና የሥነ ምግባር ተባባሪነቱን በተፈጥሯዊ ሁኔታ ይጠብቃል።
- source_word: τῶν φονευσάντων
  choice: የገደሉት ሰዎች
  rationale: ፈጽመው የፈጸሙትን ያለፈ ድርጊት ያመለክታል፤ ዐውዱም ያለ ኃጢአት መግደልን ያሳያል።
- source_word: τοὺς προφήτας
  choice: ነቢያትን
  rationale: በእስራኤል ታሪክ የእግዚአብሔር መልእክተኞች የሆኑትን የታወቀ ወገን በቀጥታ ይገልጣል።
theological_decisions:
- issue: υἱοί የዘር ልጅነትን ብቻ ወይስ ከአባቶቻቸው ክፉ ተግባር ጋር ያለ ሥነ ምግባራዊ አንድነትንም ያመለክታል?
  choice: ልጆች
  alternative: ዘሮች፤ ወንዶች ልጆች
  rationale: የግሪኩ ቃል ቤተሰባዊ ምስሉን ይይዛል፤ በዐውዱ የዘር ቀጣይነትንና በተመሳሳይ ጠላትነት መተባበርን አንድ ላይ ያስተጋባል። ‘ልጆች’ በአማርኛ ይህን ድርብ ኃይል በተፈጥሯዊ ቋንቋ ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። የክስ ዐውዱን ‘በራሳችሁ ላይ’ በማለት ያሳያል፤ የግሪኩን ቃል በቃል አማራጭ በማስታወሻ ይጠብቃል።
