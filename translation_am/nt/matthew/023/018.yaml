base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/018.yaml
  text: And[a], ‘Whoever swears by the altar, it is nothing[b]; but whoever swears by the gift on top of it is obligated.’
translation:
  language: am
  text: ደግሞ፣ “በመሠዊያው የሚምል ሁሉ፣ ምንም አይደለም[b]፤ ነገር ግን በላዩ ባለው ስጦታ[a] የሚምል ሁሉ ግዴታ አለበት።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “መባ።” የግሪኩ ቃል በቤተ መቅደስ ለእግዚአብሔር የሚቀርብን ስጦታ ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ይህም፣ ኢየሱስ በሚያወግዘው ትምህርት መሠረት፣ በመሠዊያው መማል “ምንም አይቆጠርም፣” ነገር ግን በላዩ ባለው ስጦታ መማል አስገዳጅ ነው ተብሎ ይታሰብ ነበር ማለት ነው።
    reason: cultural_note
lexical_decisions:
- source_word: καί
  choice: ደግሞ
  rationale: ከቀደሙት የተወገዙ አስተምህሮዎች ጋር ያለውን ተከታታይነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Ὃς ἂν ... ὀμόσῃ / ὃς δ’ ἂν ... ὀμόσῃ
  choice: የሚምል ሁሉ ... የሚምል ሁሉ
  rationale: የግሪኩን አጠቃላይና ያልተወሰነ ሁኔታ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἐν τῷ θυσιαστηρίῳ
  choice: በመሠዊያው
  rationale: በመሐላ አገባብ ἐν የመሐላውን መመስከሪያ ወይም መደገፊያ ይጠቁማል፤ የአማርኛው “በ” ይህን በትክክል ያስተላልፋል።
- source_word: θυσιαστήριον
  choice: መሠዊያ
  rationale: በቤተ መቅደሱ የመሥዋዕት አውድ የተለመደና ትክክለኛ ቃል ነው።
- source_word: οὐδέν ἐστιν
  choice: ምንም አይደለም
  rationale: የግሪኩን አጭር አገላለጽ ይጠብቃል፤ እዚህ ላይ መሐላው እንደማያስገድድ የሚያስተምረውን አመለካከት ዐውዱ ያብራራል።
- source_word: ἐν τῷ δώρῳ
  choice: በስጦታው
  rationale: δῶρον በቀጥታ “ስጦታ” ማለት ሲሆን፣ በቤተ መቅደስ ዐውድ “መባ” ሊሆን ይችላል፤ ይህ አማራጭ በማስታወሻ ተገልጿል።
- source_word: τῷ ἐπάνω αὐτοῦ
  choice: በላዩ ባለው
  rationale: ስጦታው በመሠዊያው ላይ መሆኑን በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὀφείλει
  choice: ግዴታ አለበት
  rationale: በመሐላ ዐውድ ያለውን ሕጋዊና ሥነ ምግባራዊ ግዴታ ይገልጻል፤ ግሪኩ ያልጠቀሰውን የግዴታ ተሳቢ አይጨምርም።
theological_decisions:
- issue: የግዴታው ያልተገለጸ ተሳቢ
  choice: “ግዴታ አለበት” ብሎ ያለ ተጨማሪ ተሳቢ መተርጎም
  alternative: “መሐላውን ሊፈጽም ይገደዳል” ወይም “በመሐላው የታሰረ ነው”
  rationale: ግሪኩ የግዴታውን ተሳቢ አይገልጽም። ዐውዱ ግዴታው መሐላውን እንደሚመለከት ቢያሳይም፣ ዋናው ጽሑፍ የምንጩን አጭርነትና የተወሰነ ያልሆነ አገላለጽ ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ይጠቀማል። የመሐላው ቀመር ተመሳሳይነት ተጠብቋል፤ የምንጩ አጭር “οὐδέν ἐστιν” እና ተሳቢ የሌለው “ὀφείλει” በዝርዝር ሳይፈቱ ቀርበዋል።
