  rationale: የግሪኩን ተጨባጭ የ‘ደም’ ምስል ይጠብቃል፤ በዐውዱ ግን ደማቸውን በማፍሰስ ያለውን ተሳትፎና የደም ዕዳ ያመለክታል።
- source_word: τῶν προφητῶν
  choice: የነቢያት
  rationale: προφῆται በአማርኛ የተለመደና ትክክለኛ የሆነው ‘ነቢያት’ ተብሎ ተተርጉሟል።
theological_decisions:
- issue: κοινωνοὶ ἐν τῷ αἵματι የሚያመለክተው የተባባሪነት ደረጃ
  choice: በነቢያት ደም ከእነርሱ ጋር ተባባሪዎች
  alternative: ነቢያትን በመግደል ተባባሪዎች / የነቢያትን የደም ዕዳ ተካፋዮች
  rationale: ዋናው ጽሑፍ የግሪኩን የጋራ ተሳትፎ ቃልና የ‘ደም’ ምስል ይጠብቃል። ይህም በነቢያት ግድያ ያለውን የሥነ ምግባር ተባባሪነት ሳይደብቅ፣ ግሪኩን ወደ ግልጽ የትርጓሜ ሐረግ አይለውጠውም።
