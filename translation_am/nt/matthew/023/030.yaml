base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/030.yaml
  text: and you say[a], ‘If we had been living in the days of our fathers[b], we would not have been partners with them in the blood of the prophets.’
translation:
  language: am
  text: እናንተም፣ “እኛ በአባቶቻችን ዘመን በኖርን ኖሮ፣ በነቢያት ደም[b] ከእነርሱ ጋር ተባባሪዎች[a] ባልሆንን ነበር” ትላላችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ተካፋዮች”፤ የግሪኩ ቃል የጋራ ተሳትፎን ወይም በክፉ ድርጊት መተባበርን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ይህም የነቢያትን ደም በማፍሰስ መሳተፍን ማለት ነው፤ ተናጋሪዎቹ የአባቶቻቸውን የደም ዕዳ እንደማይጋሩ ይናገራሉ።
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγετε
  choice: ትላላችሁ
  rationale: የአሁን ጊዜ፣ የሁለተኛ መደብ ብዙ ቁጥር ግስ ስለሆነ ኢየሱስ ለቡድኑ በቀጥታ የሚናገረውን ንግግር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Εἰ ἤμεθα
  choice: ብንኖር ኖሮ
  rationale: ያልተፈጸመ ያለፈ ጊዜ ሁኔታን የሚገልጠውን ተቃራኒ-እውነታዊ መላምት በተፈጥሯዊ የአማርኛ አገላለጽ ያቀርባል።
- source_word: ἐν ταῖς ἡμέραις
  choice: በ…ዘመን
  rationale: ‘በ…ጊዜ’ የሚለውን የጊዜ ፍቺ ግልጽና ተፈጥሯዊ በሆነ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: τῶν πατέρων ἡμῶν
  choice: የአባቶቻችን
  rationale: የግሪኩን ‘አባቶች’ የሚለውን ቅርጽ ጠብቆ በዐውዱ የቀደሙትን አባቶች ያመለክታል።
- source_word: οὐκ ἂν ἤμεθα
  choice: ባልሆንን ነበር
  rationale: ያለፈ ጊዜ ተቃራኒ-እውነታዊ ሁኔታውን ውጤት፣ ‘ባልሆንን ነበር’ በሚለው የአማርኛ አወቃቀር ያሳያል።
- source_word: αὐτῶν κοινωνοὶ
  choice: ከእነርሱ ጋር ተባባሪዎች
  rationale: κοινωνοί የጋራ ተሳትፎን ወይም አብሮ መወገንን ሊያመለክት ስለሚችል፣ ‘ተባባሪዎች’ የኃላፊነት ተካፋይነቱን ያሳያል፤ ነገር ግን ‘ገዳዮች’ ብሎ አያጠናክረውም።
- source_word: ἐν τῷ αἵματι
