- source_word: Φαρισαῖοι
  choice: ፈሪሳውያን
  rationale: የአይሁድን የሃይማኖት ቡድን ስም በተለመደው የአማርኛ አጻጻፍ ያቀርባል።
- source_word: ὑποκριταί
  choice: ግብዞች
  rationale: ሃይማኖታዊና ሥነ ምግባራዊ ማስመሰልን በግልጽ የሚያስተላልፍ ዘመናዊ አማርኛ ነው።
- source_word: περιάγετε τὴν θάλασσαν καὶ τὴν ξηρὰν
  choice: ባሕርንና ምድርን ትዞራላችሁ
  rationale: ሰፊ ርቀት በመጓዝ የሚደረገውን ከፍተኛ ጥረት በተፈጥሯዊ አማርኛ ያሳያል፤ ‘ደረቅ ምድር’ የሚለውን ቃል በቃል አገላለጽ አያስገድድም።
- source_word: ποιῆσαι ἕνα προσήλυτον
  choice: አንድ ሰው ወደ ይሁዲነት እንዲገባ
  rationale: προσήλυτος በዚህ ታሪካዊ አውድ ወደ ይሁዲነት የገባን ሰው ያመለክታል፤ ለተራው አንባቢ ግልጽ የሆነ አገላለጽ በዋናው ጽሑፍ ተመርጦ፣ ፕሮሴሊት የሚለው ቃል በማስታወሻ ተጠብቋል።
- source_word: ὅταν γένηται
  choice: ከገባም በኋላ
  rationale: የቀደመውን ‘ወደ ይሁዲነት መግባት’ በተፈጥሯዊ አማርኛ ይመልሳል።
- source_word: υἱὸν γεέννης
  choice: የገሃነም ልጅ
  rationale: ገሃነም የሚለውን የግሪክ ቃልና ሴማዊውን ‘ልጅ’ ፈሊጥ ሳያዳክም ይጠብቃል።
