source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι περιάγετε τὴν θάλασσαν καὶ τὴν ξηρὰν ποιῆσαι ἕνα προσήλυτον, καὶ ὅταν γένηται ποιεῖτε αὐτὸν υἱὸν γεέννης διπλότερον ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/015.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! Because you travel over sea and land to make one convert, and when he becomes one[b], you make him twice as much a son of Gehenna as yourselves.
translation:
  language: am
  text: ወዮላችሁ፣ ጸሐፍትና ፈሪሳውያን ግብዞች! አንድ ሰው ወደ ይሁዲነት እንዲገባ[a] ባሕርንና ምድርን ትዞራላችሁና፤ ከገባም በኋላ ከእናንተ ሁለት እጥፍ የገሃነም ልጅ[b] ታደርጉታላችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ፕሮሴሊት እንዲሆን»፤ ይህም ወደ ይሁዲነት የገባን ሰው ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «የገሃነም ልጅ»። ግሪክኛው γεέννης (ጌሄና) ይላል።
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐαὶ
  choice: ወዮላችሁ
  rationale: የነቢያዊ ፍርድና የጠንካራ ወቀሳ ኃይልን በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: γραμματεῖς
