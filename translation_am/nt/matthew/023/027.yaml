  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ⸀παρομοιάζετε τάφοις κεκονιαμένοις, οἵτινες ἔξωθεν μὲν φαίνονται ὡραῖοι ἔσωθεν δὲ γέμουσιν ὀστέων νεκρῶν καὶ πάσης ἀκαθαρσίας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/027.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you are like whitewashed tombs, which outwardly appear beautiful[b], but inwardly are full of dead people's bones and every kind of uncleanness.
translation:
  language: am
  text: እናንተ ግብዞች የሆናችሁ የሕግ ጸሐፍትና ፈሪሳውያን፣ ወዮላችሁ! በውጭ ውብ የሚመስሉ፣ በውስጥ ግን በሙታን አጥንትና በማንኛውም ዓይነት ርኩሰት[b] የተሞሉ በኖራ የነጡ መቃብሮችን[a] ትመስላላችሁና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በኖራ የተለበጡ መቃብሮች»።
    reason: lexical_alternative
  - marker: b
    text: “ርኩሰት” በዚህ ዐውድ ሥርዓታዊ እርኩሰትንም ሆነ ሥነ ምግባራዊ ብልሹነትን ሊያካትት ይችላል።
    reason: cultural_note
lexical_decisions:
- source_word: Οὐαὶ
  choice: ወዮላችሁ
  rationale: የፍርድና የወቀሳ ኃይል ያለውን ትንቢታዊ አገላለጽ ይጠብቃል፤ እንደ ቀላል የሐዘን ጩኸት አያለዝበውም።
- source_word: γραμματεῖς
  choice: የሕግ ጸሐፍት
  rationale: በአይሁድ ማኅበረሰብ ሕጉን የሚያጠኑና የሚያስተምሩ የጽሑፍ ባለሙያዎችን ለዘመናዊ አንባቢ ግልጽ አድርጎ ይጠቅሳል።
- source_word: Φαρισαῖοι
  choice: ፈሪሳውያን
  rationale: የቡድኑን ታሪካዊ ስም በተለመደው የአማርኛ አጻጻፍ ያቀርባል።
- source_word: ὑποκριταί
  choice: ግብዞች
  rationale: በዐውዱ ያለውን ሃይማኖታዊና ሥነ ምግባራዊ አስመሳይነት በቀጥታና በተለመደ ቃል ይገልጣል።
- source_word: παρομοιάζετε
  choice: ትመስላላችሁ
  rationale: ንጽጽሩን በተፈጥሯዊ የአማርኛ አገላለጽ ያቀርባል።
- source_word: τάφοις κεκονιαμένοις
  choice: በኖራ የተለበጡ መቃብሮች
  rationale: κεκονιαμένοις በኖራ መለበጥን ያመለክታል፤ ትርጉሙ የመቃብሩን ውጫዊ ነጭነትና ውስጣዊ ርኩሰት የሚያነጻጽረውን ምስል ይጠብቃል።
- source_word: ἔξωθεν μὲν ... ἔσωθεν δὲ
  choice: በውጭ ... በውስጥ ግን
  rationale: ውጫዊ መልክንና ውስጣዊ እውነታን የሚያነጻጽረውን አወቃቀር በግልጽ ሁኔታ ይጠብቃል።
- source_word: φαίνονται ὡραῖοι
  choice: ውብ የሚመስሉ
  rationale: ውበቱ እውነተኛ ሁኔታቸው ሳይሆን ውጫዊ መልክ መሆኑን የግሱን አጽንዖት ጠብቆ ያሳያል።
- source_word: γέμουσιν ὀστέων νεκρῶν
  choice: በሙታን አጥንት ... የተሞሉ
  rationale: የመቃብሮቹን ውስጣዊ ይዘት በተፈጥሯዊና ግልጽ አማርኛ ያስተላልፋል።
- source_word: πάσης ἀκαθαρσίας
  choice: በማንኛውም ዓይነት ርኩሰት
  rationale: πάσης ያለውን ስፋት ያሳያል፤ ርኩሰትም ሥርዓታዊ እርኩሰትንና ሥነ ምግባራዊ ብልሹነትን ሳያጠብ ሁለቱንም ሊያካትት ይችላል።
theological_decisions:
- issue: የἀκαθαρσία ትርጉም ወሰን
  choice: ርኩሰት
  alternative: ሥርዓታዊ እርኩሰት ብቻ፤ ወይም ሥነ ምግባራዊ ብልሹነት ብቻ
  rationale: የመቃብር ምስሉ በአይሁድ ዐውድ ሥርዓታዊ እርኩሰትን ያስታውሳል፤ የኢየሱስ ወቀሳ ደግሞ ውስጣዊ የሥነ ምግባር ብልሹነትን ይመለከታል። ሰፊው ቃል ሁለቱንም እድሎች ሳይዘጋ ይጠብቃል።
