  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የንግግሩ ጠንካራ የወቀሳ ቃናና የውጭ/ውስጥ ንጽጽር ተጠብቋል። የእንግሊዝኛው ማስታወሻ ምልክቶች ከሚያብራሯቸው ቃላት ጋር እንዲጣጣሙ [a] ከመቃብሮች፣ [b] ከርኩሰት ቀጥለው ተቀምጠዋል።
