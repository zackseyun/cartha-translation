review_pass:
  verdict: revise
  source_fidelity: The draft preserves the attention marker, the broad metaphor of “your house,” and the dative force of ὑμῖν. However, “ባዶ ሆኖ” primarily means “empty,” whereas ἔρημος carries the stronger sense of desolate, abandoned, or laid waste. “ይቀራል” also weakens the explicit passive-abandonment sense of ἀφίεται.
  naturalness: The sentence is generally readable, but “ባድማ ሆኖ ተትቷል” is a more idiomatic and solemn modern Amharic rendering for a place abandoned in desolation.
  terminology: “ቤታችሁ” properly retains the Greek’s deliberately broad οἶκος. “ባድማ” better conveys the prophetic judgment register of ἔρημος without adding a specific claim that the building has been destroyed.
  issues:
  - severity: medium
    issue: “ባዶ ሆኖ” understates ἔρημος.
    rationale: “ባዶ” denotes emptiness, but ἔρημος in this judgment announcement signifies desolation/abandonment. “ባድማ” preserves this fuller sense in natural Amharic.
  - severity: low
    issue: “ይቀራል” does not clearly represent the passive force of ἀφίεται.
    rationale: A passive abandonment expression, “ተትቷል,” more clearly communicates that the house has been left behind or abandoned, while leaving the agent unstated.
  revised_text: እነሆ፣[a] ቤታችሁ ለእናንተ ባድማ ሆኖ ተትቷል።
  revised_footnotes:
