lexical_decisions:
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: በዘመናዊ አማርኛም የሚገባ፣ ትኩረትን የሚስብና የታላቅ ፍርድ ማስታወቂያውን ክብደት የሚጠብቅ አገላለጽ ነው።
- source_word: ἀφίεται
  choice: ይቀራል
  rationale: የግሪኩን የአሁን ጊዜ ተደራጊ ቅርጽ በተፈጥሯዊ አማርኛ ይገልጣል፤ የተወውን አድራጊ ሳይገልጽ የመተውን ሐሳብ ይጠብቃል።
- source_word: ὑμῖν
  choice: ለእናንተ
  rationale: የዳቲቭ ቅርጹን በቀጥታ ይጠብቃል፤ ቤቱ ለእነርሱ ተትቶ እንደሚቀር ያሳያል።
- source_word: ὁ οἶκος ὑμῶν
  choice: ቤታችሁ
  rationale: ቃል በቃል ያለውን ሰፊ አገላለጽ ይጠብቃል፤ በዋናው ጽሑፍ ላይ ‘መቅደሳችሁ’ ብሎ በመጥበብ ትርጓሜያዊ ውሳኔ አያስገባም።
- source_word: ἔρημος
  choice: ባዶ ሆኖ
  rationale: መተውንና ሰው አልባ መሆንን በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል፤ ቃሉን አስፋፍቶ ‘ፈርሶ’ የሚል ያልተገለጸ ትርጉም አይጨምርም።
theological_decisions:
- issue: ‘ቤታችሁ’ የሚለው የሚያመለክተው
  choice: በዋናው ጽሑፍ ‘ቤታችሁ’ ተብሎ ሰፊው አገላለጽ ተጠብቋል።
  alternative: ‘መቅደሳችሁ’፣ ‘ኢየሩሳሌም’ ወይም ‘የእስራኤል ቤት’
  rationale: ዐውደ ንባቡ በተለይ መቅደሱንና ኢየሩሳሌምን ሊያመለክት ቢችልም፣ ግሪኩ ‘ቤት’ የሚለውን ሰፊ ቃል ይጠቀማል። ይህን መጠበቅ እውነተኛውን ትርጓሜያዊ ስፋትና የትንቢታዊ ፍርዱን ውጥረት ያቆያል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ የተፈጥሮ ፍሰት ያለውና ክብር የተላበሰ አማርኛን ይጠቀማል። ‘እነሆ’ የማስታወቂያውን ግርማ ሲጠብቅ፣ ‘ባዶ ሆኖ ለእናንተ ይቀራል’ ደግሞ የግሪኩን ተደራጊ አወቃቀርና የፍርድ ድምፀት በሚነበብ አማርኛ ያቀርባል።
