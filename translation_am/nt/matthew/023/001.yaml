  rationale: ሁለቱን ተቀባይ ወገኖች በተፈጥሯዊ የአማርኛ አያያዥ ያገናኛል።
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: ለደቀ መዛሙርቱ
  rationale: μαθηταίን በወንጌላት የተለመደው ቃል ይተረጉማል፤ αὐτοῦ የባለቤትነት ግንኙነትም በ“-ቱ” ቅጥያ በተፈጥሮ ተገልጿል።
