review_pass:
  verdict: revise
  source_fidelity: The draft retains the central metaphor and the contrast marked by δέ. However, its wording for διϋλίζοντες is not idiomatic or grammatically well integrated in modern Amharic; a clear finite rendering is needed to convey filtering a liquid in order to remove the gnat.
  naturalness: «ዓይነ ስውር መሪዎች» is understandable, but «ዕውር መሪዎች» is the more natural concise vocative. «አጥልላችሁ የምታስወግዱ» is awkward. «ከፈሳሽ ውስጥ በማጣራት የምታስወግዱ» is clear modern Amharic and preserves the concrete action.
  terminology: «መሪዎች», «ትንኝ», «ግመል», and «መዋጥ» accurately render the principal terms. The revised wording makes the filtration sense of διϋλίζοντες explicit without interpreting away the hyperbole or ritual-impurity imagery.
  issues:
  - severity: medium
    issue: The phrase «ትንኙን አጥልላችሁ የምታስወግዱ» is awkward and does not naturally express the Greek action of straining liquid to remove the insect.
    rationale: διϋλίζοντες denotes filtering/straining, with the gnat removed from the liquid. A natural Amharic construction should explicitly attach the filtering action to the removal.
  - severity: low
    issue: «ዓይነ ስውር መሪዎች» is less idiomatic than «ዕውር መሪዎች».
    rationale: The shorter adjective is natural in a direct, forceful rebuke and retains the metaphorical force of τυφλοί.
  revised_text: እናንተ ዕውር መሪዎች! ትንኙን ከፈሳሽ ውስጥ በማጣራት የምታስወግዱ፣ ግመሉን ግን የምትውጡ!
