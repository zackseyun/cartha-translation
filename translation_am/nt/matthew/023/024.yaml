revisions:
- from: 'እናንተ ዓይነ ስውር መሪዎች! ትንኙን አጥልላችሁ የምታስወግዱ[a]፣ ግመሉን ግን የምትውጡ!


    [a] የግሪኩ ግስ አንድን ቆሻሻ ለማስወገድ ፈሳሽን በማጣሪያ ማጥለልን ያመለክታል።'
  to: እናንተ ዕውር መሪዎች! ትንኙን ከፈሳሽ ውስጥ በማጣራት የምታስወግዱ፣ ግመሉን ግን የምትውጡ!
  rationale: The revision replaces an awkward filtration phrase with natural modern Amharic that accurately represents straining liquid to remove a gnat. It also uses the more idiomatic vocative «ዕውር መሪዎች». The explicit reference to liquid reflects the lexical sense of διϋλίζω and is supported by the audit-trail footnote; it does not alter the image or add doctrinal interpretation.
