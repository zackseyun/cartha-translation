id: MAT.23.24
reference: Matthew 23:24
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁδηγοὶ τυφλοί, ⸀οἱ διϋλίζοντες τὸν κώνωπα τὴν δὲ κάμηλον καταπίνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/024.yaml
  text: Blind guides[a], straining out the gnat but swallowing the camel!
translation:
  language: am
  text: እናንተ ዕውር መሪዎች! ትንኙን ከፈሳሽ ውስጥ በማጣራት የምታስወግዱ፣ ግመሉን ግን የምትውጡ!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁδηγοὶ
  choice: መሪዎች
  rationale: ሌሎችን የሚመሩ ወይም መንገድ የሚያሳዩ ሰዎችን ያመለክታል፤ «መሪዎች» ዘይቤውን በተፈጥሮ ያስተላልፋል።
- source_word: τυφλοί
  choice: ዓይነ ስውር
  rationale: መንፈሳዊ አለማስተዋልን በዘይቤ የሚገልጠውን ጠንካራ ተግሣጽ ይጠብቃል።
- source_word: διϋλίζοντες
  choice: አጥልላችሁ የምታስወግዱ
  rationale: ቃሉ በፈሳሽ ውስጥ ያለን ነገር በማጥለል ማስወገድን ያመለክታል፤ ይህ አተረጓጎም ድርጊቱንና ውጤቱን ግልጽ ያደርጋል።
- source_word: τὸν κώνωπα
  choice: ትንኙን
  rationale: κώνωψ ትንሽ ትንኝ መሰል ነፍሳትን ያመለክታል፤ «ትንኝ» በአማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: τὴν δὲ κάμηλον
  choice: ግመሉን ግን
  rationale: δέ የሚገልጠውን ንጽጽር «ግን» ያስተላልፋል፤ በትንኙና በግመሉ መካከል ያለውን አስቂኝ ያህል ታላቅ ልዩነት ይጠብቃል።
- source_word: καταπίνοντες
  choice: የምትውጡ
  rationale: ቃሉ መዋጥን ያመለክታል፤ ቀጥተኛውንና የተጋነነውን ምስል ያለ ተጨማሪ ትርጓሜ ይጠብቃል።
theological_decisions:
- issue: የሥርዓታዊ ርኩሰት ምስል ዘይቤያዊ ኃይል
  choice: ትንኙን በጥንቃቄ አጥልሎ የማስወገድንና ግመሉን የመዋጥን ተጨባጭ ምስል ማቆየት
  alternative: ምስሉን ትቶ ትናንሽና ትልልቅ ጥፋቶችን በቀጥታ የሚያነጻጽር ትርጓሜ መስጠት
  rationale: የቁጥሩ ኃይል በትንሽ ርኩሰት ላይ እጅግ በመጠንቀቅ ታላቁን ግን በመቀበል ውስጥ ባለው አስደናቂ አለመመጣጠን ላይ የተመሠረተ ነው። ተጨባጩን ምስል ማቆየት ግሪኩን በታማኝነት ያስተላልፋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው አማርኛ ተጠቅሟል። ቀጥተኛ ንግግሩን ለማጉላት «እናንተ» ተጨምሯል፤ የግሪኩ ተሳቢ አወቃቀር በ«የምታስወግዱ…የምትውጡ» ተጠብቋል።
