id: MAT.23.28
reference: Matthew 23:28
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς ἔξωθεν μὲν φαίνεσθε τοῖς ἀνθρώποις δίκαιοι, ἔσωθεν δέ ⸂ἐστε μεστοὶ⸃ ὑποκρίσεως καὶ ἀνομίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/028.yaml
  text: In the same way[a], you also outwardly appear righteous to people, but inwardly you are full of hypocrisy and lawlessness.
translation:
  language: am
  text: እንዲሁም እናንተ በውጭ ለሰዎች ጻድቃን ትመስላላችሁ፤ በውስጣችሁ ግን በግብዝነትና በሕግ መተላለፍ የተሞላችሁ ናችሁ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: እንዲሁም እናንተ
  rationale: ከቀደመው የኖራ ቀለም የተቀቡ መቃብሮች ንጽጽር ጋር ያለውን ቀጥተኛ ትስስር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἔξωθεν ... ἔσωθεν
  choice: በውጭ ... በውስጣችሁ
  rationale: የውጫዊ መልክና የውስጣዊ ሁኔታ ተቃርኖውን ግልጽና ተፈጥሯዊ በሆነ አገላለጽ ይጠብቃል።
- source_word: φαίνεσθε
  choice: ትመስላላችሁ
  rationale: ቃሉ እውነተኛ ጽድቅን ሳያረጋግጥ በሌሎች ዓይን የሚታየውን መልክ ያመለክታል።
- source_word: τοῖς ἀνθρώποις
  choice: ለሰዎች
  rationale: ἀνθρώποις በዚህ ስፍራ ሁሉንም ሰው በአጠቃላይ የሚያመለክት ሲሆን፣ «ለሰዎች» ይህን በዘመናዊ አማርኛ በትክክል ያስተላልፋል።
- source_word: δίκαιοι
  choice: ጻድቃን
  rationale: በአውዱ ያለውን ሥነ ምግባራዊና ሃይማኖታዊ ትርጉም ይጠብቃል።
- source_word: μεστοὶ ὑποκρίσεως
  choice: በግብዝነት ... የተሞላችሁ
  rationale: μεστοί የሚያሳየውን ሙላትና ὑπόκρισις የሚያሳየውን የውሸት ማንነት በተለመደ መጽሐፍ ቅዱሳዊ አማርኛ ያቀርባል።
- source_word: ἀνομίας
  choice: ሕገ ወጥነት
  rationale: ቃሉን ወደ አጠቃላይ «ክፋት» ሳያለዝበው፣ ሕግን መጣስና አለመታዘዝ የሚለውን ዋና ኃይሉን ይጠብቃል።
theological_decisions:
- issue: δίκαιοι እውነተኛ ጽድቅን ወይስ በሰዎች ፊት የሚታይ ጽድቅን እንደሚያመለክት
  choice: በሰዎች ዘንድ ጻድቃን መስለው መታየታቸው
  alternative: በእርግጥ ጻድቃን መሆናቸው
  rationale: φαίνεσθε እና «በውስጣችሁ ግን» የሚለው ተቃርኖ ኢየሱስ እውነተኛ ጽድቃቸውን ሳይሆን ውጫዊ መልካቸውን እየገለጠ መሆኑን ያሳያሉ።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለው አማርኛ ይጠቀማል። «ጻድቃን» እና «ግብዝነት» የተለመዱ መጽሐፍ ቅዱሳዊ ቃላት ሲሆኑ ለአጠቃላይ አንባቢም ግልጽ ናቸው። በአማርኛ «ሰዎች» ጾታን የማይለይ አጠቃላይ ቃል ስለሆነ ለἀνθρώποις የግርጌ ማስታወሻ አላስፈለገም።
