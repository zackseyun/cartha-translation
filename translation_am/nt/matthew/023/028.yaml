review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the comparative connection (οὕτως καὶ), the outward/inward contrast, apparent righteousness before people, and the predicate that they are full of hypocrisy and ἀνομία. However, «ሕገ ወጥነት» most commonly denotes legal irregularity or illegality in contemporary administrative/civil usage and can narrow or misdirect the broader moral-religious force of ἀνομία.
  naturalness: The sentence is clear, fluent modern standard Amharic, and its balanced contrast is effective. Replacing the final term with «ሕግ መተላለፍ» is more idiomatic in this context and avoids a modern bureaucratic/legal-register association.
  terminology: «ጻድቃን» appropriately renders δίκαιοι, while «ግብዝነት» accurately renders ὑποκρίσεως. «ሕግ መተላለፍ» preserves the law-disregarding sense of ἀνομία without reducing it to generic wickedness or implying merely a technical civil offense.
  issues:
  - severity: medium
    issue: «ሕገ ወጥነት» for ἀνομίας
    rationale: Although literally related to acting contrary to law, this expression ordinarily suggests technical illegality in modern Amharic. «ሕግ መተላለፍ» more naturally communicates the verse’s moral-religious sense of lawlessness.
  revised_text: እንዲሁም እናንተ በውጭ ለሰዎች ጻድቃን ትመስላላችሁ፤ በውስጣችሁ ግን በግብዝነትና በሕግ መተላለፍ የተሞላችሁ ናችሁ።
  revised_footnotes: []
  revision_rationale: 'A single terminology adjustment improves the rendering of ἀνομία while retaining the draft’s syntax, register, and all other source-level distinctions. No footnote is needed: «ሰዎች» naturally includes human beings generally in Amharic, and the comparative force is explicit in «እንዲሁም».'
