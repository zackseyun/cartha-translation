- from: እንዲሁም እናንተ በውጭ ለሰዎች ጻድቃን ትመስላላችሁ፤ በውስጣችሁ ግን በግብዝነትና በሕገ ወጥነት የተሞላችሁ ናችሁ።
  to: እንዲሁም እናንተ በውጭ ለሰዎች ጻድቃን ትመስላላችሁ፤ በውስጣችሁ ግን በግብዝነትና በሕግ መተላለፍ የተሞላችሁ ናችሁ።
