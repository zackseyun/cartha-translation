id: MAT.23.19
reference: Matthew 23:19
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀τυφλοί, τί γὰρ μεῖζον, τὸ δῶρον ἢ τὸ θυσιαστήριον τὸ ἁγιάζον τὸ δῶρον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/019.yaml
  text: Blind men[a], for which is greater[b], the gift or the altar that sanctifies the gift?
translation:
  language: am
  text: እናንተ ዕውሮች! ለመሆኑ፣ የቱ ይበልጣል—መባው ወይስ መባውን የሚቀድሰው መሠዊያ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τυφλοί
  choice: እናንተ ዕውሮች
  rationale: ቅጽሉ በስም ፋንታ የገባ የብዙ ቁጥር ቀጥተኛ ጥሪ ነው። «እናንተ» የተናጋሪውን ቀጥተኛ ተግሣጽ በተፈጥሯዊ አማርኛ ያሳያል፤ «ሞኞች» የሚለውን በቁጥር 17 ያለውን ተጨማሪ ስድብ አያስገባም።
- source_word: τί γὰρ μεῖζον
  choice: ለመሆኑ፣ … የቱ ይበልጣል?
  rationale: «የቱ» የንጽጽር ጥያቄውን፣ «ይበልጣል» ደግሞ μεῖζον የሚያመለክተውን ታላቅነት ይጠብቃሉ። «ለመሆኑ» ጥያቄው ቀዳሚውን ተግሣጽ እንደሚያብራራ በተፈጥሯዊ የአማርኛ ንግግር ያሳያል።
- source_word: τὸ δῶρον
  choice: መባው
  rationale: δῶρον በመሠዊያ አውድ ለእግዚአብሔር የሚቀርብን ስጦታ ያመለክታል። «መባ» ይህን የቤተ መቅደስ አውድ በዘመናዊና ግልጽ አማርኛ ያስተላልፋል።
- source_word: θυσιαστήριον
  choice: መሠዊያ
  rationale: የመሥዋዕትና የቤተ መቅደስ አውድን በትክክል የሚያስተላልፍ የተለመደ አማርኛ ቃል ነው።
- source_word: τὸ ἁγιάζον
  choice: የሚቀድሰው
  rationale: የአሁን ጊዜ አድራጊ አንቀጹ መሠዊያው በመባው ላይ የሚያደርገውን ቀጣይ ተግባር ይገልጣል። «ይቀድሳል» የἁγιάζωን የቅድስና ክብደት ከአምልኮ አውዱ ጋር ይጠብቃል።
theological_decisions:
- issue: መሠዊያው መባውን የሚቀድስ መሆኑ
  choice: መባውን ከሚቀድሰው መሠዊያ
  alternative: መባውን ቅዱስ ከሚያደርገው መሠዊያ
  rationale: ይህ አተረጓጎም መሠዊያው ለመባው ቅድስናን እንደሚያስገኝ በጥቅሱ የተገለጠውን የቤተ መቅደስ አመክንዮ ይጠብቃል፤ ትርጉሙን ወደ ሥርዓታዊ አገላለጽ ብቻ አያቀልለውም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። ቀጥተኛው ተግሣጽ ተጠብቋል፤ ነገር ግን በግሪኩ የሌለ «ሞኞች» የሚለው ቃል አልተጨመረም።
