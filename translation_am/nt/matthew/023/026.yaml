  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Φαρισαῖε τυφλέ, καθάρισον πρῶτον τὸ ἐντὸς τοῦ ποτηρίου ⸂καὶ τῆς παροψίδος⸃, ἵνα γένηται καὶ τὸ ἐκτὸς ⸀αὐτοῦ καθαρόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/026.yaml
  text: Blind Pharisee[a], first clean the inside of the cup and the dish, so that its outside also may become clean.
translation:
  language: am
  text: ዕውር ፈሪሳዊ፣ በመጀመሪያ የጽዋውንና የወጭቱን[a] ውስጠኛ ክፍል አጽዳ፤ ውጫቸውም ንጹሕ እንዲሆን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ወጭት» (παροψίς) የምግብ ማቅረቢያ ዕቃ ሲሆን፣ «ሳህን»፣ «ጎድጓዳ ሳህን» ወይም «ትሪ» ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Φαρισαῖε τυφλέ
  choice: ዕውር ፈሪሳዊ
  rationale: ሁለቱንም የተናጋሪ ቀጥተኛ ጥሪዎች በአጭርና በጠንካራ አማርኛ ያቀርባል፤ «ዕውር» መንፈሳዊ ዕውርነትን በምሳሌ ያመለክታል።
- source_word: καθάρισον πρῶτον
  choice: አስቀድመህ አጽዳ
  rationale: የትእዛዙን ወሳኝነትና የπρῶτονን ቅድሚያ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: τὸ ἐντὸς τοῦ ποτηρίου καὶ τῆς παροψίδος
  choice: የጽዋውንና የወጭቱን ውስጥ
  rationale: የዕቃዎቹን ተጨባጭ ምስል ይጠብቃል። «ጽዋ» ለποτήριον የተለመደና ክቡር አቻ ሲሆን፣ «ወጭት» የπαροψίςን ሰፊ የምግብ ማቅረቢያ ዕቃ ትርጉም ያስተላልፋል።
- source_word: ἵνα γένηται καὶ τὸ ἐκτὸς αὐτοῦ καθαρόν
  choice: ያን ጊዜ ውጭውም ንጹሕ ይሆናል
  rationale: የውስጡን ማጽዳት ተከትሎ የውጭው ንጹሕ መሆንን የሚያመለክተውን ውጤታዊ ግንኙነት በተፈጥሯዊ አማርኛ ይገልጣል፤ καίም በ«ም» ተጠብቋል።
theological_decisions:
- issue: ተጨባጭ የዕቃ ምስል ወይስ ግልጽ ሥነ ምግባራዊ ትርጓሜ
  choice: የጽዋና የወጭት ውስጥና ውጭ የማጽዳትን ተጨባጭ ምስል በዋናው ጽሑፍ መጠበቅ
  alternative: «መጀመሪያ ውስጣዊ ሕይወትህን አንጻ» የሚል ገላጭ ትርጓሜ
  rationale: ግሪኩ ሥነ ምግባራዊውን ፍቺ በዕቃዎች ምሳሌ እንዲሠራ ይተወዋል፤ ፍቺውን በቀጥታ ማስገባት የኢየሱስን የንግግር ኃይል ያዳክማል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ዕውር ፈሪሳዊ» የዋናውን ጽሑፍ ቀጥተኛና ተግሣጻዊ ቃና ይጠብቃል።
