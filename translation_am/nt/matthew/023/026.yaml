review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the direct vocative rebuke, the imperative priority, and the concrete cup-and-dish imagery. However, «የጽዋውንና የወጭቱን ውስጥ» is grammatically incomplete/unnatural as the imperative's object, and «ያን ጊዜ ... ይሆናል» shifts the Greek purpose/result clause (ἵνα γένηται) toward a temporal prediction. The revision renders the interior idiomatically and preserves the purpose-result relation.
  naturalness: «የጽዋውንና የወጭቱን ውስጠኛ ክፍል» is clear, grammatical modern standard Amharic. «... እንዲሆን» naturally expresses the intended result of the imperative. The plural possessive in «ውጫቸውም» is natural because two vessels are named, while retaining the Greek's collective conceptual reference.
  terminology: «ፈሪሳዊ», «ጽዋ», and «ወጭት» are suitable and appropriately register-matched. «ወጭት» remains a defensible broad rendering of παροψίς; the footnote supplies relevant alternatives without over-specifying the vessel. «ንጹሕ» appropriately maintains both the physical image and its implicit moral force.
  issues:
  - severity: medium
    issue: The phrase «የጽዋውንና የወጭቱን ውስጥ» is not a well-formed object phrase in this context.
    rationale: The substantivized Greek τὸ ἐντός requires an idiomatic nominal expression in Amharic. Adding «ውስጠኛ ክፍል» makes the object grammatical while preserving the vessel image.
  - severity: medium
    issue: «ያን ጊዜ ... ይሆናል» renders the ἵνα clause as a temporal future statement.
    rationale: ἵνα γένηται expresses intended/resultant outcome. «... እንዲሆን» better preserves this relation and avoids introducing the temporal phrase «ያን ጊዜ».
  revised_text: ዕውር ፈሪሳዊ፣ በመጀመሪያ የጽዋውንና የወጭቱን[a] ውስጠኛ ክፍል አጽዳ፤ ውጫቸውም ንጹሕ እንዲሆን።
