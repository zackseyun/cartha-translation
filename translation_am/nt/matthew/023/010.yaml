- source_word: καθηγηταί / καθηγητὴς
  choice: መሪዎች / መሪ
  rationale: ቃሉ መንገድ የሚመራንና የሚያስተምርን ሰው ሊያመለክት ይችላል፤ «መሪ» በአውዱ ያለውን የመምራት ሐሳብ ይጠብቃል፣ ከቅርብ አውድ ካለው «መምህር» ደግሞ አያደባልቀውም።
- source_word: ὅτι
  choice: -ና
  rationale: ክልከላውን የሚደግፈውን ምክንያት በተፈጥሯዊና ክቡር የአማርኛ አገባብ ያቀርባል።
- source_word: ὑμῶν ἐστιν εἷς
  choice: አንድ መሪ አላችሁ
