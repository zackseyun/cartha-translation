- source_word: ὁ χριστός
  choice: መሲሑ
  rationale: ከመጠሪያ ስም ይልቅ ማዕረግ ሆኖ ስለቀረበ፣ የቃሉን አይሁዳዊ መሲሐዊ ይዘት የሚጠብቀው «መሲሑ» ተመርጧል።
theological_decisions:
- issue: የὁ χριστός አተረጓጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: በዚህ ስፍራ አንቀጹ ቃሉን እንደ ማዕረግ ያቀርበዋል፤ «መሲሑ» የ«ተቀባው»ን መሲሐዊ ሐሳብ በግልጽ ይጠብቃል፣ «ክርስቶስ» ደግሞ የተለመደ ትርጉም አማራጭ ነው።
