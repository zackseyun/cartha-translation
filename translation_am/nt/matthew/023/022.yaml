base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/022.yaml
  text: And whoever swears by heaven swears by the throne of God and by the one seated upon it[a].
translation:
  language: am
  text: በሰማይም የሚምል ሁሉ በእግዚአብሔር ዙፋንና በዙፋኑ ላይ በተቀመጠው[a] ይምላል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በዙፋኑ ላይ በሚቀመጠው።»
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: የሚምል ሁሉ
  rationale: የተወሰነው የአኦሪስት ተሳቢ አጠቃላይ ሰውን ያመለክታል፤ በአማርኛም አጠቃላይ መርሕን በተፈጥሮ ያስተላልፋል።
- source_word: ἐν
  choice: በ
  rationale: በመሐላ አገላለጽ ውስጥ ἐν መሐላው የሚደረግበትን ነገር ያመለክታል፤ የአማርኛው «በ» ይህን ፍቺ በተፈጥሮ ይገልጣል።
- source_word: οὐρανῷ
  choice: ሰማይ
  rationale: ከእግዚአብሔር ዙፋን ጋር በቀጥታ በመያያዙ እዚህ የሚያመለክተው ሃይማኖታዊውን የሰማይ መኖሪያ እንጂ የሚታየውን ሰማይ ብቻ አይደለም።
- source_word: ὀμνύει
  choice: ይምላል
  rationale: የአሁን ጊዜ አመልካች ግስ አጠቃላይ እውነትን ይገልጣል፤ «ይምላል» ይህን በተፈጥሮ ያስተላልፋል።
- source_word: θρόνῳ τοῦ θεοῦ
  choice: በእግዚአብሔር ዙፋን
  rationale: የግሪኩን የባለቤትነት ግንኙነት ግልጽና ክብር ባለው አማርኛ ያቀርባል።
- source_word: τῷ καθημένῳ
  choice: በተቀመጠው
  rationale: ተሳቢው በዙፋኑ ላይ ያለውን አካል ያመለክታል፤ ይህ ምርጫ የግሪኩን ዙፋን ላይ የመቀመጥ ምስል ሳይተካ ይጠብቃል።
- source_word: ἐπάνω αὐτοῦ
  choice: በዙፋኑ ላይ
  rationale: ተውላጠ ስሙ ወደ ዙፋኑ መመለሱን በአማርኛ ግልጽ ያደርጋል፤ «ላይ»ም በዙፋን ላይ መቀመጥን እንጂ ከዙፋኑ በላይ ተለይቶ መኖርን አያመለክትም።
theological_decisions:
- issue: «በዙፋኑ ላይ በተቀመጠው» የሚለው የሚያመለክተው
  choice: በሰማይ ዙፋኑ ላይ ለተቀመጠው እግዚአብሔር የክብር አጠራር
  alternative: ማንነቱን በቀጥታ ሳይለይ «በዚያ በተቀመጠው» ማለት
  rationale: «የእግዚአብሔር ዙፋን» የሚለው ቅርብ አገባብ ማንን እንደሚያመለክት ግልጽ ያደርጋል። ሆኖም ግሪኩ ስሙን በቀጥታ ስለማይደግም፣ ትርጉሙም የክብር አጠራሩን ጠብቋል።
