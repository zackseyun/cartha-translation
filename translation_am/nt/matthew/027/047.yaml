  source_fidelity: 'The translation faithfully represents the Greek: an unspecified subset of those present, their prior hearing of the cry, the imperfect reporting verb, and their direct statement concerning Elijah. «ኤልያስን እየጠራ ነው» appropriately retains the source expression’s noncommittal sense without adding that Jesus was appealing to Elijah.'
