id: MAT.27.47
reference: Matthew 27:47
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τινὲς δὲ τῶν ἐκεῖ ⸀ἑστηκότων ἀκούσαντες ἔλεγον ὅτι Ἠλίαν φωνεῖ οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/047.yaml
  text: But some of those standing there[a], when they heard it, were saying[b], “This man is calling Elijah.”
translation:
  language: am
  text: በዚያም ቆመው ከነበሩት አንዳንዶቹ ይህን ሰምተው፣ “ይህ ሰው ኤልያስን እየጠራ ነው” ይሉ ነበር።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በአውዱ መሠረት እነዚህ ሰዎች በቀደመው ቁጥር ኢየሱስ ያሰማውን ጩኸት ኤልያስን እንደጠራ ተረድተውት ይሆናል።
    reason: cross_reference
lexical_decisions:
- source_word: τινὲς δὲ τῶν ἐκεῖ ἑστηκότων
  choice: በዚያም ቆመው ከነበሩት አንዳንዶቹ
  rationale: ያልተወሰነውን ከፊል ቡድንና በቦታው ቆመው መኖራቸውን በተፈጥሯዊ አማርኛ ያሳያል፤ δὲ የትረካ ሽግግር በ«ም» ተገልጧል።
- source_word: ἀκούσαντες
  choice: ይህን ሰምተው
  rationale: ከዋናው ግስ በፊት የተፈጸመውን ተግባር ያሳያል፤ «ይህን» የሚያመለክተው በቀደመው ቁጥር የተሰማውን ጩኸት ነው።
- source_word: ἔλεγον
  choice: ይሉ ነበር
  rationale: የግሪኩን ያልተጠናቀቀ ወይም ቀጣይ የንግግር ገጽታ ከቀላል «አሉ» ይልቅ በግልጽ ያስተላልፋል።
- source_word: Ἠλίαν φωνεῖ οὗτος
  choice: ይህ ሰው ኤልያስን እየጠራ ነው
  rationale: οὗτος ያለውን ጠቋሚ ኃይል «ይህ ሰው» ይጠብቃል፤ φωνεῖ ከቀጥተኛ የሰው ተሳቢ ጋር ያለውን አሻሚነት «እየጠራ» ሳይጨምር ወይም ሳይፈታ ያቆያል።
theological_decisions:
- issue: የቆሙት ሰዎች ንግግር ኢየሱስ በእውነት ኤልያስን እንደጠራ ወይስ እነርሱ እንዲህ እንደተረዱ ማቅረብ
  choice: ንግግሩን እንደ ተናጋሪዎቹ ግንዛቤ ብቻ በቀጥታ ጥቅስ ማቅረብ።
  alternative: «ኤልያስን እየተማጸነ ነው» ብሎ ትርጉማቸውን በዋናው ጽሑፍ መፍታት።
  rationale: ግሪኩ የሚዘግበው ሰዎቹ የተናገሩትን ነው፤ ትርጉሙ ከዚህ በላይ ስለ ኢየሱስ ዓላማ የሥነ መለኮት ፍርድ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና በቀላሉ የሚገባ መደበኛ አማርኛ ተጠቅሟል። «ኤልያስ» በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደው የስሙ ቅርጽ ነው።
