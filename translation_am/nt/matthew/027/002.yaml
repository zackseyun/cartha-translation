  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ δήσαντες αὐτὸν ἀπήγαγον καὶ ⸀παρέδωκαν Πιλάτῳ τῷ ἡγεμόνι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/002.yaml
  text: And after binding him[b][a], they led him away and handed him over to Pilate the governor.
translation:
  language: am
  text: እርሱን ካሰሩት በኋላ፣ ወሰዱትና ለገዢው ለጲላጦስ አሳልፈው ሰጡት።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δήσαντες
  choice: ካሰሩት በኋላ
  rationale: የግሪኩ የአኦሪስት ተሳቢ ግስ ከዋናዎቹ ድርጊቶች በፊት የተፈጸመን ድርጊት ያመለክታል፤ ይህ አተረጓጎም የማሰርን ቀጥተኛ ትርጉምና የድርጊቶቹን ቅደም ተከተል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἀπήγαγον
  choice: ወስደው
  rationale: በጥበቃ ሥር ያለን ሰው ከአንድ ቦታ ወደ ሌላ መውሰድን በተፈጥሯዊ አማርኛ ይገልጣል፤ በዚህ አውድ ‘መርተው ወሰዱት’ የሚለውንም ሐሳብ ይይዛል።
- source_word: παρέδωκαν
  choice: አሳልፈው ሰጡት
  rationale: ወደ ሌላ ባለሥልጣን ጥበቃና ሥልጣን ማስተላለፍን በግልጽ ዘመናዊ አማርኛ ያሳያል፤ በሕማማት ትረካው ያለውን ሕጋዊና ሥነ መለኮታዊ ድምፀት ሳይገድብ ይጠብቃል።
- source_word: Πιλάτῳ
  choice: ለጲላጦስ
  rationale: የግል ስሙ በተለመደው የአማርኛ መጽሐፍ ቅዱሳዊ አጻጻፍ ተጽፏል፤ የግሪኩ የተቀባይ ቅርጽ በ‘ለ-’ ተገልጧል።
- source_word: ἡγεμόνι
  choice: ለገዢው
  rationale: ἡγεμών በአጠቃላይ የአስተዳደር ባለሥልጣንን ያመለክታል፤ ‘ገዢ’ ለተራው አንባቢ ግልጽ ሲሆን ‘ፕሪፌክት’ በማለት ምንጩ ከሚገልጠው በላይ ታሪካዊ ዝርዝር አያክልም።
theological_decisions:
- issue: በሕማማት ትረካው παραδίδωμιን መተርጎም
  choice: አሳልፈው ሰጡት
  alternative: አስረከቡት
  rationale: የተመረጠው አተረጓጎም በቅርብ አውዱ ያለውን የሕግና የሥልጣን ማስተላለፍ ሐሳብ ግልጽ ያደርጋል፤ ከዚህ ግስ ጋር ሊያያዝ የሚችለውን ሰፊ ሥነ መለኮታዊ ድምፀትም አይሽርም። ‘አስረከቡት’ ትክክለኛ አማራጭ ቢሆንም በአንዳንድ አውዶች በፈቃድ እንደተሰጠ ሊያሰማ ይችላል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ ነው። የግሪኩን የድርጊት ቅደም ተከተል በአማርኛ ተሳቢ ግሶች በተፈጥሯዊ ሁኔታ ያቀርባል። በዋናው ጽሑፍ ያልተጠቀሰ የግርጌ ማስታወሻ ስለሌለ ማስታወሻ አልተጨመረም።
