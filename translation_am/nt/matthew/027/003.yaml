base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/003.yaml
  text: Then Judas[a], who had betrayed him, seeing that he had been condemned[b], regretted it and returned the thirty pieces of silver to the chief priests and elders.
translation:
  language: am
  text: በዚያን ጊዜ፣ ኢየሱስን አሳልፎ የሰጠው ይሁዳ ኢየሱስ እንደተፈረደበት ባየ ጊዜ ተጸጽቶ፣ ሠላሳ የብር ቁራጮችን[a] ለሊቃነ ካህናቱና ለሽማግሌዎቹ መለሰላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ሠላሳ የብር ሳንቲሞች»።
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: በዚያን ጊዜ
  rationale: የትረካውን ቀጣይ ክስተት በተፈጥሯዊና ክብር ባለው ዘመናዊ አማርኛ ያስተዋውቃል።
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: ኢየሱስን አሳልፎ የሰጠው
  rationale: የይሁዳን ሚና በአውዱ የሚያመለክተውን ተሳቢ ሐረግ ይጠብቃል፤ ተውላጠ ስሙ በአማርኛ እንዳያሻማ ስሙ በግልጽ ተጠቅሷል።
- source_word: ἰδὼν
  choice: ባየ ጊዜ
  rationale: የግሪኩን ጊዜያዊ ተሳቢ አገናኝ በተፈጥሯዊ የአማርኛ ጊዜ ንዑስ ሐረግ ይገልጣል።
- source_word: ὅτι κατεκρίθη
  choice: ኢየሱስ እንደተፈረደበት
  rationale: የፍርድ ውሳኔ በኢየሱስ ላይ መሰጠቱን ይገልጣል፤ ተውላጠ ስሙ ይሁዳን እንዳያመለክት ስሙ ተደግሟል።
- source_word: μεταμεληθεὶς
  choice: በሠራው ነገር ተጸጸተ
  rationale: ጸጸትንና ቁጭትን ይገልጣል፤ ጽሑፉ ከሚናገረው በላይ ሙሉ መንፈሳዊ ንስሐን አያስገባም።
- source_word: ἔστρεψεν
  choice: መለሰላቸው
  rationale: ገንዘቡን ለቀድሞ ሰጪዎቹ መመለሱን በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τὰ τριάκοντα ἀργύρια
  choice: ሠላሳውን የብር ሳንቲሞች
  rationale: ἀργύρια የብር ገንዘብ ክፍሎችን ያመለክታል፤ ይህ አተረጓጎም ለዘመናዊ አንባቢ ግልጽ ሲሆን የተወሰነ የሳንቲም ዓይነት አይጨምርም።
- source_word: τοῖς ἀρχιερεῦσιν καὶ πρεσβυτέροις
  choice: ለሊቃነ ካህናቱና ለሽማግሌዎቹ
  rationale: በማቴዎስ አውድ ያሉትን ሁለት የአይሁድ መሪዎች ቡድኖች በተለመደ አማርኛ ይገልጣል።
theological_decisions:
- issue: የμεταμεληθεὶς ትርጉምና የይሁዳ ምላሽ
  choice: በሠራው ነገር ተጸጸተ
  alternative: ንስሐ ገባ፤ ሐሳቡን ለወጠ
  rationale: μεταμέλομαι በዚህ አውድ ጸጸትን ወይም ቁጭትን ያመለክታል። «ንስሐ ገባ» ማለት ጽሑፉ በግልጽ ያልወሰነውን ሙሉ መንፈሳዊ ንስሐ ሊያስገባ ይችላል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የአረፍተ ነገሩ አወቃቀር የግሪኩን የክስተት ቅደም ተከተል ሲጠብቅ በአማርኛ ተፈጥሯዊ እንዲሆን ተስተካክሏል።
