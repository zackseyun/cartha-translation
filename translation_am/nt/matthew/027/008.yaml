  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὸ
  choice: ስለዚህ
  rationale: ከቀደመው የመሬቱ ግዢና ስያሜ ማብራሪያ ጋር ያለውን የምክንያትና የውጤት ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐκλήθη
  choice: ተብሎ ይጠራል
  rationale: የግሪኩ ግስ ያለፈ ጊዜ ተገብሮ ቢሆንም፣ ‘እስከ ዛሬ ድረስ’ ከሚለው ጋር በአማርኛ የተጀመረው ስያሜ አሁንም በጥቅም ላይ መሆኑን በተፈጥሮ ይገልጣል።
- source_word: ὁ ἀγρὸς ἐκεῖνος
  choice: ያ መሬት
  rationale: ἀγρός በዚህ አውድ የተገዛ መሬትን ያመለክታል፤ ‘ያ’ ደግሞ ἐκεῖνοςን በቀጥታና በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: Ἀγρὸς Αἵματος
  choice: የደም መሬት
  rationale: የስፍራውን ስምና በἀγρός እና αἵματος መካከል ያለውን የዝምድና አገባብ ግልጽ አድርጎ ይጠብቃል፤ መሬት የሚለውንም ድግግሞሽ ያቆያል።
- source_word: ἕως τῆς σήμερον
  choice: እስከ ዛሬ ድረስ
  rationale: ስሙ ከቀድሞው ጊዜ እስከ ጸሐፊው ዘመን ድረስ በጥቅም ላይ እንደቆየ የሚያሳየውን የጊዜ አገላለጽ በተለመደ አማርኛ ያቀርባል።
