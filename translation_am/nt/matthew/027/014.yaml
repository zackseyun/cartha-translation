  yaml_path: translation/nt/matthew/027/014.yaml
  text: And he did not answer him with even one word[b][a], so that the governor was greatly amazed.
translation:
  language: am
  text: እርሱም ለእርሱ አንዲት ቃል እንኳ አልመለሰም፤ ስለዚህም ገዢው እጅግ ተደነቀ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: አልመለሰለትም
  rationale: የግሪኩ ግስ እዚህ ‘መለሰ፣ መልስ ሰጠ’ ማለት ነው፤ ከ αὐτῷ ጋር በተፈጥሯዊ አማርኛ ‘አልመለሰለትም’ ተብሏል።
- source_word: πρὸς οὐδὲ ἓν ῥῆμα
  choice: አንዲትም ቃል እንኳ
  rationale: οὐδὲ ἕν ያለውን አጽንዖት ይጠብቃል፤ ῥῆμα በተለመደው ትርጉሙ ‘ቃል/ንግግር’ ተብሏል።
- source_word: ὥστε
  choice: ስለዚህ
  rationale: ዝምታው ያስከተለውን ውጤት በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: ἡγεμόνα
  choice: ገዢው
  rationale: በሮማዊው የአውራጃ አስተዳደር አውድ ጲላጦስን የሚያመለክተውን ማዕረግ በግልጽና በተለመደ አማርኛ ይገልጣል።
- source_word: θαυμάζειν ... λίαν
  choice: እጅግ ተደነቀ
  rationale: የውጤት አረፍተ ነገሩን በአማርኛ የተጠናቀቀ ግስ በመጠቀም ይገልጣል፤ λίαν የሚሰጠውን ጠንካራ የደረጃ አጽንዖት ‘እጅግ’ ይጠብቃል።
