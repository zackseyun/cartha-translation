  rationale: የጩኸቱን ይዘት የሚያስገባው ቦዝ አንቀጽ በተፈጥሯዊ የአማርኛ ቀጥተኛ ንግግር አወቃቀር ተተርጉሟል።
- source_word: Ἠλὶ ἠλὶ λεμὰ σαβαχθάνι
  choice: ኤሊ፣ ኤሊ፣ ለማ ሰበቅታኒ?
  rationale: ማቴዎስ ሴማዊውን ጩኸት እንዳለ አቆይቶ ትርጉሙን ይሰጣል፤ ትርጉሙም ይህንኑ አቀራረብ ጠብቋል።
- source_word: τοῦτ’ ἔστιν
