  yaml_path: translation/nt/matthew/027/046.yaml
  text: About the ninth hour Jesus cried out with a loud voice[a], saying, “Eli, Eli, lema sabachthani?” that is, “My God, my God[b], why have you forsaken me?”
translation:
  language: am
  text: በዘጠነኛው ሰዓት አካባቢ ኢየሱስ በታላቅ ድምፅ ጮኾ[a]፣ “ኤሊ፣ ኤሊ፣ ለማ ሳባክታኒ?” አለ። ይህም፣ “አምላኬ፣ አምላኬ፣[b] ለምን ተውኸኝ?” ማለት ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይህ አገላለጽ መዝሙር 22፥1ን ያስተጋባል።
    reason: cross_reference
  - marker: b
    text: ወይም፣ “ለምን ትተኸኛል?” የግሪኩ ግስ አኦሪስት ነው፤ “ተውኸኝ” የሚለው አተረጓጎም የጩኸቱን ተፈጥሯዊ ኃይልና ከመዝሙር 22፥1 ጋር ያለውን የታወቀ ትስስር ይጠብቃል።
    reason: lexical_alternative
lexical_decisions:
