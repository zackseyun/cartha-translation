- source_word: Θεέ μου θεέ μου
  choice: አምላኬ፣ አምላኬ
  rationale: የቀጥተኛ ጥሪው ድግግሞሽ እና ከመዝሙር 22፥1 ጋር ያለው የቃላት ትስስር ተጠብቋል።
- source_word: ἱνατί με ἐγκατέλιπες
