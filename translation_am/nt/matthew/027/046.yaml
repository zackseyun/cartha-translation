  rationale: περί ከጊዜ መጠቆሚያ ጋር ‘ገደማ’ የሚለውን ትርጉም ይሰጣል፤ δέ እዚህ ቀላል አያያዥ ስለሆነ በአማርኛ በተለየ ቃል አልተገለጸም።
