- source_word: κινοῦντες τὰς κεφαλὰς αὐτῶν
  choice: ራሳቸውን እየነቀነቁ
  rationale: ዋናውን ድርጊት አብሮ የሚከናወነውን የንቀት ምልክት በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: በሕማማት ትረካው ውስጥ βλασφημέω በኢየሱስ ላይ ሲውል ያለው ትርጉም
  choice: በዋናው ጽሑፍ ‘ተሳደቡት’ ተብሎ ተተርጉሟል።
  alternative: ‘ተሳደቡበት’ ወይም በመለኮት ላይ እንደሚነገር ስድብ መግለጽ
  rationale: ግሪኩ βλασφημέω በአምላክ ላይ የሚነገርን ስድብ ብቻ ሳይሆን፣ በሰው ላይ የሚነገርን አዋራጅና ስም አጥፊ ንግግርም ሊያመለክት ይችላል። አማርኛው በዚህ ስፍራ የቃሉን ክብደት ይጠብቃል፣ ነገር ግን ጽሑፉ በግልጽ ያልወሰነውን መለኮታዊ ፍቺ አያስገድድም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና የተከበረ አማርኛ ተጠቅሟል። የግሪኩን የድርጊት ቀጣይነት ለማሳየት ‘እየነቀነቁ’ ተጠቅሟል፤ የስድቡ ቀጣይነት ደግሞ በትረካዊ አገባቡ ይገባል። የሁለቱም ማስታወሻዎች ምልክቶች [a] እና [b] በዋናው ጽሑፍ ገብተዋል።
