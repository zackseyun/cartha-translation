  rationale: δέ የትረካውን ፍሰት የሚያገናኝ ለስላሳ አያያዥ ነው፤ በአማርኛ ‘-ም’ በተፈጥሯዊ ሁኔታ ተገልጧል። ከመስቀሉ ስፍራ እያለፉ ያሉትን ሰዎች ለማመልከት ጽሑፋዊው አንቀጽ ከተሳቢ አድራጊ ጋር ተተርጉሟል።
- source_word: παραπορευόμενοι
