- source_word: ἐβλασφήμουν
  choice: ተሳደቡት
  rationale: ግሱ በሰው ላይ ሲውል ክፉና አዋራጅ ንግግርን ወይም ስድብን ሊያመለክት ይችላል። ‘ተሳደቡት’ በዘመናዊ አማርኛ ይህን ትርጉም በግልጽ ያስተላልፋል፤ የግሪኩ ያልተጠናቀቀ ጊዜ የሚያሳየው ቀጣይ ድርጊት በአገባቡ ተጠብቋል።
- source_word: αὐτὸν
  choice: -ት
