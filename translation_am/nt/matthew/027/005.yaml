reference: Matthew 27:5
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ῥίψας τὰ ἀργύρια ⸂εἰς τὸν ναὸν⸃ ἀνεχώρησεν, καὶ ἀπελθὼν ἀπήγξατο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/005.yaml
  text: And throwing the silver into the temple[a], he departed[b], and went and hanged himself.
translation:
  language: am
  text: ብሩንም ወደ መቅደሱ[a] ጥሎ ወጣ፤[b] ሄዶም ራሱን ሰቀለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወደ ቤተ መቅደሱ ውስጣዊ መቅደስ።” እዚህ ያለው የግሪክ ቃል ναός ከጠቅላላው የቤተ መቅደስ ግቢ ይልቅ በተለይ የመቅደሱን ውስጣዊ ቅዱስ ሕንፃ ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ወጣ፤ ከዚያም ሄዶ ራሱን ሰቀለ።”
    reason: previous_rendering
lexical_decisions:
- source_word: ῥίψας
  choice: ጥሎ
  rationale: የግሪኩን የቀደመ ድርጊት በተፈጥሯዊ የአማርኛ ቦዝ አንቀጽ ያሳያል፤ ከዚያ በኋላ መውጣቱንም በግልጽ ቅደም ተከተል ያቀርባል።
- source_word: τὰ ἀργύρια
  choice: ብሩን
  rationale: በቀደመው አውድ የታወቀውን የብር ክፍያ ያመለክታል፤ ‘ሳንቲሞች’ የሚለውን በግሪኩ በቀጥታ ያልተጠቀሰ ቃል አይጨምርም።
- source_word: εἰς τὸν ναὸν
  choice: በቤተ መቅደሱ ውስጥ
  rationale: በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን ወደ ውስጥ የመወርወሩን አቅጣጫ ያሳያል፤ ναός በተለይ የመቅደሱን ውስጣዊ ቅዱስ ሕንፃ ሊያመለክት መቻሉ በማስታወሻ ተጠብቋል።
- source_word: ἀνεχώρησεν
  choice: ወጣ
  rationale: ከቦታው መሄዱን በአጭር፣ ተፈጥሯዊና ክቡር የትረካ ቋንቋ ይገልጣል።
- source_word: ἀπελθὼν
  choice: ሄዶም
  rationale: ከἀνεχώρησεν የተለየውን ሁለተኛ የእንቅስቃሴ ገለጻ ሳያጠፋ፣ በአማርኛ የተፈጥሮ ፍሰት ያቀርባል።
- source_word: ἀπήγξατο
  choice: ራሱን ሰቀለ
  rationale: መካከለኛው የግስ አይነት ድርጊቱ በራሱ ላይ መፈጸሙን ያሳያል፤ በዚህ አውድም ራስን በመስቀል ሕይወትን ማጥፋት የሚለውን የተለመደ ትርጉም በግልጽ ይሰጣል።
theological_decisions:
- issue: ναός የሚለው ቃል ከሰፊው የቤተ መቅደስ ግቢ ይልቅ የመቅደሱን ውስጣዊ ሕንፃ ማመልከቱ
  choice: በዋናው ጽሑፍ ‘በቤተ መቅደሱ ውስጥ’ ተብሎ ቀርቦ፣ የ‘መቅደስ’ ይበልጥ የተወሰነ ፍቺ በማስታወሻ ተጠብቋል።
  alternative: ‘ወደ መቅደሱ’ ወይም ‘ወደ ቤተ መቅደሱ ውስጣዊ መቅደስ’
  rationale: ይህ አቀራረብ ለተራ አንባቢ ግልጽ ሆኖ ሳለ በναός እና በሰፊው የቤተ መቅደስ ግቢ መካከል ያለውን የቃላት ልዩነት አያጠፋም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር የትረካ አማርኛ ተጠቅሟል። ‘ወጣ፤ ሄዶም’ የግሪኩን ሁለት የመሄድ ገለጻዎች ይጠብቃል፣ ነገር ግን በአማርኛ ከባድ ድግግሞሽ እንዳይፈጠር አጭር ተደርጓል።
