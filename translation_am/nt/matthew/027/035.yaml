reference: Matthew 27:35
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: σταυρώσαντες δὲ αὐτὸν διεμερίσαντο τὰ ἱμάτια αὐτοῦ βάλλοντες κλῆρον,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/035.yaml
  text: And after they crucified him[a], they divided his garments by casting lots.
translation:
  language: am
  text: እርሱንም ከሰቀሉት በኋላ፣ ዕጣ በመጣል ልብሶቹን ተከፋፈሉ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σταυρώσαντες
  choice: ከሰቀሉት በኋላ
  rationale: የግሪኩ አኦሪስት አሳታፊ ግስ መስቀሉ ልብሶቹን ከመከፋፈላቸው በፊት መፈጸሙን ያሳያል፤ ይህ አተረጓጎም ቅደም ተከተሉን በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: δὲ
  choice: -ም
  rationale: δὲ እዚህ ትረካውን የሚያስቀጥል ለስላሳ አያያዥ ነው፤ ከ‘እርሱን’ ጋር የተያያዘው ‘-ም’ በዘመናዊ አማርኛ ፍሰቱን በተፈጥሯዊነት ያስቀጥላል።
- source_word: διεμερίσαντο
  choice: ተከፋፈሉ
  rationale: ግሱ ነገሮቹን በመካከላቸው ተከፋፍለው መውሰዳቸውን ያመለክታል፤ ‘ተከፋፈሉ’ ይህን የጋራ ድርጊት በግልጽ ይገልጣል።
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: ልብሶቹን
  rationale: ἱμάτια በአጠቃላይ ልብሶችን ያመለክታል፤ ‘ልብሶቹን’ ተፈጥሯዊና ግልጽ ሲሆን ‘የውጭ ልብሶቹን’ የሚል ከጽሑፉ በላይ የሆነ ዝርዝር አይጨምርም።
- source_word: βάλλοντες κλῆρον
  choice: ዕጣ በመጣል
  rationale: አሳታፊው ሐረግ ልብሶቹን የተከፋፈሉበትን ዘዴ ያሳያል፤ ‘ዕጣ በመጣል’ የκλῆρονን ነጠላ ቅርጽ እና የድርጊቱን መንገድ በተለመደ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: βάλλοντες κλῆρον ከዋናው ግስ διεμερίσαντο ጋር ያለው ግንኙነት
  choice: ‘ዕጣ በመጣል’ ልብሶቹን የተከፋፈሉበትን ዘዴ እንደሚገልጽ ተተርጉሟል።
  alternative: ‘ልብሶቹን ተከፋፈሉ፣ ዕጣም ጣሉ’
  rationale: የግሪኩ አሳታፊ ሐረግ ዋናውን ግስ በተፈጥሯዊነት በማሻሻል ክፍፍሉ እንዴት እንደተደረገ ያሳያል። የመሣሪያ አገላለጹ ግንኙነቱን ግልጽ ያደርጋል፤ ተጨማሪ ሥነ መለኮታዊ ትርጉም አያስገባም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። ‘ሰቀሉት’ ከዐውደ ንባቡ አንጻር በመስቀል ላይ መስቀልን በቂ ሁኔታ ያመለክታል። ዋናው አማርኛ ትርጉም የግሪኩን ጊዜያዊ ቅደም ተከተልና የዕጣውን የመሣሪያ ግንኙነት ያለ እግር ማስታወሻ በግልጽ ስለሚያሳይ፣ የእግር ማስታወሻ አላስፈለገም።
