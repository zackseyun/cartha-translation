  text: συνηγμένων οὖν αὐτῶν εἶπεν αὐτοῖς ὁ Πιλᾶτος· Τίνα θέλετε ἀπολύσω ὑμῖν, ⸂Ἰησοῦν τὸν⸃ Βαραββᾶν ἢ Ἰησοῦν τὸν λεγόμενον χριστόν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/017.yaml
  text: 'So when they had gathered together[a], Pilate said to them, “Which one do you want me to release to you: Jesus Barabbas[b], or Jesus who is called Messiah?”'
translation:
  language: am
  text: እንግዲህ እነርሱ በተሰበሰቡ ጊዜ ጲላጦስ፣ “ከሁለቱ ማንን እንድፈታላችሁ ትፈልጋላችሁ? ኢየሱስ በርባን[a] ወይስ መሲሕ[b] የሚባለውን ኢየሱስን?” አላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች “ኢየሱስ በርባን” በሚለው ፈንታ “በርባን” ብቻ ይላሉ።
    reason: textual_variant
  - marker: b
    text: ወይም “ክርስቶስ።” የግሪኩ ማዕረግ Χριστός ነው፤ እዚህ እንደ ማዕረግ ስለተጠቀሰ “መሲሕ” ተብሎ ተተርጉሟል።
    reason: alternative_reading
lexical_decisions:
- source_word: συνηγμένων οὖν αὐτῶν
  choice: ስለዚህ ሕዝቡ በተሰበሰበ ጊዜ
  rationale: የግሪኩን ጊዜ ጠቋሚ አገባብና የοὖνን ትረካዊ ትስስር በተፈጥሯዊ አማርኛ ያስተላልፋል። αὐτῶν በአውዱ የተሰበሰበውን ሕዝብ ያመለክታል።
- source_word: Τίνα θέλετε ἀπολύσω ὑμῖν
  choice: ከሁለቱ ማንን ልፍታላችሁ ትፈልጋላችሁ?
  rationale: በሁለት ሰዎች መካከል ያለውን ምርጫ ግልጽ ያደርጋል፤ ἀπολύω በዚህ የፍርድ አውድ ‘መፍታት’ ማለት ነው።
- source_word: Ἰησοῦν τὸν Βαραββᾶν
  choice: ኢየሱስ በርባን
  rationale: በቀረበው SBLGNT ጽሑፍ ያለውን Ἰησοῦν በዋናው ጽሑፍ ውስጥ ይጠብቃል፤ ይህም ኢየሱስ ከሚባሉት ከሁለቱ መካከል ያለውን ንጽጽር ያሳያል።
- source_word: Ἰησοῦν τὸν λεγόμενον χριστόν
  choice: መሲሕ የሚባለውን ኢየሱስን
  rationale: λεγόμενονን ‘የሚባለውን’ ብሎ በቀጥታ ያስተላልፋል፤ χριστός እዚህ እንደ ማዕረግ ስለሚሠራ ‘መሲሕ’ ተብሎ ተተርጉሟል።
theological_decisions:
- issue: የχριστός አተረጓጎም
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: ቃሉ ‘የሚባለው’ ከሚለው ጋር እንደ ማዕረግ የተጠቀሰ ስለሆነ፣ የማዕረጉን ትርጉም የሚያሳየው ‘መሲሕ’ ተመርጧል፤ የተለመደው ‘ክርስቶስ’ በማስታወሻ ተጠብቋል።
- issue: ከበርባን በፊት ‘ኢየሱስ’ን ማካተት
  choice: ኢየሱስ በርባን
  alternative: በርባን
  rationale: የቀረበው የግሪክ ዋና ጽሑፍ Ἰησοῦνን ያካትታል፤ አጭሩ ንባብ ግን እንደ የጽሑፍ ልዩነት በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ የስም ቅደም ተከተል በአማርኛ ተፈጥሯዊነት መሠረት ተስተካክሏል፤ የንባብ ልዩነቶቹ ምልክቶች ከሚመለከታቸው ቃላት ቀጥለው ተቀምጠዋል።
