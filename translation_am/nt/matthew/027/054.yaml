  edition: SBLGNT
  text: Ὁ δὲ ἑκατόνταρχος καὶ οἱ μετ’ αὐτοῦ τηροῦντες τὸν Ἰησοῦν ἰδόντες τὸν σεισμὸν καὶ τὰ ⸀γενόμενα ἐφοβήθησαν σφόδρα λέγοντες· Ἀληθῶς ⸂θεοῦ υἱὸς⸃ ἦν οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/054.yaml
  text: When the centurion and those with him who were guarding Jesus saw the earthquake and the things that had happened[a], they were greatly afraid and said[c][b], “Truly this was the Son of God.”
translation:
  language: am
  text: የመቶ አለቃውና ከእርሱ ጋር ኢየሱስን ይጠብቁ የነበሩት ሰዎች የምድር መንቀጥቀጥንና የሆኑትን ነገሮች ባዩ ጊዜ፣ እጅግ ፈሩ፤ “በእውነት ይህ የእግዚአብሔር ልጅ ነበር” አሉ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “አንድ የእግዚአብሔር ልጅ” ተብሎም ሊተረጎም ይችላል። የግሪኩ θεοῦ υἱός መስተዋድድ የለውም፤ ዋናው ትርጉም ግን ከማቴዎስ ስለ ኢየሱስ አቀራረብ ጋር በሚስማማ መልኩ አገላለጹን እንደ ማዕረግ ወስዶታል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἑκατόνταρχος
  choice: የመቶ አለቃ
  rationale: የሮማውያንን ወታደራዊ ሹም ትርጉም በቀጥታ የሚያሳይና በአማርኛ የተለመደ አገላለጽ ነው።
- source_word: τηροῦντες
  choice: ይጠብቁ የነበሩት
  rationale: በመስቀል ስፍራው ወታደሮቹ ኢየሱስን በጥበቃ ሥር እንዳደረጉት ይገልጣል፤ በዓይን ማየትን ብቻ አያመለክትም።
- source_word: ἰδόντες
  choice: ባዩ ጊዜ
  rationale: የግሪኩን አንቀጽ ጊዜያዊ ግንኙነት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: σεισμόν
  choice: የምድር መናወጥ
  rationale: σεισμός በዚህ አውድ የምድር መናወጥን በግልጽ ያመለክታል።
- source_word: τὰ γενόμενα
  choice: የሆኑትን ነገሮች
  rationale: ከምድር መናወጡ ባሻገር በዙሪያው የተከሰቱትን ነገሮች በስፋት የሚያካትተውን የግሪክ ብዙ ቁጥር አገላለጽ ይጠብቃል።
- source_word: ἐφοβήθησαν σφόδρα
  choice: እጅግ ፈሩ
  rationale: σφόδρα የሚሰጠውን ጠንካራ የፍርሃት መጠን በተፈጥሯዊና ክቡር አማርኛ ያሳያል።
- source_word: Ἀληθῶς
  choice: በእውነት
  rationale: የንግግሩን አጽንዖትና ክብደት ያስተላልፋል፤ የተናጋሪዎቹን ሥነ መለኮታዊ ግንዛቤ ከጽሑፉ በላይ አይወስንም።
- source_word: θεοῦ υἱὸς
  choice: የእግዚአብሔር ልጅ
  rationale: በማቴዎስ ወንጌል አውድ የኢየሱስን መለያ ማዕረግ የሚያመለክት ተፈጥሯዊ አማርኛ ነው። በአማርኛ የተወሰነነት በተናጠል መስተዋድድ ስለማይገለጥ፣ የግሪኩ አንቀጽ አልባነት የሚያስነሳው አማራጭ በማስታወሻ ተገልጧል።
- source_word: οὗτος
  choice: ይህ
  rationale: የማመልከቻ ተውላጠ ስሙን በቀጥታ ይመልሳል፤ የንግግሩንም ቅርበት ይጠብቃል።
theological_decisions:
- issue: θεοῦ υἱὸς የሚለው አገላለጽ አተረጓጎም
  choice: የእግዚአብሔር ልጅ
  alternative: ከአማልክት አንዱ ልጅ / አንድ መለኮታዊ ልጅ
  rationale: የግሪኩ ስም ሐረግ መስተዋድድ አልባ ቢሆንም፣ ተሳቢ ስም በመሆኑ የተወሰነ ወይም ጥራታዊ ትርጉም ሊኖረው ይችላል። የማቴዎስ አጠቃላይ ክርስቶሳዊ አቀራረብ ማዕረጋዊውን ንባብ ይደግፋል፤ ሆኖም የአንቀጽ አልባው ቅርጽ የሚፈቅደው አማራጭ እንዳይደበቅ በማስታወሻ ቀርቧል።
