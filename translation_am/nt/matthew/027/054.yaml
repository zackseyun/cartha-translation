  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የግሪኩ δέ እዚህ ላይ በተናጠል የጊዜ ቃል ስላልሆነ፣ “አሁን” የሚል ቃል አልተጨመረም።
