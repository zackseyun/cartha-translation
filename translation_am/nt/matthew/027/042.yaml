  edition: SBLGNT
  text: Ἄλλους ἔσωσεν, ἑαυτὸν οὐ δύναται σῶσαι· ⸀βασιλεὺς Ἰσραήλ ἐστιν, καταβάτω νῦν ἀπὸ τοῦ σταυροῦ καὶ πιστεύσομεν ἐπ’ ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/042.yaml
  text: He saved others; he cannot save himself. He is the King of Israel; let him come down now from the cross[a], and we will believe in him.
translation:
  language: am
  text: ሌሎችን አዳነ፤ ራሱን ማዳን አይችልም። የእስራኤል ንጉሥ ነው፤ አሁን ከመስቀሉ ይውረድ፣[a] እኛም በእርሱ እናምናለን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የእስራኤል ንጉሥ ከሆነ፣ አሁን ከመስቀሉ ይውረድ፤ እኛም በእርሱ እናምናለን።” አንዳንድ ትርጉሞች ፌዙን ግልጽ ለማድረግ ሁኔታዊ ትርጉም ይጨምራሉ፤ እዚህ ያለው የግሪክ ጽሑፍ ግን ማዕረጉን በቀጥታ ይናገራል።
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄλλους
  choice: ሌሎችን
  rationale: በስም ፋንታ የቆመውን የብዙ ቁጥር ቅጽ በአጭሩና በተፈጥሯዊ አማርኛ ያቀርባል፤ ከ‘ራሱን’ ጋር ያለውን የፌዝ ንጽጽርም ይጠብቃል።
- source_word: ἔσωσεν / σῶσαι
  choice: አዳነ / ማዳን
  rationale: σῴζω በዚህ አውድ ማዳንንና ከአደጋ ማላቀቅን ሊያመለክት ይችላል፤ ‘ማዳን’ ሙሉውን የትርጉም ስፋት ሳያጠብ የፌዙን ኃይል ይጠብቃል።
- source_word: ἑαυτὸν οὐ δύναται σῶσαι
  choice: ራሱን ማዳን አይችልም
  rationale: መልሶ አመልካቹንና δύναμαι ከግስ ስም ጋር ያለውን የችሎታ አሉታ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: βασιλεὺς Ἰσραήλ
  choice: የእስራኤል ንጉሥ
  rationale: የንጉሣዊ ማዕረጉን ቀጥተኛ ቅርጽ ይጠብቃል፤ ቃሉ በአውዱ በፌዝ የተነገረ ቢሆንም ትርጉሙ ፌዙን በተጨማሪ ቃል አይገልጽም።
- source_word: καταβάτω νῦν
  choice: አሁን … ይውረድ
  rationale: የሦስተኛ መደብ ትእዛዛዊ ቅርጹን እንደ ፈተናና ፌዝ የቀረበ ጥያቄ አድርጎ ያስተላልፋል፤ ‘አሁን’ የጊዜውን አፋጣኝነት ይጠብቃል።
- source_word: ἀπὸ τοῦ σταυροῦ
  choice: ከመስቀሉ
  rationale: ቅድመ አያያዡንና በአውዱ የታወቀውን መስቀል በግልጽና ተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: πιστεύσομεν ἐπ’ αὐτόν
  choice: በእርሱ እናምናለን
  rationale: ἐπί ከተሳቢ ቅጽ ጋር ያለውን ወደ ሰው የሚያመለክት እምነት በመደበኛው ‘በ… ማመን’ አገላለጽ ያቀርባል፤ የወደፊት ጊዜውንም ይጠብቃል።
theological_decisions:
- issue: ስለ ኢየሱስ የተነገረውን የንጉሥነት ማዕረግ በፌዝ መቅረቡ
  choice: የእስራኤል ንጉሥ ነው
  alternative: የእስራኤል ንጉሥ ከሆነ
  rationale: የግሪኩ ንባብ ግልጽ የሆነ አመልካች ዓረፍተ ነገር ነው እንጂ ‘ከሆነ’ የሚል ሁኔታዊ ቃል የለውም። ስለዚህ ቀጥተኛው ማዕረግ ተጠብቆ፣ የፌዙ ስሜት ከአውዱ እንዲታወቅ ተደርጓል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። አጭር ንግግሮቹና ሥርዓተ ነጥቡ የተሳዳቢዎቹን ቀጥተኛና ሹል ፌዝ ያንጸባርቃሉ።
