id: MAT.27.25
reference: Matthew 27:25
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς πᾶς ὁ λαὸς εἶπεν· Τὸ αἷμα αὐτοῦ ἐφ’ ἡμᾶς καὶ ἐπὶ τὰ τέκνα ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/025.yaml
  text: And all the people answered[a], “His blood be on us and on our children.”
translation:
  language: am
  text: ሕዝቡም ሁሉ፣ “ደሙ በእኛና በልጆቻችን ላይ ይሁን!” ብለው መለሱ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: መልሰው … አሉ
  rationale: የግሪኩ አካል ከεἶπεν ጋር ሆኖ ምላሽን የሚያስተዋውቅ ፈሊጣዊ አገላለጽ ነው፤ «መልሰው … አሉ» በአማርኛ ተፈጥሯዊ ነው።
- source_word: πᾶς ὁ λαὸς
  choice: ሕዝቡም ሁሉ
  rationale: አንቀጽ ካለው ነጠላ ስም ጋር የተጠቀሰው πᾶς የጋራ ሙሉነትን ያሳያል፤ አገላለጹ በትዕይንቱ ያሉትን የተሰበሰቡ ሰዎች ያመለክታል።
- source_word: Τὸ αἷμα αὐτοῦ
  choice: ደሙ
  rationale: ቀጥተኛና አጭር ትርጉም ነው። በፍርድ አውዱ የሞቱን ኃላፊነት የሚያመለክተው ፍቺ በዋናው ጽሑፍ ሳይስፋፋ በተዘዋዋሪ እንዲቆይ ተደርጓል።
- source_word: ἐφ’ ἡμᾶς
  choice: በእኛ … ላይ ይሁን
  rationale: የግሪኩ ሐረግ ግስ የሌለው ቢሆንም የምኞት/ራስን ለፍርድ የማቅረብ ኃይሉን «ይሁን» በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐπὶ τὰ τέκνα ἡμῶν
  choice: በልጆቻችን ላይ
  rationale: τέκνα በቀጥታ «ልጆች» ማለት ነው፤ «ዘሮች» ማለት ከቃሉ ቀጥተኛ ወሰን በላይ ያሰፋዋል።
theological_decisions:
- issue: πᾶς ὁ λαὸς ፀረ-አይሁድ በሆነ መንገድ ሊተረጎም የሚችልበት አደጋ
  choice: «ሕዝቡም ሁሉ» ተብሎ በትዕይንቱ የተሰበሰቡትን ሰዎች የሚያመለክት የትረካው የጋራ ንግግር እንደሆነ መተርጎም
  alternative: «ሕዝቡ በሙሉ» ወይም «ሕዝቡ ሁሉ»
  rationale: ግሪኩ በዚያ ትዕይንት የተሰበሰቡትን ሕዝብ ምላሽ ይዘግባል። የጋራ ቃሉን ማለስለስም ሆነ በሁሉም ዘመን ባሉ አይሁድ ላይ ዘላቂ የጋራ በደልን ማስፋት አይገባም። የግርጌ ማስታወሻው የጽሑፉን ቃል ሳይቀይር ይህን የተሳሳተ ማስፋፋት ይከላከላል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና በቀላሉ የሚገባ አማርኛ ተጠቅሟል። «ደሙ … ይሁን» የሚለው አገላለጽ የምኞት/ኃላፊነት የመቀበል ኃይሉን ሳይተረጉም ይጠብቃል።
