  text: ὁ ⸀δὲ ἔφη· Τί γὰρ κακὸν ἐποίησεν; οἱ δὲ περισσῶς ἔκραζον λέγοντες· Σταυρωθήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/023.yaml
  text: But he said[a], “What evil has he done?” But they cried out all the more, saying[b], “Let him be crucified.”
translation:
  language: am
  text: እርሱ ግን፣ “ምን ክፉ ነገር አደረገ?”[a] አለ። እነርሱ ግን፣ “ይሰቀል!” እያሉ[b] ይበልጥ ይጮኹ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለምን፣ ምን በደል አደረገ?”
    reason: lexical_alternative
  - marker: b
    text: በተለመደ አነጋገር፣ “ስቀሉት!” ሊባል ይችላል፤ የግሪኩ አባባል ግን በቀጥታ፣ “ይሰቀል!” የሚል ተገብሮ ትእዛዝ ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: አለ
  rationale: የφημί የአንድ ጊዜ የትረካ ንግግር መግቢያ በዘመናዊ አማርኛ በተፈጥሮ ‘አለ’ ይባላል።
- source_word: Τί γὰρ κακὸν ἐποίησεν;
  choice: ምን ክፉ ነገር አደረገ?
  rationale: τί ጋር γάρ እዚህ የተቃውሞ ጥያቄ ነው፤ በአማርኛ ‘ምን ... አደረገ?’ የሚለው ተፈጥሯዊ ሲሆን κακόνንም ‘ክፉ ነገር’ ብሎ በግልጽ ያቆያል።
- source_word: περισσῶς
  choice: ይበልጥ
  rationale: የሕዝቡን የጩኸት መጨመር ያሳያል፤ የድምፅን መጠን ብቻ ከሚወስን ‘እጅግ ጮኹ’ ይልቅ የንጽጽር ኃይሉን ይጠብቃል።
- source_word: ἔκραζον
  choice: ጮኹ
  rationale: የብዙ ቁጥር ግስ ሲሆን ጠንካራ የድምፅ ጥሪን ያሳያል። የግሪኩ ኢምፐርፌክት ቀጣይነት ከπερισσῶς ጋር በ‘ይበልጥ ጮኹ’ በአውዱ ይታያል።
- source_word: λέγοντες
  choice: እያሉ
  rationale: ከጩኸቱ ጋር በአንድ ጊዜ የተፈጸመውን ንግግር በተፈጥሯዊ የአማርኛ ተያያዥ ግስ ያሳያል።
- source_word: Σταυρωθήτω
  choice: ይሰቀል
  rationale: የሦስተኛ መደብ ተገብሮ ትእዛዝን በአማርኛ በቀጥታ ይወክላል፤ ‘ስቀሉት’ ከሚለው አድራጊ ቅርጽ ይልቅ የምንጩን ተገብሮ ቅርጽ ይጠብቃል።
- source_word: ὁ δὲ ... οἱ δὲ
  choice: እርሱ ግን ... እነርሱ ግን
  rationale: ሁለቱንም δέ በ‘ግን’ መተርጎም በጲላጦስና በሕዝቡ ምላሽ መካከል ያለውን ተቃርኖ ያቆያል።
theological_decisions:
- issue: የሕዝቡን የስቅለት ጥያቄ አቀራረብ
  choice: ይሰቀል
  alternative: ስቀሉት
