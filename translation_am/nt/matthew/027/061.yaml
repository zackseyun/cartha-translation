base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/061.yaml
  text: Mary Magdalene and the other Mary were there, sitting opposite the tomb.
translation:
  language: am
  text: መግደላዊት ማርያምና ሌላይቱ ማርያም በዚያ ነበሩ፤ መቃብሩን ትይዩ ተቀምጠው ነበሩ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν δὲ ἐκεῖ
  choice: በዚያ ነበሩ
  rationale: የግሪኩ ግስ በነጠላ ቁጥር ቢሆንም ቀጥለው የተጠቀሱት ሁለት የተያያዙ ባለቤቶች ናቸው፤ በተፈጥሯዊ አማርኛ ብዙ ቁጥር መጠቀም ትርጉሙን በግልጽ ያስተላልፋል። δέ እዚህ ለስላሳ የትረካ ማያያዣ በመሆኑ በተለየ ቃል አልተተረጎመም።
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: መግደላዊት ማርያም
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የታወቀውንና የግሪኩን መለያ የሚጠብቀውን ስያሜ ይጠቀማል።
- source_word: ἡ ἄλλη Μαρία
  choice: ሌላይቱ ማርያም
  rationale: ἄλλη ከመግደላዊት ማርያም የተለየችውን ማርያም ይለያል፤ ‘ሌላይቱ’ ይህን በአጭርና በተፈጥሯዊ መንገድ ያሳያል።
- source_word: καθήμεναι
  choice: ተቀምጠው ነበር
  rationale: የሁለቱን ሴቶች በዚያ ጊዜ የነበረ አቀማመጥ የሚገልጽ የአሁን ጊዜ ተሳቢ ግስ ነው፤ ይህ አተረጓጎም ቀጣይነቱን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἀπέναντι τοῦ τάφου
  choice: መቃብሩን ትይዩ
  rationale: ἀπέναντι በአንድ ነገር ፊት ለፊት ወይም ተቃራኒ መቀመጥን ያመለክታል፤ ‘ትይዩ’ ቦታዊ ግንኙነቱን በግልጽ ይጠብቃል። τάφος በዚህ የቀብር አውድ ‘መቃብር’ ተብሎ ተተርጉሟል።
