base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/019.yaml
  text: While he was sitting on the judgment seat[a], his wife sent word to him, saying, “Have nothing to do with that righteous man[b], for I have suffered greatly today in a dream because of him.”
translation:
  language: am
  text: እርሱም በፍርድ ወንበሩ ላይ ተቀምጦ ሳለ፣ ሚስቱ፣ “ከዚያ ጻድቅ ሰው[a] ጋር ምንም ጉዳይ አይኑርህ፤ በእርሱ ምክንያት ዛሬ በሕልም ብዙ ተሠቃይቻለሁና” ብላ መልእክት ላከችለት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ንጹሕ ሰው።” የግሪኩ ቅጽል ቃል “ጻድቅ፣” “ፍትሐዊ፣” ወይም በሕጋዊ አውድ “ንጹሕ” ማለት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθημένου δὲ αὐτοῦ
  choice: እርሱም ... ተቀምጦ ሳለ
  rationale: የግሪኩ የአብሮ ጊዜ ሁኔታ አገባብ ዋናው ድርጊት ሲፈጸም እርሱ ተቀምጦ እንደነበር ያሳያል፤ ይህ አተረጓጎም በአማርኛ ተፈጥሯዊ ነው።
- source_word: ἐπὶ τοῦ βήματος
  choice: በፍርድ ወንበሩ ላይ
  rationale: βῆμα በዚህ የፍርድ አውድ ባለሥልጣን ፍርድ የሚሰጥበትን መቀመጫ ያመለክታል፤ ‘የፍርድ ወንበር’ ግልጽና የተለመደ ነው።
- source_word: ἀπέστειλεν πρὸς αὐτὸν ἡ γυνὴ αὐτοῦ
  choice: ሚስቱ ... መልእክት ላከችበት
  rationale: ግስና አቅጣጫ አመልካቹ በመልእክተኛ የተላከ ንግግርን ያመለክታሉ፤ ‘መልእክት ላከችበት’ መንገዱን ሳያብራራ ይዘቱን በተፈጥሮ ያቀርባል።
- source_word: Μηδὲν σοὶ καὶ τῷ δικαίῳ ἐκείνῳ
  choice: ከዚያ ጻድቅ ሰው ጋር ምንም ጉዳይ አይኑርህ
  rationale: ይህ አጭር ፈሊጣዊ አገላለጽ ከሰውየው ጉዳይ እንዳይገባ የሚያስጠነቅቅ ነው፤ የተመረጠው አማርኛ ትርጉም ትርጉሙን በግልጽ ያስተላልፋል።
- source_word: τῷ δικαίῳ ἐκείνῳ
  choice: ያ ጻድቅ ሰው
  rationale: δίκαιος የሞራል ቅንነትንና በፍርድ አውድ ንጹሕነትን ሊያመለክት ይችላል። ‘ጻድቅ’ ዋናውን የቃሉን ስፋት ይጠብቃል፤ ‘ንጹሕ’ የሚለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: πολλὰ γὰρ ἔπαθον σήμερον κατ’ ὄναρ δι’ αὐτόν
  choice: በእርሱ ምክንያት ዛሬ በሕልም ብዙ ተሠቃይቻለሁና
  rationale: πολλὰ πάσχω ከፍተኛ መከራን የሚገልጽ ፈሊጥ ነው፤ ፍጹም ጊዜው የዛሬው ልምምድ በአሁኑ ማስጠንቀቂያዋ ላይ ያለውን ተጽእኖ ያሳያል። ‘በሕልም’ κατ’ ὄναρን፣ ‘በእርሱ ምክንያት’ δι’ αὐτόνን በቀጥታ ያቀርባሉ።
theological_decisions:
- issue: ለኢየሱስ የተጠቀሰውን δίκαιος መተርጎም
  choice: ጻድቅ ሰው
  alternative: ንጹሕ ሰው
  rationale: ‘ጻድቅ’ የδίκαιοςን ሞራላዊና የፍትሕ ትርጉም ስፋት ይጠብቃል። በፍርድ ትዕይንቱ ውስጥ ‘ንጹሕ’ ማለትም ተገቢ ቢሆንም፣ ዋና ጽሑፉን በሕጋዊ ንጹሕነት ብቻ አይገድበውም።
