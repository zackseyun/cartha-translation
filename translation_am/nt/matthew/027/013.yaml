- source_word: αὐτῷ
  choice: አለው
  rationale: የግሪክኛው ተውላጠ ስም ‘ለእርሱ’ በአማርኛው ግስ ላይ በ‘-ው’ ተጠብቋል፤ ተጠቃሹ ከአውዱ ግልጽ ነው።
- source_word: ὁ Πιλᾶτος
  choice: ጲላጦስ
  rationale: የግሪክኛው የግል ስም በተለመደው የአማርኛ ቅርጽ ቀርቧል።
- source_word: Οὐκ ἀκούεις
  choice: አትሰማምን?
  rationale: አሉታዊ የጥያቄ ኃይሉንና የἀκούωን መሠረታዊ ‘መስማት’ ትርጉም ይጠብቃል።
- source_word: πόσα
  choice: ስንት ነገር
  rationale: የተነሡትን ጉዳዮች ብዛት ያመለክታል፤ ‘ክሶች’ ብሎ ከምንጩ በላይ አይተረጉምም።
- source_word: σου καταμαρτυροῦσιν
  choice: እንደሚመሰክሩብህ
  rationale: ‘-ብህ’ የተቃራኒ ምስክርነቱን ያሳያል፤ ‘መመስከር’ የግሱን ሕጋዊ የምስክርነት ስሜት ይጠብቃል።
