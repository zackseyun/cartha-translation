lexical_decisions:
- source_word: τότε
  choice: በዚያን ጊዜ
  rationale: ቀጣዩን የትረካ ክስተት የሚያስገባ የጊዜ ምልክት ነው፤ በአማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: λέγει
