  text: καὶ ὅτε ἐνέπαιξαν αὐτῷ, ἐξέδυσαν αὐτὸν τὴν χλαμύδα καὶ ἐνέδυσαν αὐτὸν τὰ ἱμάτια αὐτοῦ καὶ ἀπήγαγον αὐτὸν εἰς τὸ σταυρῶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/031.yaml
  text: And when they had mocked him[a], they stripped the cloak off him and put his own clothes on him, and led him away to crucify him.
translation:
  language: am
  text: ካፌዙበት በኋላ፣ መጎናጸፊያውን[a] ከእርሱ ላይ አውልቀው የራሱን ልብሶች አለበሱት፤ ሊሰቅሉትም ይዘው ሄዱ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ካባውን።” የግሪኩ χλαμύς ብዙውን ጊዜ በላይ የሚደረብ ልብስን ያመለክታል፤ በዚህ አውድ ወታደሮቹ ኢየሱስን እንደ ንጉሥ ለማፌዝ ያለበሱት ልብስ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: ካፌዙበትም በኋላ
  rationale: ግሱ የጭካኔ ንቀትና ማሾፍን ያመለክታል፤ “አፌዙበት” ይህን ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል። የ“በኋላ” አገባብ ὅτε ከአኦሪስት ጋር የሚያሳየውን የተጠናቀቀ ቀዳሚ ድርጊት ይገልጣል።
- source_word: χλαμύδα
  choice: መጎናጸፊያውን
  rationale: χλαμύς በላይ የሚደረብ ካባ ወይም መጎናጸፊያ ነው፤ “መጎናጸፊያ” ከጽሑፉ በላይ መደበኛ የንጉሥ ልብስ እንደነበረ ሳያስገባ የውጭ ልብስነቱን ያሳያል።
- source_word: ἐξέδυσαν αὐτὸν τὴν χλαμύδα
  choice: መጎናጸፊያውን አውልቀው
  rationale: ἐκδύω ልብስን ከሰው ላይ ማውለቅን ያመለክታል፤ አማርኛው ድርጊቱን በቀጥታና በተፈጥሯዊ አገባብ ይገልጣል።
- source_word: ἐνέδυσαν αὐτὸν τὰ ἱμάτια αὐτοῦ
  choice: የራሱን ልብስ አለበሱት
  rationale: “የራሱን” የሚለው αὐτοῦን ግልጽ አድርጎ ከተወገደው የማፌዣ መጎናጸፊያ ጋር ያነጻጽራል፤ “ልብስ” በአማርኛ ብዙ ልብሶችንም በስብስብ ሊያመለክት ይችላል።
- source_word: ἀπήγαγον
  choice: ወሰዱት
  rationale: በዚህ አውድ ግሱ በጥበቃ ሥር ያለን ሰው ከቦታው ይዞ መውሰድን ያመለክታል፤ “ወሰዱት” አጭርና ተፈጥሯዊ ነው።
- source_word: εἰς τὸ σταυρῶσαι
  choice: ሊሰቅሉት
  rationale: εἰς ከአንቀጽ ያለው የግስ ስም ጋር የድርጊቱን ዓላማ ይገልጣል፤ የአማርኛው “ሊ-” አገባብ ይህን ዓላማ በቀጥታ ያሳያል።
