review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the completed mockery, removal of the χλαμύς, restoration of Jesus’ own garments, and the purpose of taking him away. A small revision more explicitly represents removal from him, retains the plural sense of ἱμάτια, and renders ἀπήγαγον with the custodial nuance of being led away.
  naturalness: The Amharic is generally modern and clear. “ይዘው ሄዱ” is more natural and specific than bare “ወሰዱት” in this narrative context, while “ከእርሱ ላይ አውልቀው” removes any momentary ambiguity about whose cloak was removed.
  terminology: “መጎናጸፊያ” is a suitable rendering of χλαμύς and does not overstate a royal sense. “ሊሰቅሉት” appropriately renders crucifixion in established, comprehensible Amharic biblical usage. The lexical-alternative footnote remains properly anchored to the term it explains.
  issues:
  - severity: low
    issue: The removal clause does not explicitly state that the cloak was removed from Jesus.
    rationale: Although the context makes this clear, ἐξέδυσαν αὐτὸν τὴν χλαμύδα specifically expresses stripping the cloak from him. Adding “ከእርሱ ላይ” preserves this relation clearly.
  - severity: low
    issue: “የራሱን ልብስ” uses a singular collective where the Greek has plural ἱμάτια.
    rationale: The singular is possible in Amharic, but “ልብሶች” more directly reflects the source without sacrificing naturalness.
  - severity: low
    issue: “ወሰዱት” is less specific than the custodial ‘led him away’ sense.
    rationale: “ይዘው ሄዱ” naturally conveys that they took him away under escort, matching ἀπήγαγον.
