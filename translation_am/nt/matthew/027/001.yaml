  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Πρωΐας δὲ γενομένης συμβούλιον ἔλαβον πάντες οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ κατὰ τοῦ Ἰησοῦ ὥστε θανατῶσαι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/001.yaml
  text: When morning came[b][a], all the chief priests and the elders of the people took counsel against Jesus so as to put him to death.
translation:
  language: am
  text: ማለዳ ሲሆን[a]፣ ሁሉም የካህናት አለቆችና የሕዝቡ ሽማግሌዎች ኢየሱስን ለመግደል በእርሱ ላይ ተማከሩ።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ጎህ ሲቀድ።»
    reason: lexical_alternative
  - marker: b
    text: «ተማከሩ» የሚለው «ምክክር አደረጉ» ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρωΐας δὲ γενομένης
  choice: ማለዳ በሆነ ጊዜ
  rationale: የግሪኩን ጊዜ ጠቋሚ ፍጹም የዘር አገባብ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ δέ የሚያመለክተው ቀላል የትረካ ሽግግር በዐውዱ ተወክሏል።
- source_word: συμβούλιον ἔλαβον
  choice: ተማከሩ
  rationale: የመመካከርንና የጋራ ውይይትን ትርጉም በዘመናዊና ግልጽ አማርኛ ይገልጣል፤ ከግሪኩ በላይ የሴራ ሐሳብ አይጨምርም።
- source_word: πάντες
  choice: ሁሉ
  rationale: የመሪዎቹ ቡድን በሙሉ መሳተፉን የሚያጎላውን ቃል በግልጽ ይጠብቃል።
- source_word: οἱ ἀρχιερεῖς
  choice: የካህናት አለቆች
  rationale: በወንጌላት የኢየሩሳሌምን የካህናት አመራር ቡድን የሚያመለክት የተለመደ አማርኛ አገላለጽ ነው፤ ብዙ ሊቀ ካህናት እንዳሉ አያሳስትም።
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: የሕዝቡ ሽማግሌዎች
  rationale: መደበኛውን የሕዝብ መሪነት ማዕረግና የዘር ግንኙነቱን በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: በእርሱ ላይ
  rationale: በዚህ ጠላትነት ባለው ዐውድ κατά ከዘር ጋር ያለውን ተቃውሞ ይገልጣል፤ ቀደም ብሎ የተጠቀሰውን ኢየሱስ የሚመለከት ተውላጠ ስም ተጠቅሟል።
- source_word: ὥστε θανατῶσαι αὐτόν
  choice: ኢየሱስን ለመግደል
  rationale: ὥστε ከወሰን የሌለው ግስ ጋር የሚያሳየውን የታሰበ ውጤት/ዓላማ በአማርኛው የዓላማ አገባብ ያቀርባል፤ θανατόω የሚያመለክተውን ሞት ማድረስ በቀጥታ ይገልጣል።
theological_decisions:
- issue: መሪዎቹ በኢየሱስ ላይ ያደረጉት ድርጊት ባሕርይ
  choice: ኢየሱስን ለመግደል በእርሱ ላይ ተማከሩ
  alternative: ስለ ኢየሱስ ተነጋገሩ፤ ወይም ኢየሱስን ለመግደል ሤራ ሠሩ
  rationale: ግሪኩ κατὰ τοῦ Ἰησοῦ ተቃውሞን፣ ὥστε θανατῶσαι αὐτόν ደግሞ የሞት ዓላማን በግልጽ ያሳያል። «ተማከሩ» ይህን ክብደት ሳያሳንስ፣ ቃሉ በራሱ የማያስገድደውን የሴራ ጥላ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የዐረፍተ ነገሩ ቅደም ተከተል ዓላማውን ቀድሞ በማቅረብ ተፈጥሯዊ አማርኛን ይከተላል፣ ነገር ግን የግሪኩን ተቃውሞና የሞት ዓላማ ሙሉ በሙሉ ይጠብቃል።
