  text: καὶ λέγοντες· Ὁ καταλύων τὸν ναὸν καὶ ἐν τρισὶν ἡμέραις οἰκοδομῶν, σῶσον σεαυτόν· εἰ υἱὸς εἶ τοῦ θεοῦ, ⸀κατάβηθι ἀπὸ τοῦ σταυροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/040.yaml
  text: and saying[a], “You who would destroy the temple and build it in three days, save yourself! If you are the Son of God, come down from the cross.”
translation:
  language: am
  text: እንዲህም አሉ፦ “ቤተ መቅደሱን የምታፈርስና በሦስት ቀናት የምትገነባው[a] አንተ፣ ራስህን አድን! የእግዚአብሔር ልጅ ከሆንህ፣ ከመስቀሉ ውረድ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እንደገና የምትገነባው።” የግሪክኛው ግስ “መገንባት” ብቻ ይላል፤ የፌዙ ዐውድ ግን መልሶ መገንባትን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: እንዲህም አሉ
  rationale: የግሪክኛው የአሁን ጊዜ አሳታፊ ቅርጽ ከቀደመው ትረካ ጋር የተያያዘ ነው፤ በአማርኛ ንግግሩን በተፈጥሮ ለማስገባት በዋና ግስ ተተርጉሟል።
- source_word: Ὁ καταλύων
  choice: ቤተ መቅደሱን አፍርሰህ … የምትገነባው አንተ
  rationale: መስተዋድዱና አሳታፊው በቀጥታ ለተነጋገሩት ሰው የቀረበ ጥሪ ናቸው፤ አማርኛውም የፌዙን ቀጥተኛ አድራሻ ይጠብቃል።
- source_word: καταλύω
  choice: ማፍረስ
  rationale: ስለ ቤተ መቅደስ ሲነገር የማፍረስን ወይም የመናድን ሐሳብ በግልጽና በተፈጥሮ ያስተላልፋል።
- source_word: ναός
  choice: ቤተ መቅደስ
  rationale: ቃሉ በጠባቡ የመቅደሱን ቅዱስ ክፍል ሊያመለክት ቢችልም፣ በዚህ ፌዝ ዐውድ የተለመደውና ለአንባቢ ግልጽ የሆነው ‘ቤተ መቅደስ’ ነው።
- source_word: ἐν τρισὶν ἡμέραις
  choice: በሦስት ቀን
  rationale: የጊዜውን ሐረግ በቀጥታና በተለመደ አማርኛ ያቀርባል።
- source_word: οἰκοδομῶν
  choice: የምትገነባው
  rationale: የግሪክኛው ግስ በመሠረቱ ‘መገንባት’ ማለት ነው፤ ‘መልሶ መገንባት’ የሚለው በዐውዱ ሊገባ ቢችልም በግሱ ውስጥ በግልጽ አልተገለጸም።
- source_word: σῶσον σεαυτόν
  choice: ራስህን አድን
  rationale: የትእዛዝ ቅርጹንና ተመላሽ ተውላጠ ስሙን በቀጥታ ያስተላልፋል።
- source_word: κατάβηθι ἀπὸ τοῦ σταυροῦ
  choice: ከመስቀሉ ውረድ
  rationale: ከፍ ካለ ቦታ ወደ ታች እንዲወርድ የተሰጠውን የፌዝ ትእዛዝ በተፈጥሮ ይገልጣል።
theological_decisions:
- issue: υἱὸς τοῦ θεοῦ የሚለውን ክርስቶሳዊ ማዕረግ በፌዝ ዐውድ መተርጎም
  choice: የእግዚአብሔር ልጅ
  alternative: የአምላክ ልጅ
  rationale: ማዕረጉን ሳያዳክም ወይም ሳያሰፋ በቀጥታ ይጠብቃል፤ ‘ከሆንህ’ የሚለውም የተሳዳቢዎቹን ሁኔታዊ ፈተና እንጂ የተርጓሚውን የእምነት ፍርድ አያክልም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛ ተጠቅሟል። የተሳዳቢዎቹ ፌዝ በቀጥተኛ ንግግርና በአጭር የትእዛዝ ቅርጾች ተጠብቋል።
