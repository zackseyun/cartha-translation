review_pass:
  verdict: revise
  source_fidelity: 'The sequence and actions are accurately represented: Joseph approaches Pilate, requests Jesus’ body, and Pilate orders its delivery. However, «ሥጋ» primarily denotes flesh in modern standard Amharic and can misleadingly narrow σώμα. «አካል» is the more faithful, natural rendering for Jesus’ body here.'
  naturalness: The narrative is clear and appropriately formal-modern. Replacing «ሥጋ» with «አካል» improves ordinary comprehensibility without losing biblical register.
  terminology: «ጲላጦስ», «ኢየሱስ», «ለመነ», and «አዘዘ» are suitable. «አካል» better conveys σώμα than «ሥጋ» in this context. «እንዲሰጠው» naturally expresses the passive infinitive’s commanded transfer while identifying the contextually clear recipient.
  issues:
  - severity: medium
    issue: «ሥጋ» for τὸ σῶμα
    rationale: In current standard Amharic, «ሥጋ» normally means ‘flesh’ and may suggest only bodily flesh rather than the whole body. Greek σῶμα denotes the body; «አካል» is the clear, idiomatic equivalent.
  revised_text: እርሱም ወደ ጲላጦስ ቀርቦ የኢየሱስን አካል ለመነ። ከዚያም ጲላጦስ አካሉ እንዲሰጠው አዘዘ።
  revised_footnotes: []
  revision_rationale: 'The sole revision replaces «ሥጋ» with «አካል» in both occurrences, preserving the Greek reference to Jesus’ body and avoiding the narrower modern sense ‘flesh.’ No footnote is required: the Greek passive infinitive and its contextually implied recipient are conveyed naturally by «እንዲሰጠው».'
