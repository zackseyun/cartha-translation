  to: እርሱም ወደ ጲላጦስ ቀርቦ የኢየሱስን አካል ለመነ። ከዚያም ጲላጦስ አካሉ እንዲሰጠው አዘዘ።
  rationale: 'The sole revision replaces «ሥጋ» with «አካል» in both occurrences, preserving the Greek reference to Jesus’ body and avoiding the narrower modern sense ‘flesh.’ No footnote is required: the Greek passive infinitive and its contextually implied recipient are conveyed naturally by «እንዲሰጠው».'
