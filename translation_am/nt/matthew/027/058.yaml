  text: οὗτος προσελθὼν τῷ Πιλάτῳ ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ. τότε ὁ Πιλᾶτος ἐκέλευσεν ⸀ἀποδοθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/058.yaml
  text: He went to Pilate and asked for the body of Jesus[a]. Then Pilate ordered it to be given to him.
translation:
  language: am
  text: እርሱም ወደ ጲላጦስ ቀርቦ የኢየሱስን አካል ለመነ። ከዚያም ጲላጦስ አካሉ እንዲሰጠው አዘዘ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: እርሱም
  rationale: በቀደመው ቁጥር የተጠቀሰውን የአርማትያሱን ዮሴፍ ያመለክታል፤ በአማርኛ ትረካ ውስጥ «እርሱም» ተፈጥሯዊ ነው።
- source_word: προσελθὼν
  choice: ወደ ጲላጦስ ቀርቦ
  rationale: ወደ ጲላጦስ መቅረቡንና ይህ ከዋናው ግስ በፊት መፈጸሙን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ᾐτήσατο
  choice: ለመነ
  rationale: አንድን ነገር እንዲሰጡት መጠየቅን ያመለክታል፤ «ለመነ» በዚህ ዐውደ ንባብ አጭርና ግልጽ ነው።
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: የኢየሱስን ሥጋ
  rationale: σῶμα በቀጥታ «ሥጋ» ተብሎ ተተርጉሟል፤ የሞተውን አካል የሚያመለክት ቢሆንም የማያስፈልግ ጭካኔ ያለውን ቃል አያስገባም።
- source_word: τότε
  choice: ከዚያም
  rationale: በትረካው የሚቀጥለውን ድርጊት ያሳያል።
- source_word: ἐκέλευσεν
  choice: አዘዘ
  rationale: የባለሥልጣንን ትእዛዝ በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἀποδοθῆναι
  choice: እንዲሰጠው
  rationale: የግሪኩን ተደራጊ ግስ «እንዲሰጥ» በሚል ይዘት ያቀርባል፤ ተቀባዩ ዮሴፍ መሆኑ ከዐውደ ንባቡ ግልጽ ስለሆነ «-ው» ተጨምሯል።
