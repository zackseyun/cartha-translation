translation_notes:
  register: ዘመናዊ፣ የተከበረና ለሕዝብ ንባብ ግልጽ የሆነ አማርኛ ተጠቅሟል። የእንግሊዝኛው የግርጌ ማስታወሻ ምልክት ከ‘prisoner’ በኋላ የተቀመጠ ቢሆንም ማስታወሻው በእውነት ‘feast/festival’ የሚለውን ይመለከታል። በአማርኛ ‘በዓል’ ሁለቱንም በተፈጥሮ ስለሚሸፍን የቃላት አማራጭ ማስታወሻ አላስፈለገም።
