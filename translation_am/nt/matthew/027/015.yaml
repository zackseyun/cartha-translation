  yaml_path: translation/nt/matthew/027/015.yaml
  text: At the feast the governor was accustomed to release to the crowd one prisoner[a], whom they wanted.
translation:
  language: am
  text: በበዓሉ ጊዜ ገዢው ሕዝቡ ከሚፈልጉት አንድ እስረኛ ለእነርሱ ይፈታ ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατὰ δὲ ἑορτὴν
  choice: በበዓሉ ጊዜ
  rationale: κατά ከተሳቢ ቅርጽ ጋር በዚህ አገባብ ‘በ…ጊዜ’ የሚል ጊዜያዊ ፍቺ አለው፤ δέ ቀላል የትረካ ማያያዣ በመሆኑ በአማርኛ በተለየ ቃል አልተተረጎመም።
- source_word: ἑορτὴν
  choice: በዓሉ
  rationale: ἑορτή የሃይማኖት በዓልን ወይም የበዓል ጊዜን ያመለክታል፤ ዐውዱ የትኛው በዓል እንደሆነ ያሳያል።
- source_word: εἰώθει
  choice: የመፍታት ልማድ ነበረው
  rationale: ያልፈውን ተደጋጋሚ ልማድ በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὁ ἡγεμὼν
  choice: ገዢው
  rationale: በዚህ ዐውድ ቃሉ የሮም አስተዳዳሪን ያመለክታል፤ ‘ገዢው’ አጭርና የተለመደ ነው።
- source_word: ἀπολύειν
  choice: የመፍታት
  rationale: ከእስር ወይም ከጥበቃ ሥር ነፃ ማውጣትን በትክክል ይገልጣል።
- source_word: ἕνα τῷ ὄχλῳ δέσμιον
  choice: አንድ እስረኛ ለእነርሱ
  rationale: ἕνα ቁጥሩን፣ δέσμιον በእስር ላይ ያለውን ሰው፣ የተሳቢው τῷ ὄχλῳ ደግሞ መፈታቱ ለሕዝቡ ጥያቄ ወይም ጥቅም እንደሆነ ያሳያል። ‘ለእነርሱ’ የቀደመውን ‘ሕዝቡ’ በተፈጥሯዊ አማርኛ ይመልሳል።
- source_word: ὃν ἤθελον
  choice: ሕዝቡ የፈለጉትን
  rationale: አንዱን እስረኛ የሚመርጡት ሕዝቡ መሆናቸውን ያሳያል፤ የአክብሮት ብዙ ቁጥር ግስ ከ‘ሕዝቡ’ ጋር ተፈጥሯዊ ነው።
