- source_word: οἱ συσταυρωθέντες σὺν αὐτῷ
  choice: ከእርሱ ጋር የተሰቀሉት
  rationale: የግሪኩ ተሳቢ አገላለጽ ወንበዴዎቹን ከኢየሱስ ጋር እንደተሰቀሉ ይለያቸዋል፤ ትርጉሙ ተሳቢነቱንና አብሮነቱን ይጠብቃል።
- source_word: ὠνείδιζον
  choice: ይሰድቡት ነበር
