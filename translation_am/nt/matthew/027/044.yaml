lexical_decisions:
- source_word: τὸ δ’ αὐτὸ
  choice: እንዲሁ
  rationale: በዚህ ስፍራ የግሪኩ አገላለጽ ቀደም ሲል የተገለጸውን ተመሳሳይ አያያዝ በተውሳክ ያመለክታል፤ «እንዲሁ» ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
