id: MAT.27.22
reference: Matthew 27:22
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Πιλᾶτος· Τί οὖν ποιήσω Ἰησοῦν τὸν λεγόμενον χριστόν; ⸀λέγουσιν πάντες· Σταυρωθήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/022.yaml
  text: Pilate said to them[a], “What then should I do with Jesus who is called Messiah?” They all said, “Let him be crucified.”
translation:
  language: am
  text: ጲላጦስም፣ “እንግዲህ መሲሕ[a] የሚባለውን ኢየሱስን ምን ላድርገው?” አላቸው። ሁሉም፣ “ይሰቀል!” አሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ክርስቶስ»።
    reason: Χριστός እዚህ ማዕረግ ነው። «መሲሕ» ትርጉሙን በቀጥታ ያሳያል፤ «ክርስቶስ» ደግሞ በአማርኛ የተለመደ ባህላዊ ቅርጽ ነው።
lexical_decisions:
- source_word: Τί οὖν ποιήσω
  choice: እንግዲህ … ምን ላድርገው?
  rationale: የግሪኩ አኦሪስት ሰብጃንክቲቭ የምክክር ጥያቄን ያመለክታል፤ «ምን ላድርገው?» ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል። «እንግዲህ» የοὖνን ውጤታዊ የንግግር ግንኙነት ይጠብቃል።
- source_word: Ἰησοῦν
  choice: ኢየሱስን
  rationale: የግል ስሙ በተለመደው የአማርኛ መጽሐፍ ቅዱስ አጻጻፍ ቀርቧል፤ የቀጥተኛ ተሳቢነቱም በ«-ን» ተገልጧል።
- source_word: τὸν λεγόμενον χριστόν
  choice: ክርስቶስ የሚባለውን
  rationale: λεγόμενον ያለውን ተገብሮአዊ የአሁን አሳታፊ ኃይል «የሚባለውን» ይጠብቃል። «ክርስቶስ» በአማርኛ የተለመደ መጽሐፍ ቅዱሳዊ መጠሪያ ሲሆን፣ ትርጉሙ «መሲሕ» መሆኑ በማስታወሻ ተገልጧል።
- source_word: λέγουσιν πάντες
  choice: ሁሉም … አሉ
  rationale: ታሪካዊው የአሁን ጊዜ ግስ በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜ ሆኖ ቀርቧል፤ πάντες ያለው የሁሉንም የጋራ ምላሽ በ«ሁሉም» ያስጠብቃል።
- source_word: Σταυρωθήτω
  choice: ይሰቀል!
  rationale: ሦስተኛ መደብ ነጠላ ተገብሮአዊ ትእዛዝ ነው። «ይሰቀል!» የትእዛዙን ኃይልና ተገብሮአዊ ቅርጽ በአጭርና ተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: የΧριστός አተረጓጎም
  choice: ክርስቶስ
  alternative: መሲሕ
  rationale: Χριστός እዚህ እንደ ማዕረግ ያገለግላል። «ክርስቶስ» በዘመናዊ መደበኛ አማርኛ የታወቀና የተከበረ ቅርጽ ነው፤ «መሲሕ» ግን የማዕረጉን አይሁዳዊ ትርጉም በቀጥታ ስለሚያሳይ በአማራጭ ማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የጥያቄውና የሕዝቡ አጭር ትእዛዛዊ ምላሽ ኃይል ተጠብቋል።
