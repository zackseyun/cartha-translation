    text: ማቴዎስ ይህን የትንቢት ቃል ለኤርምያስ ይሰጠዋል። አነጋገሩ ግን ከዘካርያስ 11፥12–13 ጋር በጣም ይመሳሰላል። አንዳንዶች ይህን የተቀናጀ ጥቅስ፣ በኤርምያስ ስም የተሰየመ የነቢያት ስብስብ ማጣቀሻ፣ ወይም በጽሑፍ ስርጭት የተፈጠረ ችግር እንደሆነ ያስረዳሉ።
