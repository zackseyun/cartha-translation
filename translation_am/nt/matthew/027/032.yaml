base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/032.yaml
  text: And as they were going out[a], they found a man of Cyrene named Simon[b]. They compelled him to carry his cross.
translation:
  language: am
  text: ሲወጡም፣ ስምዖን የሚባል የቀሬና ሰው አገኙ። ይህን ሰው የኢየሱስን መስቀል[b] እንዲሸከም አስገደዱት[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በግድ አሰማሩት።” የግሪኩ ግስ ባለሥልጣን በግድ የሚያስፈጽመውን አገልግሎት ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: በግሪኩ “የእርሱን መስቀል” ይላል፤ ተውላጠ ስሙ በአውዱ ኢየሱስን ያመለክታል።
    reason: referent_clarification
lexical_decisions:
- source_word: Ἐξερχόμενοι
  choice: እየወጡም ሳሉ
  rationale: የአሁን ጊዜ አንቀጽ ሆኖ ከዋናው ድርጊት ጋር በአንድ ጊዜ የሚካሄድ ሁኔታን ያሳያል፤ ይህ አተረጓጎም ጊዜያዊውን ግንኙነት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: δὲ
  choice: -ም
  rationale: እዚህ ላይ ጠንካራ ተቃርኖን ሳይሆን የትረካውን ቀጣይነት የሚያሳይ ለስላሳ አያያዥ ነው።
- source_word: εὗρον
  choice: አገኙ
  rationale: የግሪኩን ቀጥተኛ ትርጉምና የትረካውን ቀላል አካሄድ ይጠብቃል።
- source_word: ἄνθρωπον Κυρηναῖον
  choice: የቀሬና ሰው
  rationale: Κυρηναῖον ሰውየውን በመጣበት ስፍራ ይለያል፤ ‘የቀሬና ሰው’ ትክክለኛና ተፈጥሯዊ አማርኛ ነው።
- source_word: ὀνόματι Σίμωνα
  choice: ስምዖን የሚባል
  rationale: ‘ስሙ ስምዖን የሆነ’ የሚለውን የግሪክ አገላለጽ በግልጽና ወቅታዊ አማርኛ ያቀርባል።
- source_word: τοῦτον
  choice: ይህን ሰው
  rationale: በግሪክ የተገለጸውን አመልካች ቃል በግልጽ ይጠብቃል።
- source_word: ἠγγάρευσαν
  choice: አስገደዱት
  rationale: ግሱ ባለሥልጣን በግድ አገልግሎት ላይ ማሰማራትን ያመለክታል፤ ‘አስገደዱት’ የግዳጁን ሐሳብ በአጭርና ተፈጥሯዊ መንገድ ይገልጣል።
- source_word: ἵνα ἄρῃ
  choice: እንዲሸከም
  rationale: ἵνα ከንዑስ ግስ ጋር የዓላማ ግንኙነትን ያሳያል፤ በዚህ አውድ αἴρω መስቀሉን መሸከም ማለት ነው።
- source_word: τὸν σταυρὸν
  choice: መስቀል
  rationale: የግሪኩን ቃል በተለመደውና ትክክለኛው አማርኛ ይተረጉማል፤ ጽሑፉ በተለይ ‘የመስቀሉ አግዳሚ እንጨት’ ብሎ አይገድብም።
- source_word: αὐτοῦ
  choice: የእርሱን
  rationale: የግሪኩን ተውላጠ ስም ሳይተካ ይጠብቃል፤ በአውዱ የሚያመለክተው ኢየሱስን ነው።
theological_decisions:
- issue: የαὐτοῦ (‘የእርሱ’) ተጠቃሽ
  choice: በዋናው ጽሑፍ ‘የእርሱን መስቀል’ ተብሎ ተውላጠ ስሙ ተጠብቋል፤ በአውዱ እርሱ ኢየሱስ ነው።
  alternative: ግልጽ በማድረግ ‘የኢየሱስን መስቀል’ ማለት።
  rationale: አውዱ ስምዖን የተፈረደበትን የኢየሱስን መስቀል እንዲሸከም መገደዱን ያሳያል። ሆኖም ምንጩ ስምን ሳይደግም ተውላጠ ስም ስለሚጠቀም፣ ዋናው ጽሑፍም ያንኑ ቅርጽ ጠብቆ ማብራሪያውን በግርጌ ማስታወሻ ይሰጣል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። ‘እየወጡም ሳሉ’ የአንቀጹን ጊዜያዊ ኃይል፣ ‘ይህን ሰው’ ደግሞ የግሪኩን አመልካች አጽንዖት ይጠብቃሉ። የግርጌ ማስታወሻ ምልክቶቹ ከሚያብራሯቸው ቃላት ጋር ተያይዘው ተቀምጠዋል።
