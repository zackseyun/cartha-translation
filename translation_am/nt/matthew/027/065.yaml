  naturalness: The narrative and direct speech are otherwise natural modern standard Amharic. Replacing the final verb with 'ደህንነቱን አረጋግጡ' gives an idiomatic and clear rendering of making the implicitly referenced tomb/site secure.
  terminology: '''የጥበቃ ቡድን'' suitably conveys κουστωδία as a guard detail. The wording of note b should be corrected: its current alternative is unnatural and does not clearly convey the source phrase''s sense of acting according to their knowledge or capability.'
