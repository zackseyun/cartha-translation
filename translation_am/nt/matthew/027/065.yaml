base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/065.yaml
  text: Pilate said to them[a], “You have a guard. Go[b], make it secure as you know how.”
translation:
  language: am
  text: ጲላጦስም እንዲህ አላቸው፦ “የጥበቃ ቡድን አላችሁ[a]። ሂዱና እንደምታውቁት ደህንነቱን አረጋግጡ[b]።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የጥበቃ ቡድን ውሰዱ፤” ምናልባትም፣ “የራሳችሁ የጥበቃ ቡድን አላችሁ።” ግሪክኛው ጲላጦስ የጥበቃ ቡድን እንዲወስዱ እንደፈቀደላቸው ወይም ቀድሞውኑ በእጃቸው ያለውን ቡድን እንደጠቀሰ ሊገባ ይችላል።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ “በምታውቁት መንገድ ደህንነቱን አረጋግጡ።”
    reason: previous_rendering
lexical_decisions:
- source_word: ἔφη
  choice: እንዲህ አላቸው
  rationale: በትረካ ውስጥ የንግግር መግቢያን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: αὐτοῖς
  choice: አላቸው
  rationale: የብዙ ቁጥር ተቀባዮችን በግስ ቅጥያው በተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: Ἔχετε
  choice: አላችሁ
  rationale: የግሪክኛውን ቀጥተኛ አመልካች ትርጉም ይጠብቃል፤ የትእዛዝ ትርጉሙ በማስታወሻ ተቀምጧል።
- source_word: κουστωδίαν
  choice: የጥበቃ ቡድን
  rationale: የላቲን ብድር ቃሉ አንድን ጠባቂ ሳይሆን በጥበቃ ሥራ የተመደበ ቡድንን ሊያመለክት ስለሚችል ግልጽና ዘመናዊ አማርኛ ተመርጧል።
- source_word: ὑπάγετε
  choice: ሂዱና
  rationale: የመሄድ ትእዛዙን በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἀσφαλίσασθε
  choice: ቦታውን አስተማምኑ
  rationale: ቦታው እንዳይደፈር ወይም እንዳይከፈት ጥንቃቄ ማድረግን ያሳያል፤ በአማርኛ የሚፈለገው የተረዳ ግስ ማሟያ ‘ቦታውን’ ከቀደመው ዐውድ ተገልጿል።
- source_word: ὡς οἴδατε
  choice: በምታውቁት መንገድ
  rationale: እንደ እውቀታቸው ወይም እንደ ችሎታቸው እንዲያደርጉ የሚሰጠውን ሐሳብ ሳያጋንን ይጠብቃል።
theological_decisions:
- issue: Ἔχετε κουστωδίαν ጲላጦስ የሮማ ጠባቂዎችን እንዲወስዱ መፍቀዱን ወይስ የአይሁድ መሪዎች ቀድሞውኑ ያላቸውን ጠባቂዎች መጥቀሱን
  choice: በዋናው ጽሑፍ “የጥበቃ ቡድን አላችሁ” ተብሎ ተተርጉሟል።
  alternative: “የጥበቃ ቡድን ውሰዱ” ወይም “የራሳችሁ የጥበቃ ቡድን አላችሁ”
  rationale: የግሪክኛው ቅርጽ ፈቃድ እንደመስጠትም ሆነ ቀድሞ ያለን ጠባቂ እንደመጥቀስ ሊሰማ ይችላል። አከራካሪውን ታሪካዊ ጥያቄ ሳይወስን የቃሉን አሻሚነት ለመጠበቅ ቀጥተኛው አተረጓጎም በዋናው ጽሑፍ፣ አማራጮቹም በማስታወሻ ቀርበዋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ የትረካ አማርኛ ተጠቅሟል። “የጥበቃ ቡድን” ከጥንታዊ ወይም ከወታደራዊ ቴክኒካዊ ቃል ይልቅ ግልጽ ነው፤ “አስተማምኑ” ደግሞ ቦታውን የተጠበቀና የማይደፈር ማድረግን ያሳያል።
