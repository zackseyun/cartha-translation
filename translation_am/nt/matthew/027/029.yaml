- source_word: Χαῖρε
  choice: ሰላም ለአንተ ይሁን
  rationale: በዚህ አውድ ያለውን መደበኛ ሰላምታና የንጉሥ አክብሮት መሳይ ፌዝ ያስተላልፋል።
- source_word: βασιλεῦ τῶν Ἰουδαίων
  choice: የአይሁድ ንጉሥ ሆይ
  rationale: በሕማማቱ ትረካ ውስጥ ያለውን የንጉሥነት ክስና የፌዝ ማዕረግ በተለመደና ግልጽ አማርኛ ያቀርባል፤ የክልላዊውን አማራጭ ትርጉም በማስታወሻ ይጠብቃል።
theological_decisions:
- issue: የፌዝ ንጉሣዊ ሰላምታውን ሳያዳክሙ ማቅረብ
  choice: “የአይሁድ ንጉሥ ሆይ፣ ሰላም ለአንተ ይሁን!”
  alternative: “የአይሁድ ንጉሥ ሆይ፣ ደስ ይበልህ!”
  rationale: Χαῖρε በቃል ደረጃ ‘ደስ ይበልህ’ የሚል መልክ ሊኖረው ቢችልም፣ እዚህ የሰላምታ ተግባር አለው። የተመረጠው አገላለጽ የሐሰት ንጉሣዊ አክብሮቱንና ምፀቱን ይጠብቃል።
- issue: Ἰουδαίων የሚለውን በማዕረጉ ውስጥ መተርጎም
  choice: አይሁድ
  alternative: የይሁዳ ሰዎች
  rationale: በዚህ የሕማማት ትረካ ውስጥ ቃሉ ከኢየሱስ የንጉሥነት ክስ ጋር የተያያዘውን ሰፊ ሕዝባዊና ሃይማኖታዊ መጠሪያ ይይዛል። ሆኖም የክልላዊ ትርጉሙ እውነተኛ የቃል አማራጭ ስለሆነ በማስታወሻ ተጠብቋል።
