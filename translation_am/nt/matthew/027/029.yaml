  text: And after weaving a crown of thorns[a], they put it on his head, and a reed in his right hand; and kneeling before him, they mocked him, saying, “Hail, King of the Jews!”
translation:
  language: am
  text: ከእሾህም አክሊል ጠልፈው በራሱ ላይ አኖሩት፤ በቀኝ እጁም ሸምበቆ አስያዙት። በፊቱም ተንበርክከው፣ “ሰላም ለአንተ ይሁን፣ የአይሁድ[a] ንጉሥ ሆይ!” እያሉ አፌዙበት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የይሁዳ ሰዎች” ተብሎም ሊተረጎም ይችላል። የግሪኩ Ἰουδαίων ቃል አይሁድን ወይም የይሁዳ ሰዎችን ሊያመለክት ይችላል፤ በዚህ ስፍራ ግን ኢየሱስን ለማፌዝ በተጠቀሙበት የንጉሥነት ማዕረግ ውስጥ ይገኛል።
    reason: lexical_alternative
