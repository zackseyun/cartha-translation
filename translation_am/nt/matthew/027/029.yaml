- source_word: κάλαμον
  choice: ሸምበቆ
  rationale: ቃሉን በቀጥታ ይተረጉማል፤ ሸምበቆው እንደ ንጉሣዊ በትር ለመሳለቂያ መጠቀሙን በትርጉሙ ውስጥ አይጨምርም።
- source_word: γονυπετήσαντες ἔμπροσθεν αὐτοῦ
