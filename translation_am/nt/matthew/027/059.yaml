lexical_decisions:
- source_word: λαβὼν
  choice: ወስዶ
  rationale: የግሪክ የአኦሪስት ቦዝ አንቀጽ ከዋናው ድርጊት በፊት የተፈጸመውን ያሳያል፤ «ወስዶ» ይህን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: σῶμα
  choice: ሥጋውን
  rationale: σῶμα ማለት «ሥጋ/አካል» ነው። በአማርኛ የሙትን አካል በዚህ የቀብር አውድ «ሥጋውን» ማለት ተፈጥሯዊና ክብር ያለው ነው፤ ተውላጠ ስሙም ኢየሱስን እንደሚያመለክት ያሳያል።
- source_word: ἐνετύλιξεν
  choice: ጠቀለለው
  rationale: ἐντυλίσσω መጠቅለልን ወይም በጨርቅ መክበብን ያመለክታል፤ «ጠቀለለው» በቀብር አውድ ግልጽና ዘመናዊ ነው።
- source_word: αὐτὸ
  choice: -ው (በ«ጠቀለለው»)
  rationale: የግሪኩ ተውላጠ ስም በሰዋስው ከσῶμα ጋር የሚስማማ ገለልተኛ ጾታ ነው። አማርኛ ግን ይህን የጾታ ልዩነት በተመሳሳይ መንገድ ስለማታሳይ፣ በግሱ ላይ ያለው «-ው» ሥጋውን እና በአውዱ ኢየሱስን በተፈጥሮ ያመለክታል።
- source_word: σινδόνι
  choice: በ… የበፍታ ጨርቅ
  rationale: σινδών የበፍታ ጨርቅን፣ በተለይም ለቀብር የሚውል መጠቅለያን ሊያመለክት ይችላል። «የበፍታ ጨርቅ» የቃሉን ስፋት ሳያጠብ ግልጽ ነው።
- source_word: καθαρᾷ
  choice: ንጹሕ
  rationale: καθαρός በዚህ አውድ ጨርቁ ንጹሕ መሆኑን ያሳያል፤ «ንጹሕ» ቀጥተኛና ተገቢ ነው።
- source_word: καὶ ... ὁ Ἰωσὴφ
  choice: ዮሴፍም
  rationale: καί የትረካውን ቀጣይነት ያገናኛል፤ የአማርኛው «-ም» ይህን ግንኙነት በተፈጥሯዊ መንገድ ይገልጣል።
