  text: saying[a], “Lord, we remember that that deceiver said while he was still alive[b], ‘After three days I rise.’”
translation:
  language: am
  text: እንዲህ አሉ፦ “ጌታ ሆይ፣ ያ አሳሳች በሕይወት ሳለ[b]፣ ‘ከሦስት ቀን በኋላ እነሣለሁ’[a] ብሎ እንዳለ አስታወስን።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ ግስ በቅርጹ የአሁን ጊዜ ነው፤ እንደ “እነሣለሁ” ወይም “እነሣለሁ” ተብሎ ሊተረጎም ይችላል። ቅርጹ የመካከለኛ/ተደራጊ ድምፅ አሻሚነት አለው።
