    text: አንዳንድ የእጅ ጽሑፎች “መጥተው” በሚለው ፊት “በሌሊት” የሚለውን ይጨምራሉ፦ “ደቀ መዛሙርቱ በሌሊት መጥተው እርሱን እንዳይሰርቁ።” እዚህ አጭሩ ንባብ ተከትሏል።
