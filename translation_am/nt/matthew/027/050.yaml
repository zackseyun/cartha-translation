  text: But Jesus cried out again with a loud voice and gave up his spirit[a].
translation:
  language: am
  text: ኢየሱስ ግን ደግሞ ከፍ ባለ ድምፅ ጮኸና መንፈሱን ሰጠ[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የመጨረሻ እስትንፋሱን አወጣ።” የግሪኩ አነጋገር «መንፈሱን ሰጠ» የሚል ሲሆን፣ ሞቱን የሚያመለክት ፈሊጣዊ አነጋገር ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ግን
  rationale: በትረካው ፍሰት ውስጥ መጠነኛ ንፅፅርንና ወደ ቀጣዩ ድርጊት መሸጋገርን ያሳያል።
- source_word: πάλιν
  choice: ደግሞ
  rationale: ድርጊቱ እንደተደገመ በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: κράξας
  choice: ጮኸና
  rationale: κράζω ከፍ ያለ ጩኸትን ያመለክታል፤ የግሪኩን ቦዝ አንቀጽ ከዋናው ግስ ጋር በ«-ና» ማያያዝ በአማርኛ ተፈጥሯዊ ነው።
- source_word: φωνῇ μεγάλῃ
  choice: በታላቅ ድምፅ
  rationale: የድምፁን ከፍተኛነት በክብር ያለውና ለአንባቢ ግልጽ በሆነ አገላለጽ ያስተላልፋል።
- source_word: ἀφῆκεν
  choice: ለቀቀ
  rationale: ἀφίημι እዚህ ከτὸ πνεῦμα ጋር «መልቀቅ» የሚለውን የሞት ፈሊጥ ይፈጥራል፤ ቃሉን ይጠብቃል እንጂ ትርጉሙን በማብራሪያ አይተካውም።
- source_word: τὸ πνεῦμα
  choice: መንፈሱን
  rationale: የግሪኩን πνεῦμα «መንፈስ» ብሎ በቀጥታ ይጠብቃል፤ ባለቤትነቱም በአማርኛው ቅጥያ በተፈጥሯዊ ሁኔታ ተገልጿል።
theological_decisions:
- issue: ἀφῆκεν τὸ πνεῦμα የሚለውን የሞት ፈሊጥ መተርጎም
  choice: መንፈሱን ለቀቀ
  alternative: የመጨረሻ እስትንፋሱን ተነፈሰ / ሞተ
  rationale: «መንፈሱን ለቀቀ» የምንጩን «መንፈስ» ቃልና የአገላለጹን ክብደት ይጠብቃል። «የመጨረሻ እስትንፋሱን ተነፈሰ» የሞትን ትርጉም ይገልጻል፣ ነገር ግን πνεῦμαን ወደ «እስትንፋስ» ብቻ ያጠባል፤ «ሞተ» ደግሞ የምንጩን ምስላዊ አነጋገር ያጠፋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። «ጮኸና» የትረካውን ፍሰት ተፈጥሯዊ ሲያደርግ፣ «መንፈሱን ለቀቀ» የግሪኩን ፈሊጥና ሥነ መለኮታዊ ውጥረት ሳይፈታ ይጠብቃል።
