  yaml_path: translation/nt/matthew/027/011.yaml
  text: Jesus stood before the governor[a], and the governor questioned him, saying, “Are you the King of the Jews?” And Jesus said[b], “You say so.”
translation:
  language: am
  text: 'ኢየሱስም በገዢው ፊት ቆመ። ገዢውም፣ “አንተ የአይሁድ[a] ንጉሥ ነህ?” ብሎ ጠየቀው። ኢየሱስም፣ “አንተ ትላለህ”[b] አለ።


    [a] “የይሁዳውያን” ተብሎም ሊተረጎም ይችላል። የግሪኩ ቃል በአጠቃላይ አይሁድን ወይም እንደ አውዱ የይሁዳን ሰዎች ሊያመለክት ይችላል።

    [b] ወይም፣ “አንተ አልኸው” ወይም “እንዳልኸው ነው።” የኢየሱስ መልስ በግሪክኛ አጭርና ሙሉ በሙሉ ያልተብራራ ነው።'
  philosophy: optimal-equivalence
