  edition: SBLGNT
  text: Ὀψίας δὲ γενομένης ἦλθεν ἄνθρωπος πλούσιος ἀπὸ Ἁριμαθαίας, τοὔνομα Ἰωσήφ, ὃς καὶ αὐτὸς ⸀ἐμαθητεύθη τῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/057.yaml
  text: When evening had come[a], a rich man from Arimathea came, named Joseph[b], who himself also had become a disciple of Jesus.
translation:
  language: am
  text: ምሽት በደረሰ ጊዜ፣ ዮሴፍ የሚባል ከአርማትያ የሆነ አንድ ባለጠጋ ሰው መጣ፤ እርሱም ራሱ የኢየሱስ ደቀ መዝሙር ሆኖ ነበር።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በኢየሱስ ደቀ መዝሙር ተደርጎ ነበር” ወይም “እርሱም ራሱ የኢየሱስ ደቀ መዝሙር ነበር።”
    reason: alternative_reading
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: ማታ በሆነ ጊዜ
  rationale: የግሪኩን ጊዜ አመልካች ገለልተኛ ሐረግ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል፤ δέ የሚያመለክተው የትረካ ሽግግር በአማርኛው የአንቀጽ አወቃቀር ተሸክሟል።
- source_word: ἦλθεν
  choice: መጣ
  rationale: ቀጥተኛና ተፈጥሯዊ የትረካ አቻ ነው።
- source_word: ἄνθρωπος πλούσιος
  choice: አንድ ባለጠጋ ሰው
  rationale: πλούσιος የሚገልጸውን የሀብት ሁኔታ በግልጽና በተለመደ አማርኛ ይገልጻል።
- source_word: ἀπὸ Ἁριμαθαίας
  choice: ከአርማትያስ የሆነ
  rationale: የዮሴፍን የትውልድ ወይም የመገኛ ስፍራ ያሳያል፤ ‘ከአርማትያስ የመጣ ... መጣ’ የሚለውን የግስ ድግግሞሽ ያስወግዳል።
- source_word: τοὔνομα Ἰωσήφ
  choice: ዮሴፍ የሚባል
  rationale: ስሙን የሚያስተዋውቀውን የግሪክ አገላለጽ በአጭርና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ὃς καὶ αὐτὸς
  choice: እርሱ ራሱም
  rationale: καί የሚያመለክተውን ‘ደግሞ’ ሐሳብና αὐτός የሚሰጠውን አጽንዖት በአንድ ተፈጥሯዊ አገላለጽ ይጠብቃል።
- source_word: ἐμαθητεύθη τῷ Ἰησοῦ
  choice: የኢየሱስ ደቀ መዝሙር ሆኖ ነበር
  rationale: የተፈጸመውን ወደ ደቀ መዝሙርነት መግባትና በዚያ ሁኔታ መገኘት ያሳያል፤ ኢየሱስ በቀጥታ እንዳስተማረው ከጽሑፉ በላይ አይወስንም።
theological_decisions:
- issue: ἐμαθητεύθη ከኢየሱስ ጋር ያለው ትርጉማዊ ግንኙነት
  choice: ዮሴፍ የኢየሱስ ደቀ መዝሙር ሆኖ ነበር
  alternative: ዮሴፍ በኢየሱስ ደቀ መዝሙር ተደርጎ ነበር
  rationale: የግሪኩ ተደራጊ ግስ ወደ ደቀ መዝሙርነት መግባትን ወይም ደቀ መዝሙር መደረግን ሊገልጽ ይችላል። ዋናው ትርጉም ዮሴፍ ከኢየሱስ ደቀ መዛሙርት አንዱ መሆኑን በግልጽ ያሳያል፤ የዚህን ደቀ መዝሙርነት አፈጣጠር ግን ከሚገባው በላይ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ደቀ መዝሙር” በሰፊው የታወቀው መጽሐፍ ቅዱሳዊ ቃል በመሆኑ ተጠብቋል። የእንግሊዝኛው [b] ማስታወሻ የቀድሞ የእንግሊዝኛ ቃላት አደራደርን ብቻ የሚመለከት እንጂ የምንጭ ጽሑፉን አማራጭ ትርጉም የማይወክል ስለሆነ ወደ አማርኛው አልተላለፈም።
