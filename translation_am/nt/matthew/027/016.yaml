- source_word: ἐπίσημον
  choice: በክፉ የታወቀ
  rationale: ቃሉ ታዋቂነትን ሊያመለክት ቢችልም፣ ከእስረኛው አውድ አንጻር መጥፎ ዝናን የሚገልጥ አገላለጽ ይበልጥ ተስማሚ ነው።
- source_word: λεγόμενον
  choice: የተባለ
  rationale: ስምን ወይም መጠሪያን ለማስተዋወቅ ተፈጥሯዊና ቀጥተኛ አማርኛ ነው።
- source_word: Ἰησοῦν Βαραββᾶν
  choice: ኢየሱስ በርባን
  rationale: የቀረበው SBLGNT ጽሑፍ ሁለቱንም ስሞች ስለያዘ ዋናው ጽሑፍ ሁለቱንም ይጠብቃል፤ አጭሩ ንባብ በማስታወሻ ቀርቧል።
