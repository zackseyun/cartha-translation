  rationale: የቀረበው SBLGNT Ἰησοῦν Βαραββᾶν ይላል። ስለዚህ የምንጭ ጽሑፉ ንባብ በዋናው ትርጉም ተጠብቆ፣ በብዙ የእጅ ጽሑፎች የሚገኘው አጭር ንባብ በግርጌ ማስታወሻ ተገልጧል።
