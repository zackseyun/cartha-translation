  text: καὶ ἰδοὺ τὸ καταπέτασμα τοῦ ναοῦ ἐσχίσθη ⸂ἀπ’ ἄνωθεν ἕως κάτω εἰς δύο⸃, καὶ ἡ γῆ ἐσείσθη, καὶ αἱ πέτραι ἐσχίσθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/051.yaml
  text: And behold[a], the curtain of the temple was torn in two from top to bottom, and the earth shook, and the rocks were split.
translation:
  language: am
  text: እነሆ፣ የመቅደሱ መጋረጃ[a] ከላይ እስከ ታች ለሁለት ተቀደደ፤ ምድርም ተናወጠች፣ ዓለቶችም ተሰነጠቁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የውስጠኛው መቅደስ መጋረጃ»። የግሪኩ καταπέτασμα የቤተ መቅደሱን ውስጣዊ መጋረጃ ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: ድንገተኛውን ክስተት በክብደት ለማስተዋወቅና የአንባቢውን ትኩረት ለመሳብ የግሪኩን የንግግር ምልክት በተፈጥሯዊው «እነሆ» ተርጉሟል።
- source_word: καταπέτασμα τοῦ ναοῦ
  choice: የመቅደሱ መጋረጃ
  rationale: καταπέτασμα ተንጠልጣይ መጋረጃን ያመለክታል፤ ναός ደግሞ እዚህ በተለይ የቤተ መቅደሱን ውስጣዊ መቅደስ ሊያመለክት ስለሚችል «የመቅደሱ መጋረጃ» ግልጽና ተፈጥሯዊ ነው።
- source_word: ἐσχίσθη
  choice: ተቀደደ
  rationale: ለጨርቅ ተፈጥሯዊ የሆነውን ግስ በመጠቀም የግሪኩን ተደራጊ አቀራረብ ይጠብቃል፤ ድርጊቱን ያደረገውንም በግልጽ አይጨምርም።
- source_word: ἀπ’ ἄνωθεν ἕως κάτω εἰς δύο
  choice: ከላይ እስከ ታች ለሁለት
  rationale: የመቀደዱን አቅጣጫና ውጤት በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: ἡ γῆ ἐσείσθη
  choice: ምድርም ተናወጠች
  rationale: γῆ ምድር፣ መሬት ወይም አገር ሊሆን ቢችልም፣ በእነዚህ ከሞቱ ጋር ተያይዘው በተገለጹ ታላላቅ ምልክቶች አውድ «ምድር» ሰፊውን ትርጉም ይጠብቃል።
- source_word: αἱ πέτραι ἐσχίσθησαν
  choice: ዓለቶችም ተሰነጠቁ
  rationale: πέτραι ትላልቅ ዓለታማ ነገሮችን ያመለክታል፤ «ተሰነጠቁ» ደግሞ ለዓለት ተፈጥሯዊ ሲሆን ከመጋረጃው መቀደድ ጋር ያለውን የσχίζω የቃል ግንኙነት በትርጉም ደረጃ ይጠብቃል።
theological_decisions:
- issue: የመቅደሱ መጋረጃ መቀደድ ትርጉም
  choice: ክስተቱን ታሪካዊ ዘገባ እንደሆነ ብቻ መተርጎም፣ ምልክታዊ ትርጓሜ አለመጨመር
  alternative: ወደ እግዚአብሔር መቅረብን ወይም በቤተ መቅደሱ ሥርዓት ላይ ፍርድን በግልጽ መግለጽ
  rationale: ቁጥሩ ክስተቱንና ተጓዳኝ ምልክቶቹን ይዘግባል እንጂ ሥነ መለኮታዊ ትርጉማቸውን አይተነትንም፤ ስለዚህ ትርጉሙ የጽሑፉን ውጥረትና ክፍትነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው የትረካ አገላለጽ ተጠቅሟል። የግሪኩ ተከታታይ καὶ በአማርኛ «-ም» እና በሥርዓተ ነጥብ ተወክሎ የክስተቶቹን ፈጣን ቅደም ተከተል ይጠብቃል።
