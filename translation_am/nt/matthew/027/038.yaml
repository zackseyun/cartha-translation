id: MAT.27.38
reference: Matthew 27:38
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Τότε σταυροῦνται σὺν αὐτῷ δύο λῃσταί, εἷς ἐκ δεξιῶν καὶ εἷς ἐξ εὐωνύμων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/038.yaml
  text: Then two robbers are crucified with him[a], one on the right and one on the left.
translation:
  language: am
  text: ከዚያም ሁለት ወንበዴዎች[a] ከእርሱ ጋር ተሰቀሉ፤ አንዱ በቀኙ በኩል፣ አንዱም በግራው በኩል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ሽፍቶች»። የግሪኩ ቃል በኃይል የሚዘርፉ ወንበዴዎችን ሊያመለክት ይችላል፤ በአንዳንድ አውዶችም ከዓመፅ እንቅስቃሴ ጋር ሊዛመድ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: ከዚያም
  rationale: የትረካውን ቀጣይ ክስተት በተፈጥሯዊ ዘመናዊ አማርኛ ያመለክታል።
- source_word: σταυροῦνται
  choice: ሰቀሉ
  rationale: በግሪክ ያለው ትረካዊ የአሁን ጊዜ ቅርጽና ተደራጊ ድምፅ በአማርኛ ቃል በቃል ቢቀርብ ከባድ ይሆናል፤ የተደራጊዎቹን በ«-ን» ምልክት በግልጽ በማሳየት «ሰቀሉ» የትረካውን ተፈጥሯዊነት ይጠብቃል። በዚህ የስቅለት አውድ ቃሉ በመስቀል ላይ መስቀልን ያመለክታል።
- source_word: σὺν αὐτῷ
  choice: ከእርሱ ጋር
  rationale: σύν የሚያመለክተውን አብሮነት በቀጥታና በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: δύο λῃσταί
  choice: ሁለት ወንበዴዎችን
  rationale: λῃστής በኃይል የሚዘርፍ ወንበዴን ወይም ሽፍታን ሊያመለክት ይችላል፤ «ወንበዴ» ሳያጠብ ዋናውን ትርጉም በግልጽ ያቀርባል።
- source_word: εἷς ἐκ δεξιῶν καὶ εἷς ἐξ εὐωνύμων
  choice: አንዱን በቀኙ አንዱንም በግራው
  rationale: የቦታውን ንጽጽር በተፈጥሯዊ አማርኛ ይገልጻል፤ የ«እርሱ» ባለቤትነት በቅጥያዎቹ ተገልጧል።
theological_decisions:
- issue: የλῃσταί ማንነት
  choice: ወንበዴዎች
  alternative: ሽፍቶች፤ ዓመፀኞች
  rationale: ቃሉ ኃይል ተጠቅመው የሚዘርፉ ወንበዴዎችን ሊጠቁም ይችላል፤ በአንዳንድ አውዶች ከፖለቲካዊ ዓመፅ ጋርም ሊያያዝ ይችላል። ሆኖም ይህ ቁጥር ብቻውን የፖለቲካ ማንነት ስለማይወስን «ዓመፀኞች» ብሎ ማጥበብ ተቀርቷል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራው አንባቢ ግልጽ የሆነ የትረካ ቋንቋ ተጠቅሟል። የግሪኩን ተደራጊ አወቃቀር በግድ ከመኮረጅ ይልቅ በአማርኛ ተፈጥሯዊ የሆነ ንቁ አወቃቀር ተመርጧል፤ ያልተገለጸው ፈጻሚ ግን አልተሰየመም።
