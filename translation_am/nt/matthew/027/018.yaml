lexical_decisions:
- source_word: ᾔδει
  choice: ያውቅ ነበር
  rationale: የጲላጦስን ቀድሞ የነበረ እውቀት በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: γὰρ
  choice: ምክንያቱም
  rationale: ከቀደመው ንግግር ጋር ያለውን ማብራሪያዊ ምክንያታዊ ግንኙነት ግልጽ ያደርጋል።
- source_word: ὅτι
  choice: እንደ-
  rationale: ጲላጦስ ያወቀውን የነገር ይዘት የሚያስገባ ተፈጥሯዊ የአማርኛ አወቃቀር ነው።
- source_word: διὰ φθόνον
  choice: በቅናት
  rationale: διά ከተሳቢ ጋር የሚገልጸውን ምክንያትና φθόνος የሚያመለክተውን በሌላው ስፍራ ወይም ስኬት የተነሣ ቅናት በአጭርና ተፈጥሯዊ መንገድ ያስተላልፋል።
- source_word: παρέδωκαν
  choice: አስረከቡት
  rationale: ኢየሱስን ለጲላጦስ አሳልፎ የመስጠትን ድርጊት ይገልጻል፤ ‘ከዱት’ የሚለውን ጠባብ ትርጉም አያስገባም።
- source_word: αὐτόν
  choice: -ት
  rationale: በ‘አስረከቡት’ ውስጥ ያለው የተሳቢ ቅጥያ ኢየሱስን ያመለክታል።
theological_decisions:
- issue: የኢየሱስ ከሳሾች የድርጊት ምክንያት
  choice: ጲላጦስ ኢየሱስን ያስረከቡት በቅናት እንደሆነ ያውቅ ነበር።
  alternative: ‘በምቀኝነት’ ወይም ‘ከቅናት የተነሣ’ ብሎ መተርጎም።
  rationale: ጽሑፉ φθόνοςን እንደ ምክንያታቸው ይጠቅሳል፤ ‘ቅናት’ ይህን ሥነ ምግባራዊና ስነ ልቦናዊ ኃይል ያለ ተጨማሪ የነገረ መለኮት ማብራሪያ ይጠብቃል።
