reference: Matthew 27:66
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οἱ δὲ πορευθέντες ἠσφαλίσαντο τὸν τάφον σφραγίσαντες τὸν λίθον μετὰ τῆς κουστωδίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/066.yaml
  text: So they went and secured the tomb by sealing the stone with the guard.
translation:
  language: am
  text: እነርሱም ሄደው፣ ድንጋዩን ከጥበቃ ቡድኑ ጋር በማተም መቃብሩን አስተማማኝ አደረጉ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከጠባቂዎቹ ጋር”፤ እንዲሁም “ድንጋዩን አትመው ጠባቂ በማቆም” ተብሎ ሊተረጎም ይችላል። የግሪኩ አገላለጽ አጭር ስለሆነ፣ የጥበቃ ቡድኑ ከማተሙ ጋር አብሮ መሆኑን እንጂ የተለየ ሁለተኛ ድርጊትን ላያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ πορευθέντες
  choice: እነርሱም ሄደው
  rationale: የትረካውን ቀጣይነት በተፈጥሯዊ አማርኛ ያሳያል፤ የግሪኩን ተሳቢ ግስም ከዋናው ድርጊት ጋር ያያይዛል።
- source_word: ἠσφαλίσαντο
  choice: አስተማማኝ አደረጉ
  rationale: መቃብሩን እንዳይነካ ወይም እንዳይደፈር የደኅንነት እርምጃ መውሰዳቸውን ያሳያል፤ ‘ጠባቂ አቆሙ’ የሚል በግሪኩ በግልጽ ያልተነገረ ድርጊት አይጨምርም።
- source_word: τὸν τάφον
  choice: መቃብሩን
  rationale: በዚህ አውድ የኢየሱስን የቀብር ስፍራ የሚያመለክት ግልጽና የተለመደ ቃል ነው።
- source_word: σφραγίσαντες
  choice: በማኅተም በማተም
  rationale: ድንጋዩ ላይ ማኅተም ማድረግ መቃብሩን አስተማማኝ ያደረጉበት መንገድ መሆኑን ያሳያል።
- source_word: τὸν λίθον
  choice: ድንጋዩን
  rationale: ግሪኩ የመቃብሩን ድንጋይ ብቻ ይጠቅሳል፤ ‘የመግቢያው’ የሚል ማብራሪያ አልተጨመረም።
- source_word: μετὰ τῆς κουστωδίας
  choice: ከጠባቂዎቹ ጋር
  rationale: μετά ከዝርያ አመልካች ጋር ያለውን የአብሮነት ፍቺ በቀጥታ ያቀርባል፤ ጠባቂዎቹ ሮማውያን ወይም የቤተ መቅደስ ጠባቂዎች መሆናቸውን አይወስንም።
theological_decisions:
- issue: μετὰ τῆς κουστωδίας መቃብሩን ከማስጠበቅ ጋር ያለው ግንኙነት
  choice: ማኅተሙ የተደረገው ጠባቂዎቹ አብረው ሳሉ ወይም በድርጊቱ ተካፋይ ሆነው ነበር።
  alternative: ድንጋዩን አትመው በተጨማሪ ጠባቂዎችን አቆሙ።
  rationale: የግሪኩ ሐረግ አጭርና አሻሚ ነው። ‘ከጠባቂዎቹ ጋር’ የሚለው ትርጉም አብሮነቱን ይጠብቃል፤ ጠባቂ ማቆምን እንደ ሁለተኛ ግልጽ ድርጊት አድርጎ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘አስተማማኝ አደረጉ’ የሚለው አገላለጽ የደኅንነት እርምጃውን ያሳያል፤ የጠባቂዎቹን ትክክለኛ ሚና ግን ከግሪኩ በላይ አይወስንም።
