review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly represents the attendant participle πορευθέντες, the securing of the tomb, the stone, and the accompanying guard detail. However, «በማኅተም በማተም» is redundant and not idiomatic: ማተም already means “to seal.” Rendering κουστωδία as the singular collective «የጥበቃ ቡድኑ» better reflects the Greek while leaving its identity and exact role unspecified.'
  naturalness: The revised wording is clear, modern standard Amharic. It retains a dignified biblical register without importing a separate, explicit action of posting guards.
  terminology: «መቃብር», «ድንጋይ», and «ማተም» are suitable established terms. «የጥበቃ ቡድን» accurately conveys the Latin loanword κουστωδία as a guard detail rather than requiring a claim that the personnel were Roman or temple guards.
  issues:
  - severity: medium
    issue: Redundant sealing expression
    rationale: «በማኅተም በማተም» literally duplicates the idea of sealing and is less natural than «በማተም».
  - severity: low
    issue: Guard rendered as a plural individual noun
    rationale: «ከጠባቂዎቹ ጋር» is possible, but κουστωδία is singular and denotes a guard detail; «ከጥበቃ ቡድኑ ጋር» more closely reflects this collective sense.
  - severity: low
    issue: Second footnote is not a meaningful alternative in Amharic
    rationale: It substantially repeats the main rendering, differing chiefly in word order, and does not assist the reader.
  revised_text: እነርሱም ሄደው፣ ድንጋዩን ከጥበቃ ቡድኑ ጋር በማተም መቃብሩን አስተማማኝ አደረጉ።[a]
