  text: καὶ εὐθέως δραμὼν εἷς ἐξ αὐτῶν καὶ λαβὼν σπόγγον πλήσας τε ὄξους καὶ περιθεὶς καλάμῳ ἐπότιζεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/048.yaml
  text: And immediately one of them ran[a], took a sponge, filled it with sour wine, put it on a reed[b], and gave him a drink.
translation:
  language: am
  text: ወዲያውም ከእነርሱ አንዱ ሮጠ፤ ስፖንጅ ወስዶ በኮምጣጣ ወይን ጠጅ[a] ሞልቶ፣ በሸምበቆ ላይ አድርጎ፣ እያጠጣው ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “በወይን ኮምጣጤ።” የግሪኩ ὄξος ኮምጣጣ ወይን ጠጅን ወይም የወይን ኮምጣጤን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: ወዲያውም
  rationale: የድርጊቱን ፈጣንነት በተፈጥሯዊና በዘመናዊ አማርኛ ያስተላልፋል።
- source_word: δραμὼν
  choice: ሮጦ ሄደ
  rationale: የግሪኩን የቀደመ ተግባር በተፈጥሯዊ የአማርኛ ተከታታይ ግስ ይገልጣል።
- source_word: εἷς ἐξ αὐτῶν
  choice: ከእነርሱ አንዱ
  rationale: ከቡድኑ አንድ ሰው መሆኑን የሚያሳይ ቀጥተኛና ተፈጥሯዊ አተረጓጎም ነው።
- source_word: λαβὼν σπόγγον
  choice: ስፖንጅ ወስዶ
  rationale: ዕቃውንና የድርጊቱን ቅደም ተከተል በግልጽ ሁኔታ ይጠብቃል።
- source_word: πλήσας τε ὄξους
  choice: በኮምጣጣ ወይን ጠጅ ሞላው
  rationale: ὄξος ለመጠጥ የሚያገለግል የኮመጠጠ ወይን ጠጅን ወይም የወይን ኮምጣጤን ሊያመለክት ስለሚችል፣ ዋናው ጽሑፍ እንደ መጠጥ ያለውን ትርጉም ያቀርባል።
- source_word: περιθεὶς καλάμῳ
  choice: በሸምበቆም ላይ አድርጎ
  rationale: σπόγγον በκαλάμῳ ላይ ማድረጉን በቀጥታ ይገልጣል፤ ‘ሸምበቆ’ የቃሉ ተቀራራቢ የአማርኛ አቻ ነው።
- source_word: ἐπότιζεν αὐτόν
  choice: ኢየሱስን አጠጣው
  rationale: ποτίζω ሌላውን እንዲጠጣ ማድረግን ይገልጣል። ተውላጠ ስሙ በአማርኛ አሻሚ እንዳይሆን ‘ኢየሱስን’ ተብሎ ተገልጿል፤ ኢምፐርፌክቱም በዚህ ትረካዊ አውድ የተራዘመ ወይም የተሞከረ ድርጊት ሊያመለክት ቢችልም ቀላል ያለፈ ድርጊት በአማርኛ ተፈጥሯዊ ነው።
theological_decisions:
- issue: ለኢየሱስ የቀረበው መጠጥ ምንነት
  choice: ኮምጣጣ ወይን ጠጅ
  alternative: የወይን ኮምጣጤ
  rationale: ὄξος ሁለቱንም ሊያመለክት ይችላል። ‘ኮምጣጣ ወይን ጠጅ’ በዚህ አውድ የሚጠጣ ፈሳሽ መሆኑን ግልጽ ሲያደርግ፣ ሌላውን የቃላት አማራጭ በማስታወሻ ይጠብቃል።
- issue: የἐπότιζεν ኢምፐርፌክት ገጽታ
  choice: አጠጣው
  alternative: ሊያጠጣው ይሞክር ነበር / ያጠጣው ነበር
  rationale: ግሪኩ ቀጣይነትን ወይም ሙከራን ሊያመለክት ቢችልም፣ አውዱ ያንን በግድ አይወስንም። ቀላሉ የአማርኛ ትረካዊ ግስ ድርጊቱን ሳይጨምር ያቀርባል።
