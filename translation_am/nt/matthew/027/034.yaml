  text: ἔδωκαν αὐτῷ πιεῖν ⸀οἶνον μετὰ χολῆς μεμιγμένον· καὶ γευσάμενος οὐκ ⸀ἠθέλησεν πιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/034.yaml
  text: They gave him wine mixed with gall to drink[a], but after tasting it, he was unwilling to drink.
translation:
  language: am
  text: በሐሞት የተቀላቀለ የወይን ጠጅ እንዲጠጣ ሰጡት፤[a] እርሱ ግን ቀምሶ ሊጠጣው አልፈለገም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: χոլή የሚለው የግሪክ ቃል “ሐሞት” ወይም በሰፊ ትርጉም “መራራ ነገር” ማለት ሊሆን ይችላል። ትርጉሙ የማቴዎስን አገላለጽ ለማንጸባረቅ “ሐሞት” የሚለውን ጠብቋል፤ ከርቤ የሚጠቅሰውን ተመሳሳይ የሕማማት ትርክት በማርቆስ 15፥23 ያነጻጽሩ።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκαν αὐτῷ πιεῖν
  choice: እንዲጠጣ ሰጡት
  rationale: የግሪኩን ‘እንዲጠጣ ሰጡት’ የሚለውን ቀጥተኛ ትርጉም በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: οἶνον
  choice: የወይን ጠጅ
  rationale: ቃሉ በግልጽ ወይንን ያመለክታል፤ አጠቃላይ ‘መጠጥ’ ብሎ ማስፋት አያስፈልግም።
- source_word: μετὰ χολῆς μεμιγμένον
  choice: በሐሞት የተቀላቀለ
  rationale: μεμιγμένον የመቀላቀልን ሐሳብ ይገልጣል፤ χολή በቀጥታ ‘ሐሞት’ ሊሆን ቢችልም መራራ ነገርንም በሰፊው ሊያመለክት ስለሚችል ይህ አሻሚነት በማስታወሻ ተጠብቋል።
- source_word: καὶ γευσάμενος
  choice: እርሱ ግን ቀምሶ
  rationale: γευσάμενος ‘ቀምሶ’ የሚለውን ቀዳሚ ድርጊት ይገልጣል፤ ግን የሚቀጥለውን አለመፈለግ ያለውን ትርክታዊ ንፅፅር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οὐκ ἠθέλησεν πιεῖν
  choice: ሊጠጣው አልፈለገም
  rationale: θέλω የፈቃድን ወይም የፍላጎትን ሐሳብ ይይዛል፤ ‘እምቢ አለ’ ከሚለው የበለጠ ቃሉን በቅርብ ይከተላል።
