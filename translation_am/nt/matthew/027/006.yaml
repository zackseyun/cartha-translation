- issue: τιμὴ αἵματός የሚለውን አገላለጽ ቃል በቃል ወይስ ፈሊጣዊ አድርጎ መተርጎም
  choice: የደም ዋጋ
  alternative: የነፍስ ማጥፋት ክፍያ
