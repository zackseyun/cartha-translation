    text: በግሪክኛ “ቆርባን”፤ የቤተ መቅደሱን ግምጃ ቤት ወይም ቅዱስ ገንዘብ ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም “የደም ገንዘብ።”
