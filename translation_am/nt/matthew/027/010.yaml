  text: ገንዘቡን—የብሩን ሳንቲሞች—ለየሸክላ ሠሪው እርሻ ሰጡ፤ ጌታም እንዳዘዘኝ[a] ነበር።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “አዘዘኝ” የሚለው “መራኝ”፣ “መመሪያ ሰጠኝ” ወይም “ትእዛዝ ሰጠኝ” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ማቴዎስ በዚህ ነቢያዊ ጥቅስ ወይም ፍንጭ ውስጥ ያለውን “እኔ” የሚለውን የመጀመሪያ መደብ አነጋገር ከትረካው ዐውድ ጋር ለማስማማት ሳይለውጥ ጠብቆታል።
