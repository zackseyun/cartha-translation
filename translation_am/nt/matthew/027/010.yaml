  rationale: የδίδωμι ቀጥተኛ ትርጉም ‘ሰጡ’ ነው፤ ዐውዱ ገንዘቡን ለእርሻው መዋሉን ያሳያል።
- source_word: αὐτὰ
  choice: ገንዘቡን
  rationale: ግሪኩ ገለልተኛ ብዙ ቁጥር ተውላጠ ስም ሲሆን በዐውዱ ወደ ብር ሳንቲሞቹ ይመለሳል። በአማርኛ ‘ገንዘቡን’ ማለት ተፈጥሯዊ ሲሆን ማጣቀሻውንም ግልጽ ያደርጋል።
- source_word: εἰς τὸν ἀγρὸν
  choice: ለ…እርሻ
  rationale: εἰς በመሠረቱ ‘ወደ/ውስጥ’ ሊል ቢችልም፣ ከ‘ሰጡ’ ጋር በዚህ የግዢና የአጠቃቀም ዐውድ ‘ለእርሻው’ የሚለው ትርጉም ተፈጥሯዊና ትክክለኛ ነው።
- source_word: τοῦ κεραμέως
