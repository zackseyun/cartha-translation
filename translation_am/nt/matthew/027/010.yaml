theological_decisions:
- issue: በጥቅሱ/በጥቅስ ፍንጭው ውስጥ የተናጋሪው ማጣቀሻ
  choice: የግሪኩን የመጀመሪያ መደብ ‘እኔ’ ማጣቀሻ በ‘አዘዘኝ’ ውስጥ መጠበቅ
