  rationale: ግሪኩ μοι (‘ለእኔ/እኔን’) ይላል። ይህን ወደ ሌላ መደብ መለወጥ በማቴዎስ የጥቅስ አጠቃቀም ያለውን እውነተኛ ውጥረት በትርጉም ውስጥ ያለሰልሳል።
