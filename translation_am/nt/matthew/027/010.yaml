- source_word: μοι
  choice: -ኝ
  rationale: የመጀመሪያ መደብ ነጠላ ‘ለእኔ/እኔን’ ማጣቀሻውን በግሱ ውስጥ ጠብቆ ያቀርባል።
- source_word: κύριος
