  text: በራሱ በላይ፣ “ይህ ኢየሱስ፣ የአይሁድ ንጉሥ ነው” ተብሎ የተጻፈውን በእርሱ ላይ የቀረበውን ክስ[a] አኖሩ።
  philosophy: optimal-equivalence
  footnotes:
