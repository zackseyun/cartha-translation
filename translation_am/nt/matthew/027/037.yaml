- source_word: Ἰουδαίων
  choice: አይሁድ
  rationale: በሕማማት ታሪኩ የክስ ሰሌዳ ላይ ያለውን የተለመደ ሕዝባዊ ማመልከቻ ያስተላልፋል፤ የክልል ትርጉሙ በማስታወሻ ተጠብቋል።
