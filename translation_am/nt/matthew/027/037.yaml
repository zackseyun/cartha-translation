    text: ወይም፣ “በእርሱ ላይ የቀረበውን ውንጀላ።” የግሪኩ ቃል αἰτία በዚህ ስፍራ ሕጋዊ ትርጉም አለው።
    reason: lexical_alternative
lexical_decisions:
