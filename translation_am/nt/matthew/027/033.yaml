  yaml_path: translation/nt/matthew/027/033.yaml
  text: And when they came to a place called Golgotha (which means Place of a Skull),[a]
translation:
  language: am
  text: እነርሱም ጎልጎታ ወደሚባል ስፍራ ሲደርሱ፣ ይህም “የራስ ቅል ስፍራ” ማለት ነው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም በቃል ቅርብ፣ “የራስ ቅል ስፍራ የሚባል ነው።” የግሪኩ አገላለጽ ጎልጎታ የሚለውን ስም ያብራራል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: መጡ
  rationale: የግሪኩ የአኦሪስት አንቀጽ በትረካው ውስጥ የጊዜ ቅደም ተከተልን ያሳያል፤ በአማርኛ ቀጥተኛው «መጡ» ተፈጥሯዊና ግልጽ ነው።
- source_word: τόπον
  choice: ስፍራ
  rationale: τόπος በዚህ አውድ «ስፍራ» ማለት ነው፤ ቃሉ ክብር ያለውና ለዘመናዊ አንባቢ የሚገባ ነው።
- source_word: λεγόμενον
  choice: ወደሚባል
  rationale: በስም መጠራቱን በተፈጥሯዊ አማርኛ ይገልጣል፤ ከእንቅስቃሴ ግስ ጋርም «ወደሚባል ስፍራ» የተለመደ አገባብ ነው።
- source_word: Γολγοθᾶ
  choice: ጎልጎታ
  rationale: የቦታው ስም ትርጉም ሳይሰጠው በድምፅ ቀርቧል፤ ትርጉሙ በቀጣዩ ሐረግ ይብራራል።
- source_word: ὅ ἐστιν
  choice: ይህም … ማለት ነው
  rationale: ይህ ቀመር የጎልጎታን ስም ትርጉም የሚያብራራ መሆኑን በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Κρανίου Τόπος
  choice: የራስ ቅል ስፍራ
  rationale: κρανίον «የራስ ቅል» እና τόπος «ስፍራ» ተብለው ተተርጉመዋል። የግሪኩን የባለቤትነት ግንኙነት ሳይጨምር ወይም ሳያጠብ ያቀርባል።
- source_word: λεγόμενος
  choice: ማለት ነው
  rationale: በግሪኩ የተደገመው «የሚባል» የስሙን ማብራሪያ ያጠናክራል፤ በአማርኛ ግን «ይህም … ማለት ነው» ተመሳሳይ ኃይልን ያለ አላስፈላጊ ድግግሞሽ ይገልጣል።
