id: MAT.27.21
reference: Matthew 27:21
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ ἡγεμὼν εἶπεν αὐτοῖς· Τίνα θέλετε ἀπὸ τῶν δύο ἀπολύσω ὑμῖν; οἱ δὲ εἶπαν· ⸀Τὸν Βαραββᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/021.yaml
  text: But the governor answered them, “Which of the two do you want me to release for you?” And they said, “Barabbas.”
translation:
  language: am
  text: ገዢውም መልሶ፣ “ከሁለቱ ማንኛውን እንድፈታላችሁ ትፈልጋላችሁ?” አላቸው። እነርሱም፣ “በርባንን” አሉ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: መልሶ
  rationale: የተሳቢ ቅርጽ ያለው ἀποκριθεὶς በዚህ ስፍራ ንቁ ትርጉም ያለው የመልስ አገላለጽ ነው፤ δέ ደግሞ በ«ገዢውም» ውስጥ በተፈጥሯዊ የትረካ ቅንጣት ተወክሏል።
- source_word: ὁ ἡγεμὼν
  choice: ገዢው
  rationale: በዐውዱ የሮማውን የክፍለ ሀገር ገዢ ያመለክታል፤ «ገዢ» ትክክለኛና ለዘመናዊ አንባቢ ግልጽ ነው።
- source_word: εἶπεν αὐτοῖς
  choice: አላቸው
  rationale: ቃል በቃል «ለእነርሱ አለ» ማለት ሲሆን፣ ከ«መልሶ» ጋር የግሪኩን ተሳቢና ዋና ግስ አወቃቀር ያለ አላስፈላጊ ድግግሞሽ ይጠብቃል።
- source_word: Τίνα … ἀπὸ τῶν δύο
  choice: ከሁለቱ ማንኛውን
  rationale: ጥያቄው ቀድሞ ከቀረቡት ሁለት ሰዎች አንዱን ስለመምረጥ ነው፤ ይህ አገላለጽ የክፍል ምርጫውን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: θέλετε
  choice: ትፈልጋላችሁ
  rationale: θέλω በዚህ ዐውድ ፍላጎትን ወይም ምርጫን ይገልጣል፤ «ትፈልጋላችሁ» ቀጥተኛና ዘመናዊ ነው።
- source_word: ἀπολύσω ὑμῖν
  choice: እንድፈታላችሁ
  rationale: ἀπολύω በፍርድ ዐውድ «ከእስር መልቀቅ» ማለት ነው፤ የመጀመሪያ መደብ ንዑስ አድራጊውና ὑμῖν በተፈጥሯዊው «እንድፈታላችሁ» ተወክለዋል።
- source_word: οἱ δὲ εἶπαν
  choice: እነርሱም … አሉ
  rationale: የሕዝቡን ምላሽ በቀላል የትረካ ቀጣይነት ያቀርባል፤ δέ በ«-ም» ተወክሏል።
- source_word: Τὸν Βαραββᾶν
  choice: በርባንን
  rationale: የግሪኩ የግል ስም በተለመደው የአማርኛ መጽሐፍ ቅዱስ አጻጻፍ «በርባን» ተጽፎ፣ የተሳቢ ምልክት «-ን» ተጨምሮበታል።
