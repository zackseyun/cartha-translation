base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/056.yaml
  text: among whom were Mary Magdalene[a], and Mary the mother of James and Joseph, and the mother of the sons of Zebedee.
translation:
  language: am
  text: ከእነርሱም መካከል መግደላዊት ማርያም፣ የያዕቆብና የዮሴፍ[a] እናት ማርያም፣ እንዲሁም የዘብዴዎስ ልጆች እናት ነበሩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎችና ንባቦች “ዮሴፍ” በሚለው ፈንታ “ዮሴስ” ይላሉ።
    reason: textual_variant
lexical_decisions:
- source_word: ἐν αἷς
  choice: ከእነርሱም መካከል
  rationale: አንጻራዊው ተውላጠ ስም በቀደመው ቁጥር የተጠቀሱትን ሴቶች ይመለከታል፤ ይህ አተረጓጎም በዚያ ቡድን ውስጥ መካተታቸውን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: መግደላዊት ማርያም
  rationale: በአማርኛ የመግደላ ከተማ ተወላጅነቷን ወይም ዝምድናዋን የሚገልጠው የተለመደውና ግልጽ የስም አጠራር ነው።
- source_word: Μαρία ἡ τοῦ Ἰακώβου καὶ Ἰωσὴφ μήτηρ
  choice: የያዕቆብና የዮሴፍ እናት ማርያም
  rationale: የግሪኩን የዝምድና መግለጫ ግልጽ አድርጎ ያቀርባል፤ ያዕቆብና ዮሴፍ በአማርኛ የመጽሐፍ ቅዱስ አጠራር የተለመዱ ቅርጾች ናቸው።
- source_word: ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου
  choice: የዘብዴዎስ ልጆች እናት
  rationale: የዘብዴዎስ ልጆች መሆናቸውንና ሴቲቱ እናታቸው መሆኗን የግሪኩን የባለቤትነት ግንኙነት በግልጽና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἦν
  choice: ነበሩ
  rationale: በግሪክ ነጠላ ቅርጽ ቢሆንም ተከታዩን የብዙ ሴቶች ዝርዝር በህልውናዊ አገባብ ያስተዋውቃል፤ በአማርኛ የብዙ ቁጥር ግስ ተፈጥሯዊ ነው።
