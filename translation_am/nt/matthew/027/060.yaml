review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the core actions accurately: Joseph placed Jesus’ body in his own new rock-hewn tomb, rolled a large stone to its entrance, and departed. The placement phrase «በመቃብሩ መግቢያ ላይ» is somewhat less precise for the Greek dative with προσκυλίσας, which depicts rolling the stone to/against the entrance.'
  naturalness: The first sentence is understandable, but «አስከሬኑን … አኖረው» unnecessarily combines an explicit object with an object suffix. Removing the suffix gives a smoother standard-Amharic narrative. «አንከባልሎ» is the more natural conjunctive form for this action.
  terminology: «አስከሬን», «መቃብር», «ዓለት», and «መግቢያ» are suitable modern-standard terms. «መግቢያ» appropriately renders θύρα in the setting of a rock-cut tomb without implying a modern hinged door.
  issues:
  - severity: low
    issue: Redundant object marking in «አስከሬኑን … አኖረው».
    rationale: The explicit accusative object already identifies what Joseph placed; «አኖረ» is cleaner and more idiomatic in formal modern Amharic.
  - severity: low
    issue: The stone is said to be rolled «በ… ላይ» (at/on) the entrance.
    rationale: «ወደ መግቢያው» more directly represents προσκυλίσας with the dative, namely rolling the stone to/against the entrance.
  - severity: low
    issue: Conjunctive form «አንከባሎ».
    rationale: «አንከባልሎ» is the standard, more natural form in this narrative construction.
  revised_text: አስከሬኑንም በዓለት ውስጥ በፈለፈለው በራሱ አዲስ መቃብር ውስጥ አኖረ። ትልቅ ድንጋይም ወደ መቃብሩ መግቢያ አንከባልሎ ሄደ።
  revised_footnotes: []
  revision_rationale: 'The revision retains all source-level content and the dignified modern register while removing redundant object agreement, making the direction of the rolling action more faithful to the Greek, and regularizing the Amharic conjunctive verb form. No footnote is needed: «መግቢያ» is a clear contextual rendering of θύρα, and the source’s door/entrance nuance is adequately retained without introducing an unnecessary alternative.'
