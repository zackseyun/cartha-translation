id: MAT.27.60
reference: Matthew 27:60
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἔθηκεν αὐτὸ ἐν τῷ καινῷ αὐτοῦ μνημείῳ ὃ ἐλατόμησεν ἐν τῇ πέτρᾳ, καὶ προσκυλίσας λίθον μέγαν τῇ θύρᾳ τοῦ μνημείου ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/060.yaml
  text: and placed it in his own new tomb[a], which he had cut into the rock. And after rolling a large stone to the entrance of the tomb, he went away.
translation:
  language: am
  text: አስከሬኑንም በዓለት ውስጥ በፈለፈለው በራሱ አዲስ መቃብር ውስጥ አኖረ። ትልቅ ድንጋይም ወደ መቃብሩ መግቢያ አንከባልሎ ሄደ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθηκεν αὐτό
  choice: አስከሬኑንም … አኖረው
  rationale: τίθημι በዚህ የቀብር አውድ ‘ማኖር’ ማለት ነው። የግሪኩ ገለልተኛ ተውላጠ ስም የኢየሱስን አስከሬን ስለሚያመለክት፣ በአማርኛ ግልጽና ተፈጥሯዊ እንዲሆን ‘አስከሬኑን’ ተብሏል።
- source_word: ἐν τῷ καινῷ αὐτοῦ μνημείῳ
  choice: በራሱ አዲስ መቃብር ውስጥ
  rationale: μνημεῖον በዚህ አውድ በዓለት የተፈለፈለ የቀብር ስፍራ ነው፤ ‘መቃብር’ በዘመናዊ አማርኛ የተለመደና ግልጽ ነው። καινός በቀጥታ ‘አዲስ’ ተብሏል፤ ‘ያልተጠቀሙበት’ የሚለው ትርጉም በጽሑፉ በግልጽ ስላልተነገረ አልተጨመረም። αὐτοῦ የዮሴፍን ባለቤትነት ለማሳየት ‘በራሱ’ ተብሏል።
- source_word: ὃ ἐλατόμησεν ἐν τῇ πέτρᾳ
  choice: በዓለት ውስጥ በፈለፈለው
  rationale: λατομέω ዓለትን በመቁረጥና በመቦርቦር ስፍራ ማዘጋጀትን ያመለክታል፤ ‘ፈለፈለ’ ለዓለት መቃብር ተፈጥሯዊና ትክክለኛ ነው።
- source_word: προσκυλίσας λίθον μέγαν
  choice: ትልቅ ድንጋይ አንከባሎ
  rationale: የአኦሪስት አንቀጽ ድርጊቱ ከመሄዱ በፊት እንደተፈጸመ ያሳያል። ‘አንከባሎ’ የማንከባለልን ድርጊት በአጭርና ተፈጥሯዊ መንገድ ይገልጣል።
- source_word: τῇ θύρᾳ τοῦ μνημείου
  choice: በመቃብሩ መግቢያ ላይ
  rationale: θύρα ‘በር’ ወይም ‘መግቢያ’ ሊሆን ይችላል። በዓለት ለተፈለፈለ መቃብር ‘መግቢያ’ የታጠፈ ዘመናዊ በር እንዳለ ሳያስመስል አውዱን ግልጽ ያደርጋል።
- source_word: ἀπῆλθεν
  choice: ሄደ
  rationale: ἀπέρχομαι በዚህ ስፍራ በቀላሉ ከቦታው መሄድን ያመለክታል፤ ‘ሄደ’ ተፈጥሯዊ የትረካ አገላለጽ ነው።
theological_decisions: []
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ የትረካ ቋንቋ ተጠቅሟል። የግሪኩ ሁለት ዋና ግሶችና ቀዳሚ ድርጊት በሁለት አጭር ዓረፍተ ነገሮች ተደራጅተዋል። በቀረበው የእንግሊዝኛ ማስታወሻ ምልክት [a] ከ‘tomb’ በኋላ ቢታይም ማስታወሻው በእውነቱ θύρα (‘በር/መግቢያ’) ላይ ነው፤ በአማርኛ ‘መግቢያ’ ግልጽ ስለሆነ ማስታወሻ አልተጨመረም።
