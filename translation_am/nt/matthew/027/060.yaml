revisions:
- from: አስከሬኑንም በዓለት ውስጥ በፈለፈለው በራሱ አዲስ መቃብር ውስጥ አኖረው። በመቃብሩም መግቢያ ላይ ትልቅ ድንጋይ አንከባሎ ሄደ።
  to: አስከሬኑንም በዓለት ውስጥ በፈለፈለው በራሱ አዲስ መቃብር ውስጥ አኖረ። ትልቅ ድንጋይም ወደ መቃብሩ መግቢያ አንከባልሎ ሄደ።
  rationale: 'The revision retains all source-level content and the dignified modern register while removing redundant object agreement, making the direction of the rolling action more faithful to the Greek, and regularizing the Amharic conjunctive verb form. No footnote is needed: «መግቢያ» is a clear contextual rendering of θύρα, and the source’s door/entrance nuance is adequately retained without introducing an unnecessary alternative.'
