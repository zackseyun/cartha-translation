  text: καὶ ἐξελθόντες ἐκ τῶν μνημείων μετὰ τὴν ἔγερσιν αὐτοῦ εἰσῆλθον εἰς τὴν ἁγίαν πόλιν καὶ ἐνεφανίσθησαν πολλοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/053.yaml
  text: And coming out of the tombs after his resurrection[c][b][a], they entered the holy city and appeared to many.
translation:
  language: am
  text: ከእርሱ ትንሣኤ በኋላ ከመቃብሮቹ ወጥተው፣ ወደ ቅድስቲቱ ከተማ[a] ገብተው ለብዙዎች ታዩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ቅድስቲቱ ከተማ” ኢየሩሳሌምን ያመለክታል።
    reason: cross_reference
lexical_decisions:
- source_word: ἐξελθόντες
  choice: ከወጡ በኋላ
  rationale: የአኦሪስት አጋዥ ግስን ከዋናው ግስ በፊት የተፈጸመ ድርጊት አድርጎ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: μνημείων
  choice: መቃብሮቹ
  rationale: በቀደመው ቁጥር የተከፈቱትን የቀብር ስፍራዎች በግልጽ ያመለክታል።
- source_word: μετὰ τὴν ἔγερσιν αὐτοῦ
  choice: እርሱ ከሞት ከተነሣ በኋላ
  rationale: μετά ያለውን ጊዜያዊ ‘በኋላ’ ትርጉም ይጠብቃል፤ ἔγερσιςንም በዘመናዊና ግልጽ አማርኛ ያቀርባል። ‘እርሱ’ በዐውዱ ኢየሱስን ያመለክታል።
- source_word: εἰσῆλθον
  choice: ገብተው
  rationale: ወደ ከተማው የመግባታቸውን ድርጊት በአጭርና ተፈጥሯዊ መንገድ ይገልጻል።
- source_word: τὴν ἁγίαν πόλιν
  choice: ቅድስቲቱ ከተማ
  rationale: የግሪኩን መጽሐፍ ቅዱሳዊ አገላለጽ ይጠብቃል፤ በዐውዱ ኢየሩሳሌምን ያመለክታል።
- source_word: ἐνεφανίσθησαν
  choice: ታዩ
  rationale: የተገብሮ ቅርጹንና ለሌሎች መታየታቸውን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: πολλοῖς
  choice: ለብዙዎች
  rationale: የግሪኩን ያልተወሰነ ብዙ ቁጥር ይጠብቃል፤ ‘ሰዎች’ የሚለው በአማርኛው በቂ ሁኔታ የተገነዘበ ነው።
theological_decisions:
- issue: ‘ከመቃብሮቹ መውጣት’ እና ‘ከትንሣኤው በኋላ’ ያላቸው ሰዋሰዋዊና ጊዜያዊ ግንኙነት
  choice: የግሪኩን ቅደም ተከተል በመከተል፣ ከመቃብሮቹ መውጣታቸው ከእርሱ ትንሣኤ በኋላ እንደሆነ በዋናው ጽሑፍ ቀርቧል።
  alternative: መቃብሮቹ በኢየሱስ ሞት ጊዜ ቢከፈቱም፣ ቅዱሳኑ የወጡት ከትንሣኤው በኋላ ነው ብሎ ቁጥር 52ንና 53ን በስፋት ማያያዝ፤ ወይም የጊዜውን ሐረግ በዋናው ‘ገቡ’ ከሚለው ግስ ጋር ማያያዝ።
  rationale: μετὰ τὴν ἔγερσιν αὐτοῦ ከἐκ τῶν μνημείων ቀጥሎና ከዋናው ግስ በፊት ተቀምጧል። ትርጉሙ ይህን አቀማመጥ ይጠብቃል፤ ሆኖም የአማርኛው ድርብ ‘በኋላ’ አገላለጽ ሊከብድ ስለሚችል ለስላሳ አማራጭ በማስታወሻ ተሰጥቷል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩን ቅደም ተከተል ለመጠበቅ በዋናው ጽሑፍ ድርብ ‘በኋላ’ ተይዟል፤ ይበልጥ ለስላሳው አቀራረብ በ[a] ተሰጥቷል።
