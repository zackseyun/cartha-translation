- from: ከመቃብሮቹም ከወጡ በኋላ፣ እርሱ ከሞት ከተነሣ በኋላ[a] ወደ ቅድስቲቱ ከተማ[b] ገብተው ለብዙዎች ታዩ።
  to: ከእርሱ ትንሣኤ በኋላ ከመቃብሮቹ ወጥተው፣ ወደ ቅድስቲቱ ከተማ[a] ገብተው ለብዙዎች ታዩ።
  rationale: The temporal phrase μετὰ τὴν ἔγερσιν αὐτοῦ is rendered as “ከእርሱ ትንሣኤ በኋላ” and placed before “ከመቃብሮቹ ወጥተው.” This preserves its temporal association with their coming out, while producing idiomatic modern Amharic. No doctrinal inference beyond the Greek narrative is introduced.
