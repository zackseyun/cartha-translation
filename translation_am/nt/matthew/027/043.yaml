  yaml_path: translation/nt/matthew/027/043.yaml
  text: He has trusted in God[a]; let God rescue him now, if he wants him, for he said[b], ‘I am the Son of God.’
translation:
  language: am
  text: በእግዚአብሔር ታምኗል፤ እግዚአብሔር የሚወደው ከሆነ[a] አሁን ያድነው፤ “እኔ የእግዚአብሔር ልጅ ነኝ” ስላለ[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በእርሱ ደስ የሚለው ከሆነ።” አገላለጹ መዝሙር 22፥8ን ያስተጋባል፤ በዚያም የእግዚአብሔር ሞገስ ሐሳብ ጎልቶ ይታያል።
    reason: alternative_reading
  - marker: b
    text: ይህ ፌዝ መዝሙር 22፥8ን በቅርብ ያስተጋባል፤ በዚህም በኢየሱስ ላይ የተደረገውን ፌዝ በመዝሙሩ ከተገለጸው ጻድቅ መከራ ተቀባይ ጋር ያገናኘዋል።
    reason: cross_reference
lexical_decisions:
- source_word: πέποιθεν ἐπὶ τὸν θεόν
  choice: በእግዚአብሔር ታምኗል
  rationale: የግሱን ፍጹም ጊዜ የሚያመለክተውን፣ ቀድሞ ከተደረገ መታመን የተነሣ የቀጠለ ሁኔታ ይጠብቃል፤ በአማርኛም ‘በ... መታመን’ ተፈጥሯዊ ነው።
- source_word: ῥυσάσθω νῦν
  choice: አሁን ያድነው
  rationale: ῥύομαι ከአደጋ ማውጣትን ወይም ማዳንን ያመለክታል፤ ‘ያድነው’ በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ሲሆን ‘አሁን’ የፌዙን አስቸኳይነት ይጠብቃል።
- source_word: εἰ θέλει αὐτόν
  choice: የሚወደው ከሆነ
  rationale: θέλω በቀጥታ ‘መፈለግ/መውደድ’ ማለት ነው። ሰውን ‘መፈለግ’ በአማርኛ አሻሚ ሊሆን ስለሚችል፣ ‘የሚወደው ከሆነ’ የፈቃድና የተቀባይነትን ሐሳብ በተፈጥሯዊ ቋንቋ ያስተላልፋል፤ የ‘ደስ ይለዋል’ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: εἶπεν γὰρ ὅτι
  choice: ምክንያቱም፣ ... ብሏል
  rationale: የአንድ ጊዜ ያለፈ ንግግርን እንደ ቀጥታ ጥቅስ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: Θεοῦ εἰμι υἱός
  choice: እኔ የእግዚአብሔር ልጅ ነኝ
  rationale: በማቴዎስ ዐውድ የታወቀውን ክርስቶሳዊ ማዕረግ ያስተላልፋል፤ በአማርኛ ‘የእግዚአብሔር ልጅ’ ያለ እርግጠኝነት አመልካችም ቢሆን በዐውዱ የተወሰነውን ማዕረግ በተፈጥሯዊ ሁኔታ ያሳያል።
theological_decisions:
- issue: Θεοῦ εἰμι υἱός የሚለውን ክርስቶሳዊ መግለጫ መተርጎም
  choice: እኔ የእግዚአብሔር ልጅ ነኝ
  alternative: እኔ አንድ የእግዚአብሔር ልጅ ነኝ
