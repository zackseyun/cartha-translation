- issue: θέλει αὐτόν የሚለውን ከመዝሙር 22፥8 ጋር ባለው ግንኙነት መተርጎም
  choice: የሚወደው ከሆነ
  alternative: በእርሱ ደስ የሚለው ከሆነ
  rationale: የማቴዎስ ግሪክ θέλω በቀጥታ ፈቃድን፣ መፈለግን ወይም መውደድን ያመለክታል፤ የመዝሙሩ ጥቅስ ግን መደሰትንና ሞገስን ጎልቶ ያሳያል። ዋናው ጽሑፍ የማቴዎስን አገላለጽ በተፈጥሯዊ አማርኛ ሲጠብቅ፣ ሌላውን ጥላ ማስታወሻው ያሳያል።
