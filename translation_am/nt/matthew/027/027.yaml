  text: Τότε οἱ στρατιῶται τοῦ ἡγεμόνος παραλαβόντες τὸν Ἰησοῦν εἰς τὸ πραιτώριον συνήγαγον ἐπ’ αὐτὸν ὅλην τὴν σπεῖραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/027.yaml
  text: Then the governor’s soldiers took Jesus into the praetorium and gathered the whole cohort around him[a][b].
translation:
  language: am
  text: ከዚያም የገዢው ወታደሮች ኢየሱስን ወደ ፕራይቶሪየም[a] ወሰዱት፤ መላውንም የወታደር ክፍል[b] በዙሪያው ሰበሰቡ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወደ ገዢው መኖሪያና ዋና መሥሪያ ቦታ።” የግሪኩ ቃል የሮማዊውን ገዢ ሕጋዊ መኖሪያ ወይም ወታደራዊ ዋና መሥሪያ ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: “የወታደር ክፍል” የሮማውያንን ወታደራዊ አሃድ የሚተረጉም ነው፤ አገላለጹ በዚያ ወቅት የሙሉው አሃድ እያንዳንዱ ወታደር በአካል ተገኝቶ ነበር ማለትን የግድ አያመለክትም።
    reason: cultural_note
