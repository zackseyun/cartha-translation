lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: በርኅራኄ ተነሳስቶ
  rationale: ግሱ ጥልቅ ርኅራኄንና ሐዘኔታን ያመለክታል፤ ይህ አተረጓጎም የስሜቱን ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δὲ
  choice: -ም
  rationale: እዚህ δέ ትረካውን የሚያስቀጥል ለስላሳ አያያዥ ነው፤ ከ«ኢየሱስ» ጋር የተያያዘው «-ም» በአማርኛ ይህን ፍሰት በተፈጥሮ ያሳያል።
- source_word: ἥψατο
  choice: ነካ
  rationale: በዚህ የፈውስ አውድ አካላዊ መንካትን በግልጽና ቀጥተኛ ሁኔታ ይገልጻል።
- source_word: τῶν ὀμμάτων αὐτῶν
  choice: ዓይኖቻቸውን
  rationale: በግሪክኛ ከἅπτομαι ጋር ያለው የባለቤትነት ቅርጽ በአማርኛ ተፈጥሯዊ በሆነ ቀጥተኛ ተሳቢ ተተርጉሟል።
- source_word: εὐθέως
  choice: ወዲያውም
  rationale: ፈውሱ ያለ መዘግየት መፈጸሙን ያጎላል።
- source_word: ἀνέβλεψαν
  choice: ማየት ቻሉ
  rationale: በዓይነ ስውራን ፈውስ አውድ ግሱ የማየት ችሎታን መቀበል ወይም መልሶ ማግኘት ያመለክታል፤ «ማየት ቻሉ» ውጤቱን ግልጽ አድርጎ ሲያቀርብ ሁለቱ ከዚህ በፊት አይተው እንደነበር አይገምትም።
- source_word: ἠκολούθησαν αὐτῷ
  choice: እርሱንም ተከተሉት
  rationale: ከኢየሱስ በኋላ መሄዳቸውን ይጠብቃል፤ የደቀ መዝሙርነት ትርጉም ሊያስተጋባ ቢችልም ጥቅሱ ከሚናገረው በላይ አያብራራም።
theological_decisions:
- issue: በἀνέβλεψαν የተገለጠው የፈውሱ ውጤት
  choice: ወዲያውኑ ማየት መቻላቸው
  alternative: ዳግመኛ ማየታቸው ወይም ቀና ብለው ማየታቸው
  rationale: የተአምሩ አውድና εὐθέως ከἀνέβλεψαν ጋር መምጣቱ ተጨባጭና ፈጣን የማየት ፈውስን ያመለክታሉ፤ ትርጉሙ ይህን ያለ ማጋነን ያሳያል።
- issue: የἠκολούθησαν αὐτῷ ኃይል
  choice: እርሱን ተከተሉት
  alternative: ደቀ መዛሙርቱ ሆኑ
  rationale: ጽሑፉ ኢየሱስን እንደተከተሉ ይናገራል፤ ደቀ መዝሙርነትን ሊያመለክት ቢችልም የቆይታውን ጊዜና ጥልቀት አይገልጽም።
