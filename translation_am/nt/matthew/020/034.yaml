  text: ኢየሱስም በርኅራኄ ተነሳስቶ ዓይኖቻቸውን ነካ፤ ወዲያውም አዩ[a]፣ እርሱንም ተከተሉ።
  philosophy: optimal-equivalence
  footnotes:
