    text: ወይም፣ «ዳግመኛ አዩ።» የግሪክኛው ግስ «መልሶ ማየት» ወይም በቃል ትርጉሙ «ቀና ብሎ ማየት» ሊል ይችላል፤ በዚህ አውድ ግን የማየት ችሎታቸው እንደተመለሰ ያመለክታል።
