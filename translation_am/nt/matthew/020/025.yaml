  text: But Jesus[a], calling them to himself, said, “You know that the rulers of the Gentiles lord it over them[b], and their great men exercise authority over them.”
translation:
  language: am
  text: ኢየሱስ ግን ወደ እርሱ ጠርቶአቸው እንዲህ አለ፤ “የአሕዛብ[a] ገዢዎች እንደ ጌቶች እንደሚገዙአቸው፣ ታላላቆቻቸውም[b] በእነርሱ ላይ ሥልጣናቸውን እንደሚያሳድሩ ታውቃላችሁ።”
  philosophy: optimal-equivalence
