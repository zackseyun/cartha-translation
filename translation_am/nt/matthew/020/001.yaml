review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the kingdom-of-heaven comparison, the early-morning departure, hiring workers, and the vineyard. However, ἀνθρώπῳ οἰκοδεσπότῃ is compressed into «አንድ ባለቤት», which does not adequately represent the explicit «man» and can be less specific than a householder/master of a household. «የወይኑ ቦታ» is understandable but is less precise and less idiomatic than «የወይን እርሻ».
  naturalness: The sentence is broadly natural modern Amharic. Reordering the modifiers and using «ማለዳ ማለዳ» naturally conveys the emphatic early timing of ἅμα πρωῒ. «የወይን እርሻው» is the usual clear expression for a vineyard.
  terminology: «የሰማያት መንግሥት» is appropriate and consistent with Matthew’s established expression. «የቤት ባለቤት ሰው» retains both the human referent and the household-owner role without importing an interpretation. «ሠራተኞችን ሊቀጥር» appropriately expresses hiring laborers.
  issues:
  - severity: medium
    issue: The expression «አንድ ባለቤት» underrepresents ἀνθρώπῳ οἰκοδεσπότῃ.
    rationale: The Greek explicitly identifies the comparison figure as a man and a householder. The revision retains both elements in natural Amharic.
  - severity: low
    issue: «የወይኑ ቦታ» is imprecise for ἀμπελῶνα.
    rationale: A vineyard is specifically a grape-growing field/estate, for which «የወይን እርሻ» is clearer and more idiomatic.
  revised_text: የሰማያት መንግሥት ማለዳ ማለዳ ለወይን እርሻው ሠራተኞችን ሊቀጥር ከወጣ አንድ የቤት ባለቤት ሰው ጋር ትመሳሰላለችና።
  revised_footnotes: []
  revision_rationale: The revision preserves the parabolic comparison and its open scope while restoring the explicit human/householder designation, rendering the vineyard precisely, and expressing the early-morning emphasis idiomatically. No footnote is required by the source or draft.
