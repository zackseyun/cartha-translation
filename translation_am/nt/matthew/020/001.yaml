id: MAT.20.1
reference: Matthew 20:1
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ὁμοία γάρ ἐστιν ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐξῆλθεν ἅμα πρωῒ μισθώσασθαι ἐργάτας εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/001.yaml
  text: For the kingdom of heaven is like a man, a master of a house, who went out early in the morning to hire workers for his vineyard.
translation:
  language: am
  text: የሰማያት መንግሥት ማለዳ ማለዳ ለወይን እርሻው ሠራተኞችን ሊቀጥር ከወጣ አንድ የቤት ባለቤት ሰው ጋር ትመሳሰላለችና።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: የሰማያት መንግሥት
  rationale: በማቴዎስ ወንጌል የተለመደውን አገላለጽ በቀጥታና በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: አንድ ባለቤት
  rationale: οἰκοδεσπότης የቤት ወይም የንብረት ባለቤትና አስተዳዳሪ ማለት ነው፤ ἀνθρώπῳ ያለውን ሰዋዊ ማጣቀሻ ‘አንድ’ በሚለው ተፈጥሯዊ አገላለጽ ይይዛል።
- source_word: ἅμα πρωῒ
  choice: በማለዳ
  rationale: በጠዋት በጣም ቀደም ብሎ የሚለውን የጊዜ ሐሳብ በተለመደ አማርኛ ያቀርባል።
- source_word: μισθώσασθαι ἐργάτας
  choice: ሠራተኞችን ሊቀጥር
  rationale: ለደመወዝ ሥራ ሰዎችን መቅጠር የሚለውን ትርጉም ግልጽ አድርጎ ይገልጣል።
- source_word: ἀμπελῶνα
  choice: የወይኑ ቦታ
  rationale: ወይን የሚተከልበትን ስፍራ ለዘመናዊ አንባቢ በቀላሉ የሚገባ ቃል ይገልጣል።
theological_decisions:
- issue: የመንግሥቱ ንጽጽር ወሰን
  choice: የሰማያት መንግሥት ከባለቤቱ ጋር እንደምትመሳሰል የምሳሌውን መክፈቻ እንዳለ ማቅረብ
  alternative: መንግሥቱን ከባለቤቱ አንድ ባሕርይ ብቻ ጋር በግልጽ ማያያዝ
  rationale: ግሪክኛው የምሳሌውን ትክክለኛ የንጽጽር ወሰን በዚህ ቁጥር ብቻ አይገድብም፤ ስለዚህ ትርጉሙ ያንን ክፍትነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። ‘ትመሳሰላለችና’ የሚለው ቅጽ γάρ ን ከቀደመው ንግግር ጋር በማያያዝ የመንግሥትን ሴት ጾታዊ ሰዋስው ይጠብቃል።
