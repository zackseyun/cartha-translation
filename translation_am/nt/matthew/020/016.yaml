  text: οὕτως ἔσονται οἱ ἔσχατοι πρῶτοι καὶ οἱ πρῶτοι ⸀ἔσχατοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/016.yaml
  text: So the last will be first[a], and the first last.
translation:
  language: am
  text: እንደዚሁ የኋለኞቹ ፊተኞች ይሆናሉ፤ ፊተኞቹም ኋለኞች ይሆናሉ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: እንደዚሁ
  rationale: ምሳሌውን የሚደመድም ውጤታዊ አገናኝ ነው፤ የግሪኩን ‘እንዲህ/በዚህ መንገድ’ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἔσονται
  choice: ይሆናሉ
  rationale: የεἰμί የወደፊት ጊዜ ቅርጽን በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: οἱ ἔσχατοι
  choice: የኋለኞቹ
  rationale: በስም ተግባር የቆመውን ቅጽል ይጠብቃል፤ ‘ታናናሾች’ ማለት የዋጋ ወይም የማኅበራዊ ደረጃ ትርጉምን ከጽሑፉ በላይ ያጠብቃል።
- source_word: πρῶτοι
  choice: ፊተኞች
  rationale: ከ‘ኋለኞች’ ጋር ያለውን አጭርና ሚዛናዊ ተቃርኖ ይጠብቃል።
- source_word: καὶ
  choice: -ም
  rationale: ቀላል አያያዥነቱን በተፈጥሯዊ የአማርኛ ቅንብር ያሳያል፤ በግሪኩ ያልተገለጸ የ‘ነገር ግን’ ተቃርኖ አይጨምርም።
- source_word: οἱ πρῶτοι
  choice: ፊተኞቹ
  rationale: በስም ተግባር የቆመውን ቅጽል ከመጀመሪያው ክፍል ጋር በትይዩ ይተረጉማል።
- source_word: ἔσχατοι
  choice: ኋለኞች
  rationale: የመገለባበጡን ቀመርና ከ‘ፊተኞች’ ጋር ያለውን የቃላት ትይዩነት ይጠብቃል።
theological_decisions:
- issue: የንግግሩ መገለባበጥ ምንነት
  choice: ‘ኋለኞች/ፊተኞች’ በማለት አጭር የመገለባበጥ አባባል ሆኖ ቀርቧል።
  alternative: እንደ ማኅበራዊ ደረጃ፣ የደቀ መዝሙርነት ሽልማት፣ ወይም የድነት ቅደም ተከተል ብቻ አድርጎ መተርጎም።
  rationale: ግሪኩ የመገለባበጡን ወሰን በግልጽ አያጠብብም፤ ትርጉሙም የጊዜ፣ የደረጃ፣ የሽልማት ወይም የድነት ቅደም ተከተል መሆኑን ሳይወስን የጽሑፉን ትርጉማዊና ሥነ መለኮታዊ ክፍትነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና በቀላሉ የሚገባ መደበኛ አማርኛ ተጠቅሟል። የ‘ኋለኞች/ፊተኞች’ ትይዩ የግሪኩን አጭር ሥነ ንግግራዊ ሚዛን ይጠብቃል። የእንግሊዝኛው [a] ማስታወሻ በ‘So/Thus’ መካከል ብቻ ያለ ቅጥ ልዩነት ስለሆነና በአማርኛ ‘እንደዚሁ’ በቂ ስለሆነ የግርጌ ማስታወሻ አልተጨመረም።
