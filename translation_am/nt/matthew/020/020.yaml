  terminology: ‘ሰግዳ’ appropriately retains the physical/reverential sense of προσκυνοῦσα without deciding whether the act is worship. The footnote preserves ‘worshiping’ as a viable lexical alternative.
  issues:
  - severity: low
    issue: Aspectual awkwardness in the participial sequence
    rationale: Replacing ‘እየሰገደች’ with ‘ሰግዳ’ gives a smoother Amharic sequence while preserving the Greek participle’s attendant-action force.
  - severity: low
    issue: The source sense of παρ’ αὐτοῦ is implicit rather than explicit
    rationale: ‘ለመነችው’ is understandable, but ‘ከእርሱ ለመነች’ explicitly retains that she requested something from him.
