  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Τότε προσῆλθεν αὐτῷ ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου μετὰ τῶν υἱῶν αὐτῆς προσκυνοῦσα καὶ αἰτοῦσά τι ⸀παρ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/020.yaml
  text: Then the mother of the sons of Zebedee came to him with her sons[a], bowing down and asking something from him.
translation:
  language: am
  text: በዚያን ጊዜ የዘብዴዎስ ልጆች እናት ከልጆቿ ጋር ወደ እርሱ ቀርባ፣ በፊቱ ሰግዳ[a] አንድ ነገር ከእርሱ ለመነች።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እያመለከችው።” የግሪኩ ግስ በአውዱ መሠረት በአክብሮት መስገድን፣ አክብሮት ማሳየትን፣ ወይም ማምለክን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: በዚያን ጊዜ
  rationale: የትረካውን ቀጣይነት በተፈጥሯዊ አማርኛ የሚያሳይ የጊዜ ማያያዣ ነው።
- source_word: προσῆλθεν αὐτῷ
  choice: ወደ እርሱ ቀረበች
  rationale: προσέρχομαι ወደ አንድ ሰው መቅረብን ያመለክታል፤ በአማርኛም እንቅስቃሴውን በግልጽ ያቀርባል።
- source_word: ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου
  choice: የዘብዴዎስ ልጆች እናት
  rationale: የግሪኩን የዝምድና አገላለጽ በቀጥታና በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: μετὰ τῶν υἱῶν αὐτῆς
  choice: ከልጆቿ ጋር
  rationale: μετά ከጀኒቲቭ ጋር አብሮነትን ያመለክታል።
- source_word: προσκυνοῦσα
  choice: በፊቱ እየሰገደች
  rationale: ቃሉ አካላዊ መስገድን፣ ክብር መስጠትን ወይም ማምለክን ሊያመለክት ይችላል፤ ዋናው ጽሑፍ በዚህ የልመና አውድ የሚታየውን ድርጊት ሳያጠብ ያቀርባል።
- source_word: καὶ αἰτοῦσά τι παρ’ αὐτοῦ
  choice: አንድ ነገር ለመነችው
  rationale: αἰτέω መለመንን ወይም መጠየቅን፣ τι ደግሞ ያልተወሰነ ‘አንድ ነገር’ን ያመለክታል፤ ይህ ቅርጽ በአማርኛ ተፈጥሯዊ ነው።
theological_decisions:
- issue: προσκυνοῦσα ለኢየሱስ የተደረገውን ድርጊት እንዴት መተርጎም እንደሚገባ
  choice: በፊቱ እየሰገደች
  alternative: እያመለከችው፤ ክብር እየሰጠችው
  rationale: προσκυνέω ከክብር ጋር መስገድንም ሆነ ማምለክን ሊገልጽ ይችላል። ዋናው ንባብ የተደረገውን አካላዊና የክብር ድርጊት ያሳያል፤ የማምለክ ትርጉም ደግሞ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የአንቀጹ ተሳቢ ሴት መሆኗን የሚያሳዩ የግስ ቅጾች ተጠብቀዋል።
