id: MAT.20.5
reference: Matthew 20:5
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οἱ δὲ ἀπῆλθον. ⸀πάλιν ἐξελθὼν περὶ ἕκτην καὶ ἐνάτην ὥραν ἐποίησεν ὡσαύτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/005.yaml
  text: So they went away. Going out again about the sixth and ninth hour[a], he did likewise.
translation:
  language: am
  text: እነርሱም ሄዱ። ደግሞም በስድስተኛውና በዘጠነኛው ሰዓት[a] አካባቢ ወጥቶ እንደዚያው አደረገ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይህም በአይሁድ የሰዓት አቆጣጠር ቀትር አካባቢና ከቀትር በኋላ ሦስት ሰዓት አካባቢ ማለት ነው።
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ ἀπῆλθον
  choice: እነርሱም ሄዱ
  rationale: οἱ ቀደም ሲል የተነገራቸውን ሠራተኞች ያመለክታል፤ δέ እዚህ ቀላል የትረካ ማያያዣ ስለሆነ በ«-ም» ተገልጧል፤ ἀπῆλθον ደግሞ በተፈጥሯዊ አማርኛ «ሄዱ» ተብሏል።
- source_word: πάλιν
  choice: ደግሞም
  rationale: ድርጊቱ እንደተደገመ ያሳያል፤ «ደግሞም» በአማርኛ የትረካውን ፍሰት በተፈጥሮ ያገናኛል።
- source_word: ἐξελθὼν
  choice: ወጥቶ
  rationale: የግሪኩን የአኦሪስት ቦዝ አንቀጽ ተከታታይ የትረካ ድርጊት በሚያሳይ ተፈጥሯዊ የአማርኛ ቦዝ አንቀጽ ይገልጣል።
- source_word: περὶ ἕκτην καὶ ἐνάτην ὥραν
  choice: በስድስተኛውና በዘጠነኛው ሰዓት አካባቢ
  rationale: የምንጩን የአይሁድ ሰዓት አቆጣጠርና የባህል አገላለጽ ይጠብቃል፤ περὶ ያለውን ግምታዊነት «አካባቢ» ያሳያል። ዘመናዊ የሰዓት አቻው በማስታወሻ ተገልጧል።
- source_word: ἐποίησεν ὡσαύτως
  choice: እንደዚያው አደረገ
  rationale: ἐποίησεν ይዘቱን ከὡσαύτως የሚያገኝ አጠቃላይ ግስ ነው፤ «እንደዚያው አደረገ» ንጽጽሩን በግልጽና ተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions: []
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የምንጩ የሰዓት አጠራር በዋናው ጽሑፍ ተጠብቆ፣ የዘመናዊው አቻ በእግር ማስታወሻ ቀርቧል።
