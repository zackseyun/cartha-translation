  text: καὶ ὃς ⸀ἂν θέλῃ ἐν ὑμῖν εἶναι πρῶτος ⸀ἔσται ὑμῶν δοῦλος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/027.yaml
  text: And whoever wants to be first among you will be your servant[a].
translation:
  language: am
  text: እና ከእናንተ መካከል ፊተኛ መሆን የሚፈልግ ማንም ባሪያችሁ[a] ይሆናል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አገልጋይ።” የግሪኩ δοῦλος (ዱሎስ) የሚለው ቃል በቀደመው ቁጥር ከተጠቀሰው ቃል የበለጠ ጠንካራ ሲሆን፣ ብዙ ጊዜ ባሪያን ወይም በግዴታ የታሰረ አገልጋይን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἂν θέλῃ
  choice: የሚፈልግ ማንም
  rationale: አንጻራዊው ተውላጠ ስም ከἄν እና ከንዑስ አንቀጽ ግስ ጋር አጠቃላይና ያልተወሰነ ሁኔታን ያመለክታል፤ ይህም በተፈጥሯዊ አማርኛ “የሚፈልግ ማንም” ተብሎ ተገልጿል።
- source_word: ἐν ὑμῖν
  choice: ከእናንተ መካከል
  rationale: በዚህ የማዕረግና የማኅበረሰብ አውድ ውስጥ ቦታን ብቻ ሳይሆን በቡድኑ መካከል ያለን ደረጃ ያመለክታል።
- source_word: εἶναι πρῶτος
  choice: ፊተኛ መሆን
  rationale: πρῶτος ከፍተኛውን ስፍራ ወይም ደረጃ መያዝን ያመለክታል፤ “ፊተኛ መሆን” ቀጥተኛና ተፈጥሯዊ ነው።
- source_word: ἔσται
  choice: ይሆናል
  rationale: የወደፊት ጊዜውን ቅርጽ በቀጥታ ይጠብቃል፤ በአውዱ ያለው የደንብ ወይም የትእዛዝ ኃይል ሳይጠፋ “ይገባዋል” ተብሎ በግልጽ አልተተካም።
- source_word: ὑμῶν
  choice: የእናንተ
  rationale: የግሪኩ ባለቤትነት/ግንኙነት ቅርጽ ሰውየው ለሌሎቹ ራሱን እንደሚያስገዛ ያሳያል።
- source_word: δοῦλος
  choice: ባሪያ
  rationale: δοῦλος ከቀደመው ቁጥር διάκονος ይልቅ ጠንካራ ቃል ሲሆን የተገዛነትን ሁኔታ ያመለክታል፤ “ባሪያ” የኢየሱስን የንግግር ማጠናከር ይጠብቃል።
theological_decisions:
- issue: በደቀ መዝሙርነት ንግግር ውስጥ δοῦλοςን መተርጎም
  choice: ባሪያ
  alternative: አገልጋይ
  rationale: ንግግሩ የመጀመሪያነትን ምኞት ከከፍተኛ ራስን ዝቅ ከማድረግ ጋር ያነጻጽራል። ከዚህ በፊት ባለው ቁጥር διάκονος የሚለው ሌላ የአገልግሎት ቃል ስለተጠቀሰ፣ እዚህ “ባሪያ” ማለት የቃሉን የበለጠ ጠንካራ ኃይል ይጠብቃል፤ ልዩ የእምነት ቡድን ትርጓሜንም አያስገባም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። “ፊተኛ” የማዕረግ ሐሳቡን፣ “ባሪያ” ደግሞ ከቀደመው ቁጥር ይልቅ የተጠናከረውን ቃል ይጠብቃሉ።
