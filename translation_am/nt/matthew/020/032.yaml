  text: καὶ στὰς ὁ Ἰησοῦς ἐφώνησεν αὐτοὺς καὶ εἶπεν· Τί θέλετε ποιήσω ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/032.yaml
  text: And Jesus stopped[a], called them, and said, “What do you want me to do for you?”
translation:
  language: am
  text: ኢየሱስም ቆሞ ጠራቸውና፣ “ምን እንዳደርግላችሁ ትፈልጋላችሁ?”[a] አላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም ይበልጥ ቃል በቃል፣ “ምን እንዳደርግላችሁ ትመኛላችሁ?”
    reason: lexical_alternative
lexical_decisions:
- source_word: στὰς
  choice: ቆሞ
  rationale: የἵστημι ያለፈ ጊዜ አድራጊ አንቀጽ በዚህ አውድ ኢየሱስ መሄዱን እንዳቆመ ያመለክታል። “ቆሞ” የድርጊቶቹን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐφώνησεν
  choice: ጠራቸው
  rationale: φωνέω እዚህ ሰዎቹን መጥራት ወይም ወደ እርሱ መጥራትን ያመለክታል፤ “ጠራቸው” አጭር፣ ግልጽና ከአውዱ ጋር የሚስማማ ነው።
- source_word: αὐτοὺς
  choice: -አቸው (ጠራቸው)
  rationale: የብዙ ቁጥር ተሳቢ ተውላጠ ስም በአማርኛ ከግሱ ጋር ተዋሕዶ በ“-አቸው” ተገልጿል፤ በቅርብ አውድ የተጠቀሱትን ሁለት ዕውራን ያመለክታል።
- source_word: Τί
  choice: ምን
  rationale: ቀጥተኛውን ጥያቄ ያለ አላስፈላጊ ማስፋፊያ ይገልጻል።
- source_word: θέλετε
  choice: ትፈልጋላችሁ
  rationale: θέλω ፈቃድን ወይም መፈለግን ይገልጻል። “ትፈልጋላችሁ” በዘመናዊ አማርኛ ተፈጥሯዊና ቀጥተኛ ሲሆን የብዙ ቁጥር ተናጋሪዎችንም ይጠብቃል።
- source_word: ποιήσω
  choice: እንዳደርግ
  rationale: ከθέλετε በኋላ ያለው የጥገኛ ግስ ቅርጽ እነርሱ ኢየሱስ እንዲያደርግ የሚፈልጉትን ይገልጻል፤ “እንዳደርግ” ይህን ግንኙነት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὑμῖν
  choice: -ላችሁ (እንዳደርግላችሁ)
  rationale: የብዙ ቁጥር ዳቲቭ እዚህ ድርጊቱ ለእነርሱ ጥቅም እንደሚደረግ ያሳያል፤ ይህም በግሱ ላይ በ“-ላችሁ” ተገልጿል።
- source_word: ὁ Ἰησοῦς
  choice: ኢየሱስ
  rationale: የግሪኩ መስተዋድድ ከግለሰብ ስም ጋር በአማርኛ ለየት ብሎ አይተረጎምም፤ ስሙ በተለመደው የአማርኛ አጻጻፍ ቀርቧል።
theological_decisions:
- issue: የኢየሱስ ጥያቄ ቃናና ኃይል
  choice: “ምን እንዳደርግላችሁ ትፈልጋላችሁ?” የሚል ቀጥተኛና ግላዊ ጥያቄ
  alternative: ይበልጥ መደበኛ ቃና ያለው “ምን እንዳደርግላችሁ ትመኛላችሁ?”
  rationale: ጥቅሱ የእምነት ክርክር ያለበትን ቃል አያቀርብም። ትርጉሙ የግሪኩን ቀጥተኛነትና ኢየሱስ ለሰዎቹ የሰጠውን ግላዊ ትኩረት ያለ ጥንታዊ ወይም አላስፈላጊ የሥነ ሥርዓት ክብደት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ተከታታይ ድርጊቶች “ቆሞ ጠራቸውና” በሚል ተፈጥሯዊ አወቃቀር ቀርበዋል። በእንግሊዝኛው የምክክር ጽሑፍ የግርጌ ማስታወሻው ምልክት “stopped” ከሚለው በኋላ ቢታይም፣ የማስታወሻው ይዘት የጥያቄውን አማራጭ አተረጓጎም ስለሚመለከት [a] ከጥያቄው በኋላ ተቀምጧል።
