base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/004.yaml
  text: And he said to them[a], ‘You also go into the vineyard, and whatever is right I will give you.’
translation:
  language: am
  text: እርሱም እነርሱን እንዲህ አላቸው፦ «እናንተም ወደ የወይን እርሻው ሂዱ፤ ፍትሐዊ የሆነውን ሁሉ[a] እሰጣችኋለሁ።»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ተገቢ የሆነውን ሁሉ» ወይም «ፍትሕ ያለውን ሁሉ»።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκείνοις εἶπεν
  choice: እነርሱንም … አላቸው
  rationale: የግሪክኛውን ተራኪ አገላለጽ በተፈጥሯዊ የአማርኛ ቀጥተኛ ንግግር አወቃቀር ያቀርባል፤ ἐκείνοις ቀደም ሲል የተጠቀሱትን ሠራተኞች ያመለክታል።
- source_word: Ὑπάγετε καὶ ὑμεῖς
  choice: እናንተም … ሂዱ
  rationale: ብዙ ሰዎችን የሚያዝዘውን ቅርጽና καὶ ὑμεῖς የሚያሳየውን ‘እናንተም’ የተሳትፎ አጽንዖት ይጠብቃል።
- source_word: εἰς τὸν ἀμπελῶνα
  choice: ወደ ወይኑ ቦታ
  rationale: ἀμπελών ወይን የሚተከልበትን ቦታ ያመለክታል፤ ‘የወይን ቦታ’ ለዘመናዊ አንባቢ ግልጽና ተፈጥሯዊ ነው።
- source_word: ὃ ἐὰν ᾖ δίκαιον
  choice: ትክክል የሆነውን
  rationale: የዘመድ ሐረጉን አጠቃላይነት ይጠብቃል፤ δίκαιον እዚህ ከፍትሕና ከተገቢነት ጋር የተያያዘውን ሰፊ ሥነ ምግባራዊ ትርጉም ይይዛል።
- source_word: δώσω ὑμῖν
  choice: እሰጣችኋለሁ
  rationale: ግሪክኛው ‘እሰጣችኋለሁ’ ይላል እንጂ የክፍያ ግስን በግልጽ አይጠቀምም፤ ስለዚህ የምንጩን ቃል በቅርብ ይጠብቃል።
theological_decisions:
- issue: በደመወዝ አውድ ውስጥ δίκαιονን መተርጎም
  choice: ትክክል የሆነውን
  alternative: ፍትሐዊ የሆነውን፤ ተገቢ የሆነውን
  rationale: ‘ትክክል’ የተገቢነትንና የፍትሕን ሐሳብ ሳያጠብ ያስተላልፋል፤ ቃሉን በሕጋዊ ፍትሕ ብቻ አይገድበውም፣ ወይም ወደ ግላዊ ‘ፍትሐዊነት’ አያጠብበውም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የቀጥተኛ ንግግሩ ቃላት ተፈጥሯዊ ሲሆኑ የግሪክኛውን አጽንዖትና አሻሚነት ይጠብቃሉ።
