- from: እነርሱንም፣ ‘እናንተም ወደ ወይኑ ቦታ ሂዱ፤ ትክክል የሆነውንም[a] እሰጣችኋለሁ’ አላቸው።
  to: እርሱም እነርሱን እንዲህ አላቸው፦ «እናንተም ወደ የወይን እርሻው ሂዱ፤ ፍትሐዊ የሆነውን ሁሉ[a] እሰጣችኋለሁ።»
