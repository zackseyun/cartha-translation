id: MAT.20.30
reference: Matthew 20:30
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ δύο τυφλοὶ καθήμενοι παρὰ τὴν ὁδόν, ἀκούσαντες ὅτι Ἰησοῦς παράγει, ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/030.yaml
  text: And behold, two blind men sitting by the road, when they heard that Jesus was passing by, cried out, saying, “Lord, have mercy on us, Son of David.”
translation:
  language: am
  text: እነሆ፣ በመንገድ ዳር ተቀምጠው የነበሩ ሁለት ዕውሮች፣ ኢየሱስ በዚያ እያለፈ እንደሆነ ሲሰሙ፣ “ጌታ ሆይ፣ የዳዊት ልጅ ሆይ፣ ማረን!” ብለው ጮኹ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: የአንባቢውን ትኩረት ወደ ትዕይንቱ የሚስበውን የትረካ ምልክትና ድንገተኛ ሕያውነት ይጠብቃል።
- source_word: δύο τυφλοὶ
  choice: ሁለት ዕውሮች
  rationale: በዚህ አውድ የተጠቀሱትን ሁለት ወንዶች በተፈጥሯዊና አጭር አማርኛ ያመለክታል።
- source_word: καθήμενοι παρὰ τὴν ὁδόν
  choice: በመንገድ ዳር ተቀምጠው የነበሩ
  rationale: የቦታውንና የሰዎቹን አቀማመጥ ግልጽ በሆነ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἀκούσαντες ὅτι Ἰησοῦς παράγει
  choice: ኢየሱስ በዚያ እያለፈ እንደሆነ ሲሰሙ
  rationale: የአንቀጹን ጊዜያዊ ግንኙነት ያሳያል፤ παράγει በዚህ የጉዞ አውድ ‘በዚያ እያለፈ’ ተብሎ ተፈጥሯዊ ይሆናል።
- source_word: ἔκραξαν
  choice: ጮኹ
  rationale: የግሱን ከፍተኛ የድምፅና የጥሪ ጥንካሬ በቀጥታ ይገልጣል።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: ቀጥተኛውን አድራሻ እና በመሲሐዊው አውድ ያለውን የክብር ክብደት ይጠብቃል።
- source_word: ἐλέησον ἡμᾶς
  choice: ማረን
  rationale: ርኅራኄና እርዳታ የሚለምነውን አጭር አስገዳጅ ጥሪ በተለመደና ግርማ ባለው አማርኛ ያቀርባል።
- source_word: υἱὸς Δαυίδ
  choice: የዳዊት ልጅ
  rationale: በማቴዎስ ያለውን የታወቀ የመሲሕ ማዕረግ ሳያፈርስ በቀጥታ ይጠብቃል።
theological_decisions:
- issue: በኢየሱስ ቀጥተኛ አድራሻ ውስጥ κύριοςን መተርጎም
  choice: ጌታ ሆይ
  alternative: ጌታዬ ሆይ / ክቡር ሆይ
  rationale: ‘የዳዊት ልጅ’ ከሚለው ጋር ተያይዞ አድራሻው የክብርና የመሲሐዊነት ክብደት አለው፤ ‘ጌታ ሆይ’ ይህን ይጠብቃል፣ ነገር ግን ከጽሑፉ በላይ የሆነ የተወሰነ ትምህርተ መለኮታዊ ፍቺ አያክልም።
- issue: የυἱὸς Δαυίδ መሲሐዊ ኃይል
  choice: የዳዊት ልጅ
  alternative: የዳዊት ዘር
  rationale: ቀጥተኛው የልጅነት አገላለጽ በማቴዎስ ያለውን የንጉሣዊና የመሲሐዊ ማዕረግ ይጠብቃል፤ ‘ዘር’ ግን ወደ ትውልድ መግለጫ ብቻ ሊያሳንሰው ይችላል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። ‘እነሆ’ የትረካውን የትኩረት ጥሪ ለመጠበቅ ሆን ተብሎ ተይዟል፤ የጥሪው ቅደም ተከተል በአማርኛ ተፈጥሯዊ እንዲሆን ‘የዳዊት ልጅ ሆይ’ ከልመናው በፊት ተቀምጧል።
