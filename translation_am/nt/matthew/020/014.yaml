  verdict: revise
  source_fidelity: The draft accurately renders the imperatives and the broad sense of τὸ σὸν. However, “እንደሰጠሁ” introduces a completed past action that is not expressed in this Greek clause. The comparison in ὡς καὶ σοί should remain aspectually unmarked or be expressed as a comparison of intended equal giving.
