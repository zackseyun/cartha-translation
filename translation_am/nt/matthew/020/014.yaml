  yaml_path: translation/nt/matthew/020/014.yaml
  text: Take what is yours and go[a]. But I want to give to this last man the same as to you.
translation:
  language: am
  text: የአንተ የሆነውን ውሰድና ሂድ፤ እኔ ግን ለዚህ ለመጨረሻው ሰው[a] ለአንተ እንደምሰጥ እንዲሁ ልሰጥ እፈልጋለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለዚህ ለመጨረሻው፤ ለአንተ እንደምሰጥ እንዲሁ ልሰጥ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἆρον
  choice: ውሰድ
  rationale: የትእዛዝ አኳኋኑን ቀጥተኛነት ይጠብቃል፤ በዚህ አውድ የራሱ የሆነውን ወስዶ እንዲሄድ የተሰጠ ትእዛዝ ነው።
- source_word: τὸ σὸν
  choice: የአንተ የሆነውን
  rationale: የግሪኩን ‘የአንተ የሆነውን’ የሚል ሰፊ አገላለጽ ይጠብቃል፤ ‘ደመወዝህን’ ማለት ከአውዱ የሚገባ ቢሆንም በሐረጉ ውስጥ በግልጽ የሌለውን ልዩ ትርጉም ይጨምራል።
- source_word: ὕπαγε
  choice: ሂድ
  rationale: አጭርና ተፈጥሯዊ የማሰናበቻ ትእዛዝ ነው፤ ከግሪኩ በላይ የጥላቻ ድምፅ አይጨምርም።
- source_word: θέλω δὲ
  choice: እኔ ግን … እፈልጋለሁ
  rationale: θέλω የተናጋሪውን ፈቃድ ወይም ፍላጎት ይገልጣል፤ δέ ያለውን መጠነኛ ንፅፅር ‘ግን’ ያሳያል።
- source_word: τούτῳ τῷ ἐσχάτῳ
  choice: ለዚህ ለመጨረሻው ሰው
  rationale: τούτῳ ያለውን ጠቋሚ ቅርጽና ἐσχάτῳ ያለውን ‘መጨረሻ’ ትርጉም ይጠብቃል፤ በምሳሌው ውስጥ ተጠቃሹ አንድ ወንድ ሠራተኛ ስለሆነ ‘ሰው’ ተጨምሯል።
- source_word: δοῦναι
  choice: ልሰጠው
  rationale: δίδωμι ያለውን መሠረታዊ ‘መስጠት’ ትርጉም ይጠብቃል፤ አውዱ ክፍያን ቢመለከትም ‘ልክፈለው’ በማለት ቃሉን አላጠበበም።
- source_word: ὡς καὶ σοί
  choice: ልክ ለአንተ እንደሰጠሁ
  rationale: የእኩል አሰጣጥ ንፅፅሩን በተፈጥሯዊ አማርኛ ያሳያል፤ ያለፈ ድርጊት የሚያመለክተው ቅርጽ ከቀደመው የምሳሌው አውድ የተገነዘበ ነው።
theological_decisions:
