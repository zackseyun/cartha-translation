  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። የባለቤቱ ቀጥተኛ ትእዛዝና በራሱ ፈቃድ የመስጠት አጽንዖት ተጠብቋል።
