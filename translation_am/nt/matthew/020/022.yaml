  rationale: ችሎታን የሚጠይቀውን የግሪክ አገላለጽ በግልጽና በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τὸ ποτήριον
  choice: ጽዋ
  rationale: የግሪኩን ዘይቤ ሳይፈታ ይጠብቃል፤ ቃሉም በመጽሐፍ ቅዱሳዊ አገባብ የታወቀና ክቡር ነው።
- source_word: ὃ ἐγὼ μέλλω πίνειν
  choice: እኔ ልጠጣ ያለሁትን
