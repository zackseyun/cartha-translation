base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/022.yaml
  text: But Jesus answered and said[a], “You do not know what you are asking. Are you able to drink the cup that I am about to drink?” They said to him, “We are able.”
translation:
  language: am
  text: ኢየሱስ ግን መልሶ እንዲህ አለ፤ “የምትጠይቁትን አታውቁም። እኔ ልጠጣው ያለሁትን ጽዋ[a] ልትጠጡ ትችላላችሁን?” እነርሱም፣ “እንችላለን” አሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም በግልጽ፣ “እኔ ልጠጣው ያለሁትን የመከራ ጽዋ።” ግሪኩ “ጽዋ” የሚለውን ዘይቤ ይጠብቃል፤ ይህም በመጽሐፍ ቅዱስ የአንድን ሰው የተመደበ ዕጣ፣ በተለይም መከራን፣ ለማመልከት የተለመደ ምስል ነው።
    reason: lexical_alternative
