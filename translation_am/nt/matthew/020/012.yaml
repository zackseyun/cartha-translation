  text: saying[a], ‘These last worked one hour, and you made them equal to us who bore the burden of the day and the scorching heat.’
translation:
  language: am
  text: እንዲህ አሉ፤ “እነዚህ በመጨረሻ የመጡት አንድ ሰዓት ብቻ ሠሩ፤ አንተ ግን የቀኑን ሸክምና የሚያቃጥለውን ሙቀት ከታገሥነው ከእኛ ጋር እኩል አደረግሃቸው።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እንደ እኛ ቆጠርሃቸው።”
    reason: ἴσους … ἐποίησας የሚለው አገላለጽ በዐውዱ ‘እኩል አደረግሃቸው’ ወይም ‘እንደ እኛ ቆጠርሃቸው’ ተብሎ ሊቀርብ ይችላል።
lexical_decisions:
- source_word: λέγοντες
  choice: እንዲህ አሉ
  rationale: የግሪኩ የአሁን ጊዜ ቦዝ አንቀጽ ከቀደመው ትረካ ጋር የተያያዘ ቢሆንም፣ በዘመናዊ አማርኛ ‘እንዲህ አሉ’ የንግግሩን መግቢያ ተፈጥሯዊ እና ግልጽ ያደርገዋል።
- source_word: Οὗτοι οἱ ἔσχατοι
  choice: እነዚህ በመጨረሻ የመጡት
  rationale: በምሳሌው ዐውድ ቃሉ በመጨረሻ የተቀጠሩትን ሠራተኞች ያመለክታል፤ ይህ አተረጓጎም ተቃርኖውን በግልጽ ያሳያል።
- source_word: μίαν ὥραν ἐποίησαν
  choice: አንድ ሰዓት ብቻ ሠሩ
  rationale: ποιέω ከጊዜ መጠን ጋር በዚህ ዐውድ ‘ሠሩ’ ማለት ነው፤ ‘ብቻ’ ደግሞ በμίαν እና በቅሬታው የሚታየውን አጽንዖት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἴσους αὐτοὺς ἡμῖν ἐποίησας
  choice: ከእኛ ጋር እኩል አደረግሃቸው
  rationale: የግሪኩን ‘እኩል ማድረግ’ አወቃቀርና የሠራተኞቹን ቅሬታ በቀጥታ ይጠብቃል።
- source_word: τοῖς βαστάσασι
  choice: ከተሸከምነው
  rationale: βαστάζω መሸከምንና መታገስን ሊያመለክት ይችላል፤ ‘ተሸከምን’ ከ‘ሸክም’ ጋር ያለውን ምስላዊ ግንኙነት ይጠብቃል።
- source_word: τὸ βάρος τῆς ἡμέρας
  choice: የቀኑን ሸክም
  rationale: βάρος በቀጥታ ‘ክብደት/ሸክም’ ሲሆን፣ እዚህ የሙሉ ቀን ከባድ ሥራን በምስል ይገልጣል።
- source_word: τὸν καύσωνα
  choice: የሚያቃጥለውን ሙቀት
  rationale: καύσων ኃይለኛና አቃጣይ ሙቀትን ያመለክታል፤ ይህ ምርጫ የቃሉን ጥንካሬ በተለመደ አማርኛ ያስተላልፋል።
