  rationale: ጥቅሱ የሠራተኞቹን አመለካከት ይዘግባል፤ ስለ መለኮታዊ ፍትሕ ያለውን ሰፊ ውጥረት ትርጉሙ በራሱ መፍታት የለበትም።
