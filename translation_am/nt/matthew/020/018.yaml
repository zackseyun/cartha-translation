review_pass:
  verdict: revise
  source_fidelity: The draft preserves the verse's sequence and principal terms, but its rendering of the present plural verb is grammatically mismatched, and “አሳልፎ ይሰጣል” is active singular rather than an appropriate rendering of the future passive παραδοθήσεται.
  naturalness: “እየወጣን ነው” should be plural, “እየወጣን ነን.” “በሞት ይፈርዱበታል” is the natural and precise legal expression for condemnation to death.
  terminology: “የሰው ልጅ,” “ዋና ካህናት,” and “ጻፎች” retain established biblical terminology. The rendering of παραδοθήσεται is kept broad (“will be handed over”), without narrowing it to betrayal.
  issues:
  - severity: high
    issue: Plural subject with singular auxiliary
    rationale: The Greek ἀναβαίνομεν means “we are going up.” In Amharic, እየወጣን ነው uses a singular auxiliary; it must be እየወጣን ነን.
  - severity: high
    issue: Voice and agreement of παραδοθήσεται
    rationale: The Greek is future passive, “will be handed over.” The draft’s አሳልፎ ይሰጣል is active singular and leaves the Son of Man as an implausible implied agent. An indefinite-agent construction, አሳልፈው ይሰጡታል, naturally conveys the passive sense in Amharic while leaving the agent unspecified.
  - severity: medium
    issue: Condemnation phrase lacks the instrumental/penalty marker
    rationale: Adding በ in “በሞት ይፈርዱበታል” clearly expresses κατακρινοῦσιν αὐτὸν θανάτῳ, “they will condemn him to death.”
