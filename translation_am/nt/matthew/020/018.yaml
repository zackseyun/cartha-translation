  text: Ἰδοὺ ἀναβαίνομεν εἰς Ἱεροσόλυμα, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδοθήσεται τοῖς ἀρχιερεῦσιν καὶ γραμματεῦσιν, καὶ κατακρινοῦσιν αὐτὸν θανάτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/018.yaml
  text: Look[a], we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and scribes, and they will condemn him to death[c][b],
translation:
  language: am
  text: “እነሆ፣[a] ወደ ኢየሩሳሌም እየወጣን ነን፤ የሰው ልጅም[c] ለዋና ካህናትና ለጻፎች አሳልፈው ይሰጡታል፤[b] እነርሱም በሞት ይፈርዱበታል።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ተመልከቱ።”
    reason: lexical_alternative
  - marker: b
    text: “አሳልፈው ይሰጡታል” የሚለው በሌሎች ዐውዶች “ይከዳል” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: c
    text: “የሰው ልጅ” ኢየሱስ ለራሱ በተደጋጋሚ የሚጠቀምበት መጠሪያ ሲሆን፣ ዳንኤል 7፥13–14ን ሊያስተጋባ ይችላል።
    reason: cross_reference
lexical_decisions:
- source_word: Ἰδοὺ
  choice: እነሆ
  rationale: ትኩረትን የሚስብ የንግግር ምልክት ሲሆን በአማርኛ የተለመደና ክብር ያለው አቻ ነው።
- source_word: ἀναβαίνομεν
  choice: እየወጣን ነው
  rationale: የግሱን የአሁን ጊዜ ቀጣይ እንቅስቃሴና ወደ ኢየሩሳሌም ‘መውጣት’ የሚለውን መልክዓ ምድራዊና ልማዳዊ አገላለጽ ይጠብቃል።
- source_word: Ἱεροσόλυμα
  choice: ኢየሩሳሌም
  rationale: በዘመናዊ የአማርኛ መጽሐፍ ቅዱስ አጠቃቀም የተለመደው የስፍራው ስም ነው።
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: የሰው ልጅ
  rationale: የኢየሱስን የተለመደ ራስ-መጠሪያ የሚጠብቅና ከዳንኤል 7፥13–14 ጋር ሊኖረው የሚችለውን ድምፀት ክፍት የሚያደርግ የተመሰረተ አቻ ነው።
- source_word: παραδοθήσεται
  choice: አሳልፎ ይሰጣል
  rationale: በጠላቶች ሥልጣን ሥር መሰጠትን ይገልጣል፤ ትርጉሙን ‘ይከዳል’ ብሎ በአንድ የተወሰነ የክህደት ድርጊት ላይ አያጠብም። የግሪኩ ተደራጊ ቅርጽ በአማርኛው ባለቤት አልባ የሦስተኛ መደብ አገላለጽ ተንጸባርቋል።
- source_word: τοῖς ἀρχιερεῦσιν
  choice: ለካህናት አለቆች
  rationale: አንድን ሊቀ ካህናት ብቻ ሳይሆን መሪ የክህነት ባለሥልጣናትን የሚያመለክተውን ብዙ ቁጥር ይጠብቃል።
- source_word: γραμματεῦσιν
  choice: ለጻፎች
  rationale: ቀጥተኛውን የቃሉን አቻ ይሰጣል፤ ቃሉ በዚህ ዐውድ የሕግ ሊቃውንት የነበሩ ጻፎችን ያመለክታል።
- source_word: κατακρινοῦσιν
  choice: ይፈርዱበታል
  rationale: በፍርድ ሂደት የጥፋተኝነት ውሳኔ መስጠትን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: θανάτῳ
  choice: ሞት
  rationale: የፍርዱን ቅጣት ወይም ውጤት በ‘ሞት ይፈርዱበታል’ በሚለው ተፈጥሯዊ ሕጋዊ አገላለጽ ያቀርባል።
theological_decisions:
- issue: የክርስቶሳዊው መጠሪያ ὁ υἱὸς τοῦ ἀνθρώπου አተረጓጎም
  choice: የሰው ልጅ
  alternative: ሰብዓዊው
  rationale: በወንጌላት የተመሰረተውን የኢየሱስ ራስ-መጠሪያ እና የዳንኤልን ድምፀት ይጠብቃል፤ አገላለጹን ወደ ተራ ሰውነት ትርጉም አያሳንስም።
- issue: የπαραδοθήσεται የትርጉም ወሰን
  choice: አሳልፎ ይሰጣል
  alternative: ይከዳል
  rationale: ግሪኩ በጠላቶች እጅ ወይም ሥልጣን ሥር መሰጠትን በሰፊው ይገልጣል። ‘ይከዳል’ የሚለው በዚህ ጥቅስ ባልተገለጸ የተወሰነ ወኪልና ተግባር ላይ ትርጉሙን ያጠባል።
