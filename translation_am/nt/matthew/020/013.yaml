  text: ὁ δὲ ἀποκριθεὶς ⸂ἑνὶ αὐτῶν εἶπεν⸃· Ἑταῖρε, οὐκ ἀδικῶ σε· οὐχὶ δηναρίου συνεφώνησάς μοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/013.yaml
  text: But answering[a], he said to one of them, ‘Friend, I am not wronging you[b]. Did you not agree with me for a denarius?’
translation:
  language: am
  text: እርሱ ግን ከእነርሱ ለአንዱ መልሶ እንዲህ አለው፦ “ወዳጄ ሆይ፣ አልበድልህም። ከእኔ ጋር በአንድ ዲናር[a] አልተስማማህምን?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ዲናር የሮማውያን የብር ሳንቲም ነበር፤ በዚህ አውድ ለአንድ ሠራተኛ የአንድ ቀን ደመወዝ እንደሆነ ይታያል።
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: መልሶ
  rationale: የጌታውን ምላሽ የሚያስተዋውቀውን የግሪክ አሳታፊ ግስ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἑνὶ αὐτῶν
  choice: ከእነርሱ ለአንዱ
  rationale: ከቡድኑ መካከል ለአንድ ሰው እንደተናገረ የሚያሳየውን ነጠላ ተሳቢና ከፊልነት ያቆያል።
- source_word: Ἑταῖρε
  choice: ወዳጄ ሆይ
  rationale: በዚህ አውድ ሞቅ ያለ ቅርበትን ሳያስገድድ፣ የተከበረ ቀጥተኛ አጠራርን ያቀርባል።
- source_word: οὐκ ἀδικῶ σε
  choice: አልበደልኩህም
  rationale: ἀδικέω የሚገልጠውን በአንድ ሰው ላይ በደል ወይም ኢፍትሐዊነት የመፈጸም ሐሳብ በቀጥታና በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: οὐχὶ
  choice: አል...ምን?
  rationale: አዎንታዊ መልስ የሚጠብቀውን የግሪክ አጠያያቂ አሉታ በአማርኛ የተለመደ አወቃቀር ያስተላልፋል።
- source_word: δηναρίου
  choice: በአንድ ዲናር
  rationale: ታሪካዊውን የሮማውያን ሳንቲም ስም ያቆያል፤ ባህላዊ መረጃውም በማስታወሻ ተገልጧል።
- source_word: συνεφώνησάς μοι
  choice: ከእኔ ጋር ... አልተስማማህምን?
  rationale: ቀድሞ የተደረገውን የቅጥር ስምምነት በግልጽና ዘመናዊ አማርኛ ይገልጣል።
