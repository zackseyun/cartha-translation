language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῇ· Τί θέλεις; λέγει αὐτῷ· Εἰπὲ ἵνα καθίσωσιν οὗτοι οἱ δύο υἱοί μου εἷς ἐκ δεξιῶν ⸀σου καὶ εἷς ἐξ εὐωνύμων σου ἐν τῇ βασιλείᾳ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/021.yaml
  text: And he said to her[a], “What do you want?” She said to him, “Command that these two sons of mine may sit, one at your right and one at your left[c][b], in your kingdom.”
translation:
  language: am
  text: እርሱም፦ “ምን ትፈልጊያለሽ?” አላት። እርሷም፦ “እነዚህ ሁለት ወንዶች ልጆቼ በመንግሥትህ[b] አንዱ በቀኝህ፣ አንዱም በግራህ እንዲቀመጡ በል[a]” አለችው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በል” የሚለው “እዘዝ” ተብሎ ሊተረጎም ይችላል፤ ይበልጥ ትርጓሜያዊ በሆነ መንገድ “ፍቀድ” ማለትም ይቻላል። የግሪኩ ግስ ግን በቀጥታ “በል” ማለት ነው።
    reason: lexical_alternative
  - marker: b
    text: “መንግሥት” የሚለው “ንግሥና” ወይም “ንጉሣዊ አገዛዝ” ተብሎም ሊገባ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί θέλεις
  choice: ምን ትፈልጊያለሽ?
  rationale: ጥያቄውን ቀጥተኛ፣ ተፈጥሯዊና የዘመኑ አማርኛ በሆነ አገላለጽ ያቀርባል፤ የሴት ነጠላ አድራሻውንም ይጠብቃል።
- source_word: Εἰπὲ
  choice: በል
  rationale: የግሪኩን ‘ተናገር/በል’ የሚለውን ቀጥተኛ ትርጉም ይጠብቃል፤ ከእንዲቀመጡ ጋር በአማርኛ ሲገናኝ የትእዛዝ ወይም የፈቃድ ጥያቄን በተፈጥሮ ያሳያል።
- source_word: ἵνα καθίσωσιν
  choice: እንዲቀመጡ
  rationale: የጥያቄውን ይዘት በተፈጥሯዊ የአማርኛ አገባብ ያሳያል፤ መቀመጡ ፈቃድንም ሆነ መሾምን ሊያመለክት የሚችለውን ክፍትነት ይጠብቃል።
- source_word: οὗτοι οἱ δύο υἱοί μου
  choice: እነዚህ ሁለት ልጆቼ
  rationale: οὗτοι የሚያሳየውን ጠቋሚነትና μου የሚያሳየውን የባለቤትነት ግንኙነት በግልጽ ይጠብቃል።
- source_word: εἷς ἐκ δεξιῶν σου καὶ εἷς ἐξ εὐωνύμων σου
  choice: አንዱ በቀኝህ፣ አንዱም በግራህ
  rationale: የቦታውን ትይዩነትና የክብር መቀመጫዎችን በአጭርና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐν τῇ βασιλείᾳ σου
  choice: በመንግሥትህ
  rationale: βασιλεία መንግሥትን፣ ንግሥናን ወይም ንጉሣዊ አገዛዝን ሊያመለክት ቢችልም፣ ‘በመንግሥትህ’ በአማርኛ ተፈጥሯዊና የተለመደ ሲሆን ንጉሣዊውን አውድ ይጠብቃል።
theological_decisions:
- issue: ልጆቹ በኢየሱስ ንግሥና ውስጥ እንዲቀመጡ የቀረበው ጥያቄ የሚያመለክተው ዘመንና ዓይነት
  choice: የክብር ቦታዎችን ‘በመንግሥትህ’ ብሎ ማቅረብ፣ መንግሥቱ ምድራዊ ወይም ሰማያዊ ደረጃ መሆኑን ሳይወስን
  alternative: ይህን በተለይ እንደ ምድራዊ መሲሐዊ መንግሥት ወይም እንደ ፍጻሜው ሰማያዊ መንግሥት መተርጎም
  rationale: የግሪኩ ጽሑፍ የንግሥናና የክብር ትርጉሙን ያሳያል እንጂ የተወሰነ የፍጻሜ ዘመን አቋም አይገልጽም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የንግግሩ ቀጥተኛነት፣ የሴት ነጠላ አድራሻ እና የቀኝና የግራ ትይዩ አወቃቀር ተጠብቀዋል።
