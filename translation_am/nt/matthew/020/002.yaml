reference: Matthew 20:2
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸂συμφωνήσας δὲ⸃ μετὰ τῶν ἐργατῶν ἐκ δηναρίου τὴν ἡμέραν ἀπέστειλεν αὐτοὺς εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/002.yaml
  text: After agreeing with the workers for one denarius for the day[a], he sent them into his vineyard.
translation:
  language: am
  text: ከሠራተኞቹም ጋር ለአንድ ቀን በአንድ ዲናር[a] ከተስማማ በኋላ፣ ወደ ወይን እርሻው ላካቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንድ ዲናር በዚያ ዘመን ለአንድ ሠራተኛ የተለመደ የአንድ ቀን ደመወዝ ነበር።
    reason: cultural_note
lexical_decisions:
- source_word: συμφωνήσας
  choice: ከተስማማ በኋላ
  rationale: የግሪኩ ያለፈ ጊዜ አድራጊ ቦዝ አንቀጽ ከዋናው ድርጊት በፊት ስምምነቱ መደረጉን ያሳያል፤ ይህ አተረጓጎም በአማርኛ ተፈጥሯዊ ነው።
- source_word: δὲ
  choice: ም
  rationale: δέ እዚህ ለስላሳ የትረካ ማያያዣ ነው፤ ከ«ሠራተኞቹ» ጋር የተያያዘው «ም» ይህን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐργατῶν
  choice: ሠራተኞቹ
  rationale: በወይን አትክልት ለመሥራት የተቀጠሩትን ሰዎች በግልጽና በዘመናዊ አማርኛ ይገልጻል።
- source_word: ἐκ δηναρίου
  choice: በአንድ ዲናር
  rationale: የተስማሙበትን የደመወዝ መጠን ያሳያል፤ የጥንቱን የገንዘብ ስም ከዘመናዊ ገንዘብ ጋር ሳይተካ ይጠብቃል።
- source_word: τὴν ἡμέραν
  choice: ለዕለቱ
  rationale: የተስማሙበት ክፍያ ለዚያ የሥራ ቀን መሆኑን በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀπέστειλεν
  choice: ላካቸው
  rationale: የግሪኩን መደበኛ የትረካ ግስና የብዙ ቁጥር ተሳቢውን በቀጥታ ይወክላል።
- source_word: ἀμπελῶνα
  choice: የወይኑ አትክልት
  rationale: ወይን የሚተከልበትን ቦታ በግልጽና በተለመደ አማርኛ ይገልጻል።
- source_word: αὐτοῦ
  choice: የወይኑ
  rationale: በአማርኛው ግንባታ «የወይኑ አትክልት» የተባለው ቦታ የቤቱ ባለቤት ንብረት መሆኑ ከአውዱ ይገባል፤ አሻሚ የሆነ «የእሱ» አገላለጽ ተወግዷል።
