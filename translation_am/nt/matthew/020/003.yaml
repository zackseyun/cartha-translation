  text: καὶ ἐξελθὼν περὶ τρίτην ὥραν εἶδεν ἄλλους ἑστῶτας ἐν τῇ ἀγορᾷ ἀργούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/003.yaml
  text: And going out about the third hour[b][a], he saw others standing idle in the marketplace.
translation:
  language: am
  text: እርሱም በሦስተኛው ሰዓት አካባቢ[a] ወጥቶ፣ በገበያ አደባባይ ሥራ ፈት ሆነው[b] የቆሙ ሌሎችን አየ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከጠዋቱ 9:00 አካባቢ።” “ሦስተኛው ሰዓት” የሚለው ከፀሐይ መውጫ ጀምሮ ቀኑን በሚቆጥረው የአይሁድ የሰዓት አቆጣጠር ነው።
    reason: cultural_note
  - marker: b
    text: ወይም፣ “ሥራ የሌላቸው።” የግሪኩ ቃል “ሥራ ፈት” የሚል ሲሆን፣ በዚያ ጊዜ በሥራ ላይ እንዳልነበሩ ይገልጣል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: ወጥቶ
  rationale: የግሪኩን የቀደመ ድርጊትና ተከታታይነት በተፈጥሯዊ የአማርኛ ግስ ቅርጽ ያሳያል።
- source_word: περὶ τρίτην ὥραν
  choice: በሦስተኛው ሰዓት አካባቢ
  rationale: የጥንቱን የአይሁድ የቀን ሰዓት አቆጣጠር በዋናው ጽሑፍ ይጠብቃል፤ ዘመናዊ የሰዓት አቻው በማስታወሻ ተገልጿል።
- source_word: εἶδεν
  choice: አየ
  rationale: ቀላልና ቀጥተኛ የትረካ አቻ ነው።
- source_word: ἄλλους
  choice: ሌሎችን
  rationale: በግሪኩ ያልተጨመረውን የፆታ መለያ ሳያክል ስማዊ አጠቃቀሙን ያስተላልፋል።
- source_word: ἑστῶτας
  choice: የቆሙ
  rationale: የቆዩበትን የመቆም ሁኔታ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἀγορᾷ
  choice: ገበያ አደባባይ
  rationale: ሰዎች ለንግድና ለሥራ የሚሰበሰቡበትን የሕዝብ ስፍራ ከቀላል ‘ገበያ’ ይበልጥ ግልጽ ያደርጋል።
- source_word: ἀργούς
  choice: ሥራ ፈትተው
  rationale: በዚያ ጊዜ በሥራ ላይ አለመሆናቸውን ያሳያል፤ ዘመናዊ የኢኮኖሚ ምድብ የሆነውን ‘ሥራ አጥ’ በዋናው ጽሑፍ አያስገባም።
