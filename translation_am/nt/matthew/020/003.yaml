    rationale: The Greek καί simply coordinates the clause; it does not explicitly say that he went out “again.” እርሱም is a more neutral narrative equivalent.
  - severity: medium
    issue: ሥራ ፈትተው is awkward/unclear in this syntax.
    rationale: For people who were standing without work, ሥራ ፈት ሆነው is idiomatic and directly expresses the contextual sense of ἀργούς.
  - severity: low
