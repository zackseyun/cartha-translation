id: MAT.20.7
reference: Matthew 20:7
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ· Ὅτι οὐδεὶς ἡμᾶς ἐμισθώσατο. λέγει αὐτοῖς· Ὑπάγετε καὶ ὑμεῖς εἰς τὸν ⸀ἀμπελῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/007.yaml
  text: They said to him[a], “Because no one has hired us.” He says to them, “You also go into the vineyard.”
translation:
  language: am
  text: እነርሱም፣ “ማንም ስላልቀጠረን ነው” አሉት። እርሱም፣ “እናንተም ወደ ወይኑ እርሻ ሂዱ” አላቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγουσιν
  choice: አሉት
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ ቅርጽ በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜ ሆኖ ተተርጉሟል፤ ነጠላው ተውላጠ ስም የንግግሩን ተቀባይ ያመለክታል።
- source_word: Ὅτι
  choice: ስላል... ነው
  rationale: በመልሳቸው ውስጥ የሰጡትን ምክንያት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οὐδεὶς
  choice: ማንም
  rationale: ከአሉታዊው ግስ ጋር የግሪኩን ‘ማንም ሰው የለም’ ትርጉም በግልጽ አማርኛ ያስተላልፋል።
- source_word: ἐμισθώσατο
  choice: አልቀጠረን
  rationale: ግሱ ለሥራ በደመወዝ መቅጠርን ያመለክታል፤ አውዱም እስከዚያ ሰዓት ድረስ እንዳልተቀጠሩ ያሳያል።
- source_word: λέγει
  choice: አላቸው
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜ ሆኖ ተሰጥቷል።
- source_word: Ὑπάγετε
  choice: ሂዱ
  rationale: ወደ ሥራ ቦታው እንዲሄዱ የሚሰጥ ቀጥተኛ ትእዛዝ ነው።
- source_word: καὶ ὑμεῖς
  choice: እናንተም
  rationale: እነዚህም ከቀደሙት ጋር እንደተካተቱ የሚያሳየውን አጽንዖት ይጠብቃል።
- source_word: ἀμπελῶνα
  choice: የወይኑ እርሻ
  rationale: በዘመናዊ አማርኛ የወይን ተክል የሚበቅልበትን እርሻ በግልጽና በተፈጥሯዊ ሁኔታ ይገልጻል።
