  text: ⸀οὐκ ἔξεστίν μοι ⸂ὃ θέλω ποιῆσαι⸃ ἐν τοῖς ἐμοῖς; ⸀ἢ ὁ ὀφθαλμός σου πονηρός ἐστιν ὅτι ἐγὼ ἀγαθός εἰμι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/015.yaml
  text: Is it not lawful for me to do what I want with what is mine? Or is your eye evil because I am good?[a]
translation:
  language: am
  text: በራሴ ንብረት የምፈልገውን ማድረግ አይፈቀድልኝምን? ወይስ እኔ መልካም ስለሆንሁ ዓይንህ ክፉ ነው?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “እኔ መልካም ስለሆንሁ ትቀናለህ?” “ዓይንህ ክፉ ነው” የሚለው የግሪክ ፈሊጥ ቅናትን ወይም ሌላው በጎ ነገር ሲያገኝ በቅሬታ መመልከትን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξεστίν
  choice: አይፈቀድልኝምን?
  rationale: የመፈቀድንና ሕጋዊ መብትን ፍቺ የሚያስተላልፍ ሲሆን፣ የጥያቄውን አጻጻፍ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ὃ θέλω ποιῆσαι
  choice: የፈለግሁትን ማድረግ
  rationale: θέλω የግል ፈቃድን ይገልጣል፤ ይህ አተረጓጎም ቀጥተኛና ዘመናዊ ነው።
- source_word: ἐν τοῖς ἐμοῖς
  choice: በገንዘቤ
  rationale: ቃሉ በጥቅሉ ‘በራሴ ንብረት’ ማለት ቢሆንም፣ በምሳሌው የደመወዝ ክፍያ አውድ ውስጥ ‘በገንዘቤ’ የባለቤትነቱን ሐሳብ በግልጽና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὁ ὀφθαλμός σου πονηρός
  choice: ዓይንህ ክፉ ሆነ
  rationale: የግሪኩን ‘ክፉ ዓይን’ ፈሊጣዊ ምስልና ከἀγαθός ጋር ያለውን ተቃርኖ በዋናው ጽሑፍ ይጠብቃል፤ የቅናት ፍቺው በማስታወሻ ተብራርቷል።
- source_word: ἀγαθός
  choice: መልካም
  rationale: የቃሉን መሠረታዊ ‘መልካም’ ፍቺ ይጠብቃል፤ በአውዱ ልግስናን ቢያመለክትም ትርጉሙን ወደ ‘ለጋስ’ ብቻ አይገድብም።
theological_decisions:
- issue: ὁ ὀφθαλμός σου πονηρός የሚለውን ፈሊጥ በዋናው ጽሑፍ መተርጎም ወይስ ምስሉን መጠበቅ
  choice: ‘ዓይንህ ክፉ ሆነ’ የሚለውን ምስል በዋናው ጽሑፍ መጠበቅ
  alternative: ‘እኔ ለጋስ ስለሆንሁ ቀናህ?’
  rationale: ይህ አማራጭ የቅናትን ፍቺ በግልጽ ቢያሳይም፣ በ‘ክፉ’ ዓይንና በጌታው ‘መልካምነት’ መካከል ያለውን የምንጩን ተቃርኖ ያሳጣል። ስለዚህ አሻሚነቱና ሥነ-መለኮታዊ ውጥረቱ ተጠብቆ፣ ፈሊጣዊ ፍቺው በግርጌ ማስታወሻ ተገልጧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ‘ክፉ ዓይን’ ምስል ሆን ተብሎ ተጠብቋል፤ የደመወዝ አውዱን ለማጉላት ἐν τοῖς ἐμοῖς ‘በገንዘቤ’ ተብሏል።
