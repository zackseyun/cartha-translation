  rationale: ἀπό ከቦታ የመነሳትን ወይም ከቦታው ርቆ መንቀሳቀስን ያመለክታል፤ «ከኢያሪኮ» ይህን በአጭርና በተፈጥሯዊ አማርኛ ይገልጣል።
