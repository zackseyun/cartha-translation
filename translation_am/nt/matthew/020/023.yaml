  to: እርሱም፣ “ጽዋዬን ትጠጣላችሁ፤[a] ነገር ግን በቀኝ በኩሌና በግራ በኩሌ መቀመጥን መስጠት የእኔ አይደለም፤ ይህ ግን በአባቴ ለተዘጋጀላቸው ነው” አላቸው።
