  naturalness: The wording is generally clear, but “በቀኜና በግራዬ” is less idiomatic for the two sides of a person than “በቀኝ በኩሌና በግራ በኩሌ.”
  terminology: “ጽዋ” appropriately preserves the biblical metaphor without interpreting it in the text. “አባቴ” correctly renders “my Father.” No doctrinal qualification should be added to the statement that granting these places is not Jesus’ to give.
