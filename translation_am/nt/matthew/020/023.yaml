id: MAT.20.23
reference: Matthew 20:23
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀λέγει αὐτοῖς· Τὸ μὲν ποτήριόν μου ⸀πίεσθε, τὸ δὲ καθίσαι ἐκ δεξιῶν μου καὶ ἐξ ⸀εὐωνύμων οὐκ ἔστιν ⸀ἐμὸν δοῦναι, ἀλλ’ οἷς ἡτοίμασται ὑπὸ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/023.yaml
  text: He said to them[a], “You will indeed drink my cup, but to sit at my right and at my left is not mine to grant[b], but it is for those for whom it has been prepared by my Father.”
translation:
  language: am
  text: እርሱም፣ “ጽዋዬን ትጠጣላችሁ፤[a] ነገር ግን በቀኝ በኩሌና በግራ በኩሌ መቀመጥን መስጠት የእኔ አይደለም፤ ይህ ግን በአባቴ ለተዘጋጀላቸው ነው” አላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ጽዋ” ኢየሱስ የተመደበለትን መከራ ወይም ዕጣ የሚወክል ምሳሌያዊ አገላለጽ ነው፤ ደቀ መዛሙርቱም ከዚህ ይካፈላሉ።
    reason: cross_reference
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: አላቸው
  rationale: የግሪክ ታሪካዊ የአሁን ጊዜ አገላለጽን በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜ ተርጉሟል።
- source_word: Τὸ μὲν ποτήριόν μου πίεσθε
  choice: ጽዋዬን ትጠጣላችሁ
  rationale: የወደፊት ጊዜውን በቀጥታ ይጠብቃል፤ μὲν የሚያሳየው ማረጋገጫና ከቀጣዩ ንግግር ጋር ያለው ንጽጽር በአንቀጹ አወቃቀርና በ“ነገር ግን” ተገልጧል። የጽዋው ምስላዊ አገላለጽ ሳይፈታ ተጠብቋል።
- source_word: καθίσαι ἐκ δεξιῶν μου καὶ ἐξ εὐωνύμων
  choice: በቀኜና በግራዬ መቀመጥን
  rationale: ከኢየሱስ በሁለቱ ወገኖች ያሉትን የክብር ስፍራዎች በተፈጥሯዊና ግልጽ አማርኛ ያሳያል።
- source_word: οὐκ ἔστιν ἐμὸν δοῦναι
  choice: መስጠት የእኔ አይደለም
  rationale: δοῦναι የሚለውን በቀጥታ “መስጠት” ብሎ ይተረጉማል፤ የምንጩን አጭርነትና የሥነ መለኮት ውጥረት ያለ ተጨማሪ ማብራሪያ ይጠብቃል።
- source_word: ἀλλ’ οἷς ἡτοίμασται ὑπὸ τοῦ πατρός μου
  choice: ይህ በአባቴ ለተዘጋጀላቸው ነው
  rationale: በግሪክ ያለውን ስውር የአረፍተ ነገር ክፍል ለአማርኛ ግልጽነት “ይህ ... ነው” በማለት ያሟላል፤ ፍጹም ተደራጊ ግሱን “ለተዘጋጀላቸው” ብሎ ይጠብቃል።
theological_decisions:
- issue: “መስጠት የእኔ አይደለም” የሚለው ክርስቶሎጂያዊ አንድምታ
  choice: ንግግሩን ያለ ማስተካከያ በቀጥታ ማቅረብ
  alternative: “ከአብ ተለይቼ ልሰጥ የእኔ አይደለም” የሚል ወይም ሌላ የሚያስማማ ማብራሪያ መጨመር
  rationale: ምንጩ የሚያቀርበውን ሥነ መለኮታዊ ውጥረት ትርጉሙ አይፈታውም፤ “ብቻ” ወይም “ከአብ ተለይቶ” የሚል ያልተጻፈ ሐሳብም አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ጽዋ” የመጽሐፍ ቅዱስን ምስላዊ አገላለጽ ለመጠበቅ ተመርጧል።
