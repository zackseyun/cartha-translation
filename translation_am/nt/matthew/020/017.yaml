  text: ኢየሱስም ወደ ኢየሩሳሌም እየወጣ ሳለ፣ አሥራ ሁለቱን ደቀ መዛሙርት ከሌሎች ለይቶ ወሰዳቸው፤ በመንገድ ላይም አላቸው፦
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβαίνων
  choice: እየወጣ ሳለ
  rationale: የአሁን ጊዜ አካፋይ መሆኑንና ድርጊቱ ከπαρέλαβεν ጋር በአንድ ጊዜ መከናወኑን ያሳያል፤ ወደ ኢየሩሳሌም ‘መውጣት’ የቦታውን ከፍታና የተለመደውን የትረካ አገላለጽ ይጠብቃል።
- source_word: εἰς Ἱεροσόλυμα
