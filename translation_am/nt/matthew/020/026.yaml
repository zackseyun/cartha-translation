  text: እንዲህ ግን በእናንተ መካከል አይሆንም፤[a] ነገር ግን በእናንተ መካከል ታላቅ ለመሆን የሚፈልግ ማንም የእናንተ አገልጋይ ይሁን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እንዲህ ግን በእናንተ መካከል አይደለም።» የግሪኩ ጽሑፍ የወደፊት ጊዜ ግስ («አይሆንም») ይጠቀማል፤ ይህም በኢየሱስ ተከታዮች መካከል ነገሩ እንዴት መሆን እንደማይገባው ሊገልጽ ይችላል።
