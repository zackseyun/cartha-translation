review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the future-negative statement, the indefinite volitional clause, the ingressive sense of becoming great, and διάκονος as a servant rather than an ecclesial office. A minor adjustment makes the repeated ἐν ὑμῖν consistently mean “among you,” rather than “from among you.”
  naturalness: The wording is clear modern standard Amharic. Placing እንዲህ first is more idiomatic for the emphatic οὐχ οὕτως, and removing the unnecessary ግን from the first clause avoids loading the contrast twice; ነገር ግን adequately renders ἀλλά.
  terminology: ታላቅ ለመሆን, የሚፈልግ ማንም, and የእናንተ አገልጋይ appropriately preserve the source sense. አገልጋይ is suitable here and does not imply the later office of deacon.
  issues:
  - severity: low
    issue: The second occurrence of ἐν ὑμῖν is rendered ከእናንተ መካከል.
    rationale: Although understandable, ከ... መካከል more specifically means “from among you.” The Greek repeats ἐν ὑμῖν (“among you”), so በእናንተ መካከል is the closer and equally natural rendering.
  - severity: low
    issue: The first clause contains ግን in addition to ነገር ግን introducing the following clause.
    rationale: The Greek contrast is expressed by ἀλλά before the second clause. Retaining ነገር ግን there is sufficient; omitting the first ግን yields smoother Amharic without affecting meaning.
