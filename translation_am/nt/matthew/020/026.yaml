lexical_decisions:
- source_word: οὐχ οὕτως ἔσται ἐν ὑμῖν
  choice: በእናንተ መካከል ግን እንዲህ አይሆንም
  rationale: የግሪኩን የወደፊት ጊዜ ግስ ἔσται በ«አይሆንም» ጠብቆ፣ ይህ አነጋገር የኢየሱስ ተከታዮች ማኅበረሰብ እንዴት መሆን እንደማይገባው የሚገልጽ መመሪያ መሆኑን ያሳያል። ἐν ὑμῖν በተፈጥሯዊ አማርኛ «በእናንተ መካከል» ተብሏል።
- source_word: ἀλλ’ ὃς ἂν θέλῃ
  choice: ነገር ግን ... የሚፈልግ ማንም
  rationale: ὃς ἂν ከንዑስ አድራጊ ግስ ጋር አጠቃላይና ያልተወሰነ ሰውን ያመለክታል፤ «የሚፈልግ ማንም» ይህን በግልጽ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: μέγας γενέσθαι
  choice: ታላቅ ለመሆን
  rationale: γενέσθαι ወደ አንድ ሁኔታ መድረስን የሚያመለክተውን «መሆን» ይዞ የታላቅነት ምኞቱን ይጠብቃል።
- source_word: διάκονος
  choice: አገልጋይ
  rationale: በዚህ አውድ διάκονος ሌሎችን የሚያገለግል ሰውን ያመለክታል። «አገልጋይ» የኋለኛውን የቤተ ክርስቲያን ሹመት ሳያስገባ የአገልግሎትን ትርጉም ያቆያል፤ እንዲሁም δοῦλος የሚያጎላውን የባርነት ሁኔታ አያክልም።
- source_word: ὑμῶν
  choice: የእናንተ
  rationale: የባለቤትነት ቅርጹን በተፈጥሯዊ አማርኛ «የእናንተ አገልጋይ» በማለት የግንኙነቱን ሐሳብ ያስተላልፋል።
theological_decisions:
- issue: በኢየሱስ ተከታዮች ማኅበረሰብ ውስጥ የታላቅነት ባሕርይ
  choice: የዓለማዊ ሥልጣን ተዋረድን የሚገለብጥ መመሪያ አድርጎ መተርጎምና ግልጽ የአገልጋይነት ቋንቋውን መጠበቅ
  alternative: διάκονοςን የቤተ ክርስቲያን ሹመት አድርጎ መተርጎም ወይም አገልጋይነቱን በአጠቃላይ ትሕትና ብቻ መተካት
  rationale: የአውዱ ንጽጽር በአሕዛብ ገዥዎች የሥልጣን አጠቃቀምና ኢየሱስ ለደቀ መዛሙርቱ ባስቀመጠው መለኪያ መካከል ነው። ትርጉሙ የኋለኛ ዘመን ተቋማዊ ሹመትን ሳያስገባና የአገልግሎትን ተጨባጭ ምስል ሳያደበዝዝ ይህን ንጽጽር ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። «ይሁን» የግሪኩን የመመሪያ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
