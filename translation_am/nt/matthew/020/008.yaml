id: MAT.20.8
reference: Matthew 20:8
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὀψίας δὲ γενομένης λέγει ὁ κύριος τοῦ ἀμπελῶνος τῷ ἐπιτρόπῳ αὐτοῦ· Κάλεσον τοὺς ἐργάτας καὶ ἀπόδος ⸀αὐτοῖς τὸν μισθὸν ἀρξάμενος ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/008.yaml
  text: When evening came, the master of the vineyard says to his steward, ‘Call the workers and pay them their wages, beginning with the last and ending with the first.’
translation:
  language: am
  text: ማታ ሲሆን፣ የወይን እርሻው ባለቤት አስተዳዳሪውን፣ “ሠራተኞቹን ጥራና ከመጨረሻዎቹ ጀምረህ እስከ መጀመሪያዎቹ ድረስ ደመወዛቸውን ክፈላቸው” ይለዋል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀψίας
  choice: ማታ
  rationale: የግሪኩን የቀን ጊዜ አመልካች በተፈጥሯዊና በዘመናዊ አማርኛ ይገልጻል።
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: የወይኑ ቦታ ባለቤት
  rationale: κύριος በዚህ የምሳሌ አውድ የንብረቱን ባለቤት ያመለክታል፤ የመለኮታዊ ማዕረግ ትርጉም አልተጫነበትም።
- source_word: τῷ ἐπιτρόπῳ
  choice: አስተዳዳሪውን
  rationale: የባለቤቱን ጉዳይ በኃላፊነት የሚያስተዳድር ሰው የሚለውን ትርጉም በግልጽ ያስተላልፋል።
- source_word: ἀπόδος αὐτοῖς τὸν μισθὸν
  choice: ደመወዛቸውን ክፈላቸው
  rationale: ለተሠራ ሥራ የሚሰጥ ክፍያን በተለመደ አማርኛ ይገልጻል።
- source_word: ἀρξάμενος ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων
  choice: ከመጨረሻዎቹ ጀምረህ እስከ መጀመሪያዎቹ ድረስ
  rationale: የክፍያውን ቅደም ተከተል ሳይጨምር ወይም ሳይቀንስ ያቆያል።
- source_word: λέγει
  choice: ይለዋል
  rationale: የግሪኩን ታሪካዊ የአሁን ጊዜ ቅርጽ ጠብቆ የትረካውን ቅጽበታዊነት ያስተላልፋል።
theological_decisions:
- issue: κύριος የሚለው ቃል እንደ መለኮታዊ ማዕረግ ወይስ እንደ ንብረት ባለቤት መተርጎም
  choice: ባለቤት
  alternative: ጌታ
  rationale: በቀጥተኛው የምሳሌው ትዕይንት ቃሉ የወይኑን ቦታ ባለቤት ያመለክታል፤ የምሳሌውን ሰፊ ትርጉም በትርጉሙ ውስጥ በቅድሚያ አይወስንም።
- issue: ታሪካዊውን የአሁን ጊዜ λέγει ማቆየት
  choice: ይለዋል
  alternative: አለው
  rationale: የምንጩን ሰዋሰዋዊ ገጽታና የትረካ ቅርበት ለመጠበቅ የአሁን ጊዜ ተጠቅሟል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ፤ የግሪኩ ታሪካዊ የአሁን ጊዜ ተጠብቋል።
