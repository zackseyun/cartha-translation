  yaml_path: translation/nt/matthew/020/009.yaml
  text: And those who came about the eleventh hour received a denarius each[a].
translation:
  language: am
  text: በአሥራ አንደኛው ሰዓት አካባቢ የመጡትም እያንዳንዳቸው አንድ ዲናር[a] ተቀበሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ዲናር በሮማውያን ዘንድ የተለመደ የብር ሳንቲም ሲሆን፣ በአብዛኛው ለሠራተኛ የአንድ ቀን ደመወዝ ያህል እንደነበር ይታሰባል።
    reason: cultural_note
lexical_decisions:
- source_word: καὶ
  choice: -ም
  rationale: ቀላሉን የትረካ ትስስር በተፈጥሯዊ አማርኛ ያስቀጥላል፤ በግሪኩ የሌለ ተጨማሪ የጊዜ ፍቺ አያስገባም።
- source_word: ἐλθόντες
  choice: የመጡት
  rationale: የግሪኩን የአኦሪስት አጋዥ ግስ ከቡድኑ ጋር በተፈጥሯዊ አማርኛ ያያይዛል።
- source_word: οἱ περὶ τὴν ἑνδεκάτην ὥραν
  choice: በአሥራ አንደኛው ሰዓት አካባቢ የመጡት
  rationale: περὶ ያለውን የግምት ጊዜ በ«አካባቢ» ያስቀምጣል፤ ከአውዱ የሚገባውን «የተቀጠሩት» የሚል ቃል በግልጽ ስላልተጻፈ አይጨምርም።
- source_word: ἔλαβον
  choice: ተቀበሉ
  rationale: በደመወዝ ክፍያ አውድ «ተቀበሉ» ትክክለኛና ተፈጥሯዊ ነው።
- source_word: ἀνὰ
  choice: እያንዳንዳቸው
  rationale: የἀνάን አከፋፋይ ፍቺ፣ ማለትም ለእያንዳንዱ አንድ መሆኑን፣ ግልጽ ያደርጋል።
- source_word: δηνάριον
  choice: አንድ ዲናር
  rationale: ታሪካዊውን የሮማውያን ሳንቲም ስም ይጠብቃል፤ ግምታዊ ዋጋውን በዋናው ጽሑፍ አይተካም።
