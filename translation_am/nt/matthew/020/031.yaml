base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/031.yaml
  text: But the crowd rebuked them so that they would be silent[a]. Yet they cried out all the more, saying, “Lord, have mercy on us[b], Son of David.”
translation:
  language: am
  text: ሕዝቡ ግን ዝም እንዲሉ ገሠጻቸው፤ እነርሱ ግን ይበልጥ[a] ጮኹ፤ “ጌታ ሆይ፣ ማረን፣ የዳዊት ልጅ![b]” አሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ይበልጥ ከፍ ባለ ድምፅ»። የግሪኩ ንጽጽራዊ ቃል በአጠቃላይ ጩኸታቸው መጠናከሩን ወይም በተለይ የድምፃቸውን ከፍ ማለት ሊያጎላ ይችላል።
    reason: lexical_alternative
  - marker: b
    text: «የዳዊት ልጅ» የዘር ሐረግን ብቻ የሚገልጽ ሳይሆን መሲሓዊ ማዕረግ ነው።
    reason: cultural_note
lexical_decisions:
- source_word: ὄχλος
  choice: ሕዝቡ
  rationale: በትረካው አውድ ὄχλος በቦታው የተሰበሰበውን ብዙ ሰው ያመለክታል፤ «ሕዝቡ» ተፈጥሯዊና ግልጽ ነው።
- source_word: ἐπετίμησεν
  choice: ገሠጻቸው
  rationale: ቃሉ ጠንካራ ወቀሳን ወይም ተግሣጽን ያሳያል፤ «ገሠጻቸው» ሕዝቡ ዝም ሊያሰኛቸው ያደረገውን ጫና ይጠብቃል።
- source_word: ἵνα σιωπήσωσιν
  choice: ዝም እንዲሉ
  rationale: የἵνα ሐረጉን የዓላማ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: μεῖζον
  choice: ከዚህ ይበልጥ
  rationale: ንጽጽራዊው ቃል ጩኸታቸው በኃይል ወይም በድምፅ መጨመሩን ሳይገድብ ያሳያል።
- source_word: ἔκραξαν
  choice: ጮኸው
  rationale: κράζω ከፍ ባለ ድምፅና በጽኑ መጣራትን ያመለክታል፤ «ጮኸው» በአማርኛ ቀጥተኛና ተፈጥሯዊ ነው።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: ለኢየሱስ የቀረበውን የክብር አድራሻና ሊኖረው የሚችለውን ክርስቶሳዊ ክብደት ሳያጠብ «ጌታ ሆይ» ያቆያል።
- source_word: ἐλέησον ἡμᾶς
  choice: ማረን
  rationale: የምሕረት ጥያቄውን በአጭር፣ በተለመደና በክብር ባለው ዘመናዊ አማርኛ ያቀርባል።
- source_word: υἱὸς Δαυίδ
  choice: የዳዊት ልጅ
  rationale: በማቴዎስ ውስጥ ያለውን መሲሓዊ ማዕረግና ንጉሣዊ አንድምታ ለመጠበቅ ቃል በቃል ቀርቧል።
theological_decisions:
- issue: ለኢየሱስ የተሰጠው መሲሓዊ ማዕረግ
  choice: υἱὸς Δαυίδን «የዳዊት ልጅ» ብሎ ማቅረብ
  alternative: «የዳዊት ዘር»
  rationale: ሐረጉ ከዘር ሐረግ መግለጫ በላይ በማቴዎስ ትረካ ውስጥ የመሲሕነትና የንግሥና ማዕረግ ነው፤ ቀጥተኛው ትርጉም ይህን ክብደት ይጠብቃል።
- issue: κύριος ለኢየሱስ እንደ አድራሻ መጠቀሙ
  choice: «ጌታ ሆይ»
  alternative: «መምህር ሆይ»
  rationale: በዚህ አውድ ቃሉ የክብር አድራሻ ሊሆን ሲችል ክርስቶሳዊ አንድምታም ሊኖረው ይችላል፤ «ጌታ» ይህን ውጥረት ሳይፈታ ይጠብቃል።
