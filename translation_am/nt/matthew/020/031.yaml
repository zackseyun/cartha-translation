  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ተቃርኖ በ«ግን» ተጠብቋል፤ መሲሓዊው ማዕረግና የκύριος ትርጉማዊ ውጥረት አልተጠበበም።
