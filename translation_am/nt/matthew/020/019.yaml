review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the handing over to non-Jewish authorities, the three coordinated purposes, and the third-day resurrection. However, the rendering of σταυρῶσαι as እንዲሰቅሉት can be ambiguous in modern Amharic without explicitly identifying crucifixion, and the footnote contains a malformed and unintelligible expression.
  naturalness: The sentence is generally natural and appropriately formal. Moving the purpose clause after the act of handing over produces a clearer Amharic progression. በመስቀል እንዲሰቅሉት is clearer than the unqualified እንዲሰቅሉት.
  terminology: ለአሕዛብ appropriately represents τοῖς ἔθνεσιν in this context. ያፌዙበታል and ይገርፉታል are suitable. The resurrection main text retains the idiomatic ይነሣል; the note should accurately identify the Greek passive without using the erroneous form ይነሣልለታል.
  issues:
  - severity: medium
    issue: The footnote’s phrase “ይነሣልለታል” is malformed and not intelligible Amharic.
    rationale: It fails to communicate the intended alternative/passive nuance and should be replaced with a grammatical explanation of the Greek passive.
  - severity: low
    issue: እንዲሰቅሉት does not by itself explicitly specify crucifixion.
    rationale: In contemporary Amharic it may be understood more broadly as hanging. Adding በመስቀል makes the meaning of σταυρῶσαι precise.
  revised_text: ለአሕዛብ አሳልፈው ይሰጡታል፤ እንዲያፌዙበት፣ እንዲገርፉትና በመስቀል እንዲሰቅሉት፤ በሦስተኛውም ቀን ይነሣል።[a]
