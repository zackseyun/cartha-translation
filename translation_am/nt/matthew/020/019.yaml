id: MAT.20.19
reference: Matthew 20:19
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ παραδώσουσιν αὐτὸν τοῖς ἔθνεσιν εἰς τὸ ἐμπαῖξαι καὶ μαστιγῶσαι καὶ σταυρῶσαι, καὶ τῇ τρίτῃ ἡμέρᾳ ⸀ἐγερθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/019.yaml
  text: and they will hand him over to the Gentiles to mock and flog and crucify[a], and on the third day he will be raised.
translation:
  language: am
  text: ለአሕዛብ አሳልፈው ይሰጡታል፤ እንዲያፌዙበት፣ እንዲገርፉትና በመስቀል እንዲሰቅሉት፤ በሦስተኛውም ቀን ይነሣል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ያስነሡታል።” የግሪኩ ግስ ተደራጊ ቅርጽ ነው፤ “ይነሣል” የሚለው ተለመደ የትንሣኤ አገላለጽ ቢሆንም፣ ይህ ቅርጽ እግዚአብሔር ያስነሣዋል የሚለውን ፍንጭ ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: παραδώσουσιν
  choice: አሳልፈው ይሰጡታል
  rationale: ወደ ሌሎች ሥልጣንና እጅ አሳልፎ የመስጠትን ፍቺ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ‘ይከዱታል’ የሚለውን ይበልጥ የተወሰነ ፍቺ አያስገባም።
- source_word: τοῖς ἔθνεσιν
  choice: ለአሕዛብ
  rationale: በዚህ የመከራ ትንቢት አውድ ከአይሁድ ውጭ ያሉትን፣ በተለይም የሮም ባለሥልጣናትን ያመለክታል።
- source_word: εἰς τὸ ἐμπαῖξαι
  choice: እንዲያፌዙበት
  rationale: የዓላማውን ግንኙነትና በእርሱ ላይ የሚፈጸመውን ማፌዝ በተፈጥሯዊ መንገድ ይገልጣል።
- source_word: μαστιγῶσαι
  choice: እንዲገርፉት
  rationale: የፍርድ ቅጣት የሆነውን በጅራፍ መምታት በዘመናዊና ግልጽ አማርኛ ያሳያል።
- source_word: σταυρῶσαι
  choice: እንዲሰቅሉት
  rationale: በአዲስ ኪዳን አውድ ‘መስቀል ላይ መስቀል’ የሚለውን ማለትም በመስቀል መግደልን በተለመደ አጭር አማርኛ ይገልጣል።
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: በሦስተኛውም ቀን
  rationale: የጊዜውን ሐረግ ‘በሦስተኛው ቀን’ ብሎ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐγερθήσεται
  choice: ይነሣል
  rationale: የግሪኩ ቅርጽ የወደፊት ጊዜ ተደራጊ ቢሆንም የአማርኛው ‘ይነሣል’ በትንሣኤ አውድ ተፈጥሯዊ ነው፤ አድራጊውን በግልጽ አይጠቅስም። የቅርጹ ልዩነት በግርጌ ማስታወሻ ተጠብቋል።
theological_decisions:
- issue: የትንሣኤው ግስ ድምፅ
  choice: ይነሣል
  alternative: ይነሣል፣ ማለትም ይነሣልለታል / ከሙታን ይነሣል
  rationale: የግሪኩ ἐγερθήσεται ተደራጊ ቅርጽ ሲሆን የእግዚአብሔርን ድርጊት ሊያመለክት ይችላል። ቀጥተኛ ተደራጊ አማርኛ ግን በዚህ ሐረግ ከባድና ያልተፈጥሯዊ ስለሚሆን፣ ዋናው ጽሑፍ የተለመደውን ‘ይነሣል’ ተጠቅሟል፤ ተደራጊነቱና የመለኮታዊ ድርጊት ፍንጭ በማስታወሻ ተገልጧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ። ‘አሕዛብ’ መጽሐፍ ቅዱሳዊ ቃል ቢሆንም በዚህ አውድ ‘አይሁድ ያልሆኑትን’ በትክክል ይገልጣል።
