  edition: SBLGNT
  text: ⸂καὶ ἐλθόντες⸃ οἱ πρῶτοι ἐνόμισαν ὅτι ⸀πλεῖον λήμψονται· καὶ ἔλαβον ⸂τὸ ἀνὰ δηνάριον καὶ αὐτοί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/010.yaml
  text: When the first ones came[a], they thought they would receive more[b], but they too received a denarius each.
translation:
  language: am
  text: በመጀመሪያ የተቀጠሩትም በመጡ ጊዜ[a] የበለጠ እንደሚቀበሉ አሰቡ፤ እነርሱም ደግሞ እያንዳንዳቸው አንድ ዲናር ተቀበሉ[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የመጀመሪያዎቹ በመጡ ጊዜ”፤ አገላለጹ በምሳሌው ውስጥ በመጀመሪያ የተቀጠሩትን ሠራተኞች ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ዲናር በዚያ ዘመን ለአንድ ሠራተኛ የተለመደ የአንድ ቀን ደመወዝ ነበር።
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντες
  choice: በመጡ ጊዜ
  rationale: የግሪኩ ያለፈ ጊዜ አሳታፊ ግስ በዐውዱ የጊዜ ተግባር ስላለው፣ የትረካውን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οἱ πρῶτοι
  choice: በመጀመሪያ የተቀጠሩት
  rationale: ቃሉ በምሳሌው ውስጥ አስቀድመው የተቀጠሩትን ሠራተኞች ያመለክታል፤ በአማርኛ ይህን ማብራራት የቡድኑን ማንነት በግልጽ ያቀርባል።
- source_word: ἐνόμισαν
  choice: መሰላቸው
  rationale: በዚህ ዐውድ የነበራቸውን ግምትና ተስፋ የሚገልጽ ተፈጥሯዊ አማርኛ ነው፤ እርግጠኝነትን አያስገባም።
- source_word: πλεῖον
  choice: የበለጠ
  rationale: የክፍያውን ብዛት በንጽጽር የሚያመለክተውን አጭርና ተፈጥሯዊ አገላለጽ ይጠብቃል።
- source_word: λήμψονται
  choice: የሚቀበሉ
  rationale: ከቀድሞ ጊዜ የአስተሳሰብ ግስ በኋላ ያለውን የወደፊት ተስፋ በተፈጥሯዊ የአማርኛ ተዘዋዋሪ ንግግር ያሳያል።
- source_word: τὸ ἀνὰ δηνάριον
  choice: እያንዳንዳቸው አንድ ዲናር
  rationale: ἀνά ያለውን የማከፋፈል ትርጉም ‘እያንዳንዳቸው’ በማለት በግልጽ ያስተላልፋል፤ የገንዘቡን ስም እንደ ታሪካዊ መለኪያ ይጠብቃል።
- source_word: καὶ αὐτοί
  choice: እነርሱም
  rationale: ከሌሎቹ ጋር እኩል ክፍያ መቀበላቸውን የሚያጎላውን የግሪኩን ተጨማሪ አጽንዖት ይጠብቃል።
