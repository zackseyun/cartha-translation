  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμῖν εἴπῃ τι, ἐρεῖτε ὅτι Ὁ κύριος αὐτῶν χρείαν ἔχει· ⸀εὐθὺς δὲ ⸀ἀποστελεῖ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/003.yaml
  text: And if anyone says anything to you[a], you shall say[b], ‘The Lord has need of them,’ and he will send them at once.
translation:
  language: am
  text: ማንም ሰው አንዳች ነገር ቢላችሁ፣ “ጌታ[a] ያስፈልጉታል” በሉት፤ ወዲያውም ይልካቸዋል።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ባለቤት።”
    reason: κύριος በአውዱ ‘ጌታ’ ወይም ‘ባለቤት’ የሚል ትርጉም ሊኖረው ይችላል።
  - marker: b
    text: ‘ይልካቸዋል’ የሚለው ግስ ባለቤት በግሪኩ በግልጽ አልተጠቀሰም፤ በአውዱ በጣም ተፈጥሯዊው አመልካች ለደቀ መዛሙርቱ የሚናገረው ሰው ሲሆን፣ እርሱ እንስሳቱን ወዲያው ይልካቸዋል።
    reason: በግሪኩ የἀποστελεῖ ባለቤት በግልጽ ስም አልተጠቀሰም፤ የጽሑፉን አሻሚነት ሳያስወግድ አውዳዊውን አንባብ ያብራራል።
lexical_decisions:
- source_word: ἐάν τις ὑμῖν εἴπῃ τι
  choice: ማንም አንዳች ቢላችሁ
  rationale: የግሪኩን ክፍት የሁኔታ አገላለጽና ለብዙ ደቀ መዛሙርት የተነገረውን የብዙ ቁጥር ቅጽ ይጠብቃል። ‘ቢጠይቃችሁ’ ከማለት ይልቅ ‘ቢላችሁ’ የλέγωን ሰፊ ትርጉም ያስቀራል።
- source_word: ἐρεῖτε
  choice: በሉት
  rationale: የወደፊት ጊዜ ግስ እዚህ መመሪያዊ ኃይል ስላለው፣ ተፈጥሯዊው የአማርኛ ትእዛዝ ቅጽ ተመርጧል።
- source_word: Ὁ κύριος
  choice: ጌታ
  rationale: κύριος በዚህ አውድ ለኢየሱስ ሥልጣን የሚያመለክት ስያሜ ሊሆን ስለሚችል ‘ጌታ’ የትርጉሙን ክብደት ይጠብቃል፤ ‘ባለቤት’ የሚለው አማራጭ በማስታወሻ ተጠቅሷል።
- source_word: αὐτῶν χρείαν ἔχει
  choice: ያስፈልጉታል
  rationale: ‘ያስፈልጉታል’ የ‘ፍላጎት አለው’ን ፈሊጣዊ ትርጉም በተፈጥሯዊ አማርኛ ያቀርባል፣ የብዙ ቁጥር ተውላጠ ስምም ሁለቱን እንስሳት ያመለክታል።
- source_word: εὐθὺς
  choice: ወዲያው
  rationale: የድርጊቱን ፈጣንነት በግልጽና በተለመደ ዘመናዊ አማርኛ ያሳያል።
- source_word: ἀποστελεῖ αὐτούς
  choice: ይልካቸዋል
  rationale: ‘ይልካቸዋል’ በግሪኩ ያልተገለጸውን ‘መልሶ’ ወይም ‘ይፈታቸዋል’ የሚል ትርጉም ሳይጨምር ቀጥተኛውን ሐሳብ ይጠብቃል።
theological_decisions:
- issue: የὉ κύριος አመልካችና ኃይል
  choice: ጌታ
  alternative: ባለቤት
  rationale: ‘ጌታ’ በአፋጣኝ የተግባር አውድም ሆነ ለኢየሱስ የሚሰጠውን ሥልጣናዊ ስያሜ ክፍት አድርጎ ይጠብቃል፤ ‘ባለቤት’ ብቻ ቢባል የእንስሳቱን ሰብዓዊ ባለቤት ብቻ የሚያመለክት ሊመስል ይችላል።
- issue: በἀποστελεῖ የተደበቀው የግስ ባለቤት
  choice: እርሱም ወዲያው ይልካቸዋል
  alternative: ጌታም ወዲያው ይልካቸዋል
  rationale: ግሪኩ የግሱን ባለቤት በስም አይደግምም። በአውዱ በጣም ተፈጥሯዊው አመልካች ደቀ መዛሙርቱን የተናገረው ሰው ቢሆንም፣ ‘እርሱ’ የሚለው ቅጽ የምንጩን መጠነኛ አሻሚነት ይጠብቃል።
