  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የብዙ ቁጥር ንግግር ‘ቢላችሁ’ ተጠብቋል፤ አሻሚ የሆኑት የ‘ጌታ’ ትርጉምና የመጨረሻው ግስ ባለቤት በማስታወሻ ተገልጸዋል እንጂ በዋናው ጽሑፍ በግድ አልተፈቱም።
