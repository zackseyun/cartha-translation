  terminology: ባለቤት is appropriate for κύριος in this parabolic setting. የወይን ቦታ is comprehensible and suitable for ἀμπελών, though የወይን እርሻ is slightly more idiomatic for a vineyard. ገበሬዎች appropriately preserves the broader meaning of γεωργοί without importing tenancy into the main text.
