    text: ‘ተከራይ ገበሬዎች’ ተብሎም ሊተረጎም ይችላል። የምሳሌው ሰፊ አውድ የወይን እርሻውን ተከራይተው እንደሚያለሙ ያሳያል፤ የግሪኩ ቃል ራሱ ግን በሰፊው ‘ገበሬዎች’ ወይም ‘አልሚዎች’ ማለት ነው።
    reason: lexical_alternative
