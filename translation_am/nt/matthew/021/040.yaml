  source_fidelity: 'The draft accurately represents οὖν, κύριος τοῦ ἀμπελῶνος, ἐκείνοις, and the future question τί ποιήσει. However, ὅταν ἔλθῃ is a future-oriented temporal clause (''when ... comes'') and is better rendered with ሲመጣ than treated as though ሲመጣ alone were the lexical choice for ὅταν. The principal needed correction is idiomatic syntax: እነዚያን ገበሬዎች ምን ያደርጋቸዋል? is understandable but less natural than placing the question word first and using ምን ያደርግባቸዋል? for the dative-directed action.'
