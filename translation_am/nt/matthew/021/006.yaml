    text: ወይም፣ «እንደመራቸው»። የግሪኩ ግስ ትእዛዝ ወይም መመሪያ መስጠትን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθέντες
  choice: ሄደው
  rationale: የግሱን ቀዳሚ እንቅስቃሴ በተፈጥሯዊ የአማርኛ ትረካ ያሳያል።
- source_word: δὲ
  choice: ስለዚህ
  rationale: ከቀደመው የኢየሱስ መመሪያ ጋር ያለውን የምላሽ ቅደም ተከተል ያገናኛል።
- source_word: μαθηταὶ
  choice: ደቀ መዛሙርቱ
  rationale: በወንጌላት ውስጥ የኢየሱስን ተከታዮች ለማመልከት የተለመደና ግልጽ አገላለጽ ነው።
- source_word: ποιήσαντες
  choice: አደረጉ
  rationale: ከκαθὼς ጋር ተያይዞ የታዘዘውን እንደፈጸሙ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: καθὼς
  choice: እንደ
  rationale: ድርጊታቸው ከኢየሱስ ትእዛዝ ጋር ሙሉ በሙሉ መስማማቱን በአገባቡ ያሳያል።
- source_word: συνέταξεν
  choice: አዘዛቸው
  rationale: συντάσσω መመሪያ ወይም ትእዛዝ መስጠትን ሊያመለክት ይችላል፤ ከአማርኛው የግስ አጠቃቀም አንጻር «አዘዘ» የቀደመውን ዝርዝር መመሪያ በአጭሩ ይይዛል።
- source_word: αὐτοῖς
  choice: -አቸው
  rationale: ተቀባዮቹን በግሱ ላይ በተዋሃደ ተውላጠ ስም መግለጽ ተፈጥሯዊ አማርኛ ነው።
- source_word: ὁ Ἰησοῦς
  choice: ኢየሱስ
  rationale: የግሪኩን ባለቤት ስም በተለመደው የአማርኛ ቅርጽ ያቀርባል።
