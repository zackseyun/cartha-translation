  yaml_path: translation/nt/matthew/021/018.yaml
  text: Early in the morning, as he was returning to the city, he became hungry.
translation:
  language: am
  text: ማልዶ፣ ወደ ከተማይቱ ሲመለስ ራበው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρωῒ
  choice: ማልዶ
  rationale: የቀኑን ማለዳ ክፍል በተፈጥሯዊና አጭር ዘመናዊ አማርኛ ያመለክታል።
- source_word: δὲ
  choice: በተለየ ቃል አልተተረጎመም
  rationale: እዚህ ጋ ጠንካራ ተቃርኖ ሳይሆን ቀላል የትረካ ቅጥያ ነው፤ በአማርኛ የዓረፍተ ነገሩ ቅደም ተከተል ይህን በቂ ሁኔታ ያሳያል።
- source_word: ἐπανάγων
  choice: ሲመለስ
  rationale: የአሁን ጊዜ አሳታፊው ከዋናው ድርጊት ጋር በአንድ ጊዜ የሚከናወን መመለስን ያሳያል።
- source_word: εἰς τὴν πόλιν
  choice: ወደ ከተማይቱ
  rationale: ወደ ተወሰነችው ከተማ የሚደረገውን እንቅስቃሴ ያሳያል፤ አውዱ ኢየሩሳሌምን ያመለክታል እንጂ ስሟ በዚህ ቁጥር አልተጠቀሰም።
- source_word: ἐπείνασεν
  choice: ራበው
  rationale: የረሃብ ስሜቱን እንደ ተከሰተ በተፈጥሯዊ አማርኛ ይገልጣል፤ ከባድ ወይም ጥንታዊ አገላለጽን ያስወግዳል።
theological_decisions:
- issue: የኢየሱስ ረሃብ ክርስቶሎጂያዊ አንድምታ
  choice: ረሃቡን እንደ እውነተኛ የሰውነት ተሞክሮ በቀጥታ መተርጎም
  alternative: ረሃቡን ምሳሌያዊ ወይም የተለየ ዶክትሪናዊ ትርጉም በመጨመር መግለጽ
  rationale: ጽሑፉ ረሃቡን በቀላል ትረካ ይገልጣል፤ ትርጉሙም ይህን ሳያብራራ ወይም ሳያሳንስ ያቆያል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። “ማልዶ” የማለዳውን ጊዜ በተፈጥሯዊ ሁኔታ ያሳያል፤ δὲ ደግሞ በአውዱ ቀላል የትረካ ማያያዣ ስለሆነ ተጨማሪ መሪ ቃል አልገባም።
