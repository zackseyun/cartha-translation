review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly represents Jesus’ entry, the expulsion of all sellers and buyers, and the overturning of tables and seats. However, the final coordinated noun phrase is structurally defective: it does not clearly mark the tables as belonging to the money changers, and its wording risks treating the money changers themselves as an object alongside the tables. The revision restores both Greek genitives.'
  naturalness: The proposed wording is modern, fluent Amharic. “የቤተ መቅደሱ ግቢ” is a natural singular collective expression for the broader temple complex, avoiding the somewhat awkward plural “አደባባዮች.”
  terminology: “የገንዘብ ለዋጮች” clearly denotes money changers, while “ወንበሮች” is a natural equivalent for καθέδρας in this concrete setting. The footnote retains the important ἱερόν/ναός spatial distinction without asserting access to the inner sanctuary.
  issues:
  - severity: high
    issue: The phrase “የገንዘብ መንዛሪዎችንም ጠረጴዛዎች” lacks the required genitive relationship.
    rationale: The Greek has “the tables of the money changers,” not “the money changers and tables.” Amharic needs “የገንዘብ ለዋጮችን ጠረጴዛዎች.”
  - severity: medium
    issue: “ርግብ ይሸጡ የነበሩትን መቀመጫዎች” is grammatically heavy and less clear than necessary.
    rationale: The Greek means the seats belonging to those selling doves. A relative clause modifying “ሰዎች,” followed by a possessive noun phrase, makes this relationship clear.
  - severity: low
    issue: “አደባባዮች” is less idiomatic here than “ግቢ.”
    rationale: ἱερόν denotes the larger temple precinct/complex; “የቤተ መቅደሱ ግቢ” naturally expresses that collective location in modern Amharic.
  revised_text: ኢየሱስም ወደ የቤተ መቅደሱ ግቢ[a] ገባ፤ በግቢውም ውስጥ የሚሸጡና የሚገዙትን ሁሉ አባረረ፤ የገንዘብ ለዋጮችን ጠረጴዛዎችና ርግብ የሚሸጡ ሰዎችን ወንበሮች ገለበጠ።
