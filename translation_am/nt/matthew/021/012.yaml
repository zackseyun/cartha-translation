  text: Καὶ εἰσῆλθεν ⸀Ἰησοῦς εἰς τὸ ⸀ἱερόν, καὶ ἐξέβαλεν πάντας τοὺς πωλοῦντας καὶ ἀγοράζοντας ἐν τῷ ἱερῷ καὶ τὰς τραπέζας τῶν κολλυβιστῶν κατέστρεψεν καὶ τὰς καθέδρας τῶν πωλούντων τὰς περιστεράς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/012.yaml
  text: And Jesus entered the temple courts and drove out all those selling and buying in the temple courts[a], and he overturned the tables of the money changers and the seats of those selling doves.
translation:
  language: am
  text: ኢየሱስም ወደ የቤተ መቅደሱ ግቢ[a] ገባ፤ በግቢውም ውስጥ የሚሸጡና የሚገዙትን ሁሉ አባረረ፤ የገንዘብ ለዋጮችን ጠረጴዛዎችና ርግብ የሚሸጡ ሰዎችን ወንበሮች ገለበጠ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም «ወደ ቤተ መቅደስ» ወይም «ወደ ቤተ መቅደሱ ግቢ»፤ የግሪኩ ቃል በተለይ ውስጠኛውን መቅደስ ሳይሆን ሰፊውን የቤተ መቅደስ ሕንፃዎችና አደባባዮች ያካተተ ግቢ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερόν
  choice: የቤተ መቅደሱ አደባባዮች
  rationale: ቃሉ ከውስጠኛው መቅደስ (ναός) ይልቅ ሰፊውን የቤተ መቅደስ ግቢ ያመለክታል፤ ይህ አተረጓጎም የንግድ ሥራው የተካሄደበትን ቦታ በግልጽ ያሳያል።
- source_word: ἐξέβαλεν
  choice: አባረረ
  rationale: ቃሉ ቆራጥና ኃይለኛ ማስወጣትን ያመለክታል፤ «አባረረ» ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: πάντας
  choice: ሁሉ
  rationale: በንግዱ ሥራ የተሳተፉትን ሰዎች ሙሉ ወሰን እንደሚያካትት በግልጽ ያስቀምጣል።
- source_word: τοὺς πωλοῦντας καὶ ἀγοράζοντας
  choice: ይሸጡና ይገዙ የነበሩትን
  rationale: የግሪኩን የአሁን ጊዜ አሳታፊ ቅርጽ በተፈጥሯዊ የአማርኛ አገላለጽ ይወክላል።
- source_word: τράπεζας
  choice: ጠረጴዛዎች
  rationale: ቃሉን ቀጥተኛና በዐውዱ ግልጽ በሆነ መንገድ ይተረጉማል።
- source_word: κολλυβιστῶν
  choice: የገንዘብ መንዛሪዎች
  rationale: የተለያዩ ሳንቲሞችን የሚመነዝሩ ሰዎችን በዘመናዊና ግልጽ አማርኛ ያመለክታል።
- source_word: κατέστρεψεν
  choice: ገለበጠ
  rationale: በዐውዱ የቤት ዕቃዎቹን መገልበጥ እንጂ ማውደምን አያመለክትም።
- source_word: καθέδρας
  choice: መቀመጫዎች
  rationale: ወንበርን ወይም ሌላ የመቀመጫ ዓይነትን ሊያካትት የሚችለውን ሰፊ የቃሉን ትርጉም ይጠብቃል።
- source_word: περιστεράς
  choice: ርግብ
  rationale: በመሥዋዕት ዐውድ ውስጥ የተለመደና ግልጽ የአማርኛ አቻ ነው።
theological_decisions:
- issue: ἱερόν የሚያመለክተው የቦታ ወሰን
  choice: ኢየሱስ ወደ ሰፊው የቤተ መቅደስ አደባባዮች ገባ፤ ወደ ውስጠኛው መቅደስ ገባ ማለት አይደለም።
  alternative: «ወደ ቤተ መቅደስ» ብቻ በማለት ቦታውን ሳይለይ መተርጎም።
  rationale: ἱερόν ከναός የተለየ ሲሆን መላውን የቤተ መቅደስ ግቢ ያመለክታል፤ ይህን ልዩነት መጠበቅ ታሪካዊና ቦታዊ ግልጽነትን ይሰጣል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ረጅም የተቀናጀ አረፍተ ነገር ፍሰት በሰረዝ ነጥቦች ተጠብቋል።
