id: MAT.21.25
reference: Matthew 21:25
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τὸ βάπτισμα ⸀τὸ Ἰωάννου πόθεν ἦν; ἐξ οὐρανοῦ ἢ ἐξ ἀνθρώπων; οἱ δὲ διελογίζοντο ⸀ἐν ἑαυτοῖς λέγοντες· Ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ ἡμῖν· Διὰ τί οὖν οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/025.yaml
  text: The baptism of John—from where was it? From heaven or from men? And they were reasoning among themselves[a], saying, “If we say, ‘From heaven,’ he will say to us[b], ‘Why then did you not believe him?’”
translation:
  language: am
  text: “የዮሐንስ ጥምቀት ከየት ነበር? ከሰማይ ወይስ ከሰዎች?” እነርሱም በርሳቸው መካከል ይመካከሩ ነበር[a]፤ እንዲህም ይሉ ነበር፤ “ከሰማይ ነው ብንል፣ ታዲያ ‘ለምን አላመናችሁትም?’ ይለናል።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ከሰማይ” ማለት “ከእግዚአብሔር” ማለትም መለኮታዊ ምንጭና ሥልጣን ያለው ማለት ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: ጥምቀት
  rationale: በአማርኛ የተለመደውን የሥርዓቱን ስም ያመለክታል፤ እዚህም የዮሐንስን የማጥመቅ ሥራና መልእክት በአጠቃላይ ይወክላል።
- source_word: τὸ Ἰωάννου
  choice: የዮሐንስ
  rationale: የዝምድናውን ቅርጽ በተፈጥሯዊ አማርኛ ጠብቆ ጥምቀቱ ከዮሐንስ ጋር ያለውን ቁርኝት ያሳያል።
- source_word: πόθεν
  choice: ከየት
  rationale: ጥያቄው ስለ ቦታ ብቻ ሳይሆን ስለ ምንጭና ሥልጣን መሆኑን በአጭርና ተፈጥሯዊ አገላለጽ ያቀርባል።
- source_word: ἐξ οὐρανοῦ
  choice: ከሰማይ
  rationale: የግሪኩን ቀጥተኛ አገላለጽና መለኮታዊ ምንጭን በአክብሮታዊ ዘይቤ የማመልከቱን ኃይል ይጠብቃል።
- source_word: ἐξ ἀνθρώπων
  choice: ከሰዎች
  rationale: ጾታን ሳይለይ ሰብአዊ ምንጭን ይገልጣል፤ ከሰማይ ከሚለውም ጋር ያለውን ተቃርኖ በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: διελογίζοντο ἐν ἑαυτοῖς
  choice: እርስ በርሳቸው እየተመካከሩ
  rationale: የድርጊቱን ቀጣይነትና በቡድናቸው ውስጥ የሚደረግ ምክክር መሆኑን ያሳያል።
- source_word: Ἐὰν εἴπωμεν
  choice: ብንል
  rationale: ግምታዊ ሁኔታውን በተፈጥሯዊና አጭር የአማርኛ ሁኔታዊ ግስ ይገልጣል።
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: አላመናችሁትም
  rationale: በዮሐንስና በመልእክቱ አለማመናቸውን በተለመደ አማርኛ ይገልጣል።
theological_decisions:
- issue: ‘ከሰማይ’ የሚለው ሐረግ ትርጉም
  choice: በዋናው ጽሑፍ ‘ከሰማይ’ ተብሎ ተጠብቋል።
  alternative: ከእግዚአብሔር
  rationale: ሐረጉ መለኮታዊ ምንጭን በአክብሮታዊ ዘይቤ ሊያመለክት ቢችልም፣ ቀጥተኛውን የግሪክ ምስልና ‘ከሰዎች’ ጋር ያለውን ንፅፅር መጠበቅ ተመርጧል።
- issue: ἀνθρώπων በመለኮታዊና በሰብአዊ ምንጭ ንፅፅር ውስጥ
  choice: ከሰዎች
  alternative: ከሰው
  rationale: ቃሉ ወንዶችን ብቻ ሳይሆን ሰዎችን በአጠቃላይ ያመለክታል፤ ብዙ ቁጥሩም የምንጩን ሰብአዊነት ያጎላል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለሰፊው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ከሰማይ’ የሚለው የምንጩን አሻሚነት ጠብቋል፤ ‘ከሰዎች’ ደግሞ ጾታ-አጠቃላይ ነው።
