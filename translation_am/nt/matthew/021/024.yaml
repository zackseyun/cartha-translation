reference: Matthew 21:24
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἐρωτήσω ὑμᾶς κἀγὼ λόγον ἕνα, ὃν ἐὰν εἴπητέ μοι κἀγὼ ὑμῖν ἐρῶ ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/024.yaml
  text: But Jesus answered them[a], “I also will ask you one question, which if you tell me, I also will tell you by what authority I do these things.”
translation:
  language: am
  text: ኢየሱስ ግን መልሶ እንዲህ አላቸው፦ “እኔም አንድ ጥያቄ[a] እጠይቃችኋለሁ፤ ይህን ብትመልሱልኝ፣ እኔም እነዚህን ነገሮች በምን ሥልጣን እንደማደርግ እነግራችኋለሁ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “አንድ ጉዳይ”፤ ይበልጥ ቃል በቃል “አንድ ቃል።” የግሪኩ λόγον ἕνα ጥያቄን ወይም በውይይት ላይ ያለን ጉዳይ ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: ኢየሱስ ግን መልሶ እንዲህ አላቸው
  rationale: የግሪኩን የመልስ አሰጣጥ እና የδὲን መጠነኛ ንፅፅር በተፈጥሯዊ የአማርኛ ትረካ ያስተላልፋል።
- source_word: Ἐρωτήσω ὑμᾶς κἀγὼ
  choice: እኔም ... እጠይቃችኋለሁ
  rationale: κἀγώ የሚያሳየውን የተመላላሽ አጽንዖት ‘እኔም’ ይጠብቃል፤ የወደፊት ግሱም በተፈጥሯዊ አማርኛ ቀርቧል።
- source_word: λόγον ἕνα
  choice: አንድ ጥያቄ
  rationale: λόγος በቀጥታ ‘ቃል’ ወይም ‘ጉዳይ’ ሊሆን ቢችልም፣ በዚህ የጥያቄና መልስ አውድ ‘ጥያቄ’ ትርጉሙን በግልጽ ያስተላልፋል፤ የቃላዊ አማራጮቹ በማስታወሻ ተጠብቀዋል።
- source_word: ὃν ἐὰν εἴπητέ μοι
  choice: ይህን ብትመልሱልኝ
  rationale: በአውዱ λέγω የተጠየቀውን ምላሽ መስጠትን ያመለክታል፤ ‘ብትመልሱልኝ’ ሁኔታዊውን አወቃቀር በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: κἀγὼ ὑμῖν ἐρῶ
  choice: እኔም ... እነግራችኋለሁ
  rationale: ከመጀመሪያው κἀγώ ጋር ያለውን ተመላላሽነት ይጠብቃል፤ ἐρῶ በአውዱ ‘እነግራችኋለሁ’ ተብሎ ተፈጥሯዊ ሆኖ ተተርጉሟል።
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: በምን ሥልጣን
  rationale: ἐν እዚህ የድርጊቱን ሥልጣናዊ መሠረት ያሳያል፤ ‘በምን ሥልጣን’ ትክክለኛና የተለመደ የአማርኛ አገላለጽ ነው።
- source_word: ταῦτα ποιῶ
  choice: እነዚህን ነገሮች ... እንደማደርግ
  rationale: የταῦταን ብዙ ቁጥርና በክርክሩ ውስጥ የተጠቀሱትን የኢየሱስ ድርጊቶች ሰፊ ማጣቀሻ ይጠብቃል።
