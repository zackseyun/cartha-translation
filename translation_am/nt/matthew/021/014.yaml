  yaml_path: translation/nt/matthew/021/014.yaml
  text: And the blind and the lame came to him in the temple[a], and he healed them.
translation:
  language: am
  text: ዕውሮችና አንካሶች በቤተ መቅደሱ[a] ውስጥ ወደ እሱ ቀረቡ፤ እርሱም ፈወሳቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ቤተ መቅደስ» ተብሎ የተተረጎመው የግሪኩ ἱερόν የቤተ መቅደሱን አጠቃላይ ግቢና ሕንፃዎች ያመለክታል፤ ውስጠኛውን መቅደስ ብቻ አያመለክትም።
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον (προσέρχομαι)
  choice: ወደ እሱ ቀረቡ
  rationale: ግሱ ወደ አንድ ሰው መምጣትን ወይም መቅረብን ያመለክታል። «ቀረቡ» በዚህ ዐውድ ተፈጥሯዊ ሲሆን፣ αὐτῷ የሚያመለክተውን አቅጣጫ «ወደ እሱ» በግልጽ ያሳያል።
- source_word: τυφλοὶ
  choice: ዕውሮች
  rationale: በስም ፈንታ የቆመ ብዙ ቁጥር ቅጽል ሲሆን፣ ማየት የተሳናቸውን ሰዎች በአጭርና በተለመደ አማርኛ ያመለክታል።
- source_word: χωλοὶ
  choice: አንካሶች
  rationale: መደበኛ መራመድ የተሳናቸውን ሰዎች ያመለክታል፤ «አንካሶች» ከ«ዕውሮች» ጋር በተመጣጣኝና በቀጥተኛ አገላለጽ ይቀርባል።
- source_word: ἐν τῷ ἱερῷ
  choice: በቤተ መቅደሱ ውስጥ
  rationale: ἱερόν የውስጠኛውን መቅደስ ብቻ ሳይሆን አጠቃላይ የቤተ መቅደሱን ግቢና ሕንፃዎች ያመለክታል። ዋናው ትርጉም ተፈጥሯዊውን አገላለጽ ይጠቀማል፤ የቦታው ስፋት በማስታወሻው ተገልጿል።
- source_word: ἐθεράπευσεν (θεραπεύω)
  choice: ፈወሳቸው
  rationale: በወንጌላት የተአምራዊ ፈውስ ዐውድ θεραπεύω በተለምዶ «ፈወሰ» ተብሎ ይተረጎማል፤ የብዙ ቁጥር ተሳቢውም በ«-አቸው» ተጠብቋል።
theological_decisions:
- issue: ἱερόν የሚያመለክተው የፈውሱ ቦታ
  choice: ኢየሱስ በአጠቃላይ የቤተ መቅደሱ ክልል ውስጥ ፈወሳቸው።
  alternative: ኢየሱስ በቤተ መቅደሱ አደባባዮች ፈወሳቸው።
  rationale: ግሪኩ ἱερόν የሚለውን ይጠቀማል፤ ይህም ከναός በተለየ መልኩ ሰፊውን የቤተ መቅደስ ክልል ያመለክታል። ስለዚህ ትርጉሙ ወደ ውስጠኛው መቅደስ እንደገቡ አያስገድድም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ይጠቀማል። የግሪኩን ቀላል ትረካዊ ቅደም ተከተል ለተፈጥሯዊ አማርኛ በመጠኑ አስተካክሏል።
