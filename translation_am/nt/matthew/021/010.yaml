  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ εἰσελθόντος αὐτοῦ εἰς Ἱεροσόλυμα ἐσείσθη πᾶσα ἡ πόλις λέγουσα· Τίς ἐστιν οὗτος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/010.yaml
  text: And when he entered Jerusalem[a], the whole city was stirred up, saying, “Who is this?”
translation:
  language: am
  text: እርሱም ወደ ኢየሩሳሌም ሲገባ፣ ከተማይቱ ሁሉ፣ “ይህ ማን ነው?” ስትል ታወከች[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ተናወጠች።” የግሪኩ ግስ አካላዊ መናወጥን ወይም፣ እዚህ እንደሆነው፣ የሕዝብን መረበሽ ሊገልጽ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθόντος αὐτοῦ
  choice: እርሱም … በገባ ጊዜ
  rationale: የግሪኩን ገላጭ ጊዜያዊ አገባብ በተፈጥሯዊ የአማርኛ ጊዜ ሐረግ ይገልጻል፤ ድርጊቱ ከመግባቱ ጋር በአንድ ጊዜ መሆኑን ይጠብቃል።
- source_word: Ἱεροσόλυμα
  choice: ኢየሩሳሌም
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የቦታውን ስም ይጠቀማል።
- source_word: ἐσείσθη
  choice: ታወከች
  rationale: በዚህ ዐውድ ግሱ ከተማይቱ በኢየሱስ መግባት ምክንያት መረበሿንና መነቃቃቷን በምሳሌያዊ ሁኔታ ያመለክታል። ቃሉ ቃል በቃል ‘መናወጥ’ ሊሆን ስለሚችል አማራጩ በማስታወሻ ቀርቧል።
- source_word: πᾶσα ἡ πόλις
  choice: ከተማይቱ ሁሉ
  rationale: ከተማይቱን እንደ አንድ ማኅበረሰብ የሚያቀርበውን የግሪኩን አጠቃላይ አገላለጽ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: λέγουσα
  choice: እያለች
  rationale: አሳቢውን ‘ከተማይቱ’ እንደ አንድ ስብስብ በሴት ነጠላ አንቀጽ በመከተል የግሪኩን ተሳቢ መዋቅር ይጠብቃል።
- source_word: Τίς ἐστιν οὗτος;
  choice: ይህ ማን ነው?
  rationale: ‘ሰው’ የሚል በምንጩ ያልተገለጸ ቃል ሳይጨምር ጥያቄውን ቀጥተኛና ተፈጥሯዊ በሆነ አማርኛ ያቀርባል።
theological_decisions:
- issue: የከተማይቱ ምላሽ ቃል በቃል መናወጥ ነው ወይስ ምሳሌያዊ መረበሽ?
  choice: ታወከች
  alternative: ተናወጠች
  rationale: ዐውዱ የሚገልጸው የመሬት መናወጥን ሳይሆን ኢየሱስ ሲገባ የከተማይቱን ሕዝባዊ መረበሽና መነቃቃት ነው። ሆኖም የግሪኩ ግስ ያለው የ‘መናወጥ’ ምስል እንዳይጠፋ ቃል በቃል አማራጩ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ከተማይቱ … እያለች’ የሚለው ሰዋሰዋዊ ስብዕና የምንጩን ምስላዊ አገላለጽ ሳይከብድ ይጠብቃል።
