id: MAT.21.27
reference: Matthew 21:27
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἀποκριθέντες τῷ Ἰησοῦ εἶπαν· Οὐκ οἴδαμεν. ἔφη αὐτοῖς καὶ αὐτός· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/027.yaml
  text: And answering Jesus, they said, “We do not know.” He also said to them, “Neither will I tell you by what authority I do these things.”
translation:
  language: am
  text: እነርሱም ለኢየሱስ መልሰው፣ “አናውቅም” አሉ። እርሱም እንዲህ አላቸው፤ “እኔም እነዚህን ነገሮች በምን ሥልጣን እንደማደርግ አልነግራችሁም።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: ብለው መለሱለት
  rationale: የግሪኩን የመልስ ሰጪነት በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል፤ ለኢየሱስ መልስ መስጠታቸውንም ግልጽ ያደርጋል።
- source_word: Οὐκ οἴδαμεν
  choice: አናውቅም
  rationale: ቀጥተኛውን የዕውቀት እምቢታ በአጭርና በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἔφη
  choice: አላቸው
  rationale: ተራና ያልተጫነ የንግግር ግስ ሲሆን በአማርኛ ለብዙ ተደራሲዎች የሚስማማውን ቅርጽ ይጠቀማል።
- source_word: καὶ αὐτός / Οὐδὲ ἐγὼ
  choice: እርሱም፣ “እኔም ቢሆን … አልነግራችሁም”
  rationale: ኢየሱስ ለእነርሱ መልስ በተመሳሳይ አቅጣጫ እንደሰጠ የሚያሳየውን ተመላሽ አጽንዖት ይጠብቃል።
- source_word: λέγω ὑμῖν
  choice: አልነግራችሁም
  rationale: በዚህ አውድ λέγω መረጃ መግለጥን ያመለክታል፤ አሉታዊው ቅርጽ የኢየሱስን እምቢታ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: በምን ሥልጣን
  rationale: የተግባሩን ሕጋዊ ወይም የተሰጠ መሠረት ያሳያል፤ ቃሉን ወደ ተራ ችሎታ አያጠብበውም።
- source_word: ταῦτα
  choice: እነዚህን ነገሮች
  rationale: የግሪኩን ብዙ ቁጥር ያቆያል፤ ክርክር የተነሳባቸውን የኢየሱስ ተግባራት ያመለክታል።
- source_word: ποιῶ
  choice: እንደማደርግ
  rationale: የአሁን ጊዜውን አጠቃላይ ተግባር ይገልጣል፤ ከተዘዋዋሪው ጥያቄ ጋርም ተፈጥሯዊ ነው።
theological_decisions:
- issue: የἐξουσία ትርጉም በኢየሱስ መልስ
  choice: ሥልጣን
  alternative: መብት፣ ኃይል
  rationale: በዚህ የክርክር አውድ መሪዎቹ የኢየሱስን ተግባራት ሕጋዊነትና ምንጭ ይጠይቃሉ። “ሥልጣን” ይህን የመብትና የውክልና ኃይል ሳይጠብብ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ቃል በቃል ቅደም ተከተል በአማርኛ የማይፈጥረውን ከባድነት ለማስወገድ የመልሱ አገባብ ተፈጥሯዊ ሆኖ ተዋቅሯል፤ የተመላሽ አጽንዖቱና የ“እነዚህ ነገሮች” ብዙ ቁጥር ተጠብቀዋል።
