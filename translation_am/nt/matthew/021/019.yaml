  verdict: revise
  source_fidelity: The draft accurately conveys the roadside location, Jesus’ approach, the absence of anything except leaves, the imprecatory force and enduring scope of the pronouncement, and the tree’s immediate withering. A small adjustment makes the Greek plural φύλλα explicit and uses a more idiomatic Amharic verb for fruit issuing from a tree.
  naturalness: The register is clear, modern standard Amharic. “ከቅጠሎች በቀር” is smoother than the singular generic expression in this context. “ፍሬ አይወጣ” naturally expresses fruit coming from a tree while retaining the source’s ‘from you’ imagery.
  terminology: “የበለስ ዛፍ,” “ፍሬ,” and “ወዲያውም … ደረቀች” are appropriate and consistent. The pronouncement is retained as an imprecatory declaration without importing a symbolic interpretation.
  issues:
  - severity: low
    issue: The draft renders φύλλα (‘leaves,’ plural) with singular-generic “ቅጠል.”
    rationale: Singular generic usage is understandable in Amharic, but “ቅጠሎች” more directly represents the source and is fully natural here.
  - severity: low
    issue: “ፍሬ አይገኝ” can suggest that fruit is not found rather than that it does not come forth from the tree.
    rationale: “ፍሬ አይወጣ” more naturally expresses γένηται with ἐκ σοῦ while preserving the source imagery and the imprecatory force.
  revised_text: በመንገድ ዳር አንዲት የበለስ ዛፍ አይቶ ወደ እርሷ ቀረበ፤ ከቅጠሎች ብቻ በቀር ግን ምንም አላገኘባትም። እርሷንም፣ “ከአንቺ ዳግመኛ ለዘላለም ፍሬ አይወጣ!”[a] አላት። ወዲያውም የበለስ ዛፊቱ ደረቀች።
