  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἰδὼν συκῆν μίαν ἐπὶ τῆς ὁδοῦ ἦλθεν ἐπ’ αὐτήν, καὶ οὐδὲν εὗρεν ἐν αὐτῇ εἰ μὴ φύλλα μόνον, καὶ λέγει αὐτῇ· ⸀Μηκέτι ἐκ σοῦ καρπὸς γένηται εἰς τὸν αἰῶνα· καὶ ἐξηράνθη παραχρῆμα ἡ συκῆ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/019.yaml
  text: And seeing a fig tree by the road[a], he came up to it and found nothing on it except leaves alone. And he said to it, “May there no longer ever be fruit from you.” And the fig tree withered at once.
translation:
  language: am
  text: በመንገድ ዳር አንዲት የበለስ ዛፍ አይቶ ወደ እርሷ ቀረበ፤ ከቅጠሎች ብቻ በቀር ግን ምንም አላገኘባትም። እርሷንም፣ “ከአንቺ ዳግመኛ ለዘላለም ፍሬ አይወጣ!”[a] አላት። ወዲያውም የበለስ ዛፊቱ ደረቀች።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም ይበልጥ በተለመደ አገላለጽ፣ “ከእንግዲህ ወዲህ ፈጽሞ ፍሬ አታፍሪ!”
    reason: lexical_alternative
lexical_decisions:
- source_word: συκῆν μίαν
  choice: አንዲት የበለስ ዛፍ
  rationale: μίαν ያለውን የአንድነት/ነጠላነት ምልክት በተፈጥሯዊ አማርኛ ‘አንዲት’ በማለት ያስተላልፋል።
- source_word: ἐπὶ τῆς ὁδοῦ
  choice: በመንገድ ዳር
  rationale: ዛፊቱ ከመንገዱ አጠገብ መሆኗን በተፈጥሯዊ አማርኛ ይገልጣል፤ ‘በመንገዱ ላይ’ የሚለውን አሻሚ አቀራረብ ያስወግዳል።
- source_word: ἦλθεν ἐπ’ αὐτήν
  choice: ወደ እርሷ ቀረበ
  rationale: ወደ ዛፊቱ የመቅረብን እንቅስቃሴ ግልጽና ተፈጥሯዊ በሆነ አገላለጽ ያሳያል።
- source_word: οὐδὲν εὗρεν ἐν αὐτῇ εἰ μὴ φύλλα μόνον
  choice: ከቅጠል ብቻ በቀር ምንም አላገኘባትም
  rationale: μόνον ያለውን አጽንዖት ‘ብቻ’ ይጠብቃል፤ ἐν αὐτῇ ደግሞ ለዛፍ ተስማሚ በሆነው ‘አላገኘባትም’ ተተርጉሟል።
- source_word: Μηκέτι ἐκ σοῦ καρπὸς γένηται εἰς τὸν αἰῶνα
  choice: ከአንቺ ዳግመኛ ለዘላለም ፍሬ አይገኝ
  rationale: ἐκ σοῦ ያለውን ‘ከአንቺ’ ምስል ይጠብቃል፤ Μηκέτι እና εἰς τὸν αἰῶνα ያላቸውን የዳግመኛ አለመሆንና ዘላቂነት ኃይል በአንድነት ያስተላልፋል።
- source_word: ἐξηράνθη παραχρῆμα
  choice: ወዲያውም … ደረቀች
  rationale: παραχρῆμα የሚያመለክተውን ፈጣን መፈጸም ‘ወዲያውም’ ይገልጣል፤ ἐξηράνθη ለዛፍ ‘ደረቀች’ ተብሎ በተፈጥሯዊ አማርኛ ተሰጥቷል።
theological_decisions:
- issue: ኢየሱስ ለበለስ ዛፊቱ የተናገረው ንግግር ኃይል
  choice: እንደ ክልከላዊ/ፍርዳዊ አዋጅ፣ ‘ከአንቺ ዳግመኛ ለዘላለም ፍሬ አይገኝ!’
  alternative: እንደ ቀላል ትንቢታዊ መግለጫ፣ ‘ከእንግዲህ ፍሬ አታፈሪም’
  rationale: Μηκέτι ከγένηται ጋር ያለው አወቃቀር የተከለከለ ምኞት/ሥልጣናዊ አዋጅ ኃይል አለው። ትርጉሙ ይህን ይጠብቃል፣ ነገር ግን የዛፊቱን ምሳሌያዊ ትርጉም በጥቅሱ ውስጥ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ዛፊቱ በአማርኛ ሴት ጾታ ስለምትወሰድ ‘እርሷ/አንቺ/ደረቀች’ የሚሉ ተዛማጅ ቅርጾች ተጠቅመዋል።
