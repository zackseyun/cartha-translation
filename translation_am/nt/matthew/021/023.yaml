id: MAT.21.23
reference: Matthew 21:23
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ ἱερὸν προσῆλθον αὐτῷ διδάσκοντι οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ λέγοντες· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; καὶ τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/023.yaml
  text: And when he came into the temple[a], the chief priests and the elders of the people came up to him while he was teaching and said, “By what authority are you doing these things? And who gave you this authority?”
translation:
  language: am
  text: እርሱም ወደ ቤተ መቅደሱ[a] በገባ ጊዜ፣ ሲያስተምር የካህናት አለቆችና የሕዝቡ ሽማግሌዎች ወደ እርሱ ቀርበው፣ “እነዚህን ነገሮች በምን ሥልጣን ታደርጋለህ? ይህንስ ሥልጣን ማን ሰጠህ?” አሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክኛ ἱερόν የሚለው ቃል የቤተ መቅደሱን አጠቃላይ ግቢና ሕንፃዎች ያመለክታል እንጂ የውስጠኛውን መቅደስ ብቻ አይደለም።
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: እርሱም … በገባ ጊዜ
  rationale: የግሪኩ ገላጭ ሐረግ ጊዜያዊ ትርጉም ስላለው፣ የድርጊቱን ቅደም ተከተል ሳያጠብቅ በተፈጥሯዊ አማርኛ ተገልጿል።
- source_word: ἱερόν
  choice: ቤተ መቅደሱ
  rationale: ቃሉ የውስጠኛውን መቅደስ ብቻ ሳይሆን አጠቃላይ የቤተ መቅደሱን ግቢና ሕንፃዎች ያመለክታል፤ የአማርኛው መደበኛ አገላለጽ ተመርጦ ልዩነቱ በማስታወሻ ተገልጿል።
- source_word: προσῆλθον αὐτῷ
  choice: ወደ እርሱ ቀርበው
  rationale: አካላዊ መቅረባቸውን በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: διδάσκοντι
  choice: ሲያስተምር
  rationale: ማስተማሩና መቅረባቸው በአንድ ጊዜ መሆናቸውን የአማርኛው ጊዜያዊ አገናኝ ይጠብቃል።
- source_word: οἱ ἀρχιερεῖς
  choice: የካህናት አለቆች
  rationale: ብዙ ሊቃነ ካህናትን ሳይሆን የካህናት መሪዎችን ስለሚያመለክት ይህ አገላለጽ ታሪካዊ ሚናቸውን በግልጽ ያስተላልፋል።
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: የሕዝቡ ሽማግሌዎች
  rationale: በሕዝቡ ዘንድ እውቅና የነበራቸውን መሪዎች በቀጥታና በተለመደ አማርኛ ይገልጻል።
- source_word: Ἐν ποίᾳ ἐξουσίᾳ
  choice: በምን ሥልጣን
  rationale: ጥያቄው የኢየሱስን ድርጊት ሕጋዊ ወይም ተቋማዊ ፈቃድ የሚጠይቅ ስለሆነ፣ ‘ሥልጣን’ የቃሉን ኃይል ይጠብቃል።
- source_word: ταῦτα ποιεῖς
  choice: እነዚህን ነገሮች … ታደርጋለህ
  rationale: የግሪኩን ሆን ብሎ ያልተወሰነ አመልካች አገላለጽ ሳይተረጉም ይጠብቃል።
- source_word: τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην
  choice: ይህንስ ሥልጣን ማን ሰጠህ?
  rationale: የሥልጣኑን ሰጪና የተፈጸመውን የመስጠት ድርጊት በአጭርና ተፈጥሯዊ ጥያቄ ያቀርባል።
theological_decisions:
- issue: በመሪዎቹ ጥያቄ ውስጥ የἐξουσία ትርጉም
  choice: ሥልጣን
  alternative: መብት፤ ኃይል
  rationale: በዚህ አውድ ጥያቄው ስለ ጥሬ ኃይል ሳይሆን ኢየሱስ ለማድረግና ለማስተማር ስላለው ፈቃድና ሥልጣናዊ ምንጭ ነው። ‘ሥልጣን’ ተቋማዊውንና መለኮታዊውን የትርጉም ጫና ሳይፈታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ቀጥተኛው ንግግር የመሪዎቹን ተግዳሮታዊ ድምፅ ይጠብቃል፤ ‘እነዚህን ነገሮች’ የሚለውም የምንጩን አሻሚነት ሳይፈታ ቀርቷል።
