  yaml_path: translation/nt/matthew/021/008.yaml
  text: Most of the crowd spread their garments on the road[b][a], and others were cutting branches from the trees and spreading them on the road.
translation:
  language: am
  text: ከሕዝቡም አብዛኞቹ[a] ልብሶቻቸውን[b] በመንገድ ላይ ዘረጉ፤ ሌሎች ደግሞ ከዛፎቹ ቅርንጫፎችን እየቆረጡ በመንገድ ላይ ይዘረጉ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የሕዝቡ ትልቁ ክፍል።”
    reason: lexical_alternative
  - marker: b
    text: “ልብሶች” የውጭ ልብሶችን ወይም ካባዎችንም ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ πλεῖστος ὄχλος
  choice: ከሕዝቡም አብዛኞቹ
  rationale: πλεῖστος ከጥቅል ስም ጋር ‘አብዛኛው/አብዛኞቹ’ ወይም ‘ከፍተኛው ክፍል’ ማለት ነው። ὄχλος በዚህ አውድ ‘ሕዝብ’ ተብሎ በተፈጥሯዊ አማርኛ ተተርጉሟል፤ δέ ደግሞ በ‘-ም’ ተንጸባርቋል።
- source_word: ἔστρωσαν
  choice: ዘረጉ
  rationale: በመንገዱ ላይ ልብስን ዘርግቶ ማኖርን በግልጽና ተፈጥሯዊ ሁኔታ ይገልጻል።
- source_word: ἑαυτῶν τὰ ἱμάτια
  choice: ልብሳቸውን
  rationale: ἱμάτια በሰፊው ልብሶችን፣ በተለይም የውጭ ልብስን ሊያመለክት ይችላል። የባለቤትነት ቅጥ ‘-አቸው’ ἑαυτῶνን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐν τῇ ὁδῷ
  choice: በመንገድ ላይ
  rationale: በተጓዥ መንገድ ወለል ላይ ዕቃ መዘርጋትን የሚገልጽ የተለመደ አማርኛ ነው።
- source_word: ἄλλοι δὲ
  choice: ሌሎች ደግሞ
  rationale: በሕዝቡ ውስጥ ሌላ ቡድን ያደረገውን ድርጊት ያክላል፤ δέን ያለ ከባድ ተቃርኖ ያንጸባርቃል።
- source_word: ἔκοπτον
  choice: እየቆረጡ
  rationale: የግሱን ኢምፐርፌክት ገጽታ፣ ማለትም በትዕይንቱ ውስጥ ቀጥሎ የነበረውን ድርጊት፣ ይጠብቃል።
- source_word: κλάδους ἀπὸ τῶν δένδρων
  choice: ከዛፎች ላይ ቅርንጫፎችን
  rationale: κλάδουςን ‘ቅርንጫፎች’ በማለት በቀጥታ ይተረጉማል፤ ἀπό የተቆረጡበትን ምንጭ ያሳያል።
- source_word: καὶ ἐστρώννυον
  choice: ይዘረጉ ነበር
  rationale: የቀጣይነት ያለውን ኢምፐርፌክት ገጽታ ይጠብቃል፤ የተቆረጡት ቅርንጫፎች እንደሆኑ ከአውዱ ግልጽ ስለሆነ ተውላጠ ስም አልተጨመረም።
