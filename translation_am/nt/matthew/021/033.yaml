source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν ἀκούσατε. ⸀Ἄνθρωπος ἦν οἰκοδεσπότης ὅστις ἐφύτευσεν ἀμπελῶνα καὶ φραγμὸν αὐτῷ περιέθηκεν καὶ ὤρυξεν ἐν αὐτῷ ληνὸν καὶ ᾠκοδόμησεν πύργον, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/033.yaml
  text: 'Listen to another parable: There was a landowner who planted a vineyard and put a fence around it and dug a winepress in it and built a tower[a], and leased it to tenant farmers[c][b], and went away.'
translation:
  language: am
  text: “ሌላ ምሳሌ ስሙ፤ አንድ የመሬት ባለቤት ነበር። የወይን እርሻ ተከለ፤ በዙሪያውም አጥር አደረገ፣[a] በውስጡም የወይን መጭመቂያ ቆፈረ፣ ግንብም ሠራ።[b] ከዚያም ለገበሬዎች በኪራይ ሰጠው[c] እና ሄደ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በዙሪያው ቁጥቋጦ አጥር አደረገ።” የግሪኩ ቃል አጥርን፣ ቁጥቋጦ አጥርን ወይም ሌላ ዙሪያውን የሚከልል መከለያን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: የወይን እርሻ መትከል፣ በዙሪያው አጥር ማድረግ፣ የወይን መጭመቂያ መቆፈርና ግንብ መሥራት በኢሳይያስ 5፥1–2 የሚገኘውን ምስል ያስተጋባል።
    reason: cross_reference
  - marker: c
    text: ወይም፣ “ለገበሬዎች አከራየው።” አገላለጹ እርሻውን እንዲያርሱ ለገበሬዎች በኪራይ መስጠትን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἀκούσατε
  choice: ሌላ ምሳሌ ስሙ
  rationale: የብዙ ቁጥር ቀጥተኛውን ትእዛዝ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ “ምሳሌ” ደግሞ ለπαραβολή የተለመደውና ከአውዱ ጋር የሚስማማው ቃል ነው።
- source_word: Ἄνθρωπος ἦν οἰκοδεσπότης
  choice: አንድ ባለርስት ነበር
  rationale: በዚህ የግብርናና የኪራይ አውድ οἰκοδεσπότης የርስቱን ባለቤት ያመለክታል፤ “ባለርስት” ሚናውን በግልጽ ዘመናዊ አማርኛ ይገልጣል።
- source_word: ἐφύτευσεν ἀμπελῶνα
  choice: የወይን እርሻ ተከለ
  rationale: ተጨባጩን የመትከል ምስል ይጠብቃል፤ ἀμπελών የወይን ተክል የሚበቅልበትን እርሻ ያመለክታል።
- source_word: φραγμὸν αὐτῷ περιέθηκεν
  choice: ዙሪያውን አጠረው
  rationale: φραγμός አጥር፣ ቁጥቋጦ አጥር ወይም ሌላ መከለያ ሊሆን ስለሚችል፣ ግሱን መጠቀም የአጥሩን ቁሳቁስ ሳይወስን አጠቃላይ ትርጉሙን ይጠብቃል።
- source_word: ὤρυξεν ἐν αὐτῷ ληνὸν
  choice: በውስጡ የወይን መጭመቂያ ጉድጓድ ቆፈረ
  rationale: ὀρύσσω መቆፈርን፣ ληνός ደግሞ የወይን መጭመቂያን ያመለክታሉ። “ጉድጓድ” መጨመሩ በመሬት የሚቆፈረውን የመጭመቂያ ክፍል በአማርኛ ግልጽ ያደርጋል።
- source_word: ᾠκοδόμησεν πύργον
  choice: ግንብ ሠራ
  rationale: πύργος ግንብን ያመለክታል። የጥበቃ ግንብ መሆኑ ሊገመት ቢችልም በግሪኩ በግልጽ ስላልተገለጸ “ግንብ” ብቻ ተብሏል።
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: ለገበሬዎች አከራይቶ
  rationale: ἐκδίδωμι እዚህ ማከራየትን ያመለክታል፤ γεωργοί ደግሞ እርሻውን የሚያርሱ ገበሬዎች ናቸው። የኪራይ ግንኙነቱ በግሱ ግልጽ ስለሆነ “ተከራይ” የሚለውን መጨመር አላስፈለገም።
- source_word: ἀπεδήμησεν
  choice: ወደ ሌላ ስፍራ ሄደ
  rationale: ግሱ ከመኖሪያ አካባቢ ርቆ መሄድን ያመለክታል፤ መድረሻውን ወይም ወደ ሌላ አገር መሄዱን ሳይጨምር ይህን ሐሳብ ያስተላልፋል።
theological_decisions:
- issue: ከኢሳይያስ 5፥1-2 ጋር ያለው የወይን እርሻ ምስላዊ ግንኙነት
  choice: በዋናው ጽሑፍ ተጨባጩን የግብርና ቃላት መጠበቅ፣ ግንኙነቱን ግን በማስታወሻ መግለጽ
  alternative: የኢሳይያስን አገላለጽ የበለጠ የሚያስታውስ ባህላዊ ቃል መጠቀም
  rationale: ጥቅሱ ኢሳይያስ 5ን በግልጽ ያስተጋባል፤ ሆኖም ትርጉሙ ትርጓሜውን በዋናው ጽሑፍ ሳይጨምር ምስሎቹን በትክክል ማቆየት አለበት።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። የትረካውን ተከታታይ ድርጊቶች በአጭር ዐረፍተ ነገሮች በማቅረብ ንባቡን ቀላል አድርጓል፤ ያልተገለጸ የግንቡ ተግባር ወይም የጉዞው መድረሻ አልተጨመረም።
