  text: καὶ εἶπαν αὐτῷ· Ἀκούεις τί οὗτοι λέγουσιν; ὁ δὲ Ἰησοῦς λέγει αὐτοῖς· Ναί. οὐδέποτε ἀνέγνωτε ὅτι Ἐκ στόματος νηπίων καὶ θηλαζόντων κατηρτίσω αἶνον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/016.yaml
  text: And they said to him[a], “Do you hear what these are saying?” But Jesus says to them, “Yes. Have you never read, ‘Out of the mouth of infants and nursing babies you have prepared praise’?”
translation:
  language: am
  text: እነርሱም፣ “እነዚህ የሚሉትን ትሰማለህን?” አሉት። ኢየሱስም፣ “አዎን። ‘ከሕፃናትና ጡት ከሚጠቡ ልጆች አፍ ምስጋናን አዘጋጀህ’[a] የሚለውን ከቶ አላነበባችሁምን?” አላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ኢየሱስ መዝሙር 8፥2ን በግሪክ የቅዱሳት መጻሕፍት ትርጉም መሠረት እየጠቀሰ ነው። የዕብራይስጡ ጽሑፍ በተለምዶ፣ “ከሕፃናትና ጡት ከሚጠቡ ልጆች አፍ ኃይልን መሠረተህ” ተብሎ ይተረጎማል።
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀκούεις
  choice: ትሰማለህን?
  rationale: የአሁን ጊዜውን ቀጥተኛ ጥያቄና ለኢየሱስ የቀረበውን ተግዳሮት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: τί οὗτοι λέγουσιν
  choice: እነዚህ የሚሉትን
  rationale: “እነዚህ” የοὗτοιን ትንሽ አንቋሻሽ የሆነ አመልካች ኃይል ሳይጨምር ይጠብቃል፤ የሚሉትንም ቀጣይ ንግግርን ያሳያል።
- source_word: λέγει
  choice: አላቸው
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ ቅርጽ በአማርኛ ትረካ ውስጥ በተፈጥሯዊው ያለፈ ጊዜ ተተርጉሟል፤ ይህም የንግግሩን ቀጥተኛነት አያጠፋም።
- source_word: Ναί
  choice: አዎን
  rationale: አጭሩንና ቀጥተኛውን አዎንታዊ መልስ በክቡርና ዘመናዊ አማርኛ ይገልጣል።
- source_word: οὐδέποτε ἀνέγνωτε
  choice: ከቶ አላነበባችሁምን?
  rationale: ስለ ቅዱስ ጽሑፍ ዕውቀታቸው የቀረበውን ወቀሳ ያዘለ አጽንዖታዊ ጥያቄ ይጠብቃል።
- source_word: Ἐκ στόματος
  choice: ከ… አፍ
  rationale: የመነሻን ሐሳብ በቅርብ ይከተላል፤ በጥቅሱም አውድ ተፈጥሯዊ ነው።
- source_word: νηπίων
  choice: ሕፃናት
  rationale: በጣም ትንንሽ ልጆችን የሚያመለክተውን ቃል በግልጽና በተለመደ አማርኛ ያቀርባል።
- source_word: θηλαζόντων
  choice: ጡት የሚጠቡ ልጆች
  rationale: ተሳቢውን በግልጽ በመግለጽ ከ“ሕፃናት” ጋር ያለውን ልዩነትና ምስል ይጠብቃል።
- source_word: κατηρτίσω
  choice: አዘጋጀህ
  rationale: በማቴዎስ የግሪክ ጥቅስ ውስጥ ያለውን የማዘጋጀትና የማስገኘት ሐሳብ ሳይጨምር ያስተላልፋል።
- source_word: αἶνον
  choice: ምስጋናን
  rationale: የግሪኩን ስም ቀጥተኛና በቅዱስ ጽሑፍ አውድ የተለመደ ትርጉም ይሰጣል።
