  text: Τί δὲ ὑμῖν δοκεῖ; ἄνθρωπος εἶχεν τέκνα δύο. ⸀προσελθὼν τῷ πρώτῳ εἶπεν· Τέκνον, ὕπαγε σήμερον ἐργάζου ἐν τῷ ⸀ἀμπελῶνι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/028.yaml
  text: But what do you think? A man had two children. Going to the first[a], he said, ‘Child, go work today in the vineyard.’
translation:
  language: am
  text: እናንተስ ምን ይመስላችኋል? አንድ ሰው ሁለት ልጆች[a] ነበሩት። ወደ መጀመሪያው ቀርቦ፣ “ልጄ፣ ሂድና ዛሬ በወይን እርሻው ሥራ” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሁለት ወንዶች ልጆች።” ብዙ ትርጉሞች “ወንዶች ልጆች” ይላሉ፤ እዚህ ያለው የግሪክ ቃል (τέκνα) ግን “ልጆች” ይላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί δὲ ὑμῖν δοκεῖ;
  choice: እናንተስ ምን ይመስላችኋል?
  rationale: የግሪኩን የአድማጮችን ፍርድ የሚጠይቅ አነጋገር በተፈጥሯዊ አማርኛ ያቀርባል፤ -ስ የδὲን ቀላል አያያዥ ኃይል ያሳያል።
- source_word: ἄνθρωπος
  choice: አንድ ሰው
  rationale: በታሪኩ ውስጥ ያለውን አንድ ወንድ የቤተሰብ አባል በተፈጥሯዊ የአማርኛ ትረካ ይገልጣል።
- source_word: τέκνα δύο
  choice: ሁለት ልጆች
  rationale: τέκνα በቀጥታ ‘ልጆች’ ማለት ነው፤ ጾታቸውን በዚህ ስፍራ ከሚለየው በላይ አያጠብቅም።
- source_word: προσελθὼν τῷ πρώτῳ
  choice: ወደ መጀመሪያው ቀርቦ
  rationale: የቅደም ተከተሉን እና ወደ ልጁ መቅረቡን በግልጽ የትረካ አማርኛ ያቀርባል።
- source_word: Τέκνον
  choice: ልጄ
  rationale: የግሪኩ የጥሪ ቅርጽ ጾታን አይወስንም፤ ‘ልጄ’ በአማርኛ የወላጅን ተፈጥሯዊ ቀጥተኛ አነጋገር ያሳያል።
- source_word: ὕπαγε σήμερον ἐργάζου
  choice: ሂድና ዛሬ … ሥራ
  rationale: የሁለቱን ትእዛዛዊ ግሶች ኃይልና የσήμερονን ጊዜያዊ አጽንዖት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐν τῷ ἀμπελῶνι
  choice: በወይን እርሻው
  rationale: የወይን ተክል የሚበቅልበትን ስፍራ ለዘመናዊ አንባቢ ግልጽ በሆነ የግብርና ቃል ያቀርባል።
theological_decisions:
- issue: τέκνα/τέκνονን በባህላዊው አተረጓጎም ‘ወንዶች ልጆች/ወንድ ልጄ’ ብሎ ማጥበብ ወይስ ሰፊውን ትርጉም መጠበቅ
  choice: ልጆች / ልጄ
  alternative: ወንዶች ልጆች / ወንድ ልጄ
  rationale: ግሪኩ υἱοί/υἱέ ሳይሆን τέκνα/τέκνον ይጠቀማል። ስለዚህ ጽሑፉ ራሱ ከሚናገረው በላይ ጾታን ሳይወስን ሰፊው የዝምድና ቃል ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ የትረካ አማርኛ ተጠቅሟል። ‘ልጄ’ የጾታ ልዩነት ሳያስገባ የወላጅን ተፈጥሯዊ አነጋገር ይጠብቃል፤ ‘የወይን እርሻ’ ደግሞ ከቴክኒካዊ ወይም ከጥንታዊ አገላለጽ ይልቅ ግልጽ ነው።
