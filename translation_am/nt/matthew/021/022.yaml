  text: καὶ πάντα ὅσα ⸀ἂν αἰτήσητε ἐν τῇ προσευχῇ πιστεύοντες λήμψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/022.yaml
  text: And whatever you ask in prayer[a], believing[b], you will receive.
translation:
  language: am
  text: እናም በጸሎት እያመናችሁ የምትለምኑትን ሁሉ ትቀበላላችሁ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντα ὅσα
  choice: የምትለምኑትን ሁሉ
  rationale: የግሪኩን ሁሉን አቀፍ አገላለጽ ‘የምትለምኑትን ሁሉ’ በሚል ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἂν αἰτήσητε
  choice: የምትለምኑትን
  rationale: ἄν ከንዑስ አንቀጽ ጋር የሚያመለክተው ያልተወሰነ አጠቃላይነት በአማርኛው የግስ ዘመድ አንቀጽ በተፈጥሮ ተገልጿል፤ ‘ልትለምኑ የምትችሉት’ ብሎ የሞዳል ትርጉም ማብዛት አያስፈልግም።
- source_word: ἐν τῇ προσευχῇ
  choice: በጸሎት
  rationale: ይህ የስም ሐረግ በዘመናዊ አማርኛ ‘በጸሎት’ ተብሎ በተፈጥሮ ይገለጻል።
- source_word: πιστεύοντες
  choice: እያመናችሁ
  rationale: የአሁን ጊዜ አሳታፊው ከመለመኑ ጋር በአንድ ጊዜ የሚከናወን ማመንን ያሳያል፤ ‘እያመናችሁ’ ይህን ግንኙነት ያለ ግልጽ ሁኔታዊ አንቀጽ ይጠብቃል።
- source_word: λήμψεσθε
  choice: ትቀበላላችሁ
  rationale: የወደፊት ጊዜ አመልካችነቱንና ‘መቀበል’ የሚለውን መደበኛ የመጽሐፍ ቅዱስ አገላለጽ ይጠብቃል።
theological_decisions:
- issue: የእምነት ከጸሎት መመለስ ጋር ያለው ግንኙነት
  choice: እያመናችሁ
  alternative: ብታምኑ / የምትለምኑትን በእምነት
  rationale: ግሪኩ ግልጽ ሁኔታዊ አንቀጽ ሳይሆን አሳታፊ ይጠቀማል። ስለዚህ ‘እያመናችሁ’ የጸሎትና የእምነትን ግንኙነት ያሳያል፤ ጥቅሱ ያልገለጸውን የሁኔታ ሥርዓት ግን አይጨምርም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። ‘መለመን’ በጸሎት ውስጥ መጠየቅን በተፈጥሮ ስለሚገልጽ ተመርጧል። የግሪኩን አሳታፊ ቅርጽ ለመጠበቅ ‘እያመናችሁ’ ተጠቅመናል።
