  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ተከታታይ ሦስት ድርጊቶች በአማርኛ ተፈጥሯዊ ምት ተጠብቀዋል።
