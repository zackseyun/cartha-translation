  naturalness: The wording is generally modern and clear. Removing the redundant object suffixes from ደበደቡት/ገደሉት/ወገሩት after explicit object nouns makes the coordinated clauses more idiomatic.
  terminology: ባሪያዎች appropriately preserves the stronger ownership/subordination sense of δοῦλοι in line with the supplied lexical and theological decision. The lexical alternative አገልጋዮች is accurately retained in the note.
