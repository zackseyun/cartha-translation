  text: καὶ λαβόντες οἱ γεωργοὶ τοὺς δούλους αὐτοῦ ὃν μὲν ἔδειραν, ὃν δὲ ἀπέκτειναν, ὃν δὲ ἐλιθοβόλησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/035.yaml
  text: And the tenant farmers took his servants; one they beat[a], another they killed, and another they stoned.
translation:
  language: am
  text: ተከራይ ገበሬዎቹም የእርሱን ባሪያዎች[a] ያዙ፤ አንዱን ደበደቡ፣ ሌላውን ገደሉ፣ ሌላውንም በድንጋይ ወገሩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አገልጋዮች።” የግሪኩ δοῦλοι የሚለው ቃል እንደ አውዱ “ባሪያዎች” ወይም “አገልጋዮች” ማለት ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: ተከራይ ገበሬዎቹ
  rationale: በምሳሌው አውድ እነዚህ ሰዎች የመሬቱ ባለቤቶች ሳይሆኑ መሬቱን ተከራይተው የሚያርሱ ናቸው፤ ይህ አተረጓጎም የግብርና ሥራቸውንና የኪራይ ግንኙነታቸውን አንድ ላይ ያሳያል።
- source_word: λαβόντες
  choice: ያዙ
  rationale: በዚህ የጥቃት አውድ ‘ያዙ’ የሚለው ተፈጥሯዊ ሲሆን ግሱ በግልጽ ከሚናገረው በላይ ኃይል አይጨምርም።
- source_word: δούλους
  choice: ባሪያዎቹን
  rationale: δοῦλος በባለቤቱ ሥልጣን ሥር ያሉትን ሰዎች ያመለክታል፤ ‘ባሪያዎቹን’ የባለቤትነትና የተገዥነት ሁኔታውን ይጠብቃል። ‘አገልጋዮቹን’ የሚለው አማራጭ በማስታወሻ ቀርቧል።
- source_word: ἔδειραν
  choice: ደበደቡት
  rationale: ግሱ መምታትን ወይም መደብደብን ያመለክታል፤ ‘ደበደቡት’ ተፈጥሯዊና ዘዴውን ያለአግባብ የማይወስን ነው።
- source_word: ἀπέκτειναν
  choice: ገደሉት
  rationale: የግሪኩን ቀጥተኛ ትርጉም ያለ ተጨማሪ የሕግ ወይም የሞራል ፍርድ ያስተላልፋል።
- source_word: ἐλιθοβόλησαν
  choice: በድንጋይ ወገሩት
  rationale: በድንጋይ የሚፈጸመውን ጥቃት በግልጽና በተለመደ አማርኛ ይገልጣል።
- source_word: ὃν μὲν ... ὃν δὲ ... ὃν δὲ
  choice: አንዱን ... ሌላውን ... ሌላውንም
  rationale: የተለያዩ ባሪያዎች የተለያየ ጥቃት እንደደረሰባቸው የግሪኩን አከፋፋይ አወቃቀር በግልጽ ያሳያል።
theological_decisions:
