  text: πάλιν ἀπέστειλεν ἄλλους δούλους πλείονας τῶν πρώτων, καὶ ἐποίησαν αὐτοῖς ὡσαύτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/036.yaml
  text: Again he sent other servants[a], more than the first ones, and they did the same to them.
translation:
  language: am
  text: ደግሞም ከመጀመሪያዎቹ ይልቅ የበዙ ሌሎች አገልጋዮችን[a] ላከ፤ በእነርሱም ላይ እንደዚያው አደረጉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሌሎች ባሪያዎችን።” የግሪኩ ቃል δοῦλος እንደ አውዱ “አገልጋይ” ወይም “ባሪያ” ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: ደግሞም
  rationale: ድርጊቱ መደገሙን በተፈጥሯዊ የአማርኛ ትረካ ያሳያል።
- source_word: ἀπέστειλεν
  choice: ላከ
  rationale: ቀላልና ቀጥተኛ የትረካ አቻ ሲሆን በግሱ ውስጥ የሌለ ተጨማሪ ሐሳብ አያስገባም።
- source_word: ἄλλους δούλους
  choice: ሌሎች አገልጋዮችን
  rationale: በዚህ ምሳሌ የተላኩ የቤቱ ባለቤት ተወካዮች መሆናቸው ዋናው ነጥብ ነው፤ በዘመናዊ አማርኛም ‘አገልጋዮች’ ተፈጥሯዊና ክብር ያለው ነው። የ‘ባሪያዎች’ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: πλείονας τῶν πρώτων
  choice: ከመጀመሪያዎቹ የበለጡ
  rationale: ሁለተኛው ቡድን ከመጀመሪያው በቁጥር የበዛ መሆኑን በአጭርና ተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἐποίησαν αὐτοῖς ὡσαύτως
  choice: እነርሱንም እንደዚያው አደረጓቸው
  rationale: በቀደመው ቁጥር የተገለጠውን አያያዝ በውስጠ ግንዛቤ ይጠቅሳል፤ የግሪኩን አጠቃላይ አገላለጽ ሳያብራራ ይጠብቃል።
theological_decisions:
- issue: በምሳሌው ውስጥ δοῦλος የሚለውን ቃል መተርጎም
  choice: አገልጋዮች
  alternative: ባሪያዎች
  rationale: በዚህ አውድ ትኩረቱ በመላካቸውና በደረሰባቸው አያያዝ ላይ እንጂ በሕጋዊ ባርነት ሁኔታቸው ላይ አይደለም። ‘አገልጋዮች’ ለዘመናዊ አንባቢ ተፈጥሯዊ ሲሆን የግሪኩ ሌላ ትርጉም በግርጌ ማስታወሻ ተገልጧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ የአማርኛ ትረካ። ‘እንደዚያው አደረጓቸው’ የሚለው አገላለጽ ከቀደመው ቁጥር ጋር ያለውን የትርጉም ትስስር ይጠብቃል።
