source:
  edition: SBLGNT
  text: Λέγει αὐτοῖς ὁ Ἰησοῦς· Οὐδέποτε ἀνέγνωτε ἐν ταῖς γραφαῖς· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας· παρὰ κυρίου ἐγένετο αὕτη, καὶ ἔστιν θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/042.yaml
  text: 'Jesus said to them[a], “Have you never read in the Scriptures: ‘The stone that the builders rejected—this one has become the cornerstone. This came from the Lord[b], and it is marvelous in our eyes’?”'
translation:
  language: am
  text: ኢየሱስም እንዲህ አላቸው፦ “በቅዱሳት መጻሕፍት፣ ‘ግንበኞች ያልተቀበሉት ድንጋይ፣ እርሱ የማዕዘን ዋና ድንጋይ[a] ሆነ፤ ይህ ከጌታ[b] የመጣ ነው፣ በዓይኖቻችንም ዘንድ ድንቅ ነው’ የሚለውን ፈጽሞ አላነበባችሁምን?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “የማዕዘን ራስ።” “የላይኛው መደምደሚያ ድንጋይ” የሚል አማራጭ ትርጉምም አለ።
    reason: lexical_alternative
  - marker: b
    text: ግሪኩ “ከጌታ” ይላል፤ ጥቅሱ የተወሰደበት የዕብራይስጥ ጽሑፍ ግን “ከእግዚአብሔር” (YHWH) ይላል።
    reason: alternative_reading
lexical_decisions:
- source_word: Λέγει
  choice: አላቸው
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ አገላለጽ በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜን በሚያመለክተው «አላቸው» ተተርጉሟል።
- source_word: Οὐδέποτε
  choice: ፈጽሞ … አላነበባችሁምን
  rationale: ቃሉ የጥያቄውን አጽንዖት ያሳያል፤ «ፈጽሞ» በአማርኛ ይህን የተፈጥሮ ቃና ይጠብቃል።
- source_word: γραφαῖς
  choice: መጻሕፍት
  rationale: በዚህ አውድ የእስራኤልን ቅዱሳን መጻሕፍት ያመለክታል፤ «መጻሕፍት» በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የታወቀና ግልጽ ነው።
- source_word: ἀπεδοκίμασαν
  choice: ያልተቀበሉት
  rationale: ግንበኞቹ ድንጋዩን ለግንባታ የማይሆን አድርገው እንደጣሉት ያሳያል፤ ምስሉን ሳያሰፋ «ያልተቀበሉት» የመቃወምና የመጣልን ሐሳብ በተፈጥሮ ያስተላልፋል።
- source_word: οἱ οἰκοδομοῦντες
  choice: ግንበኞች
  rationale: በስም ተግባር የቀረበውን የግሪክ አሳታፊ ቃል በአጭርና ተፈጥሯዊ መንገድ ይተረጉማል።
- source_word: οὗτος
  choice: እርሱ
  rationale: ወደተጠቀሰው ድንጋይ የሚመለሰውን አጽንዖት ይጠብቃል።
- source_word: κεφαλὴν γωνίας
  choice: የማዕዘን ራስ ድንጋይ
  rationale: የግሪኩን «የማዕዘን ራስ» ምስል በግልጽ አማርኛ ይጠብቃል፤ ቃሉ የማዕዘን መሠረት ድንጋይን ወይም የላይኛውን መደምደሚያ ድንጋይ ሊያመለክት ስለሚችል አሻሚነቱ በማስታወሻ ተጠብቋል።
- source_word: παρὰ κυρίου
  choice: ከጌታ
  rationale: παρά ከዝርያ ቅጽ ጋር በዚህ ስፍራ ምንጭን ወይም መነሻን ያመለክታል፤ «ከጌታ» ይህን በቀጥታ ያስተላልፋል።
- source_word: θαυμαστὴ
  choice: ድንቅ
  rationale: አስደናቂና ልዩ መሆኑን በአጭር፣ ክብር ባለውና ዘመናዊ አማርኛ ይገልጻል።
theological_decisions:
- issue: በመዝሙሩ ጥቅስ ውስጥ κύριος የሚለውን መተርጎም
  choice: ጌታ
  alternative: እግዚአብሔር
  rationale: የግሪኩ ጽሑፍ κυρίου ይላልና ዋናው ጽሑፍ «ጌታ» ብሎ ተርጉሞታል። የተጠቀሰው የዕብራይስጥ መዝሙር ግን የመለኮታዊውን ስም YHWH ይዟል፤ ይህ በማስታወሻ በግልጽ ተጠቅሷል።
- issue: የድንጋዩ ምስል መሲሐዊ አተገባበር
  choice: ምስሉን ያለ ትርጓሜያዊ ማስፋፊያ ማቆየት
  alternative: ድንጋዩ መሲሑ ወይም ኢየሱስ መሆኑን በዋናው ጽሑፍ በግልጽ መጨመር
  rationale: አውዱ ኢየሱስ ጥቅሱን ለራሱ እንደሚያውለው ቢያሳይም፣ ይህ ቁጥር ራሱ የመዝሙሩን ምስላዊ ቃል ብቻ ይጠቅሳል። ትርጉሙ ጽሑፉ ያልጨመረውን መለያ አልጨመረም።
