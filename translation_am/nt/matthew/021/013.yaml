base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/013.yaml
  text: And he says to them[a], “It is written[b], ‘My house will be called a house of prayer,’ but you are making it a den of robbers.”
translation:
  language: am
  text: እንዲህም ይላቸዋል፦ «ተጽፎአል፦ ‘ቤቴ የጸሎት ቤት ይባላል።’[a] እናንተ ግን የወንበዴዎች ዋሻ[b] እያደረጋችሁት ነው።»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ኢየሱስ ኢሳይያስ 56፥7ን ከኤርምያስ 7፥11 ጋር አጣምሮ ተናግሯል።
    reason: cross_reference
  - marker: b
    text: ወይም፣ «የዘራፊዎች»፤ የግሪኩ ቃል ኃይል የሚጠቀሙ ወንበዴዎችንም ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: እንዲህም አላቸው
  rationale: የግሪኩን ታሪካዊ የአሁን ጊዜ አገላለጽ ቃል በቃል ማቅረብ በአማርኛ ያልተፈጥሯዊ ስለሚሆን፣ የትረካውን ሕያውነት ሳያጠፋ በተፈጥሯዊ ያለፈ ጊዜ ቀረበ።
- source_word: Γέγραπται
  choice: እንዲህ ተብሎ ተጽፎአል
  rationale: ፍጹም ተደራጊውን ቅርጽና የተጻፈው ቃል ዘላቂ ሥልጣን እንዳለው የሚጠቁመውን የመጽሐፍ ጥቅስ መግቢያ ይጠብቃል።
- source_word: Ὁ οἶκός μου
  choice: ቤቴ
  rationale: ‘ቤት’ የሚለው ቀጥተኛ ትርጉም የትንቢታዊውን ጥቅስ አገላለጽ ይጠብቃል፤ ‘ቤተ መቅደሴ’ የሚለው ይበልጥ ትርጓሜያዊ ነው።
- source_word: οἶκος προσευχῆς
  choice: የጸሎት ቤት
  rationale: የግሪኩን የዝምድና ግንባታ በተፈጥሯዊና በተለመደ የአማርኛ አገላለጽ ያቀርባል።
- source_word: κληθήσεται
  choice: ተብሎ ይጠራል
  rationale: የወደፊት ጊዜ ተደራጊ ቅርጹን በግልጽ ዘመናዊ አማርኛ ያቀርባል።
- source_word: ποιεῖτε
  choice: እያደረጋችሁት ነው
  rationale: የአሁን ጊዜውን ቀጣይ ድርጊትና ቀጥተኛውን ‘ማድረግ’ የሚል ትርጉም ይጠብቃል።
- source_word: σπήλαιον
  choice: ዋሻ
  rationale: ቃሉ በቀጥታ ዋሻን ወይም መደበቂያን ያመለክታል፤ እዚህ በኤርምያስ 7፥11 ያለውን ምስል ይጠብቃል።
- source_word: λῃστῶν
  choice: የወንበዴዎች
  rationale: ቃሉ ዘራፊዎችን ብቻ ሳይሆን ኃይል የሚጠቀሙ ቀማኞችንም ሊያመለክት ስለሚችል ‘ወንበዴዎች’ ስፋቱን በተሻለ ይይዛል።
