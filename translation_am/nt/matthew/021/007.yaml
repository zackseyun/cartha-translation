  rationale: ጉዳዩ በዋናነት ሰዋሰዋዊና ትረካዊ አሻሚነት እንጂ የትምህርተ እምነት ክርክር አይደለም። ምንጩ ያልፈታውን ዋናው ጽሑፍ አይፈታውም፤ የተለመደው ሌላ ግንዛቤ በግርጌ ማስታወሻ ቀርቧል።
