base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/007.yaml
  text: They brought the donkey and the colt[a], and put their cloaks on them, and he sat on them.
translation:
  language: am
  text: አህያይቱንና ውርንጫውን አመጡ፤ ልብሶቻቸውንም በእንስሳቱ ላይ አኖሩ፤ እርሱም በእነዚያ ላይ ተቀመጠ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በእንስሳቱ ላይ በተነጠፉት ልብሶች ላይ ተቀመጠ።»
    reason: alternative_reading
lexical_decisions:
- source_word: ἤγαγον
  choice: አመጡ
  rationale: የἄγω ያለፈ ጊዜ ቅርጽ በዚህ ትረካ ደቀ መዛሙርቱ እንስሳቱን ወደ ኢየሱስ እንዳመጡ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τὴν ὄνον
  choice: አህያይቱን
  rationale: ὄνος አህያን ያመለክታል፤ የሴት ፆታ መስተአምር መኖሩንና ከውርንጫው ጋር ያላትን ግንኙነት የአማርኛው የሴት ቅርጽ በቀላሉ ይጠብቃል።
- source_word: τὸν πῶλον
  choice: ውርንጫውን
  rationale: πῶλος ወጣት እንስሳን፣ በዚህ አውድ የአህያ ግልገልን ያመለክታል፤ «ውርንጫ» ተፈጥሯዊና አጭር አማርኛ ነው።
- source_word: ἐπέθηκαν ἐπ’ αὐτῶν τὰ ἱμάτια
  choice: ልብሶቻቸውንም በእነርሱ ላይ አኖሩ
  rationale: ἱμάτια በአውዱ ደቀ መዛሙርቱ ያወለቋቸውን የውጭ ልብሶች ያመለክታል። «ልብሶቻቸው» በዘመናዊ አማርኛ ግልጽ ሲሆን የባለቤትነት ቅጥያው ከአውዱ የተገኘ ነው።
- source_word: αὐτῶν
  choice: በእነርሱ ላይ
  rationale: የብዙ ቁጥር ተውላጠ ስሙን በብዙ ቁጥር በግልጽ ይጠብቃል፤ በመጀመሪያው አጠቃቀም ወደ ሁለቱ እንስሳት ይመለሳል።
- source_word: ἐπεκάθισεν ἐπάνω αὐτῶν
  choice: እርሱም በእነርሱ ላይ ተቀመጠ
  rationale: የግሪኩን የብዙ ቁጥር ተውላጠ ስም ሳይፈታ ይጠብቃል፤ ተውላጠ ስሙ እንስሳቱን ወይም በእነርሱ ላይ የተነጠፉትን ልብሶች ሊያመለክት የሚችለው አሻሚነት በማስታወሻ ተገልጿል።
theological_decisions:
- issue: በκαὶ ἐπεκάθισεν ἐπάνω αὐτῶν ውስጥ የመጨረሻው αὐτῶν ማጣቀሻ
  choice: «በእነርሱ ላይ ተቀመጠ» በማለት የብዙ ቁጥሩንና አሻሚነቱን መጠበቅ
