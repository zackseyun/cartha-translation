  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐὰν ἔχητε πίστιν καὶ μὴ διακριθῆτε, οὐ μόνον τὸ τῆς συκῆς ποιήσετε, ἀλλὰ κἂν τῷ ὄρει τούτῳ εἴπητε· Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν, γενήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/021.yaml
  text: But Jesus answered them[a], “Truly I say to you, if you have faith and do not doubt, you will not only do what was done to the fig tree, but even if you say to this mountain, ‘Be taken up and thrown into the sea,’ it will happen.”
translation:
  language: am
  text: ኢየሱስም መልሶ እንዲህ አላቸው፦ “እውነት እላችኋለሁ፤ እምነት ቢኖራችሁና ባትጠራጠሩ[a]፣ በበለሲቱ ላይ የተደረገውን ብቻ አታደርጉም፤ ይልቁንም ይህን ተራራ፣ ‘ተነሣና ወደ ባሕር ተጣል!’ ብትሉት ይሆናል።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ባትወላወሉ” ወይም “በሐሳባችሁ ባትከፈሉ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: ኢየሱስም መልሶ እንዲህ አላቸው
  rationale: የἀποκριθεὶςን የመልስ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል፤ δέ ደግሞ በ“-ም” እንደ ቀላል የትረካ ሽግግር ተገልጿል።
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: እውነት እላችኋለሁ
  rationale: የኢየሱስን ክብደት ያለውና ሥልጣናዊ መግቢያ በግልጽ፣ ዘመናዊ አማርኛ ይጠብቃል።
- source_word: ἐὰν ἔχητε πίστιν
  choice: እምነት ቢኖራችሁ
  rationale: በዚህ ዐውድ πίστις በእግዚአብሔር ላይ ያለን የታመነ መደገፍ ያመለክታል፤ “እምነት” የተለመደና ተገቢ ምርጫ ነው።
- source_word: μὴ διακριθῆτε
  choice: ባትጠራጠሩ[a]
  rationale: በዐውዱ ያለውን የውስጥ ጥርጣሬ በቀጥታ ያሳያል፤ የመወላወል ወይም በሐሳብ የመከፈል ጥላዎች በማስታወሻ ተጠብቀዋል።
- source_word: οὐ μόνον τὸ τῆς συκῆς ποιήσετε
  choice: በበለሲቱ ላይ የተደረገውን ብቻ አታደርጉም
  rationale: ግሪኩ በአጭሩ የሚጠቅሰውን የበለስ ዛፉን ክስተት በተፈጥሯዊ አማርኛ ግልጽ ያደርጋል።
- source_word: κἂν τῷ ὄρει τούτῳ εἴπητε
  choice: ይልቁንም ይህን ተራራ … ብትሉት
  rationale: κἄν ከበለሲቱ ወደ ከፍ ያለው ምሳሌ የሚያደርገውን አጽንዖት “ይልቁንም” ያሳያል፤ ὄρος በመደበኛው “ተራራ” ተብሏል።
- source_word: Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν
  choice: ተነሥተህ ወደ ባሕር ተጣል
  rationale: የሁለቱን ተገብሮ ትእዛዛት እና ሥጋዊ ምስላዊነታቸውን በግልጽና ሕያው አማርኛ ይጠብቃል።
- source_word: γενήσεται
  choice: ይሆናል
  rationale: የታዘዘው ክስተት እንደሚፈጸም ቀጥተኛና ተፈጥሯዊ በሆነ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: ተአምራዊ ድርጊትን በሚመለከተው ንግግር πίστιςን መተርጎም
  choice: እምነት
  alternative: መታመን፤ ታማኝነት
  rationale: ዐውዱ በዋነኝነት የባሕርይ ታማኝነትን ሳይሆን በእግዚአብሔር የሚደረግን የታመነ መደገፍ ያመለክታል።
- issue: ተራራን ስለማንቀሳቀስ የኢየሱስ ንግግር ባሕርይ
  choice: ጠንካራውን ምስላዊ አነጋገር ሳይገድቡ መጠበቅ
  alternative: ቃል በቃል ብቻ የሚፈጸም ተአምራዊ ተስፋ፤ ችግሮችን ስለማሸነፍ ብቻ የሚናገር ንጹሕ ዘይቤ
  rationale: ጽሑፉ ትርጓሜያዊ ውጥረቱን ራሱ እንዲይዝ ተደርጓል፤ ትርጉሙ ንግግሩን ወደ አንዱ አስተምህሮዊ አቋም አያጠብበውም።
