  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። የግሪኩ አጭር አገላለጽ በአማርኛ እንዲፈጥር በትንሹ ተገልጿል፣ ነገር ግን ምስላዊና ሥነ መለኮታዊ ውጥረቱ አልተፈታም።
