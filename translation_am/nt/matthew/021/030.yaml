  text: ከዚያም ወደ ሁለተኛው ቀርቦ እንዲሁ አለው። እርሱም፣ “እኔ እሄዳለሁ[a]፣ ጌታዬ[b]” ብሎ መለሰ፤ ነገር ግን አልሄደም።
  philosophy: optimal-equivalence
