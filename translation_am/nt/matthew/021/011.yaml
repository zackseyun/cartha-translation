id: MAT.21.11
reference: Matthew 21:11
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι ἔλεγον· Οὗτός ἐστιν ⸂ὁ προφήτης Ἰησοῦς⸃ ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/011.yaml
  text: And the crowds were saying[a], “This is the prophet Jesus, from Nazareth in Galilee.”
translation:
  language: am
  text: ሕዝቡም፣ “ይህ በገሊላ ከምትገኘው ናዝሬት የመጣው ነቢዩ[a] ኢየሱስ ነው” ይሉ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አንድ ነቢይ።” የግሪኩ ጽሑፍ “ነቢዩ” ይላል፤ ይህም ሕዝቡ ኢየሱስን እንደ ታወቀ ነቢያዊ ሰው መለየታቸውን ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι
  choice: ሕዝቡም
  rationale: ὄχλοι በቅርጹ ብዙ ቁጥር ቢሆንም፣ በተፈጥሯዊ ዘመናዊ አማርኛ ‘ሕዝቡ’ የተሰበሰቡትን ሰዎች በጋራ ያመለክታል፤ -ም ደግሞ δέ የሚሰጠውን ቀላል የትረካ ትስስር ይጠብቃል።
- source_word: ἔλεγον
  choice: ይሉ ነበር
  rationale: የግሪኩ ያልተፈጸመ የጊዜ ቅርጽ በዚህ ስፍራ ቀጣይ ወይም ተደጋጋሚ ንግግርን ሊያመለክት ስለሚችል ‘ይሉ ነበር’ ይህን ገጽታ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: Οὗτός ἐστιν
  choice: ይህ … ነው
  rationale: የመለያ ዓረፍተ ነገሩን ቀጥተኛና ተፈጥሯዊ በሆነ የአማርኛ አወቃቀር ያቀርባል።
- source_word: ὁ προφήτης
  choice: ነቢዩ
  rationale: የግሪኩን የተወሰነ አመልካች በ‘ነቢዩ’ በማስቀመጥ ሕዝቡ ኢየሱስን እንደታወቀው የትንቢት ሰው ሊለዩት የሚችሉበትን ትርጉም ይጠብቃል።
- source_word: Ἰησοῦς
  choice: ኢየሱስ
  rationale: የግል ስሙ በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም በተለመደው ቅርጽ ቀርቧል።
- source_word: ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας
  choice: ከገሊላዋ ናዝሬት የመጣው
  rationale: ሐረጉ የኢየሱስን መገኛ ይገልጣል። ‘ከገሊላዋ ናዝሬት’ ናዝሬት በገሊላ የምትገኝ መሆኗን በተፈጥሯዊ አማርኛ ያሳያል፤ ‘የመጣው’ የግሪኩን አንቀጻዊ ሐረግ ያንጸባርቃል።
theological_decisions:
- issue: ὁ προφήτης በተወሰነ ወይስ ባልተወሰነ መንገድ መተርጎም
  choice: ነቢዩ
  alternative: አንድ ነቢይ
  rationale: ግሪኩ ὁ የተባለውን አመልካች ይዟል፤ ስለዚህ ‘ነቢዩ’ የሚለው ዋና ጽሑፍ ቅርጹንና ኢየሱስ እንደታወቀ የትንቢት ሰው መለየቱን ሊያመለክት የሚችለውን ድምፀት ይጠብቃል። ነገር ግን በዚህ አውድ የተወሰነው ቅርጽ በአማርኛ ‘አንድ ነቢይ’ ተብሎ ሊተረጎም የሚችል አጠቃቀም ስላለው አማራጩ በማስታወሻ ተጠቅሷል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለሰፊው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ያልተፈጸመ ጊዜ ‘ይሉ ነበር’ ተብሎ፣ የተወሰነው ὁ προφήτης ደግሞ ‘ነቢዩ’ ተብሎ ተጠብቋል።
