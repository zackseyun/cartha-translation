base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/005.yaml
  text: Tell the daughter of Zion[a], ‘Look, your king is coming to you, gentle and mounted on a donkey, and on a colt[b], the foal of a beast of burden.’
translation:
  language: am
  text: “ለጽዮን ሴት ልጅ እንዲህ በሉ፦ ‘እነሆ፣ ንጉሥሽ የዋህ[a] ሆኖ፣ በአህያ ላይ፣ በውርንጫም፣ በጭነት እንስሳ ግልገል ላይ ተቀምጦ ወደ አንቺ ይመጣል።’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ትሑት።” የግሪኩ πραΰς “የዋህ፣” “ገር፣” ወይም “ትሑት” ማለት ሊሆን ይችላል፤ ዘካርያስ 9፥9ንም ያስተጋባል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἴπατε
  choice: እንዲህ በሉ
  rationale: የብዙ ቁጥር ትእዛዝንና ቀጥሎ ያለውን ጥቅስ በተፈጥሯዊ አማርኛ ያስተዋውቃል።
- source_word: τῇ θυγατρὶ Σιών
  choice: ለጽዮን ልጅ
  rationale: ነቢያዊውን ሰውኛ አድርጎ የመናገር ምስል ሳያጠፋ በአማርኛ ይገልጻል።
- source_word: Ἰδοὺ
  choice: እነሆ
  rationale: ትኩረት የሚጠራውን የግሪክ ቃል በግልጽና በክቡር መጽሐፍ ቅዱሳዊ አገላለጽ ያቀርባል።
- source_word: ὁ βασιλεύς σου
  choice: ንጉሥሽ
  rationale: የሴት ነጠላ ተሳቢውን ከ‘ጽዮን ልጅ’ ጋር አስማምቶ የንጉሣዊነቱን ኃይል ይጠብቃል።
- source_word: ἔρχεταί σοι
  choice: ወደ አንቺ ይመጣል
  rationale: በ‘ጽዮን ልጅ’ የተወከለችውን ሴት ነጠላ ተቀባይ ግልጽ አድርጎ የመምጣቱን ሕያው እንቅስቃሴ ያሳያል።
- source_word: πραῢς
  choice: የዋህ
  rationale: የገርነትንና የልዝብነትን ትርጉም በተፈጥሯዊ ዘመናዊ አማርኛ ይይዛል፤ ‘ትሑት’ የሚለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ἐπιβεβηκὼς
  choice: ተቀምጦ
  rationale: በእንስሳው ላይ መውጣቱንና ተቀምጦ መምጣቱን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἐπὶ ὄνον
  choice: በአህያ ላይ
  rationale: የግሪኩን ቀጥተኛ የቦታ ሐረግ ግልጽ አድርጎ ይተረጉማል።
- source_word: πῶλον
  choice: ውርንጫ
  rationale: በዐውዱ የአህያ ግልገልን የሚያመለክት ተፈጥሯዊ የአማርኛ ቃል ነው።
- source_word: υἱὸν ὑποζυγίου
  choice: በጭነት እንስሳ ልጅ በሆነ
  rationale: የሴማዊ አገላለጹን ‘ልጅ’ ምስልና ὑποζύγιον የሚያመለክተውን ጭነት ተሸካሚ እንስሳ በማያጠብ መንገድ ይጠብቃል።
theological_decisions:
- issue: ከዘካርያስ 9፥9 የተወሰደውን መሲሐዊ ጥቅስ ከዕብራይስጡ ወይም ከተለመደው ትርጉም ጋር ማስማማት
  choice: የማቴዎስን የግሪክ አገላለጽ ‘የዋህ ... በአህያ ላይ፣ ... በውርንጫ ላይ’ በማለት መጠበቅ
  alternative: πραῢςን ‘ትሑት’ ብሎ መተርጎም ወይም ሁለቱን የእንስሳ ሐረጎች ወደ አንድ አገላለጽ ማጠቃለል
  rationale: ጥቅሱ መሲሐዊ ፍጻሜን ይገልጻል፤ ሆኖም ትርጉሙ ከሌላ ጽሑፍ ጋር ከማስማማት ይልቅ የማቴዎስን ትክክለኛ የግሪክ አገላለጽና ሁለቱን የተያያዙ የእንስሳ ሐረጎች ይጠብቃል።
