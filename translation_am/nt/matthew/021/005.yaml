  verdict: revise
  source_fidelity: The draft preserves the imperative, Zion personification, royal address, gentleness, and Matthew’s two linked animal expressions. However, “ጽዮን ልጅ” is not the most natural or adequately explicit Amharic representation of the feminine prophetic personification, and “በጭነት እንስሳ ልጅ በሆነ ውርንጫ” is syntactically heavy and less clear than an appositional rendering.
  naturalness: Using “ለጽዮን ሴት ልጅ” is established, intelligible modern biblical Amharic. Recasting the final phrase as “በውርንጫም፣ በጭነት እንስሳ ግልገል ላይ” more naturally preserves the linked/appositional Greek phrasing without implying two separate rides.
  terminology: “የዋህ” suitably renders πραΰς, with “ትሑት” retained as a valid alternative. “እነሆ” is appropriate for Ἰδού. “ውርንጫ” retains the traditional young-animal term, while “ግልገል” renders υἱός idiomatically in this animal context.
  issues:
  - severity: medium
    issue: The phrase “ለጽዮን ልጅ” is elliptical and can sound unnatural in modern standard Amharic.
    rationale: The source’s feminine personification should be explicit and idiomatic. “ለጽዮን ሴት ልጅ” preserves the prophetic image without flattening it into a collective.
  - severity: medium
    issue: “በጭነት እንስሳ ልጅ በሆነ ውርንጫ” has cumbersome modifier order.
    rationale: It obscures the appositional relationship in πῶλον υἱὸν ὑποζυγίου. A coordinated/appositional Amharic phrase is clearer while retaining Matthew’s doubled wording.
