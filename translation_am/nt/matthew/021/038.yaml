  text: οἱ δὲ γεωργοὶ ἰδόντες τὸν υἱὸν εἶπον ἐν ἑαυτοῖς· Οὗτός ἐστιν ὁ κληρονόμος· δεῦτε ἀποκτείνωμεν αὐτὸν καὶ ⸀σχῶμεν τὴν κληρονομίαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/038.yaml
  text: But when the tenant farmers saw the son[a], they said among themselves, ‘This is the heir. Come, let us kill him and seize his inheritance.’
translation:
  language: am
  text: ተከራይ ገበሬዎቹ ግን ልጁን ባዩ ጊዜ እርስ በርሳቸው እንዲህ ተባባሉ፦ “ይህ ወራሹ ነው፤ ኑ፣ እንግደለውና ርስቱን እንውሰድ[a]።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “ርስቱን እንያዝ”፤ በዚህ አውድ በኃይል ለራሳቸው ለመውሰድ ያሰቡትን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: ገበሬዎቹ
  rationale: በምሳሌው አውድ የወይኑን ቦታ ተከራይተው የሚያርሱ ሰዎችን ያመለክታል፤ “ገበሬዎቹ” በአማርኛ ተፈጥሯዊ ሲሆን የተከራይነታቸው ሁኔታ ከአውዱ ይገባል።
- source_word: ἰδόντες
  choice: ባዩ ጊዜ
  rationale: የግሪኩን የቅደም ተከተል ግንኙነት በተፈጥሯዊ የአማርኛ ጊዜ ንዑስ አረፍተ ነገር ያሳያል።
- source_word: τὸν υἱόν
  choice: ልጁን
  rationale: ግሪኩ በቀጥታ “ልጁን” ይላል፤ በአማርኛ የተወሰነነት ቅጥያው ተፈጥሯዊ ሲሆን የማን ልጅ እንደሆነ ከቀደመው አውድ ይታወቃል።
- source_word: ἐν ἑαυτοῖς
  choice: እርስ በርሳቸው … ተባባሉ
  rationale: በቡድናቸው ውስጥ የተነጋገሩትን ሐሳብ በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: κληρονόμος
  choice: ወራሹ
  rationale: ሕጋዊውንና የውርስ ትርጉሙን በቀጥታ የሚያስተላልፍ መደበኛ የአማርኛ ቃል ነው።
- source_word: δεῦτε
  choice: ኑ
  rationale: የጋራ ድርጊትን የሚያነሣሣውን የግሪክ ትእዛዛዊ ጥሪ በአጭርና ተፈጥሯዊ መንገድ ያቀርባል።
- source_word: ἀποκτείνωμεν
  choice: እንግደለው
  rationale: የማነሣሣት ንዑስ አንቀጹን “እን…” በሚለው የአማርኛ ቅርጽ በቀጥታ ያሳያል፤ “እንግደለው” ከሕጋዊ ወይም ከተጨማሪ የሞራል ፍርድ ቃላት ይልቅ ምንጩን በቅርብ ይከተላል።
- source_word: σχῶμεν
  choice: እንውሰድ
  rationale: የግሪኩ መሠረታዊ ሐሳብ “እንያዝ/የእኛ እናድርግ” የሚል ነው፤ በዚህ አውድ “እንውሰድ” በኃይል ለራሳቸው ለማድረግ ያላቸውን ዓላማ ተፈጥሯዊ በሆነ አማርኛ ያሳያል።
- source_word: κληρονομίαν αὐτοῦ
  choice: ርስቱን
  rationale: “ርስት” የκληρονομία ቀጥተኛና የተለመደ አማርኛ አቻ ነው፤ የሦስተኛ ወንድ ነጠላ ባለቤትነት በ“-ቱን” ቅጥያ ተገልጧል።
theological_decisions:
- issue: በምሳሌው ውስጥ የልጁ ማንነት
  choice: በትርጉሙ “ልጁን” ብቻ በማለት የምሳሌውን የታሪክ ደረጃ መጠበቅ
  alternative: ልጁ ኢየሱስን እንደሚወክል በትርጉሙ ውስጥ በግልጽ ማመልከት
  rationale: በማቴዎስ ትረካ ምሳሌው ወደ ኢየሱስ ቢያመለክትም፣ ይህ ቁጥር ራሱ በምሳሌው የታሪክ ቃላት ይናገራል። ትርጓሜን ወደ ዋናው ጽሑፍ ሳያስገባ ይህን ውጥረት መጠበቅ ተመራጭ ነው።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የምሳሌው የንግግር ጉልበት በ“ኑ፣ እንግደለው” ተጠብቋል።
