  terminology: ሆሳዕና, ለዳዊት ልጅ, ጌታ, and በአርያም appropriately retain traditional, recognizable biblical terminology. The footnotes accurately explain the Hebrew-derived acclamation, the royal-messianic title without replacing it in the text, and the YHWH background of Psalm 118:26.
