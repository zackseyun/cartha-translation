  yaml_path: translation/nt/matthew/021/009.yaml
  text: And the crowds going ahead of him and those following were crying out[a], saying[c][b], “Hosanna to the Son of David! Blessed is the one who comes in the name of the Lord! Hosanna in the highest!”
translation:
  language: am
  text: ከእርሱም በፊት የሚሄዱትና ከኋላው የሚከተሉት ሕዝቦቹ እንዲህ እያሉ ይጮኹ ነበር፦ “ሆሳዕና[a] ለዳዊት ልጅ![b] በጌታ ስም የሚመጣው የተባረከ ነው![c] ሆሳዕና በአርያም!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ሆሳዕና” ከዕብራይስጥ የመጣ እልልታ ሲሆን፣ “እባክህ አድን” ወይም “አሁን አድን” የሚል መሠረታዊ ትርጉም አለው፤ እዚህ ግን የውዳሴ ጩኸት ሆኖም ያገለግላል።
    reason: lexical_alternative
  - marker: b
