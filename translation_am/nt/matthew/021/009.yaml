    reason: cultural_note
  - marker: c
    text: ይህ ንግግር መዝሙር 118፥26ን ያስተጋባል፤ በዕብራይስጡ ጽሑፍ “ጌታ” የሚለው መለኮታዊውን ስም YHWH ይወክላል።
    reason: cross_reference
