base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/034.yaml
  text: But when the season for the fruits had drawn near[b][a], he sent his servants to the tenant farmers to collect his fruits.
translation:
  language: am
  text: የፍሬ ወቅት በቀረበ ጊዜ ግን፣ የእርሱን ፍሬ ለመቀበል አገልጋዮቹን[a] ወደ ገበሬዎቹ ላከ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ባሪያዎቹን።” የግሪኩ δοῦλος ቃል “አገልጋይ” ወይም “ባሪያ” ማለት ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: በቀረበ ጊዜ
  rationale: ὅτε የጊዜ ንዑስ አረፍተ ነገርን ያስገባል፤ δέ ያለው ቀላል የትረካ ሽግግር በአማርኛው የአረፍተ ነገር ፍሰት ውስጥ በተፈጥሮ ተካቷል።
- source_word: ἤγγισεν
  choice: በቀረበ
  rationale: ἐγγίζω እዚህ ‘ቀረበ’ ማለት ሲሆን፣ የፍሬ ወቅቱ መድረሱን ተፈጥሯዊ በሆነ አማርኛ ይገልጣል።
- source_word: ὁ καιρὸς τῶν καρπῶν
  choice: የፍሬው ወቅት
  rationale: καιρός በግብርናዊው አውድ ተስማሚውን ወይም የተወሰነውን ወቅት ያመለክታል፤ የግሪኩ ብዙ ቁጥር καρπῶν በአማርኛ የስብስብ ስም በሆነው ‘ፍሬ’ ተፈጥሯዊ ሆኖ ተተርጉሟል።
- source_word: τοὺς δούλους αὐτοῦ
  choice: አገልጋዮቹን[a]
  rationale: δοῦλος ‘ባሪያ’ ወይም ‘አገልጋይ’ ሊሆን ይችላል። በምሳሌው ውስጥ የባለቤቱ መልእክተኞች መሆናቸው ትኩረት ስለሚያገኝ ‘አገልጋዮቹ’ ተመርጧል፤ ሌላው ትርጉም በማስታወሻ ተጠብቋል።
- source_word: πρὸς τοὺς γεωργοὺς
  choice: ወደ እነርሱ / ከገበሬዎቹ
  rationale: γεωργοί የወይኑን ቦታ ከባለቤቱ ተቀብለው የሚያርሱ ገበሬዎችን ያመለክታል። የአማርኛው የግስ አወቃቀር ለተፈጥሯዊነት ‘ከገበሬዎቹ ... ወደ እነርሱ’ ተብሎ ተደርጓል።
- source_word: λαβεῖν
  choice: ለመቀበል
  rationale: λαμβάνω በመሠረቱ ‘መውሰድ/መቀበል’ ማለት ነው። ‘ለመቀበል’ ባለቤቱ የሚገባውን ፍሬ ከገበሬዎቹ ማግኘቱን ያሳያል፣ ግሪኩንም ከሚያስፈልገው በላይ አይገልጽም።
- source_word: τοὺς καρποὺς αὐτοῦ
  choice: ፍሬውን
  rationale: የግሪኩ αὐτοῦ ፍሬው የባለቤቱ መሆኑን ያሳያል። በአማርኛ ‘ፍሬውን’ የተወሰነነቱንና ባለቤትነቱን በአውዱ በቂ ሁኔታ ይይዛል።
