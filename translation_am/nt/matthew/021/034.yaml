  terminology: “አገልጋዮቹ” is a reasonable contextual rendering of δούλους, with “ባሪያዎቹን” retained as a lexical alternative. “ገበሬዎቹ” is suitable for γεωργούς; the surrounding parable supplies the tenant context without making the verse itself overly interpretive.
