  text: And they took him[a], threw him out of the vineyard, and killed him.
translation:
  language: am
  text: እርሱን ይዘው፣ ከወይን እርሻው ውጭ ጣሉት፤ ከዚያም ገደሉት።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβόντες
  choice: ይዘው
  rationale: የግሪኩ የአኦሪስት አንቀጽ ከሚከተሉት ግሶች ጋር የድርጊት ቅደም ተከተልን ያሳያል። «ይዘው» ተጨማሪ የኃይል አጠቃቀም ስሜት ሳይጨምር ትርጉሙን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐξέβαλον
  choice: ጣሉት
  rationale: ἐκβάλλω በዚህ ዐውደ ንባብ አንድን ሰው ከቦታው ወደ ውጭ ማስወጣትን ያመለክታል። «ጣሉት» የድርጊቱን ጠንካራነት በቀጥታና በተፈጥሯዊ አገላለጽ ይገልጣል።
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: ከወይኑ ቦታ ውጭ
  rationale: ሐረጉ ከወይኑ ቦታ ወደ ውጭ የተደረገውን እንቅስቃሴና የመጨረሻውን ስፍራ ያሳያል።
- source_word: ἀμπελῶνος
  choice: የወይኑ ቦታ
  rationale: ἀμπελών ወይን የሚተከልበትን ቦታ ያመለክታል፤ «የወይኑ ቦታ» ለዘመናዊ አንባቢ ግልጽና ተፈጥሯዊ ነው።
- source_word: ἀπέκτειναν
  choice: ገደሉትም
  rationale: ἀποκτείνω በቀጥታ «መግደል» ማለት ነው። «ገደሉትም» ድርጊቱን ያለ ተጨማሪ የሕግ ወይም የሥነ ምግባር ትርጓሜ ያቀርባል።
theological_decisions:
- issue: ከወይኑ ቦታ ማስወጣትና መግደል ያላቸው ቅደም ተከተል
  choice: መጀመሪያ ከወይኑ ቦታ ውጭ እንደጣሉት፣ ከዚያም እንደገደሉት ተተርጉሟል።
  alternative: ከማርቆስና ከሉቃስ ትይዩ ዘገባዎች ጋር ለማስማማት መጀመሪያ እንደገደሉትና ከዚያ ወደ ውጭ እንደጣሉት ማመልከት።
  rationale: የማቴዎስ የግሪክ ጽሑፍ ἐξέβαλον ... καὶ ἀπέκτειναν በማለት ማስወጣቱን ከመግደሉ በፊት ያስቀምጣል። ትርጉሙ የትይዩ ዘገባዎችን ለማስማማት ሳይሞክር የማቴዎስን ቅደም ተከተል ጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። አጭር የትረካ ቅደም ተከተሉና የግሪኩ ሦስት ተከታታይ ድርጊቶች ተጠብቀዋል።
