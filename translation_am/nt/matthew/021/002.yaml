  yaml_path: translation/nt/matthew/021/002.yaml
  text: saying to them[a], “Go into the village opposite you, and immediately you will find a donkey tied, and a colt with her[c][b]. Untie them and bring them to me.”
translation:
  language: am
  text: እንዲህ አላቸው፦ “በተቃራኒያችሁ ወዳለው መንደር[a] ሂዱ፤ ወዲያውም የታሰረች አህያና ከእሷ ጋር ያለ የአህያ ግልገል[b] ታገኛላችሁ። ፈትታችሁ[c] ወደ እኔ አምጧቸው።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከፊት ለፊታችሁ ወዳለው መንደር።”
    reason: lexical_alternative
  - marker: b
    text: የግሪኩ ቃል ወጣት እንስሳን ያመለክታል፤ በዚህ አውድ የአህያ ግልገል ነው።
    reason: lexical_alternative
  - marker: c
    text: የግሪኩ አገላለጽ “ፈትታችሁ” የሚል ቦዝ አንቀጽ ተከትሎ “አምጡ” የሚል ትእዛዝ አለው፤ መፍታቱ ከማምጣቱ በፊት እንደሚፈጸም ያሳያል።
    reason: lexical_alternative
