  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἰδόντες οἱ μαθηταὶ ἐθαύμασαν λέγοντες· Πῶς παραχρῆμα ἐξηράνθη ἡ συκῆ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/020.yaml
  text: And when the disciples saw it[a], they marveled, saying, “How did the fig tree wither immediately?”
translation:
  language: am
  text: ደቀ መዛሙርቱም ይህን አይተው ተደነቁና፣ “የበለሱ ዛፍ እንዴት ወዲያውኑ ደረቀ?” አሉ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: ይህን አይተው
  rationale: የግሪኩን የቀደመ ድርጊት በተፈጥሯዊ አማርኛ ያሳያል፤ «ይህን» ከቀደመው አውድ የሚታወቀውን የዛፉን መድረቅ ያመለክታል።
- source_word: ἐθαύμασαν
  choice: ተደነቁ
  rationale: θαυμάζω የሚያመለክተውን መገረምና መደነቅ በዘመናዊና ክቡር አማርኛ ይገልጣል።
- source_word: λέγοντες
  choice: አሉ
  rationale: የግሪኩ ተያያዥ የንግግር ተሳቢ በአማርኛ ከጥቅሱ በኋላ «አሉ» ተብሎ በተፈጥሮ ይተረጎማል።
- source_word: Πῶς
  choice: እንዴት
  rationale: ስለ ሁኔታው ወይም ስለ አፈጻጸሙ የሚጠይቀውን ጥያቄ በቀጥታ ይጠብቃል።
- source_word: παραχρῆμα
  choice: ወዲያውኑ
  rationale: «ወዲያውኑ/በዚያው ጊዜ» የሚለውን ጠንካራ የጊዜ ትርጉም በቀጥታና በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐξηράνθη
  choice: ደረቀ
  rationale: ለዛፍ መጠውለግን ወይም መድረቅን የሚገልጽ ቀጥተኛና የተለመደ አማርኛ ነው፤ የግሪኩ ተገብሮአዊ ቅርጽ በአማርኛ ተፈጥሯዊ አገላለጽ ቀርቧል።
- source_word: ἡ συκῆ
  choice: የበለሱ ዛፍ
  rationale: συκῆን በግልጽ ሁኔታ የበለስ ዛፍ ብሎ ይለያል፤ የተወሰነው ዛፍ መሆኑን «የበለሱ» ያሳያል።
theological_decisions: []
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር የአማርኛ አገላለጽ ተጠቅሟል። የግሪኩ የተሳቢ አወቃቀር በተፈጥሯዊ አማርኛ ተዋህዶ ቀርቧል፤ በምንጩ ላይ የጽሑፍ ልዩነት ወይም ሥነ መለኮታዊ አሻሚነት ስለሌለ የግርጌ ማስታወሻ አልተጨመረም።
