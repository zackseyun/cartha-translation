source:
  edition: SBLGNT
  text: ἦλθεν γὰρ ⸂Ἰωάννης πρὸς ὑμᾶς⸃ ἐν ὁδῷ δικαιοσύνης, καὶ οὐκ ἐπιστεύσατε αὐτῷ· οἱ δὲ τελῶναι καὶ αἱ πόρναι ἐπίστευσαν αὐτῷ· ὑμεῖς δὲ ἰδόντες ⸀οὐδὲ μετεμελήθητε ὕστερον τοῦ πιστεῦσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/032.yaml
  text: For John came to you in the way of righteousness[a], and you did not believe him; but the tax collectors and the prostitutes believed him. But even after seeing this[c][b], you did not afterward change your minds so as to believe him.
translation:
  language: am
  text: ዮሐንስ በጽድቅ መንገድ[a] ወደ እናንተ መጣና፤ እናንተ ግን አላመናችሁትም። ቀረጥ ሰብሳቢዎችና ዝሙት አዳሪዎች ግን አመኑት። እናንተ ግን ይህን ባያችሁም እንኳ፣ ከዚያ በኋላ እርሱን ለማመን[b] ሐሳባችሁን አልለወጣችሁም[c]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በጽድቅ አካሄድ” ወይም “በጽድቅ ጎዳና።” የግሪኩ ሐረግ የዮሐንስን አኗኗርና አገልግሎት፣ ወይም እርሱ ያወጀውን የጽድቅ መንገድ ሊገልጽ ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “እርሱን ለመታመን።” የግሪኩ ግስ አንድን ሰው ማመን ወይም መታመን የሚል ትርጉም ሊኖረው ይችላል።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “እርሱን ለማመን በኋላ ንስሐ አልገባችሁም።” እዚህ ያለው ግስ የተለመደው μετανοέω ሳይሆን μεταμέλομαι ነው፤ በተለይ የሐሳብ ለውጥን ወይም ጸጸትን ይጠቁማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν γὰρ
  choice: መጣ
  rationale: የግሪኩ አኦሪስት በተፈጥሯዊ አማርኛ ‘መጣ’ ይሆናል፤ γὰρ ከቀደመው ንግግር ጋር ያለው የምክንያት ግንኙነት በአማርኛው የአረፍተ ነገር ቅደም ተከተልና በአውዱ ተገልጧል።
- source_word: ἐν ὁδῷ δικαιοσύνης
  choice: በጽድቅ መንገድ
  rationale: የὁδόςን የመንገድ ምሳሌ እና የδικαιοσύνηን ጽድቅ ትርጉም ይጠብቃል፤ ሐረጉ የዮሐንስን አኗኗር/አገልግሎት ወይም ያወጀውን የጽድቅ መንገድ ሊያመለክት ይችላል።
- source_word: οὐκ ἐπιστεύσατε αὐτῷ / ἐπίστευσαν αὐτῷ
  choice: አላመናችሁትም / አመኑት
  rationale: πιστεύω ከዳቲቭ αὐτῷ ጋር የሰውየውን ቃል ማመን ወይም እርሱን መታመን ያመለክታል፤ ተመሳሳይ አተረጓጎም የንጽጽሩን ኃይል ይጠብቃል።
- source_word: τελῶναι
  choice: ቀረጥ ሰብሳቢዎች
  rationale: ለጥንታዊው የግብር/ቀረጥ ሰብሳቢ ሙያ ግልጽና በዘመናዊ አማርኛ የሚገባ አቻ ነው።
- source_word: πόρναι
  choice: ዝሙት አዳሪዎች
  rationale: የግሪኩን ቃል ቀጥተኛ ማኅበራዊና ሥነ ምግባራዊ ኃይል በተለመደ አማርኛ ያስተላልፋል።
- source_word: ἰδόντες
  choice: ይህን ካያችሁ በኋላ እንኳ
  rationale: የአኦሪስት ተሳቢውን ጊዜያዊና ተቃራኒ ኃይል ያሳያል፤ ‘ይህን’ የሚለው ቀረጥ ሰብሳቢዎችና ዝሙት አዳሪዎች ማመናቸውን ያመለክታል።
- source_word: οὐδὲ μετεμελήθητε ὕστερον
  choice: በኋላ ሐሳባችሁን አልለወጣችሁም
  rationale: μεταμέλομαι ከተለመደው μετανοέω ይልቅ የሐሳብ ለውጥን ወይም ጸጸትን ይጠቁማል፤ ይህ አተረጓጎም ልዩነቱን ሳያጠፋ የሞራል መመለስን ያሳያል።
theological_decisions:
- issue: የδικαιοσύνη አተረጓጎም
  choice: ጽድቅ
  alternative: ፍትሕ
  rationale: በዚህ የማቴዎስ አውድ ‘የጽድቅ መንገድ’ የእግዚአብሔርን ትክክለኛ ፈቃድ የሚከተል አኗኗርንና መልእክትን ይጠቁማል፤ ‘ፍትሕ’ ብቻ ይህን ሙሉ ስፋት አያስተላልፍም።
- issue: πιστεύω ከαὐτῷ ጋር
  choice: እርሱን/ቃሉን ማመን
  alternative: በእርሱ ማመን፤ እርሱን መታመን
  rationale: አውዱ ለዮሐንስ መልእክትና ሥልጣን የተሰጠውን ምላሽ ይናገራል። ‘አመኑት’ ይህን ቀጥተኛ ትርጉም ይጠብቃል፤ በኋለኛ ነገረ መለኮታዊ አገላለጽ አይተካውም።
- issue: የμετεμελήθητε አተረጓጎም
  choice: ሐሳባችሁን አልለወጣችሁም
  alternative: ንስሐ አልገባችሁም፤ አልተጸጸታችሁም
  rationale: ‘ንስሐ መግባት’ μετανοέωን ሊያስመስል ይችላል፤ ‘ሐሳብን መለወጥ’ የμεταμέλομαιን የሐሳብ ለውጥ/ጸጸት ልዩ ጥላ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ንጽጽር ‘እናንተ ግን … እነርሱ ግን’ በሚል ተፈጥሯዊ አወቃቀር ተጠብቋል፤ የመንገድ ምሳሌና በ‘ማመን/መታመን’ እና ‘ሐሳብ መለወጥ/ንስሐ’ መካከል ያሉ ትርጉማዊ ውጥረቶች በማስታወሻዎች ተጠብቀዋል።
