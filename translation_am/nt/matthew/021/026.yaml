  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπωμεν· Ἐξ ἀνθρώπων, φοβούμεθα τὸν ὄχλον, πάντες γὰρ ⸂ὡς προφήτην ἔχουσιν τὸν Ἰωάννην⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/026.yaml
  text: But if we say[a], ‘From men,’ we fear the crowd, for they all regard John as a prophet.
translation:
  language: am
  text: ነገር ግን፣ ‘ከሰዎች ነው’[a] ብንል፣ ሕዝቡን እንፈራለን፤ ሁሉም ዮሐንስን እንደ ነቢይ ይቆጥሩታልና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ምንጩ ሰዋዊ ነው።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ εἴπωμεν
  choice: ነገር ግን፣ … ብንል
  rationale: ብንል የሚለው ቅርጽ ἐὰν ከአዎሪስት ሳብጃንክቲቭ ጋር የሚሰጠውን ሊሆን የሚችል ሁኔታ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: Ἐξ ἀνθρώπων
  choice: ከሰዎች ነው
  rationale: በአውዱ ከሰማይ ከሚለው ጋር የሰውን ምንጭ የሚያነጻጽር ሲሆን፣ ሰዎች የሚለው ወንዶችን ብቻ ሳይሆን የሰው ወገንን በአጠቃላይ ያመለክታል።
- source_word: φοβούμεθα τὸν ὄχλον
  choice: ሕዝቡን እንፈራለን
  rationale: የግሪኩን ቀጥተኛና ወቅታዊ የፍርሃት ስሜት ይጠብቃል፤ ὄχλος በዚህ አውድ የተሰበሰበውን ሕዝብ ያመለክታል።
- source_word: πάντες
  choice: ሁሉም
  rationale: የሕዝቡን አጠቃላይ አመለካከት በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ὡς προφήτην ἔχουσιν τὸν Ἰωάννην
  choice: ዮሐንስን እንደ ነቢይ ይቆጥሩታል
  rationale: ἔχω ከὡς ጋር ያለውን ‘እንደዚህ መቁጠር/መመልከት’ የሚል ፈሊጣዊ ትርጉም በግልጽ አማርኛ ያቀርባል።
- source_word: προφήτην
  choice: ነቢይ
  rationale: ዮሐንስ ከእግዚአብሔር የተናገረ ነቢይ እንደሆነ ሕዝቡ ይቆጥረው እንደነበር የሚገልጸውን ትርጉም ይጠብቃል።
- source_word: Ἰωάννην
  choice: ዮሐንስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደው የስሙ ቅርጽ ነው።
theological_decisions:
- issue: በ‘ከሰማይ’ እና በሰው ምንጭ መካከል ያለው ንጽጽር
  choice: ከሰዎች ነው
  alternative: ምንጩ ሰዋዊ ነው
  rationale: አጭሩን የግሪክ አገላለጽና በቀደመው ቁጥር ካለው ‘ከሰማይ’ ጋር የሚደረገውን ቀጥተኛ ንጽጽር ይጠብቃል።
- issue: ሕዝቡ ስለ ዮሐንስ የነበረው አመለካከት
  choice: ሁሉም ዮሐንስን እንደ ነቢይ ይቆጥሩታል
  alternative: ሁሉም ዮሐንስን ነቢይ እንደሆነ ያምናሉ
  rationale: ጽሑፉ የሚዘግበውን የሕዝቡን ግምገማ ብቻ ያቀርባል፤ ከዚያ በላይ የሆነ ሥነ መለኮታዊ መደምደሚያ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። ‘ሕዝቡን እንፈራለን’ እና ‘ይቆጥሩታል’ የሚሉት አገላለጾች የመነሻውን ቀጥተኛነት ከተፈጥሯዊ አማርኛ ጋር ያመጣጥናሉ።
