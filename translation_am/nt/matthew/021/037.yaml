theological_decisions:
- issue: በምሳሌው ያለውን ልጅ ክርስቶሳዊ ፍቺ ሳይጨምሩ መተርጎም
  choice: ልጁን / ልጄን
  alternative: የተወደደውን ልጁን / ወልድን
  rationale: ጥቅሱ የኢየሱስን ማንነት በምሳሌያዊ ሁኔታ ቢያመለክትም፣ የግሪኩ υἱός በዚህ ስፍራ ἀγαπητός (‘የተወደደ’) ወይም ግልጽ ማዕረግ አልያዘም። ስለዚህ ቀላሉ የዝምድና ቃል የምሳሌውን ቅርጽ ይጠብቃል፣ ክርስቶሳዊ አመልካቹም ከአውዱ እንዲታይ ይተዋል።
- issue: λέγων ንግግርን ወይስ ውስጣዊ ሐሳብን እንደሚያሳይ
  choice: ‘…’ ብሎ
  alternative: በልቡ ‘…’ ብሎ አሰበ
  rationale: ግሪኩ λέγων በቀጥታ ‘እያለ/ብሎ’ ይላል፤ ትርጉሙ ይህን ይጠብቃል፣ ‘በልቡ አሰበ’ የሚል በጽሑፉ ያልተገለጸ ውስጣዊ ሁኔታ አይጨምርም።
