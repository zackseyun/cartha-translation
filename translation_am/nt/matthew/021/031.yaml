  text: τίς ἐκ τῶν δύο ἐποίησεν τὸ θέλημα τοῦ πατρός; ⸀λέγουσιν· Ὁ ⸀πρῶτος. λέγει αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν λέγω ὑμῖν ὅτι οἱ τελῶναι καὶ αἱ πόρναι προάγουσιν ὑμᾶς εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/031.yaml
  text: Which of the two did the will of the father? They said[a], “The first.” Jesus said to them, “Truly I say to you, the tax collectors and the prostitutes are going ahead of you into the kingdom of God.”
translation:
  language: am
  text: “ከሁለቱ መካከል የአባቱን ፈቃድ ያደረገው ማን ነው?” እነርሱም፣ “የመጀመሪያው ነው” አሉ። ኢየሱስም እንዲህ አላቸው፤ “እውነት እላችኋለሁ፤ ቀረጥ ሰብሳቢዎችና የዝሙት አዳሪ ሴቶች ከእናንተ ቀድመው ወደ እግዚአብሔር መንግሥት እየሄዱ ነው።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከእናንተ በፊት ወደ እግዚአብሔር መንግሥት እየገቡ ነው።” የግሪኩ አገላለጽ “ከእናንተ ቀድመው እየሄዱ ነው” የሚል ሲሆን፣ የቀደምትነትን አጽንዖት ያሳያል እንጂ ሌሎቹ በመጨረሻ እንደማይገቡ የግድ አይናገርም።
    reason: alternative_reading
lexical_decisions:
- source_word: τίς ἐκ τῶν δύο
  choice: ከሁለቱ ... የትኛው ነው?
  rationale: የἐκ ክፍላዊ ትርጉምን በተፈጥሯዊ የአማርኛ ጥያቄ አወቃቀር ይጠብቃል።
- source_word: ἐποίησεν τὸ θέλημα τοῦ πατρός
  choice: የአባቱን ፈቃድ ያደረገው
  rationale: ποιέωን ‘አደረገ’ በማለት በቅርብ ይተረጉማል፤ አባቱም በቀጥታ በምሳሌው ያለውን አባት ያመለክታል።
- source_word: Ὁ πρῶτος
  choice: የመጀመሪያው ነው
  rationale: አጭሩን የግሪክ መልስ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: እውነት እላችኋለሁ
  rationale: የንግግሩን የተከበረና አጽንዖታዊ መግቢያ ለዘመናዊ አንባቢ ግልጽ በሆነ ቋንቋ ያቀርባል።
- source_word: τελῶναι
  choice: ቀረጥ ሰብሳቢዎች
  rationale: በወንጌላት ዘመን የነበሩትን የገቢ ሰብሳቢዎች በግልጽና በተለመደ ቃል ይገልጻል።
- source_word: πόρναι
  choice: ዝሙት አዳሪዎች
  rationale: ከአጠቃላይ የጾታ ብልሹነት ቃል ይልቅ የግሪኩን የተወሰነ ማጣቀሻ ይጠብቃል።
- source_word: προάγουσιν ὑμᾶς
  choice: ከእናንተ ቀድመው ... እየሄዱ ነው
  rationale: የመቅደምን ምስልና የአሁን ጊዜውን ቀጣይ ኃይል ይጠብቃል፤ ሌሎቹ ፈጽሞ እንደተከለከሉ አድርጎ አይተረጉምም።
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: ወደ እግዚአብሔር መንግሥት
  rationale: የεἰςን አቅጣጫዊ ኃይልና ሙሉውን ሥነ መለኮታዊ ሐረግ ይጠብቃል።
theological_decisions:
- issue: προάγουσιν ὑμᾶς ከመንግሥቱ መግባት ጋር ያለው ግንኙነት
  choice: ከእናንተ ቀድመው ወደ ... እየሄዱ ነው
  alternative: ከእናንተ በፊት ወደ ... እየገቡ ነው
  rationale: προάγω መቅደምን ወይም ከፊት መሄድን ይገልጻል። ዋናው ትርጉም የመቅደምን ምስል ይጠብቃል፤ ለተቃዋሚዎቹ የመጨረሻ መገለልን ግን ከጽሑፉ በላይ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለሰፊ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የምሳሌው ‘አባት’ ወደ እግዚአብሔር በቀጥታ እንዳይቀየር ተጠብቋል፤ በπροάγουσιν ያለው ሥነ መለኮታዊ ውጥረትም አልተወገደም።
