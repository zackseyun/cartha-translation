review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the two plural movement verbs, the unstated plural subject, Jesus’ subsequent action, and the number and identity of those sent. Its rendering of the final εἰς phrase as a location associated with Bethphage is a defensible syntactic reading, but the Amharic relative construction is not idiomatic and can misleadingly sound as though Bethphage is simply on the mountain itself.
  naturalness: “በወይራ ተራራ ወዳለችው ቤተ ፋጌ” is grammatically awkward. A natural modern Amharic location expression is “በወይራ ተራራ አጠገብ ወደምትገኘው ቤተ ፋጌ.” Recasting the opening as a finite temporal clause also makes the sequence clearer.
  terminology: “ኢየሩሳሌም,” “ቤተ ፋጌ,” “የወይራ ተራራ,” “ኢየሱስ,” and “ደቀ መዛሙርት” are appropriate established biblical terminology. “የወይራ ተራራ” is the more natural fixed Amharic form than bare “ወይራ ተራራ.”
  issues:
  - severity: medium
    issue: The phrase “በወይራ ተራራ ወዳለችው ቤተ ፋጌ” is unidiomatic and structurally unclear.
    rationale: The relative form does not naturally modify the place name in this construction. Adding “አጠገብ” supplies an idiomatic locative relationship while retaining the source’s syntactic ambiguity through the footnote.
  - severity: low
    issue: The main text uses “ወይራ ተራራ” rather than the natural established expression “የወይራ ተራራ.”
    rationale: The genitive form is standard modern Amharic and better reflects the conventional name, “Mount of Olives.”
  revised_text: ወደ ኢየሩሳሌም በቀረቡና በየወይራ ተራራ አጠገብ ወደምትገኘው ቤተ ፋጌ[a] በመጡ ጊዜ፣ ኢየሱስ ሁለት ደቀ መዛሙርትን ላከ።
