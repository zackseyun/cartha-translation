  yaml_path: translation/nt/matthew/021/001.yaml
  text: And when they came near to Jerusalem and came to Bethphage[a], to the Mount of Olives, then Jesus sent two disciples
translation:
  language: am
  text: ወደ ኢየሩሳሌም በቀረቡና በየወይራ ተራራ አጠገብ ወደምትገኘው ቤተ ፋጌ[a] በመጡ ጊዜ፣ ኢየሱስ ሁለት ደቀ መዛሙርትን ላከ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፦ “ወደ ቤተ ፋጌ፣ ወደ የወይራ ተራራ።” የግሪኩ አገባብ ቤተ ፋጌን ከየወይራ ተራራ ጋር ያያይዛል፤ የትክክለኛው የቦታ ግንኙነት በሐረጉ ውስጥ ሙሉ በሙሉ ግልጽ አይደለም።
    reason: የሰዋስውና የቦታ ግንኙነት አማራጭ
lexical_decisions:
- source_word: ἤγγισαν
  choice: ቀርበው
  rationale: የቦታ መቅረብን በቀጥታና በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: Ἱεροσόλυμα
  choice: ኢየሩሳሌም
  rationale: በአማርኛ የተለመደውን የቦታውን ስም አጻጻፍ ይከተላል።
- source_word: ἦλθον
  choice: በመጡ ጊዜ
  rationale: የግሪኩን ‘መጡ’ ቀጥተኛ ትርጉም ይጠብቃል፤ ከቀደመው ‘ቀረቡ’ ጋርም ተፈጥሯዊ ቅደም ተከተል ይፈጥራል።
- source_word: Βηθφαγὴ
  choice: ቤተ ፋጌ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደው የቦታ ስም ቅርጽ ነው።
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: በወይራ ተራራ ወዳለችው
  rationale: ሐረጉን ቤተ ፋጌን ከወይራ ተራራ ጋር የሚያያይዝ የቦታ መግለጫ አድርጎ በተፈጥሯዊ አማርኛ ያቀርባል፤ ቀጥተኛው የአቅጣጫ አነባበብ በማስታወሻው ተጠብቋል።
- source_word: τότε
  choice: በ…ጊዜ
  rationale: የግሪኩን የትረካ ጊዜ ሽግግር በአማርኛ ተፈጥሯዊ በሆነ የጊዜ አንቀጽ ያሳያል።
- source_word: ἀπέστειλεν
  choice: ላከ
  rationale: በዚህ የትረካ አውድ የተለመደውንና ቀጥተኛውን ትርጉም ይሰጣል።
- source_word: δύο μαθητὰς
  choice: ሁለት ደቀ መዛሙርትን
  rationale: ቁጥሩንና በወንጌላት የተለመደውን μαθητής ትርጉም በግልጽ ሁኔታ ይጠብቃል።
theological_decisions:
- issue: ኢየሱስ ከመጠቀሱ በፊት ያሉት የብዙ ቁጥር ግሶች ባለቤት
  choice: ድርጊቶቹን ‘ቀርበው… በመጡ ጊዜ’ በማለት ያልተገለጸ የብዙ ቁጥር ባለቤት ይዘው ማቅረብ፣ ኢየሱስንም ግሪኩ በሚጠቅስበት ቦታ መጥቀስ
  alternative: ‘ኢየሱስና ደቀ መዛሙርቱ ቀረቡ’ ብሎ ባለቤቱን በግልጽ መጨመር
  rationale: ዐውዱ ቡድኑን ቢያመለክትም ግሪኩ በዚህ ቁጥር ላይ ‘ኢየሱስና ደቀ መዛሙርቱ’ ብሎ አይጨምርም፤ ስለዚህ የምንጩ አጭር የትረካ አቀራረብ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው አማርኛ ተጠቅሟል። ‘የወይራ ተራራ’ ለዘመናዊ አንባቢ ግልጽ ሲሆን፣ ‘ደቀ መዛሙርት’ ደግሞ በወንጌል ትረካ የተለመደውን ክብር ያለው ቃል ይጠብቃል።
