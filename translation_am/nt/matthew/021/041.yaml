base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/041.yaml
  text: They said to him[a], “He will miserably destroy those wretches, and he will lease the vineyard to other farmers[c][b], who will give him the fruits in their seasons.”
translation:
  language: am
  text: እነርሱም፣ “እነዚያን ክፉዎች ክፉኛ ያጠፋቸዋል[a]፤ የወይን እርሻውንም ለሌሎች ገበሬዎች ያከራየዋል[b]፤ እነርሱም ፍሬዎቹን በየወቅታቸው ይሰጡታል[c]” አሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እነዚያን ክፉ ሰዎች ክፉኛ ያጠፋቸዋል።” ግሪኩ ፍርዱን ለማጉላት ከአንድ ሥር የተገኙ ቃላትን ይጠቀማል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “የወይን እርሻውን ለሌሎች ተከራዮች ያከራየዋል።”
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “ምርቱን በተገቢው ጊዜ ይሰጡታል።”
    reason: lexical_alternative
