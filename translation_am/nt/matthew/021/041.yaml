- source_word: ἀπολέσει
  choice: ያጠፋቸዋል
  rationale: የፍርዱን ከባድነት ያሳያል፤ ነገር ግን የጥፋቱን ዘዴ ከምንጩ በላይ አይወስንም።
- source_word: τὸν ἀμπελῶνα
