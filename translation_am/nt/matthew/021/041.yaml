- source_word: ἐκδώσεται
  choice: ያከራየዋል
  rationale: በዚህ የግብርና አውድ ንብረቱን ለሌሎች ተከራዮች አሳልፎ መስጠትን በትክክል ያሳያል።
- source_word: ἄλλοις γεωργοῖς
  choice: ለሌሎች ገበሬዎች
  rationale: የእርሻ ሠራተኞችን ወይም አራሾችን በቀላልና በተለመደ ቃል ያቀርባል፤ የተከራይነቱ ሐሳብ በ‘ያከራየዋል’ ተገልጧል።
