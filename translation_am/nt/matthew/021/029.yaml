- source_word: μεταμεληθεὶς
  choice: ሐሳቡን ቀይሮ
  rationale: ከእምቢታ ወደ መታዘዝ የተደረገውን የውሳኔ ለውጥ ያሳያል፤ ቃሉ ሊያካትተው የሚችለውን የመጸጸት ስሜት በእግር ማስታወሻ ይጠብቃል።
- source_word: ἀπῆλθεν
  choice: ሄደ
  rationale: በዐውዱ የታዘዘውን ለማድረግ መሄዱን በቀላልና በቂ ሁኔታ ያቀርባል።
