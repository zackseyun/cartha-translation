    text: ወይም፣ ‘ተጸጽቶ’ ወይም ‘ከእምቢታው ተመልሶ’። የግሪክኛው ቃል የአካሄድ ለውጥን የሚያስከትል ጸጸትን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
