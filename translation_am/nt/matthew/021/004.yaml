  rationale: 'The revision retains the draft’s accurate rendering of the fulfillment formula and its natural modern register. It adds «ነቢዩም» solely to make explicit the antecedent required by the Greek participle λέγοντος (“the prophet, saying”). No footnote is required in Amharic: «በነቢዩ በኩል» already directly represents the source wording and no textual or semantic ambiguity needs a reader-facing note.'
  reviewer_model: gpt-5.6-terra
