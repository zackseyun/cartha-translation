reference: Matthew 21:4
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Τοῦτο ⸀δὲ γέγονεν ἵνα πληρωθῇ τὸ ῥηθὲν διὰ τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/004.yaml
  text: 'This happened so that what was spoken through the prophet might be fulfilled[a], saying:'
translation:
  language: am
  text: ይህም የሆነው በነቢዩ በኩል የተነገረው እንዲፈጸም ነው፤ ነቢዩም እንዲህ ይላል፦
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τοῦτο
  choice: ይህ
  rationale: በቅርብ የተ述ውን ድርጊት በአጠቃላይ የሚያመለክት ነጠላ ገላጭ ቃል ነው።
- source_word: δὲ
  choice: -ም
  rationale: ጠንካራ ተቃርኖ ሳይሆን ለስላሳ ትስስርን ያሳያል፤ በአማርኛ ከ«ይህ» ጋር የተያያዘው «-ም» ተፈጥሯዊ ነው።
- source_word: γέγονεν
  choice: የሆነው
  rationale: በትረካው ውስጥ የተፈጸመን ክስተት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἵνα
  choice: እንዲ… ነው
  rationale: የዓላማና የውጤት ግንኙነቱን ሳይወስን የግሪኩን የፍጻሜ ቀመር በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: πληρωθῇ
  choice: እንዲፈጸም
  rationale: ተገብሮአዊውን ቅርጽና የትንቢታዊ ቃል መፈጸምን ይጠብቃል።
- source_word: τὸ ῥηθὲν
  choice: የተነገረው
  rationale: በግሪኩ በስም ተግባር የቆመውን ተገብሮአዊ አሳታፊ ቃል አጭርና ተፈጥሯዊ በሆነ መንገድ ይተረጉማል።
- source_word: διὰ τοῦ προφήτου
  choice: በነቢዩ በኩል
  rationale: διά ከዘር አገባብ ጋር ያለውን የመካከለኛ አስተላላፊነት ይጠብቃል፤ ንግግሩ በነቢዩ አማካይነት መተላለፉን ያሳያል።
- source_word: λέγοντος
  choice: እንዲህ ይላል
  rationale: ቀጥሎ ያለውን ጥቅስ በዘመናዊ አማርኛ በተፈጥሯዊ ሁኔታ ያስተዋውቃል።
theological_decisions:
- issue: የፍጻሜ ቀመርና የነቢዩ አስተላላፊነት
  choice: «በነቢዩ በኩል የተነገረው እንዲፈጸም»
  alternative: «ነቢዩ የተናገረው እንዲፈጸም»
  rationale: የግሪኩ አገላለጽ ነቢዩን የንግግሩ አስተላላፊ አድርጎ ያቀርባል። የተመረጠው አገላለጽ ከጽሑፉ በላይ ሳይጨምር ይህን ልዩነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ የመጽሐፍ ቅዱስ አገላለጽ። «ይህም» የδὲን ለስላሳ ትስስር ያሳያል፤ በዋናው ጽሑፍ ምንም የግርጌ ማስታወሻ ስለማያስፈልግ ምልክት አልተጨመረም።
