  alternative: σκληρόςን ‘ጨካኝ’ በማለት የሞራል ውግዘቱን ይበልጥ ማጉላት
  rationale: ንግግሩ የአገልጋዩን ግንዛቤ ዘግቦ ያቀርባል። ‘ጥብቅ’ የቃሉን ስፋትና የምሳሌውን ሥነ መለኮታዊ ውጥረት ሳይፈታ ይጠብቃል።
