  yaml_path: translation/nt/matthew/025/024.yaml
  text: Then the one who had received the one talent also came and said[a], ‘Lord, I knew that you are a hard man[b], reaping where you did not sow and gathering where you did not scatter.’
translation:
  language: am
  text: ከዚያም አንድ መክሊት የተቀበለው ደግሞ ቀርቦ እንዲህ አለ፤ “ጌታ ሆይ፣ አንተ ጥብቅ ሰው[a] እንደሆንህ አውቅ ነበር፤ ባልዘራህበት የምታጭድ፣ ካልበተንህበትም የምትሰበስብ[b] ነህ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: እዚህ “ጥብቅ” ተብሎ የተተረጎመው የግሪክ ቃል “ከባድ፣ ጨካኝ ወይም ጥብቅ” ማለት ሊሆን ይችላል።
    reason: lexical_alternative
  - marker: b
