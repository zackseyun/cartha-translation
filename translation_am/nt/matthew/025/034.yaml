  text: ከዚያም ንጉሡ በቀኙ ላሉት፣ “በአባቴ የተባረካችሁ[a] ሆይ፣ ኑ፤ ዓለም ከተመሠረተ ጀምሮ[b] ለእናንተ የተዘጋጀውን መንግሥት ውረሱ” ይላቸዋል።
  philosophy: optimal-equivalence
