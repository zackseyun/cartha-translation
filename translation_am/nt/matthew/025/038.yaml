  naturalness: The wording is broadly clear and modern. መቼ ደግሞ is a more natural, less inferential way to carry the connective force here; omitting the repeated verb produces a smoother balanced question.
  terminology: እንግዳ appropriately renders ξένον in this hospitality context without narrowing it to nationality. ልብስ አጥተህ naturally retains γυμνός' contextual breadth, while the note preserves 'naked' as an alternative. ተቀበልንህ and አለበስንህ are suitable modern renderings.
