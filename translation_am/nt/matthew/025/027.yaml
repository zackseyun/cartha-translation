lexical_decisions:
- source_word: ἔδει
  choice: ይገባህ ነበር
  rationale: ያለፈውን ጊዜ ግዴታ ወይም ተገቢነት በተፈጥሯዊ አማርኛ ይገልጻል፤ የጌታውን የተግሣጽ ኃይልም ይጠብቃል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ክስ የሚከተለውን ምክንያታዊ ድምዳሜ በግልጽ ያመለክታል።
- source_word: βαλεῖν
  choice: ማስቀመጥ
