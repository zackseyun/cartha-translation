  text: ἀποκριθεὶς δὲ ὁ κύριος αὐτοῦ εἶπεν αὐτῷ· Πονηρὲ δοῦλε καὶ ὀκνηρέ, ᾔδεις ὅτι θερίζω ὅπου οὐκ ἔσπειρα καὶ συνάγω ὅθεν οὐ διεσκόρπισα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/026.yaml
  text: But his master answered and said to him[a], ‘Wicked and lazy servant[b], you knew that I reap where I did not sow and gather where I did not scatter?
translation:
  language: am
  text: ጌታው ግን መልሶ እንዲህ አለው፦ “አንተ ክፉና ሰነፍ አገልጋይ፣[a] እኔ ባልዘራሁበት እንደማጭድ፣ ባልበተንሁበትም እንደምሰበስብ ታውቅ ነበር?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “አንተ ክፉና ሰነፍ ባሪያ!” ተብሎም ሊተረጎም ይችላል። የግሪኩ δοῦλος (ዱሎስ) እንደ ዐውዱ “አገልጋይ” ወይም “ባሪያ” ማለት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ይህ ንግግር እንደ ጥያቄ ሳይሆን፣ “እኔ ባልዘራሁበት እንደማጭድ፣ ባልበተንሁበትም እንደምሰበስብ ታውቅ ነበር።” ተብሎ እንደ መግለጫም ሊነበብ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: ግን መልሶ እንዲህ አለው
  rationale: የትረካውን የመልስ አሰጣጥና የδέን መጠነኛ ተቃርኖ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὁ κύριος αὐτοῦ
  choice: ጌታው
  rationale: በምሳሌው ውስጥ የአገልጋዩን ጌታ ያመለክታል፤ በአማርኛም ይህ የባለሥልጣንነት ግንኙነት በግልጽ ይታያል።
- source_word: Πονηρὲ
  choice: ክፉ
  rationale: ቃሉ የሞራል ኩነኔን ይገልጣል፤ ‘ክፉ’ ይህን ኃይል በዘመናዊና ግልጽ አማርኛ ይጠብቃል።
- source_word: δοῦλε
  choice: አገልጋይ
  rationale: በዚህ ምሳሌ የተሰጠውን ኃላፊነትና ተጠያቂነት በተፈጥሯዊ አማርኛ ያሳያል፤ የባርነት ማኅበራዊ ሁኔታን የሚያጎላው ‘ባሪያ’ ግን ትክክለኛ የቃል አማራጭ ስለሆነ በማስታወሻ ተጠብቋል።
- source_word: ὀκνηρέ
  choice: ሰነፍ
  rationale: የመሥራት ፈቃድ ማጣትንና ስንፍናን በተለመደ ዘመናዊ አማርኛ ይገልጣል።
- source_word: ᾔδεις ὅτι
  choice: እንደ… ታውቅ ነበር
  rationale: የእውቀቱን ቀደምትነት ይጠብቃል፤ ከመጨረሻው የጥያቄ ምልክት ጋር የአጻጻፉን የአጸፋ ጥያቄ አነባበብ ያስችላል።
- source_word: θερίζω ὅπου οὐκ ἔσπειρα
  choice: ባልዘራሁበት እንደማጭድ
  rationale: የመዝራትና የማጨድ የግብርና ምስልን በቀጥታና በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: συνάγω ὅθεν οὐ διεσκόρπισα
  choice: ባልበተንሁበትም እንደምሰበስብ
  rationale: የግሪኩን ‘እበትናለሁ/እሰበስባለሁ’ ተጓዳኝ ቃላት ቃል በቃል ይጠብቃል፤ በግሪኩ ያልተገለጸውን ‘ዘር’ በዋናው ጽሑፍ አይጨምርም።
