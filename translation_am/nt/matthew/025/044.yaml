  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσονται καὶ αὐτοὶ λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα ἢ διψῶντα ἢ ξένον ἢ γυμνὸν ἢ ἀσθενῆ ἢ ἐν φυλακῇ καὶ οὐ διηκονήσαμέν σοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/044.yaml
  text: Then they too will answer, saying, ‘Lord, when did we see you hungry or thirsty or a stranger or naked or sick or in prison, and not serve you?’
translation:
  language: am
  text: ከዚያም እነርሱ ደግሞ፣ ‘ጌታ ሆይ፣ ተርበህ ወይም ተጠምተህ፣ እንግዳ ሆነህ ወይም ታርዘህ፣ ታመህ ወይም በእስር ቤት ሆነህ መቼ አየንህና አላገለገልንህም[a]?’ ብለው ይመልሳሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “አላገለገልንህም” የሚለው “አልረዳንህም” ወይም “እንክብካቤ አላደረግንልህም” ተብሎም ሊተረጎም ይችላል (ግሪክ፦ διακονέω)።
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: ከዚያም
  rationale: በፍርዱ ትዕይንት ውስጥ የድርጊቶቹን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያመለክታል።
- source_word: ἀποκριθήσονται καὶ αὐτοὶ λέγοντες
  choice: እነርሱ ደግሞ … ብለው ይመልሳሉ
  rationale: καὶ αὐτοὶ ያለውን ንጽጽራዊ አጽንዖት ‘እነርሱ ደግሞ’ ይጠብቃል፤ የግሪኩን ተሳቢ አገባብ ደግሞ በተፈጥሯዊ የአማርኛ ቀጥተኛ ንግግር አወቃቀር ያቀርባል።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: የቀጥተኛ ጥሪውን ቅርጽና የκύριοςን የክብር ማዕረግ ይጠብቃል።
- source_word: πεινῶντα ἢ διψῶντα
  choice: ተርበህ ወይም ተጠምተህ
  rationale: ከ‘አየንህ’ ጋር የሚጣጣም፣ የሁኔታውን ትርጉም በግልጽ የሚገልጥ ተፈጥሯዊ አማርኛ ነው።
- source_word: ξένον
  choice: እንግዳ ሆነህ
  rationale: ዘርን ወይም ዜግነትን ሳይጨምር፣ ከማኅበረሰቡ ውጭ ሆኖ መቀበል የሚያስፈልገውን ሰው ያመለክታል።
- source_word: γυμνὸν
  choice: ታርዘህ
  rationale: የልብስ እጦትን በአጭርና በተፈጥሯዊ የአማርኛ አገላለጽ ያስተላልፋል።
- source_word: ἀσθενῆ
  choice: ታመህ
  rationale: በዚህ የአካላዊና ማኅበራዊ ችግር ዝርዝር ውስጥ ‘ታመህ’ የሚለው ዋናውን የበሽታ ስሜት በተፈጥሯዊነት ይገልጣል።
- source_word: ἐν φυλακῇ
  choice: ታስረህ
  rationale: ቃል በቃል ‘በእስር ቤት’ ከማለት ይልቅ ከተደጋጋሚው ‘አየንህ’ ጋር የሚፈለገውን ሁኔታ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: διηκονήσαμέν σοι
  choice: አላገለገልንህም
  rationale: διακονέω ያለውን ሰፊ የተግባራዊ አገልግሎት ስሜት ይጠብቃል፤ ወደ ቤተ ክርስቲያናዊ ሹመት ወይም ወደ ስሜታዊ እንክብካቤ ብቻ አያጠብበውም።
theological_decisions:
- issue: κύριος ለኢየሱስ እንደ ማዕረግ መተርጎም
  choice: ጌታ ሆይ
  alternative: መምህር ሆይ
  rationale: ‘ጌታ’ የክብር አድራሻውንና ክርስቶሳዊ አስተጋባውን ይጠብቃል፤ ከጽሑፉ በላይ የሆነ ሐሳብም አያስገባም።
- issue: በመጨረሻው ሐረግ ያለው የδιακονέω ኃይል
  choice: አላገለገልንህም
  alternative: አልረዳንህም / እንክብካቤ አላደረግንልህም
  rationale: ‘ማገልገል’ ተግባራዊ ርዳታን የሚያካትተውን ሰፊ ትርጉም እና ለንጉሡ የተደረገ አገልግሎት መሆኑን የሚያሳየውን ግንኙነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ዝርዝርና የንጽጽር አጽንዖት ተጠብቀው፣ የአማርኛው ቀጥተኛ ንግግር ግን በተፈጥሯዊ ቅደም ተከተል ቀርቧል።
