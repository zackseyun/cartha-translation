source:
  edition: SBLGNT
  text: καὶ προσελθὼν ὁ τὰ πέντε τάλαντα λαβὼν προσήνεγκεν ἄλλα πέντε τάλαντα λέγων· Κύριε, πέντε τάλαντά μοι παρέδωκας· ἴδε ἄλλα πέντε τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/020.yaml
  text: And the one who had received the five talents came forward and brought another five talents[a], saying, ‘Lord, you delivered five talents to me; look[b], I have gained another five talents.’
translation:
  language: am
  text: አምስት ታላንት የተቀበለውም ቀርቦ ሌሎች አምስት ታላንት አመጣና፣ “ጌታ ሆይ፣[a] አምስት ታላንት[b] አስረክበኸኝ ነበር፤ እነሆ፣ ሌሎች አምስት ታላንት አተረፍሁ” አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ “ኪርዮስ” በዚህ ምሳሌ ውስጥ “ጌታ” ወይም “ባለቤት” ማለት ሊሆን ይችላል።
    reason: alternative_reading
  - marker: b
    text: ታላንት ትልቅ የክብደት መለኪያ ሲሆን፣ በዚህ ዐውድ ከፍተኛ ዋጋ ያለውን የገንዘብ መጠን ያመለክታል።
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: ቀርቦ
  rationale: የመቅረብን ድርጊት በተፈጥሯዊና አጭር የአማርኛ አገላለጽ ያስተላልፋል።
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: አምስቱን ታላንት የተቀበለው
  rationale: ሰውየው ቀድሞ ገንዘቡን በመቀበሉ እንደሚለይ የግሪኩን አሳታፊ አወቃቀር ይጠብቃል፤ በግሪኩ የሌለውን ‘ሰው’ አይጨምርም።
- source_word: τάλαντα
  choice: ታላንት
  rationale: በጥንቱ ዓለም ትልቅ የክብደትና የገንዘብ መጠን የነበረውን ምንጭ ቃል ይጠብቃል፤ ትርጉሙም በማስታወሻ ተብራርቷል።
- source_word: προσήνεγκεν
  choice: አመጣ
  rationale: ተጨማሪውን ገንዘብ ወደ ጌታው ማምጣቱን በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἄλλα πέντε τάλαντα
  choice: ሌላ አምስት ታላንት
  rationale: ከመጀመሪያው ጋር እኩል የሆነ ተጨማሪ መጠን መሆኑን ያሳያል።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: የባሪያውን ባለሥልጣን የሚያመለክተውን የቀጥታ አድራሻ በክብር ያስተላልፋል።
- source_word: παρέδωκας
  choice: አስረክበኸኝ ነበር
  rationale: ገንዘቡን በእጁ እንዲይዝና እንዲያስተዳድር አሳልፎ መስጠቱን ይገልጣል፤ ‘ነበር’ ድርጊቱ ከአሁኑ ሪፖርት በፊት መፈጸሙን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἴδε
  choice: እነሆ
  rationale: የአድማጩን ትኩረት ወደቀረበው ውጤት የሚጠራውን አመልካች ቃል በክብር የተሞላ ነገር ግን ግልጽ አገላለጽ ይጠብቃል።
- source_word: ἐκέρδησα
  choice: አተረፍሁ
  rationale: በንግድ ወይም በገንዘብ ሥራ ተጨማሪ ትርፍ ማግኘትን በዚህ ዐውድ በትክክል ይገልጣል።
theological_decisions:
- issue: በምሳሌው ውስጥ Κύριε የሚለውን የአድራሻ ቃል መተርጎም
  choice: ጌታ ሆይ
  alternative: ባለቤት ሆይ
  rationale: በታሪኩ ደረጃ ቃሉ የባሪያውን ጌታ ያመለክታል፤ ‘ጌታ’ ይህን ማኅበራዊ ትርጉም እያስተላለፈ በማቴዎስ ትረካ ውስጥ ሊኖረው የሚችለውን ሰፊ ድምፅ አይዘጋም። ሆኖም ጥቅሱ ብቻውን ግልጽ ክርስቶሎጂያዊ መለያ እንዲያስገድድ አልተደረገም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛን ይጠቀማል። ‘እነሆ’ የምንጩን ቀጥተኛ ትኩረት ጥሪ ስለሚጠብቅ ተመርጧል፤ ያልተለመደው ‘ታላንት’ ደግሞ በአጭር የባህል ማስታወሻ ተብራርቷል።
