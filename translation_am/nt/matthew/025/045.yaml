review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the future reply, the solemn affirmation, the representative singular ‘one,’ the superlative description, and the identification of the neglected person with Jesus. However, ‘እስካላደረጋችሁ ድረስ’ normally has a temporal ‘until/as long as’ sense in Amharic and does not adequately convey ἐφ’ ὅσον, which expresses extent or measure here.
  naturalness: The register is clear and suitably solemn. Recasting the extent clause as ‘ባላደረጋችሁት መጠን’ is natural modern standard Amharic and makes the logical force explicit without adding interpretation.
  terminology: ‘እውነት እላችኋለሁ’ suitably renders Ἀμὴν λέγω ὑμῖν, with the formal alternative retained. ‘ከእነዚህ ከሁሉ አነስተኞች’ retains the deliberately unspecified phrase and should not be narrowed to a particular group.
  issues:
  - severity: medium
    issue: The rendering of ἐφ’ ὅσον as ‘እስካላደረጋችሁ ድረስ’ is temporally ambiguous.
    rationale: The Greek construction marks the extent to which their omission toward the least was an omission toward Jesus. In Amharic, the supplied expression can be read as ‘until you did not do,’ rather than ‘insofar as/to the extent that you did not do.’
