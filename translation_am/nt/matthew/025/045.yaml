base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/045.yaml
  text: Then he will answer them[a], saying, ‘Truly I say to you, insofar as you did not do it for one of the least of these[b], neither did you do it for me.’
translation:
  language: am
  text: ከዚያም እንዲህ ብሎ ይመልስላቸዋል፤ “እውነት እላችኋለሁ[a]፣ ለአንዱ ከእነዚህ ከሁሉ አነስተኞች[b] ይህን ባላደረጋችሁት መጠን፣ ለእኔም አላደረጋችሁትም።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም ይበልጥ ቅርጻዊ በሆነ አባባል፣ “አሜን፣ እላችኋለሁ።”
    reason: lexical_alternative
  - marker: b
    text: “ከእነዚህ ከሁሉ አነስተኞች” የሚለው በተለይ የኢየሱስን ደቀ መዛሙርት ሊያመለክት ይችላል፤ ወይም በሰፊው ዝቅተኞችንና ችግረኞችን ሊያመለክት ይችላል። ትርጉሙ ሐረጉን በጽሑፉ እንዳለ በመተው ከሁለቱ አንዱን አይወስንም።
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: ከዚያም
  rationale: በፍርድ ትዕይንቱ ውስጥ የነገሮችን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያመለክታል።
- source_word: ἀποκριθήσεται αὐτοῖς λέγων
  choice: እንዲህ ብሎ ይመልስላቸዋል
  rationale: የወደፊት ጊዜውንና ለእነርሱ የሚሰጠውን መልስ ይጠብቃል፤ λέγων በተፈጥሯዊው ‘እንዲህ ብሎ’ ተዋህዷል።
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: እውነት እላችኋለሁ
  rationale: የኢየሱስን አጽንዖታዊና የተከበረ የንግግር ቀመር በዘመናዊ ግልጽ አማርኛ ያቀርባል፤ መደበኛው ‘አሜን’ በማስታወሻ ተጠብቋል።
- source_word: ἐφ’ ὅσον οὐκ ἐποιήσατε
  choice: እስካላደረጋችሁ ድረስ
  rationale: የመጠንና የተዛማጅነት አወቃቀሩን ይጠብቃል፤ ‘ስላላደረጋችሁ’ ብሎ ወደ ምክንያት ብቻ አያጠብበውም።
- source_word: ἑνὶ τούτων τῶν ἐλαχίστων
  choice: ከእነዚህ ከሁሉ አነስተኞች ለአንዱ
  rationale: ἑνί ያለውን ነጠላ ‘ለአንዱ’ እና ἐλαχίστων ያለውን የላቀ ደረጃ ‘ከሁሉ አነስተኞች’ ይጠብቃል፤ ማንነታቸውን አይወስንም።
- source_word: οὐδὲ ἐμοὶ ἐποιήσατε
  choice: ለእኔም አላደረጋችሁትም
  rationale: አሉታዊውን ተዛማጅ መደምደሚያና ከቀደመው ሐረግ ጋር ያለውን ትይዩነት በተፈጥሯዊ አማርኛ ያቆያል።
theological_decisions:
- issue: ‘ከእነዚህ ከሁሉ አነስተኞች’ የሚለው የሚያመለክታቸው ሰዎች
  choice: ሐረጉ እንዳለ ተጠብቆ፣ ለእነርሱ ያልተደረገው ለኢየሱስ እንዳልተደረገ የሚገልጸው ቀጥተኛ ትስስር ቀርቧል።
  alternative: ሐረጉን በተለይ የኢየሱስ ደቀ መዛሙርትን/መልእክተኞችን ወይም በሰፊው ዝቅተኞችንና ችግረኞችን እንደሚያመለክት መተርጎም።
  rationale: ቁጥሩ ራሱ ቡድኑን በበቂ ሁኔታ ስለማይገልጽ፣ ትርጉሙ ክርክሩን አይወስንም፤ አማራጮቹን በማስታወሻ ያሳያል።
- issue: የኢየሱስ አጽንዖታዊ ቀመር Ἀμὴν
  choice: በዋናው ጽሑፍ ‘እውነት’ ተብሎ የትርጉም ፍቺው ቀርቧል።
  alternative: ‘አሜን እላችኋለሁ’ ብሎ ቃሉን በቅርጹ ማቆየት።
  rationale: ‘እውነት’ ለዘመናዊ አንባቢ ግልጽ ሆኖ የቀመሩን ክብደት ይጠብቃል፤ ይበልጥ ቅርጻዊው አማራጭ በማስታወሻ ቀርቧል።
