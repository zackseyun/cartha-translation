  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የፍርድ አውዱን ክብደትና የግሪኩን ትይዩ አወቃቀር ለማቆየት ተሞክሯል።
