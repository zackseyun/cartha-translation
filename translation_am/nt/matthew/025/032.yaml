  text: καὶ ⸀συναχθήσονται ἔμπροσθεν αὐτοῦ πάντα τὰ ἔθνη, καὶ ἀφορίσει αὐτοὺς ἀπ’ ἀλλήλων, ὥσπερ ὁ ποιμὴν ἀφορίζει τὰ πρόβατα ἀπὸ τῶν ἐρίφων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/032.yaml
  text: And all the nations will be gathered before him[a], and he will separate them from one another, just as the shepherd separates the sheep from the goats[b],
translation:
  language: am
  text: በፊቱም ሕዝቦች ሁሉ[a] ይሰበሰባሉ፤ እርሱም እረኛ በጎችን ከፍየሎች[b] እንደሚለይ እርስ በርሳቸው ይለያቸዋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ብሔራት ሁሉ”፤ በግሪክ “πάντα τὰ ἔθνη” የሚለው ሐረግ “ሕዝቦች ሁሉ” ወይም “ብሔራት ሁሉ” ሊሆን ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “ፍየሎች” ተብሎ የተተረጎመው የግሪክ ቃል በተለይ “ወጣት ፍየሎች” ወይም “የፍየል ግልገሎች” ማለት ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: συναχθήσονται
  choice: ይሰበሰባሉ
  rationale: የግሪኩን የወደፊት ጊዜ ተገብሮ አወቃቀር ይጠብቃል፤ ሰብሳቢውንም በግልጽ አይጨምርም።
- source_word: ἔμπροσθεν αὐτοῦ
  choice: በፊቱ
  rationale: በፊቱ መሰብሰብን፣ ማለትም በእርሱ ፊት መገኘትን፣ በተፈጥሯዊና ክብር ባለው አማርኛ ያሳያል።
- source_word: πάντα τὰ ἔθνη
  choice: ሕዝቦች ሁሉ
  rationale: ἔθνη ያለውን የ‘አሕዛብ/ብሔራት/ሕዝቦች’ ስፋት የሚያስተላልፍ ሲሆን፣ ከአይሁድ ያልሆኑትን ብቻ በሚያመለክተው ‘አሕዛብ’ አያጠብም።
- source_word: ἀφορίσει
  choice: ይለያቸዋል
  rationale: አንድን ቡድን ከሌላው የመለየትን ዋና ትርጉም ቀጥታ ያስተላልፋል።
- source_word: αὐτοὺς ἀπ’ ἀλλήλων
  choice: እነርሱን አንዱን ከሌላው
  rationale: በተሰበሰቡት መካከል የሚደረገውን የእርስ በርስ መለያየት ይጠብቃል።
- source_word: ὥσπερ ὁ ποιμὴν
  choice: እረኛም … እንደሚለይ
  rationale: ንጽጽሩን በተፈጥሯዊ የአማርኛ ‘እንደ’ አወቃቀር ያቀርባል።
- source_word: τὰ πρόβατα
  choice: በጎችን
  rationale: የግሪኩን ግልጽ የእንስሳ ምስል ከ‘መንጋ’ ይልቅ በቀጥታ ይጠብቃል።
- source_word: τῶν ἐρίφων
  choice: ከፍየሎች
  rationale: በአማርኛ ተፈጥሯዊ የሆነውን የበጎችና የፍየሎች ንጽጽር ይጠብቃል፤ ቃሉ በተለይ ወጣት ፍየሎችን ሊያመለክት መቻሉ በማስታወሻ ተገልጿል።
