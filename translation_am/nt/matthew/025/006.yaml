review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the midnight setting, the announcement, the bridegroom, and the plural imperative. However, ልትቀበሉት (“to receive/welcome him”) narrows εἰς ἀπάντησιν αὐτοῦ, which directly denotes going out to meet him. The revised wording preserves the source’s broader meeting idiom.
  naturalness: በእኩለ ሌሊት ግን is more idiomatic and proportionate for the mild connective δέ than the more contrastive ነገር ግን. የሚል ጩኸት ተሰማ is natural modern standard Amharic for the sudden cry.
  terminology: ሙሽራው appropriately identifies the bridegroom in the parable without importing a theological identification. እነሆ preserves the attention-getting force of ἰδού in a dignified standard register.
  issues:
  - severity: medium
    issue: The phrase ልትቀበሉት renders “to welcome/receive him” rather than “to meet him.”
    rationale: While welcoming may fit the wedding setting, εἰς ἀπάντησιν αὐτοῦ states the action of going out to meet him and does not explicitly specify the manner of reception.
  - severity: low
    issue: ነገር ግን can sound more contrastive than δέ requires.
    rationale: δέ here is a mild narrative transition. Placing ግን after the temporal phrase better reflects that restrained force in natural Amharic.
  revised_text: በእኩለ ሌሊት ግን፣ “እነሆ፣ ሙሽራው! ልትገናኙት ውጡ!” የሚል ጩኸት ተሰማ።
  revised_footnotes: []
  revision_rationale: The revision replaces the interpretively narrower “welcome him” with “meet him,” retaining the Greek construction’s purpose sense and avoiding addition of ceremonial nuance. It also moderates the rendering of δέ while preserving the draft’s clear, dignified register and the parable-level designation “the bridegroom.”
