reference: Matthew 25:6
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: μέσης δὲ νυκτὸς κραυγὴ γέγονεν· Ἰδοὺ ὁ ⸀νυμφίος, ἐξέρχεσθε εἰς ἀπάντησιν ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/006.yaml
  text: 'But at midnight a cry rang out: ‘Look[b][a], the bridegroom! Come out to meet him.’'
translation:
  language: am
  text: በእኩለ ሌሊት ግን፣ “እነሆ፣ ሙሽራው! ልትገናኙት ውጡ!” የሚል ጩኸት ተሰማ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μέσης δὲ νυκτός
  choice: ነገር ግን እኩለ ሌሊት ላይ
  rationale: የግሪኩ የጊዜ አገላለጽ ‘እኩለ ሌሊት ላይ’ ማለት ሲሆን፣ δέ የትረካውን መጠነኛ ንፅፅር በ‘ነገር ግን’ ያሳያል።
- source_word: κραυγὴ γέγονεν
  choice: የሚል ጩኸት ተሰማ
  rationale: በአማርኛ ተፈጥሯዊ በሆነ መንገድ የድንገተኛውን ጥሪ መከሰትና መሰማት ያሳያል።
- source_word: Ἰδοὺ
  choice: እነሆ
  rationale: ትኩረትን የሚስበውን የግሪኩን ቃል በተለመደና ክብር ባለው የአማርኛ አገላለጽ ይጠብቃል።
- source_word: ὁ νυμφίος
  choice: ሙሽራው
  rationale: በሠርግ አውድ ያለውን ወንድ ሙሽራ በአማርኛ በተፈጥሯዊነት ይገልጻል።
- source_word: ἐξέρχεσθε
  choice: ውጡ
  rationale: የብዙ ሰዎች ትእዛዝ መሆኑንና ከነበሩበት ቦታ ወደ ውጭ እንዲወጡ መጠራታቸውን በቀጥታ ያሳያል።
- source_word: εἰς ἀπάντησιν αὐτοῦ
  choice: ልትቀበሉት
  rationale: ἀπάντησις አንድን የሚመጣ ሰው ለመገናኘትና ለመቀበል ወጥቶ መሄድን ያመለክታል፤ ‘ልትቀበሉት’ የሠርጉን የአቀባበል አውድ በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: የνυμφίος ምሳሌያዊ ማጣቀሻ
  choice: ሙሽራው
  alternative: ጌታው ወይም ክርስቶስ
  rationale: በሰፊው የማቴዎስ አውድ ሙሽራው ኢየሱስን ቢወክልም፣ ጥቅሱ ራሱ የምሳሌውን ባለታሪክ ያቀርባል። ስለዚህ ትርጉሙ ማንነቱን በትርጓሜ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ፤ የቀጥታ ንግግሩ ድንገተኛነትና የጥሪ ኃይል ተጠብቋል።
