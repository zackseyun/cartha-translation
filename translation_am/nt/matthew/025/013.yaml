  text: Therefore[a], stay awake, because you do not know the day or the hour.
translation:
  language: am
  text: ስለዚህ ቀኑንም ሆነ ሰዓቱን ስለማታውቁ፣ ንቁ[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ነቅታችሁ ቆዩ” ወይም “ጠብቁ።” የግሪኩ ትእዛዝ ቀጣይነት ያለውን ንቃት ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: ነቅታችሁ ጠብቁ
  rationale: የአሁን ጊዜ ብዙ ቁጥር ትእዛዝ ቀጣይነት ያለውን ንቃት ያመለክታል። ይህ አገላለጽ በምሳሌው ውስጥ ያለውን የነቅቶ መቆየት ምስል ጠብቆ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ምሳሌ የሚወጣውን መደምደሚያ በግልጽ ያሳያል።
- source_word: ὅτι
  choice: ስለማታውቁ
  rationale: ለትእዛዙ ምክንያት የሚያቀርበውን ምክንያታዊ ግንኙነት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: οὐκ οἴδατε
  choice: ማታውቁ
  rationale: ሁለተኛ መደብ ብዙ ቁጥር ያለውን የእውቀት እምቢታ ያለ ትርጓሜያዊ ጭማሪ ያስተላልፋል።
- source_word: τὴν ἡμέραν
  choice: ቀኑን
  rationale: የተወሰነውን ቀን ይጠብቃል፤ ጥቅሱ በግልጽ ያልጨመረውን ክስተት በትርጉሙ አይጨምርም።
- source_word: οὐδὲ τὴν ὥραν
  choice: ሰዓቱንም ሆነ
  rationale: ከአሉታዊው ግስ ጋር ‘ቀኑንም ሆነ ሰዓቱን’ የሚለው ተፈጥሯዊ አማርኛ ሁለቱም እንደማይታወቁ በግልጽ ያሳያል።
theological_decisions:
- issue: የንቃት ትእዛዝ ምስላዊነት
  choice: ነቅታችሁ ጠብቁ
  alternative: ንቁ፤ ነቅታችሁ ቆዩ
  rationale: በጊዜው አለመታወቅ ምክንያት ዝግጁነትን የሚጠይቀውን ሐሳብ ያስተላልፋል፤ የምሳሌውን የነቅቶ መጠበቅ ምስል ሳያጠፋ ወደ አንድ የሥነ መለኮት ሥርዓት አያጠብበውም።
- issue: ‘ቀኑንም ሆነ ሰዓቱን’ የሚለው ወሰን
  choice: አገላለጹን ያለ ገላጭ ጭማሪ ማቆየት
  alternative: የሰው ልጅ የሚመጣበትን ቀን ወይም ሰዓት፤ የተወሰነውን ጊዜ
  rationale: የሰፊው ንግግር አውድ ስለ መምጣትና ፍርድ ቢናገርም፣ ይህ ጥቅስ ‘ቀኑንም ሆነ ሰዓቱን’ ብቻ ይላል። ትርጉሙም በግሪክ ጽሑፍ ያልተገለጸውን አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ነቅታችሁ ጠብቁ’ የምሳሌውን ምስልና ቀጣይ ንቃትን በተፈጥሯዊ አገላለጽ ያጣምራል።
