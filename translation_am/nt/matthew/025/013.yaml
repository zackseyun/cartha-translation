review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys οὖν, the causal ὅτι clause, the plural negated knowledge, and “the day or the hour.” However, “ነቅታችሁ ጠብቁ” can mean “stay awake and wait/watch for [something],” adding an explicit waiting sense beyond γρηγορεῖτε. “ንቁ” more directly represents the imperative’s call to vigilance while retaining its metaphorical openness.
  naturalness: The sentence is grammatical and clear modern Amharic. Using the concise imperative “ንቁ” is more idiomatic and avoids the slightly expanded verbal phrase.
  terminology: “ቀኑንም ሆነ ሰዓቱን” appropriately retains the definite expressions without identifying the event. The footnote should present “ነቅታችሁ ቆዩ” and “ጠብቁ” as alternatives, rather than make the more expansive phrase the main rendering.
  issues:
  - severity: low
    issue: The main rendering “ነቅታችሁ ጠብቁ” is semantically broader than γρηγορεῖτε.
    rationale: Although it fits the parable’s context, “ጠብቁ” can explicitly introduce waiting for an anticipated person or event. The Greek imperative itself calls for watchfulness/vigilance without supplying that object.
  revised_text: ስለዚህ ቀኑንም ሆነ ሰዓቱን ስለማታውቁ፣ ንቁ[a]።
  revised_footnotes:
