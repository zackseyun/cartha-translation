  text: And when did we see you sick or in prison and come to you?[a]
translation:
  language: am
  text: መቼስ ታመህ ወይም በእስር ቤት ሳለህ አይተንህ ወደ አንተ መጣን?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ጎበኘንህ?” ግሪኩ ቃል በቃል “ወደ አንተ መጣን?” ይላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: πότε
  choice: መቼ
  rationale: ጊዜን የሚጠይቅ ተፈጥሯዊ የአማርኛ ጥያቄ ቃል ነው።
- source_word: δέ
  choice: -ስ
  rationale: በተከታታይ ጥያቄዎች መካከል ያለውን ቀላል አያያዥነት ያለ ጠንካራ ተቃርኖ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: εἴδομεν
  choice: አይተንህ
  rationale: ያለፈውን ድርጊት ይጠብቃል፤ የሁለተኛ መደብ ነጠላ ተሳቢውም በአማርኛ ግስ ውስጥ ተካቷል።
- source_word: ἀσθενοῦντα
  choice: ታመህ
  rationale: በዐውዱ ያለውን አካላዊ ሕመም በግልጽና ተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: ἐν φυλακῇ
  choice: በእስር ቤት ሳለህ
  rationale: የታሰረበትን ቦታና ሁኔታ በግልጽ ያስተላልፋል፤ ዘመናዊ የሕግ ልዩነቶችን አያስገባም።
- source_word: ἤλθομεν πρός σε
  choice: ወደ አንተ መጣን
  rationale: የግሪኩን ቀጥተኛ የመንቀሳቀስ አገላለጽ ይጠብቃል፤ “ጎበኘንህ” የሚለውን የተለየ ትርጓሜ በዋናው ጽሑፍ አያስገባም።
theological_decisions:
- issue: ἤλθομεν πρός σε የሚለውን “ወደ አንተ መጣን” ወይስ “ጎበኘንህ” ብሎ መተርጎም
  choice: ወደ አንተ መጣን
  alternative: ጎበኘንህ
  rationale: የግሪኩ አገላለጽ በቀጥታ ወደ አንድ ሰው መምጣትን ይናገራል፤ “መጎብኘት” በዐውዱ ሊገባ ቢችልም በግሱ በግልጽ አልተጠቀሰም። ስለዚህ ዋናው ጽሑፍ የምንጩን ግልጽ አሻሚነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራው አንባቢ ቀላል የሆነ አማርኛ ተጠቅሟል። “መቼስ” በተከታታይ ጥያቄዎች ውስጥ δέ ያለውን ቀላል አያያዥነት በተፈጥሯዊ ሁኔታ ይይዛል።
