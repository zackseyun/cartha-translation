- source_word: ἐρίφια
  choice: ፍየሎቹን
  rationale: ቃሉ በተለይ ጠቦቶችን ወይም ወጣት ፍየሎችን ሊያመለክት ይችላል፤ ነገር ግን ከበጎች ጋር በተደረገው ንጽጽር ‘ፍየሎች’ የተለመደና ግልጽ ነው። የዕድሜው ልዩነት በማስታወሻ ተጠብቋል።
- source_word: ἐξ εὐωνύμων
  choice: በግራው
  rationale: ሐረጉ በግራ በኩል መቆምን ያመለክታል፤ በግሪኩ αὐτοῦ ባይደገምም በአማርኛ ‘በግራው’ ማለት ትይዩነቱንና ማጣቀሻውን በተፈጥሯዊ ሁኔታ ያሳያል።
