  rationale: ጥቅሱ ራሱ በፍርድ ትዕይንቱ ውስጥ ያለውን አቀማመጥ ይናገራል። የቀኝና የግራ ግምገማዊ ፍቺ በአውዱ ቢኖረውም፣ በዋናው ጽሑፍ ውስጥ ማስፋት ግሪኩ በግልጽ ያላለውን ትርጓሜ ይጨምራል።
