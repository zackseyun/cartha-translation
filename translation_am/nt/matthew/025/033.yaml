lexical_decisions:
- source_word: στήσει
  choice: ያቆማል
  rationale: የἵστημι አድራጊ አገባብ ነው፤ ቡድኖቹን በየቦታቸው እንደሚያቆም ያመለክታል።
- source_word: πρόβατα
  choice: በጎቹን
  rationale: πρόβατα በተለምዶ በጎችን ያመለክታል፤ የወሰን ቅጥያውም ከቀደመው አውድ የታወቀውን ቡድን ይጠቁማል።
- source_word: ἐκ δεξιῶν αὐτοῦ
