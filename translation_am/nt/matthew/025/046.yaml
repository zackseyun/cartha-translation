  text: καὶ ἀπελεύσονται οὗτοι εἰς κόλασιν αἰώνιον, οἱ δὲ δίκαιοι εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/046.yaml
  text: And these will go away into eternal punishment[a], but the righteous into eternal life.
translation:
  language: am
  text: እነዚህም ወደ ዘላለማዊ ቅጣት[a] ይለያሉ፤ ጻድቃን ግን ወደ ዘላለማዊ ሕይወት ይሄዳሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለዘመን የሚቆይ ቅጣት” … “ለዘመን የሚቆይ ሕይወት።” αἰώνιος የሚለው ቅጽል በአንዳንድ አውዶች አከራካሪ ነው፤ እዚህ ግን ይህ አንድ ቅጽል ሁለቱንም “ቅጣት” እና “ሕይወት” ስለሚገልጽ፣ ትርጉሙ በሁለቱም ሐረጎች “ዘላለማዊ” በማለት ትይዩነቱን ጠብቋል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελεύσονται
  choice: ይሄዳሉ
  rationale: የወደፊት ጊዜውንና ከዚያ ቦታ የመሄድን ሐሳብ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል። በሁለተኛው ሐረግ በግሪኩ የተዘለለውን ግስ ለአማርኛ ግልጽነት ተደግሟል።
- source_word: οὗτοι
  choice: እነዚህ
  rationale: ቀደም ብሎ የተገለጸውን ቡድን ያመለክታል፤ ከጻድቃን ጋር ያለውን ንጽጽርም አጭር አድርጎ ይጠብቃል።
- source_word: κόλασιν
  choice: ቅጣት
  rationale: በፍርድ አውድ ውስጥ የቅጣት ውጤትን የሚገልጽ ቀጥተኛና የተለመደ አማርኛ ነው፤ የማረሚያ ትርጉምን አያስገድድም።
- source_word: αἰώνιον
  choice: ዘላለማዊ
  rationale: በሁለቱም ‘ቅጣት’ እና ‘ሕይወት’ ላይ የተጠቀመውን አንድ ግሪክ ቅጽል በአንድ የአማርኛ ቃል በመተርጎም ትይዩነቱን ይጠብቃል።
- source_word: οἱ δὲ δίκαιοι
  choice: ጻድቃን ግን
  rationale: ቅጽሉን እንደ ስም ይወክላል፤ ‘ግን’ ደግሞ δὲ የሚያሳየውን ተቃርኖ በተፈጥሯዊ የአማርኛ ቃል ቅደም ተከተል ያስተላልፋል።
- source_word: ζωὴν
  choice: ሕይወት
  rationale: የζωή መደበኛና ግልጽ የአማርኛ አቻ ነው።
theological_decisions:
- issue: በκόλασιν αἰώνιον እና ζωὴν αἰώνιον ውስጥ αἰώνιονን መተርጎም
  choice: በሁለቱም ሐረጎች ‘ዘላለማዊ’ ተብሎ ተተርጉሟል።
  alternative: ‘የዘመን ሁሉ’ ወይም ‘ለዘመን የሚቆይ’
  rationale: በግሪኩ አንድ ቅጽል ቅጣትንም ሕይወትንም ስለሚገልጽ፣ ትርጉሙ በሁለቱ ሐረጎች መካከል ያለውን ትይዩነት ጠብቋል። የቃሉ የዘመን አድማስ በአንዳንድ አውዶች ክርክር ቢኖርበትም፣ እዚህ ላይ ቅጣቱንና ሕይወቱን በተለያየ መልኩ መተርጎም የምንጩን ሚዛናዊ አገላለጽ ያፈርሳል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ አማርኛ ተጠቅሟል። የግሪኩን ተቃርኖና ትይዩ አወቃቀር ለመጠበቅ ‘እነዚህም … ጻድቃን ግን’ የሚለው ቅርጽ ተመርጧል።
