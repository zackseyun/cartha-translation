  yaml_path: translation/nt/matthew/025/011.yaml
  text: Later[a], the other virgins also come, saying, ‘Lord, lord[c][b], open to us.’
translation:
  language: am
  text: ከዚያም በኋላ የቀሩት ደናግልም መጥተው፣ “ጌታ ሆይ፣ ጌታ ሆይ፣[a] ክፈትልን!”[b] አሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ጌታ ሆይ” የሚለው “ክቡር ሆይ” ወይም “አለቃ ሆይ” ተብሎም ሊተረጎም ይችላል። ግሪክ፦ Κύριε κύριε (ኪሪዬ ኪሪዬ)።
    reason: alternative_reading
  - marker: b
    text: ግሪኩ “ክፈትልን” ብቻ ይላል፤ “በሩን” የሚለው ከዐውደ ንባቡ የሚገባ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: ከዚያም በኋላ
  rationale: በትረካው ውስጥ ድርጊቱ ቆይቶ መፈጸሙን በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: δὲ
  choice: -ም
  rationale: ደካማውን የትረካ ማያያዣ ከ‘ከዚያም’ ጋር በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἔρχονται
  choice: መጥተው ... አሉ
  rationale: የግሪኩን ትረካዊ የአሁን ጊዜ በአማርኛ ትረካ ተፈጥሯዊ በሆነ ቅርጽ ያቀርባል።
- source_word: καὶ
  choice: -ም
  rationale: ሌሎቹ ደናግልም ወደ ትዕይንቱ መጨመራቸውን ያሳያል።
- source_word: αἱ λοιπαὶ παρθένοι
  choice: ሌሎቹ ደናግል
  rationale: λοιπαί የሚለውን ‘ሌሎቹ/የቀሩት’ በሚለው ስፋት ይጠብቃል፤ παρθένοι ደግሞ በቀጥታ ‘ደናግል’ ተብሏል።
- source_word: λέγουσαι
  choice: '... አሉ'
  rationale: ቀጥተኛውን ንግግር በተፈጥሯዊ የአማርኛ አነጋገር ያስገባል።
- source_word: Κύριε κύριε
  choice: ጌታ ሆይ፣ ጌታ ሆይ
  rationale: κύριος ያለውን የክብር አድራሻና ሊኖረው የሚችለውን ሥነ መለኮታዊ ክብደት ይጠብቃል፤ ድግግሞሹም አጣዳፊነቱን ያሳያል።
- source_word: ἄνοιξον ἡμῖν
  choice: ክፈትልን
  rationale: የትእዛዝ ጥያቄውንና የἡμῖνን ጥቅም/መዳረሻ በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል፤ ‘በሩን’ በግሪኩ በግልጽ ስላልተጠቀሰ አልተጨመረም።
theological_decisions:
- issue: Κύριε የሚለውን በቀጥተኛ አድራሻ መተርጎም
  choice: ጌታ ሆይ
  alternative: ጌታዬ ሆይ / ክቡር ሆይ
  rationale: በምሳሌው ውስጥ ቃሉ የማኅበራዊ ክብር አድራሻም የማቴዎስን ሰፊ ሥነ መለኮታዊ ድምፅም ሊይዝ ይችላል። ‘ጌታ ሆይ’ ሁለቱንም አጋጣሚዎች ሳያጠብ ይጠብቃል።
