  yaml_path: translation/nt/matthew/025/030.yaml
  text: And throw the worthless servant into the outer darkness[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: am
  text: የማይጠቅመውንም ባሪያ[a] ወደ ውጫዊው ጨለማ ጣሉት፤ በዚያ ልቅሶና ጥርስ ማፋጨት ይሆናል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ δοῦλος (ዱሎስ) እንደ ዐውዱ «አገልጋይ» ወይም «ባሪያ» ሊተረጎም ይችላል፤ እዚህ በምሳሌው ውስጥ ለጌታው በባሪያነት የተያዘ ሁኔታ ጎልቶ ስለሚታይ «ባሪያ» ተብሏል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀχρεῖον
  choice: የማይጠቅመውን
  rationale: ቃሉ በጌታው ግምገማ ለጥቅም ያልሆነውን ወይም ፍሬ ያላስገኘውን ያመለክታል። «የማይጠቅመውን» በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን የፍርዱንም ክብደት ይጠብቃል።
- source_word: δοῦλον
  choice: ባሪያ
  rationale: በምሳሌው ውስጥ ያለው የጌታና የታሰረ አገልጋይ ማኅበራዊ ግንኙነት ጎልቶ ስለሚታይ «ባሪያ» የግሪኩን ቃል ከ«አገልጋይ» ይበልጥ በትክክል ያንጸባርቃል።
- source_word: ἐκβάλετε
  choice: ጣሉት
  rationale: የትእዛዝ ቅርጹ ኃይለኛና ድንገተኛ ማስወጣትን ያሳያል፤ «ጣሉት» ይህን በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: σκότος τὸ ἐξώτερον
  choice: የውጭው ጨለማ
  rationale: የቃል ሐረጉን የመገለል ምስል ሳይተረጉም በቀጥታ ይጠብቃል፤ «ወደ ውጭው ጨለማ» በአማርኛ ግልጽ ነው።
- source_word: ἐκεῖ
  choice: በዚያ
  rationale: ከዚህ በፊት የተጠቀሰውን የውጭ ጨለማ ቦታ በቀጥታና በተፈጥሯዊ ሁኔታ ያመለክታል።
- source_word: κλαυθμὸς
  choice: ልቅሶ
  rationale: የኀዘንና የጭንቀት ጩኸትን የሚያስተላልፍ የተለመደ እና ክብር ያለው አማርኛ ነው።
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: ጥርስ ማፋጨት
  rationale: የግሪኩን የተለመደ የጭንቀት ወይም የቁጣ ምስል ሳይገድብ የሚጠብቅ የታወቀ አማርኛ አገላለጽ ነው።
theological_decisions:
