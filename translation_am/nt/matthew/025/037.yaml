id: MAT.25.37
reference: Matthew 25:37
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσονται αὐτῷ οἱ δίκαιοι λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα καὶ ἐθρέψαμεν, ἢ διψῶντα καὶ ἐποτίσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/037.yaml
  text: Then the righteous will answer him[a], saying, ‘Lord, when did we see you hungry and feed you, or thirsty and give you drink?’
translation:
  language: am
  text: በዚያን ጊዜ ጻድቃንም እንዲህ ብለው ይመልሱለታል፦ “ጌታ ሆይ፣ ተርበህ መቼ አይተንህ መገብንህ? ወይም ተጠምተህ መቼ አይተንህ መጠጥ ሰጠንህ?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: በዚያን ጊዜ
  rationale: በንግግሩ ውስጥ የድርጊቶችን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያመለክታል።
- source_word: ἀποκριθήσονται αὐτῷ
  choice: ይመልሱለታል
  rationale: የወደፊት ጊዜውንና ለእርሱ የተሰጠ መልስ መሆኑን በአጭርና ተፈጥሯዊ አገላለጽ ይጠብቃል።
- source_word: οἱ δίκαιοι
  choice: ጻድቃን
  rationale: በትዕይንቱ ውስጥ ጻድቃን ተብለው የታወቁትን ሰዎች የሚያመለክት የተለመደ አማርኛ ቃል ነው።
- source_word: λέγοντες
  choice: ብለው
  rationale: ቀጥተኛውን ንግግር ከመመለሱ ጋር በተፈጥሯዊ አማርኛ ያገናኛል።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: የቀጥተኛ አድራሻውን ክብርና የκύριοςን ርዕስ ሳያጋንን ይጠብቃል።
- source_word: πεινῶντα καὶ ἐθρέψαμεν
  choice: ተርበህ አይተንህ መገብንህ
  rationale: የተራበበትን ሁኔታና ምግብ የመስጠቱን ተግባር ግልጽ አድርጎ ያቀርባል።
- source_word: διψῶντα καὶ ἐποτίσαμεν
  choice: ተጠምተህ አይተንህ አጠጣንህ
  rationale: የግሪኩን ትይዩ አወቃቀር በተፈጥሯዊ አማርኛ ይጠብቃል፤ “አጠጣንህ” መጠጥ ሰጥተን እንድትጠጣ አደረግን የሚለውን ትርጉም ይይዛል።
theological_decisions:
- issue: በቀጥተኛ አድራሻ ውስጥ የκύριος አተረጓጎም
  choice: ጌታ ሆይ
  alternative: መምህር ሆይ
  rationale: “ጌታ” የቃሉን የክብር ርዕስና በማቴዎስ ውስጥ ያለውን ክርስቶሎጂያዊ ድምፅ ይጠብቃል፤ ጽሑፉ ከሚለው በላይም አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ትይዩ ጥያቄዎች ተጠብቀዋል፤ በሁለተኛው ክፍል “አይተንህ” መደገሙ በአማርኛ ግልጽነትን ያሻሽላል።
