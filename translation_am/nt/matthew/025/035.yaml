  alternative: ባዕድ ነበርሁ፣ ወደ ቤታችሁም አስገባችሁኝ
  rationale: የተጋለጠን ሰው በምሕረትና በመስተንግዶ መቀበል የሚለውን ሥነ ምግባራዊ ኃይል ይጠብቃል፤ ‘ወደ ቤት’ የሚለውን በግሪኩ በግልጽ ያልተጠቀሰ ዝርዝር በዋናው ጽሑፍ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለሰፊው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የአንቀጹ ሦስት ትይዩ ክፍሎች በፈሊጣዊ የአማርኛ ሐረግ ተጠብቀዋል።
