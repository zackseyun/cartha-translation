  rationale: በዚህ የምሕረት አውድ ποτίζω የሚያመለክተውን መጠጥ መስጠት ያለ ያልተጠቀሰ የመጠጥ ዓይነት መጨመር ያስተላልፋል።
- source_word: ξένος
  choice: እንግዳ
  rationale: የማይታወቅንና መስተንግዶ የሚያስፈልገውን ሰው በአውዱ ተስማሚ ሁኔታ ይገልጣል፤ ዘመናዊ የሕግ ወይም የፖለቲካ ምድብ አያስገባም።
- source_word: συνηγάγετέ με
  choice: ተቀበላችሁኝ
  rationale: συνάγω በቀጥታ ‘ሰበሰባችሁኝ’ ቢሆንም፣ ከξένος ጋር በዚህ አውድ እንግዳን በመስተንግዶ መቀበልን ያመለክታል።
