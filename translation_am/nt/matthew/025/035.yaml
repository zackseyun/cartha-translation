  text: ተርቤ ነበርና የምበላውን ሰጣችሁኝ፤ ተጠምቼ ነበር፣ የምጠጣውንም ሰጣችሁኝ፤ እንግዳ ነበርሁ፣ ተቀበላችሁኝም።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወደ ቤታችሁ አስገባችሁኝ።” የግሪኩ ግስ ቃል በቃል “ሰበሰባችሁኝ” ወይም “አንድ ላይ አመጣችሁኝ” ማለት ሲሆን፣ በዚህ አውድ እንግዳን በመስተንግዶ መቀበልን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
