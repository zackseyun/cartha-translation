  text: Therefore take the talent from him and give it to the one who has the ten talents[a][b].
translation:
  language: am
  text: ስለዚህ ከእርሱ ያንን ታላንት[b] ውሰዱት[a]፤ አሥር ታላንት ላለውም ስጡት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከእርሱ አስወግዱት።” የግሪኩ የትእዛዝ ግስ በሁለቱም መንገድ ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “ታላንት” ትልቅ የክብደት መለኪያ ሲሆን፣ በተዘዋዋሪም ትልቅ የገንዘብ መጠንን ያመለክት ነበር።
    reason: cultural_note
lexical_decisions:
- source_word: ἄρατε
  choice: ውሰዱበት
  rationale: የብዙ ቁጥር ቀጥተኛ ትእዛዝ መሆኑንና ከሰውየው እንዲወሰድ የሚያመለክተውን የመለየት ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ፍርድ የሚከተለውን ድምዳሜ በግልጽ ያሳያል።
- source_word: ἀπ’ αὐτοῦ
  choice: ከእርሱ … በት
  rationale: ἀπό የሚያመለክተውን ከተፈረደበት ሰው የመለየት ሐሳብ በአማርኛው የግስ ቅርጽ ጭምር ያስተላልፋል።
- source_word: τὸ τάλαντον
  choice: አንዱን ታላንት
  rationale: ቀደም ሲል የተጠቀሰውን የተወሰነ አንድ ታላንት ያመለክታል፤ ታሪካዊውን የክብደትና የገንዘብ መለኪያ ስምም ይጠብቃል።
- source_word: δότε
  choice: ስጡት
  rationale: የብዙ ቁጥር ቀጥተኛ ትእዛዝን በተለመደና ግልጽ አማርኛ ያቀርባል።
- source_word: τῷ ἔχοντι
  choice: ላለው
  rationale: ስማዊ ተሳቢውን ‘ላለው ሰው’ በተፈጥሯዊና አጭር አማርኛ ያስተላልፋል።
- source_word: τὰ δέκα τάλαντα
  choice: አሥር ታላንት
  rationale: በትረካው ቀደም ብሎ የተጠቀሰውን የተወሰነ መጠን ያመለክታል፤ በአማርኛ አውድና በ‘ላለው’ የተወሰነነቱ በቂ ሁኔታ ይገለጣል።
theological_decisions:
- issue: በምሳሌው ውስጥ የτάλαντον ትርጉም
  choice: ታሪካዊውን ‘ታላንት’ የሚለውን የክብደትና በተዘዋዋሪ የገንዘብ መለኪያ ስም መጠበቅ
  alternative: ገንዘብ፤ የገንዘብ መጠን
  rationale: ጥቅሱ ስለ ተሰጡ ብዙ የገንዘብ መጠኖችና ስለ ተጠያቂነት በሚናገር ምሳሌ ውስጥ ነው። ታሪካዊውን ቃል መጠበቅ ትርጉሙን ‘ተፈጥሯዊ ችሎታ’ ብሎ አይፈታውም፤ የገንዘብ ስሜቱን የግርጌ ማስታወሻው ያብራራል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ሁለቱ የብዙ ቁጥር ትእዛዞች በ‘ውሰዱበት’ እና ‘ስጡት’ ተጠብቀዋል፤ ታሪካዊው ‘ታላንት’ በማስታወሻ ተብራርቷል።
