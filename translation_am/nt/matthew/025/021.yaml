- issue: δοῦλος የአገልጋይነትን ወይም የባርነትን ሁኔታ ሊያመለክት መቻሉ
  choice: አገልጋይ
  alternative: ባሪያ
  rationale: በዋናው ጽሑፍ “አገልጋይ” በዘመናዊ አማርኛ ተፈጥሯዊ ነው፤ “ባሪያ” ግን የግሪኩን ማኅበራዊ ሁኔታ ሊያጎላ የሚችል እውነተኛ አማራጭ ስለሆነ በማስታወሻ ተጠብቋል።
