base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/021.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will appoint you over many things[b]. Enter into the joy of your master.’
translation:
  language: am
  text: ጌታው[b]ም፣ “መልካም አደረግህ፣ በጎና ታማኝ አገልጋይ[a]፤ በጥቂት ነገሮች ታማኝ ነበርህ፤ በብዙ ነገሮች ላይ እሾምሃለሁ። ወደ ጌታህ ደስታ ግባ” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “አገልጋይ” የተተረጎመው የግሪክ ቃል δοῦλος (ዱሎስ) እንደ አገባቡ “ባሪያ” ተብሎም ሊተረጎም ይችላል።
    reason: alternative_reading
  - marker: b
    text: እዚህ “ጌታ” የተባለው κύριος (ኩሪዮስ) በምሳሌው ውስጥ የአገልጋዩን ባለሥልጣን ያመለክታል፤ “ባለቤት” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
