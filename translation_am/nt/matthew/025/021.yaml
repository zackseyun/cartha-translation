- source_word: δοῦλε
  choice: አገልጋይ
  rationale: በዚህ የምሳሌ ንግግር ውስጥ ተፈጥሯዊና ክብር ያለው አገላለጽ ነው፤ የባርነት ማኅበራዊ ሁኔታው ግን በግሪኩ ቃል ሊገለጥ ስለሚችል በማስታወሻ ተጠብቋል።
- source_word: Εὖ
