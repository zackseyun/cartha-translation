  yaml_path: translation/nt/matthew/025/002.yaml
  text: And five of them were foolish, and five were wise.
translation:
  language: am
  text: ከእነርሱም አምስቱ ሞኞች ነበሩ፣ አምስቱም አስተዋዮች ነበሩ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέντε
  choice: አምስቱ
  rationale: ቁጥሩን ‘አምስት’ ብሎ በቀጥታ ያስተላልፋል፤ የተወሰነው ቅጽ ከቀድሞ ከተጠቀሱት አሥሩ መካከል ያሉትን ሁለት የአምስት ቡድኖች በተፈጥሯዊ አማርኛ ያመለክታል።
- source_word: δὲ
  choice: -ም
  rationale: እዚህ δέ ጠንካራ ተቃርኖ ሳይሆን ቀላል ትስስር ያሳያል፤ ከ‘እነርሱ’ ጋር የተያያዘው ‘ም’ ይህን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐξ αὐτῶν
  choice: ከእነርሱ
  rationale: አምስቱ ቀደም ሲል ከተጠቀሰው ቡድን ክፍል መሆናቸውን የግሪኩን ከፊልነት አገላለጽ በቀጥታ ያሳያል።
- source_word: ἦσαν
  choice: ነበሩ
  rationale: ያለፈ ጊዜ ገላጭ አያያዥ ግስ ሆኖ የቡድኖቹን ሁኔታ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: μωραὶ
  choice: ሞኞች
  rationale: μωρός የሚያመለክተውን የማስተዋል ጉድለት በግልጽና በዘመናዊ አማርኛ ይገልጣል።
- source_word: καὶ πέντε φρόνιμοι
  choice: አምስቱም አስተዋዮች
  rationale: φρόνιμος ያለውን ጠንቃቃ፣ አስተዋይ የመሆን ሐሳብ ‘አስተዋዮች’ በተፈጥሯዊ ሁኔታ ይይዛል፤ ‘ም’ ደግሞ καίን በማስተላለፍ የሁለቱን የአምስት ቡድኖች ሚዛናዊ ንጽጽር ይጠብቃል።
