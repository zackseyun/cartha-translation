  rationale: የመልስ ግሱንና የንግግር አስተዋዋቂውን ተሳቢ በተፈጥሯዊ አማርኛ ያጣምራል፤ የግሪኩን የቅንነት/ጥበብ ትርጉምም “ጥበበኞቹ” ይጠብቃል።
- source_word: Μήποτε οὐ μὴ ἀρκέσῃ
  choice: አይሆንም፤ ምናልባት ... አይበቃ ይሆናልና
  rationale: በዐውዱ ያለውን እምቢታ በግልጽ ሁኔታ ያሳያል፤ μήποτε ከአጽንዖታዊው οὐ μή ጋር የሚገልጸውን ከባድ የእጥረት ስጋትም ይጠብቃል።
- source_word: ἡμῖν καὶ ὑμῖν
