  to: ብልሆቹ ግን እንዲህ ብለው መለሱ፤ “አይሆንም፤ ለእኛም ለእናንተም ላይበቃ ይችላልና።[a] ይልቁንም ወደሚሸጡት ሄዳችሁ ለራሳችሁ ግዙ።”
