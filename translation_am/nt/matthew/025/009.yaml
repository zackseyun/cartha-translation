- source_word: πορεύεσθε μᾶλλον πρὸς τοὺς πωλοῦντας
  choice: ይልቁንም ወደሚሸጡት ሄዳችሁ
  rationale: μᾶλλον የሚያመለክተውን ተመራጭ አማራጭ “ይልቁንም” ያሳያል፤ “ወደሚሸጡት” ደግሞ በምንጩ ያልተገለጸውን ዕቃ ሳይጨምር የ substantival participle ኃይልን ይጠብቃል።
- source_word: ἀγοράσατε ἑαυταῖς
  choice: ለራሳችሁ ግዙ
  rationale: ትእዛዙንና ግዢው ለራሳቸው ጥቅም መሆኑን በግልጽና ቀጥተኛ ቋንቋ ያቀርባል።
