base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/009.yaml
  text: But the wise answered[a], saying, ‘No, lest there not be enough for us and for you. Go instead to those who sell, and buy for yourselves.’
translation:
  language: am
  text: ብልሆቹ ግን እንዲህ ብለው መለሱ፤ “አይሆንም፤ ለእኛም ለእናንተም ላይበቃ ይችላልና።[a] ይልቁንም ወደሚሸጡት ሄዳችሁ ለራሳችሁ ግዙ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለእኛም ለእናንተም ፈጽሞ ላይበቃ ይችላል።” በግሪክ ጽሑፉ ውስጥ አጽንዖታዊው አሉታ (οὐ μή) በቅንፍ ቀርቧል፤ ከ“ምናልባት/እንዳይ” ከሚለው አገላለጽ ጋር ተያይዞ ያለው ነገር እንዳይበቃ ያላቸውን ጠንካራ ስጋት ያሳያል።
    reason: lexical_alternative
lexical_decisions:
