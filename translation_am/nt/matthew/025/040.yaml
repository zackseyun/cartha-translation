  text: And the King will answer them[a], ‘Truly I say to you, insofar as you did it to one of the least of these brothers of mine[b], you did it to me.’
translation:
  language: am
  text: ንጉሡም መልሶ እንዲህ ይላቸዋል፦ “እውነት እላችኋለሁ[a]፤ ከእነዚህ ከታናናሾቹ ወንድሞቼ[b] ለአንዱ ባደረጋችሁት መጠን፣ ለእኔ አደረጋችሁት።”
  philosophy: optimal-equivalence
  footnotes:
