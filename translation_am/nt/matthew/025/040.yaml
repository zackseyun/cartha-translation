  - marker: b
    text: “ወንድሞቼ” የሚለው በግሪክ ተባዕታይ ብዙ ቁጥር የሆነውን ቃል ይተረጉማል። “እነዚህ ወንድሞቼ” የሚለው በተለይ የኢየሱስን ደቀ መዛሙርት፣ በአጠቃላይ አማኞችን፣ ወይም በሰፊው የተጎዱና የተቸገሩ ሰዎችን ሊያመለክት ይችላል፤ ትርጉሙ ይህን ጥያቄ ሳይወስን የምንጩን አገላለጽ ይጠብቃል።
