  yaml_path: translation/nt/matthew/025/042.yaml
  text: For I was hungry and you gave me nothing to eat[a]; I was thirsty and you gave me nothing to drink.
translation:
  language: am
  text: ርቦኝ ነበርና የምበላውን አልሰጣችሁኝም፤ ተጠምቼም ነበር፤ የምጠጣውን አልሰጣችሁኝም።[ሀ]
  philosophy: optimal-equivalence
  footnotes:
  - marker: ሀ
    text: ወይም፣ በቃል በቃል፦ «እንድበላ አልሰጣችሁኝም … እንድጠጣ አልሰጣችሁኝም።»
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπείνασα
  choice: ርቦኝ ነበር
  rationale: የቀድሞውን የረሃብ ሁኔታ በተፈጥሯዊና በዘመናዊ አማርኛ ይገልጣል።
- source_word: γὰρ
  choice: -ና
  rationale: በአውዱ ውስጥ ለፍርዱ የሚሰጠውን ምክንያት በተፈጥሯዊ የአማርኛ አያያዥ ያሳያል።
- source_word: ἐδώκατέ μοι φαγεῖν
  choice: የምበላውን አልሰጣችሁኝም
  rationale: ቃል በቃል ‘እንድበላ አልሰጣችሁኝም’ የሚለውን ግሪክ በተፈጥሯዊ አማርኛ ያቀርባል፤ የመጀመሪያ ሰው ተቀባይነትንም ግልጽ ያደርጋል።
- source_word: μοι
  choice: -ኝ
  rationale: የግሪኩን ተዘዋዋሪ ተሳቢ ‘ለእኔ’ በአማርኛው ግስ ላይ በተያያዘ የመጀመሪያ ሰው ቅጥያ ይጠብቃል።
- source_word: φαγεῖν
  choice: የምበላውን
  rationale: የመብላትን የግስ ሐሳብ ይጠብቃል፤ ነገር ግን በአማርኛ ተፈጥሯዊ አገላለጽ እንዲሆን እንደ ዝምድና ሐረግ ቀርቧል።
- source_word: ἐδίψησα
  choice: ተጠምቼ ነበር
  rationale: ከረሃብ ሐረጉ ጋር ያለውን ትይዩነት ጠብቆ ያለፈውን የጥማት ሁኔታ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐποτίσατέ με
  choice: የምጠጣውን አልሰጣችሁኝም
  rationale: ποτίζω በዚህ የምሕረትና የእንክብካቤ አውድ ‘የሚጠጣ መስጠት’ ማለት ነው፤ ትርጉሙም ከመብላት ሐረጉ ጋር ያለውን ትይዩነት ይጠብቃል።
- source_word: με
  choice: -ኝ
  rationale: ቀጥተኛውን የመጀመሪያ ሰው ተሳቢ በግሱ ላይ በተያያዘ ቅጥያ ግልጽ ያደርጋል።
theological_decisions:
- issue: የተነፈገውን ምግብና መጠጥ የመግለጽ ደረጃ
  choice: ሁለቱንም ሐረጎች ‘የምበላውን/የምጠጣውን አልሰጣችሁኝም’ ብሎ መተርጎም
  alternative: ‘እንድበላ/እንድጠጣ አላደረጋችሁኝም’ ወይም ‘ምግብ/መጠጥ አልሰጣችሁኝም’
  rationale: የተመረጠው አገላለጽ የግሪኩን የግስ ሐሳብና በኢየሱስ ላይ የተፈጸመውን ግላዊ ቸልተኝነት ይጠብቃል፤ በተመሳሳይም ጊዜ ከአንድ የእምነት ወገን ትርጓሜ ጋር አያስርም።
