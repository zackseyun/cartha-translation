  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የሁለቱ ንግግሮች ትይዩነት ተጠብቋል፤ አላስፈላጊ ግርጌ ማስታወሻ አልተጨመረም።
