base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/036.yaml
  text: I was naked and you clothed me[a]; I was sick and you visited me[b]; I was in prison and you came to me.
translation:
  language: am
  text: ራቁቴን ነበርሁ፣ አለበሳችሁኝም፤ ታምሜ ነበር፣ ጎበኛችሁኝም[a]፤ በእስር ቤት ነበርሁ፣ ወደ እኔም መጣችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ተንከባከባችሁኝ።” የግሪኩ ግስ በአሳቢነትና በእንክብካቤ መጎብኘትን ሊያካትት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: γυμνὸς
  choice: ራቁቴን
  rationale: ቃሉ በቀጥታ ልብስ የሌለውን ሁኔታ ያመለክታል፤ በዚህ የምሕረት ድርጊት አውድ በቂ ልብስ አለመኖርንም ሊያካትት ይችላል።
- source_word: περιεβάλετέ
  choice: አለበሳችሁኝም
  rationale: περιβάλλω በዚህ ስፍራ ለአንድ ሰው ልብስ ማልበስን ይገልጣል፤ የተመረጠው ቃል ከ‘ራቁቴን’ ጋር ያለውን ግልጽ ተቃርኖ ይጠብቃል።
- source_word: ἠσθένησα
  choice: ታምሜ ነበር
  rationale: ግሱ በሰፊው መዳከምን ሊያመለክት ቢችልም፣ በዚህ አውድ ሕመምን ማመልከቱ የተፈጥሮ ንባብ ነው።
- source_word: ἐπεσκέψασθέ
  choice: ጎበኛችሁኝም
  rationale: ἐπισκέπτομαι መጎብኘትን ይገልጣል፣ ነገር ግን በጥንቃቄና በአሳቢነት መጠየቅንም ሊያካትት ይችላል፤ ‘ጎበኛችሁኝ’ ዋናውን ትርጉም ያለ ማስፋፋት ይጠብቃል።
- source_word: φυλακῇ
  choice: በእስር ቤት
  rationale: φυλακή የእስር ወይም የጥበቃ ስፍራን ሊያመለክት ይችላል፤ በአማርኛ ‘እስር ቤት’ በዚህ አውድ ግልጽና ተፈጥሯዊ ነው።
- source_word: ἤλθατε πρός με
  choice: ወደ እኔም መጣችሁ
  rationale: የግሪኩን ቀላልና ቀጥተኛ አገላለጽ ይጠብቃል፤ ‘ልትጎበኙኝ መጣችሁ’ ብሎ ያልተገለጸውን ሐሳብ አይጨምርም።
theological_decisions:
- issue: የምሕረት ድርጊቶቹን በትርጓሜ የማስፋፋት መጠን
  choice: ‘አለበሳችሁኝ’፣ ‘ጎበኛችሁኝ’ እና ‘ወደ እኔ መጣችሁ’ የሚሉትን ተጨባጭ ድርጊቶች በቀጥታ ማቅረብ
  alternative: ‘ተንከባከባችሁኝ’ ወይም ‘ልትጠይቁኝ መጣችሁ’ ብሎ ትርጉሙን ማስፋት
  rationale: የግሪኩ አገላለጽ ግልጽና ተጨባጭ ነው። የእንክብካቤ ሐሳብ በአውዱ ውስጥ ቢኖርም፣ በዋናው ጽሑፍ ላይ በማብራሪያ መልክ አልተጨመረም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የአማርኛ አገላለጽ ተጠቅሟል። የአንቀጹ ሦስት ትይዩ ክፍሎችና የግሶቹ ቀጥተኛነት ተጠብቀዋል።
