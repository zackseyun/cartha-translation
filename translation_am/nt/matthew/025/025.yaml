  source_fidelity: The draft accurately renders the sequence of fear, departure, concealment in the ground, and return of the master's property. However, «ፈርቼም ሄድኩና» uses two connective forms in a way that is somewhat awkward and can blur the Greek participial sequence. «ፈርቼ ሄጄ» more directly and naturally conveys φοβηθεὶς ἀπελθών before the main verb ἔκρυψα.
  naturalness: «መክሊትህን በመሬት ውስጥ ደበቅሁት» and «እነሆ፣ ያንተ የሆነው ይኸውልህ» are natural, clear modern standard Amharic in an appropriate elevated biblical register. The minor revision improves the opening verbal chain without changing its meaning.
  terminology: «መክሊት» appropriately retains the historical term for a talent, and the anchored note correctly prevents confusion with natural ability. The wording of the note appropriately identifies it as a high-value unit of weight and money.
