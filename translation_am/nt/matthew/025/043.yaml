revisions:
- from: እንግዳ ነበርሁ፤ አልተቀበላችሁኝም[a]። ራቁቴን ነበርሁ፤ አላለበሳችሁኝም። ታምሜና ታስሬ ነበርሁ፤ አልጠየቃችሁኝም[b]።
  to: እንግዳ ነበርሁ፤ አልተቀበላችሁኝም[a]። ራቁቴን ነበርሁ፤ አላለበሳችሁኝም። ታምሜ በእስር ቤት ሆኜ ነበርሁ፤ አልጠየቃችሁኝም[b]።
