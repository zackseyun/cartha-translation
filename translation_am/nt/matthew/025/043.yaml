  text: ξένος ἤμην καὶ οὐ συνηγάγετέ με, γυμνὸς καὶ οὐ περιεβάλετέ με, ἀσθενὴς καὶ ἐν φυλακῇ καὶ οὐκ ἐπεσκέψασθέ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/043.yaml
  text: I was a stranger and you did not welcome me[a], naked and you did not clothe me[b], sick and in prison and you did not visit me.
translation:
  language: am
  text: እንግዳ ነበርሁ፤ አልተቀበላችሁኝም[a]። ራቁቴን ነበርሁ፤ አላለበሳችሁኝም። ታምሜ በእስር ቤት ሆኜ ነበርሁ፤ አልጠየቃችሁኝም[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ወደ ቤታችሁ አስገባችሁኝ» ወይም «ተቀበላችሁኝ» ሊባል ይችላል። የግሪኩ ግስ ቃል በቃል «ሰበሰበ» ማለት ቢሆንም፣ እዚህ እንግዳን በመስተንግዶ መቀበልን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: «ጠየቃችሁኝ» የሚለው «ጎበኛችሁኝ» ብቻ ሳይሆን፣ «ተንከባከባችሁኝ» ወይም «እንክብካቤ አደረጋችሁልኝ» የሚለውን የአሳቢነት ስሜትም ሊይዝ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ξένος
  choice: እንግዳ
  rationale: በዚህ የምሕረት ተግባራት ዝርዝር ውስጥ ከቤተሰብ ወይም ከማኅበረሰብ ውጭ ሆኖ መቀበያ የሚያስፈልገውን ሰው ያመለክታል፤ «እንግዳ» የዘር ወይም የዜግነት ትርጉም ሳይጨምር ይህን ያስተላልፋል።
- source_word: συνηγάγετέ
  choice: ተቀበላችሁኝ
  rationale: ግሱ ቃል በቃል «ሰበሰበ» ማለት ቢሆንም፣ ከξένος ጋር በዚህ አገባብ እንግዳን በመስተንግዶ ማስገባትና መቀበልን ያመለክታል።
- source_word: γυμνός
  choice: ራቁቴን
  rationale: ቀጥተኛውን የልብስ እጦት ትርጉም ይጠብቃል፤ በአውዱ ውስጥ በቂ ልብስ አለመኖርንም ሊያካትት ይችላል።
- source_word: περιεβάλετέ
  choice: አለበሳችሁኝ
  rationale: ቃሉ ልብስን በሰው ዙሪያ ማድረግ፣ ማልበስ ማለት ነው፤ የአማርኛው ግስ ተፈጥሯዊና ቀጥተኛ ነው።
- source_word: ἀσθενής
  choice: ታምሜ
  rationale: ቃሉ «ደካማ» ማለትም ሊሆን ቢችልም፣ በዚህ የምሕረት አውድ ሕመምን ማመልከቱ ይበልጥ ተፈጥሯዊ ነው።
- source_word: ἐν φυλακῇ
  choice: ታስሬ
  rationale: φυλακή እዚህ የሚያመለክተው የእስር ሁኔታን ነው፤ «ታስሬ» በተፈጥሯዊ አማርኛ ይህን ሁኔታ ይገልጣል።
- source_word: ἐπεσκέψασθέ
  choice: ጠየቃችሁኝ
  rationale: «መጠየቅ» በአማርኛ ታማሚን ወይም እስረኛን በአሳቢነት ሄዶ ማየትን በተፈጥሯዊ ሁኔታ ይገልጣል፤ ቃሉ ተራ ማኅበራዊ ጉብኝትን ብቻ ሳይሆን እንክብካቤንም ያመለክታል።
theological_decisions:
- issue: በἐπεσκέψασθέ με ውስጥ ያለው የምሕረት ተግባር ስፋት
  choice: አልጠየቃችሁኝም
  alternative: አልጎበኛችሁኝም / አልተንከባከባችሁኝም
  rationale: የተመረጠው አተረጓጎም በግሪኩ የተጠቀሰውን ተጨባጭ የመሄድና የማየት ተግባር ይጠብቃል፤ ነገር ግን በአማርኛ አጠቃቀሙ አሳቢ እንክብካቤንም ያካትታል። ይህን ስፋት ማስታወሻው ግልጽ ያደርገዋል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ተደጋጋሚ አወቃቀር ተጠብቆ፣ በመጨረሻው ክፍል ἀσθενὴς καὶ ἐν φυλακῇ በአንድ የእምቢታ ግስ ስር መሆኑ «ታምሜና ታስሬ…» በሚል ተንጸባርቋል።
