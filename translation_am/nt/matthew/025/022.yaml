id: MAT.25.22
reference: Matthew 25:22
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: προσελθὼν ⸀δὲ καὶ ὁ τὰ δύο ⸀τάλαντα εἶπεν· Κύριε, δύο τάλαντά μοι παρέδωκας· ἴδε ἄλλα δύο τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/022.yaml
  text: Then the one who had received the two talents also came forward and said[a], ‘Lord, you handed over to me two talents. Look[b], I gained two more talents.’
translation:
  language: am
  text: ሁለት ታላንት[b] የተቀበለውም ቀርቦ፣ “ጌታ[a] ሆይ፣ ሁለት ታላንት አስረክበኸኝ ነበር፤ እነሆ፣ ተጨማሪ ሁለት ታላንት አተረፍሁ” አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ባለቤት ሆይ።” የግሪኩ κύριος (ኪርዮስ) የሚለው ማዕረግ በተለምዶ “ጌታ” ተብሎ ይተረጎማል፤ በዚህ ምሳሌ ግን አገልጋዩ ለባለቤቱ የሚጠቀምበት የክብር አጠራርም ሊሆን ይችላል።
    reason: alternative_reading
  - marker: b
    text: ታላንት እጅግ ትልቅ የገንዘብ መጠን ነበር፤ በዚህ ስፍራ ተፈጥሯዊ ችሎታን አያመለክትም።
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: ቀርቦ
  rationale: የመቅረብንና ለመናገር ወደ ጌታው ፊት የመምጣትን ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δὲ καὶ
  choice: …ውም
  rationale: በቀደመው አገልጋይ ዘገባ ላይ የሚጨመረውን ቀጣይ ክስተት የአማርኛው አያያዥ ‘ም’ በአጭሩ ያሳያል።
- source_word: ὁ τὰ δύο τάλαντα
  choice: ሁለቱን ታላንት የተቀበለው
  rationale: የግሪኩ ሐረግ ግለሰቡን በተሰጠው መጠን ይለያል፤ ‘የተቀበለው’ የሚለው ከምሳሌው አውድ ተወስዶ በአማርኛ ማንነቱን ግልጽ ያደርጋል።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: κύριοςን በመደበኛው ‘ጌታ’ ይተረጉማል፤ ‘ሆይ’ የጥሪውን ቅርጽ በተፈጥሯዊና ክብር ባለው አማርኛ ያሳያል።
- source_word: παρέδωκας
  choice: አስረክበኸኝ ነበር
  rationale: ንብረትን ለሌላ ሰው አሳልፎ የመስጠትን ተጨባጭ ኃይል ይጠብቃል፤ ‘ነበር’ ደግሞ ከአሁኑ ሪፖርት በፊት የሆነውን ተግባር ያሳያል።
- source_word: ἴδε
  choice: እነሆ
  rationale: ተናጋሪው ትኩረትን ወደ ውጤቱ እንዲዞር የሚያደርገውን የግሪኩን አመልካች ቃል ይጠብቃል።
- source_word: ἄλλα δύο τάλαντα
  choice: ሌላ ሁለት ታላንት
  rationale: ከቀድሞው መጠን ጋር እኩል የሆነ ተጨማሪ መጠንን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐκέρδησα
  choice: አተረፍሁ
  rationale: κερδαίνω የሚያመለክተውን ማትረፍና ተጨማሪ ጥቅም ማግኘት ይገልጣል፤ የንግዱን ዘዴ ከጽሑፉ በላይ አይወስንም።
- source_word: τάλαντα
  choice: ታላንት
  rationale: ታሪካዊውን የክብደትና የገንዘብ መጠን ስም ይጠብቃል፤ ትርጉሙ በማስታወሻ ይብራራል።
theological_decisions:
- issue: በምሳሌው ውስጥ κύριος የሚለውን የአነጋገር ማዕረግ መተርጎም
  choice: ጌታ
  alternative: ባለቤት
  rationale: በቅርብ ማኅበራዊ አውዱ ቃሉ የአገልጋዩን ባለቤት ሊያመለክት ቢችልም፣ ‘ጌታ’ የκύριοςን ስፋትና የምሳሌውን ሥነ መለኮታዊ ውጥረት ሳይፈታ ይጠብቃል። አማራጩ በማስታወሻ ተጠቅሷል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። ‘ቀርቦ’፣ ‘አስረክበኸኝ’ እና ‘አተረፍሁ’ የትረካውን ቅደም ተከተልና የገንዘብ አውድ በተፈጥሯዊ መንገድ ያስተላልፋሉ።
