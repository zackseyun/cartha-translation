  source_fidelity: The draft accurately represents the approach, the servant identified by the two talents, the respectful address κύριε, the prior handing over, the deictic ἴδε, and the gain of an additional two talents. The addition of “received” is contextually warranted, as in the audit trail. A minor revision makes the identification phrase and the additional amount more idiomatic in modern standard Amharic.
  naturalness: “ሁለቱን ታላንት የተቀበለው” is understandable, but “ሁለት ታላንት የተቀበለው” is more natural as a servant-identifying phrase. “ተጨማሪ ሁለት ታላንት” more clearly and naturally expresses ἄλλα δύο τάλαντα than “ሌላ ሁለት ታላንት.”
  terminology: “ጌታ ሆይ” appropriately retains the established rendering of κύριε while the note responsibly gives “ባለቤት ሆይ” as a contextual alternative. “ታላንት” is retained consistently, and its monetary—not innate-ability—sense is properly explained in the cultural note.
  issues:
