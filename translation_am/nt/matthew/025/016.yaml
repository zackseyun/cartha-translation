    text: ወይም፣ “ሄዶ በእነርሱ ሠራ።” ግሪኩ ገንዘቡን ትርፍ ለማግኘት በንቃት መጠቀሙን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ታላንት በዚህ ስፍራ ከፍተኛ የገንዘብ መጠን ነው፤ የተፈጥሮ ችሎታ ማለት አይደለም።
    reason: cultural_note
