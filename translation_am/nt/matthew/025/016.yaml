  text: ⸀πορευθεὶς ὁ τὰ πέντε τάλαντα λαβὼν ἠργάσατο ἐν αὐτοῖς καὶ ⸀ἐκέρδησεν ἄλλα ⸀πέντε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/016.yaml
  text: The one who had received the five talents went and worked with them[b][a], and gained another five.
translation:
  language: am
  text: አምስት ታላንት[b] የተቀበለውም ሄዶ በእነርሱ ነገደ[a]፤ ተጨማሪ አምስት ታላንትም አተረፈ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሄዶ በእነርሱ ሠራ።” ግሪኩ ገንዘቡን ትርፍ ለማግኘት በንቃት መጠቀሙን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ታላንት በዚህ ስፍራ ከፍተኛ የገንዘብ መጠን ነው፤ የተፈጥሮ ችሎታ ማለት አይደለም።
    reason: cultural_note
lexical_decisions:
- source_word: πορευθεὶς
  choice: ሄዶ
  rationale: የግሪኩን የቅድመ ድርጊት አንቀጽ በተፈጥሯዊ የአማርኛ ተከታታይ ድርጊት አቀራረብ ያሳያል፤ ‘ወዲያው’ የሚል ቃል በግሪኩ ስለሌለ አልተጨመረም።
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: አምስቱን ታላንት የተቀበለው
  rationale: ግለሰቡን በተቀበለው ነገር የሚለየውን የግሪክ አገባብ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: τάλαντα
  choice: ታላንት
  rationale: ባህላዊውን የገንዘብ መለኪያ ስም ያቆያል፤ እዚህ የተፈጥሮ ችሎታ ሳይሆን ከፍተኛ የገንዘብ መጠን መሆኑ በማስታወሻ ተብራርቷል።
- source_word: ἠργάσατο ἐν αὐτοῖς
  choice: በእነርሱ ሠራ
  rationale: የግሪኩን አገላለጽ በቅርብ ይከተላል፤ ገንዘቡን ለትርፍ በንቃት መጠቀሙን አውዱና ማስታወሻው ያብራራሉ፣ የተወሰነ የንግድ ዘዴም አይጨመርም።
- source_word: ἐκέρδησεν
  choice: አተረፈ
  rationale: በገንዘብ አውድ ውስጥ ያለውን የማትረፍና የማግኘት ፍቺ ተፈጥሯዊ በሆነ ዘመናዊ አማርኛ ያሳያል።
- source_word: ἄλλα πέντε
  choice: ሌላ አምስት
  rationale: የተጨማሪነቱን ፍቺ በአጭርና በተፈጥሯዊ አማርኛ ያቀርባል፤ ታላንት የሚለው ስም ከአውዱ ይገባል።
