  text: But the wise took oil in their containers with their lamps[a].
translation:
  language: am
  text: አስተዋዮቹ ግን ከመብራቶቻቸው[a] ጋር ዘይትን በመያዣዎቻቸው ውስጥ ወሰዱ።
  philosophy: optimal-equivalence
  footnotes:
