  text: μετὰ δὲ ⸂πολὺν χρόνον⸃ ἔρχεται ὁ κύριος τῶν δούλων ἐκείνων καὶ συναίρει ⸂λόγον μετ’ αὐτῶν⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/019.yaml
  text: After a long time[a], the master of those servants comes and settles accounts with them.
translation:
  language: am
  text: ከብዙ ጊዜ በኋላ የእነዚያ ባሪያዎች ጌታ[a] ይመጣና ከእነርሱ ጋር ሒሳብ ያወራርዳል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ κύριος «ጌታ» ወይም «ባለቤት» ማለት ሊሆን ይችላል፤ δοῦλοιም «ባሪያዎች» ወይም «አገልጋዮች» ተብሎ ሊተረጎም ይችላል። እዚህ ዋናው ጽሑፍ በምሳሌው ጎልቶ የሚታየውን የቤት እና የኢኮኖሚ ግንኙነት ይገልጣል።
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ δὲ πολὺν χρόνον
  choice: ከብዙ ጊዜ በኋላ
  rationale: μετά ከመስተዋድዱ ጋር የጊዜ ተከተልን፣ ‘ከ…በኋላ’ የሚለውን ያመለክታል። δέ እዚህ ቀላል የትረካ ማያያዣ ስለሆነ፣ በአማርኛ ተጨማሪ ‘እንግዲህ’ ወይም ‘ግን’ ሳይጨመር የጊዜው ሐረግ ብቻ ተፈጥሯዊ የትረካ ፍሰትን ይሰጣል።
- source_word: ἔρχεται
  choice: መጥቶ
  rationale: የግሪኩ ቃል ታሪካዊ የአሁን ጊዜ ነው። ‘መጥቶ … ያወራርዳል’ የሚለው አወቃቀር የምንጩን ሕያው የአሁን ጊዜ ትረካ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ὁ κύριος
  choice: ጌታ
  rationale: ‘ጌታ’ በአማርኛ የበላይነትንና የባለቤትነትን ግንኙነት ይገልጣል፤ በዚህ ምሳሌ ውስጥ የባሪያዎቹን ጌታ ያመለክታል። ቃሉ ሊኖረው የሚችለውን ‘ጌታ/Lord’ ትርጉምም ሳይሽር የትረካውን ማኅበራዊ ግንኙነት ያስቀምጣል።
- source_word: τῶν δούλων ἐκείνων
  choice: የእነዚያ ባሪያዎች
  rationale: δοῦλος አገልጋይ ወይም ባሪያ ሊባል ይችላል። እዚህ ከጌታቸው ጋር ያላቸው የባለቤትነትና የኢኮኖሚ ግንኙነት ግልጽ ስለሆነ ‘ባሪያዎች’ የታሰረውን ማኅበራዊ ሁኔታ በትክክል ያሳያል።
- source_word: συναίρει λόγον μετ’ αὐτῶν
  choice: ከእነርሱ ጋር ሒሳብ ያወራርዳል
  rationale: ይህ የግሪክ ፈሊጥ ሒሳብን መመርመርና መዝጋት፣ ወይም ተጠያቂ ማድረግን ያመለክታል። ‘ሒሳብ ማወራረድ’ የምሳሌውን የንብረትና የሒሳብ አውድ በግልጽ ዘመናዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: በምሳሌው ውስጥ κύριοςን መተርጎም
  choice: ጌታ
  alternative: ባለቤት / አለቃ
  rationale: በዚህ ንግግር ቃሉ በቀጥታ የክርስቶስ መጠሪያ ሳይሆን የምሳሌውን የቤት ጌታ ያመለክታል። ‘ጌታ’ የትረካውን ሚና በተፈጥሯዊ አማርኛ የሚገልጥ ሲሆን፣ ቃሉ ሊኖረው የሚችለውን ሰፊ መንፈሳዊ ጥላ አያስወግድም።
- issue: δοῦλοςን መተርጎም
  choice: ባሪያዎች
  alternative: አገልጋዮች
  rationale: በዚህ የጌታና የተገዢዎች የኢኮኖሚ አውድ ውስጥ የታሰረ ማኅበራዊ ሁኔታው ጎልቶ ይታያል። ‘አገልጋዮች’ ይህን ሁኔታ ሊያለዝበው ስለሚችል ‘ባሪያዎች’ ተመርጧል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። ‘ሒሳብ ማወራረድ’ በዘመናዊ አጠቃቀም የታወቀ ሲሆን የምንጩን የሒሳብ አወራረድና የተጠያቂነት ሐሳብ ይጠብቃል።
