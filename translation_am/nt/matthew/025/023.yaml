id: MAT.25.23
reference: Matthew 25:23
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ κύριος αὐτοῦ· Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/023.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will put you over many things. Enter into the joy of your master.’
translation:
  language: am
  text: ጌታውም፣ “መልካም ሠርተሃል፣ መልካምና ታማኝ አገልጋይ[a]፤ በጥቂት ነገሮች ላይ ታማኝ ነበርህ፤ በብዙ ነገሮች ላይ እሾምሃለሁ። ወደ ጌታህ ደስታ ግባ” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ባሪያ።” የግሪኩ δοῦλος እንደ አውዱ አገልጋይን ወይም ባሪያን ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: አለው
  rationale: ቀጥተኛ ንግግርን በተፈጥሯዊ ዘመናዊ አማርኛ የሚያስተዋውቅ መደበኛ አገላለጽ ነው።
- source_word: ὁ κύριος αὐτοῦ / τοῦ κυρίου σου
  choice: ጌታው / ጌታህ
  rationale: በአማርኛ ‘ጌታ’ በቤት ወይም በንብረት ላይ ሥልጣን ያለውን ሰውም ሊያመለክት ስለሚችል፣ የምሳሌውን ሰብዓዊ ጌታ በተፈጥሯዊነት ይገልጣል፤ ከዚህ በላይ ያለውን ሥነ መለኮታዊ አንድምታም አያጠፋም።
- source_word: Εὖ
  choice: አዎን
  rationale: እዚህ ያለውን የማመስገንና የማጽደቅ አነጋገር በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ‘መልካም አደረግህ’ የሚለውን በግሥ መፍታት የግሪኩን አጭር ጥሪ ያሰፋዋል።
- source_word: δοῦλε
  choice: አገልጋይ
  rationale: በምሳሌው ያለውን በጌታ ሥር የሚገኝ የቤት ሰው ግንኙነት በአማርኛ በተነባቢነት ይገልጣል፤ ‘ባሪያ’ የሚለው ጠንካራ ትርጉም በማስታወሻ ተጠብቋል።
- source_word: ἀγαθὲ καὶ πιστέ
  choice: መልካምና ታማኝ
  rationale: ሁለቱን የጥሪ ቅጽ ቅጽሎች በቀጥታ ይጠብቃል፤ ‘ታማኝ’ ከቀጣዩ πιστός ጋር ያለውን የቃል ትስስርም ያስቀራል።
- source_word: ἐπὶ ὀλίγα ἦς πιστός
  choice: በጥቂት ነገሮች ታማኝ ነበርህ
  rationale: በተሰጠው አነስተኛ ኃላፊነት ውስጥ ታማኝ መሆኑን ይገልጣል፤ የግሪኩን ብዙ ቁጥር ገለጻ ይጠብቃል።
- source_word: ἐπὶ πολλῶν σε καταστήσω
  choice: በብዙ ነገሮች ላይ እሾምሃለሁ
  rationale: καθίστημι በዚህ አውድ ለተጨማሪ ኃላፊነት መሾምን ያመለክታል፤ ከ‘ጥቂት’ ጋር ያለውን ትይዩነትም ይጠብቃል።
- source_word: εἴσελθε εἰς τὴν χαρὰν
  choice: ወደ ... ደስታ ግባ
  rationale: የመግባትን ዘይቤ ሳያለሰልስ የግሪኩን ትእዛዝና አቅጣጫ በቀጥታ ያስተላልፋል።
theological_decisions:
- issue: በምሳሌው ውስጥ κύριοςን መተርጎም
  choice: ጌታ
  alternative: ባለቤት
  rationale: ቃሉ በታሪኩ ውስጥ የአገልጋዩን ሰብዓዊ ጌታ ያመለክታል። ‘ጌታ’ ይህን ግንኙነት በአማርኛ ሊገልጥ የሚችል ሲሆን፣ ምሳሌውን በቀጥታ እንደ መለኮታዊ ማዕረግ አያስገድድም።
- issue: δοῦλοςን በዚህ አውድ መተርጎም
  choice: አገልጋይ
  alternative: ባሪያ
  rationale: የቁጥሩ ትኩረት በአደራ ላይ ባለ ታማኝነት ነው። ‘አገልጋይ’ ይህን በተፈጥሯዊነት ያቀርባል፤ ቃሉ ባሪያንም ሊያመለክት የሚችለው እውነተኛ የትርጉም ክልል በማስታወሻ ተገልጧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ትይዩ አወቃቀር—ጥቂት/ብዙ እና ታማኝ/ታማኝ—ተጠብቋል፤ የ‘ደስታ ውስጥ መግባት’ ዘይቤም አልተለሰለሰም።
