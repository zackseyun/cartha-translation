  text: Then all those virgins got up and trimmed their lamps[a].
translation:
  language: am
  text: ከዚያም እነዚያ ደናግል ሁሉ ተነሥተው መብራቶቻቸውን[a] አዘጋጁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ችቦዎቻቸውን።” የግሪኩ λαμπάδας ቃል በእጅ የሚያዝን መብራት ወይም ችቦ ሊያመለክት ይችላል፤ ዘይትና ዝግጅት የተጠቀሱበት ዐውድ ሁለቱንም ትርጉሞች ሊደግፍ ይችላል።
