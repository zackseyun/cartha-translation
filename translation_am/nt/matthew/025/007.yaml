lexical_decisions:
- source_word: τότε
  choice: ከዚያም
  rationale: በትረካው ውስጥ ቀጥሎ የተፈጸመውን ድርጊት በተፈጥሯዊ ዘመናዊ አማርኛ ያመለክታል።
- source_word: ἠγέρθησαν
  choice: ተነሥተው
  rationale: ከእንቅልፍ ወይም ከተኙበት መነሣታቸውን ያሳያል፤ ተገብሮአዊውን ቅርጽ ‘ተቀሰቀሱ’ ብሎ ከሚገድብ ይልቅ በዐውዱ የሚታየውን ድርጊት በቀጥታ ይገልጣል።
- source_word: πᾶσαι αἱ παρθένοι ἐκεῖναι
  choice: እነዚያ ደናግል ሁሉ
  rationale: παρθένοι የሚለውን የድንግልና ትርጉምና ἐκεῖναι የሚያመለክተውን ‘እነዚያ’ በግልጽ ሁኔታ ይጠብቃል።
- source_word: ἐκόσμησαν
  choice: አዘጋጁ
  rationale: κοσμέω በመሠረቱ ማስተካከልን ወይም በሥርዓት ማዘጋጀትን ያመለክታል። ከመብራት ጋር ‘አዘጋጁ’ ዘይትንና ክሩን ማስተካከልን ሊያካትት ስለሚችል ምንጩ በግልጽ ያልገለጠውን ዝርዝር አይጨምርም።
- source_word: λαμπάδας
  choice: መብራቶቻቸውን
  rationale: λαμπάς በእጅ የሚያዝ መብራትን ወይም ችቦን ሊያመለክት ይችላል። የዘይትና የዝግጅት ዐውድ ‘መብራት’ን ዋና ትርጉም እንዲሆን ይደግፋል፤ ሌላው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ἑαυτῶν
  choice: -ቻቸውን
  rationale: የብዙ ቁጥር አንጸባራቂ ባለቤትነትን በተፈጥሯዊው የአማርኛ የባለቤትነት ቅጥያ ይገልጣል።
