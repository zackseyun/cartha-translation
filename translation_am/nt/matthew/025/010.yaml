language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἀπερχομένων δὲ αὐτῶν ἀγοράσαι ἦλθεν ὁ νυμφίος, καὶ αἱ ἕτοιμοι εἰσῆλθον μετ’ αὐτοῦ εἰς τοὺς γάμους, καὶ ἐκλείσθη ἡ θύρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/010.yaml
  text: But while they were going away to buy[a], the bridegroom came, and those who were ready went in with him to the wedding feast, and the door was shut.
translation:
  language: am
  text: እነርሱም ሊገዙ እየሄዱ ሳሉ፣ ሙሽራው መጣ፤ ዝግጁ የነበሩትም ከእርሱ ጋር ወደ ሰርግ ግብዣ[a] ገቡ፤ በሩም ተዘጋ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ «ወደ ሰርጉ በዓል» ወይም በአጭሩ «ወደ ሰርጉ»። የግሪኩ ብዙ ቁጥር ቃል መላውን የሰርግ በዓል ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπερχομένων δὲ αὐτῶν
  choice: ነገር ግን እነርሱ ... እየሄዱ ሳሉ
  rationale: የግሪኩ የባለቤት ፍጹማዊ አገባብ ከዋናው ድርጊት ጋር በአንድ ጊዜ የሚከናወን ድርጊትን ያሳያል፤ «እየሄዱ ሳሉ» ይህን ግንኙነት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἀγοράσαι
  choice: ሊገዙ
  rationale: የዓላማ አረፍተ ነገሩን በአጭርና ተፈጥሯዊ መንገድ ያስተላልፋል፤ በዚህ ቁጥር ያልተጠቀሰውን «ዘይት» ወደ ጽሑፉ አያክልም።
- source_word: ὁ νυμφίος
  choice: ሙሽራው
  rationale: በዘመናዊ አማርኛ በሰርግ አውድ የወንዱን ሙሽራ በተፈጥሯዊነት ይገልጻል፤ የምሳሌውንም ምስል ይጠብቃል።
- source_word: αἱ ἕτοιμοι
  choice: ዝግጁ የነበሩት
  rationale: ስምን ተክቶ የቆመውን የሴት ብዙ ቁጥር ቅጽ በተፈጥሯዊ አማርኛ ይገልጻል፤ በአውዱ ዝግጁ የነበሩትን ደናግል ያመለክታል።
- source_word: εἰσῆλθον μετ’ αὐτοῦ
  choice: ከእርሱ ጋር ... ገቡ
  rationale: የትረካውን ቀጥተኛ እንቅስቃሴ እና አብሮነት በግልጽ አማርኛ ያስተላልፋል።
- source_word: εἰς τοὺς γάμους
  choice: ወደ ሰርጉ ግብዣ
  rationale: የግሪኩ ብዙ ቁጥር ቅጽ እዚህ የሰርጉን በዓል ወይም ግብዣ ያመለክታል፤ «የሰርግ ግብዣ» ትዕይንቱን ለዘመናዊ አንባቢ ግልጽ ያደርጋል።
- source_word: ἐκλείσθη ἡ θύρα
  choice: በሩም ተዘጋ
  rationale: የግሪኩን ተደራጊ አውታርና የትዕይንቱን የመጨረሻነት ስሜት በአጭር እና ተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: በምሳሌው ውስጥ ያለው የሰርግ ምስል አተረጓጎም
  choice: «ሙሽራው» እና «የሰርግ ግብዣ» የሚሉትን እንደ ትረካዊ ምስሎች ማቆየት፣ ክርስቶሳዊ ትርጓሜን በትርጉሙ ውስጥ በግልጽ አለመጨመር
  alternative: «ሙሽራው»ን በቀጥታ «ክርስቶስ» ብሎ መተርጎም ወይም በዋናው ጽሑፍ ውስጥ ምሳሌያዊ ማብራሪያ መጨመር
  rationale: የምሳሌው ሥነ መለኮታዊ ክብደት ከጽሑፉና ከአውዱ እንዲወጣ ያደርጋል፤ ትርጉሙም በምንጩ ያልተገለጸን ትርጓሜ አያስገባም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ የሚገባ መደበኛ አማርኛን ይጠቀማል። የእንግሊዝኛው የግርጌ ማስታወሻ ምልክት «to buy» በሚለው ላይ ቢቀመጥም፣ የማስታወሻው ይዘት εἰς τοὺς γάμουςን ስለሚመለከት [a] ከ«ግብዣ» በኋላ ተቀምጧል።
