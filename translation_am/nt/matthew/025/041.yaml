id: MAT.25.41
reference: Matthew 25:41
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τότε ἐρεῖ καὶ τοῖς ἐξ εὐωνύμων· Πορεύεσθε ἀπ’ ἐμοῦ ⸀οἱ κατηραμένοι εἰς τὸ πῦρ τὸ αἰώνιον τὸ ἡτοιμασμένον τῷ διαβόλῳ καὶ τοῖς ἀγγέλοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/041.yaml
  text: Then he will also say to those on the left[a], ‘Go away from me, you cursed, into the eternal fire prepared for the devil and his angels.’
translation:
  language: am
  text: ከዚያም በግራ ያሉትን እንዲህ ይላቸዋል፦ “እናንተ የተረገማችሁ፣ ከእኔ ራቁ፤ ለዲያብሎስና ለመላእክቱ ወደ ተዘጋጀው ዘላለማዊ እሳት ሂዱ።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: ከዚያም
  rationale: በፍርዱ ትዕይንት ውስጥ የድርጊቶቹን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τοῖς ἐξ εὐωνύμων
  choice: በግራ ያሉትን
  rationale: በቅርብ ዐውድ በንጉሡ ግራ የቆመውን ቡድን በግልጽና በተፈጥሯዊ አገላለጽ ይጠቅሳል።
- source_word: Πορεύεσθε ἀπ’ ἐμοῦ
  choice: ከእኔ ራቁ … ሂዱ
  rationale: ከተናጋሪው መገኘት መለየትንና ወደተጠቀሰው መዳረሻ መሄድን በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: οἱ κατηραμένοι
  choice: እናንተ የተረገማችሁ
  rationale: የፍጹም ጊዜ ተደራጊ አንቀጽን እንደ ቀጥተኛ ጥሪ ይተረጉማል፤ ረጋሚውንም በጽሑፉ ያልተገለጸውን አይጨምርም።
- source_word: τὸ πῦρ τὸ αἰώνιον
  choice: ዘላለማዊ እሳት
  rationale: በዚህ የመጨረሻ ፍርድ ዐውድ αἰώνιον የሚያመለክተውን ዘላቂነት በመደበኛ ዘመናዊ አማርኛ ይገልጻል።
- source_word: τὸ ἡτοιμασμένον
  choice: ወደ ተዘጋጀው
  rationale: አስቀድሞ የተዘጋጀና አሁንም ዝግጁ የሆነ መዳረሻን የሚያሳየውን ተደራጊ አንቀጽ ያቆያል።
- source_word: τῷ διαβόλῳ καὶ τοῖς ἀγγέλοις αὐτοῦ
  choice: ለዲያብሎስና ለመላእክቱ
  rationale: በፍርድ ዐውዱ διάβολος የታወቀውን የግል ጠላት፣ ἄγγελοι ደግሞ ከእርሱ ጋር የተሰለፉትን መንፈሳዊ ፍጥረታት ያመለክታሉ።
theological_decisions:
- issue: በፍርድ ዐውድ αἰώνιον የሚለው ቃል
  choice: ዘላለማዊ
  alternative: ዘመናትን የሚዘልቅ
  rationale: ዘላለማዊ የሚለው በዚህ ዐውድ የግሪኩን መደበኛ ትርጉም በቀጥታ ያቀርባል፤ ጽሑፉ ከሚለው በላይ የተወሰነ የእምነት ሥርዓት አያስገባም።
- issue: የδιάβολος እና የἄγγελοι ተጠቃሾች
  choice: ዲያብሎስና መላእክቱ
  alternative: ሐሜተኛውና መልእክተኞቹ
  rationale: የፍርድ ዐውዱና የቃላቱ የተለመደ አጠቃቀም ዲያብሎስንና ከእርሱ ጋር ያሉትን መንፈሳዊ መላእክት ያመለክታሉ።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የቀጥተኛው ንግግር ክብደት ተጠብቋል፤ በግሪኩ ያልተገለጸ የረጋሚው ማንነት አልተጨመረም።
