  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ καταλιπὼν τὴν Ναζαρὰ ἐλθὼν κατῴκησεν εἰς Καφαρναοὺμ τὴν παραθαλασσίαν ἐν ὁρίοις Ζαβουλὼν καὶ Νεφθαλίμ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/013.yaml
  text: And leaving Nazara[a], he came and settled in Capernaum by the sea, in the region of Zebulun and Naphtali.
translation:
  language: am
  text: ናዛራን[a] ትቶ፣ በዛብሎንና በንፍታሌም ክልል ውስጥ በባሕር ዳር ወደምትገኘው ቅፍርናሆም መጥቶ ሰፈረ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ግሪክ፦ «ናዛራ»፤ ብዙ ትርጉሞች «ናዝሬት» ይላሉ።
    reason: alternative_reading
lexical_decisions:
- source_word: καταλιπὼν
  choice: ትቶ
  rationale: የግሪኩ የአኦሪስት አካፋይ ከዋናው ግስ በፊት የተፈጸመውን መነሳት ያሳያል፤ «ትቶ» ይህን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: Ναζαρὰ
  choice: ናዛራን
  rationale: በዚህ ጥቅስ ያለውን Ναζαρά የሚለውን የግሪክ ቅርጽ በቀጥታ ያንጸባርቃል፤ የተለመደው «ናዝሬት» በማስታወሻ ቀርቧል። የ«ን» ቅጥያ የአማርኛን ተሳቢ ምልክት ያሳያል።
- source_word: ἐλθὼν
  choice: መጣ
  rationale: የአኦሪስት አካፋዩ ከዋናው ግስ ጋር በቅደም ተከተል ተቀናጅቶ፣ ወደ ቅፍርናሆም መምጣቱን በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: κατῴκησεν
  choice: ሰፈረ
  rationale: ግሱ በቦታው መኖሪያ መያዝን ያመለክታል፤ «ሰፈረ» ከተራው «ኖረ» ይልቅ የመኖሪያ መመሥረትን ያስተላልፋል።
- source_word: Καφαρναοὺμ
  choice: ቅፍርናሆም
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውና ለአንባቢዎች የሚታወቀው የቦታው ስም ቅርጽ ነው።
- source_word: τὴν παραθαλασσίαν
  choice: በባሕር ዳር ባለችው
  rationale: ገላጩ ቃል ቅፍርናሆምን በባሕር አጠገብ ያለች ከተማ አድርጎ ይገልጣል፤ ይህ አተረጓጎም ግንኙነቱን ግልጽ ያደርጋል።
- source_word: ἐν ὁρίοις
  choice: በ… ክልል ውስጥ
  rationale: ὅρια ድንበሮችን፣ ግዛትን ወይም አካባቢን ሊያመለክት ይችላል፤ እዚህ «ክልል» ጂኦግራፊያዊውን ስፋት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Ζαβουλὼν
  choice: ዛብሎን
  rationale: የጎሳውንና የአካባቢውን ስም በአማርኛ የተለመደው ቅርጽ ያቀርባል።
- source_word: Νεφθαλίμ
  choice: ንፍታሌም
  rationale: የጎሳውንና የአካባቢውን ስም በአማርኛ የተለመደው ቅርጽ ያቀርባል።
