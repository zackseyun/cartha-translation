language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ⸂ἐν ὅλῃ τῇ Γαλιλαίᾳ⸃, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν μαλακίαν ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/023.yaml
  text: And he went throughout all Galilee[a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness among the people.
translation:
  language: am
  text: እርሱም በመላው ገሊላ ይዞር ነበር፤ በምኩራቦቻቸው እያስተማረ፣ የመንግሥቱን የምሥራች[a] እየሰበከ፣ በሕዝቡም መካከል በሽታን ሁሉና ሕመምን ሁሉ እየፈወሰ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የመንግሥቱን ወንጌል።”
    reason: lexical_alternative
lexical_decisions:
- source_word: περιῆγεν
  choice: እየዞረ … ይዞር ነበር
  rationale: የግሱን ያልተቋረጠ የዙሪያ እንቅስቃሴና የአለፈ ጊዜ ቀጣይነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐν ὅλῃ τῇ Γαλιλαίᾳ
  choice: በመላው ገሊላ
  rationale: እንቅስቃሴው በክልሉ ሁሉ እንደተካሄደ የሚያሳየውን ስርጭታዊ ትርጉም በግልጽ ያስተላልፋል።
- source_word: διδάσκων
  choice: እያስተማረ
  rationale: ከዋናው ግስ ጋር በአንድ ጊዜ የተካሄደውን ተግባር ይገልጣል።
- source_word: συναγωγαῖς αὐτῶν
  choice: በምኩራቦቻቸው
  rationale: የአይሁድን የጉባኤና የአምልኮ ስፍራዎች የሚጠቁመውን መደበኛ አማርኛ ቃል ተጠቅሟል፤ የባለቤትነት ቅጥያውም αὐτῶνን ይጠብቃል።
- source_word: κηρύσσων
  choice: እየሰበከ
  rationale: ለሕዝብ በግልጽና በሥልጣን የሚደረግን አዋጅ በተለመደ አማርኛ ይገልጣል።
- source_word: τὸ εὐαγγέλιον τῆς βασιλείας
  choice: የመንግሥቱን የምሥራች
  rationale: εὐαγγέλιον የሚለውን ቀጥተኛ የ‘መልካም ዜና’ ፍቺ ያስተላልፋል፤ የዝምድናውን አሻሚነት ሳይፈታም ‘የመንግሥቱ’ ብሎ ይጠብቃል።
- source_word: θεραπεύων
  choice: እየፈወሰ
  rationale: በዚህ አውድ ያለውን እውነተኛ የመፈወስ ትርጉም በተፈጥሯዊና ክብር ባለው ቃል ይገልጣል።
- source_word: πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: በሽታን ሁሉና ሕመምን ሁሉ
  rationale: ሁለቱን ስሞችና ተደጋጋሚውን πᾶσαν በመጠበቅ የንግግሩን አጠቃላይነት ያሳያል።
- source_word: ἐν τῷ λαῷ
  choice: በሕዝቡም መካከል
  rationale: ፈውሱ የተካሄደበትን ማኅበራዊ ወሰን በተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: የεὐαγγέλιον አተረጓጎም
  choice: የምሥራች
  alternative: ወንጌል
  rationale: ዋናው ጽሑፍ የግሪክ ቃሉን ቀጥተኛ ፍቺ በግልጽ አማርኛ ያቀርባል፤ በኢትዮጵያ ክርስቲያናዊ አጠቃቀም የተለመደው ‘ወንጌል’ በማስታወሻ ተጠብቋል።
- issue: የπᾶσαν νόσον καὶ πᾶσαν μαλακίαν ወሰን
  choice: በሽታን ሁሉና ሕመምን ሁሉ
  alternative: ማንኛውንም በሽታና ድካም
  rationale: ሁለቱ የπᾶσαν አጠቃቀሞች የሚሰጡትን አጽንዖት ይጠብቃል፤ ሁለቱንም ስሞች አንድ ቃል ውስጥ አያዋህድም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ዋና ግስና ሦስቱ ተጓዳኝ ድርጊቶች በአማርኛ ቀጣይ ግሳዊ ቅርጽ ተያይዘዋል።
