id: MAT.4.1
reference: Matthew 4:1
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Τότε ὁ Ἰησοῦς ἀνήχθη εἰς τὴν ἔρημον ὑπὸ τοῦ πνεύματος, πειρασθῆναι ὑπὸ τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/001.yaml
  text: Then Jesus was led up into the wilderness by the Spirit to be tempted by the devil[a].
translation:
  language: am
  text: ከዚያም ኢየሱስ በዲያብሎስ እንዲፈተን[a] በመንፈስ ወደ ምድረ በዳ ተመራ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እንዲፈተሽ” ወይም “እንዲሞከር”፤ የግሪኩ ግስ በክፉ መፈተንንም ሆነ መፈተሽን ሊያመለክት ይችላል። እዚህ የቅርቡ አውድ በክፉ የመፈተንን ሐሳብ ያጎላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: ከዚያም
  rationale: በትረካው ውስጥ ቀጣዩን ክስተት የሚያስተዋውቅ የጊዜ ተያያዥ ቃል ነው፤ ‘ከዚያም’ በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: ἀνήχθη
  choice: ተመራ
  rationale: የግሱን ተደራጊ ቅርጽ እና መንፈስ መሪ መሆኑን በተፈጥሯዊ አማርኛ ያሳያል። የ‘ወደ ላይ’ አቅጣጫዊ ጥላ በአማርኛ በቀጥታ ቢጨመር የማይቀላጠፍ ስለሆነ አልተጫነም።
- source_word: εἰς τὴν ἔρημον
  choice: ወደ ምድረ በዳ
  rationale: ἔρημος በረሃን፣ ምድረ በዳን ወይም ሰው የማይኖርበትን ስፍራ ሊያመለክት ይችላል፤ ‘ምድረ በዳ’ የመሬቱን ዓይነት ከልክ በላይ ሳይወስን የተለመደና ግልጽ ነው።
- source_word: ὑπὸ τοῦ πνεύματος
  choice: በመንፈስ
  rationale: ከጥምቀቱ ትረካ ጋር ባለው ቅርብ አውድ ‘መንፈስ’ የእግዚአብሔርን መንፈስ ያመለክታል፤ ግሪኩ ያልጨመረውን ‘ቅዱስ’ ሳይጨምር ቃሉን ይጠብቃል።
- source_word: πειρασθῆναι
  choice: እንዲፈተን
  rationale: ‘መፈተን’ በአማርኛ የፈተናንና የክፉ ማባበያን ጥላዎች ሊሸከም ይችላል፤ የዲያብሎስ ወኪልነት ክፉ ማባበያውን በአውዱ ያጎላል። ሌላው ትርጉም በማስታወሻ ተጠብቋል።
- source_word: ὑπὸ τοῦ διαβόλου
  choice: በዲያብሎስ
  rationale: διάβολος በዚህ አውድ የግል ባላጋራው የታወቀ ስያሜ ነው፤ ‘ዲያብሎስ’ በአማርኛ ግልጽና የተለመደ ነው።
theological_decisions:
- issue: የτοῦ πνεύματος ማንነት
  choice: ‘መንፈስ’ የእግዚአብሔርን መንፈስ ያመለክታል
  alternative: አንድ መንፈስ ወይም የሰው መንፈስ
  rationale: በቀደመው የጥምቀት ትረካ መንፈስ በኢየሱስ ላይ መውረዱ ስለተገለጸ፣ ቅርብ የሥነ ጽሑፍ አውዱ ይህን ንባብ ይደግፋል። ሆኖም ግሪኩን በመከተል ‘ቅዱስ’ አልተጨመረም።
- issue: የπειρασθῆναι ትርጉም
  choice: እንዲፈተን—በአውዱ የክፉ ማባበያ ጎልቶ ይታያል
  alternative: እንዲፈተሽ / እንዲሞከር
  rationale: የግሪኩ ግስ ሁለቱንም የመፈተሽና የክፉ ማባበያ ሐሳቦች ሊያመለክት ይችላል። ዲያብሎስ ወኪሉ መሆኑ የክፉ ማባበያውን ሐሳብ ያጎላል፤ ሰፊው የቃሉ ክልል ግን በማስታወሻው ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ቃል ቅደም ተከተል ከመቅዳት ይልቅ ተፈጥሯዊው የአማርኛ አወቃቀር ተከትሏል፤ የመፈተንና የመፈተሽ ትርጉማዊ ውጥረት አልተደበቀም።
