base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/022.yaml
  text: And they immediately left the boat and their father and followed him[a].
translation:
  language: am
  text: እነርሱም ወዲያው ጀልባውንና አባታቸውን ትተው ተከተሉት።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ወዲያውኑ።»
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: እነርሱም
  rationale: በፊት የተጠቀሱትን ሁለት ወንድማማቾች በግልጽ ያመለክታል፤ δέ ደግሞ ትረካውን በለስላሳ ሁኔታ የሚያስቀጥል በመሆኑ በ«-ም» ተገልጧል።
- source_word: εὐθέως
  choice: ወዲያው
  rationale: የምላሹን ፈጣንነትና አስቸኳይነት በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: ἀφέντες
  choice: ትተው
  rationale: ከዋናው ግስ በፊት የተፈጸመውን ተግባር ይጠብቃል፤ ከግሪኩ በላይ የሆነ ዘላቂ መተውን አያስገባም።
- source_word: τὸ πλοῖον
  choice: ጀልባውን
  rationale: በዚህ የዓሣ ማጥመድ ዐውድ πλοῖον የሚያመለክተውን መጠነኛ የውኃ መጓጓዣ በተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: τὸν πατέρα αὐτῶν
  choice: አባታቸውን
  rationale: የቤተሰብ ግንኙነቱንና የምላሻቸውን ክብደት በቀጥታ ይጠብቃል።
- source_word: ἠκολούθησαν αὐτῷ
  choice: እርሱን ተከተሉት
  rationale: የአካላዊ መከተልንም ሆነ በወንጌላት ውስጥ ያለውን የደቀ መዝሙርነት ፍንጭ ይጠብቃል፤ ግልጽ ተሳቢው «እርሱን» ኢየሱስን ያመለክታል።
theological_decisions:
- issue: የደቀ መዝሙርነት ምላሽና ከቤተሰብ መለየት
  choice: ጥቅሱ ጀልባውንና አባታቸውን ትተው ኢየሱስን ወዲያው እንደተከተሉ በቀጥታ ተተርጉሟል።
  alternative: አባታቸውን ለዘላለም እንደተዉት ወይም ለጊዜው ብቻ እንደራቁ መተርጎም።
  rationale: ἀφέντες የወሳኙንና ፈጣኑን ምላሽ ያሳያል፤ ሆኖም መለየቱ ዘላቂ ወይም ጊዜያዊ መሆኑን ቃሉ ብቻውን አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ወዲያው» የማቴዎስን የፈጣን ምላሽ አጽንዖት ይጠብቃል፤ «ትተው» ደግሞ ከግሪኩ በላይ የሆነ ትርጓሜ አይጭንም።
