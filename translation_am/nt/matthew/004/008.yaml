lexical_decisions:
- source_word: Πάλιν
  choice: እንደገናም
  rationale: በፈተናው ቅደም ተከተል ድርጊቱ መደገሙን በተፈጥሯዊ አማርኛ ያመለክታል።
- source_word: παραλαμβάνει
  choice: ወሰደው
  rationale: በትረካው ያለውን የቦታ ለውጥ በግልጽና ተፈጥሯዊ አማርኛ ያቀርባል፤ የግሪኩን ታሪካዊ የአሁን ጊዜ በአማርኛ ተራ ትረካዊ ኃላፊ ጊዜ መተርጎም ተፈጥሯዊ ነው።
- source_word: ὁ διάβολος
  choice: ዲያብሎስ
  rationale: በዘመናዊ የአማርኛ መጽሐፍ ቅዱስ ቋንቋ የታወቀውን ማዕረግ ይጠብቃል።
- source_word: εἰς ὄρος ὑψηλὸν λίαν
  choice: እጅግ ከፍ ወዳለ ተራራ
  rationale: εἰς የሚያመለክተውን እንቅስቃሴና λίαν የሚሰጠውን ጠንካራ ማጉላት ይጠብቃል።
- source_word: δείκνυσιν
  choice: አሳየው
  rationale: ምንም ተጨማሪ ትርጓሜ ሳይጫን የማሳየትን ድርጊት ቀጥታ ይገልጻል።
- source_word: πάσας τὰς βασιλείας
  choice: መንግሥታት ሁሉ
  rationale: የብዙ ቁጥርንና የπάσαςን ሁሉን አቀፍነት ይጠብቃል፤ መንግሥታትም የፖለቲካዊና ንጉሣዊ ሥልጣን ሐሳብን ያስተላልፋል።
- source_word: τοῦ κόσμου
  choice: የዓለምን
  rationale: κόσμος በዚህ አውድ የዓለምን አጠቃላይ ሥርዓትና ወሰን ስለሚያመለክት ይህ ግልጽና ተፈጥሯዊ ምርጫ ነው።
- source_word: τὴν δόξαν αὐτῶν
  choice: ክብራቸውን
  rationale: የδόξαን ዋና የቃል ግንኙነት ይጠብቃል፤ በአውዱ ያለውን ግርማ ወይም ድምቀት እንደ አማራጭ በማስታወሻ ያቀርባል።
theological_decisions:
- issue: በፈተናው ትረካ የተራራው ትዕይንት ባሕርይ
  choice: ትረካው እንደሚናገረው ዲያብሎስ ኢየሱስን ወደ እጅግ ከፍ ያለ ተራራ ወስዶ መንግሥታቱን እንዳሳየው ቀጥታ መተርጎም
  alternative: ይህን ትዕይንት ከተራራው በአካል የታየ የመሬት እይታ ወይም ራእያዊና ከተፈጥሮ በላይ የሆነ መገለጥ ብሎ መወሰን
  rationale: የግሪኩ ጽሑፍ የማሳየቱን ዘዴ አይገልጽም፤ ስለዚህ ትርጉሙ ጽሑፉ ያልወሰነውን ሳይወስን አሻሚነቱን ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ታሪካዊ የአሁን ጊዜ በተፈጥሯዊ የአማርኛ ትረካ ኃላፊ ጊዜ ቀርቧል፤ የዓለምንም የሚለው ቅድመ ቅጥያ ከመንግሥታት ጋር በመያያዝ የግሪኩን የባለቤትነት ግንኙነት በተፈጥሯዊ ሥርዓተ ቃል ያሳያል።
