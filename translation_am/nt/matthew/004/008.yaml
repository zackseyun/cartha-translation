  text: Again[a], the devil takes him to a very high mountain and shows him all the kingdoms of the world and their glory.
translation:
  language: am
  text: እንደገናም ዲያብሎስ ወደ እጅግ ከፍ ወዳለ ተራራ ወሰደው፤ የዓለምንም መንግሥታት ሁሉና ክብራቸውን[a] አሳየው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ግርማቸውን።”
