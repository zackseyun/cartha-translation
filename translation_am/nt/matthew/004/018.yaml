  terminology: The established biblical forms «ስምዖን», «ጴጥሮስ», and «እንድርያስ» are appropriate. «ዓሣ አጥማጆች» faithfully renders ἁλιεῖς. «መረብ» is a good main-text rendering of ἀμφίβληστρον, with its casting sense retained in the footnote.
