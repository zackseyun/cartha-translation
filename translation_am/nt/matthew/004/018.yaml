- source_word: παρὰ τὴν θάλασσαν
  choice: በ…ባሕር ዳር
  rationale: παρά ከተሳቢ ቅጽ ጋር በዚህ ስፍራ በባሕሩ አጠገብ የሚደረግ እንቅስቃሴን ያመለክታል፤ «በባሕር ዳር» ተፈጥሯዊና ግልጽ ነው።
- source_word: θάλασσαν τῆς Γαλιλαίας
  choice: የገሊላ ባሕር
  rationale: የቦታውን የተለመደ ስያሜ በአማርኛ ያቀርባል፤ θάλασσα በቃል ደረጃ «ባሕር» ነው።
- source_word: εἶδεν
