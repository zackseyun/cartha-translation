  yaml_path: translation/nt/matthew/004/018.yaml
  text: As he was walking beside the Sea of Galilee[a], he saw two brothers, Simon who is called Peter and Andrew his brother, casting a net into the sea, for they were fishermen.
translation:
  language: am
  text: እርሱም በየገሊላ ባሕር ዳር እየተራመደ፣ ሁለት ወንድማማቾችን—ጴጥሮስ የሚባለውን ስምዖንንና ወንድሙን እንድርያስን—መረብ[a] ወደ ባሕሩ ሲጥሉ አየ፤ ዓሣ አጥማጆች ነበሩና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የሚወረወር መረብ»፤ የግሪኩ ቃል ለዓሣ ማጥመድ ወደ ውኃ የሚጣል መረብን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
