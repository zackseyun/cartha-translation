  source_fidelity: The draft accurately represents the participial setting, the two literal brothers and their names, their act of throwing a net into the sea, and the explanatory statement that they were fishermen. The geographical designation is better expressed explicitly as «የገሊላ ባሕር» to avoid treating «ገሊላ» merely as an attributive noun.
