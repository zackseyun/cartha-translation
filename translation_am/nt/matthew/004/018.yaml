- source_word: εἰς τὴν θάλασσαν
  choice: ወደ ባሕሩ
  rationale: εἰς ወደ አንድ ስፍራ የሚደረግን እንቅስቃሴ ያሳያል፤ «ወደ ባሕሩ» ይህን በቀጥታ ይገልጣል።
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: ዓሣ አጥማጆች ነበሩና
