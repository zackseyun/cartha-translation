- source_word: Σίμωνα τὸν λεγόμενον Πέτρον
  choice: ጴጥሮስ የሚባለውን ስምዖንን
  rationale: λεγόμενον የሚለውን አጋዥ ግስ በአማርኛ ተፈጥሯዊ በሆነ አንጻራዊ ሐረግ ያቀርባል፤ ሁለቱም ስሞች በተለመደው መጽሐፍ ቅዱሳዊ የአማርኛ አጻጻፍ ቀርበዋል።
- source_word: Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ
  choice: ወንድሙን እንድርያስን
  rationale: የግሪኩን ገላጭ ሐረግና እንድርያስ ከስምዖን ጋር ያለውን ዝምድና ግልጽ በሆነ የአማርኛ ቅደም ተከተል ያሳያል።
