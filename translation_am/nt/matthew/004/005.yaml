  rationale: πτερύγιον ቃል በቃል ትንሽ ክንፍ ወይም ወጣ ያለ ጠርዝ ሊያመለክት ቢችልም፣ በሕንፃ አውድ ‘ጫፍ’ ሊሆን የሚችለውን ፍቺ በተፈጥሯዊ አማርኛ ይሰጣል፤ አሻሚነቱ በማስታወሻ ተጠብቋል።
- source_word: τοῦ ἱεροῦ
  choice: ቤተ መቅደሱ
  rationale: ἱερόν የውስጠኛውን መቅደስ ብቻ ሳይሆን ሰፊውን የቤተ መቅደስ ግቢና ሕንፃዎች ሊያመለክት ይችላል፤ ‘ቤተ መቅደስ’ በዋናው ጽሑፍ የተለመደና ተነባቢ ነው።
