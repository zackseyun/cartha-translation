- source_word: εἰς τὴν ἁγίαν πόλιν
  choice: ወደ ቅድስቲቱ ከተማ
  rationale: ወደ አንድ ስፍራ የሚደረገውን እንቅስቃሴና በግሪኩ ያለውን የክብር መጠሪያ ይጠብቃል፤ ከተማይቱ ኢየሩሳሌም መሆኗ በማስታወሻ ተገልጧል።
- source_word: ἔστησεν
  choice: አቆመው
  rationale: የግሪኩ ግስ አድራጊ ነው፤ ዲያብሎስ ኢየሱስን በዚያ እንዲቆም ማድረጉን በግልጽ ያሳያል።
- source_word: ἐπὶ τὸ πτερύγιον
