  rationale: ቃሉ ወጣ ያለ ጠርዝን ወይም ከፍተኛ ቦታን ሊያመለክት ስለሚችል ትክክለኛው የሕንፃ ክፍል እርግጠኛ አይደለም። ‘ጫፍ’ ተነባቢና ምክንያታዊ ምርጫ ሲሆን ሌሎቹ አማራጮች አሻሚነቱን ለመጠበቅ በማስታወሻ ቀርበዋል።
