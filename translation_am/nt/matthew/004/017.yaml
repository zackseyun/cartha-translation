id: MAT.4.17
reference: Matthew 4:17
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ἀπὸ τότε ἤρξατο ὁ Ἰησοῦς κηρύσσειν καὶ λέγειν· Μετανοεῖτε, ἤγγικεν γὰρ ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/017.yaml
  text: From that time Jesus began to proclaim[a], saying, “Repent[c][b], for the kingdom of heaven has drawn near.”
translation:
  language: am
  text: ከዚያን ጊዜ ጀምሮ ኢየሱስ፣ “ንስሐ ግቡ፤ የሰማያት መንግሥት ቀርቧልና” እያለ መስበክ ጀመረ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: ከዚያን ጊዜ ጀምሮ
  rationale: የትረካውን አዲስ መዞሪያና ከዚያ በኋላ የቀጠለውን ድርጊት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἤρξατο
  choice: ጀመረ
  rationale: ከተከታዩ ግስ ጋር ተያይዞ የድርጊቱን መጀመር በግልጽ ያሳያል።
- source_word: κηρύσσειν καὶ λέγειν
  choice: እያለ መስበክ
  rationale: መስበኩ ይፋዊ አዋጅን ያመለክታል፤ “እያለ” ደግሞ የአዋጁን ይዘት በተፈጥሯዊ አማርኛ ያስተዋውቃል።
- source_word: Μετανοεῖτε
  choice: ንስሐ ግቡ
  rationale: ትእዛዙ የአስተሳሰብና የሕይወት አቅጣጫ መለወጥን የሚጠይቅ ሲሆን፣ ይህ በዘመናዊ መደበኛ አማርኛ የታወቀና ክብደቱን የሚጠብቅ አገላለጽ ነው።
- source_word: ἤγγικεν
  choice: ቀርቧል
  rationale: የግሪኩን ፍጹም ጊዜ፣ ማለትም መቅረቡ ደርሶ ውጤቱም እንደሚቀጥል፣ በአጭርና ተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: βασιλεία τῶν οὐρανῶν
  choice: የሰማያት መንግሥት
  rationale: የማቴዎስን ልዩ ብዙ ቁጥር አገላለጽ በአማርኛ የተለመደና ግልጽ በሆነ መልኩ ይጠብቃል፤ “መንግሥት” ደግሞ ግዛትንም ሆነ ንጉሣዊ አገዛዝን ሊያመለክት ይችላል።
theological_decisions:
- issue: የβασιλεία τῶν οὐρανῶν ትርጉም
  choice: የሰማያት መንግሥት
  alternative: የሰማይ አገዛዝ
  rationale: የማቴዎስን ባሕርያዊ አገላለጽና የግሪኩን ብዙ ቁጥር ይጠብቃል፤ ሐረጉን በቦታ ወይም በአገዛዝ ትርጉም ብቻ አይገድበውም።
- issue: የΜετανοεῖτε ኃይል
  choice: ንስሐ ግቡ
  alternative: ተመለሱ
  rationale: ትእዛዙን በአእምሮ ለውጥ ብቻ ሳይገድብ፣ ሥነ ምግባራዊና መንፈሳዊ መመለስን ያካትታል፤ የአንድ ወገን የተለየ ዶክትሪን አያስገባም።
- issue: የἤγγικεν የጊዜ ኃይል
  choice: ቀርቧል
  alternative: ቅርብ ነው
  rationale: ፍጹም ጊዜው መቅረቡ እንደደረሰና ያ ሁኔታ እንደቀጠለ የሚያሳየውን ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የግሪኩ ሁለት ግሶች ትርጉም “እያለ መስበክ” በሚል ተፈጥሯዊ አወቃቀር ተወክሏል።
