- source_word: Ὕπαγε
  choice: ከዚህ ሂድ
  rationale: ጠንካራ የማሰናበት ትእዛዝን ግልጽና ዘመናዊ በሆነ አማርኛ ያቀርባል።
- source_word: Σατανᾶ
  choice: ሰይጣን ሆይ
  rationale: የተለመደውን የስም ቅርጽ በቀጥታ የመጥሪያ አነጋገር ያቀርባል።
- source_word: γέγραπται
  choice: ተብሎ ተጽፎአል
  rationale: የቅዱስ መጽሐፍ ጥቅስን የሚያስተዋውቀውን ፍጹም ተገብሮ ቅርጽ ይጠብቃል።
- source_word: Κύριον τὸν θεόν σου
  choice: ለጌታ ለአምላክህ
  rationale: κύριον እና θεόν σου አንድን አካል እንደሚጠቁሙ በተፈጥሯዊ የአማርኛ ድግግሞሽ ያሳያል።
- source_word: προσκυνήσεις
  choice: ስገድ
  rationale: በአምላክ ፊት በአክብሮት መስገድንና እርሱን ማምለክን የሚያካትተውን ትርጉም ይይዛል።
- source_word: αὐτῷ μόνῳ
  choice: እርሱንም ብቻ
  rationale: ‘ብቻ’ የሚለውን አጽንዖት በአምላክ ላይ በግልጽ ሁኔታ ያደርጋል።
- source_word: λατρεύσεις
  choice: አገልግል
  rationale: ከመስገድ የተለየውን ለአምላክ የሚቀርብ አገልግሎት ይጠብቃል።
theological_decisions:
- issue: προσκυνέω እና λατρεύω የተባሉትን ሁለት ግሶች ለይቶ መተርጎም
