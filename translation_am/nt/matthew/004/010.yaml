    issue: Added locative nuance in “ከዚህ ሂድ”
    rationale: Ὕπαγε is an imperative to depart (“Go away/Go”); it does not itself specify “from here.” Removing “ከዚህ” avoids adding detail while preserving the forceful dismissal.
  - severity: medium
    issue: Citation formula is awkwardly ordered
    rationale: “ምክንያቱም፣ ‘…’ ተብሎ ተጽፎአል” is understandable, but “እንዲህ ተጽፎአል፤ ‘…’” is more natural Amharic and clearly introduces the quotation as Scripture.
