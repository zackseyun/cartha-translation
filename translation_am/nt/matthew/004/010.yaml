  yaml_path: translation/nt/matthew/004/010.yaml
  text: 'Then Jesus says to him, “Go away, Satan! For it is written: ‘You shall worship the Lord your God, and serve him only.’”'
translation:
  language: am
  text: በዚያን ጊዜ ኢየሱስ፣ “ሰይጣን ሆይ፣ ሂድ! እንዲህ ተጽፎአል፤ ‘ለጌታ አምላክህ ስገድ[a]፤ እርሱንም ብቻ አገልግል[b]’” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለጌታ አምላክህ በአክብሮት ተጎንበስ።” የግሪኩ ግስ በአክብሮት መስገድን ወይም መደፋትን በቀጥታ ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “አገልግል” ተብሎ የተተረጎመው ግስ በተለይ ለአምላክ የሚቀርብን ቅዱስ ወይም ሃይማኖታዊ አገልግሎት ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: በዚያን ጊዜ
  rationale: የትረካውን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያመለክታል።
- source_word: λέγει αὐτῷ
  choice: አለው
