  verdict: revise
  source_fidelity: The draft accurately conveys the narrative sequence, Jesus’ direct dismissal of Satan, the scriptural citation formula, and the distinction between προσκυνήσεις (“worship/bow in reverence”) and λατρεύσεις (“serve”). However, “ከዚህ ሂድ” introduces a locative element (“from here”) not explicit in Ὕπαγε; a plain dismissal is closer to the source.
  naturalness: 'The proposed revision uses a more idiomatic Amharic Scripture-citation introduction: “እንዲህ ተጽፎአል፤ …” This also avoids the less natural placement of “ምክንያቱም” before a quotation followed by “ተብሎ ተጽፎአል.”'
  terminology: “ሰይጣን ሆይ,” “ስገድ,” and “አገልግል” are suitable modern standard Amharic choices. Rendering the two Greek verbs distinctly is important and is retained. “ለጌታ አምላክህ” naturally represents the appositional phrase “the Lord your God.”
  issues:
