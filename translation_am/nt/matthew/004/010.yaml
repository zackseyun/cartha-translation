  alternative: ሁለቱንም በ‘ማምለክ’ ቃል መግለጽ
  rationale: የግሪኩ ጽሑፍ ተዛማጅ ሆነው ግን የተለያዩ ሁለት ግሶችን ይጠቀማል። ልዩነታቸውን መጠበቅ ለአምላክ ብቻ የሚገባውን መስገድና አገልግሎት ሳያደበዝዝ ያቀርባል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የቅዱስ መጽሐፍ ጥቅሱ የትእዛዝ ኃይሉን እንዲጠብቅ ነጠላ የትእዛዝ ቅርጽ ተመርጧል።
