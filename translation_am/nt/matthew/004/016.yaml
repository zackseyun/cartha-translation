  choice: የተቀመጠው / ለተቀመጡት
  rationale: “መቀመጥ” የሚለውን ቀጥተኛ ምስልና በሁለቱ ሐረጎች ያለውን ትይዩነት ይጠብቃል።
- source_word: σκοτίᾳ
  choice: ጨለማ
  rationale: ቃሉን በቀጥታ የሚተረጉም ሲሆን ምስሉን ሥነ ምግባራዊ፣ መንፈሳዊ ወይም ፖለቲካዊ ትርጉም ብቻ እንዳይይዝ ክፍት ያደርገዋል።
- source_word: φῶς εἶδεν μέγα
  choice: ታላቅ ብርሃን አየ
  rationale: የግሪኩን የቃላት አወቃቀርና ቀላል ያለፈ ጊዜ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: χώρᾳ
  choice: ምድር
  rationale: እዚህ ያለውን ስፍራዊ ትርጉም የሚያስተላልፍና “የሞት ምድር” በሚለው ትንቢታዊ ምስል ውስጥ ተፈጥሯዊ የሆነ ምርጫ ነው።
