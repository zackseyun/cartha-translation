base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/016.yaml
  text: The people sitting in darkness saw a great light[a], and on those sitting in the region and shadow of death, a light dawned.
translation:
  language: am
  text: በጨለማ የተቀመጠው ሕዝብ ታላቅ ብርሃን አየ፤ በሞት ምድርና በሞት ጥላ ውስጥ ለተቀመጡትም ብርሃን ወጣላቸው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ጥቅጥቅ ያለ ጨለማ።” “የሞት ጥላ” የሚለው ምስል ግሪኩ “ሞት” የሚለውን ቃል በግልጽ ስለያዘ በዋናው ጽሑፍ ተጠብቋል።
    reason: lexical_alternative
lexical_decisions:
- source_word: λαὸς
  choice: ሕዝብ
  rationale: የሰዎችን ስብስብ በተፈጥሯዊና በመጽሐፍ ቅዱሳዊ አገላለጽ ይገልጣል፤ ዘመናዊ ፖለቲካዊ አገርን አያመለክትም።
