- source_word: αὐτοῖς
  choice: ለተቀመጡትም … ወጣላቸው
  rationale: የተቀባዮቹን ዳቲቭ በ“-ላቸው” ይወክላል፤ ሐረጉም በአማርኛ ግልጽ ነው።
