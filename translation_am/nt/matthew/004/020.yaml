  yaml_path: translation/nt/matthew/004/020.yaml
  text: And they immediately left the nets and followed him.
translation:
  language: am
  text: እነርሱም ወዲያው መረቦቹን ትተው ተከተሉት።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: -ም
  rationale: δέ በዚህ ስፍራ ትረካውን የሚያስቀጥል ቀላል አያያዥ ነው፤ ከ«እነርሱ» ጋር የተያያዘው «-ም» ተቃርኖን ሳያጎላ በተፈጥሯዊ አማርኛ ይህንን ተግባር ያስተላልፋል።
- source_word: εὐθέως
  choice: ወዲያው
  rationale: የምላሻቸውን ፈጣንነትና ያለ መዘግየት መሆኑን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: ἀφέντες
  choice: ትተው
  rationale: የቀደመውን ድርጊት የሚያሳየውን የግሪኩን አንቀጸ ግስ በተፈጥሯዊ የአማርኛ አያያዝ ያቀርባል፤ «ጥለው» የሚለው ከአውዱ በላይ የመተው ኃይል ሊጨምር ይችላል።
- source_word: τὰ δίκτυα
  choice: መረቦቹን
  rationale: የግሪኩን የተወሰነ አመልካች ይጠብቃል፤ በአውዱ የዓሣ ማጥመጃ መረቦች መሆናቸው ግልጽ ስለሆነ «የዓሣ ማጥመጃ» ወይም «የእነርሱ» የሚል ጭማሪ አያስፈልግም።
- source_word: ἠκολούθησαν αὐτῷ
  choice: ተከተሉት
  rationale: አካላዊ መከተልንም ሆነ በወንጌሉ አውድ የደቀ መዝሙርነት ትርጉምን ሊሸከም የሚችል አጭርና ተፈጥሯዊ አተረጓጎም ነው።
theological_decisions:
- issue: በἠκολούθησαν αὐτῷ ውስጥ ያለው የደቀ መዝሙርነት ፍንጭ
  choice: ተከተሉት
  alternative: ከእርሱ በኋላ ሄዱ
  rationale: «ተከተሉት» በትረካው ያለውን አካላዊ መከተልና እየተገለጠ የሚመጣውን የደቀ መዝሙርነት ትርጉም ሁለቱንም ሳይለያይ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። የአማርኛው የተከታታይ ግስ አወቃቀር «ትተው ተከተሉት» የመረቦቹን መተው ከመከተላቸው እንደቀደመ በተፈጥሯዊ ሁኔታ ያሳያል።
