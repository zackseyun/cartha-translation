  text: καὶ προσελθὼν ⸂ὁ πειράζων εἶπεν αὐτῷ⸃· Εἰ υἱὸς εἶ τοῦ θεοῦ, εἰπὲ ἵνα οἱ λίθοι οὗτοι ἄρτοι γένωνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/003.yaml
  text: And the tempter came and said to him[a], “If you are the Son of God[b], tell these stones to become bread.”
translation:
  language: am
  text: ፈታኙም ወደ እርሱ ቀርቦ፣ “የእግዚአብሔር ልጅ ከሆንህ፣[a] እነዚህ ድንጋዮች ዳቦዎች[b] እንዲሆኑ ተናገር” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ከሆንህ” የሚለው “ስለሆንህ” ተብሎም ሊገባ ይችላል፤ የግሪኩ ቅድመ ሁኔታ ተራ ጥርጣሬን ከመግለጽ ይልቅ ፈታኝ ጥያቄ ሊሆን ይችላል።
    reason: alternative_reading
  - marker: b
    text: የግሪኩ ቃል በብዙ ቁጥር “ዳቦዎች” ማለት ነው፤ በአማርኛ “ዳቦ” ተብሎ በነጠላ ቁጥርም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: ወደ እርሱ ቀርቦ
  rationale: የመቅረብን እንቅስቃሴ በተፈጥሯዊ አማርኛ ያሳያል፤ የግሪኩ የቀደመ ግስ ዋናውን ‘አለው’ ያጅባል።
- source_word: ὁ πειράζων
  choice: ፈታኙ
  rationale: በዐውደ ንባቡ ኢየሱስን የሚፈትነውን እንደ ማዕረግ የሚጠቁም ተፈጥሯዊና የተለመደ አገላለጽ ነው።
- source_word: Εἰ
  choice: ከሆንህ
  rationale: የግሪኩን ቅድመ ሁኔታ ቅርጽ ይጠብቃል፤ ንግግሩ ጥርጣሬ፣ ፈተና ወይም የተመሠረተ ፈታኝ ጥያቄ መሆኑን አይወስንም።
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: የእግዚአብሔር ልጅ
  rationale: በማቴዎስ ዐውደ ንባብ ውስጥ ልዩ መለያ የሆነውን ክርስቶሳዊ ማዕረግ ያስተላልፋል።
- source_word: εἰπὲ ἵνα
  choice: እንዲሆኑ ተናገር
  rationale: የ‘ተናገር’ን ቀጥተኛ የቃል ትርጉምና የἵναን የታሰበ ውጤት በተፈጥሯዊ የአማርኛ አገባብ ያሳያል፤ ‘እዘዝ’ የሚለውን ከጽሑፉ የበለጠ ጠንካራ ትርጉም አያስገባም።
- source_word: οἱ λίθοι οὗτοι
  choice: እነዚህ ድንጋዮች
  rationale: ስምና አመልካቹን በቀጥታ እና በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἄρτοι
  choice: እንጀራዎች
  rationale: የግሪኩን ብዙ ቁጥር በዋናው ጽሑፍ ይጠብቃል፤ አማርኛው ‘እንጀራ’ በሰፊው የሚበላ እንጀራን/ዳቦን ሊወክል ይችላል።
- source_word: γένωνται
  choice: እንዲሆኑ
  rationale: የγίνομαιን ‘መሆን/መለወጥ’ ሐሳብ ያለ ተጨማሪ ትርጓሜ ይገልጻል።
theological_decisions:
- issue: የΕἰ υἱὸς εἶ τοῦ θεοῦ ቅድመ ሁኔታዊ ንግግር ኃይል
  choice: “የእግዚአብሔር ልጅ ከሆንህ” ተብሎ የቅድመ ሁኔታው ቅርጽ ተጠብቋል።
  alternative: “የእግዚአብሔር ልጅ ስለሆንህ” ወይም “በእርግጥ የእግዚአብሔር ልጅ ከሆንህ”
  rationale: ግሪኩ እንደ ፈታኝ ጥያቄ ሊሠራ ስለሚችል፣ ትርጉሙ የተናጋሪውን ጥርጣሬ ወይም እርግጠኝነት በዝምታ አይወስንም።
- issue: υἱὸς τοῦ θεοῦ የሚለው ክርስቶሳዊ ማዕረግ
  choice: “የእግዚአብሔር ልጅ”
  alternative: “አንድ የእግዚአብሔር ልጅ”
  rationale: በማቴዎስ ዐውደ ንባብና በግሪክ ሰዋሰው ይህ ኢየሱስን በልዩ ሁኔታ የሚለይ ማዕረግ እንጂ የአንድ ክፍል አባልነት አይደለም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ብዙ ቁጥር በ‘እንጀራዎች’ ተጠብቋል፤ ሁለቱም የግርጌ ማስታወሻ ምልክቶች [a] እና [b] በዋናው ጽሑፍ ተካትተዋል።
