base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/015.yaml
  text: Land of Zebulun and land of Naphtali[a], the way of the sea, beyond the Jordan, Galilee of the Gentiles—
translation:
  language: am
  text: የዛብሎን ምድርና የንፍታሌም ምድር፣ የባሕር መንገድ፣ ከዮርዳኖስ ማዶ፣ የአሕዛብ[a] ገሊላ—
  philosophy: optimal-equivalence
  footnotes:
