lexical_decisions:
- source_word: Γῆ … γῆ
  choice: የ… ምድር … የ… ምድር
  rationale: በጥቅሱ ውስጥ የአካባቢ ስያሜ ስለሆነ «ምድር» ተመርጧል፤ የግሪኩን ድግግሞሽና ትይዩ አወቃቀርም ይጠብቃል።
- source_word: Ζαβουλὼν
  choice: ዛብሎን
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የነገድና የአካባቢ ስም ቅርጽ ይከተላል።
- source_word: Νεφθαλίμ
  choice: ንፍታሌም
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የታወቀው የነገድና የአካባቢ ስም ቅርጽ ነው።
- source_word: ὁδὸν θαλάσσης
  choice: የባሕር መንገድ
  rationale: የኢሳይያስን ጥቅስ መደበኛ አገላለጽ ይጠብቃል፤ የታወቀ መስመርን ወይም ከባሕር ጋር የተያያዘ አካባቢን ሊያመለክት የሚችለውን አሻሚነት አይዘጋም።
- source_word: πέραν τοῦ Ἰορδάνου
  choice: ከዮርዳኖስ ማዶ
  rationale: የግሪኩን የቦታ አገላለጽ በተፈጥሯዊ አማርኛ ያቀርባል፤ የተመልካቹን አቅጣጫ ከሚገባው በላይ አይወስንም።
- source_word: Γαλιλαία
  choice: ገሊላ
  rationale: በአማርኛ የተለመደው የክልሉ ስም ነው።
- source_word: τῶν ἐθνῶν
  choice: የአሕዛብ
  rationale: በማቴዎስ የአይሁድ ዐውድ ውስጥ አይሁድ ያልሆኑትን ሕዝቦች የሚያመለክተውን ዘርፈ ሃይማኖታዊ ንጽጽር በአጭርና በተለመደ መጽሐፍ ቅዱሳዊ ቃል ያስተላልፋል።
theological_decisions:
- issue: በኢሳይያስ ጥቅስ ውስጥ የἐθνῶν አተረጓጎም
  choice: የአሕዛብ
  alternative: የብሔራት
  rationale: «አሕዛብ» በዚህ የአይሁድ ዐውድ አይሁድ ያልሆኑትን ሕዝቦች በግልጽ ያመለክታል። ሆኖም ἐθνῶν «ብሔራት» ተብሎም ሊተረጎም ስለሚችል ይህ አማራጭ በግርጌ ማስታወሻ ተጠብቋል።
