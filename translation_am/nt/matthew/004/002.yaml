  yaml_path: translation/nt/matthew/004/002.yaml
  text: And after fasting forty days and forty nights[a], he was hungry.
translation:
  language: am
  text: አርባ ቀንና አርባ ሌሊት ከጾመ በኋላ፣ ተራበ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «አርባ ቀንና አርባ ሌሊት ጾሞ፣ በኋላ ተራበ።»
    reason: lexical_alternative
lexical_decisions:
- source_word: νηστεύσας
  choice: ከጾመ በኋላ
  rationale: የግሪኩ የአኦሪስት ቦዝ አንቀጽ ከዋናው ግስ በፊት የተፈጸመውን ድርጊት ያሳያል፤ «ከጾመ በኋላ» ይህን የጊዜ ቅደም ተከተል በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἡμέρας τεσσεράκοντα καὶ νύκτας τεσσεράκοντα
  choice: አርባ ቀንና አርባ ሌሊት
  rationale: በግሪክ የጊዜ ቆይታን የሚገልጥ አኩዛቲቭ ነው፤ በአማርኛ ይህ ቆይታ ያለ ተጨማሪ መስተዋድድ በግልጽ ይሰማል።
- source_word: ὕστερον
  choice: በኋላ
  rationale: ጾሙንና ረሃቡን በጊዜ ቅደም ተከተል ያገናኛል። ከቦዝ አንቀጹ ጋር «ከ...በኋላ» ተብሎ መተርጎሙ ተፈጥሯዊ ሲሆን የምንጩን ድግግሞሽ በአንድ የአማርኛ የጊዜ አገላለጽ ያቀርባል።
- source_word: ἐπείνασεν
  choice: ተራበ
  rationale: ድርጊቱን ወይም የረሃብ ሁኔታ መጀመርን በአጭርና ተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: καὶ
  choice: በአማርኛው የዓረፍተ ነገር ፍሰት በቀጥታ አልተገለጸም
  rationale: καί ቀላል የትረካ ማያያዣ ነው፤ ጥቅሱ ብቻውን ሲቀርብ «እና» ብሎ መጀመር በዘመናዊ አማርኛ የተፈጥሮ ፍሰትን ያደክማል። በዐውዱ ያለው ቀጣይነት ግን አልተለወጠም።
theological_decisions:
- issue: ከጾሙ በኋላ የኢየሱስ እውነተኛ ሰብአዊ ረሃብ
  choice: ተራበ
  alternative: ረሃብ ተሰማው
  rationale: «ተራበ» የምንጩን ቀጥተኛ ትርጉም ያለ ዶክትሪናዊ ማብራሪያ ይጠብቃል፤ እውነተኛውን ሰብአዊ ፍላጎትም በግልጽ ያሳያል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ቀላል የሆነ አማርኛ። «ጾመ» የመጽሐፍ ቅዱስ ዐውድ ያለው ቢሆንም በዘመናዊ አማርኛም የተለመደና ግልጽ ነው።
