id: MAT.4.21
reference: Matthew 4:21
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Καὶ προβὰς ἐκεῖθεν εἶδεν ἄλλους δύο ἀδελφούς, Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, ἐν τῷ πλοίῳ μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν καταρτίζοντας τὰ δίκτυα αὐτῶν, καὶ ἐκάλεσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/021.yaml
  text: And going on from there, he saw two other brothers, James the son of Zebedee and John his brother, in the boat with Zebedee their father, mending their nets, and he called them.
translation:
  language: am
  text: ከዚያም አልፎ ሲሄድ፣ ሌሎች ሁለት ወንድማማቾችን፣ የዘብዴዎስን ልጅ ያዕቆብንና ወንድሙን ዮሐንስን፣ ከአባታቸው ከዘብዴዎስ ጋር በጀልባ ውስጥ መረቦቻቸውን ሲጠግኑ አየ፤ ጠራቸውም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προβὰς ἐκεῖθεν
  choice: ከዚያም አልፎ ሲሄድ
  rationale: የቦታ መነሻውንና ከቀደመው ስፍራ ወደ ፊት መጓዙን በተፈጥሯዊ የአማርኛ አነጋገር ያሳያል።
- source_word: ἄλλους δύο ἀδελφούς
  choice: ሌሎች ሁለት ወንድማማቾችን
  rationale: ἄλλους ከቀድሞ ከተጠቀሱት በተጨማሪ መሆናቸውን ያሳያል፤ ἀδελφούς በዚህ አውድ የሥጋ ወንድሞችን ያመለክታል።
- source_word: Ἰάκωβον τὸν τοῦ Ζεβεδαίου
  choice: የዘብዴዎስን ልጅ ያዕቆብን
  rationale: የግሪኩ የዘር ሐረግ መግለጫ በአማርኛ ግልጽ እንዲሆን ‘ልጅ’ ተጨምሮ ተተርጉሟል፤ ስሞቹም በአማርኛ የተለመዱትን ቅርጾች ይከተላሉ።
- source_word: Ἰωάννην τὸν ἀδελφὸν αὐτοῦ
  choice: ወንድሙን ዮሐንስን
  rationale: αὐτοῦ ወደ ያዕቆብ እንደሚመለስ በአማርኛ ተፈጥሯዊና አጭር በሆነ አገላለጽ ይገልጣል።
- source_word: ἐν τῷ πλοίῳ
  choice: በጀልባ ውስጥ
  rationale: πλοῖον በዚህ የዓሣ ማጥመድ አውድ ትልቅ መርከብን ሳይሆን ጀልባን ያመለክታል።
- source_word: καταρτίζοντας τὰ δίκτυα αὐτῶν
  choice: መረቦቻቸውን ሲጠግኑ
  rationale: καταρτίζω መረቦቹን ለአገልግሎት ብቁ ለማድረግ ማስተካከልን ወይም መጠገንን ያመለክታል፤ ‘ሲጠግኑ’ በዚህ አውድ ግልጽና የተለመደ ነው።
- source_word: ἐκάλεσεν αὐτούς
  choice: ጠራቸው
  rationale: የግሪኩን ቀላል አገላለጽ ይጠብቃል፤ የጥሪው ዓላማ ከአውዱ እንዲታወቅ ያደርጋል እንጂ በጥቅሱ የሌለውን ማብራሪያ አይጨምርም።
theological_decisions:
- issue: ἐκάλεσεν የደቀ መዝሙርነት ጥሪን ማመልከቱ
  choice: ‘ጠራቸው’ የሚለውን ቀላል አገላለጽ ማቆየት
  alternative: ‘እንዲከተሉት ጠራቸው’
  rationale: ቅርብ አውዱ ጥሪው የደቀ መዝሙርነት ጥሪ መሆኑን ያሳያል፤ ይሁን እንጂ ይህ ጥቅስ ራሱ የሚለው ‘ጠራቸው’ ብቻ ስለሆነ ትርጉሙ ከምንጩ በላይ አልተስፋፋም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛን ይጠቀማል። ረጅሙ የግሪክ ዓረፍተ ነገር ለአማርኛ ንባብ ግልጽነት በሁለት ዓረፍተ ነገሮች ተከፍሏል፤ የክስተቶቹ ቅደም ተከተልና ትስስር ግን ተጠብቋል።
