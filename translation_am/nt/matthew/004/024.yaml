source:
  edition: SBLGNT
  text: καὶ ἀπῆλθεν ἡ ἀκοὴ αὐτοῦ εἰς ὅλην τὴν Συρίαν· καὶ προσήνεγκαν αὐτῷ πάντας τοὺς κακῶς ἔχοντας ποικίλαις νόσοις καὶ βασάνοις ⸀συνεχομένους, δαιμονιζομένους καὶ σεληνιαζομένους καὶ παραλυτικούς, καὶ ἐθεράπευσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/024.yaml
  text: And the report about him went out into all Syria[a], and they brought to him all who were sick, afflicted with various diseases and torments, those oppressed by demons, those having seizures, and paralytics[c][b], and he healed them.
translation:
  language: am
  text: 'ማቴዎስ 4፥24


    ስለ እርሱም የተሰማው ዜና በመላው ሶርያ ተስፋፋ። በተለያዩ በሽታዎችና ስቃዮች የተያዙትን ሕሙማን ሁሉ፣ በአጋንንት የተጨነቁትን[a]፣ የሚጥል በሽታ ያለባቸውን[b] እና ሽባዎችን ወደ እርሱ አመጡ፤ እርሱም ፈወሳቸው።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «አጋንንት የያዟቸውን» ወይም «በአጋንንት ተጽእኖ ሥር የነበሩትን»።
    reason: lexical_alternative
  - marker: b
    text: የግሪኩ ቃል σεληνιαζομένους በቃል በቃል «በጨረቃ የተጠቁትን» የሚል ሲሆን፣ በተለምዶ «የሚጥል በሽተኞችን» ተብሎ ይተረጎማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκοὴ
  choice: የተሰማው ወሬ
  rationale: ቃሉ በዚህ አውድ ስለ ኢየሱስ የተሰራጨውን ዜና ወይም ወሬ ያመለክታል፤ የመስማት ችሎታን አያመለክትም።
- source_word: ἀπῆλθεν
  choice: ተስፋፋ
  rationale: የግሪኩን የመውጣት እንቅስቃሴ በዘመናዊ አማርኛ ስለ ወሬ በተፈጥሮ የሚነገረውን አገላለጽ ያስተላልፋል።
- source_word: Συρίαν
  choice: ሶርያ
  rationale: የክልሉ ስም በአማርኛ የተለመደ አጻጻፍ ነው።
- source_word: κακῶς ἔχοντας
  choice: ሕሙማን
  rationale: ይህ ፈሊጣዊ አገላለጽ በመጥፎ የጤና ሁኔታ ያሉትን ወይም የታመሙትን ያመለክታል።
- source_word: ποικίλαις νόσοις καὶ βασάνοις συνεχομένους
  choice: በተለያዩ በሽታዎችና ስቃዮች የተያዙትን
  rationale: ποικίλαις የዓይነት ብዛትን፣ νόσοις በሽታዎችን፣ βασάνοις ከባድ ሥቃይን፣ συνεχομένους ደግሞ በእነዚህ ተይዞ መጎሳቆልን ያሳያል።
- source_word: δαιμονιζομένους
  choice: በአጋንንት የተጨነቁትን
  rationale: የአጋንንትን እውነተኛ ተጽዕኖ ይጠብቃል፤ ነገር ግን የግሪኩ ቃል ከሚፈቅደው ይበልጥ ጠባብ የቴክኒክ ፍቺ አይጭንም።
- source_word: σεληνιαζομένους
  choice: የሚጥል በሽታ ያለባቸውን
  rationale: ለዘመናዊ አንባቢ የተጠቀሰውን የመንቀጥቀጥና የመውደቅ ሕመም በግልጽ ያስተላልፋል፤ ከጨረቃ ጋር ያለው የቃሉ ቀጥተኛ ግንኙነት በማስታወሻ ተጠብቋል።
- source_word: παραλυτικούς
  choice: ሽባዎችን
  rationale: ሽባ የሆኑ ሰዎችን በአጭርና በተለመደ አማርኛ ይገልጻል።
- source_word: ἐθεράπευσεν
  choice: ፈወሳቸው
  rationale: θεραπεύω በዚህ አውድ መፈወስን ወይም ማዳንን ያመለክታል።
