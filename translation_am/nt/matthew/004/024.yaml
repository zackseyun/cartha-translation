  rationale: ዋናው ጽሑፍ ለዘመናዊ አንባቢ የሕመሙን መገለጫ ያቀርባል፤ ቀጥተኛውና ታሪካዊው የቃሉ ገጽታ ግን በማስታወሻ ተጠብቋል።
