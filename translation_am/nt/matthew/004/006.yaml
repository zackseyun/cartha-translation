  text: καὶ λέγει αὐτῷ· Εἰ υἱὸς εἶ τοῦ θεοῦ, βάλε σεαυτὸν κάτω· γέγραπται γὰρ ὅτι Τοῖς ἀγγέλοις αὐτοῦ ἐντελεῖται περὶ σοῦ καὶ ἐπὶ χειρῶν ἀροῦσίν σε, μήποτε προσκόψῃς πρὸς λίθον τὸν πόδα σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/006.yaml
  text: 'And he said to him[a], “If you are the Son of God, throw yourself down, for it is written: ‘He will command his angels concerning you,’ and ‘On their hands they will lift you up[b], lest you strike your foot against a stone.’”'
translation:
  language: am
  text: እርሱም፣ “የእግዚአብሔር ልጅ ከሆንህ፣ ራስህን ወደ ታች ጣል[a]፤ ምክንያቱም፣ ‘ስለ አንተ መላእክቱን ያዛል፤’ እንዲሁም፣ ‘በእጆቻቸው ያነሡሃል[b]፣ እግርህን በድንጋይ እንዳትመታ።’ ተብሎ ተጽፏል” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ራስህን ወደ ታች ወርውር።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በእጆቻቸው ይሸከሙሃል።”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: አለው
  rationale: በትረካ ውስጥ ያለውን የግሪክ ታሪካዊ የአሁን ጊዜ በተፈጥሯዊ የአማርኛ ኃላፊ ጊዜ ያቀርባል።
- source_word: Εἰ
  choice: ከሆንህ
  rationale: የፈተናውን ሁኔታዊ ንግግር ያለ ቅድመ ድምዳሜ ይጠብቃል።
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: የእግዚአብሔር ልጅ
  rationale: በማቴዎስ አውድ ውስጥ ያለውን መጠሪያዊ ክርስቶሳዊ ኃይል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: βάλε σεαυτὸν κάτω
  choice: ራስህን ወደ ታች ጣል
  rationale: የትእዛዙን ቀጥተኛነትና የራስ አመልካች ቅርጹን በግልጽ ዘመናዊ አማርኛ ያቀርባል።
- source_word: γέγραπται
  choice: ተብሎ ተጽፏል
  rationale: ለቅዱስ መጽሐፍ ጥቅስ የሚውለውን የተለመደ አገላለጽና የጽሑፉን ቀጣይ ሥልጣን ይጠብቃል።
- source_word: ἐντελεῖται
  choice: ያዛል
  rationale: ለመላእክት የሚሰጠውን ሥልጣናዊ ትእዛዝ በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: περὶ σοῦ
  choice: ስለ አንተ
  rationale: የπερί ከወራሽ ጋር ያለውን ‘concerning you’ ትርጉም በቀጥታ ያቀርባል።
- source_word: ἐπὶ χειρῶν
  choice: በእጆቻቸው
  rationale: መላእክቱ በእጆቻቸው ድጋፍ የሚያነሡትን ምስል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἀροῦσίν σε
  choice: ያነሡሃል
  rationale: የαἴρωን ማንሳት ወይም ደግፎ መያዝ ሐሳብ ግልጽ አድርጎ ያቀርባል።
- source_word: μήποτε προσκόψῃς πρὸς λίθον τὸν πόδα σου
  choice: እግርህ በድንጋይ እንዳይመታ
  rationale: የመከላከል ዓላማውን፣ ነጠላውን ‘እግር’ እና በድንጋይ የመመታትን ምስል ይጠብቃል።
theological_decisions:
- issue: በፈታኙ ንግግር ውስጥ ያለው የ‘እግዚአብሔር ልጅ’ ክርስቶሳዊ ኃይል
  choice: የእግዚአብሔር ልጅ
  alternative: አንድ የእግዚአብሔር ልጅ
  rationale: በማቴዎስ ትረካ ውስጥ ሐረጉ አጠቃላይ ምድብ ሳይሆን የታወቀ መጠሪያ ሆኖ ይሠራል፤ ትርጉሙም ከጽሑፉ በላይ የሆነ ዶክትሪናዊ ማብራሪያ አይጨምርም።
- issue: ዲያብሎስ የመዝሙር 91ን መጥቀሱ
  choice: ጥቅሱን እንደተነገረው ያለ ዋና ጽሑፍ ማብራሪያ ማቅረብ
  alternative: በዋናው ጽሑፍ ውስጥ የትርጓሜ ማስተካከያ መጨመር
  rationale: ክፍሉ ፈታኙ ቅዱስ መጽሐፍን ሲጠቅስ ያቀርበዋል፤ ትርጉሙ ይህን ውጥረት ሳይፈታ ማቆየት አለበት።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የቅዱስ መጽሐፍ ጥቅሱ በነጠላ ጥቅስ ምልክቶች ተለይቷል፤ ሁለቱም የግርጌ ማስታወሻ ምልክቶች ከሚመለከታቸው ሐረጎች በኋላ ተቀምጠዋል።
