  text: Then the devil left him[a], and behold, angels came and were ministering to him.
translation:
  language: am
  text: ከዚያም ዲያብሎስ ተወው፤ እነሆም፣ መላእክት ቀርበው ያገለግሉት ነበር[a]።
  philosophy: optimal-equivalence
  footnotes:
