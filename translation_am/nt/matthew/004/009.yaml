id: MAT.4.9
reference: Matthew 4:9
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ⸀εἶπεν αὐτῷ· Ταῦτά ⸂σοι πάντα⸃ δώσω, ἐὰν πεσὼν προσκυνήσῃς μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/009.yaml
  text: And he said to him[a], “I will give you all these things, if you fall down and worship me.”
translation:
  language: am
  text: እንዲህም አለው፦ “ወድቀህ ለእኔ ብትሰግድ፣ እነዚህን ሁሉ እሰጥሃለሁ።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ብትጎነበስልኝ” ወይም “ክብር ብትሰጠኝ።” የግሪኩ ግስ መጎንበስን፣ መስገድን ወይም ክብር መስጠትን ሊያመለክት ይችላል፤ በዚህ አውድ ግን የአምልኮ ትርጉሙ ይበልጣል።
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῷ
  choice: እንዲህም አለው
  rationale: የግሪኩን ቀላል አያያዥና ተውላጠ ስም ይጠብቃል፤ በዚህ ሐረግ ያልተጠቀሰውን ስም አያክልም።
- source_word: Ταῦτά σοι πάντα δώσω
  choice: ይህን ሁሉ እሰጥሃለሁ
  rationale: Ταῦτά በቅርብ የታዩትን መንግሥታትና ክብራቸውን ያመለክታል፤ በአማርኛ «ይህን ሁሉ» የጠቅላላነቱን ኃይል በተፈጥሯዊ አነጋገር ያስተላልፋል።
- source_word: ἐὰν πεσὼν
  choice: ወድቀህ ... ብት-
  rationale: የቅድመ ድርጊቱን አካላዊ ምስልና የሁኔታ አንቀጹን በተፈጥሯዊ የአማርኛ አወቃቀር ይገልጣል።
- source_word: προσκυνήσῃς μοι
  choice: ለእኔ ብትሰግድ
  rationale: «መስገድ» በአማርኛ የአካላዊ መጎንበስንም ሆነ የአምልኮ ክብርን ሊገልጥ ስለሚችል፣ የግሪኩን የትርጉም ስፋት ይጠብቃል፤ አውዱ ግን እዚህ የአምልኮ ጥያቄ መሆኑን ያመለክታል።
theological_decisions:
- issue: በሰይጣን ጥያቄ ውስጥ προσκυνέωን መተርጎም
  choice: ለእኔ ብትሰግድ
  alternative: ብትሰግድልኝ / አምልከኸኝ ቢሆን
  rationale: ቀጣዩ ቁጥር ስግደትንና አገልግሎትን ለእግዚአብሔር ብቻ የሚገባ አድርጎ ስለሚያቀርብ፣ ጥያቄው የአምልኮ ክብደት አለው። ሆኖም «መስገድ» የግሪኩን ሰፊ የትርጉም ክልል ሳይዘጋ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ። «አለው» የምንጭ ተውላጠ ስሙን ይጠብቃል፤ «ወድቀህ ... ብትሰግድ» ደግሞ አካላዊውን ድርጊትና የሁኔታውን ግንኙነት በተፈጥሯዊ ቅርጽ ያቀርባል።
