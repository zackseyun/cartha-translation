  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Δεῦτε ὀπίσω μου, καὶ ποιήσω ὑμᾶς ἁλιεῖς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/019.yaml
  text: And he says to them[a], “Come after me, and I will make you fishers of men.”
translation:
  language: am
  text: እርሱም፣ “ከኋላዬ ኑ፤ ሰዎችንም አጥማጆች አደርጋችኋለሁ” ይላቸዋል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: አላቸው
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ ቅርጽ በአማርኛ ትረካ ተፈጥሯዊ በሆነው ያለፈ ጊዜ ተተርጉሟል፤ “ይላቸዋል” የሚለው ቅርጽ የምንጩን ጊዜ ቢያንጸባርቅም እዚህ በዘመናዊ አማርኛ ትረካ ውስጥ ያልተፈጥሯዊ ይሆናል።
- source_word: Δεῦτε ὀπίσω μου
  choice: ከኋላዬ ኑ
  rationale: Δεῦτε የጥሪ ትእዛዝ “ኑ” ሲሆን፣ ὀπίσω μου ደግሞ “ከኋላዬ” የሚለውን የመከተል ምስል ይጠብቃል።
- source_word: ποιήσω ὑμᾶς
  choice: አደርጋችኋለሁ
  rationale: ኢየሱስ ተከታዮቹን እንደሚለውጣቸው የሚገልጸውን የወደፊት ጊዜ ቃል በቀጥታና በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἁλιεῖς ἀνθρώπων
  choice: ሰዎችን የምታጠምዱ
  rationale: የግሪኩ ዘይቤ በአማርኛ ተፈጥሯዊ በሆነ የግስ ሐረግ ተገልጿል። ἀνθρώπων በዚህ አውድ ሁሉንም ሰብዓዊ ፍጡራን ያመለክታልና “ሰዎችን” የሚለው ምርጫ ፍቺውን በትክክል ይይዛል።
theological_decisions:
- issue: በἁλιεῖς ἀνθρώπων ያለው የዓሣ ማጥመድ ዘይቤ
  choice: ሰዎችን የምታጠምዱ
  alternative: የሰዎች ዓሣ አጥማጆች
  rationale: ዘይቤውን ሳይፈታ እንዳለ ይጠብቃል፤ የሰብከት፣ የወንጌል ስርጭት ወይም የነፍስ ማዳን የሚሉ የትርጓሜ ማብራሪያዎችን ወደ ጽሑፉ አያስገባም።
- issue: የἀνθρώπων አጠቃላይ ሰብዓዊ ፍቺ
  choice: ሰዎችን
  alternative: ወንዶችን
  rationale: ἄνθρωπος በዚህ የብዙ ቁጥር አገባብ ወንዶችን ብቻ ሳይሆን ሰዎችን በአጠቃላይ ያመለክታል። አማርኛው “ሰዎች” ይህን ፍቺ ያለ ተጨማሪ ማብራሪያ በትክክል ይይዛል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛ ተጠቅሟል። “ከኋላዬ ኑ” የምንጩን ሁለት ክፍሎች እና የደቀ መዝሙርነት ምስል ይጠብቃል፤ “ሰዎችን የምታጠምዱ” ደግሞ የዓሣ ማጥመድን ዘይቤ ተፈጥሯዊ በሆነ አማርኛ ያቀርባል።
