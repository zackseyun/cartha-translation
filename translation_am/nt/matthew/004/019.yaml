revisions:
- from: እርሱም፣ “ከኋላዬ ኑ፤ ሰዎችንም የምታጠምዱ አደርጋችኋለሁ” አላቸው።
  to: እርሱም፣ “ከኋላዬ ኑ፤ ሰዎችንም አጥማጆች አደርጋችኋለሁ” ይላቸዋል።
  rationale: 'The revision retains the two-part imperative («ከኋላዬ ኑ») and the future transformative promise while restoring the explicit fisher image through «አጥማጆች». It also preserves the historical present without sacrificing modern standard Amharic. No footnote is needed: «ሰዎች» already expresses the generic-human force of ἀνθρώπων, and the source presents no textual ambiguity requiring annotation.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:44:12Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the summons, the future promise, and the generic-human reference of ἀνθρώπων. However, rendering ἁλιεῖς as the relative verbal phrase «የምታጠምዱ» weakens the source’s explicit occupational/image noun (‘fishers’) and can suggest trapping people rather than retaining the fishing metaphor. The Greek historical present λέγει can be represented naturally in this short narrative unit with «ይላቸዋል».
  naturalness: «ከኋላዬ ኑ» is clear, modern, and preserves both Δεῦτε and ὀπίσω μου. «ሰዎችን አጥማጆች አደርጋችኋለሁ» is a concise, idiomatic Amharic predicate construction and more directly retains the metaphorical designation.
  terminology: «ሰዎች» correctly communicates the inclusive human sense of ἀνθρώπων; «ወንዶች» would be unduly narrow. «አጥማጆች» preserves the fishing image without importing an interpretation such as preaching or saving souls.
  issues:
  - severity: medium
    issue: The noun-image ἁλιεῖς (‘fishers’) is rendered only as «የምታጠምዱ».
    rationale: Although the draft’s wording is understandable, it does not expressly identify the disciples as fishers and may give «ሰዎችን ማጥመድ» an unintended sense of ensnaring people. Using «አጥማጆች» preserves the source’s metaphor and grammatical predication more closely.
  - severity: low
    issue: λέγει is translated with past-tense «አላቸው».
    rationale: Past tense is possible in fluent Amharic Gospel narrative, but this compact verse can naturally preserve the Greek historical present with «ይላቸዋል», in line with the audited source-oriented decision.
  revised_text: እርሱም፣ “ከኋላዬ ኑ፤ ሰዎችንም አጥማጆች አደርጋችኋለሁ” ይላቸዋል።
  revised_footnotes: []
  revision_rationale: 'The revision retains the two-part imperative («ከኋላዬ ኑ») and the future transformative promise while restoring the explicit fisher image through «አጥማጆች». It also preserves the historical present without sacrificing modern standard Amharic. No footnote is needed: «ሰዎች» already expresses the generic-human force of ἀνθρώπων, and the source presents no textual ambiguity requiring annotation.'
