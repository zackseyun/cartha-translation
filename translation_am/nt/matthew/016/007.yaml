  revision_rationale: The revision retains the Greek’s concise quoted content rather than making the implied causal inference explicit. It replaces a potentially misleading literalism with idiomatic Amharic for not bringing bread along, repairs the alternative wording, and moves the footnote marker to the expression it documents.
