  yaml_path: translation/nt/matthew/016/007.yaml
  text: And they were discussing among themselves[a], saying, “We did not bring bread.”
translation:
  language: am
  text: እነርሱም እርስ በርሳቸው፣ «እንጀራ ይዘን አልመጣንም»[a] እያሉ ይወያዩ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እንጀራ አልወሰድንም።»
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: እነርሱም
  rationale: δέ በዚህ ቦታ የትረካውን ፍሰት የሚያገናኝ ለስላሳ አያያዥ ነው፤ «-ም» በአማርኛ ይህን በተፈጥሮ ያሳያል።
- source_word: διελογίζοντο
  choice: ይወያዩ ነበር
  rationale: ያልተጠናቀቀው የግስ ቅርጽ በመካከላቸው እየቀጠለ የነበረ ምክክርን ያመለክታል፤ ይህ አገላለጽ ተፈጥሯዊና ግልጽ ነው።
- source_word: ἐν ἑαυτοῖς
  choice: እርስ በርሳቸው
  rationale: ውይይቱ በደቀ መዛሙርቱ ቡድን ውስጥ መሆኑን ያሳያል፤ «እርስ በርሳቸው» የቡድን ውስጥ መነጋገርን በተፈጥሮ ይገልጣል።
- source_word: λέγοντες
  choice: እያሉ
  rationale: የውይይታቸውን ይዘት ወደ ቀጥተኛ ንግግር ያስገባል።
- source_word: Ἄρτους
  choice: እንጀራ
  rationale: ብዙ ቁጥር ያለው ἄρτους እዚህ ለጉዞ የሚያስፈልግ የዳቦ ምግብን በአጠቃላይ ይጠቅሳል፤ በመጽሐፍ ቅዱሳዊ አማርኛ «እንጀራ» የተለመደና ሰፊ ትርጉም ያለው ምርጫ ነው።
- source_word: οὐκ ἐλάβομεν
  choice: አልያዝንም
  rationale: ἐλάβομεν በቀጥታ «ያዝን/ወሰድን» ሊባል ይችላል፤ በጉዞ አውድ ግን ከራስ ጋር አለመያዝን ያመለክታል። «አልያዝንም» የግሪኩን አጭርነትና የትርጉም ስፋት ይጠብቃል።
theological_decisions:
- issue: ὅτι የሚያስገባው ንግግር ምክንያት ነው ወይስ የውይይቱ ይዘት?
  choice: ንግግሩን በቀጥታ «እንጀራ አልያዝንም» በማለት ማቅረብ
  alternative: «እንጀራ ስላልያዝን ነው» ብለው ማብራራት
  rationale: ግሪኩ ὅτι በዚህ ስፍራ የንግግራቸውን ይዘት ሊያስገባ ይችላል፤ «ስለ... ነው» የሚለውን ትርጓሜ በግድ አለመጨመር የምንጩን አጭርነትና አሻሚነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «እንጀራ» በዚህ አውድ ሰፊውን ‘bread/loaves’ ትርጉም ይይዛል፤ የግሪኩ አጭር ቀጥተኛ ንግግርም አልተስፋፋም።
