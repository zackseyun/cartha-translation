  text: τότε ⸀διεστείλατο τοῖς ⸀μαθηταῖς ἵνα μηδενὶ εἴπωσιν ὅτι αὐτός ⸀ἐστιν ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/020.yaml
  text: Then he strictly instructed the disciples to tell no one that he is the Messiah[a].
translation:
  language: am
  text: ከዚያም እርሱ መሲሑ[a] እንደሆነ ለማንም እንዳይናገሩ ደቀ መዛሙርቱን አጥብቆ አዘዛቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ክርስቶስ»። የግሪኩ Χριστός እዚህ እንደ ማዕረግ ስለሚያገለግል «መሲሕ» ተብሎ ተተርጉሟል።
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: ከዚያም
  rationale: በትረካው ውስጥ የድርጊቶችን ቅደም ተከተል በተፈጥሯዊ ዘመናዊ አማርኛ ያመለክታል።
- source_word: διεστείλατο
  choice: አጥብቆ አዘዛቸው
  rationale: ግሱ ጠንካራ መመሪያን ወይም ክልከላን ያሳያል፤ ይህ አተረጓጎም ኃይሉን ጠብቆ በተፈጥሯዊ አማርኛ ያቀርበዋል።
- source_word: τοῖς μαθηταῖς
  choice: ደቀ መዛሙርቱን
  rationale: በዐውዱ የሚታወቁትን የኢየሱስ ተከታዮች ያመለክታል፤ የአማርኛው ባለቤትነት ቅጥያ ግንኙነቱን በተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: ἵνα μηδενὶ εἴπωσιν
  choice: ለማንም እንዳይናገሩ
  rationale: የትእዛዙን ይዘት እና ፍጹም ክልከላውን በግልጽ የአማርኛ አገባብ ይገልጣል።
- source_word: ὅτι αὐτός ἐστιν
  choice: እርሱ … እንደሆነ
  rationale: ὅτι የንግግሩን ይዘት ያስገባል፤ ግልጽ የሆነው αὐτός በ«እርሱ» ተጠብቋል፣ ነገር ግን ያልተገለጸ ተጨማሪ አጽንዖት አልተጫነበትም።
- source_word: ὁ χριστός
  choice: መሲሕ
  rationale: Χριστός እዚህ የተቀባውን ንጉሥና አዳኝ የሚያመለክት ማዕረግ ነው፤ «መሲሕ» ይህን የማዕረግ ትርጉም በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም ያቆያል።
theological_decisions:
- issue: Χριστόςን እንደ ማዕረግ መተርጎም
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: በዚህ ዐውድ Χριστός እንደ ግለሰብ ስም ሳይሆን እንደ ታወቀ መሲሓዊ ማዕረግ ይሠራል። «መሲሕ» የማዕረጉን ትርጉም ግልጽ ያደርጋል፤ «ክርስቶስ» የተለመደ አማራጭ በግርጌ ማስታወሻ ተጠቅሷል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር አማርኛ ተጠቅሟል። «አጥብቆ አዘዛቸው» የግሪኩን ጠንካራ ትእዛዝ ያስተላልፋል፤ የዓረፍተ ነገሩ ቅደም ተከተልም በአማርኛ ተፈጥሯዊነት መሠረት ተደርድሯል።
