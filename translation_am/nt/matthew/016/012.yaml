  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τότε συνῆκαν ὅτι οὐκ εἶπεν προσέχειν ἀπὸ τῆς ζύμης ⸂τῶν ἄρτων⸃ ἀλλὰ ἀπὸ τῆς διδαχῆς τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/012.yaml
  text: Then they understood that he had not said to beware of the leaven of bread[a], but of the teaching of the Pharisees and Sadducees.
translation:
  language: am
  text: ከዚያም፣ ከእንጀራ እርሾ[a] እንዲጠነቀቁ እንዳልነገራቸው፣ ይልቁንም ከፈሪሳውያንና ከሰዱቃውያን ትምህርት እንዲጠነቀቁ እንደነገራቸው ተረዱ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የእንጀራዎቹን እርሾ።” የግሪኩ ስም እዚህ በብዙ ቁጥር ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: ከዚያም
  rationale: ደቀ መዛሙርቱ የኢየሱስን ንግግር የተረዱበትን ቀጣይ ጊዜ በተፈጥሯዊ አማርኛ ያመለክታል።
- source_word: συνῆκαν
  choice: ተረዱ
  rationale: ወደ መረዳት መድረሳቸውን በግልጽና ተራ ቋንቋ ይገልጣል።
- source_word: προσέχειν ἀπό
  choice: እንዲጠነቀቁ … ከ
  rationale: በዚህ የማስጠንቀቂያ አውድ ያለውን ‘ከአንድ ነገር ተጠበቁ’ የሚለውን ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ζύμης
  choice: እርሾ
  rationale: ቃሉን ቃል በቃል ይወክላል፤ በአውዱም ያለውን ምሳሌያዊ ጥቅም ሳያብራራ ይጠብቃል።
- source_word: τῶν ἄρτων
  choice: እንጀራ
  rationale: ἄρτοςን በዘመናዊ አማርኛ በተለመደው መንገድ ይተረጉማል፤ የግሪኩ ብዙ ቁጥር በማስታወሻ ተጠብቋል።
- source_word: διδαχῆς
  choice: ትምህርት
  rationale: የሚሰጥ ትምህርትን ወይም የትምህርቱን ይዘት የሚያመለክት ግልጽና ዘመናዊ ቃል ነው።
- source_word: Φαρισαίων καὶ Σαδδουκαίων
  choice: ፈሪሳውያንና ሰዱቃውያን
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመዱትን የቡድን ስሞች ይጠቀማል።
theological_decisions:
- issue: የ‘እርሾ’ ምሳሌያዊ ኃይል
  choice: እርሾ የፈሪሳውያንና የሰዱቃውያንን ትምህርት እንደሚያመለክት ብቻ መግለጽ
  alternative: እንደ ‘ግብዝነት’ ወይም ‘የተበላሸ ትምህርት’ በሚሉ ቃላት ማስፋት
  rationale: ጥቅሱ ራሱ ምሳሌውን ‘ትምህርት’ ብሎ ይገልጻል፤ ከዚያ በላይ የሥነ ምግባር ገለጻ አይጨምርም። ስለዚህ ትርጉሙ የጽሑፉን የማብራሪያ ደረጃ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ አማርኛ። የግሪኩን አንጻራዊ አወቃቀር በተፈጥሯዊ አማርኛ ‘ሳይሆን’ በሚል ቅርጽ አቅርቧል።
