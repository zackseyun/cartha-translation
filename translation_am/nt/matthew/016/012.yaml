- from: ከዚያም እርሱ እንዲጠነቀቁ የነገራቸው ከእንጀራ እርሾ[a] ሳይሆን፣ ከፈሪሳውያንና ከሰዱቃውያን ትምህርት እንደሆነ ተረዱ።
  to: ከዚያም፣ ከእንጀራ እርሾ[a] እንዲጠነቀቁ እንዳልነገራቸው፣ ይልቁንም ከፈሪሳውያንና ከሰዱቃውያን ትምህርት እንዲጠነቀቁ እንደነገራቸው ተረዱ።
