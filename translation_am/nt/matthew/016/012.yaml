review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies the disciples as the ones who came to understand and retains the contrast between literal leaven and the teaching of the Pharisees and Sadducees. However, its compressed wording can make the scope of Jesus’ statement less explicit. A revision more directly represents “he did not say [to beware] ... but [to beware] ...” without adding interpretation.
  naturalness: The draft is generally modern and readable, but “እርሱ እንዲጠነቀቁ የነገራቸው ... ሳይሆን” is somewhat heavy and syntactically compressed. Repeating the governing warning verb across the contrast is clearer in natural standard Amharic.
  terminology: እርሾ, ትምህርት, ፈሪሳውያን, and ሰዱቃውያን are appropriate and retain the source’s metaphor and established biblical group names. The footnote properly preserves that ἄρτων is plural.
  issues:
  - severity: low
    issue: The main sentence compresses the negated and contrasted warning clauses.
    rationale: The Greek explicitly says that Jesus did not tell them to beware of the leaven of breads, but of the teaching of the two groups. Making both warning clauses explicit improves clarity and preserves the contrast without interpretive expansion.
  revised_text: ከዚያም፣ ከእንጀራ እርሾ[a] እንዲጠነቀቁ እንዳልነገራቸው፣ ይልቁንም ከፈሪሳውያንና ከሰዱቃውያን ትምህርት እንዲጠነቀቁ እንደነገራቸው ተረዱ።
  revised_footnotes:
  - marker: a
    text: ወይም፣ “የእንጀራዎቹን እርሾ።” የግሪኩ ስም እዚህ በብዙ ቁጥር ነው።
    reason: lexical_alternative
  revision_rationale: The revision makes explicit the two coordinated objects of the warning, corresponding to the Greek negation and contrast, while keeping the metaphor unexplained beyond the verse’s own identification of it with “teaching.” It preserves the plural-note anchor and all key terminology.
