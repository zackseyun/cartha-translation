- source_word: οἱ μαθηταὶ
  choice: ደቀ መዛሙርቱ
  rationale: በወንጌላት ውስጥ የኢየሱስን ተከታዮችና ተማሪዎች ለማመልከት የተለመደውና የተከበረው አማርኛ አገላለጽ ነው።
- source_word: εἰς τὸ πέραν
  choice: ወደ ማዶ
  rationale: በዐውዱ የሐይቁን ሌላኛ ወገን የሚያመለክት አጭርና ተፈጥሯዊ አማርኛ ነው።
- source_word: ἐπελάθοντο
  choice: ረስተው ነበር
  rationale: ወደ ማዶ ከመድረሳቸው በፊት መያዙን እንደረሱ የሚያሳየውን የትረካ ቅደም ተከተል ይጠብቃል።
- source_word: ἄρτους
  choice: እንጀራ
  rationale: የግሪኩ ቃል ብዙ ቁጥር ቢሆንም፣ በዚህ ዐውድ ምግብ የሆነውን እንጀራ በአማርኛ በተፈጥሯዊ ሁኔታ በነጠላ የጅምላ ስም መግለጽ ይቻላል።
- source_word: λαβεῖν
  choice: መያዝን
  rationale: ቃሉ በዐውዱ ለጉዞ አብሮ መውሰድን ያመለክታል፤ ‘መያዝ’ ከ‘ረሱ’ ጋር ተፈጥሯዊ የአማርኛ ግንባታ ይፈጥራል።
