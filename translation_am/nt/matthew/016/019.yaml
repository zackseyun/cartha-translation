  rationale: የወደፊት ጊዜውን ተስፋ በተፈጥሯዊ አማርኛ ያሳያል፤ የሁለተኛ መደብ ነጠላ ተቀባይም በግሱ ውስጥ ተገልጧል።
- source_word: τὰς κλεῖδας
  choice: ቁልፎች
  rationale: የምንጩን ብዙ ቁጥርና ዘይቤ ሳይተረጉም እንዳለ ይጠብቃል።
- source_word: τῆς βασιλείας τῶν οὐρανῶν
  choice: የሰማያትን መንግሥት
  rationale: የግሪኩን ብዙ ቁጥር ‘ሰማያት’ ይጠብቃል፤ ይህም በማቴዎስ የተለመደውን አገላለጽ በቀጥታ ያስተላልፋል።
- source_word: ὃ ἐὰν
  choice: ማንኛውም ነገር
  rationale: ያልተወሰነውን አንጻራዊ አገላለጽ በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: δήσῃς / λύσῃς
  choice: የምታስረው / የምትፈታው
  rationale: ‘ማሰር/መፍታት’ የሚለውን ተጓዳኝ ዘይቤ ይጠብቃል፤ ትርጉሙን ወደ መከልከልና መፍቀድ ብቻ አያጠብም።
- source_word: ἐπὶ τῆς γῆς
  choice: በምድር ላይ
  rationale: ከሰማያት ጋር ያለውን ንጽጽር በተለመደ አማርኛ ያቀርባል።
- source_word: ἔσται δεδεμένον / ἔσται λελυμένον
  choice: የታሰረ ይሆናል / የተፈታ ይሆናል
  rationale: የεἰμί የወደፊት ጊዜ ከፍጹም ተገብሮ አንቀጽ ጋር ያለውን ውህደት በአማርኛ የተጠናቀቀ ሁኔታን በሚያሳይ ቅርጽ ያቀርባል።
- source_word: ἐν τοῖς οὐρανοῖς
  choice: በሰማያት
  rationale: የግሪኩን ብዙ ቁጥር ይጠብቃል፤ በአማርኛም የተለመደና ክቡር አገላለጽ ነው።
theological_decisions:
- issue: የማሰርና የመፍታት ቀመር ገጽታና ሥነ መለኮታዊ አንድምታ
  choice: ‘የታሰረ ይሆናል / የተፈታ ይሆናል’ ተብሎ የፍጹም ተገብሮው ውጤታዊ ሁኔታ ተጠብቋል።
