- issue: የመንግሥቱ ቁልፎች ትርጉም
  choice: ‘ቁልፎች’ የሚለው ዘይቤ እንዳለ ተጠብቋል።
  alternative: ‘የማስገባትና የማስቀረት ሥልጣን’ ወይም ‘የአደራ አስተዳደር ሥልጣን’
  rationale: ምስሉ ሥልጣንን ሊያመለክት ቢችልም ጽሑፉ ራሱ ዘይቤውን ይጠቀማል። ዘይቤውን መጠበቅ ያልተገለጸ ልዩ የቤተ ክርስቲያን ሥርዓት ትርጓሜ ከማስገባት ይቆጠባል።
