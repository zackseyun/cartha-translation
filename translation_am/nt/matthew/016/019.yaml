source:
  edition: SBLGNT
  text: ⸀δώσω σοι τὰς ⸀κλεῖδας τῆς βασιλείας τῶν οὐρανῶν, καὶ ὃ ⸀ἐὰν δήσῃς ἐπὶ τῆς γῆς ἔσται δεδεμένον ἐν τοῖς οὐρανοῖς, καὶ ὃ ⸁ἐὰν λύσῃς ἐπὶ τῆς γῆς ἔσται λελυμένον ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/019.yaml
  text: I will give you the keys of the kingdom of heaven[a], and whatever you bind on earth will have been bound in heaven[c][b], and whatever you loose on earth will have been loosed in heaven.
translation:
  language: am
  text: የሰማያት መንግሥት ቁልፎችን እሰጥሃለሁ፤[a] በምድር ላይ የምታስረው ሁሉ በሰማያት የታሰረ ይሆናል፤[b][c] በምድር ላይ የምትፈታው ሁሉ በሰማያት የተፈታ ይሆናል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የሰማያት መንግሥት” የግሪኩን ብዙ ቁጥር በቀጥታ ያሳያል፤ ማቴዎስ ይህን አገላለጽ ብዙ ጊዜ ይጠቀማል።
    reason: lexical_alternative
  - marker: b
    text: “ማሰር” እና “መፍታት” መከልከልንና መፍቀድን፣ ወይም ግዴታ መጣልንና ማንሣትን ሊያመለክቱ ይችላሉ፤ ትርጉሙ ግን የግሪኩን ዘይቤ ጠብቋል።
    reason: cultural_note
  - marker: c
    text: በተለምዶ “በሰማያት ይታሰራል … ይፈታል” ተብሎ ሊተረጎም ይችላል። የግሪኩ አገባብ ግን “የታሰረ ይሆናል … የተፈታ ይሆናል” የሚለውን የተጠናቀቀ ሁኔታ በበለጠ ትክክል ሊያሳይ ይችላል።
    reason: alternative_reading
