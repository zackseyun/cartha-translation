base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/016.yaml
  text: Simon Peter answered[a], “You are the Messiah, the Son of the living God.”
translation:
  language: am
  text: ስምዖን ጴጥሮስም መልሶ እንዲህ አለ፤ “አንተ መሲሑ[a]፣ የሕያው እግዚአብሔር ልጅ ነህ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ክርስቶስ።” የግሪኩ Χριστός የሚለው ማዕረግ “ክርስቶስ” ተብሎም ሊተረጎም ይችላል፤ እዚህ ግን “መሲሑ” የተባለው የማዕረጉን ትርጉምና የአይሁድን መሲሐዊ አውድ ለመጠበቅ ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: መልሶ … አለ
  rationale: ሁለቱን የግሪክ የንግግር መግቢያ ቅርጾች በተፈጥሯዊ አማርኛ ያቀርባል፤ መልስ መሆኑንና ‘አለ’ የሚለውን የትረካ ቅርጽ ይጠብቃል።
- source_word: δὲ
  choice: -ም
  rationale: የትረካውን ቀላል ቀጣይነት በስምዖን ጴጥሮስም ውስጥ ባለው -ም አገናኝ በተፈጥሯዊነት ይወክላል።
- source_word: Σίμων Πέτρος
  choice: ስምዖን ጴጥሮስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የታወቁትን የስሞቹን ቅርጾች ይጠቀማል።
- source_word: Σὺ
  choice: አንተ
  rationale: በግሪክ በግልጽ የተጠቀሰውንና አጽንዖት ያለውን ተውላጠ ስም ይጠብቃል።
- source_word: ὁ χριστὸς
  choice: መሲሑ
  rationale: Χριστός በዚህ ስፍራ እንደ ስም ሳይሆን እንደ ማዕረግ ስለሚሠራ፣ የአይሁድን መሲሐዊ አውድ የሚያስጠብቀው ‘መሲሑ’ ተመርጧል።
- source_word: ὁ υἱὸς
  choice: ልጅ
  rationale: የተወሰነውን የወልድነት መግለጫ ‘የሕያው እግዚአብሔር ልጅ’ በሚለው ተፈጥሯዊ የአማርኛ የባለቤትነት ሐረግ ይጠብቃል።
- source_word: τοῦ θεοῦ τοῦ ζῶντος
  choice: የሕያው እግዚአብሔር
  rationale: የግሪኩን አገናዛቢ ሐረግና ζῶντος የሚያመለክተውን ቀጣይ ሕያውነት ‘ሕያው’ በሚለው የተለመደ ክቡር ቃል ያቀርባል።
theological_decisions:
- issue: Χριστόςን እንደ ማዕረግ ወይም እንደ ስም መተርጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: በጴጥሮስ እምነት አዋጅ ውስጥ Χριστός ግልጽ መሲሐዊ ማዕረግ ነው፤ ‘መሲሑ’ ይህን ተግባር በግልጽ ያሳያል፣ ‘ክርስቶስ’ የሚለውም በማስታወሻ ተጠብቋል።
- issue: ‘የእግዚአብሔር ልጅ’ የሚለው ኃይል
  choice: የሕያው እግዚአብሔር ልጅ
  alternative: የሚኖረው እግዚአብሔር ልጅ
  rationale: የግሪኩን የእምነት አዋጅና የማዕረግ አነጋገር ያለ ተጨማሪ ዶግማዊ ማብራሪያ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። ‘እግዚአብሔር’፣ ‘ሕያው’፣ ‘ስምዖን ጴጥሮስ’ የሚሉት ቅርጾች በአማርኛ የመጽሐፍ ቅዱስ ንባብ የታወቁ ሲሆኑ አረፍተ ነገሩ ግን የዛሬ ተፈጥሯዊ አገባብን ይከተላል።
