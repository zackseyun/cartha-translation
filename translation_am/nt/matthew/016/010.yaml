  yaml_path: translation/nt/matthew/016/010.yaml
  text: Or the seven loaves for the four thousand[a], and how many large baskets you picked up?
translation:
  language: am
  text: ወይስ ለአራት ሺህ የነበሩትን ሰባቱን እንጀራዎች[a]፣ ስንት ትላልቅ ቅርጫቶችስ ሰበሰባችሁ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ለአራት ሺህ የነበሩትን ሰባቱን እንጀራዎች፣ ስንት ትላልቅ ቅርጫቶች እንደሰበሰባችሁስ አታስታውሱም?»
    reason: The Greek is an elliptical continuation of the preceding negative rhetorical question; this alternative supplies the implied verb for readers, while the main text preserves the ellipsis.
lexical_decisions:
- source_word: οὐδὲ
  choice: ወይስ
  rationale: ጥቅሱ በቀደመው ጥያቄ ላይ ተጨማሪ ምሳሌ የሚያክል አጭር ቀጣይ ንግግር ነው፤ «ወይስ» ይህን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: ሰባት እንጀራዎች
  rationale: ἄρτος በዚህ የምግብ ትረካ አውድ የተቆጠሩ የዳቦ እንጀራዎችን ያመለክታል፤ «እንጀራዎች» በመጽሐፍ ቅዱሳዊ አማርኛ የተለመደና ተጨባጭ ምስሉን የሚጠብቅ ነው።
- source_word: τῶν τετρακισχιλίων
  choice: ለአራቱ ሺህ የነበሩትን
  rationale: የግሪኩ የባለቤትነት አገባብ ከአራቱ ሺህ ሰዎች መመገብ ጋር ያለውን ዝምድና ያሳያል፤ ይህ አተረጓጎም ግንኙነቱን በግልጽ አማርኛ ይገልጣል።
- source_word: πόσας
  choice: ስንት
  rationale: σπυρίδαςን የሚወስን ቀጥተኛ የቁጥር ጥያቄ ነው።
- source_word: σπυρίδας
  choice: ትላልቅ ቅርጫቶች
  rationale: σπυρίς ከκόφινος የሚለይ ትልቅ የቅርጫት ዓይነት ስለሚያመለክት፣ «ትላልቅ» የሚለው ቃል በወንጌሉ ትረካ ያለውን የቃላት ልዩነት ይጠብቃል።
- source_word: ἐλάβετε
  choice: እንደሰበሰባችሁ
  rationale: በተረፈው ምግብ አውድ ἐλάβετε የተረፈውን አንስቶ መሰብሰብን ያመለክታል፤ «ሰበሰባችሁ» በዘመናዊ አማርኛ ተፈጥሯዊና አውዱን የሚያስተላልፍ ነው።
theological_decisions:
- issue: οὐδὲ የሚያሳየው የቀጣይነት አገባብ
  choice: «ወይስ» በማለት የቀደመውን ጥያቄ የሚቀጥል አማራጭ ምሳሌ እንደሆነ ማቅረብ
  alternative: «እንዲሁም ... አታስታውሱምን?» በማለት አሉታዊ ቀጣይነቱን ግልጽ ማድረግ
  rationale: ግሪኩ ከቀደመው ጥያቄ ጋር በአጭሩ የተያያዘ ስለሆነ፣ ዋናው ጽሑፍ ያልተጻፈውን ግስ ሳይጨምር የንግግሩን ክፍትነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ጥቅሱ ከቀደመው ንግግር ጋር ያለው ሰዋሰዋዊ ቀጣይነት በዋናው ጽሑፍ ተጠብቋል፤ ይበልጥ ግልጽ የሆነው አማራጭ በማስታወሻ ቀርቧል።
