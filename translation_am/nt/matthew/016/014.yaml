  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “መጥምቁ ዮሐንስ፣ ኤልያስ፣ ኤርምያስ” የተለመዱ መጽሐፍ ቅዱሳዊ ስሞች እንደሆኑ ተጠብቀዋል።
