base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/014.yaml
  text: And they said[a], “Some say John the Baptist, others Elijah, and others Jeremiah or one of the prophets.”
translation:
  language: am
  text: እነርሱም፣ “አንዳንዶች መጥምቁ ዮሐንስ ነው ይላሉ፤ ሌሎች ኤልያስ ነው ይላሉ፤ ሌሎች ደግሞ ኤርምያስ ወይም ከነቢያት አንዱ ነው ይላሉ” አሉ[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም በግልጽ አነጋገር፣ “አንዳንዶች አንተ መጥምቁ ዮሐንስ ነህ ይላሉ፤ ሌሎች ኤልያስ፣ ሌሎች ደግሞ ኤርምያስ ወይም ከነቢያት አንዱ ነህ ይላሉ።”
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: እነርሱም … አሉ
  rationale: δέ የትረካውን ፍሰት የሚያስቀጥል ቀላል አያያዥ ስለሆነ በ“-ም” ተገልጿል፤ εἶπαν ደግሞ በቀጥታ “አሉ” ተብሏል።
- source_word: Οἱ μὲν
  choice: አንዳንዶች
  rationale: μέν ከሚከተሉት ἄλλοι/ἕτεροι ጋር የተለያዩ ቡድኖችን የሚዘረዝር ስለሆነ “አንዳንዶች” ተመርጧል።
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: መጥምቁ ዮሐንስ
  rationale: ይህ በአማርኛ የተለመደውን የግለሰቡን መጠሪያ ይጠብቃል፤ βαπτιστής የማጥመቅ ተግባሩን ያመለክታል።
- source_word: ἄλλοι δὲ
  choice: ሌሎች
  rationale: በዝርዝሩ ውስጥ ሁለተኛውን ቡድን በተፈጥሯዊ አማርኛ ያስተዋውቃል፤ δέን በተለየ ቃል መድገም አላስፈለገም።
- source_word: Ἠλίαν
  choice: ኤልያስ
  rationale: በዘመናዊ የአማርኛ መጽሐፍ ቅዱስ አጠቃቀም የተለመደው የነቢዩ ስም ነው።
- source_word: ἕτεροι δὲ
  choice: ሌሎች ደግሞ
  rationale: ሌላ ተጨማሪ ቡድን መኖሩን በግልጽና ተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: Ἰερεμίαν
  choice: ኤርምያስ
  rationale: በአማርኛ የተለመደው የነቢዩ ስም ተጠብቋል።
- source_word: ἢ ἕνα τῶν προφητῶν
  choice: ወይም ከነቢያት አንዱ
  rationale: ἤ የአማራጭ መለያን ያሳያል፤ ግሪኩ “ሌሎች” የሚል ተጨማሪ ቃል ስለሌለው አልተጨመረም።
theological_decisions:
- issue: የማንነት መግለጫዎቹ የተውላጠ ስም ማጣት
  choice: በአማርኛው የእያንዳንዱን መለያ ተፈጥሯዊ ለማድረግ “ነው” ተጨምሯል፤ ነገር ግን “አንተ” ወይም “የሰው ልጅ” በግልጽ አልተጨመረም።
