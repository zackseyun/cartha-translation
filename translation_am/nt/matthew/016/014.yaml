  rationale: ግሪኩ መለያዎቹን ያለ ግልጽ ተውላጠ ስምና ያለ ኮፑላ ይዘረዝራል። አማርኛ ግን “ነው” ሲጨመር ተፈጥሯዊና ግልጽ ይሆናል፤ የመለያዎቹ ባለቤት ከቀደመው ጥያቄ እንዲገባ መተዉ የምንጩን አጭርነትና አሻሚነት ይጠብቃል።
