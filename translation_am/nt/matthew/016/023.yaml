review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the physical turning, the spatial imperative “Go behind me,” the direct and theologically unresolved address “Satan,” and the metaphor “stumbling block.” Its rendering of φρονεῖς as “የምታስበው” can suggest the content of an individual thought rather than the settled orientation or mindset conveyed by the Greek present verb.
  naturalness: Most of the wording is clear modern standard Amharic. Adding “እንዲህ” gives the introductory speech clause a more natural and fully formed Amharic structure. Rendering the final clause in terms of where Peter’s mind is directed is both idiomatic and closer to the source sense.
  terminology: “ጴጥሮስ,” “ሰይጣን,” “መሰናክል,” and “እግዚአብሔር” are appropriate established biblical terms. “የሰዎች ነገር” naturally communicates the generic-human force of τὰ τῶν ἀνθρώπων without imposing a gender-specific interpretation absent from normal Amharic usage.
  issues:
  - severity: medium
    issue: The final clause renders φρονεῖς primarily as thinking about particular content.
    rationale: φρονεῖς denotes one’s disposition, orientation, or mindset. “ሐሳብህ ... ላይ ነው” preserves this broader ongoing sense while retaining the source’s contrast.
  - severity: low
    issue: The speech introduction omits an explicit Amharic speech introducer before the quotation.
    rationale: The draft is understandable, but “ጴጥሮስን እንዲህ አለው” is smoother standard Amharic and clearly governs the direct quotation.
  revised_text: እርሱ ግን ዞር ብሎ ጴጥሮስን እንዲህ አለው፤ “ከኋላዬ ሂድ፣ ሰይጣን! ለእኔ መሰናክል ነህ፤ ሐሳብህ በእግዚአብሔር ነገር ላይ ሳይሆን በሰዎች ነገር ላይ ነውና።”
