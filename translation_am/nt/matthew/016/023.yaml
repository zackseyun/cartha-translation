id: MAT.16.23
reference: Matthew 16:23
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ δὲ στραφεὶς εἶπεν τῷ Πέτρῳ· Ὕπαγε ὀπίσω μου, Σατανᾶ· σκάνδαλον ⸂εἶ ἐμοῦ⸃, ὅτι οὐ φρονεῖς τὰ τοῦ θεοῦ ἀλλὰ τὰ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/023.yaml
  text: But he turned and said to Peter[a], “Go behind me, Satan! You are a stumbling block to me, because you are not setting your mind on the things of God[b], but on the things of men.”
translation:
  language: am
  text: እርሱ ግን ዞር ብሎ ጴጥሮስን እንዲህ አለው፤ “ከኋላዬ ሂድ፣ ሰይጣን! ለእኔ መሰናክል ነህ፤ ሐሳብህ በእግዚአብሔር ነገር ላይ ሳይሆን በሰዎች ነገር ላይ ነውና።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στραφεὶς
  choice: ዞር ብሎ
  rationale: አካላዊውን መዞር በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል፤ በግሪክ ያለውን ተሳቢ መልክ በአማርኛ ተፈጥሯዊ አገባብ ይገልጣል።
- source_word: Ὕπαγε ὀπίσω μου
  choice: ከኋላዬ ሂድ
  rationale: የὝπαγεን የመሄድ ትእዛዝና የὀπίσω μουን ቦታዊ ኃይል ይጠብቃል፤ በአማርኛም ግልጽና ቀጥተኛ ነው።
- source_word: Σατανᾶ
  choice: ሰይጣን
  rationale: በዚህ ዐውድ ያለውን የቀጥታ ጥሪና የተለመደውን ቅዱስ መጽሐፋዊ መጠሪያ ይጠብቃል፤ ‘ባላጋራ’ ብሎ በመተርጎም ያለውን ትርጓሜያዊ ውጥረት አይፈታም።
- source_word: σκάνδαλον
  choice: መሰናክል
  rationale: ሰውን የሚያሰናክል እንቅፋት የሚለውን ምስላዊ ኃይል ይይዛል፤ ጴጥሮስ የኢየሱስን መንገድ ሊያደናቅፍ ከመሞከሩ ጋር ይስማማል።
- source_word: ἐμοῦ
  choice: ለእኔ
  rationale: ከ‘መሰናክል’ ጋር በአማርኛ ተፈጥሯዊ ሆኖ መሰናክሉ ኢየሱስን እንደሚመለከት ያሳያል።
- source_word: φρονεῖς
  choice: የምታስበው
  rationale: በዐውዱ የአስተሳሰብ አቅጣጫንና ግምትን ይገልጣል። በአማርኛ የንግግሩን ቀጥተኛነት ሳያጣ ተፈጥሯዊ ነው።
- source_word: τὰ τοῦ θεοῦ
  choice: የእግዚአብሔርን ነገር
  rationale: የግሪኩን ሰፊና በመጠኑ ያልተወሰነ አገላለጽ ይጠብቃል፤ ‘ፍላጎት’ ወይም ‘ዕቅድ’ ብሎ በመጥበብ አይተረጉምም።
- source_word: τὰ τῶν ἀνθρώπων
  choice: የሰዎችን ነገር
  rationale: ἄνθρωποι በዚህ ስፍራ የሰው ልጆችን በአጠቃላይ ይወክላል። ‘ሰዎች’ ትክክለኛ፣ ዘመናዊና ተፈጥሯዊ ሲሆን ከእግዚአብሔር ነገር ጋር ያለውን ንፅፅር ይጠብቃል።
theological_decisions:
- issue: ኢየሱስ ጴጥሮስን ‘ሰይጣን’ ብሎ የጠራበት ኃይል
  choice: ‘ሰይጣን’ የሚለውን ቀጥተኛ ጥሪ ማቆየት
  alternative: ‘ባላጋራ’ ብሎ መተርጎም፣ ወይም በጴጥሮስ በኩል የሚሠራውን ሰይጣን እንደጠራ በግልጽ ማብራራት
  rationale: ግሪኩ ጴጥሮስ ራሱ ሰይጣን ነው ወይም ሰይጣን በእርሱ በኩል እየሠራ ነው የሚለውን ትርጓሜ አይወስንም። ቀጥተኛውን መጠሪያ ማቆየት የተግሣጹን ጥንካሬና ትርጓሜያዊ ውጥረቱን ይጠብቃል።
- issue: τὰ τοῦ θεοῦ እና τὰ τῶν ἀνθρώπων ያላቸው ሰፊ ትርጉም
  choice: ‘የእግዚአብሔርን ነገር’ እና ‘የሰዎችን ነገር’ ብሎ በመጠኑ ቀጥተኛ ማድረግ
  alternative: ‘የእግዚአብሔርን ፍላጎት’ እና ‘ሰብዓዊ ጉዳዮችን’ ብሎ መተርጎም
  rationale: ቀጥተኛው አገላለጽ ዐውዱ የእግዚአብሔርን ዕቅድ፣ ፈቃድ ወይም ጉዳይ እንዴት እንደሚያጠቃልል ለአንባቢው ክፍት ያደርጋል፤ ከግሪኩ በላይ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ግሪኩ ያልያዘው የግል ስም በንግግሩ መግቢያ ላይ አልተጨመረም፤ ጴጥሮስን የሚያመለክተው ‘አለው’ ተጠብቋል። ማብራሪያ የሚያስፈልገው የጽሑፍ ወይም የትርጉም አማራጭ ስለሌለ የግርጌ ማስታወሻ አልተጨመረም።
