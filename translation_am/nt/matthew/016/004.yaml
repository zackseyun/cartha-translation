review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately renders the principal clauses and preserves both the adultery metaphor and the unelaborated phrase “the sign of Jonah.” However, “ሌላ ምልክት” (“another sign”) is an unnecessary addition: the Greek simply says that no sign will be given except Jonah’s sign. Removing it more closely follows the source. The final participial clause is retained with the more standard spelling ትቷቸው.'
  naturalness: The revised wording is modern, clear, and suitably dignified Amharic. “ክፉና አመንዝራ ትውልድ” is natural in biblical-register modern Amharic, and “ትቷቸው ሄደ” reads smoothly.
  terminology: ትውልድ, ክፉ, አመንዝራ, ምልክት, and የዮናስ ምልክት are appropriate and source-faithful. The footnote retains the possible covenant-infidelity resonance without replacing the literal metaphor. The cross-reference note is adjusted to state Matthew 12:39–40 more precisely without making the main text interpretive.
  issues:
  - severity: low
    issue: Addition of “ሌላ” in “ሌላ ምልክት አይሰጠውም.”
    rationale: The source reads “no sign will be given to it except the sign of Jonah.” Although the exception logically distinguishes Jonah’s sign, “another” is not expressed and is best omitted for optimal equivalence.
  - severity: low
    issue: Cross-reference footnote is imprecise.
    rationale: Matthew 12:39–40 specifically compares Jonah’s three days and three nights in the belly of the great fish with the Son of Man’s three days and three nights in the heart of the earth. The revised note states this comparison rather than broadly calling it a pattern.
