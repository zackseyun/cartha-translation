id: MAT.16.17
reference: Matthew 16:17
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸂ἀποκριθεὶς δὲ⸃ ὁ Ἰησοῦς εἶπεν αὐτῷ· Μακάριος εἶ, Σίμων Βαριωνᾶ, ὅτι σὰρξ καὶ αἷμα οὐκ ἀπεκάλυψέν σοι ἀλλ’ ὁ πατήρ μου ὁ ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/017.yaml
  text: And Jesus answered him[a], “Blessed are you, Simon Bar-Jonah, because flesh and blood did not reveal this to you[c][b], but my Father who is in heaven did.”
translation:
  language: am
  text: ኢየሱስም መልሶ፣ “ስምዖን ባርዮና[a] ሆይ፣ ሥጋና ደም[b] ይህን ሳይሆን በሰማያት ያለው አባቴ ስለገለጠልህ፣ የተባረክህ ነህ!” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የዮና ልጅ ስምዖን።” ‘ባርዮና’ በአረማይክ የአባት ስምን የሚያሳይ አገላለጽ ነው።
    reason: lexical_alternative
  - marker: b
    text: “ሥጋና ደም” እዚህ ሰዎችን ወይም ሰብአዊ ምንጭን የሚያመለክት ፈሊጥ ነው።
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν αὐτῷ
  choice: ኢየሱስም መልሶ ... አለው
  rationale: የግሪኩን ‘መልሶ አለው’ የሚለውን ሴማዊ አገላለጽ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ δέ የትረካ ቅጥሉን በ‘ም’ ያሳያል።
- source_word: Μακάριος
  choice: የተባረክህ ነህ
  rationale: ከሥነ ልቦናዊ ‘ደስተኛ’ ይልቅ የመለኮታዊ ሞገስንና በረከትን የሚያሳይ ሲሆን፣ ለዘመናዊ አንባቢም ግልጽ ነው።
- source_word: Σίμων Βαριωνᾶ
  choice: ስምዖን ባርዮና
  rationale: በግሪኩ የተጠበቀውን የአረማይክ የአባት ስም ቅርጽ በፊደል ዝውውር ይጠብቃል፤ ትርጉሙ በማስታወሻ ቀርቧል።
- source_word: ὅτι
  choice: ነውና
  rationale: የስምዖን መባረክ ምክንያቱን በተፈጥሯዊ የአማርኛ ምክንያታዊ አያያዝ ይገልጣል።
- source_word: σὰρξ καὶ αἷμα
  choice: ሥጋና ደም
  rationale: የሰውን ምንጭ ወይም የሰውን አስተምህሮ የሚያመለክተውን ፈሊጣዊ አገላለጽ ቃል በቃል በሚታወቅ መልኩ ይጠብቃል።
- source_word: ἀπεκάλυψέν σοι
  choice: ይህን የገለጠልህ
  rationale: ‘ገለጠ’ የመለኮታዊ መግለጥን ድምፀት ይጠብቃል፤ ‘ይህን’ ከቀደመው የጴጥሮስ ኑዛዜ የተረዳ ሙላት ነው።
- source_word: ἀλλ’ ὁ πατήρ μου
  choice: ሳይሆን ... አባቴ ነው
  rationale: በሰው ምንጭና በአብ መግለጥ መካከል ያለውን ጠንካራ ንጽጽር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: በሰማያት ያለው
  rationale: የግሪኩን ብዙ ቁጥር ‘በሰማያት’ ይጠብቃል፣ የተወሰነው ሐረግም አብን በግልጽ ይገልጣል።
theological_decisions:
- issue: የስምዖን ኑዛዜ ምንጭ
  choice: ‘ሥጋና ደም’ የሚያመለክተውን ሰብአዊ ምንጭ ከአብ መግለጥ ጋር ማነጻጸር
  alternative: አገላለጹን የስምዖን የግል አስተሳሰብ ብቻ ወይም አንድ የሰው አስተማሪ ብቻ እንደሚያመለክት መጥበብ
  rationale: ጽሑፉ ሰብአዊ ምንጭን በሰፊው አስወግዶ ግንዛቤውን ለአብ መግለጥ ይሰጣል፤ ትርጉሙ ከጽሑፉ በላይ የተሟላ የመነሳሳት ትምህርት አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘የተባረክህ ነህ’ ከጥንታዊው ‘ብፁዕ ነህ’ ይልቅ ወቅታዊ ግልጽነትን ሲሰጥ የሃይማኖታዊ ክብደቱን ይጠብቃል።
