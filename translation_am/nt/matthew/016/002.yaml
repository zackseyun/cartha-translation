  yaml_path: translation/nt/matthew/016/002.yaml
  text: But he answered and said to them[a], “When evening comes, you say, ‘Fair weather, for the sky is red.’
translation:
  language: am
  text: እርሱ ግን መልሶ እንዲህ አላቸው፤ “ምሽት ሲሆን፣ ‘ሰማዩ ቀይ ነውና አየሩ ጥሩ ይሆናል’ ትላላችሁ።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: መልሶ እንዲህ አላቸው
  rationale: የግሪኩን የመልስ ንግግር ቀመር በተፈጥሯዊና በክብር ባለው ዘመናዊ አማርኛ ያቀርባል።
- source_word: Ὀψίας γενομένης
  choice: ማታ ሲሆን
  rationale: ጊዜን የሚገልጸውን የግሪክ አገባብ ቀጥተኛና ተፈጥሯዊ በሆነ አማርኛ ይወክላል።
- source_word: λέγετε
  choice: ትላላችሁ
  rationale: የተለመደ ወይም ተደጋጋሚ አነጋገርን የሚያመለክተውን የአሁን ጊዜ ኃይል ያስተላልፋል።
- source_word: Εὐδία
  choice: የአየር ሁኔታው መልካም ይሆናል
  rationale: ቃሉ ምቹና ጥሩ የአየር ሁኔታን ያመለክታል፤ ይህ አተረጓጎም በአማርኛ የአየር ትንበያ አነጋገር ተፈጥሯዊ ነው።
- source_word: πυρράζει
  choice: ቀልቷል
  rationale: የሰማዩን ቀይ መልክ በአጭርና በተለመደ አማርኛ ይገልጻል።
- source_word: οὐρανός
  choice: ሰማዩ
  rationale: በዚህ የአየር ሁኔታ አውድ ውስጥ የሚታየውን ሰማይ ያመለክታል፤ የአማርኛው ‘ሰማይ’ በዚህ አውድ ግልጽ ነው።
