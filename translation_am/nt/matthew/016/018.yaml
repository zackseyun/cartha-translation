review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys Jesus’ emphatic response, Peter’s name, the building metaphor, Jesus’ possession of the church, and the imagery of the gates of Hades/the realm of the dead. However, ταύτῃ agrees with the feminine noun πέτρᾳ; the Amharic demonstrative should likewise be feminine: በዚች ዓለት ላይ, not በዚህ ዓለት ላይ. The enclitic -ም on በዚህም is also unsupported as attached to the phrase and is best omitted.'
  naturalness: The wording is generally clear, modern, and suitably dignified. እኔም እልሃለሁ and አያሸንፏትም are natural. Correcting the feminine agreement makes the sentence idiomatic as well as grammatically sound.
  terminology: ጴጥሮስ, ዓለት, ቤተ ክርስቲያኔን, and የሙታን ዓለም are appropriate. The Greek transliteration in note b should be ሐዴስ rather than ሐዲስ, which can suggest a different, familiar loanword. The note should retain the distinction between Hades and final punishment.
  issues:
  - severity: medium
    issue: Gender disagreement in the demonstrative before ዓለት
    rationale: The draft has በዚህ(ም) ዓለት, but ዓለት is feminine in standard Amharic. The natural and grammatically concordant form is በዚች ዓለት ላይ. This also reflects Greek ταύτῃ τῇ πέτρᾳ, whose demonstrative and noun are feminine.
  - severity: low
    issue: Unnecessary enclitic -ም in በዚህም ዓለት
    rationale: The Greek καί joins the preceding and following clauses; it does not require an additive ‘also’ attached to ‘this rock.’ Omitting -ም produces a more precise and natural Amharic construction.
  - severity: low
    issue: Greek name in footnote b is transliterated as ሐዲስ
    rationale: For ᾅδης, ሐዴስ is the appropriate transliteration. ሐዲስ can be read as a different term and weakens lexical clarity.
  revised_text: እኔም እልሃለሁ፤ አንተ ጴጥሮስ ነህ፣ በዚች ዓለት[a] ላይ ቤተ ክርስቲያኔን እገነባለሁ፤ የሙታን ዓለም[b] ደጆችም አያሸንፏትም።
