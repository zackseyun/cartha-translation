  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: κἀγὼ δέ σοι λέγω ὅτι σὺ εἶ Πέτρος, καὶ ἐπὶ ταύτῃ τῇ πέτρᾳ οἰκοδομήσω μου τὴν ἐκκλησίαν, καὶ πύλαι ᾅδου οὐ κατισχύσουσιν αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/018.yaml
  text: And I also say to you that you are Peter[a], and on this rock I will build my church[b], and the gates of Hades will not prevail against it.
translation:
  language: am
  text: እኔም እልሃለሁ፤ አንተ ጴጥሮስ ነህ፣ በዚች ዓለት[a] ላይ ቤተ ክርስቲያኔን እገነባለሁ፤ የሙታን ዓለም[b] ደጆችም አያሸንፏትም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክኛ ‘ጴጥሮስ’ (Πέτρος) እና ‘ዓለት’ (πέτρα) የተዛመዱ ቃላት ናቸው። ‘ይህች ዓለት’ ጴጥሮስን፣ የጴጥሮስን ኑዛዜ፣ ወይም ጴጥሮስን እንደ ኑዛዜ ተናጋሪና የሐዋርያት ወኪል እንደሚያመለክት ሊተረጎም ይችላል።
    reason: alternative_reading
  - marker: b
    text: ግሪክኛ፦ ‘ሐዴስ’ (ᾅδης)፣ ማለትም የሙታን ዓለም። በአንዳንድ ባህላዊ ትርጉሞች ‘ሲኦል’ ወይም ‘ገሃነም’ ተብሎ ተተርጉሟል።
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ δέ σοι λέγω
  choice: እኔም እልሃለሁ
  rationale: κἀγώ የሚያሳየውን አጽንዖትና ለጴጥሮስ ንግግር የሚሰጠውን ምላሽ በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: Πέτρος
  choice: ጴጥሮስ
  rationale: በአማርኛ የተለመደውን የስሙን አጻጻፍ ይጠቀማል፤ ከπέτρα ጋር ያለው የቃል ጨዋታ በማስታወሻው ተገልጿል።
- source_word: ἐπὶ ταύτῃ τῇ πέτρᾳ
  choice: በዚህ ዓለት ላይ
  rationale: የἐπίን የመሠረት ምስልና የταύτῃን አመልካች ኃይል ይጠብቃል፤ የዓለቱን ማንነት ግን በትርጉሙ አይወስንም።
- source_word: οἰκοδομήσω
  choice: እገነባለሁ
  rationale: የግንባታውን ዘይቤና የወደፊት ጊዜ አገላለጽ በቀጥታ ያቆያል።
- source_word: μου τὴν ἐκκλησίαν
  choice: ቤተ ክርስቲያኔን
  rationale: የኢየሱስ የሆነውን ማኅበረሰብ በዘመናዊ አማርኛ በተለመደው ቃል ይገልጣል፤ የመጀመሪያ መደብ ባለቤትነትም በ‘-ዬ’ ተጠብቋል።
- source_word: πύλαι ᾅδου
  choice: የሙታን ዓለም ደጆች
  rationale: ᾅδηςን ከመጨረሻው የቅጣት ስፍራ ጋር ሳያደባልቅ ‘የሙታን ዓለም’ ብሎ ይገልጣል፤ የደጆቹን ምስልም ያቆያል።
- source_word: οὐ κατισχύσουσιν αὐτῆς
  choice: አያሸንፏትም
  rationale: κατισχύω ያለውን የማሸነፍ፣ የመብለጥ ወይም የማ overpower ትርጉም በተፈጥሯዊና ግልጽ አማርኛ ያቀርባል፤ የተውላጠ ስሙ ተመላሽም ቤተ ክርስቲያን ናት።
theological_decisions:
- issue: ‘ይህ ዓለት’ የሚያመለክተው
  choice: በዋናው ጽሑፍ ‘በዚህ ዓለት ላይ’ ተብሎ ሳይፈታ ተቀምጧል።
  alternative: ጴጥሮስ ራሱ፣ የጴጥሮስ እምነት ኑዛዜ፣ ወይም ጴጥሮስ እንደ እምነት መስካሪና የሐዋርያት ወኪል
  rationale: ግሪኩ በΠέτροςና πέτρα መካከል ያለውን የቃል ጨዋታ ያሳያል፣ የአመልካቹን ትርጓሜ ግን ትርጉሙ ከጽሑፉ በላይ እንዲወስን አያስገድድም።
- issue: የᾅδης ትርጉም
  choice: የሙታን ዓለም
  alternative: ሐዲስ፣ ሲኦል፣ ወይም ሲኦል/ገሃነም በባህላዊ አጠቃቀም
  rationale: ቃሉ በዚህ አውድ የሙታንን ግዛት ያመለክታል፤ ‘ገሃነም’ ማለት የመጨረሻ ቅጣትን የሚመለከት ትርጉም በጽሑፉ ላይ ሊጭን ይችላል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግንባታና የደጆች ዘይቤዎች ተጠብቀዋል፤ አከራካሪው የ‘ዓለት’ አመልካች በዋናው ጽሑፍ አልተወሰነም።
