review_pass:
  verdict: revise
  source_fidelity: The draft preserves the mild contrast (ግን), the twofold warning, the figurative noun ζύμη, and both group names. However, ንቁ primarily means “be awake/vigilant” and is less direct than the warning force of Ὁρᾶτε in this paired imperative.
  naturalness: The sentence is generally clear and dignified. Replacing ንቁ with ተመልከቱ gives a more idiomatic warning pair in this context while retaining the rhetorical doubling.
  terminology: እርሾ appropriately retains the leaven metaphor, and ፈሪሳውያን / ሰዱቃውያን are standard Amharic biblical forms. The footnote accurately identifies the literal sense and does not prematurely put “teaching” into the verse.
  issues:
  - severity: low
    issue: ንቁ is slightly imprecise for Ὁρᾶτε in this warning formula.
    rationale: Although it can convey vigilance, ንቁ most readily denotes being awake. Ὁρᾶτε functions here as “look/watch out,” paired with προσέχετε (“beware”). ተመልከቱ more directly expresses the first imperative without collapsing the second.
  revised_text: ኢየሱስ ግን፣ “ተመልከቱ፤ ከፈሪሳውያንና ከሰዱቃውያን እርሾ[a] ተጠንቀቁ” አላቸው።
