id: MAT.16.6
reference: Matthew 16:6
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ὁρᾶτε καὶ προσέχετε ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/006.yaml
  text: But Jesus said to them[a], “Watch out and beware of the leaven of the Pharisees and Sadducees.”
translation:
  language: am
  text: ኢየሱስ ግን፣ “ተመልከቱ፤ ከፈሪሳውያንና ከሰዱቃውያን እርሾ[a] ተጠንቀቁ” አላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክኛው ያለው ቃል ሊጥን የሚያቦካውን ‘እርሾ’ ያመለክታል። ኢየሱስ ይህን ቃል በዘይቤ የተጠቀመ ሲሆን፣ ትርጉሙን በቀጣዩ አውድ ያብራራል።
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ግን
  rationale: ከቀደመው ንግግር ጋር ያለውን ቀላል ንፅፅርና የሐሳብ ሽግግር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: εἶπεν αὐτοῖς
  choice: አላቸው
  rationale: የግሪኩን ‘ለእነርሱ አለ’ ትርጉም በተለመደና ክብር ባለው የአማርኛ አነጋገር ያቀርባል።
- source_word: Ὁρᾶτε
  choice: ንቁ
  rationale: በዚህ አውድ ግሱ በዓይን ማየትን ሳይሆን ነቅቶ መጠበቅን የሚያዝ ማስጠንቀቂያ ነው።
- source_word: προσέχετε ἀπὸ
  choice: ከ… ተጠንቀቁ
  rationale: ከአንድ ነገር ራስን መጠበቅን በተፈጥሯዊ አማርኛ ይገልጣል፤ ከ‘ንቁ’ ጋር የማስጠንቀቂያውን ድርብ አጽንዖትም ይጠብቃል።
- source_word: ζύμης
  choice: እርሾ
  rationale: ቃሉ ሊጥን የሚያቦካውን እርሾ ይጠቁማል፤ በዚህ ጥቅስ ያለውን ዘይቤ ትርጉሙን ቀድሞ ሳይፈታ ይጠብቃል።
- source_word: Φαρισαίων καὶ Σαδδουκαίων
  choice: ፈሪሳውያንና ሰዱቃውያን
  rationale: የሁለቱን ቡድኖች ስም በአማርኛ የተለመደውን አጻጻፍ ተከትሎ ያቀርባል።
theological_decisions:
- issue: የ‘እርሾ’ ዘይቤያዊ ኃይል
  choice: ‘እርሾ’ የሚለውን ዘይቤ በዋናው ጽሑፍ ሳይፈታ ማቆየት
  alternative: ትምህርት ወይም ተጽእኖ ብሎ በቀጥታ መተርጎም
  rationale: በቀጣዩ አውድ ዘይቤው ይብራራል፤ ይህ ጥቅስ ግን ζύμη የሚለውን ምስላዊ ቃል ራሱን ይጠቀማል። ስለዚህ ትርጉሙን አስቀድሞ መፍታት ሳያስፈልግ የምንጩን ዘይቤና የትረካውን እድገት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ንቁ፤ … ተጠንቀቁ’ የሚለው አቀራረብ የግሪኩን ሁለት ተከታታይ ትእዛዞች በተፈጥሯዊ መልኩ ይጠብቃል።
