- from: እስካሁን አልገባችሁምን? ወይስ ለአምስቱ ሺህ ሰዎች የነበሩትን አምስት እንጀራዎችና ስንት ቅርጫት እንደሰበሰባችሁ አታስታውሱምን?
  to: እስካሁን አትረዱምን? ለአምስት ሺህ ሰዎች የነበሩትን አምስቱን እንጀራዎችና ስንት ቅርጫቶች እንደሰበሰባችሁ ደግሞ አታስታውሱምን?
  rationale: 'The revision corrects the misleading alternative connector while preserving the Greek’s two coordinated rhetorical questions. It also uses a more direct formal rendering for νοεῖτε. No footnote is required: both “still not” and “not yet” are naturally encompassed by እስካሁን in this context, and ሰበሰባችሁ is contextually clear.'
