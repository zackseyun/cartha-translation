id: MAT.16.9
reference: Matthew 16:9
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὔπω νοεῖτε, οὐδὲ μνημονεύετε τοὺς πέντε ἄρτους τῶν πεντακισχιλίων καὶ πόσους κοφίνους ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/009.yaml
  text: Do you still not understand[a], nor do you remember the five loaves for the five thousand[b], and how many baskets you gathered?
translation:
  language: am
  text: እስካሁን አትረዱምን? ለአምስት ሺህ ሰዎች የነበሩትን አምስቱን እንጀራዎችና ስንት ቅርጫቶች እንደሰበሰባችሁ ደግሞ አታስታውሱምን?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὔπω
  choice: እስካሁን አል…ም
  rationale: የጊዜውን ኃይል፣ ‘እስካሁንም አል…’ ወይም ‘ገና አል…’ የሚለውን፣ በተፈጥሯዊ የአማርኛ የነቀፋ ጥያቄ ያስተላልፋል።
- source_word: νοεῖτε
  choice: ገባችሁ
  rationale: በዐውዱ የቀደሙትን ክስተቶች ትርጉም በአእምሮ መረዳትን ያመለክታል፤ ‘ገባችሁ’ በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: οὐδὲ
  choice: ወይስ … አታስታውሱምን
  rationale: ሁለቱን አሉታዊ የንግግር ጥያቄዎች በተፈጥሯዊ አማርኛ ያያይዛል፤ በዚህ አገባብ ‘ወይስ’ የምርጫ ጥያቄ ሳይሆን የተያያዘ ነቀፋ ያሳያል።
- source_word: μνημονεύετε
  choice: ታስታውሳላችሁ
  rationale: የቀደመውን የመመገብ ክስተት በአእምሮ ማስታወስን በቀጥታ ይገልጣል።
- source_word: τοὺς πέντε ἄρτους
  choice: አምስት እንጀራዎች
  rationale: ἄρτος በዚህ ዐውድ የዳቦ እንጀራ/እንጀራ ነው፤ ‘እንጀራዎች’ የአምስቱን የተቆጠሩ ሙሉ እንጀራዎች ምስል ይጠብቃል።
- source_word: τῶν πεντακισχιλίων
  choice: ለአምስቱ ሺህ ሰዎች የነበሩትን
  rationale: የግሪኩን የዝምድና ቅጽ በዐውዱ መሠረት አምስቱ እንጀራዎች ለአምስት ሺህ ሰዎች የተጠቀሙበት መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: πόσους κοφίνους
  choice: ስንት ቅርጫት
  rationale: የቅርጫቶቹን ቁጥር የሚጠይቀውን ተጨባጭ ምስል በቀጥታ ይጠብቃል።
- source_word: ἐλάβετε
  choice: እንደሰበሰባችሁ
  rationale: λαμβάνω በመሠረቱ ‘ወሰዳችሁ/ተቀበላችሁ’ ሊሆን ቢችልም፣ በምግቡ ትረካ ዐውድ የተረፈውን ወደ ቅርጫት መሰብሰብን በግልጽ ያስተላልፋል።
