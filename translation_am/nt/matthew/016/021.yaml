  text: Ἀπὸ τότε ἤρξατο ⸂ὁ Ἰησοῦς⸃ δεικνύειν τοῖς μαθηταῖς αὐτοῦ ὅτι δεῖ αὐτὸν ⸂εἰς Ἱεροσόλυμα ἀπελθεῖν⸃ καὶ πολλὰ παθεῖν ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων καὶ ἀποκτανθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ἐγερθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/021.yaml
  text: From that time Jesus began to show his disciples that he must go to Jerusalem and suffer many things from the elders and chief priests and scribes[a], and be killed[c][b], and on the third day be raised.
translation:
  language: am
  text: ከዚያን ጊዜ ጀምሮ ኢየሱስ ወደ ኢየሩሳሌም ሄዶ ከሽማግሌዎች፣ ከየካህናት አለቆችና ከጸሐፍት[b] ብዙ መከራዎችን እንዲቀበል[a]፣ እንዲገደል፣ በሦስተኛውም ቀን እንዲነሣ[c] እንዳለበት ለደቀ መዛሙርቱ ማሳየት ጀመረ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “ብዙ ነገሮችን መሠቃየት”፤ ይህም የመከራዎቹን ብዛትና ልዩ ልዩነት ያጎላል።
    reason: lexical_alternative
  - marker: b
    text: “በሽማግሌዎች፣ በካህናት አለቆችና በጸሐፍት እጅ” ተብሎም ሊተረጎም ይችላል።
    reason: alternative_reading
  - marker: c
    text: የግሪኩ ቃል ተደራጊ ነው፤ “እንዲነሣ” የሚለው በአማርኛ ተፈጥሯዊ አገላለጽ ነው፣ ነገር ግን የተደራጊውን ቅርጽ ሙሉ በሙሉ አያሳይም።
    reason: lexical_alternative
