- source_word: πρεσβυτέρων
  choice: ሽማግሌዎች
  rationale: በዐውደ ንባቡ ያሉትን የአይሁድ ሕዝብ አመራር ቡድን በቀጥታ የሚገልጽ የተለመደ ቃል ነው።
- source_word: ἀρχιερέων
  choice: ካህናት አለቆች
  rationale: ብዙ ሊቃነ ካህናት በአንድ ጊዜ ሥልጣን ላይ እንዳሉ ሳያስመስል፣ የካህናትን ገዢ ቡድን ይገልጻል።
