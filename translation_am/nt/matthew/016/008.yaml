id: MAT.16.8
reference: Matthew 16:8
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς ⸀εἶπεν· Τί διαλογίζεσθε ἐν ἑαυτοῖς, ὀλιγόπιστοι, ὅτι ἄρτους οὐκ ⸀ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/008.yaml
  text: But Jesus[a], knowing this, said, “Why are you discussing among yourselves, you of little faith, that you have no bread?”
translation:
  language: am
  text: ኢየሱስም ይህን አውቆ፣ “እናንተ ትንሽ እምነት ያላችሁ፣ ‘እንጀራ አልወሰድንም’ ብላችሁ ለምን እርስ በርሳችሁ ትወያያላችሁ?” አላቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνοὺς
  choice: ይህን አውቆ
  rationale: የቀደመ ድርጊትን የሚያሳየውን የግስ አጋዥ ቅርጽ ይጠብቃል፤ በግሪክ ያልተገለጸው ቀጥተኛ ተሳቢ ከአውዱ ‘ይህን’ ተብሎ ተሟልቷል።
- source_word: δὲ
  choice: -ም
  rationale: በትረካው ውስጥ ያለውን ለስላሳ ሽግግር በተፈጥሯዊ የአማርኛ አያያዥ ያሳያል።
- source_word: Τί διαλογίζεσθε
  choice: ለምን … ትወያያላችሁ?
  rationale: Τί እዚህ የውይይታቸውን ምክንያት ይጠይቃል፤ διαλογίζεσθε ደግሞ በመካከላቸው የሚደረግ ውይይትን ያመለክታል።
- source_word: ἐν ἑαυτοῖς
  choice: እርስ በርሳችሁ
  rationale: ሐረጉ በውስጣቸው ማሰብንም ሆነ በመካከላቸው መወያየትን ሊያመለክት ቢችልም፣ ቅርብ አውዱ የደቀ መዛሙርቱን የጋራ ውይይት ይደግፋል።
- source_word: ὀλιγόπιστοι
  choice: እናንተ እምነታችሁ ያነሰ
  rationale: ቀጥተኛውን የጥሪ ወቀሳና የእምነት ማነስን ሳያሰፋ ይገልጣል።
- source_word: ὅτι
  choice: ስለ-
  rationale: ከጥያቄው ጋር በአማርኛ ተፈጥሯዊ ሆኖ የውይይታቸውን መነሻ ያቀርባል፤ በዚህ አወቃቀር የይዘትና የምክንያት ንባቦች በከፊል ክፍት ይቀራሉ።
- source_word: ἄρτους οὐκ ἐλάβετε
  choice: እንጀራ ስላልያዛችሁ
  rationale: የλαμβάνωን ‘መውሰድ/መያዝ’ ሐሳብ ከጉዞው አውድ ጋር በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ἄρτους በአማርኛ በተለመደው የጋራ ስም ‘እንጀራ’ ተተርጉሟል።
theological_decisions:
- issue: የὀλιγόπιστοι ወቀሳ ኃይል
  choice: የደቀ መዛሙርቱን የእምነት ማነስ በቀጥታ የሚወቅስ አገላለጽ
  alternative: እምነትን ሳይጠቅስ እንደ ቀላል አለመረዳት ብቻ ማቅረብ
  rationale: የግሪኩ ቃል በዚህ ሁኔታ ያላቸውን በቂ ያልሆነ እምነት/መታመን በቀጥታ ይተቻል፤ ትርጉሙ ይህን ኃይል ይጠብቃል እንጂ ሰፊ የእምነት ትምህርት አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “እንጀራ” እዚህ በሰፊው የዳቦ ምግብን የሚወክል ተፈጥሯዊ ቃል ነው።
