revisions:
- from: ኢየሱስም ይህን አውቆ፣ “እናንተ እምነታችሁ ያነሰ፣ እንጀራ ስላልያዛችሁ[a] ለምን እርስ በርሳችሁ ትወያያላችሁ?” አላቸው።
  to: ኢየሱስም ይህን አውቆ፣ “እናንተ ትንሽ እምነት ያላችሁ፣ ‘እንጀራ አልወሰድንም’ ብላችሁ ለምን እርስ በርሳችሁ ትወያያላችሁ?” አላቸው።
