    reason: የἄρτους ብዙ ቁጥርን እና የἐλάβετε ቀጥተኛ የ“መውሰድ” ሐሳብን ያሳያል።
  revision_rationale: The revision makes the disciples’ concern the stated content of their discussion, rather than merely a reason for it. It also uses a more natural modern-Amharic vocative for the direct rebuke. The source’s “take” verb is retained; no doctrinal interpretation is added.
