base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/011.yaml
  text: How do you not understand that I did not speak to you about bread? But beware of the leaven of the Pharisees and Sadducees[a][b].
translation:
  language: am
  text: ስለ ዳቦዎች እንዳልነገርኳችሁ እንዴት አታስተውሉም? ነገር ግን ከፈሪሳውያንና ከሰዱቃውያን እርሾ ራሳችሁን ጠብቁ።[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከፈሪሳውያንና ከሰዱቃውያን እርሾ ተጠንቀቁ።”
    reason: lexical_alternative
  - marker: b
    text: እዚህ “እርሾ” ዘይቤ ነው፤ በቀጣዩ ቁጥር የፈሪሳውያንና የሰዱቃውያን “ትምህርት” እንደሆነ ተብራርቷል።
    reason: cross_reference
lexical_decisions:
- source_word: πῶς οὐ νοεῖτε
  choice: እንዴት አታስተውሉም?
  rationale: πῶς ከአሉታዊው οὐ እና νοεῖτε ጋር የተሰጠውን ሐሳብ አለመገንዘባቸውን የሚገሥጽ ጥያቄ ነው። “አታስተውሉም” ማስተዋልንና የንግግሩን ፍሬ መያዝን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ὅτι οὐ περὶ ἄρτων εἶπον ὑμῖν
  choice: ስለ እንጀራ እንዳልነገርኳችሁ
  rationale: ἄρτων ብዙ ቁጥር ቢሆንም በዚህ ዐውድ አማርኛ “እንጀራ”ን በአጠቃላይ የምግብ ዳቦ ትርጉም መጠቀሙ ተፈጥሯዊ ነው። εἶπον ὑμῖν “እንዳልነገርኳችሁ” ተብሎ ቀጥተኛ የንግግር ሐሳቡን ይጠብቃል።
- source_word: προσέχετε δὲ
  choice: ነገር ግን … ተጠንቀቁ
  rationale: προσέχετε እዚህ ቀላል ትኩረትን ሳይሆን ከአደጋ የሚያስጠነቅቅ ትእዛዝ ነው። δέ የማረሚያ ንጽጽሩን “ነገር ግን” በሚለው ያሳያል።
- source_word: ἀπὸ τῆς ζύμης
  choice: ከ… እርሾ
  rationale: ἀπό ከπροσέχετε ጋር ከአንድ ነገር መጠንቀቅን ያመለክታል። “እርሾ” የζύμηን ቀጥተኛ ትርጉምና ዘይቤያዊ ኃይል አብሮ ይጠብቃል።
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: የፈሪሳውያንና የሰዱቃውያን
  rationale: ለሁለቱ የአይሁድ ቡድኖች በአማርኛ የተለመዱት ስያሜዎች ተጠቅመዋል። የባለቤትነት/የዝምድና አገባቡ እርሾው የእነርሱ ባሕርይ ያለው መሆኑን ይገልጻል።
theological_decisions:
- issue: “እርሾ” የሚለው ዘይቤያዊ አገላለጽ
  choice: በዋናው ጽሑፍ “እርሾ” የሚለውን ዘይቤ እንዳለ ማቆየት
  alternative: “ከፈሪሳውያንና ከሰዱቃውያን ትምህርት ተጠንቀቁ” ብሎ በቀጥታ መግለጽ
  rationale: ቀጣዩ ቁጥር ዘይቤውን እንደ “ትምህርት” ያብራራዋል፤ ይህ ቁጥር ግን ζύμη በሚለው ዘይቤ ይናገራል። ዘይቤውን ማቆየት የምንጩን አገላለጽና የትረካውን እድገት ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። “አታስተውሉም?” የገሥጻዊውን ጥያቄ ኃይል፣ “ተጠንቀቁ” ደግሞ የማስጠንቀቂያውን ትእዛዝ ይጠብቃሉ።
