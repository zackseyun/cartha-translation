  text: καὶ πρωΐ· Σήμερον χειμών, πυρράζει γὰρ στυγνάζων ὁ οὐρανός. ⸀τὸ μὲν πρόσωπον τοῦ οὐρανοῦ γινώσκετε διακρίνειν, τὰ δὲ σημεῖα τῶν καιρῶν οὐ δύνασθε.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/003.yaml
  text: And in the morning[a], ‘Today, stormy weather, for the sky is red and overcast.’ You know how to discern the appearance of the sky[b], but you are not able to discern the signs of the times.
translation:
  language: am
  text: በማለዳም፣ “ዛሬ አየሩ ይከፋል፤ ሰማዩ ቀይና ደመናማ ስለሆነ” ትላላችሁ። የሰማዩን ገጽታ[a] መለየት ታውቃላችሁ፤ የዘመናትን ምልክቶች[b] ግን መለየት አትችሉም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “የሰማዩን ፊት።”
    reason: lexical_alternative
  - marker: b
    text: “የዘመናት ምልክቶች” የአሁኑን ጊዜ መንፈሳዊ ፋይዳ፣ የኢየሱስን የመሲሕነት ሥራዎችም ጨምሮ፣ በተለየ ሁኔታ ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: πρωΐ
  choice: በማለዳ
  rationale: ጊዜን የሚገልጠውን ተውሳከ ግስ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: χειμών
  choice: ማዕበል
  rationale: በዚህ አውድ ቃሉ የክረምትን ወቅት ሳይሆን የተናወጠ መጥፎ የአየር ሁኔታን ያመለክታል።
- source_word: πυρράζει
  choice: ቀልቶ
  rationale: የሰማዩን ቀይ መልክ በአጭርና ተፈጥሯዊ አገላለጽ ይጠብቃል።
- source_word: στυγνάζων
  choice: ደመናማ
  rationale: የሰማዩን የጠቆረና የተደበበ ሁኔታ በአየር ንብረት አውድ ግልጽ ያደርጋል።
- source_word: πρόσωπον
  choice: ገጽታ
  rationale: ቀጥተኛው ‘ፊት’ የሚለው ትርጉም በዚህ ፈሊጥ የሚያመለክተውን የሰማዩን የሚታይ መልክ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: γινώσκετε διακρίνειν
  choice: መለየት ታውቃላችሁ
  rationale: የተማረ ችሎታንና በምልክት ላይ ተመሥርቶ መመዘንን የግሪኩን ድርብ ኃይል ይጠብቃል።
- source_word: σημεῖα
  choice: ምልክቶች
  rationale: በማቴዎስ አጠቃቀም ያለውን ማስረጃዊና መገለጫዊ ስፋት ይጠብቃል።
- source_word: καιρῶν
  choice: የዘመናትን
  rationale: ከወቅታዊ አየር ሁኔታ ይልቅ ልዩ ትርጉም ያላቸውን ጊዜያት ወይም ዘመናት ያመለክታል፤ የቃሉን ስፋትም አያጠብም።
- source_word: οὐ δύνασθε
  choice: መለየት አትችሉም
  rationale: በግልጽ የተገለጸውን አለመቻል ይጠብቃል፤ ከቀደመው ሐረግ ጋር ያለውን ንጽጽርም ያጎላል።
theological_decisions:
- issue: “የዘመናት ምልክቶች” የሚለው ሐረግ ወሰን
  choice: ሐረጉን ሰፊ ትርጉሙን እንደያዘ ማቆየት
  alternative: የመሲሑ ዘመን ምልክቶች ወይም የፍጻሜ ዘመን ምልክቶች ብሎ ማጥበብ
  rationale: ግሪኩ የአሁኑን ጊዜ መንፈሳዊ ፋይዳ፣ የኢየሱስን የመሲሕነት ሥራዎችና ምናልባትም የፍጻሜ ዘመን አንድምታን ሊያካትት ይችላል፤ ትርጉሙ ይህን ውጥረት ሳይፈታ ያቆየዋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የአየር ትንበያው ንግግራዊ ተፈጥሯዊነት እንዲኖረው ሲደረግ፣ የሁለተኛው ሐረግ ግሳጼና ንጽጽር ተጠብቋል።
