  text: ὃς γὰρ ⸀ἐὰν θέλῃ τὴν ψυχὴν αὐτοῦ σῶσαι ἀπολέσει αὐτήν· ὃς δ’ ἂν ἀπολέσῃ τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/025.yaml
  text: For whoever wants to save his life will lose it[a], but whoever loses his life for my sake will find it.
translation:
  language: am
  text: ሕይወቱን[a] ሊያድን የሚፈልግ ሁሉ ያጣታልና፤ ስለ እኔ ሕይወቱን የሚያጣ ሁሉ ግን ያገኛታል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ ψυχή እንደ አውዱ ‘ሕይወት’፣ ‘ነፍስ’ ወይም ‘ራስ’ ማለት ሊሆን ይችላል፤ በዚህ ቁጥር በሁለቱም ስፍራ ‘ነፍሱን’ ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἐὰν / ὃς δ’ ἂν
  choice: የሚፈልግ ሁሉ ... የሚያጣ ሁሉ ግን
  rationale: የግሪኩ አጠቃላይ ሁኔታዊ አነጋገር በተፈጥሯዊ አማርኛ ‘... ሁሉ’ ተብሎ ተሰጥቷል። γάρ በ‘-ና’ ከቀደመው ንግግር ጋር ተያይዟል፤ δέ ደግሞ ተቃርኖውን ለማሳየት ‘ግን’ ተብሏል።
- source_word: θέλῃ
  choice: የሚፈልግ
  rationale: ፈቃድን ወይም ምኞትን በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ψυχὴν
  choice: ሕይወቱን
  rationale: በዚህ የደቀ መዝሙርነት አውድ ውስጥ ψυχή ከማዳን፣ ከማጣትና ከማግኘት ግሶች ጋር የሰውን ሕይወት ያመለክታል። ቃሉ ‘ነፍስ’ ወይም ‘ራስ’ የሚለውንም ፍቺ ሊይዝ ስለሚችል አማራጩ በማስታወሻ ተጠብቋል።
- source_word: σῶσαι
  choice: ሊያድን
  rationale: ‘ማዳን’ የግሱን መሠረታዊ ኃይል ይጠብቃል፤ ከ‘ማጣት’ ጋር ያለውን ተቃርኖም ግልጽ ያደርጋል።
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: ያጣታል / የሚያጣ
  rationale: በአውዱ ግሱ ሕይወትን ማጣትን እንጂ ማጥፋትን አያመለክትም። የመጀመሪያው የግሪክ የወደፊት ጊዜ በ‘ያጣታል’ ተጠብቋል፤ ሁለተኛው ሁኔታዊ አነጋገር ደግሞ ‘የሚያጣ’ ተብሎ ተፈጥሯዊ ሆኗል።
- source_word: ἕνεκεν ἐμοῦ
  choice: ስለ እኔ
  rationale: ምክንያትንና ለኢየሱስ ያለን ታማኝነት በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: εὑρήσει
  choice: ያገኛታል
  rationale: ‘ማግኘት’ የግሪኩን ቀጥተኛ ፍቺና የንግግሩን አያዎአዊ ኃይል ይጠብቃል።
theological_decisions:
