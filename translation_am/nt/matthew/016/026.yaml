id: MAT.16.26
reference: Matthew 16:26
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τί γὰρ ⸀ὠφεληθήσεται ἄνθρωπος ἐὰν τὸν κόσμον ὅλον κερδήσῃ τὴν δὲ ψυχὴν αὐτοῦ ζημιωθῇ; ἢ τί δώσει ἄνθρωπος ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/026.yaml
  text: For what will it profit a man if he gains the whole world but forfeits his life? Or what will a man give in exchange for his life?[a]
translation:
  language: am
  text: ሰው ዓለምን ሁሉ ቢያተርፍ፣ ሕይወቱን ግን ቢያጣ፣ ምን ይጠቅመዋል? ወይስ ሰው ለሕይወቱ ምትክ ምን ይሰጣል?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በሁለቱም ‘ሕይወት’ በተባለባቸው ስፍራዎች፣ ‘ነፍስ’ ተብሎም ሊተረጎም ይችላል። ψυχή የሚለው የግሪክኛ ቃል እንደ አውዱ ‘ሕይወት፣’ ‘ራስ’ ወይም ‘ነፍስ’ ማለት ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: ምን ይጠቅመዋል?
  rationale: τί የአጻጻፍ ጥያቄውን ያቀርባል፤ γάρ ከቀደመው ንግግር ጋር የሚያገናኝ ማብራሪያዊ ኃይል አለው። በአማርኛ የአንቀጹ ተከታታይነት እና የጥያቄው ቅርጽ ይህን ትስስር በተፈጥሮ ያሳያሉ።
- source_word: ὠφεληθήσεται
  choice: ይጠቅመዋል
  rationale: የወደፊት ጊዜ ተገብሮ ቅርጹ ጥቅም ማግኘትን ያመለክታል። ‘ምን ይጠቅመዋል?’ በዘመናዊ አማርኛ ተፈጥሯዊ ሆኖ የጥቅምን ሐሳብ ይጠብቃል።
- source_word: ἄνθρωπος
  choice: ሰው
  rationale: በግሪክኛው ወንድ ነጠላ ሰዋሰዋዊ ቅርጽ ቢኖረውም እዚህ ማንኛውንም ሰው በአጠቃላይ ይወክላል፤ ‘ሰው’ ይህን ትርጉም በትክክል ይሰጣል።
- source_word: τὸν κόσμον ὅλον
  choice: ዓለምን ሁሉ
  rationale: κόσμος እዚህ ዓለምን እንደ አጠቃላይ የትርፍ ነገር ያመለክታል፤ ὅλον ሙሉነቱን ያጠናክራል።
- source_word: κερδήσῃ
  choice: ቢያተርፍ
  rationale: κερδαίνω ማትረፍ ወይም ማግኘት ማለት ነው። ‘ቢያተርፍ’ ከጥቅምና ከኪሳራ ንግዳዊ ንጽጽር ጋር ይስማማል።
- source_word: τὴν δὲ ψυχὴν αὐτοῦ
  choice: ሕይወቱን ግን
  rationale: ψυχή እንደ አውዱ ሕይወትን፣ ራስን ወይም ነፍስን ሊያመለክት ይችላል። እዚህ ‘ሕይወት’ የሰውየውን ሙሉ ሕልውና በሰፊ መልኩ ይይዛል፤ ‘ነፍስ’ የሚለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ζημιωθῇ
  choice: ቢያጣ
  rationale: ζημιόω ኪሳራ መድረስን፣ ማጣትን ወይም መነጠቅን ሊያመለክት ይችላል። ‘ቢያጣ’ በአማርኛ ግልጽና ተፈጥሯዊ ሲሆን ከ‘ማትረፍ’ ጋር ያለውን ንጽጽር ይጠብቃል።
- source_word: ἀντάλλαγμα
  choice: ምትክ
  rationale: በምላሹ ወይም በቅያሪው የሚሰጥን ነገር ያመለክታል። ‘ለሕይወቱ ምትክ’ የልውውጥ ምስሉን ያለ ተጨማሪ ትርጓሜ ይጠብቃል።
theological_decisions:
- issue: በመጨረሻው ኪሳራ አውድ ψυχήን መተርጎም
  choice: ሕይወት
  alternative: ነፍስ
  rationale: ጥቅሱ ሰውነትንና ከሥጋ የተለየች ነፍስን የሚለይ ጠባብ ሥነ ሰብእ ትምህርት አያስገድድም። ‘ሕይወት’ የψυχήን ሰፊ የሕይወት/ራስ ትርጉም ይጠብቃል፤ ባህላዊና ትክክለኛ ሊሆን የሚችለው ‘ነፍስ’ ግን በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ አማርኛ። ሁለቱ የአጻጻፍ ጥያቄዎችና የማትረፍ/ማጣት/ምትክ ንጽጽር ተጠብቀዋል።
