id: MAT.16.24
reference: Matthew 16:24
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Τότε ὁ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Εἴ τις θέλει ὀπίσω μου ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/024.yaml
  text: Then Jesus said to his disciples[a], “If anyone wants to come after me, let him deny himself and take up his cross and follow me.”
translation:
  language: am
  text: ከዚያም ኢየሱስ ለደቀ መዛሙርቱ እንዲህ አላቸው፦ “ማንም ከእኔ በኋላ ሊመጣ ቢፈልግ፣ ራሱን ይካድ፣ መስቀሉንም ይሸከም፣ እኔንም ይከተል።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: ከዚያም
  rationale: በትረካው ውስጥ ቀጣዩን ክስተት የሚያስገባ የጊዜ እና የቅደም ተከተል አመልካች ነው።
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: ደቀ መዛሙርቱን
  rationale: በወንጌላት አውድ μαθηταί የመምህርና የተከታይን ግንኙነት ይገልጣል፤ ‘ደቀ መዛሙርት’ የተለመደና ትክክለኛ ቃል ነው።
- source_word: Εἴ τις θέλει
  choice: ማንም … ቢፈልግ
  rationale: የግሪኩን ሁኔታዊ አነጋገር፣ የፈቃድ ሐሳብና ሁሉን አካታች ክልል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὀπίσω μου ἐλθεῖν
  choice: ከእኔ በኋላ ሊመጣ
  rationale: የደቀ መዝሙርነትን ምስላዊ አነጋገር ይጠብቃል፤ በመጨረሻው ἀκολουθείτω ካለው ‘ይከተል’ ጋር አያዋህደውም።
- source_word: ἀπαρνησάσθω ἑαυτὸν
  choice: ራሱን ይካድ
  rationale: ወሳኝ ራስን የመካድ ጥሪውን በቀጥታና በተለመደ መጽሐፍ ቅዱሳዊ አገላለጽ ያቀርባል።
- source_word: ἀράτω τὸν σταυρὸν αὐτοῦ
  choice: መስቀሉን ይሸከም
  rationale: αἴρω ከመስቀል ጋር እዚህ ለመሸከም ማንሳትን ያመለክታል፤ ተፈጥሯዊው አማርኛ ‘ይሸከም’ የግለሰቡን መስቀልና ዋጋ ይጠብቃል።
- source_word: ἀκολουθείτω μοι
  choice: እኔንም ይከተል
  rationale: የአሁን ጊዜው ትእዛዝ ቀጣይነት ያለውን መከተል ይጠቁማል፤ በአማርኛ ‘ይከተል’ በደቀ መዝሙርነት አውድ ይህን በቂ ያስተላልፋል።
theological_decisions:
- issue: በግሪክ ያለው ነጠላ ተወካይ ሰዋሰውና ሁሉን አካታች ትርጉም
  choice: ‘ማንም’ የሚለውን ሁሉን አካታች ቃል ከነጠላ ግሶች ‘ቢፈልግ፣ ይካድ፣ ይሸከም፣ ይከተል’ ጋር መጠቀም
  alternative: ብዙ ቁጥር ወይም ፆታን በግልጽ የሚጠቅስ ተውላጠ ስም መጠቀም
  rationale: አማርኛ በእነዚህ የሦስተኛ መደብ ነጠላ ግሶች ፆታን ሳይገልጽ የግሪኩን ነጠላ ሰዋሰውና ሁሉን አካታች ትርጉም በተፈጥሯዊ ሁኔታ ማስተላለፍ ይችላል።
- issue: መስቀልን መሸከም የሚለው ምስል
  choice: ምስሉን በቀጥታ ‘መስቀሉን ይሸከም’ ብሎ ማቆየት
  alternative: ‘መከራውን ይቀበል’ ብሎ ትርጉሙን መፍታት
  rationale: ጽሑፉ የመስቀልን ጠንካራና ከኢየሱስ መንገድ ጋር የተያያዘ ምስል ይጠቀማል፤ ወደ አጠቃላይ ‘መከራ’ መቀየር የሥነ መለኮት ውጥረቱን ያሳንሳል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ አማርኛ ተጠቅሟል። የእንግሊዝኛው የፆታ አማራጭ ማስታወሻ በአማርኛ አያስፈልግም፤ ‘ማንም’ እና የነጠላ ግስ ቅርጾቹ ፆታን ሳይወስኑ የምንጩን ነጠላነትና አጠቃላይ ክልል ይጠብቃሉ።
