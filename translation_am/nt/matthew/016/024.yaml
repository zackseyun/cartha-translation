revisions:
- from: ከዚያም ኢየሱስ ደቀ መዛሙርቱን፣ “ማንም ከእኔ በኋላ ሊመጣ ቢፈልግ፣ ራሱን ይካድ፣ መስቀሉንም ይሸከም፣ እኔንም ይከተል።” አላቸው።
  to: ከዚያም ኢየሱስ ለደቀ መዛሙርቱ እንዲህ አላቸው፦ “ማንም ከእኔ በኋላ ሊመጣ ቢፈልግ፣ ራሱን ይካድ፣ መስቀሉንም ይሸከም፣ እኔንም ይከተል።”
  rationale: 'The revision corrects the addressee construction in the speech introduction while retaining the draft’s faithful rendering of every substantive element. No footnote is needed: Amharic ማንም with singular verb forms conveys the source’s generic singular without imposing a sex-specific reference.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:38:41Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the sequence and principal sense of the Greek: the conditional invitation, self-denial, the individual’s cross, and following Jesus. However, the speech-introduction syntax does not accurately express τοῖς μαθηταῖς αὐτοῦ with εἶπεν: ደቀ መዛሙርቱን is accusative, while አላቸው requires the dative/addressee form ለደቀ መዛሙርቱ.'
  naturalness: The direct-speech introduction in the draft is unidiomatic because of the case/valency mismatch. Recasting it as ለደቀ መዛሙርቱ እንዲህ አላቸው፦ is natural modern standard Amharic. The rest is clear and appropriately dignified.
  terminology: ኢየሱስ, ደቀ መዛሙርት, ራሱን ይካድ, መስቀሉን ይሸከም, and እኔን ይከተል are established and suitable. The gender-unspecified singular constructions naturally retain the generic singular force without requiring an Amharic footnote.
  issues:
  - severity: medium
    issue: The phrase ደቀ መዛሙርቱን … አላቸው combines an accusative object with a verb form that takes an addressee introduced by ለ-.
    rationale: The Greek says “said to his disciples” (τοῖς μαθηταῖς αὐτοῦ), not that Jesus directly acted upon “his disciples” as an accusative object. This is both a structural and naturalness issue in Amharic.
  revised_text: ከዚያም ኢየሱስ ለደቀ መዛሙርቱ እንዲህ አላቸው፦ “ማንም ከእኔ በኋላ ሊመጣ ቢፈልግ፣ ራሱን ይካድ፣ መስቀሉንም ይሸከም፣ እኔንም ይከተል።”
