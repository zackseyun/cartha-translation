  edition: SBLGNT
  text: ἵνα δὲ μὴ σκανδαλίσωμεν αὐτούς, πορευθεὶς ⸀εἰς θάλασσαν βάλε ἄγκιστρον καὶ τὸν ⸀ἀναβάντα πρῶτον ἰχθὺν ἆρον, καὶ ἀνοίξας τὸ στόμα αὐτοῦ εὑρήσεις στατῆρα· ἐκεῖνον λαβὼν δὸς αὐτοῖς ἀντὶ ἐμοῦ καὶ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/027.yaml
  text: But so that we may not offend them[a], go to the sea, cast in a hook, and take the first fish that comes up. And when you open its mouth, you will find a stater[b]. Take that and give it to them for me and for yourself.
translation:
  language: am
  text: ነገር ግን ቅር እንዳናሰኛቸው[a]፣ ወደ ባሕር ሄደህ መንጠቆ ጣል፤ መጀመሪያ የሚወጣውን ዓሣ ውሰድ። አፉን ስትከፍት አንድ ስታቴር[b] ታገኛለህ፤ እሱን ወስደህ ስለ እኔና ስለ አንተ ለእነርሱ ስጥ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እንዳናሰናክላቸው” ወይም “እንዳናስቀይማቸው።”
    reason: lexical_alternative
  - marker: b
    text: ስታቴር ከአራት ድራክማ ጋር እኩል የሆነ ሳንቲም ሲሆን፣ የሁለት ሰዎችን የቤተ መቅደስ ግብር ለመክፈል በቂ ነበር።
    reason: cultural_note
lexical_decisions:
- source_word: σκανδαλίσωμεν
  choice: እንዳናስቀይማቸው
  rationale: በዚህ አውድ ቃሉ ሰዎቹን ወደ ኃጢአት ማስገባትን ሳይሆን ያለ አስፈላጊነት ቅሬታ ማሳደርን ያመለክታል። የተመረጠው አገላለጽ በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን ይህን ተግባራዊ ትርጉም ያስተላልፋል።
- source_word: θάλασσαν
  choice: ባሕር
  rationale: ግሪክኛው በቀጥታ ‘ባሕር’ ይላል፤ የገሊላ ባሕር በመልክዓ ምድር ሐይቅ ቢሆንም የምንጩ ቃል ተጠብቋል።
- source_word: ἄγκιστρον
  choice: መንጠቆ
  rationale: ዓሣ ለማጥመድ የሚጠቅምን መሣሪያ በግልጽና ተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἀναβάντα πρῶτον ἰχθὺν
  choice: በመጀመሪያ የሚወጣውን ዓሣ
  rationale: ከውኃው በመጀመሪያ የሚወጣውን ዓሣ የሚያመለክተውን የግሪክኛ ሐረግ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἆρον
  choice: ውሰድ
  rationale: ዓሣው ከተያዘ በኋላ እንዲወሰድ የተሰጠውን ትእዛዝ በአጭርና ግልጽ ቃል ያስተላልፋል።
- source_word: στατῆρα
  choice: ስታቴር
  rationale: በግሪክኛው የተጠቀሰውን የሳንቲም ስም ይጠብቃል፤ ለአንባቢ የማይታወቀው ዋጋው በማስታወሻ ተብራርቷል።
- source_word: ἀντὶ ἐμοῦ καὶ σοῦ
  choice: ስለ እኔና ስለ አንተ
  rationale: ሳንቲሙ የሁለቱንም ክፍያ እንደሚሸፍን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: πορευθεὶς
  choice: ሄደህ
  rationale: ከቀጣዮቹ ትእዛዞች በፊት የሚፈጸመውን እንቅስቃሴ በአማርኛ ተፈጥሯዊ በሆነ ተከታታይነት ያሳያል።
- source_word: δὸς αὐτοῖς
  choice: ለእነርሱ ስጥ
  rationale: ከአውዱ ክፍያ መሆኑ ግልጽ ስለሆነ፣ የምንጩን ቀላል የመስጠት ግስ ይጠብቃል።
theological_decisions:
- issue: ኢየሱስ የቤተ መቅደሱን ግብር ከመክፈሉ ጋር በተያያዘ የσκανδαλίζω ትርጉም
  choice: ኢየሱስ ክፍያውን እንዲፈጽሙ ያዘዘው ሰብሳቢዎቹን ያለ አስፈላጊነት ላለማስቀየም ነው፤ ይህም ቀደም ሲል ስለ ልጆቹ ነጻነት የተነገረውን ክርክር አይሽርም።
  alternative: ኢየሱስ ግብሩን የከፈለው ፍጹም ግዴታ ስለነበረበት ነው፤ ወይም ክፍያው ሥነ ምግባራዊ አንድምታ የሌለው ተአምርን ለማሳየት ብቻ ነው።
  rationale: የቅርብ አውዱ (ማቴዎስ 17፥24-26) ልጆቹ ነጻ መሆናቸውን ይናገራል፤ ይህ ቁጥር ግን ‘እንዳናስቀይማቸው’ የሚል ተግባራዊ ምክንያት ይጨምራል። ትርጉሙ ይህን ውጥረት ሳይፈታ እንዳለ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪክኛው ተከታታይ ትእዛዞች በተፈጥሯዊ የአማርኛ አገባብ ቀርበዋል፤ ልዩ የሳንቲሙ ስም በዋናው ጽሑፍ ተጠብቆ ትርጉሙ በማስታወሻ ተገልጿል።
