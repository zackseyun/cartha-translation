review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the lifted-eyes action and the basic exclusion (‘saw no one except Jesus’). However, its addition of ሲመለከቱ (‘as/when they looked’) redundantly introduces a further action not expressed by the Greek, and the placement of እንጂ makes the exclusion construction less natural. The revision keeps the Greek participial sequence and represents the emphatic αὐτὸν … μόνον through ብቻውን.
  naturalness: ዓይኖቻቸውን አንሥተው is idiomatic formal modern Amharic. ኢየሱስን ብቻውን እንጂ ማንንም አላዩም is a natural negative-exceptive construction and clearly conveys that Jesus was the sole person visible.
  terminology: ኢየሱስ is the standard Amharic biblical form. No doctrinal expansion is introduced; ብቻውን preserves the source’s heightened exclusivity without forcing a doctrinal interpretation.
  issues:
  - severity: medium
    issue: Redundant phrase ሲመለከቱ
    rationale: The Greek has one participial action, ‘having lifted up their eyes,’ followed by ‘they saw.’ Adding ‘as they looked’ introduces a second, overlapping action and weakens the concise sequence.
  - severity: medium
    issue: Awkward exceptive word order
    rationale: ኢየሱስን ብቻ እንጂ ማንንም አላዩም is understandable but less idiomatic and does not cleanly carry the cumulative emphasis of αὐτὸν … μόνον. ብቻውን more naturally marks Jesus as the sole one seen.
  revised_text: ዓይኖቻቸውንም አንሥተው፣ ኢየሱስን ብቻውን እንጂ ማንንም አላዩም።
  revised_footnotes: []
  revision_rationale: The revision removes the unneeded interpretive expansion ሲመለከቱ, retains the narrative connective in ዓይኖቻቸውንም, and uses ብቻውን to render the emphatic exclusivity created by εἰ μὴ + αὐτὸν + μόνον. No footnote is necessary because the wording is clear in Amharic and no unresolved textual ambiguity is involved.
