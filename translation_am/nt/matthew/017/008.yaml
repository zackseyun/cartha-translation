  to: ዓይኖቻቸውንም አንሥተው፣ ኢየሱስን ብቻውን እንጂ ማንንም አላዩም።
  rationale: The revision removes the unneeded interpretive expansion ሲመለከቱ, retains the narrative connective in ዓይኖቻቸውንም, and uses ብቻውን to render the emphatic exclusivity created by εἰ μὴ + αὐτὸν + μόνον. No footnote is necessary because the wording is clear in Amharic and no unresolved textual ambiguity is involved.
