id: MAT.17.8
reference: Matthew 17:8
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐπάραντες δὲ τοὺς ὀφθαλμοὺς αὐτῶν οὐδένα εἶδον εἰ μὴ ⸀αὐτὸν Ἰησοῦν μόνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/008.yaml
  text: And lifting up their eyes[a], they saw no one except Jesus alone.
translation:
  language: am
  text: ዓይኖቻቸውንም አንሥተው፣ ኢየሱስን ብቻውን እንጂ ማንንም አላዩም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπάραντες
  choice: አንሥተው
  rationale: የአኦሪስት አጋዥ ግስ ሲሆን ከዋናው ግስ በፊት የተፈጸመውን እርምጃ ያሳያል፤ ‘ዓይኖቻቸውን አንሥተው’ የሚለው በአማርኛ ተፈጥሯዊ ነው።
- source_word: δὲ
  choice: ም
  rationale: በዐውዱ ውስጥ ትረካውን የሚያስቀጥል ለስላሳ አያያዥ ነው፤ ከ‘ዓይኖቻቸውን’ ጋር የተያያዘው ‘ም’ ይህን ተግባር በተፈጥሮ ይፈጽማል።
- source_word: τοὺς ὀφθαλμοὺς αὐτῶν
  choice: ዓይኖቻቸውን
  rationale: የግሪኩን ተጨባጭ የሰውነት አገላለጽ ይጠብቃል።
- source_word: εἶδον
  choice: ሲመለከቱ … አላዩም
  rationale: ‘አላዩም’ ዋናውን የὁράω ትርጉም በቀጥታ ያስተላልፋል፤ ‘ሲመለከቱ’ ደግሞ ‘ዓይኖቻቸውን ማንሣት’ የሚለውን ፈሊጣዊ ትርጉም በተፈጥሯዊ አማርኛ ግልጽ ያደርጋል።
- source_word: οὐδένα … εἰ μὴ
  choice: … እንጂ ማንንም አላዩም
  rationale: ከአሉታዊ ግስ ጋር የተገናኘውን ‘ከ… በቀር ማንንም’ የሚለውን ልዩነት በተፈጥሯዊ የአማርኛ አወቃቀር ያቀርባል።
- source_word: αὐτὸν Ἰησοῦν μόνον
  choice: ኢየሱስን ብቻ
  rationale: ‘ብቻ’ የμόνονን ጠንካራ ብቸኝነት ይገልጣል፤ αὐτόν ከስሙ ጋር የሚሰጠው ትኩረት በ‘እንጂ … ብቻ’ በሚለው ድርብ የማግለል አወቃቀር ተጠብቋል።
theological_decisions:
- issue: ከራእዩ በኋላ ኢየሱስ ብቻውን መታየቱ ላይ ያለው አጽንዖት
  choice: ‘ኢየሱስን ብቻ እንጂ ማንንም አላዩም’ በማለት ድርብ የማግለል አጽንዖቱን መጠበቅ
  alternative: ‘ከኢየሱስ በቀር ማንንም አላዩም’
  rationale: εἰ μὴ + αὐτόν + μόνον የሚለው ተደራራቢ አጽንዖት ሙሴና ኤልያስ ከእንግዲህ እንዳልታዩና የታየው ኢየሱስ ብቻ እንደሆነ ያጎላል፤ ከትረካው በላይ ተጨማሪ የእምነት ትርጓሜ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። ‘ዓይኖቻቸውን አንሥተው ሲመለከቱ’ የግሪኩን ተጨባጭ ምስል ሳያጠፋ በአማርኛ ያለውን ፈሊጣዊ ፍቺ ግልጽ ያደርጋል።
