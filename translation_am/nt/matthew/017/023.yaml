  text: καὶ ἀποκτενοῦσιν αὐτόν, καὶ τῇ τρίτῃ ἡμέρᾳ ἐγερθήσεται. καὶ ἐλυπήθησαν σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/023.yaml
  text: and they will kill him[a], and on the third day he will be raised. And they were deeply grieved.
translation:
  language: am
  text: እነርሱም ይገድሉታል፤ እርሱም በሦስተኛው ቀን ይነሣል[a]። እነርሱም እጅግ አዘኑ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከሞት ይነሣል።” የግሪኩ ግስ ተደራጊ ቅርጽ ነው፤ “ይነሣል” በአማርኛ ተፈጥሯዊ አገላለጽ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκτενοῦσιν αὐτόν
  choice: እነርሱም ይገድሉታል
  rationale: የግሪኩን የወደፊት ጊዜ ንቁ አድራጊ ቅርጽና ብዙ ቁጥር በቀጥታ ይገልጣል፤ ‘ይገድሉታል’ ተጨማሪ የሕግ ወይም የሞራል ፍቺ አያስገባም።
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: በሦስተኛው ቀን
  rationale: የጊዜ መወሰኛውን በተፈጥሯዊና በተለመደ አማርኛ ያስተላልፋል።
- source_word: ἐγερθήσεται
  choice: ይነሣል
  rationale: ግሪኩ የወደፊት ጊዜ ተደራጊ ቅርጽ ቢሆንም፣ አማርኛው ‘ይነሣል’ ከሞት መነሣትን በተፈጥሯዊ መንገድ ይገልጣል፤ የተደራጊው ቅርጽ ግን በማስታወሻው ተጠብቋል።
- source_word: ἐλυπήθησαν σφόδρα
  choice: እጅግ አዘኑ
  rationale: ‘አዘኑ’ የሐዘን ምላሻቸውን፣ ‘እጅግ’ ደግሞ σφόδρα የሚሰጠውን ጥንካሬ በግልጽና ዘመናዊ አማርኛ ይገልጣሉ።
- source_word: καὶ ... καὶ ... καὶ
  choice: …ም …ም …ም
  rationale: ተደጋጋሚውን καί በአማርኛ ተፈጥሯዊ በሆነው ተያያዥ ‘-ም’ በማስተላለፍ የንግግሩን ቀላል ተከታታይነት ይጠብቃል።
theological_decisions:
- issue: የትንሣኤ ትንቢቱን በተደራጊ ወይም በንቁ አገላለጽ መተርጎም
  choice: ይነሣል፣ የግሪኩ ተደራጊ ቅርጽ በማስታወሻ ተገልጿል
  alternative: ይነሣል የሚለውን በዋናው ጽሑፍ ሳይጠቀሙ ‘ይነሣልለታል’ ወይም ‘ከሞት ይነሣል’ ማለት
  rationale: ἐγερθήσεται በቅርጹ ተደራጊ ነው፣ ይህም ድርጊቱን በእርሱ ላይ የሚፈጽም አካል እንዳለ ያመለክታል። ሆኖም በዘመናዊ አማርኛ ‘ይነሣል’ ለትንሣኤ ተፈጥሯዊና ግልጽ ነው፤ የቅርጹን ልዩነት ማስታወሻው ሳይፈታው ያስቀምጣል።
- issue: የἐλυπήθησαν ተደራጊ ቅርጽ
  choice: አዘኑ
  alternative: በእጅጉ ኀዘን ተሰማቸው
  rationale: ግሱ በቅርጹ ተደራጊ ቢሆንም እዚህ የስሜት ሁኔታን ይገልጣል። ‘እጅግ አዘኑ’ ትርጉሙን ያለ አስተምህሮአዊ ጭማሪ በተፈጥሯዊ አማርኛ ያቀርባል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። በአውዱ የαὐτόν ተውላጠ ስም የሚያመለክተውን ኢየሱስን ስለሆነ ‘እርሱ’ ተጠቅሟል፤ የመጨረሻውን ብዙ ቁጥር ባለቤት ለአማርኛ ግልጽነት ‘ደቀ መዛሙርቱ’ በማለት ከቅርብ አውድ ተሞልቷል።
