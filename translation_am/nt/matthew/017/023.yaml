  source_fidelity: The future killing and the third-day resurrection are conveyed accurately. However, the Greek explicitly uses a future passive for ἐγερθήσεται; the main Amharic idiom ይነሣል is acceptable but needs an accurate note. The final subject is simply “they”; identifying them as “the disciples” imports the prior-context antecedent into this verse and is unnecessary.
  naturalness: The principal text is generally clear and idiomatic modern Amharic. The current footnote contains the malformed and unintelligible form “ይነሣልለታል።” and must be repaired.
  terminology: ይገድሉታል, በሦስተኛው ቀን, and እጅግ አዘኑ are appropriate. Retaining ይነሣል in the text is natural; the note should state, rather than attempt an unidiomatic passive paraphrase, that the Greek verb is passive.
  issues:
  - severity: medium
    issue: The footnote is malformed and does not accurately provide a viable lexical alternative.
    rationale: “ይነሣልለታል” is not grammatical modern Amharic. The note should preserve the source-language passive observation without inventing an unusable form.
  - severity: low
    issue: The final “they” is expanded to “the disciples.”
    rationale: Although the antecedent is available in the preceding context, the verse itself has only an implicit plural subject. “እነርሱም” preserves the source wording and avoids unnecessary specification.
  revised_text: እነርሱም ይገድሉታል፤ እርሱም በሦስተኛው ቀን ይነሣል[a]። እነርሱም እጅግ አዘኑ።
