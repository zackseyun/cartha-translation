  text: Ἐλθόντων δὲ αὐτῶν εἰς Καφαρναοὺμ προσῆλθον οἱ τὰ δίδραχμα λαμβάνοντες τῷ Πέτρῳ καὶ εἶπαν· Ὁ διδάσκαλος ὑμῶν οὐ τελεῖ τὰ δίδραχμα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/024.yaml
  text: When they came to Capernaum[a], those who collected the two-drachma tax came to Peter and said[b], “Does your teacher not pay the two-drachma tax?”
translation:
  language: am
  text: ወደ ቅፍርናሆም በደረሱ ጊዜ፣ የሁለት ድራክማ ግብር[a] የሚሰበስቡ ሰዎች ወደ ጴጥሮስ ቀርበው፣ “መምህራችሁ የሁለት ድራክማ ግብሩን አይከፍልምን?” አሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክኛ፣ “ሁለቱን ድራክማዎች” ይላል፤ በዚህ ዐውድ የቤተ መቅደስ ግብርን ያመለክታል።
    reason: cultural_note
lexical_decisions:
- source_word: Ἐλθόντων δὲ αὐτῶν
  choice: በደረሱ ጊዜ
  rationale: የግሪኩ የጄኔቲቭ አብሶሉት አወቃቀር ጊዜያዊ ሁኔታን ያመለክታል፤ ይህ አተረጓጎም በዘመናዊ አማርኛ ተፈጥሯዊ ነው። δέ በአንቀጹ ሽግግር ውስጥ በቀላሉ ተወክሏል።
- source_word: Καφαρναοὺμ
  choice: ቅፍርናሆም
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የስፍራ ስም አጻጻፍ ይከተላል።
- source_word: προσῆλθον
  choice: ቀርበው
  rationale: ግሱ ወደ አንድ ሰው መቅረብን ያመለክታል፤ “ቀርበው” እንቅስቃሴውን በግልጽና ተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: οἱ τὰ δίδραχμα λαμβάνοντες
  choice: ሁለት ድራክማውን የሚሰበስቡት
  rationale: የተሳቢው ሐረግ ሰዎቹን በሚሠሩት ተግባር ይለያል። “የሚሰበስቡት” በዚህ ዐውድ ገንዘቡን እንደ ግዴታ ክፍያ መቀበላቸውን ያሳያል።
- source_word: δίδραχμα
  choice: ሁለት ድራክማውን
  rationale: የግሪኩን የገንዘብ መጠን በቀጥታ ይጠብቃል። ዐውዱ የቤተ መቅደስ ግብር መሆኑን ስለሚያሳይ፣ ይህ መረጃ በማስታወሻው ተብራርቷል።
- source_word: τῷ Πέτρῳ
  choice: ወደ ጴጥሮስ
  rationale: προσῆλθον ከሚለው ግስ ጋር በአማርኛ ተፈጥሯዊ የሆነውን የአቅጣጫ አገላለጽ ይጠቀማል።
- source_word: Ὁ διδάσκαλος ὑμῶν
  choice: መምህራችሁ
  rationale: διδάσκαλος በትክክል “መምህር” ማለት ነው፤ የብዙ ቁጥር ባለቤትነት ቅጥያው ὑμῶνን ይወክላል።
- source_word: οὐ τελεῖ
  choice: አይከፍልምን?
  rationale: τελέω በዚህ ዐውድ ግዴታ የሆነን ክፍያ መክፈል ማለት ነው። አሉታዊው የጥያቄ ቅርጽ አዎንታዊ መልስን የሚጠብቅ ሊሆን ቢችልም፣ ጽሑፉ ያለውን አሻሚነት ለመጠበቅ በአሉታዊ ቅርጹ ተተርጉሟል።
theological_decisions:
- issue: δίδραχμα ገንዘቡን ብቻ ወይስ ግብሩን እንደሚያመለክት
  choice: በዋናው ጽሑፍ “ሁለት ድራክማውን” በማለት የግሪኩን አገላለጽ ማቆየት፣ በማስታወሻም የቤተ መቅደስ ግብር መሆኑን ማብራራት
  alternative: በዋናው ጽሑፍ “የሁለት ድራክማ ግብር” ማለት
  rationale: ግሪኩ በቀጥታ “ሁለቱን ድራክማዎች” ይላል፤ ዐውዱ ግን የቤተ መቅደስ ግብርን ያመለክታል። ዋናው ጽሑፍ የምንጩን ቅርጽ ሲጠብቅ፣ ማስታወሻው ባህላዊ ዐውዱን ያብራራል።
- issue: አሉታዊው ጥያቄ የሚጠብቀው መልስ
  choice: “አይከፍልምን?” ብሎ የግሪኩን አሉታዊ ጥያቄ ማቆየት
  alternative: “ይከፍላል አይደል?” ብሎ የሚጠበቀውን አዎንታዊ መልስ ግልጽ ማድረግ
  rationale: οὐ ያለው ጥያቄ ብዙውን ጊዜ አዎንታዊ መልስን ቢጠብቅም፣ ያንን የንግግር ኃይል በትርጉሙ ውስጥ በግድ መወሰን አያስፈልግም።
