  text: ኢየሱስ ግን መልሶ እንዲህ አለ፤ “እምነት የሌለሽ[a]ና ጠማማ[b] ትውልድ ሆይ! እስከ መቼ ከእናንተ ጋር እሆናለሁ? እስከ መቼስ እታገሣችኋለሁ? እርሱን እዚህ ወደ እኔ አምጡት።”
  philosophy: optimal-equivalence
