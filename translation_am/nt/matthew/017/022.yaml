- source_word: ἀνθρώπων
  choice: ሰዎች
  rationale: ብዙ ሰብዓዊ ወኪሎችን በተፈጥሯዊ አማርኛ ይገልጻል፤ ‘የሰው ልጅ’ ከሚለው ጋር ያለውን የቃል ንጽጽርም ይጠብቃል።
