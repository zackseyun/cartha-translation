id: MAT.17.1
reference: Matthew 17:1
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Καὶ μεθ’ ἡμέρας ἓξ παραλαμβάνει ὁ Ἰησοῦς τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, καὶ ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν κατ’ ἰδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/001.yaml
  text: And after six days Jesus takes Peter[a], James, and John his brother[c][b], and leads them up onto a high mountain by themselves.
translation:
  language: am
  text: ከስድስት ቀናት በኋላ ኢየሱስ ጴጥሮስን፣ ያዕቆብንና ወንድሙን ዮሐንስን ይዟቸው፣ ለብቻቸው ወደ ከፍ ወዳለ ተራራ ያወጣቸዋል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθ’ ἡμέρας ἓξ
  choice: ከስድስት ቀን በኋላ
  rationale: μετά ከወደቀው የጊዜ አመልካች ጋር የጊዜ ተከታታይነትን ያሳያል፤ ይህ አተረጓጎም የግሪኩን አገላለጽ በቅርብ ይከተላል።
- source_word: παραλαμβάνει
  choice: ይዞ
  rationale: ግሱ አንድን ሰው ከራስ ጋር ይዞ መሄድን ያመለክታል፤ «ይዞ» በዘመናዊ አማርኛ ተፈጥሯዊና አጭር ነው።
- source_word: Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην
  choice: ጴጥሮስን፣ ያዕቆብንና ዮሐንስን
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመዱት የስሞቹ ቅርጾች ተጠብቀዋል።
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: ወንድሙን ዮሐንስን
  rationale: ሐረጉ ዮሐንስን የያዕቆብ ወንድም አድርጎ የሚለይ ተጨማሪ መግለጫ ነው፤ የአማርኛው የቃላት ቅደም ተከተል ግንኙነቱን በተፈጥሮ ያሳያል።
- source_word: ἀναφέρει
  choice: ወደ ... ይወስዳቸዋል
  rationale: በዚህ የእንቅስቃሴ አውድ ግሱ ወደ ላይ መውሰድን ያመለክታል፤ የተራራው መዳረሻ የመውጣቱን አቅጣጫ በቂ ሁኔታ ያሳያል።
- source_word: εἰς ὄρος ὑψηλὸν
  choice: ወደ አንድ ረጅም ተራራ
  rationale: εἰς መዳረሻን ያመለክታል፤ «ረጅም ተራራ» ὄρος ὑψηλόνን በተለመደ አማርኛ ይገልጣል።
- source_word: κατ’ ἰδίαν
  choice: እነርሱን ብቻቸውን
  rationale: ሐረጉ ከሌሎች ተለይተው በግል መሆናቸውን ያሳያል፤ «ብቻቸውን» ይህን በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: በወንጌል ትረካ የተጠቀሰው ታሪካዊ የአሁን ጊዜ
  choice: «ይወስዳቸዋል» በማለት የአሁን ጊዜውን ማቆየት
  alternative: «ወሰዳቸው» በማለት ወደ አለፈ ጊዜ መቀየር
  rationale: παραλαμβάνει እና ἀναφέρει የአሁን ጊዜ ቅርጽ ያላቸው የትረካ ግሶች ናቸው። በአማርኛም ሕያው ትረካ ውስጥ ይህ ቅርጽ ስለሚሠራ፣ የግሪኩ ትረካዊ ሕያውነት ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ቁጥሩ ያለ የግድ የትርጉም አማራጭ ማስታወሻ በቀጥታ ስለሚነበብ የግርጌ ማስታወሻ አልተጨመረም።
