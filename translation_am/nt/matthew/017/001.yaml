revisions:
- from: ከስድስት ቀን በኋላ ኢየሱስ ጴጥሮስን፣ ያዕቆብንና ወንድሙን ዮሐንስን ይዞ፣ እነርሱን ብቻቸውን ወደ አንድ ረጅም ተራራ ይወስዳቸዋል።
  to: ከስድስት ቀናት በኋላ ኢየሱስ ጴጥሮስን፣ ያዕቆብንና ወንድሙን ዮሐንስን ይዟቸው፣ ለብቻቸው ወደ ከፍ ወዳለ ተራራ ያወጣቸዋል።
  rationale: The revision corrects the height/length mistranslation, restores the upward sense of ἀναφέρει, and improves modern standard Amharic idiom while retaining the Greek historical present and the appositional identification of John as James’s brother. No footnote is required, since the translation makes no unresolved textual or lexical claim needing annotation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:38:44Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the temporal sequence, the three named disciples, the historical-present narration, and the sense of separation from others. However, «ረጅም ተራራ» means a long mountain rather than a high mountain, and «ይወስዳቸዋል» does not adequately express the upward movement of ἀναφέρει.
  naturalness: «ከስድስት ቀናት በኋላ» is more idiomatic than the singular «ከስድስት ቀን በኋላ». «ለብቻቸው» naturally conveys κατ’ ἰδίαν without the awkward object-plus-adverb construction «እነርሱን ብቻቸውን».
  terminology: The established Amharic biblical forms «ኢየሱስ፣ ጴጥሮስ፣ ያዕቆብ፣ ዮሐንስ» are appropriate. «ከፍ ወዳለ ተራራ» accurately and naturally renders ὄρος ὑψηλόν.
  issues:
  - severity: high
    issue: «ረጅም ተራራ» for ὄρος ὑψηλόν
    rationale: «ረጅም» denotes length, whereas ὑψηλόν denotes height. The wording should specify a high/elevated mountain.
  - severity: medium
    issue: The ascent in ἀναφέρει is undertranslated as «ይወስዳቸዋል».
    rationale: The Greek verb expressly conveys bringing or leading upward. «ያወጣቸዋል» preserves this movement.
  - severity: low
    issue: Awkward wording for κατ’ ἰδίαν and the time phrase
    rationale: «ለብቻቸው» idiomatically denotes being apart from others, and plural «ቀናት» is the natural form after a numeral in this temporal expression.
  revised_text: ከስድስት ቀናት በኋላ ኢየሱስ ጴጥሮስን፣ ያዕቆብንና ወንድሙን ዮሐንስን ይዟቸው፣ ለብቻቸው ወደ ከፍ ወዳለ ተራራ ያወጣቸዋል።
  revised_footnotes: []
  revision_rationale: The revision corrects the height/length mistranslation, restores the upward sense of ἀναφέρει, and improves modern standard Amharic idiom while retaining the Greek historical present and the appositional identification of John as James’s brother. No footnote is required, since the translation makes no unresolved textual or lexical claim needing annotation.
