  edition: SBLGNT
  text: ὁ δὲ ⸀λέγει αὐτοῖς· Διὰ τὴν ⸀ὀλιγοπιστίαν ὑμῶν· ἀμὴν γὰρ λέγω ὑμῖν, ἐὰν ἔχητε πίστιν ὡς κόκκον σινάπεως, ἐρεῖτε τῷ ὄρει τούτῳ· ⸂Μετάβα ἔνθεν⸃ ἐκεῖ, καὶ μεταβήσεται, καὶ οὐδὲν ἀδυνατήσει ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/020.yaml
  text: But he says to them[a], “Because of your little faith. For truly I say to you, if you have faith like a mustard seed, you will say to this mountain, ‘Move from here to there,’ and it will move[c][b], and nothing will be impossible for you.”
translation:
  language: am
  text: እርሱ ግን እንዲህ ይላቸዋል፦ “በእምነታችሁ ማነስ ምክንያት ነው።[a] እውነት እላችኋለሁ፤ እንደ ሰናፍጭ ዘር የሚያህል እምነት ቢኖራችሁ፣[b] ለዚህ ተራራ፣ ‘ከዚህ ወደዚያ ተዛወር’ ትላላችሁ፤ እርሱም ይዛወራል፤ ምንም ነገርም አይሳናችሁም።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “እምነት ስለጎደላችሁ” ተብሎም ሊተረጎም ይችላል፤ የግሪኩ ቃል ፈጽሞ አለማመንን ሳይሆን ያነሰ ወይም ያልበቃ እምነትን በተለይ ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: በቀጥታ፣ “እንደ ሰናፍጭ ዘር እምነት ቢኖራችሁ።” ንጽጽሩ እጅግ ትንሽ ከሆነ ነገር ጋር ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: ይላቸዋል
  rationale: የግሪኩን ታሪካዊ የአሁን ጊዜ አገላለጽ በመጠበቅ ትረካውን ሕያው ያደርጋል።
- source_word: Διὰ τὴν ὀλιγοπιστίαν ὑμῶν
  choice: እምነታችሁ ስላነሰ
  rationale: ὀλιγοπιστία ሙሉ አለማመንን ሳይሆን ያነሰ ወይም የጎደለ እምነትን ያመለክታል።
- source_word: ἀμὴν
  choice: እውነት
  rationale: ኢየሱስ ቀጥሎ የሚናገረውን ቃል በአጽንዖት የሚያስተዋውቅበትን አገላለጽ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: πίστιν
  choice: እምነት
  rationale: በዚህ አውድ ቃሉ በእግዚአብሔር ኃይል ላይ የሚደረግን እምነት ያመለክታል።
- source_word: ὡς κόκκον σινάπεως
  choice: እንደ ሰናፍጭ ዘር ያለች
  rationale: የግሪኩን ንጽጽር ይጠብቃል፤ አውዱም የዘሩን እጅግ ትንሽነት ያጎላል።
- source_word: Μετάβα ἔνθεν ἐκεῖ
  choice: ከዚህ ወደዚያ ተዛወር
  rationale: ለተራራው የተሰጠውን የቦታ ለውጥ ትእዛዝ ግልጽና ተፈጥሯዊ በሆነ አማርኛ ያቀርባል።
- source_word: μεταβήσεται
  choice: ይዛወራል
  rationale: የወደፊት ጊዜውን ኢ-ተሻጋሪ ትርጉም ይጠብቃል፤ ተራራው ራሱ ቦታ እንደሚለውጥ ይገልጻል።
- source_word: οὐδὲν ἀδυνατήσει ὑμῖν
  choice: የሚሳናችሁም ምንም ነገር አይኖርም
  rationale: ምንም ነገር ለእነርሱ የማይቻል እንደማይሆን የሚገልጸውን ፈሊጣዊ ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: በተአምር አውድ ውስጥ πίστις የሚለው ቃል የሚያመለክተው
  choice: እምነት
  alternative: መታመን
  rationale: አውዱ የደቀ መዛሙርቱን በእግዚአብሔር ኃይል ላይ ያልበቃ መታመን ይመለከታል፤ ትርጉሙ ስለ ድነት እምነት ወይም ስለ ታማኝነት የተለየ አስተምህሮ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ታሪካዊ የአሁን ጊዜ በ“ይላቸዋል” ተጠብቋል፤ δέ ደግሞ ደካማ የንግግር ሽግግር ቢሆንም “ግን” ተብሎ በቀላሉ ተወክሏል።
