review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the historical present λέγει, the deficient (not absent) faith denoted by ὀλιγοπιστία, the mustard-seed comparison, the command for the mountain to relocate, and the concluding idiom of impossibility. A small revision makes the address to the mountain more idiomatic while retaining its dative sense.
  naturalness: “ያለች እምነት” is not idiomatic agreement in this setting, and placing “ይህን ተራራ” directly before the quoted speech with ትሉታላችሁ is syntactically less natural. “ለዚህ ተራራ … ትላላችሁ” is clear modern standard Amharic. “ምንም ነገር አይሳናችሁም” is also more direct and natural than the circumlocution in the draft.
  terminology: እምነት appropriately renders πίστις without adding a doctrinal interpretation. ሰናፍጭ ዘር, እውነት እላችኋለሁ, and ተዛወር preserve the intended register and meaning.
  issues:
  - severity: medium
    issue: The phrase “እንደ ሰናፍጭ ዘር ያለች እምነት” has awkward agreement and phrasing.
    rationale: In modern standard Amharic, “እንደ ሰናፍጭ ዘር የሚያህል እምነት” naturally conveys faith comparable in size to a mustard seed.
  - severity: medium
    issue: “ይህን ተራራ … ትሉታላችሁ” is less natural for direct speech addressed to the mountain.
    rationale: The Greek τῷ ὄρει is dative (“to this mountain”). “ለዚህ ተራራ … ትላላችሁ” gives a natural Amharic construction and preserves that relation.
  - severity: low
    issue: The final clause is needlessly periphrastic.
    rationale: “ምንም ነገር አይሳናችሁም” is a standard, concise expression of οὐδὲν ἀδυνατήσει ὑμῖν.
