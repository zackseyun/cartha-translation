id: MAT.17.16
reference: Matthew 17:16
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ προσήνεγκα αὐτὸν τοῖς μαθηταῖς σου, καὶ οὐκ ἠδυνήθησαν αὐτὸν θεραπεῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/016.yaml
  text: And I brought him to your disciples[a], and they were not able to heal him.
translation:
  language: am
  text: እኔም ወደ ደቀ መዛሙርትህ አመጣሁት፤ እነርሱም ሊፈውሱት አልቻሉም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσήνεγκα
  choice: አመጣሁት
  rationale: በዚህ አውድ προσφέρω አንድን ሰው ወደ ሌላ ሰው ማምጣትን ያመለክታል፤ «አመጣሁት» በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: μαθηταῖς σου
  choice: ደቀ መዛሙርትህ
  rationale: በወንጌላት አውድ μαθητής የአስተማሪን ትምህርት የሚከተሉ ተማሪዎችን ያመለክታል፤ «ደቀ መዛሙርት» በአማርኛ የተለመደና በግልጽ የሚታወቅ ቃል ነው።
- source_word: οὐκ ἠδυνήθησαν
  choice: አልቻሉም
  rationale: δύναμαι ችሎታን ወይም አቅምን ይገልጣል፤ «አልቻሉም» የግሪኩን የአለመቻል ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: θεραπεῦσαι
  choice: ሊፈውሱት
  rationale: θεραπεύω በዚህ ስፍራ የታመመውን ልጅ ማዳንን ወይም መፈወስን ያመለክታል፤ «መፈወስ» በወንጌላት የፈውስ አውድ ግልጽና ተስማሚ ነው።
- source_word: καὶ ... καὶ
  choice: እኔም ... እነርሱ ግን
  rationale: የመጀመሪያው καί በ«እኔም» ተፈጥሯዊ ሆኖ ተገልጧል። ሁለተኛው καί በአማርኛ የአባቱን ተስፋና የደቀ መዛሙርቱን ውድቀት በተፈጥሯዊ ንግግር ለማያያዝ «ግን» ተብሏል፤ ይህ ከአውዱ በላይ አዲስ ምክንያት አይጨምርም።
- source_word: αὐτόν
  choice: -ት / እርሱን
  rationale: የአማርኛው የተሳቢ ቅጥያ «-ት» በ«አመጣሁት»ና «ሊፈውሱት» ላይ በመጨመር በአውዱ ያለውን ወንድ ልጅ በግልጽ ያመለክታል።
theological_decisions:
- issue: የደቀ መዛሙርቱ ውድቀት ምንነት
  choice: ጥቅሱ እንደሚለው ልጁን መፈወስ እንዳልቻሉ ብቻ ተተርጉሟል።
  alternative: አጋንንት ማውጣት እንዳልቻሉ ወይም የእምነት ጉድለት እንደነበረባቸው በግልጽ መጨመር።
  rationale: ይህ ጥቅስ ራሱ ደቀ መዛሙርቱ ሊፈውሱት እንዳልቻሉ ብቻ ይናገራል። በአካባቢው ካሉ ጥቅሶች የሚገኙ ማብራሪያዎችን ወደዚህ ጥቅስ አልጨመርንም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ቀላል የሆነ አማርኛ ይጠቀማል። «ደቀ መዛሙርት» ባህላዊ ቅርጽ ቢሆንም በዘመናዊ የአማርኛ መጽሐፍ ቅዱስ ንባብ የታወቀና ግልጽ ነው። የእንግሊዝኛው [a] ማስታወሻ «were not able» እና «could not» በሚሉ በእንግሊዝኛ ተመሳሳይ አገላለጾች መካከል ያለ ልዩነት ብቻ ስለሆነ፣ በአማርኛ «አልቻሉም» ሁለቱንም በቀጥታ ይሸፍናል፤ ስለዚህ የማያስፈልግ የግርጌ ማስታወሻ አልተጨመረም።
