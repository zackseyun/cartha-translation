id: MAT.17.2
reference: Matthew 17:2
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ μετεμορφώθη ἔμπροσθεν αὐτῶν, καὶ ἔλαμψεν τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος, τὰ δὲ ἱμάτια αὐτοῦ ⸀ἐγένετο λευκὰ ὡς τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/002.yaml
  text: And he was transfigured before them[a], and his face shone like the sun, and his clothes became white as the light.
translation:
  language: am
  text: በእነርሱም ፊት ተለወጠ[a]፤ ፊቱም እንደ ፀሐይ አበራ፤ ልብሶቹም እንደ ብርሃን ነጭ ሆኑ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «መልኩ ተለወጠ።»
    reason: lexical_alternative
lexical_decisions:
- source_word: μετεμορφώθη
  choice: ተለወጠ
  rationale: የግሪኩን ተገብሮአዊ የለውጥ አገላለጽ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል፤ በዐውዱም ለውጡ በሚታይ ገጽታ እንደተገለጠ የሚቀጥሉት ሐረጎች ያሳያሉ።
- source_word: ἔμπροσθεν αὐτῶν
  choice: በእነርሱ ፊት
  rationale: ድርጊቱ በእነርሱ ፊትና በእነርሱ እይታ መፈጸሙን ቀጥተኛ በሆነ አማርኛ ይገልጣል።
- source_word: ἔλαμψεν
  choice: አበራ
  rationale: λάμπω የሚያመለክተውን ማብራትና ብርሃን መስጠት በቀጥታ ይተረጉማል።
- source_word: πρόσωπον
  choice: ፊቱ
  rationale: በዚህ ዐውድ የኢየሱስን አካላዊ ፊት ያመለክታል።
- source_word: ὡς ὁ ἥλιος
  choice: እንደ ፀሐይ
  rationale: ὡς የሚያቀርበውን ንጽጽር በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἱμάτια
  choice: ልብሶቹ
  rationale: አጠቃላይ ልብስን የሚያመለክተውን ብዙ ቁጥር በግልጽና በዘመናዊ ቃል ያቀርባል።
- source_word: ἐγένετο λευκὰ
  choice: ነጭ ሆኑ
  rationale: ወደ ነጭነት የተደረገውን የሁኔታ ለውጥ ያለ ተጨማሪ ጥንካሬ ይገልጣል።
- source_word: ὡς τὸ φῶς
  choice: እንደ ብርሃን
  rationale: የግሪኩን ግልጽ ንጽጽር ሳያዳክም በተፈጥሯዊ አማርኛ ይይዛል።
theological_decisions:
- issue: የመለወጡ ክስተት አተረጓጎም
  choice: ተለወጠ
  alternative: መልኩ ተለወጠ
  rationale: «ተለወጠ» የμετεμορφώθηን መሠረታዊ ትርጉምና ተገብሮአዊ ቅርጽ ይጠብቃል። የለውጡን የሚታይ ባሕርይ ስለ ፊቱና ልብሶቹ የሚናገሩት ቀጣይ ሐረጎች ያብራራሉ፤ ጽሑፉ ከሚለው በላይ የሥነ መለኮት ዝርዝር አይጨመርም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛን ይጠቀማል። የግሪኩ ሦስት ተከታታይ አንቀጾች በአማርኛ ምቹ ፍሰት እንዲኖራቸው በ፤ ተለይተዋል።
