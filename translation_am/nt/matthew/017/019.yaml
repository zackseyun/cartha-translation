    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  choice: ከዚያም
  rationale: በትረካው ውስጥ ቀጥሎ የተከሰተውን ድርጊት የሚያመለክት ተፈጥሯዊ የጊዜ መሸጋገሪያ ነው።
- source_word: προσελθόντες
  choice: ቀርበው
  rationale: ወደ አንድ ሰው መቅረብን በቀጥታ ያሳያል፤ የግሪኩን ቦዝ አንቀጽ ከዋናው ግስ ጋር በተፈጥሯዊ አማርኛ ያገናኛል።
- source_word: οἱ μαθηταὶ
  choice: ደቀ መዛሙርቱ
  rationale: በወንጌል አውድ የኢየሱስን ተከታዮችና ተማሪዎች የሚያመለክት የተለመደ አማርኛ ቃል ነው።
- source_word: τῷ Ἰησοῦ
  choice: ወደ ኢየሱስ
  rationale: ከ‘ቀርበው’ ጋር ተፈጥሯዊ የሆነውን የአማርኛ አገባብ ይጠቀማል።
- source_word: κατ’ ἰδίαν
  choice: ብቻቸውን
  rationale: ከሕዝቡ ተለይተው በግል መነጋገራቸውን በተፈጥሯዊና ግልጽ አማርኛ ያሳያል።
- source_word: εἶπον
  choice: አሉት
  rationale: የግሪኩን ‘አሉ’ የሚለውን ቀጥተኛ ትርጉም ይጠብቃል፤ ተቀባዩንም በአማርኛ ግስ ውስጥ ያሳያል።
- source_word: Διὰ τί
  choice: ለምን
  rationale: ምክንያትን ለመጠየቅ የሚያገለግል ቀጥተኛና ዘመናዊ አማርኛ ነው።
- source_word: ἡμεῖς
  choice: እኛ
  rationale: በግሪኩ የተገለጸውን ተውላጠ ስምና ያለበትን መጠነኛ አጽንዖት ይጠብቃል።
- source_word: οὐκ ἠδυνήθημεν
  choice: አልቻልንም
  rationale: ያለመቻልን በተፈጥሯዊና ቀጥተኛ አማርኛ ይገልጻል።
- source_word: ἐκβαλεῖν
  choice: ልናወጣው
  rationale: በአጋንንት ማስወጣት አውድ የመጣውን የማባረርና ከሰውየው የማስወጣት ሐሳብ በተለመደ አማርኛ ያቀርባል።
- source_word: αὐτό
  choice: -ው
  rationale: የአማርኛው ተሳቢ ቅጥያ በዚህ አውድ ‘እሱን’ ወይም ‘ያንን’ ሊያመለክት ስለሚችል፣ በግሪኩ ያለውን የተጠቃሽ አሻሚነት በከፊል ይጠብቃል።
theological_decisions:
- issue: በአጋንንት ማስወጣት አውድ αὐτό የሚያመለክተው
  choice: በ‘ልናወጣው’ ውስጥ ያለውን ‘-ው’ ቅጥያ መጠቀም፤ በዋናነት ጋኔኑን ሊያመለክት ይችላል።
  alternative: ተውላጠ ስሙ የታመመውን ልጅ ያመለክታል ተብሎ ‘እሱን’ በግልጽ መጻፍ።
  rationale: የቅርብ አውዱና ἐκβάλλω በአጋንንት ማስወጣት ንግግር ያለው አጠቃቀም ጋኔኑን እንደ ተሳቢ ያመለክታሉ፤ ሆኖም የአማርኛው ‘-ው’ ቅጥያ የግሪኩን ተጠቃሽ ሙሉ በሙሉ ሳይወስን ያቀርበዋል፣ አማራጩም በማስታወሻ ተገልጿል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ደቀ መዛሙርቱ’ የተለመደውን መጽሐፍ ቅዱሳዊ መዝገብ ሲጠብቅ፣ የቀረው አገባብ ተፈጥሯዊና ዘመናዊ ነው።
