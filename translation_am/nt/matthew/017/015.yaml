language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ λέγων· Κύριε, ἐλέησόν μου τὸν υἱόν, ὅτι σεληνιάζεται καὶ κακῶς ⸀πάσχει, πολλάκις γὰρ πίπτει εἰς τὸ πῦρ καὶ πολλάκις εἰς τὸ ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/015.yaml
  text: and saying[a], “Lord, have mercy on my son, because he is epileptic and suffers terribly; for he often falls into the fire and often into the water.”
translation:
  language: am
  text: እንዲህም አለ፦ “ጌታ ሆይ፣ ወንድ ልጄን ማረው፤ የሚጥል ሕመም[a] ያጠቃዋልና ክፉኛ ይሠቃያል። ብዙ ጊዜ ወደ እሳት፣ ብዙ ጊዜም ወደ ውሃ ይወድቃል።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የሚጥል በሽታ አለበት።” የግሪኩ ቃል በቃል “በጨረቃ የተመታ” ማለት ሲሆን፣ በጥንት አጠቃቀም የሚጥል መሰል ሕመምን ያመለክት ነበር።
    reason: የσεληνιάζεταιን ቃል በቃል ጨረቃ-ተያያዥ አገላለጽና ተለዋጭ የሕክምና-መሰል አተረጓጎም ለማስቀመጥ፤ ዋናው ጽሑፍ ግን ዘመናዊ ምርመራ አያረጋግጥም።
lexical_decisions:
- source_word: καὶ λέγων
  choice: እንዲህም አለ፦
  rationale: የግሪኩ የአሁን ጊዜ አሳታፊ ቅርጽ ከቀደመው ትረካ ጋር የተያያዘ ነው፤ ይህ አተረጓጎም ትስስሩን በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: ለኢየሱስ የቀረበውን አክብሮታዊ የጥሪ ቅርጽ በተለመደውና ክብር ባለው አማርኛ ያስተላልፋል።
- source_word: ἐλέησόν μου τὸν υἱόν
  choice: ልጄን ማረው
  rationale: υἱός በግልጽ ሁኔታ ወንድ ልጅን ያመለክታል፤ የትእዛዝ ቅርጹም ርኅራኄና እርዳታ የሚለምን ከባድ ጥሪ ነው።
- source_word: σεληνιάζεται
  choice: የሚጥል ሕመም ይነሣበታል
  rationale: ቃሉ በቃል ከጨረቃ ጋር የተያያዘ ቢሆንም፣ በጥንት አጠቃቀም የሚጥል መሰል ሁኔታን ያመለክታል። ምርጫው የሚታየውን ሁኔታ ያስተላልፋል እንጂ ዘመናዊ የሕክምና ምርመራን አያስገባም።
- source_word: κακῶς πάσχει
  choice: ክፉኛ ይሠቃያል
  rationale: κακῶς የሥቃዩን ክብደት ያጠናክራል፤ “ክፉኛ” ይህን በተፈጥሯዊና ግልጽ አማርኛ ያሳያል።
- source_word: πολλάκις
  choice: ብዙ ጊዜ
  rationale: ድርጊቱ በተደጋጋሚ መከሰቱን በቀጥታ ያስተላልፋል።
- source_word: πίπτει εἰς τὸ πῦρ ... εἰς τὸ ὕδωρ
  choice: በእሳት ውስጥ ... በውሃ ውስጥ ይወድቃል
  rationale: የግሪኩን ትይዩ አወቃቀርና ወደ እሳትና ውሃ ውስጥ የመውደቅ አደጋ በግልጽ ይጠብቃል።
theological_decisions:
- issue: σεληνιάζεται በፈውስና በአጋንንት ማስወጣት አውድ ውስጥ እንዴት እንደሚተረጎም
  choice: የሚታየውን ሁኔታ “የሚጥል ሕመም ይነሣበታል” ብሎ መግለጽ
  alternative: “የሚጥል በሽታ አለበት” ወይም “በጨረቃ የተመታ ነው”
  rationale: ጥቅሱ የአባቱን ገለጻ ያቀርባል እንጂ ትክክለኛ ዘመናዊ የሕክምና ምደባ ወይም ጨረቃ ሕመሙን እንደምታስከትል የሚያረጋግጥ አይደለም። ይህ ትርጉም በጥቅሱ ውስጥ ያልተገለጸ ሕክምናዊ ወይም መንፈሳዊ ማብራሪያ ሳያስገባ አሻሚነቱን ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ትይዩነት “ብዙ ጊዜ ... ብዙ ጊዜም” በሚል ተጠብቋል።
