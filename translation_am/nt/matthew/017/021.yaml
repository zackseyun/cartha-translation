base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/021.yaml
  text: But[a] this kind does not come out except by prayer and fasting.
translation:
  language: am
  text: ነገር ግን፣[a] ይህ ዓይነት በጸሎትና በጾም ካልሆነ በቀር አይወጣም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይህ ቁጥር በጥንታውያኑ የግሪክ የእጅ ጽሑፎች፣ ከእነዚህም በ4ኛው ክፍለ ዘመን በተጻፉት ሲናይቲከስና ቫቲካኑስ፣ እንዲሁም በጥንታውያኑ የሶርያና የቅብጥ ትርጉሞች ውስጥ የለም። ሆኖም በባይዛንታይን የአብላጫ ትውፊት፣ በላቲን ትውፊትና በአብዛኞቹ የሶርያ ምስክሮች ውስጥ ይገኛል። ከማርቆስ 9፥29 ጋር ለማስማማት በኋላ በጸሐፍት የተጨመረ ሊሆን ይችላል።
    reason: textual_critical
lexical_decisions:
- source_word: γένος
  choice: ዓይነት
  rationale: በዚህ ዐውድ የአጋንንትን ምድብ ወይም ወገን ያመለክታል፤ «ዓይነት» በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: ἐκπορεύεται
  choice: አይወጣም
  rationale: አጋንንቱ ከተያዘው ሰው መውጣቱን ያመለክታል፤ የግሪኩን አቅጣጫዊ እንቅስቃሴ ቀጥተኛና ተፈጥሯዊ በሆነ አማርኛ ያስተላልፋል።
- source_word: εἰ μὴ
  choice: በቀር
  rationale: በዚህ ስፍራ ልዩ ሁኔታን የሚያሳይ አገላለጽ ስለሆነ «በቀር» የሚለው ትርጉሙን በግልጽ ያቀርባል።
- source_word: ἐν προσευχῇ καὶ νηστείᾳ
  choice: ከጸሎትና ከጾም
  rationale: ከ«በቀር» ጋር የሚጣጣም ተፈጥሯዊ የአማርኛ አወቃቀር ሲሆን ሁለቱንም መንፈሳዊ ተግባራት በእኩልነት ይጠብቃል።
theological_decisions:
- issue: ጸሎትና ጾም ከአጋንንት መውጣት ጋር ያላቸው ግንኙነት
  choice: የግሪኩን ብቸኛ ሁኔታ የሚገልጽ አነጋገር ሳይተረጎም በቀጥታ ማቅረብ
  alternative: ጸሎትና ጾምን እንደ ዘዴ፣ ዋስትና ወይም የተለየ ሥርዓተ እምነት በማብራራት መጨመር
  rationale: ጽሑፉ ከጸሎትና ከጾም በቀር እንደማይወጣ ብቻ ይናገራል፤ ትርጉሙ ከዚህ በላይ የእምነት ሥርዓታዊ ዝርዝር ማከል የለበትም።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ነገር ግን» የδέን ተቃርኖ ይጠብቃል፤ የጽሑፍ ልዩነቱ በአጭር የጽሑፍ ትችት ማስታወሻ ቀርቧል።
