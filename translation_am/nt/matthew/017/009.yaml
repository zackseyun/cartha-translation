id: MAT.17.9
reference: Matthew 17:9
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Καὶ καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους ἐνετείλατο αὐτοῖς ὁ Ἰησοῦς λέγων· Μηδενὶ εἴπητε τὸ ὅραμα ἕως οὗ ὁ υἱὸς τοῦ ἀνθρώπου ἐκ νεκρῶν ⸀ἐγερθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/009.yaml
  text: And as they were coming down from the mountain[a], Jesus commanded them, saying[b], “Tell the vision to no one until the Son of Man is raised from the dead.”
translation:
  language: am
  text: እነርሱም ከተራራው ሲወርዱ፣ ኢየሱስ፣ “የሰው ልጅ ከሙታን[a] እስኪነሣ ድረስ ራእዩን[b] ለማንም አትንገሩ” ብሎ አዘዛቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይበልጥ ቃል በቃል፣ “ከሞቱት መካከል።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ያያችሁትን።” የግሪኩ ቃል “ራእዩን” ይላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους
  choice: እነርሱም ከተራራው ሲወርዱ
  rationale: የግሪኩ የአሁን ጊዜ አጋዥ ግስ ከዋናው ድርጊት ጋር በአንድ ጊዜ የቀጠለ ድርጊትን ያሳያል፤ «ሲወርዱ» ይህን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐνετείλατο αὐτοῖς
  choice: አዘዛቸው
  rationale: ግሱ ግልጽ ትእዛዝ ወይም አደራ መስጠትን ያመለክታል፤ «አዘዛቸው» የንግግሩን ኃይል ይጠብቃል።
- source_word: Μηδενὶ εἴπητε
  choice: ለማንም አትንገሩ
  rationale: አሉታዊውን ትእዛዝ ትክክለኛና ተፈጥሯዊ በሆነ የአማርኛ አገላለጽ ያቀርባል።
- source_word: τὸ ὅραμα
  choice: ራእዩን
  rationale: «ራእይ» የታየውን ነገር ከመለኮታዊ መገለጥ ጋር ሊኖረው የሚችለውን ድምፀት ሳያጠፋ የግሪኩን ስም በቀጥታ ያስተላልፋል።
- source_word: ἕως οὗ
  choice: እስኪ… ድረስ
  rationale: የክልከላውን የጊዜ ገደብ በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: የሰው ልጅ
  rationale: የኢየሱስን ራስ-መጠሪያ ሳይተረጉም ወይም ሳይተካ በተለመደው መጽሐፍ ቅዱሳዊ አገላለጽ ያቀርባል።
- source_word: ἐκ νεκρῶν
  choice: ከሙታን
  rationale: ከሞቱት ወገን መካከል መነሣትን የሚያመለክተውን የግሪክ አገላለጽ በአጭርና በተለመደ አማርኛ ያስተላልፋል።
- source_word: ἐγερθῇ
  choice: እስኪነሣ
  rationale: በትንሣኤ አውድ ተፈጥሯዊ የሆነ አማርኛ ሲሆን፣ ድርጊቱን ፈጻሚ ከግሪኩ በላይ በግልጽ አይጨምርም።
theological_decisions:
- issue: የትንሣኤው አገላለጽና የግሱ ድምፅ
  choice: ከሙታን እስኪነሣ
  alternative: ከሙታን እስኪነሣ ድረስ / ከሙታን እስኪነሳ ድረስ
  rationale: የግሪኩ ግስ ተገብሮ ነው። አማርኛው «እስኪነሣ» በትንሣኤ አውድ ተፈጥሯዊ ሲሆን አስነሺውን በስም በመጨመር ጽሑፉ ያልገለጠውን አይወስንም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለሰፊው አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። «ራእይ» እና «የሰው ልጅ» የሚሉት ቃላት የምንጩን መጽሐፍ ቅዱሳዊና ሥነ መለኮታዊ ድምፀት ለመጠበቅ ተመርጠዋል።
