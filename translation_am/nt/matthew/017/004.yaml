  rationale: ጥቅሱ እነዚህን መዋቅሮች ከዳስ በዓል ጋር በግልጽ አያመሳስላቸውም። ስለዚህ ዋናው ጽሑፍ ገለልተኛውን ቃል ይጠቀማል፤ ሌሎቹ አማራጮች ግን በማስታወሻ ተጠብቀዋል።
