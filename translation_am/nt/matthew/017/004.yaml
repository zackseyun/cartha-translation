  text: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν τῷ Ἰησοῦ· Κύριε, καλόν ἐστιν ἡμᾶς ὧδε εἶναι· εἰ θέλεις, ⸀ποιήσω ὧδε τρεῖς σκηνάς, σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ ⸂Ἠλίᾳ μίαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/004.yaml
  text: 'Then Peter answered and said to Jesus[a], “Lord, it is good for us to be here. If you wish, I will make three shelters here: one for you, one for Moses, and one for Elijah.”'
translation:
  language: am
  text: ጴጥሮስም መልሶ ለኢየሱስ እንዲህ አለው፦ “ጌታ ሆይ፣ እዚህ መሆናችን መልካም ነው። ብትወድ፣ እዚህ ሦስት መጠለያዎችን[a] እሠራለሁ፤ አንዱን ለአንተ፣ አንዱን ለሙሴ፣ አንዱንም ለኤልያስ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ σκηνάς (ስኬናስ) የሚለው ቃል “ድንኳኖች”፣ “ዳሶች” ወይም “ጎጆዎች” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ … εἶπεν
  choice: ጴጥሮስም መልሶ … አለው
  rationale: የግሪኩን የንግግር መግቢያ አገላለጽ በተፈጥሯዊ የአማርኛ አቀራረብ ያስተላልፋል፤ δέ የትረካ ቅደም ተከተልን ስለሚያመለክት በ“ም” ተንጸባርቋል።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: በቀጥታ ንግግር ያለውን አክብሮታዊ አድራሻና ሊኖረው የሚችለውን ሥነ መለኮታዊ ክብደት ይጠብቃል።
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: እዚህ መሆናችን መልካም ነው
  rationale: የግሪኩን የማይወሰን ግስ አወቃቀር በግልጽና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: εἰ θέλεις
  choice: ብትወድ
  rationale: θέλω የሚያመለክተውን ፍላጎት ወይም ፈቃደኝነት በአክብሮታዊና አጭር አገላለጽ ያስተላልፋል።
- source_word: ποιήσω
  choice: እሠራለሁ
  rationale: በSBLGNT ዋና ጽሑፍ ያለውን የነጠላ ተናጋሪ የወደፊት ጊዜ ግስ ይጠብቃል።
- source_word: σκηνάς
  choice: መጠለያዎችን
  rationale: ጊዜያዊ መጠለያዎችን የሚያመለክተውን ሰፊ ትርጉም በዘመናዊና ግልጽ ቃል ያቀርባል፤ ከበዓል ጋር ያለውን ሊሆን የሚችል ግንኙነት በዋናው ጽሑፍ አይወስንም።
- source_word: σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν
  choice: አንዱን ለአንተ፣ አንዱን ለሙሴ፣ አንዱንም ለኤልያስ
  rationale: በግሪኩ የተደጋገመውን μίαν (‘አንድ’) ለእያንዳንዱ ሰው በመድገም የስርጭቱን አጽንዖት ይጠብቃል።
