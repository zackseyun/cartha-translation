  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ጥቅም ላይ ውሏል። “ነገሥታት” የሚለው መደበኛ መጽሐፍ ቅዱሳዊ ክብርን ሲጠብቅ፣ “የነፍስ ወከፍ ግብር” ደግሞ የግብሩን ዓይነት ለዘመናዊ አንባቢ ግልጽ ያደርጋል። የምንጭ ጽሑፉን ፍቺ ተከትሎ የማስታወሻ ምልክቶቹ ከሚያብራሯቸው የግብር ቃላትና “ከሌሎች” ቀጥሎ ተቀምጠዋል።
