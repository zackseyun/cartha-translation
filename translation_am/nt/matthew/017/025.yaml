review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the affirmative reply, Peter's entry into the house, Jesus' initiative in speaking, the address to Simon, and the contrast between a customs/duties levy (τέλη) and a head tax (κῆνσος). It also correctly retains the specific familial term “sons” and the outsider contrast of ἀλλοτρίων.
  naturalness: The verse is generally natural modern Amharic. Replacing “የነፍስ ወከፍ ግብር” with the more idiomatic “የራስ ግብር” improves readability while retaining the sense of a poll/head tax. “ቀድሞ አነጋገረው” more explicitly and smoothly conveys that Jesus addressed Peter first.
  terminology: “ቀረጥ” suitably renders τέλη in contrast with “የራስ ግብር” for κῆνσος. “ከገዛ ወንድ ልጆቻቸው” appropriately retains υἱῶν, and “ከሌሎች” is a natural contextual rendering of ἀλλοτρίων. Footnote a should describe the two terms and their alternatives without presenting an imprecise combined alternative.
  issues:
  - severity: low
    issue: The wording “የነፍስ ወከፍ ግብር” is less idiomatic than “የራስ ግብር.”
    rationale: The latter is standard, clear modern Amharic for a tax imposed per person and preserves the distinction from customs/duties.
  - severity: low
    issue: Footnote a’s opening, ““ቀረጥ ወይም ግብር” ተብሎም ሊተረጎም ይችላል,” does not clearly identify which source term has which alternative.
    rationale: A lexical footnote should distinguish τέλη from κῆνσος explicitly, as the main text does.
