  text: λέγει· Ναί. καὶ ⸀ἐλθόντα εἰς τὴν οἰκίαν προέφθασεν αὐτὸν ὁ Ἰησοῦς λέγων· Τί σοι δοκεῖ, Σίμων; οἱ βασιλεῖς τῆς γῆς ἀπὸ τίνων λαμβάνουσιν τέλη ἢ κῆνσον; ἀπὸ τῶν υἱῶν αὐτῶν ἢ ἀπὸ τῶν ἀλλοτρίων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/025.yaml
  text: He said[a], “Yes.” And when he came into the house, Jesus spoke to him first, saying, “What do you think[b], Simon? From whom do the kings of the earth collect duties or poll tax—from their own sons or from others?”
translation:
  language: am
  text: እርሱም፣ “አዎን” አለ። ወደ ቤትም በገባ ጊዜ፣ ኢየሱስ ቀድሞ አነጋገረው፤ “ስምዖን ሆይ፣ ምን ይመስልሃል? የምድር ነገሥታት ቀረጥ ወይም የራስ ግብር[a] የሚቀበሉት ከማን ነው? ከገዛ ወንድ ልጆቻቸው ነው ወይስ ከሌሎች[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: τέλη “ቀረጥ” የሚለው የጉምሩክ ክፍያ ወይም ተመሳሳይ ቀጥተኛ ያልሆነ ግብር ሊሆን ይችላል፤ κῆνσος “የራስ ግብር” ደግሞ በእያንዳንዱ ሰው ላይ የሚጣል ግብር ነው።
    reason: lexical_alternative
  - marker: b
    text: ወይም “ከባዕዳን።” ἀλλοτρίων የሚለው የገዛ ቤተሰብ ያልሆኑትን፣ ማለትም ከቤተሰቡ ውጭ ያሉትን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ναί
  choice: አዎን
  rationale: ቀላልና ቀጥተኛውን አዎንታዊ መልስ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: ἐλθόντα εἰς τὴν οἰκίαν
  choice: ወደ ቤትም በገባ ጊዜ
  rationale: የተሳቢው ባለቤት ጴጥሮስ መሆኑን በአማርኛ ግልጽ በሆነ ጊዜያዊ ሐረግ ያሳያል።
- source_word: προέφθασεν αὐτὸν
  choice: ኢየሱስ ቀድሞ እንዲህ አለው
  rationale: ጴጥሮስ ከመናገሩ በፊት ኢየሱስ ንግግሩን እንደጀመረ የግሪኩን ፈሊጣዊ ትርጉም በግልጽ መንገድ ያስተላልፋል።
- source_word: Τί σοι δοκεῖ
  choice: ምን ይመስልሃል?
  rationale: ስምዖን የራሱን ፍርድ እንዲሰጥ የሚጠይቀውን አገላለጽ ተፈጥሯዊ በሆነ አማርኛ ያቀርባል።
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: የምድር ነገሥታት
  rationale: γῆን ወደ አንድ የተወሰነ አገር ሳያጠብ ሰፊውን ትርጉም ይጠብቃል።
- source_word: τέλη
  choice: ቀረጥ
  rationale: የጉምሩክ ክፍያን፣ ቀረጥንና መሰል ቀጥተኛ ያልሆኑ ክፍያዎችን የሚያመለክተውን ቃል በአጭርና በተለመደ አማርኛ ይገልጻል።
- source_word: κῆνσον
  choice: የነፍስ ወከፍ ግብር
  rationale: በእያንዳንዱ ሰው ላይ የሚጣለውን የራስ ግብር ይገልጻል፤ ከτέλη ጋር ያለውንም ልዩነት ይጠብቃል።
- source_word: υἱῶν αὐτῶν
  choice: ከገዛ ወንድ ልጆቻቸው
  rationale: υἱοί የሚለውን የወንድ ልጆች ትርጉምና ከቤተሰብ ውጭ ካሉት ጋር የቀረበውን ንጽጽር ይጠብቃል።
- source_word: ἀλλοτρίων
  choice: ከሌሎች
  rationale: የነገሥታቱ ቤተሰብ ያልሆኑትን ውጭ ሰዎች በተፈጥሯዊና አጭር አማርኛ ይገልጻል፤ ዝርዝሩ በማስታወሻ ተብራርቷል።
theological_decisions:
- issue: በኢየሱስ ምሳሌ ውስጥ “ወንድ ልጆች” የሚለው ሊያመለክተው የሚችለው ክርስቶሎጂያዊ ፍቺ
  choice: “ከገዛ ወንድ ልጆቻቸው” የሚለውን ቀጥተኛ የቤተሰብ ቃል ማቆየት
  alternative: “ከልጆቻቸው” ወይም “ከተገዢዎቻቸው”
  rationale: የንጉሥ የገዛ ቤተሰብ ከግብር ነጻ መሆኑ የንጽጽሩ ቀጥተኛ ነጥብ ነው፤ ቀጣዩ ቁጥር የሚያስነሣውን ሥነ መለኮታዊ ጫና እዚህ ሳይብራራ ማቆየት የጽሑፉን ውጥረት ይጠብቃል።
