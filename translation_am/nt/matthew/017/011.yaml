    text: ወይም፣ “ኤልያስ ይመጣል፤ ሁሉንም ወደ ቀድሞ ሁኔታው ይመልሳል።” የግሪክኛው “ይመጣል” የሚለው ግስ በአሁን ጊዜ ቅርጽ ቢሆንም፣ በዚህ ሐረግ የወደፊት ትርጉም አለው።
