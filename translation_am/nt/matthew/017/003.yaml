- source_word: αὐτοῖς
  choice: -ላቸው
  rationale: መገለጡን ያዩትን ሰዎች የሚያመለክተውን የዳቲቭ ተውላጠ ስም በአማርኛው ግስ ውስጥ በተፈጥሯዊ ሁኔታ ያካትታል።
- source_word: Μωϋσῆς
