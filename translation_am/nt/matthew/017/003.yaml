lexical_decisions:
- source_word: ἰδοὺ
  choice: እነሆም
  rationale: የአንባቢውን ትኩረት ወደ ድንገተኛው ትዕይንት የሚያዞረውን የግሪክ ቃል ኃይል በተፈጥሯዊና ክብር ባለው አማርኛ ይጠብቃል።
- source_word: ὤφθη
  choice: ተገለጡላቸው
