  choice: ከእርሱ ጋር
  rationale: μετά ከወራሽ ቅጽ ጋር የአብሮነትን ግንኙነት ያሳያል፤ ተውላጠ ስሙን በመጠበቅ የግሪኩን አገላለጽ ይከተላል።
theological_decisions:
- issue: የαὐτοῦ ተውላጠ ስም ተጠቃሽ
  choice: ‘እርሱ’ በአውዱ ኢየሱስን ያመለክታል፤ ትርጉሙ ግን ተውላጠ ስሙን እንዳለ ይጠብቃል።
