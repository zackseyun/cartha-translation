  text: καὶ ἐπηρώτησαν αὐτὸν οἱ ⸀μαθηταὶ λέγοντες· Τί οὖν οἱ γραμματεῖς λέγουσιν ὅτι Ἠλίαν δεῖ ἐλθεῖν πρῶτον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/010.yaml
  text: And the disciples asked him, saying, “Why then do the scribes say that Elijah must come first?”
translation:
  language: am
  text: ደቀ መዛሙርቱም፣ “ታዲያ ጻፎቹ ኤልያስ አስቀድሞ መምጣት አለበት የሚሉት ለምንድን ነው?” ብለው ጠየቁት።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησαν
  choice: ጠየቁት
  rationale: የግሪኩ ግስ ቀጥተኛ ጥያቄን ያስገባል፤ “ጠየቁት” ተፈጥሯዊና ትክክለኛ የአማርኛ አቻ ነው።
- source_word: οἱ μαθηταὶ
  choice: ደቀ መዛሙርቱ
  rationale: መስተዋድዱ በዐውዱ የሚታወቀውን የተወሰነ ቡድን ያመለክታል፤ በምንጩ የሌለውን “የእርሱ” አልጨመረም።
- source_word: λέγοντες
  choice: ብለው
  rationale: የቦዝ አንቀጹን ተግባር በተፈጥሯዊ የአማርኛ የቀጥተኛ ንግግር አወቃቀር ይጠብቃል።
- source_word: Τί οὖν
  choice: ታዲያ … ለምንድን ነው?
  rationale: τί በዚህ አገባብ ምክንያትን ይጠይቃል፤ οὖν ደግሞ ከቀደመው ዐውድ ጋር ያለውን ድምዳሜያዊ ግንኙነት “ታዲያ” በሚለው ያሳያል።
- source_word: οἱ γραμματεῖς
  choice: የሕግ ጸሐፍት
  rationale: γραμματεῖς በወንጌላት ዐውድ የሕጉን ቅጂና ትርጓሜ የተማሩ ሰዎችን ያመለክታል፤ “የሕግ ጸሐፍት” ባህላዊውን ስያሜ ከግልጽ ትርጉም ጋር ያቀርባል።
- source_word: λέγουσιν ὅτι
  choice: የሚሉት
  rationale: የአሁን ጊዜውን አጠቃላይ አባባልና ተከታዩን የይዘት ንግግር በተፈጥሯዊ አማርኛ ያገናኛል።
- source_word: Ἠλίαν
  choice: ኤልያስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደው የስሙ ቅርጽ ነው።
- source_word: δεῖ ἐλθεῖν
  choice: መምጣት አለበት
  rationale: δεῖ የሚገልጸውን አስፈላጊነት “አለበት” በግልጽና ተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: πρῶτον
  choice: አስቀድሞ
  rationale: በዚህ ዐውድ በቅደም ተከተል ቀድሞ መምጣትን በተፈጥሯዊ አማርኛ ይገልጻል።
theological_decisions:
- issue: ስለ ኤልያስ መምጣት የቀረበው ጥያቄ የትርጓሜ ኃይል
  choice: ጥያቄውን የሕግ ጸሐፍትን ትምህርት እንደሚያጸድቅ፣ እንደሚቃወም ወይም በከፊል እንደሚያርም ሳይወስን ቀርቧል።
  alternative: ጥያቄውን በጥርጣሬ ድምፅ መተርጎም ወይም የሚልክያስን ትንቢት በዚሁ ቁጥር ውስጥ በማብራሪያ መጨመር።
  rationale: ጥቅሱ የደቀ መዛሙርቱን ጥያቄ ብቻ ይዘግባል፤ መልሱ በማቴዎስ 17፥11–13 ይመጣል። ስለዚህ ትርጉሙ ያለውን ሥነ መለኮታዊ ውጥረት አስቀምጧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩን ቃላት ቅደም ተከተል በግድ ከመከተል ይልቅ የአማርኛን ተፈጥሯዊ የጥያቄ አወቃቀር ተከትሏል፤ ሆኖም የምንጩ ይዘትና ውጥረት ተጠብቋል።
