    reason: lexical_alternative
  - marker: c
    text: “እነሆ” የሚለው በግሪኩ ጽሑፍ ሁለት ጊዜ ተደግሟል፤ ትኩረትን የሚስብና የትዕይንቱን ድራማዊነት የሚያጎላ ምልክት ነው።
