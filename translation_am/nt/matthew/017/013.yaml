  text: Then the disciples understood that he had spoken to them about John the Baptist[a].
translation:
  language: am
  text: በዚያን ጊዜ ደቀ መዛሙርቱ እርሱ ስለ መጥምቁ ዮሐንስ[a] እንደነገራቸው ተረዱ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «አጥማቂው ዮሐንስ።»
    reason: βαπτιστής የማጥመቅን ተግባር የሚገልጽ በመሆኑ «አጥማቂው» የሚለው ይበልጥ ግልጽ የቃል አማራጭ ነው።
lexical_decisions:
- source_word: τότε
  choice: በዚያን ጊዜ
  rationale: በትረካው ውስጥ ደቀ መዛሙርቱ የተረዱበትን ቅጽበት በተፈጥሯዊ አማርኛ ያመለክታል።
- source_word: συνῆκαν
  choice: ተረዱ
  rationale: የንግግሩን ትርጉም በዚያን ጊዜ እንደተገነዘቡ በግልጽና ተፈጥሯዊ ቃል ይገልጣል።
- source_word: οἱ μαθηταὶ
  choice: ደቀ መዛሙርቱ
  rationale: በወንጌላት ትረካ የኢየሱስን ተከታዮች ለመጥራት የተለመደና የሚታወቅ አገላለጽ ነው።
- source_word: ὅτι
  choice: እንደ
  rationale: ደቀ መዛሙርቱ የተረዱትን ይዘት በአማርኛ ተዘዋዋሪ ንግግር በተፈጥሯዊ ሁኔታ ያስገባል፤ ምክንያትን አያመለክትም።
- source_word: περὶ
  choice: ስለ
  rationale: ከተነገረው ነገር ርዕሰ ጉዳይ ጋር ያለውን ዝምድና በቀላልና ወቅታዊ አማርኛ ይገልጣል።
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: መጥምቁ ዮሐንስ
  rationale: βαπτιστής ዮሐንስን በማጥመቅ ተግባሩ የሚለይ ማዕረግ ነው፤ «መጥምቁ ዮሐንስ» በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የታወቀ ሲሆን የስሙን መለያ በትክክል ያቀርባል።
- source_word: εἶπεν αὐτοῖς
  choice: እንደነገራቸው
  rationale: የኢየሱስ ንግግር ከደቀ መዛሙርቱ መረዳት በፊት መሆኑን የአማርኛው ግስ አወቃቀር በተፈጥሯዊ ሁኔታ ያሳያል።
theological_decisions:
- issue: በቅርብ ዐውደ ንባብ ውስጥ የኤልያስ ምሳሌ ማንን እንደሚያመለክት
  choice: ደቀ መዛሙርቱ ኢየሱስ ስለ መጥምቁ ዮሐንስ እንደተናገራቸው መረዳታቸውን በግልጽ መግለጽ
  alternative: ዮሐንስን በቀጥታ ከኤልያስ ጋር በትርጉሙ ውስጥ ማመሳሰል ወይም ትርጓሜያዊ ማብራሪያ መጨመር
  rationale: ጥቅሱ የደቀ መዛሙርቱን መረዳት በቀጥታ ይዘግባል፤ ትርጉሙ ይህንን የትረካውን ግልጽ መለያ ማቅረብ እንጂ ከቃላቱ በላይ ሥነ መለኮታዊ ማብራሪያ ማከል የለበትም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር አማርኛ ተጠቅሟል። «ደቀ መዛሙርቱ» እና «መጥምቁ ዮሐንስ» የታወቁ መጽሐፍ ቅዱሳዊ አገላለጾች ሲሆኑ፣ የዓረፍተ ነገሩ አወቃቀር ለዘመናዊ አንባቢ ተፈጥሯዊ እንዲሆን ተደርጓል።
