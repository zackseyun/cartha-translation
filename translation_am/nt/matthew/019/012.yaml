  source_fidelity: The draft accurately preserves the threefold repetition of εὐνοῦχοι, the passive distinction in the second clause, and the deliberately unresolved wording of εὐνούχισαν ἑαυτούς in the third. The final imperative is conveyed well by “ይህን ሊቀበል የሚችል ይቀበለው።” A small adjustment to the διά + accusative phrase makes its purposive/motivational force more explicit.
  naturalness: The text is clear, dignified modern Amharic. “ለሰማያት መንግሥት ሲሉ” is more idiomatic and more precise here than “ስለ ሰማያት መንግሥት.” In footnote a, “ጋብቻ ላለማድረግ” is natural usage; “ጋብቻን ላለመፈጸም” is less idiomatic.
