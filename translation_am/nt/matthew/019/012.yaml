  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ የሚገባ አማርኛ ተጠቅሟል። ‘ጃንደረባ’ መደበኛውን መጽሐፍ ቅዱሳዊ ቃል ይጠብቃል፤ ነገር ግን የሦስተኛው ክፍል ትርጓሜ እንዳይዘጋ ገላጭ ማስታወሻ ተጨምሯል።
