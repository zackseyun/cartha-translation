source:
  edition: SBLGNT
  text: εἰσὶν γὰρ εὐνοῦχοι οἵτινες ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνούχισαν ἑαυτοὺς διὰ τὴν βασιλείαν τῶν οὐρανῶν. ὁ δυνάμενος χωρεῖν χωρείτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/012.yaml
  text: For there are eunuchs who were born that way from their mother’s womb[a], and there are eunuchs who were made eunuchs by men, and there are eunuchs who made themselves eunuchs for the sake of the kingdom of heaven[b]. The one able to accept this should accept it.
translation:
  language: am
  text: ምክንያቱም ከእናታቸው ማህፀን ጀምሮ እንዲሁ ሆነው የተወለዱ ጃንደረቦች አሉ፤ በሰዎችም ጃንደረቦች የተደረጉ አሉ፤ ለሰማያት መንግሥት ሲሉም ራሳቸውን ጃንደረቦች ያደረጉ አሉ።[a] ይህን ሊቀበል የሚችል ይቀበለው።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ራሳቸውን የሰለቡ” ተብሎም ሊተረጎም ይችላል፤ ብዙዎች ይህን ለሰማያት መንግሥት ሲሉ ጋብቻ ላለማድረግ መምረጥን የሚያመለክት ዘይባዊ ንግግር አድርገው ይረዱታል።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ “ይህን ሊያስተናግድ የሚችል ያስተናግደው።”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐνοῦχοι
  choice: ጃንደረቦች
  rationale: በአማርኛ የግሪኩን መደበኛ ትርጉም የሚያስተላልፍ ሲሆን፣ በሦስቱም ክፍሎች ያለውን የቃል ድግግሞሽ ይጠብቃል፤ ‘ያላገቡ’ ብሎ በመተርጎምም አንድን ትርጓሜ አስቀድሞ አይወስንም።
- source_word: ἐκ κοιλίας μητρὸς
  choice: ከእናታቸው ማህፀን ጀምሮ
  rationale: የምንጩን ሕያው አገላለጽ በተፈጥሯዊ ዘመናዊ አማርኛ ይጠብቃል።
- source_word: ἐγεννήθησαν οὕτως
  choice: እንዲሁ ሆነው የተወለዱ
  rationale: οὕτως የሚያመለክተውን ቀድሞ የተጠቀሰውን ሁኔታ በግልጽና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων
  choice: በሰዎች ጃንደረቦች የተደረጉ
  rationale: ከεὐνοῦχοι ጋር ያለውን የቃል ዝምድና ይጠብቃል፤ ‘የተሰለቡ’ ከሚለው ይበልጥ ሰፊውን ማኅበራዊ ምድብም ይፈቅዳል።
- source_word: εὐνούχισαν ἑαυτοὺς
  choice: ራሳቸውን ጃንደረቦች ያደረጉ
  rationale: የግሪኩን ቀጥተኛና አስደንጋጭ አገላለጽ ይጠብቃል፤ ንግግሩ ቃል በቃል፣ አጋኖ ወይም የጋብቻ መተውን የሚያመለክት ዘይቤ መሆኑን በትርጉሙ አስቀድሞ አይወስንም።
- source_word: διὰ τὴν βασιλείαν τῶν οὐρανῶν
  choice: ስለ ሰማያት መንግሥት
  rationale: διά ከወቃሽ ጋር ያለውን የዓላማና የምክንያት ሐሳብ በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ὁ δυνάμενος χωρεῖν χωρείτω
  choice: ይህን ሊቀበል የሚችል ይቀበለው
  rationale: χωρέω በዚህ አውድ ከባድን ትምህርት ለመቀበል ቦታ መስጠትን ያመለክታል፤ ‘ይቀበለው’ ይህን ፈሊጣዊ ትርጉምና የትእዛዙን ኃይል ይጠብቃል።
theological_decisions:
- issue: εὐνούχισαν ἑαυτοὺς ቃል በቃል ወይስ በዘይቤ መረዳት
  choice: በዋናው ጽሑፍ ‘ራሳቸውን ጃንደረቦች ያደረጉ’ የሚለውን ቀጥተኛ የቃል ቅርጽ ማቆየት
  alternative: ‘ራሳቸውን የሰለቡ’ ወይም ‘ስለ መንግሥቱ ጋብቻን የተዉ’
  rationale: ቁጥሩ ሦስተኛው ምድብ ቃል በቃል፣ አጋኖ ወይም ለፈቃደኝነት ያለጋብቻ ኑሮ የተነገረ ዘይቤ መሆኑን በግልጽ አይፈታም። ስለዚህ ውጥረቱ በዋናው ጽሑፍ ተጠብቆ፣ የተለመደው ዘይባዊ ግንዛቤ በማስታወሻ ተገልጧል።
- issue: ὁ δυνάμενος χωρεῖν χωρείτω የሚለውን የመጨረሻ ማሳሰቢያ አተረጓጎም
  choice: ‘ሊቀበል … ይቀበለው’
  alternative: ‘ሊያስተናግድ … ያስተናግደው’ ወይም ‘ሊይዘው … ይያዘው’
  rationale: ‘መቀበል’ በዘመናዊ አማርኛ አስቸጋሪውን ንግግር መገንዘብና በፈቃድ መቀበልን ያስተላልፋል፤ ሆኖም የግሪኩን ‘ቦታ መስጠት/ማስተናገድ’ ጥላ ትርጉም በማስታወሻ ተጠብቋል።
