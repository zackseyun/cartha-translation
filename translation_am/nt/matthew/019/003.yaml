  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Καὶ προσῆλθον ⸀αὐτῷ Φαρισαῖοι πειράζοντες αὐτὸν καὶ ⸀λέγοντες· Εἰ ἔξεστιν ⸀ἀνθρώπῳ ἀπολῦσαι τὴν γυναῖκα αὐτοῦ κατὰ πᾶσαν αἰτίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/003.yaml
  text: And Pharisees came up to him[a], testing him and saying, “Is it lawful for a man to divorce his wife for any cause?”
translation:
  language: am
  text: ፈሪሳውያንም ወደ እርሱ ቀርበው እየፈተኑትም እንዲህ አሉት፤ “አንድ ባል በማንኛውም ምክንያት[a] ሚስቱን መፍታት ተፈቅዶለታልን?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በማንኛውም ሰበብ” ወይም “በእያንዳንዱ ምክንያት።” የግሪክኛው ሐረግ ለፍቺ የሚፈቀዱ ምክንያቶችን የሚመለከት ሰፊ ሕጋዊ ጥያቄ ያንጸባርቃል።
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον
  choice: ወደ እርሱ ቀርበው
  rationale: የግሱን ወደ አንድ ሰው መምጣትና መቅረብ ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: πειράζοντες
  choice: ሊፈትኑት
  rationale: ቃሉ መፈተንን ያመለክታል፤ የተቃውሞ ዓላማቸውን ከዐውዱ እንዲታወቅ በማድረግ ‘ሊያጠምዱት’ የሚለውን የተጨመረ ትርጓሜ አያስገባም።
- source_word: ἔξεστιν
  choice: ተፈቅዶለታልን?
  rationale: በሕግና በፈቃድ ዙሪያ የቀረበውን ጥያቄ በግልጽና ዘመናዊ አማርኛ ይገልጣል።
- source_word: ἀνθρώπῳ
  choice: አንድ ሰው
  rationale: ቃሉን በቀጥታ ያስተላልፋል፤ ‘ሚስቱን’ የሚለው ዐውድ ጥያቄው ስለ ባል መሆኑን በቂ ሁኔታ ያሳያል።
- source_word: ἀπολῦσαι
  choice: ሚስቱን መፍታት
  rationale: በጋብቻ ዐውድ ἀπολύω የፍቺን ሕጋዊ ትርጉም ይይዛል፤ ‘መፍታት’ በአማርኛ የተለመደ መጽሐፍ ቅዱሳዊና ሕጋዊ አገላለጽ ነው።
- source_word: γυναῖκα αὐτοῦ
  choice: ሚስቱን
  rationale: የባለቤትነት አመልካቹና የፍቺው ዐውድ γυνή እዚህ ‘ሚስት’ ማለት እንደሆነ ያረጋግጣሉ።
- source_word: κατὰ πᾶσαν αἰτίαν
  choice: በማንኛውም ምክንያት
  rationale: ሐረጉ ስለ ፍቺ የሚፈቀዱ ምክንያቶች ስፋት የሚያነሣውን ሕጋዊ ጥያቄ ሳያጠብ ያቀርባል።
theological_decisions:
- issue: የፍቺውን ጥያቄ የመጀመሪያውን ክፍለ ዘመን ሕጋዊ ክርክር ጠብቆ ያለ ቤተ እምነታዊ ውሳኔ ማቅረብ
  choice: “አንድ ሰው በማንኛውም ምክንያት ሚስቱን መፍታት ተፈቅዶለታልን?”
  alternative: “አንድ ባል በማንኛውም ሰበብ ሚስቱን መፍታት በሕግ ይፈቀድለታልን?”
  rationale: ጥቅሱ የኢየሱስን መልስ ከመስጠቱ በፊት ሕጋዊ ፈተናውን ብቻ ያቀርባል። ትርጉሙም የጥያቄውን ስፋትና ውጥረት ይጠብቃል እንጂ በኋላ የተፈጠረን የፍቺ አስተምህሮ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪክኛው ተሳቢ አገባብ በተፈጥሯዊ አማርኛ ‘ሊፈትኑት’ ተብሎ ቀርቧል፤ የሕጋዊ ጥያቄው ስፋት ግን አልተጠበበም።
