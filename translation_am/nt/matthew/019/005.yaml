  text: καὶ εἶπεν· ⸀Ἕνεκα τούτου καταλείψει ἄνθρωπος τὸν πατέρα καὶ τὴν μητέρα καὶ ⸀κολληθήσεται τῇ γυναικὶ αὐτοῦ, καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/005.yaml
  text: and said[a], ‘For this reason a man will leave his father and mother and be joined to his wife, and the two will become one flesh.’
translation:
  language: am
  text: እንዲህም አለ፤ “በዚህ ምክንያት ወንድ ሰው አባቱንና እናቱን ይተዋል፤ ከሚስቱም ጋር ይጣበቃል[a]፤ ሁለቱ አንድ ሥጋ ይሆናሉ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከሚስቱ ጋር ይተሳሰራል” ወይም “ሚስቱን አጥብቆ ይይዛል።” የግሪኩ ግስ ጥብቅ መያያዝን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕνεκα τούτου
  choice: በዚህ ምክንያት
  rationale: የምክንያትና የውጤት ግንኙነቱን በዘመናዊና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: καταλείψει
  choice: ይተዋል
  rationale: የወደፊት ጊዜ አመልካቹንና ከወላጆች መለየትን በቀጥታ ይገልጣል።
- source_word: ἄνθρωπος
  choice: ወንድ ሰው
  rationale: በጋብቻው አውድ ከ‘ሚስቱ’ ጋር የተያያዘውን ወንድ በግልጽ ይጠቁማል፤ እዚህ ላይ አጠቃላይ የሰው ዘር ስያሜ ብቻ አይደለም።
- source_word: κολληθήσεται
  choice: ይጣበቃል
  rationale: ግሱ የሚያመለክተውን ጥብቅ መያያዝ ይጠብቃል፤ በአማርኛም ለጋብቻዊ ቁርኝት ተፈጥሯዊ ነው።
- source_word: γυναικὶ αὐτοῦ
  choice: ከሚስቱም ጋር
  rationale: γυνή በዚህ የጋብቻ አውድ ‘ሚስት’ ማለት ነው፤ የግሪኩ ዳቲቭ ግንኙነትም ‘ከ...ጋር’ በሚለው አገባብ ተገልጧል።
- source_word: οἱ δύο
  choice: ሁለቱም
  rationale: በግሪኩ የተገለጸውን ሁለትነት በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: εἰς σάρκα μίαν
  choice: አንድ ሥጋ ይሆናሉ
  rationale: የዘፍጥረቱን የጋብቻ አንድነት ፈሊጥ በቅርብ ይጠብቃል፤ εἰς የሚያሳየው ወደ አዲስ አንድነት መድረስ ‘ይሆናሉ’ በሚለው ተገልጧል።
theological_decisions:
- issue: በጋብቻ ጥቅሱ ውስጥ ያለው ጾታዊ አገላለጽ
  choice: ወንድ ሰው ... ሚስቱ
  alternative: ሰው ... የትዳር ጓደኛው
  rationale: ጥቅሱ የሚገልጠው ወንድንና ሚስቱን ስለሆነ፣ ምንጩ ያለው ጾታዊ ግልጽነት ተጠብቋል።
- issue: የጋብቻ አንድነት ፈሊጥ
  choice: ሁለቱም አንድ ሥጋ ይሆናሉ
  alternative: ሁለቱም አንድ ሥጋ ናቸው
  rationale: ‘ይሆናሉ’ የἔσονται εἰςን የውጤትና ወደ አንድነት የመግባት ኃይል ይጠብቃል፤ የፈሊጡን ሥነ መለኮታዊና ግንኙነታዊ ክብደትም አይፈታውም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ አማርኛን ይጠቀማል። የቅዱስ መጽሐፍ ጥቅስ ድምፁን ለማቆየት ‘አንድ ሥጋ’ የሚለው የተለመደ አገላለጽ ተጠብቋል።
