  text: ὁ δὲ ἀποκριθεὶς ⸀εἶπεν· Οὐκ ἀνέγνωτε ὅτι ὁ ⸀κτίσας ἀπ’ ἀρχῆς ἄρσεν καὶ θῆλυ ἐποίησεν αὐτοὺς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/004.yaml
  text: He answered, “Have you not read that from the beginning the one who created them made them male and female?”
translation:
  language: am
  text: እርሱም መልሶ፣ “ከመጀመሪያ ጀምሮ የፈጠራቸው[b] ወንድና ሴት አደረጋቸው የሚል አላነበባችሁምን?[a]” አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አላነበባችሁም?”
    reason: የአማርኛው አሉታዊ ጥያቄ በ‘-ምን?’ ወይም በአጭሩ ‘-ም?’ ሊቀርብ ይችላል።
  - marker: b
    text: በግሪክ፣ “የፈጠረው [እርሱ]”፤ ወይም፣ “ፈጣሪው።”
    reason: ὁ κτίσας አንቀጽ-አሳታፊ ነው፤ ‘ፈጣሪው’ የሚለው የሚቻል ነገር ግን እንደ ማዕረግ የሚያሰማ አማራጭ ነው።
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: እርሱም መልሶ … አለ
  rationale: የግሪኩን የመልስ አወቃቀር በተፈጥሯዊ አማርኛ ይገልጣል፤ ‘መልሶ እንዲህ አለ’ የሚለውን አላስፈላጊ ድግግሞሽም ያስወግዳል።
- source_word: Οὐκ ἀνέγνωτε
  choice: አላነበባችሁምን?
  rationale: የተጠያቂዎቹን የቅዱስ ጽሑፍ እውቀት የሚሞግተውን አሉታዊ ጥያቄ በተፈጥሯዊና ክቡር አማርኛ ያቀርባል።
- source_word: ὁ κτίσας
  choice: የፈጠረው
  rationale: ስም ያልተጠቀሰበትን የግሪክ አንቀጽ-አሳታፊ ቅርጽ በቅርብ ይከተላል፤ ‘ፈጣሪ’ የሚለውን የማዕረግ አተረጓጎም አያስገባም።
- source_word: ἀπ’ ἀρχῆς
  choice: ከመጀመሪያ
  rationale: የዘፍጥረትን የፍጥረት ቋንቋ የሚያስተጋባ እና የግሪኩን ቅድመ-አቀማመጥ የሚያቆይ ተፈጥሯዊ አገላለጽ ነው።
- source_word: ἄρσεν καὶ θῆλυ
  choice: ወንድና ሴት
  rationale: የዘፍጥረት 1፥27ን ፍጥረታዊ ጥንድ በተለመደና ግልጽ አማርኛ ይጠብቃል።
- source_word: ἐποίησεν αὐτούς
  choice: አድርጎ እንደፈጠራቸው
  rationale: ‘ወንድና ሴት አደረጋቸው’ የሚለው ብቻ የፍጥረትን ተግባር ሊያደበዝዝ ስለሚችል፣ በአማርኛ ግልጽነት ‘ፈጠረ’ ተጠቅሟል፤ የመልኩ ልዩነት ‘አድርጎ’ በሚለው ተጠብቋል።
theological_decisions:
- issue: ከዘፍጥረት 1፥27 ጋር ያለው የፍጥረት አገናኝ
  choice: ወንድና ሴት አድርጎ
  alternative: ወንድና ሴት ሆነው / ወንድና ሴት አድርጎአቸው
  rationale: የግሪኩን ‘ἄρσεν καὶ θῆλυ’ ቀጥተኛ ፍጥረታዊ ጥንድ ያቆያል፤ ጥቅሱ ከሚለው በላይ የሆነ የእምነት ሥርዓት መደምደሚያ አይጨምርም።
- issue: ‘ከመጀመሪያ’ የሚለው ሐረግ የሚያመለክተው
  choice: ከመጀመሪያ እነርሱን የፈጠረው
  alternative: እነርሱን የፈጠረው ከመጀመሪያ
  rationale: በግሪኩ ያለውን ትንሽ የአያያዝ አሻሚነት ሳይገድብ፣ ሐረጉን ከፍጥረት ተግባሩ ጋር በቅርብ ያቆያል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለአብዛኛው አማርኛ አንባቢ ቀላል የሆነ የትረካ ቋንቋ ተጠቅሟል። ‘የፈጠረው’ የግሪኩን ቅርጽ ይጠብቃል፤ ‘ፈጣሪ’ የሚለው እንደ ማዕረግ አልገባም።
