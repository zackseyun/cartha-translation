review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly represents the marital sense of ἀπολύσῃ, the broad distinction between πορνεία and μοιχᾶται, and includes the bracketed final clause with an appropriate textual-variant note. However, the negated conditional in the exception clause reverses the Greek exception''s sense: «… ካልሆነ በቀር» means ‘except if it is not because of sexual immorality,’ rather than ‘except for/because of sexual immorality.’'
  naturalness: The main wording is generally clear modern standard Amharic. The phrase «የተፈታችንም ሴት» is grammatically malformed; the divorced woman is the direct object of ‘marries’ and should be «የተፈታች ሴትን».
  terminology: «የጾታ ብልግና» suitably retains the broad scope of πορνεία, while «ያመነዝራል» appropriately renders μοιχᾶται. The revised footnote preserves narrower and interpretive alternatives without resolving the disputed exception clause.
  issues:
  - severity: high
    issue: The exception clause uses «ካልሆነ በቀር».
    rationale: The negative conditional changes the exception's meaning. The Greek μὴ ἐπὶ πορνείᾳ establishes the exception for divorce on the ground of πορνεία; in Amharic this is conveyed by «በ… ምክንያት ከሆነ በቀር» (or an equivalent positive exception).
  - severity: medium
    issue: «የተፈታችንም ሴት» is malformed and lacks a clear object marker.
    rationale: ἀπολελυμένην is the feminine accusative object of γαμήσας. «የተፈታች ሴትን» clearly and naturally expresses ‘a/the divorced woman.’
  revised_text: እኔ ግን እላችኋለሁ፤ በጾታ ብልግና ምክንያት ከሆነ በቀር[a] ሚስቱን ፈትቶ ሌላ ሴት የሚያገባ ማንም ያመነዝራል፤ የተፈታች ሴትን የሚያገባም ያመነዝራል።[b]
