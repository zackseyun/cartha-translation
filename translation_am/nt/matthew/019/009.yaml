source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ⸀ὅτι ὃς ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ μὴ ἐπὶ πορνείᾳ καὶ γαμήσῃ ἄλλην μοιχᾶται ⸂καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/009.yaml
  text: But I tell you that whoever divorces his wife[a], except for sexual immorality, and marries another, commits adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: am
  text: እኔ ግን እላችኋለሁ፤ በጾታ ብልግና ምክንያት ከሆነ በቀር[a] ሚስቱን ፈትቶ ሌላ ሴት የሚያገባ ማንም ያመነዝራል፤ የተፈታች ሴትን የሚያገባም ያመነዝራል።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በጾታ ብልግና ምክንያት ከሆነ በቀር” የሚለው የግሪክኛ ሐረግ “ከዝሙት በቀር” ተብሎ ይበልጥ ጠበብ ባለ ትርጉም ሊተረጎም ይችላል፤ አንዳንዶችም “ከጾታዊ ታማኝነት ማጣት በቀር” ብለው ይረዱታል።
    reason: lexical_alternative
  - marker: b
    text: አንዳንድ የእጅ ጽሑፎች “የተፈታች ሴትን የሚያገባም ያመነዝራል” የሚለውን ክፍል አያካትቱም።
    reason: textual_variant
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: እኔ ግን እላችኋለሁ
  rationale: δέ በዐውዱ ያለውን መጠነኛ ንፅፅር “ግን” ያሳያል፤ እኔ የሚለውም የተናጋሪውን አጽንዖት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὃς ἂν
  choice: ማንም … የሚያገባ
  rationale: አጠቃላይና ያልተወሰነውን ሁኔታ ‘ማንም’ በግልጽ ያሳያል።
- source_word: ἀπολύσῃ τὴν γυναῖκα αὐτοῦ
  choice: ሚስቱን ፈትቶ
  rationale: በጋብቻ ዐውድ ἀπολύω ፍቺን ያመለክታል፤ ‘ሚስቱን ፈታ’ በአማርኛ የተለመደና ቀጥተኛ አገላለጽ ነው።
- source_word: μὴ ἐπὶ πορνείᾳ
  choice: በጾታ ብልግና ምክንያት ካልሆነ በቀር
  rationale: ἐπί የምክንያትን ወይም የመሠረትን ሐሳብ ይይዛል፤ πορνείαን ‘ዝሙት’ ብሎ ከማጥበብ ይልቅ ‘የጾታ ብልግና’ ሰፊውን የቃሉን ወሰን ይጠብቃል።
- source_word: γαμήσῃ ἄλλην
  choice: ሌላ ሴት የሚያገባ
  rationale: ἄλλην የሚለው የሴት ጾታ ቅርጽ በአማርኛ ግልጽ እንዲሆን ‘ሴት’ ተጨምሯል።
- source_word: μοιχᾶται
  choice: ያመነዝራል
  rationale: ቃሉ በተለይ ምንዝርን ያመለክታል፤ ከሰፊው πορνεία ጋር ያለው የቃላት ልዩነትም ተጠብቋል።
- source_word: καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται
  choice: የተፈታችንም ሴት የሚያገባ ያመነዝራል
  rationale: የግሪክኛው አንቀጽ አጠቃላይ ሰውን ያመለክታል፤ ፍጹም ተደርጎ የተፈጸመውን ፍቺ የተፈታች በሚለው ቅርጽ ያሳያል።
theological_decisions:
- issue: በልዩ ሁኔታው አንቀጽ ውስጥ πορνεία የሚለው ቃል ያለው ትርጉም
  choice: የጾታ ብልግና
  alternative: ዝሙት፤ ምንዝር፤ ጾታዊ ክህደት
  rationale: πορνεία ከምንዝር ብቻ የሰፋ የትርጉም ወሰን ሊኖረው ስለሚችል፣ ዋናው ጽሑፍ አንድን ጠባብ የእምነት ትርጓሜ አይወስንም፤ ሌሎች አማራጮች በማስታወሻ ቀርበዋል።
- issue: የመጨረሻው καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται አንቀጽ መካተት
  choice: በዋናው ጽሑፍ ማካተትና የጽሑፍ ልዩነቱን በማስታወሻ መግለጽ
  alternative: ከዋናው ጽሑፍ ማስቀረት
  rationale: የቀረበው SBLGNT ጽሑፍ አንቀጹን ከጽሑፋዊ ጥርጣሬ ምልክት ጋር ያካትታል፤ ስለዚህ ተተርጉሞ የእጅ ጽሑፎች ልዩነት በግልጽ ተመዝግቧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ፈታ’፣ ‘አገባ’ እና ‘አመነዘረ’ የተለመዱ የጋብቻና የምንዝር ቃላት ሲሆኑ፣ ‘የጾታ ብልግና’ የግሪክኛውን πορνεία ሰፊ ወሰን ሳያጠብ ያስተላልፋል።
