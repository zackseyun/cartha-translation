id: MAT.19.17
reference: Matthew 19:17
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ· Τί με ⸂ἐρωτᾷς περὶ τοῦ ἀγαθοῦ; εἷς ἐστιν ὁ ἀγαθός⸃· εἰ δὲ θέλεις ⸂εἰς τὴν ζωὴν εἰσελθεῖν⸃, ⸀τήρησον τὰς ἐντολάς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/017.yaml
  text: And he said to him[a], “Why do you ask me about what is good? One is good. But if you want to enter into life[b], keep the commandments.”
translation:
  language: am
  text: እርሱም፣ “ስለ መልካም ነገር ለምን ትጠይቀኛለህ?[a] መልካም የሆነው አንድ ነው።[b] ወደ ሕይወት መግባት ከፈለግህ ግን ትእዛዛትን ጠብቅ” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎችና ትይዩ የወንጌል ዘገባዎች፣ “መልካም ለምን ትለኛለህ? ከአንዱ ከእግዚአብሔር በቀር መልካም የለም” ይላሉ። የSBLGNT የማቴዎስ ጽሑፍ ግን፣ “ስለ መልካም ነገር ለምን ትጠይቀኛለህ? መልካም የሆነው አንድ ነው” ይላል።
    reason: textual_variant
  - marker: b
    text: ይበልጥ ፈሊጣዊ አተረጓጎም፣ “መልካም የሆነ አንድ አለ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί με ἐρωτᾷς περὶ τοῦ ἀγαθοῦ
  choice: ስለ መልካም ነገር ለምን ትጠይቀኛለህ?
  rationale: የግሪኩን ገለልተኛ ነጠላ ቅርጽ እንደ ግላዊ ማጣቀሻ ሳይሆን ‘መልካም ነገር’ በሚለው ረቂቅ/ነገራዊ ትርጉም ያቀርባል፤ ከማርቆስና ከሉቃስ ትይዩ ንባብ ጋር አያስማማውም።
- source_word: εἷς ἐστιν ὁ ἀγαθός
  choice: መልካም የሆነው አንድ ነው
  rationale: የεἷς እና የὁ ἀγαθός ግልጽ አወቃቀርን በአማርኛ ሊነበብ በሚችል መልኩ ይጠብቃል፤ ‘አንድ ብቻ’ በማለት በግሪኩ ያልተገለጸውን ‘ብቻ’ አይጨምርም።
- source_word: εἰ δὲ θέλεις
  choice: ከፈለግህ ግን
  rationale: θέλωን በዘመናዊና ተፈጥሯዊ አማርኛ ‘መፈለግ’ ብሎ ይተረጉማል፤ δέንም በዓረፍተ ነገሩ ተፈጥሯዊ ቦታ ‘ግን’ ብሎ ያቀርባል።
- source_word: εἰς τὴν ζωὴν εἰσελθεῖν
  choice: ወደ ሕይወት መግባት
  rationale: የεἰςን አቅጣጫዊ ኃይል ይጠብቃል፤ በዚህ ሐረግ ያልተጠቀሰውን ‘ዘላለማዊ’ አይጨምርም።
- source_word: τήρησον τὰς ἐντολάς
  choice: ትእዛዛትን ጠብቅ
  rationale: ከመለኮታዊ ትእዛዛት ጋር τηρέω ያለውን ‘መጠበቅ/መፈጸም’ ትርጉም በተለመደው የአማርኛ አገላለጽ ይሰጣል።
theological_decisions:
- issue: የኢየሱስ ንግግር ከመለኮታዊ ቸርነትና ከክርስቶሎጂ ጋር ያለው ግንኙነት
  choice: የማቴዎስን ንባብ በቀጥታ፣ ‘ስለ መልካም ነገር’ የሚል ጥያቄና ‘መልካም የሆነው አንድ ነው’ የሚል መልስ አድርጎ ማቅረብ
  alternative: ከማርቆስና ከሉቃስ ጋር በማስማማት፣ ‘መልካም ለምን ትለኛለህ? ከአንዱ ከእግዚአብሔር በቀር መልካም የለም’ ብሎ መተርጎም
  rationale: የSBLGNT የማቴዎስ ጽሑፍ ከትይዩ ወንጌላት ንባብ ይለያል። ትርጉሙ የማቴዎስን ቃል ይጠብቃል፤ ከዚህም የኢየሱስን መልካምነት የሚክድ ወይም በተቃራኒው ያልተገለጸ የክርስቶሎጂ መደምደሚያ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ልዩ አወቃቀር በዋናው ጽሑፍ ተጠብቆ፣ ይበልጥ ፈሊጣዊው አማራጭ በግርጌ ማስታወሻ ቀርቧል።
