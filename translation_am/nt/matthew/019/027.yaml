id: MAT.19.27
reference: Matthew 19:27
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Τότε ἀποκριθεὶς ὁ Πέτρος εἶπεν αὐτῷ· Ἰδοὺ ἡμεῖς ἀφήκαμεν πάντα καὶ ἠκολουθήσαμέν σοι· τί ἄρα ἔσται ἡμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/027.yaml
  text: Then Peter answered him, “Look, we have left everything and followed you. What then will there be for us?”
translation:
  language: am
  text: ከዚያም ጴጥሮስ መልሶ፣ “እነሆ፣ እኛ ሁሉን ትተን ተከትለንሃል፤ ታዲያ ምን ይሆንልናል?” አለው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: እነሆ
  rationale: የጴጥሮስን አጽንዖትና ትኩረት የመጥራት ኃይል በተፈጥሯዊና ክቡር አማርኛ ያስተላልፋል።
- source_word: ἀφήκαμεν πάντα
  choice: ሁሉን ትተን
  rationale: ፍጹሙን የግስ አኳኋን አሁንም ውጤት ያለው ያለፈ ተግባር አድርጎ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἠκολουθήσαμέν σοι
  choice: ተከትለንሃል
  rationale: በግሪኩ ያለውን የተከተልንህ ቀጥተኛ ግንኙነትና የአሁን ውጤት ያቆያል።
- source_word: τί ἄρα ἔσται ἡμῖν
  choice: ታዲያ ምን ይሆንልናል?
  rationale: ἄρα የሚያሳየውን የውጤት ጥያቄ በ“ታዲያ” ያቀርባል፤ ἡμῖνንም ሳይጨምር ወይም ሳይቀንስ “ለእኛ” በሚለው የግስ ቅጥ ይጠብቃል።
theological_decisions:
- issue: የጴጥሮስ ጥያቄ የሚጠብቀው ነገር
  choice: “ምን ይሆንልናል?” ተብሎ ክፍት ሆኖ ቀርቧል።
  alternative: “ምን ሽልማት እናገኛለን?”
  rationale: የግሪኩ ጽሑፍ “ሽልማት” የሚል ስም አይጠቀምም፤ ስለዚህ ጥያቄው ያለውን ክፍትነትና የትርጓሜ ውጥረት ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር መደበኛ አማርኛ። “እነሆ” መጽሐፍ ቅዱሳዊ ክብር ቢኖረውም እዚህ የἸδοὺን አጽንዖት በግልጽ ያስተላልፋል።
