id: MAT.19.25
reference: Matthew 19:25
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ οἱ ⸀μαθηταὶ ἐξεπλήσσοντο σφόδρα λέγοντες· Τίς ἄρα δύναται σωθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/025.yaml
  text: When the disciples heard this, they were greatly astonished and said, “Who then can be saved?”
translation:
  language: am
  text: ደቀ መዛሙርቱም ይህን ሲሰሙ እጅግ ተደንቀው፣ “ታዲያ ማን ሊድን ይችላል?” አሉ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: ይህን ሲሰሙ
  rationale: የቀደመውን የኢየሱስ ንግግር ከዋናው ምላሽ ጋር በተፈጥሯዊ የጊዜ አንቀጽ ያገናኛል፤ «ይህን» የሚለው ተውላጠ ስም ከአውዱ የተገኘ ነው።
- source_word: δὲ
  choice: -ም
  rationale: የትረካውን ቀጣይነትና ቀላል ንፅፅር በተፈጥሯዊ የአማርኛ አያያዥ ያሳያል።
- source_word: μαθηταὶ
  choice: ደቀ መዛሙርቱ
  rationale: በወንጌላት ውስጥ የኢየሱስን ተከታዮችና ተማሪዎች ለማመልከት የተለመደና ግልጽ አገላለጽ ነው።
- source_word: ἐξεπλήσσοντο σφόδρα
  choice: እጅግ ተደንቀው
  rationale: σφόδρα የሚያሳየውን ከፍተኛ የመደነቅ መጠን ይጠብቃል፤ በአማርኛም ተፈጥሯዊና ክብር ያለው ነው።
- source_word: λέγοντες
  choice: አሉ
  rationale: የአባሪ ንግግር አወቃቀሩን በተፈጥሯዊ የአማርኛ ትረካ እንደ ዋና ግስ ያቀርባል።
- source_word: Τίς ἄρα
  choice: ታዲያ ማን
  rationale: ἄρα ከቀደመው ንግግር የሚወጣውን ድምዳሜና የደቀ መዛሙርቱን ድንጋጤ በ«ታዲያ» በተፈጥሯዊነት ያሳያል።
- source_word: δύναται σωθῆναι
  choice: ሊድን ይችላል
  rationale: የችሎታውን ሞዳላዊ ትርጉምና የσωθῆναιን ተገብሮአዊ የመዳን ሐሳብ በግልጽ ዘመናዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: በዚህ አውድ የσωθῆναι ትርጉም
  choice: ሊድን
  alternative: ከአደጋ ሊያመልጥ / ነፃ ሊወጣ
  rationale: ቅርብ አውዱ ወደ መንግሥተ ሰማያት ስለ መግባት ስለሚናገር፣ ጥያቄው ሰፊውን የድነት ትርጉም ይይዛል። «ሊድን» ይህን ክብደት ይጠብቃል፤ የድነቱን ሂደት ወይም መንገድ ግን ከአውዱ በላይ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ። «ደቀ መዛሙርቱ» መጽሐፍ ቅዱሳዊ አጠቃቀሙን ሲጠብቅ፣ የተቀረው ዓረፍተ ነገር ለዘመናዊ አንባቢ ተፈጥሯዊ ሆኖ ቀርቧል።
