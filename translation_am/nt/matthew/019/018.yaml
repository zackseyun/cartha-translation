id: MAT.19.18
reference: Matthew 19:18
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: λέγει αὐτῷ· Ποίας; ὁ δὲ Ἰησοῦς ⸀εἶπεν· Τὸ Οὐ φονεύσεις, Οὐ μοιχεύσεις, Οὐ κλέψεις, Οὐ ψευδομαρτυρήσεις,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/018.yaml
  text: 'He says to him, “Which ones?” And Jesus said, “The: You shall not murder, you shall not commit adultery, you shall not steal, you shall not bear false witness,”'
translation:
  language: am
  text: እርሱም፣ “የትኞቹን?” አለው። ኢየሱስም እንዲህ አለ፤ “እነዚህን፦ አትግደል፤ አታመንዝር፤ አትስረቅ፤ በሐሰት አትመስክር፤”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ποίας
  choice: የትኞቹን?
  rationale: የጥያቄውን ብዙ ቁጥርና ቀጥተኛ አገባብ በተፈጥሯዊ ዘመናዊ አማርኛ ይጠብቃል።
- source_word: Τὸ
  choice: እነዚህን፦
  rationale: በግሪክ ያለው ነጠላ መስተዋድድ ከተከታዩ የትእዛዛት ዝርዝር ጋር በአገባብ የተዛመደ ነው፤ ቃል በቃል ከመተርጎም ይልቅ ዝርዝሩን በግልጽ ያስገባል።
- source_word: Οὐ φονεύσεις
  choice: አትግደል
  rationale: φονεύω ሕገወጥ ሰው መግደልን ያመለክታል፤ የተለመደው የትእዛዝ አገላለጽ ነው።
- source_word: Οὐ μοιχεύσεις
  choice: አታመንዝር
  rationale: የጋብቻ ታማኝነትን መጣስ የሚያመለክተውን μοιχεύω በትክክል ይገልጻል።
- source_word: Οὐ κλέψεις
  choice: አትስረቅ
  rationale: ቀጥተኛ፣ የተለመደና ግልጽ የክልከላ ትእዛዝ ነው።
- source_word: Οὐ ψευδομαρτυρήσεις
  choice: በሐሰት አትመስክር
  rationale: ψευδομαρτυρέω የሐሰት ምስክርነትን መስጠት ማለት ሲሆን ይህ አገላለጽ ትርጉሙንና የትእዛዙን ቅርጽ ይጠብቃል።
theological_decisions:
- issue: በΤὸ የተጀመረው የዝርዝር መግቢያ
  choice: እነዚህን፦
  alternative: ትእዛዛቱም፦ / ይህን፦
  rationale: ግሪኩ በግልጽ “ትእዛዛቱ” አይልም፤ ስለዚህ ያልተጻፈ ሥነ-መለኮታዊ ማብራሪያ ሳይጨመር የዝርዝሩ መግቢያ ብቻ ተገልጿል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ፤ የትእዛዛቱ አጭርና ትይዩ ቅርጽ ተጠብቋል።
