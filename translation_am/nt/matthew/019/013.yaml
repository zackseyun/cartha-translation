  text: Τότε ⸀προσηνέχθησαν αὐτῷ παιδία ἵνα τὰς χεῖρας ἐπιθῇ αὐτοῖς καὶ προσεύξηται· οἱ δὲ μαθηταὶ ἐπετίμησαν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/013.yaml
  text: Then children were brought to him so that he might lay his hands on them and pray[a]; but the disciples rebuked them.
translation:
  language: am
  text: ከዚያም ልጆችን እጆቹን በላያቸው ጭኖ እንዲጸልይ ወደ እርሱ አመጡ፤ ደቀ መዛሙርቱ ግን ገሠጿቸው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ገሠጿቸው” የሚለው ልጆቹን ወይም ልጆቹን ያመጡትን ሰዎች ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  choice: ከዚያም
  rationale: የትረካውን ቅደም ተከተል በተፈጥሯዊ ዘመናዊ አማርኛ ያመለክታል።
- source_word: προσηνέχθησαν αὐτῷ παιδία
  choice: ልጆችን ... ወደ እርሱ አመጡ
  rationale: የግሪኩን ተገብሮ አወቃቀር በአማርኛ ተፈጥሯዊ በሆነ ያልተወሰነ ባለቤት አንቀጽ ያቀርባል፤ παιδία ላይ ያልተገለጸ የዕድሜ ማጥበብ አልተጨመረም።
- source_word: ἵνα τὰς χεῖρας ἐπιθῇ αὐτοῖς καὶ προσεύξηται
  choice: እጆቹን በላያቸው ጭኖ እንዲጸልይ
  rationale: የዓላማውን ኃይል በ“እንዲጸልይ” ይጠብቃል፤ ብዙ ቁጥር ያለውን “እጆች” ያስቀምጣል፤ በግሪኩ በግልጽ ያልተጻፈውን “ስለ እነርሱ” አይጨምርም።
- source_word: οἱ δὲ μαθηταὶ
  choice: ደቀ መዛሙርቱ ግን
  rationale: δέ የሚያሳየውን ቀላል ንፅፅር “ግን” በተፈጥሯዊ ሁኔታ ይገልጻል።
- source_word: ἐπετίμησαν αὐτοῖς
  choice: ገሠጿቸው
  rationale: ἐπιτιμάω ያለውን የመገሠጽ ኃይል ይጠብቃል፤ የመጨረሻውን ተውላጠ ስም ዋቢ ሳይወስን “-አቸው” ብሎ ያቀርባል።
theological_decisions:
- issue: የመጨረሻው αὐτοῖς ዋቢ
  choice: ገሠጿቸው
  alternative: ልጆቹን ገሠጹ / ልጆቹን ያመጡትን ገሠጹ
  rationale: የግሪኩ ተውላጠ ስም ልጆቹን ወይም እነርሱን ያመጡትን ሊያመለክት ይችላል። ዋናው ጽሑፍ ይህን አሻሚነት ይጠብቃል፣ ማስታወሻውም ያብራራዋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ደቀ መዛሙርት” በወንጌል አገባብ የተለመደ ቃል በመሆኑ ተጠብቋል።
