  yaml_path: translation/nt/matthew/019/023.yaml
  text: Then Jesus said to his disciples[a], “Truly I say to you[b], a rich man will enter the kingdom of heaven with difficulty.”
translation:
  language: am
  text: ከዚያም ኢየሱስ ደቀ መዛሙርቱን፣ “እውነት እላችኋለሁ[a]፤ ሀብታም ሰው ወደ ሰማያት መንግሥት በጭንቅ ይገባል[b]” አላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አሜን፣ እላችኋለሁ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ሀብታም ሰው ወደ ሰማያት መንግሥት በቀላሉ አይገባም።”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ከዚያም
  rationale: የትረካውን ቀጣይነትና ሽግግር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: ደቀ መዛሙርቱን
  rationale: αὐτοῦ የሚያመለክተው የኢየሱስ ደቀ መዛሙርት መሆናቸው በአማርኛው ባለቤትነት ቅጥያ ተጠብቋል።
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: እውነት እላችኋለሁ
  rationale: የኢየሱስን የተጠናከረ ማረጋገጫ በግልጽና በዘመናዊ አማርኛ ያስተላልፋል፤ “አሜን” የሚለው ቀጥተኛ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: πλούσιος
  choice: ሀብታም ሰው
  rationale: በግሪክኛው በስም ፈንታ የቆመውን ነጠላ ተባዕታይ ቅጽ በግልጽ ሁኔታ ያስተላልፋል።
- source_word: δυσκόλως
  choice: በችግር
  rationale: የአገባቡን አስቸጋሪነት ያሳያል፤ በቀጣዩ ቁጥር የሚገለጠውን ከባድ ንጽጽር አስቀድሞ ወደ ‘ፈጽሞ አይቻልም’ አያጠናክረውም።
- source_word: εἰσελεύσεται
  choice: ይገባል
  rationale: የወደፊት ጊዜውንና የመግባትን መሠረታዊ ትርጉም በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: የሰማያት መንግሥት
  rationale: የማቴዎስን ልዩ አገላለጽና የοὐρανῶνን ብዙ ቁጥር በአማርኛ የተለመደው መጽሐፍ ቅዱሳዊ አገላለጽ ይጠብቃል።
theological_decisions:
- issue: πλούσιος የሚለው በስም ፈንታ የቆመ ተባዕታይ ቅጽ
  choice: ሀብታም ሰው
  alternative: ሀብታም
  rationale: ግሪክኛው ነጠላ ተባዕታይ ምሳሌያዊ ግለሰብን ያቀርባል፤ “ሰው” ማለት ይህን በግልጽ ይጠብቃል።
- issue: በἈμὴν የሚጀምረው የኢየሱስ የማረጋገጫ ቀመር
  choice: እውነት እላችኋለሁ
  alternative: አሜን፣ እላችኋለሁ
  rationale: ዋናው ጽሑፍ የቀመሩን ክብደትና ሥልጣናዊ ማረጋገጫ በሚገባ ያስተላልፋል፤ ቀጥተኛው የሴማዊ ቃል ቅርጽ በማስታወሻ ቀርቧል።
- issue: δυσκόλως የሚገልጠው የመግባት አስቸጋሪነት
  choice: በችግር ይገባል
  alternative: እንደ ልብ አይገባም
  rationale: ዋናው ንባብ አስቸጋሪነትን ይገልጣል እንጂ በዚህ ቁጥር ብቻ ፍጹም የማይቻል መሆኑን አይወስንም፤ ስለዚህ የንግግሩ ውጥረት ተጠብቋል።
