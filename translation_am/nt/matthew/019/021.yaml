base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/021.yaml
  text: Jesus said to him[a], “If you want to be perfect, go, sell your possessions and give to the poor, and you will have treasure in heaven; then come, follow me.”
translation:
  language: am
  text: ኢየሱስም፣ “ፍጹም[a] ለመሆን ከፈለግህ፣ ሄደህ ንብረትህን ሽጥና ለድሆች ስጥ፤ በሰማይም ሀብት ይኖርሃል። ከዚያም መጥተህ ተከተለኝ” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ ቃል “ፍጹም፣” “ሙሉ” ወይም “የበሰለ” ማለት ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: ኢየሱስም … አለው
  rationale: የግሪኩን ተራ የንግግር መግለጫ በተፈጥሯዊ የአማርኛ የትረካ አወቃቀር ያቀርባል።
- source_word: τέλειος
  choice: ፍጹም
  rationale: ቃሉ ፍጹም፣ ሙሉ ወይም የበሰለ ማለት ሊሆን ይችላል፤ «ፍጹም» ቀጥተኛውንና በማቴዎስ የሚታወቀውን አገላለጽ ይጠብቃል፣ አማራጩም በማስታወሻ ተጠቅሷል።
- source_word: ὕπαγε πώλησόν σου τὰ ὑπάρχοντα
  choice: ሄደህ ያለህን ንብረት ሽጥ
  rationale: ተከታታይ ትእዛዞቹን በተፈጥሯዊ አማርኛ ያቀርባል፤ τὰ ὑπάρχοντα የሰውየውን ይዞታ ወይም ንብረት ያመለክታል።
- source_word: δὸς πτωχοῖς
  choice: ለድሆች ስጥ
  rationale: ለድሆች ቁሳዊ እርዳታ መስጠትን በቀጥታና በግልጽ ይገልጻል።
- source_word: ἕξεις θησαυρὸν ἐν οὐρανοῖς
  choice: በሰማይም ሀብት ይኖርሃል
  rationale: የግሪኩን የወደፊት ቃልና ሰማያዊ ሀብት የሚለውን ምስል ይጠብቃል፤ የግሪኩ ብዙ ቁጥር οὐρανοῖς በተፈጥሯዊ አማርኛ «በሰማይ» ተብሏል።
- source_word: δεῦρο ἀκολούθει μοι
  choice: ከዚያም መጥተህ ተከተለኝ
  rationale: የመምጣት ጥሪውን፣ የድርጊቶቹን ቅደም ተከተልና የደቀ መዝሙርነት ጥሪውን ያስተላልፋል።
