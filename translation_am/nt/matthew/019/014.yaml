  verdict: revise
  source_fidelity: The latter clause accurately retains the representative force of τῶν τοιούτων and Matthew’s ‘kingdom of heaven.’ The opening imperative, however, is not idiomatic Amharic and can be read as ‘leave the children,’ rather than clearly permitting them to come.
  naturalness: ‘ልጆቹን ተዉአቸው’ redundantly combines an explicit accusative object with an object suffix and is unnatural in modern standard Amharic. Recasting the coordinated commands makes the intended permission and prohibition clear.
  terminology: ‘የሰማያት መንግሥት’ and ‘እንደ እነዚህ ላሉት’ are appropriate and preserve the source’s theological openness. ‘ኢየሱስ’ is standard.
