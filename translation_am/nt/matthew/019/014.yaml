  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἄφετε τὰ παιδία καὶ μὴ κωλύετε αὐτὰ ἐλθεῖν πρός με, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/014.yaml
  text: But Jesus said[a], “Let the children come, and do not hinder them from coming to me[b], for the kingdom of heaven belongs to such as these.”
translation:
  language: am
  text: ኢየሱስ ግን፣ “ልጆቹ ወደ እኔ እንዲመጡ ፍቀዱላቸው፤ አትከልክሏቸውም፤ የሰማያት መንግሥት እንደ እነዚህ ላሉት ነውና[a]” አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “የሰማያት መንግሥት የእንደነዚህ ዓይነቶች ነውና።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄφετε
  choice: ተዉአቸው
  rationale: በዚህ ዐውድ ἀφίημι ልጆቹ እንዲመጡ መፍቀድን የሚገልጽ ትእዛዝ ነው፤ “ተዉአቸው” ይህን በተፈጥሯዊና አጭር አማርኛ ያስተላልፋል።
- source_word: τὰ παιδία
  choice: ልጆቹን
  rationale: παιδία በዚህ ስፍራ ልጆችን፣ ብዙውን ጊዜም ትናንሽ ልጆችን ያመለክታል፤ “ልጆቹ” ከጽሑፉ በላይ የዕድሜ ገደብ ሳይጨምር በአውዱ የታወቁትን ልጆች ያመለክታል።
- source_word: μὴ κωλύετε
  choice: አትከልክሏቸው
  rationale: κωλύω መከልከልን ወይም እንቅፋት መሆንን ያመለክታል፤ የተመረጠው አገላለጽ የክልከላውን ኃይል በግልጽ ያቀርባል።
- source_word: αὐτὰ ἐλθεῖν πρός με
  choice: ወደ እኔ እንዳይመጡም
  rationale: ከ“አትከልክሏቸው” ጋር ሲነበብ ይህ አወቃቀር “ወደ እኔ ከመምጣት አትከልክሏቸው” የሚለውን ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τῶν γὰρ τοιούτων
  choice: እንደ እነዚህ ላሉት ... ነውና
  rationale: τοιούτων በቦታው ያሉትን ልጆች ብቻ ሳይሆን እንደነርሱ ያሉትንም ሊያመለክት ይችላል፤ ይህ አገላለጽ ያንን ወካይ ኃይል ሳይተረጉም ይጠብቃል።
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: የሰማያት መንግሥት
  rationale: ይህ በማቴዎስ ወንጌል ተደጋግሞ የሚገኝ መግለጫ ሲሆን፣ “የሰማያት መንግሥት” የብዙ ቁጥሩን οὐρανῶν በታማኝነትና በተለመደ የአማርኛ አገላለጽ ያቀርባል።
- source_word: ἐστὶν
  choice: ነው
  rationale: ከቀዳሚው ባለቤትነት ወይም ድርሻ አመልካች ሐረግ ጋር “ነው” የግሪኩን ἐστὶν በአጭርና ተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: ኢየሱስ ቃሉን በቦታው ስለነበሩት ልጆች ብቻ መናገሩ ወይስ እንደነርሱ ያሉ ሰዎችንም ማካተቱ
  choice: “እንደ እነዚህ ላሉት” በማለት የቅርብ ማጣቀሻውንና ሰፋ ያለውን ወካይ ኃይል ሁለቱንም መጠበቅ
  alternative: “ለእነዚህ ልጆች ነው” ብሎ ማጥበብ ወይም “እንደ ልጆች ለሆኑ ሰዎች ነው” ብሎ ባሕርይውን በትርጓሜ መወሰን
  rationale: ግሪኩ τοιούτων ከተጠቀሱት ልጆች አልፎ እንደነርሱ ያሉትን ሊያካትት ቢችልም፣ በምን ባሕርይ እንደሚመስሏቸው አይገልጽም። ትርጉሙ ይህን ሥነ መለኮታዊ ውጥረት ክፍት ያደርገዋል።
- issue: τῶν ... ἐστὶν የሚለው አወቃቀር ባለቤትነትን፣ ድርሻን ወይም መመደብን እንዴት እንደሚገልጽ
  choice: በዋናው ጽሑፍ “እንደ እነዚህ ላሉት ነው” ብሎ ተፈጥሯዊ ማድረግ፣ ቃል በቃል ቅርጹን በማስታወሻ ማቅረብ
  alternative: “የእንደነዚህ ዓይነቶች ነው” ብሎ ቃል በቃል ማቅረብ
  rationale: ዋናው አገላለጽ በአማርኛ ግልጽ ሲሆን የግሪኩን አጭር የባለቤትነት/ድርሻ ግንኙነት አያሰፋውም፤ ማስታወሻው መዋቅራዊ አማራጩን ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። “ልጆቹ” ከ“ሕፃናቱ” ይልቅ የግሪኩን ሰፊ የዕድሜ ክልል ይጠብቃል፤ የትእዛዝ አገላለጹም ቀጥተኛ ሆኖ ጨካኝ እንዳይሆን ተደርጓል።
