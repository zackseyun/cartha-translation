lexical_decisions:
- source_word: Τίμα
  choice: አክብር
  rationale: የግሱን ትእዛዛዊ ኃይልና ለወላጆች የሚገባውን ክብር በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: አባትህንና እናትህን
  rationale: ግሪኩ ግልጽ የባለቤትነት ተውላጠ ስም ባይኖረውም፣ ቀጥተኛው ንግግርና የዐሥርቱ ትእዛዛት አገላለጽ በአማርኛ ሁለቱንም “-ህ” በማለት በተፈጥሮ ይገለጣል።
- source_word: Ἀγαπήσεις
  choice: ውደድ
  rationale: የወደፊት አመልካች ቅርጹ የቶራ ትእዛዝን የጥቅስ አገላለጽ ይዟል፤ በዚህ የትእዛዛት ዝርዝር ውስጥ “ውደድ” ትእዛዛዊ ኃይሉን በዘመናዊ አማርኛ በግልጽ ያስተላልፋል።
- source_word: τὸν πλησίον σου
  choice: ባልንጀራህን
  rationale: በዚህ ሥነ ምግባራዊና ቅዱስ መጽሐፋዊ አውድ πλησίον በሰው ግንኙነት ዙሪያ ያለውን ሌላ ሰው ያመለክታል፤ “ባልንጀራ” የተለመደውን ቅዱስ መጽሐፋዊ ቃል ጠብቆ ይህን ትርጉም ይሰጣል።
- source_word: ὡς σεαυτόν
  choice: እንደ ራስህ
  rationale: የንጽጽሩን አጭር አወቃቀር ሳያብራራ ወይም ተጨማሪ ግስ ሳያስገባ በተፈጥሯዊ አማርኛ ያቆያል።
theological_decisions:
- issue: በትእዛዛት ጥቅስ ውስጥ የተቀላቀሉ የግስ ቅርጾችን መተርጎም
  choice: ሁለቱንም በቀጥተኛ ትእዛዛዊ ቅርጽ፣ “አክብር … ውደድ” ብሎ ማቅረብ
  alternative: “አባትህንና እናትህን አክብር፤ ባልንጀራህንም እንደ ራስህ ትወዳለህ።”
  rationale: ግሪኩ Τίμα የሚለውን ትእዛዛዊ ግስ ከἈγαπήσεις የወደፊት አመልካች ጋር ያጣምራል፤ ይህም የቶራን የትእዛዝ አገላለጽ ከመጥቀሱ የመጣ ነው። ሁለቱንም ትእዛዛዊ አድርጎ መተርጎም የዝርዝሩን ኃይልና የአማርኛውን ተፈጥሯዊነት ይጠብቃል፤ ይበልጥ ቃል በቃል የሆነው አማራጭ በማስታወሻ ተጠብቋል።
