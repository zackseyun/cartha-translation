  text: πολλοὶ δὲ ἔσονται πρῶτοι ἔσχατοι καὶ ἔσχατοι πρῶτοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/030.yaml
  text: But many who are first will be last[a], and the last first.
translation:
  language: am
  text: ነገር ግን፣ ብዙ ፊተኞች ኋለኞች ይሆናሉ፤ ኋለኞችም ፊተኞች ይሆናሉ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ይበልጥ ቃል በቃል፦ «ነገር ግን ብዙ ፊተኞች ኋለኞች፣ ኋለኞችም ፊተኞች ይሆናሉ።» የግሪኩ አገላለጽ እጅግ አጭርና ምሳሌያዊ ነው፤ በሁለተኛው ክፍል ግሱ ከመጀመሪያው ክፍል ይገባል።
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: ብዙዎቹ
  rationale: ቅጽሉ በስም ተግባር ላይ ውሎ ማንነታቸውን ሳይወስን ብዙ የሆኑትን ያመለክታል፤ «ብዙዎቹ» በአማርኛ ተፈጥሯዊና አጭር ነው።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከቀደመው የሽልማትና የደረጃ ንግግር ጋር ያለውን ለስላሳ ተቃርኖ ወይም ሽግግር ይጠብቃል።
- source_word: ἔσονται
  choice: ይሆናሉ
  rationale: የεἰμί የወደፊት ጊዜ ቅጽን በዘመናዊ አማርኛ በተፈጥሮ ይገልጣል።
- source_word: πρῶτοι
  choice: ፊተኞች
  rationale: በዚህ አውድ የደረጃን ወይም የቦታን ቅድሚያ ያመለክታል፤ «ፊተኞች» ከ«ኋለኞች» ጋር ያለውን ቀጥተኛ ንጽጽር ይጠብቃል።
- source_word: ἔσχατοι
  choice: ኋለኞች
  rationale: ከπρῶτοι ጋር የሚነጻጸረውን የደረጃና የቅደም ተከተል ትርጉም ይጠብቃል።
- source_word: πρῶτοι ἔσχατοι καὶ ἔσχατοι πρῶτοι
  choice: ከፊተኞች ብዙዎቹ ኋለኞች፣ ኋለኞችም ፊተኞች ይሆናሉ
  rationale: ግሪኩ አጭርና ምሳሌያዊ ነው። አማርኛው ግልጽ ሆኖ የሁለቱን ክፍሎች ሚዛናዊ ንጽጽር ይጠብቃል፤ የጋራው ግስም በመጨረሻ ቀርቧል።
theological_decisions:
- issue: የተገላቢጦሽ አባባሉ ወሰን
  choice: የደረጃ ወይም የቅደም ተከተል መገለባበጥን የሚገልጽ አጠቃላይ አባባል ሆኖ ተጠብቋል።
  alternative: ስለ መንግሥቱ መግባት፣ ስለ ደቀ መዛሙርት ሽልማት፣ ወይም ስለ ማኅበራዊ ደረጃ ብቻ የሚናገር ተብሎ ማጥበብ።
  rationale: ቁጥሩ ራሱ የተገላቢጦሹን ትክክለኛ ወሰን አይወስንም፤ ስለዚህ አንድን የእምነት ትርጓሜ ሳያስገባ የአባባሉን ስፋትና ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ፊተኞች/ኋለኞች» የሚለው ጥንድ የምንጩን አጭር ምሳሌያዊ ሚዛን ይጠብቃል።
