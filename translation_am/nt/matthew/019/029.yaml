review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the complete list, the distributive sense of πᾶς ὅστις, the completed act of leaving, the relational sense of γυνή as “wife,” the property sense of ἀγρούς, the hundredfold promise, and the inheritance of eternal life. However, ስለ ስሜ can naturally mean “about my name,” whereas ἕνεκεν τοῦ ὀνόματός μου specifically expresses purpose or motive. ለስሜ ሲል states this more precisely while preserving “name.”
  naturalness: The verse is generally clear, but ለስሜ ሲል is more idiomatic and precise in this context. Recasting the final coordination as እንዲሁም የዘላለም ሕይወትን ይወርሳል is smoother than attaching -ም to the genitive phrase.
  terminology: 'Key terms are appropriate: ሚስትን for γυνή, እርሻዎችን for ἀγρούς, መቶ እጥፍ for ἑκατονταπλασίονα, and የዘላለም ሕይወት for ζωὴ αἰώνιος. The supplied footnote’s ያህል introduces an unwarranted sense of approximation (“about”), so it should not be retained.'
  issues:
  - severity: medium
    issue: ስለ ስሜ is less specific than the source’s motive/purpose phrase.
    rationale: ἕνεκεν means “for the sake of/because of.” In modern Amharic, ስለ can mean “concerning/about,” while ለስሜ ሲል clearly conveys action undertaken for the sake of Jesus’ name.
  - severity: medium
    issue: The footnote alternative መቶ ጊዜ ያህል can imply approximation.
    rationale: The Greek ἑκατονταπλασίονα gives a hundredfold quantity, not an approximate quantity. Since no necessary textual or lexical ambiguity remains after መቶ እጥፍ, the footnote and its anchor are best omitted.
  - severity: low
    issue: የዘላለምንም ሕይወት is somewhat awkward in modern prose.
    rationale: Using an explicit coordinating adverb and placing the object in its usual phrase order improves flow without altering the meaning.
  revised_text: ለስሜ ሲል ቤቶችን ወይም ወንድሞችን ወይም እህቶችን ወይም አባትን ወይም እናትን ወይም ሚስትን ወይም ልጆችን ወይም እርሻዎችን የተወ ሁሉ መቶ እጥፍ ይቀበላል፤ እንዲሁም የዘላለም ሕይወትን ይወርሳል።
