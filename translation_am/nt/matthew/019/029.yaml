id: MAT.19.29
reference: Matthew 19:29
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ πᾶς ⸀ὅστις ἀφῆκεν ⸂οἰκίας ἢ⸃ ἀδελφοὺς ἢ ἀδελφὰς ἢ πατέρα ἢ μητέρα ἢ ⸂γυναῖκα ἢ⸃ τέκνα ἢ ⸀ἀγροὺς ἕνεκεν τοῦ ⸂ὀνόματός μου⸃, ⸀ἑκατονταπλασίονα λήμψεται καὶ ζωὴν αἰώνιον κληρονομήσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/029.yaml
  text: And everyone who has left houses or brothers or sisters or father or mother or wife or children or fields for the sake of my name will receive a hundredfold and will inherit eternal life[a].
translation:
  language: am
  text: ለስሜ ሲል ቤቶችን ወይም ወንድሞችን ወይም እህቶችን ወይም አባትን ወይም እናትን ወይም ሚስትን ወይም ልጆችን ወይም እርሻዎችን የተወ ሁሉ መቶ እጥፍ ይቀበላል፤ እንዲሁም የዘላለም ሕይወትን ይወርሳል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὅστις
  choice: የተወ ሁሉ
  rationale: የግሪኩን ሁሉን አቀፍና እያንዳንዳዊ አገላለጽ በተፈጥሯዊ የአማርኛ አንጻራዊ ሐረግ ያስተላልፋል።
- source_word: ἀφῆκεν
  choice: የተወ
  rationale: የተፈጸመውን መልቀቅ ያመለክታል፤ ‘የተወ’ ከ‘የተዋቸው’ ይልቅ በዝርዝሩ ውስጥ ያሉትን ነጠላና ብዙ ስሞች በአንድነት በተፈጥሮ ይከተላል፣ ከ‘የጣለ’ ወይም ‘የካደ’ም ያነሰ ትርጓሜ ይጭናል።
- source_word: οἰκίας
  choice: ቤቶችን
  rationale: ብዙ ቁጥሩንና ከእርሻዎች ጋር ያለውን የንብረት ገጽታ በቀጥታ ይጠብቃል።
- source_word: ἀδελφοὺς / ἀδελφὰς
  choice: ወንድሞችን / እህቶችን
  rationale: ምንጩ ሁለቱን የዝምድና ቃላት ለይቶ ስለዘረዘረ በአማርኛም ተለይተው ቀርበዋል።
- source_word: πατέρα / μητέρα
  choice: አባትን / እናትን
  rationale: የነጠላ ቁጥር የቤተሰብ ዝምድና ቃላቱን በቀጥታ ይወክላል።
- source_word: γυναῖκα
  choice: ሚስትን
  rationale: በቤተሰብ አባላት ዝርዝር ውስጥ γυνή አጠቃላይ ‘ሴት’ ሳይሆን የጋብቻ ግንኙነትን የሚያመለክት ‘ሚስት’ መሆኑ ከአውዱ ጋር ይስማማል።
- source_word: τέκνα
  choice: ልጆችን
  rationale: በዘመናዊ አማርኛ ለዘር ልጆች የተለመደና ግልጽ ቃል ነው።
- source_word: ἀγρούς
  choice: እርሻዎችን
  rationale: የእርሻ መሬትንና የኑሮ ሀብትን ገጽታ በግልጽ ያስተላልፋል።
- source_word: ἕνεκεν τοῦ ὀνόματός μου
  choice: ስለ ስሜ
  rationale: ‘ስም’ የሚለውን የምንጩን ምሳሌያዊና ሥነ መለኮታዊ ክብደት ጠብቆ፣ ለኢየሱስ ማንነትና ሥልጣን ሲባል የሚደረግ መተውን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἑκατονταπλασίονα
  choice: መቶ እጥፍ
  rationale: የቁጥሩን ኃይል በአጭርና የተለመደ መጽሐፍ ቅዱሳዊ አገላለጽ ይጠብቃል፤ ዘመናዊው ገላጭ አማራጭ በማስታወሻ ቀርቧል።
- source_word: ζωὴν αἰώνιον κληρονομήσει
  choice: የዘላለምንም ሕይወት ይወርሳል
  rationale: ‘ይወርሳል’ የκληρονομέωን የውርስ ምስል ሳያጠፋ በግልጽ አማርኛ ያቀርባል።
theological_decisions:
- issue: በደቀ መዝሙርነት ምክንያት በሚተዉ የቤተሰብ ግንኙነቶች ዝርዝር ውስጥ γυνήን መተርጎም
  choice: ሚስት
  alternative: ሴት
  rationale: የቅርብ አውዱ የቤተሰብ አባላትንና ንብረትን ይዘረዝራል፤ ‘ሚስት’ የትዳር ግንኙነቱን ይጠብቃል እንጂ ሴቶችን በአጠቃላይ መተው እንደሚገባ አያስመስልም።
- issue: ἕνεκεν τοῦ ὀνόματός μου የሚለውን የ‘ስም’ አገላለጽ መጠበቅ
  choice: ስለ ስሜ
  alternative: ስለ እኔ
  rationale: ‘ስሜ’ የሚለው ምንጩን ይጠብቃል፣ ለኢየሱስ ማንነት፣ ሥልጣንና ለተነገረለት ስም ያለውን ታማኝነትም በሙሉ ይተዋል።
- issue: ἑκατονταπλασίονα የሚገልጸው የተስፋው መጠን
  choice: መቶ እጥፍ
  alternative: መቶ ጊዜ ያህል
  rationale: ‘መቶ እጥፍ’ የግሪኩን የማባዛት ኃይል በቀጥታ ይጠብቃል፤ ቃሉ የተስፋውን ብዛት ይገልጣል እንጂ የተተወው ንብረት እያንዳንዱ በተመሳሳይ ዓይነት እንደሚመለስ ትርጉሙ በትርጉም ላይ አልተጨመረም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው አማርኛ ተጠቅሟል። የዝርዝሩ ተደጋጋሚ ‘ወይም’ ተጠብቆ የግሪኩ አጽንዖትና እያንዳንዱ አማራጭ ተለይቶ መታየቱ እንዲቀጥል ተደርጓል። ‘ስሜ’ እና ‘ይወርሳል’ የሚሉት የምንጩ ቁልፍ ምስሎች ሳይቀለሉ ተጠብቀዋል።
