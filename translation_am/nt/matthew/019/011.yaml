  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Οὐ πάντες χωροῦσι τὸν λόγον ⸀τοῦτον ἀλλ’ οἷς δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/011.yaml
  text: But he said to them[a], “Not everyone can accept this word[b], but only those to whom it has been given.”
translation:
  language: am
  text: እርሱ ግን እንዲህ አላቸው፦ “ይህን ቃል[a] ሁሉም ሰው ሊቀበለው አይችልም፤ ይህ የተሰጣቸው ብቻ ናቸው[b]።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ይህን ንግግር” ወይም “ይህን ትምህርት” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “ይህ የተሰጣቸው” የሚለው ተደራጊ አገላለጽ ሰጪው እግዚአብሔር መሆኑን ሊያመለክት ይችላል፤ የግሪኩ ጽሑፍ ግን ሰጪውን በግልጽ አይጠቅስም።
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: አላቸው
  rationale: የትረካውን መግቢያ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል፤ የንግግሩን ተቀባዮችም በግልጽ ያሳያል።
- source_word: Οὐ πάντες
  choice: ሁሉም ሰው … አይችልም
  rationale: አሉታዊውን ሁሉን-አቀፍ አገላለጽ ‘ሁሉም አይደሉም’ በሚለው ትርጉም ተፈጥሯዊ በሆነ አማርኛ ያስተላልፋል።
- source_word: χωροῦσι
  choice: ሊቀበለው አይችልም
  rationale: χωρέω በቃል ትርጉሙ ‘ቦታ መስጠት’ ሊሆን ቢችልም፣ ከλόγος ጋር እዚህ አንድን ንግግር ተቀብሎ ለመያዝ መቻልን ያመለክታል።
- source_word: τὸν λόγον τοῦτον
  choice: ይህን ቃል
  rationale: λόγος ወደ ቀደመው ንግግር ያመለክታል፤ ‘ቃል’ የምንጩን የቃላት ግንኙነት ሲጠብቅ ‘ንግግር’ ወይም ‘ትምህርት’ የሚሉትን አማራጮችም በማስታወሻ ይፈቅዳል።
- source_word: ἀλλ’ οἷς
  choice: የተሰጣቸው ብቻ
  rationale: ἀλλά ከዝምድና ሐረጉ ጋር የሚያሳየውን የቡድን ገደብ ‘ብቻ’ በማለት ግልጽ ያደርጋል።
- source_word: δέδοται
  choice: የተሰጣቸው
  rationale: የግሪኩን ፍጹም ተደራጊ ቅርጽ ይጠብቃል፤ ሰጪውን ሳይጠቅስ የተሰጠ ችሎታ ወይም ፈቃድ አሁንም ውጤት እንዳለው ያሳያል።
theological_decisions:
- issue: በδέδοται (‘የተሰጣቸው’) የተደራጊ አገላለጽ ውስጥ ሰጪው ማን እንደሆነ
  choice: በዋናው ጽሑፍ ሰጪውን ሳይጠቅስ ተደራጊውን አገላለጽ መጠበቅ
  alternative: “እግዚአብሔር ለሰጣቸው ብቻ” ብሎ በግልጽ መተርጎም
  rationale: በዐውዱ ሰጪው እግዚአብሔር መሆኑ ሊገባ ይችላል፤ ግሪኩ ግን ሰጪውን በግልጽ አይጠቅስም። ስለዚህ ምንጩ ያስቀመጠው አሻሚነት ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። አገባቡ የአማርኛን ተፈጥሯዊ የንግግር ቅደም ተከተል ይከተላል፤ የምንጩን ገዳቢ ንጽጽርና ያልተጠቀሰውን ሰጪ ይጠብቃል።
