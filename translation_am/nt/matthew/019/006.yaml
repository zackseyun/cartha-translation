base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/006.yaml
  text: So they are no longer two[a], but one flesh. Therefore, what God has joined together, man must not separate.
translation:
  language: am
  text: ስለዚህ ከእንግዲህ ወዲህ ሁለት አይደሉም፤ አንድ ሥጋ ናቸው። እንግዲህ እግዚአብሔር ያጣመረውን ሰው[a] አይለየው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: እዚህ ‘ሰው’ የሚለው ቃል አጠቃላይ ትርጉም አለው፤ ማለትም እግዚአብሔር ያጣመረውን ማንም የሰው ልጅ ሊለይ አይገባውም።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: ስለዚህ
  rationale: ከቀደመው ሐሳብ የሚመጣውን ውጤት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οὐκέτι
  choice: ከእንግዲህ
  rationale: የቀድሞው ሁኔታ ተለውጦ እንደማይቀጥል የሚያመለክተውን ጊዜያዊ ክህደት ያስተላልፋል።
- source_word: σὰρξ μία
  choice: አንድ ሥጋ
  rationale: ከዘፍጥረት የተጠቀሰውን የጋብቻ አገላለጽና ጽሑፋዊ ትስስሩን በቀጥታ ይጠብቃል።
- source_word: ὃ οὖν
  choice: እንግዲህ … ያጣመረውን
  rationale: οὖν የሚያሳየውን መደምደሚያ በ‘እንግዲህ’ ያቀርባል፤ ὃ ደግሞ እግዚአብሔር ያጣመረውን ነገር በአማርኛ ተፈጥሯዊ በሆነ አንጻራዊ አወቃቀር ይገልጣል።
- source_word: συνέζευξεν
  choice: ያጣመረውን
  rationale: ሁለቱን በጋብቻ አንድ አድርጎ የማያያዝን ትርጉም በግልጽና በተለመደ አማርኛ ያስተላልፋል።
- source_word: ἄνθρωπος
  choice: ሰው
  rationale: በግሪክ ነጠላ ቁጥር የቀረበውን ቃል ይጠብቃል፤ በዚህ አውድ ‘ሰው’ ማንኛውንም የሰው ልጅ በአጠቃላይ ያመለክታል።
- source_word: μὴ χωριζέτω
  choice: አይለየው
  rationale: የክልከላ ትእዛዙን በዘመናዊና በተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: በጋብቻ ላይ በተሰጠው ክልከላ ውስጥ የἄνθρωπος አጠቃላይ ትርጉም
  choice: ‘ሰው’ ተብሎ በአጠቃላይ የሰው ልጅን እንዲያመለክት ተተርጉሟል
  alternative: ማንም ሰው
  rationale: ‘ሰው’ በአማርኛ በተፈጥሮው አጠቃላይ ሊሆን ስለሚችል የግሪኩን ነጠላ ቅርጽ ሳያጠፋ ሁሉንም ሰው ያካትታል።
- issue: በσὰρξ μία የተጠቀሰው ከዘፍጥረት የመጣ የጋብቻ አገላለጽ
  choice: ‘አንድ ሥጋ’ ተብሎ ተጠብቋል
  alternative: አንድ አካል
  rationale: ይህ ምርጫ ኢየሱስ ከዘፍጥረት ጋር ያደረገውን ጽሑፋዊ ትስስር ይጠብቃል፤ ከጽሑፉ በላይ የሆነ የእምነት ትርጓሜም አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘አንድ ሥጋ’ የሚለው መጽሐፍ ቅዱሳዊ አገላለጽ ሆን ተብሎ ተጠብቋል።
