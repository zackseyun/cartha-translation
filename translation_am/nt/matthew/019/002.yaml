  text: ብዙ ሕዝብም ተከተሉት፤ በዚያም ፈወሳቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠκολούθησαν
  choice: ተከተሉት
  rationale: የግስ ቅርጹ በትረካው ውስጥ በቀጥታ ከኋላው መሄድን ያመለክታል፤ ይህ ምርጫ ከአውዱ በላይ የደቀ መዝሙርነት ትርጉም አይጨምርም።
- source_word: αὐτῷ
  choice: -ት
  rationale: ከἀκολουθέω ጋር የመጣው ተውላጠ ስም በአማርኛ በግሱ ላይ በሚጨመረው የሦስተኛ መደብ ተባዕት ነጠላ ቅጥያ ተፈጥሯዊ ሆኖ ተገልጿል።
- source_word: ὄχλοι πολλοί
  choice: ብዙ ሕዝብ
  rationale: በአማርኛ ብዙ ሰዎችን እንደ አንድ ስብስብ ለመግለጽ ‘ብዙ ሕዝብ’ የተለመደና ተፈጥሯዊ ነው፤ የግሪኩን የብዛት ሐሳብ ያስተላልፋል።
- source_word: ἐθεράπευσεν
  choice: ፈወሳቸው
  rationale: በወንጌላዊ የፈውስ አውድ θεραπεύωን በግልጽና በተለመደ አማርኛ ያስተላልፋል።
- source_word: αὐτοὺς
  choice: -አቸው
  rationale: ወደ ሕዝቡ የሚመለሰውን የብዙ ቁጥር ተውላጠ ስም በግሱ ውስጥ በተፈጥሯዊ የአማርኛ ቅጥያ ይወክላል።
- source_word: ἐκεῖ
  choice: በዚያ
  rationale: ቀላሉን የቦታ አመልካች ትርጉም ምንም ተጨማሪ መረጃ ሳይገባ ይጠብቃል።
- source_word: καὶ ... καὶ
  choice: -ም ... -ም
  rationale: ተደጋጋሚውን የማያያዣ ፍሰት በተፈጥሯዊው የአማርኛ አያያዥ ቅጥያ ያስተላልፋል።
