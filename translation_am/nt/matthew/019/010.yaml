language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Λέγουσιν αὐτῷ οἱ ⸀μαθηταί· Εἰ οὕτως ἐστὶν ἡ αἰτία τοῦ ἀνθρώπου μετὰ τῆς γυναικός, οὐ συμφέρει γαμῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/010.yaml
  text: His disciples said to him[a], “If that is the case of a man with his wife, it is not beneficial to marry.”
translation:
  language: am
  text: ደቀ መዛሙርቱም፣ “አንድ ወንድ ከሚስቱ ጋር ያለው ሁኔታ[a] እንደዚህ ከሆነ፣ ማግባት አይጠቅምም” አሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ጉዳይ” ወይም “ነገር”። የግሪኩ ቃል አጭር ሲሆን፣ በዚህ አውድ ሁኔታን፣ ጉዳይን ወይም ነገርን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγουσιν αὐτῷ
  choice: አሉት
  rationale: በትረካ ውስጥ ያለውን የግሪክ ታሪካዊ የአሁን ጊዜ በተፈጥሯዊ የአማርኛ ያለፈ ጊዜ ይገልጻል።
- source_word: μαθηταί
  choice: ደቀ መዛሙርቱ
  rationale: በወንጌላት የኢየሱስን ተማሪዎችና ተከታዮች ለመጥራት የተለመደውና ክብር ያለው ቃል ነው።
- source_word: Εἰ οὕτως ἐστίν
  choice: እንደዚህ ከሆነ
  rationale: ደቀ መዛሙርቱ ከቀደመው የኢየሱስ ንግግር ያወጡትን ድምዳሜ በተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: ἡ αἰτία
  choice: ሁኔታ
  rationale: በዚህ አውድ αἰτία ቀጥተኛ ‘ምክንያት’ ሳይሆን ጉዳይን፣ ሁኔታን ወይም አቋምን ሊያመለክት ይችላል፤ ‘ሁኔታ’ በአማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: τοῦ ἀνθρώπου μετὰ τῆς γυναικός
  choice: የወንድ ከሚስቱ ጋር ያለው
  rationale: አውዱ ስለ ትዳር ስለሆነ ἀνθρώπου ወንድን፣ γυναικός ደግሞ ሚስትን ያመለክታሉ፤ የግሪኩን የወንድና የሴት አገላለጽ ይጠብቃል።
- source_word: οὐ συμφέρει
  choice: አይጠቅምም
  rationale: የጥቅም ወይም የመበጀት ሐሳብን በአጭር፣ ወቅታዊና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: γαμῆσαι
  choice: ማግባት
  rationale: የግሪኩን የድርጊት መጠሪያ በቀጥታና በተለመደ የአማርኛ ቅርጽ ያቀርባል።
theological_decisions:
- issue: በἀνθρώπου ... γυναικός ያለው ጾታዊ አገላለጽ
  choice: የወንድ ከሚስቱ ጋር
  alternative: የሰው ከትዳር ጓደኛው ጋር
  rationale: ቅርብ አውዱ ትዳርን በወንድና በሚስት ቃላት ይገልጻል፤ ስለዚህ የምንጩን ጾታዊ አቀራረብ አለማጥፋት ተመርጧል።
- issue: የἡ αἰτία ትርጉማዊ ስፋት
  choice: ሁኔታ
  alternative: ጉዳይ / ነገር / ምክንያት
  rationale: ቃሉ በዚህ ስፍራ ብዙ ትርጉማዊ አማራጮች ስላሉት ‘ሁኔታ’ በዋናው ጽሑፍ ተመርጦ አሻሚነቱ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ደቀ መዛሙርት’ የሚለው የተለመደ መጽሐፍ ቅዱሳዊ ቃል ተጠብቋል፤ የዓረፍተ ነገሩ አወቃቀር ግን ተፈጥሯዊ ዘመናዊ አማርኛን ይከተላል።
