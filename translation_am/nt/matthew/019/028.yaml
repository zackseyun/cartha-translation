  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι ὑμεῖς οἱ ἀκολουθήσαντές μοι ἐν τῇ παλιγγενεσίᾳ, ὅταν καθίσῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ θρόνου δόξης αὐτοῦ, ⸀καθήσεσθε καὶ ⸀ὑμεῖς ἐπὶ δώδεκα θρόνους κρίνοντες τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/028.yaml
  text: And Jesus said to them[a], “Truly I say to you, you who have followed me will also sit on twelve thrones in the renewal, when the Son of Man sits on the throne of his glory[b], judging the twelve tribes of Israel.”
translation:
  language: am
  text: ኢየሱስም እንዲህ አላቸው፦ “እውነት እላችኋለሁ፤ እናንተ እኔን የተከተላችሁ፣ በእድሳቱ[a]፣ የሰው ልጅ በክብሩ ዙፋን ላይ በሚቀመጥበት ጊዜ፣ እናንተም በአሥራ ሁለት ዙፋኖች ላይ ተቀምጣችሁ በእስራኤል አሥራ ሁለቱ ነገዶች ላይ ትፈርዳላችሁ[b]።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “እድሳት” የሚለው “ዳግም መፈጠር፣” “አዲሱ ዓለም” ወይም “ዳግም መወለድ” ተብሎም ሊተረጎም ይችላል። እዚህ ግን ቃሉ የግለሰብን ዳግም መወለድ ሳይሆን፣ ከሰው ልጅ ንግሥና ጋር የተያያዘውን የወደፊት እድሳት የሚያመለክት ይመስላል።
    reason: lexical_alternative
  - marker: b
    text: “መፍረድ” የሚለው እዚህ የመግዛትን ወይም የማስተዳደርን ሐሳብም ሊያካትት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: እውነት
  rationale: የኢየሱስን ታላቅ ሥልጣን ያለው የንግግር መግቢያ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἀκολουθήσαντές μοι
  choice: እኔን የተከተላችሁ
  rationale: ተናጋሪውን እንደ ቀጥተኛ ተሳቢ ግልጽ አድርጎ ይጠብቃል፤ ተከታዮቹንም ባደረጉት የመከተል ተግባር ይለያል።
- source_word: παλιγγενεσίᾳ
  choice: በእድሳቱ
  rationale: ቃሉ ዳግም መወለድን ወይም መታደስን ሊያመለክት ቢችልም፣ እዚህ የሚታየውን የወደፊት አጠቃላይ መታደስ በአጭርና በክቡር ቋንቋ ይገልጣል፤ በግሪኩ የሌለውን ‘የሁሉም ነገር’ የሚል ማብራሪያ በዋናው ጽሑፍ አይጨምርም።
- source_word: ὅταν καθίσῃ
  choice: በሚቀመጥበት ጊዜ
  rationale: ወደፊት የሚፈጸመውን ጊዜያዊ ሁኔታ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: የሰው ልጅ
  rationale: የማዕረጉን የተለመደ መጽሐፍ ቅዱሳዊ ቅርጽና ከዳንኤል ጋር ያለውን ድምፀት ይጠብቃል።
- source_word: ἐπὶ θρόνου δόξης αὐτοῦ
  choice: በክብሩ ዙፋን ላይ
  rationale: የግሪኩን የባለቤትነት ግንኙነት ጠብቆ በአማርኛ ተፈጥሯዊና ክቡር ነው።
- source_word: καθήσεσθε καὶ ὑμεῖς
  choice: እናንተም … ተቀምጣችሁ … ትፈርዳላችሁ
  rationale: καί ያለውን ‘እናንተም’ አጽንዖት ይጠብቃል፤ የአማርኛው የአረፍተ ነገር አወቃቀርም መቀመጡን ከፍርዱ ጋር በተፈጥሮ ያገናኛል።
- source_word: ἐπὶ δώδεκα θρόνους
  choice: በአሥራ ሁለት ዙፋኖች ላይ
  rationale: የዙፋኖቹን ቁጥርና የመቀመጥ ቦታ በቀጥታ ያስተላልፋል።
- source_word: κρίνοντες
  choice: ትፈርዳላችሁ
  rationale: ዋናውን የፍርድ ትርጉም ይጠብቃል፤ ሊኖረው የሚችለውን የመግዛት ወይም የማስተዳደር ጥላ ትርጉም በዋናው ጽሑፍ አያስገድድም።
- source_word: τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ
  choice: በእስራኤል አሥራ ሁለቱ ነገዶች ላይ
  rationale: የእስራኤልን የነገድ ክፍፍል በትክክልና በተለመደ አገላለጽ ያቀርባል።
