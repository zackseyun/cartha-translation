id: MAT.19.24
reference: Matthew 19:24
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: πάλιν δὲ λέγω ὑμῖν, εὐκοπώτερόν ἐστιν κάμηλον διὰ ⸀τρυπήματος ῥαφίδος ⸀εἰσελθεῖν ἢ πλούσιον ⸂εἰς τὴν βασιλείαν τοῦ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/024.yaml
  text: Again I tell you[b][a], it is easier for a camel to go through the eye of a needle than for a rich man to enter into the kingdom of God.
translation:
  language: am
  text: ደግሞ እላችኋለሁ፤ ግመል[a] በመርፌ ቀዳዳ በኩል ማለፍ፣ ባለጠጋ ሰው ወደ እግዚአብሔር መንግሥት ከመግባት ይልቅ ይቀላል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንዶች ‘ግመል’ በሚለው ፈንታ ‘ገመድ’ ሊሆን ይችላል ብለው ጠቁመዋል፤ እዚህ ያለው የግሪክ ጽሑፍ ግን ‘ግመል’ ይላል።
    reason: alternative_reading
lexical_decisions:
- source_word: πάλιν δὲ λέγω ὑμῖν
  choice: ደግሜ እላችኋለሁ
  rationale: πάλιν የመደገምን ሐሳብ ያሳያል፤ δέ እዚህ ቀላል አያያዥ ስለሆነ በተፈጥሯዊው የአማርኛ አነጋገር ተውጧል። ሐረጉም ቀጥተኛውን ንግግር በግልጽ ሁኔታ ያቀርባል።
- source_word: εὐκοπώτερόν ἐστιν
  choice: ይቀለዋል
  rationale: በሁለት ድርጊቶች መካከል ያለውን የንጽጽር ቅለት ተፈጥሯዊ በሆነ ዘመናዊ አማርኛ ይገልጻል።
- source_word: κάμηλον
  choice: ግመል
  rationale: የSBLGNT ጽሑፍ κάμηλον ማለትም ‘ግመል’ ይላል፤ ምስሉን ‘ገመድ’ ብሎ ለማለስለስ የጽሑፍ መሠረት የለም።
- source_word: διὰ τρυπήματος ῥαφίδος
  choice: በመርፌ ቀዳዳ በኩል
  rationale: τρύπημα የመርፌውን ቀዳዳ ያመለክታል፤ διὰ ደግሞ በዚያ ቀዳዳ በኩል መሄድን ይገልጻል።
- source_word: εἰσελθεῖν
  choice: ማለፍ / ከሚገባ
  rationale: ከመርፌው ምስል ጋር ‘ማለፍ’ ተፈጥሯዊ ሲሆን፣ ከመንግሥት ጋር ‘መግባት’ የግሪኩን የመግባት ሐሳብ በትክክል ይገልጻል።
- source_word: ἢ πλούσιον
  choice: ባለጠጋ ሰው … ከሚገባ ይልቅ
  rationale: πλούσιον ባለጠጋ ሰውን ያመለክታል፤ የአማርኛው አገላለጽ የንጽጽሩን አወቃቀር በግልጽ ያቆያል።
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: ወደ እግዚአብሔር መንግሥት
  rationale: εἰς የመግባትን አቅጣጫ በ‘ወደ’ ያሳያል፤ βασιλεία τοῦ θεοῦ ደግሞ በተለመደውና ግልጽ ቃል ‘የእግዚአብሔር መንግሥት’ ተብሏል።
theological_decisions:
- issue: የግመልና የመርፌ ቀዳዳ ምስል ትርጓሜ
  choice: የጽሑፉን እጅግ ከባድነትና በሰው አቅም የማይቻል መሆንን የሚያጎላ ግልጽ ማጋነን እንደሆነ ሳይለሰልስ ማቅረብ
  alternative: ‘የመርፌ በር’ የተባለ ትንሽ የኢየሩሳሌም በር እንደሚያመለክት መተርጎም፣ ወይም ‘ግመል’ን ‘ገመድ’ ብሎ መቀየር
  rationale: የግሪኩ ጽሑፍ ግመልና የመርፌ ቀዳዳ የሚለውን አስደናቂ ንጽጽር በቀጥታ ያቀርባል። ጥቅሱን ወደ አንድ ተጠርጣሪ በር ማዛወርም ሆነ ‘ገመድ’ ማለት የምስሉን ኃይል ያለ በቂ የጽሑፍ ማስረጃ ያለሰልሳል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘በመርፌ ቀዳዳ በኩል’ የሚለው የምስሉን አካላዊ እንቅስቃሴ ግልጽ ያደርጋል፤ የጥቅሱ ሆን ተብሎ የቀረበ ጠንካራ ውጥረትም አልተለሰለሰም።
