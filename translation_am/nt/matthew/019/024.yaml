  naturalness: 'The revised sentence uses a natural modern Amharic comparative construction: “X … ከY ይልቅ ይቀላል.” It avoids the somewhat awkward ይቀለዋል and makes the two compared infinitival actions explicit.'
  terminology: ግመል, መርፌ ቀዳዳ, ባለጠጋ ሰው, and የእግዚአብሔር መንግሥት are accurate, established, and suitably dignified terms. The footnote appropriately notes the proposed “rope” alternative without treating it as the reading of the supplied Greek text.
