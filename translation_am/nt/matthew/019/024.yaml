  - severity: low
    issue: Comparative clause order and predicate
    rationale: The draft’s fronted rich-person clause is understandable, but the comparison is more transparent and closer to the source when the camel’s passing through the needle opening precedes the rich person’s entering the kingdom. ይቀላል is the natural impersonal comparative predicate here.
