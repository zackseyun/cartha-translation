  text: λέγει αὐτοῖς ὅτι Μωϋσῆς πρὸς τὴν σκληροκαρδίαν ὑμῶν ἐπέτρεψεν ὑμῖν ἀπολῦσαι τὰς γυναῖκας ὑμῶν, ἀπ’ ἀρχῆς δὲ οὐ γέγονεν οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/008.yaml
  text: He said to them[a], “Because of your hardness of heart Moses permitted you to divorce your wives[c][b], but from the beginning it has not been so.”
translation:
  language: am
  text: እርሱም አላቸው፤ “በልባችሁ ጥንካሬ ምክንያት ሙሴ ሚስቶቻችሁን እንድትፈቱ[a] ፈቀደላችሁ፤ ከመጀመሪያ ጀምሮ ግን እንዲህ አልነበረም።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “ሚስቶቻችሁን እንድትሰዱ”፤ በዚህ አውድ ትርጉሙ መፋታት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: አላቸው
  rationale: የግሪኩን ታሪካዊ የአሁን ጊዜ አገላለጽ በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜ ተተርጉሟል።
- source_word: πρὸς τὴν σκληροκαρδίαν ὑμῶν
  choice: ልባችሁ ጠንካራ ስለሆነ
  rationale: πρός እዚህ የምክንያት ኃይል አለው፤ አገላለጹም መጽሐፍ ቅዱሳዊውን የልብ ጥንካሬ ምስል በተረዳ አማርኛ ያቆያል።
- source_word: ἐπέτρεψεν
  choice: ፈቀደላችሁ
  rationale: ቃሉ ትእዛዝን ሳይሆን ፈቃድን ወይም በሁኔታው የተሰጠ ልዩ ፈቃድን ያመለክታል።
- source_word: ἀπολῦσαι τὰς γυναῖκας ὑμῶν
  choice: ሚስቶቻችሁን እንድትፈቱ
  rationale: ἀπολύω በዚህ የጋብቻ አውድ ፍቺን ያመለክታል፤ ‘ሚስቶቻችሁን’ ደግሞ γυνή በዚህ አውድ ያለውን ትርጉም ይገልጣል።
- source_word: ἀπ’ ἀρχῆς δὲ οὐ γέγονεν οὕτως
  choice: ከመጀመሪያ ግን እንዲህ አልነበረም
  rationale: የፍጥረት መጀመሪያን የሚያመለክተውን ንግግር ያቆያል፤ የፍጹም ጊዜውን የቆየ ሁኔታ በተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: የሙሴ ድርጊት ትእዛዝ ወይስ ፈቃድ መሆኑ
  choice: ፈቀደላችሁ
  alternative: አዘዛችሁ
  rationale: ἐπέτρεψεν ፈቃድን እንጂ ትእዛዝን አይገልጥም፤ ይህም የሙሴ ዝግጅት ለሰው የልብ ጥንካሬ የተደረገ ፈቃድ እንጂ የፍጥረት መሠረታዊ ሥርዓት አለመሆኑን ያቆያል።
- issue: የኢየሱስን ወደ መጀመሪያ የሚያመለክት ንግግር ማብራራት
  choice: ከመጀመሪያ ግን እንዲህ አልነበረም
  alternative: ከመጀመሪያ ይህ የእግዚአብሔር ዕቅድ አልነበረም
  rationale: ዋናው ጽሑፍ የግሪኩን አጭር አገላለጽ ይጠብቃል፤ በግሪኩ ያልተገለጸውን ሥነ መለኮታዊ ማብራሪያ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ የልብ ጥንካሬ ምስል ተጠብቋል፤ የፍቺው ሕጋዊ ትርጉም በዋናው ጽሑፍ ግልጽ ሆኗል።
