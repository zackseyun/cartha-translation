  text: μακάριος ὁ δοῦλος ἐκεῖνος ὃν ἐλθὼν ὁ κύριος αὐτοῦ εὑρήσει ⸂οὕτως ποιοῦντα⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/046.yaml
  text: Blessed is that servant whom his lord, when he comes, will find doing so.
translation:
  language: am
  text: ጌታው ሲመጣ እንዲሁ ሲያደርግ የሚያገኘው ያ አገልጋይ የተባረከ ነው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριος
  choice: የተባረከ ነው
  rationale: የግሪኩን የመለኮታዊ ሞገስና የተመሰገነ ሁኔታ ሐሳብ በተለመደ የመጽሐፍ ቅዱስ አማርኛ ያስተላልፋል።
- source_word: δοῦλος
  choice: አገልጋይ
  rationale: በምሳሌው የቤት ኃላፊነት ያለበትን ተገዥ አገልጋይ በተፈጥሯዊ አማርኛ ይገልጣል፤ ‘ባሪያ’ የሚለው አማራጭ የሕጋዊ ባለቤትነትን ይበልጥ ያጎላል።
- source_word: κύριος
  choice: ጌታው
  rationale: የአገልጋዩን ጌታ በቀጥታ ይገልጣል፣ ከአውዱም ጋር የግል ባለቤትነቱ ግልጽ ነው።
- source_word: οὕτως ποιοῦντα
  choice: እንዲህ ሲያደርግ
  rationale: ቀደም ሲል የተገለጸውን ታማኝ ተግባር የሚያመለክተውን ‘እንዲሁ ሲያደርግ’ የሚል ሐሳብ በተፈጥሯዊ አገባብ ያቀርባል።
theological_decisions:
- issue: κύριος የሚለው ቃል የሥልጣን ማዕረግ
  choice: ጌታው
  alternative: ባለቤቱ
  rationale: ጽሑፉ በምሳሌው ውስጥ የአገልጋዩን ጌታ ይጠቅሳል፤ ‘ጌታ’ የሚለው የግሪኩን የሥልጣን ግንኙነት ይጠብቃል፣ ነገር ግን ቃሉን በግድ የመለኮታዊ ስም አድርጎ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና በቀላሉ የሚገባ መደበኛ አማርኛ። የግሪኩ ዓረፍተ ነገር ትኩረት በተፈጥሯዊ የአማርኛ ቃላት ቅደም ተከተል ቀርቧል።
