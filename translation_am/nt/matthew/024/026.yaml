base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/026.yaml
  text: Therefore[a], if they say to you, ‘Look, he is in the wilderness,’ do not go out; ‘Look[c][b], he is in the inner rooms,’ do not believe it.
translation:
  language: am
  text: ስለዚህ፣ “እነሆ፣ በምድረ በዳ ነው” ቢሏችሁ፣ አትውጡ፤ “እነሆ፣ በውስጠኛ ክፍሎች ነው”[a] ቢሏችሁ፣ አትመኑ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በዕቃ ማከማቻ ክፍሎች” ወይም “በስውር ክፍሎች።” የግሪኩ ቃል ውስጠኛ፣ የግል ወይም የዕቃ ማከማቻ ክፍሎችን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν εἴπωσιν ὑμῖν
  choice: ስለዚህ፣ … ቢሏችሁ
  rationale: «ስለዚህ» ከቀደመው ማስጠንቀቂያ ጋር ያለውን የውጤት ግንኙነት ያሳያል፤ «ቢሏችሁ» ደግሞ ሁኔታዊነቱንና ያልተወሰነውን ሦስተኛ መደብ ብዙ ቁጥር ይጠብቃል።
- source_word: Ἰδοὺ
  choice: እነሆ
  rationale: ትኩረትን የሚስብ ቀጥተኛ አገላለጽ ሲሆን በአማርኛ መጽሐፍ ቅዱሳዊ ንባብ የተለመደና ግርማ ያለው ነው።
- source_word: ἐν τῇ ἐρήμῳ
  choice: በምድረ በዳ
  rationale: ἔρημος ሰው የማይኖርበትን በረሃማ ወይም ዱር ስፍራ ሊያመለክት ይችላል፤ «ምድረ በዳ» ይህን ስፋት በተለመደ አማርኛ ይይዛል።
- source_word: ἐστίν
  choice: ነው
  rationale: በግሪኩ ያልተገለጸው ተሳቢ ከዐውዱ ይታወቃል፤ አማርኛው «ነው» ብቻ በማለት ማዕረግ ሳይጨምር ይህን ይጠብቃል።
- source_word: μὴ ἐξέλθητε
  choice: ወደዚያ አትውጡ
  rationale: ክልከላውንና ወደ ተጠቀሰው ውጫዊ ስፍራ የመሄድን እንቅስቃሴ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐν τοῖς ταμείοις
  choice: በውስጠኛዎቹ ክፍሎች
  rationale: ταμεῖον ውስጠኛ፣ የግል ወይም የዕቃ ማከማቻ ክፍልን ሊያመለክት ይችላል፤ ዋናው ትርጉም የተዘጋ ውስጣዊ ስፍራን ያለ ከመጠን ትርጓሜ ያቀርባል።
- source_word: μὴ πιστεύσητε
  choice: አትመኑ
  rationale: የሚነገረውን የቦታ ወሬ እንዳያምኑ የሚሰጠውን ቀጥተኛ ክልከላ ይገልጣል፤ በአማርኛ ግሱ ግልጽ ተሳቢ ሳይጨመር ተፈጥሯዊ ነው።
theological_decisions:
- issue: የἐστίν ያልተገለጸ ተሳቢ
  choice: «ነው» በማለት ተሳቢውን ከዐውዱ እንዲታወቅ ማድረግ
  alternative: «እርሱ ነው» ወይም «መሲሑ ነው»
  rationale: ዐውዱ የውሸት ወሬው ስለ መሲሑ/ስለ ኢየሱስ መሆኑን ቢያሳይም፣ በዚህ ሐረግ ግሪኩ ማዕረግ አይጠቅስም። አማርኛው ተሳቢን ሳይገልጽ ሊሠራ ስለሚችል፣ «ነው» ብቻ የምንጩን አጭርነትና አሻሚነት ይጠብቃል።
- issue: የሁለቱ የቦታ ወሬዎች አገናኝ
  choice: በሁለቱም ንግግሮች «ቢሏችሁ»ን በመጠቀም ትይዩነቱን ግልጽ ማድረግ፣ «ወይም»ን አለመጨመር
  alternative: ሁለተኛውን ንግግር «ወይም» በሚል ማገናኘት
  rationale: ግሪኩ ሁለት ትይዩ ምሳሌዎችን ያቀርባል እንጂ ግልጽ የአማራጭ አገናኝ የለውም። ግሱን በአማርኛ መድገም አወቃቀሩን ግልጽ ሲያደርግ ተጨማሪ ምክንያታዊ ግንኙነት አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ። «እነሆ» መጽሐፍ ቅዱሳዊ ግርማን ይጠብቃል፤ ቀሪው አገላለጽ ለዘመናዊ አንባቢ ተፈጥሯዊ ነው።
