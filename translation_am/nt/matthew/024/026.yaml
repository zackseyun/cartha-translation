review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the two reported location claims and the two corresponding prohibitions. However, «ወደዚያ» adds a deictic destination not stated in μὴ ἐξέλθητε; the imperative is adequately and more closely rendered by «አትውጡ».
  naturalness: The wording is generally clear and appropriately formal. Using «በውስጠኛ ክፍሎች» is more idiomatic modern standard Amharic than the heavily definite/pluralized «በውስጠኛዎቹ ክፍሎች», while retaining the Greek plural sense.
  terminology: «ምድረ በዳ» suitably renders ἐρήμῳ, and «ውስጠኛ ክፍሎች» is a suitably noncommittal rendering of ταμεῖα. «እነሆ» preserves the marked attention-getting register of Ἰδού.
  issues:
  - severity: low
    issue: Added directional element in «ወደዚያ አትውጡ»
    rationale: The Greek says only «do not go out» (μὴ ἐξέλθητε). Although the destination is inferable, «ወደዚያ» is not required for natural Amharic and slightly expands the wording.
  - severity: low
    issue: The inner-room phrase is unnecessarily over-specified in form
    rationale: «በውስጠኛዎቹ ክፍሎች» is understandable, but «በውስጠኛ ክፍሎች» is more natural and still reflects the plural ταμείοις without adding definiteness.
  - severity: low
    issue: Footnote quotation/punctuation is inconsistent
    rationale: The alternative quotation closes after a full stop («በስውር ክፍሎቹ።»), though the period is not part of the lexical alternative. The footnote should present the alternatives cleanly.
