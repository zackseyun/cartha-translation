  text: And because lawlessness will be multiplied[b][a], the love of many will grow cold.
translation:
  language: am
  text: ሕግ መጣስ ስለሚበዛ፣ የብዙዎች ፍቅር[a] ይቀዘቅዛል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የብዙዎቹ ፍቅር።”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ πληθυνθῆναι
  choice: ስለሚበዛ
  rationale: διά ከተጠራጣሪ ግስ ጋር ምክንያትን ይገልጣል፤ በዚህ የወደፊት አውድ ‘ስለሚበዛ’ የግሱን ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀνομίαν
  choice: ዓመፅ
  rationale: ቃሉ ሕግን፣ በተለይም የእግዚአብሔርን ሕግ፣ መናቅንና መጣስን ያመለክታል። ‘ዓመፅ’ በዘመናዊ መደበኛ አማርኛ ተፈጥሯዊና ሥነ መለኮታዊ ክብደቱን የሚጠብቅ ምርጫ ነው።
- source_word: ψυγήσεται
  choice: ይቀዘቅዛል
  rationale: የስሜትንና የግንኙነትን መቀዝቀዝ የሚገልጠውን ዘይቤ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἀγάπη
  choice: ፍቅር
  rationale: ለἀγάπη ቀጥተኛ፣ መደበኛና በአውዱ ተስማሚ አቻ ነው።
- source_word: τῶν πολλῶν
  choice: የብዙዎች
  rationale: የግሪኩን ሰፊ ነገር ግን በግልጽ ያልተወሰነ ወሰን ይጠብቃል፤ ‘የአብዛኞቹ’ ማለት ቁጥራዊ ትርጉምን ከልክ በላይ ይጨምራል።
theological_decisions:
- issue: ‘የብዙዎች ፍቅር’ የሚያመለክተው ቡድን
  choice: ቡድኑ ሳይወሰን ‘የብዙዎች ፍቅር’ ተብሎ ተተርጉሟል።
  alternative: ‘የአማኞች ፍቅር’ ወይም ‘በማኅበረሰቡ ያለው ፍቅር’
  rationale: τῶν πολλῶν ቡድኑን በግልጽ አይለይም፤ ትርጉሙም የሰውን ሁሉ፣ ራሳቸውን ደቀ መዛሙርት የሚሉትን ወይም የተቀላቀለ ቡድንን እንደሚያመለክት ሳይወስን የምንጩን ሥነ መለኮታዊ ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የመቀዝቀዝ ዘይቤ እና የ‘ብዙዎች’ አሻሚ ወሰን ተጠብቀዋል።
