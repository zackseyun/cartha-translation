id: MAT.24.34
reference: Matthew 24:34
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ⸀ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη ἕως ἂν πάντα ταῦτα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/034.yaml
  text: Truly I tell you that this generation will certainly not pass away until all these things happen[a].
translation:
  language: am
  text: እውነት እላችኋለሁ፤ ይህ ትውልድ[a] እነዚህ ሁሉ ነገሮች እስኪከሰቱ ድረስ ከቶ አያልፍም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ይህ ሕዝብ» ወይም «ይህ ዘር»። የግሪኩ ቃል በሰፋ ያለ ትርጉም ሊገባ ይችላል፤ እዚህ ግን «ትውልድ» ከሁሉ የቀጠተኛ ትርጉም ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: እውነት
  rationale: በሲኖፕቲክ ወንጌላት የሚገኘውን የተጽእኖ ማረጋገጫ በተፈጥሯዊና በክቡር ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: λέγω ὑμῖν
  choice: እላችኋለሁ
  rationale: የብዙ ሰዎችን ቀጥተኛ ንግግር በአጭርና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ὅτι
  choice: —
  rationale: በአማርኛ የሚከተለው የይዘት ንግግር ያለ ተጨማሪ ማያያዣ ግልጽና ተፈጥሯዊ ነው።
- source_word: οὐ μὴ παρέλθῃ
  choice: ከቶ አያልፍም
  rationale: οὐ μή ያለውን ጠንካራ እምቢታ «ከቶ» ያስጠብቃል፤ παρέρχομαι ደግሞ በቀጥታ «ማለፍ» ተብሎ ተተርጉሟል።
- source_word: ἡ γενεὰ αὕτη
  choice: ይህ ትውልድ
  rationale: γενεά የሚለውን ቃል ቀጥተኛና የተለመደ ትርጉም ይይዛል፤ ክርክር ያለበትን የፍጻሜ ዘመን ትርጓሜ በጽሑፉ ውስጥ አይወስንም።
- source_word: ἕως ἂν
  choice: እስኪ… ድረስ
  rationale: ወደፊት የሚፈጸም ድንበርን በተፈጥሯዊ የአማርኛ አገባብ ያሳያል።
- source_word: πάντα ταῦτα
  choice: እነዚህ ሁሉ
  rationale: የግሪኩን አመልካችና አጠቃላይነት በግልጽ ሁኔታ ይጠብቃል።
- source_word: γένηται
  choice: ይፈጸሙ
  rationale: በዐውደ ንግግሩ የተጠቀሱት ነገሮች መከሰታቸውን ወይም ተፈጻሚ መሆናቸውን በክቡርና ተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: በፍጻሜ ዘመን ንግግር ውስጥ «ἡ γενεὰ αὕτη» የሚለው ሐረግ ትርጉም
  choice: «ይህ ትውልድ» ተብሎ በቀጥታ ተተርጉሟል።
  alternative: «ይህ ሕዝብ» ወይም «ይህ ዘር»
  rationale: ቀጥተኛው የቃሉ ፍቺ የትርጓሜውን ውጥረት ይጠብቃል፤ ግሪኩ ራሱ ያልወሰነውን የፍጻሜ ዘመን አስተምህሮ ትርጉሙ እንዳይጭን ያደርጋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መዝገብ ተጠቅሟል። «ከቶ» የግሪኩን ጠንካራ እምቢታ ይጠብቃል፤ «ይህ ትውልድ» ደግሞ የጽሑፉን እውነተኛ ትርጓሜያዊ ውጥረት አይፈታም።
