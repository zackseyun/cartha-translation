  source_fidelity: The draft accurately renders the solemn assertion, emphatic negation, and the debated phrase «this generation.» However, «እስኪፈጸሙ» can suggest that the events are fulfilled or brought to completion, whereas γένηται here simply states that the listed events occur/take place.
