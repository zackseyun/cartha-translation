  terminology: «ትውልድ» is the appropriate primary rendering of γενεά and preserves the Greek phrase's interpretive openness. The footnote appropriately records broader proposed senses without placing them in the text.
  issues:
  - severity: low
    issue: γένηται is rendered «እስኪፈጸሙ».
    rationale: Although understandable in context, «መፈጸም» may convey fulfillment/completion rather than the occurrence denoted by γίνομαι. «እስኪከሰቱ» more directly renders events happening.
  revised_text: እውነት እላችኋለሁ፤ ይህ ትውልድ[a] እነዚህ ሁሉ ነገሮች እስኪከሰቱ ድረስ ከቶ አያልፍም።
