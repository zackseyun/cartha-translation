  rationale: “ጌታ” በአማርኛ በቤት ምሳሌው ውስጥ ያለውን የባለሥልጣን ጌታ ሊያመለክት ሲችል፣ “ጌታ” የሚለውን ሰፊ ሃይማኖታዊ አንድምታም ሳይዘጋ ይተዋል።
