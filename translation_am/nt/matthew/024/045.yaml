  rationale: ቃሉ የቤቱን ማኅበረሰብ፣ በተለይም በቤቱ ያሉትን ሰዎች ያመለክታል፤ የብዙ ቁጥር ተውላጠ ስም ምግቡ ለሰዎቹ እንደሚሰጥ ግልጽ ያደርጋል።
- source_word: τοῦ δοῦναι
  choice: እንዲሰጣቸው
