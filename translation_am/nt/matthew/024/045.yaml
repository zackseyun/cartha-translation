  text: Τίς ἄρα ἐστὶν ὁ πιστὸς δοῦλος καὶ φρόνιμος ὃν κατέστησεν ὁ ⸀κύριος ἐπὶ τῆς ⸀οἰκετείας αὐτοῦ τοῦ ⸀δοῦναι αὐτοῖς τὴν τροφὴν ἐν καιρῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/045.yaml
  text: Who then is the faithful and wise servant[b][a], whom the master has appointed over his household to give them their food at the proper time?
translation:
  language: am
  text: 'ታዲያ፣ ጌታው በቤተሰቡ ላይ የሾመው፣ በተገቢው ጊዜ ምግባቸውን እንዲሰጣቸው፣ ታማኝና ብልህ ባሪያ[a] ማን ነው?


    [a] ወይም፣ “አገልጋይ።” የግሪኩ ቃል በዐውዱ መሠረት “ባሪያ” ወይም “አገልጋይ” ማለት ይችላል፤ እዚህ “ባሪያ” የሚለው በጌታው ሥልጣን ሥር መሆኑን በግልጽ ያሳያል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አገልጋይ።” የግሪኩ ቃል በዐውዱ መሠረት “ባሪያ” ወይም “አገልጋይ” ማለት ይችላል፤ እዚህ “ባሪያ” የሚለው በጌታው ሥልጣን ሥር መሆኑን በግልጽ ያሳያል።
    reason: lexical_alternative
