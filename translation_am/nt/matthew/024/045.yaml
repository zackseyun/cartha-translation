- source_word: δοῦλος
  choice: ባሪያ
  rationale: በዚህ የቤት አስተዳደር ምሳሌ ውስጥ ግለሰቡ በጌታው ሥልጣን ሥር መሆኑን ከ“አገልጋይ” ይልቅ በጠንካራ ሁኔታ ያስተላልፋል፤ ሌላው ትርጉም በማስታወሻ ተጠብቋል።
