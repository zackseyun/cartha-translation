  rationale: θλῖψιςን ‘መከራ’ በማለት የከበደ ጭንቀትንና ስቃይን የሚያካትተውን ትርጉም ያቆያል፤ የግሪኩን ‘የእነዚያ ቀናት’ ግንኙነትም በተፈጥሯዊ አማርኛ ይገልጣል።
