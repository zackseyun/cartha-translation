  text: τότε ἐάν τις ὑμῖν εἴπῃ· Ἰδοὺ ὧδε ὁ χριστός, ἤ· Ὧδε, μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/023.yaml
  text: Then if anyone says to you[a], ‘Look, here is the Messiah!’ or[b], ‘There he is!’ do not believe it.
translation:
  language: am
  text: በዚያን ጊዜ ማንም፣ “እነሆ፣ መሲሑ እዚህ ነው!”[a] ወይም፣ “እዚህ ነው!”[b] ቢላችሁ፣ አትመኑ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “መሲሑ” ወይም “ክርስቶሱ”፤ ይህ የተቀባውን ሰው የሚያመለክት ማዕረግ ነው።
    reason: alternative_reading
  - marker: b
    text: በቀጥታ፦ “ወይም፣ ‘እዚህ!’” የግሪኩ አነጋገር አጭር ሲሆን ግሱን በግልጽ አይደግምም።
    reason: source_ambiguity
lexical_decisions:
- source_word: τότε
  choice: በዚያን ጊዜ
  rationale: የጊዜ ተውሳኩ ይህን ማስጠንቀቂያ ከቀደመው የፍጻሜ ዘመን ንግግር ጋር ያያይዛል፤ ይህ አተረጓጎም በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: ማንም … ቢላችሁ
  rationale: ያልተወሰነውን ተናጋሪና ሁኔታዊውን አገባብ በተፈጥሯዊ የአማርኛ አወቃቀር ያስተላልፋል።
- source_word: Ἰδοὺ
  choice: እነሆ
  rationale: ትኩረትን ወደሚጠቁመው ነገር የሚስበውን ኃይል በክቡርና በተለመደ አማርኛ ይጠብቃል።
- source_word: ὧδε
  choice: እዚህ / እዚያ
  rationale: የመጀመሪያው በቀጥታ ‘እዚህ’ ተተርጉሟል፤ በሁለተኛው አጭር ጥቅስ የተለየ ቦታ እየጠቆመ መሆኑን ተፈጥሯዊ አማርኛ ለማሳየት ‘እዚያ’ ተጠቅሟል። የግሪኩ ቀጥተኛ ቃል ‘እዚህ’ መሆኑ በማስታወሻ ተጠብቋል።
- source_word: ὁ χριστός
  choice: መሲሑ
  rationale: እዚህ Χριστός እንደ ግላዊ ስም ሳይሆን የተጠበቀውን ቅቡዕ አዳኝ የሚያመለክት ማዕረግ ነው፤ የመወሰኛው አንቀጽም በ‘መሲሑ’ ተንጸባርቋል።
- source_word: ἤ· Ὧδε
  choice: ወይም “እዚያ ነው!”
  rationale: ግሪኩ አጭርና ግስ የሌለው ቢሆንም፣ በአማርኛ ግልጽነት ሲባል የታሰበው ‘ነው’ ተሟልቷል፤ በጽሑፉ ያልተገለጸ ስም ግን አልተጨመረም።
- source_word: μὴ πιστεύσητε
  choice: አትመኑ
  rationale: ከμή ጋር ያለውን የክልከላ ኃይል በቀጥታና ተፈጥሯዊ አማርኛ ያስተላልፋል፤ የታመነው ነገር ከዐውዱ ግልጽ ስለሆነ ተጨማሪ ተሳቢ አላስፈለገም።
theological_decisions:
- issue: የΧριστός አተረጓጎም
  choice: መሲሕ
  alternative: ክርስቶስ / ቅቡዑ
  rationale: ዐውዱ የሚናገረው ስለ ተጠበቀው ቅቡዕ አዳኝ ማንነትና ቦታ የሚቀርብ የሐሰት ጥያቄ ነው። ስለዚህ ‘መሲሕ’ የማዕረጉን ትርጉም ግልጽ ያደርጋል፤ ባሕላዊው ‘ክርስቶስ’ ግን በማስታወሻ ተጠብቋል።
- issue: በሁለተኛው ὧδε ያለው ሆን ተብሎ የተደረገ አጭር አነጋገር
  choice: “እዚያ ነው!” በማለት አነስተኛውን የታሰበ ግስ ማሟላት
  alternative: “እዚህ!”
  rationale: የአማርኛ ንባብ ግልጽና ተፈጥሯዊ እንዲሆን ‘ነው’ ተጨምሯል፤ በዋናው ጽሑፍ ያልተገለጸ ተጨማሪ ሥነ መለኮታዊ ይዘት አልገባም። ቀጥተኛው አማራጭ በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “እነሆ” መጠነኛ መጽሐፍ ቅዱሳዊ ክብርን ይጠብቃል፣ ነገር ግን ጥንታዊ ወይም የማይገባ አይደለም።
