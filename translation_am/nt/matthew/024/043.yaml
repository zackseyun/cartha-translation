review_pass:
  verdict: revise
  source_fidelity: 'The counterfactual construction is preserved well: if the householder had known the watch, he would have remained awake and would not have permitted the breach. However, the final clause, “ቤቱም ተቆፍሮ እንዲገባበት,” adds an explicit entering action and is syntactically less direct than the Greek passive infinitive, “his house to be dug through/breached.”'
  naturalness: The register is modern and clear overall. “ቤቱ እንዲቆፈር ባልፈቀደ ነበር” is more idiomatic and accurately retains the Greek image without the awkward construction “ተቆፍሮ እንዲገባበት.”
  terminology: “የቤቱ ባለቤት” appropriately renders οἰκοδεσπότης in this non-titular illustration. “የሌሊት ክፍለ ጊዜ” communicates the watch adequately, with the explanatory note retaining the more specific watch terminology. The breach note should avoid specifying a roof, which is not stated in this verse; a wall-breach explanation is sufficient.
  issues:
  - severity: medium
    issue: The rendering “ቤቱም ተቆፍሮ እንዲገባበት” expands and blurs διορυχθῆναι τὴν οἰκίαν αὐτοῦ.
    rationale: The Greek says literally that his house be dug through, an ancient idiom for being breached. The draft adds “to enter it” and has an unnecessarily awkward passive-plus-purpose construction. A direct passive infinitival clause better reflects both source and natural Amharic.
  - severity: low
    issue: Footnote b mentions entry through “a wall or roof.”
    rationale: The verse itself does not identify a roof. Since the lexical note need only explain the digging-through image, referring generally to breaching an earthen wall avoids unsupported specificity.
