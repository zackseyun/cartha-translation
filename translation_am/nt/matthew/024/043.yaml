  text: ἐκεῖνο δὲ γινώσκετε ὅτι εἰ ᾔδει ὁ οἰκοδεσπότης ποίᾳ φυλακῇ ὁ κλέπτης ἔρχεται, ἐγρηγόρησεν ἂν καὶ οὐκ ἂν εἴασεν διορυχθῆναι τὴν οἰκίαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/043.yaml
  text: 'But know this: if the master of the house had known in what watch the thief was coming[b][a], he would have stayed awake and would not have let his house be broken into.'
translation:
  language: am
  text: ነገር ግን ይህን እወቁ፤ የቤቱ ባለቤት ሌባው በየትኛው የሌሊት ክፍለ ጊዜ[a] እንደሚመጣ ቢያውቅ ኖሮ፣ ነቅቶ በቆየ ነበር፤ ቤቱ እንዲቆፈር[b] ባልፈቀደ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “በየትኛው የጥበቃ ክፍለ ጊዜ።” በጥንት ዘመን ሌሊቱ በተወሰኑ የጥበቃ ክፍለ ጊዜያት ይከፈል ነበር።
    reason: cultural_note
  - marker: b
    text: ቃል በቃል፣ “ቤቱ እንዲቆፈር።” ይህ ቃል በጥንት ዘመን ሌባ ቤትን በግድግዳው በኩል ቆፍሮ ሊጥስ የሚችልበትን ሁኔታ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνο δὲ γινώσκετε
  choice: ነገር ግን ይህን እወቁ
  rationale: የδέን የንግግር ሽግግርና γινώσκετε የሚያሳየውን ቀጥተኛ ብዙ ቁጥር ትእዛዝ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: οἰκοδεσπότης
  choice: የቤቱ ባለቤት
  rationale: የቤት ወይም የቤተሰብ ኃላፊን የሚያመለክተውን ቃል በዘመናዊና በቀላሉ በሚገባ አገላለጽ ያቀርባል፤ የዘመናዊ ሕጋዊ የንብረት ትርጉምን አያጎላም።
- source_word: ποίᾳ φυλακῇ
  choice: በየትኛው የሌሊት ክፍለ ጊዜ
  rationale: φυλακή በዚህ ስፍራ ሌሊት የሚከፈልበትን የጥበቃ ጊዜ ያመለክታል። አገላለጹ ጊዜያዊውንና ባህላዊውን ሐሳብ በግልጽ አማርኛ ይይዛል።
- source_word: ὁ κλέπτης ἔρχεται
  choice: ሌባው … እንደሚመጣ
  rationale: የግሪኩን የአሁን ጊዜ ቅርጽ በሁኔታዊው አረፍተ ነገር ውስጥ ተፈጥሯዊ በሆነ ቀጥተኛ የውስጥ ንግግር ያስተላልፋል።
- source_word: ἐγρηγόρησεν ἂν
  choice: ነቅቶ በቆየ ነበር
  rationale: የγρηγορέωን ‘ነቅቶ መቆየት/መጠበቅ’ ሐሳብና ያልተፈጸመውን ተቃራኒ-እውነታ ሁኔታ ይጠብቃል።
- source_word: οὐκ ἂν εἴασεν
  choice: ባልፈቀደ ነበር
  rationale: ‘እንዲሆን አይተውም/አይፈቅድም’ የሚለውን ፍቺ አጭርና ተፈጥሯዊ በሆነ አማርኛ ያቀርባል።
- source_word: διορυχθῆναι τὴν οἰκίαν αὐτοῦ
  choice: ቤቱም ተቆፍሮ እንዲገባበት
  rationale: διορύσσω ያለውን ቃል በቃል ‘ቆፍሮ መግባት’ ምስል እና የስርቆት መግቢያ ዓላማ አንድ ላይ ይጠብቃል።
theological_decisions:
- issue: የቤቱን ኃላፊ ምስል መተርጎም
  choice: የቤቱ ባለቤት
  alternative: የቤቱ ጌታ / የቤተሰቡ ኃላፊ
  rationale: ይህ ምሳሌያዊ ምስል እንጂ በራሱ ልዩ የእምነት ማዕረግ አይደለም። ምርጫው የοἰκοδεσπότηςን ማኅበራዊ ሚና ያቀርባል፣ ሆኖም ‘ጌታ’ በማለት የክርስቶስን ማዕረግ በስውር አያስገባም።
- issue: የጥንቱን የቤት መስበር ምስል አያያዝ
  choice: ተቆፍሮ እንዲገባበት
  alternative: እንዲሰበር / ሌባ እንዲገባበት
  rationale: ዋናው ጽሑፍ የግሪኩን ‘ቆፍሮ መግባት’ ምስል ስለሚይዝ ባህላዊውን ዝርዝር ሳያጠፋ የድርጊቱን ዓላማ ግልጽ ያደርጋል።
