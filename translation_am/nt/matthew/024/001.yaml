  rationale: ዋናው ጽሑፍ ተፈጥሯዊና የተለመደ እንዲሆን «ቤተ መቅደስ» ተጠብቋል፤ ቃሉ ውስጠኛውን መቅደስ ብቻ እንደማያመለክት የቃላት ስፋቱ በማስታወሻ ተገልጿል።
