- source_word: ἐπορεύετο
  choice: እየሄደ ሳለ
  rationale: የግሱን ቀጣይ እንቅስቃሴ የሚያሳይ ያልተፈጸመ ገጽታ ይጠብቃል።
- source_word: προσῆλθον
  choice: ወደ እርሱ ቀረቡ
  rationale: ደቀ መዛሙርቱ ወደ ኢየሱስ መቅረባቸውን በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐπιδεῖξαι
  choice: ሊያሳዩት
  rationale: የመቅረባቸውን ዓላማ የሚገልጸውን የግሪኩን የዓላማ ኢንፊኒቲቭ በትክክል ያስተላልፋል።
- source_word: οἰκοδομὰς
  choice: ሕንፃዎች
  rationale: በዐውዱ ያሉትን የተገነቡ መዋቅሮች በቀጥታና በተረዳ ቃል ይገልጻል።
- source_word: τοῦ ἱεροῦ
  choice: የቤተ መቅደሱን
  rationale: ሕንፃዎቹ የሰፊው የቤተ መቅደስ ስፍራ ክፍሎች መሆናቸውን ያሳያል፣ የግሪኩንም ድግግሞሽ ይጠብቃል።
