  rationale: የቀደመውን ተጓዳኝ ድርጊት በተፈጥሯዊ አማርኛ ያሳያል፤ ኢየሱስ መጀመሪያ ወጣ፣ ከዚያም መሄዱን ቀጠለ።
- source_word: ἱεροῦ
