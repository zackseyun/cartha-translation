  text: Καὶ ἐξελθὼν ὁ Ἰησοῦς ⸂ἀπὸ τοῦ ἱεροῦ ἐπορεύετο⸃, καὶ προσῆλθον οἱ μαθηταὶ αὐτοῦ ἐπιδεῖξαι αὐτῷ τὰς οἰκοδομὰς τοῦ ἱεροῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/001.yaml
  text: And Jesus went out from the temple and was going away[a], and his disciples came to show him the buildings of the temple.
translation:
  language: am
  text: ኢየሱስም ከቤተ መቅደሱ[a] ወጥቶ እየሄደ ሳለ፣ ደቀ መዛሙርቱ የቤተ መቅደሱን ሕንፃዎች ሊያሳዩት ወደ እርሱ ቀረቡ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: እዚህ «ቤተ መቅደስ» ተብሎ የተተረጎመው የግሪክ ቃል ውስጠኛውን መቅደስ ብቻ ሳይሆን ሰፊውን የቤተ መቅደስ ግቢና በውስጡ ያሉትን ሕንፃዎች ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
