  text: πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου λέγοντες· Ἐγώ εἰμι ὁ χριστός, καὶ πολλοὺς πλανήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/005.yaml
  text: For many will come in my name[a], saying, ‘I am the Messiah,’ and they will lead many astray.
translation:
  language: am
  text: ምክንያቱም ብዙዎች በስሜ ይመጣሉ፤ “እኔ መሲሑ[a] ነኝ” ይላሉ፤ ብዙዎችንም ያሳስታሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እኔ ክርስቶስ ነኝ።” የግሪኩ መዓርግ ὁ χριστός ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: πολλοὶ
  choice: ብዙዎች
  rationale: በዐውዱ ውስጥ ያለውን መጠናዊ ትርጉም በተፈጥሯዊና ቀጥተኛ አማርኛ ያስተላልፋል።
- source_word: γὰρ
  choice: ምክንያቱም
  rationale: ንግግሩ ከቀደመው ማስጠንቀቂያ ጋር ያለውን የማብራሪያ ግንኙነት ይጠብቃል።
- source_word: ἐλεύσονται
  choice: ይመጣሉ
  rationale: የወደፊት ጊዜውንና የመምጣትን መደበኛ ትርጉም በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: በስሜ
  rationale: የኢየሱስን ስም፣ ማንነት ወይም ሥልጣን ተጠቅሞ መቅረብን የሚያመለክተውን ሐረግ አጭርና የተለመደ በሆነ መንገድ ያስተላልፋል፤ የሐረጉን ስፋት አያጠብም።
- source_word: λέγοντες
  choice: ይላሉ
  rationale: የመጡት ሰዎች የሚናገሩትን ይዘት ያለ ተጨማሪ ትርጓሜ ያስገባል።
- source_word: Ἐγώ εἰμι ὁ χριστός
  choice: እኔ መሲሑ ነኝ
  rationale: ὁ χριστός በዚህ ስፍራ እንደ መዓርግ የቀረበ ስለሆነ፣ ‘መሲሑ’ የሐሰተኞቹን መሲሐዊ የማንነት ጥያቄ በግልጽ ያሳያል።
- source_word: πλανήσουσιν
  choice: ያሳስታሉ
  rationale: ሌሎችን ከእውነት እንዲስቱ ማድረግንና ማታለልን በተፈጥሯዊ የአማርኛ ግስ ያስተላልፋል።
- source_word: πολλοὺς
  choice: ብዙዎችን
  rationale: የግሱን ተሳቢ በግልጽ ያሳያል፤ ‘ሰዎችን’ የሚል ተጨማሪ ቃል ሳያስፈልግ በአማርኛ ተፈጥሯዊ ነው።
theological_decisions:
- issue: በሐሰተኛ መሲሐዊ የማንነት ጥያቄ ውስጥ Χριστόςን መተርጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: የግሪኩ ቃል እዚህ እንደ ስም ሳይሆን እንደ መዓርግ ተጠቅሟል። ‘መሲሑ’ ይህን ትርጉም በግልጽ ያቀርባል፤ ‘ክርስቶስ’ የሚለው ባህላዊ አማራጭ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለመደበኛ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የማብራሪያ ግንኙነት ‘ምክንያቱም’ በሚለው ተጠብቋል፤ ሦስቱ አንቀጾች በ፤ ተለይተው የንግግሩን ፍሰት ግልጽ ያደርጋሉ።
