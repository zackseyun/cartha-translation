review_pass:
  verdict: revise
  source_fidelity: The conditional sequence and the ingressive sense of ἄρξηται with τύπτειν are retained. «መደብደብ» suitably communicates abusive/repeated beating, and «ከሰካራሞች ጋር» is an idiomatic rendering of μετὰ τῶν μεθυόντων. The draft’s wording for συνδούλους αὐτοῦ is understandable, but its noun phrase is less natural and can obscure the intended sense, namely slaves sharing the same master.
  naturalness: «ባልንጀሮቹን ባሪያዎች» is awkward in modern standard Amharic because the plural possessed form before a second plural noun does not clearly mark ‘fellow slaves.’ «ባልንጀራ ባሪያዎቹን» is a more compact and natural expression. Footnote anchors should also be retained in the Amharic text because they occur in the audit-trail translation.
  terminology: «ባሪያዎች» appropriately preserves the δοῦλος component of σύνδουλος without importing doctrinal interpretation. «ሰካራሞች» is natural and appropriately characterizes those given to drunkenness. No theological term requires alteration.
  issues:
  - severity: medium
    issue: The expression for συνδούλους αὐτοῦ is syntactically awkward and insufficiently idiomatic.
    rationale: The wording «ባልንጀሮቹን ባሪያዎች» can be parsed awkwardly as two juxtaposed plural nouns. «ባልንጀራ ባሪያዎቹን» naturally identifies them as his fellow slaves.
  - severity: low
