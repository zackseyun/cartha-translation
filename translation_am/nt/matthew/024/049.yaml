  text: καὶ ἄρξηται τύπτειν τοὺς συνδούλους ⸂αὐτοῦ, ἐσθίῃ δὲ καὶ πίνῃ⸃ μετὰ τῶν μεθυόντων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/049.yaml
  text: and begins to beat his fellow servants[a], and eats and drinks with drunkards[b],
translation:
  language: am
  text: ባልንጀራ ባሪያዎቹን[a] መደብደብ ቢጀምር፣ ከሰካራሞች[b] ጋርም ቢበላና ቢጠጣ፣
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ባልንጀሮቹን አገልጋዮች»። የግሪኩ σύνδουλος ቃል በቃል «አብሮ ባሪያ» ማለት ሲሆን፣ በአንድ ጌታ ሥር ያላቸውን የጋራ ሁኔታ ያጎላል።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ «ሰክረው ከሚገኙ ሰዎች ጋር»። የግሪኩ ተሳታፊ ቃል በስካር የሚታወቁ ወይም የሚሰክሩ ሰዎችን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρξηται τύπτειν
  choice: መደብደብ ቢጀምር
  rationale: ἄρξηται ከግሳዊ መጠነ ስም τύπτειν ጋር የድርጊቱን መጀመር ያመለክታል፤ «መደብደብ» ተደጋጋሚ ወይም ከባድ መምታትን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τοὺς συνδούλους αὐτοῦ
  choice: ባልንጀሮቹን ባሪያዎች
  rationale: σύνδουλος በአንድ ጌታ ሥር ያሉትን የጋራ የባርነት ሁኔታ ያጎላል። «ባልንጀሮቹን ባሪያዎች» ይህን ማኅበራዊ እውነታ ከ«አገልጋዮች» ይልቅ በግልጽ ይጠብቃል።
- source_word: ἐσθίῃ δὲ καὶ πίνῃ
  choice: ቢበላና ቢጠጣ
  rationale: ሁለቱን ተያያዥ ድርጊቶች ሳይጨምር በቀጥታ ያስተላልፋል፤ የቅድመ ሁኔታው አወቃቀርም ከአንቀጹ ቀጣይ ክፍል ጋር እንዲያያዝ «ቢ-» ተጠቅሟል።
- source_word: μετὰ τῶν μεθυόντων
  choice: ከሰካራሞች ጋር
  rationale: የአሁን ጊዜ አሳታፊው በስካር የሚታወቁ ወይም የሚሰክሩ ሰዎችን ያመለክታል፤ «ሰካራሞች» በዘመናዊ አማርኛ አጭርና ተፈጥሯዊ ነው።
- source_word: δὲ
  choice: -ም
  rationale: እዚህ δέ ጠንካራ ተቃርኖ ሳይሆን ቀጣይ ድርጊትን ይጨምራል፤ የአማርኛው «-ም» ይህን ለስላሳ አያያዥነት ያሳያል።
theological_decisions:
- issue: በσύνδουλος ውስጥ ያለውን የδοῦλος ቃል ቤተሰብ አተረጓጎም
  choice: ባልንጀሮቹን ባሪያዎች
  alternative: ባልንጀሮቹን አገልጋዮች
  rationale: ምሳሌው በአንድ ጌታ ሥር ያሉ ሰዎችን የጋራ ደረጃ ስለሚያጎላ፣ «ባሪያዎች» የግሪኩን ማኅበራዊና ሥነ ምግባራዊ ክብደት ይጠብቃል፤ ይህም ልዩ የእምነት አቋም ሳይጨምር የቃሉን ታሪካዊ ትርጉም ያቀርባል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ አማርኛ ተጠቅሟል። አንቀጹ በግሪክ ከቀዳሚው ሁኔታዊ ሐረግ ጋር የተያያዘ እና በቀጣዩ ቁጥር የሚፈጸም ስለሆነ፣ «ቢጀምር… ቢበላና ቢጠጣ» የሚለው አወቃቀር ተመርጧል።
