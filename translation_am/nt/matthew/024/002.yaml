language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Οὐ βλέπετε ⸂ταῦτα πάντα⸃; ἀμὴν λέγω ὑμῖν, οὐ μὴ ἀφεθῇ ὧδε λίθος ἐπὶ λίθον ὃς οὐ καταλυθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/002.yaml
  text: But he answered and said to them[a], “Do you not see all these things? Truly I tell you, not one stone here will be left upon another that will not be thrown down.”
translation:
  language: am
  text: እርሱም መልሶ እንዲህ አላቸው፤ “ይህን ሁሉ አታዩምን? እውነት እላችኋለሁ፤ እዚህ በሌላ ድንጋይ ላይ የሚቀር አንድም ድንጋይ አይኖርም፤ ሁሉም ይፈርሳል።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ይናዳል።” የግሪኩ ግስ ሕንፃን ማፍረስ ወይም መናድን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: መልሶ እንዲህ አላቸው
  rationale: የግሪኩን የመመለስና የመናገር ድርብ አገላለጽ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: Οὐ βλέπετε
  choice: አታዩምን?
  rationale: ቃሉን የሚያዩትን ሕንፃዎች በቀጥታ የሚያመለክትና ስምምነትን የሚጠብቅ የንግግር ጥያቄ አድርጎ ያቀርባል።
- source_word: ταῦτα πάντα
  choice: ይህን ሁሉ
  rationale: በአማርኛ ተፈጥሯዊ በሆነ አነጋገር በአውዱ የተጠቀሱትን የቤተ መቅደሱን ሕንፃዎች በአጠቃላይ ያመለክታል።
- source_word: ἀμὴν λέγω ὑμῖν
  choice: እውነት እላችኋለሁ
  rationale: የኢየሱስን ጽኑና ክቡር የማረጋገጫ መግቢያ በግልጽ ዘመናዊ አማርኛ ይጠብቃል።
- source_word: οὐ μὴ ἀφεθῇ
  choice: አይቀርም
  rationale: የግሪኩን አጽንዖታዊ አሉታዊ ትንቢት ከ‘ሳይፈርስ’ ጋር በመጣመር ተፈጥሯዊና ጽኑ አድርጎ ያቀርባል።
- source_word: ὧδε
  choice: እዚህ
  rationale: በዚያው አውድ ያለውን የቤተ መቅደሱን ስፍራ በቀጥታ የሚያመለክት ቀላል የቦታ ቃል ነው።
- source_word: λίθος ἐπὶ λίθον
  choice: ድንጋይ በድንጋይ ላይ
  rationale: የምንጩን ሕንፃዊ ምስልና የድንጋዮቹን መደራረብ በቀጥታ ይጠብቃል።
- source_word: καταλυθήσεται
  choice: ሳይፈርስ
  rationale: በዚህ አውድ የሕንፃን መፍረስ ወይም መናድ ያመለክታል፤ ‘መፍረስ’ ግልጽና የተለመደ ነው።
theological_decisions:
- issue: የኢየሱስ ስለ ቤተ መቅደሱ የተናገረው ትንቢት ወሰንና ኃይል
  choice: ቃሉ ስለ ሕንፃው ሙሉ መፍረስ የሚናገር ተጨባጭ ትንቢት ሆኖ ቀርቧል።
  alternative: ቃሉን በዋናነት ምሳሌያዊ የፍርድ ንግግር አድርጎ መተርጎም፣ ወይም በተወሰነ የፍጻሜ ዘመን ሥርዓት ውስጥ ማስገባት
  rationale: ድንጋይ በድንጋይ ላይ እንደማይቀር የሚገልጸው ቋንቋ ተጨባጭና ሕንፃዊ ነው፤ ትርጉሙ ጥቅሱ ያልገለጸውን የአስተምህሮ ሥርዓት አያክልም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ አጽንዖትና የድንጋዮቹ መፍረስ ሕንፃዊ ምስል ተጠብቋል።
