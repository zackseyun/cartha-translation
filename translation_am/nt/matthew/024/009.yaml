theological_decisions:
- issue: በፍጻሜ ዘመን ንግግር ውስጥ θλῖψιςን መተርጎም
  choice: መከራ
  alternative: ጭንቀት፣ ስደት
  rationale: ‘መከራ’ የተለመደውን ግፍና ሥቃይ እንዲሁም በዚህ ንግግር ያለውን የፍጻሜ ዘመን ክብደት አብሮ ሊሸከም ይችላል፤ የተወሰነ የፍጻሜ ዘመን ሥርዓትን በጽሑፉ ላይ አይጭንም።
