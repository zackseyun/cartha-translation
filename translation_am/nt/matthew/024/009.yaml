- issue: ‘በስሜ ምክንያት’ የሚለው ሥነ መለኮታዊ ጥልቀት
  choice: ከስሜ የተነሣ
  alternative: ለእኔ ታማኝ በመሆናችሁ
  rationale: ዋናው ጽሑፍ ‘ስሜ’ የሚለውን የኢየሱስን ማንነትና እርሱን መከተል የሚወክል አገላለጽ ይጠብቃል፤ ትርጉሙ በማስታወሻ ተብራርቷል።
