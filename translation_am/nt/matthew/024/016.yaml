  language: am
  text: በዚያን ጊዜ በይሁዳ ያሉት ወደ ተራሮች ይሽሹ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: በዚያን ጊዜ
  rationale: በኢየሱስ ንግግር ውስጥ የክስተቶችን ቅደም ተከተል የሚያመለክተውን ጊዜያዊ ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: በይሁዳ ያሉት
  rationale: በይሁዳ ክልል የሚገኙትን ሰዎች ያለ ተጨማሪ ማብራሪያ በግልጽና ተፈጥሯዊ ሁኔታ ይጠቅሳል።
- source_word: Ἰουδαίᾳ
  choice: ይሁዳ
  rationale: የጂኦግራፊያዊው ክልል በአማርኛ የተለመደ መጠሪያ ነው፤ ከይሁዳ ሰው ወይም ነገድ ይልቅ እዚህ አውዱ ቦታን እንደሚያመለክት ግልጽ ነው።
- source_word: φευγέτωσαν
  choice: ይሽሹ
  rationale: የሦስተኛ መደብ ብዙ ቁጥር ትእዛዛዊ ቅርጹን በቀጥታ ይጠብቃል፤ በዚህ አውድ አስቸኳይ ትእዛዝ መሆኑም በተፈጥሯዊ አማርኛ ግልጽ ነው።
- source_word: ἐπὶ τὰ ὄρη
  choice: ወደ ተራሮች
  rationale: ከእንቅስቃሴ ግስ ጋር ያለው ἐπί እና አኩዛቲቭ ወደ መዳረሻ የሚደረግ እንቅስቃሴን ያመለክታሉ፤ ‘ተራሮች’ ὄρηን ሳያዳክም ይተረጉማል።
theological_decisions:
- issue: በፍጻሜ ዘመን ማስጠንቀቂያ ውስጥ ያለው የትእዛዙ ኃይል
  choice: ቀጥተኛና አስቸኳይ ትእዛዝ፦ ‘ይሽሹ’
  alternative: ግዴታን በግልጽ በመጨመር፦ ‘መሸሽ አለባቸው’
  rationale: የግሪክ ቅርጹ ቀጥተኛ ትእዛዝ ነው። ‘ይሽሹ’ ይህን ሰዋሰዋዊ ኃይልና የማስጠንቀቂያውን አስቸኳይነት ያለ ተጨማሪ የፍጻሜ ዘመን ትርጓሜ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ። ትእዛዛዊው ‘ይሽሹ’ በአማርኛ የ‘let them flee’ እና የ‘must flee’ን ዋና ኃይል ስለሚያካትት የትርጉም ልዩነት የሚጠይቅ የግርጌ ማስታወሻ አልተጨመረም።
