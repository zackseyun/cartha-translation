  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: προσεύχεσθε δὲ ἵνα μὴ γένηται ἡ φυγὴ ὑμῶν χειμῶνος μηδὲ σαββάτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/020.yaml
  text: But pray that your flight may not happen in winter or on a Sabbath[a].
translation:
  language: am
  text: ነገር ግን ሽሽታችሁ በክረምት ወይም በሰንበት[a] እንዳይሆን ጸልዩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በሰንበቱ።»
    reason: alternative_reading
lexical_decisions:
- source_word: προσεύχεσθε
  choice: ጸልዩ
  rationale: የአሁን ጊዜ ብዙ ቁጥር ትእዛዝ ነው፤ በዘመናዊ አማርኛ «ጸልዩ» ቀጥተኛና ተፈጥሯዊ ነው። ቅርጹ ቀጣይነትን ሊያመለክት ቢችልም እዚህ በግድ መጨመር አያስፈልግም።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከቀደመው ማስጠንቀቂያ ጋር ያለውን ለስላሳ ንፅፅርና የንግግር ሽግግር ያሳያል።
- source_word: ἵνα μὴ γένηται
  choice: እንዳይሆን
  rationale: ከጸሎት ትእዛዙ በኋላ የጸሎቱን ይዘት በተፈጥሯዊ አማርኛ ይገልጣል፤ γίνομαι እዚህ የክስተት ትርጉም አለው።
- source_word: ἡ φυγὴ ὑμῶν
  choice: ሽሽታችሁ
  rationale: φυγή ከአደጋ መሸሽን ያመለክታል፤ «ሽሽታችሁ» የተሳካ ማምለጥን ሳያስገድድ ድርጊቱንና ሁኔታውን ይጠብቃል።
- source_word: χειμῶνος
  choice: በክረምት
  rationale: የጊዜ ወይም የወቅት ዘርፍ በአማርኛ በተፈጥሯዊ ሁኔታ «በክረምት» ይባላል።
- source_word: μηδὲ σαββάτῳ
  choice: ወይም በሰንበት
  rationale: μηδέ ሁለተኛውን አሉታዊ ሁኔታ ያቀናጃል፤ σαββάτῳ የሰንበትን ቀን ያመለክታል። አማርኛ በዚህ አገባብ የአንቀጽን ልዩነት በቀጥታ ስለማያሳይ «በሰንበት» ተፈጥሯዊ ነው።
theological_decisions:
- issue: σαββάτῳ በወሰን አመልካች አንቀጽ ወይም ያለ አንቀጽ መተርጎም
  choice: በሰንበት
  alternative: በሰንበቱ
  rationale: ግሪክኛው የተጻፈ አንቀጽ የለውም፤ አማርኛው «በሰንበት» ይህን ሳያስገድድ ተፈጥሯዊ ነው። ሆኖም ቅጹ በአገባቡ የታወቀውን የሰንበት ቀን ሊያመለክት ስለሚችል «በሰንበቱ» የሚለው አማራጭ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። «ሽሽታችሁ» የምንጩን አጭርነትና የአደጋ አውድ ይጠብቃል።
