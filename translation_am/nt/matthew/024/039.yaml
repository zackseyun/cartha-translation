revisions:
- from: የጥፋት ውሃው መጥቶ ሁሉንም ጠራርጎ እስኪወስዳቸው ድረስ አላወቁም ነበር፤ የሰው ልጅ መምጣትም እንዲሁ ይሆናል።
  to: የጥፋት ውሃው መጥቶ ሁሉንም እስኪወስድ ድረስ አላወቁም ነበር፤ የሰው ልጅ መምጣትም እንዲሁ ይሆናል።
  rationale: The revision corrects the Amharic clause structure, retains the source’s ‘until the flood came and took everyone away,’ and avoids adding a stronger manner-of-destruction image than the Greek states. The comparative ‘so also’ is retained with both ‘ም’ and ‘እንዲሁ.’
