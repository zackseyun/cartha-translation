review_pass:
  verdict: revise
  source_fidelity: The draft preserves the main temporal sequence and comparison, but its verb chain makes the flood's taking-away action grammatically dependent in an awkward way and adds an emphatic image (‘ጠራርጎ’) not expressed by ἦρεν. The revision renders καὶ ἦρεν ἅπαντας directly as ‘and took everyone away.’
  naturalness: ‘ሁሉንም ጠራርጎ እስኪወስዳቸው ድረስ’ is not a natural or well-formed way to express the completed paired actions ‘came and took all.’ ‘መጥቶ ሁሉንም እስኪወስድ ድረስ’ is clear, idiomatic, and retains the temporal sense.
  terminology: ‘የጥፋት ውሃ’ suitably renders κατακλυσμός in this context, and ‘የሰው ልጅ’ and ‘መምጣት’ are appropriate, established renderings for υἱὸς τοῦ ἀνθρώπου and παρουσία. No footnotes are needed.
  issues:
  - severity: medium
    issue: The flood clause uses an awkward and semantically overfull verb construction.
    rationale: 'The Greek has two coordinated aorist actions: the flood came and took everyone away. The draft’s ‘ጠራርጎ እስኪወስዳቸው’ both introduces ‘sweeping away’ beyond αἴρω and makes the action less natural in Amharic.'
  revised_text: የጥፋት ውሃው መጥቶ ሁሉንም እስኪወስድ ድረስ አላወቁም ነበር፤ የሰው ልጅ መምጣትም እንዲሁ ይሆናል።
  revised_footnotes: []
  revision_rationale: The revision corrects the Amharic clause structure, retains the source’s ‘until the flood came and took everyone away,’ and avoids adding a stronger manner-of-destruction image than the Greek states. The comparative ‘so also’ is retained with both ‘ም’ and ‘እንዲሁ.’
