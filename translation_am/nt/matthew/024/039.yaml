id: MAT.24.39
reference: Matthew 24:39
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔγνωσαν ἕως ἦλθεν ὁ κατακλυσμὸς καὶ ἦρεν ἅπαντας, οὕτως ἔσται ⸀καὶ ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/039.yaml
  text: And they did not know until the flood came and swept them all away; so also will be the coming of the Son of Man.
translation:
  language: am
  text: የጥፋት ውሃው መጥቶ ሁሉንም እስኪወስድ ድረስ አላወቁም ነበር፤ የሰው ልጅ መምጣትም እንዲሁ ይሆናል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: አላወቁም ነበር
  rationale: የግሪኩን ‘አላወቁም/አልተገነዘቡም’ የሚል ትርጉም ሳያሰፋ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ὁ κατακλυσμός
  choice: የጥፋት ውሃው
  rationale: በመጽሐፍ ቅዱሳዊ አጠቃቀም የኖኅን የጥፋት ውሃ በግልጽ የሚጠቁም የተለመደ አገላለጽ ነው።
- source_word: ἦρεν ἅπαντας
  choice: ሁሉንም ጠራርጎ ወሰዳቸው
  rationale: αἴρω እዚህ በጎርፍ ተወስዶ መጥፋትን ያመለክታል፤ ‘ጠራርጎ ወሰዳቸው’ የድርጊቱን ኃይልና አጠቃላይነት ያስቀምጣል።
- source_word: παρουσία
  choice: መምጣት
  rationale: በዚህ የፍጻሜ ዘመን አውድ παρουσία የሰው ልጅን መምጣት/መገኘት ያመለክታል፤ ‘መምጣት’ ግልጽና የተለመደ ነው።
- source_word: οὕτως ἔσται καὶ
  choice: መምጣትም እንዲሁ ይሆናል
  rationale: καί የሚያሳየውን ‘ደግሞ/ም’ ንጽጽርና οὕτως የሚያሳየውን ‘እንዲሁ’ በተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: ‘አላወቁም’ የሚለው የዕውቀት እጥረት ወይስ ያለመገንዘብ ነው?
  choice: አላወቁም ነበር
  alternative: አልተገነዘቡም ነበር
  rationale: ἔγνωσαν በቀጥታ ‘አወቁ’ ስለሚል ጽሑፉ የሚፈቅደውን አሻሚነት በመጠበቅ አለማወቃቸው በድንቁርና፣ በቸልተኝነት ወይም ባለመገንዘብ እንደሆነ አይወስንም።
- issue: በውሃው የተወሰዱት ሰዎች ትርጉማዊ ሁኔታ
  choice: ሁሉንም ጠራርጎ ወሰዳቸው
  alternative: ሁሉንም ወሰዳቸው
  rationale: አውዱ የፍርድ ጥፋትን ያሳያል፤ ነገር ግን ከዚህ አንቀጽ በላይ ስለ መጨረሻው ፍርድ ዝርዝር ትምህርት አይጨመርም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። የግሪኩ ቃል ቅደም ተከተል በአማርኛ ተፈጥሯዊ እንዲሆን ተደርጓል፤ የ‘እስከ…ድረስ’ መዋቅርና የሁለቱ ክስተቶች ንጽጽር ተጠብቀዋል።
