  text: Περὶ δὲ τῆς ἡμέρας ἐκείνης καὶ ὥρας οὐδεὶς οἶδεν, οὐδὲ οἱ ἄγγελοι τῶν οὐρανῶν ⸂οὐδὲ ὁ υἱός⸃, εἰ μὴ ὁ ⸀πατὴρ μόνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/036.yaml
  text: But concerning that day and hour[a], no one knows—not even the angels of heaven, nor the Son—except the Father alone.
translation:
  language: am
  text: ስለዚያች ቀንና ሰዓት ግን፣ ማንም አያውቅም፤ የሰማይ መላእክትም እንኳ አያውቁም፣ ወልድም[a] እንኳ አያውቅም፤ ከአብ ብቻ በቀር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች “ወልድም እንኳ አያውቅም” የሚለውን ሐረግ አያካትቱም። ዋናው ጽሑፍ የSBLGNTን ንባብ ይከተላል።
    reason: textual_variant
lexical_decisions:
- source_word: Περὶ δὲ
  choice: ነገር ግን ስለ
  rationale: περί ከዘር አመልካች ጋር ርዕሱን ‘ስለ’ ብሎ ያስገባል፤ δέ ደግሞ ከቀደመው ንግግር የሚደረገውን ሽግግርና መጠነኛ ንፅፅር ‘ነገር ግን’ በሚል ተፈጥሯዊ አገላለጽ ያሳያል።
- source_word: τῆς ἡμέρας ἐκείνης καὶ ὥρας
  choice: ያች ቀንና ሰዓት
  rationale: አንዱ ጠቋሚ ቃል የተቀናጀውን ‘ቀንና ሰዓት’ እንደ አንድ ሐረግ ይገዛል፤ ይህም የተወሰነውን የፍጻሜ ጊዜ ሳያብራራ ይጠብቃል።
- source_word: οὐδεὶς οἶδεν
  choice: ማንም አያውቅም
  rationale: οὐδείς ሁሉን አቀፍ አሉታዊ ትርጉም አለው፤ οἶδα እዚህ በአሁን ጊዜ ትርጉም ‘ማወቅ’ ማለት ነው።
- source_word: οὐδὲ οἱ ἄγγελοι τῶν οὐρανῶν
  choice: የሰማይ መላእክት እንኳ አያውቁም
  rationale: οὐδέ የማይጠበቅ ክፍልን በአጽንዖት ወደ አሉታዊው ዝርዝር ያክላል፤ ‘እንኳ’ ይህን አጽንዖት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: οὐδὲ ὁ υἱός
  choice: ወልድም አያውቅም
  rationale: ሐረጉ ወልድንም በግልጽ ወደማያውቁት ዝርዝር ያክላል። ‘ወልድ’ በዚህ አውድ የታወቀውን የክርስቶስ ማዕረግ በክብርና በግልጽነት ያሳያል።
- source_word: εἰ μὴ
  choice: በቀር
  rationale: ከአሉታዊ ዓረፍተ ነገር በኋላ εἰ μή ልዩ ሁኔታን የሚያሳይ ‘በቀር’ ማለት ነው፤ እዚህ ሁኔታዊ ‘ካልሆነ’ አይደለም።
- source_word: ὁ πατὴρ μόνος
  choice: አብ ብቻ
  rationale: μόνος ይህ እውቀት ለአብ ብቻ እንደተወሰነ ያሳያል፤ ‘አብ’ የመለኮታዊ ማዕረጉን ትርጉም ይጠብቃል።
theological_decisions:
- issue: “ወልድም” የሚለው ሐረግ ያለው ክርስቶሎጂያዊ ውጥረት
  choice: “ወልድም አያውቅም” የሚለውን ሐረግ ሳይለዝብና ሳይብራራ በዋናው ጽሑፍ ማቆየት
  alternative: በአንዳንድ የእጅ ጽሑፎች ልዩነት ምክንያት ሐረጉን መተው፣ ወይም ከወልድ መለኮት ጋር ያለውን ግልጽ ውጥረት ለመቀነስ ትርጉሙን ማለዘብ
  rationale: SBLGNT οὐδὲ ὁ υἱός የሚለውን ያካትታል። ትርጉሙ የምንጩን ንባብና ሥነ መለኮታዊ ውጥረት ይጠብቃል፤ ይህን ውጥረት በትርጉም ውስጥ መፍታት ወይም ማለዘብ አይገባም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛ ተጠቅሟል። ‘አብ’ እና ‘ወልድ’ የተለመዱና በአውዱ ግልጽ የሆኑ መጽሐፍ ቅዱሳዊ ማዕረጎች በመሆናቸው ተጠብቀዋል። የግሪኩን አንድ ዋና ግስ በአማርኛ ለግልጽነትና ለተፈጥሯዊ ፍሰት በእያንዳንዱ የተጨመረ ክፍል ውስጥ መድገም አስፈልጓል። የግርጌ ማስታወሻው ምልክት ከሚመለከተው ‘ወልድም’ ቀጥሎ ተቀምጧል።
