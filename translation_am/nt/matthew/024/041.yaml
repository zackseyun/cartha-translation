  edition: SBLGNT
  text: δύο ἀλήθουσαι ἐν τῷ ⸀μύλῳ, μία παραλαμβάνεται καὶ μία ἀφίεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/041.yaml
  text: Two women will be grinding at the mill[c][b][a]; one is taken and one is left.
translation:
  language: am
  text: ሁለት ሴቶች በወፍጮ እየፈጩ ይሆናሉ፤ አንዲቱ ትወሰዳለች፣ አንዲቱም ትቀራለች።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ግሪኩ «አንዲቱ ትወሰዳለች፣ አንዲቱም ትቀራለች» ብቻ ይላል፤ መወሰዷ ለመዳን ወይም ለፍርድ መሆኑን በዚህ ስፍራ አይገልጽም።
    reason: alternative_reading
lexical_decisions:
- source_word: δύο ἀλήθουσαι
  choice: ሁለት ሴቶች … ሲፈጩ
  rationale: የግሪኩ አንቀጽ ቅርጽ የሴት ብዙ ቁጥር ስለሆነ ሴቶች መሆናቸውን በግልጽ ያሳያል፤ በአማርኛም «ሲፈጩ» በወቅቱ እየተከናወነ ያለውን ተግባር ተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: ἐν τῷ μύλῳ
  choice: በወፍጮ
  rationale: μύλος ወፍጮን ወይም የወፍጮ ድንጋይን ሊያመለክት ይችላል፤ «በወፍጮ» መሣሪያውን ከሚገባው በላይ ሳይወስን የእህል መፍጨትን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: μία παραλαμβάνεται
  choice: አንዲቱ ትወሰዳለች
  rationale: የሴት ነጠላ ቁጥርን ጠብቆ ቀጥተኛውን ተገብሮ ያቀርባል፤ መወሰዷ ለመዳን ወይም ለፍርድ መሆኑን አይወስንም።
- source_word: καὶ μία ἀφίεται
  choice: አንዲቱም ትቀራለች
  rationale: καίን በ«-ም» አስተባብሮ ἀφίεταιን በቀላሉ «ትቀራለች» ብሎ ይተረጉማል፤ «ትተዋለች» ወይም «ወደ ኋላ ትቀራለች» የሚሉ ትርጉማዊ ጭማሪዎችን ያስወግዳል።
theological_decisions:
- issue: መወሰድና መቅረት መዳንን ወይም ፍርድን ያመለክቱ እንደሆነ
  choice: «ትወሰዳለች» እና «ትቀራለች» የሚለውን ገለልተኛ አነጋገር መጠበቅ
  alternative: አንዲቱ ለመዳን ትወሰዳለች፣ ሌላዋም ለፍርድ ትቀራለች፤ ወይም አንዲቱ ለፍርድ ትወሰዳለች፣ ሌላዋም ትተርፋለች
  rationale: ይህ ሐረግ ራሱ የሁለቱን ድርጊቶች መጨረሻዊ ሥነ መለኮታዊ ትርጉም በግልጽ አይወስንም፤ ስለዚህ አሻሚነቱ ተጠብቋል።
- issue: በግሪኩ የተመለከቱትን የሴት ተሳታፊዎች በግልጽ ማቅረብ
  choice: «ሁለት ሴቶች» ማለት
  alternative: «ሁለት ሰዎች» ወይም «ሁለት» ብቻ ማለት
  rationale: ἀλήθουσαι የሴት ብዙ ቁጥር ነው፤ የጾታ መረጃውን መግለጽ የምንጩን ትክክለኛነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። «ወፍጮ» ለተራው አንባቢ የተለመደ ሲሆን የግሪኩን μύλος ከመጠን በላይ አይወስንም።
