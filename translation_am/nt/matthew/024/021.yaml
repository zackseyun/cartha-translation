base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/021.yaml
  text: For then there will be great tribulation[a], such as has not happened from the beginning of the world until now, and never will happen again.
translation:
  language: am
  text: ምክንያቱም በዚያን ጊዜ፣ ከዓለም መጀመሪያ እስከ አሁን ተከስቶ የማያውቅ፣ ወደፊትም ፈጽሞ የማይከሰት ታላቅ መከራ[a] ይሆናል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ታላቅ ጭንቀት” ወይም “ታላቅ ስቃይ”። የግሪኩ ቃል ከባድ ችግርን፣ ጫናን ወይም ጭቆናን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ τότε
  choice: ምክንያቱም በዚያን ጊዜ
  rationale: γάρ ከቀደመው ማስጠንቀቂያ ጋር ያለውን የምክንያት ግንኙነት ያሳያል፤ τότε ደግሞ ጊዜውን ይጠቁማል።
- source_word: θλῖψις μεγάλη
  choice: ታላቅ መከራ
  rationale: መከራ ከባድ ጫናን፣ ስቃይንና ጭንቀትን ሊያመለክት የሚችል፣ በዘመናዊ አማርኛም ግልጽና ክብደት ያለው ቃል ነው፤ μεγάλη በቀጥታ በ‘ታላቅ’ ተተርጉሟል።
- source_word: οἵα οὐ γέγονεν
  choice: ተከስቶ የማያውቅ
  rationale: οἵα የመከራውን ከሌሎች የማይነጻጸር ዓይነትና ክብደት ያሳያል፤ የፍጹም ግስ γέγονεν እስከ አሁን ድረስ ያልተከሰተ ነገር መሆኑን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἀπ’ ἀρχῆς κόσμου ἕως τοῦ νῦν
  choice: ከዓለም መጀመሪያ እስከ አሁን
  rationale: κόσμος በ‘ዓለም’ በቀጥታ ተተርጉሞ፣ የጊዜውም ወሰን በግልጽና በተለመደ አማርኛ ተገልጿል።
- source_word: οὐδ’ οὐ μὴ γένηται
  choice: ከዚያም በኋላ ፈጽሞ የማይከሰት
  rationale: οὐ μή ያለውን ጠንካራ የወደፊት ክደት ‘ፈጽሞ’ ያስተላልፋል፤ ‘ከዚያም በኋላ’ የንጽጽሩን ወደፊታዊ አቅጣጫ ግልጽ ያደርጋል።
- source_word: ἔσται
  choice: ይሆናል
  rationale: የወደፊት መኖርን ወይም መከሰትን በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: የፍጻሜ ዘመን ክብደት ያለው θλῖψις አተረጓጎም
  choice: ታላቅ መከራ
  alternative: ታላቅ ጭንቀት / ታላቅ ስቃይ
  rationale: ‘መከራ’ የግሪኩን ሰፊ የጫና፣ የስቃይና የችግር ትርጉም ይጠብቃል፤ ከጽሑፉ በላይ የሆነ የአንድ ወገን የፍጻሜ ዘመን ሥርዓት አያስገባም።
- issue: የመከራው ከሁሉ የበለጠ መሆን
  choice: ተከስቶ የማያውቅ፣ ከዚያም በኋላ ፈጽሞ የማይከሰት
  alternative: ያልነበረ፣ ወደፊትም የማይኖር
  rationale: የግሪኩን ታሪካዊና ወደፊታዊ ንጽጽር ሳይቀንስ ይጠብቃል፤ የተለየ ታሪካዊ ክስተት በትርጉሙ ውስጥ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። ‘ተከስቶ የማያውቅ’ የሚለው አገላለጽ የግሪኩን ክስተታዊ ስሜት በተፈጥሯዊ አማርኛ ያቀርባል።
