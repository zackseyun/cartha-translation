  text: διὰ τοῦτο καὶ ὑμεῖς γίνεσθε ἕτοιμοι, ὅτι ᾗ ⸂οὐ δοκεῖτε ὥρᾳ⸃ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/044.yaml
  text: For this reason[a], you also must be ready, because the Son of Man is coming at an hour you do not expect.
translation:
  language: am
  text: ስለዚህ እናንተም ዝግጁ ሁኑ፤ የሰው ልጅ ባልጠበቃችሁት ሰዓት ይመጣልና።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ባላሰባችሁት ሰዓት።” የግሪኩ ግስ “ማሰብ” ወይም “መገመት” ማለት ይችላል፤ በዚህ አውድ ግን ያልተጠበቀ ጊዜን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ስለዚህ
  rationale: ይህ አገላለጽ ቀደም ሲል ከተሰጠው ማስጠንቀቂያ የሚደረሰውን ምክንያታዊ መደምደሚያ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: καὶ ὑμεῖς
  choice: እናንተም
  rationale: ካί እና ግልጽ ተውላጠ ስም የሚሰጡትን የማካተትና የአጽንዖት ስሜት ‘እናንተም’ በአጭሩ ይጠብቃል።
- source_word: γίνεσθε ἕτοιμοι
  choice: ዝግጁ ሁኑ
  rationale: የብዙ ቁጥር ትእዛዙን በቀጥታና በተፈጥሯዊ አማርኛ ይገልጻል፤ ዝግጁነትን እንደ ቀጣይ አቋም መያዝንም በአውዱ ያስተላልፋል።
- source_word: ὅτι
  choice: …ና
  rationale: ትእዛዙ የተሰጠበትን ምክንያት የአማርኛው ምክንያታዊ ቅጥያ ‘-ና’ በተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: ᾗ οὐ δοκεῖτε ὥρᾳ
  choice: ባላሰባችሁት ሰዓት
  rationale: የግሪኩን ጊዜያዊ አገላለጽ ይጠብቃል፤ δοκεῖτε ያለውን ‘ማሰብ/መገመት’ ትርጉም ሳያጠብ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: የሰው ልጅ
  rationale: የግሪኩን ክርስቶሳዊ መጠሪያ ቃል በቃል የሚጠብቅ፣ በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀምም የታወቀ አገላለጽ ነው።
- source_word: ἔρχεται
  choice: ይመጣል
  rationale: የግሪኩ የአሁን ጊዜ ቅርጽ እዚህ ወደፊት የሚፈጸምን መምጣት ያመለክታል፤ ‘ይመጣል’ ይህን በተፈጥሯዊና ግልጽ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου የሚለውን ክርስቶሳዊ መጠሪያ መተርጎም
  choice: የሰው ልጅ
  alternative: ሰብዓዊው
  rationale: ‘የሰው ልጅ’ የመጠሪያውን ቃላዊ ቅርጽ፣ የዳንኤል መጽሐፍ ዳራውንና በወንጌላት ያለውን ሥነ መለኮታዊ ጥልቀት ሳይፈታ ይጠብቃል፤ አማራጩ ግን ከመጠን በላይ ትርጓሜያዊ ነው።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የትእዛዙ አጽንዖትና የመምጣቱ ጊዜ አለመታወቅ ተጠብቀዋል።
