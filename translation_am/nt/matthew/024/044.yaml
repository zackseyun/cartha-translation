review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the inferential connection, the inclusive emphasis on the hearers, the imperative to readiness, the established title «የሰው ልጅ», and the future-oriented sense of ἔρχεται. However, «ባላሰባችሁት ሰዓት» more naturally means “at an hour you did not think about” rather than the contextual sense of an hour they do not expect.
  naturalness: The register and syntax are otherwise clear, modern, and suitably dignified. Replacing the temporal phrase with «ባልጠበቃችሁት ሰዓት» gives idiomatic Amharic while the footnote retains the Greek lexical alternative.
  terminology: «የሰው ልጅ» is the appropriate established Amharic biblical rendering of ὁ υἱὸς τοῦ ἀνθρώπου. «ዝግጁ ሁኑ» appropriately renders the plural present imperative without adding doctrinal interpretation.
  issues:
  - severity: medium
    issue: The main rendering «ባላሰባችሁት ሰዓት» is insufficiently idiomatic for the contextual sense of δοκεῖτε.
    rationale: Although δοκέω can mean “think/suppose,” in this warning context the phrase concerns an hour not anticipated. In Amharic, «ማሰብ» with this construction can suggest simply not thinking about an hour, whereas «መጠበቅ» naturally conveys non-expectation. The more literal “think/suppose” sense can be preserved in a footnote.
  revised_text: ስለዚህ እናንተም ዝግጁ ሁኑ፤ የሰው ልጅ ባልጠበቃችሁት ሰዓት ይመጣልና።[a]
  revised_footnotes:
  - marker: a
    text: ወይም፣ “ባላሰባችሁት ሰዓት።” የግሪኩ ግስ “ማሰብ” ወይም “መገመት” ማለት ይችላል፤ በዚህ አውድ ግን ያልተጠበቀ ጊዜን ያመለክታል።
    reason: lexical_alternative
