source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ ἀστραπὴ ἐξέρχεται ἀπὸ ἀνατολῶν καὶ φαίνεται ἕως δυσμῶν, οὕτως ⸀ἔσται ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/027.yaml
  text: For just as the lightning comes from the east and is seen as far as the west[a], so will the coming of the Son of Man be.
translation:
  language: am
  text: ምክንያቱም መብረቅ ከምሥራቅ ወጥቶ እስከ ምዕራብ እንደሚታይ፣ የሰው ልጅ መምጣትም[a] እንዲሁ ይሆናል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “መገኘት።” የግሪኩ παρουσία የሚለው ቃል “መገኘት” ወይም “መድረስ” ሊያመለክት ይችላል፤ በዚህ አውድ ግን የሰው ልጅን ወደፊት መምጣት ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: ምክንያቱም … እንደሚታይ
  rationale: γάρ ያለውን ምክንያታዊ ትስስር “ምክንያቱም” ያስተላልፋል፤ ὥσπερ የሚያስገባው ንጽጽር ደግሞ ከοὕτως ጋር በ“እንደ… እንዲሁ” ተፈጥሯዊ በሆነ የአማርኛ አወቃቀር ተጠብቋል።
- source_word: ἀστραπή
  choice: መብረቅ
  rationale: ቃሉ በዚህ ምሳሌ የሚያመለክተውን በሰፊው የሚታወቀውን የመብረቅ ክስተት በቀጥታ ይገልጣል።
- source_word: ἐξέρχεται
  choice: ወጥቶ
  rationale: “ይወጣል/ይፈልቃል” የሚለውን የመነሣት ሐሳብ ይጠብቃል፤ ከመብረቅ ጋርም ተፈጥሯዊ ነው።
- source_word: ἀπὸ ἀνατολῶν
  choice: ከምሥራቅ
  rationale: ከδυσμῶν ጋር ባለው የአቅጣጫ ንጽጽር ἀνατολαί በግልጽ ሁኔታ “ምሥራቅ” ማለት ነው።
- source_word: φαίνεται
  choice: እንደሚታይ
  rationale: የግሱን መካከለኛ/ተገብሮ ቅርጽ ይጠብቃል፤ የክስተቱን ግልጽና ለሁሉ የሚታይ ባሕርይም ሳይጨምር ያስተላልፋል።
- source_word: ἕως δυσμῶν
  choice: እስከ ምዕራብ
  rationale: ἕως የሚገልጠውን የመድረሻ ወሰንና ከምሥራቅ እስከ ምዕራብ ያለውን ሙሉ ስፋት ይጠብቃል።
- source_word: οὕτως ἔσται
  choice: እንዲሁ ይሆናል
  rationale: የንጽጽሩን ማጠቃለያና የወደፊት ጊዜ ኃይል በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: παρουσία
  choice: መምጣት
  rationale: በዚህ የመጨረሻውን ዘመን በሚመለከት አውድ ቃሉ የሰው ልጅን ወደፊት መምጣት ወይም መድረስ ያመለክታል። “መገኘት” የሚለው ሊሆን የሚችል የቃሉ ፍቺ በማስታወሻ ተጠብቋል።
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: የሰው ልጅ
  rationale: የማዕረግ አገላለጹንና ከዳንኤል 7 ጋር ያለውን ጽሑፋዊ ትስስር የሚጠብቅ፣ በአማርኛ የተለመደ ትርጉም ነው።
theological_decisions:
- issue: παρουσία በመጨረሻው ዘመን አውድ ያለው ፍቺ
  choice: መምጣት
  alternative: መገኘት፣ መድረስ
  rationale: ከመብረቅ ግልጽና የማይሳሳት መታየት ጋር ያለው ንጽጽር የወደፊቱን የሰው ልጅ መምጣት ያመለክታል። ሆኖም παρουσία “መገኘት” የሚለውንም ፍቺ ሊይዝ ስለሚችል፣ ይህ የቃሉ ውጥረት በግርጌ ማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “እንደ… እንዲሁ” የሚለው አወቃቀር የግሪኩን ንጽጽር በተፈጥሯዊ ሁኔታ ያቀርባል።
