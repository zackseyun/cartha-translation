id: MAT.24.35
reference: Matthew 24:35
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσεται, οἱ δὲ λόγοι μου οὐ μὴ παρέλθωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/035.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: am
  text: ሰማይና ምድር ያልፋሉ፤ ቃሎቼ ግን ፈጽሞ አያልፉም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οὐρανὸς καὶ ἡ γῆ
  choice: ሰማይና ምድር
  rationale: ይህ የተለመደ ጥምረት አሁን ያለውን የፍጥረት ሥርዓት በሙሉ ያመለክታል፤ በዚህ አውድ ‘ሰማይ’ የሚታየውን ሰማይ ብቻ፣ ‘ምድር’ም አንድን አገር ብቻ አያመለክቱም።
- source_word: παρελεύσεται
  choice: ያልፋሉ
  rationale: παρέρχομαι በዚህ አውድ የአሁኑ ፍጥረት ማለፉን ወይም ወደ ፍጻሜው መድረሱን ይገልጣል። ‘ያልፋሉ’ ምስላዊ ኃይሉን ሳያጠብ በተፈጥሯዊ አማርኛ ያቀርበዋል።
- source_word: δὲ
  choice: ግን
  rationale: በሰማይና በምድር ማለፍ እና በኢየሱስ ቃሎች ዘላቂነት መካከል ያለውን ግልጽ ንጽጽር ያሳያል።
- source_word: οἱ λόγοι μου
  choice: ቃሎቼ
  rationale: የኢየሱስን ንግግሮችና ትምህርቶች በሰፊውና በቀጥታ ያመለክታል።
- source_word: οὐ μὴ παρέλθωσιν
  choice: ፈጽሞ አያልፉም
  rationale: οὐ μή ከአኦሪስት ሰብጃንክቲቭ ጋር የሚሰጠውን አጽንዖታዊ ክህደት ‘ፈጽሞ’ በሚለው ተውሳክ በግልጽና በዘመናዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: የኢየሱስ ቃሎች ዘላቂነት ላይ የተነገረው አጽንዖት
  choice: የፍጥረትን ማለፍ ከኢየሱስ ቃሎች ፈጽሞ አለማለፍ ጋር በቀጥታ ማነጻጸር
  alternative: ስለ መለኮታዊ ሥልጣን ያለውን አስተምህሮ በትርጉሙ ውስጥ በግልጽ መጨመር
  rationale: ጥቅሱ ራሱ የኢየሱስን ቃሎች ዘላቂነትና እርግጠኝነት በኃይል ይናገራል። ትርጉሙ ይህን ክብደት ይጠብቃል፤ ሆኖም ጽሑፉ በቀጥታ ያላለውን የአስተምህሮ ማብራሪያ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ አጽንዖታዊ ክህደት በዋናው ጽሑፍ ‘ፈጽሞ’ ተብሎ በቂ ሁኔታ ስለተገለጠ የግድ የሆነ የግርጌ ማስታወሻ አልተጨመረም።
