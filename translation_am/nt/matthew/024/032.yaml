    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ቅጠሎች ሲያቆጠቁጡ።”
    reason: lexical_alternative
  - marker: c
    text: θέρος “በጋ”ን፣ በአንዳንድ አውዶች ደግሞ የመከር ወቅትን ሊያመለክት ይችላል፤ እዚህ የበለስ ዛፉ ምስል የወቅቱን ትርጉም ይደግፋል።
    reason: lexical_alternative
lexical_decisions:
