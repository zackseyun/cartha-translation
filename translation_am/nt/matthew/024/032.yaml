  rationale: የግሪክ ጽሑፉ ከሚታዩ ምልክቶች መቅረብን ስለማወቅ ንጽጽር ያቀርባል፤ በዚህ ቁጥር ያልተገለጸውን ሰፊ የፍጻሜ ዘመን ትርጓሜ ትርጉሙ አይወስንም።
