  rationale: ἀπό ከተውሳከ ስም ጋር የትምህርቱን ምንጭ ያመለክታል። δέ ቀላል የንግግር ሽግግር ስለሆነ በአማርኛው በተፈጥሯዊ የዓረፍተ ነገር ቅደም ተከተል ተላልፏል፤ ግልጽ የጊዜ ቃል አልተጨመረም።
