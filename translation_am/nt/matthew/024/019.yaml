  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὐαὶ δὲ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/019.yaml
  text: But woe to those who are pregnant and to those who are nursing infants in those days[a].
translation:
  language: am
  text: በእነዚያ ቀናት ግን ለነፍሰ ጡር ሴቶችና ሕፃናትን ጡት ለሚያጠቡ ሴቶች ወዮላቸው!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαί
  choice: ወዮላቸው
  rationale: የሚመጣውን ከባድ መከራ የሚያመለክተውን የሐዘንና የማስጠንቀቂያ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δὲ
  choice: ግን
  rationale: ከቀደመው ማስጠንቀቂያ ጋር መጠነኛ የንግግር ሽግግር ያሳያል፤ ከባድ ተቃርኖን አያስገባም።
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: ለነፍሰ ጡሮች
  rationale: የግሪኩን ‘በማሕፀን ያላቸው’ ፈሊጣዊ ትርጉም በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ταῖς θηλαζούσαις
  choice: ሕፃናትን ለሚያጠቡ
  rationale: θηλάζω ሕፃንን ጡት ማጥባትን ያመለክታል፤ በግሪኩ የተዘወተረውን ተሳቢ በአማርኛ ግልጽነት ሲባል ‘ሕፃናትን’ በማለት ይገልጻል።
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: በእነዚያ ቀናት
  rationale: ቀጥተኛ፣ ተፈጥሯዊና የጊዜውን ማመልከቻ በትክክል የሚጠብቅ አገላለጽ ነው።
theological_decisions:
- issue: የሴት ፆታ ቅርጾች ተጠቃሽ
  choice: ‘ነፍሰ ጡሮች’ እና ‘ሕፃናትን የሚያጠቡ’ በሚሉ ተፈጥሯዊ የአማርኛ አገላለጾች መተርጎም
  alternative: ‘ነፍሰ ጡር ሴቶች’ እና ‘ሕፃናትን የሚያጠቡ ሴቶች’
  rationale: የግሪኩ ሴታዊ ቅርጾች ተጠቃሾቹን ግልጽ ያደርጋሉ፤ በአማርኛም የተመረጡት ሐረጎች ይህን ፍቺ በተፈጥሯቸው ስለሚያስተላልፉ ‘ሴቶች’ የሚለውን ቃል መጨመር አያስፈልግም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የቁጥሩ የሐዘንና የአደጋ ቃና በአጋኖ ምልክት ተጠብቋል። የእንግሊዝኛው የግርጌ ማስታወሻ አማራጭ በአማርኛ ልዩ የትርጉም ልዩነት ስለማያመጣ አልተካተተም።
