  text: ὁ ἐπὶ τοῦ δώματος μὴ ⸀καταβάτω ἆραι τὰ ἐκ τῆς οἰκίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/017.yaml
  text: Let the one on the housetop not go down to take the things out of his house,[a]
translation:
  language: am
  text: በቤት ጣሪያ ላይ ያለው ሰው ከቤቱ ውስጥ ያሉትን ነገሮች ለመውሰድ አይውረድ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በዚያ ዘመን የቤቶች ጣሪያ ብዙውን ጊዜ ጠፍጣፋና ሰዎች ሊጠቀሙበት የሚችሉት ስፍራ ነበር።
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἐπὶ τοῦ δώματος
  choice: በቤት ጣሪያ ላይ ያለው ሰው
  rationale: በግሪክኛው ስም ሆኖ የሚሠራውን አገላለጽ ‘በቤት ጣሪያ ላይ ያለው ሰው’ በማለት በተፈጥሯዊ አማርኛ ያቀርባል፤ ነጠላውን ተወካይ አገላለጽም ይጠብቃል።
- source_word: δώματος
  choice: የቤት ጣሪያ
  rationale: δώμα የቤትን ጠፍጣፋና ጥቅም ላይ የሚውል የጣሪያ ክፍል ያመለክታል፤ ‘የቤት ጣሪያ’ አጭርና ተረዥ ነው፣ ባህላዊ ዝርዝሩም በማስታወሻ ይብራራል።
- source_word: μὴ καταβάτω
  choice: አይውረድ
  rationale: አሉታዊውን ትእዛዝና ከጣሪያው ወደ ታች የሚደረገውን እንቅስቃሴ በቀጥታና በአስቸኳይ ቃና ያሳያል።
- source_word: ἆραι
  choice: ለመውሰድ
  rationale: ወደ ታች የመውረዱን ዓላማ የሚገልጸውን የግሪክኛ የዓላማ ኢንፊኒቲቭ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: τὰ ἐκ τῆς οἰκίας αὐτοῦ
  choice: ከቤቱ ውስጥ ያሉትን ነገሮች
  rationale: የግሪክኛውን አጠር ያለ አገላለጽ ግልጽ በማድረግ፣ ንብረት ብሎ ከመተርጎም ይልቅ የምንጩን ሰፊ ትርጉም ይጠብቃል።
- source_word: οἰκίας αὐτοῦ
  choice: ከቤቱ
  rationale: አውዱ ሕንፃውን ስለሚያመለክት ‘ቤት’ ተመርጧል፤ የሦስተኛ መደብ ነጠላ ወንድ ባለቤትነት በአማርኛው ‘ቤቱ’ ውስጥ ተጠብቋል።
theological_decisions:
- issue: ተወካይ ነጠላ ወንድ አገላለጽ
  choice: ‘ያለው ሰው’ እና ‘ቤቱ’ በማለት ነጠላውን ወንድ ቅርጽ መጠበቅ
  alternative: ፆታን ያልገለጸ ብዙ ቁጥር ወይም ‘የራሱ ቤት’ የሚል አገላለጽ
  rationale: የምንጩ ሰዋሰዋዊ ቅርጽ ነጠላ ወንድ ቢሆንም በዐውዱ ተወካይ ነው፤ ትርጉሙ ምንጩን ሳይለውጥ ይህን ቅርጽ ይጠብቃል፣ ልዩ ሥነ መለኮታዊ አቋምም አያስገባም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ይጠቀማል። ‘አይውረድ’ የሚለው ቅርጽ የግሪክኛውን አስቸኳይ አሉታዊ ትእዛዝ በተፈጥሯዊ ሁኔታ ያቀርባል።
