  yaml_path: translation/nt/matthew/024/047.yaml
  text: Truly I say to you that he will appoint him over all his possessions[a].
translation:
  language: am
  text: እውነት እላችኋለሁ፤ በንብረቱ ሁሉ ላይ[a] ይሾመዋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ባለው ሁሉ ላይ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: እውነት
  rationale: የኢየሱስን የተከበረና ሥልጣናዊ የንግግር መግቢያ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል፤ ቃሉ በግሪክ አንድ ጊዜ ብቻ ተጠቅሷል።
- source_word: λέγω ὑμῖν
  choice: እላችኋለሁ
  rationale: ቀጥተኛውን የንግግር ቅርጽና የብዙ ቁጥር ተደራሲዎችን ጠብቆ በአማርኛ የተለመደውን አገላለጽ ይጠቀማል።
- source_word: ὅτι
  choice: —
  rationale: በአማርኛ ‘እውነት እላችኋለሁ’ ከሚለው ቀጥሎ የይዘት ሐረጉን ያለ ግልጽ አያያዥ ማቅረብ ተፈጥሯዊና ግልጽ ነው።
- source_word: ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: በንብረቱ ሁሉ ላይ
  rationale: ἐπί ከዳቲቭ ጋር የኃላፊነትን ወይም የቁጥጥርን መስክ ያመለክታል፤ ‘ንብረቱ’ ደግሞ የእርሱ የሆኑትን ነገሮች በአጭርና ተፈጥሯዊ ቃል ይገልጻል።
- source_word: καταστήσει
  choice: ይሾመዋል
  rationale: በዚህ አውድ ግሡ በኃላፊነት ቦታ ላይ መመደብን እንጂ በቦታ ማስቀመጥን ብቻ አያመለክትም።
- source_word: αὐτόν
  choice: -ዋል
  rationale: በቀደመው አውድ ያለውን ታማኝና አስተዋይ አገልጋይ የሚያመለክተውን የወንድ ነጠላ ተውላጠ ስም በግሡ ውስጥ ጠብቆታል።
theological_decisions:
- issue: የጌታው ሽልማት ወይም የተስፋፋ አደራ ባሕርይ
  choice: አገልጋዩ በጌታው ንብረት ሁሉ ላይ እንደሚሾም በምሳሌው ቀጥተኛ ትርጉም ማቅረብ
  alternative: እንደ ቤተ ክርስቲያን ሥልጣን ወይም እንደ ፍጻሜ ዘመን ሰማያዊ ሽልማት ብቻ በትርጉሙ ውስጥ መወሰን
  rationale: ጥቅሱ በምሳሌው ውስጥ ወደ ሰፊ አደራ መሾምን ይናገራል፤ ከዚህ በላይ ያሉ ትርጓሜያዊ ግንኙነቶችን በትርጉሙ ላይ መጫን አይገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የተከበረው ‘እውነት እላችኋለሁ’ የኢየሱስን ቀመራዊ ንግግር ይጠብቃል።
