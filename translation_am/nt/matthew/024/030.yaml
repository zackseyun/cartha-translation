source:
  edition: SBLGNT
  text: καὶ τότε φανήσεται τὸ σημεῖον τοῦ υἱοῦ τοῦ ἀνθρώπου ἐν ⸀τῷ οὐρανῷ, καὶ τότε κόψονται πᾶσαι αἱ φυλαὶ τῆς γῆς καὶ ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ μετὰ δυνάμεως καὶ δόξης πολλῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/030.yaml
  text: And then the sign of the Son of Man will appear in heaven[a], and then all the tribes of the earth will mourn[c][b], and they will see the Son of Man coming on the clouds of heaven with power and great glory.
translation:
  language: am
  text: ከዚያም የሰው ልጅ ምልክት በሰማይ[a] ይታያል፤ በዚያን ጊዜም የምድር ነገዶች ሁሉ ያዝናሉ[b]፤ የሰው ልጅም በኃይልና በታላቅ ክብር በሰማይ ደመናዎች ላይ ሲመጣ ያዩታል[c]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በከባቢ ሰማይ።” የግሪኩ οὐρανός እንደ ዐውዱ “ሰማይ” ወይም “ከባቢ ሰማይ” ሊሆን ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “የሀገሪቱ ነገዶች ሁሉ።” የግሪኩ γῆ “ምድር” ወይም “ሀገር/መሬት” ሊያመለክት ይችላል።
    reason: alternative_reading
  - marker: c
    text: “በሰማይ ደመናዎች ላይ ሲመጣ” የሚለው አነጋገር ዳንኤል 7፥13ን ያስተጋባል።
    reason: cross_reference
lexical_decisions:
- source_word: φανήσεται
  choice: ይታያል
  rationale: የግሱን በራሱ የመገለጥና ለዓይን የመታየት ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: σημεῖον
  choice: ምልክት
  rationale: መሠረታዊውን ትርጉም በግልጽ ሁኔታ ይጠብቃል፤ ‘ተአምራዊ ምልክት’ ማለት ግን ጽሑፉን ከሚለው በላይ ይወስናል።
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: የሰው ልጅ
  rationale: የግሪኩን የባለቤትነት አወቃቀር ጠብቆ፣ ምልክቱ ከሰው ልጅ ጋር የተያያዘ መሆኑን ወይም እርሱ ራሱ ምልክቱ መሆኑን በትርጉም አይወስንም።
- source_word: ἐν τῷ οὐρανῷ
  choice: በሰማይ
  rationale: οὐρανός ሰማይንም ሆነ ከባቢ ሰማይን ሊያመለክት ይችላል፤ ‘በሰማይ’ የራእያዊውን ከፍ ያለ አነጋገር ይጠብቃል።
- source_word: κόψονται
  choice: ያዝናሉ
  rationale: በዚህ አገባብ ግሱ ሐዘንንና ልቅሶን ያመለክታል፤ የተወሰነውን የደረት መምታት እንቅስቃሴ በዋናው ጽሑፍ ሳያስገድድ ‘ያዝናሉ’ ትርጉሙን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: φυλαὶ τῆς γῆς
  choice: የምድር ነገዶች
  rationale: φυλή በቀጥታ ‘ነገድ’ ማለት ነው፤ γῆ በዚህ ዓለም-አቀፋዊ ራእያዊ አገባብ ‘ምድር’ ተብሎ ተተርጉሟል።
- source_word: ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: በሰማይ ደመናዎች ላይ
  rationale: የቦታውን ምስል በቀጥታ ይጠብቃል፣ እንዲሁም ከዳንኤል 7፥13 ጋር ያለውን ግልጽ የቃላት ግንኙነት አያጠፋም።
- source_word: μετὰ δυνάμεως καὶ δόξης πολλῆς
  choice: በኃይልና በታላቅ ክብር
  rationale: πολλῆς በቅርብ የሚያሻሽለውን ‘ክብር’ በ‘ታላቅ’ በመግለጽ የግሪኩን አወቃቀርና አጽንዖት ይጠብቃል።
theological_decisions:
- issue: ‘የሰው ልጅ ምልክት’ የሚለው የባለቤትነት ሐረግ ትርጉም
  choice: የሰው ልጅ ምልክት
  alternative: ‘የሰው ልጅ የሆነው ምልክት’ ወይም ‘የሰው ልጅ ራሱ ምልክት ሆኖ’
  rationale: የግሪኩ የባለቤትነት አወቃቀር ምልክቱ የእርሱ መሆኑን ወይም እርሱ ራሱ ምልክቱ መሆኑን በግድ አይወስንም፤ ትርጉሙም ይህን አሻሚነት ጠብቋል።
- issue: γῆ የሚያመለክተው ወሰን
  choice: ምድር
  alternative: ሀገር/መሬት
  rationale: የቅርብ ዐውዱ ዓለም-አቀፋዊና ራእያዊ በመሆኑ ‘ምድር’ ተመርጧል፤ ሆኖም የተወሰነችውን ሀገር ወይም መሬት ሊያመለክት የሚችለው አማራጭ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። የራእያዊው ንግግር ክብደት ተጠብቋል፤ የምልክቱ ማንነትና የγῆ ወሰን ግን በትርጉም በማስገደድ አልተወሰኑም።
