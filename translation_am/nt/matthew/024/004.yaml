lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν αὐτοῖς
  choice: መልሶ እንዲህ አላቸው
  rationale: የግሪክኛውን የመልስና የንግግር አገላለጽ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል፤ “መልሶ አላቸው” የሚለውን አላስፈላጊ ድግግሞሽም ያለሰልሳል።
- source_word: Βλέπετε μή τις
  choice: ማንም ... ተጠንቀቁ
  rationale: Βλέπετε በዚህ አውድ የመጠበቅና የመጠንቀቅ ትእዛዝ ነው፤ μή τις ደግሞ አደጋው እንዳይፈጸም የሚያስጠነቅቅ አገላለጽ ነው።
- source_word: πλανήσῃ
  choice: እንዳያስታችሁ
  rationale: “ማሳት” ሰውን ከትክክለኛው መንገድ ማውጣትንም ሆነ በሐሰት ማሳመንን ሊያመለክት ስለሚችል የπλανάωን ሰፊ ትርጉም ይጠብቃል።
theological_decisions:
- issue: በπλανήσῃ የተገለጠው የማስጠንቀቂያ ዓይነት
  choice: እንዳያስታችሁ
  alternative: እንዳያታልላችሁ
  rationale: ዋናው ትርጉም ማስታትን በሰፊው—በሐሰት መታለልንና ከትክክለኛው መንገድ መውጣትን—ይይዛል፤ የግንዛቤ ማታለል ብቻ እንዲሆን አያጠብም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪክኛው ትእዛዝ በብዙ ቁጥር “ተጠንቀቁ” ተጠብቋል።
