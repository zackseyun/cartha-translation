    text: ወይም፣ «መጎናጸፊያውን» ወይም «ውጫዊ ልብሱን»።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐν τῷ ἀγρῷ
  choice: በእርሻ ያለው
  rationale: በግሪክኛው ያለው በመስክ/በእርሻ መኖርን ባሕርይ አድርጎ ሰውን የሚያመለክት ነጠላ ስም-አገልጋይ ሐረግ ነው። «በእርሻ ያለው» ነጠላና ወካይ ኃይሉን ይጠብቃል፤ ፆታንም ሳያስፈልግ አያጠብም።
- source_word: μὴ ἐπιστρεψάτω ὀπίσω
  choice: ወደ ኋላ አይመለስ
  rationale: μή ከአኦሪስት ትእዛዛዊ ግስ ጋር ክልከላን ይገልጣል። «ወደ ኋላ አይመለስ» የትእዛዙን አጣዳፊ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἆραι
  choice: ለመውሰድ
  rationale: የαἴρω ኢንፊኒቲቭ እዚህ የመመለሱን ዓላማ ይገልጣል፤ «ለመውሰድ» ቀጥተኛና ተፈጥሯዊ ነው።
- source_word: τὸ ἱμάτιον αὐτοῦ
  choice: ልብሱን
  rationale: ἱμάτιον ልብስን፣ ብዙ ጊዜም ውጫዊ ልብስን ወይም ካባን ሊያመለክት ይችላል። «ልብሱን» የግሪክኛውን የቃላት ስፋት በዋናው ጽሑፍ ይጠብቃል፤ የበለጠ የተወሰነው አማራጭ በማስታወሻ ተገልጿል።
theological_decisions:
- issue: በስም-አገልጋይ ወንድ ፆታ አመልካች ውስጥ ያለው የፆታ ውክልና
  choice: በእርሻ ያለው
  alternative: በእርሻ ያለው ሰው / በእርሻ ያለ ወንድ
  rationale: የግሪክኛው አመልካች በሰዋስው ወንድ ፆታ ቢሆንም፣ በዚህ የማስጠንቀቂያ ንግግር ውስጥ ወካይና አጠቃላይ ነው። ትርጉሙ ወደ ወንዶች ብቻ እንዳይጠብ ተፈጥሯዊው የአማርኛ አገላለጽ ተመርጧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪክኛው ክልከላ አጣዳፊነት በ«አይመለስ» ተጠብቋል፤ ἱμάτιον ያለው የትርጉም ስፋት በዋናው ጽሑፍና በእግር ማስታወሻው ተወክሏል።
