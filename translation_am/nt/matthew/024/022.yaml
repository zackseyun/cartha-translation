revisions:
- from: እነዚያ ቀኖች ባያጥሩ[a] ኖሮ፣ አንድም ሥጋ የለበሰ ሰው[b] ባልዳነ ነበር፤ ነገር ግን ስለ ተመረጡት፣ እነዚያ ቀኖች ያጥራሉ።
  to: እነዚያ ቀኖች ባይቆረጡ ኖሮ፣ ማንም ሰው ባልዳነ ነበር፤ ነገር ግን ስለ ተመረጡት እነዚያ ቀኖች ይቆረጣሉ።
  rationale: The revision corrects the crucial passive voice of the Greek by using ባይቆረጡ / ይቆረጣሉ, retains the temporal and conditional structure, and replaces an unnatural literal calque for “all flesh” with idiomatic Amharic. The footnote preserves the underlying biblical idiom and the lexical alternative without claiming that the days act upon themselves.
