  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ εἰ μὴ ἐκολοβώθησαν αἱ ἡμέραι ἐκεῖναι, οὐκ ἂν ἐσώθη πᾶσα σάρξ· διὰ δὲ τοὺς ἐκλεκτοὺς κολοβωθήσονται αἱ ἡμέραι ἐκεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/022.yaml
  text: And if those days had not been cut short[a], no flesh would have been saved; but for the sake of the elect[b], those days will be cut short.
translation:
  language: am
  text: እነዚያ ቀኖች ባይቆረጡ ኖሮ፣ ማንም ሰው ባልዳነ ነበር፤ ነገር ግን ስለ ተመረጡት እነዚያ ቀኖች ይቆረጣሉ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκολοβώθησαν / κολοβωθήσονται
  choice: ባያጥሩ / ያጥራሉ
  rationale: ግሱ የቀኖቹ ቆይታ መቀነሱን ያመለክታል። ይህ አገላለጽ በአማርኛ ተፈጥሯዊ ሆኖ የግሪኩን ‘ማሳጠር/ቆርጦ ማሳጠር’ ኃይል ይጠብቃል።
- source_word: οὐκ ἂν ἐσώθη
  choice: ባልዳነ ነበር
  rationale: የግሪኩን ከእውነታ ተቃራኒ የሆነ ውጤት ያሳያል። ‘መዳን’ በዚህ አውድ በሕይወት መትረፍን ሊያመለክት ቢችልም፣ የσῴζωን ሰፊ ትርጉም ሳያጠብ ይጠብቃል።
- source_word: πᾶσα σάρξ
  choice: አንድም ሥጋ የለበሰ ሰው
  rationale: በአሉታዊው ሐረግ ውስጥ ‘ማንም ሰው’ የሚለውን ፍቺ ይሰጣል፤ በተመሳሳይም ጊዜ የመጽሐፍ ቅዱሱን ‘ሥጋ’ ፈሊጣዊ አነጋገር ያቆያል።
- source_word: διὰ δὲ τοὺς ἐκλεκτούς
  choice: ነገር ግን ስለ ተመረጡት
  rationale: διά ከተሳቢ ጋር የምክንያትን ወይም የጥቅምን ሐሳብ ያሳያል። ‘ስለ’ በአማርኛ ሁለቱንም ጥላዎች ሊሸከም ይችላል፤ ‘ተመረጡት’ም ቡድኑ ማንን እንደሚያካትት አስቀድሞ አይወስንም።
- source_word: αἱ ἡμέραι ἐκεῖναι
  choice: እነዚያ ቀኖች
  rationale: የግሪኩን አመልካች ሐረግ ቀጥተኛና ተፈጥሯዊ በሆነ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: καὶ εἰ μὴ
  choice: ባያጥሩ ... ኖሮ
  rationale: የማይፈጸም መላምታዊ ሁኔታን በተፈጥሯዊ የአማርኛ ሰዋስው ያቀርባል።
theological_decisions:
- issue: በፍጻሜ ዘመን ንግግር ውስጥ ‘የተመረጡት’ ማንነት
  choice: ‘ተመረጡት’ የሚለውን ቃል ያለ ትርጓሜያዊ ማስፋፊያ ማቆየት
  alternative: የእግዚአብሔር ሕዝብ / አማኞች / ታማኝ ቅሬታዎች
  rationale: ጥቅሱ ቡድኑን ἐκλεκτοί ብሎ ይጠራዋል እንጂ ሙሉ ማንነቱን በዚህ ቦታ አይገልጽም። ስለዚህ ትርጉሙ የእስራኤል፣ የቤተ ክርስቲያን ወይም የቅሬታ አተረጓጎምን አይጫንም።
- issue: በዚህ አውድ የσῴζω ትርጉም
  choice: ‘ዳነ’ ብሎ መተርጎም፣ አውዱ ደግሞ በሕይወት መትረፍን እንዲያመለክት መፍቀድ
  alternative: በሕይወት ተረፈ / በሕይወት ተጠበቀ
  rationale: አውዱ ከአስከፊዎቹ ቀኖች በሕይወት ስለመትረፍ ቢናገርም፣ ‘ዳነ’ የሚለው የግሪኩን ሰፊ የቃል ወሰን ይጠብቃል፤ ፍቺውንም ለሥጋዊ ወይም ለመንፈሳዊ መዳን ብቻ አያጠብም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። የመጽሐፍ ቅዱሱን ‘ሥጋ’ ፈሊጥ በአማርኛ ሊገባ በሚችል መልኩ ጠብቆ፣ በግርጌ ማስታወሻ ያብራራዋል።
