review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the conditional, contrary-to-fact result, future consequence, and the unexpanded designation of the elect. However, ባያጥሩ / ያጥራሉ grammatically presents the days as the agents that shorten, whereas both Greek forms are passive: the days are shortened/cut short.'
  naturalness: “ሥጋ የለበሰ ሰው” is understandable but not idiomatic modern standard Amharic in this clause. “ማንም ሰው” is clear and natural; a footnote can retain and explain the Greek biblical idiom.
  terminology: “ተመረጡት” appropriately retains ἐκλεκτοί without doctrinal expansion. “ዳነ” properly preserves the lexical breadth of σῴζω, while the immediate context permits survival as the implied sense.
  issues:
  - severity: high
    issue: The verbs for the days are active rather than passive.
    rationale: ἐκολοβώθησαν and κολοβωθήσονται are passive. The translation must say that the days were/will be cut short, not that they themselves shorten.
  - severity: medium
    issue: The rendering of πᾶσα σάρξ is unnatural.
    rationale: “አንድም ሥጋ የለበሰ ሰው” is a cumbersome calque. “ማንም ሰው” communicates the negated idiom naturally, with the source idiom explained in a note.
  - severity: low
    issue: Footnote a incorrectly frames an active/intransitive contrast.
    rationale: The Greek verb is passive in both occurrences; the alternative should retain passive wording.
