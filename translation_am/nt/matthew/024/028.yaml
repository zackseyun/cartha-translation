  rationale: የግሪኩ ጽሑፍ ሬሳውና ወፎቹ ምንን እንደሚወክሉ በግልጽ አይናገርም። ስለዚህ ትርጉሙ ምስሉንና የነገረ መለኮት ውጥረቱን ሳይፈታ ይጠብቃል።
