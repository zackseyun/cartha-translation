lexical_decisions:
- source_word: ὅπου ἐὰν ᾖ
  choice: ባለበት ሁሉ
  rationale: ὅπου ከἐάν እና ከንዑስ አድራጊ መልክ ᾖ ጋር ያልተወሰነ የቦታ ግንኙነትን ይገልጣል፤ ‘ባለበት ሁሉ’ ይህን ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: πτῶμα
  choice: ሬሳ
  rationale: ቃሉ የሞተ አካልን ያመለክታል፤ ‘ሬሳ’ በዘመናዊ አማርኛ ግልጽ፣ አጭርና ለዚህ ምስል ተስማሚ ነው።
- source_word: συναχθήσονται
  choice: ይሰበሰባሉ
  rationale: የግሪኩ የወደፊት ጊዜ ተገብሮ መልክ በዚህ ዐውድ ወፎቹ ወደ ሬሳው መሰብሰባቸውን ያሳያል፤ ‘ይሰበሰባሉ’ በአማርኛ ተፈጥሯዊ ነው።
- source_word: ἀετοί
  choice: አሞሮች
  rationale: ἀετός ንስርን ሊያመለክት ቢችልም፣ በሬሳ ዙሪያ የሚሰበሰቡ ወፎች በተገለጹበት በዚህ ምስል ‘አሞሮች’ የዐውዱን አመልካችነት ይበልጥ ያስተላልፋል፤ ‘ንስሮች’ የሚለው የቃሉ አማራጭ ትርጉም በግርጌ ማስታወሻ ተጠብቋል።
