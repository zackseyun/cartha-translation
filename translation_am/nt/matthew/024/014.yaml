id: MAT.24.14
reference: Matthew 24:14
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ κηρυχθήσεται τοῦτο τὸ εὐαγγέλιον τῆς βασιλείας ἐν ὅλῃ τῇ οἰκουμένῃ εἰς μαρτύριον πᾶσιν τοῖς ἔθνεσιν, καὶ τότε ἥξει τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/014.yaml
  text: And this good news of the kingdom will be proclaimed throughout the whole world as a testimony to all the nations[c][b][a], and then the end will come.
translation:
  language: am
  text: ይህም የመንግሥቱ የምሥራች[a] በዓለም ሁሉ[b] ለብሔራት ሁሉ[c] ምስክር እንዲሆን ይታወጃል፤ ከዚያም ፍጻሜው ይመጣል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የመንግሥቱ ወንጌል»።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «ሰዎች በሚኖሩበት ዓለም ሁሉ»።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ «ለሕዝቦች ሁሉ»።
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρυχθήσεται
  choice: ይታወጃል
  rationale: የወደፊት ጊዜ ተደራጊ ቅርጹንና በይፋ የማወጅን ሐሳብ ይጠብቃል። «ይሰበካል» ትክክለኛ አማራጭ ቢሆንም ይበልጥ ቤተ ክርስቲያናዊ ቃና ሊኖረው ይችላል።
- source_word: εὐαγγέλιον
  choice: የምሥራች
  rationale: የቃሉን መሠረታዊ ትርጉም፣ ማለትም መልካም ዜናን፣ ለዘመናዊ አንባቢ ግልጽ በሆነ ቋንቋ ያቀርባል።
- source_word: τῆς βασιλείας
  choice: የመንግሥቱ
  rationale: የግሪኩን የባለቤትነት አገናኝ በቀጥታ ይጠብቃል፤ «ስለ መንግሥቱ» ከሚለው ያነሰ ትርጓሜ ያክላል።
- source_word: ἐν ὅλῃ τῇ οἰκουμένῃ
  choice: በዓለም ሁሉ
  rationale: οἰκουμένη ሰዎች የሚኖሩበትን ዓለም ያመለክታል፤ ይህ አተረጓጎም ሰፊውን ወሰን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: εἰς μαρτύριον
  choice: ምስክር እንዲሆን
  rationale: ስብከቱ ምስክርነት የመሆኑን ዓላማ ወይም ውጤት ያሳያል፤ ምስክርነቱ ለሰሚዎቹ የሚደግፍ ወይም የሚፈርድባቸው መሆኑን አስቀድሞ አይወስንም።
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: ለብሔራት ሁሉ
  rationale: ἔθνη እዚህ በሰፊው የዓለምን ብሔራት ወይም ሕዝቦች ያመለክታል፤ «አሕዛብ» በማለት አይሁድ ያልሆኑትን ብቻ እንዳያመለክት ተቆጥቧል።
- source_word: ἥξει
  choice: ይመጣል
  rationale: የἥκωን ቀላልና ተፈጥሯዊ ትርጉም በወደፊት ጊዜ ያቀርባል።
- source_word: τὸ τέλος
  choice: ፍጻሜው
  rationale: በዚህ ዐውድ ያለውን የመጨረሻ ወይም የፍጹም መደምደሚያ ሐሳብ በክብር ያለውና ግልጽ ቃል ያቀርባል፤ «የፍጻሜ ዘመን» የሚል በጽሑፉ ያልተገለጸ ሥርዓት አያክልም።
theological_decisions:
- issue: በፍጻሜ ጊዜ ንግግሩ ውስጥ የοἰκουμένη እና የἔθνη ወሰን
  choice: «በዓለም ሁሉ» እና «ለብሔራት ሁሉ» በማለት ሁሉን አቀፍ ስፋቱን መጠበቅ
  alternative: οἰκουμένηን «ሰዎች በሚኖሩበት ዓለም ሁሉ»፣ ἔθνηንም «ለሕዝቦች ሁሉ» ብሎ መተርጎም
  rationale: ንግግሩ ከ«ፍጻሜው» በፊት የሚሆነውን ማወጅ ሰፊ ወሰን ያሳያል። ትርጉሙ ይህን ስፋት ይጠብቃል፤ ይሁን እንጂ ፍጻሜው በታሪክ መቼ እንደሚፈጸም ወይም ዓለም ሮማዊውን ዓለም ብቻ እንደሚያመለክት አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ አማርኛ ተጠቅሟል። «ይታወጃል» በይፋ የማወጅን ኃይል ይጠብቃል፤ «የምሥራች» ደግሞ ከባህላዊው «ወንጌል» ጎን ለጎን ግልጽነትን ይሰጣል።
