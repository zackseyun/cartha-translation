  yaml_path: translation/nt/matthew/024/038.yaml
  text: For as in the days before the flood they were eating and drinking[a], marrying and giving in marriage, until the day Noah entered the ark,
translation:
  language: am
  text: ምክንያቱም ከጥፋት ውሃው በፊት በነበሩት ቀናት እንደነበረው፣ ኖኅ ወደ መርከቡ እስከገባበት ቀን ድረስ ሰዎች ይበሉና ይጠጡ፣ ያገቡና ለጋብቻ ይሰጡ[a] ነበር፤
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ለጋብቻ ይሰጡ» የሚለው ሌሎችን ለጋብቻ መስጠት ወይም ራሳቸው ለጋብቻ መሰጠት ማለት ሊሆን ይችላል። ግሪኩ γαμοῦντες እና γαμίζοντες የሚሉ ሁለት የተለያዩ ቃላትን ይጠቀማል።
