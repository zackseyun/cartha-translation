theological_decisions:
- issue: የተዘረዘሩት ተግባራት ኃጢአታዊ ቅጥ ያጣ ኑሮን ወይስ ፍርድን ሳያውቁ የቀጠለ መደበኛ ኑሮን ያመለክታሉ?
  choice: ተግባራቱን እንደ መደበኛ የሰው ሕይወት በገለልተኛ ቋንቋ ማቅረብ
  alternative: የልቅነትን፣ የስካርን ወይም የሥነ ምግባር ግዴለሽነትን ትርጉም መጨመር
  rationale: የግሪክ አሳታፊ ግሶቹ በራሳቸው መብላትን፣ መጠጣትንና ጋብቻን እንጂ ኃጢአታዊ ቅጥ ማጣትን አይገልጹም። በዐውዱ ያለው አጽንዖት መደበኛ ሕይወት ሲቀጥል ፍርድ በድንገት መምጣቱ ላይ ነው።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ቀጣዩ ቁጥር ንጽጽሩን ስለሚያጠናቅቅ፣ ቁጥሩ በፍጻሜ ነጥብ ሳይሆን በ፤ ተዘግቷል።
