lexical_decisions:
- source_word: ὡς γὰρ
  choice: ምክንያቱም … እንደ
  rationale: γάρ የሚያሳየውን የማብራሪያ ግንኙነት በ«ምክንያቱም» ያቆያል፤ ὡς የሚያሳየው ንጽጽር ከቀጣዩ ቁጥር ጋር በሚሟላው ዐረፍተ ነገር ይገለጣል።
- source_word: ἐν ταῖς ἡμέραις ταῖς πρὸ τοῦ κατακλυσμοῦ
  choice: ከጥፋት ውሃው በፊት በነበሩት ቀናት
  rationale: ጊዜያዊውን ትርጉም በተፈጥሯዊ አማርኛ ያቀርባል፤ «የጥፋት ውሃ» የኖኅን ታሪክ በግልጽ ያመለክታል።
- source_word: τρώγοντες καὶ πίνοντες
  choice: ይበሉና ይጠጡ … ነበር
  rationale: አልፎ አልፎ ሳይሆን ቀጥሎ የነበረን የዕለት ተዕለት ተግባር ይገልጣል፤ በጽሑፉ የሌለ የስካር ወይም የጥጋብ ፍርድ አይጨምርም።
- source_word: γαμοῦντες
  choice: ያገቡ
  rationale: «ማግባት» የሚለውን ቀጥተኛ ትርጉም ያስተላልፋል።
- source_word: γαμίζοντες
  choice: ለጋብቻ ይዳሩ
  rationale: ከγαμοῦντες ጋር ያለውን የቃላት ልዩነት ያቆያል፤ ቃሉ ሌሎችን ለጋብቻ መስጠትን ወይም ራስን ለጋብቻ መሰጠትን ሊያመለክት ስለሚችል የአማርኛው አገላለጽ ጾታንና አቅጣጫን አይገድብም።
- source_word: ἄχρι ἧς ἡμέρας
  choice: እስከገባበት ቀን ድረስ
  rationale: ቀጥለው የነበሩት ተግባራት የደረሱበትን ጊዜያዊ ጫፍ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν
  choice: ኖኅ ወደ መርከቡ ገባ
