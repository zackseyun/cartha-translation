  source_fidelity: The draft accurately retains the concrete force of διχοτομήσει (“will cut in two”), the judgment allotment in τὸ μέρος αὐτοῦ ... θήσει, the Matthean term “hypocrites,” and the final judgment formula. However, “ዕጣ ፈንታውን ... ያደርጋል” is not an idiomatic or sufficiently precise way to express assigning someone a portion with a group.
  naturalness: “ለሁለት ይቆርጠዋል” and “በዚያም ልቅሶና ጥርስ ማፋጨት ይሆናል” are clear, dignified modern Amharic. Recasting the middle clause with ይመድብለታል makes the judicial allocation natural and explicit.
  terminology: ግብዞች, ልቅሶ, and ጥርስ ማፋጨት are appropriate and consistent terms. “ድርሻ” is preferable to “ዕጣ ፈንታ” here because it directly represents μέρος without introducing the stronger implication of predetermined fate.
