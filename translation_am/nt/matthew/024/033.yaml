  text: οὕτως καὶ ὑμεῖς, ὅταν ἴδητε ⸂πάντα ταῦτα⸃, γινώσκετε ὅτι ἐγγύς ἐστιν ἐπὶ θύραις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/033.yaml
  text: So also you[a], when you see all these things, know that it is near, at the doors.
translation:
  language: am
  text: እንዲሁ እናንተም፣ እነዚህን ሁሉ ስታዩ፣ ቅርብ እንደሆነና በደጆች ፊት እንደሆነ እወቁ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እርሱ ቅርብ ነው፤ በደጆች ፊትም ነው።” ግሪክኛው ባለቤቱን በግልጽ አይጠቅስም።
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: እንዲሁም እናንተ
  rationale: ከቀደመው የበለስ ምሳሌ ጋር ያለውን ንጽጽርና ለደቀ መዛሙርቱ የተሰጠውን አጽንዖት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὅταν ἴδητε
  choice: ስታዩ
  rationale: ወደፊት የሚፈጸም ነገርን የሚያመለክተውን ጊዜያዊ አገባብ ‘ስታዩ’ በተፈጥሯዊና ቀጥተኛ መንገድ ይገልጣል።
- source_word: πάντα ταῦτα
  choice: እነዚህን ሁሉ
  rationale: የግሪክኛውን ብዙ ቁጥር ሳያጠቃልል በግልጽ ይጠብቃል።
- source_word: γινώσκετε
  choice: ዕወቁ
  rationale: የብዙ ቁጥር ትእዛዛዊ ኃይሉን በቀጥታ ይጠብቃል።
- source_word: ἐγγύς
  choice: ቅርብ
  rationale: የቦታ ወይም የጊዜ ቅርበትን ሊያመለክት የሚችለውን የምንጩን ሰፊ ትርጉም ይጠብቃል።
- source_word: ἐπὶ θύραις
  choice: በደጆች ላይ
  rationale: የግሪክኛውን ብዙ ቁጥር ይጠብቃል፤ አገላለጹም እጅግ መቅረብን ያሳያል።
- source_word: ἐγγύς ἐστιν
  choice: ቅርብ፣ በደጆች ላይ እንደሆነ
  rationale: በግሪክኛው ያልተገለጸውን ባለቤት በአማርኛም ሳይጨምር ይተዋል፤ ስለዚህ ‘እርሱ’ ወይም አንድ ክስተት ተብሎ እንዳይወሰን የምንጩን አሻሚነት ይጠብቃል።
theological_decisions:
- issue: የἐγγύς ἐστιν ያልተገለጸ ባለቤት
  choice: ባለቤቱን ሳይጠቅስ ‘ቅርብ፣ በደጆች ላይ እንደሆነ’ ብሎ መተርጎም
  alternative: ‘እርሱ ቅርብ ነው፣ በደጆች ላይም ነው’
  rationale: ግሪክኛው ባለቤቱን አይገልጽም። ይህ የሰው ልጅን፣ የሚመጡትን ክስተቶች ወይም ፍጻሜውን/መንግሥቱን ያመለክት እንደሆነ ከትርጉሙ ብቻ መወሰን ስለማይገባ፣ እውነተኛው የምንጩ አሻሚነት ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ደጆች’ የምንጩን ብዙ ቁጥር ይጠብቃል፤ ያልተገለጸው ባለቤትም ሆን ተብሎ አልተሞላም።
