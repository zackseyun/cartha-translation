revisions:
- from: እንዲሁም እናንተ፣ እነዚህን ሁሉ ስታዩ፣ ቅርብ፣ በደጆች ላይ እንደሆነ ዕወቁ።[a]
  to: እንዲሁ እናንተም፣ እነዚህን ሁሉ ስታዩ፣ ቅርብ እንደሆነና በደጆች ፊት እንደሆነ እወቁ።[a]
  rationale: The revision supplies a fully grammatical pair of Amharic complement clauses while leaving their shared subject unexpressed, as in Greek. It also improves the opening emphasis, modernizes the imperative spelling, and renders the door idiom more naturally. The footnote continues to mark “እርሱ” as a possible, rather than required, interpretation.
