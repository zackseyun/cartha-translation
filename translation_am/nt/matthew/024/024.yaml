- source_word: ψευδοπροφῆται
  choice: ሐሰተኛ ነቢያት
  rationale: የውሁድ ስሙን ቀጥተኛና በአማርኛ የተለመደ አገላለጽ ያቀርባል።
- source_word: δώσουσιν
  choice: ያደርጋሉ
