- source_word: πλανῆσαι
  choice: ለማሳት
  rationale: ‘ማሳት’ ከእውነተኛው መንገድ እንዲወጣ ማድረግን ይገልጻል፤ ከ‘ማታለል’ ይልቅ የπλανάωን የመንገድ መሳት ገጽታ ያቆያል።
- source_word: εἰ δυνατὸν
  choice: ቢቻል
  rationale: አጭሩን የግሪክ ሁኔታዊ አገላለጽ በቀጥታ ያቀርባል፤ የማይቻል መሆኑን በትርጉሙ ውስጥ አይጨምርም።
- source_word: καὶ τοὺς ἐκλεκτούς
  choice: የተመረጡትን እንኳ
