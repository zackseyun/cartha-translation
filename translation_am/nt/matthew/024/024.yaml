- source_word: σημεῖα μεγάλα
  choice: ታላላቅ ምልክቶች
  rationale: σημεῖα የማስረጃ ወይም የትንቢት ምልክትነት ገጽታውን እንዲያቆይ ‘ምልክቶች’ ተብሏል፤ μεγάλα ደግሞ ‘ታላላቅ’ ተብሎ ቀጥታ ተሰጥቷል።
