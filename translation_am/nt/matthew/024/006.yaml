  text: And you are going to hear of wars and reports of wars. See that you are not alarmed[a], for it must happen, but the end is not yet.
translation:
  language: am
  text: ጦርነቶችንና ስለ ጦርነቶች ዜናዎችን[a] ልትሰሙ ነው። እንዳትደናገጡ ተጠንቀቁ፤ ይህ መሆን አለበትና፣ ነገር ግን መጨረሻው ገና አይደለም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የጦርነት ወሬዎችን።” የግሪኩ አገላለጽ ዘገባን፣ ዜናን ወይም ወሬን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: μελλήσετε
  choice: ልትሰሙ ነው
  rationale: የሚጠበቅን የወደፊት ክስተት የሚያመለክተውን የμέλλω ኃይል በተፈጥሯዊ ዘመናዊ አማርኛ ይጠብቃል።
- source_word: ἀκούειν πολέμους
  choice: ጦርነቶችን … ልትሰሙ
  rationale: በአውዱ የጦርነት ዜና መስማትን ያመለክታል፤ πόλεμος ከአንድ ውጊያ ይልቅ ጦርነትን ያመለክታል።
- source_word: ἀκοὰς πολέμων
  choice: የጦርነት ወሬዎች
  rationale: ἀκοή የተሰማ ዘገባ፣ ዜና ወይም ወሬ ሊያመለክት ይችላል። ‘ወሬ’ በአማርኛ የተሰማ ነገርን በተፈጥሯዊ ሁኔታ ያስተላልፋል፤ አሻሚነቱም በማስታወሻ ተጠብቋል።
- source_word: ὁρᾶτε, μὴ θροεῖσθε
  choice: እንዳትደናገጡ ተጠንቀቁ
  rationale: ὁρᾶτε እዚህ የማስጠንቀቂያ ትእዛዝ ነው፤ θροεῖσθε ደግሞ መረበሽን ወይም መደናገጥን ያመለክታል።
- source_word: δεῖ γὰρ γενέσθαι
  choice: ይህ መሆን አለበትና
  rationale: δεῖ አስፈላጊነትን ያሳያል። በግሪኩ ግልጽ ስም ስለሌለ፣ ከቅርብ አውድ የሚመለሰው ‘ይህ’ ከልክ ያለፈ ማብራሪያ ሳይጨምር ተፈጥሯዊ አማርኛ ይሰጣል።
- source_word: ἀλλ’ οὔπω ἐστὶν τὸ τέλος
  choice: ነገር ግን መጨረሻው ገና አይደለም
  rationale: የግሪኩን አጭርና ሰፊ የፍጻሜ አገላለጽ ይጠብቃል፤ የተወሰነ የፍጻሜ ዘመን ሥርዓት አይጭንም።
theological_decisions:
