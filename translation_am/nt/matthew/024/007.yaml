  text: ἐγερθήσεται γὰρ ἔθνος ἐπὶ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν, καὶ ἔσονται ⸀λιμοὶ καὶ σεισμοὶ κατὰ τόπους·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/007.yaml
  text: For nation will rise against nation[a], and kingdom against kingdom[b], and there will be famines and earthquakes in various places.
translation:
  language: am
  text: ሕዝብ በሕዝብ ላይ ይነሣልና፣ መንግሥትም በመንግሥት ላይ ይነሣል፤ በልዩ ልዩ ስፍራዎችም ረሃቦችና የምድር መናወጦች ይሆናሉ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγερθήσεται
  choice: ይነሣል
  rationale: በዚህ የጠላትነት አገባብ ግሱ አንዱ ሕዝብ በሌላው ላይ ለግጭት መነሣቱን ያመለክታል፤ በግልጽ ያልተጠቀሰ መለኮታዊ አስነሺ እንዳይጨመር በተፈጥሯዊ አማርኛ ተተርጉሟል።
- source_word: γὰρ
  choice: -ና
  rationale: ከቀደመው ንግግር ጋር ያለውን የማብራሪያ ግንኙነት በተፈጥሯዊ የአማርኛ አያያዥ ያሳያል።
- source_word: ἔθνος
  choice: ሕዝብ
  rationale: በዚህ ትይዩ ሐረግ የፖለቲካ ወይም የብሔራዊ ማኅበረሰብ ቡድንን ያመለክታል፤ ‘ሕዝብ’ በዘመናዊ አማርኛ ግልጽ ሲሆን የአሕዛብን ልዩ ትርጉም አያስገባም።
- source_word: ἐπὶ ἔθνος
  choice: በሕዝብ ላይ
  rationale: ἐπί ከተሳቢ ጋር በዚህ የጠላትነት አገባብ ‘በ...ላይ’ የሚለውን የተቃውሞ አቅጣጫ ይገልጣል።
- source_word: βασιλεία
  choice: መንግሥት
  rationale: ከ‘ሕዝብ’ ጋር በትይዩ የቀረበ የፖለቲካ ግዛትን ወይም መንግሥትን ያመለክታል።
- source_word: ἔσονται
  choice: ይሆናሉ
  rationale: የመኖርን ወይም የመከሰትን ትርጉም በተፈጥሯዊ የአማርኛ የወደፊት ግስ ያቀርባል።
- source_word: λιμοὶ
  choice: ረሃብ
  rationale: ከባድ የምግብ እጥረትን የሚያመለክተውን መደበኛ የአማርኛ ቃል ይጠቀማል፤ በአማርኛ ይህ ስም በነጠላ ቅርጽ የብዙ ክስተቶችንም ሐሳብ በተፈጥሮ ሊሸከም ይችላል።
- source_word: σεισμοὶ
  choice: የምድር መናወጥ
  rationale: በዐውዱ σεισμός የምድር መናወጥን ያመለክታል፤ ይህ አገላለጽ ለዘመናዊ አንባቢ ግልጽና ክቡር ነው።
- source_word: κατὰ τόπους
  choice: በየስፍራው
  rationale: ሐረጉ ክስተቶቹ በአንድ ቦታ ብቻ ሳይሆን በተከፋፈሉ ልዩ ልዩ ቦታዎች እንደሚከሰቱ የሚያሳየውን አከፋፋይ ስሜት ይጠብቃል።
theological_decisions:
- issue: በፍጻሜ ዘመን ግጭት ንግግር ውስጥ የἔθνος ወሰን
  choice: ሕዝብ
  alternative: ብሔር፣ አገር፣ አሕዛብ
  rationale: ከ‘መንግሥት በመንግሥት ላይ’ ጋር ያለው ትይዩነት ሰፊ ማኅበራዊና ፖለቲካዊ ግጭትን ይጠቁማል፤ ‘ሕዝብ’ ትርጉሙን አላግባብ ወደ አሕዛብ ብቻ አያጠብም።
- issue: የወደፊት ተገብሮ/መካከለኛ ቅርጽ ἐγερθήσεται ኃይል
  choice: ይነሣል
  alternative: ይነሣሣል፣ ይነሣበታል፣ ይነሣ ዘንድ ይደረጋል
  rationale: አገባቡ የግጭትን መነሣት ይገልጣል፤ ጽሑፉ በግልጽ ያልጠቀሰውን መለኮታዊ አስነሺ መጨመር አያስፈልግም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር አማርኛ ተጠቅሟል። የግሪኩ ትይዩ አወቃቀር ‘ሕዝብ በሕዝብ ላይ፣ መንግሥትም በመንግሥት ላይ’ በሚል ተጠብቋል፤ የግጭት ሐሳብ ሳይብራራ እንዳይጠፋ የግርጌ ማስታወሻ ተጨምሯል።
