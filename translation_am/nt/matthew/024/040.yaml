base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/040.yaml
  text: Then two men will be in the field; one is taken and one is left.
translation:
  language: am
  text: በዚያን ጊዜ ሁለት ወንዶች በእርሻ ውስጥ ይሆናሉ፤ አንዱ ይወሰዳል[a]፣ አንዱም ይቀራል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አብሮ ይወሰዳል።” ግሱ በራሱ መወሰዱ ለመዳን ወይም ለፍርድ መሆኑን አይገልጽም።
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: በዚያን ጊዜ
  rationale: የጊዜ ተውሳኩ ንግግሩን ከቀደመው የፍጻሜ ዘመን አውድ ጋር ያገናኛል፤ ይህ አገላለጽ በአማርኛ ተፈጥሯዊ ሲሆን የጊዜውን ቅደም ተከተል ይጠብቃል።
- source_word: δύο ἔσονται
  choice: ሁለት ወንዶች … ይሆናሉ
  rationale: የሚከተሉት εἷς … εἷς በወንድ ጾታ ቅርጽ የቀረቡ ሲሆን፣ በቀጣዩ ቁጥር ካለው የሴቶች ትይዩ ምሳሌ ጋር ሲነበብ እዚህ የወንዶች ትዕይንት መሆኑን ይደግፋል።
- source_word: ἐν τῷ ἀγρῷ
  choice: በእርሻ ውስጥ
  rationale: ቀጥተኛውን የቦታ ትርጉም በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: εἷς
  choice: አንዱ … አንዱም
  rationale: የግሪኩን አጭርና ትይዩ ንጽጽር ይጠብቃል፤ በመጀመሪያው ሐረግ ወንዶች መሆናቸው ተገልጿል።
- source_word: παραλαμβάνεται
  choice: ይወሰዳል
  rationale: በወደፊት አውድ ያለውን የአሁን ጊዜ ተገብሮ ቅርጽ በተፈጥሯዊ አማርኛ ያቀርባል፤ መወሰዱ ለመዳን ወይም ለፍርድ መሆኑን በራሱ አይወስንም።
- source_word: ἀφίεται
  choice: ይቀራል
  rationale: በዚህ አውድ ያለውን ‘መተው/መቅረት’ ትርጉም ያለ ተጨማሪ ሥነ መለኮታዊ ጫና ያስተላልፋል።
theological_decisions:
- issue: παραλαμβάνεται መወሰዱ ለመዳን ነው ወይስ ለፍርድ?
  choice: በዋናው ጽሑፍ “ይወሰዳል” በሚለው ገለልተኛ አገላለጽ ማቆየት
  alternative: “ለፍርድ ይወሰዳል” ወይም “ወደ ደኅንነት ይወሰዳል” ብሎ መግለጽ
  rationale: የቃሉና የቅርብ አውዱ ማስረጃ ሁለቱንም የትርጓሜ አቅጣጫዎች ሙሉ በሙሉ አይዘጋም፤ ስለዚህ ትርጉሙ የሥነ መለኮት ውጥረቱን ሳይፈታ ያቆየዋል።
- issue: የδύο ἔσονταιን ወንድ ጾታ በአማርኛ ግልጽ ማድረግ
  choice: “ሁለት ወንዶች” ማለት
  alternative: “ሁለት ሰዎች” ወይም “ሁለት” ብቻ ማለት
  rationale: ምንም እንኳ δύο በራሱ ‘ወንዶች’ ባይልም፣ εἷς … εἷς የወንድ ጾታ ቅርጽና በሚቀጥለው ቁጥር ያለው የሴቶች ትይዩ ምሳሌ ይህን ማብራሪያ ይደግፋሉ።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የግሪኩ አጭር ትይዩ አወቃቀርና የትርጓሜ አሻሚነት ተጠብቀዋል።
