  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Τί δειλοί ἐστε, ὀλιγόπιστοι; τότε ἐγερθεὶς ἐπετίμησεν τοῖς ἀνέμοις καὶ τῇ θαλάσσῃ, καὶ ἐγένετο γαλήνη μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/026.yaml
  text: And he said to them, “Why are you fearful, you of little faith?” Then, having risen, he rebuked the winds and the sea, and there was a great calm.
translation:
  language: am
  text: እርሱም፣ “ለምን ፈሪዎች ናችሁ፣ እናንተ እምነት የጎደላችሁ?” አላቸው። ከዚያም ተነሥቶ ነፋሳቱንና ባሕሩን ገሠጸ፤ ታላቅም ጸጥታ ሆነ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δειλοί
  choice: ትፈራላችሁ
  rationale: ቃሉ ፍርሃትን ወይም ፈሪነትን ያመለክታል፤ በጥያቄው አወቃቀር ውስጥ “ለምን ትፈራላችሁ?” ተፈጥሯዊና ክብር ያለው ዘመናዊ አማርኛ ነው።
- source_word: ὀλιγόπιστοι
  choice: እምነት የጎደላችሁ
  rationale: “ጥቂት እምነት ያላችሁ” የሚለውን ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ፍጹም እምነት እንደሌላቸው አይናገርም።
- source_word: ἐπετίμησεν
  choice: ገሠጸ
  rationale: ጠንካራ ትእዛዛዊ ወቀሳን የሚያመለክተውን ግስ በቀጥታ ይወክላል።
- source_word: γαλήνη μεγάλη
  choice: ታላቅ ጸጥታ
  rationale: የባሕሩን እጅግ መረጋጋት በአጭርና በተፈጥሯዊ አገላለጽ ያስተላልፋል።
theological_decisions:
- issue: የὀλιγόπιστοι አስተርጓሚ ክብደት
  choice: እምነት የጎደላችሁ
  alternative: እምነት የሌላችሁ
  rationale: የግሪክ ቃሉ አነስተኛ ወይም የጎደለ እምነትን እንጂ ፍጹም እምነት ማጣትን አያመለክትም።
- issue: ኢየሱስ ነፋሳቱንና ባሕሩን መገሠጹ
  choice: ነፋሳቱንና ባሕሩን ገሠጸ
  alternative: ነፋሳቱና ባሕሩ እንዲቆሙ አዘዘ
  rationale: ምንጩ የተጠቀመውን ሰዋዊ የገሠጻ አገላለጽ ሳያለዝብ ይጠብቃል፤ ተጨማሪ ሥነ መለኮታዊ ማብራሪያም አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለአጠቃላይ አንባቢ ግልጽ የሆነ አማርኛ። “ተነሥቶ” የግሪኩን አስቀድሞ የተከናወነ ተግባር በተፈጥሯዊ ቅደም ተከተል ያቀርባል።
