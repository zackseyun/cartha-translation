review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the rebuke of the winds and sea and the resulting great calm. However, δειλοί is a present predicate adjective (“fearful/afraid”), whereas ትፈራላችሁ recasts it as the verbal action “you fear.” A small revision preserves the Greek construction more closely. The participle ἐγερθεὶς is well represented by ተነሥቶ.
  naturalness: The revised wording is clear, idiomatic modern standard Amharic, and retains a dignified biblical register. ፈሪዎች ናችሁ is a natural predicate-adjective expression in this direct rebuke.
  terminology: እምነት የጎደላችሁ appropriately represents ὀλιγόπιστοι without implying a total absence of faith. ገሠጸ faithfully retains the force of ἐπετίμησεν, and ታላቅ ጸጥታ appropriately renders γαλήνη μεγάλη in the sea-storm context.
  issues:
  - severity: low
    issue: δειλοί is rendered with a verb rather than a predicate adjective.
    rationale: The draft’s ለምን ትፈራላችሁ? communicates the general sense, but the Greek asks why they are δειλοί (“fearful/afraid”). Rendering it as ለምን ፈሪዎች ናችሁ? better preserves both the present-state construction and the rhetorical rebuke.
  revised_text: እርሱም፣ “ለምን ፈሪዎች ናችሁ፣ እናንተ እምነት የጎደላችሁ?” አላቸው። ከዚያም ተነሥቶ ነፋሳቱንና ባሕሩን ገሠጸ፤ ታላቅም ጸጥታ ሆነ።
