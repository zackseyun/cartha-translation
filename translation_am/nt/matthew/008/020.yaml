  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Αἱ ἀλώπεκες φωλεοὺς ἔχουσιν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις, ὁ δὲ υἱὸς τοῦ ἀνθρώπου οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/020.yaml
  text: And Jesus says to him[a], “Foxes have dens, and the birds of the sky have nests[d][c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: am
  text: ኢየሱስም እንዲህ አለው፦ “ቀበሮዎች ጉድጓዶች[a] አሏቸው፤ የሰማይ ወፎችም[b] ጎጆዎች[c] አሏቸው፤ የሰው ልጅ[d] ግን ራሱን የሚያሳርፍበት ስፍራ የለውም።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ዋሻዎች።”
    reason: lexical_alternative
  - marker: b
    text: ወይም “የአየር ወፎች።”
    reason: lexical_alternative
  - marker: c
    text: ወይም “ማረፊያዎች።”
    reason: lexical_alternative
  - marker: d
    text: “የሰው ልጅ” ኢየሱስ ራሱን የሚጠራበት መጠሪያ ነው፤ አንዳንዶች “ሰው የሆነው” ብለው ይተረጉሙታል።
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: አለው
  rationale: የግሪኩ ቃል በታሪካዊ የአሁን ጊዜ ቢቀርብም፣ በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜን መጠቀም ግልጽና የተለመደ ነው።
- source_word: ἀλώπεκες
  choice: ቀበሮዎች
  rationale: የብዙ ቁጥር ስሙን በቀጥታና በተፈጥሯዊ አማርኛ ይወክላል።
- source_word: φωλεοὺς
  choice: ጉድጓዶች
  rationale: የቀበሮዎችን መኖሪያ በቀጥታ የሚገልጽ የተለመደ ቃል ነው፤ ‘ዋሻዎች’ም በአውዱ ሊሆን ይችላል።
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: የሰማይ ወፎች
  rationale: የግሪኩን ምስል በቅርብ ይጠብቃል፤ በአማርኛም ተፈጥሯዊና ግልጽ ነው።
- source_word: κατασκηνώσεις
  choice: ጎጆዎች
  rationale: ቃሉ ማረፊያዎችን ወይም መጠለያዎችን ሊያመለክት ቢችልም፣ ስለ ወፎች በሚናገረው አውድ ‘ጎጆዎች’ ተፈጥሯዊ ነው።
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: የሰው ልጅ
  rationale: የኢየሱስን ራስ-መጠሪያ ሳይተረጉም ወይም ሳያብራራ በተለመደው መልኩ ያቆያል፤ የሐረጉን ሥነ መለኮታዊ ጥልቀትና አሻሚነትም አይዘጋም።
- source_word: ποῦ
  choice: ስፍራ የለውም
  rationale: ከአሉታዊው ግስ ጋር ያለውን ‘የትም የለውም’ ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: κλίνῃ
  choice: ራሱን የሚያሳርፍበት
  rationale: ራስን ማስቀመጥን ወይም ማሳረፍን የሚያሳየውን ተጨባጭ ምስል በተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου የሚለውን የኢየሱስ ራስ-መጠሪያ መተርጎም
  choice: የሰው ልጅ
  alternative: ሰው የሆነው
  rationale: ‘የሰው ልጅ’ የቃላቱን ቅርጽ፣ የተለመደውን መጠሪያና ዳንኤል 7ን ጨምሮ ሊኖረው የሚችለውን ድምፀት ይጠብቃል። ‘ሰው የሆነው’ የሚለው አማራጭ የሐረጉን ትርጉም ከምንጩ በላይ ሊወስን ይችላል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። አጭር ተመሳሳይ አወቃቀር የቀበሮዎችንና የወፎችን መኖሪያ ከየሰው ልጅ ማረፊያ ማጣት ጋር ያለውን ንጽጽር ያጎላል።
