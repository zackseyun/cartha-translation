  text: ὁ δὲ Ἰησοῦς ⸀λέγει αὐτῷ· Ἀκολούθει μοι, καὶ ἄφες τοὺς νεκροὺς θάψαι τοὺς ἑαυτῶν νεκρούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/022.yaml
  text: But Jesus says to him[a], “Follow me, and leave the dead to bury their own dead.”
translation:
  language: am
  text: ኢየሱስ ግን፣ “ተከተለኝ፤ ሙታን[a] የራሳቸውን ሙታን እንዲቀብሩ ተዋቸው” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የመጀመሪያው “ሙታን” ብዙ ጊዜ በምሳሌያዊ ትርጉም ይወሰዳል፤ በመንፈሳዊ ሁኔታ ምላሽ የማይሰጡ ሰዎች በአካል የሞቱትን ሊቀብሩ ይችላሉ።
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: ግን
  rationale: በቀደመው ጥያቄና በኢየሱስ ምላሽ መካከል ያለውን መጠነኛ ንፅፅር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: λέγει αὐτῷ
  choice: አለው
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ ቅርጽ ቢኖረውም፣ በዘመናዊ የአማርኛ ትረካ ውስጥ “አለው” ተፈጥሯዊና ግልጽ ነው።
- source_word: Ἀκολούθει μοι
  choice: ተከተለኝ
  rationale: ቀጥተኛውን የደቀ መዝሙርነት ትእዛዝ በአጭርና በተለመደ አማርኛ ይገልጻል።
- source_word: ἄφες
  choice: ተዋቸው
  rationale: ኃላፊነቱን መተውን የሚያሳየውን ቀጥተኛ ትእዛዝ ይጠብቃል፤ የብዙ ቁጥር ተውላጠ ስምም “ሙታን”ን በግልጽ ይመለከታል።
- source_word: νεκρούς ... νεκρούς
  choice: ሙታን ... ሙታን
  rationale: በሁለቱም ቦታ ተመሳሳዩን ቃል በመጠቀም የምንጩን ሆን ተብሎ የቀረበ የቃል ጨዋታና የትርጉም ውጥረት ይጠብቃል።
- source_word: θάψαι
  choice: እንዲቀብሩ
  rationale: ከ“ተዋቸው” ጋር ተፈጥሯዊ የአማርኛ አገባብ ይፈጥራል፣ የመቅበር ድርጊቱንም በትክክል ያስተላልፋል።
- source_word: τοὺς ἑαυτῶν νεκρούς
  choice: የራሳቸውን ሙታን
  rationale: ἑαυτῶν ያለውን አጽንዖታዊ የባለቤትነት ሐሳብ “የራሳቸውን” በማለት ይጠብቃል።
theological_decisions:
- issue: በኢየሱስ ንግግር ውስጥ “ሙታን” የሚለው ትርጉም
  choice: ዋናው ጽሑፍ “ሙታን ... የራሳቸውን ሙታን” የሚለውን ተደጋጋሚ ቃል ሳይፈታ ጠብቋል።
  alternative: የመጀመሪያውን “ሙታን” “በመንፈስ የሞቱ” ብሎ በግልጽ መተርጎም።
  rationale: ግሪኩ በሁለቱም ቦታ νεκρούς የሚለውን ቃል ይጠቀማል። “በመንፈስ” ብሎ መጨመር የቃሉን ሆን የተባለ አሻሚነትና ሥነ መለኮታዊ ውጥረት ያስወግዳል፤ ስለዚህ ያ ሊሆን የሚችለው ንባብ በማስታወሻ ብቻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ታሪካዊ የአሁን ጊዜ በአማርኛ ተፈጥሯዊ የትረካ ያለፈ ጊዜ ተተርጉሟል፤ የ“ሙታን” ድግግሞሽ ግን ሙሉ በሙሉ ተጠብቋል።
