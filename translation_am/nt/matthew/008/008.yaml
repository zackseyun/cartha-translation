  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸂καὶ ἀποκριθεὶς⸃ ὁ ἑκατόνταρχος ἔφη· Κύριε, οὐκ εἰμὶ ἱκανὸς ἵνα μου ὑπὸ τὴν στέγην εἰσέλθῃς· ἀλλὰ μόνον εἰπὲ λόγῳ, καὶ ἰαθήσεται ὁ παῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/008.yaml
  text: And the centurion answered[a], “Lord, I am not worthy that you should come under my roof. But only speak a word[b], and my servant will be healed.”
translation:
  language: am
  text: መቶ አለቃውም መልሶ እንዲህ አለ፦ “ጌታ ሆይ፣ በቤቴ ጣራ ሥር እንድትገባ ብቁ አይደለሁም፤ ነገር ግን ቃል ብቻ ተናገር[a]፣ አገልጋዬም[b] ይፈወሳል።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ቃሉን ብቻ ተናገር።” ግሪኩ ቃል በቃል “ቃል ተናገር” ይላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ልጄ” ወይም “ብላቴናዬ።” የግሪኩ ቃል እንደ አውዱ ልጅን፣ ወጣትን ወይም አገልጋይን ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς … ἔφη
  choice: መልሶ … አለ
  rationale: ሁለቱን የግሪክ የንግግር መግቢያ ቅርጾች ትርጉማቸውን ሳያባዛ ተፈጥሯዊ በሆነ የአማርኛ አገላለጽ ያቀርባል።
- source_word: ἑκατόνταρχος
  choice: መቶ አለቃ
  rationale: በግምት መቶ ወታደሮችን የሚመራውን የሮማ መኮንን የሚገልጽ የተለመደና ግልጽ አማርኛ ነው።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: የአክብሮት አድራሻውንና ሊኖረው የሚችለውን ክርስቶሳዊ ክብደት ሳያስገድድ ይጠብቃል።
- source_word: οὐκ εἰμὶ ἱκανός
  choice: የሚገባኝ አይደለሁም
  rationale: በዚህ አገባብ ያለውን የብቃት እጥረት ሳይሆን የራስን ያለመገባት ስሜትና ትሕትና በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ὑπὸ τὴν στέγην
  choice: በቤቴ ጣራ ሥር
  rationale: የግሪኩን ግልጽ የጣራ ምስል ጠብቆ በአማርኛ ተረድቶ የሚነበብ አገላለጽ ነው።
- source_word: μόνον εἰπὲ λόγῳ
  choice: ቃል ብቻ ተናገር
  rationale: የμόνονን ገዳቢ ኃይልና የλόγῳን ግልጽ የ‘ቃል’ አገላለጽ ይጠብቃል።
- source_word: ἰαθήσεται
  choice: ይፈወሳል
  rationale: የወደፊት ጊዜ ተገብሮ ቅርጹንና የፈውስ ትርጉሙን በግልጽ ሁኔታ ያቀርባል።
- source_word: παῖς
  choice: አገልጋዬ
  rationale: በመቶ አለቃው ማኅበራዊ አውድና በትይዩው ትረካ መሠረት ‘አገልጋይ’ በዋና ጽሑፍ ተመርጧል፤ የቃሉ ሌሎች ትርጉሞች በማስታወሻ ተጠብቀዋል።
theological_decisions:
- issue: ኢየሱስን Κύριε ብሎ መጥራት
  choice: ጌታ ሆይ
  alternative: ጌታዬ / ክቡር ሆይ
  rationale: ‘ጌታ’ የቃሉን መሠረታዊ ትርጉምና ሊኖረው የሚችለውን ክርስቶሳዊ ጥልቀት ይጠብቃል፤ አውዱ ግን የአክብሮት አድራሻንም ሊያካትት ይችላል።
- issue: የπαῖς ትርጉም
  choice: አገልጋዬ
  alternative: ልጄ / ብላቴናዬ
  rationale: ቃሉ ልጅን፣ ወጣትን ወይም አገልጋይን ሊያመለክት ይችላል። አውዱ ‘አገልጋይ’ን ይደግፋል፤ እውነተኛው የቃል አሻሚነት ግን በማስታወሻ ተገልጿል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ የ‘ጣራ ሥር’ ምስል ተጠብቋል፤ የπαῖς አሻሚነትም በማስታወሻ ቀርቧል። በቀረበው የእንግሊዝኛ ንባብ የማስታወሻ ምልክቶቹና የማስታወሻዎቹ ይዘት ቦታ የተለዋወጠ ስለሚመስል፣ [a] ከ‘ቃል’ ጋር፣ [b] ከ‘አገልጋዬ’ ጋር እንዲዛመድ ተደርጓል።
