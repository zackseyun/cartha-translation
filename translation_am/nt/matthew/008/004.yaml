  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ὅρα μηδενὶ εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ, καὶ προσένεγκον τὸ δῶρον ὃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/004.yaml
  text: And Jesus said to him[a], “See that you tell no one, but go, show yourself to the priest, and offer the gift that Moses commanded[b], as a testimony to them.”
translation:
  language: am
  text: ኢየሱስም፣ “ለማንም እንዳትናገር ተጠንቀቅ፤ ነገር ግን ሂድ፤ ራስህን ለካህኑ አሳይ፤ ሙሴ ያዘዘውን መባ ለእነርሱ ምስክር እንዲሆን አቅርብ[a]” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይህ ትእዛዝ ከለምጽ የነጻ ሰው እንዲፈጽመው የሙሴ ሕግ ያዘዘውን ሥርዓት ያመለክታል፤ ዘሌዋውያን 14ን ይመልከቱ። ‘ለእነርሱ ምስክር’ የሚለው አነጋገር ለካህናቱ የሚቀርብ ማስረጃ ሊሆን ይችላል፤ አንዳንዶችም ለማያምኑት በእነርሱ ላይ የሚቆም ምስክር እንደሆነ ይረዱታል።
    reason: cross_reference_and_alternative_reading
lexical_decisions:
- source_word: Ὅρα μηδενὶ εἴπῃς
  choice: ለማንም እንዳትናገር ተጠንቀቅ
  rationale: Ὅρα በዚህ አገባብ የማስጠንቀቂያና የጥብቅ ትእዛዝ ኃይል አለው፤ ይህ አተረጓጎም ክልከላውን በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ὕπαγε
  choice: ሄደህ
  rationale: ከሚከተለው ትእዛዝ ጋር በተፈጥሯዊ የአማርኛ አገባብ የተያያዘ የመሄድ ትእዛዝ ነው።
- source_word: σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: ራስህን ለካህኑ አሳይ
  rationale: የግሪኩን አንጸባራቂ ግንባታ በቀጥታ ይጠብቃል፤ ካህኑ ሰውየውን የሚመረምርበትን የሙሴ ሕግ ሥርዓትም ያመለክታል።
- source_word: τῷ ἱερεῖ
  choice: ለካህኑ
  rationale: የተወሰነው መስተዋድድ በሥርዓቱ ለዚህ ተግባር የሚገባውን ካህን ያመለክታል።
- source_word: προσένεγκον τὸ δῶρον
  choice: መባ አቅርብ
  rationale: προσένεγκον በአምልኮ አገባብ ማቅረብን፣ δῶρονም ለእግዚአብሔር የሚቀርብ ስጦታን ያመለክታሉ፤ ‘መባ’ ይህን በአጭርና በተለመደ መንገድ ይገልጣል።
- source_word: ὃ προσέταξεν Μωϋσῆς
  choice: ሙሴ ያዘዘውን
  rationale: የπροστάσσωን የትእዛዝ ኃይል ይጠብቃል፣ የሙሴንም ሥልጣን ከጽሑፉ በላይ ሳያብራራ ያስተላልፋል።
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: ለእነርሱም ምስክር እንዲሆን
  rationale: የዓላማ/ውጤት ኃይሉን ያስተላልፋል፤ αὐτοῖς ማንን እንደሚያመለክትና μαρτύριον የሚደግፍ ማስረጃ ወይም በእነርሱ ላይ ምስክር መሆኑን ሳይወስን የግሪኩን ግልጽ ያልሆነ አገባብ ይጠብቃል።
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: ኢየሱስም … አለው
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ ግስ በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜ ተተርጉሟል።
theological_decisions:
- issue: የ‘ለእነርሱ ምስክር’ ተውላጠ ስም አመልካችና የምስክሩ ኃይል
  choice: ‘ለእነርሱም ምስክር እንዲሆን’ በማለት ግልጽ ያልሆነውን አገባብ መጠበቅ
  alternative: ‘ለካህናቱ ማስረጃ እንዲሆን’ ወይም ‘በእነርሱ ላይ ምስክር እንዲሆን’
  rationale: αὐτοῖς የሚያመለክተውን ቡድን ጥቅሱ በግልጽ አይለይም፤ μαρτύριονም ማስረጃን ወይም በሰዎቹ ላይ የሚቆምን ምስክር ሊያመለክት ይችላል። ትርጉሙ ይህን የጽሑፉን ውጥረት አይፈታም።
