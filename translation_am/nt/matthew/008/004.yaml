  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ካህን፣ መባ፣ ምስክር’ የሚሉት ቃላት መጽሐፍ ቅዱሳዊ ክብርን ሲጠብቁ በዘመናዊ አጠቃቀምም የሚገቡ ናቸው።
