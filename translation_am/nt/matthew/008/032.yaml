base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/032.yaml
  text: And he said to them[a], “Go.” Then they came out and went into the pigs; and behold[c][b], the whole herd rushed down the steep bank into the sea and died in the waters.
translation:
  language: am
  text: እርሱም፣ “ሂዱ!” አላቸው። እነርሱም ወጥተው ወደ አሳማዎቹ ገቡ። እነሆ፣ መንጋው ሁሉ ቁልቁለታማውን ዳገት[a] ወርዶ ወደ ባሕሩ ተምዘገዘገ፤ በውኆቹ ውስጥም ሞቱ[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በገደሉ ቁልቁል።” የግሪኩ ቃል ቁልቁለታማ ዳገትን፣ ዳርቻን ወይም ገደልን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በውኆቹ ውስጥ ሰጠሙ።” የግሪኩ ጽሑፍ በቃል በቃል፣ “በውኆቹ ውስጥ ሞቱ” ይላል።
    reason: alternative_reading
lexical_decisions:
- source_word: Ὑπάγετε
  choice: ሂዱ
  rationale: አጭሩንና ቀጥተኛውን ትእዛዝ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἐξελθόντες
  choice: ወጥተው
  rationale: ከአጋንንት የተያዙት ሰዎች መውጣታቸውን በአጭርና ተፈጥሯዊ የትረካ ቅርጽ ይገልጣል።
- source_word: ἀπῆλθον εἰς τοὺς χοίρους
  choice: ወደ እሪያዎቹ ገቡ
  rationale: አጋንንቱ ወደ እንስሳቱ መግባታቸውን በግልጽ አማርኛ ያሳያል።
- source_word: χοίρους
  choice: እሪያዎቹ
  rationale: በዘመናዊ መደበኛ አማርኛ የእንስሳው የተለመደና ግልጽ ስም ነው።
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: ቀጣዩን ድንገተኛና አስገራሚ ክስተት ትኩረት ሰጥቶ የሚያቀርበውን የግሪኩን የንግግር ኃይል ይጠብቃል።
- source_word: πᾶσα ἡ ἀγέλη
  choice: መንጋው ሁሉ
  rationale: የመንጋውን ሙሉነት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ὥρμησεν
  choice: ተምዘግዝጎ
  rationale: ድንገተኛ፣ ፈጣንና ኃይለኛ እንቅስቃሴን ያሳያል።
- source_word: κατὰ τοῦ κρημνοῦ
  choice: በገደሉ ቁልቁል
  rationale: κρημνός ሊያመለክት የሚችለውን ቁልቁለታማ ዳገት፣ ዳርቻ ወይም ገደል ሙሉ በሙሉ ቋሚ ገደል ነው ብሎ ሳይወስን ያስተላልፋል።
- source_word: θάλασσαν
  choice: ባሕሩ
  rationale: የግሪኩን ‘ባሕር’ በቀጥታ ይጠብቃል፤ ‘ሐይቅ’ የሚል ጂኦግራፊያዊ ማብራሪያ በዋናው ጽሑፍ ላይ አይጨምርም።
- source_word: ἀπέθανον ἐν τοῖς ὕδασιν
  choice: በውኃው ውስጥ ሞተ
  rationale: ምንጩ በቀጥታ ‘በውኆቹ ውስጥ ሞቱ’ ይላል፤ ‘ሰጠሙ’ የሚለውን ከአውዱ የሚገኝ ትርጓሜ በዋናው ጽሑፍ አይጨምርም።
theological_decisions:
- issue: የመንጋውን ሞት ምክንያት የመግለጽ ደረጃ
  choice: ‘በውኃው ውስጥ ሞተ’ የሚለውን የምንጩን አነጋገር መጠበቅ
  alternative: ‘በውኃው ውስጥ ሰጠመ’
  rationale: አውዱ መስጠማቸውን በጽኑ ቢያመለክትም፣ የግሪኩ ግስ በቀጥታ ‘ሞቱ’ ይላል። ይህን መጠበቅ ትርጉማዊ ማብራሪያን ከዋናው ጽሑፍ አያዋህድም።
