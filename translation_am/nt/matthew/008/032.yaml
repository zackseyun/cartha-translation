review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the command, the demons’ exit and entry into the pigs, the vivid marker ἰδού, the movement down a steep descent, the sea, and the non-interpretive wording that they died rather than explicitly drowned. However, its final verb is singular (ሞተ), whereas ἀπέθανον is plural and refers to the individual pigs. The form ተምዘግዝጎ is also not a suitable finite narrative verb in this sentence.
  naturalness: The wording is generally clear, but አሳማዎቹ is the more ordinary modern standard Amharic term for “pigs.” Recasting the descent with a finite verb produces a fluent narrative sentence.
  terminology: Use አሳማ for χοῖρος in the main text. Retain ባሕር for θάλασσα and ሞቱ for ἀπέθανον, without making drowning explicit in the text.
  issues:
  - severity: medium
    issue: 'The final verb is singular: “ሞተ.”'
    rationale: Greek ἀπέθανον is plural. Though ὥρμησεν treats the herd collectively as singular, the death verb refers to the pigs as plural; Amharic should reflect this with ሞቱ.
  - severity: medium
    issue: “ተምዘግዝጎ” is not an appropriate finite verb form here.
    rationale: The Greek has a finite narrative verb, ὥρμησεν. “ተምዘገዘገ” gives a natural finite Amharic rendering of the herd’s sudden rushing movement.
  - severity: low
    issue: “እሪያዎቹ” is less natural for modern general readership than “አሳማዎቹ.”
    rationale: “አሳማ” is the ordinary modern standard Amharic designation and retains the source meaning without interpretive change.
