- source_word: προσῆλθεν αὐτῷ
  choice: ወደ እርሱ ቀርቦ
  rationale: προσέρχομαι ወደ አንድ ሰው መቅረብን ወይም መምጣትን ያመለክታል፤ «ቀርቦ» የትረካውን ቅደም ተከተል በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἑκατόνταρχος
  choice: የመቶ አለቃ
  rationale: ይህ ቃል በሮም ሠራዊት ውስጥ ያለውን የተወሰነ የወታደራዊ አዛዥነት ማዕረግ ይጠቅሳል፤ «የመቶ አለቃ» ትክክለኛና ለአማርኛ አንባቢ የታወቀ አቻ ነው።
- source_word: παρακαλῶν αὐτὸν
  choice: ለመነው
  rationale: በዚህ አውድ παρακαλέω ከሚቀጥለው ጥያቄ ጋር የተያያዘ ትጉህ ልመናን ያሳያል፤ «ለመነው» ከልክ ያለፈ ስሜታዊነትን ሳይጨምር ይህን ያስተላልፋል።
