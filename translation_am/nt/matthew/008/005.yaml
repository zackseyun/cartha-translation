  choice: እርሱም … በገባ ጊዜ
  rationale: የግሪኩ አኦሪስት ክፍለ ግስ የጊዜ ግንኙነቱን ያሳያል፤ «በገባ ጊዜ» ድርጊቱ በፊት ወይም በትክክል በተመሳሳይ ቅጽበት እንደሆነ ከልክ በላይ ሳይወስን በተፈጥሯዊ አማርኛ ያቀርበዋል።
- source_word: εἰς Καφαρναοὺμ
  choice: ወደ ቅፍርናሆም
