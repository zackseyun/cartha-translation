  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የንግግር ቅደም ተከተል በአማርኛ ተፈጥሯዊ እንዲሆን የምክንያቱ ክፍል ከጥያቄው በፊት ቀርቧል።
