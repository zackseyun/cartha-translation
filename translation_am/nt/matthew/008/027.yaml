  naturalness: The proposed revision uses a natural modern Amharic relative-clause construction and keeps the question rhetorically unified. “ተደንቀው … አሉ” is suitable narrative Amharic.
  terminology: “ምን ዓይነት ሰው” suitably renders Ποταπός, and “ለእርሱ የሚታዘዙ” clearly conveys personal obedience without adding doctrinal interpretation. “ባሕር” retains standard biblical-register spelling while remaining readily understood.
