  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ προσελθὼν εἷς γραμματεὺς εἶπεν αὐτῷ· Διδάσκαλε, ἀκολουθήσω σοι ὅπου ἐὰν ἀπέρχῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/019.yaml
  text: And one scribe came up and said to him[a], “Teacher, I will follow you wherever you go.”
translation:
  language: am
  text: አንድ ጻፍ ቀርቦ፣ “መምህር ሆይ፣ ወዴት ብትሄድ[a] እከተልሃለሁ” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወዴት ብትሄድ ወይም ብትሄድ ትለይ።” የግሪኩ ግስ በተለይ “መሄድ” ወይም “መለየት” ሳይሆን “መሄድ ወይም መውጣት/መሄድ መራቅ” የሚለውን ሊያመለክት ይችላል፤ እዚህ ግን “መሄድ” ተፈጥሯዊ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: ቀርቦ
  rationale: የግሪኩ የቀደመ ድርጊት ኢየሱስን መቅረቡን ያመለክታል፤ “ቀርቦ” በአማርኛ ተፈጥሯዊና አጭር ነው።
- source_word: εἷς γραμματεὺς
  choice: ከጻፎችም አንዱ
  rationale: εἷς ያለውን “አንዱ” የሚለውን ልዩነት ይጠብቃል፤ γραμματεύς ደግሞ በወንጌላት የተለመደውን የሕግ ጸሐፊና ተርጓሚ ማዕረግ “ጻፍ” በሚለው ቃል ያቀርባል።
- source_word: Διδάσκαλε
  choice: መምህር ሆይ
  rationale: ቀጥተኛውን የአድራሻ ቅርጽና የδιδάσκαλοςን መሠረታዊ ትርጉም ይጠብቃል።
- source_word: ἀκολουθήσω σοι
  choice: እከተልሃለሁ
  rationale: የወደፊት ጊዜ ቃል ኪዳናዊ አወቃቀሩን፣ እንዲሁም አካላዊ መከተልና ደቀ መዝሙርነት የሚያስተጋባውን ሁለትዮሽ ስሜት ይጠብቃል።
- source_word: ὅπου ἐὰν ἀπέρχῃ
  choice: ወደምትሄድበት ሁሉ
  rationale: ὅπου ἐὰν ያለውን ያልተወሰነ ስፋት በተፈጥሯዊ አማርኛ ይገልጻል፤ ἀπέρχῃ የመሄድ ወይም የመለየት ልዩ ጥላ ሊኖረው ስለሚችል በማስታወሻ ተጠቅሷል።
theological_decisions:
- issue: διδάσκαλος ለኢየሱስ እንደ ማዕረግ መተርጎም
  choice: መምህር
  alternative: ጌታ፤ ረቢ
  rationale: ግሪኩ በቀጥታ “አስተማሪ/መምህር” ይላል። “ጌታ” የሌለውን ተጨማሪ ሥልጣናዊ ወይም ክርስቶሎጂያዊ ክብደት ሊያስገባ ይችላል፤ “ረቢ” ደግሞ በዚህ ቦታ ያልተጠቀሰ የዕብራይስጥ ማዕረግ ነው።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ጻፍ” የዘመኑን የአይሁድ ሕግ ሊቅ ማዕረግ በባህላዊ መጽሐፍ ቅዱሳዊ ቃል ያቀርባል።
