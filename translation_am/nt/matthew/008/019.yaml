    issue: “ከጻፎችም አንዱ” introduces a partitive sense.
    rationale: The Greek says εἷς γραμματεύς, “one/a scribe,” not “one of the scribes.” “አንድ ጻፍ” preserves the indefinite individual.
  - severity: medium
    issue: The footnote renders the alternative sense of ἀπέρχῃ as “መለየት.”
    rationale: In this context ἀπέρχομαι can have the more specific sense “go away/depart”; “separate” is not an appropriate lexical alternative. The anchor should also follow the phrase it annotates.
