  text: καὶ εἶπεν ὁ Ἰησοῦς τῷ ἑκατοντάρχῃ· Ὕπαγε, ⸀ὡς ἐπίστευσας γενηθήτω σοι· καὶ ἰάθη ὁ ⸀παῖς ἐν τῇ ὥρᾳ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/013.yaml
  text: And Jesus said to the centurion[a], “Go; as you have believed, let it be done for you.” And the servant was healed in that hour.
translation:
  language: am
  text: ኢየሱስም ለመቶ አለቃው፣ “ሂድ፤ እንዳመንኸው ይሁንልህ” አለው። አገልጋዩም[a] በዚያው ሰዓት ተፈወሰ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ልጁ” ወይም “ወጣቱ”፤ የግሪክ ቃሉ παῖς አገልጋይን ወይም ወጣት ሰውን ሊያመለክት ይችላል። በዚህ አውድ “አገልጋይ” የመቶ አለቃው የበታች የሆነውን ሰው በተሻለ ሁኔታ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: የመቶ አለቃውን
  rationale: የሮማን ወታደራዊ ሹምነት ትርጉም በግልጽና በተለመደ የአማርኛ አገላለጽ ያስተላልፋል።
- source_word: Ὕπαγε
  choice: ሂድ
  rationale: የመሄድ ትእዛዙን ያለ ተጨማሪ ፍቺ በቀጥታ ያስተላልፋል።
- source_word: ὡς ἐπίστευσας
  choice: እንዳመንኸው
  rationale: የግሱን ግላዊ እምነትና ὡς የሚያሳየውን መመሳሰል ይጠብቃል፤ የታመነውን ይዘት የሚወክለው -ው በአማርኛ አገላለጹን ተፈጥሯዊ ያደርገዋል።
- source_word: γενηθήτω σοι
  choice: ይሁንልህ
  rationale: የትእዛዝ/ፈቃድ ኃይልንና σοι የሚያመለክተውን ‘ለአንተ’ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: παῖς
  choice: አገልጋዩ
  rationale: በአውዱ የመቶ አለቃውን የበታች ሰው ያመለክታል፤ ቃሉ ‘ልጅ’ ወይም ‘ወጣት’ ሊል የሚችለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ἰάθη
  choice: ተፈወሰ
  rationale: የἰάομαιን ተገብሮ የመፈወስ ፍቺ በመደበኛ መጽሐፍ ቅዱሳዊ አማርኛ ያስተላልፋል።
- source_word: ἐν τῇ ὥρᾳ ἐκείνῃ
  choice: በዚያው ሰዓት
  rationale: የጊዜውን አፋጣኝነት ያሳያል፤ ‘በዚያ ቅጽበት’ ብሎ ከግሪኩ በላይ ትክክለኛ ቅጽበትን አያስገድድም።
theological_decisions:
- issue: የπιστεύω አተረጓጎም
  choice: እንዳመንኸው
  alternative: እንደታመንኸው / እንደ እምነትህ
  rationale: ግሪኩ የእምነትን ድርጊት በግስ ስለሚገልጥ፣ ‘አመንክ’ የሚለው ቅርጽ ያንን ግላዊ የግስ ኃይል ይጠብቃል፤ ወደ ስም ቅርጽ ‘እንደ እምነትህ’ መቀየርን ያስወግዳል።
- issue: ፈውሱና የመቶ አለቃው እምነት ያላቸው ግንኙነት
  choice: “እንዳመንኸው ይሁንልህ” የሚለውን ቅርጽ መጠበቅ
  alternative: “በእምነትህ መጠን ይደረግልህ”
  rationale: ὡς የሚፈቅደውን የአገናኝነት ፍቺ ይጠብቃል፤ እምነትን በደረጃ የሚለካ መርህ እንደሆነ በትርጉም አይጨምርም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። “የመቶ አለቃ” እና “ተፈወሰ” የታወቁ መጽሐፍ ቅዱሳዊ ቃላት ሲሆኑ አሁንም በቀላሉ የሚገቡ ናቸው።
