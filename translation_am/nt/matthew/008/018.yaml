  text: Ἰδὼν δὲ ὁ Ἰησοῦς ⸂πολλοὺς ὄχλους⸃ περὶ αὐτὸν ἐκέλευσεν ἀπελθεῖν εἰς τὸ πέραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/018.yaml
  text: When Jesus saw many crowds around him, he gave orders to go to the other side.
translation:
  language: am
  text: ኢየሱስም በዙሪያው ብዙ ሕዝብ እንዳለ ባየ ጊዜ፣ ወደ ማዶ ለመሄድ ትእዛዝ ሰጠ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: ባየ ጊዜ …ም
  rationale: የግሪኩን የጊዜ ግንኙነትና δέ የሚያሳየውን ቀላል የትረካ ቅጥያ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: πολλοὺς ὄχλους
  choice: ብዙ ሕዝብ
  rationale: ቃል በቃል ‘ብዙ ሕዝቦች’ ማለት በአማርኛ እንግዳ ስለሚሰማ፣ ብዛቱን የሚጠብቅ ተፈጥሯዊ የጋራ ስም ተመርጧል።
- source_word: περὶ αὐτόν
  choice: በዙሪያው
  rationale: ሕዝቡ ኢየሱስን ከቦት እንደነበር በግልጽና ተፈጥሯዊ አገላለጽ ያስተላልፋል።
- source_word: ἐκέλευσεν
  choice: አዘዘ
  rationale: ግሱ ትእዛዝ መስጠትን በቀጥታ ያመለክታል።
- source_word: ἀπελθεῖν εἰς τὸ πέραν
  choice: ወደ ማዶ እንዲሄዱ
  rationale: የመነሳትን/የመሻገርን አቅጣጫ ያቆያል፤ በአውዱ ተዋናዩ ኢየሱስና ደቀ መዛሙርቱ መሆናቸውን በብዙ ቁጥር ያሳያል።
theological_decisions:
- issue: የἀπελθεῖν ያልተገለጸ ተዋናይ
  choice: እንዲሄዱ
  alternative: እንዲሄድ
  rationale: ግሪኩ የግሱን ተዋናይ በግልጽ አይጠቅስም፤ አውዱ ግን ትእዛዙ በጀልባው ለሚጓዙት ወገኖች መሆኑን ያመለክታል። ብዙ ቁጥር መጠቀሙ ኢየሱስ ብቻውን እንደሄደ የሚያስመስል ንባብን ይከላከላል፣ ነገር ግን ተቀባዮቹን ከምንጩ በላይ አይሰይምም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ የትረካ አማርኛ። ‘ብዙ ሕዝብ’ የሚለው በግሪኩ ያለውን ብዛት በተፈጥሯዊ የአማርኛ የጋራ ስም ያቀርባል።
