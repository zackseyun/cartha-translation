  to: ኢየሱስም በዙሪያው ብዙ ሕዝብ እንዳለ ባየ ጊዜ፣ ወደ ማዶ ለመሄድ ትእዛዝ ሰጠ።
  rationale: The revision retains the natural collective expression ብዙ ሕዝብ for πολλοὺς ὄχλους and preserves the narrative force of Ἰδὼν δέ. It replaces the explicitly plural እንዲሄዱ with ለመሄድ, preserving the Greek infinitive’s unspecified subject and aligning with the English audit trail’s noncommittal “to go.”
