  text: እርሱም፣ “እኔ መጥቼ እፈውሰዋለሁ” አለው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “መጥቼ ልፈውሰው?” አንዳንድ ተርጓሚዎች ከዐውደ ንባቡ በመነሣት የኢየሱስን ቃል እንደ ጥያቄ ይወስዱታል፤ የግሪኩ አነጋገር ራሱ ግን በተፈጥሮ እንደ መግለጫ ይነበባል።
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: -ም
  rationale: ቀላል የትረካ አያያዥ ስለሆነ፣ በአማርኛ በግሱ ተያይዞ ያለው “-ም” የጊዜ ወይም የምክንያት ሐሳብ ሳይጨምር ግንኙነቱን ይጠብቃል።
- source_word: λέγει
  choice: አለው
  rationale: ግሪኩ ታሪካዊ የአሁን ጊዜን ቢጠቀምም፣ በተፈጥሯዊ የአማርኛ ትረካ “አለው” ይበልጥ ግልጽና የተለመደ ነው።
- source_word: αὐτῷ
  choice: -ው
  rationale: በ“አለው” ውስጥ ያለው የሦስተኛ መደብ ተሳቢ ቅጥያ ንግግሩ ለእርሱ መነገሩን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Ἐγὼ
  choice: እኔ (በግሱ ውስጥ የተካተተ)
  rationale: የመጀመሪያ መደብ ተናጋሪው “መጥቼ እፈውሰዋለሁ” በሚሉት ግሶች ግልጽ ነው፤ “እኔ”ን ለብቻው መጨመር በአማርኛ ከግሪኩ ይልቅ ከባድ አጽንዖት ሊፈጥር ይችላል።
- source_word: ἐλθὼν
  choice: መጥቼ
  rationale: ቀድሞ የሚፈጸመውን ወይም ከዋናው ድርጊት ጋር ተያይዞ የሚከናወነውን መምጣት በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: θεραπεύσω
  choice: እፈውሰዋለሁ
  rationale: በዚህ የሕመም አውድ θεραπεύω የሚለውን “መፈወስ” በትክክል ይገልጻል፤ የወደፊት ጊዜውም ተጠብቋል።
- source_word: αὐτόν
  choice: -ዋ-
  rationale: በ“እፈውሰዋለሁ” ውስጥ ያለው ተሳቢ ቅጥያ የታመመውን ወንድ አገልጋይ ያመለክታል።
