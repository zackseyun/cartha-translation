id: MAT.8.12
reference: Matthew 8:12
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οἱ δὲ υἱοὶ τῆς βασιλείας ἐκβληθήσονται εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/012.yaml
  text: But the sons of the kingdom will be cast out into the outer darkness[c][b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: am
  text: ነገር ግን የመንግሥቱ ልጆች ወደ ውጭው ጨለማ ይጣላሉ። በዚያም ልቅሶና ጥርስ ማፋጨት ይሆናል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: υἱοὶ τῆς βασιλείας
  choice: የመንግሥቱ ልጆች
  rationale: የግሪኩን የዝምድና ፈሊጥ በአማርኛ ተፈጥሯዊ በሆነ መልኩ ይጠብቃል፤ በዐውዱም የመንግሥቱ ተገቢ ወራሾች ወይም አባላት እንደሆኑ የተቈጠሩትን ያመለክታል።
- source_word: ἐκβληθήσονται
  choice: ይጣላሉ
  rationale: የወደፊት ጊዜ ተደራጊ ቅርጹንና የኃይል ማስወጣት ስሜቱን በአጭርና ግልጽ አማርኛ ያስተላልፋል።
- source_word: τὸ σκότος τὸ ἐξώτερον
  choice: ውጭው ጨለማ
  rationale: በማቴዎስ የሚገኘውን የፍርድ ምስል ሳይተረጉም በቅርብ ይጠብቃል።
- source_word: κλαυθμός
  choice: ልቅሶ
  rationale: ኀዘንና ዋይታን የሚገልጽ ክቡርና የተለመደ አማርኛ ነው።
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: ጥርስ ማፋጨት
  rationale: የግሪኩን የተለመደ አገላለጽ በተፈጥሯዊና በሚታወቅ አማርኛ ያቀርባል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከቀደመው ቁጥር ጋር ያለውን ግልጽ ንፅፅር ያሳያል።
- source_word: ἐκεῖ
  choice: በዚያም
  rationale: የፍርዱን ስፍራ ግልጽ አድርጎ ይጠብቃል፤ ከቀጣዩ ሐረግም ጋር ተፈጥሯዊ ይያያዛል።
theological_decisions:
- issue: የመገለልና የፍርድ ምስሉ
  choice: “ወደ ውጭው ጨለማ ይጣላሉ” እና “ልቅሶና ጥርስ ማፋጨት” የሚሉትን ተጨባጭ ምስሎች መጠበቅ
  alternative: “ወደ ሲኦል” ወይም “ወደ ዘላለማዊ ቅጣት” ብሎ በትርጓሜ መተካት
  rationale: ግሪኩ ከባድ የፍርድና የመገለል ሁኔታን ይገልጻል፤ ነገር ግን በዚህ ቁጥር የሚጠቀመው ምሳሌያዊ ቋንቋ እንጂ “ሲኦል” የሚለውን ቃል አይደለም።
- issue: የυἱοὶ ፈሊጣዊ ትርጉምና ፆታ
  choice: “ልጆች” ብሎ መተርጎም
  alternative: “ወንዶች ልጆች” ወይም “ወራሾች”
  rationale: በአማርኛ “የመንግሥቱ ልጆች” የሚለው የግሪኩን ፈሊጣዊ አባልነትና የተጠባቂ ውርስ ሐሳብ በተፈጥሯዊ ሁኔታ ይይዛል፤ “ወንዶች ልጆች” ማለት በዐውዱ ያልተፈለገ የፆታ ገደብ ሊያስገባ ይችላል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር መደበኛ አማርኛ። የፍርድ ምስሎቹ ሳይለዝቡ ተጠብቀዋል፤ ከጽሑፉ በላይ የሆነ የሥነ መለኮት ማብራሪያ አልገባም።
