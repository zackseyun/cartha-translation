  choice: እነሆ
  rationale: የተራኪውን ትኩረት ጠሪ ምልክትና የትረካውን ሕያውነት ይጠብቃል።
- source_word: πᾶσα ἡ πόλις
  choice: የከተማው ሰዎች ሁሉ
  rationale: የግሪኩ አገላለጽ ከተማዋን እንደ ሕዝቧ በጥቅል ያመለክታል፤ ይህ ትርጉም በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: ἐξῆλθεν
  choice: ወጡ
  rationale: ከከተማው ወደ ውጭ የተደረገውን እንቅስቃሴ በቀጥታ ያሳያል።
- source_word: εἰς ὑπάντησιν τῷ Ἰησοῦ
  choice: ኢየሱስን ሊገናኙት
  rationale: ዓላማን የሚገልጠውን የግሪክ ፈሊጥ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἰδόντες αὐτὸν
  choice: ባዩትም ጊዜ
  rationale: የአኦሪስት ተሳቢውን ጊዜያዊ ግንኙነትና የድርጊቶቹን ቅደም ተከተል ይጠብቃል።
- source_word: παρεκάλεσαν
  choice: ለመኑት
  rationale: ተራ ጥያቄን ሳይሆን አጥብቆ መጠየቅን ያሳያል።
- source_word: ὅπως μεταβῇ
  choice: እንዲሄድላቸው
  rationale: የልመናቸውን ይዘት በተፈጥሯዊ አማርኛ ይገልጣል፤ የመሄዱ አቅጣጫ በ‘ከአገራቸው’ ተገልጧል።
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: ከአገራቸው
  rationale: ὅρια በቃል ደረጃ ‘ድንበሮች’ ሊሆን ቢችልም፣ እዚህ የሚያመለክተው በድንበሮቹ የተከለለውን ክልል ነው፤ ‘አገር’ በዚህ አውድ አካባቢያቸውን በተፈጥሯዊ ሁኔታ ያመለክታል።
theological_decisions:
