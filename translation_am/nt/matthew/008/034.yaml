  rationale: የግሪኩ ጽሑፍ የሰዎቹን ዓላማ በግልጽ አይናገርም፤ ስለዚህ ትርጉሙ የትረካውንና የሥነ መለኮት ውጥረት ሳይፈታ ይጠብቃል።
