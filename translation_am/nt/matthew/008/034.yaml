base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/034.yaml
  text: And behold[a], the whole city went out to meet Jesus, and when they saw him, they begged him to depart from their region.
translation:
  language: am
  text: እነሆ፣ የከተማው ሰዎች ሁሉ ኢየሱስን ሊገናኙት ወጡ፤ ባዩትም ጊዜ ከአካባቢያቸው[a] እንዲሄድ ለመኑት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከክልላቸው”፤ ቃል በቃል፣ “ከድንበሮቻቸው።”
    reason: lexical_alternative
lexical_decisions:
