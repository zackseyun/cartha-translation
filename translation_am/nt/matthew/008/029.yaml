base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/029.yaml
  text: And behold[a], they cried out, saying, “What have we to do with you[b], Son of God? Have you come here before the appointed time to torment us?”
translation:
  language: am
  text: እነሆም፣ “የእግዚአብሔር ልጅ ሆይ፣ ከአንተ ጋር ምን አገናኘን?[a] ከተወሰነው ጊዜ በፊት[b] ልታሠቃየን ወደዚህ መጣህን?” ብለው ጮኹ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በቀጥታ፣ “በእኛና በአንተ መካከል ምን አለ?” ይህ አነጋገር መራራቅን ወይም ተቃውሞን ይገልጣል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ከጊዜው በፊት።” የግሪኩ ቃል በእግዚአብሔር የተወሰነን ጊዜ ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: እነሆም
  rationale: የትረካውን ድንገተኛነትና ትኩረት ሰጪ ኃይል በተለመደ የመጽሐፍ ቅዱስ አማርኛ ይጠብቃል።
- source_word: ἔκραξαν λέγοντες
  choice: ብለው ጮኹ
  rationale: κράζω የከፍተኛ ድምፅ ጩኸትን ያመለክታል፤ የλέγοντες ትርጉምም በተፈጥሯዊው የአማርኛ ንግግር አወቃቀር ‘ብለው’ ተጠብቋል።
- source_word: Τί ἡμῖν καὶ σοί
  choice: ከአንተ ጋር ምን አለን?
  rationale: የመራራቅን ወይም የተቃውሞን ስሜት የሚገልጠውን ሴማዊ/ግሪካዊ ፈሊጥ በአንጻራዊ ቅርበት ይይዛል፤ ከልክ በላይ ትርጓሜ አይጨምርም።
- source_word: υἱὲ τοῦ θεοῦ
  choice: የእግዚአብሔር ልጅ ሆይ
  rationale: ለኢየሱስ በቀጥታ የቀረበውን ክርስቶሎጂያዊ ማዕረግና የጥሪ ቅርጽ ይጠብቃል።
- source_word: ἦλθες ὧδε
  choice: ወደዚህ መጣህን?
  rationale: ὧδε ያለውን የቦታ አመልካች በግልጽ ያስተላልፋል፤ የጥያቄውንም ኃይል በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: πρὸ καιροῦ
  choice: ጊዜው ሳይደርስ
  rationale: በአውዱ ያለውን ቀድሞ መምጣት በተፈጥሯዊ አማርኛ ይገልጣል፤ καιρός የተወሰነ ወይም የተመደበ ጊዜን ሊያመለክት መቻሉ በማስታወሻ ተገልጿል።
- source_word: βασανίσαι ἡμᾶς
  choice: ልታሠቃየን
  rationale: በፍርድ አውድ ያለውን ከባድ ሥቃይ በግልጽና ተለምዶ በሚገባ ቃል ያስተላልፋል።
theological_decisions:
- issue: አጋንንቱ የኢየሱስን ማንነት መገንዘባቸው
  choice: የእግዚአብሔር ልጅ
  alternative: የአምላክ ልጅ
  rationale: ግሪኩ የሚሰጠውን ቀጥተኛ ማዕረግ ያለ ማዳከም ወይም ማስፋት ይጠብቃል፤ ‘እግዚአብሔር’ በአማርኛ መጽሐፍ ቅዱሳዊ ንግግር ውስጥ የተለመደና የተከበረ ነው።
- issue: የκαιρός የፍጻሜ ዘመን ፍንጭ
  choice: ጊዜው ሳይደርስ
  alternative: ከተወሰነው ጊዜ በፊት
  rationale: የተወሰነ ጊዜ መኖሩን በተፈጥሯዊ አማርኛ ይጠቁማል፤ ጊዜውን ማን እንደወሰነው ግን ጽሑፉ ከሚለው በላይ አይገልጽም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛ ተጠቅሟል። ‘እነሆ’ ትንሽ ባህላዊ ቢሆንም የἰδούን የትኩረትና የድንገተኛነት ኃይል ስለሚጠብቅ ተመርጧል።
