  yaml_path: translation/nt/matthew/008/001.yaml
  text: When he came down from the mountain[a], large crowds followed him.
translation:
  language: am
  text: እርሱም ከተራራው በወረደ ጊዜ፣ ብዙ ሕዝብ ተከተለው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καταβάντος δὲ αὐτοῦ
  choice: እርሱም ... በወረደ ጊዜ
  rationale: የግሪኩ የgenitive absolute አወቃቀር በአማርኛ ተፈጥሯዊ በሆነ የጊዜ ንዑስ አረፍተ ነገር ተተርጉሟል፤ δέ ደግሞ ቀላል የትስስር ምልክት ስለሆነ «-ም» በሚለው ቅጥያ ተወክሏል።
- source_word: ἀπὸ τοῦ ὄρους
  choice: ከተራራው
  rationale: ὄρος በዚህ ዐውደ ንባብ ከቀደመው ትረካ ጋር የሚያያዘውን የተወሰነ ተራራ ያመለክታል።
- source_word: ἠκολούθησαν αὐτῷ
  choice: ተከተለው
  rationale: ἀκολουθέω በትረካው ውስጥ አንድን ሰው ተከትሎ መሄድን ያመለክታል፤ ነጠላው «ሕዝብ» የብዙ ሰዎች ስብስብ ቢሆንም በሰዋስው ነጠላ ግስ ይወስዳል።
- source_word: ὄχλοι πολλοί
  choice: ብዙ ሕዝብ
  rationale: የግሪኩ ብዙ ቁጥር ὄχλοι እና πολλοί ብዛትን ያጎላሉ፤ «ብዙ ሕዝብ» በዘመናዊ አማርኛ ተፈጥሯዊና ለብዙ ሰዎች ስብስብ ግልጽ ነው።
