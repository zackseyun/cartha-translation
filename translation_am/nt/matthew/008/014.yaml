  choice: ሴቲቱ የጴጥሮስ አማት መሆኗን በስሙ ግልጽ ማድረግ
  alternative: ‘አማቱን’ ብሎ ብቻ መተርጎም፣ ይህም በአማርኛ ኢየሱስን የሚያመለክት መስሎ ሊያሻማ ይችላል
  rationale: የግሪኩ አወቃቀርና ዐውዱ ተውላጠ ስሙ ጴጥሮስን እንደሚያመለክት ያሳያሉ፤ ስሙን መድገም የአማርኛን ግራ መጋባት ያስወግዳል እንጂ ተጨማሪ ዶክትሪናዊ መደምደሚያ አያክልም።
