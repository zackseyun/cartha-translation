  text: And when Jesus came into Peter’s house[b][a], he saw his mother-in-law lying down and having a fever.
translation:
  language: am
  text: ኢየሱስም ወደ ጴጥሮስ ቤት በገባ ጊዜ፣ የጴጥሮስን አማት ተኝታ ትኩሳት ይዟት ያለችውን አየ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν
  choice: በመጣ ጊዜ
  rationale: የግሡን ጊዜያዊ ቅደም ተከተል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οἰκίαν Πέτρου
  choice: ወደ ጴጥሮስ ቤት
  rationale: የባለቤትነት ግንኙነቱን በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: πενθερὰν αὐτοῦ
  choice: የጴጥሮስን አማት
  rationale: አማት የሚለው ዘመናዊ የዝምድና ቃል ሲሆን፣ ተውላጠ ስሙ ጴጥሮስን እንደሚያመለክት በግልጽ ያሳያል።
- source_word: βεβλημένην
  choice: ተኝታ
  rationale: በሕመም ምክንያት ተኝታ ያለችበትን ሁኔታ ይገልጣል፤ በግሪኩ በግልጽ ያልተጠቀሰውን ‘አልጋ ላይ’ አይጨምርም።
- source_word: πυρέσσουσαν
  choice: ትኩሳት ይዟት
  rationale: ቀጣይ የሕመም ሁኔታዋን በተለመደና ግልጽ ዘመናዊ አማርኛ ያቀርባል።
theological_decisions:
