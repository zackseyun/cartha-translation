  yaml_path: translation/nt/matthew/008/015.yaml
  text: And he touched her hand, and the fever left her, and she got up and began serving him.
translation:
  language: am
  text: እጇንም ዳሰሰ፤ ትኩሳቱም ለቀቃት፤ እርሷም ተነሥታ አገለገለችው[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እርሱን ማገልገል ጀመረች።” የግሪኩ የግስ ቅርጽ ቀጣይ ድርጊትን ብቻ ሊገልጽ ይችላል፤ ማገልገል መጀመሯንም ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥψατο
  choice: ዳሰሰ
  rationale: በዚህ የፈውስ አውድ የግሪኩን ‘ነካ/ንክኪ አደረገ’ ትርጉም በተፈጥሯዊና ክብር ባለው አማርኛ ያስተላልፋል፤ እጇን አጥብቆ እንደያዘ አያመለክትም።
- source_word: τῆς χειρὸς αὐτῆς
  choice: እጇን
  rationale: χείρ በቀጥታ ‘እጅ’ ማለት ነው፤ ከἅπτομαι ጋር ያለውን የግሪክ የዘር ቅጽ አማርኛ በተፈጥሮ ቀጥተኛ ተሳቢ አድርጎ ይገልጠዋል።
- source_word: ἀφῆκεν αὐτὴν ὁ πυρετός
  choice: ትኩሳቱም ለቀቃት
  rationale: የግሪኩን ሰውኛ አገላለጽ በተፈጥሯዊ አማርኛ ይጠብቃል፤ ትኩሳቱ ከእርሷ እንደራቀ ያሳያል።
- source_word: πυρετός
  choice: ትኩሳት
  rationale: ስሙ በቀጥታ ትኩሳትን ያመለክታል፤ ምንጩ ያልገለጸውን ተጨማሪ የሕመም ዓይነት አይጨምርም።
- source_word: ἠγέρθη
  choice: ተነሥታ
  rationale: በቅርብ አውዱ ከታመመችበት መነሣቷን በመደበኛ ትርጉም ያሳያል፤ እዚህ ያልተጠየቀ የትንሣኤ አንድምታ አያስገባም።
- source_word: διηκόνει αὐτῷ
  choice: አገለገለችው
  rationale: διακονέω በዚህ የቤት አውድ ‘ማገልገል’ ማለት ነው። ያልተፈጥሯዊ የቃል በቃል አገላለጽን ሳይጠቀም ድርጊቱን በግልጽ ያቀርባል።
theological_decisions:
- issue: ἠγέρθη የትንሣኤ አንድምታ እንዳይጫንበት
  choice: ተነሥታ
  alternative: ከሞት ተነሣች / ተነሥታ ቆመች
  rationale: የታሪኩ ቅርብ አውድ ከትኩሳቷ ከተፈወሰች በኋላ ከተኛችበት መነሣቷን ያመለክታል፤ የትንሣኤ ትምህርትን እዚህ ማስገባት አይገባም።
- issue: የδιηκόνει ኢምፐርፌክት ገጽታ
  choice: አገለገለችው
  alternative: ማገልገል ጀመረች
  rationale: የግሪኩ ኢምፐርፌክት ቀጣይ ድርጊትን ሊገልጽ ይችላል፣ ግን መጀመርን በግድ አያመለክትም። ዋናው ጽሑፍ ቀላል ያለፈ ጊዜን ይጠቀማል፤ አማራጩ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ሦስት ተከታታይ ድርጊቶች በሴሚኮሎን ተለይተው የትረካው ፍሰት ተጠብቋል። የግስ ቅርጹ ማገልገል መጀመሯን በግድ ስለማይገልጽ ዋናው ጽሑፍ ‘አገለገለችው’ ይላል፣ አማራጩም በ[a] ተጠቅሷል።
