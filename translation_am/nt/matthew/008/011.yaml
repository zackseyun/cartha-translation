  text: λέγω δὲ ὑμῖν ὅτι πολλοὶ ἀπὸ ἀνατολῶν καὶ δυσμῶν ἥξουσιν καὶ ἀνακλιθήσονται μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/011.yaml
  text: But I tell you that many will come from east and west and will recline at table with Abraham and Isaac and Jacob in the kingdom of heaven[a][b].
translation:
  language: am
  text: እኔ ግን እላችኋለሁ፤ ብዙዎች ከምሥራቅና ከምዕራብ ይመጣሉ፤ በሰማያት መንግሥትም ከአብርሃም፣ ከይስሐቅና ከያዕቆብ ጋር በማዕድ ይቀመጣሉ[a][b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ «ተደግፈው ይቀመጣሉ»፤ ይህ አገላለጽ በጥንት ዘመን በግብዣ ማዕድ ዙሪያ ተደግፎ የመመገብን ልማድ ያመለክታል።
    reason: cultural_note
  - marker: b
    text: «ከምሥራቅና ከምዕራብ» የሚለው ከሩቅ ክልሎች የሚመጡ ሰዎችን፣ ከእስራኤል ውጭ ያሉትንም ሊያካትት የሚችል፣ ሰፊ አገላለጽ ነው።
    reason: cross_reference
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: እኔ ግን እላችኋለሁ
  rationale: δέ የሚያሳየውን መጠነኛ ንጽጽር በ«ግን» ያስቀምጣል፤ λέγω ὑμῖν ደግሞ በተፈጥሯዊ አማርኛ «እላችኋለሁ» ተብሏል።
- source_word: πολλοὶ
  choice: ብዙዎች
  rationale: ቅጽሉ እንደ ስም ስለሚሠራ «ብዙ ሰዎች» ብሎ ሳይጨምር በተፈጥሯዊ አማርኛ ቀርቧል።
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: ከምሥራቅና ከምዕራብ
  rationale: የግሪኩን ሰፊ የአቅጣጫና የክልል ፍቺ ይጠብቃል፤ በዋናው ጽሑፍ ያልተጠቀሰውን የሕዝብ ማንነት አይጨምርም።
- source_word: ἥξουσιν
  choice: ይመጣሉ
  rationale: የወደፊቱን መምጣት በቀጥታና በተለመደ አማርኛ ይገልጻል።
- source_word: ἀνακλιθήσονται
  choice: በማዕድ ይቀመጣሉ
  rationale: ቃሉ በጥንታዊ የመመገቢያ ልማድ በማዕድ መደገፍን ያመለክታል። «በማዕድ ይቀመጣሉ» የግብዣውን ምስል ለዘመናዊ አንባቢ በግልጽና ተፈጥሯዊ መንገድ ያቀርባል።
- source_word: μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: ከአብርሃም፣ ከይስሐቅና ከያዕቆብ ጋር
  rationale: μετά ከባለቤት አገባብ ጋር የአብሮነትን፣ በዚህም ዐውድ የማዕድ ኅብረትን ያመለክታል።
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: በሰማያት መንግሥት
  rationale: የማቴዎስን ባሕርያዊ አገላለጽ በአማርኛ የተለመደውን ቅርጽ ተጠቅሞ ያቀርባል፤ የግሪኩ ብዙ ቁጥር «ሰማያት»ም ተጠብቋል።
theological_decisions:
- issue: የግብዣው ምስልና የመጨረሻው ዘመን ኅብረት
  choice: «በማዕድ ይቀመጣሉ» በማለት የመመገብና የግብዣ ምስሉን ማቆየት
  alternative: «ከአብርሃም፣ ከይስሐቅና ከያዕቆብ ጋር ይቀመጣሉ»
  rationale: ጥቅሱ ተራ በአንድ ቦታ መገኘትን ሳይሆን የግብዣ ኅብረትን ያሳያል፤ ይህን ምስል ማቆየት የጽሑፉን ኃይል ይጠብቃል።
- issue: ከምሥራቅና ከምዕራብ የሚመጡት «ብዙዎች» ማንነት
  choice: የጂኦግራፊያዊውን አገላለጽ ማቆየትና «አሕዛብ» የሚለውን በዋናው ጽሑፍ አለመጨመር
  alternative: «ብዙ አሕዛብ ከምሥራቅና ከምዕራብ ይመጣሉ»
  rationale: ዐውዱ ከእስራኤል ውጭ ያሉትን ማካተት አጥብቆ ቢያመለክትም፣ የግሪኩ ጽሑፍ «ብዙዎች» እንጂ «አሕዛብ» አይልም። ትርጉሙ ይህን ጥቆማ ሳይፈታ ይጠብቃል።
