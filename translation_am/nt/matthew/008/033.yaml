base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/033.yaml
  text: Then the herdsmen fled[a], and going away into the city, they reported everything, including what had happened to the demon-possessed men.
translation:
  language: am
  text: አሳማዎቹን ይጠብቁ የነበሩትም ሸሹ፤ ወደ ከተማም ሄደው ሁሉን ነገር፣ በአጋንንት የተያዙትን ሰዎች የሚመለከተውንም[a] ነገሩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፦ “እና በአጋንንት ስለተያዙት ሰዎች ነገሮችን።”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ βόσκοντες
  choice: አሳማዎቹን ይጠብቁ የነበሩትም
  rationale: ቃሉ በቀጥታ ‘የሚያበሉት/የሚያሰማሩት’ ማለት ሲሆን፣ በአውዱ የአሳማዎቹን ጠባቂዎች ያመለክታል። ‘እረኞቹ’ ብቻ በአማርኛ በተለምዶ የበግ ጠባቂዎችን ሊያስታውስ ስለሚችል ግልጽ የአውድ አገላለጽ ተመርጧል። δέ በ‘ም’ ተያያዥ ትረካዊ አገናኝ ሆኗል።
- source_word: ἔφυγον
  choice: ሸሹ
  rationale: ድንገተኛ መሸሽን በቀጥታና በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἀπελθόντες εἰς τὴν πόλιν
  choice: ወደ ከተማም ሄደው
  rationale: የአኦሪስት አሳታፊውን ቅድመ ድርጊት በተፈጥሯዊ የአማርኛ ድርጊት ቅደም ተከተል ያቀርባል፤ εἰς ያለውን አቅጣጫ ‘ወደ’ ይጠብቃል።
- source_word: ἀπήγγειλαν
  choice: ነገሩ
  rationale: ያዩትን ለከተማው ሰዎች ማድረሳቸውን በቀላል፣ ዘመናዊና ተፈጥሯዊ ቋንቋ ይገልጣል።
- source_word: πάντα
  choice: ሁሉን ነገር
  rationale: የግሪኩን አጠቃላይና ሁሉን አካታች ኃይል በተለመደ አማርኛ ይጠብቃል።
- source_word: καὶ τὰ τῶν δαιμονιζομένων
  choice: በአጋንንት ስለተያዙት ሰዎች የሆነውንም
  rationale: τὰ τῶν የሚለው አገላለጽ ‘ስለ... የሆነው/የሚመለከተው’ የሚል ሰፊ ትርጉም አለው። በአውዱ ለተፈጠረው ነገር የሚያመለክት ተፈጥሯዊ አገላለጽ ተመርጧል፤ ‘ሰዎች’ የሚለው በቅርብ አውዱ ካሉት ሁለት ወንዶች ተሟልቷል።
theological_decisions:
- issue: δαιμονιζομένων የሚለውን የአጋንንት ተጽዕኖ የሚገልጽ ቃል ከአውዱ በላይ የሆነ ዶክትሪናዊ ልዩነት ሳይጨምሩ መተርጎም
  choice: በአጋንንት የተያዙት ሰዎች
  alternative: በአጋንንት የተሰቃዩት ሰዎች
  rationale: ‘የተያዙ’ የሚለው የቃሉን ከባድና እውነተኛ የአጋንንት ቁጥጥር ያሳያል፤ ጽሑፉ ያልገለጸውን ሥርዓታዊ ምድብ ግን አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ ትረካዊ አማርኛ ተጠቅሟል። የግሪኩ ተከታታይ καί በ‘ም’ እና በሐረግ ምልክት ተፈጥሯዊ ሆኖ ቀርቧል።
