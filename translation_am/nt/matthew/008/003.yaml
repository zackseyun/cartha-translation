id: MAT.8.3
reference: Matthew 8:3
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα ἥψατο ⸀αὐτοῦ λέγων· Θέλω, καθαρίσθητι· καὶ εὐθέως ἐκαθαρίσθη αὐτοῦ ἡ λέπρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/003.yaml
  text: And stretching out his hand[a], he touched him, saying, “I am willing[c][b]; be cleansed.” And immediately his leprosy was cleansed.
translation:
  language: am
  text: እጁን ዘርግቶ ነካው፤ “ፈቃደኛ ነኝ፤ ንጹሕ ሁን!” አለው። ለምጹም[a] ወዲያውኑ ነጻ ሆነ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ለምጽ” የተተረጎመው የግሪክ ቃል በዘመናችን ሀንሰን በሽታ ተብሎ ከሚጠራው በሽታ ብቻ ሳይወሰን፣ የተለያዩ ከባድ የቆዳ በሽታዎችንም ሊያመለክት ይችላል።
    reason: cultural_note
lexical_decisions:
- source_word: ἐκτείνας τὴν χεῖρα
  choice: እጁንም ዘርግቶ
  rationale: የግሪኩን ተጨባጭ እንቅስቃሴና ከዋናው ድርጊት ቀድሞ መፈጸሙን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἥψατο αὐτοῦ
  choice: ነካው
  rationale: ἅπτομαι ከዘር አገባብ ጋር በዚህ አውድ ‘መንካት’ ማለት ነው፤ ‘ነካው’ ቀላልና ትክክለኛ ነው።
- source_word: Θέλω
  choice: ፈቃደኛ ነኝ
  rationale: በቀደመው ጥያቄ የተነሣው የኢየሱስ ፈቃደኛነት ነው፤ ይህ አተረጓጎም የፈቃድን ሐሳብ ያለ የወደፊት ጊዜ ትርጉም ያስተላልፋል።
- source_word: καθαρίσθητι
  choice: ንጻ
  rationale: ትእዛዛዊውን ተገብሮ አገባብ በአጭርና ተፈጥሯዊ አማርኛ ያቀርባል፤ የአካል ፈውስንና የንጽሕና ትርጉምን አንድ ላይ ይጠብቃል።
- source_word: εὐθέως
  choice: ወዲያውኑ
  rationale: የውጤቱን ፈጣንነት በዘመናዊና ግልጽ አማርኛ ያሳያል።
- source_word: ἐκαθαρίσθη
  choice: ነጻ
  rationale: ከትእዛዙ ‘ንጻ’ ጋር ያለውን የቃል ግንኙነት ይጠብቃል፤ ግሪኩን ‘ተፈወሰ’ ብሎ ብቻ አያጠብም።
- source_word: ἡ λέπρα
  choice: ለምጹ
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የታወቀውን ቃል ይጠብቃል፤ የግሪኩ ቃል ግን ከዘመናዊው የሀንሰን በሽታ የሰፋ የቆዳ በሽታ ምድብን ሊያመለክት ስለሚችል ማብራሪያ ተጨምሯል።
theological_decisions:
- issue: በκαθαρίζω ያለው የንጽሕናና የፈውስ ትርጉም
  choice: በትእዛዙም ሆነ በውጤቱ ‘ንጻ/ነጻ’ የሚለውን ቋንቋ መጠቀም
  alternative: ‘ተፈወስ/ተፈወሰ’ ብሎ መተርጎም
  rationale: ግሪኩ የአካል መዳንን ከንጽሕና ሐሳብ ጋር ያቀርባል፤ ‘ፈውስ’ ብቻ ማለት ይህን ድርብ ስሜት ያጠባል።
- issue: በΘέλω ያለው የፈቃድ አገላለጽ
  choice: ፈቃደኛ ነኝ
  alternative: እፈልጋለሁ
  rationale: የታመመው ሰው ኢየሱስ ፈቃደኛ መሆኑን ጠይቋል፤ መልሱም ይህንኑ በግልጽ ያረጋግጣል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። አጭሩ ‘ንጻ’ የሚለው ትእዛዝ የግሪኩን ጥብቅነት ይጠብቃል፤ የመጨረሻው ሐረግም ለምጹን እንደ ሰዋሰዋዊ ርእሰ ጉዳይ በመያዝ የምንጩን አወቃቀር ያንጸባርቃል።
