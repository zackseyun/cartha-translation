  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν δὲ
  choice: ነበር፤ የδέ ትስስር በ«-ም» ተገልጿል
  rationale: ἦν ያለፈ ጊዜ ህልውናን ይገልጣል፤ δέ ደግሞ ትረካውን በለስላሳ የሚያስቀጥል አገናኝ ስለሆነ በአማርኛ «-ም» በተፈጥሯዊ ሁኔታ ተወክሏል።
- source_word: μακρὰν ἀπ’ αὐτῶν
  choice: ከእነርሱም በተወሰነ ርቀት
  rationale: ሐረጉ ከእነርሱ የተለየ የቦታ ርቀትን ያመለክታል። «በተወሰነ ርቀት» ተፈጥሯዊ ዘመናዊ አማርኛ ሲሆን «ሩቅ» የሚለው አማራጭም በማስታወሻ ተጠብቋል።
- source_word: ἀγέλη
  choice: መንጋ
  rationale: ለብዙ እንስሳት ቡድን የሚውለው ግልጽና የተለመደ የአማርኛ ቃል ነው።
- source_word: χοίρων
  choice: እሪያዎች
  rationale: χοῖρος በቀጥታ እሪያን ያመለክታል፤ «እሪያ» ግልጽና የተለመደ ዘመናዊ ቃል ነው።
- source_word: πολλῶν
  choice: ብዙ እሪያዎች ያሉበት
  rationale: πολλῶν በሰዋስው ከ«እሪያዎች» ጋር ተያይዞ «ብዙ» ማለት ነው። ይህን በግልጽ መግለጽ «ትልቅ መንጋ» ብቻ ከማለት ይልቅ የምንጩን ቁጥራዊ አጽንዖት ይጠብቃል።
- source_word: βοσκομένη
  choice: እየተመገበ
  rationale: የአሁን ጊዜ አስተኔ ቅርጹ በዚያ ጊዜ እየቀጠለ ያለ የመንጋውን መመገብ ያሳያል፤ ተሳቢ ቅርጹም በአማርኛ በተፈጥሯዊ ሁኔታ የእንስሳቱን መመገብ ይገልጣል።
