  text: καὶ ⸀προσελθόντες ἤγειραν αὐτὸν λέγοντες· Κύριε, ⸀σῶσον, ἀπολλύμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/025.yaml
  text: And they came and woke him[a], saying, “Lord, save us! We are perishing!”
translation:
  language: am
  text: ወደ እርሱም ቀርበው ቀሰቀሱትና፣ “ጌታ ሆይ፣ አድነን[a]! እየጠፋን ነው!” አሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ታደገን።” የግሪኩ ትእዛዛዊ ግስ σῶσον ከአደጋ ወዲያው መታደግንም ሆነ ሰፋ ያለውን “ማዳን” የሚል ፍቺ ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: ወደ እርሱም ቀርበው
  rationale: ወደ ኢየሱስ ቀርበው ከዚያ እንደቀሰቀሱት የድርጊቶቹን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἤγειραν
  choice: ቀሰቀሱት
  rationale: በዚህ አውድ ἐγείρω ከእንቅልፍ ማስነሳትን ያመለክታል፤ ትንሣኤን የሚያስገባ ትርጉም አይጨመርም።
- source_word: λέγοντες
  choice: አሉት
  rationale: የተናገሩትን ቃል በተፈጥሯዊ የአማርኛ ንግግር አወቃቀር ያስተዋውቃል፤ ‘ጮኹ’ የሚል በግሪኩ ያልተገለጸ ስሜታዊ ቀለም አይጨምርም።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: የቀጥታ አድራሻውንና κύριος ሊኖረው የሚችለውን ክብር እና ክርስቶሎጂያዊ ክብደት ሳያቀልል ይጠብቃል።
- source_word: σῶσον
  choice: አድነን
  rationale: በአደጋ ጊዜ ፈጣን መዳንን የሚጠይቀውን ትእዛዛዊ ልመና ይገልጣል፤ የመጀመሪያ መደብ ብዙ ቁጥር ተሳቢው ከአውዱና ከἀπολλύμεθα ግልጽ ስለሆነ ‘ን’ ተጨምሯል።
- source_word: ἀπολλύμεθα
  choice: እየጠፋን ነው
  rationale: የአሁኑን ቀጣይ አደጋና የሞት ስጋት ይጠብቃል፤ ትርጉሙን ‘እየሞትን ነው’ ብሎ ብቻ አያጠብም።
theological_decisions:
- issue: κύριος ለኢየሱስ እንደ መጠሪያ መተርጎም
  choice: ጌታ ሆይ
  alternative: መምህር ሆይ
  rationale: የግሪኩ መጠሪያ ተራ የክብር አድራሻንም ሆነ የጠለቀ ክርስቶሎጂያዊ ፍቺን ሊሸከም ይችላል። ‘ጌታ’ ይህን ክፍትነት ይጠብቃል፤ ‘መምህር’ ግን ፍቺውን ሊያጠብ ይችላል።
- issue: በσῶσον ውስጥ በግልጽ ያልተጻፈውን ብዙ ቁጥር ተሳቢ ማሳየት
  choice: አድነን
  alternative: አድን
  rationale: ቀጣዩ ‘እየጠፋን ነው’ የልመናው ተሳቢ ደቀ መዛሙርቱ መሆናቸውን ግልጽ ያደርጋል። በአማርኛ ‘አድነን’ ተፈጥሯዊና ግልጽ ነው፤ አዲስ ሥነ መለኮታዊ ሐሳብ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የንግግሩ አጣዳፊነት በአጭር አረፍተ ነገሮችና በአጋኖ ምልክቶች ተጠብቋል።
