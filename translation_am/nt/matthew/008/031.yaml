base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/031.yaml
  text: And the demons kept begging him[a], saying, “If you cast us out[b], send us into the herd of pigs.”
translation:
  language: am
  text: አጋንንቱም፣ “የምታስወጣን ከሆነ፣ ወደ የእሪያዎቹ መንጋ ላከን” እያሉ ደጋግመው ለመኑት።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ለመኑት” ወይም “እየተማጸኑት ነበር”፤ የግሪኩ ግስ ያልተጠናቀቀ ጊዜ ስለሆነ የቀጠለ ወይም የተደጋገመ ድርጊትን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: δαίμονες
  choice: አጋንንቱ
  rationale: በዚህ አውድ ያሉትን ክፉ መናፍስት በተለመደውና ግልጽ የአማርኛ ቃል ያመለክታል።
- source_word: παρεκάλουν
  choice: ደጋግመው ለመኑት
  rationale: ያልተጠናቀቀው የግሪክ ግስ ድርጊቱ የቀጠለ ወይም የተደጋገመ መሆኑን ሊያመለክት ስለሚችል ይህ አተረጓጎም ያንን ገጽታ ይጠብቃል።
- source_word: λέγοντες
  choice: እያሉ
  rationale: ቀጥተኛውን ንግግር የሚያስገባውን ተሳቢ ግስ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: Εἰ
  choice: ከሆነ
  rationale: የተናጋሪዎቹን ሁኔታዊ ንግግር ሳይፈታ ይጠብቃል።
- source_word: ἐκβάλλεις
  choice: የምታስወጣን
  rationale: በአጋንንት ማስወጣት አውድ የግሱን ትርጉም በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἀπόστειλον
  choice: ላከን
  rationale: የወዲያውኑ ጥያቄ ኃይል ያለውን ትእዛዛዊ ግስ በቀጥታ ያስተላልፋል።
- source_word: ἀγέλην
  choice: መንጋ
  rationale: የእንስሳትን ስብስብ የሚገልጽ መደበኛና ተፈጥሯዊ የአማርኛ ቃል ነው።
- source_word: χοίρων
  choice: እሪያዎቹ
  rationale: ዘመናዊ አንባቢ በቀላሉ የሚረዳውና የግሪኩን የእንስሳ ስም በትክክል የሚያቀርብ ቃል ነው።
- source_word: οἱ δὲ
  choice: አጋንንቱም
  rationale: δέ የሚያሳየውን የትረካ ቀጣይነት በአማርኛው -ም አያያዥ ያቀርባል።
theological_decisions:
- issue: የክፉ መናፍስት አጠራር
  choice: አጋንንት
  alternative: ክፉ መናፍስት
  rationale: ጥቅሱ ኢየሱስን የሚናገሩ ግላዊ ክፉ ፍጡራንን ያቀርባል፤ “አጋንንት” ይህን ሳያለዝብና ተጨማሪ የእምነት ትርጓሜ ሳይጭን ያስተላልፋል።
- issue: የΕἰ ሁኔታዊ ኃይል
  choice: የምታስወጣን ከሆነ
  alternative: የምታስወጣን ስለሆነ
  rationale: “ከሆነ” የግሪኩን ግልጽ ሁኔታዊ አወቃቀር ይጠብቃል፤ ንግግሩን ወደ ምክንያታዊ ማረጋገጫ አይለውጠውም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለመደበኛ አንባቢ ግልጽ የሆነ አማርኛ። “እሪያ” ከጥንታዊ ወይም ከልክ በላይ ሥነ ሥርዓታዊ አማራጮች ይልቅ ተፈጥሯዊ ስለሆነ ተመርጧል።
