source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ⸀ἐξουσίαν, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/009.yaml
  text: For I also am a man under authority[a], having soldiers under me. And I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.
translation:
  language: am
  text: ምክንያቱም እኔም በሥልጣን ሥር ያለሁ ሰው ነኝ፤ ከእኔም በታች ወታደሮች አሉኝ። ለዚህ ሰው፣ ‘ሂድ’ እላለሁ፤ ይሄዳልም፤ ለሌላውም፣ ‘ና’ እላለሁ፤ ይመጣልም፤ ለአገልጋዬ[a]፣ ‘ይህን አድርግ’ እላለሁ፤ ያደርገዋልም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “አገልጋዬ” የሚለው “ባሪያዬ” ተብሎም ሊተረጎም ይችላል (ግሪክ፦ δοῦλος, doulos)።
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: እኔም ቢሆን
  rationale: γάρ የሚያሳየውን የማብራሪያ ግንኙነትና καί የሚጨምረውን ‘እኔም’ የሚል ንጽጽር በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὑπὸ ἐξουσίαν
  choice: ከባለሥልጣን በታች
  rationale: ቃሉ በትእዛዝ ሰንሰለት ውስጥ ለሌላ ሥልጣን ተገዢ መሆንን ያመለክታል፤ ‘ከሥልጣን በታች’ ከሚለው ይልቅ ባለሥልጣንን በግልጽ ያሳያል።
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: ከእኔም በታች ወታደሮች አሉኝ
  rationale: መቶ አለቃው ራሱ ተገዢ ሆኖ በሌሎች ላይም የተሰጠው ሥልጣን እንዳለው የሚያሳየውን የግሪኩን ትይዩነት ይጠብቃል።
- source_word: Πορεύθητι / Ἔρχου / Ποίησον τοῦτο
  choice: ‘ሂድ’ / ‘ና’ / ‘ይህን አድርግ’
  rationale: ቀጥተኛዎቹን ትእዛዛት በአጭር፣ ተፈጥሯዊና ግልጽ የአማርኛ የትእዛዝ ቅርጾች ይገልጻል።
- source_word: δοῦλος
  choice: አገልጋይ
  rationale: በዚህ ዐውድ ዋናው ነጥብ የቤት ውስጥ የሥልጣንና የትእዛዝ ግንኙነት ነው፤ ሆኖም δοῦλος የባርነት ማኅበራዊ ደረጃንም ሊያመለክት ስለሚችል ይህ አማራጭ በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: የδοῦλος አተረጓጎም
  choice: አገልጋይ
  alternative: ባሪያ
  rationale: የንግግሩ ትኩረት በሥልጣንና በፈጣን ታዛዥነት ላይ ስለሆነ ‘አገልጋይ’ ለዘመናዊ አንባቢ ተፈጥሯዊ ነው፤ ነገር ግን ‘ባሪያ’ የሚለውን ታሪካዊና ቃላዊ አማራጭ ላለማጥፋት በግርጌ ማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የትእዛዝና የመታዘዝ ትይዩ አወቃቀር ተጠብቋል።
