base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/028.yaml
  text: And when he came to the other side[a], into the region of the Gadarenes, two demon-possessed men met him, coming out of the tombs[c][b], so extremely fierce that no one was able to pass along that road.
translation:
  language: am
  text: እርሱም ወደ ማዶ፣ ወደ ጋዳራውያን አገር[a] በደረሰ ጊዜ፣ ከመቃብሮች የወጡ በአጋንንት የተያዙ ሁለት ሰዎች ተገናኙት። እነርሱም እጅግ አደገኞች[b] ነበሩ፤ ስለዚህም ማንም በዚያ መንገድ ማለፍ አይችልም ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ ቅጂዎች «ጌርጌሳውያን» ወይም «ጌራሳውያን» ይላሉ።
    reason: textual_variant
  - marker: b
    text: ወይም፣ «እጅግ አስፈሪዎች»።
