- source_word: τὸ πέραν
  choice: ወደ ማዶ
  rationale: በዐውዱ የሐይቁን ሌላኛ ወገን የሚያመለክት ግልጽና ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
- source_word: χώραν τῶν Γαδαρηνῶν
  choice: ወደ ጋዳራውያን አገር
  rationale: χώρα ክልልን ወይም ግዛትን ያመለክታል፤ «አገር» በዚህ ዐውድ ተፈጥሯዊ ሲሆን የSBLGNTን Γαδαρηνῶν ይከተላል።
- source_word: δύο δαιμονιζόμενοι
  choice: በአጋንንት የተያዙ ሁለት ሰዎች
  rationale: የአጋንንትን እውነተኛ ቁጥጥር በተለመደና ግልጽ አማርኛ ይገልጣል፤ በዐውዱ ያለውን የወንድ ብዙ ቁጥርም «ሰዎች» በማለት ያሳያል።
- source_word: ἐκ τῶν μνημείων ἐξερχόμενοι
  choice: ከመቃብሮች የወጡ
  rationale: ከቀብር ስፍራዎች መውጣታቸውን በአጭርና ተፈጥሯዊ መንገድ ያቀርባል።
- source_word: χαλεποὶ λίαν
  choice: እጅግ አደገኞች
  rationale: χαλεπός ኃይለኛ፣ አስፈሪ ወይም አደገኛ ሊሆን ይችላል፤ ቀጣዩ ሐረግ ሰዎች መንገዱን ማለፍ እንዳልቻሉ ስለሚገልጥ «አደገኞች» ትርጉሙን ሳያጠብ ያስተላልፋል። λίαν በ«እጅግ» ተተርጉሟል።
- source_word: ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν διὰ τῆς ὁδοῦ ἐκείνης
  choice: ማንም በዚያ መንገድ ማለፍ አይችልም ነበር
  rationale: ὥστε የሚያሳየውን ውጤትና ἰσχύειν የሚያመለክተውን ችሎታ በግልጽ ዘመናዊ አማርኛ ያቀርባል።
