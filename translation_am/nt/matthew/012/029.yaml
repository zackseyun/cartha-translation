id: MAT.12.29
reference: Matthew 12:29
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἢ πῶς δύναταί τις εἰσελθεῖν εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ καὶ τὰ σκεύη αὐτοῦ ⸀ἁρπάσαι, ἐὰν μὴ πρῶτον δήσῃ τὸν ἰσχυρόν; καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/029.yaml
  text: Or how can someone enter the strong man's house and seize his goods[b][a], unless he first binds the strong man? And then he will plunder his house.
translation:
  language: am
  text: ወይስ አንድ ሰው አስቀድሞ ኃያሉን ሰው ካላሰረ በቀር፣ ወደ ኃያሉ ሰው ቤት ገብቶ ንብረቱን[a] እንዴት ሊነጥቅ ይችላል? ከዚያም ቤቱን ይዘርፋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ዕቃዎቹን።” የግሪኩ ቃል በቀጥታ ዕቃዎችን ወይም መሣሪያዎችን፣ በሰፊው ደግሞ ንብረትን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: ወይስ
  rationale: ከቀደመው ክርክር ጋር የተያያዘ አማራጭ ማብራሪያን ያስገባል፤ በአማርኛ የንግግር ጥያቄን በተፈጥሮ ያገናኛል።
- source_word: δύναταί τις
  choice: አንድ ሰው ... ሊነጥቅ ይችላል
  rationale: τις ያለውን አጠቃላይና ያልተወሰነ ሰው ማመልከቻ በተፈጥሮ አማርኛ ያቀርባል።
- source_word: τοῦ ἰσχυροῦ / τὸν ἰσχυρόν
  choice: ኃያሉን ሰው
  rationale: በግሪክ በስም ፈንታ የገባውን ቅጽልና የወንድ ምስል ይጠብቃል፤ “ኃያል” አካላዊ ወይም የሥልጣን ጥንካሬን ሳይገድብ ያሳያል።
- source_word: τὰ σκεύη αὐτοῦ
  choice: ንብረቱን
  rationale: σκεύη በቀጥታ ዕቃዎችን ወይም መሣሪያዎችን ሊያመለክት ቢችልም፣ በቤት ዘረፋው ምሳሌ ውስጥ የቤቱን ንብረት በሰፊው ያመለክታል።
- source_word: ἁρπάσαι
  choice: ሊነጥቅ
  rationale: በኃይል መውሰድን ያሳያል፤ ከኋላ ካለው የተጠናከረ διαρπάσει ጋር ያለውን የቃላት ልዩነትም ይጠብቃል።
- source_word: ἐὰν μὴ πρῶτον δήσῃ
  choice: አስቀድሞ ... ካላሰረው በቀር
  rationale: ቅድመ ሁኔታውንና πρῶτον የሚያሳየውን ቅደም ተከተል በተፈጥሮ አማርኛ ይገልጻል።
- source_word: καὶ τότε
  choice: ከዚያ በኋላ
  rationale: የድርጊቶቹን ግልጽ ቅደም ተከተል ይጠብቃል።
- source_word: διαρπάσει
  choice: ይዘርፋል
  rationale: ቤቱን በስፋት መበዝበዝን የሚያመለክተውን የተጠናከረ ግስ ከἁρπάσαι በተለየ ሁኔታ ያቀርባል።
- source_word: τὴν οἰκίαν αὐτοῦ
  choice: ቤቱን
  rationale: የዘረፋውን ተጨባጭ ምስል ሳይተረጉም ይጠብቃል።
theological_decisions:
- issue: በምሳሌው ያለው ወንዳዊ አገላለጽ
  choice: ኃያሉ ሰው / አንድ ሰው
  alternative: ኃያሉ / ማንም ሰው
  rationale: ግሪኩ ተጨባጭ ወንዳዊ ምስል ይጠቀማል፤ “ኃያሉ ሰው” ይህን ምስል ይጠብቃል፣ τις ግን እንደ “አንድ ሰው” በአጠቃላይ ተተርጉሟል።
- issue: የ“ቤት”ና የ“ንብረት” ምሳሌያዊ ወሰን
  choice: የቤት ዘረፋውን ተጨባጭ ምሳሌ መጠበቅ
  alternative: ቤቱን እንደ ግዛት፣ ንብረቱንም እንደ ተገዢዎች በትርጓሜ ማቅረብ
  rationale: አውዱ ከኢየሱስ በክፉ መናፍስት ላይ ካለው ሥልጣን ጋር ቢያያዝም፣ ጽሑፉ ራሱ የሚሰጠውን ምሳሌ በትርጉሙ ውስጥ ወደ ሙሉ ምሳሌያዊ ፍቺ አልተቀየረም።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለመደበኛ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የንግግር ጥያቄ፣ የድርጊት ቅደም ተከተል፣ እንዲሁም በἁρπάσαι እና διαρπάσει መካከል ያለው ልዩነት ተጠብቋል።
