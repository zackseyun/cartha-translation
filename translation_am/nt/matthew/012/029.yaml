  verdict: revise
  source_fidelity: The draft accurately preserves the rhetorical question, the prerequisite of first binding the strong man, and the distinction between forcefully taking the goods (ἁρπάσαι) and subsequently plundering the house (διαρπάσει). However, «ወደ እርሱ ቤት» leaves the possessive referent less explicit than the Greek, whose repeated article and possessive clearly identify the house as the strong man's.
  naturalness: The Amharic is generally modern and clear. Replacing the potentially ambiguous pronoun with «ወደ ኃያሉ ሰው ቤት» makes the concrete image immediately clear and reads naturally. «ከዚያም» more closely carries the connective force of καὶ τότε.
  terminology: «ኃያሉ ሰው», «ንብረቱን», «ሊነጥቅ», and «ይዘርፋል» are appropriate. They retain the masculine figure and the concrete house-plundering metaphor without importing an allegorical interpretation. The footnote appropriately records the more literal sense of σκεύη.
  issues:
  - severity: low
    issue: The pronoun in «ወደ እርሱ ቤት» is less explicit than the Greek possessive phrase.
    rationale: Although it can be understood as referring to the strong man, repeating «ኃያሉ ሰው» eliminates avoidable ambiguity and preserves the source's explicit identification of the house owner.
