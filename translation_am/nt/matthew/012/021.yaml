translation:
  language: am
  text: በስሙም አሕዛብ ተስፋ ያደርጋሉ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ብሔራትም በስሙ ተስፋ ያደርጋሉ።”
    reason: ἔθνη ‘አሕዛብ’ ወይም ‘ብሔራት’ ተብሎ ሊተረጎም ይችላል፤ አማራጩም የቃሉን ሰፊ ሕዝባዊ አድማስ ያሳያል።
lexical_decisions:
- source_word: καὶ
  choice: -ም
  rationale: የግሪኩን አያያዥ ቃል ከቀደመው ጥቅስ ጋር ያለውን ትስስር በተፈጥሯዊ የአማርኛ ቅጥያ ይጠብቃል።
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: በስሙ
  rationale: የዳቲቭ ቅርጹን በተፈጥሯዊ አማርኛ ያቀርባል፤ ‘ስም’ የሚያመለክተውን ሰው፣ ሥልጣንና ዝና ሳይገድብ የመጽሐፍ ቅዱሳዊ አገላለጹን ይጠብቃል።
- source_word: ἔθνη
  choice: አሕዛብ
  rationale: ቃሉ ብሔራትን ወይም ከእስራኤል ውጭ ያሉ ሕዝቦችን ሊያመለክት ይችላል፤ ‘አሕዛብ’ በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም ሁለቱንም ገጽታዎች ይሸከማል።
- source_word: ἐλπιοῦσιν
  choice: ተስፋ ያደርጋሉ
  rationale: የወደፊት ጊዜ አመልካች ቅርጹንና የἐλπίζωን ‘ተስፋ ማድረግ’ ዋና ፍቺ በግልጽ ያስተላልፋል።
theological_decisions:
- issue: በመሲሐዊው የኢሳይያስ ጥቅስ ውስጥ የἔθνη ትርጉም
  choice: አሕዛብ
  alternative: ብሔራት
  rationale: ‘አሕዛብ’ ከእስራኤል ውጭ ያሉትን ሕዝቦች የሚያካትተውን የጥቅሱን ሰፊ አድማስ ይጠብቃል፤ ‘ብሔራት’ የሚለውም ከግሪኩ ጋር ቀጥተኛ የሆነ አማራጭ ስለሆነ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለመደበኛ አንባቢ ግልጽ የሆነ አማርኛ፤ የጥቅሱን አጭርነትና የትንቢት ድምፅ ይጠብቃል።
