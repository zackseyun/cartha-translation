  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ Σατανᾶς τὸν Σατανᾶν ἐκβάλλει, ἐφ’ ἑαυτὸν ἐμερίσθη· πῶς οὖν σταθήσεται ἡ βασιλεία αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/026.yaml
  text: And if Satan casts out Satan[a], he is divided against himself[c][b]. How then will his kingdom stand?
translation:
  language: am
  text: ሰይጣንም ሰይጣንን ቢያስወጣ፣ በራሱ ላይ ተከፋፍሏል፤[a] ታዲያ መንግሥቱ እንዴት ይጸናል?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በራሱ ላይ ተከፈለ»።
    reason: የἐμερίσθη አኦሪስት ተደራጊ ቅርጽ እንደ ቀድሞ የተፈጸመ ድርጊት ወይም ውጤቱ እንደቀጠለ ሁኔታ ሊቀርብ ይችላል።
lexical_decisions:
- source_word: καὶ εἰ
  choice: ሰይጣንም ... ከሆነ
  rationale: καί የቀደመውን ክርክር ስለሚያስቀጥል በ«ም» ተጠብቋል፤ εἰ ደግሞ በተፈጥሯዊው የአማርኛ ሁኔታዊ አገባብ «ከሆነ» ተተርጉሟል።
- source_word: ὁ Σατανᾶς / τὸν Σατανᾶν
  choice: ሰይጣን / ሰይጣንን
  rationale: በዘመናዊ መደበኛ አማርኛ የተለመደው የስሙ ቅርጽ ተጠብቋል።
- source_word: ἐκβάλλει
  choice: የሚያስወጣ
  rationale: በዐውዱ ከሰው ውስጥ ማባረርን ወይም ማስወጣትን ያመለክታል፤ «የሚያስወጣ» ግልጽና ተፈጥሯዊ ነው።
- source_word: ἐφ’ ἑαυτὸν
  choice: በራሱ ላይ
  rationale: የውስጥ ተቃርኖን የሚያመለክተውን የግሪክ ፈሊጥ በቀጥተኛና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐμερίσθη
  choice: ተከፋፍሏል
  rationale: የአኦሪስት ተደራጊ ቅርጹ በሁኔታዊው ክርክር የተገኘውን ውጤታማ ሁኔታ ያሳያል፤ «ተከፋፍሏል» ያንን ይጠብቃል።
- source_word: πῶς οὖν
  choice: ታዲያ ... እንዴት
  rationale: οὖν ያለውን የመደምደሚያ ኃይል «ታዲያ»፣ πῶς ያለውን ጥያቄ «እንዴት» ይገልጣሉ።
- source_word: σταθήσεται
  choice: ይጸናል
  rationale: እዚህ ἵστημι በቃል ብቻ «መቆም» ሳይሆን ጸንቶ መኖርንና መቀጠልን ያመለክታል፤ «ይጸናል» ዘይቤውንና ፍቺውን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἡ βασιλεία αὐτοῦ
  choice: መንግሥቱ
  rationale: βασιλεία እዚህ የሰይጣንን ግዛት ወይም መንግሥት ያመለክታል፤ «መንግሥቱ» አጭርና በዐውዱ ግልጽ ነው።
theological_decisions:
- issue: የሰይጣን ራስን መቃወም እና የመንግሥቱ መጽናት
  choice: ንግግሩ ሁኔታዊ የማስረጃ ክርክር ሆኖ ተጠብቋል፤ ሰይጣን ሰይጣንን ቢያስወጣ በራሱ ላይ የተከፋፈለ ይሆናል፣ መንግሥቱም ሊጸና አይችልም።
  alternative: ከቀደመው ቁጥር የ«የተከፋፈለ ቤት» ምስልን በዚህ ቁጥር ውስጥ በማስገባት በሰፊው መተርጎም።
  rationale: የግሪክ ጽሑፉ የውስጥ ክፍፍልንና የመንግሥቱን አለመጽናት በቀጥታ ይገልጣል፤ ተጨማሪ ምስል ሳይገባ የሥነ መለኮታዊ ክርክሩ እንዳለ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪክ ክርክራዊ ፍሰትና ሁኔታዊ አገባብ ተጠብቀዋል።
