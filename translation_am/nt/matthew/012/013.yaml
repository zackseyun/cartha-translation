  text: τότε λέγει τῷ ἀνθρώπῳ· Ἔκτεινόν ⸂σου τὴν χεῖρα⸃· καὶ ἐξέτεινεν, καὶ ἀπεκατεστάθη ὑγιὴς ὡς ἡ ἄλλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/013.yaml
  text: Then he says to the man[a], “Stretch out your hand.” And he stretched it out, and it was restored[b], healthy like the other one.
translation:
  language: am
  text: ከዚያም ሰውየውን፣ “እጅህን ዘርጋ” አለው። እርሱም ዘረጋት፤ እጁም ተመልሳ እንደ ሌላኛዋ ጤናማ ሆነች።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: ከዚያም
  rationale: የትረካውን ቅደም ተከተል በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: λέγει
  choice: አለው
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ ቅርጽ በአማርኛ ትረካ ተፈጥሯዊ በሆነው ያለፈ ጊዜ ተተርጉሟል።
- source_word: τῷ ἀνθρώπῳ
  choice: ሰውየውን
  rationale: በዐውደ ንባቡ የተጠቀሰውን የተወሰነ ወንድ ሰው በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: Ἔκτεινόν σου τὴν χεῖρα
  choice: እጅህን ዘርጋ
  rationale: ቀጥተኛውን ትእዛዝና χείρ የሚለውን ‘እጅ’ ትርጉም በግልጽ ሁኔታ ያስተላልፋል።
- source_word: ἐξέτεινεν
  choice: ዘረጋት
  rationale: በትእዛዙና በምላሹ መካከል ያለውን የግስ ድግግሞሽ ይጠብቃል፤ የሴት ፆታ ተውላጠ ስምም ‘እጅ’ን ይመለከታል።
- source_word: ἀπεκατεστάθη
  choice: ተመለሰች
  rationale: ግሱ እጅዋ ወደ ትክክለኛና ጤናማ ሁኔታ መመለሷን የሚያጎላውን የመታደስ ፍቺ ይጠብቃል።
- source_word: ὑγιὴς ὡς ἡ ἄλλη
  choice: እንደ ሌላይቱም ጤናማ ሆና
  rationale: የግሪኩን ‘እንደ ሌላይቱ ጤናማ’ ንጽጽር ይጠብቃል፤ ሌላይቱ የሰውየውን ሌላ እጅ እንደምትመለከት ከሰዋስውና ከዐውደ ንባቡ ግልጽ ነው።
theological_decisions:
- issue: የፈውሱ መግለጫ ባሕርይ
  choice: እጅዋ እንደ ሌላይቱ ጤናማ ሆና ወደ ትክክለኛ ሁኔታ ተመለሰች
  alternative: እጅዋ ተፈወሰች / ዳነች
  rationale: ἀποκαθίστημι ወደ ቀድሞው ወይም ወደ ትክክለኛው ሁኔታ መመለስን ያጎላል። ትርጉሙ ተአምሩን በግልጽ ይተርካል እንጂ ከጽሑፉ በላይ የሆነ የእምነት ትርጓሜ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ቀላል የሆነ መደበኛ አማርኛ። የግሪኩን የትእዛዝና የምላሽ ግስ ድግግሞሽ ተጠብቋል፤ አስፈላጊ ያልሆነ የግርጌ ማስታወሻ አልተጨመረም።
