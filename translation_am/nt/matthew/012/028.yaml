  text: ነገር ግን እኔ አጋንንትን በእግዚአብሔር መንፈስ[a] የማስወጣ ከሆንሁ፣ እንግዲያው የእግዚአብሔር መንግሥት በእናንተ ላይ ደርሷል[b]።
