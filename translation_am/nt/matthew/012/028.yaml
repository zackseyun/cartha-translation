review_pass:
  verdict: revise
  source_fidelity: The translation accurately retains the conditional contrast, the explicit emphatic «እኔ», divine agency, the casting out of demons, and the inference that God’s kingdom has reached the hearers. However, «ካስወጣሁ» can naturally suggest a completed act (“if I cast out/have cast out”), whereas the Greek present ἐκβάλλω presents Jesus’ exorcistic activity. «የማስወጣ ከሆንሁ» better represents the source’s present framing.
  naturalness: The revised conditional construction is clear and natural in modern standard Amharic. «በእናንተ ላይ ደርሷል» is idiomatic enough in this elevated biblical register and preserves the force of ἐφ’ ὑμᾶς.
  terminology: «አጋንንት», «የእግዚአብሔር መንፈስ», and «የእግዚአብሔር መንግሥት» are established, accurate terms. The footnote wording is adjusted to use «አማካይነት» rather than the less fitting «መሣሪያ».
  issues:
  - severity: medium
    issue: The conditional verb «ካስወጣሁ» does not clearly preserve the Greek present ἐκβάλλω.
    rationale: In Amharic it may be read as referring to a completed casting-out event. The Greek condition refers to Jesus’ present activity, which serves as the premise for the conclusion.
  - severity: low
    issue: Footnote a describes ἐν as expressing «መሣሪያ».
    rationale: For divine Spirit as the actor/means, «አማካይነት» or «አድራጊነት» is more natural and avoids portraying the Spirit as an impersonal instrument.
  revised_text: ነገር ግን እኔ አጋንንትን በእግዚአብሔር መንፈስ[a] የማስወጣ ከሆንሁ፣ እንግዲያው የእግዚአብሔር መንግሥት በእናንተ ላይ ደርሷል[b]።
