- source_word: τυφλὸς
  choice: ዓይነ ስውር
  rationale: ቀጥተኛና በዘመናዊ መደበኛ አማርኛ የተለመደ አቻ ቃል ነው።
- source_word: κωφός
  choice: መናገር የማይችል
  rationale: ቃሉ መስማት የማይችልን ወይም መናገር የማይችልን ሊያመለክት ይችላል፤ እዚህ የውጤቱ ሐረግ ሰውየው መናገሩን ስለሚገልጽ ይህ ምርጫ ከአውዱ ጋር ይስማማል።
- source_word: ἐθεράπευσεν αὐτόν
