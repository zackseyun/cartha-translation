  rationale: ቀጣዩን ክስተት የሚያስተዋውቅ የጊዜና የትረካ ምልክት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: προσηνέχθη αὐτῷ
  choice: ወደ እርሱ አመጡ
