  yaml_path: translation/nt/matthew/012/022.yaml
  text: Then a demon-possessed man[a], blind and mute, was brought to him; and he healed him, so that the mute man spoke and saw.
translation:
  language: am
  text: ከዚያም ጋኔን ያደረበት፣ ዓይነ ስውርና መናገር የማይችል ሰው[a] ወደ እርሱ ተወሰደ። እርሱም ፈወሰው፤ በዚህም የተነሣ መናገር የማይችለው ሰው ተናገረና አየ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “መስማት የማይችል።” የግሪኩ ቃል መስማት የማይችልን ወይም መናገር የማይችልን ሰው ሊያመለክት ይችላል፤ እዚህ ግን የፈውሱ ውጤት ሰውየው መናገሩንና ማየቱን ስለሚገልጽ፣ “መናገር የማይችል” የሚለው ከአውዱ ጋር ይስማማል።
    reason: lexical_alternative
lexical_decisions:
