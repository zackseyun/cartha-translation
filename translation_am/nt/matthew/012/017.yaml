  text: ይህም በነቢዩ ኢሳይያስ በኩል የተነገረው እንዲፈጸም ሆነ፤[a] እንዲህም ይላል፦
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በነቢዩ ኢሳይያስ የተነገረው።” ግሪኩ ቃል በቃል “በኩል” ይላል፤ ይህም ነቢዩ መልእክቱን ያስተላለፈበትን አማካይነት ያጎላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: እንዲፈጸም ነበር
  rationale: ἵνα የዓላማንም ሆነ የውጤትን ግንኙነት ሊያመለክት ይችላል፤ ይህ አገላለጽ ግንኙነቱን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: πληρωθῇ
  choice: እንዲፈጸም
  rationale: የግሱን ተደራጊ ቅርጽና በማቴዎስ የተለመደውን የትንቢት ፍጻሜ አገላለጽ ይጠብቃል።
- source_word: τὸ ῥηθὲν
  choice: የተነገረው
  rationale: ስማዊ ተሳቢውን ‘የተነገረው’ በማለት በተፈጥሯዊና በአጭር አማርኛ ይወክላል።
- source_word: διὰ
  choice: በኩል
  rationale: ከመስተዋድዱ ጋር ያለው διά መካከለኛ አድራጊነትን ያሳያል፤ ‘በኩል’ መልእክቱ በነቢዩ አማካይነት መነገሩን ይጠብቃል።
- source_word: Ἠσαΐου
  choice: ኢሳይያስ
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የተለመደው የነቢዩ ስም ነው።
- source_word: τοῦ προφήτου
  choice: በነቢዩ
  rationale: ኢሳይያስን ነቢይ መሆኑን የሚለይበትን ገላጭ ስያሜ በግልጽ ሁኔታ ይጠብቃል።
- source_word: λέγοντος
  choice: እንዲህም ይላል
  rationale: በቀጣዩ ቁጥር ወደሚጀምረው ጥቅስ በተፈጥሯዊ አማርኛ ያገናኛል፤ የግሪኩን የንግግር ማስገቢያ ተግባር ይጠብቃል።
theological_decisions:
