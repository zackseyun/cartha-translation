    issue: Relative-clause inflection in “በሰማይ ያለውን የአባቴን ፈቃድ”
    rationale: The accusative suffix on “ያለውን” makes the construction less natural and can momentarily suggest that “the will” rather than “my Father” is the one in heaven. “በሰማይ ያለው የአባቴን ፈቃድ” clearly modifies “አባቴ” while retaining the object marking on “ፈቃድ.”
