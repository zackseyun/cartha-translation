source:
  edition: SBLGNT
  text: ὅστις γὰρ ἂν ποιήσῃ τὸ θέλημα τοῦ πατρός μου τοῦ ἐν οὐρανοῖς, αὐτός μου ἀδελφὸς καὶ ἀδελφὴ καὶ μήτηρ ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/050.yaml
  text: For whoever does the will of my Father in heaven[a], he is my brother and sister and mother.
translation:
  language: am
  text: በሰማይ ያለው የአባቴን ፈቃድ የሚያደርግ ማንም[a]፣ እርሱ ወንድሜ፣ እህቴና እናቴ ነውና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በሰማይ ያለው የአባቴን ፈቃድ የሚያደርግ ማንኛውም ሰው፣ ያ ሰው ወንድሜ፣ እህቴና እናቴ ነው።” የግሪኩ አገላለጽ በሰዋሰው ተባዕታይ ነጠላ ቅርጽን ቢጠቀምም ትርጉሙ አጠቃላይ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις ... ἂν
  choice: የሚያደርግ ማንም
  rationale: የግሪኩን ክፍትና አጠቃላይ ሁኔታዊ አገላለጽ ‘ማንም’ በተፈጥሯዊ አማርኛ ይወክላል።
- source_word: γὰρ
  choice: ነውና
  rationale: ከቀደመው ንግግር ጋር ያለውን ምክንያታዊና ማብራሪያዊ ግንኙነት በአማርኛ በተፈጥሮ በዓረፍተ ነገሩ መጨረሻ ያሳያል።
- source_word: ποιήσῃ
  choice: የሚያደርግ
  rationale: ποιέω ከ θέλημα ጋር ሲመጣ ‘ፈቃድን ማድረግ’ የሚለውን ቅርብ አገላለጽ ይሰጣል፤ ‘የሚታዘዝ’ ማለት ትርጉሙን ያጠባል።
- source_word: τὸ θέλημα
  choice: ፈቃድ
  rationale: የፈቃድን፣ የዓላማንና የፍላጎትን ሥነ መለኮታዊ ክብደት ያለ ትርጓሜያዊ ማስፋፋት ይጠብቃል።
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: በሰማይ ያለውን የአባቴን
  rationale: አባትን በሰማይ ካለው መኖሪያ ጋር በግልጽ ያያይዛል፤ ‘በሰማይ ያለው አባቴ’ በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: αὐτός
  choice: እርሱ
  rationale: በግሪኩ ያለውን አጽንዖትና ሰዋሰዋዊ ተባዕታይ ነጠላ ቅርጽ ይጠብቃል።
- source_word: ἀδελφὸς καὶ ἀδελφὴ καὶ μήτηρ
  choice: ወንድሜ፣ እህቴና እናቴ
  rationale: ሦስቱንም የቤተሰብ ሚናዎች በነጠላ ቁጥርና በግልጽ ልዩነታቸው ይጠብቃል።
- source_word: ἐστίν
  choice: ነው
  rationale: የአሁን ጊዜውን ቀላል አያያዥ ግስ በቀጥታ ይወክላል።
theological_decisions:
- issue: በአጠቃላይ አባባል ውስጥ የተወካይ ተባዕታይ ነጠላ ቅርጽ
  choice: ማንም … እርሱ
  alternative: ማንኛውም ሰው … ያ ሰው
  rationale: ὅστις እና αὐτός በሰዋሰው ተባዕታይ ነጠላ ቢሆኑም አገላለጹ ለማንኛውም ሰው ክፍት ነው። ‘እርሱ’ የምንጩን ቅርጽና አጽንዖት ይጠብቃል፤ ቀጥሎ የተጠቀሱት ‘እህቴ’ እና ‘እናቴ’ ሴቶችም በግልጽ እንደሚካተቱ ያሳያሉ።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና የተከበረ አማርኛን ይጠቀማል። ‘በሰማይ’ የሚለው ከጥንታዊው ‘በሰማያት’ ይልቅ ለዘመናዊ አንባቢ ተፈጥሯዊ ሲሆን የምንጩን ሐሳብ አይለውጥም።
