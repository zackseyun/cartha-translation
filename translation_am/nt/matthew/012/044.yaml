  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τότε λέγει· ⸂Εἰς τὸν οἶκόν μου ἐπιστρέψω⸃ ὅθεν ἐξῆλθον· καὶ ἐλθὸν ⸀εὑρίσκει ⸀σχολάζοντα σεσαρωμένον καὶ κεκοσμημένον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/044.yaml
  text: Then it says[a], ‘I will return to my house from which I came out,’ and when it comes, it finds it unoccupied, swept[b], and put in order.
translation:
  language: am
  text: ከዚያም፣ ‘ከወጣሁበት ወደ ቤቴ እመለሳለሁ’ ይላል፤ ሲመጣም ቤቱን ባዶ[a]፣ ተጠርጎና ተስተካክሎ[b] ያገኘዋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ያልተያዘ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ያጌጠ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: ከዚያም
  rationale: በትረካው ውስጥ ቀጣዩን ድርጊት የሚያስገባ ተፈጥሯዊና አጭር የጊዜ አገላለጽ ነው።
- source_word: λέγει
  choice: ይላል
  rationale: የግሪኩን ሕያው የአሁን ጊዜ ትረካ ይጠብቃል፤ ባለቤቱ ከአውዱ የሚታወቀው ርኩስ መንፈስ ነው።
- source_word: Εἰς τὸν οἶκόν μου ἐπιστρέψω
  choice: ወደ ቤቴ እመለሳለሁ
  rationale: የመመለስን አቅጣጫና ‘ቤቴ’ የሚለውን የመንፈሱ የባለቤትነት ጥያቄ በቀጥታ ይጠብቃል።
- source_word: ὅθεν ἐξῆλθον
  choice: ከወጣሁበት
  rationale: ‘ከወጣሁበት’ የመነሻ ቦታውንና የመውጣቱን ምስል በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐλθὸν
  choice: ሲመጣም
  rationale: ከዋናው ግስ በፊት ያለውን የግሪክ ቦዝ አንቀጽ እንደ ጊዜ ንዑስ አንቀጽ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: εὑρίσκει
  choice: ያገኘዋል
  rationale: የግሪኩን ሕያው የአሁን ጊዜ ትረካ የሚጠብቅ ቀጥተኛ አቻ ነው።
- source_word: σχολάζοντα
  choice: ሰው የሌለበት
  rationale: ቤቱ ያልተያዘና ለመኖሪያ ክፍት መሆኑን ያሳያል፤ ‘ባዶ’ የሚለው ሌላ ትርጉም በማስታወሻ ተጠብቋል።
- source_word: σεσαρωμένον
  choice: ተጠርጎ
  rationale: የተጠናቀቀና አሁንም የቀጠለ ሁኔታን በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: κεκοσμημένον
  choice: ተስተካክሎ
  rationale: ቤቱ በሥርዓት መያዙን ያሳያል፤ ‘ያጌጠ’ የሚለውን ሊሆን የሚችል ትርጉም በማስታወሻ ይጠብቃል።
theological_decisions:
- issue: በተመለሰው ርኩስ መንፈስ ምሳሌ ውስጥ ‘ቤት’ የሚለው ዘይቤያዊ ምስል
  choice: ‘ቤት’ የሚለውን ቃል በዋናው ጽሑፍ በቀጥታ ማቆየት
  alternative: ‘የወጣሁበት ሰው’ ብሎ ዘይቤውን መተርጎም
  rationale: አውዱ የምስሉን ኃይል ቢያሳይም፣ ጥቅሱ ራሱ ‘ቤት’ ይላል። ምስሉን እንዳለ ማቆየት ያልተገባ ትርጓሜያዊ መፍትሔን ያስወግዳል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለመደበኛ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ሕያው የአሁን ጊዜ ትረካ በ‘ይላል’ና ‘ያገኘዋል’ ተጠብቋል፤ ሦስቱ የቤቱ ሁኔታዎችም በተፈጥሯዊ ቅደም ተከተል ቀርበዋል።
