review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the narrative present (“ይላል,” “ያገኘዋል”), the spirit’s possessive claim (“ቤቴ”), the departure-and-return imagery, and the threefold description of the house. However, “ሰው የሌለበት” narrows σχολάζοντα to the presence of people, whereas the Greek conveys being vacant/unoccupied and should retain that broader sense.
  naturalness: The overall wording is modern and clear. Replacing the longer, overly specific “ሰው የሌለበት” with “ባዶ” makes the three coordinated descriptions more idiomatic. The footnote alternative “አጊጦ” is not a suitable adjectival/passive equivalent in this construction; “ያጌጠ” is natural.
  terminology: “ቤት,” “ተጠርጎ,” and “ተስተካክሎ” appropriately preserve the image and the orderly condition without interpretive expansion. The alternative for κεκοσμημένον should be expressed as the adjectival passive/state “ያጌጠ.”
  issues:
  - severity: medium
    issue: “ሰው የሌለበት” for σχολάζοντα
    rationale: This means specifically ‘having no person in it’ and thus restricts the Greek’s broader sense, ‘vacant/unoccupied’ (with ‘empty’ also possible).
  - severity: medium
    issue: Footnote b uses “አጊጦ”
    rationale: “አጊጦ” is a converb-like form and does not naturally render the perfect passive participial description. “ያጌጠ” appropriately conveys ‘decorated/adorned.’
