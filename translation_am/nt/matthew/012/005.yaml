  terminology: ‘ካህናቱ,’ ‘ቤተ መቅደስ,’ ‘ሰንበት,’ and ‘ያረክሳሉ’ are suitable. ‘በደለኞች አይደሉም’ adequately conveys ἀναίτιοί εἰσιν without resolving the deliberate tension in the statement.
