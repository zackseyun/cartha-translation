id: MAT.12.48
reference: Matthew 12:48
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ ⸀λέγοντι αὐτῷ· Τίς ἐστιν ἡ μήτηρ μου, καὶ τίνες εἰσὶν οἱ ἀδελφοί μου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/048.yaml
  text: But he answered the one speaking to him[a], “Who is my mother, and who are my brothers?”
translation:
  language: am
  text: እርሱ ግን ለሚናገረው ሰው መልሶ፣ “እናቴ ማን ናት? ወንድሞቼስ እነማን ናቸው?” አለ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: እርሱ ግን … ሲል መለሰለት
  rationale: ἀποκριθεὶς εἶπεν የሚለውን የግሪክኛ የተለመደ የመልስ አገላለጽ በተፈጥሯዊ አማርኛ ‘ሲል መለሰለት’ ብሎ ያቀርባል፤ δέ የንግግሩን መቃረን ወይም መዞር ‘ግን’ በማለት ይጠብቃል።
- source_word: τῷ λέγοντι αὐτῷ
  choice: ለሚናገረው ሰው
  rationale: λέγοντι የአሁን ጊዜ አሳታፊ ግስ ሆኖ ኢየሱስን እያነጋገረ ያለውን ሰው ያመለክታል፤ ይህ ምርጫ ቀጣይነት ያለውን ድርጊት ይጠብቃል።
- source_word: Τίς ἐστιν ἡ μήτηρ μου
  choice: እናቴ ማን ናት?
  rationale: የማንነት ጥያቄውንና የዘመድነት ቃሉን በቀጥታ፣ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: καὶ τίνες εἰσὶν οἱ ἀδελφοί μου
  choice: ወንድሞቼስ እነማን ናቸው?
  rationale: καί ን በአማርኛው ‘-ስ’ በማስተላለፍ ሁለተኛውን ትይዩ ጥያቄ በተፈጥሯዊ ሁኔታ ያገናኛል፤ ἀδελφοί በዚህ ትዕይንት ያለውን ወንድ የቤተሰብ ማጣቀሻ ለመጠበቅ ‘ወንድሞቼ’ ተብሏል።
theological_decisions:
- issue: ኢየሱስ ስለ ቤተሰብ ማንነት ያቀረበውን የንግግር ጥያቄ በትርጓሜ ማለዘብ
  choice: ሁለቱንም ጥያቄዎች ያለ ማብራሪያ መጨመር በቀጥታ ማቆየት
  alternative: “እንደ እናቴ የምትቆጠረው ማን ናት? እንደ ወንድሞቼስ የሚቆጠሩት እነማን ናቸው?”
  rationale: ቀጣዩ ክፍል የዘመድነትን ትርጉም ቢያብራራም፣ ይህ ቁጥር ራሱ ያንን ማብራሪያ አይጨምርም፤ ቀጥተኛው አቀራረብ የትረካውንና የሥነ መለኮት ውጥረቱን ይጠብቃል።
- issue: የἀδελφοί ፆታዊ አተረጓጎም
  choice: ወንድሞቼ
  alternative: ወንድሞቼና እህቶቼ / ወንድም እህቶቼ
  rationale: በአቅራቢያው ትረካ ማጣቀሻው የኢየሱስ ወንድ የቤተሰብ አባላት ስለሆኑ፣ የምንጩን ተባዕታይ ብዙ ቁጥር ሳያሰፋ ‘ወንድሞቼ’ ተብሏል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ። ‘እነማን’ የብዙ ቁጥሩን τίνες በግልጽ ያሳያል፤ ‘ወንድሞቼስ’ ደግሞ የጥያቄዎቹን ትይዩነት በተፈጥሯዊ ንግግር ይጠብቃል።
