id: MAT.12.37
reference: Matthew 12:37
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐκ γὰρ τῶν λόγων σου δικαιωθήσῃ, καὶ ἐκ τῶν λόγων σου καταδικασθήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/037.yaml
  text: For by your words you will be justified[a], and by your words you will be condemned.
translation:
  language: am
  text: ምክንያቱም በቃላትህ ጻድቅ ተብለህ ትፈረዳለህ[a]፤ በቃላትህም ትኮነናለህ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በቀኝ እንደሆንክ ትታወጃለህ» ወይም «ንጹሕ ተብለህ ትፈረዳለህ»። የግሪኩ ግስ በፍርድ አውድ አንድ ሰው በቀኝ እንደሆነ መታወጁን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: በ
  rationale: ከመውጣት ይልቅ የፍርዱን መሠረት ወይም ማስረጃ ያመለክታል፤ «በቃላትህ» ይህን ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: γάρ
  choice: ምክንያቱም
  rationale: ከቀደመው ስለ ንግግርና ፍርድ የተሰጠ ማስጠንቀቂያ ጋር ያለውን የምክንያት ግንኙነት ያሳያል።
- source_word: λόγων σου
  choice: በቃላትህ
  rationale: λόγοι በዚህ አውድ የሰውን የተነገሩ ቃላት ያመለክታል፤ ድግግሞሹም በሁለቱ አንቀጾች ተጠብቋል።
- source_word: δικαιωθήσῃ
  choice: ጻድቅ ተብለህ ትፈረዳለህ
  rationale: የወደፊት ጊዜ ተደራጊ ግስ ሲሆን፣ ከκαταδικασθήσῃ ጋር ባለው ተቃርኖ የፍርድ ቤት ስሜቱ ግልጽ ነው። ይህ አገላለጽ በቀኝ መሆንን የሚገልጽ ፍርድ መሰጠቱን ይጠብቃል።
- source_word: καταδικασθήσῃ
  choice: ይፈረድብሃል
  rationale: በፍርድ አውድ ጥፋተኛ ተብሎ መፈረድን ያመለክታል፤ ከመጀመሪያው አንቀጽ ጋር ያለውን የፍርድ ተቃርኖ ያስተላልፋል።
theological_decisions:
- issue: በንግግርና በፍርድ አውድ ያለው የδικαιόω የፍርድ ትርጉም
  choice: «ጻድቅ ተብለህ ትፈረዳለህ» ተብሎ የፍርድ ውሳኔ ትርጉሙ ተገልጿል።
  alternative: «ንጹሕ ትባላለህ» ወይም «ትጸድቃለህ»
  rationale: ከ«ይፈረድብሃል» ጋር ያለው ትይዩ ተቃርኖ የፍርድ አውድን ያሳያል። ትርጉሙ የሰው ቃላት በፍርድ ማስረጃ እንደሚሆኑ ያስተላልፋል እንጂ ጥቅሱ ከሚለው በላይ ስለ ጽድቅ ሥርዓት የተወሰነ የእምነት ትምህርት አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የአማርኛ አገላለጽ ተጠቅሟል። የግሪኩ ድግግሞሽ («በቃላትህ … በቃላትህ») ተጠብቋል፤ የሁለቱ ተደራጊ የፍርድ ግሶች ተቃርኖም በተፈጥሯዊ አማርኛ ተላልፏል።
