review_pass:
  verdict: revise
  source_fidelity: The repeated ἐκ τῶν λόγων σου is well represented by «በቃላትህ», and «ምክንያቱም» appropriately conveys γάρ. The first judicial expression substantially reflects δικαιωθήσῃ. However, «ይፈረድብሃል» means only that judgment will be rendered against/on you; it does not convey καταδικασθήσῃ, ‘you will be condemned.’
  naturalness: The draft is generally clear and uses an appropriate modern, dignified register. Replacing the final general judgment expression with «ትኮነናለህ» makes the deliberate forensic antithesis clear and natural.
  terminology: «ጻድቅ ተብለህ ትፈረዳለህ» preserves the judicial declaration intended by δικαιωθήσῃ without imposing a doctrinal formulation. «ትኮነናለህ» is the direct standard equivalent for καταδικασθήσῃ and preserves its contrast with the first clause.
  issues:
  - severity: high
    issue: The rendering of καταδικασθήσῃ is incomplete.
    rationale: «ይፈረድብሃል» can mean ‘judgment will be passed on you’ and lacks the source verb’s explicit sense of condemnation. The Greek establishes a direct contrast between being declared in the right and being condemned.
  revised_text: ምክንያቱም በቃላትህ ጻድቅ ተብለህ ትፈረዳለህ[a]፤ በቃላትህም ትኮነናለህ።
