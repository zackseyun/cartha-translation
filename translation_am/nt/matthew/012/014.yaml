  text: ⸂ἐξελθόντες δὲ οἱ Φαρισαῖοι συμβούλιον ἔλαβον κατ’ αὐτοῦ⸃ ὅπως αὐτὸν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/014.yaml
  text: But the Pharisees went out and conspired against him, how they might destroy him.
translation:
  language: am
  text: ነገር ግን ፈሪሳውያን ወጥተው፣ እንዴት ሊያጠፉት እንደሚችሉ በእርሱ ላይ ተማከሩ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሊገድሉት” ወይም “ለሞት ሊዳርጉት።” የግሪኩ ቃል “ሊያጠፉት” ይላል፤ በዚህ አውድ ግድያንም ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: ወጥተው
  rationale: የግሱን ቀዳሚና ተከታይ ድርጊት በተፈጥሯዊ የአማርኛ አያያዥ ግስ ያሳያል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከኢየሱስ ድርጊት ወደ ፈሪሳውያን ተቃራኒ ምላሽ የሚደረገውን ቀላል ንፅፅር ያሳያል።
- source_word: οἱ Φαρισαῖοι
  choice: ፈሪሳውያን
  rationale: በዘመናዊ መደበኛ አማርኛ የተለመደውን የቡድኑን ስም ይጠቀማል።
- source_word: συμβούλιον ἔλαβον
  choice: ተማከሩ
  rationale: ቃል በቃል ‘ምክር ያዙ’ የሚለውን ፈሊጥ በተፈጥሯዊና ክቡር አማርኛ ያቀርባል፤ የጥላቻው ዓላማ በቀጣዩ ሐረግ ግልጽ ስለሆነ ‘ተማማሉ’ ወይም ‘ሴራ ሠሩ’ ብሎ አያጠብብም።
- source_word: κατ’ αὐτοῦ
  choice: በእሱ ላይ
  rationale: κατά ከዘር ተሳቢ ጋር በዚህ አውድ ያለውን ተቃዋሚ ኃይል በቀጥታ ያሳያል።
- source_word: ὅπως
  choice: እንዴት … እንደሚችሉ
  rationale: የምክክራቸውን ይዘትና ዓላማ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἀπολέσωσιν
  choice: ሊያጠፉት
  rationale: የἀπόλλυμιን ሰፊ የ‘ማጥፋት’ ትርጉም ይጠብቃል፤ በአውዱ ግድያን ሊያመለክት ቢችልም ዋናው ጽሑፍ ከግሪኩ የበለጠ አያጠብበውም።
theological_decisions:
- issue: ἀπολέσωσιν ምን ያህል በተወሰነ ቃል እንደሚተረጎም
  choice: ሊያጠፉት
  alternative: ሊገድሉት / ለሞት ሊዳርጉት
  rationale: አውዱ ገዳይ ዓላማን በጽኑ ያመለክታል፤ ሆኖም የግሪኩ ግስ በቀጥታ ‘መግደል’ ከሚለው የሰፋ ነው። ስለዚህ ዋናው ጽሑፍ ሰፊውን አገላለጽ ይጠብቃል፣ የተወሰኑትም አማራጮች በማስታወሻ ይቀርባሉ።
translation_notes:
  register: ዘመናዊ፣ መደበኛና ክቡር አማርኛ ተጠቅሟል። ‘ተማከሩ’ የግሪኩን ፈሊጥ ተፈጥሯዊ አድርጎ ሲያቀርብ፣ የምክሩን ጠላትነት ከ‘በእሱ ላይ’ እና ከዓላማው ሐረግ ያሳያል።
