  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ἰδοὺ ὁ παῖς μου ὃν ᾑρέτισα, ὁ ἀγαπητός μου ⸂εἰς ὃν⸃ εὐδόκησεν ἡ ψυχή μου· θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν, καὶ κρίσιν τοῖς ἔθνεσιν ἀπαγγελεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/018.yaml
  text: Behold[a], my servant whom I have chosen, my beloved in whom my soul has delighted. I will put my Spirit upon him[c][b], and he will proclaim justice to the nations.
translation:
  language: am
  text: “እነሆ፣ የመረጥሁት አገልጋዬ፣ ነፍሴ ደስ የተሰኘችበት የምወደው፤ መንፈሴን በእርሱ ላይ አኖራለሁ፤ እርሱም ለአሕዛብ ፍትሕን[a] ያውጃል።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ፍርድን።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: እነሆ
  rationale: የትንቢታዊውን ጥቅስ ትኩረት ጠሪ ኃይልና ክብር ባለው፣ በአማርኛም የተለመደ አገላለጽ ይጠብቃል።
- source_word: παῖς
  choice: አገልጋዬ
  rationale: በኢሳይያስ የአገልጋዩ ዐውድ παῖς ማለት ‘አገልጋይ’ ነው፤ ‘ልጅ’ ብሎ መተርጎም በዚህ ቃል ያልተገለጠውን የወልድነት ሐሳብ ያስገባል።
- source_word: ᾑρέτισα
  choice: የመረጥሁት
  rationale: የተፈጸመውን የመለኮታዊ ምርጫ በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: ὁ ἀγαπητός μου
  choice: የምወደው
  rationale: የፍቅርንና የክብርን ኃይል በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: εὐδόκησεν ἡ ψυχή μου
  choice: ነፍሴ ደስ የተሰኘችበት
  rationale: ግሪኩ በግልጽ የያዘውን ‘ነፍሴ’ የሚለውን ርዕሰ ጉዳይ ሳያጠፋ፣ የደስታና የሞገስ ትርጉሙን ያቆያል።
- source_word: θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν
  choice: መንፈሴን በእርሱ ላይ አኖራለሁ
  rationale: የግሪኩን ‘በእርሱ ላይ’ ቅርጽና የትንቢታዊ ተልእኮ ቋንቋ ይጠብቃል።
- source_word: κρίσιν
  choice: ፍትሕን
  rationale: በዚህ የኢሳይያስ ተልእኮ ዐውድ የእግዚአብሔርን ቅን ሥርዓት ማምጣትና ማወጅ ያመለክታል፤ ‘ፍርድ’ የሚለው አማራጭ ግን በማስታወሻ ተጠብቋል።
- source_word: τοῖς ἔθνεσιν
  choice: ለአሕዛብ
  rationale: ቃሉ እስራኤል ያልሆኑትን ሕዝቦች የሚያመለክት ሲሆን፣ ‘አሕዛብ’ የትንቢታዊውን ዐውድና ሰፊ የተልእኮ ክልል ይጠብቃል።
- source_word: ἀπαγγελεῖ
  choice: ያውጃል
  rationale: ግሱ ያለውን ይፋዊና ሥልጣናዊ የማስታወቅ ኃይል ይገልጣል።
theological_decisions:
- issue: በπαῖς የተገለጠው የመሲሑ ማንነት
  choice: በኢሳይያስ የአገልጋዩ ጥቅስ መሠረት ‘አገልጋዬ’ ተብሏል።
  alternative: ልጄ
  rationale: ጥቅሱ ኢየሱስን በኢሳይያስ እንደተገለጠው አገልጋይ ያቀርባል። ይህ ምርጫ ከዚህ ቃል ብቻ የወልድነትን ትርጉም ሳያስገባ የብሉይ ኪዳኑን ትስስር ይጠብቃል።
- issue: κρίσις በትንቢታዊ ተልእኮው ዐውድ
  choice: በዋናው ጽሑፍ ‘ፍትሕ’ ተብሏል።
  alternative: ፍርድ
  rationale: በዐውዱ የአገልጋዩ ሥራ ለአሕዛብ የእግዚአብሔርን ቅን ሥርዓት ማወጅን ያጎላል። ሆኖም የግሪኩ ቃል ‘ፍርድ’ ሊልም ስለሚችል አማራጩ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የጥቅሱን ትንቢታዊ ድምፅ ለመጠበቅ ‘እነሆ’ እና ‘ያውጃል’ የሚሉ በመጠኑ ከፍ ያሉ ቃላት ተመርጠዋል።
