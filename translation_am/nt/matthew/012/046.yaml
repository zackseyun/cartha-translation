  text: Ἔτι ⸀δὲ αὐτοῦ λαλοῦντος τοῖς ὄχλοις ἰδοὺ ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ εἱστήκεισαν ἔξω ζητοῦντες αὐτῷ λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/046.yaml
  text: While he was still speaking to the crowds[a], behold, his mother and his brothers were standing outside, seeking to speak to him.
translation:
  language: am
  text: እርሱም ገና ለሕዝቡ እየተናገረ ሳለ፣ እነሆ፣ እናቱና ወንድሞቹ[a] ሊያነጋግሩት እየፈለጉ በውጭ ቆመው ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ ቃል በወንድ ጾታ ብዙ ቁጥር ሲሆን፣ እዚህ «ወንድሞቹ» ተብሎ ተተርጉሟል፤ ቃሉ በሰፊ ትርጉም የቅርብ ዘመዶችን የሚያመለክት ከሆነ፣ «የቅርብ ዘመዶቹ» ሊባል ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι δὲ αὐτοῦ λαλοῦντος
  choice: እርሱም ገና ... እየተናገረ ሳለ
  rationale: የድርጊቱን ቀጣይነትና የδέን ቀላል የትረካ ሽግግር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τοῖς ὄχλοις
  choice: ለሕዝቡ
  rationale: የግሪኩ ብዙ ቁጥር በዚህ ዐውድ ብዙ ሰዎችን በጋራ የሚያመለክተውን ተፈጥሯዊ የአማርኛ ስብስብ ስም በመጠቀም ተተርጉሟል።
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: አዲሱን የትረካ ክስተት በጉልህ የሚያሳየውን የትኩረት ምልክት ይጠብቃል።
- source_word: ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: እናቱና ወንድሞቹ
  rationale: የባለቤትነት ግንኙነቱን በተፈጥሯዊ አማርኛ ያቀርባል፤ ἀδελφοί ወንድ ብዙ ቁጥር በመሆኑ በዋናው ጽሑፍ «ወንድሞቹ» ተብሏል።
- source_word: εἱστήκεισαν ἔξω
  choice: በውጭ ቆመው ነበር
  rationale: የፍጹም ያለፈው ጊዜ ቅርጽ የሚያሳየውን ቀጣይ አቋም ያስተላልፋል፤ በግሪኩ ያልተገለጸውን «ቤት» አይጨምርም።
- source_word: ζητοῦντες αὐτῷ λαλῆσαι
  choice: ሊያነጋግሩት ፈልገው
  rationale: ዓላማ ያለውን ጥረት በተፈጥሯዊ አማርኛ ይገልጣል፤ «ሊያነጋግሩት» ከእርሱ ጋር ለመናገር መፈለጋቸውን ያሳያል።
theological_decisions:
- issue: ἀδελφοί ከኢየሱስ ቤተሰብ ጋር በተያያዘ እንዴት እንደሚተረጎም
  choice: ወንድሞቹ
  alternative: የቅርብ ዘመዶቹ
  rationale: የግሪኩ ቃል ወንድ ብዙ ቁጥር ስለሆነ የጽሑፉን የቃል ገጽታ በቀጥታ ለማቅረብ «ወንድሞቹ» ተመርጧል። ይህ ትርጉም ትክክለኛውን የዝምድና ዓይነት በሚመለከት የኋላ ዘመን ሥነ መለኮታዊ ክርክሮችን አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «እነሆ» የትረካውን ድንገተኛ ትኩረት ይጠብቃል፤ የግሪኩን የቁጥር ልዩነት በአማርኛ ተፈጥሯዊነት እንዲቀርብ «ለሕዝቡ» ተመርጧል።
