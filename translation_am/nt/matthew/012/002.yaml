id: MAT.12.2
reference: Matthew 12:2
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἰδόντες εἶπαν αὐτῷ· Ἰδοὺ οἱ μαθηταί σου ποιοῦσιν ὃ οὐκ ἔξεστιν ποιεῖν ἐν σαββάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/002.yaml
  text: But when the Pharisees saw it[a], they said to him, “Look, your disciples are doing what is not lawful to do on the Sabbath.”
translation:
  language: am
  text: ፈሪሳውያን ግን ይህን ባዩ ጊዜ፣ “እነሆ፣ ደቀ መዛሙርትህ በሰንበት ማድረግ ያልተፈቀደውን እያደረጉ ነው” አሉት።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በሰንበት ሕጋዊ ያልሆነውን እያደረጉ ነው።”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ግን
  rationale: ከቀደመው ትረካ ጋር ያለውን ተቃርኖ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἰδόντες
  choice: ይህን ባዩ ጊዜ
  rationale: የአኦሪስት አጋዥ ግሱን በጊዜ አያያዥ ሐረግ ይተረጉማል፤ ‘ይህን’ የሚለውም ከዐውደ ንባቡ የሚታወቀውን የደቀ መዛሙርቱን ድርጊት ያመለክታል።
- source_word: εἶπαν αὐτῷ
  choice: አሉት
  rationale: ቀጥተኛና ተፈጥሯዊ የአማርኛ የንግግር ቀመር ነው።
- source_word: Ἰδοὺ
  choice: እነሆ
  rationale: ወደ ክሱ ትኩረት የሚስበውን አመልካች ቃል በክቡርና በተለመደ መጽሐፍ ቅዱሳዊ አማርኛ ያቀርባል።
- source_word: μαθηταί
  choice: ደቀ መዛሙርት
  rationale: የመምህርና የተማሪ ግንኙነቱን የሚጠብቅ የወንጌላት የተለመደ ቃል ነው።
- source_word: ποιοῦσιν ... ποιεῖν
  choice: እያደረጉ ... ማድረግ
  rationale: በግሪኩ ያለውን የποιέω ድግግሞሽ በአማርኛም በተፈጥሯዊ መልኩ ይጠብቃል።
- source_word: ὃ οὐκ ἔξεστιν
  choice: ያልተፈቀደውን
  rationale: ἔξεστιν የሚያመለክተውን ሕጋዊ ፈቃድ ወይም መፈቀድ ያስተላልፋል፤ የክሱን ምንጭ ግን አይወስንም።
- source_word: ἐν σαββάτῳ
  choice: በሰንበት
  rationale: የጊዜ አገላለጹንና ሰንበትን እንደ የተወሰነ ቀን/ሥርዓት የሚያሳየውን ትርጉም በተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: የፈሪሳውያን ክስ ባሕርይ
  choice: ἔξεστινን ‘ያልተፈቀደ’ በሚል ሕጋዊና የፈቃድ አገላለጽ መተርጎም፣ ጉዳዩ የመጽሐፍ ሕግ ወይም የፈሪሳውያን ወግ መሆኑን ሳይወስን
  alternative: ሕገ ወጥ የሆነውን
  rationale: ጥቅሱ ክሱን ያቀርባል እንጂ ትክክለኛነቱን ወይም የሕጉን ምንጭ አይወስንም፤ ይህ አተረጓጎም የትረካውንና የነገረ መለኮት ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘እነሆ’ እና ‘ደቀ መዛሙርት’ የታወቁ መጽሐፍ ቅዱሳዊ ቃላት ሲሆኑ አሁንም በስፋት የሚገቡ ናቸው።
