  rationale: የግሪኩን ‘የእግዚአብሔር ቤት’ አገላለጽ ሳይተካ የመግባትን ድርጊት በግልጽ ያቀርባል።
- source_word: τοὺς ἄρτους τῆς προθέσεως
  choice: በእግዚአብሔር ፊት የቀረበውን ኅብስት
  rationale: ለእግዚአብሔር ተለይቶ በፊቱ የሚቀርበውን ቅዱስ ኅብስት በዘመናዊና ሊገባ በሚችል አማርኛ ይገልጣል፤ ባህላዊው ስያሜ በእግር ማስታወሻ ቀርቧል።
- source_word: ἔφαγον
  choice: እንደበሉ
  rationale: የSBLGNTን ብዙ ቁጥር ንባብ ይከተላል፤ ነጠላው ንባብ በእግር ማስታወሻ ተጠብቋል።
- source_word: ὃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν
  choice: ያንንም እርሱም ሆነ … መብላት በሕግ ያልተፈቀደላቸው
  rationale: ἐξόν ያለውን የሕግና የአምልኮ ፈቃድ ኃይል ‘በሕግ ያልተፈቀደ’ በማለት ይጠብቃል።
- source_word: οὐδὲ τοῖς μετ’ αὐτοῦ
  choice: እርሱም ሆነ ከእርሱ ጋር የነበሩት
  rationale: ዳዊትንና አብረውት የነበሩትን በቅርብና ተፈጥሯዊ አገላለጽ ያካትታል።
- source_word: εἰ μὴ τοῖς ἱερεῦσιν μόνοις
  choice: ለካህናት ብቻ የተፈቀደ
