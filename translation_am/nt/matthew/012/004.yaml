base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/004.yaml
  text: how he entered into the house of God and ate the bread of the Presence[a], which it was not lawful for him to eat, nor for those with him[b], but only for the priests?
translation:
  language: am
  text: እንዴት ወደ እግዚአብሔር ቤት እንደገባ፣ በእግዚአብሔር ፊት የሚቀመጠውን ኅብስት[a] እርሱና ከእርሱ ጋር የነበሩት እንደበሉ[b]፤ ይህንም መብላት ለእርሱም ሆነ ከእርሱ ጋር ለነበሩት በሕግ ያልተፈቀደ፣ ለካህናት ብቻ እንጂ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በባህላዊ አጠራር «የፊት ኅብስት»፤ ይህም ተቀድሶ በእግዚአብሔር ፊት የሚቀመጠውን ኅብስት ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: አንዳንድ የጽሑፍ ምስክሮች «እንደበላ» የሚለውን ነጠላ ቁጥር ይዘዋል።
    reason: textual_variant
