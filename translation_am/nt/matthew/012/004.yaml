  alternative: ነጠላ ቁጥር ‘እንደበላ’
  rationale: የቀረበው SBLGNT ἔφαγον የሚለውን ብዙ ቁጥር ያትማል፤ ነጠላው ንባብ የአንቀጹን ባለቤት ስለሚለውጥ በእግር ማስታወሻ ተጠብቋል።
