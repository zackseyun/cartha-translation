  text: εἰ δὲ ἐγνώκειτε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν, οὐκ ἂν κατεδικάσατε τοὺς ἀναιτίους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/007.yaml
  text: But if you had known what this means[b][a], ‘I desire mercy and not sacrifice,’ you would not have condemned the guiltless.
translation:
  language: am
  text: ነገር ግን፣ “ምሕረትን እፈልጋለሁ፤ መሥዋዕትን ግን አልፈልግም” የሚለው ምን ማለት እንደሆነ[a] ብታውቁ ኖሮ፣ ንጹሐንን[b] ባልኮነናችኋቸው ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ኢየሱስ ሆሴዕ 6፥6ን ጠቅሷል።
    reason: cross_reference
  - marker: b
    text: ወይም፣ “ጥፋት የሌለባቸውን።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκειτε
  choice: ብታውቁ ኖሮ
  rationale: ከእውነታው ተቃራኒ የሆነውን ያለፈ ጊዜ ሁኔታዊ ንግግር በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τί ἐστιν
  choice: ምን ማለት እንደሆነ
  rationale: የተጠቀሰውን የመጽሐፍ ቃል ትርጉም መረዳትን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Ἔλεος
  choice: ምሕረት
  rationale: የርኅራኄንና የቃል ኪዳን ታማኝ ፍቅርን የሚያመለክተውን ሰፊ ትርጉም ሳያጠብ የተለመደውን መጽሐፍ ቅዱሳዊ ቃል ይጠቀማል።
- source_word: θέλω
  choice: እፈልጋለሁ
  rationale: የአምላክን ፈቃድና ምርጫ በግልጽ፣ በዘመናዊ አማርኛ ያስተላልፋል።
- source_word: θυσίαν
  choice: መሥዋዕት
  rationale: የሥርዓታዊ መባን ሐሳብ በቀጥታ የሚያስተላልፍ የተለመደ ቃል ነው።
- source_word: κατεδικάσατε
  choice: ባልፈረዳችሁባቸውም ነበር
  rationale: የፍርድ ቤታዊ ውግዘትን እና ከእውነታው ተቃራኒውን የሁኔታ ውጤት በአማርኛ በግልጽ ይገልጣል።
- source_word: ἀναιτίους
  choice: ንጹሐንን
  rationale: በዐውዱ ያለውን የወንጀል አልባነት እና የፍርድ ቃና ይጠብቃል፤ “ኃጢአት የሌለባቸው” ማለት እንዳልሆነ አማራጩ በማስታወሻ ተገልጧል።
theological_decisions:
- issue: የሆሴዕ 6፥6 ጥቅስ ምሕረትን ከመሥዋዕት ጋር የሚያነጻጽርበት መንገድ
  choice: “ምሕረትን እፈልጋለሁ መሥዋዕትንም አይደለም”
  alternative: “ምሕረትን እፈልጋለሁ፣ መሥዋዕትን ግን አልፈልግም”
  rationale: የግሪኩን ሹል ንጽጽር ይጠብቃል፤ ሆኖም ጥቅሱ በቃል ኪዳኑ ዐውድ ውስጥ መሥዋዕትን ሙሉ በሙሉ መሻሩን ወይም ምሕረትን ከሥርዓት በላይ ማስቀደሙን ብቻ የሚያመለክት መሆኑን በትርጉም አስገድዶ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው አማርኛ ተጠቅሟል። የትንቢታዊው ጥቅስ ከፍ ያለ ቃና እንዲኖረው “ምሕረት” እና “መሥዋዕት” የተባሉት የተለመዱ መጽሐፍ ቅዱሳዊ ቃላት ተጠብቀዋል።
