    issue: The main text uses «በዚህ» for ὧδε.
    rationale: Although understandable, «በዚህ» normally invites a following noun or qualifier in modern Amharic. «እዚህ» directly and idiomatically conveys ‘here’; the fuller «በዚህ ስፍራ» remains suitable as the lexical-alternative note.
