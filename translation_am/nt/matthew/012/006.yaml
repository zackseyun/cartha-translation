  text: እኔ ግን እላችኋለሁ፤ ከቤተ መቅደሱ የሚበልጥ ነገር እዚህ አለ[a][b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ከቤተ መቅደሱ የሚበልጥ ሰው እዚህ አለ» ወይም «ከቤተ መቅደሱ የሚበልጥ አንድ እዚህ አለ።» ግሪኩ «የሚበልጥ» ተብሎ ሊተረጎም የሚችል ገለልተኛ ቅርጽ ስለሚጠቀም፣ ተጠቃሹን በግልጽ አይገልጽም።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ «በዚህ ስፍራ።»
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: እኔ ግን እላችኋለሁ
  rationale: የቀጥታ ንግግሩን ተፈጥሯዊ በሆነ ዘመናዊ አማርኛ ያቀርባል፤ δέ ከቀደመው ሐሳብ ጋር ያለውን መጠነኛ ንጽጽር «ግን» ይጠብቃል።
- source_word: ὅτι
  choice: በቀጥታ ከተከታዩ የንግግር ይዘት ጋር ተዋህዷል
  rationale: አማርኛ ከ«እላችኋለሁ» በኋላ የንግግሩን ይዘት ያለ ተጨማሪ አገናኝ በተፈጥሮ ሊያቀርብ ይችላል።
- source_word: τοῦ ἱεροῦ
  choice: ከቤተ መቅደሱ
  rationale: ἱερόν በዚህ አውድ የቤተ መቅደሱን ግቢ ጨምሮ መላውን የቤተ መቅደስ ስፍራ ያመለክታል፤ «ቤተ መቅደስ» ተፈጥሯዊና የተለመደ አማርኛ ነው።
- source_word: μεῖζόν
  choice: የሚበልጥ ነገር
  rationale: ግሪኩ ገለልተኛ ነጠላ ንጽጽር ቅርጽ ስለሚጠቀም ተጠቃሹን በግልጽ «ሰው» ብሎ አይወስንም፤ «ነገር» ይህን ሰዋሰዋዊ አለመወሰን በዋናው ጽሑፍ ይጠብቃል።
- source_word: ἐστιν
  choice: አለ
  rationale: ከὧδε ጋር የመገኘትን ሐሳብ በተፈጥሯዊ አማርኛ የሚገልጽ ቀላል የአሁን ጊዜ ግስ ነው።
- source_word: ὧδε
  choice: በዚህ
  rationale: «እዚህ» ወይም «በዚህ ስፍራ» የሚለውን ቦታዊ ትርጉም አጭርና ተፈጥሯዊ በሆነ መንገድ ያቀርባል።
theological_decisions:
- issue: በገለልተኛው ንጽጽር μεῖζόν ያልተገለጸው ተጠቃሽ ማንነት
  choice: በዋናው ጽሑፍ «የሚበልጥ ነገር» ብሎ መተርጎም
  alternative: «የሚበልጥ ሰው» ወይም «የሚበልጥ አንድ»
  rationale: አውዱ ወደ ኢየሱስና ወደ ሥልጣኑ በጽኑ ቢያመለክትም፣ ግሪኩ የወንድ ፆታ ቅርጽ ሳይሆን ገለልተኛ ቅርጽ ይጠቀማል። ስለዚህ ትርጉሙ ተጠቃሹን በዋናው ጽሑፍ ከምንጩ በላይ አይወስንም።
