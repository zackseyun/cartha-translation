  terminology: “የነነዌ ወንዶች” preserves ἄνδρες; “ንስሐ ገብተዋል” accurately conveys μετενόησαν; and “ስብከት” is an appropriate rendering of κήρυγμα. The main text wisely avoids resolving the neuter πλεῖον as exclusively a male person.
