    text: ወይም፣ “ለዮናስ አዋጅ ምላሽ በመስጠት።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ከዮናስ የሚበልጥ አንድ ሰው እዚህ አለ።” የግሪኩ አገላለጽ ገለልተኛ ጾታ ያለው ሲሆን ቃል በቃል “ከዮናስ የሚበልጥ ነገር” ይላል፤ ይህም የሰዎችን ንጽጽር ብቻ ሳይሆን በኢየሱስ የተገኘውን የላቀ እውነታ ሊያጎላ ይችላል።
    reason: alternative_reading
