  text: τότε πορεύεται καὶ παραλαμβάνει μεθ’ ἑαυτοῦ ἑπτὰ ἕτερα πνεύματα πονηρότερα ἑαυτοῦ, καὶ εἰσελθόντα κατοικεῖ ἐκεῖ· καὶ γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων. οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/045.yaml
  text: Then it goes and brings with itself seven other spirits more evil than itself[a], and they enter and live there; and the last state of that man becomes worse than the first[b]. So it will be also with this evil generation.
translation:
  language: am
  text: ከዚያም ሄዶ ከራሱ ይልቅ የከፉ ሌሎች ሰባት መናፍስትን ከራሱ ጋር ይዞ ይመጣል፤[a] እነርሱም ገብተው በዚያ ይኖራሉ። የዚያም ሰው የመጨረሻ ሁኔታ ከቀድሞው የከፋ ይሆናል።[b] በዚህ ክፉ ትውልድም እንዲሁ ይሆናል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከራሱ ይልቅ የከፉ ሰባት የተለዩ መናፍስትን።”
    reason: lexical_alternative
  - marker: b
    text: በግሪክኛ ቃል በቃል፣ “የዚያ ሰው የመጨረሻዎቹ ነገሮች ከመጀመሪያዎቹ የከፉ ይሆናሉ።” ይህም የመጨረሻ ሁኔታው ከቀድሞ ሁኔታው የከፋ ይሆናል ማለት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε πορεύεται
  choice: ከዚያም ሄዶ
  rationale: τότε የትረካውን ቀጣይ ደረጃ ያመለክታል፤ የግሪክኛውን ሕያው የአሁን ጊዜ አገላለጽ በተፈጥሯዊ አማርኛ የድርጊት ቅደም ተከተል ተተርጉሟል።
- source_word: παραλαμβάνει μεθ’ ἑαυτοῦ
  choice: ከእርሱ ጋር ይዞ ይመጣል
  rationale: ግሱ አብሮ መውሰድን ወይም ይዞ መምጣትን ያመለክታል፤ በአማርኛ የእንቅስቃሴውና የአብሮነቱ ሐሳብ በግልጽ ተጠብቋል።
- source_word: ἑπτὰ ἕτερα πνεύματα
  choice: ሌሎች ሰባት መናፍስት
  rationale: ἕτερα ከመጀመሪያው መንፈስ በተጨማሪ ያሉትን ያመለክታል፤ “ሌሎች” ይህን በቀጥታ ያሳያል። πνεύματα ደግሞ “መናፍስት” ተብሎ ተጠብቋል።
- source_word: πονηρότερα ἑαυτοῦ
  choice: ከራሱ ይልቅ የከፉ
  rationale: የንጽጽር ቅርጹንና የሞራል ክፋት ሐሳቡን በተለመደ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: εἰσελθόντα κατοικεῖ ἐκεῖ
  choice: እነርሱም ገብተው በዚያ ይኖራሉ
  rationale: የመግባትና በዚያ መኖር ቅደም ተከተል በተፈጥሯዊ የአማርኛ ግንባታ ተገልጿል። በጽሑፉ ያለው ነጠላ κατοικεῖ ከብዙ መናፍስት ጋር በዐውዱ ስለሚዛመድ፣ ትርጉሙ ብዙ ቁጥርን ተከትሏል።
- source_word: τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου
  choice: የዚያ ሰው የመጨረሻ ሁኔታ
  rationale: የግሪክኛው ፈሊጣዊ አገላለጽ የሰውየውን የመጨረሻ ሁኔታ ያመለክታል፤ “ሁኔታ” የሚለው ቃል ትርጉሙን በግልጽ ያቀርባል፣ ቃል በቃሉም በማስታወሻ ተጠብቋል።
- source_word: χείρονα τῶν πρώτων
  choice: ከቀድሞው የከፋ
  rationale: የመጨረሻውንና የቀድሞውን ሁኔታ ንጽጽር በአጭርና በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ
  choice: ለዚህ ክፉ ትውልድም እንዲሁ ይሆንበታል
  rationale: ምሳሌያዊውን ሁኔታ በዚህ ትውልድ ላይ የሚተገብረውን የንጽጽር አገናኝ ግልጽ ያደርጋል።
theological_decisions:
- issue: πνεύματα በአጋንንታዊው ዐውድ የሚተረጎምበት መንገድ
  choice: መናፍስት
  alternative: አጋንንት
  rationale: ግሪክኛው “መናፍስት” ይላል፣ የቅርብ ዐውዱም ርኩስ መንፈስ መሆናቸውን ያስረዳል። ስለዚህ ከጽሑፉ የበለጠ የተወሰነ ቃል ሳይጨመር የምንጩ አገላለጽ ተጠብቋል።
- issue: τοῦ ἀνθρώπου ἐκείνου የጾታ አገላለጽ
  choice: የዚያ ሰው
  alternative: የዚያ ሰውዬ
  rationale: “ሰው” በዘመናዊ አማርኛ ክብር ያለውና ተፈጥሯዊ አገላለጽ ሲሆን፣ የነጠላውን ተወካይ ምሳሌ ይጠብቃል።
- issue: τὰ ἔσχατα ... τῶν πρώτων የሚያመለክተው ፈሊጥ
  choice: የመጨረሻ ሁኔታ ... ከቀድሞው
  alternative: የመጨረሻዎቹ ነገሮች ... ከመጀመሪያዎቹ
  rationale: ዋናው ጽሑፍ ፈሊጡን ለአንባቢ ግልጽ አድርጎ ይተረጉማል፤ የቃል በቃል አወቃቀሩ ግን በማስታወሻ ተቀምጦ የምንጩን ቅርጽ ያሳያል።
