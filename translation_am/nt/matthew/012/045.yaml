  source_fidelity: The draft accurately retains the sequence, seven additional spirits, their greater evil, entry and residence, the idiom of a worsened final condition, and the application to the evil generation. However, the reflexive accompaniment μεθ’ ἑαυτοῦ should not be rendered ከእርሱ ጋር, which can point to the man rather than to the spirit itself.
