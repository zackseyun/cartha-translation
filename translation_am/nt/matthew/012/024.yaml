id: MAT.12.24
reference: Matthew 12:24
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἀκούσαντες εἶπον· Οὗτος οὐκ ἐκβάλλει τὰ δαιμόνια εἰ μὴ ἐν τῷ Βεελζεβοὺλ ἄρχοντι τῶν δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/024.yaml
  text: But when the Pharisees heard it[a], they said, “This man does not cast out demons except by Beelzebul, the ruler of the demons.”
translation:
  language: am
  text: ፈሪሳውያን ግን ይህን ሰምተው፣ “ይህ ሰው አጋንንትን የሚያስወጣው በአጋንንት ገዥው ብኤልዜቡል[a] ብቻ ነው” አሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ብኤልዜቡል፦ በትውፊታዊ አጠራር “ብኤልዜቡብ።”
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: ግን
  rationale: ከቀደመው የሕዝቡ ምላሽ ጋር ያለውን ተቃርኖ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἀκούσαντες
  choice: ይህን ሰምተው
  rationale: የግሪኩን የቀደመ ድርጊት ያሳያል፤ ከአውዱ የሚገባው ተሳቢም ‘ይህን’ ተብሎ በግልጽ ቀርቧል።
- source_word: Οὗτος
  choice: ይህ ሰው
  rationale: የአመልካቹን ንቀት የተቀላቀለበት የጥላቻ አነጋገር ሳያጋንን ይጠብቃል።
- source_word: ἐκβάλλει
  choice: ያስወጣል
  rationale: በአጋንንት ማስወጣት አውድ የተለመደ፣ ግልጽና ተፈጥሯዊ አማርኛ ነው።
- source_word: δαιμόνια
  choice: አጋንንት
  rationale: በወንጌላት አውድ የተለመደውና ቀጥተኛው አማርኛ ትርጉም ነው።
- source_word: εἰ μὴ
  choice: እንጂ በሌላ አይደለም
  rationale: የተናጋሪዎቹን ብቸኛ የኃይል ምንጭ ክስ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐν τῷ Βεελζεβοὺλ
  choice: በብኤልዜቡል
  rationale: ἐν በዚህ አውድ መሣሪያን ወይም ወኪልነትን ያመለክታል፤ ‘በ’ የሚለው ይህን ያለ ትርጓሜ ጭማሪ ይገልጣል።
- source_word: Βεελζεβοὺλ
  choice: ብኤልዜቡል
  rationale: በSBLGNT ያለውን የግሪክ ስም ቅርጽ ይከተላል፤ የተለመደው ሌላ ቅርጽ በእግር ማስታወሻ ተጠብቋል።
- source_word: ἄρχοντι τῶν δαιμονίων
  choice: በአጋንንት ገዥ
  rationale: ἄρχων የሥልጣንና የገዥነት ሐሳብ አለው፤ ‘ገዥ’ ቀላልና ትክክለኛ ዘመናዊ አማርኛ ነው።
theological_decisions:
- issue: የጥላቻ አመልካች Οὗτος አተረጓጎም
  choice: ይህ ሰው
  alternative: እርሱ
  rationale: ፈሪሳውያኑ ስለ ኢየሱስ የተናገሩበትን የንቀት ቃና ይጠብቃል፤ ተጨማሪ የእምነት ትርጓሜ አያስገባም።
- issue: የስሙ Βεελζεβούλ ቅርጽ
  choice: ብኤልዜቡል
  alternative: ብኤልዜቡብ
  rationale: ዋናው ጽሑፍ በግሪክ ምንጭ ያለውን Βεελζεβούλ ይከተላል፤ በትውፊት የተለመደው ቅርጽ ግን በእግር ማስታወሻ ተጠብቋል።
- issue: ἐν የሚያመለክተው የኃይል ወይም የወኪልነት ግንኙነት
  choice: በብኤልዜቡል
  alternative: በብኤልዜቡል ኃይል
  rationale: ‘በ’ የሚለው የግሪኩን አሻሚነት ይጠብቃል፤ ‘ኃይል’ በማከል ጽሑፉን አላስፋፋንም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የፈሪሳውያኑ የጥላቻ ቃና በ‘ይህ ሰው’ ተጠብቋል፤ አረፍተ ነገሩ ለተራ አንባቢ ተፈጥሯዊ እንዲሆን የአማርኛ ሥርዓት ተከትሏል።
