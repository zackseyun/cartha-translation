id: MAT.12.49
reference: Matthew 12:49
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα αὐτοῦ ἐπὶ τοὺς μαθητὰς αὐτοῦ εἶπεν· Ἰδοὺ ἡ μήτηρ μου καὶ οἱ ἀδελφοί μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/049.yaml
  text: And stretching out his hand toward his disciples[a], he said, “Behold[b], my mother and my brothers.”
translation:
  language: am
  text: እጁንም ወደ ደቀ መዛሙርቱ ዘርግቶ፣ “እነሆ፣[a] እናቴና ወንድሞቼ![b]” አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “እዩ” ወይም “ተመልከቱ።”
    reason: lexical_alternative
  - marker: b
    text: ግሪክኛው “ወንድሞች” ይላል፤ ተባዕታይ ብዙ ቁጥሩ እዚህ “ወንድሞችና እህቶች” ተብሎ ሳይስፋፋ እንዳለ ተጠብቋል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκτείνας
  choice: ዘርግቶ
  rationale: ዋናውን ግስ የሚቀድመውን የተከታይ ድርጊት በተፈጥሯዊ አማርኛ ያሳያል፤ ኢየሱስ እጁን የዘረጋበትን አካላዊ ምልክትም ይጠብቃል።
- source_word: χεῖρα
  choice: እጁን
  rationale: በዚህ የአካላዊ ምልክት አውድ ውስጥ የተለመደውን ‘እጅ’ የሚለውን ትርጉም ይሰጣል።
- source_word: ἐπὶ
  choice: ወደ
  rationale: ከተሳቢ ቅርጽ ጋር በዚህ አውድ እጁ የተዘረጋበትን አቅጣጫ ያመለክታል።
- source_word: μαθητὰς
  choice: ደቀ መዛሙርቱ
  rationale: በወንጌላት ውስጥ ያለውን የመምህርና የተማሪ ግንኙነት የሚጠብቅ የተለመደ መጽሐፍ ቅዱሳዊ ቃል ነው።
- source_word: Ἰδοὺ
  choice: እነሆ
  rationale: ትኩረትን የሚስብና አጽንዖት የሚሰጥ የግሪኩን ቃል በክቡርና በተለመደ አማርኛ ያስተላልፋል።
- source_word: μήτηρ
  choice: እናቴ
  rationale: የተለመደውን ቀጥተኛ የዝምድና ቃል ይጠብቃል።
- source_word: ἀδελφοί
  choice: ወንድሞቼ
  rationale: የግሪኩን ተባዕታይ ብዙ ቁጥር በቀጥታ ይጠብቃል፤ በቅርብ አውዱም ከቃል በቃል የቤተሰብ ቃላት ጋር ይነጻጸራል።
theological_decisions:
- issue: ኢየሱስ ዝምድናን እንደገና በሚገልጽበት ንግግር ውስጥ የቤተሰብ ቃላት አተረጓጎም
  choice: “እናቴ” እና “ወንድሞቼ” የሚሉትን ቀጥተኛ የዝምድና ቃላት መጠበቅ
  alternative: እንደ “ቤተሰቦቼ” ወይም “ወንድሞቼና እህቶቼ” በሚል አካታች ሐረግ መተርጎም
  rationale: ቁጥሩ ደቀ መዛሙርቱን ከእውነተኛ ቤተሰቡ ጋር ለማመሳሰል ተጨባጭ የዝምድና ቃላትን ሆን ብሎ ይጠቀማል። ሰፊ የሆነ አባባል ይህን የንግግሩን ኃይል ሊያለዝብና በግሪኩ ያልተገለጸ ትርጓሜ ሊጨምር ይችላል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “ደቀ መዛሙርት” እና “እነሆ” መጽሐፍ ቅዱሳዊ ክብርን ሲጠብቁ በዘመናዊ አንባቢዎችም ዘንድ የሚታወቁ ናቸው።
