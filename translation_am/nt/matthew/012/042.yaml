  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτήν· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/042.yaml
  text: The queen of the South will rise up in the judgment with this generation and will condemn it[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: am
  text: የደቡብ ንግሥት[b] በፍርዱ ጊዜ ከዚህ ትውልድ ጋር ትነሣለች፤ ትኮንነዋለች። ምክንያቱም እርሷ የሰሎሞንን ጥበብ ለመስማት ከምድር ዳርቻዎች መጥታለች፤ እነሆ፣ ከሰሎሞን የሚበልጥ ነገር[a] እዚህ አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ‘ከሰሎሞን የሚበልጥ ሰው እዚህ አለ።’ ግሪኩ ገለልተኛ ጾታ ያለውን ቅርጽ (‘የሚበልጥ ነገር’) ይጠቀማል፤ ይህም በኢየሱስና በአገልግሎቱ የተገለጠውን እጅግ የላቀ ታላቅነት ሊያጎላ ይችላል።
    reason: alternative_reading
  - marker: b
    text: ‘የደቡብ ንግሥት’ የሚለው አገላለጽ የሳባን ንግሥት ያመለክታል (1 ነገሥት 10፥1–13፤ 2 ዜና መዋዕል 9፥1–12)፤ የግሪኩ ጽሑፍ ግን ‘ሳባ’ ብሎ በስም አይጠቅሳትም።
    reason: cross_reference
