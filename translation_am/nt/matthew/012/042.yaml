  rationale: κατακρίνω የሚያመለክተውን የኩነኔ ፍርድ በትክክል ይገልጣል፤ ‘ው’ የሚለው ተውላጠ ስም ወደ ‘ይህ ትውልድ’ ይመለሳል።
