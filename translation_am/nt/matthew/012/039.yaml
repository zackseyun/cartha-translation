review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the moral characterization, the request for a sign, and the exception of Jonah’s sign. However, the final phrase uses an awkward double ከ construction (ከነቢዩ ከዮናስ ምልክት) and should be recast as a single natural genitive phrase. The future passive is more clearly represented by አይሰጠውም in this context, but the revised word order makes the exception unambiguous.
  naturalness: Most of the verse is clear modern standard Amharic. “ከነቢዩ የዮናስ ምልክት በቀር” is idiomatic and avoids the unnatural repeated preposition in the draft.
  terminology: ትውልድ, ክፉ, አመንዝራ, and ምልክት are suitable. አመንዝራ retains the Greek’s prophetic and morally charged ambiguity without reducing it to a doctrinal interpretation. የነቢዩ ዮናስ ምልክት preserves the unelaborated expression “the sign of Jonah the prophet.”
  issues:
  - severity: medium
    issue: The phrase “ከነቢዩ ከዮናስ ምልክት በቀር” contains a redundant and unnatural double ከ.
    rationale: Greek has a genitive apposition, Ἰωνᾶ τοῦ προφήτου (“Jonah the prophet”), not two prepositionally governed nouns. In Amharic, “ከነቢዩ የዮናስ ምልክት በቀር” naturally expresses “except the sign of Jonah the prophet.”
