base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/020.yaml
  text: He will not break a bruised reed[a], and he will not extinguish a smoldering wick[b], until he brings justice to victory.
translation:
  language: am
  text: የተቀጠቀጠ ሸምበቆን አይሰብርም፤ ጢስ የሚያወጣ የመብራት ክርንም[a] አያጠፋም፤ ፍትሕን[b] ወደ ድል እስኪያደርስ ድረስ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ጢስ የሚያወጣ ተልባን አያጠፋም።” የግሪኩ ቃል በቀጥታ ተልባን ይጠቅሳል፤ እዚህ ግን ለመብራት ክር የሚያገለግል ተልባን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ፍርድን ወደ ድል እስኪያወጣ ድረስ።”
    reason: alternative_reading
lexical_decisions:
- source_word: κάλαμον
  choice: ሸምበቆ
  rationale: κάλαμος በዚህ ትንቢታዊ ምስል ውስጥ ሸምበቆን ያመለክታል፤ ይህም በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: συντετριμμένον
  choice: የተጎዳን
  rationale: ቃሉ የተቀጠቀጠውን ወይም የተደቆሰውን ያመለክታል፤ ‘የተጎዳ’ ሸምበቆው የተዳከመ እንጂ ገና ሙሉ በሙሉ ያልተሰበረ መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: κατεάξει
  choice: አይሰብርም
  rationale: κατάγνυμι መስበርን ወይም በቅንጥስ ማድረግን ያመለክታል፤ ‘አይሰብርም’ ቀጥተኛና ግልጽ ነው።
- source_word: λίνον
  choice: የመብራት ክር
  rationale: λίνον በቀጥታ ተልባን ወይም ከተልባ የተሠራ ክርን ቢያመለክትም፣ በዚህ ምስል ውስጥ የዘይት መብራት ክር ነው። ‘የመብራት ክር’ ለዘመናዊ አንባቢ የታሰበውን ነገር ግልጽ ያደርጋል።
- source_word: τυφόμενον
  choice: ጢስ የሚያወጣን
  rationale: τύφομαι ሊጠፋ የተቃረበ የመብራት ክር ጢስ ማውጣቱን ይገልጣል፤ ይህ አተረጓጎም ምስሉን በግልጽ አማርኛ ያቀርባል።
- source_word: σβέσει
  choice: አያጠፋም
  rationale: σβέννυμι እሳትን ወይም መብራትን ማጥፋት ማለት ነው፤ ‘አያጠፋም’ በአማርኛ የተለመደና ትክክለኛ ነው።
- source_word: ἕως ἂν
  choice: እስኪ… ድረስ
  rationale: ይህ አወቃቀር ወደፊት ያለውን ግብ የጊዜ ወሰን ያሳያል፤ ‘እስኪ… ድረስ’ ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
- source_word: ἐκβάλῃ
  choice: እስኪያደርስ
  rationale: ἐκβάλλω በቀጥታ ማውጣትን ቢያመለክትም፣ ከεἰς νῖκος ጋር በዚህ አውድ ፍትሕን ወደ ድል ማድረስን ይገልጣል።
- source_word: εἰς νῖκος
  choice: ወደ ድል
  rationale: ሐረጉ የተሳካ ውጤትን ወይም ድልን ያመለክታል፤ ‘ወደ ድል’ የአቅጣጫና የግብ ኃይሉን ይጠብቃል።
- source_word: τὴν κρίσιν
  choice: ፍትሕን
  rationale: κρίσις ‘ፍርድ’ ወይም ‘ፍትሕ’ ሊሆን ይችላል። በኢሳይያስ የአገልጋዩ አውድ የጽድቅ ሥርዓትን ማቋቋም ስለሚያመለክት ‘ፍትሕ’ ተመርጧል፤ ‘ፍርድ’ በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: በኢሳይያስ የአገልጋዩ ጥቅስ ውስጥ κρίσιςን መተርጎም
  choice: ፍትሕ
  alternative: ፍርድ
  rationale: አውዱ አገልጋዩ የእግዚአብሔርን ትክክለኛ ሥርዓት በድል ስለማቋቋሙ ይናገራል፤ የፍርድ ውሳኔን ብቻ አያመለክትም። ሆኖም የግሪኩ ቃል ሁለቱንም ሊያመለክት ስለሚችል አማራጩ በማስታወሻ ቀርቧል።
- issue: የመብራት ምስሉ የቃል በቃልነት ደረጃ
  choice: የመብራት ክር … አያጠፋም
  alternative: ጢስ የሚያወጣ ተልባ … አያጠፋም
  rationale: የግሪኩ λίνον በቀጥታ ተልባን ቢልም፣ በአውዱ ከተልባ የተሠራውን የመብራት ክር ያመለክታል። ዋናው ጽሑፍ ምስሉን ለዘመናዊ አንባቢ ግልጽ ያደርጋል፤ ቀጥተኛው የቃል አማራጭ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ምስላዊው አነጋገርና የκρίσις ትርጉማዊ ስፋት ተጠብቀዋል።
