- source_word: Οὐκ ἀνέγνωτε
  choice: አላነበባችሁምን?
  rationale: አሉታዊውን የአጽንዖት ጥያቄ እና ብዙ ቁጥር ተደራሲዎችን ይጠብቃል፤ ቅዱሳት መጻሕፍትን ማወቃቸውን የሚጠይቅ ኃይልም አለው።
- source_word: τί ἐποίησεν Δαυὶδ
  choice: ዳዊት ... ምን እንዳደረጉ
  rationale: «ምን እንዳደረጉ» ποιέωን በቀጥታ ያስተላልፋል። በአማርኛ የብዙ ቁጥር ግስ የተመረጠው ዳዊትና አብረውት የነበሩት በአንድ የተቀናጀ ርዕሰ ጉዳይ ስለቀረቡ ነው፤ ዳዊት ግን በስም ዋና ተዋናይ ሆኖ ይቀራል።
- source_word: ὅτε ἐπείνασεν
  choice: በተራበ ጊዜ
  rationale: የግሪኩን ነጠላ ግስ በቅርብ ይጠብቃል፤ ረሃቡን በግልጽ ለዳዊት ያያይዛል እንጂ «መራብ ጀመረ» በማለት የግሱን ገጽታ አያጋንንም።
- source_word: καὶ οἱ μετ’ αὐτοῦ
  choice: እርሱና አብረውት የነበሩት
  rationale: የግሪኩን «ከእርሱ ጋር የነበሩት» ሐሳብ በተፈጥሯዊና የተለመደ አማርኛ ያቀርባል፤ «ጓደኞቹ» ብሎ ያልተገለጸ የግንኙነት ዓይነት አይጨምርም።
theological_decisions:
- issue: ረሃቡ ዳዊትን ብቻ ወይስ አብረውት የነበሩትንም ያመለክታል?
  choice: ዋናው ጽሑፍ «ዳዊት በተራበ ጊዜ» ብሎ የግሪኩን ነጠላ ግስ በግልጽ ከዳዊት ጋር ያያይዛል።
  alternative: «ዳዊትና አብረውት የነበሩት በተራቡ ጊዜ»
  rationale: ἐπείνασεν በቁጥር ነጠላ ሲሆን በግልጽ ዳዊትን ይጠቁማል፤ ሆኖም καὶ οἱ μετ’ αὐτοῦ ረሃቡ ባልደረቦቹንም እንደሚያካትት ሊገባ ይችላል። ይህ አሻሚነት በማስታወሻ ተጠብቋል።
