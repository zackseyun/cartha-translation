  naturalness: The wording is generally modern and clear. Revising the clause so that ዳዊት is the subject of ያደረገ retains natural Amharic while avoiding an unintended shift of agency to David and his companions jointly.
  terminology: ዳዊት, አላነበባችሁምን, and ከእርሱ ጋር የነበሩት are appropriate modern-standard Amharic choices. The footnote should explain that the Greek singular verb expressly has David as its subject, while the following phrase may imply that his companions shared the hunger.
