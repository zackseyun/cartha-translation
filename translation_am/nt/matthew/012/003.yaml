  yaml_path: translation/nt/matthew/012/003.yaml
  text: But he said to them[a], “Have you not read what David did when he was hungry, and those with him were hungry?”
translation:
  language: am
  text: እርሱ ግን እንዲህ አላቸው፤ “ዳዊት በተራበ ጊዜ፣ ከእርሱ ጋር የነበሩትም በተራቡ ጊዜ[a]፣ ምን እንዳደረገ አላነበባችሁምን?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ዳዊት በተራበ ጊዜ፣ ከእርሱ ጋር የነበሩትም፣ ምን እንዳደረገ።” የግሪኩ የረሃብ ግስ በግልጽ ነጠላ ሲሆን ዳዊትን ያመለክታል፤ ሆኖም “ከእርሱ ጋር የነበሩት” የሚለው ሐረግ ረሃቡ እነርሱንም እንደሚያካትት ሊገባ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: እርሱ ግን
  rationale: δέ በዚህ የክርክር አውድ የኢየሱስን ተቃራኒ ምላሽ በቀላሉ ያመለክታል፤ «ግን» ይህን የንግግር ፍሰት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: εἶπεν αὐτοῖς
  choice: እንዲህ አላቸው
