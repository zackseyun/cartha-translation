base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/023.yaml
  text: And all the crowds were astonished and said[b][a], “Can this be the Son of David?”
translation:
  language: am
  text: ሕዝቡም ሁሉ ተደንቀው፣ “ይህ የዳዊት ልጅ ይሆን?” ይሉ ነበር።[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የዳዊት ልጅ” ከዳዊት ዘር የሚመጣውን ተስፋ የተሰጠውን ንጉሣዊ አዳኝ የሚያመለክት መሲሐዊ ማዕረግ ነው።
    reason: cross_reference
  - marker: b
    text: ወይም፣ የጥያቄውን ኃይል ይበልጥ በቃል በቃል ለማንጸባረቅ፦ “በእርግጥ ይህ የዳዊት ልጅ አይደለም፣ አይደል?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: ተደንቀው
  rationale: ግሱ በፈውሱ ምክንያት የተነሣውን ከፍተኛ መደነቅ ያሳያል፤ “ተደንቀው” በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: πάντες οἱ ὄχλοι
  choice: ሕዝቡም ሁሉ
  rationale: የግሪኩን አጠቃላይነት ይጠብቃል፤ ብዙ ቁጥሩን በቃል በቃል ከመተርጎም ይልቅ ይህ አገላለጽ በአማርኛ ተፈጥሯዊ ነው።
- source_word: ἔλεγον
  choice: ይሉ ነበር
  rationale: የግሪኩ ያልተፈጸመ የኃላፊ ጊዜ ቅርጽ ቀጣይነት ወይም ተደጋጋሚ ንግግርን ስለሚያመለክት “ይሉ ነበር” ያንን ገጽታ ይጠብቃል።
- source_word: Μήτι
  choice: ይሆን?
  rationale: Μήτι አሉታዊ መልስን የሚጠብቅ ወይም ማመንታትን የሚገልጽ ጥያቄ ሊያስገባ ይችላል። “ይሆን?” የሕዝቡን መደነቅና ማመንታት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ὁ υἱὸς Δαυίδ
  choice: የዳዊት ልጅ
  rationale: የግሪኩን መሲሐዊ ማዕረግ ሳይተረጉም በቀጥታ ይጠብቃል፤ “መሲሑ” ብሎ ትርጓሜውን በዋናው ጽሑፍ ውስጥ አያስገባም።
theological_decisions:
- issue: “የዳዊት ልጅ” የሚለው መሲሐዊ ኃይል
  choice: የዳዊት ልጅ
  alternative: መሲሑ / ተስፋ የተሰጠበት የዳዊት ወራሽ
  rationale: ምንጩ ራሱን ማዕረግ ይጠቀማል። ስለዚህ ታሪካዊና ሥነ መለኮታዊ ክብደቱን የያዘውን አገላለጽ ማቆየት፣ ትርጓሜውን ግን በማስታወሻ ማብራራት የምንጩን ውጥረት ይጠብቃል።
- issue: Μήτι የጥያቄው አቅጣጫ
  choice: ይሆን?
  alternative: በእርግጥ ይህ የዳዊት ልጅ አይደለም፣ አይደል?
  rationale: ቅንጣቱ አሉታዊ መልስ የሚጠብቅ ጥላ ቢኖረውም፣ በዚህ አውድ የሕዝቡን ተደንቆ መጠየቅ እንጂ ጽኑ ክህደት ብቻ ማድረግ የለበትም። አማራጩ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ሕዝቡም ሁሉ” በአማርኛ ተፈጥሯዊ ሆኖ πάντες οἱ ὄχλοι የሚያሳየውን አጠቃላይነት ያቆያል፤ የንግግሩ ቀጣይነት “ይሉ ነበር” ተብሎ ተገልጧል።
