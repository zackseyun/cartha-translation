  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። «ደቀ መዛሙርቱ» የተለመደውን መጽሐፍ ቅዱሳዊ ቃል ይጠብቃል፤ የዓረፍተ ነገሩ አወቃቀር ግን ቀላልና ወቅታዊ ነው።
