  rationale: የግሪኩ ቅርጽ ብዙ ቁጥር ቢሆንም፣ በኮይኔ ግሪክ ፈሊጥ አንድን የሰንበት ቀን ሊያመለክት ይችላል። ነጠላ ቁጥር መጠቀሙ አውዱን ያብራራል እንጂ ሥነ መለኮታዊ አቋም አያስገባም።
