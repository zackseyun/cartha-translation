  text: Ἐν ἐκείνῳ τῷ καιρῷ ἐπορεύθη ὁ Ἰησοῦς τοῖς σάββασιν διὰ τῶν σπορίμων· οἱ δὲ μαθηταὶ αὐτοῦ ἐπείνασαν καὶ ἤρξαντο τίλλειν στάχυας καὶ ἐσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/001.yaml
  text: At that time Jesus went through the grainfields on the Sabbath[a], and his disciples became hungry and began to pluck heads of grain and eat.
translation:
  language: am
  text: በዚያን ጊዜ ኢየሱስ በሰንበት[a] ቀን በእህል እርሻዎች መካከል አለፈ። ደቀ መዛሙርቱም ተራቡና የእህል ዛላዎችን መቅጠፍና መብላት ጀመሩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክ «በሰንበታት» የሚል የብዙ ቁጥር ቅርጽ አለ፤ እዚህ ግን «በሰንበት» ማለት የሆነ ፈሊጣዊ አጠቃቀም ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: በዚያን ጊዜ
  rationale: የትረካውን ጊዜያዊ ሽግግር በተፈጥሯዊና በተለመደ አማርኛ ያሳያል።
- source_word: ἐπορεύθη
  choice: አለፈ
  rationale: ኢየሱስ በእርሻዎቹ መካከል እንደተጓዘ በአውዱ የሚስማማ አጭርና ተፈጥሯዊ አገላለጽ ነው።
- source_word: τοῖς σάββασιν
  choice: በሰንበት ቀን
  rationale: የግሪኩ ብዙ ቁጥር በዚህ አውድ አንድን የሰንበት ቀን የሚያመለክት ፈሊጣዊ አጠቃቀም ነው፤ «ቀን» መጨመሩም በአማርኛ ግልጽ ያደርገዋል።
- source_word: διὰ τῶν σπορίμων
  choice: በእህል እርሻዎች መካከል
  rationale: σπόριμος የተዘራ መሬትን፣ በተለይም የእህል እርሻን ያመለክታል፤ ሐረጉም በእርሻዎቹ መካከል ማለፍን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἐπείνασαν
  choice: ተራቡ
  rationale: የረሃብ መጀመርን የሚያሳየውን የግሪክ ግስ በቀጥተኛና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τίλλειν στάχυας
  choice: የእህል ዛላዎችን ቀጥፈው
  rationale: τίλλω በእጅ መቀንጠስን ወይም መቁረጥን፣ στάχυς ደግሞ የእህልን ዛላ ያመለክታል። «ቀጥፈው» የመንቀሉን ተግባር ግልጽ ያደርጋል።
- source_word: ἤρξαντο … καὶ ἐσθίειν
  choice: መብላት ጀመሩ
  rationale: መጀመርን በግልጽ ያሳያል፤ የአማርኛው ተከታታይ ግስ «ቀጥፈው መብላት ጀመሩ» ሁለቱንም ድርጊቶች ተፈጥሯዊ አድርጎ ያገናኛል።
theological_decisions:
- issue: የσάββασιν አተረጓጎም
  choice: በሰንበት ቀን
