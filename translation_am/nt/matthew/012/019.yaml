id: MAT.12.19
reference: Matthew 12:19
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὐκ ἐρίσει οὐδὲ κραυγάσει, οὐδὲ ἀκούσει τις ἐν ταῖς πλατείαις τὴν φωνὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/019.yaml
  text: He will not quarrel or cry out[a], and no one will hear his voice in the streets.
translation:
  language: am
  text: እርሱ አይጣላም፣ አይጮኽምም፤ በአደባባዮችም ማንም ድምፁን አይሰማም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρίσει
  choice: አይከራከርም
  rationale: ἐρίζω በጠብ ወይም በክርክር መግባትን ያመለክታል። «አይከራከርም» በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን የአገልጋዩን ጠብ የማይፈልግ አካሄድ ያሳያል።
- source_word: κραυγάσει
  choice: አይጮኽምም
  rationale: κραυγάζω በከፍተኛ ድምፅ መጮኽን ወይም ጩኸት ማሰማትን ያመለክታል። «አይጮኽምም» የሕዝብን ትኩረት ለመሳብ የሚደረግን ከፍተኛ ጩኸት ሳያጋንን ይገልጻል።
- source_word: ἀκούσει τις
  choice: ማንም … አይሰማም
  rationale: በግሪክኛው ያለው አሉታዊ ያልተወሰነ አገላለጽ በተፈጥሯዊ አማርኛ «ማንም … አይሰማም» ተብሎ ይቀርባል።
- source_word: ἐν ταῖς πλατείαις
  choice: በአደባባዮች
  rationale: πλατεῖα ሰፊ መንገድን ወይም ሕዝባዊ አደባባይን ሊያመለክት ይችላል። «በአደባባዮች» የሕዝብ መሰብሰቢያና የሕዝብ ፊት የሆነውን ቦታ በተፈጥሯዊ አማርኛ ያሳያል፤ የ«በጎዳናዎች» አማራጭም በማስታወሻው ተጠብቋል።
- source_word: φωνὴν αὐτοῦ
  choice: ድምፁን
  rationale: φωνή በዚህ አውድ «ድምፅ» ማለት ነው፤ የባለቤትነት ቅጥያውም αὐτοῦን በግልጽ ያስተላልፋል።
- source_word: οὐκ…οὐδὲ…οὐδὲ
  choice: አይ…ም፣ አይ…ምም፤ …ም ማንም … አይ…ም
  rationale: የተደጋገመውን ሦስትዮሽ አሉታዊ አገላለጽ የአማርኛ ተፈጥሯዊ የአሉታ ቅርጽና «ም» አያያዥ በመጠቀም በተከታታይ ያቀርባል።
theological_decisions:
- issue: ከኢሳይያስ የአገልጋዩ ጥቅስ ጋር ያለው ግንኙነትና የመሲሑ አካሄድ
  choice: ቁጥሩ መሲሑን ጠብ የማይፈልግና በሕዝብ ፊት በጩኸት ራሱን የማያስተዋውቅ አድርጎ ይገልጻል።
  alternative: ባሕላዊውን የጥቅስ ቃላት ለማስተጋባት «አይጋደልም» ወይም «ድምፁን ከፍ አያደርግም» ተብሎ ይበልጥ ቃል በቃል ሊተረጎም ይችላል።
  rationale: ግሪክኛው ማቴዎስ 12፥18-21 ውስጥ ኢሳይያስ 42፥2ን በመጥቀስ የኢየሱስን የዋህና ጠብ የማይፈልግ አካሄድ ይገልጻል። ትርጉሙ ፈጽሞ በሕዝብ ፊት እንዳልተናገረ ወይም ሁሉንም ዓይነት ተቃውሞ እንዳልገለጸ አድርጎ አያስረዳም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «አደባባዮች» የሕዝብ ፊት ያለውን መቼት ያጎላል፤ የπλατεῖα የ«ሰፊ ጎዳና» ትርጉም ግን በግርጌ ማስታወሻው ተጠብቋል።
