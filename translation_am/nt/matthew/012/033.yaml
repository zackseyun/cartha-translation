source:
  edition: SBLGNT
  text: Ἢ ποιήσατε τὸ δένδρον καλὸν καὶ τὸν καρπὸν αὐτοῦ καλόν, ἢ ποιήσατε τὸ δένδρον σαπρὸν καὶ τὸν καρπὸν αὐτοῦ σαπρόν· ἐκ γὰρ τοῦ καρποῦ τὸ δένδρον γινώσκεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/033.yaml
  text: Either make the tree good and its fruit good[a], or make the tree rotten and its fruit rotten[b]; for the tree is known by its fruit.
translation:
  language: am
  text: ወይም ዛፉን መልካም፣ ፍሬውንም መልካም አድርጉ[b]፤ ወይም ዛፉን የበሰበሰ፣ ፍሬውንም የበሰበሰ አድርጉ[a]፤ ዛፉ በፍሬው ይታወቃልና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘የበሰበሰ’ በሚለው ፈንታ ‘መጥፎ’ ሊባል ይችላል፤ σαπρός የተበላሸ፣ የተበከለ ወይም ዋጋ የሌለው ነገር ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ሁለት ጊዜ የተደገመው ‘አድርጉ’ በንግግር አገባብ ‘እንደዚህ ቁጠሩት’ ወይም ‘እንደዚህ መሆኑን አሳዩ’ የሚል ኃይል ሊኖረው ይችላል፤ የግሪኩ ቅርጽ ግን ትእዛዛዊ ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσατε
  choice: አድርጉ
  rationale: የግሪኩን የብዙ ቁጥር ቀጥተኛ ትእዛዝ እና በሁለቱ አማራጮች ያለውን ትይዩነት ይጠብቃል፤ በዐውዱ ግን ‘እንደዚህ ቁጠሩት’ ወይም ‘እንደዚህ አሳዩት’ የሚል ንግግራዊ ኃይል ሊኖረው ይችላል።
- source_word: δένδρον
  choice: ዛፍ
  rationale: የምሳሌውን ምስል በቀጥታና በተለመደ አማርኛ ያስተላልፋል።
- source_word: καλός
  choice: መልካም
  rationale: የጥራትንና የሥነ ምግባርን ጥምር ፍቺ ሳያጠብ ይጠብቃል፤ ‘ጤናማ’ የሚለው ትርጉሙን ወደ አካላዊ ሁኔታ ብቻ ያጠበዋል።
- source_word: καρπός
  choice: ፍሬ
  rationale: የምንጩን የዛፍ ምስል በተፈጥሯዊና በተለመደ አማርኛ ይጠብቃል።
- source_word: σαπρός
  choice: የበሰበሰ
  rationale: የተበላሸ፣ የተ腐? ወይም ዋጋ የሌለው ነገር የሚያመለክተውን ሕያው ምስል ይጠብቃል፤ ለዛፍና ለፍሬ ተፈጥሯዊ ነው።
- source_word: ἐκ γὰρ τοῦ καρποῦ
  choice: በፍሬው ... ና
  rationale: ἐκ በተፈጥሯዊ አማርኛ ‘በፍሬው’ ተብሎ ቀርቧል፤ γάρ ደግሞ የምክንያት ግንኙነቱን በ‘-ና’ ያሳያል።
- source_word: γινώσκεται
  choice: ይታወቃል
  rationale: የአሁን ጊዜ ተደራጊ ቅርጹን በግልጽና ቀጥተኛ አማርኛ ያስተላልፋል።
- source_word: αὐτοῦ
  choice: ፍሬው
  rationale: በአማርኛ የባለቤትነት ቅጥያው ፍሬው የዛፉ መሆኑን በተፈጥሯዊ ሁኔታ ያሳያል።
theological_decisions:
- issue: በኢየሱስ ምሳሌ ውስጥ ያሉት ትእዛዞች ኃይል
  choice: ቀጥተኛው የትእዛዝ ቅርጽ ‘አድርጉ’ ተጠብቋል።
  alternative: ‘ዛፉን መልካም ነው ብላችሁ ቁጠሩት’ ወይም ‘ዛፉ መልካም ከሆነ’ ብሎ መተርጎም።
  rationale: ግሪኩ ሁለት ጊዜ የተደገመ የትእዛዝ ቅርጽ አለው። ኃይሉ ንግግራዊ ፈተና ሊሆን ቢችልም፣ ወደ መግለጫ መቀየር በጽሑፉ ያለውን ሆን ተብሎ የተተወ ውጥረት ይፈታዋል።
