  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅመናል። የሁለቱ አማራጮች ትይዩ አወቃቀርና የመጨረሻው ምክንያታዊ አረፍተ ነገር ተጠብቀዋል።
