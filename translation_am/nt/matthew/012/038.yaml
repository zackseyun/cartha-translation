id: MAT.12.38
reference: Matthew 12:38
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Τότε ἀπεκρίθησαν ⸀αὐτῷ τινες τῶν γραμματέων καὶ Φαρισαίων λέγοντες· Διδάσκαλε, θέλομεν ἀπὸ σοῦ σημεῖον ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/038.yaml
  text: Then some of the scribes and Pharisees answered him[a], saying, “Teacher, we want to see a sign from you.”
translation:
  language: am
  text: ከዚያም ከጸሐፍትና ከፈሪሳውያን አንዳንዶቹ መልሰው፣ “መምህር ሆይ፣ ከአንተ ምልክት[a] ማየት እንፈልጋለን” አሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ተአምራዊ ምልክት።” የግሪኩ ቃል ተአምራዊ ትርጉም ያለውን ምልክት ሊያመለክት ይችላል፤ ዋናው ጽሑፍ ግን ሰፊውን “ምልክት” የሚለውን ቃል ጠብቋል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: ከዚያም
  rationale: የትረካውን ቀጣይ ክስተት በተፈጥሯዊ ዘመናዊ አማርኛ ያስተዋውቃል።
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: መልሰው … አሉት
  rationale: በቅርብ አውድ ግልጽ ጥያቄ ባይቀድምም የግሪኩን ‘መለሱለት’ የሚለውን የትረካ አገላለጽ ተፈጥሯዊ በሆነ የአማርኛ አወቃቀር ያቀርባል።
- source_word: τινες τῶν γραμματέων καὶ Φαρισαίων
  choice: ከጸሐፍትና ከፈሪሳውያን አንዳንዶቹ
  rationale: ንግግሩን የተናገሩት የሁለቱ ቡድኖች አባላት በሙሉ ሳይሆኑ ከእነርሱ የተወሰኑት መሆናቸውን ያሳያል።
- source_word: λέγοντες
  choice: … አሉት
  rationale: የግሪኩ አሳታፊ ግስ ቀጥተኛውን ንግግር ያስተዋውቃል፤ በአማርኛ ‘አሉት’ ተፈጥሯዊ ነው።
- source_word: Διδάσκαλε
  choice: መምህር ሆይ
  rationale: የጥሪውን ቅርጽና ‘አስተማሪ’ የሚለውን መሠረታዊ ፍቺ በክብር ያቀርባል።
- source_word: θέλομεν
  choice: እንፈልጋለን
  rationale: ፈቃድንና ፍላጎትን በቀጥተኛና በዘመናዊ አማርኛ ይገልጣል።
- source_word: ἀπὸ σοῦ
  choice: ከአንተ
  rationale: ምልክቱ ከኢየሱስ እንዲመጣ የተጠየቀ መሆኑን፣ ማለትም ምንጩን፣ ያሳያል።
- source_word: σημεῖον
  choice: ምልክት
  rationale: የግሪኩን ሰፊ መሠረታዊ ፍቺ ይጠብቃል፤ አውዱ ተአምራዊ ጠቀሜታ ሊያመለክት ቢችልም ያንን በዋናው ጽሑፍ አይጨምርም።
- source_word: ἰδεῖν
  choice: ማየት
  rationale: የὁράωን ቀጥተኛ የማየት ፍቺ ያቀርባል፤ ‘መመስከር’ የሚል ትርጓሜያዊ ጭማሪ አያደርግም።
theological_decisions:
- issue: በዚህ አውድ የσημεῖον ባሕርይ
  choice: በዋናው ጽሑፍ ‘ምልክት’ ተብሎ ተተርጉሟል።
  alternative: ተአምራዊ ምልክት
  rationale: ጥያቄው ኢየሱስን የሚያረጋግጥ ተአምራዊ ማስረጃ ሊያመለክት ይችላል፤ ሆኖም የግሪኩ ቃል ራሱ ሰፊውን ‘ምልክት’ የሚል ፍቺ ስላለው ዋናው ጽሑፍ ይህን ስፋት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። ‘ጸሐፍት’ እና ‘ፈሪሳውያን’ የተለመዱትን የወንጌል መጠሪያዎች ይጠብቃሉ።
