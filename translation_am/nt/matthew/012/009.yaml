  text: And departing from there, he went into their synagogue.
translation:
  language: am
  text: ከዚያም ወጥቶ ወደ ምኩራባቸው ገባ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: ከዚያም
  rationale: ትረካውን ከቀደመው ክፍል ጋር በተፈጥሯዊ አማርኛ ያገናኛል፤ በዚህ ዐውድ ‘እና’ ከሚለው ይልቅ ለትረካ ተስማሚ ነው።
- source_word: μεταβὰς ἐκεῖθεν
  choice: ከዚያም ተነሥቶ
  rationale: ከቀደመው ስፍራ ተለይቶ ወደ ሌላ ስፍራ መሄዱን በተፈጥሯዊ የአማርኛ አገላለጽ ያሳያል። ‘ተነሥቶ’ የግሪኩን ቦዝ አንቀጽ ቅርጽም ያንጸባርቃል።
- source_word: ἦλθεν εἰς
  choice: ወደ … ገባ
  rationale: እንቅስቃሴው ወደ ምኩራቡ ውስጥ መሆኑን ያሳያል፤ ‘ገባ’ የεἰςን አቅጣጫዊ ኃይል በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: συναγωγὴν
  choice: ምኩራብ
  rationale: በአማርኛ የአይሁድን የጉባኤና የአምልኮ ስፍራ የሚያመለክተው የተለመደና ትክክለኛ ቃል ነው።
- source_word: αὐτῶν
  choice: -አቸው
  rationale: የብዙ ቁጥር ባለቤትነትን በ‘ምኩራባቸው’ ውስጥ በተፈጥሯዊ የአማርኛ ቅጥያ ይጠብቃል፤ ማንን እንደሚያመለክት ከጽሑፉ በላይ አይወስንም።
theological_decisions:
- issue: ‘ምኩራባቸው’ የሚለው ባለቤትነት ማንን እንደሚያመለክት
  choice: ምኩራባቸው
  alternative: የእነርሱ ምኩራብ / የአይሁድ ምኩራብ
  rationale: ግሪኩ αὐτῶν የሚለውን ብቻ ይጠቀማል፤ ተርጓሚው ቡድኑን በተጨማሪ ስም ሳይሰይምና የጠላትነት ትርጉም ሳይጨምር ያለውን ግልጽነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ አማርኛ። ‘ከዚያም … ተነሥቶ’ የስፍራ ሽግግሩን እና የግሪኩን ቦዝ አንቀጽ በተፈጥሯዊ ሁኔታ ያቀርባል።
