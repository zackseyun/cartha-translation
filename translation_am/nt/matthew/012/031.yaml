id: MAT.12.31
reference: Matthew 12:31
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: διὰ τοῦτο λέγω ὑμῖν, πᾶσα ἁμαρτία καὶ βλασφημία ἀφεθήσεται τοῖς ἀνθρώποις, ἡ δὲ τοῦ πνεύματος βλασφημία οὐκ ⸀ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/031.yaml
  text: Therefore I tell you[a], every sin and blasphemy will be forgiven people[b], but blasphemy against the Spirit will not be forgiven.
translation:
  language: am
  text: ስለዚህ እላችኋለሁ፤ ኃጢአትና ስድብ ሁሉ ለሰዎች ይቅር ይባላሉ፤ መንፈስን መስደብ ግን ይቅር አይባልም።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “መንፈስ ቅዱስን መስደብ።” ከአቅራቢያው አውድ የተጠቀሰው መንፈስ ቅዱስ መሆኑ ግልጽ ነው፤ ይህ ቁጥር ራሱ ግን “መንፈስ” ብቻ ይላል።
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ስለዚህ
  rationale: ከቀደመው አውድ የሚወጣውን ድምዳሜ በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: λέγω ὑμῖν
  choice: እላችኋለሁ
  rationale: ቀጥተኛውን ንግግርና አጽንዖቱን በተለመደ አማርኛ ይጠብቃል።
- source_word: πᾶσα ἁμαρτία καὶ βλασφημία
  choice: ማንኛውም ኃጢአትና ስድብ
  rationale: πᾶσα ያለውን አከፋፋይ ኃይል ‘ማንኛውም’ ያስተላልፋል፤ ‘ኃጢአት’ መደበኛው ቃል ሲሆን ‘ስድብ’ በዚህ አውድ በመለኮታዊው ላይ የሚነገርን ክፉና የንቀት ንግግር ያመለክታል።
- source_word: ἀφεθήσεται τοῖς ἀνθρώποις
  choice: ለሰዎች ይቅር ይባላል
  rationale: የወደፊት ጊዜ ተደራጊ አነጋገሩንና ይቅርታው የሚሰጣቸውን ሰዎች ያሳያል፤ በአማርኛም ተፈጥሯዊ ነው።
- source_word: ἡ δὲ τοῦ πνεύματος βλασφημία
  choice: መንፈስን መስደብ ግን
  rationale: የግሪኩን የባለቤትነት ቅርጽ እንደ ድርጊቱ ተቀባይ፣ ማለትም መንፈስን መስደብ፣ በግልጽ አማርኛ ያቀርባል፤ δὲ ያለውን ንጽጽር ‘ግን’ ይጠብቃል።
theological_decisions:
- issue: πνεύματος በዋናው ጽሑፍ ‘መንፈስ’ ወይስ ‘መንፈስ ቅዱስ’ ተብሎ መተርጎም
  choice: መንፈስ
  alternative: መንፈስ ቅዱስ
  rationale: የዚህ ቁጥር የግሪክ ጽሑፍ ἁγίου ሳይል τοῦ πνεύματος፣ ‘መንፈስ’፣ ብቻ ይላል። ከአቅራቢያው አውድ የተጠቀሰው መንፈስ ቅዱስ መሆኑ ግልጽ ቢሆንም ዋናው ጽሑፍ የምንጩን አገላለጽ ይጠብቃል፤ የተሟላው አገላለጽ በማስታወሻ ተቀምጧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ሴሚኮሎኖቹ የሁለቱን ተቃራኒ ንግግሮች ሚዛን ያሳያሉ፤ ‘ለሰዎች’ የሚለው ጾታን ሳይለይ አጠቃላይ የሰው ልጆችን ያመለክታል።
