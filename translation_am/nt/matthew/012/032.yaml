id: MAT.12.32
reference: Matthew 12:32
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ὃς ἐὰν εἴπῃ λόγον κατὰ τοῦ υἱοῦ τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ· ὃς δ’ ἂν εἴπῃ κατὰ τοῦ πνεύματος τοῦ ἁγίου, οὐκ ἀφεθήσεται αὐτῷ οὔτε ἐν ⸂τούτῳ τῷ⸃ αἰῶνι οὔτε ἐν τῷ μέλλοντι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/032.yaml
  text: And whoever speaks a word against the Son of Man[a], it will be forgiven him; but whoever speaks against the Holy Spirit, it will not be forgiven him[c][b], neither in this age nor in the coming one.
translation:
  language: am
  text: በሰው ልጅ ላይ አንድ ቃል የሚናገር ሁሉ[a] ይቅር ይባልለታል፤ በመንፈስ ቅዱስ ላይ የሚናገር ግን በዚህ ዘመንም ሆነ በሚመጣው ዘመን[b] ይቅር አይባልለትም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “አንድ ቃል የሚናገር” የሚለው “አንድ ነገር የሚናገር” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ግሪኩ ቃል በቃል “በሚመጣው” ይላል፤ “ዘመን” የሚለው ከቀደመው ሐረግ የሚገባ ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς ἐὰν / ὃς δ’ ἂν
  choice: የሚናገር ሁሉ … የሚናገር ግን
  rationale: የግሪኩን አጠቃላይና ለማንም ክፍት የሆነ ሁኔታዊ አገላለጽ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: εἴπῃ λόγον
  choice: አንድ ቃል የሚናገር
  rationale: λόγον የሚለውን በግልጽ ይጠብቃል፤ አገላለጹም በዐውዱ ውስጥ ተፈጥሯዊ ነው።
- source_word: κατὰ
  choice: በ… ላይ
  rationale: በዚህ ዐውድ በአንድ ሰው ላይ የሚ directed ተቃዋሚ ንግግርን በቀላል አማርኛ ያመለክታል።
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: የሰው ልጅ
  rationale: የማዕረጉን ቃላዊ ቅርጽና መሲሐዊ ድምፀት የሚጠብቅ በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም ነው።
- source_word: ἀφεθήσεται αὐτῷ / οὐκ ἀφεθήσεται αὐτῷ
  choice: ይቅር ይባልለታል / ይቅር አይባልለትም
  rationale: የግሪኩን ተደራጊ አወቃቀርና በሁለቱ ሐረጎች መካከል ያለውን ተቃርኖ ይጠብቃል።
- source_word: τοῦ πνεύματος τοῦ ἁγίου
  choice: መንፈስ ቅዱስ
  rationale: በዘመናዊ መደበኛ አማርኛ የተለመደውና ትክክለኛው መጠሪያ ነው።
- source_word: αἰών / τῷ μέλλοντι
  choice: ዘመን / በሚመጣው ዘመን
  rationale: ንጽጽሩ ቦታዊ ‘ዓለምን’ ሳይሆን የአሁኑንና የሚመጣውን ዘመን ስለሚያመለክት ‘ዘመን’ የሚለው ይበልጥ ትክክለኛ ነው። በሁለተኛው ሐረግ በግሪክ የተተወውን ስም ለአማርኛ ግልጽነት ይደግማል።
theological_decisions:
- issue: የአሁኑና የሚመጣው ዘመን ንጽጽር
  choice: በዚህ ዘመንም ሆነ በሚመጣው ዘመን
  alternative: በዚህ ዓለምም ሆነ በሚመጣው ዓለም
  rationale: αἰών እዚህ የጊዜ ዘመንን ያመለክታል፤ ትርጉሙም ከጽሑፉ በላይ የሆነ የፍጻሜ ዘመን ሥርዓት አይጭንም።
- issue: ይቅር የማይባለው በደል ምንነት
  choice: ጥቅሱ እንዳለው በመንፈስ ቅዱስ ላይ መናገር ብሎ መተው
  alternative: በኋላ የተሰጡ ጠባብ ወይም ሰፊ የሥነ መለኮት ፍቺዎችን በዋናው ጽሑፍ ማካተት
  rationale: ጥቅሱ ማስጠንቀቂያውን ይናገራል እንጂ የበደሉን ድንበር በኋለኛ የሥነ መለኮት ቃላት አይገልጽም፤ ስለዚህ ያለው ውጥረት ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የሰው ልጅ እና መንፈስ ቅዱስ የሚሉት የተለመዱ መጽሐፍ ቅዱሳዊ መጠሪያዎች ተጠብቀዋል።
