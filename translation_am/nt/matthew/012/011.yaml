  text: ὁ δὲ εἶπεν αὐτοῖς· Τίς ⸀ἔσται ἐξ ὑμῶν ἄνθρωπος ὃς ἕξει πρόβατον ἕν, καὶ ἐὰν ἐμπέσῃ τοῦτο τοῖς σάββασιν εἰς βόθυνον, οὐχὶ κρατήσει αὐτὸ καὶ ἐγερεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/011.yaml
  text: But he said to them[a], “Which man among you, if he has one sheep and it falls into a pit on the Sabbath[b], will not take hold of it and lift it out?”
translation:
  language: am
  text: እርሱ ግን እንዲህ አላቸው፦ “ከእናንተ መካከል አንዲት በግ ያለው ሰው፣ በጉ በሰንበት[a] ጉድጓድ ውስጥ ብትወድቅ፣ ይዛት አያነሣትምን?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክ “በሰንበታት” የሚል ብዙ ቁጥር ነው፤ ይህ ግን “በሰንበት” ማለት የሆነ ፈሊጣዊ አጠቃቀም ነው።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ይዛት አያወጣትምን?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς ἔσται ἐξ ὑμῶν ἄνθρωπος
  choice: ከእናንተ መካከል … ሰው … አያነሣትምን?
  rationale: የግሪኩን አዎንታዊ መልስ የሚጠብቅ የክርክር ጥያቄ በተፈጥሯዊ የአማርኛ አወቃቀር ያቀርባል፤ ἄνθρωπος በዚህ ምሳሌ አንድን ተወካይ ሰው ያመለክታል።
- source_word: πρόβατον ἕν
  choice: አንዲት በግ
  rationale: ቁጥሩን በግልጽ ሁኔታ ይጠብቃል፤ ‘በግ’ በአማርኛ በዚህ አገባብ በሴት ጾታ ሰዋስዋዊ ስምምነት በተፈጥሮ ይቀርባል።
- source_word: ἐὰν ἐμπέσῃ τοῦτο
  choice: በግዋ … ብትወድቅ
  rationale: የሁኔታ አንቀጹን በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ተውላጠ ስሙ ወደ በጉ እንደሚመለስ ግልጽ ያደርጋል።
- source_word: τοῖς σάββασιν
  choice: በሰንበት
  rationale: በግሪክ ብዙ ቁጥር የተጻፈውን የተለመደ የሰንበት ቀን አጠራር በአማርኛ ነጠላ ቁጥር በተፈጥሮ ያቀርባል።
- source_word: εἰς βόθυνον
  choice: ጉድጓድ ውስጥ
  rationale: የβόθυνοςን ሰፊ ትርጉም ያለ አላስፈላጊ ዝርዝር ይገልጻል።
- source_word: κρατήσει αὐτὸ καὶ ἐγερεῖ
  choice: ይዟት አያነሣትምን?
  rationale: ሁለቱን ድርጊቶች—አጥብቆ መያዝንና ከወደቀችበት ማንሣትን—በአጭርና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: οὐχί
  choice: አያነሣትምን?
  rationale: አዎንታዊ መልስ እንደሚጠበቅ የሚያመለክተውን የግሪክ ጥያቄ ቅርጽ ይጠብቃል።
theological_decisions:
- issue: በምሳሌው ያለው ተወካይ የሰው አገላለጽ
  choice: ሰው
  alternative: ወንድ
  rationale: ἄνθρωπος በሰዋስው ወንድ ነጠላ ቢሆንም እዚህ የሚያተኩረው በአንድ ተወካይ ሰው ላይ ነው፤ ‘ሰው’ ይህን ያለ አላስፈላጊ የፆታ ማጥበብ በትክክል ያቀርባል።
- issue: የσάββασιν ብዙ ቁጥር
  choice: በሰንበት
  alternative: በሰንበታት
  rationale: ብዙ ቁጥሩ የግሪክ ፈሊጣዊ አጠቃቀም ስለሆነ፣ ነጠላው በዚህ የሰንበት ሕግ ክርክር አገባብ የታሰበውን ትርጉም በግልጽ ያስተላልፋል።
- issue: የἐγερεῖ አገባባዊ ትርጉም
  choice: አያነሣትምን?
  alternative: አያወጣትምን?
  rationale: ‘ማንሣት’ የግሪኩን መሠረታዊ ምስል ይጠብቃል፤ ከጉድጓድ መውጣቱ ከአገባቡ ግልጽ ነው።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ አዎንታዊ መልስ የሚጠብቅ የአነጋገር ጥያቄ በ‘አያነሣትምን?’ ተጠብቋል።
