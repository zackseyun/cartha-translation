id: MAT.12.30
reference: Matthew 12:30
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/030.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: am
  text: ከእኔ ጋር ያልሆነ በእኔ ላይ ነው፤ ከእኔ ጋር የማይሰበስብም ይበትናል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὴ ὢν
  choice: ያልሆነ
  rationale: መስተዋድዱና አሳቢው በአንድነት ስም ሆነው በኢየሱስ ወገን ባለመሆን የሚታወቅን ማንኛውንም ሰው ያመለክታሉ፤ «ያልሆነ» ይህን አጠቃላይ ነጠላ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: μετ’ ἐμοῦ
  choice: ከእኔ ጋር
  rationale: μετά ከዘር አመልካች ጋር ኅብረትን ወይም አብሮነትን ያመለክታል፤ «ከእኔ ጋር» ቀጥተኛና ተፈጥሯዊ ሲሆን የወገንተኝነቱንም አንድምታ ይጠብቃል።
- source_word: κατ’ ἐμοῦ
  choice: በእኔ ላይ
  rationale: κατά እዚህ ተቃውሞን ያመለክታል፤ «በእኔ ላይ» በዘመናዊ አማርኛ ይህን በግልጽ ይገልጣል።
- source_word: συνάγων
  choice: የማይሰበስብ
  rationale: συνάγω ነገሮችን ወይም ሰዎችን አንድ ላይ ማምጣትን ያመለክታል፤ «መሰብሰብ» የመንጋ ወይም የመከር ምስሉን ሳይወስን ይጠብቃል።
- source_word: σκορπίζει
  choice: ይበትናል
  rationale: σκορπίζω መበተንን ወይም መበታተንን ያመለክታል፤ «ይበትናል» ከ«ይሰበስባል» ጋር ያለውን ቀጥተኛ ተቃርኖ ያቆያል።
- source_word: καὶ
  choice: -ም
  rationale: የአማርኛው አያያዥ «-ም» ሁለተኛውን ትይዩ ንግግር ከመጀመሪያው ጋር በተፈጥሯዊ መንገድ ያገናኛል፤ የግሪኩን ጨማሪ ቅንጅት እንጂ ተቃራኒ አያያዝን አያስገባም።
theological_decisions:
- issue: የኢየሱስ ፍጹም ተቃርኖ ኃይል
  choice: ንግግሩ ከኢየሱስ ጋር መሆንን ወይም በእርሱ ላይ መሆንን ያለማለዘብ በቀጥታ ያቀርባል።
  alternative: ፍጹሙን ተቃርኖ የሚያለዝብ ነጻ ትርጉም
  rationale: ግሪኩ ሁለት ጠንካራና ትይዩ አረፍተ ነገሮችን ያለማቅለያ ያቀርባል። ትርጉሙ ተጨማሪ የአስተምህሮ ድምዳሜ ሳያስገባ ይህን ውጥረትና ወሳኝነት ጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ትይዩ አወቃቀርና «መሰብሰብ/መበተን» ተቃርኖ ተጠብቀዋል። የእንግሊዝኛው ማስታወሻ በአማርኛ ትርጉሙ ላይ ትርጉማዊ ልዩነት ስለማያመጣ የግርጌ ማስታወሻ አልተጨመረም።
