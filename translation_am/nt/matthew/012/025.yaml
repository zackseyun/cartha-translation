base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/025.yaml
  text: But knowing their thoughts[a], he said to them, “Every kingdom divided against itself is laid waste[c][b], and every city or house divided against itself will not stand.”
translation:
  language: am
  text: ነገር ግን ሐሳባቸውን[a] ዐውቆ እንዲህ አላቸው፤ “በራሱ ላይ የተከፋፈለ መንግሥት ሁሉ ባድማ ይሆናል[b]፤ በራሷ ላይ የተከፋፈለች ከተማም ሆነ በራሱ ላይ የተከፋፈለ ቤት[c] ሁሉ አይቆምም።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ሐሳባቸውን” የሚለው “አስተሳሰባቸውን” ወይም “ውስጣዊ ዓላማቸውን” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “ባድማ ይሆናል” የሚለው “ይፈርሳል” ወይም “ይወድማል” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: c
    text: እዚህ “ቤት” የሚለው ቃል “ቤተሰብ” ወይም “የቤት ሰዎች” የሚለውንም ፍቺ ሊይዝ ይችላል።
    reason: lexical_alternative
