- source_word: ἐνθυμήσεις
  choice: ሐሳባቸውን
  rationale: ውስጣዊ ሐሳብን፣ ማመዛዘንን ወይም ዓላማን ሊያመለክት የሚችለውን ቃል በግልጽና በሰፊ ትርጉም ያቀርባል።
- source_word: Πᾶσα βασιλεία
  choice: መንግሥት ሁሉ
  rationale: ምሳሌያዊውን አጠቃላይ መርህ የግሪኩን ነጠላ ስም ጠብቆ ያቀርባል።
- source_word: μερισθεῖσα καθ’ ἑαυτῆς
  choice: በራሱ ላይ የተከፋፈለ
  rationale: ውስጣዊ መከፋፈሉ ክፍሎቹን እርስ በርስ ተቃዋሚ እንደሚያደርግ የκατάን ኃይል ይጠብቃል።
- source_word: ἐρημοῦται
  choice: ባድማ ይሆናል
  rationale: መፍረስን ብቻ ሳይሆን ባዶና የተ荒荒 መሆንን የሚያሳየውን ከባድ ምስል ይጠብቃል።
- source_word: πόλις ἢ οἰκία
  choice: ከተማም ሆነች ቤት
