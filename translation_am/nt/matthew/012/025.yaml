  rationale: ግሪኩ የዕውቀቱን እውነታ ይገልጻል እንጂ መንገዱን አይገልጽም፤ ትርጉሙም ጽሑፉ ያልወሰነውን ሥነ መለኮታዊ ጉዳይ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የምሳሌያዊው ንግግር ትይዩነትና ‘በራሱ ላይ’ የሚለው ተቃርኖ ተጠብቋል።
