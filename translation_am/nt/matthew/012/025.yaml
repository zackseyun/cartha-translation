  rationale: የአእምሮ ዕውቀትን የሚገልጸውን የግሪኩን ቦዝ አንቀጽ በተፈጥሯዊ አማርኛ ይጠብቃል፤ ኢየሱስ ያወቀበትን መንገድ ግን አይወስንም።
- source_word: δὲ
