base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/040.yaml
  text: For just as Jonah was in the belly of the sea creature three days and three nights[c][b][a], so the Son of Man will be in the heart of the earth three days and three nights.
translation:
  language: am
  text: ዮናስ በታላቁ የባሕር ፍጡር[a] ሆድ ውስጥ ሦስት ቀንና ሦስት ሌሊት[c] እንደነበረ ሁሉ፣ የሰው ልጅም በምድር ልብ[b] ውስጥ ሦስት ቀንና ሦስት ሌሊት ይሆናል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ታላቅ ዓሣ።” የግሪክኛው ቃል ትልቅ የባሕር ፍጡርን ያመለክታል፤ ከአንድ የተወሰነ የእንስሳ ዓይነት የሰፋ ነው።
    reason: lexical_alternative
