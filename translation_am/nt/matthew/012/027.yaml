review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the instrumental sense of ἐν (‘በ’), the expulsion of demons, the rhetorical reference to the hearers’ ‘sons,’ and the future predicate ‘they will be your judges.’ A minor grammatical correction is needed in the first conditional clause: its first-person subject requires ‘ከሆንሁ,’ not ‘ከሆነ.’'
  naturalness: Apart from that agreement issue, the wording is clear and suitably formal in modern standard Amharic. ‘ልጆቻችሁ’ is a more natural possessive expression than ‘የእናንተ ልጆች’ while retaining the source’s kinship wording.
  terminology: ‘አጋንንት,’ ‘ማስወጣት,’ and ‘ፈራጆቻችሁ’ are appropriate and preserve the verse’s meaning. ‘ብዔልዜቡል’ correctly follows the SBLGNT form. The footnote should accurately identify ‘Beelzebub’ as a rendering found in many English translations, rather than broadly in unspecified translation traditions.
  issues:
  - severity: medium
    issue: First-person agreement in the conditional clause
    rationale: ‘እኔም … የማስወጣ ከሆነ’ uses a non-first-person conditional form despite the explicit subject ‘እኔ.’ ‘ከሆንሁ’ is required for natural, grammatically correct Amharic.
  - severity: low
    issue: Footnote audit-trail precision
    rationale: The English audit footnote specifically notes that many English translations have ‘Beelzebub’; the Amharic note should retain that qualification.
