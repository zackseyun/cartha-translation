id: MAT.12.27
reference: Matthew 12:27
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ εἰ ἐγὼ ἐν Βεελζεβοὺλ ἐκβάλλω τὰ δαιμόνια, οἱ υἱοὶ ὑμῶν ἐν τίνι ἐκβάλλουσιν; διὰ τοῦτο αὐτοὶ ⸂κριταὶ ἔσονται ὑμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/027.yaml
  text: And if I cast out demons by Beelzebul[a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: am
  text: እኔም አጋንንትን በብዔልዜቡል[a] የማስወጣ ከሆንሁ፣ ልጆቻችሁ በማን ያስወጧቸዋል? ስለዚህ እነርሱ ፈራጆቻችሁ ይሆናሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ግሪክ፦ “ብዔልዜቡል”፤ ብዙ የእንግሊዝኛ ትርጉሞች “ብዔልዜቡብ” ይላሉ።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν Βεελζεβοὺλ
  choice: በብዔልዜቡል
  rationale: ἐν በዚህ ክስ አውድ መሣሪያን ወይም አድራጊነትን ያመለክታል፤ ስለዚህ “በ” ተፈጥሯዊና ትክክለኛ ነው። ስሙም በSBLGNT ያለውን Βεελζεβούλ ተከትሎ በድምፅ ተጽፏል።
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: አጋንንትን የማስወጣ
  rationale: ἐκβάλλω በአጋንንት ማስወጣት አውድ “ማስወጣት” ማለት ሲሆን፣ ይህ በዘመናዊ አማርኛ ግልጽና የማባረርን ኃይል የሚጠብቅ ነው።
- source_word: οἱ υἱοὶ ὑμῶν
  choice: የእናንተ ልጆች
  rationale: የግሪኩን የዝምድና ቃል በቀጥታ ይጠብቃል። በአውዱ የተናጋሪዎቹን ቡድን አባላት ወይም ተከታዮች ሊያመለክት ቢችልም፣ ያንን ትርጓሜ በዋናው ጽሑፍ አልተጫነም።
- source_word: ἐν τίνι
  choice: በማን
  rationale: እንደ መጀመሪያው ἐν ሁሉ ይህም አድራጊነትን ወይም የኃይል ምንጭን ያመለክታል፤ ጥያቄው ስለ ግላዊ ኃይል ምንጭ ስለሆነ “በማን” ተስማሚ ነው።
- source_word: διὰ τοῦτο
  choice: ስለዚህ
  rationale: ከቀደመው የንግግር ጥያቄ የሚወጣውን ድምዳሜ በአጭርና በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: κριταὶ ἔσονται ὑμῶν
  choice: እነርሱ ፈራጆቻችሁ ይሆናሉ
  rationale: የግሪኩን ስማዊ አገባብና የወደፊት ጊዜ በቀጥታ ይጠብቃል፤ “ይፈርዱባችኋል” ብሎ ወደ ግስ አልተለወጠም።
theological_decisions:
- issue: የΒεελζεβούλ ማንነትና አጻጻፍ
  choice: ብዔልዜቡል
  alternative: ብዔልዜቡብ
  rationale: በቀረበው የግሪክ ምንጭ ያለውን Βεελζεβούλ በድምፅ መጻፍ ተመርጧል፤ የተለመደው ሌላ ቅርጽ በማስታወሻ ተጠቅሷል። ይህ የጽሑፍና የስም አቀራረብ ውሳኔ እንጂ የትምህርተ እምነት ልዩነት አይደለም።
- issue: “የእናንተ ልጆች” የሚለው ማንን እንደሚያመለክት
  choice: የእናንተ ልጆች
  alternative: የእናንተ ሰዎች / ተከታዮች
  rationale: υἱοί የሚለው ቃል በአውዱ የቡድናቸውን አባላት ወይም ተከታዮች ሊያመለክት ይችላል፤ ሆኖም የምንጩን የዝምድና አገላለጽና የክርክሩን ትይዩነት ለመጠበቅ ቀጥተኛው ትርጉም ተመርጧል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር የአማርኛ አገላለጽ ተጠቅሟል። “አጋንንትን ማስወጣት” የተለመደና ለሕዝብ የሚገባ ሲሆን፣ “ፈራጆቻችሁ ይሆናሉ” የምንጩን የስም አገባብና የፍርድ ክብደት ይጠብቃል።
