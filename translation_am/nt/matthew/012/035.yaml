id: MAT.12.35
reference: Matthew 12:35
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ ἀγαθὸς ἄνθρωπος ἐκ τοῦ ἀγαθοῦ θησαυροῦ ἐκβάλλει ἀγαθά, καὶ ὁ πονηρὸς ἄνθρωπος ἐκ τοῦ πονηροῦ θησαυροῦ ἐκβάλλει πονηρά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/035.yaml
  text: The good man brings out good things from his good treasure[b][a], and the evil man brings out evil things from his evil treasure.
translation:
  language: am
  text: መልካም ሰው ከመልካም መዝገቡ መልካም ነገሮችን ያወጣል፤ ክፉ ሰውም ከክፉ መዝገቡ ክፉ ነገሮችን ያወጣል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በቅርብ አውዱ ውስጥ ንግግር ዋና ጉዳይ ስለሆነ፣ «መልካም ነገሮች» እና «ክፉ ነገሮች» በተለይ ቃላትን ሊያመለክቱ ይችላሉ።
    reason: cross_reference
lexical_decisions:
- source_word: ἀγαθὸς / ἀγαθά
  choice: መልካም / መልካም ነገሮች
  rationale: የግሪኩን የቃል ድግግሞሽና የሥነ ምግባር ንጽጽር ይጠብቃል፤ በገለልተኛ ብዙ ቁጥር የቀረበውን ἀγαθά በተፈጥሯዊ አማርኛ ግልጽ ያደርጋል።
- source_word: ἄνθρωπος
  choice: ሰው
  rationale: በአማርኛ «ሰው» በተፈጥሮ ወንድንም ሴትንም የሚወክል ሲሆን፣ እዚህ ያለውን ምሳሌያዊ ነጠላ ግለሰብ በትክክል ያሳያል።
- source_word: θησαυροῦ
  choice: መዝገብ
  rationale: በውስጥ ተከማችቶ ያለ ሀብት ወይም ክምችት ምስልን የሚጠብቅ የተለመደ መጽሐፍ ቅዱሳዊና ዘመናዊ አማርኛ ቃል ነው።
- source_word: ἐκβάλλει
  choice: ያወጣል
  rationale: ከውስጥ ወደ ውጭ የማምጣትን ምስል በቀጥታ ይጠብቃል፤ ከ«ያፈራል» ይልቅ የግሪኩን እንቅስቃሴ ይበልጥ ያንጸባርቃል።
- source_word: πονηρὸς / πονηρά
  choice: ክፉ / ክፉ ነገሮች
  rationale: ከመልካም ጋር ያለውን ጠንካራ የሥነ ምግባር ተቃርኖና በግሪኩ ያለውን ተመሳሳይ የቃል ድግግሞሽ ይጠብቃል።
- source_word: ἐκ
  choice: ከ
  rationale: የምንጭን ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል፤ «ያወጣል» የውጭ እንቅስቃሴውን አስቀድሞ ይገልጣል።
theological_decisions:
- issue: በምሳሌያዊ አነጋገር የቀረበ የውስጣዊ ባሕርይና የውጫዊ ውጤት ንጽጽር
  choice: ግሪኩ ስም ሳይጨምር ያቀረባቸውን ሰፊ ትርጉም ያላቸው «መልካም ነገሮች» እና «ክፉ ነገሮች» በዋናው ጽሑፍ ማቆየት
  alternative: በአውዱ መሠረት «መልካም ቃላት» እና «ክፉ ቃላት» ብሎ ማጥበብ
  rationale: በቅርብ አውዱ ንግግር ዋና ጉዳይ ቢሆንም፣ ἀγαθά እና πονηρά ግልጽ ስም የሌላቸው ገለልተኛ ብዙ ቁጥር ቅጾች ናቸው። ስለዚህ ዋናው ጽሑፍ ሰፊነቱን ይጠብቃል፣ የንግግር ትኩረቱም በማስታወሻ ይገለጣል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ሚዛናዊ ትይዩነት፣ ድግግሞሽና የመዝገብ ምስል ተጠብቀዋል። «ሰው» በአማርኛ የወንድ ፆታን ብቻ የማያመለክት ተፈጥሯዊ አጠቃላይ ቃል ስለሆነ ለዚህ ምሳሌያዊ አነጋገር ተመርጧል።
