review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the contrastive introduction, the generic reference to people, accountability, and the day of judgment. However, placing “በግዴለሽነት” with the verb makes the carelessness describe the manner of speaking rather than directly qualifying each word, whereas ἀργόν modifies ῥῆμα.
  naturalness: The draft is generally clear, but “ሰዎች በግዴለሽነት ስለሚናገሩት እያንዳንዱ ቃል” is syntactically less direct in modern Amharic. Directly qualifying “ቃል” produces a clearer, more natural rendering.
  terminology: “ፍርድ ቀን” is appropriate. “ሂሳብ ይሰጣሉ” is the established and natural Amharic expression for giving an account, and the footnote appropriately retains the semantic range of ἀργός.
  issues:
  - severity: medium
    issue: The rendering of ἀργόν is attached adverbially to speaking.
    rationale: Greek ἀργόν is an adjective modifying “word,” not an adverb modifying “speak.” The present wording can mean words spoken carelessly, rather than careless/idle words themselves.
  - severity: low
    issue: “መልስ ይሰጡበታል” is less precise idiomatically than an accounting expression.
    rationale: The phrase can mean giving an answer by means of something. “ሂሳብ ይሰጣሉ” more directly represents ἀποδώσουσιν ... λόγον, while the preceding “ስለ” phrase supplies the matter for which account is given.
  revised_text: እኔ ግን እላችኋለሁ፤ ሰዎች ስለሚናገሩት እያንዳንዱ ግዴለሽ ቃል[a] በፍርድ ቀን ሂሳብ ይሰጣሉ።
