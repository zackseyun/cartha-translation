base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/036.yaml
  text: But I tell you that for every careless word that people speak[b][a], they will give an account on the day of judgment.
translation:
  language: am
  text: እኔ ግን እላችኋለሁ፤ ሰዎች ስለሚናገሩት እያንዳንዱ ግዴለሽ ቃል[a] በፍርድ ቀን ሂሳብ ይሰጣሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ፍሬ ቢስ ቃል” ወይም “ከንቱ ቃል” ሊባልም ይችላል። የግሪኩ ቅጽል “ሥራ ፈት፣ ፍሬ ቢስ፣ ግዴለሽነት ያለበት” የሚሉ ትርጉሞች ሊኖሩት ይችላሉ።
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: እኔ ግን እላችኋለሁ
  rationale: δέ በቀደመው ንግግር ላይ የሚጨምር ቀላል ንፅፅር ስላለው “ግን” ተመርጧል፤ የቀጥታ አድራሻውም በተፈጥሯዊ አማርኛ ተጠብቋል።
- source_word: πᾶν ῥῆμα ἀργόν
  choice: በግዴለሽነት ... እያንዳንዱ ቃል
  rationale: πᾶν አከፋፋይ ትርጉም ስላለው “እያንዳንዱ” ተብሏል። ἀργόν የሥራ ፈትነትን፣ ፍሬ ቢስነትን ወይም ግዴለሽነትን ሊያመለክት ይችላል፤ በዚህ የፍርድ አውድ “በግዴለሽነት” የንግግሩን ኃላፊነት ግልጽ ያደርጋል።
- source_word: ὃ λαλήσουσιν οἱ ἄνθρωποι
  choice: ሰዎች ... ስለሚናገሩት
  rationale: οἱ ἄνθρωποι ወንዶችን ብቻ ሳይሆን ሰዎችን በአጠቃላይ ያመለክታል። የግሪኩ የወደፊት ጊዜ በአማርኛው አጠቃላይ የወደፊት አንጻራዊ አገላለጽ ተወክሏል።
- source_word: ἀποδώσουσιν περὶ αὐτοῦ λόγον
  choice: መልስ ይሰጡበታል
  rationale: የግሪኩ አገላለጽ ተጠያቂ ሆኖ ስለአንድ ነገር ሂሳብ ወይም መልስ መስጠትን ያመለክታል። “ይሰጡበታል” የπερὶ αὐτοῦን ማጣቀሻ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: በፍርድ ቀን
  rationale: ἐν የጊዜ አመልካች ሲሆን κρίσις በዚህ አውድ የፍርድ ውሳኔን ያመለክታል፤ “በፍርድ ቀን” ግልጽና የተለመደ አገላለጽ ነው።
theological_decisions:
- issue: የἀργόν ሥነ ምግባራዊ ክብደት
  choice: በግዴለሽነት
  alternative: ከንቱ፣ ሥራ ፈት፣ ፍሬ ቢስ
  rationale: አውዱ በመለኮታዊ ፍርድ ፊት ስላለ ተጠያቂነት ይናገራል። “በግዴለሽነት” ንግግሩን ክፉ ወይም ስድብ ብቻ አድርጎ ሳያጠብ፣ ኃላፊነት የጎደለውን ንግግር ያሳያል።
- issue: የοἱ ἄνθρωποι አጠቃላይ ማጣቀሻ
  choice: ሰዎች
  alternative: ወንዶች፣ የሰው ልጆች
  rationale: የግሪኩ ስም እዚህ ጾታን ሳይለይ የሰውን ልጅ በአጠቃላይ ያመለክታል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። “መልስ ይሰጡበታል” የተጠያቂነትን ፍቺ በተፈጥሯዊ አገላለጽ ያስተላልፋል፤ የἀργόν ሰፊ የፍቺ ክልል በግርጌ ማስታወሻ ተጠብቋል።
