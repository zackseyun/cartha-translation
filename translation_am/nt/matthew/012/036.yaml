  to: እኔ ግን እላችኋለሁ፤ ሰዎች ስለሚናገሩት እያንዳንዱ ግዴለሽ ቃል[a] በፍርድ ቀን ሂሳብ ይሰጣሉ።
  rationale: The revision makes “ግዴለሽ” directly modify “ቃል,” preserving the Greek syntax and meaning without narrowing its lexical range. It also uses the standard Amharic accounting idiom “ሂሳብ ይሰጣሉ”; “ስለሚናገሩት” retains the referent of περὶ αὐτοῦ.
