id: MAT.3.10
reference: Matthew 3:10
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἤδη ⸀δὲ ἡ ἀξίνη πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται· πᾶν οὖν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/010.yaml
  text: And already the axe is laid at the root of the trees[a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: am
  text: ከወዲሁም መጥረቢያው በዛፎቹ ሥር ላይ ተቀምጧል[a]፤ ስለዚህ መልካም ፍሬ የማያፈራ ዛፍ ሁሉ ይቆረጣል፣ ወደ እሳትም ይጣላል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በዛፎቹ ሥር አጠገብ ተቀምጦ ነው።”
    reason: κεῖται በቀጥታ “ተቀምጦ/ተዘርግቶ ነው” የሚል የሁኔታ አገላለጽ ሊኖረው ስለሚችል፣ πρὸς የሚያመለክተውን ወደ ሥሩ የተጠጋ አቀማመጥ ለማሳየት።
lexical_decisions:
- source_word: ἤδη δὲ
  choice: አሁንም
  rationale: የፍርዱን ቅርብነትና ከቀደመው ማስጠንቀቂያ ጋር ያለውን ቀጣይነት በተፈጥሯዊ አማርኛ ያሳያል፤ δὲን እንደ ጠንካራ ተቃርኖ አያቀርበውም።
- source_word: ἀξίνη
  choice: መጥረቢያ
  rationale: በዛፍ መቁረጥ ምሳሌው ውስጥ የተጠቀሰውን መሣሪያ በግልጽና በተለመደ ቃል ይገልጻል።
- source_word: πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται
  choice: በዛፎቹ ሥር ላይ ተቀምጧል
  rationale: መጥረቢያው ለመቁረጥ ቀድሞ በቦታው መዘጋጀቱን የሚያሳየውን ምስል ይጠብቃል። κεῖται የሁኔታ ትርጉም ስላለው ሌላው አተረጓጎም በማስታወሻ ቀርቧል።
- source_word: πᾶν οὖν δένδρον
  choice: ስለዚህ … ዛፍ ሁሉ
  rationale: οὖν ከመጥረቢያው ምስል የሚከተለውን ድምዳሜ ያመለክታል፤ የግሪኩን ሁሉን አቀፍ አጽንዖትም ይጠብቃል።
- source_word: μὴ ποιοῦν καρπὸν καλὸν
  choice: መልካም ፍሬ የማያፈራ
  rationale: በአማርኛ ስለ ዛፍ ፍሬ በተፈጥሮ የሚነገረውን ‘ማፍራት’ በመጠቀም የባሕርይ ቀጣይነት ያለውን የግሪክ ተሳቢ አገላለጽ ያስተላልፋል።
- source_word: ἐκκόπτεται
  choice: ይቆረጣል
  rationale: በዛፍ ምስሉ ውስጥ ወድቆ መወገዱን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: εἰς πῦρ βάλλεται
  choice: ወደ እሳትም ይጣላል
  rationale: የβάλλεταιን ኃይለኛ ድርጊትና የፍርድ ምስሉን ያለ ትርጓሜያዊ ማስፋፋት ያስተላልፋል።
theological_decisions:
- issue: የእሳቱ ምስል ባሕርይ
  choice: ‘ወደ እሳት’ ተብሎ ያለ ትርጓሜያዊ ማስፋፋት ተጠብቋል።
  alternative: የመጨረሻ ፍርድ፣ ጊዜያዊ ፍርድ ወይም የገሃነም እሳት ብሎ በግልጽ መወሰን።
  rationale: ጥቅሱ ግልጽ የፍርድ ምስል ቢጠቀምም የእሳቱን ትክክለኛ መለያ አይገልጽም፤ ስለዚህ ጽሑፉ የተወው የትርጉም ውጥረት አልተፈታም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። ‘መጥረቢያ፣’ ‘ሥር፣’ ‘ፍሬ’ እና ‘እሳት’ የሚሉት ተያያዥ ምስሎች በቀጥታ ተጠብቀዋል።
