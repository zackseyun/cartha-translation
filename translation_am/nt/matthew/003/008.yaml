  text: Therefore[a], produce fruit worthy of repentance.
translation:
  language: am
  text: ስለዚህ፣ ከንስሐ ጋር የሚስማማ ፍሬ አፍሩ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ «ለንስሐ የሚገባ ፍሬ አፍሩ።»
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσατε
  choice: አፍሩ
  rationale: የድርጊት ትእዛዝ ሲሆን፣ ከፍሬ ጋር በተፈጥሮ የሚስማማው የአማርኛ አገላለጽ «ፍሬ አፍሩ» ነው፤ የብዙ ሰዎች ትእዛዝነቱንም ይጠብቃል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ንግግሩ ቀደም ካለው ማስጠንቀቂያና ጥሪ የሚከተል ድምዳሜ መሆኑን በግልጽ ያሳያል።
- source_word: καρπὸν
  choice: ፍሬ
  rationale: በነጠላ ቁጥር የቀረበውን የፍሬ ምሳሌያዊ አጠቃቀም ይጠብቃል፤ እዚህ የሚታይ ውጤትን ወይም ምግባርን ያመለክታል።
- source_word: ἄξιον
  choice: የሚስማማ
  rationale: ከዘር ስም ጋር ያለውን የተገቢነትና የመጣጣም ግንኙነት በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ፍሬው ንስሓን ያስገኛል የሚል ትርጉም አይሰጥም።
- source_word: μετανοίας
  choice: ንስሓ
  rationale: በዘመናዊ መደበኛ አማርኛ በዚህ ሃይማኖታዊና ሥነ ምግባራዊ አውድ የሚታወቀው ቃል ሲሆን፣ የአእምሮና የአቅጣጫ ለውጥን በአጭሩ ያመለክታል።
theological_decisions:
- issue: የκαρπὸν ἄξιον τῆς μετανοίας ሐረግ ትርጉም
  choice: እውነተኛ ንስሓን የሚመጥንና የሚያሳይ ውጫዊ ምግባር
  alternative: ንስሓን የሚያስገኝ ወይም ከንስሓ ጋር በዋጋ እኩል የሆነ ፍሬ
  rationale: ἄξιος ከዘር ስም ጋር ተገቢነትንና መጣጣምን ይገልጣል፤ ትእዛዙ ንስሓን በሥራ ስለመግዛት ሳይሆን ከንስሓ ጋር ስለሚስማማ ፍሬ ነው።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ ነው። «ፍሬ አፍሩ» የሚለው ተፈጥሯዊ የአማርኛ ዘይቤ ሲሆን፣ «ከንስሓ ጋር የሚስማማ» የግሪኩን መጣጣም ያሳያል። የግርጌ ማስታወሻው ይበልጥ ቃል በቃል የሆነውን አማራጭ ይጠብቃል።
