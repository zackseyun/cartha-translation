base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/017.yaml
  text: And behold[a], a voice from the heavens said, “This is my beloved Son[b], with whom I am well pleased.”
translation:
  language: am
  text: እነሆም፣ ከሰማያት[a] ድምፅ እንዲህ አለ፦ “ይህ የምወደው ልጄ ነው፤ በእርሱ ደስ ብሎኛል።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከሰማይ።” በግሪኩ ግን “ሰማያት” በሚል ብዙ ቁጥር ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: እነሆም
  rationale: ἰδού ትኩረትን ወደ ታላቅ ክስተት የሚስብ የንግግር ምልክት ነው። “እነሆም” የκαίን አያያዥነትና የἰδούን የተከበረ አጽንዖት በተፈጥሯዊ መጽሐፍ ቅዱሳዊ አማርኛ ያቀርባል።
- source_word: φωνὴ
  choice: ድምፅ
  rationale: ቀጥተኛ ንግግር ስለሚከተለው፣ እዚህ ላይ ቃሉ ተራ ድምፅን ሳይሆን የሚናገር ድምፅን ያመለክታል።
- source_word: ἐκ τῶν οὐρανῶν
  choice: ከሰማያት
  rationale: የግሪኩን ብዙ ቁጥር በቀጥታ ይጠብቃል፤ “ሰማያት”ም በአማርኛ የተለመደና ግልጽ ነው።
- source_word: λέγουσα
  choice: እንዲህ አለ
  rationale: በግሪክ ያለው ተሳቢ አገላለጽ ጥቅሱን ያስገባል፤ በአማርኛ “እንዲህ አለ” ተፈጥሯዊ ሲሆን ድምፁ ተናጋሪ መሆኑን ግልጽ ያደርጋል።
- source_word: Οὗτός ἐστιν
  choice: ይህ ... ነው
  rationale: የማመልከቻውንና የመለያውን ቀጥተኛ ኃይል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: የምወደው ልጄ
  rationale: “የምወደው” የἀγαπητόςን የፍቅር ትርጉም በዘመናዊና ክቡር አማርኛ ያቀርባል፤ “ልጄ” ደግሞ ግልጽ የአባትና የልጅ ግንኙነትን ሳያዳክም ይጠብቃል።
- source_word: ἐν ᾧ εὐδόκησα
  choice: በእርሱ ደስ ብሎኛል
  rationale: የἐν ᾧን “በእርሱ” መዋቅር በመጠበቅ የεὐδοκέωን ደስታና ሞገስ በተፈጥሯዊ አማርኛ ይገልጣል። የግሪኩ አኦሪስት እዚህ ቀጣይ የሆነ የሞገስ አቋምን በአማርኛ ፍጹም ጊዜ “ደስ ብሎኛል” በተገቢ ሁኔታ ያሳያል።
theological_decisions:
- issue: የኢየሱስን ልጅነት የሚገልጠው መለኮታዊ አዋጅ
  choice: የምወደው ልጄ
  alternative: ውድ ልጄ
  rationale: ጽሑፉ በግልጽ የሚናገረውን የልጅነትና የፍቅር ትርጉም ሳያዳክም ይጠብቃል፤ ከጽሑፉ በላይ ተጨማሪ የእምነት ቀመር አያስገባም።
- issue: የοὐρανῶν ብዙ ቁጥር
  choice: ከሰማያት
  alternative: ከሰማይ
  rationale: የምንጭ ጽሑፉን ብዙ ቁጥር ይጠብቃል፣ በአማርኛም ግልጽና ተፈጥሯዊ ነው።
- issue: ἐν ᾧ εὐδόκησα የሚለው አገላለጽ
  choice: በእርሱ ደስ ብሎኛል
  alternative: እርሱን ወድጄዋለሁ
  rationale: “በእርሱ” የሚለው የግሪኩን መዋቅር እና በልጁ ላይ ያለውን መለኮታዊ ደስታና ሞገስ ይጠብቃል፤ አማራጩ ግን ፍቅርን በማጉላት የεὐδοκέωን ልዩ ትርጉም ሊያጠብ ይችላል።
