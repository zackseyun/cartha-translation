  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ አጭር የትረካ አወቃቀርና በመጨረሻው ሐረግ ያለው የተውላጠ ስም አሻሚነት በተቻለ መጠን ተጠብቀዋል።
