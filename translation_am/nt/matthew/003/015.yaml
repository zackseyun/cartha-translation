  text: But Jesus answered him[a], “Permit it for now, for in this way it is fitting for us to fulfill all righteousness.” Then he permitted him.
translation:
  language: am
  text: ኢየሱስ ግን መልሶ፣ “ለአሁኑ ፍቀድ፤ በዚህ መንገድ ጽድቅን[a] ሁሉ ማሟላት ለእኛ ይገባልና” አለው። ከዚያም ፈቀደለት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ፍትሕ።” የግሪኩ ቃል ጽድቅን ወይም ፍትሕን ሊያመለክት ይችላል፤ እዚህ ግን “ጽድቅ” ከእግዚአብሔር ፈቃድ ጋር መስማማት በሚለው የማቴዎስ አጽንዖት ጋር የተሻለ ይስማማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν
  choice: ኢየሱስ ግን መልሶ … አለው
  rationale: የግሪኩን ‘መልሶ አለው’ የሚለውን ሴማዊ አነጋገር በተፈጥሯዊ አማርኛ ያቀርባል፤ ‘ግን’ በቀደመው ቁጥር ከዮሐንስ ተቃውሞ ጋር ያለውን ንጽጽር ያሳያል።
- source_word: Ἄφες ἄρτι
  choice: አሁን ፍቀድ
  rationale: ἀφίημι በዚህ ዐውድ ‘ይቅር ማለት’ ሳይሆን ድርጊቱ እንዲፈጸም መፍቀድን ያመለክታል፤ ἄρτι የአሁኑን ጊዜ ያመለክታል።
- source_word: οὕτως γὰρ
  choice: በዚህ መንገድ … ና
  rationale: οὕτως ዮሐንስ ኢየሱስን ማጥመቁን የሚያመለክት የአፈጻጸም መንገድ ነው፤ γάρ በአማርኛው ምክንያት አመልካች ‘-ና’ ተገልጿል።
- source_word: πρέπον ἐστὶν ἡμῖν
  choice: ለእኛ ይገባል
  rationale: πρέπον የሚያመለክተውን ተገቢነት በተፈጥሯዊና ክብር ባለው ዘመናዊ አማርኛ ይገልጣል።
- source_word: πληρῶσαι πᾶσαν δικαιοσύνην
  choice: ጽድቅን ሁሉ መፈጸም
  rationale: ‘መፈጸም’ የπληρόωን የማሟላትና ወደ ፍጻሜ የማድረስ ኃይል ይጠብቃል፤ ‘ጽድቅ’ ደግሞ δικαιοσύνηን ያለ ጠባብ ትርጓሜ ያቀርባል።
- source_word: τότε ἀφίησιν αὐτόν
  choice: ከዚያም ፈቀደለት
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ ግስ በአማርኛ ትረካ ተፈጥሯዊ በሆነ ያለፈ ጊዜ ተተርጉሟል። የግሪኩን ተውላጠ ስም አወቃቀር በመጠበቅ ዮሐንስ በስም አልተጨመረም።
theological_decisions:
- issue: የ“ጽድቅን ሁሉ” ትርጉም
  choice: በዚህ ጊዜ ኢየሱስ ከዮሐንስ ጥምቀትን በመቀበል ከእግዚአብሔር ጻድቅ ፈቃድና ዓላማ ጋር የሚስማማውን ሁሉ ማሟላት
  alternative: ሕጋዊ መስፈርቶችን ሁሉ ብቻ ማሟላት፣ ወይም ‘ፍትሕን ሁሉ’ ብሎ መተርጎም
  rationale: ሐረጉ በቁጥሩ ውስጥ ካለው በላይ ወደ አንድ የተወሰነ የሥነ መለኮት ሥርዓት ሊጠብ አይገባም። የማቴዎስ አጠቃቀምና ቅርብ ዐውዱ ከእግዚአብሔር ጻድቅ ፈቃድ ጋር መስማማትን የሚያካትት ሰፊ ትርጉም ይደግፋሉ።
