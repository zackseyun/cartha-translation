id: MAT.3.16
reference: Matthew 3:16
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸂βαπτισθεὶς δὲ⸃ ὁ Ἰησοῦς ⸂εὐθὺς ἀνέβη⸃ ἀπὸ τοῦ ὕδατος· καὶ ἰδοὺ ⸀ἠνεῴχθησαν οἱ οὐρανοί, καὶ εἶδεν ⸀πνεῦμα θεοῦ καταβαῖνον ὡσεὶ ⸀περιστερὰν ἐρχόμενον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/016.yaml
  text: And when Jesus was baptized[a], he immediately came up from the water. And behold, the heavens were opened[c][b], and he saw the Spirit of God descending like a dove and coming upon him.
translation:
  language: am
  text: ኢየሱስም ከተጠመቀ በኋላ ወዲያው ከውሃው ወጣ። እነሆ፣ ሰማያት ተከፈቱ፤ የእግዚአብሔርን መንፈስም እንደ ርግብ ሲወርድና በእርሱ ላይ ሲመጣ አየ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαπτισθεὶς δὲ ὁ Ἰησοῦς
  choice: ኢየሱስም ከተጠመቀ በኋላ
  rationale: የግሪኩ የተደራጊ አኦሪስት ተሳቢ ከዋናው ግስ በፊት የተፈጸመውን ድርጊት ያመለክታል፤ “ከ…በኋላ” ቅደም ተከተሉንና የተደራጊነቱን መልክ በተፈጥሯዊ አማርኛ ይጠብቃል። δέ በ“-ም” እንደ ቀላል የትረካ ማያያዣ ተተርጉሟል።
- source_word: εὐθὺς ἀνέβη ἀπὸ τοῦ ὕδατος
  choice: ወዲያው ከውሃው ወጣ
  rationale: “ወዲያው” የεὐθύςን ፈጣን ቅደም ተከተል ያሳያል። ἀπό በቀጥታ “ከ” ነው፤ “ከውሃው ወጣ” በአማርኛ ተፈጥሯዊ ሲሆን የግሪኩን እንቅስቃሴ በግልጽ ይገልጣል።
- source_word: ἰδοὺ
  choice: እነሆም
  rationale: ትኩረትን ወደሚቀጥለው አስደናቂ ክስተት የሚጠራውን የንግግር ምልክት በክቡርና በሚታወቅ የአማርኛ ቃል ይጠብቃል።
- source_word: ἠνεῴχθησαν οἱ οὐρανοί
  choice: ሰማያት ተከፈቱለት
  rationale: SBLGNT ዋና ንባብ ἠνεῴχθησαν αὐτῷ የሚለውን ተውላጠ ስም ይዟል፤ “ተከፈቱለት” ይህን ይወክላል። የοἱ οὐρανοί ብዙ ቁጥር “ሰማያት” ተብሎ ተጠብቋል። የቅጂው ልዩነት በማስታወሻ ተገልጿል።
- source_word: πνεῦμα θεοῦ
  choice: የእግዚአብሔርን መንፈስ
  rationale: የግሪኩን የባለቤትነት ግንኙነት ይጠብቃል፤ ጽሑፉ በቀጥታ “ቅዱስ መንፈስ” ስለማይል ያንን የበለጠ ገላጭ ስያሜ አልተተካም።
- source_word: καταβαῖνον ὡσεὶ περιστερὰν
  choice: እንደ ርግብ ሲወርድ
  rationale: ὡσεί ንጽጽርን እንጂ መንፈሱ በቀጥታ ርግብ መሆኑን አይገልጥም፤ “እንደ” ይህን ገደብ ይጠብቃል። የአሁን ጊዜ ተሳቢው ቀጣይ እንቅስቃሴ በ“ሲወርድ” ተገልጿል።
- source_word: ἐρχόμενον ἐπ’ αὐτόν
  choice: በእርሱ ላይ ሲመጣ
  rationale: ἐρχόμενον በመሠረታዊ ትርጉሙ “ሲመጣ” ተብሏል፤ “ሲያርፍ” የሚለው ከግሱ በላይ ትርጓሜ ስለሚጨምር አልተመረጠም። ἐπί የሚያሳየው “በእርሱ ላይ” ተጠብቋል።
theological_decisions:
- issue: πνεῦμα θεοῦ በአጠቃላይ መንፈስን ወይስ ቅዱስ መንፈስን ያመለክታል?
  choice: የእግዚአብሔር መንፈስ
  alternative: ቅዱስ መንፈስ፤ ከእግዚአብሔር የሆነ መንፈስ
  rationale: የጥምቀቱ አውድ የታወቀውን መለኮታዊ መንፈስ ያመለክታል፤ ሆኖም ትርጉሙ ግሪኩ የተጠቀመውን ትክክለኛ ስያሜ ጠብቆ ከጽሑፉ በላይ አይሄድም።
- issue: ὡσεὶ περιστερὰν የመንፈሱን ማንነት ወይስ የመውረዱን ንጽጽር ይገልጣል?
  choice: እንደ ርግብ ሲወርድ
  alternative: ርግብ ሆኖ ሲወርድ
  rationale: ὡσεί ግልጽ የንጽጽር ቃል ነው፤ መንፈሱ በቃል በቃል ርግብ ሆነ የሚል መደምደሚያ አልተጨመረም።
- issue: የαὐτῷ የጽሑፍ ልዩነት
  choice: “ተከፈቱለት” በዋና ጽሑፍ፣ አጭሩ ንባብ በማስታወሻ
  alternative: “ሰማያት ተከፈቱ” ብቻ
  rationale: የSBLGNT ዋና ንባብ αὐτῷን ይዟል፣ ነገር ግን የአጻጻፍ ምልክቱ የቅጂ ልዩነት እንዳለ ያሳያል፤ ሁለቱንም ማስረጃዎች ለአንባቢው በግልጽ ተይዟል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር መደበኛ አማርኛ ተጠቅሟል። “እነሆ” እና “ሰማያት” የጽሑፉን መጽሐፍ ቅዱሳዊ ክብደት ይጠብቃሉ፤ የዓረፍተ ነገሩ አወቃቀር ግን ለዘመናዊ አንባቢ ተፈጥሯዊ ነው።
