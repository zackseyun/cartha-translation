  text: καὶ ἐβαπτίζοντο ἐν τῷ Ἰορδάνῃ ⸀ποταμῷ ὑπ’ αὐτοῦ ἐξομολογούμενοι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/006.yaml
  text: and they were being baptized by him in the Jordan River[a], confessing their sins.
translation:
  language: am
  text: ኃጢአቶቻቸውን እየተናዘዙም፣ በዮርዳኖስ ወንዝ በእርሱ ይጠመቁ ነበር።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ተጠመቁ”፤ የግሪኩ ኢምፐርፌክት ግስ ቀጣይነት ያለውን ወይም ተደጋጋሚ ድርጊትን ሊያጎላ ይችላል፦ “ይጠመቁ ነበር።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβαπτίζοντο
  choice: ይጠመቁ ነበር
  rationale: የግሪኩ ኢምፐርፌክት ተደራጊ ቅርጽ በትረካው ውስጥ ቀጣይ ወይም ተደጋጋሚ ድርጊትን ሊያመለክት ስለሚችል፣ ይህ አገላለጽ ያንን ገጽታ ይጠብቃል። ‘መጠመቅ’ የሥርዓቱን ስም ይጠብቃል እንጂ ዘዴውን አስቀድሞ አይወስንም።
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: በዮርዳኖስ ወንዝ
  rationale: ἐν ከዳቲቭ ጋር ቦታን ያመለክታል፤ ποταμῷ ደግሞ ዮርዳኖስ ወንዝ መሆኑን በግልጽ ይጠቅሳል።
- source_word: ὑπ’ αὐτοῦ
  choice: በእርሱ
  rationale: ὑπό ከጄኒቲቭ ጋር የድርጊቱን አድራጊ ያመለክታል። ተውላጠ ስሙን መጠበቅ ከቀደመው አውድ የሚታወቀውን ዮሐንስ በቁጥሩ ውስጥ በስም አያስገባም።
- source_word: ἐξομολογούμενοι
  choice: እየተናዘዙ
  rationale: ተካፋዩ ከዋናው ግስ ጋር በአንድ ጊዜ የሚፈጸም ድርጊትን ያሳያል፤ ‘መናዘዝ’ ኃጢአትን በቃል ማመንን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: ኃጢአታቸውን
  rationale: የብዙ ቁጥር ተሳቢንና የባለቤትነት ግንኙነቱን በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: καὶ
  choice: -ም
  rationale: የግሪኩን ቀላል አያያዥ በአማርኛ የትረካ ፍሰት ውስጥ ተፈጥሯዊ በሆነው ተያያዥ ቅጥያ ይወክላል።
theological_decisions:
- issue: የጥምቀት ቃልና ዘዴ
  choice: ‘ይጠመቁ ነበር’ ተብሎ የሥርዓቱ የተለመደ ቃል ተጠብቋል።
  alternative: ‘ይዘፈቁ ነበር’ ወይም ‘ይታጠቡ ነበር’
  rationale: ቁጥሩ ሰዎቹ በዮርዳኖስ በዮሐንስ እንደተጠመቁ ይናገራል፣ ነገር ግን ዘዴውን በተለየ ሁኔታ አይተረጉምም። ስለዚህ ‘መጠመቅ’ ከጽሑፉ የማይገደድ የቤተ እምነት ድምዳሜ ሳያስገባ የግሪኩን የሥርዓት ቃል ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የተካፋዩ ቀዳሚ አቀማመጥ ኃጢአትን መናዘዝና መጠመቅ በአንድ ጊዜ መከናወናቸውን ተፈጥሯዊ አድርጎ ያሳያል።
