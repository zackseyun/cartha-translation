  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων ἐρχομένους ἐπὶ τὸ βάπτισμα ⸀αὐτοῦ εἶπεν αὐτοῖς· Γεννήματα ἐχιδνῶν, τίς ὑπέδειξεν ὑμῖν φυγεῖν ἀπὸ τῆς μελλούσης ὀργῆς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/007.yaml
  text: But when he saw many of the Pharisees and Sadducees coming for his baptism[a], he said to them, “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: am
  text: ነገር ግን ከፈሪሳውያንና ከሰዱቃውያን ብዙዎች ወደ ጥምቀቱ ሲመጡ አይቶ፣ “እናንተ የእፉኝት ልጆች![a] ከሚመጣው ቁጣ[b] እንድትሸሹ ማን አስጠነቀቃችሁ?” አላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የእፉኝት ዘሮች።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ሊመጣ ካለው ቁጣ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: ነገር ግን … አይቶ
  rationale: የግሪኩን የትረካ ፍሰትና በδέ የሚታየውን መጠነኛ ንፅፅር በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: ከፈሪሳውያንና ከሰዱቃውያን ብዙዎች
  rationale: የከፊል አመልካቹን የግሪክ አወቃቀር ይጠብቃል፤ ከእነዚህ ቡድኖች ብዙዎች እንጂ ሁሉም መሆናቸውን አያመለክትም።
- source_word: ἐρχομένους ἐπὶ τὸ βάπτισμα αὐτοῦ
  choice: ወደ እርሱ ጥምቀት ሲመጡ
  rationale: ወደ ዮሐንስ የጥምቀት አገልግሎት መምጣታቸውን ያሳያል፤ በዚህ ቁጥር በእርግጥ እንደተጠመቁ አይጨምርም።
- source_word: Γεννήματα ἐχιδνῶν
  choice: እናንተ የእፉኝት ልጆች
  rationale: የγεννήματαን የተወለዱ ወይም ዘሮች የሚል ኃይለኛ ምስል በተፈጥሯዊና በሚገባ ግልጽ አማርኛ ያቀርባል።
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: ማን አስጠነቀቃችሁ?
  rationale: ὑποδείκνυμι ማሳየትንም ሊያመለክት ቢችልም፣ ከቁጣ መሸሽ በሚለው ዐውድ ውስጥ የማስጠንቀቅ ትርጉሙ ተስማሚ ነው።
- source_word: φυγεῖν ἀπὸ
  choice: ከ… እንድትሸሹ
  rationale: አስቸኳይ ሽሽትን የሚያሳየውን የግሪክ ግስ ቀጥተኛ ምስል ይጠብቃል።
- source_word: τῆς μελλούσης ὀργῆς
  choice: ከሚመጣው ቁጣ
  rationale: μελλούσης የሚያመለክተውን የቀረበውን ወይም ወደፊት የሚመጣውን ነገር እና ὀργή ያለውን ከባድ ሥነ መለኮታዊ ኃይል ሳያለዝብ ይጠብቃል።
theological_decisions:
- issue: የተነገራቸው ቡድኖች ወሰን
  choice: ከፈሪሳውያንና ከሰዱቃውያን ብዙዎች
  alternative: ፈሪሳውያንና ሰዱቃውያን ሁሉ
  rationale: የግሪኩ የከፊል አወቃቀር ከቡድኖቹ የተወሰኑ ብዙ ሰዎችን ያመለክታል፤ ነቀፋውን ከነበሩት ሰዎች አልፎ በሁሉም ላይ አያስፋፋም።
- issue: የὀργή የፍጻሜ ዘመን ክብደት
  choice: ቁጣ
  alternative: ፍርድ ወይም ቅጣት
  rationale: “ቁጣ” የምንጩን ኃይለኛ ትርጉምና ሊኖረው የሚችለውን የፍጻሜ ዘመን አመልካችነት ሳያለዝብ ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። የዮሐንስን ኃይለኛ ትንቢታዊ ነቀፋ ሳያለዝብ የግሪኩን የከፊል አገላለጽና የመጪውን ቁጣ ውጥረት ይጠብቃል።
