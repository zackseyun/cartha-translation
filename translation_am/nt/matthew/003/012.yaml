id: MAT.3.12
reference: Matthew 3:12
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ, καὶ διακαθαριεῖ τὴν ἅλωνα αὐτοῦ καὶ συνάξει τὸν σῖτον αὐτοῦ εἰς τὴν ⸀ἀποθήκην, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/012.yaml
  text: His winnowing fork is in his hand[a], and he will thoroughly clear his threshing floor and gather his wheat into the storehouse[b], but the chaff he will burn up with unquenchable fire.
translation:
  language: am
  text: የማበጠሪያ ሹካው በእጁ ነው[a]፤ አውድማውንም ፈጽሞ ያጠራል፤ ስንዴውን ወደ ጎተራው[b] ይሰበስባል፤ ገለባውን ግን በማይጠፋ እሳት ፈጽሞ ያቃጥለዋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የማበጠሪያ መንሽ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “የእህል ማከማቻው።”
    reason: lexical_alternative
lexical_decisions:
- source_word: πτύον
  choice: የማበጠሪያ መንሽ
  rationale: እህልን ወደ ላይ በመወርወር ከገለባ ለመለየት የሚያገለግለውን የእርሻ መሣሪያ ይገልጣል። ‘የማበጠሪያ’ የመሣሪያውን ተግባር ግልጽ ያደርጋል።
- source_word: διακαθαριεῖ
  choice: ፈጽሞ ያጠራል
  rationale: የግሱን አጽንዖትና ሙሉ በሙሉ የማጽዳት ወይም የማጥራት ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἅλωνα
  choice: አውድማ
  rationale: እህል የሚወቃበትንና የሚበጠርበትን ስፍራ የሚገልጽ የተለመደና ትክክለኛ የአማርኛ ቃል ነው።
- source_word: σῖτον
  choice: ስንዴ
  rationale: ቃሉ እህልን በሰፊው ሊያመለክት ቢችልም፣ ከገለባ ጋር ባለው የማበጠር ምስል ውስጥ ‘ስንዴ’ ተፈጥሯዊና የተወሰነ አቻ ነው።
- source_word: ἀποθήκην
  choice: ጎተራ
  rationale: እህል የሚከማችበትን ቦታ በአጭርና በተፈጥሯዊ አማርኛ ይገልጣል፤ የግሪኩ ቃል በሰፊው ‘ማከማቻ’ ሊባልም ይችላል።
- source_word: ἄχυρον
  choice: ገለባ
  rationale: በእህል ማበጠር ወቅት ከፍሬው የሚለየውን ከንቱ ቅሪት በትክክል ይገልጣል።
- source_word: κατακαύσει
  choice: ፈጽሞ ያቃጥለዋል
  rationale: የተጠናከረው ግስ ሙሉ በሙሉ ማቃጠልን ያመለክታል፤ ‘ፈጽሞ’ ይህን አጽንዖት ይጠብቃል።
- source_word: πυρὶ ἀσβέστῳ
  choice: ሊጠፋ በማይችል እሳት
  rationale: ሊጠፋ ወይም ሊጠፋፋ የማይችል እሳት የሚለውን ትርጉም በግልጽ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: οὗ
  choice: የማበጠሪያ መንሹ በእጁ ነው
  rationale: አንጻራዊው ተውላጠ ስም በቀደመው ቁጥር የተጠቀሰውን መጪ ሰው ያመለክታል፤ የአማርኛው አወቃቀር ይህን የባለቤትነት ግንኙነት በተፈጥሯዊ ሁኔታ ያሳያል።
theological_decisions:
- issue: ስንዴንና ገለባን የመለየት የፍርድ ምስል
  choice: ተጨባጩ የእርሻ ምሳሌና የወደፊት ፍርድ አገላለጽ ሳይለዘብ ተጠብቋል።
  alternative: በዋናው ጽሑፍ ስንዴውን ጻድቃን፣ ገለባውንም ክፉዎች ብሎ በግልጽ የሚተረጉም ማብራሪያዊ ትርጉም።
  rationale: ቁጥሩ ራሱ ምሳሌያዊውን ምስልና ከባዱን ውጤት ያቀርባል። ትርጉሙ ምስሉንና ሥነ መለኮታዊ ክብደቱን ይጠብቃል እንጂ በዋናው ጽሑፍ ውስጥ ተጨማሪ ትርጓሜ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘አውድማ፣’ ‘መንሽ፣’ ‘ጎተራ’ የሚሉት ቃላት የእርሻውን ምስል በተጨባጭነት ይጠብቃሉ፤ የቃላት አማራጮች በማስታወሻ ቀርበዋል።
