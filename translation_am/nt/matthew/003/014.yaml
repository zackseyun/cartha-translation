  text: ዮሐንስ ግን፣ “እኔ በአንተ ልጠመቅ ያስፈልገኛል፤ አንተስ ወደ እኔ ትመጣለህ?” እያለ ሊከለክለው ይሞክር ነበር።[a]
  philosophy: optimal-equivalence
  footnotes:
