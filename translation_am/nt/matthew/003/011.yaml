  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ἐγὼ μὲν ⸂ὑμᾶς βαπτίζω⸃ ἐν ὕδατι εἰς μετάνοιαν· ὁ δὲ ὀπίσω μου ἐρχόμενος ἰσχυρότερός μού ἐστιν, οὗ οὐκ εἰμὶ ἱκανὸς τὰ ὑποδήματα βαστάσαι· αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ ⸂καὶ πυρί⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/011.yaml
  text: I indeed baptize you in water for repentance[a], but the one coming after me is stronger than I, whose sandals I am not worthy to carry[c][b]. He himself will baptize you in the Holy Spirit and fire.
translation:
  language: am
  text: እኔ ለንስሓ በውሃ አጠምቃችኋለሁ[a]፤ ከእኔ በኋላ የሚመጣው ግን ከእኔ ይልቅ ኃያል ነው፤ ጫማዎቹን ልሸከም ብቁ ያልሆንኩት እርሱ ነው። እርሱ ራሱ በመንፈስ ቅዱስና በእሳት ያጠምቃችኋል[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በውሃ” እና በኋላ “በመንፈስ ቅዱስና በእሳት” የተተረጎመው የግሪኩ ἐν በአማርኛ “በ… ውስጥ” ወይም “በ… አማካይነት” ተብሎ ሊገለጽ ይችላል። “ለንስሓ” የሚለውም “ወደ ንስሓ” ተብሎ ሊተረጎም ይችላል፤ የግሪኩን አቅጣጫዊ ወይም ዓላማዊ ግንኙነት ይጠብቃል፣ ንስሓ ከጥምቀት በፊት መሆኗን ወይም ጥምቀቱ እርሷን ማመልከቱን ግን አይወስንም።
    reason: lexical_alternative
  - marker: b
    text: “እሳት” የመንጻት ወይም የፍርድ ምስል ሆኖ ሊገባ ይችላል፤ እዚህ ያለው የግሪክ አገላለጽ በራሱ ከሁለቱ አንዱን ብቻ አይወስንም።
    reason: alternative_reading
lexical_decisions:
- source_word: βαπτίζω / βαπτίσει
  choice: አጠምቃችኋለሁ / ያጠምቃችኋል
  rationale: የተለመደውን የክርስቲያናዊ ጥምቀት ቃል ይጠቀማል፤ ግሱ በዚህ አውድ የአፈጻጸሙን ዘዴ ብቻ እንዲወስን አያስገድድም።
- source_word: ἐν ὕδατι
  choice: በውሃ
  rationale: የግሪኩ ἐν በአማርኛ በተፈጥሮ ‘በ’ ይተረጎማል፤ ይህም መሣሪያንም ሆነ መካከል መሆንን በግድ ሳይለይ ክፍትነቱን ያቆያል።
- source_word: εἰς μετάνοιαν
  choice: በንስሓ ምክንያት
  rationale: εἰς ያለውን ዓላማዊ ወይም አቅጣጫዊ ግንኙነት በተነባቢ አማርኛ ይገልጣል፤ የንስሓና የጥምቀትን ቅደም ተከተል ግን በትርጉሙ አይወስንም።
- source_word: ὁ δὲ ὀπίσω μου ἐρχόμενος
  choice: ከእኔ በኋላ የሚመጣው ግን
  rationale: የአሁን ጊዜ ተሳቢውንና የቅደም ተከተል ፍቺውን በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: ἰσχυρότερός μού
  choice: ከእኔ ይልቅ ኃያል
  rationale: የንጽጽር ኃይልን በአጭርና በክቡር አገላለጽ ይሰጣል።
- source_word: οὗ οὐκ εἰμὶ ἱκανὸς
  choice: የማይገባኝ ነኝ
  rationale: ἱκανός ብቃትን ወይም ብቁነትን ሊያመለክት ቢችልም፣ በዚህ የትሕትና አገላለጽ ‘የማይገባኝ’ የአውዱን ኃይል በተፈጥሮ ያስተላልፋል።
- source_word: τὰ ὑποδήματα βαστάσαι
  choice: ጫማዎቹን ለመሸከም
  rationale: βαστάσαι በቀጥታ ‘መሸከም/መያዝ’ ማለት እንጂ ‘ማውለቅ’ አይደለም፤ ጫማ በዘመናዊ አማርኛ ግልጽ ነው።
- source_word: αὐτός
  choice: እርሱ ራሱ
  rationale: ዮሐንስንና የሚመጣውን በማነጻጸር የተሰጠውን አጽንኦት ይጠብቃል።
- source_word: ἐν πνεύματι ἁγίῳ καὶ πυρί
  choice: በመንፈስ ቅዱስና በእሳት
  rationale: ተመሳሳዩን ἐν በ‘በ’ ይመልሳል፤ ‘እሳት’ መንጻትን ወይም ፍርድን እንደሚያመለክት በዋናው ጽሑፍ አይወስንም።
theological_decisions:
- issue: ‘መንፈስ ቅዱስና እሳት’ የሚለው ፍቺ
  choice: ቃላቱን ያለ ትርጓሜያዊ ማስፋፊያ ማቆየት
  alternative: ‘በመንጻት እሳት’ ወይም ‘በፍርድ እሳት’
  rationale: ቅርብ አውዱ የመንጻትና የፍርድ ምስሎችን ሊያስነሳ ይችላል፤ ዋናው ጽሑፍ ይህን ውጥረት መፍታት የለበትም።
- issue: πνεύματι ἁγίῳ የሚያመለክተው
  choice: መንፈስ ቅዱስ
  alternative: ቅዱስ መንፈስ ወይም ቅዱስ ኃይል
  rationale: በማቴዎስ አውድና በአዲስ ኪዳን አጠቃቀም ይህ የመንፈስ ቅዱስ መጠሪያ ነው፤ ጽሑፉን ወደ ግላዊ ያልሆነ ኃይል አያስፋፋም።
