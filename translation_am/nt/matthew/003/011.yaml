  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የሐረጉ ትይዩነትና የαὐτός አጽንኦት ተጠብቀዋል፤ የእሳት ምስል ሥነ መለኮታዊ ክፍትነትም አልተዘጋም።
