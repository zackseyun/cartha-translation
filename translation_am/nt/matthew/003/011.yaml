review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately retains the principal contrasts: John baptizes with/in water, the coming one is stronger, John is unworthy to carry his sandals, and that one will baptize in the Holy Spirit and fire. However, “በንስሓ ምክንያት” normally means “because of repentance,” which changes εἰς μετάνοιαν from its purposive/directional sense. The wording for John’s unworthiness is also grammatically and idiomatically weak.'
  naturalness: The overall register is clear modern standard Amharic. “ልሸከም ብቁ ያልሆንኩት” is more natural and precise than “ለመሸከም እንኳ የማይገባኝ ነኝ.” The added “እንኳ” is not needed to convey the Greek.
  terminology: “አጠምቃችኋለሁ,” “መንፈስ ቅዱስ,” “እሳት,” and “ጫማዎቹን” are suitable. “ለንስሓ” preserves the intended purpose/direction without deciding the temporal relation between repentance and baptism.
  issues:
  - severity: medium
    issue: “በንስሓ ምክንያት” for εἰς μετάνοιαν
    rationale: This idiom means “because of repentance,” presenting repentance as the cause. The Greek εἰς is directional/purposive (“for/unto repentance”) and should not be recast as causal.
  - severity: medium
    issue: “ጫማዎቹን ለመሸከም እንኳ የማይገባኝ ነኝ”
    rationale: The expression is awkward in modern standard Amharic and “የማይገባኝ” does not clearly render the humility/fitness sense of ἱκανός. “ልሸከም ብቁ ያልሆንኩት” naturally conveys “whose sandals I am not worthy/fit to carry.”},{
