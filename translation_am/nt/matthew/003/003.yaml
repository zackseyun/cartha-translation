id: MAT.3.3
reference: Matthew 3:3
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὗτος γάρ ἐστιν ὁ ῥηθεὶς ⸀διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/003.yaml
  text: 'For this is the one spoken of through Isaiah the prophet[a], saying: “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: am
  text: 'ምክንያቱም ይህ ነቢዩ ኢሳይያስ እንዲህ ሲል የተናገረለት ነው፦


    “በምድረ በዳ[a] የሚጮኽ ሰው ድምፅ፦


    ‘የጌታን[b] መንገድ አዘጋጁ፤


    ጎዳናዎቹንም ቀጥ አድርጉ።’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይህ ሐረግ፣ “በምድረ በዳ የጌታን መንገድ አዘጋጁ” ተብሎም ሊነበብ ይችላል።
    reason: የሐረጉን አያያዝ አማራጭ ለማስቀመጥ
  - marker: b
    text: ይህ ጥቅስ ኢሳይያስ 40፥3ን ያስተጋባል፤ በዕብራይስጡ ጽሑፍ የእግዚአብሔር ስም ያህዌ (YHWH) ተጽፎአል።
    reason: ከግሪኩ κυρίου በስተጀርባ ያለውን የዕብራይስጥ መለኮታዊ ስም ለማሳወቅ
lexical_decisions:
- source_word: οὗτος
  choice: ይህም … ሰው
  rationale: በቅርብ አውዱ ያለውን መጥምቁ ዮሐንስን የሚያመለክተውን የግሪኩን ጠቋሚ ኃይል ይጠብቃል።
- source_word: γάρ
  choice: -ም
  rationale: ከቀደመው ንግግር ጋር ያለውን የማብራሪያ ግንኙነት በተፈጥሯዊ የአማርኛ አያያዥ ያሳያል።
- source_word: ὁ ῥηθεὶς διὰ Ἠσαΐου τοῦ προφήτου
  choice: ነቢዩ ኢሳይያስ … የተናገረለት ሰው
  rationale: διά ከዝርያ ቅጽ ጋር ያለውን የመካከለኛ አስተላላፊነት በአማርኛ ተፈጥሯዊ በሆነ አገባብ ይገልጣል፤ የተገብሮ ቅርጹም ተጠብቋል።
- source_word: Φωνὴ βοῶντος
  choice: የሚጮኽ ሰው ድምፅ
  rationale: የβοῶντοςን የዝርያ ተሳቢ ግንኙነት ሳያጠፋ በዘመናዊ አማርኛ ግልጽ ያደርገዋል።
- source_word: ἐν τῇ ἐρήμῳ
  choice: በምድረ በዳ
  rationale: የዮሐንስን አገልግሎትና የኢሳይያስን ጥቅስ የሚያስተጋባ የተለመደ እና ክቡር አገላለጽ ነው።
- source_word: Ἑτοιμάσατε τὴν ὁδὸν κυρίου
  choice: የጌታን መንገድ አዘጋጁ
  rationale: የብዙ ቁጥር ትእዛዙን፣ የመንገድ ምሳሌያዊ ትርጉሙንና κυρίου የሚለውን የግሪክ ቃል ይጠብቃል።
- source_word: εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ
  choice: ጎዳናዎቹንም ቀጥ አድርጉ
  rationale: የመንገድ ምስሉን፣ የብዙ ቁጥር ትእዛዙንና αὐτοῦ የሚያመለክተውን ባለቤትነት በተፈጥሯዊ አማርኛ ያቆያል።
theological_decisions:
- issue: በኢሳይያስ 40፥3 ጥቅስ ውስጥ κυρίουን መተርጎም
  choice: ጌታ
  alternative: እግዚአብሔር / ያህዌ
  rationale: የማቴዎስ የግሪክ ጽሑፍ κυρίου ይላል፤ ስለዚህ ዋናው ጽሑፍ “ጌታ” ይላል። ሆኖም የተጠቀሰው የኢሳይያስ ዕብራይስጥ ጽሑፍ YHWH የሚለውን መለኮታዊ ስም ስለያዘ፣ ይህ የጽሑፍ ዳራ በማስታወሻ ተጠብቋል።
- issue: ἐν τῇ ἐρήμῳ ከየትኛው ሐረግ ጋር እንደሚያያዝ
  choice: በምድረ በዳ የሚጮኽ
  alternative: በምድረ በዳ የጌታን መንገድ አዘጋጁ
  rationale: የግሪኩ ሥርዓተ ቃልና የማቴዎስ ቅርብ አውድ ሐረጉን ከጩኸቱ ጋር ማያያዝን ይደግፋሉ፤ የዕብራይስጡ ኢሳይያስ 40፥3 የሚፈቅደው ሌላ አያያዝ ግን በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና በሕዝብ ንባብ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ምድረ በዳ” የትንቢታዊውን ጥቅስ ክብር ይጠብቃል፤ የአማርኛው የጥቅስ አወቃቀር ግን ለተፈጥሯዊ ንባብ ተደርድሯል።
