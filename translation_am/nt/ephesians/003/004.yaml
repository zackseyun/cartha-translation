lexical_decisions:
- source_word: πρὸς ὃ … ἀναγινώσκοντες
  choice: ይህን ስታነቡ
  rationale: ሐረጉ ጳውሎስ ቀደም ሲል የጻፈውን ያመለክታል፤ ንባቡም አንባቢዎቹ ግንዛቤውን የሚረዱበት ሁኔታና መንገድ መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: δύνασθε … νοῆσαι
  choice: መረዳት ትችላላችሁ
  rationale: የመረዳት ችሎታን በግልጽና በዘመናዊ አማርኛ ያስተላልፋል።
- source_word: τὴν σύνεσίν μου
  choice: ያለኝን ግንዛቤ
  rationale: σύνεσις የአእምሮ ግንዛቤን ወይም ጠለቅ ያለ መረዳትን ያመለክታል፤ «ግንዛቤ» ከ«መረዳት» ጋር የቃል ድግግሞሽን ይቀንሳል።
- source_word: ἐν τῷ μυστηρίῳ
  choice: ስለ … ምሥጢር
  rationale: ἐν እዚህ የግንዛቤውን መስክ ያሳያል፤ «ስለ … ያለኝ ግንዛቤ» በአማርኛ ተፈጥሯዊ ሲሆን የግሪኩን ትርጉም ይጠብቃል።
- source_word: τοῦ Χριστοῦ
  choice: መሲሑ
  rationale: Χριστός በዚህ ዐውድ እንደ ማዕረግ ስለሚሠራ፣ «መሲሕ» የቃሉን ትርጉም ያስተላልፋል፤ የታወቀው «ክርስቶስ» በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: የΧριστοῦ አተረጓጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: ቃሉ በዚህ ስፍራ የማዕረግ ስም መሆኑን «መሲሕ» በግልጽ ያሳያል፤ ባህላዊው አጠራር ግን እንደ አማራጭ ተመዝግቧል።
