  yaml_path: translation/nt/ephesians/003/004.yaml
  text: By reading this[a], you are able to understand my insight into the mystery of Messiah,
translation:
  language: am
  text: ይህን ስታነቡ፣ ስለ መሲሑ[a] ምሥጢር ያለኝን ግንዛቤ መረዳት ትችላላችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ክርስቶስ»። የግሪኩ የማዕረግ ስም Χριστός «መሲሕ» ወይም በተለምዶ «ክርስቶስ» ተብሎ ሊተረጎም ይችላል።
