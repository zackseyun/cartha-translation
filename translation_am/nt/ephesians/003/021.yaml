source:
  edition: SBLGNT
  text: αὐτῷ ἡ δόξα ἐν τῇ ἐκκλησίᾳ ⸀καὶ ἐν Χριστῷ Ἰησοῦ εἰς πάσας τὰς γενεὰς τοῦ αἰῶνος τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/021.yaml
  text: To him be glory in the church and in Messiah Jesus through all generations forever and ever[a]. Amen.
translation:
  language: am
  text: ለእርሱ በቤተ ክርስቲያንና በመሲሑ ኢየሱስ[a]፣ በትውልድ ሁሉ ለዘላለም ዓለም ክብር ይሁን። አሜን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በክርስቶስ ኢየሱስ።” የግሪኩ Χριστός የሚለው ማዕረግ ትርጉሙን ለመጠበቅ እዚህ “መሲሕ” ተብሎ ተተርጉሟል።
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτῷ ἡ δόξα
  choice: ለእርሱ … ክብር ይሁን
  rationale: ግስ የሌለውን የግሪክ የውዳሴ አገላለጽ በተፈጥሯዊና በክብር ባለው የአማርኛ ምኞታዊ አገላለጽ ያቀርባል።
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: በቤተ ክርስቲያን
  rationale: ἐκκλησία በዚህ የጳውሎስ አውድ የእግዚአብሔርን ሕዝብ ማኅበር ያመለክታል፤ ‘ቤተ ክርስቲያን’ የተለመደና በዘመናዊ አማርኛ በቀላሉ የሚገባ ነው።
- source_word: καὶ ἐν Χριστῷ Ἰησοῦ
  choice: እና በመሲሑ ኢየሱስ
  rationale: Χριστόςን እንደ ትርጉም ያለው ማዕረግ ‘መሲሕ’ ብሎ ያቀርባል፤ ἐν የሚለውም ከቀደመው ሐረግ ጋር ያለውን ትይዩነት ለመጠበቅ ‘በ’ ተብሎ ተተርጉሟል።
- source_word: εἰς πάσας τὰς γενεὰς
  choice: በትውልድ ሁሉ
  rationale: የጊዜውን ቀጣይነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τοῦ αἰῶνος τῶν αἰώνων
  choice: ከዘላለም እስከ ዘላለም
  rationale: ‘የዘመናት ዘመን’ የሚለውን ጥሬ አገላለጽ ሳያደበዝዝ፣ ወሰን የሌለውን ቆይታ በተለመደ የአማርኛ ውዳሴ አገላለጽ ያስተላልፋል።
- source_word: ἀμήν
  choice: አሜን
  rationale: በአማርኛ የአምልኮ አጠቃቀም የተለመደውን ቅርጽ ይጠቀማል።
theological_decisions:
- issue: Χριστῷን እንደ ማዕረግ ወይም እንደ ስም መሰል ቅርጽ ማቅረብ
  choice: መሲሑ ኢየሱስ
  alternative: ክርስቶስ ኢየሱስ
  rationale: Χριστός በዚህ ሐረግ ትርጉም ያለው ማዕረግ ስለሆነ ‘መሲሕ’ ተብሎ ተተርጉሟል፤ የተለመደው የድምፅ ቅጂ በማስታወሻ ቀርቧል።
- issue: ἐν የሚለው በቤተ ክርስቲያንና በመሲሑ ኢየሱስ ያለው ግንኙነት
  choice: በ…ና በ…
  alternative: በ… መካከል እና በ… ውስጥ
  rationale: የግሪኩን ትይዩ አወቃቀርና ያልተወሰነውን የἐν ግንኙነት ይጠብቃል፤ ‘መካከል’ ወይም ‘ውስጥ’ ብሎ አንዱን ትርጓሜ አያስገድድም።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክብር ያለውና ለሕዝብ ንባብ ተስማሚ ነው። የውዳሴውን ምት ለመጠበቅ ‘ለእርሱ … ክብር ይሁን’ የሚለው አወቃቀር ተመርጧል።
