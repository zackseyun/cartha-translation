review_pass:
  verdict: revise
  source_fidelity: The draft preserves the doxological structure, the parallel ἐν phrases, and the title sense of Χριστῷ. However, «ከዘላለም እስከ ዘላለም» can imply a duration beginning in eternity (“from eternity”), whereas the Greek idiom is an emphatic ascription of unending future duration.
  naturalness: «ለእርሱ … ክብር ይሁን» is natural, dignified modern Amharic. «በትውልድ ሁሉ» is acceptable for “through all generations.” Replacing the final temporal idiom with the established concise doxological expression improves precision and flow.
  terminology: «ቤተ ክርስቲያን», «መሲሑ ኢየሱስ», «ክብር», and «አሜን» are appropriate. The footnote correctly marks the title/name-like alternative, and its anchor follows «መሲሑ ኢየሱስ».
  issues:
  - severity: medium
    issue: The phrase «ከዘላለም እስከ ዘላለም» introduces “from eternity,” which is not explicitly expressed by τοῦ αἰῶνος τῶν αἰώνων.
    rationale: The Greek idiom intensifies unending duration (“forever and ever”), rather than specifying an eternal starting point. «ለዘላለም ዓለም» is a standard Amharic biblical/doxological equivalent that retains this force without adding a starting point.
  revised_text: ለእርሱ በቤተ ክርስቲያንና በመሲሑ ኢየሱስ[a]፣ በትውልድ ሁሉ ለዘላለም ዓለም ክብር ይሁን። አሜን።
