  terminology: «ምሥጢሩ» appropriately retains the established Pauline term without importing an explanation. «በመገለጥ» and «እንደታወቀኝ» preserve the distinct wording of ἀποκάλυψις and ἐγνωρίσθη. Footnote a is adjusted so its first alternative does not incorrectly introduce a possessive sense (“its revelation”).
