  rationale: የግሪኩ አገላለጽ በቅርጹ ሁኔታዊ ቢሆንም፣ ጳውሎስ ነገሩን እውነት እንደሆነ ጠብቆ የሚናገርበትን የንግግር ኃይል ያሳያል። ሁኔታዊው ቀጥተኛ አማራጭ በማስታወሻው ተጠብቋል።
- source_word: ἠκούσατε
  choice: ሰማችሁ
  rationale: የአኦሪስት ግሱን እንደ አንድ ሙሉ የመስማት ክስተት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: οἰκονομίαν
  choice: አደራ
  rationale: ቃሉ ለጳውሎስ የተሰጠውን የማስተዳደር ኃላፊነትና ተልእኮ ያመለክታል፤ ‘አደራ’ የተሰጠ ኃላፊነት የሚለውን ሐሳብ በአጭርና በተፈጥሯዊ መንገድ ይገልጣል።
- source_word: χάριτος
  choice: ጸጋ
  rationale: የእግዚአብሔርን ነፃ ቸርነት፣ ስጦታና ጥሪ የሚያካትተውን የጳውሎስ አጠቃቀም የሚጠብቅ የተለመደ መጽሐፍ ቅዱሳዊ ቃል ነው።
- source_word: τοῦ θεοῦ
  choice: የእግዚአብሔር
  rationale: ጸጋው የእግዚአብሔር መሆኑንና ከእርሱ መምጣቱን የግሪኩን የባለቤትነት ግንኙነት ጠብቆ ይገልጣል።
- source_word: τῆς δοθείσης μοι
  choice: ለእኔ ስለተሰጠው
  rationale: በግሪኩ የተሳቢ አንቀጽ በቀጥታ ‘ጸጋ’ን ይገልጣል፤ ትርጉሙም ጸጋው ለጳውሎስ እንደተሰጠ ግልጽ ያደርጋል።
- source_word: εἰς ὑμᾶς
  choice: ለእናንተ ሲባል
  rationale: ለጳውሎስ የተሰጠው ጸጋና አደራ ወደ አንባቢዎቹ ያመራና ለጥቅማቸው የሆነ መሆኑን በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: ‘የእግዚአብሔር ጸጋ አደራ’ የሚያመለክተው
  choice: ጳውሎስ ለአንባቢዎቹ ጥቅም እንዲያገለግል የተሰጠውን ጸጋና የማስተዳደር ኃላፊነት ያመለክታል።
  alternative: ቃሉ በዋናነት ሰፊውን የእግዚአብሔር የድነት እቅድ ወይም ዘመን ያመለክታል።
  rationale: የአውዱ ትኩረት ጳውሎስ ለአሕዛብ ባለው አገልግሎት ላይ ነው። ‘አደራ’ የግል ኃላፊነቱን ይጠብቃል፤ ከዚህ በስተጀርባ ያለውን ሰፊ መለኮታዊ እቅድም አይክድም።
- issue: የεἴ γε ኃይል
  choice: ጳውሎስ አንባቢዎቹ እንደሰሙ የሚጠብቅበት የንግግር ግምት ነው።
  alternative: እውነተኛ ጥርጣሬን የሚገልጽ ‘በእርግጥ ሰምታችሁ ከሆነ’ የሚል ቀጥተኛ ሁኔታ ነው።
  rationale: አውዱ ጳውሎስ ነገሩን እውነት አድርጎ እንደሚጠብቅ ያመለክታል፤ ሆኖም የግሪኩ ሁኔታዊ ቅርጽ በእግር ማስታወሻ ተጠብቋል።
