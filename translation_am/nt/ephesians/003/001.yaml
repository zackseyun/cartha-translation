lexical_decisions:
- source_word: Τούτου χάριν
  choice: ስለዚህም
  rationale: ወደ ቀደመው ሐሳብ የሚመለስ ምክንያታዊ የንግግር ማያያዣ ነው፤ «ስለዚህም» በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: ἐγὼ Παῦλος
  choice: እኔ ጳውሎስ
  rationale: ግልጽ ተውላጠ ስሙ የሚሰጠውን አጽንዖት ጠብቆ ጳውሎስን በመግለጫ አቀራረብ ያቀርባል።
- source_word: ὁ δέσμιος
  choice: እስረኛ
  rationale: በቁጥጥር ሥር ያለን ሰው በቀጥታ የሚገልጽ ተፈጥሯዊ የአማርኛ ቃል ነው።
- source_word: τοῦ Χριστοῦ Ἰησοῦ
  choice: የመሲሑ ኢየሱስ
  rationale: Χριστός እዚህ የኢየሱስ ማዕረግ ስለሆነ «መሲሕ» ተብሎ ተተርጉሟል፤ የግሪኩ የባለቤትነት/ዝምድና ቅርጽም ተጠብቋል።
- source_word: ὑπὲρ ὑμῶν
  choice: ስለ እናንተ
  rationale: የጳውሎስ መታሰር ለአንባቢዎቹ ጥቅም ወይም ስለ እነርሱ መሆኑን የሚገልጽ አጭርና ተፈጥሯዊ አቀራረብ ነው።
- source_word: τῶν ἐθνῶν
  choice: ስለ አሕዛብ
  rationale: በዚህ ዐውድ ቃሉ አይሁድ ያልሆኑትን ያመለክታል፤ ሁለተኛው «ስለ» ቃሉን ከ«እናንተ» ጋር በማብራሪያዊ ግንኙነት ያቆራኛል።
theological_decisions:
- issue: Χριστοῦ እንደ ማዕረግ ወይም እንደ ስም መሰል ቅርጽ መተርጎም
  choice: መሲሑ ኢየሱስ
  alternative: ክርስቶስ ኢየሱስ
  rationale: Χριστός በዚህ ስፍራ «የተቀባው/መሲሑ» የሚለውን ማዕረግ ይይዛል፤ የተለመደው ቤተ ክርስቲያናዊ ቅርጽ ግን በማስታወሻ ተጠብቋል።
- issue: የτοῦ Χριστοῦ Ἰησοῦ የዝምድና ትርጉም
  choice: የመሲሑ ኢየሱስ እስረኛ
  alternative: በመሲሑ ኢየሱስ ምክንያት እስረኛ
  rationale: የግሪኩ የዝምድና ቅርጽ ጳውሎስ የመሲሑ እስረኛ መሆኑን ሊያመለክት ስለሚችል፣ ምክንያቱን ብቻ በግልጽ በመወሰን የሚፈጠረው ትርጓሜ አልገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ የሚገባ አማርኛ ተጠቅሟል። በመጨረሻው ያለው ረጅም ሰረዝ በግሪኩ የተቋረጠውንና በቀጣዮቹ ቁጥሮች የሚቀጥለውን ሰዋሰዋዊ ሐሳብ ያሳያል።
