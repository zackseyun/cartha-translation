  rationale: ለሐዋርያትና ለነቢያት ስለተሰጠ መለኮታዊ መገለጥ የሚናገረው አውድ ቅዱስ መንፈስን በጽኑ ይደግፋል፤ ሆኖም «በመንፈስ» ማለት መንገድን ወይም ሉልን ሊያመለክት የሚችለውን ሰዋሰዋዊ ግልጽነት እጥረት ይጠብቃል።
