  rationale: የአድራጊውን ማንነት ሳይጨምር የግሪኩን ተደራጊ ቅርጽና ‘እንዲታወቅ መደረግ’ የሚለውን ፍቺ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
