  rationale: የምንጩን ሴማዊ ቅርጽ የሚያስተጋባ እና በአማርኛም የሰውን ዘር በአጠቃላይ ሊያመለክት የሚችል አገላለጽ ነው።
- source_word: ὡς νῦν
  choice: አሁን … እንደተገለጠው
  rationale: ቀደም ሲል ከነበረው ጋር የሚደረገውን የጊዜና የደረጃ ንጽጽር ይጠብቃል፤ ምስጢሩ ፈጽሞ አይታወቅም ነበር የሚል ድምዳሜ አይጭንም።
- source_word: ἀπεκαλύφθη
  choice: ተገለጠ
  rationale: የመገለጥን ሐሳብና የተደራጊ ቅርጹን የሚጠብቅ ግልጽ የአማርኛ ቃል ነው።
- source_word: τοῖς ἁγίοις ἀποστόλοις αὐτοῦ καὶ προφήταις
  choice: ለቅዱሳን ሐዋርያቱና ነቢያቱ
  rationale: «ቅዱሳን» የተቀናጁትን ሐዋርያትና ነቢያት በጋራ እንዲገልጽ ያደርጋል፤ የባለቤትነት ቅጥያውም αὐτοῦን ያሳያል።
- source_word: ἐν πνεύματι
  choice: በመንፈስ
  rationale: በዚህ የመገለጥ አውድ «መንፈስ» ቅዱስ መንፈስን እንደሚያመለክት የሚገባ ሲሆን፣ «በ» የተባለው መስተዋድድ መንፈስ መንገድ/አድራጊ ነው ወይስ የተግባሩ ሉል ነው የሚለውን ልዩነት አይዘጋም።
theological_decisions:
- issue: የπνεύματι አመልካች
