  source_fidelity: The draft accurately renders the principal lexical elements and preserves both the γνώ-/γνῶναι paradox ('እውቀትን ... እንድታውቁ') and the formally open genitive in 'የመሲሑን ፍቅር.' Its directional rendering of εἰς as 'እስከ ... ድረስ' is a defensible formal equivalent for this compressed expression. However, τε coordinates γνῶναί with the preceding prayer requests, whereas the draft places -ም on the later πληρωθῆτε clause. The connective should therefore be attached to 'እንድታውቁ.'
