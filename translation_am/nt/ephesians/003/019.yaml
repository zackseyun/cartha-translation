- issue: ‘የመሲሑ ፍቅር’ የሚለው የዝምድና አገባብ
  choice: የመሲሑን ፍቅር በሚለው መደበኛ አገባብ አለመፍታት
  alternative: መሲሑ ለእናንተ ያለውን ፍቅር / ለመሲሑ ያላችሁን ፍቅር
  rationale: ዐውዱ የመሲሑን ፍቅር ቢያመለክትም፣ የግሪኩ የዝምድና አገባብ ይህን በሐረጉ ራሱ በግልጽ አይፈታውም፤ ስለዚህ አሻሚነቱ ተጠብቋል።
- issue: εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ
  choice: እስከ እግዚአብሔር ሙላት ሁሉ ድረስ
  alternative: በእግዚአብሔር ሙላት ሁሉ እንድትሞሉ
  rationale: የግሪኩ አገባብ የታመቀና ወደ ግብ የሚያመለክት ነው። ዋናው ትርጉም ይህን እንቅስቃሴ ይጠብቃል፤ ከጽሑፉ በላይ የሥነ መለኮት መግለጫም አያስገባም።
