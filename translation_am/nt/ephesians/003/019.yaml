- source_word: ὑπερβάλλουσαν τῆς γνώσεως
  choice: እውቀትን የሚያልፈውን
  rationale: ‘ማወቅ’ እና ‘እውቀት’ ያላቸውን የቃል ግንኙነትና እውቀትን የሚያልፈውን ማወቅ የሚለውን ሆን ተብሎ የቀረበ ውጥረት ይጠብቃል።
- source_word: ἀγάπην τοῦ Χριστοῦ
  choice: የመሲሑን ፍቅር
  rationale: Χριστόςን እንደ ማዕረግ ‘መሲሕ’ ብሎ ይተረጉማል፤ የግሪኩን የዝምድና አገባብ በመጠበቅ ፍቅሩ የመሲሑ ፍቅር ወይስ ለመሲሑ ያለ ፍቅር መሆኑን በዋናው ጽሑፍ አይገድብም።
- source_word: ἵνα πληρωθῆτε
  choice: እንድትሞሉ
  rationale: የዓላማን ወይም የውጤትን ኃይል በተፈጥሯዊ አማርኛ ያሳያል፤ የግሪኩን ተደራጊ አንቀጽም ይጠብቃል።
- source_word: εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ
  choice: እስከ እግዚአብሔር ሙላት ሁሉ ድረስ
  rationale: εἰς ያለውን ወደ ግብ የሚያመለክት ኃይል ‘እስከ…ድረስ’ በማለት ይጠብቃል፤ ሐረጉን ‘በ…ተሞሉ’ ብሎ በመፍታት አያቀልለውም።
theological_decisions:
- issue: የΧριστοῦ አተረጓጎም
  choice: መሲሕ
  alternative: ክርስቶስ
