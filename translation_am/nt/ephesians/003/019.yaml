  yaml_path: translation/nt/ephesians/003/019.yaml
  text: and to know the love of Messiah that surpasses knowledge[b][a], so that you may be filled unto all the fullness of God.
translation:
  language: am
  text: እውቀትን የሚያልፈውን የመሲሑን ፍቅር[a] እንድታውቁም፣ እስከ እግዚአብሔር ሙላት ሁሉ ድረስ እንድትሞሉ።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ በባህላዊ አተረጓጎም፣ “የክርስቶስን ፍቅር።”
    reason: alternative_reading
  - marker: b
    text: ወይም፣ “በእግዚአብሔር ሙላት ሁሉ እንድትሞሉ።” የግሪኩ ቃል በቀጥታ “እስከ እግዚአብሔር ሙላት ሁሉ ድረስ እንድትሞሉ” ይላል፤ ይህ የታመቀ አነጋገር ወደ እግዚአብሔር ሙላት ሙሉ መጠን መድረስን ሊያጎላ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: γνῶναί
  choice: እንድታውቁ
  rationale: የግሪኩን የማወቅ መሠረታዊ ትርጉም ይጠብቃል፤ በዐውዱም አእምሯዊና በልምምድ የሚገኝ እውቀትን ሁለቱንም ሊያካትት ይችላል።
- source_word: τε
