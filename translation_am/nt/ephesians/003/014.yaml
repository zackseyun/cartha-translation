lexical_decisions:
- source_word: Τούτου χάριν
  choice: ስለዚህ ምክንያት
  rationale: ይህ አገላለጽ ከቀደመው ሐሳብ ጋር ያለውን የምክንያት ግንኙነት በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: κάμπτω τὰ γόνατά μου
  choice: እንበረከካለሁ
  rationale: ግሪክኛው በቃል ደረጃ ‘ጉልበቶቼን እጥፋለሁ’ ቢልም፣ በአማርኛ ‘እንበረከካለሁ’ የጸሎቱን አካላዊ አቋም በተፈጥሯዊና ግልጽ ሁኔታ ይገልጻል።
- source_word: πρὸς τὸν πατέρα
  choice: በአብ ፊት
  rationale: πρός ወደሚቀርብለት ሰው ያለውን አቅጣጫና ትኩረት ያመለክታል፤ ‘በአብ ፊት መንበርከክ’ በአማርኛ የጸሎትን አቅጣጫ በተፈጥሯዊ መንገድ ይገልጻል።
- source_word: πατέρα
  choice: አብ
  rationale: በዐውዱ ጳውሎስ ጸሎቱን ወደ እግዚአብሔር እያቀረበ ነው፤ ‘አብ’ መለኮታዊውን መጠሪያ በክብርና በአጭር መልኩ ያስተላልፋል።
theological_decisions:
