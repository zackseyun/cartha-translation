  choice: አብ
  alternative: አባት
  rationale: የጸሎቱ ዐውድና ተከታዩ ቁጥር ተጠቃሹ እግዚአብሔር መሆኑን ያሳያሉ፤ ‘አብ’ ይህን በተለመደ አማርኛ መለኮታዊ መጠሪያ ያስተላልፋል።
