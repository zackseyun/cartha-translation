review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the causal connection and identifies God as the Father, but it compresses the explicitly stated ‘my knees’ and renders πρός as ‘before,’ adding a spatial nuance not required by the Greek.
  naturalness: ‘በአብ ፊት እንበረከካለሁ’ is understandable, but ‘ለአባት ጉልበቶቼን እንበረክካለሁ’ is clear modern standard Amharic and retains the bodily image.
  terminology: ‘አባት’ is the ordinary modern Amharic term for ‘Father’ and suitably conveys the contextual divine title. It avoids making the wording depend on the more ecclesiastical register of ‘አብ.’
  issues:
  - severity: medium
    issue: The explicit phrase ‘my knees’ is omitted.
    rationale: τὰ γόνατά μου is expressed in the Greek. Rendering only ‘I kneel’ reduces the source’s bodily imagery; it can be retained naturally in Amharic.
  - severity: low
    issue: ‘በአብ ፊት’ renders the relation as ‘before the Father.’
    rationale: πρός primarily marks orientation toward the Father here. ‘ለአባት’ is a natural prayer-context equivalent without adding the ‘before’ nuance.
  - severity: low
    issue: ‘አብ’ is more ecclesiastical than necessary for the stated modern-standard register.
    rationale: ‘አባት’ is natural contemporary Amharic while preserving the titular referent supplied by the immediate context.
  revised_text: ስለዚህ ምክንያት ለአባት ጉልበቶቼን እንበረክካለሁ፤
