    text: ወይም፣ “በውስጣዊው ሰው።” ግሪክኛው “ውስጣዊ ሰው” ይላል፤ ይህም የሰውን ውስጣዊ ማንነት የሚወክል ነጠላ አገላለጽ ነው።
