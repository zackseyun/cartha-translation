- source_word: κατὰ τὸ πλοῦτος τῆς δόξης αὐτοῦ
  choice: እንደ ክብሩ ባለጠግነት
  rationale: κατά የሚያመለክተውን መለኪያ ወይም መስፈርት ይጠብቃል፤ ባለጠግነትም πλοῦτοςን፣ ክብርም δόξαን ያስተላልፋሉ።
- source_word: δυνάμει
  choice: በኃይል
