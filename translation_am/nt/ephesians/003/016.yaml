- source_word: διὰ τοῦ πνεύματος αὐτοῦ
  choice: በመንፈሱ አማካይነት
  rationale: διά ከጄኒቲቭ ጋር የሚያመለክተውን አማካይነት ይገልጣል፤ መንፈሱ የእግዚአብሔርን መንፈስ ያመለክታል።
- source_word: εἰς τὸν ἔσω ἄνθρωπον
  choice: በውስጣዊ ማንነታችሁ
  rationale: የመጠንከሩን ውስጣዊ ዒላማ በዘመናዊና ለሁሉም ተደራሽ አማርኛ ይገልጣል፤ ቃል በቃል አገላለጹ በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: የπνεῦμα ማጣቀሻ
  choice: የእግዚአብሔር መንፈስ፤ “መንፈሱ”
  alternative: አካላዊ ያልሆነ መለኮታዊ ተጽዕኖ
  rationale: የአውዱ መለኮታዊ ተዋናይነትና የጳውሎስ አጠቃቀም πνεῦμα የእግዚአብሔርን መንፈስ እንደሚያመለክት ይደግፋሉ።
- issue: የἔσω ἄνθρωπον አተረጓጎም
  choice: ውስጣዊ ማንነታችሁ
  alternative: ውስጣዊው ሰው
  rationale: ἄνθρωπος እዚህ ወካይ ነጠላ ሲሆን ወንድን ብቻ አያመለክትም። “ውስጣዊ ማንነት” የውስጥ ሰውነትን ትርጉም በግልጽ አማርኛ ያስተላልፋል፤ ቃል በቃሉ አማራጭ በማስታወሻ ተገልጧል።
