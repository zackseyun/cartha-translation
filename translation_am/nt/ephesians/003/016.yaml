  choice: እንድት…
  rationale: የጳውሎስን የጸሎት ልመና ይዘትና ዓላማ በተፈጥሯዊ የአማርኛ አገባብ ያስተላልፋል።
- source_word: δῷ
  choice: ይስጣችሁ
