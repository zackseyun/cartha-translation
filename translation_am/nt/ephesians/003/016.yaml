    issue: The genitive relation in κατὰ τὸ πλοῦτος τῆς δόξης αὐτοῦ is insufficiently expressed.
    rationale: “እንደ ክብሩ ባለጠግነት” omits the natural Amharic possessive connection. “እንደ የክብሩ ባለጠግነት” clearly conveys “according to the riches of his glory.”
