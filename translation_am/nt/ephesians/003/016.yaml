  text: እንደ የክብሩ ባለጠግነት፣ በመንፈሱ አማካይነት በውስጣዊ ማንነታችሁ[a] በኃይል እንድትጠነክሩ ይስጣችሁ።
  philosophy: optimal-equivalence
  footnotes:
