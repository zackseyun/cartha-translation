    text: ወይም፣ “አገልጋይ ተደረግሁ።”
    reason: lexical_alternative
  revision_rationale: The revision removes the added explanatory clause, restores a direct syntactic relationship between Paul’s becoming a gospel servant and the divine gift, and preserves the source’s measured ambiguity in ἐγενήθην. It also retains the lexical-alternative footnote and the terminal dash.
