  text: οὗ ⸀ἐγενήθην διάκονος κατὰ τὴν δωρεὰν τῆς χάριτος τοῦ θεοῦ ⸂τῆς δοθείσης⸃ μοι κατὰ τὴν ἐνέργειαν τῆς δυνάμεως αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/007.yaml
  text: of which I became a servant according to the gift of God's grace given to me according to the working of his power—[a]
translation:
  language: am
  text: የዚህ ወንጌል አገልጋይ የሆንሁት፣ በኃይሉ አሠራር መጠን ለእኔ በተሰጠው የእግዚአብሔር ጸጋ ስጦታ መሠረት ነው—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗ
  choice: የዚህም ወንጌል
  rationale: አንጻራዊው ተውላጠ ስም በቀደመው አውድ ወደሚገኘው εὐαγγέλιον (‘ወንጌል’) ይመለሳል። ስሙን መድገም በአማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: ἐγενήθην
  choice: ሆንሁ
  rationale: ወደ አገልጋይነት ሚና መግባቱን በተፈጥሯዊ አማርኛ ይገልጣል፤ የተደረገበትን አካል በግሱ ውስጥ አስገድዶ አይወስንም።
- source_word: διάκονος
  choice: አገልጋይ
  rationale: በዚህ አውድ ቃሉ ለወንጌል የሚደረግን አገልግሎት ያመለክታል፤ የኋለኛውን መደበኛ የቤተ ክርስቲያን ሹመት አያስገባም።
- source_word: κατὰ τὴν δωρεὰν τῆς χάριτος τοῦ θεοῦ
  choice: በተሰጠኝ የእግዚአብሔር ጸጋ ስጦታ መሠረት
  rationale: κατά የመሠረትን ወይም የመመዘኛን ሐሳብ ይይዛል፤ ‘ጸጋ ስጦታ’ ደግሞ የግሪኩን የስጦታና የጸጋ ግንኙነት ይጠብቃል።
- source_word: τῆς δοθείσης μοι
  choice: በተሰጠኝ
  rationale: ተሳቢው አገላለጽ ጸጋው ለጳውሎስ መሰጠቱን በአጭርና ተፈጥሯዊ መንገድ ያሳያል።
- source_word: κατὰ τὴν ἐνέργειαν τῆς δυνάμεως αὐτοῦ
  choice: እንደ ኃይሉ አሠራር መጠን
  rationale: ἐνέργεια በተግባር የሚሠራ ኃይልን ያመለክታል፤ አገላለጹ የሁለተኛውን κατά የመመዘኛ ሐሳብም ይጠብቃል።
theological_decisions:
- issue: የጳውሎስ διάκονος ሚና
  choice: አገልጋይ
  alternative: ዲያቆን ወይም አገልጋይ ካህን
  rationale: አውዱ የሚያተኩረው ጳውሎስ ለወንጌል በተሰጠው አገልግሎት ላይ እንጂ በተወሰነ የቤተ ክርስቲያን ሹመት ላይ አይደለም።
- issue: በἐγενήθην ውስጥ ያለው የአድራጊነት ጥያቄ
  choice: ሆንሁ
  alternative: ተደረግሁ
  rationale: ግሪኩ ‘ሆንሁ’ ወይም ‘ተደረግሁ’ ተብሎ ሊተረጎም ይችላል። ዋናው ንባብ የግሱን አሻሚነት ሳያጠፋ ተፈጥሯዊ ነው፤ የእግዚአብሔር ጸጋና ኃይል ምንጩ መሆናቸውን የቀረው ሐረግ ግልጽ ያደርጋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ተደጋጋሚ κατά በ‘መሠረት’ እና ‘እንደ…መጠን’ ተለይቶ ቀርቧል፤ የመጨረሻው ሰረዝም ሐሳቡ በሚቀጥለው ቁጥር እንደሚቀጥል ያሳያል።
