- source_word: ἐν ταῖς θλίψεσίν μου
  choice: በሚደርስብኝ መከራ ምክንያት
  rationale: ἐν ቃል በቃል ‘በ…ውስጥ’ ሊባል ቢችልም፣ ከἐγκακεῖν ጋር የመነሻ ወይም የምክንያት ግንኙነት ያሳያል። ‘መከራ’ የθλῖψιςን ክብደት ይጠብቃል።
- source_word: ὑπὲρ ὑμῶν
  choice: ስለ እናንተ
  rationale: መከራው ለአንባቢዎቹ ጥቅምና በእነርሱ ምክንያት መሆኑን በቀላል አማርኛ ያሳያል።
- source_word: ἥτις
  choice: ይህም
  rationale: ነጠላው አንጻራዊ ተውላጠ ስም ወደ ቀደመው የመከራ ሐሳብ በአጠቃላይ መመለሱን ያስቀምጣል።
- source_word: δόξα ὑμῶν
  choice: ክብራችሁ
  rationale: δόξα እዚህ ክብርንና ከፍ ያለ ዋጋን ያመለክታል፤ ‘ክብራችሁ’ የጽሑፉን ሥነ መለኮታዊና ንግግራዊ ክብደት ሳያቀልል ይጠብቃል።
theological_decisions:
- issue: ἥτις ἐστὶν δόξα ὑμῶν የሚለው ነጠላ አንጻራዊ አረፍተ ነገር የሚያመለክተው
  choice: ‘ይህም’ በማለት የጳውሎስን ስለ እነርሱ የሆነ መከራ እንደ አንድ ሙሉ ሐሳብ ያመለክታል።
  alternative: የጳውሎስን አገልግሎትና ስለ እነርሱ የተቀበለውን መከራ በሰፊው ሊያመለክት ይችላል።
  rationale: በአቅራቢያ ያለው ቀዳሚ ስም ‘መከራዬ’ ቢሆንም፣ ነጠላው ተውላጠ ስም መላውን ቀዳሚ ሐሳብ ሊያጠቃልል ይችላል። ትርጉሙ ይህን ውጥረት ሳይዘጋ ይጠብቃል።
