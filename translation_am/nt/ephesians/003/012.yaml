  yaml_path: translation/nt/ephesians/003/012.yaml
  text: in whom we have boldness and access with confidence through faith in him[a].
translation:
  language: am
  text: በእርሱ አማካይነት፣ በድፍረትና በመተማመን የመቅረብ መብት አለን፤ ይህም በእርሱ በማመን ነው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በእርሱ ታማኝነት።” የግሪኩ አገላለጽ በእርሱ ላይ የሚደረግ እምነትን ወይም የእርሱን ታማኝነት ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: በእርሱም
  rationale: የዝምድናው ተውላጠ ስም ተባዕታይ ነጠላ ሲሆን፣ በቀደመው አውድ ወደተጠቀሰው መሲሕ ያመለክታል። ‘በእርሱ’ የሚለውም ከክርስቶስ ጋር ያለውን ኅብረት ይጠብቃል።
- source_word: παρρησίαν
  choice: በድፍረት
  rationale: ቃሉ ግልጽነትን፣ ነፃነትን ወይም ያለ ፍርሃት መናገርንና መቅረብን ያመለክታል። ‘በድፍረት’ ከπεποίθησις የተለየውን ገጽታ ይጠብቃል።
- source_word: προσαγωγὴν
  choice: ወደ እግዚአብሔር መቅረብ
  rationale: በጳውሎስ አጠቃቀም ቃሉ ወደ እግዚአብሔር ፊት የመግባትን መብትና ዕድል ያመለክታል። በአማርኛ ‘መቅረብ’ ተፈጥሯዊ ሲሆን፣ የታሰበውን መዳረሻ ግልጽ ለማድረግ ‘ወደ እግዚአብሔር’ በአውዱ መሠረት ተጨምሯል።
- source_word: ἐν πεποιθήσει
  choice: በሙሉ እምነት
  rationale: ይህ አገላለጽ የተረጋገጠ መተማመንን ያመለክታል። ‘በሙሉ እምነት’ በዘመናዊ አማርኛ የማያመነታ መተማመንን ያሳያል፣ ከ‘ድፍረት’ም ይለያል።
- source_word: διὰ τῆς πίστεως αὐτοῦ
  choice: በእርሱም በማመናችን
  rationale: ዋናው ጽሑፍ αὐτοῦን ተደራጊ ባለቤት አድርጎ፣ πίστιςን በእርሱ ላይ የሚደረግ እምነት ብሎ ይተረጉማል። የክርስቶስን ታማኝነት የሚያመለክተው አማራጭ በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: የδιὰ τῆς πίστεως αὐτοῦ ትርጓሜ
  choice: በእርሱ በማመናችን
  alternative: በእርሱ ታማኝነት
  rationale: የግሪኩ ባለቤት አገላለጽ በክርስቶስ ላይ የሚደረግን እምነት ወይም የክርስቶስን የራሱን ታማኝነት ሊያመለክት ይችላል። የአማኞችን ወደ እግዚአብሔር መቅረብ በሚያጎላው አውድ መሠረት የመጀመሪያው ንባብ በዋናው ጽሑፍ ተመርጧል፤ እውነተኛው አሻሚነት ግን በማስታወሻ ተጠብቋል።
