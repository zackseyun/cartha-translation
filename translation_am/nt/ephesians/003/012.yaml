  rationale: 'The revision restores the source order and semantic distinction: access is possessed in/through Christ, and it is received through faith in him. It replaces “በሙሉ እምነት” with “በመተማመን” to distinguish confidence from faith, while retaining the alternative subjective-genitive reading in the footnote.'
