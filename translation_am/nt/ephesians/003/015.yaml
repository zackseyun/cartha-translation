lexical_decisions:
- source_word: ἐξ οὗ
  choice: ከእርሱ
  rationale: ἐξ ከዘርፍ ተውላጠ ስም ጋር የምንጭን ወይም የመነሻን ግንኙነት ያሳያል። በአማርኛ «ከእርሱ» ይህን በተፈጥሯዊ ሁኔታ ያቀርባል፤ የስም መገኛነቱ ከግሱ ጋር ተያይዞ ግልጽ ይሆናል።
- source_word: πᾶσα
  choice: እያንዳንዱ
  rationale: ነጠላ ከሆነው πατριά ጋር πᾶσα በአከፋፋይ ትርጉም «እያንዳንዱ» ሊሆን ይችላል። «መላው» የሚለው አንድ የጋራ ቤተሰብን ሊያመለክት ስለሚችል እንደ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: πατριὰ
  choice: ቤተሰብ
  rationale: πατριά የቤተሰብ፣ የዘር ሐረግ ወይም የጎሳ ማኅበርን ያመለክታል። «ቤተሰብ» ለዘመናዊ አንባቢ ግልጽና ሰፊ ቃል ሲሆን፣ ከቀደመው πατήρ («አብ») ጋር ያለውን የቃል ጨዋታ በፍጹም ባያስተላልፍም መደበኛውን ትርጉም ይጠብቃል።
- source_word: ἐν οὐρανοῖς
  choice: በሰማያት
  rationale: የግሪክ ስሙ ብዙ ቁጥር ስለሆነ «በሰማያት» የቅርጹን ገጽታ ይጠብቃል፤ በአማርኛም የሰማያዊውን ዓለም ለመግለጽ ተፈጥሯዊ ነው።
- source_word: ἐπὶ γῆς
  choice: በምድር
  rationale: ይህ ቦታን የሚያመለክት ሐረግ ሲሆን «በምድር» በአማርኛ ተፈጥሯዊና ትክክለኛ ነው።
- source_word: ὀνομάζεται
  choice: ስሙን ያገኛል
  rationale: የአሁን ጊዜ ተደራጊ ግስ በቀጥታ «ይሰየማል» ማለት ቢችልም፣ ከἐξ οὗ ጋር ሲጣመር ስሙ ከእርሱ እንደሚመጣ ያመለክታል። «ስሙን ከእርሱ ያገኛል» ተደራጊውን የመሰየም ሐሳብና የምንጭነት ግንኙነቱን በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: πᾶσα πατριὰ ከቀደመው «አብ» ጋር ያለው ግንኙነት
  choice: እያንዳንዱ ቤተሰብ
  alternative: መላው ቤተሰብ፤ ወይም አባትነት ሁሉ
  rationale: ጥቅሱ πατήρ («አብ») እና πατριά («ቤተሰብ/የዘር ሐረግ») መካከል ያለውን የቃል ግንኙነት ሊጠቀም ይችላል። ዋናው ጽሑፍ መደበኛውን ማኅበራዊ ትርጉም «ቤተሰብ» እና የπᾶσαን አከፋፋይ ኃይል «እያንዳንዱ» ይይዛል፤ ጥቅሱ አንድን ሁሉን አቀፍ ቤተሰብ ወይም ረቂቅ የአባትነት መርሕ እንደሚያመለክት አስቀድሞ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ቤተሰብ» ከ«ወገን» ወይም «ጎሳ» ይልቅ ሰፊና ተፈጥሯዊ ነው፤ የግሪኩ አሻሚነት በማስታወሻው ተጠብቋል።
