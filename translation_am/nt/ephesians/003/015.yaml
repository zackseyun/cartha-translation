  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በሰማያትና በምድር ያለው መላው ቤተሰብ ከእርሱ ይሰየማል»፤ ወይም በትርጓሜ ይበልጥ ግልጽ ተደርጎ፣ «በሰማያትና በምድር ያለ አባትነት ሁሉ ስሙን ከእርሱ ያገኛል።»
