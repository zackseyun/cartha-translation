- source_word: πλήρωμα
  choice: ሙላት
  rationale: የግሪኩን ጥቅጥቅ ያለና ከአንድ በላይ አተረጓጎም የሚቀበል ትርጉም ሳይፈታ ይጠብቃል።
- source_word: τοῦ ... πληρουμένου
  choice: የሚሞላው የእርሱ
  rationale: አገባቡ ለክርስቶስ ንቁ ተግባር የሚያመለክተውን በአውዱ ይበልጥ የሚመች ንባብ ያቀርባል፤ ሰዋሰዋዊው ተገብሮአዊ አማራጭ ግን በማስታወሻ ተጠብቋል።
- source_word: τὰ πάντα
  choice: ሁሉን
  rationale: ሁሉን አቀፍ የሆነውን የግሪክ ገለጻ በተፈጥሯዊና ሰፊ አማርኛ ያቀርባል።
- source_word: ἐν πᾶσιν
  choice: በሁሉ
  rationale: የግሪኩን አጭርና አሻሚ አገላለጽ ከ‘በሁሉም መንገድ’ ወይም ‘በሁሉም ሰው’ ብሎ አስቀድሞ ሳይወስን በቅርብ ይጠብቃል።
theological_decisions:
- issue: πλήρωμα ከቤተ ክርስቲያንና ከክርስቶስ ጋር ያለው ግንኙነት
  choice: ቤተ ክርስቲያን ‘የእርሱ ሙላት’ ተብላ ተገልጣለች፤ ጽሑፉ ይህን ሙላት የተሞላች መሆኗን ወይም በአንድ ሁኔታ ማሟያ መሆኗን በግልጽ አይወስንም።
  alternative: ‘በክርስቶስ የምትሞላው’ ወይም ‘ክርስቶስን የምታሟላው’ ብሎ በማብራራት መተርጎም።
  rationale: ‘ሙላት’ የሚለው ቀጥተኛ ቃል ከጽሑፉ በላይ ሳይወስን እውነተኛውን ሥነ መለኮታዊ ውጥረት ይጠብቃል።
- issue: የπληρουμένου ድምፅና ፍቺ
  choice: ‘የሚሞላው’ በሚል ንቁ ፍቺ ተተርጉሟል።
  alternative: ‘የሚሞላው’ ሳይሆን ‘የሚሞላው/የሚሞላበት’ በተገብሮአዊ ፍቺ መረዳት።
  rationale: ቅርጹ መካከለኛ/ተገብሮአዊ ቢሆንም፣ አውዱ ንቁ ፍቺውን ይበልጥ ይደግፋል፤ ሆኖም የተገብሮአዊው ንባብ ሰዋሰዋዊ ዕድል በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ የሚገባ አማርኛ ተጠቅሟል። ‘ሁሉን በሁሉ’ የሚለው በግሪኩ ያለውን ሆን ተብሎ ያልተፈታ አሻሚነት ይጠብቃል።
