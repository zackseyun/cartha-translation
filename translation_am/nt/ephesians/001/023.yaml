lexical_decisions:
- source_word: ἥτις
  choice: እርሷም
  rationale: በቁጥር 22 የተጠቀሰችውን ቤተ ክርስቲያን ይመለከታል፤ የአንስታይ ጾታውንና ቀጣይነቱን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: σῶμα
