lexical_decisions:
- source_word: ὑπερβάλλον
  choice: ከሁሉ የሚበልጥ
  rationale: የማለፍንና ከሌላው በላይ የመሆንን ሐሳብ ይጠብቃል፤ ግሪክኛው ከሚጠይቀው በላይ ‘ሊለካ የማይችል’ የሚል ፍቺ አይጨምርም።
- source_word: μέγεθος
  choice: ታላቅነት
  rationale: ከὑπερβάλλον ጋር ያለውን ረቂቅ ስም በተፈጥሯዊና ግልጽ አማርኛ ያቀርባል።
- source_word: δύναμις
  choice: ኃይል
  rationale: በጳውሎስ አጠቃቀም የተለመደ ትርጉም ሲሆን ከቀጣዮቹ ተቀራራቢ የኃይል ቃላት ለመለየትም ይረዳል።
- source_word: εἰς ἡμᾶς
  choice: ወደ እኛ የተቃናው
  rationale: εἰς የሚያመለክተውን አቅጣጫና ተፈጻሚነት በተፈጥሯዊ አማርኛ ይጠብቃል፤ ‘በእኛ ውስጥ’ በማለት የውስጣዊ አሠራርን ብቻ አይወስንም።
- source_word: τοὺς πιστεύοντας
  choice: ለምናምን
  rationale: አሁናዊውን አማኝነት በግስ መልክ በቀላልና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: κατά
  choice: መሠረት
  rationale: የተመጣጣኝነትን ወይም ከአንድ መሥፈርት ጋር የመስማማትን ግንኙነት ‘በ...መሠረት’ በሚል ግልጽ አገላለጽ ይገልጣል።
- source_word: ἐνέργεια
  choice: አሠራር
  rationale: ንቁና ውጤታማ ድርጊትን ያመለክታል፤ ‘ኤነርጂ’ የሚለው ዘመናዊ ትርጉም እንዳያሳስት ይከላከላል።
- source_word: κράτος
  choice: ኀያልነት
  rationale: የተገለጠ ኃይልን ወይም ጉልበትን ያሳያል፤ ከἰσχύς ትርጉም ጋር ሳይዋሐድ የቃላቱን ክምችት ይጠብቃል።
- source_word: ἰσχύς
  choice: ብርታት
  rationale: ያለውን ውስጣዊ ጥንካሬ በተለመደ አማርኛ ይገልጣል፤ ከκράτος ‘ኀያልነት’ ተለይቶ ይቆያል።
- source_word: καὶ τί
  choice: እንዲሁም ... ምን ያህል ... እንደሆነ
  rationale: የቀደመውን የጸሎት ዓረፍተ ነገር በማስቀጠል በአማርኛ የተሟላና ተነባቢ አወቃቀር ይሰጣል።
theological_decisions:
- issue: δύναμις / ἐνέργεια / κράτος / ἰσχύς የሚሉትን የኃይል ቃላት ክምችት መተርጎም
  choice: “ኃይል ... አሠራር ... ኀያልነት ... ብርታት” በሚሉ የተለያዩ ግን ተቀራራቢ ቃላት ማቆየት
  alternative: ቃላቱን በጥቂት ተመሳሳይ ቃላት ማዋሐድ ወይም “የኃይሉ ሙሉ ጉልበት” ብሎ በነጻ መተርጎም
  rationale: ጳውሎስ የእግዚአብሔርን ኃይል ታላቅነትና ውጤታማነት ለማጉላት ተቀራራቢ ቃላትን ደራርቦ ይጠቀማል፤ ልዩነታቸውን ማቆየት ይህን የንግግር ኃይል ይጠብቃል።
- issue: በεἰς ἡμᾶς ውስጥ የመለኮታዊው ኃይል አቅጣጫ
  choice: “ወደ እኛ የተቃናው”
  alternative: “በእኛ ውስጥ” ወይም “ለእኛ”
  rationale: ግሪክኛው εἰς እንጂ ἐν አይልም። የተመረጠው አገላለጽ አቅጣጫውን ይጠብቃል፤ ኃይሉ በአማኞች ውስጥ ብቻ እንደሚሠራ ወይም ከውጭ ለጥቅማቸው ብቻ እንደሆነ አስቀድሞ አይወስንም።
