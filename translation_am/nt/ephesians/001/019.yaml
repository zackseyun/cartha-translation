  footnotes:
  - marker: a
    text: ወይም፣ “በእኛ በምናምን ሰዎች ውስጥ።” ግሪክኛው በቃል ትርጉሙ “ወደ እኛ” ይላል፤ አንዳንድ ትርጉሞች ግን ሐረጉን የእግዚአብሔር ኃይል በአማኞች ውስጥ እየሠራ እንዳለ በትርጓሜ ያቀርቡታል።
