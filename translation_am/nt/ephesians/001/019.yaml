  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪክኛውን የኃይል ቃላት ክምችት ለመጠበቅ “ኃይል፣ አሠራር፣ ኀያልነት፣ ብርታት” ተለይተው ቀርበዋል፤ የአማርኛው አወቃቀር ግን ተፈጥሯዊ እንዲሆን ተስተካክሏል።
