  rationale: በጳውሎስ ደብዳቤዎች የሚታወቀውን በመተማመን የሚጠበቅ ነገር የሚያመለክት መደበኛ የመጽሐፍ ቅዱስ ቃል ነው።
- source_word: κλήσεως αὐτοῦ
  choice: የእርሱ ጥሪ
