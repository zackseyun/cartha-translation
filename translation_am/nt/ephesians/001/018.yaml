theological_decisions:
- issue: ‘የእርሱ ርስት በቅዱሳን መካከል/ውስጥ’ የሚለው ሕዝቡ የእግዚአብሔር ርስት መሆናቸውን ወይስ እርሱ ለአማኞች የሚሰጠውን ርስት ማመልከቱ
  choice: በቅዱሳን መካከል ያለው የእርሱ ርስት
  alternative: በቅዱሳን ውስጥ ያለው የእርሱ ርስት፤ ወይም እርሱ ለቅዱሳን የሚሰጠው ርስት
  rationale: የግሪኩ የባለቤትነትና የመስተዋድድ አገላለጾች ከአንድ በላይ ልዩነት ይፈቅዳሉ። ዋናው ጽሑፍ የትኛውንም ሥነ መለኮታዊ ንባብ አስገድዶ ሳይመርጥ ውጥረቱን ይጠብቃል።
