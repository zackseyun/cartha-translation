- source_word: δόξης
  choice: ክብር
  rationale: መደበኛውንና ሥነ መለኮታዊ ድምፁን የሚጠብቀውን አቻ ቃል ይጠቀማል።
- source_word: κληρονομίας αὐτοῦ
