  choice: የልባችሁ ዓይኖች
  rationale: የጳውሎስን ዘይቤ ወደ ‘አእምሮ’ ወይም ‘ማስተዋል’ ሳያስተካክል በቀጥታ ይጠብቃል።
- source_word: εἰς τὸ εἰδέναι ὑμᾶς
