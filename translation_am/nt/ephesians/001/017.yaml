  yaml_path: translation/nt/ephesians/001/017.yaml
  text: that the God of our Lord Jesus the Messiah[a], the Father of glory, may give you a spirit of wisdom and revelation in the knowledge of him[c][b],
translation:
  language: am
  text: የጌታችን የኢየሱስ መሲሕ[a] አምላክ፣ የክብር አባት[b]፣ እርሱን በማወቅ የጥበብና የመገለጥ መንፈስ[c] እንዲሰጣችሁ፣
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በባህላዊ አተረጓጎም፦ “ኢየሱስ ክርስቶስ።” የግሪኩ Χριστός “መሲሕ” ማለት ነው።
    reason: lexical_alternative
  - marker: b
    text: ወይም፦ “ክቡሩ አባት።” ሐረጉ ቃል በቃል “የክብር አባት” ይላል።
    reason: lexical_alternative
  - marker: c
    text: “መንፈስ” የሚለው የግሪክ ቃል πνεῦμα እግዚአብሔር የሚሰጠውን መንፈስ ወይም ዝንባሌ ሊያመለክት ይችላል፤ እንዲሁም “የጥበብና የመገለጥ መንፈስ ቅዱስ” ተብሎ ሊገባ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: እንዲሰጣችሁ
  rationale: የἵναን የዓላማና የጸሎት ይዘት በአማርኛ የጥገኛ ግስ ቅርጽ ‘እንዲ-’ ያሳያል፤ ከቀደመው ቁጥር ጋር የሚቀጥለውን ሐረግም ይጠብቃል።
- source_word: ὁ θεὸς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: የጌታችን የኢየሱስ መሲሕ አምላክ
  rationale: የግሪኩን የባለቤትነት ግንኙነት በተፈጥሯዊ የአማርኛ ‘የ-’ አወቃቀር ያቀርባል፤ Χριστός የማዕረግ ትርጉሙን እንዲያሳይ ‘መሲሕ’ ተብሏል።
- source_word: ὁ πατὴρ τῆς δόξης
  choice: የክብር አባት
  rationale: ቃል በቃል ያለውን የዘርፍ አገናኝ ይጠብቃል፤ ‘ክቡር/የከበረ አባት’ ብሎ ትርጉሙን አይወስንም።
- source_word: δώῃ ὑμῖν
  choice: እንዲሰጣችሁ
  rationale: የጸሎት ምኞትን እና የብዙ ሰዎች ተቀባይነትን በግልጽ ዘመናዊ አማርኛ ያሳያል።
- source_word: πνεῦμα σοφίας καὶ ἀποκαλύψεως
  choice: የጥበብና የመገለጥ መንፈስ
  rationale: መንፈሱ በጥበብና በመገለጥ የሚገለጽበትን የግሪክ አወቃቀር ይጠብቃል። ‘መገለጥ’ መለኮታዊ መግለጫን በተለመደና ግልጽ ቃል ያቀርባል።
- source_word: ἐν ἐπιγνώσει αὐτοῦ
  choice: እርሱን በማወቅ
  rationale: ቃል በቃል ከሚሆነው ‘በእርሱ እውቀት’ ይልቅ ተፈጥሯዊ ነው፤ ἐπίγνωσις ግን ጥልቅ ወይም ሙሉ እውቀት ነው ብሎ ከሚገባው በላይ አይወስንም።
theological_decisions:
- issue: πνεῦμα መንፈስ ቅዱስን ወይስ ከእግዚአብሔር የሚሰጥ መንፈሳዊ አቋምን ያመለክታል?
  choice: የጥበብና የመገለጥ መንፈስ
  alternative: የጥበብና የመገለጥ መንፈስ ቅዱስ / የጥበብና የመገለጥ ዝንባሌ
  rationale: በግሪኩ πνεῦμα ያለ የተወሰነ አመልካች ቀርቧል፣ ሁለቱንም አረዳዶች ሊፈቅድ ይችላል። ዋናው ጽሑፍ ‘መንፈስ’ ብሎ በመተው አሻሚነቱን ይጠብቃል፤ አማራጩም በማስታወሻ ተገልጧል።
- issue: Χριστόςን እንዴት መተርጎም ይገባል?
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: በዚህ ስፍራ Χριστός የተቀባውን ንጉሥ የሚያመለክት ማዕረግ ሆኖ መረዳት ይቻላል፤ ‘መሲሕ’ የማዕረጉን ፍቺ ያሳያል፣ ባህላዊው ‘ክርስቶስ’ ግን በማስታወሻ ተጠብቋል።
- issue: ὁ πατὴρ τῆς δόξης የዘርፍ ግንኙነት
  choice: የክብር አባት
  alternative: ክቡሩ አባት / የከበረው አባት
  rationale: የግሪኩ ሐረግ በቀጥታ ‘የክብር አባት’ ይላል። እንደ ቅጽል መተርጎም የሚቻል ቢሆንም፣ ዋናው ጽሑፍ ሥነ መለኮታዊ ክብደቱንና ክፍትነቱን ጠብቋል።
