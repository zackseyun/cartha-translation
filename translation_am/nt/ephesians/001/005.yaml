    issue: “በጎ ደስታ” is less natural here than “መልካም ውዴታ.”
    rationale: εὐδοκία in this context concerns favorable pleasure, gracious purpose, or good will. “መልካም ውዴታ” is a clearer formal-register equivalent and avoids suggesting merely emotional happiness.
