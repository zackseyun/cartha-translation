  source_fidelity: 'The draft conveys the principal meanings of predestination, adoption, mediation through Jesus Messiah, and divine good pleasure. However, its rendering of κατὰ τὴν εὐδοκίαν τοῦ θελήματος αὐτοῦ is syntactically unclear in Amharic: “በፈቃዱ በጎ ደስታ” can imply that the will itself is pleased rather than expressing “the good pleasure of his will.”'
