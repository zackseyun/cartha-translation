  text: γνωρίσας ἡμῖν τὸ μυστήριον τοῦ θελήματος αὐτοῦ, κατὰ τὴν εὐδοκίαν αὐτοῦ ἣν προέθετο ἐν αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/009.yaml
  text: having made known to us the mystery of his will[a], according to his good pleasure, which he purposed in himself
translation:
  language: am
  text: የፈቃዱን ምስጢር ለእኛ አሳውቆናል፤ ይህም በእርሱ ያቀደውን በጎ ፈቃዱን መሠረት ነው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በእርሱ” የሚለው “በክርስቶስ” ማለት ሊሆን ይችላል፤ አንዳንዶች ግን እግዚአብሔር ያቀደውን “በራሱ” ማለት እንደሆነ ይረዱታል።
    reason: alternative_reading
lexical_decisions:
- source_word: γνωρίσας
  choice: አሳወቀን
  rationale: የግሪኩ ቃል የማሳወቅን ድርጊት ያመለክታል። በአማርኛ የአንቀጹን ተከታታይ አወቃቀር በተፈጥሯዊ መንገድ ለማቅረብ እንደ ዋና ግስ ተተርጉሟል።
- source_word: ἡμῖν
  choice: ለእኛ
  rationale: የማሳወቁን ተቀባይ የሚያመለክተውን የዳቲቭ ተውላጠ ስም በቀጥታ ያስተላልፋል።
- source_word: μυστήριον
  choice: ምስጢር
  rationale: ቀድሞ ተሰውሮ የነበረና አሁን የተገለጠ የእግዚአብሔር ዕቅድ የሚለውን የጳውሎስ አጠቃቀም ይጠብቃል።
- source_word: θέλημα
  choice: ፈቃድ
  rationale: የመፈለግንና የመወሰንን ሐሳብ በቀጥታ የሚገልጽ ሲሆን ከπροέθετο ጋር ያለውን የቃላት ልዩነት ይጠብቃል።
- source_word: κατὰ
  choice: መሠረት
  rationale: ከተጨማሪው 'በ... መሠረት' ጋር የመመዘኛንና የመስማማትን ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: εὐδοκίαν
  choice: በጎ ፈቃድ
  rationale: የደስታ፣ የመልካም ዓላማና የፈቃድ ገጽታዎቹን አብሮ የሚያስተላልፍ የተለመደ አገላለጽ ነው።
- source_word: προέθετο
  choice: ቀድሞ ባሰበው
  rationale: የመወሰንን ወይም ዓላማ የማድረግን ሐሳብ ይገልጻል፤ የግሱን ሚድል ቅርጽ በአማርኛ በተፈጥሯዊ ሁኔታ ያቀርባል። 'ሊፈጽመው' የሚለው የዓላማውን አቅጣጫ ያብራራል።
- source_word: ἐν αὐτῷ
  choice: በእርሱ
  rationale: የግሪኩን ተውላጠ ስም በቀጥታ በመጠበቅ ማጣቀሻውን በዋናው ጽሑፍ ውስጥ አይወስንም፤ የትርጓሜ አማራጮቹ በማስታወሻ ቀርበዋል።
theological_decisions:
- issue: የἐν αὐτῷ ማጣቀሻ
  choice: በዋናው ጽሑፍ 'በእርሱ' ተብሎ የግሪኩ ተውላጠ ስም ተጠብቋል።
  alternative: ‘በክርስቶስ’ ወይም እግዚአብሔርን በራሱ የሚያመለክት ‘በራሱ’።
  rationale: በአውዱ ምክንያት ክርስቶስ ሊሆን ይችላል፤ ሌሎች ግን ተመላሽ አገላለጽ አድርገው እግዚአብሔርን ያመለክታል ይላሉ። ግሪኩ ራሱ ስሙን ስለማይጠቅስ ጥርጣሬው በዋናው ጽሑፍ ተጠብቆ በማስታወሻ ተብራርቷል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ረጅሙ የግሪክ ዓረፍተ ነገር በአማርኛ ተፈጥሯዊ ፍሰት እንዲኖረው ተዋቅሯል፤ የἐν αὐτῷ እውነተኛ አሻሚነት ግን አልተወገደም።
