lexical_decisions:
- source_word: καθὼς
  choice: እንዲሁም
  rationale: ከቀደመው የበረከት ንግግር ጋር ያለውን የማነጻጸርና የማብራሪያ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐξελέξατο
  choice: መረጠን
  rationale: የመምረጥን ግልጽ ትርጉም ይጠብቃል፤ በኋላ የተቀረጹ የሃይማኖት ሥርዓቶችን በቃሉ ላይ አይጭንም።
- source_word: ἐν αὐτῷ
  choice: በእርሱ
  rationale: የግሪኩን አጭር የኅብረት/የመሣሪያ አገላለጽ ሳያሰፋ ይጠብቃል፤ ተውላጠ ስሙም እንዳለ ተቀምጧል።
- source_word: πρὸ καταβολῆς κόσμου
  choice: ዓለም ከመመሥረቱ በፊት
  rationale: የሐረጉን ጊዜያዊ ኃይል በግልጽና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: εἶναι ἡμᾶς
  choice: እንድንሆን
  rationale: የዓላማ ወይም የውጤት ንዑስ ነገርን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἁγίους
  choice: ቅዱሳን
  rationale: የሥነ ምግባርና ለእግዚአብሔር የመለየት ሁለቱንም ትርጉሞች ይጠብቃል።
- source_word: ἀμώμους
  choice: ነቀፋ የሌለብን
  rationale: በዘመናዊ አማርኛ ተፈጥሯዊ ሆኖ የሞራልና የመሥዋዕት ንጽሕና ጥላዎችን ያስተላልፋል፤ ‘እንከን የሌለብን’ የሚለው አማራጭ በማስታወሻ ቀርቧል።
- source_word: κατενώπιον αὐτοῦ
  choice: በፊቱ
  rationale: በእግዚአብሔር ፊት መገኘትንና ተጠያቂነትን በአጭር አገላለጽ ይጠብቃል።
- source_word: ἐν ἀγάπῃ
  choice: በፍቅር
  rationale: የግሪኩን ቀጥተኛ አቻ ይጠቀማል፤ ሐረጉ ከቁጥር 4 መጨረሻ ወይም ከቁጥር 5 መጀመሪያ ጋር ሊያያዝ ስለሚችል ያለው አሻሚነት በአቀማመጡና በማስታወሻው ተጠብቋል።
theological_decisions:
