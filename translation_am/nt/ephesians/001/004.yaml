- issue: ἐν ἀγάπῃ ከየትኛው ክፍል ጋር እንደሚያያዝ
  choice: ‘በፍቅር’ን በቁጥር 4 መጨረሻ አቆይቶ አሻሚነቱን በማስታወሻ ማሳየት
  alternative: ከቁጥር 5 ጋር፦ ‘በፍቅር አስቀድሞ ወሰነን…’
  rationale: የግሪኩ አገባብ ሁለቱንም ንባቦች ይፈቅዳል፤ ትርጉሙ የማይገባውን የአንዱን ወገን ውሳኔ አያስገድድም።
