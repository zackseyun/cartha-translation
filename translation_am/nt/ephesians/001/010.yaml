  text: εἰς οἰκονομίαν τοῦ πληρώματος τῶν καιρῶν, ἀνακεφαλαιώσασθαι τὰ πάντα ἐν τῷ Χριστῷ, τὰ ἐπὶ τοῖς οὐρανοῖς καὶ τὰ ἐπὶ τῆς γῆς· ἐν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/010.yaml
  text: for the administration of the fullness of the times[a], to sum up all things in the Messiah—the things in the heavens and the things on the earth—in him,
translation:
  language: am
  text: ዘመናት ሲሞሉ ለሚሆነው አስተዳደር፣ በሰማያት ያሉትንና በምድር ላይ ያሉትን ሁሉን ነገር በመሲሑ ለማጠቃለል[a]፣ በእርሱ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ሁሉን ነገር በመሲሑ በአንድ ራስ ሥር ለማሰባሰብ»። የግሪኩ ግስ ማጠቃለልን ወይም በአንድ ራስ ሥር ማሰባሰብን ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκονομίαν
  choice: አስተዳደር
  rationale: ቃሉ አንድን ዕቅድ በሥርዓት የማከናወንን ወይም የማስተዳደርን ሐሳብ ይይዛል፤ «አስተዳደር» ይህን ሳያጠብ ያስተላልፋል።
- source_word: πληρώματος τῶν καιρῶν
  choice: ዘመናት ወደ ሙላታቸው ሲደርሱ
  rationale: የተወሰኑት ዘመናት የተሟሉበትን ጊዜ በተፈጥሯዊ አማርኛ ይገልጣል፤ «ሙላት» የሚለውንም የግሪኩን ክብደት ይጠብቃል።
- source_word: ἀνακεφαλαιώσασθαι
  choice: ለማጠቃለል
  rationale: የግሪኩን መሠረታዊ የማጠቃለል ሐሳብ ይጠብቃል፤ በአንድ ራስ ሥር የማሰባሰብ ሊሆን የሚችለው ተጨማሪ ጥላ በማስታወሻ ቀርቧል።
- source_word: τὰ πάντα
  choice: ሁሉ
  rationale: በሰማያትና በምድር ያሉትን ነገሮች በሙሉ የሚያካትተውን ሁለንተናዊ ወሰን ያስተላልፋል።
- source_word: ἐν τῷ Χριστῷ
  choice: በመሲሑ
  rationale: Χριστός በዚህ ስፍራ እንደ ማዕረግ ስለሚሠራ «መሲሕ» ተብሎ ተተርጉሟል፤ የመስተዋድዱ ቅርጽም «በመሲሑ» ተብሎ ተጠብቋል።
- source_word: τὰ ἐπὶ τοῖς οὐρανοῖς
  choice: በሰማያት ያሉትን
  rationale: የግሪኩን ብዙ ቁጥር οὐρανοῖς እና የቦታ ትርጉሙን ይጠብቃል።
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: በምድር ላይ ያሉትን
  rationale: ከሰማያት ጋር ያለውን ተቃርኖና የቦታ ትርጉሙን በግልጽ ያስተላልፋል።
- source_word: ἐν αὐτῷ
  choice: በእርሱ
  rationale: ተውላጠ ስሙ ወደ መሲሑ መመለሱንና በግሪኩ ያለውን ድግግሞሽ ያለ ተጨማሪ ትርጓሜ ይጠብቃል።
theological_decisions:
