  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀ὅ ἐστιν ἀρραβὼν τῆς κληρονομίας ἡμῶν, εἰς ἀπολύτρωσιν τῆς περιποιήσεως, εἰς ἔπαινον τῆς δόξης αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/014.yaml
  text: who is the down payment of our inheritance, toward the redemption of the possession, to the praise of his glory.
translation:
  language: am
  text: እርሱም የርስታችን መያዣ ነው፤ ወደ የተገኘው ንብረት መዋጀት፣ ለክብሩ ምስጋና።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀρραβών
  choice: መያዣ
  rationale: በግብይት የሚሰጥን ቅድመ ዋስትና፣ የቀረውም እንደሚፈጸም ማረጋገጫ የሆነን ነገር በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: κληρονομία
  choice: ርስት
  rationale: የወራሽነትን ስጦታና ተስፋ የሚያመለክተውን የግሪክ ቃል ቀጥተኛ እና የተለመደ አቻ ቃል ነው።
- source_word: ἀπολύτρωσις
  choice: መዋጀት
  rationale: በዋጋ ነፃ ማውጣትን የሚያመለክተውን ትርጉም ጠብቆ በመጽሐፍ ቅዱሳዊ አማርኛ የታወቀ ቃል ነው።
- source_word: περιποίησις
  choice: የገዛ ርስቱ
  rationale: ቃሉ ማግኘትን ወይም የተያዘ ንብረትን ሊያመለክት ስለሚችል፣ በአውዱ ከእግዚአብሔር ጋር ያለውን የባለቤትነት ግንኙነት ያሳያል።
- source_word: εἰς
  choice: ወደሚ… ጊዜ ያመለክታል
  rationale: እዚህ ያለውን የግብ ወይም ወደፊት አቅጣጫ በተፈጥሯዊ አማርኛ ይገልጻል።
theological_decisions:
- issue: ὅ የሚያመለክተው መንፈስ ቅዱስ እንደ ማንነት ወይስ እንደ ነገር
  choice: እርሱም
  alternative: እርሱም/ይህም በጾታ ልዩነት ሳይገለጽ
  rationale: ὅ በሰዋስው ከገለልተኛው πνεῦμα ጋር ይስማማል፤ የግሪክ ሰዋስው ግን መንፈስ ቅዱስን ግዑዝ አያደርገውም። የቀደመውን ቁጥር ማጣቀስ ለአማርኛ አንባቢ ግልጽ እንዲሆን “እርሱም” ተመርጧል።
- issue: τῆς περιποιήσεως ባለቤት ማን እንደሆነ
  choice: የገዛ ርስቱ
  alternative: የተገኘው ንብረት / የእኛ ርስት
  rationale: የግሪኩ ሐረግ በአጭሩ “የግዢው/የተያዘው ንብረት መዋጀት” ሊሆን ይችላል። አውዱ አማኞችን እንደ እግዚአብሔር የገዛ ርስት የሚያሳይ ንባብን ይደግፋል፣ ሆኖም አማራጩ ንባብ ሙሉ በሙሉ አልተዘጋም።
- issue: ሁለተኛው εἰς ዓላማን ወይም ውጤትን መግለጹ
  choice: ለክብሩ ምስጋና እንዲሆን
  alternative: ወደ ክብሩ ምስጋና
  rationale: የግሪኩን የዓላማ/ውጤት ግንኙነት በተፈጥሯዊ አማርኛ ያስተላልፋል፣ ከሚፈቀደው በላይ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ረጅሙ የግሪክ ሐረግ ትስስሩን ሳያጣ በሰሚኮሎን ተከፍሏል።
