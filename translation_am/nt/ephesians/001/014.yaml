revisions:
- from: እርሱም የርስታችን መያዣ ነው፤ ይህም የገዛ ርስቱ ወደሚዋጅበት ጊዜ ያመለክታል፤ ይህ ሁሉ ለክብሩ ምስጋና እንዲሆን ነው።
  to: እርሱም የርስታችን መያዣ ነው፤ ወደ የተገኘው ንብረት መዋጀት፣ ለክብሩ ምስጋና።
  rationale: The revision removes unsupported temporal and possessive interpretation, restores the two εἰς phrases in their concise directional form, and retains the source’s ambiguity concerning περιποίησις. The elliptical final phrasing deliberately follows the compact Greek structure while remaining intelligible in a biblical Amharic register.
  reviewer_model: gpt-5.6-terra
