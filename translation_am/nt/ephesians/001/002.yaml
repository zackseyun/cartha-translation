    rationale: 'Although Greek Χριστοῦ is anarthrous, it functions in a fixed title-name sequence. Modern standard Amharic naturally marks the rendered title as definite here: “Jesus the Messiah.” The present bare form is less idiomatic.'
  - severity: low
    issue: The order ከአባታችን ከእግዚአብሔር is understandable but less natural than placing እግዚአብሔር first.
    rationale: ከእግዚአብሔር ከአባታችን directly presents “God, our Father” without changing the appositional relationship or adding a conjunction within it.
