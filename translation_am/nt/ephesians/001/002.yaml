  yaml_path: translation/nt/ephesians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b].
translation:
  language: am
  text: ጸጋና ሰላም ከእግዚአብሔር ከአባታችንና ከጌታ ኢየሱስ መሲሑ[a][b] ይሁንላችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “ኢየሱስ ክርስቶስ።” የግሪኩ Χριστός “መሲሕ” የሚለውን ማዕረግ ሊያመለክት ወይም በአንዳንድ አውዶች “ክርስቶስ” በሚለው ስም-መሰል ቅጽ ሊሠራ ይችላል።
    reason: alternative_reading
  - marker: b
    text: ቀደም ሲል፦ “ጌታ ኢየሱስ መሲሕ።”
    reason: previous_rendering
lexical_decisions:
- source_word: χάρις
  choice: ጸጋ
  rationale: በጳውሎስ የደብዳቤ ሰላምታዎች ውስጥ ያለውን የሰላምታና የመለኮታዊ በረከት ትርጉም ያቆያል።
- source_word: ὑμῖν
  choice: ይሁንላችሁ
  rationale: ግሪኩ ግስ ባይጠቀምም፣ በአማርኛ የበረከት ሰላምታውን በተፈጥሯዊ ሁኔታ ለመግለጽ ይህ አገላለጽ ተጨምሯል።
- source_word: εἰρήνη
  choice: ሰላም
  rationale: የተለመደውን የሰላም ትርጉምና ከዕብራዊው ሻሎም ጋር ሊኖረው የሚችለውን ድምፀት ይጠብቃል።
- source_word: ἀπὸ
  choice: ከ…ና ከ…
  rationale: የጸጋና የሰላም ምንጭ እግዚአብሔር አብና ጌታ ኢየሱስ መሆናቸውን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: ከአባታችን ከእግዚአብሔር
  rationale: πατρὸς ἡμῶνን θεοῦን የሚገልጽ ቅጽል-ስማዊ አገላለጽ አድርጎ ያቀርባል፤ በግሪኩ የሌለውን ‘እና’ በሁለቱ ስሞች መካከል አያስገባም።
- source_word: κυρίου
  choice: ጌታ
  rationale: የክርስቶስን ማዕረግና ሥልጣን በታወቀና ክቡር ቃል ያስተላልፋል።
- source_word: Ἰησοῦ Χριστοῦ
  choice: ኢየሱስ መሲሕ
  rationale: Ἰησοῦን እንደ ስም፣ Χριστοῦንም ‘የተቀባው’ የሚለውን መሲሓዊ ማዕረግ እንደሚገልጽ ቃል ያቀርባል፤ የተለመደው ‘ክርስቶስ’ ቅጽ በማስታወሻ ቀርቧል።
theological_decisions:
- issue: በἸησοῦ Χριστοῦ ውስጥ Χριστοῦን እንዴት መተርጎም እንደሚገባ
  choice: ኢየሱስ መሲሕ
  alternative: ኢየሱስ ክርስቶስ
  rationale: Χριστός ማዕረግ (‘የተቀባው/መሲሕ’) ወይም እንደ ስም የተለመደ ቅጽ (‘ክርስቶስ’) ሊሠራ ይችላል። ዋናው ጽሑፍ የማዕረጉን ትርጉም ግልጽ ሲያደርግ አማራጩን በማስታወሻ ይጠብቃል።
- issue: θεοῦ πατρὸς ἡμῶν ያለው ሰዋሰዋዊ ግንኙነት
  choice: አባታችን የሆነው እግዚአብሔር
  alternative: እግዚአብሔራችንና አባታችን
  rationale: የግሪኩ ተከታታይ የባለቤት ቅጾች በተፈጥሯዊ ሁኔታ አባትን ከእግዚአብሔር ጋር በአንድነት የሚገልጹ ናቸው፤ በግሪኩ የሌለውን ማያያዣ ማስገባት አያስፈልግም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለአብዛኛው አንባቢ ግልጽ የሆነ የበረከት ሰላምታ ቅርጽ ተጠቅሟል። በግሪኩ በግልጽ ያልተጻፈው ግስ በአማርኛ የሚፈለገውን ተፈጥሯዊ አገላለጽ ለመፍጠር ‘ይሁንላችሁ’ ተብሎ ተሟልቷል።
