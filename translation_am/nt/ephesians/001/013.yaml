- source_word: τῷ πνεύματι τῆς ἐπαγγελίας τῷ ἁγίῳ
  choice: በተስፋው መንፈስ ቅዱስ
  rationale: ዳቲቩን ‘በ’ በማለት ይወክላል፤ የግሪኩን የተጨመቀ የተስፋ ጄኒቲቭ ይጠብቃል፣ በአማርኛም የመንፈስ ቅዱስን መጠሪያ በተፈጥሯዊ ቅደም ተከተል ያቀርባል።
theological_decisions:
- issue: በመስማት፣ በማመንና በመታተም መካከል ያለው ዝምድና
  choice: ‘ከሰማችሁ በኋላ … ካመናችሁ በኋላ፣ … ታተማችሁ’ ተብሎ የድርጊቶቹ ቅደም ተከተል ተጠብቋል።
  alternative: አሳታፊዎቹን ‘በሰማችሁ ጊዜ … ባመናችሁ ጊዜ’ ብሎ ከዋናው ግስ ጋር በተቀራራቢ ጊዜ ማቅረብ ይቻላል።
  rationale: ከዋናው ግስ በፊት ያሉት የአኦሪስት አሳታፊዎች በተፈጥሯዊ አነባበብ ቀዳሚ ድርጊትን ያመለክታሉ፤ ትርጉሙ ግን ስለ መዳን ወይም ስለ መንፈስ መቀበል ዝርዝር የእምነት ሥርዓት አይወስንም።
- issue: ‘የተስፋው መንፈስ’ የሚለው ጄኒቲቭ
  choice: ‘በተስፋው መንፈስ ቅዱስ’ በማለት የምንጩ አጭርና ክፍት አገላለጽ ተጠብቋል።
  alternative: ‘ተስፋ በተሰጠው መንፈስ ቅዱስ’ ወይም ‘በተስፋው የተሰጠው መንፈስ ቅዱስ’ ሊባል ይችላል።
  rationale: ግሪኩ መንፈሱ በእግዚአብሔር ተስፋ የተሰጠ መሆኑን ሊያመለክት የሚችል የተጨመቀ አገላለጽ ነው፤ ዋናው ጽሑፍ አሻሚነቱን ይጠብቃል፣ ግልጽ አማራጩም በማስታወሻ ቀርቧል።
- issue: የἐν ᾧ ሁለተኛው አገባብ
  choice: ‘በእርሱም ካመናችሁ በኋላ’ ተብሎ ἐν ᾧ ከπιστεύσαντες ጋር በተፈጥሯዊ አማርኛ ተያይዟል።
  alternative: ‘በእርሱም፣ ካመናችሁ በኋላ’ ተብሎ የቦታ/ኅብረት አገላለጹ ከ‘ማመን’ በተለየ ሊቀርብ ይችላል።
  rationale: ἐν ᾧ πιστεύσαντες በመዋቅር ‘በእርሱ አምናችሁ’ ተብሎ ሊነበብ ይችላል፣ በቀደመው አውድ ያለውን በክርስቶስ ውስጥ የመሆን ሐሳብም አያስወግድም።
