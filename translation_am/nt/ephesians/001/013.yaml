- source_word: τὸν λόγον τῆς ἀληθείας
  choice: የእውነትን ቃል
  rationale: የλόγοςን ‘ቃል/መልእክት’ ኃይልና የጳውሎስን የታወቀ አገላለጽ ይጠብቃል።
- source_word: τὸ εὐαγγέλιον τῆς σωτηρίας ὑμῶν
  choice: የመዳናችሁን የምሥራች
  rationale: εὐαγγέλιονን ለዘመናዊ አንባቢ ግልጽ በሆነ ‘የምሥራች’ ይተረጉማል፤ መልእክቱ ከመዳናቸው ጋር ያለውን ዝምድናም ይጠብቃል።
- source_word: πιστεύσαντες
  choice: ካመናችሁ በኋላ
