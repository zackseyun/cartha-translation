review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys hearing the message of truth, believing in Christ, and being sealed. However, በተስፋው (“with/by his promise”) does not faithfully express τῆς ἐπαγγελίας, which qualifies the Holy Spirit as the promised Spirit/Spirit associated with promise.
  naturalness: The sentence is generally clear and idiomatic. Removing the doubled additive force in በእርሱም … እናንተ ደግሞ improves flow while retaining καὶ ὑμεῖς.
  terminology: የእውነት ቃል, የምሥራች, መዳን, and ታተማችሁ are appropriate. ቅዱስ መንፈስ is a natural standard rendering of “Holy Spirit.” The phrase for the promise-related genitive needs correction.
  issues:
  - severity: medium
    issue: በተስፋው መንፈስ ቅዱስ misrenders τῷ πνεύματι τῆς ἐπαγγελίας τῷ ἁγίῳ.
    rationale: The possessive form ተስፋው means “his promise” and, with በ, makes the promise the means of sealing. The Greek instead identifies the Spirit as the one promised or as the Spirit belonging to promise. በተስፋ በተሰጠው ቅዱስ መንፈስ clearly conveys the likely sense without introducing doctrinal claims.
  - severity: low
    issue: 'The first additive is expressed twice: በእርሱም and ደግሞ.'
    rationale: Greek has one καί in ἐν ᾧ καὶ ὑμεῖς. Rendering it once as እናንተም is more natural and avoids unnecessary emphasis.
