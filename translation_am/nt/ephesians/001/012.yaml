  text: εἰς τὸ εἶναι ἡμᾶς εἰς ἔπαινον δόξης αὐτοῦ τοὺς προηλπικότας ἐν τῷ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/012.yaml
  text: so that we who had already hoped in Messiah might be for the praise of his glory[a][b].
translation:
  language: am
  text: በመሲሑ አስቀድመን ተስፋ ያደረግን እኛ ለክብሩ ምስጋና እንድንሆን ነው።[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በመሲሑ መጀመሪያ ተስፋ ያደረግን»።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ «እኛ፣ በመሲሑ አስቀድመን ተስፋ ያደረግን፣ ለክብሩ ምስጋና እንድንሆን ነው»።
    reason: previous_rendering
lexical_decisions:
- source_word: εἰς τὸ εἶναι
  choice: እንድንሆን ነው
  rationale: የεἰς ከተውሳከ ግስ ጋር ያለውን የዓላማ ወይም የውጤት ኃይል በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἡμᾶς
  choice: እኛ
  rationale: በግሪክኛ የተውሳከ ግሱ ባለቤት በወደቀ ቅጽ ቢሆንም፣ በአማርኛው የዓላማ ሐረግ ውስጥ «እኛ» ተፈጥሯዊ ነው።
- source_word: εἰς ἔπαινον
  choice: ለ… ምስጋና
  rationale: ዓላማንና ውጤትን የሚያመለክተውን የኤፌሶን ደብዳቤ ተደጋጋሚ አገላለጽ በአጭርና በተፈጥሯዊ መንገድ ይጠብቃል።
- source_word: δόξης αὐτοῦ
  choice: ክብሩ
  rationale: የባለቤትነት ግንኙነቱን ይጠብቃል፤ «ክብር»ም የቃሉን ሥነ መለኮታዊ ክብደት ሳያቀልል ያስተላልፋል።
- source_word: τοὺς προηλπικότας
  choice: ቀድመን … ተስፋ ያደረግን
  rationale: የπρο-ን የቀደምትነት ፍቺ ይይዛል፣ ነገር ግን «መጀመሪያ ተስፋ ያደረግን» በማለት የተለየ ቡድንን በግድ አይወስንም።
- source_word: ἐν τῷ Χριστῷ
  choice: በመሲሑ
  rationale: Χριστόςን እንደ ማዕረግ «መሲሕ» ብሎ ይተረጉማል፤ በ- የሚለውም ተስፋው በተቀባው ንጉሥ ላይ መመሥረቱን ያሳያል።
theological_decisions:
- issue: προηλπικότας የቀደመ ተስፋን ብቻ ያመለክት እንደሆነ ወይስ «መጀመሪያ ተስፋ ያደረጉትን» የተለየ ቡድን እንደሚለይ
  choice: በዋናው ጽሑፍ «ቀድመን … ተስፋ ያደረግን» የሚለውን ጥንቃቄ ያለው አተረጓጎም መጠቀም
  alternative: «በመሲሑ መጀመሪያ ተስፋ ያደረግን»
  rationale: προ- ቀደምትነትን ያሳያል፣ ግን ጳውሎስ በተለይ አይሁድ አማኞችን እንደ መጀመሪያዎቹ እየለየ መሆኑን ቃሉ ብቻውን በግድ አይወስንም፤ ጠንከር ያለው አማራጭ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «እኛ»ን የሚወስነው አንቀጽ ያለ ነጠላ ሰረዝ ቀርቧል፤ ሊሆን የሚችለው የማብራሪያ አነባበብ ግን በ[b] ተጠብቋል።
