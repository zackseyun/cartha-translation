  rationale: አገባቡ κεφαλὴνን ከὑπὲρ πάντα ጋር በማያያዝ τῇ ἐκκλησίᾳን እንደ ተቀባይ ወይም ተጠቃሚ ለመረዳት ያስችላል። ትርጉሙ የክርስቶስን ሁሉን አቀፍ የበላይነትና ቤተ ክርስቲያን ካለው ልዩ ግንኙነት አንዱን ለሌላው ሳይሠዋ ይጠብቃል።
