- source_word: ὑπὲρ ὑμῶν
  choice: ስለ እናንተ
  rationale: በዚህ የምስጋና አውድ ምስጋናው የቀረበባቸውን ሰዎች በተፈጥሯዊ አማርኛ ይጠቁማል።
- source_word: μνείαν ποιούμενος
  choice: እናንተን አነሳለሁ
  rationale: የግሪኩን ‘መጥቀስ/ማንሳት’ ፈሊጣዊ አገላለጽ ይጠብቃል፤ ከአውዱ የተገኘውን ተሳቢ ‘እናንተን’ ግልጽ ያደርጋል።
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: በጸሎቴም
  rationale: መጥቀሱ የሚደረግበትን አጋጣሚና ዐውድ ‘በጸሎቴ’ በሚል አጭርና ተፈጥሯዊ አገላለጽ ያቀርባል።
