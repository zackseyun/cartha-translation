lexical_decisions:
- source_word: οὐ παύομαι
  choice: አላቋርጥም
  rationale: በአሁን ጊዜ የቀጠለ አለማቋረጥን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: εὐχαριστῶν
  choice: ሳመሰግን
