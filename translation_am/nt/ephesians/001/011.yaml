  text: In him we also were made an inheritance[a], having been predestined according to the purpose of the one who works all things according to the counsel of his will,
translation:
  language: am
  text: በእርሱም የእግዚአብሔር ርስት እንድንሆን ተመደብን፤[a] ይህም ሁሉን ነገር በፈቃዱ ውሳኔ መሠረት የሚያከናውነው አምላክ ባለው ዓላማ መሠረት አስቀድሞ ተወስነን ነው።
  philosophy: optimal-equivalence
  footnotes:
