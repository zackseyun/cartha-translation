  alternative: «አስቀድሞ ሾማቸው» ወይም «አስቀድሞ አቀደላቸው»
  rationale: ግሪኩ ቀድሞ መወሰንን ይገልጻል፤ ትርጉሙ ይህን ይጠብቃል እንጂ ስለ ዘዴው፣ መሠረቱ ወይም ሙሉ ሥነ መለኮታዊ ሥርዓቱ ጽሑፉ ያልተናገረውን አያክልም።
