  rationale: ተውላጠ ስሙ በቀደመው አውድ ወደ መሲሑ ይመለሳል፤ «በእርሱ» ከክርስቶስ ጋር ያለውን ኅብረት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐκληρώθημεν
  choice: የእግዚአብሔር ርስት ሆነን ተመደብን
  rationale: የግሪኩ የተደራጊ ቅርጽ ሕዝቡ ለእግዚአብሔር የተመደበ ርስት መሆኑን ሊያመለክት ይችላል። «የእግዚአብሔር» በአውዱ የተገነዘበውን የባለቤትነት ግንኙነት ግልጽ ያደርጋል፤ ሌላው ትርጉም በማስታወሻ ተጠብቋል።
- source_word: προορισθέντες
  choice: አስቀድሞ ስለወሰነን
