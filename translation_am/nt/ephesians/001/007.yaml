  yaml_path: translation/nt/ephesians/001/007.yaml
  text: In him we have redemption through his blood[a], the forgiveness of trespasses[b], according to the riches of his grace
translation:
  language: am
  text: በእርሱ በደሙ አማካይነት ቤዛነትን፣ ማለትም የበደሎችን ይቅርታ፣ እንደ የጸጋው ብልጽግና አለን።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ᾧ
  choice: በእርሱ
  rationale: ተውላጠ ስሙ በቀደመው ቁጥር ያለውን ‘የተወደደውን’ ይመለከታል፤ ‘በእርሱ’ የክርስቶስን ኅብረት ሐሳብ በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: ἔχομεν
  choice: አግኝተናል
  rationale: የአሁን ጊዜ ይዞታንና እውነታን ያሳያል፤ በአማርኛ ከ‘ይቅርታ’ ጋር ተፈጥሯዊ ሆኖ ሳለ ያለውን ውጤት ይገልጣል።
- source_word: ἀπολύτρωσιν
  choice: የቤዛነት ነፃነትን
  rationale: ቃሉ ዋጋ በመከፈል የሚገኝን ነፃ መውጣት ያመለክታል፤ ‘ቤዛነት’ የዋጋውን ገጽታ፣ ‘ነፃነት’ ደግሞ የመፈታቱን ውጤት ያቆያሉ።
- source_word: διὰ τοῦ αἵματος αὐτοῦ
  choice: በደሙ
  rationale: διά ከዘር ቅጽ ጋር መንገድን ወይም መሣሪያነትን ያሳያል፤ ቀጥተኛው ‘ደሙ’ የመሥዋዕትና የሞት ምስሉን ሳይተረጉም ይጠብቃል።
- source_word: ἄφεσιν
  choice: ይቅርታ
  rationale: በዚህ አውድ የበደል መሰረዝንና ይቅር መባልን በግልጽ ዘመናዊ አማርኛ ይገልጣል።
- source_word: παραπτωμάτων
  choice: በደሎቻችንን
  rationale: παράπτωμα ከትክክለኛው መንገድ መውደቅን፣ ጥፋትን ወይም መተላለፍን ያመለክታል፤ ‘በደል’ ሥነ ምግባራዊና ግንኙነታዊ ክብደቱን ይይዛል።
- source_word: κατὰ τὸ πλοῦτος
  choice: እንደ ... ባለጠግነት
  rationale: κατά እዚህ መለኪያን ወይም መሥፈርትን ያሳያል፤ ስጦታው በጸጋው ብዛት መጠን መሆኑን ያቆያል።
- source_word: χάριτος
  choice: ጸጋው
  rationale: በጳውሎስ ጽሑፎች የእግዚአብሔርን ነፃና ቸር ሞገስ የሚገልጽ ዋና ሥነ መለኮታዊ ቃል ነው።
theological_decisions:
- issue: በ‘ቤዛነት’ እና በ‘በደሎች ይቅርታ’ መካከል ያለው ግንኙነት
  choice: ሁለተኛው ሐረግ የመጀመሪያውን የሚያብራራ ተጓዳኝ ሐረግ ሆኖ ‘ይኸውም’ ተጨምሮ ተተርጉሟል።
  alternative: የግሪኩን አወቃቀር በቀጥታ ‘የቤዛነት ነፃነትን፣ የበደሎቻችንን ይቅርታ’ ማለት።
  rationale: ሁለተኛው ተሳቢ ሐረግ የቤዛነቱን ይዘት ወይም ውጤት ያብራራል፤ ‘ይኸውም’ ይህን ሰዋሰዋዊ ግንኙነት ለአማርኛ አንባቢ ግልጽ ያደርገዋል።
- issue: ‘በደሙ’ የሚለው የሥርየት ንግግር
  choice: ተጨባጩ ‘በደሙ’ የሚለው አገላለጽ ተጠብቋል።
  alternative: ‘በሞቱ’ ወይም ‘በመሥዋዕታዊ ሞቱ’ ብሎ መተርጎም።
  rationale: ምንጩ በግልጽ ‘ደም’ ይላል፤ በ‘ሞት’ መተካት የመሥዋዕትና የቃል ኪዳን ምስሉን ያሳንሳል እንጂ ቀጥተኛ ትርጉም አይሆንም።
- issue: τοῦ αἵματος αὐτοῦ ውስጥ ያለው αὐτοῦ የሚያመለክተው
  choice: ‘ደሙ’ የሚለው ባለቤትነት ወደ ‘እርሱ’፣ ማለትም በቀደመው አውድ ወደ ተወደደው ይመለሳል።
  alternative: የባለቤትነቱን ስም በግልጽ ‘በክርስቶስ ደም’ ማለት።
  rationale: ምንጩ ስሙን አይደግምም፤ ተውላጠ ስሙን ማቆየት የጽሑፉን የማጣቀሻ አወቃቀር ይጠብቃል።
