- from: በእርሱ የቤዛነት ነፃነትን፣ ይኸውም በደሙ[a] የበደሎቻችንን[b] ይቅርታ፣ እንደ ጸጋው ባለጠግነት አግኝተናል።
  to: በእርሱ በደሙ አማካይነት ቤዛነትን፣ ማለትም የበደሎችን ይቅርታ፣ እንደ የጸጋው ብልጽግና አለን።
  rationale: 'The revision restores the source order and syntactic relationships: redemption is received through his blood; forgiveness of trespasses stands appositionally to redemption; and the measure is the riches of his grace. It removes unsupported possessive wording, avoids duplicating the meaning of redemption, and uses a present-tense possession construction. Footnotes are aligned to the appropriate lexical alternatives.'
  reviewer_model: gpt-5.6-terra
