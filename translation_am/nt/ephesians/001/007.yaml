  register: ዘመናዊ፣ ክቡርና ለመደበኛ አማርኛ አንባቢ ግልጽ የሆነ አገላለጽ ተመርጧል። የግሪኩ ረጅም ዓረፍተ ነገር ፍሰት ተጠብቆ፣ ሁለተኛው ተጓዳኝ ሐረግ በ‘ይኸውም’ ግልጽ ተደርጓል።
