  text: Peace to the brothers[a], and love with faith[c][b], from God the Father and the Lord Jesus the Messiah.
translation:
  language: am
  text: ለወንድሞች[a] ሰላም፣ ከእምነት[b] ጋር ፍቅርም፣ ከእግዚአብሔር አብና ከጌታ ኢየሱስ መሲሕ[c] ይሁን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ለወንድሞችና ለእህቶች።» የግሪኩ ቃል «ወንድሞች» የሚል ተባዕታይ ብዙ ቁጥር ቅርጽ ቢኖረውም፣ መላውን የአማኞች ማኅበረሰብ ሊያመለክት ይችላል።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ «ከታማኝነት ጋር» ወይም «ከመታመን ጋር።» የግሪኩ ቃል እነዚህንም ትርጉሞች ሊይዝ ይችላል፤ እዚህ ግን «እምነት» መደበኛው አተረጓጎም ነው።
    reason: lexical_alternative
  - marker: c
    text: ግሪክኛው «ኢየሱስ ክርስቶስ» ይላል። እዚህ «መሲሕ» የሚለው Χριστός የሚለውን ማዕረግ ትርጉም ይጠብቃል።
    reason: alternative_reading
