lexical_decisions:
- source_word: ὃν
  choice: ላክሁት
  rationale: የድርጊቱ ተሳቢ የሆነው ተውላጠ ስም በአማርኛ ከግሱ ጋር በተያያዘው «-ት» ተገልጧል፤ ከቀደመው ቁጥር ወደ ጢኪቆስ ያመለክታል።
- source_word: ἔπεμψα πρὸς ὑμᾶς
  choice: ወደ እናንተ ላክሁት
  rationale: የአኦሪስት ግሱን በተፈጸመ ያለፈ ጊዜ አቀራረብ ይገልጣል፤ πρός ደግሞ መላኩ ያመራበትን ሰዎች ያሳያል።
- source_word: εἰς αὐτὸ τοῦτο
