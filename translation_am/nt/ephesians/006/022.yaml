- source_word: ἵνα γνῶτε τὰ περὶ ἡμῶν
  choice: እኛ እንዴት እንዳለን እንድታውቁ
  rationale: ሐረጉ ጳውሎስንና አብረውት ያሉትን የሚመለከቱ ጉዳዮች ወይም ሁኔታቸውን ሊያጠቃልል ይችላል። «እንዴት እንዳለን» ትርጉሙን ተፈጥሯዊ በሆነና በማያጠብ መንገድ ያቀርባል።
- source_word: καὶ παρακαλέσῃ
  choice: እርሱም … እንዲያበረታታ
  rationale: καὶ ሁለተኛውን የዓላማ ክፍል ያስተባብራል። παρακαλέω በዚህ አውድ ማበረታታንና ማጽናናትን ሊያመለክት ቢችልም፣ «እንዲያበረታታ» የመንፈሳዊ ማጠናከርን ሰፊ ስሜት ይይዛል።
- source_word: τὰς καρδίας ὑμῶν
  choice: ልባችሁን
  rationale: የግሪኩን መጽሐፍ ቅዱሳዊ ሰውነታዊ ምሳሌ በቀጥታ ይጠብቃል፤ በአማርኛም ተፈጥሯዊና ግልጽ ነው።
theological_decisions:
- issue: የτὰ περὶ ἡμῶν ትርጉም
  choice: «እኛ እንዴት እንዳለን» ተብሎ በግላዊና በሁኔታዊ ስፋት ተተርጉሟል።
