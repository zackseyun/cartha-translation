  yaml_path: translation/nt/ephesians/006/022.yaml
  text: 'I sent him to you for this very purpose: that you may know how we are[a], and that he may encourage your hearts.'
translation:
  language: am
  text: እኛ እንዴት እንዳለን[a] እንድታውቁና እርሱም ልባችሁን እንዲያበረታታ፣ ለዚሁ ዓላማ ወደ እናንተ ላክሁት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ሁኔታችንን» ወይም «ስለ እኛ ያሉትን ነገሮች»።
