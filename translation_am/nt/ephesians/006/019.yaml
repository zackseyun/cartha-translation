  text: καὶ ὑπὲρ ἐμοῦ, ἵνα μοι δοθῇ λόγος ἐν ἀνοίξει τοῦ στόματός μου, ἐν παρρησίᾳ γνωρίσαι τὸ μυστήριον τοῦ εὐαγγελίου
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/019.yaml
  text: and for me[a], that words may be given to me in opening my mouth, to make known with boldness the mystery of the gospel[e][d][c][b],
translation:
  language: am
  text: ስለ እኔም ጸልዩ፤ አፌን ስከፍት የምናገረው ቃል ይሰጠኝ ዘንድ፣ የወንጌልን ምሥጢር በድፍረት እንዳስታውቅ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπὲρ ἐμοῦ
  choice: ስለ እኔም ጸልዩ
  rationale: ከቀዳሚው ቁጥር የቀጠለው የጸሎት ጥያቄ በአማርኛ ግልጽ እንዲሆን፣ በግሪኩ በአውዱ የተገነዘበውን ‘ጸልዩ’ በግልጽ አቀረበ።
- source_word: ἵνα μοι δοθῇ λόγος
  choice: የምናገረው ቃል ይሰጠኝ ዘንድ
  rationale: λόγος እዚህ የሚነገር ንግግር ወይም መልእክት ማለት ነው፤ ‘የምናገረው ቃል’ ነጠላውን ቅርጽና መለኮታዊ መሰጠቱን ጠብቆ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐν ἀνοίξει τοῦ στόματός μου
  choice: አፌን ስከፍት
  rationale: የግሪኩን የአፍ መክፈት ምስል ጠብቆ፣ በአማርኛ የንግግር መጀመርን በተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: ἐν παρρησίᾳ
  choice: በድፍረት
  rationale: የግልጽ፣ ያልተፈራና በይፋ የሚነገር ንግግርን ያመለክታል፤ ‘በድፍረት’ በዚህ ዐውድ የተለመደና ግልጽ ነው።
- source_word: γνωρίσαι
  choice: እንዳስታውቅ
  rationale: የግሪኩን ‘የታወቀ ማድረግ’ ትርጉም ቀጥታ ያስተላልፋል፣ ከጽሑፉም በላይ የሆነ ቴክኒካዊ የስብከት ቃል አያስገባም።
- source_word: τὸ μυστήριον τοῦ εὐαγγελίου
  choice: የወንጌልን ምሥጢር
  rationale: ‘ምሥጢር’ ቀድሞ ተሰውሮ አሁን የተገለጠውን መለኮታዊ ዓላማ ያመለክታል፤ ‘ወንጌል’ም εὐαγγέλιονን በተመሰረተ አማርኛ የክርስቲያን ቃል ያቀርባል።
theological_decisions:
- issue: የλόγος ትርጉም
  choice: የምናገረው ቃል
  alternative: መልእክት፤ ቃላት፤ ንግግር
  rationale: ጳውሎስ የሚለምነው የድምፅ ችሎታን ብቻ ሳይሆን የሚናገረው ትርጉም ያለው ንግግር እንዲሰጠው ነው። ምርጫው ነጠላውን λόγος ይጠብቃል፣ ከጽሑፉ ያለፈ ልዩ የመነሳሳት አስተምህሮም አያስገባም።
- issue: የπαρρησία ኃይል
  choice: በድፍረት
  alternative: በግልጽነት፤ ያለ ፍርሃት፤ በሙሉ እምነት
  rationale: የሕዝብ ፊት ግልጽና ያልተፈራ ምስክርነትን ይጠብቃል፤ ቃሉን ወደ ግላዊ በራስ መተማመን ብቻ አይቀንሰውም።
- issue: የμυστήριον ትርጉም
  choice: ምሥጢር
  alternative: ሚስጥር፤ የተሰወረ ነገር
  rationale: በጳውሎሳዊ አጠቃቀም ይህ የማይፈታ እንቆቅልሽ ሳይሆን፣ ቀድሞ ተሰውሮ አሁን የተገለጠ መለኮታዊ ዓላማ ነው። የተመሰረተው ቃል ይህን ሥነ መለኮታዊ ጥልቀት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለሕዝብ ንባብ ተፈጥሯዊ የሆነ መደበኛ አማርኛ። ከቁጥር 18 የሚቀጥለው የጸሎት ዐውድ ግልጽ እንዲሆን ‘ጸልዩ’ ተጨምሯል፤ የግሪኩ የአፍ መክፈት ምስል ተጠብቋል።
