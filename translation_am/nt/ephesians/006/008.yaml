review_pass:
  verdict: revise
  source_fidelity: The draft preserves the central ideas of individual recompense, the good done, its source from the Lord, and the slave/free contrast. However, it shifts the indefinite relative clause toward a completed past act (ያደረገውን) and adds an independent concluding assertion (ይህ እንዲሁ ነው) not present in the Greek.
  naturalness: The opening and final clause are understandable, but the inserted final sentence makes the syntax heavier and less direct. A participial opening with the slave/free qualification attached to ‘each person’ is more natural and closer to the source.
  terminology: ባሪያ and ነጻ ሰው accurately retain the κοινωνically significant δοῦλος/ἐλεύθερος contrast. ጌታ is appropriate for κυρίου. ያንኑ and መልሶ እንደሚቀበል convey the demonstrative correspondence and the reciprocal nuance of κομίσεται without imposing a commercial sense.
  issues:
  - severity: medium
    issue: 'The relative clause is rendered with a past/perfective form: ያደረገውን.'
    rationale: ὃ ἂν ποιήσῃ is indefinite (‘whatever ... does’), not specifically a completed past deed. የሚያደርገውን ማንኛውንም መልካም ነገር better preserves the open-ended sense.
  - severity: medium
    issue: The added sentence ይህ እንዲሁ ነው is not represented in the Greek.
    rationale: The Greek ends with the qualifying pair ‘whether slave or free’; it does not state separately that this is so. The addition should be removed.
  - severity: low
    issue: The demonstrative τοῦτο is absorbed into the preceding object rather than expressed distinctly.
    rationale: Although the sense is partly retained, ያንኑ explicitly represents ‘this/the same’ and clarifies that what is received corresponds to the good done.
  revised_text: እያንዳንዱ ሰው የሚያደርገውን ማንኛውንም መልካም ነገር ያንኑ ከጌታ መልሶ እንደሚቀበል፣ ባሪያ ቢሆንም ነጻ ሰው ቢሆንም፣ እያወቃችሁ።
