  yaml_path: translation/nt/ephesians/006/008.yaml
  text: knowing that each one[a], whatever good he does, this he will receive back from the Lord[b], whether servant or free.
translation:
  language: am
  text: እያንዳንዱ ሰው የሚያደርገውን ማንኛውንም መልካም ነገር ያንኑ ከጌታ መልሶ እንደሚቀበል፣ ባሪያ ቢሆንም ነጻ ሰው ቢሆንም፣ እያወቃችሁ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰδότες
  choice: ዐውቃችኋልና
  rationale: የግሪኩ አሳታፊ ቅርጽ ከቀደመው ምክር ጋር የሚያገናኘውን ምክንያታዊ ጥላ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἕκαστος
  choice: እያንዳንዱ ሰው
  rationale: የእያንዳንዱን ግለሰብ አጽንዖት ይጠብቃል፤ በአማርኛም ግልጽና ሁሉን አካታች ነው።
- source_word: ὃ ἂν ποιήσῃ ἀγαθόν
  choice: ያደረገውን ማንኛውንም መልካም ነገር
  rationale: ὃ ἂν ያለውን ያልተወሰነ ‘ማንኛውንም’ ትርጉምና የድርጊቱን መልካምነት ይጠብቃል።
- source_word: τοῦτο κομίσεται
  choice: ያደረገውን … መልሶ እንደሚቀበል
  rationale: τοῦτο ወደተደረገው መልካም ነገር መመለሱን፣ κομίσεται ደግሞ በድርጊቱ ፈንታ የሚመጣውን መቀበል ያሳያል፤ አማርኛው የተፈጥሮ አገባብ ስለሚጠይቅ ጠቋሚው በተውላጠ ስም ተዋሕዷል።
- source_word: παρὰ κυρίου
  choice: ከጌታ
  rationale: παρά ከዘር አገባብ ጋር ምንጩን ያመለክታል፤ ‘ጌታ’ ደግሞ መለኮታዊውን፣ በአውዱም ክርስቶሳዊ ሊሆን የሚችለውን ማጣቀሻ ይጠብቃል።
- source_word: δοῦλος
  choice: ባሪያ
  rationale: ከἐλεύθερος ጋር ያለው ግልጽ የማኅበራዊ ሁኔታ ተቃርኖ ስለሚፈልገው፣ ታሪካዊውን የታሰረ አገልግሎት ሁኔታ አያለዝብም።
- source_word: ἐλεύθερος
  choice: ነጻ ሰው
  rationale: ከባሪያ ተቃራኒ የሆነውን ነጻ ማኅበራዊ ሁኔታ በግልጽ አማርኛ ይገልጣል።
theological_decisions:
- issue: በቤተሰብ ሥርዓት አውድ ውስጥ δοῦλος የሚተረጎምበት መንገድ
  choice: ባሪያ
  alternative: አገልጋይ
  rationale: ጥቅሱ δοῦλοςን ከἐλεύθερος ጋር በቀጥታ ስለሚያነጻጽር፣ ‘ባሪያ’ ታሪካዊውንና ማኅበራዊውን ልዩነት በትክክል ይጠብቃል።
- issue: κυρίου የሚያመለክተውና አተረጓጎሙ
  choice: ጌታ
  alternative: አለቃ
  rationale: ምንም እንኳ አውዱ ስለ ሰብዓዊ ጌቶች ቢናገርም፣ እዚህ የዋጋው ምንጭ መለኮታዊው ጌታ ነው፤ ‘ጌታ’ ይህን ክብደት ሳይወስን ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። የግሪኩን አጽንዖት ለመጠበቅ ‘እያንዳንዱ ሰው’ ቀድሟል፤ የመጨረሻው ተቃርኖ በተፈጥሯዊ አማርኛ እንዲነበብ ‘ይህ እንዲሁ ነው’ ተጨምሯል።
