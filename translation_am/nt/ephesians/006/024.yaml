id: EPH.6.24
reference: Ephesians 6:24
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἡ χάρις μετὰ πάντων τῶν ἀγαπώντων τὸν κύριον ἡμῶν Ἰησοῦν Χριστὸν ἐν ⸀ἀφθαρσίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/024.yaml
  text: Grace be with all who love our Lord Jesus the Messiah with incorruptibility[a].
translation:
  language: am
  text: ጸጋ ጌታችንን ኢየሱስ መሲሑን በማይጠፋነት[a] ከሚወዱ ሁሉ ጋር ይሁን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በማይጠፋ ፍቅር»፤ እንዲሁም «በቅንነት» ወይም «በማይሞት ፍቅር» ተብሎ ሊተረጎም ይችላል። የግሪኩ «ἐν ἀφθαρσίᾳ» የሚለው ሐረግ አጭርና አሻሚ ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: ጸጋ
  rationale: በጳውሎስ መልእክቶች መደምደሚያ ቡራኬ የተለመደውንና የግሪኩን ትርጉም በቀጥታ የሚያስተላልፈውን ቃል ይጠቀማል።
- source_word: μετὰ πάντων
  choice: ከ…ሁሉ ጋር ይሁን
  rationale: በግሪኩ ግስ ባይኖርም፣ የቡራኬውን ምኞት በተፈጥሯዊ አማርኛ ለመግለጽ «ይሁን» ተጨምሯል፤ μετά ከወራሽ ቅጽ ጋር ያለውም «ከ…ጋር» ተብሏል።
- source_word: ἀγαπώντων
  choice: ከሚወዱ
  rationale: የአሁን ጊዜ አሳታፊውን በተፈጥሯዊ የአማርኛ አንጻራዊ ሐረግ ያቀርባል፣ ቀጣይ ባሕርይንም ያሳያል።
- source_word: κύριον
  choice: ጌታችንን
  rationale: κύριος እዚህ የክብርና የክርስቶሳዊ ማዕረግ ስለሆነ «ጌታ» ተብሏል፤ ἡμῶν ደግሞ በባለቤትነት ቅጥያ ተገልጿል።
- source_word: Ἰησοῦν Χριστόν
  choice: ኢየሱስ መሲሑን
  rationale: Χριστός የቅቡዕነት ማዕረግ መሆኑን «መሲሕ» ያስተላልፋል፤ የአማርኛው የውስንነትና የተሳቢነት ቅጥያ «መሲሑን» የሚለውን ተፈጥሯዊ ቅርጽ ይሰጣል።
- source_word: ἐν ἀφθαρσίᾳ
  choice: በማይጠፋነት
  rationale: አጭሩና ትርጉሙ ክርክር ያለበት የግሪክ ሐረግ ፍቅሩን፣ የመውደዱን ሁኔታ ወይም የቡራኬውን ዓውድ ሊገልጽ ይችላል። «በማይጠፋነት» ይህን አሻሚነት ሳይዘጋ የἀφθαρσίαን ዋና ሐሳብ ይጠብቃል።
theological_decisions:
- issue: የἐν ἀφθαρσίᾳ አገባብና ትርጉም
  choice: በዋናው ጽሑፍ «በማይጠፋነት» ብሎ አጭሩንና አሻሚውን አገላለጽ መጠበቅ
  alternative: «በማይጠፋ ፍቅር»፣ «በቅንነት» ወይም «በማይሞት ፍቅር»
  rationale: ግሪኩ ἀφθαρσία በቀጥታ የሚገልጸው የአማኞቹን ፍቅር፣ የመውደዳቸውን ሁኔታ ወይም ቡራኬው የሚሰጥበትን የማይጠፋ ዓውድ መሆኑን በግልጽ አይወስንም። ስለዚህ ዋናው ጽሑፍ ውጥረቱን ይጠብቃል፣ ትርጓሜያዊ አማራጮችም በማስታወሻ ይቀርባሉ።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ የተከበረና ለተራው አንባቢ የሚገባ የአማርኛ ዘይቤ ይጠቀማል። «በማይጠፋነት» በዕለታዊ ንግግር ከሚጠቀሙት በመጠኑ የተገታ ቢሆንም፣ የምንጩን እውነተኛ አሻሚነት ለመጠበቅ ተመርጧል።
