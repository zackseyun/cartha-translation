  choice: ‘ለሰው አያዳላም’ በማለት መግለጽ
  alternative: ‘በእርሱ ዘንድ አድልዎ የለም’
  rationale: ሁለቱም ትርጉሙን ይይዛሉ፤ የግስ አገላለጹ ግን ለዘመናዊ አንባቢ ይበልጥ ቀጥተኛ ሲሆን እግዚአብሔር በከፍተኛና በዝቅተኛ ማኅበራዊ ደረጃ መካከል እንደማያዳላ ያሳያል።
