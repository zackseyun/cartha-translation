translation:
  language: am
  text: ሰዎችን ደስ ለማሰኘት እንደሚጥሩ ሰዎች፣ ሰዎች ሲያዩአችሁ ብቻ በሚደረግ አገልግሎት[a] አይሁን፤ ይልቁንም እንደ መሲሑ[b] ባሪያዎች፣ የእግዚአብሔርን ፈቃድ በሙሉ ልባችሁ[c] አድርጉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል ‘በዓይን አገልግሎት’፤ ማለትም ሰዎች ሲመለከቱ ብቻ የሚደረግ አገልግሎት።
