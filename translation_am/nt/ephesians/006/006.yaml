    reason: lexical_alternative
lexical_decisions:
- source_word: ὀφθαλμοδουλίαν
  choice: ሰው ሲያያችሁ ብቻ በማገልገል
  rationale: የግሪኩ ውሁድ ቃል በቀጥታ ‘የዓይን አገልግሎት’ የሚል ሲሆን፣ ትርጉሙ በተቆጣጣሪ ዓይን ሥር ሲሆን ብቻ ማገልገል ነው። ይህ አተረጓጎም በዘመናዊ አማርኛ ተፈጥሯዊ ሆኖ ዋናውን ሐሳብ ያስተላልፋል።
- source_word: ἀνθρωπάρεσκοι
  choice: ሰዎችን ደስ ለማሰኘት እንደሚጥሩ ሰዎች
  rationale: ቃሉ የሰዎችን ሞገስና ይሁንታ ለማግኘት የሚጥሩትን ያመለክታል፤ ‘የሰው አስደሳቾች’ ከሚለው ቃል በቃል ቅርጽ ይልቅ ይህ ተፈጥሯዊና ግልጽ ነው።
- source_word: δοῦλοι
  choice: ባሪያዎች
  rationale: ዐውዱ በቀጥታ ለባሪያዎች የተነገረ ሲሆን፣ ከመሲሑ ጋር ያላቸውን የባለቤትነትና የታዛዥነት ግንኙነት ዳግም ይቀርጻል። ‘ባሪያዎች’ ይህን ኃይል ከ‘አገልጋዮች’ ይበልጥ ይጠብቃል።
- source_word: Χριστοῦ
  choice: የመሲሑ
  rationale: Χριστός ‘የተቀባው’ የሚለውን የንጉሣዊ ማዕረግ ትርጉም ስለሚይዝ፣ ‘መሲሕ’ ማዕረጉን ይጠብቃል።
- source_word: ποιοῦντες τὸ θέλημα τοῦ θεοῦ
  choice: የእግዚአብሔርን ፈቃድ … አድርጉ
  rationale: ‘ማድረግ’ የግሪኩን ποιοῦντες ቀጥተኛ እርምጃ ይጠብቃል፤ θέλημα በዚህ የሥነ ምግባር ማሳሰቢያ ውስጥ ‘ፈቃድ’ ተብሎ በተገቢው ይተረጎማል።
- source_word: ἐκ ψυχῆς
  choice: ከነፍሳችሁ
  rationale: የግሪኩን ‘ከነፍስ’ የሚል የሰው ማንነት ቃል በቀጥታ ይጠብቃል፤ ‘ከልባችሁ’ ወይም ‘በሙሉ ልብ’ ይበልጥ ፈሊጣዊ ቢሆንም ψυχήን ወደ καρδία ቋንቋ ይለውጣል።
theological_decisions:
- issue: በቤተሰብ ሥርዓት ዐውድ ውስጥ δοῦλοιን መተርጎም
  choice: የመሲሑ ባሪያዎች
  alternative: የመሲሑ አገልጋዮች
  rationale: በቅርብ ዐውዱ የተጠሩት ቃል በቃል ባሪያዎች ናቸው፤ ጳውሎስም ይህን ሁኔታ ከመሲሑ ጋር ባላቸው የመገዛት ግንኙነት አንጻር ያቀርበዋል። ስለዚህ ‘ባሪያዎች’ የቃሉን ማኅበራዊና ሥነ መለኮታዊ ክብደት ይጠብቃል።
- issue: Χριστοῦን እንደ ማዕረግ ወይም እንደ ስም መቅረጽ
  choice: የመሲሑ
  alternative: የክርስቶስ
  rationale: በዚህ ስፍራ ለተቀባው ገዢ መገዛት በጎላ ሁኔታ ስለሚታይ፣ የማዕረጉን ትርጉም የሚያስጠብቀው ‘መሲሕ’ ተመርጧል።
