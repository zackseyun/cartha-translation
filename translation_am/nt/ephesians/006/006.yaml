  verdict: revise
  source_fidelity: 'The draft conveys the principal contrast accurately: service must not be performed merely under human observation for human approval, but as slaves of the Messiah doing God''s will. The fronted Amharic order is permissible. However, ἐκ ψυχῆς is not idiomatically expressed by the bare phrase “ከነፍሳችሁ” in this construction; a natural adverbial rendering is needed, with the literal wording retained in a note.'
  naturalness: “ሰው ሲያያችሁ ብቻ በማገልገል አይሁን” is understandable but somewhat cumbersome. “ሰዎች ሲያዩአችሁ ብቻ በሚደረግ አገልግሎት” naturally expresses the Greek contrast. “በሙሉ ልባችሁ” is idiomatic modern standard Amharic for the adverbial force of ἐκ ψυχῆς.
  terminology: “ባሪያዎች” appropriately preserves the bonded force of δοῦλοι in this immediate context, and “መሲሕ” appropriately retains the titular force of Χριστός. The notes retain the literal image of ὀφθαλμοδουλία and the literal wording of ἐκ ψυχῆς.
  issues:
  - severity: medium
    issue: The phrase “ከነፍሳችሁ አድርጉ” is not fully idiomatic Amharic.
    rationale: Although it formally mirrors ἐκ ψυχῆς, it does not naturally function as an adverbial expression in modern standard Amharic. “በሙሉ ልባችሁ” conveys the intended wholehearted sincerity; the footnote preserves the literal ‘from the soul.’
  - severity: low
    issue: The eye-service wording is unnecessarily heavy.
    rationale: Recasting it as service done only when people are watching produces a smoother Amharic clause while retaining the source meaning and the literal compound in the note.
