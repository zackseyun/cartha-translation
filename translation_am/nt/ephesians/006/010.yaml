lexical_decisions:
- source_word: Τοῦ λοιποῦ
  choice: በመጨረሻም
  rationale: የደብዳቤውን የመደምደሚያ ክፍል የሚያስተዋውቅ የንግግር መሸጋገሪያ በመሆኑ፣ በዘመናዊ አማርኛ ተፈጥሯዊ የሆነው «በመጨረሻም» ተመርጧል።
- source_word: ἐνδυναμοῦσθε
  choice: በርቱ
  rationale: በአማርኛ «በርቱ» ተፈጥሯዊና ግልጽ የብዙ ቁጥር ትእዛዝ ነው። የግሪኩ ተቀባይነት ያለው የኃይል ምንጭ በቀጣዩ «በጌታና በኃያልነቱ ብርታት» ይጠበቃል፤ የቃል ቅርጹን ግን በማስታወሻ ግልጽ አድርገናል።
- source_word: ἐν κυρίῳ
  choice: በጌታ
  rationale: የግሪኩ ἐν የግንኙነትን ወይም የአካባቢን ሐሳብ ሳይወስን በአማርኛው «በ» ይጠበቃል፤ κύριος ደግሞ በመደበኛው «ጌታ» ተተርጉሟል።
- source_word: κράτει
  choice: ብርታት
  rationale: κράτος የተገለጠ ወይም የሚሠራ ኃይልን ያመለክታል። «ብርታት» ከἰσχύς ጋር ያለውን የኃይል ቃላት ክምችት በሚነበብ መንገድ ይጠብቃል።
- source_word: ἰσχύος
  choice: ኃያልነት
  rationale: ἰσχύς የውስጣዊ ችሎታንና ኃይልን ይጠቁማል። «ኃያልነት» ከκράτος ለተመረጠው «ብርታት» የተለየ ሆኖ የግሪኩን አጽንኦት ያስተላልፋል።
- source_word: αὐτοῦ
  choice: -ቱ
  rationale: በ«ኃያልነቱ» ውስጥ ያለው የሦስተኛ መደብ ወንድ ነጠላ ባለቤትነት ቅጥያ ወደ «ጌታ» በተፈጥሮ ይመለሳል።
theological_decisions:
- issue: በἐνδυναμοῦσθε የግስ ድምፅና የኃይሉ ምንጭ
  choice: «በርቱ» የሚለው ተፈጥሯዊ አማርኛ ተመርጦ፣ ብርታቱ ከጌታና ከኃያልነቱ እንደሚገኝ በዓረፍተ ነገሩ ተጠብቋል።
  alternative: «ኃይልን ተቀበሉ» ወይም «በኃይል በርቱ»
  rationale: የግሪኩ ቅርጽ መካከለኛ/ተደራጊ ሊተነተን ስለሚችል ተቀባይነትን ይጠቁማል፤ ሆኖም ቃል በቃል ተደራጊ አማርኛ እንግዳ ይሆናል። ስለዚህ ተፈጥሯዊ ትእዛዙ በዋናው ጽሑፍ፣ የቅርጹ ልዩነት ደግሞ በማስታወሻ ተጠብቋል።
- issue: የκύριος አተረጓጎም
  choice: ጌታ
  alternative: ገዢ
  rationale: በጳውሎስ አውድ κύριος ኢየሱስን በተፈጥሮ ያመለክታል፤ «ጌታ» የተለመደ፣ ክቡርና ከምንጩ ጋር የሚስማማ ነው።
- issue: የἐν κυρίῳ ግንኙነታዊ አሻሚነት
  choice: በጌታ
  alternative: ከጌታ በሚገኝ ኃይል / ከጌታ ጋር ባላችሁ ኅብረት
  rationale: «በጌታ» መሣሪያዊ፣ ግንኙነታዊ ወይም የሕልውና ክልል ሐሳብን አስቀድሞ ሳይወስን የግሪኩን ስፋት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለሕዝብ ንባብ ተፈጥሯዊ የሆነ አማርኛ ተጠቅመናል። የκράτος/ἰσχύς ሁለት ተዛማጅ የኃይል ቃላት «ብርታት/ኃያልነት» በሚል ተለይተው ተጠብቀዋል።
