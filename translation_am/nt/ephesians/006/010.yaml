  text: Finally[a], be strengthened in the Lord and in the strength of his might.
translation:
  language: am
  text: በመጨረሻም፣ በጌታና በኃያልነቱ ብርታት በርቱ[a]።
  philosophy: optimal-equivalence
  footnotes:
