- source_word: ἐν ἁλύσει
  choice: በሰንሰለት ታስሬ
  rationale: የግሪኩን ነጠላ ‘በሰንሰለት’ ምስል ይጠብቃል፣ በአማርኛም የእስር ሁኔታውን በግልጽ ያሳያል።
- source_word: ἵνα
  choice: እንድናገር
  rationale: የዓላማ አንቀጹን በተፈጥሯዊ የአማርኛ እንድ- ቅርጽ ያቀርባል፤ ከቁጥር 19 የሚቀጥለውን የጸሎት ጥያቄ በግልጽ ያስተሳስራል።
- source_word: ἐν αὐτῷ
  choice: ስለ እርሱ
  rationale: αὐτῷ ገለልተኛ ነጠላ ሲሆን ወደ ወንጌሉ ወይም ወደ ምሥጢሩ ይመለሳል። አማርኛ ሰዋስዋዊ ጾታን ስለማያሳይ ‘እርሱ’ ብቻውን ግራ ሊያጋባ ቢችልም፣ ‘ስለ’ የመልእክቱን ርዕሰ ጉዳይነት በተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: παρρησιάσωμαι
  choice: በድፍረት እንድናገር
  rationale: παρρησία የግልጽነትን፣ የነፃነትንና የድፍረትን ንግግር ያካትታል፤ ይህ አገላለጽ በዘመናዊ አማርኛ ዋናውን ሐሳብ ያስተላልፋል።
- source_word: ὡς δεῖ με λαλῆσαι
  choice: ልናገረው እንደሚገባኝ
  rationale: δεῖ የግዴታን ወይም የተገቢነትን ሐሳብ ይገልጣል፤ ‘እንደሚገባኝ’ ሁለቱንም በክቡርና ተፈጥሯዊ አማርኛ ይይዛል።
theological_decisions:
