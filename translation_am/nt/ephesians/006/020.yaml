lexical_decisions:
- source_word: ὑπὲρ οὗ
  choice: ስለዚህም ነገር
  rationale: οὗ በቅርጹ ገለልተኛ ነጠላ ስለሆነ፣ በቁጥር 19 ወዳለው ‘የወንጌል ምሥጢር’ መመለሱን በተፈጥሯዊ አማርኛ ያሳያል። ὑπέρ እዚህ ‘ስለ/ለዚህ ሲባል’ የሚለውን ግንኙነት ይገልጣል።
- source_word: πρεσβεύω
  choice: እንደ አምባሳደር እሠራለሁ
