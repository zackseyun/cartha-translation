  rationale: በSBLGNT የοὗ እና αὐτῷ ቅርጾች ገለልተኛ ነጠላ ናቸው፤ ስለዚህ ወደ ወንጌሉ ወይም ወደ ምሥጢሩ መመለሳቸው በሰዋስው የበለጠ የተደገፈ ነው። ትርጉሙ ጽሑፉ ያልጠቆመውን የክርስቶስ ተመላሽ አያስገባም።
