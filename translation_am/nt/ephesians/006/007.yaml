revisions:
- from: በበጎ ፈቃድ እያገለገላችሁ፣ ለጌታ እንደምታገለግሉ እንጂ ለሰዎች እንዳይደለ አድርጉ።
  to: በበጎ ፈቃድ እያገለገላችሁ፣ ለጌታ እንጂ ለሰዎች ሳይሆን።
  rationale: The revision preserves the source’s participial manner («እያገለገላችሁ»), its goodwill disposition, and the direct contrast between service rendered to the Lord and not to human beings. It removes the added imperative and uses an idiomatic modern Amharic contrast construction.
  reviewer_model: gpt-5.6-terra
