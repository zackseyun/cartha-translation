review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly conveys μετ’ εὐνοίας as «በበጎ ፈቃድ», δουλεύοντες as service, τῷ κυρίῳ as «ለጌታ», and ἀνθρώποις as «ለሰዎች». However, the final contrast is grammatically and semantically defective: «ለሰዎች እንዳይደለ አድርጉ» does not mean «and not to people» and introduces an imperative not present in the Greek. The Greek participial construction calls for an ongoing manner of service, not a separate command.'
  naturalness: «ለጌታ እንደምታገለግሉ እንጂ ለሰዎች እንዳይደለ አድርጉ» is not natural standard Amharic. A concise parallel construction, «ለጌታ እንጂ ለሰዎች ሳይሆን», is idiomatic and clearly expresses the contrast.
  terminology: «በበጎ ፈቃድ», «ጌታ», and «ሰዎች» are suitable modern-standard Amharic choices. No footnote is needed in Amharic for «ሰዎች», since it naturally means people/human beings and preserves the human-versus-Lord contrast.
  issues:
  - severity: high
    issue: The clause «ለሰዎች እንዳይደለ አድርጉ» is ungrammatical/incorrect in context and changes the syntax.
    rationale: οὐκ ἀνθρώποις is simply «not to people/human beings.» The draft's wording adds «አድርጉ» (“do [it]”), turning the source participial phrase into an independent imperative and failing to express the intended contrast.
  - severity: medium
    issue: The service verb is unnecessarily repeated in the comparison.
    rationale: While repetition can be possible in Amharic, the source has one participle modified by two dative objects. Keeping one service expression followed by «ለጌታ እንጂ ለሰዎች ሳይሆን» more closely preserves the Greek structure and reads naturally.
  revised_text: በበጎ ፈቃድ እያገለገላችሁ፣ ለጌታ እንጂ ለሰዎች ሳይሆን።
  revised_footnotes: []
  revision_rationale: The revision preserves the source’s participial manner («እያገለገላችሁ»), its goodwill disposition, and the direct contrast between service rendered to the Lord and not to human beings. It removes the added imperative and uses an idiomatic modern Amharic contrast construction.
