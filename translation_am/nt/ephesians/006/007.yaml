  text: በበጎ ፈቃድ እያገለገላችሁ፣ ለጌታ እንጂ ለሰዎች ሳይሆን።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετ’ εὐνοίας
  choice: በበጎ ፈቃድ
  rationale: μετά ከተከታዩ የጄኒቲቭ ቅርጽ ጋር የአገልግሎቱን አኳኋን ያመለክታል፤ εὔνοια ደግሞ በጎ ፈቃድንና ቅን አመለካከትን ይገልጣል።
- source_word: δουλεύοντες
  choice: እያገለገላችሁ
  rationale: ቃሉ በቀጥታ እንደ ባሪያ ማገልገልን ሊያመለክት ቢችልም፣ ተናጋሪዎቹ ባሪያዎች መሆናቸው በ6፥5 ተገልጧል፤ እዚህ የተግባሩ አኳኋን ትኩረት ስለሆነ «እያገለገላችሁ» ተፈጥሯዊና ትክክለኛ ነው።
- source_word: ὡς
  choice: እንደምታገለግሉ
  rationale: ὡς ንጽጽርንና የድርጊቱን አኳኋን ያሳያል። በአማርኛ ዓረፍተ ነገሩ ግልጽ እንዲሆን የአገልግሎት ግሱ በንጽጽሩ ውስጥ ተደግሟል።
- source_word: τῷ κυρίῳ
  choice: ለጌታ
  rationale: κύριος እዚህ የመለኮታዊውን ጌታ ያመለክታል፤ «ጌታ» የክርስቶስን ማዕረግ ጠብቆ ከምድራዊ ጌቶች ይለየዋል።
- source_word: ἀνθρώποις
  choice: ለሰዎች
  rationale: ἄνθρωποι በዚህ ቦታ ከጌታ ጋር በንጽጽር የቆሙትን ሰብአዊ ፍጡራን በአጠቃላይ ያመለክታል፤ «ሰዎች» ይህን ትርጉም በዘመናዊ አማርኛ በተፈጥሮ ያስተላልፋል።
theological_decisions:
- issue: κύριοςን ከሰብአዊ ጌቶች በተቃርኖ መተርጎም
  choice: ጌታ
  alternative: አለቃ
  rationale: ጥቅሱ አገልግሎቱ በመጨረሻ ለመለኮታዊው ጌታ እንደሚቀርብ ያሳያል። «ጌታ» ክርስቶሳዊውን ማዕረግ ይጠብቃል፤ «አለቃ» ግን ከዐውዱ ምድራዊ ጌቶች ጋር ሊያደበላልቅ ይችላል።
- issue: δουλεύοντες የባርነት ስሜትን ምን ያህል በግልጽ ማሳየት እንዳለበት
  choice: እያገለገላችሁ
  alternative: እንደ ባሪያዎች እያገለገላችሁ
  rationale: የተቀባዮቹ የባርነት ሁኔታ በቀደመው ቁጥር ግልጽ ነው። በዚህ ሐረግ የአገልግሎቱ በጎ አመለካከት ትኩረት ስለሆነ፣ ተፈጥሯዊው ግስ በቂ ሲሆን የታሪካዊውን ሁኔታ አይክድም።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ተሳቢ አገባብ በአማርኛ ግልጽ የትእዛዝ አገባብ ተተርጉሟል፤ «ለሰዎች» የሚለው ἀνθρώποιςን ያለ ጾታዊ ጠባብነት በትክክል ያስተላልፋል።
