base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/016.yaml
  text: In all circumstances[a], taking up the shield of faith[c][b], with which you will be able to extinguish all the flaming arrows of the evil one.
translation:
  language: am
  text: በሁሉም ሁኔታ የእምነትን ጋሻ አንሡ፤ በእርሱም የክፉውን[a] ሁሉንም በእሳት የተቀጣጠሉ ፍላጻዎች[b] ማጥፋት ትችላላችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የክፋትን”፤ የግሪኩ ቃል ክፋትን በአጠቃላይ ሊያመለክት ይችላል፣ የጦርነቱ አውድ ግን “ክፉው” የሚለውን ግለሰብን የሚያመለክት ትርጉም ይደግፋል።
    reason: alternative_reading
  - marker: b
    text: “ፍላጻዎች” የተባለው የግሪኩ ቃል በአጠቃላይ የሚወረወሩ የጦር መሣሪያዎችን ሊያመለክት ይችላል። ባህላዊ አተረጓጎም፣ “የእሳት ፍላጻዎች።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πᾶσιν
  choice: በሁሉም ሁኔታ
  rationale: በጦር ዕቃዎች ዝርዝር አውድ ውስጥ ሐረጉ ተውሳካዊ ሆኖ ‘በእያንዳንዱ ሁኔታ’ የሚለውን ሐሳብ ይሰጣል።
- source_word: ἀναλαβόντες
  choice: አንሡ
  rationale: የግሪኩ አንቀጸ ግስ ቀደም ካለው የማሳሰቢያ ቅደም ተከተል ጋር የተያያዘ ተጓዳኝ ተግባርን ያሳያል፤ በአማርኛ ቀጥተኛ ትእዛዝ ተፈጥሯዊ ነው።
- source_word: θυρεὸν τῆς πίστεως
  choice: የእምነትን ጋሻ
  rationale: θυρεός ትልቅ መከላከያ ጋሻን ያመለክታል፤ ጽሑፉ መጠኑን ሳያጎላ ‘ጋሻ’ በማለት የጦርነቱን ምስል በግልጽ ያቆያል። πίστις እዚህ በእግዚአብሔር ላይ ያለን እምነት የሚያመለክት ሆኖ ‘እምነት’ ተብሏል።
- source_word: ἐν ᾧ
  choice: በእርሱም
  rationale: ተውላጠ ስሙ ወደ ጋሻው ይመለሳል፤ መሣሪያዊውን ‘በእርሱ’ ትርጉም በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: δυνήσεσθε
  choice: ማጥፋት ትችላላችሁ
  rationale: የወደፊት ችሎታን የሚገልጸውን ግስ በግልጽና በዘመናዊ አማርኛ ያስተላልፋል።
- source_word: βέλη
  choice: ፍላጻዎች
  rationale: ቃሉ በአጠቃላይ ተወርዋሪ የጦር መሣሪያዎችን ሊያመለክት ቢችልም፣ ‘ፍላጻዎች’ ከሚነደው የጦርነት ምስል ጋር ግልጽና ተፈጥሯዊ ነው።
- source_word: τοῦ πονηροῦ
  choice: የክፉውን
  rationale: ባለ አመልካቹ ነጠላ ቅርጽና የመንፈሳዊ ጦርነት አውዱ ግላዊውን ‘ክፉው’ ንባብ ይደግፋሉ፤ ረቂቁ ‘ክፋት’ ንባብ በማስታወሻ ተጠብቋል።
- source_word: πεπυρωμένα
  choice: የሚነዱ
  rationale: ፍላጻዎቹ በእሳት የተያዙ መሆናቸውን በተፈጥሯዊና ሕያው አማርኛ ይገልጻል።
- source_word: σβέσαι
  choice: ማጥፋት
  rationale: እሳቱን ማብረድ ወይም ማጥፋት የሚለውን ምስል ግልጽ በሆነ ዘመናዊ ቃል ያቀርባል።
theological_decisions:
- issue: የτοῦ πονηροῦ ትርጉም
  choice: ክፉው
  alternative: ክፋት
  rationale: የጠላት ጥቃትን የሚያሳየው የመንፈሳዊ ጦርነት አውድ ግላዊውን ንባብ ይበልጥ ይደግፋል፤ ሆኖም የግሪኩ ቅርጽ ረቂቅ ‘ክፋት’ ተብሎም ሊነበብ ስለሚችል አማራጩ በማስታወሻ ተቀምጧል።
- issue: የπίστις ትርጉም
