  rationale: በዚህ ምሳሌ የአማኙን መከላከያ በመግለጽ ‘እምነት’ በጣም ተስማሚና የተለመደ ነው፤ ቃሉ በሌሎች አውዶች ‘መታመን’ ወይም ‘ታማኝነት’ ሊል ይችላል።
