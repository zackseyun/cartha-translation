  yaml_path: translation/nt/ephesians/006/018.yaml
  text: with every prayer and petition, praying at all times in the Spirit, and for this very thing staying alert with all perseverance in petition for all the saints,
translation:
  language: am
  text: በማንኛውም ጸሎትና ልመና፣ በመንፈስ[a] ሁልጊዜ እየጸለያችሁ፣ ለዚህም ስለ ቅዱሳን[b] ሁሉ በሙሉ ጽናትና ልመና ንቁ።[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በመንፈስ።” የግሪኩ አገላለጽ በአጠቃላይ “በመንፈስ” ተብሎ ሊነበብ ይችላል፤ በዐውዱ ግን መንፈስ ቅዱስን የሚያመለክት መሆኑ ይበልጥ ይታያል።
    reason: alternative_reading
  - marker: b
    text: እዚህ “ቅዱሳን” ማለት የእግዚአብሔር ቅዱስ ሕዝብ ሁሉ፣ ይኸውም አማኞች ሁሉ ማለት ነው።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “በሙሉ ጽናት በልመና ንቁ።”
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ πάσης προσευχῆς καὶ δεήσεως
  choice: በማንኛውም ጸሎትና ልመና
  rationale: διά ከጄኔቲቭ ጋር የመንገድን ወይም የመሣሪያነትን ሐሳብ ያሳያል። “ጸሎት” አጠቃላይ ቃሉን፣ “ልመና” ደግሞ የተወሰነ ጥያቄን ያስተላልፋል።
- source_word: προσευχόμενοι
  choice: እየጸለያችሁ
  rationale: የአሁን ጊዜ አሳታፊ ግስንና ከቀደመው ትእዛዝ ጋር ያለውን ቀጣይነት ይጠብቃል።
- source_word: ἐν παντὶ καιρῷ
  choice: ሁልጊዜ
  rationale: παντί ያለውን አጠቃላይ ኃይል በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐν πνεύματι
  choice: በመንፈስ
  rationale: በኤፌሶን አውድ በይበልጥ የሚጠቁመው መንፈስ ቅዱስን ነው፤ የግሪኩ ቃል ግን በሰው መንፈስ የሚለውንም ንባብ ሊፈቅድ ስለሚችል አማራጩ በማስታወሻ ቀርቧል።
- source_word: εἰς αὐτό
  choice: ለዚሁም ዓላማ
  rationale: የሐረጉን ዓላማ እና αὐτό ያለውን አጽንዖት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἀγρυπνοῦντες
  choice: ንቁ
  rationale: ቃሉ እንቅልፍ የለሽ ንቃትንና ጥንቃቄን ያመለክታል፤ “ንቁ” ይህን በግልጽ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἐν πάσῃ προσκαρτερήσει καὶ δεήσει
  choice: በሙሉ ጽናት እየለመናችሁ
  rationale: προσκαρτέρησις ያለማቋረጥ መጽናትን ያሳያል፤ አገላለጹ ጽናቱ በልመና ውስጥ እንደሚገለጥ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: περὶ πάντων τῶν ἁγίων
  choice: ስለ ቅዱሳን ሁሉ
  rationale: በጳውሎስ አጠቃቀም “ቅዱሳን” የእግዚአብሔርን ቅዱስ ሕዝብ፣ ማለትም አማኞችን ሁሉ ያመለክታል።
theological_decisions:
- issue: የπνεύματι ተመላካች
  choice: መንፈስ ቅዱስ (“በመንፈስ”)
  alternative: የሰው መንፈስ (“በመንፈሳችሁ”)
  rationale: የኤፌሶን አውድ፣ በተለይም በቁጥር 17 ያለው “የመንፈስ ሰይፍ”፣ መንፈስ ቅዱስን የሚያመለክት ንባብ እንዲበልጥ ያደርጋል። ሆኖም ግሪኩ ያለ አርቲክል ስለሆነ አማራጩ አልተደበቀም።
- issue: የἅγιοι ትርጉም
  choice: አማኞች ሁሉ (“ቅዱሳን ሁሉ”)
  alternative: በኋለኛው የቤተ ክርስቲያን አጠቃቀም የተለዩ ቅዱሳን ብቻ
  rationale: በጳውሎስ ደብዳቤዎች ἅγιοι የእግዚአብሔርን የተቀደሰ ማኅበረሰብ በአጠቃላይ ይጠራል፤ በኋላ የተገደበውን ትርጉም አይጭንም።
- issue: የἐν πάσῃ προσκαρτερήσει καὶ δεήσει አወቃቀር
  choice: ጽናት ልመናውን እንደሚገልጥ (“በሙሉ ጽናት እየለመናችሁ”)
  alternative: ሁለት ትይዩ ነገሮች (“በሙሉ ጽናትና ልመና”)
  rationale: ሐረጉ ጽናትንና ልመናን በቅርብ ያገናኛል፤ የተመረጠው ንባብ በልመና መጽናትን ተፈጥሯዊ አድርጎ ያቀርባል፣ ትይዩ ንባቡም በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ አሳታፊ ግሶች ፍሰት “እየጸለያችሁ” እና “እየለመናችሁ” በሚሉ ቅርጾች ተጠብቋል፤ “ንቁ” ደግሞ ከቀደመው የትእዛዝ አውድ ጋር ተፈጥሯዊ ግንኙነት ይፈጥራል።
