    text: «በጌታ» የሚለው ሐረግ «የጌታ እንደሆናችሁ» ወይም «ከጌታ ጋር ባላችሁ ኅብረት ውስጥ» ማለት ሊሆን ይችላል። መታዘዙ የሚፈጸምበትን መስክ ወይም ሁኔታ ሊገልጽ ይችላል፤ እንዲሁም ይህ መታዘዝ ለጌታ ታማኝ መሆን በሚያስቀምጠው ወሰን ውስጥ መሆኑን ሊያመለክት ይችላል።
