  alternative: «በጌታ ያላችሁ ልጆች» ወይም «በጌታ እንደሚገባ ታዘዙ»
  rationale: የግሪኩ አቀማመጥ ሐረጉን ከትእዛዙ ጋር በተፈጥሮ ያያይዘዋል፤ ሆኖም የልጆቹን በጌታ መሆን፣ የመታዘዙን ሁኔታና መስክ፣ ወይም ለጌታ ታማኝ በመሆን የሚኖረውን ወሰን ማመልከቱ በግልጽ አልተወሰነም።
