  rationale: በዚህ ሥነ ምግባራዊ አውድ ተገቢና ቀና መሆኑን በዘመናዊና ግልጽ አማርኛ ያሳያል።
theological_decisions:
- issue: የ«ἐν κυρίῳ» ሐረግ ወሰንና አገባብ
