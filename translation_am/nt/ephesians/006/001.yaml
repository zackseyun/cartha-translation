- source_word: γονεῦσιν
  choice: ወላጆቻችሁን
  rationale: አባትንና እናትን በአንድነት የሚያመለክተው ትክክለኛና የተለመደ የአማርኛ ቃል ነው።
- source_word: ἐν κυρίῳ
  choice: በጌታ
  rationale: አጭሩን የጳውሎስ አገላለጽ ይጠብቃል፤ በአማርኛም መታዘዙ ከጌታ ጋር ባለ ግንኙነት ውስጥ መሆኑን ሳይወስን ሊያመለክት ይችላል።
- source_word: δίκαιον
