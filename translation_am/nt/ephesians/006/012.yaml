  rationale: በኤፌሶን መልእክት የሚደጋገመውን ሰማያዊ የመኖሪያ ወይም የእንቅስቃሴ ክልል ይገልጻል፤ ነጠላ ወይም ብዙ ቁጥር በግሪኩ ገላጭ ቃል ላይ ግልጽ ስላልሆነ አማርኛው ተፈጥሯዊ ቅርጽ ተመርጧል።
