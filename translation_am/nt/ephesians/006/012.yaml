- source_word: ἐξουσίας
  choice: ሥልጣናት
  rationale: ቃሉ ሥልጣን ያላቸውን ኃይሎች ያመለክታል፤ ከ«ገዢዎች» ጋር ያለውን ልዩነትም ያቆያል።
- source_word: κοσμοκράτορας τοῦ σκότους τούτου
