  rationale: ገላጩ ቃል በስምነት ተጠቅሞ መንፈሳዊ ፍጥረታትን ወይም ኃይሎችን ያመለክታል፤ «ኃይሎች» ይህን በግልጽ ያስተላልፋል።
- source_word: ἐν τοῖς ἐπουρανίοις
