  rationale: κοσμοκράτορας የ«ዓለም ገዢዎች»ን ጥምር ሐሳብ ይይዛል፤ ይህ አተረጓጎም ያንን ቅርጽ እየጠበቀ τοῦ σκότους τούτουን ከእነርሱ ጋር ያያይዛል።
- source_word: τὰ πνευματικὰ τῆς πονηρίας
