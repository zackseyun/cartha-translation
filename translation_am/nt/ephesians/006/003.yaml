lexical_decisions:
- source_word: ἵνα
  choice: እንዲ… ነው
  rationale: የዓላማን ወይም የውጤትን ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል፤ ከቀደመው ቁጥር ጋር የተያያዘውን የተስፋ ቃል ያስቀጥላል።
- source_word: εὖ σοι γένηται
  choice: ነገር ሁሉ እንዲሳካልህ
  rationale: የግሪኩን ‘ለአንተ መልካም እንዲሆን’ የሚለውን ፈሊጣዊ ትርጉም በግልጽና ተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል።
- source_word: καὶ
  choice: እና
  rationale: ሁለቱን የተስፋ ውጤቶች በቀላሉ ያገናኛል።
- source_word: ἔσῃ μακροχρόνιος
  choice: ረጅም ዘመን እንድትኖር
  rationale: ቃል በቃል ‘ረጅም ዕድሜ ያለህ እንድትሆን’ የሚለውን ሐሳብ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐπὶ τῆς γῆς
  choice: በምድር ላይ
  rationale: ግሪኩ የተወሰነ የቃል ኪዳን ምድርን የሚጠቁም ባለቤትነት አገላለጽ ስለሌለው፣ ሰፊውን ‘በምድር ላይ’ የሚለውን ንባብ ይጠብቃል።
theological_decisions:
- issue: ἐπὶ τῆς γῆς ከአምስተኛው ትእዛዝ የተስፋ ቃል ጋር ያለው ግንኙነት
  choice: በምድር ላይ
  alternative: በአገሩ ውስጥ
  rationale: ጳውሎስ እዚህ የተወሰነውን የቃል ኪዳን አገር የሚያመለክተውን ሙሉ የብሉይ ኪዳን አገላለጽ አልጠቀሰም። ስለዚህ ዋናው ጽሑፍ የግሪኩን ሰፊ አገላለጽ ይከተላል፤ የአሥርቱ ትእዛዛት ዳራ ግን በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። “ነገር ሁሉ እንዲሳካልህ” የሚለው አገላለጽ ፈሊጣዊውን εὖ σοι γένηται በተፈጥሯዊ ቋንቋ ያቀርባል፤ የግሪኩ ሰፊ የ‘ምድር’ ትርጉም በዋናው ጽሑፍ ተጠብቋል።
