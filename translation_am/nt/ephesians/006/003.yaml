  rationale: The revision removes the unsupported “ነገር ሁሉ,” renders the Greek idiom directly and naturally, and retains the dependent purpose/result form of ἵνα. It preserves “በምድር ላይ” in the main text and keeps the Decalogue-related land alternative in a clarified footnote.
