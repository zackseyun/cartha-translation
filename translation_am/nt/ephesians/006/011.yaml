  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የእግዚአብሔርን የተሟላ ትጥቅ።” የግሪኩ ቃል የወታደርን ሙሉ የጦር መሣሪያና መከላከያ ያመለክታል።
