  rationale: «በ» በአማርኛ መሣሪያን፣ ምክንያትን ወይም ሁኔታዊ ክልልን ሊያመለክት ስለሚችል የግሪኩን እውነተኛ ድርብ አቅጣጫ ሳይዘጋ ያቆያል።
