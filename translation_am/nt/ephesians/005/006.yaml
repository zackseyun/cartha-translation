  text: Let no one deceive you with empty words[a], for because of these things the wrath of God comes upon the sons of disobedience.
translation:
  language: am
  text: ማንም በባዶ ቃላት እንዳያታልላችሁ፤ በእነዚህ ነገሮች ምክንያት የእግዚአብሔር ቁጣ በየአለመታዘዝ ልጆች[a] ላይ ይመጣልና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የአለመታዘዝ ወንድ ልጆች”። ይህ በአለመታዘዝ የሚታወቁ ሰዎችን የሚያመለክት አገላለጽ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδεὶς … ἀπατάτω
  choice: ማንም … እንዳያታልላችሁ
  rationale: የግሪኩን የክልከላ ትእዛዝ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል፤ ἀπατάω በዚህ ዐውድ ‘ማታለል’ ማለት ነው።
- source_word: κενοῖς λόγοις
  choice: በባዶ ቃላት
  rationale: የ‘ባዶነትን’ ዘይቤ ሳይፈታ ይጠብቃል፤ ቃላቱ እውነተኛ ይዘትና መሠረት የሌላቸው ንግግሮችን ያመለክታሉ።
- source_word: διὰ ταῦτα
  choice: በእነዚህ ነገሮች ምክንያት
  rationale: διά ከአኩዛቲቭ ጋር ያለውን ምክንያታዊ ትርጉም ግልጽ ያደርጋል፤ መጠቀሱን ወደ አንድ ነገር አያጠብብም።
- source_word: ἔρχεται
  choice: ይመጣል
  rationale: የግሪኩን የአሁን ጊዜ አገላለጽ ይጠብቃል፤ ጊዜውን ‘እየመጣ ነው’ ወይም ‘ይመጣ ዘንድ ነው’ ብሎ አይወስንም።
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: የእግዚአብሔር ቁጣ
  rationale: ὀργήን በቀጥታ ‘ቁጣ’ ብሎ በመተርጎም ወደ አጠቃላይ ‘ፍርድ’ አያለዝበውም።
- source_word: ἐπὶ
  choice: ላይ
  rationale: ቁጣው በተጠቀሱት ሰዎች ላይ መምጣቱን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τοὺς υἱοὺς τῆς ἀπειθείας
  choice: በአለመታዘዝ ልጆች
  rationale: የግሪኩን ሴማዊ ዘይቤ ይጠብቃል። በአማርኛ ‘ልጆች’ በፆታ ያልተወሰነ ተፈጥሯዊ የብዙ ቁጥር ቃል ሲሆን፣ ቃል በቃል ያለው ‘ወንድ ልጆች’ በማስታወሻ ተገልጿል።
- source_word: ἀπειθείας
  choice: አለመታዘዝ
  rationale: በዙሪያው ባለው ሥነ ምግባራዊ ዐውድ የመታዘዝ እምቢተኝነትን በግልጽ ያስተላልፋል፤ ‘አለማመን’ የሚለውን ትርጉም ብቻ አይጭንም።
theological_decisions:
- issue: የመለኮታዊ ቁጣ አገላለጽ
  choice: የእግዚአብሔር ቁጣ
  alternative: የእግዚአብሔር ፍርድ
  rationale: ምንጩ ὀργή (‘ቁጣ’) ይላል፤ ይህን ወደ ሰፊው ‘ፍርድ’ መቀየር የጽሑፉን ሥነ መለኮታዊ ክብደት ያለዝበዋል።
- issue: τοὺς υἱοὺς τῆς ἀπειθείας የሚለው ዘይቤ
  choice: በአለመታዘዝ ልጆች
  alternative: የማይታዘዙ ሰዎች
  rationale: ዋናው ጽሑፍ የ‘ልጆች’ን ዘይቤ ይጠብቃል፤ የባሕርይ መግለጫ መሆኑ በማስታወሻ ተብራርቷል። ይህም ዘይቤውን ሳያጠፋ ትርጉሙን ያሳያል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የ‘ባዶ ቃላት’፣ ‘ቁጣ’ እና ‘ልጆች’ ዘይቤዎች በተቻለ መጠን ተጠብቀዋል፤ የግሪኩ የፆታ ቅርጽ በማስታወሻ ተገልጿል።
