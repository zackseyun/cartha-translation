  text: For this reason[a], do not become foolish, but understand what the will of the Lord is.
translation:
  language: am
  text: ስለዚህ[a] ሞኞች አትሁኑ፤ ይልቁንም የጌታ ፈቃድ ምን እንደሆነ ተረዱ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በዚህ ምክንያት ሞኞች አትሁኑ።” የግሪኩ ግስ በሁኔታዊ መልኩ “አትሁኑ” ተብሎ ሊተረጎም ቢችልም፣ ወደዚህ ሁኔታ መግባትንም ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ስለዚህ
  rationale: ወደ ቀደመው ምክር የሚያመለክተውን ምክንያታዊና ድምዳሜያዊ ግንኙነት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: μὴ γίνεσθε
  choice: አትሁኑ
  rationale: በዚህ አውድ የተከለከለውን ሁኔታ በተፈጥሯዊ የአማርኛ ትእዛዝ አገላለጽ ያቀርባል፤ γίνεσθε ያለውን ‘መሆን/መሆን መጀመር’ ልዩነት የግርጌ ማስታወሻው ያብራራል።
- source_word: ἄφρονες
  choice: ሞኞች
  rationale: የማስተዋልና የተግባራዊ አእምሮ እጥረትን ያመለክታል፤ ከሚከተለው ‘ተረዱ’ ጋርም ግልጽ ተቃርኖ ይፈጥራል።
- source_word: ἀλλὰ
  choice: ይልቁንም
  rationale: ከአሉታዊው ትእዛዝ ወደ አዎንታዊው ትእዛዝ ያለውን ጠንካራ ንጽጽር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: συνίετε
  choice: ተረዱ
  rationale: የማስተዋል፣ የመገንዘብና በአእምሮ የመያዝን ትርጉም ቀጥተኛና ግልጽ በሆነ ቃል ያቀርባል።
- source_word: τί τὸ θέλημα
  choice: ፈቃድ ምን እንደሆነ
  rationale: τί የሚያስገባውን የይዘት ጥያቄ በአማርኛ ሰዋስው ተፈጥሯዊ በሆነ ተዘዋዋሪ ጥያቄ ያስተላልፋል።
- source_word: τὸ θέλημα
  choice: ፈቃድ
  rationale: θέλημα የሚያመለክተውን ፈቃድ፣ ዓላማ ወይም እንዲደረግ የሚፈለገውን ነገር በመደበኛው የአማርኛ መጽሐፍ ቅዱሳዊ ቃል ይገልጻል።
- source_word: τοῦ κυρίου
  choice: የጌታ
  rationale: የግሪኩን የባለቤትነት ግንኙነት በቀጥታ ይጠብቃል፤ በጥቅሱ ያልተገለጸውን ስም አይጨምርም።
theological_decisions:
- issue: የ‘ጌታ’ (τοῦ κυρίου) ማጣቀሻ
  choice: በዋናው ጽሑፍ ‘ጌታ’ ብቻ ተብሎ ተተርጉሟል።
  alternative: ‘ጌታ ኢየሱስ’ ወይም ‘እግዚአብሔር’ ብሎ መግለጽ።
  rationale: የኤፌሶን አውድ ‘ጌታ’ን ብዙ ጊዜ ለኢየሱስ ቢጠቀምም፣ ይህ ጥቅስ κυρίου ብቻ ይላል። ትርጉሙ ግሪኩ ያልገለጸውን ማንነት በስም አይወስንም።
- issue: የμὴ γίνεσθε ክልከላ ኃይል
  choice: በተፈጥሯዊ አማርኛ ‘አትሁኑ’ ተብሎ ተተርጉሞ፣ የ‘አትሁኑ/አትሆኑ’ አማራጭ በማስታወሻ ተገልጿል።
  alternative: ‘ሞኞች አትሆኑ’ ወይም ሁኔታዊ ብቻ የሆነ አገላለጽ።
  rationale: γίνομαι ወደ አንድ ሁኔታ መግባትንም ሊያመለክት ይችላል፤ ዋናው ጽሑፍ ግን የአማርኛን ተፈጥሯዊነት ይጠብቃል፣ ማስታወሻውም የግሪኩን ልዩነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ሴሚኮሎኑ የሁለቱን ትእዛዞች ጠንካራ ንጽጽር ያሳያል።
