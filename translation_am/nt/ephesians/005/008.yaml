  text: For you were once darkness[a], but now you are light in the Lord. Walk as children of light,
translation:
  language: am
  text: እናንተ ቀድሞ ጨለማ ነበራችሁና፤ አሁን ግን በጌታ ብርሃን ናችሁ። እንደ ብርሃን ልጆች ተመላለሱ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም ትርጉሙን ይበልጥ በግልጽ ለመግለጽ፣ «እንደ ብርሃን ልጆች ኑሩ።» ግሪኩ «ተመላለሱ» ይላል፤ ይህም ጳውሎስ ስለ ሰው አኗኗር ሲናገር በተደጋጋሚ የሚጠቀምበት ዘይቤ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦτε γάρ ποτε
  choice: ቀድሞ ጨለማ ነበራችሁና
  rationale: ἦτε ያለፈ ሁኔታን፣ ποτε ደግሞ የቀድሞውን ጊዜ ያመለክታሉ። γάρ ከቀደመው ሐሳብ ጋር ያለውን ምክንያታዊ ትስስር በአማርኛው «-ና» ይጠብቃል።
- source_word: σκότος
  choice: ጨለማ
  rationale: ግሪኩ «በጨለማ ውስጥ» ሳይሆን በቀጥታ «ጨለማ» ይላል፤ ይህን ጠንካራ የማንነት ዘይቤ ጠብቋል።
- source_word: νῦν δὲ
  choice: አሁን ግን
  rationale: የቀድሞውንና የአሁኑን ሁኔታ በግልጽ ሁኔታ ያነጻጽራል።
- source_word: φῶς ἐν κυρίῳ
  choice: በጌታ ብርሃን
  rationale: φῶς እንደ ስም በቀጥታ «ብርሃን» ተብሎ ተጠብቋል፤ ἐν κυρίῳ ደግሞ አዲሱ ማንነታቸው ከጌታ ጋር ባላቸው ግንኙነትና ኅብረት ውስጥ መሆኑን «በጌታ» በማለት ያሳያል።
- source_word: ὡς τέκνα φωτός
  choice: እንደ ብርሃን ልጆች
  rationale: ὡς የማንነታቸውን የሚመጥን አኗኗር ያመለክታል፤ τέκνα ሁለቱንም ፆታዎች የሚያካትት «ልጆች» ነው። የ«ብርሃን ልጆች» ዘይቤም ተጠብቋል።
- source_word: περιπατεῖτε
  choice: ተመላለሱ
  rationale: የአሁን ጊዜ ትእዛዙንና በጳውሎስ ዘንድ ለአኗኗር የሚያገለግለውን «መመላለስ» የተባለ ዘይቤ ይጠብቃል።
theological_decisions:
- issue: «ጨለማ ነበራችሁ፤ ... ብርሃን ናችሁ» የሚለው የማንነት ዘይቤ
  choice: ግሪኩ እንዳለው «ጨለማ» እና «ብርሃን» የተባሉትን ጠንካራ ዘይቤዎች ማቆየት
  alternative: «በጨለማ ውስጥ ነበራችሁ፤ አሁን ግን በብርሃን ውስጥ ናችሁ»
  rationale: የግሪኩ ሐረግ መገኛን ብቻ ሳይሆን የሁኔታና የማንነት ለውጥን በጠንካራ ዘይቤ ይገልጻል።
- issue: κύριος አተረጓጎም
  choice: ጌታ
  alternative: ባለቤት
  rationale: «ጌታ» የአዲስ ኪዳንን ሃይማኖታዊ ድምፀት ሳያጠብ በተፈጥሮ የሚያስተላልፍ መደበኛ የአማርኛ አተረጓጎም ነው።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። «ተመላለሱ» መጽሐፍ ቅዱሳዊ ድምፀት ቢኖረውም የግሪኩን ዘይቤ በትክክል ይጠብቃል፤ ግልጽ አማራጩ በግርጌ ማስታወሻ ቀርቧል።
