review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the two imperatives and the general contrast, but አትተባበሩ more commonly denotes cooperation/collaboration rather than sharing in or participating in the works. The construction ከጨለማ ፍሬ ቢስ ሥራዎች is also grammatically and idiomatically deficient: the Greek genitive modifies “works,” not the participatory relationship.'
  naturalness: Replacing the opening with በ... ሥራዎች አትካፈሉ produces natural modern standard Amharic. ገልጧቸው is a direct, idiomatic imperative that retains the contextual sense of exposure without excluding the corrective force of ἐλέγχετε.
  terminology: ፍሬ ቢስ is retained as an accessible rendering of ἀκάρποις. የጨለማ ሥራዎች correctly expresses the source relationship. The note for ἐλέγχετε preserves “reprove/rebuke” as legitimate alternatives without doctrinal expansion.
  issues:
  - severity: medium
    issue: አትተባበሩ is not the most faithful equivalent for συγκοινωνεῖτε.
    rationale: It can suggest cooperating with others rather than jointly sharing in the specified deeds. በ... አትካፈሉ more directly conveys participation in the works.
  - severity: medium
    issue: The phrase ከጨለማ ፍሬ ቢስ ሥራዎች is unnatural and obscures the syntactic link between darkness and works.
    rationale: The source says “the unfruitful works of darkness.” ፍሬ ቢስ በሆኑ የጨለማ ሥራዎች clearly and naturally modifies ሥራዎች.
  - severity: low
    issue: The first footnote’s alternatives are awkwardly phrased and do not consistently retain the prohibition’s relationship to the works.
    rationale: Rewording them as alternatives for participation/sharing produces clearer, idiomatic Amharic.
