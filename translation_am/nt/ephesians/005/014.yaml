base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/014.yaml
  text: For everything that is made visible is light[a]. Therefore it says, “Wake up, sleeper, and rise from the dead[c][b], and Messiah will shine on you.”
translation:
  language: am
  text: 'የሚገለጥ ሁሉ ብርሃን ነው።[a] ስለዚህም እንዲህ ይላል፦[b]


    “አንተ የተኛህ፣ ንቃ፤

    ከሙታንም ተነሣ፤

    መሲሑም[c] በአንተ ላይ ያበራል።”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የሚገለጥ ሁሉ” የሚለው የግሪክ ሐረግ “ብርሃን የሚያጋልጠው ሁሉ” ወይም “የሚታይ ሁሉ” ተብሎም ሊረዳ ይችላል።
    reason: lexical_alternative
  - marker: b
    text: የዚህ ጥቅስ ትክክለኛ ምንጭ አይታወቅም፤ በተለይ ኢሳይያስ 60፥1ን የመሳሰሉ የመጽሐፍ ቅዱስ ሐሳቦችን የሚያስተጋባ ወይም የጥንት ክርስቲያናዊ መዝሙር ሊሆን ይችላል።
    reason: cross_reference
  - marker: c
    text: በግሪክ “ክርስቶስ” የሚለው ቃል ነው፤ እዚህ እንደ ማዕረግ ስለቀረበ “መሲሑ” ተብሎ ተተርጉሟል። ባህላዊው አተረጓጎም “ክርስቶስ” ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶν γὰρ τὸ φανερούμενον φῶς ἐστιν
  choice: ብርሃን የገለጠው ሁሉ ይታያል
  rationale: የግሪኩ ሐረግ ሰዋሰዋዊ አሻሚነት አለው፤ φανερούμενον መገለጥን ወይም መታየትን ሊያመለክት ይችላል። ከቁጥር 13 ጋር ያለውን ቀጥተኛ የሐሳብ ፍሰት በመጠበቅ ‘ብርሃን የገለጠው ሁሉ ይታያል’ ተብሎ ተተርጉሟል።
- source_word: διὸ λέγει
  choice: ስለዚህም … ይላል
  rationale: λέγει የሚለው ግስ ግልጽ ባለቤት ስለሌለው፣ ምንጩን ቅዱሳት መጻሕፍት፣ እግዚአብሔር ወይም መዝሙር ብሎ ሳይወስን የግሪኩን ግልጽነት ማጣት ይጠብቃል።
- source_word: Ἔγειρε, ὁ καθεύδων
  choice: አንተ የተኛህ፣ ንቃ
  rationale: ቀጥተኛውን የጥሪ ኃይልና የእንቅልፍ ምስል በተፈጥሯዊ ዘመናዊ አማርኛ ያቆያል።
- source_word: ἀνάστα ἐκ τῶν νεκρῶν
  choice: ከሙታንም ተነሣ
  rationale: የመነሣትን ቀጥተኛና ትንሣኤያዊ ድምፅ ሳይፈታ ይጠብቃል።
- source_word: ἐπιφαύσει σοι
  choice: ያበራልሃል
  rationale: ‘በአንተ ላይ ያበራል’ የሚለውን ምስል በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὁ Χριστός
  choice: መሲሑ
  rationale: ὁ Χριστός በዚህ ስፍራ እንደ ማዕረግ ስለሚሠራ፣ ትርጉሙን የሚያሳየው ‘መሲሑ’ ተመርጧል።
theological_decisions:
- issue: የπᾶν γὰρ τὸ φανερούμενον φῶς ἐστιν አተረጓጎም
  choice: ብርሃን የገለጠው ሁሉ ይታያል
  alternative: የተገለጠው ሁሉ ብርሃን ነው
  rationale: የግሪኩ ሐረግ ሁለቱንም አተረጓጎሞች ሊሸከም ይችላል። ዋናው ጽሑፍ ከቁጥር 13 ጋር የሚገናኘውን ንባብ ይከተላል፤ ሌላው በማስታወሻ ተጠብቋል።
- issue: የጥቅሱ ምንጭ
  choice: ግልጽ ባለቤት ሳይጨመር ‘ይላል’ ተብሎ ቀረበ
  alternative: ‘መጽሐፍ ይላል’ ወይም ‘እግዚአብሔር ይላል’
  rationale: ግሪኩ ምንጩን አይገልጽም፤ ስለዚህ የቅዱሳት መጻሕፍት ድምፅ ወይም የጥንት ክርስቲያናዊ መዝሙር መሆኑን ትርጉሙ አይወስንም።
- issue: የΧριστός አተረጓጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: ቃሉ ከὁ አመልካች ጋር በማዕረግነት ቀርቧል፤ ‘መሲሑ’ የ‘ተቀባው’ን ማዕረግ ያስተላልፋል።
