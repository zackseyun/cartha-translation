  - severity: medium
    issue: The lexical-alternative footnote is attached to the Messiah rather than to the opening clause, and its quoted base text does not match the intended source sense.
    rationale: The ambiguity of φανερούμενον belongs at “የሚገለጥ ሁሉ,” not at ὁ Χριστός. A separate note can preserve “ክርስቶስ” as the traditional rendering of Χριστός.
  - severity: low
    issue: The quotation-source note is anchored after “ከሙታን” rather than at the introduced quotation.
    rationale: Its subject is the origin of the entire citation, so it is clearer to anchor it immediately after “እንዲህ ይላል.”}],
  - severity: low
    issue: “ያበራልሃል” is less explicit than the Greek image of shining upon someone.
    rationale: “በአንተ ላይ ያበራል” preserves ἐπιφαύσει σοι directly and remains idiomatic.
