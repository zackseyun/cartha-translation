  source_fidelity: The translation accurately represents τὸ μυστήριον τοῦτο μέγα ἐστίν with «ይህ ምሥጢር ታላቅ ነው» and preserves the mild δέ contrast with «ግን». «ስለ መሲሑና ስለ ቤተ ክርስቲያን እናገራለሁ» naturally conveys λέγω εἰς Χριστὸν καὶ εἰς τὴν ἐκκλησίαν without narrowing the referent of «this mystery». The repeated «ስለ» appropriately reflects the two Greek prepositional phrases while remaining idiomatic.
