language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τὸ μυστήριον τοῦτο μέγα ἐστίν, ἐγὼ δὲ λέγω εἰς Χριστὸν καὶ εἰς τὴν ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/032.yaml
  text: This mystery is great[c][b][a], but I am speaking with reference to Messiah and the church.
translation:
  language: am
  text: ይህ ምሥጢር ታላቅ ነው[a]፤ እኔ ግን ስለ መሲሑና ስለ ቤተ ክርስቲያን እናገራለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ይህ ምሥጢር ጥልቅ ነው።» ግሪኩ በቀጥታ «ታላቅ» ይላል፤ ቃሉ ጥልቀትን ብቻ ሳይሆን ታላቅነትን ወይም ከፍተኛ አስፈላጊነትንም ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήριον
  choice: ምሥጢር
  rationale: በጳውሎስ አጠቃቀም ቀድሞ ተሰውሮ አሁን የተገለጠውን መለኮታዊ እውነት ሊያመለክት ይችላል፤ «ምሥጢር» ይህን ሥነ መለኮታዊ ክብደት ያለ ማብራሪያ ይጠብቃል።
- source_word: μέγα
  choice: ታላቅ
  rationale: የግሪኩን ቀጥተኛ ትርጉም ይጠብቃል፤ መጠንን፣ ክብደትን ወይም አስፈላጊነትን ሊያመለክት የሚችለውን ስፋት አያጠብም።
- source_word: δὲ
  choice: ግን
  rationale: ከመጀመሪያው አረፍተ ነገር ወደ ጳውሎስ ማብራሪያ ያለውን ለስላሳ ንጽጽርና ሽግግር ያሳያል።
- source_word: λέγω
  choice: እናገራለሁ
  rationale: የአሁን ጊዜውን ግስ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል፤ «ማለቴ ነው» ቢባል ከምንጩ የበለጠ ትርጓሜ ይጨምራል።
- source_word: εἰς
  choice: ስለ
  rationale: ከλέγω ጋር የሚኖረውን ‘በተመለከተ/ስለ’ የሚለውን ማጣቀሻዊ ትርጉም በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Χριστόν
  choice: መሲሑ
  rationale: Χριστός በዚህ ሥነ መለኮታዊ ንግግር ውስጥ እንደ ማዕረግ ይሠራል፤ «መሲሑ» ይህን የተቀባው ንጉሥ ማዕረግ በግልጽ ያቀርባል።
- source_word: ἐκκλησίαν
  choice: ቤተ ክርስቲያን
  rationale: በዚህ የጳውሎስ አጠቃቀም የእግዚአብሔርን ሕዝብ በኅብረት የሚያመለክተው የተለመደና ግልጽ የአማርኛ ቃል ነው።
theological_decisions:
- issue: «ይህ ምሥጢር» የሚያመለክተው ነገር
  choice: ዋናው ጽሑፍ ምሥጢሩ ጋብቻውን፣ ዘፍጥረት 2፥24ን ወይም በመሲሑና በቤተ ክርስቲያን የሚፈጸመውን ምሳሌያዊ ግንኙነት ብቻ ነው ብሎ አይወስንም።
  alternative: ምሥጢሩ በተለይ የባልና ሚስት አንድ ሥጋ መሆንን፣ የዘፍጥረት 2፥24ን ጥቅስ ወይም ጋብቻ ወደ መሲሑና ወደ ቤተ ክርስቲያን የሚያመለክትበትን ምሳሌያዊ ፍጻሜ ያመለክታል።
  rationale: ግሪኩ «ይህ ምሥጢር ታላቅ ነው» ካለ በኋላ ጳውሎስ ንግግሩ መሲሑንና ቤተ ክርስቲያንን እንደሚመለከት ያብራራል። ትርጉሙ ይህን እንቅስቃሴ ሳያጠብ ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። «ስለ መሲሑና ስለ ቤተ ክርስቲያን» የሚለው ድግግሞሽ ሁለቱንም εἰς ያንጸባርቃል፣ በአማርኛም ተፈጥሯዊ ነው።
