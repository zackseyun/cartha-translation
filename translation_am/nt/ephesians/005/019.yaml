- issue: ‘ጌታ’ የሚለው ቃል ማንን እንደሚያመለክት
  choice: ጽሑፉ እንዳለው ‘ለጌታ’ ተብሎ ተጠብቋል።
  alternative: ‘ለጌታ ኢየሱስ’ ብሎ በግልጽ መለየት
