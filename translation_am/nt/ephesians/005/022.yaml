lexical_decisions:
- source_word: Αἱ γυναῖκες
  choice: ሚስቶች ሆይ
  rationale: በቤተሰብና በትዳር አውድ ውስጥ γυνή አጠቃላይ ‘ሴቶች’ ሳይሆን ‘ሚስቶች’ ማለት ነው፤ ‘ሆይ’ ደግሞ ቀጥተኛውን አድራሻ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: ለገዛ ባሎቻችሁ
  rationale: ἀνήρ በዚህ አውድ ‘ባል’ ማለት ነው፤ ἰδίοις የሚለውን ‘ገዛ’ በማለት በግልጽ ተጠብቋል።
- source_word: ὡς
