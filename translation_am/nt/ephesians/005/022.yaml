  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ የሚገባ አማርኛ ተጠቅሟል። ሆን ተብሎ የተጠበቀው ግስ-አልባ ቅርጽ በአማርኛም ከቁጥር 21 ጋር ተያይዞ እንዲነበብ የተደረገ ሲሆን፣ ይህን የምንጩን ሰዋሰዋዊ ጥገኝነት ይጠብቃል።
