- source_word: τῷ κυρίῳ
  choice: ለጌታ
  rationale: κύριος በጳውሎሳዊው አውድ ጌታ ኢየሱስን ያመለክታል፤ የዳቲቭ ቅርጹም ‘ለጌታ’ ተብሎ ቀርቧል።
- source_word: implicit verb from context
  choice: በዋናው ጽሑፍ ግስ አልተጨመረም
  rationale: በSBLGNT የቁጥር 22 ጽሑፍ ግስ የለም፤ አሳቡ በቁጥር 21 ካለው ὑποτασσόμενοι ይቀጥላል። ስለዚህ የምንጩ ሞላ ያልሆነ ሰዋሰዋዊ ቅርጽ ተጠብቋል።
theological_decisions:
- issue: በቁጥር 22 የሌለውን ‘ተገዙ’ የሚለውን ግስ በዋናው ጽሑፍ መጨመር ወይም አለመጨመር
  choice: ግሱን በዋናው ጽሑፍ አለመጨመር፤ ከቁጥር 21 እንደሚገባ በማስታወሻ ማብራራት
  alternative: ሚስቶች ሆይ፣ ለገዛ ባሎቻችሁ ለጌታ እንደምትገዙ ተገዙ።
  rationale: በዚህ ቁጥር የግሪክ ጽሑፍ ግስ በግልጽ አያካትትም፤ አሳቡ ከቀደመው አረፍተ ነገር ይወሰዳል። ግሱን መጨመር አንባቢውን ቢረዳም በዚህ ቁጥር በግልጽ ያልተጻፈውን ያስገባል።
