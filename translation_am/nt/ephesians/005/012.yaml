  text: እነርሱ በስውር ስለሚያደርጓቸው ነገሮች መናገር እንኳ አሳፋሪ ነውና።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በእነርሱ በስውር ስለሚደረጉ ነገሮች።»
    reason: τὰ ... γινόμενα የሚለው ስማዊ አሳታፊ ግስ በተለይ ተግባሮችን/ነገሮችን ያመለክታል፤ ይህ አማራጭ የግሪኩን ተገብሮ አገላለጽ ይጠብቃል።
lexical_decisions:
- source_word: τὰ ... γινόμενα
  choice: የሚደረጉትን ነገሮች
  rationale: መስተዋድዱ ከአሁን ጊዜ አሳታፊ ግስ ጋር ሆኖ በስም ተግባር የሚገለገል ስለሆነ፣ ድርጊቶችን በአጠቃላይ ያመለክታል። ይህ አገላለጽ በአማርኛ ተፈጥሯዊ ሆኖ የግሪኩን ስማዊ ኃይል ይጠብቃል።
- source_word: γὰρ
  choice: ነውና
  rationale: γάρ ከቀደመው ምክር ጋር የሚያያዝ ማብራሪያዊ ምክንያት ይሰጣል፤ በአማርኛ የአረፍተ ነገሩ መጨረሻ ያለው «ነውና» ይህን ግንኙነት ተፈጥሯዊ አድርጎ ያሳያል።
- source_word: κρυφῇ
  choice: በስውር
  rationale: በተሰወረ ወይም በማይታይ መንገድ መደረጉን ያመለክታል፤ «በስውር» አጭርና የተለመደ አማርኛ ነው።
- source_word: γινόμενα
  choice: የሚደረጉት
  rationale: የአሁን ጊዜውን አሳታፊ ግስ በተፈጥሯዊ አማርኛ ይገልጣል፤ ተደጋጋሚ ወይም ቀጣይ ድርጊትን ሊያመለክት የሚችለውን ገጽታም አያጠፋም።
- source_word: ὑπ’ αὐτῶν
  choice: በእነርሱ
  rationale: ὑπό ከባለቤት መስተዋድድ ጋር የድርጊቱን ፈጻሚዎች ያመለክታል። «በእነርሱ» ተውላጠ ስሙን ሳይተረጉም ወይም ማንነታቸውን ሳያሰፋ በቀጥታ ያስተላልፋል።
- source_word: αἰσχρόν
  choice: የሚያሳፍር
  rationale: ቃሉ በሥነ ምግባር የሚያሳፍርን ወይም ነውር የሆነን ነገር ያመለክታል። «የሚያሳፍር» ግልጽ፣ ዘመናዊና ከመጠን ያላለፈ አገላለጽ ነው።
- source_word: καὶ λέγειν
  choice: መናገር እንኳ
  rationale: καί እዚህ አጽንዖታዊ ኃይል ስላለው «እንኳ» ተብሎ ተተርጉሟል። «መናገር» የλέγεινን መሠረታዊ ትርጉም ይጠብቃል፤ በአማርኛው የዓረፍተ ነገር አወቃቀር ነገሮቹን ስለ መናገር መሆኑ ግልጽ ነው።
theological_decisions:
- issue: የαὐτῶν ወሰንና ቀዳሚ ስም
  choice: በቁጥሩ ውስጥ ማንነታቸውን ሳያሰፋ «በእነርሱ» ብሎ ማቆየት
  alternative: «በማይታዘዙት» ወይም «በጨለማ ሥራ አድራጊዎች» ብሎ ቀዳሚውን ስም መግለጽ
  rationale: የተውላጠ ስሙ ቀዳሚ ከአውዱ ይታወቃል፤ በዚህ ቁጥር ግን የግሪኩን ተውላጠ ስም በግልጽ ስም መተካት ከትርጉም በላይ የአውድ ማብራሪያ ይጨምራል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ነውና» የምክንያታዊውን ትስስር በተፈጥሯዊ መንገድ ይይዛል፤ «መናገር እንኳ» ደግሞ የκαίን አጽንዖት ይጠብቃል።
