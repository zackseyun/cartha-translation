    issue: The main predicate is phrased causatively as ‘የሚያሳፍር ነው.’
    rationale: While intelligible, this can mean ‘causes shame.’ The Greek αἰσχρόν ἐστιν is more directly and idiomatically rendered ‘አሳፋሪ ነው’ (‘is shameful’).
  - severity: low
    issue: The passive agent phrase and object construction are wooden in the main text.
    rationale: A natural active Amharic construction explicitly retains ‘እነርሱ’ as the doers and makes the sense of ‘speak of’ clear, without adding an antecedent or changing the meaning.
