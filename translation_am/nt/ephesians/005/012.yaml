  verdict: revise
  source_fidelity: The draft retains the explanatory force of γάρ, the concealment of κρυφῇ, the agent expressed by ὑπ’ αὐτῶν, and the ascensive force of καὶ ('እንኳ'). Its passive rendering is defensible, but the construction is somewhat stiff in modern Amharic.
  naturalness: ‘በስውር በእነርሱ የሚደረጉትን ነገሮች መናገር’ is understandable but less idiomatic than an active formulation with ‘ስለ … መናገር.’ ‘አሳፋሪ ነው’ more naturally conveys the impersonal predicate αἰσχρόν ἐστιν than ‘የሚያሳፍር ነው.’
  terminology: No theological term requires adjustment. The pronoun remains unexpanded as ‘እነርሱ,’ preserving the source and contextual antecedent without interpretive addition.
  issues:
