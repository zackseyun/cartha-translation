reference: Ephesians 5:29
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὐδεὶς γάρ ποτε τὴν ἑαυτοῦ σάρκα ἐμίσησεν, ἀλλὰ ἐκτρέφει καὶ θάλπει αὐτήν, καθὼς καὶ ὁ ⸀Χριστὸς τὴν ἐκκλησίαν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/029.yaml
  text: For no one ever hated his own flesh[a], but nourishes and cherishes it, just as the Messiah also does the church[c][b],
translation:
  language: am
  text: ምክንያቱም ማንም የራሱን ሥጋ[b] ከቶ ጠልቶ አያውቅም፤ ይልቁንም ይመግበዋል፣ ይንከባከበዋል። መሲሑም[a] ቤተ ክርስቲያንን እንዲሁ ይመግባታል፣ ይንከባከባታል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ክርስቶስ።” Χριστός የሚለው የግሪክ ቃል “የተቀባው” የሚል ትርጉም አለው፤ እዚህ “መሲሕ” ተብሎ ተተርጉሟል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “የራሱን ሰውነት።” እዚህ “ሥጋ” የሚያመለክተው የሰውን አካላዊ ማንነት እንጂ “ኃጢአተኛ ተፈጥሮን” አይደለም።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς γάρ ποτε
  choice: ማንም … ከቶ … አያውቅም
  rationale: The negative experiential idiom naturally conveys that no one has ever done this. The explanatory γάρ is not represented by a separate conjunction because an initial ምክንያቱም without the preceding verse would sound incomplete; the grounding force remains clear in context.
- source_word: τὴν ἑαυτοῦ σάρκα
  choice: የራሱን ሥጋ
  rationale: ሥጋ directly preserves the literal bodily sense of σάρξ and የራሱን reflects the reflexive ἑαυτοῦ.
- source_word: ἐμίσησεν
  choice: ጠልቶ አያውቅም
  rationale: 'This standard Amharic experiential construction naturally expresses Greek aorist μισέω together with οὐδεὶς … ποτε: ‘no one has ever hated.’'
- source_word: ἀλλὰ ἐκτρέφει
  choice: ይልቁንም ይመግበዋል
  rationale: ይልቁንም marks the strong contrast, while ይመግበዋል gives the concrete sense of feeding and nourishing one's body.
- source_word: θάλπει αὐτήν
  choice: በርኅራኄም ይንከባከበዋል
  rationale: The phrase conveys the verb's contextual sense of warm, tender care rather than merely physical warming.
- source_word: καθὼς καὶ
  choice: …ም … እንዲሁ
  rationale: The combination naturally carries both the comparison and the additive force of καί in Amharic.
- source_word: ὁ Χριστός
  choice: መሲሑ
  rationale: Χριστός is functioning as the anointed title here. መሲሑ preserves that title sense, with the familiar ክርስቶስ noted as an alternative.
- source_word: τὴν ἐκκλησίαν
  choice: ቤተ ክርስቲያንን
  rationale: This is the established, dignified Amharic term for the corporate church and refers here to the community, not a building.
theological_decisions:
- issue: Rendering Χριστός as title or familiar name-form
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: The article and context support title-like force. The main text therefore conveys ‘the Messiah,’ while a footnote preserves the familiar traditional form without imposing a doctrinal distinction.
- issue: Meaning of σάρξ
  choice: ሥጋ
  alternative: ሰውነት
  rationale: The term refers to one's literal physical self within the body-and-marriage analogy, not to a morally sinful nature. The more lexical rendering is retained, with the smoother contextual alternative noted.
- issue: Ellipsis in the final comparison
  choice: Repeat ‘feeds’ and ‘cares for’ with the church as object
  alternative: Use a general pro-verb equivalent to ‘does likewise’
  rationale: Greek leaves the verbal idea implicit, but natural Amharic benefits from repeating the two actions. This makes no new theological claim and clearly preserves the comparison.
translation_notes:
  register: Modern standard Amharic in Ge'ez script, with a dignified but accessible register. The sentence is divided at the comparison for readability. Repeating the implied verbs in the final clause avoids an awkward Amharic pro-verb construction while retaining the Greek relation between Messiah and church.
