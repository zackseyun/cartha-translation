- source_word: τέκνα
  choice: ልጆች
  rationale: ጾታን የማይወስነውን የቤተሰብ ዝምድና በትክክልና በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἀγαπητά
  choice: ተወደዳችሁ
  rationale: ቅጽሉ ልጆቹ የተወደዱ መሆናቸውን ይገልጣል። ከ«ልጆች» ጋር «ተወዳጅ» ማለት በአማርኛ ሌሎች እነርሱን እንደሚወዷቸው ወይም ተወዳጅነት እንዳላቸው ሊሰማ ስለሚችል፣ «ተወደዳችሁ» የተቀበሉትን ፍቅር በግልጽ ያሳያል።
theological_decisions:
- issue: ትእዛዙ ከእግዚአብሔር ልጅነት ጋር ያለው ግንኙነት
  choice: አማኞች እንደ ተወደዱ ልጆች እግዚአብሔርን እንዲመስሉ ተጠርተዋል፤ በመምሰላቸው ልጆች እንደሚሆኑ አይተረጎምም።
  alternative: ሐረጉ «የተወደዱ ልጆች እንደሚያደርጉት» የሚል ቀላል ንጽጽር ብቻ ሊሆን ይችላል።
  rationale: «እንደ ተወደዳችሁ ልጆች» የሚለው ትእዛዙን ከነባሩ የልጅነት ማንነት ጋር ያያይዘዋል፤ ነገር ግን «እንደ» የአኳኋንና የመሠረት ልዩነቱን በግድ አይፈታም።
