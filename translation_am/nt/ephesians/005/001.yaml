- source_word: μιμηταὶ
  choice: የምትመስሉ
  rationale: ቃሉ አንድን ሰው በባሕርይና በተግባር መምሰልን ያመለክታል። «ተከታዮች» የሚለው ሰፊ ነው፤ «የምትመስሉ» የመኮረጅን ሐሳብ በተፈጥሯዊ አነጋገር ይጠብቃል።
- source_word: τοῦ θεοῦ
  choice: እግዚአብሔርን
