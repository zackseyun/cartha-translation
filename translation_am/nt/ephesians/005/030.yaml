lexical_decisions:
- source_word: ὅτι
  choice: ምክንያቱም
  rationale: ቀደም ሲል ለተነገረው ነገር ምክንያት ወይም ማብራሪያ ያቀርባል፤ «ምክንያቱም» ይህን የምክንያት ግንኙነት በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: μέλη
  choice: ብልቶች
  rationale: ቃሉ አንድን አካል የሚያ组成ትን ክፍሎች ያመለክታል። «ብልቶች» የሰውነትን ምሳሌያዊ ምስል በቀጥታ ይጠብቃል፤ በዐውዱም አማኞች ከክርስቶስና እርስ በርሳቸው ያላቸውን አንድነት ያሳያል።
- source_word: ἐσμὲν
  choice: ነን
  rationale: የ«መሆን» ግስ የአሁን ጊዜ የመጀመሪያ መደብ ብዙ ቁጥር ቅርጽ ስለሆነ «ነን» ትክክለኛና ተፈጥሯዊ ትርጉም ነው።
- source_word: σώματος
  choice: አካል
  rationale: በዚህ ዐውድ ጳውሎስ ማኅበሩን የክርስቶስ አካል አድርጎ የሚገልጽበትን የታወቀ ምሳሌ ይቀጥላል፤ «አካል» ቀጥተኛና የተለመደ አቻ ነው።
- source_word: αὐτοῦ
  choice: የእርሱ
  rationale: የባለቤትነት ተውላጠ ስሙ በአካባቢው ዐውድ ክርስቶስን ያመለክታል፤ «የእርሱ» የግል ማመልከቻውን በግልጽነት ይጠብቃል።
theological_decisions:
- issue: «ከሥጋውና ከአጥንቱ» የሚለውን ረዘም ያለ የባይዛንታይን ንባብ በዋናው ጽሑፍ ውስጥ ማካተት ወይም አለማካተት
  choice: የSBLGNTን አጭር ንባብ ብቻ መተርጎም፦ «ምክንያቱም እኛ የእርሱ አካል ብልቶች ነን።»
  alternative: «ምክንያቱም እኛ የእርሱ አካል፣ የሥጋውና የአጥንቱ ብልቶች ነን።»
  rationale: የቀረበው የግሪክ ምንጭ አጭሩን ንባብ ይዟል፤ ረዘም ያለው ንባብ በዐውዱ ውስጥ ቀድሞ ከተጠቀሰው የዘፍጥረት 2፥23 ቋንቋ ጋር በማመሳሰል የተስፋፋ ሊሆን ይችላል። ልዩነቱ ግን ለአንባቢ ግልጽ እንዲሆን በግርጌ ማስታወሻ ተጠቅሷል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የ«አካል ብልቶች» አገላለጽ የግሪኩን የሰውነት ምሳሌ ይጠብቃል።
