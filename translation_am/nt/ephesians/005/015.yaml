  choice: ጥበብ እንደሌላችሁ ሳይሆን ጥበበኞች እንደሆናችሁ
  rationale: የ«ጥበብ የሌላቸው / ጥበበኞች»ን ተቃርኖ ይጠብቃል፤ ለመላው ማኅበረ ምእመናን የተነገረውን ብዙ ቁጥርም በግልጽ ያሳያል።
theological_decisions:
- issue: የἄσοφοι / σοφοί ወካይ ወንድ ፆታ ቅርጾች
  choice: ጥበብ እንደሌላችሁ ... ጥበበኞች እንደሆናችሁ
  alternative: ጥበብ እንደሌላቸው ወንዶች ... ጥበበኛ ወንዶች
  rationale: የግሪኩ ወንድ ፆታ ብዙ ቁጥር ቅርጽ እዚህ ወካይ ሆኖ መላውን ማኅበረ ምእመናን ይጠቅሳል። አማርኛው ይህን ትርጉም ተፈጥሯዊ በሆነ ብዙ ቁጥር ያስተላልፋል፤ «ወንዶች» ማለት ግን በዐውዱ የሌለ ገደብ ያስገባል።
- issue: የπεριπατεῖτε ዘይቤ
  choice: የመመላለስን ዘይቤ በዋናው ጽሑፍ ማቆየት
  alternative: እንዴት እንደምትኖሩ
  rationale: የጳውሎስን የሕይወት አካሄድ ዘይቤ ይጠብቃል፤ የታሰበው ፍቺ በአጭር ማስታወሻ ተብራርቷል።
