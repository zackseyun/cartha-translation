review_pass:
  verdict: revise
  source_fidelity: The draft conveys the inference (οὖν), plural exhortation (Βλέπετε), careful attention, and the walk/life metaphor. However, its contrast is phrased as though the readers themselves merely ‘lack wisdom’ (ጥበብ እንደሌላችሁ), rather than preserving the Greek comparison ‘not as unwise [people], but as wise [people].’
  naturalness: The current sentence is understandable, but placing the comparative contrast before the command makes it less direct. A main imperative followed by the parallel comparison is clearer and more idiomatic in modern standard Amharic.
  terminology: ተመልከቱ appropriately renders the imperative call to attentive observation, and መመላለስ can retain περιπατεῖτε’s metaphor when explained in a note. ‘ጥበብ የሌላቸው ሰዎች ... ጥበበኞች’ naturally expresses the contrast without wrongly restricting the audience to males.
  issues:
  - severity: medium
    issue: The phrase ጥበብ እንደሌላችሁ ሳይሆን does not precisely retain the comparative construction.
    rationale: 'μὴ ὡς ἄσοφοι ἀλλ’ ὡς σοφοί contrasts the manner in which the recipients are to walk: ‘not as unwise [ones], but as wise [ones].’ The draft’s second-person possession wording shifts this to a statement about whether they have wisdom.'
  - severity: low
    issue: The comparison is fronted ahead of the command.
    rationale: This is not wrong, but the revised order more clearly follows the Greek exhortation and reads more smoothly in Amharic.
