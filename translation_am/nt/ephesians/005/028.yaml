- issue: በሚስትና በሰውነት መካከል ያለው ንጽጽር
  choice: ንጽጽሩን በግልጽ መጠበቅ እንጂ ተጨማሪ ዶግማዊ ትርጓሜ አለመጨመር
  alternative: ንግግሩን ሚስትና የባል ሰውነት በምንነት አንድ ናቸው እንደሚል ማስፋት
  rationale: ጽሑፉ ፍቅርን ከራስ ሰውነት እንክብካቤ ጋር አነጻጽሮ፣ ሚስትን መውደድ ራስን መውደድ እንደሆነ ይደመድማል፤ ትርጉሙም ይህን ውጥረት ያለ ተጨማሪ ማብራሪያ ይጠብቃል።
