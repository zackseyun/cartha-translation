  yaml_path: translation/nt/ephesians/005/028.yaml
  text: In the same way, husbands also ought to love their own wives as their own bodies. He who loves his own wife loves himself,
translation:
  language: am
  text: እንዲሁ ባሎችም የራሳቸውን ሚስቶች እንደ ራሳቸው ሰውነት ሊወዱ ይገባቸዋል። የራሱን ሚስት የሚወድ ራሱን ይወዳል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: እንዲሁ
  rationale: ከቀደመው ንጽጽርና ማሳሰቢያ ጋር ያለውን ትስስር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὀφείλουσιν
  choice: ሊወዱ ይገባቸዋል
  rationale: ግሱ የሚገልጠውን የሥነ ምግባር ግዴታ ያለ አላስፈላጊ ማጠናከር በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: καὶ
  choice: -ም
  rationale: በ«ባሎችም» ላይ ያለው አጣማሪ ቅጥያ የκαὶን አክሎ የማቅረብ ኃይል ይይዛል።
- source_word: οἱ ἄνδρες
  choice: ባሎች
  rationale: በዚህ የቤተሰብ ምክር አውድ ἀνήρ ያገቡ ወንዶችን፣ ማለትም ባሎችን፣ ያመለክታል።
- source_word: ἀγαπᾶν
  choice: ሊወዱ
  rationale: በቁጥሩ ውስጥ የተደጋገመውን ἀγαπάω በተመሳሳይ «መውደድ» ሥር ይጠብቃል።
- source_word: τὰς ἑαυτῶν γυναῖκας
  choice: የገዛ ሚስቶቻቸውን
  rationale: γυναῖκαςን በጋብቻ አውዱ «ሚስቶች» ብሎ ሲተረጉም፣ የἑαυτῶνን አጽንዖት «የገዛ» በማለት ይጠብቃል።
- source_word: ὡς τὰ ἑαυτῶν σώματα
  choice: እንደ ገዛ ሰውነታቸው
  rationale: ንጽጽሩንና የσῶμαን ቀጥተኛ ትርጉም ይጠብቃል፤ በአማርኛ ነጠላው «ሰውነታቸው» እያንዳንዱ ባል የራሱ ሰውነት እንዳለው በተፈጥሯዊ ሁኔታ ያመለክታል።
- source_word: ὁ ἀγαπῶν
  choice: የሚወድ
  rationale: ጾታዊ መለያው በአማርኛ ግሱ ላይ ባይታይም፣ «ሚስቱን» እና «ራሱን» የሚሉት ቅርጾች ተናጋሪው ስለ ባል እየተናገረ መሆኑን በግልጽ ያሳያሉ።
- source_word: τὴν ἑαυτοῦ γυναῖκα
  choice: የገዛ ሚስቱን
  rationale: የጋብቻውን ትርጉምና የἑαυτοῦን አጽንዖት ሁለቱንም ይጠብቃል።
- source_word: ἑαυτὸν ἀγαπᾷ
  choice: ራሱን ይወዳል
  rationale: ተመላሽ ተውላጠ ስሙንና የፍቅር ግሱን በቀጥታ በመጠበቅ የጳውሎስን ሐሳብ ያስተላልፋል።
theological_decisions:
- issue: በቤተሰብ ምክሩ ውስጥ ያለው ጾታዊ አገላለጽ
  choice: οἱ ἄνδρεςን «ባሎች» በማለት የጋብቻ አውዱን ግልጽ ማድረግ
