  text: ἀλλὰ ⸀ὡς ἡ ἐκκλησία ὑποτάσσεται τῷ Χριστῷ, οὕτως καὶ αἱ γυναῖκες ⸀τοῖς ἀνδράσιν ἐν παντί.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/024.yaml
  text: But as the church submits to Messiah[a], so also wives to their husbands in everything.
translation:
  language: am
  text: ነገር ግን ቤተ ክርስቲያን ለመሲሑ[a] እንደምትገዛ፣ ሚስቶችም እንዲሁ በሁሉም ነገር ለባሎቻቸው ይገዙ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ለክርስቶስ»። የግሪኩ Χριστός እዚህ እንደ ማዕረግ ስለሚያገለግል «መሲሕ» ተብሎ ተተርጉሟል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: ነገር ግን
  rationale: ከቀደመው ንግግር ጋር ያለውን ንጽጽርና የሐሳብ ቅጥያ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὡς ... οὕτως καὶ
  choice: እንደምትገዛ ... እንዲሁ ...
  rationale: የግሪኩን ‘እንደ ... እንዲሁም’ ንጽጽራዊ አወቃቀር በተፈጥሯዊ የአማርኛ ሰዋስው ይጠብቃል።
- source_word: ἡ ἐκκλησία
  choice: ቤተ ክርስቲያን
  rationale: በዘመናዊ አማርኛ የክርስቲያኖችን ማኅበረሰብ ለመግለጽ የተለመደና ግልጽ ቃል ነው።
- source_word: ὑποτάσσεται
  choice: ትገዛ
  rationale: በተዋረድ ሥርዓት ውስጥ በፈቃድ መገዛትን የሚገልጸውን የግሪኩን መካከለኛ/ተደራጊ ቅርጽ በአጭርና በሚታወቅ አማርኛ ያቀርባል፤ ከግሱ በላይ የግዴታ ወይም የኃይል ትርጉም አይጨምርም።
- source_word: τῷ Χριστῷ
  choice: ለመሲሑ
  rationale: Χριστός በዚህ አውድ እንደ ማዕረግ ስለሚሠራ፣ የማዕረጉን ትርጉም ‘መሲሕ’ በማለት ያሳያል፤ የግሪኩ የተወሰነ አንቀጽም ‘መሲሑ’ በሚለው ተንጸባርቋል።
- source_word: αἱ γυναῖκες
  choice: ሚስቶች
  rationale: በቤተሰብ ሥርዓት አውድና ከἀνδράσιν ጋር ባለው ጥምረት ‘ሴቶች’ ሳይሆን ‘ሚስቶች’ ማለት ያስፈልጋል።
- source_word: τοῖς ἀνδράσιν
  choice: ለባሎቻቸው
  rationale: የትዳር አውዱ ἀνήρን ‘ባል’ ብሎ እንዲተረጉም ያደርጋል፤ ‘-ቻቸው’ የሚለውም በግሪኩ የተገለጠውን የትዳር ጥምረት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐν παντί
  choice: በሁሉም ነገር
  rationale: የሐረጉን ስፋት ሳያጠብ ወይም የማብራሪያ ገደብ ሳይጨምር በቀጥታ ያስተላልፋል።
- source_word: '[ellipsis from the preceding context with αἱ γυναῖκες]'
  choice: ይገዙ
  rationale: በሁለተኛው የግሪክ ክፍል ግሱ በሐሳብ ተዘሏል፤ ሙሉና ተፈጥሯዊ የአማርኛ ዓረፍተ ነገር ለማቅረብ ከመጀመሪያው ክፍል ‘መገዛት’ ተደግሟል።
theological_decisions:
- issue: የΧριστός አተረጓጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: ቃሉ በዚህ ንጽጽር ውስጥ እንደ ማዕረግ ይሠራል፤ ስለዚህ የማዕረጉን ትርጉም ‘መሲሕ’ በማለት ማቅረብ ተመርጧል። በአማርኛ የጸናው ‘ክርስቶስ’ ግን በማስታወሻ ተጠብቋል።
- issue: ‘በሁሉም ነገር’ የሚለው ወሰን
  choice: ሐረጉን ያለ ተጨማሪ ገደብ ማቆየት
  alternative: ‘ተገቢ በሆነው ሁሉ’ ወይም ተመሳሳይ የትርጓሜ ማስፋፊያ
  rationale: ግሪኩ ἐν παντί ብቻ ይላል። በዚህ ቁጥር ያልተጻፈ ገደብ መጨመር የምንጩን ሥነ መለኮታዊ ውጥረት በትርጉም ደረጃ ይፈታዋል።
- issue: በሁለተኛው ክፍል የተዘለለው ግስ
  choice: ‘ይገዙ’ ብሎ በግልጽ ማቅረብ
  alternative: ‘ሚስቶችም እንዲሁ ... ለባሎቻቸው’ ብሎ ግስ አልባ መተው
  rationale: ግሱ ከቀደመው ክፍል በሐሳብ የሚሞላ ቢሆንም፣ በአማርኛ ግስ አልባ አወቃቀሩ ያልተሟላና ያልተፈጥሯዊ ይሆናል። ‘ይገዙ’ የተጨመረው አዲስ ሐሳብ ለማስገባት ሳይሆን የግሪኩን ሰዋሰዋዊ ስውር ቃል ለማሳየት ነው።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። ‘ቤተ ክርስቲያን፣’ ‘መሲሕ፣’ ‘መገዛት’ የሚሉት ቃላት የመጽሐፍ ቅዱስን ክብር ሳያጡ በዘመናዊ ንባብ የሚገቡ ናቸው።
