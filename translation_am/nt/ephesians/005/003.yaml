  verdict: revise
  source_fidelity: The draft correctly represents the three vice categories, the communal force of ἐν ὑμῖν, and the ethical standard expressed by καθὼς πρέπει ἁγίοις. However, የዝሙት ኃጢአት is somewhat tautological and can be read more narrowly than πορνεία. The expression ስሙ እንኳ አይነሣ is understandable but less direct than the Greek passive prohibition.
  naturalness: A direct impersonal passive-style rendering, እንኳ አይጠቀስ, is clear and natural in modern standard Amharic. Recasting the final clause with እንደሚገባ is closer to the source and flows more naturally.
  terminology: የወሲብ ኃጢአት suitably conveys the broad illicit-sexual-conduct sense of πορνεία. ርኩሰት, ስግብግብነት, and ቅዱሳን are appropriate. The note on ቅዱሳን properly prevents a later restricted sense without imposing doctrine.
