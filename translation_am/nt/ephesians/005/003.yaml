    rationale: While intelligible, ዝሙት may be heard in a more specific sense, and adding ኃጢአት does not preserve the source term's breadth as clearly as የወሲብ ኃጢአት.
  - severity: low
    issue: ስሙ እንኳ አይነሣ is less direct than μηδὲ ὀνομαζέσθω.
    rationale: The idiom is acceptable, but እንኳ አይጠቀስ more directly expresses that such conduct is not even to be mentioned among the community.
