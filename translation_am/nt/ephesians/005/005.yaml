  source_fidelity: The draft accurately represents the emphatic knowledge statement, the three ethical descriptions, present-tense exclusion from inheritance, and the wording “the kingdom of the Messiah and God.” However, its parenthetical repeats “ስግብግብ” and then adds “ማንም ሰው,” which makes the Greek list and the relative clause less syntactically clear in Amharic.
