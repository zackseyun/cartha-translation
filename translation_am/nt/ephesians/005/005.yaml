  - severity: low
    issue: The alternative-reading footnote can express the abstract alternative more naturally.
    rationale: The Greek neuter relative pronoun permits an abstract sense, especially with respect to greed. “ይህ ጣዖት አምልኮ ነው” states that alternative directly without suggesting that this is a separate textual variant.
