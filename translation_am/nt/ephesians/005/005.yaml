  text: τοῦτο γὰρ ⸀ἴστε γινώσκοντες ὅτι πᾶς πόρνος ἢ ἀκάθαρτος ἢ πλεονέκτης, ⸀ὅ ἐστιν εἰδωλολάτρης, οὐκ ἔχει κληρονομίαν ἐν τῇ βασιλείᾳ τοῦ Χριστοῦ καὶ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/005.yaml
  text: For you know this[a], understanding that every sexually immoral or unclean or greedy person, who is an idolater[b], has no inheritance in the kingdom of Messiah and God.
translation:
  language: am
  text: ይህን በሚገባ ታውቃላችሁና፤ የፆታ ብልግና የሚፈጽም፣ ርኩስ ወይም ስግብግብ ሰው—ይኸውም ጣዖት አምላኪ ነው[a]—በመሲሑ[b]ና በእግዚአብሔር መንግሥት ርስት የለውም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል «ይህ ጣዖት አምልኮ ነው» ተብሎም ሊተረጎም ይችላል፤ ይህም በተለይ ስግብግብነትን የሚያመለክት ይመስላል።
    reason: alternative_reading
  - marker: b
    text: የግሪኩ ቃል Χριστός («ክርስቶስ») ነው፤ እዚህ እንደ ማዕረግ ስለሚያገለግል «መሲሕ» ተብሎ ተተርጉሟል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴστε γινώσκοντες
  choice: ይህን በሚገባ ታውቃላችሁና
  rationale: ሁለቱ የማወቅ ቃላት የሚሰጡትን አጽንዖት በተፈጥሯዊ አማርኛ «በሚገባ ታውቃላችሁ» ይገልጻል፤ γάρ ደግሞ «ና» በሚለው ቅጥያ ተጠብቋል።
- source_word: πόρνος
  choice: የፆታ ብልግና የሚፈጽም
  rationale: በፆታዊ ብልግና የሚታወቅን ሰው በዘመናዊና ግልጽ አማርኛ ይገልጻል።
- source_word: ἀκάθαρτος
  choice: ርኩስ
  rationale: የቃሉን የሞራል ንጽሕና ማጣት እና የሥርዓታዊ ርኩሰት ጥላ ይጠብቃል።
- source_word: πλεονέκτης
  choice: ስግብግብ
  rationale: የሌላውን ለመውሰድ የሚጓጓንና ያለው የማይበቃውን ሰው በተለመደ ዘመናዊ ቃል ይገልጻል።
- source_word: ὅ ἐστιν εἰδωλολάτρης
  choice: ስግብግብ ሰውም ጣዖት አምላኪ ነው
  rationale: በአውዱና በቆላስይስ 3፥5 ትይዩ መሠረት አንቀጹን በተለይ ከስግብግብ ሰው ጋር ያያይዛል፤ የግሪኩ ገለልተኛ አንጻራዊ ተውላጠ ስም የሚፈቅደው ሌላ አተረጓጎም በማስታወሻ ተጠብቋል።
- source_word: κληρονομίαν
  choice: ርስት
  rationale: የኪዳንንና የወደፊቱን ፍጻሜ ትርጉም የሚያስተጋባ የተለመደ መጽሐፍ ቅዱሳዊ ቃል ነው።
- source_word: βασιλείᾳ
  choice: መንግሥት
  rationale: የንጉሣዊ ግዛትንም ሆነ የንግሥና ሥልጣንን ሊያካትት የሚችል የተመሰረተ አቻ ቃል ነው።
- source_word: Χριστοῦ
  choice: መሲሑ
  rationale: Χριστός በዚህ ስፍራ እንደ ማዕረግ ስለሚሠራ «መሲሕ» ተብሎ ተተርጉሟል፤ የግሪኩ ውስን መስተዋድድ በ«መሲሑ» ተጠብቋል።
theological_decisions:
- issue: የὅ ἐστιν εἰδωλολάτρης ተዛማጅ
  choice: አንቀጹ በዋናው ጽሑፍ በተለይ ለስግብግብ ሰው ተያይዟል፤ «ስግብግብ ሰውም ጣዖት አምላኪ ነው»።
  alternative: «ይህም ጣዖት አምልኮ ነው» ብሎ ስግብግብነትን እንደ ጣዖት አምልኮ መግለጽ።
  rationale: ὅ ገለልተኛ ቢሆንም በፊቱ ያሉት የሰው መጠሪያዎች ተባዕታይ ናቸው። ትይዩው አውድ ስግብግብነትን ከጣዖት አምልኮ ጋር ያያይዛል፤ ሰውን የሚገልጸው ንባብ በዋናው ጽሑፍ፣ ነገሩን የሚገልጸው ንባብ በማስታወሻ ቀርቧል።
- issue: ከመንግሥቱ ርስት መገለል
  choice: «ርስት የለውም» በሚል የአሁን ጊዜ አገላለጽ ተተርጉሟል።
  alternative: «መንግሥቱን አይወርስም» የሚል የወደፊት ጊዜ አገላለጽ።
  rationale: ግሪኩ οὐκ ἔχει የአሁን ጊዜ ግስ ነው፤ ስለዚህ ማስጠንቀቂያውን ሳያለዝብ የጽሑፉን ጊዜ ይጠብቃል።
- issue: «የመሲሑና የእግዚአብሔር» ግንኙነት
  choice: ሁለቱ የባለቤትነት ሐረጎች በቀጥታ «በመሲሑና በእግዚአብሔር መንግሥት» ተብለዋል።
  alternative: ከአገባቡ የበለጠ የተወሰነ ክርስቶሎጂያዊ ድምዳሜን በትርጉሙ ውስጥ ማስገባት።
  rationale: አንዱ የግሪክ መስተዋድድ የጠበቀ ጽንሰ ሐሳባዊ አንድነትን ሊያመለክት ቢችልም፣ ትርጉሙ ከግሪኩ ግልጽ አባባል በላይ የተከራከረ ድምዳሜ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የጥንታዊ ቃላትን ክብደት ሳያበዛ «ርስት፣ መንግሥት፣ መሲሕ» የሚሉት የተመሰረቱ መጽሐፍ ቅዱሳዊ ቃላት ተጠብቀዋል።
