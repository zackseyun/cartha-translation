review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the participial exhortation, the sense of maintaining rather than creating unity, and the genitive ambiguity of «the Spirit.» However, «እስራት» normally denotes imprisonment or the act/state of binding and is not a natural modern equivalent for σύνδεσμος in this metaphor.
  naturalness: «ትጉ» is terse and comparatively marked in this construction. «በትጋት ጣሩ» is clear, idiomatic modern standard Amharic and conveys earnest active effort. «የሰላም ትስስር» naturally retains the image of a binding tie.
  terminology: «የመንፈስ አንድነት,» «መጠበቅ,» and «ሰላም» are appropriate. The rendering leaves «መንፈስ» uncapitalized and thus does not force the debated referent in the main text; the footnote appropriately identifies the contextually likely reading.
  issues:
  - severity: medium
    issue: «በሰላም እስራት» is unnatural and potentially misleading.
    rationale: In modern Amharic, «እስራት» commonly evokes detention/imprisonment or binding as an act, whereas σύνδεσμος denotes a bond, tie, or that which binds together. «ትስስር» communicates the metaphor naturally without adding interpretation.
  - severity: low
    issue: «ትጉ» is less natural than an explicit verbal expression of diligent effort.
    rationale: The Greek participle denotes sustained earnest effort. «በትጋት ጣሩ» supplies this force idiomatically while retaining its exhortatory relationship to the preceding context.
  revised_text: የመንፈስን አንድነት በሰላም ትስስር ለመጠበቅ በትጋት ጣሩ[a]።[b]
