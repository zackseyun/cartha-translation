translation:
  language: am
  text: የመንፈስን አንድነት በሰላም ትስስር ለመጠበቅ በትጋት ጣሩ[a]።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የቻላችሁትን ሁሉ አድርጉ” ወይም “ለመጠበቅ ትጉ።”
    reason: lexical_alternative
  - marker: b
    text: እዚህ “መንፈስ” የሚለው በዋናነት መንፈስ ቅዱስን የሚያመለክት ይመስላል፤ አንዳንዶች ግን አማኞች የሚጋሩትን መንፈስ በአጠቃላይ እንደሚያመለክት ይረዱታል።
    reason: alternative_reading
lexical_decisions:
- source_word: σπουδάζοντες
  choice: ትጉ
  rationale: የግሱ የአሁን ጊዜ አድራጊ አካል ከቁጥር 1–2 የሚቀጥለውን የማሳሰቢያ ኃይል ይዞ ነው፤ «ትጉ» ቅን ትጋትንና ንቁ ጥረትን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τηρεῖν
  choice: ለመጠበቅ
  rationale: ቀድሞ ያለን ነገር መጠበቅንና እንዳይጠፋ መጠንቀቅን ያመለክታል፤ አንድነቱን መፍጠር ሳይሆን መጠበቅ መሆኑን ያቆያል።
- source_word: ἑνότητα
  choice: አንድነት
  rationale: የἑνότηςን መሠረታዊ ትርጉም በግልጽና በዘመናዊ አማርኛ ይገልጻል።
- source_word: τοῦ πνεύματος
  choice: የመንፈስን
  rationale: በኤፌሶን መልእክት አቅራቢያ ያለው አውድ በዋናነት መንፈስ ቅዱስን ያመለክታል፤ የአማርኛው ቃል ግን የግሪኩን የቅርጽ አሻሚነት ይጠብቃል።
- source_word: ἐν
  choice: በ
  rationale: በዚህ ሐረግ ውስጥ የመሣሪያን ወይም የማሰሪያ መንገድን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: συνδέσμῳ
  choice: እስራት
  rationale: አንድ ላይ የሚያስርን ነገር የሚያሳየውን ዘይቤ በአጭርና በተከበረ አነጋገር ይጠብቃል።
- source_word: τῆς εἰρήνης
  choice: የሰላም
  rationale: ቀጥተኛውን የዝምድና አገባብ ይጠብቃል፤ ሰላም አንድነቱን የሚያስር እስራት ወይም የእስራቱ ባሕርይ ሊሆን የሚችለውን አሻሚነት አይፈታም።
theological_decisions:
- issue: የπνεύματος ማመልከቻ
  choice: በዋናነት መንፈስ ቅዱስ
  alternative: የአማኞች የጋራ መንፈስ
  rationale: ኤፌሶን 4፥4 እና 4፥30ን ጨምሮ የአቅራቢያው አውድ መንፈስ ቅዱስን ይደግፋል፤ ሆኖም ቃሉ ብቻውን ሌላውን አረዳድ ሙሉ በሙሉ ስለማይዘጋ በማስታወሻ ተጠቅሷል።
- issue: የአንድነቱ ባሕርይ
  choice: ቀድሞ ያለና ሊጠበቅ የሚገባው አንድነት
  alternative: አማኞች ሊፈጥሩት የሚገባ አንድነት
  rationale: τηρεῖν የሚለው ቃል አንድነቱን መጠበቅ እንጂ መፍጠር አይልም፤ ትርጉሙም ይህን ልዩነት ያቆያል።
