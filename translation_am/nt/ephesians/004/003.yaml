  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ከቁጥር 1–2 የሚቀጥለው የትእዛዝ ፍሰት በ«ትጉ» ተገልጧል፤ የ«የሰላም እስራት» ዘይቤም ሳይፈታ ተጠብቋል።
