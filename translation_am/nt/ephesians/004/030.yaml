  text: And do not grieve the Holy Spirit of God[a], in whom you were sealed for the day of redemption.
translation:
  language: am
  text: የእግዚአብሔርንም ቅዱስ መንፈስ አታሳዝኑ፤ በእርሱ ለቤዛው ቀን ማኅተም ተደርጎባችኋል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λυπεῖτε
  choice: አታሳዝኑ
  rationale: μή ከአሁን ጊዜ ትእዛዛዊ ግስ ጋር የሚሰጠውን ክልከላ በተፈጥሯዊ አማርኛ ያሳያል፤ ግሱም በቅዱስ መንፈስ ላይ ሐዘን ማምጣትን የሚገልጸውን ግላዊና ግንኙነታዊ ኃይል ይጠብቃል።
- source_word: πνεῦμα τὸ ἅγιον τοῦ θεοῦ
  choice: የእግዚአብሔርን ቅዱስ መንፈስ
  rationale: ሙሉውን የግሪክ ሐረግ ጠብቆ፣ በዘመናዊ መደበኛ አማርኛ የተለመደውን መለኮታዊ ስያሜ ይጠቀማል።
- source_word: ἐν ᾧ
  choice: በእርሱ
  rationale: ἐν የሚለውን መስተዋድድ ይጠብቃል፤ እንዲሁም በግሪክ ጾታ-አልባ የሆነውን ሰዋሰዋዊ ቅርጽ እንደ ግዑዝ ኃይል ሳያቀርብ፣ የሚያሳዝነውን ቅዱስ መንፈስ በግላዊ ተውላጠ ስም ያመለክታል።
- source_word: ἐσφραγίσθητε
  choice: ታትማችኋል
  rationale: ያለፈ ድርጊትንና ተደራጊ ቅርጹን በአጭር ተፈጥሯዊ አማርኛ ያሳያል፤ የማኅተምን ምሳሌያዊ ትርጉምም ሳይተነትን ይጠብቃል።
- source_word: εἰς ἡμέραν ἀπολυτρώσεως
  choice: ለቤዛው ቀን
  rationale: εἰς ያለውን ወደፊት የሚያመለክት የዓላማ ወይም የመድረሻ ኃይል በ«ለ» ይጠብቃል። «ቤዛው ቀን» ከአውዱ የሚታወቀውን የመጨረሻ ነፃ መውጣት ያመለክታል፣ ነገር ግን ከጽሑፉ በላይ ዝርዝር የሥነ መለኮት አቋም አይጨምርም።
theological_decisions:
- issue: በአገናዛቢው ሐረግ ውስጥ ቅዱስ መንፈስን በግላዊ ሁኔታ ማመልከት
  choice: «በእርሱ»
  alternative: «በእሱ ነገር» ወይም ግዑዝ አመልካች
  rationale: የግሪኩ ἀναφορικό ተውላጠ ስም ከπνεῦμα ጋር በሰዋሰዋዊ ጾታ የተስማማ ቢሆንም፣ ተጠቃሹ ሊያዝን የሚችለው ቅዱስ መንፈስ ነው። ስለዚህ ግላዊ አመልካቹ የጽሑፉን ሐሳብ ሳያዳክም ያቀርባል።
- issue: መታተሙ ከቤዛው ቀን ጋር ያለው ግንኙነት
  choice: «ለቤዛው ቀን»
  alternative: «እስከ ቤዛው ቀን»
  rationale: ዋናው ትርጉም εἰς ያለውን የዓላማ/መድረሻ ኃይል ይጠብቃል፤ «እስከ» የሚለው ጊዜያዊ ንባብ ግን በማስታወሻ ቀርቧል። በዚህም ጽሑፉ ያልወሰነው ሰፊ የሥነ መለኮት ክርክር በትርጉሙ አይወሰንም።
