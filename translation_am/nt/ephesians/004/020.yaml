language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ οὐχ οὕτως ἐμάθετε τὸν Χριστόν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/020.yaml
  text: But you did not learn Messiah in this way,[a]
translation:
  language: am
  text: እናንተ ግን መሲሑን እንደዚህ አልተማራችሁም።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እናንተ ግን ክርስቶስን እንደዚህ አልተማራችሁም።»
    reason: Χριστόςን በተለመደው ‘ክርስቶስ’ ቅርጽ የሚያቀርብ አማራጭ ትርጉም።
lexical_decisions:
- source_word: ὑμεῖς
  choice: እናንተ
  rationale: ግልጽ የሆነውን የሁለተኛ መደብ ብዙ ቁጥር ተውላጠ ስም እና ከቀደመው ንግግር ጋር ያለውን አጽንዖት ይጠብቃል።
- source_word: δὲ
  choice: ግን
  rationale: ከቀደመው የአሕዛብ አካሄድ ገለጻ ጋር ያለውን ተቃርኖ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οὐχ οὕτως
  choice: እንደዚህ አል...ም
  rationale: οὕτως የአድራጎቱን መንገድ ስለሚያመለክት፣ በቀደመው ክፍል ከተገለጸው አኗኗር ጋር ያለውን ንጽጽር ይጠብቃል።
- source_word: ἐμάθετε
  choice: ተማራችሁ
  rationale: የμανθάνωን ‘መማር’ የሚል መሠረታዊ ፍቺ ይጠብቃል፤ ‘ተማራችሁ’ እዚህ አድራጊ ቅርጽ ነው እንጂ ‘ተማራችሁት/ተማራችሁለት’ የሚል ተጨማሪ ትርጓሜ አያስገባም።
- source_word: τὸν Χριστόν
  choice: መሲሑን
  rationale: Χριστός የቅብዓት ማዕረጉን ስለሚይዝ ‘መሲሕ’ ተብሎ ተተርጉሟል፤ የግሪኩ የተወሰነ ቅርጽና የቀጥታ ተሳቢነት ‘መሲሑን’ በሚለው ተጠብቋል። ‘መሲሑን መማር’ የሚለው ያልተለመደ አነጋገር ሐዋርያዊውን አገላለጽ ለመጠበቅ አልተብራራም።
theological_decisions:
- issue: Χριστόνን እንደ ማዕረግ ወይም እንደ ስም መተርጎም
  choice: መሲሑን
  alternative: ክርስቶስን
  rationale: በዚህ አውድ Χριστός የተስፋውን የተቀባ ንጉሥ ማዕረግ ሊያሳይ ስለሚችል ‘መሲሑን’ በዋናው ጽሑፍ ተመርጧል። ሆኖም ‘ክርስቶስን’ የሚለው የተለመደ ስም-መሰል አተረጓጎም በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ‘መሲሑን መማር’ የሚለው ሥነ ንግግራዊ ውጥረት ወደ ‘ስለ መሲሑ መማር’ ተብሎ ሳይፈታ ተጠብቋል።
