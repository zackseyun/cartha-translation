  rationale: የቅርብ ዐውዱ ክርስቶስን ያመለክታል፤ የዓረፍተ ነገሩ ዋና ግስ ግን መላውን አካል እንደ ሰዋስዋዊ ባለቤት ያቀርባል። ትርጉሙ ሁለቱንም ውጥረቶች ይጠብቃል።
- issue: የἁφή τῆς ἐπιχορηγίας የአካል ምስል
