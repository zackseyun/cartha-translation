lexical_decisions:
- source_word: μηδὲ
  choice: -ም … አት-
  rationale: ከቀደመው ምክር ጋር ያለውን ቀጣይነትና ክልከላውን በተፈጥሯዊ የአማርኛ አገባብ ያሳያል።
- source_word: δίδοτε
  choice: አትስጡ
  rationale: የብዙ ቁጥር የክልከላ ትእዛዙን በቀጥታ ይገልጻል።
- source_word: τόπον
  choice: ዕድል
  rationale: ቃሉ በቀጥታ ‘ስፍራ’ ማለት ቢሆንም፣ በዚህ አገባብ ለድርጊት መንገድ ወይም አጋጣሚ መስጠትን ያመለክታል፤ ‘ዕድል’ ይህን በዘመናዊ አማርኛ በግልጽ ያስተላልፋል።
- source_word: τῷ διαβόλῳ
  choice: ለዲያብሎስ
  rationale: በዚህ አውድ διάβολος የግል ክፉውን ባላጋራ የሚያመለክት መጠሪያ ነው፤ ‘ዲያብሎስ’ በአማርኛ የተለመደና ትክክለኛ አቻ ነው።
theological_decisions:
