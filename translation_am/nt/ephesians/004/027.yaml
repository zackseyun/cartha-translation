  choice: ዲያብሎስ
  alternative: ሐሜተኛው
  rationale: ከጳውሎስ የምክር አውድና ከተወሰነው መስተዋድድ ጋር፣ አገላለጹ በተለምዶ የግል ክፉውን ባላጋራ ያመለክታል፤ ትርጉሙም ከጽሑፉ በላይ ሳይስፋፋ ይህን ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለሕዝብ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ቃል በቃል አገላለጽ በማስታወሻ ተጠብቆ፣ በዋናው ጽሑፍ የአገባቡ ትርጉም ተሰጥቷል።
