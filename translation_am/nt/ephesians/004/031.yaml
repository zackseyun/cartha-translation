  rationale: በዙሪያው ያሉት ቃላት የሰዎችን ግንኙነት የሚያፈርሱ አመለካከቶችንና ንግግሮችን ይጠቅሳሉ። ስለዚህ ‘ስድብ’ ለአውዱ ይስማማል፤ ሆኖም የግሪኩ ቃል ሰፋ ያለ ጎጂ ንግግርን ሊያመለክት ስለሚችል አማራጩ በማስታወሻ ተጠብቋል።
