  yaml_path: translation/nt/ephesians/004/031.yaml
  text: Let all bitterness and wrath and anger and clamor and slander be taken away from you[a], along with all malice.
translation:
  language: am
  text: መራርነት፣ ንዴት፣ ቁጣ፣ ጩኸትና ስድብ ሁሉ ከእናንተ ይወገድ፤[a] ከክፋት ሁሉ ጋር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ስም ማጥፋት” ወይም “ጎጂ ንግግር”። በባህላዊ አጠቃቀም፣ “እግዚአብሔርን መሳደብ”። በዚህ አውድ የግሪኩ ቃል በሌሎች ላይ የሚነገር ጎጂ ንግግርን የሚያመለክት ይመስላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα πικρία
  choice: መራርነት … ሁሉ
  rationale: በሰዎች ላይ የሚኖርን የተከማቸ ቅሬታና ጥላቻ የሚያመለክተውን ቃል በተለመደው መጽሐፍ ቅዱሳዊ አማርኛ ያቀርባል፤ πᾶσα የዝርዝሩን ነገሮች በሙሉ ያጠቃልላል።
- source_word: θυμός
  choice: ቁጣ
  rationale: የሚገነፍል ወይም ኃይለኛ ስሜታዊ ቁጣን ያመለክታል፤ ከሚከተለው ὀργή ለመለየት ከ‘ንዴት’ ተለይቶ ቀርቧል።
- source_word: ὀργή
  choice: ንዴት
  rationale: θυμός ከተተረጎመበት ‘ቁጣ’ ለይቶ በተፈጥሯዊ አማርኛ የቁጣን ሁኔታ ያሳያል።
- source_word: κραυγή
  choice: ጩኸት
  rationale: በዚህ አውድ ጠላትነት የተሞላበትን ከፍ ያለ ድምፅ ወይም ጫጫታ በቀጥታና በግልጽ ያሳያል።
- source_word: βλασφημία
  choice: ስድብ
  rationale: በሰዎች መካከል ጉዳት የሚያደርስ የስድብና የስም ማጥፋት ንግግርን ለማካተት የሚችል ተፈጥሯዊ አማርኛ ነው።
- source_word: ἀρθήτω ἀφ’ ὑμῶν
  choice: ከእናንተ ይወገድ
  rationale: የግሪኩን ተገብሮ ትእዛዝና እነዚህ ነገሮች ከአማኞች ኑሮና ኅብረት እንዲጠፉ የሚሰጠውን ትእዛዝ ይጠብቃል።
- source_word: σὺν πάσῃ κακίᾳ
  choice: ክፋትም ሁሉ እንዲሁ
  rationale: σύν የሚያሳየውን አብሮ መወገድና πάσῃ የሚያሳየውን ሙሉ አጠቃላይነት ያስተላልፋል፤ ‘ክፋት’ በአውዱ ክፉ ሐሳብንና ተንኮልን ያካትታል።
theological_decisions:
- issue: በዚህ የሥነ ምግባር ዝርዝር ውስጥ βλασφημία የሚሰጠው ትርጉም
  choice: በሰዎች ላይ የሚነገር ‘ስድብ’
