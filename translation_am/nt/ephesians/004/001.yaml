    text: ወይም፣ «የጌታ እስረኛ» ወይም «ስለ ጌታ የታሰርሁ»።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ «የተጠራችሁበትን ጥሪ በሚገባ እንድትመላለሱ»።
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: እለምናችኋለሁ
  rationale: ቃሉ ጠንካራ የእረኝነት ልመናና ማሳሰቢያን ያመለክታል፤ «እለምናችኋለሁ» በዘመናዊ አማርኛ ይህን ኃይል በተፈጥሮ ያስተላልፋል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ሐሳብ የሚመጣውን ድምዳሜና ሎጂካዊ ግንኙነት ያሳያል።
- source_word: δέσμιος
  choice: እስረኛ
  rationale: የግሪኩን ቀጥተኛ ትርጉም ግልጽና ተፈጥሯዊ በሆነ አማርኛ ያቀርባል።
- source_word: ἐν κυρίῳ
  choice: በጌታ
  rationale: የጳውሎስን ሰፊ ሥነ መለኮታዊ አገላለጽ ሳያጠብ ይጠብቃል፤ ምክንያትን፣ ባለቤትነትን ወይም ኅብረትን ብቻ አድርጎ አይወስነውም።
- source_word: ἀξίως
  choice: በሚገባ
  rationale: ከተቀበሉት ጥሪ ጋር የሚስማማና የሚመጥን አኗኗርን በተፈጥሯዊ አማርኛ ያመለክታል።
- source_word: περιπατῆσαι
  choice: እንድትመላለሱ
  rationale: በጳውሎስ ጽሑፎች የአኗኗርን ሁኔታ የሚወክለውን የመራመድ ዘይቤ ይጠብቃል።
- source_word: κλήσεως
  choice: ጥሪ
  rationale: ከእግዚአብሔር የመጣውን ጥሪ በግልጽና የተለመደ መጽሐፍ ቅዱሳዊ ቃል ይገልጣል።
- source_word: ἧς ἐκλήθητε
  choice: ለተጠራችሁበት
  rationale: የግሪኩን የዝምድና ሐረግ በተፈጥሯዊ አማርኛ በማቅረብ ጥሪው እነርሱ የተጠሩበት መሆኑን ያሳያል።
theological_decisions:
- issue: ὁ δέσμιος ἐν κυρίῳ የሚለው የጳውሎስ ራስ-መግለጫ ትርጉም
  choice: በጌታ እስረኛ የሆንሁት
  alternative: የጌታ እስረኛ / ስለ ጌታ የታሰርሁ
  rationale: «በጌታ» የግሪኩን ቅድመ አቀማመጥ ሰፊነት ይጠብቃል፤ ጳውሎስ የጌታ እስረኛ መሆኑን፣ ስለ ጌታ መታሰሩን ወይም ከጌታ ጋር ባለው ኅብረት እስረኛ መሆኑን በአንዱ ፍቺ ብቻ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለሕዝብ በቀላሉ የሚገባ አማርኛ ተጠቅሟል። «እንድትመላለሱ» የሚለው የግሪኩን ዘይቤ ጠብቆ ሳለ፣ የአኗኗር ትርጉሙ በግርጌ ማስታወሻ ተገልጧል።
