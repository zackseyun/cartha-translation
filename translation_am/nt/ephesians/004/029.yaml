base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/029.yaml
  text: Let no rotten word come out of your mouth[a], but only such as is good for building up according to the need[d][c][b], so that it may give grace to those who hear.
translation:
  language: am
  text: ከአፋችሁ ምንም የበሰበሰ ንግግር[a] አይውጣ፤ ይልቁንም እንደ አስፈላጊነቱ ለማነጽ የሚጠቅም መልካም ንግግር ብቻ ይውጣ፤ ለሚሰሙት ጸጋን[b] እንዲሰጥ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የተበላሸ ንግግር” ወይም “ጎጂ ንግግር።” የግሪክኛው ቃል በቀጥታ “የበሰበሰ” ማለት ነው።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ጥቅምን።”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς λόγος σαπρὸς
  choice: ምንም የበሰበሰ ንግግር
  rationale: ከክልከላው ጋር πᾶς የሚሰጠውን ‘አንድም/ምንም … አይ’ የሚል አከፋፋይ ትርጉም ያሳያል። λόγος እዚህ ንግግርን ያመለክታል፤ σαπρός ያለውን ግልጽ የመበስበስ ምስል ‘የበሰበሰ’ ይጠብቃል።
- source_word: ἐκ τοῦ στόματος ὑμῶν μὴ ἐκπορευέσθω
  choice: ከአፋችሁ … አይውጣ
  rationale: የንግግር ከአፍ መውጣትን የሚያሳየውን አካላዊ ምስልና የትእዛዝ ክልከላውን በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: ἀλλὰ εἴ τις ἀγαθὸς
  choice: ይልቁንም … የሚጠቅም መልካም ንግግር ብቻ
  rationale: በግሪክኛው የተተወውን λόγος በአማርኛ በግልጽ በመድገም፣ ከመጥፎው ንግግር ጋር ያለውን ተቃርኖ ተፈጥሯዊ ያደርጋል። ‘ብቻ’ የተፈቀደው መልካም ንግግር መሆኑን ያብራራል።
- source_word: πρὸς οἰκοδομὴν τῆς χρείας
  choice: ለሚያስፈልገው መታነጽ የሚጠቅም
  rationale: οἰκοδομή ያለውን የመገንባት ምስል ‘መታነጽ’ ይጠብቃል። የታመቀውን τῆς χρείας ግንኙነት ‘ለሚያስፈልገው’ ብሎ በመተርጎም፣ ንግግሩ ያለውን ፍላጎት ወይም ጉድለት ሊያንጽ እንደሚገባ ያሳያል።
- source_word: ἵνα δῷ χάριν τοῖς ἀκούουσιν
  choice: ለሚሰሙት ጸጋን እንዲሰጥ
  rationale: ἵνα የዓላማ/ውጤት አገላለጽ በ‘እንዲሰጥ’ ተጠብቋል። χάρις እዚህ ‘ጥቅም’ ሊሆን ቢችልም፣ ‘ጸጋ’ የቃሉን ሰፊ ጳውሎሳዊና ግንኙነታዊ ድምፅ ይጠብቃል።
theological_decisions:
- issue: በሥነ ምግባራዊ ምክር ውስጥ χάριν መተርጎም
  choice: ጸጋን
  alternative: ጥቅምን
  rationale: አውዱ ንግግር ሰሚዎችን ስለሚጠቅምበት ሁኔታ ነው፤ ስለዚህ ‘ጥቅም’ የሚለው ይቻላል። ሆኖም ‘ጸጋ’ የχάριςን መሠረታዊና ጳውሎሳዊ ድምፅ ሳይጠብ ያቆያል፤ አማራጩም በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘የበሰበሰ ንግግር’ የምንጩን ሕያው ዘይቤ ይጠብቃል፤ ‘መታነጽ’ ደግሞ የοἰκοδομήን የግንባታ ምስል በተለመደ መጽሐፍ ቅዱሳዊ ነገር ግን ተረዳጅ ቋንቋ ያቀርባል።
