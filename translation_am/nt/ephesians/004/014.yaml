  alternative: ማታለል / ማሳሳት
  rationale: πλάνη ስህተትን፣ መሳሳትን ወይም ማሳሳትን ሊያመለክት ይችላል። ‘ስህተት’ ይህን ትርጉማዊ ክፍትነት ይጠብቃል፤ ሆን ተብሎ የሚደረገውን ማታለል ደግሞ በአቅራቢያው ‘የሰዎች ማታለያ’ እና ‘ተንኮል’ ይገልጻሉ።
- issue: πρὸς τὴν μεθοδείαν ያለው ግንኙነት
  choice: ወደ ስህተት ሴራ በሚያመራ
  alternative: በስህተት ሴራ ውስጥ
  rationale: πρός በዚህ አስቸጋሪና የተጨመቀ ሐረግ ውስጥ አቅጣጫን ወይም ዓላማን ሊያሳይ ይችላል። የተመረጠው አተረጓጎም ይህን ኃይል ሳያጠፋ በአማርኛ እንዲነበብ ያደርገዋል።
