    text: «የሰዎች ማታለያ» የሚለው ቃል በቃል «የሰዎች የዳይስ ጨዋታ» ማለት ነው፤ እዚህ ግን በጨዋታ የሚደረግን ማጭበርበር የሚያመለክት ምስል ነው። የመጨረሻው ሐረግ «በማሳሳት ሴራ ውስጥ» ተብሎም ሊተረጎም ይችላል።
