  rationale: የተገብሮ መንቀሳቀሱንና የነፋሱን ምስል ይጠብቃል፤ διδασκαλίαን ከሚያስፈልገው በላይ ቴክኒካዊ ሳያደርግ ‘ትምህርት’ ብሎ ይተረጉማል።
- source_word: ἐν τῇ κυβείᾳ τῶν ἀνθρώπων
