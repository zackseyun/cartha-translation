  text: ከእንግዲህ ወዲህ ሕፃናት እንዳንሆን፤ በማዕበል እየተናወጥንና በትምህርት ነፋስ ሁሉ ወዲያ ወዲህ እየተነዳን፣ በሰዎች ማታለያና ወደ ስህተት ሴራ በሚያመራ ተንኮል የተነሣ።[a]
  philosophy: optimal-equivalence
