  text: The one who steals must steal no longer[a], but rather must labor, doing good work with his own hands[b], so that he may have something to share with the one who has need.
translation:
  language: am
  text: የሚሰርቅ ሰው ከእንግዲህ ወዲህ አይስረቅ፤ ይልቁንም በገዛ እጆቹ መልካም የሆነውን[a] እየሠራ በትጋት ይሥራ፤ ይህም እጥረት ላለበት ሰው[b] የሚያካፍለው እንዲኖረው ዘንድ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «መልካም ሥራ እየሠራ»።
