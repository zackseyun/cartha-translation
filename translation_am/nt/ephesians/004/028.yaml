review_pass:
  verdict: revise
  source_fidelity: The draft conveys the main contrast—ceasing theft, undertaking honest productive labor, and sharing with a person in need. However, «መልካም ሥራ» narrows τὸ ἀγαθόν (“what is good”) more than necessary, and the purpose clause is more directly and idiomatically rendered without the explanatory «ይህም ... ነው».
  naturalness: The proposed revision uses clear modern standard Amharic. It retains the emphatic personal-labor sense of «በገዛ እጆቹ» and expresses the purpose of the labor in a direct, natural construction.
  terminology: «መልካም የሆነውን» preserves the substantival breadth of τὸ ἀγαθόν, while the footnote supplies «መልካም ሥራ» as a contextually viable alternative. «እጥረት ላለበት ሰው» represents the person who has need without restricting the need to a particular kind of hardship.
  issues:
  - severity: medium
    issue: The primary rendering «መልካም ሥራ» is somewhat narrower than τὸ ἀγαθόν.
    rationale: The Greek substantival adjective can mean “what is good” and does not explicitly limit the object to a discrete “good job/work.” A broader primary rendering better preserves the source wording, with “good work” retained as an alternative.
  - severity: low
    issue: «ይህም ... ነው» makes the purpose clause less direct.
    rationale: ἵνα ἔχῃ directly states the intended result of labor. «... እንዲኖረው ዘንድ» expresses that purpose clearly and naturally in Amharic.
  revised_text: የሚሰርቅ ሰው ከእንግዲህ ወዲህ አይስረቅ፤ ይልቁንም በገዛ እጆቹ መልካም የሆነውን[a] እየሠራ በትጋት ይሥራ፤ ይህም እጥረት ላለበት ሰው[b] የሚያካፍለው እንዲኖረው ዘንድ ነው።
