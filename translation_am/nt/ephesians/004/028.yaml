- source_word: τῷ χρείαν ἔχοντι
  choice: ለተቸገረ ሰው
  rationale: በፍላጎት ወይም በእጥረት ውስጥ ያለውን ተቀባይ በተፈጥሯዊና በአሁናዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: የሥራ ሥነ ምግባራዊ ዓላማ
  choice: ታማኝ ሥራ የስርቆት ተቃራኒ ብቻ ሳይሆን ለተቸገረው ለማካፈል የሚያስችል መንገድ መሆኑን ግልጽ ማድረግ
  alternative: ዋና ትኩረቱን ራስን በራስ መቻል ወይም ካሳ መክፈል ላይ ማድረግ
  rationale: ግልጽ የሆነው የዓላማ አረፍተ ነገር የሥራውን ግብ ለተቸገረው ማካፈል እንደሆነ ያስቀምጣል። ራስን መደገፍ በተዘዋዋሪ ቢኖርም፣ ጽሑፉ ልግስናን በቀጥታ ያጎላል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። ‘በትጋት ይሥራ’ የግሪኩን የጥረት ጥንካሬ በተፈጥሯዊ አነጋገር ያሳያል፤ ‘የሚያካፍለው’ ደግሞ ልግስናን ያለ ቤተ እምነታዊ ጭማሪ ይገልጣል።
