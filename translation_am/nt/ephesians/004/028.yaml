lexical_decisions:
- source_word: ὁ κλέπτων
  choice: የሚሰርቅ ሰው
  rationale: የተወሰነውን የአሁን ጊዜ ተሳቢ እንደ ስም የሚሠራውን ቅርጽ ይጠብቃል፤ ሰውየውን ‘ሌባ’ ብሎ በቋሚ መለያ ከመሰየም ይልቅ የስርቆት ተግባሩን ያሳያል።
- source_word: μηκέτι κλεπτέτω
  choice: ከእንግዲህ ወዲህ አይስረቅ
  rationale: μηκέτι የቀድሞው ልማድ እንዲቋረጥ የሚያመለክተውን ጊዜያዊ ኃይል፣ κλεπτέτω ደግሞ የትእዛዙን ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋሉ።
- source_word: μᾶλλον δὲ
  choice: ይልቁንም
  rationale: ከስርቆት ወደ ትጉህና ታማኝ ሥራ ያለውን ጠንካራ ንፅፅር ያሳያል።
- source_word: κοπιάτω
  choice: በትጋት ይሥራ
  rationale: ከተራ ሥራ የበለጠ ድካምና ጥረት ያለበትን የκοπιάω ትርጉም እና የትእዛዝ ኃይሉን ይጠብቃል።
- source_word: ἐργαζόμενος ταῖς ἰδίαις χερσὶν τὸ ἀγαθόν
  choice: በገዛ እጆቹ መልካም ሥራ እየሠራ
  rationale: ተሳቢው የትጋት ሥራው እንዴት እንደሚፈጸም ያብራራል። ‘በገዛ እጆቹ’ የግልና ታማኝ ጥረትን፣ ‘መልካም ሥራ’ ደግሞ ከስርቆት ተቃራኒ የሆነውን ጠቃሚና ትክክለኛ ሥራ ያመለክታል።
- source_word: ἵνα ἔχῃ μεταδιδόναι
