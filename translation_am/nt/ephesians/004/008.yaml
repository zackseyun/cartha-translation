  text: Therefore it says[a], “Having ascended on high[b], he led captivity captive and gave gifts to men.”
translation:
  language: am
  text: ስለዚህ እንዲህ ይላል፦ “ወደ ከፍታ ወጥቶ፣ ምርኮን ማረከ[a]፤ ለሰዎችም[b] ስጦታዎችን ሰጠ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ምርኮኞችን ማርኮ ወሰደ” ወይም “ብዙ ምርኮኞችን ማረከ።” ግሪኩ መዝሙር 68፥18ን የሚያስታውስ፣ ከአንድ የቃል ሥር የተገኙ ስምና ግስ ያሉበት ጠንካራ አገላለጽ ነው።
    reason: lexical_alternative
  - marker: b
    text: እዚህ “ሰዎች” የሚለው የሰው ልጆችን በአጠቃላይ የሚያመለክት ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: ስለዚህ
  rationale: የቀደመውን ሐሳብ ከጥቅሱ ጋር የሚያገናኘውን የድምዳሜ ኃይል በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: λέγει
  choice: እንዲህ ይላል
  rationale: የግሪኩን የአሁን ጊዜ ግስ ጠብቆ ለቅዱስ መጽሐፍ ጥቅስ መግቢያ ተፈጥሯዊ የሆነ አገላለጽ ነው፤ በግሪኩ ያልተገለጸውን ባለቤት በስም አይወስንም።
- source_word: Ἀναβὰς
  choice: ወጥቶ
  rationale: ዋናዎቹ ግሶች ከመፈጸማቸው በፊት የሆነውን መውጣት የግሪኩን የተውሳከ ግስ አወቃቀር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: εἰς ὕψος
  choice: ወደ ከፍታ
  rationale: የመዝሙር 68፥18ን ከፍ ያለ የግጥም ቃና ጠብቆ የወደላይ መውጣትንና ከፍ ያለ ስፍራን ያመለክታል።
- source_word: ᾐχμαλώτευσεν αἰχμαλωσίαν
  choice: ምርኮን ማረከ
  rationale: በአንድ ሥር የተዛመዱትን የግሪክ ግስና ስም በአማርኛም በተቀራራቢ ቃላት በማቅረብ የአገላለጹን ጥንካሬና የመዝሙሩን ጥቅስ ያቆያል።
- source_word: ἔδωκεν
  choice: ሰጠ
  rationale: ቀጥተኛ፣ ግልጽና በአማርኛ ተፈጥሯዊ የሆነ የመስጠት ግስ ነው።
- source_word: δόματα
  choice: ስጦታዎችን
  rationale: በዐውደ ንባቡ ያሉትን ብዙ ስጦታዎች በግልጽ ያስተላልፋል።
- source_word: τοῖς ἀνθρώποις
  choice: ለሰዎች
  rationale: ἄνθρωποι በዚህ ስፍራ የሰው ልጆችን በአጠቃላይ ሊያመለክት ስለሚችል፣ «ሰዎች» ትርጉሙን በትክክልና በተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: የመዝሙር 68፥18 ጥቅስ ላይ ያለውን የምርኮ ምስል መተርጎም
  choice: «ምርኮን ማረከ» የሚለውን ተዛማጅ አገላለጽ በዋናው ጽሑፍ ማቆየት
