  rationale: የግሪኩ አገላለጽ ጥቅጥቅ ያለና ለብዙ ትርጓሜዎች ክፍት ነው። ይህን በዋናው ጽሑፍ ማቆየት ምስሉን ያለጊዜው ወደ አንድ ትርጓሜ ከመገደብ ይቆጠባል።
- issue: τοῖς ἀνθρώποις የሚለው የሰዎች አመልካች
  choice: «ለሰዎች»
  alternative: «ለወንዶች» ወይም «ለሰው ልጆች»
  rationale: በዚህ አገባብ የግሪኩ ቃል ወንዶችን ብቻ እንደሚያመለክት ማስገደድ አይገባም፤ «ሰዎች» አጠቃላይ ሰብአዊ ትርጉሙን ይጠብቃል።
