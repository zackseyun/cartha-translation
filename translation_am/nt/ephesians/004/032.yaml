  text: And be kind to one another[a], tenderhearted, forgiving one another[b], just as God in Messiah forgave you.
translation:
  language: am
  text: እርስ በርሳችሁ ደጎችና ርኅሩኆች ሁኑ፤ እግዚአብሔር በመሲሑ ይቅር እንዳላችሁ እርስ በርሳችሁ ይቅር ተባባሉ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γίνεσθε
  choice: ሁኑ
  rationale: የብዙ ቁጥር ትእዛዛዊ ኃይሉንና ቀጣይ የባሕርይ ጥሪውን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: εἰς ἀλλήλους
  choice: እርስ በርሳችሁ
  rationale: የጋራና የተመላላሽ ግንኙነቱን በተለመደ አማርኛ ይገልጣል።
- source_word: χρηστοί
  choice: ደጎች
  rationale: በሰዎች መካከል የሚታይ ቸርነትንና ደግነትን በግልጽ ያሳያል።
- source_word: εὔσπλαγχνοι
  choice: ርኅሩኆች
  rationale: ከልብ የሚመነጭ ርኅራኄን ያስተላልፋል፤ ከ‘ደጎች’ ጋርም ሳይዋሐድ የተለየውን ስሜታዊ ገጽታ ይጠብቃል።
- source_word: χαριζόμενοι ἑαυτοῖς
  choice: እርስ በርሳችሁ ይቅር ተባባሉ
  rationale: በዐውዱ የበደል ስርየትን የሚያመለክተውን ተሳቢ ድርጊት በተፈጥሯዊና ተመላላሽ አማርኛ ይገልጣል።
- source_word: καθὼς καὶ
  choice: እንደ... እናንተም
  rationale: የንጽጽሩን ኃይልና በκαί ያለውን ተጓዳኝ አጽንዖት በተፈጥሯዊ የአማርኛ አወቃቀር ይጠብቃል።
- source_word: ἐν Χριστῷ
  choice: በመሲሑ
  rationale: Χριστόςን እንደ ማዕረግ ‘መሲሕ’ ብሎ ይተረጉማል፤ ἐν የሚለውንም ‘በ’ በማለት ሳይፈታ ይጠብቃል።
- source_word: ἐχαρίσατο ὑμῖν
  choice: ይቅር እንዳላችሁ
  rationale: የእግዚአብሔርን የተፈጸመ የይቅርታ ድርጊትና የብዙ ቁጥር ተቀባዮቹን በግልጽ ያስተላልፋል።
theological_decisions:
- issue: የΧριστῷ አተረጓጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: ቃሉ በዚህ ስፍራ የቅቡዕነት ማዕረግን ስለሚያመለክት ‘መሲሑ’ ተብሎ ተተርጉሟል፤ የተለመደውን የድምፅ ቅጂ በዋናው ጽሑፍ አልተመረጠም።
- issue: ἐν Χριστῷ የሚያመለክተው ግንኙነት
  choice: በመሲሑ
  alternative: በመሲሑ አማካይነት
  rationale: ግሪኩ ‘በመሲሑ ውስጥ’ ወይም ‘በመሲሑ አማካይነት’ የሚሉ ተዛማጅ ገጽታዎችን ሊሸከም ስለሚችል፣ አሻሚነቱን ሳይዘጋ ቀጥተኛው ‘በመሲሑ’ ተመርጧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለሰፊ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ተሳቢ አወቃቀር በአማርኛ ተፈጥሯዊ በሆኑ ተከታታይ ትእዛዞች ተተርጉሟል። በቀረበው የእንግሊዝኛ ማማከሪያ ውስጥ የግርጌ ማስታወሻዎቹ ከማመልከቻ ቦታዎቻቸው ጋር ስለማይጣጣሙና ለዚህ የአማርኛ ንባብ አስፈላጊ ያልሆነ ንባብ ስለማይጨምሩ አልተካተቱም።
