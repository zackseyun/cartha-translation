source:
  edition: SBLGNT
  text: τὸ δὲ Ἀνέβη τί ἐστιν εἰ μὴ ὅτι καὶ ⸀κατέβη εἰς τὰ κατώτερα μέρη τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/009.yaml
  text: What does “he ascended” mean except that he also descended into the lower parts of the earth?[a]
translation:
  language: am
  text: «ዐረገ» የሚለው፣ እርሱ ደግሞ ወደ የምድር ዝቅተኛ ክፍሎች ወረደ ማለት ካልሆነ፣ ምን ማለት ነው?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወደ ታችኛ ስፍራዎች፣ ማለትም ወደ ምድር።” ይህ ሐረግ በቀላሉ ወደ ምድር መውረዱን ወይም በተለይ ወደ ሙታን ዓለም መውረዱን ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀνέβη
  choice: ዐረገ
  rationale: የወደ ላይ እንቅስቃሴውን በአጭርና በተፈጥሯዊ አማርኛ ያሳያል፤ በዐውዱም «ወረደ» ከሚለው ጋር ያለውን ተቃርኖ ይጠብቃል።
- source_word: τί ἐστιν εἰ μὴ ὅτι
  choice: … ማለት ካልሆነ ምን ማለት ነው?
  rationale: የግሪኩን የጥያቄና የመደምደሚያ ኃይል በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: καὶ κατέβη
  choice: እርሱ ደግሞ … ወረደ
  rationale: καί ያለውን የመጨመር ሐሳብ «ደግሞ» ይጠብቃል፤ «ወረደ»ም «ዐረገ» ከሚለው ጋር ያለውን ትይዩነት ያሳያል።
- source_word: εἰς
  choice: ወደ
  rationale: ወደ አንድ ስፍራ የሚደረግን እንቅስቃሴ በግልጽ ያመለክታል።
- source_word: τὰ κατώτερα μέρη
  choice: የታችኛዎቹ ክፍሎች
  rationale: የንጽጽር ትርጉሙንና የ«ክፍሎች/ስፍራዎች» ክፍት ሐሳብ ይጠብቃል፤ አስቀድሞ የሙታን ዓለም ብሎ አይተረጉመውም።
- source_word: τῆς γῆς
  choice: የምድር
  rationale: γῆ በዚህ ዐውድ «ምድር» ተብሎ በተፈጥሯዊነት ይተረጎማል፤ የግሪኩ ሐረግ የምድር ክፍሎችን ወይም ምድርን ራሷን እንደ ታችኛ ስፍራ ሊያመለክት የሚችለው አሻሚነት በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: εἰς τὰ κατώτερα μέρη τῆς γῆς የሚለው ሐረግ ትርጓሜ
  choice: ወደ ምድር የታችኛዎቹ ክፍሎች
  alternative: ወደ ታችኛዎቹ ስፍራዎች፣ ማለትም ወደ ምድር፤ ወይም ወደ ሙታን ዓለም
  rationale: የግሪኩ ሐረግ ከሰማይ በተቃራኒ ወደ ምድር መውረድን ወይም በተለይ ወደ ሙታን ዓለም መውረድን ሊያመለክት ይችላል። ዋናው ጽሑፍ አንዱን የእምነት ትርጓሜ ሳይወስን የሐረጉን አሻሚነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ዐረገ/ወረደ» የሚለው አጭር ትይዩ አገላለጽ የምንጩን ቀጥ ያለ የከፍታና የዝቅታ ምስል ይጠብቃል።
