translation:
  language: am
  text: 'ቅዱሳንን ለማስታጠቅ፣ ለአገልግሎት ሥራ[a]፣ የመሲሑን[b] አካል ለማነጽ[c]፣


    [a] ወይም፣ “የአገልግሎት ሥራ።” የግሪክኛው διακονία “አገልግሎት” ወይም “ማገልገል” ማለት ሊሆን ይችላል።


    [b] ወይም፣ “የክርስቶስን።” እዚህ Χριστός እንደ ማዕረግ ስለተጠቀሰ፣ “መሲሕ” ተብሎ ተተርጉሟል።


    [c] የግሪክኛው አገባብ በተከታታይ ሊገባም ይችላል፤ ማለትም፣ “ቅዱሳንን ለአገልግሎት ሥራ ለማስታጠቅ፣ ይህም የመሲሑን አካል ለማነጽ ነው።”'
  philosophy: optimal-equivalence
  footnotes:
