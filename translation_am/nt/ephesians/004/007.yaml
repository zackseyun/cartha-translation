  register: ዘመናዊ፣ ክብር ያለውና ለመደበኛ አማርኛ አንባቢ ግልጽ የሆነ አገላለጽ ተጠቅሟል። ‘ከእኛ ለእያንዳንዳችን’ የሚለው ቅርጽ በግሪኩ ያለውን የግለሰብ አጽንዖት ይጠብቃል፤ የአረፍተ ነገሩ አቀማመጥም የምንጩን ትኩረት ሳያጠፋ በአማርኛ ተፈጥሯዊ እንዲሆን ተደርጓል።
