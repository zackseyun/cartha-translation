lexical_decisions:
- source_word: Ἑνὶ ... ἑκάστῳ ἡμῶν
  choice: ከእኛ ለእያንዳንዳችን
  rationale: ἑνὶ እና ἑκάστῳ ያላቸውን አጽንዖታዊ የስርጭት ሐሳብ ይጠብቃል፤ ጸጋው በማኅበሩ ውስጥ ላለው ለእያንዳንዱ ግለሰብ እንደተሰጠ ያሳያል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከቁጥር 4–6 የአንድነት አጽንዖት ወደ ጸጋ የተለያየ ክፍፍል የሚደረገውን ረጋ ያለ ንጽጽር በግልጽ ያመለክታል።
- source_word: ἐδόθη
  choice: ተሰጠ
  rationale: የግሪኩን አኦሪስት ተደራጊ ቅርጽ በተፈጥሯዊ የአማርኛ አገላለጽ ያስተላልፋል።
- source_word: ἡ χάρις
  choice: ጸጋ
  rationale: የጳውሎስን ዋና ሥነ መለኮታዊ ቃል ይጠብቃል፤ በዚህ አውድ ለአገልግሎት የሚከፋፈል ቸርነትና ኃይል የሚለውን ሐሳብ አያጠብም።
- source_word: κατὰ τὸ μέτρον
  choice: እንደ ... መጠን
  rationale: κατά የሚገልጸውን የመመዘኛ ወይም የተመጣጣኝነት ግንኙነት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τῆς δωρεᾶς
  choice: ስጦታ
  rationale: በነፃ የተሰጠን ነገር የሚያመለክተውን δωρεά በአጭርና በግልጽ ቃል ያስተላልፋል።
- source_word: τοῦ Χριστοῦ
  choice: የመሲሑ
  rationale: Χριστός በዚህ ስፍራ የማዕረጉን ትርጉም እንደያዘ በመቁጠር ‘መሲሕ’ ተብሎ ተተርጉሟል፤ የወሰኑ ቅርጽ ‘መሲሑ’ በባለቤትነት አገባብ ‘የመሲሑ’ ሆኗል።
theological_decisions:
- issue: በዚህ አውድ የጸጋ ትርጉም
  choice: ‘ጸጋ’ በቤተ ክርስቲያን ውስጥ ለእያንዳንዱ የተከፋፈለ የቸርነት ስጦታና ለአገልግሎት የሚያበቃ ኃይልን ያመለክታል።
  alternative: አጠቃላይ መለኮታዊ ሞገስ፣ ወይም በጠባብ ትርጉሙ የድነት ጸጋ።
  rationale: ቁጥር 7–11 ከአንድነት ወደ ተለያዩ የአገልግሎት ስጦታዎች ይሸጋገራል። ሆኖም ግን ‘ጸጋ’ በማለት መተርጎሙ የቃሉን ሰፊ ሥነ መለኮታዊ ክብደትና ውጥረት ይጠብቃል።
- issue: Χριστοῦ እንደ ማዕረግ ወይም እንደ ስም መቅረቡ
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: በዚህ አገባብ የተቀባው ንጉሥ የሚለው የማዕረጉ ትርጉም ንቁ ሆኖ ስለሚታይ ‘መሲሑ’ ተመርጧል፤ ባህላዊው የድምፅ ዝውውር ‘ክርስቶስ’ በማስታወሻ ቀርቧል።
- issue: የτοῦ Χριστοῦ የባለቤትነት አገባብ
  choice: የመሲሑ ስጦታ
  alternative: መሲሑ የሚሰጠው ስጦታ
  rationale: የግሪኩ ጄኒቲቭ ስጦታው ከመሲሑ የመጣ ወይም የእርሱ የሆነ መሆኑን ሊያመለክት ይችላል። ‘የመሲሑ ስጦታ’ ይህን አሻሚነት ሳይፈታ ይጠብቃል።
