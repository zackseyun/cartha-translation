  text: one Lord[a], one faith, one baptism;
translation:
  language: am
  text: አንድ ጌታ፣ አንድ እምነት[a]፣ አንድ ጥምቀት፤
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: πίστις የሚለው ቃል «መታመን» ወይም «ታማኝነት» ተብሎም ሊተረጎም ይችላል፤ እዚህ ግን የጋራ አንድነት ላይ ካለው አጽንዖት ጋር «እምነት» የበለጠ ይስማማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς / μία / ἓν
  choice: አንድ
  rationale: በጾታ ከየስሞቹ ጋር የሚስማሙት ሦስቱ የግሪክ ቅርጾች አንድነትን ለማጉላት የተደጋገሙ ናቸው፤ በአማርኛም ትይዩነቱን ለመጠበቅ ሁሉም «አንድ» ተብለዋል።
- source_word: κύριος
  choice: ጌታ
  rationale: በዚህ የጳውሎስ አውድ የክርስቶስ ማዕረግን የሚያመለክተው የተለመደና ተፈጥሯዊ አተረጓጎም «ጌታ» ነው።
- source_word: πίστις
  choice: እምነት
  rationale: ቃሉ እምነትን፣ መታመንን ወይም ታማኝነትን ሊያመለክት ቢችልም፣ እዚህ የማኅበሩን የጋራ እምነት ወይም የማመን ምላሽ የሚያጎላው «እምነት» ከአውዱ ጋር ይስማማል።
- source_word: βάπτισμα
  choice: ጥምቀት
  rationale: ቃሉ የጥምቀትን ሥርዓት በትክክል የሚጠራ ሲሆን፣ «ጥምቀት» በዘመናዊ አማርኛ የተለመደና ግልጽ ነው።
theological_decisions:
- issue: «ጌታ» የሚለው ማንን እንደሚያመለክት
  choice: የክርስቶስ ማዕረግ ሆኖ «ጌታ» ተብሎ ተተርጉሟል፤ በኤፌሶን 4፥4-6 ፍሰት በተፈጥሮ ኢየሱስን ያመለክታል።
  alternative: በአጠቃላይ እግዚአብሔርን የሚያመለክት ሊሆን ይችላል።
  rationale: «አንድ መንፈስ»፣ «አንድ ጌታ» እና «የሁሉ አንድ አምላክና አባት» በሚለው ሦስትዮሽ አውድ፣ «ጌታ» በተፈጥሮ ወልድን ያመለክታል፤ ትርጉሙ ግን ከጽሑፉ በላይ አያብራራም።
- issue: «አንድ ጥምቀት» የሚለው ትርጉም
  choice: የጥምቀቱን አፈጻጸም፣ ውጤት ወይም ሥርዓታዊና መንፈሳዊ ገጽታውን ሳይወስን «አንድ ጥምቀት» ተብሎ በገለልተኛነት ተቀምጧል።
  alternative: በተለይ ሥርዓታዊ ጥምቀትን ማጉላት፣ ወይም በዋናነት ምሳሌያዊ/መንፈሳዊ ጥምቀትን ማመልከት።
  rationale: ቁጥሩ አንድነትን ያረጋግጣል እንጂ ስለ ጥምቀት ያሉትን የቤተ እምነት ክርክሮች በራሱ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ አጭር ሦስትዮሽ አወቃቀርና «አንድ» የሚለው ድግግሞሽ ተጠብቀዋል።
