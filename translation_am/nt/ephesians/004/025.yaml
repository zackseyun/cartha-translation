  rationale: ጽሑፉ የአካል ክፍሎችን ምስል በመጠቀም የአማኞችን ተያያዥነት ይገልጣል። የተመረጠው አገላለጽ ዘይቤውን በሚገባ ያስቀምጣል እንጂ ወደ ተቋማዊ አባልነት አይቀንሰውም።
