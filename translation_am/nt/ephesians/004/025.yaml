- issue: የψεῦδος ወሰን
  choice: ሐሰት
  alternative: ሐሰቱ
  rationale: ቅርብ አውዱ በአማኞች መካከል ሐሰተኛ ንግግርን በአጠቃላይ ከእውነት ጋር ያነጻጽራል። ነገር ግን የግሪኩ የተወሰነ መስተዋድድ ‘ሐሰቱ’ የሚለውን ቀጥተኛ አማራጭ ስለሚፈቅድ በማስታወሻ ተጠብቋል።
