  rationale: μέλη ያለውን የአካል ምስልና የማኅበሩን ተደጋጋፊነት በተፈጥሯዊ አማርኛ ይጠብቃል፤ ‘እርስ በርሳችን አባላት’ የሚለውን ያልተፈጥሯዊ አገላለጽ ያስወግዳል።
theological_decisions:
