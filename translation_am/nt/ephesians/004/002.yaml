  text: μετὰ πάσης ταπεινοφροσύνης καὶ πραΰτητος, μετὰ μακροθυμίας, ἀνεχόμενοι ἀλλήλων ἐν ἀγάπῃ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/002.yaml
  text: with all humility and gentleness, with patience, bearing with one another in love,
translation:
  language: am
  text: በፍጹም ትሕትናና የዋህነት፣ በትዕግሥትም፣ በፍቅር እርስ በርሳችሁ እየተቻቻላችሁ፤
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ πάσης
  choice: በፍጹም
  rationale: μετά ከግስ ስም ጋር አብሮነትን ያመለክታል፤ πάσης ደግሞ ባሕርዩን ሙሉ በሙሉ ያጠናክራል። በአማርኛ ‘በፍጹም’ ይህን አጠቃላይ ኃይል በተፈጥሮ ያስተላልፋል።
- source_word: ταπεινοφροσύνης
  choice: ትሕትና
  rationale: ቃሉ የአሳብና የአኗኗር ዝቅተኝነትን እንደ በጎ ምግባር ያመለክታል፤ ‘ትሕትና’ ዘመናዊና ክቡር አገላለጽ ነው።
- source_word: πραΰτητος
  choice: የዋህነት
  rationale: πραΰτης ራስን የመግዛት፣ ጨዋነትና ገርነት ያለበትን ባሕርይ ያመለክታል። ‘የዋህነት’ ይህን በተለመደ መጽሐፍ ቅዱሳዊ አማርኛ ያስተላልፋል።
- source_word: μακροθυμίας
  choice: ትዕግሥት
  rationale: ቃሉ በተለይ በሰዎች ግንኙነት ውስጥ ቁጣን በማዘግየት በጽናት መታገሥን ያመለክታል፤ ‘ትዕግሥት’ ግልጽና ተፈጥሯዊ ነው።
- source_word: ἀνεχόμενοι
  choice: ተቻቻሉ
  rationale: የአሁን ጊዜ አጋማሽ ድርጊቱ ቀጣይ የሆነ መቻቻልንና መታገሥን ያሳያል። ከቁጥር 1 የሚቀጥለውን ተግባራዊ ማሳሰቢያ በአማርኛ በተፈጥሮ ለማቅረብ ‘ተቻቻሉ’ ተመርጧል።
- source_word: ἀλλήλων
  choice: እርስ በርሳችሁ
  rationale: የመመላለስ ተውላጠ ስም ስለሆነ፣ ‘እርስ በርሳችሁ’ የጋራ ድርጊቱን በግልጽ ያሳያል።
- source_word: ἐν ἀγάπῃ
  choice: በፍቅር
  rationale: ἐν እዚህ መቻቻሉ የሚፈጸምበትን መንገድ ወይም የሕይወት ክልል ሊያመለክት ይችላል። ‘በፍቅር’ ሁለቱንም ዕድሎች ሳይገድብ ተፈጥሯዊ ነው።
theological_decisions:
- issue: የἀγάπη አተረጓጎም
  choice: ፍቅር
  alternative: ቸርነት
  rationale: ‘ፍቅር’ የἀγάπηን ሰፊ ግንኙነታዊና ሥነ ምግባራዊ ትርጉም በዘመናዊ አማርኛ በቀጥታ ያስተላልፋል፤ ‘ቸርነት’ ትርጉሙን ወደ በጎ አድራጎት ሊያጠብ ይችላል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ አጋማሽ ሐረግ በአማርኛ እንደ ቀጥተኛ ማሳሰቢያ ቀርቧል፤ ይህም ከቀዳሚው ቁጥር ጋር ያለውን አወቃቀራዊ ግንኙነት በተፈጥሮ ያስተላልፋል።
