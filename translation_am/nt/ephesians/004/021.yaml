lexical_decisions:
- source_word: εἴ γε
  choice: በእርግጥ … ከሆነ
  rationale: የሁኔታውን ቅርጽ እና γε የሚጨምረውን አጽንዖት ይጠብቃል፤ ንግግሩን ‘እንደሆነ’ ወይም ‘ስለሆነ’ ብሎ አይወስነውም።
- source_word: αὐτὸν ἠκούσατε
  choice: እርሱን ሰምታችሁት
  rationale: αὐτόν ቀጥተኛ ተሳቢ ስለሆነ ‘ስለ እርሱ ሰምታችኋል’ ብሎ ከማብራራት ይልቅ የግሪኩን አስገራሚ አገላለጽ ይጠብቃል።
- source_word: ἐν αὐτῷ
  choice: በእርሱ
  rationale: የአማርኛው ‘በ’ በእርሱ ውስጥ ያለ ሕብረትን፣ የተግባር ክልልን ወይም ቅርበትን ሊያመለክት ስለሚችል ሐረጉን በቀላሉ ‘ከእርሱ’ ወይም ‘በእርሱ አማካይነት’ ብሎ አይወስነውም።
- source_word: ἐδιδάχθητε
  choice: ተምራችሁ
  rationale: የግሪኩን ተገብሮአዊ ትርጉም በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: καθώς
  choice: እንዳለ
  rationale: በተማሩት ነገርና በኢየሱስ ውስጥ ባለው እውነት መካከል ያለውን የማነጻጸር ግንኙነት በአማርኛው የ‘እንደ’ አወቃቀር ያሳያል።
- source_word: ἀλήθεια
  choice: እውነት
  rationale: መስተዋድድ የሌለውን የግሪክ ስም በቀጥታ ይወክላል፤ ‘እውነታ’ ከሚለውም ይልቅ በዚህ ሥነ መለኮታዊ አውድ ተፈጥሯዊ ነው።
- source_word: ἐν τῷ Ἰησοῦ
  choice: በኢየሱስ
  rationale: የግል ስሙን ‘ኢየሱስ’ ይጠብቃል፤ ἐν ሊያመለክታቸው የሚችላቸውን ክልል፣ ሕብረትና ቅርበት አስቀድሞ በአንድ ትርጓሜ አይገድብም።
theological_decisions:
- issue: αὐτὸν ἠκούσατε በቀጥታ ‘እርሱን ሰማችሁ’ ወይስ በትርጓሜ ‘ስለ እርሱ ሰማችሁ’ ተብሎ ይተረጎም?
  choice: እርሱን ሰምታችሁት
  alternative: ስለ እርሱ ሰምታችሁ
  rationale: የቀጥተኛው ተሳቢ አወቃቀር የተመረጠውን ንባብ ይደግፋል፤ በሐዋርያዊው መልእክት ክርስቶስን ራሱን እንደ ሰሙ ሊያመለክት የሚችለውን ጥልቀት ሳያጠፋ ተለዋጩን በማስታወሻ ያቀርባል።
- issue: ἐν αὐτῷ እና ἐν τῷ Ἰησοῦ የሚያመለክቱት በእርሱ አማካይነት መማርን ብቻ ነው ወይስ ክልልን፣ ሕብረትንና ቅርበትንም ያካትታሉ?
  choice: በእርሱ / በኢየሱስ
  alternative: ከእርሱ / ከኢየሱስ ጋር ባለ ሕብረት
  rationale: ተደጋጋሚውን ἐν በተመሳሳይ ‘በ’ መተርጎም የጳውሎስን ሰፊ የሕብረትና የክልል አገላለጽ ይጠብቃል፤ ትርጉሙን በቀላሉ ወደ አድራጊነት አይቀንሰውም።
