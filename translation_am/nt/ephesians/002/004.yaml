  alternative: ለእኛ ባለው ታላቅ ፍቅር
  rationale: የስምና የግስ ድግግሞሹ የጳውሎስን አጽንዖት ይጠብቃል፤ ለስላሳ አማራጩ ይህን አጽንዖት ያሳንሳል።
- issue: የምሕረትና የፍቅር ግንኙነት
