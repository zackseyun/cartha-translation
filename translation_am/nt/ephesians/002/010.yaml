  text: αὐτοῦ γάρ ἐσμεν ποίημα, κτισθέντες ἐν Χριστῷ Ἰησοῦ ἐπὶ ἔργοις ἀγαθοῖς οἷς προητοίμασεν ὁ θεὸς ἵνα ἐν αὐτοῖς περιπατήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/010.yaml
  text: For we are his workmanship[a], created in Messiah Jesus for good works[b], which God prepared beforehand so that we might walk in them.
translation:
  language: am
  text: እኛ የእርሱ የእጅ ሥራ[a] ነንና፤ በመሲሑ ኢየሱስ ለመልካም ሥራዎች ተፈጥረናል። እኛም በእነርሱ እንድንመላለስ[b] እግዚአብሔር አስቀድሞ አዘጋጃቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የእጅ ሥራ” የተሠራ ወይም የተፈጠረ ነገርን፣ ማለትም የእግዚአብሔር ፍጥረት መሆናችንን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: እዚህ “መመላለስ” የሕይወት አካሄድን ወይም አኗኗርን የሚያመለክት ዘይቤ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ποίημα
  choice: የእጅ ሥራ
  rationale: የእግዚአብሔር የፈጠራ ውጤት መሆናችንን በተፈጥሯዊና በሚገባ ግልጽ አማርኛ ያሳያል፤ ተራውን ‘ሥራ’ ከማለትም የተሠራ ነገር የሚለውን ተጨባጭ ስሜት ይጠብቃል።
- source_word: κτισθέντες
  choice: ተፈጥረናል
  rationale: የግሪኩን የተደራጊ ቅርጽና የአዲስ ፍጥረት ሐሳብ ይጠብቃል፤ በአማርኛም ከዋናው አረፍተ ነገር ጋር ተፈጥሯዊ ነው።
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: በመሲሑ ኢየሱስ
  rationale: Χριστόςን እንደ ማዕረግ ‘መሲሕ’ በማለት ይተረጉማል፤ የአማርኛው የተወሰነ ቅጽ ‘መሲሑ’ ከኢየሱስ ጋር በተፈጥሯዊ ሁኔታ ይያያዛል።
- source_word: ἐπὶ ἔργοις ἀγαθοῖς
  choice: ለመልካም ሥራዎች
  rationale: ἐπί ከተሳቢ ጋር እዚህ የሚገልጸውን ዓላማ ወይም የታሰበ ውጤት በግልጽ ሁኔታ ያቀርባል።
- source_word: προητοίμασεν
  choice: አስቀድሞ አዘጋጃቸው
  rationale: προ- የሚለውን የቀደመ ጊዜ ማመልከቻ በግልጽ ይጠብቃል፤ ብዙ ቁጥር ያለውን ‘መልካም ሥራዎች’ም በቅጥያው ይመልሳል።
- source_word: ἐν αὐτοῖς περιπατήσωμεν
  choice: በእነርሱ እንድንመላለስ
  rationale: የጳውሎስን ‘መመላለስ’ ዘይቤ ይጠብቃል፤ ‘በእነርሱ’ የሚለውም መልካም ሥራዎቹን የሕይወት አካሄድ አድርጎ ያመለክታል።
- source_word: γάρ
  choice: ነንና
  rationale: ከቀደመው ንግግር ጋር ያለውን የምክንያትና የማብራሪያ ግንኙነት በተፈጥሯዊ የአማርኛ ቅጥያ ያሳያል።
theological_decisions:
- issue: Χριστῷን እንደ ማዕረግ ወይም እንደ ስም መቅረብ
  choice: በመሲሑ ኢየሱስ
  alternative: በክርስቶስ ኢየሱስ
  rationale: በዚህ ስፍራ Χριστός የተቀባውን ንጉሥ የሚያመለክት ማዕረግ ስለሆነ ‘መሲሕ’ ትርጉሙን በቀጥታ ይጠብቃል።
- issue: የእግዚአብሔር ቀድሞ ማዘጋጀትና የሰው አኗኗር ግንኙነት
  choice: እኛም በእነርሱ እንድንመላለስ እግዚአብሔር አስቀድሞ አዘጋጃቸው
  alternative: እኛ እንድንሠራቸው እግዚአብሔር አስቀድሞ ያዘጋጃቸው
  rationale: የመለኮታዊውን ቀዳሚ ተግባርና የሰውን የታሰበ አኗኗር ሁለቱንም ይጠብቃል፤ ጽሑፉ ከሚለው በላይ የቅድመ ውሳኔ ወይም የሰው ነፃነት ክርክርን አይፈታም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩን ቅደም ተከተል በከፊል በማስተካከል የአማርኛው ሐረግ ተፈጥሯዊ እንዲሆን ተደርጓል፤ ‘መመላለስ’ የሚለው የጳውሎስ ዘይቤ ግን ተጠብቋል።
