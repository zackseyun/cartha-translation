    issue: ‘ከሁሉ የሚበልጥ’ overstates ὑπερβάλλον.
    rationale: The Greek participle expresses an exceeding or surpassing quality, but does not explicitly compare grace’s riches with ‘everything/all others.’ ‘ከመጠን የሚበልጠው’ preserves the force without adding a superlative comparison.
  - severity: low
    issue: ‘ባለጠግነት’ is awkward in this figurative collocation.
    rationale: While intelligible, it commonly denotes being wealthy. ‘ብልጽግና’ more naturally conveys the abundant riches of divine grace in contemporary Amharic.
