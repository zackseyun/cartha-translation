id: EPH.2.7
reference: Ephesians 2:7
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἵνα ἐνδείξηται ἐν τοῖς αἰῶσιν τοῖς ἐπερχομένοις ⸂τὸ ὑπερβάλλον πλοῦτος⸃ τῆς χάριτος αὐτοῦ ἐν χρηστότητι ἐφ’ ἡμᾶς ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/007.yaml
  text: so that in the coming ages he might display the surpassing riches of his grace in kindness toward us in Messiah Jesus[a][b][c].
translation:
  language: am
  text: በሚመጡት ዘመናት በመሲሑ ኢየሱስ[a] ለእኛ ባለው ቸርነት ከመጠን የሚበልጠውን የጸጋውን ብልጽግና እንዲያሳይ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ግሪክ፦ «በክርስቶስ ኢየሱስ»፤ Χριστός በዚህ ስፍራ እንደ ማዕረግ ስለተወሰደ «በመሲሑ ኢየሱስ» ተብሎ ተተርጉሟል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: እንዲያሳይ ነው
  rationale: የዓላማን ወይም ከቀደመው ሐሳብ የሚመጣን ውጤት ያሳያል፤ በአማርኛም ተፈጥሯዊ የሆነውን የዓላማ አገባብ ይጠብቃል።
- source_word: ἐνδείξηται
  choice: እንዲያሳይ
  rationale: ቃሉ በግልጽ ማሳየትንና ማረጋገጥን ያመለክታል፤ «ማሳየት» ቀላል፣ ክቡርና ትርጉሙን የሚይዝ ነው።
- source_word: ἐν τοῖς αἰῶσιν τοῖς ἐπερχομένοις
  choice: በሚመጡት ዘመናት
  rationale: የαἰῶσινን ብዙ ቁጥርና ወደፊት መምጣታቸውን በቀጥታ ይጠብቃል።
- source_word: τὸ ὑπερβάλλον πλοῦτος
  choice: ከሁሉ የሚበልጥ ባለጠግነት
  rationale: ὑπερβάλλον የመብለጥንና ወሰን የለሽ ታላቅነትን ያሳያል፤ «ባለጠግነት» ደግሞ የπλοῦτοςን ምስላዊ ኃይል ይጠብቃል።
- source_word: τῆς χάριτος αὐτοῦ
  choice: የጸጋውን
  rationale: «ጸጋ» የመለኮታዊ ስጦታና ሞገስ ዋናውን የጳውሎስ አጠቃቀም የሚይዝ የተለመደ አማርኛ ቃል ነው።
- source_word: ἐν χρηστότητι ἐφ’ ἡμᾶς
  choice: ለእኛ ባለው ቸርነት
  rationale: የቸርነቱን ወደ እኛ መቅናት እና ጸጋው የሚገለጥበትን መንገድ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: በመሲሑ ኢየሱስ
  rationale: Χριστός በዚህ ስፍራ የቅብዓት ማዕረግነቱን ይዞ ስለሚገኝ «መሲሑ» ተብሎ ተተርጉሟል፤ «በ» ደግሞ ከመሲሑ ጋር ያለውን ኅብረት አያጠፋም።
theological_decisions:
- issue: Χριστῷ እንደ ማዕረግ ወይም እንደ ስም መቅረቡ
  choice: መሲሑ ኢየሱስ
  alternative: ክርስቶስ ኢየሱስ
  rationale: በዚህ የጳውሎስ አገላለጽ Χριστός ሙሉ በሙሉ እንደ ሁለተኛ ስም አልደበዘዘም፤ የተቀባውን ንጉሥ የሚያመለክተውን ማዕረግ ለማስጠበቅ «መሲሑ» ተመርጧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ብዙ ቁጥር («ዘመናት»)、የዓላማ አገባብ እና የ«በመሲሑ» ኅብረት አገላለጽ ተጠብቀዋል።
