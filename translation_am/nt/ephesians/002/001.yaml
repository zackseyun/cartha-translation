  text: Καὶ ὑμᾶς ὄντας νεκροὺς τοῖς παραπτώμασιν καὶ ταῖς ἁμαρτίαις ⸀ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/001.yaml
  text: And you were dead in your trespasses and sins,
translation:
  language: am
  text: እናንተም በበደሎቻችሁና በኃጢአቶቻችሁ ሙታን ነበራችሁ፤
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραπτώμασιν
  choice: በደሎቻችሁ
  rationale: παράπτωμα የሚያመለክተውን መተላለፍ ወይም ጥፋት በተፈጥሯዊና በዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἁμαρτίαις
  choice: በኃጢአቶቻችሁ
  rationale: ἁμαρτία የሚለውን የተለመደ መጽሐፍ ቅዱሳዊና ዘመናዊ አማርኛ ቃል በትክክል ይወክላል።
- source_word: νεκρούς
  choice: ሙታን
  rationale: መንፈሳዊ ሁኔታን የሚገልጠውን የግሪኩን ጠንካራ ምስል ሳያለዝብ ይጠብቃል።
- source_word: ὄντας
  choice: ነበራችሁ
  rationale: ተሳቢውን የግሪክ አገባብ ለአማርኛ ንባብ የተፈጥሮ የሆነ ግስ አድርጎ ይተረጉማል፤ ከቁጥር 2 ጋር ያለውን ያለፈ ሁኔታም ያመለክታል።
theological_decisions:
- issue: “ሙታን” የሚለው ምስላዊ አነጋገር
  choice: ሙታን ነበራችሁ
  alternative: በመንፈሳችሁ ሞታችሁ ነበር
  rationale: ምንጩ “በመንፈሳችሁ” የሚል ገላጭ ቃል አያክልም፤ ስለዚህ የጽሑፉን ምስልና ሥነ መለኮታዊ ውጥረት በቀጥታ ተጠብቋል።
- issue: የδοτική አገባብ ትርጉም
  choice: በበደሎቻችሁና በኃጢአቶቻችሁ
  alternative: ስለ በደሎቻችሁና ስለ ኃጢአቶቻችሁ
  rationale: ግሪኩ ምክንያትን ወይም የሕይወት መስክን ሊጠቁም ይችላል፤ “በ” ይህን አሻሚነት ከ“ስለ” ይልቅ በተሻለ ሁኔታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለሕዝብ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ Καὶ ὑμᾶς ከቀጣዩ ሐረግ ጋር የሚያያዝ ቢሆንም፣ ለቁጥሩ ሙሉ ንባብ “እናንተም ... ነበራችሁ” ተብሎ ቀርቧል፤ የመጨረሻው ፈንጠዝያ ሐረጉ በቀጣይ ቁጥር እንደሚቀጥል ያሳያል።
