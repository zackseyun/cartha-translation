review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the building metaphor, the broad genitive relationship in “of the apostles and prophets,” Messiah Jesus, and the cornerstone. However, ἐποικοδομηθέντες is an aorist passive participle, and ὄντος is likewise participial (a genitive absolute). Rendering both as independent finite clauses (“ታንጻችኋል ... ነው”) weakens the explicit syntactic connection and aspectual form of the Greek.
  naturalness: “በ... መሠረት ላይ ተገንብታችሁ” and “... ሆኖ” are natural, clear modern standard Amharic participial forms and allow this verse to remain appropriately connected to the preceding sentence.
  terminology: “መሠረት,” “ሐዋርያት,” “ነቢያት,” “መሲሕ ኢየሱስ,” and “የማዕዘን ድንጋይ” are suitable. “መሲሕ” appropriately preserves the titular sense of Χριστός; the alternative “ክርስቶስ ኢየሱስ” is properly retained in a note.
  issues:
  - severity: medium
    issue: The two Greek participial constructions are translated as finite clauses.
    rationale: The aorist passive participle ἐποικοδομηθέντες and the genitive-absolute participle ὄντος should, where natural in Amharic, be represented with participial forms. This preserves their dependence on the larger sentence and avoids turning the second phrase into an unqualified independent assertion.
