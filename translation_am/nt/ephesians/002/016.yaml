  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἀποκαταλλάξῃ τοὺς ἀμφοτέρους ἐν ἑνὶ σώματι τῷ θεῷ διὰ τοῦ σταυροῦ ἀποκτείνας τὴν ἔχθραν ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/016.yaml
  text: and might reconcile both to God in one body through the cross, having put the hostility to death by it.
translation:
  language: am
  text: ሁለቱንም በአንድ አካል በመስቀሉ አማካኝነት ከእግዚአብሔር ጋር ያስታርቅ ዘንድ፣ በእርሱ[a] ጥልን ገድሎ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም «በመስቀሉ»። በግሪኩ «በእርሱ» የሚለው ተውላጠ ስም ማጣቀሻው አወዛጋቢ ነው።
    reason: Preserves the disputed antecedent of ἐν αὐτῷ while giving the cross reading adopted by the English audit trail as an alternative.
lexical_decisions:
- source_word: ἀποκαταλλάξῃ
  choice: ያስታርቅ ዘንድ
  rationale: የግሪኩን የእርቅ ሐሳብና በአውዱ ያለውን የዓላማ አገባብ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τοὺς ἀμφοτέρους
  choice: ሁለቱንም
  rationale: በአውዱ የተጠቀሱትን ሁለት ወገኖች ሳይጨምር በቀጥታ ይወክላል።
- source_word: ἐν ἑνὶ σώματι
  choice: በአንድ አካል
  rationale: የምንጩን ምስላዊ አገላለጽና ሊኖረው የሚችለውን ድርብ ማጣቀሻ ይጠብቃል።
- source_word: διὰ τοῦ σταυροῦ
  choice: በመስቀሉ
  rationale: መስቀሉን የእርቁ መንገድ ወይም መሣሪያ አድርጎ ያቀርባል።
- source_word: ἀποκτείνας τὴν ἔχθραν
  choice: ጥላቻውን ገደለ
  rationale: ጠንካራውን የ‘መግደል’ ምስል ይጠብቃል፤ ἔχθραን በዘመናዊና ግልጽ ቃል ይተረጉማል።
- source_word: ἐν αὐτῷ
  choice: በመስቀሉ
  rationale: ቅርብ ቀዳሚውን ‘መስቀል’ እንደ ማጣቀሻ በመውሰድ ‘በእርሱ’ የሚለውን በአማርኛ ግልጽ ያደርጋል።
theological_decisions:
- issue: ‘በአንድ አካል’ የሚለው ማጣቀሻ
  choice: ምስሉን ሳይተረጉም ‘በአንድ አካል’ ብሎ መጠበቅ
  alternative: ‘በአንዲት ቤተ ክርስቲያን’ ወይም ‘በክርስቶስ አካል’ ብሎ መግለጽ
  rationale: ግሪኩ ምስሉን ክፍት ስለሚተው፣ ሊሆን የሚችለውን ሥነ መለኮታዊ ድርብ ማጣቀሻ በትርጉም አንድ ወገን አያደርግም።
- issue: ἐν αὐτῷ የሚለው የመጨረሻ ሐረግ
  choice: ‘በመስቀሉ’
  alternative: ‘በእርሱ’፣ ‘በራሱ’ ወይም ‘በአካሉ’
  rationale: የእንግሊዝኛው የምክክር ጽሑፍ ‘by it’ የሚለውን ይደግፋል፣ በግሪኩም ቅርብ ቀዳሚው መስቀል ነው፤ ሆኖም የተውላጠ ስሙ ሰዋሰዋዊ ማጣቀሻ ሙሉ በሙሉ ከክርክር ነፃ አይደለም።
- issue: የእርቁ አቅጣጫ
  choice: ‘ከእግዚአብሔር ጋር ያስታርቅ’
  alternative: ‘ለእግዚአብሔር ያስታርቅ’
  rationale: τῷ θεῷ የእርቁን ተቀባይ/አቅጣጫ ያሳያል፤ የአማርኛው ‘ከ…ጋር ማስታረቅ’ ተፈጥሯዊ ሲሆን ሰዎቹ ወደ እግዚአብሔር እርቅ መምጣታቸውን አይሰውርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። በአውዱ ከቀደመው የዓላማ ሐረግ ጋር እንዲቀጥል ‘ያስታርቅ ዘንድ’ ተመርጧል። ምንም የግርጌ ማስታወሻ ስላልተጨመረ በዋናው ጽሑፍ ምልክት የለም።
