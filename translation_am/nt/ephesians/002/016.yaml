  to: ሁለቱንም በአንድ አካል በመስቀሉ አማካኝነት ከእግዚአብሔር ጋር ያስታርቅ ዘንድ፣ በእርሱ[a] ጥልን ገድሎ።
  rationale: The revision keeps the source’s purpose construction and its “one body” image, changes the final verbal form to an Amharic participial construction corresponding to ἀποκτείνας, and avoids making an uncertain pronoun reference doctrinally or exegetically determinate. The footnote is anchored directly after the ambiguous pronoun.
