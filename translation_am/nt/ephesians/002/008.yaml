  text: τῇ γὰρ χάριτί ἐστε σεσῳσμένοι ⸀διὰ πίστεως· καὶ τοῦτο οὐκ ἐξ ὑμῶν, θεοῦ τὸ δῶρον·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/008.yaml
  text: For by grace you have been saved through faith[a], and this is not from yourselves[b]; it is the gift of God.
translation:
  language: am
  text: በጸጋ በእምነት ድናችኋልና፤ ይህም[a] ከእናንተ የመጣ አይደለም፤ የእግዚአብሔር ስጦታ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ይህ» የሚለው በተለይ እምነትን ብቻ ሳይሆን፣ «በጸጋ በእምነት መዳን» የተባለውን አጠቃላይ እውነታ የሚያመለክት መሆኑ ይበልጥ የተለመደ ግንዛቤ ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: χάριτί
  choice: በጸጋ
  rationale: በጳውሎስ አጠቃቀም χάρις ብዙውን ጊዜ የእግዚአብሔርን ነፃ ቸርነትና ሞገስ ያመለክታል፤ «ጸጋ» የተለመደውን መጽሐፍ ቅዱሳዊ ትርጉም በክብር ይጠብቃል።
- source_word: ἐστε σεσῳσμένοι
  choice: ድናችኋል
  rationale: የአሁን ጊዜ የεἰμί ቅርጽ ከፍጹም አንቀጽ ጋር የተጣመረው አወቃቀር የተፈጸመ የማዳን ድርጊትንና አሁንም የሚቀጥለውን ውጤቱን ያሳያል፤ «ድናችኋል» ይህን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: διὰ πίστεως
  choice: በእምነት
  rationale: διά ከዘር አገናዛቢ ጋር መንገድን ወይም መሣሪያን ያመለክታል፤ በአማርኛ «በእምነት» ይህን ትርጉም በተፈጥሯዊና በተለመደ መንገድ ይገልጣል።
- source_word: τοῦτο
  choice: ይህም
  rationale: ገለልተኛው አመልካች ተውላጠ ስም ከአንድ የሴት ፆታ ስም—χάρις ወይም πίστις—ጋር ብቻ ከመዛመድ ይልቅ ከፊቱ ያለውን አጠቃላይ የመዳን እውነታ ሊያመለክት ይችላል፤ «ይህም» የግሪኩን አጭርነትና የማጣቀሻውን ስፋት ይጠብቃል።
- source_word: οὐκ ἐξ ὑμῶν
  choice: ከእናንተ የመጣ አይደለም
  rationale: ἐκ ምንጭን ወይም መነሻን ያመለክታል፤ ይህ አገላለጽ የመዳኑ እውነታ ከአንባቢዎቹ እንዳልመነጨ በግልጽ ዘመናዊ አማርኛ ይገልጣል።
- source_word: θεοῦ τὸ δῶρον
  choice: የእግዚአብሔር ስጦታ ነው
  rationale: ይህ ሐረግ ከፊቱ የተጠቀሰውን እውነታ የእግዚአብሔር ስጦታ መሆኑን ይለያል፤ «ነው» መጨመሩ በአማርኛ የተሟላና ተፈጥሯዊ ዓረፍተ ነገር ያደርገዋል።
theological_decisions:
- issue: የτοῦτο («ይህ») ማጣቀሻ ከጸጋ፣ ከእምነትና ከመዳን ጋር ያለው ግንኙነት
  choice: «ይህ» በጸጋ በእምነት የመዳንን አጠቃላይ እውነታ እንደሚያመለክት ተቀርቧል።
  alternative: «ይህ» በተለይ እምነትን ብቻ ወይም ጸጋን ብቻ ሊያመለክት ይችላል።
  rationale: ገለልተኛው τοῦτο ከሴት ፆታ ካላቸው χάρις ወይም πίστις ጋር በቀጥታ አይስማማም፤ ስለዚህ ከፊቱ ያለውን ሐረግ በሙሉ እንደሚጠቅስ መረዳቱ ይበልጥ ተፈጥሯዊ ነው። ዋናው ጽሑፍ ግን «ይህም» ብሎ የግሪኩን አጭርነትና እውነተኛ የማጣቀሻ ስፋት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። «ጸጋ»፣ «እምነት» እና «እግዚአብሔር» የተለመዱ መጽሐፍ ቅዱሳዊ ቃላት ሲሆኑ፣ የዓረፍተ ነገሩ አወቃቀር ለዘመናዊ አንባቢ ተፈጥሯዊ እንዲሆን ተደርጓል።
