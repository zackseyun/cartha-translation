  alternative: ግርዛት በተባሉት / ‘ግርዛት’ በሚባሉት
  rationale: ሁለቱም ወገኖች ‘የሚባሉ’ መሆናቸውን የሚያሳየውን የግሪኩን አገላለጽ ይጠብቃል፤ የጳውሎስን ሊኖር የሚችል ሂሳዊ ርቀት ከመጠን በላይ አያጠናክርም።
- issue: ግርዛትና አለመገረዝ ያላቸው ተግባራዊ ፍቺ
  choice: በጥቅስ ምልክት የቀረቡ የወገን መለያዎች
  alternative: ንጹሕ አካላዊ ገለጻዎች
  rationale: ቃላቱ እዚህ ከአካላዊ ሁኔታ በላይ የብሔርና የኪዳን ማንነት መለያዎች ናቸው።
