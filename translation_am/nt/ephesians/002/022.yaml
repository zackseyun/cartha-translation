base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/022.yaml
  text: in whom you also are being built together into a dwelling place for God in the Spirit[a][b].
translation:
  language: am
  text: በእርሱ[a] እናንተም በመንፈስ[b] ለእግዚአብሔር ማደሪያ እንድትሆኑ አብራችሁ እየታነጻችሁ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ አመልካች ተውላጠ ስሙ በቀጥታ መሲሑን ሳይሆን መላውን ሕንፃ የሚያመለክት ከሆነ፣ “በዚያ።”
    reason: alternative_reading
  - marker: b
    text: ወይም፣ “በመንፈሳዊ ሁኔታ” ወይም “በመንፈስ አማካይነት።” ሐረጉ እግዚአብሔር የሚያድርበትን መንፈሳዊ ሁኔታ ወይም የመንፈስ ቅዱስን አድራጊነት ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: በእርሱ
  rationale: በቅርብ ያለውን የግል ቀዳሚ ስም፣ ክርስቶስን፣ እንደሚያመለክት በመውሰድ የግሪኩን ἐν በ‘በ-’ እና መስተዋድዱን በ‘እርሱ’ ተተርጉሟል።
- source_word: καὶ ὑμεῖς
  choice: እናንተም
  rationale: ግልጽ የሆነውን ብዙ ቁጥር ተውላጠ ስም ለአጽንዖት ይጠብቃል፤ ‘-ም’ የκαὶን ጨማሪ ኃይል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: συνοικοδομεῖσθε
  choice: አብራችሁ … እየታነጻችሁ ነው
  rationale: የአሁን ጊዜውን ቀጣይ ተግባር፣ ተደራጊ ቅርጹንና የσύνን ‘አብሮ’ ሐሳብ ይጠብቃል፤ ‘መታነጽ’ም የሕንፃውን ምስል ይይዛል።
- source_word: εἰς κατοικητήριον τοῦ θεοῦ
  choice: ለእግዚአብሔር ማደሪያ እንድትሆኑ
  rationale: εἰς የሚያመለክተውን ግብ ወይም ውጤት በ‘እንድትሆኑ’ ያቀርባል፤ κατοικητήριον የሚለው ለዘመናዊ አንባቢ ግልጽ በሆነው ‘ማደሪያ’ ተተርጉሟል።
- source_word: ἐν πνεύματι
  choice: በመንፈስ
  rationale: ‘መንፈስ’ የሚለው በዐውዱ በአብዛኛው መንፈስ ቅዱስን ያመለክታል፤ የአማርኛው ‘በ-’ የስፍራ/ሁኔታና የአድራጊነት ጥምር እድልን ሳይዘጋ ይጠብቃል።
theological_decisions:
- issue: የἐν ᾧ ቀዳሚ ስም
  choice: ክርስቶስን እንደሚያመለክት ‘በእርሱ’
  alternative: መላውን ሕንፃ እንደሚያመለክት ‘በእርሱም/በዚያም ሕንፃ’
  rationale: በቁጥር 20–21 ያለው የንግግር ፍሰት የሕንፃውን አንድነት በክርስቶስ ላይ ያተኩራል፤ ሆኖም የሕንፃው ማጣቀሻ ሰዋሰዋዊ ዕድል በማስታወሻ ተጠብቋል።
- issue: የἐν πνεύματι ትርጉም
  choice: መንፈስ ቅዱስን በሚያመለክት መልኩ ‘በመንፈስ’
  alternative: ‘በመንፈሳዊ ሁኔታ’ ወይም ‘በመንፈስ አማካይነት’
  rationale: የኤፌሶን መልእክት የቤተ መቅደስና የማደር ዐውድ መንፈስ ቅዱስን ያመለክታል፤ ነገር ግን ‘በ-’ የሚለው ቅጥያ ሐረጉ የማደሪያውን ሉል ወይም የመንፈስን አድራጊነት ሊጠቁም የሚችለውን ጥምር ትርጉም አይዘጋም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ማደሪያ’ እና ‘መታነጽ’ የቤተ መቅደስ/ሕንፃ ምስሉን ይጠብቃሉ፤ የግሪኩ ትርጉማዊ አሻሚነቶች በማስታወሻዎች ተገልጸዋል።
