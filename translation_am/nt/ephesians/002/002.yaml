- issue: υἱοῖς τῆς ἀπειθείας የሚለው ፈሊጣዊ አነጋገር
  choice: በዋናው ጽሑፍ ‘የአለመታዘዝ ልጆች’ ብሎ የፈሊጡን ቅርጽ ማቆየት
  alternative: ‘የማይታዘዙ ሰዎች’ ብሎ ሙሉ በሙሉ መፍታት
  rationale: ምንጩ የባሕርይ ወይም የቡድን አባልነት ፈሊጥ ይጠቀማል፤ የግልጽነት ማብራሪያው በግርጌ ማስታወሻ ተሰጥቷል።
