    text: ወይም፣ “ከሥራዎች።” ሐረጉ ምንጭን ወይም መነሻን ያመለክታል፤ አንዳንዶች “በሥራዎች” የሚል የመሣሪያነት ፍቺ እንዳለው ይረዱታል፣ የግሪኩ ቀጥተኛ አገላለጽ ግን “ከሥራዎች” የሚል ነው።
