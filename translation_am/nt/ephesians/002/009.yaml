  terminology: «ሥራዎች» properly retains the Greek term’s breadth without importing “law,” “good,” or “human” works. «ይመካ» is an appropriate equivalent for καυχήσηται. The footnote appropriately identifies the source/origin force of ἐξ without deciding the debated instrumental implication.
