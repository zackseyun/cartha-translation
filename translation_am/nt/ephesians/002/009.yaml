  verdict: revise
  source_fidelity: The draft accurately preserves the negation, the broad and unqualified term «ሥራዎች», and the sense of boasting. However, «ይህም ... ነው» recasts ἵνα as an explanatory assertion (“this is ...”) rather than retaining its purpose/result force.
