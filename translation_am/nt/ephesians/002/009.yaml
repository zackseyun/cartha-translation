lexical_decisions:
- source_word: οὐκ
  choice: አይደለም
  rationale: ክህደቱ ከἐξ ἔργων ሐረግ ጋር ተያይዞ በተፈጥሯዊ አማርኛ ተገልጧል።
- source_word: ἐξ
  choice: ከ… የተነሣ
  rationale: የምንጭን ወይም የመነሻን ሐሳብ ይጠብቃል፤ በመሣሪያነት ትርጉም ብቻ አይወስነውም።
- source_word: ἔργων
  choice: ሥራዎች
  rationale: ግሪኩ የሚለውን ሰፊ ቃል ሳያጠብ ይጠብቃል፤ ‘የሕግ ሥራዎች’ ወይም ‘መልካም ሥራዎች’ የሚል ያልተጻፈ ገደብ አያክልም።
- source_word: ἵνα
  choice: ይህም … ነው
  rationale: የዓላማ/ውጤት ግንኙነቱን ‘እንዳይ…’ ከሚለው አንቀጽ ጋር በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: μή τις
  choice: ማንም እንዳይ…
  rationale: አሉታዊውን ያልተወሰነ ነጠላ አገላለጽ ጾታ ሳይለይ በግልጽ አማርኛ ይሰጣል።
- source_word: καυχήσηται
  choice: ይመካ
  rationale: የκαυχάομαιን የመመካት/የመኩራራት ሐሳብ ይይዛል፤ ከእንዳይ ጋር የተያያዘውን የሐሳብ ዓላማ በተፈጥሯዊ መንገድ ያሳያል።
theological_decisions:
- issue: በጳውሎስ ንግግር ውስጥ ‘ሥራዎች’ የሚለው ትርጉም
  choice: ሐረጉን ‘ሥራዎች’ ብሎ ሰፊነቱን መጠበቅ
  alternative: ‘የሕግ ሥራዎች፣’ ‘የሰው ጥረት፣’ ወይም ‘መልካም ሥራዎች’ ብሎ ማጥበብ
  rationale: የግሪኩ ጽሑፍ ἔργων ብቻ ይላል። የሙሴን ሕግ፣ ሁሉንም የሰው ጥረት፣ ወይም መልካም ሥራዎችን ብቻ በትርጉሙ ውስጥ መጨመር ጽሑፉ ያልወሰነውን ትርጓሜ ይወስናል።
translation_notes:
