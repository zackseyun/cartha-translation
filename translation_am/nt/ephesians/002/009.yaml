    issue: The rendering of ἵνα as «ይህም ማንም እንዳይመካ ነው» changes the clause into an explanatory copular statement.
    rationale: ἵνα introduces the negative purpose/result clause. «ማንም እንዳይመካ ዘንድ» directly preserves this syntactic and semantic relationship without adding «ይህም» or «ነው».
