source:
  edition: SBLGNT
  text: ὅτι ⸀ἦτε τῷ καιρῷ ἐκείνῳ χωρὶς Χριστοῦ, ἀπηλλοτριωμένοι τῆς πολιτείας τοῦ Ἰσραὴλ καὶ ξένοι τῶν διαθηκῶν τῆς ἐπαγγελίας, ἐλπίδα μὴ ἔχοντες καὶ ἄθεοι ἐν τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/012.yaml
  text: that at that time you were without Messiah[a], alienated from the commonwealth of Israel and strangers to the covenants of the promise[c][b], having no hope and without God in the world.
translation:
  language: am
  text: በዚያን ጊዜ ከመሲሑ ውጭ እንደነበራችሁ፣ ከእስራኤል ማኅበረሰብ የተገለላችሁ፣ ከተስፋው ቃል ኪዳኖች እንግዶች እንደነበራችሁ፣ ተስፋ እንደሌላችሁና በዓለም ውስጥ ያለ አምላክ እንደነበራችሁ አስታውሱ።[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «መሲሕ» የሚለው «ክርስቶስ» ተብሎም ሊተረጎም ይችላል። የግሪኩ Χριστός ሁለቱንም አተረጓጎሞች ይፈቅዳል፤ እዚህ «መሲሕ» የማዕረጉን አይሁዳዊና ቃል ኪዳናዊ ትርጉም ያጎላል።
    reason: alternative_reading
  - marker: b
    text: «ያለ አምላክ» የሚለው «አምላክ የለሾች» ተብሎም ሊተረጎም ይችላል። ንግግሩ የዘመናዊ ፍልስፍና አምላክ ክህደትን ሳይሆን ከእውነተኛው አምላክ የተለየ መሆንን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς Χριστοῦ
  choice: ከመሲሑ የተለያችሁ
  rationale: Χριστός በዚህ የእስራኤልን ቃል ኪዳናዊ አውድ የሚያመለክት ማዕረግ ነው፤ «መሲሕ» የማዕረጉን ትርጉም ይጠብቃል። χωρὶς የመለየትንና ድርሻ የማጣትን ሁኔታ ያሳያል።
- source_word: ἀπηλλοτριωμένοι τῆς πολιτείας τοῦ Ἰσραήλ
  choice: ከእስራኤል ማኅበረሰብ የራቃችሁ
  rationale: ፍጹም ተደራጊ አንቀጽ ቀጣይ የመገለል ሁኔታን ያሳያል፤ πολιτεία እዚህ የእስራኤልን የጋራ ሕዝባዊና ማኅበራዊ ሥርዓት ያመለክታል።
- source_word: ξένοι τῶν διαθηκῶν τῆς ἐπαγγελίας
  choice: ለተስፋው ቃል ኪዳኖች እንግዶች
  rationale: የδιαθηκῶνን ብዙ ቁጥርና የἐπαγγελίαςን ነጠላ ቁጥር ይጠብቃል፤ «እንግዶች» ከቃል ኪዳኑ ክልል ውጭ መሆንን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐλπίδα μὴ ἔχοντες
  choice: ተስፋ ያልነበራችሁ
  rationale: የቀድሞውን ሁኔታ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἄθεοι ἐν τῷ κόσμῳ
  choice: በዓለም ውስጥ ያለ አምላክ የኖራችሁ
  rationale: ἄθεοιን ዘመናዊ ፍልስፍናዊ «አምላክ የለሽነት» ብሎ ሳይወስን፣ ከእውነተኛው አምላክ ጋር ግንኙነት የሌለውን ሁኔታ ይጠብቃል።
theological_decisions:
- issue: የΧριστός አተረጓጎም
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: ቃሉ በዚህ በአይሁዳዊና በቃል ኪዳናዊ አውድ የተቀባውን አዳኝ የሚያመለክት ማዕረግ ነው።
- issue: የἄθεοι ትርጉም
  choice: ያለ አምላክ
  alternative: አምላክ የለሾች / አምላክ የማያምኑ
  rationale: የግሪኩን የትርጉም ስፋት ይጠብቃል፤ ጳውሎስ የአሕዛብን ከእውነተኛው አምላክ የተለየ ሁኔታ እንጂ የዘመናዊ ፍልስፍና አቋምን ብቻ እየገለጠ አይደለም።
- issue: διαθηκῶν τῆς ἐπαγγελίας የባለቤት አገናኝ
  choice: የተስፋው ቃል ኪዳኖች
  alternative: የተስፋ ቃል ኪዳኖች
  rationale: የግሪኩን ብዙ ቁጥር «ቃል ኪዳኖች» እና ነጠላ ቁጥር «ተስፋው» ይጠብቃል፤ የባለቤት አገናኙ ግን በሁለቱ መንገድ ሊገለጽ ይችላል።
