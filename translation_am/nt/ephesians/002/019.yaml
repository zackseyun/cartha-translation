  source_fidelity: The draft preserves the inferential transition, the temporal change of status, and the paired civic and household metaphors. However, its lengthy explanation of πάροικοι in the main text is more interpretive than the Greek, and the rendering of συμπολῖται is not idiomatic Amharic.
