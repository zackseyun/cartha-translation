base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/003.yaml
  text: among whom we all also once lived in the desires of our flesh[a], fulfilling the desires of the flesh and of the mind, and we were by nature children of wrath[e][d][c][b], just as the rest were.
translation:
  language: am
  text: እኛም ሁላችን ቀድሞ በእነርሱ መካከል በሥጋችን ምኞቶች እየኖርን፣ የሥጋንና የአሳቦችን ፈቃዶች እንፈጽም ነበር፤ እንደ ሌሎቹም በተፈጥሮ የቁጣ ልጆች ነበርን።[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በእነዚህ።” የግሪኩ አገላለጽ ወደ የአለመታዘዝ ሁኔታ ወይም በአለመታዘዝ ወደሚገለጹ ሰዎች ሊያመለክት ይችላል፤ አውዱን ተከትሎ ዋናው ጽሑፍ ግላዊውን ማጣቀሻ ይዟል።
    reason: alternative_reading
  - marker: b
    text: “ሥጋ” በዚህ ስፍራ “ኃጢአተኛ ባሕርይ” ተብሎም ሊተረጎም ይችላል፤ ዋናው ጽሑፍ ግን የጳውሎስን ቃልና ሙሉ ሥነ-መለኮታዊ ስፋቱን ይጠብቃል።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “ለቁጣ የተጋለጡ ሰዎች።” “የቁጣ ልጆች” የሚለው የግሪኩን ፈሊጣዊ አገላለጽ በቀጥታ ይተረጉማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν οἷς
  choice: በእነርሱ መካከል
  rationale: አውዱ በቀደመው ቁጥር የተጠቀሱትን የአለመታዘዝ ልጆች የሚያመለክት በመሆኑ ግላዊውን ማጣቀሻ ይጠብቃል፤ ሆኖም ‘በእነዚህ’ የሚለው የሁኔታ ማጣቀሻም ሰዋስዋዊ ዕድል አለው።
- source_word: ἀνεστράφημέν
  choice: እየኖርን
  rationale: ቃሉ የኑሮ አካሄድን ወይም ራስን የማስተዳደር ሁኔታን ያመለክታል፤ ‘እየኖርን’ በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: ἐπιθυμίαις
  choice: ምኞቶች
  rationale: ከጾታዊ ምኞት ብቻ የሰፋውን የተዛባ ፍላጎት ስፋት ይይዛል።
- source_word: σάρξ
  choice: ሥጋ
  rationale: የጳውሎስን ቃልና ሥነ መለኮታዊ ውጥረቱን ሳይፈታ ይጠብቃል፤ ‘ኃጢአተኛ ባሕርይ’ የሚለው ከግሪኩ የበለጠ ትርጓሜ ይጨምራል።
- source_word: ποιοῦντες
  choice: እንፈጽም ነበር
  rationale: የፈቃዶቹን ተግባራዊ አፈጻጸምና የቀድሞውን ቀጣይ የኑሮ ልማድ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: θελήματα
  choice: ፈቃዶች
  rationale: ከἐπιθυμίαις ‘ምኞቶች’ የተለየውን የውሳኔና የዝንባሌ ኃይል ይጠብቃል።
- source_word: διανοιῶν
  choice: አሳቦች
  rationale: ብዙ ቁጥሩንና የአእምሮ አቅጣጫዎችን በአጭርና ግልጽ አማርኛ ያስተላልፋል።
- source_word: τέκνα ὀργῆς
  choice: የቁጣ ልጆች
  rationale: የግሪኩን ሴማዊ አገላለጽ በቀጥታ በመጠበቅ ቁጣው ባሕርይን፣ ሁኔታን ወይም ፍርድን ያመለክት እንደሆነ አስቀድሞ አይወስንም።
- source_word: φύσει
  choice: በተፈጥሮ
  rationale: ‘በውልደት’ ብሎ ሳያጠብ የቃሉን አከራካሪ ሥነ መለኮታዊ ኃይል ይጠብቃል።
- source_word: οἱ λοιποί
  choice: ሌሎቹ
  rationale: ከቀሩት ሰዎች ጋር ያለውን ንጽጽር ተፈጥሯዊ በሆነ ዘመናዊ አማርኛ ያቀርባል።
