  text: በበደሎቻችን ሙታን በነበርን ጊዜ እንኳ፣ ከመሲሑ[a] ጋር ሕያዋን አደረገን—በጸጋ ድናችኋል—
  philosophy: optimal-equivalence
  footnotes:
