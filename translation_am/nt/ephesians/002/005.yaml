    text: በግሪክኛ Χριστός፤ ትርጉሙ “መሲሕ” ነው። በባህላዊ ትርጉሞች “ክርስቶስ” ተብሎ ይቀርባል።
    reason: Χριστός የሚለውን ማዕረግ ትርጉምና ባህላዊ አማራጭ አተረጓጎም ለማሳየት።
lexical_decisions:
- source_word: ὄντας ἡμᾶς νεκροὺς
  choice: ሙታን በነበርን ጊዜ እንኳ
  rationale: የግሪክኛውን አሳቢ ጊዜያዊና ተቃራኒ ኃይል በተፈጥሯዊ አማርኛ ያሳያል፤ የሞትንም ሁኔታ ቃል በቃል ይጠብቃል።
- source_word: τοῖς παραπτώμασιν
  choice: በበደሎቻችን
  rationale: ዳቲቩ በደሎች ውስጥ ወይም ከበደሎች አንጻር ሙታን መሆንን ያመለክታል። “የእኛ” የሚለው ከአንቀጹ የመጀመሪያ መደብ ብዙ ቁጥር እና ከቁጥር 1 ትይዩ አገባብ ይገኛል።
- source_word: συνεζωοποίησεν
  choice: ሕያዋን አደረገን
  rationale: የግሱን ሕይወት የመስጠት ኃይል ያስተላልፋል፤ “ከመሲሑ ጋር” የሚለው ሐረግ በጋራ የመሆኑን ክፍል ይገልጣል።
- source_word: τῷ Χριστῷ
  choice: ከመሲሑ ጋር
  rationale: ዳቲቩ ከመሲሑ ጋር ያለውን ኅብረት ያመለክታል፤ Χριστός እዚህ ማዕረጉን እንዲያሳይ “መሲሕ” ተብሎ ተተርጉሟል።
- source_word: χάριτί
  choice: በጸጋ
  rationale: ዳቲቩ መዳን የተፈጸመበትን መሠረት ወይም መንገድ ይገልጣል፤ “ጸጋ” ትክክለኛና የተለመደ የአማርኛ መጽሐፍ ቅዱስ ቃል ነው።
- source_word: ἐστε σεσῳσμένοι
  choice: ድናችኋል
  rationale: የግሪክኛውን ፍጹም ጊዜ ውጤታዊ ሁኔታና ተደራጊ ቅርጽ በተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: የΧριστῷ አተረጓጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: Χριστός በዚህ አውድ የተቀባውን ንጉሥ የሚያመለክት ማዕረግ ሆኖ ይሠራል፤ “መሲሕ” ይህን ትርጉም በግልጽ ይጠብቃል፣ ባህላዊው “ክርስቶስ” ግን በማስታወሻ ተጠቅሷል።
- issue: የχάριτί ἐστε σεσῳσμένοι ድንገተኛ አጽንዖት
  choice: በሰረዝ መካከል ማቆየት
  alternative: ያለ ልዩ ሥርዓተ ነጥብ ከዋናው ዓረፍተ ነገር ጋር ማዋሐድ
  rationale: ጳውሎስ ስለ ጸጋ በድንገት ያስገባውን አጽንዖት ይጠብቃል፣ እና በቁጥር 8–9 የሚስፋፋውን ሐሳብ አስቀድሞ ያመለክታል።
- issue: τοῖς παραπτώμασιν የዳቲቭ ኃይል
  choice: በበደሎቻችን
  alternative: በበደሎቻችን ምክንያት
  rationale: ግሪክኛው ምክንያትን ብቻ በግድ አይወስንም፤ የሁኔታን ወይም የግንኙነትን አሻሚነት ለመጠበቅ “በበደሎቻችን” ተመርጧል።
