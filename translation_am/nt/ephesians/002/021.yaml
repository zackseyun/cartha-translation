lexical_decisions:
- source_word: ἐν ᾧ
  choice: በእርሱም
  rationale: አመልካቹ በቀደመው አውድ ወደ ክርስቶስ የሚመለስ ስለሆነ፣ ግላዊ ማጣቀሻውንና ከቀደመው ንግግር ጋር ያለውን ትስስር ለማሳየት «በእርሱም» ተመርጧል።
- source_word: πᾶσα οἰκοδομὴ
  choice: ሕንፃው ሁሉ
  rationale: የአውዱን አንድ የተዋሐደ ቤተ መቅደስ ምስል ይጠብቃል፤ ግሪኩ ሊፈቅደው የሚችለው «እያንዳንዱ ሕንፃ» የሚለው አማራጭ በእግር ማስታወሻ ተጠብቋል።
- source_word: συναρμολογουμένη
  choice: እርስ በርሱ እየተጋጠመ
  rationale: የአሁን ጊዜ ተደራጊ አንቀጽ የሕንፃው ክፍሎች በቀጣይነት እየተገጣጠሙ አንድ ሙሉ እንደሚሆኑ ያሳያል።
- source_word: αὔξει
  choice: ያድጋል
  rationale: ቀጣይ እድገትን የሚያመለክተውን የግሪክ አሁን ጊዜ ግስ በተፈጥሯዊ አማርኛ ያቀርባል፣ በሕንፃ ምስል ውስጥ ያለውን ሕያው እድገትም ይጠብቃል።
- source_word: εἰς
  choice: እንዲሆን
  rationale: ቃሉ የሚያመለክተውን ግብ ወይም ውጤት በተፈጥሯዊ አማርኛ ይገልጣል፤ ሕንፃው ወደ ቅዱስ ቤተ መቅደስነት ማደጉን ያሳያል።
- source_word: ναὸν ἅγιον
  choice: ቅዱስ ቤተ መቅደስ
  rationale: ναός በተለይ የመቅደሱን ስፍራ ያመለክታል፤ «ቤተ መቅደስ» የሕንፃውን ምስል በግልጽ ሁኔታ ሲያቀርብ «ቅዱስ» ደግሞ ἅγιονን በቀጥታ ይተረጉማል።
- source_word: ἐν κυρίῳ
  choice: በጌታ
  rationale: የጳውሎስን አጭርና ሰፊ ሥነ መለኮታዊ አገላለጽ ሳያጠብ ይጠብቃል፤ ከጌታ ጋር ያለውን ኅብረት ወይም የድርጊቱን ዓለም ሁለቱንም ሊያመለክት ይችላል።
theological_decisions:
- issue: የᾧ ቀዳሚ ማጣቀሻ በግል ክርስቶስ ነው ወይስ የማዕዘን ድንጋይ/ሕንፃው ምስል ነው?
  choice: ወደ ክርስቶስ የሚመለስ «በእርሱም»
  alternative: ወደ ሕንፃው ምስል የሚመለስ «በእርሱም/በዚያም» ያልሆነ ግላዊ ያልሆነ ንባብ
  rationale: በቁጥር 20 ያለው ቅርብ ማጣቀሻ መሲሑ ኢየሱስ ራሱ ሲሆን፣ በዚህ ክፍል ያለው ተደጋጋሚ «በእርሱ» አገላለጽም ግላዊውን ክርስቶሳዊ ማጣቀሻ ይደግፋል።
- issue: πᾶσα οἰκοδομὴ በአንድነት «ሕንፃው ሁሉ» ወይስ በክፍፍል «እያንዳንዱ ሕንፃ» ተብሎ ይነበብ?
  choice: አንድ የተዋሐደ ሕንፃ፤ «ሕንፃው ሁሉ»
  alternative: «እያንዳንዱ ሕንፃ»
  rationale: ሰፊው አውድ አይሁድና አሕዛብ አንድ አዲስ ሰውነትና አንድ ቤተ መቅደስ መሆናቸውን ያጎላል። ሆኖም የግሪኩ ሰዋስው የክፍፍል ንባቡንም ስለሚፈቅድ በእግር ማስታወሻ ተጠብቋል።
