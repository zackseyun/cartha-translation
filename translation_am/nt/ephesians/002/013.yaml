  rationale: አውዱ ደሙን የመቅረቡ መንገድ አድርጎ ያቀርባል፤ ‘በ’ ይህን ያስተላልፋል ነገር ግን ጽሑፉ ከሚለው በላይ የተዘረጋ የሥርየት ንድፈ ሐሳብ አይጨምርም።
