id: PHP.1.20
reference: Philippians 1:20
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: κατὰ τὴν ἀποκαραδοκίαν καὶ ἐλπίδα μου ὅτι ἐν οὐδενὶ αἰσχυνθήσομαι, ἀλλ’ ἐν πάσῃ παρρησίᾳ ὡς πάντοτε καὶ νῦν μεγαλυνθήσεται Χριστὸς ἐν τῷ σώματί μου, εἴτε διὰ ζωῆς εἴτε διὰ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/020.yaml
  text: in keeping with my eager expectation and hope that I will not be put to shame in anything[a], but that with all boldness, as always, even now Messiah will be magnified in my body[b], whether through life or through death.
translation:
  language: am
  text: በጉጉት በምጠብቀውና ተስፋ ባደረግሁት መሠረት፣ በምንም ነገር እንዳልዋረድ[a]፣ ይልቁንም እንደ ሁልጊዜው አሁንም በሙሉ ድፍረት መሲሑ[b] በሰውነቴ ከፍ ከፍ እንዲል፣ በሕይወትም ይሁን በሞት፣ ይህን እጠብቃለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እንዳላፍር»።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «ክርስቶስ»።
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὴν ἀποκαραδοκίαν καὶ ἐλπίδα μου
  choice: በጉጉት የምጠብቀውና ተስፋ የማደርገው
  rationale: የκατάን የመስማማት ሐሳብ ከተከታዩ ὅτι አንቀጽ ጋር በተፈጥሯዊ የአማርኛ አገባብ ያቀርባል፤ ἀποκαραδοκία ያለውን ጠንካራና ወደፊት የሚመለከት ጉጉትም ይጠብቃል።
- source_word: ἐν οὐδενὶ αἰσχυνθήσομαι
  choice: በምንም ነገር እንዳልዋረድ
  rationale: «መዋረድ» በሕዝብ ፊት እፍረት ወይም ውርደት የመድረስን ተገብሮአዊ ገጽታ ያሳያል፤ ἐν οὐδενὶ ያለውን ፍጹም አሉታዊነት «በምንም ነገር» ይገልጣል።
- source_word: ἐν πάσῃ παρρησίᾳ
  choice: በሙሉ ድፍረት
  rationale: παρρησία በዚህ አውድ ግልጽና ፍርሃት የሌለበትን የሕዝብ ፊት ምስክርነት ያመለክታል።
- source_word: μεγαλυνθήσεται
  choice: ከፍ ከፍ እንዲል
  rationale: ግሱ ታላቅ ማድረግን ወይም ታላቅነትን ማሳየትን ይገልጣል፤ «ከፍ ከፍ ማለት» ዘይቤውንና መጽሐፍ ቅዱሳዊ ክብሩን ይጠብቃል።
- source_word: Χριστὸς
  choice: መሲሑ
  rationale: በዚህ አንቀጽ Χριστός ማዕረጋዊ ኃይሉን እንደያዘ ስለሚታይ «መሲሑ» የሚለው ትርጉሙን በግልጽ ያስተላልፋል።
- source_word: ἐν τῷ σώματί μου
  choice: በሰውነቴ
  rationale: የጳውሎስን አካላዊና የሚታይ ምስክርነት በቀጥታ ይጠብቃል።
- source_word: εἴτε διὰ ζωῆς εἴτε διὰ θανάτου
  choice: በሕይወትም ይሁን በሞት
  rationale: የδιάን የመንገድ ወይም የሁኔታ ትርጉምና የሁለቱን አማራጮች ትይዩነት በተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: በጳውሎስ መልእክት Χριστόςን መተርጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: ቃሉ እዚህ ተራ የግል ስም ብቻ ሳይሆን ማዕረጉንና የኢየሱስን መሲሐዊ ማንነት የሚያሰማ በመሆኑ «መሲሑ» ተመርጧል፤ «ክርስቶስ» ግን ሕጋዊ የትርጉም አማራጭ ሆኖ በማስታወሻ ቀርቧል።
- issue: የαἰσχυνθήσομαι ተገብሮአዊ ወይም ውስጣዊ ትርጉም
  choice: እንዳልዋረድ
  alternative: እንዳላፍር
  rationale: የሕዝብ ፊት ምስክርነትና መጽደቅ አውድ «እንዳልዋረድ» የሚለውን ይደግፋል፤ ሆኖም ግሱ የውስጥ እፍረትንም ሊገልጥ ስለሚችል አማራጩ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የὅτι አንቀጹ በ«እንዳል… እንዲል ነው» አወቃቀር ተፈጥሯዊ ሆኗል፤ የግሪኩ የወደፊት ተስፋ፣ የሕይወትና ሞት ትይዩነት፣ እና የአካል ምስክርነት ተጠብቀዋል።
