    issue: Μόνον is translated as “ነገር ግን.”
    rationale: “ነገር ግን” is adversative (“but”), while Μόνον here marks the one essential exhortation. This changes the discourse relation.
  - severity: high
    issue: The purpose clause is syntactically altered by “... ብሰማ ... እንድሰማ.”
    rationale: The Greek says Paul’s desired report is that they stand firm, whether he comes or remains absent. The draft can read as though his hearing is conditional on the two alternatives and redundantly says “hear.”
