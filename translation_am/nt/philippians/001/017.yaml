revisions:
- from: ሌሎቹ ግን በእስራቴ ላይ መከራ ሊጨምሩብኝ አስበው፣ በቅንነት ሳይሆን ከራስ ወዳድ ምኞት የተነሣ መሲሑን[a] ያውጃሉ።[b]
  to: ሌሎቹ ግን መሲሑን[a] ከራስ ወዳድነት ተነሥተው ያውጃሉ፤ በንጹሕ ልብ ሳይሆን፣ በእስራቴ ላይ መከራ ሊያስከትሉብኝ በማሰብ ነው።[b]
  rationale: The revision retains all of the draft’s principal lexical decisions while correcting the expression of θλῖψιν ἐγείρειν so that it means causing affliction rather than specifically increasing it. It also makes the motive clause more idiomatic and more explicitly connected to purity of motive. Footnote markers remain correctly attached to “መሲሑን” and “በእስራቴ.”
