  text: οἱ δὲ ἐξ ⸂ἐριθείας τὸν Χριστὸν καταγγέλλουσιν, οὐχ ἁγνῶς, οἰόμενοι θλῖψιν ἐγείρειν τοῖς δεσμοῖς μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/017.yaml
  text: But the others proclaim the Messiah out of selfish ambition[a], not sincerely[b], thinking to raise up affliction for me in my imprisonment.
translation:
  language: am
  text: ሌሎቹ ግን መሲሑን[a] ከራስ ወዳድነት ተነሥተው ያውጃሉ፤ በንጹሕ ልብ ሳይሆን፣ በእስራቴ ላይ መከራ ሊያስከትሉብኝ በማሰብ ነው።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ክርስቶስን።”
    reason: alternative_reading
  - marker: b
    text: “በእስራቴ” የሚለው በቀጥታ “በሰንሰለቶቼ” ማለት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐριθείας
  choice: ከራስ ወዳድ ምኞት የተነሣ
  rationale: ቃሉ ተራ ራስ ወዳድነትን ብቻ ሳይሆን የግል ጥቅምንና የወገንተኝነት ፉክክርን የሚያካትት የተሳሳተ ዓላማን ያመለክታል።
- source_word: Χριστόν
  choice: መሲሑን
  rationale: በዚህ ስፍራ ቃሉ የሚታወጀውን ኢየሱስ በመሲሓዊ ማዕረጉ ስለሚያቀርብ፣ የማዕረግ ትርጉሙ ጎልቶ ይታያል።
- source_word: καταγγέλλουσιν
  choice: ያውጃሉ
  rationale: ግሱ በአደባባይ ማሳወቅን ወይም ማወጅን ያመለክታል፤ ትርጉሙን በመደበኛ ስብከት ብቻ አይገድብም።
- source_word: ἁγνῶς
  choice: በቅንነት
  rationale: በዐውዱ ውስጥ የዓላማን ንጽሕና ያመለክታል፤ ከአሉታው ጋር ‘በቅንነት ሳይሆን’ ተፈጥሯዊና ግልጽ ነው።
- source_word: οἰόμενοι
  choice: አስበው
  rationale: ተሳቢው የእነርሱን ግምትና ዓላማ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: θλῖψιν ἐγείρειν
  choice: መከራ ሊጨምሩብኝ
  rationale: ቃል በቃል ‘መከራን ማስነሣት’ ከማለት ይልቅ፣ በእስራቱ ላይ ተጨማሪ ጭንቀት ለማምጣት ያላቸውን ጠላትነት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τοῖς δεσμοῖς μου
  choice: በእስራቴ ላይ
  rationale: δεσμοί በቀጥታ ‘ሰንሰለቶች’ ማለት ቢሆንም፣ እዚህ እስራትን ወክሎ ተጠቅሟል፤ ይህ አገላለጽ ትርጉሙን ግልጽ ያደርጋል።
theological_decisions:
- issue: የΧριστός አተረጓጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: የአዋጁ ይዘት የኢየሱስን መሲሓዊ ማንነት ስለሚያጎላ፣ የማዕረግ ትርጉሙ ተመርጧል፤ የተለመደው ‘ክርስቶስ’ ግን በማስታወሻ ቀርቧል።
- issue: θλῖψιν ἐγείρειν የሚገልጸው ዓላማ ወይስ የታሰበ ውጤት
  choice: መከራ ሊጨምሩብኝ አስበው
  alternative: መከራ እንደሚያስነሡ በማሰብ
  rationale: οἰόμενοι ግምትንም ዓላማንም ሊያመለክት ይችላል። የተመረጠው አገላለጽ የጠላትነት ዓላማቸውን ያሳያል፣ ነገር ግን ውጤቱን እንዳሳኩ አይናገርም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ተቃርኖ ‘ሌሎቹ ግን’ በሚለው ተጠብቋል፤ የእስራቱ ምስል በዋናው ጽሑፍ በትርጉም ተገልጦ፣ ቃል በቃል አገላለጹ በማስታወሻ ቀርቧል።
