id: PHP.1.19
reference: Philippians 1:19
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οἶδα γὰρ ὅτι τοῦτό μοι ἀποβήσεται εἰς σωτηρίαν διὰ τῆς ὑμῶν δεήσεως καὶ ἐπιχορηγίας τοῦ πνεύματος Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/019.yaml
  text: For I know that this will turn out for my deliverance through your prayer and the provision of the Spirit of Jesus the Messiah[b][a],
translation:
  language: am
  text: ይህ በእናንተ ጸሎትና በየኢየሱስ መሲሕ መንፈስ አቅርቦት ለመዳኔ[a] እንደሚያበቃ አውቃለሁና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ነፃ ለመውጣቴ” ወይም “ንጹሕነቴ መረጋገጥ።”
    reason: alternative_reading
lexical_decisions:
- source_word: οἶδα
  choice: አውቃለሁ
  rationale: የግሪኩ ፍጹም ጊዜ ቅርጽ አሁናዊ ትርጉም ስላለው፣ ይህ ምርጫ የጳውሎስን እርግጠኝነት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τοῦτό
  choice: ይህ
  rationale: ነጠላው አመልካች የጳውሎስን አሁናዊ ሁኔታ በአጠቃላይ ወደ ኋላ ያመለክታል፤ ‘ይህ’ ከልክ በላይ ሳይወስን ሰፊውን ማጣቀሻ ይጠብቃል።
- source_word: ἀποβήσεται
  choice: እንደሚሆንልኝ
  rationale: ግሱ የአንድን ሁኔታ ውጤት ያመለክታል፤ ይህ አገላለጽ የወደፊቱን ውጤት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: σωτηρίαν
  choice: መዳኔ
  rationale: ‘መዳን’ በእስር ሁኔታው ውስጥ ነፃ መውጣትን ሊያመለክት ሲችል፣ የመንፈሳዊ ድነትና የንጹሕነት መረጋገጥ ትርጉሞችንም አይዘጋም።
- source_word: δεήσεως
  choice: ጸሎት
  rationale: ቃሉ ልመናን ወይም ልዩ ጥያቄን የያዘ ጸሎት ያመለክታል፤ ‘ጸሎት’ ግልጽና ዘመናዊ አገላለጽ ነው።
- source_word: ἐπιχορηγίας
  choice: ርዳታ
  rationale: ስሙ የሚቀርብ ድጋፍን ወይም አቅርቦትን ያመለክታል፤ ‘ርዳታ’ በዚህ አገባብ ተፈጥሯዊ ሲሆን የሚያስፈልገውን ድጋፍ ያሳያል።
- source_word: πνεύματος Ἰησοῦ Χριστοῦ
  choice: የኢየሱስ መሲሕ መንፈስ
  rationale: የባለቤትነት አገባቡ መንፈሱ ከኢየሱስ መሲሕ ጋር ያለውን ቀጥተኛ ዝምድና ይጠብቃል፤ Χριστός እንደ ማዕረግ ‘መሲሕ’ ተብሎ ተተርጉሟል።
theological_decisions:
- issue: በእስር አገባቡ ውስጥ የσωτηρίαν ትርጉም
  choice: መዳኔ
  alternative: ነፃ መውጣቴ፤ ንጹሕነቴ መረጋገጡ
  rationale: አቅራቢያው አገባብ የጳውሎስን እስራትና የሚጠብቀውን ውጤት ይመለከታል፤ ሆኖም የግሪኩ ቃል ከአካላዊ ነፃ መውጣት ባለፈ ድነትን ወይም ንጹሕነት መረጋገጥን ሊያመለክት ስለሚችል፣ ‘መዳን’ የትርጉሙን ስፋት ይጠብቃል፤ አማራጮቹም በማስታወሻ ተጠብቀዋል።
- issue: ἐπιχορηγίας τοῦ πνεύματος ውስጥ ያለው የባለቤትነት ግንኙነት
  choice: በኢየሱስ መሲሕ መንፈስ ርዳታ
  alternative: የኢየሱስ መሲሕ መንፈስ በሚሰጠው ርዳታ፤ የኢየሱስ መሲሕ መንፈስ በመሰጠቱ
  rationale: ግሪኩ አገባብ መንፈሱ ርዳታውን የሚሰጥ መሆኑን ወይም መንፈሱ ራሱ የቀረበው ስጦታ መሆኑን በግልጽ አይወስንም። የተመረጠው አገላለጽ ይህን አሻሚነት ሳይፈታ ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ይጠቀማል። ‘አውቃለሁና’ የγὰρን ምክንያታዊ ግንኙነት በተፈጥሯዊ የአማርኛ አነጋገር ያሳያል። ‘መሲሕ’ Χριστόςን እንደ ማዕረግ ያቀርባል።
