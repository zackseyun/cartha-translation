base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/022.yaml
  text: But if to go on living in the flesh means fruitful labor for me[b][a], yet which I will choose I do not know.
translation:
  language: am
  text: 'ነገር ግን በሥጋ[a] መኖር ለእኔ ፍሬያማ ሥራ[b] ከሆነ፣ ደግሞ ምን እንደምመርጥ አላውቅም።


    [a] ወይም፣ “በሰውነት።”


    [b] ወይም፣ “የሥራ ፍሬ” ወይም “ፍሬ የሚያፈራ ሥራ።”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በሰውነት።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “የሥራ ፍሬ” ወይም “ፍሬ የሚያፈራ ሥራ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ζῆν
  choice: መኖሬ
  rationale: ዐውደ ንባቡ ጳውሎስ በአሁኑ ምድራዊ ሕይወት መቀጠሉን ያመለክታል። የአማርኛው ባለቤትነት ቅርጽ ከሚቀጥለው ‘ለእኔ’ ጋር ተፈጥሯዊ ሆኖ የግሪኩን ስማዊ የግስ ቅርጽ ያስተላልፋል።
- source_word: ἐν σαρκί
  choice: በሥጋ
  rationale: σάρξ በዚህ ዐውደ ንባብ ከክርስቶስ ጋር ለመሆን ከመሄድ በተቃራኒ የሚቀጥለውን ሥጋዊ ምድራዊ ሕይወት ያመለክታል፤ የኃጢአት ተፈጥሮን አያመለክትም። ‘በሥጋ’ የጳውሎስን አገላለጽ ይጠብቃል፣ ‘በሰውነት’ ደግሞ በማስታወሻ ቀርቧል።
- source_word: καρπὸς ἔργου
  choice: ፍሬያማ ሥራ
  rationale: የግሪኩ ሐረግ የታመቀ ሲሆን ቃል በቃል ‘የሥራ ፍሬ’ ሊባል ይችላል። ‘ፍሬያማ ሥራ’ በተፈጥሯዊ ዘመናዊ አማርኛ ሥራው ውጤት እንደሚያፈራ ያስተላልፋል፤ ሌሎቹ አማራጮች በማስታወሻ ተጠብቀዋል።
- source_word: αἱρήσομαι
  choice: እንደምመርጥ
  rationale: ጳውሎስ በሁለት ዕድሎች መካከል ስለ ምርጫ ይናገራል፤ ‘መምረጥ’ ይህን በግልጽና በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: οὐ γνωρίζω
  choice: አላውቅም
  rationale: γνωρίζω ብዙ ጊዜ ‘ማሳወቅ’ ማለት ቢችልም፣ እዚህ ያለው አገባብ የግል እርግጠኛ አለመሆንን ይገልጣል። ‘አላውቅም’ የአንቀጹን ኃይል በቀጥታ ይይዛል።
theological_decisions:
- issue: በዚህ ቁጥር የσάρξ ትርጉም
  choice: ሥጋዊ ምድራዊ ሕልውና (‘በሥጋ’)
  alternative: የኃጢአት ተፈጥሮ
  rationale: ዐውደ ንባቡ በዚህ ሕይወት መቀጠልን ከክርስቶስ ጋር ለመሆን ከመሄድ ጋር ያነጻጽራል። ስለዚህ σάρξ እዚህ የሥነ ምግባር ብልሹነትን ሳይሆን በሰውነት ያለ ሕይወትን ያመለክታል።
- issue: የκαρπὸς ἔργου የታመቀ አገላለጽ
  choice: ፍሬያማ ሥራ
  alternative: የሥራ ፍሬ
  rationale: ዋናው ጽሑፍ ተፈጥሯዊ እንዲሆን ሳይዘረጋ የሚያፈራ አገልግሎትን ያመለክታል። ግሪኩ ሥራው ራሱ ፍሬያማ መሆኑን ወይም ከሥራው ፍሬ መገኘቱን በታመቀ መልኩ ስለሚናገር፣ የቃል በቃል አማራጩ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የሁኔታ አንቀጽ (‘ከሆነ’) እና የመጨረሻው የእርግጠኝነት ማጣት ተጠብቀዋል፤ በግሪኩ ያልተገለጸው ‘ከሁለቱ’ የሚል ማብራሪያ ወደ ዋናው ጽሑፍ አልገባም።
