reference: Philippians 1:25
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ τοῦτο πεποιθὼς οἶδα ὅτι μενῶ καὶ ⸀παραμενῶ πᾶσιν ὑμῖν εἰς τὴν ὑμῶν προκοπὴν καὶ χαρὰν τῆς πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/025.yaml
  text: And convinced of this[a], I know that I will remain and continue with all of you for your progress and joy in the faith,
translation:
  language: am
  text: በዚህ እርግጠኛ ሆኜ፣ ለእድገታችሁና በእምነት ላለው ደስታችሁ ከሁላችሁ ጋር እንደምቆይና አብሬ እንደምቀጥል አውቃለሁ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεποιθὼς
  choice: በመተማመን
  rationale: ፍጹም ጊዜ አንቀጽ የተረጋጋና የቀጠለ እርግጠኝነትን ያመለክታል፤ «በመተማመን» ይህን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: μενῶ
  choice: እንደምቆይ
  rationale: የወደፊት ጊዜውንና የመቆየት መሠረታዊ ትርጉም ይጠብቃል።
- source_word: παραμενῶ
  choice: እንደምቀጥል
  rationale: ከቀደመው «እንደምቆይ» ተለይቶ፣ ከእነርሱ ጋር ይበልጥ መቆየቱንና አብሮነቱን መቀጠሉን ያሳያል።
- source_word: πᾶσιν ὑμῖν
  choice: ከሁላችሁ ጋር
  rationale: የግስ ተዛማጅነቱን በተፈጥሯዊ አማርኛ ሲገልጽ πᾶσιν የሚለውንም በግልጽ ይጠብቃል።
- source_word: προκοπὴν
  choice: እድገት
  rationale: ወደ ፊት መራመድንና በእምነት መጎልበትን ለዘመናዊ አንባቢ በቀላሉ ያስተላልፋል።
- source_word: χαρὰν τῆς πίστεως
  choice: ለእምነታችሁ … ደስታ
  rationale: የግሪኩን የባለቤት አገናኝ ሆን ብሎ ወደ ምክንያታዊ ትርጉም ሳይገድብ፣ እድገትና ደስታን ሁለቱንም ከእምነት ጋር ያያይዛል።
- source_word: πίστεως
  choice: እምነታችሁ
  rationale: በዚህ አውድ πίστις የፊልጵስዩስ ሰዎችን የማመን ሕይወት ያመለክታል፤ በግሪኩ ያለው ὑμῶν የሁለቱንም የእድገትና የደስታ ሐረግ ይወስናል።
theological_decisions:
- issue: በχαρὰν τῆς πίστεως ውስጥ ያለው የባለቤት አገናኝ ትርጉም
  choice: ለእምነታችሁ … ደስታ
  alternative: የእምነት ደስታ፤ ወይም ከእምነት የሚመጣ ደስታ
  rationale: የግሪኩ አገባብ ደስታው በእምነት ውስጥ መሆኑን፣ የእምነት ባሕርይ መሆኑን፣ ወይም ከእምነት መምጣቱን ሊያመለክት ይችላል። ዋናው ጽሑፍ ግንኙነቱን ሳያጠብ፣ አማራጮቹን ማስታወሻው ያቆያል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «እንደምቆይና እንደምቀጥል» የሁለቱን የግሪክ ግሶች ልዩነት ይጠብቃል።
