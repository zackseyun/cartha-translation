  register: ዘመናዊ፣ ክቡርና ለሕዝብ ቀላል የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ረጅም የሰላምታ አወቃቀርና ሁለቱ ἐν ሐረጎች ተጠብቀዋል፤ የመጨረሻው ፦ ቀጣዩን የደብዳቤ ክፍል የሚጠብቅ ክፍት ሰላምታ መሆኑን ያሳያል።
