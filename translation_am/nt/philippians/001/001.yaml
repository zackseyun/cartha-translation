base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/001.yaml
  text: 'Paul and Timothy[a], servants of Messiah Jesus, to all the saints in Messiah Jesus who are in Philippi[c][b], together with the overseers and deacons:'
translation:
  language: am
  text: ጳውሎስና ጢሞቴዎስ፣ የመሲሑ[a] ኢየሱስ ባሪያዎች[b]፣ በመሲሑ ኢየሱስ ላላችሁ፣ በፊልጵስዩስም ለምትኖሩ ቅዱሳን ሁሉ፣ ከተቆጣጣሪዎች[c]ና ከዲያቆናት ጋር፦
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የክርስቶስ ኢየሱስ።” የግሪኩ Χριστός “የተቀባው” የሚል ማዕረግ ሲሆን “መሲሕ” ወይም “ክርስቶስ” ተብሎ ሊቀርብ ይችላል።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ “አገልጋዮች።” የግሪኩ δοῦλοι በሌላ ባለቤት ሥር ያሉ ሰዎችን ያመለክታል።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “ኤጲስቆጶሳት።”
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: ባሪያዎች
  rationale: ይህ ቃል የታሰረ ባለቤትነትንና ሙሉ ተገዥነትን በግልጽ ያሳያል፤ አጠቃላዩ ‘አገልጋዮች’ የሚለው ትርጉም ይህን ጥንካሬ ሊያሳንስ ይችላል።
- source_word: Χριστοῦ Ἰησοῦ / Χριστῷ Ἰησοῦ
  choice: የመሲሑ ኢየሱስ / በመሲሑ ኢየሱስ
  rationale: Χριστός በመነሻው ስም ሳይሆን ‘የተቀባው’ የሚለውን የንግሥና ማዕረግ ይገልጣል፤ ‘መሲሕ’ ይህን ማዕረጋዊ ኃይል ያቆያል።
- source_word: ἁγίοις
  choice: ቅዱሳን
  rationale: በጳውሎስ የደብዳቤ ሰላምታ ውስጥ የአማኞችን በእግዚአብሔር የተለዩ ሕዝብነት በአጭሩና በተለመደ ሁኔታ ይገልጣል።
- source_word: ἐν
  choice: በ… / ላሉ
  rationale: ተደጋጋሚውን ἐν በቦታዊ አገባብ (‘በፊልጵስዩስ’) እና ከመሲሑ ጋር ያለውን ኅብረት (‘በመሲሑ ኢየሱስ’) በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: τοῖς οὖσιν ἐν Φιλίπποις
  choice: በፊልጵስዩስ ለሚገኙት
  rationale: የግሪኩን አሳታፊ ሐረግ ወደ ተፈጥሯዊ የአማርኛ አንጻራዊ ሐረግ በመቀየር የቦታውን መረጃ ግልጽ ያደርጋል።
- source_word: σὺν
  choice: ከ… ጋር
  rationale: የአብሮነትንና የማካተትን ትርጉም በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐπισκόποις
  choice: ተቆጣጣሪዎች
  rationale: የግሪኩን መሠረታዊ የክትትልና የኃላፊነት ትርጉም በግልጽ ይተረጉማል፤ በኋላ የተወሰነውን የቤተ ክርስቲያን ሥልጣን አወቃቀር በግድ አያስገባም።
- source_word: διακόνοις
  choice: ዲያቆናት
  rationale: ከἐπισκόποις ጋር ተጣምሮ በመጣው በዚህ የማኅበር አገባብ የታወቀ የአገልግሎት ሚናን ለመግለጽ የተለመደና ግልጽ ነው።
- source_word: πᾶσιν τοῖς ἁγίοις
  choice: ለ… ቅዱሳን ሁሉ
  rationale: የመልእክቱን ተቀባዮች ሙሉ ማካተት እያሳየ የግሪኩን የአድራሻ አወቃቀር በተፈጥሯዊ አማርኛ ያቆያል።
theological_decisions:
- issue: በጳውሎስ ሰላምታ ውስጥ Χριστόςን መተርጎም
  choice: መሲሑ ኢየሱስ
  alternative: ክርስቶስ ኢየሱስ
  rationale: ‘መሲሕ’ የተቀባውን ንጉሥ የሚያመለክተውን የΧριστός ማዕረጋዊ ትርጉም ይጠብቃል፤ በአማርኛ የተለመደው ‘ክርስቶስ’ ግን እንደ ተገቢ አማራጭ በማስታወሻ ቀርቧል።
- issue: በፊልጵስዩስ 1፥1 δοῦλοιን መተርጎም
  choice: ባሪያዎች
  alternative: አገልጋዮች
  rationale: ‘ባሪያዎች’ በግሪኩ ያለውን የባለቤትነትና የሙሉ ተገዥነት ውጥረት ሳያለዝብ ያስተላልፋል፤ የበለጠ ለስላሳው ባህላዊ አማራጭ በማስታወሻ ተጠቅሷል።
- issue: ἐπισκόποις የሚያመለክተው የማኅበር ሚና
  choice: ተቆጣጣሪዎች
  alternative: ኤጲስ ቆጶሳት
  rationale: ግልጽ የተግባር ትርጉም መምረጡ ጽሑፉ ብቻውን ከሚያረጋግጠው በላይ የኋለኛውን ቤተ ክርስቲያናዊ ሥልጣን አወቃቀር እንዳይጫን ያደርጋል።
