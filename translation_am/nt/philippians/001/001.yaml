review_pass:
  verdict: revise
  source_fidelity: 'The draft retains all elements of the Greek: the senders, their status as δοῦλοι, both occurrences of ‘Messiah Jesus,’ all the saints, their location in Philippi, and the associated overseers and deacons. ‘ባሪያዎች’ appropriately preserves the force of δοῦλοι. The recipient phrase, however, is syntactically awkward in Amharic and blurs the parallel relationship of ‘in Messiah Jesus’ and ‘in Philippi.’'
  naturalness: The sequence ‘በፊልጵስዩስ ለሚገኙት በመሲሑ ኢየሱስ ላሉ’ is difficult to parse, since both relative phrases modify the same noun but are ordered unnaturally. Addressing the recipients directly with plural relative forms is clear, idiomatic modern standard Amharic, and preserves the Greek address structure.
  terminology: ‘መሲሕ,’ ‘ባሪያዎች,’ ‘ቅዱሳን,’ ‘ተቆጣጣሪዎች,’ and ‘ዲያቆናት’ are suitable. The footnote spelling ‘ኤጲስ ቆጶሳት’ should be corrected to the conventional single-word form ‘ኤጲስቆጶሳት.’
  issues:
  - severity: medium
    issue: The recipient clause is awkwardly ordered and inflected.
    rationale: The two phrases ‘በፊልጵስዩስ ለሚገኙት’ and ‘በመሲሑ ኢየሱስ ላሉ’ create a cumbersome and less natural construction. ‘በመሲሑ ኢየሱስ ላላችሁ፣ በፊልጵስዩስም ለምትኖሩ’ clearly modifies ‘ቅዱሳን ሁሉ’ and maintains both Greek ἐν phrases.
  - severity: low
    issue: The alternate ecclesial-title footnote has a nonstandard word break.
    rationale: ‘ኤጲስቆጶሳት’ is the conventional Amharic spelling; ‘ኤጲስ ቆጶሳት’ unnecessarily separates one loanword.
