source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b][c].
translation:
  language: am
  text: ከእግዚአብሔር አባታችንና ከጌታ ኢየሱስ መሲሕ[a] ጸጋና ሰላም ለእናንተ ይሁን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ክርስቶስ»።
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: ጸጋ
  rationale: «ጸጋ» የጳውሎስን የሰላምታ ቃል በተለመደውና ክብደቱን በሚጠብቅ መንገድ ይገልጣል።
- source_word: ὑμῖν
  choice: ለእናንተ
  rationale: በሰላምታና በቡራኬ አገላለጽ የግሪኩን ዳቲቭ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: εἰρήνη
  choice: ሰላም
  rationale: ቀጥተኛና ተፈጥሯዊ አቻ ሲሆን የሰላምታውን ሰፊ የደኅንነትና የሙሉነት ሐሳብ ይጠብቃል።
- source_word: ἀπό
  choice: ከ…
  rationale: የጸጋና የሰላም ምንጭ ማን እንደሆነ በቀጥታ ያመለክታል።
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: እግዚአብሔር አባታችን
  rationale: πατρὸς ἡμῶν እግዚአብሔርን በአባትነቱ እንደሚገልጥ በተፈጥሯዊና በተለመደ አማርኛ ያቀርባል።
- source_word: κυρίου
  choice: ጌታችን
  rationale: «ጌታ» የκύριοςን የሥልጣንና የክርስቶሳዊ ክብር ሐሳብ ይጠብቃል፤ የግሪኩ ἡμῶν በቅርብ ሰዋሰዋዊ ንባብ ከπατρός ጋር ብቻ ቢያያዝም፣ «ጌታችን» በአማርኛ ተፈጥሯዊ የሆነ የማዕረግ አገላለጽ ነው።
- source_word: Ἰησοῦ Χριστοῦ
  choice: ኢየሱስ መሲሕ
  rationale: Χριστός ከመሲሐዊው ማዕረግ ጋር ያለውን ትርጉም ግልጽ ለማድረግ «መሲሕ» ተብሎ ተተርጉሟል፤ በአማርኛ የዘር መግለጫ አንቀጽ ሳይጨመር «ኢየሱስ መሲሕ» ተፈጥሯዊ ነው።
theological_decisions:
- issue: በጳውሎስ የሰላምታ ቅርጽ Χριστοῦን መተርጎም
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: በዚህ ስፍራ Χριστός እንደ ማዕረግ ሊሰማ ስለሚችል «መሲሕ» ዋናውን የቃሉን ትርጉም ያሳያል፤ ባህላዊው የድምፅ ቅጂ «ክርስቶስ» በማስታወሻ ተጠብቋል።
- issue: በግሪክ ግስ የሌለውን የሰላምታ አረፍተ ነገር በአማርኛ ማቅረብ
  choice: ይሁን
  alternative: ግሱን ሳይጨምሩ መተው
  rationale: የግሪኩ አረፍተ ነገር ግስ ባይኖረውም የቡራኬ ሐሳቡ የተገመተ ነው፤ «ይሁን» ይህን በተፈጥሯዊ አማርኛ ይገልጣል እንጂ አዲስ ሐሳብ አያክልም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅመናል። የግሪኩን የምንጭ አወቃቀር ለመጠበቅ «ከ…» በሁለቱም ምንጮች ፊት ተደግሟል።
