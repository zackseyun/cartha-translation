  choice: ለመሲሑ ቀን
  rationale: εἰς ወደ አንድ የወደፊት ግብ መመልከትን ያሳያል፤ Χριστός እዚህ እንደ ማዕረግ ስለሚሠራ ‘መሲሕ’ ተብሎ ተተርጉሟል።
theological_decisions:
- issue: በፍጻሜ ዘመን አገላለጽ εἰς ἡμέραν Χριστοῦ ውስጥ Χριστοῦን መተርጎም
  choice: ለመሲሑ ቀን
  alternative: ለክርስቶስ ቀን
  rationale: Χριστός በዚህ ስፍራ የቅቡዕነት ማዕረጉን ስለሚያመለክት ‘መሲሑ’ ትርጉሙን በግልጽ ያቆያል፤ የተለመደው አገላለጽ በማስታወሻ ቀርቧል።
- issue: ἀπρόσκοποι ተቀባይነት ያላቸው ሁለት አቅጣጫዎች
  choice: ነቀፋ የሌለባችሁ
  alternative: ለሌሎች እንቅፋት የማትሆኑ
  rationale: በεἰλικρινεῖς ጋር ያለው ጥምረት ነቀፋ የሌለበትን ሕይወት ያጎላል፤ ሆኖም ቃሉ ሌሎችን አለማሰናከልንም ሊያመለክት ይችላል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የዓላማ አወቃቀር በ“እንድት…፣ …እንድትሆኑ” ተጠብቋል፤ የቃላቱ እርግጠኛ ያልሆኑ ገጽታዎች በማስታወሻዎች ተቀምጠዋል።
