  rationale: ግሱ መፈተንን፣ መመርመርንና ከምርመራ በኋላ ተቀባይነት መስጠትን ሊያመለክት ይችላል፤ ይህ አገላለጽ ሁለቱንም የምርመራና የማጽደቅ ገጽታዎች ያስቀምጣል።
- source_word: τὰ διαφέροντα
