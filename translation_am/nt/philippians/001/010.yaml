- source_word: ἀπρόσκοποι
  choice: ነቀፋ የሌለባችሁ
  rationale: ቃሉ እንቅፋት የማይሆኑ ወይም ነቀፋ የማይገኝባቸው ሰዎችን ሊያመለክት ይችላል፤ የተመረጠው አገላለጽ ትርጉሙን በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
