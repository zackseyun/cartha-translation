  text: καὶ μὴ πτυρόμενοι ἐν μηδενὶ ὑπὸ τῶν ἀντικειμένων (ἥτις ⸂ἐστὶν αὐτοῖς⸃ ἔνδειξις ἀπωλείας, ⸀ὑμῶν δὲ σωτηρίας, καὶ τοῦτο ἀπὸ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/028.yaml
  text: and not being frightened in anything by those who oppose you[a]. This is a sign to them of destruction[c][b], but of your salvation—and this from God.
translation:
  language: am
  text: በምንም ነገር ተቃዋሚዎቻችሁን አትፍሩ[a]። ይህ ለእነርሱ የጥፋት፣ ለእናንተ ግን የድነት ምልክት[b] ነው፤ ይህም ከእግዚአብሔር ነው[c]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «አትደናገጡ» ወይም «አትሸበሩ»።
    reason: lexical_alternative
  - marker: b
    text: «ምልክት» የሚለው «ማስረጃ» ወይም «ጠቋሚ» ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: c
    text: «ይህ» የሚለው በተለይ ድነታችሁን ወይም በሰፊው ከዚህ በፊት የተገለጸውን ምልክት ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: πτυρόμενοι
  choice: አትፍሩ
  rationale: ግሱ በተቃዋሚዎች ፊት መደናገጥን ወይም መሸበርን ያመለክታል። በግሪክ አገባብ የቀደመውን ትእዛዝ የሚቀጥል ተሳቢ ቅርጽ ቢሆንም፣ በአማርኛ «አትፍሩ» ተፈጥሯዊና ግልጽ ነው።
- source_word: ἐν μηδενί
  choice: በምንም ነገር
  rationale: «በምንም» ወይም «በምንም መንገድ» የሚለውን ሙሉ አሉታዊ ኃይል ይጠብቃል።
- source_word: τῶν ἀντικειμένων
  choice: ተቃዋሚዎቻችሁን
  rationale: በአውዱ የፊልጵስዩስ አማኞችን የሚቃወሙ ሰዎችን ያመለክታል፤ የባለቤትነት ቅጥያው በግሪኩ የተገነዘበውን ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἔνδειξις
  choice: ምልክት
  rationale: ቃሉ አንድን እውነታ የሚያመለክት ማስረጃ ወይም ጠቋሚ ማለት ነው፤ «ምልክት» አጭርና ለአንባቢ ግልጽ ነው።
- source_word: ἀπωλείας
  choice: ጥፋት
  rationale: የመጥፋት፣ የውድቀት ወይም የፍርድ አደጋን ሳያጠብ የግሪኩን ክብደት ይጠብቃል።
- source_word: σωτηρίας
  choice: ድነት
  rationale: በጳውሎስ አውድ ያለውን የእግዚአብሔር የማዳን ሥራ የሚገልጽ የተለመደና ክቡር አማርኛ ነው።
- source_word: τοῦτο ἀπὸ θεοῦ
  choice: ይህም ከእግዚአብሔር ነው
  rationale: ግልጽ አመልካቹን «ይህ» ይጠብቃል፤ በተመሳሳይም ወደ ድነት ብቻ ወይም ወደ አጠቃላይ ምልክቱ መመለሱን አይወስንም።
theological_decisions:
- issue: የτοῦτο («ይህ») ተመላሽ ሐሳብ
  choice: «ይህም ከእግዚአብሔር ነው» ተብሎ ሆን ተብሎ ሰፊ ትርጉሙ ተጠብቋል።
  alternative: «ይህ» በተለይ ድነታቸውን ሊያመለክት ይችላል፤ ወይም ፍርሃት አልባ አቋማቸው የሚፈጥረውን አጠቃላይ ምልክት ሊያመለክት ይችላል።
  rationale: የግሪክ አገባብ ከአንድ በላይ ተመላሽ ሐሳብ ይፈቅዳል፤ ስለዚህ ጽሑፉ ያልወሰነውን ትርጉም ትርጉሙም አይወስንም።
- issue: ምልክቱ ለማን የምን እንደሆነ
  choice: «ለእነርሱ የጥፋት፣ ለእናንተ ግን የድነት» ተብሎ ተቃራኒነቱ ተጠብቋል።
  alternative: በአገባቡ ልዩነት ምክንያት አንዳንድ አንባቢዎች ምልክቱን በተለየ ሁኔታ ከተቃዋሚዎቹ ወይም ከአማኞቹ አንጻር ሊያነቡት ይችላሉ።
  rationale: ዋናው የግሪክ ንባብ αὐτοῖς እና ὑμῶν የሚለውን ግልጽ ተቃርኖ ይሰጣል፤ ይህም በአማርኛው በቀጥታ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ከመጠን በላይ ጥንታዊ ቃላትና የቤተ እምነት ልዩ አገላለጾች ተወግደዋል፤ የግሪኩ ተቃርኖና የመጨረሻው አመልካች አሻሚነት ተጠብቀዋል።
