lexical_decisions:
- source_word: πάντοτε
  choice: ሁልጊዜም
  rationale: የተግባሩን ቀጣይነትና ተደጋጋሚነት በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἐν πάσῃ δεήσει μου
  choice: በማቀርበው ልመናዬ ሁሉ
  rationale: πάσῃ የሚያመለክተውን ‘እያንዳንዱን/ሁሉንም’ ይጠብቃል፤ δέησις ደግሞ አንድን ጉዳይ በመለመን የሚቀርብ ጸሎት ስለሆነ ‘ልመና’ ተመርጧል።
- source_word: ὑπὲρ πάντων ὑμῶν
  choice: ስለ ሁላችሁ
  rationale: ጸሎቱ ሁሉንም ተቀባዮች ያካተተ ለእነርሱ የሚቀርብ መሆኑን ያሳያል።
- source_word: μετὰ χαρᾶς
  choice: በደስታ
  rationale: ጸሎቱ የሚቀርብበትን የደስታ ስሜት በአጭርና ተፈጥሯዊ አገላለጽ ይገልጣል።
- source_word: τὴν δέησιν ποιούμενος
  choice: እጸልያለሁ
  rationale: ቃል በቃል ‘ልመናን እያደረግሁ’ የሚለውን የግሪክ አገላለጽ በተፈጥሯዊ አማርኛ ‘እጸልያለሁ’ ብሎ ያቀርባል፤ የልመናው ልዩ ትርጉም በቀደመው ‘ልመናዬ’ ተጠብቋል።
