  text: καὶ τοὺς πλείονας τῶν ἀδελφῶν ἐν κυρίῳ πεποιθότας τοῖς δεσμοῖς μου περισσοτέρως τολμᾶν ἀφόβως τὸν ⸀λόγον λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/014.yaml
  text: And most of the brothers[a], having become confident in the Lord because of my chains, dare all the more to speak the word fearlessly.
translation:
  language: am
  text: ወንድሞችም[a] አብዛኞቹ በእስራቴ ምክንያት በጌታ ተማምነው፣ ቃሉን ያለ ፍርሃት ለመናገር ይበልጥ ይደፍራሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወንድሞችና እህቶች”፤ እዚህ ላይ ቃሉ ሌሎች አማኞችን በሰፊው የሚያመለክት ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: πλείονας
  choice: አብዛኞቹ
  rationale: ከመድብል አመልካችና ከከፊል ዘርፍ ጋር ስለመጣ፣ ‘የበለጡት’ ብቻ ሳይሆን ‘አብዛኞቹ’ የሚለውን ፍቺ ይሰጣል።
- source_word: ἀδελφῶν
  choice: ወንድሞች
  rationale: የግሪኩን በሰዋስው ወንድ ብዙ ቁጥር በቀጥታ ያቆያል፤ በዐውዱ ሴት አማኞችንም ሊያካትት እንደሚችል በማስታወሻ ተገልጿል።
- source_word: ἐν κυρίῳ
  choice: በጌታ
  rationale: የጳውሎስን የተለመደ አገላለጽ ጠብቆ፣ የመተማመናቸውን መሠረትና የሕይወት ወሰን ያሳያል።
- source_word: πεποιθότας
  choice: ተማምነው
  rationale: ፍጹም አንቀጽ በቀድሞ የተፈጠረና አሁንም የቀጠለ የመተማመን ሁኔታን ያመለክታል፤ የአማርኛው አገላለጽ ይህን በተፈጥሯዊ ሁኔታ ይይዛል።
- source_word: τοῖς δεσμοῖς μου
  choice: በእስራቴ ምክንያት
  rationale: δεσμοί በቀጥታ ‘ማሰሪያዎች’ ቢሆንም፣ በዚህ ዐውድ ‘እስራቴ’ በአማርኛ ግልጽና ተፈጥሯዊ ነው፤ ምክንያታዊ ግንኙነቱም ተጠብቋል።
- source_word: περισσοτέρως
  choice: ይበልጥ
  rationale: የንጽጽር ተውሳኩን ‘ከዚህ ይበልጥ’ የሚለውን ኃይል በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τολμᾶν
  choice: ደፈሩ
  rationale: አደጋን ወይም ተቃውሞን ፊት ለፊት በመጋፈጥ ለመናገር ያላቸውን ድፍረት በአጭርና ቀጥተኛ ቃል ይገልጣል።
- source_word: ἀφόβως
  choice: ያለ ፍርሃት
  rationale: ቃሉ በግልጽ ሁኔታ ፍርሃት አለመኖሩን ያመለክታል፤ ‘በድፍረት’ ከሚለው ይልቅ የምንጩን ልዩ አጽንዖት ይጠብቃል።
- source_word: τὸν λόγον
  choice: ቃሉን
  rationale: በዐውዱ የሚሰበከውን የወንጌል መልእክት የሚያመለክት ቢሆንም፣ በግሪኩ የሌለውን ‘የእግዚአብሔር’ ወይም ‘ወንጌል’ ሳይጨምር ቅርጹን ይጠብቃል።
- source_word: λαλεῖν
  choice: ለመናገር
  rationale: የአጠቃላይ ንግግር ግሱን በቀጥታ ይተረጉማል፤ ‘ለማወጅ’ የሚለውን ከምንጩ የበለጠ ጠንካራ ፍቺ አያስገባም።
theological_decisions:
- issue: የἀδελφῶν ወሰን
  choice: በዋናው ጽሑፍ ‘ወንድሞች’ ተብሎ ተተርጉሞ፣ ሰፊው የአማኞች ማኅበር ሊያመለክት እንደሚችል በግርጌ ማስታወሻ ተገልጿል።
  alternative: ‘ወንድሞችና እህቶች’ ወይም ‘አማኞች’
  rationale: የግሪኩ ቅርጽ ወንድ ብዙ ቁጥር ነው፤ ስለዚህ ዋናው ጽሑፍ ይህን ይጠብቃል። ሆኖም የዘመኑ አጠቃቀምና ዐውዱ ቃሉ ሴት አማኞችንም ሊያካትት እንደሚችል ይፈቅዳሉ።
- issue: የἐν κυρίῳ ከአረፍተ ነገሩ ጋር ያለው ግንኙነት
  choice: ‘በጌታ ተማምነው’ ተብሎ ከπεποιθότας ጋር ተያይዟል።
  alternative: ‘በጌታ ያሉ ወንድሞች’ ብሎ ከἀδελφῶν ጋር ማያያዝ
  rationale: የቃላቱ ቅደም ተከተል መዋቅራዊ አሻሚነትን ቢፈቅድም፣ ἐν κυρίῳ ከመተማመን ግስ ጋር መያያዙ በጳውሎስ አጠቃቀምና በዐውዱ ተፈጥሯዊ ነው።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ቃሉን’ የሚለው የምንጩን አጭርነት ይጠብቃል፤ ‘በእስራቴ ምክንያት’ ደግሞ የግሪኩን ተጨባጭ ምስል በአማርኛ ግልጽነት ሚዛን ያቀርባል።
