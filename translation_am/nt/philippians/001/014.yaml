  terminology: ወንድሞች with the inclusive footnote responsibly retains the masculine Greek form without excluding the probable broader referent. በጌታ, ቃሉን, and ያለ ፍርሃት are suitable. ‘በእስራቴ ምክንያት’ is an acceptable idiomatic contextual rendering of τοῖς δεσμοῖς μου, though it is less concrete than ‘my chains.’
  issues:
