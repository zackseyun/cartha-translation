id: PHP.1.7
reference: Philippians 1:7
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καθώς ἐστιν δίκαιον ἐμοὶ τοῦτο φρονεῖν ὑπὲρ πάντων ὑμῶν, διὰ τὸ ἔχειν με ἐν τῇ καρδίᾳ ὑμᾶς, ἔν τε τοῖς δεσμοῖς μου καὶ ἐν τῇ ἀπολογίᾳ καὶ βεβαιώσει τοῦ εὐαγγελίου συγκοινωνούς μου τῆς χάριτος πάντας ὑμᾶς ὄντας·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/007.yaml
  text: For it is right for me to think this about all of you[a], because I have you in my heart, since both in my chains and in the defense and confirmation of the gospel[b], all of you are fellow partakers with me of grace.
translation:
  language: am
  text: ስለ ሁላችሁ እንዲህ ማሰቤ ተገቢ ነው፤ ምክንያቱም በልቤ ይዣችኋለሁ[a]። በእስራቴም፣ ወንጌሉን በመከላከልና በማጽናትም፣ ሁላችሁ ከእኔ ጋር የጸጋ ተካፋዮች ናችሁ[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በልባችሁ ይዛችሁኛልና።” የግሪኩ ሐረግ በሁለቱም መንገድ ሊነበብ ይችላል።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ “በጸጋ ከእኔ ጋር አጋሮች ናችሁ።”
    reason: alternative_rendering
lexical_decisions:
- source_word: δίκαιον
  choice: ተገቢ ነው
  rationale: በዚህ አውድ ቃሉ የጳውሎስ አመለካከት ትክክልና የተገባ መሆኑን ያመለክታል፤ «ተገቢ ነው» ተፈጥሯዊና ግልጽ ነው።
- source_word: φρονεῖν
  choice: ማሰቤ
  rationale: ቃሉ ሐሳብንና የአእምሮ አቋምን ሊያካትት ቢችልም፣ «ማሰብ» የዓረፍተ ነገሩን አጭርነትና ክፍት ትርጉም ይጠብቃል።
- source_word: ὑπὲρ πάντων ὑμῶν
  choice: ስለ ሁላችሁ
  rationale: ከφρονεῖν ጋር ሲገናኝ ስለ ሰዎቹ ያለውን አመለካከት ያሳያል፤ «ስለ ሁላችሁ» በአማርኛ ተፈጥሯዊ ነው።
- source_word: διὰ τὸ ἔχειν με ἐν τῇ καρδίᾳ ὑμᾶς
  choice: ምክንያቱም በልቤ ይዣችኋለሁ
  rationale: ዋናው ጽሑፍ ጳውሎስ ፊልጵስዩስን በልቡ ይዟቸዋል የሚለውን ከአውዱ ጋር የሚስማማውን ንባብ ይከተላል፤ የግሪኩ ሰዋሰዋዊ አሻሚነት ግን በማስታወሻ ተጠብቋል።
- source_word: δεσμοῖς
  choice: እስራቴ
  rationale: δεσμοί በቀጥታ «እስራት/ማሰሪያ» የሚል ምስል አለው፤ በዘመናዊ አማርኛ «እስራቴ» የጳውሎስን መታሰር ግልጽ ያደርጋል።
- source_word: ἀπολογίᾳ
  choice: በመከላከል
  rationale: የወንጌሉን እውነት በንግግር ወይም በሕጋዊ መድረክ መከላከልን ይገልጣል።
- source_word: βεβαιώσει
  choice: በማጽናት
  rationale: ቃሉ ወንጌሉን ማረጋገጥ፣ ማቋቋም ወይም ጽኑ ማድረግን ያመለክታል፤ «ማጽናት» ከ«መከላከል» ጋር ተፈጥሯዊ ጥምረት ይፈጥራል።
- source_word: συγκοινωνούς
  choice: ተካፋዮች
  rationale: የጋራ ተሳትፎንና አጋርነትን ያሳያል፤ «ከእኔ ጋር ... ተካፋዮች» የσυν- እና μουን ግንኙነት ያለ አላስፈላጊ ድግግሞሽ ይገልጣል።
- source_word: χάριτος
  choice: ጸጋው
  rationale: «ጸጋ» የχάριςን መደበኛ መጽሐፍ ቅዱሳዊ ትርጉም ይጠብቃል፤ አመልካች ቅጥያው በአውዱ የተጠቀሰውን የእግዚአብሔር ጸጋ ያመለክታል።
theological_decisions:
- issue: በ«ልብ» ሐረግ ያለው ሰዋሰዋዊ አሻሚነት
  choice: ጳውሎስ ሁሉንም በልቡ ይዟቸዋል
  alternative: ፊልጵስዩስ ጳውሎስን በልባቸው ይዘውታል
  rationale: በግሪኩ የመስራችና የተሳቢ ሚና ሁለቱም በአኩዛቲቭ ቅርጽ ስለመጡ ሐረጉ በሁለቱም መንገድ ሊነበብ ይችላል። ዋናው ንባብ ከጳውሎስ ፍቅራዊ አነጋገር ጋር ይስማማል፤ አማራጩ ግን በማስታወሻ ተጠብቋል።
- issue: የጸጋ የጋራ ተሳትፎ
  choice: «ከእኔ ጋር የጸጋው ተካፋዮች»
  alternative: «በጸጋው አጋሮቼ»
  rationale: የተመረጠው አተረጓጎም συγκοινωνούς ... τῆς χάριτος የሚገልጠውን በጸጋ የጋራ መካፈል በግልጽ ያቆያል፤ ጸጋው በዚህ አውድ ጥሪን፣ አገልግሎትንና መከራን ሊያካትት ቢችልም ትርጉሙ ይህን በአንድ ብቻ አይገድበውም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ረጅሙ የግሪክ ዓረፍተ ነገር ለአማርኛ ንባብ ግልጽነት በሁለት ዓረፍተ ነገሮች ተከፍሏል፤ የሐሳብ ግንኙነቱ ግን ተጠብቋል።
