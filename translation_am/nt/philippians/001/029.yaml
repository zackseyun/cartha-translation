  text: ὅτι ὑμῖν ἐχαρίσθη τὸ ὑπὲρ Χριστοῦ, οὐ μόνον τὸ εἰς αὐτὸν πιστεύειν ἀλλὰ καὶ τὸ ὑπὲρ αὐτοῦ πάσχειν),
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/029.yaml
  text: For it has been graciously granted to you on behalf of Messiah not only to believe in him[a], but also to suffer for him[d][c][b],
translation:
  language: am
  text: ምክንያቱም ለመሲሑ[a] ስትሉ[d]፣ በእርሱ ማመን[b] ብቻ ሳይሆን ስለ እርሱ[c] መከራ መቀበልም በጸጋ ተሰጥቷችኋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለክርስቶስ።” የግሪኩ Χριστός እዚህ እንደ ማዕረግ ስለሚሠራ “መሲሑ” ተብሎ ተተርጉሟል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በእርሱ መታመን።”
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “ለእርሱ ሲባል” ወይም “በእርሱ ፈንታ።”
    reason: lexical_alternative
  - marker: d
    text: ወይም የአገባቡን አወቃቀር፣ “ስለ መሲሑ ይህ በጸጋ ተሰጥቷችኋል፤ በእርሱ ማመን ብቻ ሳይሆን…” ብሎ መተርጎም ይቻላል።
    reason: previous_rendering
lexical_decisions:
- source_word: ὅτι
  choice: ምክንያቱም
  rationale: ከቀደመው አሳብ ጋር ምክንያታዊ ወይም ማብራሪያዊ ግንኙነት ይፈጥራል፤ በዘመናዊ አማርኛም ተፈጥሯዊ ነው።
- source_word: ἐχαρίσθη
  choice: በጸጋ ተሰጥቷችኋል
  rationale: ቃሉ በነፃና በቸርነት የተሰጠ ስጦታን ያመለክታል፤ ተገብሮ አድራጊውን ሳይጠቅስ የግሪኩን አቀራረብ ይጠብቃል።
- source_word: τὸ ὑπὲρ Χριστοῦ
  choice: ለመሲሑ ስትሉ
  rationale: ሁለቱንም የማይጨርሱ ግሶች—ማመንንና መከራ መቀበልን—ከመሲሑ ጋር ያያይዛል፤ ‘መሲሑ’ ደግሞ Χριστόςን እንደ ማዕረግ ያቀርባል።
- source_word: πιστεύειν εἰς αὐτόν
  choice: በእርሱ ማመን
  rationale: በአንድ ሰው ላይ እምነትን ወይም መታመንን ማድረግ የሚገልጠውን የግሪክ አገባብ በቀጥታና በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: πάσχειν
  choice: መከራ መቀበል
  rationale: በዘመናዊ አማርኛ የመሠቃየትን ወይም መከራን የመታገሥን ትርጉም በግልጽና ተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: ὑπὲρ αὐτοῦ
  choice: ስለ እርሱ
  rationale: መከራው በእርሱ ምክንያት ወይም ለእርሱ ሲባል እንደሚቀበል ያሳያል፤ አጭርና ተነባቢ ነው።
theological_decisions:
- issue: ማመንና ስለ መሲሑ መከራ መቀበል ሁለቱም በጸጋ እንደተሰጡ የሚናገረውን አሳብ ማቆየት
  choice: ‘በጸጋ ተሰጥቷችኋል’ የሚለው ለሁለቱም እንዲሠራ ዓረፍተ ነገሩ ተዋቅሯል
  alternative: ቃሉን ‘ተፈቅዶላችኋል’ ብሎ ማለዘብ ወይም የስጦታውን ሐሳብ ማደብዘዝ
  rationale: ግሪኩ ማመንንና መከራ መቀበልን በአንድ የጸጋ ስጦታ አገባብ ውስጥ ያካትታል፤ ይህ የሥነ መለኮት ውጥረት ሳይለዘብ ተጠብቋል።
