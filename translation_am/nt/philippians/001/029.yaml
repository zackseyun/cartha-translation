  register: ቋንቋው ዘመናዊ፣ ክቡርና ለመደበኛ አንባቢ ግልጽ ነው። ‘ስትሉ’ የብዙ ቁጥር አድራሻውን ያሳያል፤ የስጦታውን ክብደት ለማቆየት ‘በጸጋ’ በግልጽ ተካትቷል።
