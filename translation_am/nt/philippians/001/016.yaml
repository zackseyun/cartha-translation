  text: οἱ μὲν ἐξ ⸂ἀγάπης, εἰδότες ὅτι εἰς ἀπολογίαν τοῦ εὐαγγελίου κεῖμαι⸃,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/016.yaml
  text: The former do so out of love[a], knowing that I am appointed for the defense of the good news[b],
translation:
  language: am
  text: እነዚያማ ከፍቅር ተነስተው ይህን ያደርጋሉ፤[a] እኔ ምሥራቹን ለመከላከል እንደተሾምኩ ያውቃሉና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፦ “እነዚያማ ከፍቅር”፤ ድርጊቱ ከቀደመው አውድ የሚገባ ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ μὲν
  choice: እነዚያማ ... ይህን ያደርጋሉ
  rationale: የግሪኩ ሐረግ ግስ ያልተገለጸበት ሲሆን ከአውዱ የሚገባውን ድርጊት በተፈጥሯዊ አማርኛ ያሳያል፤ -ማ ደግሞ ከሚከተለው οἱ δέ ጋር ያለውን ንፅፅር ይጠብቃል።
- source_word: ἐξ ἀγάπης
  choice: ፍቅር አነሳስቷቸው
  rationale: ἐξ ከረቂቅ ስም ጋር የድርጊቱን መነሻ ምክንያት ያሳያል፤ ይህ አገላለጽ ‘ከፍቅር’ ከሚለው ቀጥተኛ ነገር ግን እምብዛም ተፈጥሯዊ ካልሆነ ቅርጽ ይልቅ ግልጽ ነው።
- source_word: εἰδότες
  choice: ያውቃሉና
  rationale: የአድራጊዎቹን እውቀት እና የድርጊታቸውን መሠረት ያሳያል፤ -ና የምክንያት ግንኙነቱን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: εἰς ἀπολογίαν
  choice: ለመከላከል
  rationale: ἀπολογία ሕጋዊ ወይም ምክንያታዊ መከላከያን ያመለክታል፤ የዓላማውንም ኃይል በግልጽ ሁኔታ ይጠብቃል።
- source_word: τοῦ εὐαγγελίου
  choice: የምሥራቹን ቃል
  rationale: εὐαγγέλιον የክርስቲያናዊውን መልእክት ያመለክታል፤ ‘የምሥራች ቃል’ በዘመናዊ አማርኛ የመልእክቱን ባሕርይ በግልጽ ያሳያል።
- source_word: κεῖμαι
  choice: እንደተሾምኩ
  rationale: በዚህ አውድ ቃሉ ጳውሎስ ለዚህ ተግባር መመደቡን ያመለክታል፤ ከአካላዊ ‘መቀመጥ/መተኛት’ ይልቅ አውዳዊ ፍቺውን ያስተላልፋል።
theological_decisions:
- issue: በእስር አውድ ውስጥ κεῖμαι የሚለው አተረጓጎም
  choice: ተሾምኩ
  alternative: እዚህ ተቀምጫለሁ / ተወስኛለሁ
  rationale: የጳውሎስ አሁናዊ ሁኔታ ምሥራቹን ለመከላከል ከተሰጠው ሚና ጋር እንደሚያያዝ ያሳያል፤ ከአውዱ በላይ የሆነ ዝርዝር የመለኮታዊ ውሳኔ አስተምህሮ አያክልም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ አጭርና ግስ የጎደለው አወቃቀር በዋናው ጽሑፍ ተፈትቶ፣ ቀጥተኛው ቅርጽ በእግር ማስታወሻ ተጠብቋል።
