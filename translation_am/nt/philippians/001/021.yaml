id: PHP.1.21
reference: Philippians 1:21
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐμοὶ γὰρ τὸ ζῆν Χριστὸς καὶ τὸ ἀποθανεῖν κέρδος.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/021.yaml
  text: For to me[a], to live is Christ, and to die is gain.
translation:
  language: am
  text: ለእኔ መኖር ክርስቶስ[a] ነውና፣ መሞትም ትርፍ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “መሲሕ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοὶ
  choice: ለእኔ
  rationale: የግሪኩን የተሳቢ ቅርጽና ጳውሎስ በግሉ ስለራሱ የሚናገርበትን አጽንዖት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: γὰρ
  choice: ነውና
  rationale: γάρ ከቀደመው ሐሳብ ጋር ያለውን የማብራሪያ ግንኙነት በአማርኛ በተፈጥሯዊ መንገድ ከአረፍተ ነገሩ መጨረሻ ጋር ያያይዛል።
- source_word: τὸ ζῆν
  choice: መኖር
  rationale: በስም ተግባር የቀረበውን የግሪክ ግስ በአማርኛ መደበኛ የመ- ግስ ስም ይተረጉማል፤ ከ«መሞት» ጋር ያለውንም ሚዛናዊ አቀራረብ ይጠብቃል።
- source_word: Χριστὸς
  choice: ክርስቶስ
  rationale: በአማርኛ የተለመደውን ቅጽ ይጠቀማል፤ ቃሉ የማዕረግም የስምም ኃይል ሊኖረው ስለሚችል «መሲሕ» የሚለው አማራጭ በማስታወሻ ቀርቧል።
- source_word: τὸ ἀποθανεῖν
  choice: መሞት
  rationale: በስም ተግባር የቀረበውን ግስ በግልጽና ተፈጥሯዊ አማርኛ ያቀርባል፤ ከ«መኖር» ጋር ያለውንም ትይዩነት ይጠብቃል።
- source_word: κέρδος
  choice: ትርፍ
  rationale: በዚህ አውድ ያለውን የጥቅም ወይም የማትረፍ ሐሳብ በአጭር፣ በግልጽና በተለመደ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: Χριστός እንደ ስም ወይም እንደ ማዕረግ መሰማቱ
  choice: በዋናው ጽሑፍ «ክርስቶስ»
  alternative: «መሲሕ»
  rationale: የግሪኩ ቃል በጳውሎስ አጠቃቀም ስም የመሰለ ተግባርና የማዕረግ ኃይል ሁለቱንም ሊይዝ ይችላል። ዋናው ትርጉም በአማርኛ የተለመደውን ቅጽ ይጠቀማል፤ ሌላውን እውነተኛ አማራጭ ግን ማስታወሻው ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩ አጭርና ትይዩ አወቃቀር «መኖር… መሞት» በሚለው ተጠብቋል፤ γάρ የሚያሳየውም ከቀደመው ሐሳብ ጋር ያለ የማብራሪያ ግንኙነት «ነውና» በሚለው ተገልጿል።
