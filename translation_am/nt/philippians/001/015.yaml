  text: Τινὲς μὲν καὶ διὰ φθόνον καὶ ἔριν, τινὲς δὲ καὶ δι’ εὐδοκίαν τὸν Χριστὸν κηρύσσουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/015.yaml
  text: Some indeed proclaim the Messiah because of envy and rivalry[a], but others because of goodwill.
translation:
  language: am
  text: አንዳንዶች በቅናትና በፉክክር ምክንያት መሲሑን[a] ይሰብካሉ፤ ሌሎች ግን በበጎ ፈቃድ ይሰብካሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ክርስቶስን።” የግሪኩ ማዕረግ Χριστός (ክሪስቶስ) ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: Τινὲς μὲν … τινὲς δὲ
  choice: አንዳንዶች … ሌሎች ግን
  rationale: ሁለት የተነጻጸሩ ወገኖችን በተፈጥሯዊ አማርኛ ይገልጣል፤ μέν … δέ ያለውን ንጽጽርም ይጠብቃል።
- source_word: διὰ φθόνον
  choice: በቅናት … ምክንያት
  rationale: διά ከአኩዛቲቭ ጋር በዚህ ስፍራ ምክንያትን ወይም ውስጣዊ አነሳሽነትን ያመለክታል።
- source_word: ἔριν
  choice: ፉክክር
  rationale: በዐውዱ ያለውን የግል ፉክክርና ተቀናቃኝነት ይገልጣል፤ ከአሮጌ ወይም ከሰፊ ትርጉም ካላቸው አማራጮች ይልቅ ለዘመናዊ አንባቢ ግልጽ ነው።
- source_word: δι’ εὐδοκίαν
  choice: በበጎ ፈቃድ
  rationale: ከቅናትና ከፉክክር ተቃራኒ የሆነውን በጎ አነሳሽነት በአጭሩና በተፈጥሯዊ ቋንቋ ያሳያል።
- source_word: τὸν Χριστόν
  choice: መሲሑን
  rationale: Χριστός እዚህ ከመስተዋድድ ጋር እንደ ማዕረግ ተጠቅሟል፤ «መሲሕ» የ‘ተቀባው’ን የማዕረግ ትርጉም ያስተላልፋል።
- source_word: κηρύσσουσιν
  choice: ይሰብካሉ
  rationale: በዚህ ዐውድ መሲሑን በይፋ ማወጅን የሚገልጽ ተፈጥሯዊና ለአንባቢዎች የተለመደ አማርኛ ነው።
theological_decisions:
- issue: Χριστός እንደ ማዕረግ ወይም እንደ ስም መተርጎም
  choice: መሲሑን
  alternative: ክርስቶስን
  rationale: በግሪኩ ያለው መስተዋድድ የማዕረግ አጠቃቀምን ይደግፋል፤ የተለመደው የስም ቅርጽ ግን በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ንጽጽር በ«አንዳንዶች … ሌሎች ግን» ተጠብቋል፤ ሁለተኛው καί በአማርኛ በተናጠል አልተገለጸም፣ ምክንያቱም ዐረፍተ ነገሩን ያልተፈጥሯዊ ሳያደርግ በንጽጽሩ ውስጥ በቂ ሁኔታ ይገኛል።
