  text: so that your boasting in Messiah Jesus may abound because of me through my coming to you again[a][b][c][d].
translation:
  language: am
  text: እኔ እንደገና ወደ እናንተ በመምጣቴ፣ በእኔ ምክንያት በመሲሕ ኢየሱስ ያላችሁ ትምክህት እንዲበዛ ነው።[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ትምክህታችሁ በመሲሕ ኢየሱስ እንዲበዛ።»
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ «በእኔ»፤ እዚህ ያለው ሐሳብ «በእኔ ምክንያት» ወይም «ስለ እኔ» ሊሆን ይችላል።
    reason: lexical_alternative
  - marker: c
    text: «መሲሕ ኢየሱስ» የሚለው «ክርስቶስ ኢየሱስ» ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: d
    text: ወይም፣ «እኔ እንደገና ወደ እናንተ በመምጣቴ፣ በእኔ ምክንያት በመሲሕ ኢየሱስ የምትመኩበት ምክንያት እንዲበዛ ነው።»
    reason: previous_rendering
