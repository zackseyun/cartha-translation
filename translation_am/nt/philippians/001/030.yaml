translation:
  language: am
  text: በእኔ ላይ ያያችሁትንና አሁንም በእኔ ላይ እንዳለ የምትሰሙትን ያንኑ ትግል እያደረጋችሁ ነው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν αὐτὸν ἀγῶνα
  choice: ያንኑ ትግል
  rationale: ἀγών በዚህ አውድ መከራንና ለወንጌል የሚደረግን ጽኑ ተጋድሎ ያመለክታል፤ «ትግል» ሁለቱንም በተፈጥሯዊ አማርኛ ይይዛል። αὐτός የሚሰጠውን አጽንዖት «ያንኑ» ይጠብቃል።
- source_word: ἔχοντες
  choice: እያደረጋችሁ ነው
  rationale: ቃል በቃል «ኖሯችሁ/ይዛችሁ» ከማለት ይልቅ፣ በአማርኛ «ትግል ማድረግ» ተፈጥሯዊ የቃላት ጥምረት ሲሆን የአሁኑን ተሳትፎ ያስተላልፋል።
- source_word: οἷον εἴδετε ἐν ἐμοὶ
  choice: በእኔ ዘንድ ያያችሁትን
  rationale: ἐν ἐμοί እዚህ ትግሉ በጳውሎስ ሕይወትና ሁኔታ የታየ መሆኑን ያሳያል፤ «በእኔ ዘንድ» ይህን ያለ አላስፈላጊ ትርጓሜ ይገልጣል።
- source_word: καὶ νῦν ἀκούετε ἐν ἐμοί
  choice: አሁንም እንዳለብኝ የምትሰሙትን
  rationale: የግሪኩ አጭር አገላለጽ ቃል በቃል «አሁንም በእኔ የምትሰሙትን» ቢሆንም፣ በተፈጥሯዊ አማርኛ የሚሰማው ትግሉ አሁንም በጳውሎስ ላይ እንዳለ የሚገልጽ ዜና ነው። «አሁንም» የνῦν ወቅታዊነትንና የትግሉን ቀጣይነት ያስተላልፋል።
theological_decisions:
- issue: የጳውሎስና የፊልጵስዩስ አማኞች ትግል አንድነት
  choice: «ያንኑ ትግል» በማለት ቀጥተኛው ተመሳሳይነት ተጠብቋል።
  alternative: ትግሉን በቀጥታ «ስደት» ወይም «መንፈሳዊ ውጊያ» ብሎ መወሰን።
  rationale: ጽሑፉ ትግሉን በአንድ ዓይነት መከራ ብቻ አይገድበውም፤ ስለዚህ የἀγών ሰፊ ክልልና የአውዱ ሥነ መለኮታዊ ውጥረት ተጠብቋል።
- issue: ጳውሎስ አሁንም ትግሉን እንዳለበት መግለጽ
  choice: «አሁንም እንዳለብኝ»
  alternative: «አሁንም በእኔ የምትሰሙትን»
  rationale: በግሪኩ የተጨመቀውን አገላለጽ በግልጽ አማርኛ ይፈታል፤ ጳውሎስ አሁንም በትግሉ ውስጥ መሆኑን ያሳያል እንጂ አዲስ የሥነ መለኮት ይዘት አያክልም።
