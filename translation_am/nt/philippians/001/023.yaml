  text: συνέχομαι δὲ ἐκ τῶν δύο, τὴν ἐπιθυμίαν ἔχων εἰς τὸ ἀναλῦσαι καὶ σὺν Χριστῷ εἶναι, πολλῷ ⸀γὰρ μᾶλλον κρεῖσσον,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/023.yaml
  text: But I am hard pressed between the two[a], having the desire to depart and be with Messiah[b], for that is far better.
translation:
  language: am
  text: ነገር ግን በሁለቱ መካከል ተጨንቄያለሁ፤ ልሄድ[a]ና ከመሲሑ[b] ጋር ልሆን ፍላጎት አለኝ፤ ይህ እጅግ የተሻለ ነውና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ «ልሞት»። ቃል በቃል፦ «ልሄድ»።
    reason: lexical_alternative
  - marker: b
    text: ወይም፦ «ክርስቶስ»። የግሪክ ቃል Χριστός፣ ትርጉሙም «የተቀባው» ማለት ነው።
    reason: alternative_rendering
lexical_decisions:
- source_word: συνέχομαι
  choice: ተጨንቄአለሁ
  rationale: ግሱ በሁለት አማራጮች መካከል መጨነቅንና መያዝን ያመለክታል፤ ይህ አተረጓጎም የጳውሎስን ውስጣዊ ጫና በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐκ τῶν δύο
  choice: በሁለቱ መካከል
  rationale: በዐውዱ ሁለት አማራጮች ጳውሎስን እየጫኑት መሆናቸውን የሚገልጽ ፈሊጣዊ አገላለጽ ነው።
- source_word: τὴν ἐπιθυμίαν ἔχων
  choice: እመኛለሁ
  rationale: የጠነከረ ፍላጎትን በግልጽና በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል።
- source_word: ἀναλῦσαι
  choice: ልሄድ
  rationale: ግሪኩ ሞትን በቀጥታ ሳይጠራ ‘መሄድን/መለየትን’ የሚገልጽ ስለሆነ፣ ‘ልሄድ’ የንግግሩን ለዘብተኛ አገላለጽ ይጠብቃል።
- source_word: Χριστῷ
  choice: መሲሑ
  rationale: Χριστός በዚህ ስፍራ የቅቡዕነት ማዕረጉን ይዞ ስለሚታይ ‘መሲሑ’ ተብሎ ተተርጉሟል፤ የተለመደው ‘ክርስቶስ’ በማስታወሻ ቀርቧል።
- source_word: πολλῷ γὰρ μᾶλλον κρεῖσσον
  choice: ይህ እጅግ የተሻለ ነውና
  rationale: የግሪኩን ጠንካራ የንጽጽር አጽንዖት በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: ከሞት በኋላ ከመሲሑ ጋር ስለመሆን ያለው አንድምታ
  choice: ልሄድና ከመሲሑ ጋር ልሆን
  alternative: ሞቼ ወዲያውኑ ወደ ሰማይ ልሄድ
  rationale: ትርጉሙ ግሪኩ በግልጽ የሚለውን—መሄድንና ከመሲሑ ጋር መሆንን—ብቻ ይጠብቃል፤ ጊዜውን፣ ስፍራውን ወይም ሂደቱን የሚወስን ተጨማሪ የእምነት ትርጓሜ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። አጭር ሐረጎቹና ሴሚኮሎኖቹ የግሪኩን የሐሳብ ፍሰት ይጠብቃሉ።
