  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ቁጥሩ ከቀደመው ሐረግ ጋር የሚቀጥል በመሆኑ ‘ተሞልታችሁ’ የሚለው የአንቀጽ ቅርጽ ተጠብቋል።
