  text: πεπληρωμένοι ⸂καρπὸν δικαιοσύνης τὸν⸃ διὰ Ἰησοῦ Χριστοῦ εἰς δόξαν καὶ ἔπαινον θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/011.yaml
  text: filled with the fruit of righteousness that comes through Jesus the Messiah[b][a], to the glory and praise of God.
translation:
  language: am
  text: በኢየሱስ መሲሕ[b] በኩል በሚመጣው የጽድቅ[a] ፍሬ ተሞልታችሁ፣ ይህም ለእግዚአብሔር ክብርና ምስጋና እንዲሆን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የፍትሕ ፍሬ።”
    reason: lexical_alternative
  - marker: b
    text: በግሪክኛ “ኢየሱስ ክርስቶስ”፤ “መሲሕ” የሚለው Χριστόςን እንደ ማዕረግ ይተረጉማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: πεπληρωμένοι
  choice: ተሞልታችሁ
  rationale: የፍጹም ጊዜውን ውጤት የሚቀጥል ሁኔታና ከቀደመው አረፍተ ነገር ጋር ያለውን የአንቀጽ ግንኙነት በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: καρπὸν
  choice: ፍሬ
  rationale: የሥነ ምግባርና የመንፈሳዊ ውጤት ዘይቤን በቀጥታ ይጠብቃል።
- source_word: δικαιοσύνης
  choice: ጽድቅ
  rationale: በዚህ አውድ የሚገባው መደበኛ መጽሐፍ ቅዱሳዊ ቃል ነው፤ ‘ፍትሕ’ የሚለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: በኢየሱስ መሲሕ በኩል በሚመጣው
  rationale: διά ከዝርያ አገባብ ጋር የሚገልጸውን መንገድ ወይም አማካይነት ግልጽና ተፈጥሯዊ በሆነ አማርኛ ይገልጣል።
- source_word: Χριστοῦ
  choice: መሲሕ
  rationale: Χριστός እንደ ማዕረግ ያለውን ‘የተቀባው’ ትርጉም ከ‘ክርስቶስ’ ይልቅ በግልጽ ያስተላልፋል።
- source_word: εἰς δόξαν καὶ ἔπαινον θεοῦ
  choice: ይህም ለእግዚአብሔር ክብርና ምስጋና እንዲሆን
  rationale: εἰς የሚያመለክተውን ዓላማ ወይም ውጤት በተፈጥሯዊ አማርኛ ያስቀምጣል።
theological_decisions:
- issue: የ‘የጽድቅ ፍሬ’ ትርጉም
  choice: የጽድቅ ፍሬ
  alternative: ጽድቅ የሆነ ፍሬ፤ ወይም ጽድቅ የሚያስገኘው ፍሬ
  rationale: የግሪኩ የባለቤትነት አገባብ ፍሬው በጽድቅ የተለየ መሆኑን፣ ጽድቅን ራሱን መሆኑን ወይም ከጽድቅ መገኘቱን ሊያመለክት ይችላል፤ ትርጉሙ ይህን አሻሚነት አይዘጋም።
