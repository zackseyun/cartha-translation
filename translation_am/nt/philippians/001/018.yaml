  text: ታዲያ ምን? ቢያንስ ይህ ነው፤ በማንኛውም መንገድ፣ በማስመሰልም ሆነ በእውነት[a]፣ መሲሑ[b] ይሰበካል፤ በዚህም ደስ ይለኛል። አዎን፣ ወደፊትም ደስ ይለኛል።
  philosophy: optimal-equivalence
  footnotes:
