id: PHP.2.1
reference: Philippians 2:1
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Εἴ τις οὖν παράκλησις ἐν Χριστῷ, εἴ τι παραμύθιον ἀγάπης, εἴ τις κοινωνία πνεύματος, εἴ τις σπλάγχνα καὶ οἰκτιρμοί,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/001.yaml
  text: So if there is any encouragement in Messiah[a], if any comfort from love, if any fellowship of the Spirit, if any affection and compassion,
translation:
  language: am
  text: ስለዚህ፣ በመሲሕ ያለ ማበረታቻ፣ ከፍቅር የሚገኝ መጽናናት፣ የመንፈስ ቅዱስ ኅብረት[a]፣ ጥልቅ ፍቅርና ርኅራኄ ካለ፣
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በመንፈስ ቅዱስ መካፈል»፤ የመሆን ዕድሉ ያነሰው፣ «በመንፈስ ያለ ኅብረት»።
    reason: alternative_reading
lexical_decisions:
- source_word: παράκλησις
  choice: ማበረታቻ
  rationale: በዚህ ዐውድ ቃሉ አማኞችን የሚያጽናናና የሚያበረታታ ነገርን ያመለክታል፤ «ማበረታቻ» ትርጉሙን በዘመናዊና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐν Χριστῷ
  choice: በመሲሑ የሆነ
  rationale: Χριστός እዚህ የማዕረግ ትርጉሙን ይዞ ስለቀረበ «መሲሑ» ተብሏል፤ ἐν የሚያመለክተው ከመሲሑ ጋር ባለው ኅብረት ውስጥ የሆነውን ነው።
- source_word: παραμύθιον
  choice: መጽናናት
  rationale: ቃሉ የሚያረጋጋና የሚያጽናና ንግግርን ወይም ማጽናኛን ያመለክታል፤ ከቀደመው «ማበረታቻ» ጋር ያለውን ልዩነትም ይጠብቃል።
- source_word: ἀγάπης
  choice: ከፍቅር የሚገኝ
  rationale: የግሪኩ የባለቤትነት ቅርጽ ፍቅርን የመጽናናቱ ምንጭ አድርጎ ሊያቀርብ ስለሚችል፣ በተፈጥሯዊ አማርኛ እንዲህ ተገልጿል።
- source_word: κοινωνία
  choice: ኅብረት
  rationale: «ኅብረት» የቃሉን የጋራ ተሳትፎና ግንኙነት ሁለቱንም ሊያስተላልፍ ይችላል።
- source_word: πνεύματος
  choice: የመንፈስ ቅዱስ
  rationale: በጳውሎስ አጠቃቀምና በዐውዱ መሠረት የሚጠቀሰው መንፈስ ቅዱስ መሆኑ ይበልጥ የተቻለ ነው፤ የዝምድናው ዓይነት ግን በግሪኩ ሙሉ በሙሉ አልተገለጸም።
- source_word: σπλάγχνα
  choice: ጥልቅ ፍቅር
  rationale: ቃሉ በቀጥታ የውስጥ አካላትን ቢያመለክትም፣ በፈሊጣዊ አጠቃቀሙ ከልብ የሆነ ጥልቅ ፍቅርንና ስሜትን ይገልጣል።
- source_word: οἰκτιρμοί
  choice: ርኅራኄ
  rationale: «ርኅራኄ» በሌሎች መከራ ልብ መነካትንና ማዘንን በግልጽና ክቡር አማርኛ ያስተላልፋል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ይህ ቃል ከቀደመው ሐሳብ ጋር ያለውን የድምዳሜ ወይም የውጤት ግንኙነት ያሳያል።
theological_decisions:
- issue: πνεύματος መንፈስ ቅዱስን ወይም የሰውን መንፈስ ማመልከቱና ከκοινωνία ጋር ያለው ዝምድና
  choice: የመንፈስ ቅዱስ ኅብረት
  alternative: «በመንፈስ ቅዱስ መካፈል»፤ ወይም፣ የመሆን ዕድሉ ያነሰው «በመንፈስ ኅብረት»
  rationale: ዐውዱና የጳውሎስ የተለመደ አጠቃቀም መንፈስ ቅዱስን የሚያመለክት መሆኑን ይደግፋሉ። ሆኖም የግሪኩ አገባብ ኅብረቱ ከመንፈስ ቅዱስ የሚመጣ መሆኑን ወይም በእርሱ መካፈልን በግልጽ አይለይም፤ ስለዚህ አማራጩ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። በግሪኩ ተደጋግሞ የመጣው εἴ በአማርኛ ዝርዝሩን በአንድ «ካለ» ማጠቃለል ተፈጥሯዊ ስለሆነ እንዲሁ ተተርጉሟል። የአንቀጹ ሐሳብ በቀጣዩ ቁጥር ስለሚጠናቀቅ መጨረሻው በነጠላ ሰረዝ ቀርቧል።
