  edition: SBLGNT
  text: τὴν δὲ δοκιμὴν αὐτοῦ γινώσκετε, ὅτι ὡς πατρὶ τέκνον σὺν ἐμοὶ ἐδούλευσεν εἰς τὸ εὐαγγέλιον.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/022.yaml
  text: But you know his proven character[b][a], that as a child with his father he served with me for the gospel.
translation:
  language: am
  text: እናንተ ግን በፈተና የተረጋገጠውን ባሕርይውን ታውቃላችሁ፤ ልጅ ከአባቱ ጋር እንደሚያገለግል፣ እርሱም ከእኔ ጋር ለወንጌል አገልግሏል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: ግን
  rationale: በዐውዱ ያለውን ቀላል ንጽጽር ወይም ሽግግር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: δοκιμὴν αὐτοῦ
  choice: በፈተና የተረጋገጠውን ባሕርይውን
  rationale: δοκιμή በመፈተን እውነተኛነቱ የታየን ባሕርይ ያመለክታል፤ ይህ አተረጓጎም የፈተናውንም ሆነ የተረጋገጠ ባሕርይን ሐሳብ ይጠብቃል።
- source_word: γινώσκετε
  choice: ታውቃላችሁ
  rationale: የፊልጵስዩስ ሰዎች ስለ ጢሞቴዎስ አስቀድመው ያላቸውን እውቀት በቀጥታ ያሳያል።
- source_word: ὡς πατρὶ τέκνον
  choice: ልጅ ከአባቱ ጋር እንደሚያገለግል
  rationale: τέκνονን ፆታ በማይወስነው ‘ልጅ’ ተርጉሞ የቤተሰብ ምሳሌውን ይጠብቃል፤ በአማርኛም የንጽጽሩን ኃይል በተፈጥሯዊ መንገድ ያቀርባል።
- source_word: σὺν ἐμοὶ ἐδούλευσεν
  choice: እርሱም ከእኔ ጋር … አገልግሏል
  rationale: የጋራ አገልግሎቱን ያሳያል፤ ἐδούλευσεν እዚህ በዐውዱ የአገልግሎትን ትርጉም ስለሚይዝ ‘አገልግሏል’ ተፈጥሯዊና ትክክለኛ ነው።
- source_word: εἰς τὸ εὐαγγέλιον
  choice: ለወንጌል
  rationale: የአገልግሎቱን ዓላማና አቅጣጫ በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: τέκνον ፆታዊ ትርጉም
  choice: ልጅ
  alternative: ወንድ ልጅ
  rationale: ግሪኩ τέκνον በራሱ ፆታን አይወስንም፤ ‘ልጅ’ የምንጩን ስፋት ይጠብቃል።
- issue: ἐδούλευσεν የባርነት ቃላዊ ኃይል
  choice: አገልግሏል
  alternative: እንደ ባሪያ ሠርቷል
  rationale: በዚህ የወንጌል አገልግሎት ዐውድ ግሱ ታማኝ አገልግሎትን ያመለክታል፤ ቃል በቃል የባርነት አገላለጽ በአማርኛ ያልተፈለገ ትርጉም ሊጨምር ይችላል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የግሪኩ የአባትና የልጅ ምሳሌ ተጠብቋል፤ ነገር ግን አማርኛው ጢሞቴዎስ ጳውሎስን እንዳገለገለ እንዳይመስል፣ ሁለቱ አብረው ለወንጌል ማገልገላቸውን ግልጽ ያደርጋል።
