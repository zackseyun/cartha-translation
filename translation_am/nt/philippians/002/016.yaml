  - severity: medium
    issue: The referent and content of Paul’s boasting are not fully clear.
    rationale: The draft’s “ይህም ... የምመካበት ይሆናል” leaves “this” vague. The Greek presents the recipients’ steadfastness as Paul’s cause for boasting on the day of the Messiah, namely that his running and labor were not futile.
