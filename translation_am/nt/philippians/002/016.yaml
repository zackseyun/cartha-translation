lexical_decisions:
- source_word: λόγον ζωῆς
  choice: የሕይወትን ቃል
  rationale: λόγος ቃልንም መልእክትንም ሊያመለክት ይችላል፤ “የሕይወት ቃል” የግሪኩን አጭር አገላለጽና ሕይወትን የሚሰጥ/ስለ ሕይወት የሚናገር የሚለውን ድርብ ኃይል ይጠብቃል።
- source_word: ἐπέχοντες
  choice: አጥብቃችሁ ያዙ
  rationale: ቃሉ ‘አጥብቆ መያዝ’ ወይም ‘ወደ ፊት ማቅረብ/ለሌሎች ማቅረብ’ ሊሆን ይችላል። የቀደመው የጽናትና የታዛዥነት አውድ ዋናውን ምርጫ ይደግፋል፤ ሌላው ትርጉም በማስታወሻ ተጠብቋል።
- source_word: καύχημα
  choice: የምመካበት
  rationale: ስሙ አንድ ሰው የሚመካበትን ነገር ያመለክታል። ይህ አገላለጽ ፊልጵስዩስ ለጳውሎስ ተገቢ የመመኪያ ምክንያት መሆናቸውን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἡμέραν Χριστοῦ
  choice: በመሲሑ ቀን
  rationale: Χριστός እዚህ የማዕረግ ኃይሉን ይዞ በመጨረሻው ዘመን የሚሆነውን ቀን ያመለክታል፤ ባህላዊው “በክርስቶስ ቀን” በማስታወሻ ተቀምጧል።
- source_word: οὐκ εἰς κενὸν
  choice: በከንቱ እንዳል…
  rationale: ይህ ፍሬ አልባነትን ወይም ዓላማ ቢስነትን የሚገልጽ ፈሊጥ ነው፤ “በከንቱ” የጳውሎስን ትይዩ አገላለጽ በአጭሩ ይጠብቃል።
- source_word: ἔδραμον
  choice: እንዳልሮጥኩ
  rationale: የሩጫው ምስል የጳውሎስን የአገልግሎት ጥረትና ጉዞ ያመለክታል፤ ምሳሌያዊው ምስል በቀጥታ ተጠብቋል።
- source_word: ἐκοπίασα
  choice: እንዳልደከምኩ
  rationale: κοπιάω ከባድና አድካሚ ጥረትን ያመለክታል። “ደከምኩ” በዘመናዊ አማርኛ ይህን ክብደት በተፈጥሮ ያስተላልፋል።
