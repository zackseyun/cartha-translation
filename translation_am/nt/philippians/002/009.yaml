  text: διὸ καὶ ὁ θεὸς αὐτὸν ὑπερύψωσεν, καὶ ἐχαρίσατο αὐτῷ ⸀τὸ ὄνομα τὸ ὑπὲρ πᾶν ὄνομα,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/009.yaml
  text: Therefore God also highly exalted him and graciously gave him the name that is above every name[b][a],
translation:
  language: am
  text: ስለዚህ እግዚአብሔርም እጅግ ከፍ አደረገው፤ ከስም ሁሉ በላይ የሆነውን ስም[b] በጸጋ ሰጠው[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በጸጋ ሰጠው” የሚለው “አደለው” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “ስም” የሚለው የሚጠራ ስምን ብቻ ሳይሆን ሥልጣንን፣ ደረጃን ወይም ማዕረግንም ሊያመለክት ይችላል፤ ይህ ቁጥር ግን የትኛው ስም እንደሆነ ገና አይገልጽም።
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ καὶ
  choice: ስለዚህ ...ም
  rationale: “ስለዚህ” የδιόን የምክንያትና የውጤት ግንኙነት ይጠብቃል፤ በ“እግዚአብሔርም” ላይ ያለው “ም” ደግሞ የκαίን ጭማሪ ኃይል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὁ θεὸς
  choice: እግዚአብሔር
  rationale: በዚህ አውድ ግልጽና የተወሰነ መለኮታዊ ባለቤትን ለመግለጽ የተለመደውን ክቡር የአማርኛ ቃል ይጠቀማል።
- source_word: ὑπερύψωσεν
  choice: እጅግ ከፍ አደረገው
  rationale: የግሱን አጽንዖት በ“እጅግ” ያሳያል፤ “ከሁሉ በላይ” ወይም “ወደ ከፍተኛው ስፍራ” ብሎ በመጨመር ጽሑፉን አይተረጉምም።
- source_word: ἐχαρίσατο
  choice: በጸጋ ሰጠው
  rationale: የመስጠትን ዋና ሐሳብ እና ከχάρις ጋር ያለውን የጸጋ ፍንጭ ሁለቱንም በግልጽ አማርኛ ይጠብቃል።
- source_word: τὸ ὄνομα
  choice: ስም
  rationale: የግሪኩን ቀጥተኛ ቃል ይጠብቃል፤ በዋናው ጽሑፍ “ማዕረግ” ብሎ የትርጉም አማራጩን አይወስንም።
- source_word: τὸ ὑπὲρ πᾶν ὄνομα
  choice: ከስም ሁሉ በላይ የሆነውን ስም
  rationale: የὑπὲρ πᾶνን ንጽጽራዊ አወቃቀር በተፈጥሯዊና ግልጽ አማርኛ ያቆያል።
theological_decisions:
- issue: “ስሙ” ማንነት
  choice: በዋናው ጽሑፍ የትኛው ስም እንደሆነ ሳይወሰን “ስም” ተብሎ ተቀምጧል።
  alternative: “ኢየሱስ” የሚለው ስም ነው፤ ወይም በቀጣዮቹ ቁጥሮች የሚገለጠው “ጌታ” የሚለው መለኮታዊ ማዕረግ ነው።
  rationale: ቁጥር 9 ራሱ ስሙን በግልጽ አይጠቅስም፤ ስለዚህ ትርጉሙ ከቁጥር 10–11 የሚነሳውን አንድ ትርጓሜ ወደዚህ ቁጥር አያስገባም።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ ነው። “እጅግ ከፍ አደረገው” የግሪኩን አጽንዖት ያቆያል፤ “በጸጋ ሰጠው” ደግሞ የἐχαρίσατοን የጸጋ ትርጉም በቀላሉ ያሳያል።
