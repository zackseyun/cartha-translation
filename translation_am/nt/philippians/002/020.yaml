- source_word: ἰσόψυχον
  choice: ከእኔ ጋር አንድ ልብ የሆነ
  rationale: ቃሉ በቀጥታ “እኩል ነፍስ ያለው” የሚል ቢሆንም፣ ከጳውሎስ ጋር የተመሳሳይ ውስጣዊ ዝንባሌና ዓላማ ያለውን ሰው ያመለክታል፤ “አንድ ልብ” ይህን በግልጽና በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὅστις
  choice: የሆነና … የሚያስብ
