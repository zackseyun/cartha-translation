- source_word: τὰ περὶ ὑμῶν
  choice: ስለ እናንተ ጉዳይ
  rationale: “እናንተን የሚመለከቱትን ነገሮች” የሚለውን ሰፊ ፍቺ ይጠብቃል፤ ወደ ቁሳዊ ደኅንነት ብቻ አያጠብበውም።
- source_word: μεριμνήσει
  choice: የሚያስብ
