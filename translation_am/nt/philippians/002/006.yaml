  text: 'እርሱ በእግዚአብሔር መልክ ቢሆንም[a]፣ ከእግዚአብሔር ጋር እኩል መሆንን[c] ለራሱ ጥቅም የሚውል ነገር[b] አድርጎ አልቈጠረውም።


    [a] ወይም፣ «በእግዚአብሔር መልክ ሆኖ»። ὑπάρχων የተባለው ቃል ተቃርኖን በሚያመለክት መንገድ («ቢሆንም») ወይም ያለበትን ሁኔታ ብቻ በሚገልጥ መንገድ («ሆኖ») ሊተረጎም ይችላል።


    [b] ወይም፣ «ሊጨበጥ የሚችል ነገር» ወይም «ሊነጠቅ የሚችል ነገር»።


    [c] ቃል በቃል፣ «ከእግዚአብሔር ጋር እኩል መሆንን»።'
