  text: እንዲሁም[a] እናንተ ደስ ይበላችሁ፤ ከእኔም ጋር ደስ ይበላችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በዚሁ መንገድ እናንተም ደስ ይበላችሁ፤ ደስታችሁንም ከእኔ ጋር ተካፈሉ።»
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ...αὐτὸ
  choice: እንዲሁም
  rationale: ይህ ሐረግ እዚህ በተውሳከ ግስ ተግባር የቀደመውን የጋራ ደስታ ያመለክታል፤ «እንዲሁም» ትርጉሙን በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: χαίρετε
  choice: ደስ ይበላችሁ
  rationale: የአሁን ጊዜ ትእዛዛዊ ግስ ሲሆን በፊልጵስዩስ መልእክት ተደጋግሞ የሚታየውን የደስታ ቋንቋ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: συγχαίρετέ
  choice: ከእኔም ጋር ደስ ይበላችሁ
  rationale: የተዋሐደው ግስ ደስታን ከሌላ ሰው ጋር መካፈልን ያመለክታል፤ ይህ አተረጓጎም የጋራ ደስታውን በግልጽ ሁኔታ ያሳያል።
- source_word: μοι
  choice: ከእኔም ጋር
  rationale: የመስጫ ቅጥ ያለው ተውላጠ ስም ፊልጵስዩስ ሰዎች ደስታቸውን ከጳውሎስ ጋር እንዲካፈሉ ያመለክታል።
