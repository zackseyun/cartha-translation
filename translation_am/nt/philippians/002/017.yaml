  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የመሥዋዕት ምስሉ ሳይለዝብ ተጠብቋል፤ ነገር ግን λειτουργία በዋናው ጽሑፍ በቤተ እምነት ልዩ ቃል አልተገደበም።
