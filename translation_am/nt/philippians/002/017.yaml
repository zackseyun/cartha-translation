  text: ἀλλὰ εἰ καὶ σπένδομαι ἐπὶ τῇ θυσίᾳ καὶ λειτουργίᾳ τῆς πίστεως ὑμῶν, χαίρω καὶ συγχαίρω πᾶσιν ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/017.yaml
  text: But even if I am being poured out as a drink offering upon the sacrifice and service of your faith[c][b][a], I rejoice and rejoice with all of you.
translation:
  language: am
  text: 'ፊልጵስዩስ 2፥17


    ነገር ግን በየእምነታችሁ መሥዋዕትና አገልግሎት ላይ እኔ እንደ መጠጥ መባ ብፈስ እንኳ[a]፣ ደስ ይለኛል፤ ከሁላችሁ ጋርም ደስ ይለኛል።


    [a] ወይም፣ “እንደ መጠጥ መሥዋዕት እየቀረብኩ ብሆን እንኳ።”


    [b] “አገልግሎት” የሚለው “የክህነት አገልግሎት” ተብሎም ሊተረጎም ይችላል፤ የግሪኩ ቃል እዚህ የአምልኮን ትርጉም ይዟል።


    [c] ወይም፣ “በታማኝነታችሁ መሥዋዕትና አገልግሎት።”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እንደ መጠጥ መሥዋዕት እየቀረብኩ ብሆን እንኳ።”
    reason: lexical_alternative
  - marker: b
    text: “አገልግሎት” የሚለው “የክህነት አገልግሎት” ተብሎም ሊተረጎም ይችላል፤ የግሪኩ ቃል እዚህ የአምልኮን ትርጉም ይዟል።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “በታማኝነታችሁ መሥዋዕትና አገልግሎት።”
    reason: alternative_reading
lexical_decisions:
- source_word: σπένδομαι
  choice: እንደ መጠጥ መባ እየፈሰስኩ
  rationale: የግሪኩ ግስ በመሥዋዕታዊ አምልኮ ጊዜ የሚፈስስን የመጠጥ መባ ያመለክታል፤ ይህ አተረጓጎም ምሳሌያዊውን ምስልና ተደራጊ ቅርጹን ይጠብቃል።
- source_word: ἐπὶ
  choice: ላይ
  rationale: ከተከታዩ የመሥዋዕት ቃላት ጋር ሲነበብ፣ የጳውሎስ ሕይወት በፊልጵስዩስ ሰዎች መሥዋዕት ላይ እንደሚፈስስ ያለውን ምስል በቀጥታ ይገልጣል።
- source_word: θυσίᾳ
  choice: መሥዋዕት
  rationale: መደበኛውን መሥዋዕታዊ ቃል በመጠቀም የአምልኮውን ምስል ይጠብቃል።
- source_word: λειτουργίᾳ
  choice: አገልግሎት
  rationale: በዘመናዊ አማርኛ ገለልተኛና ተፈጥሯዊ ነው፤ በዐውዱ ያለው የአምልኮ ወይም የክህነት ጥላ በአጠገቡ ባለው “መሥዋዕት” እና በእግር ማስታወሻው ተጠብቋል።
- source_word: πίστεως
  choice: እምነታችሁ
  rationale: በዚህ ዐውድ πίστις በቀዳሚነት የፊልጵስዩስ ሰዎችን እምነት ያመለክታል፤ “ታማኝነት” የሚለው አማራጭ ግን በማስታወሻ ተጠብቋል።
- source_word: χαίρω
  choice: ደስ ይለኛል
  rationale: በዘመናዊ አማርኛ ተፈጥሯዊ ሆኖ በፊልጵስዩስ መልእክት ውስጥ ያለውን የደስታ ጭብጥ ይጠብቃል።
- source_word: συγχαίρω
  choice: ከ…ጋርም ደስ ይለኛል
  rationale: ከማኅበሩ ሁሉ ጋር የሚጋራውን ደስታ ይገልጣል፤ ከχαίρω ጋር ያለውን የቃል ድግግሞሽም ይጠብቃል።
- source_word: πᾶσιν ὑμῖν
  choice: ከሁላችሁም ጋር
  rationale: ማኅበሩን በሙሉ የሚያካትተውን አጽንዖት በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: ጳውሎስ ሊሞት ስለሚችልበት ሁኔታ የተጠቀመው መሥዋዕታዊ ምስል
  choice: ጳውሎስ ራሱን በፊልጵስዩስ ሰዎች መሥዋዕትና አገልግሎት ላይ እንደሚፈስስ የመጠጥ መባ ገልጦታል።
  alternative: ሕይወቱ ከእነርሱ አገልግሎት ጎን ብቻ እንደሚሰጥ ያለ ግልጽ መሥዋዕታዊ አጽንዖት መተርጎም።
  rationale: σπένδομαι፣ θυσία እና λειτουργία በአንድነት መምጣታቸው የአምልኮና የመሥዋዕት ምስሉን እንዳይጠፋ ይጠይቃል።
- issue: πίστις በዚህ ስፍራ እምነት ወይስ ታማኝነት መሆኑ
  choice: በዋናው ጽሑፍ “እምነታችሁ” ተብሏል።
  alternative: “ታማኝነታችሁ”
  rationale: “እምነት” በዐውዱ የበለጠ ተፈጥሯዊ ቢሆንም የግሪኩ ቃል ሁለቱንም ሊያመለክት ስለሚችል አማራጩ በእግር ማስታወሻ ቀርቧል።
