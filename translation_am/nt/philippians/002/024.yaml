  to: በጌታ፣ እኔ ራሴም በቅርቡ እንደምመጣ እርግጠኛ ነኝ።[a]
  rationale: The revision uses one natural Amharic expression, “እርግጠኛ ነኝ,” for πέποιθα, while retaining “በጌታ” without resolving its nuanced relation to Paul's confidence. It also preserves the emphatic-additive “καὶ αὐτός” as “እኔ ራሴም” and retains “በቅርቡ” for ταχέως. The footnote offers the legitimate alternative based on “እታመናለሁ.”
