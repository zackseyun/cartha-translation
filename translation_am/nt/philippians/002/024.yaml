  rationale: ትርጉሙ የጳውሎስ ተስፋ በጌታ ላይ የተመሠረተ መሆኑን ይጠብቃል፤ ነገር ግን እንደ ቀጥተኛ መለኮታዊ መገለጥ አድርጎ አያጠናክረውም።
