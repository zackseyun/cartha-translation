lexical_decisions:
- source_word: πέποιθα
  choice: ታምኜ … እርግጠኛ ነኝ
  rationale: የግሪኩ ፍጹም ጊዜ ግስ የጸናና አሁንም የሚቀጥል እምነትን ያመለክታል፤ ይህ አገላለጽ ያንን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δὲ
  choice: ም
  rationale: ቀላል የንግግር ትስስሩን በአማርኛ ተያያዥ ቅጥያ ገልጿል።
- source_word: ἐν κυρίῳ
  choice: በጌታ
  rationale: የጳውሎስን የተለመደ አገላለጽ በመጠበቅ፣ የእርግጠኝነቱ መሠረትና የሚገኝበት የግንኙነት ክልል ጌታ መሆኑን ይገልጣል።
- source_word: ὅτι
  choice: እንደምመጣ
  rationale: የእርግጠኝነቱን ይዘት በተፈጥሯዊው የአማርኛ ‘እንደ…’ የተያያዥ ግስ ቅርጽ ያስገባል።
- source_word: καὶ αὐτὸς
  choice: እኔ ራሴ ደግሞ
  rationale: αὐτός የሚሰጠውን የግል አጽንዖትና καί የሚሰጠውን ጭማሪ በአንድነት ይጠብቃል፤ ከጢሞቴዎስ መላክ በተጨማሪ ጳውሎስ ራሱም እንደሚመጣ ያሳያል።
- source_word: ταχέως
  choice: በቅርቡ
  rationale: በዚህ አውድ የጉዞ ፍጥነትን ሳይሆን በጊዜ ቅርብ መሆንን ያመለክታል።
- source_word: ἐλεύσομαι
  choice: እንደምመጣ
  rationale: የወደፊት መምጣትንና ወደ ፊልጵስዩስ አማኞች ያተኮረውን የግሪኩን እይታ ይጠብቃል።
- source_word: κυρίῳ
  choice: ጌታ
  rationale: በጳውሎስ አጠቃቀምና በዚህ አውድ κύριοςን በክብር ለመተርጎም ‘ጌታ’ ተፈጥሯዊና ትክክለኛ ነው።
