id: PHP.2.19
reference: Philippians 2:19
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ἐλπίζω δὲ ἐν κυρίῳ Ἰησοῦ Τιμόθεον ταχέως πέμψαι ὑμῖν, ἵνα κἀγὼ εὐψυχῶ γνοὺς τὰ περὶ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/019.yaml
  text: But I hope in the Lord Jesus to send Timothy to you soon[a], so that I too may be encouraged when I learn the things concerning you.
translation:
  language: am
  text: ነገር ግን፣ ስለ እናንተ ያለውን ነገር ባወቅሁ ጊዜ እኔም ልበረታታ ዘንድ፣ ጢሞቴዎስን በቅርቡ ወደ እናንተ እንድልክ በጌታ ኢየሱስ ተስፋ አደርጋለሁ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλπίζω
  choice: ተስፋ አደርጋለሁ
  rationale: የጳውሎስን የአሁን ተስፋና ጥበቃ በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከቀደመው ንግግር ጋር ያለውን ለስላሳ ሽግግር ወይም ንጽጽር ያሳያል።
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: በጌታ ኢየሱስ
  rationale: ተስፋው በጌታ ኢየሱስ ላይ ባለው ጥገኝነትና ኅብረት ውስጥ መሆኑን የሚገልጽ የተለመደ አማርኛ ነው።
- source_word: Τιμόθεον
  choice: ጢሞቴዎስን
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠራር የተለመደውን የስሙን ቅርጽ ይጠቀማል።
- source_word: ταχέως
  choice: በቅርቡ
  rationale: በዚህ ዐውድ ፍጥነትን ሳይሆን የታሰበውን ቅርብ ጊዜ በግልጽ ያሳያል።
- source_word: πέμψαι ὑμῖν
  choice: ወደ እናንተ ለመላክ
  rationale: የመላኩን እንቅስቃሴና ተቀባዮቹን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἵνα κἀγὼ εὐψυχῶ
  choice: እኔም እንድበረታታ
  rationale: የዓላማውን ግንኙነት፣ κἀγώ ያለውን ‘እኔም’ አጽንዖትና የመንፈስ መበረታታትን ያስተላልፋል።
- source_word: γνοὺς τὰ περὶ ὑμῶν
  choice: ስለ እናንተ ያለውን ሁኔታ ሳውቅ
  rationale: የአኦሪስት አካፋዩን ጊዜያዊ ግንኙነት በ‘ሳውቅ’ ይገልጻል፤ τὰ περὶ ὑμῶν ደግሞ የእነርሱን ጉዳይና ሁኔታ በቅርብ መልኩ ያሳያል።
theological_decisions:
- issue: ἐν κυρίῳ Ἰησοῦ ውስጥ κύριος አተረጓጎም
  choice: ጌታ
  alternative: ባለቤት
  rationale: κύριος እዚህ የክርስቶስ ማዕረግ ነው፤ ‘ጌታ’ የተለመደ፣ ክብር ያለውና የምንጩን ክርስቶሳዊ አጠቃቀም የሚጠብቅ ቃል ነው።
- issue: ἐν የሚያመለክተው ግንኙነት
  choice: በጌታ ኢየሱስ
  alternative: በጌታ ኢየሱስ አማካይነት
  rationale: ‘በጌታ ኢየሱስ’ የጳውሎስን ተስፋ በጌታ ውስጥ ካለው ጥገኝነትና ኅብረት ጋር ክፍት አድርጎ ይጠብቃል፤ ‘አማካይነት’ የመሣሪያነት ትርጉምን ከልክ በላይ ሊወስን ይችላል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የዓላማው አንቀጽ በአማርኛ ተፈጥሯዊ አቀራረብ ከዋናው አንቀጽ በፊት ተቀምጧል። የእንግሊዝኛው [a] ማስታወሻ ከሚያመለክተው ቦታ ጋር የማይጣጣም መስሎ ስለታየና የአማርኛው ትርጉም τὰ περὶ ὑμῶνን በቅርብ ስለያዘ፣ አላስፈላጊ የግርጌ ማስታወሻ አልተጨመረም።
