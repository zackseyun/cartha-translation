  text: Ἀναγκαῖον δὲ ἡγησάμην Ἐπαφρόδιτον τὸν ἀδελφὸν καὶ συνεργὸν καὶ συστρατιώτην μου, ὑμῶν δὲ ἀπόστολον καὶ λειτουργὸν τῆς χρείας μου, πέμψαι πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/025.yaml
  text: But I considered it necessary to send to you Epaphroditus—my brother and fellow worker and fellow soldier[b][a], and your messenger and minister to my need—
translation:
  language: am
  text: 'ነገር ግን ወንድሜ፣ አብሮኝ የሚሠራና አብሮኝ የሚዋጋ ወታደር፣ እንዲሁም የእናንተ መልእክተኛ[a] እና በሚያስፈልገኝ ነገር የሚያገለግለኝ ኤጳፍሮዲጦስን ወደ እናንተ መላክ አስፈላጊ እንደሆነ ቆጠርኩ።


    [a] ወይም፣ “ሐዋርያችሁ”፤ ማለትም እናንተ የላካችሁት።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሐዋርያችሁ”፤ ማለትም እናንተ የላካችሁት።
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀναγκαῖον
  choice: አስፈላጊ
  rationale: የግድነትን ወይም እንደ አስፈላጊ የተቈጠረን ነገር በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἡγησάμην
  choice: ቈጠርኩ
  rationale: የጳውሎስን የተመዘነ ፍርድና ግምገማ ያሳያል፤ ተራ ግምትን ብቻ አያመለክትም።
- source_word: πέμψαι
  choice: መላክ
  rationale: ግሱ በግልጽ የሚለው ‘መላክ’ ነው፤ ‘መልሶ መላክ’ የሚለውን ከዐውደ ንባቡ በመጨመር አልተተረጎመም።
- source_word: ἀδελφὸν
  choice: ወንድሜ
  rationale: በእምነት ያለውን የቤተሰብ ቅርበት የግሪኩን ቃል በቀጥታ በመጠበቅ ይገልጣል።
- source_word: συνεργὸν
  choice: አብሮኝ የሚሠራ
  rationale: በወንጌል ሥራ ከጳውሎስ ጋር አብሮ የሚደክም ሰው መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: συστρατιώτην
  choice: አብሮኝ የሚዋጋ ወታደር
  rationale: የግሪኩን ወታደራዊ ዘይቤ በግልጽና በተረዳ አነጋገር ይጠብቃል።
- source_word: ἀπόστολον
  choice: መልእክተኛ
  rationale: በዚህ ዐውደ ንባብ ኤጳፍሮዲጦስ በፊልጵስዩስ ሰዎች የተላከ ወኪል መሆኑን ያሳያል፤ የተወሰነውን የሐዋርያነት ማዕረግ አያስገባም።
- source_word: λειτουργὸν τῆς χρείας μου
  choice: በችግሬ ያገለገለኝ
  rationale: ለጳውሎስ ተግባራዊ እጥረት የተደረገውን ክቡር አገልግሎት በተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: ἀπόστολον እንደ ቴክኒካዊ ማዕረግ ‘ሐዋርያ’ ወይስ በሰፊ ትርጉሙ ‘መልእክተኛ’ ተብሎ መተርጎም
  choice: መልእክተኛ
  alternative: ሐዋርያችሁ
  rationale: ቅርብ ዐውደ ንባቡ ኤጳፍሮዲጦስን ፊልጵስዩስ ሰዎች ወደ ጳውሎስ የላኩት ወኪል አድርጎ ያቀርበዋል። ‘መልእክተኛ’ የመላክን ሐሳብ ይጠብቃል፤ ‘ሐዋርያ’ የሚለው አማራጭም በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ሦስቱ የጳውሎስ ግንኙነት መግለጫዎችና ሁለቱ የፊልጵስዩስ ሰዎች ግንኙነት መግለጫዎች ተጠብቀዋል።
