- source_word: τὰ Ἰησοῦ Χριστοῦ
  choice: የኢየሱስ መሲሕን ጉዳይ
  rationale: በግሪኩ የተደገመው ገላጭ ብዙ ቁጥር ‘የኢየሱስ መሲሕ የሆኑትን’ የሚል ሲሆን፣ በአማርኛ ‘ጉዳይ’ን መድገም ሐሳቡን ግልጽ ያደርገዋል። Χριστός እዚህ እንደ ማዕረግ ‘መሲሕ’ ተብሏል።
