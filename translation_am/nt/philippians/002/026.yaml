  choice: —ነበርና
  rationale: የኤጳፍሮዲጦስን መመለስ የሚያብራራውን ምክንያታዊ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐπιποθῶν ἦν
  choice: እጅግ ይናፍቅ ነበር
  rationale: የአሁን ጊዜ አሳታፊ ግስና ያለፈ ጊዜ ረዳት ግስ የሚገልጹትን በያለፈው ጊዜ የቀጠለ ስሜት ይጠብቃል፤ ‘እጅግ’ ደግሞ የግሱን ጥንካሬ ያሳያል።
- source_word: πάντας ὑμᾶς
  choice: ሁላችሁንም
  rationale: πάντας የሚሰጠውን ሁሉን አቀፍ አጽንዖት በአጭርና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἀδημονῶν
  choice: በጣም ተጨንቆ ነበር
  rationale: ቃሉ ከቀላል ስጋት የበለጠ ጥልቅ የስሜት መረበሽን ያመለክታል፤ ይህ አተረጓጎም ጥንካሬውን ያለ ማጋነን ያስተላልፋል።
- source_word: διότι
  choice: በመስማታችሁ
  rationale: በግሪኩ ያለውን የምክንያት ግንኙነት በአማርኛ የምክንያት የግስ ስም ቅርጽ ያሳያል።
- source_word: ἠκούσατε
  choice: መስማታችሁ
  rationale: የሁለተኛ መደብ ብዙ ቁጥር ቅርጹን ግልጽ አድርጎ ይጠብቃል።
- source_word: ὅτι ἠσθένησεν
  choice: መታመሙን
  rationale: በዚህ ዐውድ ἀσθενέω አካላዊ ሕመምን ያመለክታል፤ ‘መታመሙን’ ይህን በተፈጥሯዊ አማርኛ ይገልጻል።
