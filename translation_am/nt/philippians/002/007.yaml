  text: but emptied himself[a], taking the form of a servant, becoming in the likeness of men[d][c][b]; and being found in appearance as a man
translation:
  language: am
  text: ነገር ግን የባሪያን መልክ ይዞ፣ በሰዎችም አምሳል ሆኖ፣ ራሱን ባዶ አደረገ፤ በውጫዊ አቋሙም እንደ ሰው ሆኖ ተገኘ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: ነገር ግን
  rationale: ከቀደመው ሐሳብ ጋር ያለውን ጠንካራ ንፅፅር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἑαυτὸν ἐκένωσεν
  choice: ራሱን ባዶ አደረገ
  rationale: የግሪኩን የ‘ባዶ ማድረግ’ ዘይቤ ሳይተረጉም ይጠብቃል፤ ተከታዮቹ አንቀጾች ይህ እንዴት እንደሆነ ያብራራሉ።
- source_word: μορφὴν δούλου λαβών
  choice: የባሪያን መልክ ይዞ
  rationale: μορφήን ‘መልክ’፣ δοῦλοςን ደግሞ የታሰረ የአገልግሎት ሁኔታውን በሚያሳይ ‘ባሪያ’ ተብሎ ተተርጉሟል። ይህም ከቁጥር 6 ጋር ያለውን የμορφή ትይዩነት ይጠብቃል።
- source_word: ἐν ὁμοιώματι ἀνθρώπων γενόμενος
  choice: በሰዎችም አምሳል ሆኖ
  rationale: ὁμοίωμαን ‘አምሳል’ ብሎ በቀጥታ ይጠብቃል፤ γενόμενοςን ‘ሆኖ’ ማለት ከጽሑፉ በላይ ‘ተወለደ’ የሚል ልዩ ማብራሪያ አያስገባም። ἀνθρώπων ብዙ ቁጥርና አጠቃላይ የሰው ዘር ማመልከቻ ስለሆነ ‘ሰዎች’ ተብሏል።
- source_word: σχήματι εὑρεθεὶς ὡς ἄνθρωπος
  choice: በውጫዊ አቋሙም እንደ ሰው ሆኖ ተገኘ
  rationale: σχῆμα ከμορφή ተለይቶ የሚታየውን አቋምና ገጽታ ስለሚያመለክት ‘ውጫዊ አቋም’ ተመርጧል፤ ἄνθρωπος እዚህ ፆታን ሳይለይ ሰውን በአጠቃላይ ያመለክታል።
theological_decisions:
- issue: ‘ራሱን ባዶ አደረገ’ (ἑαυτὸν ἐκένωσεν) የሚለው ትርጉም
  choice: ዘይቤውን በቀጥታ ማቆየትና የባሪያን መልክ መያዙና በሰዎች አምሳል መሆኑ እንዲያብራሩት መተው
  alternative: መለኮታዊ ባሕርያቱን ተወ ወይም ራሱን ምንም አደረገ ብሎ መፍታት
  rationale: ግሪኩ ምን እንዳፈሰሰ ወይም እንደተወ አይገልጽም፤ ስለዚህ ትርጉሙ ክርስቶሎጂያዊ ንድፈ ሐሳብን ሳያስገባ የጽሑፉን ውጥረት ይጠብቃል።
- issue: ‘በሰዎች አምሳል’ የሚለው አነጋገር
  choice: ὁμοίωμαን ‘አምሳል’ ብሎ ማቆየት
  alternative: ሰው መስሎ ብቻ ታየ ማለት ወይም ግሪኩ ከሚለው የበለጠ ግልጽ አድርጎ ‘ፍጹም ሰው ሆነ’ ማለት
  rationale: ቃሉ እውነተኛ ሰብዓዊነቱን እንደሚክድ መተርጎምም ሆነ የግሪኩን ልዩ አነጋገር ማጥፋት አይገባም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለመደበኛ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩን ተሳቢ አንቀጾች ከዋናው ግስ በፊት ማስቀመጥ በአማርኛ ተፈጥሯዊ ሲሆን እነርሱም ራሱን ባዶ ያደረገበትን መንገድ እንዲያብራሩ ያደርጋል።
