  text: ὅτι διὰ τὸ ἔργον ⸀Χριστοῦ μέχρι θανάτου ἤγγισεν, ⸀παραβολευσάμενος τῇ ψυχῇ ἵνα ἀναπληρώσῃ τὸ ὑμῶν ὑστέρημα τῆς πρός με λειτουργίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/030.yaml
  text: because for the work of Messiah he came near to death[c][b][a], risking his life to make up for what was lacking in your service to me.
translation:
  language: am
  text: ምክንያቱም ለመሲሑ[a] ሥራ ሲል[c] ሕይወቱን ለአደጋ አጋልጦ ለሞት ተቃርቦ ነበር፤ ይህንም ያደረገው ለእኔ በምታደርጉት አገልግሎት የጎደለውን[b] እንዲያሟላ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ክርስቶስ።” በግሪክ፦ “የክርስቶስ/የመሲሑ ሥራ።”
    reason: alternative_reading
  - marker: b
    text: “የጎደለው” የሚለው፣ የፊልጵስዩስ ሰዎች በሩቅ ስለነበሩ በአካል ለጳውሎስ ሊያደርጉለት ያልቻሉትን አገልግሎት ያመለክታል እንጂ ፈቃደኛ አለመሆናቸውን አይደለም።
    reason: cultural_note
  - marker: c
    text: ወይም፣ “በመሲሑ ሥራ ምክንያት።”
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τὸ ἔργον Χριστοῦ
  choice: ለመሲሑ ሥራ ሲል
  rationale: διά ከወንድ ተሳቢ ጋር በዚህ አውድ ምክንያትን ወይም ‘ስለ/ለ… ሲል’ የሚለውን ትርጉም ይሰጣል፤ ይህ አገላለጽ በአማርኛ ተፈጥሯዊ ሆኖ የግሪኩን ኃይል ይጠብቃል።
- source_word: Χριστοῦ
  choice: መሲሑ
  rationale: Χριστός በዚህ ሐረግ የማዕረግ ትርጉሙን ስለሚያሰማ፣ ‘መሲሑ’ ተብሎ ተተርጉሟል።
- source_word: μέχρι θανάτου ἤγγισεν
  choice: እስከ ሞት ድረስ ቀርቦ ነበር
  rationale: የግሪኩን ‘ወደ ሞት ቀረበ’ የሚለውን ግልጽ ምስል ይጠብቃል።
- source_word: παραβολευσάμενος τῇ ψυχῇ
  choice: ሕይወቱን ለአደጋ አጋልጦ
  rationale: ተሳቢው ሆን ብሎ ራሱን ለከባድ አደጋ ማጋለጡን ያመለክታል፤ ψυχή እዚህ ‘ሕይወት’ ማለት ነው።
- source_word: ἵνα ἀναπληρώσῃ
  choice: እንዲሞላ
  rationale: ἵνα ዓላማን ያመለክታል፤ ἀναπληρόω ደግሞ የጎደለውን ማሟላት ማለት ነው።
- source_word: τὸ ὑμῶν ὑστέρημα
  choice: የጎደለውን
  rationale: ይህ ሐረግ የሥነ ምግባር ጉድለትን ሳይጭን፣ በአካል መገኘት ባለመቻላቸው ያልተፈጸመውን ያመለክታል።
- source_word: τῆς πρός με λειτουργίας
  choice: ለእኔ በምታደርጉት አገልግሎት
  rationale: λειτουργία እዚህ ለጳውሎስ የተደረገውን ተግባራዊ እርዳታና አገልግሎት በሰፊው ያመለክታል።
theological_decisions:
- issue: በጳውሎስ ሐረግ Χριστοῦን መተርጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: ቃሉ በዚህ አውድ እንደ ማዕረግ የሚሠራ ስለሆነ ‘መሲሑ’ የትርጉም ኃይሉን በግልጽ ያስተላልፋል፤ የተለመደው ‘ክርስቶስ’ ግን በማስታወሻ ቀርቧል።
- issue: የፊልጵስዩስ ሰዎች ‘ጉድለት’ ትርጉም
  choice: በአገልግሎታቸው የጎደለው
  alternative: የእናንተ ጉድለት
  rationale: አውዱ እምቢተኝነትን ወይም የሞራል ውድቀትን አያስረዳም፤ ኤጳፍሮዲጦስ እነርሱ በርቀት ምክንያት በአካል ሊያደርጉት ያልቻሉትን አሟልቷል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ሐረግ ረጅም በመሆኑ ትርጉሙ በሰሚኮሎን ተከፍሎ ቀርቧል፤ የተሳቢው አደጋን የመጋፈጥ ኃይልና የዓላማው ሐረግ ተጠብቀዋል።
