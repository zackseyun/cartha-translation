  rationale: The revision makes Epaphroditus explicitly the one who supplies what the Philippians could not personally provide, preserving the active force of ἀναπληρώσῃ. It also uses a more idiomatic Amharic expression for his coming near to death. Footnote markers and all footnote content are retained and remain correctly anchored.
