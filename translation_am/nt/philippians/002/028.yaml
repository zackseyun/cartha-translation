id: PHP.2.28
reference: Philippians 2:28
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: σπουδαιοτέρως οὖν ἔπεμψα αὐτὸν ἵνα ἰδόντες αὐτὸν πάλιν χαρῆτε κἀγὼ ἀλυπότερος ὦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/028.yaml
  text: Therefore I sent him all the more eagerly, so that when you see him again you may rejoice, and I may be less distressed.
translation:
  language: am
  text: ስለዚህ ዳግመኛ ስታዩት ደስ እንዲላችሁና እኔም ያነሰ ሐዘን እንዲኖረኝ፣ ይበልጥ በጉጉት ላክሁት።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπουδαιοτέρως
  choice: ይበልጥ በጉጉት
  rationale: የንጽጽር ኃይሉን ‘ይበልጥ’ በሚለው ጠብቆ፣ የተጨመረ ጉጉትንና ትጋትን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ሐሳብ ጋር ያለውን ምክንያታዊ ወይም ድምዳሜያዊ ግንኙነት በግልጽ ያሳያል።
- source_word: ἔπεμψα
  choice: ላክሁት
  rationale: የአኦሪስት አመልካች ግስን እንደ ቀላል ያለፈ ጊዜ ይተረጉማል፤ የተውላጠ ስሙንም ተሳቢ በግሱ ውስጥ ይጨምራል።
- source_word: ἵνα
  choice: እንዲላችሁና … እንዲቀንስ
  rationale: የዓላማውን ሐረግ በአማርኛ ተፈጥሯዊ በሆነ የእንዲ-ግስ አወቃቀር ያቀርባል።
- source_word: ἰδόντες
  choice: ስታዩት
  rationale: በዓላማው ሐረግ ውስጥ ያለውን ጊዜያዊ ሁኔታ ‘ስታዩት’ ብሎ ተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: πάλιν
  choice: ዳግመኛ
  rationale: ኤጳፍሮዲጦስን እንደገና ማየታቸውን በግልጽና በክብር ያመለክታል።
- source_word: χαρῆτε
  choice: ደስ እንዲላችሁ
  rationale: በዘመናዊ አማርኛ ተፈጥሯዊ ሆኖ የደስታውን ግሳዊ ትርጉምና የዓላማውን ኃይል ይጠብቃል።
- source_word: κἀγὼ
  choice: እኔም
  rationale: καὶ ἐγώ የሚለውን ውህድ በአጭርና ተፈጥሯዊ መንገድ ይወክላል።
- source_word: ἀλυπότερος
  choice: ሐዘኔ እንዲቀንስ
  rationale: ‘ያነሰ ሐዘንተኛ’ የሚለውን ንጽጽራዊ ሐሳብ በዘመናዊ አማርኛ የተለመደና ግልጽ በሆነ አገላለጽ ያስተላልፋል፤ ሐዘኑ ሙሉ በሙሉ እንደሚወገድ አይናገርም።
- source_word: ὦ
  choice: እንዲቀንስ
  rationale: የεἰμί ንዑስ አንቀጽ ተግባርን ከንጽጽራዊው ትንቢተ ስም ጋር በተፈጥሯዊ የአማርኛ ግስ ያቀርባል።
