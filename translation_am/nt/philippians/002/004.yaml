  yaml_path: translation/nt/philippians/002/004.yaml
  text: Each of you should look not only to your own interests[a], but also to the interests of others.
translation:
  language: am
  text: እያንዳንዳችሁ የራሳችሁን ጥቅም ብቻ ሳይሆን፣ የሌሎችንም ጥቅም ተመልከቱ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም ይበልጥ ቃል በቃል፦ «እያንዳንዳችሁ የራሳችሁን ነገሮች ሳትመለከቱ፣ የሌሎችንም ነገሮች ተመልከቱ።»
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοποῦντες
  choice: ተመልከቱ
  rationale: ግሱ ትኩረትንና አሳቢነትን ወደ አንድ ጉዳይ ማድረግን ያመለክታል፤ «ተመልከቱ» በዐውደ ንባቡ የሌሎችን ጉዳይ በትኩረት ማሰብን ይገልጣል። የግሪኩ ተሳቢ አገባብ ከቁጥር 3 ዋና ግስ ጋር ሊያያዝ ቢችልም፣ በአማርኛ ግልጽ ምክር ሆኖ ቀርቧል።
- source_word: τὰ ἑαυτῶν
  choice: የራሳችሁን ጥቅም
  rationale: ቃል በቃል «የራሳችሁን ነገሮች» ማለት ሲሆን፣ ከንብረት የሰፋ የግል ጉዳይ፣ ፍላጎትና ደኅንነትን ያካትታል። «ጥቅም» ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἕκαστοι
  choice: እያንዳንዳችሁ
  rationale: ቃሉ በቡድኑ ውስጥ ያለውን እያንዳንዱን ሰው ለይቶ የሚያመለክት ነው፤ «እያንዳንዳችሁ» ይህን የማከፋፈል ኃይል በግልጽ ያሳያል።
- source_word: ἀλλὰ καὶ
  choice: ብቻ ሳይሆን፣ …ም
  rationale: የተቃርኖና የመጨመር አገባቡን «ብቻ ሳይሆን …ም» የሚለው ተፈጥሯዊ የአማርኛ አወቃቀር ይጠብቃል።
- source_word: τὰ ἑτέρων
  choice: የሌሎችንም ጥቅም
  rationale: ቃል በቃል «የሌሎችን ነገሮች» ሲሆን፣ በዐውደ ንባቡ የሌሎችን ጉዳይ፣ ፍላጎትና ደኅንነት በስፋት ያመለክታል።
theological_decisions:
- issue: ጥቅሱ የግል ጥቅምን ፈጽሞ መተውን ያዛል ወይስ የሌሎችንም ጥቅም እንዲጨምሩ ያሳስባል?
  choice: «የራሳችሁን ጥቅም ብቻ ሳይሆን»
  alternative: «የራሳችሁን ጥቅም ሳትመለከቱ»
  rationale: በተቀበለው ጽሑፍ ያለው ἀλλὰ καί («ነገር ግን …ም») የሌሎችን ጥቅም ከራስ ጥቅም ጋር መጨመርን ይደግፋል፤ ሆኖም μὴ ብቻውን «ሳት…» ተብሎ ሊነበብ የሚችለውን ጥብቅ አሉታዊ አገባብ የግርጌ ማስታወሻው ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ጥቅም» የሚለው ቃል ከገንዘብ ወይም ከንብረት ጥቅም ብቻ የሰፋ የግል ጉዳይና ደኅንነትን እንዲያመለክት በዐውደ ንባቡ ተመርጧል።
