revisions:
- from: ምክንያቱም በእናንተ ውስጥ ፈቃዱን እንድትፈልጉም እንድትፈጽሙም የሚሠራው እግዚአብሔር ነው፤ ይህም ለበጎ ፈቃዱ ነው።[a][b]
  to: ምክንያቱም ለበጎ ፈቃዱ ፈቃድ እንዲኖራችሁም እንድትሠሩም በእናንተ ውስጥ የሚሠራው እግዚአብሔር ነው።[a][b]
  rationale: The revision removes the unsupported idea of seeking God’s will and renders τὸ θέλειν as the having of willingness. It preserves the plural scope, God’s ongoing agency, the paired volition/action structure, and the open theological tension of the Greek. Footnote a is correspondingly corrected; footnote b remains a valid alternative for ὑπὲρ τῆς εὐδοκίας.
