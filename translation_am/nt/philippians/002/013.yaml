  text: ⸀θεὸς γάρ ἐστιν ὁ ἐνεργῶν ἐν ὑμῖν καὶ τὸ θέλειν καὶ τὸ ἐνεργεῖν ὑπὲρ τῆς εὐδοκίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/013.yaml
  text: For God is the one working in you both to will and to work for his good pleasure[a][b].
translation:
  language: am
  text: ምክንያቱም ለበጎ ፈቃዱ ፈቃድ እንዲኖራችሁም እንድትሠሩም በእናንተ ውስጥ የሚሠራው እግዚአብሔር ነው።[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “መፍቀድንም መሥራትንም።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “እንደ በጎ ፈቃዱ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: ምክንያቱም
  rationale: ከቀደመው ማሳሰቢያ ጋር ያለውን የምክንያትና የማብራሪያ ግንኙነት በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: ὁ ἐνεργῶν
  choice: የሚሠራው
  rationale: በመስራት ላይ ያለው አምላክ መሆኑንና የአሁን ጊዜውን ቀጣይ ኃይል ይጠብቃል።
- source_word: ἐν ὑμῖν
  choice: በእናንተ ውስጥ
  rationale: የግለሰብንም የማኅበርንም ንባብ ሳይዘጋ የግሪኩን አገላለጽ በቅርብ ይከተላል።
- source_word: τὸ θέλειν
  choice: ፈቃዱን እንድትፈልጉ
  rationale: የፈቃድና የውስጣዊ መሻትን ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ከመፈጸም ጋርም ያለውን ትይዩነት ይጠብቃል።
- source_word: τὸ ἐνεργεῖν
  choice: እንድትፈጽሙ
  rationale: ከውስጣዊ ፈቃድ ወደ ተግባር የሚደረገውን ሽግግር በግልጽ አማርኛ ይገልጣል፤ የ‘መሥራት’ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ὑπὲρ τῆς εὐδοκίας
  choice: ለበጎ ፈቃዱ
  rationale: ὑπέρ የሚያመለክተውን ዓላማ ወይም ጥቅም እና εὐδοκία የሚያመለክተውን በጎ ፈቃድ ይጠብቃል፤ ተውላጠ ባለቤቱ ከእግዚአብሔር እንደሚመለስ በአማርኛ ግልጽ ተደርጓል።
theological_decisions:
- issue: መለኮታዊ አሠራርና የሰው ፈቃድ/ተግባር
  choice: እግዚአብሔር በአማኞች ውስጥ ፈቃድንም ተግባርንም እንደሚያሠራ የሚገልጸው ድርብ አገላለጽ ተጠብቋል።
  alternative: እግዚአብሔር ፍላጎትንና የመፈጸም ችሎታን ይሰጣል።
  rationale: ጽሑፉ መለኮታዊውን አሠራር በፈቃድና በተግባር ደረጃ ያቀርባል፤ ትርጉሙ ይህን ውጥረት ያለ የእምነት ወገን ልዩ ማብራሪያ ጠብቋል።
- issue: εὐδοκία የሚያመለክተው ባለቤት
  choice: “በጎ ፈቃዱ” የእግዚአብሔርን በጎ ፈቃድ እንደሚያመለክት ተተርጉሟል።
  alternative: “በጎ ፈቃድ” ብቻ በማለት ባለቤቱን አለመግለጽ።
  rationale: በግሪክ የባለቤት ተውላጠ ስም ባይኖርም የአረፍተ ነገሩ ባለቤት እግዚአብሔር ስለሆነ አማርኛው ተፈጥሯዊና ግልጽ እንዲሆን “ፈቃዱ” ተብሏል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “እናንተ” ብዙ ቁጥር ስለሆነ የግለሰብንና የማኅበርን ንባብ ሁለቱንም ክፍት ያደርጋል።
