- source_word: οὐκ αὐτὸν δὲ μόνον ἀλλὰ καὶ ἐμέ
  choice: እርሱንም ብቻ ሳይሆን እኔንም ደግሞ
  rationale: የግሪኩን ንጽጽርና ጳውሎስ ራሱ የምሕረቱ ተቀባይ መሆኑን ይጠብቃል።
- source_word: ἵνα μὴ
  choice: እንዳይጨመርብኝ
  rationale: አሉታዊውን የዓላማ/ውጤት ግንኙነት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: λύπην ἐπὶ λύπην
  choice: በሐዘን ላይ ሐዘን
  rationale: የምንጩን ድግግሞሽና የተደራራቢ ሐዘን ኃይል ይጠብቃል።
- source_word: σχῶ
  choice: እንዳይጨመርብኝ
  rationale: ቀጥተኛው “እንዳይኖረኝ” በአማርኛ ከዚህ ሐረግ ጋር ያነሰ ተፈጥሯዊ ስለሆነ፣ ሐዘኑ በሐዘን ላይ እንዳይደራረብ የሚለውን ሐሳብ “እንዳይጨመርብኝ” በማለት ያስተላልፋል።
