base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/027.yaml
  text: For indeed he was sick[a], nearly to death; but God had mercy on him, and not on him only but also on me[b], so that I might not have sorrow upon sorrow.
translation:
  language: am
  text: በእርግጥም ታሞ ለሞት ተቃርቦ ነበር[a]፤ ነገር ግን እግዚአብሔር ማረው፤ እርሱን ብቻ ሳይሆን እኔንም ደግሞ ማረኝ፤ ይህም ሐዘን በሐዘን ላይ እንዳይደራረብብኝ ነው[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለሞት በጣም ቀርቦ” ወይም “ለሞት ቅርብ ሆኖ።”
    reason: lexical_alternative
  - marker: b
    text: “ሐዘን በሐዘን ላይ” የሚለው አገላለጽ የተደራረበ ወይም የተባባሰ ሐዘንን ያመለክታል።
    reason: cultural_note
