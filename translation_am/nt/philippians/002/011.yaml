- from: እያንዳንዱም ምላስ፣ ኢየሱስ መሲሕ ጌታ እንደሆነ ለእግዚአብሔር አብ ክብር ይመስክር።
  to: እናም ምላስ ሁሉ፣ ኢየሱስ መሲሑ ጌታ መሆኑን፣ ለእግዚአብሔር አብ ክብር እንዲመሰክር።
