  text: καὶ πᾶσα γλῶσσα ἐξομολογήσηται ὅτι κύριος Ἰησοῦς Χριστὸς εἰς δόξαν θεοῦ πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/011.yaml
  text: and every tongue should confess that Jesus the Messiah is Lord[b][a], to the glory of God the Father.
translation:
  language: am
  text: እናም ምላስ ሁሉ፣ ኢየሱስ መሲሑ ጌታ መሆኑን፣ ለእግዚአብሔር አብ ክብር እንዲመሰክር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶσα γλῶσσα
  choice: እያንዳንዱም ምላስ
  rationale: የአካል ክፍልን በመጥቀስ ሁሉን ሰው የሚወክለውን የግሪኩን ዘይቤ ይጠብቃል፤ በአማርኛም በዚህ አውድ ግልጽ ነው።
- source_word: ἐξομολογήσηται
  choice: ይመስክር
  rationale: እዚህ ግሱ በግልጽና በአደባባይ ማወጅን ያመለክታል፤ «ይመስክር» ይህን ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: κύριος
  choice: ጌታ
  rationale: መደበኛውን የአማርኛ ትርጉም ይጠብቃል፤ እዚህም ያለውን ክርስቶሳዊ አዋጅና የቅዱሳት መጻሕፍት ድምፅ ያለ ተጨማሪ ትርጓሜ ይይዛል።
- source_word: Χριστός
  choice: መሲሕ
  rationale: Χριστός እዚህ እንደ ማዕረግ ስለሚሠራ፣ «መሲሕ» የቅቡዕነትንና የተስፋውን ንጉሥ ትርጉም ይጠብቃል።
- source_word: εἰς δόξαν
  choice: ለ…ክብር
  rationale: የεἰςን አቅጣጫዊ/ውጤታዊ ኃይል በተፈጥሯዊው «ለ…ክብር» አገባብ ያስተላልፋል።
- source_word: θεοῦ πατρός
  choice: እግዚአብሔር አብ
  rationale: በአማርኛ የተለመደና ክብር ያለው አጠራር ሲሆን የግሪኩን «አምላክ አብ» ማጣቀሻ በግልጽ ያቀርባል።
theological_decisions:
- issue: Χριστόςን በክርስቶሳዊ የእምነት አዋጅ ውስጥ መተርጎም
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: «መሲሕ» ቃሉ እዚህ ያለውን የማዕረግ ተግባር በግልጽ ይጠብቃል፤ «ክርስቶስ» የተለመደ ቅርጽ ቢሆንም ለዘመናዊ አንባቢ እንደ ስም ብቻ ሊሰማ ይችላል።
- issue: የἐξομολογήσηται ንዑስ አዋቂ አቀራረብና ከቁጥር 10 ጋር ያለው አገናኝ
  choice: ይመስክር
  alternative: መመስከር አለበት
  rationale: የአማርኛው የፍላጎት/ዓላማ ግስ ቅርጽ የግሪኩን subjunctive ከቀደመው ዓላማ አውድ ጋር ያስማማል፤ «አለበት» የግዴታ ትርጉም ይጨምር ነበር።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ አማርኛ ተጠቅሟል። «እያንዳንዱ ምላስ» የግሪኩን ዘይቤ ጠብቆአል፤ የዓረፍተ ነገሩ አወቃቀርም ቁጥር 10ን የሚቀጥል መሆኑን እንዲያሳይ ተደርጓል።
