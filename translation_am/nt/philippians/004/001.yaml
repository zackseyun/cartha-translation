  text: ὥστε, ἀδελφοί μου ἀγαπητοὶ καὶ ἐπιπόθητοι, χαρὰ καὶ στέφανός μου, οὕτως στήκετε ἐν κυρίῳ, ἀγαπητοί.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/001.yaml
  text: So then[a], my beloved and longed-for brothers, my joy and crown, stand firm in the Lord in this way[b], beloved.
translation:
  language: am
  text: እንግዲህ፣ የምወዳችሁና የምናፍቃችሁ ወንድሞቼ[a]፣ ደስታዬና አክሊሌ[b]፣ በጌታ እንዲህ ጽኑ፣ የምወዳችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ወንድሞቼ» የሚለው ተባዕታይ የግሪክ ቅርጽን ይተረጉማል፤ በዚህ ዐውድ ግን ጳውሎስ ወንዶችን ብቻ ሳይሆን በጉባኤው ያሉትን የእምነት ባልንጀሮች ሁሉ እየተናገረ ነው።
    reason: cultural_note
  - marker: b
    text: ወይም፣ «የድል አክሊሌ»፤ የግሪኩ ቃል በውድድር ለአሸናፊ የሚሰጥ የአበባ ወይም የቅጠል አክሊልን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: ስለዚህ
  rationale: የቀደመውን ሐሳብ ወደ ተግባራዊ መደምደሚያ የሚያሸጋግር ተፈጥሯዊ የአማርኛ አገናኝ ነው።
- source_word: ἀδελφοί
  choice: ወንድሞቼ
  rationale: የግሪኩን ተባዕታይ የጥሪ ቅርጽና የጳውሎስን የቅርብ ዝምድና አገላለጽ ይጠብቃል፤ በዐውዱ መላውን ጉባኤ ማካተቱ በማስታወሻ ተገልጧል።
- source_word: ἀγαπητοὶ
  choice: የምወዳችሁ
  rationale: የፍቅር ስሜቱን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል፤ ቃሉ በቁጥሩ መጨረሻም በድጋሚ ተተርጉሟል።
- source_word: ἐπιπόθητοι
  choice: የናፈቃችሁ
  rationale: ጥልቅ ናፍቆትን በአጭርና ተፈጥሯዊ አገላለጽ ያስተላልፋል።
- source_word: χαρὰ
  choice: ደስታዬ
  rationale: ፊልጵስዩሳውያን ራሳቸው የጳውሎስ ደስታ መሆናቸውን በቀጥታ ይገልጣል።
- source_word: στέφανος
  choice: አክሊሌ
  rationale: በአማርኛ የክብርና የድል ምሳሌን የሚሸከም የተለመደ ቃል ነው፤ የአሸናፊ የአበባ አክሊል ልዩ ፍቺው በማስታወሻ ተጠቅሷል።
- source_word: οὕτως
  choice: እንደዚህ
  rationale: የአኳኋን ትርጉሙን በግልጽ ይጠብቃል፤ በዐውዱ ከቀደመው ምሳሌና ምክር ጋር ሊያገናኝ ይችላል።
- source_word: στήκετε
  choice: ጸንታችሁ ቁሙ
  rationale: የመጽናትንና ያለመናወጥን ትእዛዝ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐν κυρίῳ
  choice: በጌታ
  rationale: የግሪኩን አጭር ስፍራዊና ግንኙነታዊ አገላለጽ ሳያብራራ ይጠብቃል።
theological_decisions:
- issue: የἀδελφοί አካታች ወሰን
  choice: በዋናው ጽሑፍ «ወንድሞቼ» ተብሎ የተባዕታይ ቅርጹ ተጠብቆ፣ ጥሪው በዐውዱ መላውን የእምነት ጉባኤ እንደሚያካትት በማስታወሻ ተገለጠ።
  alternative: «ወንድሞችና እህቶች» ብሎ በዋናው ጽሑፍ ማስፋት።
  rationale: ይህ አቀራረብ የምንጩን ሰዋሰዋዊ ቅርጽ እየጠበቀ ዐውዳዊውን አካታችነት እንዳይጠፋ ያደርጋል።
- issue: የἐν κυρίῳ ግንኙነታዊ ትርጉም
  choice: «በጌታ» የሚለውን አጭርና ክፍት አገላለጽ መጠበቅ።
  alternative: «ከጌታ ጋር በኅብረት» ብሎ በማብራራት መተርጎም።
  rationale: የግሪኩ ሐረግ ስፍራዊና ግንኙነታዊ ገጽታዎችን ሊይዝ ስለሚችል፣ ትርጉሙን ወደ አንድ ብቻ አተረጓጎም አልተገደበም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ የአማርኛ አገላለጽ ተመርጧል። የጳውሎስ ሞቅ ያለ ፍቅር በ«የምወዳችሁ» ድግግሞሽ ተጠብቋል። የማስታወሻ ምልክቶቹ ከሚያብራሯቸው ቃላት—«ወንድሞቼ» እና «አክሊሌ»—ቀጥለው ተቀምጠዋል።
