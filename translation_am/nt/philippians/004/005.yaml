  text: Let your graciousness be known to all people[b][a]. The Lord is near.
translation:
  language: am
  text: ለዘብተኝነታችሁ[a] ለሰው ሁሉ ይታወቅ። ጌታ ቅርብ ነው።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ገርነታችሁ፣” “ታጋሽነታችሁ” ወይም “ሚዛናዊነታችሁ” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “ጌታ ቅርብ ነው” ማለት ጌታ በአቅራቢያ እንዳለ፣ መምጣቱ እንደቀረበ ወይም ሁለቱንም ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιεικές
  choice: ለዘብተኝነት
  rationale: ቃሉ የጠባይ ለስላሳነትን ብቻ ሳይሆን ሌሎችን በማሰብ የሚታይ ታጋሽ፣ የማይጨክንና ለመስማማት ዝግጁ የሆነ አካሄድን ያመለክታል። “ለዘብተኝነት” ይህን ሰፊ የሥነ ምግባር ትርጉም በዘመናዊ አማርኛ በተፈጥሮ ያስተላልፋል።
- source_word: γνωσθήτω
  choice: ይታወቅ
  rationale: የግሪኩን ተገብሮ ትእዛዝ በቀጥታና በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: πᾶσιν ἀνθρώποις
  choice: ለሰው ሁሉ
  rationale: ሐረጉ ሁሉንም ሰዎች ያካትታል፤ “ለሰው ሁሉ” ይህን በአጭርና በተለመደ አማርኛ ያስተላልፋል።
- source_word: κύριος
  choice: ጌታ
  rationale: የግሪኩን ማዕረግና ሥነ መለኮታዊ ክብደት የሚጠብቅ የተለመደ አማርኛ አቻ ነው።
- source_word: ἐγγύς
  choice: ቅርብ
  rationale: “ቅርብ” ጌታ በመገኘቱ ቅርብ መሆኑን፣ መምጣቱ መቅረቡን ወይም ሁለቱንም ሊያመለክት የሚችለውን የግሪኩን ሆን ተብሎ ያልተወሰነ ፍቺ ይጠብቃል።
theological_decisions:
- issue: የὁ κύριος ἐγγύς ፍቺ
  choice: ጌታ ቅርብ ነው
  alternative: ጌታ በአቅራቢያ ነው፤ ወይም፣ የጌታ መምጣት ቀርቧል
  rationale: የግሪኩ አገላለጽ ቦታዊ/የመገኘት እና ጊዜያዊ/የዳግም ምጽአት ፍቺዎችን ሁለቱንም ይፈቅዳል። ዋናው ጽሑፍ አንዱን ብቻ በመምረጥ ይህን ውጥረት አይፈታውም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ለዘብተኝነት” ትንሽ መደበኛ ቢሆንም የἐπιεικέςን ሰፊ ሥነ ምግባራዊ ክልል ከ“ገርነት” በተሻለ ይጠብቃል።
