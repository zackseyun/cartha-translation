lexical_decisions:
- source_word: Οἴδατε δὲ καὶ ὑμεῖς
  choice: እናንተ ራሳችሁም ታውቃላችሁ
  rationale: የοἴδατεን አሁናዊ የማወቅ ኃይል፣ የκαίን ጭማሪ እና የὑμεῖςን አጽንዖት በተፈጥሯዊ አማርኛ ያቆያል፤ δέ በአማርኛው የንግግር ፍሰት በግልጽ አያስፈልግም።
- source_word: Φιλιππήσιοι
