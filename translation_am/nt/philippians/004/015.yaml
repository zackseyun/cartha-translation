- source_word: ὅτε ἐξῆλθον ἀπὸ Μακεδονίας
  choice: ከመቄዶንያ በወጣሁ ጊዜ
  rationale: የአንድ ጊዜ ያለፈ ድርጊትንና ከቦታ መውጣትን ቀጥታ ይገልጣል።
