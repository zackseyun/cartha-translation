  choice: ሁለቱንም “ቢኖር” በማለት ሁኔታዊ ቅርጹን መጠበቅ
  alternative: “በጎና ሊመሰገን የሚገባውን ሁሉ” ብሎ ቀጥተኛ ዝርዝር ማድረግ
  rationale: ጳውሎስ የተጠቀመበትን አጽንዖታዊ ሁኔታዊ አወቃቀር ሳይፈታ ይጠብቃል።
