source:
  edition: SBLGNT
  text: Τὸ λοιπόν, ἀδελφοί, ὅσα ἐστὶν ἀληθῆ, ὅσα σεμνά, ὅσα δίκαια, ὅσα ἁγνά, ὅσα προσφιλῆ, ὅσα εὔφημα, εἴ τις ἀρετὴ καὶ εἴ τις ἔπαινος, ταῦτα λογίζεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/008.yaml
  text: Finally[a], brothers, whatever is true, whatever is honorable, whatever is just, whatever is pure, whatever is lovely, whatever is commendable—if there is any virtue and if there is any praise—think about these things.
translation:
  language: am
  text: 'በመጨረሻም፣ ወንድሞች[a]፣ እውነት የሆነውን ሁሉ፣ ክብር የሚገባውን ሁሉ፣ ፍትሐዊ የሆነውን ሁሉ፣ ንጹሕ የሆነውን ሁሉ፣ የሚወደደውን ሁሉ፣ መልካም ዝና ያለውን ሁሉ—በጎነት ያለበት ነገር ቢኖር፣ ምስጋናም የሚገባው ነገር ቢኖር—እነዚህን አስቡ።


    [a] ወይም፣ “ወንድሞችና እህቶች”፤ በግሪክኛ “ወንድሞች” የሚለው ቃል የአማኞችን ማኅበረሰብ በሙሉ ሊያመለክት ይችላል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወንድሞችና እህቶች”፤ በግሪክኛ “ወንድሞች” የሚለው ቃል የአማኞችን ማኅበረሰብ በሙሉ ሊያመለክት ይችላል።
    reason: cultural_note
lexical_decisions:
- source_word: Τὸ λοιπόν
  choice: በመጨረሻም
  rationale: የማጠቃለያ ምክርን የሚያስገባውን የንግግር ሽግግር በተፈጥሯዊ አማርኛ ያስተላልፋል፤ “በቀረውም” የሚለው ቀጥተኛ አማራጭ ቢኖርም እዚህ ያለውን የመደምደሚያ ኃይል ይህ ምርጫ በግልጽ ያሳያል።
- source_word: ἀδελφοί
  choice: ወንድሞች
  rationale: የግሪክኛውን ወንድ ብዙ ቁጥር ቅርጽ በዋናው ጽሑፍ ይጠብቃል፤ ቃሉ ሴት አማኞችንም ያካተተውን ማኅበረሰብ ሊጠራ እንደሚችል በእግር ማስታወሻ ተገልጧል።
- source_word: ὅσα
  choice: …የሆነውን ሁሉ / …ያለውን ሁሉ
  rationale: ተደጋጋሚውን አከፋፋይ አገላለጽ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἀληθῆ
  choice: እውነት የሆነውን
  rationale: በዝርዝሩ ውስጥ ያለውን ሰፊ የእውነተኝነትና የእውነታ ሐሳብ ያስተላልፋል።
- source_word: σεμνά
  choice: ክብር የሚገባውን
  rationale: የሞራል ክብደትንና የተከበረ ባሕርይን በዘመናዊና ግልጽ አማርኛ ይገልጻል።
- source_word: δίκαια
  choice: ፍትሐዊ የሆነውን
  rationale: በሥነ ምግባራዊው ዝርዝር ውስጥ ትክክልና ቀና የሆነውን ያመለክታል።
- source_word: ἁγνά
  choice: ንጹሕ የሆነውን
  rationale: የሞራልና የውስጣዊ ንጽሕናን አጭርና ሰፊ ትርጉም ባለው ቃል ይጠብቃል።
- source_word: προσφιλῆ
  choice: የሚወደደውን
  rationale: ፍቅርንና መውደድን የሚያነሳሳውን ነገር በቀጥታ ያስተላልፋል።
- source_word: εὔφημα
  choice: መልካም ዝና ያለውን
  rationale: በመልካም የሚነገርለትን ወይም መልካም ስም ያለውን ነገር ይገልጻል፤ ከቀጣዩ “ምስጋና” ጋር የቃል ድግግሞሽንም ያስወግዳል።
- source_word: εἴ τις ἀρετὴ
  choice: በጎነት ያለበት ነገር ቢኖር
  rationale: ἀρετή የሚያመለክተውን በጎ ሥነ ምግባር ወይም ምግባራዊ ልቀት ይይዛል፤ የግሪክኛውን ሁኔታዊ አገላለጽም አያጠፋም።
- source_word: ἔπαινος
  choice: ምስጋና
  rationale: የሕዝብ ውዳሴን ወይም ተቀባይነትን የሚያመለክተው ቀጥተኛና ተፈጥሯዊ አቻ ነው።
- source_word: ταῦτα λογίζεσθε
  choice: እነዚህን አስቡ
  rationale: ቀጣይነት ያለውን አስተውሎትና የአእምሮ ትኩረት በአጭር፣ ግልጽ ትእዛዝ ያቀርባል።
theological_decisions:
