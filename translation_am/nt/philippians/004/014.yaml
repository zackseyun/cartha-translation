lexical_decisions:
- source_word: πλὴν
  choice: ሆኖም
  rationale: ከቀደመው ሐሳብ ጋር መጠነኛ ንፅፅር ያሳያል፤ የጳውሎስን አዎንታዊ ምስጋና ሳያዳክም የንግግሩን መለወጥ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: καλῶς ἐποιήσατε
  choice: መልካም አደረጋችሁ
  rationale: ድርጊታቸውን በአዎንታዊ መንገድ የሚገመግመውን የግሪክ አገላለጽ ቀጥተኛና ተፈጥሯዊ በሆነ የአማርኛ አባባል ይገልጻል።
- source_word: συγκοινωνήσαντές
  choice: ከእኔ ጋር በመካፈላችሁ
  rationale: በጳውሎስ መከራ ውስጥ በተግባር መሳተፋቸውንና አጋር መሆናቸውን ያሳያል።
- source_word: τῇ θλίψει
  choice: በመከራዬ
  rationale: θλῖψις ጫናን፣ ችግርን ወይም መከራን ያመለክታል፤ «መከራ» የሁኔታውን ክብደት ያለ ማጋነን ይጠብቃል።
