  edition: SBLGNT
  text: Χαίρετε ἐν κυρίῳ πάντοτε· πάλιν ἐρῶ, χαίρετε.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/004.yaml
  text: Rejoice in the Lord always[a]; again I will say[b], rejoice.
translation:
  language: am
  text: ሁልጊዜ በጌታ ደስ ይበላችሁ[a]፤ እንደገናም እላለሁ[b]፦ ደስ ይበላችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ሁልጊዜ በጌታ ሐሴት አድርጉ።»
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ «እንደገና እላለሁ፣ ደስ ይበላችሁ።»
    reason: lexical_alternative
lexical_decisions:
- source_word: Χαίρετε / χαίρετε
  choice: ደስ ይበላችሁ
  rationale: የአሁን ጊዜ ንቁ ትእዛዝ ለብዙ ሰዎች የተነገረ ነው። «ደስ ይበላችሁ» የትእዛዙን ኃይል በተፈጥሯዊና በዘመናዊ አማርኛ ያስተላልፋል፤ ድግግሞሹም በሁለቱ ቦታዎች እንዳለ ተጠብቋል።
- source_word: ἐν κυρίῳ
  choice: በጌታ
  rationale: «በጌታ» የሚለው በጌታ ጋር ያለውን ግንኙነት ወይም በእርሱ ውስጥ ያለውን የሕይወት ክልል ሳያጠብ ያስተላልፋል፤ ሐረጉን «ስለ ጌታ» ወይም «በጌታ ኃይል» ብቻ ብሎ አይወስነውም።
- source_word: πάντοτε
  choice: ሁልጊዜ
  rationale: ቀጣይነትንና ሁሉንም ጊዜ የሚያካትተውን የቃሉን ኃይል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: πάλιν
  choice: እንደገናም
  rationale: የጳውሎስን አጽንዖታዊ ድግግሞሽ በግልጽና በተለመደ አገላለጽ ያስተላልፋል።
- source_word: ἐρῶ
  choice: እላለሁ
  rationale: የλέγω የወደፊት ጊዜ አመልካች ቅርጽ ነው። «እላለሁ» በአማርኛ እንደ ዐውዱ የሚቀጥለውን ንግግር በተፈጥሯዊ ሁኔታ ይገልጣል፤ «እደግማለሁ» በማለት የπάλινን ትርጉም በግሱ ውስጥ አያዋህድም።
theological_decisions:
- issue: «ἐν κυρίῳ» የሚለው ሐረግ ትርጉም
  choice: «በጌታ»፦ ደስታው ከጌታ ጋር ባለ ግንኙነትና በእርሱ ውስጥ ባለ ሕይወት የሚኖር መሆኑን ክፍት ያደርጋል።
  alternative: «በጌታ ኃይል» ወይም «ስለ ጌታ»
  rationale: ἐν በዚህ ስፍራ የግንኙነት ወይም የሕይወት ክልል ሐሳብ ሊኖረው ይችላል። «በጌታ» የመሣሪያነትን ወይም የምክንያትነትን ንባብ ብቻ ሳይመርጥ የግሪኩን ስፋትና ሥነ መለኮታዊ ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ደስ ይበላችሁ» ተፈጥሯዊ የብዙ ቁጥር ትእዛዝ ሲሆን፣ የመጀመሪያው ቃል ድግግሞሽ ለአጽንዖት በትክክል ተጠብቋል።
