source:
  edition: SBLGNT
  text: οὐχ ὅτι καθ’ ὑστέρησιν λέγω, ἐγὼ γὰρ ἔμαθον ἐν οἷς εἰμι αὐτάρκης εἶναι·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/011.yaml
  text: Not that I am speaking from need[a], for I have learned to be content in whatever circumstances I am in.
translation:
  language: am
  text: ይህን የምለው በእጦት ምክንያት አይደለም፤ እኔ ባለሁበት ማንኛውም ሁኔታ ረክቼ[a] መኖርን ተምሬአለሁና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ራሴን ችዬ።” የግሪኩ ቅጽል በራስ ውስጥ በቂነት መኖሩን ሊያመለክት ይችላል፤ እዚህ ግን ከዐውዱ ጋር ይበልጥ የሚስማማው “ረክቼ” የሚለው ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ὑστέρησιν
  choice: ችግር ላይ ስለሆንኩ
  rationale: ሐረጉ ከጉድለት ወይም ከእጦት የተነሣ መናገርን ያመለክታል፤ ይህ አገላለጽ ጳውሎስ ስለግል ችግሩ እየተናገረ እንዳልሆነ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: λέγω
  choice: የምለው
  rationale: የግሪኩን የአሁን ጊዜ እና ከቀደመው ንግግር ጋር ያለውን ቀጥተኛ ትስስር ይጠብቃል።
- source_word: ἔμαθον
  choice: ተምሬአለሁ
  rationale: ቀድሞ የተከናወነው የመማር ሂደት አሁን ያለውን ውጤት እንዳስገኘ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐν οἷς εἰμι
  choice: ባለሁበት ማንኛውም ሁኔታ
  rationale: አካባቢን ብቻ ሳይሆን ጳውሎስ የሚገኝበትን ማንኛውንም ዓይነት ሁኔታ የሚያመለክተውን ፈሊጣዊ ትርጉም ያሳያል።
- source_word: αὐτάρκης
  choice: ረክቼ መኖር
  rationale: በማንኛውም ሁኔታ የተረጋጋ እርካታ መኖሩን በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል፤ የራስን በራስ ብቻ መቻል የሚያስመስል ትርጉም አያስገባም።
theological_decisions:
- issue: በαὐτάρκης ውስጥ ሊኖር የሚችለው ፍልስፍናዊ የራስ-በቂነት ፍቺ
  choice: ረክቼ መኖር
  alternative: ራሴን ችዬ መኖር
  rationale: በዐውዱ ጳውሎስ በተለያዩ ሁኔታዎች የተማረውን እርካታ ይገልጣል። ዋናው ትርጉም ከእግዚአብሔር የተለየ ራስን በራስ መቻልን እንዳያጎላ፣ አማራጩ ግን በማስታወሻ እንዲጠበቅ ተደርጓል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ይህን የምለው ... አይደለም” የሚለው አወቃቀር οὐχ ὅτιን በተፈጥሯዊ መንገድ ይወክላል፤ የምክንያት ግንኙነቱም “-ና” በሚለው ፍጻሜ ተጠብቋል።
