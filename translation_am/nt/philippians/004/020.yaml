  rationale: እዚህ ላይ የዋህ መሸጋገሪያ ወይም የመደምደሚያ አገናኝ ነው፤ በአማርኛ በዐውዱና በአረፍተ ነገሩ ቅርጽ በተፈጥሮ ስለሚገለጥ፣ ‘አሁን’ ወይም ጠንካራ የንፅፅር ቃል መጨመር የምንጩን ኃይል ያጋንናል።
