base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/007.yaml
  text: And the peace of God[a], which surpasses all understanding, will guard your hearts and your minds in Messiah Jesus.
translation:
  language: am
  text: የእግዚአብሔርም ሰላም፣ ከማንኛውም ማስተዋል የሚበልጠው፣ ልቦቻችሁንና ሐሳቦቻችሁን በመሲሕ ኢየሱስ[a] ውስጥ ይጠብቃል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በክርስቶስ ኢየሱስ ውስጥ»።
    reason: Χριστόςን እንደ ማዕረግ የሚተረጉም ‘መሲሕ’ እና በተለምዶ እንደ ስም የሚቀርበው ‘ክርስቶስ’ መካከል ያለውን የቃል አማራጭ ለማሳየት።
lexical_decisions:
- source_word: εἰρήνη
  choice: ሰላም
  rationale: በዚህ አውድ ውስጣዊ እረፍትንና ሙሉ ደኅንነትን ሳያሰፋ በተፈጥሯዊ አማርኛ የሚያስተላልፍ ቀጥተኛ አቻ ነው።
- source_word: τοῦ θεοῦ
  choice: የእግዚአብሔር
  rationale: የግሪኩን ባለቤትነት/ዝምድና ቅርጽ በቀጥታ ይጠብቃል፤ ‘ከእግዚአብሔር’ ብሎ የምንጭነት ትርጓሜን አያስገድድም።
- source_word: ἡ ὑπερέχουσα πάντα νοῦν
  choice: ከማንኛውም አእምሮ በላይ የሆነው
  rationale: πάντα νοῦν በቅርጹ ‘ማንኛውንም/እያንዳንዱን አእምሮ’ ሊል ይችላል፤ ሐረጉ ግን የሰው የማስተዋል አቅምን የሚያልፍ ሰላም ያመለክታል። ይህ አቀራረብ የ‘አእምሮ’ን ቃል ጠብቆ ተፈጥሯዊ ነው።
- source_word: φρουρήσει
  choice: ይጠብቃል
  rationale: የወደፊት ጊዜውንና የጥበቃ ምስሉን በግልጽ አማርኛ ያስተላልፋል፤ ግሱ ያለውን የዘብ ወይም የወታደራዊ ጥበቃ ጥላ አያጠፋም።
- source_word: τὰς καρδίας ὑμῶν
  choice: ልቦቻችሁን
  rationale: የውስጣዊ ሕይወትና የሰውነት ማዕከል የሆነውን መጽሐፍ ቅዱሳዊ ምስል ይጠብቃል።
- source_word: τὰ νοήματα ὑμῶν
  choice: ሐሳቦቻችሁን
  rationale: νοήματα ከ‘አእምሮ’ ይልቅ ሐሳቦችን፣ የአስተሳሰብ ውጤቶችን ወይም የአእምሮ እንቅስቃሴን ያመለክታል፤ ‘ሐሳቦቻችሁን’ የቃሉን ልዩነት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: በመሲሑ ኢየሱስ
  rationale: Χριστόςን እንደ ማዕረግ ‘መሲሕ’ ብሎ ይተረጉማል፤ ἐν ደግሞ ከመሲሑ ኢየሱስ ጋር ያለውን ኅብረትና የጥበቃውን ስፍራ በ‘በ’ ይገልጣል።
theological_decisions:
- issue: πάντα νοῦν የሚያመለክተው አእምሮ ወይስ ማስተዋል
  choice: ከማንኛውም አእምሮ በላይ
  alternative: ከማንኛውም ማስተዋል በላይ
  rationale: νοῦς በቀጥታ ‘አእምሮ’ ሊባል ስለሚችል ይህ ምርጫ የምንጩን ምስል ይጠብቃል፤ በአውዱ ግን የማስተዋል አቅም መሆኑን ሐረጉ በተፈጥሮ ያሳያል።
- issue: ἐν Χριστῷ Ἰησοῦ ውስጥ Χριστόςን እንደ ማዕረግ ወይም እንደ ስም ማቅረብ
  choice: በመሲሑ ኢየሱስ
  alternative: በክርስቶስ ኢየሱስ
  rationale: የግሪኩን መሲሓዊ ማዕረግ ትርጉም በግልጽ ያቆያል፤ በተመሳሳይም ጊዜ የጳውሎስን ‘በ...’ የኅብረት/የሕልውና አገላለጽ አይፈታውም።
