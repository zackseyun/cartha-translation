  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የዓረፍተ ነገር አጽንዖት ለመጠበቅ ገላጭ ክፍሉ በመጀመሪያ ቀርቧል፤ ‘ልብ’ እና ‘ሐሳብ’ የሚለው ጥንድም የውስጣዊ ሕይወትና የአስተሳሰብ ገጽታዎችን ለይቶ ያቆያል።
