  yaml_path: translation/nt/philippians/004/002.yaml
  text: I urge Euodia[a], and I urge Syntyche, to think the same way in the Lord.
translation:
  language: am
  text: ኤዎድያን እለምናታለሁ፤ ሲንጢኬንም እለምናታለሁ፤ በጌታ ተመሳሳይ አስተሳሰብ እንዲኖራችሁ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በጌታ አንድ አሳብ እንዲኖራችሁ።” ወይም፣ “በጌታ እንድትስማሙ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐοδίαν
  choice: ኤዎድያ
  rationale: የግሪክኛውን የሴት ስም በአማርኛ የግዕዝ ፊደል በድምፅ ቀረቤታ አቀረበ፤ የግሪክኛው የወንድ ስም ቅርጽ እንዳይመስል ኤዎድያ ተመርጧል።
- source_word: παρακαλῶ
  choice: እለምናታለሁ
  rationale: በዚህ አውድ παρακαλῶ ያለውን ግላዊና አጥብቆ የመጠየቅ ኃይል በተፈጥሯዊ አማርኛ ያሳያል። ጳውሎስ ለእያንዳንዷ ሴት ግሱን ስለደገመ፣ ድግግሞሹም ተጠብቋል።
- source_word: Συντύχην
  choice: ሲንጢኬ
  rationale: የግሪክኛውን የሴት ስም ከድምፁ ጋር በሚቀራረብ እና በአማርኛ የመጽሐፍ ቅዱስ አጠራር ሊነበብ በሚችል መልኩ በፊደል ተገልብጧል።
- source_word: τὸ αὐτὸ φρονεῖν
  choice: አንድ አሳብ ይኑራችሁ
  rationale: τὸ αὐτό ያለውን አንድነትና φρονεῖν ያለውን የአሳብ፣ የአመለካከትና የዝንባሌ ስፋት ይጠብቃል። ‘ተስማሙ’ ከማለት ይልቅ የአእምሮና የአቋም ገጽታውን የበለጠ ያሳያል።
- source_word: ἐν κυρίῳ
  choice: በጌታ
  rationale: በአማርኛ ተፈጥሯዊ የሆነውን ቅርጽ በመጠቀም፣ የተጠየቀው አንድነት በጌታ ያላቸው ግንኙነት ውስጥና በእርሱ ላይ የተመሠረተ መሆኑን ይጠብቃል።
theological_decisions:
- issue: τὸ αὐτὸ φρονεῖν በዚህ አውድ የሚያመለክተው የአንድነት ዓይነት
  choice: አንድ አሳብ ይኑራችሁ
  alternative: በጌታ ተስማሙ
  rationale: ሐረጉ ቀላል የጉዳይ ስምምነትን ብቻ ሳይሆን የጋራ አስተሳሰብና ዝንባሌንም ሊያመለክት ስለሚችል፣ ጠባቡን ትርጉም በዋናው ጽሑፍ አልተጫነም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የπαρακαλῶ ድግግሞሽ በሁለቱም ሴቶች ላይ እኩል የቀረበውን ግላዊ ልመና ለማሳየት ተጠብቋል፤ ሥርዓተ ነጥቡም ይህን ትይዩነት ግልጽ ያደርጋል።
