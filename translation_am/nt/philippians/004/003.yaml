theological_decisions:
- issue: የγνήσιε σύζυγε ትርጓሜ
  choice: ስሙ ላልተገለጠ ወንድ የሥራ አጋር የቀረበ ገላጭ አድራሻ፦ «እውነተኛ አጋሬ»
