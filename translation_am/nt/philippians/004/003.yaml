  rationale: γνήσιε የሚለው ቅጽል ከገላጭ የአድራሻ ስም ጋር በተፈጥሮ ይስማማል፤ ሆኖም ቃሉ ምሳሌያዊና አከራካሪ ስለሆነ ሌሎቹ ንባቦች በማስታወሻ ተጠብቀዋል።
- issue: ἐν τῷ εὐαγγελίῳ የሚለው የመስተዋድድ ሐረግ
  choice: «በወንጌል» የሚለውን አጭርና ሰፊ አገላለጽ መጠበቅ
