source:
  edition: SBLGNT
  text: ναὶ ἐρωτῶ καὶ σέ, ⸂γνήσιε σύζυγε⸃, συλλαμβάνου αὐταῖς, αἵτινες ἐν τῷ εὐαγγελίῳ συνήθλησάν μοι μετὰ καὶ Κλήμεντος καὶ τῶν λοιπῶν συνεργῶν μου, ὧν τὰ ὀνόματα ἐν βίβλῳ ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/003.yaml
  text: Yes[a], I ask you also, true companion, help these women, who contended alongside me in the gospel[b], together with Clement and the rest of my fellow workers, whose names are in the book of life.
translation:
  language: am
  text: አዎን፣ አንተንም፣ እውነተኛ አጋሬ[a]፣ እጠይቅሃለሁ፤ እነዚህን ሴቶች እርዳቸው። እነርሱ ከቀሌምንጦስና ከቀሪዎቹ የሥራ አጋሮቼ ጋር በወንጌል ከእኔ ጎን ሆነው ታግለዋል[b]፤ የእነዚህ ሁሉ ስሞች በሕይወት መጽሐፍ ውስጥ ናቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ «እውነተኛ የቀንበር ጓደኛዬ»፤ አንዳንዶች ቃሉን «ሲዚጎስ» የተባለ የግል ስም አድርገው ይወስዱታል።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ «ከእኔ ጋር አብረው ተጋድለዋል» ወይም «ከእኔ ጎን ለጎን ደክመዋል»።
    reason: lexical_alternative
