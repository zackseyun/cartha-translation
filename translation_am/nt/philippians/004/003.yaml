- source_word: συνήθλησάν μοι
  choice: ከእኔ ጎን ሆነው ታግለዋል
  rationale: የσυναθλέωን የጋራ ትግል ምስል ይጠብቃል፣ በዘመናዊ አማርኛም ለመረዳት ቀላል ነው።
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: በወንጌል
  rationale: ከግሪኩ አጭር አገላለጽ ጋር ቅርብ ሆኖ የመስተዋድዱን ሰፊ የትርጉም ክልል ይጠብቃል።
- source_word: συνεργῶν
