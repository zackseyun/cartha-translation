- source_word: ἐρωτῶ
  choice: እጠይቅሃለሁ
  rationale: የግል ልመናውን ቃና ሳያጠነክር የቃሉን ቀጥተኛ ትርጉም ያቀርባል።
- source_word: γνήσιε σύζυγε
  choice: እውነተኛ አጋሬ
  rationale: σύζυγοςን እንደ ገላጭ የአድራሻ ስም ወስዶ የቅርብ የአገልግሎት አጋርነትን በተፈጥሯዊ አማርኛ ያሳያል፤ ቀጥተኛው የቀንበር ምሳሌና የግል ስም ንባብ በማስታወሻ ተጠብቀዋል።
- source_word: συλλαμβάνου
  choice: እርዳቸው
  rationale: የጋራ መያዝን ምስላዊ ዳራ ሳያበዛ ተግባራዊ ድጋፍን በግልጽ ያስተላልፋል።
- source_word: αὐταῖς
  choice: እነዚህን ሴቶች
