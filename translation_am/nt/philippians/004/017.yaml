- source_word: πλεονάζοντα
  choice: እየጨመረ የሚሄደውን
  rationale: የአሁን ጊዜ አሳታፊው የሚያሳየውን ቀጣይ መጨመር በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: εἰς λόγον ὑμῶν
