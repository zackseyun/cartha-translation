  alternative: “በመሲሕ ኢየሱስ ባለው ክብር” ብሎ በግልጽ ማያያዝ
  rationale: የግሪኩ አገባብ “በክብር” ከአቅርቦቱ ሁኔታ ጋር ወይም “በመሲሕ ኢየሱስ” ከሚለው ጋር እንዴት እንደሚያያዝ ሙሉ በሙሉ አይወስንም፤ ዋናው ትርጉም ይህን አሻሚነት ይጠብቃል።
