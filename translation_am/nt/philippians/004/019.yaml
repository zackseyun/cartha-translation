  text: And my God will supply every need of yours according to his riches in glory in Messiah Jesus[a][b][c][d].
translation:
  language: am
  text: 'አምላኬም እንደ ሀብቱ[b] በክብር[c] በመሲሕ ኢየሱስ[a][d] የሚያስፈልጋችሁን ሁሉ ያሟላል።


    [a] ወይም፦ “በክርስቶስ ኢየሱስ።”


    [b] “እንደ ሀብቱ” የሚለው፣ የአምላክ አቅርቦት ከሀብቱ የሚመጣ ብቻ ሳይሆን መጠኑም ከሀብቱ ጋር የሚስማማ መሆኑን ያመለክታል።


    [c] “በክብር” የሚለው “በክብር ሁኔታ” የሚል ትርጉምም ሊኖረው ይችላል።


    [d] ወይም፦ “በመሲሕ ኢየሱስ ባለው ክብር።”'
  philosophy: optimal-equivalence
  footnotes:
