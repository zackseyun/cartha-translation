    text: ወይም፦ “በክርስቶስ ኢየሱስ።”
    reason: lexical_alternative
  - marker: b
    text: “እንደ ሀብቱ” የሚለው፣ የአምላክ አቅርቦት ከሀብቱ የሚመጣ ብቻ ሳይሆን መጠኑም ከሀብቱ ጋር የሚስማማ መሆኑን ያመለክታል።
    reason: alternative_reading
  - marker: c
