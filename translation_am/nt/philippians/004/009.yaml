base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/009.yaml
  text: What you also learned and received and heard and saw in me—practice these things[b][a], and the God of peace will be with you.
translation:
  language: am
  text: የተማራችሁትንም፣ የተቀበላችሁትንም፣ የሰማችሁትንም፣ በእኔ ያያችሁትንም[b]—እነዚህን ተግብሩ[a]፤ የሰላምም አምላክ ከእናንተ ጋር ይሆናል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ «እነዚህን አድርጉ።»
    reason: lexical_alternative
  - marker: b
    text: «በእኔ ያያችሁትን» የሚለው «በእኔ ምሳሌ ያያችሁትን» ወይም «በእኔ ሕይወት ያያችሁትን» ተብሎም ሊገለጽ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ
  choice: የ…ትን / እነዚህን
  rationale: የግሪኩን ገለልተኛ ብዙ ቁጥር አንጻራዊ ተውላጠ ስም በአማርኛ ከእያንዳንዱ ግስ ጋር በ«የ…ትን» ቅርጽ አቅርቦ፣ በ«እነዚህን» መልሶ ይጠቅሳል።
- source_word: ἐμάθετε
  choice: የተማራችሁትን
  rationale: ፊልጵስዩሳውያን የተማሩትን ነገር በቀጥታና ተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: παρελάβετε
  choice: የተቀበላችሁትን
  rationale: ትምህርትን ወይም የተላለፈን ነገር የመቀበል ሰፊ ትርጉሙን ሳያጠብ ይጠብቃል።
- source_word: ἠκούσατε
  choice: የሰማችሁትን
  rationale: በተከታታይ ካሉት ግሶች ጋር ቀጥተኛና ትይዩ አቀራረብን ይጠብቃል።
- source_word: εἴδετε ἐν ἐμοί
  choice: በእኔም ያያችሁትን
  rationale: በጳውሎስ ራሱ ውስጥ ወይም በእርሱ ሕይወት የታየውን ነገር ሳይተረጉም የግሪኩን አገላለጽ በቅርብ ይከተላል።
- source_word: ταῦτα πράσσετε
  choice: እነዚህን ተግብሩ
  rationale: πράσσετε የሚያመለክተውን በተግባር ማዋልና ቀጣይ ልምምድ በአጭር ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ὁ θεὸς τῆς εἰρήνης
  choice: የሰላም አምላክ
  rationale: የግሪኩን የባለቤትነት አገላለጽና የጳውሎስን የተለመደ ስያሜ በቀጥታ ይጠብቃል።
- source_word: ἔσται μεθ’ ὑμῶν
  choice: ከእናንተ ጋር ይሆናል
  rationale: የእግዚአብሔርን መገኘት የሚያረጋግጠውን የወደፊት ጊዜ አገላለጽ በቀጥታ ያቀርባል።
theological_decisions:
- issue: ታዛዥነትና መለኮታዊ መገኘት ያላቸው ግንኙነት
  choice: ትእዛዙንና ተከትሎ የመጣውን ተስፋ «፤ …ም» በሚል አስተባባሪ አቀራረብ ማቅረብ
  alternative: ግንኙነቱን «እነዚህን ብታደርጉ» በሚል ግልጽ ሁኔታዊ ዐረፍተ ነገር መተርጎም
  rationale: ግሪኩ ሁለቱን ክፍሎች καί በሚለው አስተባባሪ ያያይዛል እንጂ ግልጽ ሁኔታዊ ቅርጽ አይጠቀምም። ስለዚህ ጽሑፉ የሚያሳየው ግንኙነት ተጠብቆ፣ ሜካኒካዊ ምክንያትና ውጤት አልተጨመረበትም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሶቹ ትይዩ አወቃቀር «…ም» በመደጋገም ተጠብቋል፤ ረጅሙን ዝርዝር ከዋናው ትእዛዝ ለመለየት ሰረዝ ተጠቅሟል።
