    rationale: Greek καὶ coordinates εἴδετε with the preceding verbs. In «በእኔም ያያችሁትን», -ም modifies 'in me,' potentially reading 'in me also.' Rendering «በእኔ ያያችሁትንም» keeps the coordination with 'saw' and avoids this minor shift in emphasis.
