- source_word: μεμύημαι
  choice: ምስጢሩን ተምሬአለሁ
  rationale: ፍጹም ጊዜው ካለፈ ልምድ የተገኘና አሁንም ያለ እውቀትን ያሳያል፤ የምሥጢር ሥርዓት ቃላዊ ምስሉ በማስታወሻ ተጠብቋል።
- source_word: χορτάζεσθαι
