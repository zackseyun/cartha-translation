base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/012.yaml
  text: 'I know how to be brought low, and I know how to abound. In every circumstance and in all things I have learned the secret: both to be well fed and to be hungry, both to abound and to be in need.'
translation:
  language: am
  text: ዝቅ ብዬ መኖርንም አውቃለሁ፤ በብዛት መኖርንም አውቃለሁ። በሁሉም ሁኔታና በሁሉም ነገር ምስጢሩን ተምሬአለሁ[a]፤ በሚገባ መጥገብንም መራብንም፣ በብዛት መኖርንም በእጦት መሆንንም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይበልጥ ቃል በቃል፣ «ተመሥጥሬአለሁ»። ጳውሎስ የምሥጢር ሥርዓት ቃልን ምስጢርን መማርን ለማመልከት በምሳሌያዊ ሁኔታ ይጠቀምበታል።
    reason: lexical_alternative
