base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/018.yaml
  text: But I have received everything[a], and I abound. I am fully supplied, having received from Epaphroditus what came from you—a fragrant aroma, an acceptable sacrifice, pleasing to God.
translation:
  language: am
  text: ነገር ግን፣ ሁሉን ተቀብያለሁ[a]፤ ከበቂ በላይም አለኝ። ከእናንተ የመጣውን ከኤጳፍሮዲጦስ ተቀብዬ፣ ፍላጎቴ ሁሉ ተሟልቶልኛል፤ ይህም መልካም መዓዛ፣ ተቀባይነት ያለው መሥዋዕት፣ ለእግዚአብሔር ደስ የሚያሰኝ የሆነ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በሙሉ ተቀብያለሁ» ወይም «ሙሉ ክፍያውን ተቀብያለሁ።»
