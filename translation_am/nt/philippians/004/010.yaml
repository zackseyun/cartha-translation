  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። የἀνεθάλετε የእፅዋት ምስል በዋናው ጽሑፍ በተፈጥሯዊ ትርጉሙ ቀርቦ፣ ቀጥተኛው ምስል በ[a] ማስታወሻ ተጠብቋል።
