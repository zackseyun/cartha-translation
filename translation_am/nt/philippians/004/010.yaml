base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/010.yaml
  text: I rejoiced greatly in the Lord that now at last you have revived your concern for me[a]; indeed, you were concerned[b], but you lacked opportunity.
translation:
  language: am
  text: በጌታ እጅግ ደስ አለኝ፤ ለእኔ ያላችሁ እንክብካቤ አሁን በመጨረሻ እንደገና ስላበበ[a]። በእርግጥ ስለ እኔ ታስቡ ነበር[b]፤ ነገር ግን አጋጣሚ አልነበራችሁም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በቃል በቃል፣ “ለእኔ ማሰባችሁ እንደገና አብቧል።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ስለ እኔ ያስቡ ነበር።” የግሪኩ ግስ ስለ አንድ ሰው ማሰብን፣ ለእርሱ ትኩረት መስጠትን ወይም ስለ እርሱ መጨነቅን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐχάρην
  choice: ደስ አለኝ
  rationale: የአንደኛ ሰው ደስታን በተፈጥሯዊና ግልጽ ዘመናዊ አማርኛ ይገልጣል።
- source_word: ἐν κυρίῳ
  choice: በጌታ
  rationale: የጳውሎስን ደስታ መሠረትና የሕይወት ክልል የሚጠቁመውን የተለመደ መጽሐፍ ቅዱሳዊ አገላለጽ ይጠብቃል።
- source_word: μεγάλως
  choice: እጅግ
  rationale: የደስታውን ከፍተኛ መጠን በአጭርና ተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: ἤδη ποτὲ
  choice: አሁን በመጨረሻ
  rationale: ከጊዜ መዘግየት በኋላ ነገሩ እንደገና መገለጡን ያሳያል፤ የወቀሳ ትርጉም አያስገባም።
- source_word: ἀνεθάλετε
  choice: እንደገና አሳይታችኋል
  rationale: ቃሉ በቀጥታ ‘እንደገና ማበብ’ የሚል ምስላዊ ኃይል አለው። በዐውዱ ግን ቀድሞውኑ የነበራቸው አሳብ እንደገና ለመገለጡ ያመለክታል፤ ስለዚህ ይህ ምርጫ ተፈጥሯዊነትንና የቀጣዩን ንግግር አንድነት ይጠብቃል።
- source_word: τὸ ὑπὲρ ἐμοῦ φρονεῖν
  choice: ለእኔ ያላችሁን አሳብ
  rationale: φρονέω ከባዶ የአእምሮ ሐሳብ በላይ ለአንድ ሰው ያለ አሳብና ትኩረት ሊገልጥ ይችላል። ‘አሳብ’ ይህን ስፋት ሳያጠብ ይይዛል።
- source_word: ἐφ’ ᾧ καὶ ἐφρονεῖτε
  choice: በእርግጥ ስለ እኔ ታስቡ ነበር
  rationale: ጳውሎስ አሳባቸው ተቋርጦ እንዳልነበር የሚያብራራውን አረጋጋጭ ኃይል ያሳያል።
- source_word: ἠκαιρεῖσθε
  choice: አጋጣሚ አልነበራችሁም
  rationale: ፈቃድ ወይም አሳብ እንዳልነበራቸው ሳይሆን ተገቢ አጋጣሚ እንዳጡ በግልጽ ያሳያል።
theological_decisions:
- issue: የፊልጵስዩስ ሰዎች አሳብ ተቋርጦ ነበር ወይስ መግለጫው ብቻ ነበር የዘገየው?
  choice: አሳባቸው እንደቀጠለ ነገር ግን ለመግለጥ አጋጣሚ እንዳልነበራቸው ተተርጉሟል።
  alternative: ‘ለእኔ ያላችሁን አሳብ እንደገና አድሳችኋል’ ማለት።
  rationale: የἐφρονεῖτε እና ἠκαιρεῖσθε ጥምረት አሳባቸው እንዳልጠፋ፣ የጎደለው አጋጣሚ እንደነበር ያብራራል። ይህ አተረጓጎም ጳውሎስ የሚሰጠውን ለጋስ ማብራሪያ ይጠብቃል።
