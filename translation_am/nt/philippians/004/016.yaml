  rationale: የአውዱን ሐሳብ የሚያብራራ ምክንያታዊ አያያዥ በመሆኑ በዘመናዊ አማርኛ ግልጽ ነው።
- source_word: καὶ ἐν Θεσσαλονίκῃ
  choice: በተሰሎንቄ ሳለሁ እንኳ
  rationale: ἐν Θεσσαλονίκῃ የቦታ ሐረግ ሲሆን፣ የግሱ ተናጋሪ ጳውሎስ መሆኑን አማርኛው በተፈጥሮ ያሳያል፤ καί ያለውን አጽንዖት ‘እንኳ’ ይገልጻል።
- source_word: ἅπαξ καὶ δὶς
  choice: አንድ ጊዜም ሁለት ጊዜም
  rationale: የግሪኩን ቃል በቃል አጽንዖት ይጠብቃል፤ በአውዱ ‘ከአንድ ጊዜ በላይ’ የሚል ፈሊጣዊ ትርጉም አለው።
- source_word: εἰς τὴν χρείαν μοι
  choice: ለችግሬ
  rationale: χρεία ነጠላ ስለሆነ ‘ችግሬ’ የቁጥሩን መልክ ይጠብቃል፤ ሐረጉም የተላከው ነገር የጳውሎስን እጥረት ለማሟላት መሆኑን ያሳያል።
- source_word: ἐπέμψατε
  choice: ላካችሁልኝ
  rationale: ግሱን ‘ላካችሁ’ ብሎ ይጠብቃል፤ የግሪኩ μοι የሚያመለክተውን ተቀባይ ‘-ልኝ’ በተፈጥሯዊ አማርኛ ያሳያል፣ ያልተጠቀሰውን ‘ዕርዳታ’ ወይም ‘ገንዘብ’ ግን አይጨምርም።
