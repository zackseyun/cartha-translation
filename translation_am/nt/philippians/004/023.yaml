  yaml_path: translation/nt/philippians/004/023.yaml
  text: The grace of the Lord Jesus Christ be with your spirit[a].
translation:
  language: am
  text: የጌታ ኢየሱስ መሲሕ ጸጋ ከመንፈሳችሁ ጋር ይሁን።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የጽሑፍ ምስክሮች፦ “የጌታ ኢየሱስ መሲሕ ጸጋ ከሁላችሁ ጋር ይሁን።”
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: ጸጋ
  rationale: በጳውሎስ መልእክቶች የተለመደውን የቡራኬ ቃልና ሰፊውን ሥነ መለኮታዊ ትርጉሙን ይጠብቃል።
- source_word: κυρίου
  choice: ጌታ
  rationale: እዚህ κύριος ለኢየሱስ የተሰጠ ማዕረግ ስለሆነ ተፈጥሯዊና የተለመደ አቻ ነው።
- source_word: Ἰησοῦ Χριστοῦ
  choice: ኢየሱስ መሲሕ
  rationale: Ἰησοῦ የግል ስም ሆኖ በተለመደው መልክ ተጽፏል፤ Χριστός ደግሞ በዚህ የቡራኬ አገላለጽ የማዕረግ ኃይሉን ስለሚይዝ «መሲሕ» ተብሎ ተተርጉሟል።
- source_word: μετὰ
  choice: ከ… ጋር
  rationale: ከጄኒቲቭ ጋር ያለውን የአብሮነት ወይም የመገኘት ግንኙነት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: πνεύματος ὑμῶν
  choice: መንፈሳችሁ
  rationale: የሁለተኛ መደብ ብዙ ቁጥርን በግልጽ ያሳያል፤ በዚህ አውድ πνεῦμα የተቀባዮቹን ውስጣዊ ሕይወት በአንድነት የሚጠቅስ እንጂ በግልጽ መንፈስ ቅዱስን የሚያመለክት አይደለም።
- source_word: '[implicit optative in benediction]'
  choice: ይሁን
  rationale: ግስ በግሪኩ ባይገለጽም የቡራኬውን ምኞት በተፈጥሯዊ አማርኛ ለማሳየት ያስፈልጋል።
theological_decisions:
- issue: Χριστοῦን «መሲሕ» ወይስ «ክርስቶስ» ብሎ መተርጎም
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: ቃሉ ከኢየሱስ ስም ጋር በጥብቅ የተያያዘ ቢሆንም የተቀባውን ንጉሥ የሚያመለክተው የማዕረግ ኃይል አልጠፋም፤ «መሲሕ» ይህን ትርጉም በቀጥታ ያቀርባል።
- issue: πνεύματος ὑμῶν መንፈስ ቅዱስን ወይስ የተቀባዮቹን መንፈስ ያመለክታል
  choice: የተቀባዮቹ መንፈስ—«መንፈሳችሁ»
  alternative: መንፈስ ቅዱስ—«ከመንፈሱ ጋር»
  rationale: ὑμῶν በግልጽ «የእናንተ» ይላል፤ ነጠላው πνεύματος የማኅበሩን ውስጣዊ ሕይወት በጋራ ሊጠቅስ ይችላል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለመደበኛ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ጸጋ» እና «ጌታ» የተለመዱ መጽሐፍ ቅዱሳዊ ቃላት ሲሆኑ፣ ያልተገለጸው የቡራኬ ግስ በአማርኛ «ይሁን» ተብሎ ተጨምሯል።
