id: PHP.3.9
reference: Philippians 3:9
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ εὑρεθῶ ἐν αὐτῷ, μὴ ἔχων ἐμὴν δικαιοσύνην τὴν ἐκ νόμου ἀλλὰ τὴν διὰ πίστεως Χριστοῦ, τὴν ἐκ θεοῦ δικαιοσύνην ἐπὶ τῇ πίστει,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/009.yaml
  text: and be found in him[a], not having my own righteousness from the law[b], but that which is through faith in Messiah—the righteousness from God based on faith.
translation:
  language: am
  text: 'በእርሱም እገኝ ዘንድ፣ ከሕግ የሆነው የራሴ ጽድቅ[b] ሳይኖረኝ፣ ነገር ግን በመሲሑ በማመን[a] የሚገኘው፣ በእምነት ላይ የተመሠረተው ከእግዚአብሔር የሆነው ጽድቅ[b] ኖሮኝ።


    [a] ወይም፣ “በመሲሑ ታማኝነት በኩል።”


    [b] “ጽድቅ” በተባለባቸው በሁለቱም ስፍራዎች “ፍትሕ” ተብሎም ሊተረጎም ይችላል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በመሲሑ ታማኝነት በኩል።”
    reason: alternative_reading
  - marker: b
    text: “ጽድቅ” በተባለባቸው በሁለቱም ስፍራዎች “ፍትሕ” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρεθῶ
  choice: እገኝ ዘንድ
  rationale: የግሪኩን ተገብሮአዊ አኳኋንና የዓላማ/ውጤት ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐν αὐτῷ
  choice: በእርሱም
  rationale: ጳውሎስ ከመሲሑ ጋር ስላለው ኅብረት የሚጠቀምበትን ሰፊ አገላለጽ ሳያጠብ ይጠብቃል።
- source_word: μὴ ἔχων
  choice: ሳይኖረኝ
  rationale: ተሳቢው ግስ ጳውሎስ በመሲሑ ሲገኝ ያለበትን ሁኔታ እንደሚገልጽ በቀጥታ ያሳያል።
- source_word: δικαιοσύνην
  choice: ጽድቅ
  rationale: በጳውሎስ መልእክቶች የተለመደውን መጽሐፍ ቅዱሳዊ ቃል ይጠቀማል፤ የቃሉ የ‘ፍትሕ’ ትርጉም በማስታወሻ ተጠብቋል።
- source_word: τὴν ἐκ νόμου
  choice: ከሕግ የሆነው
  rationale: ሕግ የጽድቁ ምንጭ እንደሆነ የሚያመለክተውን ἐκ በግልጽ ያስተላልፋል።
- source_word: διὰ πίστεως Χριστοῦ
  choice: በመሲሑ በማመን
  rationale: ዋናው ጽሑፍ πίστεως Χριστοῦን በመሲሑ ላይ እንደሚደረግ እምነት ያቀርባል፤ የ‘መሲሑ ታማኝነት’ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: Χριστοῦ
  choice: መሲሑ
  rationale: Χριστόςን እንደ መሲሐዊ ማዕረግ ያስተላልፋል።
- source_word: τὴν ἐκ θεοῦ δικαιοσύνην
  choice: ከእግዚአብሔር የሆነውን ጽድቅ
  rationale: የጽድቁ ምንጭ እግዚአብሔር መሆኑንና የጽድቅ ቃል መደገሙን ይጠብቃል።
- source_word: ἐπὶ τῇ πίστει
  choice: በእምነት ላይ የተመሠረተውን
  rationale: ἐπί ከዳቲቭ ጋር የሚገልጸውን መሠረት በተፈጥሯዊና ግልጽ አማርኛ ያሳያል።
theological_decisions:
- issue: የπίστεως Χριστοῦ ትርጉም
  choice: በመሲሑ በማመን
  alternative: በመሲሑ ታማኝነት
  rationale: የግሪኩ የባለቤትነት አወቃቀር እምነትን ወደ መሲሑ የሚያመራ ወይም የመሲሑን ታማኝነት የሚገልጽ ሊሆን ይችላል። ዋናው ጽሑፍ የመጀመሪያውን ይከተላል፤ እውነተኛውን አሻሚነት ለመጠበቅ ሁለተኛው በማስታወሻ ቀርቧል።
- issue: δικαιοσύνη በጳውሎስ አውድ
  choice: ጽድቅ
  alternative: ፍትሕ
  rationale: ‘ጽድቅ’ የተለመደውን መጽሐፍ ቅዱሳዊና ጳውሎሳዊ አጠቃቀም ይይዛል፤ ‘ፍትሕ’ ግን በቃሉ የትርጉም ክልል ውስጥ ስለሆነ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለመደበኛ አማርኛ አንባቢ ግልጽ የሆነ አገላለጽ ተጠቅሟል። የግሪኩን ተቃርኖ፣ ድግግሞሽና የእምነት አሻሚነት በተቻለ መጠን ተጠብቋል።
