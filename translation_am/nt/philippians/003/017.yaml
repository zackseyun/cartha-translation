lexical_decisions:
- source_word: Συμμιμηταί μου γίνεσθε
  choice: እኔን በመምሰል አንድ ላይ ኑሩ
  rationale: Συμμιμηταί የጋራ መምሰልን ያመለክታል፤ γίνεσθε የሚለው ትእዛዝም ከሐረጉ ጋር በተፈጥሯዊ አማርኛ ተዋህዷል።
- source_word: ἀδελφοί
  choice: ወንድሞች ሆይ
