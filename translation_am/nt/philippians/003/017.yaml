  to: ወንድሞች ሆይ፣[a] እኔን በመምሰል ተባበሩ፤ እኛን አርአያ[b] አድርጋችሁ እንዳላችሁም፣ በእንዲህ ያለ አኗኗር የሚመላለሱትን ተመልከቱ።
  rationale: The revised opening explicitly expresses shared participation in imitating Paul. It also makes the command to observe others idiomatic in Amharic, retains the plural ‘us’ as the model, preserves the manner-of-life metaphor, and moves the lexical footnote marker to አርአያ, the term it concerns.
  reviewer_model: gpt-5.6-terra
