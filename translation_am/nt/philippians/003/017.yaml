- source_word: σκοπεῖτε
  choice: ዓይናችሁን አድርጉ
  rationale: ግሱ በጥንቃቄና በቀጣይነት ማስተዋልን ያመለክታል፤ ይህ አገላለጽ በዘመናዊ አማርኛ ያንን ኃይል ያስተላልፋል።
- source_word: οὕτω περιπατοῦντας
  choice: እንደዚህ በሚመላለሱት
  rationale: የአኗኗርን ሁኔታ የሚያመለክተውን የመራመድ ዘይቤ ሳይፈታ ይጠብቃል።
- source_word: τύπον
  choice: አርአያ
  rationale: እንዲከተሉት የቀረበ መመዘኛ ወይም ናሙና የሚለውን ሐሳብ በክብር ያለውና የተለመደ ቃል ይገልጣል።
- source_word: ἡμᾶς
  choice: እኛን
  rationale: የምንጩን ብዙ ቁጥር ሳይለውጥ ይጠብቃል፤ ወደ ነጠላ ቁጥር አይቀንሰውም።
