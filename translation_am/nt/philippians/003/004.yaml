  text: καίπερ ἐγὼ ἔχων πεποίθησιν καὶ ἐν σαρκί. Εἴ τις δοκεῖ ἄλλος πεποιθέναι ἐν σαρκί, ἐγὼ μᾶλλον·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/004.yaml
  text: Though I myself have confidence even in the flesh. If anyone else thinks he has confidence in the flesh[a], I have more.
translation:
  language: am
  text: እኔ ራሴ በሥጋም የምታመንበት መሠረት ቢኖረኝም፣ ሌላ ማንም በሥጋ[a] እንደሚታመን ቢያስብ፣ እኔ ይበልጥ አለኝ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በሰብዓዊ መመዘኛዎች» / «በውጫዊ ሁኔታ»። ግሪክ፦ «በሥጋ»።
    reason: lexical_alternative
lexical_decisions:
- source_word: καίπερ
  choice: ቢኖረኝም
  rationale: የመ уступ concession ኃይሉን በተፈጥሯዊ የአማርኛ አንቀጽ አወቃቀር ያሳያል።
- source_word: πεποίθησιν
  choice: የምተማመንበት ነገር
  rationale: የመተማመንን ሁኔታና መሠረት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: σάρξ
  choice: ሥጋ
  rationale: የግሪኩን ቃል በዋናው ጽሑፍ ይጠብቃል፤ በዚህ አውድ የሰውን ውጫዊ ማንነትና ምስክርነቶች እንደሚያመለክት በማስታወሻ ተብራርቷል።
- source_word: δοκεῖ
  choice: ቢመስለው
  rationale: አንድ ሰው ስለራሱ ያለውን ግምት የሚያሳየውን የግሪክ ቃል አሻሚነት ይጠብቃል።
- source_word: μᾶλλον
  choice: ይበልጥ
  rationale: የጳውሎስን አጭርና ጠንካራ ንጽጽር ይጠብቃል።
theological_decisions:
- issue: በፊልጵስዩስ 3፥4 የσάρξ ትርጉም
  choice: በዋናው ጽሑፍ «ሥጋ» ተጠብቆ፣ የአውዱ ፍቺ በእግር ማስታወሻ ተገልጿል።
  alternative: «ሰብዓዊ መመዘኛዎች» ወይም «ውጫዊ ማዕረግ»
  rationale: ቀጣዮቹ ቁጥሮች ግርዛትን፣ የዘር ሐረግን፣ ሕግን መጠበቅንና ቅንዓትን ይዘረዝራሉ፤ ስለዚህ እዚህ «ሥጋ» በዋናነት «ኃጢአተኛ ተፈጥሮ» ሳይሆን ሰብዓዊና ውጫዊ የመታመኛ መሠረትን ያመለክታል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። የግሪኩ መጀመሪያ አንቀጽ ከቀደመው ሐሳብ ጋር የተያያዘ ቢሆንም፣ የቅናሽ ግንኙነቱ በ«ቢኖረኝም» ተጠብቋል።
