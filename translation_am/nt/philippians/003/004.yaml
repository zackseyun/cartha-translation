revisions:
- from: እኔ ራሴ በሥጋ እንኳ የምተማመንበት ነገር ቢኖረኝም፣ ሌላ ማንም በሥጋ[a] ለመታመን የሚችል ቢመስለው፣ እኔ ይበልጥ እችላለሁ።
  to: እኔ ራሴ በሥጋም የምታመንበት መሠረት ቢኖረኝም፣ ሌላ ማንም በሥጋ[a] እንደሚታመን ቢያስብ፣ እኔ ይበልጥ አለኝ።
