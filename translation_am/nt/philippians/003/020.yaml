  text: ἡμῶν γὰρ τὸ πολίτευμα ἐν οὐρανοῖς ὑπάρχει, ἐξ οὗ καὶ σωτῆρα ἀπεκδεχόμεθα κύριον Ἰησοῦν Χριστόν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/020.yaml
  text: For our citizenship is in heaven[a], from where we also eagerly await a Savior[d][c][b], the Lord Jesus the Messiah.
translation:
  language: am
  text: ምክንያቱም የእኛ ዜግነት በሰማያት ነው፤[a] ከዚያም አዳኝን፣ ጌታ ኢየሱስ መሲሕን በጉጉት እንጠብቃለን።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪኩ “ሰማያት” በብዙ ቁጥር ነው።
    reason: lexical_alternative
  - marker: b
    text: “መሲሕ” የሚለው “ክርስቶስ” ተብሎም ሊቀርብ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: πολίτευμα
  choice: ዜግነታችን
  rationale: ቃሉ የፖለቲካዊና የማኅበረሰባዊ አባልነትን ሐሳብ ይዟል፤ “ዜግነት” ይህን በዘመናዊና ግልጽ አማርኛ ያስተላልፋል።
- source_word: ἐν οὐρανοῖς
  choice: በሰማያት
  rationale: የግሪኩን ብዙ ቁጥር ቅርጽ ጠብቆ በመጽሐፍ ቅዱሳዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: ὑπάρχει
  choice: ነው
  rationale: አሁን ያለውን እውነታ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἐξ οὗ
  choice: ከዚያም
  rationale: ወደ “ሰማያት” መልሶ የሚያመለክተውን የቦታ ትርጉም በአጭርና ተፈጥሯዊ መንገድ ይጠብቃል።
- source_word: σωτῆρα
  choice: አዳኝ
  rationale: የማዳንንና የመታደግን ትርጉም የሚያስተላልፍ የተለመደ ክርስቶሎጂያዊ ቃል ነው።
- source_word: ἀπεκδεχόμεθα
  choice: በጉጉት እንጠብቃለን
  rationale: ቀጣይነት ያለውንና በተስፋ የተሞላውን መጠባበቅ ያሳያል።
- source_word: κύριον
  choice: ጌታ
  rationale: በአዲስ ኪዳን ክርስቶሎጂያዊ አጠቃቀም የተለመደውንና ትክክለኛውን ማዕረግ ይጠብቃል።
- source_word: Χριστόν
  choice: መሲሕ
  rationale: እዚህ ከግል ስም ይልቅ የተቀባውን የሚያመለክት ማዕረግ ሆኖ ይሠራል፤ “መሲሕ” የማዕረጉን ትርጉም ግልጽ ያደርጋል።
theological_decisions:
- issue: κύριον Ἰησοῦν Χριστόν የሚለውን የማዕረግ ሰንሰለት መተርጎም
  choice: ጌታ ኢየሱስ መሲሕ
  alternative: ጌታ ኢየሱስ ክርስቶስ
  rationale: Χριστός በዚህ የመጨረሻውን አዳኝ ማዕረግ የሚያሳይ በመሆኑ “መሲሕ” የሚለው ትርጉሙን ያብራራል፤ ባህላዊው “ክርስቶስ” ግን በማስታወሻ ተጠብቋል።
- issue: πολίτευμα የግለሰብ ዜግነትን ወይም የጋራ ማኅበረ-ፖለቲካዊ ማንነትን ሊያመለክት መቻሉ
  choice: ዜግነት
  alternative: የዜጎች ማኅበር / አገረ መንግሥት
  rationale: “ዜግነት” በአውዱ ውስጥ ያለውን የአባልነትና የታማኝነት ንጽጽር ግልጽ ያደርጋል፤ የቃሉ የጋራ ማኅበረሰባዊ ገጽታ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ γάρ ከፊልጵስዩስ 3፥19 ጋር ያለውን ንጽጽራዊ ማብራሪያ ለማሳየት “ግን” ተብሏል፤ καί ደግሞ “-ም” በሚለው አገናኝ ተካቷል።
