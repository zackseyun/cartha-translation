  text: የእግዚአብሔርን የላይኛውን ጥሪ ሽልማት፣ በመሲሑ ኢየሱስ ያለውን፣ ለማግኘት ወደ ግቡ እገሰግሳለሁ[a][b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሰማያዊውን ጥሪ” ወይም “ከላይ የመጣውን ጥሪ።”
    reason: lexical_alternative
  - marker: b
    text: ግሪክኛ፣ “በክርስቶስ ኢየሱስ።” እዚህ Χριστός የማዕረግ ስም ስለሆነ “መሲሑ” ተብሎ ተተርጉሟል።
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ σκοπόν
  choice: ወደ ግቡ
  rationale: በውድድር ምሳሌው ውስጥ ወደተወሰነ መድረሻ የሚደረግን እንቅስቃሴ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: διώκω
  choice: እገሰግሳለሁ
  rationale: በዚህ አውድ ግሱ ከፍተኛ ጥረት በማድረግ ወደፊት መጓዝን ያመለክታል፤ ይህ ምርጫም የሩጫውን ምስል ይጠብቃል።
- source_word: εἰς τὸ βραβεῖον
  choice: ሽልማት ለማግኘት
  rationale: εἰς የጥረቱን ዓላማ ያመለክታል፤ ይህ አገላለጽ በአማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: ἄνω
  choice: የላይኛውን
  rationale: የቦታውን ‘ወደ ላይ/ከላይ’ ኃይል ሳያጠፋ በአማርኛ አጭር አገላለጽ ያቀርባል፤ ‘ሰማያዊ’ በማለት ትርጉሙን አይወስንም።
- source_word: κλήσεως τοῦ θεοῦ
  choice: የእግዚአብሔርን ... ጥሪ
  rationale: የግሪኩን የዝምድና አወቃቀር በቀጥታ በመከተል ጥሪው ከእግዚአብሔር መሆኑን ያሳያል።
- source_word: Χριστῷ
  choice: መሲሑ
  rationale: Χριστός በዚህ ስፍራ የማዕረግ ስም መሆኑን ‘መሲሕ’ የሚለው ቃል በግልጽ ያስተላልፋል።
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: በመሲሑ ኢየሱስ ያለውን
  rationale: ἐν የሚያመለክተውን ከመሲሑ ኢየሱስ ጋር ያለ ግንኙነት ይጠብቃል፤ የአማርኛው አወቃቀር ግን ንባቡን ተፈጥሯዊ ያደርጋል።
theological_decisions:
- issue: የἄνω κλήσεως ትርጉም
  choice: የላይኛው ጥሪ
  alternative: ሰማያዊው ጥሪ፤ ከላይ የመጣው ጥሪ
  rationale: ዋናው ጽሑፍ የἄνωን የቦታ አመልካችነት ይጠብቃል፤ ከሰማይ የመጣ ጥሪ ወይም ወደ ላይ የሚመራ ጥሪ መሆኑን በአንዱ ትርጉም ብቻ አይወስንም።
