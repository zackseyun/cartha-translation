source:
  edition: SBLGNT
  text: Βλέπετε τοὺς κύνας, βλέπετε τοὺς κακοὺς ἐργάτας, βλέπετε τὴν κατατομήν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/002.yaml
  text: Watch out for the dogs[a]; watch out for the evil workers[c][b]; watch out for the mutilation.
translation:
  language: am
  text: ከውሾቹ ተጠንቀቁ፤ ከክፉ ሠራተኞች ተጠንቀቁ፤ ከመቆራረጡ[a] ተጠንቀቁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክ ‘መቆራረጥ’ የሚል ረቂቅ ስም ነው። ጳውሎስ በቀጣዩ ቁጥር ከሚጠቀምበት ‘ግርዘት’ ከሚለው ቃል ጋር ሆን ብሎ አዋራጅ የቃላት ንጽጽር ይፈጥራል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε
  choice: ተጠንቀቁ
  rationale: በዚህ አውድ ግሱ አደጋን አስቀድሞ ተመልክቶ እንዲጠነቀቁ የሚሰጥ አስቸኳይ ትእዛዝ ነው። በግሪክ ሦስት ጊዜ መደገሙን በአማርኛም በመድገም አጽንዖቱ ተጠብቋል።
- source_word: τοὺς κύνας
  choice: ከውሾቹ
  rationale: ጳውሎስ የተጠቀመበት ኃይለኛ ዘይቤ ሳይለዘብና ተጨማሪ ገላጭ ቃል ሳይገባበት ተጠብቋል። ከ‘ተጠንቀቁ’ ጋር ተፈጥሯዊ የሆነው ‘ከ-’ ተጠቅሟል።
- source_word: τοὺς κακοὺς ἐργάτας
  choice: ክፉ ሠራተኞችን
  rationale: ‘ክፉ’ የκακούςን ሥነ ምግባራዊ ክስ ያስተላልፋል፤ ‘ሠራተኞች’ ደግሞ የἐργάταςን መደበኛ ትርጉም በቀጥታ ይጠብቃል።
- source_word: τὴν κατατομήν
  choice: ሥጋን ከሚቈራርጡት
  rationale: κατατομή በቃል ደረጃ ‘መቈራረጥ/መቆራረጥ’ የሚል ኃይለኛ እና አዋራጅ ተቃራኒ ቃል ነው። ግሪኩ ረቂቅ ስም ቢጠቀምም በአማርኛ ‘ከመቈራረጡ ተጠንቀቁ’ ግልጽ ስላልሆነ፣ በአውዱ የሚያመለክታቸውን ሰዎች በተፈጥሯዊ አገላለጽ በማቅረብ የቃሉ የመቈራረጥ ስሜት ተጠብቋል።
theological_decisions:
- issue: κατατομήν ከቀጣዩ ቁጥር የግርዘት ቃል ጋር ያለውን ንጽጽር እንዴት ማቅረብ እንደሚገባ
  choice: ‘ሥጋን ከሚቈራርጡት’ በማለት አዋራጁን የመቈራረጥ ምስል ማቆየት
  alternative: ‘ከሐሰተኛው ግርዘት’ ወይም ‘ከገራዦቹ’
  rationale: ጳውሎስ መደበኛውን περιτομή (‘ግርዘት’) ሳይሆን ሆን ብሎ κατατομή (‘መቈራረጥ’) ይላል። ‘ሐሰተኛ’ የሚለውን ያልተጻፈ ትርጓሜ ከመጨመር ይልቅ የመቈራረጥ ምስሉንና የክርክሩን ጥንካሬ ማቆየት ተመርጧል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው አማርኛ ተጠቅሟል። የትእዛዙ ሦስት ጊዜ መደገም ለንግግሩ አስቸኳይነትና ምት ተጠብቋል፤ የጳውሎስ ኃይለኛ ዘይቤም አልለዘበም።
