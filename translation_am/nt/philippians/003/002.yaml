review_pass:
  verdict: revise
  source_fidelity: The repeated imperative and the first two hostile designations are retained. However, τὴν κατατομήν is an abstract noun ('the mutilation/cutting'), not 'those who cut flesh.' The draft changes the referent to people and adds 'flesh,' neither of which is stated in the Greek.
  naturalness: The repeated ከ… ተጠንቀቁ construction is clear and idiomatic. Making all three warnings syntactically parallel improves the rhythm and readability.
  terminology: ክፉ ሠራተኞች accurately conveys κακοὺς ἐργάτας. መቆራረጡ preserves the deliberately derogatory cutting/mutilation term and allows its wordplay with ግርዘት in the next verse to remain visible without importing 'false' or 'flesh.'
  issues:
  - severity: high
    issue: 'The rendering of τὴν κατατομήν changes an abstract polemical noun into agents: ሥጋን ከሚቈራርጡት.'
    rationale: The Greek says 'the mutilation,' not 'those who mutilate.' The added object 'flesh' and the personal referent are interpretive expansions that obscure the source's deliberate noun-level wordplay with περιτομή ('circumcision') in the following verse.
  - severity: low
    issue: The second warning is not parallel in case/construction with the first and third warnings.
    rationale: Using ከክፉ ሠራተኞች ተጠንቀቁ matches the natural Amharic warning construction already used elsewhere in the verse and reinforces the Greek's threefold repetition.
  revised_text: ከውሾቹ ተጠንቀቁ፤ ከክፉ ሠራተኞች ተጠንቀቁ፤ ከመቆራረጡ[a] ተጠንቀቁ።
  revised_footnotes:
