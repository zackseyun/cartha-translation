  to: ምክንያቱም ብዙዎች የመሲሑ[a] መስቀል ጠላቶች ሆነው ይኖራሉ፤ ስለ እነርሱም ብዙ ጊዜ ነግሬአችሁ ነበር፣ አሁንም እያለቀስኩ እናገራለሁ።
