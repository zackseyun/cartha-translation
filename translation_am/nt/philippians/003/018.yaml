  text: πολλοὶ γὰρ περιπατοῦσιν οὓς πολλάκις ἔλεγον ὑμῖν, νῦν δὲ καὶ κλαίων λέγω, τοὺς ἐχθροὺς τοῦ σταυροῦ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/018.yaml
  text: For many walk[a], whom I often told you about, and now even weeping I say, are enemies of the cross of Messiah,
translation:
  language: am
  text: ምክንያቱም ብዙዎች የመሲሑ[a] መስቀል ጠላቶች ሆነው ይኖራሉ፤ ስለ እነርሱም ብዙ ጊዜ ነግሬአችሁ ነበር፣ አሁንም እያለቀስኩ እናገራለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የክርስቶስ»።
    reason: Χριστός እንደ ማዕረግ «መሲሕ» ተብሎ ሊተረጎም ይችላል፤ «ክርስቶስ» የሚለውም የተለመደ ተለዋጭ አቀራረብ ነው።
lexical_decisions:
- source_word: πολλοὶ
  choice: ብዙዎች
  rationale: ቅጽሉ በስም ተግባር የቆመ ስለሆነ፣ ያልተወሰነ ብዛትን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: γὰρ
  choice: —ና / የዓረፍተ ነገሩ ማብራሪያዊ አወቃቀር
  rationale: γὰρ ከቀደመው ሐሳብ ጋር ያለውን ምክንያታዊ ወይም ማብራሪያዊ ግንኙነት ያሳያል፤ በአማርኛ ይህ በዓረፍተ ነገሩ አወቃቀርና በመጨረሻው «-ና» ይተላለፋል።
- source_word: περιπατοῦσιν
  choice: ሆነው ይኖራሉ
  rationale: ግሱ እዚህ በምሳሌያዊ አጠቃቀም የሕይወት አካሄድን ያመለክታል። «ይኖራሉ» ይህን ትርጉም በዘመናዊና ግልጽ አማርኛ ያቀርባል፤ «ሆነው» ደግሞ «ጠላቶች» ከሚለው ጋር ያለውን ትስስር ያሳያል።
- source_word: πολλάκις ἔλεγον ὑμῖν
  choice: ብዙ ጊዜ ነግሬአችሁ ነበር
  rationale: πολλάκις እና የኢምፐርፌክት ግሱ በቀድሞ ጊዜ ተደጋግሞ የተፈጸመ ንግግርን ያሳያሉ።
- source_word: νῦν δὲ καὶ κλαίων λέγω
  choice: አሁንም እያለቀስኩ እናገራለሁ
  rationale: የአሁን ጊዜ አሳታፊው ድርጊት ጳውሎስ በሚናገርበት ጊዜ እያለቀሰ መሆኑን በቀጥታ ይገልጣል።
- source_word: ἐχθροὺς
  choice: ጠላቶች
  rationale: ቃሉ ተቃዋሚነትን በጠንካራና ቀጥተኛ መንገድ ይገልጻል።
- source_word: σταυροῦ
  choice: መስቀል
  rationale: የስቅለቱን መሣሪያና በዚህ አውድ ያለውን ሥነ መለኮታዊ ጠቀሜታ በቀጥታ የሚያስተላልፍ የተለመደ አቻ ቃል ነው።
- source_word: Χριστοῦ
  choice: የመሲሑ
  rationale: Χριστός እዚህ እንደ ማዕረግ ስለሚሠራ፣ «መሲሕ» የቃሉን ‘የተቀባው’ የሚል ማዕረጋዊ ትርጉም ይጠብቃል።
theological_decisions:
- issue: Χριστοῦ እንደ ማዕረግ ወይም ስም መተርጎም
  choice: የመሲሑ
  alternative: የክርስቶስ
  rationale: በ«የ...መስቀል» ሐረግ ውስጥ Χριστός እንደ ማዕረግ መረዳቱ ተፈጥሯዊ ነው፤ «መሲሕ» የማዕረጉን ፍቺ ግልጽ ያደርጋል። ባህላዊው «ክርስቶስ» ግን እንደ ስም ሊሰማ ይችላል።
- issue: περιπατοῦσιν ያለውን የመራመድ ምሳሌ በቀጥታ ማቆየት
  choice: ሆነው ይኖራሉ
  alternative: ሆነው ይመላለሳሉ
  rationale: ዋናው ሐሳብ የአካላዊ መራመድ ሳይሆን የሕይወት አካሄድ ነው። ትርጉሙን በግልጽ አማርኛ ማቅረብ ከምሳሌው ቃላዊ ቅርጽ ይልቅ ተመራጭ ሆኗል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ረጅሙ የግሪክ አወቃቀር በሁለት ሰረዞች ውስጥ ባለ ገላጭ ሐረግ ቀርቧል፤ ይህም አንጻራዊውን ሐረግና የጳውሎስን ስሜት ሳያጠፋ ንባቡን ያቀላል።
