  text: ነገር ግን፣ በደረስንበት መጠን እንጓዝ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ «በደረስንበት ደረጃ እንደዚያው እንመላለስ»፣ «በዚያው መስመር እንጓዝ»። አንዳንድ የኋለኞች የጽሑፍ ቅጂዎች፦ «በዚያው ሕግ እንመላለስ፣ ያንኑም እናስብ» የሚል ማስፋፊያ ያካትታሉ።
    reason: τῷ αὐτῷ ጋር የተያያዘው ስም በSBLGNT ጽሑፍ በግልጽ አልተጻፈም፤ ስለዚህ የστοιχεῖν አማራጭ ምሳሌያዊ አገላለጾችንና የአንዳንድ የኋለኞች ቅጂዎችን ማስፋፊያ ለማሳየት።
lexical_decisions:
- source_word: πλήν
  choice: ነገር ግን
  rationale: በዚህ አውድ ቃሉ ከቀደመው ሐሳብ ወደ ዋናው ተግባራዊ ማሳሰቢያ የሚያሻግር ገዳቢ ሽግግር ነው፤ «ነገር ግን» ይህን ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: εἰς ὃ
  choice: እስከ…በት ድረስ
  rationale: የተደረሰበትን ደረጃ ወይም ነጥብ ያመለክታል፤ ከἐφθάσαμεν ጋር ተያይዞ «እስከደረስንበት ድረስ» በአማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: ἐφθάσαμεν
  choice: ደረስን
  rationale: ያለፈውን እድገትና አሁን ያለውን ደረጃ የሚያመለክት ቀጥተኛና የተለመደ አማርኛ ነው።
- source_word: τῷ αὐτῷ
  choice: በዚያው እርምጃ
  rationale: «በዚያው» ተመሳሳይነቱን ይጠብቃል፤ «እርምጃ» ከστοιχεῖν ጋር ያለውን በሥርዓት መራመድ ምሳሌያዊ ሐሳብ በተፈጥሯዊ አማርኛ ያሳያል፣ ነገር ግን «ሕግ» ወይም «መለኪያ» አያክልም።
- source_word: στοιχεῖν
  choice: እንራመድ
  rationale: ቃሉ በተወሰነ መስመር ወይም ሥርዓት መጓዝን ያመለክታል፤ «በዚያው እርምጃ እንራመድ» የእርምጃውን ምሳሌ እና የጋራ ማሳሰቢያውን ይጠብቃል።
theological_decisions:
- issue: ከτῷ αὐτῷ ጋር «ሕግ» ወይም «መለኪያ» የሚል ግልጽ ስም መጨመር አለመጨመር
  choice: በዋናው ጽሑፍ «ሕግ» ወይም «መለኪያ» አለመጨመር፤ ትርጉሙን «በዚያው እርምጃ እንራመድ» በሚል ምሳሌያዊ አገላለጽ ማቅረብ
  alternative: «በዚያው ሕግ እንመላለስ» ወይም «ያንኑ መለኪያ እንከተል»
  rationale: በተሰጠው አጭር የግሪክ ጽሑፍ ስሙ በግልጽ አልተጻፈም። ስለዚህ ከኋለኞቹ የጽሑፍ ማስፋፊያዎች ወይም ከባህላዊ ትርጉሞች የመጣን ስም ሳይጨምር የሐዋርያውን ማሳሰቢያ እና የጽሑፉን አሻሚነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «በዚያው እርምጃ እንራመድ» የግሪኩን የተሰለፈ አካሄድ ምሳሌ ይጠብቃል።
