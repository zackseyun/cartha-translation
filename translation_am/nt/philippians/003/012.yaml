base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/012.yaml
  text: Not that I have already received it or have already been perfected[c][b][a], but I press on to see if I may also take hold of that for which I too was taken hold of by Christ.
translation:
  language: am
  text: ይህን አስቀድሜ ተቀብያለሁ[a] ወይም አስቀድሜ ፍጹም ተደርጌአለሁ[b] ማለቴ አይደለም፤ ነገር ግን እኔም ክርስቶስ[c] የያዘኝበትን ልይዘው እችል እንደሆነ እገሰግሳለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም «አግኝቻለሁ»፤ በግሪክኛው የግሱ ተሳቢ አልተገለጸም፤ ከአውዱ ይታወቃል።
    reason: lexical_alternative
  - marker: b
    text: ወይም «ፍጹም ሆኛለሁ» ወይም «ወደ ሙሉነት ደርሻለሁ»።
    reason: lexical_alternative
  - marker: c
    text: በግሪክኛ፦ ክሪስቶስ፤ ወይም «መሲሕ»።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβον
  choice: ተቀብያለሁ
  rationale: ግሱ በአውዱ ያለውን ግብ ወይም ሽልማት የሚመለከት ሲሆን፣ በግሪክ ያልተገለጸው ተሳቢ በአማርኛ «ይህን» ተብሎ ለግልጽነት ቀርቧል።
- source_word: τετελείωμαι
  choice: ወደ ፍጹምነት ደርሻለሁ
  rationale: የፍጹምነትን ወይም የሙሉነትን የተጠናቀቀ ሁኔታ ይገልጣል፤ አገላለጹ በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን ሰፊውን ሥነ መለኮታዊ ጥያቄ አይወስንም።
- source_word: διώκω
  choice: እገሰግሳለሁ
  rationale: በግብ አቅጣጫ የሚደረግን ቀጣይና ትጉህ ጥረት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: καταλάβω
  choice: ለመያዝ
  rationale: «መያዝ» የግሱን ተጨባጭ ኃይል ይጠብቃል፣ ከኋለኛው κατελήμφθην ጋር ያለውንም የቃል ጨዋታ ያስቀጥላል።
- source_word: ἐφ’ ᾧ
  choice: ለዚህ ዓላማ
  rationale: ሐረጉ የክርስቶስ መያዝ ወደ አንድ ዓላማ ወይም ግብ እንደሚያመለክት ተተርጉሟል፤ የምክንያት ንባቡ ግን በውስጡ ያለ አማራጭ ነው።
- source_word: κατελήμφθην
  choice: ስለያዘኝ
  rationale: የግሪኩን ተደራጊ ትርጉም በተፈጥሯዊ የአማርኛ አገባብ ያሳያል፣ ከ«ለመያዝ» ጋር ያለውንም ቃላዊ ትስስር ይጠብቃል።
- source_word: Χριστοῦ
  choice: ክርስቶስ
  rationale: በጳውሎስ ጽሑፍ ውስጥ እንደ ስም የተለመደውን አጠቃቀም ይጠብቃል፤ «መሲሕ» የሚለው የማዕረግ ትርጉም በማስታወሻ ተጠቅሷል።
theological_decisions:
- issue: τετελείωμαι ከኃጢአት ፍጹም ነፃ መሆንን እንደሚያመለክት መተርጎም አለመተርጎም
  choice: ወደ ፍጹምነት ደርሻለሁ
  alternative: ፍጹም ሆኛለሁ፤ ፍጹም ተደርጌአለሁ፤ ወደ ሙሉነት ደርሻለሁ
  rationale: ጳውሎስ የተጠናቀቀውን ሁኔታ ገና እንዳልደረሰበት ይክዳል፤ ጽሑፉ ግን ይህን በኋላ በተቀረጹ የትምህርት ምድቦች አይወስነውም።
- issue: ἐφ’ ᾧ ዓላማን ወይስ ምክንያትን እንደሚገልጥ
  choice: ለዚህ ዓላማ
  alternative: ስለዚህ፤ በዚህ ምክንያት
  rationale: በአውዱ የዓላማ ንባብ የጳውሎስን መገስገስና የክርስቶስን መያዝ በግልጽ ያገናኛል፤ የሐረጉ ሰዋሰዋዊ አሻሚነት ግን ይታወቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «እገሰግሳለሁ» የቀጣይ ጥረትን ምስል ሲያቆይ፣ «ለመያዝ/ስለያዘኝ» የግሪኩን ድግግሞሽ ይጠብቃል። በቀረበው SBLGNT ውስጥ ከ Χριστοῦ በኋላ Ἰησοῦ ስለሌለ፣ ዋናው ጽሑፍ «ክርስቶስ» ብቻ መሆን ይገባዋል።
