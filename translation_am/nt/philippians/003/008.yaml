  text: ἀλλὰ ⸀μενοῦνγε καὶ ἡγοῦμαι πάντα ζημίαν εἶναι διὰ τὸ ὑπερέχον τῆς γνώσεως Χριστοῦ Ἰησοῦ τοῦ κυρίου μου δι’ ὃν τὰ πάντα ἐζημιώθην, καὶ ἡγοῦμαι ⸀σκύβαλα ἵνα Χριστὸν κερδήσω
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/008.yaml
  text: More than that[a], I consider all things to be loss because of the surpassing value of the knowledge of Messiah Jesus my Lord, for whose sake I have suffered the loss of all things and consider them rubbish[c][b], so that I may gain Messiah.
translation:
  language: am
  text: ከዚህም በላይ፣ ጌታዬን መሲሕ ኢየሱስን የማወቅ ከሁሉ የላቀ ዋጋ የተነሳ፣ ሁሉን ነገር እንደ ኪሳራ እቆጥራለሁ። ስለ እርሱ ሁሉንም ነገር አጥቻለሁ፤ መሲሑን ለማግኘትም እንደ ቆሻሻ[a] እቆጥራቸዋለሁ።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ቆሻሻ” ተብሎ የተተረጎመው ቃል “የሚጣል ትርፍራፊ” ወይም “ኩበት” የሚል ጠንካራ ትርጉምም ሊኖረው ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “መሲሕ” የሚለው “ክርስቶስ” ተብሎም ሊተረጎም ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ μενοῦνγε καὶ
  choice: ከዚህም በላይ
  rationale: የቀደመውን አሳብ አጠናክሮ ወደ ላቀ ግምገማ የሚያሻግረውን የግሪክ አገላለጽ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἡγοῦμαι
  choice: እቆጥራለሁ
  rationale: ቃሉ የታሰበበትን ግምገማ ወይም ዋጋ መስጠትን ያመለክታል፤ እንዲሁም ከትርፍና ከኪሳራ ንጽጽሩ ጋር ይስማማል።
- source_word: πάντα / τὰ πάντα
  choice: ሁሉን ነገር / ሁሉንም
  rationale: የግሪኩን ሰፊና አጠቃላይ ወሰን ይጠብቃል።
- source_word: ζημίαν
  choice: ኪሳራ
  rationale: ጳውሎስ የሚጠቀምበትን የትርፍና የኪሳራ ንጽጽር በግልጽ ሁኔታ ያስተላልፋል።
- source_word: διὰ τὸ ὑπερέχον τῆς γνώσεως
  choice: የማወቅ እጅግ የላቀ ዋጋ ስላለው
  rationale: τὸ ὑπερέχον የሚያመለክተውን ከሁሉ የላቀ ዋጋ ይገልጻል፤ γνώσεωςን ‘የማወቅ’ ማለት በአማርኛ ተፈጥሯዊ ሆኖ የግል እውቀትንም ሆነ የእውቀት ይዘትን አይገድብም።
- source_word: Χριστοῦ Ἰησοῦ
  choice: መሲሕ ኢየሱስ
  rationale: Χριστός በዚህ አውድ የማዕረግ ኃይሉን ይዞ ስለሚታይ ‘መሲሕ’ ተብሎ ተተርጉሟል።
- source_word: τοῦ κυρίου μου
  choice: ጌታዬ
  rationale: የባለቤትነት ቅጥያውንና የκύριοςን ክርስቶሳዊ ክብደት በአጭርና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐζημιώθην
  choice: አጥቻለሁ
  rationale: የደረሰውን ኪሳራ ቀጥተኛና ተፈጥሯዊ በሆነ ዘመናዊ አማርኛ ይገልጻል፤ የግሪኩ ተገብሮ ቅርጽ በአማርኛ በቃል በቃል ቢገለጽ ከባድ ይሆናል።
- source_word: σκύβαλα
  choice: ቆሻሻ
  rationale: ከንቱና የሚጣል ነገርን የሚያሳየውን ኃይለኛ ንቀት በሰፊው የሚገባ አማርኛ ያስተላልፋል፤ የቃሉ ጠንካራ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ἵνα Χριστὸν κερδήσω
  choice: መሲሑን ለማግኘት
  rationale: ἵνα የሚያሳየውን ዓላማ ያቆያል፤ ‘ማግኘት’ ደግሞ ከኪሳራ ጋር ያለውን የትርፍ ንጽጽር በተፈጥሯዊ አማርኛ ይገልጻል።
theological_decisions:
- issue: በጳውሎስ አጠቃቀም Χριστόςን መተርጎም
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: በዚህ ቁጥር Χριστός የማዕረግ ትርጉሙን እንደያዘ ሊነበብ ስለሚችል ‘መሲሕ’ ተመርጧል፤ ባህላዊው ‘ክርስቶስ’ አማራጭ በማስታወሻ ተጠቅሷል።
- issue: τῆς γνώσεως የሚያመለክተው እውቀት
  choice: የማወቅ
  alternative: ስለ ... ያለው እውቀት
  rationale: የግሪኩ የዘር ቅጥያ ግንኙነት የግል መተዋወቅን ወይም ስለ እርሱ ያለ እውቀትን ብቻ እንዲል አያስገድድም፤ ‘የማወቅ’ ይህን ስፋት ይጠብቃል።
