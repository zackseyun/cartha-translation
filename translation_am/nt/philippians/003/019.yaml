  alternative: ስለ ምድራዊ ነገሮች ያስባሉ።
  rationale: ይህ ምርጫ ጊዜያዊ ማሰብን ብቻ ሳይሆን የተረጋጋ የአእምሮና የእሴት አቅጣጫን ያሳያል።
