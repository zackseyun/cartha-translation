  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «በቀረውስ» የንግግር ሽግግሩን ሳይገድብ ያሳያል፤ «ደስ ይበላችሁ» የማበረታቻ ትእዛዙን ተፈጥሯዊ አድርጎ ያቀርባል።
