base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/001.yaml
  text: Finally[a], my brothers, rejoice in the Lord. To write the same things to you is not troublesome for me[d][c][b], and is safe for you.
translation:
  language: am
  text: በመጨረሻም[a]፣ ወንድሞቼ[b]፣ በጌታ ደስ ይበላችሁ። እነዚያኑ ነገሮች ለእናንተ መጻፍ ለእኔ አያስቸግረኝም[c]፤ ለእናንተም ጥበቃ ነው[d]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በቀረው» ወይም «ከእንግዲህ ወዲህ»።
    reason: lexical_alternative
  - marker: b
    text: እዚህ «ወንድሞቼ» የሚለው መላውን ጉባኤ፣ ማለትም ወንድሞችንና እኅቶችን፣ ያመለክታል።
    reason: cultural_note
  - marker: c
    text: ወይም፣ «ለእኔ አይከብደኝም» ወይም «ለእኔ አያታክተኝም»።
    reason: lexical_alternative
  - marker: d
    text: ወይም፣ «ለእናንተ መጠበቂያ ነው»።
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ λοιπόν
  choice: በቀረውስ
  rationale: የንግግር ሽግግርን በተፈጥሯዊ አማርኛ ያሳያል፤ ጳውሎስ ከዚህ በኋላ ብዙ ስለሚጽፍ «በመጨረሻም» ብሎ በጊዜ ብቻ መገደብን ያስወግዳል።
- source_word: ἀδελφοί μου
  choice: ወንድሞቼ
  rationale: የግሪኩን ወንዳዊ ብዙ ቁጥር በቀጥታ ይጠብቃል፤ ጥሪው መላውን ጉባኤ እንደሚያካትት በማስታወሻ ተገልጧል።
- source_word: χαίρετε
  choice: ደስ ይበላችሁ
  rationale: የብዙ ቁጥር ትእዛዛዊ ኃይሉን የሚጠብቅና በዘመናዊ አማርኛ ተፈጥሯዊ የሆነ አገላለጽ ነው።
- source_word: ἐν κυρίῳ
  choice: በጌታ
  rationale: ደስታው ከጌታ ጋር ባለው ግንኙነት ወይም ኅብረት ውስጥ መሆኑን የግሪኩን አጭር አገላለጽ ጠብቆ ያቀርባል።
- source_word: τὰ αὐτά
  choice: ያንኑ ነገር
  rationale: ቀድሞ የተነገረው ምን እንደሆነ ሳይወስን የምንጩን ሰፊ አመልካችነት ይጠብቃል።
- source_word: γράφειν
  choice: ልጽፍላችሁ
  rationale: የመጻፍን ድርጊትና ተቀባዮቹን በተፈጥሯዊ የአማርኛ ሐረግ ያቀርባል።
- source_word: οὐκ ὀκνηρόν
  choice: ለእኔ አያሰለችኝም
  rationale: መድገሙ ጳውሎስን እንደማያሰለችው፣ እንደማያታክተው ወይም ወደኋላ እንደማያስቀረው ያሳያል።
- source_word: ἀσφαλές
  choice: ደኅንነት ነው
  rationale: የጥንቃቄና የጥበቃ ፍቺውን በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል፤ «መጠበቂያ» የሚለውን ይበልጥ ምሳሌያዊ አማራጭ በማስታወሻ ያቆያል።
theological_decisions:
- issue: ለጉባኤው የተሰጠው በጾታ የተቀረጸ አድራሻ
  choice: ወንድሞቼ
  alternative: ወንድሞቼና እኅቶቼ
  rationale: የግሪኩ ቅርጽ ሰዋስዋዊ ወንዳዊ ብዙ ቁጥር ስለሆነ ዋናው ጽሑፍ ይህን ይጠብቃል፤ በዐውዱ ግን ሴቶችንም ጨምሮ መላውን ጉባኤ እንደሚመለከት በማስታወሻ ተገልጧል።
- issue: የጳውሎስ ተደጋጋሚ ጽሑፍ የሚሰጠው ጥበቃ
  choice: ለእናንተም ደኅንነት ነው
  alternative: ለእናንተ መጠበቂያ ነው
  rationale: ዋናው ጽሑፍ የቅጽሉን ቀጥተኛ የደኅንነትና የጥንቃቄ ፍቺ ይጠብቃል፤ ይበልጥ የተተረጎመው የመጠበቂያ አገላለጽ እንደ አማራጭ ቀርቧል።
