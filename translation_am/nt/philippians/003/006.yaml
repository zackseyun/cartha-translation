base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/006.yaml
  text: as to zeal[a], persecuting the church; as to righteousness under the law[b], having become blameless.
translation:
  language: am
  text: በቅንዓት በኩል ቤተ ክርስቲያንን አሳዳጅ፤ በሕግ ያለውን[b] ጽድቅ[a] በተመለከተ ነቀፋ የሌለበት ሆኜ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ፍትሕ።”
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “በሕግ ውስጥ ያለው።”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ
  choice: በ… ረገድ / … በተመለከተ
  rationale: κατά እዚህ ጳውሎስ የሚመዘንበትን ዘርፍ ያስተዋውቃል። ሁለቱ የአማርኛ አገላለጾች በየአውዳቸው ተፈጥሯዊ ሆነው የግሪኩን ተደጋጋሚ አወቃቀር ይጠብቃሉ።
- source_word: ζῆλος
  choice: ቅንዓት
  rationale: ቃሉ የቀድሞውን የጳውሎስ ኃይለኛ ሃይማኖታዊ ትጋት ያመለክታል፤ ‘ቅንዓት’ ይህን በግልጽና በተለመደ መንገድ ያስተላልፋል።
- source_word: διώκων
  choice: አሳዳጅ
  rationale: በዚህ አውድ ግሱ ማሳደድንና ጠላትነት የተሞላበትን ተግባር ያመለክታል፤ የዝርዝሩን አጭር ቅርጽ ለመጠበቅ የስም ቅጹ ተመርጧል።
- source_word: ἐκκλησίαν
  choice: ቤተ ክርስቲያን
  rationale: በጳውሎስ አውድ ቃሉ የክርስቶስን አማኞች ማኅበረሰብ ያመለክታል፤ ይህም በዘመናዊ አማርኛ ግልጽና የተለመደ ነው።
- source_word: δικαιοσύνην
  choice: ጽድቅ
  rationale: ‘ጽድቅ’ በሕግ መለኪያ የሚገመገመውን ትክክለኛ አቋምና ምግባር ይገልጣል፤ ‘ፍትሕ’ የሚለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ἐν νόμῳ
  choice: በሕግ ያለው
  rationale: የግሪኩን ‘በሕግ ውስጥ’ የሚል ቅርብ ትርጉም ይጠብቃል፤ ሕጉ የጽድቁ ወሰንና መለኪያ መሆኑንም ያሳያል።
- source_word: γενόμενος
  choice: ሆኜ ተገኘሁ
  rationale: የአንቀጹን ተሳቢ የተፈጸመ ሐሳብ በተፈጥሯዊ አማርኛ ያቀርባል፤ ወደ ቀላል ቅጽል ብቻ አያሳንሰውም።
- source_word: ἄμεμπτος
  choice: ነቀፋ የሌለብኝ
  rationale: በተጠቀሰው የሕግ መለኪያ ክስ ወይም ነቀፋ የማይገኝበትን ሁኔታ ያሳያል፤ ፍጹም ኃጢአት አልባነትን አያስገባም።
theological_decisions:
- issue: ጳውሎስ ‘ነቀፋ የሌለብኝ’ ሲል የሚናገረው ወሰን
  choice: ንግግሩ በሕግ ያለውን ጽድቅ በሚመለከት በዚያ መለኪያ ነቀፋ የሌለበት መሆኑን ያመለክታል።
  alternative: ጳውሎስ ፈጽሞ ኃጢአት እንዳልሠራ እየተናገረ ነው፤ ወይም ንግግሩ ሙሉ በሙሉ ምጸታዊ ነው።
  rationale: ἄμεμπτος በሰዋስው δικαιοσύνη τὴν ἐν νόμῳ ከሚለው ጋር የተያያዘ ነው። ስለዚህ ንግግሩ ያለገደብ ሥነ ምግባራዊ ፍጹምነትን ሳይሆን በሕግ ወሰን ውስጥ የሚታየውን የቀድሞ አቋሙን ይገልጣል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። የግሪኩ ዝርዝራዊና አጭር አወቃቀር በሰረዝ ነጥብ ተጠብቋል፤ የሕጉ ጽድቅ እና ፍጹም ኃጢአት አልባነት እንዳይደባለቁም ቃላቱ በጥንቃቄ ተመርጠዋል።
