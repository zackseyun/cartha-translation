  text: እንደ የመሲሑ ኢየሱስ መልካም ወታደር በመከራ ተካፈል።[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እንደ የመሲሑ ኢየሱስ መልካም ወታደር፣ ከእኔ ጋር መከራን ተቀበል።”
    reason: lexical_alternative
  - marker: b
    text: ግሪክኛው “ክርስቶስ ኢየሱስ” ይላል፤ Χριστός እዚህ እንደ ማዕረግ ስለሚያገለግል “መሲሑ ኢየሱስ” ተብሎ ተተርጉሟል።
    reason: alternative_reading
lexical_decisions:
- source_word: συγκακοπάθησον
  choice: በመከራ ተካፈል
  rationale: የግሥ ቅርጹ ለአንድ ሰው የተሰጠ ትእዛዝ ነው፤ σύν- የሚለው ቅድመ ክፍልም ከሌሎች ጋር በጋራ መከራን መቀበልን ያመለክታል። “በመከራ ተካፈል” ይህን የጋራነት ሐሳብ ይጠብቃል፤ በግሪኩ በግልጽ ያልተጠቀሰውን “ከእኔ ጋር” የሚል ተሳታፊም አይጨምርም።
- source_word: ὡς
  choice: እንደ
  rationale: የንጽጽርንና የአድራጎትን ሁኔታ በቀጥታ የሚገልጽ ተፈጥሯዊ የአማርኛ አቻ ነው።
- source_word: καλὸς
  choice: መልካም
  rationale: በዚህ አገባብ የሚመሰገን፣ ብቁ የሆነ ወታደር የሚለውን ግምገማ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: στρατιώτης
  choice: ወታደር
  rationale: የቃሉን መደበኛ ትርጉምና በዚህ ስፍራ ያለውን ምሳሌያዊ አጠቃቀም ይጠብቃል።
- source_word: Χριστοῦ
  choice: መሲሑ
  rationale: Χριστός በዚህ ሐረግ ከግል ስም ይልቅ “የተቀባው” የሚለውን ማዕረግ ይገልጻል። “መሲሑ” የማዕረጉን ፍቺ ይጠብቃል፤ የአማርኛው አገባብም ወታደሩ ለመሲሑ ኢየሱስ የሆነ መሆኑን ያሳያል።
- source_word: Ἰησοῦ
  choice: ኢየሱስ
  rationale: በዘመናዊ መደበኛ አማርኛ የግል ስሙ የተለመደ አጻጻፍ ነው።
theological_decisions:
- issue: Χριστοῦ Ἰησοῦ የሚለውን ሐረግ መተርጎም
  choice: መሲሑ ኢየሱስ
  alternative: ክርስቶስ ኢየሱስ
  rationale: Χριστός እዚህ ከኢየሱስ ጋር የተጣመረ ክርስቶሎጂያዊ ማዕረግ ነው። “መሲሑ ኢየሱስ” ማዕረጉን ተርጉሞ የግል ስሙን እንዳለ ያቆያል፤ “ክርስቶስ ኢየሱስ” ግን በቤተ ክርስቲያናዊ አጠቃቀም የተለመደ ሌላ አቀራረብ ነው።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። የወታደርነት ምሳሌውና የጋራ መከራ ሐሳቡ ተጠብቀዋል።
