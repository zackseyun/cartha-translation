  text: ἐὰν δὲ καὶ ἀθλῇ τις, οὐ στεφανοῦται ἐὰν μὴ νομίμως ἀθλήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/005.yaml
  text: And if anyone also competes as an athlete[a], he is not crowned unless he competes according to the rules.
translation:
  language: am
  text: ደግሞም ማንም እንደ አትሌት ቢወዳደር፣ በውድድሩ ደንብ መሠረት[a] ካልተወዳደረ አክሊል አይቀዳጅም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በሕጉ መሠረት።” የግሪኩ ተውሳከ ግስ “በሕጋዊ መንገድ” ማለት ሊሆን ይችላል፤ እዚህ ግን የውድድሩን ደንብ ጠብቆ መወዳደርን የሚያመለክት ይመስላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθλῇ / ἀθλήσῃ
  choice: እንደ አትሌት ቢወዳደር / ካልተወዳደረ
  rationale: ግሶቹ የአትሌቲክስ ውድድርን ያመለክታሉ። ተመሳሳዩን የአማርኛ ግስ መድገም በሁለቱ የግሪክ ቅርጾች መካከል ያለውን የቃል ግንኙነት ይጠብቃል።
- source_word: τις
  choice: ማንም
  rationale: ያልተወሰነውንና ሁሉን አቀፍ የሆነውን የተውላጠ ስም ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: στεφανοῦται
  choice: አክሊል አይቀዳጅም
  rationale: በውድድር የሚሰጠውን የአሸናፊነት አክሊል ምስል ይጠብቃል፤ ከጽሑፉ በላይ የሆነ መንፈሳዊ ትርጉምም አይጨምርም።
- source_word: νομίμως
  choice: በውድድሩ ደንብ መሠረት
  rationale: በዚህ የአትሌቲክስ አውድ ውስጥ ቃሉ ተወዳዳሪው የውድድሩን ሕግና ደንብ ጠብቆ መወዳደሩን ያመለክታል።
- source_word: καὶ / δὲ
  choice: ደግሞም
  rationale: ከቀደሙት ምሳሌዎች ጋር ያለውን ጭማሪና ለስላሳ ሽግግር በአንድ ተፈጥሯዊ የአማርኛ አገናኝ ያሳያል።
theological_decisions:
- issue: የአክሊሉ ምስል ምንነት
  choice: አሸናፊው አክሊል እንደሚቀዳጅ የሚያሳየውን የአትሌቲክስ ምስል ብቻ ማቆየት
  alternative: አክሊሉን የዘላለም ወይም የአገልግሎት ሽልማት ብሎ በግልጽ መተርጎም
  rationale: የግሪክ ጽሑፉ አክሊሉ በምሳሌው ውጭ በትክክል ምን እንደሚወክል አይወስንም፤ ስለዚህ ትርጉሙ ያንን ክፍትነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “አትሌት” የአትሌቲክስን ምስል በግልጽ የሚያቀርብ በዘመናዊ አማርኛ የተለመደ ቃል ነው።
