  text: and they may come to their senses out of the devil’s snare[b][a], having been captured alive by him for his will.
translation:
  language: am
  text: አእምሯቸውን መልሰው ከዲያብሎስ ወጥመድ ያመልጡ ዘንድ፤ የዚያኛውን ፈቃድ እንዲፈጽሙ በእርሱ በሕይወት ተማርከዋል።[b][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የዚያኛው” የሚለው ዲያብሎስን ሊያመለክት ይችላል። አንዳንዶች ግን እግዚአብሔርን እንደሚያመለክት ይረዱታል።
    reason: alternative_reading
  - marker: b
    text: “በሕይወት ተማርከዋል” የተተረጎመው ግስ በአጠቃላይ “ተማርከዋል” ተብሎም ሊተረጎም ይችላል፤ የግሪኩ ቃል ግን በተለይ በሕይወት መማረክን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνανήψωσιν
  choice: ወደ ልባቸው ይመለሱ ይሆናል
  rationale: ግሱ ቃል በቃል ከስካር መ醒ትን፣ በዚህ አውድ ግን አስተዋይነትን መልሶ ማግኘትን ያመለክታል፤ ‘ወደ ልብ መመለስ’ ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: παγίδος
  choice: ወጥመድ
  rationale: የማጥመድና የመያዝ ዘይቤውን በግልጽና በተለመደ አማርኛ ይጠብቃል።
- source_word: διαβόλου
  choice: ዲያብሎስ
  rationale: በዚህ አውድ ቃሉ የሰይጣን ግላዊ መጠሪያ ነው፤ ‘ዲያብሎስ’ የተለመደና ግልጽ ነው።
- source_word: ἐζωγρημένοι
  choice: በሕይወት ተማርከዋል
  rationale: ζωγρέω በተለይ በሕይወት መማረክን ያመለክታል፤ ፍጹም ተገብሮ አካፋዩም ከቀደመ መማረክ የተነሣ ያለውን ሁኔታ ያሳያል።
- source_word: ὑπ’ αὐτοῦ
  choice: በእርሱ
  rationale: በቅርብ ያለው ተመላሽ ዲያብሎስ ነው፤ ተውላጠ ስሙን መጠበቅ አላስፈላጊ ድግግሞሽን ያስወግዳል።
- source_word: εἰς τὸ ἐκείνου θέλημα
  choice: ለእርሱ ፈቃድ
  rationale: εἰς ያለውን አቅጣጫዊ/ዓላማዊ ኃይል ሳይጨምር ይጠብቃል፤ ἐκείνου ማንን እንደሚያመለክት ያለውን እውነተኛ አሻሚነትም ተውላጠ ስም በመጠቀም አያጠፋውም።
theological_decisions:
- issue: ἐκείνου በεἰς τὸ ἐκείνου θέλημα ውስጥ የሚያመለክተው ማንን እንደሆነ
  choice: በዋናው ንባብ ‘እርሱ’ ዲያብሎስን እንደሚያመለክት ተወስዷል።
  alternative: አንዳንዶች ‘እርሱ’ እግዚአብሔርን እንደሚያመለክት ይረዱታል።
  rationale: በሰዋስውና በቅርብ አውድ የተፈጥሮ ተመላሹ ዲያብሎስ ነው፤ ሆኖም የተውላጠ ስሙ ማጣቀሻ ከጥንት ጀምሮ አከራካሪ ስለሆነ ሌላው ግንዛቤ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ የሚገባ አማርኛ ተጠቅሟል። ‘ወደ ልብ መመለስ’ በአማርኛ የጠራ አስተሳሰብን መልሶ ማግኘት የሚገልጽ ተፈጥሯዊ ፈሊጥ ነው። የግሪኩ አሻሚ ተውላጠ ስም በዋናው ጽሑፍና በማስታወሻ ተጠብቋል።
