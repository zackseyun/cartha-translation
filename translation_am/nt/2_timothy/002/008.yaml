  rationale: μου የሚለውን ባለቤትነት በቀጥታ ይጠብቃል። ይህ ከሌላ የተለየ ወንጌል ማለት መሆኑንም ሆነ አለመሆኑን ትርጉሙ በራሱ አይወስንም።
