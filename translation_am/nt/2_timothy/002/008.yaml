  text: Remember Jesus the Messiah[a], raised from the dead, descended from David[b], according to my gospel.
translation:
  language: am
  text: 'ከሙታን የተነሣውን፣ ከዳዊት ዘር የሆነውን ኢየሱስን፣ መሲሑን[a]፣ እንደ ወንጌሌ አስታውስ።


    [a] ወይም፣ “ኢየሱስ ክርስቶስን።” የግሪክኛው Χριστός የማዕረግ ስም “መሲሕ” ወይም “ክርስቶስ” ተብሎ ሊተረጎም ይችላል፤ እዚህ ከዳዊት ዘር መሆኑ ስለተጠቀሰ “መሲሕ” ተብሏል።


    [b] ቃል በቃል፣ “ከዳዊት ዘር።”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ኢየሱስ ክርስቶስን።” የግሪክኛው Χριστός የማዕረግ ስም “መሲሕ” ወይም “ክርስቶስ” ተብሎ ሊተረጎም ይችላል፤ እዚህ ከዳዊት ዘር መሆኑ ስለተጠቀሰ “መሲሕ” ተብሏል።
    reason: alternative_reading
  - marker: b
