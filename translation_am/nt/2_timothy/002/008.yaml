  alternative: ከሙታን የተነሣውን ሆኖ የሚኖረውን
  rationale: አጭሩ የአማርኛ ቅርጽ ትንሣኤው በኢየሱስ ላይ የተፈጸመ ድርጊት መሆኑን ያሳያል፤ የውጤቱን ቀጣይነት በማብራሪያ መጨመር ግን ከጽሑፉ ይልቅ ሰፊ ይሆናል።
