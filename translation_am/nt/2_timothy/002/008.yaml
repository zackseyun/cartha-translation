  choice: አስብ
  rationale: የአሁን ጊዜ ትእዛዛዊ ቅርጹ ኢየሱስን ያለማቋረጥ በሐሳብ መያዝን ያሳያል። “አስብ” በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን የትእዛዙን ኃይል ይጠብቃል።
- source_word: Ἰησοῦν Χριστόν
  choice: ኢየሱስ መሲሕን
  rationale: Χριστός በዚህ አውድ በተለይ ከዳዊት ዘር ጋር በመገናኘቱ የማዕረግ ትርጉሙን ያጎላል። “መሲሕ” ይህን ትርጉም በግልጽ ያስተላልፋል፤ “ክርስቶስ” በማስታወሻ ቀርቧል።
- source_word: ἐγηγερμένον
  choice: የተነሣውን
  rationale: የተፈጸመ ተደራጊ አንቀጽ ሲሆን ኢየሱስ ከሙታን እንደተነሣና በሕይወት እንዳለ ያመለክታል። የአማርኛው ተደራጊ ቅርጽ ይህን ይጠብቃል።
- source_word: ἐκ νεκρῶν
  choice: ከሙታን
  rationale: በትንሣኤ አውድ የግሪክኛውን መደበኛ አገላለጽ በአጭርና በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐκ σπέρματος Δαυίδ
  choice: ከዳዊት ዘር የሆነውን
  rationale: σπέρμα ቃል በቃል “ዘር” ማለት ሲሆን እዚህ የትውልድ ሐረግን ያመለክታል። ይህ አተረጓጎም ቃሉን እየጠበቀ ትርጉሙን በተፈጥሯዊ አማርኛ ያቀርባል።
