- issue: γεννῶσι የሚለው ዘይቤ ቃል በቃል ይቀመጥ ወይስ በውጤታዊ ግስ ይተረጎም?
  choice: «ይወልዳሉ» የሚለው ዘይቤ ተጠብቋል።
  alternative: «ያስከትላሉ» ወይም «ያመጣሉ»
  rationale: የመውለድ ዘይቤ በአማርኛ ግልጽና ተፈጥሯዊ ስለሆነ የምንጩን ምስላዊነት ማቆየት ተመርጧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የትእዛዝ ኃይልና የመውለድ ዘይቤ ተጠብቀዋል፤ በζητήσεις ውስጥ ያለው የትርጉም ስፋት በግርጌ ማስታወሻ ቀርቧል።
