theological_decisions:
- issue: ζητήσεις ገለልተኛ ጥያቄዎችን ወይስ አከራካሪ ክርክሮችን ያመለክታል?
  choice: በዋናው ጽሑፍ «ክርክሮች» ተብሏል።
  alternative: «ጥያቄዎች» ወይም «ክርክሮች/ውይይቶች»
