  rationale: ቃሉ ጥያቄዎችን ወይም ምርመራዎችን ሊያመለክት ቢችልም፣ እዚህ ከጠብ ጋር ያለው ዐውድ አከራካሪ ውይይቶችን ያመለክታል።
