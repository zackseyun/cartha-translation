    text: ወይም፣ «ጥያቄዎች» ወይም «ውይይቶች»፤ የግሪኩ ቃል ምርመራዎችን ሊያመለክት ይችላል፣ እዚህ ግን ከልባዊ ፍለጋ ይልቅ ጠብ የሚያስነሱ ክርክሮችን የሚያመለክት ይመስላል።
