  text: εἰ ὑπομένομεν, καὶ συμβασιλεύσομεν· εἰ ⸀ἀρνησόμεθα, κἀκεῖνος ἀρνήσεται ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/012.yaml
  text: If we endure[a], we will also reign with him; if we deny him, he also will deny us.
translation:
  language: am
  text: ብንጸና፣ ከእርሱ ጋር ደግሞ እንነግሣለን፤ እርሱን ብንክድ፣ እርሱም ይክደናል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπομένομεν
  choice: ብንጸና
  rationale: ὑπομένω በፈተናና በመከራ ውስጥ በጽናት መቆየትን ያመለክታል። «መጽናት» በዘመናዊ አማርኛ ተፈጥሯዊና አጭር ሲሆን ከግሪኩ በላይ የሆነ ሥነ መለኮታዊ ትርጓሜ አያስገባም።
- source_word: συμβασιλεύσομεν
  choice: ከእርሱ ጋር ደግሞ እንነግሣለን
  rationale: የተዋሐደው ግስ «አብሮ መንገሥ» ማለት ነው። ከዐውደ ንባቡ የሚታወቀው ክርስቶስ በአማርኛ በ«ከእርሱ ጋር» ተገልጧል፤ «መንገሥ»ም የንጉሣዊ ሥልጣንን ምስል ይጠብቃል።
- source_word: ἀρνησόμεθα
  choice: እርሱን ብንክድ
  rationale: ἀρνέομαι መካድን፣ አለማወቅ ማለትን ወይም መካድን/መተውን ሊያመለክት ይችላል። «እርሱን ብንክድ» ተፈጥሯዊ ሲሆን በሁለቱ ሐረጎች ያለውን የግስ ድግግሞሽ ያስጠብቃል።
- source_word: κἀκεῖνος
  choice: እርሱም
  rationale: κἀκεῖνος የκαὶ ἐκεῖνος ውህደት ሲሆን የምላሽ ትይዩነትን ያጎላል። «እርሱም» ይህን በአጭርና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἀρνήσεται ἡμᾶς
  choice: ይክደናል
  rationale: በቀደመው ሐረግ እንደተደረገው እዚህም «መካድ» የሚለውን ግስ መድገም የግሪኩን ሆን ተብሎ የተሠራ ትይዩነትና የማስጠንቀቂያውን ኃይል ይጠብቃል።
theological_decisions:
- issue: በሁለተኛው ሁኔታዊ ሐረግ ያለው የማስጠንቀቂያ ባሕርይ
  choice: «እርሱን ብንክድ፣ እርሱም ይክደናል» ተብሎ እንደ እውነተኛና ግልጽ ማስጠንቀቂያ ተተርጉሟል።
  alternative: ይህን ክህደት የሽልማት ማጣትን ብቻ እንደሚያመለክት መተርጎም፣ ወይም ሁኔታውን ተጨባጭ ኃይል የሌለው ግምታዊ አባባል አድርጎ መውሰድ።
  rationale: ግሪኩ ሁለት ትይዩ ሁኔታዊ ሐረጎችን ያቀርባል፣ የክህደትና የመካድ አባባሉም በኢየሱስ የማስጠንቀቂያ ትውፊት ያለውን ቋንቋ ያስታውሳል። ትርጉሙ ስለ ክህደት፣ ስለ ጽናት ወይም ስለ ሽልማት ያሉ ክርክሮችን ሳይወስን የንባቡን ክብደትና ሥነ መለኮታዊ ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «እንነግሣለን» ባህላዊውን የመጽሐፍ ቅዱስ ንጉሣዊ ምስል ይጠብቃል፤ ዓረፍተ ነገሩም የግሪኩን ሁለት ትይዩ ሁኔታዊ ክፍሎች በተፈጥሯዊ አማርኛ ያቀርባል።
