  text: Consider what I am saying[b][a], for the Lord will give you understanding in all things.
translation:
  language: am
  text: የምለውን አስብበት፤[a] ጌታ በሁሉ ነገር ማስተዋልን ይሰጥሃልና።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የምለውን አስተውል»። ግሱ «ተረዳ» የሚል ትርጉምም ሊኖረው ይችላል።
    reason: lexical_alternative
  - marker: b
    text: በግሪክኛው «ጌታ» የሚለው ማንን እንደሚያመለክት ተጨማሪ ማብራሪያ የለውም፤ በተለይ ጌታ ኢየሱስን ወይም በአጠቃላይ እግዚአብሔርን ስለማመልከቱ ተርጓሚዎች ይለያያሉ።
    reason: alternative_reading
lexical_decisions:
- source_word: νόει
  choice: አስብበት
  rationale: የአሁን ጊዜ ትእዛዛዊ ግስ ጢሞቴዎስ የተነገረውን በንቃት እንዲያስብበትና እንዲመረምረው ይጠይቃል። «አስብበት» የትእዛዙን ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል፤ «ተረዳ» የሚለውን የቃሉን ሌላ ትርጉም ግን የጌታ የማስተዋል ስጦታ ከሚናገረው ቀጣይ ሐረግ አንጻር በዋናው ጽሑፍ አልተመረጠም።
- source_word: ὃ
  choice: የምለውን
  rationale: አንጻራዊው ተውላጠ ስም ጳውሎስ እየተናገረ ያለውን ይዘት ያመለክታል፤ ከ λέγω ጋር በአንድ ተፈጥሯዊ የአማርኛ አገላለጽ «የምለውን» ተብሏል።
- source_word: λέγω
  choice: የምለውን
  rationale: የአሁን ጊዜው ግስ በዐውዱ ያለውን የጳውሎስን ቀጥተኛ ትምህርት ያመለክታል፤ «የምለውን» ይህን በአጭርና ተፈጥሯዊ ሁኔታ ያቀርባል።
- source_word: δώσει
  choice: ይሰጥሃል
  rationale: የወደፊት ጊዜው ግስ ተስፋን ይገልጣል፤ «ይሰጥሃል» ቀጥተኛና ግልጽ አቻ ነው።
- source_word: γάρ
  choice: -ና
  rationale: γάρ ለትእዛዙ ምክንያት ወይም መሠረት ያቀርባል። በአማርኛ በሐረጉ መጨረሻ ያለው «-ና» ይህን ግንኙነት በተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: σοι
  choice: -ሃል
  rationale: የሁለተኛ መደብ ነጠላ ተቀባይነት በአማርኛው «ይሰጥሃል» ውስጥ በቅጥያ ተገልጧል።
- source_word: ὁ κύριος
  choice: ጌታ
  rationale: ግሪኩ ማንነቱን ከ«ጌታ» በላይ አይገልጽም። ይህ አተረጓጎም ጌታ ኢየሱስን ወይም እግዚአብሔርን በግልጽ በመጥቀስ የጽሑፉን ክፍትነት አይወስንም።
- source_word: σύνεσιν
  choice: ማስተዋልን
  rationale: ቃሉ መረዳትን፣ የትርጉም ግንዛቤንና ነገሮችን አገናኝቶ የመያዝ ችሎታን ያመለክታል። «ማስተዋል» በዐውዱ ግልጽና ሰፊ ትርጉም አለው።
- source_word: ἐν πᾶσιν
  choice: በሁሉ ነገር
  rationale: ሐረጉ ሰፊና አጠቃላይ ወሰን አለው። «በሁሉ ነገር» ወሰኑን ወደ ትምህርተ እምነት ጉዳዮች ብቻ ሳያጠብ ይጠብቃል።
theological_decisions:
- issue: የ«ጌታ» (ὁ κύριος) ማመልከቻ
  choice: ማንነቱን ሳይወስን «ጌታ» ተብሎ ተተርጉሟል።
  alternative: «ጌታ ኢየሱስ» ወይም «እግዚአብሔር»
  rationale: የግሪኩ ጽሑፍ «ጌታ» ከማለት በላይ ማመልከቻውን በግልጽ አይወስንም። በጳውሎስ አጠቃቀም ብዙ ጊዜ ኢየሱስን ሊያመለክት ቢችልም፣ ትርጉሙ የጽሑፉን አሻሚነት ጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ቀላል የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ አጭር ትእዛዝና የምክንያት ግንኙነት ተጠብቀዋል፤ የ«ጌታ» ማመልከቻም ሆነ የ νόει የትርጉም ስፋት ያለአስፈላጊ የእምነት አቋም አልተወሰኑም።
