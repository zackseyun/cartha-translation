- source_word: δίωκε
  choice: ተከታተል
  rationale: በግብረገባዊ አውድ ያለውን ንቁና ቀጣይ ፍለጋ ያሳያል፤ ከ‘ሽሽ’ ጋር ያለውን ንፅፅርም ይጠብቃል።
- source_word: δικαιοσύνην
