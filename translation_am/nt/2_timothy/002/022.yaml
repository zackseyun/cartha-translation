  text: τὰς δὲ νεωτερικὰς ἐπιθυμίας φεῦγε, δίωκε δὲ δικαιοσύνην, πίστιν, ἀγάπην, εἰρήνην μετὰ τῶν ἐπικαλουμένων τὸν κύριον ἐκ καθαρᾶς καρδίας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/022.yaml
  text: But flee youthful desires[a], and pursue righteousness, faith, love, and peace[c][b], together with those who call on the Lord from a pure heart.
translation:
  language: am
  text: ነገር ግን የወጣትነትን ምኞቶች[a] ሽሽ፤ ከንጹሕ ልብ ጌታን ከሚጠሩ ጋር ጽድቅን[b]፣ እምነትን[c]፣ ፍቅርንና ሰላምን ተከታተል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የወጣትነት ጠንካራ ምኞቶች።” የግሪኩ ሐረግ ፆታዊ ምኞትን ብቻ ሳይሆን በወጣትነት የሚታዩ ምኞቶችን በሰፊው ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ፍትሕን።” የግሪኩ ቃል በጳውሎስ አጠቃቀም ሥነ ምግባራዊ፣ ግንኙነታዊና ሕጋዊ ገጽታዎችን ሊይዝ ይችላል።
    reason: alternative_reading
  - marker: c
    text: ወይም፣ “ታማኝነትን።” የግሪኩ ቃል እንደ አውዱ እምነትን፣ መታመንን ወይም ታማኝነትን ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: νεωτερικὰς ἐπιθυμίας
  choice: የወጣትነትን ምኞቶች
  rationale: ሐረጉ በወጣትነት የሚታዩ ልዩ ልዩ ምኞቶችን በሰፊው ያመለክታል፤ ትርጉሙን በፆታዊ ምኞት ብቻ አይገድብም።
- source_word: φεῦγε
