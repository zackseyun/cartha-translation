- issue: የδικαιοσύνη ትርጉም
  choice: በዋናው ጽሑፍ ‘ጽድቅ’፣ በማስታወሻ ‘ፍትሕ’
  alternative: ፍትሕ
  rationale: ‘ጽድቅ’ የቃሉን ሰፊ ጳውሎሳዊ አጠቃቀም ይጠብቃል፤ ሕጋዊና ግንኙነታዊ የ‘ፍትሕ’ ገጽታው ግን እንዳይጠፋ በማስታወሻ ቀርቧል።
- issue: የπίστις ትርጉም
  choice: በዋናው ጽሑፍ ‘እምነት’፣ በማስታወሻ ‘ታማኝነት’
  alternative: ታማኝነት
  rationale: በዚህ አውድ እምነትም ሆነ ታማኝነት ሊሆን ይችላል፤ ዋናው ጽሑፍ የተለመደውን ትርጉም ሲይዝ እውነተኛውን የትርጉም አማራጭ ማስታወሻው ይጠብቃል።
