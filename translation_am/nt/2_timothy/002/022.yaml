- source_word: πίστιν
  choice: እምነት
  rationale: የπίστις ቀጥተኛና የተለመደ ትርጉም ነው፤ በዚህ የበጎ ባሕርያት ዝርዝር ውስጥ ‘ታማኝነት’ም ሊያመለክት ስለሚችል በማስታወሻ ቀርቧል።
- source_word: ἀγάπην
  choice: ፍቅር
  rationale: ቀጥተኛ፣ ተፈጥሯዊና ከሌሎች የአዲስ ኪዳን አጠቃቀሞች ጋር የሚጣጣም ትርጉም ነው።
- source_word: εἰρήνην
  choice: ሰላም
  rationale: በበጎ ባሕርያት ዝርዝሩ ውስጥ ቀጥተኛና ተፈጥሯዊ ትርጉም ነው።
- source_word: μετὰ τῶν ἐπικαλουμένων τὸν κύριον
  choice: ጌታን ከሚጠሩ ጋር
  rationale: μετά የሚያሳየውን አብሮነት ይጠብቃል፤ ἐπικαλέωንም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: κύριον
  choice: ጌታ
  rationale: በአዲስ ኪዳን አውድ κύριοςን ለመተርጎም የተለመደና ተገቢ ቃል ነው።
- source_word: ἐκ καθαρᾶς καρδίας
  choice: ከንጹሕ ልብ
  rationale: ἐκ የሚያሳየውን የውስጥ ምንጭ በአጭርና ተፈጥሯዊ አማርኛ ይገልጻል።
theological_decisions:
- issue: የ‘νεωτερικὰς ἐπιθυμίας’ ወሰን
  choice: በወጣትነት የሚታዩ ሰፊ ልዩ ልዩ ምኞቶች
