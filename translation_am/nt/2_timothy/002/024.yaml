- source_word: πρὸς πάντας
  choice: ለሁሉም ሰው
  rationale: የገርነቱ ወሰን ማንንም ሳይለይ ሁሉን እንደሚያካትት በግልጽ ዘመናዊ አማርኛ ያሳያል።
