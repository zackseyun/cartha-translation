  rationale: «ጌታ» በዚህ ክርስቲያናዊ አውድ κύριοςን በክብርና በተለመደ ሁኔታ ይገልጻል፤ «ባለቤት» የሚለው ደግሞ የጽሑፉን ሃይማኖታዊ አጠቃቀም በቂ አያሳይም።
- issue: ἀνεξίκακος የሚያመለክተው ትዕግሥት
