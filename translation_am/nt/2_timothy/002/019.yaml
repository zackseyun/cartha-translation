  rationale: κύριος የሚለው የግሪክ ቃል አመልካቹን በግልጽ አይለይም፤ ቃሉም የብሉይ ኪዳን ጥቅስን በክርስቲያናዊ አውድ ይጠቀማል። ስለዚህ ትርጉሙ ይህን ሥነ መለኮታዊ ጥልቀትና ግልጽ ያልሆነነት ጠብቋል።
