  text: Ἐν μεγάλῃ δὲ οἰκίᾳ οὐκ ἔστιν μόνον σκεύη χρυσᾶ καὶ ἀργυρᾶ ἀλλὰ καὶ ξύλινα καὶ ὀστράκινα, καὶ ἃ μὲν εἰς τιμὴν ἃ δὲ εἰς ἀτιμίαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/020.yaml
  text: In a large house there are not only gold and silver vessels[a], but also wooden and earthenware ones, and some are for honor[b], but others for dishonor.
translation:
  language: am
  text: በትልቅ ቤት ውስጥ ከወርቅና ከብር የተሠሩ ዕቃዎች ብቻ ሳይሆኑ፣ ከእንጨትና ከሸክላ[a] የተሠሩም አሉ፤ አንዳንዶቹ ለክብር፣ ሌሎቹ ግን ለውርደት ናቸው።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ከሸክላ” የሚለው ከተጋገረ ሸክላ ወይም ከሸክላ ዕቃ ቁስ የተሠሩ ዕቃዎችን ያመለክታል።
    reason: cultural_note
  - marker: b
    text: ወይም፣ “አንዳንዶቹ ለክብር አገልግሎት፣ ሌሎቹ ግን ለውርደት አገልግሎት ናቸው።” ግሪክኛው ቃል በቃል “ለክብር ... ለውርደት” ይላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλῃ οἰκίᾳ
  choice: በትልቅ ቤት ውስጥ
  rationale: የቤቱን ስፋት ወይም ታላቅነት በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል፤ በመነሻው δέ ውስጥ የሌለ ጊዜያዊ ‘አሁን’ አልተጨመረም።
- source_word: σκεύη
  choice: ዕቃዎች
  rationale: ቃሉ ለተለያየ ዓላማ የሚውሉ ዕቃዎችን ወይም ዕቃ መያዣዎችን በሰፊው ያመለክታል፤ ‘ዕቃዎች’ የቤቱን ምሳሌ ሳያጠብ ያቆያል።
- source_word: χρυσᾶ καὶ ἀργυρᾶ
  choice: ከወርቅና ከብር የተሠሩ
  rationale: ቅጽሎቹ ዕቃዎቹ ከምን ቁስ እንደተሠሩ ያመለክታሉ፤ ይህ አገላለጽ በአማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: ξύλινα καὶ ὀστράκινα
  choice: ከእንጨትና ከሸክላ የተሠሩ
  rationale: ξύλινα እንጨትን፣ ὀστράκινα ደግሞ ከሸክላ ወይም ከሸክላ ዕቃ ቁስ የተሠራን ያመለክታል። ‘ከሸክላ’ ለዘመናዊ አንባቢ ግልጽ ነው።
- source_word: καὶ ἃ μὲν ... ἃ δὲ ...
  choice: አንዳንዶቹ ... ሌሎቹ ግን ...
  rationale: የμέν...δέን የንጽጽር አወቃቀር በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: εἰς τιμήν
  choice: ለክብር
  rationale: የግሪክኛውን ረቂቅ ስም τιμή በቅርብ ይጠብቃል፤ ትርጉሙን ‘ለክብር ያለው ጥቅም’ ብሎ አስቀድሞ አይወስንም።
- source_word: εἰς ἀτιμίαν
  choice: ለውርደት
  rationale: ከ‘ክብር’ ጋር ያለውን ተቃርኖ በግልጽ ያሳያል፤ ቃሉን ‘ለተራ ጥቅም’ ብሎ በተግባራዊ ትርጉም አይገድበውም።
theological_decisions:
- issue: τιμή/ἀτιμίαን እንደ አጠቃቀም ዓይነት መተርጎም ወይስ የክብርና የውርደት ቃላትን ማቆየት
  choice: ለክብር ... ለውርደት
  alternative: ለክብር አገልግሎት ... ለውርደት አገልግሎት
  rationale: አውዱ የቤት ዕቃዎችን ቢጠቀምም፣ ጳውሎስ ረቂቅ ስሞቹን τιμή እና ἀτιμία ይጠቀማል። ዋናው ጽሑፍ ይህን አሻሚነትና ሥነ መለኮታዊ ውጥረት ለቀጣዩ ቁጥር ያቆያል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የቤት ዕቃዎች ምሳሌ ተጠብቋል፤ ‘ለክብር/ለውርደት’ የሚለው ሆን ተብሎ በቀጥታ ቀርቧል።
