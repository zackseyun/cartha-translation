    reason: alternative_reading
  - marker: d
    text: ወይም፣ “ይገለብጣሉ፣” “ያበላሻሉ” ወይም “ያፈርሳሉ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: እነዚህም
  rationale: ወደ ቀደሙት ሐሰተኛ አስተማሪዎች የሚመለሰውን አንጻራዊ አገናኝ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: περὶ τὴν ἀλήθειαν ἠστόχησαν
  choice: ከእውነት የሳቱ ናቸው
  rationale: ἀστοχέω የዒላማ መሳትን መሠረታዊ ምስል ቢይዝም፣ በዚህ አገባብ ከእውነተኛ ትምህርት መውጣትን ያመለክታል፤ ይህ አተረጓጎም በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: λέγοντες
  choice: እያሉ
  rationale: የአሁን ጊዜ ቦዝ አንቀጹን በተፈጥሯዊ አማርኛ ያቀርባል፤ ስህተታቸው በሚናገሩት ቃል እንደሚገለጥም ያሳያል።
- source_word: ἀνάστασιν ἤδη γεγονέναι
  choice: ትንሣኤው አስቀድሞ ሆኗል
  rationale: በዚህ የትምህርት አገባብ ἀνάστασις የሚጠበቀውን ትንሣኤ ያመለክታል፤ የፍጹም ጊዜ አወቃቀሩም ክስተቱ ቀድሞ ተፈጽሟል የሚለውን የሐሰት አባባል ያሳያል።
- source_word: ἀνατρέπουσιν
  choice: ያናጋሉ
  rationale: ግሱ መገልበጥ፣ ማፍረስ ወይም ማበላሸት የሚል ኃይለኛ ትርጉም ሊኖረው ይችላል፤ ‘ያናጋሉ’ በዚህ አገባብ እምነትን የማረጋጋት ተቃራኒ የሆነውን ቀጣይ ተጽእኖ ያሳያል፣ ሙሉ በሙሉ መጥፋቱን ግን አይጭንም።
- source_word: τήν τινων πίστιν
  choice: የአንዳንዶችን እምነት
  rationale: τινων ያልተወሰኑ አንዳንድ ሰዎችን ያመለክታል፤ πίστις ደግሞ ያለ አስፈላጊ ትርጓሜያዊ ጭማሪ ‘እምነት’ ተብሎ ቀርቧል።
