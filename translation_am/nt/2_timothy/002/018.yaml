  rationale: ግሪኩ የአባባላቸውን ይዘት ይገልጻል እንጂ ሙሉውን የኑፋቄ ሥርዓታቸውን አይገልጽም፤ ስለዚህ ትርጉሙ ያልተገለጸውን ዝርዝር አይጨምርም።
- issue: πίστις በዚህ አገባብ
