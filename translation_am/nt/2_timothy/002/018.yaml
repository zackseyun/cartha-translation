review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the reported claim that the resurrection has already occurred and identifies its harmful effect on some people's faith. However, ἀνατρέπουσιν is stronger than ‘ያናጋሉ’ (‘shake’); ‘ያፈርሳሉ’ better represents overturning/subverting. The explanatory wording of footnote b goes beyond what this verse itself states by identifying the resurrection as future-expected.
  naturalness: The Amharic is generally clear and suitably formal. Recasting ‘ከእውነት የሳቱ ናቸው’ as ‘ከእውነት ርቀዋል’ is more direct and idiomatic, while retaining the completed deviation expressed by the Greek aorist.
  terminology: ‘ትንሣኤ’ and ‘እምነት’ are appropriate established biblical terms. ‘ትንሣኤው’ is acceptable as definite in this doctrinal context.
  issues:
  - severity: medium
    issue: The main-text rendering ‘ያናጋሉ’ weakens ἀνατρέπουσιν.
    rationale: ἀνατρέπω conveys overturning, ruining, or subverting, not merely causing instability. ‘ያፈርሳሉ’ more closely preserves the force without claiming a result beyond the verb.
  - severity: medium
    issue: Footnote b specifies that the claim concerned a future-expected resurrection.
    rationale: This is a plausible contextual reconstruction, but the Greek verse reports only that ‘resurrection has already happened.’ The footnote should not present the reconstruction as information supplied by the verse.
  revised_text: እነዚህም ከእውነት ርቀዋል[a]፤ “ትንሣኤው አስቀድሞ ሆኗል”[b] እያሉ፣ የአንዳንዶችን እምነት[c] ያፈርሳሉ[d]።
