  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «እታገሣለሁ» የመከራን ጽናት፣ «በ… ያለው» ደግሞ የግሪኩን የኅብረት/ስፍራ አገላለጽ በቀላሉ ይጠብቃሉ።
