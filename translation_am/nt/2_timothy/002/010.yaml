  text: διὰ τοῦτο πάντα ὑπομένω διὰ τοὺς ἐκλεκτούς, ἵνα καὶ αὐτοὶ σωτηρίας τύχωσιν τῆς ἐν Χριστῷ Ἰησοῦ μετὰ δόξης αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/010.yaml
  text: For this reason I endure everything for the sake of the elect[c][b][a], so that they also may obtain the salvation that is in Messiah Jesus with eternal glory.
translation:
  language: am
  text: ስለዚህ ለተመረጡት[a] ስል ሁሉን እታገሣለሁ፤ እነርሱም ደግሞ በመሲሕ ኢየሱስ[b] ያለውን ድነት ከዘላለማዊ ክብር ጋር[c] እንዲያገኙ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ለተመረጡ ሰዎች»። የግሪኩ ቃል ἐκλεκτούς ነው።
    reason: lexical_alternative
  - marker: b
    text: በተለምዶ፣ «በክርስቶስ ኢየሱስ»።
    reason: alternative_reading
  - marker: c
    text: ወይም፣ «በመሲሕ ኢየሱስ ያለውን፣ ከዘላለማዊ ክብር ጋር የሚሆነውን ድነት»።
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ስለዚህ
  rationale: የቀደመውን አውድ የድርጊቱ ምክንያት አድርጎ ያመለክታል፤ «ስለዚህ» ይህን ምክንያታዊ ግንኙነት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: πάντα ὑπομένω
  choice: ሁሉን እታገሣለሁ
  rationale: πάντα ያለውን ሁሉን አቀፍ አጽንዖት ይጠብቃል፤ ὑπομένω በመከራ ሥር ጸንቶ መቆየትን የሚያመለክት ሲሆን «እታገሣለሁ» በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: διὰ τοὺς ἐκλεκτούς
  choice: ለተመረጡት ስል
  rationale: διά ከአኩዛቲቭ ጋር እዚህ ለሌሎች ጥቅም ብሎ መከራን መቀበልን ያሳያል። «ተመረጡት» የἐκλεκτούςን የመመረጥ ትርጉም ያለ ትምህርታዊ ማብራሪያ ይጠብቃል።
- source_word: ἵνα καὶ αὐτοὶ
  choice: ይህም እነርሱ ደግሞ … እንዲያገኙ ነው
  rationale: የἵναን ዓላማ በአማርኛ የዓላማ አንቀጽ ይገልጣል፤ «እነርሱ ደግሞ» የκαὶ αὐτοὶን ተጨማሪና አጽንዖታዊ ኃይል ይጠብቃል።
- source_word: σωτηρίας τύχωσιν
  choice: ድነት … እንዲያገኙ
  rationale: τυγχάνω ከጄኒቲቭ ጋር «ማግኘት/መቀበል» ማለት ነው። «ድነትን ማግኘት» ትርጉሙን በግልጽና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: በመሲሕ ኢየሱስ ያለውን
  rationale: የግሪኩ አንቀጽና ቅድመ አያያዥ ሐረግ «ድነት»ን ይገልጣሉ። «በ… ያለው» የጳውሎስን የἐν Χριστῷ አገላለጽ ሳይፈታ ይጠብቃል፤ Χριστός እዚህ እንደ ማዕረግ «መሲሕ» ተብሏል።
- source_word: μετὰ δόξης αἰωνίου
  choice: ከዘላለማዊ ክብር ጋር
  rationale: μετά ከጄኒቲቭ ጋር አብሮነትን ያመለክታል። ትርጉሙ ድነቱ ከዘላለማዊ ክብር ጋር እንደሚገኝ ያሳያል።
theological_decisions:
- issue: የἐκλεκτούς አተረጓጎም
  choice: ተመረጡት
  alternative: የተመረጡ ሰዎች
  rationale: ቃሉ የተመረጡትን በግልጽ ያመለክታል። ትርጉሙ የጽሑፉን የመመረጥ ቋንቋ ይጠብቃል እንጂ የአንድን ወገን የሥነ መለኮት ሥርዓት አያስገባም።
- issue: Χριστῷ እንደ ማዕረግ ወይም እንደ ስም መተርጎም
  choice: መሲሕ ኢየሱስ
  alternative: ክርስቶስ ኢየሱስ
  rationale: Χριστός የ«ተቀባ» ማዕረግ ትርጉሙን እዚህ ይዞ ስለሚገኝ «መሲሕ» ተመርጧል። ባህላዊው አገላለጽ በማስታወሻ ተጠብቋል።
- issue: μετὰ δόξης αἰωνίου ከየት ጋር እንደሚያያዝ
  choice: ድነቱ ከዘላለማዊ ክብር ጋር እንደሚገኝ
  alternative: «እንዲያገኙ» ከሚለው ግስ ጋር በቀጥታ ማያያዝ
  rationale: በአውዱ ሐረጉ በመሲሕ ኢየሱስ ያለውን ድነት የሚያጅበውን ዘላለማዊ ክብር በተፈጥሯዊነት ያመለክታል፤ ሆኖም የሰዋሰው ቅርጽ ከ«ማግኘት» ጋር በሰፊው ሊያያዝ የሚችል መሆኑ አልተደበቀም።
