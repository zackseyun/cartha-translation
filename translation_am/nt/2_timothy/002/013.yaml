lexical_decisions:
- source_word: ἀπιστοῦμεν
  choice: የማንታመን ብንሆንም
  rationale: ግሱ አለማመንንም ሆነ ታማኝ አለመሆንን ሊያመለክት ይችላል። «የማንታመን» ከሚቀጥለው «የታመነ» ጋር ያለውን የቃላት ንፅፅር ጠብቆ ሁለቱንም ፍቺዎች ክፍት ያደርጋል።
- source_word: πιστὸς
  choice: የታመነ
  rationale: «የታመነ» የታማኝነትንና የሚታመን መሆንን ያስተላልፋል፤ ከἀπιστοῦμεν ጋር ያለውን ሆን ተብሎ የተደረገ ንፅፅርም ይጠብቃል።
- source_word: μένει
  choice: ሆኖ ይኖራል
  rationale: ቀጣይነትንና የማይለወጥ ጽናትን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: ἀρνήσασθαι
  choice: ሊክድ
  rationale: የግሪኩን ጠንካራ ዝምድናዊና ሥነ ምግባራዊ ኃይል በቀጥታ የሚያስተላልፍ የአዲስ ኪዳን የተለመደ አቻ ነው።
- source_word: ἑαυτὸν
  choice: ራሱን
  rationale: ወደ «እርሱ» የሚመለሰውን አንጸባራቂ ተውላጠ ስም በቀጥታ ይተረጉማል።
- source_word: οὐ δύναται
  choice: አይችልም
  rationale: ፈቃደኛ አለመሆንን ብቻ ሳይሆን አለመቻልን በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: የሰው አለማመን ባለበት ጊዜ የእግዚአብሔር የታመነነት ትርጉም
  choice: እርሱ ራሱን ሊክድ ስለማይችል የታመነ ሆኖ እንደሚኖር መግለጽ፣ ይህ ታማኝነት በዋናነት ለማዳን፣ ተስፋዎቹን ለመፈጸም ወይም ለመፍረድ መሆኑን በዋናው ጽሑፍ አለመወሰን
  alternative: ይህን ወይም ድካማቸው ቢኖርም ሕዝቡን ለማዳን ያለው ታማኝነት ብቻ አድርጎ፣ ወይም ስለ ክህደት የተናገረውን የፍርድ ማስጠንቀቂያ ለመፈጸም ያለው ታማኝነት ብቻ አድርጎ መወሰን
  rationale: የግሪኩ ጽሑፍ መለኮታዊ ጽናትን ያረጋግጣል፣ ነገር ግን የእረኝነትና የሥነ መለኮት አንድምታውን በግልጽ አይወስንም። ትርጉሙ ይህን ውጥረት እንዳለ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩን ሁኔታዊ አረፍተ ነገርና በἀπιστοῦμεν/πιστός መካከል ያለውን የቃል ግንኙነት ለመጠበቅ ተሞክሯል።
