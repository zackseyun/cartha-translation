  text: Ταῦτα ὑπομίμνῃσκε, διαμαρτυρόμενος ἐνώπιον τοῦ ⸀κυρίου, μὴ λογομαχεῖν, ⸀ἐπ’ οὐδὲν χρήσιμον, ἐπὶ καταστροφῇ τῶν ἀκουόντων.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/014.yaml
  text: Keep reminding them of these things[a], solemnly charging them before the Lord not to quarrel about words[b], which is useful for nothing and leads to the ruin of those who hear.
translation:
  language: am
  text: እነዚህን ነገሮች ማሳሰብህን ቀጥል፤ በጌታ ፊት[a] ስለ ቃላት እንዳይከራከሩ አጥብቀህ እዘዛቸው። እንዲህ ያለው ክርክር ምንም ጥቅም የለውም[b]፤ የሚሰሙ ሰዎችንም ለጥፋት ይዳርጋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በጌታ ፊት” የሚለው ሐረግ ጌታ ኢየሱስን በተለይ ወይም በሰፊው እግዚአብሔርን ሳይለይ፣ በመለኮታዊ ምስክርነት ፊት መሆንን ሊያመለክት ይችላል።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ “ምንም ትርፍ አያስገኝም።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: እነዚህን ነገሮች
  rationale: የግሪኩን ገለልተኛ ብዙ ቁጥር አመልካችና ወደ ቀደመው ትምህርት የሚመልሰውን ኃይል ይጠብቃል።
- source_word: ὑπομίμνῃσκε
  choice: ማሳሰብህን ቀጥል
  rationale: የአሁን ጊዜ ትእዛዛዊው ቅርጽ ተደጋጋሚና ቀጣይ ድርጊትን ስለሚያመለክት በተፈጥሯዊ አማርኛ እንዲህ ተተርጉሟል።
- source_word: διαμαρτυρόμενος
  choice: አጥብቀህ እዘዛቸው
  rationale: ቃሉ በከባድ ምስክርነት ሥር የሚሰጥ ጥብቅ ማሳሰቢያ ወይም ትእዛዝ ያመለክታል፤ ተቀባዮቹም ከዐውዱ በግልጽ ተጨምረዋል።
- source_word: ἐνώπιον τοῦ κυρίου
  choice: በጌታ ፊት
  rationale: በመለኮታዊ ምስክርነትና ተጠያቂነት ሥር መናገርን የሚገልጠውን ፈሊጥ በአጭርና በተፈጥሯዊ መንገድ ያስተላልፋል።
- source_word: μὴ λογομαχεῖν
  choice: ስለ ቃላት እንዳይከራከሩ
  rationale: ሎγομαχέω በቃላት ዙሪያ የሚደረግን ከንቱና ጎጂ ክርክር ያመለክታል፤ ምርጫው ይህን አሉታዊ ትርጉም ያለ ከመጠን ትርጓሜ ይጠብቃል።
- source_word: ἐπ’ οὐδὲν χρήσιμον
  choice: ምንም ጥቅም የለውም
  rationale: ክርክሩ ፈጽሞ ጠቃሚ እንዳልሆነ በግልጽና በዘመናዊ አማርኛ ይገልጣል።
- source_word: ἐπὶ καταστροφῇ
  choice: ለጥፋት ይዳርጋል
  rationale: καταστροφή የሚያመለክተውን ከባድ መፍረስ ወይም ጥፋትና የውጤት ግንኙነቱን በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: τῶν ἀκουόντων
  choice: የሚሰሙትን
  rationale: በስም ተግባር የዋለውን የአሁን ጊዜ አንቀጽ ‘የሚሰሙ ሰዎች’ በሚል ተፈጥሯዊ አገላለጽ ያስተላልፋል።
theological_decisions:
- issue: የκύριος ተጠቃሽ
  choice: ጌታ
  alternative: እግዚአብሔር፤ ጌታ ኢየሱስ
  rationale: የግሪክ ጽሑፉ በግልጽ የሚለው ‘ጌታ’ ብቻ ነው። ዐውዱ በተለይ ኢየሱስን ወይም በሰፊው እግዚአብሔርን ሊያመለክት ቢችልም፣ ትርጉሙ ያልገለጸውን አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ረጅሙ የግሪክ ዓረፍተ ነገር ለንባብ ግልጽነት በሁለት ተከፍሏል፤ የምክንያትና የውጤት ግንኙነቱ ግን ተጠብቋል።
