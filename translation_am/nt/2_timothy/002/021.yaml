  text: ἐὰν οὖν τις ἐκκαθάρῃ ἑαυτὸν ἀπὸ τούτων, ἔσται σκεῦος εἰς τιμήν, ἡγιασμένον, ⸀εὔχρηστον τῷ δεσπότῃ, εἰς πᾶν ἔργον ἀγαθὸν ἡτοιμασμένον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/021.yaml
  text: Therefore[a], if anyone cleanses himself from these things, he will be a vessel for honor, sanctified, useful to the Master[b], prepared for every good work.
translation:
  language: am
  text: ስለዚህ ማንም ራሱን ከእነዚህ ቢያነጻ፣ ለክብር የሚውል[a]፣ የተቀደሰ[b]፣ ለጌታው ጠቃሚ የሆነና ለመልካም ሥራ ሁሉ የተዘጋጀ ዕቃ ይሆናል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለክቡር ጥቅም።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ቅዱስ የተደረገ” ወይም “ለቅዱስ ዓላማ የተለየ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: ስለዚህ ... ቢ-
  rationale: “ስለዚህ” የοὖνን ከቀደመው አሳብ ጋር ያለ የድምዳሜ ግንኙነት ያሳያል፤ የ“ቢ-” ሁኔታዊ አወቃቀርም የἐὰνን ‘if’ ኃይል በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τις
  choice: ማንም
  rationale: ያልተወሰነው ተውላጠ ስም ማንኛውንም ሰው በአጠቃላይ ያመለክታል፤ “ማንም” ይህን በግልጽ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἐκκαθάρῃ ἑαυτὸν ἀπὸ τούτων
  choice: ራሱን ከእነዚህ ቢያነጻ
  rationale: “ራሱን” ነጠላውን አንጸባራቂ ቅርጽ ይጠብቃል፤ “ከእነዚህ” ደግሞ ወደ ቀደመው አውድ የሚያመለክተውን ሆን ብሎ ሳይፈታ ይተዋል። “ቢያነጻ” የማጽዳትን ምስል ይጠብቃል።
- source_word: σκεῦος εἰς τιμήν
  choice: ለክብር የሚውል ... ዕቃ
  rationale: “ዕቃ” በቁጥር 20 የተጀመረውን የታላቅ ቤት ዕቃዎች ምሳሌ ይቀጥላል። “ለክብር የሚውል” ከ“ለውርደት” ጋር ያለውን ተቃርኖ እየጠበቀ በአማርኛ ተፈጥሯዊ ነው።
- source_word: ἡγιασμένον
  choice: የተቀደሰ
  rationale: የፍጹም ተገብሮ አጋኖ ቅርጹ ከቀደሰው ድርጊት የተነሣ ያለውን የተቀደሰ ሁኔታ ያሳያል፤ “የተቀደሰ” የቅድስናውን ቃላዊና መለኮታዊ ድምፀት ይጠብቃል።
- source_word: εὔχρηστον τῷ δεσπότῃ
  choice: ለጌታው ጠቃሚ የሆነ
  rationale: “ጠቃሚ” የεὔχρηστοςን ለአገልግሎት ብቁነት በግልጽ ሁኔታ ይገልጣል። “ጌታው” በቤት ምሳሌው ውስጥ ያለውን የሥልጣን ግንኙነት ይጠብቃል፣ ዋቢውንም ከጽሑፉ በላይ አይገድብም።
- source_word: εἰς πᾶν ἔργον ἀγαθὸν ἡτοιμασμένον
  choice: ለመልካም ሥራ ሁሉ የተዘጋጀ
  rationale: የπᾶνን ሙሉ ስፋት በ“ሁሉ” ይጠብቃል፤ “መልካም ሥራ” ደግሞ የἔργονን ሰፊ ትርጉም ከአንድ ድርጊት ጋር ሳያጠብ ያስተላልፋል።
theological_decisions:
- issue: ነጠላና አጠቃላይ የሆነውን የግሪክ አገላለጽ መተርጎም
  choice: ማንም ራሱን ... ቢያነጻ ... ይሆናል
  alternative: አንድ ሰው ራሱን ... ቢያነጻ ... ይሆናል
  rationale: የግሪኩ ነጠላ ቅርጽና አጠቃላይ ኃይል ተጠብቋል። አማርኛው “ራሱን” ሥርዓተ ፆታን ሳያጎላ ነጠላውን አንጸባራቂ ግንኙነት በተፈጥሮ ያሳያል።
- issue: δεσπότηςን በቤት ዕቃ ምሳሌ ውስጥ መተርጎም
  choice: ጌታው
  alternative: ባለቤቱ
  rationale: “ጌታው” የδεσπότηςን የሥልጣን ትርጉምና የቤት ምሳሌውን በአንድነት ይጠብቃል። “ባለቤቱ” የባለቤትነትን ገጽታ ያጎላል፣ ነገር ግን የጌትነትን ድምፀት ሊያሳንስ ይችላል።
- issue: ἡγιασμένον የሚያመለክተው የቅድስና ሁኔታ
  choice: የተቀደሰ
  alternative: ለቅዱስ ዓላማ የተለየ
  rationale: ዋናው ትርጉም የግሪኩን የቅድስና ቃላዊ ግንኙነትና ከተፈጸመ ድርጊት የተነሣውን ሁኔታ ይጠብቃል። “የተለየ” ተግባራዊ ገጽታውን ይገልጣል፣ ግን ትርጉሙን ሊያጠብ ይችላል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ የሚገባ አማርኛን ይጠቀማል። የቤት ዕቃው ምሳሌ በ“ዕቃ” እና “ጌታው” ተጠብቋል። የማጣቀሻ ምልክቶቹ ከሚመለከታቸው ሐረጎች በኋላ ተቀምጠዋል፤ ይህም በቀረበው የእንግሊዝኛ ማማከሪያ ውስጥ ካለው የምልክትና የማስታወሻ አለመጣጣም ይልቅ የእያንዳንዱን አማራጭ ትክክለኛ ቦታ ይከተላል።
