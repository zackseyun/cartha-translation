lexical_decisions:
- source_word: βεβήλους
  choice: ርኩስ
  rationale: ቃሉ ከተቀደሰው ተቃራኒ የሆነውን፣ ቅድስና የጎደለውንና እግዚአብሔርን የማያከብረውን ያመለክታል። ‘ርኩስ’ ይህን ሃይማኖታዊና ሥነ ምግባራዊ ክብደት ይጠብቃል።
- source_word: κενοφωνίας
  choice: ከንቱ ንግግር
  rationale: ቃሉ በቀጥታ ይዘትና ጥቅም የሌለውን ባዶ ንግግር ያመለክታል፤ ‘ከንቱ ንግግር’ በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: περιΐστασο
  choice: ራቅ
  rationale: የትእዛዝ ቅርጹ ጢሞቴዎስ ከእንዲህ ያለ ንግግር እንዲርቅና እንዳይሳተፍበት ያዛል።
- source_word: ἐπὶ πλεῖον
  choice: ይበልጥ
  rationale: ወደ ከፋ ደረጃ የሚቀጥል እድገትን ያሳያል፤ ‘ይበልጥ’ ይህን መጨመር በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: προκόψουσιν
  choice: ይገፋሉ
  rationale: ቃሉ ወደፊት መራመድን ወይም መግፋትን ያመለክታል፤ እዚህ አሉታዊ የሥነ ምግባር አቅጣጫ ስላለው ‘ይገፋሉ’ ተገቢ ነው።
- source_word: ἀσεβείας
  choice: እግዚአብሔርን አለማክበር
  rationale: ቃሉ ለእግዚአብሔር ክብርና ፍርሃት የሌለውን አኗኗር ያመለክታል። ይህ አተረጓጎም ‘አምላክ የለሽነት’ እንደሚለው አምላክን መካድ ብቻ ሳይመስል ሰፊውን የቃሉን ሐሳብ ያስተላልፋል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከቀደመው ምክር ጋር ያለውን ንጽጽር በግልጽ ያሳያል።
theological_decisions:
- issue: ንግግሩ ጥቅም የሌለው ብቻ ነው ወይስ ቅድስናንም የሚጻረር ነው?
  choice: ‘ርኩስና ከንቱ ንግግር’ ተብሎ ሁለቱም ገጽታዎች ተጠብቀዋል።
  alternative: ‘ባዶ ወሬ’ ወይም ‘እግዚአብሔርን የማያከብር ወሬ’
  rationale: βεβήλους የንግግሩን ርኩሰትና አክብሮት ማጣት፣ κενοφωνίας ደግሞ ከንቱነቱን ያሳያል፤ አንዱን ብቻ ማስቀረት የምንጩን ሙሉ ክብደት ያሳንሳል።
- issue: በπροκόψουσιν የተጠቀሰው ብዙ ቁጥር ማንን ያመለክታል?
  choice: በንግግሩ የሚሳተፉትን ሰዎች እንደሚያመለክት ‘በዚህ የሚሳተፉት’ ተብሎ ተገልጿል።
  alternative: ‘እነርሱ ይበልጥ ይገፋሉ’ ብሎ ተውላጠ ስሙን ብቻ መጠቀም
  rationale: የግሪክ ግሱ ብዙ ቁጥር ቢሆንም በአማርኛ ‘እነርሱ’ ብቻ ማለት አመልካቹን ግልጽ አያደርግም። የአውዱን ሰዎች በአጭሩ መግለጽ ትርጉሙን ሳይለውጥ ግልጽነትን ያመጣል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። ‘ለፍለፋ’ ከዋናው ጽሑፍ ይልቅ በአማራጭ ማስታወሻ ውስጥ ተቀምጧል፣ ምክንያቱም ትንሽ የዝቅተኛ የንግግር መዝገብ ስሜት ሊኖረው ይችላል።
