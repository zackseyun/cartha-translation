  text: ነገር ግን እግዚአብሔርን የማያከብር ከንቱ ንግግርን[a] ራቅ፤ ምክንያቱም እነርሱ ወደ ይበልጥ እግዚአብሔርን ወደ አለማክበር ይገፋሉና።
