  rationale: በግሪክኛው ተውላጠ ስሙ በግልጽ መጠቀሱ አጽንዖትና ከቀደመው ንግግር ጋር ንጽጽር ያሳያል፤ «አንተ» ይህን ኃይል ይጠብቃል።
- source_word: οὖν
