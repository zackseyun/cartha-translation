lexical_decisions:
- source_word: ἀληθείας
  choice: እውነት
  rationale: የግሪኩን ‘እውነት’ የሚለውን ሰፊ ትርጉም ይጠብቃል፤ በአማርኛ የተወሰነነቱ ከአገባቡ በተፈጥሮ ይታወቃል።
- source_word: ἀκοὴν
  choice: መስማታቸውን
  rationale: ‘የመስማት ተግባራቸውን/ችሎታቸውን’ የሚለውን የግሪኩን ቀጥተኛ ምስል ይጠብቃል፤ ‘ጆሮአቸውን’ የተፈቀደ ፈሊጣዊ አማራጭ ነው።
- source_word: ἀποστρέψουσιν
  choice: ያዞራሉ
  rationale: ሆን ብሎ ከአንድ ነገር መመለስን የሚያሳየውን ንቁ ድርጊትና የአቅጣጫ ምስል ይጠብቃል።
- source_word: μύθους
  choice: ተረቶች
  rationale: በዚህ አገባብ ከእውነት ጋር የተቃረኑ የተፈበረኩ ወይም ግምታዊ ታሪኮችን በዘመናዊና ተረዥ ቋንቋ ያመለክታል።
- source_word: ἐκτραπήσονται
  choice: ዘወር ይላሉ
  rationale: የግሪኩን መካከለኛ/ተደራጊ ቅርጽ ያለገደብ በተፈጥሯዊ ኢ-ተሻጋሪ አገላለጽ ይመልሳል፤ የድርጊቱን አካሄድ አይወስንም።
- source_word: ἀπὸ μὲν ... ἐπὶ δὲ
  choice: ከ...፤ ወደ...ም
  rationale: ከእውነት መራቅና ወደ ተረቶች መዞር ያለውን ተቃርኖና አቅጣጫ በተፈጥሯዊ የአማርኛ ቅንብር ይጠብቃል።
theological_decisions:
- issue: በአገባቡ ውስጥ ‘እውነት’ የሚያመለክተው
  choice: እውነት
  alternative: ትክክለኛ ትምህርት / የወንጌል እውነት
  rationale: አገባቡ የሐዋርያትን ትምህርት በጽኑ ቢያመለክትም፣ ጥቅሱ ራሱ ሰፊውን ‘እውነት’ የሚለውን ቃል ይጠቀማል። ትርጉሙ ይህን ስፋት አያጠብም።
