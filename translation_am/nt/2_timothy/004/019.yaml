  source_fidelity: The imperative and the three coordinated recipients are represented accurately. However, Ὀνησιφόρου is more faithfully rendered by the direct transliteration «ኦኔሲፎሮስ» than «አናሲፎሮስ».
  naturalness: «… ሰላም በላቸው» is a natural modern Amharic epistolary imperative. «ቤተሰብ» naturally conveys οἶκος here as the people of the household.
  terminology: «ጵርስቃ» appropriately preserves the source form Prisca rather than substituting Priscilla; «አቂላ» is suitable. The alternative-name footnote must be anchored to Prisca, the name it explains, rather than Aquila.
  issues:
