  text: Greet Prisca and Aquila[a], and the household of Onesiphorus.
translation:
  language: am
  text: ጵርስቃን[a] እና አቂላን፣ እንዲሁም የኦኔሲፎሮስን ቤተሰብ ሰላም በላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክኛው “ጵርስቃ” ይላል፤ በሌሎች ስፍራዎች “ጵርስቅላ” ተብላም ትጠራለች (ለምሳሌ፣ የሐዋርያት ሥራ 18፥2፣ 18፣ 26)።
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄσπασαι
  choice: ሰላም በላቸው
  rationale: የግሪኩን የትእዛዝ ኃይል በተፈጥሯዊና በዘመናዊ አማርኛ ያስተላልፋል፤ በግሱ ውስጥ በግልጽ ያልተገለጸ ተጨማሪ ስሜት አይጨምርም።
- source_word: Πρίσκαν
  choice: ጵርስቃን
  rationale: በዚህ ጥቅስ ያለውን Πρίσκαν (Prisca) የሚከተል የስም አጻጻፍ ነው፤ በሌሎች ስፍራዎች የሚገኘውን ጵርስቅላ የሚለውን ቅጽ በዋናው ጽሑፍ አይተካም።
- source_word: Ἀκύλαν
  choice: አቂላን
  rationale: የግሪኩን የግል ስም Ἀκύλας በተለመደው የአማርኛ ቅጽ ያቀርባል።
- source_word: τὸν Ὀνησιφόρου οἶκον
  choice: የአናሲፎሮስንም ቤተ ሰብ
  rationale: οἶκος ቤትን፣ ቤተ ሰብን ወይም በቤቱ የተያያዙትን ሰዎች ሊያመለክት ይችላል። በሰላምታ አውድ ‘ቤተ ሰብ’ ሕንፃውን ሳይሆን ሰዎቹን በተፈጥሯዊ አማርኛ ያመለክታል፤ የደም ዘመዶችን ብቻ እንደሚጨምርም አይገድበውም።
