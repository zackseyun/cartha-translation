lexical_decisions:
- source_word: Τυχικὸν
  choice: ቲኪቆስን
  rationale: የሰው ስም ስለሆነ በተለመደው የአማርኛ አጻጻፍ ተገልብጧል፤ የተሳቢ ምልክት -ን ተጨምሯል።
- source_word: δὲ
  choice: ግን
  rationale: δέ ቀላል ንጽጽርን ወይም ከቀደመው ነገር ወደ ቀጣዩ ሐሳብ መሸጋገርን ሊያመለክት ይችላል፤ ‘ግን’ የንጽጽሩን ፍንጭ ይጠብቃል።
- source_word: ἀπέστειλα
  choice: ላክሁት
  rationale: የአንደኛ መደብ ነጠላ ቀላል ያለፈ ጊዜ ግስ ነው፤ ‘ላክሁት’ በአማርኛ ተፈጥሯዊ ሲሆን ቲኪቆስን እንደ ተሳቢ በግስ ውስጥም ያመለክታል።
- source_word: εἰς
  choice: ወደ
  rationale: ከከተማ ስም ጋር የመድረሻ አቅጣጫን በተፈጥሯዊ አማርኛ ያመለክታል።
- source_word: Ἔφεσον
  choice: ኤፌሶን
  rationale: የቦታው ስም በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም በተለመደው መልክ ተገልብጧል።
