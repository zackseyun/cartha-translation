base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/005.yaml
  text: But as for you[a], keep a clear head in all things, endure hardship, do the work of an evangelist[c][b], fully carry out your ministry.
translation:
  language: am
  text: አንተ ግን በሁሉም ነገር አእምሮህን ጠብቅ፤[a] መከራን ታገሥ፤[b] የወንጌል ሰባኪ ሥራ ሥራ፤ አገልግሎትህን ሙሉ በሙሉ ፈጽም።[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በሁሉም ነገር ንቁ ሁን» ወይም «አእምሮህ የጠራ ይሁን»። የግሪኩ ግስ በቃል ደረጃ «ከስካር ነጻ ሁን» ማለት ቢሆንም፣ በአዲስ ኪዳን በምሳሌያዊ ሁኔታ የአእምሮ ንቃትን፣ ራስን መግዛትንና በጫና ውስጥ መረጋጋትን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «መከራን ተቀበል»።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ «አገልግሎትህን አሟላ»። የግሪኩ ግስ አንድን ተግባር በሙላት ወደ ፍጻሜ ማድረስን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: አንተ ግን
  rationale: የግል ተውላጠ ስሙ አጽንዖትን፣ δὲ ደግሞ ከቀደመው ሐሳብ ጋር ያለውን ንጽጽር ያሳያል።
- source_word: νῆφε ἐν πᾶσιν
  choice: በሁሉም ነገር አእምሮህን ጠብቅ
  rationale: ግሱ በቃል ደረጃ ከስካር ነጻ መሆንን ቢያመለክትም፣ እዚህ በምሳሌያዊ አጠቃቀም የአእምሮ ንቃትን፣ ራስን መግዛትንና በጫና ውስጥ መረጋጋትን ያመለክታል፤ ἐν πᾶσιν የትእዛዙን ሁሉን አቀፍነት ይጠብቃል።
- source_word: κακοπάθησον
  choice: መከራን ታገሥ
  rationale: በመከራ ውስጥ መጽናትንና መታገሥን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἔργον ποίησον εὐαγγελιστοῦ
  choice: የወንጌል ሰባኪን ሥራ ሥራ
  rationale: εὐαγγελιστής የምሥራቹን ወንጌል የሚያውጅን ሰው ያመለክታል፤ ይህ አተረጓጎም ትእዛዙን ግልጽና ቀጥተኛ ያደርገዋል።
- source_word: τὴν διακονίαν σου πληροφόρησον
  choice: አገልግሎትህን ሙሉ በሙሉ ፈጽም
  rationale: διακονία በዐውዱ ለጢሞቴዎስ የተሰጠውን የወንጌል አገልግሎት ያመለክታል፤ πληροφόρησον ደግሞ ወደ ሙሉ ፍጻሜ ማድረስን ያሳያል።
theological_decisions:
- issue: የδιακονία ወሰን
  choice: አገልግሎትህ
  alternative: አገልጋይነትህ / የተሰጠህን ተግባር
  rationale: በቅርብ ዐውድ የጢሞቴዎስን የወንጌል ሥራና የተሰጠውን ኃላፊነት ስለሚመለከት፣ «አገልግሎት» ከአጠቃላይ አገልጋይነት ይልቅ ዐውዱን በትክክል ይይዛል፤ የተለየ የእምነት ቡድን ሥርዓትን አያስገባም።
- issue: የπληροφόρησον ኃይል
  choice: ሙሉ በሙሉ ፈጽም
  alternative: አሟላ / ወደ ፍጻሜ አድርስ
  rationale: ግሱ አገልግሎቱን በሙላት መፈጸምን ያመለክታል፤ ይህ አተረጓጎም ትንቢት መፈጸም የሚመስል ያልተፈለገ ትርጉምን ያስወግዳል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ የአማርኛ አገላለጽ ተጠቅሟል። የአጭር ተከታታይ ትእዛዞች ኃይል በሰረዝ-ነጥብ ተጠብቋል።
