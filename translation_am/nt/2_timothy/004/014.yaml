  text: Ἀλέξανδρος ὁ χαλκεὺς πολλά μοι κακὰ ἐνεδείξατο— ⸀ἀποδώσει αὐτῷ ὁ κύριος κατὰ τὰ ἔργα αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/014.yaml
  text: Alexander the metalworker showed me many evils[c][b][a]; the Lord will repay him according to his works.
translation:
  language: am
  text: ብረት ሠሪው እስክንድር[a] ብዙ ክፉ ነገር አደረገብኝ፤[b] ጌታ እንደ ሥራው ይከፍለዋል።[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “መዳብ ሠሪው እስክንድር።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ብዙ ጉዳት አደረሰብኝ።”
    reason: lexical_alternative
  - marker: c
    text: አንዳንድ የእጅ ጽሑፎች፣ “ጌታ እንደ ሥራው ይክፈለው” ይላሉ።
    reason: textual_variant
lexical_decisions:
- source_word: χαλκεὺς
  choice: ብረት ሠሪ
  rationale: ቃሉ በተለይ መዳብን ወይም ነሐስን የሚሠራ ሰውን ሊያመለክት ቢችልም፣ የብረት ዓይነቱን ከጽሑፉ በላይ እንዳይወስን “ብረት ሠሪ” የሚለው ሰፊና ግልጽ አገላለጽ ተመርጧል።
- source_word: πολλά μοι κακὰ ἐνεδείξατο
  choice: ብዙ ክፉ ነገር አደረገብኝ
  rationale: የግሪኩን “ብዙ ክፉ ነገሮች” የሚለውን ይዘት ጠብቆ፣ ἐνεδείξατο በዚህ አውድ በአማርኛ ተፈጥሯዊ በሆነ “አደረገብኝ” ተተርጉሟል። “አሳየኝ” የሚለው ቀጥተኛ አገላለጽ በአማርኛ የዓይን ማሳየትን ሊያስመስል ይችላል።
- source_word: ἀποδώσει
  choice: ይከፍለዋል
  rationale: የወደፊት አመልካች ቅርጹን እና የብድራት ፍርድ ሐሳቡን የሚጠብቅ ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
- source_word: ὁ κύριος
  choice: ጌታ
  rationale: የተወሰነውን መለኮታዊ ማዕረግ በተለመደውና በግልጽ የአማርኛ ቃል ይገልጻል።
- source_word: κατὰ τὰ ἔργα αὐτοῦ
  choice: እንደ ሥራው
  rationale: የበቀል ወይም የፍርድ መጠኑ በሰውየው ሥራ መሠረት መሆኑን በቅርብና በተለመደ አገላለጽ ያስተላልፋል።
theological_decisions:
- issue: ἀποδώσει እንደ ምኞት/ጸሎት ወይስ እንደ ወደፊት እርግጠኛ ንግግር መተርጎም
  choice: ጌታ ... ይከፍለዋል
  alternative: ጌታ ... ይክፈለው
  rationale: በዋናው የግሪክ ጽሑፍ ἀποδώσει የወደፊት አመልካች ነው፤ ስለዚህ ዋናው ጽሑፍ የመለኮታዊ ብድራት እርግጠኛ መግለጫ አድርጎ ያቀርበዋል። በአንዳንድ የእጅ ጽሑፎች የሚገኘው የምኞት ንባብ በማስታወሻ ተጠብቋል።
translation_notes:
