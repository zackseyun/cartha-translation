  text: Δημᾶς γάρ με ⸀ἐγκατέλιπεν ἀγαπήσας τὸν νῦν αἰῶνα, καὶ ἐπορεύθη εἰς Θεσσαλονίκην, Κρήσκης εἰς Γαλατίαν, Τίτος εἰς Δαλματίαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/010.yaml
  text: For Demas deserted me[a], having loved the present age, and went to Thessalonica; Crescens to Galatia, Titus to Dalmatia.
translation:
  language: am
  text: ዴማስ ይህን ዘመን[a] ወዶ እኔን ጥሎ ወደ ተሰሎንቄ ሄዷልና፤ ቅሬስቄስ ወደ ገላትያ ሄደ፣ ቲቶስም ወደ ደልማጥያ ሄደ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ «የአሁኑን ዓለም»። የግሪኩ ቃል በቀጥታ የአሁኑን ዘመን ወይም የዘመኑን ዓለም ሥርዓት ያመለክታል።
    reason: τὸν νῦν αἰῶνα ለሚለው የግሪክ ሐረግ የሚቻለውን አማራጭ ፍቺ ለማሳየት።
lexical_decisions:
- source_word: ἐγκατέλιπεν
  choice: ጥሎኝ
  rationale: ግሱ ጳውሎስን ወደኋላ ትቶ መሄድንና በዐውዱ ያለውን የታማኝነት ጉድለት ያሳያል፤ «ጥሎኝ» በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን ከጽሑፉ በላይ ክህደትን አያስገባም።
- source_word: ἀγαπήσας
  choice: ወዶ
  rationale: የግሪኩን አሳታፊ ግስ ቅርጽና በፍቅሩና በመተዉ መካከል ያለውን ግንኙነት ይጠብቃል፤ በግልጽ ሁኔታ «ስለወደደ» ብሎ ምክንያታዊነቱን ከምንጩ ይልቅ አያጠናክርም።
- source_word: τὸν νῦν αἰῶνα
  choice: ይህን ዘመን
  rationale: αἰών በዋናነት የጊዜና የሥነ ምግባር ዘመንን ያመለክታል፤ «ዘመን» የቁሳዊውን ዓለም ብቻ ከማመልከት ይልቅ ይህን ፍቺ ይጠብቃል።
- source_word: ἐπορεύθη
  choice: ሄዷል / ሄደዋል
  rationale: ቀላል የመንቀሳቀስ ግስ ስለሆነ ተፈጥሯዊው «ሄደ» ተመርጧል። በሁለተኛው ሐረግ በግሪኩ የተዘለለው ግስ ለአማርኛ ግልጽነት ተደግሟል።
- source_word: γάρ
  choice: -ና
  rationale: ከቀደመው ንግግር ጋር ያለውን ገላጭ ወይም ምክንያታዊ ትስስር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Θεσσαλονίκην; Κρήσκης; Γαλατίαν; Τίτος; Δαλματίαν
  choice: ተሰሎንቄ፤ ቅሬስቄስ፤ ገላትያ፤ ቲቶስ፤ ደልማጥያ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመዱ የስምና የቦታ ቅርጾች ተጠቅመዋል።
theological_decisions:
- issue: የዴማስ መሄድ እምነትን ፈጽሞ መካድ እንደሆነ መግለጽ አለመግለጽ
  choice: «ጥሎኝ» በማለት ድርጊቱ ያለውን አሉታዊና ታማኝነት የጎደለው ገጽታ ማሳየት፣ ነገር ግን እምነቱን ፈጽሞ እንደካደ አለመጨመር
  alternative: «ካደኝ» ወይም በግልጽ ክህደተ እምነትን የሚያመለክት ትርጉም
  rationale: ጽሑፉ ዴማስ ይህን ዘመን ወዶ ጳውሎስን እንደተወ ይናገራል፤ የመጨረሻ ክህደተ እምነት እንደፈጸመ ግን በቀጥታ አይናገርም።
