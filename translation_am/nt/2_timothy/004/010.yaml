  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ አማርኛ ተጠቅሟል። «ይህን ዘመን» የምንጩን ጊዜያዊ-ሥነ ምግባራዊ ፍቺ ይጠብቃል፤ ዓለም የሚለውን አማራጭ በዋናው ጽሑፍ አያስገባም።
