  text: Ἐγὼ γὰρ ἤδη σπένδομαι, καὶ ὁ καιρὸς τῆς ⸂ἀναλύσεώς μου⸃ ἐφέστηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/006.yaml
  text: For I am already being poured out as a drink offering[b][a], and the time of my departure has come.
translation:
  language: am
  text: እኔ አስቀድሞውኑ እንደ መጠጥ መሥዋዕት እየፈሰስኩ ነውና፤[a] የመለየቴም ጊዜ ደርሷል።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ «እየፈሰስኩ ነው»። የግሪኩ ግስ በመሥዋዕት ላይ የሚፈስስን የመጠጥ መሥዋዕት ምስል ያስነሳል።
    reason: lexical_alternative
  - marker: b
    text: «የመፈታቴ» ወይም «የመለቀቄ» ተብሎም ሊተረጎም ይችላል። እዚህ «መለየት» ሞትን በምሳሌ ይገልጻል።
    reason: alternative_reading
lexical_decisions:
- source_word: σπένδομαι
  choice: እንደ መጠጥ መባ እየፈሰስኩ ነው
  rationale: ግሱ መጠጥ መባን ማፍሰስ የሚያሳየውን የመሥዋዕት ምስል ይዟል፤ በዚህ አውድ ጳውሎስ የቀረበውን ሞቱን በዚህ ምስል ይገልጻል።
- source_word: ἤδη
  choice: አሁን
  rationale: ድርጊቱ አስቀድሞ በመካሄድ ላይ መሆኑንና ሞቱ መቅረቡን ያሳያል።
- source_word: καιρός
  choice: ጊዜ
  rationale: በአውዱ የወሰነ ወይም የደረሰ ጊዜን ያመለክታል፤ የዐማርኛው ሐረግ ይህን በተፈጥሮ ያስተላልፋል።
- source_word: ἀναλύσεώς
  choice: መሄጃዬ
  rationale: ቃሉ መሄድን፣ መፈታትን ወይም መለቀቅን ሊያመለክት ይችላል። «መሄጃዬ» እዚህ ለሞት የቀረበውን ምስላዊ አነጋገር በተፈጥሮ ይጠብቃል።
- source_word: ἐφέστηκεν
  choice: ደርሷል
  rationale: ፍጹም ጊዜው ጊዜው መጥቶ አሁን በደጅ መሆኑን ያሳያል፤ «ደርሷል» ይህን የአሁን ሁኔታ ይገልጻል።
- source_word: γὰρ
  choice: -ና
  rationale: ከቀደመው አሳብ ጋር ያለውን ምክንያታዊና ማብራሪያዊ ግንኙነት በተፈጥሯዊ ዐማርኛ ይገልጻል።
theological_decisions:
- issue: ጳውሎስ ሞቱን በምሳሌያዊ ቋንቋ መግለጹ
  choice: የቀረበው ሞት እንደ መጠጥ መባ መፍሰስና እንደ መሄድ ተገልጿል።
  alternative: ንግግሩን «ልሞት ነው» ብሎ በቀጥታ መተርጎም፣ ወይም እንደ አጠቃላይ መከራ ብቻ መረዳት።
  rationale: σπένδομαι እና ἀνάλυσις በአንድነት የጳውሎስን ቅርብ ሞት በጠንካራ ሁኔታ ያመለክታሉ፤ ትርጉሙ ግን ምስሎቹን በቀጥተኛ ትርጓሜ አልተካም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ ዐማርኛን ይጠቀማል። «መጠጥ መባ» የመሥዋዕት ምስሉን ግልጽ ያደርጋል፤ «መሄጃዬ» ደግሞ የግሪኩን ሆን ተብሎ የተጠበቀ ምሳሌያዊ ስፋት ያቆያል።
