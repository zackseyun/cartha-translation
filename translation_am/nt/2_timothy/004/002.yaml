  text: Preach the word[a]; be ready in season and out of season; reprove, rebuke, exhort[c][b], with all patience and teaching.
translation:
  language: am
  text: 'ቃሉን[a] ስበክ፤ ጊዜው አመቺም ሆነ አመቺ ባይሆን[b] ዝግጁ ሁን፤ ውቀስ፣ ገሥጽ፣ አጥብቀህ ምከር[c]፤ ይህንም በፍጹም ትዕግሥትና በማስተማር አድርግ።


    [a] “ቃሉን” የሚለው “መልእክቱን” ተብሎም ሊተረጎም ይችላል።


    [b] “ጊዜው አመቺም ሆነ አመቺ ባይሆን” የሚለው “ጊዜው የሚመችም የማይመችም ቢሆን” ማለት ነው። “ዝግጁ ሁን” የሚለውም “በቦታው ተገኝ” ወይም “ጉዳዩን በአስቸኳይ ያዝ” የሚል ሐሳብ ሊያመለክት ይችላል።


    [c] “አበረታታ” ወይም “አጥብቀህ አሳስብ” ተብሎም ሊተረጎም ይችላል።'
  philosophy: optimal-equivalence
  footnotes:
