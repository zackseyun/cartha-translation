base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/013.yaml
  text: When you come[a], bring the cloak that I left in Troas with Carpus, and the books[b], especially the parchments.
translation:
  language: am
  text: ስትመጣ፣ በጢሮአዳ በቀርጶስ ዘንድ የተውሁትን ካባ[b]፣ መጻሕፍቱንም[a]፣ በተለይም ብራናዎቹን ይዘህ ና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ጥቅልሎቹን»፤ የግሪኩ ቃል የተጻፉ ጥቅልሎችን ወይም ተመሳሳይ የጽሑፍ ቁሳቁሶችን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: አንዳንዶች «ካባ» የሚለውን ለመጻሕፍት መያዣ ወይም መጠቅለያ እንደሚያመለክት ይረዱታል፤ ይሁን እንጂ የግሪኩ ቃል የተለመደ ትርጉም የላይ ልብስ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: φαιλόνην
  choice: ካባ
  rationale: ቃሉ በተለምዶ የላይ ልብስን ወይም ካባን ያመለክታል፤ ከዘመናዊ አማርኛ አንጻር «ካባ» ተፈጥሯዊና ግልጽ ነው።
- source_word: ἀπέλιπον
  choice: የተውሁትን
  rationale: የመጀመሪያ መደብ ነጠላ ያለፈ ድርጊትን፣ ማለትም «የተውሁትን» የሚለውን ቀጥተኛ ትርጉም ያስተላልፋል።
- source_word: παρὰ Κάρπῳ
  choice: ከቀርጶስ ዘንድ
  rationale: παρά ከዳቲቭ ጋር እቃው በቀርጶስ እንክብካቤ ወይም በእሱ ቤት እንደነበረ ያመለክታል፤ «ከ...ዘንድ» ይህን ሳያጠብ ያቀርባል።
- source_word: ἐρχόμενος
  choice: ስትመጣ
  rationale: ተሳቢው ከትእዛዙ ጋር ያለውን ጊዜያዊ ግንኙነት በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: φέρε
  choice: ይዘህ ና
  rationale: የግሪክ ትእዛዝ «አምጣ» ማለት ነው፤ «ይዘህ ና» ከመምጣቱ አውድ ጋር የሚስማማ ዘመናዊና ተፈጥሯዊ አገላለጽ ነው።
- source_word: τὰ βιβλία
  choice: መጻሕፍቱን
  rationale: βιβλία መጻሕፍትን ወይም ጥቅልሎችን ሊያመለክት ይችላል፤ «መጻሕፍቱን» ሰፊና የተለመደ ትርጉም ሲሆን የአካላዊ ቅርጹ አሻሚነት በማስታወሻ ተጠብቋል።
- source_word: μάλιστα
  choice: በተለይም
  rationale: ቀጥሎ ለተጠቀሱት ብራናዎች የተሰጠውን ልዩ አጽንዖት በግልጽ ያስተላልፋል።
- source_word: τὰς μεμβράνας
  choice: ብራናዎቹን
  rationale: μεμβράνα ከተዘጋጀ የእንስሳ ቆዳ የተሠራ የመጻፊያ ቁሳቁስን ያመለክታል፤ «ብራና» ትክክለኛውና የተለመደው አማርኛ ቃል ነው።
