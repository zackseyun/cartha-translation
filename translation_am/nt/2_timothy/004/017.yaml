source:
  edition: SBLGNT
  text: ὁ δὲ κύριός μοι παρέστη καὶ ἐνεδυνάμωσέν με, ἵνα δι’ ἐμοῦ τὸ κήρυγμα πληροφορηθῇ καὶ ⸀ἀκούσωσιν πάντα τὰ ἔθνη, καὶ ἐρρύσθην ἐκ στόματος λέοντος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/017.yaml
  text: But the Lord stood by me and strengthened me[a], so that through me the proclamation might be fully accomplished and all the Gentiles might hear[b], and I was rescued from the lion’s mouth.
translation:
  language: am
  text: ጌታ ግን ከጎኔ ቆመ፣ ኃይልም ሰጠኝ፤ ይህም በእኔ በኩል ስብከቱ ሙሉ በሙሉ እንዲፈጸምና አሕዛብ ሁሉ[a] እንዲሰሙ ነው። ከአንበሳ አፍም[b] ተዳንሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም «ሕዝቦች ሁሉ»። ἔθνη የሚለው የግሪክ ቃል «አሕዛብ» ወይም «ሕዝቦች» ማለት ይችላል፤ በዚህ ስፍራ የምሥራቹን ቃል የሚሰሙ አይሁድ ያልሆኑ ሕዝቦችን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: «ከአንበሳ አፍ» የሚለው እውነተኛ አንበሳን ከማመልከት ይልቅ ከገዳይ አደጋ መዳንን የሚገልጽ ምሳሌያዊ አነጋገር ሊሆን ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ κύριός
  choice: ጌታ ግን
  rationale: κύριος የሚለውን ያለ ተጨማሪ ትርጓሜ «ጌታ» ብሎ ያቀርባል፤ δέ ደግሞ ከቀደመው ሐሳብ ጋር ያለውን ንጽጽር «ግን» በማለት ያሳያል።
- source_word: μοι παρέστη
  choice: ከጎኔ ቆመ
  rationale: ተራ ስፍራዊ መገኘትን ብቻ ሳይሆን ለመርዳትና ለመደገፍ አብሮ መቆምን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐνεδυνάμωσέν με
  choice: ኃይልም ሰጠኝ
  rationale: ጥንካሬን ወይም ኃይልን መስጠት የሚለውን ፍቺ ግልጽና ወቅታዊ በሆነ አማርኛ ያስተላልፋል።
- source_word: ἵνα δι’ ἐμοῦ
  choice: ይህም በእኔ በኩል … እንዲ… ነው
  rationale: ἵνα የሚያሳየውን ዓላማ እና διά የሚያሳየውን መሣሪያዊ ወኪልነት በተፈጥሯዊ የአማርኛ አወቃቀር ይጠብቃል።
- source_word: τὸ κήρυγμα
  choice: ስብከቱ
  rationale: የታወጀውን መልእክትና የማወጁን ተግባር ከዐውዱ ጋር በሚስማማ አጭር ቃል ያቀርባል።
- source_word: πληροφορηθῇ
  choice: ሙሉ በሙሉ እንዲፈጸም
  rationale: ስብከቱ ወደ ሙሉ አፈጻጸሙ እንዲደርስ የሚለውን ሰፊ ፍቺ ይጠብቃል፤ «ሙሉ በሙሉ እንዲሰበክ» ብሎ በአንድ ፍቺ ብቻ አይወስነውም።
- source_word: πάντα τὰ ἔθνη
  choice: አሕዛብ ሁሉ
  rationale: በጳውሎስ የተልእኮ ዐውድ ውስጥ አይሁድ ያልሆኑትን ሕዝቦች የሚያመለክተውን አብይ ፍቺ ያስተላልፋል፤ «ሕዝቦች ሁሉ» የሚለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ἐρρύσθην
  choice: ዳንሁ
  rationale: ከአደጋ መታደግን በአጭር፣ ተፈጥሯዊና ክብር ባለው አማርኛ ይገልጣል።
- source_word: ἐκ στόματος λέοντος
  choice: ከአንበሳም አፍ
  rationale: ምስሉን ቃል በቃል በመጠበቅ ትክክለኛ አንበሳን፣ ገዳይ አደጋን ወይም ጠላት ኃይልን ያመለክት እንደሆነ በትርጉሙ ውስጥ አይወስንም።
theological_decisions:
- issue: κύριος የሚያመለክተው ማንን እንደሆነ
  choice: በዋናው ጽሑፍ «ጌታ» ተብሎ ብቻ ቀርቧል።
  alternative: በተለይ ኢየሱስን ወይም በአጠቃላይ እግዚአብሔርን እንደሚያመለክት መግለጽ።
  rationale: አውዱ ለተለያዩ ንባቦች ቦታ ይሰጣል፤ ስለዚህ ትርጉሙ የግሪኩን አጠራር ጠብቆ የማንነት ትርጓሜ አይጨምርም።
- issue: «ከአንበሳ አፍ» የሚለው ምስል ፍቺ
  choice: ምስላዊ አገላለጹ በቀጥታ ተጠብቋል።
  alternative: ኔሮን፣ ሰይጣንን፣ በአውሬ መገደልን ወይም ገዳይ አደጋን በግልጽ ስም መተርጎም።
  rationale: ጽሑፉ ከብዙ ሊሆኑ ከሚችሉ ታሪካዊና ምሳሌያዊ ፍቺዎች አንዱን አይወስንም፤ ምስሉን ማቆየት ይህን ውጥረት ይጠብቃል።
