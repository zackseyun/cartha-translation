  choice: ለመምጣት
  rationale: የΣπούδασον ማሟያ የሆነውን የመምጣት ድርጊት ቀጥታ ያስተላልፋል።
- source_word: Ἀσπάζεταί σε
  choice: ሰላምታ ያቀርቡልሃል
  rationale: በደብዳቤ መዝጊያ ዐውድ ἀσπάζομαι ሰላምታን ማድረስን ያመለክታል፤ ብዙ ሰዎች ስለሚከተሉ ግሱ በብዙ ቁጥር ተስማምቷል።
- source_word: Εὔβουλος
  choice: ኤውቡሎስ
  rationale: የግሪክኛውን የግል ስም ድምፅ በአማርኛ ፊደል የሚያቀርብ ንበባ ነው።
- source_word: Πούδης
  choice: ጱዴስ
  rationale: የግሪክኛውን Πούδης ስም በተለመደው የአማርኛ የመጽሐፍ ቅዱስ ንበባ ያቀርባል።
