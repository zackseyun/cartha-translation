base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/021.yaml
  text: Make every effort to come before winter. Eubulus sends greetings to you[a], and so do Pudens and Linus and Claudia and all the brothers.
translation:
  language: am
  text: ከክረምት በፊት ለመምጣት ትጋ። ኤውቡሎስ፣ ጱዴስ፣ ሊኖስና ቀላውድያ እንዲሁም ወንድሞች ሁሉ ሰላምታ ያቀርቡልሃል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ወንድሞችና እኅቶች ሁሉ»። የግሪክኛው ጽሑፍ «ወንድሞች» ይላል፤ ነገር ግን በዚህ ዐውድ ቃሉ ሰፊውን የአማኞች ማኅበር ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
