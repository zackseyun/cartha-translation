language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀ῥύσεταί με ὁ κύριος ἀπὸ παντὸς ἔργου πονηροῦ καὶ σώσει εἰς τὴν βασιλείαν αὐτοῦ τὴν ἐπουράνιον· ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/018.yaml
  text: The Lord will rescue me from every evil deed and will bring me safely into his heavenly kingdom[a]. To him be the glory forever and ever[c][b]. Amen.
translation:
  language: am
  text: ጌታ ከክፉ ሥራ ሁሉ ይታደገኛል[a]፤ ወደ ሰማያዊ መንግሥቱም በደኅና ያደርሰኛል[b]። ለእርሱ ክብር ከዘላለም እስከ ዘላለም ይሁን[c]። አሜን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ከክፉ ድርጊት ሁሉ ያድነኛል።»
    reason: lexical_alternative
  - marker: b
    text: በቀጥታ፣ «ወደ ሰማያዊ መንግሥቱ ያድነኛል።»
    reason: lexical_alternative
  - marker: c
    text: በቀጥታ፣ «ለዘመናት ዘመናት።»
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥύσεταί
  choice: ይታደገኛል
  rationale: ῥύομαι ከአደጋ ወይም ከክፉ ነገር ማዳንን ያመለክታል፤ «ይታደገኛል» ይህን የመታደግ ስሜት በዘመናዊና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀπὸ παντὸς ἔργου πονηροῦ
  choice: ከክፉ ሥራ ሁሉ
  rationale: «ሥራ» የἔργονን ሰፊ ትርጉም ይጠብቃል፤ ሐረጉ ክፉውን ሥራ ማን እንደሚፈጽመው ስለማይገልጽ ትርጉሙም ይህን አልወሰነም።
- source_word: σώσει εἰς
  choice: በደኅና ያደርሰኛል
  rationale: σῴζω የማዳንና የመጠበቅ ክብደት አለው፤ εἰς ደግሞ ወደ ግብ መግባትን ያሳያል። «በደኅና ያደርሰኛል» ሁለቱንም በተፈጥሯዊ አማርኛ ያጣምራል።
- source_word: εἰς τὴν βασιλείαν αὐτοῦ τὴν ἐπουράνιον
  choice: ወደ ሰማያዊ መንግሥቱ
  rationale: εἰς የሚያመለክተውን ወደ ውስጥ የሚደረግ እንቅስቃሴ ወይም ግብ «ወደ» ይጠብቃል፤ ἐπουράνιον ደግሞ «ሰማያዊ» ተብሏል።
- source_word: ᾧ ἡ δόξα
  choice: ለእርሱ ክብር … ይሁን
  rationale: ይህ የውዳሴ ቀመር ሲሆን «ይሁን» በግሪክ ስማዊ ሐረግ ውስጥ የተገመተውን የክብር ምኞትና አሰጣጥ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: ከዘላለም እስከ ዘላለም
  rationale: የግሪኩን የማያቋርጥ ዘመን ፈሊጣዊ አገላለጽ በታወቀና ክቡር የአማርኛ አገላለጽ ያስተላልፋል።
- source_word: ἀμήν
  choice: አሜን
  rationale: በአማርኛ የክርስቲያን አጠቃቀም የተለመደው የአምልኮ ቃል ተጠብቋል።
theological_decisions:
- issue: አሁናዊ መታደግና የመጨረሻ ድነት ያላቸው ግንኙነት
  choice: የመጀመሪያውን ግስ «ይታደገኛል»፣ ሁለተኛውን ደግሞ «ወደ ሰማያዊ መንግሥቱ በደኅና ያደርሰኛል» በማለት ልዩነታቸው ተጠብቋል።
  alternative: ጌታ ጳውሎስን ከሥጋዊ ሞት እንደሚያድነው በግልጽ መተርጎም፣ ወይም መታደጉን መንፈሳዊ ብቻ ብሎ መወሰን።
  rationale: ጥቅሱ የሥጋዊ ሞት መቅረትን በግልጽ ቃል አይገባም፤ ῥύσεταί እና σώσει ከ«ወደ ሰማያዊ መንግሥቱ» ጋር ሆነው መለኮታዊ ጥበቃንና የመጨረሻ መድረስን ያሳያሉ። ትርጉሙ ይህን ውጥረት ሳይፈታ ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። «በደኅና ያደርሰኛል» የግሪኩን σώσει εἰς በቃል በቃል ከመኮረጅ ይልቅ የማዳንና ወደ ግብ የማድረስ ኃይሉን በተፈጥሯዊ አገላለጽ ያቀርባል።
