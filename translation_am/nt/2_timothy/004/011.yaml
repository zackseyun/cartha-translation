- source_word: μετ’ ἐμοῦ
  choice: ከእኔ ጋር
  rationale: μετά ከጀኒቲቭ ጋር ያለውን የአብሮነት ትርጉም በቀጥታ ይገልጻል።
- source_word: Μᾶρκον
  choice: ማርቆስን
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደው የስሙ ቅርጽ ሲሆን የቀጥታ ተሳቢ ምልክትንም ይይዛል።
- source_word: ἀναλαβὼν
  choice: ይዘኸው
  rationale: ማርቆስን መውሰድና ከዚያም አብሮ ማምጣት ያለውን ቅደም ተከተል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἄγε
  choice: አምጣው
  rationale: በዚህ የጉዞ አውድ የትእዛዝ ግሱ ሰውን አብሮ ማምጣትን ያመለክታል፤ የተሳቢው ቅጥያ ማርቆስን በግልጽ ይመለከታል።
- source_word: μετὰ σεαυτοῦ
  choice: ከአንተ ጋር
