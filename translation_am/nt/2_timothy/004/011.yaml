- source_word: εἰς διακονίαν
  choice: ለአገልግሎት
  rationale: διακονία በሰፊው አገልግሎትን ሊያመለክት ስለሚችል ‘አገልግሎት’ የቃሉን ስፋት ይጠብቃል፤ በዚህ አውድ የወንጌል አገልግሎት ሥራ ሊሆን እንደሚችል በግርጌ ማስታወሻ ተጠቅሷል።
theological_decisions:
- issue: በጳውሎስ ንግግር ውስጥ διακονία የሚለው ቃል እንዴት እንደሚተረጎም
  choice: አገልግሎት
  alternative: የወንጌል አገልግሎት
  rationale: የግሪክ ቃሉ ሰፊ የአገልግሎት ትርጉም ስላለው ዋናው ጽሑፍ ትርጉሙን አያጠብም። አውዱ የጳውሎስን የወንጌል ሥራ ሊያመለክት ቢችልም ጽሑፉ መደበኛ የቤተ ክርስቲያን ሹመት አይገልጽም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ለጢሞቴዎስ የተነገረው ነጠላ ወንድ ትእዛዝ ‘ይዘኸው…አምጣው’ በሚለው ቅርጽ ተጠብቋል።
