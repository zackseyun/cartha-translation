  text: Luke alone is with me. Pick up Mark and bring him with you, for he is useful to me for ministry.
translation:
  language: am
  text: ሉቃስ ብቻውን ከእኔ ጋር ነው። ማርቆስን ይዘኸው ከአንተ ጋር አምጣው፤ ለአገልግሎት[a] ይጠቅመኛልና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪክኛው διακονία ቃል “አገልግሎት” ወይም “ሚኒስቴር” ማለት ሊሆን ይችላል። እዚህ ማርቆስ ለጳውሎስ ሥራ ጠቃሚ መሆኑን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Λουκᾶς
  choice: ሉቃስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የግል ስም ቅርጽ ይከተላል።
- source_word: μόνος
  choice: ብቻውን
