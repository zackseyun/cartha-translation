  text: ⸀Διαμαρτύρομαι ἐνώπιον τοῦ θεοῦ καὶ ⸂Χριστοῦ Ἰησοῦ⸃, τοῦ μέλλοντος κρίνειν ζῶντας καὶ νεκρούς, ⸀καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/001.yaml
  text: 'I solemnly charge you before God and Messiah Jesus[a], who is about to judge the living and the dead[b], and by his appearing and his kingdom:'
translation:
  language: am
  text: 'በእግዚአብሔርና ሕያዋንንና ሙታንን ሊፈርድ ባለው[a] በመሲሑ ኢየሱስ ፊት፣ እንዲሁም በመገለጡና በመንግሥቱ[b]፣ አጥብቄ አዝዝሃለሁ፦


    [a] ወይም፣ “በሚፈርደው።”

    [b] ግሪኩ ቃል በቃል “መገለጡንና መንግሥቱንም” ይላል፤ ከትእዛዙ ጋር ያላቸውን የማሳሰቢያ ግንኙነት በግልጽ አይገልጽም።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በሚፈርደው።”
    reason: lexical_alternative
  - marker: b
    text: ግሪኩ ቃል በቃል “መገለጡንና መንግሥቱንም” ይላል፤ ከትእዛዙ ጋር ያላቸውን የማሳሰቢያ ግንኙነት በግልጽ አይገልጽም።
    reason: alternative_reading
lexical_decisions:
- source_word: Διαμαρτύρομαι
  choice: አጥብቄ አዝዝሃለሁ
  rationale: በዚህ የአደራና የተልእኮ አውድ ግሱ ተራ ምስክርነትን ሳይሆን ከባድና ጥብቅ ትእዛዝን ያመለክታል። ተሳቢው ከአውዱ በመወሰዱ በአማርኛ ነጠላ ወንድ ቅጽ “አዝዝሃለሁ” ተገልጧል።
- source_word: ἐνώπιον
  choice: በ… ፊት
  rationale: በአምላክና በመሲሑ ፊት ወይም በእነርሱ መገኘት የሚሰጠውን ትእዛዝ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: Χριστοῦ Ἰησοῦ
  choice: መሲሑ ኢየሱስ
  rationale: Χριστός እዚህ የቅቡዕነት ማዕረግ ኃይሉን ስለያዘ “መሲሕ” ተብሎ ተተርጉሟል፤ የአማርኛው የተወሰነ ቅጽ “መሲሑ” ከኢየሱስ ጋር ተጣምሯል።
- source_word: τοῦ μέλλοντος κρίνειν
  choice: ሊፈርድ ባለው
  rationale: μέλλω የሚያመለክተውን የወደፊትነትና የቀረበ ተግባር ስሜት ሳይጠፋ ያቀርባል፤ ቀላሉ “በሚፈርደው” እንደ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ζῶντας καὶ νεκρούς
  choice: ሕያዋንንና ሙታንን
  rationale: የሁለቱን ቡድኖችና የፍርዱን ሁሉን አቀፍ ወሰን በአጭርና በተለመደ አማርኛ ያቆያል።
- source_word: ἐπιφάνειαν
  choice: መገለጡ
  rationale: በዓይን የሚታይ መገኘትን ወይም መገለጥን ያለ ተጨማሪ ትርጓሜ ያስተላልፋል።
- source_word: βασιλείαν
  choice: መንግሥቱ
  rationale: βασιλεία የሚያካትተውን መንግሥትና ንጉሣዊ ግዛት የሚያስተላልፍ መደበኛ ምርጫ ነው።
theological_decisions:
- issue: የΧριστός መሲሓዊ ማዕረግ
  choice: መሲሑ ኢየሱስ
  alternative: ክርስቶስ ኢየሱስ
  rationale: በዚህ የፍርድና የመንግሥት መግለጫ ውስጥ ቃሉ እንደ ተራ የስም ክፍል ብቻ ሳይሆን እንደ መሲሓዊ ማዕረግ ይሠራል።
- issue: μέλλω በመጨረሻው ፍርድ አውድ ያለው ኃይል
  choice: ሊፈርድ ባለው
  alternative: በሚፈርደው
  rationale: የግሪኩን የሚመጣ ወይም የቀረበ ተግባር ስሜት ይጠብቃል፤ ከጽሑፉ በላይ የተወሰነ የጊዜ ሰሌዳ አያስገባም።
- issue: καὶ τὴν ἐπιφάνειαν… καὶ τὴν βασιλείαν ያለው አገባባዊ ግንኙነት
  choice: እንዲሁም በመገለጡና በመንግሥቱ
  alternative: መገለጡንና መንግሥቱንም
  rationale: ዋናው ጽሑፍ ክሶቹን እንደ የተከበረ ማሳሰቢያ መሠረት ያቀርባል፤ የግሪኩ ቀጥተኛ ቅንብር ግን ግንኙነቱን በግልጽ ስለማይናገር በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የሐዋርያዊው ትእዛዝ ክብደት “አጥብቄ አዝዝሃለሁ” በሚለው ተጠብቋል፤ የግሪኩ አገባባዊ ጥርጣሬ በማስታወሻ ተገልጧል።
