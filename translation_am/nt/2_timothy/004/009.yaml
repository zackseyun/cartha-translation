- source_word: πρός με
  choice: ወደ እኔ
  rationale: ወደ አንድ ሰው የሚደረግን እንቅስቃሴ ግልጽና ተፈጥሯዊ በሆነ አማርኛ ያሳያል።
- source_word: ταχέως
  choice: ፈጥነህ
  rationale: የአስቸኳይነትንና የፍጥነትን ሐሳብ ከΣπούδασον የጥረት ትርጉም ሳይቀላቀል ለይቶ ያስተላልፋል።
