  verdict: revise
  source_fidelity: The draft correctly represents the imperative σπούδασον as an appeal for full effort, preserves ἐλθεῖν πρός με as coming to the speaker, and separately expresses ταχέως. However, ፈጥነህ more literally has the participial sense “having hurried,” rather than functioning as the Greek adverb modifying the requested coming.
  naturalness: The sentence is understandable, but a purpose clause with እንድትመጣ and the adverbial phrase በፍጥነት is more idiomatic modern standard Amharic and clearly relates both urgency and effort to the requested arrival.
  terminology: No theological or specialized terminology occurs. የምትችለውን ሁሉ አድርግ naturally conveys the earnest-effort force of σπούδασον without conflating it with ταχέως.
  issues:
  - severity: low
    issue: The form ፈጥነህ is participial and can suggest “having hurried.”
    rationale: ταχέως is an adverb modifying the coming; በፍጥነት more directly and naturally renders that adverbial function.
  - severity: low
    issue: The draft’s infinitive construction is understandable but less direct in this context.
    rationale: እንድትመጣ following የምትችለውን ሁሉ አድርግ is a natural Amharic way to express “make every effort to come.”
  revised_text: በፍጥነት ወደ እኔ እንድትመጣ የምትችለውን ሁሉ አድርግ።[a]
