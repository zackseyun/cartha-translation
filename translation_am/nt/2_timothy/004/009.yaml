- source_word: Σπούδασον
  choice: የቻልከውን ሁሉ አድርግ
  rationale: የግሡን የትእዛዝ ኃይልና ትጋትን፣ ቁርጠኝነትን እና ሙሉ ጥረትን የሚጠይቅ ትርጉም በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል፤ ፍጥነትን ብቻ አያመለክትም።
- source_word: ἐλθεῖν
  choice: ለመምጣት
