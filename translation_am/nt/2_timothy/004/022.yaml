  yaml_path: translation/nt/2_timothy/004/022.yaml
  text: The Lord be with your spirit[a]. Grace be with you all.
translation:
  language: am
  text: ጌታ ከመንፈስህ ጋር ይሁን።[a] ጸጋ ከእናንተ ጋር ይሁን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ግሪኩ ከነጠላ ቁጥር «ከመንፈስህ ጋር» ወደ ብዙ ቁጥር «ከእናንተ ጋር» ይሸጋገራል።
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: ጌታ
  rationale: በአዲስ ኪዳን የተለመደውን የκύριος ትርጉም ይጠብቃል፤ በዚህ የመልእክት መዝጊያ ቡራኬ ውስጥ የተወሰነውን ጌታ ያመለክታል።
- source_word: μετὰ
  choice: ከ… ጋር ይሁን
  rationale: በግሪክ ግስ ባይገለጽም የቡራኬው የምኞት ኃይል በአማርኛ በተፈጥሯዊ ሁኔታ «ይሁን» በማለት ይገለጻል።
- source_word: πνεύματός
  choice: መንፈስ
  rationale: ከሁለተኛ መደብ ነጠላ ባለቤትነት ቅጥያ ጋር የጢሞቴዎስን ሰብዓዊ መንፈስ ያመለክታል፤ የግሪኩን ቃል ሳያሰፋ ይጠብቃል።
- source_word: σου
  choice: -ህ
  rationale: በመጀመሪያው ሐረግ ለጢሞቴዎስ በነጠላ ቁጥር የተሰጠውን አድራሻ በ«መንፈስህ» ውስጥ በግልጽ ይጠብቃል።
- source_word: χάρις
  choice: ጸጋ
  rationale: የጳውሎስ የቡራኬ አገላለጽንና የቃሉን መለኮታዊ ሞገስ ትርጉም በተለመደና ክቡር የአማርኛ ቃል ያስተላልፋል።
- source_word: ὑμῶν
  choice: ሁላችሁ
  rationale: የሁለተኛውን ሐረግ ብዙ ቁጥር በግልጽ ያሳያል፤ ቡራኬው ከጢሞቴዎስ አልፎ ከእርሱ ጋር ላሉትም ሁሉ መድረሱን ይጠብቃል።
theological_decisions:
- issue: «ጌታ» የሚለው ማንን እንደሚያመለክት
  choice: በጳውሎሳዊ የመልእክት መዝጊያ አውድ ጌታ ኢየሱስን እንደሚያመለክት ተወስዷል፤ ነገር ግን ጽሑፉ «ኢየሱስ» ስለማይል በትርጉሙ አልተጨመረም።
  alternative: በአጠቃላይ እግዚአብሔርን የሚያመለክት መሆኑ።
  rationale: የመልእክቱ መዝጊያ ልማድ የኢየሱስን ማጣቀሻ ይደግፋል፤ «ጌታ» የሚለውን ብቻ መተርጎም ግን የምንጩን የመግለጫ ደረጃ ይጠብቃል።
- issue: በሁለቱ ሐረጎች መካከል ያለው የቁጥር ለውጥ
  choice: የመጀመሪያው ቡራኬ ጢሞቴዎስን በነጠላ ቁጥር ያነጋግራል፤ ሁለተኛው ግን ወደ ብዙ ተቀባዮች ይስፋፋል።
  alternative: ሁለቱንም ሐረጎች ለጢሞቴዎስ ብቻ እንደተነገሩ በነጠላ ቁጥር መተርጎም።
  rationale: ግሪኩ በግልጽ ከσου ነጠላ ወደ ὑμῶν ብዙ ቁጥር ይሸጋገራል፤ «መንፈስህ» እና «ሁላችሁ» ይህን ሥነ ጽሑፋዊና አድራሻዊ ልዩነት ይጠብቃሉ።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለሕዝብ ቀላል የሆነ የቡራኬ አገላለጽ ተጠቅሟል። «ይሁን» በግሪኩ የተገመተውን የምኞት ኃይል በተፈጥሯዊ አማርኛ ያሳያል፤ የነጠላና የብዙ ቁጥር ልዩነቱም በግልጽ ተጠብቋል።
