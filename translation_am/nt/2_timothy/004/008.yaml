  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “አክሊል” የሽልማትን ምስል የሚጠብቅ የተለመደ መጽሐፍ ቅዱሳዊ ቃል ነው።
