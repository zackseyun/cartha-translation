  text: λοιπὸν ἀπόκειταί μοι ὁ τῆς δικαιοσύνης στέφανος, ὃν ἀποδώσει μοι ὁ κύριος ἐν ἐκείνῃ τῇ ἡμέρᾳ, ὁ δίκαιος κριτής, οὐ μόνον δὲ ἐμοὶ ἀλλὰ καὶ πᾶσιν τοῖς ἠγαπηκόσι τὴν ἐπιφάνειαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/008.yaml
  text: From now on the crown of righteousness is laid up for me[a], which the Lord, the righteous judge, will award to me on that day—and not only to me, but also to all who have loved his appearing.
translation:
  language: am
  text: ከእንግዲህ ወዲህ የጽድቅ አክሊል[a] ተይዞልኛል፤ ይህንም ጌታ፣ ጻድቁ ፈራጅ፣ በዚያ ቀን ይሰጠኛል። ለእኔ ብቻ ሳይሆን፣ መገለጡን ለወደዱ ሁሉ ደግሞ ይሰጣል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የፍትሕ አክሊል።” የግሪኩ ቃል “ጽድቅ” ማለት ሲሆን፣ በአንዳንድ አውዶች “ፍትሕ” ማለትም ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: λοιπὸν
  choice: ከእንግዲህ ወዲህ
  rationale: ቀደም ሲል ጳውሎስ ሩጫውን እንደጨረሰ ከተናገረው ጋር ተያይዞ፣ ቃሉ ከዚህ በኋላ የሚቀረውን ያመለክታል።
- source_word: ἀπόκειταί
  choice: ተዘጋጅቶልኛል
  rationale: አንድ ነገር ለአንድ ሰው ተለይቶ መቀመጡንና አሁን ተጠብቆ መኖሩን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὁ τῆς δικαιοσύνης στέφανος
  choice: የጽድቅ አክሊል
  rationale: የግሪኩን የዝምድና አገባብ ይጠብቃል፤ አክሊሉ ለጽድቅ የሚሰጥ፣ ጽድቅን የሚያመለክት ወይም ጽድቅ ራሱ መሆኑን አይወስንም።
- source_word: δικαιοσύνης
  choice: ጽድቅ
  rationale: በጳውሎሳዊ አጠቃቀም ዋናውን ትርጉም ያቀርባል፤ “ፍትሕ” የሚለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ἀποδώσει
  choice: ይሰጠኛል
  rationale: ጌታ የተገባውን ሽልማት እንደሚሰጥ በተፈጥሯዊ አማርኛ ያሳያል፤ የቅጣት ሐሳብ በስህተት እንዳያስገባ ያደርጋል።
- source_word: ὁ δίκαιος κριτής
  choice: ጻድቁ ፈራጅ
  rationale: ጌታን እንደ ትክክለኛና ጻድቅ ፈራጅ የሚገልጸውን ቅጽል ስም ይጠብቃል።
- source_word: πᾶσιν τοῖς ἠγαπηκόσι
  choice: ለወደዱ ሁሉ
  rationale: የፍጹም ጊዜ አንቀጹ እስከአሁን የዘለቀ የተረጋጋ ፍቅርን ይጠቁማል።
- source_word: ἐπιφάνειαν
  choice: መገለጡን
  rationale: የመታየትንና በግልጽ የመገለጥን ትርጉም ይጠብቃል፤ ቃሉን “መምጣት” ብሎ አያጠቃልልም።
theological_decisions:
- issue: “የጽድቅ አክሊል” የሚለው ሐረግ ትርጉም
  choice: የዝምድናው ሐረግ ሳይፈታ “የጽድቅ አክሊል” ተብሎ ተጠብቋል።
  alternative: ለጽድቅ የሚሰጥ አክሊል፣ ጽድቅን የሚያካትት አክሊል፣ ወይም የፍትሐዊ ማጽደቅ አክሊል።
  rationale: የግሪኩ የዝምድና ቅርጽ ከአንድ በላይ ትርጉማዊ ግንኙነቶችን ይፈቅዳል፤ ጽሑፉ ያልወሰነውን ትርጉሙ አልወሰነም።
- issue: “ጌታ” የሚለው ማንን እንደሚያመለክት
  choice: ዋናው ጽሑፍ “ጌታ” የሚለውን ማዕረግ እንዳለ ይጠብቃል።
  alternative: በግልጽ “ጌታ ኢየሱስ” ማለት ወይም በአጠቃላይ እግዚአብሔርን ማመልከት።
  rationale: “መገለጡን” የሚለው ቅርብ አውድ ክርስቶስን በጽኑ ይጠቁማል፤ ሆኖም ትርጉሙ ከግሪኩ በላይ የሆነ ስም አይጨምርም።
