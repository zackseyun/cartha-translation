    issue: The rendering of ἀπόκειται is too weakly specific.
    rationale: ‘ተዘጋጅቶልኛል’ communicates preparation, but the Greek more specifically indicates that the crown is already laid aside or reserved. Replacing it with ‘ተይዞልኛል’ preserves this meaning without introducing an interpretive expansion.
