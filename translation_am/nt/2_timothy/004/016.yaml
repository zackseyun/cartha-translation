base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/016.yaml
  text: At my first defense no one stood with me[a], but all deserted me[c][b]. May it not be counted against them.
translation:
  language: am
  text: በመጀመሪያው የፍርድ መከላከያዬ[a]፣ አንድም ሰው ከጎኔ አልቆመም[b]፤ ነገር ግን ሁሉም ትተውኝ ሄዱ። ይህ በእነርሱ ላይ እንዳይቈጠር[c]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በመጀመሪያው የፍርድ ስማት” ወይም “በመጀመሪያው ሕጋዊ መከላከያዬ።”
    reason: lexical_alternative
  - marker: b
    text: ግሪኩ ቃል በቃል፣ “አንድም ሰው ከእኔ ጋር ለመገኘት አልመጣም” ይላል፤ ትርጉሙ ጳውሎስን ለመደገፍ ማንም አልቀረበም ማለት ነው።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “ይህ በእነርሱ ላይ እንዳይመዘገብ” ወይም “በዚህ እንዳይከሰሱ።”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπολογίᾳ
  choice: የፍርድ መከላከያዬ
  rationale: ቃሉ በዚህ አውድ በባለሥልጣናት ፊት የሚቀርብ ሕጋዊ መከላከያን ወይም መልስን ያመለክታል፤ ይህ አተረጓጎም የፍርድ አውዱን በግልጽ ያስቀምጣል።
- source_word: πρώτῃ
  choice: በመጀመሪያው
  rationale: የመጀመሪያውን የመከላከያ ደረጃ ወይም አጋጣሚ በቀጥታ ይገልጣል።
- source_word: οὐδείς μοι παρεγένετο
  choice: አንድም ሰው ከጎኔ አልቆመም
  rationale: ግሱ ቃል በቃል ቀርቦ መገኘትን ይገልጣል፤ በዚህ የፍርድ አውድ ግን ጳውሎስን ለመደገፍ በቦታው መቅረብን ያመለክታል። ‘ከጎኔ አልቆመም’ መገኘትንና ድጋፍን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐγκατέλιπον
  choice: ትተውኝ ሄዱ
  rationale: በከባድ ሁኔታ ውስጥ አንድን ሰው ጥሎ መሄድን ይገልጣል፤ ሐረጉ በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: μὴ αὐτοῖς λογισθείη
  choice: ይህ በእነርሱ ላይ አይቈጠር
  rationale: የግሪኩ ምኞታዊ አገባብ የይቅርታ ጸሎት መሰል ምኞትን ያሳያል፤ ‘አይቈጠር’ የሂሳብና የፍርድ ምሳሌውን ይጠብቃል። በግሪክ ያልተገለጸው ባለቤት ‘ይህ’ በአማርኛ ለግልጽነት ተጨምሯል።
theological_decisions:
- issue: ጳውሎስ ስለተዉት ሰዎች የተናገረው የመጨረሻ ሐረግ ቃና
  choice: ‘ይህ በእነርሱ ላይ አይቈጠር’ የሚል ጸሎት መሰል ምኞት
  alternative: ‘ይህ በእነርሱ ላይ አይመዝገብ’ ወይም ‘አይከሰሱበት’
  rationale: μή ከአኦሪስት ተገብሮ ኦፕታቲቭ λογισθείη ጋር ሲመጣ በተፈጥሮ ምኞትን ወይም ጸሎትን ይገልጣል። ትርጉሙ የይቅርታ ቃናውን ሳያጠናክር ወይም ወደ ልዩ ዶክትሪን ሳይወስድ ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። የፍርድ አውዱና የጳውሎስ የይቅርታ ቃና ተጠብቀዋል።
