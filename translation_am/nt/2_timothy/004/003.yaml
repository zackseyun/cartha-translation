  text: ἔσται γὰρ καιρὸς ὅτε τῆς ὑγιαινούσης διδασκαλίας οὐκ ἀνέξονται, ἀλλὰ κατὰ τὰς ⸂ἰδίας ἐπιθυμίας⸃ ἑαυτοῖς ἐπισωρεύσουσιν διδασκάλους κνηθόμενοι τὴν ἀκοήν,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/003.yaml
  text: For the time will come when they will not put up with sound teaching[a], but according to their own desires they will heap up teachers for themselves[b], having itching ears.
translation:
  language: am
  text: ሰዎች ጤናማ ትምህርትን[a] የማይታገሡበት ጊዜ ይመጣልና፤ ነገር ግን ጆሯቸው እያሳካቸው፣ በራሳቸው ምኞቶች መሠረት ለራሳቸው አስተማሪዎችን ይከምራሉ።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ትክክለኛ ትምህርት»። «ጤናማ» የሚለው ቃል ትምህርቱ ትክክለኛና ጠቃሚ መሆኑን በዘይቤ ይገልጣል።
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ «መስማታቸው እያሳካቸው»። ይህ ምስል ሰዎቹ ሊሰሙት የሚፈልጉትን ነገር ለመስማት ጉጉት እንዳላቸው ያሳያል።
    reason: lexical_alternative
lexical_decisions:
- source_word: καιρὸς
  choice: ጊዜ
  rationale: በዐውዱ የሚመጣውን የተወሰነ ወቅት ያመለክታል፤ «ጊዜ» በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: τῆς ὑγιαινούσης διδασκαλίας
  choice: ጤናማውን ትምህርት
  rationale: ὑγιαίνω ያለውን የ«ጤናማ» ዘይቤያዊ ምስል ይጠብቃል፤ διδασκαλίαንም ያለ አስፈላጊ ሃይማኖታዊ ቴክኒካዊነት «ትምህርት» ብሎ ያቀርባል።
- source_word: οὐκ ἀνέξονται
  choice: የማይታገሡበት
  rationale: ἀνέχομαι የመታገሥ፣ የመቻል ወይም የመቀበል እምቢተኝነትን ያሳያል፤ «አይታገሡም» የምንጩን ጽናት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: κατὰ τὰς ἰδίας ἐπιθυμίας
  choice: እንደ ራሳቸው ምኞት
  rationale: ἐπιθυμία እዚህ ሰፊ የግል ፍላጎትን ወይም ምኞትን ያመለክታል፤ ጾታዊ ትርጉም ብቻ እንዳይሰጠው «ምኞት» ተመርጧል።
- source_word: ἑαυτοῖς ἐπισωρεύσουσιν διδασκάλους
  choice: ለራሳቸው አስተማሪዎችን ይከምራሉ
  rationale: «ለራሳቸው» የἑαυτοῖςን አንጸባራቂ ኃይል ይጠብቃል፤ «ይከምራሉ» ደግሞ የἐπισωρεύωን የብዛትና የመደራረብ ምስል ያስቀራል።
- source_word: κνηθόμενοι τὴν ἀκοήν
  choice: ጆሯቸው እያሳካቸው ነው
  rationale: የግሪኩን ሕያው የማሳከክ ምስል ይጠብቃል፤ አሳቡን በግድ ምክንያታዊ አያደርገውም፣ ከዋናው ድርጊት ጋር አብሮ የሚከሰት ሁኔታ አድርጎ ያቀርበዋል።
theological_decisions:
- issue: በእረኛ መልእክቶች ዐውድ διδασκαλίαን መተርጎም
  choice: ትምህርት
  alternative: ትምህርተ እምነት
  rationale: የግሪኩ ቃል ትክክለኛ ትምህርትን ቢያመለክትም፣ እዚህ ግድ የሚል ቴክኒካዊ የእምነት ስርዓት ቃል አይጠይቅም፤ «ትምህርት» ትርጉሙን ያለ ቤተ እምነት ልዩነት ይጠብቃል።
- issue: የκνηθόμενοι τὴν ἀκοήν ሰዋሰዋዊ ኃይል
  choice: አብሮ የሚከሰት ሁኔታ፦ «ጆሯቸው እያሳካቸው»
  alternative: ምክንያታዊ፦ «ጆሯቸው ስለሚያሳካቸው»
  rationale: ተሳቢው ሐረግ ምክንያትን ሊጠቁም ቢችልም ምንጩ ይህን በግልጽ አይወስንም፤ «እያሳካቸው» የሰዋሰውን አሻሚነትና የምስሉን ኃይል ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የ«ጤናማ»፣ «ይከምራሉ» እና «ጆሯቸው እያሳካቸው» ዘይቤዎች የምንጩን ሕያው ምስሎች ለመጠበቅ ተይዘዋል።
