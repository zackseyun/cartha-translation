  source_fidelity: The draft preserves the Greek’s three parallel perfect assertions and its athletic/contest imagery. However, ተጋድያለሁ is not the natural completed-form expression needed here; ታግያለሁ clearly and idiomatically conveys ἠγώνισμαι while retaining the perfect sense.
  naturalness: መልካሙን ትግል ታግያለሁ is more natural modern standard Amharic than the noun–verb pairing መልካሙን ተጋድሎ ተጋድያለሁ. The remaining parallel clauses are clear and appropriately dignified.
  terminology: እምነቱን appropriately represents the definite τὴν πίστιν without forcing its debated referent. The note should describe the alternative as faithfulness, rather than the less precise expression የጸና እምነት.
  issues:
