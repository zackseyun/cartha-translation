    issue: The form ተጋድያለሁ is unsuitable in this completed-action context and sounds nonstandard/unnatural.
    rationale: ἠγώνισμαι is perfect, and ታግያለሁ is a natural Amharic perfect rendering of ‘I have fought/struggled.’
  - severity: low
    issue: The footnote’s phrase የጸና እምነት does not accurately state the principal alternative semantic possibility of πίστις.
    rationale: The relevant alternative is personal faithfulness/fidelity, not specifically ‘steadfast faith.’
  revised_text: መልካሙን ትግል ታግያለሁ፤ ሩጫውን ጨርሻለሁ፤ እምነቱን ጠብቄአለሁ።[a]
