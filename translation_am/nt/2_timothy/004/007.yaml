id: 2TI.4.7
reference: 2 Timothy 4:7
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τὸν ⸂καλὸν ἀγῶνα⸃ ἠγώνισμαι, τὸν δρόμον τετέλεκα, τὴν πίστιν τετήρηκα·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/007.yaml
  text: I have fought the good fight[a], I have finished the race, I have kept the faith.
translation:
  language: am
  text: መልካሙን ትግል ታግያለሁ፤ ሩጫውን ጨርሻለሁ፤ እምነቱን ጠብቄአለሁ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እምነትን ጠብቄአለሁ» ወይም «ታማኝነቴን ጠብቄአለሁ።» የግሪኩ τὴν πίστιν «እምነቱን»፣ ማለትም የክርስቲያን እምነትን፣ ሊያመለክት ይችላል፤ ወይም ጸሐፊው የጠበቀውን ታማኝነት ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: καλὸν ἀγῶνα
  choice: መልካሙን ተጋድሎ
  rationale: ἀγών ትግልን፣ ውድድርን ወይም ገድልን ሊያመለክት ይችላል። «ተጋድሎ» የቃሉን የውድድርና የትግል ምስል በአጭርና በክብር ያቆያል፤ καλός ደግሞ እዚህ «መልካም» ተብሎ ተተርጉሟል።
- source_word: ἠγώνισμαι
  choice: ተጋድያለሁ
  rationale: የግሪኩ ፍጹም ጊዜ የተፈጸመና አሁንም ውጤቱ የሚጸና ተግባርን ያሳያል። «ተጋድያለሁ» ከ«ተጋድሎ» ጋር ያለውን የቃል ግንኙነትና የግሪኩን አጽንዖት ይጠብቃል።
- source_word: δρόμον
  choice: ሩጫውን
  rationale: δρόμος የሩጫ ውድድርን ወይም የሚሮጥበትን መንገድ ያመለክታል። «ሩጫውን» የስፖርታዊውን ምስል ለዘመናዊ አንባቢ ግልጽ ያደርጋል።
- source_word: τετέλεκα
  choice: ጨርሻለሁ
  rationale: የτελέω ፍጹም ጊዜ አንድን ነገር እስከ መጨረሻው ማድረስን ያሳያል። «ጨርሻለሁ» ተፈጥሯዊና አጭር ሲሆን የተጠናቀቀውን ተግባር ይገልጣል።
- source_word: πίστιν
  choice: እምነቱን
  rationale: በግሪኩ ያለው መስተዋድድ በዚህ አውድ «እምነቱን»፣ ማለትም የክርስቲያን እምነትን፣ የሚያመለክት ጠንካራ ዕድል አለው። ሆኖም የታማኝነት ፍቺው በማስታወሻ ተጠብቋል።
- source_word: τετήρηκα
  choice: ጠብቄአለሁ
  rationale: τηρέω መጠበቅን፣ መጽናትን ወይም በታማኝነት መያዝን ሊያመለክት ይችላል። «ጠብቄአለሁ» እነዚህን ተደራራቢ ፍቺዎች ሳያጠብ ይይዛል።
theological_decisions:
- issue: የτὴν πίστιν ትርጉም
  choice: እምነቱን
  alternative: እምነትን ጠብቄአለሁ፤ ወይም ታማኝ ሆኜ ቆይቻለሁ
  rationale: መስተዋድዱና የመልእክቱ አውድ «እምነቱን» የሚለውን ንባብ ይደግፋሉ። ነገር ግን πίστις የግል እምነትን ወይም ታማኝነትንም ሊያመለክት ስለሚችል ይህ አሻሚነት በግርጌ ማስታወሻ ተገልጧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ሦስቱ ትይዩ ሐረጎች በከፊል የግሪኩን ምት እንዲጠብቁ በፈሊጣዊ አወቃቀር ቀርበዋል።
