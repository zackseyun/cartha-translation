base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/015.yaml
  text: You also must beware of him[a], for he strongly opposed our words.
translation:
  language: am
  text: አንተም ከእርሱ ተጠንቀቅ፤ ቃሎቻችንን[a] እጅግ ተቃውሟልና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “መልእክታችንን” ወይም “ትምህርታችንን”። ግሪክኛው “ቃሎቻችንን” ይላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: φυλάσσου
  choice: ከእርሱ ተጠንቀቅ
  rationale: የአሁን ጊዜ መካከለኛ ትእዛዝ ጢሞቴዎስ ከዚህ ሰው ራሱን እየጠበቀ እንዲኖር ያሳስባል። ‘ተጠንቀቅ’ የማስጠንቀቂያውን ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: λίαν
  choice: እጅግ
  rationale: ተቃውሞው ከፍተኛ መሆኑን የሚያጠናክር ተፈጥሯዊና ግልጽ አማርኛ ነው።
- source_word: ἀντέστη
  choice: ተቃውሟል
  rationale: ግሱ ራስን በተቃውሞ ማቆምን ወይም መቃወምን ያመለክታል። ‘ተቃውሟል’ በአማርኛ ግልጽና ተፈጥሯዊ ሲሆን የተፈጸመውን ድርጊትም ያሳያል።
- source_word: τοῖς ἡμετέροις λόγοις
  choice: ቃላችንን
  rationale: የግሪክኛውን ‘ቃሎቻችን’ የሚል መሠረታዊ ፍቺ ይጠብቃል፤ ንግግሩ መልእክት፣ ትምህርት ወይም የፍርድ ቤት ምስክርነት መሆኑን አስቀድሞ አይወስንም።
- source_word: ὃν
  choice: ከእርሱ
  rationale: አንጻራዊው ተውላጠ ስም በቀደመው ቁጥር የተጠቀሰውን እስክንድርን ያመለክታል፤ ከ‘ተጠንቀቅ’ ጋር ‘ከእርሱ’ የሚለው አገባብ ተፈጥሯዊ ነው።
- source_word: καὶ σὺ
  choice: አንተም
  rationale: በጢሞቴዎስ ላይ የተደረገውን አጽንዖትና ከጳውሎስ ሁኔታ ጋር ያለውን ግንኙነት በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: ‘ቃላችንን’ የሚለው ሐረግ ወሰን
  choice: ጳውሎስ የራሱንና የባልደረቦቹን ንግግር ያመለክታል፤ ነገር ግን የንግግሩን ዓይነት በተለየ ሁኔታ አይወስንም።
  alternative: የፍርድ ቤት ምስክርነታችንን፣ ስብከታችንን/መልእክታችንን፣ ወይም የእምነት ትምህርታችንን
  rationale: የግሪክኛው ሐረግ ተቃውሞው በፍርድ ቤት፣ በሕዝብ አገልግሎት ወይም በክርስቲያናዊ ትምህርት ላይ መሆኑን አይገልጽም። ስለዚህ ትርጉሙ ያለውን ግልጽ ያልሆነ ስፋት ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። ‘ቃላችንን’ የሚለው ቅርጽ የምንጩን ሆን ተብሎ ያልተወሰነ ትርጉም ጠብቋል። የእግር ማስታወሻው ምልክት ከሚያብራራው ‘ቃላችንን’ ቀጥሎ ተቀምጧል።
