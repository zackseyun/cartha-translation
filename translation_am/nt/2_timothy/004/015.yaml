    issue: ቃላችንን is singular
    rationale: The source has τοῖς ἡμετέροις λόγοις, explicitly plural (“our words”). In standard Amharic, the corresponding plural form is ቃሎቻችንን. The existing form can unnecessarily reduce the source’s plurality.
