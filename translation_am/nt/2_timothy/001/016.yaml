base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/016.yaml
  text: May the Lord grant mercy to the household of Onesiphorus[a], because he often refreshed me and was not ashamed of my chain.
translation:
  language: am
  text: ጌታ ለኦኔሲፎሮስ ቤተሰብ ምሕረትን ይስጥ፤ እርሱ ብዙ ጊዜ እፎይታ ሰጥቶኛልና፣ በሰንሰለቴም[a] አላፈረም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በእስራቴ»፤ ቃል በቃል፣ «በሰንሰለቴ»።
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη
  choice: ይስጥ
  rationale: የግሪኩ የምኞት አገላለጽ ጸሎታዊ ምኞትን ያሳያል፤ «ይስጥ» በአማርኛ ይህን በተፈጥሮ ያስተላልፋል።
- source_word: ἔλεος
  choice: ምሕረት
  rationale: መለኮታዊ ርኅራኄንና በችግር ጊዜ የሚደረግ ቸርነትን የሚያመለክት የተለመደ እና ክቡር አገላለጽ ነው።
- source_word: ὁ κύριος
  choice: ጌታ
  rationale: መለኮታዊ ማዕረጉን በቀጥታ ይጠብቃል፤ ጥቅሱ ማንን እንደሚያመለክት በተጨማሪ አይወስንም።
- source_word: τῷ Ὀνησιφόρου οἴκῳ
  choice: ለአናሲፎሮስ ቤተ ሰብ
  rationale: οἶκος እዚህ ከሕንፃ ይልቅ ቤተ ሰቡን ወይም ቤተሰባዊ አባላቱን ስለሚያመለክት «ቤተ ሰብ» ማኅበራዊ ትርጉሙን ይጠብቃል።
- source_word: ὅτι
  choice: እርሱ ... ነውና
  rationale: በምኞታዊው በረከት የተነገረውን ምክንያት በተፈጥሯዊ የአማርኛ አገባብ ያስተዋውቃል።
- source_word: πολλάκις
  choice: ብዙ ጊዜ
  rationale: ድርጊቱ በተደጋጋሚ መፈጸሙን በግልጽ ዘመናዊ አማርኛ ያሳያል።
- source_word: ἀνέψυξεν
  choice: እፎይታ ሰጥቶኛል
  rationale: ግሱ ማሳረፍን፣ ማደስን ወይም ከጭንቀት እፎይታ መስጠትን ያመለክታል፤ ይህ አገላለጽ በአማርኛ ተፈጥሯዊ ሆኖ ዋናውን ሐሳብ ይጠብቃል።
- source_word: τὴν ἅλυσίν μου
  choice: በሰንሰለቴ
  rationale: የግሪኩን ነጠላና ተጨባጭ ምስል «ሰንሰለት» በማለት ይጠብቃል፤ ቃሉ እስራቱን በውክልና ሊያመለክት መቻሉ በማስታወሻ ተገልጧል።
- source_word: οὐκ ἐπαισχύνθη
  choice: አላፈረም
  rationale: የግሪኩን ማኅበራዊና ሞራላዊ የኀፍረት ስሜት በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል።
