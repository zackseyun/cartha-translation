id: 2TI.1.5
reference: 2 Timothy 1:5
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὑπόμνησιν ⸀λαβὼν τῆς ἐν σοὶ ἀνυποκρίτου πίστεως, ἥτις ἐνῴκησεν πρῶτον ἐν τῇ μάμμῃ σου Λωΐδι καὶ τῇ μητρί σου Εὐνίκῃ, πέπεισμαι δὲ ὅτι καὶ ἐν σοί.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/005.yaml
  text: having been reminded of the sincere faith in you, which first lived in your grandmother Lois and your mother Eunice, I am persuaded that it is also in you.
translation:
  language: am
  text: በአንተ ውስጥ ያለውን ግብዝነት የሌለበትን እምነት አስታውሻለሁ። ይህ እምነት መጀመሪያ በሴት አያትህ ሎይስ እና በእናትህ ኤውኒቄ ውስጥ ኖረ፤ በአንተም ውስጥ እንዳለ እርግጠኛ ነኝ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπόμνησιν λαβών
  choice: ትዝ ብሎኛል
  rationale: የመታሰብን ወይም የመታወስን ሐሳብ በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል፤ የማስታወሱን ምንጭ ግን ጽሑፉ ስላልገለጠ አይጨምርም።
- source_word: ἀνυποκρίτου πίστεως
  choice: ግብዝነት የሌለበት እምነት
  rationale: ἀνυπόκριτος የሚለውን ‘ያልተመሰለ፣ ግብዝነት የሌለበት’ ትርጉም በቀጥታና በግልጽ ሁኔታ ያስተላልፋል።
- source_word: ἐνῴκησεν
  choice: ውስጥ ኖረ
  rationale: የἐνοικέωን ‘በውስጥ መኖር’ ምስላዊ አነጋገር ይጠብቃል፤ ‘ነበረ’ ብቻ በማለት የግሱን ኃይል አያዳክምም።
- source_word: μάμμῃ
  choice: ሴት አያትህ
  rationale: የግሪኩ ቃል በግልጽ ሴት አያትን ስለሚያመለክት፣ በአማርኛ ‘አያት’ ያለውን የፆታ አሻሚነት ያስወግዳል።
- source_word: πέπεισμαι
  choice: እርግጠኛ ነኝ
  rationale: የተረጋገጠ ውስጣዊ እምነትን የሚገልጠውን ፍጹም ግስ በተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: ἐν σοὶ የሚለው አገላለጽ እምነቱን ‘የአንተ እምነት’ ብሎ ወይም ‘በውስጥህ ያለ’ ብሎ መተርጎም
  choice: በውስጥህ ያለው … እምነት
  alternative: እምነትህ
  rationale: የግሪኩን ἐν የቦታ ምስል ይጠብቃል፣ ከἐνῴκησεν ጋርም ያለውን የ‘መኖር’ ትስስር ሳይፈታ ያቀርባል።
- issue: በሎይስና በኤውንቄ የኖረው እምነት ቁጥራዊ አንድ እምነት ወይም ተመሳሳይ የእምነት ባሕርይ መሆኑ
  choice: የጽሑፉን አንድ እምነት የሚል ምስላዊ አነጋገር ማቆየት
  alternative: ‘እንደዚህ ያለ እምነት’ ብሎ መፍታት
  rationale: ጽሑፉ እምነትን በሰዎቹ ውስጥ እንደሚኖር ገልጦ ያቀርባል፤ ይህን ምስል ወደ ተወሰነ ሥነ መለኮታዊ ማብራሪያ አይቀይርም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ አማርኛ ተጠቅሟል። የግሪኩ ‘በውስጥ መኖር’ ምስል ተጠብቋል፤ የሴት አያትነትም በግልጽ ተገልጧል።
