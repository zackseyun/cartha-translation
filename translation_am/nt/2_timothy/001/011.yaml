  text: for which I was appointed a herald and an apostle and a teacher[a].
translation:
  language: am
  text: ለዚህ እኔ አዋጅ ነጋሪ፣ ሐዋርያና አስተማሪ ሆኜ ተሾምኩ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “አዋጅ ነጋሪ” የሚለው “ሰባኪ” ተብሎም ሊተረጎም ይችላል። የግሪኩ ቃል በይፋ መልእክት እንዲያሰማ የተሾመን ሰው ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: ለዚህም
  rationale: ወደ ቀደመው ዐውደ ንባብ፣ ማለትም ወንጌሉን ወይም ስለ ጌታ የሚሰጠውን ምስክርነት ያመለክታል፤ ‘ለዚህም’ ዓላማንና የኋላ ማጣቀሻውን በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: ἐτέθην
  choice: ተሾምኩ
  rationale: በዚህ የኃላፊነት ዐውድ የግሡ ተገብሮ ቅርጽ በአገልግሎት ሚና መሾምን ወይም መመደብን ያመለክታል፤ አካላዊ ማስቀመጥን አያመለክትም።
- source_word: ἐγὼ
  choice: እኔ
  rationale: በግሪኩ በግልጽ የተጠቀሰውን ተውላጠ ስምና ያለውን መጠነኛ አጽንዖት ይጠብቃል።
- source_word: κῆρυξ
  choice: አዋጅ ነጋሪ
  rationale: ቃሉ በይፋ መልእክት እንዲያሰማ የተሾመን አዋጅ ነጋሪ ያመለክታል፤ ይህ ከኋለኛው የቤተ ክርስቲያን ማዕረግ ይልቅ የተላከ ይፋዊ አዋጅ አቅራቢነቱን ያጎላል።
- source_word: ἀπόστολος
  choice: ሐዋርያ
  rationale: ጳውሎስ ራሱን በሚጠቅስበት ዐውድ የታወቀውን ሐዋርያዊ ማዕረግ ያመለክታል፤ በአማርኛም የተለመደና ትክክለኛ ቃል ነው።
- source_word: διδάσκαλος
  choice: አስተማሪ
  rationale: የቃሉን ቀጥተኛና ተራ ትርጉም በግልጽ ዘመናዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: κῆρυξን በባህላዊው የቤተ ክርስቲያን ቃል ‘ሰባኪ’ ወይም በይፋ የተሾመ አዋጅ አቅራቢን በሚያመለክተው ‘አዋጅ ነጋሪ’ መተርጎም
  choice: አዋጅ ነጋሪ
  alternative: ሰባኪ
  rationale: ‘አዋጅ ነጋሪ’ በግሪኩ ያለውን የተሾመ ይፋዊ አዋጅ አቅራቢነት ይጠብቃል፤ ‘ሰባኪ’ ግን ቃሉን ወደ ኋለኛ የቤተ ክርስቲያን ሚና ሊያጠብበው ይችላል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ሦስት የአገልግሎት ሚናዎች በትይዩ አወቃቀር ቀርበዋል፤ የጳውሎስ አጽንዖትም ‘እኔ’ በማለት ተጠብቋል።
