  - severity: medium
    issue: Personal trust construction is insufficiently clear
    rationale: “ያመንሁት ማን እንደሆነ” is grammatically understandable, but can be heard as ‘whose words I believed.’ “በማን እንዳመንሁ” more clearly represents πιστεύω with a personal dative while retaining the unnamed referent.
