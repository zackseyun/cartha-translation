id: 2TI.1.2
reference: 2 Timothy 1:2
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Τιμοθέῳ ἀγαπητῷ τέκνῳ· χάρις, ἔλεος, εἰρήνη ἀπὸ θεοῦ πατρὸς καὶ Χριστοῦ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/002.yaml
  text: 'To Timothy[a], beloved child: grace, mercy, and peace from God the Father and Messiah Jesus our Lord.'
translation:
  language: am
  text: ለውዱ ልጅ ለጢሞቴዎስ፤ ከእግዚአብሔር አብና ከጌታችን ከመሲሕ[a] ኢየሱስ ጸጋ፣ ምሕረትና ሰላም ይሁንልህ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ክርስቶስ።” የግሪኩ Χριστός የማዕረግ ትርጉሙን ለመጠበቅ እዚህ “መሲሕ” ተብሎ ተተርጉሟል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγαπητῷ
  choice: ለተወደደው
  rationale: የፍቅርንና የቅርበትን ክብደት ይጠብቃል፤ ‘ውድ’ ከሚለውም ይበልጥ የግሪኩን ተገብሮ ያሳያል።
- source_word: τέκνῳ
  choice: ልጅ
  rationale: መንፈሳዊ የወላጅነት ዝምድናን የሚገልጠውን ዘይቤ ይጠብቃል፤ ግሪኩ በቀጥታ ‘ወንድ ልጅ’ አይልም።
- source_word: χάρις
  choice: ጸጋ
  rationale: በጳውሎስ ሰላምታዎች የተለመደውን እና ትርጉሙን በትክክል የሚያስተላልፈውን ቃል ይጠቀማል።
- source_word: ἔλεος
  choice: ምሕረት
  rationale: ከጸጋና ከሰላም የተለየውን የቃሉን ትርጉም ይጠብቃል።
- source_word: εἰρήνη
  choice: ሰላም
  rationale: የግሪኩን ቀጥተኛ ትርጉምና ሰፊ መንፈሳዊ ድምፅ ይጠብቃል።
- source_word: θεοῦ πατρὸς
  choice: እግዚአብሔር አብ
  rationale: ግሪኩ ‘የእኛ’ የሚል ባለቤትነት ስለሌለው ‘እግዚአብሔር አብ’ በማለት የምንጩን አገላለጽ ይጠብቃል።
- source_word: Χριστοῦ
  choice: መሲሕ
  rationale: Χριστός እዚህ የቅቡዕነት ማዕረግ ስለሆነ ትርጉሙን በሚገልጠው ‘መሲሕ’ ተተርጉሟል።
- source_word: κυρίου
  choice: ጌታ
  rationale: ሥልጣንንና ክርስቶሳዊ ክብርን ሳያጠብ ቀጥተኛውን ትርጉም ይሰጣል።
theological_decisions:
- issue: የΧριστοῦ Ἰησοῦ አተረጓጎም
  choice: መሲሕ ኢየሱስ
  alternative: ክርስቶስ ኢየሱስ
  rationale: Χριστός በዚህ ሰላምታ ውስጥ የማዕረግ ኃይሉን ይዞአል፤ ‘መሲሕ’ የሚለው ትርጉም ይህን ይገልጣል፣ ባህላዊው አጠራር ግን በማስታወሻ ተጠብቋል።
- issue: በሰላምታው ውስጥ የግስ መጨመር
  choice: ይሁንልህ
  alternative: ጸጋ፣ ምሕረትና ሰላም
  rationale: በግሪኩ ግሱ ቢታሰብም በጽሑፍ አልተገለጸም፤ በተፈጥሯዊ አማርኛ ሰላምታውን ግልጽ ለማድረግ ‘ይሁንልህ’ ተጨምሯል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘የእኔ’ የሚል ቃል በግሪኩ ስለሌለ አልተጨመረም፤ የመነሻ ምንጮቹን ለማመልከት ‘ከ…ና ከ…’ የሚለው አወቃቀር ተጠብቋል።
