id: 2TI.1.1
reference: 2 Timothy 1:1
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ κατ’ ἐπαγγελίαν ζωῆς τῆς ἐν Χριστῷ Ἰησοῦ
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/001.yaml
  text: Paul[a], an apostle of Messiah Jesus by the will of God, according to the promise of the life that is in Messiah Jesus,
translation:
  language: am
  text: ጳውሎስ፣ በእግዚአብሔር ፈቃድ የመሲሕ ኢየሱስ ሐዋርያ፣ በመሲሕ ኢየሱስ ያለው የሕይወት ተስፋ መሠረት፣
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Παῦλος
  choice: ጳውሎስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የግል ስም ቅርጽ ይጠብቃል።
- source_word: ἀπόστολος
  choice: ሐዋርያ
  rationale: በጳውሎስ ራስ-መግለጫ ውስጥ ያለውን የተለየ የተልእኮ ማዕረግ ይጠብቃል፤ እንደ ‘መልእክተኛ’ ወደ አጠቃላይ ትርጉም አያሳንሰውም።
- source_word: Χριστοῦ Ἰησοῦ / Χριστῷ Ἰησοῦ
  choice: መሲሑ ኢየሱስ
  rationale: Χριστός በዚህ ስፍራ የማዕረግ ኃይሉን ስለሚጠብቅ ‘መሲሑ’ ተብሎ ተተርጉሟል፤ የተለመደው ‘ክርስቶስ ኢየሱስ’ በግርጌ ማስታወሻ ቀርቧል።
- source_word: διὰ θελήματος θεοῦ
  choice: በእግዚአብሔር ፈቃድ
  rationale: διά ከዘር አገባብ ጋር እዚህ መለኮታዊ ሥልጣንንና ምንጭነትን ያመለክታል፤ ይህ አገላለጽ ተፈጥሯዊና ግልጽ ነው።
- source_word: κατ’ ἐπαγγελίαν
  choice: ተስፋውን መሠረት በማድረግ
  rationale: κατά እዚህ ከተስፋው ጋር ያለውን መስማማት ወይም ተዛምዶ ያሳያል፤ በአማርኛ ግልጽ ለማድረግ ይህ ሐረግ ተመርጧል።
- source_word: ζωῆς
  choice: የሕይወት
  rationale: የἐπαγγελίαν ዘር ተከታይ ሆኖ ‘የሕይወት ተስፋ’ የሚለውን ግንኙነት በቀጥታ ይገልጣል።
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: በመሲሑ ኢየሱስ ያለውን
  rationale: መስተዋድዱ ሕይወቱ በመሲሑ ኢየሱስ ውስጥ እንዳለ የሚገልጸውን የἐν ግንኙነታዊ ኃይል ይጠብቃል።
theological_decisions:
- issue: የΧριστός አተረጓጎም
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: ቃሉ እዚህ የማዕረግ ትርጉሙን ግልጽ አድርጎ ስለሚይዝ ‘መሲሕ’ ተመርጧል፤ የስም መሰል ባህላዊው ቅርጽ ‘ክርስቶስ’ እንደ አማራጭ ተጠብቋል።
- issue: κατ’ ἐπαγγελίαν ከሐዋርያነቱ ጋር ያለው ግንኙነት
  choice: የሐዋርያነቱ ተልእኮ ከሕይወት ተስፋው ጋር እንደሚስማማ መግለጽ
  alternative: ጳውሎስ ለተስፋው ሲል ሐዋርያ እንደሆነ መግለጽ
  rationale: κατά በዋናነት መስማማትን ወይም መመዘኛን ይገልጣል፤ ጽሑፉ የዓላማ ግንኙነትን በግድ አያረጋግጥም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ረጅም የመግቢያ ሐረግ ቅደም ተከተሉ በአማርኛ ተፈጥሯዊ እንዲሆን በመጠኑ ተደራጅቷል፣ ነገር ግን የአረፍተ ነገሩ ግንኙነቶች ተጠብቀዋል።
