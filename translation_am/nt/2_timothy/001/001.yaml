revisions:
- from: 'ጳውሎስ፣ በእግዚአብሔር ፈቃድ እና በመሲሑ[a] ኢየሱስ ያለውን የሕይወት ተስፋ መሠረት በማድረግ፣ የመሲሑ ኢየሱስ ሐዋርያ፣


