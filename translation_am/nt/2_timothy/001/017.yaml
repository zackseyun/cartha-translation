lexical_decisions:
- source_word: ἀλλὰ
  choice: ነገር ግን
  rationale: ከቀደመው አውድ ጋር ያለውን ተቃርኖ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: γενόμενος ἐν Ῥώμῃ
  choice: በሮም በነበረ ጊዜ
  rationale: የግሪኩን አሻሚነት ሳያጠብ፣ በሮም መገኘቱን በተፈጥሯዊ አማርኛ ይገልጣል፤ አገላለጹ ‘ወደ ሮም በመጣ ጊዜ’ የሚለውንም ሊያመለክት ይችላል።
- source_word: σπουδαίως
  choice: በትጋት
  rationale: ቃሉ የሚያመለክተውን ከፍተኛ ጥረትና ቁምነገር በግልጽ፣ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἐζήτησέν με
  choice: ፈልጎኝ
  rationale: የታሰበበትን ሰው ለማግኘት በንቃት መፈለግን ያሳያል፤ ከ‘በትጋት’ ጋርም ተፈጥሯዊ ነው።
- source_word: καὶ εὗρεν
  choice: አገኘኝ
  rationale: የፍለጋውን ውጤት በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል፤ በግሪኩ ከቀደመው ሐረግ የሚገኘውን ‘እኔን’ በአማርኛው ግስ ውስጥ ያካትታል።
