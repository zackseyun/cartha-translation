    text: ወይም፣ “ወደ ሮም በመጣ ጊዜ”፤ በቃል ቅርብ፣ “በሮም ሆኖ።” የግሪኩ γενόμενος በዚህ አገባብ በሮም መገኘቱን ወይም ወደዚያ መምጣቱን ሊያመለክት ይችላል።
