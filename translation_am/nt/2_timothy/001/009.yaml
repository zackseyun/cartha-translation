translation:
  language: am
  text: እርሱ ያዳነንና በቅዱስ ጥሪ የጠራን[a] ነው፤ ይህም በሥራዎቻችን መሠረት ሳይሆን፣ በራሱ ዓላማና ጸጋ መሠረት ነው። ይህ ጸጋ በመሲሑ ኢየሱስ[b] ከዘላለማዊ ዘመናት በፊት[c][d] የተሰጠን ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ወደ ቅዱስ ጥሪ የጠራን» ወይም «በቅዱስ ጥሪ አማካይነት የጠራን»። የግሪኩ ዳቲቭ ከአንድ በላይ መንገድ ሊገባ ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «በክርስቶስ ኢየሱስ»። በዋናው ጽሑፍ Χριστός እንደ ማዕረግ ተወስዶ «መሲሑ» ተብሏል።
    reason: alternative_reading
  - marker: c
    text: ወይም፣ «ዘመናት ከመጀመራቸው በፊት» ወይም ይበልጥ ፈሊጣዊ በሆነ አገላለጽ፣ «ጊዜ ከመጀመሩ በፊት»።
    reason: lexical_alternative
  - marker: d
    text: ወይም፣ «ከዘላለም ጊዜያት በፊት»።
