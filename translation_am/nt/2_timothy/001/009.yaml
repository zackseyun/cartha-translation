lexical_decisions:
- source_word: σώσαντος
  choice: ያዳነን
  rationale: σῴζω በዚህ የጳውሎስ አውድ የመዳንን ሥነ መለኮታዊ ክብደት ይይዛል፤ «ያዳነን» መደበኛና ግልጽ አማርኛ ነው።
- source_word: καλέσαντος
  choice: የጠራን
  rationale: ከ«ያዳነን» ጋር ያለውን ትይዩ አወቃቀርና መለኮታዊ ጥሪን ይጠብቃል።
- source_word: κλήσει ἁγίᾳ
  choice: በቅዱስ ጥሪ
  rationale: የግሪኩን ዳቲቭ በቅርብ የሚከተልና በአማርኛ ተፈጥሯዊ ነው፤ የመንገድ፣ የመሣሪያ ወይም የዓላማ ንባብ ሊኖረው ስለሚችል አማራጮቹ በማስታወሻ ተጠቅሰዋል።
- source_word: οὐ κατὰ τὰ ἔργα ἡμῶν
  choice: በራሳችን ሥራ መሠረት ሳይሆን
  rationale: κατά የመለኪያን ወይም የመሠረትን ሐሳብ ይገልጣል፤ «ሥራ» የጳውሎስን ቁልፍ ቃል ይጠብቃል።
- source_word: ἰδίαν πρόθεσιν
  choice: በራሱ ዓላማ
  rationale: ἰδίαν በአውዱ ወደ እግዚአብሔር ይመለሳል፤ «ዓላማ» ለπρόθεσις ግልጽና ተገቢ ነው።
- source_word: χάριν
  choice: ጸጋ
  rationale: «ጸጋ» የχάριςን መደበኛ ሥነ መለኮታዊ ትርጉም ይጠብቃል።
- source_word: τὴν δοθεῖσαν ἡμῖν
  choice: ይህ ጸጋ … የተሰጠን ነው
  rationale: የግሪኩ ሴት ፆታ አንቀጽና ተሳቢ ከχάριν ጋር ይስማማሉ፤ በአማርኛ ማጣቀሻውን «ይህ ጸጋ» ብሎ መድገም ግልጽነትን ይጨምራል።
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: በመሲሑ ኢየሱስ
  rationale: Χριστός እዚህ የማዕረግ ሐሳቡን ይዞ ስለሚገኝ «መሲሑ» ተብሎ ተተርጉሟል፤ Ἰησοῦ ደግሞ እንደ ስም «ኢየሱስ» ተብሏል።
- source_word: πρὸ χρόνων αἰωνίων
  choice: ከዘላለማዊ ዘመናት በፊት
  rationale: የግሪኩን ልዩ የጊዜ አገላለጽ በቅርብ ይጠብቃል፤ «ጊዜ ከመጀመሩ በፊት» የሚለው ይበልጥ ፈሊጣዊ አማራጭ በማስታወሻ ቀርቧል።
theological_decisions:
- issue: የΧριστῷ አተረጓጎም፦ ማዕረግ ወይስ የስም ክፍል
  choice: በመሲሑ ኢየሱስ
  alternative: በክርስቶስ ኢየሱስ
  rationale: በዚህ ቀመር ውስጥ Χριστός ማዕረጋዊ ትርጉሙን እንደያዘ ተቆጥሯል፤ ስለዚህ ትርጉሙን የሚያሳየው «መሲሑ» ተመርጧል።
- issue: የκλήσει ἁγίᾳ ዳቲቭ ኃይል
  choice: በቅዱስ ጥሪ
  alternative: ወደ ቅዱስ ጥሪ / በቅዱስ ጥሪ አማካይነት
  rationale: የግሪኩ አወቃቀር መሣሪያን፣ መንገድን ወይም የጥሪውን ይዘትና ዓላማ ሊያመለክት ይችላል። ዋናው ጽሑፍ አጭርና በአንጻራዊነት ክፍት ሆኖ ተቀምጧል፣ ልዩ ንባቦቹም በማስታወሻ ተገልጠዋል።
- issue: ጸጋው የተሰጠበት ጊዜ
  choice: ከዘላለማዊ ዘመናት በፊት
  alternative: ዘመናት ከመጀመራቸው በፊት / ጊዜ ከመጀመሩ በፊት
  rationale: ምንጩ የሚጠቀመውን ያልተለመደ አገላለጽና ሥነ መለኮታዊ ውጥረት ሳያለሰልስ ለመጠበቅ ቅርብ አተረጓጎም ተመርጧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ረጅሙ የግሪክ አረፍተ ነገር ለአማርኛ ንባብ ግልጽነት በሁለት ዓረፍተ ነገሮች ተከፍሏል፤ የጸጋው ማጣቀሻ ግልጽ እንዲሆን «ይህ ጸጋ» ተደግሟል።
