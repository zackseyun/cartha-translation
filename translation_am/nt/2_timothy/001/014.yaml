  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «አደራ» የሕግ ወይም የባንክ ቴክኒካዊ ቃልን ሳያስገባ የግሪኩን የጥበቃ ምሳሌ ይጠብቃል፤ የአረፍተ ነገሩ ቅደም ተከተልም ለአማርኛ ተፈጥሯዊ ሆኖ ትእዛዙን በመጨረሻ ያስቀምጣል።
