lexical_decisions:
- source_word: παραθήκην
  choice: አደራ
  rationale: ቃሉ ለጥበቃ የተሰጠን ነገር ያመለክታል፤ «አደራ» ይህን የተሰጠ ኃላፊነትና ውድ ነገር የመጠበቅ ምሳሌያዊ ሐሳብ በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: καλὴν
  choice: መልካሙን
  rationale: እዚህ καλός አደራው በራሱ መልካምና ክቡር መሆኑን ይገልጣል፤ «መልካም» የውበትን ወይም የዋጋን ገጽታ ብቻ አጉልቶ ሳያሳይ ሰፊውን ትርጉም ይጠብቃል።
- source_word: φύλαξον
  choice: ጠብቅ
  rationale: የትእዛዝ ቅርጹ አደራውን በንቃት እንዲጠብቅና እንዲከላከልለት ይጠይቃል፤ «ጠብቅ» በአማርኛ ሁለቱንም ገጽታዎች በቀጥታ ያስተላልፋል።
- source_word: διὰ πνεύματος ἁγίου
  choice: በመንፈስ ቅዱስ አማካይነት
  rationale: διά ከባለቤት አመልካች ጋር መንገድን ወይም ወኪልነትን ያመለክታል፤ «አማካይነት» ጥበቃው በመንፈስ ቅዱስ ኃይልና እርዳታ እንደሚከናወን ሳያብራራ የመሣሪያነቱን ግንኙነት ያቆያል።
- source_word: τοῦ ἐνοικοῦντος ἐν ἡμῖν
  choice: በውስጣችን በሚኖረው
  rationale: ἐνοικοῦντος ቀጣይ የሆነ ውስጣዊ መኖርን ይገልጣል፤ «በውስጣችን በሚኖረው» ቴክኒካዊ ቃል ሳይጠቀም ይህን በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐν ἡμῖν
  choice: በውስጣችን
  rationale: ይህ ቀጥተኛውን «በእኛ ውስጥ» የሚለውን ትርጉም በተፈጥሯዊ አማርኛ ይሰጣል፤ «እኛ» ማንን እንደሚያጠቃልል ግን አያጠብም።
theological_decisions:
- issue: «መልካሙ አደራ» የሚያመለክተው
  choice: ሐረጉ «መልካሙ አደራ» ተብሎ በአጠቃላይ ተቀምጧል።
  alternative: ወንጌል ወይም ለጢሞቴዎስ የተሰጠው የአገልግሎት ኃላፊነት ተብሎ በግልጽ መተርጎም።
  rationale: ዐውደ ንባቡ ሐዋርያዊውን መልእክትና አደራ የሚያመለክት ቢመስልም፣ የግሪኩ አገላለጽ አጭርና ምሳሌያዊ ነው። ትርጉሙ ይህን ክፍትነት ጠብቋል።
- issue: «በውስጣችን» የሚለው ተውላጠ ስም ወሰን
  choice: «በውስጣችን» ተብሎ ያለ ተጨማሪ ማብራሪያ ተቀምጧል።
  alternative: ጳውሎስንና ጢሞቴዎስን ብቻ ወይም ሁሉንም አማኞች በግልጽ እንዲያመለክት ማስፋት።
  rationale: ἡμῖν በቅርቡ ጳውሎስንና ጢሞቴዎስን ሊያመለክት ይችላል፤ ሰፋ ብሎም የአማኞችን ማኅበረሰብ ሊያካትት ይችላል። ተውላጠ ስሙን እንዳለ ማቆየት ይህን የትርጉም ውጥረት ይጠብቃል።
