  text: always learning and never able to come to the knowledge of the truth[a].
translation:
  language: am
  text: ሁልጊዜ እየተማሩ፣ ወደ የእውነት እውቀት[a] ለመድረስ ፈጽሞ የማይችሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የእውነትን የተሟላ እውቀት።” የግሪኩ ቃል የተሟላ ወይም የጠለቀ እውቀትን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: ሁልጊዜ
  rationale: ቀጣይና ተደጋጋሚ ድርጊትን በተፈጥሯዊ አማርኛ ይገልጻል፤ ከ‘ፈጽሞ’ ጋር ያለውን ንጽጽርም ያቆያል።
- source_word: μανθάνοντα
  choice: የሚማሩ
  rationale: በቀደመው ቁጥር የተጠቀሱትን ሴቶች የሚያመለክተውን የቀጣይ ተሳቢ አገላለጽ ያቆያል፤ መማሩ መደበኛ ትምህርት መሆኑን አይገድብም።
- source_word: μηδέποτε
  choice: ፈጽሞ አይ…ም
  rationale: ‘ሁልጊዜ’ ከሚለው ጋር ያለውን ጠንካራ ተቃርኖ በተፈጥሯዊ የአማርኛ አሉታዊ አገላለጽ ያስተላልፋል።
- source_word: εἰς ἐπίγνωσιν ἀληθείας
  choice: የእውነትን እውቀት
  rationale: ወደ እውነት እውቀት መድረስን በተፈጥሯዊ አማርኛ ይገልጻል፤ ἐπίγνωσις ሊኖረው የሚችለውን ‘ሙሉ እውቀት’ የሚል ጠንካራ ልዩነት በዋናው ጽሑፍ ላይ አያስገድድም።
- source_word: ἐλθεῖν
  choice: ሊያገኙ
  rationale: በግሪኩ ያለውን ወደ እውቀት መምጣት ወይም መድረስ ትርጉም በአማርኛ ከ‘እውቀት’ ጋር በተፈጥሮ በሚጣመር አገላለጽ ያቀርባል።
- source_word: δυνάμενα
  choice: ሊያገኙ … አይችሉም
  rationale: ችሎታን የሚገልጸውን ተሳቢ ቅርጽ በግልጽና በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: በጳውሎሳዊ አጠቃቀም የἐπίγνωσις ትርጉም ስፋት
  choice: እውቀት
  alternative: ሙሉ እውቀት
  rationale: ቃሉ የተሟላ ወይም ጥልቅ እውቀትን ሊያመለክት ቢችልም፣ በዚህ አውድ ዋናው ነጥብ ሁልጊዜ እየተማሩ ሳሉ እውነትን ወደ ማወቅ አለመድረሳቸው ነው። ስለዚህ በዋናው ጽሑፍ ‘እውቀት’ ተመርጦ ጠንከር ያለው አማራጭ በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። ‘የሚማሩ’ የሚለው የዝርዝሩን ቀጣይነትና ከቀደመው ቁጥር ጋር ያለውን ሰዋሰዋዊ ግንኙነት ያቆያል።
