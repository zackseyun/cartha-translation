- source_word: πάντες οἱ θέλοντες
  choice: የሚፈልጉ ሁሉ
  rationale: የπάντεςን ሁሉን አቀፍ ወሰንና የθέλοντεςን ፈቃድ/ፍላጎት በግልጽ አማርኛ ይጠብቃል።
- source_word: ζῆν εὐσεβῶς
