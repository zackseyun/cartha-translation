  rationale: εὐσεβῶς የሚያመለክተውን ለእግዚአብሔር ያደረ አኗኗር በተፈጥሯዊና ለዘመናዊ አንባቢ ግልጽ በሆነ አገላለጽ ያቀርባል።
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: በመሲሑ ኢየሱስ ሆነው
  rationale: ἐν የሚገልጸውን በመሲሑ ውስጥ ያለ ሕይወት፣ ግንኙነትና ኅብረት ብቻ እንደ ስፍራ ሳያቀርብ ያሳያል፤ Χριστόςም እዚህ እንደ ማዕረግ “መሲሕ” ተብሎ ተተርጉሟል።
- source_word: διωχθήσονται
  choice: ስደት ይደርስባቸዋል
  rationale: የወደፊት ጊዜ ተደራጊ ቅርጹንና የጠላትነት ስደት ትርጉሙን በተለመደ አማርኛ ይገልጻል።
