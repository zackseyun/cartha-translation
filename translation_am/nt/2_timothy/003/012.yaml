  text: And indeed[a], all who want to live godly in Messiah Jesus will be persecuted.
translation:
  language: am
  text: እንዲያውም፣ በመሲሕ ኢየሱስ[a] ውስጥ እግዚአብሔርን በሚያከብር መንገድ መኖር የሚፈልጉ ሁሉ ይሰደዳሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
