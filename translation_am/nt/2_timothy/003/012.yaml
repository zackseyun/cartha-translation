translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው አማርኛ ተጠቅሟል። “እግዚአብሔርን በማክበር” የሃይማኖታዊና የሥነ ምግባራዊ አኗኗርን ያጣምራል፤ “ስደት ይደርስባቸዋል” ደግሞ ግልጽና ተፈጥሯዊ ነው።
