  yaml_path: translation/nt/2_timothy/003/015.yaml
  text: and that from infancy you have known the sacred writings[b][a], which are able to make you wise for salvation through faith in Messiah Jesus.
translation:
  language: am
  text: ከሕፃንነትህም ጀምሮ ቅዱሳት ጽሑፎችን[a] ታውቃለህ፤ እነዚህም በመሲሑ ኢየሱስ ላይ ባለው እምነት[b] ለድነት ጥበበኛ ሊያደርጉህ ይችላሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ቅዱሳት መጻሕፍትን።” የግሪክ ንባብ ቃል በቃል “ቅዱሳት ጽሑፎች” ይላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በመሲሑ ኢየሱስ ታማኝነት።” ሆኖም “በመሲሑ ኢየሱስ ላይ ያለ እምነት” የሚለው በዚህ ስፍራ ይበልጥ ተፈጥሯዊ ትርጉም ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπὸ βρέφους
  choice: ከሕፃንነትህ ጀምሮ
  rationale: βρέφος እጅግ ትንሽ ልጅን፣ ሕፃንንም ሊያመለክት ስለሚችል፣ ከልጅነትህ ይልቅ የግሪኩን ጠንካራ ሐሳብ ይጠብቃል።
- source_word: ἱερὰ γράμματα
  choice: ቅዱሳት ጽሑፎች
  rationale: የግሪኩን ‘sacred writings’ ቀጥተኛ ፍቺ ይጠብቃል፤ በኋላ የተለመደውን ቴክኒካዊ ስያሜ በጽሑፉ ላይ አያስገድድም።
- source_word: οἶδας
  choice: እንደምታውቅ ታውቃለህ
  rationale: οἶδα በቅርጹ ፍጹም ቢሆንም የአሁን ጊዜ ትርጉም አለው፤ ከሕፃንነት ጀምሮ የቆየውን እውቀት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τὰ δυνάμενά σε σοφίσαι
  choice: ጥበበኛ ሊያደርጉህ ይችላሉ
  rationale: ጽሑፎቹ ጥበብን የመስጠት ችሎታ እንዳላቸው በቀጥታና በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: εἰς σωτηρίαν
  choice: ለድነት
  rationale: εἰς የዓላማን ወይም የውጤትን አቅጣጫ ያሳያል፤ ‘ለድነት’ አጭርና ተፈጥሯዊ ነው።
- source_word: διὰ πίστεως
  choice: ባለው እምነት
  rationale: πίστις በዚህ አውድ በመሲሑ ኢየሱስ ላይ የሚደረግን እምነት በተፈጥሯዊ ሁኔታ ያመለክታል።
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: በመሲሑ ኢየሱስ
  rationale: Χριστός እዚህ የማዕረግ ስያሜ ሆኖ ስለሚሠራ፣ ‘መሲሕ’ ብሎ መተርጎም ትርጉሙን ይጠብቃል።
theological_decisions:
- issue: Χριστῷ እንደ ማዕረግ ወይም እንደ ስም አካል መተርጎም
  choice: መሲሑ ኢየሱስ
  alternative: ክርስቶስ ኢየሱስ
  rationale: Χριστός የ‘መሲሕ’ ማዕረግን ይይዛል፤ ትርጉሙ ይህን ማዕረጋዊ ኃይል በግልጽ ያቆያል።
- issue: πίστεως በδιὰ πίστεως τῆς ἐν Χριστῷ Ἰησοῦ ያለው ትርጉም
  choice: በመሲሑ ኢየሱስ ያለ እምነት
  alternative: በመሲሑ ኢየሱስ ታማኝነት
  rationale: የሰዋሰው ግንባታ በተፈጥሮ በመሲሑ ኢየሱስ ላይ ያለን እምነት ያመለክታል፤ አነስተኛ ዕድል ያለው የ‘ታማኝነት’ አማራጭ ግን በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የቁጥሩን ከቀደመው ንግግር ጋር ያለ ትስስር “-ም” ይጠብቃል፤ የግሪኩ የተራዘመ አወቃቀር ለግልጽነት በሁለት ዋና ሐረጎች ቀርቧል።
