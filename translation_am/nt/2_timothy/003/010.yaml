id: 2TI.3.10
reference: 2 Timothy 3:10
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Σὺ δὲ ⸀παρηκολούθησάς μου τῇ διδασκαλίᾳ, τῇ ἀγωγῇ, τῇ προθέσει, τῇ πίστει, τῇ μακροθυμίᾳ, τῇ ἀγάπῃ, τῇ ὑπομονῇ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/010.yaml
  text: But you have closely followed my teaching[a], conduct, purpose, faith, patience, love, endurance,
translation:
  language: am
  text: አንተ ግን ትምህርቴን፣ አኗኗሬን፣ ዓላማዬን፣ እምነቴን[a]፣ ትዕግሥቴን፣ ፍቅሬንና ጽናቴን በቅርብ ተከታትለሃል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ታማኝነቴን።” በዚህ ዐውደ ንባብ የግሪኩ ቃል እምነትን ወይም ታማኝነትን ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: Σὺ δὲ
  choice: አንተ ግን
  rationale: ግልጽ የሆነውን አንተ የሚለውን ተውላጠ ስምና δέ ከቀደመው ሐሳብ ጋር የሚያደርገውን ንጽጽር ይጠብቃል።
- source_word: παρηκολούθησάς
  choice: በቅርብ ተከታትለሃል
  rationale: በጥንቃቄ ማስተዋልን፣ ከአንድ ሰው አኗኗርና ትምህርት ጋር መተዋወቅን እና እነሱን መከተልን የሚያካትተውን የግሱን ስፋት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: μου
  choice: -ቴን / -ዬን / -ሬን
  rationale: የግሪኩ አንደኛ መደብ ባለቤትነት በአማርኛ ከእያንዳንዱ የዝርዝሩ ስም ጋር በባለቤትነት ቅጥያ ተገልጿል።
- source_word: διδασκαλίᾳ
  choice: ትምህርቴን
  rationale: ዘመናዊ፣ ግልጽና ከመጠን በላይ ሃይማኖታዊ ቴክኒካዊነት የሌለው ተመጣጣኝ ቃል ነው።
- source_word: ἀγωγῇ
  choice: አኗኗሬን
  rationale: ቃሉ የሚያመለክተውን የሕይወት አካሄድ ወይም ምግባር በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: προθέσει
  choice: ዓላማዬን
  rationale: የጸና ዓላማን ወይም የሕይወት አቅጣጫን በግልጽ ሁኔታ ያስተላልፋል።
- source_word: πίστει
  choice: እምነቴን
  rationale: እምነት የቃሉ ዋና እና የተለመደ ትርጉም ነው፤ በዚህ የበጎ ባሕርያት ዝርዝር ውስጥ ታማኝነትም ሊያመለክት ስለሚችል አማራጩ በማስታወሻ ተጠብቋል።
- source_word: μακροθυμίᾳ
  choice: ትዕግሥቴን
  rationale: በተለይ በሰዎች ፊት ወይም በአስቸጋሪ ሁኔታ ውስጥ መታገሥን የሚገልጽ የተለመደ አማርኛ ቃል ነው።
- source_word: ἀγάπῃ
  choice: ፍቅሬን
  rationale: ἀγάπηን በዘመናዊና ግልጽ አማርኛ በቀጥታ ይገልጻል።
- source_word: ὑπομονῇ
  choice: ጽናቴን
  rationale: በመከራ ወይም በፈተና ሥር ጸንቶ መቆየትን ያሳያል፤ ከμακροθυμία ትዕግሥት ጋርም ተገቢውን የትርጉም ልዩነት ይጠብቃል።
theological_decisions:
- issue: በጳውሎሳዊ የበጎ ባሕርያት ዝርዝር ውስጥ የπίστις አተረጓጎም
  choice: እምነት
  alternative: ታማኝነት
  rationale: በዚህ ዐውደ ንባብ ግላዊ እምነትም ሆነ ታማኝ መሆን በቃሉ ሊጠቆም ይችላል። ዋናው ጽሑፍ የተለመደውን እምነት ይዟል፤ እውነተኛውን የቃል አሻሚነት ላለማጥፋት ታማኝነት በማስታወሻ ቀርቧል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። የግሪኩ ዝርዝር ምት ተጠብቋል፤ በመጨረሻው ፍቅሬንና ጽናቴን የሚለው ተፈጥሯዊ የአማርኛ ማያያዣ ተጨምሯል።
