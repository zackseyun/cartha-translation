  yaml_path: translation/nt/2_timothy/003/009.yaml
  text: But they will not advance any further[a], for their foolishness will be plain to everyone[b], as that of those men also became.
translation:
  language: am
  text: 'ነገር ግን ከዚህ በላይ እድገት አያደርጉም፤[a] ሞኝነታቸው ለሁሉ ግልጽ ይሆናልና፣ የእነዚያ ሰዎችም ሞኝነት እንዲሁ ግልጽ ሆኖ ነበር።[b]


    [a] ወይም፣ “ከዚህ በላይ አይራመዱም።”


    [b] “እነዚያ ሰዎች” ማለት በቀደመው ቁጥር የተጠቀሱትን ያኔስንና ያምብሬስን ያመለክታል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከዚህ በላይ አይራመዱም።”
    reason: lexical_alternative
  - marker: b
    text: “እነዚያ ሰዎች” ማለት በቀደመው ቁጥር የተጠቀሱትን ያኔስንና ያምብሬስን ያመለክታል።
    reason: cross_reference
lexical_decisions:
- source_word: προκόψουσιν
  choice: ወደ ፊት አይሄዱም
  rationale: προκόπτω ወደ ፊት መሄድን ወይም እድገት ማድረግን ያመለክታል። በዚህ አውድ አዎንታዊ እድገትን ሳያመለክት የእነርሱ መስፋፋት እንደሚገታ የሚያሳይ ተፈጥሯዊ አማርኛ ነው።
- source_word: ἐπὶ πλεῖον
  choice: ከዚህ የበለጠ
  rationale: አገላለጹ ‘ይበልጥ’ ወይም ‘ከዚህ በላይ’ የሚል ትርጉም አለው፤ ከአሉታው ጋር ‘ከዚህ የበለጠ’ በአማርኛ ግልጽ ነው።
- source_word: ἄνοια
  choice: ሞኝነት
  rationale: ቃሉ የማስተዋል ጉድለትንና ሞኝነትን ያመለክታል፤ ‘ሞኝነት’ የአእምሯዊና የሥነ ምግባራዊ ጉድለቱን ገጽታ በግልጽ ያስተላልፋል።
- source_word: ἔκδηλος
  choice: ግልጽ
  rationale: ἔκδηλος በግልጽ የታየ ወይም የተገለጠ ማለት ነው፤ ‘ግልጽ ይሆናል’ ተፈጥሯዊና ዘመናዊ አገላለጽ ነው።
- source_word: πᾶσιν
  choice: ለሁሉ
  rationale: የግሪኩን ሁሉን አቀፍ ወሰን በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὡς καὶ ἡ ἐκείνων ἐγένετο
  choice: የእነዚያ ሰዎች ሞኝነት እንደተገለጠ ሁሉ
  rationale: ἡ ወደ ‘ሞኝነት’ የሚመለስ ስም የተተወበት አገላለጽ ነው፤ ἐκείνων ደግሞ ቀደም ሲል የተጠቀሱትን ሰዎች ያመለክታል። ሙሉ ሐረጉን በአማርኛ መግለጽ ንጽጽሩን ግልጽ ያደርጋል።
theological_decisions:
- issue: የἐκείνων አመልካች
  choice: “እነዚያ ሰዎች” በ3፥8 የተጠቀሱትን ያኔስንና ያምብሬስን ያመለክታል።
  alternative: በአጠቃላይ ቀደምት ሐሰተኛ አስተማሪዎችን ሊያመለክት ይችላል።
  rationale: የቅርብ አውዱ ያኔስንና ያምብሬስን በስም ይጠቅሳል፤ ስለዚህ የእነርሱ ሞኝነት መገለጥ ለአሁኖቹ ተቃዋሚዎች ማነጻጸሪያ ነው። ዋናው ጽሑፍ ‘እነዚያ ሰዎች’ በማለት አገናኙን ይጠብቃል፤ ማብራሪያው በእግር ማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ንጽጽር በአማርኛ ተፈጥሯዊ እንዲሆን የአንቀጾቹ ቅደም ተከተል ተስተካክሏል።
