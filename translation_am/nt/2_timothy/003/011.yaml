id: 2TI.3.11
reference: 2 Timothy 3:11
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τοῖς διωγμοῖς, τοῖς παθήμασιν, οἷά μοι ἐγένετο ἐν Ἀντιοχείᾳ, ἐν Ἰκονίῳ, ἐν Λύστροις, οἵους διωγμοὺς ὑπήνεγκα· καὶ ἐκ πάντων με ἐρρύσατο ὁ κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/011.yaml
  text: the persecutions[a], the sufferings, such as happened to me in Antioch, in Iconium, in Lystra—what persecutions I endured[b]; and from them all the Lord rescued me.
translation:
  language: am
  text: በአንጾኪያ፣ በኢቆንዮንና በልስጥራ የደረሱብኝን ስደቶችና መከራዎች፣ ምን ዓይነት ስደቶችን እንደታገሥሁ ታውቃለህ፤ ጌታም ከሁሉም አዳነኝ።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: «ጌታ» የሚለው ምናልባት ጌታ ኢየሱስን ያመለክታል፤ የግሪኩ ጽሑፍ ግን «ጌታ» ብቻ ይላል።
    reason: alternative_reading
lexical_decisions:
- source_word: διωγμοῖς / διωγμούς
  choice: ስደቶች / ስደት
  rationale: ቃሉ በእምነት ወይም በተልእኮ ምክንያት የሚደርስን ጠላትነትና ጭቆና ያመለክታል፤ «ስደት» በአማርኛ የተለመደና ከዐውዱ ጋር የሚስማማ ነው።
- source_word: παθήμασιν
  choice: መከራዎች
  rationale: ሰፊውን የሥቃይና የችግር ተሞክሮ ያሳያል፤ «መከራዎች» ትርጉሙን በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: οἷά μοι ἐγένετο
  choice: የደረሱብኝን ዓይነት
  rationale: οἷα ያለውን የዓይነትና የምሳሌነት ኃይል ይጠብቃል፤ ἐγένετο ደግሞ በተፈጥሯዊ አማርኛ «የደረሱብኝ» ተብሏል።
- source_word: ἐν Ἀντιοχείᾳ, ἐν Ἰκονίῳ, ἐν Λύστροις
  choice: በአንጾኪያ፣ በኢቆንዮንና በልስጥራ
  rationale: የቦታ ስሞቹ በተለመደው የአማርኛ መጽሐፍ ቅዱስ አጻጻፍ ተገልጸዋል፤ የግሪኩ ἐν መደጋገምም በ«በ» ተንጸባርቋል።
- source_word: οἵους διωγμοὺς
  choice: ምን ያህል ስደት
  rationale: οἵους እዚህ ያለውን ጥራታዊና አጽንዖታዊ ኃይል በተፈጥሯዊ አማርኛ ያሳያል፤ ሌላው ትርጉም በማስታወሻ [a] ተጠብቋል።
- source_word: ὑπήνεγκα
  choice: እንደታገሥሁ
  rationale: በጫና ሥር መሸከምንና ጸንቶ ማለፍን ይገልጻል፤ «ታገሥሁ» አጭርና ግልጽ ነው።
- source_word: ἐκ πάντων
  choice: ከሁሉም
  rationale: ከተጠቀሱት ስደቶችና መከራዎች ሁሉ መዳኑን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἐρρύσατο
  choice: አዳነኝ
  rationale: ከአደጋ ማስጣልን ወይም መታደግን ያመለክታል፤ «አዳነኝ» በዐውዱ የአደጋ መዳንን የሚያሳይ የተለመደ አገላለጽ ነው።
- source_word: ὁ κύριος
  choice: ጌታ
  rationale: የግሪኩን ማዕረግ ብቻ ይተረጉማል፤ በጽሑፉ የሌለውን «ኢየሱስ» ሳይጨምር የተጠቃሹን መጠነኛ አሻሚነት ይጠብቃል።
theological_decisions:
- issue: «ጌታ» የሚለው ማንን እንደሚያመለክት
  choice: በዋናው ጽሑፍ «ጌታ» ብቻ ተብሏል።
  alternative: «ጌታ ኢየሱስ»
  rationale: በጳውሎስ አጠቃቀም ምናልባት ኢየሱስን ያመለክታል፤ ሆኖም የግሪኩ ጽሑፍ ὁ κύριος ብቻ ስለሚል ስሙን በዋናው ጽሑፍ አልጨመርንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅመናል። ጥቅሱ ከቀደመው ዐረፍተ ነገር የቀጠለ ዝርዝር መሆኑ በመነሻው ተጠብቋል፤ «ታውቃለህ» የሚለው ከ3፥10 የሚቀጥለውን ሰዋሰዋዊ ግንኙነት ግልጽ ለማድረግ ተደግሟል።
