- source_word: ἀνήμεροι
  choice: ጨካኞች
  rationale: ቃሉ ያልተገራ፣ ጨካኝና ጭካኔ የተሞላበት ባሕርይን ያመለክታል፤ ‘ጨካኞች’ ለአማርኛ አንባቢ አጭርና ግልጽ ነው።
