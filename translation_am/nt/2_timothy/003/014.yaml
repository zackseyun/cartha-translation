  edition: SBLGNT
  text: σὺ δὲ μένε ἐν οἷς ἔμαθες καὶ ἐπιστώθης, εἰδὼς παρὰ ⸀τίνων ἔμαθες,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/014.yaml
  text: But as for you[a], remain in what you learned and became convinced of, knowing from whom you learned it[b],
translation:
  language: am
  text: አንተ ግን በተማርኸውና እርግጠኛ በሆንክበት[a] ነገር ጸንተህ ኑር፤ ይህን ከእነማን[b] እንደተማርክ እያወቅህ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የተረጋገጥህበት»።
    reason: lexical_alternative
  - marker: b
    text: አንዳንድ የእጅ ጽሑፎች «ከማን» የሚለውን የነጠላ ቁጥር ንባብ ይዘዋል፤ ይህም ብዙ ጊዜ ጳውሎስን እንደሚያመለክት ተደርጎ ይታያል። እዚህ የተከተለው የብዙ ቁጥር ንባብ የጢሞቴዎስን አስተማሪዎች በሰፊው ሊያመለክት ይችላል።
    reason: textual_variant
lexical_decisions:
- source_word: σὺ δὲ
  choice: አንተ ግን
  rationale: ግልጽ የሆነውን ተውላጠ ስምና ከቀደመው ንግግር ጋር ያለውን አጽንዖታዊ ንጽጽር ይጠብቃል።
- source_word: μένε ἐν οἷς
  choice: በ… ነገር ጸንተህ ኑር
  rationale: የአሁን ጊዜ ትእዛዙ ቀጣይ ጽናትን ያመለክታል፤ አገላለጹም በተማረው ውስጥ የመቆየትን ምሳሌያዊ ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἔμαθες
  choice: ተማርኸው
  rationale: ጢሞቴዎስ ቀድሞ የተቀበለውን ትምህርት ቀጥተኛና ተፈጥሯዊ በሆነ ያለፈ ጊዜ ይገልጣል።
- source_word: ἐπιστώθης
  choice: እርግጠኛ በሆንክበት
  rationale: ከተማረው ነገር ጋር የተያያዘውን የጸና እምነት ወይም ማረጋገጫ ይገልጣል፤ አማራጩም በማስታወሻ ተጠብቋል።
- source_word: εἰδὼς
  choice: እያወቅህ
  rationale: የግሪኩን አሳታፊ ቅርጽ በመጠበቅ እውቀቱ ምክንያት ነው ወይስ አብሮ የሚሄድ ሁኔታ ነው የሚለውን አሻሚነት አይወስንም።
- source_word: παρὰ τίνων
  choice: ከእነማን
  rationale: παρά ከዝርያ ሁኔታ ጋር የምንጭን ሐሳብ ይሰጣል፤ የSBLGNT ብዙ ቁጥርንም በግልጽ ሁኔታ ይጠብቃል።
theological_decisions:
- issue: የπαρὰ τίνων ተጠቃሽ ማንነት
  choice: በዋናው ጽሑፍ «ከእነማን» ብሎ በብዙ ቁጥርና ያለ ስም መተርጎም
  alternative: በነጠላ «ከማን» ብሎ መተርጎም፣ ይህም ብዙ ጊዜ ጳውሎስን እንደሚያመለክት ይታሰባል
  rationale: SBLGNT የብዙ ቁጥር ንባብን ይከተላል፤ ጥቅሱ ግን አስተማሪዎቹን በስም አይገልጽም። ስለዚህ ትርጉሙ ተጠቃሾቹን አይወስንም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። «ጸንተህ ኑር» የትእዛዙን ቀጣይነት በተፈጥሯዊ አገላለጽ ያሳያል።
