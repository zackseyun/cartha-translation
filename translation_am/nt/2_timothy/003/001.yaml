  text: 'But know this: in the last days difficult times will come[a].'
translation:
  language: am
  text: ነገር ግን ይህን እወቅ፤ በመጨረሻዎቹ ቀናት አስቸጋሪ ዘመናት ይመጣሉ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም «አደገኛ ዘመናት» ወይም «ከባድ ዘመናት»። የግሪኩ ቅጽል አስቸጋሪ፣ አደገኛ ወይም ከባድ የሆኑ ዘመናትን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο
  choice: ይህን
  rationale: የግሪኩ ገለጻ ተውላጠ ስም ቀጥሎ ወደሚገለጠው ነገር ያመለክታል፤ «ይህን» በአማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከቀደመው ክፍል ጋር ያለውን መጠነኛ ንፅፅር ወይም የሐሳብ ሽግግር ያሳያል።
- source_word: γίνωσκε
  choice: እወቅ
  rationale: የአሁን ጊዜ ትእዛዛዊ ግስ፣ ሁለተኛ መደብ ነጠላ ነው፤ «እወቅ» ቀጥተኛውን ማሳሰቢያ ይጠብቃል።
- source_word: ὅτι
  choice: ፤
  rationale: ቲሞቴዎስ ማወቅ ያለበትን ይዘት ያስገባል፤ በአማርኛ ከ«ይህን እወቅ» በኋላ የሚመጣ የይዘት ሐረግ በሰረዝ ነጥብ ተፈጥሯዊ ሆኖ ይቀርባል።
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: በመጨረሻዎቹ ቀናት
  rationale: የግሪኩን ክብደት ያለው የፍጻሜ ዘመን አገላለጽ በቀጥታ ይጠብቃል፣ የጊዜ ወሰኑንም አያጠብብም።
- source_word: ἐνστήσονται
  choice: ይመጣሉ
  rationale: በዚህ አውድ መድረስን ወይም ተገኝቶ መኖርን ያመለክታል፤ «ይመጣሉ» ከ«ዘመናት» ጋር የሚስማማ ዘመናዊ አማርኛ ነው።
- source_word: καιροὶ
  choice: ዘመናት
  rationale: ቃሉ ተራ ቅጽበታዊ ጊዜን ሳይሆን ወቅቶችን ወይም የጊዜ ክፍሎችን ያመለክታል፤ «ዘመናት» በዚህ አገባብ ተፈጥሯዊ ነው።
- source_word: χαλεποί
  choice: አስቸጋሪ
  rationale: ቃሉ ከባድ፣ አደገኛ ወይም ጭንቅ የሞላበት የሚለውን ሰፊ ትርጉም ሊይዝ ይችላል፤ «አስቸጋሪ» ዋናውን ሰፊ ትርጉም በዘመናዊና ግልጽ ቋንቋ ያቀርባል።
theological_decisions:
- issue: «በመጨረሻዎቹ ቀናት» የሚለው የጊዜ ወሰን
  choice: የምንጩን «በመጨረሻዎቹ ቀናት» የሚለውን አገላለጽ ሳይጠብብ ማቆየት
  alternative: የክርስቶስ ዳግም ምጽአት ከመሆኑ በፊት ያለው አጭር የመጨረሻ ጊዜ ብቻ እንደሆነ መግለጽ፣ ወይም ሰፊውን የአዲስ ኪዳን የፍጻሜ ዘመን እንደሚያመለክት በግልጽ መወሰን
  rationale: የግሪኩ ሐረግ የፍጻሜ ዘመን ክብደቱን ይይዛል፣ ነገር ግን እዚህ ላይ የጊዜ ወሰኑን በዝርዝር አይወስንም። ትርጉሙ ይህን የትርጓሜ ውጥረት ሳይፈታ ያቆያል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «እወቅ» የሚለው ቀጥተኛ የነጠላ ትእዛዝ ተጠብቋል፤ የፍጻሜ ዘመን ሐረጉም ያለ ትምህርታዊ ማጥበብ ተቀምጧል።
