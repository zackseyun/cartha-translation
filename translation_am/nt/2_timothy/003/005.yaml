source:
  edition: SBLGNT
  text: ἔχοντες μόρφωσιν εὐσεβείας τὴν δὲ δύναμιν αὐτῆς ἠρνημένοι· καὶ τούτους ἀποτρέπου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/005.yaml
  text: having a form of godliness but denying its power[b][a]; and turn away from these people.
translation:
  language: am
  text: እግዚአብሔርን የማክበር መልክ[a] አላቸው፣ ኃይሉን ግን ክደዋል፤ ከእነዚህ ሰዎችም ራቅ።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ገጽታ»። የግሪኩ ቃል ውጫዊ መልክን ወይም ቅርጽን ሊያጎላ ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «ከእነዚህ ሰዎች ራስህን አግልል»። ግሱ ራስን ከእነርሱ የማራቅ ወይም የመራቅ ሐሳብ ያለው ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχοντες
  choice: አላቸው
  rationale: የቀደመውን የሰዎች ዝርዝር የሚቀጥለውን አሁናዊ ባሕርይ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: μόρφωσιν
  choice: መልክ
  rationale: ቃሉ ቅርጽን፣ መገለጫን ወይም ውጫዊ መልክን ሊያመለክት ይችላል፤ «መልክ» ከ«ኃይል» ጋር ያለውን ንፅፅር ሳይጠብብ ይጠብቃል።
- source_word: εὐσεβείας
  choice: እግዚአብሔርን የማክበር
  rationale: በእረኞች መልእክቶች ውስጥ ቃሉ ወደ እግዚአብሔር ያተኮረ አክብሮትና አኗኗርን ያመለክታል፤ ይህ አገላለጽ ለዘመናዊ አንባቢ ግልጽ ነው።
- source_word: τὴν δὲ δύναμιν αὐτῆς
  choice: ኃይሉን ግን
  rationale: የእውነተኛውን እግዚአብሔርን ማክበር ውጤታማ እውነታ በሰፊ ትርጉሙ ይጠብቃል፤ ኃይሉ በአማርኛ በአቅራቢያው ሐረግ ላይ በግልጽ ይመለሳል።
- source_word: ἠρνημένοι
  choice: ክደዋል
  rationale: የግሪኩን ፍጹም አንቀጽ ውጤት ያለው የተረጋጋ አቋም እንደሆነ ያሳያል።
- source_word: καὶ τούτους ἀποτρέπου
  choice: ከእነዚህ ሰዎችም ራቅ
  rationale: የመካከለኛ ድምፅ ትእዛዙን—ራስን ከእነርሱ ማራቅን—በቀጥተኛና ተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: በውጫዊ ሃይማኖታዊ መልክና በውስጣዊ ውጤታማ እውነታ መካከል ያለው ንፅፅር
  choice: «እግዚአብሔርን የማክበር መልክ» እና «ኃይሉ»
  alternative: «የእግዚአብሔር አምልኮ ውጫዊ ገጽታ»
  rationale: ጽሑፉ ኃይሉ ተአምራትን፣ የሥነ ምግባር ለውጥን ወይም የመንፈስ ቅዱስን ሥራ ብቻ እንደሚያመለክት አይገድብም፤ ትርጉሙም ይህን ሥነ መለኮታዊ ስፋት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ራቅ» ነጠላ ቀጥተኛ ትእዛዝ ሲሆን ጳውሎስ ለጢሞቴዎስ የሚሰጠውን ትእዛዝ ይጠብቃል።
