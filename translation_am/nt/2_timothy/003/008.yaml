  text: ὃν τρόπον δὲ Ἰάννης καὶ Ἰαμβρῆς ἀντέστησαν Μωϋσεῖ, οὕτως καὶ οὗτοι ἀνθίστανται τῇ ἀληθείᾳ, ἄνθρωποι κατεφθαρμένοι τὸν νοῦν, ἀδόκιμοι περὶ τὴν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/008.yaml
  text: Just as Jannes and Jambres opposed Moses[a], so also these men oppose the truth—men corrupted in mind[b], disqualified regarding the faith.
translation:
  language: am
  text: ያኔስ እና ያምብሬስ ሙሴን እንደተቃወሙት[a]፣ እነዚህም ሰዎች እንዲሁ እውነትን ይቃወማሉ፤ አእምሯቸው የተበላሸ፣ በእምነት[b] ረገድ ያልፀደቁ ሰዎች ናቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሙሴን ተቃወሙ” … “እውነትን ይቃወማሉ።”
    reason: lexical_alternative
  - marker: b
    text: እዚህ “እምነት” የሚለው የግል ማመንን ብቻ ሳይሆን፣ የክርስትናን እምነት ወይም ሐዋርያዊውን መልእክት የሚያመለክት መሆኑ ይበልጥ ይታያል።
    reason: cross_reference
lexical_decisions:
- source_word: ὃν τρόπον … οὕτως καὶ
  choice: … እንደተቃወሙት፣ … እንዲሁ
  rationale: የንጽጽሩን ‘እንደ… እንዲሁ’ አወቃቀር በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: δὲ
  choice: በተለየ ቃል አልተተረጎመም
  rationale: እዚህ ያለው ለስላሳ የንግግር ሽግግር በአማርኛው የንጽጽር አወቃቀር ውስጥ በቂ ስለሚገለጥ፣ ‘አሁን’ የሚል ያልተገኘ ጊዜያዊ ትርጉም አልተጨመረም።
- source_word: Ἰάννης καὶ Ἰαμβρῆς
  choice: ያኔስና ያምብሬስ
  rationale: የግሪክ ስሞቹን ድምፅ በግዕዝ ፊደል በቀጥታ የሚያቀርብ አጻጻፍ ነው።
- source_word: ἀντέστησαν / ἀνθίστανται
  choice: ተቃወሙት / ይቃወማሉ
  rationale: ያለፈውንና ቀጣይነት ያለውን ተቃውሞ በትይዩ የግስ አጠቃቀም ያሳያል፤ ‘ተቋቋሙ’ የሚለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: τῇ ἀληθείᾳ
  choice: እውነትን
  rationale: ቃሉን ሳያጠብ እንደ ምሥራቹ ወይም እንደ አጠቃላይ እውነት ሊሰማ የሚችለውን ስፋት ይጠብቃል።
- source_word: ἄνθρωποι κατεφθαρμένοι τὸν νοῦν
  choice: አእምሮአቸው የተበላሸ … ሰዎች
  rationale: ፍጹም ተሳቢ አካፋዩ የሚገልጠውን የተፈጠረና የቀጠለ የብልሽት ሁኔታ በተፈጥሯዊ አማርኛ ያቀርባል። ‘ሰዎች’ እዚህ በዐውዱ ያሉትን ወንዶች ይመለከታል፣ ነገር ግን በአማርኛ ተፈጥሯዊው የብዙ ቁጥር አገላለጽ ነው።
- source_word: ἀδόκιμοι περὶ τὴν πίστιν
  choice: በእምነትም ረገድ ፈተናውን ያላለፉ
  rationale: ἀδόκιμοι የመፈተንና ተቀባይነት የማጣት ሐሳብ አለው፤ ይህ አገላለጽ ‘የተጣሉ’ የሚል ከመጠን በላይ የተወሰነ ፍቺ ሳያስገባ የግምገማውን ኃይል ያስተላልፋል።
theological_decisions:
- issue: ‘እውነት’ እና ‘እምነት’ የሚያመለክቱት
  choice: ሁለቱም ቃላት በዋናው ጽሑፍ ሰፊ ትርጉማቸውን እንዲጠብቁ ተደርጓል፤ ‘እምነት’ ሊያመለክት የሚችለው ሐዋርያዊ መልእክት በማስታወሻ ተገልጧል።
  alternative: ‘እውነት’ን ‘የወንጌል እውነት’፣ ‘እምነት’ንም ‘የክርስትና ትምህርት’ ብሎ በዋናው ጽሑፍ መግለጽ፤ ወይም ‘እምነት’ን የግል ማመን አድርጎ መረዳት።
  rationale: ዐውዱ ሐዋርያዊ ትምህርትን የሚቃወሙ የሐሰት አስተማሪዎችን ቢያመለክትም፣ ግሪኩ ሰፊ ቃላትን ይጠቀማል፤ ትርጉሙም ይህን ሥነ መለኮታዊ ክፍትነት አልዘጋም።
- issue: የἄνθρωποι የጾታ አገላለጽ
  choice: ‘ሰዎች’ ተብሏል፣ በዐውዱ ግን የተጠቀሱትን ወንድ የሐሰት አስተማሪዎች ያመለክታል።
  alternative: ‘ወንዶች’ ብሎ መተርጎም።
  rationale: ዘመናዊ አማርኛ ‘ሰዎች’ን ለተወሰኑ ወንዶችም በተፈጥሮ ይጠቀማል፤ ‘ወንዶች’ ማለት ጾታቸውን ከግሪኩ በላይ አጽንዖት ሊሰጥ ይችላል።
