  alternative: ጠንቋዮች
  rationale: በዚህ አውድ ዋናው አጽንዖት በሐሰትና በማታለል ላይ ነው፤ “ጠንቋዮች” የሚለው ትርጉም አውዱ ከሚያረጋግጠው በላይ የአስማት ክስ ሊያስገባ ይችላል።
- issue: πλανώμενοι ተደራጊ ወይም መካከለኛ ፍቺ
  choice: እየተታለሉ
  alternative: እየሳቱ
  rationale: ተደራጊውን አወቃቀር በግልጽ ይጠብቃል፤ ሰዎቹ ሌሎችን ሲያሳቱ ራሳቸውም እንደሚታለሉ ያሳያል።
