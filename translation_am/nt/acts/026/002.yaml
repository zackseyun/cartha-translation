  rationale: περί የክሱን ጉዳይ ያስተዋውቃል፤ ὧν ከἐγκαλοῦμαι ጋር ያለው ግንኙነት በአማርኛ ተፈጥሯዊ በሆነ አንጻራዊ ሐረግ ተገልጧል።
