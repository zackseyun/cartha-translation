- source_word: μακάριον
  choice: ዕድለኛ
  rationale: በዚህ የፍርድ አውድ ጳውሎስ በአግሪጳ ፊት መከላከያውን ማቅረቡን እንደ መልካም አጋጣሚ ይቆጥራል፤ «ብፁዕ» የሚለው ግን ከአውዱ በላይ ሃይማኖታዊ ልዩ ትርጉም ሊጨምር ይችላል።
- source_word: ἐπὶ σοῦ
