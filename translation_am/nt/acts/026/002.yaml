- source_word: βασιλεῦ Ἀγρίππα
  choice: ንጉሥ አግሪጳ ሆይ
  rationale: የግሪኩ ጥሪ ቅርጽ በአማርኛ በተፈጥሯዊው «ሆይ» ተጠብቋል።
