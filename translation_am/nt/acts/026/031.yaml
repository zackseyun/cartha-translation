  yaml_path: translation/nt/acts/026/031.yaml
  text: And after they withdrew[a], they were speaking to one another, saying, “This man is doing nothing worthy of death or imprisonment.”
translation:
  language: am
  text: ለብቻቸው ከወጡ በኋላ፣ “ይህ ሰው ለሞት ወይም ለእስራት የሚያበቃ ምንም ነገር አያደርግም” እያሉ እርስ በርሳቸው ይነጋገሩ ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναχωρήσαντες
  choice: ከዚያም ወደ ጎን ሄደው
  rationale: የአኦሪስት አሳታፊው ከዋናው ግስ በፊት ከሕዝብ ፊት ለቅቀው መሄዳቸውን ያሳያል፤ ይህ አተረጓጎም በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: ἐλάλουν πρὸς ἀλλήλους
  choice: እርስ በርሳቸው ... ይነጋገሩ ነበር
  rationale: ያልተጠናቀቀው የግስ ጊዜ ውይይቱ ቀጣይ እንደነበር ያሳያል፤ የመደጋገፍ ሐረጉም የጋራ ንግግርን ይገልጣል።
- source_word: λέγοντες
  choice: እያሉ
  rationale: የውይይታቸውን ይዘት በተፈጥሯዊ አማርኛ ያስተዋውቃል።
- source_word: Οὐδὲν ... ἄξιον
  choice: የሚገባውን ምንም ነገር ... አይደለም
  rationale: ሰውየው ከተጠቀሱት ቅጣቶች አንዱንም የሚያስገባ ሥራ እንዳላደረገ የሚገልጠውን የግሪክ አወቃቀር ግልጽ አድርጎ ያቀርባል።
- source_word: θανάτου ἢ δεσμῶν
  choice: ሞት ወይም እስራት
  rationale: θανάτου በፍርድ አውድ የሞት ቅጣትን ሲያመለክት፣ δεσμῶν በቀጥታ ‘ሰንሰለት/እስራት’ ማለት ሲችል እዚህ የእስር ሁኔታን ያመለክታል።
- source_word: τι πράσσει
  choice: ምንም ነገር እያደረገ አይደለም
  rationale: የአሁን ጊዜውንና የቀጣይነት ገጽታውን ይጠብቃል፤ ‘ወንጀል እየፈጸመ’ የሚል በግሪኩ ያልተገለጸ ልዩ ትርጉም አይጨምርም።
- source_word: ὁ ἄνθρωπος οὗτος
  choice: ይህ ሰው
  rationale: ጳውሎስን በግልጽ የሚያመለክት ተፈጥሯዊና ትክክለኛ አማርኛ ነው።
