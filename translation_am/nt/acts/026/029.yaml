  text: ὁ δὲ ⸀Παῦλος· Εὐξαίμην ἂν τῷ θεῷ καὶ ἐν ὀλίγῳ καὶ ἐν ⸀μεγάλῳ οὐ μόνον σὲ ἀλλὰ καὶ πάντας τοὺς ἀκούοντάς μου σήμερον γενέσθαι τοιούτους ὁποῖος καὶ ἐγώ εἰμι παρεκτὸς τῶν δεσμῶν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/029.yaml
  text: But Paul said[a], “I would pray to God that whether in a short time or in a long time, not only you but also all who hear me today might become such as I am—except for these chains.”
translation:
  language: am
  text: ጳውሎስ ግን እንዲህ አለ፦ “በአጭር ጊዜም ይሁን በረጅም ጊዜ፣[a] አንተ ብቻ ሳትሆን ዛሬ የሚሰሙኝ ሁሉም፣ ከእነዚህ ሰንሰለቶች በቀር፣ እንደ እኔ እንዲሆኑ ለእግዚአብሔር እጸልይ ነበር።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በጥቂቱም ይሁን በብዙም።” የግሪኩ አገላለጽ ለመተርጎም አስቸጋሪ ሲሆን መጠንን፣ ጥረትን ወይም ጊዜንና ስፋትን ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐξαίμην ἂν τῷ θεῷ
  choice: ወደ እግዚአብሔር እጸልያለሁ
  rationale: የይሁንታ ኦፕታቲቭ ጸሎታዊ ምኞትን ይገልጣል፤ τῷ θεῷ ደግሞ ጸሎቱ የሚቀርብለትን ያመለክታል። ይህ አገላለጽ በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: ἐν ὀλίγῳ καὶ ἐν μεγάλῳ
  choice: በአጭር ጊዜም ይሁን በረጅም ጊዜ
  rationale: አወዛጋቢውን ሐረግ ከዐውደ ንግግሩ ጋር በሚስማማ የጊዜ ንጽጽር ይተረጉማል፤ ሌሎች ትርጉሞች በማስታወሻ ተጠብቀዋል።
- source_word: οὐ μόνον σὲ ἀλλὰ καὶ πάντας τοὺς ἀκούοντάς μου σήμερον
  choice: አንተ ብቻ ሳትሆን ዛሬ የሚሰሙኝ ሁሉ
  rationale: የ‘አንተ ብቻ ሳትሆን … ሁሉ’ አጽንዖትንና በዚያን ጊዜ የሚያዳምጡትን የአሁን አሳታፊ ትርጉም ያቆያል።
- source_word: γενέσθαι τοιούτους ὁποῖος καὶ ἐγώ εἰμι
  choice: እንደ እኔ እንድትሆኑ
  rationale: የሚፈለገውን የመሆን ውጤት በተፈጥሯዊ አማርኛ ያቀርባል። ብዙ ተደራሲዎችን ስለሚመለከት የብዙ ቁጥር ግስ ተጠቅሟል።
- source_word: παρεκτὸς τῶν δεσμῶν τούτων
  choice: ከእነዚህ ሰንሰለቶች በቀር
  rationale: παρεκτός የማስቀረትን ሐሳብ ያሳያል፤ ‘ሰንሰለቶች’ የጳውሎስን እስር በግልጽና ተጨባጭ ቃል ያቀርባል።
