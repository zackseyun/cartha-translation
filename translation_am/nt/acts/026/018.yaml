lexical_decisions:
- source_word: ἀνοῖξαι ὀφθαλμοὺς αὐτῶν
  choice: ዓይኖቻቸውን እንድትከፍት
  rationale: የዓይን መከፈትን ተጨባጭ ምስል ይጠብቃል፤ በዐውዱ መንፈሳዊ ግንዛቤን ቢያመለክትም ‘እንዲያስተውሉ’ ብሎ አይፈታውም።
- source_word: τοῦ ἐπιστρέψαι
  choice: እንዲመለሱ
  rationale: የዓላማውን አገላለጽና ከአንድ አቅጣጫ ወደ ሌላ መዞርን ይጠብቃል።
- source_word: ἀπὸ σκότους εἰς φῶς
  choice: ከጨለማ ወደ ብርሃን
  rationale: የግሪኩን ግልጽ ተቃርኖና ምሳሌያዊ ጥልቀት በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: τῆς ἐξουσίας τοῦ Σατανᾶ
  choice: ከሰይጣንም ሥልጣን
  rationale: ἐξουσία ሥልጣንን፣ የመግዛት ኃይልን ወይም የግዛት ወሰንን ሊያመለክት ይችላል፤ ‘ሥልጣን’ ቀጥተኛና የተለመደ ምርጫ ነው።
- source_word: ἐπὶ τὸν θεόν
  choice: ወደ እግዚአብሔር
  rationale: ከመመለስ እንቅስቃሴ ጋር የተያያዘውን አቅጣጫና ታማኝነት መቀየር በግልጽ ሁኔታ ይገልጣል።
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: የኃጢአት ይቅርታን
  rationale: በዘመናዊ አማርኛ ግልጽ የሆነውንና በአዲስ ኪዳን የተለመደውን ትርጉም ይሰጣል።
- source_word: κλῆρον
  choice: ርስትን
  rationale: ቃሉ በእግዚአብሔር ሕዝብ መካከል የሚሰጥን ድርሻ ወይም ርስት ያመለክታል፤ ‘ርስት’ የቃል ኪዳኑን ዳራ ይጠብቃል።
- source_word: ἐν τοῖς ἡγιασμένοις
  choice: ከተቀደሱት መካከል
  rationale: የፍጹም ተገብሮ አካፋይ ግሱን፣ የተፈጸመ ድርጊትና የቀጠለ ሁኔታ፣ ይጠብቃል።
- source_word: πίστει τῇ εἰς ἐμέ
  choice: በእኔ ባላቸው እምነት
  rationale: እምነቱ የሚያመለክተው ኢየሱስን መሆኑን በተፈጥሯዊ አማርኛ ያሳያል፤ የመሣሪያ ተውሳኩንም ‘በ’ ይወክላል።
theological_decisions:
- issue: πίστει τῇ εἰς ἐμέ የሚለው አገላለጽ
  choice: በእኔ ባላቸው እምነት
  alternative: በእኔ በመታመን
  rationale: ግንባታው እምነት ወደ ኢየሱስ የተመራ መሆኑን ይገልጣል፤ የግሪኩን πίστις ‘እምነት’ ብሎ መተርጎም ሥነ መለኮታዊ ጭብጡን ሳይጨምር ያቆያል።
- issue: ἐν τοῖς ἡγιασμένοις የሚያመለክተው ሁኔታ
  choice: ከተቀደሱት መካከል
  alternative: ቅዱሳን ከሆኑት መካከል
  rationale: ዋናው ንባብ መቀደሳቸውን እንደ ተፈጸመባቸው ድርጊት ያቆያል፤ አማራጩ ግን ሁኔታውን ይበልጥ ያጎላል።
