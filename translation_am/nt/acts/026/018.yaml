    text: ወይም፣ “ከሰይጣን ኃይል” ወይም “ከሰይጣን ግዛት።” የግሪኩ ቃል ሥልጣንን፣ የመግዛት ኃይልን ወይም የግዛት ወሰንን ሊያመለክት ይችላል።
