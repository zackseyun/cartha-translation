- source_word: μετ’ ἐξουσίας
  choice: በተሰጠኝ ሥልጣን
  rationale: ἐξουσία እዚህ ጥሬ ኃይልን ሳይሆን በሕጋዊ መንገድ የተሰጠ ሥልጣንን ያመለክታል።
- source_word: ἐπιτροπῆς
  choice: ውክልና
  rationale: ቃሉ በባለሥልጣን የተሰጠ ኃላፊነትንና ፈቃድን ያመለክታል፤ ‘ውክልና’ ወታደራዊ ትእዛዝን ሳያስገባ ይህን ይገልጣል።
- source_word: τῆς τῶν ἀρχιερέων
  choice: ከካህናት አለቆች በተሰጠኝ
  rationale: የግሪኩ የባለቤትነት ቅርጽ የሥልጣኑና የውክልናው ምንጭ ካህናት አለቆች መሆናቸውን በአማርኛ በግልጽ ያሳያል።
- source_word: ἀρχιερέων
  choice: ካህናት አለቆች
  rationale: ብዙ ሊቃነ ካህናትን ሳይሆን የሊቀ ካህናት አመራር ክፍልን የሚያመለክተውን የአይሁድ ተቋማዊ ማዕረግ ያስተላልፋል።
