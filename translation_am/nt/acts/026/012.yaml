  rationale: የግሪኩ አገላለጽ ጳውሎስ ቀደም ሲል ወደጠቀሳቸው የስደት ተግባራትና ዓላማዎች ይመለሳል። ይህ አተረጓጎም ያንን ኋላ-አመልካች ግንኙነት በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: πορευόμενος
  choice: እየተጓዝኩ ሳለ
  rationale: የአሁን ጊዜው አጋዥ ግስ ከቀጣዩ ዋና ትረካ ጋር በአንድ ጊዜ የሚከናወን ጉዞን ያመለክታል።
- source_word: εἰς τὴν Δαμασκὸν
