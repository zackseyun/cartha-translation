    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαιρούμενός
  choice: እያዳንሁህ
  rationale: የግሱን የማዳንና ከአደጋ የመታደግ ትርጉም ያስተላልፋል፤ የአሁን ጊዜ አጋኝ መልኩንም ከዋናው ግስ ጋር በተፈጥሯዊ አማርኛ ያያይዛል።
- source_word: τοῦ λαοῦ
  choice: ከሕዝቡ
  rationale: ግሪኩ በቀጥታ ‘ሕዝቡ’ ይላል። ከ‘አሕዛብ’ ጋር ባለው ንጽጽር የአይሁድን ሕዝብ እንደሚያመለክት ቢታወቅም፣ የምንጩን አገላለጽ ለመጠበቅ በዋናው ጽሑፍ አልተብራራም።
- source_word: τῶν ἐθνῶν
  choice: ከአሕዛብ
  rationale: በዚህ የአይሁድና የአይሁድ ያልሆኑት ንጽጽር ውስጥ ἔθνη አይሁድ ያልሆኑትን ያመለክታል፤ ‘አሕዛብ’ ይህን ትርጉም በአጭርና በተለመደ መንገድ ያቀርባል።
- source_word: εἰς οὓς
  choice: ወደ እነርሱ
  rationale: ከመላክ ግስ ጋር ያለውን የአቅጣጫ ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀποστέλλω
  choice: እልክሃለሁ
  rationale: የአሁን ጊዜውን የተልእኮ አደራ በግልጽና በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: ከ‘አሕዛብ’ ጋር በንጽጽር የተጠቀሰው ‘ሕዝቡ’ ማንን እንደሚያመለክት
  choice: በዋናው ጽሑፍ ‘ሕዝቡ’ የሚለውን የምንጩን ቀጥተኛ አገላለጽ መጠበቅ
  alternative: ‘የአይሁድ ሕዝብ’ ወይም ‘እስራኤል’ ብሎ በግልጽ መተርጎም
  rationale: ዐውደ ንባቡ የአይሁድን ሕዝብ እንደሚያመለክት በጽኑ ያሳያል፤ ሆኖም ግሪኩ ‘ሕዝቡ’ ብቻ ስለሚል ትርጓሜያዊው ማብራሪያ በማስታወሻ ተቀምጧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘አሕዛብ’ መጽሐፍ ቅዱሳዊ ቢሆንም በዚህ ዐውደ ንባብ የተለመደና አጭር ቃል ነው።
