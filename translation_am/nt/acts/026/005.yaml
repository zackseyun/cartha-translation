  yaml_path: translation/nt/acts/026/005.yaml
  text: They have known me from the beginning[a], if they are willing to testify[b], that I lived as a Pharisee according to the strictest sect of our religion.
translation:
  language: am
  text: እነርሱ ከመጀመሪያው[a] ጀምሮ ያውቁኛል፤ ለመመስከር ቢፈልጉ፣ በሃይማኖታችን ውስጥ ካሉት ወገኖች ሁሉ ይልቅ ጥብቅ በሆነው ወገን[b] መሠረት ፈሪሳዊ ሆኜ እንደኖርኩ ይመሰክራሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከመጀመሪያ አንሥቶ” ወይም “ከረጅም ጊዜ ጀምሮ።”
    reason: lexical_alternative
  - marker: b
    text: የግሪኩ ቃል αἵρεσις በዚህ ስፍራ “ወገን” ወይም “ቡድን” ማለት ነው፤ ቃሉ በኋለኛው ዘመን ያገኘውን “ኑፋቄ” የሚለውን ልዩ ትርጉም አይይዝም።
    reason: lexical_alternative
