  choice: ያውቁኛል
  rationale: በቀድሞ ዘመን የጀመረውንና እስከአሁን ያለውን የግል እውቀት በተፈጥሯዊ አማርኛ ያሳያል፤ “አስቀድመው ያውቁኛል” የሚለው በዚህ አውድ ከመጠን በላይ ቃል በቃል ነው።
- source_word: ἄνωθεν
  choice: ከመጀመሪያው ጀምሮ
  rationale: በዚህ አውድ “ከላይ” ሳይሆን ጳውሎስን ከቀድሞው ጊዜ አንሥቶ ማወቃቸውን ያመለክታል። የምንጩን የጊዜ አሻሚነት የግርጌ ማስታወሻው ይጠብቃል።
- source_word: ἐὰν θέλωσι μαρτυρεῖν
