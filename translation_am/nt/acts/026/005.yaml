  rationale: θέλωσι ፈቃደኝነትን፣ μαρτυρεῖν ደግሞ በፍርድ አውድ የሚቀርብ ምስክርነትን ያመለክታሉ።
- source_word: ἀκριβεστάτην
  choice: ከሁሉ ይልቅ ጥብቅ በሆነው
  rationale: የግሪኩን የላቀ ደረጃ ቅርጽ ግልጽና ተፈጥሯዊ በሆነ አማርኛ ያስተላልፋል።
- source_word: αἵρεσιν
  choice: ወገን
  rationale: በሐዋርያት ሥራ አውድ በአይሁድ ሃይማኖት ውስጥ ያለ የታወቀ ቡድንን ያመለክታል፤ “ኑፋቄ” የኋለኛውን አሉታዊ ሥነ መለኮታዊ ትርጉም በስህተት ሊያስገባ ይችላል።
- source_word: θρησκείας
  choice: ሃይማኖታችን
  rationale: ከἡμετέρας ጋር በማጣመር ጳውሎስ ራሱን ከጋራው የአይሁድ ሃይማኖታዊ ቅርስ ጋር ማካተቱን በግልጽ ያሳያል።
