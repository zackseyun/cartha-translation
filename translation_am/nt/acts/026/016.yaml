  rationale: ኢየሱስ ለጳውሎስ በግል ታይቶ ተልእኮ እንደሰጠው ያለውን ኃይል ይጠብቃል፤ የመታየቱን ሁኔታ ግን ከጽሑፉ በላይ አይወስንም።
- issue: የὧν የዝምድና አወቃቀር ጥቅጥቅነት
  choice: «ባየኸኝ ነገሮችና ... በምገለጥልህ ነገሮች» ብሎ በተነባቢ መልኩ ማቅረብ
  alternative: በቅርጽ ይበልጥ ቀጥተኛ የሆነው «ስላየኸኝና ስለምታይበት» ዓይነት አወቃቀር
  rationale: የመጀመሪያውንና የወደፊቱን መገለጥ ሳያዋሕድ ሁለቱን የምስክርነት መስኮች ይጠብቃል፤ የግሪኩ ጥቅጥቅነት በማስታወሻ ይገለጻል።
