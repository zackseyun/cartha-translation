  text: 'ስለዚህ ከእግዚአብሔር የሆነውን እርዳታ አግኝቼ[a]፣ እስከዚህች ቀን ድረስ ቆሜ ለታናሹም ለታላቁም[b] እመሰክራለሁ፤ ነቢያትና ሙሴ ወደፊት ይሆናሉ ብለው ከተናገሩት ነገሮች ውጭ ምንም አልናገርም[c]።


    [a] ወይም፣ “ከእግዚአብሔር እርዳታ አግኝቼ።”


    [b] “ለታናሹም ለታላቁም” ማለት በማኅበራዊ ደረጃ ሁሉ ላሉ ሰዎች ማለት ነው።


    [c] ወይም፣ “ነቢያትና ሙሴ ወደፊት ይሆናሉ ብለው ከተናገሩት ነገሮች ያለፈ ምንም አልናገርም።”'
  philosophy: optimal-equivalence
  footnotes:
