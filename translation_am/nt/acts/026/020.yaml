  text: but first to those in Damascus[a], then also in Jerusalem, and throughout all the region of Judea, and to the Gentiles, I proclaimed that they should repent and turn to God[b], doing works worthy of repentance.
translation:
  language: am
  text: ነገር ግን ንስሐ እንዲገቡ፣ ወደ እግዚአብሔርም እንዲዞሩ፣ ከንስሐቸውም ጋር የሚስማሙ ሥራዎችን እንዲሠሩ[b] በመጀመሪያ በደማስቆ ለነበሩት፣ ከዚያም በኢየሩሳሌም ላሉት፣ በመላው የይሁዳ አገር ላሉት እና አይሁድ ላልሆኑ ሕዝቦች[a] አወጅሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለሕዝቦች።” እዚህ ቃሉ አይሁድ ያልሆኑ ሕዝቦችን ያመለክታል።
    reason: lexical_alternative
  - marker: b
