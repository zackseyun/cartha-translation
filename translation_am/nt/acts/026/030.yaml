lexical_decisions:
- source_word: Ἀνέστη
  choice: ተነሡ
  rationale: እዚህ ἀνίστημι ከመቀመጫ በአካል መነሣትን ያመለክታል። የግሪኩ ግስ ነጠላ ቢሆንም ተከታዮቹ ተያያዥ ስሞች ሁሉ ድርጊቱን እንደፈጸሙ ያሳያሉ፤ በተፈጥሯዊ አማርኛም ብዙ ቁጥር ተጠቅሟል።
- source_word: τε
  choice: ከዚያም
  rationale: ቅንጣቱ ድርጊቱን ከቀደመው ትዕይንት ጋር ያያይዛል፤ «ከዚያም» የትረካውን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὁ βασιλεὺς
  choice: ንጉሡ
  rationale: ግሪኩ የግል ስም ሳይሆን የማዕረግ ስም ስለሚጠቀም «ንጉሡ» ተብሎ ተጠብቋል።
- source_word: ὁ ἡγεμὼν
  choice: አገረ ገዢው
  rationale: በሐዋርያት ሥራ ዐውድ ἡγεμών የሮማን አውራጃ ገዢ ያመለክታል፤ «አገረ ገዢ» ሥልጣናዊ ሚናውን በግልጽ ያሳያል።
- source_word: Βερνίκη
  choice: ቤርኒቄ
  rationale: ይህ ከግሪኩ Βερνίκη ጋር የቀረበና በአማርኛ የመጽሐፍ ቅዱስ አጠራር የታወቀ የስም አጻጻፍ ነው። ሌላው የተለመደ አጻጻፍ በማስታወሻ ቀርቧል።
- source_word: οἱ συγκαθήμενοι αὐτοῖς
  choice: ከእነርሱ ጋር ተቀምጠው የነበሩት
  rationale: ቃሉ ከእነርሱ ጋር አብረው የተቀመጡትን ሰዎች ያመለክታል፤ ማኅበራዊ ሚናቸውን ሳይጨምር የጋራ መቀመጡን ምስል ይጠብቃል።
- source_word: καὶ
  choice: ፣ / እና
  rationale: ተደጋጋሚው καί ሰዎቹንና ቡድኑን በዝርዝር ያስተባብራል። በተፈጥሯዊ አማርኛ ይህ በነጠላ ሰረዞችና ከመጨረሻው ክፍል በፊት «እና» በማለት ተገልጿል።
