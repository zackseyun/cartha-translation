revisions:
- from: እርሱም እነዚህን ነገሮች በመከላከያው ሲናገር፣ ፊስጦስ በታላቅ ድምፅ፣ “ጳውሎስ ሆይ፣ አብደሃል! ብዙ ትምህርትህ ወደ እብደት እየነዳህ ነው” አለ።
  to: ጳውሎስ ራሱን ሲከላከል እነዚህን ነገሮች ሲናገር፣ ፊስጦስ በታላቅ ድምፅ፣ “ጳውሎስ ሆይ፣ አብደሃል! ብዙ ትምህርትህ ወደ እብደት እየወሰደህ ነው” አለ።
  rationale: The revision makes the legal/self-defense sense explicit in idiomatic modern Amharic and improves the naturalness of the final causal expression. It retains the Greek's direct accusation, loud manner of speech, and movement/result into madness. No footnote is needed because the rendering of γράμματα as learning is clear in context and does not require introducing an alternative into the translated text.
