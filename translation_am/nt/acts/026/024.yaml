language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ταῦτα δὲ αὐτοῦ ἀπολογουμένου ὁ Φῆστος μεγάλῃ τῇ φωνῇ ⸀φησιν· Μαίνῃ, Παῦλε· τὰ πολλά σε γράμματα εἰς μανίαν περιτρέπει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/024.yaml
  text: As he was saying these things in his defense[a], Festus said with a loud voice, “You are out of your mind, Paul! Your great learning is driving you into madness.”
translation:
  language: am
  text: ጳውሎስ ራሱን ሲከላከል እነዚህን ነገሮች ሲናገር፣ ፊስጦስ በታላቅ ድምፅ፣ “ጳውሎስ ሆይ፣ አብደሃል! ብዙ ትምህርትህ ወደ እብደት እየወሰደህ ነው” አለ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπολογουμένου
  choice: በመከላከያው ሲናገር
  rationale: የግሪኩ የጄኒቲቭ አብሶሉት አወቃቀር በአንድ ጊዜ የተከናወነን ድርጊት ያሳያል፤ ἀπολογέομαι ደግሞ በዚህ አውድ ሕጋዊና የቃል መከላከያን ያመለክታል።
- source_word: μεγάλῃ τῇ φωνῇ
  choice: በታላቅ ድምፅ
  rationale: የአነጋገሩን ኃይልና ፊስጦስ ንግግሩን ጣልቃ የገባበትን ግልጽነት ይጠብቃል።
- source_word: φησιν
  choice: አለ
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ ግስ በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜ ሆኖ ተተርጉሟል።
- source_word: Μαίνῃ
  choice: አብደሃል
  rationale: μαίνομαι አእምሮን መሳት ወይም ማበድን ይገልጣል፤ «አብደሃል» ክሱን በግልጽ፣ ቀጥተኛና ዘመናዊ አማርኛ ያቀርባል።
- source_word: τὰ πολλά ... γράμματα
  choice: ብዙ ትምህርትህ
  rationale: γράμματα ፊደላትን፣ ጽሑፎችን ወይም ትምህርትን ሊያመለክት ይችላል፤ በዚህ አውድ ፊስጦስ የጳውሎስን ሰፊ ትምህርት እያመለከተ ስለሆነ «ብዙ ትምህርትህ» ተመርጧል።
- source_word: εἰς μανίαν
  choice: ወደ እብደት
  rationale: εἰς ወደ አንድ ሁኔታ መግባትን ወይም ውጤትን የሚያሳይ አቅጣጫዊ ኃይል አለው።
- source_word: περιτρέπει
  choice: እየነዳህ ነው
  rationale: ግሱ አንድን ሰው ወደ አንድ ሁኔታ ማዞርን ወይም ማድረስን ያመለክታል፤ ይህ አገላለጽ የምክንያትና የውጤት ኃይሉን ይጠብቃል።
