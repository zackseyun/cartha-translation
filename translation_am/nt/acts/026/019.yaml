  rationale: ቀደም ሲል ከተነገረው የጳውሎስ መገለጥና ተልእኮ የሚወጣውን ድምዳሜ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: βασιλεῦ Ἀγρίππα
  choice: ንጉሥ አግሪጳ ሆይ
  rationale: የግሪኩን ቀጥተኛ አድራሻና የክብር ማዕረግ በግልጽ አማርኛ ይጠብቃል።
- source_word: οὐκ ἐγενόμην
  choice: አልሆንኩም
  rationale: γίνομαι ከተከታዩ ቅጽል ጋር ‘ሆነ/ሆኖ ተገኘ’ የሚለውን ፍቺ ስለሚሰጥ፣ የግሪኩን አገላለጽ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἀπειθὴς
  choice: የማልታዘዝ
  rationale: በዐውዱ የመለኮታዊውን ተልእኮ አለመቀበል ወይም አለመፈጸምን ያመለክታል፤ ይህም ከ‘ያልተሳመነ’ ይልቅ የፈቃድና የተግባር ገጽታውን ይጠብቃል።
- source_word: τῇ οὐρανίῳ ὀπτασίᾳ
  choice: ከሰማይ ለተገለጠልኝ ራእይ
  rationale: ὀπτασίαን ‘ራእይ’ ብሎ ያስተላልፋል፤ οὐρανίῳ የራእዩን ሰማያዊ ምንጭ ወይም ባሕርይ ሊያመለክት የሚችለውን አሻሚነት በዋናው ጽሑፍና በማስታወሻው ይይዛል።
