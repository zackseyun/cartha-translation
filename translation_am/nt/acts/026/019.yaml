  choice: ራእይ
  alternative: መገለጥ / ከሰማይ የመጣ መገለጥ
  rationale: ὀπτασία በቀጥታ ራእይን ወይም ታይቶ መገለጥን ያመለክታል። ‘ራእይ’ የጽሑፉን ምድብ ይጠብቃል፤ ክስተቱን በኋለኛ ሥነ መለኮታዊ ትርጓሜ አይወስነውም።
