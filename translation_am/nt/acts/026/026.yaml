  text: ἐπίσταται γὰρ περὶ τούτων ὁ βασιλεύς, πρὸς ὃν ⸀καὶ παρρησιαζόμενος λαλῶ· λανθάνειν γὰρ ⸀αὐτὸν τούτων οὐ πείθομαι ⸀οὐθέν, οὐ γάρ ⸀ἐστιν ἐν γωνίᾳ πεπραγμένον τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/026.yaml
  text: For the king knows about these things[a], and I speak boldly to him. For I am persuaded that none of these things has escaped his notice[c][b], because this has not been done in a corner.
translation:
  language: am
  text: ንጉሡ ስለ እነዚህ ነገሮች ያውቃልና፤ እኔም በድፍረት እናገረዋለሁ።[a] ከእነዚህ ነገሮች አንዳችም ከእርሱ እንዳልተሰወረ እርግጠኛ ነኝ፤[b] ይህ በአንድ ጥግ የተደረገ አይደለምና።[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «በነጻነት» ወይም «በግልጽ እናገረዋለሁ» ተብሎም ሊተረጎም ይችላል። የግሪኩ ቃል ግልጽ፣ ነጻና በራስ መተማመን የተሞላበትን ንግግር ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: «ከእርሱ አንዳችም አልተሰወረም» ወይም «አንዳችም ነገር ከእርሱ እይታ አላመለጠም» ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: c
    text: «በአንድ ጥግ አልተደረገም» ማለት በስውር ወይም ሰዎች ሳያውቁት አልተደረገም ማለት ነው።
    reason: cultural_note
lexical_decisions:
- source_word: ἐπίσταται
  choice: ያውቃል
  rationale: ግሱ ስለ ነገሩ ማወቅንና መተዋወቅን ያመለክታል፤ «ያውቃል» ቀጥተኛና ተፈጥሯዊ አማርኛ ነው።
- source_word: παρρησιαζόμενος λαλῶ
  choice: በግልጽነትና በድፍረት እናገረዋለሁ
  rationale: የግሪኩ አገላለጽ ግልጽ፣ ነጻና የማይፈራ ንግግርን ያጣምራል፤ ሁለቱንም ገጽታዎች ለማስጠበቅ ይህ አገላለጽ ተመርጧል።
- source_word: λανθάνειν αὐτὸν τούτων οὐθέν
  choice: ከእነዚህ ነገሮች አንዳችም ሳያውቀው እንዳላለፈ
  rationale: λανθάνω አንድ ነገር ሳይታወቅ ወይም ሳይስተዋል መቅረቱን ያሳያል፤ ይህ ትርጉም ፈሊጣዊ ኃይሉን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: οὐ πείθομαι οὐθέν
  choice: እርግጠኛ ነኝ
  rationale: በዐውደ ንባቡ πείθομαι የጸና እምነትን ወይም መረጋገጥን ያመለክታል፤ የግሪኩ አሉታዊ አወቃቀር በአማርኛ ተፈጥሯዊ በሆነ አዎንታዊ አገላለጽ ቀርቧል።
- source_word: ἐν γωνίᾳ
  choice: በአንድ ጥግ
  rationale: የምንጩን ምስላዊ አነጋገር ይጠብቃል፤ ፍቺው በእግር ማስታወሻ ተብራርቷል።
- source_word: πεπραγμένον
  choice: የተደረገ
  rationale: የፍጹም ጊዜ ቅርጹ የተፈጸመን ድርጊት ያመለክታል፤ «የተደረገ» ቅርብና ተፈጥሯዊ ነው።
- source_word: τοῦτο
  choice: ይህ
  rationale: ጠቋሚው ቃል የሚያመለክተውን ነገር ምንጩ በዝርዝር አይወስንም፤ «ይህ» ያንን ስፋት ይጠብቃል።
theological_decisions:
- issue: «ይህ» የሚያመለክተው የክስተቶቹ ወሰን
  choice: የግሪኩን ሰፊና ያልተወሰነ ጠቋሚ «ይህ» እንዳለ ማቆየት
  alternative: የኢየሱስን ሞትና ትንሣኤ ብቻ ወይም መላውን የክርስቲያኖች እንቅስቃሴና የጳውሎስን ጉዳይ በግልጽ መጥቀስ
  rationale: ቁጥሩ የጠቋሚውን ወሰን በትክክል አይገልጽም፤ ትርጉሙም ጽሑፉ ያልወሰነውን በትምህርታዊ ግምት አይወስንም።
