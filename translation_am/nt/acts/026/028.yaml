  text: ὁ δὲ Ἀγρίππας πρὸς τὸν ⸀Παῦλον· Ἐν ὀλίγῳ με πείθεις Χριστιανὸν ⸀ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/028.yaml
  text: Then Agrippa said to Paul[a], “In a short time you are persuading me to become a Christian.”
translation:
  language: am
  text: አግሪጳ ለጳውሎስ፣ “በአጭር ጊዜ ክርስቲያን እንድሆን እያሳመንኸኝ ነህ” አለው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ክርስቲያን እንድሆን ልታሳምነኝ ጥቂት ቀርቶሃል፤” ምናልባትም፣ “በዚህ አጭር ጊዜ ክርስቲያን ልታደርገኝ የምትችል ይመስልሃል?” የግሪኩ አገላለጽ አጭር ጊዜን ወይም አነስተኛ መጠንን ሊያመለክት ይችላል፤ የአግሪጳም ቃና ከልብ የተነገረ ወይም ምጸታዊ ሊሆን ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ Ἀγρίππας
  choice: አግሪጳም
  rationale: δέ ቀላል የትረካ አገናኝ ነው፤ የአማርኛው የአንቀጽ አወቃቀር ቅደም ተከተሉን በቂ ስለሚያሳይ፣ ከጽሑፉ ያልተረጋገጠ ተቃርኖ እንዳይጨመር በተለየ ቃል አልተተረጎመም። -ም የንግግሩን ቀጣይነት በተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: πρὸς τὸν Παῦλον
  choice: ጳውሎስን … አለው
  rationale: ከተዘዋዋሪ የንግግር ግስ ጋር πρός ንግግሩ ወደ ጳውሎስ መቅረቡን ያሳያል፤ በአማርኛ ‘ጳውሎስን … አለው’ ተፈጥሯዊና ግልጽ ነው።
- source_word: Ἐν ὀλίγῳ
  choice: በአጭር ጊዜ
  rationale: ሐረጉ አነስተኛ ጊዜን ወይም መጠንን ሊያመለክት ይችላል። ዋናው ጽሑፍ ቀጥተኛውን የጊዜ ትርጉም ይዟል፤ ሌሎቹ አማራጮች በማስታወሻ ተጠብቀዋል።
- source_word: με πείθεις
  choice: እያሳመንኸኝ ነው
  rationale: የአሁን ጊዜው πείθεις በውይይቱ ውስጥ በሂደት ላይ ያለ ማሳመንን ያሳያል፤ ይህ አገላለጽ ያንን ገጽታ በዘመናዊ አማርኛ ያቀርባል።
- source_word: Χριστιανὸν
  choice: ክርስቲያን
  rationale: ቃሉ የሚገኘውን ማንነት ወይም ሁኔታ ያመለክታል፤ ‘ክርስቲያን’ የተለመደውና ትክክለኛው አቻ ነው።
- source_word: ποιῆσαι
  choice: እንድሆን
  rationale: ከπείθω ጋር የመጣው የውጤት ሁኔታን—ክርስቲያን መሆንን—ያመለክታል። ‘እንድሆን’ ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: የአግሪጳ መልስ ቃናና ኃይል
  choice: “በአጭር ጊዜ ክርስቲያን እንድሆን እያሳመንኸኝ ነው” የሚል ቀጥተኛ አባባል
  alternative: “ልታሳምነኝ ጥቂት ቀርቶሃል” ወይም “በዚህ አጭር ጊዜ ክርስቲያን ልታደርገኝ የምትችል ይመስልሃል?”
  rationale: የግሪኩ Ἐν ὀλίγῳ በጊዜ ወይም በመጠን ሊገባ ይችላል፤ የአግሪጳም ቃና ከልብ፣ ማምለጫ ወይም ምጸታዊ መሆኑ አይወሰንም። ዋናው ትርጉም የሐረጉን ገጽታ ይጠብቃል፤ ውጥረቱ በማስታወሻ ተገልጧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ቀጥተኛ ንግግሩ በተፈጥሯዊ የአማርኛ ቃላት ቅደም ተከተል ቀርቧል፤ የግሪኩ የትርጉምና የቃና አሻሚነት ሳይወገድ በማስታወሻ ተጠብቋል።
