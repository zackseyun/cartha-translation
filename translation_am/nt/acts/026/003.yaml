  text: especially because you are knowledgeable about all the customs and disputes among the Jews[b][a]. Therefore I beg you to listen to me patiently.
translation:
  language: am
  text: 'በተለይም አንተ በአይሁድ ዘንድ ያሉትን ልማዶችና ክርክሮች ሁሉ የምታውቅ ስለሆንህ፣[a] ስለዚህ በትዕግሥት እንድታዳምጠኝ እለምንሃለሁ።[b]


    [a] ወይም፣ “የአይሁድን ልማዶችና ክርክሮች ሁሉ።”


    [b] “እለምንሃለሁ” የሚለው በሌላ አገላለጽ “እጠይቅሃለሁ” ሊባል ይችላል፤ የግሪኩ ግስ አጥብቆ መጠየቅን ያመለክታል።'
  philosophy: optimal-equivalence
  footnotes:
