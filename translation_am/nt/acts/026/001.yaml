- source_word: τότε
  choice: በዚያን ጊዜ
  rationale: በግሪክኛው በግልጽ የተመለከተውን የጊዜ ቅደም ተከተል ይጠብቃል።
- source_word: ἐκτείνας τὴν χεῖρα
  choice: እጁን ዘርግቶ
  rationale: አካላዊውን እንቅስቃሴ ሳይተረጉምበት ቀጥተኛና ተፈጥሯዊ በሆነ መንገድ ያቀርባል።
- source_word: ἀπελογεῖτο
