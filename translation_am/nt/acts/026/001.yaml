  text: ከዚያም አግሪጳ ጳውሎስን፣ “ራስህን በመወከል እንድትናገር ተፈቅዶልሃል[a]” አለው። በዚያን ጊዜ ጳውሎስ እጁን ዘርግቶ መከላከያውን አቀረበ[b]፦
  philosophy: optimal-equivalence
  footnotes:
