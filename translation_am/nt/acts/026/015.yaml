  rationale: ὁ κύριος የታወቀውን ተናጋሪ «ጌታ» ብሎ ይለያል፤ δέ በ«-ም» ቀላል ትረካዊ ግንኙነት ሆኗል።
- source_word: Ἐγώ εἰμι Ἰησοῦς
  choice: እኔ … ኢየሱስ ነኝ
