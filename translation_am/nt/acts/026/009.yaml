lexical_decisions:
- source_word: Ἐγὼ
  choice: እኔ ራሴ
  rationale: ግልጽ ተውላጠ ስሙ በግሪክ ለሰዋስው አስፈላጊ ስላልሆነ አጽንዖት አለው፤ «እኔ ራሴ» የጳውሎስን ራስ-ተኮር ኑዛዜ ያስቀምጣል።
- source_word: μὲν οὖν
  choice: ስለዚህ
  rationale: የንግግሩን ቀጣይነትና የማጠቃለያ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል፤ የμέν ቀላል አጽንዖት በ«እኔ ራሴ» አገላለጽም ይንጸባረቃል።
- source_word: ἔδοξα ἐμαυτῷ
  choice: አስቤ ነበር
  rationale: ይህ ፈሊጥ ጳውሎስ በቀድሞ ውስጣዊ ፍርዱ ያመነውን ያመለክታል፤ «አስቤ ነበር» ዘመኑንና የግል አመለካከቱን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: πρὸς τὸ ὄνομα
  choice: ስም በመቃወም
  rationale: ከἐναντία πρᾶξαι ጋር ያለውን የተቃውሞ ኃይል ያስቀምጣል፤ «ስም» የሚለውም ግለሰቡን፣ ዝናውንና ሥልጣኑን ሊወክል የሚችለውን መጽሐፍ ቅዱሳዊ ፈሊጥ ሳያጠብ ይጠብቃል።
- source_word: Ἰησοῦ τοῦ Ναζωραίου
  choice: የናዝሬቱን ኢየሱስ
  rationale: Ναζωραῖος ከኢየሱስ የትውልድ ስፍራና መለያ ጋር የተያያዘ ስያሜ ነው፤ «የናዝሬቱ ኢየሱስ» በዘመናዊ አማርኛ ግልጽና የተለመደ ነው።
- source_word: δεῖν
  choice: እንደሚገባኝ
  rationale: ጳውሎስ በቀድሞ አስተሳሰቡ የተሰማውን የሥነ ምግባር ወይም የተግባር ግዴታ ይገልጣል፤ ከውጭ የተጫነ ግዴታ እንዳይመስል «እንደሚገባኝ» ተመርጧል።
- source_word: πολλὰ ἐναντία πρᾶξαι
  choice: በመቃወም ብዙ ነገር ማድረግ
  rationale: የድርጊቶቹን ብዛትና የጥላቻ/ተቃውሞ አቅጣጫ ሳይገድብ ያስቀምጣል፤ በአማርኛም ግልጽና ተፈጥሯዊ ነው።
theological_decisions:
- issue: «ስም» ከኢየሱስ ጋር ያለው ትርጉም
  choice: መጽሐፍ ቅዱሳዊውን «ስም» የሚለውን ፈሊጥ እንዳለ ማቆየት
  alternative: «የኢየሱስን ሥልጣን» ወይም «የኢየሱስን ዓላማ» ብሎ መተርጎም
  rationale: ጽሑፉ ፈሊጡን ወደ አንድ ብቻ የሥነ መለኮት ፍቺ እንድናጠበው አያስገድድም፤ «ስም» የኢየሱስን ማንነት፣ ዝናና ሥልጣን በአንድነት ሊያመለክት የሚችለውን ክፍትነት ይጠብቃል።
