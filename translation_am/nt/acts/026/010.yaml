  rationale: ቃሉ የክርስቲያን ማኅበረሰብን በአጠቃላይ እንጂ ከእነርሱ የተለየ ከፍተኛ መደብን አያመለክትም።
- issue: የκατήνεγκα ψῆφον ኃይል
  choice: በተቃውሞ ድምፅ መስጠቱን በቀጥታ ማቅረብ
  alternative: በአጠቃላይ መስማማቱን ወይም ማጽደቁን ብቻ መግለጽ
  rationale: የግሪኩ ሐረግ የድምፅ መስጠትን በተፈጥሮ ያመለክታል፤ ሆኖም ጳውሎስ በየትኛው ምክር ቤት ወይም ሥነ ሥርዓት እንደተሳተፈ አይወሰንም።
