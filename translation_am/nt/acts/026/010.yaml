  text: ὃ καὶ ἐποίησα ἐν Ἱεροσολύμοις, καὶ πολλούς ⸀τε τῶν ἁγίων ἐγὼ ⸀ἐν φυλακαῖς κατέκλεισα τὴν παρὰ τῶν ἀρχιερέων ἐξουσίαν λαβών, ἀναιρουμένων τε αὐτῶν κατήνεγκα ψῆφον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/010.yaml
  text: 'And this is what I did in Jerusalem: I not only locked up many of the saints in prisons[a], having received authority from the chief priests, but also, when they were being put to death[b], I cast my vote against them.'
translation:
  language: am
  text: እኔም በኢየሩሳሌም ያደረግሁት ይህንኑ ነው፤ ከካህናት አለቆች ሥልጣን ተቀብዬ፣ ከቅዱሳን[a] ብዙዎችን በእስር ቤቶች አስረኳቸው፤ እነርሱ ሲገደሉም ደግሞ በእነርሱ ላይ ድምፄን ሰጠሁ[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ቅዱሳን» እዚህ ማለት በኢየሱስ የሚያምኑት፣ የእግዚአብሔር ቅዱስ ሕዝብ ማለት ነው።
    reason: lexical_alternative
  - marker: b
    text: የግሪኩ ቃል ψῆφος በቀጥታ ለድምፅ መስጫ የሚያገለግል «ጠጠር»ን፣ በተዘዋዋሪም ድምፅን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ καὶ ἐποίησα
  choice: እኔም በኢየሩሳሌም ያደረግሁት ይህንኑ ነው
  rationale: ወደ ቀደመው የጳውሎስ የስደት ድርጊት የሚያመለክተውን አገናኝ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል፤ καί ያለውንም የ«እኔም» ኃይል ይጠብቃል።
- source_word: πολλούς τε τῶν ἁγίων
  choice: ከቅዱሳን ብዙዎችን
  rationale: ἅγιοι እዚህ በኢየሱስ የሚያምኑትን የእግዚአብሔር ቅዱስ ሕዝብ ያመለክታል፤ «ቅዱሳን» ቁልፍ ቃሉን ይጠብቃል፣ የኋላ ዘመን ልዩ ማዕረግን ግን አያስገባም።
- source_word: ἐν φυλακαῖς κατέκλεισα
  choice: በእስር ቤቶች ዘጋሁ
  rationale: κατακλείω የመዝጋትና የማገድን ኃይል ይይዛል፤ φυλακαῖς የብዙ ቁጥር መሆኑም «በእስር ቤቶች» ተብሎ ተጠብቋል።
- source_word: τὴν παρὰ τῶν ἀρχιερέων ἐξουσίαν λαβών
  choice: ከካህናት አለቆች ሥልጣን ተቀብዬ
  rationale: የድርጊቱን ሕጋዊ ወይም ተቋማዊ ሥልጣን ምንጭ በቀጥታ ያሳያል።
- source_word: ἀναιρουμένων τε αὐτῶν
  choice: እነርሱ ሲገደሉም
  rationale: ተገብሮ የተጻፈውን የሞት ድርጊት በጊዜያዊ አረፍተ ነገር ያቀርባል፤ ሕጋዊ የፍርድ አፈጻጸም እንደነበር ከጽሑፉ በላይ አይወስንም።
- source_word: κατήνεγκα ψῆφον
  choice: በእነርሱ ላይ ድምፄን ሰጠሁ
  rationale: ψῆφος በቀጥታ የድምፅ መስጫ ጠጠርን፣ በተዘዋዋሪም ድምፅን ያመለክታል። አገላለጹ የጳውሎስን የግል ተሳትፎ ይጠብቃል፣ የተቋሙን ትክክለኛ አሠራር ግን አይገምትም።
theological_decisions:
- issue: በሐዋርያት ሥራ ውስጥ የἅγιοι ትርጉም
  choice: «ቅዱሳን»—በኢየሱስ የሚያምኑት የእግዚአብሔር ሕዝብ
