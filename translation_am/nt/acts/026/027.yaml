  text: ንጉሥ አግሪጳ ሆይ፣ ነቢያትን ታምናለህን?[a] እንደምታምን አውቃለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የነቢያቱን መልእክት ትቀበላለህን?» ወይም «በነቢያት ትታመናለህን?»
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύεις
  choice: ታምናለህን? / እንደምታምን
  rationale: የግሪኩ የአሁን ጊዜ ንቁ አመልካች ሁለተኛ መደብ ነጠላ ቅርጽ በመጀመሪያ ቀጥተኛ ጥያቄን፣ በድጋሚውም ጳውሎስ እርግጠኛ መሆኑን ያሳያል። በአማርኛ የግሱ መደገም አጽንዖቱን በተፈጥሯዊ ሁኔታ ይጠብቃል።
- source_word: βασιλεῦ Ἀγρίππα
  choice: ንጉሥ አግሪጳ ሆይ
  rationale: βασιλεῦ የጥሪ ቅርጽ ስለሆነ፣ የአማርኛው «ሆይ» ቀጥተኛ አድራሻውን በክብርና በተፈጥሯዊ የመጽሐፍ ቋንቋ ያቀርባል፤ Ἀγρίππα ደግሞ በተለመደው የአማርኛ አጻጻፍ «አግሪጳ» ተጽፏል።
- source_word: τοῖς προφήταις
  choice: ነቢያትን
  rationale: ከπιστεύω ጋር ያለው ዳቲቭ የሚታመኑትን ሰዎች ወይም ምስክርነታቸውን ያመለክታል። «ነቢያትን ማመን» ቀጥተኛ ሲሆን የነቢያቱን ምስክርነት መቀበልንም ሊያመለክት የሚችለውን አሻሚነት ይጠብቃል።
- source_word: οἶδα
  choice: አውቃለሁ
  rationale: ፍጹም ቅርጽ ቢኖረውም የአሁን ጊዜ ትርጉም ያለውን ግስ በቀጥታና ያለማለዘብ ይተረጉማል።
- source_word: ὅτι
  choice: እንደምታምን
  rationale: ὅτι የሚያስገባውን የእውቀቱን ይዘት በተፈጥሯዊው የአማርኛ «እንደ-» ንዑስ አረፍተ ነገር ያቀርባል።
theological_decisions:
- issue: «ነቢያትን ማመን» የሚለው የእምነት ባሕርይ
  choice: ነቢያቱንና ምስክርነታቸውን ማመን ሊያመለክት በሚችል ቀጥተኛ አገላለጽ ተተርጉሟል።
  alternative: የነቢያቱን መልእክት ትቀበላለህን? / በነቢያት ትታመናለህን?
  rationale: πιστεύω ከዳቲቭ ጋር እዚህ የነቢያቱን ምስክርነት ማመን ወይም መቀበልን በተፈጥሮ ያመለክታል። ትርጉሙ ጳውሎስ ለአግሪጳ ካቀረበው የንግግር ጥያቄ በላይ የሆነ የተስፋፋ ዶክትሪናዊ ይዘት አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «ሆይ» በቀጥተኛ የንጉሥ አድራሻ ውስጥ ክብርንና የጥሪውን ቅርጽ ይጠብቃል፤ የግሱ ድግግሞሽም የግሪኩን የንግግር አጽንዖት በተፈጥሯዊ አማርኛ ያስተላልፋል።
