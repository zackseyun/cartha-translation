id: ACT.26.4
reference: Acts 26:4
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Τὴν μὲν οὖν βίωσίν μου ⸀τὴν ἐκ νεότητος τὴν ἀπ’ ἀρχῆς γενομένην ἐν τῷ ἔθνει μου ἔν ⸀τε Ἱεροσολύμοις ἴσασι ⸀πάντες Ἰουδαῖοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/004.yaml
  text: So then[a], all the Jews know my manner of life from my youth, which from the beginning took place among my own nation and also in Jerusalem,
translation:
  language: am
  text: እንግዲህ፣ ከወጣትነቴ ጀምሮ የነበረኝን አኗኗር[a]—ከመጀመሪያው በገዛ ወገኖቼ መካከልና በኢየሩሳሌም የኖርኩትን—አይሁድ ሁሉ ያውቃሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የኑሮ አካሄዴን»። የግሪኩ ቃል መኖርን ብቻ ሳይሆን የጳውሎስን የኑሮ ሁኔታና አካሄድ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: βίωσίν
  choice: አኗኗር
  rationale: ቃሉ የጳውሎስን መኖር ብቻ ሳይሆን የኑሮውን ሁኔታና አካሄድ ያመለክታል፤ «አኗኗር» ይህን ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐκ νεότητος
  choice: ከወጣትነቴ ጀምሮ
  rationale: የተገለጸው አኗኗር የጀመረበትን የጊዜ ነጥብ በግልጽና በተፈጥሯዊ አነጋገር ይገልጣል።
- source_word: ἀπ’ ἀρχῆς
  choice: ከመጀመሪያው
  rationale: የጳውሎስ የሕይወት አካሄድ ገና ከመነሻው በተጠቀሱት ስፍራዎች እንደነበረ የሚያሳየውን የጊዜ አጽንዖት ይጠብቃል።
- source_word: γενομένην
  choice: የኖርኩትን
  rationale: ተሳቢው βίωσιν የሕይወት አካሄድን ስለሚገልጥ፣ ቃል በቃል «የሆነውን» ከማለት ይልቅ «የኖርኩትን» በአማርኛ ተፈጥሯዊ ሆኖ የሕይወት ጉዞው በዚያ አውድ መካሄዱን ያሳያል።
- source_word: ἐν τῷ ἔθνει μου
  choice: በገዛ ወገኖቼ መካከል
  rationale: ἔθνος እዚህ ዘመናዊ ፖለቲካዊ መንግሥትን ሳይሆን ጳውሎስ የተወለደበትን ሕዝብ ያመለክታል፤ «ገዛ» የራሱ ሕዝብ መሆኑን ያጎላል።
- source_word: ἔν τε Ἱεροσολύμοις
  choice: እና በኢየሩሳሌም
  rationale: τε ያለውን የማስተባበር ኃይል «መካከልና» በሚለው ቅርጽ በተፈጥሯዊ ሁኔታ ይይዛል፤ ተጨማሪ ያልሆነ አጽንዖት አይጨምርም።
- source_word: ἴσασι
  choice: ያውቃሉ
  rationale: የοἶδα ፍጹም ቅርጽ እዚህ የአሁን ጊዜ የእውቀት ሁኔታን ስለሚገልጥ፣ የአማርኛው የአሁን ጊዜ ቅርጽ ተስማሚ ነው።
- source_word: πάντες Ἰουδαῖοι
  choice: አይሁድ ሁሉ
  rationale: የግሪኩን ሁሉን አቀፍ አገላለጽና የሕዝብ መጠሪያ በቀጥታ ይጠብቃል።
- source_word: μὲν οὖν
  choice: እንግዲህ
  rationale: በጳውሎስ መከላከያ ንግግር ውስጥ ያለውን ሽግግርና ቀጣይነት በተፈጥሯዊ የአማርኛ አያያዥ ያሳያል።
