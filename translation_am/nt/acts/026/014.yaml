  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ የቃል ቅደም ተከተል ለአማርኛ ተፈጥሯዊነት ተስተካክሏል፤ ሆኖም የድርጊቶቹ ቅደም ተከተል፣ የስሙ ድግግሞሽና የምሳሌያዊው ንግግር ምስል ተጠብቀዋል።
