  text: πάντων ⸀τε καταπεσόντων ἡμῶν εἰς τὴν γῆν ἤκουσα φωνὴν ⸀λέγουσαν πρός ⸀με τῇ Ἑβραΐδι διαλέκτῳ· Σαοὺλ Σαούλ, τί με διώκεις; σκληρόν σοι πρὸς κέντρα λακτίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/014.yaml
  text: And when we had all fallen to the ground[a], I heard a voice saying to me in the Hebrew language, ‘Saul, Saul[b], why are you persecuting me? It is hard for you to kick against the goads.’
translation:
  language: am
  text: ሁላችንም ወደ መሬት ከወደቅን በኋላ፣ በዕብራይስጥ ቋንቋ[a] የሚናገረኝን ድምፅ ሰማሁ፤ “ሳውል፣ ሳውል፣ ለምን ታሳድደኛለህ? በመውጊያዎች ላይ መራገጥ ለአንተ ከባድ ነው።”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በአራማይክ ቋንቋ” ሊሆን ይችላል፤ የግሪኩ አገላለጽ ቃል በቃል “በዕብራይስጥ ቋንቋ/ዘዬ” ይላል።
    reason: alternative_reading
  - marker: b
    text: መውጊያዎች እንስሳትን ለመንዳት የሚያገለግሉ ሹል መሣሪያዎች ናቸው። ይህ ምሳሌያዊ አነጋገር ተናጋሪውን መቃወም በተቃዋሚው ላይ ጉዳት እንደሚያመጣ ያሳያል።
    reason: cultural_note
lexical_decisions:
- source_word: πάντων τε καταπεσόντων ἡμῶν εἰς τὴν γῆν
  choice: ሁላችንም ወደ መሬት ከወደቅን በኋላ
  rationale: የግሪኩን genitive absolute በተፈጥሯዊ የጊዜ ሐረግ ተርጉሞ፣ πάντων የሚያሳየውን ሁሉንም እና ውድቀቱ ከመስማቱ በፊት መፈጸሙን ይጠብቃል።
- source_word: ἤκουσα φωνὴν λέγουσαν πρός με
  choice: ወደ እኔ እንዲህ የሚል ድምፅ ሰማሁ
  rationale: φωνή ቀጥሎ በሚመጣው ንግግር አውድ ‘ድምፅ’ ሲሆን፣ πρός με ንግግሩ በጳውሎስ ላይ በቀጥታ መመራቱን ያሳያል።
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: በዕብራይስጥ ቋንቋ
  rationale: የግሪኩን ግልጽ አገላለጽ በዋናው ጽሑፍ ይጠብቃል፤ አገላለጹ አራማይክን ሊያመለክት ይችላል የሚለው በማስታወሻ ቀርቧል።
- source_word: Σαοὺλ Σαούλ
  choice: ሳውል፣ ሳውል
  rationale: የስሙን የግሪክ ቅርጽ በአማርኛ ፊደል ያቀርባል፣ ለአጽንዖትም የተደረገውን ድግግሞሽ ሳይቀንስ ይጠብቃል።
- source_word: τί με διώκεις;
  choice: ለምን ታሳድደኛለህ?
  rationale: διώκεις በዚህ አውድ የጥላቻ ስደትን ያመለክታል፤ የአሁን ጊዜ ድርጊቱም ተጠብቋል።
- source_word: σκληρόν σοι πρὸς κέντρα λακτίζειν
  choice: መውጊያዎችን መራገጥ ለአንተ ከባድ ነው
  rationale: የምሳሌያዊውን አነጋገር ምስል ይጠብቃል፤ κέντρα እንስሳትን ለመንዳት የሚያገለግሉ ሹል መውጊያዎችን፣ λακτίζειν ደግሞ መራገጥን ያመለክታል።
theological_decisions:
- issue: τῇ Ἑβραΐδι διαλέκτῳ የሚለው አገላለጽ
  choice: በዕብራይስጥ ቋንቋ
  alternative: በአራማይክ ቋንቋ
  rationale: ዋናው ጽሑፍ የግሪኩን ‘ዕብራይስጥ’ የሚለውን ቃል በቀጥታ ይከተላል። በሐዋርያት ሥራ ይህ ቃል አራማይክን ያመለክታል የሚለው አማራጭ ትርጉም ግን የጽሑፉን አሻሚነት ለመጠበቅ በማስታወሻ ተቀምጧል።
