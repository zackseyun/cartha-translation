base_translation:
  language: en
  yaml_path: translation/nt/acts/026/011.yaml
  text: And in all the synagogues[a], punishing them many times, I tried to force them to blaspheme; and being exceedingly enraged against them, I kept persecuting them even to the foreign cities.
translation:
  language: am
  text: በምኵራቦችም ሁሉ ብዙ ጊዜ እየቀጣኋቸው እንዲሳደቡ ለማስገደድ እሞክር ነበር፤ በእነርሱም ላይ እጅግ ተቆጥቼ እስከ ውጭ ከተሞች[a] ድረስ እያሳደድኳቸው ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም ቃል በቃል፣ «እስከ ውጭ ያሉ ከተሞች ድረስ»፤ ሐረጉ ምናልባት ከይሁዳ ውጭ ያሉ ከተሞችን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ πάσας τὰς συναγωγάς
  choice: በምኵራቦችም ሁሉ
  rationale: κατά ከወንድፊት ቅጽ ጋር በየስፍራው የተደጋገመ ድርጊትን ያመለክታል፤ ይህ አተረጓጎም ሁሉንም ምኵራቦች የሚያካትተውን ስፋት ይጠብቃል።
- source_word: πολλάκις τιμωρῶν αὐτούς
  choice: ብዙ ጊዜ እየቀጣኋቸው
  rationale: ተሳቢው ከዋናው ግስ ጋር በአንድ ጊዜ የሚከናወንና የተደጋገመ ቅጣትን ያሳያል።
- source_word: ἠνάγκαζον
  choice: ለማስገደድ እሞክር ነበር
  rationale: ያልተፈጸመው የግስ ቅርጽ በተደጋጋሚ የተደረገ የማስገደድ ሙከራን በዐውዱ ይገልጣል።
- source_word: βλασφημεῖν
  choice: እንዲሳደቡ
  rationale: የስድቡ ተቀባይ በግሪክ ጽሑፉ አልተገለጸም፤ ትርጉሙም ተቀባዩን ሳይጨምር ይህን ክፍትነት ይጠብቃል።
- source_word: περισσῶς τε ἐμμαινόμενος αὐτοῖς
  choice: በእነርሱም ላይ እጅግ ተቆጥቼ
  rationale: ንግግሩ ከፍተኛና የተባባሰ ቁጣን ያሳያል፤ ይህ አገላለጽ የአእምሮ ሕመምን ሳያመለክት ኃይለኛውን ጠላትነት ያስተላልፋል።
- source_word: ἐδίωκον
  choice: አሳድዳቸው ነበር
  rationale: ያልተፈጸመው የግስ ቅርጽ ቀጣይና ተደጋጋሚ ስደትን ያሳያል።
- source_word: ἕως καὶ εἰς τὰς ἔξω πόλεις
  choice: እስከ ውጭ ከተሞች ድረስ
  rationale: ἔξω ቃል ከአካባቢው ወይም ከአገሩ ውጭ ያሉ ከተሞችን ሊያመለክት ይችላል፤ ዋናው ጽሑፍ ይበልጥ ቀጥተኛውን አገላለጽ ይጠብቃል።
theological_decisions:
- issue: የβλασφημεῖν ስድብ ተቀባይ
  choice: ተቀባዩን ሳይገልጽ «እንዲሳደቡ» ተብሎ ተተርጉሟል።
  alternative: «ኢየሱስን እንዲሳደቡ» ወይም «የክርስቲያንን እምነት እንዲክዱ»
  rationale: ዐውዱ ስድቡ በኢየሱስ ወይም በክርስቲያናዊው ምስክርነት ላይ እንደሆነ ቢጠቁምም፣ የግሪኩ ጽሑፍ ተቀባዩን አይጠቅስም። ስለዚህ ትርጉሙ ያልተገለጸውን ነገር አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «ምኵራብ» የተለመደውን መጽሐፍ ቅዱሳዊ ቃል ይጠብቃል፤ የግሱ ተደጋጋሚና ቀጣይ ባሕርይ «ነበር» በሚለው አወቃቀር ተገልጧል።
