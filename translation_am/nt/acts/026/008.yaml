  yaml_path: translation/nt/acts/026/008.yaml
  text: Why is it judged unbelievable by you if God raises the dead?
translation:
  language: am
  text: እግዚአብሔር ሙታንን የሚያስነሣ ከሆነ፣ ይህ በእናንተ ዘንድ የማይታመን ነገር ሆኖ የሚቆጠረው ለምንድን ነው?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί
  choice: ለምንድን ነው?
  rationale: በዐውዱ የተነሣውን የምክንያት ጥያቄ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: ἄπιστον
  choice: የማይታመን ነገር
  rationale: ‘ለማመን የማይቻል/የማይገባ’ የሚለውን ፍቺ ያለ ትርጓሜያዊ ጭማሪ ይጠብቃል።
- source_word: κρίνεται παρ’ ὑμῖν
  choice: በእናንተ ዘንድ ... ሆኖ የሚቈጠረው
  rationale: የκρίνεταιን ግምገማዊ ኃይልና παρ’ ὑμῖν የሚያመለክተውን ‘በእናንተ አመለካከት/ዘንድ’ በግልጽ አማርኛ ያስተላልፋል።
- source_word: ἐγείρει
  choice: የሚያስነሣ
  rationale: ሙታንን ከሞት ማስነሣትን የሚገልጽ የተለመደ መጽሐፍ ቅዱሳዊና ዘመናዊ አገላለጽ ነው።
theological_decisions:
- issue: εἰ ὁ θεὸς νεκροὺς ἐγείρει የሚለው ሐረግ አወቃቀር
  choice: እግዚአብሔር ሙታንን የሚያስነሣ ከሆነ
  alternative: እግዚአብሔር ሙታንን ማስነሣቱ
  rationale: εἰ ያለውን ሁኔታዊ ቅርጽ በግልጽ ይጠብቃል፤ ጥያቄው የእግዚአብሔርን ችሎታ ለመካድ ሳይሆን የአድማጮቹን አለማመን ለመጠየቅ መሆኑን አይደብቅም።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለሕዝብ ንባብ ግልጽ ነው። ‘በእናንተ ዘንድ’ የሚለው የግሪኩን παρ’ ὑμῖν ከ‘በእናንተ’ ይልቅ በተፈጥሯዊ አማርኛ ያቀርባል። የግሪኩ ጥያቄያዊ አጽንዖት ተጠብቋል።
