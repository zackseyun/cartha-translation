base_translation:
  language: en
  yaml_path: translation/nt/acts/026/025.yaml
  text: But Paul said[a], “I am not out of my mind, most excellent Festus[c][b], but I am speaking words of truth and sound judgment.”
translation:
  language: am
  text: ጳውሎስ ግን፣ “አላበድኩም፣ እጅግ የተከበሩ ፌስጦስ ሆይ፤[b] ይልቁንም የእውነትና የጤናማ አእምሮ ቃላትን[c] እየተናገርኩ ነው” አለ።
  philosophy: optimal-equivalence
  footnotes:
