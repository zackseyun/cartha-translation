    text: “እጅግ የተከበሩ” ለከፍተኛ ባለሥልጣን የሚቀርብ መደበኛ የክብር መጠሪያ ነው።
    reason: cultural_note
  - marker: c
    text: ወይም፣ “የእውነትና የልከኝነት ቃላትን” ወይም “የእውነትና የጤናማ አስተሳሰብ ቃላትን።”
    reason: lexical_alternative
