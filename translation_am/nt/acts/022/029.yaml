  text: ስለዚህ ሊመረምሩት የነበሩት ወዲያውኑ ከእርሱ ፈቀቅ አሉ፤[a] አዛዡም[b] እርሱ የሮም ዜጋ መሆኑንና እርሱን አስሮ እንደነበር ባወቀ ጊዜ ፈራ።
