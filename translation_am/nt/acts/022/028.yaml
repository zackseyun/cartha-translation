  text: 'የሮም ጦር አዛዡ ግን፣ “እኔ ይህን ዜግነት ብዙ ገንዘብ ከፍዬ አግኝቻለሁ” ብሎ መለሰ።[a] ጳውሎስ ግን፣ “እኔ ግን ዜጋ ሆኜ ተወልጃለሁ” አለ።[b]


    [a] ወይም፣ “እኔ ይህን ዜግነት በብዙ ገንዘብ አግኝቻለሁ።”


    [b] ቃል በቃል፣ “እኔ ግን ደግሞ ተወልጃለሁ፤” ዜግነት ከአውዱ የሚገባ ነው።'
  philosophy: optimal-equivalence
