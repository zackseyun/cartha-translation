lexical_decisions:
- source_word: οἱ δὲ σὺν ἐμοὶ ὄντες
  choice: ከእኔ ጋር የነበሩት
  rationale: የግሪኩን አንቀጽ ያለው ተሳቢ አገላለጽ በተፈጥሯዊ አማርኛ ያቀርባል፤ በምንጩ በግልጽ ያልተጠቀሰውን ‘ሰዎች’ ወይም ‘ወንዶች’ አይጨምርም።
- source_word: τὸ μὲν φῶς
  choice: ብርሃኑን
  rationale: φῶς በቀጥታ ‘ብርሃን’ ማለት ነው፤ μέν…δέ የሚያሳየው ንጽጽር በ‘ነገር ግን’ ተንጸባርቋል። በዚህ ቁጥር ያልተገለጸው ‘ደማቅ’ የሚለው አልተጨመረም።
- source_word: ἐθεάσαντο
  choice: አዩ
  rationale: θεάομαι እዚህ ‘ማየት’ የሚለውን መደበኛ ትርጉም ይሰጣል፤ ‘ተመለከቱ’ ሆን ብሎ ማተኮርን ሊያመለክት ይችላል።
- source_word: τὴν δὲ φωνὴν
  choice: ድምፅ
  rationale: φωνή ‘ድምፅ’ ወይም ‘የንግግር ድምፅ’ ሊሆን ይችላል። ተናጋሪው በተከታዩ ሐረግ ስለሚገለጥ፣ ‘ድምፅ’ ተፈጥሯዊ ሲሆን የቃሉን ስፋትም ይጠብቃል።
- source_word: οὐκ ἤκουσαν
  choice: አልሰሙም
  rationale: ἀκούω በመደበኛነት ‘መስማት’ ማለት ነው። ‘አልተረዱም’ የሚለው አማራጭ የሐዋርያት ሥራ 9፥7ን በዋናው ጽሑፍ ውስጥ ለማስማማት ስለሚሞክር፣ በማስታወሻ ብቻ ቀርቧል።
- source_word: τοῦ λαλοῦντός μοι
  choice: ይናገረኝ የነበረውን
  rationale: የአሁን ጊዜ ተሳቢው λαλοῦντος በዚያ ጊዜ እየቀጠለ የነበረን ንግግር ያሳያል፤ ይህ አገላለጽ ድምፁ የተናጋሪው መሆኑን በተፈጥሯዊ አማርኛ ያስተላልፋል።
