- source_word: ὑποστρέψαντι εἰς Ἰερουσαλήμ
  choice: ወደ ኢየሩሳሌም ከተመለስኩ በኋላ
  rationale: የaorist participle ተግባር ከዋናው ክስተት ቀድሞ መሆኑን በግልጽ ያሳያል።
- source_word: καὶ προσευχομένου μου
