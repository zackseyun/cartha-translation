- source_word: ἐν τῷ ἱερῷ
  choice: በቤተ መቅደሱ ውስጥ
  rationale: ἱερόν የሚያመለክተውን የቤተ መቅደሱን ሰፊ ግቢና ሕንፃዎች በመደበኛው አንባቢ የሚታወቅ ቃል ይተረጉማል፤ ትክክለኛው ወሰን በማስታወሻ ተገልጧል።
- source_word: γενέσθαι με ἐν ἐκστάσει
