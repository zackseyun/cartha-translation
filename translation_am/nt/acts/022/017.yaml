  choice: ‘ራእይ በሚታይበት ልዩ ሁኔታ’ ተብሎ ከጽሑፉ በላይ ሳይብራራ ተተርጉሟል።
  alternative: በተመስጦ / ራሱን ስቶ
  rationale: ጥቅሱ በጸሎት ጊዜ የተከሰተ የራእይ ሁኔታን ይዘግባል እንጂ አካላዊ ወይም መንፈሳዊ አሠራሩን አይወስንም። ‘ራሱን ስቶ’ የሚለው ደግሞ ጽሑፉ ያላለውን የሕሊና መጥፋት ሊያስገባ ይችላል።
