  text: Τῇ δὲ ἐπαύριον βουλόμενος γνῶναι τὸ ἀσφαλὲς τὸ τί κατηγορεῖται ⸀ὑπὸ τῶν Ἰουδαίων ἔλυσεν ⸀αὐτόν, καὶ ἐκέλευσεν ⸀συνελθεῖν τοὺς ἀρχιερεῖς καὶ ⸀πᾶν τὸ ⸀συνέδριον, καὶ καταγαγὼν τὸν Παῦλον ἔστησεν εἰς αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/030.yaml
  text: But on the next day[a], wanting to know for certain what he was being accused of by the Jews, he released him and ordered the chief priests and the whole council to assemble; and bringing Paul down[b], he set him before them.
translation:
  language: am
  text: በማግስቱ ግን እርሱ ጳውሎስ በአይሁድ[a] ስለ ምን እንደተከሰሰ በእርግጥ ለማወቅ ፈልጎ፣ ፈታው፤ የካህናት አለቆችና መላው ሸንጎ[b] እንዲሰበሰቡም አዘዘ። ከዚያም ጳውሎስን ወደ ታች አውርዶ በፊታቸው አቆመው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በአይሁድ መሪዎች” ወይም “በይሁዳውያን” ተብሎም ሊተረጎም ይችላል። የግሪኩ ጽሑፍ “በአይሁድ” ይላል፤ በዚህ አውድ ግን የጳውሎስን ከሳሾች ያመለክታል እንጂ ሁሉንም አይሁድ ያለ ልዩነት አያመለክትም።
    reason: lexical_alternative
  - marker: b
    text: “ሸንጎ” በኢየሩሳሌም የነበረውን የአይሁድ ገዥ ምክር ቤት፣ ማለትም ሳንሄድሪንን፣ ያመለክታል።
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: በማግስቱ ግን
  rationale: የጊዜውን አገላለጽ ‘በማግስቱ’ በተፈጥሯዊ አማርኛ ያቀርባል፤ δέ የትረካውን ሽግግር ለማሳየት ‘ግን’ ተብሏል።
- source_word: βουλόμενος γνῶναι τὸ ἀσφαλές
  choice: በእርግጥ ለማወቅ ፈልጎ
  rationale: βουλόμενος ዓላማን ወይም ፍላጎትን ያሳያል፤ τὸ ἀσφαλές ደግሞ የተረጋገጠ እውቀትን ስለሚጠቁም ‘በእርግጥ’ ተብሏል።
- source_word: τὸ τί κατηγορεῖται ὑπὸ τῶν Ἰουδαίων
  choice: ጳውሎስ በአይሁድ ስለ ምን እንደተከሰሰ
  rationale: የግሪኩን ተደራጊ አቀራረብና የክሱን ምክንያት ይጠብቃል። ጳውሎስ የሚለው ስም በአማርኛ የተውላጠ ስም ግራ መጋባትን ለማስወገድ ተገልጿል።
- source_word: ἔλυσεν αὐτόν
  choice: ፈታው
  rationale: λύω ከእስራት መልቀቅንም ሆነ ማሰሪያን መፍታትን ሊያመለክት ይችላል፤ ‘ፈታው’ ይህን የትርጉም ስፋት በአጭሩ ይጠብቃል።
- source_word: ἐκέλευσεν συνελθεῖν
  choice: እንዲሰበሰቡም አዘዘ
  rationale: የባለሥልጣን ትእዛዝንና አባላቱ አንድ ላይ መሰብሰባቸውን በግልጽ አማርኛ ያሳያል።
- source_word: τοὺς ἀρχιερεῖς καὶ πᾶν τὸ συνέδριον
  choice: የካህናት አለቆችና ጠቅላላው ሸንጎ
  rationale: ἀρχιερεῖς የካህናትን መሪዎች ያመለክታል፤ συνέδριον ደግሞ በኢየሩሳሌም ያለውን የአይሁድ የገዥ ምክር ቤት ያመለክታል። ‘ጠቅላላው’ πᾶνን ይወክላል።
- source_word: καταγαγὼν τὸν Παῦλον
  choice: ጳውሎስን ወደ ታች አውርዶ
  rationale: κατά ያለውን የቦታ እንቅስቃሴ በግልጽ ይጠብቃል፤ ምናልባትም ከጦር ሰፈሩ ወደ ስብሰባው ቦታ መውረድን ያመለክታል።
- source_word: ἔστησεν εἰς αὐτούς
  choice: በፊታቸው አቆመው
  rationale: ጳውሎስ በሸንጎው ፊት እንዲቆም መደረጉን ተፈጥሯዊና ይፋዊ በሆነ አገላለጽ ያቀርባል።
theological_decisions:
- issue: በሐዋርያት ሥራ ውስጥ Ἰουδαίων የሚለው ቃል
  choice: በአይሁድ
  alternative: በአይሁድ መሪዎች / በይሁዳ ሰዎች
  rationale: የግሪኩ ጽሑፍ Ἰουδαίων ይላል፤ ዋናው ጽሑፍ ይህን የቃሉን ቅርጽ ይጠብቃል። አውዱ ግን የጳውሎስን ከሳሾች እንጂ ሁሉንም አይሁድ ያለልዩነት እንደማያመለክት በማስታወሻ ተገልጿል።
