lexical_decisions:
- source_word: εἶπεν πρός με
  choice: አለኝ
  rationale: በአማርኛ ቀጥተኛ ንግግርን ለማስገባት ተፈጥሯዊና አጭር አገላለጽ ነው፤ πρός με ያለውንም ‘ለእኔ’ የሚለውን አቅጣጫ በተውላጠ ስም ቅጥያው ይይዛል።
- source_word: Πορεύου
  choice: ሂድ
  rationale: የትእዛዙን ቀጥተኛ ኃይል በዘመናዊና ግልጽ አማርኛ ያስተላልፋል።
- source_word: ὅτι
  choice: -ና
  rationale: ትእዛዙ የተሰጠበትን ምክንያት በተፈጥሯዊ የአማርኛ ምክንያታዊ አያያዥ ያሳያል።
- source_word: ἐγὼ
  choice: እኔ
  rationale: በግሪክኛው በግልጽ የተጠቀሰውንና አጽንዖት ሊኖረው የሚችለውን ተውላጠ ስም ይጠብቃል።
- source_word: εἰς ἔθνη
  choice: ወደ አሕዛብ
  rationale: በሐዋርያት ሥራ የተልእኮ አውድ ἔθνη ከአይሁድ ውጭ ያሉትን ሕዝቦች ያመለክታል፤ ‘አሕዛብ’ ይህን ታሪካዊ ልዩነት የሚጠብቅ የታወቀ አማርኛ ቃል ነው። ‘ሕዝቦች’ የሚለው የቃል አማራጭ በማስታወሻ ተጠብቋል።
- source_word: μακρὰν
  choice: ሩቅ
  rationale: የመላኩን ርቀት በአጭርና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐξαποστελῶ
  choice: እልክሃለሁ
  rationale: የወደፊት ጊዜውንና የመላክን ዋና ትርጉም በግልጽ ይገልጻል፤ ‘ወደ ውጭ’ የሚለውን ቅድመ ቅጥያ በአማርኛ በግድ መጨመር አያስፈልግም።
- source_word: σε
  choice: -ሃ-
  rationale: ሁለተኛ መደብ ነጠላ ተሳቢው በ‘እልክሃለሁ’ የግስ ቅጥያ በተፈጥሯዊ ሁኔታ ተወክሏል።
theological_decisions:
- issue: በሐዋርያዊ ተልእኮ አውድ ἔθνη እንዴት እንደሚተረጎም
  choice: አሕዛብ
  alternative: ሕዝቦች
  rationale: አውዱ ጳውሎስ ወደ አይሁድ ያልሆኑ ሰዎች መላኩን ያመለክታል። ‘አሕዛብ’ ይህን ታሪካዊና ሥነ መለኮታዊ ልዩነት ያቆያል፤ በግሪክኛው ያለው ‘ሕዝቦች/ብሔራት’ የሚለው ሰፊ የቃል ክልል ግን በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የቀጥተኛ ንግግሩ ቅደም ተከተል ለአማርኛ ተፈጥሯዊነት ተስተካክሏል፤ የግሪክኛው ምክንያታዊ ግንኙነትና የἐγώ አጽንዖት ተጠብቀዋል።
