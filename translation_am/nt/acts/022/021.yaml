  text: And he said to me[a], ‘Go, because I will send you far away to the Gentiles.’
translation:
  language: am
  text: እርሱም፣ “ሂድ፤ እኔ ወደ ሩቅ ወደሚገኙ አሕዛብ[a] እልክሃለሁና” አለኝ።
  philosophy: optimal-equivalence
  footnotes:
