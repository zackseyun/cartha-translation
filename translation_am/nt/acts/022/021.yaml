    issue: Placement and attachment of ሩቅ
    rationale: In the draft, ሩቅ follows ወደ አሕዛብ and directly precedes the verb. Although intelligible, this is less idiomatic and may momentarily sound elliptical. Recasting it as ሩቅ ወደሚገኙ አሕዛብ clearly and naturally retains the sense of a far-off Gentile destination without adding doctrine.
  revised_text: እርሱም፣ “ሂድ፤ እኔ ወደ ሩቅ ወደሚገኙ አሕዛብ[a] እልክሃለሁና” አለኝ።
