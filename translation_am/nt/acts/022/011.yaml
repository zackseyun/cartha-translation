base_translation:
  language: en
  yaml_path: translation/nt/acts/022/011.yaml
  text: And since I could not see because of the brightness of that light[a], I came into Damascus being led by the hand by those who were with me.
translation:
  language: am
  text: የዚያ ብርሃን ድምቀት[a] የተነሳ ማየት ስላልቻልኩ፣ ከእኔ ጋር የነበሩት እጄን ይዘው ሲመሩኝ ወደ ደማስቆ ገባሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ በቃል በቃል፣ “በዚያ ብርሃን ክብር ምክንያት።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέβλεπον
  choice: ዓይኔን ስላሳወረኝ
  rationale: ቃሉ ማየት ወይም ትኩር ብሎ ማየት ማለት ሊሆን ቢችልም፣ በዚህ አውድ ብርሃኑ ጳውሎስን ማየት እንዳሳነው ያመለክታል። የግሪኩን አሉታዊ አገላለጽ በተፈጥሯዊ የአማርኛ ምክንያታዊ ሐረግ ያቀርባል።
- source_word: ἀπὸ τῆς δόξης τοῦ φωτὸς ἐκείνου
  choice: የዚያ ብርሃን ድምቀት
  rationale: δόξα በዚህ ስፍራ ለዓይን የሚታየውንና ዓይን የሚያሳውረውን ብርሃናዊ ድምቀት ያመለክታል። ‘ድምቀት’ አካላዊውን ውጤት በግልጽ ያሳያል፤ ‘ክብር’ የሚለው ቀጥተኛ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: χειραγωγούμενος
  choice: እጄን ይዘው መርተውኝ
  rationale: የግሪኩ ቃል በእጅ ይዞ የመምራትን ግልጽ ምስል ይዟል፤ ይህ አገላለጽ ያንን ዝርዝር በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ὑπὸ τῶν συνόντων μοι
  choice: ከእኔ ጋር የነበሩት
  rationale: በግሪኩ ያለውን ‘ከእኔ ጋር የነበሩ’ የሚለውን ግንኙነታዊ አገላለጽ ያለ ተጨማሪ ትርጓሜ ያስተላልፋል።
- source_word: ἦλθον εἰς Δαμασκόν
  choice: ወደ ደማስቆ ገባሁ
  rationale: εἰς ወደ ቦታው ውስጥ የመግባትን አቅጣጫ ያሳያል፤ ‘ወደ ደማስቆ ገባሁ’ ይህን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ὡς δὲ
  choice: ስላሳወረኝ
  rationale: ὡς በአውዱ የተከተለውን ድርጊት ምክንያት የሚገልጥ ነው። በአማርኛ የ‘ስለ’ ቅጥያ ምክንያታዊውን ግንኙነት በተቀላጠፈ መንገድ ያሳያል።
theological_decisions:
- issue: በመለኮታዊ መገለጥ አውድ δόξαን መተርጎም
  choice: ድምቀት
  alternative: ክብር
  rationale: በዚህ ዓረፍተ ነገር δόξα ዓይንን ያሳወረውን የብርሃኑን ግርማና ጽናት በቀጥታ ይገልጣል። ‘ድምቀት’ ይህን የሚታይ ባሕርይ ያስተላልፋል፤ ‘ክብር’ የሚለው ቀጥተኛና ሥነ መለኮታዊ ክብደት ያለው አማራጭ ግን በእግር ማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የእጅ መሪነቱ ምስላዊ ዝርዝርና ወደ ከተማው የመግባት አቅጣጫ ተጠብቀዋል።
