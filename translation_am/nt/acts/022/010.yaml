  text: εἶπον δέ· Τί ποιήσω, κύριε; ὁ δὲ κύριος εἶπεν πρός με· Ἀναστὰς πορεύου εἰς Δαμασκόν, κἀκεῖ σοι λαληθήσεται περὶ πάντων ὧν τέτακταί σοι ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/010.yaml
  text: Then I said[a], ‘What should I do, Lord?’ And the Lord said to me, ‘Get up and go into Damascus[b], and there you will be told about everything that has been appointed for you to do.’
translation:
  language: am
  text: እኔም፣ “ጌታ ሆይ፣ ምን ላድርግ?” አልሁ። ጌታም፣ “ተነሥተህ ወደ ደማስቆ ሂድ፤ በዚያም እንድታደርግ ስለ ተመደቡልህ ነገሮች ሁሉ[a] ይነገርሃል” አለኝ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እንድታደርግ ስለ ተወሰኑልህ ነገሮች ሁሉ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί ποιήσω
  choice: ምን ላድርግ?
  rationale: የግሪኩ የምክክር ጥያቄ ቀጥሎ ሊደረግ ስለሚገባው ነገር መመሪያ መጠየቁን ያሳያል፤ “ምን ላድርግ?” በዘመናዊ አማርኛ ይህን በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: κύριε / ὁ ... κύριος
  choice: ጌታ ሆይ / ጌታ
  rationale: በደማስቆ መንገድ አውድ የተናጋሪው ንግግር ኢየሱስን “ጌታ” ብሎ ይጠራል፤ “ጌታ ሆይ” የቀጥታ ንግግሩን፣ “ጌታም” ደግሞ የትረካውን ስያሜ በተፈጥሯዊ አማርኛ ይጠብቃሉ።
- source_word: Ἀναστὰς πορεύου εἰς Δαμασκόν
  choice: ተነሥተህ ወደ ደማስቆ ሂድ
  rationale: ተከታታይ የሆኑትን መነሣትና መሄድ ትእዛዞች ይጠብቃል፤ εἰς የሚያመለክተው ወደ ከተማዋ የሚደረግ እንቅስቃሴ “ወደ ደማስቆ” ተብሎ በተፈጥሯዊ ሁኔታ ተተርጉሟል።
- source_word: κἀκεῖ σοι λαληθήσεται
  choice: በዚያም ... ይነገርሃል
  rationale: የግሪኩን ቦታና ወደፊት የሚፈጸም ተገብሮ አነጋገር ግልጽና ተፈጥሯዊ በሆነ የአማርኛ ተገብሮ ቅርጽ ያስተላልፋል።
- source_word: περὶ πάντων ὧν τέτακταί σοι ποιῆσαι
  choice: እንድታደርግ ስለ ተወሰነልህ ነገር ሁሉ
  rationale: περί የንግግሩን ይዘት፣ πάντων ደግሞ ሁሉን አቀፍነቱን ይጠብቃሉ። “ተወሰነልህ” የτέτακταίን ፍጹም ተገብሮ ኃይልና ለጳውሎስ አስቀድሞ የተደነገገ ተግባር መኖሩን ያሳያል፤ ከጽሑፉ በላይ የተወሰነ ሥነ መለኮታዊ ሥርዓት አያስገባም።
theological_decisions:
- issue: የτέτακταί ቃል መለኮታዊ መመሪያንና ለተልእኮ መወሰንን የሚያመለክትበት ኃይል
  choice: እንድታደርግ ስለ ተወሰነልህ ነገር ሁሉ
  alternative: እንድታደርግ ስለ ተመደበልህ ነገር ሁሉ
  rationale: ይህ አባባል ጳውሎስ የሚያደርገው ነገር አስቀድሞ መወሰኑን ይጠብቃል፤ ነገር ግን ጥቅሱ ራሱ ከሚናገረው በላይ የቅድመ ውሳኔ ሥርዓትን አይጭንበትም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። “ተነሥተህ ... ሂድ” እና “ይነገርሃል” ተፈጥሯዊነትን ከምንጩ የትእዛዝና የተገብሮ ቅርጾች ጋር ያመጣጥናሉ።
