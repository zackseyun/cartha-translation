base_translation:
  language: en
  yaml_path: translation/nt/acts/022/005.yaml
  text: as also the high priest and the whole council of elders can testify for me. From them I also received letters to the brothers in Damascus[a], and I was traveling there to bring also those who were there, bound, to Jerusalem so that they might be punished.
translation:
  language: am
  text: ይህንም ሊቀ ካህናቱና የሽማግሌዎች ሸንጎ ሁሉ ሊመሰክሩልኝ ይችላሉ። ከእነርሱም ወደ ደማስቆ ላሉት ወንድሞች[a] ደብዳቤዎችን ተቀብዬ፣ በዚያ ታስረው የነበሩትንም ወደ ኢየሩሳሌም ለማምጣት፣ እንዲቀጡ እዚያ እጓዝ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለወንድሞችና ለእህቶች።” የግሪኩ ጽሑፍ “ወንድሞች” ይላል፤ ቃሉ ግን በአንዳንድ አውዶች ሰፋ ያለ ማኅበረሰብን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
