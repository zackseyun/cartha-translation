lexical_decisions:
- source_word: ἐξεχύννετο
  choice: ደም በሚፈስስበት
  rationale: ያልተፈጸመ ቀጣይ ድርጊትን የሚያሳየውን የግሪኩን ኢምፐርፌክት ተገብሮ ቅርጽ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ደም እንደ ፈሳሽ የመፍሰሱንም ምስላዊነት ይጠብቃል።
- source_word: αἷμα
  choice: ደም
  rationale: ቀጥተኛና መደበኛ አቻ ትርጉም ነው።
- source_word: μάρτυρός
  choice: ምስክር
  rationale: የቃሉን መሠረታዊ የግሪክ ትርጉም ይጠብቃል፤ በክርስቲያናዊ አጠቃቀም ከሞት ጋር የተያያዘው ትርጉም በማስታወሻ ተገልጿል።
- source_word: ἐφεστὼς
  choice: በዚያ ቆሜ
  rationale: በቦታው ቀርቦ መገኘትን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: συνευδοκῶν
  choice: በመገደሉም ተስማምቼ
  rationale: ተራ መገኘትን ሳይሆን ድርጊቱን መፍቀድና መደገፍን ያሳያል፤ የተጨመረው የድርጊት ማጣቀሻ በአማርኛ ግልጽነትን ያመጣል።
- source_word: φυλάσσων
  choice: እጠብቅ ነበር
  rationale: ልብሶቹን መጠበቅና መከታተል የሚለውን ተጨባጭ ድርጊት ይገልጻል።
- source_word: ἱμάτια
  choice: ልብሶች
  rationale: በዐውዱ የተወለቁ ውጫዊ ልብሶችን ሊያመለክት ቢችልም፣ ሰፊውን የግሪክ ቃል ያለ አስፈላጊ ማጥበብ የሚያስተላልፍ ተፈጥሯዊ አማርኛ ነው።
- source_word: ἀναιρούντων
  choice: የሚገድሉትን
  rationale: በዚህ ዐውድ ሰውን ማጥፋትን በግልጽና ቀጥተኛ ዘመናዊ ቋንቋ ይገልጻል፤ ‘መግደል’ በቃሉ ውስጥ ያልተገለጸ ተጨማሪ የሕግ ፍርድ አያስገባም።
- source_word: αὐτὸς
