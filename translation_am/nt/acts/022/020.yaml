  text: እናም የምስክርህ እስጢፋኖስ ደም በሚፈስስበት ጊዜ፣[a] እኔ ራሴ በዚያ ቆሜ ነበር፤ እደግፍም ነበር፤ እርሱን የሚገድሉትን ሰዎች ልብሶችም እጠብቅ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሰማዕትህ።” የግሪኩ ቃል “ምስክር” ማለት ሲሆን፣ በክርስቲያናዊ አጠቃቀም ስለ ምስክርነቱ ከሚሞት ሰው ጋር በተለይ ተያይዞ ጥቅም ላይ ዋለ።
