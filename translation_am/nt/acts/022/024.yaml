  text: ἐκέλευσεν ⸂ὁ χιλίαρχος εἰσάγεσθαι αὐτὸν⸃ εἰς τὴν παρεμβολήν, ⸀εἴπας μάστιξιν ἀνετάζεσθαι αὐτὸν ἵνα ἐπιγνῷ δι’ ἣν αἰτίαν οὕτως ἐπεφώνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/024.yaml
  text: The tribune ordered him to be brought into the barracks[a], saying that he should be examined by scourging[b], so that he might find out for what reason they were shouting against him like this.
translation:
  language: am
  text: የሮም ጦር አዛዡ እርሱን ወደ ወታደሮቹ ማደሪያ[a] እንዲያስገቡት አዘዘ፤ ሕዝቡ በእርሱ ላይ እንዲህ ይጮኹበት የነበረው በምን ምክንያት እንደሆነ ለማወቅ፣ በጅራፍ እንዲመረመር[b] አሳሰበ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ወደ ሰፈሩ» ወይም «ወደ ምሽጉ»። እዚህ ቃሉ በኢየሩሳሌም የነበረውን የሮም ወታደሮች ማደሪያ ያመለክታል።
    reason: cultural_note
  - marker: b
    text: ወይም፣ «በግርፋት እንዲጠየቅ»። የግሪኩ አገላለጽ መመርመርንና መርመራው በግርፋት እንደሚደረግ አጣምሮ ይገልጻል።
    reason: lexical_alternative
lexical_decisions:
- source_word: χιλίαρχος
  choice: የሻለቃ አዛዥ
  rationale: ቃሉ በሮም ጦር ውስጥ ከፍተኛ ማዕረግ ያለውን አዛዥ ያመለክታል። «የሻለቃ አዛዥ» ለዘመናዊ አንባቢ ግልጽ ሲሆን ከአጠቃላዩ «አዛዥ» ይልቅ ወታደራዊ ደረጃውን ያሳያል።
- source_word: παρεμβολή
  choice: የወታደሮች ሰፈር
  rationale: በኢየሩሳሌም አውድ የሮም ወታደሮች የሚቀመጡበትን የምሽጉን ክፍል ያመለክታል፤ «የወታደሮች ሰፈር» ተግባራዊ ትርጉሙን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: εἰσάγεσθαι αὐτόν
  choice: እርሱን … እንዲያስገቡት
  rationale: የግሪኩን ተደራጊ ቅርጽና በሌሎች ወደ ውስጥ መወሰዱን ይጠብቃል።
- source_word: μάστιξιν ἀνετάζεσθαι
  choice: በጅራፍ እየተገረፈ እንዲመረመር
  rationale: ἀνετάζεσθαι የመመርመርን ሐሳብ፣ μάστιξιν ደግሞ መርመራው በግርፋት እንደሚፈጸም በግልጽ ያሳያሉ። አገላለጹ ሁለቱንም አካላት ሳያቀልል ይጠብቃል።
- source_word: ἵνα ἐπιγνῷ
  choice: ለማወቅ
  rationale: የአዛዡን የምርመራ ዓላማ በተፈጥሯዊና ግልጽ አማርኛ ያሳያል።
- source_word: δι’ ἣν αἰτίαν
  choice: ስለ ምን
  rationale: የጩኸቱን ምክንያት የሚጠይቅ ሲሆን በግሪኩ ያልተገለጸ መደበኛ የሕግ ክስ አያስገባም።
- source_word: οὕτως ἐπεφώνουν αὐτῷ
  choice: በዚህ ሁኔታ እንደጮኸበት
  rationale: ያልተቋረጠውንና በእርሱ ላይ ያነጣጠረውን የሕዝቡን ጠላትነት የተሞላበት ጩኸት ያስተላልፋል።
