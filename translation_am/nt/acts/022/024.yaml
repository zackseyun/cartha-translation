    issue: «የሻለቃ አዛዥ» for χιλίαρχος
    rationale: «ሻለቃ» is a specific modern Ethiopian military rank and «የሻለቃ አዛዥ» is both awkward and historically misleading for the Roman tribune/chiliarch.
  - severity: low
    issue: Purpose subject and ongoing outcry are not fully clear
    rationale: «ለማወቅ» can leave the knower implicit, whereas the tribune is the subject of ἐπιγνῷ. «ይጮኹበት እንደነበር» more clearly reflects the imperfect ἐπεφώνουν.
