id: ACT.22.7
reference: Acts 22:7
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἔπεσά τε εἰς τὸ ἔδαφος καὶ ἤκουσα φωνῆς λεγούσης μοι· Σαοὺλ Σαούλ, τί με διώκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/007.yaml
  text: I fell to the ground and heard a voice saying to me, ‘Saul, Saul, why are you persecuting me?’
translation:
  language: am
  text: ወደ መሬትም ወደቅሁ፤ እንዲህም የሚለኝን ድምፅ ሰማሁ፦ “ሳውል፣ ሳውል፣ ለምን ታሳድደኛለህ?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσά
  choice: ወደቅሁ
  rationale: የπίπτω የአንደኛ መደብ ነጠላ ያለፈ ጊዜ ግስ ስለሆነ፣ በቀጥታና በተፈጥሯዊ አማርኛ “ወደቅሁ” ተብሏል።
- source_word: τε
  choice: -ም
  rationale: ከቀደመው ንግግር ጋር ያለውን አያያዥነት የአማርኛው “-ም” በተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: εἰς τὸ ἔδαφος
  choice: ወደ መሬት
  rationale: የመውደቁን መድረሻ በቀጥታ ይገልጣል፤ “ወደ መሬት ወደቅሁ” በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: ἤκουσα
  choice: ሰማሁ
  rationale: የἀκούω የአንደኛ መደብ ነጠላ ያለፈ ጊዜ ቅርጽን በቀጥታ ያስተላልፋል።
- source_word: φωνῆς
  choice: ድምፅ
  rationale: ተከትሎ የሚመጣው ቀጥተኛ ንግግር ይህ የአንድ ተናጋሪ ድምፅ መሆኑን ያሳያል፤ “ድምፅ” የተፈጥሮ አማርኛ ምርጫ ነው።
- source_word: λεγούσης μοι
  choice: እንዲህ የሚለኝን
  rationale: ተሳቢው ከφωνῆς ጋር ያለውን ግንኙነትና μοι የሚገልጠውን “ለእኔ” ትርጉም ይጠብቃል፤ ቀጥተኛውን ንግግርም በተፈጥሯዊ መንገድ ያስገባል።
- source_word: Σαοὺλ Σαούλ
  choice: ሳውል፣ ሳውል
  rationale: የግል ስሙ በተለመደው የአማርኛ አጻጻፍ ተጽፎ፣ የጥሪው ድግግሞሽና አጽንዖት ተጠብቋል።
- source_word: τί
  choice: ለምን
  rationale: ከድርጊት ግስ ጋር τί የድርጊቱን ምክንያት ይጠይቃል፤ “ለምን” ይህንን በቀጥታ ያስተላልፋል።
- source_word: με
  choice: -ኛ-
  rationale: የአንደኛ መደብ ነጠላ ተሳቢው በአማርኛ ግስ ውስጥ በ“-ኛ-” ቅጥያ በግልጽ ሁኔታ ተጠብቋል።
- source_word: διώκεις
  choice: ታሳድደኛለህ
  rationale: በዚህ የጥላቻና የጭቆና አውድ διώκω “ማሳደድ” ማለት ነው። የአማርኛው የአሁን ጊዜ ቅርጽ የቀጠለውን ድርጊትና የሁለተኛ መደብ ነጠላነትን ይጠብቃል።
theological_decisions:
- issue: ተናጋሪው የሳውልን በአማኞች ላይ የተፈጸመ ማሳደድ ከራሱ ጋር ማዛመዱ
  choice: “ታሳድደኛለህ” በማለት ቀጥተኛውን “እኔን” ትርጉም መጠበቅ
  alternative: “ሕዝቤን ታሳድዳለህ” ወይም “ተከታዮቼን ታሳድዳለህ” ብሎ ማብራራት
  rationale: ግሪክኛው με በቀጥታ “እኔን” ይላል። ተናጋሪው በአማኞች ላይ የሚደረገውን ማሳደድ በራሱ ላይ እንደተደረገ የሚገልጠውን ሥነ መለኮታዊ ውጥረት ያለ ትርጓሜያዊ መስፋፋት መጠበቅ ይገባል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ይጠቀማል። “እንዲህም የሚለኝን ድምፅ” የግሪክኛውን ተሳቢ አወቃቀር በተፈጥሯዊ አማርኛ ያቀርባል። ምንም የግርጌ ማስታወሻ አያስፈልግም።
