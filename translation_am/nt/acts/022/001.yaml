  choice: ወንድሞችና አባቶች ሆይ
  rationale: Ἄνδρες ከተከታዮቹ የጥሪ ስሞች ጋር በግሪክኛ የተለመደ የንግግር መክፈቻ ነው። በአማርኛ «ወንዶች፣ ወንድሞችና አባቶች» ማለት አላስፈላጊ ድግግሞሽ ስለሚፈጥር፣ «ወንድሞችና አባቶች ሆይ» የወንድ ተደራሲዎቹንና የክብር አነጋገሩን በተፈጥሮ ያስተላልፋል።
- source_word: ἀκούσατέ
  choice: ስሙ
  rationale: የሁለተኛ መደብ ብዙ ቁጥር ትእዛዛዊ ግስ ሲሆን፣ በይፋዊ ንግግር «ስሙ» ቀጥተኛና ክቡር አቻ ነው።
- source_word: μου … ἀπολογίας
  choice: የመከላከያ ንግግሬን
  rationale: ἀπολογία የጥፋት ይቅርታ ሳይሆን ሰው ለራሱ የሚያቀርበው ምክንያታዊ መልስ ወይም መከላከያ ነው። «የመከላከያ ንግግሬ» ይህን በዘመናዊ አማርኛ ግልጽ ያደርገዋል።
- source_word: πρὸς ὑμᾶς
  choice: በፊታችሁ የማቀርበውን
  rationale: መከላከያው ለተደራሲዎቹ እንደሚቀርብ ያመለክታል። «በፊታችሁ የማቀርበውን» የይፋዊ ንግግሩን ሁኔታ በተፈጥሮ ይገልጣል።
- source_word: νυνὶ
  choice: አሁን
  rationale: የጥሪውን ወቅታዊነትና አፋጣኝነት በቀጥታ ይጠብቃል።
