base_translation:
  language: en
  yaml_path: translation/nt/acts/022/016.yaml
  text: And now why are you waiting? Rise[a], be baptized, and wash away your sins[b], calling on his name.
translation:
  language: am
  text: አሁንስ ለምን ትዘገያለህ?[a] ተነሥተህ ተጠመቅ፤ ስሙን ጠርተህ ኃጢአቶችህን ታጠብ[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ምን ትጠብቃለህ?”
    reason: lexical_alternative
  - marker: b
    text: የግሪኩ ተውሳከ ግስ “ስሙን ጠርተህ” ወይም “ስሙን በመጥራት” ተብሎ ሊገባ ይችላል፤ ትርጉሙ ከትእዛዛቱ ጋር ያለውን ትክክለኛ ግንኙነት ሳይወስን ክፍት ይተወዋል።
