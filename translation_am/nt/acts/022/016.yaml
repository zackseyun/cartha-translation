lexical_decisions:
- source_word: τί μέλλεις
  choice: ለምን ትዘገያለህ?
  rationale: በዚህ አውድ የግሪኩ አገላለጽ ስለወደፊት ዕቅድ ከመጠየቅ ይልቅ መዘግየትን የሚገሥጽ ጥያቄ ነው።
- source_word: ἀναστὰς
  choice: ተነሥተህ
  rationale: የግሪኩ የተውሳከ ግስ ቀጣዮቹን ትእዛዛት የሚያጅብ ሲሆን፣ በአማርኛ ‘ተነሥተህ’ የተግባሩን ቅደም ተከተልና አስቸኳይነት በተፈጥሮ ይገልጣል።
- source_word: βάπτισαι
  choice: ተጠመቅ
  rationale: የመካከለኛ ድምፅ ትእዛዙ በተፈጥሯዊ ዘመናዊ አማርኛ ‘ተጠመቅ’ ተብሎ ይገለጣል።
- source_word: ἀπόλουσαι
  choice: ታጠብ
  rationale: ግሱ ማጠብን ወይም በማጠብ ማስወገድን ያመለክታል፤ ከ‘ኃጢአቶችህን’ ጋር ‘ታጠብ’ ቀጥተኛና ተፈጥሯዊ ነው።
- source_word: τὰς ἁμαρτίας σου
  choice: ኃጢአቶችህን
  rationale: የተለመደውን የአዲስ ኪዳን ትርጉም ያለ ትርጓሜያዊ ማስፋፊያ በቀጥታ ያስተላልፋል።
- source_word: ἐπικαλεσάμενος
  choice: እየጠራህ
  rationale: የተውሳከ ግሱን ከትእዛዛቱ ጋር ያለውን ቅርብ ግንኙነት ይጠብቃል፤ ግንኙነቱ ጊዜያዊ ነው ወይስ ዘዴን የሚገልጥ ነው የሚለውን በግድ አይወስንም።
- source_word: τὸ ὄνομα αὐτοῦ
  choice: ስሙን
  rationale: ግሪኩ ግልጽ ማዕረግ ሳይጨምር ‘የእርሱን ስም’ የሚል ተውላጠ ስም ይጠቀማል፤ ‘ስሙን’ ይህንኑ በቀጥታ ይጠብቃል።
theological_decisions:
- issue: የጥምቀት፣ የኃጢአት መታጠብና ስሙን የመጥራት ግንኙነት
  choice: የግሪኩን ቅደም ተከተልና የተውሳከ ግሱን ክፍት ግንኙነት በመጠበቅ ትክክለኛው ሥነ መለኮታዊ ግንኙነት አልተወሰነም።
  alternative: ጥምቀት ራሱ ኃጢአትን የማጠብ መንገድ ነው፤ ወይም ስሙን መጥራት የማጠቡ መንገድ ነው፤ ወይም ሁሉም አንድ የመለወጥና የመግቢያ ሂደት ናቸው።
  rationale: ጥቅሱ ሁለት የተቀናጁ ትእዛዛትንና አንድ ተውሳከ ግስን ያቀርባል፤ ነገር ግን አንዱን የእምነት ወገን ብቻ እንዲደግፍ አያስገድድም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ተነሥተህ’ እና ‘ተጠመቅ’ የንግግሩን አስቸኳይ ትእዛዛዊ ቃና ይጠብቃሉ።
