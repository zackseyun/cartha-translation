base_translation:
  language: en
  yaml_path: translation/nt/acts/022/008.yaml
  text: And I answered[a], ‘Who are you, Lord?’ And he said to me, ‘I am Jesus the Nazarene[b], whom you are persecuting.’
translation:
  language: am
  text: እኔም፣ “ጌታ ሆይ፣[a] ማን ነህ?” ብዬ መለስኩ። እርሱም፣ “እኔ አንተ የምታሳድደው ናዝራዊው[b] ኢየሱስ ነኝ።” አለኝ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ጌታዬ።” የግሪኩ κύριε “ጌታ” የሚል ማዕረግ ወይም የአክብሮት አጠራር ሊሆን ይችላል።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ “የናዝሬቱ ኢየሱስ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθην
  choice: ብዬ መለስኩ
  rationale: የግሪኩን መልስ መስጠት በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል፤ ቀጥተኛውን ንግግርም ከግሱ ጋር በትክክል ያገናኛል።
- source_word: Τίς εἶ
  choice: አንተ ማን ነህ?
  rationale: የግሪኩን ቀጥተኛ ጥያቄ በግልጽና ተፈጥሯዊ የአማርኛ አወቃቀር ያቀርባል።
- source_word: κύριε
  choice: ጌታ ሆይ
  rationale: κύριος የሚለውን የተለመደ የክብር ማዕረግ ይጠብቃል፤ በዚህ ስፍራ ግን የአክብሮት አጠራርም ሊሆን ስለሚችል አማራጩ በማስታወሻ ተጠብቋል።
- source_word: εἶπέν τε πρὸς ἐμέ
  choice: እርሱም … አለኝ
  rationale: τε ያለውን የማያያዝ ኃይል በ‘ም’ ይይዛል፤ πρὸς ἐμέ ከλέγω ጋር በአማርኛ ‘አለኝ’ ተብሎ በተፈጥሮ ይገለጻል።
- source_word: Ἐγώ εἰμι
  choice: እኔ … ነኝ
  rationale: ምንም ማብራሪያ ሳይጨመር ቀጥተኛውን ራስን የመግለጥ አነጋገር ይጠብቃል።
- source_word: Ἰησοῦς
  choice: ኢየሱስ
  rationale: በመደበኛው የአማርኛ መጽሐፍ ቅዱሳዊ አጻጻፍ የቀረበ የግል ስም ነው።
- source_word: ὁ Ναζωραῖος
  choice: ናዝራዊው
  rationale: የግሪኩን መስተዋድድ ያለውን የመገኛ ቅጽል በአጭርና በተለመደ አማርኛ ይጠብቃል፤ ‘የናዝሬቱ’ የሚለው አማራጭ በማስታወሻ ተገልጿል።
- source_word: ὃν σὺ διώκεις
  choice: አንተ የምታሳድደው
  rationale: διώκω በዚህ አውድ የጠላትነት ስደትን ወይም ማሳደድን ያመለክታል፤ የአሁን ጊዜውን ቀጣይ ድርጊትም ይጠብቃል።
theological_decisions:
- issue: ሳውል κύριε ብሎ የተናገረው አጠራር
  choice: ጌታ ሆይ
  alternative: ጌታዬ / ክቡር ሆይ የሚል የአክብሮት አጠራር
  rationale: ‘ጌታ’ የκύριοςን መደበኛ ትርጉምና የትረካውን ክርስቶሳዊ አውድ ይጠብቃል። ሆኖም ሳውል ተናጋሪውን ገና ሙሉ በሙሉ ሳያውቅ እንደ አክብሮት አጠራር ተጠቅሞበት ሊሆን የሚችለውን ጥርጣሬ ማስታወሻው ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የጥያቄውና የመልሱ ቀጥተኛነት ተጠብቋል፤ የκύριε ትርጉማዊ ጥርጣሬ ሳይወገድ በማስታወሻ ቀርቧል።
