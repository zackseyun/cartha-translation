  yaml_path: translation/nt/acts/022/026.yaml
  text: When the centurion heard this[a], he went to the commander and reported it, saying[b], “What are you about to do? For this man is a Roman citizen.”
translation:
  language: am
  text: መቶ አለቃውም ይህን በሰማ ጊዜ ወደ አዛዡ ሄዶ፣ “ምን ልታደርግ ነው?[a] ይህ ሰው ሮማዊ ዜጋ ነውና[b]” ብሎ ነገረው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪክ አገላለጡ ወዲያው ሊደረግ የተቃረበን ድርጊት ወይም ለማድረግ የታሰበን ድርጊት ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “ይህ ሰው ሮማዊ ነው።” በዐውዱ ግን የሮማ ዜግነት እንዳለው ማለት ነው።
    reason: lexical_alternative
