base_translation:
  language: en
  yaml_path: translation/nt/acts/022/002.yaml
  text: 'But when they heard that he was addressing them in the Hebrew language[a], they became even more quiet. And he said:'
translation:
  language: am
  text: እርሱም በዕብራይስጥ ቋንቋ[a] እያነጋግራቸው መሆኑን በሰሙ ጊዜ፣ ይበልጥ ዝም አሉ። እርሱም እንዲህ አለ፦
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ‘በአራማይክ’ ሊሆን ይችላል፤ የግሪክ ጽሑፉ ‘በዕብራይስጥ ቋንቋ’ ይላል፣ በዚህ አውድ ግን በይሁዳ አካባቢ የነበረውን ሴማዊ ንግግር ሊያመለክት ይችላል።
