lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: በሰሙ ጊዜ
  rationale: የአኦሪስት አሳታፊውን ጊዜያዊ ኃይል በተፈጥሯዊ አማርኛ ያሳያል፤ δὲ የሚያመለክተው ቀላል የትረካ ለውጥ በአማርኛው የዐረፍተ ነገር ፍሰት ተገልጧል።
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: በዕብራይስጥ ቋንቋ
  rationale: የግሪክ አገላለጹን በዋናው ጽሑፍ ሳይተካ ይጠብቃል፤ በዚህ አውድ አራማይክን ሊያመለክት የሚችልበት አማራጭ በግርጌ ማስታወሻ ተገልጧል።
- source_word: προσεφώνει αὐτοῖς
  choice: እንደሚናገራቸው
  rationale: ያልተጠናቀቀውን የኢምፐርፌክት ግስ እና ንግግሩ ወደ ሕዝቡ መቅረቡን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: μᾶλλον παρέσχον ἡσυχίαν
  choice: ይበልጥ ጸጥ አሉ
  rationale: ቃል በቃል ‘የበለጠ ጸጥታ ሰጡ’ የሚለውን ፈሊጣዊ አገላለጽ በዘመናዊና ግልጽ አማርኛ ያቀርባል፤ μᾶλλον ያለውን የንጽጽር ኃይልም ‘ይበልጥ’ ይጠብቃል።
- source_word: καὶ φησίν
  choice: እርሱም እንዲህ አለ፦
  rationale: ታሪካዊውን የአሁን ጊዜ ግስ በአማርኛ ትረካ ተፈጥሯዊ በሆነ ያለፈ ጊዜ ይተረጉማል፤ ሁለት ነጥቡ ቀጣዩን ቀጥተኛ ንግግር ያስተዋውቃል።
theological_decisions:
- issue: τῇ Ἑβραΐδι διαλέκτῳ የሚለው ማጣቀሻ
  choice: በዋናው ጽሑፍ ‘በዕብራይስጥ ቋንቋ’ ተብሎ ተጠብቋል።
  alternative: አገላለጹ በይሁዳ አካባቢ የነበረውን ሴማዊ ንግግር፣ ማለትም አራማይክን፣ እንደሚያመለክት መተርጎም።
  rationale: ጉዳዩ በዋናነት ቋንቋዊና ታሪካዊ ነው። የግሪክ ጽሑፉ በግልጽ ‘ዕብራይስጥ’ ስለሚል ይህ በዋናው ጽሑፍ ተጠብቋል፤ ሊኖር የሚችለው የአራማይክ ትርጉም ግን በግርጌ ማስታወሻ ቀርቧል።
