lexical_decisions:
- source_word: ὅτι
  choice: -ና (ትሆናለህና)
  rationale: በዐውዱ ውስጥ ὅτι ለተሰጠው ትእዛዝ ምክንያትን ወይም ማብራሪያን ያስገባል፤ በአማርኛ በግሱ መጨረሻ ያለው «-ና» ይህን አገናኝ ኃይል በተፈጥሮ ያሳያል።
- source_word: ἔσῃ
