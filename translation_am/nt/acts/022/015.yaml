- source_word: πρὸς πάντας ἀνθρώπους
  choice: በሰዎች ሁሉ ፊት
  rationale: πρός ምስክርነቱ የሚደርስባቸውን ተደራሲዎች ያመለክታል፤ «በ…ፊት» የሕዝብ ፊት ምስክር መሆንን በተፈጥሮ ይገልጣል። «ሰዎች» ደግሞ የግሪኩን አጠቃላይ ሰብአዊ ትርጉም ይጠብቃል።
- source_word: ὧν
  choice: ስላ… ነገር
  rationale: የምስክርነቱን ይዘት ከ«አየህ»ና «ሰማህ» ጋር በተፈጥሮ ያገናኛል።
- source_word: ἑώρακας
  choice: ስላየኸው
