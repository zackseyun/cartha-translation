  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የዓረፍተ ነገሩ አወቃቀር የአማርኛን ተፈጥሯዊ ቅደም ተከተል ሲከተል፣ የምስክርነቱን ይዘት፣ ተደራሲዎችና ከጌታ ጋር ያለውን ግንኙነት ጠብቋል።
