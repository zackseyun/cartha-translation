- source_word: καὶ ἤκουσας
  choice: እና ስለሰማኸው
  rationale: ከማየት ጋር የተጣመረውን የመስማት ልምድ በግልጽና ተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: በጳውሎስ ተልእኮ ውስጥ የαὐτῷ አመልካችና የዳቲቭ ኃይል
  choice: «ለእርሱ»—ጳውሎስ ለጌታ/ለኢየሱስ ወይም በእርሱ ወገን ምስክር ይሆናል።
  alternative: «ስለ እርሱ»—ምስክርነቱ እርሱን እንደ ይዘት ያደርጋል፤ ወይም «ለእርሱ»ን ‘ወደ እርሱ’ በሚቀርብ አቅጣጫዊ ስሜት መረዳት።
  rationale: ዐውዱ አመልካቹን ከጌታ/ከኢየሱስ ጋር ያያይዘዋል። «ለእርሱ» የዳቲቩን ቅርጽና የውክልና/የማጣቀሻ አሻሚነት ከ«ስለ እርሱ» ይልቅ በቅርብ ይጠብቃል፤ አማራጩም በማስታወሻ ቀርቧል።
