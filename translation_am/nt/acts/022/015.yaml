- source_word: μάρτυς
  choice: ምስክር
  rationale: ቃሉ ያየውንና የሰማውን የሚመሰክር ሰው ማለት ሲሆን፣ «ምስክር» ትክክለኛና የተለመደ አቻ ነው።
- source_word: αὐτῷ
  choice: ለእርሱ
