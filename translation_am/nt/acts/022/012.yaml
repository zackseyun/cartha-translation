- source_word: τῶν κατοικούντων Ἰουδαίων
  choice: በዚያ በሚኖሩ አይሁድ
  rationale: κατοικούντων የቋሚ ነዋሪነትን ሐሳብ ያሳያል፤ ‘በዚያ’ የሚለው ከአውዱ የሚታወቀውን ደማስቆን ይጠቁማል። Ἰουδαίων እዚህ የሃይማኖትና የማኅበረሰብ ማንነትን ስለሚያመለክት ‘አይሁድ’ ተብሏል።
theological_decisions:
- issue: የἸουδαίων ትርጉም
  choice: አይሁድ
  alternative: ይሁዳውያን
  rationale: አውዱ በደማስቆ ስለሚኖረው የአይሁድ ማኅበረሰብ እንጂ ከይሁዳ ክልል ስለመጡ ሰዎች አያተኩርም። ሆኖም ቃሉ በሌላ አውድ የይሁዳን ሕዝብ ወይም ይሁዳውያንን ሊያመለክት ስለሚችል አማራጩ በማስታወሻ ተጠብቋል።
