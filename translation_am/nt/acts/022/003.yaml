- issue: παρὰ τοὺς πόδας Γαμαλιήλ የሚለውን ምስላዊ ፈሊጥ መጠበቅ
  choice: በገማልያል እግር ሥር
  alternative: በገማልያል ሥር / በገማልያል ተምሬ
  rationale: ቀጥተኛው ምስል የጥንቱን የመምህርና ተማሪ ግንኙነት ይጠብቃል፤ የፈሊጡ ትርጉም በእግር ማስታወሻ ተገልጧል።
- issue: ζηλωτής የሚለው ቃል ቴክኒካዊ የቡድን መጠሪያ እንዳይሆን
