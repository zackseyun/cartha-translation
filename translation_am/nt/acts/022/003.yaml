  text: ⸀Ἐγώ εἰμι ἀνὴρ Ἰουδαῖος, γεγεννημένος ἐν Ταρσῷ τῆς Κιλικίας, ἀνατεθραμμένος δὲ ἐν τῇ πόλει ταύτῃ παρὰ τοὺς πόδας Γαμαλιήλ, πεπαιδευμένος κατὰ ἀκρίβειαν τοῦ πατρῴου νόμου, ζηλωτὴς ὑπάρχων τοῦ θεοῦ καθὼς πάντες ὑμεῖς ἐστε σήμερον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/003.yaml
  text: I am a Jewish man[a], born in Tarsus of Cilicia, but brought up in this city at the feet of Gamaliel, educated according to the strictness of the law of our fathers[b], being zealous for God just as all of you are today.
translation:
  language: am
  text: “እኔ በኪልቅያ በምትገኘው ጠርሴስ የተወለድሁ አይሁዳዊ ሰው ነኝ፤ ነገር ግን በዚህች ከተማ በገማልያል እግር ሥር[a] ያደግሁ፣ በአባቶቻችን ሕግ ጥብቅነት መሠረት የሰለጠንሁ፣ ዛሬ ሁላችሁም እንደሆናችሁ ለእግዚአብሔር ቀናተኛ ነኝ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በገማልያል እግር ሥር” ማለት በገማልያል መምህርነት ሥር መሠልጠን ማለት ነው።
    reason: cultural_note
lexical_decisions:
- source_word: ἀνὴρ Ἰουδαῖος
  choice: አይሁዳዊ ሰው
  rationale: ἀνήρ የአዋቂ ወንድነትን ሲያመለክት Ἰουδαῖος ደግሞ የአይሁድነት ማንነቱን ይገልጣል፤ ይህ አተረጓጎም ሁለቱንም ክፍሎች ይጠብቃል።
- source_word: γεγεννημένος ἐν Ταρσῷ τῆς Κιλικίας
  choice: በኪልቅያ ጠርሴስ የተወለድሁ
  rationale: የትውልድ ቦታውንና ጠርሴስ በኪልቅያ የምትገኝ መሆኗን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἀνατεθραμμένος δὲ ἐν τῇ πόλει ταύτῃ
  choice: ነገር ግን በዚህች ከተማ ... አድጌ
  rationale: ἀνατρέφω እዚህ ማደግንና መሠልጠንን ያመለክታል፤ δέ ደግሞ የትውልድና የእድገት ቦታዎችን ንፅፅር ያሳያል።
- source_word: παρὰ τοὺς πόδας Γαμαλιήλ
  choice: በገማልያል እግር ሥር
  rationale: የመምህርና የደቀ መዝሙር ሥልጠናን የሚያመለክተውን ሕያው ምስላዊ አገላለጽ ይጠብቃል፤ ትርጉሙ በማስታወሻ ተብራርቷል።
- source_word: πεπαιδευμένος κατὰ ἀκρίβειαν
  choice: በ... ትክክለኛነት መሠረት የተማርሁ
  rationale: πεπαιδευμένος የተደራጀ ትምህርትን ሲገልጥ፣ ἀκρίβεια ጥብቅ ትክክለኛነትንና ዝርዝር ጥንቃቄን ያሳያል።
- source_word: τοῦ πατρῴου νόμου
  choice: በአባቶቻችን ሕግ
  rationale: πατρῷος ቅድመ አያቶችን ወይም ከአባቶች የተወረሰውን ያመለክታል፤ ‘አባቶቻችን’ ጳውሎስ ከአድማጮቹ ጋር ያለውን የጋራ ቅርስ በአውዱ መሠረት ያሳያል።
- source_word: ζηλωτὴς ὑπάρχων τοῦ θεοῦ
  choice: ለእግዚአብሔር ቀናተኛ የነበርሁ
  rationale: ζηλωτής ኃይለኛ ቅንዓትና ትጋት ያለውን ሰው ይገልጣል፤ ‘ቀናተኛ’ የፖለቲካ ቡድን ቴክኒካዊ ስምን ሳያስገባ ይህን ይጠብቃል።
- source_word: καθὼς πάντες ὑμεῖς ἐστε σήμερον
  choice: ዛሬ ሁላችሁም እንደሆናችሁት
  rationale: የጳውሎስን ከአድማጮቹ የአሁኑ ቅንዓት ጋር የሚያደርገውን ንፅፅርና የ‘ዛሬ’ን ጊዜያዊ አጽንዖት ይጠብቃል።
theological_decisions:
