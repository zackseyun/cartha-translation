id: ACT.2.19
reference: Acts 2:19
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ δώσω τέρατα ἐν τῷ οὐρανῷ ἄνω καὶ σημεῖα ἐπὶ τῆς γῆς κάτω, αἷμα καὶ πῦρ καὶ ἀτμίδα καπνοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/019.yaml
  text: 'And I will give wonders in the heaven above and signs on the earth below: blood and fire and a cloud of smoke.'
translation:
  language: am
  text: በላይ በሰማይ ድንቆችን፣ በታች በምድር ላይም ምልክቶችን እሰጣለሁ፤ ደምን፣ እሳትንና የጭስ ትነትን።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δώσω
  choice: እሰጣለሁ
  rationale: የδίδωμιን መሠረታዊ ትርጉም በቀጥታ ይጠብቃል። “አሳያለሁ” በአማርኛ ይበልጥ ልሙድ ቢሆንም፣ የግሪኩን የመስጠት አገላለጽ እንዳይተካ አልተመረጠም።
- source_word: τέρατα
  choice: ድንቆች
  rationale: ፍርሃትና መደነቅ የሚያስከትሉ ልዩ ክስተቶችን ያመለክታል፤ “ተአምራት” የሚለው እዚህ ያለውን የሰማይና የምድር ምልክቶች ስፋት ሊያጠብ ይችላል።
- source_word: ἐν τῷ οὐρανῷ ἄνω
  choice: በላይ በሰማይ
  rationale: የἄνωን አቅጣጫና የοὐρανόςን ሰማያዊ ትርጉም በተፈጥሯዊ የአማርኛ ቅደም ተከተል ያቀርባል።
- source_word: σημεῖα
  choice: ምልክቶች
  rationale: ከተራ አስደናቂ ክስተቶች በላይ ትርጉም የሚያመለክቱ ምልክቶች መሆናቸውን ይጠብቃል።
- source_word: ἐπὶ τῆς γῆς κάτω
  choice: በታችም በምድር ላይ
  rationale: ከ“በላይ በሰማይ” ጋር ያለውን ቀጥ ያለ ንጽጽር ይጠብቃል፤ γῆ እዚህ የአካባቢ መሬትን ሳይሆን ምድርን ያመለክታል።
- source_word: αἷμα
  choice: ደም
  rationale: ግልጽና ቀጥተኛ አቻ ሲሆን የትንቢቱን ሕያው ምስል ይጠብቃል።
- source_word: πῦρ
  choice: እሳት
  rationale: ግልጽና ቀጥተኛ የቃሉ አቻ ነው።
- source_word: ἀτμίδα καπνοῦ
  choice: የጭስ ደመና
  rationale: ἀτμίς ትነትን፣ ጉምን ወይም በአየር የተንሳፈፈ ጥቅጥቅ ነገርን ሊያመለክት ይችላል። “የጭስ ደመና” ምስሉን በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል፤ ቃል በቃል አማራጩ በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: በኢዩኤል ጥቅስ ውስጥ ያሉትን የሰማይና የምድር ስፍራዎች መተርጎም
  choice: በላይ በሰማይ … በታችም በምድር ላይ
  alternative: በላይ በሰማይ ጠፈር … በታች በመሬት ላይ
  rationale: ጥቅሱ ሰማይንና ምድርን የሚያካትት የትንቢት ምስል ያቀርባል። “ሰማይ/ምድር” የሚለው ንጽጽር ይህን ስፋት ይጠብቃል፤ ምስሉን ወደ አየር ሁኔታ ወይም ወደ አንድ አካባቢ አያጠበውም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የሰማይ/ምድር ተጓዳኝነትና የትንቢቱ ሕያው ምስሎች ተጠብቀዋል።
