revisions:
- from: በላይ በሰማይ ድንቆችን፣ በታችም በምድር ላይ ምልክቶችን እሰጣለሁ፤ እነርሱም ደም፣ እሳትና የጭስ ደመና[a] ናቸው።
  to: በላይ በሰማይ ድንቆችን፣ በታች በምድር ላይም ምልክቶችን እሰጣለሁ፤ ደምን፣ እሳትንና የጭስ ትነትን።
  rationale: Removed the added copular explanation so that blood, fire, and smoke-vapor remain part of the direct object sequence governed by “I will give.” Replaced “የጭስ ደመና” with the more source-faithful “የጭስ ትነት”; consequently, the former literal-alternative footnote is no longer needed.
