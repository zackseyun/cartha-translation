base_translation:
  language: en
  yaml_path: translation/nt/acts/002/037.yaml
  text: When they heard this[a], they were pierced to the heart, and they said to Peter and the rest of the apostles, “What should we do[b], brothers?”
translation:
  language: am
  text: ይህን በሰሙ ጊዜ[a] ልባቸው ተወጋ፤ ጴጥሮስንና የቀሩትን ሐዋርያት፣ “ምን እናድርግ፣ ወንድሞች ሆይ?” አሏቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ልባቸው ተቆረጠ።” የግሪኩ አገላለጽ ኃይለኛ የውስጥ መወቀስን ወይም ጭንቀትን ይገልጻል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσαντες
  choice: ይህን በሰሙ ጊዜ
  rationale: የአኦሪስት አንቀጽ ከጴጥሮስ ንግግር በኋላ የተከሰተውን ምላሽ ያሳያል፤ “ይህን” የሚለው ከቀደመው ንግግር በተፈጥሮ የሚገባ ማሟያ ነው።
- source_word: δὲ
  choice: በአማርኛው በተለየ ቃል አልተተረጎመም
  rationale: እዚህ ጠንካራ ተቃርኖን ሳይሆን የትረካ መሸጋገሪያን ያመለክታል፤ የአማርኛው የአረፍተ ነገር ቅርጽ ይህን ግንኙነት በቂ ያሳያል።
- source_word: κατενύγησαν τὴν καρδίαν
  choice: ልባቸው ተወጋ
  rationale: የግሪኩን የመወጋት ምስል ጠብቆ ከባድ የውስጥ መነካትን፣ መወቀስን ወይም ጭንቀትን ሳይገድብ ያስተላልፋል።
- source_word: εἶπόν τε
  choice: አሏቸው
  rationale: ቀጣዩን ድርጊት ከቀደመው ጋር ያገናኛል፤ ጥያቄውን የሚያስተዋውቅ ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
- source_word: πρὸς τὸν Πέτρον καὶ τοὺς λοιποὺς ἀποστόλους
  choice: ጴጥሮስንና የቀሩትን ሐዋርያት
  rationale: λοιπούς ጴጥሮስን ከሌሎቹ ሐዋርያት ለይቶ “የቀሩት” የሚለውን ሐሳብ ይጠብቃል።
- source_word: Τί ποιήσωμεν
  choice: ምን እናድርግ?
  rationale: የምክክር አኦሪስት ሰብጃንክቲቭን፣ ማለትም ተገቢውን የድርጊት መንገድ የመጠየቅን ኃይል፣ በዘመናዊና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἄνδρες ἀδελφοί
  choice: ወንድሞች ሆይ
  rationale: የወንድ ጾታ ቅርጹንና የቤተሰባዊ አድራሻውን ይጠብቃል፤ በአማርኛም የተከበረና ተፈጥሯዊ የጥሪ አገላለጽ ነው።
theological_decisions:
- issue: በጾታ የተወሰነው የጥሪ አገላለጽ (ἄνδρες ἀδελφοί)
  choice: ወንድሞች ሆይ
  alternative: ወንድሞችና እህቶች ሆይ / ወንዶች ወንድሞች ሆይ
  rationale: ግሪኩ በሰዋሰው የወንድ ጾታ ቅርጽ አለው፤ ስለዚህ ዋናው ጽሑፍ ይህን አያጠፋውም። ሆኖም እንደ የተለመደ የአድራሻ አገላለጽ ሰፊውን ተሰብሳቢ ሊያካትት የሚችል መሆኑ እንደ አማራጭ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የመወጋት ምስል በዋናው ጽሑፍ ተጠብቋል። የእንግሊዝኛው [b] ማስታወሻ በአማርኛ ዋና ጽሑፍ ውስጥ ምልክት አላገኘም፤ ምክንያቱም ከ“ምን እናድርግ?” ጋር ሳይሆን ከἄνδρες ἀδελφοί ጋር የተያያዘ ሲሆን፣ “ወንድሞች ሆይ” በአማርኛ በቀጥታና በተፈጥሮ ተተርጉሟል።
