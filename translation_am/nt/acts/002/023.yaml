  text: 'ይህ ሰው እግዚአብሔር በወሰነው ዕቅድና በቀድሞ እውቀቱ መሠረት አሳልፎ ተሰጠ፤ እናንተም ሕግ በሌላቸው ሰዎች እጅ[a] በመስቀል ላይ ቸንክራችሁ ገደላችሁት[b]።


    [a] ወይም፣ “ሕግ በሌላቸው ሰዎች አማካይነት።” የግሪኩ ጽሑፍ “እጅ” የሚለውን ቃል በነጠላ ቁጥር ይጠቀማል።


    [b] ወይም፣ “ለሞት ዳረጋችሁት።”'
  philosophy: optimal-equivalence
