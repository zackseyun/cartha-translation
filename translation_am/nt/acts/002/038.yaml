base_translation:
  language: en
  yaml_path: translation/nt/acts/002/038.yaml
  text: And Peter said to them[a], “Repent, and let each of you be baptized in the name of Jesus the Messiah for the forgiveness of your sins[b], and you will receive the gift of the Holy Spirit.”
translation:
  language: am
  text: ጴጥሮስም፣ “ንስሐ ግቡ፤ እያንዳንዳችሁም ለኃጢአቶቻችሁ ይቅርታ[b] በኢየሱስ መሲሕ[a] ስም ይጠመቅ፤ የመንፈስ ቅዱስንም ስጦታ ትቀበላላችሁ።” አላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “መሲሕ” የሚለው “ክርስቶስ” ተብሎም ሊተረጎም ይችላል። የግሪኩ Χριστός በዚህ አውድ ማዕረግ በመሆኑ፣ ትርጉሙን ግልጽ ለማድረግ “መሲሕ” ተብሏል።
    reason: alternative_reading
  - marker: b
    text: “ለኃጢአቶቻችሁ ይቅርታ” የሚለው የግሪኩን ሐረግ በቀጥታ ይተረጉማል። በዚህ ስፍራ ጥምቀት ከይቅርታ ጋር እንዴት እንደሚዛመድ ተርጓሚዎች ይለያያሉ፤ ትርጉሙ ከጽሑፉ አነጋገር ባለፈ ክርክሩን አይወስንም።
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετανοήσατε
  choice: ንስሐ ግቡ
  rationale: የውሳኔ፣ የአሳብና የአካሄድ ለውጥን የሚያመለክተውን የብዙ ቁጥር ትእዛዝ በተለመደና ክቡር የአማርኛ አገላለጽ ያቀርባል።
- source_word: βαπτισθήτω ἕκαστος ὑμῶν
  choice: እያንዳንዳችሁም ... ይጠመቅ
  rationale: የግሪኩን ነጠላ ተገብሮ ትእዛዝና የἕκαστος አከፋፋይ አጽንዖት ይጠብቃል።
- source_word: ἐπὶ τῷ ὀνόματι
  choice: በ...ስም
  rationale: በጥምቀት አውድ የተለመደ ተመጣጣኝ አገላለጽ ሲሆን መሠረትን፣ ሥልጣንን ወይም እምነትን ከሚመለከቱ ልዩ ንዑስ ትርጉሞች አንዱን አይጭንም።
- source_word: Ἰησοῦ Χριστοῦ
  choice: ኢየሱስ መሲሕ
  rationale: Χριστός በዚህ የጴጥሮስ አዋጅ ውስጥ የማዕረግ ትርጉሙን ይዞ ስለሚሠራ፣ መሲሕ ተብሎ ተተርጉሟል።
- source_word: εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν
  choice: ለኃጢአቶቻችሁ ይቅርታ
  rationale: የεἰς ዓላማን ወይም ውጤትን የሚጠቁም ኃይል በቀጥታ ይቀርባል፤ ጥምቀት ከይቅርታ ጋር ስላለው ግንኙነት የትርጓሜ ክርክሩን አይፈታም።
- source_word: λήμψεσθε τὴν δωρεὰν τοῦ ἁγίου πνεύματος
  choice: የመንፈስ ቅዱስንም ስጦታ ትቀበላላችሁ
  rationale: የወደፊት ጊዜውን ተስፋ እና δωρεά የሚያመለክተውን በነጻ የተሰጠ ስጦታ በተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: ጥምቀትና የኃጢአት ይቅርታ በεἰς ἄφεσιν ያላቸው ግንኙነት
  choice: “ለኃጢአቶቻችሁ ይቅርታ” ተብሎ በቀጥታ ተተርጉሟል።
  alternative: “ኃጢአቶቻችሁ ይቅር ስለተባሉ” ወይም “ኃጢአቶቻችሁ ይቅር እንዲባሉ”
  rationale: የመጀመሪያውን ቋንቋ ዓላማ/ውጤት ክፍትነት ይጠብቃል፤ የቤተ እምነት የሥርዓተ ጥምቀት አቋም አይጨምርም።
- issue: የΧριστοῦ አተረጓጎም
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: በሐዋርያት ሥራ 2 አውድ ቃሉ የተቀባውን ንጉሥ የሚያመለክት ማዕረግ ሆኖ በግልጽ ይሠራል።
