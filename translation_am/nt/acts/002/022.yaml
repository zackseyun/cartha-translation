  text: Ἄνδρες Ἰσραηλῖται, ἀκούσατε τοὺς λόγους τούτους. Ἰησοῦν τὸν Ναζωραῖον, ἄνδρα ⸂ἀποδεδειγμένον ἀπὸ τοῦ θεοῦ⸃ εἰς ὑμᾶς δυνάμεσι καὶ τέρασι καὶ σημείοις οἷς ἐποίησεν δι’ αὐτοῦ ὁ θεὸς ἐν μέσῳ ὑμῶν, ⸀καθὼς αὐτοὶ οἴδατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/022.yaml
  text: 'Men of Israel[a], hear these words: Jesus the Nazarene, a man attested to you by God with miracles and wonders and signs that God did through him in your midst[b], just as you yourselves know—'
translation:
  language: am
  text: እስራኤላውያን ወንዶች ሆይ፣ እነዚህን ቃላት ስሙ፤ ናዝራዊው ኢየሱስ[a]፣ እግዚአብሔር በእርሱ በመካከላችሁ ባደረጋቸው ተአምራት[b]፣ ድንቅ ነገሮችና ምልክቶች ለእናንተ ያረጋገጠው ሰው፣ ይህንም እናንተ ራሳችሁ ታውቃላችሁ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የናዝሬቱ ኢየሱስ” ወይም “ናዞራዊው ኢየሱስ” ተብሎም ሊተረጎም ይችላል። የግሪኩ Ναζωραῖος ከናዝሬት ጋር የተያያዘ የመገኛ ወይም የመለያ ስያሜ ነው።
    reason: lexical_alternative
  - marker: b
    text: “የኃይል ሥራዎች” ተብሎም ሊተረጎም ይችላል። የግሪኩ δυνάμεσι በቃል ደረጃ “ኃይሎች” የሚል ሲሆን፣ በዚህ ዐውድ የመለኮታዊ ኃይል መገለጫ የሆኑ ተአምራትን ያመለክታል።
    reason: lexical_alternative
