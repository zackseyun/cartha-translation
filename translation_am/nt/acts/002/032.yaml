  terminology: እግዚአብሔር, አስነሣው, and ምስክሮች are fitting established and understandable biblical-register terms. The footnote’s alternative duplicated the corrected main wording, so it is replaced by a genuine lexical alternative while retaining the resurrection clarification.
  issues:
  - severity: medium
    issue: The main text adds ከሙታን.
    rationale: Although resurrection is unquestionably the contextual sense of ἀνέστησεν, the source text does not explicitly contain “from the dead” in this verse. It should be left to the contextual footnote rather than inserted into the translation.
  - severity: low
    issue: Redundant case marking in ይህን ኢየሱስን.
    rationale: The demonstrative already marks the object relation; ይህን ኢየሱስ is the more idiomatic modern Amharic expression.
  - severity: low
    issue: እኛም adds an additive nuance.
    rationale: The Greek emphasizes “all of us” but does not contain a connective equivalent to “also.”
