  source_fidelity: The added phrase ከሙታን (“from the dead”) is contextually appropriate but is not stated in the Greek of this verse. The transitive አስነሣው accurately renders ἀνέστησεν and should stand without that addition. The Greek relative pronoun refers to Jesus; የዚህ ምስክሮች preserves this naturally.
