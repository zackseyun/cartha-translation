review_pass:
  verdict: revise
  source_fidelity: The draft conveys the principal sense well, including David’s death, burial, and the continuing presence of his tomb. However, “የአባቶች አለቃ” means ‘chief/leader of the fathers’ rather than πατριάρχης (‘patriarch/ancestral father’), and “በግልጽና በድፍረት” adds an explicit element of clarity beyond the source’s emphasis on frank boldness. The perfect wording “ሞቶ ተቀብሯል” can also be made closer to the two aorist events.
  naturalness: The address “ወንዶች፣ ወንድሞች ሆይ” is understandable and deliberately formal, though somewhat marked in contemporary Amharic; the footnote appropriately supplies the more idiomatic shorter alternative. The revised wording retains the formal public-address register while reading naturally.
  terminology: “ታላቁ አባት ዳዊት” is a suitable modern-Amharic rendering of the honorific πατριάρχης without importing the later ecclesiastical office sometimes suggested by the loanword ፓትርያርክ. “በድፍረት” adequately renders παρρησία here.
  issues:
  - severity: medium
    issue: “የአባቶች አለቃ” for πατριάρχου
    rationale: This expression identifies David as a leader of ancestors, whereas the Greek honorific calls him an ancestral father/patriarch.
  - severity: low
    issue: “በግልጽና በድፍረት” for μετὰ παρρησίας
    rationale: The paired terms are interpretively expansive. In this context “በድፍረት” preserves the source’s frank, bold manner without adding a separate assertion of clarity.
  - severity: low
    issue: “ሞቶ ተቀብሯል”
    rationale: The Greek presents two past events with aorists. “ሞቶ ተቀበረ” gives a closer, natural historical rendering.
  revised_text: “ወንዶች፣ ወንድሞች ሆይ[a]፣ ስለ ታላቁ አባት ዳዊት በድፍረት ልነግራችሁ ይፈቀድልኛል፤ እርሱ ሞቶ ተቀበረ፣ መቃብሩም እስከ ዛሬ በመካከላችን አለ።”
