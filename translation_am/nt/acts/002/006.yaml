  text: γενομένης δὲ τῆς φωνῆς ταύτης συνῆλθε τὸ πλῆθος καὶ συνεχύθη, ὅτι ⸀ἤκουον εἷς ἕκαστος τῇ ἰδίᾳ διαλέκτῳ λαλούντων αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/006.yaml
  text: And when this sound occurred[a], the crowd came together and was bewildered[b], because each one was hearing them speaking in his own dialect.
translation:
  language: am
  text: ይህ ድምፅ በተሰማ ጊዜ ሕዝቡ ተሰበሰበ፤ ሕዝቡም ግራ ተጋባ፤ ምክንያቱም እያንዳንዱ ሰው እነርሱ በራሱ ቋንቋ[a] ሲናገሩ ይሰማ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በራሱ የአካባቢ ንግግር ዘዬ።” የግሪኩ ቃል ቋንቋን ወይም የተለየ የአካባቢ ንግግር ዘዬን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένης ... τῆς φωνῆς ταύτης
  choice: ይህም ድምፅ በተሰማ ጊዜ
  rationale: የግሪኩ ገላጭ የጊዜ አወቃቀርን በተፈጥሯዊ አማርኛ ያስተላልፋል። φωνή እዚህ የተሰማውን ክስተት ስለሚያመለክት ‘ድምፅ’ ተመርጧል፤ ‘ጩኸት’ ወይም ‘ድምፀ ሰው’ ብሎ አይገድበውም።
- source_word: δέ
  choice: -ም
  rationale: ቀላል የትረካ ትስስሩን በተፈጥሯዊው የአማርኛ አያያዥ ቅጥያ ያሳያል።
- source_word: συνῆλθε τὸ πλῆθος
  choice: ሕዝቡ ተሰበሰበ
  rationale: ሰፊ የሰዎች ስብስብ ወደ አንድ ስፍራ መምጣቱን በግልጽና በዘመናዊ አማርኛ ያሳያል።
- source_word: συνεχύθη
  choice: ግራ ተጋባ
  rationale: የሕዝቡን መደናገርና አለመረዳት በተለመደ አማርኛ ይገልጻል።
- source_word: ἤκουον
  choice: ይሰማ ስለነበር
  rationale: ያልተጠናቀቀውን የግሪክ ግስ ቀጣይነት፣ እያንዳንዱ ሰው በዚያ ጊዜ እየሰማ መሆኑን፣ ይጠብቃል።
- source_word: εἷς ἕκαστος
  choice: እያንዳንዱ ሰው
  rationale: የግሪኩን አጽንዖታዊና አከፋፋይ ኃይል በግልጽ አማርኛ ይጠብቃል።
- source_word: τῇ ἰδίᾳ διαλέκτῳ
  choice: በራሱ ቋንቋ
  rationale: διάλεκτος ቋንቋን ወይም የአካባቢ ንግግር ዘዬን ሊያመለክት ይችላል። ‘ቋንቋ’ ለዘመናዊ አማርኛ አንባቢ ተፈጥሯዊ ሲሆን፣ የቀረበው የቃላት አማራጭ በማስታወሻ ተጠብቋል።
- source_word: λαλούντων αὐτῶν
  choice: እነርሱ ... ሲናገሩ
  rationale: ቀደም ሲል የተጠቀሱትን ተናጋሪዎች ያመለክታል፤ ‘ሐዋርያት’ ብሎ ጽሑፉ ከሚለው በላይ አይገድበውም።
theological_decisions:
- issue: የእያንዳንዱ ሰው አከፋፋይ አገላለጽ
  choice: እያንዳንዱ ሰው ... በራሱ ቋንቋ
  alternative: ሁሉም ... በየቋንቋቸው
  rationale: የግሪኩ εἷς ἕκαστος እያንዳንዱ ግለሰብ ያጋጠመውን ክስተት በአጽንዖት ይገልጻል፤ ነጠላውን ‘በራሱ’ ማቆየት ይህን ልዩነት ይጠብቃል።
