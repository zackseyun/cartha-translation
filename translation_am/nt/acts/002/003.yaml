review_pass:
  verdict: revise
  source_fidelity: The draft preserves the simile in ὡσεὶ πυρός, the plural visual image of γλῶσσαι, and the distributive force of ἐφ’ ἕνα ἕκαστον αὐτῶν. However, ታዩአቸው does not idiomatically mark that the phenomenon appeared *to* them; ታዩላቸው is required. Further, እርሱም has no clear or suitable antecedent in Amharic after plural ልሳናት. Rendering the singular ἐκάθισεν with “ከእነዚህም አንዱ” retains the Greek singular and makes its distributive sense intelligible without resolving it into a plural verb.
  naturalness: The revised wording is modern, clear, and appropriately elevated. እየተከፋፈሉ naturally conveys the ongoing/divisive participial image. ታዩላቸው is the normal Amharic construction for something appearing to persons.
  terminology: ልሳናት appropriately retains the concrete ‘tongues’ image and its possible link with the following speech context; it should not be replaced with ነበልባሎች or ቋንቋዎች. እንደ እሳት ያሉ correctly maintains comparison rather than identifying the manifestation as literal fire.
  issues:
  - severity: medium
    issue: The dative sense of αὐτοῖς is inadequately rendered by ታዩአቸው.
    rationale: For an appearance ‘to them,’ standard Amharic uses ታዩላቸው. The draft form can suggest that they saw the tongues rather than that the tongues appeared to them.
  - severity: medium
    issue: እርሱም is an unclear masculine singular pronoun following plural ልሳናት.
    rationale: Although the Greek verb is singular, the Amharic pronoun introduces an unnecessary and confusing antecedent problem. “ከእነዚህም አንዱ” expresses the singular verb’s distributive reference naturally.
