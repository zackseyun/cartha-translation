translation:
  language: am
  text: እንደ እሳት ያሉ ልሳናት እየተከፋፈሉ ታዩላቸው፤ ከእነዚህም አንዱ በእያንዳንዳቸው ላይ አረፈ[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እንደ እሳት ያሉ የተከፋፈሉ ልሳናት” ወይም “ልሳናት፣ እንደ እሳት ያሉ።” የግሪኩ አገላለጽ የሚታየውን መገለጥና በመካከላቸው መከፋፈሉን ሁለቱንም ያጎላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤφθησαν
  choice: ታዩአቸው
  rationale: የግሱን ተገብሮአዊ ቅርጽና ለእነርሱ የታየ መሆኑን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: αὐτοῖς
  choice: -አቸው (በ‘ታዩአቸው’)
  rationale: ክስተቱ ለማን እንደታየ በግሱ የተያያዘ ተውላጠ ስም በግልጽ ያሳያል።
- source_word: διαμεριζόμεναι
  choice: እየተከፋፈሉ
  rationale: የአሁን ጊዜ ተገብሮአዊ/መካከለኛ አንቀጽን ይጠብቃል፤ ሂደት ወይም ስርጭት የትኛው እንደተጠናከረ አይወስንም።
- source_word: γλῶσσαι
  choice: ልሳናት
  rationale: የምላስ ቅርጽ ያለውን የሚታይ ምስልና ቀጥሎ ያለውን የቋንቋ/ንግግር ግንኙነት አብሮ ያቆያል።
- source_word: ὡσεὶ πυρός
  choice: እንደ እሳት ያሉ
  rationale: ὡσεὶ ንጽጽርን እንጂ እነዚያ በትክክል እሳት እንደነበሩ አይገልጥም።
- source_word: ἐκάθισεν
  choice: እርሱም ... አረፈ
  rationale: የግሪክ ጽሑፉን ነጠላ ግስ ጠብቆ የሚታየው ክስተት በሰዎቹ ላይ መስፈሩን ይገልጣል፤ ነጠላው ተውላጠ ስም የሰዋስው ግጭቱን ሳይደብቅ ያቆያል።
- source_word: ἐφ’ ἕνα ἕκαστον αὐτῶν
  choice: በእያንዳንዳቸው ላይ
  rationale: ምልክቱ በተሰበሰቡት ሁሉ ላይ በተናጠል መድረሱን ያጎላል።
theological_decisions:
- issue: የጰንጠቆስጤው መገለጥ ባሕርይ
  choice: ‘እንደ እሳት ያሉ ልሳናት’ ተብሎ ተተርጉሟል።
  alternative: ‘የእሳት ነበልባሎች’ ወይም ‘እሳታማ ቋንቋዎች’
  rationale: ግሪኩ የንጽጽር ቃልንና γλῶσσαιን ይጠቀማል፤ ስለዚህ ምልክቱን ቃል በቃል እሳት ወይም ቋንቋዎች ብቻ እንደሆነ አይወስንም።
- issue: የነጠላው ἐκάθισεν ግስ ከብዙ ቁጥር ‘ልሳናት’ ጋር ያለው ግንኙነት
  choice: ነጠላውን ‘እርሱም ... አረፈ’ በማለት ጠብቋል።
  alternative: ‘እነርሱም ... አረፉ’
  rationale: የምንጩ ነጠላ ግስ ክስተቱን በአንድነት ሊመለከት ይችላል፤ ትርጉሙ ይህን አሻሚነት ወደ ብዙ ቁጥር በመለወጥ አይፈታውም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ልሳናት’ የመጽሐፍ ቅዱስ አውድንና የግሪኩን ሁለትዮሽ ፍንጭ ለመጠበቅ ተመርጧል።
