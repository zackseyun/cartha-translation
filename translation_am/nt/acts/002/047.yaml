lexical_decisions:
- source_word: αἰνοῦντες
  choice: እያመሰገኑ
  rationale: የኅብረቱን ቀጣይነት ያለው ድርጊት የሚገልጸውን የአሁን ጊዜ ተሳቢ ቅርጽ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: τὸν θεόν
  choice: እግዚአብሔርን
  rationale: θεός በዚህ አገባብ የሚያመለክተውን አምላክ በመደበኛና በክብር የተሞላ የአማርኛ አጠራር ያቀርባል።
- source_word: ἔχοντες χάριν πρὸς ὅλον τὸν λαόν
  choice: በሕዝቡም ሁሉ ዘንድ ሞገስ ነበራቸው
  rationale: ሐረጉ ለሕዝቡ በጎ ፈቃድ ማሳየታቸውን ሳይሆን በሕዝቡ ዘንድ ተቀባይነትና ሞገስ ማግኘታቸውን እንደሚገልጽ ያሳያል።
- source_word: ὁ δὲ κύριος
  choice: ጌታም
  rationale: κύριοςን በመደበኛው የክብር መጠሪያ ይተረጉማል፤ δέንም በ‘ም’ በቀላሉ ከቀደመው ንግግር ያያይዛል።
- source_word: προσετίθει
  choice: ይጨምር ነበር
  rationale: ያልተፈጸመው የግስ አኳኋን ተደጋጋሚና ቀጣይ የሆነ ድርጊትን እንዲያመለክት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τοὺς σῳζομένους
  choice: እየዳኑ የነበሩትን
  rationale: የአሁን ጊዜ ተገብሮአዊ ተሳቢውን እንደ ሂደት ያቀርባል፤ ድነትን ወደ ቋሚ መጠሪያ ወይም ወደ ተጠናቀቀ ሁኔታ አይቀይረውም።
- source_word: καθ’ ἡμέραν
  choice: በየቀኑ
  rationale: በተከታታይ ቀናት የሚፈጸም ተደጋጋሚ ድርጊትን በግልጽና ተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἐπὶ τὸ αὐτό
  choice: ወደ ኅብረታቸው
  rationale: ከπροσετίθει ጋር በዚህ አገባብ ወደ ነበረው ማኅበር መጨመርን በተፈጥሯዊ አማርኛ ያሳያል፤ የሐረጉ ሌሎች እውነተኛ ትርጉሞች በማስታወሻ ተጠብቀዋል።
theological_decisions:
- issue: በτοὺς σῳζομένους ውስጥ ያለው የድነት አኳኋን
  choice: እየዳኑ የነበሩትን
  alternative: የዳኑትን
  rationale: የግሪኩ የአሁን ጊዜ ተገብሮአዊ ተሳቢ ድነትን በሂደት ላይ እንዳለ መለኮታዊ ተግባር ያቀርባል። ትርጉሙ ከዚህ በላይ በድነት ሥርዓት ላይ ያሉ የቡድን ክርክሮችን አይወስንም።
- issue: የἐπὶ τὸ αὐτό ትርጉምና ተያያዥነት
  choice: ወደ ኅብረታቸው
  alternative: በአንድነት፤ በአንድ ስፍራ
  rationale: ከ‘ይጨምር ነበር’ ጋር ሲነበብ ዋናው አገባብ ወደ ነበረው ኅብረት መጨመርን ይጠቁማል። ሆኖም ሐረጉ ‘በአንድነት’ ወይም ‘በአንድ ስፍራ’ ሊል ስለሚችል ይህ አሻሚነት በግርጌ ማስታወሻ ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። ‘ኅብረታቸው’ የቡድኑን ማኅበራዊ አንድነት ያሳያል እንጂ የኋላ ዘመን ተቋማዊ የቤተ ክርስቲያን ትርጉምን አያስገባም።
