  source_fidelity: 'The draft correctly represents the groups named, the hearing of speech, and the Pentecost-context sense of γλώσσαις as recognizable human languages. However, “ስለ እግዚአብሔር ታላላቅ ሥራዎች” can mean “great works about God,” whereas τοῦ θεοῦ modifies “mighty works”: they are God’s works/deeds.'
