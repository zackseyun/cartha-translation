    rationale: The Greek says “the mighty works of God,” not merely “great works concerning God.” Using the possessive construction preserves the source relation directly.
  - severity: low
    issue: The spelling “ዐረቦች” is less standard than “ዓረቦች” in modern Amharic orthography.
    rationale: The change improves contemporary standard usage without affecting meaning.
