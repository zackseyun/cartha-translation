  rationale: በቅርብ ዐውዱ ከብዙ ሕዝቦች የመጡት ሰዎች ንግግሩን በየራሳቸው ቋንቋ እንደሰሙ ተደጋግሞ ተገልጿል። ‘ቋንቋ’ ይህን ግልጽ የትረካውን ሐሳብ ይከተላል፤ የቃሉ ሌላ ቀጥተኛ ትርጉም ግን በማስታወሻው ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩን የዝርዝር ቅጥ ለማስጠበቅ የ‘…ም …ም’ አወቃቀር ተመርጧል። በቀረበው የእንግሊዝኛ ጽሑፍ [a] ከ‘proselytes’ ቀጥሎ ቢታይም የማስታወሻው ይዘት γλώσσαιςን ስለሚመለከት፣ ምልክቱ ከ‘ቋንቋ’ ቀጥሎ በትክክለኛው ቦታ ተቀምጧል።
