  text: Πάρθοι καὶ Μῆδοι καὶ Ἐλαμῖται, καὶ οἱ κατοικοῦντες τὴν Μεσοποταμίαν, Ἰουδαίαν τε καὶ Καππαδοκίαν, Πόντον καὶ τὴν Ἀσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/009.yaml
  text: Parthians and Medes and Elamites[a], and those living in Mesopotamia, Judea and Cappadocia, Pontus and Asia[b],
translation:
  language: am
  text: ፓርቴዎች፣ ሜዶናውያንና ኤላማውያን፣ እንዲሁም በመስጴጦምያ፣ በይሁዳና በቀጰዶቅያ፣ በጳንጦስና በእስያ[a] የሚኖሩ ሰዎች፤
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: እዚህ «እስያ» የሚለው በትንሿ እስያ ምዕራባዊ ክፍል የነበረውን የሮም ግዛት እንጂ የዛሬውን የእስያ አህጉር አያመለክትም።
    reason: cultural_note
lexical_decisions:
- source_word: Πάρθοι
  choice: ፓርቴዎች
  rationale: የሕዝቡን ስም በአማርኛ የተለመደ ቅርጽ በመጻፍ የዘር ስሙን ጠብቋል።
- source_word: Μῆδοι
  choice: ሜዶናውያን
  rationale: ከሜዶን አገር የሆኑትን ሕዝቦች የሚያመለክተውን የታወቀ አማርኛ ስያሜ ይጠቀማል።
- source_word: Ἐλαμῖται
  choice: ኤላማውያን
  rationale: ከኤላም የሆኑትን ሕዝቦች በግልጽ የአማርኛ የዘር ስም ይገልጣል።
- source_word: οἱ κατοικοῦντες
  choice: የምንኖር ሰዎች
  rationale: በቀጥታ ንግግሩ ውስጥ ተናጋሪዎቹ ከየአገሩ እንደመጡ ስለሚዘረዝሩ፣ የግሪኩን ስማዊ ቦዝ አንቀጽ በተፈጥሯዊ የአማርኛ አንደኛ መደብ ብዙ ቁጥር ያቀርባል።
- source_word: τὴν Μεσοποταμίαν
  choice: መስጴጦምያ
  rationale: የጥንቱን ክልል ስም በአማርኛ የተለመደው ቅርጽ ይይዛል።
- source_word: Ἰουδαίαν
  choice: ይሁዳ
  rationale: የክልሉን ስም እንደ ሃይማኖታዊ ወይም የዘር መግለጫ ሳይተረጉም ያስቀምጣል።
- source_word: τε καὶ
  choice: ፣ …ና
  rationale: የዝርዝሩን ተያያዥነትና ትንሽ የመደመር ኃይል በተፈጥሯዊ የአማርኛ ማያያዣና ሥርዓተ ነጥብ ያቀርባል፤ ከዚህ በላይ በማጉላት አይተረጉመውም።
- source_word: Καππαδοκίαν
  choice: ቀጰዶቅያ
  rationale: የክልሉ ስም በአማርኛ የተለመደ ቅርጽ ተጠብቋል።
- source_word: Πόντον
  choice: ጳንጦስ
  rationale: የክልሉ ስም በአማርኛ የተለመደ ቅርጽ ተጠብቋል።
- source_word: τὴν Ἀσίαν
  choice: እስያ
  rationale: የታወቀውን ቦታ ስም በዋናው ጽሑፍ ይጠብቃል፤ እዚህ የሚያመለክተው የሮም ግዛት መሆኑ በማስታወሻ ተብራርቷል።
