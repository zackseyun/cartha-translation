  rationale: ቀዳሚው የግሪክ ምንጭ በሁለቱም ስፍራ κύριος ይጠቀማል። ስለዚህ ዋናው ጽሑፍ የግሪኩን ቃላት ይከተላል፤ በዕብራይስጡ የመጀመሪያው ቃል YHWH መሆኑ ግን በእግር ማስታወሻ ተጠብቋል።
