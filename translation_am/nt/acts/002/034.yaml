base_translation:
  language: en
  yaml_path: translation/nt/acts/002/034.yaml
  text: For David did not ascend into the heavens[a], but he himself says, ‘The Lord said to my Lord, “Sit at my right hand,”’
translation:
  language: am
  text: ዳዊት ወደ ሰማያት አላረገምና፤ ነገር ግን እርሱ ራሱ እንዲህ ይላል፦ “ጌታ ለጌታዬ፦ ‘በቀኜ ተቀመጥ’ አለ።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: መዝሙር 110፥1። በዕብራይስጡ ጽሑፍ የመጀመሪያው ‘ጌታ’ መለኮታዊውን ስም YHWH ይወክላል፤ ‘እግዚአብሔር ለጌታዬ አለ’ ከሚለው ጋር ያነጻጽሩ።
