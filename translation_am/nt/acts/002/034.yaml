lexical_decisions:
- source_word: ἀνέβη
  choice: አላረገም
  rationale: የἀναβαίνω የተፈጸመ ድርጊት ቅርጽ ሲሆን፣ በዚህ አውድ ወደ ሰማያት ማረግን ያመለክታል። ‘አረገ’ መጽሐፍ ቅዱሳዊ ክብደቱንና ከዐውዱ ጋር ያለውን ትስስር ይጠብቃል።
- source_word: τοὺς οὐρανούς
  choice: ሰማያት
  rationale: የግሪክ ቃሉ ብዙ ቁጥር ነው፤ ‘ሰማያት’ ይህን ቅርጽና መጽሐፍ ቅዱሳዊ አገላለጹን ይጠብቃል።
- source_word: λέγει δὲ αὐτός
  choice: ነገር ግን እርሱ ራሱ እንዲህ ይላል
  rationale: δέ ያለውን ቀላል ንጽጽር ‘ነገር ግን’ ያሳያል፤ αὐτός የሚሰጠውን አጽንዖት ‘እርሱ ራሱ’ ይጠብቃል። የአሁን ጊዜው ‘ይላል’ ጥቅሱን ቀጥተኛ ንግግር አድርጎ ያቀርባል።
- source_word: ὁ κύριος
  choice: ጌታ
  rationale: የግሪክ ምንጩ κύριος ይላል፤ በዋናው ጽሑፍ ‘ጌታ’ ተብሎ ተተርጉሟል። በዕብራይስጡ መዝሙር 110፥1 የመጀመሪያው ቃል መለኮታዊውን ስም YHWH እንደሚወክል በእግር ማስታወሻ ተገልጿል።
- source_word: τῷ κυρίῳ μου
  choice: ለጌታዬ
  rationale: የባለቤትነት ቅጥያውንና የግሪኩን ለይቶ የተቀመጠ ሁለተኛ κύριος በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: Κάθου
  choice: ተቀመጥ
  rationale: ቀጥተኛውን የትእዛዝ ኃይል በተፈጥሯዊና ክብር ባለው አማርኛ ያስተላልፋል።
- source_word: ἐκ δεξιῶν μου
  choice: በቀኜ
  rationale: ይህ ሐረግ የክብርና የሥልጣን ስፍራን የሚያመለክት ፈሊጣዊ አገላለጽ ነው፤ ‘በቀኜ’ በአማርኛ አጭርና የተለመደ አቻው ነው።
theological_decisions:
