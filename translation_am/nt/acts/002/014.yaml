id: ACT.2.14
reference: Acts 2:14
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Σταθεὶς δὲ ⸀ὁ Πέτρος σὺν τοῖς ἕνδεκα ἐπῆρεν τὴν φωνὴν αὐτοῦ καὶ ἀπεφθέγξατο αὐτοῖς· Ἄνδρες Ἰουδαῖοι καὶ οἱ κατοικοῦντες Ἰερουσαλὴμ ⸀πάντες, τοῦτο ὑμῖν γνωστὸν ἔστω καὶ ἐνωτίσασθε τὰ ῥήματά μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/014.yaml
  text: 'But Peter[a], standing with the eleven, raised his voice and declared to them: “Men of Judea and all who dwell in Jerusalem, let this be known to you[b], and give ear to my words.”'
translation:
  language: am
  text: ነገር ግን ጴጥሮስ ከአሥራ አንዱ ጋር ቆሞ፣ ድምፁን ከፍ አድርጎ እንዲህ ሲል አወጀላቸው፦ “የይሁዳ ወንዶች ሆይ፣ በኢየሩሳሌምም የምትኖሩ ሁላችሁ፣ ይህን እወቁ፤ ቃሎቼንም በጥሞና አድምጡ።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σταθεὶς
  choice: ቆሞ
  rationale: የቆመበትን ሁኔታ በተፈጥሯዊና ቀጥተኛ አማርኛ ያሳያል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከቀደመው የፌዝ ክስ ወደ ጴጥሮስ ምላሽ የሚደረገውን ተቃርኖአዊ ሽግግር ያሳያል።
- source_word: σὺν τοῖς ἕνδεκα
  choice: ከአሥራ አንዱ ጋር
  rationale: σύν የሚገልጠውን አብሮነት በግልጽ ሁኔታ ያስተላልፋል።
- source_word: ἐπῆρεν τὴν φωνὴν αὐτοῦ
  choice: ድምፁን ከፍ አድርጎ
  rationale: በሕዝብ ፊት በሚሰማ ድምፅ መናገሩን የሚገልጥ ተፈጥሯዊ አማርኛ ነው።
- source_word: ἀπεφθέγξατο αὐτοῖς
  choice: እንዲህ ሲል ተናገራቸው
  rationale: ግሱ ያለውን ግልጽና ይፋዊ የንግግር ኃይል ያስተላልፋል፤ በግሱ ብቻ ያልተገለጸ የመለኮታዊ መነሳሳት ትርጉም አይጨምርም።
- source_word: Ἄνδρες Ἰουδαῖοι
  choice: የይሁዳ ሰዎች ሆይ
  rationale: የጥሪውን ቅርጽና የይሁዳን ማንነት/አካባቢያዊ ግንኙነት ይጠብቃል፤ በአማርኛ ‘ሰዎች’ በዚህ ዓይነት ይፋዊ ጥሪ ተፈጥሯዊ ነው።
- source_word: οἱ κατοικοῦντες Ἰερουσαλὴμ πάντες
  choice: በኢየሩሳሌምም የምትኖሩ ሁላችሁ
  rationale: የአሁኑን ነዋሪነትና πάντες የሚለውን ሁሉን አቀፍ አጽንዖት በቀጥታ ያሳያል።
- source_word: τοῦτο ὑμῖν γνωστὸν ἔστω
  choice: ይህን እወቁ
  rationale: የግሪኩን ትእዛዛዊ የማሳወቅ ኃይል በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐνωτίσασθε τὰ ῥήματά μου
  choice: ቃሎቼንም በጥሞና አድምጡ
  rationale: ἐνωτίσασθε ተራ መስማትን ሳይሆን በጥንቃቄ ማዳመጥን ስለሚያመለክት ‘በጥሞና’ የሚለው የትኩረት ኃይሉን ይጠብቃል፤ ῥήματα ደግሞ ‘ቃሎቼን’ ተብሎ በቀጥታ ተተርጉሟል።
theological_decisions:
- issue: Ἄνδρες ያለውን ጾታዊ ልዩነት በአማርኛ ማሳየት
  choice: የይሁዳ ሰዎች ሆይ
  alternative: የይሁዳ ወንዶች ሆይ
  rationale: ግሪኩ በቅርጹ ተባዕታይ ቢሆንም፣ ‘የይሁዳ ወንዶች’ በዘመናዊ አማርኛ የማይፈጥሯዊና ከመጠን በላይ አካላዊ ጾታን የሚያጎላ ነው። ‘ሰዎች ሆይ’ የይፋዊ አድራሻውን ክብርና ተፈጥሯዊነት ይጠብቃል።
- issue: ἀπεφθέγξατο መንፈሳዊ መነሳሳትን በዋናው ጽሑፍ በግልጽ እንዲያመለክት ማድረግ
  choice: እንዲህ ሲል ተናገራቸው
  alternative: በመንፈስ ተነሳስቶ አወጀላቸው
  rationale: ግሱ ክብደት ያለውን ይፋዊ ንግግር ሊያመለክት ቢችልም፣ በራሱ ብቻ መንፈሳዊ መነሳሳትን በግልጽ አይናገርም፤ ስለዚህ ጽሑፉ ያልወሰነው የአስተምህሮ ፍቺ አልተጨመረም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ ይፋዊ ንግግር ቅጥ ተጠቅሟል። ‘በጥሞና አድምጡ’ የግሪኩን ትኩረት የሚጠይቅ ኃይል በተፈጥሯዊ አማርኛ ያሳያል። በዋናው ጽሑፍ ምልክት የሚያስፈልገው የግርጌ ማስታወሻ አልታከለም።
