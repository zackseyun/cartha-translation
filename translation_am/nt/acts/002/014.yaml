review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Peter's standing, his accompaniment by the Eleven, raising his voice, the Jerusalem addressees, and the two imperatives. However, ተናገራቸው is weaker than ἀπεφθέγξατο, which here denotes a forceful public declaration. Also, ሰዎች does not retain the explicitly masculine Ἄνδρες as well as a natural direct Amharic equivalent can.
  naturalness: The phrasing is modern and readily intelligible. የይሁዳ ወንዶች ሆይ is somewhat more formal than ሰዎች ሆይ, but it is clear and appropriate to the elevated public-address register. አወጀላቸው is natural in this setting.
  terminology: Names are correctly rendered as ጴጥሮስ, ይሁዳ, and ኢየሩሳሌም. No theological expansion is introduced. No footnote is required in Amharic for this verse, and no footnote anchors occur in the Amharic text.
  issues:
  - severity: medium
    issue: The public-speech verb is understated.
    rationale: ἀπεφθέγξατο denotes a pronounced, public utterance; ተናገራቸው merely means 'spoke to them.' አወጀላቸው better represents the declarative force without asserting a doctrine of inspiration.
  - severity: low
    issue: The masculine vocative is neutralized.
    rationale: Ἄνδρες is explicitly masculine. Replacing ሰዎች with ወንዶች preserves this feature in a comprehensible formal Amharic address.
  revised_text: ነገር ግን ጴጥሮስ ከአሥራ አንዱ ጋር ቆሞ፣ ድምፁን ከፍ አድርጎ እንዲህ ሲል አወጀላቸው፦ “የይሁዳ ወንዶች ሆይ፣ በኢየሩሳሌምም የምትኖሩ ሁላችሁ፣ ይህን እወቁ፤ ቃሎቼንም በጥሞና አድምጡ።”
