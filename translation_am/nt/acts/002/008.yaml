    text: ወይም፣ “እያንዳንዳችን በተወለድንበት በገዛ የአነጋገር ዘያችን እንዴት እንሰማለን?”
    reason: lexical_alternative
  revision_rationale: The revision removes the added speaking clause while preserving the Greek question, its distributive emphasis, the sense of one’s own language, and the explicit relative clause “in which we were born.” The footnote continues to preserve “dialect” as a lexical alternative.
