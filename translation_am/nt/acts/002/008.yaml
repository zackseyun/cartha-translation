review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the astonished question, the distributive “each of us,” and the birth-associated own language. However, “ስንናገሩ” (“while they speak”) adds an explicit speaking action and plural subject not present in the Greek text. The Greek simply says that each hears in their own dialect/language.
  naturalness: Apart from the added clause, the wording is generally understandable. Removing it produces a concise, natural modern-standard Amharic question. “በተወለድንበት በገዛ ቋንቋችን” naturally conveys the language associated with one’s birth.
  terminology: “ቋንቋ” is an appropriate main-text rendering of διάλεκτος in this context. “የአነጋገር ዘዬ” is a suitable footnote alternative for “dialect,” but the footnote must not retain the unsupported speaking clause.
  issues:
  - severity: high
    issue: Unsupported clause “ስንናገሩ” in the main text and footnote
    rationale: This introduces “while they speak” and an explicit plural speaker, neither of which is expressed in Acts 2:8. Context may supply what is heard, but the translation should not add this clause as though it were in the verse.
  revised_text: ታዲያ እያንዳንዳችን በተወለድንበት በገዛ ቋንቋችን እንዴት እንሰማለን?[a]
  revised_footnotes:
