  rationale: የግሪኩ ጽሑፍ በዚህ ቁጥር የመጨመሩን መዳረሻ በግልጽ አይጠቅስም። አውዱ የአማኞችን ማኅበር ቢያመለክትም፣ ጽሑፉ ያልገለጸውን የቤተ ክርስቲያን አገላለጽ አልተጨመረም።
- issue: ψυχαί ስለ ሰው ባሕርይ ልዩ አስተምህሮ ይገልጻል ወይስ ሰዎችን የመቁጠሪያ አገላለጽ ነው
  choice: በዋናው ጽሑፍ «ነፍሳት» ተብሎ፣ የ«ሰዎች» ትርጉሙ በማስታወሻ ተገለጸ
  alternative: በዋናው ጽሑፍ «ሰዎች» ማለት
  rationale: «ነፍሳት» የግሪኩን ቃል በቅርብ ይጠብቃል፤ ማስታወሻው ግን በአውዱ መሠረት ቃሉ ሰዎችን በአጠቃላይ ለመቁጠር የተጠቀመ መሆኑን በማሳየት አንባቢው ከጽሑፉ በላይ ስለ ሥጋና ነፍስ የተወሰነ አስተምህሮ እንዳያነብበት ይረዳል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። «ነፍሳት» መጽሐፍ ቅዱሳዊ ድምፁንና የምንጩን ግልጽነት ለመጠበቅ ተመርጧል፤ ዘመናዊው ትርጉም በአጭር ማስታወሻ ተብራርቷል።
