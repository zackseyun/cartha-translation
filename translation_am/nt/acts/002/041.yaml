theological_decisions:
- issue: «ተጨመሩ» የሚለው ግስ መዳረሻ በግልጽ ይጨመር ወይስ አይጨመር
  choice: «ተጨመሩ» ብቻ በማለት መዳረሻው ሳይገለጽ ተተወ
