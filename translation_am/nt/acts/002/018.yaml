  text: καί γε ἐπὶ τοὺς δούλους μου καὶ ἐπὶ τὰς δούλας μου ἐν ταῖς ἡμέραις ἐκείναις ἐκχεῶ ἀπὸ τοῦ πνεύματός μου, καὶ προφητεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/018.yaml
  text: Even on my male servants and my female servants in those days I will pour out from my Spirit[b][a], and they will prophesy.
translation:
  language: am
  text: እንዲያውም በእነዚያ ቀናት በወንድ ባሪያዎቼና በሴት ባሪያዎቼ[a] ላይ ከመንፈሴ[b] አፈሳለሁ፤ እነርሱም ትንቢት ይናገራሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በወንድ አገልጋዮቼና በሴት አገልጋዮቼ።” የግሪክ ቃላት አገልጋዮችን ወይም ባሪያዎችን ሊያመለክቱ ይችላሉ፤ እዚህ “ባሪያዎች” የሚለው የጥቅሱን ዝቅተኛ ማኅበራዊ ደረጃ አጽንዖት ለመጠበቅ ተጠቅሟል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “መንፈሴን አፈሳለሁ።” የግሪኩ አገላለጽ ቃል በቃል “ከመንፈሴ” ይላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: καί γε
  choice: እንዲያውም
  rationale: የቃላቱን አጽንዖትና ከቀደመው ሐሳብ ጋር ያላቸውን ተያያዥነት በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: ἐπὶ τοὺς δούλους μου καὶ ἐπὶ τὰς δούλας μου
  choice: በወንድ ባሪያዎቼና በሴት ባሪያዎቼ ላይ
  rationale: የወንድና የሴት ጾታ ልዩነቱን እንዲሁም በግሪኩ የሚታየውን ዝቅተኛ ማኅበራዊ ደረጃ ግልጽ አድርጎ ይጠብቃል።
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: በእነዚያ ቀናት
  rationale: የጊዜውን አመልካች በቀጥታና በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐκχεῶ
  choice: አፈሳለሁ
  rationale: የወደፊት ጊዜ ቅርጹንና የተትረፈረፈ መስጠትን የሚያሳየውን የማፍሰስ ዘይቤ ይጠብቃል።
- source_word: ἀπὸ τοῦ πνεύματός μου
  choice: ከመንፈሴ
  rationale: ἀπό የሚለውን ‘ከ’ የሚል ትርጉም በቀጥታ በመጠበቅ የማፍሰሱን ዘይቤ ያስቀራል።
- source_word: προφητεύσουσιν
  choice: ትንቢት ይናገራሉ
  rationale: የወደፊት ጊዜውን በግልጽ አማርኛ ያስተላልፋል፤ በአማርኛም ‘ትንቢት መናገር’ ተፈጥሯዊ አገላለጽ ነው።
theological_decisions:
- issue: δοῦλος/δούλη በማኅበራዊ ደረጃው በግልጽ በተመለከተበት አውድ እንዴት እንደሚተረጎም
  choice: ወንድ ባሪያዎቼ / ሴት ባሪያዎቼ
  alternative: ወንድ አገልጋዮቼ / ሴት አገልጋዮቼ
  rationale: የመንፈስ ስጦታ ዝቅተኛ ማኅበራዊ ደረጃ ላላቸውም እንደሚደርስ የሚያሳየውን የጥቅሱን አጽንዖት ይጠብቃል፤ የጾታውም ልዩነት አልተሰወረም።
- issue: ἀπὸ τοῦ πνεύματός μου የሚለው ሐረግ
  choice: ከመንፈሴ
  alternative: መንፈሴን
  rationale: የግሪኩን ἀπό (‘ከ’) ግልጽ አድርጎ ይጠብቃል፤ ከጽሑፉ በላይ የሆነ ሥነ መለኮታዊ ድምዳሜም አይጨምርም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። “ባሪያ” የጥንቱን ማኅበራዊ ሁኔታ ለማለስለስ ሳይሞክር ያስተላልፋል፤ የቃሉ አማራጭ ትርጉም በግርጌ ማስታወሻ ተጠብቋል።
