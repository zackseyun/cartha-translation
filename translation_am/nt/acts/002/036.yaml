  terminology: ‘ጌታ’ and ‘መሲሕ’ are suitable modern standard Amharic biblical terms. The alternative ‘ክርስቶስ’ is correctly retained in the footnote. The footnote should describe exaltation/public appointment without treating it as a required explanation of divine nature beyond the audit trail.
