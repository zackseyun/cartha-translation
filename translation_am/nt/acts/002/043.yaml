  text: And fear came upon every soul[a], and many wonders and signs were being done through the apostles.
translation:
  language: am
  text: ፍርሃትም በሁሉም ሰው ላይ መጣ[a]፤ በሐዋርያትም በኩል ብዙ ድንቅ ነገሮችና ምልክቶች ይደረጉ ነበር።
  philosophy: optimal-equivalence
  footnotes:
