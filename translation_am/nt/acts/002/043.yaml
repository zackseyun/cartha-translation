    text: ወይም፣ «ሁሉም ሰው በአድናቆት ተውጦ ነበር።» ግሪክኛው ቃል በቃል «ፍርሃት በእያንዳንዱ ነፍስ ላይ መጣ» ይላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγίνετο ... φόβος
  choice: ፍርሃት ... መጣ
  rationale: የγίνομαι ያላለቀ ጊዜ ከφόβος ጋር ፍርሃት መነሣቱንና በሰዎች ላይ መውደቁን ያሳያል፤ «መጣ» ይህን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: δὲ
  choice: -ም
  rationale: እዚህ δέ ጠንካራ ተቃርኖን ሳይሆን የትረካ ቀጣይነትን ያመለክታል፤ የአማርኛው «-ም» ይህን ፍሰት በተፈጥሮ ያስተላልፋል።
- source_word: πάσῃ ψυχῇ
  choice: በሁሉም ሰው ላይ
  rationale: ቃል በቃል «በእያንዳንዱ ነፍስ ላይ» ቢሆንም ψυχή እዚህ ሰውን ይወክላል፤ «በሁሉም ሰው ላይ» ዘመናዊና ግልጽ ነው፣ ቃል በቃሉንም በማስታወሻ ይጠብቃል።
- source_word: φόβος
  choice: ፍርሃት
  rationale: φόβος ፍርሃትን ወይም ከአድናቆት ጋር የተያያዘ ድንጋጤን ሊያመለክት ይችላል፤ «ፍርሃት» ቀጥተኛውን ትርጉምና ያለውን ውጥረት ይጠብቃል።
- source_word: πολλά
  choice: ብዙ
  rationale: የብዛት መጠንን በቀጥታና በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τέρατα
  choice: ድንቅ ነገሮች
  rationale: τέρατα ድርጊቶቹ የሚያስደንቁ መሆናቸውን ያጎላል፤ «ድንቅ ነገሮች» ከσημεῖα ጋር ያለውን ልዩነት ይጠብቃል።
- source_word: σημεῖα
  choice: ምልክቶች
  rationale: σημεῖα ድርጊቶቹ ከራሳቸው ባሻገር የሆነ እውነትን የሚያመለክቱ መሆናቸውን ያሳያል፤ «ምልክቶች» ይህን ተግባር ይጠብቃል።
- source_word: διὰ τῶν ἀποστόλων
  choice: በሐዋርያት በኩል
  rationale: διά ከባለቤት አገባብ ጋር መካከለኛ ወኪልነትን ያመለክታል፤ «በ...በኩል» ሐዋርያት መሣሪያዎች ሲሆኑ ዋናው አድራጊ በዐውዱ የተገመተው እግዚአብሔር መሆኑን ይጠብቃል።
- source_word: ἐγίνετο
  choice: ይደረጉ ነበር
  rationale: ሁለተኛው ያላለቀ ጊዜ ድንቅ ነገሮቹና ምልክቶቹ በተደጋጋሚ ወይም ቀጣይነት መፈጸማቸውን ያሳያል፤ ተገብሮ አገላለጹ ከ«በሐዋርያት በኩል» ጋር ይስማማል።
