    rationale: The Greek coordinates teaching, fellowship, breaking of bread, and prayers as four datival complements of the ongoing devotion. A shared “በ… ላይ” construction makes the Amharic coordination clearer.
  - severity: low
    issue: Footnote a gives “አንድነት” as an alternative for κοινωνία.
    rationale: “አንድነት” primarily means unity and does not adequately represent κοινωνία’s lexical range of sharing, participation, and communion/fellowship.
