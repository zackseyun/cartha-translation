  yaml_path: translation/nt/acts/002/042.yaml
  text: And they were devoting themselves to the apostles' teaching and the fellowship[c][b][a], to the breaking of bread and the prayers.
translation:
  language: am
  text: እነርሱም በሐዋርያት ትምህርትና በኅብረት[a]፣ እንጀራን በመቁረስ[b]ና በጸሎቶቹ[c] ላይ አዘውትረው ይተጉ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “መካፈል፣” “ተሳትፎ፣” ወይም “ኅብረት።”
    reason: lexical_alternative
  - marker: b
    text: “እንጀራን መቁረስ” በአጠቃላይ አብሮ መመገብን ሊያመለክት ይችላል፤ ብዙዎች ግን በዚህ ስፍራ የጌታን እራትም እንደሚያካትት ይረዱታል።
    reason: alternative_reading
  - marker: c
    text: ወይም፣ “የተወሰኑት ጸሎቶች።” መስተዋድዱ የታወቁ የጸሎት ጊዜያትን ወይም ቅርጾችን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δὲ προσκαρτεροῦντες
  choice: ተግተው ይኖሩ ነበር
  rationale: ἦσαν ከአሁን ጊዜ አንቀጽ ጋር የተሠራው አገባብ ባለፈ ጊዜ ቀጣይና ልማዳዊ ድርጊትን ያሳያል፤ προσκαρτερέω ደግሞ በጽናት መቀጠልንና ትጋትን ይገልጣል።
- source_word: διδαχῇ
  choice: ትምህርት
  rationale: በዚህ ዐውድ የማስተማርን ይዘትና ተግባር በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል፤ ‘ዶክትሪን’ ከሚለው ይልቅ አነስ ያለ ሥርዓታዊ ወይም ቤተ እምነታዊ ጭነት አለው።
- source_word: τῶν ἀποστόλων
  choice: የሐዋርያት
  rationale: የግሪኩን የባለቤትነት አገባብ በተፈጥሯዊ አማርኛ ይገልጣል፤ ትምህርቱም ሐዋርያት የሰጡት መሆኑን ያመለክታል።
- source_word: κοινωνίᾳ
  choice: ኅብረት
  rationale: ቃሉ የጋራ ተሳትፎን፣ መካፈልንና የማኅበር ሕይወትን ሊያካትት ይችላል። ‘ኅብረት’ ስፋቱን ሳያጠብ በአማርኛ የሚታወቅ አቻ ነው።
- source_word: κλάσει τοῦ ἄρτου
  choice: እንጀራን በመቁረስ
  rationale: በሉቃስና በሐዋርያት ሥራ የሚገኘውን የታወቀ አገላለጽ ይጠብቃል፤ የጋራ ምግብን ወይም የጌታን እራት ብቻ ብሎ አይወስንም።
- source_word: προσευχαῖς
  choice: ጸሎቶቹ
  rationale: ብዙ ቁጥሩንና በግሪኩ ያለውን መስተዋድድ ይጠብቃል፤ ይህም የታወቁ የጸሎት ጊዜያትን ወይም ቅርጾችን ሊያመለክት ይችላል።
theological_decisions:
- issue: κλάσει τοῦ ἄρτου በግልጽ ‘የጌታ እራት’ ወይም ‘ቁርባን’ ተብሎ መተርጎም አለበት ወይ?
  choice: ሰፊው አገላለጽ ‘እንጀራን በመቁረስ’ ተጠብቋል።
  alternative: ‘የጌታ እራት’፣ ‘ቁርባን’፣ ወይም የጌታን እራት የሚያካትት የጋራ ምግብ።
  rationale: በሉቃስ–ሐዋርያት ይህ ሐረግ የጋራ ምግብን ሊያመለክት ይችላል፤ በክርስቲያናዊው ዐውድ የጌታን እራት ሊያካትትም ይችላል። ዋናው ጽሑፍ ከምንጩ በላይ እንዳይወስን ሐረጉ ተጠብቋል።
- issue: κοινωνία የንብረት መካፈልን ወይም ሥርዓተ ቁርባንን ብቻ እንዲያመለክት ማጥበብ አለበት ወይ?
  choice: ሰፊ ማኅበራዊና የጋራ ተሳትፎ ትርጉም ያለው ‘ኅብረት’ ተመርጧል።
  alternative: ‘ንብረትን መካፈል’ ወይም ‘ቁርባናዊ ኅብረት’።
  rationale: ቃሉ መንፈሳዊና ቁሳዊ መካፈልን ጨምሮ የጋራ ሕይወትን ሊያቅፍ ይችላል። ከእነዚህ አንዱን ብቻ መምረጥ የምንጩን ስፋት ያጠባል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። ‘ተግተው ይኖሩ ነበር’ ቀጣይነትንና ጽናትን በተፈጥሯዊ አገላለጽ ያስተላልፋል። የግሪኩ ዝርዝር አወቃቀር ተጠብቆ ነገር ግን የአማርኛ ፍሰት እንዲኖረው ተደርጓል።
