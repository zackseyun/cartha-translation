    reason: lexical_alternative
  revision_rationale: The revision retains the stark literal images “ወደ ጨለማ” and “ወደ ደም,” keeps the prophetic term “የጌታ ቀን,” and preserves the ambiguity of ἐπιφανῆ through a footnote. It removes the added resumptive clause and restores the source’s twofold singular future construction in idiomatic modern Amharic.
