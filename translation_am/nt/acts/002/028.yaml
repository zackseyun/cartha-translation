  choice: በፊትህ
  alternative: በመገኘትህ
  rationale: ‘በፊትህ’ የምንጩን ምስላዊ አነጋገር ይጠብቃል፣ በዘመናዊ አማርኛም እንደ ‘በመገኘትህ’ ሊገባ ይችላል፤ የሥነ መለኮት ጭብጡን በአንድ ትርጓሜ አይወስንም።
