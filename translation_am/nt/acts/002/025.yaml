base_translation:
  language: en
  yaml_path: translation/nt/acts/002/025.yaml
  text: For David says concerning him, ‘I kept seeing the Lord before me continually, because he is at my right hand, so that I may not be shaken.’
translation:
  language: am
  text: ዳዊት ስለ እርሱ እንዲህ ይላልና፦ “ጌታን[b] ሁልጊዜ በፊቴ እያየሁት ነበር፤[a] እንዳልናወጥ እርሱ በቀኜ ነውና።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ጌታን ሁልጊዜ በፊቴ አስቀድሜ አየሁ።” የግሪኩ ግስ በአንዳንድ አገባብ “አስቀድሞ ማየት” ማለት ሊሆን ይችላል፤ እዚህ ግን “በፊቴ” እና “ሁልጊዜ” የሚሉት አገላለጾች ጌታን ያለማቋረጥ በፊት ማየትን ይደግፋሉ።
    reason: lexical_alternative
  - marker: b
    text: ጴጥሮስ እዚህ መዝሙር 16፥8ን እየጠቀሰ ነው። በዕብራይስጡ የመዝሙሩ ጽሑፍ እዚህ ቦታ የመለኮትን ስም ይጠቀማል፤ ይህም በብዙ የአማርኛ ትርጉሞች “እግዚአብሔር” ተብሎ ይተረጎማል።
    reason: cross_reference
lexical_decisions:
- source_word: λέγει εἰς αὐτόν
  choice: ስለ እርሱ እንዲህ ይላል
  rationale: በዚህ የጥቅስ መግቢያ አገባብ εἰς αὐτόν ቀጥተኛ ንግግርን ሳይሆን ስለ አንድ ሰው መናገርን ያመለክታል።
- source_word: Προορώμην
  choice: አየው ነበር
  rationale: የግሱ ያልተጠናቀቀ የጊዜ አቀራረብና διὰ παντός ቀጣይ ወይም ልማዳዊ ማየትን ይደግፋሉ፤ ‘ነበር’ ይህን ቀጣይነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: κύριον
  choice: ጌታን
  rationale: የግሪኩን κύριος በቀጥታ ይተረጉማል፤ በጥቅሱ ውስጥ ማንነቱን በትርጓሜ አይወስንም።
- source_word: ἐνώπιόν μου
  choice: በፊቴ
  rationale: የቦታና የግንኙነት ምስሉን በአጭርና በተለመደ አማርኛ ይጠብቃል።
- source_word: διὰ παντός
  choice: ሁልጊዜ
  rationale: ያለማቋረጥ ወይም በሁሉም ጊዜ የሚለውን ትርጉም በተፈጥሯዊ አማርኛ ይሰጣል።
- source_word: ἐκ δεξιῶν μού
  choice: በቀኜ
  rationale: በቀኝ በኩል የመገኘትን ፈሊጣዊ አነጋገር ይጠብቃል፤ ድጋፍና ጥበቃ የሚለውን አንድምታ በጽሑፉ ላይ አይጨምርም።
- source_word: ἵνα μὴ σαλευθῶ
  choice: እንዳልናወጥ
  rationale: የዓላማ ወይም የውጤት አገባቡን እና ከጽናት መናወጥን የሚገልጠውን ምሳሌያዊ ቃል ይጠብቃል።
theological_decisions:
- issue: በመዝሙሩ ጥቅስ ውስጥ ‘ጌታ’ የሚለው ማንን እንደሚያመለክት
  choice: በዋናው ጽሑፍ ‘ጌታ’ ብሎ ማቆየት
  alternative: ‘እግዚአብሔር’ ወይም ‘መሲሑ’ ብሎ በግልጽ መለየት
  rationale: ጴጥሮስ መዝሙር 16ን ከመሲሑ ጋር አያይዞ ቢጠቀምም፣ የሐዋርያት ሥራው የግሪክ ጽሑፍ κύριον ይላል። ስለዚህ ጥቅሱ ያለውን የትርጓሜ ውጥረት ሳይፈታ ‘ጌታ’ ተብሎ ቀርቷል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የመዝሙር ጥቅሱን ምስላዊ አነጋገር ለመጠበቅ ‘በፊቴ’፣ ‘በቀኜ’ እና ‘እንዳልናወጥ’ ተብሏል።
