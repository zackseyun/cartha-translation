  text: And it shall be that everyone who calls on the name of the Lord will be saved[a].
translation:
  language: am
  text: እንዲህም ይሆናል፤ የጌታን ስም የሚጠራ ሁሉ ይድናል[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የጌታን ስም የሚጠራ ማንም ይድናል።” አገላለጹ ኢዩኤል 2፥32ን ያስተጋባል፤ በዚያ ‘ጌታ’ ያህዌን ያመለክታል። በሐዋርያት ሥራ ግን ጴጥሮስ ጥቅሱን ስለ ኢየሱስ በሚያውጅበት አውድ ውስጥ ይጠቀምበታል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἔσται
  choice: ይሆናል
  rationale: የወደፊት ጊዜ አገላለጹን በተፈጥሯዊና ክብር ባለው ዘመናዊ አማርኛ ያስተላልፋል፤ ከነቢያዊው ጥቅስ ጋር የሚስማማውንም የመግቢያ ቅርጽ ይጠብቃል።
- source_word: πᾶς ὃς ἐὰν
  choice: … የሚጠራ ሁሉ
  rationale: ያልተወሰነውን ሁሉን አቀፍ ሁኔታ በተፈጥሯዊ የአማርኛ አወቃቀር ይገልጣል፤ ‘ማንም … ቢጠራ’ የሚለውም ትክክለኛ አማራጭ ነው።
- source_word: ἐπικαλέσηται
  choice: የሚጠራ
  rationale: በ‘ስም’ ከሚለው ጋር ሲገናኝ በእምነትና በመደገፍ መማጸንን የሚያመለክተውን መጽሐፍ ቅዱሳዊ ፈሊጥ በቀጥታ ይጠብቃል።
- source_word: τὸ ὄνομα
  choice: ስም
  rationale: ‘የጌታን ስም መጥራት’ የሚለውን ቃል ኪዳናዊና የአምልኮ ይዘት ያለውን ቋሚ መጽሐፍ ቅዱሳዊ አገላለጽ ሳይተረጉም ይጠብቃል።
- source_word: κυρίου
  choice: ጌታ
  rationale: κύριοςን በመደበኛው የአማርኛ መጽሐፍ ቅዱሳዊ አቻ ‘ጌታ’ ይተረጉማል፤ ዋቢውን በዋናው ጽሑፍ ውስጥ አይገድብም።
- source_word: σωθήσεται
  choice: ይድናል
  rationale: የσῴζωን የወደፊት ጊዜ ተገብሮ ቅርጽ በተፈጥሯዊ አማርኛ ይገልጣል፤ ከአደጋ መዳንንና የመንፈሳዊ ድነትን ይዘት ሁለቱንም ሊሸከም ይችላል።
theological_decisions:
- issue: በኢዩኤል ጥቅስ ውስጥና በሐዋርያት ሥራ አጠቃቀም ውስጥ የ‘ጌታ’ ዋቢ
  choice: κύριοςን ‘ጌታ’ ብሎ መተርጎምና በዋናው ጽሑፍ ዋቢውን አለመወሰን
  alternative: በኢዩኤል የመጀመሪያ አውድ ‘ያህዌ’ ብሎ መግለጽ፣ ወይም በሐዋርያት ሥራ ክርስቶሳዊ አውድ ‘ኢየሱስ’ ብሎ መወሰን
  rationale: ግሪክ ጽሑፉ ‘ጌታ’ ይላል። ጥቅሱ በኢዩኤል አውድ ያህዌን ያመለክታል፤ ጴጥሮስ ግን በሐዋርያት ሥራ ኢየሱስን ማዕከል ባደረገ አዋጅ ውስጥ ይጠቀምበታል። ‘ጌታ’ ብሎ ማቆየት የጽሑፉን አሻሚነትና ሥነ መለኮታዊ ውጥረት ሳይፈታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የአማርኛ አገላለጽ ተመርጧል። ‘እንዲህም ይሆናል’ የጥቅሱን ነቢያዊ ክብደት ይጠብቃል፤ ከልክ ያለፈ ጥንታዊ ቋንቋ ግን አይጠቀምም።
