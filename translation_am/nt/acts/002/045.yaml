  rationale: The revision corrects the need clause while preserving the Greek’s imperfective sense, the broad recipient phrase “to all,” and the ambiguity of αὐτά by leaving the distributed object implicit, as Amharic naturally permits. It introduces no claim that private ownership was abolished or that the practice is a universal command.
