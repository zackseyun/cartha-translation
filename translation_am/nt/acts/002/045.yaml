review_pass:
  verdict: revise
  source_fidelity: 'The two imperfect verbs are appropriately represented by repeated/ongoing past forms (ይሸጡ ነበር; ያከፋፍሉ ነበር), and the distinction between κτήματα and ὑπάρξεις is retained. However, the need clause is syntactically and semantically confused in the draft: it says both “for each one according to his need” and “to all,” without clearly expressing that distribution was according to whatever need any person had.'
  naturalness: The sequence “ለእያንዳንዱም እንደ አስፈላጊነቱ ለሁሉም” is awkward and redundant in modern standard Amharic. Reordering it and using ማንም እንደሚያስፈልገው gives a natural expression of the indefinite construction.
  terminology: ይዞታዎች and ንብረቶች provide a reasonable distinction for κτήματα and ὑπάρξεις. The footnote appropriately offers “መሬቶች” as an alternative and should remain anchored to the first term.
  issues:
  - severity: medium
    issue: The final distribution clause contains an unclear double recipient/need construction.
    rationale: καθότι ἄν τις χρείαν εἶχεν means distribution was made in accordance with the need that any person had. The draft’s “ለእያንዳንዱም ... ለሁሉም” risks making both phrases recipients and does not read naturally.
  revised_text: ይዞታዎቻቸውንና ንብረቶቻቸውን[a] ይሸጡ ነበር፤ ማንም እንደሚያስፈልገውም ለሁሉም ያከፋፍሉ ነበር።
