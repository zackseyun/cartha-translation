  rationale: ያልተጠናቀቁት ግሶች በተደጋጋሚ የተፈጸመ ልማድን ያሳያሉ፤ ጥቅሱ ግን የግል ባለቤትነት ሁሉ እንደቀረ ወይም ይህ ለሁሉ ዘመን የታዘዘ ሥርዓት እንደሆነ አይናገርም። ትርጉሙ ከጽሑፉ በላይ ማኅበራዊ ወይም ኢኮኖሚያዊ አስተምህሮ አያስገባም።
