  text: እርሱን ግን እግዚአብሔር የሞትን ምጥ[a] ፈትቶ አስነሣው፤ እርሱ በሞት[b] ተይዞ እንዲቆይ አልተቻለምና።
  philosophy: optimal-equivalence
  footnotes:
