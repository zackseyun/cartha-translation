- source_word: κρατεῖσθαι
  choice: ተይዞ ሊቆይ
  rationale: ግሱ በአንድ ኃይል ተይዞ ወይም በግዛቱ ሥር ተጠብቆ መቆየትን ያመለክታል፤ «ተይዞ ሊቆይ» ይህን የቀጣይ እስራት ሐሳብ በግልጽ አማርኛ ያቀርባል።
