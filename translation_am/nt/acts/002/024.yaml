theological_decisions:
- issue: የὑπ’ αὐτοῦ አመልካች
  choice: «በእርሱ» በአውዱ ሞትን ያመለክታል።
  alternative: «በሞት» ብሎ በግልጽ መተርጎም፣ ወይም ተውላጠ ስሙን ወንድ ግለሰብ እንደሚያመለክት መውሰድ።
  rationale: በቅርብ ያለውና ከሐሳቡ ጋር የሚስማማው አመልካች θανάτου («ሞት») ነው። ሆኖም የምንጩን ተውላጠ ስም በዋናው ጽሑፍ ማቆየት የአገባቡን ቅርጽና ጥቃቅን አሻሚነት ይጠብቃል።
- issue: የὠδῖνας ትርጉም
  choice: «ምጥ»
  alternative: «ሥቃይ» ወይም «ጣር»
  rationale: ቃሉ በቀጥታ የወሊድ ምጥን ሊገልጽ ሲችል በሰፊውም ከባድ ሥቃይን ያመለክታል። «ምጥ» ሁለቱንም የሥቃይ ጽናትና የመውለድ ምስል እንዲሰማ ያደርጋል፤ ትርጉሙ ግን በማስታወሻ ተብራርቷል።
