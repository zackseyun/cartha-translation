- source_word: ἑτέραις γλώσσαις
  choice: በሌሎች ልሳናት
  rationale: «ልሳናት» የግሪኩን γλῶσσαι ቅርጽና በዚህ ጥቅስ ያለውን የትርጉም ክፍትነት ይጠብቃል፤ «ቋንቋዎች» የሚለው አማራጭ በማስታወሻ ቀርቧል።
- source_word: καθὼς
  choice: በነበረው መሠረት
