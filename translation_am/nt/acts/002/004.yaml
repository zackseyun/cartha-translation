- source_word: ἀποφθέγγεσθαι αὐτοῖς
  choice: እንዲናገሩ እየሰጣቸው
  rationale: ቃሉ በግልጽ ወይም በይፋ እንዲናገሩ የተሰጣቸውን አቅም ያመለክታል፤ ትርጉሙ ነገሩን ትንቢት ብቻ አድርጎ አይገድበውም።
theological_decisions:
- issue: πνεύματος ἁγίου የግል መለኮታዊ ማጣቀሻ ነው ወይስ አጠቃላይ «ቅዱስ መንፈስ» ነው?
  choice: መንፈስ ቅዱስ
  alternative: ቅዱስ መንፈስ
  rationale: በምዕራፉ አውድ ንግግሩን የሚያስችለው ወኪል ኢየሱስ ተስፋ የሰጠው መለኮታዊ መንፈስ ነው።
- issue: γλώσσαις «ልሳናት» ወይስ «ቋንቋዎች» ተብሎ ይተርጎም?
  choice: ልሳናት
  alternative: ቋንቋዎች
  rationale: «ልሳናት» የመነሻውን ቃል ሁለት ሊሆኑ የሚችሉ ፍቺዎች ይጠብቃል፤ ቁጥር 6–11 ሰሚዎቹ የሚያውቋቸውን ቋንቋዎች እንደሰሙ ያብራራል።
