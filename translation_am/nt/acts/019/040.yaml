source:
  edition: SBLGNT
  text: καὶ γὰρ κινδυνεύομεν ἐγκαλεῖσθαι στάσεως περὶ τῆς σήμερον μηδενὸς αἰτίου ὑπάρχοντος περὶ οὗ οὐ δυνησόμεθα ⸀ἀποδοῦναι λόγον ⸀περὶ τῆς συστροφῆς ταύτης. καὶ ταῦτα εἰπὼν ἀπέλυσεν τὴν ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/040.yaml
  text: For indeed we are in danger of being charged with rioting over what happened today[a], since there is no cause for it, and we will not be able to give an account for this commotion. And after saying these things[c][b], he dismissed the assembly.
translation:
  language: am
  text: በእርግጥም፣ ዛሬ ስለተፈጠረው ነገር በሁከት[a] ልንከሰስ አደጋ ላይ ነን፤ ለዚህ ምንም ምክንያት ስለሌለ፣ ስለዚህ ሁከተኛ ስብስብ[b] ማብራሪያ መስጠት አንችልም። ይህንም ከተናገረ በኋላ ጉባኤውን[c] አሰናበተ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ዓመፅ” ወይም “በመንግሥት ላይ አመፅ” ተብሎም ሊተረጎም ይችላል፤ የግሪኩ ቃል ከባድ የሕዝብ ዓመፅን ሊያመለክት ይችላል፣ እዚህ ግን “ሁከት” ለአውዱ ይበልጥ ይስማማል።
    reason: lexical_alternative
  - marker: b
    text: “ረብሻ” ወይም “የተቆጣ ሕዝብ” ተብሎም ሊተረጎም ይችላል፤ የግሪኩ ቃል በሁከት የተሰበሰበውን ሕዝብ ወይም ስብስብ ያመለክታል፤ በኋላ ከተጠቀሰው መደበኛ “ጉባኤ” የተለየ ነው።
    reason: lexical_alternative
  - marker: c
    text: እዚህ “ጉባኤ” ተብሎ የተተረጎመው የግሪክ ቃል በሌሎች ስፍራዎች ብዙ ጊዜ “ቤተ ክርስቲያን” ተብሎ የሚተረጎመው ቃል ነው፤ እዚህ ግን የኤፌሶንን ሕዝባዊ ጉባኤ ያመለክታል።
    reason: cross_reference
lexical_decisions:
- source_word: κινδυνεύομεν ἐγκαλεῖσθαι
  choice: ክስ ሊቀርብብን ይችላል
  rationale: የሕግ ክስ ሊቀርብ የሚችልበትን ወቅታዊ አደጋ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: στάσεως
  choice: ሁከት
  rationale: በአደባባይ የተነሳ ከባድ የሕዝብ ረብሻን ያመለክታል፤ የፖለቲካ ዓመፅ ትርጉምን አላስፈላጊ ሁኔታ አያጠብቅም።
- source_word: περὶ τῆς σήμερον
  choice: ስለዛሬው ሁከት
  rationale: በዕለቱ የተፈጠረውን ክስተት በአማርኛ ግልጽ በሆነ አገላለጽ ይጠቅሳል።
- source_word: μηδενὸς αἰτίου ὑπάρχοντος
  choice: ይህን ሁከት የሚያጸድቅ ምንም ምክንያት ስለሌለ
  rationale: ለድርጊቱ ሕጋዊ ወይም ተቀባይነት ያለው ምክንያት አለመኖሩን ያሳያል።
- source_word: ἀποδοῦναι λόγον
  choice: ማስረጃ ያለው መልስ መስጠት
  rationale: ለባለሥልጣን ሊቀርብ የሚችል በቂ ማብራሪያ ወይም መከላከያ የመስጠትን ሕጋዊ አውድ ያንጸባርቃል።
- source_word: συστροφῆς
  choice: ረብሻ
  rationale: የተሰበሰበውን ሁከተኛ ሕዝብና የፈጠረውን ውዥንብር ይገልጻል፤ ከመደበኛው ጉባኤ ይለያል።
- source_word: ἐκκλησίαν
  choice: ጉባኤውን
  rationale: በዚህ አውድ ቃሉ የኤፌሶንን ሕዝባዊ ስብሰባ እንጂ ቤተ ክርስቲያንን አያመለክትም።
- source_word: ἀπέλυσεν
  choice: አሰናበተ
  rationale: መደበኛ ስብሰባን በመዝጋት ተሰብሳቢዎችን መልቀቅን በተፈጥሯዊ አማርኛ ይገልጻል።
