source:
  edition: SBLGNT
  text: οὐ μόνον δὲ τοῦτο κινδυνεύει ἡμῖν τὸ μέρος εἰς ἀπελεγμὸν ἐλθεῖν, ἀλλὰ καὶ τὸ τῆς μεγάλης θεᾶς ⸂Ἀρτέμιδος ἱερὸν⸃ εἰς οὐθὲν λογισθῆναι, μέλλειν ⸀τε καὶ καθαιρεῖσθαι ⸂τῆς μεγαλειότητος⸃ αὐτῆς, ἣν ὅλη ἡ Ἀσία καὶ ἡ οἰκουμένη σέβεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/027.yaml
  text: And not only is this trade of ours in danger of coming into disrepute, but also the temple of the great goddess Artemis may be counted as nothing, and even her majesty—whom all Asia and the world worships—may be brought down.
translation:
  language: am
  text: ይህ የሥራ ዘርፋችን ወደ ውርደት ሊወድቅ ብቻ ሳይሆን፣ የታላቂቱ አምላክ አርጤምስ ቤተ መቅደስም እንደ ምንም ሊቆጠር፣ ደግሞም መላው እስያና ዓለም[a] የሚያመልኳት እርሷ ከግርማዋ[b] ልትወርድ አደጋ አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሰዎች የሚኖሩበት ዓለም።” የግሪኩ ቃል ብዙ ጊዜ ሰዎች የሚኖሩበትን ዓለም፣ በተለይም ሰፊውን የሮም ዓለም ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ታላቅነቷን” ወይም “ክብሯን።” የግሪኩ አገላለጽ የአርጤምስ ከፍ ያለ ማዕረግ ወይም ግርማ እንደሚዋረድ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: κινδυνεύει
  choice: አደጋ አለ
  rationale: የአደጋንና የስጋትን ትርጉም በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል፤ በአረፍተ ነገሩም ሁለቱን የስጋት ውጤቶች ይሸፍናል።
- source_word: τὸ μέρος
  choice: ይህ የሥራ ዘርፋችን
  rationale: በዐውዱ የድሜጥሮስንና የእጅ ባለሙያዎቹን የገቢ ሥራ ዘርፍ ያመለክታል፤ ከቃል በቃል ‘ክፍል’ ይልቅ ዐውዳዊ ትርጉሙን ያቀርባል።
- source_word: εἰς ἀπελεγμὸν ἐλθεῖν
  choice: ስሙ የመጥፋት ... ላይ የሚወድቅ
  rationale: ወደ ውርደትና ወደ መጥፎ ዝና መድረስን ይገልጣል፤ ‘ስሙ መጥፋት’ ለተራ አንባቢ ግልጽ ነው።
- source_word: ἱερόν
  choice: ቤተ መቅደስ
  rationale: በኤፌሶን ያለውን የአርጤምስ ቅዱስ ስፍራና የቤተ መቅደሱን ክልል በተለመደ የመጽሐፍ ቅዱስ አማርኛ ይገልጣል።
- source_word: εἰς οὐθὲν λογισθῆναι
  choice: እንደ ምንም የመቆጠር
  rationale: ዋጋ ወይም ክብር እንደሌለው መታሰብን በቅርብና በግልጽ አነጋገር ያስተላልፋል።
- source_word: μέλλειν τε καὶ καθαιρεῖσθαι τῆς μεγαλειότητος αὐτῆς
  choice: ግርማዋን የማጣት አደጋ አለ
