  rationale: ጽሑፉ የድሜጥሮስን ንግግር ይዘግባል። በግሪኩ የሌለ የማራቂያ አገላለጽ ሳይጨመር፣ የተናጋሪው አባባል በቀጥታ ተጠብቋል።
- issue: የμεγαλειότης ግርማ፣ ታላቅነት ወይም ክብር የሚለው አሻሚነት
  choice: ግርማዋን
  alternative: ታላቅነቷን / ክብሯን
  rationale: ‘ግርማ’ የከፍ ያለ ደረጃን፣ ግርማ ሞገስንና ሕዝባዊ ክብርን በአንድነት ሊያስተላልፍ ይችላል፤ አማራጮቹ በማስታወሻ ተጠብቀዋል።
