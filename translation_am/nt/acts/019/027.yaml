- source_word: ἡ οἰκουμένη
  choice: ዓለም
  rationale: ተፈጥሯዊና አጭር ነው፤ በግሪኩ ያለው ‘የሰው መኖሪያ ዓለም’ ወይም በተለይ ሰፊው የሮም ዓለም ሊሆን የሚችለው ጥላ ትርጉም በማስታወሻ ተጠብቋል።
- source_word: σέβεται
  choice: የሚያመልኳት
  rationale: በዐውዱ ያለውን ሃይማኖታዊ አምልኮ በቀጥታ ይገልጣል፤ የተናጋሪውን አረማዊ አመለካከት ሳያጸድቅም ሆነ ሳያለዝብ እንደ ተዘገበ ያቀርባል።
