base_translation:
  language: en
  yaml_path: translation/nt/acts/019/004.yaml
  text: And Paul said[a], “John baptized with a baptism of repentance, telling the people to believe in the one coming after him—that is, in Jesus.”
translation:
  language: am
  text: ጳውሎስም፣ “ዮሐንስ የንስሐ ጥምቀት አደረገ[a]፤ ሕዝቡንም ከእርሱ በኋላ በሚመጣው፣ ማለትም በኢየሱስ፣ እንዲያምኑ ነገራቸው” አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ይበልጥ ቃል በቃል፣ “ዮሐንስ የንስሐ ጥምቀትን አጠመቀ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβάπτισεν βάπτισμα μετανοίας
  choice: የንስሓ ጥምቀትን አጠመቀ
  rationale: የግሪኩን ተመሳሳይ ሥር ያላቸውን ግስና ስም አወቃቀር በግልጽ አማርኛ ይጠብቃል፤ μετανοίας የጥምቀቱን ባሕርይ ወይም ይዘት እንደሚገልጽ “የንስሓ” ተብሏል።
- source_word: τῷ λαῷ
  choice: ሕዝቡን
  rationale: λαός በዚህ አውድ የጋራ ሕዝብን ያመለክታል፤ “የእስራኤል ሕዝብ” ማለት ግሪኩ ያልገለጸውን ይጨምራል።
- source_word: λέγων
  choice: ነገራቸው
  rationale: ከጥምቀቱ ጋር አብሮ የተሰጠውን መልእክት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: εἰς τὸν ἐρχόμενον μετ’ αὐτὸν
  choice: ከእርሱ በኋላ በሚመጣው
  rationale: μετ’ αὐτόν የተከታታይነትን “ከእርሱ በኋላ” ያመለክታል፤ ἐρχόμενον ደግሞ “በሚመጣው” ተብሎ የአሁን አሳታፊውን መልክ ይጠብቃል።
- source_word: ἵνα πιστεύσωσιν
  choice: እንዲያምኑ
  rationale: የንግግሩን ዓላማ ወይም የታዘዘውን ይዘት በተፈጥሯዊና ግልጽ አማርኛ ይገልጻል።
- source_word: τοῦτ’ ἔστιν
  choice: ማለትም
  rationale: “ከእርሱ በኋላ የሚመጣውን” ከኢየሱስ ጋር የሚያመሳስለውን የማብራሪያ ሐረግ በቀጥታ ያስተላልፋል።
- source_word: εἰς τὸν Ἰησοῦν
  choice: በኢየሱስ
  rationale: ከπιστεύω ጋር εἰς የእምነትን ተሳቢ “በኢየሱስ ማመን” ብሎ በተፈጥሯዊ አማርኛ ይገልጻል፤ ግሪኩ ያልጨመረው “ክርስቶስ” የሚል ማዕረግ አልተጨመረም።
theological_decisions:
- issue: የዮሐንስ ጥምቀት ከኢየሱስ ጋር ካለው እምነት ጋር ያለው ግንኙነት
  choice: የዮሐንስ ጥምቀት የንስሓ ጥምቀት መሆኑንና ከእርሱ በኋላ በሚመጣው፣ ማለትም በኢየሱስ፣ እንዲያምኑ ባቀረበው ጥሪ መታጀቡን ያሳያል።
  alternative: የዮሐንስ ጥምቀት ራሱ ክርስቲያናዊ እምነትን እንዳስገኘ መተርጎም፣ ወይም “ከእርሱ በኋላ የሚመጣውን” ማንነት ሳይገልጹ መተው።
  rationale: አገባቡ የዮሐንስን የንስሓ ጥምቀትና ከእርሱ በኋላ በሚመጣው እንዲያምኑ የነገረውን መልእክት ለይቶ ያቀርባል፤ “ማለትም በኢየሱስ” የሚለውም የሚመጣውን ሰው በግልጽ ይለያል። ጥቅሱ ያልተናገረው የጥምቀት ውጤት በትርጉሙ አልተጨመረም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ተመሳሳይ ሥር ያለው “ጥምቀትን አጠመቀ” የሚለው አወቃቀር ተጠብቆ፣ በአማርኛም ሊነበብ በሚችል መልኩ ቀርቧል።
