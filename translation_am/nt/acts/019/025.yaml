  rationale: ቃሉ በቀጥታ የወንድ ብዙ ቁጥር የጥሪ ቅርጽ ነው፤ ፆታዊ ዝርዝሩን ሳያጠፋ ግልጽ ለማድረግ እንዲህ ተተርጉሟል።
- source_word: ἐπίστασθε
  choice: ታውቃላችሁ
  rationale: ቀድሞውኑ ያላቸውን ዕውቀት ወይም ግንዛቤ ያመለክታል፤ ‘ታውቃላችሁ’ ቀጥተኛና ተፈጥሯዊ ነው።
- source_word: ἐκ ταύτης τῆς ἐργασίας
  choice: ከዚህ ንግድ
  rationale: ἐργασία ሥራን፣ ሙያን ወይም ገቢ የሚያስገኝ የንግድ እንቅስቃሴን ሊያመለክት ይችላል፤ በዚህ የገንዘብ አውድ ‘ንግድ’ ትርጉሙን በግልጽ ያስተላልፋል።
- source_word: ἡ εὐπορία ἡμῖν ἐστιν
  choice: ብልጽግናችን የሚገኘው
  rationale: εὐπορία የገንዘብ ምቾትን፣ ሀብትን ወይም ብልጽግናን ያመለክታል፤ ‘ብልጽግናችን የሚገኘው’ የግሪኩን ምንጭና የባለቤትነት ግንኙነት ተፈጥሯዊ በሆነ አማርኛ ይገልጣል።
