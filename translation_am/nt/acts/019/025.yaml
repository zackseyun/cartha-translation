  terminology: ‘ሠራተኞች’ appropriately retains the broad sense of ἐργάτας without importing the more specific contextual identification of craftsmen. ‘ንግድ’ and ‘ብልጽግና’ are suitable for ἐργασία and εὐπορία in this commercial context.
