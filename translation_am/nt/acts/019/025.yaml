  source_fidelity: The draft accurately represents the assembly, the associated workers, the direct male address, and the assertion that their prosperity derives from the business. The wording for prosperity is acceptable, though a more direct copular formulation better reflects ἡ εὐπορία ἡμῖν ἐστιν.
