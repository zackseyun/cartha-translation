  text: የአስማት ሥራዎችን ሲሠሩ ከነበሩት ብዙዎች[a] መጻሕፍቶቻቸውን ሰብስበው በሁሉም ፊት ያቃጥሏቸው ነበር። ዋጋቸውንም ደምረው የብር አምሳ ሺህ[b] መሆኑን አገኙ።
  philosophy: optimal-equivalence
