id: ACT.19.15
reference: Acts 19:15
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἀποκριθὲν δὲ τὸ πνεῦμα τὸ πονηρὸν εἶπεν ⸀αὐτοῖς· ⸀Τὸν Ἰησοῦν γινώσκω καὶ τὸν Παῦλον ἐπίσταμαι, ὑμεῖς δὲ τίνες ἐστέ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/015.yaml
  text: But the evil spirit answered them[a], “Jesus I know, and Paul I recognize—but who are you?”
translation:
  language: am
  text: ክፉው መንፈስ ግን መልሶ እንዲህ አላቸው፦ “ኢየሱስን አውቀዋለሁ፤ ጳውሎስንም አውቀዋለሁ[a]፤ እናንተ ግን እነማን ናችሁ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ኢየሱስን አውቀዋለሁ፤ ስለ ጳውሎስም አውቃለሁ።” በግሪክኛው “ማወቅ” የሚል ትርጉም ያላቸው ሁለት የተለያዩ ግሶች (γινώσκω እና ἐπίσταμαι) ተጠቅመዋል፤ ይህም የትርጉም ጥላ ልዩነት ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθὲν ... εἶπεν αὐτοῖς
  choice: መልሶ እንዲህ አላቸው
  rationale: የግሪኩ አውራጃዊ አገላለጽ ‘መልሶ ... አለ’ በአማርኛ ተፈጥሯዊ ሆኖ የምላሹን ኃይልና ተደራሲዎቹን ያስቀምጣል።
- source_word: δὲ
  choice: ግን
  rationale: በአስወጪዎቹ ሙከራና በመንፈሱ ምላሽ መካከል ያለውን ቀላል ተቃርኖ ያሳያል።
- source_word: τὸ πνεῦμα τὸ πονηρόν
  choice: ክፉው መንፈስ
  rationale: በዚህ አውድ πνεῦμα ግላዊ መንፈሳዊ ፍጡርን ያመለክታል፤ πονηρόν ደግሞ ‘ክፉ’ ተብሎ በግልጽና በተለመደ አማርኛ ተተርጉሟል።
- source_word: Τὸν Ἰησοῦν γινώσκω
  choice: ኢየሱስን አውቀዋለሁ
  rationale: የግሪኩን ቀጥተኛ ትርጉምና በስሙ ላይ ያለውን አጽንዖት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: τὸν Παῦλον ἐπίσταμαι
  choice: ጳውሎስንም አውቀዋለሁ
  rationale: ἐπίσταμαι እዚህ ስለ ጳውሎስ ማወቅን ወይም እርሱን ማወቅን ሊገልጽ ይችላል። ‘አውቀዋለሁ’ ተፈጥሯዊ ነው፤ ከγινώσκω ጋር ያለው የግስ ልዩነት ግን በማስታወሻ ተገልጿል።
- source_word: ὑμεῖς δὲ τίνες ἐστέ
  choice: እናንተ ግን እነማን ናችሁ?
  rationale: ‘እናንተ’ የብዙ ቁጥርንና አጽንዖቱን፣ ‘ግን’ ደግሞ ከኢየሱስና ከጳውሎስ ጋር ያለውን ተቃርኖ በግልጽ ያሳያሉ።
theological_decisions:
- issue: በγινώσκω እና ἐπίσταμαι መካከል ያለውን የቃል ልዩነት መተርጎም
  choice: ሁለቱንም በዋናው ጽሑፍ ‘አውቀዋለሁ’ ማለት፣ የግሶቹን ልዩነት በማስታወሻ ማሳየት
  alternative: ‘ኢየሱስን አውቀዋለሁ፤ ጳውሎስንም እገነዘበዋለሁ’ ወይም ‘ስለ ጳውሎስም አውቃለሁ’
  rationale: ግሪኩ ሁለት የተለያዩ ግሶችን ቢጠቀምም በዚህ አውድ ያላቸው ትክክለኛ የትርጉም ልዩነት እርግጠኛ አይደለም። በዋናው ጽሑፍ የግድ ልዩ የእውቀት ደረጃ መጫን ከመተርጎም ይልቅ አሻሚነቱን በማስታወሻ መጠበቅ ይሻላል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘እነማን ናችሁ?’ የግሪኩን ብዙ ቁጥርና አጽንዖት በግልጽ ያስተላልፋል።
