    text: ቃል በቃል፣ “ወደ ጌታ ኢየሱስ ስም።” የግሪኩ አገላለጽ በተለምዶ “በ… ስም” ተብሎ ይተረጎማል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσαντες
  choice: ይህን በሰሙ ጊዜ
  rationale: የግሪኩ የአኦሪስት አንቀጸ ግስ በዐውዱ የጊዜ ግንኙነትን ያሳያል። በግሪኩ በግልጽ ያልተደገመውን ነገር ግን ከቀደመው ንግግር የሚታወቀውን ተሳቢ “ይህን” ማከል በአማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: δὲ
  choice: -ም
  rationale: δὲ ቀላል የትረካ አያያዥ ነው፤ ከ“ሰሙ” ጋር የተያያዘው “-ም” ያለ ጠንካራ ተቃርኖ የንግግሩን ቀጣይነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐβαπτίσθησαν
  choice: ተጠመቁ
  rationale: የግሪኩን የአኦሪስት ተደራጊ ቅርጽ የሚያንጸባርቅ፣ በዘመናዊ መደበኛ አማርኛም የተለመደ አገላለጽ ነው።
- source_word: εἰς τὸ ὄνομα
  choice: ወደ … ስም
  rationale: εἰς ያለውን አቅጣጫዊና የመተባበር/የመለየት ኃይል ሳይተረጉም ለማቆየት “ወደ” ተመርጧል። በአማርኛ የተለመደው “በ…ስም” እንደ አማራጭ በማስታወሻ ቀርቧል።
- source_word: τοῦ κυρίου
  choice: የጌታ
  rationale: በዚህ ክርስቶሎጂያዊ ዐውድ κύριος የኢየሱስ ማዕረግ ስለሆነ፣ መደበኛው “ጌታ” ተጠቅሟል።
- source_word: Ἰησοῦ
  choice: ኢየሱስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ ወግና በዘመናዊ አጠቃቀም የተለመደው የስሙ ቅርጽ ነው።
theological_decisions:
- issue: የጥምቀት አገላለጽ—εἰς τὸ ὄνομα
  choice: ወደ ጌታ ኢየሱስ ስም
  alternative: በጌታ ኢየሱስ ስም
  rationale: ዋናው ንባብ የεἰςን አቅጣጫዊ/ተዛማጅ ኃይል በቅርብ ይጠብቃል፤ በቤተ ክርስቲያናዊ አጠቃቀም የተለመደውን አገላለጽ ደግሞ በማስታወሻ ማቅረብ ጽሑፉን ወደ አንድ የኋላ ዘመን ሥርዓታዊ ትርጓሜ ሳያጣብብ ሁለቱንም የትርጉም አቅጣጫዎች ያስጠብቃል።
