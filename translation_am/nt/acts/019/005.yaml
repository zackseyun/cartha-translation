  rationale: The revision retains the temporal sequence implied by ἀκούσαντες and the passive sense of ἐβαπτίσθησαν, while using idiomatic Amharic for the baptismal formula. A concise footnote preserves awareness that εἰς τὸ ὄνομα is literally directional, without imposing a theological interpretation or retaining an unnatural calque in the main text.
