  rationale: ይህ የግሪኩን አጭርና ቀጥተኛ አነጋገር ይከተላል። “እንደተሰጠ” የሚለውን በግሪኩ ያልተገለጸ ማብራሪያ ወደ ዋናው ጽሑፍ አያስገባም፤ ሌሎች ሊሆኑ የሚችሉ ንባቦች በማስታወሻ ተጠብቀዋል።
