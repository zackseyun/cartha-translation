base_translation:
  language: en
  yaml_path: translation/nt/acts/019/002.yaml
  text: And he said to them[a], “Did you receive the Holy Spirit when you believed?” And they said to him, “No[b], we have not even heard that there is a Holy Spirit.”
translation:
  language: am
  text: እንዲህም አላቸው፦ “ባመናችሁ ጊዜ መንፈስ ቅዱስን ተቀበላችሁን?[a]” እነርሱም፦ “አይ፤ መንፈስ ቅዱስ እንዳለ እንኳ አልሰማንም[b]” አሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ካመናችሁ በኋላ መንፈስ ቅዱስን ተቀበላችሁን?” የግሪኩ አሳታፊ ግስ የጊዜውን ግንኙነት በመጠኑ በተለያየ አጽንዖት ሊገልጥ ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “መንፈስ ቅዱስ ይኑር አይኑር እንኳ አልሰማንም፤” ወይም ትርጉሙን ይበልጥ በመግለጥ፣ “መንፈስ ቅዱስ እንደተሰጠ እንኳ አልሰማንም።”
    reason: alternative_reading
