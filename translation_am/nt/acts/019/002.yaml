  rationale: ይህ አገላለጽ πιστεύσαντες እና ἐλάβετε መካከል ያለውን የጊዜ ግንኙነት ያሳያል፤ ግን “ከእምነት በኋላ” ወይም “በዚያው ቅጽበት” የሚል ጥብቅ ቅደም ተከተል አያስገድድም።
