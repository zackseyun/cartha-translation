  yaml_path: translation/nt/acts/019/006.yaml
  text: And when Paul laid his hands on them[a], the Holy Spirit came upon them, and they began speaking in tongues and prophesying.
translation:
  language: am
  text: 'ጳውሎስም እጆቹን በላያቸው በጫነ ጊዜ፣ መንፈስ ቅዱስ በላያቸው መጣ፤ እነርሱም በልሳናት[a] ይናገሩና ትንቢት ይናገሩ ነበር።


    [a] ወይም፣ «በቋንቋዎች»። የግሪክኛው ቃል «ልሳናት» ወይም «ቋንቋዎች» ማለት ሊሆን ይችላል፤ ዋናው ጽሑፍ አሻሚነቱን ጠብቆታል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በቋንቋዎች»። የግሪክኛው ቃል «ልሳናት» ወይም «ቋንቋዎች» ማለት ሊሆን ይችላል፤ ዋናው ጽሑፍ አሻሚነቱን ጠብቆታል።
    reason: lexical_alternative
