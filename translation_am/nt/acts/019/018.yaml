  verdict: revise
  source_fidelity: The draft accurately represents πολλοί, the continuative force of τε, the perfect participle πεπιστευκότων, and the broad sense of τὰς πράξεις αὐτῶν. However, the two Greek present participles are best represented in Amharic with progressive forms coordinated with “እየመጡ ... ነበር,” rather than finite imperfect verbs.
  naturalness: The sentence is clear and suitably modern, but the mixed construction “እየመጡ ... ይናዘዙና ይገልጹ ነበር” is less smooth and less aspectually parallel than progressive participial forms throughout.
  terminology: “ድርጊቶቻቸውን” appropriately remains broad and does not prematurely restrict the referent to sins or magical practices. “መናዘዝ” and “መግለጽ” suitably distinguish the two participles without doctrinal expansion.
  issues:
  - severity: low
    issue: The verbal aspect is not fully parallel in the Amharic clause.
    rationale: ἤρχοντο, ἐξομολογούμενοι, and ἀναγγέλλοντες portray a continuing narrative action. Rendering all three with “እየ...” forms gives a natural Amharic equivalent and avoids the slight mismatch between progressive “እየመጡ” and finite “ይናዘዙ ... ነበር.”
  revised_text: ካመኑትም መካከል ብዙዎች እየመጡ ድርጊቶቻቸውን[a] እየተናዘዙና እየገለጹ ነበር።
