base_translation:
  language: en
  yaml_path: translation/nt/acts/019/018.yaml
  text: And many of those who had believed were coming[a], confessing and disclosing their practices.
translation:
  language: am
  text: ካመኑትም መካከል ብዙዎች እየመጡ ድርጊቶቻቸውን[a] እየተናዘዙና እየገለጹ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ተግባሮቻቸውን” ወይም “ያደረጉትን ነገር።”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοί
  choice: ብዙዎች
  rationale: ቁጥራዊውን ትርጉም በተፈጥሯዊና አጭር አማርኛ ያስተላልፋል።
- source_word: τε
  choice: -ም
  rationale: ከቀደመው ትረካ ጋር ያለውን ለስላሳ አያያዥነት በአማርኛ ተያያዥ ቅጥያ ያሳያል።
- source_word: τῶν πεπιστευκότων
  choice: ካመኑት መካከል
  rationale: ፍጹም አንቀጽ ቅርጹ አስቀድሞ የተፈጸመና ውጤቱ የቀጠለ እምነትን ያመለክታል፤ ይህ አተረጓጎም ቴክኒካዊ የቡድን መጠሪያን አያስገባም።
- source_word: ἤρχοντο
  choice: እየመጡ ... ነበር
  rationale: ያልተጠናቀቀውንና በቀደመ ጊዜ የቀጠለውን ድርጊት በተፈጥሯዊ የአማርኛ አወቃቀር ይጠብቃል።
- source_word: ἐξομολογούμενοι
  choice: ይናዘዙ
  rationale: መናዘዝን ወይም አምኖ መቀበልን በቀጥታ ያሳያል፤ ግሪኩ በግልጽ ያልጠቀሰውን ነገር አይጨምርም።
- source_word: ἀναγγέλλοντες
  choice: ይገልጹ
  rationale: ነገርን ማሳወቅና ወደ ግልጽ ማውጣት የሚለውን ፍቺ ይይዛል፤ ከ“ይናዘዙ” ጋርም አላስፈላጊ ድግግሞሽ አይፈጥርም።
- source_word: τὰς πράξεις αὐτῶν
  choice: ድርጊቶቻቸውን
  rationale: πρᾶξις ድርጊትን፣ ተግባርን ወይም ልማዳዊ አሠራርን ሊያመለክት ስለሚችል፣ “ድርጊቶቻቸውን” የቃሉን ስፋት ሳያጠብ ያቀርባል።
theological_decisions:
- issue: πεπιστευκότων እንደ የተረጋጋ የቡድን መጠሪያ ወይስ እንደ ቀደመ ድርጊትና ቀጣይ ሁኔታ መተርጎሙ
  choice: ካመኑት መካከል
  alternative: ከአማኞች መካከል
  rationale: የግሪኩ ፍጹም አንቀጽ ቀደም ሲል የተፈጸመውን ማመንና የቀጠለውን ሁኔታ ያጎላል፤ ስለዚህ ቴክኒካዊ የቤተ ክርስቲያን መጠሪያ አልተጫነበትም።
- issue: τὰς πράξεις αὐτῶν በተለይ ኃጢአትን፣ የአስማት ልማድን ወይም በአጠቃላይ ድርጊትን ማመልከቱ
  choice: ድርጊቶቻቸውን
  alternative: የአስማት ልማዶቻቸውን / ኃጢአቶቻቸውን
  rationale: አውዱ የአስማት ተግባርን ቢያመለክትም ስሙ ራሱ ከዚያ ይሰፋል፤ ስለዚህ ጽሑፉ በግልጽ ካለው በላይ አልተጠበበም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። “እየመጡ ... ነበር” የግሪኩን ቀጣይ የድርጊት ገጽታ ያሳያል፤ ሁለቱ ተያያዥ ግሶች በ“ይናዘዙና ይገልጹ” ተፈጥሯዊ ሆነው ቀርበዋል።
