base_translation:
  language: en
  yaml_path: translation/nt/acts/019/038.yaml
  text: If[a], then, Demetrius and the craftsmen with him have a complaint against anyone, court sessions are being held and there are proconsuls[b]; let them bring charges against one another.
translation:
  language: am
  text: እንግዲህ ድሜጥሮስና ከእርሱ ጋር ያሉት የእጅ ጥበብ ባለሙያዎች በማንም ላይ ክስ ካላቸው፣ የፍርድ ችሎቶች ይካሄዳሉ[a]፣ ፕሮቆንስላትም አሉ[b]፤ እርስ በርሳቸው ክስ ያቅርቡ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ፍርድ ቤቶች ለችሎት ክፍት ናቸው።» የግሪኩ አገላለጽ ἀγοραῖοι ἄγονται በይፋ የተጠሩ የፍርድ ሂደቶችን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «ፕሮቆንስላት በቦታው ይገኛሉ/ሥራ ላይ ናቸው።» ፕሮቆንስላት የሮም አውራጃ ባለሥልጣናት ናቸው። የብዙ ቁጥሩ በአጠቃላይ የአውራጃውን የአስተዳደር ሥልጣን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὲν οὖν
  choice: እንግዲህ ... ካላቸው
  rationale: οὖν ያለውን መደምደሚያዊ ሽግግር በ«እንግዲህ»፣ εἰ ያለውን ሁኔታዊ አገባብ ደግሞ በ«ከ.../ካ...» አወቃቀር በተፈጥሯዊ አማርኛ ያሳያል፤ μέν ለብቻው ሳይጫን በአረፍተ ነገሩ ፍሰት ውስጥ ተካትቷል።
- source_word: Δημήτριος
  choice: ድሜጥሮስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ ስም አጠራር የተለመደውን ቅጽ ይከተላል።
- source_word: οἱ σὺν αὐτῷ τεχνῖται
  choice: ከእርሱ ጋር ያሉት የእጅ ጥበብ ሠራተኞች
  rationale: τεχνῖται የሰለጠኑ የዕደ ጥበብ ሠራተኞችን ያመለክታል፤ «ከእርሱ ጋር ያሉት» የσὺν αὐτῷን ግንኙነት ከጽሑፉ በላይ ሳያጠብቅ ይጠብቃል።
- source_word: ἔχουσιν πρός τινα λόγον
  choice: በማንም ላይ ክስ ካላቸው
  rationale: በዚህ የሕግ አውድ λόγον ቅሬታን ወይም የፍርድ ጉዳይን ያመለክታል፤ «ክስ» የፍርድ ቤት ትርጉሙን በግልጽ ያስተላልፋል።
- source_word: τινα
  choice: ማንም
  rationale: በአጠቃላይ የሕግ መመሪያ ውስጥ ያለውን ያልተወሰነ ሰው ያመለክታል።
- source_word: ἀγοραῖοι ἄγονται
  choice: የፍርድ ችሎቶች ይካሄዳሉ
  rationale: ቃላዊው «የገበያ ቀናት» ሳይሆን በይፋ የተጠሩ የፍርድ ሂደቶችን የሚያመለክተውን ተቋማዊ ፍቺ ያሳያል፣ የግሪኩንም ተደራጊ ቅርጽ ይጠብቃል።
- source_word: ἀνθύπατοί εἰσιν
  choice: ሮማዊ አገረ ገዢዎችም አሉ
  rationale: ἀνθύπατοι የሮም አውራጃዎችን የሚያስተዳድሩ proconsuls ናቸው። ለተራ አንባቢ በሚገባ የሥልጣን ሚናቸውን ለማሳየት «ሮማዊ አገረ ገዢዎች» ተመርጧል፤ የብዙ ቁጥሩም ተጠብቋል።
- source_word: ἐγκαλείτωσαν
  choice: ይካሰሱ
  rationale: በሕጋዊ መድረክ ክስ ማቅረብን የሚያመለክት ትእዛዛዊ አገላለጽ ነው።
- source_word: ἀλλήλοις
  choice: እርስ በርሳቸው
  rationale: ከἐγκαλείτωσαν ጋር ሲነበብ ወገኖቹ በሕጋዊ መንገድ እርስ በርሳቸው ክስ እንዲያቀርቡ የሚያሳየውን ተመላላሽ ግንኙነት ይጠብቃል።
