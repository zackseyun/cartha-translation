  rationale: ደቀ መዛሙርቱን ከተቃዋሚዎቹ ሆን ብሎ ማለየቱን እና ከዚያ ስፍራ አብረውት መውጣታቸውን በዐውዱ መሠረት ያሳያል።
- source_word: καθ’ ἡμέραν
