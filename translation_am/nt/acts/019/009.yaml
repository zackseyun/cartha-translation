  rationale: σχολή በዚህ ዐውድ የማስተማሪያ ወይም የንግግር አዳራሽን ሊያመለክት ስለሚችል፣ ለዘመናዊ አንባቢ ከዘመናዊ መደበኛ ትምህርት ቤት ጋር እንዳይደባለቅ ይህ ቃል ተመርጧል።
