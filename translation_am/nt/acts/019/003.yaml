id: ACT.19.3
reference: Acts 19:3
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἶπέν ⸀τε· Εἰς τί οὖν ἐβαπτίσθητε; οἱ δὲ εἶπαν· Εἰς τὸ Ἰωάννου βάπτισμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/003.yaml
  text: And he said[a], “Into what then were you baptized?” And they said, “Into John's baptism.”
translation:
  language: am
  text: እርሱም፣ “እንግዲያስ ወደ ምን ተጠመቃችሁ?” አላቸው። እነርሱም፣ “ወደ ዮሐንስ ጥምቀት” አሉት።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπέν τε
  choice: እርሱም … አላቸው
  rationale: λέγωን ‘አለ’ በሚለው ተፈጥሯዊ የአማርኛ አነጋገር ተርጉሞ፣ τε የሚያሳየውን ቀላል የትረካ ትስስር በ‘ም’ ጠብቋል። የንግግሩ ተቀባዮች በአውዱ ግልጽ ስለሆኑ ‘አላቸው’ ተመርጧል።
- source_word: Εἰς τί οὖν
  choice: እንግዲያስ ወደ ምን
  rationale: οὖν ያለውን ውጤታዊ የንግግር ሽግግር ‘እንግዲያስ’ በተፈጥሯዊነት ያሳያል፤ εἰς በ‘ወደ’ ተጠብቆ በጥያቄውና በመልሱ መካከል ያለውን ትይዩነት ይጠብቃል።
- source_word: ἐβαπτίσθητε
  choice: ተጠመቃችሁ
  rationale: የβαπτίζω አኦሪስት ተደራጊ ቅርጽን በመደበኛውና በተፈጥሯዊው የአማርኛ የጥምቀት ግስ ያቀርባል።
- source_word: Εἰς τὸ Ἰωάννου βάπτισμα
  choice: ወደ ዮሐንስ ጥምቀት
  rationale: የግሪኩን εἰς በ‘ወደ’ ጠብቆ፣ Ἰωάννου βάπτισμαን በአማርኛ በተለመደው የስም ተከታታይነት ‘የዮሐንስ ጥምቀት’ ብሎ ሳይቀይር ‘ዮሐንስ ጥምቀት’ በማለት የጥያቄውንና የመልሱን ቅርጽ በቅርብ ይጠብቃል።
- source_word: βάπτισμα
  choice: ጥምቀት
  rationale: በዚህ አውድ የተጠቀሰውን ከዮሐንስ ጋር የተያያዘ ሥርዓት በትክክል የሚሰይም የተመሠረተ የአማርኛ ቃል ነው።
theological_decisions:
- issue: በጥያቄውና በመልሱ የተደገመውን εἰς መጠበቅ ወይስ በአማርኛ ፈሊጥ ማለስለስ
  choice: በሁለቱም ክፍሎች ‘ወደ’ በማለት መጠበቅ
  alternative: ‘የትኛውን ጥምቀት ተጠመቃችሁ?’ / ‘የዮሐንስን ጥምቀት’ ብሎ መተርጎም
  rationale: ‘ወደ’ የግሪኩን ቅርጽና ‘ወደ ምን…?’ / ‘ወደ ዮሐንስ ጥምቀት’ የሚለውን የንግግር ትይዩነት ይጠብቃል፤ የጥምቀትን ትርጉም በአንድ የእምነት ትውፊት አተረጓጎም አይወስንም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ የሚገባ አማርኛ ይጠቀማል። ‘እንግዲያስ’ የውይይቱን ምክንያታዊ ቀጣይነት በተፈጥሯዊ ሁኔታ ያሳያል። በቀረበው የእንግሊዝኛ መረጃ ውስጥ የ[a] ማስታወሻው ጽሑፍ ከዋናው አማራጭ ጋር የማይጣጣም በመሆኑ፣ ከግሪክ ምንጭ ለዚህ የአማርኛ ረቂቅ አስፈላጊ የሆነ የግርጌ ማስታወሻ አልተጨመረም።
