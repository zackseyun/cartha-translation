id: ACT.19.21
reference: Acts 19:21
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐπληρώθη ταῦτα, ἔθετο ὁ Παῦλος ἐν τῷ πνεύματι διελθὼν τὴν Μακεδονίαν καὶ Ἀχαΐαν πορεύεσθαι εἰς ⸀Ἱεροσόλυμα, εἰπὼν ὅτι Μετὰ τὸ γενέσθαι με ἐκεῖ δεῖ με καὶ Ῥώμην ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/021.yaml
  text: After these things were completed[a], Paul resolved in the Spirit to go to Jerusalem after passing through Macedonia and Achaia, saying, “After I have been there[b], I must also see Rome.”
translation:
  language: am
  text: እነዚህ ነገሮች ከተጠናቀቁ በኋላ፣ ጳውሎስ በመንፈስ[a] በመቄዶንያና በአካያ አልፎ ወደ ኢየሩሳሌም ለመሄድ ወሰነ፤ እንዲህም አለ፦ “ወደዚያ ከደረስሁ በኋላ፣ ሮምንም ማየት አለብኝ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በራሱ መንፈስ።” የግሪኩ ሐረግ የጳውሎስን ውስጣዊ ውሳኔ ወይም የመንፈስ ቅዱስን ምሪት ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπληρώθη
  choice: ከተፈጸሙ
  rationale: ከዚህ በፊት የተጠቀሱት ጉዳዮች ወደ ፍጻሜ መድረሳቸውን ያሳያል፤ ትንቢት መፈጸምን በግድ አያመለክትም።
- source_word: ἔθετο
  choice: ወስኖ … አሰበ
  rationale: የግሥ ሐረጉ ጳውሎስ ሆን ብሎ ያደረገውን ውሳኔና ዕቅድ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐν τῷ πνεύματι
  choice: በመንፈስ
  rationale: የግሪኩን ሐረግ አሻሚነት ይጠብቃል፤ መንፈስ ቅዱስን ወይም የጳውሎስን ውስጣዊ መንፈስ ሊያመለክት ይችላል።
- source_word: διελθὼν τὴν Μακεδονίαν καὶ Ἀχαΐαν
  choice: በመቄዶንያና በአካያ አድርጎ
  rationale: ወደ ኢየሩሳሌም ከመሄዱ በፊት በሁለቱ ክልሎች የሚያልፍበትን የጉዞ ቅደም ተከተል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Μετὰ τὸ γενέσθαι με ἐκεῖ
  choice: ወደዚያ ከደረስኩ በኋላ
  rationale: በተጠቀሰው ቦታ መገኘትን የሚገልጠውን ግሪካዊ አገላለጽ በግልጽና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: δεῖ με καὶ Ῥώμην ἰδεῖν
  choice: ሮምንም ማየት አለብኝ
  rationale: δεῖ የሚያሳየውን አስፈላጊነት ወይም የማይቀር ዓላማ ይጠብቃል፤ ἰδεῖνንም ‘ማየት’ ብሎ በቅርብ ይተረጉማል።
theological_decisions:
- issue: የἐν τῷ πνεύματι ተጠቃሽ
  choice: በመንፈስ
  alternative: በራሱ መንፈስ / በልቡ
  rationale: በግሪክ ጽሑፍ የባለቤትነት ተውላጠ ስም የለም። ስለዚህ ሐረጉ የመንፈስ ቅዱስን ምሪት ወይም የጳውሎስን ውስጣዊ ውሳኔ ሊያመለክት ይችላል፤ ዋናው ጽሑፍና ማስታወሻው ይህን አሻሚነት ይጠብቃሉ።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የቦታ ስሞች በተለመደው የአማርኛ መጽሐፍ ቅዱስ አጻጻፍ ቀርበዋል።
