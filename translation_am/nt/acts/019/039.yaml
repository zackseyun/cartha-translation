id: ACT.19.39
reference: Acts 19:39
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἰ δέ τι ⸀περαιτέρω ἐπιζητεῖτε, ἐν τῇ ἐννόμῳ ἐκκλησίᾳ ἐπιλυθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/039.yaml
  text: But if you seek anything further[a], it will be settled in the lawful assembly.
translation:
  language: am
  text: ነገር ግን የምትፈልጉት ተጨማሪ ነገር ካለ፣ ጉዳዩ በሕግ በተቋቋመው ጉባኤ[a] ይፈታል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በሕጋዊው ጉባኤ” ወይም “በመደበኛው ጉባኤ።” የግሪኩ ቃል እዚህ የሚያመለክተው በሕግ መሠረት የተቋቋመ የከተማ ጉባኤ እንጂ ቤተ ክርስቲያን አይደለም።
    reason: lexical_alternative
lexical_decisions:
- source_word: περαιτέρω
  choice: ከዚህ በላይ ሌላ
  rationale: በእጅ ላይ ካለው ጉዳይ ተጨማሪ ወይም የዘለለ ነገር መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐπιζητεῖτε
  choice: የምትፈልጉ
  rationale: ተጨማሪ ጉዳይን መሻት ወይም መከታተል የሚለውን ሰፊ ትርጉም ይጠብቃል፤ ከግሪኩ በላይ የሕግ ቴክኒካዊ ቃል አያስገባም።
- source_word: ἐννόμῳ
  choice: ሕጋዊ በሆነው
  rationale: ስብሰባው በሕግ መሠረት የተቋቋመና የሚካሄድ መሆኑን ያሳያል።
- source_word: ἐκκλησίᾳ
  choice: ጉባኤ
  rationale: በዚህ ዐውድ ቃሉ የኤፌሶንን ሕጋዊ የከተማ ስብሰባ ያመለክታል እንጂ የክርስቲያኖችን ማኅበር አይደለም። ‘ጉባኤ’ የተሰበሰበ ሕዝባዊ አካልን ያመለክታል፤ ‘ፍርድ ቤት’ ግን ከምንጩ በላይ የተወሰነ ትርጓሜ ይጨምራል።
- source_word: ἐπιλυθήσεται
  choice: ይፈታል
  rationale: የወደፊት ጊዜ ተደራጊ ቅርጹንና ጉዳዩ በሥርዓት መፍትሔ እንደሚያገኝ የሚገልጠውን ሐሳብ ይጠብቃል።
- source_word: τι
  choice: ጉዳይ
  rationale: በዚህ የሕዝብና የሕግ ዐውድ ያልተወሰነውን ‘አንድ ነገር’ በተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: ἐκκλησία ክርስቲያናዊ ባልሆነ የከተማ ዐውድ ውስጥ እንዴት እንደሚተረጎም
  choice: ጉባኤ
  alternative: ቤተ ክርስቲያን፣ ስብሰባ
  rationale: በዐውዱ የተጠቀሰው የኤፌሶን ሕጋዊ የከተማ ጉባኤ ነው። ‘ቤተ ክርስቲያን’ የሚለው አንባቢውን ወደ ክርስቲያናዊ ማኅበር በስህተት ይመራል፤ ‘ጉባኤ’ ግን የተሰበሰበን ሕዝባዊ አካል ትርጉም ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የከተማውን ሕጋዊ አሠራር ለማሳየት ‘ሕጋዊ በሆነው ጉባኤ’ ተመርጧል።
