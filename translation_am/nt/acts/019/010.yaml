base_translation:
  language: en
  yaml_path: translation/nt/acts/019/010.yaml
  text: This continued for two years[a], so that all who lived in Asia heard the word of the Lord, both Jews and Greeks.
translation:
  language: am
  text: ይህም ለሁለት ዓመት ቀጠለ፤ በዚህም ምክንያት በእስያ[a] የሚኖሩ ሁሉ፣ አይሁድንና ግሪካውያንን ጨምሮ፣ የጌታን ቃል ሰሙ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይህ «እስያ» በምዕራባዊው የትንሿ እስያ ክፍል የነበረውን የሮም የእስያ ክፍለ ግዛት ያመለክታል፤ የዘመኑን የእስያ አህጉር አይደለም።
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτο δὲ ἐγένετο
  choice: ይህም ... ቀጠለ
  rationale: ἐγένετο በቀጥታ «ሆነ» ወይም «ተከናወነ» ሊባል ቢችልም፣ ዐውዱ በቀደመው ቁጥር የተጠቀሰው የማስተማር ሥራ ለተወሰነ ጊዜ መቆየቱን ያመለክታል፤ «ቀጠለ» ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐπὶ ἔτη δύο
  choice: ለሁለት ዓመት
  rationale: ἐπί ከጊዜ መጠን ጋር የቆይታን ርዝመት ይገልጣል፤ «ለሁለት ዓመት» ተፈጥሯዊና ትክክለኛ ነው።
- source_word: ὥστε
  choice: ስለዚህ
  rationale: የቀደመውን ቀጣይ ድርጊት ውጤት ያስገባል፤ «ስለዚህ» ውጤታዊውን ግንኙነት በግልጽ ያሳያል።
- source_word: πάντας τοὺς κατοικοῦντας τὴν Ἀσίαν
  choice: በእስያ የሚኖሩ ሁሉ
  rationale: κατοικοῦντας በቦታው የሚኖሩትን ያመለክታል፤ πάντας የሚያሳየው አጠቃላይ ወሰን «ሁሉ» በሚለው ተጠብቋል።
- source_word: ἀκοῦσαι
  choice: ሰሙ
  rationale: የድርጊቱን ውጤት በቀጥታ ያስተላልፋል፤ በግሪኩ ያልተገለጸ ተጨማሪ ሐሳብ አይጨምርም።
- source_word: τὸν λόγον
  choice: ቃል
  rationale: λόγος በሐዋርያት ሥራ ውስጥ የታወጀውን መልእክት የሚያመለክት ተደጋጋሚ አገላለጽ ነው፤ «ቃል» የሉቃስን ቃላዊና ሥነ መለኮታዊ ጥለት ይጠብቃል።
- source_word: τοῦ κυρίου
  choice: የጌታን
  rationale: κύριος እዚህ λόγονን የሚወስን የባለቤትነት ቅጽ ነው፤ «የጌታን ቃል» በአማርኛ ተፈጥሯዊና የተለመደ ነው።
- source_word: Ἰουδαίους τε καὶ Ἕλληνας
  choice: አይሁድም ግሪካውያንም
  rationale: τε καὶ ሁለቱንም ቡድኖች በአካታችነት ያገናኛል፤ ተደጋጋሚው «-ም ... -ም» ይህን በተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: «እስያ» የሚለው ስያሜ ወሰን
  choice: በምዕራባዊ ትንሹ እስያ የነበረውን የሮም ግዛት እስያ ያመለክታል።
  alternative: የዘመኑን ሰፊ የእስያ አህጉር እንደሚያመለክት መረዳት።
  rationale: በሐዋርያት ሥራ ውስጥ Ἀσία በመደበኛነት የሮምን እስያ ግዛት ያመለክታል። ዋናው ጽሑፍ የቦታውን ስም እንዳለ ይጠብቃል፤ የግዛቱ ታሪካዊ ወሰን በግርጌ ማስታወሻ ተብራርቷል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግርጌ ማስታወሻው ምልክት ከሚያብራራው «እስያ» ቀጥሎ ተቀምጧል።
