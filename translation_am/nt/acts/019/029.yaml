  text: καὶ ἐπλήσθη ἡ ⸀πόλις τῆς συγχύσεως, ὥρμησάν τε ὁμοθυμαδὸν εἰς τὸ θέατρον συναρπάσαντες Γάϊον καὶ Ἀρίσταρχον Μακεδόνας, συνεκδήμους Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/029.yaml
  text: And the city was filled with confusion[a], and they rushed together into the theater, dragging along Gaius and Aristarchus, Macedonians who were Paul’s traveling companions.
translation:
  language: am
  text: ከተማይቱም በሁከት ተሞላች፤ የጳውሎስ የጉዞ ጓደኞች የሆኑትን መቄዶንያውያን ጋይዮስንና አርስጥሮኮስን በኃይል ይዘው፣ በአንድ ላይ ወደ ትያትር ስፍራው ተጣደፉ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπλήσθη
  choice: ተሞላች
  rationale: የግሪኩን ተደራጊ ቅርጽ በቀጥታ የሚያስተላልፍ ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
- source_word: πόλις
  choice: ከተማይቱ
  rationale: πόλιςን በመደበኛ ሁኔታ ይተረጉማል፤ የተወሰነችው ከተማ ኤፌሶን መሆኗንም ዐውዱ ያሳያል።
- source_word: συγχύσεως
  choice: ሁከት
  rationale: በዐውዱ ያለውን ግርግር፣ ውዥንብርና ሥርዓት ማጣት በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ὥρμησάν
  choice: ተጣደፉ
  rationale: ድንገተኛና ኃይለኛ የቡድን እንቅስቃሴን ያሳያል።
- source_word: ὁμοθυμαδόν
  choice: በአንድነት
  rationale: በዚህ ዐውድ የልብ ስምምነትን ሳይጨምር የሕዝቡን የጋራ እንቅስቃሴ ያመለክታል።
- source_word: θέατρον
  choice: የትያትር ስፍራው
  rationale: ግሪኩ የሚያመለክተውን ሕዝባዊ የትርዒትና የስብሰባ ስፍራ ያለ አላስፈላጊ ዝርዝር ያቀርባል።
- source_word: συναρπάσαντες
  choice: ጎትተው ይዘው
  rationale: ተሳቢው የሚያሳየውን በኃይል መያዝና አብሮ መውሰድ ሁለቱንም ያካትታል።
- source_word: Γάϊον
  choice: ጋይዮስን
  rationale: የግሪኩን የግል ስም በአማርኛ የመጽሐፍ ቅዱስ አጻጻፍ ልማድ መሠረት ይተረጉማል።
- source_word: Ἀρίσταρχον
  choice: አርስጥሮኮስን
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጻጻፍ ልማድ የታወቀውን የስሙን ቅርጽ ይጠቀማል።
- source_word: Μακεδόνας
  choice: መቄዶንያውያን
  rationale: የሰዎቹን ክልላዊ ማንነት በግልጽ ያስተላልፋል።
- source_word: συνεκδήμους Παύλου
  choice: የጳውሎስ የጉዞ ጓደኞች
  rationale: ከጳውሎስ ጋር ከአገር ወጥተው የሚጓዙ ጓደኞች የሚለውን ትርጉም በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: τε
  choice: ሕዝቡም
  rationale: አያያዥ ኃይሉ በአማርኛው -ም ተወክሎ የትረካውን ፍሰት ይጠብቃል።
