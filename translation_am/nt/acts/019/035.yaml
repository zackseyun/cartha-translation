  text: καταστείλας δὲ ⸂ὁ γραμματεὺς τὸν ὄχλον⸃ φησίν· Ἄνδρες Ἐφέσιοι, τίς γάρ ἐστιν ⸀ἀνθρώπων ὃς οὐ γινώσκει τὴν Ἐφεσίων πόλιν νεωκόρον οὖσαν τῆς ⸀μεγάλης Ἀρτέμιδος καὶ τοῦ διοπετοῦς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/035.yaml
  text: But after the city clerk had quieted the crowd, he said, “Men of Ephesus, for what man is there who does not know that the city of the Ephesians is temple-keeper of the great Artemis and of the image fallen from heaven?”
translation:
  language: am
  text: የከተማው ጸሐፊም ሕዝቡን ጸጥ ካሰኘ በኋላ፣ እንዲህ አለ፤ “የኤፌሶን ሰዎች ሆይ፣ የኤፌሶን ከተማ የታላቂቱ አርጤምስ መቅደስና ከሰማይ የወደቀው ምስል ጠባቂ መሆኗን የማያውቅ ሰው ማን አለ?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ከሰማይ የወደቀው ነገር” ተብሎም ሊተረጎም ይችላል። የግሪኩ ቃል ከሰማይ ወድቋል ተብሎ የሚታመንን ነገር ያመለክታል፤ በዚህ አውድ ምናልባት ከአርጤምስ አምልኮ ጋር የተያያዘውን ምስል ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: καταστείλας
  choice: ጸጥ ካሰኘ በኋላ
  rationale: የግሪኩ የአኦሪስት አጋር ግስ ከዋናው ንግግር በፊት የተፈጸመውን ተግባር ያሳያል፤ ይህ አተረጓጎም ቅደም ተከተሉን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ὁ γραμματεὺς
  choice: የከተማው ጸሐፊ
  rationale: በዚህ የሲቪል አውድ γραμματεύς የአይሁድ ጸሐፊን ሳይሆን የከተማ ባለሥልጣንን ያመለክታል።
- source_word: Ἄνδρες Ἐφέσιοι
  choice: የኤፌሶን ሰዎች ሆይ
  rationale: መደበኛውን የጥሪ ቅርጽ ይጠብቃል፤ በአማርኛ ‘ሰዎች ሆይ’ የሕዝብ ስብሰባን ለመጥራት ተፈጥሯዊና ክብር ያለው ነው።
- source_word: τίς γάρ ἐστιν ἀνθρώπων ὃς οὐ γινώσκει
  choice: የማያውቅ ሰው ማን አለ?
  rationale: የግሪኩን አጽንዖታዊ ጥያቄ በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: νεωκόρον
  choice: መቅደስና … ምስል ጠባቂ
  rationale: ቃሉ አንዲት ከተማ የመቅደስ ወይም የአምልኮ ማዕከል ተንከባካቢ መሆኗን ያመለክታል፤ ‘ጠባቂ’ የአስተዳደርና የክብካቤውን ሐሳብ ያስተላልፋል።
- source_word: τῆς μεγάλης Ἀρτέμιδος
  choice: የታላቂቱ አርጤምስ
  rationale: የግሪኩን መጠሪያዊ ማዕረግ በአማርኛ ይጠብቃል፤ ‘ታላቂቱ’ ሴት አማልክት መባሏን በሰዋሰው ያንጸባርቃል።
- source_word: τοῦ διοπετοῦς
  choice: ከሰማይ የወደቀው ምስል
  rationale: διοπετής ከሰማይ ወደቀ ተብሎ የሚታመንን ነገር ያመለክታል፤ በዚህ አውድ ‘ምስል’ ሊሆን እንደሚችል ግልጽ ያደርጋል፣ ግን የቃሉ ቀጥተኛ አሻሚነት በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: ስለ አርጤምስና ከሰማይ ወደቀ ስለተባለው ነገር የተነገረውን የአረማውያን እምነት መተርጎም
  choice: የንግግሩን ይዘት እንደ ከተማው ጸሐፊ አባባል በቀጥታ ማቅረብ
  alternative: ንግግሩ ሐሰት እንደሆነ በዋናው ጽሑፍ በትርጓሜ መጨመር
  rationale: ቁጥሩ የከተማውን ባለሥልጣን ንግግር ይዘግባል እንጂ የአረማውያንን እምነት እንደ ትምህርተ እውነት አያጸድቅም። ትርጉሙ የተናጋሪውን ጥያቄ ሳያረጋግጥም ሳይክድም ይዘግባል።
- issue: διοπετοῦς የሚያመለክተው ነገር
  choice: በዋናው ጽሑፍ ‘ምስል’፣ በማስታወሻ ደግሞ ቀጥተኛው ‘ከሰማይ የወደቀው ነገር’
  alternative: ‘ከዜኡስ የወደቀው’ ወይም ‘ድንጋይ’
  rationale: አውዱ የአምልኮ ምስልን ያመለክታል ተብሎ በአግባቡ ሊገባ ይችላል፤ የግሪኩ ቅጽ ግን ‘ምስል’ ወይም ‘ድንጋይ’ ብሎ በግልጽ አይናገርም። ስለዚህ አሻሚነቱ በማስታወሻ ተገልጧል።
