base_translation:
  language: en
  yaml_path: translation/nt/acts/019/017.yaml
  text: And this became known to all the Jews and Greeks living in Ephesus[a], and fear fell upon them all[b], and the name of the Lord Jesus was being magnified.
translation:
  language: am
  text: ይህም ነገር በኤፌሶን ለሚኖሩ አይሁድና ግሪኮች ሁሉ ታወቀ። ፍርሃትም በሁሉም ላይ ወደቀ[a]፤ የጌታ ኢየሱስም ስም እየተከበረ ነበር[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ፍርሃትም ሁሉንም ያዛቸው።»
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «የጌታ ኢየሱስ ስም ከፍ ይል ነበር» ወይም «በታላቅ ክብር ይያዝ ነበር።»
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: ይህም ነገር
  rationale: ነጠላው አመልካች ተውላጠ ስም ቀደም ሲል የተከሰተውን ሙሉ ክስተት ያመለክታል፤ «ይህም ነገር» በአማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: ἐγένετο γνωστὸν
  choice: ታወቀ
  rationale: የግሪኩን ‘የታወቀ ሆነ’ የሚለውን መጀመርያዊ ለውጥ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: πᾶσιν Ἰουδαίοις τε καὶ Ἕλλησιν
  choice: ለአይሁድና ግሪኮች ሁሉ
  rationale: የግሪኩ ተቀባይ አገባብ ይህ ነገር ለማን እንደታወቀ ያሳያል፤ «ሁሉ»ም ሁለቱን ቡድኖች ያጠቃልላል።
- source_word: τοῖς κατοικοῦσιν τὴν Ἔφεσον
  choice: በኤፌሶን ለሚኖሩ
  rationale: κατοικέω በአንድ ስፍራ መኖርን ይገልጣል፤ ሐረጉም አይሁድንና ግሪኮችን በአንድነት ይገድባል።
- source_word: ἐπέπεσεν φόβος ἐπὶ πάντας αὐτούς
  choice: ፍርሃትም በሁላቸው ላይ ወደቀ
  rationale: የግሪኩን ግልጽ ‘መውደቅ’ ምስል ይጠብቃል፤ የአማርኛ አንባቢም በቀላሉ ሊረዳው ይችላል።
- source_word: φόβος
  choice: ፍርሃት
  rationale: ቃሉ ፍርሃትን፣ ድንጋጤን ወይም ግርማ የተቀላቀለበትን አክብሮት ሊያመለክት ይችላል፤ «ፍርሃት» ከሁሉ የሰፋና በትንሹ የሚተረጉም ምርጫ ነው።
- source_word: ἐμεγαλύνετο
  choice: ከፍ ከፍ ይል ነበር
  rationale: የግሪኩን የማግነን ምስልና ያልተቋረጠውን የኢምፐርፌክት ገጽታ ይጠብቃል፤ በአማርኛም ክብርና ከፍ ያለ ዝና ማግኘትን ያሳያል።
- source_word: τὸ ὄνομα
  choice: ስም
  rationale: «ስም» በዚህ አገባብ ዝናን፣ ሥልጣንንና ክብርን ሊያካትት ቢችልም የምንጩን ቃልና መጽሐፍ ቅዱሳዊ ክብደት በቀጥታ ይጠብቃል።
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: የጌታ ኢየሱስ
  rationale: κύριος ለኢየሱስ የተሰጠ ማዕረግ ስለሆነ «ጌታ» ተብሎ ተተርጉሟል፤ የአማርኛው የባለቤትነት አወቃቀርም «ስም»ን ከ«ጌታ ኢየሱስ» ጋር ያያይዛል።
theological_decisions:
- issue: κύριος ለኢየሱስ ሲጠቀስ እንዴት እንደሚተረጎም
  choice: ጌታ
  alternative: መምህር / ባለቤት
  rationale: በዚህ አውድ κύριος የክርስቶሳዊ ማዕረግ ሆኖ የቀረበ ስለሆነ «ጌታ» ማለት የምንጩን ክብደት ይጠብቃል።
- issue: τὸ ὄνομα በቀጥታ ‘ስም’ ወይስ በፍቺ ‘ዝና’ ተብሎ መተርጎም
  choice: የጌታ ኢየሱስ ስም
  alternative: የጌታ ኢየሱስ ዝና
  rationale: «ስም» የሚለውን ማቆየት የሰውየውን ማንነት፣ ሥልጣንና ክብር አብሮ የሚይዘውን መጽሐፍ ቅዱሳዊ ስፋት ይጠብቃል።
- issue: φόβος ፍርሃትን ብቻ ወይስ የግርማ አክብሮትን ያመለክታል
  choice: ፍርሃት
  alternative: ግርማ የተቀላቀለበት አክብሮት / ድንጋጤ
  rationale: በቀደመው ክስተት ምክንያት እውነተኛ ፍርሃት መኖሩ ግልጽ ሲሆን፣ ቃሉ የግርማ ስሜትንም ሊይዝ ይችላል። «ፍርሃት» ይህን ውጥረት ሳይዘጋ ያቆያል።
