  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «በላያቸው ወደቀ» እና «ከፍ ከፍ ይል ነበር» የምንጩን ምስላዊነት የሚጠብቁ መጽሐፍ ቅዱሳዊ ሆኖም ለዘመናዊ አንባቢ የሚገቡ አገላለጾች ናቸው።
