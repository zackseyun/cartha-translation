base_translation:
  language: en
  yaml_path: translation/nt/acts/019/032.yaml
  text: So then some were shouting one thing and some another[a], for the assembly was in confusion, and most of them did not know why they had come together.
translation:
  language: am
  text: ስለዚህ አንዳንዶቹ አንድ ነገር፣ ሌሎቹም ሌላ ነገር ይጮኹ ነበር፤ ጉባኤው[a] ውዥንብር ውስጥ ነበርና፣ አብዛኛዎቹም ለምን እንደተሰበሰቡ አያውቁም ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም «ስብሰባው» ወይም «ሕዝቡ»። የግሪኩ ቃል ἐκκλησία ነው፤ እዚህ ላይ የተጠቀሰው ለከተማዊ ጉባኤ እንጂ ለቤተ ክርስቲያን አይደለም።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι μὲν οὖν ἄλλο τι ἔκραζον
  choice: ስለዚህ አንዳንዶቹ አንድ ነገር፣ ሌሎቹም ሌላ ነገር ይጮኹ ነበር
  rationale: የἄλλοι ... ἄλλο τιን ተከፋፋይ ንጽጽር በተፈጥሯዊ አማርኛ ያሳያል፤ የἔκραζον ኢምፐርፌክት ገጽታም በ«ይጮኹ ነበር» እንደቀጠለ ድርጊት ተጠብቋል።
- source_word: ἐκκλησία
  choice: ጉባኤ
  rationale: በዚህ የከተማ ሕዝባዊ ስብሰባ አውድ ቃሉ የተሰበሰበውን ጉባኤ ያመለክታል እንጂ የክርስቲያኖችን ቤተ ክርስቲያን አይደለም።
- source_word: συγκεχυμένη
  choice: ግራ ተጋብቶ
  rationale: የσυγχέω ፍጹም ተሳቢ ቅርጽ የተፈጠረን የውዥንብርና የግራ መጋባት ሁኔታ ያሳያል።
- source_word: οἱ πλείους
  choice: ከእነርሱም አብዛኞቹ
  rationale: በጉባኤው ውስጥ የነበሩትን አብዛኛዎቹን በግልጽ ያመለክታል።
- source_word: τίνος ἕνεκα
  choice: ለምን
  rationale: «በምን ምክንያት» የሚለውን ፈሊጣዊ ትርጉም በአጭርና ተፈጥሯዊ አማርኛ ይሰጣል።
- source_word: συνεληλύθεισαν
  choice: እንደተሰበሰቡ
  rationale: የσυνέρχομαι ፕሉፐርፌክት ከትረካው ጊዜ በፊት ተሰብስበው መገኘታቸውን ያሳያል፤ በአማርኛ አውዱ ይህ ቅድመ ሁኔታ በተፈጥሯዊ መንገድ ተገልጧል።
