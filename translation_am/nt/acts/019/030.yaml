lexical_decisions:
- source_word: Παύλου δὲ
  choice: ጳውሎስ ግን
  rationale: δέ ከቀደመው ትረካ ጋር ያለውን ቀላል ተቃርኖ ወይም የትረካ ሽግግር ለማሳየት ‘ግን’ ተመርጧል። ጳውሎስ የΠαῦλος የተለመደ የአማርኛ አጻጻፍ ነው።
- source_word: βουλομένου
  choice: ሊገባ በፈለገ ጊዜ
  rationale: የግሪኩን የፍላጎትና የዓላማ ሐሳብ በተፈጥሯዊ የአማርኛ ጊዜያዊ አገላለጽ ያቀርባል።
- source_word: εἰσελθεῖν
  choice: ሊገባ
  rationale: ወደ ተሰበሰበው ሕዝብ መግባትን በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: εἰς τὸν δῆμον
  choice: ወደ ሕዝቡ ጉባኤ
  rationale: δῆμος በዚህ የኤፌሶን ማኅበረሰባዊና ሲቪክ አውድ የተሰበሰበውን ሕዝብ ወይም ሕዝባዊ ጉባኤ ሊያመለክት ይችላል፤ ‘የሕዝቡ ጉባኤ’ ሁለቱንም ገጽታዎች ያቆያል።
- source_word: οὐκ εἴων αὐτὸν
  choice: አልፈቀዱለትም
  rationale: የኢምፐርፌክት ግሱን ቀጣይ እምቢታና መከልከል በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: οἱ μαθηταί
  choice: ደቀ መዛሙርቱ
  rationale: μαθηταί ማለት ተከታዮችና ተማሪዎች የሆኑትን ‘ደቀ መዛሙርት’ ያመለክታል፤ የአማርኛው የወሰን ቅጥያ በዚህ የታወቀውን ቡድን ይጠቁማል እንጂ የጳውሎስ ንብረት መሆናቸውን አይጨምርም።
