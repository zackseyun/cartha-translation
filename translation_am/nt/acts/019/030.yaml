  rationale: The revision replaces an awkward compound expression with the idiomatic «ወደ ጉባኤው», while the footnote preserves δῆμος’s possible sense of the gathered crowd. It also makes the object of the disciples’ refusal explicit in natural Amharic without adding meaning.
