  text: ጳውሎስ ግን ወደ ጉባኤው[a] ለመግባት ሲፈልግ፣ ደቀ መዛሙርቱ እንዲገባ አልፈቀዱለትም።
  philosophy: optimal-equivalence
  footnotes:
