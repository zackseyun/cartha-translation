  language: am
  text: ከእስያርኮች[a]ም መካከል የእርሱ ወዳጆች የነበሩ አንዳንዶች መልእክት ልከውለት[b]፣ ወደ ቲያትር ስፍራው እንዳይገባ[c] አጥብቀው ይለምኑት ነበር።
