- issue: πείθων የተሳካ ማሳመንን ወይም ለማሳመን መጣርን ሊያመለክት መቻሉ
  choice: በዋናው ጽሑፍ “ያሳምናቸውም ነበር”
  alternative: “ሊያሳምናቸውም ይሞክር ነበር”
  rationale: ዋናው ንባብ የግሪኩን ቀጥተኛ ኃይል ይጠብቃል፤ ነገር ግን ቃሉ የማሳመን ጥረትንም ሊገልጽ ስለሚችል አማራጩ በእግር ማስታወሻ ተቀምጧል።
- issue: βασιλεία τοῦ θεοῦ እንደ “መንግሥት” ወይም “አገዛዝ” መተርጎም
  choice: የእግዚአብሔር መንግሥት
  alternative: የእግዚአብሔር አገዛዝ
  rationale: βασιλεία አገዛዝንም ሊያመለክት ቢችልም፣ “የእግዚአብሔር መንግሥት” ትክክለኛ፣ የታወቀና በአዲስ ኪዳን ቁልፍ ሐረግነቱን የሚጠብቅ ነው።
