  text: And entering the synagogue[a], he spoke boldly for three months[b], reasoning and persuading them about the kingdom of God.
translation:
  language: am
  text: ወደ ምኩራብም ገብቶ ለሦስት ወራት በድፍረት ይናገር ነበር፤ ስለ እግዚአብሔር መንግሥት እየተወያየና እያሳመናቸው ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰσελθὼν
  choice: ገብቶ
  rationale: የግሪኩ የአኦሪስት አሳታፊ ቅርጽ ከዋናው ድርጊት በፊት የሆነውን ሁኔታ ያሳያል፤ “ገብቶ” ይህን ግንኙነት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: δὲ
  choice: ም
  rationale: ይህ ቀላል የትረካ ማያያዣ ስለሆነ፣ ከ“ምኩራብ” ጋር የተያያዘው “ም” በአማርኛ ተፈጥሯዊ ነው።
- source_word: συναγωγήν
  choice: ምኩራብ
  rationale: ቃሉ በትክክል የአይሁድን የጸሎትና የማስተማሪያ ስፍራ ያመለክታል፤ “ምኩራብ” የታወቀውና ትክክለኛው የአማርኛ ቃል ነው።
- source_word: ἐπαρρησιάζετο
  choice: በድፍረት ይናገር ነበር
  rationale: ያልተቋረጠውን የኢምፐርፌክት ገጽታ እና በግልጽነትና በድፍረት የመናገርን ትርጉም ያስተላልፋል።
- source_word: ἐπὶ μῆνας τρεῖς
  choice: ለሦስት ወር
  rationale: ἐπί ከአኩዛቲቭ ጋር የጊዜ ቆይታን ያሳያል፤ “ለሦስት ወር” ተፈጥሯዊና ግልጽ ነው።
- source_word: διαλεγόμενος
  choice: እየተወያየ
  rationale: ቃሉ ሐሳብን በማብራራትና በማስረጃ በማቅረብ የሚደረግ ውይይትን ያመለክታል፤ “እየተወያየ” የንግግሩን ተግባቦታዊ ባሕርይ ይጠብቃል።
- source_word: πείθων
  choice: ያሳምናቸውም ነበር
  rationale: ቃሉ ሌሎችን በክርክርና በማብራሪያ ወደ አንድ እምነት ማምጣትን ወይም ለማሳመን መጣርን ሊያመለክት ይችላል። ዋናው ጽሑፍ ቀጥተኛውን አቻ ይጠቀማል፤ የጥረት ንባቡ በማስታወሻ ቀርቧል።
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: ስለ እግዚአብሔር መንግሥት
  rationale: περί ከጄኒቲቭ ጋር “ስለ” የሚል ትርጉም አለው፤ “የእግዚአብሔር መንግሥት” ቁልፉን የአዲስ ኪዳን ሐረግ በሚታወቀው መልኩ ይጠብቃል።
theological_decisions:
- issue: የπείθων ተሳቢ በግሪክ በግልጽ አልተጻፈም
  choice: “እነርሱን” የሚወክለውን “-አቸው” በግስ ውስጥ ማካተት
