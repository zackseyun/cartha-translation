- source_word: εἰς τὴν Μακεδονίαν
  choice: ወደ መቄዶንያ
  rationale: ወደ ክልሉ የሚደረገውን እንቅስቃሴ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: δύο τῶν διακονούντων αὐτῷ
  choice: ከሚያገለግሉት ሁለቱን
  rationale: διακονέω የአገልግሎትን ሐሳብ ይይዛል፤ ይህ አተረጓጎም የተወሰነ ሹመት ወይም ማዕረግ ሳይጨምር የግሪኩን ግንባታ ይጠብቃል።
- source_word: Τιμόθεον καὶ Ἔραστον
