base_translation:
  language: en
  yaml_path: translation/nt/acts/019/022.yaml
  text: So after sending into Macedonia two of those who were ministering to him—Timothy and Erastus—he himself stayed for a time in Asia[a].
translation:
  language: am
  text: ከዚያም ለእርሱ ከሚያገለግሉ ሁለት ሰዎች፣ ጢሞቴዎስንና ኤራስጦስን፣ ወደ መቄዶንያ ከላከ በኋላ፣ እርሱ ራሱ ለጥቂት ጊዜ በእስያ[a] ቆየ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይህ በምዕራባዊ ትንሽ እስያ የነበረችውን የሮም ግዛት እስያ ያመለክታል፤ የዛሬውን የእስያ አህጉር አይደለም።
    reason: cultural_note
lexical_decisions:
- source_word: ἀποστείλας
  choice: ከላካቸው በኋላ
  rationale: የተሳቢው የአኦሪስት ግስ ከዋናው ግስ በፊት የተፈጸመ ድርጊትን ስለሚያመለክት፣ የድርጊቶቹን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: δὲ
