  text: ἠγάγετε γὰρ τοὺς ἄνδρας τούτους οὔτε ἱεροσύλους οὔτε βλασφημοῦντας τὴν θεὸν ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/037.yaml
  text: For you have brought these men here who are neither temple robbers nor blasphemers of our goddess[a].
translation:
  language: am
  text: እነዚህን ሰዎች ወደዚህ አምጥታችኋልና፤ እነርሱ ቤተ መቅደስ የዘረፉም ሆነ አምላካችንን[a] የተሳደቡ አይደሉም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በዚህ አውድ “አምላካችን” የሚለው የኤፌሶንን አርጤምስ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγάγετε
  choice: ወደዚህ አምጥታችኋል
  rationale: የተፈጸመውንና በዚያ ጉባኤ ወቅት አሁናዊ ጠቀሜታ ያለውን ድርጊት በተፈጥሯዊ አማርኛ ያሳያል፤ ‘ወደዚህ’ የንግግሩን ስፍራ ግልጽ ያደርጋል።
- source_word: γὰρ
  choice: -ና
  rationale: የቀደመውን ንግግር የሚደግፍ ምክንያት መሆኑን በተፈጥሯዊ የአማርኛ አያያዥ ያሳያል።
- source_word: τοὺς ἄνδρας τούτους
  choice: እነዚህን ሰዎች
  rationale: በሕዝብ ፊት ያሉትን የተወሰኑ ወንዶች የሚያመለክተውን ጠቋሚ ኃይል ይጠብቃል፤ ‘ሰዎች’ በዚህ አውድ ተፈጥሯዊ ነው።
- source_word: οὔτε ... οὔτε
  choice: ወይም ... አይደሉም
  rationale: ሁለቱንም ክሶች የሚክደውን የግሪኩን ተዛማጅ አሉታዊ አወቃቀር በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἱεροσύλους
  choice: ቤተ መቅደስ የዘረፉ
  rationale: ቃሉ በቀጥታ ቅዱስ ስፍራን ወይም ንብረቱን የሚዘርፉ ሰዎችን ያመለክታል፤ ይህ አገላለጽ ከአጠቃላይ ‘ቅድስናን የደፈሩ’ ይበልጥ ግልጽ ነው።
- source_word: βλασφημοῦντας
  choice: የተሳደቡ
  rationale: በአምላክ ላይ የሚነገርን የስድብና የነቀፋ ንግግር በዘመናዊና ቀላል አማርኛ ያስተላልፋል።
- source_word: τὴν θεὸν ἡμῶν
  choice: አምላካችንን
  rationale: የግሪኩን ‘አምላካችንን’ ቅርጽና የተናጋሪውን አመለካከት ይጠብቃል፤ በአውዱ የሚጠቀሰው አርጤምስ መሆኑ በማስታወሻ ተገልጿል።
theological_decisions:
- issue: τὴν θεὸν ἡμῶν ለአርጤምስ ሲጠቀስ እንዴት መተርጎም እንዳለበት
  choice: አምላካችንን
  alternative: እንስት አምላካችንን / አርጤምስን
  rationale: ‘አምላካችን’ የሚለው የግሪክን ቃላዊ ቅርጽ እና የኤፌሶን ባለሥልጣን ንግግር ያስቀምጣል። በአማርኛ ‘አምላክ’ ለሴት አምላክም በአውድ ሊያገለግል ስለሚችል፣ ጾታዋን በዋናው ጽሑፍ በግድ ማብራራት አያስፈልግም፤ ማስታወሻው ማጣቀሻው አርጤምስ መሆኑን ያሳያል። ይህ የተናጋሪውን አረማዊ እይታ የሚወክል እንጂ ሥነ መለኮታዊ ድጋፍ አይደለም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። የሕዝባዊ ጉባኤውን ንግግራዊ ቅርጽ ይጠብቃል፤ ከመጠን በላይ ቤተ ክርስቲያናዊ ቃላትን አይጭንም።
