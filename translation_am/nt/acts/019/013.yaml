  text: ἐπεχείρησαν δέ τινες ⸀καὶ τῶν περιερχομένων Ἰουδαίων ἐξορκιστῶν ὀνομάζειν ἐπὶ τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρὰ τὸ ὄνομα τοῦ κυρίου Ἰησοῦ λέγοντες· ⸀Ὁρκίζω ὑμᾶς τὸν Ἰησοῦν ⸀ὃν Παῦλος κηρύσσει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/013.yaml
  text: But some also of the itinerant Jewish exorcists attempted to invoke the name of the Lord Jesus over those who had evil spirits[a], saying, “I adjure you by Jesus[d][c][b], whom Paul proclaims.”
translation:
  language: am
  text: ነገር ግን ከየቦታው እየዞሩ አጋንንትን ከሚያስወጡ አይሁድ መካከል አንዳንዶቹም፣ ክፉ መናፍስት ባሉባቸው ሰዎች ላይ የጌታ ኢየሱስን ስም ለመጥራት ሞከሩ፤ “ጳውሎስ በሚሰብከው በኢየሱስ አምላችኋለሁ[a]” አሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ጳውሎስ በሚሰብከው በኢየሱስ በመሐላ አስገድዳችኋለሁ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεχείρησαν
  choice: ለመጥራት ሞከሩ
  rationale: ግሱ አንድን ተግባር ለማድረግ መሞከርን ወይም መነሳትን ያመለክታል፤ “ሞከሩ” የተግባሩን ውጤት አስቀድሞ ሳይወስን ትርጉሙን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τινες καὶ τῶν περιερχομένων Ἰουδαίων ἐξορκιστῶν
  choice: ከየቦታው እየዞሩ አጋንንትን ከሚያስወጡ አይሁድ መካከል አንዳንዶቹም
  rationale: περιερχομένων ከቦታ ወደ ቦታ መዞርን፣ ἐξορκιστῶν ደግሞ አጋንንትን ለማስወጣት የሚሠሩ ሰዎችን ያመለክታል። ትርጉሙ ለዘመናዊ አንባቢ ግልጽ እንዲሆን ገላጭ ሐረግ ተጠቅሟል።
- source_word: ὀνομάζειν ἐπὶ ... τὸ ὄνομα
  choice: ሰዎች ላይ ... ስም ለመጥራት
  rationale: በዚህ ዐውድ ሐረጉ ስምን ዝም ብሎ መጥቀስ ሳይሆን በሰዎቹ ላይ በሥልጣን መጥራትን ያመለክታል። “ስምን መጥራት” ይህን ኃይማኖታዊ አገባብ በአማርኛ ይጠብቃል።
- source_word: τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρά
  choice: ክፉ መናፍስት ባሉባቸው ሰዎች
  rationale: የግሪኩን “ክፉ መናፍስት ያሉባቸው” የሚለውን አነጋገር በቅርብ ይጠብቃል፤ “በአጋንንት የተያዙ” የሚለውን ከምንጩ ይበልጥ ጠንካራ ትርጓሜ አላስገባም።
- source_word: τὸ ὄνομα τοῦ κυρίου Ἰησοῦ
  choice: የጌታን የኢየሱስን ስም
  rationale: κύριος በክርስቶሳዊው ሐረግ “ጌታ” ተብሎ ተተርጉሟል፤ ድርብ የባለቤትነት ምልክቱም በአማርኛ ሐረጉን ግልጽ ያደርገዋል።
- source_word: Ὁρκίζω ὑμᾶς
  choice: አምላችኋለሁ
  rationale: ὁρκίζω በዚህ ዐውድ በመሐላ ማስገደድን ወይም በከባድ ቃል ማዘዝን ያመለክታል። “አምላችኋለሁ” መደበኛ እና የተከበረ የአማርኛ አቻ ነው።
- source_word: τὸν Ἰησοῦν ὃν Παῦλος κηρύσσει
  choice: ጳውሎስ በሚሰብከው በኢየሱስ
  rationale: ከὁρκίζω ጋር ያለው ተሳቢ ኢየሱስን የመሐላው መሠረት አድርጎ ያቀርባል፤ κηρύσσει የሕዝብ ፊት ማወጅን ያመለክታል፣ “ይሰብካል”ም በዚህ ዐውድ ተፈጥሯዊ ነው።
theological_decisions:
- issue: በτοῦ κυρίου Ἰησοῦ ውስጥ κύριοςን መተርጎም
  choice: ጌታ
  alternative: መምህር / ባለቤት
  rationale: በሐዋርያት ሥራ ውስጥ “ጌታ ኢየሱስ” የክብርና የክርስቶሳዊ ክብደት ያለው መጠሪያ ነው፤ “ጌታ” ይህን ሁለቱንም ይጠብቃል።
- issue: τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρά የአጋንንት መያዝን በግልጽ እንዲናገር ማድረግ ወይም የምንጩን አገላለጽ መጠበቅ
  choice: ክፉ መናፍስት ባሉባቸው ሰዎች
  alternative: በክፉ መናፍስት የተያዙ ሰዎች
  rationale: ምንጩ ቃል በቃል “ክፉ መናፍስት ያሉባቸው” ይላል። ዐውዱ መያዝን ሊያመለክት ቢችልም፣ ዋናው ጽሑፍ ከምንጩ ይልቅ የጠነከረ መግለጫ አያስገባም።
- issue: የአስወጪዎቹ ንግግር ትእዛዝ ነው ወይስ መሐላዊ ማስገደድ
  choice: አምላችኋለሁ
  alternative: አዛችኋለሁ
  rationale: ὁρκίζω መሐላን በግልጽ ይዟል፤ ቀላል “አዛችኋለሁ” ይህን ክፍል ያጣል። ትርጉሙ አስወጪዎቹ የተጠቀሙበትን ቀመራዊ ንግግር ያሳያል እንጂ የድርጊታቸውን ትክክለኛነት አያረጋግጥም።
