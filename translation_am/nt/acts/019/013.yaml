  register: ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛ ተጠቅሟል። “አጋንንትን ከሚያስወጡ” የሚለው ገላጭ ሐረግ ከብዙ አንባቢዎች ዘንድ እንግዳ ሊሆን ከሚችለው ቴክኒካዊ ስያሜ ይልቅ ተመርጧል። የጥቅሱ ንግግር የመሐላ ክብደት እንዲኖረው “አምላችኋለሁ” ተጠቅሟል።
