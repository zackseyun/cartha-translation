  text: So the word of the Lord was growing mightily and prevailing[a].
translation:
  language: am
  text: ስለዚህ የጌታ ቃል በኃይል እያደገና እየበረታ ሄደ[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በኃይል” የሚለው የግሪክ ሐረግ “እጅግ በኃይል” ወይም “በኃያልነት” ተብሎም ሊተረጎም ይችላል።
