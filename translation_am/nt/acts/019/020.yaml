lexical_decisions:
- source_word: οὕτως
  choice: ስለዚህ
  rationale: ከቀደሙት ክስተቶች የተገኘውን ውጤት በተፈጥሯዊ ዘመናዊ አማርኛ ያመለክታል። “በዚህ ሁኔታ” የሚለውም ይቻላል፣ ነገር ግን እዚህ ያለውን ውጤታዊ ግንኙነት “ስለዚህ” በግልጽ ያሳያል።
- source_word: κατὰ κράτος
  choice: በኃይል
  rationale: ሐረጉ ታላቅ ኃይልንና ውጤታማ ተጽእኖን የሚገልጽ ፈሊጣዊ አገላለጽ ነው። “በኃይል” የκράτοςን የኃይል ሐሳብ ጠብቆ ለሁለቱም ግሶች ተፈጥሯዊ ተውሳክ ሆኖ ይሠራል።
- source_word: τοῦ κυρίου
  choice: የጌታ
  rationale: κύριος የሚለውን ማዕረግ በቀጥታ ያስተላልፋል፤ በዋናው ጽሑፍ ውስጥ ስሙን “ኢየሱስ” በማከል ከግሪኩ የበለጠ አይገልጽም።
- source_word: ὁ λόγος
  choice: ቃል
  rationale: በዚህ አውድ የተሰበከውን መልእክት ያመለክታል፤ “ቃል” ግን በሐዋርያት ሥራ የሚደጋገመውን የሉቃስ አገላለጽ ጠብቆ ያቀርባል።
- source_word: ηὔξανεν
  choice: እያደገ … ሄደ
  rationale: የግሪኩ ያልተጠናቀቀ የግስ መልክ ቀጣይና እየጨመረ የሄደ እንቅስቃሴን ያሳያል፤ የአማርኛው “እያደገ … ሄደ” ይህን በተፈጥሯዊ ሁኔታ ይገልጻል።
- source_word: ἴσχυεν
  choice: እየበረታ
  rationale: ግሱ ብርታት ማግኘትን፣ ኃይለኛ መሆንን ወይም የበላይ መሆንን ሊያመለክት ይችላል። “እየበረታ” መሠረታዊውን የግሱን ሐሳብ ጠብቆ የቃሉን ውጤታማ መስፋፋት ያሳያል።
theological_decisions:
- issue: በτοῦ κυρίου ውስጥ “ጌታ” የሚለው ማንን እንደሚያመለክት
  choice: በዋናው ጽሑፍ “የጌታ” ብቻ ተብሎ ተተርጉሟል።
  alternative: “የጌታ ኢየሱስ”
  rationale: የሐዋርያት ሥራ አውድ ጌታ ኢየሱስን እንደሚያመለክት በጽኑ ይጠቁማል፤ የግሪኩ ጽሑፍ ግን “የጌታ” ብቻ ስለሚል ትርጉሙ ስሙን በዋናው ጽሑፍ አልጨመረም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። “እያደገና እየበረታ ሄደ” የሚለው አወቃቀር የሁለቱን የግሪክ ግሶች ቀጣይ እንቅስቃሴ በተፈጥሯዊ አማርኛ ያቀርባል።
