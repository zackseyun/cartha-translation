base_translation:
  language: en
  yaml_path: translation/nt/acts/019/033.yaml
  text: And from the crowd they brought forward Alexander[a], since the Jews had pushed him forward; and Alexander, motioning with his hand[b], wanted to make a defense to the assembly.
translation:
  language: am
  text: አይሁድ እርሱን ወደ ፊት ገፍተው ስላቀረቡት፣ ከሕዝቡ መካከል እስክንድርን ወደ ፊት አመጡት።[a] እስክንድርም በእጁ ምልክት አድርጎ፣ ለተሰበሰበው ሕዝብ[b] የመከላከያ ንግግር ሊያደርግ ፈለገ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እስክንድርን ወደ ፊት አቀረቡት፤ አይሁድም እርሱን ወደ ፊት አቅርበው ነበር።» ግሪኩ እስክንድርን በሕዝብ ፊት ስለማቅረብ ሁለት ተዛማጅ ግሶችን ይጠቀማል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «ለሕዝቡ።» እዚህ ያለው ቃል የተሰበሰበውን ሕዝብ ወይም የከተማውን ሕዝብ ሊያመለክት ይችላል፤ በቁጥሩ መጀመሪያ ላይ «ሕዝብ» ተብሎ ከተተረጎመው ቃል የተለየ ነው።
    reason: lexical_alternative
