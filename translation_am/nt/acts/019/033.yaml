    issue: «መከራከሪያውን ሊያቀርብ» for ἤθελεν ἀπολογεῖσθαι
    rationale: This means roughly ‘wanted to present his argument/case’ and introduces a possessive object absent from the Greek. The Greek states that he wanted to make a defense.
