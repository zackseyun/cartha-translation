  rationale: የአሁኑን የሕዝብ ምስክርነት የሚያጎላውን ድርብ ጥሪ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: οὐ μόνον Ἐφέσου ἀλλὰ σχεδὸν πάσης τῆς Ἀσίας
  choice: በኤፌሶን ብቻ ሳይሆን በመላው እስያ ማለት ይቻላል
