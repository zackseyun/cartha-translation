base_translation:
  language: en
  yaml_path: translation/nt/acts/019/026.yaml
  text: And you see and hear that not only in Ephesus but in almost all of Asia[a], this Paul has persuaded and turned away a considerable crowd[b], saying that gods made by hands are not gods.
translation:
  language: am
  text: 'እናንተም እያያችሁና እየሰማችሁ ነው፤ ይህ ጳውሎስ፣ “በሰው እጅ የሚሠሩት አማልክት አይደሉም”[b] እያለ፣ በኤፌሶን ብቻ ሳይሆን በእስያ[a] ሁሉ ማለት በሚቻል መጠን ብዙ ሕዝብን አሳምኖ አስለውጧል።


    [a] እዚህ “እስያ” የሚለው የዛሬውን የእስያ አህጉር ሳይሆን፣ በዛሬዋ ምዕራባዊ ቱርክ የነበረውን የሮም ግዛት ያመለክታል።


    [b] ቃል በቃል፣ “በእጆች የሚፈጠሩት”፤ ይህም በሰው እጅ የተሠሩ ጣዖታትን ያመለክታል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: እዚህ “እስያ” የሚለው የዛሬውን የእስያ አህጉር ሳይሆን፣ በዛሬዋ ምዕራባዊ ቱርክ የነበረውን የሮም ግዛት ያመለክታል።
    reason: cultural_note
  - marker: b
    text: ቃል በቃል፣ “በእጆች የሚፈጠሩት”፤ ይህም በሰው እጅ የተሠሩ ጣዖታትን ያመለክታል።
    reason: cultural_note
