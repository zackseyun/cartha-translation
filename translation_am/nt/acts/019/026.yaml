  rationale: በሰው ጥበብ የተሠሩ ጣዖታት መለኮት መሆናቸውን የሚክደውን ቀጥተኛ አረፍተ ነገር ይጠብቃል።
theological_decisions:
- issue: በሰው የተሠሩ አማልክትን በተመለከተ የጳውሎስን ንግግር መተርጎም
  choice: በሰው እጅ የሚሠሩት አማልክት አይደሉም
  alternative: በእጅ የተሠሩት እውነተኛ አማልክት አይደሉም
  rationale: ግሪኩ የሰው ሠራሽ ጣዖታትን መለኮታዊነት በቀጥታ ይክዳል፤ “እውነተኛ” የሚለውን ያልተጻፈ ቃል ባለመጨመር የጽሑፉን ውጥረት ይጠብቃል።
