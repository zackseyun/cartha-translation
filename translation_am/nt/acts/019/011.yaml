  revision_rationale: The revision removes the added intensifier እጅግ and uses the more natural Amharic mediated-instrumental idiom በጳውሎስ እጅ. It preserves the Greek’s divine agency, Paul’s instrumental role, the imperfect aspect, and the emphatic contrast with ordinary miracles. The footnote retains the literal power-deed nuance without treating it as the main-text rendering.
