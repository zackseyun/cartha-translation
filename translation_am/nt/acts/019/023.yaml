    text: ወይም፣ «ስለ መንገድ።» እዚህ «መንገዱ» የክርስቲያኖችን እንቅስቃሴ ያመለክታል፤ በሐዋርያት ሥራ ተደጋግሞ የሚገኝ መጠሪያ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: ተነሣ
  rationale: ክስተቱ መከሰቱን በተፈጥሯዊ የአማርኛ አገላለጽ ያሳያል፤ ከ«ነበረ» ይልቅ የግሱን ክስተታዊ ኃይል ይጠብቃል።
- source_word: δὲ
  choice: ም
  rationale: በ«በዚያም» ላይ የተያያዘው «ም» ቀላል የትረካ ትስስርን ያሳያል፤ ጠንካራ ተቃርኖ አያስገባም።
- source_word: κατὰ τὸν καιρὸν ἐκεῖνον
  choice: በዚያ ጊዜ
  rationale: የምንጩን ጊዜያዊ ማጣቀሻ በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τάραχος
  choice: ሁከት
  rationale: የሕዝብ መናወጥንና ያልተረጋጋ ሁኔታን ይገልጣል፤ ታሪኩ ገና ሳይዘረዝር «አመፅ» የሚለውን የበለጠ የተወሰነ ፍቺ አያስገባም።
- source_word: οὐκ ὀλίγος
  choice: ትንሽ ያልሆነ
  rationale: የሉቃስን የአሉታ አገላለጽ ሳያለሰልስ «ብዙ» ወይም «ታላቅ» ብሎ ከመተርጎም ይልቅ ይጠብቃል።
- source_word: περὶ
  choice: ስለ
  rationale: የሁከቱን ጉዳይ ወይም ምክንያታዊ ትኩረት በግልጽ ዘመናዊ አማርኛ ያሳያል።
- source_word: τῆς ὁδοῦ
  choice: መንገዱ
  rationale: በሐዋርያት ሥራ ውስጥ የክርስቲያናዊውን እንቅስቃሴ የሚያመለክተውን ተደጋጋሚ መጠሪያ ቃል በቀጥታ ይጠብቃል።
theological_decisions:
- issue: τῆς ὁδοῦን እንደ እንቅስቃሴ መጠሪያ መተርጎም
  choice: መንገዱ
  alternative: መንገድ
  rationale: የተወሰነው አንቀጽና በሐዋርያት ሥራ ያለው ተደጋጋሚ አጠቃቀም ቃሉ አንድን የታወቀ እንቅስቃሴ እንደሚያመለክት ያሳያሉ። አማርኛ የእንግሊዝኛን ዓይነት የፊደል ካፒታላይዜሽን ስለሌለው ይህን ተግባር የተወሰነው «-ዱ» እና የግርጌ ማስታወሻው ይደግፋሉ።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ የትረካ አማርኛ ተጠቅሟል። «ትንሽ ያልሆነ» የሚለው ትንሽ መደበኛ ቢመስልም የምንጩን ሆን ተብሎ የተጠቀሰ የአሉታ አገላለጽ ለመጠበቅ ተመርጧል።
