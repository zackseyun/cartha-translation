language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἦσαν δέ ⸀τινος Σκευᾶ Ἰουδαίου ἀρχιερέως ἑπτὰ ⸀υἱοὶ τοῦτο ποιοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/014.yaml
  text: There were seven sons of a Jewish chief priest named Sceva doing this[a].
translation:
  language: am
  text: ይህን የሚያደርጉ ስቄዋ የተባለ አንድ አይሁዳዊ የካህናት አለቃ[a] ሰባት ወንድ ልጆች ነበሩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ሊቀ ካህናት»። የግሪኩ ቃል ብቸኛውን ሊቀ ካህናት ወይም በሰፊው የከፍተኛ ክህነት ወገን አባል የሆነን ሰው ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν δέ
  choice: ነበሩ
  rationale: የነበረን ቀጣይ ሁኔታ በተፈጥሯዊ የአማርኛ ትረካ ያቀርባል፤ δέ በዚህ ስፍራ ግልጽ ተቃርኖ ስለማያሳይ የተለየ አያያዥ ቃል አልተጨመረም።
- source_word: τινος Σκευᾶ
  choice: አስቄዋ የተባለ
  rationale: τινος ሰውየው ቀድሞ ያልታወቀ መሆኑን ያመለክታል፤ «የተባለ» ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል። ስሙም በተለመደው የአማርኛ ቅርጽ «አስቄዋ» ተጽፏል።
- source_word: Ἰουδαίου
  choice: የአይሁድ
  rationale: በዚህ አውድ ቃሉ ከመልክዓ ምድራዊ መነሻ ይልቅ የሕዝብና የሃይማኖት ማንነትን ያመለክታል።
- source_word: ἀρχιερέως
  choice: የካህናት አለቃ
  rationale: የግሪኩ ቃል አንድን ሊቀ ካህናት ወይም በሰፊው ከከፍተኛ ካህናት አንዱን ሊያመለክት ይችላል። «የካህናት አለቃ» አስቄዋ ብቸኛው ሊቀ ካህናት እንደነበረ ሳይወስን ሰፋ ያለውን ትርጉም ይጠብቃል።
- source_word: ἑπτὰ υἱοὶ
  choice: ሰባት ወንድ ልጆች
  rationale: ቁጥሩንና የዝምድናውን መጠሪያ በግልጽ ዘመናዊ አማርኛ ያቀርባል።
- source_word: τοῦτο ποιοῦντες
  choice: ይህን የሚያደርጉ
  rationale: ነጠላውን አመልካች τοῦτο እና ቀጣይ ተግባርን የሚገልጸውን አሁናዊ አጋር ግስ በቀጥታ ያስተላልፋል፤ ድርጊቱ ከቀደመው አውድ ይታወቃል።
theological_decisions:
- issue: ἀρχιερεύς አስቄዋን በሚመለከት ያለው ትርጉም
  choice: የካህናት አለቃ
  alternative: ሊቀ ካህናት
  rationale: ቃሉ ብቸኛውን ሊቀ ካህናት ሊያመለክት ቢችልም፣ ከከፍተኛ የክህነት ወገን የሆነን ሰውም ሊያመለክት ይችላል። አስቄዋ የኢየሩሳሌም ብቸኛ ሊቀ ካህናት እንደነበረ ሌላ ማስረጃ ስለሌለ፣ ዋናው ጽሑፍ ይህን ሳይወስን ሰፋ ያለውን አገላለጽ ይጠቀማል፤ ሌላው አማራጭ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለው አማርኛ ይጠቀማል። የአረፍተ ነገሩ ቅደም ተከተል በአማርኛ ተፈጥሯዊ እንዲሆን ተስተካክሏል፤ በἀρχιερεύς ያለው እውነተኛ የትርጉም ስፋት በዋናው ጽሑፍና በማስታወሻው ተጠብቋል።
