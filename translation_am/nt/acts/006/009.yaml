  text: But some of those from the synagogue called the Synagogue of the Freedmen[a], and of the Cyrenians and Alexandrians, and of those from Cilicia and Asia[b], stood up and began arguing with Stephen.
translation:
  language: am
  text: ነገር ግን፣ “የነፃ ሰዎች ምኩራብ”[a] ተብሎ ከሚጠራው ምኩራብ የነበሩት፣ ከቀሬናውያንና ከእስክንድርያውያን፣ እንዲሁም ከኪልቅያና ከእስያ[b] የመጡ አንዳንዶች ተነሥተው ከእስጢፋኖስ ጋር መከራከር ጀመሩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪክኛው ቃል ከባርነት ነፃ የወጡ ሰዎችን፣ ምናልባትም እነርሱን ወይም ዘሮቻቸውን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: እዚህ ላይ “እስያ” ማለት በምዕራባዊ ትንሿ እስያ የነበረው የሮም ግዛት እንጂ በዘመናችን እስያ የምንለው አህጉር አይደለም።
    reason: cultural_note
