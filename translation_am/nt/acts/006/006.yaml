lexical_decisions:
- source_word: οὓς
  choice: እነዚህን
  rationale: አንጻራዊው ተውላጠ ስም በቀደመው ቁጥር የተጠቀሱትን ሰባቱን ያመለክታል፤ «እነዚህን» ይህን ተያያዥነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἔστησαν
  choice: አቆሙአቸው
  rationale: ἵστημι እዚህ በአስደራጊ ትርጉም ‘እንዲቆሙ አደረጉ’ የሚል ነው፤ ከ«በ...ፊት» ጋር ሲጣመር ለማቅረብም የሚጠቅም ተፈጥሯዊ አገላለጽ ነው።
- source_word: ἐνώπιον τῶν ἀποστόλων
  choice: በሐዋርያት ፊት
  rationale: የሐዋርያትን መገኘትና በእነርሱ ፊት መቅረብን በአጭርና በተለመደ አማርኛ ይገልጣል።
- source_word: προσευξάμενοι
  choice: ከጸለዩም በኋላ
  rationale: የአኦሪስት አጋዥ ግሱ ጸሎቱ እጅ ከመጫናቸው በፊት መፈጸሙን ያመለክታል።
- source_word: ἐπέθηκαν αὐτοῖς τὰς χεῖρας
  choice: እጆቻቸውን ጫኑባቸው
  rationale: የግሪኩን አካላዊና ሥርዓታዊ ድርጊት በተለመደው የአማርኛ አገላለጽ ይይዛል፤ ከዚያ በላይ ያለውን ቤተ ክርስቲያናዊ ትርጉም አይወስንም።
theological_decisions:
- issue: የእጅ መጫኑ ትርጉም
  choice: «እጆቻቸውን ጫኑባቸው» ተብሎ ድርጊቱ ብቻ ተገለጸ
  alternative: «ሾሟቸው» ወይም «ለአገልግሎት መደቧቸው»
  rationale: የግሪኩ ጽሑፍ ድርጊቱን ይጠራል እንጂ እዚህ ላይ ሙሉውን ቤተ ክርስቲያናዊ ትርጉሙን አይወስንም፤ ስለዚህ ትርጉሙ የአንድን ቤተ እምነት አቋም አያስገባም።
- issue: የጸሎቱና የእጅ መጫኑ ፈጻሚ
  choice: በዐውደ ንባቡ መሠረት ሐዋርያት እንደሆኑ በ«እጆቻቸውን» ተንጸባርቋል
  alternative: ፈጻሚውን የማያብራራ ቃል በቃል አወቃቀር
  rationale: የግሪኩ ርዕሰ ጉዳይ በግስ ቅርጹና በዐውደ ንባቡ የሚታወቅ ሲሆን፣ ተፈጥሯዊ አማርኛ ባለቤትነቱን በዚህ መንገድ ያሳያል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «ሐዋርያት» የተለመደውን መጽሐፍ ቅዱሳዊ ስያሜ ይጠብቃል፤ ሥርዓታዊ ድርጊቱ ግን ያለ የቤተ እምነት ማብራሪያ ተተርጉሟል።
