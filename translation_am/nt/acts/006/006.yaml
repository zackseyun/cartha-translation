  text: These they set before the apostles[a], and after praying[b], they laid their hands on them.
translation:
  language: am
  text: እነዚህን በሐዋርያት ፊት አቆሟቸው፤[a] ከጸለዩም በኋላ እጆቻቸውን ጫኑባቸው።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እነዚህን ለሐዋርያት አቀረቡ።»
    reason: lexical_alternative
  - marker: b
    text: «እጆቻቸውን ጫኑባቸው» የሚለው አገላለጽ በሕዝብ ፊት ለአገልግሎት መመደብን ወይም መባረክን ሊያመለክት ይችላል፤ ግሪኩ እዚህ ድርጊቱን ይጠቅሳል እንጂ ትክክለኛውን ቤተ ክርስቲያናዊ ፍቺውን አይወስንም።
