- from: በሸንጎውም[a] የተቀመጡት ሁሉ ትኩር ብለው ባዩት ጊዜ፣ ፊቱ እንደ መልአክ ፊት ሆኖ አዩ።
  to: በሸንጎው[a] ውስጥ የተቀመጡት ሁሉ ወደ እርሱ ትኩር ብለው ሲመለከቱ፣ ፊቱ እንደ መልአክ ፊት እንደሆነ አዩ።
  rationale: 'The revision corrects the Amharic syntax and preserves each element of the Greek: all those seated in the council, their intent gaze toward Stephen, their perception of his face, and the unelaborated comparison to an angel’s face. The cultural footnote is retained with wording that matches the revised locative expression.'
  reviewer_model: gpt-5.6-terra
