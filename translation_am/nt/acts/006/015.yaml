    reason: cultural_note
  revision_rationale: 'The revision corrects the Amharic syntax and preserves each element of the Greek: all those seated in the council, their intent gaze toward Stephen, their perception of his face, and the unelaborated comparison to an angel’s face. The cultural footnote is retained with wording that matches the revised locative expression.'
