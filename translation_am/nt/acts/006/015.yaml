id: ACT.6.15
reference: Acts 6:15
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἀτενίσαντες εἰς αὐτὸν ⸀πάντες οἱ καθεζόμενοι ἐν τῷ συνεδρίῳ εἶδον τὸ πρόσωπον αὐτοῦ ὡσεὶ πρόσωπον ἀγγέλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/015.yaml
  text: And all who were sitting in the council[a], fixing their eyes on him, saw his face like the face of an angel.
translation:
  language: am
  text: በሸንጎው[a] ውስጥ የተቀመጡት ሁሉ ወደ እርሱ ትኩር ብለው ሲመለከቱ፣ ፊቱ እንደ መልአክ ፊት እንደሆነ አዩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በሳንሄድሪን ውስጥ።» የግሪክኛው ቃል የአይሁድን ገዥ ምክር ቤት ያመለክታል።
    reason: cultural_note
lexical_decisions:
- source_word: ἀτενίσαντες
  choice: ትኩር ብለው ባዩት ጊዜ
  rationale: የተራዘመና ያተኮረ እይታን በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: πάντες οἱ καθεζόμενοι
  choice: የተቀመጡት ሁሉ
  rationale: πάντες የሚያሳየውን ሙሉነትና καθεζόμενοι የሚገልጸውን የመቀመጥ ሁኔታ ይጠብቃል።
- source_word: συνεδρίῳ
  choice: ሸንጎው
  rationale: በዐውደ ንባቡ የአይሁድን ገዥ ምክር ቤት የሚያመለክት ሲሆን፣ «ሸንጎ» በአማርኛ የተለመደና ክብር ያለው አቻ ቃል ነው።
- source_word: πρόσωπον
  choice: ፊቱ / ፊት
  rationale: በዚህ ዐውደ ንባብ የስጢፋኖስን የሚታይ ፊት በቀጥታና በግልጽ ይገልጻል።
- source_word: ὡσεὶ
  choice: እንደ
  rationale: የመመሳሰል ንጽጽሩን ሳያብራራ ወይም ሳያጠብብ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἀγγέλου
  choice: መልአክ
  rationale: በትረካው ዐውድ ቃሉ ከሰው መልእክተኛ ይልቅ ሰማያዊ መልአክን ያመለክታል።
theological_decisions:
- issue: «እንደ መልአክ ፊት» የሚለው ንጽጽር ምንነት
  choice: የስጢፋኖስ ፊት ከመልአክ ፊት ጋር እንደተመሳሰለ ብቻ የሚገልጽ ንጽጽር፣ የመመሳሰሉን ልዩ ባሕርይ ሳይወስን
  alternative: በተለይ የሚያንጸባርቅ ክብርን፣ የተረጋጋ ንጽሕናን ወይም ሰማያዊ ሥልጣንን የሚያመለክት ንጽጽር
  rationale: ግሪክኛው መመሳሰልን ይገልጻል እንጂ የመመሳሰሉ ነጥብ ብርሃን፣ ጸጥታ፣ ግርማ ወይም ሌላ ባሕርይ መሆኑን አይወስንም፤ ትርጉሙም ይህን ክፍትነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው የትረካ አማርኛ ተጠቅሟል። «ትኩር ብለው» የእይታውን ጥንካሬ ያሳያል፤ «እንደ መልአክ ፊት» ደግሞ የምንጩን ያልተወሰነ ንጽጽር ይጠብቃል።
