  text: Stephen[a], full of grace and power, was doing great wonders and signs among the people.
translation:
  language: am
  text: እስጢፋኖስም ጸጋና ኃይል ሞልቶት[a] በሕዝቡ መካከል ታላላቅ ድንቅ ነገሮችንና ምልክቶችን ያደርግ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች “ጸጋና ኃይል ሞልቶት” በሚለው ፈንታ “እምነትና ኃይል ሞልቶት” ይላሉ።
    reason: textual_variant
lexical_decisions:
- source_word: δὲ
  choice: -ም
  rationale: ቀላል የትረካ ማያያዣ ነው፤ ጠንካራ ተቃርኖ ሳያመለክት በአማርኛ ተፈጥሯዊ ፍሰት ይሰጣል።
- source_word: πλήρης χάριτος καὶ δυνάμεως
  choice: ጸጋና ኃይል ሞልቶት
  rationale: πλήρης ሰውየው በእነዚህ ባሕርያት የተሞላ መሆኑን ይገልጣል፤ ይህ አተረጓጎም ተፈጥሯዊና ግልጽ ነው።
- source_word: χάριτος
  choice: ጸጋ
  rationale: የSBLGNTን χάριτος በቀጥታ ይተረጉማል፤ መለኮታዊ ሞገስንና በእስጢፋኖስ የሚሠራውን ጸጋ ሊያመለክት ይችላል።
- source_word: δυνάμεως
  choice: ኃይል
  rationale: በሐዋርያት ሥራ ተአምራዊ አገልግሎትን የሚያስችል ኃይልን ለመግለጽ ተስማሚ ነው።
- source_word: ἐποίει
  choice: ያደርግ ነበር
  rationale: የግሪኩን ያልተፈጸመ የአለፈ ጊዜ ገጽታ፣ ማለትም ቀጣይ ወይም ተደጋጋሚ ድርጊትን፣ ይጠብቃል።
- source_word: τέρατα καὶ σημεῖα
  choice: ድንቅ ነገሮችንና ምልክቶችን
  rationale: τέρατα የሚያስደንቀውን፣ σημεῖα ደግሞ የሚያመለክተውን ተግባር በተለያዩ ቃላት ያቆያል።
- source_word: μεγάλα
  choice: ታላላቅ
  rationale: ሁለቱንም ስሞች የሚገልጸውን ሰፊ ትርጉም ሳያጠብ ይጠብቃል።
- source_word: ἐν τῷ λαῷ
  choice: በሕዝቡ መካከል
  rationale: ድርጊቶቹ በሕዝቡ ውስጥ መፈጸማቸውን በተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
