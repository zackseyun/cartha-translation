    text: «ሄለናውያን» ማለት ምናልባት ግሪክኛ ተናጋሪ አይሁድን ያመለክታል፤ «ዕብራውያን» ደግሞ ምናልባት አራማይስጥ ወይም ዕብራይስጥ ተናጋሪ አይሁድ ነበሩ።
    reason: cultural_note
