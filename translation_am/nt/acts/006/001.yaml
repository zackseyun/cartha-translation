  alternative: «ግሪክኛ ተናጋሪ አይሁድ» እና «ዕብራይስጥ ወይም አራማይስጥ ተናጋሪ አይሁድ» ብሎ በዋናው ጽሑፍ መተርጎም
  rationale: ምንጩ የቡድን ስያሜዎችን ይጠቀማል፤ እነርሱን ማቆየት የመጀመሪያውን ታሪካዊ ልዩነት ያለ አስፈላጊ ትርጓሜ ይጠብቃል። ማስታወሻው ግን ለዘመናዊ አንባቢ ምናልባታዊውን የቋንቋና የባህል ልዩነት ያብራራል።
