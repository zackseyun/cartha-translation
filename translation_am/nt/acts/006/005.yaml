  text: And the proposal pleased the whole multitude[a], and they chose Stephen, a man full of faith and of the Holy Spirit, Philip, Prochorus, Nicanor, Timon, Parmenas, and Nicolaus[c][b], a proselyte of Antioch.
translation:
  language: am
  text: 'ይህ ሐሳብ ሕዝቡን ሁሉ ደስ አሰኘ፤ እነርሱም በእምነት[a]ና በመንፈስ ቅዱስ የተሞላ ሰው የሆነውን እስጢፋኖስን፣ እንዲሁም ፊልጶስን፣ ጵሮኮሮስን፣ ኒቃኖርን፣ ጢሞንን፣ ጳርሜናስንና ወደ አይሁድ እምነት የገባውን[b] የአንጾኪያውን ኒቆላዎስን መረጡ።[c]


    [a] ወይም፣ “ታማኝነት።” የግሪኩ ቃል እምነትን፣ መታመንን ወይም ታማኝነትን ሊያመለክት ይችላል።


    [b] “ወደ አይሁድ እምነት የገባ” ማለት አይሁዳዊ ሳይሆን የአይሁድን እምነት የተቀበለ ሰው ማለት ነው።


    [c] በግሪክኛ የስሞቹ ዝርዝር ተደጋጋሚ “እና” በሚል ተያይዞ ይመጣል፤ የመጨረሻው ስም ኒቆላዎስም “የአንጾኪያ ወደ አይሁድ እምነት የገባ” ተብሎ ይገለጻል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ታማኝነት።” የግሪኩ ቃል እምነትን፣ መታመንን ወይም ታማኝነትን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “ወደ አይሁድ እምነት የገባ” ማለት አይሁዳዊ ሳይሆን የአይሁድን እምነት የተቀበለ ሰው ማለት ነው።
    reason: cultural_note
  - marker: c
    text: በግሪክኛ የስሞቹ ዝርዝር ተደጋጋሚ “እና” በሚል ተያይዞ ይመጣል፤ የመጨረሻው ስም ኒቆላዎስም “የአንጾኪያ ወደ አይሁድ እምነት የገባ” ተብሎ ይገለጻል።
    reason: source_form
lexical_decisions:
- source_word: ὁ λόγος
  choice: ይህ ሐሳብ
  rationale: ቃሉ በዚህ ዐውድ ሐዋርያት ቀደም ሲል ያቀረቡትን ሐሳብ ያመለክታል፤ “ይህ” የዐውዱን ማጣቀሻ ግልጽ ያደርጋል።
- source_word: ἤρεσεν ... ἐνώπιον παντὸς τοῦ πλήθους
  choice: ሕዝቡን ሁሉ ደስ አሰኘ
  rationale: ከἀρέσκω ጋር ያለው ሐረግ ሐሳቡ በተሰበሰበው ሕዝብ ሁሉ ዘንድ ተቀባይነት ማግኘቱን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἐξελέξαντο
  choice: መረጡ
  rationale: የመምረጥን ቀጥተኛ ትርጉም በተለመደ አማርኛ ያቀርባል።
- source_word: ἄνδρα πλήρης πίστεως καὶ πνεύματος ἁγίου
  choice: በእምነትና በመንፈስ ቅዱስ የተሞላውን ሰው
  rationale: እስጢፋኖስን በግልጽ የሚገልጸውን ባሕርይ ጠብቆ፣ πλήρηςን በተፈጥሯዊው “የተሞላ” ይተረጉማል።
- source_word: πίστεως
  choice: እምነት
  rationale: πίστις በዚህ ዐውድ እስጢፋኖስን የሚገልጽ እምነትን በዋናነት ያመለክታል፤ “ታማኝነት” የሚለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: πνεύματος ἁγίου
  choice: መንፈስ ቅዱስ
  rationale: በሐዋርያት ሥራ ውስጥ ሐረጉ መለኮታዊውን መንፈስ ቅዱስ ያመለክታል።
- source_word: προσήλυτον
  choice: ወደ አይሁድ እምነት የገባውን
  rationale: ለዘመናዊ አንባቢ የማይታወቅ የተዋሰውን ቃል ከመጠቀም ይልቅ፣ አይሁዳዊ ያልሆነ ሰው የአይሁድን እምነት መቀበሉን በግልጽ ይገልጻል።
- source_word: Ἀντιοχέα
  choice: የአንጾኪያውን
  rationale: ኒቆላዎስ ከአንጾኪያ ጋር ያለውን መነሻዊ ወይም ከተማዊ ግንኙነት በአጭር ይገልጻል።
- source_word: Στέφανον, Φίλιππον, Πρόχορον, Νικάνορα, Τίμωνα, Παρμενᾶν, Νικόλαον
  choice: እስጢፋኖስ፣ ፊልጶስ፣ ጵሮኮሮስ፣ ኒቃኖር፣ ጢሞን፣ ጳርሜናስ፣ ኒቆላዎስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠራር የተለመዱ የግል ስም ቅርጾችን ይጠቀማል።
