  text: የእግዚአብሔርም ቃል እያደገ ሄደ፤ በኢየሩሳሌምም የደቀ መዛሙርቱ ቁጥር እጅግ እየበዛ ሄደ፤ ከካህናቱም እጅግ ብዙዎች ለእምነት ይታዘዙ ነበር።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እምነትን ይታዘዙ ነበር” ወይም “ለእምነት ታዛዦች እየሆኑ ነበር።” የግሪኩ አገላለጽ ውስጣዊ የመታመን ተግባርን ብቻ ሳይሆን፣ ለክርስትናው መልእክት መታዘዝንም ሊያመለክት ይችላል።
