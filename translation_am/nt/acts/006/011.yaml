  yaml_path: translation/nt/acts/006/011.yaml
  text: Then they secretly induced men to say[a], “We have heard him speaking blasphemous words against Moses and God.”
translation:
  language: am
  text: ከዚያም፣ “እርሱ በሙሴና በእግዚአብሔር ላይ የስድብ ቃላትን ሲናገር ሰምተነዋል” እንዲሉ ወንዶችን በስውር አነሳሱ[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በድብቅ ገፋፉ” ወይም “በድብቅ አባበሉ።” የግሪኩ ግስ ሰዎችን በድብቅ እንዲሉ የማነሳሳት ሐሳብ አለው።
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: ከዚያም
  rationale: በትረካው ውስጥ ቀጣዩን ድርጊት የሚያስተዋውቅ ተፈጥሯዊ የጊዜ አያያዥ ነው።
- source_word: ὑπέβαλον
  choice: በስውር አነሳሱ
  rationale: ግሱ ሰዎቹን በድብቅ እንዲናገሩ የመገፋፋትንና የማነሳሳትን ሐሳብ ይዟል፤ በቀላሉ ‘አቀረቡ’ ማለት ይህን ስውር ባሕርይ አያሳይም።
- source_word: ἄνδρας
  choice: አንዳንድ ወንዶችን
  rationale: ἀνήρ በዚህ ስፍራ ወንድ ሰዎችን ያመለክታል፤ ‘አንዳንድ’ የሚለው በአማርኛ ያልተወሰነውን ብዙ ቁጥር ተፈጥሯዊ ያደርገዋል።
- source_word: λέγοντας
  choice: እንዲሉ
  rationale: ከዋናው የማነሳሳት ግስ ጋር ያለውን የዓላማና የይዘት ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Ἀκηκόαμεν αὐτοῦ λαλοῦντος
  choice: እርሱ ... ሲናገር ሰምተነዋል
  rationale: የፍጹም ጊዜውን ወቅታዊ ውጤት ‘ሰምተነዋል’ ይጠብቃል፤ የአማርኛው አገባብም ንግግሩን ሲያደርግ እንደሰሙት በግልጽ ያቀርባል።
- source_word: ῥήματα βλάσφημα
  choice: የስድብ ቃላትን
  rationale: የግሪኩን ‘የስድብ/የማቃለል ቃላት’ የሚለውን ሕጋዊና ሃይማኖታዊ ክስ ሳያለዝብ በግልጽ ያስተላልፋል።
- source_word: εἰς Μωϋσῆν καὶ τὸν θεόν
  choice: በሙሴና በእግዚአብሔር ላይ
  rationale: በዚህ የክስ አውድ εἰς የጥቃቱን አቅጣጫ ያሳያል፤ ‘በ...ላይ’ ይህን በተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: በእስጢፋኖስ ላይ የቀረበው ክስ ባሕርይ
  choice: ክሱን ‘በሙሴና በእግዚአብሔር ላይ የስድብ ቃላት’ ብሎ ማቅረብ፣ ነገር ግን እውነት እንደሆነ አለማረጋገጥ
  alternative: ‘ሙሴንና እግዚአብሔርን የሚያጥላሉ ቃላት’ ብሎ ማለዘብ
  rationale: ትረካው ሰዎቹ እንዲናገሩ የተነሳሱትን ክስ ዘግቧል። βλάσφημα የክሱን ከባድ ሃይማኖታዊ ኃይል ይይዛል፤ ትርጉሙ ግን ክሱን እንደ እውነት አያጸድቅም።
