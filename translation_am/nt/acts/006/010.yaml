id: ACT.6.10
reference: Acts 6:10
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ οὐκ ἴσχυον ἀντιστῆναι τῇ σοφίᾳ καὶ τῷ πνεύματι ᾧ ἐλάλει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/010.yaml
  text: And they were not able to withstand the wisdom and the Spirit by which he was speaking[a].
translation:
  language: am
  text: እርሱ በሚናገርበት መንፈስና በጥበቡ ፊት መቆም አልቻሉም[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «መንፈስ» የእስጢፋኖስን የራሱን መንፈስ ሊያመለክት ይችላል፤ መንፈስ ቅዱስን ብቻ ላይጠቅስ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἴσχυον
  choice: አልቻሉም
  rationale: የግሱ ኢምፐርፌክት ቅርጽ በዚህ አውድ ያለመቻልን ያመለክታል፤ «አልቻሉም» በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: ἀντιστῆναι
  choice: መቋቋም
  rationale: በዚህ አውድ እስጢፋኖስ ይናገር የነበረውን በብቃት መቃወም ወይም ፊት ለፊት መቆም አለመቻላቸውን ያሳያል።
- source_word: σοφίᾳ
  choice: ጥበብ
  rationale: ቃሉ በእስጢፋኖስ ንግግር የተገለጠውን ጥበብ ያመለክታል፤ የአማርኛው የተወሰነ ግስ ቅርጽ «የነበረውን» ይህን የተወሰነነት ያሳያል።
- source_word: πνεύματι
  choice: መንፈስ
  rationale: የሐዋርያት ሥራ 6፥5 እስጢፋኖስ በመንፈስ ቅዱስ የተሞላ መሆኑን ስለሚገልጽ፣ እዚህም በቅድሚያ መንፈስ ቅዱስን እንደሚያመለክት ተወስዷል። ሆኖም በአማርኛ የፊደል አጻጻፍ ብቻ ይህን ልዩነት ስለማያሳይ፣ አማራጩ በማስታወሻ ተጠብቋል።
- source_word: ᾧ ἐλάλει
  choice: እርሱ ይናገርበት የነበረውን
  rationale: የአማርኛው «-በት» ቅጥያ መንፈሱ ለንግግሩ መንገድ፣ ኃይል ወይም ወኪል መሆኑን ያለ አላስፈላጊ ማብራሪያ ያስተላልፋል፤ «የነበረው» ደግሞ የἐλάλειን ቀጣይ ያለፈ ጊዜ ገጽታ ይጠብቃል።
theological_decisions:
- issue: πνεύματι መንፈስ ቅዱስን ወይስ የእስጢፋኖስን የራሱን መንፈስ ያመለክታል?
  choice: በዋናው ጽሑፍ መንፈስ ቅዱስን እንደሚያመለክት ተወስዷል
  alternative: የእስጢፋኖስ የራሱ መንፈስ
  rationale: በቅርብ አውድ እስጢፋኖስ በመንፈስ ቅዱስ የተሞላ መሆኑና ጥበብ ከመንፈስ ጋር መጣመሩ ዋናውን ምርጫ ይደግፋሉ። የግሪኩ ቃል በራሱ ግን ሌላውን ንባብ ፈጽሞ አያስወግድም፤ ስለዚህ የትርጓሜው ውጥረት በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩን የቃላት ቅደም ተከተል በግድ ከመከተል ይልቅ የአማርኛን ተፈጥሯዊ አገባብ በመከተል ዋናው ትርጉምና አሻሚነቱ ተጠብቀዋል።
