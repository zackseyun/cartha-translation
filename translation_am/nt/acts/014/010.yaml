  text: በታላቅ ድምፅ፣ “ቀጥ ብለህ በእግሮችህ ላይ ቁም!” አለው። እርሱም ዘሎ ተነሣ፣ መራመድም ጀመረ።[a]
  philosophy: optimal-equivalence
  footnotes:
