    text: ወይም፣ “ዘሎ ተነሣ፣ ይራመድም ነበር።” የመጨረሻው የግሪክ ግስ ቀጣይ ድርጊትን ወይም የመራመዱን መጀመር ሊያጎላ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλῃ φωνῇ
  choice: በታላቅ ድምፅ
  rationale: የግሪኩ የአነጋገር ሁኔታን የሚገልጽ ሐረግ ሲሆን፣ ጮክ ብሎና ሁሉም እንዲሰማ መናገሩን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: Ἀνάστηθι ἐπὶ τοὺς πόδας σου ὀρθός
  choice: ቀጥ ብለህ በእግሮችህ ላይ ቁም
  rationale: ትእዛዙ ሰውየው በሁለት እግሮቹ ቀጥ ብሎ እንዲቆም ይጠይቃል፤ ይህ አተረጓጎም Ἀνάστηθιንና ὀρθόςን ሳይደባልቅ በግልጽ አማርኛ ያቀርባል።
- source_word: ἥλατο
