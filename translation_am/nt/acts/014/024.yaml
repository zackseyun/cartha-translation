lexical_decisions:
- source_word: καὶ
  choice: እነርሱም
  rationale: የግሪኩን ቀላል ትስስር በአማርኛ ተፈጥሯዊ በሆነው -ም አስተላልፎ፣ በግስ ውስጥ ያለውን ብዙ ቁጥር ባለቤትም ግልጽ ለማድረግ «እነርሱ» ተጠቅሟል።
- source_word: διελθόντες
  choice: በ… አድርገው ካለፉ በኋላ
  rationale: የአኦሪስት ቦዝ አንቀጹ ከዋናው ግስ በፊት የተፈጸመ እንቅስቃሴን ያሳያል፤ ይህ አቀራረብ በክልሉ ውስጥ አልፈው መጓዛቸውንና የጊዜውን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τὴν Πισιδίαν
  choice: ጲስድያ
  rationale: የክልሉ ስም በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን አጻጻፍ ተከትሎ በድምፅ ተጽፏል።
- source_word: ἦλθον
  choice: መጡ
  rationale: የብዙ ቁጥር አድራጊዎችን እና በትረካው ያለውን ወደ መዳረሻ መንቀሳቀስ በቀጥታ ያስተላልፋል።
- source_word: εἰς ⸀τὴν Παμφυλίαν
  choice: ወደ ጳምፍልያ
  rationale: εἰς የሚያመለክተውን ወደ ቦታ የሚደረግ እንቅስቃሴ «ወደ» በተፈጥሯዊና ትክክለኛ አማርኛ ያሳያል፤ የክልሉ ስምም በተለመደው አጻጻፍ ተጽፏል።
