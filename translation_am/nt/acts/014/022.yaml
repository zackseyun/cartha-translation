id: ACT.14.22
reference: Acts 14:22
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐπιστηρίζοντες τὰς ψυχὰς τῶν μαθητῶν, παρακαλοῦντες ἐμμένειν τῇ πίστει καὶ ὅτι διὰ πολλῶν θλίψεων δεῖ ἡμᾶς εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/022.yaml
  text: strengthening the souls of the disciples[a], encouraging them to remain in the faith[c][b], and saying that through many afflictions we must enter the kingdom of God.
translation:
  language: am
  text: የደቀ መዛሙርቱን ነፍሳት እያጸኑ፣ በእምነት ጸንተው እንዲኖሩ እያበረታቷቸው፣ “በብዙ መከራዎች አልፈን ወደ እግዚአብሔር መንግሥት መግባት ይገባናል” ይሉ ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστηρίζοντες
  choice: እያጸኑ
  rationale: ቀጣይነት ያለውን የማጠናከርና የማጽናት ተግባር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τὰς ψυχὰς
  choice: ነፍስ
  rationale: የደቀ መዛሙርቱን ውስጣዊ ሕይወትና ሙሉ ማንነት ይጠቁማል፤ የግድ ነፍስና ሥጋን የሚለይ ንባብ አያስገድድም።
- source_word: παρακαλοῦντες
  choice: እያበረታቷቸው
  rationale: በዚህ አውድ ያለውን ደጋፊ ምክርና ጽኑ ማሳሰቢያ በግልጽ ዘመናዊ አማርኛ ይገልጣል።
- source_word: ἐμμένειν τῇ πίστει
  choice: በእምነት ጸንተው እንዲኖሩ
  rationale: ἐμμένειν የመቆየትንና የመጽናትን ሐሳብ ይይዛል፤ በአማርኛም ይህ አገላለጽ ተፈጥሯዊ ነው።
- source_word: διὰ πολλῶν θλίψεων
  choice: በብዙ መከራዎች አልፈን
  rationale: διά ከዝርዝር ግስ ጋር የሚያሳየውን ‘በ… በኩል/አልፎ’ ሐሳብ ያስተላልፋል፤ θλῖψις የጭንቀትና የመከራ ክብደትን ይጠብቃል።
- source_word: δεῖ ἡμᾶς
  choice: ይገባናል
  rationale: ግሪኩ የሚገልጠውን አስፈላጊነት ይጠብቃል፤ የአስፈላጊነቱን ሥነ መለኮታዊ ምክንያት አይጨምርም።
- source_word: εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: ወደ እግዚአብሔር መንግሥት መግባት
  rationale: የመግባትን እንቅስቃሴና ‘የእግዚአብሔር መንግሥት’ የተባለውን መደበኛ እና ሰፊ ትርጉም ያለው አገላለጽ ይጠብቃል።
theological_decisions:
- issue: የτῇ πίστει ትርጉም
  choice: በእምነት
  alternative: በዚያ እምነት / በክርስቲያናዊው እምነት
  rationale: የግሪኩ የተወሰነ አመልካች የጋራውን እምነት ሊጠቁም ቢችልም፣ አማርኛ ‘በእምነት’ የግል እምነትንም የሚታመንበትን የጋራ እውነትም ሳይገድብ ሊይዝ ይችላል።
- issue: የδεῖ ኃይል
  choice: መግባት ይገባናል
  alternative: መግባታችን የግድ ነው
  rationale: የጽሑፉን አስፈላጊነት ያቆያል፣ ነገር ግን መከራ የመንግሥት መግቢያ ዋጋ ነው ወይም ድነትን ያስገኛል የሚል ተጨማሪ ዶግማ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የተከታታይ የግሪክ ክፍለ ግሶች በ‘እያ—’ ቅርጽ ተወክለዋል፤ ὅτι የንግግር ይዘቱን ስለሚያስገባ ቀጥተኛ ንግግርና ‘ይሉ ነበር’ ተጠቅመዋል።
