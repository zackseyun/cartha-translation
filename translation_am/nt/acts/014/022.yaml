review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the two participial actions, the exhortation to continue in the faith, and the necessity of entering God’s kingdom through many afflictions. However, τὰς ψυχὰς is plural, whereas ነፍስ is singular in the draft; this should be made plural in Amharic.
  naturalness: The sentence is generally clear and appropriately dignified modern Amharic. The participial sequence and direct quotation are natural enough for this narrative context.
  terminology: እምነት, መከራዎች, and የእግዚአብሔር መንግሥት are suitable established terms. ነፍሳት preserves the plural source expression without imposing a body–soul dualism.
  issues:
  - severity: medium
    issue: Singular ነፍስ renders plural τὰς ψυχὰς.
    rationale: The Greek explicitly has a plural direct object, ‘the souls/lives of the disciples.’ Using ነፍሳት preserves that number and avoids the sense that all the disciples share one singular soul.
