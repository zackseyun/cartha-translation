  rationale: ሰዎቹን በጌታ ጥበቃና እንክብካቤ ሥር መተውን በግልጽና ወቅታዊ አማርኛ ይገልጻል።
- source_word: τῷ κυρίῳ
  choice: ለጌታ
  rationale: የተሰጠው አደራ ተቀባይ ጌታ መሆኑን ያሳያል።
- source_word: εἰς ὃν πεπιστεύκεισαν
  choice: ያመኑበት ለሆነው
  rationale: ቀድሞ በጌታ ላይ የነበራቸውን ጸንቶ የቆየ እምነት እና የዝምድና አገላለጹን ይጠብቃል።
- source_word: αὐτοῖς ... αὐτοὺς
  choice: ሾሙላቸው ... ሰጧቸው
  rationale: የአማርኛ ተውላጠ ስም ቅጥያዎችን በመጠቀም የግሪኩን ተውላጠ ስም ይጠብቃል፤ የሁለተኛው ተውላጠ ስም ተጠቃሽ ግን በማስታወሻ ክፍት ተደርጓል።
theological_decisions:
- issue: χειροτονήσαντες ከቤተ ክርስቲያን አስተዳደር አንጻር ያለው ትርጉም
  choice: ሽማግሌዎችን ሾሙላቸው
  alternative: ሽማግሌዎችን መረጡላቸው / በእጅ ማውጣት መረጡ
  rationale: ቃሉ በአንዳንድ አውድ በእጅ ማውጣት የሚደረግ ምርጫን ሊያመለክት ቢችልም፣ ይህ ቁጥር የተወሰነ የምርጫ ሥርዓት አይገልጽም። “ሾሙ” የቡድን ልዩ አስተዳደር ሳያስገባ ዋናውን ትርጉም ይጠብቃል።
- issue: በπαρέθεντο αὐτοὺς ውስጥ αὐτοὺς የሚያመለክተው
  choice: ምእመናኑን/ማኅበሮቹን
  alternative: አዲስ የተሾሙትን ሽማግሌዎች
  rationale: የሐዋርያት ሥራ 14 ሰፊ አውድ ደቀ መዛሙርቱን ስለማጽናት ይናገራል፤ ስለዚህ ምእመናኑ ዋናው ተጠቃሽ ሊሆኑ ይችላሉ። ሆኖም ቅርብ ስማቸው ሽማግሌዎቹ ስለሆነ ሁለተኛው ንባብም የሚቻል ነው።
