base_translation:
  language: en
  yaml_path: translation/nt/acts/014/023.yaml
  text: And after appointing elders for them in every church[a], and praying with fasting, they entrusted them to the Lord[c][b], in whom they had believed.
translation:
  language: am
  text: በየማኅበሩ ሽማግሌዎችን ከሾሙላቸው[a] እና ከጾም ጋር ከጸለዩ በኋላ፣ ለጌታ አደራ ሰጧቸው[b]፤ እነርሱም ቀድሞ በእርሱ አምነው ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በየማኅበሩ ሽማግሌዎችን ከመረጡላቸው።” የግሪኩ ግስ በአንዳንድ አውድ እጅ በማውጣት መምረጥን ሊያመለክት ይችላል፤ እዚህ ግን በአጠቃላይ መሾምን ሊያመለክት ይችላል።
    reason: alternative_reading
  - marker: b
    text: “አደራ ሰጧቸው” የሚለው ምእመናኑን በአጠቃላይ ሳይሆን፣ አዲስ የተሾሙትን ሽማግሌዎች ብቻ ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
