- source_word: πρεσβυτέρους
  choice: ሽማግሌዎችን
  rationale: በማኅበሩ አውድ የታወቁ መሪዎችን እንጂ በዕድሜ የገፉ ወንዶችን ብቻ አያመለክትም።
- source_word: προσευξάμενοι μετὰ νηστειῶν
  choice: ከጾም ጋር ከጸለዩ በኋላ
  rationale: ጸሎቱ በጾም የታጀበ መሆኑንና ከዋናው ግስ በፊት መፈጸሙን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: παρέθεντο
