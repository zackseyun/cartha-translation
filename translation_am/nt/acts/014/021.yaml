revisions:
- from: በዚያችም ከተማ የምሥራቹን ቃል ከሰበኩ[a]ና ብዙዎችን ደቀ መዛሙርት ካደረጉ በኋላ፣ ወደ ልስጥራ፣ ወደ ኢቆንዮንና ወደ አንጾኪያ ተመለሱ።
  to: በዚያች ከተማ የምሥራቹን ቃል ሰብከው ብዙ ሰዎችን ደቀ መዛሙርት ካደረጉ በኋላ፣ ወደ ልስጥራ፣ ወደ ኢቆንዮንና ወደ አንጾኪያ ተመለሱ።
  rationale: The revision retains the source’s prior-action relationship, the substantial number of disciples made, and each repeated destination. It improves Amharic syntax by treating the first participial action with ሰብከው and by explicitly identifying the people who were made disciples. The lexical-alternative footnote is retained and adjusted to match the revised participial construction.
