  text: በዚያች ከተማ የምሥራቹን ቃል ሰብከው ብዙ ሰዎችን ደቀ መዛሙርት ካደረጉ በኋላ፣ ወደ ልስጥራ፣ ወደ ኢቆንዮንና ወደ አንጾኪያ ተመለሱ።
