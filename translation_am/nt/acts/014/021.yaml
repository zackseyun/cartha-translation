lexical_decisions:
- source_word: Εὐαγγελισάμενοί
  choice: የምሥራቹን ቃል ከሰበኩ
  rationale: የግሪኩን የምሥራች ማወጅ ትርጉም በዘመናዊና በተለመደ አማርኛ ያስተላልፋል፤ የአኦሪስት አሳታፊውም ከዋናው ግስ በፊት የተፈጸመ ተግባር መሆኑን «ከ… በኋላ» የሚለው አወቃቀር ያሳያል።
- source_word: τε
  choice: ም / ና
  rationale: ከቀደመው ንግግርና ከተከታዩ ተግባር ጋር ያለውን ቀላል አያያዥነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τὴν πόλιν ἐκείνην
  choice: በዚያች ከተማ
  rationale: በዐውዱ ወደ ደርቤ የሚመለሰውን አመልካች ሐረግ በቀጥታ ይገልጣል።
- source_word: μαθητεύσαντες
  choice: ደቀ መዛሙርት ካደረጉ
  rationale: ሰዎችን ደቀ መዝሙር ማድረግ የሚለውን ንቁና ውጤታዊ ትርጉም ይጠብቃል።
- source_word: ἱκανοὺς
  choice: ብዙዎችን
  rationale: በዚህ ዐውድ ቃሉ በቂነትን ሳይሆን ከፍ ያለ ቁጥርን ያመለክታል።
- source_word: ὑπέστρεψαν
  choice: ተመለሱ
  rationale: ወደ ቀድሞ ቦታዎች ተመልሶ መጓዝን በግልጽ ይገልጣል።
- source_word: εἰς τὴν Λύστραν καὶ εἰς Ἰκόνιον καὶ εἰς Ἀντιόχειαν
  choice: ወደ ልስጥራ፣ ወደ ኢቆንዮንና ወደ አንጾኪያ
  rationale: የመድረሻ አቅጣጫውንና በግሪኩ ያለውን ተደጋጋሚ አወቃቀር በተፈጥሯዊ የአማርኛ ዝርዝር ይጠብቃል።
