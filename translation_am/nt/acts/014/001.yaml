base_translation:
  language: en
  yaml_path: translation/nt/acts/014/001.yaml
  text: In Iconium they entered together into the synagogue of the Jews and spoke in such a way that a great multitude of both Jews and Greeks believed[a].
translation:
  language: am
  text: በኢቆንዮንም ሁለቱ አብረው ወደ አይሁድ ምኩራብ[a] ገብተው፣ እጅግ ብዙ አይሁድና ግሪኮች እስኪያምኑ ድረስ እንዲህ ተናገሩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ወደ አይሁዳውያን ምኩራብ።» የግሪኩ ቃል በቃል «ወደ አይሁድ ምኩራብ» ይላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: -ም
  rationale: ይህ አገላለጽ በዚህ ስፍራ የትረካ ሽግግርን ያመለክታል፤ በአማርኛ በግስ ላይ የተያያዘው «-ም» ዐውዳዊ ቅጥሉን በተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: ἐν Ἰκονίῳ
  choice: በኢቆንዮን
  rationale: ቀጥተኛ የቦታ ሐረግ ሲሆን የከተማዋ ስም በተለመደው የአማርኛ ቅርጽ ተጽፏል።
- source_word: κατὰ τὸ αὐτό
  choice: ሁለቱ አብረው
  rationale: ሐረጉ ጳውሎስና በርናባስ በጋራ መግባታቸውን ያመለክታል፤ «ሁለቱ» የተሰወረውን የብዙ ቁጥር ተውላጠ ስም ግልጽ ያደርጋል።
- source_word: εἰς τὴν συναγωγὴν τῶν Ἰουδαίων
  choice: ወደ አይሁድ ምኩራብ
  rationale: የግሪኩን የባለቤትነት ግንኙነት በተፈጥሯዊ የአማርኛ የስም ቅደም ተከተል ያቀርባል።
- source_word: λαλῆσαι οὕτως ὥστε
  choice: ተናገሩ፤ በዚህም ሁኔታ
  rationale: የመናገራቸውን ሁኔታና የተከተለውን ውጤት ያቆያል፤ በአማርኛ ከባድ የሆነ ቃል በቃል አወቃቀርን ያስወግዳል።
- source_word: πιστεῦσαι
  choice: አመኑ
  rationale: ግሱ ለሐዋርያት ስብከት የተሰጠውን የእምነት ምላሽ በቀጥታ ይገልጻል።
- source_word: Ἰουδαίων τε καὶ Ἑλλήνων πολὺ πλῆθος
  choice: እጅግ ብዙ አይሁድና ግሪኮች
  rationale: የሁለቱንም ቡድኖች መካተትና ታላቅ ቁጥራቸውን በዘመናዊና ግልጽ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: በትረካዊ የመለወጥ ዐውድ ውስጥ πιστεῦσαι የሚለው ትርጉም
  choice: አመኑ
  alternative: ወደ እምነት መጡ / መልእክቱን አመኑ
  rationale: የግሪኩ ግስ የእምነት ምላሹን ብቻ ይገልጻል፤ ተጨማሪ የሆነ የትርጓሜ ነገር ሳይጨመር «አመኑ» ተብሎ ቀጥታ ተተርጉሟል።
