  yaml_path: translation/nt/acts/014/008.yaml
  text: And in Lystra a certain man was sitting[a], powerless in his feet, lame from his mother's womb, who had never walked.
translation:
  language: am
  text: 'በልስጥራም አንድ ሰው ተቀምጦ ነበር፤ እርሱ በእግሮቹ አቅም የሌለው፣ ከእናቱ ማህፀን ጀምሮ አንካሳ የነበረ፣ ፈጽሞ ተራምዶ የማያውቅ ነበር።


    [a] ወይም፣ “በእግሮቹ ኃይል የሌለው።” ግሪክኛው እርሱ አንካሳ እንደነበር በግልጽ ከመናገሩ በፊት በእግሮቹ አቅም እንደሌለው ያጎላል።'
  philosophy: optimal-equivalence
