theological_decisions:
- issue: ጳውሎስ በእርግጥ ሞቶ እንደነበር ወይስ አጥቂዎቹ ብቻ እንዲህ እንዳሰቡ
  choice: ዋናው ጽሑፍ ‘የሞተ መስሏቸው’ በማለት የአጥቂዎቹን ግምት ብቻ ይገልጣል።
  alternative: አንዳንዶች ጳውሎስ በእርግጥ ሞቶ ከዚያ እንደገና ሕያው ሆነ ብለው ይረዳሉ።
  rationale: νομίζοντες αὐτὸν τεθνηκέναι የሚለው አጥቂዎቹ ያሰቡትን ይዘግባል እንጂ ጳውሎስ በእርግጥ መሞቱን አይናገርም፤ ስለዚህ ትርጉሙ ጽሑፉ ያልወሰነውን ነገር አይወስንም።
