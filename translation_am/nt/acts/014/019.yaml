  source_fidelity: The draft accurately identifies the opponents, their persuasion of the crowds, the stoning, and their assumption about Paul. However, «ጣሉት» (“they threw/left him”) adds an action not stated by ἔσυρον (“they dragged”), and the draft's lexical rationale explicitly acknowledges this addition.
