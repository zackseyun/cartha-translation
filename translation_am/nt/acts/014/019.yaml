  terminology: «አይሁድ», «ሕዝቡን», «በድንጋይ ወገሩት», and «ከከተማው ውጭ ጎተቱት» are suitable and faithful. «ሞቶአል ብለው ስላሰቡ» preserves that this was the attackers’ supposition, not a statement that Paul actually died.
  issues:
