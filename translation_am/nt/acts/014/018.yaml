  text: καὶ ταῦτα λέγοντες μόλις κατέπαυσαν τοὺς ὄχλους τοῦ μὴ θύειν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/018.yaml
  text: Even by saying these things, they barely restrained the crowds from sacrificing to them.
translation:
  language: am
  text: ይህንም እያሉ ሕዝቡን ለእነርሱ መሥዋዕት ከማቅረብ በጭንቅ አስቆሙት።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ταῦτα λέγοντες
  choice: ይህንም ቢሉ
  rationale: ካί በዐውዱ የሚያሳየውን የተቃርኖ አጽንዖት (‘ይህን እንኳ ቢሉ’) በተፈጥሯዊና አጭር አማርኛ ያስተላልፋል።
- source_word: μόλις κατέπαυσαν
  choice: በጭንቅ ከለከሉት
  rationale: μόλις የሚገልጠውን ‘በብዙ ችግር/ለጥቂት ተርፎ’ ሐሳብ ይጠብቃል፤ κατέπαυσαν ደግሞ በዚህ ዐውድ ድርጊቱን ማስቆምን ያመለክታል።
- source_word: τοὺς ὄχλους
  choice: ሕዝቡ
  rationale: ብዙ ሰዎች የተሰበሰቡበትን ማኅበረሰብ በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τοῦ μὴ θύειν αὐτοῖς
  choice: መሥዋዕት እንዳያቀርብላቸው
  rationale: የግሪኩን የመከልከል ማሟያ አወቃቀርና αὐτοῖς የሚያመለክተውን ለጳውሎስና ለበርናባስ መሥዋዕት ማቅረብ በግልጽ ያስተላልፋል።
theological_decisions:
- issue: የκαί እና μόλις ጥምር አጽንዖት
  choice: ይህንም ቢሉ … በጭንቅ
  alternative: ይህን እያሉ … እምብዛም ሳይቀር
  rationale: ሐዋርያቱ በብዙ ጥረት ሕዝቡን ከአምልኮ ድርጊት እንዳስቆሙ ያሳያል፤ ከጽሑፉ በላይ የሆነ የሥነ መለኮት ማብራሪያ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለመደበኛ አንባቢ ግልጽ የሆነ አማርኛ፤ የግሪኩ አጭርነትና የተቃርኖ አጽንዖት ተጠብቋል።
