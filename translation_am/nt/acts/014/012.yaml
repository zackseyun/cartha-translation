base_translation:
  language: en
  yaml_path: translation/nt/acts/014/012.yaml
  text: And they were calling Barnabas Zeus[a], and Paul Hermes[b], because he was the chief speaker.
translation:
  language: am
  text: በርናባስን “ዜውስ”፣ ጳውሎስንም “ሄርሜስ”[b] ብለው ይጠሯቸው ነበር፤ ምክንያቱም ዋናው ተናጋሪ[a] እርሱ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ግሪክ፦ “በንግግሩ የሚመራው” ወይም “ዋናው ተናጋሪ።”
    reason: lexical_alternative
  - marker: b
    text: አንዳንድ የቀድሞ ትርጉሞች የሮማውያንን የእነዚህ አማልክት ስሞች ተጠቅመው “ጁፒተር” እና “ሜርኩሪ” ይላሉ፤ የግሪኩ ጽሑፍ ግን “ዜውስ” እና “ሄርሜስ” ይላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκάλουν
  choice: ብለው ይጠሯቸው ነበር
  rationale: የግሱን ያልተፈጸመ ያለፈ ጊዜ ቅርጽ በመጠበቅ፣ ስያሜዎቹን በቀጣይነት ወይም ደጋግመው ይጠቀሙ እንደነበር ያሳያል።
- source_word: τε … δὲ
  choice: …፣ …ም
  rationale: በርናባስና ጳውሎስ የተሰጣቸውን የተለያየ ስያሜ በተፈጥሯዊ የአማርኛ አያያዝ ያገናኛል።
- source_word: Δία
  choice: ዜውስ
  rationale: የግሪኩን የአምላክ ስም በቀጥታ ይጠብቃል፤ የሮማውያንን ተመሳሳይ ስም ‘ጁፒተር’ አይተካም።
- source_word: Ἑρμῆν
  choice: ሄርሜስ
  rationale: በግሪክ ምንጭ ያለውን ስም በቀጥታ ያቀርባል፤ ‘ሜርኩሪ’ የተባለውን የሮማውያን ስም አያስገባም።
- source_word: ἐπειδὴ
  choice: ምክንያቱም
  rationale: ሕዝቡ ጳውሎስን ሄርሜስ ብሎ የጠራበትን ምክንያት ግልጽ አድርጎ ያስተዋውቃል።
- source_word: αὐτὸς
  choice: እርሱ
  rationale: ተውላጠ ስሙ ከበርናባስ በተቃራኒ ጳውሎስን አጽንዖት ሰጥቶ እንደሚያመለክት ይጠብቃል።
- source_word: ὁ ἡγούμενος τοῦ λόγου
  choice: ዋናው ተናጋሪ
  rationale: ቃል በቃል ‘ንግግሩን የሚመራው’ ሊባል ቢችልም፣ በዚህ አውድ የንግግሩን ዋና ሚና የወሰደውን ሰው በተፈጥሯዊና ግልጽ አማርኛ ያሳያል።
theological_decisions:
- issue: የአረማውያን አማልክት ስሞች አተረጓጎም
  choice: በዋናው ጽሑፍ ‘ዜውስ’ እና ‘ሄርሜስ’ መጠቀም
  alternative: ‘ጁፒተር’ እና ‘ሜርኩሪ’ መጠቀም
