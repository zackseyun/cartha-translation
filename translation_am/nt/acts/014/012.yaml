translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የእንግሊዝኛው የግርጌ ማስታወሻ [a] ከ‘ዜውስ’ ቀጥሎ ቢታይም ይዘቱ ὁ ἡγούμενος τοῦ λόγουን ስለሚያብራራ፣ በአማርኛው ‘ዋናው ተናጋሪ’ ከሚለው ቀጥሎ ተቀምጧል፤ [b] ደግሞ ከመለኮታት ስሞች ጋር ተያይዟል።
