  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ረጅም የተሳቢ አወቃቀር ለአማርኛ ተነባቢነት በሁለት ዓረፍተ ነገሮች ተከፍሏል፤ የጌታ ምስክርነትና የምልክቶቹ መፈጸም ግን ትስስራቸውን ጠብቀዋል።
