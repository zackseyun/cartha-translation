  text: ἱκανὸν μὲν οὖν χρόνον διέτριψαν παρρησιαζόμενοι ἐπὶ τῷ κυρίῳ τῷ μαρτυροῦντι ⸀τῷ λόγῳ τῆς χάριτος αὐτοῦ, διδόντι σημεῖα καὶ τέρατα γίνεσθαι διὰ τῶν χειρῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/003.yaml
  text: So they stayed there a considerable time[a], speaking boldly for the Lord, who was bearing witness to the word of his grace, granting signs and wonders to be done through their hands.
translation:
  language: am
  text: ስለዚህም በዚያ ረጅም ጊዜ ቆዩ፤ በጌታ ተማምነው በድፍረት ይናገሩ ነበር።[a] ጌታም በእጃቸው ምልክቶችና ድንቆች እንዲደረጉ እየሰጠ፣ ለጸጋው ቃል ይመሰክር ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለጌታ በድፍረት ይናገሩ ነበር” ወይም “በጌታ ውስጥ በድፍረት ይናገሩ ነበር።” የግሪኩ አገላለጽ ድፍረታቸው በጌታ ላይ የተመሠረተ መሆኑን፣ ከጌታ ጋር ባለው ግንኙነት መፈጸሙን፣ ወይም ለጌታ ሲሉ መናገራቸውን ሊያጎላ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἱκανὸν ... χρόνον
  choice: ብዙ ጊዜ
  rationale: የግሪኩ ሐረግ አጭር ያልሆነ፣ ጉልህ የሆነ የጊዜ ቆይታን ያመለክታል፤ ‘ብዙ ጊዜ’ በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: διέτριψαν
  choice: በዚያ ... ቆዩ
  rationale: በአንድ ስፍራ ጊዜ ማሳለፍን ወይም መቆየትን ያሳያል፤ ‘በዚያ ቆዩ’ የቦታውንና የቆይታውን ሐሳብ በግልጽ ያስተላልፋል።
- source_word: παρρησιαζόμενοι
  choice: በድፍረት ይናገሩ ነበር
  rationale: ያለፍርሃትና በግልጽ መናገርን ያመለክታል፤ ያልተቋረጠውን የተልእኮ እንቅስቃሴም ያሳያል።
- source_word: ἐπὶ τῷ κυρίῳ
  choice: በጌታ ተማምነው
  rationale: ἐπί ከተሳቢ አገባብ ጋር መሠረትን ወይም መደገፍን ሊገልጽ ይችላል። ‘በጌታ ተማምነው’ ድፍረታቸው ከጌታ የመነጨ መሆኑን በተፈጥሯዊ አማርኛ ያሳያል፤ የሐረጉ ሌላ ሊሆን የሚችል ትርጉም በማስታወሻ ተጠብቋል።
- source_word: τῷ κυρίῳ
  choice: ጌታ
  rationale: κύριος የሚለውን ማዕረግ ሳይጨምርና ሳያጠብ በቀጥታ ያስተላልፋል።
- source_word: τῷ μαρτυροῦντι
  choice: ይመሰክር ነበር
  rationale: በሐዋርያቱ አገልግሎት ጊዜ የቀጠለውን የጌታ ማረጋገጫና ምስክርነት ያሳያል።
- source_word: τῷ λόγῳ τῆς χάριτος αὐτοῦ
  choice: ስለ ጸጋው ቃል
  rationale: የግሪኩ የባለቤትነት ግንኙነት የጸጋውን መልእክት ወይም ጸጋን የሚገልጠውን ቃል ሊያመለክት ይችላል። ‘ስለ ጸጋው ቃል’ በአማርኛ ግልጽ ሲሆን የመልእክቱን ይዘት ይጠብቃል።
- source_word: χάριτος
  choice: ጸጋ
  rationale: በሉቃስና በሐዋርያት ሥራ ውስጥ ያለውን መለኮታዊ በጎነትና ስጦታ የያዘ ሥነ መለኮታዊ ክብደት ይጠብቃል።
- source_word: διδόντι
  choice: በመፍቀድ
  rationale: ጌታ ምልክቶቹና ድንቅ ሥራዎቹ እንዲፈጸሙ መቻልንና ሥልጣንን እንደሰጠ ያሳያል።
- source_word: σημεῖα καὶ τέρατα
  choice: ምልክቶችና ድንቅ ሥራዎች
  rationale: ምልክት የሆኑበትንና አድናቆት የሚያስከትሉበትን ሁለቱንም ገጽታዎች የሚያስተላልፍ የተለመደ የመጽሐፍ ቅዱስ አገላለጽ ነው።
- source_word: γίνεσθαι
  choice: እንዲደረጉ
  rationale: ሥራዎቹ በሐዋርያቱ አማካይነት እንዲፈጸሙ መደረጋቸውን ያሳያል።
- source_word: διὰ τῶν χειρῶν αὐτῶν
  choice: በእጃቸው
  rationale: ሐዋርያቱ የተአምራቱ ምንጭ ሳይሆኑ መሣሪያ መሆናቸውን የሚያጎላውን ተጨባጭ መጽሐፍ ቅዱሳዊ አገላለጽ ይጠብቃል።
theological_decisions:
- issue: በተሳቢ ሐረጎቹ ውስጥ ‘ጌታ’ የሚያመለክተው
  choice: የግሪኩን ማዕረግ ብቻ በመጠበቅ ‘ጌታ’ ተብሎ ተተርጉሟል።
  alternative: ‘ጌታ ኢየሱስ’ ብሎ መግለጽ፣ ወይም በአጠቃላይ እግዚአብሔርን እንደሚያመለክት መተርጎም።
  rationale: ጽሑፉ τῷ κυρίῳ ብቻ ይላል። በትረካው ዐውድ የተነሣውን ጌታ ኢየሱስን ሳይቀር ሊያመለክት ቢችልም፣ ‘ኢየሱስ’ ብሎ መጨመር በግሪኩ የሌለውን ዝርዝር ያስገባል።
- issue: የἐπὶ τῷ κυρίῳ ኃይል
  choice: ዋናው ጽሑፍ ‘በጌታ ተማምነው’ በማለት የመደገፍን ወይም የመሠረትን ሐሳብ ገልጿል።
  alternative: ‘ለጌታ በድፍረት ይናገሩ ነበር’ ወይም ‘በጌታ ሆነው በድፍረት ይናገሩ ነበር።’
  rationale: ሐረጉ የድፍረታቸውን መሠረት፣ የእንቅስቃሴውን ክልል ወይም ለጌታ መሥራታቸውን ሊገልጽ ይችላል። ዋናው ጽሑፍ በአማርኛ የተፈጥሮ አገላለጽን ይጠቀማል፤ ሌላው የሚቻል ትርጉም ግን በማስታወሻ ተጠብቋል።
