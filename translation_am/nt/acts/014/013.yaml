  choice: የዙስ ካህን
  rationale: τε ትረካውን የሚያስቀጥል ቀላል አያያዥ ነው፤ በአማርኛ የዓረፍተ ነገሩ አወቃቀር ትረካውን በተፈጥሮ ስለሚያስቀጥል የተለየ አያያዥ አልተጨመረም።
- source_word: ἱερεὺς τοῦ Διὸς
  choice: የዙስ ካህን
  rationale: ዙስ የግሪኩን መለኮት ስም በቀጥታ ያቆያል፤ ካህንም የሃይማኖታዊ አገልጋዩን ሚና በግልጽ ያሳያል።
- source_word: τοῦ ὄντος πρὸ τῆς πόλεως
  choice: ቤተ መቅደሱ ከከተማይቱ ውጭ የነበረው
  rationale: ሐረጉ በቃል ደረጃ ‘በከተማይቱ ፊት የነበረው ዙስ’ ይላል፤ በዐውዱ ግን ከከተማይቱ ውጭ የነበረውን የዙስ መቅደስ ማመልከቱ ይበልጥ የተፈጥሮ ነው። በአማርኛ ግልጽ እንዲሆን ‘ቤተ መቅደስ’ ተገልጦ ተጨምሯል፤ የቃል በቃሉ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ταύρους
  choice: ኮርማዎችን
  rationale: ταῦρος ወንድ ከብትን፣ በተለይም ለመሥዋዕት የሚቀርብ ኮርማን ያመለክታል።
- source_word: στέμματα
  choice: የአበባ ጉንጉኖችን
  rationale: ቃሉ በበዓልና በመሥዋዕት ሥነ ሥርዓት የሚጠቀሙባቸውን ጉንጉኖች ወይም አክሊሎች ያመለክታል። ‘የአበባ ጉንጉን’ ለዘመናዊ አንባቢ ተፈጥሯዊና ግልጽ ነው።
- source_word: ἐπὶ τοὺς πυλῶνας
  choice: ወደ በሮቹ
  rationale: ἐπί ከእንቅስቃሴ ጋር መድረሻን ያሳያል፤ πυλῶνας ደግሞ በሮችን ወይም መግቢያዎችን ያመለክታል። ብዙ ቁጥሩ ተጠብቋል።
- source_word: ἐνέγκας
  choice: አምጥቶ
  rationale: የአኦሪስት አጋዥ ግሱ ከዋናው ግስ በፊት የተደረገውን ድርጊት ያቀርባል፤ ‘አምጥቶ’ ይህን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: σὺν τοῖς ὄχλοις
  choice: ከሕዝቡ ጋር
  rationale: ሐረጉ ካህኑ ከተሰበሰቡት ሰዎች ጋር በጋራ ለመሠዋት መፈለጉን ያሳያል። የግሪኩ ብዙ ቁጥር በአማርኛ ‘ሕዝቡ’ በሚለው ተፈጥሯዊ የጋራ ስም ተሰጥቷል።
- source_word: ἤθελεν θύειν
  choice: መሥዋዕት ሊያቀርብ ፈለገ
  rationale: θέλω ፍላጎትን ወይም ዓላማን ያሳያል፤ θύω በዚህ የአምልኮ ዐውድ እንስሳን ከመግደል በላይ መሥዋዕት ማቅረብን ያመለክታል።
