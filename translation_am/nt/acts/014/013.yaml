    text: ቃል በቃል፣ “በከተማይቱ ፊት የነበረው ዙስ።” ሐረጉ ከከተማይቱ ውጭ የነበረውን የዙስ ቤተ መቅደስ ወይም የአምልኮ ስፍራ የሚያመለክት ይመስላል።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ “አክሊሎችን።”
    reason: lexical_alternative
lexical_decisions:
