base_translation:
  language: en
  yaml_path: translation/nt/acts/014/026.yaml
  text: And from there they sailed to Antioch[b][a], where they had been committed to the grace of God for the work that they had fulfilled.
translation:
  language: am
  text: ከዚያም በመርከብ ወደ አንጾኪያ ሄዱ፤ አንጾኪያም ለፈጸሙት[b] ሥራ አስቀድመው ለእግዚአብሔር ጸጋ አደራ ተሰጥተው[a] የነበሩባት ከተማ ነበረች።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለእግዚአብሔር ጸጋ ተላልፈው ተሰጡ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ላጠናቀቁት።”
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: ከዚያም
  rationale: የትረካውን ቀጣይነትና ከቀደመው ስፍራ መነሳታቸውን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἀπέπλευσαν
  choice: በመርከብ … ሄዱ
  rationale: ጉዞው በባሕር እንደነበር በግልጽና በተለመደ አማርኛ ይገልጻል፤ ከዚያም የሚለው የመነሳትን አቅጣጫ ይጠብቃል።
- source_word: εἰς Ἀντιόχειαν
  choice: ወደ አንጾኪያ
  rationale: εἰς ከእንቅስቃሴ ግስ ጋር ያለውን የመድረሻ ፍቺ ይጠብቃል፤ የቦታውም ስም በተለመደው የአማርኛ አጻጻፍ ቀርቧል።
- source_word: ὅθεν
  choice: የነበሩት ከዚያ ነበር
  rationale: ‘ከየት’ የሚለውን የመነሻ ፍቺ በግልጽ ሁኔታ ያስቀምጣል፤ አንጾኪያ ቀድሞ በአደራ የተሰጡበት ስፍራ መሆኑን አያደበዝዝም።
- source_word: ἦσαν παραδεδομένοι
  choice: አደራ ተሰጥተው የነበሩት
  rationale: ቀድሞ የተፈጸመንና በዚህ ጊዜ አስፈላጊነቱ የቀጠለን ድርጊት ይገልጻል፤ ‘አደራ ተሰጥተው’ ደግሞ ወደ እግዚአብሔር ጸጋ እንክብካቤ መሰጠታቸውን ያሳያል።
- source_word: τῇ χάριτι τοῦ θεοῦ
  choice: ለእግዚአብሔር ጸጋ
  rationale: የግሪኩን ዳቲቭ ግንኙነትና ‘የእግዚአብሔር ጸጋ’ የሚለውን ሙሉ ሥነ መለኮታዊ ክብደት ይጠብቃል።
- source_word: εἰς τὸ ἔργον
  choice: ለ… ሥራ
  rationale: ἔργονን በቀጥታ ‘ሥራ’ ብሎ በመተርጎም ከአውዱ በላይ ‘ተልእኮ’ የሚል ትርጓሜ አያስገባም።
- source_word: ὃ ἐπλήρωσαν
  choice: ለፈጸሙት
  rationale: ሥራውን ወደ ፍጻሜ እንዳደረሱ ይገልጻል፤ ‘ፈጸሙ’ የሚለው በዘመናዊ አማርኛ ተፈጥሯዊና ክቡር ነው።
theological_decisions:
- issue: የአንጾኪያ ማኅበር በጳውሎስና በበርናባስ ላይ ቀድሞ ያደረገው ድርጊት ባሕርይ
  choice: ለእግዚአብሔር ጸጋ አደራ ተሰጥተው
  alternative: ለእግዚአብሔር ጸጋ ተላልፈው ተሰጥተው
  rationale: ጽሑፉ ለሥራው ወደ እግዚአብሔር ጸጋና ጥበቃ በአደራ መሰጠታቸውን ያሳያል፤ ይህም ከግሪኩ የበለጠ የተወሰነ የቤተ እምነት ሥርዓት አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የመነሻ ፍቺ በ‘ከዚያ’ ተጠብቋል፤ የቀደመው አደራ መሰጠትም በ‘ተሰጥተው የነበሩት’ ተገልጿል።
