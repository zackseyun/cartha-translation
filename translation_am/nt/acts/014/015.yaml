  alternative: ጣዖታት
  rationale: ዐውዱ የጣዖት አምልኮንና የአረማውያንን መሥዋዕት ቢያመለክትም፣ የግሪኩ ቃል ከ“ጣዖታት” ይልቅ ሰፊ ነው፤ ይህ ስፋት በዋናው ጽሑፍ ተጠብቋል።
