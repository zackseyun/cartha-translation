  text: καὶ λέγοντες· Ἄνδρες, τί ταῦτα ποιεῖτε; καὶ ἡμεῖς ὁμοιοπαθεῖς ἐσμεν ὑμῖν ἄνθρωποι, εὐαγγελιζόμενοι ὑμᾶς ἀπὸ τούτων τῶν ματαίων ἐπιστρέφειν ἐπὶ ⸀θεὸν ζῶντα ὃς ἐποίησεν τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/015.yaml
  text: and saying[a], “Men, why are you doing these things? We also are men with the same nature as you, bringing you good news to turn from these worthless things to the living God[c][b], who made the heaven and the earth and the sea and everything in them.”
translation:
  language: am
  text: እንዲህም አሉ፦ “ወንዶች ሆይ፣ ይህን ለምን ታደርጋላችሁ? እኛም እንደ እናንተው ተመሳሳይ ሰብዓዊ ተፈጥሮ ያለን ሰዎች ነን።[a] ከእነዚህ ከንቱ ነገሮች[b] ወደ ሕያው አምላክ እንድትመለሱ የምሥራች እናውጃለን፤ እርሱም ሰማይን[c] እና ምድርን፣ ባሕርንም፣ በእነርሱም ውስጥ ያሉትን ሁሉ ፈጠረ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከእናንተ ጋር አንድ የሰው ተፈጥሮ ያለን ነን።” ሐረጉ ጳውሎስና በርናባስ ከአድማጮቻቸው ጋር ተመሳሳይ ሰብዓዊ ሁኔታ እንዳላቸው ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: “ከንቱ ነገሮች” በዐውዱ ጣዖታትን ጨምሮ ፍሬ አልባ የሆነውን የአረማውያን አምልኮ ያመለክታል።
    reason: cultural_note
  - marker: c
    text: ወይም፣ “ሰማያትን።” የግሪኩ ጽሑፍ ቅዱሳት መጻሕፍትን በሚያስታውሰው የፍጥረት ቀመር ውስጥ “ሰማይ” የሚለውን በነጠላ ቁጥር ይጠቀማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες
  choice: እናንተ ሰዎች
  rationale: ቃሉ በቀጥታ የተሰበሰቡትን ወንዶች የሚጠራ ቢሆንም፣ በዘመናዊ አማርኛ “እናንተ ሰዎች” ቀጥተኛውን አድራሻና የሐሳቡን ግልጽነት በተፈጥሯዊ ሁኔታ ይጠብቃል።
- source_word: ὁμοιοπαθεῖς ... ἄνθρωποι
  choice: እንደ እናንተ ያለን ሰዎች
  rationale: ጳውሎስና በርናባስ ከአድማጮቻቸው ጋር አንድ የሰው ተፈጥሮና ሁኔታ እንደሚጋሩ ያሳያል፤ ስሜትን ብቻ አያመለክትም።
- source_word: εὐαγγελιζόμενοι
  choice: የምሥራች እናበሥራችኋለን
  rationale: የግሱን የምሥራች ማወጅ ኃይል የሚጠብቅ፣ በአማርኛም የተለመደና ግልጽ አገላለጽ ነው።
- source_word: ματαίων
  choice: ከንቱ ነገሮች
  rationale: ምንጩ በቀጥታ “ጣዖታት” አይልም፤ ዋጋ ቢስና ፍሬ አልባ የሆኑትን ነገሮች በሰፊው ይገልጣል።
- source_word: ἐπιστρέφειν ἐπὶ θεὸν ζῶντα
  choice: ወደ ሕያው አምላክ እንድትመለሱ
  rationale: ከከንቱ ነገሮች ርቆ ወደ አምላክ የሚደረገውን አቅጣጫዊ መመለስ ያሳያል፤ “ሕያው” የሚለውም ሕይወት ከሌላቸው የአምልኮ ነገሮች ጋር ያነጻጽራል።
- source_word: ἐποίησεν
  choice: ፈጠረ
  rationale: በዚህ የፍጥረት ቀመር ውስጥ ποιέω የአምላክን የመፍጠር ሥራ ያመለክታል፤ “ፈጠረ” በአማርኛ ተፈጥሯዊና ትክክለኛ ነው።
- source_word: τὸν οὐρανὸν ... πάντα τὰ ἐν αὐτοῖς
  choice: ሰማይንና ምድርን፣ ባሕርንም በእነርሱ ያለውንም ሁሉ
  rationale: የግሪኩን ተከታታይ አያያዥ አወቃቀርና ሁሉን አቀፍ የፍጥረት ቀመር በተፈጥሯዊ አማርኛ ይጠብቃል።
