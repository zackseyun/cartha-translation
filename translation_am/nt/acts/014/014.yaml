lexical_decisions:
- source_word: ἀκούσαντες
  choice: በሰሙ ጊዜ
  rationale: የግሱን ጊዜያዊ አገናኝነትና የድርጊቶቹን ቅደም ተከተል በተፈጥሯዊ አማርኛ ይገልጣል፤ በአውዱ የሰሙትን ለማመልከት «ይህን» ተጨምሯል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከሕዝቡ የመሥዋዕት ዝግጅት ወደ ሐዋርያቱ ተቃራኒ ምላሽ የሚያደርገውን የንግግር ሽግግር ያሳያል።
- source_word: οἱ ἀπόστολοι Βαρναβᾶς καὶ Παῦλος
  choice: ሐዋርያት በርናባስና ጳውሎስ
  rationale: የግሪኩን ተዛማጅ ስያሜ በቀጥታ በመጠበቅ በርናባስና ጳውሎስን «ሐዋርያት» ብሎ ይለያል።
- source_word: διαρρήξαντες τὰ ἱμάτια αὐτῶν
  choice: ልብሳቸውን ቀደዱ
  rationale: የሐዘን፣ የድንጋጤ ወይም የጠንካራ ተቃውሞ ምልክት የሆነውን ባህላዊ ድርጊት በግልጽና ቀጥተኛ አማርኛ ያቀርባል።
- source_word: ἐξεπήδησαν
  choice: በፍጥነት ገቡ
  rationale: ድንገተኛና ኃይለኛ እንቅስቃሴውን ተፈጥሯዊ በሆነ ዘመናዊ አማርኛ ይገልጣል፤ የ«ዘለሉ» የቃል በቃል አማራጭ በግርጌ ማስታወሻ ተጠብቋል።
- source_word: εἰς τὸν ὄχλον
  choice: ወደ ሕዝቡ መካከል
  rationale: εἰς የሚያመለክተውን ወደ ሰዎቹ ስብስብ ውስጥ የሚደረግ እንቅስቃሴ ያሳያል፤ በግሪኩ በግልጽ ያልተጠቀሰውን «ወጡ» አያክልም።
- source_word: κράζοντες
  choice: እየጮኹ
  rationale: ከመግባታቸው ጋር አብሮ የቀጠለውን ከፍ ያለ ድምፅ እና የአሁን አንቀጽን ቀጣይነት ይጠብቃል።
theological_decisions:
- issue: «ሐዋርያት» የሚለው ስያሜ በርናባስና ጳውሎስን ማመልከቱ
