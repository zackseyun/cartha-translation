  rationale: የግሪኩ አገባብ በዚህ አውድ በርናባስና ጳውሎስን ሐዋርያት ብሎ ይጠራቸዋል፤ ትርጉሙ ይህን ሳያጠብ ወይም ሳያሰፋ ይጠብቃል።
