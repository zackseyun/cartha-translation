  text: οἵ ⸀τε ὄχλοι ἰδόντες ὃ ⸀ἐποίησεν Παῦλος ἐπῆραν τὴν φωνὴν αὐτῶν Λυκαονιστὶ λέγοντες· Οἱ θεοὶ ὁμοιωθέντες ἀνθρώποις κατέβησαν πρὸς ἡμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/011.yaml
  text: And when the crowds saw what Paul had done[a], they raised their voices, saying in the Lycaonian language, “The gods, having become like men[b], have come down to us!”
translation:
  language: am
  text: ሕዝቡም ጳውሎስ ያደረገውን ባዩ ጊዜ፣ በልቃኦንያ ቋንቋ[a] ድምፃቸውን ከፍ አድርገው፣ “አማልክት ሰዎችን መስለው[b] ወደ እኛ ወርደዋል!” አሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በልቃኦንኛ።”
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “ከሰዎች ጋር ተመሳስለው።”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ τε ὄχλοι ἰδόντες
  choice: ሕዝቡም … ባዩ ጊዜ
  rationale: τέ የትረካውን ቀጣይነት በ«-ም» ያሳያል፤ የብዙ ቁጥር ὄχλοι በአማርኛ ተፈጥሯዊ በሆነው የስብስብ ስም «ሕዝቡ» ተተርጉሟል። ἰδόντες ዋናው ድርጊት የተፈጸመበትን ጊዜ ስለሚገልጥ «ባዩ ጊዜ» ተብሏል።
- source_word: ὃ ἐποίησεν Παῦλος
  choice: ጳውሎስ ያደረገውን
  rationale: የግሪኩን አንጻራዊ ሐረግ በተፈጥሯዊ አማርኛ ይገልጣል፤ በቀደመው አውድ የተፈጸመውን ተአምራዊ ድርጊት ያመለክታል።
- source_word: ἐπῆραν τὴν φωνὴν αὐτῶν
  choice: ድምፃቸውን ከፍ አድርገው
  rationale: «ድምፃቸውን አነሡ» የሚለውን የግሪክ ምስላዊ አገላለጽ ጠብቆ በዘመናዊ አማርኛ ጮክ ብለው መናገራቸውን በግልጽ ያሳያል።
- source_word: Λυκαονιστί
  choice: በልቃኦንያ ቋንቋ
  rationale: ተውሳኩ በልቃኦናውያን ቋንቋ መናገርን ያመለክታል፤ «ቋንቋ»ን መጨመር ለዘመናዊ አንባቢ ትርጉሙን ግልጽ ያደርጋል።
- source_word: Οἱ θεοὶ
  choice: አማልክት
  rationale: የብዙ ቁጥር θεοί የሕዝቡን አረማዊ አማልክት ያመለክታል፤ ከእውነተኛው አምላክ ጋር እንዳይደባለቅ የብዙ ቁጥር ቅርጹ ተጠብቋል።
- source_word: ὁμοιωθέντες ἀνθρώποις
  choice: ሰዎችን መስለው
  rationale: የግሪኩ ሐረግ ከሰዎች ጋር መመሳሰልን ይገልጣል። «ሰዎችን መስለው» ተፈጥሯዊ ነው፣ የሰው ልጆችን በአጠቃላይ ያካትታል፣ እንዲሁም ጽሑፉ ያልገለጠውን የሥጋ መልበስ ትምህርት አያስገባም።
- source_word: κατέβησαν πρὸς ἡμᾶς
  choice: ወደ እኛ ወርደዋል
  rationale: καταβαίνω የመውረድን እንቅስቃሴ ይገልጣል፤ የአማርኛው ፍጹም ጊዜ የሕዝቡን ወቅታዊና የተደነቀ አዋጅ በተፈጥሯዊ ሁኔታ ያቀርባል።
theological_decisions:
- issue: የልስጥራ ሕዝብን አረማዊ ትርጓሜ የክርስቲያናዊ ሥጋ መልበስ ትምህርት ሳይጨመር ማቅረብ
  choice: “አማልክት ሰዎችን መስለው … ወርደዋል”
  alternative: “አማልክት የሰውን መልክ ይዘው … ወርደዋል”
  rationale: ጥቅሱ የሕዝቡን የተሳሳተ አረማዊ ግንዛቤ ይዘግባል። «ሰዎችን መስለው» ὁμοιωθέντες የሚገልጠውን መመሳሰል ይጠብቃል፤ ከጽሑፉ በላይ የሆነ ክርስቶሎጂያዊ ትርጉም አይጭንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የቀጥታ ንግግሩ የሕዝቡን ድንጋጤና ጩኸት ያንጸባርቃል፤ ነገር ግን ያልተገባ ትምህርታዊ ቃላትን አያስገባም።
