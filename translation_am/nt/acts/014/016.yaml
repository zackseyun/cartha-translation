  yaml_path: translation/nt/acts/014/016.yaml
  text: In past generations he allowed all the nations to walk in their own ways[a].
translation:
  language: am
  text: በቀደሙት ትውልዶች እርሱ ሕዝቦች ሁሉ በራሳቸው መንገዶች እንዲሄዱ ፈቀደላቸው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «አሕዛብ ሁሉ በመንገዶቻቸው እንዲሄዱ ፈቀደላቸው።»
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: እርሱ
  rationale: አንጻራዊው ተውላጠ ስም ቃል በቃል «እርሱም» ወይም «የሆነው» ሊባል ቢችልም፣ ከቀደመው ቁጥር የሚቀጥለውን እግዚአብሔርን በተፈጥሯዊ አማርኛ «እርሱ» በማለት ያመለክታል።
- source_word: ἐν ταῖς παρῳχημέναις γενεαῖς
  choice: በቀደሙት ትውልዶች
  rationale: የግሪኩን ያለፉ ወይም የቀደሙ ትውልዶች የሚለውን ጊዜያዊ ትርጉም በዘመናዊና ክቡር አማርኛ ያስተላልፋል።
- source_word: εἴασεν
  choice: ፈቀደላቸው
  rationale: ግሱ መፍቀድን እንጂ ማጽደቅን ወይም በግድ ማድረግን አያመለክትም። «ፈቀደላቸው» በአማርኛ ከ«እንዲሄዱ» ጋር ተፈጥሯዊ ነው።
- source_word: πάντα τὰ ἔθνη
  choice: ሕዝቦች ሁሉ
  rationale: ἔθνη ሕዝቦችን፣ አሕዛብን ወይም ብሔራትን ሊያመለክት ይችላል። እዚህ «ሕዝቦች ሁሉ» ሰፊውን የሰው ማኅበረሰቦች ትርጉም ይጠብቃል፤ «አሕዛብ» የሚለው አማራጭ በማስታወሻ ቀርቧል።
- source_word: πορεύεσθαι
  choice: እንዲሄዱ
  rationale: ቃሉ በመሠረቱ መሄድን ያመለክታል፤ ከ«መንገድ» ጋር ሲጣመር የአኗኗርን አቅጣጫ በምሳሌያዊ ሁኔታ ይገልጣል። «እንዲሄዱ» ይህን ምስል ሳይተረጉም ይጠብቃል።
- source_word: ταῖς ὁδοῖς αὐτῶν
  choice: በየራሳቸው መንገድ
  rationale: የባለቤትነቱን ኃይል እና የእያንዳንዱን ሕዝብ የራሱ አካሄድ በተፈጥሯዊ አማርኛ ይገልጣል፤ «መንገድ» የአኗኗር ዘይቤን የሚያመለክተውን ምሳሌ ይጠብቃል።
theological_decisions:
- issue: መለኮታዊ ፈቃድ እና ማጽደቅ
  choice: እግዚአብሔር ሕዝቦች በየራሳቸው መንገድ እንዲሄዱ ፈቀደላቸው
  alternative: እግዚአብሔር መንገዳቸውን አጸደቀ ወይም በግድ እንዲሄዱበት ወሰነ
  rationale: εἴασεν የሚለው ግስ መፍቀድን ያመለክታል። ትርጉሙ መለኮታዊ ትዕግሥትንና የሰውን ኃላፊነት አብሮ እንዲቆይ ያደርጋል፤ ማጽደቅንም ሆነ ውሳኔአዊ ማስገደድን አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር አማርኛ ተጠቅሟል። «ሕዝቦች ሁሉ» ከቤተ እምነት ልዩ አጠቃቀም ይልቅ ሰፊውን የἔθνη ትርጉም ያስቀድማል፤ ባህላዊው «አሕዛብ» በእግር ማስታወሻ ተጠብቋል።
