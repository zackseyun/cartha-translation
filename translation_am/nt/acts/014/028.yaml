lexical_decisions:
- source_word: διέτριβον
  choice: ቆዩ
  rationale: ያለፈ ጊዜ ያልተፈጸመ ግስ በአንድ ስፍራ ጊዜን እያሳለፉ መቆየታቸውን ያመለክታል፤ «ቆዩ» በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: δὲ
  choice: -ም
  rationale: ቀላል የትረካ ትስስሩን በአማርኛ ተፈጥሯዊ በሆነው አያያዥ «-ም» ያስተላልፋል።
- source_word: χρόνον οὐκ ὀλίγον
  choice: ጥቂት ያልሆነ ጊዜ
  rationale: የግሪኩን በክህደት አገላለጽ ብዙነትን የሚጠቁም ዘይቤ ይጠብቃል፤ ትርጉሙም ረዘም ያለ ወይም በቂ ጊዜ ማለት ነው።
- source_word: σὺν τοῖς μαθηταῖς
  choice: ከደቀ መዛሙርቱ ጋር
  rationale: σύν የአብሮነትን ግንኙነት ያሳያል፤ በዐውዱ «ደቀ መዛሙርቱ» በዚያ ያሉትን የአካባቢውን አማኞች ያመለክታል።
