  yaml_path: translation/nt/acts/014/009.yaml
  text: This man listened to Paul speaking[a], who, looking intently at him and seeing that he had faith to be saved,
translation:
  language: am
  text: ይህ ሰው ጳውሎስ ሲናገር አዳመጠ። ጳውሎስም ትኩር ብሎ ተመለከተው፤ እንዲፈወስ[a] እምነት እንዳለውም አይቶ፣
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እንዲድን።” የግሪኩ ግስ “ሊድን” ወይም “ሊፈወስ” ማለት ሊሆን ይችላል፤ በዚህ ስፍራ ያለው አውድ የአካል ፈውስን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: ይህ ሰው
  rationale: በቀደመው ቁጥር የተጠቀሰውን ሽባ ሰው በግልጽ ያመለክታል።
- source_word: ἤκουσεν
  choice: አዳመጠ
  rationale: ከተራ መስማት ይልቅ የጳውሎስን ንግግር በትኩረት መቀበሉን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: λαλοῦντος
  choice: ሲናገር
  rationale: የጳውሎስን በዚያው ጊዜ መናገር በተፈጥሯዊ የአማርኛ ጊዜያዊ አገባብ ይገልጣል።
- source_word: ἀτενίσας
  choice: ትኩር ብሎ ተመለከተው
  rationale: የተኮረና የጸና እይታን ግልጽ በሆነ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἰδὼν
  choice: አይቶ
  rationale: ዋናውን የማየት ምስላዊ ቃል ይጠብቃል፤ በአውዱም የመገንዘብን ሐሳብ ሊያካትት ይችላል።
- source_word: ἔχει πίστιν
  choice: እምነት እንዳለው
  rationale: πίστις እዚህ የሰውየውን የማመን ምላሽ እንጂ የታማኝነት ባሕርይን አያመለክትም።
- source_word: τοῦ σωθῆναι
  choice: ለመፈወስ
  rationale: በቅርብ አውዱ ሽባው ሰው በአካል ሊፈወስ መሆኑ ዋናው ትርጉም ነው፤ የ“መዳን” ሰፊ ትርጉም በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: በፈውስ ትረካው ውስጥ σωθῆναι የሚለው ቃል ትርጉም
  choice: የአካል ፈውስ፦ “ለመፈወስ”
  alternative: ሰፊ የድነት ትርጉም፦ “ለመዳን”
  rationale: ቀጥተኛው አውድ የሚታይ የአካል ፈውስ ነው፤ ሆኖም የግሪኩ ቃል ሰፊውን የድነት ትርጉም ሊሸከም ስለሚችል ይህ አማራጭ በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የመጨረሻው “አይቶ፣” የሚለው ቅርጽ ሐረጉ በቀጣዩ ቁጥር እንደሚቀጥል ያሳያል።
