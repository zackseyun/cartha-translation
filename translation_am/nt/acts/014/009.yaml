  verdict: revise
  source_fidelity: The draft correctly identifies the man as the listener and Paul as the one who looked intently and perceived his faith. However, «ለመፈወስ እምነት» can naturally mean faith to heal someone (an active sense), whereas τοῦ σωθῆναι means that the man was to be healed/saved (passive sense).
  naturalness: The wording is otherwise clear, modern, and appropriately dignified. Recasting the final phrase with «እንዲፈወስ» expresses the intended passive sense idiomatically.
  terminology: «እምነት» is appropriate for πίστις. Rendering σωθῆναι as physical healing is defensible in this immediate miracle context, provided that the broader ‘be saved’ sense remains in the footnote. The footnote is adjusted to use passive forms consistently.
  issues:
  - severity: medium
    issue: The phrase «ለመፈወስ እምነት» has an unintended active implication.
    rationale: 'In Amharic, it may suggest that the man had faith to perform healing. The Greek infinitive σωθῆναι is passive: he had faith to be healed/saved.'
