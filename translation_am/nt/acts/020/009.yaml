  rationale: τις ያለውን ያልተወሰነ አመልካችነትና νεανίας የሚያመለክተውን ወጣት ወንድ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὀνόματι Εὔτυχος
  choice: ኤውጢኮስ የሚባል
  rationale: የግል ስምን የሚያስተዋውቅ ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
- source_word: ἐπὶ τῆς θυρίδος
