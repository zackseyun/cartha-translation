- source_word: κατενεχθεὶς ἀπὸ τοῦ ὕπνου
  choice: እንቅልፉም ስላሸነፈው
  rationale: ቀደም ሲል የተገለጠው የማንቀላፋት ሂደት ወደ ወሳኙ የመሸነፍ ጊዜ መድረሱንና ምክንያታዊ ግንኙነቱን ያሳያል።
- source_word: ἔπεσεν ἀπὸ τοῦ τριστέγου κάτω
  choice: ከሦስተኛው ፎቅ ወደ ታች ወደቀ
  rationale: τρίστεγον ሦስተኛ ፎቅን፣ κάτω ደግሞ ወደ ታች ያለውን እንቅስቃሴ በግልጽ ያስተላልፋሉ።
- source_word: ἤρθη νεκρός
