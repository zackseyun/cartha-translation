theological_decisions:
- issue: νεκρός በእርግጥ ሞተ ወይስ የሞተ መሰለ ተብሎ መተርጎም
  choice: ሞቶ
  alternative: የሞተ መስሎ / ሞቷል ተብሎ
  rationale: ግሪኩ νεκρός የሚለውን በቀጥታ ይጠቀማል፤ ጥርጣሬን የሚያመለክት ቃል ስለሌለ ትርጉሙ የትረካውን ግልጽ ንግግር ማለዘብ የለበትም።
- issue: ἤρθη የሚያመለክተው ከመሬት ማንሣት ወይስ ከቦታው መውሰድ
  choice: ተነሣ
  alternative: ተወሰደ
  rationale: ግሱ ሁለቱንም ትርጉሞች ሊይዝ ስለሚችል ዋናው ጽሑፍ «ተነሣ»ን ይጠቀማል፤ እውነተኛው የቃል አማራጭ ግን በማስታወሻ ተጠብቋል።
