base_translation:
  language: en
  yaml_path: translation/nt/acts/020/009.yaml
  text: And a certain young man named Eutychus[a], sitting in the window, was sinking into a deep sleep while Paul was speaking at length; and being overcome by sleep, he fell down from the third story and was picked up dead.
translation:
  language: am
  text: ኤውጢኮስ የሚባል አንድ ወጣት በመስኮቱ ላይ ተቀምጦ ነበር። ጳውሎስ ለረጅም ጊዜ ሲናገር፣ ወጣቱ በጥልቅ እንቅልፍ እየተዋጠ ሄደ፤ እንቅልፍም ስላሸነፈው፣ ከሦስተኛው ፎቅ ወደ ታች ወደቀና ሞቶ ከመሬት ተነሥቶ ተወሰደ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሞቶ ከመሬት ተነሣ።” የግሪኩ ግስ ከመሬት ማንሣት ወይም መውሰድ ማለት ይችላል።
    reason: lexical_alternative
