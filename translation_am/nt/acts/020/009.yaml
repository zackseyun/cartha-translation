- source_word: καταφερόμενος ὕπνῳ βαθεῖ
  choice: በከባድ እንቅልፍ እየተዋጠ ሄደ
  rationale: ወደ እንቅልፍ ቀስ በቀስ የመውረድንና በእሱ የመሸነፍን ሂደት ይጠብቃል።
- source_word: διαλεγομένου τοῦ Παύλου ἐπὶ πλεῖον
  choice: ጳውሎስም ንግግሩን ሲያረዝም
