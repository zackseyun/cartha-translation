  yaml_path: translation/nt/acts/020/034.yaml
  text: You yourselves know that these hands served my needs and the needs of those who were with me[a].
translation:
  language: am
  text: እናንተ ራሳችሁ እንደምታውቁት፣ እነዚህ እጆች የእኔን ፍላጎቶችና ከእኔ ጋር የነበሩትን ፍላጎቶች አሟልተዋል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እነዚህ እጆች እኔንና ከእኔ ጋር የነበሩትን አገልግለዋል።” የግሪኩ ግስ ቁሳዊ ድጋፍን ያስገኘ ተግባራዊ አገልግሎት ሊያጎላ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: እናንተ ራሳችሁ
  rationale: ከግሱ ጋር የተጠቀሰው ተውላጠ ስም አጽንዖት ስላለው፣ ‘እናንተ ራሳችሁ’ ይህን አጽንዖት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: γινώσκετε
  choice: እንደምታውቁት
  rationale: የአድማጮቹን ቀጥተኛ እውቀት የሚገልጽ ሲሆን፣ በአማርኛ ከቀጣዩ ንግግር ጋር ተፈጥሯዊ ትስስር ይፈጥራል።
- source_word: ταῖς χρείαις μου καὶ τοῖς οὖσι μετ’ ἐμοῦ
  choice: ለእኔና ከእኔ ጋር ለነበሩት የሚያስፈልገንን
  rationale: χρεία በዚህ አውድ ተግባራዊና ቁሳዊ ፍላጎትን ያመለክታል። ይህ አገላለጽ ፍላጎቱ የጳውሎስንም የአብረውት የነበሩትንም መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὑπηρέτησαν
  choice: አቅርበዋል
  rationale: ግሱ አገልግሎትን ወይም ተግባራዊ እርዳታን ሊያጎላ ይችላል፤ ‘እነዚህ እጆች’ እና ፍላጎቶች ከሚለው አውድ ጋር ‘አቅርበዋል’ የጉልበት ሥራውን ቁሳዊ ውጤት ግልጽ ያደርጋል፣ የ‘አገለገሉ’ንም አማራጭ በማስታወሻ ይጠብቃል።
- source_word: αἱ χεῖρες αὗται
  choice: እነዚህ እጆች
  rationale: የግሪኩን ጠቋሚና ጎላ ያለ አገላለጽ በቀጥታ ይጠብቃል፤ ጳውሎስ በእጅ ሥራው ላይ የሰጠውን አጽንዖትም ያስተላልፋል።
