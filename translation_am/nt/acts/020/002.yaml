  text: διελθὼν δὲ τὰ μέρη ἐκεῖνα καὶ παρακαλέσας αὐτοὺς λόγῳ πολλῷ ἦλθεν εἰς τὴν Ἑλλάδα
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/002.yaml
  text: After passing through those regions and encouraging them with many words[a], he came into Greece.
translation:
  language: am
  text: በእነዚያም አካባቢዎች አልፎ፣ በብዙ ቃላት[a] ካበረታታቸው በኋላ ወደ ግሪክ መጣ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በሰፊ ምክር» ወይም «ረጅም ማበረታቻ በመስጠት»፤ የግሪኩ ሐረግ ቃል በቃል «በብዙ ቃል» ይላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: διελθὼν
  choice: አልፎ
  rationale: የግሪኩ የአኦሪስት አጋዥ ግስ ከዋናው ግስ በፊት የተፈጸመውን ድርጊት ያሳያል፤ «አልፎ ... ከኋላ» በአማርኛ የድርጊቶቹን ቅደም ተከተል በተፈጥሮ ያቀርባል።
- source_word: τὰ μέρη ἐκεῖνα
  choice: በእነዚያ አካባቢዎች
  rationale: μέρη በዚህ የመልክዓ ምድር አውድ «ክፍሎች/አካባቢዎች» ማለት ነው፤ «አካባቢዎች» ዘመናዊና ግልጽ ነው።
- source_word: παρακαλέσας
  choice: ካበረታታቸው
  rationale: παρακαλέω ማበረታታት፣ መምከር ወይም ማጽናናትን ሊያመለክት ይችላል። ጳውሎስ አማኞችን እየጎበኘ ባለበት በዚህ አውድ «አበረታታ» ሰፊውን የእረኝነት ትርጉም ይጠብቃል።
- source_word: αὐτοὺς
  choice: -አቸው
  rationale: ተውላጠ ስሙ ቀደም ሲል በተጠቀሱት አካባቢዎች ያሉትን አማኞች ያመለክታል፤ በአማርኛ በግሱ ላይ የተጣበቀው «-አቸው» ተፈጥሯዊ አቻ ነው።
- source_word: λόγῳ πολλῷ
  choice: በብዙ ቃል
  rationale: የግሪኩን «በብዙ ቃል/ንግግር» የሚል ቅርጽ በቅርብ ይጠብቃል። ሐረጉ ረጅም ወይም ሰፊ ምክርንም ሊያመለክት ስለሚችል ይህ በአማራጭ ማስታወሻ ተገልጿል።
- source_word: ἦλθεν εἰς τὴν Ἑλλάδα
  choice: ወደ ግሪክ መጣ
  rationale: የግሪኩን የእንቅስቃሴ አቅጣጫ ይጠብቃል፤ «ወደ ግሪክ መጣ» በአማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: δὲ
  choice: -ም
  rationale: δὲ ለስላሳ የንግግር ማያያዣ ነው፤ በ«በእነዚያም» ውስጥ ያለው «-ም» ከቀደመው ትረካ ጋር ያገናኘዋል።
