language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Μετὰ δὲ τὸ παύσασθαι τὸν θόρυβον ⸀μεταπεμψάμενος ὁ Παῦλος τοὺς μαθητὰς καὶ ⸀παρακαλέσας, ἀσπασάμενος ἐξῆλθεν ⸀πορεύεσθαι ⸀εἰς Μακεδονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/001.yaml
  text: After the uproar had ceased[a], Paul sent for the disciples, and after encouraging them and saying farewell, he departed to go to Macedonia.
translation:
  language: am
  text: ሁከቱ ከተወ በኋላ፣ ጳውሎስ ደቀ መዛሙርቱን አስጠርቶ አበረታታቸው፤ ከዚያም ተሰናብቷቸው[a] ወደ መቄዶንያ ለመሄድ ተነሣ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሰላምታ ሰጥቷቸው።” የግሪኩ ቃል ሰላምታ መስጠትን ወይም፣ በመነሻ ዐውድ፣ መሰናበትን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὸ παύσασθαι τὸν θόρυβον
  choice: ሁከቱ ከተወ በኋላ
  rationale: μετά ከአንቀጻዊ የግስ ስም ጋር የጊዜ ቅደም ተከተልን ያመለክታል፤ θόρυβος ደግሞ በዐውዱ የኤፌሶንን ሕዝባዊ ረብሻ ስለሚያመለክት ‘ሁከት’ ተመርጧል።
- source_word: μεταπεμψάμενος
  choice: አስጠርቶ
  rationale: መልእክት ልኮ ሰዎችን ወደ ራስ ማስመጣትን የሚገልጸውን የመካከለኛ ድምፅ ተሳቢ ግስ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τοὺς μαθητὰς
  choice: ደቀ መዛሙርቱን
  rationale: በሐዋርያት ሥራ የኢየሱስን ተከታዮች የሚጠራበትን የሉቃስ ቃል በትክክል ይጠብቃል።
- source_word: παρακαλέσας
  choice: አበረታታቸው
  rationale: παρακαλέω ማበረታታትን፣ መምከርን ወይም ማጽናናትን ሊያመለክት ይችላል፤ ከሁከት በኋላ ባለው የስንብት ዐውድ ‘አበረታታቸው’ ሰፊውን የድጋፍና የማጽናት ኃይል ይይዛል።
- source_word: ἀσπασάμενος
  choice: ተሰናብቷቸው
  rationale: ቃሉ በመሠረቱ ሰላምታ መስጠትን ቢያመለክትም፣ በመነሻ ዐውድ መሰናበትን ሊገልጽ ይችላል፤ የቃሉ አማራጭ በእግር ማስታወሻ ተጠብቋል።
- source_word: ἐξῆλθεν πορεύεσθαι εἰς Μακεδονίαν
  choice: ወደ መቄዶንያ ለመሄድ ተነሣ
  rationale: ἐξέρχομαι በጉዞ ትረካ መነሳትን ወይም መውጣትን ያመለክታል፤ የዓላማ ግስ ስሙንና መድረሻውን በተፈጥሯዊ አማርኛ ይገልጻል።
