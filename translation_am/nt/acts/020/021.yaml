- source_word: πίστιν
  choice: ማመን
  rationale: ኢየሱስ የእምነቱ ቀጥተኛ ዓላማ ስለሆነ፣ ‘ማመን’ በዘመናዊ አማርኛ ተፈጥሯዊና ለብዙኃን ግልጽ ነው፤ ‘መታመን’ የሚለው ትርጉም በማስታወሻ ተጠብቋል።
- source_word: εἰς τὸν κύριον ἡμῶν Ἰησοῦν
  choice: በጌታችን በኢየሱስ
  rationale: እምነት በኢየሱስ ላይ መደረጉን በተለመደ የአማርኛ አገባብ ይገልጣል፤ κύριος የሚለውን ክርስቶሳዊ ማዕረግ ‘ጌታ’ በማለት ይጠብቃል።
theological_decisions:
- issue: πίστις በክርስቶስ ላይ ሲያመለክት ያለው አተረጓጎም
