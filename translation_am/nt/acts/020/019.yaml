    issue: «ፈተናዎች» may be heard chiefly as tests or temptations.
    rationale: πειρασμοί can have that broader sense, but the immediately specified source in opponents' plots makes external afflictions/trials the contextual sense. «መከራዎች» is clearer while remaining faithful.
  - severity: low
    issue: Footnote a's alternative «መፈተኖች» is not a helpful idiomatic lexical alternative.
    rationale: It is awkward in this context and does not clearly distinguish the possible senses. «ፈተናዎች» and «ሙከራዎች» are clearer alternatives to the chosen contextual rendering.
