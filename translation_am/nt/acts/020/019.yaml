source:
  edition: SBLGNT
  text: δουλεύων τῷ κυρίῳ μετὰ πάσης ταπεινοφροσύνης ⸀καὶ δακρύων καὶ πειρασμῶν τῶν συμβάντων μοι ἐν ταῖς ἐπιβουλαῖς τῶν Ἰουδαίων·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/019.yaml
  text: serving the Lord with all humility and with tears and trials that happened to me through the plots of the Jews[a][b].
translation:
  language: am
  text: በፍጹም ትሕትና፣ በእንባ፣ እንዲሁም በአይሁድ[b] ሴራዎች ሳቢያ በደረሱብኝ መከራዎች[a] ጌታን እያገለገልኩ፤
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም «ፈተናዎች» ወይም «ሙከራዎች»፤ እዚህ ከተቃውሞ የተነሡ ውጫዊ መከራዎችን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ይህ በጳውሎስ ላይ ሴራ የጠነሰሱትን የተወሰኑ አይሁዳዊ ተቃዋሚዎች ያመለክታል እንጂ አይሁድን ሁሉ አይደለም።
    reason: cultural_note
lexical_decisions:
- source_word: δουλεύων
  choice: እያገለገልኩ
  rationale: የአሁን ጊዜ አሳታፊው ጳውሎስ በቀጣይነት ያገለገለበትን ሁኔታ ይገልጣል። «እያገለገልኩ» የታማኝ አገልግሎትን ፍቺ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τῷ κυρίῳ
  choice: ጌታን
  rationale: κύριος በመደበኛው «ጌታ» ተብሎ ተተርጉሟል፤ የግሪኩን ማዕረግ ጠብቆ ማንነቱን ከጽሑፉ በላይ አይወስንም። ከ«ማገልገል» ጋር በአማርኛ የተሳቢ ምልክት ይወስዳል።
- source_word: μετὰ πάσης ταπεινοφροσύνης
  choice: በፍጹም ትሕትና
  rationale: πάσης የትሕትናውን ሙሉነት ያጠናክራል፤ «በፍጹም ትሕትና» ይህን በዘመናዊና በክብር ቋንቋ ያስተላልፋል።
- source_word: δακρύων
  choice: በእንባ
  rationale: ተጨባጩንና ስሜታዊውን ምስል በቀጥታ ይጠብቃል።
- source_word: πειρασμῶν
  choice: ፈተናዎች
  rationale: ቃሉ ፈተናን፣ መፈተንን ወይም ፈታኝ መከራን ሊያመለክት ይችላል። እዚህ ከሴራዎቹ ጋር ያለው አውድ ውጫዊ መከራዎችን ያመለክታል፤ «ፈተናዎች» የቃሉን ስፋት ይጠብቃል።
- source_word: τῶν συμβάντων μοι
  choice: በደረሱብኝ
  rationale: በጳውሎስ ላይ የደረሱትን ፈተናዎች ግልጽና ተፈጥሯዊ በሆነ አማርኛ ይገልጣል።
- source_word: ἐν ταῖς ἐπιβουλαῖς
  choice: በሴራዎች ምክንያት
  rationale: ἐν እዚህ ሴራዎቹ ፈተናዎቹ የደረሱበት ሁኔታና መንስኤ መሆናቸውን ያሳያል፤ «ምክንያት» ይህን ግንኙነት በግልጽ አማርኛ ያቀርባል።
- source_word: τῶν Ἰουδαίων
  choice: የአይሁድ
  rationale: የግሪኩን መደበኛ የሕዝብ ስያሜ በቀጥታ ይጠብቃል። በአውዱ ግን ሴራውን የጠነሰሱትን የተወሰኑ ተቃዋሚዎች እንጂ አይሁድን ሁሉ አያመለክትም።
theological_decisions:
- issue: «የአይሁድ» የሚለው አገላለጽ አይሁድን ሁሉ እንደሚወነጅል ተደርጎ የመነበብ አደጋ
  choice: የግሪኩን «τῶν Ἰουδαίων» በቀጥታ «የአይሁድ» ብሎ ማቆየት፣ ነገር ግን በማስታወሻ በጳውሎስ ላይ የሸረቡትን የተወሰኑ አይሁዳዊ ተቃዋሚዎች እንደሚያመለክት ማብራራት
  alternative: የአይሁድ መሪዎች፤ የይሁዳ ሰዎች
  rationale: ጽሑፉ Ἰουδαίων ይላል እንጂ ለመሪዎች ብቻ አይገድበውም። ሆኖም አውዱ ሁሉንም አይሁድ ሳይሆን የሴራውን ተሳታፊዎች ይጠቁማል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩ አሳታፊ አወቃቀር «እያገለገልኩ» ተብሎ ተጠብቋል፤ ስለዚህ ክፍሉ ከቀደመው ዓረፍተ ነገር ጋር የሚቀጥል መሆኑን ለማሳየት በድርብ ነጥብ ሰረዝ ተዘግቷል።
