base_translation:
  language: en
  yaml_path: translation/nt/acts/020/003.yaml
  text: After spending three months there[a], when a plot was made against him by the Jews as he was about to sail for Syria[d][c][b], he decided to return through Macedonia.
translation:
  language: am
  text: በዚያም ሦስት ወር ካሳለፈ በኋላ፣ ወደ ሶርያ በመርከብ ሊጓዝ ሲል በአይሁድ[a] ሴራ ስለተደረገበት፣ በመቄዶንያ በኩል ለመመለስ ወሰነ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክኛ፣ “አይሁድ።” በሐዋርያት ሥራ ውስጥ ይህ አገላለጽ ብዙ ጊዜ በዐውዱ ጳውሎስን የሚቃወም የተወሰነ ቡድን እንጂ ሁሉንም የአይሁድ ሕዝብ ያለ ልዩነት አያመለክትም።
    reason: cultural_note
lexical_decisions:
- source_word: ποιήσας τε μῆνας τρεῖς
  choice: በዚያም ሦስት ወር ካሳለፈ በኋላ
  rationale: ποιέω ከጊዜ መጠን ጋር ሲመጣ ‘ጊዜን ማሳለፍ’ የሚለውን ፈሊጣዊ ትርጉም ይሰጣል። ‘በዚያ’ ከቀደመው ቁጥር ዐውድ የተሟላ ሲሆን አማርኛውን ተፈጥሯዊ ያደርገዋል።
- source_word: γενομένης ἐπιβουλῆς αὐτῷ
  choice: ሴራ ስለተደረገበት
  rationale: የግሪኩ genitive absolute ጊዜንና ምክንያታዊ ሁኔታን ያመለክታል፤ ἐπιβουλή የጥቃት ወይም የጉዳት ድብቅ ዕቅድን ያመለክታል። ይህ አገላለጽ በእርሱ ላይ የተቃጣውን ሴራ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ὑπὸ τῶν Ἰουδαίων
  choice: በአይሁድ
  rationale: የግሪኩን ግልጽ ስያሜ ሳያለዝብ ይጠብቃል፤ ነገር ግን በዐውዱ ሁሉንም የአይሁድ ሕዝብ እንደማያመለክት በማስታወሻ ተብራርቷል።
- source_word: μέλλοντι ἀνάγεσθαι εἰς τὴν Συρίαν
  choice: ወደ ሶርያ በመርከብ ሊጓዝ ሲል
  rationale: μέλλω በቅርቡ ሊፈጸም ያለን ድርጊት ያሳያል፤ ἀνάγεσθαι በዚህ የጉዞ ዐውድ በባሕር መነሣትን ወይም መጓዝን ያመለክታል።
- source_word: ἐγένετο γνώμης τοῦ ὑποστρέφειν
  choice: ለመመለስ ወሰነ
  rationale: ἐγένετο γνώμης ወደ ውሳኔ መድረስን የሚገልጽ ፈሊጥ ሲሆን፣ የarticular infinitiveውም የውሳኔውን ይዘት ያሳያል።
- source_word: διὰ Μακεδονίας
  choice: በመቄዶንያ በኩል
  rationale: διά ከgenitive ጋር በዚህ ስፍራ የጉዞውን መንገድ ያመለክታል፤ ‘በ…በኩል’ ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: በግጭት ትረካው ውስጥ ‘አይሁድ’ የሚለው ስያሜ የሚያመለክተው
  choice: ‘በአይሁድ’ የሚለውን የምንጩን አገላለጽ በዋናው ጽሑፍ ማቆየትና ዐውዳዊ ወሰኑን በግርጌ ማስታወሻ ማብራራት
  alternative: ‘በአንዳንድ አይሁድ’ ወይም ‘በአይሁድ ተቃዋሚዎች’ ብሎ በዋናው ጽሑፍ መተርጎም
  rationale: τῶν Ἰουδαίων በግልጽ ‘አይሁድ’ ይላል። ይህን በዋናው ጽሑፍ መቀየር የምንጩን አገላለጽ ያለዝባል፤ በሌላ በኩል ዐውዱን የሚያልፍ የዘር አጠቃላይ ፍርድ እንዳይሰጥ ማስታወሻው ያብራራል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ የትረካ አማርኛ ተጠቅሟል። ‘በመርከብ ሊጓዝ’ የባሕር ጉዞውን በግልጽ ያሳያል፤ ‘ሴራ ስለተደረገበት’ የምንጩን ተገብሮአዊ አቀራረብ በተፈጥሯዊ መልኩ ይጠብቃል።
