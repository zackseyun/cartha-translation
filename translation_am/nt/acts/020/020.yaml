    reason: የὑπεστειλάμηνን “ወደ ኋላ ማለት” ምስላዊ አማራጭ እና የἀναγγεῖλαιን “ማሳወቅ” አማራጭ ያሳያል።
  revision_rationale: The revision removes the unsupported explicit clause “ታውቃላችሁ” and preserves ὡς with “እንዴት,” allowing the verse to remain syntactically connected to its preceding context as in Greek. It also improves the natural Amharic expression of “anything beneficial to you,” while preserving the coordinated scope of Paul’s declaring and teaching.
