review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the two coordinated activities—declaring what was beneficial and teaching publicly and house to house—and renders ὑπεστειλάμην appropriately as not withholding/refraining. However, it adds “ታውቃላችሁ” (“you know”), which is not present in v. 20 itself; ὡς introduces the manner/content of Paul’s preceding reminder, “how.”
  naturalness: The main sentence is understandable, but “ለእናንተ የሚጠቅምን ነገር ሁሉ” is less idiomatic in this negative construction than “ምንም የሚጠቅማችሁን ነገር.” Removing the supplied finite clause also more naturally retains the verse’s dependence on the preceding context.
  terminology: “አልተቆጠብኩም,” “ማሳወቅ,” “ማስተማር,” and “ከቤት ወደ ቤት” are suitable modern-standard renderings. “በአደባባይ” adequately conveys public ministry without unnecessarily specifying a particular venue.
  issues:
  - severity: medium
    issue: The words “ታውቃላችሁ” are added to the verse.
    rationale: The Greek ὡς means “how” in its connection with the preceding discourse; it does not itself contain an explicit “you know.” The addition should be removed to avoid importing wording from the wider context into this verse.
  - severity: low
    issue: The beneficial-object phrase can be made more idiomatic and align more closely with the Greek negative construction.
    rationale: “ምንም የሚጠቅማችሁን ነገር” naturally expresses “anything beneficial to you” under “አልተቆጠብኩም,” while retaining the broad, non-financial sense of τῶν συμφερόντων.
  revised_text: እንዴት ምንም የሚጠቅማችሁን ነገር ከማሳወቅና በአደባባይና ከቤት ወደ ቤት ከማስተማር እንዳልተቆጠብኩ።[a]
