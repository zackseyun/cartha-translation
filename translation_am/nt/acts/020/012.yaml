    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγον
  choice: ይዘውት ሄዱ
  rationale: ἄγω መምራትን ወይም ይዞ መሄድን/ማምጣትን ሊገልጽ ይችላል። በዚህ ዐውድ ሰዎቹ ልጁን በሕይወት ከዚያ ይዘውት መሄዳቸውን “ይዘውት ሄዱ” በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: παῖδα
  choice: ልጁን
  rationale: παῖς ልጅን ወይም አገልጋይን ሊያመለክት ቢችልም፣ እዚህ በቁጥር 9 “ወጣት” ተብሎ የተጠቀሰውን አውጤኪስን ይመለከታል፤ “ልጁን” የአገልጋይነት ትርጉም ሳያስገባ የምንጩን ቃል ያንጸባርቃል።
- source_word: ζῶντα
  choice: በሕይወት
  rationale: ተሳቢው ልጁ በተወሰደበት ጊዜ የነበረበትን ሁኔታ ይገልጻል፤ “በሕይወት” ይህን በግልጽና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: παρεκλήθησαν
  choice: ተጽናኑ
  rationale: παρακαλέω ማበረታታትን፣ ማጽናናትን ወይም መለመንን ሊገልጽ ይችላል። ልጁ ከሞት አደጋ በኋላ በሕይወት በመገኘቱ የተሰማውን እፎይታና መጽናናት “ተጽናኑ” በዚህ ዐውድ በሚገባ ይገልጻል።
- source_word: οὐ μετρίως
  choice: እጅግም
  rationale: ቃል በቃል “በመጠኑ አይደለም” የሚለው አገላለጽ በአጽንዖት “እጅግ” ማለት ነው። “እጅግም” የአገላለጹን ኃይል ግልጽና ተፈጥሯዊ በሆነ አማርኛ ያስተላልፋል።
