  yaml_path: translation/nt/acts/020/035.yaml
  text: In everything I showed you that by laboring in this way it is necessary to help the weak[a], and to remember the words of the Lord Jesus, that he himself said, ‘It is more blessed to give than to receive.’
translation:
  language: am
  text: በሁሉም ነገር እንዲህ በትጋት በመሥራት ደካሞችን[a] መርዳት እንደሚገባ፣ እንዲሁም ጌታ ኢየሱስ ራሱ፣ «መስጠት ከመቀበል ይልቅ የበለጠ የተባረከ ነው» ብሎ የተናገራቸውን ቃሎች ማስታወስ እንደሚገባ አሳየኋችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ደካሞችን መደገፍ።» የግሪኩ ግስ ለጊዜው ብቻ ከመርዳት ይልቅ ቀጣይነት ያለውን ድጋፍም ሊያመለክት ይችላል።
    reason: lexical_alternative
