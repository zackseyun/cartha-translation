base_translation:
  language: en
  yaml_path: translation/nt/acts/020/013.yaml
  text: But we[a], having gone ahead to the ship, set sail for Assos, intending to take Paul on board from there, for so he had arranged[b], since he himself intended to go by land.
translation:
  language: am
  text: እኛ ግን ቀድመን ወደ መርከቡ ሄደን፣ ወደ አሶስ በመርከብ ተነሣን፤ ጳውሎስን ከዚያ በመርከብ ላይ ለመውሰድ አስበን ነበር። እርሱ ራሱ በእግር[a] ለመጓዝ ስላሰበ፣ ይህን እንዲህ አዘጋጅቶ ነበር[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በመሬት ለመጓዝ።” የግሪኩ πεζεύειν ቃል የጳውሎስን የመሬት ወይም የእግር ጉዞ ከቡድኑ የመርከብ ጉዞ ጋር ያነጻጽራል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “እንዲህ ተወስኖ ነበር።” የግሪኩ διατεταγμένος ἦν ቅርጽ በሰዋሰው ተገብሮ ነው፤ በአውዱ ግን ጳውሎስ ራሱ አስቀድሞ ያደረገውን ዝግጅት ወይም የሰጠውን መመሪያ ሊያመለክት ይችላል።
    reason: alternative_reading
