  yaml_path: translation/nt/acts/020/036.yaml
  text: And after saying these things, he knelt down with them all and prayed.
translation:
  language: am
  text: እነዚህንም ነገሮች ከተናገረ በኋላ፣ ከሁላቸው ጋር ተንበርክኮ ጸለየ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: እነዚህንም
  rationale: የግሪኩን ቀላል ትስስር በአማርኛው አያያዥ «-ም» ያሳያል፤ ከአውዱ በላይ ተጨማሪ የጊዜ ሐሳብ አያስገባም።
- source_word: ταῦτα εἰπὼν
  choice: እነዚህን ነገሮች ከተናገረ በኋላ
  rationale: የአዎርስት አሳታፊው ድርጊት ከዋናው ግስ በፊት መፈጸሙን በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: θεὶς τὰ γόνατα αὐτοῦ
  choice: ተንበርክኮ
  rationale: ቃል በቃል «ጉልበቶቹን አኖረ» የሚለው የግሪክ ፈሊጥ በአማርኛ «ተንበረከከ» ተብሎ በግልጽና በተፈጥሯዊ ሁኔታ ይገለጻል፤ ድንገተኛ መውደቅን አያመለክትም።
- source_word: σὺν πᾶσιν αὐτοῖς
  choice: ከሁላቸው ጋር
  rationale: σύν አብሮነትን፣ πᾶσιν ደግሞ የቡድኑን ሙሉ ተሳትፎ ያሳያሉ።
- source_word: προσηύξατο
  choice: ጸለየ
  rationale: προσεύχομαι ለጸሎት የሚያገለግለው መደበኛ ግስ ስለሆነ «ጸለየ» ቀጥተኛና ተፈጥሯዊ ትርጉም ነው።
