base_translation:
  language: en
  yaml_path: translation/nt/acts/020/010.yaml
  text: But Paul went down and fell upon him[a], and embracing him said, “Do not be alarmed[b], for his life is in him.”
translation:
  language: am
  text: ጳውሎስ ግን ወደ ታች ወርዶ በላዩ ላይ ተደፋ፤ አቅፎትም፣ “አትደናገጡ፤[b] ሕይወቱ በውስጡ አለና”[a] አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ነፍሱ በውስጡ አለ።” የግሪኩ ψυχή “ሕይወት፣” “ራስ” ወይም “ነፍስ” ማለት ሊሆን ይችላል፤ እዚህ ግን ጉዳዩ ሞቶ ወይስ በሕይወት እንዳለ ስለሆነ “ሕይወት” ከዐውዱ ጋር ይበልጥ ይስማማል።
    reason: lexical_alternative
  - marker: b
    text: የጳውሎስ ቃል ወጣቱ ፈጽሞ አልሞተም ማለት ወይም ሕይወቱ ተመልሶለታል ማለት ሊሆን ይችላል፤ የግሪኩ አገላለጽ ራሱ ከሁለቱ የትኛው እንደሆነ በግልጽ አይወስንም።
    reason: alternative_reading
lexical_decisions:
- source_word: καταβὰς
  choice: ወደ ታች ወርዶ
