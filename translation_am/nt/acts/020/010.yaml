- source_word: ἐπέπεσεν αὐτῷ
  choice: በላዩ ላይ ተደፋ
  rationale: አካላዊውን ድርጊት በቅርብ ይጠብቃል፤ ከኤልያስና ከኤልሳዕ ታሪኮች ጋር ሊኖረው የሚችለውን የቃላት አስተጋብኦም አይደብቅም።
- source_word: συμπεριλαβὼν
  choice: አቅፎትም
  rationale: ሰውነቱን በእጆች ዙሪያ ይዞ ማቀፍን በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: Μὴ θορυβεῖσθε
  choice: አትደናገጡ
  rationale: በወጣቱ መውደቅ ምክንያት የተነሣውን ድንጋጤና መረበሽ በዘመናዊና ግልጽ አማርኛ ያስተላልፋል።
- source_word: ἡ γὰρ ψυχὴ αὐτοῦ
  choice: ሕይወቱ … አለና
  rationale: ψυχή ሕይወትን፣ ራስን ወይም ነፍስን ሊያመለክት ይችላል፤ እዚህ ያለው ቅርብ ዐውድ ግን ወጣቱ ሞቶ ወይስ በሕይወት እንዳለ የሚመለከት ስለሆነ “ሕይወቱ” ተመርጧል።
- source_word: ἐν αὐτῷ ἐστιν
  choice: በውስጡ አለ
  rationale: የግሪኩን አገላለጽ በቀጥታ ይጠብቃል፤ ሕይወቱ እንዳልወጣ ወይም እንደተመለሰ አስቀድሞ አይወስንም።
theological_decisions:
- issue: በሕይወትና ሞት ዐውድ ውስጥ የψυχή ትርጉም
  choice: “ነፍስ” ሳይሆን “ሕይወት” ተብሎ ተተርጉሟል።
  alternative: “ነፍሱ በውስጡ አለ።”
  rationale: ዐውዱ ከውድቀቱ በኋላ የወጣቱን አካላዊ ሁኔታ ይመለከታል። “ሕይወት” የተለመደውን የግሪክ አጠቃቀም ያንጸባርቃል፤ ጥቅሱ በቀጥታ የማያነሣውን ስለ ነፍስ የተለየ ሥነ መለኮታዊ አቋምም አያስገባም።
- issue: ወጣቱ ፈጽሞ አልሞተም ወይስ ከሞት ተመለሰ?
  choice: ዋናው ጽሑፍ “ሕይወቱ በውስጡ አለ” በማለት ገለልተኛ ሆኖ ቀርቧል።
  alternative: “በሕይወት አለ” ወይም “ሕይወቱ ተመልሶለታል” የሚሉ ትርጓሜያዊ አቀራረቦች።
  rationale: የግሪኩ አገላለጽ ሕይወቱ በውስጡ እንዳለ ይናገራል እንጂ ቀድሞውኑ አልሞተም ወይስ ሕይወቱ ተመለሰ የሚለውን በግልጽ አይወስንም።
