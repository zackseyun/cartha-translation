  text: καὶ τὰ νῦν παρατίθεμαι ⸀ὑμᾶς τῷ ⸀θεῷ καὶ τῷ λόγῳ τῆς χάριτος αὐτοῦ, τῷ δυναμένῳ ⸀οἰκοδομῆσαι καὶ δοῦναι ⸀τὴν κληρονομίαν ἐν τοῖς ἡγιασμένοις πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/032.yaml
  text: And now I entrust you to God and to the word of his grace[a], which is able to build up and to give the inheritance among all those who have been sanctified.
translation:
  language: am
  text: አሁንም እናንተን ለእግዚአብሔርና ለጸጋው ቃል[a] አደራ እሰጣችኋለሁ፤ እርሱም ሊያጠነክራችሁና በተቀደሱት ሁሉ መካከል ርስቱን ሊሰጣችሁ ይችላል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “እርሱ” የሚለው በዋነኝነት እግዚአብሔርን ሊያመለክት ይችላል፤ በዋናው ጽሑፍ ግን የቀደመውን “የጸጋው ቃል” ያመለክታል።
    reason: alternative_reading
lexical_decisions:
- source_word: παρατίθεμαι
  choice: አደራ እሰጣችኋለሁ
  rationale: የመካከለኛ ድምፁ አድማጮቹን በሌላ አካል ጥበቃ ሥር የማኖርን ሐሳብ ይገልጣል፤ ይህ አገላለጽ በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: τῷ θεῷ
  choice: ለእግዚአብሔር
  rationale: ከπαρατίθεμαι ጋር ያለውን የተቀባይ ዳቲቭ በቀጥታ ያሳያል።
- source_word: τῷ λόγῳ τῆς χάριτος αὐτοῦ
  choice: ለየጸጋው ቃል
  rationale: የግሪኩን የጄኒቲቭ አወቃቀርና λόγος ያለውን መጽሐፍ ቅዱሳዊ ክብደት ይጠብቃል። በዋናው ጽሑፍ ግን ከቀዳሚው ለ- ጋር ተዋሕዶ ‘ለሚችለው የጸጋው ቃል’ ተብሎ ተዋቅሯል።
- source_word: τῷ δυναμένῳ
  choice: ለሚችለው
  rationale: በቅርብ ካለው ‘የጸጋው ቃል’ ጋር እንዲያመለክት ተተርጉሟል፤ የግሪኩን ዳቲቭ ነጠላ ቅርጽም ይጠብቃል። እግዚአብሔርን እንደሚያመለክት የሚወስደው አማራጭ በግርጌ ማስታወሻ ተጠብቋል።
- source_word: οἰκοδομῆσαι
  choice: ሊያንጻችሁ
  rationale: የመንፈሳዊ መገንባትና ማጽናት ዘይቤያዊ ትርጉሙን ይጠብቃል፤ ከአውዱ የሚገባው ተሳቢ ‘እናንተን’ በግስ ቅጥያው ግልጽ ሆኗል።
- source_word: δοῦναι τὴν κληρονομίαν
  choice: ርስቱን ሊሰጣችሁ
  rationale: ቀጥተኛውን ተሳቢ ‘ርስቱን’ ይጠብቃል፤ ከአውዱ የሚገባው ተቀባይ በ‘-አችሁ’ ተገልጧል።
- source_word: κληρονομίαν
  choice: ርስቱን
  rationale: የመጽሐፍ ቅዱስን የርስት ሐሳብ በታወቀና ቀጥተኛ ቃል ይጠብቃል።
- source_word: ἐν τοῖς ἡγιασμένοις πᾶσιν
  choice: በተቀደሱት ሁሉ መካከል
  rationale: የἁγιάζωን ፍጹም ተደራጊ አንቀጽ በግሳዊ መልኩ ይጠብቃል፤ ἐν ደግሞ በማኅበር ወይም በክፍል ውስጥ መካተትን በሚያሳየው ‘መካከል’ ተተርጉሟል።
theological_decisions:
- issue: የτῷ δυναμένῳ (‘የሚችለው’) መወከሻ
  choice: በዋናው ጽሑፍ በቅርብ ያለውን ‘የጸጋው ቃል’ እንዲያመለክት ተተርጉሟል።
  alternative: ሐረጉ በዋነኝነት እግዚአብሔርን ሊያመለክት ይችላል።
  rationale: የግሪኩ አገባብ ሁለቱንም ንባቦች ይፈቅዳል። ‘የጸጋው ቃል’ በቅርብ ቀዳሚ ስለሆነ በዋናው ጽሑፍ ይህ ንባብ ተመርጧል፤ የአድራጊነት ሐሳቡን በዝምታ ላለመወሰን ሌላው ንባብ በግርጌ ማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘አደራ እሰጣችኋለሁ’ ተፈጥሯዊ ነው፤ ‘የጸጋው ቃል’፣ ‘ርስት’ እና ‘ተቀደሱት’ ደግሞ የምንጩን መጽሐፍ ቅዱሳዊ ክብደት ይጠብቃሉ።
