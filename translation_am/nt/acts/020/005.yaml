lexical_decisions:
- source_word: οὗτοι
  choice: እነዚህ
  rationale: ተውላጠ አመልካቱ በቀደመው ክፍል የተጠቀሱትን ወንዶች ያመለክታል፤ በአማርኛ «እነዚህ» ብቻውን ይህን በተፈጥሮ ያስተላልፋል።
- source_word: δὲ
  choice: -ም
  rationale: ቀላል አያያዥነቱን በአማርኛ ተፈጥሯዊ በሆነው ተያያዥ ቅጥያ «-ም» ተርጉሟል።
- source_word: προσελθόντες
  choice: ቀድመው ሄደው
  rationale: በዚህ የጉዞ አውድ ቡድኑን ቀድመው መሄዳቸውን ያመለክታል፤ የአሳቢውን አንጻራዊ እይታ ሳያስገድድ በግልጽ አማርኛ ቀርቧል።
- source_word: ἔμενον
  choice: ይጠብቁን ነበር
  rationale: μέγω? No, μένω በመሠረቱ «መቆየት» ቢሆንም ከἡμᾶς ጋር በዚህ የጉዞ አውድ «እኛን መጠበቅ» የሚለውን ያሳያል፤ የኢምፐርፌክት ቀጣይነትም «ነበር» በሚለው ተጠብቋል።
- source_word: ἡμᾶς
  choice: -ን
  rationale: የመጀመሪያ መደብ ብዙ ቁጥር ተሳቢ «እኛን» በግሱ ላይ በተያያዘው «-ን» በተፈጥሯዊ አማርኛ ተገልጧል።
- source_word: ἐν Τρῳάδι
  choice: በጢሮአዳ
  rationale: ἐν የቦታ ትርጉሙ በ«በ-» ተላልፏል፤ የቦታውም ስም በተለመደው የአማርኛ ቅጽ «ጢሮአዳ» ቀርቧል።
