  rationale: ἐπιθυμέω መመኘትን ወይም የሌላውን ንብረት መፈለግን ሊያመለክት ይችላል። በአሉታዊው አወቃቀር «አልተመኘሁም» የግሪኩን ሥነ ምግባራዊ አውድ በተፈጥሯዊና በክብር የተሞላ አማርኛ ያስተላልፋል።
- source_word: ἢ ... ἢ ... ἢ
  choice: ወይም ... ወይም ... ወይም
  rationale: በግሪኩ ያለውን ተደጋጋሚ አማራጭ አያያዥ በቀጥታ ይጠብቃል፤ ከአሉታዊው ግስ ጋር በአማርኛም ግልጽ ነው።
theological_decisions:
- issue: ἐπιθυμέω ስለ ቁሳዊ ንብረት ያለው ሥነ ምግባራዊ ፍቺ
  choice: «አልተመኘሁም» በማለት የሌላ ሰውን ንብረት በስስት አለመፈለግን ማስተላለፍ
