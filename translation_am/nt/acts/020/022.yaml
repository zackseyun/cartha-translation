  to: አሁንም እነሆ፣ በመንፈስ ታስሬ[a] በዚያ የሚደርስብኝን ሳላውቅ ወደ ኢየሩሳሌም እሄዳለሁ።
  rationale: The revision preserves the draft's careful ambiguity concerning τῷ πνεύματι and retains all of its lexical strengths. It changes only the placement and form of the final clause so that Amharic more closely reflects μὴ εἰδώς (‘not knowing’) as a circumstance accompanying Paul’s journey.
