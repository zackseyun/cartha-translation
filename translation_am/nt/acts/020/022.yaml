id: ACT.20.22
reference: Acts 20:22
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ νῦν ἰδοὺ ⸂δεδεμένος ἐγὼ⸃ τῷ πνεύματι πορεύομαι εἰς Ἰερουσαλήμ, τὰ ἐν αὐτῇ συναντήσοντά ⸀μοι μὴ εἰδώς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/022.yaml
  text: And now, behold, bound in the Spirit, I am going to Jerusalem, not knowing what will happen to me there,
translation:
  language: am
  text: አሁንም እነሆ፣ በመንፈስ ታስሬ[a] በዚያ የሚደርስብኝን ሳላውቅ ወደ ኢየሩሳሌም እሄዳለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በራሴ መንፈስ ታስሬ።” የግሪኩ አገላለጽ የጳውሎስን የራሱን መንፈስ ወይም መንፈስ ቅዱስን ሊያመለክት ይችላል፤ “በመንፈስ ተገድጄ” ተብሎም ሊገባ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: የንግግሩን አጽንዖትና ወደ አዲስ ነጥብ የሚያስገባውን ኃይል በክብር ያስቀምጣል።
- source_word: δεδεμένος
  choice: ታስሬ
  rationale: ‘ታስሬ’ የሚለው የδέωን የመታሰር ምሳሌያዊ ኃይል ይጠብቃል፤ ‘ተገድጄ’ ብሎ ትርጉሙን ከሚወስን አተረጓጎም ይልቅ አሻሚነቱን ያቆያል።
- source_word: τῷ πνεύματι
  choice: በመንፈስ
  rationale: ይህ አገላለጽ መንፈስ ቅዱስን ወይም የጳውሎስን ውስጣዊ መንፈስ ሊያመለክት የሚችለውን የግሪኩን አሻሚነት በአማርኛም በተወሰነ ደረጃ ይጠብቃል።
- source_word: πορεύομαι
  choice: እሄዳለሁ
  rationale: በአሁኑ ጊዜ እየተከናወነ ወይም ወዲያው የሚከናወን ጉዞን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: τὰ ἐν αὐτῇ συναντήσοντά μοι
  choice: በዚያ ምን እንደሚደርስብኝ
  rationale: ቃል በቃል ‘በእርሷ የሚገጥሙኝን ነገሮች’ የሚለውን ሐሳብ ተፈጥሯዊና ግልጽ በሆነ አማርኛ ያቀርባል።
- source_word: μὴ εἰδώς
  choice: አላውቅም
  rationale: የግሪኩን አሉታዊ አሳታፊ ሐረግ በአማርኛ ተፈጥሯዊ በሆነ ዋና ግስ ይገልጣል።
- source_word: Ἰερουσαλήμ
  choice: ኢየሩሳሌም
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የቦታውን ስም ይጠቀማል።
theological_decisions:
- issue: የτῷ πνεύματι አመልካች
  choice: ዋናው ጽሑፍ ‘በመንፈስ’ ይላል፤ መንፈስ ቅዱስ ዋነኛው አማራጭ ቢሆንም በቀጥታ አይወስነውም።
  alternative: የጳውሎስ የራሱ መንፈስ፣ ወይም ‘በመንፈስ ተገድጄ’ የሚል የግዴታ ትርጉም።
  rationale: በሐዋርያት ሥራ ውስጥ መንፈስ ቅዱስ በተደጋጋሚ መጠቀሱና የቅርብ ዐውደ ንባቡ ይህን ንባብ ይደግፋሉ፤ ሆኖም የግሪኩ የዳቲቭ አገባብ አንድ ትርጉም ብቻ አያስገድድም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለው አማርኛ ይጠቀማል። ‘እነሆ’ የምንጩን አጽንዖት ሲጠብቅ፣ ‘በመንፈስ ታስሬ’ ደግሞ ምሳሌያዊነቱንና ሥነ መለኮታዊ አሻሚነቱን ያቆያል።
