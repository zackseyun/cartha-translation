- source_word: διακονίαν
  choice: አገልግሎት
  rationale: ከጌታ ኢየሱስ የተሰጠውን ተልእኮና አገልጋይነት በሰፊው የሚይዝ የተለመደ አማርኛ ነው።
- source_word: παρὰ τοῦ κυρίου Ἰησοῦ
  choice: ከጌታ ኢየሱስ የተቀበልኩትን
  rationale: παρά ከባለቤት አገናዛቢ ጋር የምንጭን ሐሳብ ያሳያል፤ ትርጉሙም አገልግሎቱ ከጌታ ኢየሱስ እንደተሰጠ ያስቀምጣል።
- source_word: διαμαρτύρασθαι
  choice: መመስከርን
  rationale: ቃሉ በአጽንዖት ምስክርነት መስጠትን ያመለክታል፤ ‘መመስከር’ ዋናውን ፍቺ በግልጽና በተለመደ አማርኛ ይሰጣል።
- source_word: εὐαγγέλιον τῆς χάριτος τοῦ θεοῦ
  choice: የእግዚአብሔርን ጸጋ ወንጌል
  rationale: የግሪኩን የባለቤትነት ሰንሰለት በአጭር አማርኛ ያቆያል፤ ወንጌሉ በእግዚአብሔር ጸጋ የተለየ ወይም ስለዚያ ጸጋ የሚናገር መሆኑን ከሁለቱ አንዱን ሳያጠብ ለአውዱ ይተዋል።
