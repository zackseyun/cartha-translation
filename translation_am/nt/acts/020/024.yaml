  text: ἀλλ’ οὐδενὸς ⸀λόγου ⸀ποιοῦμαι τὴν ⸀ψυχὴν τιμίαν ἐμαυτῷ ὡς ⸀τελειῶσαι τὸν δρόμον ⸀μου καὶ τὴν διακονίαν ἣν ἔλαβον παρὰ τοῦ κυρίου Ἰησοῦ, διαμαρτύρασθαι τὸ εὐαγγέλιον τῆς χάριτος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/024.yaml
  text: 'But I do not count my life as of any value to myself[c][b][a], if only I may finish my course and the ministry that I received from the Lord Jesus: to testify to the gospel of the grace of God.'
translation:
  language: am
  text: ነገር ግን ሕይወቴን[a] ለራሴ ውድ ነገር አድርጌ አልቆጥራትም፤ ሩጫዬን[b]ና ከጌታ ኢየሱስ የተቀበልኩትን አገልግሎት፣ ማለትም የእግዚአብሔርን የጸጋ ወንጌል መመስከር[c]፣ ማጠናቀቅ ብቻ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ‘ነፍሴን ለራሴ እንደ ውድ ነገር።’ እዚህ ‘ሕይወት’ የተመረጠው ጳውሎስ ተልእኮውን ለመፈጸም ሞትን ለመጋፈጥ ፈቃደኛ ስለመሆኑ አውዱ ስለሚናገር ነው።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ ‘መንገዴን።’ የግሪኩ δρόμος ወደ ፍጻሜ የሚሮጡትን ሩጫ ወይም የሚጓዙትን መንገድ ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ ‘ምስክርነት መስጠት’ ወይም ‘በአጽንዖት መመስከር።’
    reason: lexical_alternative
lexical_decisions:
