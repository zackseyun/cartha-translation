  rationale: የግሪኩ አጭርና ጥብቅ አገባብ የጳውሎስን ዋነኛ ምኞት ወይም ግብ ይገልጣል። ይህ አተረጓጎም ዓላማውን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: δρόμον
