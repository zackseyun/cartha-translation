translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መዝገብ ተጠቅሟል። “ንቁ” የቀጣይ ንቃትን ትእዛዝ በአጭሩ ያቀርባል፤ የአረፍተ ነገሩ አወቃቀርም በአማርኛ ተፈጥሯዊነት ሲደራጅ የምንጩን ምክንያታዊ እና ግላዊ ኃይል ጠብቋል።
