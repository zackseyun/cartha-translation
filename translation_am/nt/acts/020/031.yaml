  to: ስለዚህ፣ ለሦስት ዓመታት ሌሊትና ቀን እያንዳንዱን በእንባ እየገሠጽሁ[a] እንዳላቋረጥኩ እያስታወሳችሁ ንቁ።
  rationale: 'The revision preserves the source’s syntax and emphasis more closely: the call to vigilance is qualified by a present participle (“remembering”), and Paul’s admonition is expressed as continuing action. It also strengthens the corrective pastoral sense of νουθετῶν while retaining the lexical alternative in a footnote.'
