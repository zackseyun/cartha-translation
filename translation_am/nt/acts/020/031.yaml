  text: διὸ γρηγορεῖτε, μνημονεύοντες ὅτι τριετίαν νύκτα καὶ ἡμέραν οὐκ ἐπαυσάμην μετὰ δακρύων νουθετῶν ἕνα ἕκαστον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/031.yaml
  text: Therefore stay alert[a], remembering that for three years, night and day, I did not stop admonishing each one with tears.
translation:
  language: am
  text: ስለዚህ፣ ለሦስት ዓመታት ሌሊትና ቀን እያንዳንዱን በእንባ እየገሠጽሁ[a] እንዳላቋረጥኩ እያስታወሳችሁ ንቁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እያስጠነቀቅሁ።” የግሪኩ ግስ ከማስተማርና ከማረም ጋር የተያያዘ ማስጠንቀቅንም ሊያጎላ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: ስለዚህ
  rationale: ከቀደመው ማስጠንቀቂያ የሚወጣውን ድምዳሜ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: γρηγορεῖτε
  choice: ንቁ
  rationale: የአሁን ጊዜ ትእዛዙ ቀጣይ ንቃትን ይጠይቃል፤ አጭርና ግልጽ የአማርኛ አገላለጽ ነው።
- source_word: μνημονεύοντες
  choice: አስታውሱ
  rationale: የግሪኩ ተውሳከ ግስ ከዋናው ትእዛዝ ጋር የተያያዘ ትውስታን ያሳያል፤ በአማርኛ እንደ ተያያዘ ትእዛዝ ማቅረብ ተፈጥሯዊ ነው።
- source_word: τριετίαν
  choice: ለሦስት ዓመታት
  rationale: የጊዜውን ቆይታ በግልጽ እና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: νύκτα καὶ ἡμέραν
  choice: ሌሊትና ቀን
  rationale: የምንጩን ቅደም ተከተልና ያላቋረጠ ትጋት የሚያመለክተውን ፈሊጥ ይጠብቃል።
- source_word: οὐκ ἐπαυσάμην
  choice: እንዳላቆምኩ
  rationale: ጳውሎስ ድርጊቱን እንዳላቋረጠ በዘመናዊና ግልጽ ቋንቋ ያሳያል።
- source_word: μετὰ δακρύων
  choice: በእንባ
  rationale: እንባ ከአገልግሎቱ ጋር አብሮ መኖሩንና የስሜቱን ክብደት በአጭሩ ይገልጣል።
- source_word: νουθετῶν
  choice: መምከሬን
  rationale: ቃሉ ሥነ ምግባራዊ እርማትን፣ ተግሣጽንና ማስጠንቀቅን ሊያካትት ይችላል፤ “መምከር” የእረኝነት እንክብካቤውንና የማረም ኃይሉን በተፈጥሯዊ አማርኛ ይይዛል።
- source_word: ἕνα ἕκαστον
  choice: እያንዳንዱን
  rationale: ለየግለሰቡ የተሰጠውን ትኩረት በታማኝነት ያሳያል፤ በምንጩ ያልተገለጸውን “ከእናንተ” አይጨምርም።
theological_decisions:
- issue: የνουθετῶν የእረኝነትና የማረም ኃይል
  choice: መምከሬን
