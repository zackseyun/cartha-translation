source:
  edition: SBLGNT
  text: ⸀διότι μαρτύρομαι ὑμῖν ἐν τῇ σήμερον ἡμέρᾳ ὅτι καθαρός ⸀εἰμι ἀπὸ τοῦ αἵματος πάντων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/026.yaml
  text: Therefore I testify to you on this day that I am innocent of the blood of all[a][b].
translation:
  language: am
  text: ስለዚህ በዚህች ዕለት ከሁሉም ደም ንጹሕ መሆኔን[a][b] እመሰክርላችኋለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከሁሉም ደም ነጻ ነኝ።” የግሪኩ ፈሊጣዊ አነጋገር በሌሎች ጉዳይ ከበደል ወይም ከተጠያቂነት ነጻ መሆንን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ይህ አነጋገር በሕዝቅኤል መጽሐፍ ያለውን የጠባቂና የደም በደል ምስል የሚያስተጋባ ይመስላል (ሕዝ 3፥18–19፤ 33፥6–9)።
    reason: cross_reference
lexical_decisions:
- source_word: διότι
  choice: ስለዚህ
  rationale: ከቀደመው ንግግር የሚወጣውን ድምዳሜ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: μαρτύρομαι ὑμῖν
  choice: እመሰክርላችኋለሁ
  rationale: የግሱን ግላዊና የተከበረ ምስክርነት ኃይል ይጠብቃል፤ ὑμῖνንም በአማርኛው ተዋሕዶ ቅጥያ ይወክላል።
- source_word: ἐν τῇ σήμερον ἡμέρᾳ
  choice: በዚህች ዕለት
  rationale: ከቀላሉ ‘ዛሬ’ ይልቅ የምንጩን የተከበረና ምስክርነታዊ ቃና ይጠብቃል።
- source_word: καθαρός εἰμι
  choice: ንጹሕ እንደሆንሁ
  rationale: καθαρός የሚለውን ምስል በቅርብ ይጠብቃል፤ በዐውዱ ግን ከበደልና ከተጠያቂነት ነጻ መሆንን ያመለክታል።
- source_word: ἀπὸ τοῦ αἵματος πάντων
  choice: የሁሉም ደም
  rationale: የግሪኩን ሰፊ ‘ሁሉ’ እና የደም በደል ፈሊጣዊ ምስል ሳያብራራ ይጠብቃል።
theological_decisions:
- issue: ‘የሁሉም ደም ንጹሕ’ የሚለው አገላለጽ ትርጉም
  choice: ጳውሎስ የማስጠንቀቅና የማስተማር ኃላፊነቱን ስለፈጸመ በሌሎች ደም ወይም ጥፋት ተጠያቂ እንዳልሆነ የሚያሳይ ፈሊጣዊ አነጋገር
  alternative: በማንኛውም ሰው አካላዊ ሞት በቀጥታ እጁ እንዳልነበረበት ብቻ የሚገልጽ ንባብ
  rationale: የቅርብ ዐውዱ ጳውሎስ ምንም ሳይተው ማወጁን ይጠቅሳል፤ አገላለጹም በሕዝቅኤል ያለውን የጠባቂና የደም በደል ምስል ያስተጋባል። ዋናው ጽሑፍ ምስሉን ሳያፈርስ ይጠብቃል፤ ማስታወሻውም ፈሊጣዊ ኃይሉን ያብራራል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። ‘በዚህች ዕለት’ የምንጩን ሥርዓታዊ ቃና ሲጠብቅ፣ ‘የሁሉም ደም ንጹሕ’ የመጽሐፍ ቅዱሳዊውን ምስልና ትርጉማዊ ውጥረት አያጠፋም።
