  text: συνείπετο δὲ ⸀αὐτῷ Σώπατρος ⸀Πύρρου Βεροιαῖος, Θεσσαλονικέων δὲ Ἀρίσταρχος καὶ Σεκοῦνδος, καὶ Γάϊος Δερβαῖος καὶ Τιμόθεος, Ἀσιανοὶ δὲ Τυχικὸς καὶ Τρόφιμος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/004.yaml
  text: And Sopater son of Pyrrhus[a], a Berean, accompanied him; and Aristarchus and Secundus from Thessalonica; and Gaius of Derbe, and Timothy[b]; and Tychicus and Trophimus from Asia.
translation:
  language: am
  text: የቤርያው የጲሮስ ልጅ ሶጳጥሮስ፣ ከተሰሎንቄም አርስጥሮኮስና ሴኮንዶስ፣ የደርቤው ጋይዮስና ጢሞቴዎስ፣ ከእስያም[a] ጢኪቆስና ጥሮፊሞስ አብረውት ሄዱ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: እዚህ “እስያ” የሚለው የጥንቱን የሮም እስያ ክፍለ ግዛት እንጂ የዘመኑን የእስያ አህጉር አያመለክትም።
    reason: cultural_note
lexical_decisions:
- source_word: συνείπετο
  choice: ከእርሱ ጋር ይጓዙ ነበር
  rationale: የግሱን አብሮ መሄድና ቀጣይ የጉዞ ሁኔታ የሚያሳየውን ያልተፈጸመ ዘመን በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ብዙ ሰዎች ስለተዘረዘሩ ግሱ በብዙ ቁጥር ተቀምጧል።
- source_word: αὐτῷ
  choice: ከእርሱ ጋር
  rationale: ተውላጠ ስሙ በአውዱ ጳውሎስን ያመለክታል፤ ከσυνείπετο ጋር በአማርኛ ‘ከእርሱ ጋር’ ብሎ መተርጎም ተፈጥሯዊ ነው።
- source_word: Σώπατρος Πύρρου Βεροιαῖος
  choice: የቤርያው የጲሮስ ልጅ ሶጳጥሮስ
  rationale: Πύρρου የአባት ስምን ‘የጲሮስ ልጅ’ በማለት ያሳያል፤ Βεροιαῖος ደግሞ ከቤርያ መሆኑን ይገልጣል።
- source_word: Θεσσαλονικέων
  choice: ከተሰሎንቄ
  rationale: የብዙ ቁጥር የባለቤትነት ቅርጹ አርስጥሮኮስንና ሴኮንዶስን ከተሰሎንቄ ሰዎች መካከል እንደሆኑ ይመድባል፤ ‘ከተሰሎንቄ’ ይህን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Γάϊος Δερβαῖος
  choice: የደርቤው ጋይዮስ
  rationale: Δερβαῖος የቦታ መገኛን የሚገልጽ ስለሆነ ‘የደርቤው’ የሚለው ተፈጥሯዊና አጭር ነው።
- source_word: Ἀσιανοὶ
  choice: ከእስያ
  rationale: በዚህ አውድ የሮም ግዛት የነበረችውን እስያ ያመለክታል፤ የዘመኑ አህጉር እንዳይመስል የግርጌ ማስታወሻ ተጨምሯል።
- source_word: δέ ... δέ ... δέ
  choice: …ም …ም …ም
  rationale: ተደጋጋሚውን የዝርዝር መደመር በአማርኛ የአያያዝ ቅጥያ ‘-ም’ በተፈጥሯዊ ሁኔታ ያሳያል።
