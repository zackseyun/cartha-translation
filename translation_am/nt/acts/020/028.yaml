  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀προσέχετε ἑαυτοῖς καὶ παντὶ τῷ ποιμνίῳ, ἐν ᾧ ὑμᾶς τὸ πνεῦμα τὸ ἅγιον ἔθετο ἐπισκόπους, ποιμαίνειν τὴν ἐκκλησίαν τοῦ ⸀θεοῦ, ἣν περιεποιήσατο διὰ τοῦ ⸂αἵματος τοῦ ἰδίου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/028.yaml
  text: Pay careful attention to yourselves and to all the flock[a], in which the Holy Spirit has appointed you overseers, to shepherd the church of God[c][b], which he obtained through the blood of his own.
translation:
  language: am
  text: ለራሳችሁና ለመንጋው ሁሉ በጥንቃቄ ተጠንቀቁ፤ መንፈስ ቅዱስ በዚያ መንጋ ውስጥ ተቆጣጣሪዎች አድርጎ ሾሟችኋል፤ እርሱም በገዛ ልጁ ደም[b][c] ለራሱ ያገኛትን የእግዚአብሔርን ቤተ ክርስቲያን[a] እረኞች ሆናችሁ ጠብቁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች “የጌታ ቤተ ክርስቲያን” ይላሉ።
    reason: textual_variant
  - marker: b
    text: ወይም፣ “በገዛው ደም”።
    reason: alternative_reading
  - marker: c
    text: ግሪክኛው ቃል በቃል “በገዛው ደም” ይላል፤ “የገዛው” የሚለው ቃል በስም ፈንታ ሲገባ “የገዛው [ልጅ]” ሊያመለክት ይችላል። “ልጁ” የሚለው ቃል በግሪክኛው በግልጽ አልተጻፈም።
    reason: literal_form_and_ambiguity
lexical_decisions:
- source_word: προσέχετε
  choice: በጥንቃቄ ተጠንቀቁ
  rationale: የአሁን ጊዜ ትእዛዙ ቀጣይ ንቃትን ያመለክታል፤ አማርኛውም የራስንና የመንጋውን ሁኔታ በንቃት መከታተልን ያስተላልፋል።
- source_word: παντὶ τῷ ποιμνίῳ
  choice: ለመንጋው ሁሉ
  rationale: የእረኝነት ምሳሌያዊ አነጋገሩን ጠብቆ የመንጋውን ሙሉነት ያሳያል።
- source_word: ἐν ᾧ
  choice: በዚህ መንጋ መካከል
  rationale: መሪዎቹ ከመንጋው ውጭ ሳይሆኑ በውስጡ እንደተሾሙ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἔθετο ἐπισκόπους
  choice: ተቆጣጣሪዎች አድርጎ ሾሟችኋል
  rationale: ቃሉ የክትትልና የኃላፊነት ሥራ ላይ መመደብን ያመለክታል፤ ከጊዜ በኋላ የተፈጠረ የቤተ ክርስቲያን ማዕረግ በግድ አያስገባም።
- source_word: ποιμαίνειν
  choice: እረኞች ሆናችሁ እንድትጠብቁ
  rationale: የግሪክኛውን የእረኝነት ምስል በግልጽና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐκκλησίαν
  choice: ቤተ ክርስቲያን
  rationale: በዚህ ክፍል ቃሉ የእግዚአብሔርን የተሰበሰበ ሕዝብ የሚያመለክት የተለመደ አማርኛ አገላለጽ ነው።
- source_word: τοῦ θεοῦ
  choice: የእግዚአብሔርን
  rationale: የቀረበው SBLGNT ጽሑፍ θεοῦ ይላል፤ “የጌታ” የሚለው ልዩ ንባብ በማስታወሻ ተቀምጧል።
- source_word: περιεποιήσατο
  choice: ያገኛትን
  rationale: መካከለኛው የግስ ቅርጽ ለራስ ማግኘትን ያመለክታል፤ “ገዛ” ከሚለው ይልቅ የንግድ ምስልን በማያበዛ መንገድ ትርጉሙን ይገልጣል።
- source_word: διὰ τοῦ αἵματος
  choice: በ…ደም
  rationale: διά ከዝርያ አገባብ ጋር የመሣሪያን ወይም የመንገድን ፍቺ ይሰጣል፤ “በ…ደም” በአማርኛ ይህን በቀጥታ ያስተላልፋል።
- source_word: τοῦ ἰδίου
  choice: የገዛ ልጁ
  rationale: ἴδιος በስም ፈንታ ሲሠራ “የገዛ ወገኑ” የሚል ፍቺ ሊኖረው ይችላል፤ በአማርኛ “የገዛ ልጁ” ትርጉሙን በተፈጥሯዊ ሁኔታ ያቀርባል፣ የቃል በቃሉና ባህላዊው አማራጮች ግን በማስታወሻ ተጠብቀዋል።
