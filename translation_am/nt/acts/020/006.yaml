  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ἐξεπλεύσαμεν μετὰ τὰς ἡμέρας τῶν ἀζύμων ἀπὸ Φιλίππων, καὶ ἤλθομεν πρὸς αὐτοὺς εἰς τὴν Τρῳάδα ἄχρι ἡμερῶν πέντε, ⸀οὗ διετρίψαμεν ἡμέρας ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/006.yaml
  text: But we sailed away from Philippi after the days of Unleavened Bread[a], and came to them at Troas within five days, where we stayed seven days.
translation:
  language: am
  text: እኛ ግን የቂጣ በዓል ቀኖች ካለፉ በኋላ ከፊልጵስዩስ በመርከብ ተነሣን፤ በአምስት ቀን ውስጥ[a] በጢሮአዳ ወደ እነርሱ ደረስን። በዚያም ሰባት ቀን ቆየን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በአምስት ቀን።” የግሪኩ አገላለጽ እስከ ደረሱበት ጊዜ ድረስ የጉዞውን ቆይታ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεπλεύσαμεν
  choice: በመርከብ ተነሣን
  rationale: ግሱ ከአንድ ስፍራ በመርከብ መነሣትን ያመለክታል፤ ይህ አተረጓጎም ትርጉሙን በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: μετὰ τὰς ἡμέρας τῶν ἀζύμων
  choice: የቂጣ በዓል ቀኖች ካለፉ በኋላ
  rationale: የግሪኩን ‘ከቂጣው ቀኖች በኋላ’ የሚለውን ጊዜያዊ አመልካች በአማርኛ የታወቀውን የበዓሉን ስያሜ በመጠቀም በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: ἀπὸ Φιλίππων
  choice: ከፊልጵስዩስ
  rationale: ἀπό የመነሻ ስፍራን ያመለክታል፤ ፊልጵስዩስ የከተማዋ የተለመደ የአማርኛ ስያሜ ነው።
- source_word: ἤλθομεν πρὸς αὐτοὺς
  choice: ወደ እነርሱ ደረስን
  rationale: ወደ ሰዎቹ መምጣትንና መድረስን ያሳያል፤ ‘ከእነርሱ ጋር ተቀላቀልን’ የሚል ተጨማሪ ትርጓሜ አያስገባም።
- source_word: εἰς τὴν Τρῳάδα
  choice: ጢሮአዳ
  rationale: εἰς የመዳረሻውን ስፍራ ያመለክታል፤ ከ‘ደረስን’ ጋር በአማርኛ የመዳረሻ ስም በቀጥታ መቅረቡ ተፈጥሯዊ ነው።
- source_word: ἄχρι ἡμερῶν πέντε
  choice: በአምስት ቀን ውስጥ
  rationale: ሐረጉ እስከ መድረሳቸው ያለውን የጉዞ ጊዜ መጠን ያመለክታል፤ ‘ውስጥ’ መድረሳቸው እስከ አምስተኛው ቀን ድረስ መሆኑን ያሳያል።
- source_word: οὗ
  choice: በዚያም
  rationale: የዝምድና ቦታ ተውሳኩ ወደ ጢሮአዳ ይመለሳል፤ ‘በዚያም’ በአማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: διετρίψαμεν ἡμέρας ἑπτά
  choice: ሰባት ቀን ቆየን
  rationale: በጉዞ ታሪኩ አውድ διατρίβω በአንድ ስፍራ ለተወሰነ ጊዜ መቆየትን ያመለክታል።
