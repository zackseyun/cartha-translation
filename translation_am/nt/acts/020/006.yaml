  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። የእንግሊዝኛው የግርጌ ማስታወሻ በቃላት አቀማመጥ ከ‘አምስት ቀን’ ሐረግ ጋር ስለሚዛመድ፣ ምልክቱ በአማርኛው ዋና ጽሑፍ ከዚያው ሐረግ በኋላ ተቀምጧል።
