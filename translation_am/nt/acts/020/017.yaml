  text: Ἀπὸ δὲ τῆς Μιλήτου πέμψας εἰς Ἔφεσον μετεκαλέσατο τοὺς πρεσβυτέρους τῆς ἐκκλησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/017.yaml
  text: From Miletus he sent to Ephesus and called for the elders of the church[a].
translation:
  language: am
  text: ከሚሌጦስ ወደ ኤፌሶን ልኮ የቤተ ክርስቲያኑን ሽማግሌዎች አስጠራ[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የቤተ ክርስቲያኑ ሽማግሌዎች እንዲመጡ አስጠራ።” የግሪኩ አገላለጽ “ወደ ኤፌሶን ልኮ” የሚለውን “አስጠራ” ከሚለው ጋር ያጣምራል፤ ይህም እነርሱ ወደ እርሱ እንዲመጡ መልእክት ወይም መልእክተኞች እንደላከ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς Μιλήτου
  choice: ከሚሊጢን
  rationale: ἀπό ከቦታ የመነሣትን አቅጣጫ ያመለክታል። δέ እዚህ ላይ ለስላሳ የንግግር ማያያዣ ነው፤ በአማርኛ የሐረጉ ቅደም ተከተል ይህን በተፈጥሮ ስለሚያሳይ የተለየ ቃል አልተጨመረም።
- source_word: πέμψας εἰς Ἔφεσον
  choice: ወደ ኤፌሶን ልኮ
  rationale: የግሪኩ የአኦሪስት አሳታፊ ግስ ከዋናው ግስ በፊት የተፈጸመውን መላክ ያሳያል፤ ይህ አገላለጽ በዘመናዊ አማርኛ ተፈጥሯዊ ነው። የተላከው መልእክት ወይም መልእክተኛ መሆኑ በግሪኩ በግልጽ ስላልተገለጸ አልተወሰነም።
- source_word: μετεκαλέσατο
  choice: አስጠራ
  rationale: የመካከለኛ ድምፅ ግሱ ሰዎቹ ወደ እርሱ እንዲመጡ መጥራቱን ያመለክታል። “አስጠራ” ይህን ትርጉም በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል፤ የግዳጅ ስሜትም አያክልም።
- source_word: τοὺς πρεσβυτέρους
  choice: ሽማግሌዎችን
  rationale: በዚህ የሐዋርያት ሥራ አውድ πρεσβύτεροι በእድሜ የገፉ ወንዶችን ብቻ ሳይሆን የታወቁ የማኅበሩ መሪዎችን ያመለክታል። “ሽማግሌዎች” የኋለኛ ዘመን የአንድ ቤተ እምነት ሥርዓት ሳያስገባ ይህን ይጠብቃል።
- source_word: τῆς ἐκκλησίας
  choice: የቤተ ክርስቲያን
  rationale: ἐκκλησία እዚህ የክርስቲያኖችን ማኅበር ያመለክታል። “ቤተ ክርስቲያን” በዘመናዊ መደበኛ አማርኛ የተለመደና በዚህ አውድ ግልጽ ነው።
theological_decisions:
- issue: በቤተ ክርስቲያናዊ አውድ የπρεσβυτέρους ትርጉም
  choice: የታወቁትን የማኅበሩ መሪዎች “ሽማግሌዎች” ብሎ መግለጽ
  alternative: በእድሜ የገፉ ወንዶች ወይም በቃል የተቀዳ “ፕሬስቢተሮች”
  rationale: የትረካው አውድ ጳውሎስ ከኤፌሶን እውቅና ያላቸውን የማኅበሩ መሪዎች እንዳስጠራ ያሳያል። “ሽማግሌዎች” መሠረታዊውን የቃሉን ትርጉም ይጠብቃል፤ የኋለኛውን ዘመን የቤተ እምነት አስተዳደር ሥርዓት ግን አይጭንም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ቀላል የሆነ መደበኛ አማርኛን ይጠቀማል። የግሪኩን የአሳታፊ ግስና ዋና ግስ ግንኙነት “ልኮ…አስጠራ” በሚል ተፈጥሯዊ ቅርጽ ይጠብቃል።
