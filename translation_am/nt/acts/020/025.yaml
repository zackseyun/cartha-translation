id: ACT.20.25
reference: Acts 20:25
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Καὶ νῦν ἰδοὺ ἐγὼ οἶδα ὅτι οὐκέτι ὄψεσθε τὸ πρόσωπόν μου ὑμεῖς πάντες ἐν οἷς διῆλθον κηρύσσων τὴν ⸀βασιλείαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/025.yaml
  text: And now, look, I know that none of you among whom I went about proclaiming the kingdom will see my face again.
translation:
  language: am
  text: አሁንም እነሆ፣ እኔ መንግሥቱን እየሰበክሁ በመካከላችሁ ተመላልሼ የነበርኩት እናንተ ሁላችሁ ከእንግዲህ በኋላ ፊቴን እንደማታዩ አውቃለሁ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: የንግግሩን ትኩረት የሚያሳይ እና በዘመናዊ አማርኛም በክብር የሚነበብ ቀጥተኛ አቻ ነው።
- source_word: διῆλθον
  choice: የተመላለስሁባችሁ
  rationale: ጳውሎስ በእነርሱ መካከል ዞሮ መሥራቱን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: κηρύσσων
  choice: እየሰበክሁ
  rationale: ቃሉ በይፋ ማወጅን ወይም መስበክን ያመለክታል፤ በዚህ አውድ የተለመደው እና ግልጽ አቻ ‘መስበክ’ ነው።
- source_word: τὴν βασιλείαν
  choice: መንግሥቱን
  rationale: የግሪኩን ወሳኝ መስተዋድድ ይጠብቃል፤ ጽሑፉ ‘የእግዚአብሔር’ የሚለውን በግልጽ ስለማይጨምር ትርጉሙም አያክለውም።
- source_word: οὐκέτι ὄψεσθε τὸ πρόσωπόν μου
  choice: ከእንግዲህ ፊቴን እንደማታዩ
  rationale: ‘ፊቴን ማየት’ የሚለውን ምንጫዊ አገላለጽና ዳግመኛ አለመገናኘትን የሚያሳየውን οὐκέτι በቅርብ ሁኔታ ይጠብቃል።
theological_decisions:
- issue: ‘መንግሥቱ’ የሚያመለክተው
  choice: መንግሥቱን
  alternative: የእግዚአብሔርን መንግሥት
  rationale: SBLGNT በዚህ ቦታ τὴν βασιλείαν ብቻ ይላል። አውዱ የእግዚአብሔርን መንግሥት ቢያመለክትም፣ በዋናው ጽሑፍ የሌለውን ስም በትርጉሙ ውስጥ በግልጽ አልተጨመረም።
- issue: የጳውሎስ እርግጠኝነት
  choice: አውቃለሁ
  alternative: እንደማስብ ነው
  rationale: οἶδα ግልጽ የእውቀት አባባል ነው፤ የንግግሩን ጥንካሬ ለማለስለስ ምንጫዊ ምክንያት የለም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው የአማርኛ ንባብ ተጠቅሟል። ‘እነሆ’ የምንጩን የትኩረት ጥሪ ሳያጠፋ መጽሐፍ ቅዱሳዊ ክብርን ይጠብቃል፤ አስፈላጊ የጽሑፍ ወይም የትርጉም ልዩነት ስለሌለ የግርጌ ማስታወሻ አልተጨመረም።
