  terminology: «መንፈስ ቅዱስ» is the established and contextually appropriate Amharic designation for πνεῦμα ἅγιον in Acts. «ስለ እነርሱ» correctly conveys intercessory prayer on their behalf without doctrinal expansion.
  issues:
