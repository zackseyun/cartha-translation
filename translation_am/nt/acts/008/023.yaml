- source_word: χολὴν πικρίας
  choice: መራራ ሐሞት
  rationale: χολή በቀጥታ «ሐሞት» ሲሆን πικρίας መራርነትን ያመለክታል። «መራራ ሐሞት» መርዛማ መራርነትን የሚያሳየውን ሕያው ዘይቤ ይጠብቃል።
- source_word: σύνδεσμον ἀδικίας
  choice: የዓመፃ እስራት
  rationale: σύνδεσμος የሚያስርን ነገር ወይም እስራትን ያመለክታል፤ ἀδικία ዓመፅን፣ ክፋትን ወይም ኢፍትሐዊነትን ሊገልጽ ይችላል። በዚህ አገባብ «የዓመፃ እስራት» የግለሰቡን ሞራላዊ ሁኔታና የመታሰር ዘይቤ በአንድነት ይጠብቃል።
- source_word: ὁρῶ
  choice: አያለሁ
  rationale: ὁράω እዚህ ላይ ከአካላዊ ማየት ባሻገር ሁኔታን መገንዘብን ሊያመለክት ቢችልም፣ «አያለሁ» የግሪኩን ቀጥተኛ ምስልና የአማርኛውን ተፈጥሯዊ አነጋገር ይጠብቃል።
- source_word: σε ὄντα
  choice: እንዳለህ
  rationale: ከὁρῶ ቀጥሎ ያለው ተሳቢና ቦዝ አንቀጽ በአማርኛ «እንዳለህ አያለሁ» ተብሎ በተፈጥሯዊ የይዘት አንቀጽ ይተረጎማል።
