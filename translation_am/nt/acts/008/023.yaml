lexical_decisions:
- source_word: εἰς
  choice: ውስጥ
  rationale: ከὁρῶ σε ὄντα ጋር በዚህ አገባብ ሲመጣ፣ ሰውየው ያለበትን ሁኔታ ወይም ክልል ያመለክታል፤ «ውስጥ» ይህን ዘይቤያዊ ሁኔታ በተፈጥሯዊ አማርኛ ያስተላልፋል።
