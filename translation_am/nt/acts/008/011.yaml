- source_word: ἐξεστακέναι
  choice: ስላስደነቃቸው
  rationale: ፍጹም የግስ ስሙ ከሕዝቡ ቀጣይ ትኩረት በፊት የተፈጠረውንና ውጤቱ የቀጠለውን መደነቅ ይገልጣል፤ ‘አስደነቀ’ አስማታዊ ቁጥጥርን ከጽሑፉ በላይ አይጨምርም።
