base_translation:
  language: en
  yaml_path: translation/nt/acts/008/013.yaml
  text: And Simon himself also believed[a], and after being baptized he continued with Philip, and as he saw signs and great works of power happening, he was amazed.
translation:
  language: am
  text: ስምዖንም ራሱ አመነ፤ ከተጠመቀም በኋላ ከፊልጶስ ጋር ተጣብቆ ይቆይ ነበር። የሚደረጉትን ምልክቶችና ታላላቅ የኃይል ሥራዎች[a] ሲያይም ይደነቅ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ታላላቅ ተአምራት»። የግሪኩ ቃል ተአምራትንም ሆነ የኃይል መገለጫዎችን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτὸς
  choice: ራሱ
  rationale: ዐውደ ንባቡ ስምዖንም ጭምር ምላሽ መስጠቱን በአጽንዖት ያሳያል፤ በአማርኛው «ስምዖንም ራሱ» የκαίን ጭማሪና የαὐτόςን አጽንዖት ያስቀምጣል።
- source_word: ἐπίστευσεν
  choice: አመነ
  rationale: ግሱ የሚናገረውን ብቻ ይገልጣል፤ የስምዖንን እምነት እውነተኛ ወይም ሐሰተኛ ብሎ አይፈርድም።
- source_word: βαπτισθεὶς
  choice: ከተጠመቀም በኋላ
  rationale: የግስ አጋዥ ቅርጹ ከዋናው ቀጣይ ድርጊት በፊት የተፈጸመውን መጠመቅ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἦν προσκαρτερῶν τῷ Φιλίππῳ
  choice: ከፊልጶስ ጋር ይቆይ ነበር
  rationale: የቀጠለ ተግባርንና ስምዖን ከፊልጶስ ጋር ተጣብቆ መቆየቱን ያለ አላስፈላጊ ትርጓሜ ይገልጣል።
- source_word: θεωρῶν
  choice: ሲያይም
  rationale: ከመደነቁ ጋር አብሮ የቀጠለውን ማየት በተፈጥሯዊ የአማርኛ ጊዜ አንቀጽ ያቀርባል።
- source_word: σημεῖα
  choice: ምልክቶች
  rationale: በሐዋርያት ሥራ ያለውን ማስረጃዊና ገላጭ ፍቺ የሚጠብቅ ቀጥተኛ አቻ ነው።
- source_word: δυνάμεις μεγάλας
  choice: ታላላቅ የኃይል ሥራዎች
  rationale: δυνάμεις የኃይል መገለጫዎችን ወይም ተአምራትን ሊያመለክት ስለሚችል፣ ይህ አገላለጽ ሰፊውን ፍቺ ሳያጠብ ይጠብቃል።
- source_word: γινομένας
  choice: የሚደረጉትን
  rationale: ስምዖን በዓይኑ ፊት ሲፈጸሙ ያያቸውን ምልክቶችና የኃይል ሥራዎች ቀጣይ ባሕርይ ያሳያል።
- source_word: ἐξίστατο
  choice: ይደነቅ ነበር
  rationale: የግሱን ያልተቋረጠ የመገረም ሁኔታ በአማርኛ የቀጣይ ያለፈ ጊዜ ያስተላልፋል።
theological_decisions:
- issue: የስምዖን ማመን እውነተኛ መለወጥ እንደነበረ ጥቅሱ ይወስን እንደሆነ
  choice: ἐπίστευσενን ያለ ተጨማሪ ብይን «አመነ» ብሎ መተርጎም
  alternative: «በእውነት አመነ»፣ «እንዳመነ ተናገረ» ወይም «ላይ ላዩን አመነ»
  rationale: ጥቅሱ ስምዖን እንዳመነና እንደተጠመቀ ይናገራል፤ ቀጣዩ ትረካ ግን የትርጓሜ ጥያቄ ያስነሳል። ስለዚህ ትርጉሙ ግሪኩ በግልጽ የሚለውን ብቻ በማቅረብ ያለውን ሥነ መለኮታዊ ውጥረት ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። «ይቆይ ነበር» እና «ይደነቅ ነበር» የግሪኩን ቀጣይ ያለፈ ድርጊት ያንጸባርቃሉ፤ «የኃይል ሥራዎች» ደግሞ δυνάμειςን ወደ «ተአምራት» ብቻ ሳያጠብ ያቀርባል።
