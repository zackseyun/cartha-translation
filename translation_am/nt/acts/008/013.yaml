  source_fidelity: The draft accurately renders Simon’s emphatic inclusion, his believing and baptism, the ongoing nature of his association with Philip, the signs and great manifestations of power, and his continuing amazement. The plain rendering «አመነ» properly leaves unresolved any later theological assessment of Simon’s faith. A small revision strengthens the ongoing, attached sense of προσκαρτερῶν, which is more than merely remaining in the same place.
