  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Σίμων εἶπεν· Δεήθητε ὑμεῖς ὑπὲρ ἐμοῦ πρὸς τὸν κύριον ὅπως μηδὲν ἐπέλθῃ ἐπ’ ἐμὲ ὧν εἰρήκατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/024.yaml
  text: But Simon answered[a], “You pray to the Lord for me, so that nothing of what you have said may come upon me.”
translation:
  language: am
  text: ሲሞን ግን መልሶ፣ “እናንተ ስለ እኔ ወደ ጌታ ጸልዩ፤ ከተናገራችሁት ነገር አንዳችም በእኔ ላይ እንዳይደርስ” አለ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Σίμων εἶπεν
  choice: ሲሞን ግን መልሶ … አለ
  rationale: የግሪክኛውን መልስ ሰጪ አገላለጽና δέ የሚያመለክተውን መጠነኛ ተቃርኖ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: Δεήθητε ὑμεῖς
  choice: እናንተ … ጸልዩ
  rationale: ግልጽ የሆነውን ὑμεῖς በ“እናንተ” በማስቀመጥ ሲሞን እነርሱን በአጽንኦት እንደሚጠይቅ ይጠብቃል፤ Δεήθητε በዚህ አውድ የምልጃ ጸሎትን ያመለክታል።
- source_word: ὑπὲρ ἐμοῦ
  choice: ስለ እኔ
  rationale: በሌላ ሰው ፈንታ የሚቀርብን ምልጃ በተለመደና ግልጽ አማርኛ ይገልጻል።
- source_word: πρὸς τὸν κύριον
  choice: ወደ ጌታ
  rationale: የጸሎቱን አቅጣጫ ይጠብቃል፤ κύριοςን ምንጩ ከሚለው በላይ ሳይወስን “ጌታ” ብሎ ይተረጉማል።
- source_word: ὅπως μηδὲν ἐπέλθῃ ἐπ’ ἐμὲ
  choice: አንዳች በእኔ ላይ እንዳይደርስ
  rationale: ὅπωςን በአማርኛው የዓላማ/የተፈለገ ውጤት አገላለጽ “እንዳይ…” ያቀርባል፤ ἐπέλθῃ ἐπ’ ἐμέ ያለውን የፍርድ ወይም የመከራ ጥላ ሳያጠፋ “በእኔ ላይ እንዳይደርስ” ይላል።
- source_word: ὧν εἰρήκατε
  choice: ከተናገራችሁት
  rationale: የዘመድ ሐረጉን ከμηδέν ጋር በተፈጥሯዊ አማርኛ “ከተናገራችሁት … አንዳች” በሚል አወቃቀር ያገናኛል።
theological_decisions:
- issue: የ“ጌታ” (τὸν κύριον) ተጠቃሽ
  choice: ተጠቃሹን ሳይጨምር “ጌታ” ተብሎ ቀርቧል።
  alternative: “እግዚአብሔር” ወይም “ጌታ ኢየሱስ”
  rationale: የግሪክኛው ጽሑፍ τὸν κύριον ብቻ ይላል። ስለዚህ ትርጉሙ ጽሑፉ ያልወሰነውን ተጠቃሽ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የእንግሊዝኛው ማስታወሻ [a] በተሰጠው ጽሑፍና በማስታወሻው መካከል ትርጉማዊ ልዩነት ስለማያቀርብ አልተወሰደም፤ የግሪክኛው የከፊል/የምንጭ ግንኙነት በ“ከተናገራችሁት … አንዳች” በቀጥታ ተጠብቋል።
