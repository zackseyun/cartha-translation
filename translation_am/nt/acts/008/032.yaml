- source_word: οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ
  choice: እንዲሁ አፉን አይከፍትም
  rationale: የንጽጽሩን መደምደሚያና በጥቅሱ ያለውን የአሁን ጊዜ ቅርጽ ይጠብቃል።
