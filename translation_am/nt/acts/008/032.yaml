- source_word: ἀμνὸς
  choice: ጠቦት
  rationale: ከአጠቃላዩ πρόβατον ‘በግ’ የተለየውን፣ ወጣት በግ የሚያመለክተውን ቃል ይጠብቃል።
- source_word: ἐναντίον τοῦ κείραντος αὐτὸν ἄφωνος
  choice: ጠጉሩንም በሚሸልተው ሰው ፊት ዝም እንደሚል
