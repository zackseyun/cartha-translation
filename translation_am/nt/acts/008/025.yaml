  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν διαμαρτυράμενοι καὶ λαλήσαντες τὸν λόγον τοῦ κυρίου ⸀ὑπέστρεφον εἰς ⸀Ἱεροσόλυμα, πολλάς τε κώμας τῶν Σαμαριτῶν ⸀εὐηγγελίζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/025.yaml
  text: So[a], after they had solemnly testified and spoken the word of the Lord, they were returning to Jerusalem[b], and were proclaiming the good news in many Samaritan villages.
translation:
  language: am
  text: እነርሱም የጌታን ቃል በጽኑ ከመሰከሩና ከተናገሩ በኋላ፣ ወደ ኢየሩሳሌም ይመለሱ ነበር፤ በብዙ የሳምራውያን መንደሮችም የምሥራቹን ያበስሩ ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαμαρτυράμενοι
  choice: በጽኑ ከመሰከሩ
  rationale: ግሱ አጽንዖት ያለውን ምስክርነት ያመለክታል፤ «በጽኑ መሰከሩ» ይህን ክብደት ሳያጠብ የማስጠንቀቅን ትርጉም አያስገባም።
- source_word: λαλήσαντες
  choice: ከተናገሩ
  rationale: ቀጥተኛው ተሳቢ «የጌታን ቃል» ስለሚከተል፣ ተፈጥሯዊና ቀጥተኛ አማርኛ ነው።
- source_word: τὸν λόγον τοῦ κυρίου
  choice: የጌታን ቃል
  rationale: «ቃል» የλόγοςን መደበኛ መጽሐፍ ቅዱሳዊ ትርጉምና የአዋጅ አውዱን ይጠብቃል።
- source_word: ὑπέστρεφον
  choice: ይመለሱ ነበር
  rationale: የግሪኩ ኢምፐርፌክት ቀጣይ ወይም በሂደት ላይ የነበረ ተግባርን ያሳያል።
- source_word: πολλάς τε κώμας τῶν Σαμαριτῶν
  choice: በብዙ የሳምራውያን መንደሮች
  rationale: የመንደሮቹን ከሳምራውያን ጋር ያላቸውን ግንኙነትና የዘር ስያሜውን በግልጽ ይጠብቃል።
- source_word: εὐηγγελίζοντο
  choice: የምሥራቹን ያበስሩ ነበር
  rationale: የምሥራችን የማወጅ ግሳዊ ኃይልና የኢምፐርፌክቱን ቀጣይነት በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: የተው ባለቤት ማንነት
  choice: «እነርሱ» ተብሎ ተተርጉሟል።
  alternative: «ጴጥሮስና ዮሐንስ» ብሎ ስሞቻቸውን መጨመር።
  rationale: አውዱ ጴጥሮስንና ዮሐንስን ቢያመለክትም፣ ይህ ቁጥር ስሞቻቸውን አይጠቅስም፤ ስለዚህ የምንጩ የብዙ ቁጥር ባለቤት ሳይገለጽ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «በመንገዳቸውም» በአማርኛ ሁለቱ የኢምፐርፌክት ድርጊቶች በአንድ ጊዜ እንደተከናወኑ በተፈጥሯዊ ሁኔታ ያገናኛል።
