  text: በመንገድም እየሄዱ ሳሉ ወደ አንድ ውሃ መጡ፤ ጃንደረባውም፣ “እነሆ፣ ውሃ! እንድጠመቅ የሚከለክለኝ ምን አለ?” ይላል።
