lexical_decisions:
- source_word: εὐνοῦχος
  choice: ጃንደረባ
  rationale: በሐዋርያት ሥራ 8 አውድ የግለሰቡን ማዕረግና አካላዊ ሁኔታ ሊያመለክት የሚችለውን የግሪክ ቃል በተለመደው የአማርኛ መጽሐፍ ቅዱሳዊ ቃል ያቀርባል።
- source_word: φησιν
  choice: ይላል
  rationale: የግሪኩን ታሪካዊ የአሁን ጊዜ ቅርጽ በአማርኛም በአሁን ጊዜ በማቅረብ የትረካውን ሕያውነት ይጠብቃል።
- source_word: βαπτισθῆναι
  choice: እንዳልጠመቅ
  rationale: የግሪኩን ተደራጊ ቅርጽና በጥያቄው ውስጥ ያለውን ከκωλύει ጋር የተያያዘ አሉታዊ ዓላማ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐπί τι ὕδωρ
  choice: ውሃ ወዳለበት ስፍራ
  rationale: τι ያለውን አለመወሰን ሳይጫን፣ ወደ አንድ የውሃ ቦታ መድረሳቸውን በተፈጥሯዊ አማርኛ ይገልጣል።
