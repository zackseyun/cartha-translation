  edition: SBLGNT
  text: μετανόησον οὖν ἀπὸ τῆς κακίας σου ταύτης, καὶ δεήθητι τοῦ ⸀κυρίου εἰ ἄρα ἀφεθήσεταί σοι ἡ ἐπίνοια τῆς καρδίας σου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/022.yaml
  text: Therefore repent of this wickedness of yours[a], and pray to the Lord, if perhaps the intent of your heart may be forgiven you.
translation:
  language: am
  text: ስለዚህ ከዚህ ክፋትህ ንስሐ ግባ፤ ምናልባት የልብህ ሐሳብ ይቅር እንዲባልልህ ጌታን ለምን።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ምናልባት የልብህ ዓላማ ይቅር እንዲባልልህ።”
    reason: ἐπίνοια በዐውዱ ሐሳብን ወይም ውስጣዊ ዓላማን ሊያመለክት ስለሚችል የቃላት አማራጭ።
lexical_decisions:
- source_word: μετανόησον
  choice: ንስሐ ግባ
  rationale: የአንድ ጊዜ ወሳኝ ጥሪንና ሥነ ምግባራዊ-መንፈሳዊ መመለስን በተፈጥሯዊ የአማርኛ አገላለጽ ያሳያል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከጴጥሮስ ቀዳሚ ተግሣጽ የሚከተለውን ድምዳሜ ግልጽ ያደርጋል።
- source_word: ἀπὸ τῆς κακίας σου ταύτης
  choice: ከዚህ ክፋትህ
  rationale: ἀπό የሚያሳየውን ከክፋት መለየት ይጠብቃል፤ κακίαንም እንደ ሥነ ምግባራዊ ክፋት ያቀርባል። የሁለተኛ መደብ ባለቤትነትም ተጠብቋል።
- source_word: δεήθητι
  choice: ለምን
  rationale: ተራ መናገርን ሳይሆን ከልብ የሚቀርብ ልመናን ያመለክታል፤ ከጌታ ጋርም ተፈጥሯዊ ነው።
- source_word: τοῦ κυρίου
  choice: ጌታን
  rationale: κύριοςን በተለመደው መጽሐፍ ቅዱሳዊ ቃል ይተረጉማል፤ እዚህ ማንን እንደሚያመለክት ከጽሑፉ በላይ አይወስንም።
- source_word: εἰ ἄρα
  choice: ምናልባት
  rationale: ይቅርታውን እንደ የተረጋገጠ ውጤት ሳያቀርብ፣ የግሪኩን ጥንቃቄና የዕድል አገላለጽ ይጠብቃል።
- source_word: ἀφεθήσεταί σοι
  choice: ይቅር እንዲባልልህ
  rationale: የይቅርታውን ተቀባይነትና ተገብሮ ቅርጽ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ባለድርጊቱንም አይጨምርም።
- source_word: ἡ ἐπίνοια
  choice: ሐሳብ
  rationale: ቃሉ ሐሳብን፣ ዓላማን ወይም ውጥንን ሊያመለክት ይችላል። «ሐሳብ» የመነሻውን ሰፊ ትርጉም እና አሻሚነት ይጠብቃል፤ «ዓላማ» በማስታወሻ ቀርቧል።
- source_word: τῆς καρδίας σου
  choice: የልብህ
  rationale: የግሪኩን የባለቤትነት ግንኙነትና መጽሐፍ ቅዱሳዊ የልብ አገላለጽ በቀጥታ ይጠብቃል።
theological_decisions:
- issue: ይቅርታ የመገኘቱ እርግጠኝነት ደረጃ
  choice: ጴጥሮስ ስምዖንን ንስሐ እንዲገባና እንዲለምን ያዛል፤ ይቅርታ ሊሰጠው እንደሚችል በጥንቃቄ ይናገራል እንጂ ውጤቱን አያረጋግጥም።
  alternative: ንስሐ ከገባ ይቅርታው እንደሚረጋገጥ መግለጽ፣ ወይም ይቅርታው ፈጽሞ የማይቻል መሆኑን ማመልከት።
  rationale: εἰ ἄρα ከወደፊት ጊዜ ተገብሮ ግስ ጋር ያለው አገላለጽ የተጠነቀቀና ሁኔታዊ ነው። «ምናልባት» ይህን ውጥረት ሳይፈታ ያቆየዋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። «ንስሐ ግባ» እና «ጌታ» የተለመዱ መጽሐፍ ቅዱሳዊ ቃላት ሲሆኑ፣ ሐረጉ የግሪኩን ሁኔታዊነት ለማቆየት በተፈጥሯዊ አማርኛ ተዋቅሯል።
