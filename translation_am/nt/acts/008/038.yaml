  text: እርሱም ሰረገላው እንዲቆም አዘዘ፤ ፊልጶስና ጃንደረባውም ሁለቱም ወደ ውሃው ውስጥ ወረዱ።[a] ፊልጶስም አጠመቀው።
  philosophy: optimal-equivalence
  footnotes:
