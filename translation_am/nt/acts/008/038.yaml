  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ጃንደረባ» የተለመደውን መጽሐፍ ቅዱሳዊ ቃል ይጠብቃል፤ ምልክቱ [a] ከሙሉው ሐረግ በኋላ ተቀምጧል።
