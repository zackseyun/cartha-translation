    text: ወይም «ወደ ውሃው»፤ ሆኖም የግሪኩ ቅድመ ቃል በተለምዶ ወደ ውሃው ውስጥ የሚደረግ እንቅስቃሴን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκέλευσεν
  choice: አዘዘ
  rationale: ቃሉ ትእዛዝ መስጠትን ያመለክታል፤ «አዘዘ» በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: στῆναι τὸ ἅρμα
  choice: ሰረገላው እንዲቆም
  rationale: በዚህ አገባብ στῆναι ተሽከርካሪው ከመንቀሳቀስ እንዲቆም ማድረግን ይገልጣል።
- source_word: ἅρμα
  choice: ሰረገላ
  rationale: የግሪኩን የተሽከርካሪ ስም በተለመደውና በታሪካዊ አገባቡ ተስማሚ በሆነው የአማርኛ ቃል ያቀርባል።
- source_word: κατέβησαν
  choice: ወረዱ
  rationale: καταβαίνω ወደ ታች መሄድን ይገልጣል፤ «ወረዱ» አጭርና ተፈጥሯዊ ነው።
- source_word: ἀμφότεροι
  choice: ሁለቱም
  rationale: በድርጊቱ ሁለቱ ሰዎች አብረው መሳተፋቸውን በግልጽ ያሳያል።
- source_word: εἰς τὸ ὕδωρ
  choice: ወደ ውሃው
  rationale: εἰς እንቅስቃሴንና አቅጣጫን ያመለክታል። የአማርኛው «ወደ ውሃው ወረዱ» ይህን አቅጣጫዊ ኃይል ይጠብቃል፤ እስከ ምን ያህል ውስጥ እንደገቡ ግን አይወስንም።
- source_word: ὅ τε Φίλιππος καὶ ὁ εὐνοῦχος
  choice: ፊልጶስና ጃንደረባውም
  rationale: ሁለቱን ተሳታፊዎች በስምና በመጠሪያ ይለያል፤ ከ«ሁለቱም» ጋር የግሪኩን አጽንዖት ይጠብቃል።
- source_word: εὐνοῦχος
  choice: ጃንደረባ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ ቋንቋ የተለመደውን ቀጥተኛ መጠሪያ ይጠብቃል፤ «ባለሥልጣን» ብቻ ማለት የግሪኩን ልዩ ቃል ያለዝባል።
- source_word: ἐβάπτισεν αὐτόν
  choice: አጠመቀው
  rationale: የተለመደውን የጥምቀት ቃል በመጠቀም ድርጊቱን ይገልጣል፤ የጥምቀቱን አፈጻጸም ዘዴ ከጽሑፉ በላይ አይወስንም።
theological_decisions:
- issue: ንግግሩ የጥምቀትን አፈጻጸም ዘዴ እንዲወስን መተርጎም ይገባው እንደሆነ
  choice: «ወደ ውሃው ወረዱ» የሚለውን አቅጣጫዊ ንግግርና «አጠመቀው» የሚለውን የተለመደ ግስ መጠቀም
  alternative: ግሱን «ሙሉ በሙሉ በውሃ ውስጥ ነከረው» ብሎ መተርጎም ወይም εἰςን በማለዘብ «ውሃው አጠገብ» ማለት
  rationale: ግሪኩ ሁለቱ ወደ ውሃው እንደወረዱና ፊልጶስ ጃንደረባውን እንዳጠመቀ ይናገራል። ትርጉሙ እነዚህን የቃላት እውነታዎች ይጠብቃል፤ ከጽሑፉ በላይ የአንድን ወገን የጥምቀት ዘዴ ግን አያስገባም።
