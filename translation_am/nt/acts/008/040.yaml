  text: Φίλιππος δὲ εὑρέθη εἰς Ἄζωτον, καὶ διερχόμενος εὐηγγελίζετο τὰς πόλεις πάσας ἕως τοῦ ἐλθεῖν αὐτὸν εἰς Καισάρειαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/040.yaml
  text: But Philip was found at Azotus[a], and as he passed through, he was proclaiming the good news to all the cities until he came to Caesarea.
translation:
  language: am
  text: ፊልጶስ ግን በአዛጦን ተገኘ[a]፤ እያለፈም ወደ ቂሳርያ እስኪደርስ ድረስ በከተሞች ሁሉ የምሥራቹን ዜና ያበስር ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በአዛጦን ታየ።» ግሪኩ ቃል በቃል «በአዛጦን ተገኘ» ይላል፤ በዐውደ ንባቡ ድንገተኛ መለኮታዊ ማዛወርን ሊያመለክት ቢችልም፣ ይህን በግልጽ አይናገርም።
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: ግን
  rationale: ከቀደመው ትረካ ጋር ያለውን ቀላል ንፅፅርና ሽግግር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: εὑρέθη
  choice: ተገኘ
  rationale: የግሪኩን ተደራጊ አገላለጽ በቀጥታ ይጠብቃል፤ ድንገተኛ መለኮታዊ ማዛወርን አይክድም፣ ነገር ግን በግልጽ አያክልም።
- source_word: εἰς Ἄζωτον
  choice: በአዛጦን
  rationale: ከεὑρέθη ጋር የውጤት ስፍራን የሚያመለክተውን አገባብ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: διερχόμενος
  choice: በዚያም አድርጎ ሲያልፍ
  rationale: በመንገዱ ያሉትን ስፍራዎች እያቋረጠ የሚጓዘውን ቀጣይ እንቅስቃሴ ይገልጣል።
- source_word: εὐηγγελίζετο
  choice: የምሥራቹን ዜና ያውጅ ነበር
  rationale: የግሪኩን ቀጣይና ተደጋጋሚ ድርጊት ይጠብቃል፤ በዘመናዊና ለሁሉም በሚገባ ቋንቋ የምሥራቹን ዜና መናገርን ያሳያል።
- source_word: τὰς πόλεις πάσας
  choice: በከተሞቹ ሁሉ
  rationale: በመንገዱ ላይ ያሉትን ከተሞች በሙሉ የሚያካትተውን ስርጭት ይገልጣል።
- source_word: ἕως τοῦ ἐλθεῖν αὐτὸν
  choice: እስኪደርስ ድረስ
  rationale: የቀጣዩ እንቅስቃሴ መድረሻና መጨረሻ በተፈጥሯዊ አማርኛ ይገለጻል።
- source_word: εἰς Καισάρειαν
  choice: ወደ ቂሳርያ
  rationale: ከመምጣት/መድረስ ግስ ጋር የመድረሻ አቅጣጫን በግልጽ ያሳያል።
theological_decisions:
- issue: εὑρέθη የፊልጶስን መዛወር በግልጽ እንደ ተአምራዊ መገለጥ ያስረዳ ወይስ የግሪኩን ገለልተኛ ተደራጊ አገላለጽ ይጠብቅ
  choice: በዋናው ጽሑፍ «ተገኘ» የሚለውን ገለልተኛ አገላለጽ መጠበቅ
  alternative: «በአዛጦን ታየ» ወይም «ድንገት በአዛጦን ተገኘ»
  rationale: ዐውደ ንባቡ መለኮታዊ ድርጊትን አጥብቆ ቢጠቁምም፣ የግሪኩ ጽሑፍ ራሱ «ተገኘ» ይላል። ስለዚህ የትረካውን ሥነ መለኮታዊ ውጥረትና ግልጽ ያልሆነውን ገጽታ ሳይፈታ መጠበቅ ተመርጧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ያውጅ ነበር» የግሪኩን ቀጣይ ድርጊት ይጠብቃል፤ የቦታ ስሞች «አዛጦን» እና «ቂሳርያ» በተለመደው የአማርኛ መጽሐፍ ቅዱሳዊ አጻጻፍ ቀርበዋል።
