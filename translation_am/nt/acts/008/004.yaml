  terminology: «ቃሉን» appropriately retains Luke’s concise λόγος terminology. «ምሥራች አወጁ» expresses the good-news force of εὐαγγελιζόμενοι without imposing a narrower doctrinal formulation. The contextual explanation in footnote b is suitable.
  issues:
