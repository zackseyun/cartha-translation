  - marker: b
    text: በግሪክኛ «ቃሉን»፤ በዚህ ዐውድ ስለ ኢየሱስ የሚነገረውን መልእክት ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ μὲν οὖν
  choice: ስለዚህ … የነበሩት
  rationale: οὖν ከቀደመው ስደትና መበተን ጋር ያለውን የውጤት ግንኙነት «ስለዚህ» በማለት ያሳያል፤ μέν በዚህ አገባብ የንግግሩን ሽግግር ያመለክታልና ለብቻው ቃል አልተጨመረለትም።
- source_word: διασπαρέντες
  choice: ተበትነው የነበሩት
  rationale: የግስ ተሳቢዎቹ ራሳቸውን እንዳልበተኑ፣ በስደቱ ምክንያት እንደተበተኑ የግሪኩን ተደራጊ ቅርጽ ይጠብቃል፤ መበተኑም ከመዘዋወራቸው በፊት መሆኑን ያሳያል።
- source_word: διῆλθον
  choice: በየስፍራው እየዞሩ
  rationale: ግሱ ከስፍራ ወደ ስፍራ መሄድን ያመለክታል። በግሪኩ የሌለውን «ክልል» ሳይጨምር፣ በዘመናዊ አማርኛ የተጓዙበትን ተደጋጋሚ እንቅስቃሴ በተፈጥሮ ይገልጣል።
- source_word: εὐαγγελιζόμενοι
  choice: እንደ ምሥራች ያውጁ ነበር
  rationale: የመልካም ዜና የሆነን ነገር ማብሰር የሚለውን የግሱን ኃይል ይጠብቃል፤ ከቤተ ክርስቲያናዊ የሙያ ንግግር ይልቅ ለዘመናዊ አንባቢ ግልጽ ነው።
- source_word: τὸν λόγον
  choice: ቃሉን
  rationale: በግሪኩ ቀጥተኛ ተሳቢ የሆነውን λόγος «ቃሉን» ብሎ በአጭሩ ይጠብቃል። በዐውዱ ይህ ስለ ኢየሱስ የሚነገረውን መልእክት ያመለክታል፤ «የእግዚአብሔር ቃል» ማለት ግን በጥቅሱ የሌለ ቃል ይጨምራል።
theological_decisions:
- issue: የεὐαγγελιζόμενοι τὸν λόγον አተረጓጎም
  choice: ቃሉን እንደ ምሥራች ያውጁ ነበር
  alternative: ቃሉን ይሰብኩ ነበር
  rationale: λόγος የግሱ ቀጥተኛ ተሳቢ መሆኑን ይጠብቃል፤ በተመሳሳይም εὐαγγελίζομαι ውስጥ ያለውን የ«ምሥራች» ትርጉም አያጠፋም። ቃሉን የምሥራቹ ምንጭ ወይም ርዕስ አድርጎ የሚያሰማ ሰዋሰዋዊ ግንኙነትም አይፈጥርም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። «ምሥራች» የተለመደውን የግዕዝ ፊደል አጻጻፍ ይከተላል፤ «እንደ ምሥራች ማወጅ» የግሪኩን ግስና ቀጥተኛ ተሳቢ በተፈጥሯዊ አማርኛ አንድ ላይ ያቆያል።
