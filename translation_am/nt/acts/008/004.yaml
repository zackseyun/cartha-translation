  verdict: revise
  source_fidelity: The draft accurately preserves the passive sense of διασπαρέντες and retains τὸν λόγον as the direct object. However, its main verbal construction, «እየዞሩ … ያውጁ ነበር», recasts the aorist διῆλθον as an ongoing imperfect action. A simple past main verb better represents the verse's summary of the scattered believers' subsequent activity.
