    issue: The main clause uses an imperfect-style construction («ያውጁ ነበር») for διῆλθον.
    rationale: διῆλθον is aorist and presents the travel/proclamation as a summarized past event. Rendering it with a simple past construction more closely reflects the source while remaining idiomatic.
  - severity: low
