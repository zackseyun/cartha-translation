  text: And Philip[a] said, “If you believe with all your heart, you may.” And he answered and said, “I believe that Jesus is the Messiah, the Son of God.”
translation:
  language: am
  text: ፊልጶስም[a]፣ “በሙሉ ልብህ ብታምን፣ ይፈቀድልሃል” አለው። እርሱም መልሶ፣ “ኢየሱስ መሲሑ የእግዚአብሔር ልጅ መሆኑን አምናለሁ” አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይህ ቁጥር ከጥንታዊ የግሪክ ቅጂዎች—የ3ኛው ክፍለ ዘመን ፓፒረሶችንና የ4ኛው ክፍለ ዘመን የሲናይና የቫቲካን ቅጂዎችን ጨምሮ—እንዲሁም ከጥንታዊ የቅብጥ ትርጉሞች ውስጥ የለም። በባይዛንታይን አብዛኛው የቅጂ ባህልና በላቲን ባህል ውስጥ ግን ይገኛል፤ በ2ኛው ክፍለ ዘመን መጨረሻም ኢራኔዎስና ቂጵርያኖስ የመሳሰሉ የጥንት የቤተ ክርስቲያን አባቶች ጠቅሰውታል። ምሁራን ብዙውን ጊዜ ይህን በጥምቀት ሥርዓት ይነገር የነበረና በኋላ በሐዋርያት ሥራ ትረካ ውስጥ የገባ ጥንታዊ የእምነት ኑዛዜ ብለው ይገልጹታል።
    reason: textual_critical
