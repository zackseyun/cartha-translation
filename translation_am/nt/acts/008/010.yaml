- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  choice: ከታናሹ እስከ ታላቁ
  rationale: ይህ አገላለጽ የማኅበረሰቡን ሙሉ ክልል የሚያመለክት ጥንድ አገላለጽ ነው፤ የግሪኩን ቅርጽና ትርጉም በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: λέγοντες
