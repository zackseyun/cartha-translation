  text: ከታናሹ እስከ ታላቁ ሁሉም ትኩረት ይሰጡት ነበር፤ “ይህ ሰው ታላቅ ተብሎ የሚጠራ የእግዚአብሔር ኃይል ነው” ይሉ ነበር።[a]
