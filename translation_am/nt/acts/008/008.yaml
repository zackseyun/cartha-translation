translation:
  language: am
  text: በዚያችም ከተማ ታላቅ ደስታ ሆነ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο
  choice: ሆነ
  rationale: ከስም ጋር የተጠቀሰው ἐγένετο አንድ ሁኔታ መኖሩን ወይም መፈጠሩን ያመለክታል፤ «ሆነ» ይህን ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δὲ
  choice: -ም
  rationale: δὲ በዚህ ስፍራ የትረካውን ቀጣይነት ያሳያል፤ ከ«በዚያች» ጋር የተያያዘው «-ም» ያለ አላስፈላጊ ተቃርኖ ይህን ፍሰት በተፈጥሯዊ ሁኔታ ያቀርባል።
- source_word: πολλὴ χαρά
  choice: ታላቅ ደስታ
  rationale: πολλή ከረቂቅ ስም χαρά ጋር የደስታውን ብርታትና መጠን ያሳያል፤ «ታላቅ ደስታ» በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: ἐν τῇ πόλει ἐκείνῃ
  choice: በዚያች ከተማ
  rationale: ἐν የቦታ ምልክት ሲሆን πόλει «ከተማ» ማለት ነው፤ ἐκείνῃ ደግሞ ቀደም ሲል የተጠቀሰችውን የተወሰነች ከተማ ያመለክታል። የአማርኛው የሴት ፆታ አመልካች «ዚያች» ከ«ከተማ» ጋር ይስማማል።
