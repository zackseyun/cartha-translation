base_translation:
  language: en
  yaml_path: translation/nt/acts/008/026.yaml
  text: An angel of the Lord spoke to Philip[a], saying[b], “Get up and go south to the road that goes down from Jerusalem to Gaza.” This is a deserted road.
translation:
  language: am
  text: የጌታም መልአክ ፊልጶስን፣ “ተነሣና ወደ ደቡብ[a] ከኢየሩሳሌም ወደ ጋዛ ወደሚወርደው መንገድ ሂድ” አለው። ይህም ሰው የማይኖርበት መንገድ ነው።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በቀትር።” የግሪኩ ሐረግ አቅጣጫን (“ደቡብ”) ወይም ጊዜን (“ቀትር”) ሊያመለክት ይችላል።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ “ይህ በረሓ ነው።” ይህም መንገዱ ራሱ ሰው የማይኖርበት መሆኑን ከማጉላት ይልቅ በበረሓማ አካባቢ እንደሚያልፍ ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγγελος
  choice: መልአክ
  rationale: በዚህ የመለኮታዊ መመሪያ አውድ ἄγγελος አጠቃላይ ‘መልእክተኛ’ ሳይሆን ‘መልአክ’ ተብሎ መተርጎሙ ተገቢ ነው። ግሪኩ የተወሰነ መስተዋድድ ባይኖረውም አማርኛ ይህን በተፈጥሮ ያስተናግዳል።
- source_word: κυρίου
  choice: የጌታ
  rationale: በሉቃሳዊው ትረካ ውስጥ መለኮታዊ ሥልጣንን ያመለክታል፤ ከሰው ጌታ ይልቅ ‘ጌታ’ የሚለው የተለመደውን መጽሐፍ ቅዱሳዊ አጠቃቀም ይጠብቃል።
- source_word: ἐλάλησεν πρὸς Φίλιππον λέγων
  choice: ፊልጶስን … አለው
  rationale: የግሪኩን ‘ተናገረ… እያለ’ አወቃቀር ቃል በቃል ማባዛት በአማርኛ ከባድ ስለሚሆን፣ ቀጥተኛውን ንግግር ‘አለው’ በሚል ተፈጥሯዊ መንገድ ተያይዟል።
- source_word: Ἀνάστηθι καὶ πορεύου
  choice: ተነሥተህ … ሂድ
  rationale: ሁለቱን ትእዛዛትና የአፋጣኝ እርምጃ ስሜት በዘመናዊና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: κατὰ μεσημβρίαν
  choice: ወደ ደቡብ
  rationale: μεσημβρία አቅጣጫን (‘ደቡብ’) ወይም ጊዜን (‘ቀትር’) ሊያመለክት ይችላል። ከመንቀሳቀስና ከመንገድ ጋር በመያያዙ የአቅጣጫው ትርጉም በዋናው ጽሑፍ ተመርጧል፤ የጊዜው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: τὴν καταβαίνουσαν ἀπὸ Ἰερουσαλὴμ εἰς Γάζαν
  choice: ከኢየሩሳሌም ወደ ጋዛ ወደሚወርደው
  rationale: ‘መውረድ’ ከኢየሩሳሌም የሚደረገውን መልክዓ ምድራዊ ወረዳ ይጠብቃል፤ በአማርኛም ተፈጥሯዊ ነው።
- source_word: αὕτη ἐστὶν ἔρημος
  choice: ይህም በረሓማ መንገድ ነው
  rationale: የαὕτη ሴት ጾታ ከὁδός (‘መንገድ’) ጋር ሊዛመድ ይችላል። ἔρημος ባዶ/ሰው የማይበዛበትን መንገድ ወይም በረሓማ አካባቢን ሊያመለክት ስለሚችል ‘በረሓማ መንገድ’ የሁለቱንም ገጽታ በአጭር ይይዛል፤ አማራጩ በማስታወሻ ተገልጿል።
