  yaml_path: translation/nt/acts/008/029.yaml
  text: Then the Spirit said to Philip[a], “Go over and join this chariot.”
translation:
  language: am
  text: መንፈሱም ፊልጶስን፣ “ወደዚህ ሠረገላ ቅረብና ከእርሱ ጋር ተጠጋ[a]” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወደዚህ ቀርበህ ከዚህ ሠረገላ አጠገብ ቆይ።”
    reason: κολλήθητι በቅርብ መጠጋትን ወይም በአጠገቡ መቆየትን ሊያመለክት ይችላል።
lexical_decisions:
- source_word: εἶπεν
  choice: አለው
  rationale: ቀጥተኛ ንግግርን በተፈጥሯዊ የአማርኛ ትረካ ለማቅረብ፤ የተዘዋዋሪ ተሳቢውንም በግስ ላይ ያሳያል።
- source_word: δὲ
  choice: -ም
  rationale: እዚህ ጠንካራ ተቃርኖ ሳይሆን የትረካ ቅደም ተከተልን ያሳያል፤ በአማርኛ -ም በተፈጥሮ ያገናኛል።
- source_word: τὸ πνεῦμα
  choice: መንፈሱ
  rationale: ግሪኩ ‘ቅዱስ’ የሚለውን ቅጽል ስላልጨመረ፣ ቃሉን ሳያሰፋ የታወቀውን መለኮታዊ ተዋናይ ያመለክታል።
- source_word: τῷ Φιλίππῳ
  choice: ፊልጶስን
  rationale: በ‘አለው’ የአማርኛ አወቃቀር የንግግሩ ተቀባይ በተሳቢ ምልክት በተፈጥሮ ቀርቧል።
- source_word: Πρόσελθε
  choice: ወደዚያ ሄደህ
  rationale: ወደ ሠረገላው የሚደረገውን እንቅስቃሴ በዘመናዊና ግልጽ አማርኛ ያሳያል፤ የቦታ ርቀቱን ከምንጩ በላይ አይወስንም።
- source_word: κολλήθητι
  choice: ተጠጋ
  rationale: በዚህ አውድ ከሠረገላው ጋር በቅርብ መሆንን የሚያሳይ ተፈጥሯዊ ትርጉም ነው፤ የመጣበቅን ቃል በቃል አነጋገር ያስወግዳል።
- source_word: τῷ ἅρματι τούτῳ
  choice: ከዚህ ሠረገላ ጋር
  rationale: ἅρμαን ‘ሠረገላ’፣ τούτῳንም ቅርብ አመልካች ‘ዚህ’ ብሎ በመተርጎም የምንጩን አገላለጽ ይጠብቃል።
theological_decisions:
- issue: የτὸ πνεῦμα ማጣቀሻ
  choice: ‘መንፈሱ’ የሚለው በሐዋርያት ሥራ አውድ መንፈስ ቅዱስን ያመለክታል።
  alternative: ግልጽ ያልሆነ መንፈሳዊ ግፊት ወይም መሪነት
  rationale: በሐዋርያት ሥራ መለኮታዊ መመሪያ የሚሰጠው ‘መንፈሱ’ ተደጋግሞ መንፈስ ቅዱስን ያመለክታል፤ ሆኖም ግሪኩ ἅγιον ስለሌለው ትርጉሙ ‘ቅዱስ’ የሚለውን አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘መንፈሱ’ የምንጩን አጭር አገላለጽ ይጠብቃል፤ ‘ሠረገላ’ ደግሞ በመጽሐፍ ቅዱሳዊ ታሪካዊ አውድ የታወቀና የተፈጥሮ ቃል ነው።
