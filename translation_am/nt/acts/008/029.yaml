    reason: κολλήθητι በቅርብ መጠጋትን ወይም በአጠገቡ መቆየትን ሊያመለክት ይችላል።
  revision_rationale: The revision replaces the distal and less precise “ወደዚያ ሄደህ” with “ወደዚህ ሠረገላ ቅረብ,” preserving both the imperative movement and the proximal demonstrative. It retains the unexpanded designation “መንፈሱ” and gives κολλήθητι a natural contextual rendering, with its continuing-close-association nuance preserved in the footnote.
