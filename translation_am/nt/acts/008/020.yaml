  text: Πέτρος δὲ εἶπεν πρὸς αὐτόν· Τὸ ἀργύριόν σου σὺν σοὶ εἴη εἰς ἀπώλειαν ὅτι τὴν δωρεὰν τοῦ θεοῦ ἐνόμισας διὰ χρημάτων κτᾶσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/020.yaml
  text: But Peter said to him[a], “May your silver perish with you[b], because you thought you could acquire the gift of God with money.”
translation:
  language: am
  text: ጴጥሮስ ግን፣ “የእግዚአብሔርን ስጦታ በገንዘብ ልታገኝ እንደምትችል ስላሰብህ፣ ብርህ ከአንተ ጋር ይጥፋ![a]” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ብርህ ከአንተ ጋር ለጥፋት ይሁን።” የግሪኩ አገላለጽ ከባድ የጥፋት ምኞት ወይም የፍርድ ንግግር ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀργύριόν
  choice: ብር
  rationale: ቃሉ በቀጥታ ብርን ወይም የብር ገንዘብን ያመለክታል፤ በአማርኛም «ብር» ተጨባጭ ምስሉንና የገንዘብ ትርጉሙን በተፈጥሮ ይይዛል።
- source_word: σὺν σοὶ
  choice: ከአንተ ጋር
  rationale: ስምዖንንና ብሩን በፍርዱ አንድ ላይ የሚያስቀምጠውን ግልጽ ትርጉም ይጠብቃል።
- source_word: εἴη εἰς ἀπώλειαν
  choice: ይጥፋ
  rationale: የግሪኩ ኦፕታቲቭ ከባድ ምኞትን ወይም የፍርድ ንግግርን ያሳያል፤ «ይጥፋ» ይህን ኃይል ሳያለዝብ የዘላለም ፍርድን በተለየ ሁኔታ አይጨምርም።
- source_word: δωρεὰν
  choice: ስጦታ
  rationale: ያለ ክፍያ የሚሰጥን ነገር በተፈጥሮ ይገልጣል፤ ከገንዘብ ጋር ያለውን ተቃርኖም ይጠብቃል።
- source_word: ἐνόμισας
  choice: ስለመሰለህ
  rationale: «አሰብህ/መሰለህ» የሚለውን ሐሳብ በአማርኛ ከምክንያታዊው አንቀጽ ጋር ተፈጥሯዊ በሆነ አገባብ ያቀርባል።
- source_word: διὰ χρημάτων
  choice: በገንዘብ
  rationale: διά ከጄኒቲቭ ጋር የመሣሪያን ወይም የማግኛ ዘዴን ያመለክታል፤ «በገንዘብ» ዘመናዊና ተፈጥሯዊ ነው።
- source_word: κτᾶσθαι
  choice: ልታገኝ
  rationale: «ማግኘት/ማፍራት» የሚለውን ሰፊ የማግኘት ሐሳብ ይጠብቃል፤ «መግዛት» ብሎ ከግሪኩ የበለጠ የንግድ ትርጉም አይጭንም።
- source_word: δὲ
  choice: ግን
  rationale: ከስምዖን ቀዳሚ ጥያቄ ጋር ያለውን ተቃርኖ በተፈጥሮ ያሳያል።
theological_decisions:
- issue: ጴጥሮስ በስምዖንና በብሩ ላይ የተናገረው ንግግር ኃይል
  choice: የጥፋት ምኞት/ከባድ የፍርድ ንግግር፤ «ብርህ ከአንተ ጋር ይጥፋ»
