  rationale: εἴη የምኞት ኃይል አለው፤ ἀπώλεια ጥፋትን ወይም ውድመትን ይገልጣል። ትርጉሙ የጴጥሮስን ጥብቅ ተግሣጽ ይጠብቃል፣ ግን ጽሑፉ በግልጽ ያልወሰነውን የመጨረሻ ፍርድ አይወስንም።
