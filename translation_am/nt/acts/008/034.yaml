base_translation:
  language: en
  yaml_path: translation/nt/acts/008/034.yaml
  text: Then the eunuch answered Philip and said[a], “I ask you, about whom does the prophet say this—about himself or about someone else?”
translation:
  language: am
  text: ጃንደረባውም ለፊልጶስ መልሶ፣ “እባክህ[a]፣ ነቢዩ ይህን የሚናገረው ስለ ማን ነው? ስለ ራሱ ነው ወይስ ስለ ሌላ ሰው?” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “እለምንሃለሁ” ተብሎም ሊተረጎም ይችላል። የግሪኩ አገላለጽ አክብሮት ያለውን ልመና የሚገልጽ ሲሆን፣ የበለጠ አጽንዖት ባለው አነጋገርም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: መልሶ
  rationale: የትረካውን ቀጣይነትና ከሚከተለው የንግግር ግስ ጋር ያለውን ፈሊጣዊ አጠቃቀም በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὁ εὐνοῦχος
  choice: ጃንደረባው
  rationale: የግሪኩን ልዩ መጠሪያ ይጠብቃል፤ በአገባቡ ውስጥ በአጠቃላይ ‘ባለሥልጣን’ ብሎ ለመተርጎም በቂ ምክንያት የለም።
- source_word: τῷ Φιλίππῳ εἶπεν
  choice: ለፊልጶስ … አለው
  rationale: የተነገረለትን ሰው የሚያመለክተውን ዳቲቭ በተፈጥሯዊ የአማርኛ አገባብ ያቀርባል።
- source_word: Δέομαί σου
  choice: እባክህ
  rationale: አክብሮት ያለውን ልመና በዘመናዊና ተፈጥሯዊ አማርኛ ያስተላልፋል፤ የግሪኩ አገላለጽ ከዚህ የበለጠ አጽንዖትም ሊኖረው ይችላል።
- source_word: περὶ τίνος
  choice: ስለ ማን
  rationale: περί ከጄኒቲቭ ጋር የሚያመለክተውን የንግግሩን ርዕሰ ጉዳይ በቀጥታና በተፈጥሯዊ መንገድ ይገልጣል።
- source_word: ὁ προφήτης λέγει τοῦτο
  choice: ነቢዩ ይህን የሚናገረው
  rationale: ከዚህ በፊት የተነበበውን ጥቅስ የሚያመለክተውን τοῦτο በግልጽ ሁኔታ ይጠብቃል።
- source_word: περὶ ἑαυτοῦ ἢ περὶ ἑτέρου τινός
  choice: ስለ ራሱ ነው ወይስ ስለ ሌላ ሰው
  rationale: ነቢዩ ራሱን ወይም ሌላን ሰው ማመልከቱን የሚጠይቀውን ግልጽ ንጽጽር ይጠብቃል።
