- issue: ἥρπασεν ተአምራዊና ድንገተኛ መወሰድን ምን ያህል በግልጽ ማሳየት እንዳለበት
  choice: “ነጥቆ ወሰደው” በማለት ድንገተኛውንና ኃይለኛውን መወሰድ ማሳየት
  alternative: “ወሰደው” ብቻ በማለት ኃይሉን ማለዘብ
  rationale: ግሱና የመንፈሱ ቀጥተኛ ተግባር ድንገተኛ መለኮታዊ ጣልቃ ገብነትን ያመለክታሉ። ዋናው ጽሑፍ ይህን የቃሉን ኃይል ይጠብቃል፤ የለዘበውም አማራጭ በማስታወሻ ተጠብቋል።
