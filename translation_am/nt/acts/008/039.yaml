- source_word: ὁ εὐνοῦχος
  choice: ጃንደረባው
  rationale: ግሪኩ ሰውየውን በግልጽ “ጃንደረባ” ይለዋል፤ ይህ ቃልም ከቀደመው ትረካ ጋር ያለውን ቀጣይነት ይጠብቃል።
- source_word: ἐπορεύετο τὴν ὁδὸν αὐτοῦ
  choice: መንገዱን ቀጠለ
  rationale: የግሪኩ ኢምፐርፌክት የቀጠለ እንቅስቃሴን ያሳያል፤ “መንገዱን ቀጠለ” የጉዞውን መቀጠል ተፈጥሯዊ በሆነ አማርኛ ያቀርባል።
