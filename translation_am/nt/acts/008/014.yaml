language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ οἱ ἐν Ἱεροσολύμοις ἀπόστολοι ὅτι δέδεκται ἡ Σαμάρεια τὸν λόγον τοῦ θεοῦ, ἀπέστειλαν πρὸς ⸀αὐτοὺς Πέτρον καὶ Ἰωάννην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/014.yaml
  text: When the apostles in Jerusalem heard that Samaria had received the word of God, they sent Peter and John to them,
translation:
  language: am
  text: በኢየሩሳሌም የነበሩት ሐዋርያት ሰማርያ የእግዚአብሔርን ቃል እንደተቀበለች በሰሙ ጊዜ፣ ጴጥሮስንና ዮሐንስን ወደ እነርሱ ላኩ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσαντες
  choice: በሰሙ ጊዜ
  rationale: የግሱን ቀዳሚ ጊዜያዊ ሁኔታ በተፈጥሯዊ አማርኛ ያሳያል፤ ‘ከሰሙ በኋላ’ ከሚለው ይልቅ ከዋናው ግስ ጋር ያለውን የጊዜ ግንኙነት በቀላሉ ይገልጣል።
- source_word: δὲ
  choice: በአማርኛው በተለየ ቃል አልተገለጸም
  rationale: እዚህ δέ ከባድ ተቃርኖ ሳይሆን ለትረካው ቀላል መሸጋገሪያ ነው፤ የአማርኛው የአረፍተ ነገር ፍሰት ይህን ያለ ተጨማሪ ቃል በቂ ሁኔታ ያሳያል።
- source_word: οἱ ἐν Ἱεροσολύμοις ἀπόστολοι
  choice: በኢየሩሳሌም የነበሩት ሐዋርያት
  rationale: ሐዋርያቱ በኢየሩሳሌም እንደነበሩ በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: δέδεκται
  choice: እንደተቀበለች
  rationale: የδέχομαιን የመቀበል ትርጉም ይጠብቃል፤ የፍጹም ጊዜው የተጠናቀቀ ድርጊትና ያለው ውጤት በአማርኛው የተጠናቀቀ ግስ ይገለጣል።
- source_word: ἡ Σαμάρεια
  choice: ሰማርያ
  rationale: የግሪኩን የቦታ ስም በቀጥታ ይጠብቃል፤ ቦታው ነዋሪዎቹን ወክሎ የተጠቀሰ መሆኑ ከአውዱ ይገባል። የአማርኛ ሰዋስውም ስሙን እንደ ሴት ነጠላ በ‘ተቀበለች’ ያስማማዋል።
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: የእግዚአብሔርን ቃል
  rationale: የግሪኩን ‘ቃል’ የሚለውን መጽሐፍ ቅዱሳዊ አገላለጽና ሥነ መለኮታዊ ክብደት ሳይተረጉም ይጠብቃል።
- source_word: ἀπέστειλαν
  choice: ላኩ
  rationale: ቀላል ያለፈ ድርጊትን በተፈጥሯዊና ክቡር አማርኛ ይገልጣል።
- source_word: πρὸς αὐτοὺς
  choice: ወደ እነርሱ
  rationale: ወደ ቀደም ብሎ በ‘ሰማርያ’ የተወከሉት ሰዎች የሚያመለክተውን አቅጣጫ ይጠብቃል።
- source_word: Πέτρον καὶ Ἰωάννην
  choice: ጴጥሮስንና ዮሐንስን
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የተለመዱትን የግል ስሞች ይጠቀማል፤ የተሳቢ ምልክት ‘-ን’ ለሁለቱም ስሞች ተገቢ ሆኖ ተጨምሯል።
theological_decisions:
- issue: ‘ሰማርያ’ የሚለው የቦታ ስም ነዋሪዎቹን ወክሎ መጠቀሙ
  choice: ሰማርያ የእግዚአብሔርን ቃል እንደተቀበለች
  alternative: ሳምራውያን የእግዚአብሔርን ቃል እንደተቀበሉ
  rationale: የግሪክ ምንጩ የክልሉን ስም በወካይነት ይጠቀማል። ይህን በዋናው ጽሑፍ ማቆየት የምንጩን አገላለጽ ይጠብቃል፣ ነዋሪዎቹ መታሰባቸውም ከአውዱ ግልጽ ነው።
- issue: λόγοςን ‘ቃል’ ወይም ‘መልእክት’ ብሎ መተርጎም
  choice: የእግዚአብሔር ቃል
  alternative: የእግዚአብሔር መልእክት
  rationale: ‘ቃል’ የሚለው ምርጫ የምንጩን ቃላዊ ቅርጽና የተለመደውን መጽሐፍ ቅዱሳዊ አገላለጽ ይጠብቃል፤ በአውዱ የተሰበከውን መልእክት እንደሚያመለክት ግልጽ ነው።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር መደበኛ አማርኛ ተጠቅሟል። የታሪኩ ፍሰት በተፈጥሯዊ የጊዜ አንቀጽ ተደራጅቷል፤ በምንጩ የሌለ ጠንካራ የመሸጋገሪያ ቃል አልተጨመረም።
