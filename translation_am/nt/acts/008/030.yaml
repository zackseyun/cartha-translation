  text: προσδραμὼν δὲ ὁ Φίλιππος ἤκουσεν αὐτοῦ ἀναγινώσκοντος ⸂Ἠσαΐαν τὸν προφήτην⸃ καὶ εἶπεν· Ἆρά γε γινώσκεις ἃ ἀναγινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/030.yaml
  text: So Philip ran up and heard him reading Isaiah the prophet[a], and said, “Do you really understand what you are reading?”
translation:
  language: am
  text: ፊልጶስም ወደ እርሱ ሮጦ ቀረበና ነቢዩ ኢሳይያስን ሲያነብ ሰማው። እንዲህም አለው፤ “የምታነበውን በእርግጥ ትረዳለህን?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የምታነበውን በእውነት ትረዳለህን?” የግሪክ አጋዥ ቃላት ለፊልጶስ ጥያቄ አጽንዖት ይሰጣሉ።
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδραμὼν
  choice: ወደ እርሱ ሮጦ ቀረበና
  rationale: የግሱን ፈጣን ወደ ሰውየው መቅረብ በተፈጥሯዊ አማርኛ ያሳያል፤ ‘ሮጦ’ የድርጊቱን ሕያውነት ይጠብቃል።
- source_word: δὲ
  choice: -ም / -ና
  rationale: የትረካውን ቀጣይነት በአማርኛ ተፈጥሯዊ የማያያዣ ቅርጾች ያሳያል።
- source_word: ἤκουσεν αὐτοῦ ἀναγινώσκοντος
  choice: ሲያነብ ሰማው
  rationale: ፊልጶስ ሰውየውን በማንበብ ላይ ሳለ እንደሰማው ያሳያል፤ በግሪክ በግልጽ ያልተነገረውን ‘ጮክ ብሎ’ አይጨምርም።
- source_word: Ἠσαΐαν τὸν προφήτην
  choice: ነቢዩ ኢሳይያስን
  rationale: የሚነበበው የነቢዩ ኢሳይያስ መጽሐፍ መሆኑን በተለመደና አጭር አማርኛ ይገልጣል።
- source_word: εἶπεν
  choice: እንዲህም አለው
  rationale: የλέγω ቀጥተኛ አቻ ሲሆን ቀጥሎ ያለው ጥያቄ የንግግሩን ዓይነት ግልጽ ያደርጋል።
- source_word: Ἆρά γε
  choice: በእርግጥ ... -ን?
  rationale: የግሪኩን አጽንዖትና መርማሪ ጥያቄነት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: γινώσκεις
  choice: ትረዳዋለህ
  rationale: በዐውዱ የሚያመለክተው የሚነበበውን ትርጉም መገንዘብ እንጂ በቀላሉ ማወቅ አይደለም።
- source_word: ἃ ἀναγινώσκεις
  choice: የምታነበውን
  rationale: አንጻራዊው ተውላጠ ስም የሚያመለክተውን የንባብ ይዘትና የአሁኑን ቀጣይ ድርጊት በተፈጥሯዊ ቅርጽ ይይዛል።
