  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀πολλοὶ γὰρ τῶν ἐχόντων πνεύματα ἀκάθαρτα βοῶντα φωνῇ μεγάλῃ ⸀ἐξήρχοντο, πολλοὶ δὲ παραλελυμένοι καὶ χωλοὶ ἐθεραπεύθησαν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/007.yaml
  text: For many who had unclean spirits[a], they came out crying with a loud voice; and many who were paralyzed and lame were healed.
translation:
  language: am
  text: ምክንያቱም፣ ርኩሳን መናፍስት ከነበሩባቸው ብዙ ሰዎች ውስጥ መናፍስቱ በታላቅ ድምፅ እየጮኹ ይወጡ ነበር፤ ሽባዎችና አንካሶች የነበሩ ብዙዎችም ተፈወሱ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὶ γὰρ τῶν ἐχόντων
  choice: ርኩሳን መናፍስት ከነበሩባቸው ከብዙ ሰዎች
  rationale: የግሪኩን ከፊል አወቃቀር በተፈጥሯዊ አማርኛ ያቀርባል፤ γάρ የሚያሳየው ከቀደመው ንግግር ጋር ያለው ምክንያታዊ ግንኙነት በአማርኛው የንግግር ፍሰት ውስጥ በተዘዋዋሪ ተጠብቋል።
- source_word: πνεύματα ἀκάθαρτα
  choice: ርኩሳን መናፍስት
  rationale: በወንጌላትና በሐዋርያት ሥራ የአጋንንታዊ መናፍስትን ሁኔታ የሚገልጽ፣ የተለመደና ትክክለኛ አማርኛ ነው።
- source_word: βοῶντα φωνῇ μεγάλῃ
  choice: በታላቅ ድምፅ እየጮኹ
  rationale: የተሳቢ ግሱን ቀጣይ ድርጊትና φωνῇ μεγάλῃ የሚገልጸውን ከፍተኛ ድምፅ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐξήρχοντο
  choice: ወጡ
  rationale: በአጋንንት ማስወጣት አውድ ውስጥ የመናፍስቱን ከሰዎቹ መውጣት በግልጽ የትረካ ቋንቋ ያቀርባል።
- source_word: παραλελυμένοι
  choice: ሽባዎች
  rationale: የሰውነት ክፍል መንቀሳቀስ ያልቻሉ ሰዎችን በዘመናዊና አጭር አማርኛ ይገልጻል።
- source_word: χωλοὶ
  choice: አንካሶች
  rationale: በእግር የመራመድ እክል ያለባቸውን ሰዎች በተለመደው የመጽሐፍ ቅዱስ አማርኛ ይገልጻል።
- source_word: ἐθεραπεύθησαν
  choice: ተፈወሱ
  rationale: የግሪኩን ተደራጊ አኳኋን ይጠብቃል፤ ፈዋሹን በዚህ ሐረግ ውስጥ በስም አይጨምርም።
theological_decisions:
- issue: ጮኸው የወጡት ማን እንደሆኑ
  choice: ርኩሳን መናፍስቱ በታላቅ ድምፅ እየጮኹ ከሰዎቹ ወጡ።
  alternative: መናፍስቱ ሲወጡ መናፍስት የነበሩባቸው ሰዎች ጮኹ።
  rationale: ገለልተኛው ብዙ ቁጥር ተሳቢ βοῶντα ከገለልተኛው ብዙ ቁጥር πνεύματα ἀκάθαρτα ጋር በሰዋስው በቀጥታ ይስማማል። ይህም ጮኸው የወጡት መናፍስቱ መሆናቸውን በተፈጥሮ ያመለክታል፤ የሰዎቹ ጩኸት የሚለው ግንዛቤ በማስታወሻ ተጠቅሷል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የመናፍስቱን የግስ ማጣቀሻ ግልጽ ለማድረግ “መናፍስቱ” ተደግሟል፤ የግሪኩ አሻሚ ሊሆን የሚችል አነባበብ ግን በእግር ማስታወሻ ተጠብቋል።
