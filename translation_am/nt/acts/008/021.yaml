id: ACT.8.21
reference: Acts 8:21
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὐκ ἔστιν σοι μερὶς οὐδὲ κλῆρος ἐν τῷ λόγῳ τούτῳ, ἡ γὰρ καρδία σου οὐκ ἔστιν εὐθεῖα ⸀ἔναντι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/021.yaml
  text: You have neither part nor share in this matter, because your heart is not right before God.
translation:
  language: am
  text: በዚህ ጉዳይ ምንም ድርሻም ሆነ ዕጣ የለህም፤ ልብህ በእግዚአብሔር ፊት ቅን አይደለምና።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μερὶς
  choice: ድርሻ
  rationale: በአንድ ጉዳይ ወይም ተግባር ውስጥ ያለን ክፍል ወይም ተሳትፎ በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል።
- source_word: κλῆρος
  choice: ዕጣ
  rationale: የግሪኩን የዕጣ፣ የተመደበ ክፍል ወይም ድርሻ ምስል ይጠብቃል፤ μερίς ጋር ያለውን ተመሳሳይነትም ሳያጠፋ ልዩ ቃል ይጠቀማል።
- source_word: λόγῳ τούτῳ
  choice: በዚህ ጉዳይ
  rationale: λόγος እዚህ በአውዱ ንግግርን ብቻ ሳይሆን በውይይት ላይ ያለውን ጉዳይ ያመለክታል።
- source_word: καρδία
  choice: ልብ
  rationale: የውስጥ አሳብን፣ ፍላጎትንና አቋምን የሚያመለክተውን መጽሐፍ ቅዱሳዊ ምሳሌ በቀጥታ ይጠብቃል።
- source_word: εὐθεῖα
  choice: ቅን
  rationale: ቀጥተኛ፣ ትክክለኛ ወይም ከክፋት የጸዳ የውስጥ አቋምን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἔναντι τοῦ θεοῦ
  choice: በእግዚአብሔር ፊት
  rationale: የመለኮታዊ ግምገማና ተገኝነት ሐሳብን በታወቀ አማርኛ አገላለጽ ያስተላልፋል።
theological_decisions:
- issue: የμερὶς እና κλῆρος ድርብ አገላለጽ
  choice: “ድርሻም ሆነ ዕጣ” በማለት ሁለቱንም ስሞች ማቆየት
  alternative: ሁለቱንም “ድርሻ” በሚል አንድ ቃል ማጠቃለል
  rationale: ጽሑፉ የሚሰጠውን አጽንዖትና የκλῆροςን ሊኖር የሚችል የተመደበ ክፍል/ዕጣ ጥላ ሳይፈታ ይጠብቃል።
- issue: “በእግዚአብሔር ፊት” የሚለው የፍርድ አመለካከት
  choice: ስለ ሰውየው የመጨረሻ ድነት ውሳኔ ሳይጨመር የልቡን አሁናዊ አለመቅናት ብቻ መግለጽ
  alternative: ንግግሩን የዘላለም ፍርድ ውሳኔ አድርጎ ማብራራት
  rationale: የግሪኩ ጽሑፍ ልቡ በእግዚአብሔር ፊት ቅን እንዳልሆነ ይናገራል፤ ከዚያ በላይ የሥነ መለኮት ውሳኔ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለመደበኛ አንባቢ ግልጽ የሆነ አማርኛ። “ምንም … የለህም” የοὐκ … οὐδὲን ፍጹም እምቢታ ያስተላልፋል፤ “አይደለምና” ደግሞ γάρ የሚሰጠውን ምክንያት በተፈጥሯዊ አማርኛ ያገናኛል።
