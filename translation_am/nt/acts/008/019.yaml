  text: λέγων· Δότε κἀμοὶ τὴν ἐξουσίαν ταύτην ἵνα ᾧ ἐὰν ἐπιθῶ τὰς χεῖρας λαμβάνῃ πνεῦμα ἅγιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/019.yaml
  text: saying[a], “Give me also this authority, so that anyone on whom I lay my hands may receive the Holy Spirit.”
translation:
  language: am
  text: እንዲህ ሲል፦ “እኔም እጆቼን በምጭንበት ሰው ሁሉ መንፈስ ቅዱስን እንዲቀበል፣ ይህን ሥልጣን[a] ስጡኝ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ኃይል።” ἐξουσία የሚለው የግሪክ ቃል የተሰጠ ሥልጣንን፣ መብትን ወይም አንድን ነገር የማድረግ ኃይልን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: እንዲህም አለ
  rationale: የአሁን ጊዜው አንቀጸ ግስ ከቀደመው ትረካ ጋር የሚያገናኘውን ተግባር በተፈጥሯዊ የአማርኛ ትረካ አገላለጽ ያቀርባል።
- source_word: Δότε
  choice: ስጡኝ
  rationale: የብዙ ቁጥር ትእዛዝ መሆኑን ይጠብቃል፤ የተቀባዩ ቅጥያ ከκἀμοί ጋር በተፈጥሯዊነት ተዋህዷል።
- source_word: κἀμοί
  choice: እኔም … ስጡኝ
  rationale: καί + ἐμοί ያለውን ‘ለእኔም’ የማካተት አጽንዖት ያስጠብቃል።
- source_word: ἐξουσίαν
  choice: ሥልጣን
  rationale: ቃሉ የተሰጠ ሥልጣንን፣ መብትን ወይም የመፈጸም ችሎታን ሊያመለክት ስለሚችል ‘ሥልጣን’ ዋናውን የቃል ልዩነት ይጠብቃል።
- source_word: ταύτην
  choice: ይህን
  rationale: ስምዖን አሁን ያየውን የተወሰነ ሥልጣን ያመለክታል።
- source_word: ἵνα
  choice: እንዲቀበል
  rationale: የጥያቄውን ዓላማ በተፈጥሯዊ የአማርኛ የዓላማ ንዑስ ሐረግ ይገልጣል።
- source_word: ᾧ ἐὰν
  choice: የምጭንበት ሰው ሁሉ
  rationale: ያልተወሰነውንና አጠቃላይ ሁኔታውን ‘ሰው ሁሉ’ በሚል ግልጽ አማርኛ ያስተላልፋል።
- source_word: ἐπιθῶ τὰς χεῖρας
  choice: እጄን የምጭንበት
  rationale: እጅን በሰው ላይ የመጫንን ተጨባጭ ምስል በተለመደ አማርኛ ይጠብቃል። ግሪኩ ብዙ ቁጥር ‘እጆች’ ቢልም በአማርኛ የነጠላ ስም እንደ የአካል ክፍል በአጠቃላይ ሊያመለክት ይችላል።
- source_word: λαμβάνῃ
  choice: እንዲቀበል
  rationale: በἵνα ሥር ያለውን ተፈላጊ ውጤት ያለ ተጨማሪ ጊዜያዊ ትርጓሜ ያቀርባል።
- source_word: πνεῦμα ἅγιον
  choice: መንፈስ ቅዱስን
  rationale: በሐዋርያት ሥራ ዐውድ ውስጥ ሐረጉ የእግዚአብሔርን ቅዱስ መንፈስ ያመለክታል፤ የአማርኛው የተለመደ መለኮታዊ ስያሜም ይህን በግልጽ ይገልጣል።
theological_decisions:
- issue: አንቀጽ የሌለው πνεῦμα ἅγιον ያልተወሰነ ‘አንድ ቅዱስ መንፈስ’ ተብሎ መተርጎም አለበት ወይስ የታወቀውን መለኮታዊ መንፈስ ያመለክታል?
  choice: መንፈስ ቅዱስን
  alternative: አንድን ቅዱስ መንፈስ
  rationale: በሐዋርያት ሥራ ትረካ ዐውድ ሐረጉ የታወቀውን መለኮታዊ መንፈስ ያመለክታል። በግሪክ አንቀጽ አለመኖሩ ብቻ ያልተወሰነ ፍጡር መንፈስን አያመለክትም፤ ‘አንድን’ ማከልም ዐውዱ የማይደግፈውን ትርጉም ያስገባል።
- issue: ἐξουσία በዚህ ስፍራ ‘ሥልጣን’ ወይስ ‘ኃይል’ ተብሎ መተርጎም
  choice: ሥልጣን
  alternative: ኃይል
  rationale: ዐውዱ ውጤታማ ኃይልን ቢያካትትም ἐξουσία የመፈጸም ሥልጣንን ወይም መብትንም ይገልጣል። ‘ሥልጣን’ ከδύναμις ይበልጥ በቀጥታ ‘ኃይል’ ከሚለው ቃል ያለውን የቃላት ልዩነት ይጠብቃል፤ ‘ኃይል’ ግን ተቀባይነት ያለው የዐውድ አማራጭ ነው።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ የአማርኛ ትረካ ተጠቅሟል። ‘እንዲህም አለ’ ከግሪኩ አንቀጸ ግስ ይልቅ በቅርጽ ነፃ ቢሆንም በአማርኛ ተፈጥሯዊ ነው፤ የንግግሩንም ግንኙነት ይጠብቃል።
