  text: Then they laid their hands on them, and they were receiving the Holy Spirit.
translation:
  language: am
  text: ከዚያም እጆቻቸውን በእነርሱ ላይ ጫኑ፤ እነርሱም መንፈስ ቅዱስን ይቀበሉ ነበር።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም ይበልጥ ቃል በቃል፦ “ከዚያም እጆቻቸውን በእነርሱ ላይ ይጭኑ ነበር፤ እነርሱም መንፈስ ቅዱስን ይቀበሉ ነበር።” ሁለቱም የግሪክ ግሶች የቀጣይነት ገጽታ ያላቸው የአለፈ ጊዜ ቅርጾች ናቸው።
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: ከዚያም
  rationale: በትረካው ውስጥ ቀጥሎ የተፈጸመውን ድርጊት በተፈጥሯዊ ዘመናዊ አማርኛ ያመለክታል።
- source_word: ἐπετίθεσαν τὰς χεῖρας ἐπ’ αὐτούς
  choice: እጆቻቸውን በእነርሱ ላይ ጫኑ
  rationale: የእጅ መጫንን የሚገልጸውን የግሪክ ፈሊጥ በተለመደና ግልጽ አማርኛ ያቀርባል፤ የግሪኩ የተወሰነ አመልካች በአማርኛ ተፈጥሯዊ በሆነው የባለቤትነት ቅጽ ተገልጧል።
- source_word: ἐλάμβανον
  choice: ይቀበሉ ነበር
  rationale: ያልተፈጸመውን የግሪክ የአለፈ ጊዜ ገጽታ (imperfect) በአማርኛ የቀጣይነት ቅርጽ ያንጸባርቃል፤ ‘መቀበል ጀመሩ’ በማለት ጅማሬን አያክልም።
- source_word: πνεῦμα ἅγιον
  choice: መንፈስ ቅዱስን
  rationale: በሉቃስ–ሐዋርያት ዐውድ የተስፋውን መለኮታዊ መንፈስ ያመለክታል። ይህ በአማርኛ የተለመደውንና ግልጽ ስያሜ ይጠብቃል።
theological_decisions:
- issue: πνεῦμα ἅγιον ያልተወሰነ መንፈስን ወይስ መለኮታዊውን መንፈስ እንደሚያመለክት
  choice: መንፈስ ቅዱስን
  alternative: አንድን ቅዱስ መንፈስ
  rationale: የቅርብ ዐውዱና የሉቃስ–ሐዋርያት አጠቃቀም አማኞች የሚቀበሉትን መለኮታዊ መንፈስ ያመለክታሉ፤ ያልተወሰነ አተረጓጎም ዋቢውን ያዛባል።
- issue: የሁለቱን የግሪክ imperfect ግሶች ገጽታ በአማርኛ እንዴት ማቅረብ እንደሚገባ
  choice: የመጀመሪያውን በተፈጥሯዊ ቀላል አለፈ ጊዜ፣ ሁለተኛውን በቀጣይነት ቅርጽ ማቅረብ
  alternative: ሁለቱንም በቀጣይነት ቅርጽ ማቅረብ፦ ‘እጆቻቸውን ... ይጭኑባቸው ነበር፤ ... ይቀበሉም ነበር’
  rationale: ዋናው ንባብ ተፈጥሯዊ የአማርኛ ትረካን ከምንጩ ገጽታ ጋር ያመጣጥናል፤ ሁለቱም ግሶች imperfect መሆናቸው በማስታወሻው በግልጽ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ። ‘እነርሱ’ በመድገም የመንፈስ ቅዱስ ተቀባዮች እጅ ከጫኑት ሐዋርያት የተለዩ መሆናቸው ግልጽ ተደርጓል።
