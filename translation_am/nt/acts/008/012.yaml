base_translation:
  language: en
  yaml_path: translation/nt/acts/008/012.yaml
  text: But when they believed Philip as he proclaimed the good news about the kingdom of God and the name of Jesus the Messiah[a], they were being baptized, both men and women.
translation:
  language: am
  text: ነገር ግን ፊልጶስ ስለ እግዚአብሔር መንግሥትና ስለ የኢየሱስ መሲሕ ስም የምሥራቹን ሲያበስር፣ ሰዎቹ ፊልጶስን ባመኑ ጊዜ ወንዶችም ሴቶችም ይጠመቁ ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτε δὲ
  choice: ነገር ግን … ባመኑ ጊዜ
  rationale: ὅτε የጊዜ ንዑስ ሐረግን ያስገባል፤ δέ ደግሞ ከቀደመው ትረካ ጋር ያለውን መጠነኛ ንፅፅር ወይም የትረካ ሽግግር ያመለክታል።
- source_word: ἐπίστευσαν τῷ Φιλίππῳ
  choice: ሰዎቹ እርሱን ባመኑ
  rationale: ከተሳቢ ጋር የመጣው πιστεύω ፊልጶስን እንደ ተናጋሪና ምስክር ማመናቸውን ያመለክታል እንጂ በእርሱ ላይ የማዳን እምነት ማድረጋቸውን አይደለም። ‘ሰዎቹ’ የሚለው ግልጽ ባለቤት በአማርኛ የሐረጉን ፍሰት ያሳምራል።
- source_word: εὐαγγελιζομένῳ
  choice: የምሥራቹን ሲያበስር
  rationale: የአሁን ጊዜው አሳታፊ ግስ ፊልጶስ በማብሰር ላይ ሳለ እንዳመኑት ያሳያል፤ ‘የምሥራቹን ማብሰር’ የግሱን የወንጌል ማወጅ ኃይል በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τῆς βασιλείας τοῦ θεοῦ
  choice: ስለ እግዚአብሔር መንግሥት
  rationale: የግሪኩን የተለመደ መጽሐፍ ቅዱሳዊ አገላለጽ በግልጽና በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: τοῦ ὀνόματος Ἰησοῦ Χριστοῦ
  choice: ስለ ኢየሱስ መሲሕ ስም
  rationale: ὄνομα ስሙ የሚወክለውን ማንነትና ሥልጣን ሊያካትት ስለሚችል ‘ስም’ በግልጽ ተጠብቋል። Χριστός በዚህ ስፍራ የማዕረግ ኃይል ስላለው ‘መሲሕ’ ተብሏል።
- source_word: ἐβαπτίζοντο
  choice: ይጠመቁ ነበር
  rationale: የግሪኩ ኢምፐርፌክት ተደራጊ ቅርጽ ሰዎች በየጊዜው ሲያምኑ ጥምቀቱ ይከናወን እንደነበር ያሳያል፤ የአማርኛው ቅርጽ ይህን ቀጣይነት ይጠብቃል።
- source_word: ἄνδρες τε καὶ γυναῖκες
  choice: ወንዶችም ሴቶችም
  rationale: τε … καὶ ሁለቱን ቡድኖች በአንድነት ያጣምራል፤ ይህ አገላለጽ የሉቃስን ግልጽ አጽንዖት በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: በἸησοῦ Χριστοῦ ውስጥ Χριστοῦን መተርጎም
  choice: ኢየሱስ መሲሕ
  alternative: ኢየሱስ ክርስቶስ
  rationale: Χριστός እዚህ እንደ ተራ የግል ስም ሳይሆን እንደ መሲሓዊ ማዕረግ ይሠራል። ‘መሲሕ’ ይህን የማዕረግ ኃይል ይጠብቃል፤ በአማርኛ ግን በስሙ ቀጥሎ ያለ መስተዋድድ መቅረቡ ተፈጥሯዊ ነው።
