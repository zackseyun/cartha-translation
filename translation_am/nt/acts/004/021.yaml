    text: ወይም፣ “እንደገና ካስፈራሯቸው” ወይም “ማስፈራሪያ ከጨመሩባቸው።” የግሪኩ ቃል ቀደም ሲል ከተደረገው ማስፈራራት በተጨማሪ ወይም ይበልጥ የተጠናከረ ማስፈራራትን ያመለክታል።
    reason: lexical_alternative
