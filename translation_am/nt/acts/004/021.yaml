  text: እነርሱም ተጨማሪ ማስፈራሪያ ከሰጧቸው[a] በኋላ፣ በሕዝቡ ምክንያት ሊቀጧቸው የሚችሉበትን ምንም መንገድ ሳያገኙ፣ ለቀቋቸው፤ ሁሉም በተከናወነው ነገር ምክንያት እግዚአብሔርን ያከብሩ ነበርና።
  philosophy: optimal-equivalence
  footnotes:
