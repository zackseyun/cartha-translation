  choice: ሁሉም … እግዚአብሔርን ያከብሩ ነበር
  rationale: πάντες ያለውን አጠቃላይ ትርጉም ‘ሁሉም’ ይጠብቃል፤ የἐδόξαζον ያልተጠናቀቀ ቀጣይ ገጽታም ‘ያከብሩ ነበር’ በሚለው ይገለጣል።
