  rationale: ቃል በቃል ‘እንዴት እንደሚቀጧቸው ምንም ሳያገኙ’ የሚለውን አወቃቀር ተፈጥሯዊ አማርኛ ሲያደርግ፣ የቅጣት መንገድ ወይም ዘዴ አለማግኘታቸውን ይጠብቃል።
- source_word: διὰ τὸν λαόν
