id: ACT.4.17
reference: Acts 4:17
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα μὴ ἐπὶ πλεῖον διανεμηθῇ εἰς τὸν λαόν, ⸀ἀπειλησώμεθα αὐτοῖς μηκέτι λαλεῖν ἐπὶ τῷ ὀνόματι τούτῳ μηδενὶ ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/017.yaml
  text: But so that it may not spread any further among the people, let us warn them not to speak any longer to anyone in this name.
translation:
  language: am
  text: ነገር ግን ይህ በሕዝቡ መካከል ከዚህ ይበልጥ እንዳይስፋፋ፣ ከእንግዲህ ለማንም ሰው በዚህ ስም እንዳይናገሩ እናስፈራራቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διανεμηθῇ
  choice: እንዳይስፋፋ
  rationale: ግሱ ቃል በቃል መከፋፈልን ወይም መሰራጨትን ሊያመለክት ቢችልም፣ በዚህ አውድ ወሬውና ትምህርቱ በሕዝብ መካከል መዛመቱን ያመለክታል፤ ‘መስፋፋት’ ተፈጥሯዊና ትክክለኛ ነው።
- source_word: ἐπὶ πλεῖον
  choice: ከዚህ ይበልጥ
  rationale: አሁን ካለበት ደረጃ ወዲያ የሚኖርን መጠናዊ ወይም ስፋታዊ ጭማሪ ይገልጣል።
- source_word: λαός
  choice: ሕዝቡ
  rationale: በዚህ አውድ በአጠቃላይ የአይሁድን ሕዝብ ያመለክታል፤ ‘ሕዝቡ’ የተለመደና ሰፊ አገላለጽ ነው።
- source_word: ἀπειλησώμεθα
  choice: እናስፈራራቸው
  rationale: የግሪኩ ግስ ቀጥተኛ ትርጉም ማስፈራራት ሲሆን፣ የሸንጎውን ባለሥልጣናዊና አስገዳጅ እርምጃ በግልጽ ያሳያል።
- source_word: μηκέτι λαλεῖν
  choice: ከእንግዲህ … እንዳይናገሩ
  rationale: μηκέτι ከዚህ ጊዜ ጀምሮ ድርጊቱ እንዲቆም የሚያዝ ጊዜያዊ አሉታዊ ኃይል አለው፤ ‘ከእንግዲህ’ ይህን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐπὶ τῷ ὀνόματι τούτῳ
  choice: በዚህ ስም
  rationale: ከዚህ ስም ጋር ተያይዞ፣ ስሙን በመጥራት ወይም በሥልጣኑ መናገርን የሚያካትት ሆኖ የምንጩን አጭርና ሆን ብሎ ያልተፈታ አገላለጽ ይጠብቃል።
- source_word: μηδενὶ ἀνθρώπων
  choice: ለማንም ሰው
  rationale: የተከለከለው ንግግር ተቀባይ ማንኛውም ሰው መሆኑን በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: የἀπειλησώμεθα ኃይል በሸንጎው ምላሽ ውስጥ
  choice: እናስፈራራቸው
  alternative: እናስጠንቅቃቸው
  rationale: ቃሉ ተራ ማስጠንቀቂያን ብቻ ሳይሆን ከባለሥልጣናት የሚመጣ ዛቻና ማስፈራራትን ይገልጣል። ቀጥተኛው የአማርኛ አቻ ተፈጥሯዊ ስለሆነ በዋናው ጽሑፍ መጠቀሙ የምንጩን ኃይል ይጠብቃል።
- issue: ‘በዚህ ስም’ የሚለው አገላለጽ ወሰን
  choice: የምንጩን አጭር አገላለጽ እንዳለ መጠበቅ
  alternative: ‘በዚህ ስም ሥልጣን’ ወይም ‘ስለዚህ ስም’ ብሎ መፍታት
  rationale: ሐረጉ በስሙ፣ ስለ ስሙ፣ ወይም በስሙ ሥልጣን የመናገር ገጽታዎችን ሊያካትት ስለሚችል አንዱን ብቻ በትርጉም አልተጫነበትም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለመደበኛ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘እናስፈራራቸው’ የምንጩን የዛቻ ኃይል በዋናው ጽሑፍ በቀጥታ ስለሚያስተላልፍ የግርጌ ማስታወሻ አላስፈለገም።
