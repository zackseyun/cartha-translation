  text: For we are not able not to speak about what we have seen and heard[a].
translation:
  language: am
  text: እኛ ያየነውንና የሰማነውን ከመናገር መቆጠብ አንችልምና።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም ቃል በቃል፦ “እኛ ያየነውንና የሰማነውን አለመናገር አንችልምና።”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ δυνάμεθα
  choice: አንችልም
  rationale: የግሪኩን የአለመቻል ኃይል በቀጥታ ያስተላልፋል፤ ይህን እንደ ተራ ፈቃድ ወይም ውሳኔ አያቀርበውም።
- source_word: γὰρ
  choice: -ና
  rationale: በአማርኛ ከግሱ ጋር የተያያዘው “-ና” ቀዳሚውን ንግግር የሚያብራራ ምክንያት መሆኑን ተፈጥሯዊ በሆነ መንገድ ያሳያል።
- source_word: ἡμεῖς
  choice: እኛ
  rationale: በግሪኩ በግልጽ የተጠቀሰውንና አጽንዖት ያለውን ተውላጠ ስም ይጠብቃል።
- source_word: ἃ
  choice: ያየነውንና የሰማነውን
  rationale: አንጻራዊው ተውላጠ ስም የሚያመለክተውን የምስክርነት ይዘት በተፈጥሯዊ የአማርኛ አወቃቀር ያቀርባል።
- source_word: εἴδαμεν καὶ ἠκούσαμεν
  choice: ያየነውንና የሰማነውን
  rationale: ሁለቱንም የዓይንና የጆሮ ምስክርነት እኩል ያቆያል፤ የአማርኛው ፍጹም አንጻራዊ ቅርጽ ክስተቶቹንና ቀጣይ አግባብነታቸውን በተፈጥሮ ይገልጣል።
- source_word: μὴ λαλεῖν
  choice: ሳንናገር መቅረት
  rationale: “አለመናገር” የሚለውን ትርጉም በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጣል፤ ከ“አንችልም” ጋር ሲጣመር ዝም ማለት እንደማይችሉ ያሳያል።
- source_word: λαλεῖν
  choice: መናገር
  rationale: በዐውዱ የታየውንና የተሰማውን ለሌሎች መናገርን የሚገልጽ ግልጽና የተለመደ ቃል ነው።
theological_decisions:
- issue: የሐዋርያቱ ንግግር እንደ አለመቻል ነው ወይስ እንደ ብርቱ ፈቃድ?
  choice: ሐዋርያቱ ስላዩትና ስለሰሙት ሳይናገሩ መቅረት እንደማይችሉ ተተርጉሟል።
  alternative: “መናገራችንን አናቆምም” በማለት እንደ ውሳኔ ወይም እንደ ፈቃድ ብቻ ማቅረብ።
  rationale: οὐ δυνάμεθα ... μὴ λαλεῖν በቀጥታ የሚገልጸው ከመናገር መቆጠብ አለመቻልን ነው፤ ትርጉሙ ይህን ኃይል ሳያለዝብ ጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ሳንናገር መቅረት አንችልም” የግሪኩን ድርብ አሉታዊ አወቃቀር ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
