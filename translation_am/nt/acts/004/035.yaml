  verdict: revise
  source_fidelity: The draft correctly reflects the imperfect, repeated/ongoing sense of both ἐτίθουν and διεδίδετο, leaves the distributed item implicit, and retains the concrete image involving the apostles’ feet. However, እንደ ፍላጎቱ can suggest personal preference rather than χρεία, ‘need,’ and it does not explicitly carry the clause’s ‘as anyone had need’ force.
  naturalness: ይከፋፈል ነበር is a natural passive-progressive rendering. Replacing እንደ ፍላጎቱ with ማንም በሚያስፈልገው መጠን gives clear, modern Amharic and accurately expresses distribution in proportion to need. በሐዋርያት እግር ሥር is the customary and natural Amharic expression for ‘at the apostles’ feet.’
  terminology: Use የሚያስፈልገው rather than ፍላጎት for χρεία in this context, since the former denotes necessity/need without the possible sense of desire or preference. No doctrinal terminology is implicated.
