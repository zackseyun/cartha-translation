  - severity: low
    issue: እግር ፊት is less idiomatic than the standard expression.
    rationale: በሐዋርያት እግር ሥር is a natural Amharic idiom that retains the source’s physical ‘at the feet’ imagery without reducing it merely to delegated authority.
