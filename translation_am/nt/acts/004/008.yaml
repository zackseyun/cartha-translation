  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τότε Πέτρος πλησθεὶς πνεύματος ἁγίου εἶπεν πρὸς αὐτούς· Ἄρχοντες τοῦ λαοῦ καὶ ⸀πρεσβύτεροι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/008.yaml
  text: Then Peter, filled with the Holy Spirit, said to them, “Rulers of the people and elders,”
translation:
  language: am
  text: በዚያን ጊዜ ጴጥሮስ በመንፈስ ቅዱስ ተሞልቶ እንዲህ አላቸው፦ “የሕዝቡ ገዢዎችና ሽማግሌዎች ሆይ፣
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: በዚያን ጊዜ
  rationale: ቀጣዩን የትረካ ክስተት የሚያስገባ የጊዜ አመልካች ነው፤ ይህ አገላለጽ በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: Πέτρος
  choice: ጴጥሮስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ ወግ የተለመደውን የስሙን አጻጻፍ ይጠቀማል።
- source_word: πλησθεὶς
  choice: ተሞልቶ
  rationale: የግሪኩን የተደራጊ አንቀጽ ኃይል እና ከዋናው ግስ በፊት ያለውን ተግባር በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: πνεύματος ἁγίου
  choice: በመንፈስ ቅዱስ
  rationale: ከ‘ተሞልቶ’ ጋር በአማርኛ ተፈጥሯዊ የሆነውን አገባብ ይሰጣል፤ በሐዋርያት ሥራ አውድ የሚጠቀሰውን መለኮታዊ መንፈስ በግልጽ ያመለክታል።
- source_word: εἶπεν πρὸς αὐτούς
  choice: እንዲህ አላቸው
  rationale: ቀጥተኛ ንግግርን ለማስገባት በአማርኛ የተለመደና ተፈጥሯዊ የትረካ አገላለጽ ነው።
- source_word: Ἄρχοντες
  choice: ገዢዎች
  rationale: በፖለቲካዊና በፍርድ ሥልጣን ላይ ያሉትን ሰዎች የሚያመለክተውን ይፋዊ ትርጉም ይጠብቃል።
- source_word: τοῦ λαοῦ
  choice: የሕዝቡ
  rationale: በዚህ የማኅበረሰብና የሃይማኖት አውድ ያለውን ‘የሕዝቡ’ የሚል ቀጥተኛ ትርጉም ይሰጣል።
- source_word: πρεσβύτεροι
  choice: ሽማግሌዎች
  rationale: እዚህ ላይ ቃሉ በዕድሜ የገፉ ወንዶችን ብቻ ሳይሆን ዕውቅና ያላቸውን የሕዝብ ሽማግሌዎች ያመለክታል።
theological_decisions:
- issue: የπνεύματος ἁγίου አተረጓጎም
  choice: መንፈስ ቅዱስ
  alternative: ቅዱስ መንፈስ
  rationale: በሐዋርያት ሥራ አውድ ለምስክርነትና ለንግግር የሚያበረታውን መለኮታዊ መንፈስ ያመለክታል፤ ‘መንፈስ ቅዱስ’ የተለመደውን የአማርኛ መጠሪያ ይጠብቃል።
