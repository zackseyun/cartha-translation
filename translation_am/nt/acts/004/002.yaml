review_pass:
  verdict: revise
  source_fidelity: 'The draft reverses the referents: διαπονούμενοι is the predicate of the authorities introduced in Acts 4:1, while αὐτούς is the object of the infinitives and refers to Peter and John. Thus, the current wording says that the same people who taught and proclaimed were disturbed by doing so. The revision restores the source syntax and discourse referents.'
  naturalness: The revised sentence is natural modern standard Amharic. Repeating «ጴጥሮስንና ዮሐንስን» makes the otherwise context-dependent pronoun relationship clear without changing the meaning. «እጅግ ተበሳጭተው» appropriately conveys strong irritation/distress.
  terminology: «ሕዝቡን», «ማስተማር», and «ማወጅ» are suitable. «ከሙታን መነሣት» is clear and retains the semantic scope of ἀνάστασις τὴν ἐκ νεκρῶν. «በኢየሱስ» deliberately preserves the ambiguity of ἐν τῷ Ἰησοῦ; the footnote offers a limited clarification without resolving it doctrinally.
  issues:
  - severity: high
    issue: The main clause and infinitival subjects/objects are conflated.
    rationale: «እነርሱ ሕዝቡን ስላስተማሩና ... ስላወጁ እጅግ ተበሳጭተው ነበር» makes «እነርሱ» both the disturbed authorities and the people teaching. In Greek, the authorities are disturbed because Peter and John were teaching and proclaiming.
  revised_text: እነርሱም ጴጥሮስንና ዮሐንስን ሕዝቡን ስለሚያስተምሩና በኢየሱስ ከሙታን መነሣትን ስለሚያውጁ[a] እጅግ ተበሳጭተው ነበር።
