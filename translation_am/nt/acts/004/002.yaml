  rationale: ἐν እዚህ ትንሣኤው በኢየሱስ እንደተገለጠ፣ የእርሱ ራሱ ትንሣኤ እንደሆነ፣ ወይም በእርሱ በኩል እንደሚሆን ሊሰማ ይችላል። ዋናው ጽሑፍ አንዱን ብቻ አይወስንም፤ ማስታወሻውም ተጨማሪውን ዕድል ያሳያል።
- issue: «ከሙታን መነሣት» የሚያመለክተው ወሰን
  choice: ቃሉ የኢየሱስን ትንሣኤና በእርሱ የተረጋገጠውን ሰፊ የትንሣኤ አዋጅ ሁለቱንም ሊያስተጋባ በሚችል መልኩ ተተው።
  alternative: ሐረጉን በግልጽ ሁኔታ በኢየሱስ ራሱ ትንሣኤ ብቻ ወይም በመጨረሻው አጠቃላይ ትንሣኤ ብቻ መገደብ
  rationale: የሉቃስ አገላለጽ ሁለቱንም አጠገብ ያቆማል፤ ትርጉሙ ምንጩ ካለው በላይ አያጠብም።
