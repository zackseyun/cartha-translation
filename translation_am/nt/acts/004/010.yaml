    text: ወይም፣ “የናዝሬቱ ኢየሱስ ክርስቶስ።” የግሪኩ Χριστός “መሲሕ” ተብሎ፣ ወይም እንደ ስም በሚያገለግልበት አጠቃቀም “ክርስቶስ” ተብሎ ሊተረጎም ይችላል።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ “በዚህ ስም” ወይም “በእርሱ።” ἐν τούτῳ የተባለው ኢየሱስን ራሱን ወይም አሁን የተጠቀሰውን ስም ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “ደኅና ሆኖ” ወይም “ፈጽሞ ጤናማ ሆኖ።” የግሪኩ ὑγιής ጤናማነትን ወይም የተመለሰ ጤንነትን ያመለክታል።
    reason: lexical_alternative
