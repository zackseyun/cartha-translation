  register: ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ቅደም ተከተልና የ«እግር ፊት» ተጨባጭ ምስል ተጠብቀዋል፤ የአማራጭ ትርጉሞቹ ምልክቶች [a] እና [b] በዋናው ጽሑፍ ተካተዋል።
