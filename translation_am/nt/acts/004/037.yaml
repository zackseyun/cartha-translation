lexical_decisions:
- source_word: ὑπάρχοντος αὐτῷ ἀγροῦ
  choice: የራሱ የሆነ እርሻ ነበረውና
  rationale: የግሪኩ የgenitive absolute አወቃቀር ለዋናው ድርጊት የጀርባ ሁኔታን ይሰጣል፤ ይህ አተረጓጎም ባለቤትነቱንና የሁኔታውን ግንኙነት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀγροῦ
  choice: እርሻ
  rationale: ቃሉ እርሻን ወይም የመሬት ይዞታን ሊያመለክት ይችላል፤ «እርሻ» ቀጥተኛና በቂ ሰፊ አማራጭ ነው።
- source_word: πωλήσας
  choice: ሸጦ
  rationale: የaorist participle ድርጊቱ ከማምጣቱና ከማኖሩ በፊት መፈጸሙን ያሳያል፤ «ሸጦ» ይህን ቅደም ተከተል በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἤνεγκεν
  choice: አመጣ
  rationale: በዚህ ዐውድ φέρω የሽያጩን ገንዘብ ወደ ሐዋርያት ማምጣትን ያመለክታል።
- source_word: τὸ χρῆμα
  choice: ገንዘቡን
  rationale: χρῆμα እዚህ የሽያጩን ገንዘብ ያመለክታል፤ «ገንዘቡን» ቀጥተኛና ግልጽ ሲሆን «የሽያጩን ገቢ» የሚለው ትክክለኛ አማራጭ በማስታወሻ ቀርቧል።
- source_word: ἔθηκεν
  choice: አኖረው
  rationale: τίθημι ማኖርን ወይም ማስቀመጥን ያመለክታል፤ ከ«እግር ፊት» ጋር «አኖረው» ተፈጥሯዊና የተከበረ አገላለጽ ነው።
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων
  choice: በሐዋርያትም እግር ፊት
  rationale: ይህ ትርጉም የግሪኩን ተጨባጭ ምስል ይጠብቃል፤ ገንዘቡ ለሐዋርያት አስተዳደር መቅረቡንም ያለ ተጨማሪ ትርጓሜ ያሳያል።
theological_decisions:
- issue: ገንዘቡን ለሐዋርያት ሥልጣንና አስተዳደር የማቅረብን ተጨባጭ አገላለጽ መጠበቅ
  choice: «በሐዋርያትም እግር ፊት አኖረው» የሚለው ተጨባጭ ምስል ተጠብቋል።
  alternative: «ለሐዋርያት ሰጠው» ብሎ ትርጉሙን ብቻ ማቅረብ
  rationale: ጥቅሱ እውነተኛውን የማቅረብ ድርጊት ይተርካል፤ በተጨማሪም ስጦታው በሐዋርያት አስተዳደር ሥር መደረጉን ያመለክታል። ምስሉን መጠበቅ ከጽሑፉ በላይ የሆነ የቤተ ክርስቲያን ሥርዓት አስተምህሮ ሳያስገባ ሁለቱንም ገጽታዎች ያቆያል።
