    text: ወይም፣ «እርሻ ኖሮት» ወይም «እርሻ ስለነበረው»። የግሪኩ አወቃቀር ከዋናው ድርጊት ጋር የተያያዘ የጀርባ ሁኔታን ይገልጣል።
