  text: ἐν τῷ τὴν χεῖρά ⸀σου ἐκτείνειν σε εἰς ἴασιν καὶ σημεῖα καὶ τέρατα γίνεσθαι διὰ τοῦ ὀνόματος τοῦ ἁγίου παιδός σου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/030.yaml
  text: while you stretch out your hand for healing[a], and signs and wonders are done through the name of your holy servant Jesus.
translation:
  language: am
  text: እጅህን ለመፈወስ ስትዘረጋ፣ ምልክቶችና ድንቆችም በቅዱስ አገልጋይህ በኢየሱስ ስም እንዲደረጉ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በቅዱስ ልጅህ በኢየሱስ ስም።” የግሪኩ παῖς (ፓይስ) የሚለው ቃል “ልጅ” ወይም “አገልጋይ” ማለት ሊሆን ይችላል፤ እዚህ “አገልጋይ” የተመረጠው በሐዋርያት ሥራ ውስጥ ከኢሳይያስ ስለ አገልጋዩ ከሚናገረው ቋንቋ ጋር የሚያስተጋባ ስለሆነ ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ ... ἐκτείνειν
  choice: ስትዘረጋ
  rationale: ἐν τῷ ከግሳዊ ስም ጋር ያለውን በአንድ ጊዜ መከናወን በተፈጥሯዊ የአማርኛ ጊዜያዊ አንቀጽ ያሳያል።
- source_word: τὴν χεῖρά σου
  choice: እጅህን
  rationale: የመለኮታዊ ድርጊትና ኃይል መጽሐፍ ቅዱሳዊ ምሳሌን ያለ ትርጓሜያዊ መስፋፋት ይጠብቃል።
- source_word: εἰς ἴασιν
  choice: ለመፈወስ
  rationale: εἰς የሚያሳየውን ዓላማ እና ἴασις የሚያመለክተውን ፈውስ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: σημεῖα καὶ τέρατα
  choice: ምልክቶችና ድንቆች
  rationale: በሐዋርያት ሥራ የተለመደውን ጥንድ አገላለጽ ያስቀምጣል፤ ‘ተአምራዊ’ የሚል ተጨማሪ ቃል አያስገባም።
- source_word: γίνεσθαι
  choice: ይደረጉ
  rationale: በጸሎቱ ውስጥ ምልክቶችና ድንቆች እንዲከናወኑ የቀረበውን ልመና በአማርኛ በግልጽ ያቀርባል።
- source_word: διὰ τοῦ ὀνόματος
  choice: በ...ስም
  rationale: διά የሚገልጸውን መካከለኛ አሠራር እና ‘ስም’ የያዘውን መጽሐፍ ቅዱሳዊ የሥልጣንና የወኪልነት ሐሳብ ይጠብቃል።
- source_word: τοῦ ἁγίου παιδός σου Ἰησοῦ
  choice: በቅዱሱ አገልጋይህ በኢየሱስ
  rationale: παῖς ‘ልጅ’ ወይም ‘አገልጋይ’ ሊሆን ቢችልም፣ በሐዋርያት ሥራ 3–4 ያለው የኢሳይያስ አገልጋይ ድምፀት ‘አገልጋይ’ን ይደግፋል።
theological_decisions:
- issue: παῖς ለኢየሱስ እንዴት እንደሚተረጎም
  choice: አገልጋይ
  alternative: ልጅ
  rationale: ቃሉ ሁለቱንም ትርጉሞች ሊይዝ ይችላል፤ ነገር ግን በሐዋርያት ሥራ 3፥13፣ 3፥26 እና በዚህ ስፍራ ያለው የኢሳይያስ አገልጋይ ድምፀት ‘አገልጋይ’ን ይመርጣል። የቃሉ እውነተኛ ሁለት አማራጭነት በግርጌ ማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የጸሎቱን ቀጣይነት ለማሳየት ‘አንተም’ እና የተያያዘ የጊዜ አንቀጽ ተጠቅመዋል።
