    text: ወይም፣ “ወደ ጓደኞቻቸው፤” በቃል በቃል፣ “ወደ ራሳቸው የሆኑት።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπολυθέντες
  choice: ከተለቀቁም በኋላ
  rationale: የግስ ተሳቢው ድርጊት ከዋናው ግስ በፊት መፈጸሙን ያሳያል፤ ተለቀቁ የሚለውም የእስርና የሕግ አውድን በተፈጥሮ ይገልጣል።
- source_word: δὲ
  choice: -ም
  rationale: የግሪኩን ለስላሳ አያያዥ በአማርኛ በግሱ ላይ በተያያዘው -ም ማሳየት ተፈጥሯዊ ነው።
- source_word: ἦλθον πρὸς
  choice: ወደ ... ሄደው
  rationale: የትረካው እይታ በመድረሻው ላይ ስላልተመሠረተ፣ ወደ ሄዱ የሚለው በአማርኛ ተፈጥሯዊ ነው።
- source_word: τοὺς ἰδίους
  choice: ወገኖቻቸው
  rationale: ቃሉ በቀጥታ ‘የራሳቸው የሆኑትን’ የሚያመለክት ሲሆን፣ ወገኖቻቸው የቅርብ ማኅበራቸውን ሳያጠብ በተፈጥሮ ይገልጣል።
- source_word: ἀπήγγειλαν
  choice: አስታወቁ
  rationale: የተነገራቸውን መልሰው ማድረስንና ሪፖርት ማድረግን ይገልጣል።
- source_word: ὅσα
  choice: ሁሉ
  rationale: የሪፖርቱን ይዘት ሙሉነት በአጭርና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: πρὸς αὐτοὺς ... εἶπαν
  choice: የነገሯቸውን
  rationale: ከλέγω ጋር πρός የንግግሩን ተቀባዮች ያመለክታል፤ የአማርኛው ተሳቢ ቅጥያ ይህን ግንኙነት በግልጽ ያሳያል።
- source_word: οἱ ἀρχιερεῖς
  choice: የካህናት አለቆች
  rationale: በዚህ ብዙ ቁጥር የሚጠቀሰው አንድ ሊቀ ካህን ሳይሆን መሪ የክህነት ባለሥልጣናት ናቸው።
- source_word: οἱ πρεσβύτεροι
  choice: ሽማግሌዎች
  rationale: በተቋማዊው አውድ የአይሁድን ዕውቅና ያላቸው የምክር ቤት መሪዎች ያመለክታል።
