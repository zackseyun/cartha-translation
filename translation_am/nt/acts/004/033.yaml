  source_fidelity: The translation accurately conveys the instrumental force of δυνάμει μεγάλῃ, the imperfect ongoing sense of ἀπεδίδουν through ይሰጡ ነበር, and the content of the apostles’ testimony as concerning the resurrection of the Lord Jesus. The final clause preserves both the comprehensive πάντας αὐτούς and the ‘upon’ imagery of ἐπί.
