base_translation:
  language: en
  yaml_path: translation/nt/acts/004/033.yaml
  text: And with great power the apostles were giving their testimony about the resurrection of the Lord Jesus[a], and great favor was upon them all.
translation:
  language: am
  text: ሐዋርያትም ስለ ጌታ ኢየሱስ ትንሣኤ በታላቅ ኃይል ምስክርነታቸውን ይሰጡ ነበር፤ ታላቅ ሞገስም[a] በሁላቸው ላይ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ታላቅ ጸጋም በሁላቸው ላይ ነበር።” የግሪክኛው χάρις “ጸጋ” ወይም “ሞገስ” ማለት ይችላል፤ አገላለጹ የእግዚአብሔርን የጸጋ መገኘትና አማኞቹ ያገኙትን ተቀባይነት ሁለቱንም ሊያካትት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνάμει μεγάλῃ
  choice: በታላቅ ኃይል
  rationale: የመንገድን ወይም የመሣሪያን ሐሳብ የሚገልጸውን ዳቲቭ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ኃይሉንም በተአምራት ብቻ አይወስነውም።
- source_word: ἀπεδίδουν
  choice: ይሰጡ ነበር
  rationale: ያለፈ ጊዜ ቀጣይ ወይም ተደጋጋሚ ድርጊትን የሚያሳየውን ኢምፐርፌክት አኳኋን ይጠብቃል።
- source_word: τὸ μαρτύριον
  choice: ምስክርነታቸውን
  rationale: ከ‘ይሰጡ ነበር’ ጋር ተፈጥሯዊ የሆነ አገላለጽ ሲሆን፣ ምስክርነቱን የሚሰጡት ሐዋርያት መሆናቸውን ያሳያል።
- source_word: τῆς ἀναστάσεως τοῦ κυρίου Ἰησοῦ
  choice: ስለ ጌታ ኢየሱስ ትንሣኤ
  rationale: የጄኒቲቩን የይዘት ግንኙነት በግልጽና በዘመናዊ አማርኛ ያቀርባል፤ ትንሣኤው የጌታ ኢየሱስ መሆኑንም ይጠብቃል።
- source_word: χάρις
  choice: ሞገስ
  rationale: ቃሉ ከእግዚአብሔር የሚመጣውን ጸጋ፣ በሰዎች ዘንድ ያለን ተቀባይነት፣ ወይም ሁለቱንም ሊያመለክት ይችላል፤ ‘ሞገስ’ ይህን ስፋት በአውዱ ይጠብቃል።
- source_word: ἐπὶ πάντας αὐτούς
  choice: በሁላቸው ላይ
  rationale: ሞገሱ በማኅበሩ አባላት ሁሉ ላይ መሆኑንና የἐπίን ምስላዊ አገላለጽ ይጠብቃል።
theological_decisions:
- issue: በዚህ አውድ የχάρις ትርጉም
  choice: በማኅበሩ ሁሉ ላይ የነበረ ሞገስ
  alternative: በግልጽ መለኮታዊ ትርጉም ‘ጸጋ’፣ ወይም ከሰዎች ብቻ የተገኘ ተቀባይነት
  rationale: ግሪክኛው የሞገሱን ምንጭ አይገልጽም። ‘ሞገስ’ ብሎ መተርጎም ይህን ክፍትነት ይጠብቃል፤ የ‘ጸጋ’ አማራጭም በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ይሰጡ ነበር’ የቀጣይ ድርጊቱን አኳኋን ይጠብቃል፤ የχάρις ትርጉም ግን በግድ ወደ አንድ ምንጭ አልተወሰነም።
