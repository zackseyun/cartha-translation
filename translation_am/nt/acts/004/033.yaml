  terminology: ጌታ ኢየሱስ, ትንሣኤ, ምስክርነት, and ኃይል are suitable established terms. Rendering χάρις as ሞገስ appropriately retains the source text’s openness regarding whether the favor is divine, human, or both; the footnote responsibly supplies ጸጋ as a lexical alternative.
