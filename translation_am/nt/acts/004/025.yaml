  text: ὁ ⸂τοῦ πατρὸς ἡμῶν⸃ διὰ ⸂πνεύματος ἁγίου⸃ στόματος Δαυὶδ παιδός σου εἰπών· Ἱνατί ἐφρύαξαν ἔθνη καὶ λαοὶ ἐμελέτησαν κενά;
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/025.yaml
  text: 'who[a], through the Holy Spirit, by the mouth of David your servant, said: ‘Why did the nations rage[b], and the peoples devise vain things?’'
translation:
  language: am
  text: አንተም[a] በመንፈስ ቅዱስ በኩል በአገልጋይህ በዳዊት አፍ እንዲህ ያልኸው፦ “አሕዛብ ለምን ተናደዱ? ሕዝቦችስ ከንቱ ነገሮችን ለምን አቀዱ[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች “የአባታችን ዳዊት አገልጋይህ” የሚለውን ንባብ ያካትታሉ፤ ስለዚህ መግቢያው “በመንፈስ ቅዱስ በኩል በአባታችን በዳዊት በአገልጋይህ አፍ” ተብሎ ሊነበብ ይችላል።
    reason: textual_variant
  - marker: b
    text: “አሰላሰሉ” ወይም “አሰቡ” ተብሎም ሊተረጎም ይችላል። የግሪኩ ግስ በመሠረቱ ማሰላሰልን ሊያመለክት ቢችልም፣ በዚህ የተቃውሞ አውድ ማቀድ ወይም ማሴር የሚል ሐሳብ አለው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ⸂τοῦ πατρὸς ἡμῶν⸃
  choice: እርሱም
  rationale: ንግግሩን በቁጥር 24 ከተጠቀሰው ከእግዚአብሔር ጋር ያገናኛል፤ አጠራጣሪው ‘የአባታችን’ ንባብ በማስታወሻ ተጠብቋል።
- source_word: διὰ πνεύματος ἁγίου
  choice: በመንፈስ ቅዱስ አማካይነት
  rationale: διά ከባለቤት አገባብ ጋር የመሣሪያነትን ወይም የአድራጊነትን ሐሳብ ያሳያል።
- source_word: στόματος Δαυὶδ παιδός σου
  choice: በአገልጋይህ በዳዊት አፍ
  rationale: የትንቢታዊ ንግግር ወኪልነትን የሚገልጠውን መጽሐፍ ቅዱሳዊ አነጋገር ጠብቆ በተፈጥሯዊ አማርኛ ያቀርባል፤ παῖς እዚህ ‘አገልጋይ’ ማለት ነው።
- source_word: Ἱνατί ἐφρύαξαν ἔθνη
  choice: አሕዛብ ለምን ተቆጡ?
  rationale: ἐφρύαξαν የተቃውሞና የነውጥ ቁጣን ያመለክታል፤ ‘ተቆጡ’ ይህን በግልጽ ዘመናዊ አማርኛ ይገልጣል።
- source_word: λαοὶ ἐμελέτησαν κενά
  choice: ሕዝቦችስ ከንቱ ነገር ለምን አሰቡ?
  rationale: የλαοίን ብዙ ቁጥር ጠብቆ፣ ἐμελέτησαν ያለውን ‘ማሰብ/ማቀድ’ ድርብ ዕድል በዋናው ጽሑፍ ‘አሰቡ’ ብሎ ያቀርባል፤ κενά ከንቱነትን ይገልጣል።
theological_decisions:
- issue: የጥቅሱ መግቢያ የጽሑፍ ልዩነት
  choice: በዋናው ጽሑፍ ‘የአባታችን’ የሚለውን ሳያካትት ተናጋሪውን ‘እርሱም’ በማለት ከቁጥር 24 ጋር ማገናኘት
  alternative: ‘በአባታችን በአገልጋይህ በዳዊት አፍ’ የሚለውን ረዘም ያለ ንባብ ማካተት
  rationale: የτοῦ πατρὸς ἡμῶν አቀማመጥና መኖር ጽሑፋዊ አጠራጣሪነት አለው፤ ዋናው ጽሑፍ አስቸጋሪውን ሐረግ ሳያስገድድ የንግግሩን ግንኙነት ያቆያል፣ ሌላው ንባብም በማስታወሻ በግልጽ ተጠብቋል።
- issue: የἐμελέτησαν ትርጉም
  choice: አሰቡ
  alternative: አሴሩ / አቀዱ
  rationale: ግሱ ‘ማሰላሰል’ ወይም በጠላትነት አውድ ‘ማቀድ/ማሴር’ ሊል ይችላል፤ ዋናው ጽሑፍ ሰፊውን ትርጉም ሲጠብቅ የአውዱ አማራጭ በማስታወሻ ቀርቧል።
