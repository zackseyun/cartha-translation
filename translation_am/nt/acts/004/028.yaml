  yaml_path: translation/nt/acts/004/028.yaml
  text: to do whatever your hand and your purpose had predestined to happen[a].
translation:
  language: am
  text: እጅህና ዓላማህ አስቀድሞ እንዲከሰት የወሰኑትን ሁሉ ለማድረግ[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አስቀድሞ የቀደሙትን” ወይም “አስቀድሞ ያቀዱትን።” የግሪኩ ግስ አንድ ነገር ከቀድሞ መወሰኑን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῆσαι
  choice: ለማድረግ
  rationale: የዓላማ ወይም የውጤት ማስረጃ የሚሰጠውን የግሪክ የድርጊት ስም ቀጥተኛና ተፈጥሯዊ በሆነ መንገድ ይተረጉማል።
- source_word: ὅσα
  choice: የነበረውን ሁሉ
  rationale: የአንጻራዊውን ተውላጠ ስም ሰፊና አጠቃላይ ወሰን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: χείρ
  choice: እጅህ
  rationale: ቃል በቃል ‘እጅ’ የሚለውን መጽሐፍ ቅዱሳዊ ምስል ይጠብቃል፤ በዚህ አውድ ኃይልንና ድርጊትን ያመለክታል።
- source_word: βουλή
  choice: ዓላማህ
  rationale: የታሰበ እቅድንና የተወሰነ ፍላጎትን በግልጽ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: προώρισεν
  choice: አስቀድመው ... ወስነውት የነበረውን
  rationale: ግሱ አንድ ነገር አስቀድሞ መወሰኑን ያመለክታል። ይህ አተረጓጎም የጊዜውን ቀዳሚነትና የውሳኔውን ጥንካሬ ይጠብቃል፤ የቃሉን አማራጭ አገላለጽም በግርጌ ማስታወሻ ያቀርባል።
- source_word: γενέσθαι
  choice: እንዲሆኑ
  rationale: ክስተቶቹ እንዲፈጸሙ ወይም እንዲከሰቱ የሚለውን የγίνομαι ክስተታዊ ትርጉም በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: መለኮታዊ ሉዓላዊነትንና የሰውን ኃላፊነት በሚነካው አውድ የπροώρισεν አተረጓጎም
  choice: አስቀድመው ወስነውት የነበረውን
  alternative: አስቀድመው የወሰኑትን / አስቀድመው ያቀዱትን
  rationale: προορίζω በቀጥታ አስቀድሞ መወሰንን ያመለክታል። ጸሎቱ ከኢየሱስ መከራ ጋር የተያያዙት ክስተቶች በእግዚአብሔር አስቀድመው መወሰናቸውን ያረጋግጣል፤ ሆኖም ይህን ከሰው ኃላፊነት ጋር በሰፊ ሥነ መለኮታዊ ሥርዓት አያስማማውም። ትርጉሙም ይህን ውጥረት ሳይፈታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘እጅህ’ የሚለው ተጨባጭ መጽሐፍ ቅዱሳዊ ምስል ተጠብቋል፤ የብዙ ቁጥር ግሶቹም ‘እጅህና ዓላማህ’ የተባለውን የተዋሐደ ርዕሰ ጉዳይ ይከተላሉ።
