    text: ወይም፣ “የማዕዘን ድንጋይ” ወይም “የጫፍ ድንጋይ”፤ ቃል በቃል፣ “የማዕዘን ራስ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός
  choice: እርሱ
  rationale: በቅርብ ዐውዱ ያለውን ኢየሱስን በአጽንዖት ይጠቁማል፤ ‘እርሱ’ በአማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: λίθος
  choice: ድንጋይ
  rationale: የቃሉን መደበኛ ትርጉምና የመዝሙር 118፥22ን የሕንፃ ምሳሌ ይጠብቃል።
- source_word: ἐξουθενηθεὶς
  choice: የናቃችሁት
  rationale: ግሱ እንደ ከንቱ መቁጠርንና በንቀት አለመቀበልን ያመለክታል፤ ‘የናቃችሁት’ ሁለቱንም የንቀትና የውድቅነት ገጽታዎች ይይዛል።
- source_word: ὑφ’ ὑμῶν τῶν οἰκοδόμων
  choice: እናንተ ግንበኞች
  rationale: የሁለተኛ ሰው ብዙ ቁጥር ቀጥተኛ ወቀሳንና የግንባታውን ምሳሌ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: γενόμενος
  choice: የሆነው
  rationale: የተፈጸመውን ለውጥና አሁን ያለውን ውጤት በዐውዱ ውስጥ ያሳያል።
- source_word: κεφαλὴν γωνίας
  choice: የማዕዘን ራስ
  rationale: የግሪኩን ምስላዊ አገላለጽ በቅርብ ይጠብቃል፤ ትክክለኛው የሕንፃ አመልካች አከራካሪ ስለሆነ አንድን ትርጓሜ ብቻ አይወስንም።
theological_decisions:
- issue: የመዝሙር 118፥22 ጥቅስ የሕንፃ ምስል አተረጓጎም
  choice: የማዕዘን ራስ
  alternative: የማዕዘን ድንጋይ፤ የጫፍ ድንጋይ
  rationale: ቃል በቃል ያለውን ምስልና የሕንፃውን ትክክለኛ ቦታ አሻሚነት ይጠብቃል፤ ኢየሱስ በግንበኞች ተንቆ ከዚያም ክብር ያገኘ ድንጋይ መሆኑን ሳይጨምር ያቀርባል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ የሚገባ አማርኛ ተጠቅሟል። የቅዱስ ጽሑፉን ጥቅስ ለማሳየት የጥቅስ ምልክት ገብቷል፣ የግሪኩም ቀጥተኛ ወቀሳ ተጠብቋል።
