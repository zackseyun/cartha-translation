id: ACT.4.26
reference: Acts 4:26
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: παρέστησαν οἱ βασιλεῖς τῆς γῆς καὶ οἱ ἄρχοντες συνήχθησαν ἐπὶ τὸ αὐτὸ κατὰ τοῦ κυρίου καὶ κατὰ τοῦ χριστοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/026.yaml
  text: The kings of the earth took their stand[a], and the rulers were gathered together against the Lord and against his Messiah.
translation:
  language: am
  text: የምድር ነገሥታት ተነሥተው ቆሙ፣ ገዢዎችም በአንድ ላይ ተሰበሰቡ፤ በጌታና በእርሱ መሲሕ[a] ላይ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ክርስቶስ”፤ ግሪክኛው “የእርሱ ክርስቶስ” ይላል፤ ትርጉሙም “የእርሱ ቅቡዕ” ማለት ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: παρέστησαν
  choice: ተነሥተው ቆሙ
  rationale: ይህ አገላለጽ ተራ የአካል አቋቋምን ብቻ ሳይሆን ሆን ብሎ ለመቃወም መቆምን ያሳያል፤ የመዝሙር 2፥2ን ድምፀትም ይጠብቃል።
- source_word: βασιλεῖς
  choice: ነገሥታት
  rationale: ቃሉ በተለይ ነገሥታትን ያመለክታል፤ ከገዢዎች ጋር ያለውን ትይዩነትም ይጠብቃል።
- source_word: τῆς γῆς
  choice: የምድር
  rationale: በዚህ የመዝሙር ጥቅስ ውስጥ ሰፊና ዓለም አቀፍ ትርጉም ስላለው ‘የምድር’ ተመርጧል።
- source_word: ἄρχοντες
  choice: ገዢዎች
  rationale: ዘመናዊና ግልጽ አማርኛ ሲሆን ከ‘ነገሥታት’ ጋር ያለውን የሥልጣን ትይዩነት ያሳያል።
- source_word: συνήχθησαν
  choice: ተሰበሰቡ
  rationale: የግሪክኛውን ተገብሮአዊ ቅርጽ በተፈጥሯዊ አማርኛ ያንጸባርቃል።
- source_word: ἐπὶ τὸ αὐτό
  choice: በአንድነት
  rationale: በአንድ ላይ ሆነው በተቀናጀ ተቃውሞ መሰብሰባቸውን በአጭርና ተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: κατὰ
  choice: በ…ላይ
  rationale: በዚህ ዐውደ ንባብ የጠላትነት ተቃውሞን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: κυρίου
  choice: ጌታ
  rationale: በጥቅሱ ውስጥ እግዚአብሔርን የሚያመለክተውን ቅዱስ መጽሐፋዊ ማዕረግ ይጠብቃል።
- source_word: χριστοῦ
  choice: መሲሕ
  rationale: በመዝሙር 2፥2 ጥቅስ ውስጥ እንደ ማዕረግ ስለሚሠራ፣ የተቀባውን ንጉሥ የሚያመለክተውን መሲሐዊ ዳራ ይጠብቃል።
- source_word: αὐτοῦ
  choice: የእርሱ
  rationale: ተውላጠ ስሙ ወደ ‘ጌታ’ እንደሚመለስ በግልጽ ያሳያል።
theological_decisions:
- issue: በመዝሙር 2 ጥቅስ ውስጥ Χριστόςን መተርጎም
  choice: መሲሕ
  alternative: ክርስቶስ፤ ቅቡዕ
  rationale: Χριστός እዚህ እንደ የግል ስም ሳይሆን ከጌታ ጋር በዝምድና የቀረበ ማዕረግ ነው። ‘መሲሕ’ የብሉይ ኪዳኑን የቅቡዕ ንጉሥ ዳራ ይጠብቃል፤ ‘ክርስቶስ’ ግን በእግር ማስታወሻው ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የመዝሙር 2፥2 ጥቅሳዊ ድምፀት እንዲቆይ ትይዩ አወቃቀሩ ተጠብቋል።
