  text: καὶ τὰ νῦν, κύριε, ἔπιδε ἐπὶ τὰς ἀπειλὰς αὐτῶν καὶ δὸς τοῖς δούλοις σου μετὰ παρρησίας πάσης λαλεῖν τὸν λόγον σου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/029.yaml
  text: And now[a], Lord, look upon their threats and grant your servants to speak your word with all boldness,
translation:
  language: am
  text: አሁንም፣ ጌታ ሆይ፣ ዛቻቸውን ተመልከት፤ አገልጋዮችህም[a] ቃልህን በሙሉ ድፍረት እንዲናገሩ አስችላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ባሪያዎችህ”። የግሪኩ δοῦλος (ዱሎስ) ቃል የጌታው ንብረት የሆነን ሰው ሊያመለክት ይችላል። እዚህ “አገልጋዮችህ” የተባለው የጸሎቱ አውድ ለእግዚአብሔር በትሕትና ማገልገልን ስለሚያጎላ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τὰ νῦν
  choice: አሁንም
  rationale: የጸሎቱን ሐሳብ ከቀደመው ትረካ ወደ አሁኑ ልመና የሚያሸጋግር ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
- source_word: κύριε
  choice: ጌታ ሆይ
  rationale: ለእግዚአብሔር የቀረበውን ቀጥተኛና ክቡር የጸሎት አድራሻ ያስተላልፋል።
- source_word: ἔπιδε ἐπὶ
  choice: ተመልከት
  rationale: እግዚአብሔር ዛቻዎቹን እንዲያይና ትኩረት እንዲሰጣቸው የሚጠይቀውን የትእዛዝ ቅርጽ እና ምስላዊ አገላለጽ ይጠብቃል።
- source_word: ἀπειλὰς
  choice: ዛቻቸውን
  rationale: የብዙ ቁጥር ስሙን በዘመናዊና ግልጽ አማርኛ ያስተላልፋል።
- source_word: δὸς
  choice: አስችላቸው
  rationale: ቃል በቃል ‘ስጥ’ ቢሆንም፣ ከተከታዩ የድርጊት ግስ ጋር በአማርኛ ተፈጥሯዊ ሆኖ የሚቀርበው የችሎታና የኃይል ስጦታን በ‘አስችላቸው’ መግለጽ ነው።
- source_word: τοῖς δούλοις σου
  choice: አገልጋዮችህ
  rationale: በዚህ የጸሎት አውድ ለእግዚአብሔር በትሕትና መገዛትና ማገልገል ጎልቶ ስለሚታይ፣ ይህ ቃል ተፈጥሯዊና የተከበረ ነው፤ የ‘ባሪያ’ ጠንካራው ትርጉም በማስታወሻ ተጠብቋል።
- source_word: μετὰ παρρησίας πάσης
  choice: በሙሉ ድፍረት
  rationale: ፍርሃት የሌለበትን ግልጽና ደፋር ንግግር እና πάσης የሚሰጠውን ሙሉነት ይጠብቃል።
- source_word: λαλεῖν
  choice: እንዲናገሩ
  rationale: የግሱን ቀላል ስሜት ይጠብቃል፤ ‘እንዲያውጁ’ የሚለውን የበለጠ ትርጓሜያዊ አገላለጽ አያስገባም።
- source_word: τὸν λόγον σου
  choice: ቃልህን
  rationale: በሐዋርያት ሥራ የእግዚአብሔርን መልእክት የሚያመለክተውን የመጽሐፍ ቅዱስ አገላለጽና ሥነ መለኮታዊ ክብደት ይጠብቃል።
theological_decisions:
