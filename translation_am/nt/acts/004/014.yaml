base_translation:
  language: en
  yaml_path: translation/nt/acts/004/014.yaml
  text: And seeing the man who had been healed standing with them[a], they had nothing to say in reply.
translation:
  language: am
  text: ከእነርሱ ጋር ቆሞ የነበረውን የተፈወሰውን ሰው ሲያዩ፣ መልሰው የሚናገሩት ምንም ነገር አልነበራቸውም።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የሚቃወሙበት ምንም ነገር አልነበራቸውም» ወይም «ምንም ሊቃወሙ አልቻሉም።»
    reason: lexical_alternative
lexical_decisions:
- source_word: τε
  choice: -ም
  rationale: በ«የተፈወሰውንም» ላይ ያለው «-ም» ይህን አረፍተ ነገር ከቀደመው ትረካ ጋር በተፈጥሯዊ ሁኔታ ያገናኛል።
- source_word: ἄνθρωπον
  choice: ሰው
  rationale: በቀደመው አውድ የተጠቀሰውን የተወሰነ ወንድ ሰው ያመለክታል፤ «ሰው» በአማርኛ ተፈጥሯዊና በአውዱ ግልጽ ነው።
- source_word: βλέποντες
  choice: ሲያዩት
  rationale: ድርጊቱ ከዋናው ግስ ጋር በአንድ ጊዜ መሆኑን ይገልጣል፤ የአማርኛው «ሲ-» አወቃቀር ተሳቢውን በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: σὺν αὐτοῖς
  choice: ከእነርሱ ጋር
  rationale: σύν የአብሮነትን ግንኙነት ያሳያል፤ «ከእነርሱ ጋር» ቀጥተኛና ተፈጥሯዊ አቻ ነው።
- source_word: ἑστῶτα
  choice: ቆሞ
  rationale: ፍጹም ተሳቢው ሰውየው በቆመበት ሁኔታ መገኘቱን ያሳያል፤ «ቆሞ» ይህን ሁኔታ በአጭርና ተፈጥሯዊ መንገድ ይገልጣል።
- source_word: τεθεραπευμένον
  choice: የተፈወሰውን
  rationale: ፍጹም ተደራጊ ተሳቢው የተፈጸመውን ፈውስና የቀጠለውን ውጤት ያመለክታል፤ «የተፈወሰውን» ተደራጊነቱንና የተአምራዊ ፈውስ አውዱን ይጠብቃል።
- source_word: οὐδὲν
  choice: ምንም ነገር
  rationale: ፍጹም እጦትን ይገልጣል፤ «ምንም ነገር አልነበራቸውም» በአማርኛ የተለመደ አሉታዊ አወቃቀር ነው።
- source_word: εἶχον ἀντειπεῖν
  choice: የሚቃወሙበት ምንም ነገር አልነበራቸውም
  rationale: ሐረጉ በተቃውሞ መናገርን ወይም መልስ መስጠትን ያካትታል። ይህ አተረጓጎም የἀντειπεῖνን ተቃዋሚ ኃይል ሳያጠፋ በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
