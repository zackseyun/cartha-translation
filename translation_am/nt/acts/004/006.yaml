    reason: lexical_alternative
  revision_rationale: The revision removes an unsupported contextual completion, retains the Greek list structure, and uses a past-relative form that better reflects ἦσαν. It leaves Annas’s title unqualified and preserves the deliberately broad family/lineage sense of ἐκ γένους ἀρχιερατικοῦ.
