  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: (καὶ ⸂Ἅννας ὁ ἀρχιερεὺς καὶ Καϊάφας καὶ Ἰωάννης καὶ Ἀλέξανδρος⸃ καὶ ὅσοι ἦσαν ἐκ γένους ἀρχιερατικοῦ),
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/006.yaml
  text: and Annas the high priest[a], and Caiaphas, and John, and Alexander, and all who were of the high-priestly family,
translation:
  language: am
  text: ሊቀ ካህናቱ ሐና፣ ቀያፋ፣ ዮሐንስ፣ እስክንድር፣ እንዲሁም ከሊቀ ካህናት ወገን የነበሩት ሁሉ[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከሊቀ ካህናት ቤተሰብ የነበሩት ሁሉ” ወይም “ከሊቀ ካህናት የዘር ሐረግ የነበሩት ሁሉ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἅννας
  choice: ሐና
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የስሙን ቅርጽ ይጠቀማል።
- source_word: ὁ ἀρχιερεὺς
  choice: ሊቀ ካህናቱ
  rationale: በግሪክ ጽሑፍ ሐናን በቀጥታ የሚገልጸውን ማዕረግ ይጠብቃል፤ ታሪካዊውን የሥልጣን ሁኔታ ለማስማማት ‘የቀድሞ’ የሚል ትርጓሜ አይጨምርም።
- source_word: Καϊάφας
  choice: ቀያፋ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ ወግ የተለመደው የስም ቅርጽ ነው።
- source_word: Ἰωάννης
  choice: ዮሐንስ
  rationale: በአማርኛ የተለመደውን የግሪኩን የግል ስም ቅርጽ ይከተላል።
- source_word: Ἀλέξανδρος
  choice: እስክንድር
  rationale: ለAlexander በአማርኛ የተለመደና ተፈጥሯዊ የስም ቅርጽ ነው።
- source_word: ὅσοι ἦσαν
  choice: የሆኑት ሁሉ
  rationale: የብዛት አመልካቹንና የነበሩበትን ሁኔታ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐκ γένους ἀρχιερατικοῦ
  choice: ከሊቀ ካህናት ወገን
  rationale: γένος የቤተሰብ፣ የዘር ሐረግ ወይም የዝምድና ወገን ሊያመለክት የሚችለውን ስፋት ይጠብቃል፤ ἀρχιερατικός ደግሞ ከሊቀ ካህናት ቤተሰብ ጋር ያለውን ዝምድና ያሳያል።
theological_decisions:
- issue: በዚያን ጊዜ ቀያፋ በሥልጣን ላይ እንደነበረ ቢታወቅም ሐናን ‘ሊቀ ካህናቱ’ ብሎ መጥራት
  choice: የግሪኩን ግልጽ ማዕረግ ‘ሊቀ ካህናቱ ሐና’ በማለት መጠበቅ
  alternative: ‘የቀድሞው ሊቀ ካህናት ሐና’ ወይም ‘ዋና ካህኑ ሐና’
  rationale: ጽሑፉ ሐናን ὁ ἀρχιερεύς ብሎ በቀጥታ ይጠራዋል። ‘የቀድሞ’ የሚል ማብራሪያ መጨመር ታሪካዊውን ውጥረት በትርጉም ውስጥ ያስወግዳል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። ጥቅሱ በግሪክ የስም ዝርዝር ቢሆንም፣ በአማርኛ ሙሉ ዓረፍተ ነገር እንዲሆን “በዚያ ነበሩ” ተጨምሯል፤ ይህም ከቀዳሚው ቁጥር የሚገባውን የመሰብሰብ አውድ በተፈጥሯዊ አማርኛ ያሳያል።
