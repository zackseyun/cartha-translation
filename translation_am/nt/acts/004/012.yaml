id: ACT.4.12
reference: Acts 4:12
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔστιν ἐν ἄλλῳ οὐδενὶ ἡ σωτηρία, ⸀οὐδὲ γὰρ ὄνομά ἐστιν ἕτερον ⸂ὑπὸ τὸν οὐρανὸν⸃ τὸ δεδομένον ἐν ἀνθρώποις ἐν ᾧ δεῖ σωθῆναι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/012.yaml
  text: And there is salvation in no one else[a], for there is no other name under heaven given among men by which we must be saved.
translation:
  language: am
  text: በሌላ በማንም መዳን የለም፤ ምክንያቱም እኛ ልንድንበት የሚገባ በሰዎች መካከል የተሰጠ ከሰማይ በታች ሌላ ስም የለም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωτηρία
  choice: መዳን
  rationale: በዚህ ዐውድ ቃሉ ከአደጋ መትረፍንም ሆነ የእግዚአብሔርን አዳኝነት የሚያመለክተውን ሰፊ ትርጉም ይይዛል፤ «መዳን» ይህን ሳያብራራ ያቆየዋል።
- source_word: ἐν ἄλλῳ οὐδενί
  choice: በሌላ በማንም
  rationale: «በ» የሚለው ቅድመ ቃል የግሪኩን ἐν የኅብረትና የመሣሪያነት ኃይል ይጠብቃል፤ «በማንም» ደግሞ ንግግሩ ስለ ሌላ ሰው እንጂ ስለ ረቂቅ መንገድ ብቻ እንዳልሆነ ያሳያል።
- source_word: ὄνομα
  choice: ስም
  rationale: ቃሉ ሰውነትን፣ ሥልጣንንና የተገለጠ ማንነትን ሊያመለክት የሚችለውን መጽሐፍ ቅዱሳዊ ብልጽግና እንዲይዝ «ስም» ተብሎ ተጠብቋል።
- source_word: ὑπὸ τὸν οὐρανόν
  choice: ከሰማይ በታች
  rationale: ይህ የሰውን ዓለም በሙሉ የሚያመለክት መጽሐፍ ቅዱሳዊ አገላለጽ ሲሆን የምንጩን ግርማ ይጠብቃል።
- source_word: δεδομένον ἐν ἀνθρώποις
  choice: በሰዎች መካከል የተሰጠ
  rationale: «በሰዎች መካከል» ἐν የሚያሳየውን በሰው ልጆች ዘንድ መገኘት ይጠብቃል፤ «ሰዎች» ደግሞ ἀνθρώποις እዚህ ያለውን ሁሉን አቀፍ ትርጉም በተፈጥሮ ይገልጣል።
- source_word: ἐν ᾧ δεῖ σωθῆναι ἡμᾶς
  choice: እኛ ልንድንበት የሚገባን
  rationale: «ልንድንበት» ዘመድ አመልካቹን ወደ «ስም» መመለሱንና የመዳን መሣሪያነቱን ያሳያል፤ «የሚገባን» የδεῖን አስፈላጊነት ይጠብቃል።
theological_decisions:
- issue: መዳን በኢየሱስ ብቻ መሆኑ
  choice: «በሌላ በማንም መዳን የለም» ተብሎ ያለ ማለዘብ ተተርጉሟል።
  alternative: «ሌላ የመዳን መንገድ የለም» ብሎ ማለዘብ
  rationale: ግሪኩ መዳን በሌላ በማንም እንደሌለ በቀጥታ ይናገራል፤ ትርጉሙም ከጥቅሱ በላይ የሆነ የእምነት ሥርዓት ሳይጨምር ይህን ብቸኛነት ጠብቋል።
- issue: «ስም» የሚለው አገላለጽ
  choice: የምንጩ ምሳሌያዊና ሥነ መለኮታዊ ስፋት እንዲቆይ «ስም» ተብሏል።
  alternative: «ሰው» ወይም «ሥልጣን» ብሎ ትርጉሙን መግለጽ
  rationale: ምንጩ «ስም» በማለት ሰውየውን፣ ሥልጣኑንና ማንነቱን በአንድነት እንዲያስተጋባ ይተወዋል፤ ትርጉሙም ይህን ውጥረት አልፈታውም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ የከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። «ሰዎች» የግሪኩን ሁሉን አቀፍ ἀνθρώποις በቀጥታ ስለሚያስተላልፍ የጾታ ማብራሪያ የግርጌ ማስታወሻ አላስፈለገም።
