revisions:
- from: በሌላ በማንም መዳን የለም፤ እኛ ልንድንበት የሚገባን፣ በሰዎች መካከል የተሰጠ ከሰማይ በታች ሌላ ስም የለምና።
  to: በሌላ በማንም መዳን የለም፤ ምክንያቱም እኛ ልንድንበት የሚገባ በሰዎች መካከል የተሰጠ ከሰማይ በታች ሌላ ስም የለም።
  rationale: The revision makes the final relative clause idiomatic and unambiguous while maintaining the Greek order and emphasis as far as natural Amharic permits. It also renders the causal γάρ explicitly. The source’s personal exclusivity, the name idiom, the worldwide scope of «under heaven», and the necessity expressed by δεῖ are retained.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:21:12Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the verse’s twofold assertion: salvation is in no one else, and no other name has been given among humanity under heaven through which we must be saved. Its rendering of ἀνθρώποις as «ሰዎች» is appropriately generic and inclusive. However, the final relative construction is grammatically awkward in Amharic and can obscure the force of δεῖ (''must'').'
  naturalness: The wording «እኛ ልንድንበት የሚገባን» is not idiomatic in this syntactic position. Recasting it as «እኛ ልንድንበት የሚገባ» naturally expresses the required salvation while retaining the antecedent «ስም». Adding «ምክንያቱም» makes the γάρ connection clear in modern standard Amharic.
  terminology: «መዳን», «ስም», «ከሰማይ በታች», and «በሰዎች መካከል የተሰጠ» faithfully and naturally preserve the relevant Greek terms and the biblical register. No theological expansion is introduced.
  issues:
  - severity: medium
    issue: The phrase «እኛ ልንድንበት የሚገባን» is syntactically strained.
    rationale: The possessive/object suffix in «የሚገባን» is awkward after the explicit subject «እኛ» and may make the clause sound as though the name 'belongs to us' rather than expressing necessity. «እኛ ልንድንበት የሚገባ» clearly renders ἐν ᾧ δεῖ σωθῆναι ἡμᾶς.
  - severity: low
    issue: The causal force of γάρ is only implicit.
    rationale: Although Amharic can leave the relation implicit, «ምክንያቱም» explicitly and naturally represents the source’s grounding clause without adding meaning.
  revised_text: በሌላ በማንም መዳን የለም፤ ምክንያቱም እኛ ልንድንበት የሚገባ በሰዎች መካከል የተሰጠ ከሰማይ በታች ሌላ ስም የለም።
  revised_footnotes: []
  revision_rationale: The revision makes the final relative clause idiomatic and unambiguous while maintaining the Greek order and emphasis as far as natural Amharic permits. It also renders the causal γάρ explicitly. The source’s personal exclusivity, the name idiom, the worldwide scope of «under heaven», and the necessity expressed by δεῖ are retained.
