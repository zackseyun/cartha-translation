base_translation:
  language: en
  yaml_path: translation/nt/acts/004/007.yaml
  text: And after setting them in the midst[a], they began asking, “By what power or in what name did you do this?”
translation:
  language: am
  text: እነርሱንም በመካከላቸው ካቆሟቸው በኋላ፣ “ይህን ያደረጋችሁት በምን ኃይል ወይስ በማን ስም ነው?” ብለው ይጠይቋቸው ጀመሩ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ይጠይቋቸው ነበር” ወይም “ጠየቋቸው።”
    reason: የግሪኩ ያልተጠናቀቀ ያለፈ ጊዜ ግስ የጥያቄውን መጀመር ሳይሆን ቀጣይነቱን ሊያጎላ ይችላል።
lexical_decisions:
- source_word: στήσαντες
  choice: ካቆሙአቸው በኋላ
  rationale: የግሪኩ የአኦሪስት አሳታፊ ግስ ከጥያቄው በፊት የተፈጸመውን ድርጊት ያሳያል፤ ይህ አተረጓጎም የድርጊቶቹን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐν τῷ μέσῳ
  choice: በመካከላቸው
  rationale: የሐረጉን ‘በመካከል’ የሚል ቀጥተኛ ስሜት ይጠብቃል፤ ‘በፊታቸው’ ብሎ የፍርድ መድረኩን ከምንጩ በላይ አይተረጉምም።
- source_word: ἐπυνθάνοντο
  choice: ይጠይቋቸው ጀመር
  rationale: የግሪኩ ያልተጠናቀቀ ያለፈ ጊዜ ግስ በዚህ የትረካ አውድ የጥያቄውን መጀመር ሊያመለክት ይችላል፤ ሌላው ትክክለኛ አማራጭ በማስታወሻው ተጠብቋል።
- source_word: Ἐν ποίᾳ δυνάμει
  choice: በምን ኃይል
  rationale: δύναμις በቀጥታ ‘ኃይል’ ማለት ነው፤ ἐν እዚህ የመሣሪያ ወይም የአሠራር ኃይልን ስለሚያሳይ ‘በ’ በሚለው ተተርጉሟል።
- source_word: ἢ ἐν ποίῳ ὀνόματι
  choice: ወይስ በማን ስም
  rationale: የአማርኛው ‘በማን ስም’ የግሪኩን በስም የመሥራት መጽሐፍ ቅዱሳዊ ፈሊጥና የውክልና ስሜት በተፈጥሯዊ መንገድ ይጠብቃል።
- source_word: ἐποιήσατε τοῦτο
  choice: ይህን ያደረጋችሁት
  rationale: ቀላሉን ያለፈ ጊዜ ያሳያል፤ ‘ይህን’ የሚለውም ፈውሱን ወይም ምልክቱን ያለ ተጨማሪ ማብራሪያ እንዲያመለክት የምንጩን ስፋት ይጠብቃል።
- source_word: ὑμεῖς
  choice: -ጋችሁ-
  rationale: በግሪኩ ያለው ግልጽ ተውላጠ ስም ትኩረት አለው፤ በአማርኛ የሁለተኛ መደብ ብዙ ቁጥር የግስ ቅጥ ማንነታቸውን በተፈጥሯዊ ሁኔታ ያሳያል።
theological_decisions:
- issue: δύναμις ‘ኃይል’ ወይስ ‘ሥልጣን’ ተብሎ መተርጎም
  choice: ኃይል
  alternative: ሥልጣን
  rationale: ግሪኩ δύναμις በመደበኛነት ‘ኃይል’ ማለት ሲሆን፣ ‘በማን ስም’ የሚለው ተጓዳኝ ሐረግ የውክልናን ሥልጣን አስቀድሞ ያመለክታል። ‘ኃይል’ ማለት በአሠራር ኃይልና በተወካይ ስም መካከል ያለውን የጥያቄውን ልዩነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘በመካከላቸው’ የሚለው የምንጩን ሥዕላዊ አቀማመጥ ሲጠብቅ፣ ጥያቄው በተፈጥሯዊ የአማርኛ አገባብ ቀርቧል።
