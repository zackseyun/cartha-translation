  yaml_path: translation/nt/acts/004/032.yaml
  text: The multitude of those who had believed were of one heart and soul[a], and not even one of them said that anything belonging to him was his own[b], but all things were held in common among them.
translation:
  language: am
  text: 'ያመኑትም ብዙ ሰዎች አንድ ልብና አንድ ነፍስ ነበራቸው[a]፤ ከእነርሱም አንድም ሰው እንኳ ከንብረቱ አንዳችም የራሱ ነው ብሎ አይልም ነበር[b]፤ ይልቁንም ሁሉም ነገር የጋራቸው ነበር።


    [a] “አንድ ልብና አንድ ነፍስ” የሚለው በውስጣዊ አሳብና በዓላማ ጥልቅ አንድነት እንደነበራቸው ያመለክታል።


    [b] በግሪክኛው “ለእርሱ ከነበሩት” የሚለው ነጠላ አገላለጽ ለእያንዳንዱ ሰው የነበሩ ንብረቶችን ለየብቻ ያመለክታል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “አንድ ልብና አንድ ነፍስ” የሚለው በውስጣዊ አሳብና በዓላማ ጥልቅ አንድነት እንደነበራቸው ያመለክታል።
    reason: lexical_alternative
