  text: በመካከላቸው አንድም የተቸገረ ሰው አልነበረም፤ ምክንያቱም መሬት ወይም ቤት የነበራቸው ሁሉ እየሸጡ ከተሸጠው የተገኘውን ገንዘብ[a] ያመጡ ነበር።
