  text: 'እንዲህ እያሉ፦ “እነዚህን ሰዎች ምን እናድርጋቸው? በእነርሱ አማካይነት በሰፊው የታወቀ ምልክት[a] ተፈጽሟልና፤ ይህም በኢየሩሳሌም ለሚኖሩ ሁሉ ግልጽ ነው፤ እኛም ልንክደው አንችልም።”


    [a] “በሰፊው የታወቀ ምልክት” የሚለው “የታወቀ ምልክት” ወይም “ታላቅ ትኩረት ያገኘ ምልክት” ተብሎም ሊተረጎም ይችላል። የግሪኩ γνωστόν “የታወቀ፣ በሰፊው የታወቀ” ማለት ሲሆን፣ በዚህ አውድ ሕዝቡ በግልጽ ያወቀውን ምልክት ያመለክታል።'
