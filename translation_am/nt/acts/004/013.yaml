  text: Θεωροῦντες δὲ τὴν τοῦ Πέτρου παρρησίαν καὶ Ἰωάννου καὶ καταλαβόμενοι ὅτι ἄνθρωποι ἀγράμματοί εἰσιν καὶ ἰδιῶται, ἐθαύμαζον, ἐπεγίνωσκόν τε αὐτοὺς ὅτι σὺν τῷ Ἰησοῦ ἦσαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/013.yaml
  text: As they observed the boldness of Peter and John[a], and realized that they were uneducated and ordinary men, they were astonished, and they recognized that they had been with Jesus.
translation:
  language: am
  text: የጴጥሮስንና የዮሐንስን በድፍረት ሲናገሩ ሲመለከቱ፣ ያልተማሩና ተራ ሰዎች[a] መሆናቸውንም ሲገነዘቡ፣ ተደነቁ፤ ከኢየሱስም ጋር እንደነበሩ አስተዋሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “መደበኛ የሊቃውንት ትምህርት ያልተማሩና የታወቀ ሙያዊ ወይም ይፋዊ ደረጃ የሌላቸው ሰዎች።” የግሪኩ ቃላት መደበኛ የሊቃውንት ሥልጠናና የታወቀ ሙያዊ ወይም ይፋዊ ደረጃ ያልነበራቸውን ሰዎች ያመለክታሉ።
    reason: lexical_alternative
lexical_decisions:
- source_word: Θεωροῦντες
  choice: ሲመለከቱ
  rationale: ቀጣይነት ያለውንና ገምጋሚ ምልከታን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: παρρησίαν
  choice: በድፍረት መናገር
  rationale: ቃሉ በዐውዱ የሚያመለክተውን ፍርሃት የሌለበትን ግልጽ ንግግር ያስተላልፋል፤ “ድፍረት” ብቻውን ሊኖረው የሚችለውን አሉታዊ ፍቺም ዐውዱ ይገድበዋል።
- source_word: καταλαβόμενοι
  choice: ሲገነዘቡ
  rationale: ስለ ጴጥሮስና ዮሐንስ ወደ አንድ ግንዛቤ መድረሳቸውን ያሳያል።
- source_word: ἀγράμματοί
  choice: ያልተማሩ
  rationale: ቀላልና ዘመናዊ አገላለጽ ነው፤ ቃሉ ፈጽሞ መሃይም መሆንን ሳይሆን መደበኛ የሊቃውንት ሥልጠና አለማግኘትን እንደሚያመለክት የግርጌ ማስታወሻው ያብራራል።
- source_word: ἰδιῶται
  choice: ተራ ሰዎች
  rationale: ከሠለጠኑና ሥልጣን ካላቸው ሃይማኖታዊ ባለሙያዎች በተቃራኒ ያላቸውን ተራ፣ ሙያዊ ያልሆነ ማኅበራዊ ደረጃ ያሳያል።
- source_word: ἐθαύμαζον
  choice: ተደነቁ
  rationale: የመሪዎቹን ጥልቅ መገረም በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἐπεγίνωσκόν
  choice: አወቁ
  rationale: ከዚህ በፊት ከኢየሱስ ጋር እንደነበሩ መለየታቸውንና መገንዘባቸውን ያሳያል።
- source_word: σὺν τῷ Ἰησοῦ ἦσαν
  choice: ከኢየሱስ ጋር እንደነበሩ
  rationale: አሁን ካለው ትዕይንት በፊት ከኢየሱስ ጋር የነበራቸውን ግንኙነት ይጠብቃል።
