  rationale: የግሪኩ አገላለጽ የመደበኛ ሊቃውንታዊ ሥልጠናና የይፋ ሙያዊ ደረጃ እጥረትን እንጂ የአእምሮ ድንቁርናን ወይም የሥነ ምግባር ጉድለትን አይገልጽም።
