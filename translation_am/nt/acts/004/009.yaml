  text: εἰ ἡμεῖς σήμερον ἀνακρινόμεθα ἐπὶ εὐεργεσίᾳ ἀνθρώπου ἀσθενοῦς, ἐν τίνι οὗτος ⸀σέσωσται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/009.yaml
  text: If we are being examined today concerning a good deed done to a sick man[b][a], by what means this man has been healed—
translation:
  language: am
  text: እኛ ዛሬ ለታመመ ሰው ስለተደረገው በጎ ሥራ፣ ይህ ሰው በምን[a] እንደዳነ[b] እየተመረመርን ከሆነ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በማን»። የግሪኩ አገላለጽ መንገዱን ወይም ድርጊቱን ያደረገውን ሰው ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «እንደተፈወሰ»። የግሪኩ ግስ መዳንን፣ መታደግን ወይም ከሕመም መፈወስን ሊያመለክት ይችላል፤ በዚህ ቅርብ አውድ የአካል ፈውስ ዋናው ፍቺ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακρινόμεθα
  choice: እየተመረመርን
  rationale: ቃሉ በፍርድ ወይም በሕጋዊ ምርመራ አውድ የሚደረግን ጥያቄና ምርመራ ያመለክታል፤ «እየተመረመርን» ሕጋዊውን ድምፀት ሳያጋንን ያስተላልፋል።
- source_word: ἐπὶ εὐεργεσίᾳ
  choice: ስለተደረገው በጎ ነገር
  rationale: ἐπί ከዳቲቭ ጋር የምርመራውን ምክንያት ወይም ጉዳይ ይገልጣል፤ εὐεργεσία ደግሞ ለሌላ የተደረገ ጠቃሚና በጎ ድርጊት ነው።
- source_word: ἀνθρώπου ἀσθενοῦς
  choice: ለታመመ ሰው
  rationale: በቅርብ አውዱ ἀσθενής የሰውየውን አካላዊ ድካም ወይም ሕመም ያመለክታል፤ «ለታመመ ሰው» በጎ ድርጊቱ ለማን እንደተደረገ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐν τίνι
  choice: በምን
  rationale: የግሪኩ አገላለጽ መንገዱን፣ ኃይሉን ወይም ወኪሉን ሊያመለክት ይችላል። «በምን» በቁጥር 10 የሚመጣውን መልስ ቀድሞ ሳይወስን ይህን ስፋት ይጠብቃል።
- source_word: σέσωσται
  choice: እንደዳነ
  rationale: σῴζω መዳንን፣ መታደግንና ከሕመም መፈወስን ሊገልጥ ይችላል። የአማርኛው «ዳነ» በዚህ አውድ አካላዊ መፈወሱን በተፈጥሮ ሲገልጥ የመዳንንም ሰፊ ፍቺ ይዞ ይቆያል።
theological_decisions:
- issue: በፈውስ አውድ ውስጥ σέσωσται የሚለውን መተርጎም
  choice: እንደዳነ
  alternative: እንደተፈወሰ / እንደዳነና ደኅና እንደሆነ
  rationale: የቅርብ አውዱ የአካል ፈውስን ያመለክታል፤ ሆኖም σῴζω የመዳንንም ሃይማኖታዊ ፍቺ ሊሸከም ይችላል። «ዳነ» በአማርኛ ሁለቱንም የቃሉን የፍቺ ክልል ስለሚያስተናግድ ውጥረቱን ሳይፈታ ይጠብቃል።
