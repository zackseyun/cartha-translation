- source_word: ὅσοι ἐλάλησαν
  choice: የተናገሩት ሁሉ
  rationale: ὅσοι ያለው አካታች መጠናዊ ኃይል ‘ሁሉ’ በሚለው ተጠብቋል፤ ἐλάλησαν በቀጥታ ‘ተናገሩ’ ተብሏል።
- source_word: καὶ κατήγγειλαν
  choice: ደግሞ አውጀዋል
  rationale: καταγγέλλω በይፋ ማሳወቅን ወይም ማወጅን ያመለክታል፤ ‘አውጀዋል’ የግሱን መሠረታዊ ኃይል ይጠብቃል፣ ትንቢትንም በትርጓሜ አያክልበትም። καί ደግሞ በ‘ደግሞ’ ተወክሏል።
- source_word: τὰς ἡμέρας ταύτας
  choice: እነዚህን ዘመናት
  rationale: ἡμέρας በቀጥታ ‘ቀናት’ ቢሆንም፣ በዚህ አውድ ያለውን የዘመን ወቅት ሐሳብ ‘ዘመናት’ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ የ‘እነዚህ ቀናት’ አማራጭ በማስታወሻ ተጠብቋል።
