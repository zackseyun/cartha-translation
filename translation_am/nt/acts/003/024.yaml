lexical_decisions:
- source_word: πάντες δὲ οἱ προφῆται
  choice: ነቢያት ሁሉ
  rationale: δέ በዚህ አውድ ቀላል አያያዥ ስለሆነ በአማርኛ በተፈጥሯዊው የአረፍተ ነገር ፍሰት ተወክሏል፤ πάντες የሚያሳየው አጠቃላይነት ‘ሁሉ’ በሚለው ተጠብቋል።
- source_word: ἀπὸ Σαμουὴλ
  choice: ሳሙኤልን ጀምሮ
  rationale: ἀπό በነቢያት ተከታታይነት ውስጥ መነሻውን ያመለክታል፤ ‘ጀምሮ’ ይህን ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τῶν καθεξῆς
  choice: ከእርሱም በኋላ የተነሡት
