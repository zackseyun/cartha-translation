  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ድግግሞሽ (‘ነቢያት ሁሉ ... የተናገሩት ሁሉ’) የአካታችነቱን ኃይል ለመጠበቅ ተይዟል።
