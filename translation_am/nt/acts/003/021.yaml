  register: ዘመናዊ፣ ክቡር እና ለተራ አንባቢ ግልጽ የሆነ መዝገብ ተጠቅሟል። የግሪኩ ረጅም አረፍተ ነገር ቅርጽና ‘በ...አፍ’ የሚለው መጽሐፍ ቅዱሳዊ ምሳሌ ተጠብቀዋል።
