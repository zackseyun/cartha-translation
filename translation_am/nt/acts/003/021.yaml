  text: ὃν δεῖ οὐρανὸν μὲν δέξασθαι ἄχρι χρόνων ἀποκαταστάσεως πάντων ὧν ἐλάλησεν ὁ θεὸς διὰ ⸀στόματος τῶν ἁγίων ⸂ἀπ’ αἰῶνος αὐτοῦ προφητῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/021.yaml
  text: whom heaven must receive until the times of the restoration of all things that God spoke through the mouth of his holy prophets from of old.
translation:
  language: am
  text: ሰማይ እርሱን፣ እግዚአብሔር ከጥንት ጀምሮ በቅዱሳን ነቢያቱ አፍ የተናገራቸው ነገሮች ሁሉ የሚመለሱባቸው ዘመናት ድረስ፣ መቀበል ይገባዋል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃν
  choice: እርሱን
  rationale: የግስ ተሳቢ የሆነውን አንጻራዊ ተውላጠ ስም ያሳያል፤ በአውዱ ኢየሱስን ያመለክታል።
- source_word: δεῖ ... δέξασθαι
  choice: መቀበል ይገባዋል
  rationale: δεῖ የሚገልጸውን አስፈላጊነት እና δέξασθαι የሚገልጸውን መቀበል በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἄχρι χρόνων
  choice: እስከ ... ዘመናት ድረስ
  rationale: የጊዜ ወሰንን እና χρόνοι ያለውን ብዙ ቁጥር ይጠብቃል።
- source_word: ἀποκαταστάσεως πάντων
  choice: ሁሉም ነገር መመለስ
  rationale: ἀποκατάστασις የመመለስ፣ ወደ ቀድሞ ሁኔታ የመመለስ ሐሳብ አለው፤ πάντων ያለውን ሰፊ ነገር ግን ከሥነ መለኮታዊ ማብራሪያ ውጭ ክፍት ያደርገዋል።
- source_word: διὰ στόματος
  choice: በ...አፍ
  rationale: የግሪኩን ምሳሌያዊ አገላለጽ ጠብቆ ነቢያት የመለኮታዊ ንግግር መሣሪያ መሆናቸውን ያሳያል።
- source_word: ἀπ’ αἰῶνος
  choice: ከጥንት ጀምሮ
  rationale: በዚህ አውድ ያለውን ‘ከቀድሞ ዘመን’ የሚል የጊዜ ትርጉም በዘመናዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: ἀποκαταστάσεως πάντων የሚለው ወሰን
  choice: ሁሉም ነገር መመለስ
  alternative: ሁሉ ወደ ቀድሞ ሁኔታው መታደስ
  rationale: ጽሑፉ የሚጠቁመውን ሰፊ መመለስ እንዳለ ይጠብቃል፤ ይህን በሁሉም ፍጡር ድነት ወይም በአንድ የተወሰነ የመጨረሻ ዘመን ሥርዓት አይተረጉመውም።
- issue: ὧν የሚያመለክተው
  choice: ስለዚህም ነገር
  alternative: ያንን ሁሉ ነገር
  rationale: ὧν በሰዋስው መሠረት ከπάντων ጋር ሊያያዝ የሚችለውን ግንኙነት ይገልጣል፤ አገላለጹ እግዚአብሔር ስለ መመለሱ እንደተናገረ ያሳያል።
