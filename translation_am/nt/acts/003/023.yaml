lexical_decisions:
- source_word: πᾶσα ψυχὴ
  choice: ማንኛውም ሰው
  rationale: ቃል በቃል ‘ነፍስ ሁሉ’ ቢሆንም፣ በዚህ ፈሊጥ ψυχή እያንዳንዱን ሰው ያመለክታል። ‘ማንኛውም ሰው’ ትርጉሙን በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἥτις ἂν μὴ ἀκούσῃ
  choice: የማይሰማ
  rationale: ይህ አወቃቀር ‘የማይሰማ ማንኛውም ሰው’ የሚል ያልተወሰነ ሁኔታ ይገልጣል። ‘መስማት’ ንግግርን ከመስማት ባለፈ በታዛዥነት መቀበልንም ሊያካትት ስለሚችል የምንጩን ክፍትነት ይጠብቃል።
- source_word: τοῦ προφήτου ἐκείνου
  choice: ያን ነቢይ
  rationale: ሐረጉ ቀደም ሲል የተጠቀሰውን እንደ ሙሴ ያለውን የተወሰነ ነቢይ ያመለክታል፤ ‘ያን ነቢይ’ ይህን አመልካችነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐξολεθρευθήσεται
  choice: ፈጽሞ ይጠፋል
  rationale: ግሱ ከተራ ‘መጥፋት’ የበረታ ሙሉ ጥፋትን ወይም ፈጽሞ መወገድን ያመለክታል። ‘ፈጽሞ ይጠፋል’ ይህን ኃይል በግልጽና በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐκ τοῦ λαοῦ
  choice: ከሕዝቡ መካከል
  rationale: ἐκ ከ λαός ጋር ሲሆን ከሕዝቡ ውስጥ መወገድን ያሳያል። ‘ከሕዝቡ መካከል’ የማኅበረሰቡን ገጽታ ይጠብቃል።
theological_decisions:
- issue: በዘዳግም 18፥19 ላይ የተመሠረተው የፍርድ ማስጠንቀቂያ ምንነት
  choice: ማስጠንቀቂያውን እንደ ጽኑ ጥፋትና ከሕዝቡ መወገድ መተርጎም፣ የፍርዱን ጊዜና ዓይነት ግን አለመወሰን
  alternative: ከቃል ኪዳኑ ማኅበረሰብ መለየት ብቻ፣ ወይም የመጨረሻ መለኮታዊ ፍርድ ብቻ
  rationale: ጥቅሱ ነቢዩን ላለመስማት ከባድ ፍርድን ያውጃል፤ ነገር ግን ፍርዱ ጊዜያዊ፣ የቃል ኪዳን ማኅበረሰባዊ ወይም የመጨረሻ መሆኑን አይወስንም። ትርጉሙ ክብደቱንና አሻሚነቱን ሁለቱንም ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛ ተጠቅሟል። ‘ያን ነቢይ’ የተወሰነውን ማጣቀሻ ይጠብቃል፤ ‘ፈጽሞ ይጠፋል’ የግሪኩን ጠንካራ ኃይል ያስተላልፋል፣ አማራጩም የማኅበረሰባዊ መወገድን ንባብ በማስታወሻ ይጠብቃል።
