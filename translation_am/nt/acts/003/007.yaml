  text: καὶ πιάσας αὐτὸν τῆς δεξιᾶς χειρὸς ἤγειρεν ⸀αὐτόν· παραχρῆμα δὲ ἐστερεώθησαν ⸂αἱ βάσεις αὐτοῦ⸃ καὶ τὰ ⸀σφυδρά,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/007.yaml
  text: And taking him by the right hand[a], he raised him up; and immediately his feet and ankles were strengthened.
translation:
  language: am
  text: ቀኝ እጁንም ይዞ አስነሣው፤ ወዲያውም እግሮቹና ቁርጭምጭሚቶቹ በረቱ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πιάσας
  choice: ይዞ
  rationale: የግሱን ቀዳሚ የአካል ንክኪ ተግባር በተፈጥሯዊ አማርኛ ይገልጻል፤ እንደ «ጨብጦ» ወይም «ነጥቆ» ያለ ጠንካራ ወይም ግፍ የሚያመለክት ትርጉም አያስገባም።
- source_word: τῆς δεξιᾶς χειρός
  choice: ቀኝ እጁን
  rationale: ከπιάσας ጋር ያለውን የግሪክ ገቢር አገባብ በተፈጥሯዊ የአማርኛ ተሳቢ አገባብ ይመልሳል፤ በአውዱ የታመመው ሰው እጅ መሆኑ ግልጽ ነው።
- source_word: ἤγειρεν αὐτόν
  choice: አስነሣው
  rationale: ሰውየውን ከተቀመጠበት ማስነሣቱን በአጭርና ተፈጥሯዊ መንገድ ይገልጻል፤ «ረድቶ አስነሣው» የሚለውን በግሪኩ ያልተገለጸ ሐሳብ አይጨምርም።
- source_word: παραχρῆμα
  choice: ወዲያውም
  rationale: ፈውሱ ያለ መዘግየት መከሰቱን በዘመናዊና ግልጽ አማርኛ ያሳያል።
- source_word: ἐστερεώθησαν
  choice: በረቱ
  rationale: የአካል ክፍሎቹ ጥንካሬ ማግኘታቸውን በተፈጥሯዊ አማርኛ ይገልጻል፤ በግሪኩ ያልተጠቀሰውን አድራጊ አይጨምርም።
- source_word: αἱ βάσεις αὐτοῦ
  choice: እግሮቹ
  rationale: βάσεις በዚህ የአካል አውድ የሰውነትን መደገፊያ ክፍሎች፣ ማለትም እግሮችን ያመለክታል፤ «መሠረቶቹ» የሚለው ቃል በአማርኛ ተፈጥሯዊ አይሆንም።
- source_word: τὰ σφυδρά
  choice: ቁርጭምጭሚቶቹ
  rationale: የቁርጭምጭሚትን አካባቢ ወይም መገጣጠሚያ የሚያመለክተውን ቃል በተለመደና በቂ ትክክለኛነት ይመልሳል።
theological_decisions:
- issue: የፈውሱ መግለጫ ባሕርይ
  choice: የእግሮቹንና የቁርጭምጭሚቶቹን ወዲያውኑ መበርታት እንደ ቀጥተኛ የአካል ክስተት መግለጽ።
  alternative: «ተፈወሱ» ብሎ ማስፋት ወይም በዚሁ ንዑስ ነገር ውስጥ መለኮታዊውን አድራጊ በግልጽ መጨመር።
  rationale: ጥቅሱ የሰውነት ክፍሎቹን መበርታት በተጨባጭ ይተርካል። ትርጉሙ ተአምራዊውን አውድ ሳይክድ ጽሑፉ ያልገለጸውን የፈውስ ሂደት ወይም አድራጊ በንዑስ ነገሩ ውስጥ አያክልም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ቀላል የሆነ የትረካ አማርኛ ተጠቅሟል። የእንግሊዝኛው [a] ምልክት ከ«right hand» በኋላ የተቀመጠ ቢመስልም የማስታወሻው ይዘት «ankle bones» ስለሚል ከግሪኩ τὰ σφυδρά ጋር ይዛመዳል። በአማርኛ «ቁርጭምጭሚት» የአካባቢውን/የመገጣጠሚያውን ሰፊ ትርጉም በቂ ስለሚይዝ፣ «የቁርጭምጭሚት አጥንቶች» የሚለው ከግሪኩ የበለጠ የተወሰነ አማራጭ በሕዝብ እትም ማስታወሻ አልቀረበም።
