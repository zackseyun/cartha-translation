  yaml_path: translation/nt/acts/003/009.yaml
  text: And all the people saw him walking and praising God,
translation:
  language: am
  text: ሕዝቡም ሁሉ ሲራመድና እግዚአብሔርን ሲያመሰግን አዩት።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: -ም
  rationale: ቀላል አያያዥ በመሆኑ፣ በአማርኛ የትረካውን ፍሰት በተፈጥሮ የሚያስቀጥለው ከ‘ሕዝቡ’ ጋር የተያያዘው ‘-ም’ ነው፤ በግሪኩ የሌለ ተጨማሪ ጊዜያዊ አጽንዖት አያክልም።
- source_word: εἶδεν
  choice: አዩት
  rationale: የፈወሰውን ሰው ሕዝቡ በዓይናቸው ማየታቸውን ቀጥተኛና ተፈጥሯዊ በሆነ አማርኛ ያሳያል። የግሪኩ ግስ ነጠላ ቢሆንም፣ ‘ሕዝቡ ሁሉ’ በዘመናዊ አማርኛ የብዙ ሰዎች ስብስብ ስለሚያመለክት ብዙ ቁጥር ግስ ተፈጥሯዊ ነው።
- source_word: πᾶς ὁ λαὸς
  choice: ሕዝቡ ሁሉ
  rationale: የአንድን ሕዝብ አጠቃላይ ስብስብ የሚያመለክተውን የግሪኩን የጋራ ትርጉም ይጠብቃል፤ ‘ሕዝብ’ ከ‘ሕዝብ ብዛት’ ወይም ‘ጭፍራ’ ይልቅ λαόςን በትክክል ይወክላል።
- source_word: αὐτὸν
  choice: -ት
  rationale: በ‘አዩት’ ውስጥ ያለው የተሳቢ ቅጥያ በቀደመው አውድ የተፈወሰውን ወንድ ሰው ያመለክታል።
- source_word: περιπατοῦντα
  choice: እየተራመደ
  rationale: የሰውየውን በዚያው ጊዜ የሚታይ ቀጣይ ድርጊት ያሳያል፤ መራመዱ የፈውሱ ዋና የሚታይ ምልክት መሆኑንም ይጠብቃል።
- source_word: καὶ αἰνοῦντα
  choice: እና እግዚአብሔርን እያመሰገነ
  rationale: ሁለተኛውን በአንድ ጊዜ የሚከናወን ድርጊት በተፈጥሯዊ አማርኛ ያቀርባል፤ ‘ማመስገን’ በአምልኮ አውድ የሚሰጥን ውዳሴ በግልጽ ያስተላልፋል።
- source_word: τὸν θεόν
  choice: እግዚአብሔርን
  rationale: በመጽሐፍ ቅዱሳዊ አማርኛ የተለመደ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የθεός አቻ ነው፤ የተሳቢው ‘-ን’ ምልክት የምስጋናውን ተቀባይ ያሳያል።
