  yaml_path: translation/nt/acts/003/004.yaml
  text: And Peter[a], together with John, fixed his gaze on him and said, “Look at us.”
translation:
  language: am
  text: ጴጥሮስም ከዮሐንስ ጋር ሆኖ ትኩር ብሎ ተመለከተው[a]ና፣ “ወደ እኛ ተመልከት” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አተኩሮ ተመለከተው።” የግሪኩ ግስ የተራ እይታን ሳይሆን ትኩረት የተሞላበትን እይታ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίσας
  choice: ትኩር ብሎ ተመለከተው
  rationale: የግሪኩ ግስ ተራ ማየትን ሳይሆን ዓይንን በአንድ ሰው ላይ አተኩሮ መመልከትን ያመለክታል፤ ይህ አገላለጽ ያንን ጥንካሬ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δὲ
  choice: -ም / -ና
  rationale: እዚህ δέ ጠንካራ ተቃርኖ ሳይሆን ትረካውን ወደፊት የሚያስኬድ ለስላሳ አያያዥ ነው፤ የአማርኛው ቅጥያዎች ይህን ተግባር በተፈጥሮ ይፈጽማሉ።
- source_word: σὺν τῷ Ἰωάννῃ
  choice: ከዮሐንስ ጋር ሆኖ
  rationale: σύν አብሮነትን ያሳያል፤ ይህ አገላለጽ ጴጥሮስ ድርጊቱንና ንግግሩን ከዮሐንስ ጋር ሆኖ እንዳደረገ ግልጽ ያደርጋል።
- source_word: εἶπεν
  choice: አለው
  rationale: በዚህ አውድ λέγω ተራውን የመናገር ድርጊት ያመለክታል፤ “አለው” ቀጥተኛና ተፈጥሯዊ ነው።
- source_word: Βλέψον
  choice: ተመልከት
  rationale: የአንድ ጊዜ ቀጥተኛ ትእዛዝ ሲሆን፣ “ተመልከት” ትኩረቱን ወደ ተናጋሪዎቹ እንዲያዞር በግልጽ ያሳያል።
- source_word: εἰς ἡμᾶς
  choice: ወደ እኛ
  rationale: ከማየት ግስ ጋር εἰς የእይታውን አቅጣጫና ዒላማ ያመለክታል፤ “ወደ እኛ” ይህን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: εἰς αὐτόν
  choice: ተመለከተው
  rationale: በአማርኛ የሦስተኛ መደብ ተሳቢ ቅጥያው የተኮረበትን ሰው በተፈጥሮ ያመለክታል፤ በተለየ ሐረግ “ወደ እርሱ” ማለት አያስፈልግም።
