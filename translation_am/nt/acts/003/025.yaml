  text: ὑμεῖς ἐστε ⸀οἱ υἱοὶ τῶν προφητῶν καὶ τῆς διαθήκης ἧς ⸂διέθετο ὁ θεὸς⸃ πρὸς τοὺς πατέρας ⸀ὑμῶν, λέγων πρὸς Ἀβραάμ Καὶ ἐν τῷ σπέρματί σου ⸀ἐνευλογηθήσονται πᾶσαι αἱ πατριαὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/025.yaml
  text: You are the sons of the prophets and of the covenant that God made with your fathers[a], saying to Abraham[b], ‘And in your offspring all the families of the earth will be blessed.’
translation:
  language: am
  text: እናንተ የነቢያትም ሆነ እግዚአብሔር ከአባቶቻችሁ ጋር ያደረገው የቃል ኪዳን ልጆች ናችሁ[a]፤ አብርሃምንም፣ “በዘርህ[b] የምድር ቤተሰቦች ሁሉ ይባረካሉ” በማለት ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ ቃል በቀጥታ “ወንዶች ልጆች” የሚል ተባዕታይ ቅርጽ ነው፤ በዚህ አውድ ግን የቃል ኪዳኑን ወራሾችና ተካፋዮች የሚያመለክት አገላለጽ ነው።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ዘር።” የግሪኩ ቃል የአብርሃምን ዝርያዎች በጋራ ሊያመለክት ይችላል፤ በመጽሐፍ ቅዱሳዊ አውድ አንድን ወካይም ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: ልጆች
  rationale: የግሪኩ ቃል በቀጥታ ‘ወንዶች ልጆች’ ማለት ቢሆንም፣ እዚህ የቃል ኪዳኑን ወራሾችና ተካፋዮች የሚያመለክት ውክልናዊ አገላለጽ ነው። ‘ልጆች’ በዘመናዊ አማርኛ ይህን ሐሳብ በተፈጥሯዊ ሁኔታ ያስተላልፋል፤ የቃሉ ቀጥተኛ ጾታዊ ቅርጽ በማስታወሻ ተገልጧል።
- source_word: προφητῶν
  choice: የነቢያት
  rationale: የባለቤትነት ቅርጹን በቀጥታ ይጠብቃል፤ አገላለጹ የነቢያት ትንቢታዊ ተስፋ ወራሾች መሆንን እንጂ የሥጋ ዘር መሆንን አያስገድድም።
- source_word: διαθήκης
  choice: የቃል ኪዳን
  rationale: ከአብርሃምና ከአባቶች ጋር በተያያዘው መጽሐፍ ቅዱሳዊ አውድ ‘ቃል ኪዳን’ የተለመደና ትክክለኛ አቻ ነው።
- source_word: διέθετο
  choice: ያደረገው
  rationale: ቃል ኪዳንን ማድረግ ወይም መመሥረት የሚለውን የግሪኩን ትርጉም በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: πρὸς τοὺς πατέρας ὑμῶν
  choice: ከአባቶቻችሁ ጋር
  rationale: የቃል ኪዳን ግንኙነቱን በአማርኛ በተለመደው ‘ከ…ጋር’ አገላለጽ ያቀርባል።
- source_word: λέγων πρὸς Ἀβραάμ
  choice: እግዚአብሔር አብርሃምን፣ … ብሎታል
  rationale: የግሪኩን ተያያዥ አንቀጽ ትርጉም ጠብቆ ጥቅሱን በግልጽና ተፈጥሯዊ የአማርኛ ንግግር ያስገባል።
- source_word: σπέρματί
  choice: በዘርህ
  rationale: ‘ዘር’ የግሪኩን የጋራ ዘሮች ትርጉምና አንድን ወካይ ሊያመለክት የሚችለውን ነጠላ ቅርጽ ሳያስወግድ ይጠብቃል።
- source_word: ἐνευλογηθήσονται
  choice: ይባረካሉ
  rationale: የወደፊት ጊዜ ተገብሮ ቅርጹን በቀጥታና በተለመደ መጽሐፍ ቅዱሳዊ አማርኛ ያስተላልፋል።
- source_word: πατριαὶ
  choice: ቤተሰቦች
  rationale: ቃሉ የዘመድ ቡድኖችን ወይም ነገዶችን ሊያመለክት ቢችልም፣ ‘ቤተሰቦች’ በዚህ ተስፋ ውስጥ ያለውን ሰፊ ዓለም አቀፋዊ ክልል በተፈጥሯዊ ቋንቋ ይገልጣል።
- source_word: γῆς
  choice: የምድር
  rationale: የአብርሃም ተስፋ ሁሉን አቀፍ ወሰን ስላለው፣ ‘ምድር’ ከተወሰነ አገር ወይም መሬት ይልቅ ተገቢ ነው።
