language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἶπεν δὲ Πέτρος· Ἀργύριον καὶ χρυσίον οὐχ ὑπάρχει μοι, ὃ δὲ ἔχω τοῦτό σοι δίδωμι· ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ τοῦ Ναζωραίου ⸀περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/006.yaml
  text: 'But Peter said[a], “Silver and gold I do not have, but what I do have, this I give to you: in the name of Jesus the Messiah the Nazarene[b], walk.”'
translation:
  language: am
  text: ጴጥሮስ ግን፣ “ብርና ወርቅ የለኝም፤ ነገር ግን ያለኝን እሰጥሃለሁ፤ በናዝሬታዊው ኢየሱስ መሲሕ[a] ስም ተራመድ!” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በናዝሬታዊው ኢየሱስ ክርስቶስ ስም።” የግሪኩ Χριστός “መሲሕ” ማለት ነው፤ τοῦ Ναζωραίου ደግሞ “ናዝሬታዊው” ወይም “የናዝሬቱ” ማለት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀργύριον καὶ χρυσίον
  choice: ብርና ወርቅ
  rationale: የግሪኩን ሁለት የብረት ስሞችና ቁሳዊ ሀብትን የሚያመለክተውን የተለመደ ጥምረት በቀጥታ ይጠብቃል።
- source_word: οὐχ ὑπάρχει μοι
  choice: የለኝም
  rationale: የባለቤትነትን ሐሳብ በተፈጥሯዊና በአጭር ዘመናዊ አማርኛ ይገልጻል።
- source_word: ὃ δὲ ἔχω τοῦτό σοι δίδωμι
  choice: ያለኝን ግን ይህን እሰጥሃለሁ
  rationale: የὃ...τοῦτοን አጽንዖት ‘ይህን’ በማለት ይጠብቃል፤ ከገንዘብ እጦት ጋር ያለውንም ተቃርኖ በ‘ግን’ ያሳያል።
- source_word: ἐν τῷ ὀνόματι
  choice: በ...ስም
  rationale: የግሪኩን አገላለጽና የሥልጣን/ውክልና አንድምታውን ሳይገድብ የሚጠብቅ የተለመደ አማርኛ ነው።
- source_word: Ἰησοῦ Χριστοῦ
  choice: ኢየሱስ መሲሕ
  rationale: Χριστός እዚህ የቅባቱን ማዕረግ ስለሚያመለክት ‘መሲሕ’ ተብሎ ተተርጉሟል፤ ኢየሱስ የሚለው ስም በተለመደው አማርኛ ቅርጽ ቀርቧል።
- source_word: τοῦ Ναζωραίου
  choice: የናዝሬቱ
  rationale: ከናዝሬት የሆነውን ሰው የሚለየውን ቅጽል በተፈጥሯዊ አማርኛ ይገልጻል፤ ‘ናዝራዊው’ የሚለው ቀጥተኛ አማራጭ በማስታወሻ ቀርቧል።
- source_word: περιπάτει
  choice: ተራመድ
  rationale: የአሁን ጊዜ ትእዛዙን በግልጽና ተፈጥሯዊ የአማርኛ ትእዛዝ ያቀርባል።
theological_decisions:
- issue: በስም ቀመሩ ውስጥ Χριστοῦን መተርጎም
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: በዚህ የፈውስ አዋጅ ውስጥ Χριστός የተቀባውን የሚያመለክት ማዕረግ ሆኖ ይሠራል፤ ስለዚህ ትርጉሙን ግልጽ የሚያደርገው ‘መሲሕ’ ተመርጧል፣ በባህላዊ አጠራር የተለመደው ‘ክርስቶስ’ ግን በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ቃል ቅደም ተከተል በግድ ሳይቀዳ፣ የንግግሩ ተቃርኖና አጽንዖት ተጠብቋል።
