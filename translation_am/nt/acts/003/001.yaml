lexical_decisions:
- source_word: δέ
  choice: -ም
  rationale: እዚህ ያለው δέ ትረካውን ወደፊት የሚያስኬድ ለስላሳ አያያዥ እንጂ ጠንካራ ተቃርኖ አይደለም፤ ከስሞቹ ጋር የተያያዘው “-ም” ይህን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἀνέβαινον
  choice: ይወጡ ነበር
  rationale: ያልተፈጸመ የኋላ ጊዜ እንቅስቃሴን የሚያሳየውን የግሪኩን ያልተጠናቀቀ አንጻር ይጠብቃል፤ “መውጣት”ም ወደ ቤተ መቅደስ የመሄድን ከፍታዊ አቅጣጫ ይይዛል።
- source_word: ἱερόν
  choice: ቤተ መቅደስ
  rationale: ቃሉ የውስጠኛውን መቅደስ ብቻ ሳይሆን የቤተ መቅደሱን ግቢና ሕንፃዎች በአጠቃላይ ሊያመለክት ይችላል፤ “ቤተ መቅደስ” በአማርኛ የተለመደና ሰፊውን ማጣቀሻ የሚፈቅድ ነው።
- source_word: ἐπὶ τὴν ὥραν τῆς προσευχῆς
  choice: በጸሎት ሰዓት
  rationale: ወደ ተወሰነው የጸሎት ጊዜ መሄዳቸውን በተፈጥሯዊና ግልጽ አማርኛ ያሳያል።
- source_word: τὴν ἐνάτην
  choice: ማለትም በዘጠነኛው ሰዓት
  rationale: የጥንቱን የሰዓት አቆጣጠር በዋናው ጽሑፍ ይጠብቃል፤ “ማለትም” ዘጠነኛው ሰዓት የተጠቀሰውን የጸሎት ሰዓት እንደሚገልጽ ያብራራል።
