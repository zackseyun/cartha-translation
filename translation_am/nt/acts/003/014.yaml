- source_word: ᾐτήσασθε
  choice: ጠየቃችሁ
  rationale: αἰτέω ያለውን ‘መጠየቅ/መለመን’ ትርጉም በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἄνδρα φονέα
  choice: ነፍሰ ገዳይ
  rationale: φονεύς የሚያመለክተውን ነፍስ ያጠፋ ሰው በግልጽና በተለመደ አማርኛ ይገልጣል፤ በአማርኛ ‘ነፍሰ ገዳይ’ በራሱ ሰውን ስለሚያመለክት ἄνδραን በተለየ ‘ሰው’ ማለት አያስፈልግም።
- source_word: χαρισθῆναι ὑμῖν
  choice: እንዲሰጣችሁ
  rationale: χαρίζομαι እንደ ሞገስ መስጠትን ወይም መፍቀድን ያመለክታል። ‘እንዲሰጣችሁ’ ሰፊውን የግሱን ትርጉም ይጠብቃል፤ በዐውዱ ያለው የመፈታት ፍቺ በማስታወሻ ተገልጧል።
theological_decisions:
- issue: ‘ቅዱሱና ጻድቁ’ የሚለው ክርስቶሳዊ ማዕረጋዊ ኃይል
  choice: ኢየሱስን የሚጠቁሙ በስም ፈንታ የቆሙ ማዕረጋዊ መግለጫዎች አድርጎ መተርጎም
  alternative: እንደ ተራ ገላጭ ቅጽሎች ብቻ መተርጎም
  rationale: የግሪኩ አንቀጽና በስም ፈንታ የቆሙት ቅጽሎች የተወሰነን ሰው፣ ማለትም ኢየሱስን፣ ያመለክታሉ። ይህን የጽሑፉን ክብደት ያለ ተጨማሪ ዶክትሪናዊ ማብራሪያ ይጠብቃል።
