  alternative: ‘እንዲፈታላችሁ’ ብሎ ዐውዳዊውን ፍቺ በዋናው ጽሑፍ ማስገባት
  rationale: ግሱ በራሱ እንደ ሞገስ መስጠትን ያመለክታል፤ ዐውዱ ግን የበርባንን መፈታት ያሳያል። ዋናው ጽሑፍ የቃሉን ስፋት ሲጠብቅ ዐውዳዊው አማራጭ በማስታወሻ ቀርቧል።
