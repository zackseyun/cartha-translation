- source_word: τὸν ἅγιον καὶ δίκαιον
  choice: ቅዱሱንና ጻድቁን
  rationale: ሁለቱ ቅጽሎች ከአንቀጹ ጋር በስም ፈንታ ቆመው ኢየሱስን የሚጠቁሙ ማዕረጋዊ መግለጫዎች ናቸው። የአማርኛው የተወሰነ ቅርጽ ይህን በተፈጥሮ ይገልጣል።
- source_word: ἠρνήσασθε
  choice: ክዳችሁ
