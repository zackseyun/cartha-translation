  rationale: ይህ አተረጓጎም የትንቢቱን ይዘት ይገልጣል፤ ነገር ግን የግሪኩ የመስተአምር ቅርጽ ብቻውን በግልጽ የማይወስነውን ‘የግድ ነበረበት’ የሚል ሐሳብ አያስገባም።
