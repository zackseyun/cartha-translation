- source_word: οὕτως
  choice: በዚህ መንገድ
  rationale: እግዚአብሔር ትንቢቱን የፈጸመበትን መንገድ፣ ማለትም አሁን የተገለጸውን የመሲሑን መከራ፣ ያመለክታል።
