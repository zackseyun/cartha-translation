  text: ነገር ግን እግዚአብሔር፣ የእርሱ መሲሕ[b] መከራ እንደሚቀበል በነቢያት ሁሉ አፍ[a] አስቀድሞ ያስታወቀውን በዚህ መንገድ ፈጸመ።
