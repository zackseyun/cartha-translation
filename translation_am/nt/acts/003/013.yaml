  text: ὁ θεὸς Ἀβραὰμ καὶ ⸂Ἰσαὰκ καὶ⸃ Ἰακώβ, ὁ θεὸς τῶν πατέρων ἡμῶν, ἐδόξασεν τὸν παῖδα αὐτοῦ Ἰησοῦν, ὃν ὑμεῖς ⸀μὲν παρεδώκατε καὶ ⸀ἠρνήσασθε κατὰ πρόσωπον Πιλάτου, κρίναντος ἐκείνου ἀπολύειν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/013.yaml
  text: The God of Abraham and Isaac and Jacob[a], the God of our fathers, has glorified his servant Jesus, whom you handed over and denied before Pilate, when he had decided to release him.
translation:
  language: am
  text: የአብርሃም፣ የይስሐቅና የያዕቆብ አምላክ፣ የአባቶቻችን አምላክ፣ አገልጋዩን ኢየሱስን[a] አከበረው። እናንተ ግን አሳልፋችሁ ሰጣችሁት፤ ጲላጦስም ሊለቀው ወስኖ ሳለ፣ በጲላጦስ ፊት ካዳችሁት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ልጁን ኢየሱስን።” የግሪኩ παῖς ቃል “ልጅ” ወይም “አገልጋይ” ማለት ይችላል፤ እዚህ ከኢሳይያስ የአገልጋይ ቋንቋ ጋር ባለው ግንኙነት ምክንያት “አገልጋይ” የሚለው ተመርጧል።
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ θεὸς Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: የአብርሃም፣ የይስሐቅና የያዕቆብ አምላክ
  rationale: የቃል ኪዳኑን ቀመርና የዘፀአት 3፥6 ድምፅ ይጠብቃል፤ በአማርኛ የስሞቹን ግንኙነት በተፈጥሯዊ አገባብ ያቀርባል።
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: የአባቶቻችን አምላክ
  rationale: πατέρων ያለውን ቀጥተኛና ቃል ኪዳናዊ ጣዕም ይጠብቃል፤ ‘የቀድሞ አባቶቻችን’ የሚል ማብራሪያ ሳይጨምር ጽሑፉን ይከተላል።
- source_word: ἐδόξασεν
  choice: አከበረው
  rationale: δοξάζω በዚህ አውድ ያለውን ክብር መስጠትና ከፍ ማድረግ የሚያመለክተውን ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τὸν παῖδα αὐτοῦ Ἰησοῦν
  choice: አገልጋዩን ኢየሱስን[a]
  rationale: παῖς ‘ልጅ’ ወይም ‘አገልጋይ’ ሊሆን ቢችልም፣ ከኢሳይያስ የእግዚአብሔር አገልጋይ ቋንቋ ጋር ያለው አይቀሬ ግንኙነት ‘አገልጋይ’ን ይደግፋል፤ አማራጩ በማስታወሻ ተጠብቋል።
- source_word: παρεδώκατε
  choice: አሳልፋችሁ ሰጣችሁት
  rationale: ለባለሥልጣን አሳልፎ መስጠትን በግልጽና የተለመደ የአማርኛ አገላለጽ ያቀርባል፤ ‘ከዳችሁ’ የሚለውን ተጨማሪ ትርጓሜ አያስገባም።
- source_word: ἠρνήσασθε
  choice: ካዳችሁት
  rationale: ἀρνέομαι የሚገልጸውን መካድ በቀጥታ ያስተላልፋል፤ በሌሎች የአዲስ ኪዳን የመካድ አውዶች ያለውን የቃል ግንኙነትም ይጠብቃል።
- source_word: κατὰ πρόσωπον Πιλάτου
  choice: በጲላጦስ ፊት
  rationale: ‘በጲላጦስ ፊት’ የግሪኩን ‘በፊት/በመገኘት’ ፈሊጥ በተፈጥሯዊና ግልጽ አማርኛ ይይዛል።
- source_word: κρίναντος ἐκείνου ἀπολύειν
  choice: ጲላጦስም ሊለቀው ወስኖ ሳለ
  rationale: የግሪኩን የዘመን ግንኙነትና የፍርድ ውሳኔ ሐሳብ ይጠብቃል፤ ‘ሳለ’ በአውዱ ያለውን ንፅፅር ሳያጋንን ያሳያል።
theological_decisions:
- issue: ለኢየሱስ παῖς የሚለውን መተርጎም
  choice: አገልጋዩን
  alternative: ልጁን
  rationale: ቃሉ ሁለቱንም ትርጉሞች ሊይዝ ይችላል፤ የኢሳይያስ የአገልጋዩ ዳራ እዚህ ‘አገልጋይ’ን ይበልጥ ይደግፋል። ነገር ግን እውነተኛው የቃል አሻሚነት በእግር ማስታወሻው ተጠብቋል።
- issue: የἐδόξασεν ዘመንና ትርጉማዊ ክብደት
  choice: አከበረው
  alternative: ክብርን ሰጠው / አክብሮታል
  rationale: የግሪኩ አኦሪስት በቀላል ያለፈ ጊዜ መቅረቡ በአማርኛ ተፈጥሯዊ ነው፤ የድርጊቱን ዘላቂ ውጤት በግስ ዘመን በግድ አይጨምርም።
- issue: κρίναντος ἐκείνου ንፅፅራዊ ወይም ጊዜያዊ ነውን
  choice: ወስኖ ሳለ
  alternative: ሊለቀው በወሰነ ጊዜ / ሊለቀው ወስኖ ነበር፣ ነገር ግን
  rationale: የግሪኩ የተነጠለ ተሳቢ ሐረግ በመሠረቱ ጊዜያዊ ነው፣ አውዱ ግን ንፅፅርንም ያሰማል። ‘ሳለ’ ሁለቱንም ሳይወስን በተፈጥሯዊ ሁኔታ ይጠብቃል።
