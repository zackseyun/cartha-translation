  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የቃል ኪዳኑ ቅርጽ ‘የአብርሃም… አምላክ’ እና ‘የአባቶቻችን አምላክ’ በመደጋገም ተጠብቋል፤ ከባድ ጥንታዊ አገላለጽ አልተጫነም።
