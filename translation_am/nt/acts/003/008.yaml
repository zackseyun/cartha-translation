  yaml_path: translation/nt/acts/003/008.yaml
  text: And leaping up, he stood and began to walk, and he entered the temple with them, walking and jumping and praising God.
translation:
  language: am
  text: ዘሎ ቆመ፣ መራመድም ጀመረ። ከእነርሱም ጋር ወደ ቤተ መቅደስ ገባ፤ እየተራመደና እየዘለለ እግዚአብሔርንም እያመሰገነ ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξαλλόμενος
  choice: ወደ ላይም ዘሎ
  rationale: The participle depicts an upward spring or leap; this rendering preserves both the direction and energetic action naturally in Amharic.
- source_word: περιεπάτει
  choice: መራመድም ጀመረ
  rationale: The imperfect indicates ongoing or inceptive walking in context, naturally expressed as beginning to walk.
- source_word: τὸ ἱερόν
  choice: ቤተ መቅደሱ
  rationale: Here the term refers to the temple precincts generally, for which ቤተ መቅደስ is the standard clear Amharic designation.
- source_word: ἁλλόμενος
  choice: እየዘለለ
  rationale: Preserves the repeated jumping or leaping action without unnecessarily distinguishing it doctrinally from the earlier upward leap.
- source_word: αἰνῶν τὸν θεόν
  choice: እግዚአብሔርን እያመሰገነ
  rationale: Uses the ordinary dignified Amharic biblical expression for praising God.
