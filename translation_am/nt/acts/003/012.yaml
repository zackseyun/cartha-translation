base_translation:
  language: en
  yaml_path: translation/nt/acts/003/012.yaml
  text: But when Peter saw it[a], he answered the people, “Men of Israel, why do you marvel at this[b], or why do you stare at us as though by our own power or godliness we had made him walk?”
translation:
  language: am
  text: ጴጥሮስም ይህን ባየ ጊዜ ለሕዝቡ እንዲህ ብሎ መለሰ፦ “እናንተ የእስራኤል ሰዎች፣ በዚህ ለምን ትደነቃላችሁ? ወይስ እኛን ለምን ትኩር ብላችሁ[a] ታዩናላችሁ? በራሳችን ኃይል ወይም በእግዚአብሔር ፍርሃታችን[b] ይህን ሰው እንዲራመድ ያደረግን ይመስል?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ዓይናችሁን በእኛ ላይ አተኩራችሁ ታዩናላችሁ።” ግሱ የተተኮረና የቀጠለ እይታን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በሃይማኖተኝነታችን” ወይም “በቅን አምልኮአችን።” ጴጥሮስ የሰውየው ፈውስ ከሐዋርያት የግል ሃይማኖታዊ ትጋት ወይም መንፈሳዊ ብቃት እንዳልመጣ ይክዳል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: ጴጥሮስም ይህን አይቶ
  rationale: የግሪኩ የአኦሪስት አሳታፊ ግስ ጴጥሮስ ከመመለሱ በፊት የሕዝቡን ሁኔታ ማየቱን ያሳያል፤ “ይህን” የሚለው ከዐውደ ንባቡ የተገነዘበውን የሕዝቡን ምላሽ ያመለክታል። “-ም” የδὲን ቀላል የንግግር ሽግግር በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἀπεκρίνατο πρὸς τὸν λαόν
  choice: ለሕዝቡ እንዲህ ሲል መለሰ
  rationale: ቀጥተኛ ጥያቄ ባይቀርብም ἀποκρίνομαι ለተፈጠረው ሁኔታ ምላሽ መስጠትን ይገልጣል፤ ይህ አገላለጽ ቀጥሎ ያለውን ቀጥተኛ ንግግር በተፈጥሯዊ ሁኔታ ያስገባል።
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: እናንተ የእስራኤል ሰዎች
  rationale: ይህ የሕዝብ ንግግር የመጥሪያ አገላለጽ ነው። “የእስራኤል ሰዎች” በዘመናዊ አማርኛ ተፈጥሯዊና ክብር ያለው ሲሆን Ἰσραηλῖταιን በግልጽ ይወክላል።
- source_word: τί θαυμάζετε ἐπὶ τούτῳ
  choice: በዚህ ለምን ትደነቃላችሁ?
  rationale: θαυμάζω መደነቅን ወይም መገረምን ያመለክታል፤ “በዚህ” የፈውሱን ክስተት ያመለክታል።
- source_word: ἢ ἡμῖν τί ἀτενίζετε
  choice: ወይስ ... ለምን አፍጥጣችሁ[a] ታዩናላችሁ?
  rationale: ἀτενίζω ዓይንን በአንድ ነገር ላይ አተኩሮ ለተወሰነ ጊዜ ማየትን ይገልጣል፤ “አፍጥጣችሁ ታዩናላችሁ” ይህን ኃይል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ὡς ἰδίᾳ δυνάμει
  choice: በራሳችን ኃይል ... ያደረግን ይመስል
  rationale: ὡς ጴጥሮስ የሚቃወመውን የተሳሳተ ግምት ያስገባል፤ ἰδίᾳ ኃይሉ የሐዋርያት የግል ችሎታ እንዳልሆነ ያጎላል።
- source_word: εὐσεβείᾳ
  choice: በአምላካዊ አኗኗራችን[b]
  rationale: εὐσέβεια ለእግዚአብሔር ያለን አክብሮትና ይህን የሚያንጸባርቅ ታማኝ አኗኗር ያመለክታል። ምርጫው ፈውሱ ከሐዋርያት መንፈሳዊ ብቃት ወይም ሃይማኖታዊ ትጋት እንዳልመጣ የሚክደውን ነጥብ ይጠብቃል።
- source_word: πεποιηκόσιν τοῦ περιπατεῖν αὐτόν
  choice: ይህን ሰው እንዲራመድ ያደረግን
  rationale: የግሪኩ ፍጹም አሳታፊ ግስና መስተዋድዳዊ የስም አገባብ ሰውየውን እንዲራመድ ማድረግ የተፈጸመ ውጤት እንደሆነ ይገልጣሉ፤ የአማርኛው አገላለጽ ይህን በግልጽ ያስተላልፋል።
