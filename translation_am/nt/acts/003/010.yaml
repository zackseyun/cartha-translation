id: ACT.3.10
reference: Acts 3:10
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐπεγίνωσκον ⸀δὲ αὐτὸν ὅτι ⸀οὗτος ἦν ὁ πρὸς τὴν ἐλεημοσύνην καθήμενος ἐπὶ τῇ Ὡραίᾳ Πύλῃ τοῦ ἱεροῦ, καὶ ἐπλήσθησαν θάμβους καὶ ἐκστάσεως ἐπὶ τῷ συμβεβηκότι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/010.yaml
  text: And they recognized him[a], that this was the man who used to sit for alms at the Beautiful Gate of the temple[b], and they were filled with amazement and astonishment at what had happened to him.
translation:
  language: am
  text: እርሱ ምጽዋት ለመቀበል በቤተ መቅደሱ[a] ውብ በተባለው በር አጠገብ ይቀመጥ የነበረው ሰው መሆኑን አወቁ፤ በእርሱ ላይ በደረሰው ነገርም በድንጋጤና በመገረም ተሞሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ቤተ መቅደስ” ተብሎ የተተረጎመው የግሪክኛው ቃል የቤተ መቅደሱን ግቢና ሕንፃዎች በአጠቃላይ ያመለክታል፤ የውስጠኛውን መቅደስ ብቻ አያመለክትም።
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεγίνωσκον
  choice: አወቁት
  rationale: በትረካው ውስጥ ሕዝቡ ሰውየው ቀድሞ ያውቁት የነበረ ለማኝ መሆኑን መለየታቸውን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: δὲ
  choice: -ም
  rationale: ቀላል የትረካ ማያያዣው በአማርኛ ከግስ ጋር በተያያዘው “-ም” ተፈጥሯዊ ሆኖ ተገልጧል።
- source_word: οὗτος ἦν
  choice: እርሱም … የነበረው ሰው መሆኑን
  rationale: የተፈወሰው ሰው በሕዝቡ ዘንድ ይታወቅ የነበረው ያው ሰው መሆኑን የአመልካቹን አጽንዖት ጠብቆ ያሳያል።
- source_word: ὁ πρὸς τὴν ἐλεημοσύνην καθήμενος
  choice: ምጽዋት ለመቀበል … ይቀመጥ የነበረው ሰው
  rationale: ተሳቢ አገላለጹ የሰውየውን የተለመደ ቀደምት ድርጊት ይገልጣል፤ “ይቀመጥ የነበረው” ይህን በግልጽ ያሳያል።
- source_word: ἐλεημοσύνην
  choice: ምጽዋት
  rationale: ለድሆች የሚሰጥን ገንዘብ ወይም ስጦታ በትክክል የሚገልጽ የተለመደ አማርኛ ቃል ነው።
- source_word: ἐπὶ τῇ Ὡραίᾳ Πύλῃ
  choice: ውብ በር አጠገብ
  rationale: Ὡραία የበሩ መጠሪያ ስለሆነ “ውብ በር” ተብሎ ተጠብቋል፤ ἐπί በዚህ ዐውድ ቦታን ያመለክታል።
- source_word: τοῦ ἱεροῦ
  choice: በቤተ መቅደሱ
  rationale: ἱερόν የቤተ መቅደሱን አጠቃላይ ግቢ ያመለክታል፤ በዋናው ጽሑፍ የተለመደው “ቤተ መቅደስ” ተጠቅሞ ልዩነቱ በማስታወሻ ተብራርቷል።
- source_word: ἐπλήσθησαν θάμβους καὶ ἐκστάσεως
  choice: እጅግ ተደነቁ፣ ተገረሙም
  rationale: ሁለቱን ተዛማጅ ግን የተለያዩ የድንጋጤና የመገረም ስሜቶች በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል፤ “እጅግ” የመሞላትን ኃይለኛ ደረጃ ያሳያል።
- source_word: ἐπὶ τῷ συμβεβηκότι αὐτῷ
  choice: በእርሱም ላይ በሆነው ነገር
  rationale: ፍጹም አንቀጹ የተፈጸመውንና አሁንም ውጤቱ የሚታየውን ክስተት ያመለክታል።
