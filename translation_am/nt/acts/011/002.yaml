translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ይከራከሩ ነበር’ የሚለው ቀጣይነትን ይጠብቃል፤ ‘ከግርዛት ወገን’ ደግሞ መደበኛ የኑፋቄ ወይም የፓርቲ ስያሜ ሳያስገባ የምንጩን አሻሚነት ያቆያል።
