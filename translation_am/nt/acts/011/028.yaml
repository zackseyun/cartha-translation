  text: ἀναστὰς δὲ εἷς ἐξ αὐτῶν ὀνόματι Ἅγαβος ἐσήμανεν διὰ τοῦ πνεύματος λιμὸν ⸀μεγάλην μέλλειν ἔσεσθαι ἐφ’ ὅλην τὴν οἰκουμένην· ⸀ἥτις ἐγένετο ἐπὶ ⸀Κλαυδίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/028.yaml
  text: And one of them[a], named Agabus, stood up and indicated by the Spirit that a great famine was about to come over the whole inhabited world—which happened in the time of Claudius.
translation:
  language: am
  text: ከእነርሱም አንዱ፣ አጋቦስ የሚባል፣ ተነሥቶ በመንፈስ ታላቅ ረሃብ በመላው የሰው መኖሪያ ዓለም ላይ[a] ሊመጣ እንደሆነ አመለከተ፤ ይህም በቀላውዴዎስ ዘመን ሆነ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በመላው ዓለም”፤ በሉቃስና በሐዋርያት ሥራ “የሰው መኖሪያ ዓለም” የሚለው አገላለጽ በተለይ የሮምን ዓለም ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: ተነሥቶ
  rationale: የአጋቦስን በስብሰባው መካከል ተነሥቶ መናገር በቀጥታና በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐσήμανεν
  choice: አመለከተ
  rationale: ‘አስታወቀ/አመለከተ’ የሚለውን መሠረታዊ ፍቺ ይጠብቃል፤ የንግግሩን መንገድ ከጽሑፉ በላይ ‘ትንቢት ተናገረ’ ብሎ አይወስንም።
- source_word: διὰ τοῦ πνεύματος
  choice: በመንፈስ አማካይነት
  rationale: διά ከወራጅ ስም ጋር የመንገድን ወይም የወኪልነትን ሐሳብ ይገልጣል፤ ይህ አተረጓጎም መገለጡ በመንፈስ እንደመጣ ያሳያል።
- source_word: λιμὸν μεγάλην
  choice: ታላቅ ረሃብ
  rationale: ሁለቱንም የግሪክ ቃላት በቀጥታ ይወክላል፤ ‘ከባድ ረሃብ’ ሊባል ቢችልም μεγάλην የሚለውን ቅርጽ ይጠብቃል።
- source_word: μέλλειν ἔσεσθαι
  choice: ሊመጣ እንደሆነ
  rationale: የወደፊትና ቀርቦ የመሆንን ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ከ‘ረሃብ’ ጋር ‘መምጣት’ የተለመደ አገላለጽ ነው።
- source_word: ἐφ’ ὅλην τὴν οἰκουμένην
  choice: በመላው ሰው በሚኖርበት ዓለም ላይ
  rationale: οἰκουμένη በመሠረቱ ‘ሰው የሚኖርበት ዓለም’ ማለት ነው፤ ዋናው ጽሑፍ ትርጉሙን ሳያጠብ ይጠብቃል፣ የሮምን ግዛት ሊያመለክት የሚችለው አማራጭ በማስታወሻ ቀርቧል።
- source_word: ἐγένετο
  choice: ሆነ
  rationale: ክስተቱ በእርግጥ መፈጸሙን በአጭርና በዘመናዊ አማርኛ ይገልጣል።
- source_word: ἐπὶ Κλαυδίου
  choice: በቀላውዴዎስ ዘመን
  rationale: ἐπί ከገዥ ስም ጋር የሚገልጠውን የጊዜ ትርጉም ግልጽና ተደራሽ በሆነ አማርኛ ያቀርባል።
theological_decisions:
- issue: በδιὰ τοῦ πνεύματος ውስጥ ‘መንፈስ’ የሚያመለክተው
  choice: በመንፈስ አማካይነት
  alternative: በመንፈስ ቅዱስ አማካይነት
  rationale: በሐዋርያት ሥራ የትንቢት ዐውድ ውስጥ ‘መንፈስ’ በተለምዶ መንፈስ ቅዱስን ያመለክታል። ሆኖም የግሪኩ ጽሑፍ ‘ቅዱስ’ የሚለውን ቃል ስላልጨመረ፣ ዋናው ትርጉም የምንጩን አገላለጽ ጠብቋል።
- issue: የοἰκουμένη ወሰን
  choice: ሰው የሚኖርበት ዓለም ተብሎ በሰፊው ተተርጉሟል
  alternative: መላው ዓለም፤ ወይም መላው የሮም ዓለም/ግዛት
  rationale: ቃሉ ሰው የሚኖርበትን ዓለም በሰፊው ሊያመለክት ይችላል፤ በሉቃስና በሐዋርያት ሥራ ግን የሮምን ዓለም የሚያመለክትበትም አጠቃቀም አለ። ዋናው ጽሑፍ ይህን ሳይወስን ሰፊውን የቃሉን ፍቺ ያቆያል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ጥቅም ላይ ውሏል። የግሪኩ የአረፍተ ነገር ቅደም ተከተል በአማርኛ ተፈጥሯዊ እንዲሆን ተስተካክሏል፤ የስሞች አጻጻፍ ‘አጋቦስ’ እና ‘ቀላውዴዎስ’ ተብሎ ቀርቧል።
