    text: ወይም፦ “እንደ ተራ ነገር አትቁጠራቸው” ወይም “ርኩስ ናቸው አትበል።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: መለሰ
  rationale: በትረካው ቅደም ተከተል ‘መለሰ’ የሚለው የግሱን የተለመደ ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: φωνὴ
  choice: ድምፅ
  rationale: ምንጩ ተናጋሪውን በስም ስለማይገልጽ፣ ‘ድምፅ’ የሚለው ትርጉም ይህን አሻሚነት ይጠብቃል።
- source_word: ἐκ δευτέρου
  choice: ለሁለተኛ ጊዜ
  rationale: የግሪኩን ፈሊጣዊ ትርጉም በግልጽና በተለመደ አማርኛ ይገልጻል።
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: ከሰማይ የመጣ
  rationale: ድምፁ ከሰማይ መምጣቱን በተፈጥሯዊ የአማርኛ አገባብ ያሳያል።
- source_word: Ἃ
  choice: ያነጻውን
  rationale: የግሪኩ ገለልተኛ ብዙ ቁጥር አንጻራዊ ተውላጠ ስም በአማርኛ በነጠላ ጥቅል አገላለጽ ተፈጥሯዊ ሆኖ ይቀርባል።
- source_word: ἐκαθάρισεν
  choice: ያነጻውን
  rationale: ‘አነጻ’ መንጻትን ወይም ንጹሕ ማድረግን ያስተላልፋል፤ የተፈጸመውንም የእግዚአብሔር ድርጊት ይጠብቃል።
- source_word: σὺ
  choice: አንተ
  rationale: በግሪኩ በግልጽ የተጠቀሰውንና አጽንዖት ያለውን ተውላጠ ስም ይጠብቃል።
- source_word: μὴ κοίνου
  choice: ርኩስ ነው አትበል
  rationale: κοινόω በዚህ የአይሁድ የንጽሕና አውድ ‘እንደ ተራ/ያልተቀደሰ መቁጠር’ እና ‘ርኩስ ማለት’ የሚሉትን ትርጉሞች ይይዛል። ‘ርኩስ ነው አትበል’ በዘመናዊ አማርኛ ግልጽ ሲሆን የሰውን ፍረጃ ከእግዚአብሔር ማንጻት ጋር ያነጻጽራል።
theological_decisions:
- issue: በκοινόω ውስጥ ያለው የንጽሕና ቃላት ልዩነት
  choice: ርኩስ ነው አትበል
  alternative: እንደ ተራ አትቁጠር፤ ወይም፦ ያልነጻ ነው አትበል
  rationale: ግሪኩ ቃል ‘የጋራ/ተራ’ የሚለውን መሠረታዊ ሐሳብ በሥርዓታዊ ንጽሕና አውድ ‘ርኩስ’ በሚል ስሜት ይጠቀማል። ‘ተራ’ ብቻውን በዘመናዊ አማርኛ ሐሳቡን ሊያደበዝዝ ስለሚችል፣ ግልጹ አገላለጽ በዋናው ጽሑፍ ተመርጦ የቃሉ ሌሎች ገጽታዎች በማስታወሻ ተጠብቀዋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩን አጽንዖት ለመጠበቅ ‘አንተ’ በግልጽ ተጠቅሷል፤ የንጽሕና ቃሉ ስፋት በማስታወሻ ተጠብቋል።
