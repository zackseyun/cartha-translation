    text: ወይም፣ “ጴጥሮስ የሚባለውን ስምዖንን እንዲመጣ ላክ።” «አስጠራ» ተብሎ የተተረጎመው ግስ «እንዲመጣ ላክ» ተብሎም ሊተረጎም ይችላል።
