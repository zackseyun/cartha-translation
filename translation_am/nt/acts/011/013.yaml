  text: እርሱም መልአኩን በቤቱ ቆሞ እንዲህ ሲል እንዳየ ነገረን፦ “ወደ ኢዮጴ ላክ፤ ጴጥሮስ የሚባለውን ስምዖንንም አስጠራ[a]።”
  philosophy: optimal-equivalence
  footnotes:
