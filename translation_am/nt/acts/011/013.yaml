review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys that Cornelius reported seeing the angel in his house and the two imperatives concerning Joppa and Simon Peter. However, «ሲለው» adds an explicit indirect object (“saying to him”) that is not expressed in this verse, even though it is contextually inferable. The revised wording avoids adding it while retaining the source’s participial structure and the implicit object of «Send to Joppa.»
  naturalness: «መልአኩን ... ሲለው እንዳየው» is understandable, but its pronoun is potentially awkward and introduces an unnecessary referent. «መልአኩን በቤቱ ቆሞ እንዲህ ሲል እንዳየ» is smoother modern standard Amharic narrative prose.
  terminology: «መልአክ/መልአኩን», «ኢዮጴ», «ስምዖን», and «ጴጥሮስ» are appropriate biblical names and terms. «አስጠራ» suitably renders μεταπέμψαι. The footnote alternative is adjusted to express “send for” rather than the potentially stronger “bring.”
  issues:
  - severity: medium
    issue: The phrase «ሲለው» supplies an indirect object.
    rationale: εἰπόντα means “saying” and does not state “saying to him” in this verse. Since the recipient is not grammatically expressed in the source, the translation should not make it explicit.
  - severity: low
    issue: The footnote’s wording «ለማስመጣት» can suggest personally bringing Simon.
    rationale: μετάπεμψαι more specifically means to send for or summon someone. A revised alternative preserves that nuance without implying that the addressee himself must bring Simon.
  revised_text: እርሱም መልአኩን በቤቱ ቆሞ እንዲህ ሲል እንዳየ ነገረን፦ “ወደ ኢዮጴ ላክ፤ ጴጥሮስ የሚባለውን ስምዖንንም አስጠራ[a]።”
