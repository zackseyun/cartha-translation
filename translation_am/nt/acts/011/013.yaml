lexical_decisions:
- source_word: ἀπήγγειλεν
  choice: ነገረን
  rationale: ቃሉ የሰማውን ወይም ያየውን ለሌሎች ማስተላለፍን ያመለክታል፤ «ነገረን» በዘመናዊ አማርኛ ተፈጥሯዊና ለትረካው ተስማሚ ነው።
- source_word: δὲ
  choice: እርሱም
  rationale: δέ እዚህ ጠንካራ ንፅፅር ሳያመጣ ትረካውን የሚያስቀጥል ለስላሳ አያያዥ ነው፤ «-ም» ይህን ተግባር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: πῶς εἶδεν
  choice: እንዳየው
  rationale: πῶς የሪፖርቱን ይዘትና ሁኔታ ያስገባል፤ «እንዳየው» የማየቱ ክስተት ከመናገሩ በፊት መሆኑን በአማርኛ አወቃቀር በቂ ሁኔታ ያሳያል።
- source_word: τὸν ἄγγελον
  choice: መልአኩን
  rationale: የግሪኩ የተወሰነ አመልካችና ዐውደ ንባቡ ቀደም ሲል የተጠቀሰውን መልአክ ያመለክታሉ፤ የአማርኛው «-ኡ» ይህን የተወሰነነት ይጠብቃል።
- source_word: ἐν τῷ οἴκῳ αὐτοῦ
  choice: በቤቱ
  rationale: οἶκος እዚህ የመኖሪያ ስፍራን ያመለክታል፤ «በቤቱ» አጭር፣ ቀጥተኛና ተፈጥሯዊ ነው።
- source_word: σταθέντα καὶ εἰπόντα
  choice: ቆሞ፣ … ሲለው
  rationale: ሁለቱን ተሳቢ ግሶች የመልአኩ አቋምና ንግግር አድርጎ ያቀርባል፤ ይህ አወቃቀር የግሪኩን ፍሰት በተፈጥሯዊ አማርኛ ይይዛል።
- source_word: Ἀπόστειλον εἰς Ἰόππην
  choice: ወደ ኢዮጴ ላክ
  rationale: ሁለተኛ መደብ ነጠላ ትእዛዝ ሲሆን በግሪኩ የሚላከው ሰው በግልጽ አልተጠቀሰም፤ ትርጉሙም «ሰዎች» የሚል ተጨማሪ ቃል ሳያስገባ ይህን ይጠብቃል።
- source_word: μετάπεμψαι
  choice: አስጠራ
  rationale: ግሱ አንድን ሰው መልእክት ልኮ እንዲመጣ ማድረግን ያመለክታል፤ «አስጠራ» ይህን በአጭርና ተፈጥሯዊ አማርኛ ያቀርባል፣ ሌላው አተረጓጎም በማስታወሻው ቀርቧል።
- source_word: τὸν ἐπικαλούμενον Πέτρον
  choice: ጴጥሮስ የሚባለውን
  rationale: ተሳቢው ስምዖንን በሌላው የተለመደ ስሙ ይለያል፤ «ጴጥሮስ የሚባለውን» ግልጽና ዘመናዊ አገላለጽ ነው።
