    rationale: The lexical alternative intended by the audit trail is “the nations.” In modern Amharic, “ለብሔራት” supplies that alternative more clearly, while the note can retain the contextual clarification that the term denotes non-Jews.
  - severity: low
    issue: “እነዚህንም” attaches the connective -ም to the object unnecessarily.
    rationale: δέ is only a mild connective here and need not be explicitly represented. “እነዚህን በሰሙ ጊዜ” is smoother and preserves the temporal participial relationship.
