  source_fidelity: 'The verse’s principal assertions are accurately conveyed: on hearing Peter’s report, the group ceased their objection, glorified God, and concluded that God had granted repentance directed toward life to the Gentiles. “ንስሐ” and “ሰጥቷል” faithfully retain μετάνοια and ἔδωκεν without imposing doctrinal conclusions. The main rendering of εἰς ζωήν is appropriately resultative/directional.'
