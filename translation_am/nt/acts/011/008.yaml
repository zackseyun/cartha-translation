  text: εἶπον δέ· Μηδαμῶς, κύριε, ⸀ὅτι κοινὸν ἢ ἀκάθαρτον οὐδέποτε εἰσῆλθεν εἰς τὸ στόμα μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/008.yaml
  text: But I said, ‘By no means, Lord, because nothing common or unclean has ever entered my mouth.’
translation:
  language: am
  text: እኔ ግን፣ ‘ከቶ አይሆንም፣ ጌታ ሆይ! ምክንያቱም ርኩስ ወይም ንጹሕ ያልሆነ ነገር ከቶ ወደ አፌ ገብቶ አያውቅም’ አልኩ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδαμῶς
  choice: ከቶ አይሆንም
  rationale: የጴጥሮስን ጠንካራ እምቢታ በተፈጥሯዊና በክብር ባለው ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: κύριε
  choice: ጌታ ሆይ
  rationale: የቀጥታ አድራሻውን እና የκύριοςን ትርጉም ይጠብቃል።
- source_word: ὅτι
  choice: ምክንያቱም
  rationale: እምቢታውን ተከትሎ የቀረበውን ምክንያት በግልጽ ሁኔታ ያሳያል።
- source_word: κοινὸν
  choice: ርኩስ
  rationale: በአይሁድ የሥርዓት አውድ κοινός መደበኛ የሚለውን ሳይሆን በሥርዓት የረከሰውን ወይም ያልተቀደሰውን ያመለክታል፤ ‘ርኩስ’ ይህን በተለመደ አማርኛ ያስተላልፋል።
- source_word: ἀκάθαρτον
  choice: ንጹሕ ያልሆነ
  rationale: ከκοινόν ጋር ያለውን ሁለትዮሽ አገላለጽ ሳያጠፋ የሥርዓታዊ ንጽሕና እጦትን ያሳያል።
- source_word: οὐδέποτε εἰσῆλθεν εἰς τὸ στόμα μου
  choice: ከቶ ወደ አፌ ገብቶ አያውቅም
  rationale: የግሪኩን ቀጥተኛ ምስልና የፍጹም እምቢታ ኃይል በተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: κοινὸν እና ἀκάθαρτον ያላቸው የሥርዓታዊ ምግብ አውድ
  choice: ርኩስ ወይም ንጹሕ ያልሆነ
  alternative: ተራ ወይም ርኩስ
  rationale: ‘ተራ’ κοινός ያለውን መዝገበ ቃላዊ ትርጉም ቢያንጸባርቅም፣ በዚህ አውድ የሥርዓታዊ ርኩሰት ሐሳቡን ሊያደበዝዝ ይችላል። ሁለቱንም ቃላት ለይቶ መተርጎም የምንጩን ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የቀጥታ ንግግሩ ኃይል እና የግሪኩ ምክንያታዊ ግንኙነት ተጠብቀዋል።
