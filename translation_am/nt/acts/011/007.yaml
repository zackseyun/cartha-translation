  yaml_path: translation/nt/acts/011/007.yaml
  text: And I also heard a voice saying to me, ‘Get up, Peter; kill and eat.’
translation:
  language: am
  text: ደግሞም፣ ለእኔ፣ “ጴጥሮስ ሆይ፣ ተነሥተህ እረድና ብላ” የሚል ድምፅ ሰማሁ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναστάς
  choice: ተነሥተህ
  rationale: የግሪክኛውን የተነሥቶ እርምጃ መውሰድ ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: θῦσον
  choice: እረድ
  rationale: በዐውዱ የቀረቡትን እንስሳት ለመብላት መግደልን የሚገልጽ ትክክለኛና የተለመደ የአማርኛ ቃል ነው፤ የግድ የአምልኮ መሥዋዕትን አያስገባም።
- source_word: φάγε
  choice: ብላ
  rationale: ለጴጥሮስ በነጠላ የተሰጠውን ቀጥተኛ ትእዛዝ ያስተላልፋል።
- source_word: φωνῆς λεγούσης μοι
  choice: የሚል ድምፅ
  rationale: ‘ለእኔ የሚናገር ድምፅ’ የሚለውን ሐሳብ በተፈጥሯዊና አጭር አማርኛ ይገልጻል።
theological_decisions:
- issue: የ θῦσον የመሥዋዕት ፍቺ ሊኖረው መቻል
  choice: እረድ
  alternative: ሠዋ
  rationale: ይህ ዐውድ በዋናነት እንስሳትን ገድሎ መብላትን ያመለክታል፤ “ሠዋ” የሚለው ግን ያልተገለጸ የአምልኮ ወይም የመሥዋዕት ሐሳብ ሊያስገባ ይችላል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ፤ ቀጥተኛው ንግግርና የትእዛዙ ኃይል ተጠብቀዋል።
