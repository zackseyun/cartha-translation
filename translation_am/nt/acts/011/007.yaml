review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders ἤκουσα (‘I heard’), καὶ (‘also’), Ἀναστάς (‘having risen/get up’), θῦσον (‘kill/slaughter’), and φάγε (‘eat’). However, it omits μοι (‘to me’), an explicit element of φωνῆς λεγούσης μοι.
  naturalness: The command, “ጴጥሮስ ሆይ፣ ተነሥተህ እረድና ብላ,” is natural modern standard Amharic. Adding “ለእኔ” retains the omitted addressee relation without making the sentence awkward.
  terminology: “እረድ” appropriately communicates killing animals for food in this context and does not unnecessarily introduce a sacrificial-cultic sense. “ጴጥሮስ” and the direct-address form “ሆይ” are appropriate.
  issues:
  - severity: medium
    issue: The phrase μοι (‘to me’) is not represented.
    rationale: “የሚል ድምፅ” conveys that a voice spoke, but not that it spoke specifically to Peter/the narrator. The source explicitly includes this relation.
