lexical_decisions:
- source_word: ὃς
  choice: እርሱም
  rationale: አንጻራዊው ተውላጠ ስም ቀደም ሲል የተጠቀሰውን ስምዖንን ያመለክታል፤ በአማርኛ የንግግሩን ቀጣይነት ለማሳየት «እርሱም» ተፈጥሯዊ ነው።
- source_word: λαλήσει
  choice: ይነግርሃል
  rationale: λαλέω መናገርን ያመለክታል፤ πρὸς σὲ ከሚለው ጋር ተያይዞ «ይነግርሃል» መልእክቱን ለአድማጩ ማቅረብን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ῥήματα
  choice: ቃላት
  rationale: የግሪኩን ብዙ ቁጥር በቀጥታ ይጠብቃል፤ «መልእክት» ማለት የሚቻል ቢሆንም ከምንጩ የበለጠ ማጠቃለያ ይሆናል።
- source_word: πρὸς σὲ
  choice: -ሃል (በ«ይነግርሃል»)
  rationale: የንግግሩ አቅጣጫ ወደ «አንተ» መሆኑ በአማርኛው ግስ ውስጥ ባለው ተሳቢ ቅጥያ ተፈጥሯዊ ሆኖ ተገልጿል።
- source_word: ἐν οἷς
  choice: የምትድኑባቸውን
  rationale: የ«በእነርሱ»ን መሣሪያዊ ወይም ማካኝነታዊ ኃይል «-ባቸው» ይጠብቃል፤ ይህም ቃላቱ ድነት የሚመጣበት መንገድ መሆናቸውን ያሳያል።
- source_word: σωθήσῃ
  choice: የምትድኑ
  rationale: የσῴζωን የድነት ትርጉም ይጠብቃል፤ በተቀናጀው ሐረግ ውስጥ ሁለተኛ መደብ ብዙ ቁጥር መጠቀሙ ቆርኔሌዎስንና መላውን ቤተሰቡን በአንድነት ያመለክታል።
- source_word: σὺ
  choice: አንተ
  rationale: በግሪኩ በግልጽ የተጠቀሰውንና አጽንዖት ያለውን ተውላጠ ስም ይጠብቃል።
- source_word: πᾶς ὁ οἶκός σου
  choice: መላው ቤተሰብህ
  rationale: οἶκος እዚህ ሕንፃን ሳይሆን የቤቱን ሰዎች ያመለክታል፤ «መላው» የπᾶςን ሙሉ ወሰን ይጠብቃል።
theological_decisions:
- issue: በቆርኔሌዎስ ቤተሰብ አውድ የσωθήσῃ ትርጉም
  choice: «የምትድኑ» ተብሎ ተተርጉሟል፤ ድነቱ በሚነገሩት ቃላት እንደሚመጣ ጥቅሱ በሚሰጠው መጠን ብቻ ቀርቧል።
  alternative: «ከአደጋ የምትድኑ» ወይም «ነጻ የምትወጡ»
  rationale: የሐዋርያት ሥራ አውዱ የወንጌልን መስማትና ድነትን ይመለከታል፤ ነገር ግን ጥቅሱ ያልገለጸው የድነት ሥርዓት አልተጨመረም።
- issue: የ«መላው ቤተሰብህ» ወሰን
  choice: ቤተሰቡ በአጠቃላይ ተጠቅሷል፤ እያንዳንዱ አባል ያለግል ምላሽ በራስ-ሰር ይድናል የሚል ሐሳብ አልተጨመረም።
  alternative: የቤት አባወራው እምነት ብቻ መላውን ቤት በራስ-ሰር ያድናል ብሎ መግለጽ
  rationale: ግሪኩ የቤተሰቡን ሙሉ ወሰን ይጠቅሳል፣ ግን በዚህ ጥቅስ ብቻ የእያንዳንዱን አባል ተሳትፎ ዝርዝር አይወስንም።
