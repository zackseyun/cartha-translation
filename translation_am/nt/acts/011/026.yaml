- source_word: ἐνιαυτὸν ὅλον
  choice: አንድ ዓመት ሙሉ
  rationale: የጊዜውን ሙሉነት ግልጽና የተለመደ በሆነ አማርኛ ያስተላልፋል።
- source_word: συναχθῆναι ἐν τῇ ἐκκλησίᾳ
  choice: ከቤተ ክርስቲያን ማኅበር ጋር ተሰብስበው
  rationale: ἐκκλησία እዚህ ሕንፃን ሳይሆን የአማኞችን ማኅበር ሊያመለክት ስለሚችል፣ ትርጉሙ የስብሰባውን ማኅበራዊ ገጽታ በግልጽ ያቀርባል።
- source_word: ὄχλον ἱκανόν
  choice: እጅግ ብዙ ሕዝብ
  rationale: ἱκανός የሚያመለክተውን በቁጥር ከፍተኛ የሆነ ሰው ስብስብ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: χρηματίσαι
