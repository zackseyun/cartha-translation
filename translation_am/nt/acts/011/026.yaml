  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። “ቤተ ክርስቲያን ማኅበር” የሚለው ἐκκλησίαን እንደ ሰዎች ማኅበር ግልጽ ያደርጋል፤ የሕንፃው ንባብ ግን በማስታወሻ ተጠብቋል።
