  text: καὶ εὑρὼν ⸀ἤγαγεν εἰς Ἀντιόχειαν. ἐγένετο δὲ ⸂αὐτοῖς καὶ⸃ ἐνιαυτὸν ὅλον συναχθῆναι ⸀ἐν τῇ ἐκκλησίᾳ καὶ διδάξαι ὄχλον ἱκανόν, χρηματίσαι τε ⸀πρώτως ἐν Ἀντιοχείᾳ τοὺς μαθητὰς Χριστιανούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/026.yaml
  text: And when he found him, he brought him to Antioch. And for a whole year they met together with the church and taught a considerable crowd; and it was in Antioch that the disciples were first called Christians.
translation:
  language: am
  text: እርሱንም ባገኘው ጊዜ ወደ አንጾኪያ አመጣው። እነርሱም አንድ ዓመት ሙሉ ከቤተ ክርስቲያን ጋር ተሰብስበው[a] ብዙ ሕዝብ አስተማሩ፤ በአንጾኪያም ደቀ መዛሙርቱ ለመጀመሪያ ጊዜ “ክርስቲያኖች” ተብለው ተጠሩ።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በቤተ ክርስቲያን ውስጥ ተሰብስበው።” ሐረጉ በሕንፃ ውስጥ መሰብሰብን ሳይሆን ከክርስቲያን ማኅበሩ ጋር መሰብሰብን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ግሪክኛው “ደቀ መዛሙርቱ በአንጾኪያ ለመጀመሪያ ጊዜ ክርስቲያኖች ተብለው ተጠሩ” ይላል። ይህ ስም በአንጾኪያ በሕዝብ የተሰጠ መጠሪያ ሆኖ የጀመረ ሊሆን ይችላል።
    reason: cultural_note
