- source_word: πρώτως
  choice: መጀመሪያ
  rationale: ይህ መጠሪያ ለመጀመሪያ ጊዜ በአንጾኪያ ጥቅም ላይ መዋሉን በአጭርና ግልጽ መንገድ ይገልጣል።
- source_word: Χριστιανούς
  choice: ክርስቲያኖች
  rationale: ይህ በግሪክኛ የተመሠረተ የቡድን መጠሪያ ስለሆነ፣ በአማርኛ የተለመደውና በቀጥታ የሚታወቀው “ክርስቲያኖች” ትክክለኛ ነው።
theological_decisions:
- issue: Χριστιανούς ከΧριστός ማዕረግ ጋር በተያያዘ እንዴት መተርጎም እንዳለበት
  choice: ክርስቲያኖች
  alternative: የመሲሑ ወገኖች
  rationale: Χριστιανούς እዚህ የΧριστός ማዕረግን ብቻ የሚገልጽ አይደለም፤ የተለመደ የቡድን መጠሪያ ነው። “ክርስቲያኖች” የታሪካዊውን ስያሜ በተፈጥሯዊና ከአንድ ወገን የትምህርት አቋም ነጻ በሆነ መንገድ ያስተላልፋል።
- issue: ἐν τῇ ἐκκλησίᾳ ሕንፃን ወይስ የአማኞችን ማኅበር ማመልከቱ
  choice: ከቤተ ክርስቲያን ማኅበር ጋር
  alternative: በቤተ ክርስቲያን ውስጥ
  rationale: በሐዋርያት ሥራ ἐκκλησία በተለምዶ የአማኞችን ማኅበር ያመለክታል። ይህ አቀራረብ ጽሑፉ የስብሰባ ሕንፃ እንዳለ ከሚያስመስል የተሳሳተ ግንዛቤ ይጠብቃል፣ ነገር ግን የግሪክኛውን አማራጭ በማስታወሻ ያቆያል።
