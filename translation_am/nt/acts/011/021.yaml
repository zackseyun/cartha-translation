  text: And the hand of the Lord was with them[b][a], and a great number who believed turned to the Lord.
translation:
  language: am
  text: የጌታም እጅ ከእነርሱ ጋር ነበረች[a]፤ እጅግ ብዙ ሰዎችም አምነው[b] ወደ ጌታ ዞሩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የጌታ ኃይል።” “የጌታ እጅ” የሚለው አገላለጽ የጌታን ንቁ ኃይል ወይም ሞገስ የሚያመለክት የመጽሐፍ ቅዱስ ዘይቤ ነው።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ያመኑ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: χεὶρ κυρίου
  choice: የጌታ እጅ
  rationale: ይህ የጌታን ንቁ ኃይል፣ እርዳታ ወይም ሞገስ የሚገልጽ የመጽሐፍ ቅዱስ ዘይቤ ነው። ዘይቤውን በቀጥታ መጠበቅ ከሌሎች ቅዱሳት ጽሑፎች ጋር ያለውን ትስስር ይጠብቃል።
- source_word: κύριος
  choice: ጌታ
  rationale: በሁለቱም ቦታዎች የግሪኩን መደበኛ ማዕረግ ይጠብቃል፤ ጽሑፉ ያልገለጸውን ስም አይጨምርም።
- source_word: μετ’ αὐτῶν
  choice: ከእነርሱ ጋር
  rationale: μετά ከጄኒቲቭ ጋር በተፈጥሮ ‘ከ…ጋር’ ማለት ሲሆን፣ ጌታ ከአገልጋዮቹ ጋር መሆኑንና መደገፉን ያመለክታል።
- source_word: πολύς τε ἀριθμός
  choice: እጅግ ብዙ ሰዎች
  rationale: የሰዎችን ብዛት በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጻል፤ ‘ብዙ ቁጥር’ የሚል ቃል በቃል አቀራረብን ያስወግዳል።
- source_word: ὁ πιστεύσας
  choice: አምነው
  rationale: የአኦሪስት ክፍለ ግስን ከዋናው ግስ ጋር በተፈጥሯዊ አማርኛ ያገናኛል፤ እምነትንና ወደ ጌታ መመለስን የተገናኙ ድርጊቶች አድርጎ ያቀርባል።
- source_word: ἐπέστρεψεν ἐπὶ τὸν κύριον
  choice: ወደ ጌታ ተመለሱ
  rationale: ወደ ጌታ የመዞርን ወይም የመለወጥን ሐሳብ በተለመደ አማርኛ ይገልጻል፤ ‘በንስሐ’ የሚል በግሪኩ ያልተጠቀሰ ማብራሪያ አይጨምርም።
theological_decisions:
- issue: በዚህ አውድ ‘ጌታ’ የሚለው ማንን እንደሚያመለክት
  choice: በሁለቱም ቦታዎች κύριοςን ‘ጌታ’ ብሎ መተርጎም፣ በጽሑፉ ውስጥ ‘ኢየሱስ’ ወይም ‘እግዚአብሔር’ ብሎ አለመግለጽ
  alternative: ‘ጌታ’ን በቀጥታ ‘ኢየሱስ’ ወይም ‘እግዚአብሔር’ ብሎ መግለጽ
  rationale: በሐዋርያት ሥራ አውድ κύριος ብዙ ጊዜ ኢየሱስን ሊያመለክት ቢችልም፣ ይህ ጥቅስ ራሱ ‘ጌታ’ ብቻ ይላል። ይህን ማዕረግ መጠበቅ የጽሑፉን ክፍትነት አያጠብም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ዘይቤ ‘የጌታ እጅ’ ተጠብቋል፤ የነጠላው የግሪክ ግስ ከሰዎች ብዛት ጋር በአማርኛ በተፈጥሮ ብዙ ቁጥር ሆኗል።
