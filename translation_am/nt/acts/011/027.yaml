lexical_decisions:
- source_word: Ἐν ταύταις δὲ ταῖς ἡμέραις
  choice: በእነዚያም ቀናት
  rationale: የጊዜውን ማዕቀፍ በቅርብ ይጠብቃል፤ በ«-ም» የተገለጸው ቀላል አያያዥነት δέን ያለ ከልክ ማጉላት ያሳያል።
- source_word: κατῆλθον
  choice: ወረዱ
  rationale: ግሱ ከፍ ካለ ቦታ ወደ ታች የሚደረግን ጉዞ ያመለክታል። «ወረዱ» ይህን አቅጣጫዊ ሐሳብ ይጠብቃል፤ በአማርኛም የተናጋሪውን የመምጣት/የመሄድ እይታ በግድ አይወስንም።
- source_word: ἀπὸ Ἱεροσολύμων
  choice: ከኢየሩሳሌም
  rationale: ἀπό የመነሻ ቦታን ያመለክታል፤ የቦታው ስም በመደበኛው የአማርኛ አጻጻፍ ተሰጥቷል።
- source_word: προφῆται
  choice: ነቢያት
  rationale: የግሪኩን መደበኛ ቃል በቀጥታ የሚያስተላልፍ ሲሆን የአገልግሎታቸውን ትክክለኛ ወሰን በትርጉም አይጨምርም።
- source_word: εἰς Ἀντιόχειαν
  choice: ወደ አንጾኪያ
  rationale: εἰς ወደ መድረሻ ቦታ የሚደረግን እንቅስቃሴ ያሳያል፤ «ወደ» በአማርኛ ተፈጥሯዊ ነው።
theological_decisions:
- issue: በኢየሩሳሌምና በአንጾኪያ የነበሩት «ነቢያት» የአገልግሎት ባሕርይ
  choice: προφῆταιን «ነቢያት» ብሎ በሰፊው ትርጉሙ ማቆየት
  alternative: «ትንቢታዊ አስተማሪዎች» ወይም «በመንፈስ የተነሡ መልእክተኞች»
  rationale: ጥቅሱ የእነዚህን ነቢያት ሚና በዝርዝር አይወስንም። «ነቢያት» ማለት የጽሑፉን ክፍትነት ይጠብቃል፤ የአንድን ወገን ልዩ አስተምህሮም አያስገባም።
