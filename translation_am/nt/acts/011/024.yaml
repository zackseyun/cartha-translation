  text: እርሱ መልካም ሰው ነበርና፤ በመንፈስ ቅዱስና በእምነት[a] የተሞላ ነበር። ብዙ ሕዝብም ወደ ጌታ ተጨመረ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በመንፈስ ቅዱስና በታማኝነት።” የግሪኩ πίστις የሚለው ቃል “ታማኝነት” ወይም “መታመን” ማለትም ሊሆን ይችላል፤ ዋናው ጽሑፍ መደበኛውን “እምነት” የሚለውን ትርጉም ተከትሏል።
