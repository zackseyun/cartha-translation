- source_word: πίστεως
  choice: በእምነት
  rationale: የπίστιςን መደበኛ ትርጉም ይጠብቃል፤ ‘ታማኝነት’ የሚለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: προσετέθη
  choice: ተጨመረ
