  rationale: ቀደም ሲል ስለ በርናባስ የተነገረውን የሚያብራራውን ምክንያታዊ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀνὴρ ἀγαθὸς
