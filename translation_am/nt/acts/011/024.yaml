  choice: ብዙ ሕዝብ
  rationale: ቁጥሩ ከፍተኛ መሆኑን በዘመናዊና ግልጽ አማርኛ ያሳያል።
- source_word: τῷ κυρίῳ
  choice: ወደ ጌታ
  rationale: ግሪኩ በግልጽ የሚጠቅሰውን የመጨመሩን መድረሻ ይጠብቃል፤ ‘ወደ ቤተ ክርስቲያን’ ብሎ አይተካውም።
theological_decisions:
- issue: የπνεύματος ἁγίου ትርጉም
