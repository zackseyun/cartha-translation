  text: ἦσαν δέ τινες ἐξ αὐτῶν ἄνδρες Κύπριοι καὶ Κυρηναῖοι, οἵτινες ⸀ἐλθόντες εἰς Ἀντιόχειαν ἐλάλουν ⸀καὶ πρὸς τοὺς ⸀Ἑλληνιστάς, εὐαγγελιζόμενοι τὸν κύριον Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/020.yaml
  text: But some of them were men from Cyprus and Cyrene[a], who, when they came to Antioch, were also speaking to the Hellenists, proclaiming the good news about the Lord Jesus.
translation:
  language: am
  text: ከእነርሱ መካከል ግን ከቆጵሮስና ከቀሬና የመጡ አንዳንድ ወንዶች ነበሩ። እነርሱም ወደ አንጾኪያ ሲመጡ፣ ለግሪክኛ ተናጋሪ አይሁድ[a] ደግሞ ስለ ጌታ ኢየሱስ የምሥራቹን እያወጁ ይናገሩ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች “ግሪክኛ ተናጋሪ አይሁድ” በሚለው ፋንታ “ግሪኮች” ይላሉ። ይህ ንባብ የመጀመሪያው ከሆነ፣ እነርሱ ለግሪክኛ ተናጋሪ አይሁድ ብቻ ሳይሆን ለአሕዛብም ይናገሩ ነበር ማለት ነው።
    reason: textual_variant
lexical_decisions:
- source_word: τινες
  choice: አንዳንድ
  rationale: ቀደም ሲል ከተጠቀሰው ቡድን ውስጥ ያልተወሰነ ክፍልን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል።
- source_word: ἄνδρες
  choice: ወንዶች
