- source_word: Κύπριοι καὶ Κυρηναῖοι
  choice: የቆጵሮስና የቀሬና ሰዎች
  rationale: የመጡበትን አገርና ከተማ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐλθόντες εἰς Ἀντιόχειαν
  choice: ወደ አንጾኪያ በመጡ ጊዜ
  rationale: የአዎሪስት አሳታፊውን ጊዜያዊ ግንኙነት ግልጽ እና ተፈጥሯዊ አድርጎ ያቀርባል።
- source_word: ἐλάλουν
  choice: ይናገሩ ነበር
  rationale: የኢምፐርፌክት ጊዜውን ቀጣይ ወይም ተደጋጋሚ ድርጊት ያስተላልፋል።
- source_word: καὶ πρὸς
  choice: ለ…ም
  rationale: καί ከቀድሞው ተደራሲ በተጨማሪ ሌላ ቡድንን የማካተት ኃይል እንዳለው በአማርኛው -ም ተገልጿል።
- source_word: τοὺς Ἑλληνιστάς
  choice: ግሪክኛ ተናጋሪ አይሁድ
  rationale: የSBLGNT ንባብ Ἑλληνιστάς በዚህ አውድ ግሪክኛ የሚናገሩ አይሁድን ያመለክታል፤ ትርጉሙን ከተውሶ ቃል ይልቅ ለዘመናዊ አንባቢ ግልጽ በሆነ አገላለጽ ተሰጥቷል።
- source_word: εὐαγγελιζόμενοι
  choice: የምሥራቹን እያወጁ
  rationale: ቃሉ የምሥራችን በግልጽ የማወጅ ድርጊት መሆኑን በተደራሽ አማርኛ ያስተላልፋል።
- source_word: τὸν κύριον Ἰησοῦν
  choice: ስለ ጌታ ኢየሱስ
  rationale: ኢየሱስ የምሥራቹ ይዘትና ማዕከል መሆኑን ያሳያል፤ κύριος የክርስቶስ ማዕረግ ሆኖ ‘ጌታ’ ተብሎ ተተርጉሟል።
theological_decisions:
- issue: የτοὺς Ἑλληνιστάς ማንነትና የἝλληνας የጽሑፍ ልዩነት
  choice: ዋናው ጽሑፍ የSBLGNTን ‘ግሪክኛ ተናጋሪ አይሁድ’ ንባብ ይከተላል፤ ‘ግሪኮች’ የሚለውን ንባብ በግርጌ ማስታወሻ ያስቀምጣል።
  alternative: ግሪኮች፣ ማለትም አሕዛብ
  rationale: ልዩነቱ በትረካው ውስጥ ወንጌል ወደ አሕዛብ መስፋፋቱን የሚያሳይበትን ነጥብ ሊነካ ይችላል። የቀረበው የምንጭ እትም SBLGNT ስለሆነ ዋናው ጽሑፍ ያንን ይከተላል፤ ጉልህ አማራጩን ግን አይደብቅም።
