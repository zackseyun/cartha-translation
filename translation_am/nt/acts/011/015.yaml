  yaml_path: translation/nt/acts/011/015.yaml
  text: And as I began to speak[c][b][a], the Holy Spirit fell on them just as it had on us at the beginning.
translation:
  language: am
  text: እኔም መናገር ስጀምር፣ በመጀመሪያ በእኛ ላይ እንደወረደው ሁሉ መንፈስ ቅዱስ በእነርሱም ላይ ወረደ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «በመጀመሪያ» የሚለው፣ መንፈስ ቅዱስ በደቀ መዛሙርቱ ላይ መፍሰስ የጀመረበትን፣ ማለትም ጰንጠቆስጤን፣ የሚያመለክት ይመስላል።
    reason: cross_reference
lexical_decisions:
- source_word: ἐν δὲ τῷ ἄρξασθαί με λαλεῖν
  choice: እኔም መናገር ስጀምር
  rationale: ἐν + አንቀጽ ያለው የግስ ስም የአንድ ጊዜነትን ይገልጣል፤ ይህ አተረጓጎም ጴጥሮስ መናገር ሲጀምር ክስተቱ መፈጸሙን በተፈጥሯዊ አማርኛ ያሳያል። δέ ከትረካው ጋር በተስማሚው «-ም» ተወክሏል።
- source_word: ἐπέπεσεν
  choice: ወረደ
  rationale: ቃሉ መንፈስ በሰዎች ላይ የመምጣቱን ኃይለኛ ምስል ይይዛል፤ «በ...ላይ ወረደ» ቀጥተኛ፣ የተለመደና ያልተረጎመ አገላለጽ ነው።
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: መንፈስ ቅዱስ
  rationale: በዘመናዊ መደበኛ አማርኛ የተለመደውና ትክክለኛው ስያሜ ነው።
- source_word: ὥσπερ καὶ ἐφ’ ἡμᾶς
  choice: በእኛ ላይ እንደወረደው ሁሉ ... በእነርሱም ላይ
  rationale: ὥσπερ የሚያሳየውን ትክክለኛ ንጽጽር «እንደ... ሁሉ» ያስቀምጣል፤ καί የሚጨምረው ትይዩነት ደግሞ «በእነርሱም» ውስጥ ተገልጧል። በግሪኩ የተተወው ግስ ለተፈጥሯዊ አማርኛ ተደግሟል።
- source_word: ἐν ἀρχῇ
  choice: በመጀመሪያ
  rationale: የጊዜ መጀመሪያን ይገልጣል፤ በአውዱ ጴጥሮስና ከእርሱ ጋር ያሉት መንፈስን በመጀመሪያ የተቀበሉበትን ጊዜ ሊያመለክት ቢችልም፣ ትርጉሙ ያንን በስም አይወስንም።
theological_decisions:
- issue: የ«ἐν ἀρχῇ» ማጣቀሻ
  choice: «በመጀመሪያ» በሚል ሰፊ የጊዜ አገላለጽ ማቆየት
  alternative: «በጰንጠቆስጤ ቀን» ብሎ በግልጽ መወሰን ወይም «መጀመሪያ ላይ» ማለት
  rationale: የቅርብ አውዱ በሐዋርያትና በሌሎች ደቀ መዛሙርት ላይ የሆነውን የመንፈስ መውረድ፣ በተለይም ጰንጠቆስጤን፣ የሚያመለክት ይመስላል። ሆኖም ግሪኩ ቦታውን በስም ስለማይጠራ፣ ትርጉሙም ያለውን ስፋት ጠብቋል።
- issue: የመንፈስ መምጣት ምስላዊ አገላለጽ
  choice: «በ...ላይ ወረደ»
  alternative: «ወደ እነርሱ መጣ» ወይም «አደረባቸው»
  rationale: «ወረደ» የἐπιπίπτωን ምስላዊ ኃይል ይጠብቃል፣ የክስተቱን ተፈጥሮም ከጽሑፉ በላይ በሥነ መለኮታዊ ቃል አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ የንጽጽር አወቃቀር ለአማርኛ ተፈጥሯዊነት በቅደም ተከተል ተስተካክሏል፣ ነገር ግን ትርጉማዊ ትይዩነቱና የጊዜ ስፋቱ ተጠብቀዋል።
