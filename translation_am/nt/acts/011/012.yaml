id: ACT.11.12
reference: Acts 11:12
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸂τὸ πνεῦμά μοι⸃ συνελθεῖν αὐτοῖς μηδὲν ⸀διακρίναντα. ἦλθον δὲ σὺν ἐμοὶ καὶ οἱ ἓξ ἀδελφοὶ οὗτοι, καὶ εἰσήλθομεν εἰς τὸν οἶκον τοῦ ἀνδρός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/012.yaml
  text: And the Spirit told me to go with them[a], making no distinction. These six brothers also came with me, and we entered the man's house.
translation:
  language: am
  text: መንፈስም ምንም ልዩነት ሳላደርግ ከእነርሱ ጋር እንድሄድ ነገረኝ።[a] እነዚህ ስድስት ወንድሞችም ከእኔ ጋር መጡ፤ ወደ ሰውየውም ቤት ገባን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ሳላመነታ» ወይም «ሳልጠራጠር»። የግሪኩ ተሳቢ ግስ ልዩነት አለማድረግን ወይም አለማመንታትን ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμά
  choice: መንፈስ
  rationale: በሐዋርያት ሥራ ውስጥ መለኮታዊ መመሪያ በሚሰጥበት አውድ ይህ ቃል የሚያመለክተው መንፈስ ቅዱስን ነው፤ ሆኖም ግሪኩ በግልጽ «ቅዱስ» ስለማይል «መንፈስ» ተብሎ ቀርቧል።
- source_word: εἶπεν ... μοι
  choice: ነገረኝ
  rationale: በዚህ አውድ ቃሉ ትእዛዝን የሚያስተላልፍ ስለሆነ «ነገረኝ» ተፈጥሯዊና ግልጽ ነው።
- source_word: συνελθεῖν αὐτοῖς
  choice: ከእነርሱ ጋር እንድሄድ
  rationale: የግሪኩ ግስ በዚህ ስፍራ ሰዎቹን አብሮ መሄድን ያመለክታል።
- source_word: μηδὲν διακρίναντα
  choice: ምንም ልዩነት ሳላደርግ
  rationale: የጴጥሮስ ወደ አሕዛብ ቤት መግባት በተነሣበት አውድ፣ ሰዎችን ለይቶ አለማየት የሚለው ትርጉም ጠንካራ ነው። የማመንታትና የመጠራጠር አማራጮች በማስታወሻ ተጠብቀዋል።
- source_word: οἱ ἓξ ἀδελφοὶ οὗτοι
  choice: እነዚህ ስድስት ወንድሞች
  rationale: οὗτοι የሚለውን «እነዚህ» ይጠብቃል፤ በአውዱም ስድስቱ ወንድ ባልደረቦች ስለሆኑ «ወንድሞች» ትክክለኛ ነው።
- source_word: εἰσήλθομεν
  choice: ገባን
  rationale: ቀጥተኛ፣ ዘመናዊና ተፈጥሯዊ የአማርኛ አተረጓጎም ነው።
- source_word: τὸν οἶκον τοῦ ἀνδρός
  choice: ወደ ሰውየው ቤት
  rationale: ግሪኩ የተጠቀሰውን ወንድ ሰው በግልጽ ስም ያቀርባል፤ «ሰውየው» ይህን በተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: የμηδὲν διακρίναντα ትርጉም በጴጥሮስ ዘገባ
  choice: ምንም ልዩነት ሳላደርግ
  alternative: ሳላመነታ ወይም ሳልጠራጠር
  rationale: የቅርብ አውዱ ጴጥሮስ የአይሁድንና የአሕዛብን ድንበር አልፎ ስለመሄዱ የሚሰጠውን መልስ ይመለከታል፤ ስለዚህ «ልዩነት አለማድረግ» ዋናው ንባብ ሆኗል። ግሪኩ ማመንታትን ወይም መጠራጠርንም ሊያመለክት ስለሚችል አሻሚነቱ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የትረካው ፍሰት በ«-ም» አያያዦችና በአጭር ዐረፍተ ነገሮች ተጠብቋል።
