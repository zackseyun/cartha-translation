lexical_decisions:
- source_word: ὃ καὶ ἐποίησαν
  choice: እንዳሰቡትም አደረጉ
  rationale: አንጻራዊው ተውላጠ ስም በቀደመው ቁጥር የተገለጸውን የእርዳታ ውሳኔ ወደኋላ ያመለክታል፤ ይህ አተረጓጎም በአማርኛ ተፈጥሯዊ ሆኖ አጭሩን የግሪክ አገላለጽ ይጠብቃል።
- source_word: ἀποστείλαντες
  choice: ላኩ
  rationale: የአዎሪስት አሳታፊው ቀድሞ የታሰበው ነገር በምን መንገድ እንደተፈጸመ ይገልጣል፤ በአማርኛ የተቀናጀ ግስ መጠቀም የተፈጥሮ አነጋገር ነው።
- source_word: πρὸς τοὺς πρεσβυτέρους
  choice: ለሽማግሌዎች
  rationale: πρεσβύτεροι በሐዋርያት ሥራ የማኅበሩን እውቅና ያገኙ መሪዎችን ያመለክታል፤ «ሽማግሌዎች» ግልጽና የተለመደ ትርጉም ነው።
- source_word: διὰ χειρὸς
  choice: በ…እጅ
  rationale: የግሪኩን ተጨባጭ ፈሊጥ ይጠብቃል፤ በዚህ አውድ በተወካዮቹ አማካይነት መላኩን ያመለክታል።
- source_word: Βαρναβᾶ καὶ Σαύλου
  choice: በርናባስና ሳውል
  rationale: የግል ስሞቹ በመደበኛው የአማርኛ የመጽሐፍ ቅዱስ አጻጻፍ ተጽፈዋል።
- source_word: implicit object from context
  choice: እርዳታውን
  rationale: ግሪኩ ተሳቢውን በግልጽ ባይደግምም ከቀደመው ቁጥር የእርዳታ መዋጮው መሆኑ ይታወቃል፤ በአማርኛ ግልጽነት ሲባል «እርዳታውን» ተጨምሯል።
