  text: Ἐγὼ ἤμην ἐν πόλει Ἰόππῃ προσευχόμενος καὶ εἶδον ἐν ἐκστάσει ὅραμα, καταβαῖνον σκεῦός τι ὡς ὀθόνην μεγάλην τέσσαρσιν ἀρχαῖς καθιεμένην ἐκ τοῦ οὐρανοῦ, καὶ ἦλθεν ἄχρι ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/005.yaml
  text: 'I was in the city of Joppa praying[a], and in a trance I saw a vision: something like a large sheet was coming down, being lowered from heaven by four corners[b], and it came to me.'
translation:
  language: am
  text: “እኔ በኢዮጴ ከተማ እየጸለይኩ ነበር፤ በልዩ ራእያዊ ሁኔታ ውስጥም ራእይ አየሁ፤ እንደ ትልቅ አንሶላ ያለ አንድ ነገር[a] በአራቱ ጫፎች ከሰማይ እየተወረደ መጣ፤ እስከ እኔም ደረሰ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አንድ ዕቃ” ወይም “አንድ መያዣ”፤ የግሪኩ ቃል ከትልቅ አንሶላ ጋር ከማነጻጸሩ በፊት ነገርን ወይም መያዣን በሰፊው ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ ἤμην ἐν πόλει Ἰόππῃ προσευχόμενος
  choice: እኔ በኢዮጴ ከተማ እየጸለይኩ ነበር
  rationale: ግልጽ የሆነውን Ἐγώ እና πόλει ይጠብቃል፤ የአሁን ጊዜ አካፋዩንም በተፈጥሯዊው የአማርኛ ቀጣይ ድርጊት አገላለጽ ያቀርባል።
- source_word: ἐν ἐκστάσει ὅραμα
  choice: ራእይም በሚታይበት ልዩ ሁኔታ ሆኜ ሳለሁ ራእይ
  rationale: ἐκστάσειን ከὅραμα ሳያዋህድ የራእይ ልምምዱን ልዩ ሁኔታ በግልጽ ያሳያል፤ ‘ድንጋጤ’ ወይም ስሜታዊ ‘ሐሴት’ የሚል ያልተፈለገ ፍቺ አያስገባም።
- source_word: σκεῦός τι
  choice: አንድ ነገር
  rationale: σκεῦος ዕቃን፣ መያዣን ወይም ነገርን ሊያመለክት የሚችል ሰፊ ቃል ነው፤ ያልተወሰነውን τι በመጠበቅ ከሚከተለው ንጽጽር በፊት ቅርጹን አይወስንም።
- source_word: ὡς ὀθόνην μεγάλην
  choice: እንደ ትልቅ አንሶላ ያለ
  rationale: የንጽጽሩን ኃይል ይጠብቃል፤ አንሶላ በዘመናዊ አማርኛ የትልቅ ጨርቅን ምስል በግልጽ ያስተላልፋል።
- source_word: τέσσαρσιν ἀρχαῖς καθιεμένην ἐκ τοῦ οὐρανοῦ
  choice: በአራቱ ጫፎች ከሰማይ እየተወረደ
  rationale: ἀρχαῖςን እንደ ጫፎች እና የκαθίημιን ተገብሮአዊ ትርጉም እንደ ‘እየተወረደ’ ያቀርባል፤ ከሰማይ የሚለውንም ራእያዊ አቅጣጫ ይጠብቃል።
- source_word: ἦλθεν ἄχρι ἐμοῦ
  choice: እስከ እኔም ደረሰ
  rationale: ἄχρι የሚያመለክተውን እስከ ጴጥሮስ ድረስ መምጣት በቀጥታና ተፈጥሯዊ አማርኛ ይገልጻል።
theological_decisions:
- issue: የἐκστάσει እና ὅραμα ራእያዊ ቃላት አተረጓጎም
  choice: ራእይም በሚታይበት ልዩ ሁኔታ ሆኜ ሳለሁ ራእይ አየሁ
  alternative: በሐሴት ሆኜ ራእይ አየሁ፤ በድንጋጤ ሆኜ ራእይ አየሁ
  rationale: ሁለቱን የግሪክ አገላለጾች ለይቶ ይጠብቃል፤ ልምምዱን ከመጠን በላይ ምሥጢራዊ ወይም ስሜታዊ አያደርገውም።
- issue: σκεῦος የዕቃ ወይም የመያዣ ትርጉም ሊኖረው መቻሉ
  choice: አንድ ነገር[a]
  alternative: አንድ ዕቃ፤ አንድ መያዣ
  rationale: ቃሉ ሰፊ ስለሆነ ትርጉሙ ከሚፈቅደው በላይ አይወሰንም፤ አማራጩ በግርጌ ማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። የግሪኩ ረጅም ዓረፍተ ነገር ፍሰት በሰሚኮሎን ተደራጅቷል፤ የራእዩ ሁኔታና የታየው ራእይ ተለይተው ቀርበዋል።
