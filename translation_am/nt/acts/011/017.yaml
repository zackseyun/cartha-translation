id: ACT.11.17
reference: Acts 11:17
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἰ οὖν τὴν ἴσην δωρεὰν ἔδωκεν αὐτοῖς ὁ θεὸς ὡς καὶ ἡμῖν πιστεύσασιν ἐπὶ τὸν κύριον Ἰησοῦν Χριστόν, ⸀ἐγὼ τίς ἤμην δυνατὸς κωλῦσαι τὸν θεόν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/017.yaml
  text: If then God gave to them the same gift as also to us who believed in the Lord Jesus the Messiah[b][a], who was I that I could hinder God?
translation:
  language: am
  text: እንግዲህ እግዚአብሔር በጌታ ኢየሱስ መሲሕ ላመንን ለእኛም እንደ ሰጠን ሁሉ ለእነርሱ ያንኑ ስጦታ ከሰጣቸው፣ እኔ እግዚአብሔርን ልከለክል የምችል ማን ነበርኩ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴσην δωρεάν
  choice: ያንኑ ስጦታ
  rationale: በዐውዱ የተመሳሳይነትንና የእኩልነትን ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: πιστεύσασιν ἐπὶ τὸν κύριον Ἰησοῦν Χριστόν
  choice: በጌታ በኢየሱስ መሲሕ ላመንን
  rationale: የድርጊት አካሉ ከἡμῖν ጋር ያለውን የገላጭ ግንኙነት ይጠብቃል፤ ἐπὶ የእምነቱን አቅጣጫ በ‘በ... ማመን’ ያቀርባል።
- source_word: κύριον
  choice: ጌታ
  rationale: እዚህ የኢየሱስ መጠሪያ ማዕረግ ነው።
- source_word: Χριστόν
  choice: መሲሕ
  rationale: የቃሉን ንቁ የማዕረግ ትርጉም ይጠብቃል።
- source_word: ἐγὼ τίς ἤμην δυνατὸς
  choice: ልከለክል የምችል እኔ ማን ነበርኩ?
  rationale: የግሪኩን አጽንዖታዊ ‘እኔ’ እና ራስን ዝቅ የማድረግ ጥያቄ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: κωλῦσαι τὸν θεόν
  choice: እግዚአብሔርን ልከለክል
  rationale: ቀጥተኛውንና አስገራሚውን አገላለጽ ይጠብቃል፤ አሕዛብን መከልከል ራሱን እግዚአብሔርን እንደመከልከል ይቆጠራል።
theological_decisions:
- issue: Χριστόν እንደ ማዕረግ ወይም እንደ ስም መተርጎም
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: በዚህ የእምነት አገላለጽ ውስጥ የ‘ተቀባው’ ማዕረጋዊ ኃይል ንቁ ስለሆነ መሲሕ ተመርጧል።
- issue: πιστεύσασιν ከἡμῖν ጋር ያለው ግንኙነት
  choice: ገላጭ፦ ‘ላመንን ለእኛ’
  alternative: ጊዜያዊ፦ ‘ባመንን ጊዜ’
  rationale: ይህ የግሪኩን የድርጊት አካል ከተውላጠ ስሙ ጋር ያለውን ሰዋሰዋዊ ትስስር በቅርብ ይጠብቃል፣ ስለ ስጦታው ትክክለኛ ጊዜም ከጽሑፉ በላይ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። ‘እንግዲህ’ የοὖνን መደምደሚያ ኃይል፣ ‘ያንኑ ስጦታ’ ደግሞ የἴσην δωρεάνን ንጽጽር ያሳያሉ።
