  text: ወደ ውስጧ ትኩር ብዬ ተመለከትኩ፤ በጥንቃቄም ስመረምራት፣ የምድር አራት እግር እንስሳትን፣ አውሬዎችን፣ የሚሳቡ ፍጥረታትን[a] እና የሰማይ ወፎችን አየሁ።
