- source_word: τὰ ἑρπετά
  choice: ተሳቢ ፍጥረታትን
  rationale: ቃሉን በ‘ተሳቢ እንስሳት’ ብቻ ከማጥበብ ይልቅ የሚሳቡና የሚንቀሳቀሱ ፍጥረታትን የሚያካትተውን ሰፊ የመጽሐፍ ቅዱስ ምድብ ይጠብቃል።
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: የሰማይ ወፎችን
  rationale: በዚህ የፍጥረታት ዝርዝር ውስጥ የሚበሩትን ፍጥረታት በተፈጥሯዊ አማርኛ ይገልጣል፤ ‘ሰማይ’ም እዚህ የአየርን ክልል ያመለክታል።
