  rationale: በግሪኩ ቅርብ ያለው ግልጽ ቀዳሚ ስም ቤተ ክርስቲያኗ ነው። ጽሑፉ ሐዋርያትን ወይም ሽማግሌዎችን በተለይ ስለማይጠቅስ፣ ትርጉሙ ያልተገለጸ የአመራር አወቃቀር አያስገባም።
