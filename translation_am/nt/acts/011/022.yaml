- source_word: ὁ λόγος
  choice: ወሬ
  rationale: በዚህ የትረካ አውድ λόγος ስለ አንጾኪያ ሰዎችና ሁኔታ የተደረሰ ወሬ ወይም ዘገባ ማለት ነው፤ ‘ቃል’ ማለት አውዱን ሊያዛባ ይችላል።
- source_word: περὶ αὐτῶν
  choice: ስለ እነርሱ
  rationale: የብዙ ቁጥር ተውላጠ ስሙን በቀጥታ ይጠብቃል፤ ሰዎቹን እንደሚያመለክት ያሳያል እንጂ ማንነታቸውን ከጽሑፉ በላይ አይወስንም።
