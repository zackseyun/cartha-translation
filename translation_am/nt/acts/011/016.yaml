id: ACT.11.16
reference: Acts 11:16
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐμνήσθην δὲ τοῦ ῥήματος ⸀τοῦ κυρίου ὡς ἔλεγεν· Ἰωάννης μὲν ἐβάπτισεν ὕδατι, ὑμεῖς δὲ βαπτισθήσεσθε ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/016.yaml
  text: Then I remembered the word of the Lord[a], how he said, ‘John baptized with water, but you will be baptized in the Holy Spirit.’
translation:
  language: am
  text: ከዚያም ጌታ የተናገረውን ቃል አስታወስኩ፤ እንዲህ ብሎ ነበር፦ “ዮሐንስ በውሃ አጠመቀ፤ እናንተ ግን በመንፈስ ቅዱስ[a] ትጠመቃላችሁ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በመንፈስ ቅዱስ ውስጥ” ወይም “በመንፈስ ቅዱስ አማካይነት” ተብሎም ሊገባ ይችላል፤ የግሪኩ መስተዋድድ ስፍራዊ ወይም መሣሪያዊ ትርጉም ሊኖረው ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμνήσθην
  choice: አስታወስኩ
  rationale: የግሪኩ የመካከለኛ/ተደራጊ ቅርጽ በዚህ አገባብ ንቁ ትርጉም አለው፤ ‘አስታወስኩ’ በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: δὲ
  choice: ከዚያም
  rationale: እዚህ δέ ጠንካራ ተቃርኖን ሳይሆን የትረካውን ቀጣይ እርምጃ ያመለክታል።
- source_word: τοῦ ῥήματος τοῦ κυρίου
  choice: ጌታ የተናገረውን ቃል
  rationale: ῥῆμα የተነገረ ቃልን ያመለክታል፤ የአማርኛው አገላለጽ የባለቤትነት ግንኙነቱንና ቀጥሎ ያለውን ጥቅስ በተፈጥሯዊ ሁኔታ ያገናኛል።
- source_word: ὡς ἔλεγεν
  choice: እንዲህ ብሎ ነበር
  rationale: ኢምፐርፌክት ግሱን ከአውዱ ውጭ የተደጋጋሚ ንግግር እንዳያደርገው፣ የቀድሞውን ንግግር በተፈጥሯዊ አማርኛ ያስተዋውቃል።
- source_word: Ἰωάννης μὲν ἐβάπτισεν ὕδατι
  choice: ዮሐንስ በውሃ አጠመቀ
  rationale: μὲν ... δὲ ያለው ንጽጽር በ‘ግን’ ተገልጿል፤ የውሃው ዳቲቭ መሣሪያን በሚያመለክተው ‘በውሃ’ ተተርጉሟል።
- source_word: ὑμεῖς δὲ βαπτισθήσεσθε
  choice: እናንተ ግን ... ትጠመቃላችሁ
  rationale: ግልጽ የሆነው ὑμεῖς ንጽጽሩን ስለሚያጠናክር ‘እናንተ’ ተጠብቋል፤ የወደፊት ተደራጊውም በአማርኛው የጥምቀት ግስ ተገልጿል።
- source_word: ἐν πνεύματι ἁγίῳ
  choice: በመንፈስ ቅዱስ
  rationale: የአማርኛው ‘በ’ ስፍራዊና መሣሪያዊ ግንኙነትን ሊሸከም ስለሚችል የግሪኩን ἐν አሻሚነት ሳያስወግድ በተፈጥሯዊ ሁኔታ ያቀርባል።
theological_decisions:
- issue: የκύριος አተረጓጎም
  choice: ጌታ
  alternative: መምህር / ባለሥልጣን
  rationale: በዚህ አውድ ቃሉ ኢየሱስንና ሥልጣናዊ ንግግሩን ያመለክታል፤ ‘ጌታ’ የቃሉን መደበኛና ሥነ መለኮታዊ ክብደት ይጠብቃል።
- issue: በἐν πνεύματι ἁγίῳ ውስጥ ያለው የἐν ትርጉም
  choice: በመንፈስ ቅዱስ
  alternative: በመንፈስ ቅዱስ ውስጥ / መንፈስ ቅዱስን በመጠቀም
  rationale: ‘በ’ በአማርኛ ስፍራንም ሆነ መሣሪያን ሊያመለክት ይችላል፤ ስለዚህ ምንባቡ ያለውን ሥነ መለኮታዊ ውጥረት በአንድ ወገን አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ባህላዊው ‘አጠመቀ/ትጠመቃላችሁ’ የሐዋርያት ሥራ አውድን በትክክል ይጠብቃል።
