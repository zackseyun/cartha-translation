lexical_decisions:
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: የትረካውን አዲስና ጉልህ ክስተት ትኩረት ሰጥቶ የሚያቀርብ የንግግር ምልክት ስለሆነ፣ በአማርኛም የተከበረና ግልጽ የሆነው «እነሆ» ተመርጧል።
- source_word: ἐξαυτῆς
  choice: ወዲያውኑ
  rationale: ድርጊቱ ሳይዘገይ በዚያው ጊዜ መፈጸሙን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: τρεῖς ἄνδρες
  choice: ሦስት ሰዎች
  rationale: በዚህ የትረካ አውድ «ሰዎች» ተፈጥሯዊ ነው፤ ቁጥሩንና የሰው ማመልከቻውን በቀጥታ ያስተላልፋል።
- source_word: ἐπέστησαν ἐπὶ τὴν οἰκίαν
  choice: ወደ...ቤት መጡ
  rationale: ግሱ በዚህ አውድ በቦታው መድረሳቸውን ያመለክታል፤ «ወደ...ቤት መጡ» ትርጉሙን በግልጽና ተፈጥሯዊ አማርኛ ይሰጣል።
- source_word: ἐν ᾗ ἦμεν
  choice: እኛ ወደነበርንበት
  rationale: ጽሑፉ የሚገልጠውን ቦታ ብቻ በቀጥታ ያሳያል፤ «እንኖርበት ወደነበረው» የሚል ተጨማሪ ትርጉም አያስገባም።
- source_word: ἀπεσταλμένοι
  choice: የተላኩ ነበሩ
  rationale: ተልከው መምጣታቸው ከመድረሳቸው በፊት የተፈጸመ እንደሆነ የፍጹም ተገብሮ አንቀጹን በአማርኛ ያንጸባርቃል።
- source_word: ἀπὸ Καισαρείας πρός με
  choice: ከቂሳርያ ወደ እኔ
  rationale: ἀπό የመነሻ ቦታውን፣ πρός ደግሞ የተላኩበትን አቅጣጫና ተቀባይ በቀጥታ ያሳያሉ።
