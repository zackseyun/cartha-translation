  verdict: revise
  source_fidelity: The draft accurately conveys the attention marker, immediacy, three men, their arrival, their prior sending, Caesarea, and Peter as recipient. However, «እኛ ወደነበርንበት ቤት» uses ወደ (“to”) inside the relative clause, where the Greek ἐν ᾗ requires location (“in/at which”).
  naturalness: The overall register is clear, modern, and suitably dignified. Changing the relative clause to «እኛ በነበርንበት ቤት» is both idiomatic and grammatically precise. «ወዲያውኑ» naturally expresses ἐξαυτῆς.
  terminology: «እነሆ», «ሦስት ሰዎች», and «ቂሳርያ» are appropriate. The supplied English audit trail has a lexical-alternative note for ἐξαυτῆς; an Amharic anchor and corresponding note are supplied for transparency.
  issues:
  - severity: medium
    issue: 'The relative clause has an incorrect directional preposition: «ወደነበርንበት ቤት».'
    rationale: The source says “at/in the house in which we were” (ἐπὶ τὴν οἰκίαν ἐν ᾗ ἦμεν). In Amharic, the relative location must be marked by «በነበርንበት», while the main clause already expresses the men's movement toward the house.
  - severity: low
    issue: The lexical-alternative footnote for ἐξαυτῆς lacks an Amharic in-text anchor and translated note.
    rationale: Adding the anchor after «ወዲያውኑ» makes the note correspond directly to the word it explains without affecting meaning.
  revised_text: እነሆ፣ ወዲያውኑ[a] ሦስት ሰዎች እኛ በነበርንበት ቤት መጡ፤ እነርሱም ከቂሳርያ ወደ እኔ የተላኩ ነበሩ።
