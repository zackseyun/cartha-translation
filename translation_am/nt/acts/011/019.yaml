review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the scattering, the broadly framed θλίψις ('መከራ'), its connection with Stephen, the geographic extent, and the restriction of proclamation to Jews. The final audience-restriction wording, however, is syntactically awkward in Amharic and risks a momentary reversed reading because 'ለአይሁድ ብቻ እንጂ' precedes 'ለማንም አልተናገሩም.' Recasting it with 'ከአይሁድ በቀር' precisely expresses εἰ μὴ while the footnote retains the force of μόνον.
  naturalness: Most of the verse is clear, modern standard Amharic. 'ቃሉንም ከአይሁድ በቀር ለማንም አልተናገሩም' is substantially more idiomatic and immediately intelligible than the draft's discontinuous exception construction.
  terminology: The established biblical forms እስጢፋኖስ, ፊንቄ, ቆጵሮስ, and አንጾኪያ are appropriate. 'መከራ' appropriately avoids reducing θλίψις to persecution, and 'ቃሉን' retains Luke's recurrent term without importing an interpretive expansion into the text.
  issues:
  - severity: medium
    issue: 'The exception clause is awkwardly ordered: ''ለአይሁድ ብቻ እንጂ ለማንም አልተናገሩም።'''
    rationale: Although its intended meaning can be recovered, this construction is not natural standard Amharic and can initially sound as though they did not speak even to Jews. 'ከአይሁድ በቀር ለማንም' naturally and faithfully states that no one other than Jews received the word.
