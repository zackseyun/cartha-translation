  rationale: ወደ ቀደመው የራእይ ክስተት የሚያመለክት ነው፤ ‘ራእዩ’ የሚለውን በግልጽ ያልተጻፈ ስም ሳይጨምር የግሪኩን አመልካች ቃል ይጠብቃል።
