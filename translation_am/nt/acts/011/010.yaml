- source_word: ἅπαντα
  choice: ሁሉም ነገር
  rationale: በግሪኩ ያለውን ሁሉን አቀፍ አገላለጽ ይጠብቃል፤ ሸራውን ወይም እንስሳቱን ብቻ እንደሚያመለክት አድርጎ አይወስንም።
- source_word: εἰς τὸν οὐρανόν
