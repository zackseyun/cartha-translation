  yaml_path: translation/nt/acts/011/001.yaml
  text: The apostles and the brothers who were throughout Judea heard that the Gentiles also had received the word of God[a].
translation:
  language: am
  text: ሐዋርያቱና በመላው ይሁዳ የነበሩት ወንድሞች፣ አሕዛብም የእግዚአብሔርን ቃል እንደተቀበሉ ሰሙ[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወንድሞችና እኅቶች”፤ የግሪኩ ጽሑፍ “ወንድሞች” ይላል፣ ነገር ግን ቃሉ የእምነት ባልንጀሮችን በሰፊው ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσαν
  choice: ሰሙ
  rationale: የአንድ ጊዜ ያለፈ ድርጊትንና የዜና መስማትን በቀጥታ ይገልጣል።
- source_word: δὲ
  choice: በተለየ ቃል አልተተረጎመም
  rationale: እዚህ ጠንካራ ተቃርኖን ሳይሆን የትረካ ሽግግርን ያመለክታል፤ በአማርኛ የአረፍተ ነገሩ ቅደም ተከተል ሽግግሩን በተፈጥሮ ያሳያል።
- source_word: οἱ ἀπόστολοι
  choice: ሐዋርያት
  rationale: በሐዋርያት ሥራ ውስጥ ለታወቀው የሐዋርያት ቡድን የሚውለው የተለመደ መጽሐፍ ቅዱሳዊ ቃል ነው።
- source_word: οἱ ἀδελφοὶ
  choice: ወንድሞች
  rationale: የግሪኩን በሰዋስው ወንድ ብዙ ቁጥር ቅርጽ ይጠብቃል፤ ቃሉ ሰፋ ብሎ የእምነት ማኅበሩን ሊያካትት እንደሚችል በማስታወሻ ተገልጧል።
- source_word: οἱ ὄντες κατὰ τὴν Ἰουδαίαν
  choice: በመላው ይሁዳ የነበሩት
  rationale: κατά እዚህ ያለውን በክልሉ ሁሉ የመሰራጨት ስሜት ‘በመላው’ በማለት ይጠብቃል።
- source_word: τὰ ἔθνη
  choice: አሕዛብ
  rationale: በዚህ አውድ ከአይሁድ ውጭ ያሉ ሕዝቦችን የሚያመለክት የተለመደ አማርኛ መጽሐፍ ቅዱሳዊ ቃል ነው።
- source_word: καὶ
  choice: -ም
  rationale: አሕዛብ ጭምር መቀበላቸውን የሚያጎላውን የመደመር አጽንዖት በተፈጥሮ አማርኛ ያሳያል።
- source_word: ἐδέξαντο
  choice: እንደተቀበሉ
  rationale: δέχομαι ከ‘ቃል’ ጋር ያለውን መልእክቱን በፈቃድ የመቀበል ትርጉም ይገልጣል፤ የአማርኛው የተጠናቀቀ ቅርጽ ድርጊቱ ከመስማታቸው በፊት መፈጸሙን ያሳያል።
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: የእግዚአብሔርን ቃል
  rationale: የታወጀውን መለኮታዊ መልእክት የሚያመለክተውን የተለመደ መጽሐፍ ቅዱሳዊ አገላለጽና ሥነ መለኮታዊ ድምፅ ይጠብቃል።
theological_decisions:
- issue: ἀδελφοὶ የተባለውን በድብልቅ የእምነት ማኅበር አውድ መተርጎም
  choice: ወንድሞች
