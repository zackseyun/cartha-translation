  rationale: ዋናው ጽሑፍ የግሪኩን ወንድ ብዙ ቁጥር ቅርጽ ይጠብቃል፤ ቃሉ የእምነት ባልንጀሮችን በሰፊው ሊያመለክት የሚችለው ግን በማስታወሻ ተጠብቋል።
