base_translation:
  language: en
  yaml_path: translation/nt/acts/015/013.yaml
  text: And after they became silent[a], James answered, saying, “Brothers[b], listen to me.”
translation:
  language: am
  text: እነርሱም ዝም ካሉ[a] በኋላ፣ ያዕቆብ እንዲህ ሲል መለሰ፦ “ወንድሞች ሆይ[b]፣ ስሙኝ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “መናገር ካቆሙ።” የግሪኩ አገላለጽ ቀደም ሲል ይናገሩ የነበሩት ሰዎች ንግግራቸውን ካቆሙ በኋላ ያለውን ጊዜ ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ጥሪው ቃል በቃል “ወንዶች፣ ወንድሞች” የሚል መደበኛ የወንድ ጾታ ጥሪ ነው። በአማርኛ “ወንድሞች ሆይ” ይህን ትርጉም በተፈጥሯዊ ሁኔታ ያስተላልፋል።
    reason: cultural_note
lexical_decisions:
- source_word: μετὰ δὲ τὸ σιγῆσαι αὐτοὺς
  choice: እነርሱም ዝም ካሉ በኋላ
  rationale: μετά ከግሳዊ ስም ጋር የተከታይ ጊዜን፣ σιγάω ደግሞ ዝም ማለትን ወይም ንግግርን ማቆምን ያመለክታል። ይህ አተረጓጎም የድርጊቶቹን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: ἀπεκρίθη
  choice: መለሰ
  rationale: ቃሉ በውይይት ወይም በንግግር ሂደት ውስጥ መልስ መስጠትን ያመለክታል፤ “መለሰ” በአማርኛ አጭርና ተፈጥሯዊ ነው።
- source_word: Ἰάκωβος
  choice: ያዕቆብ
  rationale: ይህ በአማርኛ የመጽሐፍ ቅዱስ ልማድ የጸናው የስሙ ቅርጽ ነው።
- source_word: λέγων
  choice: እንዲህ ሲል
  rationale: አሳታፊው ቀጥተኛውን ንግግር ያስተዋውቃል፤ “እንዲህ ሲል” የግሪኩን አወቃቀር በተፈጥሯዊ አማርኛ ይወክላል።
- source_word: Ἄνδρες ἀδελφοί
  choice: ወንድሞች ሆይ
  rationale: ሁለቱም ቃላት በወንድ ጾታ የተጠሪ ቅርጽ ቢሆኑም፣ በአማርኛ “ወንዶች፣ ወንድሞች” ማለት የማይፈጥራዊ ድግግሞሽ ይሆናል። “ወንድሞች ሆይ” የወንድ ጾታውንና የክብር ጥሪውን ይጠብቃል፤ የቃል በቃል ቅርጹ በማስታወሻ ተገልጧል።
- source_word: ἀκούσατέ μου
  choice: ስሙኝ
  rationale: የትእዛዝ ቅርጹ ትኩረት ሰጥቶ ማዳመጥን ይጠይቃል፤ “ስሙኝ” አጭር፣ ግልጽና ተፈጥሯዊ ነው።
theological_decisions:
- issue: በሕዝብ ጉባኤ ንግግር ውስጥ ያለው የወንድ ጾታ ጥሪ
  choice: በዋናው ጽሑፍ “ወንድሞች ሆይ” ብሎ የወንድ ጾታውን ጥሪ ማቆየት
  alternative: “ወንድሞችና እህቶች” ወይም ቃል በቃል “ወንዶች፣ ወንድሞች”
  rationale: ግሪኩ ሁለት የወንድ ጾታ ተጠሪዎችን ይዟል። “ወንድሞች ሆይ” ጾታውን ሳያጠፋ በዘመናዊ አማርኛ ተፈጥሯዊ የሆነውን መደበኛ ጥሪ ያቀርባል፤ ሰፋ ያለ አድማጭ እንዳለ በመገመት “እህቶች”ን ወደ ጽሑፉ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። “እንዲህ ሲል መለሰ” የግሪኩን የትረካ አወቃቀር ሳይከብድ ይጠብቃል።
