    rationale: The middle ἀπέχεσθαι denotes refraining or abstaining. “እንዲቆጠቡ” conveys this more directly in modern standard Amharic.
  - severity: low
    issue: Singular “ርኩሰት” does not reflect the plural ἀλισγημάτων.
    rationale: Using “ርኩሰቶች” more closely represents the source while remaining natural.
