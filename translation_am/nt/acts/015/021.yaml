  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Μωϋσῆς γὰρ ἐκ γενεῶν ἀρχαίων κατὰ πόλιν τοὺς κηρύσσοντας αὐτὸν ἔχει ἐν ταῖς συναγωγαῖς κατὰ πᾶν σάββατον ἀναγινωσκόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/021.yaml
  text: For from ancient generations Moses has had those who proclaim him in every city[a], being read in the synagogues every Sabbath.
translation:
  language: am
  text: ምክንያቱም ሙሴ ከጥንት ትውልዶች ጀምሮ በየከተማው እርሱን የሚያውጁ ሰዎች አሉት[a]፤ በምኩራቦችም በየሰንበቱ ሲነበብ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “ሙሴ… እርሱን የሚያውጁ… ሲነበብ” ይላል። “ሙሴ” የሚለው ስም ከሙሴ ጋር የተያያዙትን ጽሑፎች ወይም ሕግ ወክሎ ቀርቧል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Μωϋσῆς
  choice: ሙሴ
  rationale: በአማርኛ የተለመደውን የስሙን ቅርጽ ይጠቀማል፤ የግሪክ ጽሑፉ ሙሴን በስሙ ይጠቅሳል።
- source_word: γὰρ
  choice: ምክንያቱም
  rationale: ይህ አንቀጽ ከቀደመው ፍርድ ጋር ያለውን የማብራሪያ ወይም የምክንያት ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐκ γενεῶν ἀρχαίων
  choice: ከጥንት ትውልዶች ጀምሮ
  rationale: የምንጩን ብዙ ቁጥር ‘ትውልዶች’ ጠብቆ ነገሩ ከረጅም ዘመን ጀምሮ መቀጠሉን ይገልጣል።
- source_word: κατὰ πόλιν
  choice: በየከተማው
  rationale: κατά ያለውን ከተማ በከተማ የሚያሰራጭ ትርጉም በተፈጥሯዊና አጭር አማርኛ ያቀርባል።
- source_word: τοὺς κηρύσσοντας αὐτὸν
  choice: እርሱን የሚያውጁ ሰዎች
  rationale: κηρύσσω የሕዝብ ፊት ማወጅን ያመለክታል፤ ‘እርሱን’ የሚለውም ሙሴን ለጽሑፎቹ የሚያቆመውን የምንጩን ዘይቤ ይጠብቃል።
- source_word: ἔχει
  choice: አሉት
  rationale: የግሪኩን የአሁን ጊዜ ግስ በቀጥታ ይወክላል፤ ‘ከ...ጀምሮ’ የሚለው ሐረግ ሁኔታው ከጥንት እስከ አሁን መቀጠሉን ያሳያል።
- source_word: ἐν ταῖς συναγωγαῖς
  choice: በምኩራቦች
  rationale: የመነበቡን መደበኛ ስፍራ በአማርኛ የተለመደው ‘ምኩራብ’ በሚለው ቃል ይገልጣል።
- source_word: κατὰ πᾶν σάββατον
  choice: በየሰንበቱ
  rationale: የድርጊቱን በእያንዳንዱ ሰንበት መደጋገም የκατά አከፋፋይ ኃይልን ጠብቆ ያሳያል።
- source_word: ἀναγινωσκόμενος
  choice: ይነበባል
  rationale: ተሳቢውን የግሪክ አወቃቀር በአማርኛ ተገብሮ ግስ ያቀርባል፤ ያልተገለጸ የምክንያት ትርጉም ሳይጨምር ከቀደመው ንግግር ጋር በሰረዝ ያያይዘዋል።
theological_decisions:
- issue: ‘ሙሴ’ ለጽሑፎቹ ወይም ለሕጉ የቆመበት ዘይቤ
  choice: በዋናው ጽሑፍ ‘ሙሴ፣ እርሱን፣ ይነበባል’ የሚሉትን የግል ማጣቀሻዎች ማቆየት
  alternative: ‘የሙሴ ሕግ’ ወይም ‘የሙሴ ጽሑፎች’ ብሎ በግልጽ መተካት
  rationale: ግሪኩ በግልጽ ‘ሙሴ’ እና ‘እርሱን’ ይላል፤ ይህን ዘይቤ ማቆየት የትርጓሜ ማብራሪያን ወደ ዋናው ጽሑፍ ከማስገባት ይቆጠባል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ የሚገባ አማርኛ ተጠቅሟል። ‘የሚያውጁ’ የአደባባይ አዋጅን ስሜት ሲጠብቅ፣ የሙሴ ዘይቤያዊ ማጣቀሻ በማስታወሻ ተብራርቷል።
