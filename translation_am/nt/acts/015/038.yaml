- source_word: μὴ συνελθόντα αὐτοῖς
  choice: አብሯቸው ያልሄደውን
  rationale: በጉዞና በአገልግሎት አውድ ያለውን ‘አብሮ መሄድ’ ትርጉም ግልጽና ተፈጥሯዊ በሆነ አማርኛ ያቀርባል።
- source_word: εἰς τὸ ἔργον
  choice: ወደ ሥራው
  rationale: የግሪኩን መስተዋድድና የተወሰነውን ሥራ ይጠብቃል፤ ‘ተልእኮ’ የሚለውን ትርጓሜያዊ ማብራሪያ አያስገባም።
- source_word: μὴ συμπαραλαμβάνειν τοῦτον
  choice: ይህን ሰው አብረዋቸው እንዳይወስዱት
  rationale: የτοῦτονን ጠቋሚ ኃይልና συμπαραλαμβάνειν የሚያመለክተውን አብሮ መውሰድ በግልጽ አማርኛ ይጠብቃል።
