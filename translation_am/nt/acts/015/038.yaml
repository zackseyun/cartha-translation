base_translation:
  language: en
  yaml_path: translation/nt/acts/015/038.yaml
  text: But Paul insisted that they should not take along this man[a], who had withdrawn from them from Pamphylia and had not gone with them to the work.
translation:
  language: am
  text: ጳውሎስ ግን በጵንፍልያ ከእነርሱ የተለየውንና ወደ ሥራው አብሯቸው ያልሄደውን ይህን ሰው[a] አብሯቸው እንዳይወስዱት አጥብቆ ጠየቀ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በጵንፍልያ ጥሏቸው የሄደውን።” የግሪኩ አሳታፊ ግሥ ይበልጥ ከባድ በሆነ አነጋገር ሊተረጎም ይችላል፤ ዋናው ጽሑፍ ግን ፍርድን ያነሰ የሚጭነውን “የተለየውን” የሚል አተረጓጎም ይጠቀማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠξίου
  choice: አጥብቆ ተከራከረ
  rationale: ያልተፈጸመ ድርጊትን የሚያመለክተው የግሥ ቅርጽና የክርክሩ አውድ የጳውሎስን ጽኑ አቋም ያሳያሉ፤ ይህ አተረጓጎም ከቀላል ምርጫ ይልቅ ጠንካራ አቋምን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀποστάντα
  choice: ተለይቶ የቀረውን
  rationale: የመለየትን ወይም የመራቅን መሠረታዊ ትርጉም ይጠብቃል፤ በዋናው ጽሑፍ ላይ ‘ከዳ’ የሚል ይበልጥ ከባድ ፍርድ አይጭንም።
- source_word: ἀπ’ αὐτῶν ἀπὸ Παμφυλίας
