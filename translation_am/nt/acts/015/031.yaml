lexical_decisions:
- source_word: ἀναγνόντες
  choice: ደብዳቤውንም ካነበቡ በኋላ
  rationale: የግስ አጋዥ ቅርጹ ከዋናው ድርጊት በፊት የተፈጸመ ንባብን ያሳያል። በግሪክ ያልተገለጸው ተሳቢ ከቀዳሚው አውድ ደብዳቤው መሆኑ ግልጽ ስለሆነ በአማርኛ ተገልጧል።
- source_word: δὲ
  choice: -ም
  rationale: δέ የሚያመለክተውን ቀላል ትስስር በተፈጥሯዊው የአማርኛ አያያዥ -ም ተገልጿል፤ ተቃርኖን አያጎላም።
- source_word: ἐχάρησαν
  choice: ደስ አላቸው
  rationale: χαίρω እዚህ ንቁ ትርጉም ያለው ሲሆን፣ «ደስ አላቸው» የቡድኑን ደስታ በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐπὶ
  choice: በ-
  rationale: ከዳቲቭ ጋር ያለው ἐπί የደስታውን መነሻ ወይም ምክንያት ያመለክታል፤ የአማርኛው «በ-» ይህን በአጭርና ተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: τῇ παρακλήσει
  choice: በማበረታቻው
  rationale: παράκλησις ማበረታታትን፣ ምክርን ወይም ማጽናናትን ሊያመለክት ይችላል። በዚህ አውድ «ማበረታቻ» የደብዳቤውን አጽናኝና አበረታች ውጤት በሰፊው ይይዛል፤ የወሰን ቅጥያውም በአውዱ የታወቀውን የደብዳቤውን መልእክት ያመለክታል።
