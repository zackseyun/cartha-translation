    issue: The main verb is rendered with a form that ordinarily has present meaning.
    rationale: The source aorist ἐχάρησαν reports that they rejoiced after reading; «ደስ አላቸው» most naturally means ‘they are glad.’
  - severity: low
    issue: The footnote’s first quoted wording duplicates the main translation.
    rationale: A lexical-alternative note should state actual alternatives for παράκλησις; repeating «በማበረታቻው ደስ አላቸው» does not provide one.
