  alternative: «ማስቸገር እንደሌለ እኔ እፈርዳለሁ» ወይም «እንዳይቸገሩ እወስናለሁ»
  rationale: ግሪኩ ἐγὼ κρίνω የሚለውን ግልጽ የመጀመሪያ ነጠላ ሰው አገላለጽ ይዟል፤ ተከታዩ የኢንፊኒቲቭ ሐረግ ግን ማኅበራዊ ውሳኔውን ይገልጻል። ትርጉሙ ሁለቱንም ያቆያል።
