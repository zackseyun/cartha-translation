  text: But[a] it seemed good to Silas to remain there.
translation:
  language: am
  text: ሆኖም ሲላስ በዚያው መቆየት መልካም መስሎት ነበር።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይህ ቁጥር ከቀደምት የግሪክ ቅጂዎች—የ3ኛው ክፍለ ዘመን ፓፒረስ 74ን፣ የ4ኛው ክፍለ ዘመን ሲናይቲከስንና ቫቲካነስን ጨምሮ—እንዲሁም ከቀደምት የቅብጥ ትርጉሞች ውስጥ የለም። በባይዛንታይን አብላጫ የቅጂ ባህል፣ በአንዳንድ ኋለኛ የአሌክሳንድሪያና የምዕራባውያን ቅጂዎች፣ እንዲሁም በላቲንና በሶርያ ትርጉም ባህሎች ውስጥ ይገኛል። በቁጥር 33 ሲላስና ይሁዳ እንደሄዱ ከተነገረ በኋላ፣ በቁጥር 40 ሲላስ ከጳውሎስ ጋር ለመሄድ በአንጾኪያ እንዴት እንደነበረ ለማብራራት አንድ ኋለኛ ጸሐፊ ጨምሮት ሊሆን ይችላል።
    reason: textual_critical
lexical_decisions:
- source_word: δοκέω
  choice: መልካም መስሎት ነበር
  rationale: ከባለቤት አመልካች τῷ Σίλᾳ ጋር ያለውን ግላዊ ያልሆነ የግሪክ አገባብ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ የሲላስን ውሳኔ ቢጠቁምም ‘ወሰነ’ በማለት የምንጩን አገባብ አያጠብም።
- source_word: ἐπιμένω
  choice: መቆየት
  rationale: በአንድ ስፍራ መቀጠልን በግልጽና በዘመናዊ አማርኛ ይገልጣል።
- source_word: αὐτοῦ
  choice: በዚያው
  rationale: ቃሉ እንደ ስፍራ ተውሳከ ግስ ሆኖ በአውዱ የተጠቀሰውን አንጾኪያ ያመለክታል፤ ‘-ው’ ደግሞ በዚያው ስፍራ መቆየቱን ያጎላል።
- source_word: δέ
  choice: ሆኖም
  rationale: ከቀደመው ቁጥር ጋር ያለውን ተቃራኒ ሽግግር ያሳያል፤ ሌሎቹ በሰላም ተሸኝተው ሲሄዱ ሲላስ ግን መቆየቱን ያቀርባል።
theological_decisions:
- issue: የቁጥሩ ጽሑፋዊ ልዩነት
  choice: በተሰጠው የባይዛንታይን ምንጭ መሠረት ቁጥሩን በዋናው ጽሑፍ ማካተትና የማስረጃውን ልዩነት በማስታወሻ መግለጽ
  alternative: ቁጥሩን ከዋናው ጽሑፍ ማስወገድ ወይም በቅንፍ ማስገባት
  rationale: የተመደበው ምንጭ ቁጥሩን ይዟል፤ ሆኖም ቀደምትና ከባድ ሚዛን ያላቸው ምስክሮች ስለማይዙት አንባቢው ይህን እውነተኛ ጽሑፋዊ ጥያቄ ማወቅ አለበት።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው አገላለጽ ተመርጧል። ‘መልካም መስሎት’ የግሪኩን ፈሊጣዊ አወቃቀር እያከበረ በተፈጥሯዊ አማርኛ የውሳኔን ሐሳብ ያስተላልፋል። የማስታወሻ ምልክቱ በዋናው ጽሑፍ [a] ተካቷል።
