    text: ወይም፣ “ወንድሞችና እህቶች።” የግሪኩ ቃል “ወንድሞች” ይላል፤ ነገር ግን ተባዕታይ ቃሉ የአማኞችን ማኅበር በአጠቃላይ ወክሎ የተጠቀሰ ሊሆን ይችላል።
