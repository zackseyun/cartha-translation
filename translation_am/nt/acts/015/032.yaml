  text: Ἰούδας τε καὶ Σιλᾶς, καὶ αὐτοὶ προφῆται ὄντες, διὰ λόγου πολλοῦ παρεκάλεσαν τοὺς ἀδελφοὺς καὶ ἐπεστήριξαν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/032.yaml
  text: Judas and Silas[a], who were themselves prophets, encouraged the brothers at length and strengthened them.
translation:
  language: am
  text: ይሁዳና ሲላስ ራሳቸው ነቢያት ስለነበሩ፣ ረዥም ንግግር በማድረግ ወንድሞችን[a] አበረታቷቸው፤ አጸኗቸውም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወንድሞችንና እህቶችን።” የግሪኩ ጽሑፍ “ወንድሞች” ይላል፤ ቃሉ ግን መላውን የአማኞች ማኅበር ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰούδας
  choice: ይሁዳ
  rationale: በአማርኛ የአዲስ ኪዳን የስም አጠራር የተለመደውን ቅርጽ ይከተላል።
- source_word: τε καὶ
  choice: ይሁዳና ሲላስም
  rationale: ሁለቱን ሰዎች በተፈጥሯዊ የአማርኛ አገናኝ ያስተሳስራል።
- source_word: Σιλᾶς
  choice: ሲላስ
  rationale: በአማርኛ የተለመደው የስሙ አጠራር ነው።
- source_word: καὶ αὐτοὶ προφῆται ὄντες
  choice: ራሳቸው ነቢያት ስለነበሩ
  rationale: αὐτοὶ የሚሰጠውን አጽንዖት በ‘ራሳቸው’ ያስቀምጣል፤ አሳታፊውንም አገላለጽ እንደ ዳራ ምክንያት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: προφῆται
  choice: ነቢያት
  rationale: የግሪኩን ሃይማኖታዊ ማዕረግ በቀጥታና በተለመደ ቃል ይገልጻል።
- source_word: διὰ λόγου πολλοῦ
  choice: በብዙ ቃል
  rationale: ‘በብዙ ንግግር’ ወይም ‘ረጅም ጊዜ በመናገር’ የሚለውን ሐሳብ ከምንጩ ምስል ጋር በቅርብ ይጠብቃል።
- source_word: παρεκάλεσαν
  choice: አበረታቷቸው
  rationale: በዚህ የነቢያት አገልግሎት አውድ ማበረታታትንና መምከርን የሚያካትተውን ዋና ሐሳብ በግልጽ ዘመናዊ አማርኛ ያቀርባል።
- source_word: τοὺς ἀδελφοὺς
  choice: ወንድሞችን
  rationale: የግሪኩን ወንድ ብዙ ቁጥር በዋናው ጽሑፍ ይጠብቃል፤ ቃሉ መላውን የአማኞች ማኅበር ሊያመለክት እንደሚችል በማስታወሻ ተገልጿል።
- source_word: ἐπεστήριξαν
  choice: አጸኗቸው
  rationale: ማጽናትን፣ ጽኑ ማድረግን የሚገልጸውን ሁለተኛ ተግባር ከ‘አበረታቷቸው’ ለይቶ ያቀርባል።
theological_decisions:
- issue: በተቀላቀለ የአማኞች ማኅበር አውድ ውስጥ ἀδελφοὺςን መተርጎም
  choice: ወንድሞችን
  alternative: ወንድሞችንና እህቶችን፤ አማኞችን
  rationale: የግሪኩ ቃል በሰዋስው ወንድ ብዙ ቁጥር ነው፤ ሆኖም በቀድሞው ክርስቲያናዊ አጠቃቀም ሴቶችንም ያካተተውን ማኅበር ሊወክል ይችላል። ዋናው ጽሑፍ የቃሉን ቅርጽ ሲጠብቅ ሰፊውን አጠቃቀም ማስታወሻው ያሳያል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የምንጩ ተከታታይ ሁለት ድርጊቶች—ማበረታታትና ማጽናት—ተለይተው ተጠብቀዋል።
