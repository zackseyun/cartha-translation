id: ACT.15.8
reference: Acts 15:8
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ὁ καρδιογνώστης θεὸς ἐμαρτύρησεν αὐτοῖς ⸀δοὺς τὸ πνεῦμα τὸ ἅγιον καθὼς καὶ ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/008.yaml
  text: And God[a], who knows the heart, bore witness to them by giving them the Holy Spirit just as he did to us,
translation:
  language: am
  text: ልብን የሚያውቀው እግዚአብሔርም፣ ለእኛ እንደ ሰጠው ሁሉ ለእነርሱም መንፈስ ቅዱስን በመስጠት፣ ለእነርሱ መሰከረ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καρδιογνώστης
  choice: ልብን የሚያውቀው
  rationale: የግሪኩን ውሁድ ቃል፣ የሰውን ውስጣዊ ማንነት የሚያውቅ ማለትን፣ በተፈጥሯዊና ግልጽ የአማርኛ አንጻራዊ ሐረግ ያቀርባል።
- source_word: θεὸς
  choice: እግዚአብሔር
  rationale: በዚህ አውድ θεόςን የሚወክል የተለመደና ክቡር የአማርኛ አጠራር ነው።
- source_word: ἐμαρτύρησεν
  choice: መሰከረ
  rationale: ድርጊቱ ለእነርሱ ያለውን መቀበል በማስረጃ እንዳረጋገጠ የሚያሳየውን የምስክርነት ትርጉም ይጠብቃል።
- source_word: αὐτοῖς
  choice: ስለ እነርሱ
  rationale: ከἐμαρτύρησεν ጋር ያለው ዳቲቭ እግዚአብሔር በእነርሱ ወገን ማረጋገጫ እንደሰጠ በተፈጥሯዊ አማርኛ ይገልጣል፤ ተውላጠ ስሙን በአውዱ ካሉት አሕዛብ ጋር በጽሑፉ ውስጥ አይተካም።
- source_word: δοὺς
  choice: በመስጠት
  rationale: የመንፈስ ቅዱስ ስጦታ እግዚአብሔር የመሰከረበት መንገድ መሆኑን የአሳታፊውን መሣሪያዊ ኃይል በግልጽ ያሳያል።
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: መንፈስ ቅዱስን
  rationale: የተለመደውንና ዘመናዊውን የአማርኛ መጠሪያ ይጠቀማል፤ የነገሩ ቀጥተኛ ተሳቢነትም በ-ን ተገልጧል።
- source_word: καθὼς καὶ ἡμῖν
  choice: ለእኛ እንደሰጠን ሁሉ
  rationale: በግሪኩ የታሰበውን ‘መስጠት’ ግስ በአማርኛ በመሙላት ንጽጽሩን ግልጽና ተፈጥሯዊ ያደርጋል።
theological_decisions:
- issue: መንፈስ ቅዱስ ለእነርሱና ለእኛ በተመሳሳይ መስጠቱ የእግዚአብሔር ምስክርነት መሆኑ
  choice: ‘ለእነርሱ’ እና ‘ለእኛ’ የሚለውን ንጽጽር ጠብቆ፣ የእግዚአብሔር ምስክርነት መንፈስ ቅዱስን በመስጠቱ እንደተገለጠ ተተርጉሟል።
  alternative: ‘እነርሱ’ን በግልጽ ‘አሕዛብ’ ብሎ መተካት ይቻል ነበር።
  rationale: αὐτοῖς ራሱ ‘አሕዛብ’ አይልም፤ ማጣቀሻው ከአውዱ ይታወቃል። ስለዚህ ትርጉሙ ከግሪኩ በላይ ሥነ መለኮታዊ ማብራሪያ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ አጭር የንጽጽር አወቃቀር በአማርኛ ግልጽ እንዲሆን ‘እንደሰጠን’ ተሟልቷል።
