- source_word: ἐπίστασθε
  choice: ታውቃላችሁ
  rationale: አድማጮቹ አስቀድመው ያወቁትን ነገር በቀጥታና በተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: ἀφ’ ἡμερῶν ἀρχαίων
  choice: ከቀድሞ ዘመን ጀምሮ
  rationale: በዐውዱ ውስጥ እጅግ ጥንታዊ ዘመንን ሳይሆን ቀደም ሲል የሆነውን የቆርኔሌዎስ ክስተት ሊያመለክት ይችላል፤ የግሪኩን የጊዜ ርቀት ይጠብቃል።
- source_word: ἐν ὑμῖν ἐξελέξατο ὁ θεός
  choice: እግዚአብሔር ከእናንተ መካከል እኔን እንደመረጠ
  rationale: የግሪኩ ሐረግ በቃል ደረጃ ‘በእናንተ መካከል መረጠ’ ይላል፤ በአማርኛ ግስ የሚፈልገው ቀጥተኛ ተሳቢ ከዐውዱ ግልጽ ስለሆነ ‘እኔን’ ተገልጿል።
- source_word: διὰ τοῦ στόματός μου
  choice: በእኔ አፍ
  rationale: ጴጥሮስን የመልእክቱ ተናጋሪ መሣሪያ አድርጎ የሚያቀርበውን ሕያው ዘይቤ ይጠብቃል።
- source_word: τὰ ἔθνη
  choice: አሕዛብ
  rationale: በሐዋርያት ሥራ 15 ዐውድ የሚያመለክተው አይሁድ ያልሆኑትን ሕዝቦች ነው፤ ‘አሕዛብ’ ይህን ልዩነት በተለመደ የመጽሐፍ ቅዱስ አማርኛ ያስተላልፋል።
- source_word: τὸν λόγον τοῦ εὐαγγελίου
  choice: የወንጌልን ቃል
  rationale: λόγος የመልእክት ትርጉም ሲኖረውም የሉቃስን መደበኛ የ‘ቃል’ አጠቃቀምና εὐαγγέλιον የሚለውን ‘ወንጌል’ በግልጽ ሁኔታ ይጠብቃል።
- source_word: ἀκοῦσαι ... καὶ πιστεῦσαι
  choice: ሰምተው እንዲያምኑ
  rationale: ሁለቱን የተቀናጁ የግሪክ ኢንፊኒቲቮች በተፈጥሯዊ የአማርኛ ዓላማ አገባብ ያቀርባል፤ መስማትና ማመን ተለይተው ይቆያሉ።
