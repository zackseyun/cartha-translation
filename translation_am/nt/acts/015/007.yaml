  text: And after much debate had taken place[a], Peter stood up and said to them, “Brothers[c][b], you know that from ancient days God chose among you that through my mouth the Gentiles should hear the word of the gospel and believe.”
translation:
  language: am
  text: ብዙ ክርክር ከተደረገ በኋላ፣ ጴጥሮስ ተነሥቶ እንዲህ አላቸው፦ “ወንድሞች፣[a] ከቀደሙት ቀናት ጀምሮ[b] አሕዛብ[c] በአፌ የወንጌልን ቃል ሰምተው እንዲያምኑ፣ እግዚአብሔር በእናንተ መካከል እኔን እንደመረጠ እናንተ ታውቃላችሁ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “ወንዶች ወንድሞች።” የግሪኩ አነጋገር የወንድ ብዙ ቁጥር ነው፤ “ወንድሞች” ቅርጹን ይጠብቃል፣ ይህ የተለመደ አነጋገር የሚወክላቸው ሌሎች አድማጮችም ኖረው ሊሆን ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ከጥንት ቀናት ጀምሮ።”
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “ሕዝቦች።” እዚህ የሚያመለክተው አይሁድ ያልሆኑትን ሕዝቦች ስለሆነ “አሕዛብ” ተብሏል።
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλῆς ... ζητήσεως γενομένης
  choice: ብዙ ክርክር ከተደረገ በኋላ
  rationale: የግሪኩ ገላጭ ሐረግ ከጴጥሮስ ንግግር በፊት የነበረውን ሰፊ ውይይትና አለመግባባት ያሳያል፤ ‘ክርክር’ ከልክ ያለፈ ጠብን ሳያመለክት የጉዳዩን ክብደት ያስተላልፋል።
- source_word: ἀναστὰς
  choice: ተነሥቶ
  rationale: ከመናገሩ በፊት ጴጥሮስ ያደረገውን ተግባር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Ἄνδρες ἀδελφοί
  choice: ወንድሞች
