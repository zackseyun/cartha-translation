  language: am
  text: ስለዚህ ከተሰናበቱ በኋላ[a] ወደ አንጾኪያ ወረዱ፤[b] ሕዝቡን ሁሉ[c] ሰብስበውም ደብዳቤውን አስረከቡ።
  philosophy: optimal-equivalence
  footnotes:
