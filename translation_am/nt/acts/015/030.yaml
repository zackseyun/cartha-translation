    reason: lexical_alternative
  - marker: b
    text: “ወረዱ” የግሪኩን ግስ የአቅጣጫ ትርጉም ይጠብቃል፤ ይህም ምናልባት ከከፍታ ላይ ካለችው ኢየሩሳሌም ወደ አንጾኪያ መጓዛቸውን ያመለክታል።
    reason: cultural_note
  - marker: c
    text: ወይም “ጉባኤውን” ወይም “ማኅበሩን።” ሐረጉ በአንጾኪያ የተሰበሰበውን ቡድን ያመለክታል።
    reason: lexical_alternative
