  text: Τότε ἔδοξε τοῖς ἀποστόλοις καὶ τοῖς πρεσβυτέροις σὺν ὅλῃ τῇ ἐκκλησίᾳ ἐκλεξαμένους ἄνδρας ἐξ αὐτῶν πέμψαι εἰς Ἀντιόχειαν σὺν ⸀τῷ Παύλῳ καὶ Βαρναβᾷ, Ἰούδαν τὸν ⸀καλούμενον Βαρσαββᾶν καὶ Σιλᾶν, ἄνδρας ἡγουμένους ἐν τοῖς ἀδελφοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/022.yaml
  text: 'Then it seemed good to the apostles and the elders, together with the whole church, to choose men from among them and send them to Antioch with Paul and Barnabas: Judas, who was called Barsabbas, and Silas, men who were leading among the brothers.'
translation:
  language: am
  text: ከዚያም ሐዋርያትና ሽማግሌዎች ከመላው ቤተ ክርስቲያን ጋር ሆነው፣ ከመካከላቸው ወንዶችን መርጠው ከጳውሎስና ከበርናባስ ጋር ወደ አንጾኪያ ለመላክ መልካም ሆኖ ታያቸው፤ እነርሱም በርሳባስ የሚባለው ይሁዳና ሲላስ ነበሩ፣ በወንድሞች መካከል መሪዎች የነበሩ ወንዶች።[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በወንድሞች መካከል አመራር ይሰጡ የነበሩ ወንዶች።»
    reason: lexical_alternative
  - marker: b
    text: እዚህ «ወንድሞች» የሚለው ቃል ሴቶችንም ጨምሮ ሰፊውን የአማኞች ማኅበር የሚያመለክት ሊሆን ይችላል።
    reason: cultural_note
lexical_decisions:
- source_word: ἔδοξε
  choice: መልካም መስሎ ታያቸው
  rationale: የጋራ ምክክርና ፍርድን ያሳያል፤ እንደ ግዴታዊ ዐዋጅ አያቀርበውም።
- source_word: πρεσβυτέροις
  choice: ሽማግሌዎች
  rationale: በአማርኛ የቤተ ክርስቲያን አመራርን በተፈጥሮ የሚገልጽ የተለመደ ቃል ነው።
- source_word: σὺν ὅλῃ τῇ ἐκκλησίᾳ
  choice: ከመላው ቤተ ክርስቲያን ጋር ሆነው
  rationale: መላው የኢየሩሳሌም አማኞች ማኅበር በውሳኔው መሳተፉን ይጠብቃል።
- source_word: ἐκλεξαμένους ἄνδρας ἐξ αὐτῶν
  choice: ከመካከላቸው ወንዶችን መርጠው
  rationale: የተመረጡት ከማኅበሩ ውስጥ መሆናቸውንና ἄνδρας በግልጽ ወንዶችን ማመልከቱን ያስቀምጣል።
- source_word: πέμψαι
  choice: ሊልኳቸው
  rationale: በዐውዱ ያለውን የመላክ ዓላማ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: καλούμενον
  choice: የሚባለው
  rationale: ይሁዳ በበርሳባስ ስምም ይታወቅ እንደነበር በተፈጥሯዊ መንገድ ይገልጻል።
- source_word: ἄνδρας ἡγουμένους ἐν τοῖς ἀδελφοῖς
  choice: በወንድሞች መካከል መሪዎች የነበሩ ወንዶች
  rationale: ἡγουμένους የታወቀ የመሪነት ሚናን ያሳያል፤ የተወሰነ የሥልጣን ማዕረግ ግን አያስገባም።
- source_word: ἀδελφοῖς
  choice: ወንድሞች
  rationale: የግሪኩን ወንዳዊ ብዙ ቁጥር ይጠብቃል፤ በዐውዱ ሰፊውን የአማኞች ማኅበር ሊያመለክት መቻሉ በማስታወሻ ተገልጿል።
theological_decisions:
- issue: መላው ማኅበር በውሳኔው የነበረው ተሳትፎ
  choice: ሐዋርያትና ሽማግሌዎች ከመላው ቤተ ክርስቲያን ጋር በምርጫውና በመላኩ እንደተሳተፉ ቀርቧል።
  alternative: ሐዋርያትና ሽማግሌዎች ብቻ ወሰኑ፤ ማኅበሩ ተገኝቶ ብቻ ነበር።
  rationale: σὺν ὅλῃ τῇ ἐκκλησίᾳ የሚለው ሐረግ መላውን ማኅበር በተግባሩ ውስጥ ያካትታል፤ ትርጉሙ ከዚህ በላይ የተወሰነ የቤተ ክርስቲያን አስተዳደር ሥርዓት አያስገባም።
- issue: ἀδελφοῖς የሚለው ቃል ወሰን
  choice: በዋናው ጽሑፍ «ወንድሞች» ተብሎ፣ ሰፊው የማኅበር ትርጉም በማስታወሻ ተገልጿል።
  alternative: ወንድሞችና እኅቶች፤ ወይም አማኞች
  rationale: የምንጩን ሰዋሰዋዊ ወንዳዊ ቅርጽ ሳያጠፋ፣ በጥንታዊው ክርስቲያናዊ አጠቃቀም ሴቶችንም የሚያካትት ማኅበራዊ ስያሜ ሊሆን እንደሚችል ያሳያል።
