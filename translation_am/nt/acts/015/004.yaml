  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: παραγενόμενοι δὲ εἰς ⸀Ἱεροσόλυμα ⸀παρεδέχθησαν ⸀ἀπὸ τῆς ἐκκλησίας καὶ τῶν ἀποστόλων καὶ τῶν πρεσβυτέρων, ἀνήγγειλάν τε ὅσα ὁ θεὸς ἐποίησεν μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/004.yaml
  text: When they arrived in Jerusalem[a], they were welcomed by the church and the apostles and the elders, and they reported all that God had done with them.
translation:
  language: am
  text: ወደ ኢየሩሳሌም ሲደርሱ፣ የአማኞች ማኅበር፣ ሐዋርያቱና ሽማግሌዎቹ ተቀበሏቸው፤ እግዚአብሔር ከእነርሱ ጋር ያደረገውን ሁሉ[a] ነገሯቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እግዚአብሔር በእነርሱ አማካይነት ያደረገውን» ወይም «እግዚአብሔር በመካከላቸው ያደረገውን»። የግሪኩ ሐረግ በቀጥታ «ከእነርሱ ጋር» ይላል።
    reason: alternative_reading
lexical_decisions:
- source_word: παραγενόμενοι δὲ εἰς Ἱεροσόλυμα
  choice: ወደ ኢየሩሳሌምም በደረሱ ጊዜ
  rationale: የአኦሪስት አጋዥ ግስ ከዋናዎቹ ድርጊቶች በፊት የሆነውን ሁኔታ ያሳያል፤ ይህ አተረጓጎም የጊዜውን ግንኙነትና የδέን ቀላል አያያዥነት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: παρεδέχθησαν
  choice: በደስታ ተቀበሉ
  rationale: በዚህ አውድ παραδέχομαι እንግዳን ወይም መጪዎችን በመልካም ሁኔታ መቀበልን ያመለክታል፤ «በደስታ ተቀበሉ» ይህን በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἀπὸ τῆς ἐκκλησίας καὶ τῶν ἀποστόλων καὶ τῶν πρεσβυτέρων
  choice: በማኅበሩ፣ በሐዋርያትና በሽማግሌዎች
  rationale: ከተገብሮ ግስ ጋር ያለው ἀπό የድርጊቱን አድራጊዎች ያመለክታል። ἐκκλησία በዚህ ስፍራ የአማኞችን ማኅበር፣ πρεσβύτεροι ደግሞ የታወቁ መሪዎችን ያመለክታል።
- source_word: ἀνήγγειλάν τε ὅσα
  choice: እነርሱም ... ሁሉ ተረኩ
  rationale: ἀναγγέλλω የሆነውን ነገር በዝርዝር ማስታወቅ ወይም መተረክን ያመለክታል፤ «ተረኩ» የሪፖርቱን ይዘት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὁ θεὸς ἐποίησεν μετ’ αὐτῶν
  choice: እግዚአብሔር ከእነርሱ ጋር ያደረገውን
  rationale: ποιέω በአጠቃላይ «ማድረግ» ማለት ሲሆን μετά ከዘር ቅጥያ ጋር በመሠረታዊነት «ከ...ጋር» ይላል። ይህ ምርጫ እግዚአብሔርን ዋና አድራጊ አድርጎ ሲያቀርብ፣ የሐዋርያቱን ተሳትፎ በአንድ ብቻ ትርጉም አይወስንም።
theological_decisions:
- issue: μετ’ αὐτῶν በሚለው ሐረግ የተገለጠው በእግዚአብሔር ሥራ ውስጥ የሰዎቹ ድርሻ
  choice: እግዚአብሔር ከእነርሱ ጋር ያደረገው
  alternative: እግዚአብሔር በእነርሱ በኩል ያደረገው፤ ወይም በመካከላቸው ያደረገው
  rationale: የግሪኩ ሐረግ ትርጉሙን ለብዙ አቅጣጫዎች ክፍት ያደርጋል። «ከእነርሱ ጋር» ዋናው አድራጊ እግዚአብሔር መሆኑን ጠብቆ፣ ሰዎቹ መሣሪያዎች መሆናቸውን ወይም ሥራው በመካከላቸው መፈጸሙን በግድ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ማኅበር» የአማኞችን ማኅበረሰብ ያመለክታል፤ «ሽማግሌዎች» ደግሞ በአውዱ የሚገኘውን የመሪነት ሚና ያስተላልፋል።
