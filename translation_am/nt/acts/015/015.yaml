  yaml_path: translation/nt/acts/015/015.yaml
  text: 'And with this the words of the prophets agree[a], just as it is written:'
translation:
  language: am
  text: የነቢያትም ቃሎች ከዚህ ጋር ይስማማሉ፤ እንዲህ ተብሎ እንደተጻፈ፦
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: -ም
  rationale: የያዕቆብን ቀጣይ ማስረጃ ከቀደመው ንግግር ጋር በተፈጥሯዊ የአማርኛ አያያዥ ያገናኛል።
- source_word: τούτῳ
  choice: ከዚህ ጋር
  rationale: የግሪኩን ዳቲቭ ከ συμφωνέω ጋር በተፈጥሯዊ አማርኛ ይገልጣል፤ ተውላጠ ስሙ ወደ ቀደመው ጉዳይ የሚያመለክተውን ሰፊ ትርጉም ይጠብቃል።
- source_word: συμφωνοῦσιν
  choice: ይስማማሉ
  rationale: የአሁን ጊዜ ብዙ ቁጥር ግስን በግልጽና በዘመናዊ አማርኛ ‘ይስማማሉ’ ብሎ ያቀርባል።
- source_word: οἱ λόγοι
  choice: ቃሎች
  rationale: በጽሑፍ የተቀመጡትን የነቢያት ንግግሮች ቀጥተኛና ተፈጥሯዊ በሆነ ቃል ይገልጣል።
- source_word: τῶν προφητῶν
  choice: የነቢያት
  rationale: የግሪኩን የባለቤትነት/ምንጭ ግንኙነት በተፈጥሯዊ የአማርኛ የ- አወቃቀር ይጠብቃል።
- source_word: καθὼς
  choice: እንደ
  rationale: የሚከተለው የመጽሐፍ ቃል ከተነገረው ጉዳይ ጋር ያለውን መጣጣም በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: γέγραπται
  choice: ተብሎ እንደተጻፈ
  rationale: የመጽሐፍ ጥቅስ መግቢያ የሆነውን ፍጹም ተደራጊ ቅርጽ በተለመደና ክብር ባለው የአማርኛ አገላለጽ ያቀርባል።
theological_decisions:
- issue: በያዕቆብ ንግግር ውስጥ የ τούτῳ ማመልከቻ
  choice: ቀደም ብሎ የተጠቀሰውን ክስተት ወይም አባባል በሰፊው የሚያመለክት ‘ከዚህ ጋር’
  alternative: ‘ከአሕዛብ መለወጥ ጋር’፣ ‘ከጴጥሮስ ንግግር ጋር’ ወይም ‘ከዚህ የእግዚአብሔር ዕቅድ ጋር’ ብሎ በግልጽ መወሰን
  rationale: የግሪኩ ተውላጠ ስም ማመልከቻውን በግልጽ አይጠቅስም፤ ስለዚህ ትርጉሙ አንድን ሥነ መለኮታዊ አተረጓጎም ሳይጭን የምንጩን ስፋት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ አማርኛ። ‘የነቢያትም ቃሎች’ የሚለው አጀማመር የግሪኩን አያያዥ ይጠብቃል፤ ‘ከዚህ ጋር’ ደግሞ የማመልከቻውን አሻሚነት ሳያጠብ ተፈጥሯዊ ሆኖ ይነበባል። በአማርኛ ‘ከዚህ ጋር ይስማማሉ’ የተለመደ ስለሆነ፣ የእንግሊዝኛውን ዳቲቭ አማራጭ የሚያብራራ የግርጌ ማስታወሻ አላስፈለገም።
