  alternative: ‘ከዘላለም ጀምሮ የታወቁ ናቸው’ ወይም ‘እነዚህን ነገሮች ከጥንት ጀምሮ የሚያሳውቅ’
  rationale: የSBLGNT ንባብ γνωστὰ ἀπ’ αἰῶνος እጅግ አጭር ነው። ትርጉሙ ይህን አጭርነትና አሻሚነት ይጠብቃል፤ ከረዥሙ የጽሑፍ ልዩነት ወይም ከሥነ መለኮታዊ ግምት ተጨማሪ ቃላትን አያስገባም።
translation_notes:
