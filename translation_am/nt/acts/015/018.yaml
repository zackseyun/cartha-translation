  rationale: ἀπό እዚህ የጊዜ መነሻን ያመለክታል፤ ‘ከ… ጀምሮ’ በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: αἰῶνος
  choice: ከጥንት
  rationale: በዚህ የጊዜ አገላለጽ αἰών ረጅም ያለፈ ጊዜን ወይም ጥንትን ሊያመለክት ይችላል። ‘ከጥንት’ የSBLGNTን አጭር ንባብ ይወክላል፤ ‘ከዘላለም’ የሚለውን ይበልጥ ጠንካራ አማራጭ ግን በግርጌ ማስታወሻ ያቆያል።
theological_decisions:
- issue: በዚህ አጭር ሐረግ የእግዚአብሔር ዕውቀት የጊዜ ወሰን
