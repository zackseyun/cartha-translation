lexical_decisions:
- source_word: γνωστὰ
  choice: የታወቁ ናቸው
  rationale: ግሉ ግስ በሌለው በዚህ አጭር ሐረግ ቅጽሉ እንደ ዜና አገልግሏል፤ ይህ አተረጓጎም ‘የታወቁ’ የሚለውን ቀጥተኛ ፍቺ ይጠብቃል፣ ‘የተገለጡ’ የሚል በግሪኩ ያልተገለጸ የድርጊት ሐሳብም አያክልም።
- source_word: ἀπ’
