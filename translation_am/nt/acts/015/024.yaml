  text: ἐπειδὴ ἠκούσαμεν ὅτι τινὲς ἐξ ἡμῶν ⸀ἐξελθόντες ἐτάραξαν ὑμᾶς λόγοις ἀνασκευάζοντες τὰς ψυχὰς ⸀ὑμῶν οἷς οὐ διεστειλάμεθα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/024.yaml
  text: Since we have heard that some went out from us and troubled you with words[a], unsettling your souls, to whom we gave no instructions[b],
translation:
  language: am
  text: ከእኛ ዘንድ የወጡ፣ እኛ ምንም መመሪያ ያልሰጠናቸው አንዳንድ ሰዎች በቃላቸው አውከዋችሁ፣ ነፍሳችሁንም እያናወጡ እንደሆነ ሰምተናልና፣
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπειδὴ ἠκούσαμεν
  choice: ሰምተናልና
  rationale: ለደብዳቤው ቀጣይ መግለጫ ምክንያት መሆኑን በተፈጥሯዊ አማርኛ ያሳያል፤ የደረሰው ወሬም አሁን ጠቀሜታ እንዳለው ያስተላልፋል።
- source_word: τινὲς ἐξ ἡμῶν ἐξελθόντες
  choice: ከእኛ ዘንድ የወጡ አንዳንድ ሰዎች
  rationale: ሰዎቹ ከኢየሩሳሌም ቡድን መካከል ተነሥተው መሄዳቸውን ያሳያል፤ ከቡድኑ መነሣታቸው ግን ፈቃድ እንደተሰጣቸው አያመለክትም።
- source_word: ἐτάραξαν ὑμᾶς λόγοις
  choice: በንግግራቸው እንዳወኳችሁ
  rationale: λόγοις የመሣሪያነት ኃይልን በተፈጥሯዊ አማርኛ ይገልጣል፤ ἐτάραξαν የሚያመለክተውን ጭንቀትና ብጥብጥም ያስተላልፋል።
- source_word: ἀνασκευάζοντες τὰς ψυχὰς ὑμῶν
  choice: ውስጣችሁን እንዳናወጡ
  rationale: ἀνασκευάζω በዚህ ዐውድ ማወክንና መናድን ያመለክታል፤ ψυχαί ደግሞ ስሜትን ብቻ ሳይሆን ውስጣዊ ማንነትን ስለሚያመለክት “ውስጣችሁን” ተመርጧል። ቃል በቃል አገላለጹ በማስታወሻ ተጠብቋል።
- source_word: οἷς οὐ διεστειλάμεθα
  choice: እኛ ምንም መመሪያ ሳንሰጣቸው
  rationale: ሰዎቹ ከሐዋርያትና ከሽማግሌዎች መመሪያ ወይም ሥልጣን እንዳልተሰጣቸው በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: አወኪዎቹ ከኢየሩሳሌም ቡድን ፈቃድ አግኝተው ይሁን አልሆነ የሚለው
  choice: እኛ ምንም መመሪያ ሳንሰጣቸው
  alternative: እኛ ምንም ሳናዛቸው
  rationale: የግሪኩ አንጻራዊ ሐረግ ለእነዚያ ሰዎች ትእዛዝ ወይም መመሪያ እንዳልተሰጣቸው ይክዳል። ትርጉሙ ይህን የፈቃድ እጦት ይጠብቃል፤ በግሪኩ የሌለ “ምንም እንኳ” የሚል የተቃርኖ ትስስር አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ጥቅሱ በግሪኩ የቀጣዩ ንግግር መግቢያ ስለሆነ በኮማ ተዘግቷል።
