  text: ποιήσαντες δὲ χρόνον ἀπελύθησαν μετ’ εἰρήνης ἀπὸ τῶν ἀδελφῶν πρὸς τοὺς ⸂ἀποστείλαντας αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/033.yaml
  text: And after spending some time there[a], they were sent off in peace from the brothers to those who had sent them.
translation:
  language: am
  text: በዚያም ለተወሰነ ጊዜ ከቆዩ በኋላ፣ ወንድሞች[a] ወደ ላኳቸው ሰዎች በሰላም አሰናበቷቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወንድሞችና እኅቶች።” የግሪኩ ቃል “ወንድሞች” ይላል፤ በዚህ ዐውድ ግን ሴቶችንም ጨምሮ የአማኞችን ማኅበረሰብ ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσαντες ... χρόνον
  choice: በዚያም የተወሰነ ጊዜ ከቆዩ በኋላ
  rationale: የግሪኩ ፈሊጣዊ አነጋገር ለተወሰነ ጊዜ መቆየትን ያመለክታል፤ ‘በዚያ’ በግሪኩ በቀጥታ ባይኖርም ከዐውደ ንባቡ የአንጾኪያን ቆይታ ለማመልከት ተጨምሯል።
- source_word: δὲ
  choice: -ም
  rationale: ትረካውን የሚያስቀጥል ለስላሳ አያያዥ ስለሆነ፣ በአማርኛ በተፈጥሯዊው አያያዥ ‘-ም’ ተተርጉሟል።
- source_word: ἀπελύθησαν
  choice: አሰናበቷቸው
  rationale: በዚህ ዐውድ ማሰርን ወይም ከሥራ ማሰናበትን ሳይሆን፣ ልዑካኑን በመልካም ምኞት መሸኘትን ያመለክታል። የግሪኩ ሐረግ ተገብሮ ቢሆንም፣ ተፈጥሯዊ አማርኛ እንዲሆን በአድራጊ አገባብ ቀርቧል።
- source_word: μετ’ εἰρήνης
  choice: በሰላም
  rationale: ሰላማዊ መሰናበትንና መልካም ምኞትን የሚገልጠውን የተለመደ አገላለጽ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἀπὸ τῶν ἀδελφῶν
  choice: ወንድሞች
  rationale: የግሪኩ ቃል በሰዋስው ወንድ ብዙ ቁጥር ነው፤ በዐውዱ ግን አማኙን ማኅበረሰብ በአጠቃላይ ሊያመለክት ይችላል። የምንጩ ቅርጽ በዋናው ጽሑፍ ተጠብቆ፣ አካታች ትርጉሙ በግርጌ ማስታወሻ ተገልጧል።
- source_word: πρὸς τοὺς ἀποστείλαντας αὐτούς
  choice: ወደ ላኳቸው ሰዎች እንዲመለሱ
  rationale: ሰዎቹ ከዚህ ቀደም ልዑካኑን የላኩ መሆናቸውን ያሳያል። ‘እንዲመለሱ’ የመድረሻውን አቅጣጫ በተፈጥሯዊ አማርኛ ይገልጣል፤ የመመለስ ሐሳብ ከዐውዱ ግልጽ ነው።
theological_decisions:
- issue: የἀδελφοί አካታች አጠቃቀም
  choice: ወንድሞች
  alternative: ወንድሞችና እኅቶች / አማኞች
  rationale: በዚህ ላይ የተለየ ዶክትሪናዊ ክርክር የለም። የግሪኩ ወንድ ብዙ ቁጥር ቅርጽ በዋናው ጽሑፍ ተጠብቋል፤ ቃሉ ሴቶችንም ጨምሮ የአማኞችን ማኅበረሰብ ሊያመለክት እንደሚችል በማስታወሻ ተገልጧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለሕዝብ ቀላል የሆነ አማርኛ ተጠቅሟል። ‘አሰናበቷቸው’ በዚህ ዐውድ ወዳጃዊ ሽኝትን ይገልጣል፤ ሐረጉ በአማርኛ ተፈጥሯዊ እንዲሆን የግሪኩ ተገብሮ አገባብ ወደ አድራጊ አገባብ ተለውጧል።
