  source_fidelity: The main clause and its two groups are accurately represented. However, the initial infinitival phrase በማንጻት can be read as specifying the means by which no distinction was made, whereas the Greek aorist participle more directly states that God had/was cleansing the Gentiles' hearts by faith. Recasting it as an adverbial perfective participle better preserves the Greek relationship without forcing a temporal sequence.
  naturalness: The wording is generally clear modern standard Amharic. Placing the faith phrase with the cleansing verb and using አንጽቶ yields a more natural, direct sentence.
  terminology: እምነት for πίστις, ልብ for καρδία, and ማንጻት for καθαρίζειν are appropriate and doctrinally neutral. The footnote alternative is retained and its anchor is placed immediately after በእምነት.
