    text: “በእምነት አማካኝነት” ተብሎም ሊተረጎም ይችላል፤ የግሪኩ ዳቲቭ መንገድን ወይም መሣሪያነትን ሊገልጽ ይችላል።
    reason: lexical_alternative
lexical_decisions:
