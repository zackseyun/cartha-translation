  rationale: የግሪኩን ፈሊጣዊ አገላለጽ በተፈጥሯዊና ግልጽ አማርኛ ያስተላልፋል፤ እግዚአብሔር ሁለቱን ወገኖች ለይቶ እንዳልተመለከተ ያሳያል።
- source_word: μεταξὺ ἡμῶν τε καὶ αὐτῶν
  choice: በእኛና በእነርሱ መካከል
  rationale: የτε ... καὶን ጥምረት በተለመደው የአማርኛ አነጋገር ያቀርባል።
- source_word: τῇ πίστει
  choice: በእምነት
  rationale: πίστιςን ‘እምነት’ ብሎ ይተረጉማል፤ የዳቲቭ ቅርጹም እዚህ መንገድን ወይም መሣሪያነትን ሊገልጽ ስለሚችል ‘በእምነት’ ተብሏል።
- source_word: καθαρίσας
  choice: በማንጻት
  rationale: የአኦሪስት ተውሳከ ግስን ከዋናው ግስ ጋር በተፈጥሯዊ አማርኛ ያያይዛል፤ የመንጻትን ምስልም ይጠብቃል።
- source_word: τὰς καρδίας αὐτῶν
  choice: ልባቸውን
  rationale: καρδία የውስጥ ሰውነትን የሚወክል ‘ልብ’ በሚለው መደበኛና መጽሐፍ ቅዱሳዊ ቃል ተተርጉሟል።
theological_decisions:
- issue: የπίστις ትርጉም
  choice: እምነት
  alternative: መታመን
  rationale: በዚህ አውድ πίστις የእምነትን መንገድ ይገልጻል፤ ‘እምነት’ ትክክለኛ፣ የተለመደና በአማርኛ የነገረ መለኮት ልዩ አቋም የማይጨምር ነው።
- issue: የκαθαρίσας ጊዜያዊ ዝምድና
  choice: በማንጻት
  alternative: ካነጻ በኋላ
  rationale: የግሪኩ ተውሳከ ግስ ቀዳሚ ወይም አብሮ የተፈጸመ ድርጊትን ሊያመለክት ይችላል። ‘ካነጻ በኋላ’ ብሎ ጊዜያዊ ቅደም ተከተሉን ከሚገባው በላይ ከመወሰን ይልቅ ‘በማንጻት’ የግሪኩን ክፍትነት ይጠብቃል።
