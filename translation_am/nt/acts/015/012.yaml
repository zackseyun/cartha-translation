base_translation:
  language: en
  yaml_path: translation/nt/acts/015/012.yaml
  text: And the whole assembly fell silent[a], and they listened to Barnabas and Paul as they related what signs and wonders God had done among the Gentiles through them.
translation:
  language: am
  text: ሕዝቡ ሁሉ ዝም አለ፤ በርናባስና ጳውሎስ እግዚአብሔር በእነርሱ አማካይነት በአሕዛብ[a] መካከል ያደረጋቸውን ምልክቶችና ድንቆች ሲተርኩ ያዳምጣቸው ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በብሔራት መካከል።” በዚህ የኢየሩሳሌም ጉባኤ ዐውድ ἔθνεσιν በተለይ አይሁድ ያልሆኑትን ሕዝቦች ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐσίγησεν
  choice: ዝም አለ
  rationale: የግሱን አንድ ጊዜያዊና ወደ ዝምታ መግባትን የሚያሳይ ትርጉም በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: πᾶν τὸ πλῆθος
  choice: ሕዝቡም ሁሉ
  rationale: በስብሰባው የነበረውን መላ የተሰበሰበ ሕዝብ በግልጽና በተለመደ አማርኛ ይገልጣል።
- source_word: ἤκουον
  choice: ያዳምጡ ነበር
  rationale: የግሪኩ የኢምፐርፌክት ቅርጽ የሚያሳየውን ቀጣይና ትኩረት ያለው ማዳመጥ ይጠብቃል።
- source_word: Βαρναβᾶ καὶ Παύλου
  choice: በርናባስና ጳውሎስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመዱትን የስም ቅርጾች ይጠቀማል።
- source_word: ἐξηγουμένων
  choice: ሲተርኩ
  rationale: ዝርዝር ዘገባ መስጠትን ወይም የሆነውን መናገርን ያመለክታል፤ ትርጓሜ መስጠትን በማያስገድድ መንገድ ይተረጉማል።
- source_word: ὅσα ἐποίησεν ὁ θεὸς σημεῖα καὶ τέρατα
  choice: እግዚአብሔር ... ያደረጋቸውን ምልክቶችና ድንቆች
  rationale: ὅσα ከምልክቶችና ድንቆች ጋር ያለውን ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል፤ እግዚአብሔርንም የድርጊቱ ባለቤት አድርጎ ይጠብቃል።
- source_word: ἐν τοῖς ἔθνεσιν
  choice: በአሕዛብ መካከል
  rationale: በኢየሩሳሌም ጉባኤ ዐውድ ውስጥ ቃሉ አይሁድ ያልሆኑትን ሕዝቦች በተለይ ያመለክታል፤ የቃሉ ሰፊ አማራጭ በማስታወሻው ተጠብቋል።
- source_word: δι’ αὐτῶν
  choice: በእነርሱ አማካይነት
  rationale: እግዚአብሔር ዋና ፈጻሚ፣ በርናባስና ጳውሎስ ደግሞ መሣሪያዎቹ መሆናቸውን ግልጽ ያደርጋል።
theological_decisions:
- issue: በሐዋርያዊው ተልእኮ ውስጥ የመለኮታዊ ድርጊት ባለቤትነት
  choice: ምልክቶቹንና ድንቆቹን ያደረገው እግዚአብሔር ሲሆን፣ በርናባስና ጳውሎስ የተገለጹት በእነርሱ አማካይነት እንደሠራ ነው።
  alternative: በርናባስና ጳውሎስ ምልክቶቹንና ድንቆቹን በዋናነት እንዳደረጉ ማቅረብ።
  rationale: ὁ θεὸς የἐποίησεν ሰዋሰዋዊ ባለቤት ሲሆን፣ δι’ αὐτῶν ሐዋርያቱን መሣሪያዊ አማካዮች አድርጎ ያቀርባል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ሕዝቡም ሁሉ” ከጥንታዊው “ማኅበሩ” ይልቅ ተፈጥሯዊ ሲሆን፣ “ያዳምጡ ነበር” የቀጣይ ማዳመጥን ይጠብቃል።
