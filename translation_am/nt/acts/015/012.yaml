  source_fidelity: The draft correctly represents the silence of the whole gathered group, their ongoing attentive listening, Barnabas and Paul’s recounting, God as the actor, and the missionaries as the means through whom the signs and wonders occurred. The listener-object relation is not fully explicit in the Amharic clause and is best clarified.
