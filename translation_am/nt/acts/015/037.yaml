    reason: lexical_alternative
  revision_rationale: The revision changes only the number of the infinitival action from plural to singular, aligning it with Barnabas as the grammatical and implied subject. The footnote is retained as a permissible word-order alternative that places the additive sense more explicitly with the name phrase.
