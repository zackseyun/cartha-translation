lexical_decisions:
- source_word: Βαρναβᾶς
  choice: በርናባስ
  rationale: የግል ስም ስለሆነ በተለመደው የአማርኛ የመጽሐፍ ቅዱስ አጻጻፍ ተገለበጠ።
- source_word: δὲ
  choice: ግን
  rationale: ከቀደመው የጳውሎስ ሐሳብ ጋር ያለውን ቀላል ንጽጽር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐβούλετο
  choice: ፈለገ
  rationale: የበርናባስን ፍላጎት ወይም ዓላማ በግልጽና በዘመናዊ አማርኛ ይገልጣል፤ የግሪኩ ያልተጠናቀቀ ጊዜ አገባብ እዚህ በትረካዊው አውድ ቀላል ያለፈ ጊዜ ሆኖ ተተርጉሟል።
- source_word: συμπαραλαβεῖν
  choice: አብረው ሊወስዱት
  rationale: ግሱ አንድን ሰው ከቡድኑ ጋር አብሮ መውሰድን ያመለክታል። የብዙ ቁጥር ቅጽ በርናባስና ጳውሎስ አብረው የሚያደርጉትን ጉዞ ከአውዱ ያንጸባርቃል።
- source_word: καὶ
  choice: -ም
  rationale: ከተሳቢው ጋር የተያያዘውን ‘ደግሞ/እንዲሁም’ የሚለውን ጭማሪ በተፈጥሯዊ የአማርኛ ቅጥያ ያስተላልፋል።
- source_word: Ἰωάννην
  choice: ዮሐንስን
  rationale: የግል ስም ስለሆነ በተለመደው የአማርኛ የመጽሐፍ ቅዱስ ቅርጽ ተሰጠ።
- source_word: τὸν καλούμενον Μᾶρκον
  choice: ማርቆስ የሚባለውን
  rationale: ዮሐንስ በሌላው ስሙ ማርቆስ እንደሚባል የሚለየውን የአሁን ጊዜ ተሳቢ ሐረግ በተፈጥሯዊና ክብር ባለው አማርኛ ይገልጣል።
- source_word: Μᾶρκον
  choice: ማርቆስ
  rationale: የግል ስም ስለሆነ በተለመደው የአማርኛ የመጽሐፍ ቅዱስ አጻጻፍ ተገለበጠ።
