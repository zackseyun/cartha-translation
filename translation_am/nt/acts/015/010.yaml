language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: νῦν οὖν τί πειράζετε τὸν θεόν, ἐπιθεῖναι ζυγὸν ἐπὶ τὸν τράχηλον τῶν μαθητῶν ὃν οὔτε οἱ πατέρες ἡμῶν οὔτε ἡμεῖς ἰσχύσαμεν βαστάσαι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/010.yaml
  text: Now then[c][b][a], why are you testing God by putting a yoke on the neck of the disciples that neither our fathers nor we have been able to bear?
translation:
  language: am
  text: እንግዲህ፣ እኛም ሆንን አባቶቻችን ልንሸከመው ያልቻልነውን ቀንበር[b] በደቀ መዛሙርቱ አንገት ላይ በመጫን እግዚአብሔርን ለምን ትፈትናላችሁ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እግዚአብሔርን ለፈተና ለምን ታቀርባላችሁ?”
    reason: lexical_alternative
  - marker: b
    text: “ቀንበር” የተጫነ ግዴታን የሚወክል ዘይቤ ነው፤ በዚህ አውድ በደቀ መዛሙርቱ ላይ የሚጫኑ መስፈርቶችን ያመለክታል።
    reason: cultural_note
lexical_decisions:
- source_word: νῦν οὖν
  choice: እንግዲህ
  rationale: የሐሳብ መደምደሚያና ሽግግር ኃይልን በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: τί πειράζετε τὸν θεόν
  choice: እግዚአብሔርን ለምን ትፈትናላችሁ?
  rationale: πειράζω እዚህ ‘መፈተን/ፈተና ላይ ማዋል’ ማለት ሲሆን፣ τί በአገባቡ የምክንያት ጥያቄ ‘ለምን’ ሆኖ ተተርጉሟል።
- source_word: ἐπιθεῖναι
  choice: በመጫን
  rationale: የእግዚአብሔርን መፈተን በምን መንገድ እንደሚፈጽሙ የሚገልጠውን የማብራሪያ ግንኙነት ያሳያል።
- source_word: ζυγὸν
  choice: ቀንበር
  rationale: የተጫነ ግዴታን የሚወክለውን ግልጽ ዘይቤ ሳይተረጉም ይጠብቃል።
- source_word: ἐπὶ τὸν τράχηλον τῶν μαθητῶν
  choice: በደቀ መዛሙርቱ አንገት ላይ
  rationale: የቀንበሩን ምስላዊነት በቀጥታ ይጠብቃል፤ μαθηταί በሐዋርያት ሥራ የተለመደው ‘ደቀ መዛሙርት’ ተብሏል።
- source_word: οὔτε οἱ πατέρες ἡμῶν οὔτε ἡμεῖς
  choice: እኛም ሆንን አባቶቻችን
  rationale: ሁለቱንም ወገኖች የሚያስወግደውን οὔτε...οὔτε በተፈጥሯዊ የአማርኛ አገባብ ያቀርባል፤ ‘አባቶቻችን’ የቀድሞ የእስራኤል ትውልዶችን ያመለክታል።
- source_word: ἰσχύσαμεν βαστάσαι
  choice: ልንሸከመው ያልቻልነውን
  rationale: የመቻልን ሐሳብና ከቀንበር ጋር ያለውን የመሸከም ዘይቤ በተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: የ‘ቀንበር’ ዘይቤ ምንነት
  choice: የተጫነ ግዴታን የሚወክል ዘይቤ ሆኖ ተጠብቋል፤ ዋናው ጽሑፍ ግዴታውን ከዚህ በላይ አይወስንም።
  alternative: ቀንበሩን ሙሉው የሙሴ ሕግ ወይም ግርዛትና ተያያዥ መስፈርቶች ብቻ ብሎ በግልጽ መተርጎም።
  rationale: አውዱ በአሕዛብ አማኞች ላይ ስለሚጫኑ መስፈርቶች ቢናገርም፣ ይህ ቁጥር ራሱ ዘይቤውን ከዚያ በላይ አይገድብም፤ ስለዚህ ሥነ መለኮታዊ ውጥረቱ ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። የግሪኩ የቃላት ቅደም ተከተል ወደ ተፈጥሯዊ የአማርኛ አወቃቀር ተስተካክሏል፤ የቀንበሩ ምስልና የንግግሩ ወቀሳዊ ጥያቄ ግን ተጠብቀዋል።
