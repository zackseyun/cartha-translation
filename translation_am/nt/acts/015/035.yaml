  rationale: ያልተፈጸመው የግስ ቅርጽ በአንድ ቦታ ለተወሰነ ጊዜ መቆየትን ያሳያል፤ «ቆዩ» ይህን ቀጣይነት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: διδάσκοντες
  choice: እያስተማሩ
  rationale: ከመቆያቸው ጋር በአንድ ጊዜ የቀጠለውን የማስተማር ተግባር ይገልጣል።
- source_word: εὐαγγελιζόμενοι
  choice: ምሥራቹን ያውጁ ነበር
  rationale: ግሱ መልካም ዜናን ማብሰር ወይም ማወጅን ያመለክታል፤ ይህ አተረጓጎም ትርጉሙን በግልጽና በዘመናዊ አማርኛ ያቀርባል።
- source_word: μετὰ καὶ ἑτέρων πολλῶν
  choice: ከሌሎች ብዙ ሰዎች ጋርም
  rationale: ጳውሎስና በርናባስ ብቻቸውን እንዳልነበሩ ያሳያል፤ «-ም» የκαίን ጭማሪ ኃይል ይጠብቃል።
- source_word: λόγον
  choice: ቃል
  rationale: λόγος «ቃል» ወይም «መልእክት» ሊሆን ቢችልም፣ «የጌታ ቃል» በሐዋርያት ሥራ የሚደጋገም የታወቀ አገላለጽ ስለሆነ ሥነ ጽሑፋዊና ሥነ መለኮታዊ ቀጣይነቱ ተጠብቋል።
- source_word: κυρίου
  choice: ጌታ
  rationale: κύριος የክብር ማዕረጉን በሚጠብቀው የተለመደ የአማርኛ አቻ «ጌታ» ተተርጉሟል።
theological_decisions:
- issue: «የጌታ ቃል» በሚለው ውስጥ «ጌታ» የሚያመለክተው
  choice: የግሪኩን አገላለጽ ሳይወስን «ጌታ» ተብሎ ቀርቧል።
  alternative: «የጌታ ኢየሱስ ቃል» ወይም በሰፊ መለኮታዊ ትርጉም «ከጌታ የመጣው መልእክት»
  rationale: በሐዋርያት ሥራ «ጌታ» በተለይ ኢየሱስን ሊያመለክት ቢችልም፣ ግሪኩ κύριος የሚለውን ማዕረግ ብቻ ስለሚጠቀም ትርጉሙ ከምንጩ በላይ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የቀጠለውን ተግባር ለማሳየት «እያስተማሩ ... ያውጁ ነበር» የሚለው ተፈጥሯዊ የአማርኛ አወቃቀር ተመርጧል።
