base_translation:
  language: en
  yaml_path: translation/nt/acts/015/035.yaml
  text: But Paul and Barnabas stayed in Antioch[a], teaching and proclaiming the good news of the word of the Lord[c][b], with many others also.
translation:
  language: am
  text: ነገር ግን ጳውሎስና በርናባስ በአንጾኪያ ቆዩ፤[a] ከሌሎች ብዙ ሰዎች ጋርም የጌታን ቃል[c] እያስተማሩ ምሥራቹን ያውጁ ነበር።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በአንጾኪያ የተወሰነ ጊዜ አሳለፉ።» የግሪኩ ግስ በዚያ ለተወሰነ ጊዜ መቆየታቸውን ሊያጎላ ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «ወንጌልን ይሰብኩ ነበር።» የግሪኩ ቃል ምሥራችን ማብሰር ወይም ማወጅ ማለት ነው።
    reason: lexical_alternative
  - marker: c
    text: «የጌታ ቃል» በሐዋርያት ሥራ ውስጥ የጌታን መልእክት ለማመልከት በተደጋጋሚ የሚገኝ አገላለጽ ነው፤ «የጌታ መልእክት» ብሎ መተርጎምም ይቻላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: διέτριβον
