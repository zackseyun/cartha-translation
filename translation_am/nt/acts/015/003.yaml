  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οἱ μὲν οὖν προπεμφθέντες ὑπὸ τῆς ἐκκλησίας διήρχοντο τήν ⸀τε Φοινίκην καὶ Σαμάρειαν ἐκδιηγούμενοι τὴν ἐπιστροφὴν τῶν ἐθνῶν, καὶ ἐποίουν χαρὰν μεγάλην πᾶσι τοῖς ἀδελφοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/003.yaml
  text: So then[a], having been sent on their way by the church, they passed through both Phoenicia and Samaria, describing in detail the conversion of the Gentiles[b], and they brought great joy to all the brothers.
translation:
  language: am
  text: እነርሱም በቤተ ክርስቲያን ለጉዞአቸው ከተሸኙ በኋላ፣ በፊንቄና በሰማርያ በኩል እያለፉ የአሕዛብን መመለስ[a] በዝርዝር ይናገሩ ነበር፤ ለወንድሞችም[b] ሁሉ ታላቅ ደስታ አመጡ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የአሕዛብን መለወጥ።”
    reason: lexical_alternative
  - marker: b
    text: እዚህ “ወንድሞች” የሚለው ቃል ሴቶችንም ጨምሮ በአጠቃላይ አማኞችን የሚያመለክት ይመስላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: προπεμφθέντες
  choice: ለጉዞአቸው ከተሸኙ
  rationale: ግሱ ተጓዦቹን በእርዳታ ወይም በአጃቢነት ለመንገድ ማሰናበትን ሊያመለክት ስለሚችል፣ ‘ተላኩ’ ከሚለው ይልቅ የጉዞውን ገጽታ ይጠብቃል።
- source_word: ἐκκλησίας
  choice: ቤተ ክርስቲያን
  rationale: በዚህ ዐውድ ቃሉ የክርስቲያኖችን ማኅበረሰብ ያመለክታል፤ ይህም በዘመናዊ አማርኛ የተለመደው አገላለጽ ነው።
- source_word: διήρχοντο
  choice: በኩል እያለፉ
  rationale: ያልተጠናቀቀውንና ቀጣይ የነበረውን በክልሎቹ ውስጥ የማለፍ ጉዞ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τε ... καὶ
  choice: በፊንቄና በሰማርያ
  rationale: የሁለቱን ክልሎች ተያያዥነት የአማርኛው ‘-ና’ አያያዥ በተፈጥሮ ያሳያል።
- source_word: ἐκδιηγούμενοι
  choice: በዝርዝር ይናገሩ ነበር
  rationale: የተጠናከረው ግስ ዘገባው ሰፊና ዝርዝር እንደነበር ያመለክታል።
- source_word: ἐπιστροφὴν
  choice: መመለስ
  rationale: ቃሉ አሕዛብ ወደ እምነት መዞራቸውን ያመለክታል፤ ‘መመለስ’ የመዞርን ምስል ሳያጠፋ የኋለኛ ዘመን ቴክኒካዊ ትርጉምን አያስገባም።
- source_word: τῶν ἐθνῶν
  choice: የአሕዛብን
  rationale: በሐዋርያት ሥራ 15 ዐውድ ቃሉ አይሁድ ያልሆኑትን ሕዝቦች ያመለክታል፤ ‘አሕዛብ’ ይህን ልዩነት በግልጽ ይጠብቃል።
- source_word: ἐποίουν χαρὰν μεγάλην
  choice: ታላቅ ደስታ አመጡ
  rationale: የግሪክኛውን ምክንያታዊ ፈሊጥ ‘ታላቅ ደስታን አስከተሉ’ በሚል ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἀδελφοῖς
  choice: ለወንድሞች
  rationale: የግሪክኛውን ወንድ ፆታ ያለውን ብዙ ቁጥር ቅርጽ በዋናው ጽሑፍ ይጠብቃል፤ ቃሉ ሴቶችንም የሚጨምሩ አማኞችን ሊያመለክት መቻሉ በማስታወሻ ተገልጿል።
theological_decisions:
- issue: ἐπιστροφή ከአሕዛብ መካተት ጋር ያለው ትርጉም
  choice: መመለስ
  alternative: መለወጥ
  rationale: ጥቅሱ አሕዛብ በወንጌል አገልግሎት ምክንያት ወደ እምነት መዞራቸውን ይዘግባል። ‘መመለስ’ የምንጩን የመዞር ምስል ጠብቆ ያስተላልፋል፤ ‘መለወጥ’ የሚለው የተለመደ አማራጭ በማስታወሻ ቀርቧል።
- issue: ἀδελφοί በድብልቅ የአማኞች ማኅበረሰብ ዐውድ
  choice: ወንድሞች
  alternative: ወንድሞችና እህቶች / አማኞች
  rationale: ዋናው ጽሑፍ የምንጩን ሰዋሰዋዊ ቅርጽ ይጠብቃል፤ በዚህ ዐውድ ቃሉ ሴት አማኞችንም ሊያካትት መቻሉ በማስታወሻ ተብራርቷል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። የግሪክኛው ቀጣይ የጉዞና የዘገባ እንቅስቃሴ ‘እያለፉ ... ይናገሩ ነበር’ በሚል ተጠብቋል። በእንግሊዝኛው የምክክር ጽሑፍ ውስጥ የማስታወሻ ምልክቶቹ ከማስታወሻዎቹ ይዘት ጋር የተዛቡ ስለነበሩ፣ [a] ከ‘መመለስ’ በኋላ፣ [b] ደግሞ ከ‘ወንድሞች’ በኋላ በምንጩና በማስታወሻው ይዘት መሠረት ተቀምጠዋል።
