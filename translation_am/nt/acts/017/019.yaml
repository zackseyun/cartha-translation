  text: እነርሱም ይዘውት ወደ አርዮስፋጎስ[a] ወሰዱትና፣ “ይህ አንተ የምትናገረው[b] አዲስ ትምህርት ምን እንደሆነ ልናውቅ እንችላለን?” አሉት።
  philosophy: optimal-equivalence
  footnotes:
