  choice: “አርዮስፋጎስ” የሚለውን የተጸውዖ ስም በመጠቀም የቦታና የምክር ቤት አሻሚነትን መጠበቅ
  alternative: “የአሬስ ኮረብታ” ብሎ እንደ ቦታ ብቻ መተርጎም፤ ወይም “የአርዮስፋጎስ ምክር ቤት” ብሎ እንደ ተቋም ብቻ መወሰን
