  terminology: “ኢያሶን,” “ወንድሞች,” “የከተማው ባለሥልጣናት,” and “ዓለም” are appropriate. The cultural note correctly identifies πολιτάρχας as a local Macedonian civic title, without importing unwarranted interpretation.
