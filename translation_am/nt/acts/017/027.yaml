  text: እግዚአብሔርን እንዲፈልጉ፣ ምናልባት እርሱን እየዳሰሱ ፈልገው ያገኙት እንደሆነ፤[a] እርሱ ግን ከእያንዳንዳችን የራቀ አይደለም።
  philosophy: optimal-equivalence
  footnotes:
