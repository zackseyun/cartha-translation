    text: ወይም፣ “እርሱን በንክኪ ፈልገው።” የግሪኩ ግስ ግንዛቤ በተወሰነበት ሁኔታ፣ እንደ በጨለማ ውስጥ፣ በንክኪ እየፈለጉ መዳሰስን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
