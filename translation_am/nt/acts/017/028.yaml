id: ACT.17.28
reference: Acts 17:28
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐν αὐτῷ γὰρ ζῶμεν καὶ κινούμεθα καὶ ἐσμέν, ὡς καί τινες τῶν καθ’ ὑμᾶς ποιητῶν εἰρήκασιν· Τοῦ γὰρ καὶ γένος ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/028.yaml
  text: For in him we live and move and exist, as even some of your own poets have said, ‘For we also are his offspring.’
translation:
  language: am
  text: ምክንያቱም በእርሱ እንኖራለን፣ እንንቀሳቀሳለን፣ ሕልውናም አለን፤ ከእናንተ መካከል ያሉ አንዳንድ ገጣሚዎችም፣ “እኛም የእርሱ ዘር ነን” ብለው እንደተናገሩት።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτῷ
  choice: በእርሱ
  rationale: የግሪኩን መሠረታዊ ግንኙነት ጠብቆ፣ ሕይወት፣ እንቅስቃሴና ሕልውና በእግዚአብሔር ውስጥ/በእርሱ እንደሚሆኑ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ζῶμεν καὶ κινούμεθα καὶ ἐσμέν
  choice: የምንኖረው፣ የምንንቀሳቀሰውና ሕልውና ያለን
  rationale: ሦስቱን ትይዩ ግሶች ይጠብቃል፤ ἐσμένን ከቀላል ‘ነን’ ይልቅ በዚህ ዐውድ ‘ሕልውና ያለን’ ብሎ መተርጎም የመኖርን ሐሳብ በግልጽ ያሳያል።
- source_word: τινες τῶν καθ’ ὑμᾶς ποιητῶν
  choice: ከገጣሚዎቻችሁም አንዳንዶቹ
  rationale: ‘ከእናንተ ወገን የሆኑ’ የሚለውን ሐሳብ በተፈጥሯዊና ቀጥተኛ አማርኛ ‘ገጣሚዎቻችሁ’ ይገልጣል።
- source_word: γένος
  choice: ዘር
  rationale: እዚህ ‘ዘር/ወገን/ልጆች’ ሊያመለክት ይችላል፤ ‘ዘር’ የጥቅሱን ሰፊ የዘር ሐረግ ሐሳብ ሳያጠብ ይጠብቃል።
theological_decisions:
- issue: ‘በእርሱ’ የሚለው የግንኙነት አገላለጽ
  choice: በእርሱ
  alternative: በእርሱ ውስጥ
  rationale: ግሪኩ ἐν ሁለቱንም አገላለጾች ሊፈቅድ ቢችልም፣ ‘በእርሱ’ በአማርኛ ምንጭነትንና የሕልውና ጥገኝነትን በተፈጥሯዊ ሁኔታ ያሳያል፤ የቦታ ትርጉምን ብቻ አያስገድድም።
- issue: ‘የእርሱ ዘር’ የሚለውን አባባል እንደ ‘የእግዚአብሔር ልጆች’ ማብራራት
  choice: የእርሱ ዘር
  alternative: የእርሱ ልጆች
  rationale: γένος የትውልድ ወይም የዘር ግንኙነትን ይገልጣል፤ ‘ልጆች’ በማለት መተርጎም ጽሑፉ በግልጽ ያልወሰነውን የመንፈሳዊ ልጅነት ትርጉም ሊያስገባ ስለሚችል ግልጽነቱ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ሦስትዮሽ አወቃቀርና የግጥም ጥቅሱ ተጠብቀዋል፤ የግጥም መስመሮቹን በጥቅስ ምልክት መለየት የንግግሩን መዋቅር ያብራራል።
