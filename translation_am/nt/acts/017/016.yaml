  yaml_path: translation/nt/acts/017/016.yaml
  text: While Paul was waiting for them in Athens[b][a], his spirit was provoked within him as he saw that the city was full of idols.
translation:
  language: am
  text: ጳውሎስ በአቴና እነርሱን እየጠበቀ ሳለ፣ ከተማዋ በጣዖታት የተሞላች መሆኗን ሲመለከት[b]፣ መንፈሱ በውስጡ ተበሳጨ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «መንፈሱ በውስጡ ታወከ» ወይም «በውስጡ ተነሣሳ»፤ የግሪኩ ግስ ኃይለኛና ሹል የውስጥ መረበሽን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «ከተማዋ ለጣዖታት ተሰጥታ ነበር»።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκδεχομένου
  choice: እየጠበቀ ሳለ
  rationale: የግሪክ አሁናዊ አጋዥ ግስ ጳውሎስ ሌሎቹን በመጠበቅ ላይ የነበረበትን ቀጣይ ሁኔታ ያሳያል፤ ይህ አገላለጽ በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: παρωξύνετο
  choice: እጅግ ተበሳጨ
  rationale: ግሱ በውስጥ የተነሣ ኃይለኛና ሹል መረበሽን ያመለክታል። «ተበሳጨ» ቁጣን ብቻ ሳይወስን ይህን ውስጣዊ መነሣሣት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τὸ πνεῦμα αὐτοῦ ἐν αὐτῷ
  choice: መንፈሱ በውስጡ
  rationale: ባለቤትነት አመልካቹንና የውስጥ ስፍራ አጽንዖቱን በቀጥታ ይጠብቃል።
- source_word: θεωροῦντος
  choice: ሲመለከት
  rationale: ከውስጣዊ ምላሹ ጋር በአንድ ጊዜ የተከናወነውን በትኩረት ማየት ያሳያል።
- source_word: κατείδωλον
  choice: በጣዖታት የተሞላች
  rationale: ቅጽሉ ከተማዋ በጣዖታት እጅግ የተሞላች መሆኗን ያመለክታል፤ ይህ ከ«ለጣዖታት ተሰጥታ» ይልቅ ቀጥተኛና ግልጽ ነው።
- source_word: πόλιν
  choice: ከተማዋ
  rationale: በቀድሞው ሐረግ የተጠቀሰችውን አቴናን ያመለክታል፤ የግሪኩን «ከተማ» የሚለውን አጠራር ይጠብቃል።
- source_word: δὲ
  choice: በአማርኛ በተናጠል አልተተረጎመም
  rationale: እዚህ ያለው δέ ጠንካራ ንጽጽር ሳይሆን የትረካ ሽግግር ያሳያል፤ የአማርኛው የሐረግ አወቃቀር ይህን ያለ ተጨማሪ ቃል በተፈጥሮ ይሸከማል።
theological_decisions:
- issue: «መንፈሱ» የሚለው ማንን እንደሚያመለክት
  choice: የጳውሎስን የራሱን ውስጣዊ መንፈስ
  alternative: የመንፈስ ቅዱስ ቀስቃሽነትን የሚያመለክት ንባብ
  rationale: «የእርሱ መንፈስ» የሚለው የባለቤትነት አወቃቀርና «በእርሱ ውስጥ» የሚለው ሐረግ የጳውሎስን ውስጣዊ ምላሽ ያመለክታሉ። ጥቅሱ ይህን ምላሽ በግልጽ ለመንፈስ ቅዱስ አይሰጥም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። የአጋዥ ግሶቹ ግንኙነት ተፈጥሯዊ እንዲሆን ተደርጓል፣ የግሪኩ የትረካ ሽግግር ግን በማያስፈልግ የመክፈቻ ቃል አልተጨመረለትም።
