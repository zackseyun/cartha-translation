  text: Those who were escorting Paul brought him as far as Athens[a], and after receiving instructions for Silas and Timothy to come to him as quickly as possible[b], they departed.
translation:
  language: am
  text: ጳውሎስን እየሸኙ የነበሩት እስከ አቴና ድረስ[a] ወሰዱት፤ ለሲላስና ለጢሞቴዎስ በተቻለ ፍጥነት ወደ እርሱ እንዲመጡ የሚል መመሪያ[b] ተቀብለው ሄዱ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወደ አቴና።” የግሪኩ ሐረግ በዚህ ቀላል መንገድም ሊተረጎም ይችላል፤ “እስከ አቴና ድረስ” ግን ጳውሎስን እስከዚያ መድረሻ ድረስ እንደሸኙት ያሳያል።
    reason: lexical_alternative
  - marker: b
