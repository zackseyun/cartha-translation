  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὡς δὲ ἔγνωσαν οἱ ἀπὸ τῆς Θεσσαλονίκης Ἰουδαῖοι ὅτι καὶ ἐν τῇ Βεροίᾳ κατηγγέλη ὑπὸ τοῦ Παύλου ὁ λόγος τοῦ θεοῦ, ἦλθον κἀκεῖ σαλεύοντες ⸂καὶ ταράσσοντες⸃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/013.yaml
  text: But when the Jews from Thessalonica learned that the word of God had been proclaimed by Paul in Berea also[a], they came there too[b], stirring up and troubling the crowds.
translation:
  language: am
  text: ነገር ግን ከተሰሎንቄ የመጡት አይሁድ፣ የእግዚአብሔር ቃል በቤርያም በጳውሎስ እንደተሰበከ ባወቁ ጊዜ፣ ወደዚያም መጥተው ሕዝቡን እያነሳሱ እና እያወኩ ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ
  choice: ነገር ግን ... ባወቁ ጊዜ
  rationale: δέ ከቀደመው ትረካ ጋር ያለውን መጠነኛ ንፅፅር በ«ነገር ግን» ያሳያል፤ ὡς ደግሞ በዚህ ዐውድ ጊዜን ያመለክታል።
- source_word: ἔγνωσαν
  choice: ባወቁ
  rationale: እዚህ ግሱ አንድን ዜና መስማትንና ማወቅን ያመለክታል፤ «ባወቁ» በአማርኛ ተፈጥሯዊ ነው።
- source_word: οἱ ἀπὸ τῆς Θεσσαλονίκης Ἰουδαῖοι
  choice: ከተሰሎንቄ የመጡት አይሁድ
  rationale: ተቃዋሚዎቹን በመጡበት ቦታ ይለያል፤ አይሁድን ሁሉ በአጠቃላይ አያመለክትም።
- source_word: ὅτι καὶ ἐν τῇ Βεροίᾳ
  choice: በቤርያም ... እንደ
  rationale: ከቦታው ስም ጋር የተያያዘው «-ም» መልእክቱ እንደ ተሰሎንቄ ሁሉ በቤርያም መሰበኩን ያሳያል።
- source_word: κατηγγέλη
  choice: እንደተሰበከ
  rationale: የግሪኩ ግስ የሕዝብ ፊት ማወጅን ያመለክታል፤ «ተሰበከ» በዚህ ሐዋርያዊ ዐውድ ተፈጥሯዊና ግልጽ ነው።
- source_word: ὑπὸ τοῦ Παύλου
  choice: በጳውሎስ
  rationale: ὑπό ከባለቤት አገናዛቢ ጋር በተደራጊ ግስ የድርጊቱን ፈጻሚ ያመለክታል።
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: የእግዚአብሔር ቃል
  rationale: የመለኮት መልእክትን የሚያመለክተውን የተለመደ መጽሐፍ ቅዱሳዊ አገላለጽ ይጠብቃል።
- source_word: ἦλθον κἀκεῖ
  choice: ወደዚያም መጥተው
  rationale: κἀκεῖ የተቃውሞ እንቅስቃሴያቸውን ወደ ቤርያምም እንዳስፋፉ ያሳያል።
- source_word: σαλεύοντες
  choice: ያነሳሱና
  rationale: ሕዝብን ለሁከት ማነሳሳትን ወይም ማወክን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: καὶ ταράσσοντες
  choice: ረበሹ
  rationale: ሁለተኛው ግስ ከማነሳሳት በተጨማሪ ሁከትና መታወክ ማስከተላቸውን ያሳያል።
- source_word: τοὺς ὄχλους
  choice: ሕዝቡን
  rationale: ὄχλοι የተሰበሰቡ ሰዎችን ያመለክታል፤ «ሕዝቡን» ከ«መንጋ» ይልቅ ገለልተኛና ተፈጥሯዊ ነው።
theological_decisions:
- issue: ὁ λόγος τοῦ θεοῦ የሚለውን አገላለጽ መተርጎም
  choice: የእግዚአብሔር ቃል
  alternative: የእግዚአብሔር መልእክት
  rationale: «ቃል» የሚለው የመጽሐፍ ቅዱስ ድምፅንና መለኮታዊ መልእክት የመሆኑን ክብደት ይጠብቃል፤ ከዐውዱ በላይ የሆነ ቴክኒካዊ ትርጉም አይጨምርም።
