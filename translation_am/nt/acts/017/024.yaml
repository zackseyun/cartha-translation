  text: ὁ θεὸς ὁ ποιήσας τὸν κόσμον καὶ πάντα τὰ ἐν αὐτῷ, οὗτος οὐρανοῦ καὶ γῆς ⸂ὑπάρχων κύριος⸃ οὐκ ἐν χειροποιήτοις ναοῖς κατοικεῖ
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/024.yaml
  text: The God who made the world and everything in it[a], being Lord of heaven and earth, does not dwell in temples made by hands.
translation:
  language: am
  text: ዓለምንና በዓለም ውስጥ ያሉትን ሁሉ የፈጠረው አምላክ፣ የሰማይና የምድር ጌታ ሆኖ፣ በሰው እጆች በተሠሩ ቤተ መቅደሶች[a] አይኖርም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “በእጆች በተሠሩ”፤ ሐረጉ ሰዎች የሠሯቸውን ቤተ መቅደሶች ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσας
  choice: የፈጠረው
  rationale: የግሪኩ የተካናወነ ድርጊት አመልካች ቦዝ አንቀጽ ὁ θεόςን ይገልጣል። ዓለምን ስለማድረግ ሲነገር ‘የፈጠረው’ በአማርኛ ተፈጥሯዊና ግልጽ ሲሆን ποιέω በዚህ አውድ ያለውን ትርጉም ያስተላልፋል።
- source_word: κόσμον
  choice: ዓለምን
  rationale: በዚህ አውድ κόσμος መላውን የተፈጠረ ዓለም ያመለክታል፤ ‘ዓለም’ በዘመናዊ አማርኛ ሰፊውን ትርጉም በተፈጥሮ ይይዛል።
- source_word: πάντα τὰ ἐν αὐτῷ
  choice: በውስጡ ያለውን ሁሉ
  rationale: πάντα ያለውን አጠቃላይነት ይጠብቃል፣ αὐτῷም ወደ ‘ዓለም’ መመለሱን በግልጽ ያሳያል።
- source_word: ὑπάρχων κύριος
  choice: ጌታ ሆኖ
  rationale: ὑπάρχων የሚገልጠውን ያለ ሁኔታ ይጠብቃል፤ ተካፋይ አንቀጹን ምክንያታዊ በማድረግ ‘ጌታ ስለሆነ’ ብሎ አይወስነውም።
- source_word: κύριος
  choice: ጌታ
  rationale: እዚህ ቃሉ በሰማይና በምድር ላይ ያለውን የአምላክ ሉዓላዊ ሥልጣን ያመለክታል፤ ‘ጌታ’ ይህን በተለመደ መንገድ ያስተላልፋል።
- source_word: οὐρανοῦ καὶ γῆς
  choice: የሰማይና የምድር
  rationale: ሁለቱ የባለቤትነት ቅጾች κύριοςን ይወስናሉ፤ ‘የሰማይና የምድር ጌታ’ በአማርኛ ግልጽና የተለመደ አገላለጽ ነው።
- source_word: χειροποιήτοις
  choice: በሰው እጅ በተሠሩ
  rationale: ቃሉ በሰው እጆች የተሠራን ነገር ያመለክታል። ‘በሰው እጅ’ የሚለው ሰው ሠራሽነቱን በዘመናዊ አማርኛ ግልጽ ያደርጋል።
- source_word: ναοῖς
  choice: ቤተ መቅደሶች
  rationale: ναός እንደ መለኮታዊ ማደሪያ የሚታሰብን ቤተ መቅደስ ያመለክታል፤ ብዙ ቁጥሩም ‘ቤተ መቅደሶች’ ተብሎ ተጠብቋል።
- source_word: κατοικεῖ
  choice: አይኖርም
  rationale: κατοικέω በአንድ ስፍራ መኖርን ወይም ማደርን ያመለክታል። ‘አይኖርም’ በዘመናዊ አማርኛ ግልጽ ሆኖ ከቤተ መቅደስ ጋር ያለውን ንፅፅር ይጠብቃል።
theological_decisions:
- issue: የአምላክ ከፍጥረት በላይነትና በቤተ መቅደስ ውስጥ መወሰን
  choice: ፈጣሪውና የሰማይና የምድር ጌታ በሰው በተሠሩ ቤተ መቅደሶች እንደማይኖር ጽሑፉ በቀጥታ ይናገራል።
  alternative: ‘አምላክ በቤተ መቅደሶች ሊወሰን አይችልም’ ብሎ ትርጉሙን በማብራሪያ መግለጽ።
  rationale: ትርጉሙ የግሪኩን ቀጥተኛ ንግግር ይጠብቃል፤ ጽሑፉ በግልጽ ከሚለው በላይ የሥነ መለኮት ማብራሪያ አይጨምርም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። ‘ጌታ ሆኖ’ የግሪኩን ተካፋይ አንቀጽ አሻሚነት ሳያጠፋ ይጠብቃል። የእጅ ሥራነትን የሚያብራራው ማስታወሻ በሚመለከተው ‘ቤተ መቅደሶች’ ላይ [a] ተያይዟል።
