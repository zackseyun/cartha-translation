  choice: ትንሣኤ የሚለውን የጋራ ስም በዋናው ጽሑፍ መጠቀም
  alternative: ‘ትንሣኤ’ን እንደ ሴት አምላክ ስም መውሰድ
  rationale: የሉቃስ ማብራሪያ ጳውሎስ ያበሰረውን ይዘት ይገልጻል። ነገር ግን ሰሚዎቹ የሌላ መለኮታዊ ፍጡር ስም እንደሆነ ተሳስተው ሰምተውት ሊሆን የሚችለው አማራጭ በማስታወሻ ተጠብቋል።
