  text: τινὲς δὲ καὶ τῶν Ἐπικουρείων ⸀καὶ Στοϊκῶν φιλοσόφων συνέβαλλον αὐτῷ, καί τινες ἔλεγον· Τί ἂν θέλοι ὁ σπερμολόγος οὗτος λέγειν; οἱ δέ· Ξένων δαιμονίων δοκεῖ καταγγελεὺς εἶναι· ὅτι τὸν Ἰησοῦν καὶ τὴν ἀνάστασιν εὐηγγελίζετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/018.yaml
  text: Some of the Epicurean and Stoic philosophers also engaged with him[a], and some were saying, “What is this babbler trying to say?” But others said[d][c][b], “He seems to be a proclaimer of foreign deities,” because he was proclaiming the good news about Jesus and the resurrection.
translation:
  language: am
  text: ከኤፊቆሮሳውያንና ከስቶይካውያን ፈላስፎችም አንዳንዶቹ ከእርሱ ጋር ይወያዩ ነበር።[a] አንዳንዶቹም፣ “ይህ ወሬኛ[b] ምን ማለት እየፈለገ ነው?” ይሉ ነበር። ሌሎቹ ግን፣ “የባዕድ አማልክትን[c] የሚያውጅ ይመስላል” አሉ፤[d] ይህንም ያሉት ስለ ኢየሱስና ስለ ትንሣኤ የምሥራች ያበሥር ስለነበር ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከእርሱ ጋር ይከራከሩ ነበር” ወይም “ይነጋገሩ ነበር”፤ የግሪኩ ግስ ንቁ ውይይትንም ክርክርንም ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “ወሬኛ” የንቀት ቃል ነው። የግሪኩ ቃል በቃል “ዘር ለቃሚ” ሲሆን፣ የተበታተኑ የሐሳብ ፍርፋሪዎችን ሰብስቦ የሚደግም ሰውን ያመለክታል።
    reason: cultural_note
  - marker: c
    text: ወይም፣ “የባዕድ መለኮታዊ ፍጥረታት”፣ “እንግዳ አማልክት” ወይም “የባዕድ አጋንንት”። እዚህ ተናጋሪዎቹ በራሳቸው አረማዊ አስተሳሰብ የማያውቋቸውን መለኮታዊ ፍጥረታት ማለታቸው ነው እንጂ፣ በኋለኛው ክርስቲያናዊ ፍቺ ክፉ መናፍስትን ማለታቸው የግድ አይደለም።
    reason: alternative_reading
  - marker: d
    text: አንዳንድ ተርጓሚዎች፣ ጳውሎስ ስለ ኢየሱስና ስለ ትንሣኤ ሲያውጅ፣ አቴናውያኑ “ትንሣኤ”ን የሌላ መለኮታዊ ፍጡር ስም አድርገው ተሳስተው ሰምተውት ሊሆን ይችላል ይላሉ።
