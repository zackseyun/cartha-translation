- source_word: Τί ἂν θέλοι ... λέγειν
  choice: ምን ሊል ፈልጎ ነው?
  rationale: ἄν ከምኞት አንቀጽ ጋር ያለውን ግምታዊና ትንሽ የንቀት ስሜት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Ξένων δαιμονίων
  choice: የባዕድ አማልክት
  rationale: በአቴናውያኑ አረማዊ አስተሳሰብ የማያውቋቸውን መለኮታዊ ፍጥረታት ያመለክታል፤ ‘አጋንንት’ ማለት ኋለኛውን ክርስቲያናዊ አጠቃቀም ወደ ተናጋሪዎቹ አስተሳሰብ ሊያስገባ ይችላል።
- source_word: καταγγελεὺς
  choice: አዋጅ ነጋሪ
  rationale: በይፋ የሚያውጅ ወይም የሚናገር ሰውን የሚያመለክት፣ ግልጽና ክብር ያለው ዘመናዊ አገላለጽ ነው።
- source_word: εὐηγγελίζετο
