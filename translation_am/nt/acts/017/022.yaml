base_translation:
  language: en
  yaml_path: translation/nt/acts/017/022.yaml
  text: So Paul[a], standing in the midst of the Areopagus, said, “Men of Athens, I see that in every way you are very religious.”
translation:
  language: am
  text: ጳውሎስም በአርዮስፋጎስ መካከል ቆሞ እንዲህ አለ፤ “የአቴና ወንዶች ሆይ፣ በሁሉም ነገር እጅግ ሃይማኖተኞች[a] እንደሆናችሁ አያለሁ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እጅግ አጉል አማኞች” ወይም “ይበልጥ ሃይማኖተኞች።” የግሪኩ ቃል በነቀፋም ሆነ በአዎንታዊ ስሜት ሊወሰድ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Σταθεὶς
  choice: ቆሞ
  rationale: የግሪኩን የትዕይንት አቀራረብና የጳውሎስን አቋቋም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δὲ
  choice: -ም
  rationale: በትረካው ውስጥ ያለውን ለስላሳ ሽግግር በአማርኛ ተፈጥሯዊ አያያዥ ያሳያል።
- source_word: ἐν μέσῳ τοῦ Ἀρείου Πάγου
  choice: በአርዮስፋጎስ መካከል
  rationale: ሐረጉን በቀጥታ ቦታዊ ትርጉሙ ያቀርባል፤ ‘በአርዮስፋጎስ ፊት’ ብሎ የምክር ቤት ትርጉምን አያስገድድም።
- source_word: Ἀρείου Πάγου
  choice: አርዮስፋጎስ
  rationale: የግሪክ ስሙን በድምፅ ቅርበት ያስተላልፋል፤ በላቲን ባህላዊ አቻ ስም አይተካውም።
- source_word: ἔφη
  choice: እንዲህ አለ
  rationale: በአማርኛ የንግግር መግቢያ ሆኖ ግልጽና ተፈጥሯዊ ነው።
- source_word: Ἄνδρες Ἀθηναῖοι
  choice: የአቴና ሰዎች ሆይ
  rationale: መደበኛውን የቀጥታ አድራሻ ቅርጽ ይጠብቃል፤ ‘ሰዎች’ በዘመናዊ አማርኛ ከ‘ወንዶች’ ይልቅ ለሕዝባዊ ንግግር ተፈጥሯዊ ነው።
- source_word: κατὰ πάντα
  choice: በሁሉም ነገር
  rationale: የሐረጉን ሰፊ ወሰን በግልጽ አማርኛ ይጠብቃል።
- source_word: θεωρῶ
  choice: አያለሁ
  rationale: ከቀጥተኛ ምልከታ የሚመጣውን መገንዘብ በቀላልና ተፈጥሯዊ ቃል ያቀርባል።
- source_word: δεισιδαιμονεστέρους
  choice: እጅግ ሃይማኖተኞች
  rationale: የግሪኩ ቃል አዎንታዊ፣ ገለልተኛ ወይም ነቀፋዊ ጥላ ሊኖረው ይችላል። ዋናው ጽሑፍ የጳውሎስን ጥንቃቄ ያለው መግቢያ ከመጠን በላይ ሳይወስን ያቀርባል፤ አማራጮቹ በማስታወሻ ተጠብቀዋል።
theological_decisions:
- issue: ጳውሎስ δεισιδαιμονεστέρους በማለት ለአቴናውያን ሃይማኖታዊነት የሰጠው ድምፀት
  choice: በዋናው ጽሑፍ በአንጻራዊነት ገለልተኛ የሆነውን ‘እጅግ ሃይማኖተኞች’ መጠቀም
  alternative: ‘እጅግ አጉል አማኞች’ ወይም ‘ይበልጥ ሃይማኖተኞች’
  rationale: ቃሉ በግሪክ አዎንታዊም ሆነ ነቀፋዊ ሊሰማ ይችላል። ነቀፋዊውን ብቻ በዋና ጽሑፍ መምረጥ የንግግሩን ስልታዊ አሻሚነት ያጠፋል፤ ንጽጽራዊው ትርጉምም የንጽጽሩ መለኪያ ሳይገለጽ በአማርኛ ያልተሟላ ሊመስል ይችላል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የቀጥታ ንግግሩ መደበኛነት ‘ሆይ’ በሚለው የአድራሻ ቅርጽ ተጠብቋል።
