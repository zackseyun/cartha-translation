id: ACT.17.1
reference: Acts 17:1
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Διοδεύσαντες δὲ τὴν Ἀμφίπολιν καὶ ⸀τὴν Ἀπολλωνίαν ἦλθον εἰς Θεσσαλονίκην, ὅπου ⸀ἦν συναγωγὴ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/001.yaml
  text: After passing through Amphipolis and Apollonia[a], they came to Thessalonica[b], where there was a synagogue of the Jews.
translation:
  language: am
  text: አምፊጶሊስንና አጵሎንያን አቋርጠው ወደ ተሰሎንቄ መጡ፤ በዚያም የአይሁድ ምኩራብ ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διοδεύσαντες
  choice: አቋርጠው
  rationale: የግሪኩ የቀደመ ድርጊት አመልካች ተሳቢ ግስ፣ ከዋናው ‘መጡ’ በፊት በከተሞቹ ውስጥ አልፈው መጓዛቸውን ያሳያል፤ ‘አቋርጠው’ ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δὲ
  choice: —
  rationale: እዚህ ላይ ለትረካው ለስላሳ መሸጋገሪያ ነው፤ በአማርኛ በግድ በተለየ ቃል መተርጎም አያስፈልግም።
- source_word: Ἀμφίπολιν
  choice: አምፊጶሊስን
  rationale: የቦታውን ስም በአማርኛ የመጽሐፍ ቅዱስ አጻጻፍ ልማድ መሠረት በድምፅ ቅርበት ተጽፏል።
- source_word: Ἀπολλωνίαν
  choice: አጵሎንያን
  rationale: የቦታውን ስም በተለመደው የአማርኛ መጽሐፍ ቅዱስ አጻጻፍ ተከትሎ ያቀርባል።
- source_word: ἦλθον
  choice: መጡ
  rationale: ቀላሉን የመንቀሳቀስ ግስ በቀጥታ ያስተላልፋል፤ ብዙ ቁጥር ባለቤቱም ከአውዱ ይታወቃል።
- source_word: εἰς Θεσσαλονίκην
  choice: ወደ ተሰሎንቄ
  rationale: εἰς ወደ መድረሻ የሚደረግን እንቅስቃሴ ያመለክታል፤ ‘ወደ’ በአማርኛ ተፈጥሯዊና ትክክለኛ ነው።
- source_word: ὅπου
  choice: በዚያም
  rationale: የቦታ አመልካቹን ‘በዚያ’ በተፈጥሯዊ የአማርኛ ትረካ ያቀርባል፤ ‘ም’ የአረፍተ ነገሩን ትስስር ያሳያል።
- source_word: συναγωγὴ
  choice: ምኩራብ
  rationale: ለአይሁድ የስብሰባና የአምልኮ ስፍራ በአማርኛ የተለመደው ቃል ነው። ግሪኩ የውስንነት አመልካች የለውም፤ አማርኛም እዚህ ላይ ለ‘አንድ’ ልዩ መስተዋድድ ስለማያስፈልገው በባዶ ስም ተተርጉሟል።
- source_word: τῶν Ἰουδαίων
  choice: የአይሁድ
  rationale: የዘርና የሃይማኖት ማኅበሩን ከምኩራቡ ጋር የሚያያይዘውን የግሪክ ባለቤትነት/ዝምድና አገባብ በቀጥታ ያስተላልፋል።
theological_decisions:
- issue: በትረካዊ አውድ Ἰουδαίωνን መተርጎም
  choice: አይሁድ
  alternative: ይሁዳውያን
  rationale: እዚህ ቃሉ በተሰሎንቄ ካለው ምኩራብ ጋር የተያያዘውን የአይሁድ ማኅበር ያመለክታል እንጂ በይሁዳ አገር የሚኖሩትን ብቻ አይደለም፤ ‘አይሁድ’ በዚህ አውድ ግልጽና የተለመደ ነው።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለመደበኛ አንባቢ ቀላል የሆነ አማርኛ ይጠቀማል። የከተሞቹ ስሞች በተለመደው የአማርኛ መጽሐፍ ቅዱስ አጻጻፍ ቀርበዋል። በσυναγωγή ፊት የግሪክ የውስንነት አመልካች አለመኖሩ፣ በአማርኛ ምኩራብን ያለ ‘አንድ’ ወይም ‘ያ’ ማቅረብ በተፈጥሮ ስለሚያስተናግደው ያለ የግርጌ ማስታወሻ ተጠብቋል።
