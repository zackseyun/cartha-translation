base_translation:
  language: en
  yaml_path: translation/nt/acts/017/004.yaml
  text: And some of them were persuaded and joined Paul and Silas[a], along with a large number of the God-fearing Greeks and not a few of the leading women.
translation:
  language: am
  text: ከእነርሱም አንዳንዶቹ ተሳምነው ከጳውሎስና ከሲላስ ጋር ተቀላቀሉ[a]፤ እግዚአብሔርን ከሚፈሩ ግሪኮች እጅግ ብዙዎችና ከተከበሩ ሴቶች ጥቂት ያልሆኑም ተቀላቀሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ በይበልጥ ቀጥተኛ አገላለጽ፣ “ዕጣቸውን ከጳውሎስና ከሲላስ ጋር አደረጉ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: τινες ἐξ αὐτῶν
  choice: ከእነርሱም አንዳንዶቹ
  rationale: የክፍል አመልካቹን አገባብ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ‘እነርሱ’ በቀደመው ቁጥር የተጠቀሱትን የምኵራብ አድማጮች ያመለክታል።
- source_word: ἐπείσθησαν
  choice: ተረትተው
  rationale: የግሪኩን ተደራጊ ቅርጽና ‘ተሳምነው/አሳማኝ ሆኖላቸው’ የሚለውን ፍቺ ይጠብቃል፤ πιστεύω እንዳለ በግልጽ ‘አመኑ’ ብሎ አይተረጉምም።
- source_word: προσεκληρώθησαν
  choice: ከጳውሎስና ከሲላስ ጋር ተባበሩ
  rationale: ቃሉ ከሰዎች ጋር መያያዝንና ወደ እነርሱ ወገን መቀላቀልን ያመለክታል። ‘ተባበሩ’ ይህን ግንኙነት በግልጽ ዘመናዊ አማርኛ ይገልጣል፤ የቃሉ ይበልጥ ቀጥተኛ ምስላዊ አማራጭ በማስታወሻው ተቀምጧል።
- source_word: τῶν τε σεβομένων Ἑλλήνων
  choice: እግዚአብሔርን ከሚፈሩ ግሪኮችም
  rationale: በሐዋርያት ሥራ ዐውድ ይህ አገላለጽ የእስራኤልን አምላክ የሚያከብሩና ከአይሁድ አምልኮ ጋር ግንኙነት የነበራቸውን አሕዛብ ያመለክታል። ‘እግዚአብሔርን የሚፈሩ’ ይህን ታሪካዊ ሃይማኖታዊ ሁኔታ ያስተላልፋል።
- source_word: πλῆθος πολὺ
  choice: እጅግ ብዙዎች
  rationale: ብዛቱን በተፈጥሯዊና ግልጽ አማርኛ ይገልጣል።
- source_word: γυναικῶν τε τῶν πρώτων
  choice: ከታዋቂ ሴቶችም
  rationale: πρῶτος እዚህ የጊዜ ቅደም ተከተልን ሳይሆን ማኅበራዊ ክብርንና ዝናን ያመለክታል፤ ‘ታዋቂ’ ይህን በአጭሩ ያስተላልፋል።
- source_word: οὐκ ὀλίγαι
  choice: ጥቂት ያልሆኑ
  rationale: የሉቃስን የማቃለል አገላለጽ ሳያጠፋ ‘ብዙ’ የሚለውን አጽንዖት ያስተላልፋል።
- source_word: τε ... τε
  choice: …ም …ም
  rationale: ሁለቱን ተጨማሪ ቡድኖች የሚያገናኘውን የግሪክ አወቃቀር በተፈጥሯዊ የአማርኛ አያያዥ ቅጥያ ያቀርባል።
theological_decisions:
- issue: ἐπείσθησαν በግልጽ የእምነት ወይም የመለወጥ ቃል ይተርጎም ወይስ የግሪኩ የመሳመን ፍቺ ይጠበቅ?
  choice: ተረትተው
  alternative: አምነው
  rationale: ዐውዱ ለሐዋርያዊው ስብከት የተሰጠ ምላሽን ቢገልጥም፣ ግሪኩ πείθω እንጂ πιστεύω አይደለም። ስለዚህ የቃላቱን ልዩነት መጠበቅ እና ጽሑፉ ከሚለው በላይ ግልጽ የሆነ የመለወጥ ቃል አለመጨመር ተመርጧል።
- issue: σεβομένων Ἑλλήνων የሚለውን ሃይማኖታዊ መለያ ምን ያህል ግልጽ ማድረግ ይገባል?
  choice: እግዚአብሔርን የሚፈሩ ግሪኮች
  alternative: አምላኪ ግሪኮች / የሚያመልኩ ግሪኮች
  rationale: በሐዋርያት ሥራ ይህ አገላለጽ ከአይሁድ አምልኮ ጋር የተያያዙ አሕዛብን የሚጠቁም ነው። ‘እግዚአብሔርን የሚፈሩ’ የተከበረውን አካል በዐውዱ መሠረት ግልጽ ያደርጋል፣ ነገር ግን ከጽሑፉ ያልተገኘ የእምነት አቋም አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ የሚገባ አማርኛ ተጠቅሟል። የመጀመሪያው ግስ ከተጨማሪዎቹ ቡድኖች ጋር በአማርኛ እንዳይደበዝዝ ‘ተባበሩ’ በመጨረሻ ተደግሟል። የሉቃስ ‘ጥቂት ያልሆኑ’ የሚለው የአጽንዖት ዘይቤ ተጠብቋል።
