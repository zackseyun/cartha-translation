    text: ወይም “መለኮታዊው ማንነት” ወይም “መለኮታዊ ባሕርይ”። የግሪኩ τὸ θεῖον መለኮታዊ የሆነውን የሚያመለክት ሰፊ ቃል ነው፤ እዚህ በጳውሎስ ክርክር ውስጥ እውነተኛውን አምላክ ያመለክታል።
