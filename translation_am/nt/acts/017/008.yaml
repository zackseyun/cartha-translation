  text: And they disturbed the crowd and the city officials when they heard these things,[a]
translation:
  language: am
  text: ሕዝቡና የከተማው ባለሥልጣናት[a] እነዚህን ነገሮች በሰሙ ጊዜ ተረበሹ።
  philosophy: optimal-equivalence
  footnotes:
