lexical_decisions:
- source_word: ἐτάραξαν
  choice: አወኩ
  rationale: ግሱ ውስጣዊ መረበሽን ወይም ማኅበራዊ መናወጥን ሊያመለክት ይችላል፤ «አወኩ» ለሕዝቡም ለባለሥልጣናቱም የሚስማማ እና ከግሪኩ በላይ ጠላትነትን የማይጨምር ተፈጥሯዊ ምርጫ ነው።
- source_word: δὲ
  choice: -ም
  rationale: እዚህ δέ ትረካውን በቀስታ የሚያስቀጥል አያያዥ ነው፤ በ«እነዚህንም» ውስጥ ያለው «-ም» በአማርኛ ይህን ተግባር በተፈጥሮ ያሳያል።
- source_word: ὄχλον
  choice: ሕዝቡን
  rationale: ὄχλος የተሰበሰበን ሰው ብዛት ያመለክታል፤ «ሕዝቡ» በዚህ ትረካዊ አውድ ተፈጥሯዊ ሲሆን «ቡድን» ወይም «ረብሻ ፈጣሪ ሕዝብ» የሚሉ ቃላት የሌለውን ጠላትነት ሊጨምሩ ይችላሉ።
- source_word: πολιτάρχας
  choice: የከተማውን ባለሥልጣናት
  rationale: πολιτάρχης በመቄዶንያ የከተማ አስተዳደር የሥልጣን ማዕረግ ነበር፤ «የከተማው ባለሥልጣናት» ለዘመናዊ አንባቢ ትርጉሙን ግልጽ ያደርጋል፣ የፍርድ ቤት ሥልጣን ብቻ እንዳላቸውም አያስመስልም።
- source_word: ἀκούοντας ταῦτα
  choice: እነዚህን ነገሮች በሰሙ ጊዜ
  rationale: የአሁን ጊዜ አሳታፊው ሁለቱንም—ሕዝቡንና የከተማውን ባለሥልጣናት—ይገልጻል፤ ጊዜያዊ ንዑስ ሐረግ በአማርኛ ግንኙነቱን በግልጽና በተፈጥሮ ያቀርባል። «እነዚህን ነገሮች» የταῦταን ብዙ ቁጥር ይጠብቃል።
