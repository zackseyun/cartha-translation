lexical_decisions:
- source_word: καθότι
  choice: ምክንያቱም
  rationale: የቀደመው የንስሓ ጥሪ ምክንያት መሆኑን በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: ἔστησεν ἡμέραν
  choice: ቀን ወስኗል
  rationale: አምላክ የተወሰነና የተቋቋመ ቀን እንዳዘጋጀ የሚያሳየውን የἵστημι ኃይል ይጠብቃል።
- source_word: ἐν ᾗ μέλλει κρίνειν
  choice: የሚፈርድበትን
  rationale: የወደፊት የታቀደውን ፍርድ በአማርኛ ተፈጥሯዊ አንጻራዊ ሐረግ ያቀርባል።
- source_word: τὴν οἰκουμένην
  choice: በእርሱ የሚኖረውን ዓለም
  rationale: οἰκουμένη በቀጥታ ሰዎች የሚኖሩበትን ዓለም ያመለክታል፤ ይህ አገላለጽ የሰው ሁሉ ወሰንን ይጠብቃል።
- source_word: ἐν δικαιοσύνῃ
  choice: በጽድቅ
  rationale: δικαιοσύνηን በመደበኛው መጽሐፍ ቅዱሳዊና በዘመናዊ አማርኛ ግልጽ ቃል ይተረጉማል፤ የፍትሕ ሐሳቡ በማስታወሻ ተጠብቋል።
- source_word: ἐν ἀνδρὶ ᾧ ὥρισεν
  choice: እርሱ የሾመው ሰው
  rationale: ἀνήρ የሚያመለክተውን ወንድ ሰው በአውዱ የሚገባ ሁኔታ ያቀርባል፤ ὥρισεν ደግሞ በ‘ሾመው’ ተገልጿል። አማርኛ በዚህ አወቃቀር የእንግሊዝኛውን ያልተወሰነ መስተዋድድ በተለየ ቃል አይጠይቅም።
- source_word: πίστιν παρασχὼν πᾶσιν
  choice: ለሁሉ ማረጋገጫ ሰጥቷል
  rationale: παρέχειν πίστιν በዚህ አውድ እምነትን ማስገባት ሳይሆን ማስረጃ ወይም ዋስትና መስጠትን ያመለክታል፤ ‘ማረጋገጫ’ ይህን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἀναστήσας αὐτὸν ἐκ νεκρῶν
  choice: ያንንም ሰው ከሙታን በማስነሣት
  rationale: የአኦሪስት ተሳቢውን እንደ መንገድ በመተርጎም፣ ማረጋገጫው በትንሣኤው እንደተሰጠ ግልጽ ያደርጋል።
theological_decisions:
- issue: የδικαιοσύνη አተረጓጎም
  choice: በጽድቅ
  alternative: በፍትሕ
  rationale: ‘ጽድቅ’ የቃሉን ሰፊ መጽሐፍ ቅዱሳዊ ይዘት ይጠብቃል፤ በፍርድ አውድ የሚስማማው ‘ፍትሕ’ ግን እውነተኛ የቃል አማራጭ ስለሆነ በማስታወሻ ቀርቧል።
- issue: በπίστιν παρασχὼν πᾶσιν ውስጥ የπίστις ትርጉም
  choice: ማረጋገጫ
  alternative: ዋስትና፤ በቃል ቅርብ፦ እምነት
  rationale: ከπαρέχω ጋር ያለው አገባብ የሕዝብ ማስረጃ ወይም ዋስትና የመስጠት ሐሳብ አለው። ‘እምነት’ ብቻ ማለት በዚህ አውድ ሐሳቡን ሊያደበዝዝ ይችላል፤ ሆኖም የግሪኩ ቃል ቅርብ አማራጭ በማስታወሻ ተጠብቋል።
- issue: የἀνδρί አተረጓጎም
  choice: ሰው
  alternative: ወንድ ሰው
  rationale: በአማርኛ ‘ሰው’ በዚህ ዓይነት አውድ የተወሰነውን ወንድ ግለሰብ ተፈጥሯዊ ሁኔታ ይገልጻል፤ የ‘ያንንም ሰው’ ወንድ ተውላጠ ስም ማጣቀሻውን ያጸናል። ‘ወንድ ሰው’ ይበልጥ ቃል በቃል ቢሆንም እዚህ ከባድ ነው።
