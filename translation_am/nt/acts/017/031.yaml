  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ረጅም ሐረግ በአማርኛ ግልጽነት ሁለት ዋና ክፍሎች ተዋቅሯል፤ [a] እና [b] ምልክቶች በዋናው ጽሑፍ ውስጥ ተካተዋል።
