    reason: lexical_alternative
  - marker: b
    text: “ሳታውቁት የምታመልኩትን” ተብሎም ሊቀርብ ይችላል። አንዳንድ ትርጉሞች ማጣቀሻውን ግላዊ ያደርጉታል፤ ግሪኩ ግን ገለልተኛ አንጻራዊ ተውላጠ ስም፣ ማለትም “የምታመልኩትን ነገር” የሚያመለክት ቅርጽ ይጠቀማል።
    reason: alternative_reading
