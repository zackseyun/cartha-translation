  rationale: 'The revision corrects the indirect-question clause, improves idiomatic modern Amharic, and preserves the source''s explanatory relationship: their commendable disposition is demonstrated by eager reception and daily scriptural examination. It retains established biblical terminology and keeps both lexical alternatives anchored to their relevant words.'
