  alternative: “መልእክቱ”
  rationale: “ቃሉ” የግሪኩን ቅርጽና በሐዋርያት ሥራ ያለውን ትርጉማዊ ተያያዥነት ይጠብቃል፤ “መልእክቱ” ደግሞ በማስታወሻ ቀርቧል።
