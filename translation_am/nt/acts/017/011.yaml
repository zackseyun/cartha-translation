lexical_decisions:
- source_word: εὐγενέστεροι
  choice: የተሻለ አስተሳሰብ ነበራቸው
  rationale: ንጽጽራዊው ቅጽ የዘር ወይም የማኅበራዊ ክብርን ሊያመለክት ቢችልም፣ ተከታዩ ሐረግ ቃሉን በጉጉት መቀበላቸውንና መጻሕፍትን መመርመራቸውን በመግለጽ የሚደነቅ ዝንባሌያቸውን ያብራራል።
- source_word: οἵτινες
  choice: …ተቀብለው … ይመረምሩ ነበር
  rationale: አንጻራዊው ተውላጠ ስም የተሻለ አስተሳሰባቸውን የሚያብራራ ባሕርይ ያስገባል፤ በአማርኛ የግስ ተከታታይነት ይህን ግንኙነት ተፈጥሯዊ አድርጎ ያቀርባል።
- source_word: ἐδέξαντο τὸν λόγον
  choice: ቃሉን … ተቀብለው
  rationale: “ቃሉን ተቀበሉ” የግሪኩን አገላለጽና በሐዋርያት ሥራ ያለውን ትረካዊ ተያያዥነት ይጠብቃል።
- source_word: μετὰ πάσης προθυμίας
  choice: በሙሉ ጉጉት
  rationale: προθυμία ዝግጁነትን፣ ፈቃደኝነትን ወይም ጉጉትን ያመለክታል፤ πάσης የሚሰጠውን አጽንዖት “በሙሉ” ይጠብቃል።
- source_word: τὸ καθ’ ἡμέραν
  choice: በየቀኑ
  rationale: ሐረጉ ተደጋጋሚና የዕለት ተዕለት ተግባርን ያመለክታል።
- source_word: ἀνακρίνοντες
  choice: ይመረምሩ ነበር
  rationale: ግሱ በጥንቃቄ መመርመርንና ማጣራትን ያመለክታል፤ “መመርመር” በዚህ ዐውድ ግልጽና ተፈጥሯዊ ነው።
- source_word: τὰς γραφὰς
  choice: መጻሕፍትን
  rationale: በሉቃስ–ሐዋርያት ዐውድ γραφαί የአይሁድን ቅዱሳት መጻሕፍት ያመለክታል፤ “መጻሕፍት” የተለመደው የመጽሐፍ ቅዱስ አገላለጽ ነው።
- source_word: εἰ ἔχοι ταῦτα οὕτως
  choice: እነዚህ ነገሮች እንደዚያ ይሁኑ እንደሆነ
  rationale: የግሪኩን ቀጥተኛ ያልሆነ ጥያቄና “ነገሮቹ እንዲህ መሆናቸውን” የማጣራት ሐሳብ ይጠብቃል፣ በቀጥታ “እውነት” ብሎ አይፈታውም።
