  yaml_path: translation/nt/acts/017/011.yaml
  text: These were more noble-minded than those in Thessalonica[a], for they received the word with all eagerness[b], examining the Scriptures daily to see whether these things were so.
translation:
  language: am
  text: 'እነዚህ ግን በተሰሎንቄ ከነበሩት ይልቅ የሚደነቅ ባሕርይ ነበራቸው፤[a] ቃሉን በታላቅ ጉጉት ተቀብለው፣[b] እነዚህ ነገሮች እንደዚህ መሆናቸውን ለማየት መጻሕፍትን በየቀኑ ይመረምሩ ነበር።


    [a] ወይም፣ “ይበልጥ ክቡራን ነበሩ።” የግሪኩ ቃል ይበልጥ የሚደነቅ ባሕርይን ወይም፣ በዚህ ዐውድ ይህ ትርጉም አነስተኛ ዕድል ቢኖረውም፣ ከፍ ያለ ማኅበራዊ ደረጃን ሊያመለክት ይችላል።


    [b] ወይም፣ “መልእክቱን ተቀብለው።”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ይበልጥ ክቡራን ነበሩ።” የግሪኩ ቃል ይበልጥ የሚደነቅ ባሕርይን ወይም፣ በዚህ ዐውድ ይህ ትርጉም አነስተኛ ዕድል ቢኖረውም፣ ከፍ ያለ ማኅበራዊ ደረጃን ሊያመለክት ይችላል።
