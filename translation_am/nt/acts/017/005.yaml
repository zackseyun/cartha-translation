  rationale: The revision makes only safe source-based and idiomatic corrections. It uses direct Amharic wording for jealousy, regularizes the object phrase, conveys the hostile crowd sense in context, and reduces pronoun ambiguity without identifying the referents by name. It retains the civic sense of δῆμος and preserves the existing footnote’s function and anchor.
