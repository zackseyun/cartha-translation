  yaml_path: translation/nt/acts/005/028.yaml
  text: saying[a], “We strictly ordered you not to teach in this name, and look, you have filled Jerusalem with your teaching, and you intend to bring this man's blood upon us.”
translation:
  language: am
  text: እንዲህ አለ፦ “በዚህ ስም እንዳታስተምሩ በጥብቅ አዘዝናችሁ፤ እነሆ ግን፣ ኢየሩሳሌምን በትምህርታችሁ ሞልታችኋል፤ የዚህንም ሰው ደም በእኛ ላይ ልታመጡ[a] ትፈልጋላችሁ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም በይበልጥ ግልጽ አገላለጽ፣ “ለዚህ ሰው ሞት ተጠያቂ ልታደርጉን።” የግሪኩ “የዚህን ሰው ደም በእኛ ላይ ማምጣት” የሚል ሲሆን፣ የደም ዕዳን ወይም ለሞቱ ተጠያቂነትን የሚገልጽ ፈሊጣዊ አነጋገር ነው።
