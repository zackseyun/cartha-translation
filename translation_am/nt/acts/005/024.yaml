  rationale: λόγοι እዚህ ቀደም ሲል የተነገረውን ዘገባ ያመለክታል፤ ‘ወሬ’ በዚህ ዐውድ የደረሰውን መልእክት በተፈጥሯዊ አማርኛ ይገልጣል።
