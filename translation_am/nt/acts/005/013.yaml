  text: τῶν δὲ λοιπῶν οὐδεὶς ἐτόλμα κολλᾶσθαι αὐτοῖς, ἀλλ’ ἐμεγάλυνεν αὐτοὺς ὁ λαός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/013.yaml
  text: But none of the rest dared to join them; rather, the people held them in high esteem.
translation:
  language: am
  text: ከሌሎቹ ግን አንድም እንኳ ከእነርሱ ጋር ለመቀላቀል አልደፈረም፤ ይልቁንም ሕዝቡ እጅግ ያከብራቸው ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν λοιπῶν
  choice: ከሌሎቹ
  rationale: የግሪኩን ክፍል-ከጠቅላላ አገባብ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ቃሉ በዐውዱ የተጠቀሱትን ሌሎች ሰዎች ያመለክታል።
- source_word: οὐδεὶς ἐτόλμα
  choice: አንድም እንኳ … አልደፈረም
  rationale: ፍጹም አሉታዊነቱንና ድፍረት ማጣቱን በግልጽ ዘመናዊ አማርኛ ይገልጣል።
- source_word: κολλᾶσθαι αὐτοῖς
  choice: ከእነርሱ ጋር ለመቀላቀል
  rationale: κολλάομαι እዚህ ላይ ከቡድኑ ጋር መዋሃድን ወይም መቀላቀልን ያመለክታል፤ ትርጉሙ የመደበኛ አባልነትን ከሚያስገድድ ቃል ይልቅ ሰፊነቱን ይጠብቃል።
- source_word: ἐμεγάλυνεν αὐτοὺς ὁ λαός
  choice: ሕዝቡ … እጅግ ያከብራቸው ነበር
  rationale: ἐμεγάλυνεν በዚህ ዐውድ ታላቅ አድርጎ መቁጠርንና ከፍ ያለ ክብር መስጠትን ያሳያል። የግሪኩ ያልተፈጸመ ጊዜ ቅርጽ ቀጣይ አመለካከትን ስለሚያመለክት “ያከብራቸው ነበር” ተብሏል።
theological_decisions:
- issue: “ከሌሎቹ” የሚለው ማንን እንደሚያመለክት
  choice: ከሌሎቹ
  alternative: ከማያምኑት / ከሌሎቹ አማኞች
  rationale: የግሪኩ ጽሑፍ የቡድኑን ማንነት በግልጽ አይወስንም። ትርጉሙ ይህን እውነተኛ አሻሚነት ጠብቆ ለዐውዱ ይተወዋል።
- issue: ἀλλά የሚያሳየው ንጽጽር
  choice: ሁለተኛ “ግን”
  alternative: ይልቁንም
  rationale: ἀλλά በሁለቱ የሕዝብ ምላሾች—አለመቀላቀልና ማክበር—መካከል ያለውን ንጽጽር ያሳያል። “ግን” በአማርኛ ተፈጥሯዊ ሲሆን “ይልቁንም” ሊያመጣ የሚችለውን የቀጥተኛ ምትክነት ጥላ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩ የንጽጽር አወቃቀርና የ“ሌሎቹ” አሻሚነት ተጠብቀዋል፤ የግሪኩ ረዥም ሐረግ በአማርኛ ተፈጥሯዊ ሥርዓተ ነጥብ ቀርቧል።
