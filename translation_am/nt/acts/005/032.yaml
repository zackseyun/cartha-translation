lexical_decisions:
- source_word: μάρτυρες
  choice: ምስክሮች
  rationale: በሐዋርያት ሥራ ውስጥ የዓይን ምስክርነትንና ስለታየው ነገር መመስከርን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ῥημάτων
  choice: ነገሮች
  rationale: ῥῆμα ‘ቃል፣ ንግግር፣ ጉዳይ ወይም ነገር’ ሊያመለክት ይችላል። በዚህ አውድ ‘ነገሮች’ ሐዋርያቱ የሚመሰክሩላቸውን ክስተቶችና ጉዳዮች በተፈጥሯዊ ሁኔታ ይይዛል፤ ሌሎቹ አማራጮች በማስታወሻ ተጠብቀዋል።
- source_word: πνεῦμα τὸ ἅγιον
  choice: መንፈስ ቅዱስ
  rationale: በዘመናዊ መደበኛ አማርኛ የተለመደና ግልጽ አጠራር ነው።
- source_word: ἔδωκεν
  choice: የሰጠው
  rationale: የግሪክኛውን ያለፈ ድርጊት በአማርኛ የዝምድና ሐረግ በተፈጥሯዊ ሁኔታ ያቀርባል።
- source_word: πειθαρχοῦσιν
  choice: ለሚታዘዙ
  rationale: πειθαρχέω ሥልጣን ላለው መታዘዝን ያመለክታል፤ ‘መታዘዝ’ ይህን በቀጥታ ይገልጣል፣ ከቁጥር 29 አውድም ጋር ይስማማል።
- source_word: αὐτῷ
  choice: እርሱን
  rationale: ተውላጠ ስሙ ወደ እግዚአብሔር እንደሚመለስ ግልጽ ያደርጋል፤ ‘እግዚአብሔር’ን ደግሞ በመድገም አያከብድም።
theological_decisions:
- issue: መንፈስ ቅዱስ ከሐዋርያቱ ጋር አብሮ ምስክር ሆኖ መቅረቡ
  choice: “መንፈስ ቅዱስም ምስክር ነው” ተብሎ የተዘጋውን ግስ በግልጽ ማቅረብ
  alternative: “መንፈስ ቅዱስም” ብቻ ማለት
  rationale: ሁለተኛው የግሪክኛ ሐረግ ግስ የለውም፤ ነገር ግን ‘ምስክሮች ነን’ የሚለውን ሐሳብ ከመጀመሪያው ሐረግ ይወስዳል። በአማርኛ ግልጽ ለማድረግ የተዘጋው ሐሳብ ተገልጧል፤ በማስታወሻውም የግሪክኛው አወቃቀር ተጠብቋል።
- issue: መንፈስ ቅዱስን የሚገልጸው የዝምድና ሐረግ
  choice: “እግዚአብሔር ... የሰጠው መንፈስ ቅዱስ”
  alternative: “መንፈስ ቅዱስም፣ እርሱንም እግዚአብሔር ... ሰጠ”
  rationale: ግሪክኛው ὃ ከጾታ አልባው πνεῦμα ጋር በሰዋሰው ይስማማል። አማርኛ ይህን ዓይነት ሰዋሰዋዊ ጾታ ስለማይጠይቅ፣ የዝምድና ሐረጉ ተፈጥሯዊ ሆኖ ቀርቧል፤ የግሪክኛው ቅርጽ ላይ ያልተመሠረተ ተጨማሪ ትምህርታዊ ውሳኔ አልተጫነበትም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪክኛው የተዘጋ ግስ በአማርኛ ግልጽ ተደርጓል፤ የῥημάτων የትርጉም ስፋት ግን በግርጌ ማስታወሻ ተጠብቋል።
