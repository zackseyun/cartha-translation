    text: “እነዚህ ቃሎች” ወይም “እነዚህ ጉዳዮች” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: በግሪክኛው “መንፈስ ቅዱስም” ብቻ ይላል፤ “ምስክር ነው” የሚለው ሐሳብ ከቀደመው አረፍተ ነገር ይወሰዳል።
