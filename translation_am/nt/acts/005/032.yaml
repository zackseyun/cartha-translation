  text: And we are witnesses of these things[a], and so is the Holy Spirit[c][b], whom God has given to those who obey him.
translation:
  language: am
  text: እኛም የእነዚህ ነገሮች[a] ምስክሮች ነን፤ እግዚአብሔርም ለሚታዘዙት የሰጠው መንፈስ ቅዱስ ደግሞ ምስክር ነው[b]።
  philosophy: optimal-equivalence
  footnotes:
