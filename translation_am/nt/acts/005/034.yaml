  text: ἀναστὰς δέ τις ἐν τῷ συνεδρίῳ Φαρισαῖος ὀνόματι Γαμαλιήλ, νομοδιδάσκαλος τίμιος παντὶ τῷ λαῷ, ἐκέλευσεν ἔξω ⸀βραχὺ τοὺς ⸀ἀνθρώπους ποιῆσαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/034.yaml
  text: But a Pharisee named Gamaliel stood up in the council[a], a teacher of the law honored by all the people[b], and ordered the men to be put outside for a short time.
translation:
  language: am
  text: ነገር ግን ገማልያል የሚባል፣ በሕዝቡ ሁሉ ዘንድ የተከበረ የሕግ መምህር የሆነ አንድ ፈሪሳዊ በሸንጎው[a] ውስጥ ተነሥቶ፣ ሰዎቹን ለጥቂት ጊዜ ወደ ውጭ እንዲያስወጧቸው[b] አዘዘ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ሸንጎው” የሚለው የአይሁድን ገዢ ምክር ቤት፣ ማለትም ሳንሄድሪንን ያመለክታል።
    reason: cultural_note
  - marker: b
    text: ወይም፣ “ሰዎቹን ለጥቂት ጊዜ ወደ ውጭ እንዲያወጧቸው።” ግሪኩ ቃል በቃል “ሰዎቹን ለጥቂት ጊዜ ውጭ እንዲያደርጓቸው” ይላል፤ ይህም ለጊዜው ከዚያ እንዲወጡ ማድረግን የሚገልጽ ፈሊጥ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: ተነሥቶ
  rationale: የገማልያልን በጉባኤው መካከል ቆሞ መናገር የሚያስተዋውቅ ተፈጥሯዊ አማርኛ ሲሆን፣ የአካላዊ መነሣቱንም ሐሳብ ይጠብቃል።
- source_word: δέ
  choice: ነገር ግን
  rationale: በትረካው ውስጥ ወደ ገማልያል ጣልቃ ገብነት የሚያመራውን መጠነኛ ተቃርኖ ወይም ለውጥ ያሳያል።
- source_word: τις
  choice: አንድ
  rationale: አዲሱን ተሳታፊ በማይወሰን መንገድ ያስተዋውቃል፤ በአማርኛም «አንድ ፈሪሳዊ» ተፈጥሯዊ ነው።
- source_word: συνεδρίῳ
  choice: ሸንጎ
  rationale: የአይሁድን ገዢ ምክር ቤት የሚያመለክት ግልጽና የተለመደ አማርኛ ነው፤ ልዩ ስሙ በእግር ማስታወሻ ተገልጿል።
- source_word: Φαρισαῖος
  choice: ፈሪሳዊ
  rationale: የቡድኑን መጠሪያ በተለመደው የአማርኛ ቅርጽ ያቀርባል።
- source_word: ὀνόματι Γαμαλιήλ
  choice: ገማልያል የሚባል
  rationale: የግሪኩን «በስሙ ገማልያል» አገላለጽ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: νομοδιδάσκαλος
  choice: የሕግ መምህር
  rationale: ሕጉን የሚያስተምር ሰው የሚለውን የተዋሃደውን ስም ግልጽና ክብር ባለው ቋንቋ ይተረጉማል።
- source_word: τίμιος παντὶ τῷ λαῷ
  choice: በሕዝቡ ሁሉ ዘንድ የተከበረ
  rationale: ገማልያል በመላው ሕዝብ ዘንድ የነበረውን ማኅበራዊ ክብር ያሳያል፤ «እስራኤል» የሚለውን በግሪኩ የሌለ ማብራሪያ አይጨምርም።
- source_word: ἐκέλευσεν
  choice: አዘዘ
  rationale: በፍርድ ጉባኤው ሁኔታ ውስጥ ያለውን ባለሥልጣናዊ ትእዛዝ በአጭርና ትክክለኛ መንገድ ያሳያል።
- source_word: ἔξω ... ποιῆσαι
  choice: ወደ ውጭ እንዲያስወጧቸው
  rationale: ቃል በቃል «ውጭ እንዲያደርጓቸው» የሚለውን የግሪክ ፈሊጥ፣ ለጊዜው ከጉባኤው እንዲወጡ ማዘዝ በሚለው ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: βραχύ
  choice: ለጥቂት ጊዜ
  rationale: ድርጊቱ የሚቆይበትን አጭር ጊዜ በግልጽ ሁኔታ ይጠብቃል።
theological_decisions:
- issue: የτοὺς ἀνθρώπους ሰዋዊ ማጣቀሻና ጾታ
  choice: ሰዎቹን
  alternative: ወንዶቹን / ሐዋርያቱን
  rationale: በዐውዱ የተጠቀሱት በሸንጎው ፊት የቆሙት ወንድ ሐዋርያት ናቸው። ሆኖም ἀνθρώπους በዚህ ሥነ አገባብ «ሰዎቹን» ተብሎ በተፈጥሯዊ አማርኛ ሊተረጎም ይችላል፤ «ወንዶቹን» የሚለው አማርኛ እንግዳ ሲሆን «ሐዋርያቱን» ደግሞ ምንጩ በዚህ ቁጥር ያልደገመውን ማዕረግ ይጨምራል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። የግሪኩ ረጅም የስም ሐረግ ቅደም ተከተል ተጠብቆ፣ በአማርኛ ተፈጥሯዊ እንዲሆን የገማልያል መግለጫዎች ከዋናው ድርጊት በፊት ተደርድረዋል። በቀረበው የእንግሊዝኛ ጽሑፍ ውስጥ የእግር ማስታወሻ ምልክቶችና ማብራሪያዎቻቸው የተቀያየሩ ስለሚመስሉ፣ [a] ከ“ሸንጎው” ጋር፣ [b] ደግሞ ከወደ ውጭ ማስወጣት ፈሊጥ ጋር በትክክል ተያይዘዋል።
