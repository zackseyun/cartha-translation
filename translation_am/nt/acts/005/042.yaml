base_translation:
  language: en
  yaml_path: translation/nt/acts/005/042.yaml
  text: And every day[a], in the temple and from house to house, they did not stop teaching and proclaiming the good news that Jesus is the Messiah.
translation:
  language: am
  text: እነርሱም በየቀኑ በቤተ መቅደስና ከቤት ወደ ቤት እያስተማሩና ኢየሱስ መሲሑ መሆኑን የምሥራች እያወጁ አላቋረጡም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶσάν τε ἡμέραν
  choice: እነርሱም በየቀኑ
  rationale: “በየቀኑ” ድርጊቱ ያለማቋረጥ በልማድ መከናወኑን በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል፤ “ም” ደግሞ τε ን ከቀደመው ትረካ ጋር በማያያዝ ይወክላል።
- source_word: ἐν τῷ ἱερῷ
  choice: በቤተ መቅደሱ
  rationale: ἱερόν ሙሉውን የቤተ መቅደስ ግቢ ሊያመለክት ቢችልም፣ “በቤተ መቅደሱ” ያንን ሳያጠብ አጭርና የተለመደ አገላለጽ ነው።
- source_word: κατ’ οἶκον
  choice: ከቤት ወደ ቤት
  rationale: የκατά አከፋፋይ ኃይልን በመጠበቅ ተግባሩ በተለያዩ ቤቶች መከናወኑን ያሳያል፤ “በቤት” ብቻ ከሚለው ይበልጥ ግልጽ ነው።
- source_word: οὐκ ἐπαύοντο
  choice: አልተዉም
  rationale: የግሱን ቀጣይነትና ማቆም እንዳልፈለጉ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: διδάσκοντες
  choice: እያስተማሩ
  rationale: ቀጣይ የማስተማር ተግባርን ይወክላል፣ ከዋናው “አልተዉም” ጋርም በተፈጥሯዊ ሁኔታ ይጣመራል።
- source_word: εὐαγγελιζόμενοι
  choice: የምሥራቹን ከማብሰር
  rationale: ግሱ መልካም ዜናን ማወጅ የሚለውን ትርጉም ይዟል፤ “ማብሰር” ይህን በአጭር፣ ክቡርና የተለመደ መጽሐፍ ቅዱሳዊ አማርኛ ያቀርባል።
- source_word: τὸν χριστὸν Ἰησοῦν
  choice: ኢየሱስ መሲሑ እንደሆነ
  rationale: Χριστός እዚህ የክብር ስም በመሆኑ “መሲሕ” ተብሎ ተተርጉሟል። አገላለጹ የሚታወጀውን የዜና ይዘት—ኢየሱስ መሲሑ መሆኑን—በተፈጥሯዊ አማርኛ ግልጽ ያደርጋል።
theological_decisions:
- issue: Χριστός እንዴት እንደሚተረጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: በዚህ አውድ Χριστός እንደ ግላዊ ስም ሳይሆን ኢየሱስ ተስፋ የተሰጠው የተቀባ ንጉሥ መሆኑን የሚገልጽ የክብር ስም ነው፤ “መሲሑ” የማዕረጉን ትርጉም ይጠብቃል።
- issue: τὸν χριστὸν Ἰησοῦν ከεὐαγγελιζόμενοι በኋላ ያለው ሰዋሰዋዊ ኃይል
  choice: የአዋጁ ይዘት፦ “ኢየሱስ መሲሑ እንደሆነ”
  alternative: ቀጥተኛ ተሳቢ፦ “መሲሑን ኢየሱስን” ወይም “ኢየሱስ መሲሑን”
  rationale: የግሪኩ ተሳቢ ሐረግ የምሥራቹ ይዘት ሆኖም ወይም ኢየሱስን እንደ ሚታወጀው ሰው አድርጎም ሊወሰድ ይችላል። ዋናው ጽሑፍ በአማርኛ ግልጽና ተፈጥሯዊ የሆነውን የይዘት ንባብ ይጠቀማል፤ አማራጩ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ ነው። “ቤተ መቅደስ፣” “ምሥራች፣” እና “መሲሕ” የተለመዱ መጽሐፍ ቅዱሳዊ ቃላት ሲሆኑ አሮጌ ወይም ከመጠን በላይ ሥነ ሥርዓታዊ አገላለጽ አልተጠቀመም።
