- source_word: συνεδρίου
  choice: ሸንጎ
  rationale: የገዥዎችን የፍርድና የምክር ጉባኤ የሚያመለክት፣ ለአማርኛ አንባቢ የሚገባ ቃል ነው፤ ‘ሳንሄድሪን’ የሚለውን በድምፅ መቅዳት አያስፈልግም።
- source_word: κατηξιώθησαν
