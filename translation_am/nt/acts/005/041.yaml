  rationale: በአማርኛ ትረካ የተፈጥሮ ፍሰት ያለው አገላለጽ ነው፤ የግሪኩ ኢምፐርፌክት የሚያሳየውን ከሸንጎው ፊት የመሄድ ትዕይንት በአውዱ ይጠብቃል።
- source_word: χαίροντες
  choice: ደስ እያላቸው
  rationale: ከመሄዳቸው ጋር በአንድ ጊዜ የነበረውን ደስታ የሚያሳይ ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
