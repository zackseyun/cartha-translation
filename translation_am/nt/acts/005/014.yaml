  text: μᾶλλον δὲ προσετίθεντο πιστεύοντες τῷ κυρίῳ πλήθη ἀνδρῶν τε καὶ γυναικῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/014.yaml
  text: And even more believers in the Lord were being added—multitudes of both men and women[a].
translation:
  language: am
  text: ይልቁንም፣ በጌታ የሚያምኑ ብዙ ወንዶችና ሴቶች ይጨመሩ ነበር[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም «ይቀላቀሉ ነበር» ወይም «ተጨመሩ»። የግሪኩ ግስ ቁጥራቸው በቀጣይነት እየጨመረ መሄዱን ሊያመለክት ይችላል፤ ተደራጊ ቅርጹም እግዚአብሔር አድራጊው መሆኑን በስውር ሊጠቁም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: μᾶλλον δὲ
  choice: ከዚህ ይበልጥ…ም
  rationale: δέ በዚህ ስፍራ ቀላል የትረካ ትስስርን ያሳያል፤ μᾶλλον ደግሞ እየጨመረ መሄዱን ያጠናክራል። ይህ አገላለጽ ሁለቱንም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: προσετίθεντο
  choice: ይጨመሩ ነበር
  rationale: የግሪኩን ያልተጠናቀቀ ቀጣይነትና ተደራጊ ቅርጽ ይጠብቃል፤ ጨማሪውን በግልጽ ሳይጠቅስ መለኮታዊ አድራጊ ሊጠቆም የሚችለውን ስውር ሐሳብም ክፍት ያደርገዋል።
- source_word: πιστεύοντες τῷ κυρίῳ
  choice: በጌታ የሚያምኑ
  rationale: ተሳቢውን እንደ ስም የሚሠራ አገላለጽ አድርጎ ያቀርባል፤ እምነታቸው ወደ ጌታ የተመራ መሆኑንም በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: πλήθη ἀνδρῶν τε καὶ γυναικῶν
  choice: እጅግ ብዙ ወንዶችና ሴቶች
  rationale: πλήθη የሚያመለክተውን ብዛት በግልጽ ያስተላልፋል፤ τε καί የወንዶችንና የሴቶችን አብሮ መጠቀስ ይጠብቃል።
theological_decisions:
- issue: የ«ጌታ» ማጣቀሻና ኃይል
  choice: «ጌታ» የሚለው ማዕረግ እንዳለ ተጠብቆ፣ ሰዎቹ በጌታ የሚያምኑ ተብለዋል።
  alternative: በዋናው ጽሑፍ «ኢየሱስ» ብሎ ማብራራት ወይም በአጠቃላይ እግዚአብሔርን እንደሚያመለክት መተርጎም።
  rationale: በሐዋርያት ሥራ የወንጌል ማጠቃለያዎች ውስጥ κύριος ብዙ ጊዜ የተነሣውን ኢየሱስ ያመለክታል፤ ሆኖም ትርጉሙ የግሪኩን ማዕረግ በመጠበቅ ማጣቀሻውን በማብራሪያ አይተካም።
- issue: የπροσετίθεντο ድምፅና የድርጊት ቀጣይነት
  choice: ቀጣይ ተደራጊ ስሜት፦ «ይጨመሩ ነበር»
  alternative: መካከለኛ/ኢ-ተሻጋሪ ስሜት፦ «ይቀላቀሉ ነበር»
  rationale: ተደራጊው ቅርጽ ሰዎች በተከታታይ እየተጨመሩ መሆናቸውን ይጠብቃል፤ ግሪኩ በግልጽ ያልጠቀሰውን እግዚአብሔር እንደ አድራጊ በዋናው ጽሑፍ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። «ይጨመሩ ነበር» የግሪኩን ቀጣይ ተደራጊ አኳኋን ይጠብቃል።
