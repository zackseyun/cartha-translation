base_translation:
  language: en
  yaml_path: translation/nt/acts/005/021.yaml
  text: When they heard this[a], they entered the temple courts at daybreak and were teaching. But when the high priest arrived, and those with him, they called together the Sanhedrin and the whole council of the sons of Israel, and sent to the prison to have them brought.
translation:
  language: am
  text: እነርሱም ይህን ሰምተው፣ ጎህ ሲቀድ ወደ ቤተ መቅደስ ግቢ ገብተው እያስተማሩ ነበር። ሊቀ ካህናቱና ከእርሱ ጋር የነበሩት በደረሱ ጊዜ ግን፣ ሳንሄድሪኑንና የእስራኤል ልጆች መላውን የሽማግሌዎች ሸንጎ[a] ጠሩ፤ እነርሱንም እንዲያመጡ ወደ እስር ቤቱ ላኩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ይበልጥ ተፈጥሯዊ በሆነ አነጋገር፣ “የእስራኤል መላው ሸንጎ” ወይም “የእስራኤል ሽማግሌዎች ሁሉ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: ይህን ሰምተው
  rationale: የግሱ ቦዝ አንቀጽ ከቀደመው ቁጥር የመልአኩን ትእዛዝ ወደ ኋላ ያመለክታል፤ «ይህን» የሚለው በአማርኛ ግንኙነቱን ግልጽ ያደርጋል።
- source_word: ὑπὸ τὸν ὄρθρον
  choice: ጎህ ሲቀድ
  rationale: በማለዳ የጎህ ሰዓት መሆኑን ተፈጥሯዊና አጭር በሆነ አማርኛ ይገልጣል።
- source_word: ἱερόν
  choice: የቤተ መቅደሱ ግቢ
  rationale: ቃሉ የውስጠኛውን መቅደስ ብቻ ሳይሆን መላውን የቤተ መቅደስ ቅጥር ግቢ ያመለክታል።
- source_word: ἐδίδασκον
  choice: ያስተምሩ ነበር
  rationale: የግሱ ያልተፈጸመ ጊዜ ቅርጽ ትምህርቱ ቀጣይ ድርጊት እንደነበር ያሳያል።
- source_word: συνέδριον
  choice: ሳንሄድሪኑ
  rationale: በዚህ አውድ ቃሉ በታሪክ ሳንሄድሪን ተብሎ የሚታወቀውን የአይሁድ ገዢ ሸንጎ ያመለክታል።
- source_word: πᾶσαν τὴν γερουσίαν τῶν υἱῶν Ἰσραήλ
  choice: የእስራኤል ልጆች የሽማግሌዎች ሸንጎ በሙሉ
  rationale: γερουσία የሽማግሌዎችን አማካሪ ወይም ሸንጎ ያመለክታል፤ «የእስራኤል ልጆች» የሚለውም በግሪኩ ያለውን ባሕላዊ የብሔር መጠሪያ ይጠብቃል።
- source_word: ἀχθῆναι αὐτούς
  choice: እነርሱን ለማስመጣት
  rationale: ከ«ላኩ» ጋር የተያያዘውን ዓላማና የግሪኩን ተደራጊ ቅርጽ በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: የτῶν υἱῶν Ἰσραήλ አተረጓጎም
  choice: የእስራኤል ልጆች
  alternative: የእስራኤል / የእስራኤል ሽማግሌዎች
  rationale: በምንጩ ያለውን የወንድ ልጆች ቤተሰባዊ አገላለጽ እንደ ባሕላዊ ብሔራዊ መጠሪያ ይጠብቃል፤ ይበልጥ ፈሳሽ የሆነው አተረጓጎም በማስታወሻ ተቀምጧል።
- issue: በσυνέδριον እና γερουσία መካከል ያለው ግንኙነት
  choice: ሁለቱን ቃላት በተለያዩ መጠሪያዎች ማቅረብ
  alternative: ሁለቱንም አንድ ሸንጎ እንደሚያመለክቱ አድርጎ ማቀላጠፍ
  rationale: የግሪኩ «እና» ሁለተኛው ሐረግ ከሳንሄድሪኑ የተለየ አካል እንደሆነ ወይም ሙሉ ስብሰባውን የሚያብራራ እንደሆነ የተወሰነ አያደርግም፤ ዋናው ጽሑፍ ይህን ውጥረት አያጠፋም።
