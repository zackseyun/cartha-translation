base_translation:
  language: en
  yaml_path: translation/nt/acts/005/038.yaml
  text: And now I tell you[a], keep away from these men and leave them alone; for if this plan or this work is from men, it will be overthrown[b],
translation:
  language: am
  text: አሁንም እኔ እላችኋለሁ፤ ከእነዚህ ሰዎች ራቁ፣ ተዋቸውም፤ ምክንያቱም ይህ ዕቅድ ወይም ይህ ሥራ ከሰዎች የመጣ ከሆነ፣ ይፈርሳል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ይጠፋል” ወይም “ከንቱ ይሆናል።”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ νῦν
  choice: አሁንም
  rationale: የገማልያልን ወቅታዊ ምክር የሚያስተዋውቅ ተፈጥሯዊ የአማርኛ አገላለጽ ሲሆን፣ καί ያለውን የንግግር ቀጣይነትም ያሳያል።
- source_word: ἀπόστητε ἀπὸ τῶν ἀνθρώπων τούτων
  choice: ከእነዚህ ሰዎች ራቁ
  rationale: ከእነርሱ መለየትንና በጉዳያቸው ጣልቃ አለመግባትን የሚያስተላልፍ ግልጽና ተፈጥሯዊ ትርጉም ነው።
- source_word: ἄφετε αὐτούς
  choice: ተዉአቸውም
  rationale: በዐውዱ ውስጥ እነርሱን ከመከታተልና ከመጉዳት መቆጠብን ያመለክታል፤ አጭርና የተለመደ የአማርኛ አገላለጽ ነው።
- source_word: βουλή
  choice: ዕቅድ
  rationale: የታሰበ ዓላማን ወይም እቅድን በግልጽ ያሳያል፣ ከἔργον ጋር ያለውንም ልዩነት ይጠብቃል።
- source_word: ἔργον
  choice: ሥራ
  rationale: ድርጊትን ወይም ተግባራዊ እንቅስቃሴን የሚያመለክት ሰፊና ቀጥተኛ አቻ ቃል ነው።
- source_word: ἐξ ἀνθρώπων
  choice: ከሰዎች
  rationale: የምንጭ ወይም የአመጣጥ ሐሳብን ይጠብቃል፤ በቀጣዩ ቁጥር ካለው ከእግዚአብሔር መሆን ጋር የሚደረገውን ንጽጽርም ሳያዳክም ἀνθρώπωνን በአጠቃላይ የሰው ልጆች ትርጉም ያቀርባል።
- source_word: καταλυθήσεται
  choice: ይፈርሳል
  rationale: ዕቅዱ ወይም ሥራው መፍረሱን፣ መክሸፉን ወይም ወደ ምንም መቅረቱን በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: ἐξ ἀνθρώπων የሚያመለክተው ምንጭ
  choice: ከሰዎች
  alternative: የሰው ምንጭ ያለው / ከሰው የመጣ
  rationale: ሐረጉ እቅዱና ሥራው ሰብአዊ ምንጭ ያላቸው መሆናቸውን ያመለክታል፤ ቀጥተኛው አገላለጽ በቁጥር 39 ከሚኖረው መለኮታዊ ምንጭ ጋር ያለውን ውጥረት ይጠብቃል።
- issue: καταλυθήσεται የሚያሳየው የመጨረሻ ውጤት
  choice: ይፈርሳል
  alternative: ይጠፋል / ከንቱ ይሆናል
  rationale: ቃሉ መፍረስን፣ መበተንን ወይም መክሸፍን ሊያመለክት ይችላል። «ይፈርሳል» ይህን ስፋት በአጭሩ ይይዛል፤ ሌሎቹ የትርጉም ዕድሎች በማስታወሻ ተጠብቀዋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ በቀላሉ የሚገባ መደበኛ አማርኛ ተጠቅሟል። የግሪክ ምንጭ ቅደም ተከተልና ምክንያታዊ ግንኙነት ተጠብቀዋል፤ የ«ከሰዎች» እና በቀጣዩ ቁጥር ያለው የ«ከእግዚአብሔር» ንጽጽር አልተዳከመም።
