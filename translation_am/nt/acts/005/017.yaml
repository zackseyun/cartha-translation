base_translation:
  language: en
  yaml_path: translation/nt/acts/005/017.yaml
  text: But the high priest rose up[a], and all those with him—that is[b], the party of the Sadducees—and were filled with jealousy.
translation:
  language: am
  text: ነገር ግን ሊቀ ካህናቱ ተነሣ፤ እርሱና ከእርሱ ጋር የነበሩት ሁሉ—ማለትም የሰዱቃውያን ወገን[a]—በቅናት[b] ተሞሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የሰዱቃውያን ኑፋቄ።» የግሪኩ ቃል ወገንን፣ ቡድንን ወይም ኑፋቄን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «ምቀኝነት።» የግሪኩ ቃል «ትጋት» ማለትም ሊሆን ይችላል፤ እዚህ ግን አውዱ የጥላቻ ስሜትን ይደግፋል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστὰς
  choice: ተነሣ
  rationale: የἀνίστημι ያለፈ ጊዜ ቦዝ አንቀጽ ሲሆን ወደ ወሳኝ ድርጊት መግባትን ያመለክታል። «ተነሣ» የትረካውን ኃይል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከቀደመው ሕዝቡ ለሐዋርያት ካሳየው መልካም ምላሽ ጋር ያለውን ቀላል ተቃርኖ ግልጽ ያደርጋል።
- source_word: ὁ ἀρχιερεὺς
  choice: ሊቀ ካህናቱ
  rationale: በአይሁድ ሃይማኖታዊ ሥርዓት ውስጥ ያለውን ነጠላ ከፍተኛ የክህነት ሹመት የሚገልጽ የተለመደ አማርኛ ቃል ነው።
- source_word: πάντες οἱ σὺν αὐτῷ
  choice: ከእርሱ ጋር የነበሩት ሁሉ
  rationale: ከሊቀ ካህናቱ ጋር የተሰለፉትን ቡድን ሳያሰፋ ወይም ሹመታቸውን ሳይገምት የግንኙነቱን ትርጉም ይጠብቃል።
- source_word: ἡ οὖσα αἵρεσις τῶν Σαδδουκαίων
  choice: ማለትም የሰዱቃውያን ወገን
  rationale: ይህ አባባል ከሊቀ ካህናቱ ጋር የነበሩትን ማንነት የሚያብራራ ገላጭ ሐረግ ነው። «ወገን» በዚህ ስፍራ ያለውን ማኅበራዊና ሃይማኖታዊ ቡድን ያመለክታል፤ ቃሉን በኋለኛው ዘመን የኑፋቄ ፍርድ አይጭንበትም።
- source_word: ἐπλήσθησαν
  choice: ተሞሉ
  rationale: πίμπλημι ከዘር ቅጥያ ጋር የሚሰጠውን «በአንድ ነገር መሞላት» የሚለውን መደበኛ አገላለጽ በቅርብ ይጠብቃል።
- source_word: ζήλου
  choice: ቅናት
  rationale: ζῆλος አዎንታዊ ትጋትንም ሆነ አሉታዊ ቅናትን ሊያመለክት ቢችልም፣ እዚህ ሐዋርያትን የመቃወም አውድ አሉታዊውን ፍቺ ይደግፋል።
theological_decisions:
- issue: የαἵρεσις ትርጉም
  choice: ወገን
  alternative: ኑፋቄ
  rationale: ቃሉ በዚህ አውድ በሁለተኛው ቤተ መቅደስ ዘመን ይሁዲነት ውስጥ ያለን የታወቀ ቡድን ወይም ጎራ ያመለክታል፤ በኋለኛው ዘመን የተጫነውን «ክህደት» የሚመስል የኑፋቄ ፍርድ አይጠይቅም።
- issue: በአውዱ ውስጥ የζῆλος ትርጉም
  choice: ቅናት
  alternative: ትጋት
  rationale: ቃሉ በራሱ ሁለቱንም ፍቺዎች ሊይዝ ቢችልም፣ ተከትሎ የሚመጣው በሐዋርያት ላይ የተፈጸመ የጥላቻ እርምጃ አሉታዊውን «ቅናት» ይደግፋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። ነጠላው ቦዝ አንቀጽ ሊቀ ካህናቱን ብቻ ስለሚመለከት «ሊቀ ካህናቱ ተነሣ» ተብሎ ተገልጿል፤ ብዙ ቁጥር ያለው ዋና ግስ ግን እርሱንና ከእርሱ ጋር የነበሩትን ሁሉ እንዲያካትት «እርሱና ... ተሞሉ» ተብሏል። የግሪኩ ገላጭ ሐረግ በሰረዝና «ማለትም» ተጠብቋል።
