  text: παραγενόμενος δέ τις ἀπήγγειλεν αὐτοῖς ὅτι Ἰδοὺ οἱ ἄνδρες οὓς ἔθεσθε ἐν τῇ φυλακῇ εἰσὶν ἐν τῷ ἱερῷ ἑστῶτες καὶ διδάσκοντες τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/025.yaml
  text: But someone came and reported to them[a], “Look, the men whom you put in prison are standing in the temple and teaching the people.”
translation:
  language: am
  text: 'ነገር ግን አንድ ሰው መጥቶ፣ “እነሆ፣ እናንተ በወኅኒ ያስገባችኋቸው ሰዎች በቤተ መቅደሱ[a] ቆመው ሕዝቡን እያስተማሩ ነው” ብሎ ነገራቸው።


    [a] ወይም፣ “በቤተ መቅደሱ ግቢዎች”፤ የግሪክኛው ቃል ἱερόν የውስጠኛውን መቅደስ ብቻ ሳይሆን መላውን የቤተ መቅደስ ሕንፃዎችና ግቢዎች ያመለክታል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በቤተ መቅደሱ ግቢዎች”፤ የግሪክኛው ቃል ἱερόν የውስጠኛውን መቅደስ ብቻ ሳይሆን መላውን የቤተ መቅደስ ሕንፃዎችና ግቢዎች ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενος
  choice: መጥቶ
  rationale: የመልእክተኛውን መድረስ ከዋናው የመናገር ድርጊት በፊት በተፈጥሯዊ የአማርኛ ቅደም ተከተል ያሳያል።
- source_word: δέ
  choice: ነገር ግን
  rationale: በቀደመው ትረካ ላይ የተፈጠረውን ያልተጠበቀ ለውጥና መጠነኛ ንፅፅር ያሳያል።
- source_word: τις
  choice: አንድ ሰው
  rationale: ማንነቱ ያልተገለጠ ሰው መሆኑን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἀπήγγειλεν αὐτοῖς
  choice: ነገራቸው
  rationale: ለባለሥልጣናቱ የደረሰውን ዜና ማሳወቅን በአጭርና ተፈጥሯዊ መንገድ ያስተላልፋል።
- source_word: Ἰδοὺ
  choice: እነሆ
  rationale: ተናጋሪው አስገራሚውን ዜና ትኩረት ሰጥተው እንዲሰሙ የሚጠራበትን ኃይል ይጠብቃል።
- source_word: οἱ ἄνδρες
  choice: ሰዎች
  rationale: ቀድሞ የታሰሩትን የተወሰኑ ወንዶች ያመለክታል፤ በአማርኛ በዚህ ዐውድ 'ሰዎች' ተፈጥሯዊ ነው።
- source_word: οὓς ἔθεσθε ἐν τῇ φυλακῇ
  choice: እናንተ በወኅኒ ያስገባችኋቸው
  rationale: ቃል በቃል 'ያኖራችኋቸው' ከማለት ይልቅ ወደ ወኅኒ መጣልን በግልጽና ተፈጥሯዊ አማርኛ ይገልጻል፤ 'እናንተ' የግሱን ግልጽ ተጠያቂነት ያጎላል።
- source_word: ἐν τῷ ἱερῷ
  choice: በቤተ መቅደሱ
  rationale: ἱερόν የመቅደሱን አጠቃላይ ስፍራ ያመለክታል፤ ዋናው ጽሑፍ የተለመደውን አገላለጽ ይጠቀማል፣ ትክክለኛው የቦታ ስፋት ግን በማስታወሻ ተገልጿል።
- source_word: ἑστῶτες καὶ διδάσκοντες τὸν λαόν
  choice: ቆመው ሕዝቡን እያስተማሩ ነው
  rationale: የቆሙበትን ሁኔታና በዚያው ጊዜ እየቀጠለ ያለውን የማስተማር ድርጊት ይጠብቃል።
