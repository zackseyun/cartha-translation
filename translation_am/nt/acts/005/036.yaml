  - severity: medium
    issue: “በእርሱ የተማመኑት” primarily means those who trusted him.
    rationale: ἐπείθοντο in this setting denotes those won over/persuaded by him, hence his followers. “እርሱን የተከተሉት” is natural in the text; a footnote preserves “በእርሱ የተሳመኑት.”
