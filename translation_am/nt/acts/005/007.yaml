  text: Ἐγένετο δὲ ὡς ὡρῶν τριῶν διάστημα καὶ ἡ γυνὴ αὐτοῦ μὴ εἰδυῖα τὸ γεγονὸς εἰσῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/007.yaml
  text: After an interval of about three hours, his wife came in, not knowing what had happened.
translation:
  language: am
  text: ከሦስት ሰዓት ያህል በኋላ፣ ሚስቱ የሆነውን ሳታውቅ ገባች።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: በኋላ
  rationale: የግሪክ አገላለጹ በትረካው ውስጥ ቀጣዩን ክስተት የሚያስገባ ሲሆን፣ በአማርኛ የጊዜ ሐረጉን በቀጥታ ማቅረብ ተፈጥሯዊ ነው። δὲ ያለው ቀላል የትረካ ቅጥያ ተጨማሪ ቃል ሳያስፈልገው በአረፍተ ነገሩ ቅደም ተከተል ተገልጧል።
- source_word: ὡς ὡρῶν τριῶν διάστημα
  choice: ከሦስት ሰዓት ያህል በኋላ
  rationale: ὡς ግምታዊነትን፣ διάστημα ደግሞ የጊዜ ርዝማኔን ያመለክታሉ። «ያህል» ግምታዊነቱን፣ «በኋላ» ደግሞ ጊዜው ማለፉን በተፈጥሯዊ አማርኛ ያሳያሉ።
- source_word: ἡ γυνὴ αὐτοῦ
  choice: ሚስቱ
  rationale: በዐውዱ γυνή የሐናንያን ባለቤት ስለሚያመለክት «ሚስቱ» ትክክለኛና አጭር ነው።
- source_word: μὴ εἰδυῖα τὸ γεγονὸς
  choice: የሆነውን ሳታውቅ
  rationale: አሉታዊው ቦዝ አንቀጽ ሴቲቱ ስትገባ የነበራትን አለማወቅ ይገልጣል፤ ፍጹም ቦዝ አንቀጹም አስቀድሞ የተፈጸመውን ነገር ያመለክታል።
- source_word: εἰσῆλθεν
  choice: ገባች
  rationale: ግሱ ወደ ቦታው መግባቷን ያመለክታል፤ የሴት ፆታውም በአማርኛው ግስ ተጠብቋል።
