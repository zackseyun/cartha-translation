id: ACT.5.19
reference: Acts 5:19
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἄγγελος δὲ κυρίου ⸀διὰ νυκτὸς ⸀ἤνοιξε τὰς θύρας τῆς φυλακῆς ἐξαγαγών τε αὐτοὺς εἶπεν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/019.yaml
  text: But an angel of the Lord opened the doors of the prison during the night, brought them out, and said,
translation:
  language: am
  text: ነገር ግን በሌሊት የጌታ መልአክ የእስር ቤቱን በሮች ከፍቶ እነርሱን ወደ ውጭ አወጣና እንዲህ አለ፦
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελος
  choice: መልአክ
  rationale: በዚህ አውድ የእስር ቤቱን በሮች መክፈቱና ሐዋርያትን ማውጣቱ ሰማያዊ መልአክን ያመለክታል። ግሪኩ መስተዋድድ አልባ ቢሆንም፣ በአማርኛ “የጌታ መልአክ” የሚለው ተፈጥሯዊና የተለመደ ነው።
- source_word: κυρίου
  choice: የጌታ
  rationale: κύριος በዚህ የመጽሐፍ ቅዱስ ሐረግ ውስጥ “ጌታ” ተብሎ መተርጎሙ ትክክለኛና የተለመደ ነው።
- source_word: διὰ νυκτός
  choice: በሌሊት
  rationale: διά ከዘር ቅጽ ጋር እዚህ ጊዜን ያመለክታል፤ “በሌሊት” በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: ἤνοιξε
  choice: ከፍቶ
  rationale: ἀνοίγω በቀጥታ “መክፈት” ማለት ነው፤ “ቁልፉን ከፈተ” የሚል በግሪኩ ያልተገለጸ ዝርዝር አልተጨመረም።
- source_word: τὰς θύρας τῆς φυλακῆς
  choice: የእስር ቤቱን በሮች
  rationale: θύραι “በሮች”፣ φυλακή ደግሞ በዚህ አውድ “እስር ቤት” ማለት ነው፤ አገባቡ የግሪኩን የባለቤትነት ግንኙነት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐξαγαγών
  choice: ወደ ውጭ አወጣና
  rationale: ἐξάγω እነርሱን ከእስር ቤቱ ወደ ውጭ እንዲወጡ ማድረጉን ያመለክታል፤ “አወጣ” በአማርኛ ይህን በቀጥታ ያሳያል።
- source_word: τε
  choice: -ና
  rationale: τέ የተያያዙትን ድርጊቶች በለስላሳ አያያዥነት ያገናኛል፤ የአማርኛው “-ና” ይህን በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: εἶπεν
  choice: እንዲህ አለ፦
  rationale: የንግግሩ ይዘት በሚቀጥለው ቁጥር ስለሚመጣ፣ “እንዲህ አለ፦” በአማርኛ ንግግሩን ወደፊት በግልጽ ያስተላልፋል።
theological_decisions:
- issue: በአውዱ የἄγγελος ማንነት
  choice: ሰማያዊ መልአክ
  alternative: ሰው መልእክተኛ
  rationale: በሮቹ በሌሊት መከፈታቸውና እስረኞቹ መውጣታቸው ተአምራዊ ጣልቃ ገብነትን ያሳያል፤ ስለዚህ “መልአክ” የሚለው ከ“መልእክተኛ” ይልቅ አውዱን ይስማማል።
- issue: የκύριος አተረጓጎም
  choice: ጌታ
  alternative: ባለቤት / ገዢ
  rationale: “የጌታ መልአክ” የተለመደውን መጽሐፍ ቅዱሳዊ አገላለጽ ይጠብቃል፣ የκύριοςንም ክብር ያለው ሃይማኖታዊ ትርጉም ያስተላልፋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ተከታታይ ድርጊት በ“ከፍቶ… አወጣና… አለ” ተጠብቋል። የቁጥሩ ፍጻሜ ወደሚቀጥለው ቀጥተኛ ንግግር እንዲያመራ ሁለት ነጥብ ተጠቅሟል።
