language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Πέτρος πρὸς αὐτήν· Τί ὅτι συνεφωνήθη ὑμῖν πειράσαι τὸ πνεῦμα κυρίου; ἰδοὺ οἱ πόδες τῶν θαψάντων τὸν ἄνδρα σου ἐπὶ τῇ θύρᾳ καὶ ἐξοίσουσίν σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/009.yaml
  text: But Peter said to her[a], “Why did you agree together to test the Spirit of the Lord? Look, the feet of those who buried your husband are at the door[b], and they will carry you out.”
translation:
  language: am
  text: ጴጥሮስ ግን እንዲህ አላት፦ “የጌታን መንፈስ[a] ለመፈተን ለምን ተስማማችሁ?[b] እነሆ፣ ባልሽን የቀበሩት ሰዎች እግሮች በበሩ አጠገብ አሉ፤ አንቺንም ተሸክመው ያወጡሻል።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የጌታ መንፈስን።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ለመፈተን ለምን ተመሳጠራችሁ?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί ὅτι
  choice: ለምን
  rationale: የግሪክኛውን የምክንያት ጥያቄና የወቀሳ ኃይል በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: συνεφωνήθη ὑμῖν
  choice: ተስማማችሁ
  rationale: ግሱ በመካከላቸው የተደረገን የጋራ ስምምነት ያመለክታል፤ ‘ተመሳጠራችሁ’ ከሚለው ይልቅ የምንጩን መሠረታዊ ትርጉም ይጠብቃል።
- source_word: πειράσαι
  choice: ለመፈተን
  rationale: በዚህ አውድ መንፈሱን መፈተን ማለት እርሱን ለፈተና ማቅረብ ነው፤ ‘ለመፈታተን’ የሚለው አማራጭ ቢኖርም ይህ አጭርና ግልጽ ነው።
- source_word: τὸ πνεῦμα κυρίου
  choice: የጌታን መንፈስ
  rationale: የዝምድናውን አገባብ ሳያሰፋ ይጠብቃል፤ በሐዋርያት ሥራ 5፥3 አውድ መሠረት ማጣቀሻው መንፈስ ቅዱስ መሆኑ ጠንካራ ቢሆንም ግሪክኛው ያልጨመረውን ‘ቅዱስ’ አይጨምርም።
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: የአድማጩን ትኩረት ወደ ወዲያውኑ ያለው ነገር የሚስብ የንግግር ምልክት ነው።
- source_word: οἱ πόδες τῶν θαψάντων
  choice: የቀበሩት ሰዎች እግሮች
  rationale: ምንጩ ‘እግሮች’ ብሎ የሰጠውን ሕያው ምስል ይጠብቃል፤ ‘የእግር ድምፅ’ የሚለውን ያልተጻፈ ሐሳብ አያክልም።
- source_word: τὸν ἄνδρα σου
  choice: ባልሽን
  rationale: በዚህ አውድ ἀνήρ የሚያመለክተው የሰጲራን ባል ሐናንያን ነው።
- source_word: ἐπὶ τῇ θύρᾳ
  choice: በደጁ
  rationale: ቀባሪዎቹ በመግቢያው አጠገብ ወዲያውኑ መድረሳቸውን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἐξοίσουσίν σε
  choice: አንቺንም ተሸክመው ያወጡሻል
  rationale: የመቃብር አውዱንና የንግግሩን አስፈሪ ቀጥተኛነት ይጠብቃል፤ በምንጩ የሌለውን ‘ሬሳሽን’ አይጨምርም።
theological_decisions:
- issue: ‘የጌታ መንፈስ’ የሚለው ማንን እንደሚያመለክት
  choice: ግሪክኛውን በቀጥታ ‘የጌታን መንፈስ’ ብሎ መተርጎም
  alternative: ትርጉሙን በማስፋት ‘መንፈስ ቅዱስን’ ማለት
  rationale: አውዱ፣ በተለይ ሐዋርያት ሥራ 5፥3፣ መንፈስ ቅዱስን እንደሚያመለክት ያሳያል፤ ሆኖም ትርጉሙ የምንጩን አገላለጽ ጠብቆ ያልተጻፈውን ቃል አይጨምርም።
- issue: የጴጥሮስ ክስ ኃይል
  choice: ‘ተስማማችሁ’ ብሎ የጋራ ስምምነቱን መግለጽ
  alternative: ‘ተመሳጠራችሁ’ ብሎ የሴራን ሐሳብ በቀጥታ ማስገባት
  rationale: አውዱ ምግባራዊ ክብደት ቢኖረውም συμφωνέω በመሠረቱ መስማማትን ይገልጻል። ጽሑፉ ክብደቱን ከአውዱ እንዲያገኝ ያደርጋል።
