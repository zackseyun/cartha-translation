    issue: The rendering of ἐπείσθησαν δὲ αὐτῷ is inaccurate.
    rationale: «በእርሱ ተማከሩ» denotes consulting someone. The Greek passive states that the council was persuaded by Gamaliel.
  - severity: medium
    issue: Footnote b's literal gloss reverses or obscures the direction of θεομάχοι.
    rationale: «ከእግዚአብሔር ጋር ተዋጊዎች» may mean combatants allied with God. The term denotes those fighting against God.
  - severity: low
    issue: Footnote c is anchored after the final clause rather than directly after «እነርሱን».
    rationale: Moving the anchor makes clear that the note concerns αὐτούς.
