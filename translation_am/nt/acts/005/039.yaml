  source_fidelity: The conditional source expression, future inability, and personal plural object are substantially represented. However, «እነርሱም በእርሱ ተማከሩ» means that they consulted with him, not that they were persuaded by him (ἐπείσθησαν δὲ αὐτῷ). The warning is more accurately and naturally conveyed with an Amharic lest/warning construction.
  naturalness: Most of the draft is clear modern Amharic. The double possibility in «ምናልባትም … ይሆናል» is somewhat heavy; «… ሆናችሁ እንዳትገኙ» gives the warning force of μήποτε more idiomatically.
  terminology: «ከእግዚአብሔር» and «እግዚአብሔርን የምትዋጉ» are appropriate. Footnote b's literal alternative, «ከእግዚአብሔር ጋር ተዋጊዎች», can suggest fighting alongside God rather than against God and must be corrected.
  issues:
