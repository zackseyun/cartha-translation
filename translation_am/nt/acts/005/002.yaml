  verdict: revise
  source_fidelity: The draft correctly conveys Ananias’s self-serving, covert withholding, his wife’s knowledge, the bringing of a portion, and placement before the apostles. However, “የተወሰነውን ክፍል” is grammatically definite (“the specified portion”) and does not preserve the indefinite force of μέρος τι. The spatial wording “በሐዋርያት እግር ፊት” is understandable but less precise and natural than “በሐዋርያቱ እግር አጠገብ.”
  naturalness: The revision retains a clear modern-standard Amharic register. Rendering the wife’s knowledge as an attendant participial circumstance more closely follows the Greek genitive absolute while remaining natural.
  terminology: “ለራሱ አስቀረ” appropriately retains the negative, self-appropriating force of ἐνοσφίσατο without overtranslating it as theft. “ከሽያጩ ዋጋ” is acceptable for ἀπὸ τῆς τιμῆς in context. “በሐዋርያቱ እግር አጠገብ” preserves the concrete expression without importing an interpretive claim about authority.
  issues:
