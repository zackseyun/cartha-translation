    rationale: μέρος τι means “a/some portion.” The draft’s “የተወሰነውን ክፍል” means “the specified portion,” introducing definiteness not present in the source.
  - severity: low
    issue: Foot-placement expression is less idiomatic and less exact
    rationale: “በሐዋርያት እግር ፊት” can be understood as before their feet. “በሐዋርያቱ እግር አጠገብ” more directly reflects παρὰ τοὺς πόδας and is natural Amharic.
