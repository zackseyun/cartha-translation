  yaml_path: translation/nt/acts/005/037.yaml
  text: After this[a], Judas the Galilean rose up in the days of the census and drew away people after him. He also perished[b], and all who were persuaded by him were scattered.
translation:
  language: am
  text: 'ከዚህ በኋላ በሕዝብ ቆጠራው[a] ዘመን የገሊላው ይሁዳ ተነሣ፤ ሰዎችንም ወደ ራሱ አስከተለ[b]። እርሱም ጠፋ፤ በእርሱ የተሳመኑትም ሁሉ ተበታተኑ።


    [a] ወይም፣ “በምዝገባው ዘመን።” የግሪኩ ቃል የሕዝብ ቆጠራን ወይም መንግሥታዊ ምዝገባን ሊያመለክት ይችላል።


    [b] ወይም፣ “ሰዎች ከቀድሞ ወገናቸው ተለይተው እንዲከተሉት አደረገ።” ግሱ ሰዎችን ከቀድሞ ታማኝነታቸው አስለይቶ ወደ ራሱ የመሳብን ሐሳብ ሊይዝ ይችላል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በምዝገባው ዘመን።” የግሪኩ ቃል የሕዝብ ቆጠራን ወይም መንግሥታዊ ምዝገባን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ሰዎች ከቀድሞ ወገናቸው ተለይተው እንዲከተሉት አደረገ።” ግሱ ሰዎችን ከቀድሞ ታማኝነታቸው አስለይቶ ወደ ራሱ የመሳብን ሐሳብ ሊይዝ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ τοῦτον
  choice: ከዚህ በኋላ
  rationale: በዐውዱ ውስጥ μετά ከተሳቢ ጋር የጊዜ ቅደም ተከተልን ያመለክታል፤ ይህም ከቀድሞው ሰውና ክስተት በኋላ ማለት ነው።
- source_word: ἀνέστη
  choice: ተነሣ
  rationale: እዚህ የሞት ትንሣኤን ሳይሆን አንድ መሪ በታሪክ መካከል መነሣቱንና መታየቱን ያመለክታል።
- source_word: Ἰούδας ὁ Γαλιλαῖος
  choice: የገሊላው ይሁዳ
  rationale: የግሪኩን የቦታ መለያ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐν ταῖς ἡμέραις τῆς ἀπογραφῆς
  choice: በሕዝብ ቆጠራው ዘመን
  rationale: ἀπογραφή ሕዝብን የመቁጠር ወይም በይፋ የመመዝገብ ሂደትን ሊያመለክት ይችላል፤ ‘ዘመን’ ደግሞ ἐν ταῖς ἡμέραις የሚለውን ተፈጥሯዊ በሆነ አማርኛ ያቀርባል።
- source_word: ἀπέστησε λαὸν ὀπίσω αὐτοῦ
  choice: ሰዎችንም ወደ ራሱ ስቦ አስከተለ
  rationale: ይህ አገላለጽ ሰዎችን ከነበሩበት ወገን ለይቶ ወደ ራሱ የመሳብንና ከኋላው እንዲከተሉ የማድረግን ሁለቱንም ገጽታዎች ይይዛል፤ የዓመፅ ትርጉምን ግን በግልጽ አይጨምርም።
- source_word: λαὸν
  choice: ሰዎችን
  rationale: በግሪኩ መስተዋድድ የሌለው ነጠላ ስብስባዊ ስም ስለሆነ፣ መላውን ሕዝብ ሳያመለክት ‘ሰዎችን’ ተብሎ ተተርጉሟል።
- source_word: κἀκεῖνος
  choice: እርሱም
  rationale: ‘ያም ሰው’ የሚለውን አጽንዖትና አያያዥ ኃይል በአጭርና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἀπώλετο
  choice: ጠፋ
  rationale: ግሱ ሞትን ወይም ለጥፋት መዳረግን ያመለክታል፤ ‘ጠፋ’ የሞቱን ሁኔታ ሳይገድብ ሰፊውን ትርጉም ይጠብቃል።
- source_word: πάντες ὅσοι ἐπείθοντο αὐτῷ
  choice: እርሱ ያሳመናቸውም ሁሉ
  rationale: πείθω እነዚህ ሰዎች በእርሱ እንደተሳመኑ ወይም ወደ አቋሙ እንደተሳቡ ያሳያል፤ ‘ተከተሉት’ ማለት ከቀደመው ሐረግ ጋር ልዩነቱን ያጠፋ ነበር።
- source_word: διεσκορπίσθησαν
  choice: ተበታተኑ
  rationale: የግሪኩን ተገብሮ ቅርጽና የመበተን ቀጥተኛ ትርጉም በተለመደ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: የይሁዳን እንቅስቃሴ ታሪካዊና ፖለቲካዊ መግለጫ
  choice: ይሁዳ ተነሥቶ ሰዎችን ወደ ራሱ እንደሳበ ተተርጉሟል፤ ጽሑፉ በግልጽ ያልተናገረው የዓመፅ መለያ አልተጨመረም።
