  rationale: ታሪካዊ ዐውዱ ዓመፅን ሊያመለክት ቢችልም፣ በዚህ ጥቅስ የዓመፅ ስም በግልጽ አልተጠቀሰም። ስለዚህ ትርጉሙ የምንጩን መጠን አያልፍም።
