review_pass:
  verdict: revise
  source_fidelity: The draft retains the principal elements, but its main clause is syntactically displaced and the rendering of τινὶ αὐτῶν as “በአንዳንዶቹ” changes the singular indefinite (“any one of them”) into a plural subset. The revision restores the Greek sequence and preserves the purpose/hope expressed by ἵνα with the subjunctive.
  naturalness: “እስከ ማውጣት ደረሱ” is not natural in this narrative sentence, and placing the purpose clause before “ያስቀምጧቸው ነበር” obscures what it modifies. The revised wording is fluent modern standard Amharic while retaining a dignified biblical register.
  terminology: “ሕመምተኞች,” “አደባባዮች,” “አልጋዎችና ምንጣፎች,” and “ጥላ” are suitable. “በአንዱ ላይ” correctly renders the singular τινί without asserting that only one person was intended.
  issues:
  - severity: medium
    issue: The purpose clause is fronted before the action of laying the sick down.
    rationale: In Greek, they carried out and laid down the sick so that Peter’s shadow might fall on one of them. The draft’s order makes the relation less clear in Amharic.
  - severity: medium
    issue: “ከእነርሱ በአንዳንዶቹ ላይ” renders a singular indefinite as a plural subset.
    rationale: τινὶ αὐτῶν means “on any one of them” / “on one of them,” not specifically “on some of them.”
  - severity: low
    issue: “ስለዚህ … እስከ ማውጣት ደረሱ” is awkward and over-interprets the consecutive construction.
    rationale: ὥστε introduces the resulting action; a direct narrative rendering better reflects the source and reads naturally.
