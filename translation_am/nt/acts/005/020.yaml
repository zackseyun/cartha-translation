  text: “ሂዱ፤ በቤተ መቅደሱ[a] ቆማችሁ[c]፣ የዚህን ሕይወት[b] ቃሎች ሁሉ ለሕዝቡ ተናገሩ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በቤተ መቅደሱ ግቢ።” የግሪኩ ἱερόν የቤተ መቅደሱን ሕንፃዎችና አደባባዮች የሚያካትተውን ሰፊ ግቢ እንጂ ውስጠኛውን መቅደስ ብቻ አያመለክትም።
