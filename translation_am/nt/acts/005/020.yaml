  rationale: የዝርያ ሐረጉን አጭርነትና አሻሚነት ይጠብቃል፤ ሕይወቱ የምሥራቹን ሕይወት፣ አዲሱን አኗኗር ወይም ሕይወት ሰጪውን መልእክት ሊያመለክት ይችላል።
