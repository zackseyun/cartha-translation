    text: ወይም፣ “በእነዚህ ሰዎች ጉዳይ ምን ልታደርጉ እንዳሰባችሁ ተጠንቀቁ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπέν τε πρὸς αὐτούς
  choice: እንዲህም አላቸው
  rationale: τέ ቀላል የትረካ ትስስርን በ«ም» ያሳያል፤ πρὸς αὐτούς ደግሞ በአማርኛው «አላቸው» ውስጥ በተፈጥሮ ተካትቷል።
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: እናንተ የእስራኤል ሰዎች
  rationale: መደበኛውን የጥሪ ቅርጽ ይጠብቃል፤ ἄνδρες በዐውዱ ያሉትን ወንዶች ቢያመለክትም «የእስራኤል ሰዎች» በዘመናዊ አማርኛ የተፈጥሮ እና ክብር ያለው አጠራር ነው።
- source_word: προσέχετε ἑαυτοῖς
  choice: ራሳችሁን ጠብቁ
  rationale: የትእዛዙን ጥንቃቄና የተመላሽ ተውላጠ ስምን በግልጽ ያስተላልፋል።
- source_word: ἐπὶ τοῖς ἀνθρώποις τούτοις
  choice: በእነዚህ ሰዎች ላይ
  rationale: ἐπί ከዳቲቭ ጋር የታሰበው ድርጊት የሚመለከታቸውን ሰዎች ያመለክታል፤ «ላይ» በአማርኛ ድርጊቱ ወደ እነርሱ መቅናቱን ሳያጠናክር ይገልጣል።
- source_word: τί μέλλετε πράσσειν
  choice: ልታደርጉ ስላሰባችሁት ነገር
  rationale: μέλλω + የማያልቅ ግስ የታሰበን ወይም የቀረበን ድርጊት ያሳያል፤ ይህ ቅርጽ የወደፊቱን ዓላማና የማስጠንቀቂያውን ኃይል ይጠብቃል።
