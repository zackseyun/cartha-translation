base_translation:
  language: en
  yaml_path: translation/nt/acts/005/026.yaml
  text: Then the captain went with the officers and brought them[a], not with force, for they were afraid of the people, lest they be stoned.
translation:
  language: am
  text: ከዚያም የቤተ መቅደሱ ጥበቃ አዛዥ[a] ከጠባቂዎቹ ጋር ሄዶ ሐዋርያቱን አመጣቸው። ሕዝቡ በድንጋይ እንዳይወግራቸው ስለፈሩ በኃይል አላመጧቸውም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የቤተ መቅደሱ ጥበቃ ኃላፊ።” የግሪኩ στρατηγός በዚህ ስፍራ የቤተ መቅደሱን ሥርዓትና ጥበቃ የሚቆጣጠረውን ባለሥልጣን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατηγὸς
  choice: የቤተ መቅደሱ ጥበቃ አዛዥ
  rationale: በሐዋርያት ሥራ ይህ ቃል የሮም ጦር አዛዥን ሳይሆን የቤተ መቅደሱን ሥርዓትና ጥበቃ የሚቆጣጠረውን ባለሥልጣን ያመለክታል።
- source_word: ὑπηρέταις
  choice: ሹማምቱ
  rationale: በዚህ ዐውድ ከአዛዡ ጋር የሄዱትን የበታች ባለሥልጣናት ያመለክታል፤ ከአገልጋዮች ይልቅ የሕግ ማስፈጸም ዐውዱን ያሳያል።
- source_word: ἤγαγεν αὐτούς
  choice: ሐዋርያቱን አመጣቸው
  rationale: ἄγω መምራት ወይም ማምጣት ማለት ነው። ተውላጠ ስሙ የሚያመለክታቸውን ሐዋርያት በግልጽ መጥቀስ በአማርኛ ተፈጥሯዊ ነው፤ ግሪኩ ያልገለጸውን ‘ወደ ውስጥ’ የሚል አቅጣጫ አይጨምርም።
- source_word: οὐ μετὰ βίας
  choice: በኃይል አላመጧቸውም
  rationale: የግዳጅ ወይም የጥቃት አጠቃቀም እንዳልነበረ በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐφοβοῦντο γὰρ τὸν λαόν
  choice: ሕዝቡን ... ስለፈሩ
  rationale: የፍርሃቱን ምክንያትና የሕዝቡን ማኅበራዊ ሚና ይጠብቃል። በአማርኛ የተፈራውን ውጤት በተከታዩ ሐረግ ማብራራት ተፈጥሯዊ ነው።
- source_word: μὴ λιθασθῶσιν
  choice: በድንጋይ እንዳይወግራቸው
  rationale: ከፍርሃት ግስ በኋላ ያለው μή ከንዑስ አንቀጽ ጋር የተፈራውን ውጤት ያሳያል። ግሪኩ ተገብሮ ቢሆንም አማርኛው ሕዝቡን በቀደመው ሐረግ የተገለጸ ፈጻሚ አድርጎ በተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: τότε ἀπελθὼν
  choice: ከዚያም ... ሄዶ
  rationale: የትረካውን ቅደም ተከተልና የግሪኩን የአስቀድሞ ድርጊት አገባብ በተፈጥሯዊ አማርኛ ይጠብቃል።
