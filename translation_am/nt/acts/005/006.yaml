review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the narrative sequence, the wrapping, and burial. However, ἐξενέγκαντες specifically conveys bearing/carrying him out; አውጥተው alone can mean simply ‘taking him out’ and does not adequately express that nuance in this burial context.
  naturalness: The Amharic is clear and appropriately dignified. Adding ተሸክመው makes the removal action explicit while remaining natural in modern narrative Amharic.
  terminology: ወጣቶቹ is a suitable main rendering for οἱ νεώτεροι, and the footnote responsibly retains the comparative possibility. ጠቀለሉት and ቀበሩት are accurate, natural renderings.
  issues:
  - severity: medium
    issue: The rendering of ἐξενέγκαντες omits the carrying/bearing nuance.
    rationale: ἐκφέρω in this context denotes carrying the body out. The draft’s አውጥተው expresses outward removal but can leave the manner of transport unstated. ተሸክመውም አውጥተው preserves both the carrying and the outward direction.
  revised_text: ከዚያም ወጣቶቹ[a] ተነሥተው ጠቀለሉት፤ ተሸክመውም አውጥተው ቀበሩት።
