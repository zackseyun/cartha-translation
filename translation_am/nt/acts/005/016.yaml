    issue: Ambiguous antecedent for “ሁሉም”
    rationale: Although the Greek relative clause identifies the sick and those afflicted by unclean spirits as the ones healed, bare “ሁሉም” in Amharic can be understood more broadly as all the people gathering. Adding “እነዚህ” clarifies the intended antecedent without adding meaning.
