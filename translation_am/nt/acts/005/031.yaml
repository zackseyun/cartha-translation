source:
  edition: SBLGNT
  text: τοῦτον ὁ θεὸς ἀρχηγὸν καὶ σωτῆρα ὕψωσεν τῇ δεξιᾷ αὐτοῦ, ⸀τοῦ δοῦναι μετάνοιαν τῷ Ἰσραὴλ καὶ ἄφεσιν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/031.yaml
  text: God exalted this one to his right hand as Leader and Savior[a], to give repentance to Israel and forgiveness of sins.
translation:
  language: am
  text: እግዚአብሔር ይህንን መሪና አዳኝ አድርጎ ወደ ቀኙ ስፍራ ከፍ አደረገው፤[a] ለእስራኤልም ንስሓንና የኃጢአት ይቅርታን ለመስጠት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በቀኙ።” የግሪኩ ሐረግ «በቀኙ» ተብሎ ሊነበብ ይችላል፤ በዚህ አውድ ግን እግዚአብሔር እርሱን ወደ ቀኙ ስፍራ፣ ማለትም ወደ ከፍተኛ የክብር ስፍራ፣ ከፍ እንዳደረገው ማንበቡ ይመስላል።
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτον
  choice: ይህን እርሱን
  rationale: አመልካቹ ተውላጠ ስም በአጽንዖት በቀደመው ክፍል የተጠቀሰውን ኢየሱስን ያመለክታል፤ «ይህን እርሱን» ይህን አጽንዖት ይጠብቃል።
- source_word: ἀρχηγὸν
  choice: መሪ
  rationale: ቃሉ በፊት የሚመራን፣ በራስነት የቆመን ወይም መንገድ የሚከፍትን ሰው ሊያመለክት ይችላል፤ ከσωτήρ ጋር በዚህ የክብርና የሥልጣን አውድ «መሪ» ግልጽና ተፈጥሯዊ ነው።
- source_word: σωτῆρα
  choice: አዳኝ
  rationale: በክርስቶስ የማዳን ሥራ አውድ σωτήρን በተፈጥሯዊና በተለመደ ሁኔታ ይገልጣል።
- source_word: ὕψωσεν
  choice: ከፍ ከፍ አደረገው
  rationale: እዚህ ግሱ ተራ አካላዊ ማንሳትን ሳይሆን ኢየሱስን ወደ ክብርና ሥልጣን ማዕረግ ከፍ ማድረግን ያመለክታል።
- source_word: τῇ δεξιᾷ αὐτοῦ
  choice: ወደ ቀኙ
  rationale: በዋናው ንባብ የእግዚአብሔርን ቀኝ የክብርና የሥልጣን ስፍራ አድርጎ የቦታ አመልካች ሆኖ ያቀርባል፤ የመሣሪያ ንባቡ በማስታወሻ ተጠብቋል።
- source_word: τοῦ δοῦναι
  choice: ለመስጠት
  rationale: አርቲክል ያለው የግስ ስም የዓላማ ግንኙነትን ይገልጣል፤ «ለመስጠት» ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: μετάνοιαν
  choice: ንስሓ
  rationale: ቃሉ ተራ የሐሳብ ለውጥን ብቻ ሳይሆን ከኃጢአት ተመልሶ ወደ እግዚአብሔር መዞርን ያካትታል፤ «ንስሓ» በዘመናዊ መደበኛ አማርኛ የተለመደውና ትክክለኛው አቻ ነው።
- source_word: τῷ Ἰσραὴλ
  choice: ለእስራኤል
  rationale: በδοῦναι የሚሰጠውን የሚቀበል ወገን በቀጥታ ይገልጣል።
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: የኃጢአት ይቅርታ
  rationale: የግሪኩን የተለመደ የአዲስ ኪዳን አገላለጽ በግልጽና ተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: ኢየሱስ በእግዚአብሔር ቀኝ ከፍ መደረጉ
  choice: እግዚአብሔር ኢየሱስን ወደ ቀኙ፣ ማለትም ወደ ከፍተኛ ክብርና ሥልጣን ስፍራ፣ ከፍ ከፍ አደረገው።
  alternative: እግዚአብሔር በቀኙ ኃይል ኢየሱስን ከፍ ከፍ አደረገው።
  rationale: የአረፍተ ነገሩ አወቃቀርና የአዲስ ኪዳን የቀኝ ዙፋን አገላለጽ የቦታና የማዕረግ ንባቡን ይደግፋሉ፤ ሆኖም የግሪኩ ዳቲቭ የመሣሪያ ንባብንም ስለሚፈቅድ አማራጩ በማስታወሻ ተጠብቋል።
- issue: ንስሓን መስጠት
  choice: ጽሑፉ እግዚአብሔር በከፍ ከፍ ባደረገው ኢየሱስ አማካይነት ለእስራኤል ንስሓንና ይቅርታን እንደሚሰጥ በቀጥታ ይናገራል።
  alternative: «ንስሓን መስጠት»ን ንስሓ ለመግባት ዕድል መስጠት ብቻ አድርጎ መተርጎም።
  rationale: የግሪኩ δοῦναι μετάνοιαν በቀጥታ «ንስሓን መስጠት» ይላል፤ ይህን ወደ «ዕድል መስጠት» ብቻ ማጥበብ በምንጩ ያልተገለጸ ትርጓሜ ያስገባል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «ከፍ ከፍ አደረገው» የመጽሐፍ ቅዱስን የክብር አገላለጽ ሳያጠፋ ተፈጥሯዊ ነው፤ «ንስሓ» ደግሞ ከ«የአእምሮ ለውጥ» ይልቅ የμετάνοιαን ሙሉ ሃይማኖታዊና ሥነ ምግባራዊ ክብደት ይጠብቃል።
