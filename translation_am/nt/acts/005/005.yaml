base_translation:
  language: en
  yaml_path: translation/nt/acts/005/005.yaml
  text: But when Ananias heard these words[a], he fell down and died. And great fear came upon all who heard.
translation:
  language: am
  text: ሐናንያ ግን እነዚህን ቃላት ሲሰማ ወድቆ ሞተ[a]። በሰሙ ሁሉ ላይም ታላቅ ፍርሃት መጣ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ «የመጨረሻ እስትንፋሱን አወጣ»።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούων
  choice: ሲሰማ
  rationale: የአሁን ጊዜ አሳታፊውን በዐውዱ ውስጥ ጊዜን እንደሚያመለክት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: δὲ
  choice: -ም
  rationale: በአማርኛ የትረካ ሽግግሩንና ቀላል ንጽጽሩን ያለ ከባድ ተቃርኖ በተፈጥሮ ያሳያል።
- source_word: λόγους τούτους
  choice: ይህን ቃል
  rationale: የጴጥሮስን ንግግር የሚያመለክት ሲሆን፣ በአማርኛ «ይህን ቃል» የተነገረውን ነገር በተፈጥሮ ይገልጣል።
- source_word: πεσὼν
  choice: ወድቆ
  rationale: ከዋናው ግስ በፊት የሆነውን አካላዊ ድርጊት በቀጥታ ይጠብቃል፤ «ተደፋ» ወይም «ተንኮታኮተ» ከሚሉ ይበልጥ ከምንጩ ጋር ይቀራረባል።
- source_word: ἐξέψυξεν
  choice: ሞተ
  rationale: ግሱ በቃል በቃል የመጨረሻ እስትንፋስን መተንፈስ የሚያመለክት ቢሆንም፣ በትረካው ውስጥ ግልጽ ትርጉሙ ሞት ነው። «ሞተ» ለዘመናዊ አንባቢ ግልጽ ሲሆን ቃል በቃል አማራጩ በማስታወሻ ተጠብቋል።
- source_word: ἐγένετο φόβος μέγας
  choice: ታላቅ ፍርሃት መጣ
  rationale: ፍርሃት በቡድኑ ላይ በድንገት መድረሱን በተፈጥሯዊና ክቡር አማርኛ ይገልጣል።
- source_word: ἐπὶ πάντας τοὺς ἀκούοντας
  choice: በሰሙትም ሁሉ ላይ
  rationale: አሳታፊውን በስም ተግባር «የሰሙት ሁሉ» ብሎ ያቀርባል፤ ምን እንደሰሙ በትርጉሙ ውስጥ በተጨማሪ አይወስንም።
- source_word: Ἁνανίας
  choice: ሐናንያ
  rationale: ስሙን በአማርኛ የተለመደውን የመጽሐፍ ቅዱስ አጻጻፍ በመከተል ያቀርባል።
theological_decisions:
- issue: የሐናንያ ሞት ምክንያትና አፈጻጸም
  choice: ወድቆ እንደሞተ ብቻ በቀጥታ መግለጽ
  alternative: ከድንጋጤ በተፈጥሮ ሞተ፣ ወይም እግዚአብሔር በቀጥታ ቀሥፎ ገደለው ብሎ መግለጽ
  rationale: የግሪክ ጽሑፉ ወድቆ መሞቱንና ታላቅ ፍርሃት መከተሉን ይናገራል፤ የሞቱን አካላዊ ወይም መለኮታዊ አፈጻጸም ግን በግልጽ አይገልጽም። ትርጉሙ ይህን ክፍትነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር አማርኛ ተጠቅሟል። የግሪኩ የትረካ ቅደም ተከተልና አካላዊ ምስል ተጠብቀዋል፤ የሞቱ ዘዴ ግን ከጽሑፉ በላይ አልተወሰነም።
