  choice: ጴጥሮስም እርሷን ... አላት
  rationale: የግሪኩ ἀποκρίνομαι በውይይት አውድ ‘መለሰ/አለ’ የሚል ነው፤ ቀዳሚ ጥያቄ በግልጽ ስላልተነገረ በዘመናዊ አማርኛ ‘አላት’ ተፈጥሯዊ ነው። δέ በ‘-ም’ የትረካውን ሽግግር ያሳያል።
- source_word: Εἰπέ μοι
  choice: ንገሪኝ
  rationale: የነጠላ ሴት ተናጋሪን የሚያመለክተውን የትእዛዝ ቅርጽና μοι (‘ለእኔ’) በአንድ ተፈጥሯዊ የአማርኛ ቃል ይጠብቃል።
- source_word: εἰ
