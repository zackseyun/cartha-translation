  yaml_path: translation/nt/acts/005/022.yaml
  text: But when the officers arrived, they did not find them in the prison; so they returned and reported,
translation:
  language: am
  text: ባለሥልጣኖቹ ግን በደረሱ ጊዜ በእስር ቤቱ ውስጥ አላገኟቸውም፤ ተመልሰውም እንዲህ ሲሉ አሳወቁ፦
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγενόμενοι
  choice: በደረሱ ጊዜ
  rationale: የግስ አጋዥ ቅርጹን እንደ ጊዜ አመልካች በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ὑπηρέται
  choice: አገልጋዮቹ
  rationale: በአይሁድ መሪዎች ሥልጣን ሥር ያሉ ኦፊሴላዊ አስፈጻሚዎችን ሊያመለክት የሚችለውን ቃል ያለማጥበብ ይጠብቃል፤ ‘የቤተ መቅደስ ጠባቂዎች’ ማለት ከግሪኩ ይልቅ ገላጭ ነው።
- source_word: οὐχ εὗρον
  choice: አላገኟቸውም
  rationale: በትረካ አውድ የሚጠበቀውን ቀጥተኛና ተፈጥሯዊ ትርጉም ይሰጣል።
- source_word: ἐν τῇ φυλακῇ
  choice: በእስር ቤቱ ውስጥ
  rationale: የተወሰነውን አስቀድሞ የተጠቀሰውን እስር ቤት በድርብ መስተዋድድ ሳያደበዝዝ ያመለክታል።
- source_word: ἀναστρέψαντες
  choice: ተመልሰው
  rationale: ከእስር ቤቱ ወደ ላኳቸው ሰዎች መመለሳቸውን በአጭርና ተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: ἀπήγγειλαν
  choice: አሳወቁ
  rationale: ኦፊሴላዊ ዘገባ መመለስን የሚገልጽ የተለመደ አማርኛ ነው።
- source_word: δέ
  choice: ግን / ስለዚህ
  rationale: የመጀመሪያው δέ ከተጠበቀው ውጤት ጋር ያለውን ንጽጽር ‘ግን’ በማለት ያሳያል፤ ሁለተኛው የትረካውን ተከታታይነት ‘ስለዚህ’ በሚል ተፈጥሯዊ አገናኝ ያቀርባል።
