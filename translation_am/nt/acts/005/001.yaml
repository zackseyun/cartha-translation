  yaml_path: translation/nt/acts/005/001.yaml
  text: But a man named Ananias[a], with Sapphira his wife, sold a piece of property.
translation:
  language: am
  text: ነገር ግን ሐናንያ የሚባል አንድ ሰው ከሚስቱ ሰጲራ ጋር አንድ ንብረት[a] ሸጠ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ይዞታ።” የግሪኩ ቃል በሰፊው ንብረትን ወይም የማይንቀሳቀስ ይዞታን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνὴρ δέ τις
  choice: ነገር ግን … አንድ ሰው
  rationale: δέ ከበርናባስ ታሪክ ጋር ያለውን ቀላል ንጽጽር ‘ነገር ግን’ በማለት ያሳያል፤ ἀνήρ እና τις ደግሞ በተፈጥሯዊ አማርኛ ‘አንድ ሰው’ ተብለዋል።
- source_word: Ἁνανίας ὀνόματι
  choice: ሐናንያ የሚባል
  rationale: ὀνόματι አንድን ሰው በስሙ የሚያስተዋውቅ አገላለጽ ስለሆነ፣ ዘመናዊና ተፈጥሯዊው ‘የሚባል’ ተመርጧል።
- source_word: σὺν Σαπφίρῃ τῇ γυναικὶ αὐτοῦ
  choice: ከሚስቱ ሰጲራ ጋር
  rationale: σύν አብሮነትን ያመለክታል፤ γυνή በዚህ የባለቤትነት አወቃቀር ‘ሚስት’ ማለት ነው።
- source_word: ἐπώλησεν
  choice: ሸጠ
  rationale: የተፈጸመ ያለፈ ድርጊትን በቀጥታና በተፈጥሯዊ የአማርኛ ትረካ ያቀርባል።
- source_word: κτῆμα
  choice: አንድ ንብረት
  rationale: ቃሉ ሊሸጥ የሚችልን ይዞታ ወይም የማይንቀሳቀስ ንብረት በሰፊው ሊያመለክት ስለሚችል፣ ‘ንብረት’ የቃሉን ስፋት ሳያጠብ ያቆያል።
theological_decisions:
- issue: ከበርናባስ ቀዳሚ ታሪክ ጋር ያለው የትረካ ንጽጽር
  choice: δέን ‘ነገር ግን’ ብሎ መተርጎም
  alternative: ‘በዚህ ጊዜ’ ወይም ‘እና’ ብሎ እንደ ቀላል ሽግግር መተርጎም
  rationale: ዐውደ ንባቡ የበርናባስን ድርጊት ከሐናንያ እና ከሰጲራ ቀጣይ ድርጊት ጋር ያነጻጽራል፤ ‘ነገር ግን’ ይህን የንግግር ኃይል ያቆያል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የቃላት ቅደም ተከተል ወደ ተፈጥሯዊ የአማርኛ አወቃቀር ተስተካክሏል፤ የሰዎቹ ስሞች በተለመደው የአማርኛ መጽሐፍ ቅዱሳዊ አጻጻፍ ቀርበዋል።
