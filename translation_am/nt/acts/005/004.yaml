    text: ወይም፣ “በአንተ ውሳኔ ሥር” ወይም “እንደፈለግህ ልታደርገው በአንተ እጅ አልነበረምን?”
    reason: lexical_alternative
  - marker: b
    text: እዚህ “ሰዎች” የሚለው ሰውን ሁሉ በአጠቃላይ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: μένον / ἔμενεν
  choice: ሳይሸጥ ሳለ … አልነበረምን?
  rationale: የንብረቱን ከመሸጡ በፊት የነበረ ቀጣይ ሁኔታና የአናንያ ባለቤትነት በተፈጥሯዊ አማርኛ ያሳያል፤ የግሪኩ የግስ ድግግሞሽ ግን ቃል በቃል ቢተረጎም አገላለጹን ያከብደዋል።
- source_word: σοὶ
  choice: የአንተ
  rationale: ዳቲቩ በዐውዱ የባለቤትነት ትርጉም ስላለው፣ በአማርኛ የተፈጥሮ አገላለጽ የሆነው ‘የአንተ’ ተመርጧል።
- source_word: πραθέν
  choice: ከተሸጠም በኋላ
  rationale: የአኦሪስት ተገብሮ አንቀጽን ግልጽና ተፈጥሯዊ በሆነ የአማርኛ ጊዜያዊ ንዑስ አረፍተ ነገር ያቀርባል።
- source_word: ἐν τῇ σῇ ἐξουσίᾳ ὑπῆρχεν
  choice: በአንተ ሥልጣን ሥር አልነበረምን?
  rationale: ἐξουσία የሚያመለክተውን ሕጋዊ ሥልጣን፣ መብትና የመወሰን ነጻነት ይጠብቃል፤ ገንዘቡን እንደፈለገ ለመጠቀም በእርሱ ውሳኔ ሥር እንደነበር ያሳያል።
- source_word: τί ὅτι
  choice: ለምን
  rationale: በአማርኛ የጥያቄውን የተግሣጽ ኃይል በቀጥተኛና ተፈጥሯዊ መንገድ ያስተላልፋል።
- source_word: ἔθου ἐν τῇ καρδίᾳ σου
  choice: በልብህ … አኖርክ
  rationale: የግሪኩን ‘በልብ ማኖር’ ምሳሌያዊ አነጋገርና ውስጣዊ ውሳኔ የሚያመለክተውን ኃይል ይጠብቃል።
- source_word: τὸ πρᾶγμα τοῦτο
  choice: ይህን ነገር
  rationale: πρᾶγμα ያለውን ሰፊ ‘ነገር/ጉዳይ/ድርጊት’ ትርጉም ያለ ተጨማሪ ትርጓሜ ይጠብቃል።
- source_word: οὐκ ἐψεύσω ἀνθρώποις ἀλλὰ τῷ θεῷ
