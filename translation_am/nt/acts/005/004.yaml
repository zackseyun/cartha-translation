  rationale: የψεύδομαι ከዳቲቭ ጋር ያለውን ‘ለአንድ ሰው መዋሸት’ ትርጉምና በሰዎችና በእግዚአብሔር መካከል ያለውን ጠንካራ ንጽጽር ይጠብቃል።
theological_decisions:
- issue: በቅርብ ዐውዱ ውስጥ ስለ መንፈስ ቅዱስ መለኮት ያለው አንድምታ (ሐዋ. 5፥3ን ይመልከቱ)
  choice: አንቀጹ እንደሚለው ‘ለእግዚአብሔር’ ተብሎ በቀጥታ ተተርጉሟል።
  alternative: ‘ለእግዚአብሔር፣ ማለትም ለመንፈስ ቅዱስ’ በማለት ከቁጥር 3 ጋር በትርጉሙ ውስጥ በግልጽ ማስማማት።
  rationale: ይህ ቁጥር ራሱ ‘ለእግዚአብሔር’ ይላል። ዐውዱ ለሥላሴ ትምህርት ጠንካራ አንድምታ ቢኖረውም፣ ትርጉሙ በጽሑፉ ውስጥ ማብራሪያ አይጨምርም።
- issue: በንብረቱና በሽያጩ ገንዘብ ላይ የነበረው ባለቤትነትና የመወሰን ነጻነት
  choice: አናንያ በንብረቱና በገንዘቡ ላይ እውነተኛ ሥልጣን እንደነበረው ተገልጿል።
  alternative: የመወሰን ነጻነቱን ሳያሳይ ተራ ይዞታን ብቻ ማመልከት።
  rationale: የጴጥሮስ ነጥብ ኃጢአቱ ንብረትን አለመስጠቱ ሳይሆን ማታለሉ እንደነበር ነው። ‘በአንተ ሥልጣን ሥር’ የሚለው ይህን ይጠብቃል።
- issue: ἀνθρώποις የሚለው የግሪክ ቃል
  choice: ‘ሰዎች’ ተብሎ ሁሉንም የሰው ልጆች በሚያካትት መንገድ ተተርጉሟል።
  alternative: ‘ወንዶች’ ብሎ በጾታ የተወሰነ ትርጉም መስጠት።
  rationale: ἀνθρώποις እዚህ ላይ ወንዶችን ብቻ ሳይሆን ሰዎችን በአጠቃላይ ያመለክታል፤ ‘ሰዎች’ ትክክለኛና ተፈጥሯዊ የአማርኛ አቻ ነው።
