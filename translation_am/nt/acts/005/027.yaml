  yaml_path: translation/nt/acts/005/027.yaml
  text: After bringing them in, they stood them before the council, and the high priest questioned them.
translation:
  language: am
  text: እነርሱን ካመጡ በኋላ፣ በምክር ቤቱ[a] ፊት አቆሟቸው፤ ሊቀ ካህናቱም ጠየቃቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በሳንሄድሪን ፊት።” የግሪኩ συνέδριον የአይሁድን ገዥ ምክር ቤት ያመለክታል።
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀγαγόντες
  choice: ካመጧቸው በኋላ
  rationale: የግሪኩ የአኦሪስት አሳታፊ ግስ ከዋናው ድርጊት በፊት የተፈጸመውን ተግባር ያሳያል፤ ይህ አተረጓጎም የድርጊቶቹን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: δὲ
  choice: -ም
  rationale: ቀላል የትረካ ማያያዣነቱን በአማርኛው ተያያዥ ቅጥያ በተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: ἔστησαν
  choice: አቆሟቸው
  rationale: ἵστημι እዚህ ‘እንዲቆሙ ማድረግ፣ ማቆም’ በሚለው ተሻጋሪ ትርጉም ነው፤ ‘አቆሟቸው’ የፍርድ መሰል ትዕይንቱን ተጨባጭነት ይጠብቃል።
- source_word: ἐν τῷ συνεδρίῳ
  choice: በሸንጎው ፊት
  rationale: συνέδριον የአይሁድን ገዥ ምክር ቤት ያመለክታል። ‘ሸንጎ’ የጋራ ምክርና የፍርድ ስብሰባን የሚያሳይ ግልጽ አማርኛ ሲሆን፣ ‘ፊት’ ከ‘አቆሟቸው’ ጋር ተፈጥሯዊ ነው።
- source_word: ἐπηρώτησεν
  choice: ጠየቃቸው
  rationale: ቃሉ መጠየቅን ወይም በይፋ ጥያቄ ማቅረብን ያመለክታል፤ የፍርድ አውዱን ሳያጋንን ‘ጠየቃቸው’ ትክክለኛና ተፈጥሯዊ ነው።
- source_word: ὁ ἀρχιερεὺς
  choice: ሊቀ ካህናቱ
  rationale: በዚህ አውድ የሚመራውን ዋና ካህን የሚገልጽ የተለመደና ትክክለኛ አማርኛ ነው።
theological_decisions:
- issue: የσυνέδριον አተረጓጎም
  choice: ሸንጎው
  alternative: ሳንሄድሪን
  rationale: ዋናው ጽሑፍ የግሪኩን የጋራ ስም በትርጉም ያቀርባል፤ ባህላዊው ስያሜ ግን ለማብራሪያ በግርጌ ማስታወሻ ተጠቅሷል። በአውዱ የተመለከተው የአይሁድ ገዥ ምክር ቤት መሆኑ ተጠብቋል።
