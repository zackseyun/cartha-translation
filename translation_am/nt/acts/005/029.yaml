  text: ጴጥሮስና ሐዋርያቱ ግን መልሰው፣ “ከሰዎች[a] ይልቅ ለእግዚአብሔር መታዘዝ አለብን” አሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ከሰው ልጆች።” የግሪኩ ቃል ሰዎችን በአጠቃላይ ያመለክታል፤ በዚህ አውድ ግን በተለይ የሰው ባለሥልጣናትን ይጨምራል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπαν
  choice: መልሰው … አሉ
  rationale: የግሪኩ የመልስ አሰጣጥ ቀመር በአማርኛ ተፈጥሯዊ በሆነው “መልሰው … አሉ” ተተርጉሟል፤ ሁለቱንም የግስ ክፍሎች ሳያጠፋ የንግግሩን ተግባር ያሳያል።
- source_word: δὲ
  choice: ግን
  rationale: ከቀደመው የሸንጎው ትእዛዝ ጋር ያለውን መጠነኛ ተቃርኖ ያሳያል።
- source_word: Πέτρος καὶ οἱ ἀπόστολοι
  choice: ጴጥሮስና ሐዋርያት
  rationale: የጴጥሮስን ስምና ለታወቀው የሐዋርያት ቡድን የተለመደውን አማርኛ ቃል ይጠቀማል።
- source_word: Πειθαρχεῖν
  choice: መታዘዝ
  rationale: ቃሉ ሥልጣን ላለው መታዘዝን ያመለክታል፤ “መታዘዝ” በዚህ አውድ ግልጽና ተፈጥሯዊ ነው።
- source_word: δεῖ
  choice: አለብን
  rationale: አስፈላጊነትንና ግዴታን ያሳያል፤ በንግግሩ ውስጥ የተገመተውን የመጀመሪያ መደብ ብዙ ቁጥር በተፈጥሯዊ አማርኛ ግልጽ ያደርጋል።
- source_word: θεῷ
  choice: ለእግዚአብሔር
  rationale: የመታዘዝን ተቀባይ በአማርኛ ተፈጥሯዊ በሆነው የ“ለ-” አገባብ ያሳያል።
- source_word: μᾶλλον ἢ
  choice: ከ… ይልቅ
  rationale: በእግዚአብሔርና በሰዎች መካከል ያለውን ንጽጽርና ቅድሚያ በግልጽ አማርኛ ይገልጣል።
- source_word: ἀνθρώποις
  choice: ሰዎች
  rationale: ἄνθρωποι እዚህ ከእግዚአብሔር ጋር በንጽጽር የቀረቡትን ሰዎች፣ በአውዱም የሰው ባለሥልጣናትን፣ በአጠቃላይ ያመለክታል፤ “ሰዎች” ጾታን ሳያክል ይህን ሰፊ ትርጉም ይጠብቃል።
theological_decisions:
- issue: θεῷ እና ἀνθρώποις መካከል ያለው የመታዘዝ ቅድሚያ
  choice: “ከሰዎች ይልቅ ለእግዚአብሔር”
  alternative: “ከሰው ባለሥልጣናት ይልቅ ለእግዚአብሔር”
  rationale: አውዱ የሰው ባለሥልጣናትን ቢያመለክትም፣ ግሪኩ አጠቃላይ የሆነውን “ሰዎች” የሚል ቃል ይጠቀማል። ስለዚህ ዋናው ጽሑፍ የምንጩን ስፋት ጠብቆ፣ የአውዱን ልዩ አመልካችነት በማስታወሻ ያብራራል፤ ከጽሑፉ በላይ የሆነ የቤተ እምነት አቋም አይጨምርም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። “መልሰው … አሉ” የትረካውን ቅርጽ ይጠብቃል፤ “አለብን” ደግሞ የግሪኩን ግዴታ በተፈጥሯዊ አነጋገር ያስተላልፋል።
