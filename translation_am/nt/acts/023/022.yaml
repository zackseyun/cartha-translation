translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። የግሪኩን የተውሳከ ግስ አወቃቀር በአማርኛ ተፈጥሯዊ ወደሆነ ‘አዘዘውና ሸኘው’ ተከታታይነት ተለውጧል። የእንግሊዝኛው የግርጌ ማስታወሻ ምልክት ከ‘young man’ በኋላ ተቀምጦ ሳለ ማስታወሻው የሚመለከተው ἐνεφάνισας ነው፤ በአማርኛ ‘አሳወቅ’ ትርጉሙን በበቂ ግልጽነት ስለሚይዝ አላስፈላጊ የግርጌ ማስታወሻ አልተጨመረም።
