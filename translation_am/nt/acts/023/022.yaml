id: ACT.23.22
reference: Acts 23:22
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ μὲν οὖν χιλίαρχος ἀπέλυσε τὸν ⸀νεανίσκον παραγγείλας μηδενὶ ἐκλαλῆσαι ὅτι ταῦτα ἐνεφάνισας πρὸς ⸀ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/022.yaml
  text: So the commander dismissed the young man[a], instructing him, “Tell no one that you have reported these things to me.”
translation:
  language: am
  text: ስለዚህ አዛዡ ወጣቱን አሰናበተው፤ እንዲህም ብሎ አዘዘው፦ “እነዚህን ነገሮች ለእኔ እንዳሳወቅኸኝ ለማንም አትንገር።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χιλίαρχος
  choice: አዛዡ
  rationale: የሮምን ከፍተኛ የጦር መኮንን በተፈጥሯዊና በዘመናዊ አማርኛ ያመለክታል፤ ‘የሺ አለቃ’ የሚለውን ከመጠን በላይ ቃል በቃል አተረጓጎም ያስወግዳል።
- source_word: ἀπέλυσε
  choice: ሸኘው
  rationale: እዚህ ሰውየው ከእስር መፈታቱን ሳይሆን ውይይቱ ካበቃ በኋላ እንዲሄድ መሰናበቱን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: νεανίσκον
  choice: ወጣቱን
  rationale: ወጣት ወንድን በክብርና በተለመደ ዘመናዊ አገላለጽ ያመለክታል።
- source_word: παραγγείλας
  choice: አዘዘውና
  rationale: ከበላይ ባለሥልጣን የተሰጠውን ግልጽ መመሪያ ያሳያል፤ የግሪኩን ተውሳከ ግስ በተፈጥሯዊ የአማርኛ ተከታታይ ግስ ቅርጽ ያቀርባል።
- source_word: μηδενὶ ἐκλαλῆσαι
  choice: ለማንም አትናገር
  rationale: ጉዳዩን ለማንም እንዳይገልጥ የተሰጠውን ክልከላ በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐνεφάνισας
  choice: እንዳሳወቅኸኝ
  rationale: መረጃውን ለባለሥልጣኑ ማቅረቡን ይገልጣል፤ በዐውዱ ‘ሪፖርት አደረግህ’ ከሚለው ይልቅ ተፈጥሯዊ ነው።
- source_word: ταῦτα
  choice: ይህን ነገር
  rationale: ቀደም ሲል የተነገረውን መረጃ በአማርኛ ተፈጥሯዊ በሆነ የጋራ አገላለጽ ይጠቅሳል።
- source_word: πρὸς ἐμέ
  choice: ለእኔ
  rationale: መረጃው ወደ አዛዡ መቅረቡን ከ‘አሳወቀ’ ግስ ጋር በሚስማማ ተፈጥሯዊ አማርኛ ያሳያል።
