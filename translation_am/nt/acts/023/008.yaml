review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the explanatory contrast, the Sadducees’ denial of resurrection, angel, and spirit, and the Greek wording “both.” However, the negative coordination can be represented more explicitly in Amharic, and the current rendering of ὁμολογοῦσιν (“እውነት መሆናቸውን ይቀበላሉ”) is less idiomatic for angel and spirit.
  naturalness: “መልአክ ወይም መንፈስ” is understandable under “የለም,” but repeating “ሆነ” makes the threefold denial clear and natural. “ሁለቱም እንዳሉ ይቀበላሉ” is clearer modern standard Amharic than saying that the two are ‘true.’
  terminology: The established names “ሰዱቃውያን” and “ፈሪሳውያን,” and the theological term “ትንሣኤ,” are appropriate. “መልአክ” and “መንፈስ” properly retain the source terms without resolving their referential scope.
  issues:
  - severity: low
    issue: The paired Greek negation μήτε...μήτε is rendered with “ወይም.”
    rationale: Though not wrong in context, “ሆነ ... ሆነ” more transparently conveys that neither of the two exists, alongside the denial of resurrection.
  - severity: medium
    issue: “ሁለቱንም እውነት መሆናቸውን ይቀበላሉ” is semantically and stylistically awkward.
    rationale: Angels and spirits are more naturally said to exist, rather than to be ‘true.’ The revision conveys acknowledgment of their existence while preserving the source’s “both.”
  revised_text: ሰዱቃውያን ትንሣኤም ሆነ መልአክም ሆነ መንፈስ የለም ይላሉና፤ ፈሪሳውያን ግን ሁለቱም እንዳሉ ይቀበላሉ።[a]
