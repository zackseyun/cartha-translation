base_translation:
  language: en
  yaml_path: translation/nt/acts/023/008.yaml
  text: For the Sadducees say there is no resurrection[a], nor angel nor spirit, but the Pharisees acknowledge both.
translation:
  language: am
  text: ሰዱቃውያን ትንሣኤም ሆነ መልአክም ሆነ መንፈስ የለም ይላሉና፤ ፈሪሳውያን ግን ሁለቱም እንዳሉ ይቀበላሉ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ፈሪሳውያን ግን ሦስቱንም ይቀበላሉ”—ማለትም ትንሣኤን፣ መልአክንና መንፈስን። የግሪኩ ጽሑፍ “ሁለቱንም” ይላል፤ ይህም በቀጥታ መልአክንና መንፈስን የሚያመለክት ቢመስልም፣ አንዳንዶች ከአውዱ በመነሣት ቃሉ ሦስቱንም እንደሚያካትት ይረዱታል።
    reason: alternative_reading
lexical_decisions:
- source_word: Σαδδουκαῖοι
  choice: ሰዱቃውያን
  rationale: የአይሁድ ሃይማኖታዊ ቡድን ስም በተለመደው የአማርኛ አጻጻፍ በድምፅ ተገልብጧል።
- source_word: μὲν γὰρ
  choice: ይላሉና
  rationale: γὰρ የሚያሳየውን ማብራሪያዊ ምክንያት በተፈጥሯዊ የአማርኛ አያያዝ ይገልጣል፤ μὲν ደግሞ ከቀጣዩ δὲ ጋር ያለውን ንጽጽር ያዘጋጃል።
- source_word: λέγουσιν μὴ εἶναι
  choice: የለም ይላሉ
  rationale: የመኖርን መካድ በዘመናዊና ግልጽ አማርኛ ያቀርባል።
- source_word: ἀνάστασιν
  choice: ትንሣኤ
  rationale: ከሞት መነሣትን ለሚያመለክተው የግሪክ ስም በአማርኛ የተለመደውና ክብር ያለው ቃል ነው።
- source_word: μήτε ἄγγελον μήτε πνεῦμα
  choice: መልአክ ወይም መንፈስ
  rationale: ሁለቱን ነጠላ ስሞችና ተከታታይ አሉታዊ አያያዛቸውን በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: Φαρισαῖοι
  choice: ፈሪሳውያን
  rationale: የቡድኑን ስም በተለመደው የአማርኛ መጽሐፍ ቅዱሳዊ አጻጻፍ ያቀርባል።
- source_word: ὁμολογοῦσιν
  choice: እውነት መሆናቸውን ይቀበላሉ
  rationale: በዚህ አውድ ‘እውነት መሆኑን ማመን/ማረጋገጥ’ የሚለውን ትርጉም ያስተላልፋል፤ ‘መናዘዝ’ የሚለውን ሌላ ሊያሳስት የሚችል ስሜት ያስወግዳል።
- source_word: τὰ ἀμφότερα
  choice: ሁለቱንም
  rationale: የግሪኩን ‘ሁለቱንም’ የሚል ቀጥተኛ አገላለጽ ጠብቆ የማመልከቻውን አሻሚነት በማስታወሻ ያብራራል።
theological_decisions:
- issue: “ሁለቱንም” የሚለው የፈሪሳውያን እውቅና ምን እንደሚያካትት
  choice: የግሪኩን ቀጥተኛ ቃል ‘ሁለቱንም’ በዋናው ጽሑፍ ማቆየት፣ በቅርቡ የተጠቀሱትን መልአክና መንፈስ እንደሚያመለክት በቀዳሚነት መረዳት
  alternative: ፈሪሳውያን ትንሣኤን፣ መልአክንና መንፈስን—ሦስቱንም—ይቀበላሉ ብሎ መረዳት
  rationale: τὰ ἀμφότερα በቃል ደረጃ ‘ሁለቱንም’ ሲል፣ በአቅራቢያው ያለው μήτε...μήτε መልአክንና መንፈስን ያጣምራል። ሆኖም አውዱ ትንሣኤንም ስለሚያካትት ሦስቱን የሚመለከት ሰፊ አረዳድ በእግር ማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩ የምክንያትና የንጽጽር አወቃቀር ‘ይላሉና፤ ... ግን’ በሚል ተፈጥሯዊ አያያዝ ቀርቧል፤ የ‘ሁለቱንም’ አሻሚነት ሳይወገድ ተጠብቋል።
