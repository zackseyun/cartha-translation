    text: በቃል በቃል፣ “በአንተ ፊት ወደ እርሱ እንዲናገሩ” ማለት ነው፤ በፍርድ ቤት አገባብ ግን በእርሱ ላይ ያላቸውን ክስ እንዲያቀርቡ የሚል ፍቺ አለው።
