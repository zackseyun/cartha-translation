  text: በዚህ ሰው ላይ ሴራ እንደሚኖር በተነገረኝ ጊዜ፣ ወዲያውኑ ወደ አንተ ላክሁት፤ ከሳሾቹም በአንተ ፊት በእርሱ ላይ ያላቸውን ክስ እንዲያቀርቡ አዘዝኋቸው።[a]
  philosophy: optimal-equivalence
  footnotes:
