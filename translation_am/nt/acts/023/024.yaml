  rationale: ወደ አንድ ሰው ፊት የሚደረገውን እንቅስቃሴ በቀጥታ ያሳያል።
- source_word: ἡγεμόνα
  choice: ገዢው
  rationale: በሮም አስተዳደር ሥር ያለውን የክፍለ አገር ባለሥልጣን በግልጽና በተለመደ አማርኛ ይገልጣል።
