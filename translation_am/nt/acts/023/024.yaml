- source_word: ἵνα
  choice: እንዲያደርሱት
  rationale: የዓላማ ግንኙነቱን በአማርኛ የእንዲ- አወቃቀር በተፈጥሯዊነት ያስተላልፋል።
- source_word: ἐπιβιβάσαντες
  choice: በእነርሱ ላይ አስቀምጠው
  rationale: ጳውሎስን በተዘጋጁት እንስሳት ላይ እንዲጋልብ ማድረጋቸውንና ድርጊቱ ከማድረሱ በፊት መሆኑን ያሳያል።
- source_word: διασώσωσι
  choice: በሰላም እንዲያደርሱት
  rationale: በአደጋው መካከል ጠብቀው ወደ መድረሻው ማድረስን ያሳያል፤ በዚህ አውድ ከ‘ማዳን’ ይልቅ የጉዞውንና የጥበቃውን ገጽታ በግልጽ ይገልጣል።
- source_word: πρὸς
