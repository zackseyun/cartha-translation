  rationale: ቃሉ ፈረሶችን ብቻ ሳይሆን ለግልቢያ ወይም ለጭነት የሚያገለግሉ እንስሳትን በሰፊው ያመለክታል፤ በዚህ አውድ ጳውሎስ እንዲቀመጥባቸው ስለሚዘጋጁ የተግባራቸውን ትርጉም ይገልጣል።
- source_word: τε
