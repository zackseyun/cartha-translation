  text: προσκαλεσάμενος δὲ ὁ Παῦλος ἕνα τῶν ἑκατονταρχῶν ἔφη· Τὸν νεανίαν τοῦτον ⸀ἄπαγε πρὸς τὸν χιλίαρχον, ἔχει γὰρ ⸂ἀπαγγεῖλαί τι⸃ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/017.yaml
  text: So Paul called one of the centurions and said[a], “Take this young man to the commander, for he has something to report to him.”
translation:
  language: am
  text: ከዚያም ጳውሎስ ከመቶ አለቆች አንዱን ጠርቶ፣ “ይህን ወጣት ወደ ሻለቃው ውሰደው፤ ለእርሱ የሚያሳውቀው ነገር አለውና።[a]” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለእርሱ የሚነግረው ነገር አለውና።” የግሪኩ ግስ መንገርን፣ ማሳወቅን ወይም ሪፖርት ማድረግን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: ጠርቶ
  rationale: የግሪኩ አዮሪስት መካከለኛ አንቀጽ ጳውሎስ መቶ አለቃውን ወደ ራሱ እንደጠራ ያሳያል፤ «ጠርቶ» ተፈጥሯዊና ግልጽ ነው።
- source_word: δὲ
  choice: ስለዚህ
  rationale: እዚህ ጠንካራ ንጽጽር ሳይሆን ከቀደመው ሁኔታ የሚቀጥል የትረካ ግንኙነትን ያሳያል።
- source_word: ἕνα τῶν ἑκατονταρχῶν
  choice: ከመቶ አለቆቹ አንዱን
  rationale: ἑκατοντάρχης የሮማውያንን የመቶ ወታደሮች አለቃ ያመለክታል፤ «መቶ አለቃ» ታሪካዊ ትርጉሙን በግልጽ ያቀርባል።
- source_word: ἔφη
  choice: አለው
  rationale: በትረካዊ ንግግር ውስጥ ቀጥተኛና ተፈጥሯዊ የንግግር ግስ ነው፤ ተውላጠ ስሙም ንግግሩ ለመቶ አለቃው መሆኑን ያብራራል።
- source_word: νεανίαν
  choice: ወጣት
  rationale: ወጣት ወንድን የሚያመለክተውን ቃል በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἄπαγε
  choice: ውሰደው
  rationale: ትእዛዙ ወጣቱን ወደ ሌላ ሰው እንዲወስደው ወይም እንዲመራው ያመለክታል፤ «ውሰደው» በዚህ አውድ ተፈጥሯዊ ነው።
- source_word: πρὸς τὸν χιλίαρχον
  choice: ወደ ሻለቃው አዛዥ
  rationale: χιλίαρχος በዚህ አውድ የሮማ ወታደራዊ ትሪቡንን፣ ማለትም ከፍተኛ የሻለቃ አዛዥን ያመለክታል፤ ይህ አተረጓጎም ለዘመናዊ አንባቢ ደረጃውን በግልጽ ያሳያል።
- source_word: ἔχει γὰρ ἀπαγγεῖλαί τι αὐτῷ
  choice: የሚነግረው ነገር አለውና
  rationale: ἔχει ከኢንፊኒቲቭ ጋር «የሚያደርገው/የሚናገረው ነገር አለው» የሚል ሐሳብ ይሰጣል፤ ἀπαγγέλλω መናገርን፣ ማሳወቅን ወይም ሪፖርት ማድረግን ሊያመለክት ስለሚችል ሰፊው «የሚነግረው» ተመርጧል።
