base_translation:
  language: en
  yaml_path: translation/nt/acts/023/010.yaml
  text: And when a great dispute arose[a], the commander, fearing that Paul might be torn apart by them, ordered the troops to go down, seize him from among them[c][b], and bring him into the barracks.
translation:
  language: am
  text: ክርክሩም እጅግ በረታ።[a] የሺህ አለቃውም ጳውሎስን እንዳይበጣጥሱት ፈርቶ፣ ወታደሮቹ ወርደው ከመካከላቸው በኃይል እንዲወስዱትና ወደ ወታደሮቹ ሰፈር እንዲያስገቡት[c] አዘዘ።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ክርክር” የተባለው “አለመግባባት” ወይም “ሁከት” ተብሎም ሊተረጎም ይችላል፤ የግሪኩ ቃል (στάσις) ከባድ ውስጣዊ ግጭትን፣ በአንዳንድ ዐውድም ሕዝባዊ ዓመፅን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “እንዳይበጣጥሱት” የተባለው “እንዳይቀዳድዱት” ተብሎም ሊተረጎም ይችላል፤ የግሪኩ διασπασθῇ ቃል የኃይለኛ መቀዳደድን ምስል ይይዛል።
    reason: lexical_alternative
  - marker: c
    text: “የወታደሮቹ ሰፈር” የተባለው የግሪኩን παρεμβολή ይተረጉማል። ቃሉ በቀጥታ “ሰፈር” ማለት ሊሆን ይችላል፤ እዚህ ግን በኢየሩሳሌም የነበረውን የሮማውያን ወታደራዊ መኖሪያ ወይም ማደሪያ ያመለክታል።
    reason: cultural_note
