- source_word: ἐκέλευσεν τὸ στράτευμα καταβὰν
  choice: ወታደሮቹ ወርደው ... አዘዘ
  rationale: στράτευμα በዚህ ዐውድ በትእዛዙ ሥር ያሉትን ወታደሮች ያመለክታል፤ καταβὰν ደግሞ ከምሽጉ ወደ ታች የሚደረገውን እንቅስቃሴ ‘ወርደው’ ብሎ ይጠብቃል።
- source_word: ἁρπάσαι αὐτὸν ἐκ μέσου αὐτῶν
  choice: ከመካከላቸው በኃይል እንዲወስዱት
  rationale: ἁρπάζω ፈጣንና ኃይለኛ ማስወገድን ያመለክታል። ‘በኃይል እንዲወስዱት’ ይህን ኃይል ያስቀምጣል፣ ἐκ μέσου αὐτῶν ደግሞ ‘ከመካከላቸው’ ተብሎ በግልጽ ተተርጉሟል።
