  rationale: παρεμβολή በመሠረታዊ ትርጉሙ ‘ሰፈር’ ሊሆን ቢችልም፣ እዚህ በኢየሩሳሌም ያለውን የሮማውያን ወታደራዊ መኖሪያ ያመለክታል። ‘የወታደሮች ማደሪያ’ ለዘመናዊ አንባቢ ግልጽ ነው።
