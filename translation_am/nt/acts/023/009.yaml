id: ACT.23.9
reference: Acts 23:9
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐγένετο δὲ κραυγὴ μεγάλη, καὶ ἀναστάντες ⸂τινὲς τῶν γραμματέων⸃ τοῦ μέρους τῶν Φαρισαίων διεμάχοντο λέγοντες· Οὐδὲν κακὸν εὑρίσκομεν ἐν τῷ ἀνθρώπῳ τούτῳ· εἰ δὲ πνεῦμα ἐλάλησεν αὐτῷ ἢ ⸀ἄγγελος—
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/009.yaml
  text: Then a great outcry arose[a], and some of the scribes of the party of the Pharisees stood up and contended, saying, “We find nothing wrong in this man[b]. But if a spirit or an angel has spoken to him—”
translation:
  language: am
  text: ከዚያም ታላቅ ጩኸት ተነሣ፤ ከፈሪሳውያን ወገን የሆኑት ከሕግ መምህራን አንዳንዶቹ ተነሥተው አጥብቀው ተከራከሩ፤ እንዲህም አሉ፦ “በዚህ ሰው ምንም ክፉ ነገር አላገኘንም። ነገር ግን መንፈስ ወይም መልአክ ተናግሮት ከሆነ—”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪክ ጽሑፉ “ነገር ግን መንፈስ ወይም መልአክ ተናግሮት ከሆነ—” በሚል ያልተጠናቀቀ ሐረግ በድንገት ይቋረጣል።
    reason: source_syntax
lexical_decisions:
- source_word: κραυγὴ μεγάλη
  choice: ታላቅ ጩኸት
  rationale: የጩኸትንና የሁከትን ስሜት በቀጥታ ያስተላልፋል፤ ታላቅ የሚለውም μεγάληን ይጠብቃል።
- source_word: τινὲς τῶν γραμματέων
  choice: ከሕግ መምህራን አንዳንዶቹ
  rationale: በዚህ የአይሁድ ምክር ቤት አውድ γραμματεῖς የሙሴን ሕግ የሚያውቁና የሚያስተምሩ ሰዎችን ያመለክታል፤ ይህ አገላለጽ ለዘመናዊ አንባቢ ግልጽ ነው።
- source_word: τοῦ μέρους τῶν Φαρισαίων
  choice: ከፈሪሳውያን ወገን የሆኑት
  rationale: μέρος በዚህ ስፍራ ወገንን ወይም ቡድንን ያመለክታል፤ በተፈጥሯዊ አማርኛ የፈሪሳውያን ወገንተኝነታቸውን ያሳያል።
- source_word: ἀναστάντες
  choice: ተነሥተው
  rationale: የአካላዊውን መነሣት እና በጉባኤው ውስጥ ለመናገር መቆምን ይጠብቃል።
- source_word: διεμάχοντο
  choice: አጥብቀው ተከራከሩ
  rationale: ያልተቋረጠና ኃይለኛ ክርክር የሚያመለክተውን የግሪክ ግስ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: Οὐδὲν κακὸν εὑρίσκομεν ἐν τῷ ἀνθρώπῳ τούτῳ
  choice: በዚህ ሰው ምንም ክፉ ነገር አላገኘንም
  rationale: የፍርድ አውዱንና በሰውየው ላይ የሚያስወቅስ ነገር አለማግኘታቸውን ይጠብቃል።
- source_word: πνεῦμα
  choice: መንፈስ
  rationale: ከመልአክ ጋር የተጠቀሰውን አጠቃላይ መንፈሳዊ ፍጡር ሊያመለክት የሚችል ትርጉም ይጠብቃል፤ መንፈስ ቅዱስ ብሎ አይወስነውም።
- source_word: ἐλάλησεν αὐτῷ
  choice: ተናግሮት ከሆነ
  rationale: ንግግሩ ወደ ጳውሎስ መሆኑንና ያለፈ ድርጊት እንደ ግምት መቅረቡን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἄγγελος
  choice: መልአክ
  rationale: ከመንፈስ ጋር ባለው ከተፈጥሮ በላይ አውድ የሰው መልእክተኛ ሳይሆን መልአክን ያመለክታል።
theological_decisions:
- issue: ከἄγγελος ጋር የተቀመጠው πνεῦμα ትርጉም
  choice: መንፈስ፣ ማለትም በአጠቃላይ መንፈሳዊ ፍጡር ሊሆን የሚችል
  alternative: መንፈስ ቅዱስ
  rationale: ከ“መልአክ” ጋር ያለው ንጽጽር የፈሪሳውያንን የመንፈሳዊ ፍጡራን ምድቦች ያሳያል፤ ጽሑፉ ያልወሰነውን ማንነት ትርጉሙ አይወስንም።
- issue: የመጨረሻው ሐረግ ድንገተኛ መቋረጥ
  choice: ያልተጠናቀቀውን ሐረግ በረጅም ሰረዝ መጠበቅ
  alternative: የተሟላ የጥያቄ ዐረፍተ ነገር ማድረግ
  rationale: የግሪክ ጽሑፉ εἰ δὲ በሚል ሁኔታዊ ሐረግ ይጀምርና መልስ የሚሰጠው ዋና ሐረግ ሳይመጣ ይቋረጣል፤ ይህን አሻሚነትና ድንገተኛነት መጠበቅ ከምንጩ ጋር የቀረበ ነው።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ጸሐፍት” ከሚለው ባህላዊ ነገር ግን ዛሬ ለብዙዎች አሻሚ ከሆነው ቃል ይልቅ “የሕግ መምህራን” ተመርጧል።
