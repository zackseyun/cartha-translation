  text: Γνοὺς δὲ ὁ Παῦλος ὅτι τὸ ἓν μέρος ἐστὶν Σαδδουκαίων τὸ δὲ ἕτερον Φαρισαίων ⸀ἔκραζεν ἐν τῷ συνεδρίῳ· Ἄνδρες ἀδελφοί, ἐγὼ Φαρισαῖός εἰμι, υἱὸς ⸀Φαρισαίων· περὶ ἐλπίδος καὶ ἀναστάσεως νεκρῶν ⸀ἐγὼ κρίνομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/006.yaml
  text: But Paul[a], knowing that one part were Sadducees and the other Pharisees, cried out in the council, “Men, brothers, I am a Pharisee, a son of Pharisees[c][b]. It is concerning the hope and resurrection of the dead that I am being judged.”
translation:
  language: am
  text: ጳውሎስም የሸንጎው አንዱ ክፍል ሰዱቃውያን፣ ሌላው ክፍል ደግሞ ፈሪሳውያን እንደሆኑ አውቆ በሸንጎው[a] ውስጥ ጮክ ብሎ፣ “ወንድሞች ሆይ፣ እኔ ፈሪሳዊ፣ የፈሪሳውያንም ልጅ ነኝ[b]። እኔ እየተዳኘሁ ያለሁት ስለ ተስፋና ስለ ሙታን ትንሣኤ ነው[c]” አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በሳንሄድሪን” ሊባልም ይችላል። የግሪኩ ቃል በተለይ የአይሁድን የበላይ ሸንጎ ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “ከፈሪሳውያን ወላጆች የተወለድሁ” ወይም “የፈሪሳውያን ዘር ነኝ” ሊባልም ይችላል።
    reason: alternative_reading
  - marker: c
    text: “እየተዳኘሁ ያለሁት ስለ ሙታን ትንሣኤ ተስፋ ነው” ተብሎም ሊተረጎም ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: Γνοὺς
  choice: አውቆ
  rationale: የግሪኩን የቀደመ አድራጎት አሳታፊ ቅርጽ በተፈጥሯዊ የአማርኛ አገባብ ይገልጣል።
- source_word: τὸ ἓν μέρος ... τὸ δὲ ἕτερον
  choice: አንዱ ወገን ... ሌላው ደግሞ
  rationale: በሸንጎው ውስጥ ያሉትን ሁለት ክፍሎች በተፈጥሯዊና ግልጽ አማርኛ ያሳያል።
- source_word: Σαδδουκαίων / Φαρισαίων
  choice: ሰዱቃውያን / ፈሪሳውያን
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመዱ የቡድኖቹ ስሞች ናቸው።
- source_word: ἔκραζεν
  choice: ጮክ ብሎ ... አለ
  rationale: ቃሉ በከፍተኛ ድምፅ በሕዝብ ፊት መናገርን ያመለክታል፤ ይህ አተረጓጎም ኃይሉን ሳያጋንን ያቆያል።
- source_word: ἐν τῷ συνεδρίῳ
  choice: በሸንጎው መካከል
  rationale: συνέδριον በዚህ አውድ የአይሁድን የበላይ ሸንጎ ያመለክታል፤ “ሳንሄድሪን” የሚለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: Ἄνδρες ἀδελφοί
  choice: ወንድሞች ሆይ
  rationale: የግሪኩ ድርብ የጥሪ አገላለጽ በአማርኛ በተፈጥሯዊና ክብር ባለው የወንዶች አድራሻ ተላልፏል። “ወንዶች፣ ወንድሞች” የሚለው ቃል በቃል ቅርጽ በአማርኛ የተገደደ ስለሚመስል አልተመረጠም።
- source_word: Φαρισαῖός εἰμι
  choice: እኔ ፈሪሳዊ ... ነኝ
  rationale: የጳውሎስን ቀጥተኛ የአሁን ጊዜ ማንነት እንዳለ ያቆያል።
- source_word: υἱὸς Φαρισαίων
  choice: የፈሪሳውያንም ልጅ
  rationale: የግሪኩን ብዙ ቁጥርና የቤተሰብ ዘይቤ ይጠብቃል፤ ወላጆቹን ወይም የዘር ሐረጉን ብቻ እንደሚያመለክት አይወስንም።
- source_word: περὶ ἐλπίδος καὶ ἀναστάσεως νεκρῶν
  choice: ስለ ተስፋና ስለ ሙታን ትንሣኤ
  rationale: በግሪኩ καί የተያያዙትን “ተስፋ” እና “ትንሣኤ” እንደ ሁለት ቅርብ ጽንሰ ሐሳቦች ያቆያል፤ “የትንሣኤ ተስፋ” የሚለውን አማራጭ በማስታወሻ ያሳያል።
- source_word: κρίνομαι
  choice: እየተዳኘሁ ያለሁት
  rationale: የአሁን ጊዜ ተደራጊ ቅርጹንና የፍርድ ሂደቱን በግልጽ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: የጳውሎስ “የፈሪሳውያን ልጅ” የሚለው አባባል ትርጉም
  choice: የፈሪሳውያንም ልጅ ነኝ
  alternative: ከፈሪሳውያን ወላጆች የተወለድሁ፤ የፈሪሳውያን ዘር ነኝ
  rationale: የግሪኩ ብዙ ቁጥር የወላጅነትን፣ የዘር ሐረግን ወይም ሰፋ ያለ የቡድን ትስስርን ሊያመለክት ይችላል፤ ዋናው ጽሑፍ አንዱን ብቻ አይወስንም።
- issue: በጳውሎስ መከላከያ ውስጥ የ“ተስፋ” እና “የሙታን ትንሣኤ” ግንኙነት
  choice: ስለ ተስፋና ስለ ሙታን ትንሣኤ
  alternative: ስለ ሙታን ትንሣኤ ተስፋ
  rationale: ግሪኩ ሁለቱን በκαί ያስተባብራል፤ ይህም ሁለት በቅርብ የተያያዙ ጉዳዮችን ወይም በትንሣኤ ላይ ያተኮረ አንድ ተስፋን ሊገልጥ ይችላል። ዋናው ትርጉም የሰዋሰውን ትይዩነት ይጠብቃል።
