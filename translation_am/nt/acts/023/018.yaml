  text: እርሱም ወጣቱን ይዞ ወደ የጦር አዛዡ[a] አመጣውና፣ “እስረኛው ጳውሎስ ወደ እርሱ ጠርቶኝ፣ ይህን ወጣት[b] ወደ አንተ እንዳመጣው ጠየቀኝ፤ ሊነግርህ አንድ ነገር አለውና” አለው።
  philosophy: optimal-equivalence
