- source_word: ἐνεκάλουν αὐτῷ
  choice: የከሰሱበትን
  rationale: ግሱ በእርሱ ላይ ክስ እያቀረቡ መሆናቸውን ይገልጣል፤ የአማርኛው አገላለጽም ተከሳሹንና የክሱን ግንኙነት በግልጽ ያሳያል።
- source_word: κατήγαγον
  choice: አወረድኩት
  rationale: የግሪክኛውን ወደ ታች የማምጣት አቅጣጫዊ ዝርዝር ይጠብቃል።
- source_word: τὸ συνέδριον αὐτῶν
  choice: ሸንጎአቸው
  rationale: συνέδριον ምክር ሰጪና ፈራጅ ጉባኤን ያመለክታል፤ “ሸንጎ” ትርጉሙን ሳይገድብ በአጭሩ ያስተላልፋል፣ “አቸው”ም αὐτῶνን ይጠብቃል።
