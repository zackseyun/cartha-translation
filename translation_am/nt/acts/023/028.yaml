    text: ወይም፣ “ወደ ሳንሄድሪናቸው።” የግሪክኛው συνέδριον ሸንጎን ወይም ጉባኤን ያመለክታል፤ በዚህ ዐውድ ምናልባት በኢየሩሳሌም የነበረውን የአይሁድ ገዢ ሸንጎ ያመለክታል።
