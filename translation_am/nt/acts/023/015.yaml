  rationale: κατάγω ያለውን ወደ ታች የማምጣት አቅጣጫዊ ሐሳብ ይጠብቃል፤ አማራጩ በእግር ማስወረድን ሳይሆን በፊታቸው ማቅረብን ሊያመለክት ይችላል።
- source_word: ὡς μέλλοντας
