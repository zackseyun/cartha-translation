    text: በግሪክኛው “አይሁድ” ይላል፤ እዚህ ግን ቃሉ የአይሁድን ሕዝብ በሙሉ ሳይሆን በሴራው የተሳተፈውን የተወሰነ ቡድን ያመለክታል።
