  text: ቀን ሲነጋ፣ አይሁድ[a] ሴራ ጠነሰሱ፤ ጳውሎስን እስኪገድሉ ድረስ እንደማይበሉም እንደማይጠጡም በማለት ራሳቸውን በእርግማን አሰሩ[b]።
  philosophy: optimal-equivalence
  footnotes:
