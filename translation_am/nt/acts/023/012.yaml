    text: ወይም፣ “ራሳቸውን ከእርግማን በታች አደረጉ።” አገላለጹ ስእለታቸውን ባይፈጽሙ ፍርድ በራሳቸው ላይ እንዲደርስ የሚጠራ ቃለ መሐላ መግባታቸውን ያመለክታል።
    reason: lexical_alternative
