  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ቀላል የሆነ መደበኛ አማርኛ ተጠቅሟል። “አይዞህ” የጌታን ቀጥተኛ ማበረታቻ ተፈጥሯዊ ያደርገዋል፤ “መሰከር/መመስከር” ደግሞ የግሪኩን የቃል ትስስር ይጠብቃል። የማስታወሻ ምልክቶቹ ከሚያብራሯቸው ቃላት ቀጥለው ተቀምጠዋል።
