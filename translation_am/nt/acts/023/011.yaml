source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπιούσῃ νυκτὶ ἐπιστὰς αὐτῷ ὁ κύριος εἶπεν· ⸀Θάρσει, ὡς γὰρ διεμαρτύρω τὰ περὶ ἐμοῦ εἰς Ἰερουσαλὴμ οὕτω σε δεῖ καὶ εἰς Ῥώμην μαρτυρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/011.yaml
  text: But on the following night[a], the Lord stood by him and said, “Take courage, for just as you have testified about me in Jerusalem[b], so you must also testify in Rome.”
translation:
  language: am
  text: በቀጣዩ ሌሊት ጌታ በአጠገቡ ቆሞ፣ “አይዞህ![a] በኢየሩሳሌም ስለ እኔ እንደመሰከርክ[b]፣ እንዲሁ በሮምም መመስከር ያስፈልግሃል” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ልብ በል።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ምስክርነት እንደሰጠህ።” ጳውሎስ አስቀድሞ ያደረገውንና ወደፊት የሚያደርገውን ንግግር የሚገልጹት ሁለቱ የግሪክ ግሶች ከአንድ የምስክርነት ቃል ሥር የመጡ ናቸው።
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ ἐπιούσῃ νυκτί
  choice: በማግስቱም ሌሊት
  rationale: ἐπιούσῃ νυκτί የሚቀጥለውን ሌሊት ያመለክታል፤ ደግሞም δέ ያለውን ቀላል የትረካ ትስስር “-ም” ያሳያል።
- source_word: ἐπιστὰς αὐτῷ
  choice: በአጠገቡ ቆሞ
  rationale: የጌታን ቅርብና ደጋፊ መገኘት ሳይጨምር በተፈጥሯዊ አማርኛ ያቀርባል፤ “ታየው” ከሚለው የበለጠ የግሪኩን ቃል በቅርብ ይከተላል።
- source_word: ὁ κύριος
  choice: ጌታ
  rationale: በዐውዱ የትንሣኤውን ኢየሱስ የሚያመለክተውን የግሪኩን ስያሜ ሳይሰፋ ይጠብቃል።
- source_word: Θάρσει
  choice: አይዞህ!
  rationale: ለአንድ ወንድ የተነገረውን የማበረታቻ ትእዛዝ በዘመናዊና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: διεμαρτύρω
  choice: እንደመሰከርክ
  rationale: ጳውሎስ አስቀድሞ ያደረገውን ምስክርነት ያመለክታል፤ ከሚቀጥለው μαρτυρῆσαι ጋር ያለውን የቃል ዝምድናም በ“መሰከር” ይጠብቃል።
- source_word: τὰ περὶ ἐμοῦ
  choice: ስለ እኔ
  rationale: “እኔን የሚመለከቱትን ነገሮች” የሚለውን ሐሳብ በአጭርና ተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: εἰς Ἰερουσαλήμ
  choice: በኢየሩሳሌም
  rationale: εἰς እዚህ ከከተማ ስም ጋር የተፈጸመበትን ስፍራ ያመለክታል፤ በአማርኛ “በ-” ይህን በተፈጥሮ ያስተላልፋል።
- source_word: οὕτω
  choice: እንዲሁ
  rationale: በኢየሩሳሌም በተደረገውና በሮም ወደፊት በሚደረገው ምስክርነት መካከል ያለውን ተመሳሳይነት ያሳያል።
- source_word: σε δεῖ
  choice: ይገባሃል
  rationale: አስፈላጊነቱን በግልጽ ሁኔታ ይገልጻል፤ ጽሑፉ ከሚለው በላይ የዕጣ ፈንታ ወይም የግድ አስተምህሮ አይጨምርም።
- source_word: καὶ εἰς Ῥώμην
  choice: በሮምም
  rationale: καί ሮምን ተጨማሪ የምስክርነት ስፍራ አድርጎ ያቀርባል፤ የአማርኛው “-ም” የ“ደግሞ/እንዲሁም”ን ኃይል በተፈጥሮ ይሰጣል።
- source_word: μαρτυρῆσαι
  choice: መመስከር
  rationale: በሮም የሚደረገውን ወደፊት ምስክርነት ይገልጻል፤ ከδιεμαρτύρω ጋር ያለውን የግሪክ ቃላት ዝምድና ይጠብቃል።
theological_decisions:
- issue: የὁ κύριος ማንነት
  choice: “ጌታ” ተብሎ ተተርጉሟል፤ ዐውዱ ከራሱ ስለሚሰጠው ምስክርነት የሚናገረውን የትንሣኤውን ኢየሱስ ያመለክታል።
  alternative: “ጌታ ኢየሱስ” ብሎ ማስፋት።
  rationale: የግሪኩ ጽሑፍ “ጌታ” ብቻ ይላል። ትርጉሙ የዐውዱን ክርስቶሳዊ ማመልከቻ ይጠብቃል፣ ነገር ግን በጽሑፉ የሌለውን “ኢየሱስ” አይጨምርም።
- issue: የδεῖ ኃይል
  choice: “ይገባሃል” ተብሎ እንደ አስፈላጊነት ተገልጿል።
  alternative: “የተወሰነልህ ነው” ወይም “የግድ ነው”።
  rationale: በሐዋርያት ሥራ δεῖ ብዙ ጊዜ መለኮታዊ አስፈላጊነትን ሊያመለክት ይችላል። “ይገባሃል” ይህን ኃይል ይጠብቃል፣ ሆኖም ጽሑፉ ያልገለጸውን የዕጣ ፈንታ አስተምህሮ አያክልም።
