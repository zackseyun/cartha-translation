  text: ἀτενίσας δὲ ⸂ὁ Παῦλος τῷ συνεδρίῳ⸃ εἶπεν· Ἄνδρες ἀδελφοί, ἐγὼ πάσῃ συνειδήσει ἀγαθῇ πεπολίτευμαι τῷ θεῷ ἄχρι ταύτης τῆς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/001.yaml
  text: And Paul[a], looking intently at the council, said, “Brothers, I have lived before God with an entirely good conscience up to this day.”
translation:
  language: am
  text: ጳውሎስም ሸንጎውን ትኩር ብሎ ተመልክቶ፣ “ወንድሞች ሆይ፣ እኔ እስከዚህች ቀን ድረስ በእግዚአብሔር ፊት ፈጽሞ በመልካም ሕሊና ኖሬያለሁ[a]” አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በእግዚአብሔር ፊት እንደ ዜጋ ሕይወቴን መርቻለሁ።” ይህ አተረጓጎም የግሪኩ ግስ ያለውን የዜግነት ፍንጭ ይጠብቃል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίσας
  choice: ትኩር ብሎ ተመልክቶ
  rationale: የተመራና የጸና እይታን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል።
- source_word: δὲ
  choice: -ም
  rationale: ትረካውን የሚያስቀጥለውን ቀላል አያያዥ በአማርኛ ተስማሚ መንገድ ያቀርባል።
- source_word: τῷ συνεδρίῳ
  choice: ሸንጎውን
  rationale: በዚህ አውድ የአይሁድን የአስተዳደርና የፍርድ ጉባኤ የሚያመለክት የተለመደ አማርኛ ቃል ነው፤ የግሪኩን የጋራ ስም ባሕርይም ይጠብቃል።
- source_word: Ἄνδρες ἀδελφοί
  choice: ወንድሞች ሆይ
  rationale: ወንዶችን በቀጥታ የሚጠራውን አገላለጽ ተፈጥሯዊና ክብር ባለው አማርኛ ያስተላልፋል።
- source_word: πάσῃ συνειδήσει ἀγαθῇ
  choice: ፈጽሞ በመልካም ሕሊና
  rationale: πάσῃ ያለውን አጽንዖት በ‘ፈጽሞ’ ያሳያል፤ የዳቲቭ ሐረጉንም እንደ አኗኗር ሁኔታ ያቀርባል።
- source_word: πεπολίτευμαι
  choice: ኖሬአለሁ
  rationale: ፍጹም ጊዜው ከቀድሞ እስከ አሁን የዘለቀውን የአኗኗር ሁኔታ ያሳያል፤ የዜግነት ፍንጭ ግን በማስታወሻው ተጠብቋል።
- source_word: τῷ θεῷ
  choice: በእግዚአብሔር ፊት
  rationale: ሕይወቱ ከእግዚአብሔር ጋር ባለው ግንኙነትና በእርሱ እይታ ሥር እንደተመራ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἄχρι ταύτης τῆς ἡμέρας
  choice: እስከዚህች ቀን ድረስ
  rationale: ካለፈው ጊዜ እስከ አሁኑ ቅጽበት ያለውን ቀጣይነት በግልጽ መንገድ ይገልጻል።
theological_decisions:
- issue: የጳውሎስን πεπολίτευμαι የሚለውን ራስ-ገለጻ መተርጎም
  choice: በእግዚአብሔር ፊት ስለኖረበት አኗኗር የቀረበ አጠቃላይ ንግግር
  alternative: “በእግዚአብሔር ፊት እንደ ዜጋ ራሴን መርቻለሁ” በማለት የዜግነት ፍንጩን በዋናው ጽሑፍ ማጉላት፣ ወይም ንግግሩን ፍጹም ኃጢአት-አልባነት እንደሚያሳይ ማቅረብ
  rationale: ግሱ የዜግነት ፍንጭ ሊኖረው ቢችልም፣ አውዱ በመልካም ሕሊና ስለተመራ ሕይወት ነው። ትርጉሙ የፖለቲካ ወይም የዜግነት ምስልን አያጋንንም፣ ከጽሑፉም በላይ የሥነ ምግባር ፍጽምናን አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ሸንጎ” በዚህ ታሪካዊ አውድ የጉባኤውን ሚና በግልጽ ያሳያል።
