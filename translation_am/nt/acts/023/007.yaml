base_translation:
  language: en
  yaml_path: translation/nt/acts/023/007.yaml
  text: And as he was saying this[a], a dispute arose between the Pharisees and Sadducees[b], and the assembly was divided.
translation:
  language: am
  text: እርሱም ይህን እየተናገረ ሳለ፣ በፈሪሳውያንና በሰዱቃውያን መካከል ክርክር[a] ተነሣ፤ ጉባኤውም ተከፋፈለ[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “መቃቃር” ወይም “መለያየት።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ተሰብሳቢዎቹም ተከፋፈሉ” ወይም “ሕዝቡም ተከፋፈለ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ αὐτοῦ λαλοῦντος
  choice: እርሱም ይህን እየተናገረ ሳለ
  rationale: የግሪኩ የአሁን ጊዜ አሳታፊ ቅርጽ የሚያመለክተውን በአንድ ጊዜ መከናወን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐγένετο
  choice: ተነሣ
  rationale: ከστάσις ጋር ሲውል ግጭቱ መጀመሩን ወይም መፈጠሩን የሚገልጥ ተፈጥሯዊ የአማርኛ አነጋገር ነው።
- source_word: στάσις
  choice: ክርክር
  rationale: በዐውዱ የተነሣውን የአመለካከት ግጭት በግልጽና በዘመናዊ ቋንቋ ይገልጣል፤ ቃሉ መቃቃርን ወይም መለያየትንም ሊያመለክት ይችላል።
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: በፈሪሳውያንና በሰዱቃውያን መካከል
  rationale: የግሪኩን የባለቤትነት ቅርጽ ሁለቱ ተቃራኒ ወገኖች እነማን እንደሆኑ በሚያሳይ ተፈጥሯዊ የአማርኛ አገላለጽ ያቀርባል።
- source_word: ἐσχίσθη
  choice: ተከፋፈለ
  rationale: ቃሉ በቀጥታ ‘ተሰነጠቀ’ የሚል ምስል ቢኖረውም፣ በማኅበራዊ ዐውድ ቡድኑ ለሁለት መከፈሉን በተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: τὸ πλῆθος
  choice: ጉባኤው
  rationale: በዚህ ዐውድ ቃሉ በጳውሎስ ፊት የተሰበሰበውን አካል ያመለክታል፤ ‘ጉባኤው’ መደበኛውን የስብሰባ ዐውድ ያንጸባርቃል፣ ‘ሕዝቡ’ ወይም ‘ተሰብሳቢዎቹ’ የሚሉትንም የቃሉን ስፋት አያስቀርም።
