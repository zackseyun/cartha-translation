lexical_decisions:
- source_word: γράψας
  choice: ጻፈ
  rationale: የግሪክ አውሪስት አሳታፊው በቀደመው ቁጥር ያለውን ባለቤት የሚያመለክት ሲሆን፣ በተፈጥሯዊ የአማርኛ ትረካ ውስጥ በዋና ግስ ‘ጻፈ’ ተተርጉሟል።
- source_word: ἐπιστολήν
  choice: ደብዳቤ
  rationale: ἐπιστολή የጽሑፍ መልእክትን ያመለክታል፤ ‘ደብዳቤ’ በዚህ ትረካዊ አውድ ግልጽና ዘመናዊ ነው።
- source_word: ἔχουσαν
  choice: የሚል
  rationale: ቃል በቃል ‘ያለው/የያዘ’ ማለት ቢሆንም፣ ከደብዳቤ ቃላት በፊት ‘እንዲህ የሚል’ የሚለው ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
- source_word: τύπον
  choice: እንዲህ
  rationale: τύπος እዚህ የደብዳቤውን ቅርጽ፣ አቀራረብ ወይም ቃላት ያመለክታል። ወደሚቀጥለው ጽሑፍ በሚያመለክተው ፈሊጥ ‘እንዲህ የሚል’ ተብሎ ተሰጥቷል።
- source_word: τοῦτον
  choice: እንዲህ
  rationale: አመልካቹ ተውላጠ ስም ወደሚከተለው የደብዳቤ ጽሑፍ ያመለክታል፤ በአማርኛ ‘እንዲህ’ ይህን ተግባር በተፈጥሮ ያሳያል።
