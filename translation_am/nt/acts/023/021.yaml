    text: ወይም፣ “ራሳቸውን በመሐላ አስረዋል።” የግሪኩ አገላለጽ መሐላቸውን ባይፈጽሙ በራሳቸው ላይ እርግማን የመጥራትን ሐሳብ ያካትታል።
