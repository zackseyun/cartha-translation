  yaml_path: translation/nt/acts/023/021.yaml
  text: So do not be persuaded by them, for more than forty men from among them are lying in ambush for him, who have bound themselves under a curse neither to eat nor to drink until they have killed him. And now they are ready, waiting for the promise from you.
translation:
  language: am
  text: ስለዚህ አንተ ለእነርሱ አትስማማ፤ ከእነርሱ መካከል ከአርባ የሚበልጡ ሰዎች እርሱን ለመግደል አድፍጠው እየጠበቁት ነውና። እነዚህም እስኪገድሉት ድረስ እንዳይበሉም እንዳይጠጡም ራሳቸውን በእርግማን አስረዋል።[a] አሁንም ዝግጁ ሆነው ከአንተ የሚመጣውን የተስፋ ቃል እየጠበቁ ነው።[b]
  philosophy: optimal-equivalence
  footnotes:
