  text: Οἱ μὲν οὖν στρατιῶται κατὰ τὸ διατεταγμένον αὐτοῖς ἀναλαβόντες τὸν Παῦλον ἤγαγον ⸀διὰ νυκτὸς εἰς τὴν Ἀντιπατρίδα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/031.yaml
  text: So the soldiers[a], according to what had been ordered them[b], took Paul and brought him by night to Antipatris.
translation:
  language: am
  text: ስለዚህ ወታደሮቹ የተሰጣቸውን ትእዛዝ ተከትለው ጳውሎስን ይዘው በሌሊት ወደ አንቲጳጥሪስ ወሰዱት።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ μὲν οὖν στρατιῶται
  choice: ስለዚህ ወታደሮቹ
  rationale: οὖν የትረካውን ቀጣይነትና ከቀደመው ንግግር የሚከተለውን ድርጊት ያመለክታል፤ μέν እዚህ በአማርኛ ለብቻው ቃል ሳይሰጠው በንግግሩ አወቃቀር ተንጸባርቋል።
- source_word: κατὰ τὸ διατεταγμένον αὐτοῖς
  choice: የተሰጣቸውን ትእዛዝ ተከትለው
  rationale: ፍጹም ጊዜ ተደራጊ አንቀጽ ቀደም ሲል ለእነርሱ የታዘዘውን ነገር ያመለክታል፤ ይህ አተረጓጎም ተደራጊነቱንና የቀደመውን ትእዛዝ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἀναλαβόντες τὸν Παῦλον
  choice: ጳውሎስን ይዘው
  rationale: የቀደመ ድርጊትን የሚገልጸው የግስ አገባብ ከዋናው ግስ በፊት ጳውሎስን እንደተረከቡትና እንደያዙት ያሳያል፤ ‘ይዘው’ ይህን በአጭርና ተፈጥሯዊ መንገድ ያስተላልፋል።
- source_word: ἤγαγον
  choice: ወሰዱት
  rationale: ἄγω መምራት፣ ማምጣት ወይም መውሰድ ሊል ይችላል። መድረሻው ‘ወደ አንቲጳጥሪስ’ ተብሎ ስለተገለጸ፣ ‘ወሰዱት’ የጉዞውን አቅጣጫ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: διὰ νυκτός
  choice: በሌሊት
  rationale: διά ከዘር ቅጽ ካለው νυκτός ጋር ሲሆን ‘በሌሊት’ ወይም ‘በሌሊቱ ጊዜ’ ማለት ነው፤ ‘በሌሊት’ ጉዞው ሌሊቱን ሙሉ እንደፈጀ ሳያስገድድ ጊዜውን ይገልጻል።
- source_word: Ἀντιπατρίδα
  choice: አንቲጳጥሪስ
  rationale: የቦታው ስም በአማርኛ መጽሐፍ ቅዱሳዊ አጠራርና በግሪኩ ቅርጽ መሠረት በፊደል ተላልፏል።
