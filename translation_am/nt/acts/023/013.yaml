  text: ἦσαν δὲ πλείους τεσσεράκοντα οἱ ταύτην τὴν συνωμοσίαν ⸀ποιησάμενοι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/013.yaml
  text: There were more than forty who had formed this conspiracy[a].
translation:
  language: am
  text: ይህን ሴራ የጠነሰሱት ከአርባ በላይ ነበሩ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλείους τεσσεράκοντα
  choice: ከአርባ በላይ
  rationale: በዐውዱ ውስጥ የንጽጽር ቅርጹ ከቁጥሩ ጋር ‘ከአርባ በላይ’ የሚል ግልጽ የመጠን ትርጉም ይሰጣል፤ በግሪኩ የሌለውን ‘ሰዎች’ የሚል ስም መጨመርም አያስፈልግም።
- source_word: συνωμοσίαν
  choice: ሴራ
  rationale: ቃሉ በስውር የተደረገ የጋራ ክፉ ዕቅድን ያመለክታል፤ ‘ሴራ’ በዘመናዊ አማርኛ ተፈጥሯዊና ትክክለኛ ነው። በዚህ ቃል ብቻ ያልተገለጸውን ‘በመሐላ የታሰረ’ የሚል ዝርዝር አይጨምርም።
- source_word: ποιησάμενοι
  choice: የጠነሰሱት
  rationale: ከ‘ሴራ’ ጋር ‘ሴራ ጠነሰሰ’ የሚለው የአማርኛ አገላለጽ ተፈጥሯዊ ሲሆን፣ አድራጊዎቹ ሴራውን እንደፈጠሩ ያሳያል።
- source_word: ἦσαν δὲ
  choice: ነበሩ
  rationale: የቡድኑን መኖርና ቁጥር በተፈጥሯዊ የአማርኛ አረፍተ ነገር ያቀርባል። δέ እዚህ ቀላል አያያዥ በመሆኑ በተናጠል ቃል መተርጎም አያስፈልግም።
- source_word: οἱ ταύτην τὴν συνωμοσίαν ποιησάμενοι
  choice: ይህን ሴራ የጠነሰሱት
  rationale: ግሪኩ ከመስተዋድድ ጋር ያለውን ተሳቢ አገላለጽ እንደ ስም ይጠቀማል፤ በአማርኛ ‘የጠነሰሱት’ የሚለው ቅርጽ ይህንኑ ተግባር በተፈጥሯዊነት ይጠብቃል።
