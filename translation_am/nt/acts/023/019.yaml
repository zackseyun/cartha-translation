  - marker: b
    text: ወይም፣ “ለእኔ የምታሳውቀኝ ነገር ምንድን ነው?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιλαβόμενος ... τῆς χειρὸς αὐτοῦ
  choice: የእርሱን እጅ ይዞ
  rationale: የግሪኩን ተጨባጭ ድርጊት ይጠብቃል፤ ‘ይዞ’ ከመጠን ያለፈ ኃይልን ሳያመለክት በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: δὲ
  choice: ከዚያም
  rationale: በዚህ ቦታ δέ የትረካውን ቀጣይ እርምጃ ያመለክታል፤ ‘ከዚያም’ ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὁ χιλίαρχος
  choice: የጦር አዛዡ
  rationale: የሮማውያንን ወታደራዊ ሹም ለዘመናዊ አንባቢ ግልጽ በሆነ አጠራር ያቀርባል፤ ቃል በቃል ‘የሺህ አለቃ’ ማለት ቢሆንም እዚህ የማዕረግ ቴክኒካዊ ማብራሪያ አያስፈልግም።
- source_word: ἀναχωρήσας κατ’ ἰδίαν
  choice: ለብቻቸው ወደ ጎን ከወሰደው በኋላ
  rationale: ከሌሎች መለየትንና በግል መነጋገርን ይገልጻል። ግሪኩ ቀጥተኛ ተሳቢ ባይጠቅስም፣ በአማርኛ የእንቅስቃሴው ተሳቢ ከዐውዱ ግልጽ ስለሆነ በተፈጥሯዊ ሁኔታ ተገልጿል።
- source_word: ἐπυνθάνετο
  choice: መጠየቅ ጀመረ
  rationale: ያልተጠናቀቀው የግሪክ ግስ በትረካው ውስጥ የመጀመር ወይም የቀጣይነት ገጽታ ሊኖረው ይችላል፤ ‘መጠየቅ ጀመረ’ የመጀመርን ገጽታ ያንጸባርቃል።
- source_word: ὃ ἔχεις ἀπαγγεῖλαί μοι
  choice: ለእኔ የምታሳውቀኝ ነገር
  rationale: ἀπαγγέλλω መረጃን ማድረስን ወይም ማሳወቅን ያመለክታል። ‘የምታሳውቀኝ’ የሪፖርት ስሜቱን ይጠብቃል፤ የአማርኛውን ጥያቄም ተፈጥሯዊ ያደርገዋል።
