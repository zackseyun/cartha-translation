  text: ከዚያም ጳውሎስ፣ “በኖራ የተለሰነ ግድግዳ ሆይ፣ እግዚአብሔር ሊመታህ ነው![a] አንተስ እንደ ሕጉ ልትፈርድብኝ ተቀምጠህ፣ ሕጉን በመተላለፍ እንድመታ ታዛለህን?” አለው።
  philosophy: optimal-equivalence
