theological_decisions:
- issue: κύριος እንደ ክርስቶሳዊ ማዕረግ
  choice: ጌታ ኢየሱስ
  alternative: መምህር ኢየሱስ
  rationale: ‘ጌታ’ የምንጩን የክብርና የሥነ መለኮት ክብደት ይጠብቃል፤ ‘መምህር’ ግን κύριος የሚሸከመውን ሙሉ ኃይል አያስተላልፍም።
- issue: ἀνδρῶν የፆታ ማመልከቻ
  choice: ወንዶች
  alternative: ሰዎች
  rationale: ἀνήρ በዚህ አውድ ወንዶችን በተለይ ይጠቅሳል፤ ፆታ-ገለልተኛ ቃል መጠቀም የምንጩን ዝርዝር ያጠፋል።
- issue: በቁጥር 21 ያልተጠናቀቀው የδεῖ አገባብ
  choice: አንዱ መሆን ያስፈልጋል፣
  alternative: የሚያስፈልገው ... ከወንዶች መካከል—
  rationale: የግሪክ ዓረፍተ ነገር እስከ ቁጥር 22 ይቀጥላል። ትርጉሙ አስፈላጊነቱን በቁጥር 21 ግልጽ አድርጎ ያስቀምጣል፣ ነገር ግን በመጨረሻው ላይ በነጠላ ሰረዝ ቀጣዩ ቁጥር እንደሚያሟላው ያሳያል።
