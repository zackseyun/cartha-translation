  text: δεῖ οὖν τῶν συνελθόντων ἡμῖν ἀνδρῶν ἐν παντὶ χρόνῳ ⸀ᾧ εἰσῆλθεν καὶ ἐξῆλθεν ἐφ’ ἡμᾶς ὁ κύριος Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/021.yaml
  text: Therefore[a], it is necessary that one of the men who accompanied us during all the time in which the Lord Jesus went in and out among us[b],
translation:
  language: am
  text: ስለዚህ፣ ጌታ ኢየሱስ በመካከላችን ሲገባና ሲወጣ በነበረበት ጊዜ ሁሉ፣[a] ከእኛ ጋር አብረው ከነበሩት ወንዶች[b] መካከል አንዱ መሆን ያስፈልጋል፣
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ሲገባና ሲወጣ” የሚለው አገላለጽ ኢየሱስ ከደቀ መዛሙርቱ ጋር በነበረበት ዘመን ያደረገውን ቀጣይ ሕይወትና እንቅስቃሴ የሚያመለክት ፈሊጣዊ አነጋገር ነው።
    reason: cultural_note
  - marker: b
    text: ወይም፣ “ከእኛ ጋር የተሰበሰቡት ወንዶች”፤ በዚህ አውድ አገላለጹ ከሐዋርያት ጋር ለተወሰነ ጊዜ አብረው የነበሩትን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
