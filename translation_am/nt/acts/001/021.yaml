- source_word: οὖν
  choice: ስለዚህ
  rationale: ጴጥሮስ ከቀደመው ንግግር የሚያወጣውን ድምዳሜ በተፈጥሯዊ አማርኛ ያመለክታል።
- source_word: συνελθόντων ἡμῖν ἀνδρῶν
  choice: ከእኛ ጋር አብረው ከነበሩት ወንዶች
  rationale: συνέρχομαι በቃል ደረጃ ‘አብረው የተሰበሰቡ’ ማለት ቢችልም፣ እዚህ ረጅም ጊዜ ከሐዋርያት ጋር የነበረን አብሮነት ያመለክታል። ἀνδρῶν የወንድ ፆታን በግልጽ ስለሚጠቅስ ‘ወንዶች’ ተብሏል።
- source_word: ἐν παντὶ χρόνῳ
  choice: በነበረበት ጊዜ ሁሉ
  rationale: የኢየሱስን ከደቀ መዛሙርቱ ጋር የነበረበትን ጠቅላላ የጊዜ ክልል ያሳያል፤ እያንዳንዱን ጊዜ ለየብቻ አያመለክትም።
- source_word: εἰσῆλθεν καὶ ἐξῆλθεν ἐφ’ ἡμᾶς
  choice: በመካከላችን ሲገባና ሲወጣ
  rationale: የምንጩን ምስላዊ አነጋገር በመጠበቅ፣ ኢየሱስ ከደቀ መዛሙርቱ ጋር በየጊዜው መኖሩንና መንቀሳቀሱን ያመለክታል።
- source_word: ὁ κύριος Ἰησοῦς
  choice: ጌታ ኢየሱስ
