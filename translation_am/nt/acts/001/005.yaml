  rationale: ἐν ዓውድን ወይም መንገድና መሣሪያን ሊያመለክት ይችላል። “በመንፈስ ቅዱስ” በአማርኛ ሁለቱንም ዕድሎች ክፍት ያደርጋል፤ ስለ መንፈስ ቅዱስ ጥምቀት አንድ የትርጓሜ ወገን ብቻ አይወስንም።
