base_translation:
  language: en
  yaml_path: translation/nt/acts/001/005.yaml
  text: For John baptized with water[a], but you will be baptized in the Holy Spirit not many days from now.
translation:
  language: am
  text: ምክንያቱም ዮሐንስ በውኃ አጠመቀ፤ እናንተ ግን ከአሁን ብዙ ቀናት ሳያልፉ በመንፈስ ቅዱስ[a] ትጠመቃላችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ ቅድመ አንቀጽ እዚህ «በመንፈስ ቅዱስ ውስጥ» ወይም «በመንፈስ ቅዱስ አማካይነት» የሚል ፍቺ ሊኖረው ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: ምክንያቱም
  rationale: ቃሉ ከቀደመው ንግግር ጋር ሲነበብ ማብራሪያዊ ምክንያትን ያስገባል፤ “ምክንያቱም” ይህን ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐβάπτισεν
  choice: አጠመቀ
  rationale: የግሪኩን ያለፈ ጊዜ አድራጊ ግስ በቀጥታ ያቀርባል፤ የጥምቀቱን አፈጻጸም ዘዴ ከጽሑፉ በላይ አይወስንም።
- source_word: ὕδατι
  choice: በውኃ
  rationale: የረቢው ቅጽ መሣሪያን ወይም የድርጊቱን ዓውድ ሊያመለክት ይችላል፤ “በውኃ” ተፈጥሯዊና በቂ ነው።
- source_word: ἐν πνεύματι ἁγίῳ
  choice: በመንፈስ ቅዱስ
  rationale: የአማርኛው “በ” መካከለኛነትንም ሆነ ዓውድን ሊገልጽ ስለሚችል የግሪኩን ἐν እውነተኛ አሻሚነት ይጠብቃል። “መንፈስ ቅዱስ” በዚህ አውድ የተወሰነውን ቅዱስ መንፈስ ያመለክታል።
- source_word: βαπτισθήσεσθε
  choice: ትጠመቃላችሁ
  rationale: የወደፊት ጊዜ ተደራጊ ቅጹን ይጠብቃል፤ አጥማቂውንም እንደ ግሪኩ ሳይጠቅስ ይተዋል።
- source_word: οὐ μετὰ πολλὰς ταύτας ἡμέρας
  choice: ከአሁን ብዙ ቀናት ሳያልፉ
  rationale: የጊዜውን ቅርበትና የταύταςን ወደ ተናጋሪው ጊዜ የሚያመለክት ኃይል በግልጽ፣ ዘመናዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: ἐν πνεύματι ἁγίῳ በሚለው የጥምቀት አገላለጽ ውስጥ የἐν ፍቺ
  choice: በመንፈስ ቅዱስ
