  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ὅτε εἰσῆλθον, ⸂εἰς τὸ ὑπερῷον ἀνέβησαν⸃ οὗ ἦσαν καταμένοντες, ὅ τε Πέτρος καὶ ⸂Ἰωάννης καὶ Ἰάκωβος⸃ καὶ Ἀνδρέας, Φίλιππος καὶ Θωμᾶς, Βαρθολομαῖος καὶ Μαθθαῖος, Ἰάκωβος Ἁλφαίου καὶ Σίμων ὁ ζηλωτὴς καὶ Ἰούδας Ἰακώβου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/013.yaml
  text: 'And when they had entered[a], they went up to the upstairs room where they were staying: Peter, John, James, and Andrew; Philip and Thomas; Bartholomew and Matthew; James the son of Alphaeus, and Simon the Zealot, and Judas the son of James.'
translation:
  language: am
  text: እነርሱም ከገቡ በኋላ፣ ወደሚቆዩበት የላይኛው ፎቅ ክፍል ወጡ። እነርሱም ጴጥሮስ፣ ዮሐንስ፣ ያዕቆብና እንድርያስ፤ ፊልጶስና ቶማስ፤ በርተሎሜዎስና ማቴዎስ፤ የእልፍዮስ ልጅ ያዕቆብ፣ ቀናተኛው ስምዖንና የያዕቆብ ልጅ ይሁዳ[a] ነበሩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የያዕቆብ ወንድም ይሁዳ።” የግሪክ ጽሑፉ “የያዕቆብ ይሁዳ” ብቻ ስለሚል፣ ትክክለኛውን የዝምድና ዓይነት በግልጽ አይጠቅስም።
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσῆλθον
  choice: ከገቡ በኋላ
  rationale: የጊዜ ንዑስ ሐረጉ ዋናው ድርጊት ከመፈጸሙ በፊት መግባታቸውን ያሳያል፤ በአማርኛም «ከገቡ በኋላ» ተፈጥሯዊና ግልጽ ነው።
- source_word: εἰς τὸ ὑπερῷον ἀνέβησαν
  choice: በላይኛው ፎቅ ወዳለው ክፍል ወጡ
  rationale: «ወጡ» ወደ ላይ የሚደረገውን እንቅስቃሴ፣ «በላይኛው ፎቅ ያለው ክፍል» ደግሞ መድረሻውንና የሕንፃውን አቀማመጥ ይገልጻል።
- source_word: ὑπερῷον
  choice: በላይኛው ፎቅ ያለው ክፍል
  rationale: ቃሉን ከባሕላዊ ወይም ከቤተ ክርስቲያናዊ ልዩ ትርጉም ጋር ሳያያይዝ፣ ተራውን የቦታ ትርጉም በዘመናዊ አማርኛ ያስተላልፋል።
- source_word: οὗ ἦσαν καταμένοντες
  choice: ወደሚቆዩበት
  rationale: καταμένω በአንድ ቦታ መቆየትን ያመለክታል፤ ይህ አገላለጽ የቀጣይነቱን ስሜት በአጭሩ ይይዛል።
- source_word: Ἰάκωβος Ἁλφαίου
  choice: የእልፍዮስ ልጅ ያዕቆብ
  rationale: በዚህ የስም ዝርዝር ውስጥ የባለቤትነት አገባቡ የአባትነት ዝምድናን ለመግለጽ በተፈጥሮ ይነበባል።
- source_word: Σίμων ὁ ζηλωτὴς
  choice: ቀናተኛው ስምዖን
  rationale: ζηλωτής ስምዖንን የሚለይ መጠሪያ ስለሆነ፣ «ቀናተኛው» ቀጥተኛና ለአማርኛ አንባቢ የሚገባ ነው።
- source_word: Ἰούδας Ἰακώβου
  choice: የያዕቆብ ልጅ ይሁዳ
  rationale: ግሪኩ የዝምድናውን ዓይነት በግልጽ ባይናገርም፣ በሐዋርያት የስም ዝርዝር አውድ የአባትነት መለያው ይበልጥ የሚመስል ነው፤ ሌላው አማራጭ በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: በἸούδας Ἰακώβου የተመለከተው የዝምድና ዓይነት
  choice: የያዕቆብ ልጅ ይሁዳ
  alternative: የያዕቆብ ወንድም ይሁዳ
  rationale: የግሪኩ የባለቤትነት አገባብ «ልጅ» ወይም «ወንድም» ብሎ አይገልጽም። በዚህ የስም ዝርዝር አውድ «ልጅ» የሚለው ይበልጥ የሚሆን ቢሆንም፣ የምንጩ አሻሚነት በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የስሞቹ አጻጻፍ በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የታወቀውን ቅርጽ ይከተላል፤ የግሪኩ የስም ቡድኖችም በሰረዝ ነጥብ ተለይተዋል።
