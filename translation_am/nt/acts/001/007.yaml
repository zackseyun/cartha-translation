  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የአረፍተ ነገሩ ቅደም ተከተል ለአማርኛ ተፈጥሯዊ እንዲሆን ተስተካክሏል፤ የግሪክኛው ትርጉማዊ ውጥረትና የጊዜ ቃላቱ ልዩነት ግን ተጠብቋል።
