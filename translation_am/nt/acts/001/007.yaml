base_translation:
  language: en
  yaml_path: translation/nt/acts/001/007.yaml
  text: But he said to them[b][a], “It is not for you to know times or seasons that the Father has set by his own authority.”
translation:
  language: am
  text: 'እርሱ ግን፣ “አብ በራሱ ሥልጣን የወሰናቸውን ዘመናት ወይም የተወሰኑ ጊዜያት ማወቅ ለእናንተ አይደለም[a]” አላቸው።


    [a] “ዘመናት ወይም ወቅቶች” ተብሎም ሊተረጎም ይችላል። ግሪክኛው ረዘም ያሉ የጊዜ ክፍሎችንና የተወሰኑ ወይም ወሳኝ ጊዜያትን ሊያመለክቱ የሚችሉ ሁለት ተዛማጅ ቃላትን ይጠቀማል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ዘመናት ወይም ወቅቶች” ተብሎም ሊተረጎም ይችላል። ግሪክኛው ረዘም ያሉ የጊዜ ክፍሎችንና የተወሰኑ ወይም ወሳኝ ጊዜያትን ሊያመለክቱ የሚችሉ ሁለት ተዛማጅ ቃላትን ይጠቀማል።
