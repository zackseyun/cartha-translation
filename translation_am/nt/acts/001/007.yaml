lexical_decisions:
- source_word: δὲ
  choice: ግን
  rationale: ከደቀ መዛሙርቱ ጥያቄ ወደ ኢየሱስ ማስተካከያ የሚደረገውን ለስላሳ ንጽጽርና የንግግር ሽግግር ያሳያል።
- source_word: Οὐχ ὑμῶν ἐστιν γνῶναι
  choice: ማወቅ ለእናንተ አይደለም
  rationale: ይህ ዕውቀት በደቀ መዛሙርቱ ድርሻ ወይም ሥልጣን ውስጥ እንዳልሆነ የሚገልጸውን የግሪክኛ ፈሊጥ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: χρόνους
  choice: ዘመናት
  rationale: ርዝመት ያላቸውን የጊዜ ክፍሎች በአጭርና በተፈጥሯዊ ቃል ይገልጻል።
- source_word: καιροὺς
  choice: የተወሰኑ ጊዜያት
  rationale: ቃሉ ተስማሚ፣ የተመደበ ወይም ወሳኝ ጊዜን ሊያመለክት ስለሚችል ከχρόνους ያለውን ተዛማጅ ልዩነት በግልጽ አማርኛ ያቆያል።
- source_word: ὁ πατὴρ
  choice: አብ
  rationale: የግሪክኛውን መለኮታዊ ማዕረግ ያለተጨማሪ ባለቤትነት ቃል ይጠብቃል።
- source_word: ἔθετο
  choice: የወሰናቸውን
  rationale: በዚህ አውድ τίθημι ማቋቋምን፣ መወሰንን ወይም መመደብን ያመለክታል፤ “የወሰናቸውን” በዐማርኛ የድርጊቱን ቀጣይ አግባብ በተፈጥሮ ያሳያል።
- source_word: ἐν τῇ ἰδίᾳ ἐξουσίᾳ
  choice: በራሱ ሥልጣን
  rationale: ቃል በቃል “በራሱ ሥልጣን ውስጥ” የሚለውን አገላለጽ በተፈጥሯዊ አማርኛ ያቀርባል፤ ነገሮቹ በአብ የራሱ ሥልጣንና መብት እንደተወሰኑ ያመለክታል።
theological_decisions:
- issue: χρόνους እና καιρούς የተባሉትን ሁለት የጊዜ ቃላት መተርጎም
  choice: ዘመናት ወይም የተወሰኑ ጊዜያት
  alternative: ዘመናት ወይም ወቅቶች
  rationale: ሁለቱን ተዛማጅ ቃላት ሳያዋህድ ልዩነታቸውን ይጠብቃል፤ ነገር ግን ጥብቅ ቴክኒካዊ ወይም ግምታዊ የዘመን ሥርዓት አያስገባም።
- issue: ከአብ ጋር በተያያዘ ἐξουσίαን መተርጎም
  choice: በራሱ ሥልጣን
  alternative: በራሱ ሥልጣን ውስጥ
  rationale: የግሪክኛውን ቅርጽ በቅርብ እየተከተለ የአብን የራሱ ሥልጣንና የመወሰን መብት ያሳያል፤ በጥቅሱ ያልተገለጸ የኋላ ዘመን ዶክትሪናዊ ቀመር አይጨምርም።
