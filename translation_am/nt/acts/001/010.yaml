  terminology: Use ወንዶች for ἄνδρες, without identifying them as angels. Use ሰማይ, which retains the source term's contextual range. Use አልባሳት/ልብሶች broadly for ἐσθής and avoid the unsuitable expression ልብሰ ሰብ.
