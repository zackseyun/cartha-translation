  yaml_path: translation/nt/acts/001/002.yaml
  text: until the day when[a], after giving commands through the Holy Spirit to the apostles whom he had chosen, he was taken up.
translation:
  language: am
  text: እርሱ ለመረጣቸው ሐዋርያት በመንፈስ ቅዱስ ትእዛዞችን ከሰጠ በኋላ፣ ወደ ላይ እስከ ተወሰደበት ቀን ድረስ ጻፍሁ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄχρι ἧς ἡμέρας
  choice: እስከ ... ቀን ድረስ
  rationale: የቀደመው ቁጥር ዓረፍተ ነገር መጨረሻ የሆነውን ጊዜ በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: ἐντειλάμενος
  choice: ትእዛዝ ከሰጠ በኋላ
  rationale: የግሪኩን የቀደመ ድርጊት ያሳያል፤ ‘ትእዛዝ’ የἐντέλλομαιን ጠንካራ ትርጉም ይጠብቃል።
- source_word: τοῖς ἀποστόλοις
  choice: ለ... ሐዋርያት
  rationale: ‘ሐዋርያት’ በአማርኛ የተለመደና በሉቃስ–ሐዋርያት የታወቀውን ቡድን በትክክል የሚጠቅስ ቃል ነው።
- source_word: διὰ πνεύματος ἁγίου
  choice: ለመንፈስ ቅዱስ አማካይነት
  rationale: διά ከዘር ቅጽ ጋር የሚያመለክተውን መንገድ ወይም አድራጊነት ሳያጠብብ ያስተላልፋል።
- source_word: οὓς ἐξελέξατο
  choice: እርሱ በመረጣቸው
  rationale: ሐዋርያቱ ከዚህ በፊት በኢየሱስ የተመረጡ መሆናቸውን የዝምድናው ሐረግ ያሳያል።
- source_word: ἀνελήμφθη
  choice: ወደ ላይ ... ተወሰደ
  rationale: የግሪኩን ተደራጊ ግስ በቀጥታ ይመልሳል፤ ‘ወደ ሰማይ’ የሚለውን በዚህ ቁጥር ያልተገለጸ ዝርዝር አይጨምርም።
theological_decisions:
- issue: የኢየሱስ ትእዛዝ ከመንፈስ ቅዱስ ጋር ያለው ዝምድና
  choice: ኢየሱስ ትእዛዙን ለመንፈስ ቅዱስ አማካይነት ሰጠ።
  alternative: ኢየሱስ ትእዛዙን በመንፈስ ቅዱስ ሰጠ።
  rationale: የግሪኩ አገባብ διὰ πνεύματος ἁγίουን ከἐντειλάμενος ጋር በተፈጥሮ ያያይዛል፤ የመንገድና የአድራጊነት ልዩነት ግን በአማርኛ ሙሉ በሙሉ ስለማይወሰን በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ቁጥር 2 በግሪክ ከቁጥር 1 የጀመረውን ዓረፍተ ነገር ስለሚቀጥል፣ ‘ጻፍሁ’ የሚለው ከቁጥር 1 በትርጉም ተደግሟል፤ ይህም ቁጥሩን ለብቻው ሲነበብ ግልጽ ያደርገዋል።
