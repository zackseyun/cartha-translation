base_translation:
  language: en
  yaml_path: translation/nt/acts/001/012.yaml
  text: Then they returned to Jerusalem from the mount called Olivet[a], which is near Jerusalem[b], a Sabbath day’s journey away.
translation:
  language: am
  text: ከዚያም ደብረ ዘይት ከሚባለው ተራራ ወደ ኢየሩሳሌም ተመለሱ፤ ተራራውም ከኢየሩሳሌም አቅራቢያ የሚገኝ፣ የሰንበት ቀን መንገድ ያህል ርቀት ላይ ነው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የሰንበት ቀን መንገድ” ማለት አንድ አይሁዳዊ በሰንበት ቀን እንዲጓዝ በልማድ የተፈቀደለት ርቀት ነው።
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: ከዚያም
  rationale: ቀጣዩን የትረካ ክስተት በተፈጥሯዊ ዘመናዊ አማርኛ የሚያስተሳስር የጊዜ አገናኝ ነው።
- source_word: ὑπέστρεψαν εἰς Ἰερουσαλὴμ
  choice: ወደ ኢየሩሳሌም ተመለሱ
  rationale: የመመለስን እንቅስቃሴና መድረሻውን ግልጽና ተፈጥሯዊ በሆነ አማርኛ ያስተላልፋል።
- source_word: ἀπὸ ὄρους τοῦ καλουμένου Ἐλαιῶνος
  choice: ደብረ ዘይት ከሚባለው ተራራ
  rationale: Ἐλαιῶνος የቦታ ስም ሆኖ ‘የወይራ ተራራ’ን ያመለክታል፤ ‘ደብረ ዘይት’ በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የታወቀ ስም ሲሆን ‘ተራራ’ መጨመሩ የὄρουςን ትርጉም ግልጽ ያደርጋል።
- source_word: ὅ ἐστιν ἐγγὺς Ἰερουσαλὴμ
  choice: ተራራውም ከኢየሩሳሌም … ርቀት ላይ ነው
  rationale: የግሪኩን አንጻራዊ ሐረግ በአማርኛ ግልጽ ዓረፍተ ነገር አድርጎ ያቀርባል፤ ቅርበቱም በቀጣዩ የርቀት ፈሊጥ ይገለጻል።
- source_word: σαββάτου ἔχον ὁδόν
  choice: የሰንበት ቀን መንገድ ያህል ርቀት
  rationale: የአይሁድን ባህላዊ የርቀት አገላለጽ ሳያጠፋ በተፈጥሯዊ አማርኛ ያቀርባል፤ ትርጉሙ በማስታወሻ ተብራርቷል።
theological_decisions:
- issue: σαββάτου ἔχον ὁδόν የሚለው የአይሁድ የርቀት ፈሊጥ
  choice: የሰንበት ቀን መንገድ ያህል ርቀት
  alternative: በሰንበት ቀን መጓዝ የተፈቀደውን ያህል ርቀት
  rationale: ዋናው ጽሑፍ የምንጩን የአይሁድ ባህላዊ አገላለጽ ይጠብቃል፤ ትርጉሙን በዋናው ጽሑፍ በመተካት ከሚከሰት ከመጠን ያለፈ ማብራሪያ ይቆጠባል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ደብረ ዘይት’ የታወቀውን ባህላዊ የቦታ ስም ይጠብቃል፤ ‘ተራራ’ የሚለው ቃል ደግሞ የግሪኩን ὄρος በግልጽ ያሳያል።
