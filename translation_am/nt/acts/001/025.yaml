  rationale: የግሪኩ ሐረግ መድረሻውን በግልጽ አይገልጽም፤ ስለዚህ ትርጉሙ ጽሑፉ ከሚለው በላይ ሥነ መለኮታዊ ውሳኔ አይጨምርም።
