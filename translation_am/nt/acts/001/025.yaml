- source_word: πορευθῆναι
  choice: ለመሄድ
  rationale: የπορεύομαιን ቀላልና ቀጥተኛ የመሄድ ትርጉም ይጠብቃል።
- source_word: εἰς τὸν τόπον τὸν ἴδιον
  choice: ወደ ራሱ ስፍራ
  rationale: አጭሩንና ትርጉሙ ሙሉ በሙሉ ያልተወሰነውን የግሪክ አገላለጽ ይጠብቃል፤ መድረሻውን በዋናው ጽሑፍ ሞት፣ መቃብር ወይም ፍርድ ብሎ አይወስንም።
