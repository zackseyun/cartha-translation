  rationale: ቃሉ በቀጥታ ‘ስፍራ’ ማለት ሲሆን እዚህ የአገልግሎት ድርሻን በምሳሌያዊ ሁኔታ ያመለክታል፤ በቁጥሩ መጨረሻ ካለው ‘የራሱ ስፍራ’ ጋር ያለውን የቃል ድግግሞሽም ይጠብቃል።
- source_word: διακονίας
  choice: አገልግሎት
  rationale: በዚህ የሐዋርያት ዐውድ የተሰጠ አገልግሎታዊ ተግባርን በግልጽና በተለመደ ቃል ያስተላልፋል።
- source_word: ἀποστολῆς
  choice: ሐዋርያነት
  rationale: አጠቃላይ ተልእኮን ብቻ ሳይሆን የሐዋርያነትን ኃላፊነትና ድርሻ በትክክል ያመለክታል።
- source_word: ἀφ’ ἧς
  choice: ካለበት
