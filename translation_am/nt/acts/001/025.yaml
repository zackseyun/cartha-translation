  language: am
  text: የዚህን አገልግሎትና ሐዋርያነት ስፍራ እንዲወስድ፣ ይሁዳ ወደ ራሱ ስፍራ[b] ለመሄድ ፈቀቅ ካለበት[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከራቀበት” ወይም “ከተለየበት።” የግሪኩ ግስ ከዚህ አገልግሎትና ሐዋርያነት ዘወር ማለትን ወይም መለየትን ሊያመለክት ይችላል።
