  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἀλλὰ λήμψεσθε δύναμιν ἐπελθόντος τοῦ ἁγίου πνεύματος ἐφ’ ὑμᾶς, καὶ ἔσεσθέ ⸀μου μάρτυρες ἔν τε Ἰερουσαλὴμ καὶ ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Σαμαρείᾳ καὶ ἕως ἐσχάτου τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/008.yaml
  text: But you will receive power when the Holy Spirit has come upon you[a], and you will be my witnesses in Jerusalem, and in all Judea and Samaria, and to the end of the earth.
translation:
  language: am
  text: ነገር ግን፣ መንፈስ ቅዱስ በእናንተ ላይ ሲመጣ ኃይልን ትቀበላላችሁ፤ በኢየሩሳሌም፣ በይሁዳ ሁሉና በሰማርያ፣ እስከ ምድር ዳርቻ[a] ድረስ ምስክሮቼ ትሆናላችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እስከ ምድር ዳርቻዎች»። የግሪኩ ሐረግ በነጠላ ቁጥር («እስከ ምድር ዳርቻ») ቢሆንም፣ የምድርን እጅግ ሩቅ ስፍራ ለማመልከት በፈሊጣዊ አገባብ ያገለግላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ነገር ግን
  rationale: ከቁጥር 7 ጋር ያለውን ተቃርኖ በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: λήμψεσθε
  choice: ትቀበላላችሁ
  rationale: ከሚሰጥ አካል አንድን ነገር መቀበልን ያመለክታል፤ ለራስ መውሰድን አያስገባም።
- source_word: δύναμιν
  choice: ኃይልን
  rationale: በዐውዱ መንፈስ ቅዱስ የሚሰጠውን አስችሎትና ኃይል በሰፊው ይገልጣል።
- source_word: ἐπελθόντος ... ἐφ’ ὑμᾶς
  choice: በእናንተ ላይ ሲመጣ
  rationale: የግሪኩን ጊዜያዊ ግንኙነትና ወደ ሰዎቹ ላይ የመምጣት አቅጣጫ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τοῦ ἁγίου πνεύματος
  choice: መንፈስ ቅዱስ
  rationale: በዘመናዊ አማርኛ ለግለሰባዊው መለኮታዊ አመልካች የተለመደውን ስያሜ ይጠቀማል።
- source_word: ἔσεσθέ
  choice: ትሆናላችሁ
  rationale: የወደፊት ጊዜውን ቀጥተኛ የመሆን ትርጉም ይጠብቃል።
- source_word: μου μάρτυρες
  choice: ምስክሮቼ
  rationale: ለኢየሱስ ስለ እርሱ የሚመሰክሩ ሰዎች መሆናቸውንና የግሪኩን የባለቤትነት/ግንኙነት አገባብ በአጭሩ ያሳያል።
- source_word: ἔν τε Ἰερουσαλὴμ καὶ ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Σαμαρείᾳ
  choice: በኢየሩሳሌም፣ በመላው ይሁዳና በሰማርያ
  rationale: ተጨባጭ ስፍራዎቹንና ከኢየሩሳሌም ወደ ሰፊ ክልሎች የሚዘረጋውን ቅደም ተከተል ይጠብቃል።
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: እስከ ምድር ዳርቻ ድረስ
  rationale: የግሪኩን ነጠላ ቅርጽ በቅርብ ሲከተል፣ የዓለምን እጅግ ሩቅ ስፍራ የሚያመለክተውን ፈሊጣዊ ትርጉም ይይዛል።
theological_decisions:
- issue: πνεῦμα የግለሰባዊ መለኮታዊ አመልካች ሆኖ መተርጎሙ
  choice: መንፈስ ቅዱስ
  alternative: ቅዱሱ መንፈስ
  rationale: የግሪኩን መለኮታዊ አመልካች በአማርኛ የተለመደውና ክብር ያለው ስያሜ ይገልጣል፤ በጽሑፉ ላይ ያልተጨመረ የቤተ እምነት ልዩ ትምህርት አያስገባም።
- issue: የምስክርነቱ ተልእኮ ስፋት
  choice: ከኢየሩሳሌም እስከ ምድር ዳርቻ የሚዘረጋ ተጨባጭ መልክዓ ምድራዊ ስፋት
  alternative: ፍጹም ምሳሌያዊ መንፈሳዊ መልክዓ ምድር
  rationale: ጥቅሱ የታወቁ ስፍራዎችን በስም ጠቅሶ ወደ ዓለም ሩቅ ስፍራ መስፋፋትን ያቀርባል፤ ትርጉሙም ከዚህ በላይ የሆነ የቤተ ክርስቲያን መርሐ ግብር አይጭንበትም።
