- from: ከዮሐንስ ጥምቀት ጀምሮ ከእኛ እስከተወሰደበት ቀን ድረስ ከእነዚህ አንዱ ከእኛ ጋር የትንሣኤው ምስክር መሆን አለበት።
  to: ከዮሐንስ ጥምቀት ጀምሮ ከእኛ የተወሰደበት ቀን ድረስ፣ ከእነዚህ አንዱ ከእኛ ጋር የእርሱ ትንሣኤ ምስክር መሆን አለበት።
  rationale: The revision removes the awkward duplicated temporal-limit marking and makes the Greek possessive αὐτοῦ explicit. It preserves the passive ‘was taken up/from us’ without adding ‘to heaven,’ retains the necessity supplied by the preceding verse, and leaves ‘one of these’ unspecified as in the Greek.
