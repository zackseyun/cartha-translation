id: ACT.1.22
reference: Acts 1:22
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἀρξάμενος ἀπὸ τοῦ βαπτίσματος Ἰωάννου ἕως τῆς ἡμέρας ἧς ἀνελήμφθη ἀφ’ ἡμῶν, μάρτυρα τῆς ἀναστάσεως αὐτοῦ ⸂σὺν ἡμῖν γενέσθαι⸃ ἕνα τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/022.yaml
  text: beginning from the baptism of John until the day when he was taken up from us[b][a], one of these must become a witness with us of his resurrection.
translation:
  language: am
  text: ከዮሐንስ ጥምቀት ጀምሮ ከእኛ የተወሰደበት ቀን ድረስ፣ ከእነዚህ አንዱ ከእኛ ጋር የእርሱ ትንሣኤ ምስክር መሆን አለበት።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀρξάμενος ἀπὸ τοῦ βαπτίσματος Ἰωάννου
  choice: ከዮሐንስ ጥምቀት ጀምሮ
  rationale: የጊዜውን መነሻ በተፈጥሯዊ አማርኛ ያሳያል፤ የግሪኩ የባለቤትነት ግንኙነት ‘የዮሐንስ ጥምቀት’ የሚለውን ሆን ብሎ አይወስንም።
- source_word: ἕως τῆς ἡμέρας ἧς
  choice: እስከ...በት ቀን ድረስ
  rationale: የጊዜውን መጨረሻና አንጻራዊውን ሐረግ በዘመናዊ አማርኛ በግልጽ ያቀርባል።
- source_word: ἀνελήμφθη ἀφ’ ἡμῶν
  choice: ከእኛ እስከተወሰደበት
  rationale: ተገብሮአዊውን ቅርጽና ‘ከእኛ’ የሚለውን የመለየት ሐረግ ይጠብቃል፤ ‘ወደ ሰማይ ዐረገ’ የሚል በጥቅሱ ያልተገለጸ ማብራሪያ አይጨምርም።
- source_word: μάρτυρα τῆς ἀναστάσεως αὐτοῦ
  choice: የትንሣኤው ምስክር
  rationale: የግሪኩን የባለቤትነት ግንኙነት በተፈጥሯዊና በተለመደ አማርኛ ያስተላልፋል፤ ‘ትንሣኤው’ በዐውዱ የኢየሱስ መሆኑ ግልጽ ነው።
- source_word: σὺν ἡμῖν γενέσθαι
  choice: ከእኛ ጋር ... መሆን
  rationale: የተመረጠው ሰው ከነባሮቹ ሐዋርያት ጋር በምስክርነት እንደሚተባበር ያሳያል።
- source_word: ἕνα τούτων
  choice: ከእነዚህ አንዱ
  rationale: ‘ወንዶች’ የሚል በዚህ ጥቅስ ያልተጻፈ ቃል ሳይጨምር የግሪኩን አገላለጽ በግልጽ ያቀርባል።
- source_word: γενέσθαι (governed by δεῖ in v. 21)
  choice: መሆን አለበት
  rationale: ይህ ጥቅስ በቀደመው ቁጥር ባለው δεῖ ስለሚገዛ፣ የግዴታውን ኃይል በተሟላ የአማርኛ ዓረፍተ ነገር ያሳያል።
theological_decisions:
- issue: ከቁጥር 21 የሚቀጥለውን የግዴታ ትርጉም ማሳየት
  choice: ‘መሆን አለበት’ ተብሎ ተተርጉሟል
  alternative: ‘መሆን’ ብቻ ብሎ መተርጎም
  rationale: γενέσθαι በቀደመው ቁጥር δεῖ ይገዛል፤ ግዴታውን ማሳየት ትርጉም መጨመር ሳይሆን የተቀጣጠለውን ሰዋስው ማሟላት ነው።
- issue: የዕርገቱን ማጣቀሻ መተርጎም
  choice: ‘ከእኛ እስከተወሰደበት’
  alternative: ‘ወደ ሰማይ እስካረገበት’
  rationale: ቃሉ ዕርገቱን ቢያመለክትም፣ በዚህ ጥቅስ ‘ወደ ሰማይ’ አልተባለም፤ ስለዚህ የምንጩ ተገብሮአዊ አገላለጽ ተጠብቋል።
- issue: ‘የትንሣኤው ምስክር’ የሚለው ግንኙነት
  choice: የግሪኩ የባለቤትነት አወቃቀር በአማርኛ ተጠብቋል
  alternative: ‘ስለ ትንሣኤው የሚመሰክር’
  rationale: አማራጩ ትርጉሙን በግልጽ ቢያስረዳም፣ ዋናው ጽሑፍ ያለውን አጭርና ትንሽ ክፍት የሆነ ግንኙነት ለመጠበቅ ‘የትንሣኤው ምስክር’ ተመርጧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ትንሣኤ’ የተለመደውን ቤተ መጻሕፍታዊ አጻጻፍ ይከተላል። ከምንጩ የሚነሳ አስፈላጊ የግርጌ ማስታወሻ ስላልነበረ ምልክት አልተጨመረም።
