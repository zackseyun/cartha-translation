review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly carries forward the necessity governed by δεῖ in the preceding verse, retains the passive sense of ἀνελήμφθη, and represents both ‘one of these’ and the shared witness role. However, the temporal phrase is grammatically awkward in Amharic: placing እስከ before the passive clause while also using ድረስ produces an unnatural construction. The explicit possessive in ‘his resurrection’ should also be retained rather than only inferred from context.'
  naturalness: Most of the wording is clear modern standard Amharic. Recasting the temporal limit as ‘ከእኛ የተወሰደበት ቀን ድረስ’ is idiomatic and unambiguous. ‘የእርሱ ትንሣኤ ምስክር’ is natural while clearly preserving the referent of αὐτοῦ.
  terminology: ዮሐንስ, ጥምቀት, ትንሣኤ, and ምስክር are appropriate established terms in a dignified modern Amharic biblical register. No doctrinal expansion of the ascension is introduced.
  issues:
  - severity: medium
    issue: Awkward temporal-limit construction
    rationale: ‘ከእኛ እስከተወሰደበት ቀን ድረስ’ redundantly and awkwardly combines እስከ with ድረስ. ‘ከእኛ የተወሰደበት ቀን ድረስ’ naturally renders ‘until the day when he was taken up from us.’
  - severity: low
    issue: Possessive referent in ‘his resurrection’ is only implicit
    rationale: Although ‘ትንሣኤው’ can be understood contextually, ‘የእርሱ ትንሣኤ’ directly represents αὐτοῦ and avoids unnecessary loss of explicit reference.
  revised_text: ከዮሐንስ ጥምቀት ጀምሮ ከእኛ የተወሰደበት ቀን ድረስ፣ ከእነዚህ አንዱ ከእኛ ጋር የእርሱ ትንሣኤ ምስክር መሆን አለበት።
  revised_footnotes: []
  revision_rationale: The revision removes the awkward duplicated temporal-limit marking and makes the Greek possessive αὐτοῦ explicit. It preserves the passive ‘was taken up/from us’ without adding ‘to heaven,’ retains the necessity supplied by the preceding verse, and leaves ‘one of these’ unspecified as in the Greek.
