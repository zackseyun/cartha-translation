    text: ወይም በባህላዊ አገላለጽ፣ “ይህ ያው ኢየሱስ።” የግሪኩ ጽሑፍ በቀጥታ “ይህ ኢየሱስ” ይላል፤ “ያው” የሚለው ማንነቱን ለማጉላት የሚጨመር ትርጓሜያዊ ቃል ነው።
