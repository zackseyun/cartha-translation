  text: እነርሱም እንዲህ አሉ፦ “የገሊላ ወንዶች ሆይ፣ ወደ ሰማይ እያያችሁ ለምን ቆማችኋል? ይህ ኢየሱስ[a]፣ ከእናንተ ዘንድ ወደ ሰማይ የተወሰደው፣ ወደ ሰማይ ሲሄድ ባያችሁት አኳኋን እንዲሁ ይመጣል።”
  philosophy: optimal-equivalence
  footnotes:
