  choice: ደመና
  alternative: የእግዚአብሔር ክብር ደመና
  rationale: በመጽሐፍ ቅዱስ ሌሎች ስፍራዎች ደመና መለኮታዊ መገኘትን ሊያስታውስ ቢችልም፣ ይህ ቁጥር ያንን በግልጽ አይናገርም፤ ስለዚህ ግንኙነቱ በማስታወሻ ብቻ ተጠቁሟል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ዕርገት” የሚለው በኋላ የተለመደ ሥነ መለኮታዊ ስያሜ በዋናው ጽሑፍ አልገባም፤ የትዕይንቱ ተገብሮአዊነትና ወደ ላይ መንቀሳቀስ በግልጽ ተጠብቀዋል።
