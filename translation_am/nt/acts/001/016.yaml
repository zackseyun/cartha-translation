  rationale: ግሪኩ መንፈስ ቅዱስን ተናጋሪ፣ ዳዊትን ደግሞ የሰው መሣሪያ አድርጎ ያቀርባል፤ ትርጉሙም ሁለቱን ወኪልነቶች አይቀይርም።
