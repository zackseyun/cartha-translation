lexical_decisions:
- source_word: ἤμεθα
  choice: የነበርነው ... ነበርን
  rationale: የግሪኩን የመጀመሪያ መደብ ብዙ ቁጥር (‘ነበርን’) በግልጽ ሁኔታ ያቆያል፤ በአማርኛም የሰዎቹን ጠቅላላ ቁጥር ለመግለጽ ተፈጥሯዊ ነው።
- source_word: δὲ
  choice: በተለየ ቃል አልተተረጎመም
  rationale: እዚህ δέ ቀላል የትረካ ማያያዣ ነው፤ ‘አሁን’ ወይም ‘ነገር ግን’ ማለት ያልተገባ የጊዜ ወይም የንጽጽር ክብደት ሊጨምር ስለሚችል በአማርኛው የዓረፍተ ነገር ፍሰት ተወክሏል።
- source_word: αἱ πᾶσαι ψυχαὶ
  choice: ሁላችን ... ሰዎች
  rationale: ψυχαί በዚህ አውድ በመርከቡ የነበሩትን ሰዎች የሚያመለክት ነው፤ ‘ነፍሳት’ ቢባል ስለ ሥጋ አልባ ነፍስ የሚናገር እንዳይመስል ‘ሰዎች’ ተመርጧል። πᾶσαι ደግሞ ‘ሁላችን’ በሚለው ተንጸባርቋል።
- source_word: ἐν τῷ πλοίῳ
  choice: በመርከቡ ውስጥ
  rationale: የቦታውን ሐረግ በቅርብ የሚያስተላልፍና በዘመናዊ አማርኛ ተፈጥሯዊ የሆነ አገላለጽ ነው።
- source_word: διακόσιαι ἑβδομήκοντα ἕξ
  choice: '276'
  rationale: የግሪኩን ትክክለኛ ቁጥር ለቀላል ንባብ በመደበኛ አሃዝ ያቀርባል።
theological_decisions:
