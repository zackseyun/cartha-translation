    text: “አድርያ” የሚለው ጥንታዊ ስም የዛሬውን አድርያ ባሕር ብቻ ሳይሆን፣ በዚያ አካባቢ ያሉትን ሰፋፊ የመካከለኛው ሜዲትራኒያን የባሕር ክፍሎችም ሊያመለክት ይችል ነበር።
