  text: አሥራ አራተኛው ሌሊት በደረሰ ጊዜ፣ በአድርያ ባሕር[a] ውስጥ እየተነዳን ሳለ፣ እኩለ ሌሊት ገደማ መርከበኞቹ የሆነ መሬት ወደ እነርሱ እየቀረበ እንደሆነ መጠርጠር ጀመሩ።[b]
  philosophy: optimal-equivalence
  footnotes:
