base_translation:
  language: en
  yaml_path: translation/nt/acts/027/035.yaml
  text: And after saying these things and taking bread[a], he gave thanks to God in the presence of all, and after breaking it, he began to eat.
translation:
  language: am
  text: እነዚህንም ነገሮች ከተናገረ በኋላ፣ እንጀራ ወስዶ በሁሉም ፊት[a] እግዚአብሔርን አመሰገነ፤ ቆርሶም መብላት ጀመረ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ሁሉም ባሉበት።»
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴπας δὲ ταῦτα
  choice: እነዚህንም ነገሮች ከተናገረ በኋላ
  rationale: የቀደመውን ንግግር የሚያመለክተውን ταῦτα በግልጽ ያስቀምጣል፤ የአኦሪስት አሳታፊውንም ከዋናው ድርጊት በፊት እንደተፈጸመ በተፈጥሯዊ አማርኛ ይገልጣል። δέ ቀላል የትረካ አያያዥ ስለሆነ በ«ም» ተወክሏል።
- source_word: λαβὼν ἄρτον
  choice: እንጀራ ወስዶ
  rationale: ἄρτον እዚህ ያለ መድብ ቀርቦአል፤ «እንጀራ» የዳቦ ወይም የምግብ አይነትና መጠን ሳይጨምር ቀላሉን የምግብ ድርጊት ያስተላልፋል።
- source_word: εὐχαρίστησεν τῷ θεῷ
  choice: እግዚአብሔርን አመሰገነ
  rationale: εὐχαριστέω የሚያመለክተውን ምስጋና በዘመናዊና ተፈጥሯዊ አማርኛ ያቀርባል፤ የግሪኩ ዳቲቭ በአማርኛ ቀጥተኛ ተሳቢ መቅረቡ ተፈጥሯዊ ነው።
- source_word: ἐνώπιον πάντων
  choice: ሁሉም ባሉበት
  rationale: ድርጊቱ በሕዝብ ፊት፣ ሁሉም በተገኙበት መፈጸሙን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: κλάσας
  choice: ከቆረሰውም በኋላ
  rationale: የአኦሪስት አሳታፊው መብላት ከመጀመሩ በፊት እንጀራውን መቁረሱን ያሳያል፤ «ው» ወደ እንጀራው መመለሱን ግልጽ ያደርጋል።
- source_word: ἤρξατο ἐσθίειν
  choice: መብላት ጀመረ
  rationale: ἄρχομαι ከኢንፊኒቲቭ ጋር ያለውን የድርጊት መጀመር በቀጥታና በተለመደ አማርኛ ይገልጣል።
theological_decisions:
- issue: «እንጀራ ወስዶ…አመሰገነ…ቆረሰ…በላ» የሚለው ቅደም ተከተል ከጌታ እራት ጋር ሊኖረው የሚችለው ድምፀት
  choice: ድርጊቶቹን እንደ ተራ የትረካ ክስተቶች ብቻ መተርጎም
  alternative: ቃላቱን ከባህላዊው የጌታ እራት አገላለጽ ጋር ይበልጥ ማመሳሰል
  rationale: ቅደም ተከተሉ ሌሎች የእንጀራ መቁረስ ትዕይንቶችን ሊያስታውስ ቢችልም፣ ጥቅሱ ይህን በግልጽ የጌታ እራት አይለውም። ስለዚህ ትርጉሙ ጽሑፉ ያልተናገረውን ሥርዓታዊ ትርጓሜ አያስገባም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። የአሳታፊ ግሶቹ ቅደም ተከተል ሳይጠፋ በተፈጥሯዊ የአማርኛ አገባብ ቀርቧል።
