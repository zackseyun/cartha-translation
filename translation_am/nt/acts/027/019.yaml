    rationale: Although σκευή is grammatically singular and may be collective, this Amharic wording can read as one item of property. A plural collective expression better communicates nautical gear/equipment.
  - severity: low
    issue: The connective -ም is attached to ሦስተኛው rather than placed after the complete temporal phrase.
    rationale: The draft is understandable, but በሦስተኛው ቀንም is more natural contemporary Amharic.
