  rationale: የግሪኩ ዳቲቭ ከተራ ቁጥር ጋር የጊዜ አገላለጽ ነው፤ በአማርኛ ‘ቀን’ን በግልጽ መጨመር ተፈጥሯዊ ነው።
- source_word: αὐτόχειρες
