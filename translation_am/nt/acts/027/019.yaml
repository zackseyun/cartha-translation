  rationale: ሰዎቹ ሥራውን በራሳቸው እንዳከናወኑ የሚያጎላውን የግሪኩን ትርጉም በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: σκευή
  choice: ዕቃ
  rationale: በዚህ የባሕር ጉዞ አውድ ቃሉ የመርከቡን መሣሪያዎችና ዕቃዎች በአጠቃላይ ያመለክታል፤ ‘ዕቃ’ ቀላል፣ ዘመናዊና ሰፊውን ፍቺ የሚጠብቅ ነው።
- source_word: τοῦ πλοίου
  choice: የመርከቡን
  rationale: የግሪኩን የባለቤትነት ግንኙነት በተፈጥሯዊ የአማርኛ የ- አወቃቀር ያቀርባል።
- source_word: ἔρριψαν
  choice: ወደ ባሕር ጣሉት
  rationale: ግሱ ‘ጣሉ’ ማለት ሲሆን፣ ከመርከብ ውስጥ ወደ ውጭ መጣሉ ከአውዱ ግልጽ ስለሆነ ‘ወደ ባሕር’ ይህን በተፈጥሯዊ አማርኛ ያሳያል።
