  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βουλὴ ἐγένετο
  choice: አሰቡ
  rationale: ቃል በቃል ‘ዕቅድ ሆነ’ ከማለት ይልቅ፣ የወታደሮቹን የተወሰነ ሐሳብ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: τοὺς δεσμώτας
  choice: እስረኞቹ
  rationale: በዚህ የትረካ አውድ ውስጥ ታስረው ይጓዙ የነበሩትን ሰዎች በግልጽ ይጠቅሳል።
- source_word: ἐκκολυμβήσας διαφύγῃ
  choice: ዋኝተው እንዳያመልጡ
  rationale: ἐκκολυμβάω በመዋኘት ከአደጋው ስፍራ መውጣትን፣ διαφεύγω ደግሞ ማምለጥን ያመለክታል፤ ሁለቱንም የድርጊት ክፍሎች ይጠብቃል።
- source_word: μή τις
  choice: ከእስረኞቹ አንዳቸውም … እንዳያመልጡ
  rationale: የመከላከያ ዓላማውን ‘ማንም እንዳይ…’ በሚል የአማርኛ አወቃቀር በተፈጥሮ ያቀርባል።
