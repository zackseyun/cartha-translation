review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the soldiers’ intention to kill the prisoners and the preventive purpose of stopping escape by swimming. However, μή τις is singular ('any one'), whereas the Amharic subordinate verbs are plural.
  naturalness: The sentence is clear and suitably modern in register. Singular wording for the indefinite prisoner produces more idiomatic and grammatically consistent Amharic.
  terminology: ‘እስረኞቹ’ appropriately renders τοὺς δεσμώτας, and ‘ሊገድሏቸው’ accurately represents ἀποκτείνωσιν. ‘በመዋኘት … እንዳያመልጥ’ clearly preserves the means of escape and the escape itself.
  issues:
  - severity: low
    issue: Number mismatch in the indefinite escape clause
    rationale: The Greek μή τις has a singular indefinite subject. The draft’s ‘አንዳቸውም ዋኝተው እንዳያመልጡ’ uses plural verbal forms. Rendering it as ‘ከእስረኞቹ አንድም በመዋኘት እንዳያመልጥ’ preserves the source’s singular indefinite sense and is natural Amharic.
  revised_text: ወታደሮቹ ግን ከእስረኞቹ አንድም በመዋኘት እንዳያመልጥ ሊገድሏቸው አሰቡ።
