- source_word: ὄντος ἤδη ἐπισφαλοῦς τοῦ πλοὸς
  choice: በባሕር መጓዙ አደገኛ ሆኖ ነበር
  rationale: πλοῦς መርከቧን ሳይሆን የባሕር ጉዞውን ያመለክታል፤ ἐπισφαλής ደግሞ አደጋ ያለበትን ሁኔታ ይገልጣል።
- source_word: διὰ τὸ καὶ τὴν νηστείαν ἤδη παρεληλυθέναι
  choice: ጾሙም አስቀድሞ አልፎ ስለነበር
  rationale: διά ከዓረፍተ ነገራዊ ግስ ጋር የሚሰጠውን ምክንያታዊ ግንኙነትና ፍጹም ገጽታውን ይጠብቃል። νηστεία በተወሰነ መጠሪያነት ‘ጾሙ’ ተብሏል።
- source_word: παρῄνει
  choice: ይመክራቸው ነበር
  rationale: ያልተጠናቀቀውን የግስ ገጽታ እና የመምከር/የማሳሰብ መሠረታዊ ትርጉም ይጠብቃል፤ ተከታዩን ቀጥተኛ ንግግርም በተፈጥሮ ያስገባል።
