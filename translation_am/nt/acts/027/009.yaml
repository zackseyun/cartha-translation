base_translation:
  language: en
  yaml_path: translation/nt/acts/027/009.yaml
  text: Since considerable time had passed and the voyage was already dangerous[a], because even the Fast had already gone by, Paul was advising them[b],
translation:
  language: am
  text: ብዙ ጊዜ ካለፈ በኋላ፣ ጾሙም[a] አልፎ ስለነበር፣ በባሕር መጓዝ አስቀድሞ አደገኛ ሆኖ ነበር፤ ጳውሎስም ይመክራቸው ነበር፤[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ጾሙ” ምናልባት የስርየት ቀንን ጾም ያመለክታል። ግሪኩ “ጾሙ” ይላል፤ ይህም የባሕር ጉዞ አደገኛ መሆን የሚጀምርበትን ወቅት የሚያመለክት ዓመታዊ የአይሁድ ጾም ነበር።
    reason: cultural_note
  - marker: b
    text: የጳውሎስ ምክር በሚቀጥለው ቁጥር በቀጥታ ንግግር ይቀጥላል።
    reason: discourse_note
lexical_decisions:
