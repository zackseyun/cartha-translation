  source_fidelity: The draft conveys the sailors' attempted escape, the lowering of the ship's small boat, the false pretext, and the intended deployment of anchors from the bow. A minor revision makes the pretext clause more idiomatic and avoids redundantly specifying that the anchors were to be lowered 'into the sea,' which is not explicitly stated in the Greek phrase for laying out anchors.
