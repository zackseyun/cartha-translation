  text: τῶν δὲ ναυτῶν ζητούντων φυγεῖν ἐκ τοῦ πλοίου καὶ χαλασάντων τὴν σκάφην εἰς τὴν θάλασσαν προφάσει ὡς ἐκ πρῴρης ⸂ἀγκύρας μελλόντων⸃ ἐκτείνειν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/030.yaml
  text: And when the sailors were seeking to escape from the ship and had lowered the skiff into the sea under the pretense of being about to lay out anchors from the bow[b][a],
translation:
  language: am
  text: መርከበኞቹም ከመርከቡ ለማምለጥ እየሞከሩ፣ ከመርከቡ ፊት[b] መልሕቆችን ሊዘረጉ በሚል ሰበብ ትንሹን ጀልባ[a] ወደ ባሕር ባወረዱ ጊዜ፣
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ጀልባውን።” የግሪኩ σκάφη ቃል የመርከቡን ትንሽ ጀልባ ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ከመርከቡ ቀዳሚ ጫፍ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ναυτῶν
  choice: መርከበኞቹ
  rationale: በዘመናዊ አማርኛ የመርከብ ሠራተኞችን በግልጽና ተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: ζητούντων φυγεῖν
  choice: ለማምለጥ እየሞከሩ
  rationale: ζητέω ከግስ ማስደገፊያ ጋር የሙከራንና የዓላማን ሐሳብ ያሳያል፤ በዚህ አውድ ‘ማምለጥ’ መርከቡን ጥሎ መሄድን በተፈጥሮ ይገልጣል።
- source_word: ἐκ τοῦ πλοίου
  choice: ከመርከቡ
  rationale: የመነሻንና ከመርከቡ ተለይቶ መውጣትን በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: χαλασάντων τὴν σκάφην
  choice: ትንሹን ጀልባ ወደ ባሕር ባወረዱ
  rationale: σκάφη የመርከቡን አነስተኛ ጀልባ ያመለክታል፤ ‘የነፍስ አድን ጀልባ’ ማለት ከምንጩ በላይ ትርጓሜ ስለሚጨምር ‘ትንሹ ጀልባ’ ተመርጧል። የ‘ባወረዱ ጊዜ’ ቅርጽ ንግግሩ በቀጣዩ ቁጥር እንደሚሟላ ያሳያል።
- source_word: προφάσει ὡς
  choice: እንደሆነ በማስመሰል
  rationale: የተነገረው ምክንያት እውነተኛ ዓላማቸውን የሸፈነ ሰበብ መሆኑን በግልጽ ያሳያል።
- source_word: ἐκ πρῴρης
  choice: ከመርከቡ የፊት ክፍል
  rationale: የመርከቡን ቀዳሚ ጫፍ በባሕር ሙያ ቃል ያልተለመዱ አንባቢዎችም በሚረዱት መንገድ ይገልጣል።
- source_word: ἀγκύρας μελλόντων ἐκτείνειν
  choice: መልሕቆችን ወደ ባሕር ሊያወርዱ
  rationale: μέλλω የታሰበን ቅርብ ድርጊት ያሳያል፤ ἐκτείνω በዚህ የባሕር ጉዞ አውድ መልሕቆችን ከመርከቡ ዘርግቶ ወደ ባሕር ማውረድን ያመለክታል። ‘ሊያወርዱ’ ይህን ድርጊት በተፈጥሯዊ አማርኛ ይገልጣል።
