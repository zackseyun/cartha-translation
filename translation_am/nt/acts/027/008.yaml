lexical_decisions:
- source_word: μόλις
  choice: በብዙ ችግር
  rationale: ጉዞው የተሳካው በከፍተኛ ችግር እንደሆነ ያሳያል፤ በዘመናዊ አማርኛም ተፈጥሯዊ ነው።
- source_word: παραλεγόμενοι αὐτήν
  choice: የቀርጤስን ዳርቻ ተከትለን እየተጓዝን
  rationale: παραλέγομαι በመርከብ ጉዞ አውድ የባሕር ዳርቻን ተከትሎ መጓዝን ያመለክታል። αὐτήν በቀደመው አውድ ወደ ቀርጤስ ስለሚመለስ፣ በአማርኛ ግልጽነት ሲባል ስሙ ተገልጿል።
- source_word: ἤλθομεν εἰς τόπον τινά
  choice: ወደሚባል አንድ ስፍራ ደረስን
  rationale: τινά ያለውን ያልተወሰነ አገላለጽ “አንድ ስፍራ” ይጠብቃል፤ ἤλθομεν በመድረሻ አውድ “ደረስን” ተፈጥሯዊ ነው።
- source_word: Καλοὺς Λιμένας
  choice: “መልካም ወደቦች”
  rationale: የቦታውን የግሪክ ስም ትርጉም በቀጥታ ያስተላልፋል፤ የቦታ ስም መሆኑን ለማሳየት በጥቅስ ምልክት ቀርቧል።
- source_word: ᾧ ἐγγὺς ἦν πόλις Λασαία
  choice: በአቅራቢያውም ላስያ የምትባል ከተማ ነበረች
  rationale: የመልካም ወደቦችን ቅርበትና πόλις ያለ የተወሰነ አመልካች መቅረቡን ተፈጥሯዊ በሆነ አማርኛ ይጠብቃል።
