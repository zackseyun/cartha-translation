  text: በጭንቅም የቀርጤስን ዳርቻ ተከትለን በመርከብ እየተጓዝን[a]፣ “መልካም ወደቦች” ወደሚባል አንድ ስፍራ ደረስን፤ በአቅራቢያውም ላሴያ የምትባል ከተማ ነበረች።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የቀርጤስን ዳርቻ ተጠግተን በመርከብ እየተጓዝን።” παραλεγόμενοι የሚለው የግሪክ ቃል በባሕር ዳርቻ ተከትሎ በመርከብ መጓዝን የሚያመለክት የመርከበኞች አገላለጽ ነው።
