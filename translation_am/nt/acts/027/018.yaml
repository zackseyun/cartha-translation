  text: ነገር ግን በማዕበል ክፉኛ እየተጎሳቆልን ስለነበርን፣ በማግስቱ ጭነቱን ወደ ባሕር መጣል ጀመሩ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ አገላለጽ ቃል በቃል፣ “መጣልን አደረጉ” ይላል፤ ይህም መርከቡን ለማቅለል ጭነትን ወደ ባሕር መጣልን የሚያመለክት የባሕር ጉዞ አገላለጽ ነው።
