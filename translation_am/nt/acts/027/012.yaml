    text: ወይም፣ “ከዚያ ተነሥተው ወደ ባሕር ለመውጣት።” የግሪክኛው ግስ መርከብ ከወደብ ተነሥቶ ወደ ባሕር መውጣቱን የሚገልጽ የባሕር ጉዞ ቃል ነው።
    reason: lexical_alternative
  - marker: b
    text: ፊንቄ በቀርጤስ የነበረ ወደብ ነው፤ እዚህ ስሙ የፊንቄን አገር አያመለክትም።
    reason: cultural_note
  - marker: c
    text: የመጨረሻው የአቅጣጫ ሐረግ ለመተርጎም አስቸጋሪ ነው። በተለምዶ “ወደ ደቡብ ምዕራብና ወደ ሰሜን ምዕራብ” ተብሎ ይተረጎማል፤ አንዳንዶች ሁለተኛውን አቅጣጫ “ወደ ምዕራብ-ሰሜን ምዕራብ” ብለው ይረዱታል።
    reason: lexical_alternative
