base_translation:
  language: en
  yaml_path: translation/nt/acts/027/041.yaml
  text: But falling into a place where two seas met[a], they ran the ship aground; and the bow, having stuck fast, remained immovable, but the stern was being broken up by the force.
translation:
  language: am
  text: ነገር ግን ሁለት ባሕሮች ወደሚገናኙበት ስፍራ ደርሰው[a] መርከቡን መሬት ላይ አሳረፉት። የመርከቡም ፊት ተጣብቆ ሳይነቃነቅ ቀረ፤ የመርከቡ የኋላ ክፍል ግን በኃይል ይሰባበር ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በሁለት ባሕሮች መካከል ወዳለ ስፍራ።” የግሪኩ አገላለጽ እጅግ አልፎ አልፎ የሚገኝ ሲሆን፣ የውኃ መተላለፊያን፣ በውኃ ውስጥ ያለ አሸዋማ ክምችትን ወይም ሁለት የውኃ ክፍሎች ወይም ፍሰቶች የሚገናኙበትን ቦታ ሊያመለክት ይችላል።
