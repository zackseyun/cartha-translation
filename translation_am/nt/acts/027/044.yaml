  text: and the rest[a], some on planks and some on pieces from the ship. And so it happened that all were brought safely to land.
translation:
  language: am
  text: የቀሩትም፣ አንዳንዶቹ በሳንቃዎች ላይ፣ ሌሎቹ ደግሞ ከመርከቡ የሆኑ አንዳንድ ነገሮች ላይ። በዚህም ሁኔታ ሁሉም በደኅና ወደ የብስ ደረሱ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሁሉም ወደ የብስ ዳኑ” ወይም “ሁሉም በሰላም ወደ ዳርቻ ወጡ።” እዚህ ያለው የግሪክ ግስ በመርከብ መሰበር አደጋ ውስጥ አካላዊ መትረፍን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς λοιποὺς
  choice: የቀሩት
  rationale: በቀደመው ቁጥር ከተጠቀሱት በስተቀር የቀሩትን ሰዎች ያመለክታል፤ ይህ አገላለጽ ተፈጥሯዊና ግልጽ ነው።
- source_word: οὓς μὲν ... οὓς δὲ
  choice: አንዳንዶቹ ... ሌሎቹም
  rationale: ቀሪዎቹን በሁለት ቡድን የሚከፍለውን የግሪክ አገባብ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐπὶ σανίσιν
  choice: በሳንቃዎች ላይ
  rationale: σανίς ሰፊና ጠፍጣፋ የእንጨት ሳንቃን ወይም ሰሌዳን ያመለክታል፤ በመርከብ መሰበር አውድ ‘ሳንቃ’ ትክክለኛና ግልጽ ነው።
- source_word: ἐπί τινων τῶν ἀπὸ τοῦ πλοίου
  choice: ከመርከቡ በተገኙ ቁርጥራጮች ላይ
  rationale: ጽሑፉ ከመርከቡ የሆኑ ያልተወሰኑ ነገሮችን ያመለክታል፤ ‘ቁርጥራጮች’ የመርከብ ስብርባሪነታቸውን በግልጽ ያሳያል እንጂ በተለየ መልኩ አይወስናቸውም።
- source_word: οὕτως
  choice: በዚህም ሁኔታ
  rationale: ከዚህ በፊት የተገለጸውን የመዳኛ መንገድ ያጠቃልላል።
- source_word: ἐγένετο πάντας διασωθῆναι
  choice: ሁሉም በደኅና ... ደረሱ
  rationale: የትረካውን ውጤት በተፈጥሯዊ አማርኛ ይገልጣል፤ διασῴζω በዚህ አውድ ከመርከብ አደጋ በሕይወትና በደኅና መውጣትን ያመለክታል።
- source_word: ἐπὶ τὴν γῆν
  choice: ወደ የብስ
  rationale: በባሕር ጉዞ አውድ γῆ ከውኃ በተቃራኒ ያለውን የብስ ያመለክታል።
theological_decisions:
- issue: διασωθῆναι የሚለው ግስ ሊኖረው የሚችለው መንፈሳዊ የድነት ጥላ
  choice: በደኅና ወደ የብስ ደረሱ
  alternative: ሁሉም ወደ የብስ ዳኑ / ሁሉም በሰላም ወደ ዳርቻ ወጡ
  rationale: የቅርብ አውዱ የመርከብ መሰበርና ከአደጋው በሕይወት መውጣት ነው። ስለዚህ ትርጉሙ አካላዊ መትረፍን ያሳያል፤ ጽሑፉ የማያስገድደውን መንፈሳዊ ትርጉም አያስገባም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። የግሪኩ ሐረግ ከቀደመው ቁጥር ጋር በሰዋስው የተያያዘ ቢሆንም፣ ቁጥሩ ለብቻው ሲነበብ ግልጽ እንዲሆን ‘ሆነው ወጡ’ ተጨምሯል።
