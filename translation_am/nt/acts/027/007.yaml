  text: ἐν ἱκαναῖς δὲ ἡμέραις βραδυπλοοῦντες καὶ μόλις γενόμενοι κατὰ τὴν Κνίδον, μὴ προσεῶντος ἡμᾶς τοῦ ἀνέμου, ὑπεπλεύσαμεν τὴν Κρήτην κατὰ Σαλμώνην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/007.yaml
  text: For many days we were sailing slowly[a], and with difficulty we came opposite Cnidus. Since the wind did not allow us to go farther, we sailed under the lee of Crete[b], off Salmone.
translation:
  language: am
  text: ለብዙ ቀናት በዝግታ ስንጓዝ፣ በችግር ከክኒዶስ አንጻር ደረስን። ነፋሱ ወደፊት እንድንጓዝ ስላልፈቀደልን፣ በሳልሞኔ አቅራቢያ በቀርጤስ ደሴት ከነፋስ በተከለለው ወገን በመርከብ ተጓዝን።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “ከቀርጤስ ሥር በመርከብ ተጓዝን”፤ ማለትም በደሴቲቱ ከነፋስ በተከለለው ወገን ተጓዙ።
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ἱκαναῖς δὲ ἡμέραις
  choice: ለብዙ ቀናት
  rationale: የጊዜውን ረዥም ቆይታ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: βραδυπλοοῦντες
  choice: በዝግታ ከተጓዝን
  rationale: የመርከቡን ዝግተኛ ጉዞ ይጠብቃል፤ የμόλιςን የችግር ሐሳብ ከዚህ አያዋህድም።
- source_word: μόλις γενόμενοι κατὰ τὴν Κνίδον
  choice: በብዙ ችግር ክኒዶስ ፊት ለፊት ደረስን
  rationale: μόλις የሚያመለክተውን ችግርና κατά የሚያመለክተውን ከቦታው ፊት ለፊት መድረስ ያስቀምጣል።
- source_word: μὴ προσεῶντος ἡμᾶς τοῦ ἀνέμου
  choice: ነፋሱ ወደፊት እንድንጓዝ ስላልፈቀደልን
  rationale: የመንገድ ለውጡን ምክንያት በግልጽ አማርኛ ያቀርባል፤ የመቅረብ ወይም የመቀጠል ግሥ በግሪኩ በአውዱ የታሰበ ነው።
- source_word: ὑπεπλεύσαμεν τὴν Κρήτην
  choice: በቀርጤስ ደሴት ነፋስ ከለል በኩል ተጓዝን
  rationale: የὑποπλέωን የባሕር ጉዞ ትርጉም፣ ማለትም በደሴቱ ከነፋስ በተጠበቀው ወገን መጓዝን፣ በሚገባ ያሳያል።
- source_word: κατὰ Σαλμώνην
  choice: በሳልሞኔ በኩል
  rationale: በዚያ የባሕር ዳርቻ ምልክት አቅራቢያ የተከተሉትን መስመር በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: Κνίδον / Κρήτην / Σαλμώνην
  choice: ክኒዶስ / ቀርጤስ / ሳልሞኔ
  rationale: የቦታ ስሞቹ በተለመደ የአማርኛ የግዕዝ ፊደል አጻጻፍ ተጽፈዋል።
