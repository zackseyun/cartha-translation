    issue: The phrase ጳውሎስ ይናገር ከነበረው is ungrammatical or at least seriously incomplete in modern standard Amharic.
    rationale: It needs a relative verbal form such as ጳውሎስ ከሚለው to mean “what Paul was saying.”
  - severity: medium
    issue: የመቶ አለቃው … አመነ does not most naturally convey ἐπείθετο.
    rationale: The Greek depicts the centurion as being persuaded by the pilot and shipowner rather than by Paul’s words. በ… ተሳመነ expresses this relation more accurately.
  - severity: low
    issue: The footnote repeats the malformed Pauline clause and uses a less precise alternative without appropriate case marking.
    rationale: It should be corrected along with the main text and retain the supplied lexical alternative as a genuine alternative.
