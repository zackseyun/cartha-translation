  text: Ὅτε δὲ ἡμέρα ἐγένετο, τὴν γῆν οὐκ ἐπεγίνωσκον, κόλπον δέ τινα κατενόουν ἔχοντα αἰγιαλὸν εἰς ὃν ⸀ἐβουλεύοντο εἰ ⸀δύναιντο ⸀ἐξῶσαι τὸ πλοῖον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/039.yaml
  text: When day came[a], they did not recognize the land, but they noticed a certain bay with a beach, into which they planned, if they could, to run the ship ashore.
translation:
  language: am
  text: ቀን ሲሆን፣ ምድሩን ለይተው አላወቁትም፤ ነገር ግን ዳርቻ ያለውን አንድ ሰላጤ ተመለከቱ። ቢችሉ መርከቡን ወደዚያ ሰላጤ ገፍተው ዳርቻ ላይ ለማሳረፍ[a] አሰቡ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «መርከቡን ዳርቻ ላይ ለማውጣት።» የግሪኩ ግስ መርከቡን ገፍቶ ወይም በኃይል ወደ ዳርቻ ማስገባትን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε δὲ ἡμέρα ἐγένετο
  choice: ቀን በሆነ ጊዜ
  rationale: የብርሃን መምጣትን በተፈጥሯዊ የአማርኛ ጊዜ ሐረግ ያስተላልፋል፤ δέ እዚህ ቀላል የትረካ ሽግግር ስለሆነ በተጨማሪ ቃል አልተተረጎመም።
- source_word: τὴν γῆν οὐκ ἐπεγίνωσκον
  choice: ምድሩን ለይተው አላወቁትም
  rationale: ἐπιγινώσκω የማንነትን ወይም የቦታን መለየት ያመለክታል፤ «ለይተው አላወቁትም» ይህን ከተራ «አላወቁም» በግልጽ ይለያል።
- source_word: κόλπον δέ τινα κατενόουν
  choice: ነገር ግን ... አንድ ሰላጤ ተመለከቱ
  rationale: κόλπος በዚህ የባሕር ጉዞ አውድ «ሰላጤ» ነው፤ τινα ያለውን አለመወሰን «አንድ» ያቆያል፣ κατενόουν ደግሞ በትኩረት ማየትን ያሳያል።
- source_word: ἔχοντα αἰγιαλὸν
  choice: ዳርቻ ያለውን
  rationale: αἰγιαλός የባሕር ዳርቻን ያመለክታል፤ ግሪኩ አሸዋማ መሆኑን ስለማይገልጽ «አሸዋማ» አልተጨመረም።
- source_word: εἰς ὃν ἐβουλεύοντο εἰ δύναιντο
  choice: ቢችሉ ... ወደዚያ ... ለማውጣት አሰቡ
  rationale: «ቢችሉ» የεἰ ከይሆናልነት እና የδύναντο ችሎታ ሁኔታን ያቆያል፤ «አሰቡ» የβουλεύομαιን ዕቅድና ውሳኔ ሳያጠናክር ያቀርባል።
- source_word: ἐξῶσαι τὸ πλοῖον
  choice: መርከቡን ወደዚያ ዳርቻ ገፍተው ለማውጣት
  rationale: ἐξωθέω መርከብን በኃይል ወደ ዳርቻ ማስገባትን ወይም ማውጣትን ያመለክታል፤ «ገፍተው» ይህን የኃይል እንቅስቃሴ ያቆያል።
