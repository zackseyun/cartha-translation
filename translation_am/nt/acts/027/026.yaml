review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the contrast (δέ), necessity (δεῖ), and the unspecified island (τινα). However, መውጣታችን (“our getting out/disembarking”) does not adequately convey the nautical force of ἐκπεσεῖν, which here denotes being driven ashore or running aground rather than an ordinary disembarkation.
  naturalness: The sentence is grammatically natural, but በአንድ ደሴት ላይ መውጣት can naturally suggest voluntarily getting off a vessel on an island. Adding ተገፍተን makes the maritime mishap clear in idiomatic modern Amharic.
  terminology: ደሴት and የግድ ነው are appropriate. The revised wording preserves the collective first-person reference without unnecessarily replacing “we” with “our ship.”
  issues:
  - severity: medium
    issue: The rendering of ἐκπεσεῖν as መውጣት is too weak.
    rationale: In this maritime context, the verb refers to an involuntary landfall/grounding. Plain መውጣት can mean simply disembarking and loses the adverse, forced sense.
  revised_text: ነገር ግን በአንዲት ደሴት ላይ ተገፍተን መውጣታችን የግድ ነው።[a]
  revised_footnotes:
  - marker: a
    text: ወይም፣ “በአንዲት ደሴት ላይ መርከባችን መግጨት።”
    reason: lexical_alternative
  revision_rationale: The revision retains the source’s necessity and indefiniteness while making explicit the involuntary maritime sense of ἐκπεσεῖν. The footnote supplies the closely related “run aground” sense without forcing an explicit mention of the ship into the main text.
