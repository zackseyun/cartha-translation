    reason: cultural_note
  - marker: c
    text: ወይም «የመርከቡን ገመድና ሸራ ዕቃ» ወይም «የባሕር መልሕቁን»። የግሪኩ ቃል «ዕቃ/መሣሪያ» ይላል፤ በዚህ ስፍራ የትኛውን የመርከብ ዕቃ እንደሚያመለክት እርግጠኛ አይደለም።
    reason: lexical_alternative
