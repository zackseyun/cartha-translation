  text: After hoisting it up[a], they used supporting cables to undergird the ship; and fearing that they might run aground on the Syrtis[c][b], they lowered the sea anchor and so were driven along.
translation:
  language: am
  text: ጀልባዋን ወደ ላይ ካነሱ በኋላ፣ መርከቡን በገመዶች ዙሪያውን አስረው ለማጠናከር የድጋፍ ገመዶችን[a] ተጠቀሙ። ወደ ሲርቲስ[b] ተገፍተው እንዳይወድቁ ስለፈሩ፣ የመርከብ ዕቃውን[c] አወረዱ፤ ከዚያም እየተገፉ ሄዱ።
  philosophy: optimal-equivalence
  footnotes:
