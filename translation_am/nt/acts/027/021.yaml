source:
  edition: SBLGNT
  text: Πολλῆς ⸀τε ἀσιτίας ὑπαρχούσης τότε σταθεὶς ὁ Παῦλος ἐν μέσῳ αὐτῶν εἶπεν· Ἔδει μέν, ὦ ἄνδρες, πειθαρχήσαντάς μοι μὴ ἀνάγεσθαι ἀπὸ τῆς Κρήτης κερδῆσαί τε τὴν ὕβριν ταύτην καὶ τὴν ζημίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/021.yaml
  text: Since they had gone a long time without food, then Paul stood up among them and said, “Men, you should have listened to me and not set sail from Crete, and so have avoided this damage and loss.”
translation:
  language: am
  text: ለረጅም ጊዜ ምግብ ሳይበሉ ከቆዩ በኋላ፣[a] ጳውሎስ በመካከላቸው ቆሞ እንዲህ አለ፦ “እናንተ ሰዎች፣ ምክሬን ሰምታችሁ[b] ከቀርጤስ በመርከብ ባትነሡ ይገባ ነበር፤ ከዚህ ጉዳትና ኪሳራ በተጠበቃችሁ ነበር።”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ብዙ ጾም ከነበረ በኋላ።” የግሪኩ ቃል ἀσιτία ምግብ ማጣትንም ሆነ ከመብላት መታቀብን ሊያመለክት ይችላል፤ በዚህ የማዕበል አውድ ግን ለረጅም ጊዜ አለመብላት ይበልጥ የሚመስል ነው።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ታዝዛችሁኝ።” ግሱ ትእዛዝን ወይም ባለሥልጣንን የመታዘዝ ፍቺ ሊኖረው ይችላል፤ እዚህ ግን የጳውሎስን ምክር መቀበልን ያመለክታል።
    reason: lexical_alternative
  - marker: c
    text: “ጉዳትና ኪሳራ” የሚለው ጥምረት የደረሰን ጉዳት ከቁሳዊ ኪሳራ ለይቶ ሊያመለክት ይችላል።
    reason: cultural_note
lexical_decisions:
- source_word: Πολλῆς τε ἀσιτίας ὑπαρχούσης
  choice: ለረጅም ጊዜ ምግብ ሳይበሉ ከቆዩ በኋላ
  rationale: የግሪኩ አገላለጽ ለጳውሎስ ንግግር የሆነውን ቀዳሚ ሁኔታ ያሳያል። ἀσιτία ምግብ ማጣትን ወይም ከመብላት መታቀብን ሊያመለክት ቢችልም፣ በማዕበሉ አውድ ለረጅም ጊዜ አለመብላት ይበልጥ ተስማሚ ነው።
- source_word: σταθεὶς ὁ Παῦλος ἐν μέσῳ αὐτῶν
  choice: ጳውሎስ በመካከላቸው ቆሞ
  rationale: የጳውሎስን ተነሥቶ በሕዝቡ መካከል የመናገር ትርክታዊ ድርጊት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: Ἔδει μέν
  choice: ይገባ ነበር
  rationale: δεῖ በኢምፐርፌክት ጊዜ መሆኑ ቀደም ሲል ሊደረግ ይገባ የነበረውን ያሳያል።
- source_word: ὦ ἄνδρες
  choice: እናንተ ሰዎች
  rationale: በመርከቡ ላይ ላሉት ወንዶች የቀረበውን ቀጥተኛ የአድራሻ ንግግር ያስተላልፋል፤ በአማርኛም ከ“ወንዶች” ይልቅ ተፈጥሯዊ ነው።
- source_word: πειθαρχήσαντάς μοι
  choice: ምክሬን ሰምታችሁ
  rationale: πειθαρχέω መታዘዝን ወይም ምክርን መስማትን ሊያመለክት ይችላል። እዚህ ጳውሎስ የሰጠውን የጉዞ ምክር መቀበል ስለሆነ “ምክሬን ሰምታችሁ” ተፈጥሯዊና አውዳዊ ነው።
- source_word: μὴ ἀνάγεσθαι ἀπὸ τῆς Κρήτης
  choice: ከቀርጤስ ባትነሡ
  rationale: ἀνάγω በባሕር ጉዞ አውድ መርከብን አስነስቶ መጓዝን ያመለክታል። “ከቀርጤስ ባትነሡ” ይህን በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: κερδῆσαί τε
  choice: ባስቀራችሁ ነበር
  rationale: κερδαίνω ቃል በመሠረቱ ማትረፍን ያመለክታል፤ በዚህ አውድ ግን ጉዳትን ወይም ኪሳራን እንዳያጋጥም ማስቀረት የሚል ፈሊጣዊ ሐሳብ አለው።
- source_word: τὴν ὕβριν ταύτην καὶ τὴν ζημίαν
  choice: ይህን ጉዳትና ኪሳራ
  rationale: በዚህ የባሕር ጉዞ አውድ ὕβρις የተደረሰን ጉዳት፣ ζημία ደግሞ የቁሳዊ ነገር ኪሳራን ሊያመለክት ይችላል። ሁለቱን ለይቶ መተርጎም የምንጩን ጥምረት ይጠብቃል።
