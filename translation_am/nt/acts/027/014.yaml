    reason: textual_variant
  - marker: b
    text: ወይም፣ “ኃይለኛ የሰሜን ምሥራቅ ነፋስ።” ይህ መጠሪያ ምናልባት ከሰሜን ምሥራቅ የሚነሳን አውሎ ነፋስ ያመለክታል፤ የግሪኩ ጽሑፍ ግን እንደ ግል ስም ያቀርበዋል።
    reason: lexical_alternative
