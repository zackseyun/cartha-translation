  text: διὸ παρακαλῶ ὑμᾶς ⸀μεταλαβεῖν τροφῆς, τοῦτο γὰρ πρὸς τῆς ὑμετέρας σωτηρίας ὑπάρχει· οὐδενὸς γὰρ ὑμῶν θρὶξ ⸀ἀπὸ τῆς κεφαλῆς ⸀ἀπολεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/034.yaml
  text: Therefore I urge you to take some food[a], for this is for your preservation; for not a hair from the head of any of you will perish.
translation:
  language: am
  text: ስለዚህ ምግብ እንድትበሉ እለምናችኋለሁ፤ ይህ ለመዳናችሁ[a] ይጠቅማልና። ከእናንተ ማንም ሰው ራስ ላይ አንዲት ጠጉር እንኳ አትጠፋም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በሕይወት ለመትረፋችሁ»። የግሪኩ ቃል «መዳንን»፣ «ከአደጋ መትረፍን» ወይም «ደኅንነትን» ሊያመለክት ይችላል፤ በዚህ አውድ ከመርከብ አደጋው በሕይወት መትረፍን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: ስለዚህ
  rationale: ከቀደመው ሁኔታ የሚወጣውን ድምዳሜ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: παρακαλῶ
  choice: እለምናችኋለሁ
  rationale: ጳውሎስ ሰዎቹን አጥብቆ እየጠየቀ መሆኑን ሳያጋንን ይገልጣል።
- source_word: μεταλαβεῖν τροφῆς
  choice: ምግብ እንድትበሉ
  rationale: ምግብ መውሰድንና ሰውነትን ማበርታትን የሚያመለክተውን ፈሊጥ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: σωτηρίας
  choice: መዳናችሁ
  rationale: የግሪኩ ቃል መዳንን፣ ከአደጋ መትረፍን ወይም ደኅንነትን ሊያመለክት ይችላል። «መዳን» የቃሉን ስፋት ይጠብቃል፤ የባሕር አደጋው አውድ ግን እዚህ አካላዊ መትረፍን ያመለክታል።
- source_word: τοῦτο γὰρ πρὸς τῆς ὑμετέρας σωτηρίας ὑπάρχει
  choice: ይህ ለመዳናችሁ ይጠቅማልና
  rationale: ድርጊቱ ለእነርሱ መትረፍ ጥቅም እንዳለው የሚገልጠውን የዓረፍተ ነገሩን ኃይል ያስተላልፋል።
- source_word: οὐδενὸς γὰρ ὑμῶν θρὶξ ἀπὸ τῆς κεφαλῆς ἀπολεῖται
  choice: ከእናንተ ከአንዳችሁም ራስ አንዲት ጠጉር እንኳ አትጠፋም
  rationale: አንዳቸውም ምንም ጉዳት እንደማይደርስባቸው የሚያረጋግጠውን የግሪኩን ፈሊጣዊ አነጋገር እና «አንዲት…እንኳ» የሚለውን አጽንዖት ይጠብቃል።
theological_decisions:
- issue: በዚህ አውድ የσωτηρία ትርጉም
  choice: «መዳን» የሚለውን ሰፊ ቃል በዋናው ጽሑፍ ማቆየት፣ አውዱ ግን ከመርከብ አደጋ በሕይወት መትረፍን እንደሚያመለክት በማስታወሻ ማብራራት
  alternative: «በሕይወት ለመትረፋችሁ» ብሎ በዋናው ጽሑፍ ትርጉሙን ሙሉ በሙሉ መገደብ
  rationale: የቅርብ አውዱ ስለ አካላዊ መትረፍ ቢሆንም፣ «መዳን» የግሪኩን ቃል ሰፊ የትርጉም ክልል ይጠብቃል፤ ማስታወሻውም በዚህ ስፍራ የታሰበውን ያብራራል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። «እለምናችኋለሁ» የልመናውን ጥብቅነት፣ «አንዲት ጠጉር እንኳ» ደግሞ የማረጋገጫውን አጽንዖት ያስተላልፋሉ።
