- source_word: μετὰ ὕβρεως καὶ πολλῆς ζημίας
  choice: አደጋና ከፍተኛ ኪሳራ የሚያስከትል
  rationale: በዚህ የባሕር ጉዞ አውድ ὕβρις ከባድና ጎጂ ክስተትን፣ ζημία ደግሞ ኪሳራን ያመለክታሉ። አገላለጹ የአብሮነት/ውጤት ግንኙነቱን በተፈጥሯዊ አማርኛ ያሳያል።
