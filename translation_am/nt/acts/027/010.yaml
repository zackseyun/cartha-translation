  text: saying to them[a], “Men, I perceive that the voyage is about to be with disaster and great loss, not only of the cargo and the ship[b], but also of our lives.”
translation:
  language: am
  text: እንዲህም እያለ ተናገራቸው፤ “ወንዶች ሆይ፣ ይህ ጉዞ ከከባድ ጉዳትና ከብዙ ኪሳራ[a] ጋር እንደሚሆን እመለከታለሁ፤ ይህም በጭነቱና በመርከቡ ብቻ ሳይሆን በሕይወታችንም[b] ላይ ይደርሳል።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከከባድ መከራና ከብዙ ጉዳት ጋር።” የግሪኩ አገላለጽ ከጉዞው ጋር የሚመጣ ኃይለኛ መከራ ወይም ጉዳት ሊያመለክት ይችላል።
    reason: lexical_alternative
