  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። የግሪኩ ረጅም የኢንፊኒቲቭ አወቃቀር በአማርኛ ግልጽ እንዲሆን ወደ ውጤት አመልካች አንቀጽ ተለውጧል፤ የኪሳራው ከባድነትና የጳውሎስ ግንዛቤ ግን ተጠብቀዋል።
