  choice: በጭነቱና በመርከቡ ላይ ብቻ ሳይሆን … ደግሞ
  rationale: ኪሳራው የሚደርስባቸውን ነገሮች ግልጽ ያደርጋል፤ φορτίον በመርከብ አውድ ‘ጭነት’ ነው።
- source_word: τῶν ψυχῶν ἡμῶν
  choice: በሕይወታችንም ላይ
  rationale: ψυχή እዚህ በመርከብ አደጋ ሊጠፋ የሚችለውን ሥጋዊ ሕይወት ያመለክታል።
