  text: saying, ‘Do not be afraid, Paul. You must stand before Caesar, and look, God has granted to you all those sailing with you.’
translation:
  language: am
  text: እንዲህ አለኝ፦ “ጳውሎስ ሆይ፣ አትፍራ። በቄሳር ፊት መቆም አለብህ፤ እነሆ፣ እግዚአብሔር ከአንተ ጋር በመርከብ የሚጓዙትን ሁሉ በጸጋ ሰጥቶሃል።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων
  choice: እንዲህ አለኝ
  rationale: በቀደመው አውድ የተጠቀሰው መልአክ ለጳውሎስ የተናገረውን በተፈጥሯዊ አማርኛ ያስተዋውቃል።
- source_word: Καίσαρί σε δεῖ παραστῆναι
  choice: በቄሳር ፊት መቆም አለብህ
  rationale: δεῖ የሚያመለክተውን አስፈላጊነት እና παραστῆναι የሚያመለክተውን በገዢ ፊት መቅረብ በግልጽ ሁኔታ ያቀርባል።
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: የአንባቢውን ትኩረት ወደሚከተለው የሚስብ ክብር ያለውና የተለመደ አማርኛ አገላለጽ ነው።
- source_word: κεχάρισταί σοι ὁ θεὸς
  choice: እግዚአብሔር ለአንተ ሰጥቶሃል
  rationale: የግሪኩን ፍጹም ጊዜና የጸጋ ስጦታ ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ እዚህ መስጠቱ ሰዎቹን ከአደጋ ማዳንን ያመለክታል።
- source_word: πάντας τοὺς πλέοντας μετὰ σοῦ
  choice: ከአንተ ጋር በመርከብ የሚጓዙትን ሁሉ
  rationale: የአሁን ክፍለ ጊዜውን እና የጉዞውን የባሕር አውድ ግልጽ ያደርጋል።
theological_decisions:
- issue: “God has granted you” የሚለው የስጦታ እና የመዳን ግንኙነት
  choice: እግዚአብሔር ለአንተ ሰጥቶሃል
  alternative: እግዚአብሔር ስለ አንተ ሁሉንም ያድናቸዋል
  rationale: የምንጩን ዘይቤ በቅርብ ይጠብቃል፤ የመዳናቸውን ትርጉም በግልጽ ቢጠቁምም ከጽሑፉ በላይ የሆነ ማብራሪያ አያስገባም።
- issue: δεῖ የሚያመለክተው መለኮታዊ አስፈላጊነት
  choice: መቆም አለብህ
  alternative: በቄሳር ፊት እንድትቆም ተወስኗል
  rationale: የግዴታውን ኃይል ያቆያል፣ ነገር ግን ምንጩ በቀጥታ ያልገለጸውን የውሳኔ ቃላት አያክልም።
