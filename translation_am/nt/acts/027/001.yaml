source:
  edition: SBLGNT
  text: Ὡς δὲ ἐκρίθη τοῦ ἀποπλεῖν ἡμᾶς εἰς τὴν Ἰταλίαν, παρεδίδουν τόν τε Παῦλον καί τινας ἑτέρους δεσμώτας ἑκατοντάρχῃ ὀνόματι Ἰουλίῳ σπείρης Σεβαστῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/001.yaml
  text: When it was decided that we should sail for Italy[a], they handed over both Paul and some other prisoners to a centurion named Julius, of the Augustan Cohort.
translation:
  language: am
  text: ወደ ኢጣሊያ በመርከብ እንድንሄድ ሲወሰን፣ ጳውሎስንና ሌሎች አንዳንድ እስረኞችን የአውግስጦስ ጭፍራ የነበረ ዩልዮስ ለሚባል የመቶ አለቃ አስረከቧቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκρίθη
  choice: በተወሰነ ጊዜ
  rationale: የግሪኩን ግስ ተደራጊ እና ኢ-ግላዊ የአስተዳደር ውሳኔ ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τοῦ ἀποπλεῖν ἡμᾶς
  choice: በመርከብ እንድንሄድ
  rationale: የውሳኔውን ይዘት፣ የባሕር ጉዞን እና የተራኪውን የመጀመሪያ መደብ ብዙ ቁጥር ይጠብቃል።
- source_word: παρεδίδουν
  choice: አስረከቧቸው
  rationale: እስረኞቹን በሥርዓት ከአንድ ጠባቂ ወደ ሌላ ማዛወርን በዘመናዊ አማርኛ በግልጽ ያሳያል።
- source_word: τόν τε Παῦλον καί τινας ἑτέρους δεσμώτας
  choice: ጳውሎስንና ሌሎች አንዳንድ እስረኞችን
  rationale: τε…καί ያለውን አያያዥ አወቃቀርና τινας የሚያሳየውን ያልተወሰነ ቁጥር ይጠብቃል።
- source_word: ἑκατοντάρχῃ ὀνόματι Ἰουλίῳ
  choice: ዩልዮስ ለሚባል የመቶ አለቃ
  rationale: የተቀባዩን የዳቲቭ ሚና እና የስም ማስተዋወቂያውን በተፈጥሯዊ የአማርኛ አወቃቀር ያቀርባል።
- source_word: σπείρης Σεβαστῆς
  choice: የአውግስጦስ ጭፍራ
  rationale: Σεβαστή ከአውግስጦስ/ከንጉሠ ነገሥቱ ማዕረግ ጋር ያለውን ቀጥተኛ የቃል ግንኙነት ይጠብቃል፤ የታሪካዊው ወታደራዊ ክፍል ትክክለኛ ማንነት ግን በማስታወሻ ተገልጿል።
theological_decisions:
- issue: σπείρης Σεβαστῆς የተባለው አጠራር ትክክለኛ ታሪካዊ ማጣቀሻ
  choice: የአውግስጦስ ጭፍራ
  alternative: የንጉሠ ነገሥቱ ጭፍራ፤ ወይም የሴባስቴ ጭፍራ
  rationale: ጉዳዩ በቀጥታ ዶክትሪናዊ አይደለም፤ ሆኖም ዋናው ጽሑፍ የግሪኩን ቅርጽ በቅርብ ያስተላልፋል፣ ያልተረጋገጠውን ታሪካዊ መለያ ግን በእርግጠኝነት አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ዩልዮስ” የግሪኩን Ἰούλιος በቅርብ የሚከተል የስም አጻጻፍ ነው፤ “ጭፍራ” ደግሞ σπεῖρα የሚያመለክተውን የወታደር ክፍል በሚነበብ መልኩ ያቀርባል።
