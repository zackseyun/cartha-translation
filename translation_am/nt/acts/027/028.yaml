  yaml_path: translation/nt/acts/027/028.yaml
  text: And after taking soundings[a], they found twenty fathoms; then after going a little farther and taking soundings again, they found fifteen fathoms.
translation:
  language: am
  text: የውኃውን ጥልቀት ለክተው[a] ሃያ ፋቶም[b] መሆኑን አገኙ፤ ጥቂት ርቀት ከሄዱ በኋላም ደግመው ለክተው አሥራ አምስት ፋቶም መሆኑን አገኙ።
  philosophy: optimal-equivalence
  footnotes:
