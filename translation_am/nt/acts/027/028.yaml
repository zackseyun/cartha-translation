    text: ቃል በቃል፣ “የእርሳስ ክብደት ጥለው።” የግሪክኛው ቃል ክብደት የታሰረበትን ገመድ ወደ ውኃ በመጣል የባሕሩን ጥልቀት መለካትን ያመለክታል።
