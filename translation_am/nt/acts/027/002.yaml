    issue: “ለመዞር” renders μέλλοντι πλεῖν.
    rationale: In modern Amharic this means “to turn” or “to turn around,” whereas πλεῖν means “to sail.” The ship's intended voyage must be stated explicitly.
  - severity: medium
    issue: The phrase for the destinations lacks an explicit directional “to.”
    rationale: εἰς governs the destinations. “ወደ እስያ ዳርቻ ወደሚገኙ ስፍራዎች” clearly represents movement toward those places.
