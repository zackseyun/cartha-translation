  text: εἶπεν ὁ Παῦλος τῷ ἑκατοντάρχῃ καὶ τοῖς στρατιώταις· Ἐὰν μὴ οὗτοι μείνωσιν ἐν τῷ πλοίῳ, ὑμεῖς σωθῆναι οὐ δύνασθε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/031.yaml
  text: Paul said to the centurion and the soldiers[a], “Unless these men remain in the ship, you cannot be saved.”
translation:
  language: am
  text: ጳውሎስ የመቶ አለቃውንና ወታደሮቹን፣ “እነዚህ ሰዎች በመርከቡ ውስጥ ካልቆዩ፣ እናንተ ልትድኑ[a] አትችሉም” አላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ልትተርፉ።” ግሪክኛው “ልትድኑ” ይላል፤ እዚህ ግን በሕይወት መትረፍን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: የመቶ አለቃውን
  rationale: የሮማውያንን ወታደራዊ ማዕረግ በአማርኛ መጽሐፍ ቅዱሳዊና የተለመደ አገላለጽ ያስተላልፋል።
- source_word: οὗτοι
  choice: እነዚህ ሰዎች
  rationale: አመልካች ቃሉ መርከቡን ለቀው ለመውጣት የሞከሩትን መርከበኞች ያመለክታል፤ «ሰዎች» መጨመሩ በአማርኛ ማጣቀሻውን ግልጽ ያደርገዋል።
- source_word: μείνωσιν
  choice: ካልቆዩ
  rationale: μένω የሚያመለክተውን ‘መቆየት’ በተፈጥሯዊ የአማርኛ ሁኔታዊ አገባብ ያቀርባል።
- source_word: πλοίῳ
  choice: በመርከቡ
  rationale: በትረካው ውስጥ πλοῖον ትልቅ የባሕር መጓጓዣ መርከብን ስለሚያመለክት «መርከብ» ከ«ጀልባ» ይበልጥ ትክክለኛ ነው።
- source_word: σωθῆναι
  choice: መዳን
  rationale: የግሪክኛውን ሰፊ የ‘መዳን’ ትርጉም ይጠብቃል፤ በዚህ አውድ ግን ከመርከብ አደጋ በሕይወት መትረፍን ያመለክታል።
- source_word: οὐ δύνασθε
  choice: አትችሉም
  rationale: አሉታዊውን የችሎታ ግስ በቀጥተኛና ተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: σωθῆναι በግልጽ አካላዊ የማዳን ቃል ይተርጎም ወይስ ሰፊው «መዳን» ይጠበቅ?
  choice: መዳን
  alternative: ከአደጋ መትረፍ
  rationale: አውዱ የሚናገረው ስለ አካላዊ ሕልውና መጠበቅ እንጂ ስለ ዘላለማዊ ድነት አይደለም። ሆኖም «መዳን» የምንጩን ቃላዊ ስፋት ይጠብቃል፤ የታሰበው ልዩ ትርጉምም በአውዱና በእግር ማስታወሻው ይገለጻል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለው የትረካ ቋንቋ ይጠቀማል። የሮማውያን ወታደራዊ ማዕረግ «የመቶ አለቃ» ተብሎ ተተርጉሟል፤ «መዳን» የሚለው ቃል የምንጩን ሰፊ አገላለጽ ሲጠብቅ አውዱ አካላዊ መትረፍን እንደሚመለከት በማስታወሻ ተብራርቷል።
