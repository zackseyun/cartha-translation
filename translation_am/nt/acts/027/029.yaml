  language: am
  text: በድንጋያማ ስፍራዎች ላይ እንዳንጋጭ ፈርተው፣ ከመርከቡ የኋላ ክፍል አራት መልሕቆችን ጣሉና እንዲነጋ ይጸልዩ ነበር።[a]
  philosophy: optimal-equivalence
  footnotes:
