lexical_decisions:
- source_word: φοβούμενοί
  choice: ፈርተው
  rationale: የተከተሉትን ድርጊቶች ምክንያትና ሁኔታ የሚገልጠውን የግሪኩን አሳታፊ ግስ በተፈጥሯዊ የአማርኛ ትስስር ያቀርባል።
- source_word: μή που κατὰ τραχεῖς τόπους ἐκπέσωμεν
  choice: ድንጋያማ ስፍራ ላይ እንዳንጋጭ
  rationale: በመርከብ ጉዞ አውድ መርከቡ በአደገኛና ሸካራ የባሕር ዳርቻ ወይም ድንጋይ ላይ እንዳይደርስ ያለውን ስጋት ይገልጣል፤ ከግሪኩ በላይ የቦታውን ባሕርይ አይወስንም።
- source_word: ἐκ πρύμνης
  choice: ከመርከቡ ท้ายባ
  rationale: πρύμνα የመርከብን የኋላ ክፍል ያመለክታል፤ ለዘመናዊ አንባቢ ግልጽ በሆነ የመርከብ ቃል ተተርጉሟል።
- source_word: ῥίψαντες ἀγκύρας τέσσαρας
  choice: አራት መልሕቆችን ጣሉና
  rationale: ከዋናው ግስ በፊት የተፈጸመውን ተግባር ያሳያል፤ ‘መልሕቅ መጣል’ በአማርኛ ተፈጥሯዊ አገላለጽ ነው።
- source_word: ηὔχοντο
  choice: ይጸልዩ ነበር
  rationale: εὔχομαι በዚህ አውድ ‘መጸለይ’ የሚለውን ትርጉም ይይዛል፤ የግሪኩ ያልተጠናቀቀ ጊዜ የቀጠለውን ድርጊት በ‘ይጸልዩ ነበር’ ያሳያል።
- source_word: ἡμέραν γενέσθαι
  choice: ቀን እንዲሆን
  rationale: የግሪኩን ‘ቀን እንዲሆን’ የሚለውን ቀጥተኛ ምስል ይጠብቃል፤ ትርጉሙ የንጋት ብርሃን እንዲመጣ መጠበቃቸው ነው።
