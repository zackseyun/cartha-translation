  terminology: “ሙሴ” is the established Amharic biblical name. “እግዚአብሔር” and “በእግዚአብሔር ፊት” appropriately preserve the explicit divine reference without doctrinal expansion. “ውብ” is a suitable primary rendering for ἀστεῖος; the footnote preserves reasonable alternatives.
