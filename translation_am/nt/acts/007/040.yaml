  text: εἰπόντες τῷ Ἀαρών· Ποίησον ἡμῖν θεοὺς οἳ προπορεύσονται ἡμῶν· ὁ γὰρ Μωϋσῆς οὗτος, ὃς ἐξήγαγεν ἡμᾶς ἐκ γῆς Αἰγύπτου, οὐκ οἴδαμεν τί ⸀ἐγένετο αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/040.yaml
  text: saying to Aaron[a], ‘Make gods for us who will go before us, for this Moses[b], who led us out from the land of Egypt—we do not know what has happened to him.’
translation:
  language: am
  text: ለአሮን፣ “ከፊታችን የሚሄዱ አማልክትን[a] ሥራልን፤ ከግብፅ ምድር ያወጣን ይህ ሙሴ ምን እንደ ደረሰበት አናውቅምና” አሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ጣዖታትን።” የግሪኩ ቃል በቀጥታ “አማልክትን” ማለት ሲሆን፣ የዘፀአትን ዘገባ አነጋገር ያስተጋባል።
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰπόντες τῷ Ἀαρών
  choice: አሮንንም … አሉት
  rationale: የግሪኩን ቦዝ አንቀጽ በተፈጥሯዊ የአማርኛ ቀጥተኛ ንግግር አወቃቀር ያቀርባል፤ የንግግሩ ተቀባይ አሮን መሆኑንም ያሳያል።
- source_word: Ποίησον ἡμῖν
  choice: ሥራልን
  rationale: ትእዛዛዊውን ‘ሥራ’ እና ተጠቃሚውን ‘ለእኛ’ በተለመደ የአማርኛ ግስ ቅጥ ያጣምራል።
- source_word: θεοὺς
  choice: አማልክትን
  rationale: ቃሉ በቀጥታ ‘አማልክት’ ማለት ነው፤ ሕዝቡ ራሱ ያቀረበውን ጥያቄ በ‘ጣዖታት’ በሚል ትርጓሜያዊ ስያሜ አይተካም።
- source_word: οἳ προπορεύσονται ἡμῶν
  choice: ከፊታችን የሚሄዱ
  rationale: ‘ከፊት መሄድ’ የሚለውን የግሱን ግልጽ የእንቅስቃሴ ትርጉም ይጠብቃል፤ ‘የሚመሩን’ የሚለውን ተጨማሪ ፍቺ አያስገባም።
- source_word: ὁ γὰρ Μωϋσῆς οὗτος
  choice: ይህ ሙሴ … አናውቅምና
  rationale: οὗτοςን ‘ይህ’ ብሎ በመተርጎም የማራቅ ድምፁን ይጠብቃል፤ γάρ የሚያሳየውን ምክንያት በአማርኛው ተፈጥሯዊ ‘-ና’ ያሳያል።
- source_word: ἐξήγαγεν ἡμᾶς ἐκ γῆς Αἰγύπτου
  choice: ከግብፅ ምድር ያወጣን
  rationale: የመውጣቱን እንቅስቃሴና γῆς የሚለውን ‘ምድር’ ጨምሮ ይጠብቃል።
- source_word: οὐκ οἴδαμεν τί ἐγένετο αὐτῷ
  choice: ምን እንደሆነ አናውቅም
  rationale: በዘመናዊ አማርኛ ተፈጥሯዊ ሆኖ ‘ምን እንደደረሰበት/ምን እንደሆነ’ የሚለውን ፍቺ ያስተላልፋል።
theological_decisions:
- issue: በጣዖት አምልኮ አውድ θεοὺςን መተርጎም
  choice: አማልክት
  alternative: ጣዖታት
  rationale: የግሪኩ ጽሑፍ ሕዝቡ የጠየቀውን በθεοὺς፣ ማለትም ‘አማልክት’ ይገልጻል። ይህን በዋናው ጽሑፍ ‘ጣዖታት’ ብሎ መተካት የጽሑፉን ቃልና ሥነ መለኮታዊ ውጥረት በትርጓሜ ይፈታዋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ቀጥተኛው ንግግር በአማርኛ ተፈጥሯዊ እንዲሆን εἰπόντες በመጨረሻው ‘አሉት’ ተገልጿል፤ γάρም በ‘አናውቅምና’ ተወክሏል።
