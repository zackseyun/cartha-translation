  rationale: ትርጉሙ የእስጢፋኖስን ንግግር ማስተካከል ሳይሞክር በጽሑፉ ያለውን ቅደም ተከተል ይጠብቃል፤ ተዛማጅ ምንባቦቹ በማስታወሻ ተጠቅሰዋል።
