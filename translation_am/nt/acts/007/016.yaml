- source_word: ᾧ
  choice: በነበረው
  rationale: አንጻራዊውን ተውላጠ ስም ከ‘መቃብር’ ጋር በተፈጥሯዊ የአማርኛ አንቀጽ ያያይዛል።
- source_word: ὠνήσατο
  choice: ገዝቶት
  rationale: ‘ገዛ’ የሚለውን ቀጥተኛ ትርጉም ይሰጣል፤ ድርጊቱ ከቀብሩ በፊት መፈጸሙን ‘ገዝቶት በነበረው’ የሚለው አወቃቀር ያሳያል።
- source_word: τιμῆς ἀργυρίου
  choice: በብር ዋጋ
  rationale: ዋጋው በብር መከፈሉን የግሪኩን አገላለጽ በቅርብ ሁኔታ ይጠብቃል።
- source_word: παρὰ τῶν υἱῶν Ἑμμὼρ
  choice: ከሐሞር ልጆች
  rationale: παρά ከባለቤትነት ወይም ከምንጭ አንጻር ‘ከ’ ማለት ሲሆን፣ ሐረጉ ሻጮቹን በግልጽ ይጠቁማል።
- source_word: ἐν Συχέμ
  choice: በሴኬም ባለው
  rationale: የመጨረሻውን የቦታ ሐረግ ይጠብቃል፤ በአማርኛ ሰዋስው ምክንያት ከመቃብሩ ጋር በቀጥታ ቢያያዝም፣ የግዢው ቦታ ሴኬም መሆኑን አይቀይርም።
