  rationale: የአባቶች አፅም ከአንድ ስፍራ ወደ ሌላ መዛወሩን በተፈጥሯዊ አማርኛ ይገልጣል፤ የግሪኩን ተገብሮ አድራጊ ቅርጽም ይጠብቃል።
- source_word: Συχὲμ / Συχέμ
