  rationale: ትርጉሙ የግሪክ ጽሑፉን እንዳለ ያቀርባል እንጂ የዘፍጥረትን ዘገባዎች በዋናው ጽሑፍ ውስጥ በማስገባት ውጥረቱን አያስወግድም፤ ለአንባቢ የሚያስፈልገው ማብራሪያ በግርጌ ማስታወሻ ተጠብቋል።
