base_translation:
  language: en
  yaml_path: translation/nt/acts/007/034.yaml
  text: I have surely seen the mistreatment of my people in Egypt[a], and I have heard their groaning, and I have come down to deliver them. And now come[b], I will send you to Egypt.
translation:
  language: am
  text: “በግብፅ ባለው ሕዝቤ ላይ የሚደርሰውን ግፍ[a] በእርግጥ አይቻለሁ፤ ማቃሰታቸውንም ሰምቻለሁ፤ እነርሱንም ለማዳን[b] ወርጃለሁ። አሁንም ና፤ ወደ ግብፅ እልክሃለሁ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “መከራ” ወይም “ጭቆና።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ነፃ ለማውጣት።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν εἶδον
  choice: በእርግጥ አይቻለሁ
  rationale: የግሪክኛውን አጽንዖት በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል፤ ቃል በቃል ‘አይቼ አየሁ’ ማለት በአማርኛ ያልተለመደ ነው።
- source_word: κάκωσιν
  choice: የሚደርስባቸውን ግፍ
  rationale: ቃሉ ጨካኝ አያያዝን፣ መከራን ወይም ጭቆናን ሊያመለክት ይችላል፤ ‘ግፍ’ የተሳሳተና ከባድ አያያዝ መሆኑን በግልጽ ያሳያል።
- source_word: λαοῦ μου
  choice: ሕዝቤ
  rationale: የባለቤትነት ቅጥያውንና የቃሉን ሕዝባዊ/የቃል ኪዳን ድምፅ በቀጥታ ይጠብቃል።
- source_word: στεναγμοῦ αὐτοῦ
  choice: ጩኸታቸውን
  rationale: ነጠላው የግሪክኛ ተውላጠ ስም ሕዝቡን በኅብረት ያመለክታል፤ ብዙ ቁጥር በአማርኛ ተፈጥሯዊ ነው። ‘ጩኸት’ ከመከራ የሚነሳውን የምሬት ድምፅ ያስተላልፋል።
- source_word: κατέβην
  choice: ወርጃለሁ
  rationale: ስለ መለኮታዊ መውረድ ያለውን ሰውኛ አገላለጽ ሳይተረጉም ወይም ሳያለዝብ ይጠብቃል።
- source_word: ἐξελέσθαι
  choice: ለማዳን
  rationale: በዚህ አውድ ከአደጋና ከጭቆና ማውጣትን ያመለክታል፤ ‘ለማዳን’ ግልጽና ዘመናዊ ነው።
- source_word: δεῦρο
  choice: ና
  rationale: ሙሴን ወደፊት የሚጠራውን አጭር የትእዛዝ አገላለጽ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀποστείλω σε εἰς Αἴγυπτον
  choice: ወደ ግብፅ እልክሃለሁ
  rationale: የወደፊት ጊዜውን ቀጥተኛ የተልእኮ ንግግር እና የመድረሻውን አቅጣጫ ይጠብቃል።
theological_decisions:
- issue: ስለ እግዚአብሔር መውረድ ያለው ሰውኛ አገላለጽ
  choice: ወርጃለሁ
  alternative: ለማዳን ጣልቃ ገብቻለሁ
  rationale: ዋናው ጽሑፍ መለኮታዊውን ድርጊት ‘መውረድ’ በሚለው ምስላዊ ንግግር ያቀርባል። ትርጉሙ ይህን አገላለጽ በማብራሪያ አይተካውም።
- issue: ἐξελέσθαι የሚያመለክተው የማዳን ድርጊት
  choice: ለማዳን
  alternative: ነፃ ለማውጣት
  rationale: ‘ለማዳን’ ከግፍና ከአደጋ ማስጣልን ይገልጻል፤ የመንፈሳዊ ድነት ትርጉም ብቻ እንዳይጫንበት የአውዱ አካላዊና ማኅበራዊ ትርጉም በማስታወሻው ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። የመለኮታዊ ንግግሩ አጽንዖትና ምስላዊ ቋንቋ ተጠብቀዋል።
