  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። የቀጣይ ድርጊት ገጽታው «ይወግሩት ነበር» በሚለው ተጠብቋል፤ የግሪኩ ሰፊ የልብስ ትርጉምም በዋናው ጽሑፍና በማስታወሻው ተንጸባርቋል።
