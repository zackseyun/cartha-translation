base_translation:
  language: en
  yaml_path: translation/nt/acts/007/058.yaml
  text: And after they had driven him out of the city[a], they were stoning him. And the witnesses laid their outer garments at the feet of a young man called Saul.
translation:
  language: am
  text: ከተማው ውጭ ካስወጡት በኋላ በድንጋይ ይወግሩት ነበር። ምስክሮቹም የላይ ልብሶቻቸውን[a] ሳውል በሚባል አንድ ወጣት ሰው እግሮች አጠገብ አኖሩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ልብሶቻቸውን” ወይም “መደረቢያዎቻቸውን”፤ የግሪኩ ቃል በሰፊው የውጭ ልብስን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλόντες
  choice: ካስወጡት በኋላ
  rationale: የግሪኩ የአኦሪስት አንቀጽ ከዋናው ግስ በፊት የተፈጸመን ድርጊት ያሳያል፤ ይህ አተረጓጎም ቅደም ተከተሉንና የግዳጅ ማስወጣቱን ይጠብቃል።
- source_word: ἔξω τῆς πόλεως
  choice: ከከተማው ወደ ውጭ
  rationale: ከከተማው ውስጥ ወደ ውጭ የሆነውን እንቅስቃሴ በግልጽ ያሳያል።
- source_word: ἐλιθοβόλουν
  choice: በድንጋይ ይወግሩት ነበር
  rationale: የግሪኩ ያልተጠናቀቀ ግስ ድርጊቱ በዚያን ጊዜ ቀጥሎ እንደነበር ያሳያል።
- source_word: οἱ μάρτυρες
  choice: ምስክሮቹ
  rationale: በዚህ የፍርድና የቅጣት አውድ ቃሉ በሕጋዊ ሂደቱ ምስክርነት የሰጡትን ሰዎች ያመለክታል።
- source_word: ἀπέθεντο
  choice: አኖሩ
  rationale: ልብሶቹን አውልቀው በአንድ ቦታ ማስቀመጣቸውን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τὰ ἱμάτια αὐτῶν
  choice: የላይ ልብሶቻቸውን
  rationale: ἱμάτια በሰፊው የውጭ ወይም የላይ ልብስን ሊያመለክት ስለሚችል፣ ይህ ምርጫ ከ«መደረቢያ» የበለጠ ሰፊ ሆኖ ከ«ልብስ»ም የበለጠ ግልጽ ነው።
- source_word: παρὰ τοὺς πόδας
  choice: እግር አጠገብ
  rationale: እቃውን በሰውየው እግር አጠገብ ማኖራቸውን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: νεανίου
  choice: አንድ ወጣት
  rationale: ቃሉ በአንጻራዊነት ወጣት የሆነን ወንድ ያመለክታል፤ «ወጣት» በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: καλουμένου Σαύλου
  choice: ሳውል በሚባል
  rationale: የሰውየውን ስም በቀጥታና በተለመደ የአማርኛ አገላለጽ ያቀርባል።
