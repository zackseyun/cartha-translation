  text: ὃς εὗρεν χάριν ἐνώπιον τοῦ θεοῦ καὶ ᾐτήσατο εὑρεῖν σκήνωμα τῷ ⸀θεῷ Ἰακώβ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/046.yaml
  text: who found favor before God and asked to find a dwelling place for the God of Jacob[a].
translation:
  language: am
  text: እርሱም በእግዚአብሔር ፊት ሞገስን አግኝቶ፣ ለያዕቆብ አምላክ ማደሪያ ለማግኘት ጠየቀ[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ለያዕቆብ አምላክ ድንኳን ለማግኘት።»
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρεν χάριν
  choice: ሞገስን አግኝቶ
  rationale: የግሪኩ ፈሊጣዊ አነጋገር አንድ ሰው ተቀባይነትና በጎ ፈቃድ ማግኘቱን ያመለክታል፤ «ሞገስን አግኝቶ» ይህን ግንኙነታዊ ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: በእግዚአብሔር ፊት
  rationale: ἐνώπιον ከጀኒቲቭ ጋር «በፊት» ወይም «በዓይን ፊት» የሚለውን ያመለክታል፤ የተመረጠው አገላለጽ አጭር፣ ክቡርና በቅዱሳት መጻሕፍት አማርኛ የተለመደ ነው።
- source_word: ᾐτήσατο
  choice: ጠየቀ
  rationale: የመካከለኛው ድምፅ ቅርጽ ጥያቄ ወይም ልመና ማቅረብን ያሳያል፤ «ጠየቀ» ያለ አላስፈላጊ ሥርዓታዊነት ግልጽ ነው።
- source_word: εὑρεῖν
  choice: ለማግኘት
  rationale: ቃሉ በቀጥታ «ማግኘት» ማለት ነው። ዐውደ ንባቡ ማዘጋጀትን ወይም ማስገኘትን ሊያመለክት ቢችልም፣ ትርጉሙ የግሪኩን አገላለጽ እንዳይጠብብ «ለማግኘት» ተብሏል።
- source_word: σκήνωμα
  choice: ማደሪያ
  rationale: σκήνωμα መኖሪያን፣ ማደሪያን ወይም ድንኳን መሰል ማደሪያን ሊያመለክት የሚችል ሰፊ ቃል ነው። «ማደሪያ» በዘመናዊ አማርኛ ግልጽ ሲሆን ቃሉን ያለጊዜው ወደ ድንኳን ወይም ቤተ መቅደስ አያጠብበውም።
- source_word: τῷ θεῷ Ἰακώβ
  choice: ለያዕቆብ አምላክ
  rationale: ዳቲቩ በአማርኛ «ለ» በሚለው ቅድመ ቅጥያ ተፈጥሯዊ ሆኖ ይተረጎማል፤ «የያዕቆብ አምላክ» የቃል ኪዳን አጠራሩን ይጠብቃል።
theological_decisions:
- issue: ዳዊት የጠየቀው ሕንፃ ምንነትና የσκήνωμα ዋቢ
  choice: «ማደሪያ» ተብሎ ሰፊው ትርጉም በዋናው ጽሑፍ ተጠብቋል።
  alternative: «ድንኳን» ወይም «ቤት» ተብሎ ወደ አንድ የተወሰነ መዋቅር ማጥበብ።
  rationale: ግሪኩ σκήνωμα በቀጣዩ ቁጥር ከሚጠቀሰው የሰሎሞን «ቤት» ይልቅ ሰፊ ነው። ስለዚህ «ማደሪያ» የእስጢፋኖስን የታሪክ አጠቃለልና በድንኳንና በቤተ መቅደስ መካከል ያለውን የትርጉም ውጥረት ሳይፈታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «እርሱም» ከቀደመው ዐውድ ጋር ያለውን አንጻራዊ አረፍተ ነገር ያገናኛል፤ የግሪኩ ቅደም ተከተልና አሻሚነት በተቻለ መጠን ተጠብቋል።
