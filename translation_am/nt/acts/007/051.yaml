  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘አንገተ ደንዳኖች’ እና ‘ያልተገረዙ’ የሚሉት ጠንካራ ነቢያዊ ምሳሌዎች ሳይለሰልሱ ተጠብቀዋል፤ የንግግሩ ቀጥተኛ የብዙ ቁጥር አድራሻም በ‘እናንተ’ እና በብዙ ቁጥር ግሶች ተገልጿል።
