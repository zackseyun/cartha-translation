base_translation:
  language: en
  yaml_path: translation/nt/acts/007/051.yaml
  text: You stiff-necked people[a], uncircumcised in hearts and ears, you always resist the Holy Spirit; as your fathers did, so do you.
translation:
  language: am
  text: እናንተ አንገተ ደንዳኖች፣ በልባችሁና በጆሮአችሁ ያልተገረዛችሁ፣ ሁልጊዜ መንፈስ ቅዱስን ትቃወማላችሁ፤ አባቶቻችሁ[a] እንዳደረጉት እናንተም እንዲሁ ታደርጋላችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ቀደምቶቻችሁ።” ግሪክ፦ “አባቶቻችሁ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σκληροτράχηλοι
  choice: አንገተ ደንዳኖች
  rationale: የግሪኩን ግልጽ የአንገት ምሳሌያዊ አገላለጽና ከብሉይ ኪዳን ጋር ያለውን ትስስር ይጠብቃል፤ ‘ግትሮች’ ብሎ ትርጉሙን ብቻ አያቀርብም።
- source_word: ἀπερίτμητοι καρδίαις καὶ τοῖς ὠσίν
  choice: ልባችሁና ጆሮአችሁ ያልተገረዙ
  rationale: የግርዛትን የቃል ኪዳን ምሳሌ ጠብቆ፣ ልብንና ጆሮን በማጣመር ውስጣዊ እምቢተኝነትንና ለመስማት አለመፈለግን ያሳያል።
- source_word: ἀεὶ
  choice: ሁልጊዜ
  rationale: ድርጊቱ በቀጣይነት የሚደጋገም ባሕርይ መሆኑን በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: መንፈስ ቅዱስን
  rationale: በሐዋርያት ሥራ አውድ የግሪኩን የታወቀ መለኮታዊ ማጣቀሻ በመደበኛው የአማርኛ አጠራር ይገልጻል።
- source_word: ἀντιπίπτετε
  choice: ትቃወማላችሁ
  rationale: በንቃት መቃወምን ያሳያል፤ ቃሉን ከሚፈቅደው በላይ አያሰፋውም።
- source_word: οἱ πατέρες ὑμῶν
  choice: አባቶቻችሁ
  rationale: የግሪኩን ወንዳዊ የዝምድና ቃልና የእስጢፋኖስን የክስ ኃይል ይጠብቃል፤ በዚህ አውድ የቀደሙትን ትውልዶችም ያመለክታል።
- source_word: ὡς … καὶ ὑμεῖς
  choice: እንዳደረጉት እናንተም እንዲሁ ታደርጋላችሁ
  rationale: በግሪኩ የተዘለለውን ግስ ከአውዱ በማሟላት ንጽጽሩን በተፈጥሯዊ አማርኛ ግልጽ ያደርጋል።
theological_decisions:
- issue: የ‘መንፈስ ቅዱስ’ ማጣቀሻ
  choice: እንደ ግለሰብ የሚሠራው መለኮታዊ መንፈስ ቅዱስ
  alternative: አጠቃላይ ቅዱስ ተጽዕኖ ወይም ዝንባሌ
  rationale: በሐዋርያት ሥራ አውድ ይህ የተወሰነ ሐረግ መንፈስ ቅዱስን በግለሰባዊ አድራጊነት ያመለክታል፤ ጽሑፉም መቃወም የሚቻለውን አድራጊ ያቀርባል።
- issue: የግርዛት የቃል ኪዳን ምሳሌ
  choice: ‘ያልተገረዙ’ የሚለውን ቀጥተኛ ምሳሌ መጠበቅ
  alternative: ‘ልባችሁ የተዘጋ፣ ጆሮአችሁም የደነቆረ’ የሚል ትርጓሜያዊ አቀራረብ
  rationale: ንግግሩ የነቢያትን የቃል ኪዳን ቋንቋ ሆን ብሎ ያስተጋባል፤ ምሳሌውን መጠበቅ ይህን መጽሐፍ ቅዱሳዊ ትስስርና የክሱን ጥንካሬ ያቆያል።
- issue: የወንድ ጾታ ያለው የቀደሙ ትውልዶች አጠራር
  choice: አባቶቻችሁ
  alternative: ቀደምቶቻችሁ
  rationale: ግሪኩ በቀጥታ ‘አባቶቻችሁ’ ይላል፤ ይህን መጠበቅ የምንጩን ቅርጽና የንግግሩን የዘር ትውልድ ንጽጽር ያቆያል፣ ሌላው ሊሆን የሚችለው አተረጓጎም ግን በማስታወሻ ቀርቧል።
