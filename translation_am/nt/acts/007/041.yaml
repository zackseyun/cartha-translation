  verdict: revise
  source_fidelity: The draft accurately represents the three coordinated actions, renders the specific object as «ጣዖቱ», and appropriately retains the imperfect sense in «ይደሰቱ ነበር». «የጥጃ ምስል» is a safe, idiomatic clarification of making a calf in this idolatry context. The final phrase, however, should preserve the plural «works» and «hands» more clearly.
  naturalness: The register is clear and suitably dignified. «በእጃቸውም ሥራ» is not fully natural as written and has an imprecise singular form; «በእጆቻቸው ሥራዎች» is grammatical, natural, and preserves the biblical rhetorical wording.
  terminology: «መሥዋዕት አቀረቡ» and «ጣዖት» are accurate and appropriate. Retaining «ሥራዎች» preserves the polemical allusion to human-made idols without adding doctrinal interpretation.
  issues:
  - severity: medium
    issue: The rendering of ἐν τοῖς ἔργοις τῶν χειρῶν αὐτῶν is singular and syntactically awkward.
    rationale: Greek has plural «works» and plural «hands». «በእጃቸውም ሥራ» can obscure both the possessive construction and the plural rhetorical image. Revising it to «በእጆቻቸው ሥራዎች» improves fidelity and modern Amharic usage.
  revised_text: በዚያም ዘመን የጥጃ ምስል ሠሩ[a]፤ ለጣዖቱም መሥዋዕት አቀረቡ፤ በእጆቻቸው ሥራዎችም ይደሰቱ ነበር[b]።
