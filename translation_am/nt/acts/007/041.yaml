  yaml_path: translation/nt/acts/007/041.yaml
  text: And in those days they made a calf and offered a sacrifice to the idol[b][a], and they were rejoicing in the works of their hands.
translation:
  language: am
  text: በዚያም ዘመን የጥጃ ምስል ሠሩ[a]፤ ለጣዖቱም መሥዋዕት አቀረቡ፤ በእጆቻቸው ሥራዎችም ይደሰቱ ነበር[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ጥጃ ቀረጹ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “እጆቻቸው በሠሩት ነገር ሐሤት ያደርጉ ነበር።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοσχοποίησαν
  choice: የጥጃ ምስል ሠሩ
  rationale: ግሱ ‘ጥጃ ሠሩ/ቀረጹ’ ማለት ነው። በአማርኛ ‘ጥጃ ሠሩ’ ሕያው ጥጃን እንደፈጠሩ ሊያሰማ ስለሚችል፣ ‘የጥጃ ምስል’ የተሠራውን ነገር በተፈጥሯዊና ግልጽ ሁኔታ ያሳያል።
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: በዚያም ዘመን
  rationale: የግሪኩን የጊዜ ማመልከቻ በዘመናዊና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἀνήγαγον θυσίαν
  choice: መሥዋዕት አቀረቡ
  rationale: በመሥዋዕታዊ አውድ ያለውን ‘አቀረቡ/ሠዉ’ የሚል ፍቺ ግልጽና የተለመደ በሆነ አገላለጽ ይሰጣል።
- source_word: τῷ εἰδώλῳ
  choice: ለጣዖቱ
  rationale: የተወሰነው መስተዋድድ ቀድሞ የተጠቀሰውን የጥጃ ምስል ያመለክታል፤ ‘ጣዖት’ ደግሞ የεἴδωλονን አሉታዊ የአምልኮ ኃይል ይጠብቃል።
- source_word: εὐφραίνοντο
  choice: ይደሰቱ ነበር
  rationale: ያልተጠናቀቀውን የግሪክ ግስ ገጽታ በአማርኛ ቀጣይ የነበረ ድርጊት አድርጎ ያሳያል።
- source_word: ἐν τοῖς ἔργοις τῶν χειρῶν αὐτῶν
  choice: በእጃቸውም ሥራ
  rationale: ‘የእጆቻቸው ሥራ’ የሚለውን መጽሐፍ ቅዱሳዊ የጣዖት አምልኮ ነቀፋ ምስል በታመቀና ተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: የጣዖት አምልኮ ቃላትና የነቀፋው ኃይል
  choice: εἴδωλονን ‘ጣዖት’ ብሎ መተርጎምና ‘በእጃቸው ሥራ’ የሚለውን ምስል ማቆየት
  alternative: ‘ምስል’ ብቻ ማለት፤ ወይም ‘በሠሩት ነገር’ ብሎ ማለስለስ
  rationale: የእስጢፋኖስ ንግግር የእስራኤልን ጣዖት አምልኮ ይወቅሳል። ‘ጣዖት’ የቃሉን አሉታዊ ሃይማኖታዊ ኃይል ሲጠብቅ፣ ‘የእጅ ሥራ’ የነቢያትን የጣዖት ነቀፋ ያስተጋባል።
