  yaml_path: translation/nt/acts/007/057.yaml
  text: But crying out with a loud voice[a], they covered their ears and rushed together at him,
translation:
  language: am
  text: እነርሱ ግን በታላቅ ድምፅ ጮኹ፤ ጆሮዎቻቸውንም ደፈኑ፤ በአንድነትም[a] በእርሱ ላይ ተጣደፉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «አንድ ሆነው።» የግሪኩ ተውሳከ ግስ የተባበረ እርምጃቸውን ያጎላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξαντες
  choice: ጮኹ
  rationale: ቃሉ ከፍ ያለ ጩኸትን ያመለክታል። በአማርኛ የድርጊቶቹን ቅደም ተከተል በተፈጥሯዊ ትረካ ለማቅረብ «ጮኹ» ተመርጧል።
- source_word: δὲ
  choice: ግን
  rationale: ከእስጢፋኖስ ራእይ ወደ ሕዝቡ ተቃራኒ ምላሽ የሚደረገውን መጠነኛ የትረካ ለውጥ ያሳያል።
- source_word: φωνῇ μεγάλῃ
  choice: በታላቅ ድምፅ
  rationale: የግሪኩን ተጨባጭ አገላለጽ በተፈጥሯዊና በተለመደ አማርኛ ያቀርባል።
- source_word: συνέσχον τὰ ὦτα αὐτῶν
  choice: ጆሮዎቻቸውንም ደፈኑ
  rationale: ይህ አገላለጽ ላለመስማት ጆሮን መዝጋት ወይም መሸፈንን ያመለክታል፤ «ደፈኑ» ዓላማውን ሳያብራራ ድርጊቱን በግልጽ ያሳያል።
- source_word: ὥρμησαν
  choice: ተጣደፉ
  rationale: ግሱ ድንገተኛና ኃይለኛ የሆነ ወደፊት መንቀሳቀስን ያመለክታል፤ «ተጣደፉ» ይህን ሳያጋንን ያስተላልፋል።
- source_word: ὁμοθυμαδὸν
  choice: በአንድነትም
  rationale: ቃሉ የተባበረ ድርጊትንና የጋራ ዓላማን ያጎላል። «በአንድነት» በዘመናዊ አማርኛ ግልጽና አጭር ነው።
- source_word: ἐπ’ αὐτόν
  choice: በእርሱ ላይ
  rationale: ἐπί ከአኩዛቲቭ ጋር ሲመጣ ወደ ሰውየው የተመራውን እንቅስቃሴ ያሳያል፤ ከ«ተጣደፉ» ጋር «በእርሱ ላይ» የጥቃት አቅጣጫውን በተፈጥሯዊ አማርኛ ይገልጣል።
