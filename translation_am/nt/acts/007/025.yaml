  - severity: high
    issue: “አዳኝነትን” renders σωτηρίαν inaccurately.
    rationale: In modern Amharic, አዳኝነት normally denotes being a savior/saviorhood, whereas the Greek noun here denotes salvation, rescue, or deliverance given to Israel.
  - severity: medium
    issue: Footnote b begins with “መዳንን” as an alternative although the corrected main text should use that term.
    rationale: After correcting the main text, the note must not present its own main-text rendering as an alternative. It should identify ‘ነፃ ማውጣት’ or ‘ማዳን’ as contextual alternatives and explain the historical setting.
