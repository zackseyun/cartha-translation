  rationale: በዚህ ዐውደ ንባብ ἀναιρέω ሰውን ማጥፋት፣ ማለትም መግደልን ያመለክታል፤ የአማርኛው አገላለጽም የግሱን ድግግሞሽ ይጠብቃል።
- source_word: ὃν τρόπον
  choice: እንደ…ው
  rationale: ‘በዚያው መንገድ/እንደ’ የሚለውን የንጽጽር ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐχθὲς
  choice: ትናንት
  rationale: ቀጥተኛና ዘመናዊ የአማርኛ አቻ ቃል ነው።
- source_word: τὸν Αἰγύπτιον
  choice: ግብፃዊውን
  rationale: የተወሰነውን ግብፃዊ ሰው ያመለክታል፤ የአማርኛው -ው የግልጽነት ምልክቱን ይወክላል።
