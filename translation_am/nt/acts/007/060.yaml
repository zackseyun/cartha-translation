- source_word: μὴ στήσῃς αὐτοῖς ταύτην τὴν ἁμαρτίαν
  choice: ይህን ኃጢአት አትቁጠርባቸው
  rationale: እዚህ ἵστημι ኃጢአቱን በእነርሱ ላይ መቁጠር ወይም በእነርሱ ላይ ማስመዝገብ የሚል የፍርድ አውድ ያለው ትርጉም አለው። ‘ይህን’ የሚለው ταύτηνን በግልጽ ይጠብቃል።
- source_word: καὶ τοῦτο εἰπὼν
  choice: ይህንም ከተናገረ በኋላ
  rationale: የግሪኩ የቦዝ አንቀጽ የሚያሳየውን የጊዜ ቅደም ተከተል ተፈጥሯዊ በሆነ ዘመናዊ አማርኛ ያቀርባል።
- source_word: ἐκοιμήθη
  choice: አንቀላፋ
  rationale: ግሪኩ ለሞት የተለመደውን የእንቅልፍ ዘይቤ ይጠቀማል፤ ‘አንቀላፋ’ ይህን ዘይቤ ከ‘ሞተ’ በማለት ሳያጠፋ ይጠብቃል።
