lexical_decisions:
- source_word: θεὶς δὲ τὰ γόνατα
  choice: ከዚያም ተንበርክኮ
  rationale: የግሪኩ ፈሊጣዊ አነጋገር ቃል በቃል ‘ጉልበቶቹን አኖረ’ ሲሆን ተፈጥሯዊው የአማርኛ አቻ ‘ተንበርክኮ’ ነው፤ δέ የትረካውን ቀጣይነት ‘ከዚያም’ በማለት ያሳያል።
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: በታላቅ ድምፅ ... ጮኸ
  rationale: κράζω ከፍ ያለ ጩኸትን ያመለክታል፤ φωνῇ μεγάλῃ የሚለውም አጽንዖት በግልጽ ተጠብቋል።
- source_word: Κύριε
