  text: ከዚያም ተንበርክኮ በታላቅ ድምፅ፣ “ጌታ ሆይ፣ ይህን ኃጢአት በእነርሱ ላይ አትቁጠር” ብሎ ጮኸ። ይህንም ከተናገረ በኋላ አንቀላፋ።[a]
  philosophy: optimal-equivalence
