  yaml_path: translation/nt/acts/007/045.yaml
  text: which our fathers in turn brought in with Joshua at the dispossession of the nations that God drove out from before our fathers[b][a], until the days of David.
translation:
  language: am
  text: አባቶቻችንም ያንን ድንኳን ከቀደሙት ተረክበው[b]፣ ከኢያሱ ጋር[a] እግዚአብሔር ከአባቶቻችን ፊት ያስወጣቸው ሕዝቦች ከምድራቸው ተወግደው ምድሪቱ በተያዘበት ጊዜ ወደ ምድሪቱ አስገቡት፤ ይህም እስከ ዳዊት ዘመን ድረስ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክኛ “ከኢየሱስ ጋር” ይላል፤ Ἰησοῦς የሚለው ስም ኢየሱስንም ሆነ ኢያሱን ሊያመለክት ይችላል። እዚህ የሚያመለክተው የነዌ ልጅ ኢያሱን ነው።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ “በተራቸው ተቀብለው”። የግሪክኛው ቃል ከቀደመው ትውልድ ወደ ተከታዩ ትውልድ በተራ መተላለፉን ያጎላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν
  choice: ይህን ድንኳን
  rationale: አንስታይ ነጠላው አንጻራዊ ተውላጠ ስም በቁጥር 44 የተጠቀሰውን የምስክር ድንኳን ያመለክታል። በአማርኛ ማጣቀሻውን ግልጽ ለማድረግ ስሙ ተደግሟል።
- source_word: εἰσήγαγον
  choice: ወደ ምድሪቱ አስገቡት
  rationale: ግሱ ወደ ውስጥ ማስገባትን ወይም ይዞ መግባትን ያመለክታል፤ የመድረሻ ቦታው ከአውዱ በተፈጥሯዊ አማርኛ ግልጽ ተደርጓል።
- source_word: διαδεξάμενοι
  choice: በተራቸው ተቀብለው
  rationale: ቃሉ ከቀደሙት ተቀብሎ በትውልድ ቅደም ተከተል መተካትን ያሳያል፤ ሁለቱም የመቀበልና የተከታታይነት ሐሳቦች ተጠብቀዋል።
- source_word: οἱ πατέρες ἡμῶν
  choice: አባቶቻችን
  rationale: የእስጢፋኖስን የቃል ድግግሞሽና የቃል ኪዳን ታሪካዊ አገላለጽ ይጠብቃል።
- source_word: μετὰ Ἰησοῦ
  choice: ከኢያሱ ጋር
  rationale: የግሪክኛው ስም ኢየሱስንም ኢያሱንም ሊያመለክት ቢችልም፣ የምድሪቱ መወረስ ታሪካዊ አውድ የነዌን ልጅ ኢያሱን በግልጽ ያመለክታል።
- source_word: ἐν τῇ κατασχέσει τῶν ἐθνῶν
  choice: ሕዝቦችን ምድር ሲወርሱ
  rationale: κατάσχεσις መያዝን ወይም ርስት አድርጎ መውረስን ያመለክታል። የሕዝቦቹ ‘ምድር’ በአውዱ የተገነዘበ ነው፤ ይህ አተረጓጎም ሕዝቦቹን ራሳቸው እንደ ንብረት ከማቅረብ ይቆጠባል።
- source_word: ὧν ἐξῶσεν ὁ θεὸς ἀπὸ προσώπου τῶν πατέρων ἡμῶν
  choice: እግዚአብሔር ከአባቶቻችን ፊት ያስወጣቸውን ሕዝቦች
  rationale: ἐξωθέω በኃይል ማስወጣትን ያመለክታል፤ “ከፊት” የሚለውም ሴማዊ ቅርጽ ሳይከብድ ተጠብቋል።
- source_word: ἕως τῶν ἡμερῶν Δαυίδ
  choice: እስከ ዳዊት ዘመን ድረስ
  rationale: የጊዜውን ወሰን በቀጥታ ያስተላልፍና ከሚቀጥለው ቁጥር ጋር ያገናኛል።
theological_decisions:
- issue: የἸησοῦ ማጣቀሻ
  choice: ኢያሱ
  alternative: ኢየሱስ
  rationale: የሙሴ ተከታይነትና ወደ ምድሪቱ የመግባት አውድ የነዌን ልጅ ኢያሱን ያመለክታል፤ የግሪክኛው የስም አሻሚነት በማስታወሻ ተገልጧል።
- issue: የδιαδεξάμενοι ኃይል
  choice: አባቶቻችን ድንኳኑን ከቀደሙት ተቀብለው በትውልድ ተከታትለው አመጡት
