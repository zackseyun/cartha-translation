- issue: ἕως τῶν ἡμερῶν Δαυίδ ከዓረፍተ ነገሩ ጋር ያለው ግንኙነት
  choice: ድንኳኑ እስከ ዳዊት ዘመን በዚያ መቆየቱ
  alternative: የማስገባቱ ተግባር እስከ ዳዊት ዘመን መድረሱ
  rationale: የግሪክኛው አጭር አገላለጽ ግንኙነቱን በግልጽ አይዘረዝርም፤ ነገር ግን ቀጣዩ ቁጥርና የታሪኩ ፍሰት ድንኳኑ እስከ ዳዊት ጊዜ መኖሩን ይደግፋሉ።
