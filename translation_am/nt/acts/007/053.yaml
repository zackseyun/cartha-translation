    issue: The phrase «በመላእክት አማካኝነት በተሰጠው ሥርዓት» has an unclear attachment.
    rationale: It may be read as saying that an order/arrangement was given through angels, rather than that the law was received with angelic mediation. This obscures the main assertion and is not idiomatic Amharic.
