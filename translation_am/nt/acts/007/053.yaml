  text: you who received the law as delivered by angels[a], and did not keep it.
translation:
  language: am
  text: እናንተ በመላእክት አማካኝነት የተሰጠውን ሕግ ተቀበላችሁ[a]፤ ነገር ግን አልጠበቃችሁትም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በመላእክት ዝግጅት» ወይም «በመላእክት ትእዛዝ»። የግሪኩ ሐረግ ለመተርጎም አስቸጋሪ ነው፤ ነገር ግን ሕጉ ከመላእክት አማካኝነት ጋር በተያያዘ እንደተሰጠ ያመለክታል።
