lexical_decisions:
- source_word: οἵτινες
  choice: እናንተ ... ተቀበላችሁ
  rationale: የግሪኩ አንጻራዊ ተውላጠ ስም የእስጢፋኖስን ቀጥተኛና ወቃሽ ንግግር ያሳያል፤ በአማርኛ «እናንተ» ይህን ኃይል በተፈጥሮ ይገልጣል።
- source_word: ἐλάβετε
  choice: ተቀበላችሁ
  rationale: ሕግን መቀበል የሚለውን ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል፤ በፈቃደኝነት ታዘዙ የሚል ተጨማሪ ሐሳብ አያስገባም።
- source_word: τὸν νόμον
  choice: ሕጉን
  rationale: በዐውዱ የሙሴን ሕግ ያመለክታል፤ «ሕጉን» የታወቀውን ሕግ በግልጽ ያሳያል።
- source_word: εἰς διαταγὰς ἀγγέλων
  choice: በመላእክት አማካኝነት በተሰጠው ሥርዓት
  rationale: διαταγή ሥርዓትን፣ ዝግጅትን ወይም ትእዛዝን ሊያመለክት ስለሚችል ሐረጉ አሻሚ ነው። ይህ ምርጫ መላእክት በሕጉ መሰጠት ውስጥ አማካኝ መሆናቸውን ዋና ሐሳብ ያስተላልፋል፤ «ሥርዓት» ደግሞ የδιαταγαίን ትርጉማዊ ገጽታ ሳይጥል ይጠብቃል።
- source_word: ἀγγέλων
  choice: መላእክት
  rationale: ዐውዱ በሕጉ መሰጠት የተሳተፉ ሰማያዊ ፍጥረታትን እንጂ ሰዎች መልእክተኞችን አያመለክትም።
- source_word: οὐκ ἐφυλάξατε
  choice: አልጠበቃችሁትም
  rationale: φυλάσσω ከሕግ ጋር ሲውል ሕጉን መጠበቅን ወይም መፈጸምን ያመለክታል፤ «አልጠበቃችሁትም» የግሪኩን ምሳሌያዊ አገላለጽ ይጠብቃል።
theological_decisions:
- issue: የεἰς διαταγὰς ἀγγέλων መላእክታዊ አማካኝነት
  choice: ሕጉ በመላእክት አማካኝነት በተሰጠ ሥርዓት እንደተቀበለ መግለጽ
  alternative: «በመላእክት ዝግጅት» ወይም «በመላእክት ትእዛዝ» ብሎ መተርጎም
  rationale: ጽሑፉ መላእክት በሕጉ መሰጠት ውስጥ እንደነበራቸው ያሳያል፤ የδιαταγαί ትክክለኛ ጥላ ትርጉም ግን አከራካሪ ነው። ትርጉሙ የአማካኝነቱን ዋና ነጥብ ይገልጣል፤ አሠራሩን ግን ከጽሑፉ በላይ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ሕግን መጠበቅ» የተለመደውን መጽሐፍ ቅዱሳዊ አገላለጽ ይጠብቃል፤ የመላእክትን ሚና ግን ከግሪኩ በላይ አይወስንም።
