    text: ወይም፣ “ወደ ጎን ገፍቶ አስወገደው።” የግሪኩ ግስ በኃይል መግፋትን ወይም በንቀት ውድቅ ማድረግን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικῶν
  choice: ይበድል የነበረው
  rationale: የአሁን ጊዜው አሳታፊ ቅርጽ በዚህ ትረካ ቀጣይ የነበረ የግፍ ድርጊትን ያሳያል፤ ‘መበደል’ የፍትሕ መጓደልን በቀጥታ ይገልጣል።
- source_word: πλησίον
  choice: ባልንጀራውን
  rationale: ቃሉ በአቅራቢያ ያለን ወይም የሰውን ባልንጀራ ያመለክታል፤ በአማርኛ የግድ አጠገብ የሚኖር ሰው ሳይሆን ሌላውን ሰው በተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: ἀπώσατο
