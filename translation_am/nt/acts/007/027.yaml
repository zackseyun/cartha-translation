  rationale: ቃሉ አካላዊ ግፊትንም ሆነ በኃይል ማራቅን ሊያመለክት ስለሚችል፣ የትረካውን ተጨባጭ ድርጊትና የንቀት እምቢታ ያቆያል።
- source_word: κατέστησεν
  choice: አድርጎ የሾመህ
  rationale: καθίστημι አንድን ሰው በሥልጣን ስፍራ ማቆምን ያመለክታል፤ ‘አድርጎ የሾመህ’ የግሪኩን ምክንያታዊ አገባብ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἄρχοντα
  choice: ገዥ
  rationale: የአስተዳደርና የሥልጣን ትርጉሙን በቀጥታ ይጠብቃል።
- source_word: δικαστὴν
  choice: ፈራጅ
  rationale: በግጭት ላይ ፍርድ የሚሰጥን ሰው በተፈጥሯዊና በተከበረ የአማርኛ አገላለጽ ይገልጣል።
- source_word: ἐφ’ ἡμῶν
  choice: በእኛ ላይ
  rationale: ἐπί ከጄኒቲቭ ጋር እዚህ ላይ በቡድኑ ላይ የሚፈጸም ሥልጣንን ያመለክታል።
