  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Τοῦτον τὸν Μωϋσῆν, ὃν ἠρνήσαντο εἰπόντες· Τίς σε κατέστησεν ἄρχοντα καὶ δικαστήν, τοῦτον ὁ θεὸς ⸀καὶ ἄρχοντα καὶ λυτρωτὴν ⸂ἀπέσταλκεν σὺν⸃ χειρὶ ἀγγέλου τοῦ ὀφθέντος αὐτῷ ἐν τῇ βάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/035.yaml
  text: This Moses[a], whom they rejected, saying, ‘Who appointed you a ruler and a judge?’—this man God sent as both ruler and redeemer by the hand of the angel who appeared to him in the bush.
translation:
  language: am
  text: “መሪና ፈራጅ አድርጎ የሾመህ ማን ነው?” ብለው ያልተቀበሉትን ይህንኑ ሙሴ፣ እግዚአብሔር በቁጥቋጦው ውስጥ ለእርሱ በታየው መልአክ እጅ መሪም ቤዛ አዳኝም አድርጎ ላከው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρνήσαντο
  choice: ያልተቀበሉትን
  rationale: በዚህ አውድ ሕዝቡ የሙሴን ሥልጣን አሻፈረኝ ማለቱን ያመለክታል፤ ቃሉን ‘የካዱትን’ ማለት ቢቻልም፣ ይህ አተረጓጎም የዘፀአት 2፥14ን አውድ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: κατέστησεν
  choice: አድርጎ የሾመህ
  rationale: የሥልጣን ሹመትን የሚጠይቀውን አገባብ ግልጽ ያደርጋል።
- source_word: ἄρχοντα
  choice: አለቃ
  rationale: ሥልጣን ያለውን መሪ ያመለክታል፤ በጥያቄውና በእግዚአብሔር ሹመት መካከል ያለውን ሆን ተብሎ የተደገመ ንጽጽርም ይጠብቃል።
- source_word: δικαστήν
  choice: ፈራጅ
  rationale: የመፍረድን ተግባር ቀጥተኛና ለዘመናዊ አንባቢ ግልጽ በሆነ ቃል ያቀርባል።
- source_word: λυτρωτὴν
  choice: ቤዛ አውጪ
  rationale: ከአደጋ ማዳንን ብቻ ሳይሆን ነፃ ማውጣትንና የቤዛነትን ትርጉም ይጠብቃል።
- source_word: ἀπέσταλκεν
  choice: ላከው
  rationale: የተፈጸመውን መላክ በተፈጥሯዊ የአማርኛ ትረካ ያቀርባል።
- source_word: σὺν χειρὶ
  choice: በ… እጅ
  rationale: የመሣሪያነትን ወይም የወኪልነትን ሐሳብ የሚገልጸውን ሴማዊ አነጋገር በመጽሐፍ ቅዱሳዊ አገላለጽ ይጠብቃል።
- source_word: ἀγγέλου
  choice: መልአክ
  rationale: በቁጥቋጦው የታየውን ሰማያዊ መልእክተኛ በተለመደው ቃል ይገልጻል።
- source_word: τοῦ ὀφθέντος αὐτῷ ἐν τῇ βάτῳ
  choice: በቁጥቋጦው ውስጥ በታየው
  rationale: የግሪኩን ‘የታየው’ ፍቺ በተፈጥሯዊ አማርኛ ይሰጣል፤ በዚህ ቁጥር ያልተጠቀሰውን ‘የሚነድ’ የሚለውን ቃል አይጨምርም።
- source_word: Τοῦτον ... τοῦτον
  choice: ይህን ሙሴ … ላከው
  rationale: በአማርኛው የዓረፍተ ነገር አወቃቀር ‘ይህን ሙሴ’ የሚለውን አጽንዖት ይጠብቃል፤ ሁለተኛው ጠቋሚ በግስ ቅጥያው ‘-ው’ በተፈጥሮ ተወክሏል።
- source_word: καὶ ἄρχοντα καὶ λυτρωτὴν
  choice: አለቃም ቤዛ አውጪም
  rationale: የተደገመውን καί እና የሁለቱንም ሚናዎች አጽንዖት በአማርኛው ‘-ም … -ም’ አወቃቀር ይጠብቃል።
theological_decisions:
- issue: ሙሴ በድነት ታሪክ ውስጥ ምሳሌያዊ ሚና ባለው አውድ λυτρωτήςን መተርጎም
  choice: ቤዛ አውጪ
  alternative: ነፃ አውጪ
  rationale: ‘ቤዛ አውጪ’ የነፃ ማውጣትንና የቤዛነትን ጠንካራ ፍቺ ይጠብቃል፤ ነገር ግን ሙሴን ከሌላ የድነት ሚና ጋር ሙሉ በሙሉ አንድ አያደርገውም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። ‘በመልአኩ እጅ’ የሚለው መጽሐፍ ቅዱሳዊ የወኪልነት አገላለጽ ሆን ተብሎ ተጠብቋል። የግሪኩ አጽንዖት ‘አለቃም … ቤዛ አውጪም’ በሚለው ተመጣጣኝ አወቃቀር ተላልፏል።
