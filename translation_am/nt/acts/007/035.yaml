- from: “አለቃና ፈራጅ አድርጎ የሾመህ ማን ነው?” ብለው ያልተቀበሉትን ይህን ሙሴ፣ እግዚአብሔር አለቃም ቤዛ አውጪም[a] አድርጎ፣ በቁጥቋጦው ውስጥ በታየው መልአክ እጅ ላከው።
  to: “መሪና ፈራጅ አድርጎ የሾመህ ማን ነው?” ብለው ያልተቀበሉትን ይህንኑ ሙሴ፣ እግዚአብሔር በቁጥቋጦው ውስጥ ለእርሱ በታየው መልአክ እጅ መሪም ቤዛ አዳኝም አድርጎ ላከው።
  rationale: The revision preserves the Greek syntax and emphasis while using modern, idiomatic Amharic. መሪ mirrors the repeated ἄρχων; ቤዛ አዳኝ conveys λυτρωτής' redemption/liberation sense, with ነፃ አውጪ retained as a lexical alternative. The wording does not add that the bush was burning, since that is not stated in this verse.
