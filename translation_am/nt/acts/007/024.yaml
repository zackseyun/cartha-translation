translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ቅደም ተከተልና የἐκδίκησιν የፍትሕ/በቀል አሻሚነት በዋናው ጽሑፍና በግርጌ ማስታወሻ ተጠብቋል።
