  rationale: የግሪኩ ያለፈ ጊዜ አሳታፊ ግስ ከሚከተሉት ዋና ድርጊቶች በፊት የሆነውን ሁኔታ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τινα ἀδικούμενον
