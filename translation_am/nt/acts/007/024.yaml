- source_word: ἐποίησεν ἐκδίκησιν
  choice: ፍትሕን አስገኘለት
  rationale: አገላለጹ ፍትሕ ማስገኘትን፣ መበቀልን ወይም በደልን መመለስን ሊያመለክት ይችላል፤ ይህ ምርጫ የተጨቆነውን ሰው ወክሎ እርምጃ መውሰዱን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τῷ καταπονουμένῳ
