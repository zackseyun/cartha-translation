  text: καὶ ἰδών τινα ἀδικούμενον ἠμύνατο καὶ ἐποίησεν ἐκδίκησιν τῷ καταπονουμένῳ πατάξας τὸν Αἰγύπτιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/024.yaml
  text: And when he saw someone being wronged[b][a], he defended him and brought justice for the one being oppressed by striking down the Egyptian.
translation:
  language: am
  text: አንድ ሰው ሲበደል አይቶ፣ ተከላከለለት፤ ግብፃዊውን በመምታት[b] ለተጨቆነው ፍትሕን አስገኘ[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለተጨቆነው በቀል ፈጸመ።” ἐποίησεν ἐκδίκησιν የሚለው የግሪክ አገላለጽ መበቀልን ወይም ፍትሕ ማስገኘትን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: አውዱ ድርጊቱ ለሞት እንዳበቃ ያሳያል፤ ሆኖም πατάξας የሚለው የግሪክ ግስ በራሱ “በመምታት” ማለት ነው።
    reason: lexical_alternative
lexical_decisions:
