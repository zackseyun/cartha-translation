- source_word: πατάξας τὸν Αἰγύπτιον
  choice: ግብፃዊውን በመምታት
  rationale: πατάσσω በመሠረቱ ‘መምታት’ ማለት ነው፤ አውዱ ሞትን ቢያመለክትም ትርጉሙ ግሱ በቀጥታ ከሚናገረው አያልፍም።
theological_decisions:
