  rationale: ከἄν እና ከአኦሪስት ሰብጃንክቲቭ ጋር ያለውን የወደፊት አቅጣጫ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ «እኔም» የሚያሳየው አምላክ መሆኑን ያጎላል እንጂ እርግጠኝነቱን አያዳክምም።
