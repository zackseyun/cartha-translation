source:
  edition: SBLGNT
  text: Καθὼς δὲ ἤγγιζεν ὁ χρόνος τῆς ἐπαγγελίας ἧς ⸀ὡμολόγησεν ὁ θεὸς τῷ Ἀβραάμ, ηὔξησεν ὁ λαὸς καὶ ἐπληθύνθη ἐν Αἰγύπτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/017.yaml
  text: But as the time of the promise that God had made to Abraham was drawing near[a], the people increased and multiplied in Egypt,
translation:
  language: am
  text: ነገር ግን እግዚአብሔር ለአብርሃም ቃል የገባው የተስፋው ጊዜ እየቀረበ ሲሄድ፣ ሕዝቡ በግብፅ አደገና በዛ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καθὼς δὲ
  choice: ነገር ግን ... ሲሄድ
  rationale: Καθώς ያለውን ጊዜያዊ ግንኙነት በ‘ሲሄድ’፣ δέ ያለውን ረጋ ያለ የንግግር ሽግግር ደግሞ በ‘ነገር ግን’ ያሳያል።
- source_word: ἤγγιζεν
  choice: እየቀረበ ሲሄድ
  rationale: የኢምፐርፌክት ግስ ቀጣይነት ያለውን መቅረብ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ὁ χρόνος τῆς ἐπαγγελίας
  choice: የተስፋ ቃሉ የሚፈጸምበት ጊዜ
  rationale: ቃል በቃል ‘የተስፋው ጊዜ’ በአማርኛ ግልጽ ስላልሆነ፣ በአውዱ የተስፋው ፍጻሜ የሚቀርብበትን ጊዜ በግልጽና ተፈጥሯዊ አገላለጽ ይሰጣል፤ ‘የተወሰነ ጊዜ’ የሚል በግሪኩ ያልተገለጸ ልዩ ትርጉም አይጨምርም።
- source_word: τῆς ἐπαγγελίας
  choice: የተስፋ ቃል
  rationale: ἐπαγγελίαን በዘመናዊ አማርኛ በተለመደውና ክብር ባለው አገላለጽ ይተረጉማል።
- source_word: ὡμολόγησεν
  choice: የገባው
  rationale: ከ‘የተስፋ ቃል’ ጋር ‘የገባው’ የተፈጥሮ አማርኛ ሲሆን፣ ግሱ የሚያመለክተውን የተገለጸ ቁርጠኛ ቃል ያስተላልፋል፤ ‘የማለ’ የሚለውን ከግሪኩ በላይ የጠነከረ የመሐላ ትርጉም አያስገባም።
- source_word: τῷ Ἀβραάμ
  choice: ለአብርሃም
  rationale: የተቀባዩን ዳቲቭ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ηὔξησεν ὁ λαὸς καὶ ἐπληθύνθη
  choice: ሕዝቡ ... እያደገና እየበዛ ሄደ
  rationale: ሁለቱን የግሪክ ግሶች ‘አደገ’ እና ‘በዛ’ በሚሉ የተለያዩ ቃላት ያቆያል፤ የዕድገቱን ቀጣይነትም በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐν Αἰγύπτῳ
  choice: በግብፅ
  rationale: ቀላል የስፍራ ሐረግ ሲሆን የተለመደውን የአማርኛ የአገሩን ስም ይጠቀማል።
theological_decisions:
- issue: ὡμολόγησεν ከእግዚአብሔር ለአብርሃም ከሰጠው ተስፋ ጋር ያለው ትርጉም
  choice: ‘የገባው የተስፋ ቃል’
  alternative: ‘ተስፋ የሰጠው’፣ ‘ቃል የገባለት’፣ ወይም ‘የማለለት’
  rationale: ‘የገባው የተስፋ ቃል’ የመለኮታዊውን ቁርጠኛ ተስፋ በተፈጥሯዊ አማርኛ ያሳያል፤ ግሱ ὀμνύω ስላልሆነ ‘የማለ’ በማለት የመሐላ ሐሳብን አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። ‘ሕዝቡ’ የእስራኤልን ሕዝብ እንደ አንድ ማኅበር ያመለክታል፤ ‘እያደገና እየበዛ ሄደ’ የሁለቱን ግሶች ልዩነትና ቀጣይ ዕድገት ያቆያል።
