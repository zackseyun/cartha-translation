  to: ነገር ግን እግዚአብሔር ለአብርሃም ቃል የገባው የተስፋው ጊዜ እየቀረበ ሲሄድ፣ ሕዝቡ በግብፅ አደገና በዛ።
  rationale: The revision removes the added explicit fulfillment clause, preserves the progressive sense of ἤγγιζεν with “እየቀረበ ሲሄድ,” and renders the two subsequent aorists with distinct simple past verbs. The footnote is retained with wording aligned to the revised main text.
