    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ያገለግሉኛል።” የግሪኩ ግሥ ለእግዚአብሔር የሚቀርብን ሃይማኖታዊ አገልግሎት ወይም አምልኮ ሊያመለክት ይችላል።
    reason: lexical_alternative
