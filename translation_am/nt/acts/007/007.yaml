- source_word: ὁ θεὸς εἶπεν
  choice: እግዚአብሔርም … አለ
  rationale: የንግግሩን ባለቤት ግልጽ ያደርጋል፤ በአማርኛ ቀጥተኛ ንግግርን በተፈጥሯዊ አገባብ ያቀርባል።
