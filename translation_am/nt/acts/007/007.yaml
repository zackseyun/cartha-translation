  rationale: ቃሉ ተራ ሥራን ሳይሆን ለእግዚአብሔር የሚቀርብ ሃይማኖታዊ አገልግሎትን ስለሚያመለክት “ማምለክ” ዋናውን ፍቺ በግልጽ ያቀርባል።
