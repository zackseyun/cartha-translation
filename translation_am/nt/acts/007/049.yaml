id: ACT.7.49
reference: Acts 7:49
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ὁ οὐρανός μοι θρόνος, ⸂ἡ δὲ⸃ γῆ ὑποπόδιον τῶν ποδῶν μου· ποῖον οἶκον οἰκοδομήσετέ μοι, λέγει κύριος, ἢ τίς τόπος τῆς καταπαύσεώς μου;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/049.yaml
  text: Heaven is my throne[a], and the earth is the footstool for my feet. What kind of house will you build for me, says the Lord, or what is the place of my rest?
translation:
  language: am
  text: “ሰማይ ዙፋኔ ነው፤ ምድርም የእግሮቼ መርገጫ ናት። ምን ዓይነት ቤት ትሠሩልኛላችሁ፣ ይላል ጌታ፤ ወይስ የማርፍበት ስፍራ የት ነው?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐρανός
  choice: ሰማይ
  rationale: ከምድር ጋር በተቃርኖ የቀረበውን ሰማያዊ ዓለም ያመለክታል፤ ተራውን የሚታይ ሰማይ ብቻ አያመለክትም።
- source_word: θρόνος
  choice: ዙፋኔ
  rationale: የንጉሣዊ ሥልጣንን መቀመጫ የሚገልጠውን ምስል በቀጥታ ይጠብቃል።
- source_word: γῆ
  choice: ምድር
  rationale: ከሰማይ ጋር ተነጻጽሮ ዓለምን በሙሉ ስለሚያመለክት ‘መሬት’ ወይም ‘አገር’ ሳይሆን ‘ምድር’ ተመርጧል።
- source_word: ὑποπόδιον τῶν ποδῶν μου
  choice: የእግሮቼ መርገጫ
  rationale: የግሪኩን የባለቤትነት አወቃቀርና ግልጽ የእግር ምስል ተፈጥሯዊ በሆነ አማርኛ ይጠብቃል።
- source_word: ποῖον
  choice: ምን ዓይነት
  rationale: ጥያቄው የቤቱን ማንነት ብቻ ሳይሆን ዓይነቱንና ብቃቱን ይጠይቃል።
- source_word: οἶκον
  choice: ቤት
  rationale: ግሪኩ ‘ቤት’ ይላል፤ አውዱ የቤተ መቅደስን ሐሳብ ቢያመለክትም ያንን በትርጉም ውስጥ አልተጨመረም።
- source_word: οἰκοδομήσετέ μοι
  choice: ትሠሩልኛላችሁ
  rationale: የወደፊት ጊዜውንና ‘ለእኔ’ የሚለውን ትርጉም በተፈጥሯዊ የአማርኛ ጥያቄ ይገልጣል።
- source_word: κύριος
  choice: ጌታ
  rationale: የአዲስ ኪዳኑን κύριος በቀጥታ ይተረጉማል፤ ጥቅሱ ከኢሳይያስ ቢሆንም የግሪኩን ቅርጽ በመከተል ልዩ የመለኮታዊ ስም አልገባም።
- source_word: τόπος τῆς καταπαύσεώς μου
  choice: የማርፍበት ስፍራ
  rationale: ‘የዕረፍቴ ስፍራ’ የሚለውን ቃል በቃል አወቃቀር ሳያጠፋ፣ በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ያደርገዋል።
theological_decisions:
- issue: በኢሳይያስ ጥቅስ ውስጥ κύριος የተባለውን የእስራኤል አምላክ መጠሪያ አተረጓጎም
  choice: ጌታ
  alternative: እግዚአብሔር
  rationale: የቀረበው የአዲስ ኪዳን ግሪክ ምንጭ κύριος ይላል። ‘ጌታ’ ይህን በቀጥታ ይጠብቃል፤ ‘እግዚአብሔር’ የዕብራይስጡን መለኮታዊ ስም በግልጽ የሚያስገባ አማራጭ ነው።
- issue: የመለኮታዊው ‘ዕረፍት’ አገላለጽ
  choice: የማርፍበት ስፍራ
  alternative: የዕረፍቴ ስፍራ
  rationale: የመለኮታዊ ዕረፍትን ሐሳብ ሳይተረጉም ወይም ወደ ‘መኖሪያ’ ሳይቀይር ተፈጥሯዊ አማርኛ ይሰጣል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ትይዩ አወቃቀርና ተከታታይ የአጻጻፍ ጥያቄዎች ተጠብቀዋል። በቀረበው የእንግሊዝኛ ጽሑፍ ያለው [a] ምልክት ከስህተት የተነሣ ከ‘throne’ በኋላ የተቀመጠ ሲሆን የማስታወሻው ይዘት ὑποπόδιον τῶν ποδῶν μουን ይመለከታል። በአማርኛ ‘የእግሮቼ መርገጫ’ ቀጥተኛና ተፈጥሯዊ ስለሆነ የቃላት አማራጭ ማስታወሻ አላስፈለገም።
