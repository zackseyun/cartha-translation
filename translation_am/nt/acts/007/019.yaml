review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately identifies Pharaoh, Israel as “our people,” and the hostile/cunning sense of κατασοφισάμενος. However, its final clause shifts the action of exposing the infants from “our fathers” to Pharaoh: “ሕፃናቶቻቸው ... እንዲጣሉ አደረገ” makes the infants themselves the direct effected subject. The Greek states that he mistreated the fathers by causing them to make their infants exposed. The revision restores the fathers’ agency while not unnecessarily specifying the degree of coercion.'
  naturalness: The revised wording is natural, modern standard Amharic. “ለሞት እንዲተዋቸው” communicates infant exposure idiomatically, and “በሕይወት እንዳይጠበቁ” preserves the passive sense of “not be kept alive.”
  terminology: “አባቶቻችን” appropriately retains the familial-historical register for Israel’s forefathers. “ተንኮል በመጠቀም” and “ለሞት መተው” are suitable and non-doctrinal renderings. Footnote b is adjusted to describe exposure as abandonment, rather than implying that every exposed infant necessarily died.
  issues:
  - severity: high
    issue: The main text obscures the fathers as the ones who expose/abandon their infants.
    rationale: In τοῦ ποιεῖν τὰ βρέφη ἔκθετα αὐτῶν, the fathers are the understood agents of making their infants exposed. The draft’s passive “እንዲጣሉ” instead presents the infants as the subjects acted upon by Pharaoh, weakening the source syntax and the direct connection to “our fathers.”
  - severity: medium
    issue: Footnote b states the infants were made to die.
    rationale: Exposure was intended to leave infants without preservation and exposed them to death, but the Greek clause says “so that they would not be kept alive,” not that all in fact died. The note should avoid converting purpose/intention into an asserted outcome.
  revised_text: ይህ ሰው[a] በሕዝባችን ላይ ተንኮል በመጠቀም፣ አባቶቻችንን[c] ሕፃናቶቻቸውን ለሞት እንዲተዋቸው በማድረግ አሠቃያቸው፤ በሕይወትም እንዳይጠበቁ።
