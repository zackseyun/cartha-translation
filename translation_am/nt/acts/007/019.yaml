- issue: εἰς τό የዓላማ ወይም የውጤት ንባብ
  choice: በሕይወት እንዳይቆዩ
  alternative: በዚህም ምክንያት በሕይወት አልቆዩም
  rationale: የአማርኛው ‘እንዳይቆዩ’ ዋናውን የዓላማ ንባብ ይይዛል፣ የታሰበ ውጤት ሊሆን የሚችለውንም ሙሉ በሙሉ አይዘጋም።
