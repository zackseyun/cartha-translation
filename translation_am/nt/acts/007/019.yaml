base_translation:
  language: en
  yaml_path: translation/nt/acts/007/019.yaml
  text: This man[a], having dealt shrewdly with our people, mistreated our fathers[c][b], causing their infants to be exposed so that they would not be kept alive.
translation:
  language: am
  text: ይህ ሰው[a] በሕዝባችን ላይ ተንኮል በመጠቀም፣ አባቶቻችንን[c] ሕፃናቶቻቸውን ለሞት እንዲተዋቸው በማድረግ አሠቃያቸው፤ በሕይወትም እንዳይጠበቁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ይህም በሕዝባችን ላይ በተንኮል ተጠቀመ።” የግሪኩ ቃል ብልሃትን ለማታለል ወይም ለመጉዳት መጠቀምን ያጎላል።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “ቀደምቶቻችንን።” የግሪኩ ቃል ለእስራኤል የቀድሞ አባቶች የሚጠቀምበትን ቤተሰባዊ አጠራር ይጠብቃል።
    reason: lexical_alternative
lexical_decisions:
