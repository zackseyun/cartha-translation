- source_word: τοῦ ποιεῖν τὰ βρέφη ἔκθετα αὐτῶν
  choice: ሕፃናቶቻቸው ... እንዲጣሉ አደረገ
  rationale: የግሪኩ አወቃቀር ምክንያትን፣ መንገድን ወይም ውጤትን ሊያመለክት ስለሚችል፣ ‘አደረገ’ የግድ ማስገደድን ሳይጨምር የፈርዖንን ኃላፊነት ያሳያል። ‘እንዲጣሉ’ ሕፃናትን ለሞት አጋልጦ መተውን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: εἰς τὸ μὴ ζῳογονεῖσθαι
  choice: በሕይወት እንዳይቆዩ
