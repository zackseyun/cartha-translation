- source_word: τὸ γένος ἡμῶν
  choice: ሕዝባችን
  rationale: እዚህ γένος የእስራኤልን ወገን ወይም ሕዝብ ያመለክታል፤ ‘ሕዝባችን’ በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: ἐκάκωσεν
