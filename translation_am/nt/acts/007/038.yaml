  text: οὗτός ἐστιν ὁ γενόμενος ἐν τῇ ἐκκλησίᾳ ἐν τῇ ἐρήμῳ μετὰ τοῦ ἀγγέλου τοῦ λαλοῦντος αὐτῷ ἐν τῷ ὄρει Σινᾶ καὶ τῶν πατέρων ἡμῶν, ὃς ἐδέξατο ⸀λόγια ζῶντα δοῦναι ⸀ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/038.yaml
  text: This is the one who was in the assembly in the wilderness with the angel who was speaking to him on Mount Sinai[a], and with our fathers[c][b]; he received living oracles to give to us.
translation:
  language: am
  text: ይህ በምድረ በዳ በነበረው ጉባኤ[a] ውስጥ፣ በሲና ተራራ ላይ ለእርሱ ይናገር ከነበረው መልአክ እና ከአባቶቻችን[c] ጋር የነበረው ነው፤ ለእኛ እንዲሰጥ ሕያዋን ቃሎችን[b] ተቀበለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ማኅበር» ተብሎም ሊተረጎም ይችላል፤ በባህላዊ ትርጉም «በምድረ በዳ የነበረችው ቤተ ክርስቲያን» ተብሏል።
    reason: alternative_reading
  - marker: b
    text: «ሕያዋን መለኮታዊ ቃሎች» ወይም «ሕይወት ሰጪ ቃሎች» ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: c
    text: «አባቶቻችን» የሚለው የእስራኤልን ቀደምት አባቶች ያመለክታል፤ «ቅድመ አያቶቻችን» ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: ማኅበር
  rationale: በምድረ በዳ የተሰበሰበውን የእስራኤል ሕዝብ ያመለክታል፤ «ቤተ ክርስቲያን» ብሎ በመተርጎም የኋለኛውን ተቋማዊ ትርጉም አያስገባም።
- source_word: ἐρήμῳ
  choice: ምድረ በዳ
  rationale: የእስራኤልን የበረሃ ጉዞ በተፈጥሯዊና በመጽሐፍ ቅዱሳዊ አጠራር ይገልጣል።
- source_word: ἀγγέλου
  choice: መልአክ
  rationale: በሲና አውድ የሚጠቀሰው ሰማያዊ መልእክተኛ ስለሆነ «መልአክ» ቀጥተኛው አቻ ነው።
- source_word: λαλοῦντος
  choice: ይናገረው ከነበረው
  rationale: የግሪኩን ቀጣይነት ያለው የንግግር ተግባር በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὄρει Σινᾶ
  choice: በሲና ተራራ
  rationale: የቦታውን ስም በመደበኛው የአማርኛ አጠራር ያቀርባል።
- source_word: πατέρων ἡμῶν
  choice: አባቶቻችን
  rationale: የግሪኩን ግልጽ ቃል ይጠብቃል፤ በዚህ አውድ የእስራኤልን ቀደምት አባቶች ያመለክታል።
- source_word: ἐδέξατο
  choice: ተቀበለ
  rationale: ሙሴ መለኮታዊውን መገለጥ መቀበሉን በቀጥታና በተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: λόγια
  choice: መለኮታዊ ቃሎች
  rationale: λόγια ተራ ንግግርን ሳይሆን ከእግዚአብሔር የመጡ ቅዱሳን ንግግሮችን ያመለክታል፤ «መለኮታዊ ቃሎች» ይህን ትርጉም ለዘመናዊ አንባቢ በግልጽ ያቀርባል።
- source_word: ζῶντα
  choice: ሕያዋን
  rationale: «ሕያዋን» የሚለው የምንጩን ቀጥተኛ ምስልና ሥነ መለኮታዊ ውጥረት ይጠብቃል፤ «ሕይወት ሰጪ» ብሎ አያጠብበውም።
- source_word: δοῦναι
  choice: እንዲሰጥ
  rationale: ሙሴ ቃሎቹን የተቀበለበትን ዓላማ በተፈጥሯዊ የአማርኛ የዓላማ አገባብ ያሳያል።
- source_word: ἡμῖν
  choice: ለእኛ
  rationale: እስጢፋኖስ ራሱንና አድማጮቹን ከእስራኤል የቃል ኪዳን ታሪክ ጋር ማካተቱን ይጠብቃል።
- source_word: ὁ γενόμενος
  choice: የነበረው
  rationale: በዚያ ስብሰባ መካከል የተገኘውን ሙሴ በተፈጥሯዊ አማርኛ ይለያል፤ «የሆነው» ከሚለው ግትር አቀራረብ ይልቅ አውዱን ያስተላልፋል።
theological_decisions:
- issue: ἐκκλησίᾳ በምድረ በዳ ስለነበረው እስራኤል «ቤተ ክርስቲያን» ተብሎ መተርጎም አለበት ወይስ አይገባም?
  choice: ማኅበር
  alternative: ጉባኤ፤ ቤተ ክርስቲያን
  rationale: ጽሑፉ በምድረ በዳ የተሰበሰበውን እስራኤል ይጠቅሳል። «ማኅበር» የተሰበሰበ ሕዝብ የሚለውን መሠረታዊ ትርጉም ይጠብቃል፤ ጽሑፉ ያልጠየቀውን የኋለኛ ዘመን ቤተ ክርስቲያናዊ ተቋማዊ ትርጉም አያስገባም።
- issue: λόγια ζῶντα በትርጓሜ ተስፋፍቶ «ሕይወት ሰጪ ቃሎች» መባል አለበት ወይስ ቀጥተኛው ምስል ይጠበቅ?
  choice: ሕያዋን መለኮታዊ ቃሎች
  alternative: ሕያዋን ቃሎች፤ ሕይወት ሰጪ መለኮታዊ ቃሎች
  rationale: የግሪኩ አገላለጽ አጭርና በትርጉም የበለጸገ ነው። «ሕያዋን» የሚለው ቃሎቹ ሕያው ባሕርይ እንዳላቸው ይገልጣል፤ ይህን በ«ሕይወት ሰጪ» ብቻ በማለት ወደ አንድ ትርጓሜ አያጠብበውም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ማኅበር» የሚለው ቃል የግሪኩን ስብሰባዊ ሐሳብ ያቆያል፤ «ሕያዋን መለኮታዊ ቃሎች» ደግሞ የመገለጥን ባሕርይና የ«ሕያዋን»ን ግልጽ ምስል አብሮ ይጠብቃል።
