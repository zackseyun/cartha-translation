id: ACT.7.26
reference: Acts 7:26
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τῇ τε ἐπιούσῃ ἡμέρᾳ ὤφθη αὐτοῖς μαχομένοις καὶ ⸀συνήλλασσεν αὐτοὺς εἰς εἰρήνην εἰπών· Ἄνδρες, ἀδελφοί ⸀ἐστε· ἱνατί ἀδικεῖτε ἀλλήλους;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/026.yaml
  text: And on the following day he appeared to them as they were fighting and was trying to reconcile them to peace[a], saying, ‘Men, you are brothers[b]; why are you wronging one another?’
translation:
  language: am
  text: በማግስቱም ሲጣሉ ታየላቸው፤ ሊያስታርቃቸው እየሞከረ፣ “እናንተ ሰዎች፣ ወንድሞች ናችሁ፤ እርስ በርሳችሁ ለምን ትበዳደላላችሁ?” አላቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ τε ἐπιούσῃ ἡμέρᾳ
  choice: በማግስቱም
  rationale: ተከታዩን ቀን በተፈጥሯዊና አጭር የአማርኛ አገላለጽ ያሳያል።
- source_word: ὤφθη αὐτοῖς
  choice: ታያቸው
  rationale: የግሪኩን ተገብሮ ቅርጽና በትረካ ውስጥ ያለውን ‘በፊታቸው ታየ’ የሚል ትርጉም በተፈጥሯዊ አማርኛ ያቀርባል፤ ‘ተገለጠ’ ሊያመጣ የሚችለውን ልዩ መለኮታዊ ጥላ አያስገባም።
- source_word: αὐτοῖς μαχομένοις
  choice: ሲጣሉ
  rationale: ሙሴ በታያቸው ጊዜ ግጭታቸው ቀጥሎ እንደነበር የአሁናዊው ተሳቢ ግስ ገጽታ ያሳያል።
- source_word: συνήλλασσεν αὐτοὺς εἰς εἰρήνην
  choice: እንዲታረቁም ሊያደርጋቸው እየሞከረ
  rationale: በዐውዱ ያልተሳካውን የማስታረቅ ጥረት ይገልጣል፤ εἰς εἰρήνην የሚያመለክተው ወደ ሰላም ሁኔታ ማምጣት በ‘እንዲታረቁ’ ተይዟል።
- source_word: Ἄνδρες, ἀδελφοί ἐστε
  choice: እናንተ ሰዎች፣ ወንድማማቾች ናችሁ
  rationale: Ἄνδρες የሚለውን ቀጥተኛ አድራሻ እና የጋራ ወገንነትን የሚያሳስበውን ἀδελφοί ἐστε ሳይቀላቅል ይጠብቃል።
- source_word: ἱνατί ἀδικεῖτε ἀλλήλους
  choice: እርስ በርሳችሁ ለምን ትበዳደላላችሁ?
  rationale: ἀδικέω ያለውን የበደልና የግፍ ሐሳብ በግንኙነታዊ አገላለጽ ይጠብቃል፤ ἀλλήλους ደግሞ በ‘እርስ በርሳችሁ’ በግልጽ ተተርጉሟል።
theological_decisions:
- issue: የማስታረቁ ድርጊት የተሳካ ድርጊት ነው ወይስ ጥረት?
  choice: ያልተሳካ ጥረትን የሚገልጽ ‘እየሞከረ’ ተመርጧል።
  alternative: ‘እያስታረቃቸው ነበር’ ተብሎ እንደቀጠለ ድርጊት ማቅረብ።
  rationale: የግሪኩ ኢምፐርፌክት ሁለቱንም ሊፈቅድ ቢችልም፣ ቀጣዩ ቁጥር ሙሴ እንደተገፋ ስለሚያሳይ በዚህ ዐውድ የጥረት ትርጉሙ ይበልጥ ይስማማል፤ ሌላው ንባብ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። ‘ወንድማማቾች’ የሚለው በዚህ ዐውድ ሁለቱ ወንዶች የአንድ ሕዝብ ወገኖች መሆናቸውን በተፈጥሯዊ አማርኛ ያጎላል። በእንግሊዝኛው የቀረበው [b] ማስታወሻ ከምልክቱ ጋር የማይዛመድ የቀድሞ አተረጓጎም ቅሪት ስለሆነ በአማርኛው ረቂቅ አልተካተተም።
