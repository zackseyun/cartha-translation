- source_word: ἐποίησεν
  choice: የሠራችው
  rationale: ποιέω በዚህ አውድ መፍጠርን ወይም ወደ ሕልውና ማምጣትን ያመለክታል፤ ‘ሠራ’ ከ‘እጅ’ ምስል ጋር ተፈጥሯዊ ሆኖ የፍጥረትን አውድ ይይዛል።
- source_word: ταῦτα πάντα
  choice: እነዚህን ሁሉ
  rationale: ταῦτα ያለውን አመልካች ኃይልና πάντα ያለውን ሁሉን አቀፍ ስፋት በአጭርና ተፈጥሯዊ አማርኛ ይጠብቃል።
