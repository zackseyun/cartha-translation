id: ACT.7.8
reference: Acts 7:8
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἔδωκεν αὐτῷ διαθήκην περιτομῆς· καὶ οὕτως ἐγέννησεν τὸν Ἰσαὰκ καὶ περιέτεμεν αὐτὸν τῇ ἡμέρᾳ τῇ ὀγδόῃ, ⸀καὶ Ἰσαὰκ τὸν Ἰακώβ, ⸁καὶ Ἰακὼβ τοὺς δώδεκα πατριάρχας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/008.yaml
  text: And he gave him the covenant of circumcision. And so he fathered Isaac and circumcised him on the eighth day, and Isaac fathered Jacob, and Jacob the twelve patriarchs.
translation:
  language: am
  text: እግዚአብሔርም ለእርሱ የመገረዝን ቃል ኪዳን ሰጠው። እንደዚሁም አብርሃም የይስሐቅ አባት ሆነ፤ በስምንተኛውም ቀን ገረዘው። ይስሐቅም የያዕቆብ አባት ሆነ፤ ያዕቆብም የአሥራ ሁለቱ ነገዶች አባቶች የሆኑትን አሥራ ሁለቱን ልጆቹን ወለደ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαθήκην περιτομῆς
  choice: የመገረዝን ቃል ኪዳን
  rationale: “ቃል ኪዳን” በመጽሐፍ ቅዱሳዊና ታሪካዊ አውድ διαθήκηን በተፈጥሯዊ አማርኛ ያስተላልፋል፤ የባለቤትነት አወቃቀሩም ቃል ኪዳኑ በመገረዝ የሚታወቅ መሆኑን ሳያብራራ ይጠብቃል።
- source_word: οὕτως
  choice: እንደዚሁም
  rationale: ይህ ምርጫ ከቀደመው የቃል ኪዳን ስጦታ ጋር ያለውን ተከታታይና ‘በዚህ ሁኔታ’ የሚለውን ግንኙነት ይጠብቃል፤ ቃሉን ተራ የመደመር ምልክት ብቻ አያደርገውም።
- source_word: ἐγέννησεν
  choice: ወለደ
  rationale: በወንድ ርዕሰ ጉዳይ የዘር ሐረግን ለመግለጽ “ወለደ” በአማርኛ ግልጽ፣ አጭርና ተፈጥሯዊ ነው።
- source_word: περιέτεμεν
  choice: ገረዘው
  rationale: “መገረዝ” περιτέμνωን የሚያስተላልፈው መደበኛና ግልጽ የአማርኛ ቃል ነው፤ “-ው” የሚለውም ይስሐቅን እንደሚያመለክት ያሳያል።
- source_word: τῇ ἡμέρᾳ τῇ ὀγδόῃ
  choice: በስምንተኛው ቀን
  rationale: የግሪኩን ጊዜ ጠቋሚ ሐረግ በቀጥታና በተፈጥሯዊ አማርኛ ይገልጻል፤ “ከተወለደ በኋላ” የሚል በግሪኩ ያልተገለጸ ማብራሪያ አልተጨመረም።
- source_word: πατριάρχας
  choice: የነገድ አባቶች
  rationale: ቃሉ የእስራኤል ነገዶች መሥራች አባቶችን ያመለክታል፤ “የነገድ አባቶች” ይህን ታሪካዊ ትርጉም ለዘመናዊ አንባቢ በግልጽ ያቀርባል።
- source_word: Ἰσαάκ / Ἰακώβ
  choice: ይስሐቅ / ያዕቆብ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመዱት የስሞቹ ቅርጾች ተጠብቀዋል።
theological_decisions:
- issue: የአብርሃም ቃል ኪዳን የተወሰነነት
  choice: “የመገረዝን ቃል ኪዳን” ተብሎ ተተርጉሟል።
  alternative: “በመገረዝ ምልክት የተደረገውን ቃል ኪዳን” ወይም “አንድ የመገረዝ ቃል ኪዳን”
  rationale: ጽሑፉ በዘፍጥረት 17 የተነገረውን የታወቀ ቃል ኪዳን ያመለክታል። የተመረጠው አገላለጽ ይህን ልዩ ማጣቀሻ ይጠብቃል፤ መገረዝ ቃል ኪዳኑ ራሱ ነው ወይስ ምልክቱ ነው የሚለውን ከጽሑፉ በላይ አይወስንም።
- issue: οὕτως የሚያመለክተው ግንኙነት
  choice: “እንደዚሁም” በማለት የሁኔታና የተከታታይነት ኃይሉ ተጠብቋል።
  alternative: “ከዚያም” ወይም “ስለዚህም”
  rationale: οὕτως ቀላል ጊዜያዊ ቅደም ተከተልን ወይም ጥብቅ ምክንያታዊ ውሳኔን ብቻ አያስገድድም። “እንደዚሁም” ያንን የትርጉም ስፋት ይጠብቃል።
- issue: በዘር ሐረጉ ውስጥ ያለው የግስ መቅረት
  choice: በአማርኛ ግልጽነት ሲባል “ወለደ” በይስሐቅና በያዕቆብ ሐረጎች ተደግሟል።
  alternative: የግሪኩን አጭር አወቃቀር ተከትሎ “ይስሐቅም ያዕቆብን፣ ያዕቆብም...” ማለት
  rationale: በግሪኩ የጎደለው ግስ ከἐγέννησεν በቀላሉ ይሞላል። በአማርኛ መድገሙ አዲስ ሥነ መለኮታዊ ይዘት ሳይጨምር ንባቡን ግልጽና ተፈጥሯዊ ያደርገዋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ቃል ኪዳን” እና “መገረዝ” የተለመዱ መጽሐፍ ቅዱሳዊ ቃላት ሲሆኑ፣ “የነገድ አባቶች” የግሪኩን ታሪካዊ ማዕረግ ያለ ጥንታዊ ወይም ያልተለመደ ቃል ያቀርባል።
