  text: ἀκούσας δὲ Ἰακὼβ ὄντα ⸂σιτία εἰς Αἴγυπτον⸃ ἐξαπέστειλεν τοὺς πατέρας ἡμῶν πρῶτον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/012.yaml
  text: But when Jacob heard that there was grain in Egypt[a], he sent out our fathers the first time.
translation:
  language: am
  text: ያዕቆብ ግን በግብፅ እህል እንዳለ[a] በሰማ ጊዜ፣ አባቶቻችንን ለመጀመሪያ ጊዜ ላከ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በግብፅ ስንቅ እንዳለ»። የግሪኩ σιτία የምግብ አቅርቦትን በሰፊው ሊያመለክት ይችላል፤ በዚህ አውድ ግን «እህል» የሚለው ትርጉም ይበልጥ የሚገባ ይመስላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: በሰማ ጊዜ
  rationale: የግሪኩ የአኦሪስት አሳታፊ ቅርጽ ከዋናው ግስ ጋር ጊዜያዊ ግንኙነት አለው፤ ይህ አገላለጽ የክስተቶቹን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: δὲ
  choice: ግን
  rationale: በእስጢፋኖስ ትረካ ውስጥ መጠነኛ ሽግግርን ያመለክታል፤ «ግን» ከልክ ያለፈ ተቃርኖ ሳይፈጥር የንግግሩን እንቅስቃሴ ይጠብቃል።
- source_word: ὄντα ⸂σιτία εἰς Αἴγυπτον⸃
  choice: በግብፅ እህል እንዳለ
  rationale: ከἀκούω በኋላ ያለው የአኩዛቲቭና የአሳታፊ ግስ አወቃቀር በአማርኛ ተፈጥሯዊ በሆነ ቀጥተኛ ያልሆነ ንግግር ተተርጉሟል።
- source_word: σιτία
  choice: እህል
  rationale: ቃሉ በሰፊው ምግብ ወይም ስንቅ ሊያመለክት ቢችልም፣ በዮሴፍና በረሃቡ አውድ «እህል» ይበልጥ የተወሰነና ተፈጥሯዊ ነው።
- source_word: ἐξαπέστειλεν
  choice: ላካቸው
  rationale: ወደ ጉዞ መላካቸውን በተፈጥሯዊ አማርኛ ይገልጣል፤ የግሪኩን ውህድ ግስ በግድ ቃል በቃል መኮረጅ አያስፈልግም።
- source_word: τοὺς πατέρας ἡμῶν
  choice: አባቶቻችንን
  rationale: የግሪኩን የወንድ ዘር ቤተሰባዊ አገላለጽና እስጢፋኖስ በእስራኤል ታሪክ ውስጥ ራሱን ማካተቱን ይጠብቃል።
- source_word: πρῶτον
  choice: ለመጀመሪያ ጊዜ
  rationale: ከተከታዩ ሁለተኛ ጉዞ የሚለይ የመጀመሪያውን መላክ በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: τοὺς πατέρας ἡμῶν አተረጓጎም
  choice: አባቶቻችንን
  alternative: ቅድመ አያቶቻችንን
  rationale: በዚህ ስፍራ ቃሉ በታሪኩ ውስጥ ያሉትን ወንድ አባቶች በተወሰነ ሁኔታ ያመለክታል፤ ስለዚህ ጾታን ያልገለለውን አጠቃላይ «ቅድመ አያቶች» ከመጠቀም ይልቅ የግሪኩ ቤተሰባዊ ቃል ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «አባቶቻችን» የመጽሐፍ ቅዱስን ቤተሰባዊ-ታሪካዊ ቃና ሳይሆን ጥንታዊ አገላለጽ ብቻ እንዳይመስል በቀላል የዓረፍተ ነገር አወቃቀር ቀርቧል።
