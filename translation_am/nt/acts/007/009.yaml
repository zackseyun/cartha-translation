  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Καὶ οἱ πατριάρχαι ζηλώσαντες τὸν Ἰωσὴφ ἀπέδοντο εἰς Αἴγυπτον· καὶ ἦν ὁ θεὸς μετ’ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/009.yaml
  text: And the patriarchs, being jealous of Joseph, sold him into Egypt; and God was with him,
translation:
  language: am
  text: የነገድ አባቶችም በዮሴፍ ቀንተው ወደ ግብፅ ሸጡት፤ እግዚአብሔርም ከእርሱ ጋር ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πατριάρχαι
  choice: የእስራኤል አባቶች
  rationale: በዚህ አውድ ቃሉ የያዕቆብን ልጆች፣ የእስራኤልን መሥራች አባቶች ያመለክታል። «የእስራኤል አባቶች» ትርጉሙን ለዘመናዊ አንባቢ ግልጽ ያደርጋል።
- source_word: ζηλώσαντες
  choice: በዮሴፍ ቀንተው
  rationale: የግሪኩ የአኦሪስት አጋዥ ግስ ዋናውን ድርጊት ያነሣሣውን ምክንያት ይገልጣል፤ «ቀንተው» ቅናታቸውን ተፈጥሯዊና ቀጥተኛ በሆነ አማርኛ ያስተላልፋል።
- source_word: ἀπέδοντο
  choice: ሸጡት
  rationale: በዮሴፍ ታሪክ አውድ ግሱ በገንዘብ መሸጥን ያመለክታል፤ የነገሩንም ግልጽ ትርጉም ይይዛል።
- source_word: εἰς Αἴγυπτον
  choice: ወደ ግብፅ
  rationale: εἰς ወደ ስፍራ የሚደረግን እንቅስቃሴ ያመለክታል፤ «ወደ ግብፅ» ትክክለኛና ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
- source_word: ἦν ὁ θεὸς μετ’ αὐτοῦ
  choice: እግዚአብሔር ግን ከእርሱ ጋር ነበር
  rationale: አገላለጹ በመከራው ውስጥ ከዮሴፍ ጋር የነበረውን የእግዚአብሔር መገኘት በቀላሉ ይገልጣል። «ግን» በግሪኩ καί የሚፈቀደውን የአውድ ንጽጽር በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: በዮሴፍ መከራ ውስጥ የእግዚአብሔር መገኘት
  choice: እግዚአብሔር ግን ከእርሱ ጋር ነበር
  alternative: እግዚአብሔርም ከእርሱ ጋር ነበር
  rationale: ጽሑፉ ወንድሞቹ ዮሴፍን ቢሸጡትም እግዚአብሔር ከእርሱ ጋር እንደነበር ያረጋግጣል። ትርጉሙ ይህን ውጥረት ይጠብቃል፤ ከቁጥሩ በላይ ስለ መለኮታዊ እቅድ ወይም ጥበቃ አያስፋፋም።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «የእስራኤል አባቶች» የታሪኩን ማጣቀሻ ግልጽ ሲያደርግ፣ «አባቶች» የቃሉን ታሪካዊና ሃይማኖታዊ ክብደት ይጠብቃል።
