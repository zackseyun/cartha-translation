- source_word: ἐν Ἐρυθρᾷ Θαλάσσῃ
  choice: በቀይ ባሕር
  rationale: የግሪኩ ሐረግ ቀጥተኛ ትርጉም «ቀይ ባሕር» ነው፤ በመስተዋድዱ ያለው ሊተረጎም የሚችል የቦታ ስፋት በአማርኛው «በ» ተጠብቋል።
- source_word: ἐν τῇ ἐρήμῳ
  choice: በምድረ በዳ
  rationale: ይህ ምርጫ የእስራኤልን የምድረ በዳ ጉዞ የሚያስታውስ የመጽሐፍ ቅዱስ አጠቃቀም ሲሆን፣ አሸዋማ በረሃን ብቻ አያመለክትም።
