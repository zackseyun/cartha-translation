  rationale: ጠቋሚው ቃል ወደ ሙሴ በአጽንዖት ይመለከታል፤ «ይህ ሰው» የእስጢፋኖስን ንግግራዊ አጽንዖት በተፈጥሯዊ አማርኛ ይጠብቃል።
