  rationale: እስጢፋኖስ በንግግሩ ሙሴን በተደጋጋሚ በአጽንዖት ያመለክታል። ጥቅሱ የሙሴን የሰው ወኪልነት በቀጥታ ይገልጻል፤ ይህን ማቆየት እርሱ ከእግዚአብሔር ተለይቶ በራሱ ኃይል ሠራ የሚል ተጨማሪ አቋም አያስገባም።
