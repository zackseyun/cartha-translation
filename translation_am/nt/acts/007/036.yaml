  language: am
  text: ይህ ሰው በግብፅ ምድር፣ በቀይ ባሕር[a] እና በምድረ በዳ ለአርባ ዓመት ድንቆችንና ምልክቶችን እያደረገ አወጣቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በሸንበቆ ባሕር»። የግሪኩ ጽሑፍ «ቀይ ባሕር» (Ἐρυθρὰ Θάλασσα) ይላል፤ ይህም እስራኤል የተሻገረበትን ስፍራ ለመጥራት በአዲስ ኪዳንና በሰብዓ ሊቃናት ትርጉም የተለመደው ስያሜ ነው።
