- source_word: ποιήσας
  choice: እያደረገ
  rationale: የግስ ተሳቢው ሙሴ ሕዝቡን ባወጣበት ሂደት ድንቆችና ምልክቶች ማድረጉን ያገናኛል፤ ይህ አተረጓጎም ግንኙነቱን በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: τέρατα καὶ σημεῖα
  choice: ድንቆችንና ምልክቶችን
  rationale: «ድንቆች» አድናቆትና ፍርሃት የሚያስነሱ ሥራዎችን፣ «ምልክቶች» ደግሞ የሚያመለክቱ ተአምራዊ ድርጊቶችን በመለየት የሉቃስን የቃላት ጥምረት ይጠብቃሉ።
