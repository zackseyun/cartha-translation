lexical_decisions:
- source_word: Ἀκούοντες δὲ ταῦτα
  choice: ይህን በሰሙ ጊዜ
  rationale: የግሱን የጊዜ ሁኔታ በተፈጥሯዊ አማርኛ ያሳያል። δὲ እዚህ የትረካ እድገትን በቀላሉ የሚያመለክት ስለሆነ በተለየ ቃል አልተተረጎመም፤ ταῦτα የእስጢፋኖስን ቀዳሚ ንግግር ይመለከታል።
- source_word: διεπρίοντο ταῖς καρδίαις αὐτῶν
  choice: ልባቸው በቁጣ ተቃጠለ
  rationale: ግሱ ቃል በቃል ‘ተቆረጡ/ተሰነጠቁ’ የሚል ምስል ቢኖረውም፣ በዚህ አውድ ከፍተኛ የውስጥ መቆጣትን ያመለክታል። ‘ልባቸው በቁጣ ተቃጠለ’ በዘመናዊ አማርኛ ይህን ኃይለኛ ስሜት በግልጽ ያስተላልፋል፤ የመቆረጥ ምስሉ በማስታወሻው ተጠብቋል።
- source_word: ἔβρυχον τοὺς ὀδόντας ἐπ’ αὐτόν
  choice: በእስጢፋኖስም ላይ ጥርሳቸውን አፋጩበት
  rationale: የግሪኩን የጠላትነት አቅጣጫና የቁጣ ምስል ያስተላልፋል። በቁጥሩ ውስጥ ‘እርሱ’ የሚያመለክተው እስጢፋኖስን መሆኑን ለአማርኛ አንባቢ ግልጽ ለማድረግ ስሙ ተደግሟል።
