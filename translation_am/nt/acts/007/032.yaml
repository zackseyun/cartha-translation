  yaml_path: translation/nt/acts/007/032.yaml
  text: I am the God of your fathers[a], the God of Abraham and Isaac and Jacob[b]. Then Moses became terrified and did not dare to look closely.
translation:
  language: am
  text: “እኔ የአባቶችህ አምላክ፣ የአብርሃም፣ የይስሐቅና የያዕቆብ አምላክ ነኝ።” ሙሴም እጅግ ፈርቶ በጥንቃቄ ለመመልከት[a] አልደፈረም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለመመርመር” ወይም “በትኩረት ለማስተዋል።” የግሪኩ ግስ በጥንቃቄ ማየትን ወይም በትኩረት ማስተዋልን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ ὁ θεὸς τῶν πατέρων σου
  choice: እኔ የአባቶችህ አምላክ … ነኝ
  rationale: ግሪኩ ግስ የሌለው የማንነት መግለጫ ሲሆን Ἐγώ አጽንዖት አለው። በተፈጥሯዊ አማርኛ ‘እኔ … ነኝ’ ብሎ መተርጎም የመግለጫውን ኃይል ይጠብቃል። ‘አባቶችህ’ የቃሉን ቀጥተኛና የቃል ኪዳን ይዘት ያቆያል።
- source_word: ὁ θεὸς Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: የአብርሃም፣ የይስሐቅና የያዕቆብ አምላክ
  rationale: ሦስቱን ስሞች በተፈጥሯዊ የአማርኛ አያያዝ ያቀርባል፤ የተደገመውን ‘አምላክ’ በመጨረሻ ማስቀመጥ የግሪኩን ትርጉም ሳያጣ አረፍተ ነገሩን ግልጽ ያደርገዋል።
- source_word: ἔντρομος δὲ γενόμενος
  choice: ሙሴም እጅግ ፈርቶ
  rationale: ἔντρομος ከባድ ፍርሃትን ወይም መንቀጥቀጥን ያመለክታል። ‘እጅግ ፈርቶ’ በዘመናዊ አማርኛ የፍርሃቱን ጥንካሬ በተፈጥሯዊ ሁኔታ ያስተላልፋል፤ δέ በ‘ም’ እንደ ለስላሳ የትረካ ሽግግር ተገልጧል።
- source_word: οὐκ ἐτόλμα
  choice: አልደፈረም
  rationale: ይህ በአማርኛ ‘አልደፈረም’ ተብሎ በቀጥታና በተፈጥሯዊ መንገድ ይገለጣል።
- source_word: κατανοῆσαι
  choice: በቅርብ ለማየት
  rationale: κατανοέω በጥንቃቄ ማየት፣ መመርመር ወይም በትኩረት ማስተዋል ሊያመለክት ይችላል። በእሳቱ ቁጥቋጦ ዐይናዊ አውድ ‘በቅርብ ለማየት’ ተገቢና ተፈጥሯዊ ነው፤ ሌሎቹ አማራጮች በማስታወሻ ተጠብቀዋል።
