base_translation:
  language: en
  yaml_path: translation/nt/acts/007/021.yaml
  text: But when he had been exposed[b][a], Pharaoh’s daughter took him up and raised him as her own son.
translation:
  language: am
  text: ነገር ግን እርሱ ወደ ውጭ ከተጣለ በኋላ፣ የፈርዖን ሴት ልጅ አነሣችው[a]፤ ለራሷ እንደ ወንድ ልጅ[b] አድርጋ አሳደገችው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወሰደችው።” የግሪክኛው ግስ ወደ ውጭ የተጣለን ሕፃን ማንሣት ወይም መውሰድ ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ለራሷ ልጅ አድርጋ።” ቃል በቃል፣ “ለራሷ ወደ ወንድ ልጅ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκτεθέντος
  choice: ወደ ውጭ በተጣለ ጊዜ
  rationale: The passive participle depicts the infant being put outside or exposed. This wording preserves the concrete action without adding the stronger implication of deliberate permanent abandonment.
- source_word: δὲ
  choice: ነገር ግን
  rationale: Marks the narrative contrast between Moses being cast out and Pharaoh’s daughter taking him up.
- source_word: ἀνείλατο
  choice: አነሣችው
  rationale: Conveys taking up an exposed child while keeping this action distinct from the subsequent rearing of him as a son.
- source_word: ἡ θυγάτηρ Φαραὼ
  choice: የፈርዖን ሴት ልጅ
  rationale: A clear, natural Amharic rendering of the genitival phrase; ሴት ልጅ explicitly identifies a daughter.
- source_word: ἀνεθρέψατο
  choice: አሳደገችው
  rationale: The standard modern Amharic expression for rearing or bringing up a child.
- source_word: ἑαυτῇ
  choice: ለራሷም
  rationale: Preserves the reflexive dative and indicates that she reared him in relation to herself.
- source_word: εἰς υἱόν
  choice: እንደ ወንድ ልጅ
  rationale: Preserves the resulting filial role and the masculine sense of υἱός without collapsing the phrase into a technical claim about a specific legal adoption procedure.
theological_decisions: []
translation_notes:
  register: Modern standard Amharic in Ge’ez script, with a dignified but accessible narrative style. The wording retains the sequence of exposure, taking up, and rearing, and avoids importing a more specific legal notion of adoption than the Greek itself states.
