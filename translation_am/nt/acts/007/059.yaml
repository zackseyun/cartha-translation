base_translation:
  language: en
  yaml_path: translation/nt/acts/007/059.yaml
  text: And they were stoning Stephen as he called out and said[a], “Lord Jesus, receive my spirit.”
translation:
  language: am
  text: እስጢፋኖስን፣ “ጌታ ኢየሱስ ሆይ፣ መንፈሴን ተቀበል” ብሎ እየጠራ[a] ሳለ፣ በድንጋይ ይወግሩት ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እየተማጸነ።” የግሪኩ ቃል አንድን ሰው መጥራት ወይም በልመና መጥራትን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλιθοβόλουν
  choice: ይወግሩት ነበር
  rationale: የግሪኩ ኢምፐርፌክት ግስ ድርጊቱ በሂደት ላይ እንደነበር ያሳያል፤ ይህ አገላለጽም በአማርኛ ተፈጥሯዊ ሆኖ የቀጣይነቱን ስሜት ይጠብቃል።
- source_word: ἐπικαλούμενον
  choice: እየተማጸነ
  rationale: በዚህ አውድ ቃሉ እስጢፋኖስ ጌታ ኢየሱስን በቀጥታ እየጠራና ልመና እያቀረበ መሆኑን ያመለክታል፤ ‘እየተማጸነ’ ይህን የጸሎት ስሜት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: λέγοντα
  choice: ብሎ
  rationale: ከἐπικαλούμενον ጋር የተያያዘውን የተናገረውን ቃል በአማርኛ ቀጥተኛና ተፈጥሯዊ በሆነ መንገድ ያስገባል።
- source_word: Κύριε Ἰησοῦ
  choice: ጌታ ኢየሱስ ሆይ
  rationale: ቀጥተኛውን የአክብሮት ጥሪ ይጠብቃል፤ ‘ሆይ’ የግሪኩን ቮኬቲቭ በተፈጥሯዊና የተከበረ አማርኛ ያሳያል።
- source_word: δέξαι
  choice: ተቀበል
  rationale: በልመናው ውስጥ ያለውን ቀጥተኛ ትእዛዛዊ ጥያቄ እና ራስን በአደራ የመስጠት ስሜት በግልጽ ሁኔታ ያስተላልፋል።
- source_word: τὸ πνεῦμά μου
  choice: መንፈሴን
  rationale: በሞት ጊዜ በአደራ የሚሰጠውን የእስጢፋኖስን መንፈስ በቀጥታና በተለመደ መጽሐፍ ቅዱሳዊ ቃል ይገልጣል።
theological_decisions:
- issue: የእስጢፋኖስ ንግግር ወደ ተነሣው ኢየሱስ የቀረበ ልመና መሆኑን በትርጉሙ ማሳየት
  choice: ‘እየተማጸነ’ ተብሎ ተተርጉሞ፣ ‘ጌታ ኢየሱስ ሆይ’ የሚለው ቀጥተኛ አድራሻ ተጠብቋል።
  alternative: ‘እየጠራ’ ወይም ‘እየተጣራ’ ብሎ መተርጎም
  rationale: የግሪኩ ጽሑፍ እስጢፋኖስ ኢየሱስን በቀጥታ እንደሚናገር ያሳያል። ἐπικαλούμενον የመጥራትን ወይም በጸሎት የመማጸንን ስሜት ሊይዝ ስለሚችል፣ ትርጉሙ ይህን አያደበዝዝም፤ ነገር ግን ከጽሑፉ በላይ የሆነ የእምነት ሥርዓታዊ ትርጓሜ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ኢምፐርፌክት በ‘ይወግሩት ነበር’፣ በድርጊቱ መካከል የተከናወነው ልመና ደግሞ በ‘እየተማጸነ ሳለ’ ተገልጧል።
