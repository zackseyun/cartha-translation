  text: ἀποστείλας δὲ Ἰωσὴφ μετεκαλέσατο ⸂Ἰακὼβ τὸν πατέρα αὐτοῦ⸃ καὶ πᾶσαν τὴν συγγένειαν ἐν ψυχαῖς ἑβδομήκοντα πέντε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/014.yaml
  text: Then Joseph sent and summoned Jacob his father and all his relatives[a], seventy-five persons in all.
translation:
  language: am
  text: ከዚያም ዮሴፍ ልኮ አባቱን ያዕቆብንና ዘመዶቹን ሁሉ አስጠራ፤ በአጠቃላይ ሰባ አምስት ሰዎች ነበሩ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የብሉይ ኪዳን ክፍሎች ጠቅላላ ቁጥሩን ‘ሰባ’ ብለው ይገልጻሉ (ለምሳሌ፣ የዘፍጥረት 46፥27 እና የዘፀአት 1፥5 የዕብራይስጥ ጽሑፍ)፤ እዚህ ግን የሐዋርያት ሥራ ‘ሰባ አምስት’ ይላል።
    reason: cross_reference
lexical_decisions:
- source_word: ἀποστείλας
  choice: መልእክት ልኮ
  rationale: ቃሉ በቀጥታ ‘ልኮ’ ማለት ቢሆንም የተላከው ሰው ወይም መልእክት በግልጽ አልተጠቀሰም፤ በአማርኛ ‘መልእክት ልኮ’ የመጥራቱን እርምጃ በተፈጥሯዊ ሁኔታ ያቀርባል።
- source_word: δὲ
  choice: ከዚያም
  rationale: በትረካው ውስጥ የሚቀጥለውን ክስተት ያመለክታል።
- source_word: μετεκαλέσατο
  choice: አስጠራ
  rationale: ግሱ አንድን ሰው እንዲመጣ መጥራትን ወይም ሰው ልኮ ማስመጣትን ያመለክታል፤ ‘አስጠራ’ በዚህ አውድ አጭርና ተፈጥሯዊ ነው።
- source_word: Ἰακὼβ τὸν πατέρα αὐτοῦ
  choice: አባቱ ያዕቆብን
  rationale: የግሪኩን ተዛማጅ ስያሜ በተፈጥሯዊ የአማርኛ ቃል ቅደም ተከተል ያቀርባል።
- source_word: πᾶσαν τὴν συγγένειαν
  choice: ዘመዶቹን ሁሉ
  rationale: συγγένεια የዝምድና ቡድንን ወይም ዘመዶችን ያመለክታል፤ ‘ዘመዶቹ’ የቤተሰብ አባላትን ብቻ ከሚያስመስል ‘ቤተሰቡ’ ይልቅ ሰፊና ግልጽ ነው።
- source_word: ἐν ψυχαῖς
  choice: በጠቅላላው … ሰዎች
  rationale: ቃል በቃል ‘በነፍሳት’ ቢሆንም እዚህ ሰዎችን የመቁጠር ፈሊጥ ነው፤ ይህ አተረጓጎም የቁጥሩን ትርጉም ያለ አላስፈላጊ ሥነ መለኮታዊ ጭነት ያስተላልፋል።
- source_word: ἑβδομήκοντα πέντε
  choice: ሰባ አምስት
  rationale: የግሪኩን ቁጥር በቀጥታ ያስተላልፋል።
theological_decisions:
- issue: የያዕቆብ ወገኖች ጠቅላላ ቁጥር ከዘፍጥረትና ከዘፀአት የጽሑፍ ባህሎች ጋር ያለው ልዩነት
  choice: ሰባ አምስት ሰዎች
  alternative: ሰባ ሰዎች
  rationale: የሐዋርያት ሥራ የግሪክ ጽሑፍ ‘ሰባ አምስት’ ብሎ በግልጽ ይናገራል። ከአንዳንድ የብሉይ ኪዳን ጽሑፎች ‘ሰባ’ ከሚለው ጋር ያለውን ልዩነት በማስማማት ፈንታ የሐዋርያት ሥራን ንባብ በዋናው ጽሑፍ ጠብቀን ልዩነቱን በማስታወሻ አሳይተናል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅመናል። ‘ነፍሳት’ የሚለውን ቃል በቃል አገላለጽ ትተን የቁጥር ፈሊጡን ‘ሰዎች’ ብለን አቅርበናል።
