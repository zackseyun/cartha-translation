- source_word: λιμὸς
  choice: ረሃብ
  rationale: ሰፊ የምግብ እጥረትን የሚገልጽ የተለመደና ግልጽ የአማርኛ ቃል ነው።
- source_word: ἐφ’ ὅλην τὴν Αἴγυπτον καὶ Χανάαν
  choice: በመላው ግብፅና ከነዓን
  rationale: ἐπί ከተሳቢ ጋር የሚያሳየውን በክልሎቹ ሁሉ ላይ የተዘረጋ ወሰን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: Χανάαν
  choice: ከነዓን
  rationale: የቦታው ስም በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የታወቀበት ቅርጽ ነው።
- source_word: θλῖψις μεγάλη
  choice: ታላቅ መከራ
  rationale: ከረሃቡ ጋር የመጣውን ከባድ ጭንቀትና ችግር ይገልጻል፤ የፍጻሜ ዘመን ልዩ ትርጉም አይጭንበትም።
- source_word: οὐχ ηὕρισκον
  choice: ማግኘት አልቻሉም
  rationale: ያልተቋረጠውን ተግባራዊ አለመቻል ከግሪኩ ኢምፐርፌክት አንጻር በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: χορτάσματα
  choice: ምግብ
  rationale: የምግብ አቅርቦትን በሰፊው የሚያመለክት ግልጽ ቃል ነው፤ «እህል» የሚለውን ጠባብ ትርጉም አያስገባም።
- source_word: οἱ πατέρες ἡμῶν
  choice: አባቶቻችን
  rationale: ግሪኩ በቀጥታ «አባቶቻችን» ይላል፣ በዚህም እስራኤላውያን ቀደምት አባቶችን ያመለክታል።
