  text: በመላው ግብፅና ከነዓን ረሃብና ታላቅ መከራ መጣ፤ አባቶቻችን[ሀ]ም ምግብ ማግኘት አልቻሉም።
  philosophy: optimal-equivalence
  footnotes:
