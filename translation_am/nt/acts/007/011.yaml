    text: ወይም፣ «የቀድሞ አያቶቻችን»። ግሪኩ «አባቶቻችን» ይላል፤ ይህም የእስራኤልን ቀደምት አባቶች ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
