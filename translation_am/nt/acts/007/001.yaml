lexical_decisions:
- source_word: Εἶπεν
  choice: አለ
  rationale: የλέγω የአንድ ጊዜ ያለፈ ድርጊት ቅርጽ በቀጥታ ‘አለ’ ተብሎ ተተርጉሟል፤ ንግግሩ ጥያቄ ቢሆንም የግሪኩን የትረካ አቀራረብ ይጠብቃል።
- source_word: δὲ
  choice: -ም
  rationale: እዚህ δέ ትረካውን ወደ ቀጣዩ ድርጊት ያሸጋግራል፤ በአማርኛ ከስሙ ጋር የተያያዘው ‘-ም’ ተፈጥሯዊ የትረካ ትስስር ይሰጣል።
- source_word: ἀρχιερεύς
  choice: ሊቀ ካህናቱ
  rationale: በዚህ የፍርድ ሸንጎ አውድ ያለውን አንድ ሰብሳቢ ሊቀ ካህናት የሚያመለክት የተለመደና ትክክለኛ ቃል ነው።
- source_word: Εἰ
  choice: -ን
  rationale: εἰ ቀጥተኛ የአዎንና የአይደለም ጥያቄ ያስገባል፤ ይህም በአማርኛ ‘ናቸውን?’ በሚለው የጥያቄ ቅጥያ ተገልጿል።
- source_word: ταῦτα
  choice: እነዚህ ነገሮች
  rationale: ቃሉ የብዙ ቁጥር አመልካች ሆኖ ከዚህ በፊት የተነገሩትን ክሶች ይመለከታል፤ ‘ክሶች’ ብሎ ትርጉሙን ከማብራራት ይልቅ የግሪኩን ክፍትነት ይጠብቃል።
- source_word: οὕτως
  choice: እንዲህ
  rationale: የተጠቀሱት ነገሮች በተነገሩበት ሁኔታ እውነት መሆናቸውን የሚጠይቀውን አጭርና ተፈጥሯዊ አገላለጽ ይሰጣል።
- source_word: ἔχει
  choice: ናቸው
  rationale: οὕτως ἔχει የሚለው ፈሊጥ ‘እንዲህ ነው/እውነቱ ይህ ነው’ የሚል ፍቺ አለው፤ ከብዙ ቁጥሩ ‘እነዚህ ነገሮች’ ጋር ‘ናቸው’ በተፈጥሮ ይስማማል።
