  text: ἐλάλησεν ⸀δὲ οὕτως ὁ θεὸς ὅτι ἔσται τὸ σπέρμα αὐτοῦ πάροικον ἐν γῇ ἀλλοτρίᾳ, καὶ δουλώσουσιν αὐτὸ καὶ κακώσουσιν ἔτη τετρακόσια·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/006.yaml
  text: 'But God spoke in this way: that his offspring would be a foreign resident in a strange land[a], and they would enslave it and mistreat it for four hundred years.'
translation:
  language: am
  text: እግዚአብሔርም እንዲህ ተናገረ፦ “ዘሩ በባዕድ ምድር መጻተኛ ይሆናል፤ እነርሱም ለአራት መቶ ዓመት ባሪያ ያደርጉታልና ያንገላቱታል።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም በተፈጥሯዊ አገላለጽ፦ “ዘሮቹ በባዕድ ምድር መጻተኞች ይሆናሉ፤ እነርሱም ለአራት መቶ ዓመት ባሪያ ያደርጓቸዋልና ያንገላቷቸዋል።” የግሪኩ ጽሑፍ “ዘር ... እርሱን” የሚል ስብስባዊ ነጠላ ቅርጽ ይጠቀማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλησεν δὲ οὕτως ὁ θεὸς
  choice: እግዚአብሔርም እንዲህ ተናገረ
  rationale: δέ የንግግሩን ቀጣይነትና መጠነኛ ሽግግር በ“ም” ያሳያል፤ οὕτως ደግሞ “እንዲህ” ተብሎ በግልጽ ተጠብቋል።
- source_word: τὸ σπέρμα αὐτοῦ
  choice: ዘሩ
  rationale: σπέρμα በዚህ አውድ የአብርሃምን የዘር ሐረግ በነጠላ የሚያመለክት የስብስብ ስም ነው፤ “ዘሩ” ይህን ቅርጽና ትርጉም ይጠብቃል።
- source_word: πάροικον ἐν γῇ ἀλλοτρίᾳ
  choice: በሌላ ሰው ምድር መጻተኛ
  rationale: πάροικος በራሱ ባልሆነ ስፍራ የሚኖርን መጻተኛ ያመለክታል፤ ἀλλοτρία ደግሞ ምድሪቱ የሌላ ወይም የባዕድ መሆኗን ያጎላል።
- source_word: δουλώσουσιν αὐτὸ
  choice: እነርሱም እርሱን ባሪያ ያደርጉታል
  rationale: δουλόω የባርነት ሁኔታን በግልጽ ስለሚያመለክት “ባሪያ ያደርጉታል” ተብሏል፤ αὐτό ከስብስባዊው ነጠላ “ዘሩ” ጋር በነጠላ ተስማምቶ ተጠብቋል።
- source_word: κακώσουσιν
  choice: ያንገላቱታል
  rationale: ቃሉ ጉዳት ማድረስንና በክፉ መያዝን በሰፊው ያመለክታል፤ “ያንገላቱታል” በዘመናዊ አማርኛ ይህን በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: ἔτη τετρακόσια
  choice: ለአራት መቶ ዓመት
  rationale: የጊዜውን ቆይታ በተፈጥሯዊ የአማርኛ አገላለጽ ያሳያል።
theological_decisions:
- issue: የአብርሃምን ዘር የሚያመለክተውን ስብስባዊ ነጠላ ቅርጽ አተረጓጎም
  choice: በዋናው ጽሑፍ “ዘሩ ... እርሱን ... ያደርጉታል ... ያንገላቱታል” በማለት የግሪኩ ነጠላ ቅርጽ ተጠብቋል።
  alternative: “ዘሮቹ ... እነርሱን ... ያደርጓቸዋል ... ያንገላቷቸዋል” በማለት በብዙ ቁጥር መተርጎም።
  rationale: σπέρμα ... αὐτό ስብስባዊ ትርጉም ያለው ነጠላ አገላለጽ ነው። ዋናው ጽሑፍ ይህን ጉልህ የቃል ቅርጽ ይጠብቃል፤ ለአማርኛ አንባቢ ይበልጥ ተፈጥሯዊ የሆነው የብዙ ቁጥር አማራጭ በማስታወሻ ተሰጥቷል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ስብስባዊ ነጠላ ቅርጽ በዋናው ጽሑፍ ሆን ተብሎ ተጠብቋል፤ ተፈጥሯዊው የብዙ ቁጥር አማራጭ በእግር ማስታወሻ ቀርቧል።
