  rationale: የግሪኩ ቃል ‘ከዳተኞች’ ሊባል ቢችልም፣ በዚህ ትረካ ኢየሱስን ለመገደል አሳልፎ መስጠትን ያጎላል፤ የፖለቲካ ክህደትን ብቻ አያስገባም።
