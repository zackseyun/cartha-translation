  rationale: προ- የሚያመለክተውን ቀደምተኛነትና ἀγγέλλω የሚያመለክተውን ማወጅ ሁለቱንም ይጠብቃል።
- source_word: περὶ τῆς ἐλεύσεως
  choice: መምጣት
