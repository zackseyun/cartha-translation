  rationale: አውዱ ነቢያት መምጣቱን አስቀድመው ያወጁለትን ኢየሱስን ይጠቁማል። ‘ጻድቁ’ የδικαίουን የጽድቅ ሐሳብና የመጠሪያ ኃይል ያለ ተጨማሪ የኑፋቄ ትርጓሜ ይጠብቃል።
