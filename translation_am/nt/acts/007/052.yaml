- source_word: οὗ
  choice: እርሱን
  rationale: የግሪኩ ዘርፍ ዝምድና በአማርኛ ከ‘አሳልፋችሁ ሰጪዎች’ አገባብ ጋር በተፈጥሯዊ የቀጥታ ተሳቢ ቅርጽ ተገልጿል።
- source_word: νῦν
  choice: አሁን
  rationale: በአባቶቻቸው ቀደምት ድርጊትና በአድማጮቹ የአሁን ተጠያቂነት መካከል ያለውን ጊዜያዊ ንጽጽር ይጠብቃል።
- source_word: προδόται
  choice: አሳልፋችሁ ሰጪዎች
  rationale: በዚህ አውድ ኢየሱስን አሳልፎ የመስጠትን ግላዊ ድርጊት ያሳያል፤ ‘ከዳተኞች’ ሊያመጣ የሚችለውን ሰፊ ፖለቲካዊ ጥላ ያስወግዳል።
- source_word: φονεῖς
  choice: ገዳዮች
