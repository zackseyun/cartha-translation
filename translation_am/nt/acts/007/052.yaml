- source_word: οἱ πατέρες ὑμῶν
  choice: አባቶቻችሁ
  rationale: የግሪኩን ቀጥተኛ አገላለጽና እስጢፋኖስ በቀደሙትና በአድማጮቹ መካከል የሚያሳየውን ተጠያቂነት ይጠብቃል።
- source_word: ἀπέκτειναν
  choice: ገደሉ
  rationale: ቀላል፣ ዘመናዊና የግሪኩን ድርጊት በቀጥታ የሚገልጽ ቃል ነው።
- source_word: τοὺς προκαταγγείλαντας
