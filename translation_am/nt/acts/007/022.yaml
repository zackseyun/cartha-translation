  text: καὶ ἐπαιδεύθη ⸀Μωϋσῆς πάσῃ σοφίᾳ Αἰγυπτίων, ἦν δὲ δυνατὸς ἐν λόγοις καὶ ἔργοις ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/022.yaml
  text: And Moses was educated in all the wisdom of the Egyptians, and he was mighty in his words and deeds.
translation:
  language: am
  text: ሙሴም የግብፃውያንን ጥበብ ሁሉ ተማረ፤ በቃላቱና በሥራዎቹም ኃያል ነበር።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በንግግሩና በድርጊቶቹ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαιδεύθη
  choice: ተማረ
  rationale: በዚህ አውድ የተቀበለውን ሰፊ ትምህርትና ሥልጠና በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: πάσῃ σοφίᾳ Αἰγυπτίων
  choice: የግብፃውያንን ጥበብ ሁሉ
  rationale: πάσῃ የሚያሳየውን ስፋትና Αἰγυπτίων የሚያሳየውን ባለቤትነት/ምንጭ ጠብቆ በአማርኛ ተፈጥሯዊ አገባብ ያቀርባል።
- source_word: δυνατὸς
  choice: ኃያል
  rationale: የቃሉን የኃይልና የብቃት ትርጉም ይጠብቃል፤ ከቃላትና ከሥራዎች ጋርም የተለመደ መጽሐፍ ቅዱሳዊ አገላለጽ ነው።
- source_word: ἐν λόγοις καὶ ἔργοις αὐτοῦ
  choice: በቃላቱና በሥራዎቹ
  rationale: λόγοις/ἔργοις ያለውን ትይዩ አገላለጽ ይጠብቃል፤ αὐτοῦ ሁለቱንም የሙሴ ቃላትና ሥራዎች እንደሚያመለክት በግልጽ ያሳያል።
theological_decisions:
- issue: λόγοις ላይ የሙሴ ብቃት ከዘፀአት 4፥10 ጋር የሚፈጥረው ውጥረት
  choice: “በቃላቱና በሥራዎቹም ኃያል ነበር” ተብሎ የሐዋርያት ሥራ ንግግር በራሱ አገላለጽ ተጠብቋል።
  alternative: “ውጤታማ ነበር” ወይም የሙሴን የንግግር ብቃት የሚያለዝብ ሐረግ መጠቀም።
  rationale: ጽሑፉ ሙሴን በቃላትና በሥራዎች ኃያል እንደነበር በቀጥታ ይናገራል። ከዘፀአት 4፥10 ጋር ያለው የትርጓሜ ውጥረት በትርጉሙ ውስጥ አልተፈታም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ጥበብ ሁሉ” እና “ኃያል” የግሪኩን ስፋትና ጥንካሬ ይጠብቃሉ።
