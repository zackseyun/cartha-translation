  text: And he stayed in Joppa for many days with a certain Simon[a], a tanner.
translation:
  language: am
  text: እርሱም በኢዮጴ ስምዖን ከሚባል አንድ ቆዳ ፋቂ ጋር[a] ብዙ ቀናት ቆየ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ስምዖን ከሚባል አንድ ቆዳ ፋቂ ቤት።” የግሪኩ መስተዋድድ በሰውየው ቤት ማደሩን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ... μεῖναι
  choice: ቆየ
  rationale: ἐγένετο ከመኖርን ከሚገልጸው የድርጊት ስም ጋር የተሠራው አገላለጽ በዚህ ዐውድ ዋናውን ድርጊት ያስተላልፋል፤ በአማርኛም “ቆየ” ማለት ተፈጥሯዊና ግልጽ ነው።
- source_word: δὲ
  choice: -ም
  rationale: δὲ ንግግሩን ወደ ቀጣዩ ትረካ የሚያሸጋግር ለስላሳ አያያዥ ነው፤ ከ“እርሱ” ጋር የተያያዘው “-ም” ይህን ፍሰት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἡμέρας ἱκανὰς
  choice: ብዙ ቀን
  rationale: ἱκανός ከጊዜ መግለጫ ጋር “ብዙ” ወይም “ከፍ ያለ ብዛት” የሚል ሐሳብ ይሰጣል፤ “ብዙ ቀን” ቆይታውን ቀጥተኛና ተፈጥሯዊ በሆነ መንገድ ያሳያል።
- source_word: ἐν Ἰόππῃ
  choice: በኢዮጴ
  rationale: Ἰόππη የቦታ ስም ስለሆነ በአማርኛ የተለመደው “ኢዮጴ” የሚለው ቅርጽ ተጠብቋል።
- source_word: παρά τινι Σίμωνι
  choice: ስምዖን ከተባለ ሰው ጋር
  rationale: τινι ሰውየውን ለአንባቢው ገና ያልተለየ ሰው አድርጎ ያቀርባል፤ παρά ከዳቲቭ ጋር አብሮ መቆየትን ወይም በሰውየው ቤት ማረፍን ሊያመለክት ይችላል። ዋናው ጽሑፍ ግልጽና ተፈጥሯዊውን “ጋር” ይጠቀማል፤ የመኖሪያ ቤት ሐሳብ በማስታወሻ ተጠብቋል።
- source_word: βυρσεῖ
  choice: ቆዳ ፋቂ
  rationale: βυρσεύς ጥሬ ቆዳን ፈትጎ ለጥቅም የሚያዘጋጅ ሰውን በተለይ ያመለክታል፤ “ቆዳ ፋቂ” ይህን ሙያ ከአጠቃላዩ “የቆዳ ሠራተኛ” ይበልጥ በትክክል ይገልጻል።
