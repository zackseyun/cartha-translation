lexical_decisions:
- source_word: ᾐτήσατο παρ’ αὐτοῦ
  choice: ከእርሱ ጠየቀ
  rationale: παρά ከዚህ ግስ ጋር ጥያቄው ከማን እንደቀረበ ያመለክታል፤ ይህ አተረጓጎም ትርጉሙን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐπιστολὰς
  choice: ደብዳቤዎችን
  rationale: ቃሉ በቀጥታ ደብዳቤዎችን ያመለክታል፤ የሥልጣን ፈቃድ የሚለው ሐሳብ ከአውዱ ቢገባም በዋናው ጽሑፍ ላይ አልተጨመረም።
- source_word: εἰς Δαμασκὸν πρὸς τὰς συναγωγάς
  choice: በደማስቆ ላሉት ምኩራቦች
  rationale: ሁለቱ መስተዋድዶች ደብዳቤዎቹ በደማስቆ ለሚገኙት ምኩራቦች መሆናቸውን ያሳያሉ፤ አገላለጹ ይህን በግልጽና ተፈጥሯዊ አማርኛ ይሰጣል።
- source_word: ὅπως ἐάν
  choice: ቢያገኝ ... እንዲችል
  rationale: ὅπως የዓላማን ሐሳብ፣ ἐάν ደግሞ ሁኔታዊነትን ያሳያል፤ የአማርኛው አወቃቀር ሁለቱንም ይጠብቃል።
- source_word: τινας
  choice: ማንኛዎቹንም
  rationale: በሁኔታዊ አውድ ያለውን ያልተወሰነ ብዙ ቁጥር ያሳያል።
- source_word: τῆς ὁδοῦ ὄντας
  choice: የ«መንገዱ» ወገን የሆኑትን
  rationale: ይህ ለቀድሞው የክርስቲያኖች እንቅስቃሴ የተሰጠ መጠሪያ ነው። «መንገዱ» የሚለውን ታሪካዊ መጠሪያ በማቆየት የወገንነት ግንኙነቱንም በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἄνδρας τε καὶ γυναῖκας
  choice: ወንዶችንም ሴቶችንም
  rationale: ግሪኩ ሁለቱንም በግልጽ ይጠቅሳል፤ ትርጉሙም ይህን አጽንዖት ሳያጠፋ ያቀርባል።
- source_word: δεδεμένους ἀγάγῃ
  choice: አስሮ ... ማምጣት
  rationale: δεδεμένους ታስረው ባለ ሁኔታ መምጣታቸውን ያሳያል፤ «አስሮ ማምጣት» ይህን በወቅታዊና ተፈጥሯዊ አማርኛ ይገልጻል፣ የሰንሰለትን ዓይነት ግን አይጨምርም።
- source_word: εἰς Ἰερουσαλήμ
  choice: ወደ ኢየሩሳሌም
  rationale: εἰς ከከተማ ስም ጋር የመድረሻ አቅጣጫን ያመለክታል፤ «ወደ» ተገቢው የአማርኛ አቻ ነው።
theological_decisions:
- issue: τῆς ὁδοῦ የሚለውን ቀደምት የእንቅስቃሴው መጠሪያ መተርጎም
  choice: የ«መንገዱ» ወገን የሆኑትን
  alternative: «መንገዱን» የሚከተሉትን
  rationale: የተመረጠው አገላለጽ የግሪኩን የወገንነት ግንኙነትና ታሪካዊ መጠሪያውን ይጠብቃል፤ «ተከታዮች» የሚለውን ትርጓሜ በዋናው ጽሑፍ ላይ አያስገባም።
- issue: ἄνδρας τε καὶ γυναῖκας የሁለቱንም ፆታዎች ግልጽ ጥቀሳ መጠበቅ
  choice: ወንዶችንም ሴቶችንም
  alternative: ሰዎችን
  rationale: የግሪኩ ጽሑፍ የሳውል የማሰር ዓላማ ወንዶችንም ሴቶችንም እንደሚያካትት በተለይ ያጎላል፤ አጠቃላይ «ሰዎች» የሚለው ይህን አጽንዖት ያጠፋል።
