  rationale: በዚህ የጠላትነት አውድ εἰς የዛቻውና የግድያው አቅጣጫ በደቀ መዛሙርቱ ላይ መሆኑን ያሳያል።
- source_word: μαθητὰς
  choice: ደቀ መዛሙርት
  rationale: በሐዋርያት ሥራ ውስጥ ለኢየሱስ ተከታዮች የሚውለውን መደበኛና ትክክለኛ መጽሐፍ ቅዱሳዊ ቃል ይጠብቃል።
- source_word: τοῦ κυρίου
  choice: የጌታ
  rationale: በዚህ አውድ ደቀ መዛሙርቱ የሚከተሉትንና የሚገዙለትን ኢየሱስን ያመለክታል፤ ‘ጌታ’ ለκύριος መደበኛና የተፈጥሮ አማርኛ ትርጉም ነው።
- source_word: προσελθὼν
  choice: ቀረበ
  rationale: ወደ ሊቀ ካህናቱ መሄዱንና በፊቱ መቅረቡን ያሳያል። የግሪኩ አንቀጽ በቁጥር 2 ካለው ዋና ግስ ጋር የሚቀጥል ቢሆንም፣ ይህ ቁጥር ብቻውን በተፈጥሯዊ አማርኛ እንዲነበብ ግስ ሆኖ ተተርጉሟል።
- source_word: ἀρχιερεῖ
  choice: ሊቀ ካህናቱ
  rationale: በነጠላ ቁጥር የተጠቀሰውን ከፍተኛ የካህናት ባለሥልጣን በመደበኛው የአማርኛ መጽሐፍ ቅዱስ አጠራር ይገልጣል።
