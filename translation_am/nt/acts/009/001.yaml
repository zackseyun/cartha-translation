- source_word: φόνου
  choice: ግድያ
  rationale: φόνος የሚያመለክተውን ሰው የመግደል ድርጊትና የሞራል ክብደት ይጠብቃል፤ ‘እልቂት’ የሚለው ደግሞ ከዋናው የቃሉ ክልል ይልቅ ሰፊ ወይም ብዙኃንን የሚያመለክት ሊሆን ይችላል።
- source_word: εἰς τοὺς μαθητὰς
