lexical_decisions:
- source_word: εἶδεν
  choice: አይቷል
  rationale: የግሱ ቅርጽ ያለፈ ጊዜን ቢያመለክትም፣ በዐውዱ ሳውል ቀድሞ ያየውና አሁንም ጠቀሜታ ያለው ራእይ ስለሆነ፣ የአማርኛው ፍጹም ጊዜ ተፈጥሯዊ ነው።
- source_word: ἐν ὁράματι
  choice: በራእይ
  rationale: ሳውል ያየበትን መንገድ በአጭሩና በተለመደ መጽሐፍ ቅዱሳዊ ቃል ያሳያል።
- source_word: ἄνδρα … Ἁνανίαν ὀνόματι
  choice: አናንያ የሚባል ሰው
  rationale: የሰውየውን ስምና ወንድ መሆኑን በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: εἰσελθόντα
  choice: ወደ እርሱ ገብቶ
  rationale: የመግባቱን ድርጊት በግልጽ ያሳያል፤ ‘ወደ እርሱ’ የሚለው በአማርኛ ዐውዱን ተፈጥሯዊ ያደርገዋል።
- source_word: ἐπιθέντα αὐτῷ χεῖρας
  choice: እጆቹን በእርሱ ላይ ሲጭን
  rationale: የግሪኩን አካላዊ ድርጊት ይጠብቃል፤ የሥነ መለኮት ትርጉሙን ከጽሑፉ በላይ አይወስንም።
- source_word: ὅπως ἀναβλέψῃ
  choice: እንዲያይ
  rationale: በዚህ የፈውስ ዐውድ የማየት ችሎታው እንዲመለስ የሚለውን ዓላማ ያሳያል፤ ግሱ በአማርኛ ‘እንደገና እንዲያይ’ ወይም ‘ዓይኑ እንዲበራ’ ተብሎም ሊተረጎም ይችላል።
