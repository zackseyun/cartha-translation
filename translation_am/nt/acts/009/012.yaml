  rationale: ግሪኩ የሚገልጸውን አካላዊ ድርጊት ብቻ ይጠብቃል፤ ሹመትን፣ ምሥጢራዊ ሥርዓትን ወይም የፈውስ ዘዴን አይጨምርም።
