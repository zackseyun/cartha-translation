- source_word: Καισάρειαν
  choice: ቂሳርያ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደው የቦታው ስም ነው።
- source_word: ἐξαπέστειλαν
  choice: ላኩት
