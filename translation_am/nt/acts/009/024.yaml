  text: ነገር ግን ሴራቸው ለሳውል ታወቀ። እነርሱም እርሱን ለመግደል ቀንና ሌሊት በሮቹን[a] ይከታተሉ ነበር።
  philosophy: optimal-equivalence
  footnotes:
