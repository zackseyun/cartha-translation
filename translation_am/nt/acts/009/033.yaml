base_translation:
  language: en
  yaml_path: translation/nt/acts/009/033.yaml
  text: And there he found a certain man named Aeneas[a], bedridden for eight years, who was paralyzed.
translation:
  language: am
  text: በዚያም ስሙ ኤኔያስ የተባለ አንድ ሰው አገኘ፤ እርሱም ሽባ ሆኖ ለስምንት ዓመት በአልጋ[a] ላይ ተኝቶ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ በቃል በቃል፣ «በምንጣፍ» ወይም «በቀላል አልጋ ላይ ተኝቶ»።
    reason: κραβάττος በተለይ ምንጣፍ ወይም ቀላል አልጋ/ፓሌት ሊያመለክት ስለሚችል የቃል አማራጩን ይጠብቃል።
lexical_decisions:
- source_word: εὗρεν δὲ ἐκεῖ
  choice: በዚያም ... አገኘ
  rationale: δέ ቀላል የትረካ ቀጣይነትን በ«ም» ያሳያል፤ ἐκεῖ ደግሞ በተፈጥሯዊ አማርኛ «በዚያ» ተብሏል።
- source_word: ἄνθρωπόν τινα
  choice: አንድ ሰው
  rationale: τις ከዚህ በፊት ያልተዋወቀን የተወሰነ ሰው ያስገባል፤ «አንድ ሰው» ይህን ተግባር በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: ὀνόματι Αἰνέαν
  choice: ስሙ ኤንያ የተባለ
  rationale: የግሪኩን የስም ማስተዋወቂያ አገባብ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ Αἰνέας «ኤንያ» ተብሎ ተጽፏል።
- source_word: ἐξ ἐτῶν ὀκτώ
  choice: ለስምንት ዓመት
  rationale: ሐረጉ እስከዚያ ጊዜ የዘለቀ ቆይታን ይገልጣል፤ «ለስምንት ዓመት» የቆይታውን መጠን በግልጽ ያሳያል።
- source_word: κατακείμενον ἐπὶ κραβάττου
  choice: በአልጋ ላይ ተኝቶ ነበር
  rationale: የግሪኩን ተጨባጭ ምስል—በቀላል አልጋ ወይም ምንጣፍ ላይ መተኛትን—ከ«አልጋ» ጋር በሚነበብ አማርኛ ይጠብቃል።
- source_word: ὃς ἦν παραλελυμένος
  choice: እርሱም ሽባ ስለነበር
  rationale: παραλελυμένος ቀጣይ የሆነ የሽባነት ሁኔታን ይገልጣል። በአማርኛ የመተኛቱን ምክንያት በተፈጥሯዊ ሁኔታ ለማሳየት የምክንያት አገባብ ተጠቅሟል።
