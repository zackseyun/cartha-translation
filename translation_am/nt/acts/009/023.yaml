  text: ብዙ ቀናት ካለፉ በኋላ፣[a] አይሁድ[b] ሳውልን ለመግደል ተማከሩ።[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “ብዙ ቀናት ሲፈጸሙ” ወይም “ሲሞሉ።”
    reason: lexical_alternative
  - marker: b
    text: “አይሁድ” የሚለው በዚህ አውድ ሳውልን የተቃወሙትን የተወሰኑ ሰዎች ያመለክታል እንጂ እያንዳንዱን አይሁዳዊ ያለ ልዩነት አያመለክትም።
    reason: cultural_note
  - marker: c
    text: ወይም፣ “ሴራ ጠነሰሱ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: ካለፉ በኋላ
  rationale: δέን በተናጠል ሳይተረጉም፣ ὡς ከቀጣዩ የጊዜ አገላለጽ ጋር የሚያስገባውን የትረካ ሽግግር በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐπληροῦντο
  choice: ካለፉ
  rationale: ቀናትን እንደ ርዕሰ ነገር ሲይዝ ጊዜ መፈጸሙን ወይም ማለፉን የሚገልጸውን ፈሊጣዊ ትርጉም በዘመናዊ አማርኛ በግልጽ ያሳያል።
- source_word: ἡμέραι ἱκαναί
  choice: ብዙ ቀናት
  rationale: ἱκαναί በዚህ አውድ ‘በቂ’ ብቻ ሳይሆን ብዛት ያለውን ወይም ረዘም ያለ ጊዜን ያመለክታል፤ ‘ብዙ ቀናት’ ቀጥተኛና ተፈጥሯዊ ነው።
- source_word: συνεβουλεύσαντο
  choice: ተማከሩ
  rationale: የጋራ ምክክሩን በቅርብ ይጠብቃል፤ የምክክሩ ክፉ ዓላማ ደግሞ ‘ለመግደል’ በሚለው ሐረግ ግልጽ ነው። ‘ሴራ ጠነሰሱ’ የሚለው የክፋት ገጽታውን ይበልጥ ያጎላልና በማስታወሻ ተቀምጧል።
- source_word: οἱ Ἰουδαῖοι
  choice: አይሁድ
  rationale: የግሪኩን የዘርና የሃይማኖት መጠሪያ ሳያጠብ ይጠብቃል፤ ጥቅሱ በራሱ ‘መሪዎች’ ብሎ አይገድብም። አውዱ ግን ሳውልን የሚቃወሙትን የተወሰኑ ሰዎች እንጂ ሁሉንም አይሁድ እንደማያመለክት በማስታወሻ ተገልጿል።
- source_word: ἀνελεῖν
  choice: ለመግደል
  rationale: ሕይወቱን ለማጥፋት ያላቸውን ዓላማ ቀጥተኛ፣ ግልጽና ያለ ተጨማሪ ሕጋዊ ፍርድ ይገልጻል።
- source_word: αὐτόν
  choice: ሳውልን
  rationale: ተውላጠ ስሙ በአውዱ ሳውልን ያመለክታል፤ አማርኛው ጥቅስ ለብቻውም ግልጽ እንዲሆን ስሙ ተደግሟል።
theological_decisions:
- issue: በጠላትነት አውድ የተጠቀሰው οἱ Ἰουδαῖοι አተረጓጎም
  choice: አይሁድ
  alternative: የአይሁድ መሪዎች / ይሁዳውያን
  rationale: ግሪኩ የማይለውን ‘መሪዎች’ በማከል ዋቢውን አያጠብም፤ ‘ይሁዳውያን’ የሚለውም በዚህ አውድ ያልተረጋገጠ የክልል ትርጉም ሊጭን ይችላል። አድማሱን የሚወስነው አውድ በማስታወሻ ተብራርቷል።
