id: ACT.9.4
reference: Acts 9:4
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ πεσὼν ἐπὶ τὴν γῆν ἤκουσεν φωνὴν λέγουσαν αὐτῷ Σαοὺλ Σαούλ, τί με διώκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/004.yaml
  text: And falling to the ground, he heard a voice saying to him, “Saul, Saul, why are you persecuting me?”
translation:
  language: am
  text: እርሱም ወደ መሬት ወድቆ፣ “ሳውል፣ ሳውል፣ ለምን ታሳድደኛለህ?” የሚል ድምፅ ሰማ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεσὼν ἐπὶ τὴν γῆν
  choice: መሬት ላይ ወድቆ
  rationale: የአኦሪስት አጋዥ ግስንና ወደ መሬት መውደቁን በተፈጥሯዊ የአማርኛ ቅደም ተከተል ያሳያል፤ የጊዜ ግንኙነቱንም ከምንጩ በላይ አይወስንም።
- source_word: ἤκουσεν φωνὴν
  choice: ድምፅ ... ሰማ
  rationale: ቀጥሎ ግልጽ ንግግር ስለሚመጣ φωνή እዚህ የሚናገር ድምፅን ያመለክታል፤ “ድምፅ” በአማርኛ የድምፁን ባለቤት ሳይጨምር ምንጩን በቅርብ ይከተላል።
- source_word: λέγουσαν αὐτῷ
  choice: ሲናገረው
  rationale: ድምፁ ለእርሱ የተናገረ መሆኑን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: Σαοὺλ Σαούλ
  choice: ሳውል፣ ሳውል
  rationale: የግል ስሙን በተለመደው የአማርኛ አጻጻፍ ያቀርባል፤ አጽንዖት ያለውን ድግግሞሽ ሙሉ በሙሉ ይጠብቃል።
- source_word: τί με διώκεις
  choice: ለምን ታሳድደኛለህ?
  rationale: τί በዚህ አገባብ “ለምን” ማለት ነው፤ διώκεις ደግሞ ቀጣይነት ያለውን ጠላትነትና ስደት በተፈጥሯዊ የአማርኛ ግስ ያሳያል። የመጀመሪያ መደብ ነጠላ ተሳቢው “እኔን” በግሱ ውስጥ እንዳለ ተጠብቋል።
theological_decisions:
- issue: ተናጋሪው ሳውል ከሚያሳድዳቸው ሰዎች ጋር ራሱን ማንነቱን ማያያዙ
  choice: “ታሳድደኛለህ” በማለት “እኔን” የሚለውን ቀጥተኛ ትርጉም ማቆየት
  alternative: “ሕዝቤን” ወይም “ተከታዮቼን” ብሎ በማብራራት መተርጎም
  rationale: ጥቅሱ ራሱ ተናጋሪውን ከሚሰደደው ማኅበረሰብ ጋር በቀጥታ ያያይዛል። ይህን ሥነ መለኮታዊ ኃይል ያለ ትርጓሜያዊ ጭማሪ ማቆየት ተገቢ ነው።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ አጋዥ ግስ በተፈጥሯዊው “ወድቆ” ተተርጉሟል፤ የቀጥታ ንግግሩ ድግግሞሽና ጥያቄው ተጠብቀዋል።
