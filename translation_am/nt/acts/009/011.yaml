base_translation:
  language: en
  yaml_path: translation/nt/acts/009/011.yaml
  text: And the Lord said to him[a], “Get up and go to the street called Straight, and in the house of Judas look for a man named Saul, from Tarsus, for behold, he is praying.”
translation:
  language: am
  text: ጌታም እንዲህ አለው፦ “ተነሥተህ ‘ቀጥተኛ’ ተብሎ ወደሚጠራው ጎዳና ሂድ፤ በይሁዳ ቤትም ሳውል የሚባል የጠርሴስ ሰው[a] ፈልግ፤ እነሆ፣ እየጸለየ ነውና።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የጠርሴስ ሳውል።” የግሪኩ Ταρσέα ሳውልን ከጠርሴስ እንደሆነ ይለየዋል።
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: ጌታ
  rationale: በአዲስ ኪዳን የተለመደውን የሥልጣን ማዕረግ ያስጠብቃል፤ ጥቅሱ ራሱ ‘ኢየሱስ’ ብሎ ስለማያብራራ ስሙ አልተጨመረም።
- source_word: Ἀναστὰς πορεύθητι
  choice: ተነሥተህ … ሂድ
  rationale: የግሪኩን ተከታታይ ትእዛዝ በተፈጥሯዊ የአማርኛ አገላለጽ ያቀርባል።
- source_word: ῥύμην
  choice: መንገድ
