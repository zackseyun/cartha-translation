- source_word: τὴν καλουμένην Εὐθεῖαν
  choice: ‘ቀጥተኛ’ ወደምትባለው
  rationale: Εὐθεῖαν የመንገዱ ስም መሆኑን የጥቅስ ምልክትና ‘የምትባለው’ በሚለው የስያሜ አወቃቀር ያሳያል።
- source_word: ἐν οἰκίᾳ Ἰούδα
  choice: በይሁዳም ቤት
  rationale: የፍለጋውን ስፍራ በተፈጥሯዊ አማርኛ ይገልጻል፤ ‘ም’ ደግሞ የትእዛዞቹን ትስስር ያሳያል።
- source_word: ζήτησον
  choice: ፈልግ
  rationale: ሰውን መፈለግን ይገልጻል፤ ‘አግኝ’ ቢባል የግሪኩን ፍቺ ከሚገባው በላይ ውጤት ያደርገዋል።
- source_word: Σαῦλον ὀνόματι Ταρσέα
  choice: ከጠርሴስ የሆነውን ሳውል የተባለ ሰው
  rationale: ሳውል ስሙ መሆኑንና ጠርሴስ የመጣበትን ከተማ እንደምትገልጽ በግልጽ አማርኛ ያስተላልፋል።
- source_word: ἰδοὺ γὰρ
  choice: እነሆ፣ … ነውና
  rationale: ‘እነሆ’ ትኩረትን ይስባል፤ በግሱ ላይ ያለው ‘ና’ ደግሞ γάρ የሚያሳየውን ምክንያታዊ ግንኙነት ይጠብቃል።
- source_word: προσεύχεται
