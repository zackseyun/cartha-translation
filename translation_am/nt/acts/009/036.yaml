base_translation:
  language: en
  yaml_path: translation/nt/acts/009/036.yaml
  text: In Joppa there was a disciple named Tabitha[a], which translated is called Dorcas. She was full of good works and acts of mercy that she was doing.
translation:
  language: am
  text: በኢዮጴ ታቢታ[a] የምትባል አንዲት ደቀ መዝሙር ነበረች፤ ስሟም ሲተረጎም ዶርቃ ትባላለች። እርሷም በምታደርጋቸው መልካም ሥራዎችና የምሕረት ተግባራት የተሞላች ነበረች።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ዶርቃ ከታቢታ ጋር የሚዛመደው የግሪክ ስም ነው፤ ስሙ «ሚዳቋ» ማለት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθήτρια
  choice: አንዲት ደቀ መዝሙር
  rationale: የግሪኩ ስም በግልጽ የሴት ፆታ ቅርጽ አለው፤ «አንዲት» እና የሴት ግስ ይህን በተፈጥሯዊ አማርኛ ያሳያሉ።
- source_word: Ταβιθά
  choice: ታቢታ
  rationale: የአረማይክ የግል ስም በአማርኛ የተለመደውን አጻጻፍ ተከትሎ ተጽፏል።
- source_word: διερμηνευομένη λέγεται Δορκάς
  choice: ስሟም ሲተረጎም ዶርቃ ትባላለች
  rationale: የሴማዊው ስም የግሪክ አቻ ስም እንደሚሰጠው የትርጉምና የስያሜውን ሐሳብ አብሮ ያቆያል።
- source_word: πλήρης ἔργων ἀγαθῶν
  choice: መልካም ሥራዎችን ... በማድረግ የተሞላች
  rationale: «የተሞላች» πλήρηςን ይጠብቃል፤ የአማርኛው አገባብም መልካም ሥራዎቹ በተግባር የሚፈጸሙ መሆናቸውን ያሳያል።
- source_word: ἐλεημοσυνῶν
  choice: የምሕረት ተግባራት
  rationale: ቃሉ ለተቸገሩ የሚደረግን ርኅሩኅ እርዳታ ያመለክታል፤ ይህ አተረጓጎም ትርጉሙን በገንዘብ ምጽዋት ብቻ አይገድበውም።
- source_word: ὧν ἐποίει
  choice: ሁልጊዜ ... በማድረግ
  rationale: ያልተጠናቀቀው የግስ ቅርጽ ተደጋጋሚና የተለመደ ተግባርን ያመለክታል፤ «ሁልጊዜ» ይህን ቀጣይነት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: δέ
  choice: —
  rationale: δέ እዚህ የትረካ ሽግግር ያደርጋል፤ በአማርኛ የአንቀጹ አጀማመር ያለ ተጨማሪ ግልጽ አገናኝ ተፈጥሯዊ ነው።
theological_decisions:
- issue: የሴት ፆታ ያለውን μαθήτρια መተርጎም
  choice: አንዲት ደቀ መዝሙር
  alternative: ሴት ደቀ መዝሙር
  rationale: «አንዲት» እና የሴት ግሶች ፆታዋን በግልጽና ተፈጥሯዊ ሁኔታ ያሳያሉ፤ «ሴት» ብሎ መጨመር አያስፈልግም።
- issue: ἐλεημοσυνῶν ምጽዋትን ብቻ ወይስ ሰፊ የርኅራኄ ተግባርን እንደሚያመለክት
  choice: የምሕረት ተግባራት
  alternative: ምጽዋት
  rationale: በዚህ ዐውድ ለችግረኞች የምታደርገውን ርኅሩኅ እርዳታ በሰፊው ያሳያል፤ ወደ ገንዘብ ስጦታ ብቻ አያጠብበውም።
