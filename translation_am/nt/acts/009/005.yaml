  yaml_path: translation/nt/acts/009/005.yaml
  text: And he said[a], “Who are you, Lord?” And he said, “I am Jesus, whom you are persecuting.”
translation:
  language: am
  text: እርሱም፣ “ጌታ ሆይ፣[a] አንተ ማን ነህ?” አለ። እርሱም፣ “እኔ አንተ የምታሳድደኝ ኢየሱስ ነኝ” አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ κύριε የአክብሮት መጠሪያ ሊሆን ይችላል፤ እዚህ ግን በቃሉ መደበኛ ትርጉምና በመገለጡ አውድ መሠረት “ጌታ ሆይ” ተተርጉሟል።
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: አለ / አለው
  rationale: የግሪኩ የትረካ ግስ በዘመናዊ አማርኛ ተፈጥሯዊ በሆነው የንግግር አቀራረብ ተተርጉሟል፤ በሁለተኛው ሐረግ ተሳቢውን ለማመልከት “አለው” ተመርጧል።
- source_word: δέ
  choice: -ም
  rationale: δέ እዚህ ቀላል የትረካ ማያያዣ ነው፤ የአማርኛው “-ም” የድርጊቱን ቅደም ተከተል ያለ ከባድ ንፅፅር በተፈጥሮ ያስተላልፋል።
- source_word: Τίς εἶ
  choice: አንተ ማን ነህ?
  rationale: ጥያቄውን ቀጥተኛና ተፈጥሯዊ በሆነ ዘመናዊ አማርኛ ይገልጻል።
- source_word: κύριε
  choice: ጌታ ሆይ
  rationale: “ጌታ” የκύριος መደበኛ አቻ ሲሆን “ሆይ” የቀጥታ ጥሪውን ያሳያል፤ ቃሉ በዚህ ቦታ የአክብሮት አጠራርም ሊሆን ስለሚችል አማራጩ በማስታወሻ ተጠብቋል።
- source_word: Ἐγώ εἰμι
  choice: እኔ ነኝ
  rationale: ግልጽ የሆነውን Ἐγώ በማስቀመጥ የራስን መግለጫ አጽንዖት ይጠብቃል፤ ከአውዱ በላይ ተጨማሪ ሥነ መለኮታዊ ፍቺ አያስገባም።
- source_word: Ἰησοῦς
  choice: ኢየሱስ
  rationale: በአማርኛ የተለመደው የስሙ አጻጻፍ ነው።
- source_word: ὃν σὺ διώκεις
  choice: አንተ የምታሳድደኝ
  rationale: የግሪኩን ዝምድና ሐረግና ግልጽ የሆነውን σὺ በ“አንተ” ጠብቆ ያቀርባል፤ የአሁን ጊዜውም ቀጣይ የጥቃት ድርጊትን ያመለክታል።
theological_decisions:
- issue: ሳውል ተናጋሪው ማን እንደሆነ ከማወቁ በፊት κύριε ብሎ መጥራቱ
  choice: ጌታ ሆይ
  alternative: ጌታዬ / ክቡር ጌታ
  rationale: κύριε የአክብሮት አጠራር ሊሆን ቢችልም፣ “ጌታ ሆይ” የቃሉን መደበኛ ትርጉምና የሰማያዊውን መገለጥ ክብደት ይጠብቃል፤ በዚያው ቅጽበት ሳውል ሙሉ የሥነ መለኮት እምነት እንደተናገረ ግን አይወስንም።
