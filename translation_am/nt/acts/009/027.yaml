  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Βαρναβᾶς δὲ ἐπιλαβόμενος αὐτὸν ἤγαγεν πρὸς τοὺς ἀποστόλους, καὶ διηγήσατο αὐτοῖς πῶς ἐν τῇ ὁδῷ εἶδεν τὸν κύριον καὶ ὅτι ἐλάλησεν αὐτῷ καὶ πῶς ἐν Δαμασκῷ ἐπαρρησιάσατο ἐν τῷ ὀνόματι ⸀τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/027.yaml
  text: But Barnabas took hold of him and brought him to the apostles, and told them how on the road he had seen the Lord, and that he had spoken to him, and how in Damascus he had spoken boldly in the name of Jesus.
translation:
  language: am
  text: በርናባስ ግን ሳውልን ይዞ ወደ ሐዋርያት አመጣው፤ በመንገድ ላይ ጌታን እንዴት እንዳየና ጌታም እንደተናገረው፣ በደማስቆም በኢየሱስ ስም እንዴት በድፍረት እንደተናገረ ነገራቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλαβόμενος αὐτὸν
  choice: ሳውልን ይዞ
  rationale: “ይዞ” የመያዝንና አብሮ የመውሰድን ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል፤ በአውዱም የበርናባስን ደጋፊ ተግባር እንጂ ጠላትነት ያለበትን መያዝ አያመለክትም። ግልጽነት ሲባል የተውላጠ ስሙ ፋንታ “ሳውልን” ተጠቅሟል።
- source_word: ἤγαγεν πρὸς τοὺς ἀποστόλους
  choice: ወደ ሐዋርያት አመጣው
  rationale: “አመጣው” በርናባስ ሳውልን ለሐዋርያት ማቅረቡን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: διηγήσατο
  choice: ነገራቸው
  rationale: ግሱ ዝርዝር ነገርን መተረክ ወይም ማስረዳትን ያመለክታል፤ ተከታዮቹ ሐረጎች የተነገረውን ይዘት ስለሚዘረዝሩ “ነገራቸው” ግልጽና ተፈጥሯዊ ነው።
- source_word: πῶς ἐν τῇ ὁδῷ
  choice: በመንገድ ላይ እንዴት
  rationale: እዚህ ὁδός ወደ ደማስቆ የሚደረገውን ጉዞ ያመለክታል፤ የእምነት እንቅስቃሴ መጠሪያ የሆነውን “መንገድ” አያመለክትም።
- source_word: εἶδεν τὸν κύριον
  choice: ጌታን እንዳየ
  rationale: የግሪኩን ቀላል ያለፈ ጊዜ በተዘዋዋሪ ንግግር ተፈጥሯዊ በሆነ “እንዳየ” ቅርጽ ያቀርባል፤ κύριος ደግሞ ክርስቶሳዊ ክብደቱን በሚጠብቀው “ጌታ” ተተርጉሟል።
- source_word: ὅτι ἐλάλησεν αὐτῷ
  choice: ጌታም እንደተናገረው
  rationale: የቀደመው ሰዋሰዋዊ ርዕሰ ጉዳይ “ጌታ” ነው፤ በአማርኛ ግልጽነት ለማስጠበቅ ስሙ ተደግሟል። “እንደተናገረው” ጌታ ለሳውል መናገሩን ያሳያል።
- source_word: ἐπαρρησιάσατο
  choice: በድፍረት እንደተናገረ
  rationale: ግሱ በነፃነት፣ በግልጽነት ወይም በድፍረት መናገርን ያመለክታል። “በድፍረት ተናገረ” የቃሉን ኃይል ይጠብቃል፤ በግሪኩ ውስጥ በቀጥታ ያልተገለጸውን “ሰበከ” አያስገባም።
- source_word: ἐν τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: በኢየሱስ ስም
  rationale: የመጽሐፍ ቅዱሱን የተለመደ አነጋገር ይጠብቃል፤ ከኢየሱስ ሥልጣንና ከእርሱ መመስከር ጋር ያለውን ግንኙነትም ሳይገድብ ያስተላልፋል።
- source_word: Ἰησοῦ
  choice: ኢየሱስ
  rationale: በዘመናዊ መደበኛ አማርኛ የተለመደው የስሙ ቅርጽ ነው።
theological_decisions:
- issue: በመንገድ ላይ የታየው “ጌታ” ማንነት
  choice: “ጌታ” የተነሣውን ኢየሱስን ያመለክታል።
  alternative: “ጌታ”ን አጠቃላይ መለኮታዊ መጠሪያ አድርጎ መረዳት።
  rationale: በሐዋርያት ሥራ 9 ያለው ቅርብ አውድ የሳውልን ገጠመኝ ከተነሣው ኢየሱስ ጋር ያገናኛል፤ የቁጥሩ መጨረሻም “በኢየሱስ ስም” ይላል። ሆኖም ትርጉሙ “ጌታ” የሚለውን ማዕረግ ጠብቆ አቅርቧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ረጅሙ የግሪክ ዓረፍተ ነገር በአማርኛ ተነባቢነት እንዲኖረው በሴሚኮሎንና በነጠላ ሰረዝ ተደራጅቷል። “ጌታም” የሚለው ስም ተደግሞ የἐλάλησεν ባለቤት ጌታ መሆኑን ግልጽ ያደርጋል።
