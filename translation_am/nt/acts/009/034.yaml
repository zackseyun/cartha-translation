review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Peter’s healing declaration, the immediate response, and the personal force of σεαυτῷ. However, it reverses the Greek title-and-name order (Ἰησοῦς Χριστός), and “አልጋህን” specifies a possessive object not expressed in Greek.
  naturalness: The overall register is clear modern standard Amharic. “ተነሥተህ … አንጥፍ” is understandable, but two coordinated imperatives are more direct and natural as “ተነሥና … አንጥፍ.”
  terminology: “መሲሑ” appropriately renders Χριστός as the Messiah title. Placing it after “ኢየሱስ” both follows the Greek sequence and is idiomatic for an Amharic title/name construction.
  issues:
  - severity: medium
    issue: The phrase “መሲሑ ኢየሱስ” reverses the source order Ἰησοῦς Χριστός.
    rationale: The source says “Jesus Messiah/Christ,” not “the Messiah Jesus.” The revised order preserves source sequence without changing the chosen rendering of Χριστός.
  - severity: low
    issue: “አልጋህን” makes the bedding explicitly Aeneas’s own bed.
    rationale: στρῶσον σεαυτῷ leaves the bedding object unstated and specifies “for yourself.” “መኝታ አንጥፍ” is natural Amharic while avoiding an unnecessary possessive addition.
