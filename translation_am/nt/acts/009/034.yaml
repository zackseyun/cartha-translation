id: ACT.9.34
reference: Acts 9:34
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ ὁ Πέτρος· Αἰνέα, ἰᾶταί σε Ἰησοῦς ⸀Χριστός· ἀνάστηθι καὶ στρῶσον σεαυτῷ· καὶ εὐθέως ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/034.yaml
  text: And Peter said to him[a], “Aeneas, Jesus the Messiah heals you[b]. Get up and make your bed.” And immediately he got up.
translation:
  language: am
  text: ጴጥሮስም፣ “ኤንያስ ሆይ፣ ኢየሱስ መሲሑ[a] ይፈውስሃል። ተነሥና ለራስህ መኝታ አንጥፍ[b]” አለው። እርሱም ወዲያው ተነሣ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ኢየሱስ ክርስቶስ።” የግሪኩ Χριστός “ክርስቶስ” ተብሎም ሊተረጎም ይችላል፤ እዚህ የማዕረጉን ትርጉም ለማሳየት “መሲሑ” ተብሏል።
    reason: alternative_reading
  - marker: b
    text: ቃል በቃል፣ “ለራስህ አንጥፍ።” የሚነጠፈው የመኝታ ነገር ከአውዱ ይገባል።
    reason: source_ambiguity
lexical_decisions:
- source_word: ἰᾶταί
  choice: ይፈውስሃል
  rationale: የግሪኩን የአሁን ጊዜ አገላለጽና በንግግሩ ቅጽበት የሚፈጸመውን የፈውስ አዋጅ ሳይገድብ ያስተላልፋል።
- source_word: Χριστός
  choice: መሲሑ
  rationale: በዚህ አውድ Χριστός እንደ ማዕረግ ስለቀረበ፣ ትርጉሙንና የተወሰነነቱን የሚገልጠው ‘መሲሑ’ ተመርጧል።
- source_word: ἀνάστηθι
  choice: ተነሥተህ
  rationale: ከተኛበት እንዲነሣ የተሰጠውን ቀጥተኛ ትእዛዝ በተፈጥሯዊ አማርኛ ይገልጣል፤ ከቀጣዩ ትእዛዝም ጋር ያገናኘዋል።
- source_word: στρῶσον σεαυτῷ
  choice: አልጋህን ለራስህ አንጥፍ
  rationale: στρώννυμι የማንጠፍን ወይም የመኝታ ስፍራን የማዘጋጀት ሐሳብ ይይዛል፤ σεαυτῷ ያለውን ለራሱ የማድረግ አጽንዖት ‘ለራስህ’ ይጠብቃል። በግሪኩ ያልተገለጸው ግን በአውዱ የሚታወቀው የመኝታ ነገር በአማርኛ ‘አልጋህን’ ተብሎ ግልጽ ተደርጓል።
- source_word: εὐθέως
  choice: ወዲያው
  rationale: ድርጊቱ ያለ መዘግየት መፈጸሙን በተፈጥሯዊና ግልጽ አማርኛ ያሳያል።
- source_word: ἀνέστη
  choice: ተነሣ
  rationale: የትእዛዙን ፈጣን ውጤት ይተርካል፤ ከ‘ተነሥተህ’ ጋርም የቃል ትስስሩን ይጠብቃል።
- source_word: Αἰνέα
  choice: ኤንያስ
  rationale: የግሪኩን የግል ስም በአማርኛ የተለመደ የፊደል አጻጻፍ ያቀርባል።
theological_decisions:
- issue: በፈውሱ አዋጅ ውስጥ Χριστόςን መተርጎም
  choice: መሲሑ ኢየሱስ
  alternative: ክርስቶስ ኢየሱስ
  rationale: Χριστός በዚህ ስፍራ እንደ ትርጉም ያለው ማዕረግ ሊነበብ ስለሚችል ‘መሲሑ’ ተመርጧል፤ በቤተ ክርስቲያን ቃላት አጠቃቀም የተለመደው ‘ክርስቶስ’ ግን በማስታወሻ ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። ‘ሆይ’ በቀጥተኛ ጥሪ ውስጥ ግልጽነትንና ክብርን ይጠብቃል፤ ‘ወዲያው’ ደግሞ ከከባድ ወይም ጥንታዊ አገላለጽ ይልቅ ተፈጥሯዊ ነው።
