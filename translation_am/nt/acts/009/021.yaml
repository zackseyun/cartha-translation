theological_decisions:
- issue: ‘ይህን ስም’ የሚለውን ‘የኢየሱስን ስም’ ብሎ ማብራራት
  choice: በዋናው ጽሑፍ ‘ይህን ስም’ ተጠብቋል
  alternative: ‘የኢየሱስን ስም’
  rationale: ግሪኩ ስሙን በቀጥታ አይጠቅስም፤ የሚያመለክተው ከዐውዱ ግልጽ ስለሆነ የትረካው አጽንዖትና የአገላለጹ ክብደት ተጠብቋል።
- issue: πορθήσας የሚለውን የሳውልን ቀድሞ ድርጊት ምን ያህል አጥብቆ እንደሚገልጽ
  choice: ‘ያጠፋ የነበረው’
  alternative: ‘ያሳድድ የነበረው’
  rationale: የምንጩ ግስ ከአጠቃላይ ስደት ይልቅ ኃይለኛ የማውደም ሐሳብ አለው፤ ይህ ምርጫ ክብደቱን ሳያለዝብ ይጠብቃል።
- issue: ሁለተኛውን ክፍል እንደ ጥያቄ ወይም እንደ መግለጫ ማቅረብ
  choice: ከመጀመሪያው ጋር የተያያዘ የአጽንዖት ጥያቄ
  alternative: ‘እርሱም ለዚህ ዓላማ መጥቶ ነበር’ የሚል መግለጫ
  rationale: የግሪኩ የንግግር አወቃቀር ሁለቱንም ሐሳቦች በአንድ የሚጠበቅ መልስ ባለው ጥያቄ ስር ማንበብን ይደግፋል፤ አማርኛውም ይህን በተፈጥሯዊ ሁኔታ ያቀርባል።
