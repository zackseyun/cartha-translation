  text: ἐγγὺς δὲ οὔσης Λύδδας τῇ Ἰόππῃ οἱ μαθηταὶ ἀκούσαντες ὅτι Πέτρος ἐστὶν ἐν αὐτῇ ἀπέστειλαν ⸂δύο ἄνδρας⸃ πρὸς αὐτὸν παρακαλοῦντες· Μὴ ⸀ὀκνήσῃς διελθεῖν ἕως ⸀ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/038.yaml
  text: Since Lydda was near Joppa[a], the disciples, hearing that Peter was there, sent two men to him, urging, “Do not delay to come to us.”
translation:
  language: am
  text: ልዳ ለኢዮጴ ቅርብ ስለነበረች፣ ደቀ መዛሙርቱ ጴጥሮስ በዚያ እንዳለ ሰምተው ሁለት ሰዎችን ወደ እርሱ ላኩና፣ “ወደ እኛ ለመምጣት አትዘግይ[a]” ብለው አጥብቀው ለመኑት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወደ እኛ ለመምጣት አታመንታ።” ግሱ ማመንታትን ወይም መዘግየትን ሊያመለክት ይችላል፤ ዋናው ጽሑፍ ከዚህ አስቸኳይ ጥያቄ ጋር ይበልጥ ተፈጥሯዊ የሆነውን ትርጉም ይጠቀማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγὺς ... οὔσης
  choice: ቅርብ ስለነበረች
  rationale: የግሪኩ የgenitive absolute አወቃቀር የድርጊቱን ዳራ ያቀርባል፤ በዐውዱም የደቀ መዛሙርቱን እርምጃ ያነሳሳውን ምክንያታዊ ግንኙነት ያሳያል።
- source_word: Λύδδας
  choice: ልዳ
  rationale: በአማርኛ የአዲስ ኪዳን አጠቃቀም የተለመደውን የግሪክ ስም ቅርጽ ይከተላል።
- source_word: Ἰόππῃ
  choice: ኢዮጴ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ ወግ የሚታወቀውን የቦታውን ስም ይጠቀማል።
- source_word: οἱ μαθηταὶ
  choice: ደቀ መዛሙርቱ
  rationale: በሐዋርያት ሥራ ውስጥ የአማኞችን ማኅበረሰብ የሚገልጸው መደበኛና ትክክለኛ ቃል ነው።
- source_word: ἀκούσαντες
  choice: ሰምተው
  rationale: የaorist participle ቅድመ ሁኔታን በተፈጥሯዊ የአማርኛ ተከታታይ ግስ ይገልጻል።
- source_word: ἐν αὐτῇ
  choice: በዚያ
  rationale: ተውላጠ ስሙ ልዳን ያመለክታል፤ ‘በዚያ’ የቦታውን ማጣቀሻ በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: ἀπέστειλαν δύο ἄνδρας
  choice: ሁለት ሰዎችን ... ላኩ
  rationale: የግሱንና የተሳታፊዎቹን ትርጉም ቀጥተኛና ተፈጥሯዊ በሆነ አማርኛ ያቀርባል።
- source_word: παρακαλοῦντες
  choice: አጥብቀው ለመኑት
  rationale: ቃሉ በዚህ ዐውድ ተራ ጥያቄ ሳይሆን አጽንዖት ያለውን ልመና ያመለክታል፤ ይህ አተረጓጎም አስቸኳይነቱን ያሳያል ነገር ግን ስሜቱን አያጋንንም።
- source_word: Μὴ ὀκνήσῃς
  choice: አትዘግይ
  rationale: ὀκνέω ማመንታትን፣ ወደኋላ ማለትን ወይም መዘግየትን ሊያመለክት ይችላል፤ በዚህ የጉዞ ጥያቄ ዐውድ ‘አትዘግይ’ ተፈጥሯዊ ነው፣ ሌላው ትርጉም በማስታወሻ ተጠብቋል።
- source_word: διελθεῖν ἕως ἡμῶν
  choice: ወደ እኛ ለመምጣት
  rationale: በቃል ቅርብ ሲተረጎም ‘እስከ እኛ ማለፍ’ የሚል ሀሳብ ቢኖረውም፣ ከጠያቂዎቹ እይታ አንጻር ጴጥሮስ ወደ እነርሱ እንዲጓዝ መጠየቃቸውን ‘ወደ እኛ ለመምጣት’ በተፈጥሯዊነት ይገልጻል።
