- source_word: τοῖς μαθηταῖς
  choice: ከደቀ መዛሙርቱ ጋር
  rationale: የታወቀውን በኢየሩሳሌም ያለ የደቀ መዛሙርት ቡድን ያመለክታል፤ ከκολλᾶσθαι ጋር ያለው የዳቲቭ ግንኙነት በአማርኛ «ከ...ጋር» ተብሎ በተፈጥሯዊ ሁኔታ ተገልጧል።
- source_word: καὶ πάντες ἐφοβοῦντο αὐτόν
  choice: እነርሱ ግን ... ሁሉም ይፈሩት ነበር
  rationale: በአውዱ ያለውን ተቃርኖ «ግን» ያሳያል፤ ያልተጠናቀቀው ἐφοβοῦντο ደግሞ ቀጣይ የነበረውን ፍርሃት «ይፈሩት ነበር» በማለት ይገልጣል።
- source_word: μὴ πιστεύοντες
  choice: ስላላመኑ
  rationale: አሳታፊው ግስ የፍርሃታቸውን ምክንያት ያሳያል፤ የምክንያት ትስስሩ በአማርኛ «ስላላመኑ» ተብሎ ግልጽ ሆኗል።
- source_word: ὅτι ἐστὶν μαθητής
  choice: ደቀ መዝሙር መሆኑን
  rationale: የግሪኩን ቀጥተኛ ይዘት በአማርኛ የተዘዋዋሪ ንግግር አወቃቀር በተፈጥሯዊ መንገድ ያቀርባል።
- source_word: μαθητής
  choice: ደቀ መዝሙር
  rationale: በሐዋርያት ሥራ ውስጥ μαθητής የሚያመለክተውን ቁርጠኛ ተከታይና ተማሪ ለመግለጽ የተለመደውና ትክክለኛው የአማርኛ ቃል ነው።
