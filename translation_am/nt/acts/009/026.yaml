    reason: የκολλᾶσθαιን ይበልጥ ቀጥተኛ የቃል አማራጭ ለማሳየት።
lexical_decisions:
- source_word: Παραγενόμενος
  choice: በመጣ ጊዜ
  rationale: የግሪኩ የአኦሪስት አሳታፊ ግስ ከዋናው ድርጊት በፊት የሆነውን ሁኔታ ያስተዋውቃል፤ ይህ አተረጓጎም ጊዜያዊ ግንኙነቱን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: δὲ
  choice: -ም
  rationale: እዚህ δέ ትረካውን የሚያስቀጥል ለስላሳ አያያዥ ነው፤ ከ«ኢየሩሳሌም» ጋር የተያያዘው «-ም» ይህን ፍሰት በተፈጥሯዊ መንገድ ይገልጣል።
- source_word: εἰς Ἰερουσαλήμ
  choice: ወደ ኢየሩሳሌም
  rationale: εἰς ከከተማ ስም ጋር ያለውን የአቅጣጫ ትርጉም «ወደ» በትክክል ያስተላልፋል።
- source_word: ἐπείραζεν
  choice: ይሞክር ነበር
  rationale: ያልተጠናቀቀው የግሪክ ግስ በሂደት ላይ የነበረን ሙከራ ያሳያል፤ «ይሞክር ነበር» ይህን አንፃር ይጠብቃል።
- source_word: κολλᾶσθαι
