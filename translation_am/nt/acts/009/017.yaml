  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ አፖዚሽናዊ መቆራረጥ በረጅም ሰረዝ ተጠብቋል፤ የመንገዱ አገላለጽ በዋናው ጽሑፍ በተፈጥሯዊ አማርኛ ስለተሰጠ ተጨማሪ ማስታወሻ አላስፈለገውም።
