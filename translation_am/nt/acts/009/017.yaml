  text: ἀπῆλθεν δὲ Ἁνανίας καὶ εἰσῆλθεν εἰς τὴν οἰκίαν, καὶ ἐπιθεὶς ἐπ’ αὐτὸν τὰς χεῖρας εἶπεν· Σαοὺλ ἀδελφέ, ὁ κύριος ἀπέσταλκέν με, ⸀Ἰησοῦς ὁ ὀφθείς σοι ἐν τῇ ὁδῷ ᾗ ἤρχου, ὅπως ἀναβλέψῃς καὶ πλησθῇς πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/017.yaml
  text: So Ananias went and entered the house, and laying his hands on him he said, “Brother Saul, the Lord has sent me—Jesus, the one who appeared to you on the road by which you were coming—so that you may regain your sight and be filled with the Holy Spirit.”
translation:
  language: am
  text: ሐናንያም ሄዶ ወደ ቤቱ ገባ፤ እጆቹንም በእርሱ ላይ ጭኖ እንዲህ አለው፦ “ወንድሜ ሳውል፣ ጌታ ላከኝ—ይኸውም ስትመጣ በነበርክበት መንገድ የታየህ ኢየሱስ—እንደገና ማየት እንድትችል[a] እና በመንፈስ ቅዱስ እንድትሞላ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ዓይንህ እንደገና እንዲያይ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν δὲ
  choice: ስለዚህ ሐናንያ ሄዶ
  rationale: δέ የትረካውን ቀጣይነትና ከቀደመው ትእዛዝ ጋር ያለውን ውጤታዊ ግንኙነት ያሳያል፤ ‘ስለዚህ’ ይህን ፍሰት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: εἰσῆλθεν εἰς τὴν οἰκίαν
  choice: ወደ ቤቱ ገባ
  rationale: የግሪኩን የእንቅስቃሴ አቅጣጫና መድረሻ ቀጥተኛና ተፈጥሯዊ በሆነ አማርኛ ይገልጣል።
- source_word: ἐπιθεὶς ἐπ’ αὐτὸν τὰς χεῖρας
  choice: እጆቹንም በእርሱ ላይ ጭኖ
  rationale: ተጓዳኙን ድርጊትና የእጅ መጫንን መጽሐፍ ቅዱሳዊ አገላለጽ ይጠብቃል።
- source_word: Σαοὺλ ἀδελφέ
  choice: ወንድሜ ሳውል
  rationale: የጥሪውን ቅርበትና ተቀባይነት በዘመናዊ አማርኛ በተፈጥሯዊ የንግግር ቅደም ተከተል ያስተላልፋል።
- source_word: ὁ κύριος ἀπέσταλκέν με
  choice: ጌታ ላከኝ
  rationale: ፍጹሙ ግስ ያለውን አሁናዊ ጠቀሜታ ከአውዱ የሚገኝ በመሆኑ፣ ቀላሉ ያለፈ ጊዜ በአማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: Ἰησοῦς ὁ ὀφθείς σοι
  choice: ይኸውም … የታየህ ኢየሱስ
  rationale: ‘ኢየሱስ’ የሚለው ‘ጌታ’ን የሚለይ ተጨማሪ መግለጫ መሆኑን ይጠብቃል፤ ὀφθείς ደግሞ በተፈጥሯዊ አማርኛ ‘የታየህ’ ተብሏል።
- source_word: ἐν τῇ ὁδῷ ᾗ ἤρχου
  choice: ስትመጣበት በነበረው መንገድ
  rationale: ὁδόςን ቃል በቃል ‘መንገድ’ ይላል፤ የἤρχουን ቀጣይ እንቅስቃሴ ደግሞ ‘ስትመጣበት በነበረው’ በማለት ያንጸባርቃል።
- source_word: ἀναβλέψῃς
  choice: እንደገና ማየት እንድትችል
  rationale: በፈውስ አውድ የማየት ችሎታን መልሶ ማግኘት ያመለክታል፤ ይህ አገላለጽ ፍቺውን ግልጽ ያደርጋል።
- source_word: πλησθῇς πνεύματος ἁγίου
  choice: በመንፈስ ቅዱስ እንድትሞላ
  rationale: የመሞላትን ድርጊትና የመለኮታዊውን መንፈስ መጠሪያ በተለመደና ግልጽ የአማርኛ አገላለጽ ያቀርባል።
theological_decisions:
- issue: Ἰησοῦς ከὁ κύριος ጋር ያለው ሰዋሰዋዊ ግንኙነት
  choice: “ጌታ ላከኝ—ይኸውም … የታየህ ኢየሱስ—”
  alternative: “በመንገድ የታየህ ጌታ ኢየሱስ ላከኝ”
  rationale: የግሪኩን የተቆራረጠ አፖዚሽናዊ አወቃቀር ይጠብቃል፤ ‘ኢየሱስ’ የላኪውን ‘ጌታ’ እንደሚለይ ያሳያል እንጂ የምንጩን የንግግር ውጥረት በዝምታ አያስወግድም።
- issue: πνεύματος ἁγίου ያለ ግሪክ አመልካች መቅረቡ
  choice: መንፈስ ቅዱስ
  alternative: ቅዱስ መንፈስ
  rationale: በሐዋርያት ሥራ አውድ የሚጠቀሰው መለኮታዊው መንፈስ ነው፤ አማርኛ አመልካች አንቀጽ ስለማይፈልግ የግሪኩ አንቀጽ አልባነት ያልተወሰነ መንፈስን አያመለክትም።
- issue: ἀδελφέ የሚያመለክተው ግንኙነት
  choice: ወንድሜ
  alternative: ወንድም ሳውል
  rationale: የቀጥታ ንግግሩን ሞቅታ፣ ተቀባይነትና ወንድማዊ ቅርበት ያሳያል፤ ከጽሑፉ በላይ የሆነ ልዩ የቤተ እምነት ትርጓሜ አያስገባም።
