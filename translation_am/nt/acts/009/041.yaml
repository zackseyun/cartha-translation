  text: δοὺς δὲ αὐτῇ χεῖρα ἀνέστησεν αὐτήν, φωνήσας δὲ τοὺς ἁγίους καὶ τὰς χήρας παρέστησεν αὐτὴν ζῶσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/041.yaml
  text: And giving her his hand[a], he raised her up; then he called the saints and the widows and presented her alive.
translation:
  language: am
  text: እጁንም ሰጥቶላት አስነሣት፤[a] ከዚያም ቅዱሳኑንና መበለቶቹን ጠርቶ በሕይወት ሳለች በፊታቸው አቀረባት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እንድትነሣ ረዳት” ወይም “አቆማት”፤ የግሪኩ ግስ አንድን ሰው እንዲነሣ ወይም እንዲቆም ማድረግን ሊያመለክት ይችላል፤ በዚህ አውድ የሙታን መነሣትንም ያስተጋባል።
    reason: lexical_alternative
lexical_decisions:
- source_word: δοὺς ... χεῖρα
  choice: እጁንም ሰጥቶ
  rationale: የግሪኩን እጅን ለመርዳት የመዘርጋት ፈሊጥ በቅርብ ይጠብቃል፤ በአማርኛም በአውዱ የሚገባ ነው።
- source_word: ἀνέστησεν
  choice: አስነሣት
  rationale: ሰውን እንዲነሣ ማድረግን ይገልጣል፤ በዚህ አውድ የሙታን መነሣትን የሚያስተጋባውን የቃሉን ኃይልም ሳያጋንን ይጠብቃል።
- source_word: φωνήσας
  choice: ጠርቶ
  rationale: ቡድኑን መጥራቱን በተፈጥሯዊ አማርኛ ይገልጣል፤ ድርጊቱም ከማቅረቡ በፊት እንደተፈጸመ ያሳያል።
- source_word: τοὺς ἁγίους
  choice: ቅዱሳኑን
  rationale: በአዲስ ኪዳን ለእግዚአብሔር ሕዝብ የሚሰጠውን መደበኛ ስያሜ በቀጥታ ያስተላልፋል።
- source_word: τὰς χήρας
  choice: መበለቶቹን
  rationale: ቀጥተኛና ተፈጥሯዊ ትርጉም ነው፤ በቀደመው ትረካ ምክንያት ከቅዱሳኑ ተለይተው መጠቀሳቸውን ይጠብቃል።
- source_word: παρέστησεν
  choice: በፊታቸው አቀረባት
  rationale: ጴጥሮስ ጣቢታን በተሰበሰቡት ሰዎች ፊት እንዳቀረባት በግልጽ ያሳያል።
- source_word: ζῶσαν
  choice: በሕይወት እያለች
  rationale: በπαρέστησεν የሚወሰነውን አረፍተ ነገራዊ ሁኔታ፣ ማለትም እሷን ሕያው ሆና እንዳቀረባት፣ በተፈጥሯዊና አጽንዖት ባለው አማርኛ ይገልጣል።
theological_decisions:
- issue: በትረካው ውስጥ የትንሣኤ ድምፀት ያለውን ἀνέστησεν መተርጎም
  choice: አስነሣት
  alternative: እንድትነሣ ረዳት / አቆማት
  rationale: ቃሉ በቅርብ ደረጃ ጣቢታን ከተቀመጠችበት ማስነሣቱን ይገልጣል፤ በቀደመው አውድ ከሞት ወደ ሕይወት መመለሷንም ያስተጋባል። “አስነሣት” ሁለቱንም የትርጉም ደረጃዎች ሳይፈታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። “ቅዱሳኑ” የአዲስ ኪዳንን መደበኛ ስያሜ ይጠብቃል፤ “አስነሣት” ደግሞ የአካላዊ ማስነሣትና የትንሣኤ ድምፀት አሻሚነትን ይዞ ይቀራል።
