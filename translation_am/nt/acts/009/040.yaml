base_translation:
  language: en
  yaml_path: translation/nt/acts/009/040.yaml
  text: But Peter put them all outside[a], knelt down and prayed, and turning toward the body said, “Tabitha, arise.” Then she opened her eyes, and when she saw Peter, she sat up.
translation:
  language: am
  text: ጴጥሮስ ግን ሁሉንም ወደ ውጭ አስወጥቶ፣ ተንበርክኮ ጸለየ። ከዚያም ወደ አካሏ ዘወር ብሎ፣ “ጣቢታ፣ ተነሺ[a]!” አለ። እርሷም ዓይኖቿን ከፈተች፤ ጴጥሮስንም ባየች ጊዜ ቀና ብላ ተቀመጠች።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ቁሚ።” የግሪኩ ትእዛዝ በሁለቱም መንገድ ሊተረጎም ይችላል፤ “ተነሺ” የተመረጠው የትዕይንቱን ክብደትና የትንሣኤውን ዐውደ ንባብ ለመጠበቅ ነው።
    reason: lexical_alternative
