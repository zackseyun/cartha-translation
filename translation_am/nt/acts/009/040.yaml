- source_word: ἐπιστρέψας πρὸς τὸ σῶμα
  choice: ወደ አካሏ ዘወር ብሎ
  rationale: ወደ ሰውነቷ በአካል መዞሩን ይጠብቃል፤ “አካሏ” ለσῶμα ተፈጥሯዊ ሲሆን “አስከሬን” የሚለውን ከጽሑፉ የበለጠ ጠንካራ አገላለጽ አያስገባም።
