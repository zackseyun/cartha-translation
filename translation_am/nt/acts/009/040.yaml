  rationale: ድርጊቱ በተጨባጭ ሁኔታ ሁሉን ከክፍሉ ማስወጣቱን ያሳያል፤ “አስወጥቶ” የግሪኩን ኃይል ያለ አላስፈላጊ ግፍ ያስተላልፋል።
- source_word: θεὶς τὰ γόνατα
