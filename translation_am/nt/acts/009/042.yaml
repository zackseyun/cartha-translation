id: ACT.9.42
reference: Acts 9:42
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: γνωστὸν δὲ ἐγένετο καθ’ ὅλης ⸀τῆς Ἰόππης, καὶ ⸂ἐπίστευσαν πολλοὶ⸃ ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/042.yaml
  text: And it became known throughout all Joppa, and many believed in the Lord.
translation:
  language: am
  text: ይህም በመላው ኢዮጴ ታወቀ፤ ብዙዎችም በጌታ አመኑ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνωστὸν ... ἐγένετο
  choice: ታወቀ
  rationale: ግልጽ ያልሆነውን አድራጊ ሳይጨምር፣ ነገሩ የታወቀ መሆኑን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δὲ
  choice: -ም
  rationale: በዚህ ስፍራ ትረካውን የሚያስቀጥል ቀላል አያያዥ ነው፤ የአማርኛው «-ም» ያለ ከባድ ተቃርኖ ይህን ተግባር ይፈጽማል።
- source_word: καθ’ ὅλης τῆς Ἰόππης
  choice: በመላው ኢዮጴ
  rationale: κατά ከዝርያ አገባብ ጋር የሚሰጠውን በአካባቢው ሁሉ የመሰራጨት ሐሳብ እና ὅλης የሚያመለክተውን ሙሉነት ይጠብቃል።
- source_word: Ἰόππης
  choice: ኢዮጴ
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የተለመደውን የከተማውን ስም ቅርጽ ይከተላል።
- source_word: ἐπίστευσαν
  choice: አመኑ
  rationale: የπιστεύωን ዋና ትርጉም በአጭርና ተፈጥሯዊ ትረካዊ አማርኛ ይገልጻል፤ ድርጊቱ በአንድ ጊዜ መከሰቱንም የፍጹም ጊዜው ቅርጽ ያስተላልፋል።
- source_word: πολλοὶ
  choice: ብዙዎች
  rationale: ቅጽሉ በስም ተግባር መዋሉን ያለ አላስፈላጊ ማብራሪያ በቀጥታ ይወክላል።
- source_word: ἐπὶ τὸν κύριον
  choice: በጌታ
  rationale: ከπιστεύω ጋር ያለው ἐπί የእምነትን ወይም የመታመንን ተሳቢ ይገልጻል፤ «በጌታ አመኑ» በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን ይህን ግንኙነት ይጠብቃል።
- source_word: κύριον
  choice: ጌታ
  rationale: የκύριοςን ክብር ሰጪና ክርስቶሳዊ ክብደት የሚጠብቅ መደበኛ የአማርኛ አቻ ነው።
theological_decisions:
- issue: πιστεύω + ἐπὶ τὸν κύριον አተረጓጎም
  choice: በጌታ አመኑ
  alternative: ጌታን ታመኑ
  rationale: ሐረጉ ጌታን የእምነትና የመታመን ተሳቢ አድርጎ ያቀርባል። «በጌታ አመኑ» የግል እምነትን ሐሳብ ይጠብቃል፣ ጽሑፉ ከሚለውም በላይ የተወሰነ የእምነት ሥርዓት አያስገባም።
- issue: κύριος አተረጓጎም
  choice: ጌታ
  alternative: መምህር
  rationale: «ጌታ» የማዕረጉን ክብርና በሐዋርያት ሥራ ያለውን ክርስቶሳዊ ክብደት ይጠብቃል፤ «መምህር» ግን ትርጉሙን ሊያጠብ ይችላል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። የግሪክ ዓረፍተ ነገሩን አጭር ትረካዊ አወቃቀር ጠብቋል፤ ትርጉማዊ ወይም የጽሑፍ ልዩነት ማብራሪያ ስለማያስፈልግ የግርጌ ማስታወሻ አልተጨመረም።
