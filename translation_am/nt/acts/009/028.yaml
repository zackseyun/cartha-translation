id: ACT.9.28
reference: Acts 9:28
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἦν μετ’ αὐτῶν εἰσπορευόμενος ⸂καὶ ἐκπορευόμενος⸃ εἰς ⸀Ἰερουσαλήμ, παρρησιαζόμενος ἐν τῷ ὀνόματι τοῦ ⸀κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/028.yaml
  text: And he was with them in Jerusalem, going in and going out, speaking boldly in the name of the Lord.
translation:
  language: am
  text: እርሱም በኢየሩሳሌም ከእነርሱ ጋር ነበር፤ እየገባና እየወጣም በጌታ ስም በድፍረት ይናገር ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν μετ’ αὐτῶν
  choice: ከእነርሱ ጋር ነበር
  rationale: የግሱን ቀጣይነት ያለው አብሮነት በቀላልና ተፈጥሯዊ አማርኛ ያስተላልፋል፤ ‘ተቀመጠ’ የሚለውን ተጨማሪ የመኖር ሐሳብ አያስገባም።
- source_word: εἰσπορευόμενος καὶ ἐκπορευόμενος
  choice: እየገባና እየወጣ
  rationale: የተደጋጋሚና ነፃ እንቅስቃሴን የሚገልጹትን ተጓዳኝ አንቀጾች በቅርብ መልኩ ይጠብቃል።
- source_word: εἰς Ἰερουσαλήμ
  choice: በኢየሩሳሌም
  rationale: በዚህ አገባብ εἰς የድርጊቱን ስፍራ ያመለክታል፤ ወደ ከተማዋ በተደጋጋሚ እንደገባ የሚያስመስል ትርጉምን ያስወግዳል።
- source_word: παρρησιαζόμενος
  choice: በድፍረት ይናገር ነበር
  rationale: ግልጽና ያለፍርሃት የሆነውን የሕዝብ ፊት ንግግር በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἐν τῷ ὀνόματι
  choice: በ… ስም
  rationale: ሥልጣንን፣ ውክልናንና እምነትን ሊያካትት የሚችለውን መጽሐፍ ቅዱሳዊ አገላለጽ ሳያጠብ ይጠብቃል።
- source_word: τοῦ κυρίου
  choice: የጌታ
  rationale: κύριοςን እንደ ማዕረግ ‘ጌታ’ ብሎ ይተረጉማል፤ በአውዱ ኢየሱስን ቢያመለክትም የግሪኩን ማዕረግ በስም አይተካም።
theological_decisions:
- issue: ‘ጌታ’ የሚለው ማንን እንደሚያመለክት
  choice: በዋናው ጽሑፍ ‘ጌታ’ የሚለው ማዕረግ ተጠብቋል፤ አውዱ ኢየሱስን ያመለክታል።
  alternative: ‘በኢየሱስ ስም’ ብሎ በግልጽ መተርጎም።
  rationale: የግሪኩ ጽሑፍ κυρίου ይላል እንጂ Ἰησοῦ አይልም፤ ስለዚህ ትርጉሙ ማዕረጉንና በሉቃስ–ሐዋርያት ውስጥ ያለውን ሥነ መለኮታዊ ክብደት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ የቀጣይ ድርጊት ገጽታ ‘ነበር’ እና ‘እየ…’ በሚሉ ቅርጾች ተጠብቋል። የጽሑፍ ልዩነቶቹ በዚህ አንቀጽ ትርጉም ላይ ጠቃሚ የሆነ አማራጭ ንባብ ስለማይፈጥሩ የግርጌ ማስታወሻ አልተጨመረም።
