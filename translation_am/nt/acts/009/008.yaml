lexical_decisions:
- source_word: ἠγέρθη
  choice: ተነሣ
  rationale: በዚህ ትረካዊ አውድ ግሱ ሳውል ከወደቀበት መሬት መነሣቱን ያመለክታል፤ «ተነሣ» ተፈጥሯዊና ግልጽ ነው።
- source_word: ἀπὸ τῆς γῆς
  choice: ከመሬት
  rationale: γῆ እዚህ ሳውል የወደቀበትን መሬት እንጂ ዓለምን ወይም አገርን አያመለክትም።
- source_word: ἀνεῳγμένων ... τῶν ὀφθαλμῶν αὐτοῦ
  choice: ዓይኖቹ የተከፈቱ ቢሆኑም
  rationale: የግሪኩ ገላጭ አገባብ ዓይኖቹ ተከፍተው ሳሉ ማየት አለመቻሉን በተቃርኖ ያቀርባል፤ «ቢሆኑም» ይህን አውዳዊ ተቃርኖ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: οὐδὲν ἔβλεπεν
