base_translation:
  language: en
  yaml_path: translation/nt/acts/009/008.yaml
  text: But Saul got up from the ground[a], and though his eyes were open, he saw nothing. So they led him by the hand and brought him into Damascus.
translation:
  language: am
  text: ሳውል ግን ከመሬት ተነሣ፤ ዓይኖቹ ተከፍተው ቢሆኑም[a] ምንም አላየም። ስለዚህ እጁን ይዘው ወደ ደማስቆ አስገቡት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ይበልጥ ቃል በቃል፣ «ዓይኖቹ ተከፍተው ሳሉ፣ ምንም አይታየውም ነበር።» የግሪኩ አገባብ ዓይኖቹ ተከፍተው ቢሆንም ማየት አለመቻሉ የሚፈጥረውን ተቃርኖ ያጎላል።
