reference: Acts 9:13
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἀπεκρίθη δὲ Ἁνανίας· Κύριε, ⸀ἤκουσα ἀπὸ πολλῶν περὶ τοῦ ἀνδρὸς τούτου, ὅσα κακὰ ⸂τοῖς ἁγίοις σου ἐποίησεν⸃ ἐν Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/013.yaml
  text: But Ananias answered[a], “Lord, I have heard from many about this man, how much evil he has done to your saints in Jerusalem.”
translation:
  language: am
  text: ነገር ግን ሐናንያ እንዲህ ሲል መለሰ፦ “ጌታ ሆይ፣ ይህ ሰው በኢየሩሳሌም በቅዱሳንህ ላይ ምን ያህል ክፉ ነገር እንዳደረገ ከብዙዎች ሰምቻለሁ።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη δὲ Ἁνανίας
  choice: ነገር ግን ሐናንያ እንዲህ ሲል መለሰ
  rationale: δέ በዚህ የትረካ አውድ የሐናንያን ማመንታት የሚያሳይ ቀላል ተቃርኖ አለው፤ ἀπεκρίθη ደግሞ በተፈጥሯዊ አማርኛ ‘መለሰ’ ተብሏል።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: ቀጥተኛ ጥሪን በተፈጥሯዊ አማርኛ ያሳያል፤ በአውዱም ሐናንያ በራእይ ለተገለጠለት ኢየሱስ እየመለሰ ነው።
- source_word: ἤκουσα ἀπὸ πολλῶν
  choice: ከብዙዎች ሰምቻለሁ
  rationale: የሰማው ወሬ አሁን ለሚያቀርበው ማመንታት ጠቃሚ መሆኑን የአማርኛው ፍጹም ጊዜ በተፈጥሯዊነት ያሳያል፤ πολλῶν ያልገለጸውን ስም ሳይጨምር ‘ከብዙዎች’ ተብሏል።
- source_word: περὶ τοῦ ἀνδρὸς τούτου
  choice: ይህ ሰው … እንደ
  rationale: የግሪኩ የወሬ ርዕስ በአማርኛ የተዘዋዋሪ ንግግር አወቃቀር ውስጥ በተፈጥሯዊነት ተካቷል።
- source_word: ὅσα κακὰ
  choice: ምን ያህል ክፉ ነገር
  rationale: የጉዳቱን ብዛትና ከባድነት ሳያጠብ ያሳያል፤ κακά ያለውን የሥነ ምግባር ክፋት እንጂ ጉዳትን ብቻ አያመለክትም።
- source_word: τοῖς ἁγίοις σου
  choice: ቅዱሳንህ
  rationale: የአዲስ ኪዳንን የቡድን መጠሪያ እና ‘ያንተ’ የሚለውን የንብረት ግንኙነት ይጠብቃል።
- source_word: ἐποίησεν ἐν Ἰερουσαλήμ
  choice: በኢየሩሳሌም … እንዳደረገ
  rationale: ποιέω የሚለውን ሰፊ ግስ ‘አደረገ’ በሚለው ቀጥተኛ አቻ ያቀርባል፤ ἐν Ἰερουσαλήμ ደግሞ የቦታ ትርጉሙን ይጠብቃል።
theological_decisions:
- issue: በΚύριε የተጠራው ማን እንደሆነና የቃሉ ክብደት
  choice: ለኢየሱስ የቀረበ ቀጥተኛ ጥሪ፣ ‘ጌታ ሆይ’
  alternative: በአክብሮት ብቻ ‘ጌታዬ/አለቃዬ’ የሚል ጥሪ
  rationale: በቅርብ አውዱ ሐናንያ በራእይ ከተናገረው ከትንሣኤው ኢየሱስ ጋር እየተነጋገረ ስለሆነ፣ ‘ጌታ ሆይ’ የትረካውን መለኮታዊ ክብደት ሳያበዛ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የግሪኩ የቃላት ቅደም ተከተል በአማርኛ ተፈጥሯዊ የተዘዋዋሪ ንግግር አወቃቀር ተደርጓል። የእንግሊዝኛው [a] ማስታወሻ በተሰጠው ዋና ጽሑፍ ላይ ቢኖርም ይዘቱ ከዋናው ንባብ ጋር ተመሳሳይ ነው፤ በአማርኛም ‘ቅዱሳንህ’ እና ‘ምን ያህል ክፉ ነገር’ ሁለቱንም በቀጥታ ስለሚያስተላልፉ አላስፈላጊ የግርጌ ማስታወሻ አልተጨመረም።
