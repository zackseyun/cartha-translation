id: ACT.9.10
reference: Acts 9:10
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ἦν δέ τις μαθητὴς ἐν Δαμασκῷ ὀνόματι Ἁνανίας, καὶ εἶπεν πρὸς αὐτὸν ⸂ἐν ὁράματι ὁ κύριος⸃· Ἁνανία. ὁ δὲ εἶπεν· Ἰδοὺ ἐγώ, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/010.yaml
  text: There was a disciple in Damascus named Ananias, and the Lord said to him in a vision, “Ananias.” And he said, “Here I am, Lord.”
translation:
  language: am
  text: በደማስቆ ሐናንያ የሚባል አንድ ደቀ መዝሙር ነበረ። ጌታም በራእይ፣ “ሐናንያ!” አለው። እርሱም፣ “ጌታ ሆይ፣ እነሆኝ!” አለ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἦν δέ
  choice: ነበረ፤ ...ም
  rationale: የεἰμί ያልተፈጸመ ጊዜ አዲስ ተሳታፊን ያስተዋውቃል፤ δέ ደግሞ ቀላል የትረካ ሽግግር ስለሚያመለክት በተፈጥሯዊ የአማርኛ ትረካ አወቃቀር ተገልጧል።
- source_word: τις μαθητὴς
  choice: አንድ ደቀ መዝሙር
  rationale: τις እዚህ ያልተወሰነ ሰውን ያስተዋውቃል፤ “አንድ” በዘመናዊ አማርኛ ይህን ተግባር በተፈጥሮ ይፈጽማል።
- source_word: ἐν Δαμασκῷ
  choice: በደማስቆ
  rationale: ἐν ከዳቲቭ ጋር የቦታ ትርጉም አለው፤ “በደማስቆ” መደበኛው የአማርኛ አገላለጽ ነው።
- source_word: ὀνόματι Ἁνανίας
  choice: ሐናንያ የሚባል
  rationale: ὀνόματι የስም መግለጫ ፈሊጥ ሲሆን “የሚባል” ተፈጥሯዊና ግልጽ ነው።
- source_word: ἐν ὁράματι
  choice: በራእይ
  rationale: ጌታ ሐናንያን ያነጋገረበትን መንገድ ያመለክታል፤ “በራእይ” አጭርና የተለመደ ነው።
- source_word: ὁ κύριος
  choice: ጌታ
  rationale: በትረካው አውድ የተነሣውን ኢየሱስ ያመለክታል፤ የግሪኩ አንቀጽ በአማርኛ የግድ በተለየ ቃል አይገለጽም።
- source_word: εἶπεν πρὸς αὐτόν
  choice: አለው
  rationale: λέγω ከπρός እና አኩዛቲቭ ጋር የቀጥታ ንግግርን ያሳያል፤ “አለው” የተፈጥሮ አማርኛ ነው።
- source_word: Ἰδοὺ ἐγώ
  choice: እነሆኝ
  rationale: ይህ ለጥሪ የሚሰጥ የትኩረትና የዝግጁነት መልስ ነው፤ “እነሆኝ” ፈሊጣዊ ኃይሉን ይጠብቃል።
- source_word: κύριε
  choice: ጌታ ሆይ
  rationale: በራእዩ ውስጥ ለሚናገረው ጌታ የቀረበ የጥሪ ቅርጽ ስለሆነ “ሆይ” የግሪኩን ቮካቲቭ በተፈጥሮ ይገልጣል።
theological_decisions:
- issue: በራእዩ ውስጥ የὁ κύριος / κύριε ተጠቃሽ
  choice: ሁለቱም “ጌታ” ተብለው ተተርጉመው በአውዱ የተነሣውን ኢየሱስ ያመለክታሉ
  alternative: አጠቃላይ መለኮታዊ ጥሪ፣ ወይም κύριεን “ጌታዬ/ክቡር” በሚል ሰፊ ትርጉም መውሰድ
  rationale: በሐዋርያት ሥራ 9 ቀጣዩ አውድ ሐናንያን የሚልከውንና ሳውልን የመረጠውን ጌታ ያሳያል። “ጌታ” የክርስቶሳዊውን ኃይል ሳያብራራ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የንግግር ምልክቶችና አጭር ዓረፍተ ነገሮች የትረካውን ፍሰት ያቀላጥፋሉ፤ ያልተፈለገ የቤተ እምነት ልዩ ቃላት አልገቡም።
