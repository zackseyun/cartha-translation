  text: Ἐγένετο δὲ Πέτρον διερχόμενον διὰ πάντων κατελθεῖν καὶ πρὸς τοὺς ἁγίους τοὺς κατοικοῦντας Λύδδα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/032.yaml
  text: As Peter was passing through all of them, he also went down to the saints living in Lydda.
translation:
  language: am
  text: ጴጥሮስ በሁሉም እየተዘዋወረ ሳለ፣ በልዳ ወደሚኖሩት ቅዱሳንም ወረደ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διερχόμενον διὰ πάντων
  choice: በየአካባቢው ሁሉ እየተዘዋወረ
  rationale: ቃል በቃል ‘በሁሉ በኩል ሲያልፍ’ የሚለው በአማርኛ ግልጽ ስላልሆነ፣ በዐውደ ንባቡ የቦታዎችን ወይም የማኅበረሰቦችን ዙሪያ መጎብኘቱን በተፈጥሯዊ አገላለጽ ያሳያል።
- source_word: κατελθεῖν
  choice: ወረደ
  rationale: የግሪኩን የአቅጣጫ ግስ በቀጥታ ይጠብቃል፤ ኢየሩሳሌምን መነሻ አድርጎ ስለ ጉዞ በሚነገርበት የመጽሐፍ ቅዱስ አጠቃቀምም ተፈጥሯዊ ነው።
- source_word: τοὺς ἁγίους
  choice: ቅዱሳን
  rationale: በሐዋርያት ሥራ ዐውደ ንባብ ለአማኞች የተሰጠውን የማኅበረሰብ መጠሪያ ይጠብቃል።
- source_word: Λύδδα
  choice: ልዳ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የቦታውን ስም ይከተላል።
theological_decisions:
- issue: ‘ቅዱሳን’ የሚለው መጠሪያ ወሰን
  choice: በልዳ ለሚኖሩት የአማኞች ማኅበረሰብ እንደተሰጠ በቀጥታ መተርጎም
  alternative: ‘አማኞች’ ብሎ ማብራራት
  rationale: ‘ቅዱሳን’ የሚለውን የምንጩን ሥነ መለኮታዊ ቃል ሳያሳንስ ይጠብቃል፣ ነገር ግን ልዩ የተቋም ወይም የቤተ እምነት ትርጉም አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና በቀላሉ የሚነበብ አማርኛ ተጠቅሟል። የግሪኩ Ἐγένετο δὲ እንደ ትረካ ማያያዣ ስለሚሠራ፣ በአማርኛ ከባድ የሆነ ‘እንዲህም ሆነ’ የሚል መግቢያ አልተጨመረም፤ የ‘δέ’ ማያያዣ ተግባርም በትረካው ፍሰት ተገልጧል።
