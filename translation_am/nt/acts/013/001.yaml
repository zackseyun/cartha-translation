  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ይጠቀማል። የሰዎችና የቦታዎች ስሞች በተለመደ የአማርኛ ቅርጽ ቀርበዋል፤ የግሪኩ አሻሚነት በማስታወሻዎች ተጠብቋል።
