  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ἦσαν ⸀δὲ ἐν Ἀντιοχείᾳ κατὰ τὴν οὖσαν ἐκκλησίαν προφῆται καὶ διδάσκαλοι ὅ τε Βαρναβᾶς καὶ Συμεὼν ὁ καλούμενος Νίγερ, καὶ Λούκιος ὁ Κυρηναῖος, Μαναήν τε Ἡρῴδου τοῦ τετραάρχου σύντροφος καὶ Σαῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/001.yaml
  text: 'In Antioch[a], in the church there, there were prophets and teachers: Barnabas, Simeon who was called Niger, Lucius the Cyrenian, Manaen, a close companion of Herod the tetrarch[c][b], and Saul.'
translation:
  language: am
  text: በአንጾኪያ ባለችው ቤተ ክርስቲያን ውስጥ ነቢያትና አስተማሪዎች ነበሩ፤ እነርሱም በርናባስ፣ ኒጌር[a] ተብሎ የሚጠራው ስምዖን፣ ቀሬናዊው ሉቅዮስ[b]፣ የቴትራርኩ ሄሮድስ የቅርብ ባልንጀራ የነበረው ምናሔም[c][d]፣ እና ሳውል ነበሩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ኒጌር” በላቲን ቋንቋ “ጥቁር” ማለት ነው። እዚህ ግን ከመተርጎም ይልቅ እንደ ግል መጠሪያ በድምፅ ተጽፏል።
    reason: lexical_alternative
  - marker: b
    text: ቀሬና በሰሜን አፍሪካ የነበረች ከተማ ናት፤ ሉቅዮስ ከዚያ የመጣ ነበር።
    reason: cultural_note
  - marker: c
    text: ወይም፣ “ከቴትራርኩ ሄሮድስ ጋር አብሮ ያደገው”፣ ወይም “የቴትራርኩ ሄሮድስ የጡት ወንድም።”
    reason: alternative_reading
  - marker: d
    text: “ቴትራርክ” በሮማውያን ዘመን ለአንድ ክልል ገዢ የሚሰጥ ማዕረግ ነበር።
    reason: cultural_note
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: ነበሩ
  rationale: ዋናውን የመኖር ግስ በተፈጥሯዊ አማርኛ ይገልጣል፤ δέ ቀላል ማያያዣ በመሆኑ የተለየ ተቃርኖ አልተጫነበትም።
- source_word: κατὰ τὴν οὖσαν ἐκκλησίαν
  choice: በነበረችው ቤተ ክርስቲያን
  rationale: በአንጾኪያ የምትገኘውን የክርስቲያኖች ማኅበር በቦታ አመልካች አገላለጽ ያቀርባል።
- source_word: προφῆται καὶ διδάσκαλοι
  choice: ነቢያትና አስተማሪዎች
  rationale: በጉባኤው ውስጥ የነበሩትን ሁለት የአገልግሎት ምድቦች ቀጥታና ግልጽ በሆነ መንገድ ይተረጉማል።
- source_word: Συμεὼν ὁ καλούμενος Νίγερ
  choice: ኒጌር ተብሎ የሚጠራው ስምዖን
  rationale: የግሪኩን የስም ቅርጽና የመጠሪያውን ተግባር ይጠብቃል፤ Νίγερ እንደ ስም በድምፅ ተጽፏል።
- source_word: Λούκιος ὁ Κυρηναῖος
  choice: ቀሬናዊው ሉቅዮስ
  rationale: Λούκιοςን ሉቅዮስ ብሎ በድምፅ ይጽፋል፤ Κυρηναῖος ደግሞ ከቀሬና የመጣ ሰው መሆኑን ያሳያል።
- source_word: Μαναήν
  choice: ምናሔም
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የታወቀውን የግል ስም ቅርጽ ይጠቀማል።
- source_word: Ἡρῴδου τοῦ τετραάρχου
  choice: ከገዢው ከሄሮድስ
  rationale: τετραάρχης በታሪካዊ አውዱ የክልል ገዢ ማዕረግ ነው፤ አማርኛው 'ገዢ' ለተራ አንባቢ ግልጽ ነው።
- source_word: σύντροφος
  choice: አብሮ ያደገው
  rationale: ቃሉ አብሮ የማደግን ግንኙነት ሊያመለክት ይችላል፤ ይህ ትርጉም 'የጡት ወንድም' የሚለውን ጠባብ ግምት ሳያስገድድ ዋናውን ሐሳብ ያቀርባል።
theological_decisions:
- issue: በአንጾኪያ ጉባኤ ውስጥ የነቢያትና የአስተማሪዎች ሚና
  choice: ጽሑፉ እንዳለው 'ነቢያትና አስተማሪዎች' ተብሎ ቀጥታ ተተርጉሟል።
  alternative: ቃላቱን ከጊዜ በኋላ በተቋቋመ የቤተ ክርስቲያን የሥልጣን መዋቅር መሠረት እንደ መደበኛ ሹመቶች መተርጎም።
  rationale: ቁጥሩ ሰዎቹን በእነዚህ የአገልግሎት መጠሪያዎች ይለያል እንጂ የኋለኛውን ተቋማዊ ሥርዓት አይገልጽም።
- issue: σύντροφος ከሄሮድስ ጋር ያለውን ግንኙነት የሚያመለክተው መንገድ
  choice: አብሮ ያደገው
  alternative: የጡት ወንድሙ፤ የቅርብ ጓደኛው
  rationale: የግሪኩ ቃል የጋራ እድገትን ወይም ቅርብ አብሮነትን ሊገልጽ ይችላል። ዋናው ጽሑፍ አብሮ ማደጉን ያስቀምጣል፤ የጡት ወንድምነት ግን በማስታወሻ እንደ አማራጭ ተጠቅሷል።
