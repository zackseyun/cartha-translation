- source_word: τὴν ... ἐπαγγελίαν
  choice: የተስፋ ቃል
  rationale: በዚህ አውድ የአምላክን የተስፋ ቃል ያመለክታል፤ ይህም በዘመናዊ አማርኛ የተለመደና ግልጽ ነው።
- source_word: πρὸς τοὺς πατέρας
  choice: ለአባቶች
  rationale: πρός የተስፋውን ተቀባዮች ያመለክታል፤ ‘አባቶች’ የሚለው ቃል የግሪክኛውን ወንዳዊ የቤተሰብ ቃልና ታሪካዊ አጠቃቀሙን ይጠብቃል።
- source_word: γενομένην
  choice: የተሰጠውን
  rationale: ከ‘የተስፋ ቃል’ ጋር ተፈጥሯዊ አማርኛ ሲሆን፣ ቃሉ ለአባቶች መድረሱን ያሳያል፤ ‘የተፈጸመውን’ በማለት የቀጣዩን ቁጥር አስቀድሞ አይተረጉምም።
