  rationale: The revision corrects the evangelizing verb to the natural plural form እናበስራችኋለን, which incorporates the Greek plural addressee and communicates proclamation of good news. It retains the source’s emphasis through explicit እኛ, preserves the promise as given to the fathers, and leaves the lexical-alternative footnote properly anchored.
