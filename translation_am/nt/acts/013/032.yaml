- source_word: ὑμᾶς
  choice: ለእናንተ
  rationale: ከεὐαγγελιζόμεθα ጋር የተጠቀሰውን የመልእክቱን ተቀባይ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: εὐαγγελιζόμεθα
  choice: የምሥራች እናበስራለን
