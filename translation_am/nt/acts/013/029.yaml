    issue: The main-text phrase ከእንጨት is indefinite and semantically broad.
    rationale: The Greek has the definite phrase ἀπὸ τοῦ ξύλου. In contemporary Amharic, እንጨት commonly denotes wood as material, whereas ከዛፉ more naturally renders “from the tree” and preserves the marked lexical choice.
