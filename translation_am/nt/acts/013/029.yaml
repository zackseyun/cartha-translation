  terminology: መቃብር and አኖሩት are appropriate. Rendering ξύλον as ዛፍ in the text preserves its literal lexical sense and possible Deuteronomy resonance without prematurely substituting መስቀል; the footnote appropriately supplies that contextual alternative.
