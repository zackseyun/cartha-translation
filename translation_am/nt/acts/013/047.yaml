  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የጥቅሱ ግጥማዊ አጭርነት እና የ‘ለድነት’ ሥነ መለኮታዊ ክፍትነት ተጠብቀዋል።
