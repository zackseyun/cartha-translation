source:
  edition: SBLGNT
  text: οὕτως γὰρ ἐντέταλται ἡμῖν ὁ κύριος· Τέθεικά σε εἰς φῶς ἐθνῶν τοῦ εἶναί σε εἰς σωτηρίαν ἕως ἐσχάτου τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/047.yaml
  text: 'For so the Lord has commanded us: ‘I have set you as a light for the nations[b][a], so that you may be for salvation to the end of the earth.’'
translation:
  language: am
  text: ጌታ እንዲህ ብሎ አዞናልና፦ “አንተን ለሕዝቦች[a] ብርሃን አድርጌሃለሁ፤ እስከ ምድር ዳርቻ[b] ድረስ ለድነት እንድትሆን።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለአሕዛብ ብርሃን።” የግሪኩ ἐθνῶν “ሕዝቦች/ብሔራት” ወይም በብዙ አውዶች “አሕዛብ” ማለት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “እስከ ምድር ዳርቻዎች።”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: እንዲህ ብሎ
  rationale: የጌታን ትእዛዝ ቀጥሎ በጥቅስ የሚያቀርብ ተፈጥሯዊ የአማርኛ አገላለጽ ሲሆን፣ ‘እንዲህ’ የሚለው የግሪኩን የአካሄድና የማስረጃ ኃይል ይጠብቃል።
- source_word: ἐντέταλται ἡμῖν
  choice: አዞናል
  rationale: ፍጹም ጊዜው አስቀድሞ የተሰጠና አሁንም በኃይል ያለ ትእዛዝን ያመለክታል፤ ‘አዞናል’ ይህን በአጭርና በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: ὁ κύριος
  choice: ጌታ
  rationale: በተጠቀሰው ቅዱስ ጽሑፍ የሚናገረውን መለኮታዊ ባለሥልጣን በተለመደውና በክብር ባለው የአማርኛ ቃል ይገልጣል።
- source_word: Τέθεικά σε
  choice: አንተን … አድርጌሃለሁ
  rationale: የተመሰረተ ሹመትን ወይም መደብን የሚያመለክተውን ፍጹም ጊዜ ይጠብቃል፤ ነጠላውን ‘አንተን’ በማቆየት ጥቅሱ በሐዋርያዊ ተልእኮ ላይ እንዴት እንደሚውል ትርጉሙ አስቀድሞ አይፈታም።
- source_word: εἰς φῶς ἐθνῶν
  choice: ለሕዝቦች ብርሃን
  rationale: ‘ብርሃን’ የሚለውን ዘይቤ ይጠብቃል፤ ‘ሕዝቦች’ ደግሞ የኢሳይያስን ሰፊ የብሔራት አድማስ ያሳያል፣ የ‘አሕዛብ’ አማራጭም በማስታወሻ ተጠብቋል።
- source_word: τοῦ εἶναί σε
  choice: እንድትሆን
  rationale: የግሪኩን የዓላማ ወይም የውጤት ኃይል በቀጥታና በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: εἰς σωτηρίαν
  choice: ለድነት
  rationale: ግሪኩ ተናጋሪው ራሱ ድነት ነው ወይስ የድነት መንገድ ነው ብሎ በግልጽ አይፈታም፤ ‘ለድነት’ ይህን አጭርነትና ውጥረት ይጠብቃል።
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: እስከ ምድር ዳርቻ ድረስ
  rationale: የግሪኩን ነጠላ ‘የምድር ጫፍ/ዳርቻ’ በቅርብ ይከተላል፤ ብዙ ቁጥር ያለው ባህላዊ አገላለጽ በማስታወሻ ቀርቧል።
theological_decisions:
- issue: የኢሳይያስ ጥቅስ ተናጋሪና ተቀባይ በጳውሎስና በበርናባስ ተልእኮ ላይ የሚውልበት ሁኔታ
  choice: የጥቅሱን ነጠላ ሁለተኛ መደብ ‘አንተን/እንድትሆን’ እንዳለ ማቆየት
  alternative: ጥቅሱን በብዙ ቁጥር በመተርጎም በቀጥታ ጳውሎስንና በርናባስን እንዲያመለክት ማድረግ፣ ወይም ተናጋሪውንና ተቀባዩን በትርጉሙ ውስጥ በስም መለየት
  rationale: የግሪክ ጽሑፉ ቅዱስ ጽሑፉን በቀጥታ ጠቅሶ በአገልጋዩ ጥቅስና በሐዋርያዊ ተልእኮ መካከል ያለውን ሥነ መለኮታዊ ግንኙነት በዝርዝር አይፈታም። ነጠላውን ማቆየት ይህን ውጥረት ይጠብቃል።
