  text: λυθείσης δὲ τῆς συναγωγῆς ἠκολούθησαν πολλοὶ τῶν Ἰουδαίων καὶ τῶν σεβομένων προσηλύτων τῷ Παύλῳ καὶ τῷ Βαρναβᾷ, οἵτινες προσλαλοῦντες ⸀αὐτοῖς ἔπειθον· αὐτοὺς ⸀προσμένειν τῇ χάριτι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/043.yaml
  text: After the synagogue had been dismissed[a], many of the Jews and devout proselytes followed Paul and Barnabas, who, speaking with them[c][b], were urging them to continue in the grace of God.
translation:
  language: am
  text: የምኩራቡ ጉባኤ ከተበተነ በኋላ፣[a] ከአይሁድና አምላክን ከሚያከብሩ ወደ አይሁድነት ከገቡ ሰዎች ብዙዎች ጳውሎስንና በርናባስን ተከተሉ። ጳውሎስና በርናባስም እያነጋገሯቸው፣ በእግዚአብሔር ጸጋ ውስጥ እንዲቀጥሉ ያሳምኗቸው ነበር።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የምኩራቡ ስብሰባ ከተፈታ በኋላ።» የግሪኩ አገላለጽ ሕንፃውን ሳይሆን የተሰበሰበው ጉባኤ መበተኑን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «በእግዚአብሔር ጸጋ ውስጥ እንዲቆዩ ያሳምኗቸው ነበር።»
    reason: lexical_alternative
lexical_decisions:
- source_word: λυθείσης ... τῆς συναγωγῆς
  choice: የምኩራቡ ጉባኤ ከተበተነ በኋላ
  rationale: የግሪኩ ሐረግ ቀድሞ የተፈጸመውን ሁኔታ ያመለክታል፤ συναγωγή እዚህ ሕንፃውን ሳይሆን የተሰበሰበውን ጉባኤ ሊያመለክት ስለሚችል «የምኩራቡ ጉባኤ» ተብሏል።
- source_word: τῶν σεβομένων προσηλύτων
  choice: አምላክን ከሚያከብሩ ወደ አይሁድነት ከገቡ ሰዎች
  rationale: προσήλυτος ወደ አይሁድነት የገባን ሰው ያመለክታል፤ σεβομένων ደግሞ ሃይማኖታዊ አክብሮታቸውን ይገልጣል። ትርጉሙ ሁለቱንም ገጽታዎች በግልጽ ያቀርባል።
- source_word: ἠκολούθησαν
  choice: ተከተሉ
  rationale: ከጉባኤው በኋላ ጳውሎስንና በርናባስን ተከትለው መሄዳቸውን በቀጥታ ያሳያል።
- source_word: προσλαλοῦντες αὐτοῖς
  choice: እያነጋገሯቸው
  rationale: ተከታታይና ቀጥተኛ የንግግር መስተጋብርን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἔπειθον
  choice: ያበረታቷቸው ነበር
  rationale: ያልተጠናቀቀው የግስ አቀራረብ ቀጣይነት ያለውን ማሳሰብ ያመለክታል፤ በዚህ አውድ «ያበረታቷቸው ነበር» የማሳሰብን ኃይል በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: αὐτοὺς προσμένειν
  choice: እንዲጸኑ
  rationale: προσμένω መቆየትን፣ መቀጠልን ወይም ጸንቶ መኖርን ያመለክታል፤ «እንዲጸኑ» በጸጋው ውስጥ የሚኖረውን ቀጣይነት በአጭሩ ይገልጣል።
- source_word: τῇ χάριτι τοῦ θεοῦ
  choice: በእግዚአብሔር ጸጋ
  rationale: የግሪኩን ሥነ መለኮታዊ ክብደት ሳያጠብ የእግዚአብሔርን ቸርነትና ጸጋው የሚፈጥረውን የሕይወት ክልል ክፍት አድርጎ ይጠብቃል።
theological_decisions:
- issue: «በእግዚአብሔር ጸጋ መጽናት» የሚለው ሐረግ ወሰን
  choice: በእግዚአብሔር ጸጋ እንዲጸኑ
  alternative: በእግዚአብሔር ሞገስ እንዲቆዩ፤ ስለ እግዚአብሔር ጸጋ በሚናገረው መልእክት እንዲቀጥሉ
  rationale: ሐረጉ የእግዚአብሔርን የጸጋ እርምጃም ሆነ በዚያ ጸጋ የተቀረጸውን የኑሮ ሁኔታ ሊያካትት ይችላል። አንዱን ብቻ በመምረጥ የሥነ መለኮት ውጥረቱን ከመፍታት ይልቅ ሰፊው አገላለጽ ተጠብቋል።
