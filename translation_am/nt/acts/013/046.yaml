  text: παρρησιασάμενοί ⸀τε ὁ Παῦλος καὶ ὁ Βαρναβᾶς εἶπαν· Ὑμῖν ἦν ἀναγκαῖον πρῶτον λαληθῆναι τὸν λόγον τοῦ θεοῦ· ⸀ἐπειδὴ ἀπωθεῖσθε αὐτὸν καὶ οὐκ ἀξίους κρίνετε ἑαυτοὺς τῆς αἰωνίου ζωῆς, ἰδοὺ στρεφόμεθα εἰς τὰ ἔθνη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/046.yaml
  text: So Paul and Barnabas spoke boldly and said[a], “It was necessary that the word of God be spoken first to you. Since you are rejecting it and judging yourselves unworthy of eternal life, look, we are turning to the Gentiles.”
translation:
  language: am
  text: ጳውሎስና በርናባስም በድፍረት እንዲህ አሉ፤ “የእግዚአብሔር ቃል አስቀድሞ ለእናንተ መነገር ያስፈልግ ነበር። እናንተ ግን የእግዚአብሔርን ቃል ስለምትገፉትና ራሳችሁን ለዘላለም ሕይወት ብቁ እንዳልሆናችሁ ስለምትቆጥሩ፣ እነሆ፣ ወደ አሕዛብ[a] እንዞራለን።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወደ ብሔራት።” እዚህ ሐረጉ ከምኩራቡ አድማጮች በተቃራኒ አይሁድ ያልሆኑትን ያመለክታል፤ ስለዚህ በዋናው ጽሑፍ “አሕዛብ” ተብሏል።
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησιασάμενοί
  choice: በድፍረት
  rationale: ተሳቢው ግልጽና ደፋር ንግግርን ያመለክታል፤ በአማርኛ ከዋናው ግስ ‘አሉ’ ጋር እንደ ተውሳከ ግስ መተርጎሙ ተፈጥሯዊ ነው።
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: የእግዚአብሔር ቃል
  rationale: በአዲስ ኪዳን የተለመደውን፣ መለኮታዊ መልእክትን የሚጠቁመውን አገላለጽ ይጠብቃል።
- source_word: ἀναγκαῖον πρῶτον λαληθῆναι
  choice: አስቀድሞ … መነገር ያስፈልግ ነበር
  rationale: የነገሩን አስፈላጊነት፣ የቅደም ተከተል ቅድሚያና የግሱን ተደራጊ ቅርጽ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀπωθεῖσθε αὐτὸν
  choice: የእግዚአብሔርን ቃል ስለምትገፉት
  rationale: ‘መግፋት’ የመልእክቱን ንቁና ቀጣይ እምቢታ ይገልጣል፤ ተውላጠ ስሙ በአማርኛ ግልጽ እንዲሆን ዋቢው በስም ተደግሟል።
- source_word: οὐκ ἀξίους κρίνετε ἑαυτοὺς
  choice: የማትገቡ እንደሆናችሁ በራሳችሁ ስለምትፈርዱ
  rationale: κρίνετε ያለውን የፍርድ ኃይልና ἑαυτούς ያለውን አንጸባራቂ አጽንዖት ይጠብቃል፤ ‘የማትገቡ’ በዚህ ዐውድ ያለውን ἀνάξιος ለዘመናዊ አንባቢ በግልጽ ያቀርባል።
- source_word: τὰ ἔθνη
  choice: አሕዛብ
  rationale: በምኩራብ ያሉትን አይሁድ ከአይሁድ ካልሆኑት ሕዝቦች የሚለየውን ቅርብ ዐውድ ያስጠብቃል።
theological_decisions:
- issue: በድነት ታሪክ ዐውድ ውስጥ የτὰ ἔθνη ትርጉም
  choice: አሕዛብ
  alternative: ብሔራት / ሕዝቦች
  rationale: በቅርቡ ዐውድ ‘እናንተ’ የተባሉት የምኩራቡ አድማጮች ሲሆኑ፣ ተቃራኒው አይሁድ ያልሆኑትን ያመለክታል። ‘አሕዛብ’ ይህን ልዩነት ይጠብቃል።
- issue: οὐκ ἀξίους κρίνετε ἑαυτοὺς የሚያመለክተው ፈራጅ
  choice: በራሳችሁ ስለምትፈርዱ
  alternative: ጳውሎስ ብቁ እንዳልሆኑ ይፈርድባቸዋል
  rationale: የግሪኩ አንጸባራቂ ተውላጠ ስም ፍርዱን በአድማጮቹ ራሳቸው ላይ ያኖራል፤ ትርጉሙም ከጽሑፉ በላይ የሆነ ዶክትሪናዊ ድምዳሜ አያስገባም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። የግሪኩን የንግግር ድፍረት፣ የመልእክቱን ቅድሚያ፣ የአድማጮቹን ንቁ እምቢታና በራሳቸው ላይ የሚሰጡትን ፍርድ ይጠብቃል።
