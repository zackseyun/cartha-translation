  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὡς δὲ ἐπλήρου ⸀Ἰωάννης τὸν δρόμον, ἔλεγεν· ⸂Τί ἐμὲ⸃ ὑπονοεῖτε εἶναι; οὐκ εἰμὶ ἐγώ· ἀλλ’ ἰδοὺ ἔρχεται μετ’ ἐμὲ οὗ οὐκ εἰμὶ ἄξιος τὸ ὑπόδημα τῶν ποδῶν λῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/025.yaml
  text: And as John was completing his course[a], he kept saying, ‘What do you suppose me to be? I am not he. But look, one is coming after me[b], the sandals of whose feet I am not worthy to untie.’
translation:
  language: am
  text: ዮሐንስም ሩጫውን ወደ ፍጻሜ እያደረሰ ሳለ እንዲህ ይል ነበር፤ “እኔ ማን እንደሆንሁ ትገምታላችሁ? እኔ እርሱ አይደለሁም።[a] ነገር ግን እነሆ፣ ከእኔ በኋላ አንድ ሰው እየመጣ ነው፤ እኔም የእግሮቹን ጫማዎች ለመፍታት እንኳ የሚገባኝ አይደለሁም።”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይበልጥ በግልጽ አነጋገር፣ “እኔ ማን እንደሆንሁ ትገምታላችሁ? እኔ መሲሑ አይደለሁም።” ሊል ይችላል። የግሪኩ ጽሑፍ ዮሐንስ የካደውን ማንነት በግልጽ አይጠቅስም፤ ዐውደ ንባቡ ግን መሲሑን እንደሚያመለክት ያሳያል።
    reason: alternative_reading
  - marker: b
    text: አንዳንድ የእጅ ጽሑፎችና ትርጉሞች “የጫማዎቹን ማሰሪያ ለመፍታት” ብለው ይተረጉማሉ። እዚህ የታተመው የግሪክ ጽሑፍ ግን “የእግሮቹን ጫማዎች ለመፍታት” ብቻ ይላል።
    reason: textual_variant
lexical_decisions:
- source_word: ἐπλήρου ... τὸν δρόμον
  choice: ሩጫውን ወደ ፍጻሜ እያደረሰ ሳለ
  rationale: የተሰጠውን ተልእኮ ወይም የሕይወት ጉዞ የሚያመለክተውን የሩጫ ዘይቤ ይጠብቃል፤ የግሪኩንም ቀጣይ ያለፈ ድርጊት በ“እያደረሰ ሳለ” ያሳያል።
- source_word: ἔλεγεν
  choice: ይል ነበር
  rationale: ንግግሩ አንድ ጊዜ ብቻ ሳይሆን ቀጣይ ወይም ተደጋጋሚ እንደነበር ያሳያል።
- source_word: Τί ἐμὲ ὑπονοεῖτε εἶναι;
  choice: እኔ ማን እንደሆንሁ ትገምታላችሁ?
  rationale: τί በቀጥታ “ምን” ቢሆንም፣ ጥያቄው ስለ ሰው ማንነት ስለሆነ “ማን” በአማርኛ ተፈጥሯዊና ግልጽ ነው፤ ὑπονοεῖτε ያለውን ግምት “ትገምታላችሁ” ይጠብቃል።
- source_word: οὐκ εἰμὶ ἐγώ
  choice: እኔ እርሱ አይደለሁም
  rationale: የግሪኩን አጭርና ያልተገለጸ ክህደት ይጠብቃል፤ “መሲሑ” የሚለውን ትርጓሜ በዋናው ጽሑፍ ውስጥ አያስገባም።
- source_word: ἀλλ’ ἰδοὺ
  choice: ነገር ግን እነሆ
  rationale: ትኩረት የሚስበውን ἰδού በዘመናዊና ክቡር የአማርኛ አነጋገር ያቀርባል።
- source_word: ἔρχεται μετ’ ἐμὲ
  choice: ከእኔ በኋላ አንድ ሰው ይመጣል
  rationale: በግሪኩ የታሰበውን ርዕሰ ጉዳይ በአማርኛ ግልጽ ያደርጋል፣ የአሁን ጊዜውንም ሕያውና ቅርብ ስሜት ይጠብቃል።
- source_word: οὗ ... τὸ ὑπόδημα τῶν ποδῶν λῦσαι
  choice: የእግሮቹን ጫማዎች ለመፍታት
  rationale: ὑπόδημα በግሪኩ ነጠላ ቢሆንም በጥቅል ወይም በአጠቃላይ ሊሠራ ይችላል፤ ብዙ ቁጥር በአማርኛ ተፈጥሯዊ ነው። በግሪኩ የሌለው “ማሰሪያ” በዋናው ጽሑፍ አልተጨመረም።
- source_word: ἄξιος
  choice: የሚገባኝ አይደለሁም
  rationale: የብቁነትንና የተገቢነትን ሐሳብ በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: በοὐκ εἰμὶ ἐγώ ዮሐንስ የካደው ማንነት
  choice: በዋናው ጽሑፍ “እኔ እርሱ አይደለሁም” በማለት የግሪኩ ጽሑፍ የተወውን ስም አለመሙላት
  alternative: “እኔ መሲሑ አይደለሁም” ወይም “እኔ ያ የሚጠበቀው አይደለሁም”
  rationale: ዐውደ ንባቡ መሲሑን አጥብቆ ቢያመለክትም፣ ግሪኩ ስሙን በግልጽ አይጠቅስም። ስለዚህ የጽሑፉ አሻሚነት በዋናው ንባብ ተጠብቆ፣ ሊሆን የሚችለው ማጣቀሻ በማስታወሻ ተገልጧል።
