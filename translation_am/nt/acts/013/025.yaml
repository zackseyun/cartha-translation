  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “እነሆ” መጽሐፍ ቅዱሳዊ ክብርን ሳያስቀር የἰδούን የትኩረት ጥሪ ይጠብቃል። የማስታወሻ ምልክቶቹ ከሚያብራሩት ሐረግ ቀጥሎ ተቀምጠዋል።
