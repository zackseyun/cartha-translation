  yaml_path: translation/nt/acts/013/013.yaml
  text: After setting sail from Paphos[a], those with Paul came to Perga in Pamphylia; but John, departing from them[b], returned to Jerusalem.
translation:
  language: am
  text: 'ከጳፎስ በመርከብ ተነሥተው[a]፣ ከጳውሎስ ጋር የነበሩት[b] በጵንፍልያ ወደምትገኝ ወደ ጴርጌ መጡ፤ ዮሐንስ ግን ከእነርሱ ተለይቶ ወደ ኢየሩሳሌም ተመለሰ።


    [a] ወይም፣ “ወደ ባሕር ወጥተው።” የግሪኩ ግስ በባሕር ጉዞ አውድ “በመርከብ መነሣት” ወይም “ወደ ባሕር መውጣት” ማለት ሊሆን ይችላል።


    [b] ወይም፣ “ጳውሎስና ባልደረቦቹ።” ቃል በቃል፣ “በጳውሎስ ዙሪያ የነበሩት።”'
  philosophy: optimal-equivalence
