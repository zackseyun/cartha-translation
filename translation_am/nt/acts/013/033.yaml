source:
  edition: SBLGNT
  text: ὅτι ταύτην ὁ θεὸς ἐκπεπλήρωκεν τοῖς τέκνοις ⸀ἡμῶν ἀναστήσας Ἰησοῦν, ὡς καὶ ἐν τῷ ⸂ψαλμῷ γέγραπται τῷ δευτέρῳ⸃· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/033.yaml
  text: 'that God has fulfilled this for our children by raising up Jesus[a], as it is also written in the second Psalm: ‘You are my Son[b]; today I have begotten you.’'
translation:
  language: am
  text: 'እግዚአብሔር ይህን ለልጆቻችን[a] ኢየሱስን በማስነሣት[b] ፈጽሞታል፤ በሁለተኛው መዝሙርም እንደተጻፈው፣


    “አንተ ልጄ ነህ፤

    ዛሬ እኔ ወልጄሃለሁ።”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለእኛ፣ ለእነርሱ ልጆች ለሆንን።” አንዳንድ የእጅ ጽሑፎች “ለልጆቻችን” ሲሉ፣ ሌሎች ደግሞ “ለእኛ፣ ለእነርሱ ልጆች ለሆንን” የሚለውን ይደግፋሉ።
    reason: textual_variant
  - marker: b
    text: ወይም፣ “ኢየሱስን ከሙታን በማስነሣት።” የግሪኩ ሐረግ “ኢየሱስን በማስነሣት”፣ ማለትም ወደ ፊት በማምጣት ወይም በመሾም የሚል ፍቺም ሊኖረው ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπεπλήρωκεν
  choice: ፈጽሞታል
  rationale: የግሪኩን ፍጹም ጊዜ፣ ማለትም የተፈጸመና አሁንም ውጤቱ የሚኖር ተግባርን፣ ይገልጣል፤ የተስፋ ፍጻሜንም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ταύτην
  choice: ይህን
  rationale: በቀደመው አውድ ወደተጠቀሰው ተስፋ የሚያመለክተውን ተውላጠ ስም ያለ ትርጓሜያዊ ጭማሪ ይጠብቃል።
- source_word: τοῖς τέκνοις ἡμῶν
  choice: ለልጆቻችን
  rationale: የዳቲቭን አገባብና በSBLGNT ዋና ጽሑፍ ያለውን ἡμῶν በቀጥታ ይተረጉማል፤ የጽሑፍ ልዩነቱ በማስታወሻ ተጠብቋል።
- source_word: ἀναστήσας Ἰησοῦν
  choice: ኢየሱስን በማስነሣት
  rationale: የአኦሪስት አሳታፊውን እንደ ግስ ተውሳክ ይተረጉማል፤ ሐረጉ ከሙታን ማስነሣትን ወይም አንድን ሰው ማስነሣትና ወደ ፊት ማምጣትን ሊያመለክት የሚችለውን ውጥረት ይጠብቃል።
- source_word: γέγραπται
  choice: እንደተጻፈው
  rationale: ቅዱስ ጽሑፍን የሚያስገባውን የተለመደ ቀመር በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ψαλμῷ ... τῷ δευτέρῳ
  choice: በሁለተኛው መዝሙር
  rationale: የግሪኩን ተራ ቁጥር በቀጥታ ይጠብቃል፣ በአማርኛም ተፈጥሯዊ ነው።
- source_word: Υἱός μου εἶ σύ
  choice: አንተ ልጄ ነህ
  rationale: የቀጥታ ንግግሩንና የልጅነት መግለጫውን ግልጽና ክቡር በሆነ ዘመናዊ አማርኛ ያቀርባል።
- source_word: σήμερον γεγέννηκά σε
  choice: ዛሬ እኔ ወልጄሃለሁ
