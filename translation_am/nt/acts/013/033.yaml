  rationale: ትርጉሙ በኋላ የተነሡ የሥነ መለኮት ክርክሮችን በዋናው ጽሑፍ ውስጥ አይወስንም፤ የጥቅሱን ቃልና ውጥረት እንዳለ ይተዋል።
