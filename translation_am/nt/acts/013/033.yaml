- issue: “ዛሬ ወልጄሃለሁ” የሚለው ክርስቶሎጂያዊ ኃይል
  choice: የመዝሙር 2፥7 ጥቅስ ያለ ትርጓሜያዊ ማስፋፊያ በቀጥታ ተጠብቋል።
