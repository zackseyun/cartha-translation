lexical_decisions:
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: የትኩረት ጥሪውንና የነገሩን ድንገተኛነት በክቡርና በተለመደ መጽሐፍ ቅዱሳዊ አገላለጽ ያቆያል።
- source_word: χεὶρ κυρίου
  choice: የጌታ እጅ
  rationale: የጌታን ንቁ ኃይል፣ በዚህም አውድ ፍርዱን የሚያመለክተውን የመጽሐፍ ቅዱስ ዘይቤ ሳይተረጉም በቀጥታ ያቆያል።
- source_word: ἔσῃ τυφλὸς μὴ βλέπων τὸν ἥλιον
  choice: ፀሐይን የማታይ ዕውር ትሆናለህ
  rationale: የወደፊት ጊዜውንና ተካፋይ ግሱን በተፈጥሯዊ አማርኛ ያስተላልፋል፤ «ፀሐይ» የሚለውንም ምስል አያጠቃልልም።
- source_word: ἄχρι καιροῦ
  choice: ለተወሰነ ጊዜ
  rationale: የዕውርነቱን ጊዜያዊነትና ያልተገለጸ ቆይታ በተፈጥሯዊ አማርኛ ይገልጣል፤ ይበልጥ ቃል በቃል የሆነው አማራጭ በማስታወሻ ቀርቧል።
- source_word: παραχρῆμα
  choice: ወዲያውም
  rationale: የፍርዱን ፈጣን መፈጸም በግልጽና ተፈጥሯዊ አገላለጽ ያስተላልፋል።
- source_word: ἀχλὺς καὶ σκότος
  choice: ጭጋግና ጨለማ
  rationale: የዓይንን መደብዘዝ የሚያሳየውን ተጨባጭ ምስልና ጨለማውን በቀጥታ ያቆያል።
- source_word: περιάγων
  choice: እየዞረ
  rationale: ተካፋይ ግሱን በቅርብ መልኩ ይይዛል፤ በጽሑፉ ያልተገለጸውን «እየዳሰሰ» የሚል ትርጓሜ አይጨምርም።
- source_word: ἐζήτει χειραγωγούς
  choice: በእጁ የሚመሩትን ሰዎች ይፈልግ ነበር
  rationale: χειραγωγός የሚያመለክተውን በእጅ የመምራት ተጨባጭ ትርጉም ከአጠቃላይ «መሪዎች» ይልቅ ግልጽ አድርጎ ያቀርባል።
