base_translation:
  language: en
  yaml_path: translation/nt/acts/013/038.yaml
  text: Therefore let it be known to you[a], brothers, that through this one forgiveness of sins is proclaimed to you, and from all the things from which you could not be justified by the law of Moses[c][b], everyone who believes is justified.
translation:
  language: am
  text: ስለዚህ፣ ወንድሞች ሆይ፣[a] በዚህ ሰው[b] አማካይነት የኃጢአት ይቅርታ እንደሚሰበክላችሁ እወቁ፤ ከሁሉም ነገሮች፣ በሙሴ ሕግ ልትጸድቁ[c] ካልቻላችሁባቸው…[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ንግግሩ በተሰበሰቡት ሁሉ ላይ እንደሚያመለክት ከተወሰደ፣ “ወንድሞችና እህቶች ሆይ” ሊባል ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ይህም ከዚህ በፊት የተጠቀሰውን ኢየሱስን ያመለክታል።
    reason: cross_reference
  - marker: c
    text: ወይም “ጻድቃን ተብላችሁ ልትቆጠሩ።”
    reason: lexical_alternative
  - marker: d
    text: የቀረበው የግሪክ ምንጭ በዚህ ቦታ የሐሳቡን መጨረሻ ሳያካትት ይቋረጣል፤ የዓረፍተ ነገሩ ፍጻሜ በሐዋርያት ሥራ 13፥39 ይገኛል።
    reason: source_text_boundary
lexical_decisions:
- source_word: γνωστὸν οὖν ἔστω ὑμῖν
  choice: ስለዚህ … እወቁ
  rationale: The Greek impersonal imperative is rendered as a direct, natural Amharic imperative while retaining οὖν with ስለዚህ and the declarative force of making something known.
- source_word: ἄνδρες ἀδελφοί
  choice: ወንድሞች ሆይ
  rationale: This is the natural dignified Amharic vocative for the familial address. The explicitly masculine form is retained, with the possible inclusive audience sense noted.
- source_word: διὰ τούτου
  choice: በዚህ ሰው አማካይነት
  rationale: The masculine demonstrative refers personally to Jesus just mentioned. Adding ሰው makes that personal reference natural in Amharic without replacing it simply with a pronoun.
- source_word: ἄφεσις ἁμαρτιῶν
  choice: የኃጢአት ይቅርታ
  rationale: This is the established, clear modern Amharic expression for forgiveness of sins.
- source_word: καταγγέλλεται
  choice: እንደሚሰበክላችሁ
  rationale: ሰበከ captures public proclamation in this apostolic preaching context; the benefactive suffix reflects ὑμῖν.
- source_word: ἀπὸ πάντων ὧν
  choice: ካልቻላችሁባቸው ነገሮች ሁሉ
  rationale: The relative and separative relationship is expressed idiomatically through the Amharic locative-relative construction, pending the continuation of the sentence.
- source_word: οὐκ ἠδυνήθητε
  choice: ካልቻላችሁ
  rationale: A direct and natural rendering of inability addressed to the plural audience.
- source_word: ἐν νόμῳ Μωϋσέως
  choice: በሙሴ ሕግ
  rationale: The Amharic instrumental በ preserves the likely means/sphere sense of ἐν with δικαιωθῆναι.
- source_word: δικαιωθῆναι
  choice: ልትጸድቁ
  rationale: ጸደቀ is the established Amharic biblical term and preserves the theological and forensic breadth of δικαιόω rather than narrowing it to moral improvement.
theological_decisions:
- issue: Sense of δικαιωθῆναι in relation to the law of Moses
  choice: ልትጸድቁ
  alternative: ጻድቃን ሆናችሁ ልትታወጁ
  rationale: The traditional but still understandable Amharic verb preserves the compact theological force and ambiguity of the Greek; the more explicitly forensic alternative is supplied in a footnote rather than inserted into the text.
- issue: Gender and audience scope of ἄνδρες ἀδελφοί
  choice: ወንድሞች ሆይ
  alternative: ወንድሞችና እህቶች ሆይ
  rationale: The main text retains the masculine grammatical wording of the Greek. A note records that the address may function inclusively for the gathered audience.
- issue: Extent of the supplied Greek source
  choice: End the draft with an ellipsis after the incomplete clause
  alternative: Add ‘የሚያምን ሁሉ ይጸድቃል’ from Acts 13:39
  rationale: The supplied SBLGNT excerpt stops at δικαιωθῆναι and does not contain the finite clause πάντας ὁ πιστεύων δικαιοῦται needed to complete the thought. Source-first translation therefore does not silently import that clause from the English consultation layer.
translation_notes:
  register: Modern standard Amharic in Ge'ez script, with a dignified public-reading register. The syntax is made natural in Amharic while the theological vocabulary remains compact. The ellipsis and note are deliberate because the supplied Greek excerpt crosses into the next verse but ends before completing its clause.
