  rationale: ᾐτήσαντο መጠየቅን ወይም መለመንን ያመለክታል፤ የሚከተለው የድርጊት ሐረግ ጥያቄው መደበኛ የፍርድ ጥያቄ መሆኑን ያብራራል። ጲላጦስ በመደበኛው የአማርኛ የስም አጻጻፍ ቀርቧል።
