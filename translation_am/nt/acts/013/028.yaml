  rationale: αἰτία በዚህ የፍርድ ዐውድ «ክስ፣ የሕግ ምክንያት፣ መሠረት» ሊሆን ይችላል፤ ከθανάτου ጋር ሲጣመር የሞት ፍርድን የሚያስገኝ ክስ ወይም መሠረት ማለት ነው።
- source_word: εὑρόντες
