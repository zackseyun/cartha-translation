  rationale: የጊዜውን መጠን ሙሉ በሙሉ ይጠብቃል፤ ቁጥሩን በቃላት መጻፍም ከክቡር የመጽሐፍ ቅዱስ ንባብ ጋር ይስማማል።
- source_word: καὶ μετὰ ταῦτα
