  rationale: የትረካውን ቅደም ተከተልና የκαὶን አያያዥነት በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: ἔδωκεν
  choice: ሰጣቸው
  rationale: የδίδωμιን «ሰጠ» የሚል መሠረታዊ ፍቺ ይጠብቃል። በአማርኛ የተቀባዩን ተውላጠ ስም ማካተት አገላለጹን የተሟላና ተፈጥሯዊ ያደርገዋል፤ ተቀባዮቹም በአውዱ እስራኤላውያን ናቸው።
- source_word: κριτὰς
  choice: መሳፍንትን
  rationale: በእስራኤል ታሪክ ከንጉሣዊው ዘመን በፊት የነበሩትን መሪዎች ለመጥቀስ በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የተለመደውን ታሪካዊ ቃል ይጠቀማል።
- source_word: ἕως
  choice: እስከ … ድረስ
  rationale: የመሳፍንቱን ዘመን መጨረሻ በግልጽና ተፈጥሯዊ የአማርኛ አገባብ ያመለክታል።
- source_word: Σαμουὴλ τοῦ προφήτου
  choice: ነቢዩ ሳሙኤል
  rationale: የግሪኩን የማንነት መግለጫ በተፈጥሯዊ የአማርኛ ቅደም ተከተል ይጠብቃል።
