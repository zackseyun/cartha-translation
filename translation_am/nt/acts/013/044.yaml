lexical_decisions:
- source_word: Τῷ δὲ ἐρχομένῳ σαββάτῳ
  choice: በሚቀጥለውም ሰንበት
  rationale: የጊዜ አመልካቹን የዳቲቭ አገባብና የἐρχομένῳን ‘የሚመጣው/የሚቀጥለው’ ትርጉም በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል። δὲ በ‘ም’ ተንጸባርቋል።
- source_word: σχεδὸν
  choice: ማለት ይቻላል
  rationale: ‘ከሞላ ጎደል/ሊባል የሚችል’ የሚለውን ግምታዊ ኃይል በ‘ከተማው ሁሉ’ አገባብ ውስጥ ተፈጥሯዊ ሆኖ ያቀርባል።
- source_word: πᾶσα ἡ πόλις
  choice: ከተማው ሁሉ
  rationale: ከተማውን እንደ ነዋሪዎቹ የሚጠቅስ የተለመደ ዘይቤ ሲሆን፣ σχεδόν ስላለ እያንዳንዱ ግለሰብ በፍጹም ተገኘ የሚል ትርጉም አያስገድድም።
- source_word: συνήχθη
  choice: ተሰበሰበ
  rationale: የግሪኩን አንድ ላይ የመሰብሰብ ሐሳብ በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἀκοῦσαι
  choice: ለመስማት
  rationale: የኢንፊኒቲቩን የዓላማ ተግባር በ‘ለ-’ ግንባታ በቀጥታ ያስተላልፋል።
- source_word: τὸν λόγον
  choice: ቃል
  rationale: λόγος እዚህ የታወጀውን መልእክት ያመለክታል፤ ‘ቃል’ በሐዋርያት ሥራ ተደጋግሞ የሚገኘውን ቃላዊና ሥነ መለኮታዊ ትስስር ይጠብቃል።
- source_word: τοῦ κυρίου
  choice: የጌታ
  rationale: κύριοςን በተለመደው ‘ጌታ’ ይተረጉማል፤ የግሪኩን ጄኒቲቭ በ‘የ-’ ማቅረብ ቃሉ ከጌታ የሆነ፣ ከጌታ የመጣ ወይም ስለ ጌታ የሚናገር መሆኑን የሚመለከተውን ክፍትነት አይዘጋም።
theological_decisions:
- issue: የκύριος አተረጓጎም
  choice: ጌታ
  alternative: ባለቤት / ገዢ
  rationale: ‘ጌታ’ ለκύριος የተለመደና ክብር ያለው አቻ ሲሆን፣ በሐዋርያት ሥራ ያለውን የክርስቲያናዊ አዋጅ ቋንቋ ይጠብቃል፤ በዚህ ጥቅስ ከተጻፈው በላይ ማንነቱን አይገድብም።
- issue: የ‘የጌታ ቃል’ ጄኒቲቭ ትርጉም
  choice: የጌታ ቃል የሚለውን ቅርጽ መጠበቅ
  alternative: የጌታ መልእክት / ስለ ጌታ የሚናገረው መልእክት
  rationale: የግሪኩ አገባብ የባለቤትነት፣ የምንጭ ወይም የይዘት ግንኙነትን ሊያካትት ይችላል። ‘የጌታ ቃል’ ይህን እውነተኛ አሻሚነት ሳይፈታ ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። ‘ከተማው ሁሉ ማለት ይቻላል’ የግሪኩን ሰፊ ነገር ግን ፍጹም ያልሆነ አገላለጽ ይጠብቃል።
