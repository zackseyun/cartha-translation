    text: ወይም፣ “በሚመጣው ሰንበት” ወይም “በቀጣዩ ሰንበት።”
    reason: lexical_alternative
  - marker: b
    text: “የጌታ ቃል” የሚለው “የጌታ መልእክት” ወይም፣ እንደ ዐውዱ፣ “ስለ ጌታ የሚናገረው መልእክት” ተብሎም ሊገባ ይችላል።
