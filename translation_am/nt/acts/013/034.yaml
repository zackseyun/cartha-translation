  rationale: በትንሣኤ አውድ ውስጥ ያለውን መለኮታዊ ድርጊት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: μηκέτι μέλλοντα ὑποστρέφειν
  choice: ከእንግዲህ ወዲህ ... እንዳይመለስ
  rationale: የወደፊት አለመመለስን በተፈጥሯዊ አማርኛ ይገልጣል፤ የግሪኩን μηκέτι የሚያሳየውን ዘላቂ እምቢታ ይጠብቃል።
- source_word: διαφθοράν
  choice: መበስበስ
  rationale: በዚህ አውድ ሥጋዊ መበስበስን በግልጽ ያሳያል፤ ‘መበላሸት’ ሊኖረው የሚችለውን ሰፊ ወይም ሥነ ምግባራዊ ፍቺ ያስወግዳል።
- source_word: οὕτως εἴρηκεν
  choice: እንዲህ ብሎአል
  rationale: የተነገረው የመጽሐፍ ቃል ቀጣይ ሥልጣን እንዳለው የፍጹም ጊዜውን ኃይል ይጠብቃል።
- source_word: τὰ ὅσια Δαυὶδ τὰ πιστά
  choice: ለዳዊት የተሰጡትን ቅዱስና የታመኑ በረከቶች
  rationale: ከኢሳይያስ 55፥3 ጋር ያለውን የቃል ኪዳን ማጣቀሻ በግልጽ ያቀርባል። ‘ለዳዊት የተሰጡት’ የግንኙነቱን አሻሚነት በአውዱ መሠረት ያብራራል፤ አማራጭ ቀጥተኛ አተረጓጎም በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: የኢሳይያስ 55፥3 ጥቅስ τὰ ὅσια Δαυὶδ τὰ πιστά አተረጓጎም
  choice: ለዳዊት የተሰጡትን ቅዱስና የታመኑ በረከቶች
  alternative: የዳዊትን ቅዱስና የታመኑ ምሕረቶች
  rationale: ሐረጉ አጭርና አሻሚ ቢሆንም በአውዱ ከዳዊት ጋር የተያያዙትን ታማኝ የቃል ኪዳን ጥቅሞች ያመለክታል። ዋናው ትርጉም ይህን ለዘመናዊ አንባቢ ግልጽ ያደርጋል፤ ባህላዊው አተረጓጎም ግን በማስታወሻ ተቀምጧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ። የትንሣኤው አካላዊ አውድ በ‘መበስበስ’ ተጠብቋል፤ የዳዊት ሐረግ አሻሚነት በአማራጭ ማስታወሻ ተመዝግቧል።
