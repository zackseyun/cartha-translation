base_translation:
  language: en
  yaml_path: translation/nt/acts/013/034.yaml
  text: 'And that he raised him from the dead, no longer about to return to decay, he has spoken in this way: ‘I will give you the holy and sure blessings of David.’'
translation:
  language: am
  text: እርሱን ከሙታን አስነሥቶ ከእንግዲህ ወዲህ ወደ መበስበስ እንደማይመለስ በተመለከተ፣ እንዲህ ብሎአል፦ “ለእናንተ የዳዊትን ቅዱሳንና የታመኑ በረከቶች እሰጣለሁ።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ በተለምዶ፣ “የዳዊትን የታመኑ ምሕረቶች።” የግሪኩ ሐረግ ኢሳይያስ 55፥3ን ያስተጋባል፤ ከዳዊት ጋር የተያያዙትን ቅዱሳንና ታማኝ የቃል ኪዳን ተስፋዎች ያመለክታል።
    reason: alternative_reading
lexical_decisions:
