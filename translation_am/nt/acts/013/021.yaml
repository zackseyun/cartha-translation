  yaml_path: translation/nt/acts/013/021.yaml
  text: And from there they asked for a king[a], and God gave them Saul son of Kish, a man from the tribe of Benjamin[b], for forty years.
translation:
  language: am
  text: 'ከዚያም[a] ንጉሥ ጠየቁ፤ እግዚአብሔርም የቂስን ልጅ፣ ከብንያም ነገድ የሆነውን ሰው ሳውልን፣ ለአርባ ዓመት[b] ሰጣቸው።


    [a] ወይም፣ “ከዚያ በኋላ።” የመክፈቻው ቃል በታሪካዊው ቅደም ተከተል ውስጥ ወደ ቀጣዩ ክስተት የሚያሸጋግር ቃል ሊሆን ይችላል።


    [b] “ለአርባ ዓመት” የሚለው ከብሉይ ኪዳን የዘመን አቆጣጠር መረጃ ጋር ሲነጻጸር የጊዜ ቅደም ተከተል ጥያቄ ሊያስነሣ እንደሚችል አንዳንዶች ያስተውላሉ፤ ትርጉሙ የሉቃስን አነጋገር እንዳለ ይጠብቃል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከዚያ በኋላ።” የመክፈቻው ቃል በታሪካዊው ቅደም ተከተል ውስጥ ወደ ቀጣዩ ክስተት የሚያሸጋግር ቃል ሊሆን ይችላል።
    reason: lexical_alternative
