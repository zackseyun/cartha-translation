  text: 'የሕጉና የነቢያቱ ንባብ ከተደረገ በኋላ፣ የምኩራቡ አለቆች እንዲህ ብለው ወደ እነርሱ መልእክት ላኩ፤ “ወንድሞች ሆይ፣[a] ለሕዝቡ የማበረታቻ ቃል[b] በመካከላችሁ ካለ፣ ተናገሩ።”


    [a] በግሪክኛ፣ “ወንድሞች የሆናችሁ ወንዶች ሆይ።” ይህ አክብሮትንና የወንድማማችነት ቅርበትን የሚገልጽ አጠራር ነው።


    [b] ወይም፣ “የምክር ቃል።” የግሪክኛው ሐረግ ማበረታታትንም ሆነ መምከርን ሊያመለክት ይችላል።'
  philosophy: optimal-equivalence
  footnotes:
