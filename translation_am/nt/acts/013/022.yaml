- source_word: Εὗρον
  choice: አግኝቻለሁ
  rationale: የተፈጸመውንና አሁንም ተገቢነት ያለውን ድርጊት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τὸν τοῦ Ἰεσσαί
  choice: የእሴይን ልጅ
