base_translation:
  language: en
  yaml_path: translation/nt/acts/013/022.yaml
  text: And after removing him[a], he raised up David for them as king, to whom he also bore witness and said, ‘I have found David the son of Jesse, a man according to my heart[b], who will do all my will.’
translation:
  language: am
  text: እርሱንም ካስወገደ በኋላ፣ ዳዊትን ለእነርሱ ንጉሥ አድርጎ አስነሣ። ስለ እርሱም መስክሮ እንዲህ አለ፤ “የእሴይን ልጅ ዳዊትን አግኝቻለሁ፤ እርሱ እንደ ልቤ የሆነ ሰው ነው[a]፤ ፈቃዶቼንም ሁሉ ይፈጽማል[b]።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ ቃል በቀጥታ “እንደ ልቤ” ይላል፤ ሐረጉ “ከልቤ ጋር የሚስማማ” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: በግሪክ “ፈቃዶቼ” የሚለው ስም በብዙ ቁጥር ነው፤ ትርጉሙም የእግዚአብሔርን ልዩ ልዩ ፈቃዶች ወይም ዓላማዎች ያካትታል።
    reason: lexical_alternative
lexical_decisions:
