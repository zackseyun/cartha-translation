  text: ἀκούοντα δὲ τὰ ἔθνη ⸀ἔχαιρον καὶ ἐδόξαζον τὸν λόγον τοῦ ⸀κυρίου, καὶ ἐπίστευσαν ὅσοι ἦσαν τεταγμένοι εἰς ζωὴν αἰώνιον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/048.yaml
  text: When the Gentiles heard this[a], they began rejoicing and glorifying the word of the Lord, and all who had been appointed for eternal life believed.
translation:
  language: am
  text: አሕዛብም ይህን ሲሰሙ፣ ደስ አላቸው፤ የጌታንም ቃል አከበሩ፤ ለዘላለም ሕይወት የተመደቡት[a] ሁሉ አመኑ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ለዘላለም ሕይወት ዝንባሌ የነበራቸው።» የግሪኩ ተሳቢ ቅጽ በተለያየ መንገድ ሊረዳ ይችላል፤ እዚህ ግን «የተመደቡት» የሚለው ተገብሮ ትርጉም ይበልጥ ቀጥተኛ ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούοντα
  choice: ይህን ሲሰሙ
  rationale: የአሁን ጊዜው ተሳቢ ቅጽ ዋናዎቹ ድርጊቶች የተፈጸሙበትን ሁኔታ ያሳያል፤ «ይህን» ከቀደመው ዐውድ ተሟልቶ የተሰማውን መልእክት በተፈጥሯዊ አማርኛ ግልጽ ያደርጋል።
- source_word: τὰ ἔθνη
  choice: አሕዛብ
  rationale: በሐዋርያት ሥራ ዐውድ ቃሉ ከአይሁድ የተለዩትን አይሁድ ያልሆኑ ሕዝቦች ያመለክታል፤ «አሕዛብ» ይህን ትርጉም በተለመደ መጽሐፍ ቅዱሳዊ አማርኛ ያስተላልፋል።
- source_word: ἔχαιρον καὶ ἐδόξαζον
  choice: ደስ ይላቸውና … ያከብሩ ጀመር
  rationale: ሁለቱ ያልተፈጸሙ ያለፈ ጊዜ ግሶች በዐውዱ የተጀመረና የቀጠለ ምላሽን ያሳያሉ፤ አንድ ጊዜ የገባው «ጀመር» ሁለቱንም የተቀናጁ ድርጊቶች በተፈጥሯዊ አማርኛ ይገዛል።
- source_word: τὸν λόγον τοῦ κυρίου
  choice: የጌታን ቃል
  rationale: «ቃል» የታወጀውን መልእክት ያመለክታል፤ በተመሳሳይም ጊዜ መጽሐፍ ቅዱሳዊ አገላለጹንና ሥነ መለኮታዊ ድምፁን ይጠብቃል።
- source_word: ἐπίστευσαν
  choice: አመኑ
  rationale: የግሪኩን ቀላል ያለፈ ጊዜ ያለ ትርጓሜያዊ ማስፋፊያ በቀጥታና በተፈጥሯዊነት ያስተላልፋል።
- source_word: ὅσοι
  choice: …ትም ሁሉ
  rationale: የቃሉን መጠናዊ ኃይል፣ «እንደ ብዛታቸው ያሉት ሁሉ» የሚለውን፣ በአማርኛ ተፈጥሯዊ በሆነ አኳኋን ይገልጻል።
- source_word: τεταγμένοι
  choice: የተመደቡት
  rationale: የτάσσω ፍጹም ተገብሮ ተሳቢ ቅጽ አስቀድሞ የተደረገ ምደባ ወይም ሹመት ውጤት እንዳለ በቀጥታ ያሳያል፤ «የተመደቡት» ተገብሮነቱን ሳያዳክም ይጠብቃል።
- source_word: εἰς ζωὴν αἰώνιον
  choice: ለዘላለም ሕይወት
  rationale: εἰς እዚህ መድረሻን ወይም ዓላማን ያሳያል፤ «ለ» በአማርኛ የዓላማውን ኃይል በአጭርና ተፈጥሯዊ መንገድ ያስተላልፋል።
theological_decisions:
- issue: τεταγμένοι ከመለኮታዊ ምደባና ከሰው ምላሽ ጋር ያለው ግንኙነት
  choice: ለዘላለም ሕይወት የተመደቡት
  alternative: ለዘላለም ሕይወት ዝንባሌ የነበራቸው
  rationale: የግሪኩ ተገብሮ ቅጽ በዚህ ዐውድ ዝም ብሎ የውስጥ ዝንባሌን ከማመልከት ይልቅ ምደባን ወይም መወሰንን በቀጥታ ያሳያል። ትርጉሙ የድርጊቱን ፈጻሚ በስም አይጨምርም፣ ስለ አስቀድሞ መወሰንም ከጥቅሱ በላይ የሆነ ሥርዓተ እምነት አያስገባም። አማራጩ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «አሕዛብ፣ ጌታ፣ ቃል፣ ዘላለም ሕይወት» የተለመዱ መጽሐፍ ቅዱሳዊ ቃላት ሲሆኑ ከመጠን ያለፈ ጥንታዊ አገላለጽ ተወግዷል።
