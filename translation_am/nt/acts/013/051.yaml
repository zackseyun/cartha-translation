  text: οἱ δὲ ἐκτιναξάμενοι τὸν κονιορτὸν τῶν ⸀ποδῶν ἐπ’ αὐτοὺς ἦλθον εἰς Ἰκόνιον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/051.yaml
  text: But they shook off the dust from their feet against them and went to Iconium[a].
translation:
  language: am
  text: እነርሱ ግን የእግራቸውን ትቢያ በእነርሱ ላይ አራግፈው ወደ ኢቆንዮን ሄዱ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የእግር ትቢያን ማራገፍ፣ መልእክቱን ካልተቀበሉት ሰዎች መለየትንና በእነርሱ ላይ ምስክር መሆንን የሚያመለክት ምሳሌያዊ ድርጊት ነበር።
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ
  choice: እነርሱ ግን
  rationale: δέ ያለውን ቀላል ንፅፅር ወይም የትረካ ሽግግር «ግን» ያሳያል፤ ከአውዱም «እነርሱ» ጳውሎስንና በርናባስን ያመለክታል።
- source_word: ἐκτιναξάμενοι
  choice: አራግፈው
  rationale: የግሪኩ የአኦሪስት አጋዥ ግስ አንድን ነገር አራግፎ ማስወገድን ያመለክታል፤ «አራግፈው» ቅድሚያ የተፈጸመውን ድርጊት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τὸν κονιορτὸν τῶν ποδῶν
  choice: የእግራቸውን ትቢያ
  rationale: κονιορτός በመሬት ላይ ያለን ልቅ ትቢያ ያመለክታል፤ የግሪኩ የባለቤትነት አወቃቀር በአማርኛ «የእግራቸውን ትቢያ» ተብሎ ተፈጥሯዊ ሆኖ ይቀርባል።
- source_word: ἐπ’ αὐτοὺς
  choice: በእነርሱ ላይ
  rationale: ἐπί ከተሳቢ ጋር እዚህ ድርጊቱ በሰዎቹ ላይ ያነጣጠረ መሆኑን ያሳያል፤ የፍርድ ወይም የምስክርነት ትርጉሙን በዋናው ጽሑፍ ሳይጨምር «በእነርሱ ላይ» የግሪኩን አሻሚነት ይጠብቃል።
- source_word: ἦλθον εἰς Ἰκόνιον
  choice: ወደ ኢቆንዮን ሄዱ
  rationale: ሐረጉ ወደተጠቀሰው ከተማ መጓዝን ያመለክታል፤ «ወደ … ሄዱ» በዘመናዊ አማርኛ ተፈጥሯዊ የጉዞ አገላለጽ ነው።
theological_decisions:
- issue: የእግርን ትቢያ የማራገፍ ምሳሌያዊ ድርጊት
  choice: ድርጊቱ «በእነርሱ ላይ» እንደተደረገ ብቻ በዋናው ጽሑፍ ቀርቧል።
  alternative: «በእነርሱ ላይ ምስክር እንዲሆን» ወይም «የፍርድ ምልክት አድርገው» ብሎ ማስፋት።
  rationale: ድርጊቱ በመጽሐፍ ቅዱሳዊና ባህላዊ አውድ ትርጉም ቢኖረውም፣ የግሪኩ ጽሑፍ ትርጉሙን በግልጽ አይፈታውም። ስለዚህ ትርጓሜው በዋናው ጽሑፍ ሳይጫን በማስታወሻ ተብራርቷል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። «ትቢያ» መጽሐፍ ቅዱሳዊ ክብር ያለውና አሁንም የሚገባ ቃል ሲሆን፣ «አራግፈው … ሄዱ» የግሪኩን የድርጊት ቅደም ተከተል በተፈጥሯዊ አማርኛ ያስተላልፋል።
