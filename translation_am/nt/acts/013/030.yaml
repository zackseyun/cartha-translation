translation:
  language: am
  text: ነገር ግን እግዚአብሔር ከሙታን አስነሣው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: ነገር ግን
  rationale: በቀደመው ክፍል ሰዎች ኢየሱስን ከገደሉበት ድርጊት ጋር የእግዚአብሔርን ተቃራኒ ድርጊት ያነጻጽራል፤ በዘመናዊ አማርኛ ‘ነገር ግን’ ይህን ንጽጽር በተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: θεὸς
  choice: እግዚአብሔር
  rationale: ቃሉ የድርጊቱን ባለቤት የሆነውን አምላክ ያመለክታል፤ ‘እግዚአብሔር’ በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደና ግልጽ ነው።
- source_word: ἤγειρεν
  choice: አስነሣው
  rationale: ἐγείρω በትንሣኤ አውድ ‘ከሞት ማስነሣት’ ማለት ነው። የተያያዘውን የወንድ ነጠላ ተሳቢ ተውላጠ ስም በ‘-ው’ በማካተት የግሪኩን ἤγειρεν αὐτόν በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: αὐτὸν
  choice: -ው
  rationale: ተውላጠ ስሙ በቅርቡ አውድ ኢየሱስን ያመለክታል፤ በአማርኛ በግሱ ላይ የተያያዘው ‘-ው’ ይህን በተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: ἐκ νεκρῶν
  choice: ከሙታን
  rationale: ይህ ሐረግ በቀጥታ ‘ከሙታን መካከል’ የሚለውን ሐሳብ ይይዛል። ‘ከሙታን’ አጭር፣ የተለመደና የትንሣኤውን ትርጉም በግልጽ የሚያስተላልፍ ነው።
theological_decisions:
- issue: የትንሣኤው አገላለጽ
  choice: እግዚአብሔር ከሙታን አስነሣው
  alternative: እግዚአብሔር ከሞት አስነሣው
  rationale: ግሪኩ ἐκ νεκρῶν በቃል ደረጃ ‘ከሙታን’ ይላል። ይህ አተረጓጎም እግዚአብሔር ኢየሱስን እንዳስነሣው በግልጽ ይገልጣል፤ ከምንጩም በላይ የሆነ የትርጓሜ ማብራሪያ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘አስነሣው’ የትንሣኤውን ድርጊት በተፈጥሯዊ አገላለጽ ያቀርባል፤ የንጽጽር ኃይሉን ለመጠበቅ ‘ነገር ግን’ ተመርጧል።
