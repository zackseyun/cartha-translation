translation:
  language: am
  text: የሚያምን ሁሉ በእርሱ ይጸድቃል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የሚያምን ሁሉ በዚህ ሰው ይጸድቃል።» የግሪኩ ἐν τούτῳ የሚለው አገላለጽ ቃል በቃል «በዚህ ሰው» ወይም «በዚህ ሰው አማካይነት» ሊተረጎም ይችላል፤ በቅርብ ዐውዱ ኢየሱስን ያመለክታል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: በእርሱም
  rationale: በቅርብ ዐውዱ የሚጠቀሰው ኢየሱስ ስለሆነ፣ ግላዊ አመልካቹን በተፈጥሯዊ አማርኛ «በእርሱ» ብሎ መተርጎም የንግግሩን ፍሰት ይጠብቃል። «ም» ከቀደመው ሐሳብ ጋር ያለውን ትስስር ያሳያል።
- source_word: πᾶς ὁ πιστεύων
  choice: የሚያምን ሁሉ
  rationale: ጽሑፉ በአጠቃላይ እያንዳንዱን አማኝ ያመለክታል፤ «የሚያምን ሁሉ» ይህን አጠቃላይና ቀጣይ ባሕርይ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: δικαιοῦται
  choice: ይጸድቃል
  rationale: «ይጸድቃል» የግሪኩን ሕጋዊ/ፍርዳዊ አንድምታ በአጭርና በተለመደ መጽሐፍ ቅዱሳዊ አማርኛ ይጠብቃል፤ ቃሉን ወደ ሥነ ምግባራዊ ለውጥ ብቻ አያጠብበውም።
theological_decisions:
- issue: የἐν τούτῳ አመልካች
  choice: ኢየሱስን በግል የሚያመለክት «በእርሱ»
  alternative: «በዚህ ሰው»
  rationale: ቀዳሚው ዐውድ ይቅርታ በኢየሱስ በኩል እንደሚታወጅ ይናገራል፤ ስለዚህ ግላዊ አመልካቹ የንግግሩን ትኩረት በትክክል ይቀጥላል። ሆኖም የግሪኩ አገላለጽ ቃል በቃል «በዚህ ሰው» ሊባል ስለሚችል ይህ በማስታወሻ ተጠብቋል።
- issue: የδικαιοῦται ሥነ መለኮታዊ አንድምታ
  choice: «ይጸድቃል» የሚለውን ፍርዳዊ አገላለጽ መጠበቅ
  alternative: «ጻድቅ ተብሎ ይታወጃል» ወይም «ትክክል ይሆናል»
  rationale: በሙሴ ሕግና በመጽደቅ መካከል ባለው የቅርብ ዐውድ ንጽጽር ቃሉ ፍርዳዊ ኃይል አለው። «ይጸድቃል» ይህን ይጠብቃል፣ መጽደቅንም ከሥነ ምግባራዊ ለውጥ ጋር ብቻ አያዋህደውም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። «ይጸድቃል» በመጽሐፍ ቅዱሳዊ አጠቃቀም የታወቀ ቢሆንም ለዘመናዊ አንባቢም አጭርና ተረድቶ የሚነበብ ነው።
