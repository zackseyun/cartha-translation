  text: εἶπεν· Ὦ πλήρης παντὸς δόλου καὶ πάσης ῥᾳδιουργίας, υἱὲ διαβόλου, ἐχθρὲ πάσης δικαιοσύνης, οὐ παύσῃ διαστρέφων τὰς ⸀ὁδοὺς κυρίου τὰς εὐθείας;
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/010.yaml
  text: And he said[a], “You who are full of every kind of deceit and every kind of villainy, son of the devil, enemy of all righteousness, will you not stop twisting the straight ways of the Lord?”
translation:
  language: am
  text: እንዲህም አለው፦ “አንተ በማታለልና በተንኮል ሁሉ የተሞላህ፣ የዲያብሎስ ልጅ፣ የጽድቅ[a] ሁሉ ጠላት ሆይ፣ የጌታን ቀጥ ያሉ መንገዶች ማጣመምህን አታቆምምን?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የፍትሕ ሁሉ ጠላት።” የግሪኩ ቃል እንደ አውዱ “ጽድቅ” ወይም “ፍትሕ” ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήρης παντὸς δόλου
  choice: በማንኛውም ዓይነት ማታለል የተሞላህ
  rationale: πλήρης ከዘርፍ ተሳቢ ጋር መሞላትን ወይም በአንድ ባሕርይ መታወቅን ያመለክታል፤ παντός ያለውን አጠቃላይ ኃይል ‘ማንኛውም ዓይነት’ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: πάσης ῥᾳδιουργίας
  choice: ማንኛውም ዓይነት ክፋት
  rationale: ῥᾳδιουργία ሕሊና ቢስ ተንኮለኛ ድርጊትን ያመለክታል። ‘ክፋት’ በዘመናዊ አማርኛ የከባድ የሥነ ምግባር ውግዘቱን በተፈጥሯዊነት ያቀርባል።
- source_word: υἱὲ διαβόλου
  choice: የዲያብሎስ ልጅ
  rationale: υἱέ በቀጥታ ‘ልጅ/ወንድ ልጅ’ ማለት ሲሆን፣ የመመሳሰልን ወይም የወገንነትን መጽሐፍ ቅዱሳዊ ፈሊጥ ይጠብቃል።
- source_word: ἐχθρὲ πάσης δικαιοσύνης
  choice: የጽድቅ ሁሉ ጠላት
  rationale: δικαιοσύνη እዚህ ከሥነ ምግባር ቅንነትና ትክክለኛነት ጋር በሚዛመደው ሰፊ ትርጉሙ ‘ጽድቅ’ ተብሏል፤ የ‘ፍትሕ’ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: οὐ παύσῃ
  choice: አታቆምምን?
  rationale: የወደፊት ጊዜ መካከለኛ አመልካች ቅርጹ በዚህ ተግሣጽ ውስጥ የሚሠራውን አፋጣኝ አጠያያቂ ኃይል ይጠብቃል።
- source_word: διαστρέφων
  choice: ማጣመምህን
  rationale: διαστρέφω ቀጥ ያለውን ማጣመም፣ ማዛባት ወይም ከትክክለኛ አቅጣጫ ማስወጣትን ያመለክታል፤ ‘ማጣመም’ ከመንገድ ምስሉ ጋር ይስማማል።
- source_word: τὰς ὁδοὺς κυρίου τὰς εὐθείας
  choice: የጌታን ቀጥተኛ መንገዶች
  rationale: ὁδοί ቃል በቃልም በዘይቤም ‘መንገዶች’ ይሆናል፤ εὐθείας የእነዚህን መንገዶች ቀጥተኛነትና ትክክለኛነት ያጎላል። κύριος ‘ጌታ’ ተብሎ ተተርጉሟል።
- source_word: Ὦ
  choice: አንተ … ሆይ
  rationale: Ὦ የአጽንዖት ቀጥተኛ አድራሻ ምልክት ነው፤ ‘አንተ … ሆይ’ የውግዘቱን ጥንካሬ በተፈጥሯዊና ክብር ባለው አማርኛ ያስተላልፋል።
theological_decisions:
- issue: የδικαιοσύνη አተረጓጎም
  choice: ጽድቅ
  alternative: ፍትሕ
  rationale: በዚህ አውድ ለሥነ ምግባራዊ ቅንነትና ትክክለኛነት ያለው ሰፊ ትርጉም ቀዳሚ ስለሆነ ‘ጽድቅ’ በዋናው ጽሑፍ ተመርጧል፤ ‘ፍትሕ’ የሚለው እውነተኛ የቃሉ አማራጭ በግርጌ ማስታወሻ ተጠብቋል።
