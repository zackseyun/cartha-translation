base_translation:
  language: en
  yaml_path: translation/nt/acts/013/024.yaml
  text: before his coming[b][a], John had proclaimed to all the people of Israel a baptism of repentance.
translation:
  language: am
  text: እርሱ ከመምጣቱ[a] በፊት፣ ዮሐንስ ለእስራኤል ሕዝብ ሁሉ የንስሐ ጥምቀትን[b] አውጆ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እርሱ ከመድረሱ በፊት።” ግሪኩ ቃል በቃል “ከእርሱ መግባት ፊት” የሚል ፈሊጥ ነው፤ ትርጉሙም አንድ ሰው ከመምጣቱ ቀድሞ ማለት ነው።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ለንስሐ የሚሆን ጥምቀትን።”
    reason: lexical_alternative
lexical_decisions:
- source_word: προκηρύξαντος
  choice: አውጆ ነበር
  rationale: የአዋጅንና የሕዝብ ፊት ስብከትን ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ድርጊቱ ከመምጣቱ በፊት መሆኑንም ዐውዱ ያሳያል።
- source_word: πρὸ προσώπου τῆς εἰσόδου αὐτοῦ
  choice: እርሱ ከመምጣቱ በፊት
  rationale: ቃል በቃል ‘ከመግባቱ ፊት በፊት’ ከማለት ይልቅ፣ የግሪኩን ፈሊጣዊ ትርጉም በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: εἰσόδου
  choice: መምጣት
  rationale: በዚህ ዐውድ ቃሉ የሚያመለክተው የኢየሱስን መድረስ ወይም መገለጥ ነው፤ ‘መምጣት’ ተፈጥሯዊና ዐውዳዊ ምርጫ ነው።
- source_word: βάπτισμα μετανοίας
  choice: የንስሓ ጥምቀት
  rationale: የግሪኩን የዝምድና አገባብ ሳይወስን ይጠብቃል፤ በአማርኛ የተለመደና ግልጽ አገላለጽም ነው።
- source_word: παντὶ τῷ λαῷ Ἰσραήλ
  choice: ለእስራኤል ሕዝብ ሁሉ
  rationale: παντί የሚያሳየውን ‘ሁሉ’ እና λαός የሚያሳየውን ‘ሕዝብ’ ሁለቱንም ይጠብቃል።
- source_word: Ἰωάννου
  choice: ዮሐንስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደው የስሙ ቅርጽ ነው።
theological_decisions:
- issue: ‘እርሱ’ የሚለው ተውላጠ ስም ማንን እንደሚያመለክት
  choice: ተውላጠ ስሙ በቀደመው ዐውድ የተጠቀሰውን ኢየሱስን፣ የዳዊት ዘር አዳኝን፣ ያመለክታል።
  alternative: ጥቅሱ ብቻውን ሲነበብ ስሙን ሳይጠቅስ ተውላጠ ስሙን ብቻ መተው።
  rationale: የሐዋርያት ሥራ 13፥23-25 ዐውድ ዮሐንስ ለኢየሱስ መምጣት መንገድ እንዳዘጋጀ በግልጽ ያሳያል። ሆኖም ግሪኩ በዚህ ቁጥር ስሙን ስለማይደግም፣ ትርጉሙም ‘እርሱ’ ብሎ የጽሑፉን ቅርጽ ጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘አውጆ ነበር’ የሕዝብ ፊት ማወጅንና የቀደመ ድርጊትን በተፈጥሯዊ አገባብ ይገልጣል።
