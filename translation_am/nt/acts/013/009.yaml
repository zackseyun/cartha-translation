  yaml_path: translation/nt/acts/013/009.yaml
  text: But Saul[a], who was also called Paul, filled with the Holy Spirit, looked intently at him
translation:
  language: am
  text: ነገር ግን ሳውል፣ ጳውሎስም የተባለው፣ በመንፈስ ቅዱስ ተሞልቶ አጥብቆ ተመለከተው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σαῦλος
  choice: ሳውል
  rationale: የግል ስሙን በዘመናዊ የአማርኛ መጽሐፍ ቅዱስ አጻጻፍ መሠረት በድምፅ ቀረቤታ ያቀርባል።
- source_word: δέ
  choice: ነገር ግን
  rationale: የትረካውን መለስተኛ ንጽጽርና ወደ ሳውል ምላሽ የሚደረገውን ሽግግር ያሳያል።
- source_word: ὁ καὶ Παῦλος
  choice: ጳውሎስም የተባለው
  rationale: ሳውል ጳውሎስ የሚለውም ስም እንዳለው በተፈጥሯዊ አማርኛ ያሳያል፤ ስሙ ስለገባበት ምክንያት ተጨማሪ ትርጓሜ አይጭንም።
- source_word: πλησθεὶς
  choice: ተሞልቶ
  rationale: የግሪኩን ተደራጊ አንቀጽ ትርጉም ጠብቆ፣ ከዋናው ግስ ጋር በተፈጥሯዊ አማርኛ ይያያዛል።
- source_word: πνεύματος ἁγίου
  choice: በመንፈስ ቅዱስ
  rationale: ከ‘ተሞልቶ’ ጋር የሚስማማ ተፈጥሯዊ አማርኛ ሲሆን፣ በሐዋርያት ሥራ ያለውን መለኮታዊ መንፈስ ያመለክታል።
- source_word: ἀτενίσας
  choice: አጥብቆ ተመለከተው
  rationale: ዓይንን በአንድ ሰው ላይ አተኩሮ በጽኑ ማየትን ግልጽና ዘመናዊ በሆነ አገላለጽ ያቀርባል።
- source_word: εἰς αὐτόν
  choice: ተመለከተው
  rationale: የእይታውን አቅጣጫ የሚያመለክተውን ‘እርሱን’ በአማርኛው የተያያዘ ተሳቢ ቅጥያ ‘-ው’ ያስተላልፋል።
theological_decisions:
- issue: የπνεύματος ἁγίου አተረጓጎም
  choice: በመንፈስ ቅዱስ
  alternative: በቅዱስ መንፈስ
  rationale: በሐዋርያት ሥራ የአጠቃቀሙ አውድ፣ በተለይም የማስቻልና የመሙላት አውድ፣ የተጠቀሰው መለኮታዊው መንፈስ ቅዱስ መሆኑን በጽኑ ይደግፋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። ‘ጳውሎስም የተባለው’ የሁለተኛውን ስም ያሳያል እንጂ የስም ለውጥ እንደተፈጸመ አይገልጽም።
