lexical_decisions:
- source_word: διεφέρετο
  choice: ይስፋፋ ነበር
  rationale: ያልተፈጸመው የግስ ቅርጽ ባለፈው ጊዜ ቀጥሎ የነበረን ሂደት ያመለክታል፤ ይህ አገላለጽም ቃሉ እየተሰራጨ መሄዱን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: δὲ
  choice: -ም
  rationale: እዚህ δέ ትረካውን በለስላሳ ሁኔታ የሚያስቀጥል አያያዥ ነው፤ ከ«ጌታ» ጋር የተያያዘው «-ም» ተቃርኖን ሳያጎላ ይህን ተግባር ይፈጽማል።
- source_word: ὁ λόγος
  choice: ቃል
  rationale: በሐዋርያት ሥራ ውስጥ λόγος ብዙ ጊዜ የሚሰበከውን መልእክት ያመለክታል፤ «ቃል» የሉቃስን ተደጋጋሚ አገላለጽ ይጠብቃል፣ የ«መልእክት» ትርጉምም በማስታወሻ ቀርቧል።
- source_word: τοῦ κυρίου
  choice: የጌታ
  rationale: «ጌታ» የκύριοςን የሥልጣንና የክርስቶሳዊ ድምፀት በተለመደና ክቡር አማርኛ ይጠብቃል።
- source_word: δι’ ὅλης
  choice: በ… ሁሉ
  rationale: διά ከዘር ቅጽ ጋር በአንድ ስፍራ ውስጥ ያለን ሙሉ መስፋፋት ያሳያል፤ «በክልሉ ሁሉ» ይህን ሁሉን አቀፍነት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τῆς χώρας
  choice: ክልል
  rationale: χώρα በዚህ አውድ ዘመናዊ ሀገርን ሳይሆን በዙሪያው ያለውን ሰፊ ጂኦግራፊያዊ አካባቢ ያመለክታል፤ «ክልል» ይህን በአጭርና ግልጽ ሁኔታ ይገልጣል።
theological_decisions:
- issue: የκύριος አተረጓጎም
  choice: ጌታ
  alternative: ባለቤት
  rationale: «ጌታ» በሐዋርያት ሥራ ያለውን ክርስቶሳዊና ኪዳናዊ ድምፀት ሳያጠብ ይጠብቃል፤ «ባለቤት» ግን ትርጉሙን ወደ ተራ ባለሥልጣንነት ሊያጠብ ይችላል።
