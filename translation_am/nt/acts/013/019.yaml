  text: ⸀καὶ καθελὼν ἔθνη ἑπτὰ ἐν γῇ Χανάαν ⸀κατεκληρονόμησεν τὴν γῆν αὐτῶν
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/019.yaml
  text: And after destroying seven nations in the land of Canaan[a], he gave them their land as an inheritance.
translation:
  language: am
  text: 'በከነዓን ምድር ሰባት ሕዝቦችን ካጠፋ በኋላ፣ ምድራቸውን ለእስራኤል ርስት አድርጎ ሰጠ[a]።


    [a] ወይም፣ “ምድራቸውን ለእስራኤል በርስት አከፋፈለ።” የግሪክኛው ግስ ርስትን መድቦ ወይም አከፋፍሎ መስጠትን ሊያጎላ ይችላል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ምድራቸውን ለእስራኤል በርስት አከፋፈለ።” የግሪክኛው ግስ ርስትን መድቦ ወይም አከፋፍሎ መስጠትን ሊያጎላ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: καθελὼν (καθαιρέω)
  choice: ካጠፋ በኋላ
  rationale: በከነዓናውያን ላይ በተደረገው ድል አውድ ውስጥ ግሱ ማስወገድንና ማጥፋትን ያመለክታል፤ ይህ አተረጓጎም የግሪክኛውን የቀደመ ድርጊት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἔθνη ἑπτὰ
  choice: ሰባት ሕዝቦችን
  rationale: ἔθνη ሕዝቦችን ወይም ብሔራትን ሊያመለክት ይችላል፤ በዚህ ታሪካዊ አውድ “ሕዝቦች” የተፈጥሮ እና ግልጽ ነው።
- source_word: ἐν γῇ Χανάαν
  choice: በከነዓን ምድር
  rationale: γῇ የሚለውን “ምድር” በግልጽ በማካተት የምንጩን አገላለጽ ይጠብቃል።
- source_word: κατεκληρονόμησεν
  choice: ርስት አድርጎ ሰጠ
  rationale: ግሱ በርስት መመደብን ወይም ማከፋፈልን ይገልጣል። ዋናው ንባብ የርስትን ሐሳብ በተፈጥሯዊ አማርኛ ያቀርባል፤ የማከፋፈል አጽንዖት በማስታወሻው ተጠብቋል።
- source_word: τὴν γῆν αὐτῶν
  choice: ምድራቸውን
  rationale: αὐτῶν ቀደም ብለው የተጠቀሱትን ሰባት ሕዝቦች ያመለክታል፤ “ምድራቸውን” ቀጥተኛና ተፈጥሯዊ ነው።
theological_decisions:
- issue: የሁለቱ ድርጊቶች ፈጻሚና የርስቱ ተቀባይ
  choice: ሁለቱንም ድርጊቶች የፈጸመው እግዚአብሔር ነው፤ ምድሩንም በርስት የተቀበለው እስራኤል ነው።
  alternative: ተቀባዩን ሳይጠቅሱ “ምድራቸውን በርስት አከፋፈለ” ብሎ መተርጎም።
  rationale: በግሪክኛው የርስቱ ተቀባይ በቀጥታ አልተጠቀሰም፤ ነገር ግን በቅርብ አውዱ የሚተረከው እግዚአብሔር ለእስራኤል ያደረገው ታሪክ ስለሆነ፣ “ለእስራኤል” የሚለው ግልጽ ማድረጊያ የታሪካዊውን ትርጉም ያሳያል፤ አዲስ የእምነት አቋም አያክልም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “ርስት አድርጎ ሰጠ” የመጽሐፍ ቅዱሳዊውን ርስት ጭብጥ ሳያጠፋ ተፈጥሯዊ ንባብን ይሰጣል።
