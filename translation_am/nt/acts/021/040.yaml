    text: ወይም ምናልባት፣ “በአራማይክ ቋንቋ።” የግሪኩ ጽሑፍ “በዕብራይስጥ አነጋገር/ቋንቋ” ይላል፤ በዚህ አውድ ግን በአካባቢው በስፋት ይነገር የነበረውንና በተለምዶ አራማይክ የሚባለውን ሴማዊ ቋንቋ ሊያመለክት ይችላል።
