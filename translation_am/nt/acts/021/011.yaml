  text: καὶ ἐλθὼν πρὸς ἡμᾶς καὶ ἄρας τὴν ζώνην τοῦ Παύλου δήσας ⸀ἑαυτοῦ τοὺς πόδας καὶ τὰς χεῖρας εἶπεν· Τάδε λέγει τὸ πνεῦμα τὸ ἅγιον Τὸν ἄνδρα οὗ ἐστιν ἡ ζώνη αὕτη, οὕτως δήσουσιν ἐν Ἰερουσαλὴμ οἱ Ἰουδαῖοι καὶ παραδώσουσιν εἰς χεῖρας ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/011.yaml
  text: 'And coming to us[a], and taking Paul’s belt, he bound his own feet and hands and said[b], “Thus says the Holy Spirit: ‘In this way the Jews in Jerusalem will bind the man to whom this belt belongs and will hand him over into the hands of the Gentiles.’”'
translation:
  language: am
  text: ወደ እኛም መጥቶ የጳውሎስን ቀበቶ ወሰደ፤ የራሱን እግሮችና እጆች አስሮ እንዲህ አለ፦ “መንፈስ ቅዱስ እንዲህ ይላል፦[b] ‘የዚህ ቀበቶ ባለቤት የሆነውን ሰው[a] በኢየሩሳሌም ያሉ አይሁድ እንዲህ አስረው በአሕዛብ እጅ አሳልፈው ይሰጡታል።’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ይበልጥ ቃል በቃል፣ “ይህ ቀበቶ የሆነለትን ሰው።”
    reason: lexical_alternative
  - marker: b
    text: “መንፈስ ቅዱስ እንዲህ ይላል” የሚለው “መንፈስ ቅዱስ የሚለው ይህን ነው” ተብሎም ሊተረጎም ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ζώνην
  choice: ቀበቶ
  rationale: በወገብ ላይ የሚታሰርን ቀበቶ ወይም መታጠቂያ ያመለክታል፤ “ቀበቶ” በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: δήσας ἑαυτοῦ τοὺς πόδας καὶ τὰς χεῖρας
  choice: የራሱን እግሮችና እጆች አስሮ
  rationale: ἑαυτοῦ ወደ ድርጊቱ አድራጊ ይመለሳል፤ ስለዚህ አጋቦስ ጳውሎስን ሳይሆን ራሱን እንዳሰረ በግልጽ ተተርጉሟል። “አስሮ” የትንቢታዊውን ምልክት ክብደት ይጠብቃል።
- source_word: Τάδε λέγει
  choice: እንዲህ ይላል
  rationale: በቅዱሳት መጻሕፍት የሚታወቀውን የትንቢታዊ ንግግር ቀመር በተፈጥሯዊና ክብር ባለው አማርኛ ያቀርባል።
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: መንፈስ ቅዱስ
  rationale: በዘመናዊ መደበኛ አማርኛ የተለመደውና የግሪኩን ስያሜ በቀጥታ የሚያስተላልፍ አተረጓጎም ነው።
- source_word: Τὸν ἄνδρα οὗ ἐστιν ἡ ζώνη αὕτη
  choice: የዚህን ቀበቶ ባለቤት
  rationale: የቀበቶውን ባለቤትነት በአጭርና ተፈጥሯዊ አማርኛ ይገልጻል፤ ይበልጥ ቃል በቃል የሆነው አማራጭ በማስታወሻ [a] ቀርቧል።
- source_word: οὕτως
  choice: እንዲህ
  rationale: አጋቦስ በራሱ ላይ ያደረገውን ምልክታዊ ድርጊት ከሚመጣው እስራት ጋር ያገናኛል።
- source_word: οἱ Ἰουδαῖοι
  choice: አይሁድ
  rationale: ግሪኩ ያለ ተጨማሪ ማብራሪያ “አይሁድ” ይላል፤ “የአይሁድ መሪዎች” ማለት በምንጩ የሌለ ገደብ ይጨምራል።
- source_word: παραδώσουσιν
  choice: አሳልፈው ይሰጡታል
  rationale: ሰውን ለሌላ ወገን ሥልጣን አሳልፎ የመስጠትን ሐሳብ በተለመደ አማርኛ ይገልጻል።
- source_word: εἰς χεῖρας ἐθνῶν
  choice: በአሕዛብ እጅ
  rationale: “በ…እጅ” የሚለውን መጽሐፍ ቅዱሳዊ አገላለጽና በሌሎች ሥልጣን ሥር የመውደቅን ሐሳብ ይጠብቃል፤ በዚህ አውድ “አሕዛብ” አይሁድ ያልሆኑትን ያመለክታል።
