lexical_decisions:
- source_word: ἠκολούθει
  choice: ይከተል ነበር
  rationale: ያለፈውን ቀጣይ ድርጊት የሚያመለክተውን የግሪክ ያልተፈጸመ ጊዜ (imperfect) በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: γὰρ
  choice: ነበርና
  rationale: ከቀደመው ትረካ ጋር ያለውን የምክንያትና የማብራሪያ ግንኙነት በአማርኛ ዓረፍተ ነገር መጨረሻ በተለመደው መንገድ ይገልጣል።
- source_word: τὸ πλῆθος τοῦ λαοῦ
  choice: ሕዝቡ በብዛት
  rationale: ብዙ ሰዎች በአንድ ላይ መሰባሰባቸውን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል፤ ‘ጭፍራ’ የሚለውን ተጨማሪ አሉታዊ ፍቺ አያስገባም።
- source_word: κράζοντες
  choice: እያለ እየጮኸ
  rationale: ጩኸቱ ከመከተሉ ጋር አብሮ የቀጠለ ድርጊት መሆኑን ያሳያል፤ ነጠላው ሰዋስዋዊ ቅርጽ ሕዝቡን እንደ አንድ ስብስብ ይመለከታል።
- source_word: Αἶρε αὐτόν
  choice: አስወግዱት!
  rationale: በዚህ አውድ የትእዛዙን ጠላትነት የተሞላበት የማስወገድ ጥያቄ በግልጽ ያስተላልፋል፤ ቃሉን በቀጥታ ‘አንሱት’ ብሎ አይተረጉምም።
