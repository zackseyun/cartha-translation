  yaml_path: translation/nt/acts/021/019.yaml
  text: And after greeting them[b][a], he began to relate one by one the things that God had done among the Gentiles through his ministry.
translation:
  language: am
  text: እነርሱንም ሰላም ካላቸው በኋላ፣ እግዚአብሔር በአገልግሎቱ አማካይነት በአሕዛብ[a] መካከል ያደረገውን ሁሉ አንድ በአንድ ተረከላቸው።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በአገሮች መካከል።” በዚህ አውድ ቃሉ አይሁድ ያልሆኑትን ሕዝቦች ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በዝርዝር አብራራላቸው።” የግሪኩ ግስ የተራዘመና ነገሮቹን አንድ በአንድ የሚያቀርብ ዘገባን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπασάμενος
  choice: ሰላም ካላቸው በኋላ
  rationale: የቀደመውን ድርጊት የሚያመለክተውን የአዎሪስት አሳታፊ ቅርጽ በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: ἐξηγεῖτο
  choice: በዝርዝር ተረከላቸው
  rationale: ግሱ ሰፋ ያለ ዘገባን፣ ትረካን ወይም ማብራሪያን ሊያመለክት ይችላል፤ ይህ ምርጫ ከκαθ’ ἓν ἕκαστον ጋር ተያይዞ የዝርዝር ዘገባውን አካሄድ ይጠብቃል።
- source_word: καθ’ ἓν ἕκαστον
  choice: አንድ በአንድ
  rationale: የእያንዳንዱን ነገር ተራ በተራ መዘገብ የሚያሳየውን አከፋፋይ ኃይል በቀጥታና በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὧν ἐποίησεν ὁ θεὸς
  choice: እግዚአብሔር ... ያደረገውን ነገር ሁሉ
  rationale: እግዚአብሔርን የድርጊቶቹ ፈጻሚ አድርጎ ያስቀምጣል፤ የዘመድ ተውላጠ ስሙን ነጠላ ሰብሳቢ አገላለጽ በሆነው ‘ነገር ሁሉ’ በተፈጥሯዊ መንገድ ይወክላል።
- source_word: ἐν τοῖς ἔθνεσιν
  choice: በአሕዛብ መካከል
  rationale: በዚህ የሐዋርያት ሥራ አውድ ἔθνη ከአይሁድ ውጭ ያሉ ሕዝቦችን ያመለክታል፤ ‘አሕዛብ’ የተለመደና አጭር የመጽሐፍ ቅዱስ አገላለጽ ነው።
- source_word: διὰ τῆς διακονίας αὐτοῦ
  choice: በአገልግሎቱ አማካይነት
  rationale: διά ከወራሽ ቅጽ ጋር የመሣሪያነትን ወይም የአማካይነትን ግንኙነት ያሳያል፤ ይህም የጳውሎስን አገልግሎት መንገድ አድርጎ ሲያቀርብ ዋናውን ድርጊት ለእግዚአብሔር ይሰጣል።
theological_decisions:
- issue: በጳውሎስ የተልእኮ ዘገባ ውስጥ የድርጊት ባለቤትነት
  choice: እግዚአብሔር ድርጊቱን ያደረገ ሲሆን፣ የጳውሎስ አገልግሎት ደግሞ ድርጊቱ የተፈጸመበት አማካይ እንደሆነ ተቀምጧል።
  alternative: ጳውሎስ ራሱ በአሕዛብ መካከል ያከናወነውን እንደዘገበ ማቅረብ።
  rationale: ὧν ἐποίησεν ὁ θεὸς ድርጊቱን በግልጽ ለእግዚአብሔር ይሰጣል፤ διὰ τῆς διακονίας αὐτοῦ ደግሞ የጳውሎስን አገልግሎት እንደ አማካይ ያቀርባል።
