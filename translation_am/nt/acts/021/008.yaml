  yaml_path: translation/nt/acts/021/008.yaml
  text: On the next day we departed and came to Caesarea[a], and entering the house of Philip the evangelist, who was one of the seven, we stayed with him.
translation:
  language: am
  text: በማግስቱም ተነሥተን ወደ ቂሳርያ መጣን። የወንጌል ሰባኪው፣ ከሰባቱ አንዱ የነበረው[a] ፊልጶስ፣ ቤት ገብተን ከእርሱ ጋር ቆየን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይህም ቀደም ሲል በኢየሩሳሌም ለአገልግሎት ከተመረጡት ሰባት ሰዎች አንዱ ማለት ነው (የሐዋርያት ሥራ 6፥3–6ን ይመልከቱ)።
