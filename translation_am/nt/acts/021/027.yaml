  text: As the seven days were about to be completed[a], the Jews from Asia, seeing him in the temple, stirred up the whole crowd and laid hands on him[c][b],
translation:
  language: am
  text: 'ሰባቱ ቀናት ሊጠናቀቁ ሲሉ፣ ከእስያ የመጡት አይሁድ እርሱን በቤተ መቅደስ[c] ውስጥ አይተው ሕዝቡን ሁሉ አነሣሡ[a]፤ በእርሱም ላይ እጃቸውን ጫኑ[b]።


    [a] ወይም፣ “ሕዝቡን ሁሉ ግራ አጋቡ።” የግሪኩ ግስ ሕዝቡን ማነሣሣትን ወይም ግራ ማጋባትን ሊያመለክት ይችላል።


    [b] ወይም፣ “ያዙት።” “በእርሱ ላይ እጃቸውን ጫኑ” የሚለው አገላለጽ አንድን ሰው በኃይል መያዝን ያመለክታል።


    [c] እዚህ “ቤተ መቅደስ” የሚለው ቃል የቤተ መቅደሱን ግቢና ሕንፃዎች በአጠቃላይ ያመለክታል እንጂ የውስጠኛውን መቅደስ ብቻ አይደለም።'
