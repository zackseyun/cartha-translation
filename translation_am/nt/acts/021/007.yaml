base_translation:
  language: en
  yaml_path: translation/nt/acts/021/007.yaml
  text: We[a], having finished the voyage from Tyre, arrived at Ptolemais, and after greeting the brothers, we stayed with them one day.
translation:
  language: am
  text: እኛም ከጢሮስ የባሕር ጉዞውን አጠናቀን ወደ ጴጥሌማይስ ደረስን፤ ወንድሞችንም[a] ሰላም ብለናቸው አንድ ቀን ከእነርሱ ጋር ቆየን።
  philosophy: optimal-equivalence
  footnotes:
