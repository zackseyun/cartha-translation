  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: περὶ δὲ τῶν πεπιστευκότων ἐθνῶν ἡμεῖς ⸀ἀπεστείλαμεν ⸀κρίναντες φυλάσσεσθαι αὐτοὺς τό τε εἰδωλόθυτον ⸀καὶ αἷμα καὶ πνικτὸν καὶ πορνείαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/025.yaml
  text: But concerning the Gentiles who have believed[a], we sent word, having decided that they should keep themselves from what is sacrificed to idols, and from blood, and from what is strangled[c][b], and from sexual immorality.
translation:
  language: am
  text: ነገር ግን ያመኑ አሕዛብን በተመለከተ፣ ለጣዖታት ከተሠዋው፣ ከደም፣ ታንቆ ከሞተ እንስሳ ሥጋ፣ እና ከዝሙት ራሳቸውን እንዲጠብቁ ወስነን መልእክት ልከናል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περὶ δὲ
  choice: ነገር ግን … በተመለከተ
  rationale: περί የርእስ ሽግግርን፣ δέ ደግሞ ከቀደመው ሐሳብ ጋር ያለውን ለስላሳ ንጽጽር ያሳያሉ።
- source_word: τῶν πεπιστευκότων ἐθνῶν
  choice: ያመኑትን ከአሕዛብ ወገን የሆኑትን
  rationale: πεπιστευκότων ወደ እምነት ገብተው በእምነት የሚኖሩትን ያመለክታል፤ ἔθνη በዚህ አውድ አይሁድ ያልሆኑትን ይጠቅሳል።
- source_word: ἡμεῖς ἀπεστείλαμεν
  choice: መልእክት ልከናል
  rationale: የተላከው ነገር በግሪኩ በግልጽ አልተጠቀሰም፤ አውዱ ግን ቀደም ሲል የተላከውን ውሳኔ ያመለክታል። ‘መልእክት’ ከ‘ደብዳቤ’ ይልቅ የምንጩን አሻሚነት ይጠብቃል፤ የመጀመሪያ መደብ ብዙ ቁጥር ቅጥያው ἡμεῖςን በተፈጥሮ ያካትታል።
- source_word: κρίναντες
  choice: ወስነን
  rationale: ይህ ቀድሞ የተደረገውን የምክር ቤቱን ውሳኔ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: φυλάσσεσθαι αὐτοὺς
  choice: ራሳቸውን እንዲጠብቁ
  rationale: የግሱን መካከለኛ ድምፅና ‘ራስን ከነገር መጠበቅ’ የሚለውን ሐሳብ ይጠብቃል።
- source_word: τό τε εἰδωλόθυτον
  choice: ለጣዖታት ከተሠዋው
  rationale: ለጣዖት መሥዋዕት የቀረበውን ምግብ ወይም ሥጋ ያመለክታል፤ የምንጩን አጭርነት ለመጠበቅ ‘ምግብ’ በዋናው ጽሑፍ አልተጨመረም።
- source_word: αἷμα
  choice: ደም
  rationale: የግሪኩን አጭርና ቀጥተኛ አገላለጽ ይጠብቃል።
- source_word: πνικτόν
  choice: ታንቆ ከሞተው እንስሳ ሥጋ
  rationale: ደሙ ሳይፈስ ታንቆ ወይም ታፍኖ የተገደለን እንስሳ ያመለክታል፤ ይህ አገላለጽ በዘመናዊ አማርኛ ግልጽ ነው።
- source_word: πορνείαν
  choice: ዝሙት
  rationale: በመጽሐፍ ቅዱሳዊ አማርኛ የተለመደ፣ ሕገ ወጥ የወሲብ ግንኙነትን በሰፊው የሚያመለክት ቃል ነው።
theological_decisions:
- issue: የሐዋርያት ውሳኔ ክልከላዎች ባሕርይና የጊዜ ወሰን
  choice: አራቱን ክልከላዎች ጥቅሱ እንደሚዘረዝራቸው በቀጥታ ማቅረብ
  alternative: እንደ ጊዜያዊ የማዕድ ኅብረት ስምምነት ብቻ ወይም ሁልጊዜ እንደሚጸና ዓለም አቀፍ ሕግ መተርጎም
  rationale: ይህ ጥቅስ የቀደመውን ውሳኔ ይዘት ይደግማል እንጂ ሙሉ ሥነ መለኮታዊ ምክንያቱን ወይም የጊዜ ወሰኑን አይገልጽም፤ ስለዚህ ትርጉሙ ጉዳዩን ለአንድ የእምነት ሥርዓት አይወስነውም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። ‘መልእክት ልከናል’ በግሪኩ ያልተገለጸውን ቀጥተኛ ተሳቢ ‘ደብዳቤ’ ብሎ ከመወሰን ይቆጠባል። በዋናው ጽሑፍ የግድ የሚያስፈልግ የግርጌ ማስታወሻ ስላልነበረ ምልክት አልገባም።
