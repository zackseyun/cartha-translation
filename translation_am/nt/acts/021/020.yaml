source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες ἐδόξαζον τὸν ⸀θεόν, ⸂εἶπόν τε⸃ αὐτῷ· Θεωρεῖς, ἀδελφέ, πόσαι μυριάδες εἰσὶν ⸂ἐν τοῖς Ἰουδαίοις⸃ τῶν πεπιστευκότων, καὶ πάντες ζηλωταὶ τοῦ νόμου ὑπάρχουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/020.yaml
  text: When they heard this[a], they glorified God, and they said to him, “You see, brother, how many myriads there are among the Jews who have believed[b], and they are all zealous for the law.”
translation:
  language: am
  text: እነርሱም ይህን በሰሙ ጊዜ እግዚአብሔርን አከበሩ፤ ለጳውሎስም እንዲህ አሉት፦ “ወንድም ሆይ፣ ከአመኑ አይሁድ[b] መካከል ስንት ሺህ እንዳሉ[a] ታያለህ፤ ሁሉም ለሕጉ ቀናተኞች ናቸው።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ስንት አሥር ሺዎች እንዳሉ።” የግሪኩ μυριάδες የአሥር ሺህ ክፍሎችን ወይም በአጠቃላይ እጅግ ብዙ ቁጥርን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “አይሁድ” የተተረጎመው ቃል በጂኦግራፊያዊ ስሜት ከተወሰደ፣ “የይሁዳ ሰዎች” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: ይህን በሰሙ ጊዜ
  rationale: የአኦሪስት ተሳቢውን ጊዜያዊ ኃይል ያሳያል፤ ከቀደመው ዐውድ የሚገባውን የተሰማ ዘገባ ‘ይህን’ በማለት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐδόξαζον τὸν θεόν
  choice: እግዚአብሔርን አከበሩ
  rationale: δοξάζω እዚህ ለእግዚአብሔር ክብር መስጠትን ያመለክታል፤ ‘አከበሩ’ ይህን ክብደት በግልጽ አማርኛ ይይዛል።
- source_word: εἶπόν τε αὐτῷ
  choice: ጳውሎስንም እንዲህ አሉት
  rationale: ተውላጠ ስሙ የሚያመለክተውን ጳውሎስን ለግልጽነት በስም ይጠቅሳል፤ τέ የትረካውን ቅንጅት በ‘ም’ ይይዛል።
- source_word: Θεωρεῖς, ἀδελφέ
  choice: ወንድም ሆይ፣ … ታያለህ
  rationale: Θεωρεῖς የሚታወቅን ሁኔታ እንዲመለከት የሚያሳስብ ነው፤ ἀδελφέ ለአንድ ወንድ የቀረበ የወንድማማችነት ጥሪ ነው።
- source_word: πόσαι μυριάδες
  choice: ስንት ሺህ
  rationale: μυριάδες በትክክል የአሥር ሺህ ክፍሎችን ወይም በአጠቃላይ እጅግ ብዙ ቁጥርን ሊያመለክት ይችላል። ‘ስንት ሺህ’ ቁጥሩን ሳያጠብ በተፈጥሯዊ አማርኛ ብዛቱን ያሳያል።
- source_word: ἐν τοῖς Ἰουδαίοις τῶν πεπιστευκότων
  choice: ካመኑት አይሁድ መካከል
  rationale: ፍጹም ጊዜ ያለው πεπιστευκότων አምነው በእምነት የሚኖሩትን ያመለክታል፤ Ἰουδαῖοι በዐውዱ የአይሁድን ሕዝባዊና ሃይማኖታዊ ማንነት ይጠቁማል።
- source_word: πάντες ζηλωταὶ τοῦ νόμου ὑπάρχουσιν
  choice: ሁሉም ለሕጉ ቀናተኞች ናቸው
  rationale: ζηλωταί ጠንካራ ቅንዓትንና ቁርጠኝነትን ይገልጣል፤ ὑπάρχουσιν እዚህ እንደ አያያዥ ግስ ‘ናቸው’ ተብሎ በተፈጥሯዊነት ተተርጉሟል።
theological_decisions:
- issue: የἐν τοῖς Ἰουδαίοις ማጣቀሻ
  choice: ከአይሁድ መካከል
  alternative: ከይሁዳ ሰዎች መካከል
  rationale: ዐውዱ ለሙሴ ሕግ ያላቸውን ቅንዓት ስለሚጠቅስ፣ ቃሉ ከጂኦግራፊያዊ መኖሪያ ይልቅ የሕዝብና የሃይማኖት ማንነትን የሚያጎላ መሆኑ የበለጠ ተስማሚ ነው፤ አማራጩ ግን በማስታወሻ ተጠብቋል።
- issue: የμυριάδες ቁጥራዊ ኃይል
  choice: ስንት ሺህ
  alternative: ስንት አሥር ሺዎች
  rationale: የግሪኩ ቃል አሥር ሺህ የሚሆኑ ክፍሎችን በትክክል ወይም በአጠቃላይ እጅግ ብዙ ሰዎችን ሊያመለክት ስለሚችል፣ ዋናው ጽሑፍ ትርጉሙን አያጠብም፤ የተወሰነውን አማራጭ በማስታወሻ ያቀርባል።
- issue: ‘ሕጉ’ የሚያመለክተው
  choice: ሕጉ
  alternative: የሙሴ ሕግ
  rationale: τοῦ νόμου በዐውዱ የሙሴን ሕግ ያመለክታል፤ ግሪኩ ግን ‘የሙሴ’ የሚለውን በግልጽ ስለማይጨምር፣ ‘ሕጉ’ የሚለው አጭር አቀራረብ የምንጩን ቅርጽ ይጠብቃል።
