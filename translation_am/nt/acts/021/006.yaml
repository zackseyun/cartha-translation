    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “ወደ ራሳቸው ነገሮች/ስፍራዎች።” ይህ ፈሊጥ “ወደ የራሳቸው ቤት” ወይም “ወደ የራሳቸው ስፍራ” ማለት ነው።
