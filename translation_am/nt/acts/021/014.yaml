id: ACT.21.14
reference: Acts 21:14
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: μὴ πειθομένου δὲ αὐτοῦ ἡσυχάσαμεν εἰπόντες· ⸂Τοῦ κυρίου τὸ θέλημα⸃ ⸀γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/014.yaml
  text: And since he would not be persuaded[a], we became quiet, saying, “The Lord’s will be done.”
translation:
  language: am
  text: እርሱም እንዲሳመን ስላልፈቀደ፣ “የጌታ ፈቃድ ይሁን” ብለን ዝም አልን።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ πειθομένου δὲ αὐτοῦ
  choice: እርሱም ሊሳመን ስላልቻለ
  rationale: የግሪኩን ጄኒቲቭ አብሶሉት እንደ ሁኔታዊ/ምክንያታዊ አገናኝ በተፈጥሯዊ አማርኛ ያቀርባል፤ ጳውሎስ ልመናቸውን እንዳልተቀበለ ያሳያል።
- source_word: ἡσυχάσαμεν
  choice: ዝም አልን
  rationale: በዚህ አውድ ጉዳዩን መግፋታቸውን አቁመው ጸጥ ማለታቸውን በተለመደና ግልጽ አማርኛ ይገልጣል።
- source_word: εἰπόντες
  choice: ብለን
  rationale: ከዋናው ግስ ጋር የተያያዘውን አካላዊ ግስ በተፈጥሯዊ የአማርኛ ግንባታ ያስተላልፋል።
- source_word: Τοῦ κυρίου
  choice: የጌታ
  rationale: κύριοςን በመደበኛውና በአውዱ ተስማሚው የአማርኛ ቃል ‘ጌታ’ ይተረጉማል፤ ግሪኩ በግልጽ ካለው በላይ ማንነቱን አይጨምርም።
- source_word: τὸ θέλημα
  choice: ፈቃድ
  rationale: የአንድን ሰው ውሳኔ፣ ዓላማ ወይም የሚፈልገውን ነገር የሚገልጠው መደበኛና ተስማሚ የአማርኛ አቻ ነው።
- source_word: γινέσθω
  choice: ይሁን
  rationale: የአሁን ጊዜ ትእዛዛዊውን የመገዛት አገላለጽ በተፈጥሯዊና የተከበረ አማርኛ ያቀርባል፤ ‘ይፈጸም’ ከሚለው ይልቅ የγίνομαιን ሰፊ ትርጉም ይጠብቃል።
theological_decisions:
- issue: የκύριος አተረጓጎም
  choice: ጌታ
  alternative: ባለቤት
  rationale: ‘ጌታ’ በዚህ የእምነት አውድ የተለመደውና የተከበረው አቻ ነው። አውዱ ቃሉን ወደ ጌታ ኢየሱስ ሊያመለክት ቢችልም፣ ትርጉሙ ግሪኩ ያልገለጠውን ስም አይጨምርም።
- issue: γινέσθω የሚያሳየው ለጌታ ፈቃድ መገዛት
  choice: ይሁን
  alternative: ይፈጸም
  rationale: ‘ይሁን’ የጌታን ፈቃድ በመቀበል የተነገረውን ምኞታዊ/ትእዛዛዊ አገላለጽ ይጠብቃል፣ ውጤቱ በምን መልኩ እንደሚከሰትም አስቀድሞ አይወስንም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛን ይጠቀማል። ‘ዝም አልን’ የተፈጥሮ አማርኛ ሲሆን እነርሱ ጉዳዩን መግፋት እንዳቆሙ አውዱ ያሳያል።
