  yaml_path: translation/nt/acts/021/010.yaml
  text: While we were staying there for several days, a prophet named Agabus came down from Judea.
translation:
  language: am
  text: በዚያ ለተወሰኑ ቀናት ስንቆይ፣ አጋቦስ የሚባል አንድ ነቢይ ከይሁዳ ወረደ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιμενόντων
  choice: ስንቆይ
  rationale: የአሁን ጊዜ አሳታፊው በጄኔቲቭ አብሶሉት አወቃቀር የጊዜ ትርጉም ይሰጣል፤ ከአውዱም ተናጋሪውና ባልንጀሮቹ እንደሆኑ ስለሚታወቅ «ስንቆይ» ተመርጧል።
- source_word: δὲ
  choice: ም
  rationale: ቀላል የትረካ ሽግግርን የሚያመለክተው δέ ከ«በዚያ» ጋር ተያይዞ በአማርኛው የአያያዥ ቅጥያ «ም» ተገልጧል።
- source_word: ἡμέρας πλείους
  choice: ብዙ ቀናት
  rationale: ይህ የጊዜ ቆይታን የሚያመለክት አኩዛቲቭ ሲሆን፣ πλείους እዚህ ከጥቂት የበለጡ ወይም ተጨማሪ ቀናትን ያመለክታል፤ «ብዙ ቀናት» የምንጩን ቅርጽ በቀጥታ የሚከተል ተፈጥሯዊ አማርኛ ነው።
- source_word: κατῆλθέν
  choice: ወረደ
  rationale: ከይሁዳ ወደ ባሕር ዳርቻው የተደረገውን ጉዞ በምንጩ ያለውን አቅጣጫዊ ምስል ጠብቆ ያስተላልፋል።
- source_word: τις
  choice: አንድ
  rationale: አዲስ ተሳታፊን የሚያስተዋውቀውን ያልተወሰነ ትርጉም «አንድ ነቢይ» በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: ከይሁዳ
  rationale: የመነሻ ቦታውን በቀጥታ ያሳያል፤ «ይሁዳ» በዚህ አውድ የክልሉ መጠሪያ ነው።
- source_word: προφήτης
  choice: ነቢይ
  rationale: የታወቀውን ትንቢታዊ ሚና የሚገልጥ መደበኛና ለአንባቢዎች የተለመደ ቃል ነው።
- source_word: ὀνόματι Ἅγαβος
  choice: አጋቦስ የሚባል
  rationale: ὀνόματι የሚለውን «በስሙ/የሚባል» ፈሊጣዊ አገላለጽ በዘመናዊና ተፈጥሯዊ አማርኛ ያቀርባል።
