  text: When it came time for us to complete those days[a], we departed and went on our way, while they all, with wives and children, were accompanying us as far as outside the city. And after kneeling down on the beach[b], we prayed.
translation:
  language: am
  text: እነዚያን ቀናት ልንፈጽም ጊዜው ሲደርስ፣ ወጥተን መንገዳችንን ቀጠልን። ሁሉም ከሚስቶቻቸውና ከልጆቻቸው ጋር እስከ ከተማይቱ ውጭ ድረስ ሸኙን[a]። በባሕር ዳርቻም[b] ተንበርክከን ጸለይን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ሁሉም ሊሰናበቱን አብረውን መጡ።» የግሪኩ ግስ የሚሄድን ሰው ለመሸኘት አብሮት መሄድን ሊያመለክት ይችላል።
