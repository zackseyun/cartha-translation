  rationale: መጀመሪያ መውጣታቸውንና ከዚያም ጉዞአቸውን መቀጠላቸውን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: προπεμπόντων ἡμᾶς πάντων
  choice: ሁሉም ... ሸኙን
  rationale: προπέμπω ተጓዥን አብሮ በመሄድ መሸኘትን ወይም ለስንብት ማድረስን ያመለክታል፤ ‘ሸኙን’ ሁለቱንም ገጽታዎች በተፈጥሯዊ አማርኛ ይይዛል።
- source_word: σὺν γυναιξὶ καὶ τέκνοις
  choice: ከሚስቶቻቸውና ከልጆቻቸው ጋር
  rationale: πάντων በወንድ ብዙ ቁጥር መሆኑና አውዱ ቤተሰቦች በአንድነት እንደሸኙ ስለሚያሳይ γυναιξὶ እዚህ ‘ሚስቶች’ ተብሎ መተርጎሙ ይበልጥ ተስማሚ ነው።
- source_word: ἕως ἔξω τῆς πόλεως
  choice: ከከተማይቱ ውጭ እስክንደርስ ድረስ
  rationale: አብረዋቸው የሄዱበት ወሰን ከከተማይቱ ውጭ እንደነበር የሐረጉን አቅጣጫዊ ኃይል በግልጽ ያሳያል።
- source_word: θέντες τὰ γόνατα
