    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ⸂ἐξαρτίσαι ἡμᾶς⸃ τὰς ἡμέρας
  choice: እነዚያን ቀናት የምንፈጽምበት ጊዜ በደረሰ ጊዜ
