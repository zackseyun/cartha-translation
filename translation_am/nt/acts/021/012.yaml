    issue: The imperfect aspect of παρεκαλοῦμεν is not represented.
    rationale: ‘አጥብቀን ጠየቅነው’ is a completed past event, whereas παρεκαλοῦμεν is imperfect and here indicates that they were urging or pleading with him repeatedly/continuously.
  - severity: low
    issue: ‘በዚያ የሚኖሩት ሰዎች’ slightly narrows οἱ ἐντόπιοι.
    rationale: The Greek identifies people local to the place, but does not specifically assert permanent residence. ‘የዚያ አካባቢ ሰዎች’ retains the broader sense.
