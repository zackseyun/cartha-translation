  text: ὡς δὲ ἠκούσαμεν ταῦτα, παρεκαλοῦμεν ἡμεῖς τε καὶ οἱ ἐντόπιοι τοῦ μὴ ἀναβαίνειν αὐτὸν εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/012.yaml
  text: When we heard these things[a], we and the local people urged him not to go up to Jerusalem.
translation:
  language: am
  text: እነዚህን ነገሮች በሰማን ጊዜ፣ እኛም ሆንን የዚያ አካባቢ ሰዎች ወደ ኢየሩሳሌም እንዳይወጣ አጥብቀን እንለምነው ነበር።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወደ ኢየሩሳሌም እንዳይወጣ አጥብቀን እንጠይቀው ነበር።” ግሱ ከልብ የሆነ ልመናንም ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἠκούσαμεν ταῦτα
  choice: እነዚህን ነገሮች በሰማን ጊዜ
  rationale: የጊዜውን ግንኙነትና ταῦτα የሚያመለክተውን ቀደም ሲል የተነገረ ብዙ ይዘት በተፈጥሯዊ አማርኛ ያስተላልፋል፤ δέ በአማርኛ ለብቻው ሳይጎላ በአወቃቀሩ ተካትቷል።
- source_word: παρεκαλοῦμεν
  choice: አጥብቀን ጠየቅነው
  rationale: በዚህ አውድ παρακαλέω ማሳሰብ፣ አጥብቆ መጠየቅ ወይም መለመንን ሊያመለክት ይችላል። ይህ ምርጫ የልመናውን አጽንዖት ያሳያል፣ ነገር ግን ስሜቱን ከጽሑፉ በላይ አያጋንንም።
- source_word: ἡμεῖς τε καὶ οἱ ἐντόπιοι
  choice: እኛና በዚያ የሚኖሩት ሰዎች
  rationale: የተራኪው ቡድንና የአካባቢው ነዋሪዎች በአንድነት እንደጠየቁ በግልጽና በዘመናዊ አማርኛ ያሳያል።
- source_word: τοῦ μὴ ἀναβαίνειν αὐτὸν
  choice: እንዳይወጣ
  rationale: ከπαρακαλέω ቀጥሎ ያለው አሉታዊ የድርጊት ይዘት ጳውሎስ እንዳይሄድ የቀረበውን ጥያቄ ያሳያል፤ የአማርኛው የግስ ቅርጽ ተሳቢውንም በተፈጥሮ ያካትታል።
- source_word: ἀναβαίνειν ... εἰς Ἰερουσαλήμ
  choice: ወደ ኢየሩሳሌም ... እንዳይወጣ
  rationale: ወደ ኢየሩሳሌም ስለመጓዝ የግሪኩን ‘መውጣት’ የአቅጣጫ አገላለጽ ጠብቆ ያቆያል።
theological_decisions:
- issue: ወደ ኢየሩሳሌም የመጓዝ የአቅጣጫ አገላለጽ
  choice: ወደ ኢየሩሳሌም እንዳይወጣ
  alternative: ወደ ኢየሩሳሌም እንዳይሄድ
  rationale: ἀναβαίνειν የሚለውን ቃል በ‘መውጣት’ መተርጎም የምንጩን የተለመደ አቅጣጫዊ አገላለጽ ይጠብቃል፤ ተጨማሪ ሥነ መለኮታዊ ትርጉም አይጭንም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ይጠቀማል። “አጥብቀን ጠየቅነው” የአውዱን ጽናት በተፈጥሯዊ አነጋገር ሲያሳይ፣ የበለጠ ጠንካራውን “ለመንነው” በማስታወሻ ያቀርባል።
