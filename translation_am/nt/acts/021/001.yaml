  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐγένετο ἀναχθῆναι ἡμᾶς ἀποσπασθέντας ἀπ’ αὐτῶν, εὐθυδρομήσαντες ἤλθομεν εἰς τὴν ⸀Κῶ, τῇ δὲ ἑξῆς εἰς τὴν Ῥόδον, κἀκεῖθεν εἰς Πάταρα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/001.yaml
  text: After we had torn ourselves away from them and put out to sea[a], we ran a straight course and came to Cos, and on the next day to Rhodes, and from there to Patara.
translation:
  language: am
  text: ከእነርሱ በጭንቅ ተለይተን ወደ ባሕር ከወጣን በኋላ፣ በቀጥታ ተጓዝንና ወደ ቆስ ደረስን፤ በማግስቱም ወደ ሮዶስ፣ ከዚያም ወደ ጳጥራ ደረስን።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡς δὲ ἐγένετο
  choice: ከ... በኋላ
  rationale: የግሪኩን የትረካ ጊዜ ሽግግር በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἀποσπασθέντας ἀπ’ αὐτῶν
  choice: ከእነርሱ ተለይተን
  rationale: ἀποσπάω የመነጠልን ወይም በከባድ ስሜት የመለየትን ኃይል ይይዛል፤ አማርኛው ዐውደ ንባቡን ሳያጋንን ይህን ያሳያል።
- source_word: ἀναχθῆναι
  choice: ወደ ባሕር ወጣን
  rationale: ቃሉ በባሕር ጉዞ አገባብ ‘መርከብ አስነስቶ ወደ ባሕር መውጣት’ ማለት ነው፤ ይህ አገላለጽ ትርጉሙን በግልጽ አማርኛ ይሰጣል።
- source_word: εὐθυδρομήσαντες
  choice: ቀጥታ ተጓዝን
  rationale: የመርከብ ጉዞው ቀጥተኛ መስመር መከተሉን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἤλθομεν εἰς
  choice: ወደ ... ደረስን
  rationale: በጉዞ ትረካ ውስጥ መድረስን በትክክልና በተፈጥሮ ያሳያል።
- source_word: Κῶ
  choice: ቆስ
  rationale: የግሪኩን Κῶ የስፍራ ስም በአማርኛ የመጽሐፍ ቅዱስ ስም አጻጻፍ ልማድ በቅርብ ይወክላል።
- source_word: τῇ δὲ ἑξῆς
  choice: በማግስቱም
  rationale: ‘በሚቀጥለው ቀን’ የሚለውን ትርጉም አጭርና ተፈጥሯዊ በሆነ አማርኛ ያስተላልፋል።
- source_word: Ῥόδον
  choice: ሮዶስ
  rationale: የግሪኩን የደሴት ስም በቀጥታ የሚወክል የተለመደ አማርኛ አጻጻፍ ነው።
- source_word: κἀκεῖθεν
  choice: ከዚያም
  rationale: καί እና ἐκεῖθεν የሚሰጡትን የተከታታይ ጉዞ ግንኙነት በአጭሩ ይጠብቃል።
- source_word: Πάταρα
  choice: ጳጥራ
  rationale: የቦታውን ስም በተለመደው የአማርኛ መጽሐፍ ቅዱስ አጻጻፍ ያቀርባል።
