  text: οὐκ ἄρα σὺ εἶ ὁ Αἰγύπτιος ὁ πρὸ τούτων τῶν ἡμερῶν ἀναστατώσας καὶ ἐξαγαγὼν εἰς τὴν ἔρημον τοὺς τετρακισχιλίους ἄνδρας τῶν σικαρίων;
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/038.yaml
  text: Then you are not the Egyptian who some days ago stirred up a revolt and led the four thousand men of the assassins out into the wilderness?[a]
translation:
  language: am
  text: እንግዲያስ፣ ከጥቂት ቀናት በፊት ዓመፅ ቀስቅሰህ የነፍሰ ገዳዮችን አራት ሺህ ሰዎች ወደ ምድረ በዳ የመራህ ግብፃዊው አንተ አይደለህምን?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የአጭር ሰይፍ ታጣቂዎች»፤ በግሪክኛ «ሲካሪዎች»። ይህ ስያሜ የተደበቀ አጭር ሰይፍ ተጠቅመው ግድያ በመፈጸም የታወቀ ቡድንን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἄρα
  choice: እንግዲያስ ... አንተ አይደለህም ማለት ነው?
  rationale: የአዛዡን ከጳውሎስ ግሪክኛ መናገር ተነስቶ የደረሰበትን ድምዳሜ በጥያቄ መልክ ያሳያል፤ «እንግዲያስ» ይህን የድምዳሜ ኃይል በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ὁ Αἰγύπτιος
  choice: ግብፃዊው
  rationale: መስተዋድዱ ለተናጋሪውና ለሰሚዎቹ የታወቀን የተወሰነ ሰው ያመለክታል፤ የአማርኛው «-ው» ይህን ውስንነት ያስተላልፋል።
- source_word: πρὸ τούτων τῶν ἡμερῶν
  choice: ከጥቂት ቀናት በፊት
  rationale: ሐረጉ ከአሁኑ ጊዜ ጥቂት ቀደም ብሎ የሆነን ነገር ያመለክታል፤ ይህ አተረጓጎም ጊዜውን ከልክ በላይ ሳይወስን በዘመናዊ አማርኛ ይገልጣል።
- source_word: ἀναστατώσας
  choice: ዓመፅ ቀስቅሶ
  rationale: በዚህ ፖለቲካዊና ታሪካዊ አውድ ግሱ ተራ ሁከትን ሳይሆን ሕዝባዊ ዓመፅን ማነሳሳት ያመለክታል።
- source_word: ἐξαγαγὼν
  choice: ወደ ... የመራው
  rationale: ቡድኑን ከአንድ ስፍራ ወደ ሌላ በመሪነት ማውጣቱን ይገልጣል፤ «የመራው» በአማርኛ ተፈጥሯዊ ሲሆን የመሪነት ሚናውንም ይጠብቃል።
- source_word: τὴν ἔρημον
  choice: ምድረ በዳ
  rationale: ሰው የማይኖርበትን ወይም በረሃማ አካባቢን ይጠቅሳል፤ «ምድረ በዳ» የአሸዋ በረሃ ብቻ እንደሆነ ሳያስገድድ ሰፊውን ትርጉም ይይዛል።
- source_word: τοὺς τετρακισχιλίους ἄνδρας
  choice: አራት ሺህ ሰዎችን
  rationale: ቁጥሩን በትክክል ያቆያል፤ በአማርኛ የዘር ሐረጉና ዐውዱ የተወሰነውን ቡድን ስለሚያሳዩ «አራቱን ሺህ» የሚል ያልተፈጥሯዊ አገላለጽ አላስፈለገም።
- source_word: τῶν σικαρίων
  choice: ከነፍሰ ገዳዮቹ
  rationale: σικάριοι የተደበቀ አጭር ሰይፍ በመጠቀም ግድያ ከሚፈጽሙ ሰዎች ጋር የተያያዘ መጠሪያ ነው፤ «ነፍሰ ገዳዮች» ትርጉሙን ለዘመናዊ አንባቢ በግልጽ ያስተላልፋል፣ ቃል በቃልና ታሪካዊ አማራጮቹም በማስታወሻ ተጠብቀዋል።
