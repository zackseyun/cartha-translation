  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ Παῦλος· Ἐγὼ ἄνθρωπος μέν εἰμι Ἰουδαῖος, Ταρσεὺς τῆς Κιλικίας, οὐκ ἀσήμου πόλεως πολίτης· δέομαι δέ σου, ἐπίτρεψόν μοι λαλῆσαι πρὸς τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/039.yaml
  text: But Paul said[a], “I am indeed a Jewish man, a citizen of Tarsus in Cilicia, of no insignificant city. And I beg you, permit me to speak to the people.”
translation:
  language: am
  text: ጳውሎስ ግን፣ “እኔ አይሁዳዊ ሰው ነኝ፤ በኪልቅያ ያለችው ተርሴስ የማትናቅ ከተማ ዜጋ ነኝ። እባክህ፣ ለሕዝቡ እንድናገር ፍቀድልኝ።” አለ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνθρωπος μέν εἰμι Ἰουδαῖος
  choice: እኔ አይሁዳዊ ነኝ
  rationale: በአማርኛ ራስን ለመግለጽ ተፈጥሯዊ የሆነውን አገላለጽ ይጠቀማል፤ ἄνθρωπος የሚለውን በተለየ ‘ሰው’ ብሎ መተርጎም እዚህ ያልተፈጥሯዊ ድግግሞሽ ይፈጥራል። μέν የሚሰጠው አጽንዖት በ‘እኔ’ ተንጸባርቋል።
- source_word: Ἰουδαῖος
  choice: አይሁዳዊ
  rationale: ጳውሎስ ከቂልቅያ መሆኑን ለብቻው ስለሚገልጽ፣ ቃሉ እዚህ የይሁዳ ክልል ነዋሪነትን ሳይሆን የዘርና የሃይማኖት ማንነቱን ያመለክታል።
- source_word: Ταρσεὺς τῆς Κιλικίας
  choice: በኪልቅያ ካለችው ከተርሴስ
  rationale: የከተማይቱንና የአውራጃውን ግንኙነት በዘመናዊ አማርኛ ግልጽ እና ተፈጥሯዊ አድርጎ ያቀርባል።
- source_word: οὐκ ἀσήμου πόλεως
  choice: ከማትናቅ ከተማ
  rationale: የግሪኩን የክደት አዎንታዊ አገላለጽ (‘የማትናቅ’) ሳያለሰልስ ይጠብቃል።
- source_word: πολίτης
  choice: ዜጋ
  rationale: ቃሉ ተራ ነዋሪነትን ሳይሆን ከከተማይቱ ጋር ያለውን የዜግነት ማንነት ያመለክታል።
- source_word: δέομαι δέ σου
  choice: እባክህ
  rationale: የልመናውን ጽናትና ትሕትና በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἐπίτρεψόν μοι λαλῆσαι
  choice: እንድናገር ፍቀድልኝ
  rationale: ለባለሥልጣኑ የቀረበውን የፈቃድ ጥያቄ በግልጽና ክብር ባለው አገላለጽ ይጠብቃል።
- source_word: πρὸς τὸν λαόν
  choice: ሕዝቡን
  rationale: λαός የሚለውን ‘ሕዝብ’ ብሎ ይተረጉማል፤ ‘መናገር’ ከቀጥተኛ ተሳቢ ጋር የሚሠራበት ተፈጥሯዊ የአማርኛ አገባብ ተመርጧል።
theological_decisions:
- issue: በዐውዱ ውስጥ የἸουδαῖος አተረጓጎም
  choice: አይሁዳዊ
  alternative: የይሁዳ ሰው
  rationale: ጳውሎስ የትውልድ ከተማውን በኪልቅያ ያለችው ተርሴስ ብሎ ለብቻው ይጠቅሳል። ስለዚህ Ἰουδαῖος እዚህ የክልል መነሻን ብቻ ሳይሆን የአይሁድ ማንነቱን ይገልጻል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የአማርኛ አገላለጽ ተመርጧል። የግሪኩ አወቃቀር ሁለት የተለያዩ የአማርኛ አተረጓጎሞችን የሚያስገድድ በቂ አሻሚነት ስለሌለው የእንግሊዝኛው ማስታወሻ ወደ አማርኛ አልተዘዋወረም።
