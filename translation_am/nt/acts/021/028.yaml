  text: እየጮኹ፣ “የእስራኤል ወንዶች ሆይ፣ እርዱ! በሕዝቡ፣ በሕጉና በዚህ ስፍራ ላይ በየቦታው ሁሉንም የሚያስተምረው ሰው ይህ ነው። ከዚህም በላይ ግሪኮችን እንኳ ወደ ቤተ መቅደሱ[a] አስገብቶ ይህን ቅዱስ ስፍራ አርክሷል” አሉ።
  philosophy: optimal-equivalence
  footnotes:
