  rationale: በእነርሱ ፈንታ ከስእለቱ ጋር የተያያዘውን ወጪ መሸፈን ማለት ነው።
- source_word: ἵνα ξυρήσονται τὴν κεφαλήν
  choice: ራሳቸውንም እንዲላጩ
  rationale: ἵνα የዓላማን ወይም የታሰበ ውጤትን ሐሳብ ይገልጣል፤ ነጠላው ‘ራስ’ በአማርኛ ለብዙ ሰዎች ተፈጥሯዊ በሆነ መልኩ ተሰጥቷል።
- source_word: ὧν κατήχηνται περὶ σοῦ
  choice: ስለ አንተ የሰሙት
  rationale: κατηχέω ‘ማስተማር’ ወይም ‘ማሳወቅ’ ሊል ይችላል፤ እዚህ ግን ስለ ጳውሎስ የተሰራጩ ወሬዎችን ስለሚመለከት ‘የሰሙት’ ተፈጥሯዊ ነው።
- source_word: οὐδέν ἐστιν
  choice: መሠረት እንደሌለው
  rationale: የተነገሩት ነገሮች እውነት ወይም በቂ መሠረት እንደሌላቸው የሚገልጠውን ፈሊጣዊ ኃይል ያስተላልፋል።
- source_word: στοιχεῖς καὶ αὐτὸς φυλάσσων τὸν νόμον
  choice: አንተ ራስህም ሕጉን እየጠበቅህ በሥርዓት እንደምትኖር
  rationale: στοιχέω በአንድ መስመር መሄድን፣ በተወሰነ ሥርዓት መኖርን ያመለክታል፤ φυλάσσων ደግሞ ሕጉን መጠበቅን በግልጽ ይጨምራል። ‘ራስህም’ የκαὶ αὐτόςን አጽንዖት ይጠብቃል።
