base_translation:
  language: en
  yaml_path: translation/nt/acts/021/024.yaml
  text: Take these men[a], purify yourself along with them, and pay their expenses so that they may shave their heads. Then everyone will know that there is nothing to the things they have been told about you[b], but that you yourself also are living in observance of the law.
translation:
  language: am
  text: እነዚህን ሰዎች ይዘህ ከእነርሱ ጋር ራስህን አንጻ፤ ራሳቸውንም እንዲላጩ ወጪያቸውን ክፈል። ከዚያም ስለ አንተ የሰሙት[a] ነገር ሁሉ ምንም እንዳልሆነ፣ አንተ ራስህም ሕጉን እየጠበቅህ በሥርዓት እንደምትኖር[b] ሁሉም ያውቃሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ስለ አንተ የተማሩት።” የግሪኩ ግስ “ማስተማር” ወይም በሰፊው “ማሳወቅ” ሊል ይችላል፤ በዚህ አውድ ስለ ጳውሎስ የተሰራጩ ዘገባዎችን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “በመስመር መሄድ”፤ ይህም ሕጉን ከመጠበቅ ጋር በሚስማማ መንገድ መኖር ማለት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτους παραλαβὼν
  choice: እነዚህን ሰዎች ይዘህ
  rationale: ተሳቢ አንቀጹ ከትእዛዙ ጋር የተያያዘ ሲሆን፣ ‘ሰዎች’ የሚለው በቀደመው ቁጥር የተጠቀሱትን አራት ሰዎች በግልጽ ያመለክታል።
- source_word: ἁγνίσθητι σὺν αὐτοῖς
