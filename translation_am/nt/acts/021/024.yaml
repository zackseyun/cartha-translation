  rationale: የሥርዓታዊ መንጻትን ያመለክታል፤ የአማርኛው መልስ የግስን ራስ-ተመላሽ ኃይልና σύνን ጠብቋል።
- source_word: δαπάνησον ἐπ’ αὐτοῖς
