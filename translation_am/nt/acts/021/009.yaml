  text: He had four unmarried daughters who were prophesying.
translation:
  language: am
  text: 'እርሱም ትንቢት የሚናገሩ አራት ያላገቡ[a] ሴት ልጆች ነበሩት።


    [a] ቃል በቃል፣ «አራት ድንግል ሴት ልጆች»።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ «አራት ድንግል ሴት ልጆች»።
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτῳ
  choice: እርሱም
  rationale: ቃሉ በቅርብ አውድ የተጠቀሰውን ፊልጶስን ያመለክታል፤ በአማርኛ የባለቤትነት አገላለጽ ከ«ነበሩት» ጋር ተፈጥሯዊ ነው።
- source_word: δὲ
  choice: -ም
  rationale: ለስላሳውን አያያዥና ቀጣይነት በአማርኛ በተፈጥሯዊ መንገድ ያሳያል።
- source_word: ἦσαν
  choice: ነበሩት
  rationale: የግሪኩን ለእርሱ መኖር የሚገልጽ አወቃቀር በተፈጥሯዊ የአማርኛ ባለቤትነት አገላለጽ ያቀርባል።
- source_word: θυγατέρες
  choice: ሴት ልጆች
  rationale: የቤተሰብ ዝምድናውን በግልጽና በተለመደ አማርኛ ያስተላልፋል።
- source_word: τέσσαρες
  choice: አራት
  rationale: ቁጥሩን በቀጥታ ያስተላልፋል።
- source_word: παρθένοι
  choice: ያላገቡ
  rationale: በዚህ አውድ ያሉበትን የጋብቻ ሁኔታ በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጻል፤ ይበልጥ ቀጥተኛው «ድንግል» የሚለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: προφητεύουσαι
  choice: ትንቢት የሚናገሩ
  rationale: የአሁን ጊዜ አድራጊ አንቀጹ የሚገልጸውን ቀጣይ ወይም ባሕርያዊ ተግባር ያሳያል።
theological_decisions:
- issue: παρθένοι የሚለው ቃል የሴቶቹን ሁኔታ ሲገልጽ
  choice: ያላገቡ
  alternative: ደናግል / ድንግል ሴት ልጆች
  rationale: ጥቅሱ የሴቶቹን ሁኔታና ትንቢት መናገራቸውን አብሮ ይጠቅሳል እንጂ በሁለቱ መካከል ሥነ መለኮታዊ ግንኙነት አይወስንም። «ያላገቡ» የማኅበራዊ ሁኔታውን በግልጽ ያቀርባል፤ «ድንግል» የሚለው ቀጥተኛ የቃል አማራጭ በማስታወሻ ተጠብቋል።
translation_notes:
