source:
  edition: SBLGNT
  text: τοῦτο οὖν ποίησον ὅ σοι λέγομεν· εἰσὶν ἡμῖν ἄνδρες τέσσαρες εὐχὴν ἔχοντες ⸀ἀφ’ ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/023.yaml
  text: 'Therefore do what we tell you: we have four men who are under a vow of their own[a][b].'
translation:
  language: am
  text: እንግዲህ የምንልህን ይህን አድርግ፤ እኛ ዘንድ ስእለት የገቡ[a][b] አራት ወንዶች አሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ስእለት ያላቸው»። የግሪኩ አገላለጽ ቃል በቃል «ስእለት ያላቸው» ይላል።
    reason: lexical_alternative
  - marker: b
    text: ሰፊው ዐውድ የናዝራዊነትን ዓይነት ስእለት ሊጠቁም ይችላል፤ ይህ ቁጥር ራሱ ግን «ስእለት» ብቻ ይላል።
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτο οὖν
  choice: እንግዲህ ... ይህን
  rationale: οὖν የሚያሳየውን ከቀደመው ንግግር የሚነሳ ድምዳሜ በ«እንግዲህ» ያስተላልፋል፤ τοῦτο ደግሞ ከትእዛዙ ጋር «ይህን» ተብሎ ተጠብቋል።
- source_word: ποίησον
  choice: አድርግ
  rationale: የነጠላ ሰው ቀጥተኛ ትእዛዝን በተፈጥሯዊና ግልጽ አማርኛ ያቀርባል።
- source_word: ὅ σοι λέγομεν
  choice: የምንነግርህን
  rationale: የዝምድና ሐረጉን የትእዛዙ ይዘት አድርጎ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: εἰσὶν ἡμῖν
  choice: እኛ ዘንድ ... አሉ
  rationale: የመኖር ግስና የተሳቢ ተውላጠ ስም ያለበትን የግሪክ አወቃቀር፣ ባለቤትነትን ሳያጋንን፣ በአማርኛ የተለመደው «እኛ ዘንድ ... አሉ» በሚለው ያቀርባል።
- source_word: ἄνδρες τέσσαρες
  choice: አራት ሰዎች
  rationale: በዐውዱ ወንዶችን የሚያመለክተውን ἀνήρ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ የግሪኩ ቁጥርም ተጠብቋል።
- source_word: εὐχὴν ἔχοντες
  choice: ስእለት ያለባቸው
  rationale: «ስእለት ያላቸው» ከሚለው ይልቅ በስእለቱ ሥር የመሆንን ቀጣይ ሁኔታ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἀφ’ ἑαυτῶν
  choice: በራሳቸው ላይ
  rationale: ስእለቱ በእነርሱ ላይ እንዳለ የሚገልጠውን አንጸባራቂ ሐረግ በቅርበት ይጠብቃል፤ ከግሪኩ በላይ ስእለቱን እንዴት እንደተሳሉ አይወስንም።
theological_decisions:
- issue: የስእለቱ ዓይነት
  choice: በዋናው ጽሑፍ «ስእለት» ብቻ ማለት
  alternative: «የናዝራዊነት ስእለት» ብሎ መግለጽ
  rationale: ሰፊው ዐውድ የናዝራዊነትን ዓይነት ስእለት ሊጠቁም ቢችልም፣ ይህ ቁጥር εὐχήν ማለትም «ስእለት» ብቻ ይላል። ስለዚህ ዋናው ጽሑፍ ከምንጩ በላይ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «እኛ ዘንድ» ትንሽ ክቡር ንባብ ሲኖረው በቤተ እምነት ውስጥ ያሉ ወንዶችን የሚያመለክተውን ግንኙነት ከባለቤትነት ይልቅ በተገቢው ሁኔታ ያሳያል።
