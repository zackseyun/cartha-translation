base_translation:
  language: en
  yaml_path: translation/nt/acts/021/034.yaml
  text: But some in the crowd were shouting one thing[a], and others another. Since he was not able to learn the facts because of the uproar[b], he ordered him to be brought into the barracks.
translation:
  language: am
  text: በሕዝቡ መካከል አንዳንዶች አንድ ነገር፣ ሌሎች ደግሞ ሌላ ነገር ይጮኹ ነበር። ሻለቃውም በሁከቱ ምክንያት እርግጡን ነገር[a] ማወቅ ስላልቻለ፣ ጳውሎስን ወደ ወታደሮች ሰፈር[b] እንዲወስዱት አዘዘ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የጉዳዩን እውነት” ወይም “በእርግጥ የሆነውን” ማለትም ሊሆን ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “የወታደሮች ሰፈር” የሚለው ምናልባት በቤተ መቅደሱ አካባቢ ከነበረው ምሽግ ጋር የተያያዘውን የሮማውያን ወታደሮች ማደሪያ ያመለክታል።
    reason: cultural_note
lexical_decisions:
- source_word: ἄλλοι δὲ ἄλλο τι ἐπεφώνουν
  choice: አንዳንዶች አንድ ነገር፣ ሌሎች ደግሞ ሌላ ነገር ይጮኹ ነበር
  rationale: የἄλλοι...ἄλλο τιን ተከፋፋይ ንፅፅርና የኢምፐርፌክት ግሱን ቀጣይ ጩኸት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐν τῷ ὄχλῳ
  choice: በሕዝቡ መካከል
  rationale: ὄχλοςን ያለ አስፈላጊ ያልሆነ የጥቃት ትርጉም በገለልተኛና ተፈጥሯዊ ቃል ይገልጣል።
- source_word: μὴ δυναμένου δὲ αὐτοῦ γνῶναι
  choice: ሻለቃውም … ማወቅ ስላልቻለ
  rationale: የጄኒቲቭ አብሶሉት አገባብን እንደ ምክንያት በተፈጥሯዊ አማርኛ ያቀርባል፤ በቅርብ አውድ ያለው የαὐτοῦ ተመላካች ሻለቃው በግልጽ ተጠቅሷል።
- source_word: τὸ ἀσφαλές
  choice: እርግጠኛውን ነገር
  rationale: በተቃራኒ ጩኸቶቹ መካከል በእርግጥ ሊታመንበት የሚችለውን መረጃ ያመለክታል፤ የቃሉ አሻሚነት በማስታወሻ ተጠብቋል።
- source_word: διὰ τὸν θόρυβον
  choice: በሁከቱ ምክንያት
  rationale: θόρυβος ተራ ድምፅን ብቻ ሳይሆን የተቀሰቀሰ ግርግርና ውዥንብርን ስለሚገልጥ “ሁከት” ከአውዱ ጋር ይስማማል።
- source_word: ἐκέλευσεν ἄγεσθαι αὐτὸν
  choice: ጳውሎስን … እንዲወስዱት አዘዘ
  rationale: የትእዛዙን ወሳኝነት ያስተላልፋል፤ በአማርኛ ሁለቱ ተውላጠ ስሞች እንዳያሻሙ የαὐτόν ተመላካች ጳውሎስ ከቅርብ አውድ በስም ተገልጿል።
- source_word: εἰς τὴν παρεμβολήν
  choice: ወደ ወታደሮች ሰፈር
  rationale: በዚህ አውድ παρεμβολή በቤተ መቅደሱ አቅራቢያ ያለውን የሮማውያን ወታደራዊ ማደሪያ ያመለክታል፤ “ሰፈር” ለዘመናዊ አንባቢ ግልጽ ነው።
