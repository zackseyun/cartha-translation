    reason: lexical_alternative
  - marker: b
    text: እዚህ «ቤተ መቅደስ» የሚለው የግሪክ ቃል የቤተ መቅደሱን ግቢና ሕንፃዎች በሙሉ ያመለክታል እንጂ ውስጠኛውን መቅደስ ብቻ አይደለም።
    reason: cultural_note
