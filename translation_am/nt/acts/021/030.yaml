  text: ከተማዋ በሙሉ ታወከች፤[a] ሕዝቡም ተሰባሰበ። ጳውሎስንም ይዘው ከቤተ መቅደሱ[b] ወደ ውጭ ጎትተው አወጡት፤ ወዲያውም በሮቹ[c] ተዘጉ።
  philosophy: optimal-equivalence
  footnotes:
