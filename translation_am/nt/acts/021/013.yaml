  text: በዚያን ጊዜ ጳውሎስ እንዲህ ሲል መለሰ፦ “እያለቀሳችሁና ልቤን እየሰበራችሁ[a] ምን እያደረጋችሁ ነው? እኔ ስለ ጌታ ኢየሱስ ስም[b] በኢየሩሳሌም ለመታሰር ብቻ ሳይሆን ለመሞትም ዝግጁ ነኝ።”
  philosophy: optimal-equivalence
