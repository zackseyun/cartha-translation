  yaml_path: translation/nt/acts/021/017.yaml
  text: When we arrived in Jerusalem[a], the brothers welcomed us gladly.
translation:
  language: am
  text: እኛም ወደ ኢየሩሳሌም በደረስን ጊዜ፣ ወንድሞቹ[a] በደስታ ተቀበሉን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወንድሞችና እህቶች።” የግሪኩ ቃል “ወንድሞች” ይላል፤ ነገር ግን በሰፊው አገባብ ሴቶችንም ጨምሮ አማኞችን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένων δὲ ἡμῶν
  choice: እኛም ... በደረስን ጊዜ
  rationale: የግሪኩ ገላጭ አገባብ የመድረሱን ጊዜና ከቀደመው ትረካ ጋር ያለውን ትስስር ያሳያል፤ ይህ አተረጓጎም በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: εἰς Ἱεροσόλυμα
  choice: ወደ ኢየሩሳሌም
  rationale: εἰς የመድረሻ አቅጣጫን ያመለክታል፤ ‘ወደ’ ከ‘ደረስን’ ጋር በአማርኛ ተፈጥሯዊ ነው።
- source_word: ἀσμένως
  choice: በደስታ
  rationale: ቃሉ ሰዎችን በደስታና በፈቃደኝነት መቀበልን ያመለክታል፤ ‘በደስታ’ ትርጉሙን በአጭሩ ያስተላልፋል።
- source_word: ἀπεδέξαντο
  choice: ተቀበሉን
  rationale: በዚህ አውድ ግሱ እንግዶችን በመልካም ሁኔታ መቀበልን ይገልጣል፤ የአማርኛው ‘ተቀበሉን’ ይህን በቀጥታና በተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: οἱ ἀδελφοί
  choice: ወንድሞች
  rationale: የግሪኩ ቃል በቅርጹ ወንድ ብዙ ቁጥር ነው፤ ሆኖም በጥንቱ ክርስቲያናዊ አጠቃቀም ሰፊውን የአማኞች ማኅበር ሊያመለክት ይችላል። ዋናው ጽሑፍ የምንጩን ቅርጽ ይጠብቃል፣ ሰፊው አገባብም በማስታወሻ ተገልጧል።
theological_decisions:
- issue: በኢየሩሳሌም ያለውን የክርስቲያኖች ማኅበር የሚያመለክተውን ἀδελφοί በጾታ ረገድ መተርጎም
  choice: ወንድሞች
  alternative: ወንድሞችና እኅቶች፤ አማኞች
  rationale: የግሪኩን ወንድ ብዙ ቁጥር ቅርጽ በዋናው ጽሑፍ ማቆየት ለምንጩ ታማኝ ነው። ቃሉ ሴቶችንም ያካተተ የአማኞች ማኅበር ሊያመለክት የሚችልበት አገባብ ስላለ፣ ያ አማራጭ በእግር ማስታወሻ ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። ‘እኛም’ የድርጊቱን ቀጣይነት ያሳያል፤ ‘በደስታ ተቀበሉን’ ደግሞ የምንጩን ሞቅ ያለ አቀባበል ያለ ተጨማሪ ትርጓሜ ያስተላልፋል።
