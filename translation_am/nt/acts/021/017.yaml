    issue: The main text omits the definiteness conveyed by οἱ (“the”) in οἱ ἀδελφοί.
    rationale: Using “ወንድሞቹ” more closely represents the identifiable Jerusalem believers referred to in the Greek.
  - severity: low
    issue: The footnote uses the less standard spelling “እኅቶች.”
    rationale: For modern standard Amharic, “እህቶች” is preferred.
