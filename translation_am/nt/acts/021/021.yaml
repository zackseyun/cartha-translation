base_translation:
  language: en
  yaml_path: translation/nt/acts/021/021.yaml
  text: But they have been informed about you that you are teaching all the Jews among the Gentiles to forsake Moses[c][b][a], telling them not to circumcise their children nor to walk according to the customs.
translation:
  language: am
  text: ነገር ግን በአሕዛብ መካከል የሚኖሩትን አይሁድ ሁሉ፣ ልጆቻቸውን እንዳይገርዙና በልማዶች መሠረት እንዳይኖሩ[c] እየነገርክ፣ ሙሴን እንዲተዉ[a][b] ታስተምራለህ ተብሎ ስለ አንተ ተነግሯቸዋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከሙሴ እንዲከዱ ታስተምራለህ።” የግሪኩ ἀποστασία የሚለው ስም መክዳትን፣ መራቅን ወይም መተውን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: እዚህ “ሙሴ” የሙሴን ሕግና ከቀድሞ የተወረሱትን የአይሁድ ልማዶች ወክሎ ተጠቅሷል።
    reason: cultural_note
  - marker: c
    text: ወይም፣ “በልማዶች መሠረት እንዳይመላለሱ።”
    reason: lexical_alternative
