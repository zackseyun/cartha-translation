  choice: ሙሴን እንዲተዉ
  rationale: ἀποστασία መተውን ወይም መክዳትን ያመለክታል። በግስ መተርጎሙ የክሱን ኃይል በግልጽ አማርኛ ይገልጣል፤ ‘ሙሴ’ የሙሴን ሕግና የአይሁድን የቀድሞ ልማድ ወክሎ ቀርቧል።
- source_word: τοὺς κατὰ τὰ ἔθνη πάντας Ἰουδαίους
