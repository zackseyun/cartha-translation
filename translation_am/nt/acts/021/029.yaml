base_translation:
  language: en
  yaml_path: translation/nt/acts/021/029.yaml
  text: For they had previously seen Trophimus the Ephesian in the city with him[a], and they supposed that Paul had brought him into the temple.
translation:
  language: am
  text: ከዚህ በፊት ኤፌሶናዊውን ጥሮፊሞስን ከእርሱ ጋር በከተማው ውስጥ አይተውት ነበርና፤ ጳውሎስ ወደ ቤተ መቅደሱ[a] አስገብቶታል ብለው ገመቱ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: እዚህ «ቤተ መቅደስ» ተብሎ የተተረጎመው የግሪክኛ ቃል የውስጠኛውን መቅደስ ብቻ ሳይሆን፣ በአጠቃላይ የቤተ መቅደሱን ግቢና አደባባዮች ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν γὰρ προεωρακότες
  choice: ከዚህ በፊት ... አይተውት ነበርና
  rationale: የἦσαν ከፍጹም ቦዝ አንቀጽ προεωρακότες ጋር ያለው ጥምረት ከተከተለው ግምት በፊት የተፈጸመ ማየትን ያመለክታል፤ γάρ ደግሞ በ«ነበርና» ምክንያታዊ ግንኙነቱን ጠብቋል።
- source_word: Τρόφιμον τὸν Ἐφέσιον
  choice: ኤፌሶናዊውን ጥሮፊሞስን
  rationale: Ἐφέσιον የጥሮፊሞስን የትውልድ ወይም የመጣበትን ከተማ የሚለይ ቅጽል ስለሆነ፣ በተፈጥሯዊ አማርኛ «ኤፌሶናዊውን» ተብሏል።
- source_word: ἐν τῇ πόλει σὺν αὐτῷ
  choice: ከእርሱ ጋር በከተማው ውስጥ
  rationale: σὺν αὐτῷ በዐውዱ ጳውሎስን ያመለክታል፤ πόλις ደግሞ ከቤተ መቅደሱ ግቢ የተለየውን የኢየሩሳሌም ከተማ ያመለክታል።
- source_word: ἐνόμιζον
  choice: መሰላቸው
  rationale: ቃሉ በእውነተኛ እውቀት ሳይሆን ባዩት ነገር ላይ የተመሠረተ ግምትን ያሳያል፤ «መሰላቸው» ይህን ልዩነት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: εἰς τὸ ἱερὸν
  choice: ወደ ቤተ መቅደሱ
  rationale: ἱερόν ከውስጠኛው መቅደስ ብቻ ይልቅ መላውን የቤተ መቅደስ ግቢ ሊያመለክት ይችላል፤ ዋናው ጽሑፍ የተለመደውን «ቤተ መቅደስ» ሲጠቀም ይህ ስፋት በማስታወሻ ተገልጧል።
- source_word: εἰσήγαγεν
  choice: ያስገባው
  rationale: ቃሉ አንድን ሰው ወደ ውስጥ መውሰድን ወይም ማስገባትን ያመለክታል፤ በአማርኛ «ያስገባው» የቀደመውን ድርጊትና የክሱን ባሕርይ በግልጽ ያሳያል።
theological_decisions:
- issue: ἱερόν በጳውሎስ ላይ ከቀረበው ክስ ጋር ያለው ትርጉም
  choice: በዋናው ጽሑፍ «ቤተ መቅደሱ» ተብሎ፣ የግቢው ሰፊ ትርጉም በማስታወሻ ተገለጠ።
  alternative: «ወደ ቤተ መቅደሱ ግቢ» ወይም «ወደ ቤተ መቅደሱ አደባባዮች»
  rationale: ይህ ምርጫ ጽሑፉን ተፈጥሯዊ አድርጎ ሲያቆይ፣ ἱερόν የውስጠኛውን መቅደስ ብቻ ሳይሆን ሰፊውን ቅዱስ ግቢ ሊያመለክት የሚችለውን ታሪካዊ ጥራት አያጠፋም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። «መሰላቸው» የግምትን ባሕርይ ይጠብቃል፤ «ነበርና» የγάρን ማብራሪያዊ ኃይል በተፈጥሯዊ ሁኔታ ያሳያል።
