  text: ζητούντων ⸀τε αὐτὸν ἀποκτεῖναι ἀνέβη φάσις τῷ χιλιάρχῳ τῆς σπείρης ὅτι ὅλη ⸀συγχύννεται Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/031.yaml
  text: And as they were seeking to kill him[b][a], a report went up to the commander of the cohort that all Jerusalem was in an uproar.
translation:
  language: am
  text: እነርሱም እርሱን ለመግደል እየሞከሩ ሳሉ፣ ኢየሩሳሌም ሁሉ እየታወከች መሆኑ[a] ዜና ወደ ጭፍራው አዛዥ[b] ደረሰ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በሁከት ውስጥ መሆኗ” ወይም “ግራ ተጋብታ መሆኗ።”
    reason: lexical_alternative
  - marker: b
    text: “የጭፍራው አዛዥ” የሚለው በዚያ የሰፈረውን የሮማ ወታደራዊ ክፍል የሚመራ ከፍተኛ መኮንንን ያመለክታል።
    reason: cultural_note
lexical_decisions:
- source_word: ζητούντων τε
  choice: እየሞከሩ ሳሉ
  rationale: የግሪኩ የአሁን ጊዜ ቦዝ አንቀጽ ከዋናው ድርጊት ጋር በአንድ ጊዜ የቀጠለ ሙከራን ያሳያል፤ ይህ አገላለጽም በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: αὐτὸν ἀποκτεῖναι
  choice: እርሱን ለመግደል
  rationale: ἀποκτείνω በቀጥታ ‘መግደል’ ማለት ስለሆነ ግልጽና ተራ አማርኛ ተመርጧል።
- source_word: ἀνέβη φάσις
  choice: ወሬ ... ደረሰ
  rationale: ቃል በቃል ‘ወሬ ወጣ’ የሚለው ወደ ላይ ወዳለው ምሽግ የመንቀሳቀስ ምስል ቢኖረውም፣ ‘ወሬ ደረሰ’ በአማርኛ ትርጉሙን በግልጽና ተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: τῷ χιλιάρχῳ τῆς σπείρης
  choice: ወደ ጭፍራው አዛዥ
  rationale: χιλίαρχος የሮማ ከፍተኛ ወታደራዊ አዛዥን፣ σπεῖρα ደግሞ በእርሱ ሥር ያለውን ወታደራዊ ክፍል ያመለክታሉ። ‘ጭፍራው አዛዥ’ ታሪካዊ ልዩነቱን ሳያጠፋ ለአንባቢ ግልጽ ነው።
- source_word: ὅτι ὅλη Ἰερουσαλήμ
  choice: ኢየሩሳሌም ሁሉ
  rationale: የከተማይቱን ሕዝብ በከተማይቱ ስም የሚጠራውን የግሪኩን አጭር ምሳሌያዊ አገላለጽ ይጠብቃል።
- source_word: συγχύννεται
  choice: በሁከት እንደተነሣች
  rationale: ግሱ ግራ መጋባትን፣ መታወክን ወይም ሕዝባዊ ሁከትን ሊያመለክት ይችላል። በትረካው የሕዝብ ብጥብጥ አውድ ‘በሁከት ተነሣች’ ተፈጥሯዊ ነው፤ ሌሎቹ የቃሉ አማራጮች በማስታወሻ ተጠብቀዋል።
