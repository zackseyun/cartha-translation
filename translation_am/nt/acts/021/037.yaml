source:
  edition: SBLGNT
  text: Μέλλων τε εἰσάγεσθαι εἰς τὴν παρεμβολὴν ὁ Παῦλος λέγει τῷ χιλιάρχῳ· Εἰ ἔξεστίν μοι εἰπεῖν ⸀τι πρὸς σέ; ὁ δὲ ἔφη· Ἑλληνιστὶ γινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/037.yaml
  text: As Paul was about to be brought into the barracks[a], he said to the tribune, “Is it permitted for me to say something to you?” And he said[c][b], “Do you know Greek?”
translation:
  language: am
  text: 'ጳውሎስም ወደ ወታደሮቹ ሰፈር[a] ሊወሰድ ሲል፣ የጦር አዛዡን[b]፣ “አንድ ነገር ልናገርህ ይፈቀድልኛልን?”[c] አለው። እርሱም፣ “ግሪክኛ ታውቃለህን?” አለው።


    [a] “የወታደሮቹ ሰፈር” የሮም ወታደሮች የሚቀመጡበትን ስፍራ ያመለክታል፤ በዚህ ስፍራ ምናልባት በምሽጉ ውስጥ ያለው የወታደሮች መኖሪያ ነው።

    [b] የግሪክኛው ቃል በሮም ሠራዊት ውስጥ በተለምዶ አንድ ኮሆርት ያህል ወታደሮችን የሚመራ መኮንንን ያመለክታል፤ ቃል በቃል “የሺህ አለቃ” ሊባል ይችላል።

    [c] ወይም በተለመደ አነጋገር፣ “አንድ ነገር ልናገርህ?”'
  philosophy: optimal-equivalence
  footnotes:
