lexical_decisions:
- source_word: Μέλλων τε εἰσάγεσθαι
  choice: ሊወሰድ ሲል
  rationale: μέλλω የድርጊቱን መቃረብ ያሳያል፤ የεἰσάγεσθαι ተደራጊ ቅርጽም “ሊወሰድ” በሚለው ተጠብቋል።
- source_word: παρεμβολή
  choice: የወታደሮቹ ሰፈር
  rationale: በኢየሩሳሌም የተገለጸው የሮም ወታደሮች መኖሪያና የጦር ስፍራ ነው፤ “ሰፈር” ለዘመናዊ አንባቢ ግልጽ ሲሆን ዐውዱንም ይጠብቃል።
- source_word: χιλίαρχος
  choice: የጦር አዛዥ
  rationale: ቃሉ የሮም ከፍተኛ የጦር መኮንንን ያመለክታል። “የጦር አዛዥ” ተግባሩን በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ቃል በቃል አማራጩ በማስታወሻ ተጠብቋል።
- source_word: Εἰ ἔξεστίν μοι εἰπεῖν τι πρὸς σέ
  choice: አንድ ነገር ልናገርህ ይፈቀድልኛልን?
  rationale: ἔξεστιν ፈቃድን ወይም መፈቀድን ይገልጣል። ትርጉሙ የግሪክኛውን ጨዋ የፈቃድ ጥያቄ ሳያጠፋ በአማርኛ ግልጽ ነው።
- source_word: τι
  choice: አንድ ነገር
  rationale: በዚህ ዐውድ ያልተወሰነው ተውላጠ ስም “አንድ ነገር” የሚል ተፈጥሯዊ ፍቺ አለው።
- source_word: Ἑλληνιστί γινώσκεις
  choice: ግሪክኛ ታውቃለህን?
  rationale: Ἑλληνιστί “በግሪክኛ” ማለት ሲሆን γινώσκεις በቋንቋ ዐውድ “ታውቃለህ” ተብሎ በተፈጥሯዊና በቅርብ መንገድ ይተረጎማል።
