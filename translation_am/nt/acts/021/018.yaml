  rationale: ‘ሽማግሌዎቹ’ የቃሉን መሠረታዊ ትርጉምና የአመራር ሚና ይጠብቃል፤ የተለየ የኋለኛ ዘመን ቤተ እምነታዊ መዋቅር አይወስንም።
