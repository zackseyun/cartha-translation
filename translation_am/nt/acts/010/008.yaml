  yaml_path: translation/nt/acts/010/008.yaml
  text: And after explaining everything to them, he sent them to Joppa.
translation:
  language: am
  text: ሁሉንም ነገር ከገለጸላቸው በኋላ፣ ወደ ኢዮጴ ላካቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξηγησάμενος
  choice: ከገለጸላቸው በኋላ
  rationale: የአዮሪስት መካከለኛ አካፋይ ግስ ከዋናው ግስ በፊት የተፈጸመን ድርጊት ያሳያል። «ከገለጸላቸው በኋላ» ይህን ጊዜያዊ ቅደም ተከተልና ጉዳዩን በሙሉ የማስረዳት ሐሳብ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἅπαντα
  choice: ሁሉንም ነገር
  rationale: የገለጸው ነገር አጠቃላይና ሙሉ መሆኑን ያሳያል፤ «ሁሉንም ነገር» በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: αὐτοῖς
  choice: -ላቸው
  rationale: ተዘዋዋሪ ተሳቢውን «ለእነርሱ» በግሱ ላይ በተያያዘ ተፈጥሯዊ የአማርኛ ቅርጽ ይገልጻል።
- source_word: ἀπέστειλεν
  choice: ላካቸው
  rationale: ቀላል አዮሪስት ዋና ግስ ሲሆን «ላካቸው» ድርጊቱንና ብዙ ቁጥር ተሳቢውን በግልጽ ሁኔታ ያስተላልፋል።
- source_word: εἰς τὴν Ἰόππην
  choice: ወደ ኢዮጴ
  rationale: εἰς ወደ መድረሻ የሚደረግን እንቅስቃሴ ያመለክታል፤ «ወደ» ተፈጥሯዊ አቻው ነው። Ἰόππη በተለመደው የአማርኛ የመጽሐፍ ቅዱስ ስም «ኢዮጴ» ተጽፏል።
theological_decisions: []
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር አማርኛ ተጠቅሟል። የግሪኩ አካፋይ ግስ የሚያሳየው የጊዜ ቅደም ተከተል «ከ…በኋላ» በሚለው አወቃቀር ተጠብቋል።
