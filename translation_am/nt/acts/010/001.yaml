  source_fidelity: The draft correctly identifies Cornelius, Caesarea, his rank as a centurion, and the unit designation. However, the main text expands σπεῖρα to “Roman military unit” while simultaneously rendering the designation as “Italian troop,” which obscures the precise named-unit relationship in the Greek. The cultural footnote also expresses the historical inference too strongly.
