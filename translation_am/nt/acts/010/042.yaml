  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ παρήγγειλεν ἡμῖν κηρύξαι τῷ λαῷ καὶ διαμαρτύρασθαι ὅτι ⸀οὗτός ἐστιν ὁ ὡρισμένος ὑπὸ τοῦ θεοῦ κριτὴς ζώντων καὶ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/042.yaml
  text: And he commanded us to proclaim to the people and to testify solemnly that this is the one appointed by God as judge of the living and the dead[a].
translation:
  language: am
  text: እርሱም ለሕዝቡ እንድንሰብክና እርሱ የሕያዋንና የሙታን ዳኛ እንዲሆን በእግዚአብሔር የተሾመው መሆኑን በጥብቅ እንድንመሰክር አዘዘን።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እርሱ የሕያዋንና የሙታን ዳኛ አድርጎ በእግዚአብሔር የተወሰነው ነው።»
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήγγειλεν
  choice: አዘዘን
  rationale: ግሡ ሥልጣን ያለውን ትእዛዝ ያመለክታል፤ «አዘዘን» ይህን ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: κηρύξαι
  choice: እንድንሰብክ
  rationale: ቃሉ በአደባባይ ማወጅን ያመለክታል፤ «መስበክ» በዘመናዊ የመጽሐፍ ቅዱስ አማርኛ ግልጽና የተለመደ ነው።
- source_word: τῷ λαῷ
  choice: ለሕዝቡ
  rationale: የግሪኩን የተወሰነ ቅርጽ ይጠብቃል፤ አውዱ የእስራኤልን ሕዝብ ቢያመለክትም በጥቅሱ ያልተጠቀሰው «እስራኤል» አልተጨመረም።
- source_word: διαμαρτύρασθαι
  choice: በጥብቅ እንድንመሰክር
  rationale: «መመስከር» የምስክርነቱን ሐሳብ፣ «በጥብቅ» ደግሞ የንግግሩን ከባድነትና አጽንዖት ያሳያል።
- source_word: οὗτός
  choice: እርሱ
  rationale: አመልካቹ ኢየሱስን በአጽንዖት ይጠቁማል፤ «እርሱ» በአማርኛ ተፈጥሯዊ ሆኖ አጽንዖቱን ይጠብቃል።
- source_word: ὁ ὡρισμένος
  choice: የሾመው
  rationale: ፍጹም ተደራጊ አካፋዩ በእግዚአብሔር ተሹሞ ያለውን ቀጣይ ሁኔታ ያሳያል፤ «የሾመው» ግልጽና የተፈጥሮ አማርኛ ነው።
- source_word: ὑπὸ τοῦ θεοῦ
  choice: እግዚአብሔር
  rationale: በተደራጊው ግስ ውስጥ የድርጊቱን አድራጊ በቀጥታ ይገልጻል።
- source_word: κριτὴς
  choice: ዳኛ
  rationale: የፍርድ ሥልጣን ያለውን ሰው በግልጽና በዘመናዊ አማርኛ ይገልጻል።
- source_word: ζώντων καὶ νεκρῶν
  choice: በሕይወት ባሉትና በሞቱት ላይ
  rationale: የክርስቶስ የፍርድ ሥልጣን ሕያዋንንና ሙታንን ሁሉ እንደሚያካትት በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: ኢየሱስ ለፍርድ በእግዚአብሔር መሾሙ
  choice: በሕይወት ባሉትና በሞቱት ላይ ዳኛ እንዲሆን እግዚአብሔር የሾመው
  alternative: የሕያዋንና የሙታን ዳኛ አድርጎ እግዚአብሔር የወሰነው
  rationale: ጥቅሱ ኢየሱስ በእግዚአብሔር የተሾመ ሁሉን አቀፍ ዳኛ መሆኑን ይናገራል። ትርጉሙ ይህን በግልጽ ይጠብቃል፤ በኋላ የተቀመሩ የትምህርት ቃላትን ግን አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ሕዝቡ» የግሪኩን ገደብ ይጠብቃል፤ «በጥብቅ እንድንመሰክር» ደግሞ የδιαμαρτύρασθαιን ከባድ አጽንዖት ይይዛል።
