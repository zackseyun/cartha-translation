  text: τοῦ δὲ Πέτρου διενθυμουμένου περὶ τοῦ ὁράματος εἶπεν ⸂αὐτῷ τὸ πνεῦμα⸃· Ἰδοὺ ⸀ἄνδρες ⸀ζητοῦντές σε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/019.yaml
  text: While Peter was still pondering the vision, the Spirit said to him, “Look, men are seeking you.”
translation:
  language: am
  text: ጴጥሮስ ስለ ራእዩ እያሰላሰለ ሳለ፣ መንፈስ፣ “እነሆ፣ ወንዶች ይፈልጉሃል[a]” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እየፈለጉህ ናቸው።”
    reason: lexical_alternative
lexical_decisions:
- source_word: διενθυμουμένου
  choice: እያሰላሰለ ሳለ
  rationale: ቃሉ በልቡ ውስጥ በጥልቅና በቀጣይነት ማሰብን ያመለክታል፤ ይህ አገላለጽ የግሪኩን ቀጣይ ድርጊት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: περὶ τοῦ ὁράματος
  choice: ስለ ራእዩ
  rationale: የጴጥሮስ ማሰላሰል ርዕስ ራእዩ መሆኑን በግልጽ ያሳያል።
- source_word: τὸ πνεῦμα
  choice: መንፈስ
  rationale: በሐዋርያት ሥራ 10 ዐውድ የሚናገረው መለኮታዊው መንፈስ ነው፤ ግሪኩ በዚህ ቦታ ἅγιον ስላልጨመረ፣ ‘ቅዱስ’ አልተጨመረም።
- source_word: εἶπεν αὐτῷ
  choice: አለው
  rationale: ቀጥተኛ፣ አጭርና ተፈጥሯዊ የአማርኛ አተረጓጎም ነው።
- source_word: Ἰδοὺ
  choice: እነሆ
  rationale: ትኩረትን የሚስበውን የግሪክ የንግግር ምልክት በክቡርና በተለመደ የመጽሐፍ ቅዱስ አማርኛ ይገልጻል።
- source_word: ἄνδρες
  choice: ወንዶች
  rationale: ἀνήρ በዚህ ዐውድ አዋቂ ወንዶችን እንጂ በአጠቃላይ ሰዎችን አያመለክትም፤ ስለዚህ የፆታው ልዩነት ተጠብቋል።
- source_word: ζητοῦντές σε
  choice: ይፈልጉሃል
  rationale: ζητέω አንድን ሰው ለማግኘት መፈለግን ያመለክታል፤ ምርጫው ቀጥተኛና በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
theological_decisions:
- issue: የτὸ πνεῦμα ማጣቀሻ
  choice: ‘መንፈስ’ በጴጥሮስ የሚናገረውን ቅዱስ መንፈስ ያመለክታል።
  alternative: ግልጽ ያልሆነ መንፈሳዊ ስሜት ወይም ማነሳሳት
  rationale: በሐዋርያት ሥራ 10 ትረካ ውስጥ የአሕዛብን ተልእኮ የሚመራው መለኮታዊው መንፈስ ነው። ሆኖም ግሪኩ በዚህ ቁጥር ‘ቅዱስ’ ስለማይል፣ ትርጉሙም አልጨመረውም።
- issue: የἄνδρες ፆታዊ ትርጉም
  choice: ወንዶች
  alternative: ሰዎች / ጎብኚዎች
  rationale: የግሪኩ ቃል በተለይ ወንድ ሰዎችን ይጠቅሳል፤ ጾታ-ገለልተኛ ቃል መጠቀም ይህን የምንጩን ዝርዝር ያጠፋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር አማርኛ ተጠቅሟል። ‘እነሆ’ የἸδοὺን ትኩረት ሰጪ ኃይል ይጠብቃል፤ ‘እያሰላሰለ ሳለ’ ደግሞ በግሪኩ ያለውን ቀጣይ ድርጊት ‘ገና’ የሚል ያልተገለጸ ቃል ሳይጨምር ያሳያል።
