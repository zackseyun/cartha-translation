  text: καὶ ⸀ἡμεῖς μάρτυρες πάντων ὧν ἐποίησεν ἔν τε τῇ χώρᾳ τῶν Ἰουδαίων ⸀καὶ Ἰερουσαλήμ· ὃν καὶ ἀνεῖλαν κρεμάσαντες ἐπὶ ξύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/039.yaml
  text: And we are witnesses of all that he did both in the land of the Jews and in Jerusalem[a]. They also put him to death by hanging him on a tree.
translation:
  language: am
  text: እኛም በአይሁድ አገርና በኢየሩሳሌም ያደረገውን ሁሉ ምስክሮች ነን። እርሱንም በዛፍ[a] ላይ ሰቅለው ገደሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በእንጨት ላይ”፤ ትርጓሜያዊ አተረጓጎም “በመስቀል ላይ” ሊሆን ይችላል። የግሪክኛው ቃል “ዛፍ” ወይም “እንጨት” ማለት ሲሆን፣ ዘዳግም 21፥23ን የሚያስተጋባ ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυρες
  choice: ምስክሮች
  rationale: የዓይን ምስክርነትንና ስለታየው ነገር መመስከርን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: πάντων ὧν ἐποίησεν
  choice: ስላደረገው ሁሉ
  rationale: የπάντωνን ሁሉን አቀፍ ኃይል ጠብቆ በአማርኛ ለ‘ምስክሮች ነን’ ተፈጥሯዊ ማሟያ ይሆናል።
- source_word: ἔν τε τῇ χώρᾳ τῶν Ἰουδαίων
  choice: በአይሁድ አገር
  rationale: χώραን እንደ አገር/ክልል ያቀርባል፤ የሮምን አውራጃ በግልጽ ሳይጨምር የግሪክኛውን የባለቤትነት አገባብ ይጠብቃል።
- source_word: καὶ Ἰερουσαλήμ
  choice: እና በኢየሩሳሌም
  rationale: በግሪክኛው ያልተደገመውን መስተዋድድ በአማርኛ ለግልጽነት ይደግማል።
- source_word: ἀνεῖλαν
  choice: ገደሉት
  rationale: ቃሉ በዚህ አውድ ‘ገደሉት/ለሞት ዳረጉት’ ማለት ነው፤ ‘ገደሉት’ ቀጥተኛና ዘመናዊ ነው።
- source_word: κρεμάσαντες
  choice: ሰቅለው
  rationale: የግሪክኛውን የተውሳከ ግስ ከዋናው ግስ ጋር በተፈጥሯዊ የአማርኛ ቅደም ተከተል ያገናኛል።
- source_word: ἐπὶ ξύλου
  choice: በዛፍ ላይ
  rationale: ξύλον ዛፍን ወይም እንጨትን ሊያመለክት ይችላል። ‘በዛፍ ላይ’ የቃሉን ምስልና ከዘዳግም 21፥23 ጋር ሊኖረው የሚችለውን ድምፅ ይጠብቃል፤ ‘መስቀል’ የሚለውን ትርጓሜ በዋናው ጽሑፍ አያስገባም።
theological_decisions:
- issue: በስቅለት አውድ ውስጥ ξύλουን መተርጎም
  choice: በዛፍ ላይ
  alternative: በእንጨት ላይ፤ በመስቀል ላይ
  rationale: ምንጩ σταυρός ሳይሆን ξύλον ይጠቀማል። ‘ዛፍ’ የቃሉን ምርጫና ከዘዳግም 21፥23 ጋር ሊኖረው የሚችለውን ጥቅስ ይጠብቃል፤ ‘መስቀል’ ማለት የምንጩን አሻሚነት በትርጓሜ ይወስናል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘እኛም’ እና ‘እነርሱም’ የκαίን አገናኝ ኃይል ያሳያሉ። የግርጌ ማስታወሻው ስለ ξύλον ስለሆነ ምልክቱ ከ‘ሰቅለው’ ቀጥሎ ተቀምጧል።
