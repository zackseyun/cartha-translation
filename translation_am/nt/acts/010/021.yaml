- source_word: τίς ἡ αἰτία δι’ ἣν πάρεστε
  choice: ለምን መጣችሁ?
  rationale: ቃል በቃል ‘የተገኛችሁበት ምክንያት ምንድን ነው?’ የሚለውን ሐሳብ በዐውዱ ተፈጥሯዊ በሆነ አማርኛ ያቀርባል፤ የአማራጭ ቃል በቃል አቀራረብ በማስታወሻው ተጠብቋል።
