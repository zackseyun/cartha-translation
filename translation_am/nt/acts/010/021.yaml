  verdict: revise
  source_fidelity: The draft correctly represents Peter's descent, his self-identification, and the question's basic intent. However, ወደ ሰዎቹ can be understood as “to his men,” whereas τοὺς ἄνδρας refers to the particular men who had come. The main question is idiomatic, but adding እዚህ better expresses πάρεστε (“are present/here”).
  naturalness: The revised wording is natural, clear modern standard Amharic while retaining a dignified biblical register. እነሆ is an established and intelligible scriptural discourse marker.
  terminology: ጴጥሮስ, እነሆ, and the identification clause are appropriate. Replacing the potentially possessive ሰዎቹ with እነዚያ ሰዎች removes an unintended relationship implication.
  issues:
  - severity: medium
    issue: The phrase ወደ ሰዎቹ is potentially possessive.
    rationale: The suffix -ቹ may naturally be read as “his men.” The Greek definite article identifies the already-mentioned visitors, not men belonging to Peter.
  - severity: low
    issue: The main question omits the explicit present-location nuance of πάρεστε.
    rationale: መጣችሁ is acceptable contextually, but እዚህ makes the question more closely match “Why are you here?” without making the Amharic unnatural.
  revised_text: ጴጥሮስም ወደ እነዚያ ሰዎች ወርዶ፣ “እነሆ፣ የምትፈልጉት እኔ ነኝ። ለምን እዚህ መጣችሁ?” አላቸው።[a]
