- source_word: ἐν ἐσθῆτι λαμπρᾷ
  choice: የሚያንጸባርቅ ልብስ የለበሰ
  rationale: ἐσθής የልብስን፣ λαμπρόςም ብሩህነትን ወይም አንጸባራቂነትን ያመለክታሉ፤ ይህ አገላለጽ ምስላዊ ኃይሉን በግልጽ አማርኛ ይጠብቃል።
