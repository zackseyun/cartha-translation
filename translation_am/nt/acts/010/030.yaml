  choice: እንዲህ አለ
  rationale: የትረካውን ያለፈ ጊዜ የንግግር መግቢያ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: Ἀπὸ τετάρτης ἡμέρας μέχρι ταύτης τῆς ὥρας
  choice: ከአራት ቀን በፊት በዚህኑ ሰዓት
  rationale: ንግግሩ ከአራት ቀን በፊት የነበረውን ተመሳሳይ የቀን ሰዓት እንደሚጠቁም በተፈጥሯዊ አማርኛ ያሳያል፤ የግሪኩን ጊዜያዊ አገላለጽ ከመጠን በላይ ቃል በቃል አያደርገውም።
- source_word: ἤμην ... προσευχόμενος
  choice: እየጸለይሁ ነበር
  rationale: በያለፈ ጊዜ ቀጥሎ የነበረውን ድርጊት የግሪኩን ዙሪያዊ ያልተፈጸመ ግስ በትክክልና በተፈጥሯዊነት ይገልጻል።
- source_word: τὴν ἐνάτην
  choice: በዘጠነኛው ሰዓት
  rationale: የምንጩን የሰዓት አቆጣጠር በዋናው ጽሑፍ ይጠብቃል፤ ዘመናዊው አቻ በማስታወሻ ተገልጿል።
- source_word: ἐν τῷ οἴκῳ μου
  choice: በቤቴ
