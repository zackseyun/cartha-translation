base_translation:
  language: en
  yaml_path: translation/nt/acts/010/030.yaml
  text: And Cornelius said, “Four days ago, up to this hour, I was praying at the ninth hour in my house, and behold, a man stood before me in bright clothing.”
translation:
  language: am
  text: ቆርኔሌዎስም እንዲህ አለ፤ “ከአራት ቀናት በፊት በዚህኑ ሰዓት፣ በዘጠነኛው ሰዓት[a] በቤቴ እየጸለይሁ ነበር፤ እነሆም፣ የሚያንጸባርቅ ልብስ የለበሰ አንድ ሰው በፊቴ ቆመ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይህም ከሰዓት በኋላ በግምት ሦስት ሰዓት ማለት ነው።
    reason: cultural_note
lexical_decisions:
