- source_word: ἰδοὺ
  choice: እነሆም
  rationale: በትረካው ውስጥ ድንገተኛነትንና ትኩረትን የሚያመጣውን የግሪኩን ንግግራዊ ኃይል ይጠብቃል።
- source_word: ἀνὴρ
  choice: አንድ ሰው
  rationale: በዐውዱ በሰው መልክ የታየውን ወንድ ምስል በተፈጥሯዊ አማርኛ ይገልጻል፤ የታየውን አካል ከምንጩ በላይ በቀጥታ ‘መልአክ’ ብሎ አይተረጉምም።
- source_word: ἔστη ἐνώπιόν μου
  choice: በፊቴ ቆመ
