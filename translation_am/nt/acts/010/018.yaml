review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the calling out, indirect inquiry, both names, and location. However, «የተቀመጠ እንደሆነ» presents the lodging as completed, whereas ξενίζεται is present and denotes Simon's current status as a guest. The imperfect ἐπυνθάνοντο is also better reflected by a past-progressive inquiry.
  naturalness: The revised wording is natural modern standard Amharic and retains a clear narrative register. «እንግዳ ሆኖ እየተቀመጠ» idiomatically expresses staying as a guest without implying permanent residence.
  terminology: «ጴጥሮስ የሚባለው ስምዖን» correctly identifies Simon by the name Peter. The hospitality nuance of ξενίζεται is retained in the main text and clarified in the footnote.
  issues:
  - severity: medium
    issue: Aspect of ξενίζεται
    rationale: «እንግዳ ሆኖ የተቀመጠ» uses a completed relative form and can suggest that Simon had already stayed, rather than that he was currently lodging there. A progressive form better represents the present verb.
  - severity: low
    issue: Imperfect nuance of ἐπυνθάνοντο
    rationale: «ጠየቁ» is acceptable in narrative Amharic, but «ይጠይቁ ነበር» more directly retains the ongoing/attempted inquiry indicated by the Greek imperfect.
  revised_text: ጮክ ብለው ጠርተው፣ ጴጥሮስ የሚባለው ስምዖን እዚህ እንግዳ ሆኖ እየተቀመጠ እንደሆነ ይጠይቁ ነበር።
