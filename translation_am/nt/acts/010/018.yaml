  text: ጮክ ብለው ጠርተው፣ ጴጥሮስ የሚባለው ስምዖን እዚህ እንግዳ ሆኖ እየተቀመጠ እንደሆነ ይጠይቁ ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φωνήσαντες
  choice: ጮክ ብለው ጠርተው
  rationale: በቤቱ ውስጥ ያሉትን ለማሰማት ድምፃቸውን ከፍ አድርገው መጥራታቸውን በተፈጥሯዊ አማርኛ ያሳያል፤ የግሪኩን ቀዳሚ አጋዥ ግስም ይጠብቃል።
- source_word: ἐπυνθάνοντο
  choice: ጠየቁ
  rationale: በትረካው ፍሰት ውስጥ ተፈጥሯዊና ግልጽ ነው። የግሪኩ ያልተፈጸመ ጊዜ ቀጣይነትን ሊያመለክት ቢችልም፣ እዚህ ዋናው ትኩረት በጥያቄው ላይ ነው።
- source_word: εἰ
  choice: እንደሆነ
  rationale: ቀጥተኛ ያልሆነውን የመኖር ጥያቄ በመደበኛ አማርኛ በትክክል ያስተዋውቃል።
- source_word: Σίμων ὁ ἐπικαλούμενος Πέτρος
  choice: ጴጥሮስ የሚባለው ስምዖን
  rationale: ሁለቱንም ስሞች ይጠብቃል፣ ጴጥሮስም ስምዖን የሚታወቅበት ስም መሆኑን በግልጽ ያሳያል።
- source_word: ἐνθάδε
  choice: እዚህ
  rationale: የቦታውን አመልካች ቃል ከምንጩ በቀጥታና በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ξενίζεται
  choice: እንግዳ ሆኖ የተቀመጠ
  rationale: ግሱ በሌላ ሰው ዘንድ እንደ እንግዳ መስተናገድንና ለጊዜው መቀመጥን ያመለክታል። ይህ አተረጓጎም የእንግድነቱን ሐሳብ ሳያጠፋ ለዘመናዊ አንባቢ ግልጽ ነው።
