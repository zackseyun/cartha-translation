  source_fidelity: The draft preserves the adversative force, the distributive scope across peoples, the two coordinated present participles, and the predicate that such a person is acceptable to God. However, በሕዝብ ሁሉ is less precise and natural for ἐν παντὶ ἔθνει than በየሕዝቡ, and the current alternate wording for note c reverses the grammatical relation.
