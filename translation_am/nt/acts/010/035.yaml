  text: ἀλλ’ ἐν παντὶ ἔθνει ὁ φοβούμενος αὐτὸν καὶ ἐργαζόμενος δικαιοσύνην δεκτὸς αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/035.yaml
  text: but in every nation the one who fears him and does what is righteous is acceptable to him[a][b][c].
translation:
  language: am
  text: ነገር ግን በየሕዝቡ እርሱን የሚፈራና ጽድቅን የሚሠራ[a][b] ሰው በእርሱ ዘንድ ተቀባይነት ያለው ነው[c]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ጽድቅን የሚያደርግ” ወይም “ጽድቅን የሚፈጽም።”
    reason: lexical_alternative
  - marker: b
    text: የግሪኩ δικαιοσύνην በተለምዶ “ጽድቅ” ማለት ነው፤ በአንዳንድ አውዶች “ፍትሕ” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “እርሱ ይቀበለዋል።”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’
  choice: ነገር ግን
  rationale: ከቀደመው አሳብ ጋር ያለውን ንጽጽር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐν παντὶ ἔθνει
  choice: በሕዝብ ሁሉ
  rationale: ἔθνοςን ዘመናዊ የመንግሥት ድንበር ብቻ ሳይጭንበት እንደ ሕዝብ ይገልጻል፤ παντί የሁሉንም ሕዝቦች አካታችነት ይጠብቃል።
- source_word: ὁ φοβούμενος αὐτὸν
  choice: እርሱን የሚፈራ … ሰው
  rationale: የግሪኩን ስማዊ የአሁን ጊዜ ቦዝ አንቀጽ በተፈጥሯዊና ጾታን በማይገድብ አማርኛ ያቀርባል፤ ‘የሚፈራ’ ለእግዚአብሔር ያለውን የአክብሮት ፍርሃት ይጠብቃል።
- source_word: καὶ ἐργαζόμενος δικαιοσύνην
  choice: ጽድቅን የሚያደርግ
  rationale: ἐργάζομαι የሚያመለክተውን ተግባራዊ ምግባር ያሳያል፤ ጽድቅንም እንደ ንቁ አኗኗር ይገልጻል።
- source_word: δικαιοσύνην
  choice: ጽድቅን
  rationale: የቃሉን ዋና መጽሐፍ ቅዱሳዊ ትርጉም ይጠብቃል፤ ‘ፍትሕ’ የሚለውን ሊኖር የሚችል የትርጉም ክልል በማስታወሻ ያቀርባል።
- source_word: δεκτὸς αὐτῷ ἐστιν
  choice: በእርሱ ዘንድ ተቀባይ ነው
  rationale: የግሪኩን ቅጽል-ገላጭ አወቃቀርና ‘ተቀባይ/በመልካም የሚቀበል’ የሚለውን ትርጉም ይጠብቃል፤ ከጽሑፉ ያልተነገረ የዋጋ ወይም የድነት ማብራሪያ አይጨምርም።
theological_decisions:
- issue: ጥቅሱ በሥራ ድነትን ያስተምራል ወይስ እግዚአብሔር ያለ የዘር አድልዎ የሚቀበለውን ሰው ይገልጻል?
  choice: በየሕዝቡ እግዚአብሔርን የሚፈራና ጽድቅን የሚያደርግ ሰው በእርሱ ዘንድ ተቀባይ እንደሆነ ጽሑፉ የሚለውን ብቻ መጠበቅ።
  alternative: ‘በሥራው በእግዚአብሔር ዘንድ ተቀባይነትን ያገኛል’ ወይም ‘የሚያድን እምነት እንዳለው ያሳያል’ ብሎ በትርጉሙ ውስጥ ማብራራት።
  rationale: δεκτός መቀበልን ይገልጻል፣ ነገር ግን የብቃት ዋጋን ወይም የእምነት ማስረጃነትን በግልጽ አይናገርም። ስለዚህ ትርጉሙ ያለውን ሥነ መለኮታዊ ውጥረት ሳይፈታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ጽድቅ’ የመጽሐፍ ቅዱስ ክብደቱን የሚጠብቅ ሲሆን፣ ‘የሚያደርግ’ ሐረጉን በዘመናዊ አማርኛ ተነባቢ ያደርገዋል።
