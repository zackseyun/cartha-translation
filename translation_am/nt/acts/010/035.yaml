  terminology: ጽድቅ retains the established biblical rendering of δικαιοσύνη. ጽድቅን የሚሠራ reflects ἐργαζόμενος while remaining natural. The revised note c correctly gives an active Amharic alternative for ‘is accepted by him.’
  issues:
  - severity: medium
    issue: Footnote c is grammatically and semantically inaccurate.
    rationale: “በእርሱ ይቀበላል” means roughly ‘he receives in/by him’ and does not express ‘is accepted by him.’ The object and agent relation must be made explicit.
  - severity: low
    issue: The rendering of ἐν παντὶ ἔθνει is somewhat imprecise.
    rationale: በሕዝብ ሁሉ can be read as ‘among all people.’ በየሕዝቡ more clearly conveys the distributive sense ‘in every nation/people.’
  - severity: low
    issue: Bare ተቀባይ may be unclear in this predicate.
    rationale: It can readily denote a recipient in modern Amharic. ተቀባይነት ያለው makes the intended sense, ‘acceptable,’ unambiguous.
