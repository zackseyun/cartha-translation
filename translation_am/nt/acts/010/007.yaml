  text: ὡς δὲ ἀπῆλθεν ὁ ἄγγελος ὁ λαλῶν ⸀αὐτῷ, φωνήσας δύο τῶν ⸀οἰκετῶν καὶ στρατιώτην εὐσεβῆ τῶν προσκαρτερούντων αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/007.yaml
  text: When the angel who was speaking to him had gone away[a], he called two of his household servants and a devout soldier from among those attending him.
translation:
  language: am
  text: ለእርሱ ይናገር የነበረው መልአክ ከሄደ በኋላ፣ ከቤቱ አገልጋዮች ሁለትንና እርሱን ዘወትር ከሚያገለግሉት መካከል አምላክን የሚያከብር አንድ ወታደር ጠራ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ ἀπῆλθεν
  choice: ከሄደ በኋላ
  rationale: ዋናው ድርጊት ከመፈጸሙ በፊት መልአኩ መሄዱን በተፈጥሯዊ የአማርኛ የጊዜ አገላለጽ ያሳያል።
- source_word: ὁ ἄγγελος ὁ λαλῶν αὐτῷ
  choice: ከእርሱ ጋር ይነጋገር የነበረው መልአክ
  rationale: መልአኩን በቀጣይ ንግግሩ የሚለየውን የአሁን ጊዜ አጋዥ ግስ በተፈጥሯዊ የአማርኛ አንጻራዊ ሐረግ ይገልጣል።
- source_word: φωνήσας
  choice: ጠራ
  rationale: በግሪኩ ከቀጣዩ ቁጥር ጋር የሚቀጥለውን አጋዥ ግስ በአማርኛ ግልጽና የተሟላ አረፍተ ነገር እንዲሆን እንደ ዋና ግስ ይተረጉማል።
- source_word: δύο τῶν οἰκετῶν
  choice: ከቤት አገልጋዮቹ ሁለቱን
  rationale: οἰκέτης በቤት ውስጥ በአገልጋይነት የተመደበን ሰው ያመለክታል፤ አገላለጹም ክፍልን ከጠቅላላው የሚለየውን አወቃቀር ይጠብቃል።
- source_word: στρατιώτην εὐσεβῆ
  choice: እግዚአብሔርን የሚያከብር አንድ ወታደር
  rationale: εὐσεβής የአምልኮ አክብሮትንና ታማኝ ሃይማኖታዊ ኑሮን ያመለክታል፤ ይህ አገላለጽ በዘመናዊ አማርኛ ግልጽ ነው።
- source_word: τῶν προσκαρτερούντων αὐτῷ
  choice: እርሱን ዘወትር ከሚያገለግሉት መካከል
  rationale: የግሱን የቀጣይነትና የተጠጋ አገልግሎት ስሜት ይይዛል፤ ‘ከ...መካከል’ ደግሞ የክፍል አመልካች የዘር ስም አወቃቀሩን ያንጸባርቃል።
theological_decisions:
- issue: በዐውደ ንባቡ የἄγγελος ማንነት
  choice: መልአክ
  alternative: መልእክተኛ
  rationale: በሐዋርያት ሥራ 10 ዐውድ ቆርኔሌዎስ በራእይ ያየው ሰማያዊ ልዑክ ስለሆነ፣ ‘መልአክ’ የሚለው የዐውዱን ትርጉም ይገልጣል።
- issue: የεὐσεβής የሃይማኖት ፍቺ
  choice: እግዚአብሔርን የሚያከብር
  alternative: ሃይማኖተኛ
  rationale: የግሪኩን የአክብሮትና የቅድስና አቅጣጫ በግልጽ ቋንቋ ያሳያል፤ ሰውየውን በኋላ የተፈጠረ የእምነት ቡድን ውስጥ አይመድበውም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ አረፍተ ነገር ወደ ቀጣዩ ቁጥር ቢቀጥልም፣ ቁጥሩ በአማርኛ ተፈጥሯዊ ሆኖ እንዲነበብ ‘ጠራ’ ዋና ግስ ሆኖ ቀርቧል።
