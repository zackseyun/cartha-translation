  yaml_path: translation/nt/acts/010/011.yaml
  text: and he sees heaven opened[a], and something like a large sheet descending, being lowered by its four corners to the earth[c][b],
translation:
  language: am
  text: ሰማይ ተከፍቶ፣ እንደ ትልቅ አንሶላ ያለ አንድ ነገር እየወረደ፣ በአራቱ ማዕዘኖቹ ተይዞ ወደ ምድር ሲለቀቅ ያያል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θεωρεῖ
  choice: ያያል
  rationale: የግሪኩን ሕያው የትረካ አሁን ጊዜ ይጠብቃል፤ በዘመናዊ አማርኛም ቀጥተኛና ተፈጥሯዊ ነው።
- source_word: οὐρανὸν ἀνεῳγμένον
  choice: ሰማይ ተከፍቶ
  rationale: οὐρανός ሰማይንም ሆነ የሚታየውን ሰማይ ሊያመለክት ይችላል፤ በራእዩ አውድ ‘ሰማይ’ መለኮታዊውን መገለጥ ሳይጨምር ይጠብቃል።
- source_word: καταβαῖνον
  choice: እየወረደ
  rationale: በመካሄድ ላይ ያለውን ወደ ታች እንቅስቃሴ የሚገልጽ የአማርኛ አቻ ነው።
- source_word: σκεῦός τι
  choice: አንድ ነገር
  rationale: σκεῦος ሰፊ ትርጉም ያለው ሲሆን τι ደግሞ አለመወሰኑን ያሳያል፤ ‘ዕቃ’ ወይም ‘መያዣ’ ማለት ትርጉሙን ከሚገባው በላይ ይወስነዋል።
- source_word: ὡς ὀθόνην μεγάλην
  choice: እንደ ትልቅ አንሶላ ያለ
  rationale: ὡς የሚያሳየውን ንጽጽር ይጠብቃል፤ ‘አንሶላ’ የትልቅ ጨርቅን ምስል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τέσσαρσιν ἀρχαῖς
  choice: በአራቱ ማዕዘኖቹ
  rationale: ἀρχαί እዚህ ጫፎችን ወይም ማዕዘኖችን ያመለክታል፤ ከአንሶላ ጋር ‘ማዕዘኖች’ የተለመደና ግልጽ ነው።
- source_word: καθιέμενον ἐπὶ τῆς γῆς
  choice: ወደ ምድር ሲወርድ
  rationale: ተሳቢው ግስ ነገሩ ወደ ታች እንዲለቀቅ መደረጉን ያመለክታል፤ ይህ አቀራረብ የእንቅስቃሴውን አቅጣጫ በተፈጥሯዊ አማርኛ ያሳያል።
