id: ACT.10.38
reference: Acts 10:38
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ἰησοῦν τὸν ἀπὸ Ναζαρέθ, ὡς ἔχρισεν αὐτὸν ὁ θεὸς πνεύματι ἁγίῳ καὶ δυνάμει, ὃς διῆλθεν εὐεργετῶν καὶ ἰώμενος πάντας τοὺς καταδυναστευομένους ὑπὸ τοῦ διαβόλου, ὅτι ὁ θεὸς ἦν μετ’ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/038.yaml
  text: 'Jesus of Nazareth: how God anointed him with the Holy Spirit and with power[a]; he went about doing good and healing all who were oppressed by the devil[c][b], because God was with him.'
translation:
  language: am
  text: የናዝሬቱን ኢየሱስ፤ እግዚአብሔር በመንፈስ ቅዱስና በኃይል እንዴት እንደቀባው፣ እርሱም መልካም እያደረገና በዲያብሎስ የተጨቆኑትን ሁሉ እየፈወሰ በየስፍራው እንደዞረ ታውቃላችሁ፤ ምክንያቱም እግዚአብሔር ከእርሱ ጋር ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦν τὸν ἀπὸ Ναζαρέθ
  choice: የናዝሬቱን ኢየሱስ
  rationale: የግሪኩ ሐረግ ኢየሱስን በመጣበት ስፍራ ይለያል። ይህ አተረጓጎም በአማርኛ የተለመደና ተፈጥሯዊ ሲሆን ‘ከናዝሬት የሆነውን’ የሚለውን ትርጉም ይይዛል።
- source_word: ὡς ἔχρισεν
  choice: እንዴት እንደቀባው
  rationale: ὡς የተፈጸመውን ነገር በማብራሪያ መልክ ያስገባል፤ χρίω ደግሞ የመቀባትን ቀጥተኛና መሲሐዊ ድምፅ ይይዛል።
- source_word: πνεύματι ἁγίῳ καὶ δυνάμει
  choice: በመንፈስ ቅዱስና በኃይል
  rationale: በሁለቱም ስሞች ያለውን የመሣሪያ ወይም የማስታጠቅ ኃይል የሚገልጽ የዳቲቭ ትርጉም ‘በ’ በማለት ተጠብቋል፤ መንፈስ ቅዱስና ኃይልም አልተደባለቁም።
- source_word: διῆλθεν εὐεργετῶν
  choice: መልካም እያደረገ ... በየስፍራው እንደዞረ
  rationale: διέρχομαι በዚህ አውድ ከስፍራ ወደ ስፍራ የተካሄደ አገልግሎትን ያመለክታል፤ εὐεργετέω ደግሞ ሰፊውን የበጎ ማድረግ ትርጉም ይጠብቃል።
- source_word: ἰώμενος πάντας τοὺς καταδυναστευομένους ὑπὸ τοῦ διαβόλου
  choice: በዲያብሎስ የተጨቆኑትን ሁሉ እየፈወሰ
  rationale: ἰάομαι ‘መፈወስ’ ተብሎ ቀጥታ ተተርጉሟል፤ καταδυναστεύω የግፍና የከባድ ቁጥጥር ሐሳብ ስላለው ‘የተጨቆኑ’ ተመርጧል፤ διάβολος የግል ክፉ ፍጡርን እንደሚያመለክት ‘ዲያብሎስ’ ተብሏል።
- source_word: ὅτι ὁ θεὸς ἦν μετ’ αὐτοῦ
  choice: ምክንያቱም እግዚአብሔር ከእርሱ ጋር ነበር
  rationale: ὅτι እዚህ ምክንያትን ያስገባል፤ ‘ምክንያቱም’ ይህን የምክንያት ግንኙነት በዘመናዊ አማርኛ ግልጽ ያደርገዋል።
theological_decisions:
- issue: የኢየሱስ መቀባትና ተልእኮው ግንኙነት
  choice: ‘ቀባው’ የሚለውን ቃል ያለ ዶክትሪናዊ ማብራሪያ ማቆየት
  alternative: ‘መሲሕ አድርጎ ሾመው’ ወይም ‘ኃይል ሰጠው’ ብሎ ማስፋት
  rationale: ጥቅሱ እግዚአብሔር ኢየሱስን እንደቀባው ይናገራል። ‘ቀባው’ የመሲሐዊውን ድምፅ ይጠብቃል፤ ነገር ግን በጥቅሱ ያልተገለጸ ትምህርት አይጨምርም።
- issue: የመንፈስ ቅዱስ ማጣቀሻ
  choice: መለኮታዊውን መንፈስ ቅዱስ እንደ ግል ማጣቀሻ መተርጎም
  alternative: ‘ቅዱስ መንፈስ’ን እንደ ባሕርይ ወይም ኃይል ብቻ መውሰድ
  rationale: በሐዋርያት ሥራ አውድ πνεῦμα ἅγιον መንፈስ ቅዱስን ያመለክታል፤ ጥቅሱም ‘መንፈስ ቅዱስ’ንና ‘ኃይል’ን ለይቶ ይጠቅሳል።
- issue: ‘እግዚአብሔር ከእርሱ ጋር ነበር’ የሚለው ምክንያታዊ አንቀጽ
  choice: የኢየሱስን በጎ ሥራና ፈውስ የሚያስረዳ ምክንያት አድርጎ ማቆየት
  alternative: የምክንያት ኃይሉን ማለስለስ ወይም ከጥቅሱ በላይ ክርስቶሎጂያዊ ድምዳሜ መጨመር
  rationale: ግሪኩ የእግዚአብሔርን ከእርሱ ጋር መሆን ለአገልግሎቱ ምክንያት አድርጎ ያቀርባል፤ ትርጉሙ ይህን እንዳለ ይጠብቃል።
- issue: በግሪክ ጥቅሱ የተጨመቀው አገባብ
  choice: ከቀደመው አውድ የሚገባውን ‘ታውቃላችሁ’ በመጨመር አማርኛውን ሙሉና ተፈጥሯዊ ማድረግ
  alternative: ግሪኩን በቁራጭ ሐረግ መተው
  rationale: ቁጥር 38 የቁጥር 37 ዓረፍተ ነገር ቀጣይ ነው፤ በተናጠል ሲነበብ ግን በአማርኛ ዋና ግስ ያስፈልጋል። መጨመሩ ከቀደመው οἴδατε የሚመጣ እንጂ አዲስ ሐሳብ አይደለም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ቁጥሩ ብቻውን ሲቀርብ የተጨመቀው የግሪክ አገባብ ግልጽ እንዲሆን፣ ከቁጥር 37 የሚቀጥለው ‘ታውቃላችሁ’ በመጨረሻ ተገልጿል። ምንም የግርጌ ማስታወሻ አላስፈለገም።
