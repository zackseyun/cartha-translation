  yaml_path: translation/nt/acts/010/026.yaml
  text: But Peter raised him up[a], saying, “Stand up[c][b]; I too am a man.”
translation:
  language: am
  text: ጴጥሮስ ግን አስነሣውና፣[a] “ተነሥ፤[b] እኔም ራሴ ሰው ነኝ”[c] አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ከፍ አደረገው» ወይም «እንዲነሣ ረዳው»።
