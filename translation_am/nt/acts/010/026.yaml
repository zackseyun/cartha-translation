lexical_decisions:
- source_word: ἤγειρεν αὐτὸν
  choice: አስነሣውና
  rationale: ἐγείρω በዚህ አውድ የተደፋውን ቆርኔሌዎስን ጴጥሮስ ከመሬት እንዳስነሣው ያመለክታል። «አስነሣው» የግሱን አስደራጊ ኃይል ይጠብቃል፤ በትክክል እንዴት እንደረዳው ግን አይወስንም።
- source_word: Ἀνάστηθι
  choice: ተነሥ
  rationale: የἀνίστημι ቀጥተኛ ትእዛዝ ነው፤ በእግሩ እንዲቆም ወይም ከወደቀበት እንዲነሣ ይነግረዋል። «ተነሥ» ተፈጥሯዊና አጭር የአማርኛ አገላለጽ ነው።
- source_word: καὶ ἐγὼ αὐτὸς
  choice: እኔም ራሴ
  rationale: καί የጋራነትን፣ αὐτός ደግሞ አጽንዖትን ይሰጣሉ። «እኔም ራሴ» ጴጥሮስ ራሱም ከቆርኔሌዎስ ጋር ተመሳሳይ ሰው መሆኑን በተፈጥሯዊ አማርኛ ያጎላል።
- source_word: ἄνθρωπός εἰμι
  choice: ሰው ነኝ
  rationale: ἄνθρωπος እዚህ የጴጥሮስን ሰብአዊነት ያመለክታል። «ሰው ነኝ» ቀጥተኛና ተፈጥሯዊ ነው፤ በግሪኩ ያልተገለጸውን «ብቻ» የሚል ትርጉም አይጨምርም።
- source_word: δὲ
  choice: ግን
  rationale: δὲ ከቀደመው የቆርኔሌዎስ ድርጊት ጋር ቀላል ንፅፅር ያሳያል። «ግን» ጴጥሮስ ያንን ድርጊት ለማስተካከል የሰጠውን ምላሽ በግልጽ ያገናኛል።
theological_decisions:
- issue: ጴጥሮስ ቆርኔሌዎስ በፊቱ በመደፋቱ ላይ የሰጠው ምላሽ
  choice: ጴጥሮስ እንዲነሣ አዝዞት የራሱንም የጋራ ሰብአዊነት እንደገለጸ ተተርጉሟል።
  alternative: ንግግሩን ከዚህ የማክበር ድርጊት ጋር ሰፊ ሥነ መለኮታዊ አንድምታ ሳያያይዙ እንደ ቀላል ትሕትና ብቻ ማንበብ ይቻላል።
  rationale: «ተነሥ፤ እኔም ራሴ ሰው ነኝ» የሚለው አገላለጽ የጽሑፉን ግልጽ ንፅፅር ይጠብቃል፤ ነገር ግን ጥቅሱ በግልጽ ያልተናገረውን የአምልኮ ወይም የክብር ዝርዝር ትምህርት አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ቀላል የሆነ መደበኛ አማርኛ ተጠቅሟል። «አስነሣውና» እና «ተነሥ» በቅርብ መደጋገማቸው በግሪኩ ያለውን የἐγείρω/ἀνίστημι ትርጉማዊ ቅርበት በተፈጥሯዊ ሁኔታ ያንጸባርቃል።
