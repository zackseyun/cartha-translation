  yaml_path: translation/nt/acts/010/012.yaml
  text: In it were all the four-footed animals and reptiles of the earth[c][b][a], and birds of the sky.
translation:
  language: am
  text: በውስጡም[a] ሁሉም አራት እግር ያላቸው እንስሳት፣ የምድር ተሳቢ ፍጥረታት[b] እና የሰማይ ወፎች[c] ነበሩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በዚያ ውስጥም።»
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «በምድር ላይ የሚሳቡ ፍጥረታት።»
    reason: lexical_alternative
  - marker: c
    text: «ሰማይ» የሚለው ቃል እዚህ ላይ ከምድር በላይ ያለውን ሰማይ ያመለክታል።
    reason: lexical_clarification
lexical_decisions:
- source_word: ἐν ᾧ
  choice: በውስጡም
  rationale: አንጻራዊው ተውላጠ ስም ጴጥሮስ በራእዩ ያየውን እንደ ትልቅ ጨርቅ ያለውን ነገር ያመለክታል፤ «በውስጡም» የቦታውን ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὑπῆρχεν
  choice: ነበሩ
  rationale: በዚህ አውድ ግሱ እንስሳቱ በዚያ ውስጥ መኖራቸውን ወይም መገኘታቸውን ያመለክታል፤ «ነበሩ» ያልተጨመረ ትርጓሜ የሌለው ቀጥተኛ አተረጓጎም ነው።
- source_word: πάντα
  choice: ሁሉም
  rationale: የተዘረዘሩትን የእንስሳት ምድቦች አጠቃላይ ስፋት ይጠብቃል፤ «ሁሉም ዓይነት» የሚለውን ትርጓሜ አይጨምርም።
- source_word: τὰ τετράποδα
  choice: አራት እግር ያላቸው እንስሳት
  rationale: የግሪኩን ግልጽ ሥዕል በዘመናዊና በቀላሉ በሚገባ አማርኛ ያቀርባል።
- source_word: ἑρπετὰ τῆς γῆς
  choice: የምድር ተሳቢ ፍጥረታት
  rationale: ἑρπετά ከዘመናዊው የእንስሳት ሳይንስ «ተሳቢ እንስሳት» ይልቅ በምድር ላይ የሚሳቡ ፍጥረታትን በሰፊው ሊያመለክት ስለሚችል፣ «ፍጥረታት» የትርጉሙን ስፋት ይጠብቃል።
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: የሰማይ ወፎች
  rationale: πετεινάን በዚህ የእንስሳት ዝርዝር ውስጥ «ወፎች» ብሎ መተርጎም ተፈጥሯዊ ነው፤ τοῦ οὐρανοῦ ደግሞ «የሰማይ» ተብሎ የግሪኩን መዋቅር ይጠብቃል።
- source_word: καὶ ... καὶ
  choice: ፣ ... እና
  rationale: የግሪኩን ማስተባበሪያ ትርጉም በተፈጥሯዊ የአማርኛ ዝርዝር አጻጻፍ ያቀርባል።
