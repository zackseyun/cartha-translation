  text: እንዲህም አላቸው፦ “እናንተ ራሳችሁ እንደምታውቁት፣ ለአንድ አይሁዳዊ ሰው ከሌላ ወገን የሆነ ሰው ጋር መቀላቀል ወይም ወደ እርሱ መሄድ የተከለከለ ነው፤[a] እግዚአብሔር ግን እኔን ማንንም ሰው ‘ተራ’ ወይም ‘ርኩስ’ ብዬ እንዳልጠራ አሳይቶኛል።”[b]
  philosophy: optimal-equivalence
  footnotes:
