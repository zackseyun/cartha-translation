- source_word: Σίμωνά τινα
  choice: ስምዖንን
  rationale: τινα እስካሁን በትረካው ያልተለየ ነገር ግን ሊታወቅ የሚችል ሰው መሆኑን ያሳያል፤ በአማርኛ ‘አንድ ስምዖን’ ማለት የቁጥር ትርጉም ሊያጎላ ስለሚችል ዋናው ጽሑፍ ተፈጥሯዊውን ቅርጽ ይጠቀማል፣ አማራጩም በማስታወሻ ተጠብቋል።
- source_word: ὃς ἐπικαλεῖται Πέτρος
  choice: ጴጥሮስ የሚባለውን
