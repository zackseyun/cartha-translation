- source_word: ἄνδρας
  choice: ሰዎችን
  rationale: በዚህ የመልእክተኞች አውድ ውስጥ ተፈጥሯዊ የአማርኛ አገላለጽ ነው፤ ‘መልእክተኞች’ ማለት በግሪኩ በግልጽ ያልተነገረውን ሚና ስለሚጨምር አልተመረጠም።
- source_word: εἰς Ἰόππην
