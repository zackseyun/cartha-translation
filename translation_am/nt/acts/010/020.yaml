  text: ነገር ግን ተነሥተህ ውረድ፤ ምንም ሳትጠራጠር[a] ከእነርሱ ጋር ሂድ፤ እኔ ልኬአቸዋለሁና።
  philosophy: optimal-equivalence
  footnotes:
