    text: ወይም፣ “ምንም ልዩነት ሳታደርግ።” የግሪኩ ተሳቢ ግስ አለመጠራጠርን ወይም አለማመንታትን፣ ወይም ልዩነት አለማድረግን ሊያመለክት ይችላል፤ ሁለተኛው ትርጉም በዚህ ምዕራፍ ያለውን የአይሁድና የአሕዛብ ጭብጥ ሊያስተጋባ ይችላል።
    reason: alternative_reading
lexical_decisions:
