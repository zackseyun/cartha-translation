- source_word: μηδὲν διακρινόμενος
  choice: ምንም ሳትጠራጠር
  rationale: በቅርብ አውዱ ጴጥሮስ ስለ ራእዩ ግራ ተጋብቶ ስለነበር፣ ያለ ጥርጣሬና ማመንታት እንዲሄድ የተሰጠውን ትእዛዝ በተፈጥሯዊ አማርኛ ያሳያል፤ የ‘ልዩነት አለማድረግ’ ትርጉሙ በማስታወሻ ተጠብቋል።
- source_word: ὅτι
  choice: -ና
  rationale: ‘ልኬአቸዋለሁና’ የሚለው ቅጥ ጴጥሮስ መታዘዝ ያለበትን ምክንያት በተፈጥሯዊ አማርኛ ያስተዋውቃል።
- source_word: ἐγὼ
