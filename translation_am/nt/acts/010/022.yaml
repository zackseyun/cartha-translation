  text: οἱ δὲ εἶπαν· Κορνήλιος ἑκατοντάρχης, ἀνὴρ δίκαιος καὶ φοβούμενος τὸν θεὸν μαρτυρούμενός τε ὑπὸ ὅλου τοῦ ἔθνους τῶν Ἰουδαίων, ἐχρηματίσθη ὑπὸ ἀγγέλου ἁγίου μεταπέμψασθαί σε εἰς τὸν οἶκον αὐτοῦ καὶ ἀκοῦσαι ῥήματα παρὰ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/022.yaml
  text: They said[a], “Cornelius, a centurion, a righteous man and one who fears God, and who is well spoken of by the whole nation of the Jews[e][d][c][b], was divinely instructed by a holy angel to summon you to his house and to hear words from you.”
translation:
  language: am
  text: እነርሱም፣ “ቆርኔሌዎስ የመቶ አለቃ፣ ጻድቅና እግዚአብሔርን የሚፈራ፣ በአይሁድ ሕዝብ ሁሉ ዘንድ መልካም ምስክርነት የተሰጠው ሰው ነው። ወደ ቤቱ እንዲያስጠራህና ከአንተ ቃላትን እንዲሰማ በቅዱስ መልአክ አማካኝነት መለኮታዊ መመሪያ ተሰጥቶታል[a]” አሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “መለኮታዊ መመሪያ ተሰጥቶታል” የሚለው “ማስጠንቀቂያ ተሰጥቶታል” ወይም “መለኮታዊ መልእክት ተቀብሏል” ተብሎም ሊተረጎም ይችላል። የግሪኩ ግስ ከመለኮት የሚመጣ መግለጫ ወይም መመሪያ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: የመቶ አለቃ
  rationale: የሮማዊውን የጦር ሹመት በአማርኛ የተለመደና በቀላሉ የሚገባ ቃል ይገልጣል።
- source_word: ἀνὴρ δίκαιος
  choice: ጻድቅ ... ሰው
  rationale: የδίκαιοςን ሥነ ምግባራዊና ሃይማኖታዊ ክብደት ይጠብቃል፤ ἀνήρም በግልጽ ‘ሰው’ ተብሎ ቀርቧል።
- source_word: φοβούμενος τὸν θεόν
  choice: እግዚአብሔርን የሚፈራ
  rationale: የግሪኩን ግሳዊ አነጋገርና መጽሐፍ ቅዱሳዊ ፈሊጥ ይጠብቃል፤ የቆርኔሌዎስን መዳን ወይም የቃል ኪዳን ሁኔታ አይወስንም።
- source_word: μαρτυρούμενος
  choice: መልካም ምስክርነት ያለው
  rationale: ተገብሮአዊውን የሌሎች መልካም ምስክርነትና መልካም ስም በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὑπὸ ὅλου τοῦ ἔθνους τῶν Ἰουδαίων
  choice: በአይሁድ ሕዝብ ሁሉ ዘንድ
  rationale: ἔθνοςን እንደ ዘመናዊ ፖለቲካዊ መንግሥት ሳይሆን እንደ ሕዝብ ወይም የዘር ማኅበረሰብ ይገልጣል።
- source_word: ἐχρηματίσθη
  choice: መለኮታዊ መመሪያ ተቀብሏል
  rationale: በዚህ አውድ ያለውን ከመለኮት የመጣ መልእክት ወይም መመሪያ ያሳያል፤ ‘ተጠነቀቀ’ ብሎ ወደ ማስጠንቀቂያ ብቻ አያጠበውም።
- source_word: ἀγγέλου ἁγίου
  choice: በቅዱስ መልአክ
  rationale: በግሪኩ ያለውን ἁγίου በግልጽ ይወክላል።
- source_word: μεταπέμψασθαί σε εἰς τὸν οἶκον αὐτοῦ
  choice: ወደ ቤቱ እንዲያስጠራህ
  rationale: ‘እንዲያስጠራህ’ ሰው ልኮ ማስመጣትን በአጭርና ተፈጥሯዊ መንገድ ይገልጣል፤ መድረሻውም ‘ወደ ቤቱ’ ተብሎ ተጠብቋል።
- source_word: ἀκοῦσαι ῥήματα παρὰ σοῦ
  choice: ከአንተ ቃል እንዲሰማ
  rationale: ῥήματαን እንደ ‘ቃል/የሚነገር ነገር’ ያቀርባል፤ ይዘቱን ‘ስብከት’ ወይም ሌላ የተወሰነ ዓይነት መልእክት ብሎ አይጨምርም።
theological_decisions:
- issue: የቆርኔሌዎስን አምላካዊ ፍርሃትና ጽድቅ ያለ ተጨማሪ ዶክትሪናዊ ውሳኔ መግለጽ
  choice: ጻድቅና እግዚአብሔርን የሚፈራ ... ሰው
  alternative: ቀናና ሃይማኖተኛ ሰው
  rationale: ጽሑፉ የሚሰጠውን ሥነ ምግባራዊና ሃይማኖታዊ ምስክርነት በቀጥታ ይጠብቃል፤ ስለ ቃል ኪዳን አባልነቱ ወይም ስለ መዳኑ ጽሑፉ ያልተናገረውን አይጨምርም።
