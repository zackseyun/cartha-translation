  terminology: Rendering ἔκστασις as “ድንግዝግዝ” retains an altered-state sense without making “vision” part of the lexical translation or asserting a more specific psychological description than the source supplies. The footnote preserves the alternative “ራስን የመሳት ሁኔታ.”
