review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the inferential connection, Peter’s coming without protest, and his inquiry about the reason for the summons. However, “ሰው ልካችሁ በጠራችሁኝ” unnecessarily specifies a singular messenger and is less idiomatic than an Amharic passive-causative expression for being sent for.
  naturalness: The verse is generally clear and modern, but “ልካችሁ ባስጠራችሁኝ” is smoother, avoids the unspecified-singular “ሰው,” and naturally expresses the Greek passive participle. “በምን ምክንያት” retains the explicitly stated basis/reason of τίνι λόγῳ.
  terminology: “ሳልቃወም” appropriately represents ἀναντιρρήτως. “አስጠራችሁኝ” consistently renders the send-for/summon sense of μεταπέμπομαι without importing a theological or interpretive nuance.
  issues:
  - severity: low
    issue: The phrase “ሰው ልካችሁ” specifies one messenger.
    rationale: The Greek says only that Peter was sent for; it does not state the number of people sent in this verse. A formulation without singular specification better preserves the wording.
  - severity: low
    issue: The direct question is translated with “ለምን,” while the footnote presents the fuller wording.
    rationale: “ለምን” is valid, but “በምን ምክንያት” more directly represents τίνι λόγῳ and removes the need to treat the source wording as merely a footnoted literal alternative.
