review_pass:
  verdict: revise
  source_fidelity: The draft preserves the imperfect sense of ἤκουον, the explanatory γάρ, the coordinated participles, the ambiguity of γλώσσαις, and Peter's ensuing response. However, placing እነርሱ as the opening subject makes the people who were heard appear to be the same people who heard them, obscuring the Greek distinction between the implicit hearers and αὐτῶν ('them').
  naturalness: The sentence becomes clear and natural when the participial clause identifies those being heard and the main verb retains its implicit subject. እግዚአብሔርን ሲያመሰግኑ is a more idiomatic modern-standard Amharic expression for μεγαλυνόντων in this praise context than ከፍ ከፍ ሲያደርጉ.
  terminology: በልሳኖች appropriately retains the established biblical expression and does not settle whether the speech was languages or another kind of tongues-speech. The footnote adequately supplies በቋንቋዎች as the lexical alternative. እግዚአብሔር and ጴጥሮስ are standard forms.
  issues:
  - severity: high
    issue: The explicit opening pronoun እነርሱ confuses the referents of the Greek pronouns.
    rationale: In Greek, αὐτῶν is the object of hearing ('hearing them'), while the subject of ἤκουον is implicit and refers to the previously mentioned hearers. In the draft, እነርሱ functions as the subject of both the participial clause and the main verb, yielding the misleading sense that they heard themselves.
  - severity: low
    issue: እግዚአብሔርን ከፍ ከፍ ሲያደርጉ is less idiomatic in this context.
    rationale: Although it reflects the literal image of μεγαλύνω, እግዚአብሔርን ሲያመሰግኑ naturally communicates the Greek's sense of extolling God without adding interpretive content.
  revised_text: እነርሱ በልሳኖች[a] ሲናገሩና እግዚአብሔርን ሲያመሰግኑ ይሰሟቸው ነበርና። ከዚያም ጴጥሮስ መለሰ፦
