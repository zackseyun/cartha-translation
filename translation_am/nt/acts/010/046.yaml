  to: እነርሱ በልሳኖች[a] ሲናገሩና እግዚአብሔርን ሲያመሰግኑ ይሰሟቸው ነበርና። ከዚያም ጴጥሮስ መለሰ፦
  rationale: 'The revision removes the misleading standalone subject from the main clause while retaining እነርሱ as the subject of the participial clause: the preceding-context group heard ''them'' speaking. It also uses an idiomatic praise verb for μεγαλυνόντων. The lexical ambiguity of γλώσσαις and its footnote anchor are retained unchanged.'
