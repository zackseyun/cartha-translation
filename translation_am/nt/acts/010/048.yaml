  text: προσέταξεν ⸀δὲ αὐτοὺς ⸂ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ βαπτισθῆναι⸃. τότε ἠρώτησαν αὐτὸν ἐπιμεῖναι ἡμέρας τινάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/048.yaml
  text: So he ordered them to be baptized in the name of Jesus the Messiah[a]. Then they asked him to remain for some days.
translation:
  language: am
  text: እርሱም በኢየሱስ በመሲሑ ስም እንዲጠመቁ አዘዛቸው[a]። ከዚያም ለአንዳንድ ቀናት እንዲቆይ ጠየቁት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ በባህላዊው አጠራር፣ «በኢየሱስ ክርስቶስ ስም»።
    reason: alternative_reading
lexical_decisions:
- source_word: προσέταξεν
  choice: አዘዛቸው
  rationale: የሥልጣን መመሪያን የሚገልጠውን የግሪኩን ግስ በቀጥታና በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δὲ
  choice: ስለዚህ
  rationale: በዚህ አውድ ጠንካራ ተቃርኖን ሳይሆን ከቀደመው ክስተት የሚከተለውን ውጤትና የትረካ እድገት ያሳያል።
- source_word: ἐν τῷ ὀνόματι
  choice: በ…ስም
  rationale: የሥልጣን፣ የታማኝነትና የመጥራት ገጽታዎችን ሳያጠብ የግሪኩን ሰፊ አገላለጽ ይጠብቃል።
- source_word: Ἰησοῦ Χριστοῦ
  choice: ኢየሱስ መሲሕ
  rationale: Χριστός እዚህ እንደ ማዕረግ የሚሠራ ስለሆነ «መሲሕ» ትርጉሙን ይጠብቃል፤ ባህላዊው «ኢየሱስ ክርስቶስ» በማስታወሻ ቀርቧል።
- source_word: βαπτισθῆναι
  choice: እንዲጠመቁ
  rationale: የተደራጊውን የግስ ቅርጽ በግልጽ ሁኔታ ይጠብቃል፤ ከሥርዓቱ ዘዴ አንዱን በትርጉሙ ላይ አያስገድድም።
- source_word: τότε
  choice: ከዚያም
  rationale: ቀጣዩን ክስተት በተፈጥሯዊ የአማርኛ ትረካ ያመለክታል።
- source_word: ἠρώτησαν
  choice: ለመኑት
  rationale: በዚህ አውድ ግሱ መረጃ መጠየቅን ሳይሆን አንድ ነገር እንዲያደርግ መጠየቅን ያመለክታል፤ «ለመኑት» ይህን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐπιμεῖναι
  choice: እንዲቆይ
  rationale: ለተወሰነ ጊዜ በዚያው መቆየትን በግልጽና በዘመናዊ አማርኛ ያሳያል።
- source_word: ἡμέρας τινάς
  choice: ጥቂት ቀናት
  rationale: የጊዜውን ያልተወሰነ አጭር መጠን በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: በጥምቀት አገላለጹ ውስጥ Χριστοῦን መተርጎም
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: በዚህ ሐረግ Χριστός የኢየሱስን ማዕረግና መሲሓዊ ማንነት ይገልጣል። «መሲሕ» የማዕረጉን ትርጉም ግልጽ ያደርጋል፤ የተለመደው «ክርስቶስ» ደግሞ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። «ከእነርሱ ጋር» በግሪኩ ውስጥ በቀጥታ ባይኖርም የመቆየቱን ማኅበራዊ አውድ በተፈጥሯዊ አማርኛ ያብራራል።
