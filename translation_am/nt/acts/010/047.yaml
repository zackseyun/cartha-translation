language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Μήτι τὸ ὕδωρ ⸂δύναται κωλῦσαί⸃ τις τοῦ μὴ βαπτισθῆναι τούτους οἵτινες τὸ πνεῦμα τὸ ἅγιον ἔλαβον ⸀ὡς καὶ ἡμεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/047.yaml
  text: Surely no one can withhold the water so that these people should not be baptized[b][a], can they? For they have received the Holy Spirit just as we have.
translation:
  language: am
  text: “እነዚህ ሰዎች እንደ እኛም መንፈስ ቅዱስን የተቀበሉ ስለሆኑ፣ በውሃ እንዳይጠመቁ ውሃውን ሊከለክል የሚችል ማን ነው?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μήτι
  choice: ታዲያ ... የሚችል ማን ነው?
  rationale: Μήτι አሉታዊ መልስ የሚጠብቅ ጥያቄ ያስገባል። ይህ የአማርኛ አገላለጽ ‘ማንም አይችልም’ የሚለውን ኃይል በተፈጥሯዊ የንግግር ጥያቄ ያቀርባል።
- source_word: τὸ ὕδωρ
  choice: ውሃውን
  rationale: የግሪኩን ወሳኝ አመልካች በመጠበቅ፣ በዐውዱ ለጥምቀት የሚውለውን ውሃ ያመለክታል።
- source_word: δύναται κωλῦσαί τις
  choice: ሊከለክላቸው የሚችል ማን ነው?
  rationale: ‘ሊከለክል/ሊያግድ የሚችል ማን አለ?’ የሚለውን ትርጉም ይጠብቃል፤ የተያያዘው ተውላጠ ስምም ውሃው ከእነዚህ ሰዎች እንዳይከለከል ያለውን ሐሳብ ግልጽ ያደርጋል።
- source_word: τοῦ μὴ βαπτισθῆναι τούτους
  choice: እነዚህ ሰዎች እንዳይጠመቁ
  rationale: አሉታዊው የመከልከል ውጤት እነዚህ ሰዎች እንዳይጠመቁ ማድረግ መሆኑን በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: መንፈስ ቅዱስን
  rationale: በዘመናዊ መደበኛ አማርኛ የተለመደውንና ክብር ያለውን ስያሜ ይጠቀማል።
- source_word: ἔλαβον
  choice: የተቀበሉት
  rationale: መንፈስ ቅዱስን መቀበላቸው አስቀድሞ የተፈጸመ እና ለአሁኑ ክርክር መሠረት የሆነ ክስተት መሆኑን ያሳያል።
- source_word: ὡς καὶ ἡμεῖς
  choice: እንደ እኛው
  rationale: የእነርሱን መንፈስ ቅዱስ መቀበል ከተናጋሪውና ከቡድኑ ልምምድ ጋር በእኩል የሚያነጻጽረውን አጽንዖት ይጠብቃል።
theological_decisions:
- issue: መንፈስ ቅዱስን በመቀበልና በውሃ በመጠመቅ መካከል ያለው የትረካ ቅደም ተከተል
  choice: እነዚህ ሰዎች መንፈስ ቅዱስን አስቀድመው እንደተቀበሉ፣ ይህም ውሃ እንዳይከለከላቸው ለቀረበው ጥያቄ መሠረት እንደሆነ ተተርጉሟል።
  alternative: የመንፈስ ቅዱስ መቀበላቸውንና ጥምቀታቸውን የጊዜ ቅደም ተከተል የሚያደበዝዝ አተረጓጎም።
  rationale: የግሪኩ አገባብና የትረካው ክርክር መንፈስ ቅዱስን መቀበላቸው ከውሃ ጥምቀቱ በፊት መሆኑን ያሳያል። ትርጉሙ ይህን ውጥረት ይጠብቃል እንጂ የአንድን ወገን ሥርዓተ እምነት አያስገባም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። የግሪኩ ረጅም ጥያቄ በአማርኛ ተፈጥሯዊ ቅደም ተከተል ተደራጅቷል፤ አሉታዊ መልስ የሚጠብቀው የንግግር ጥያቄ ግን ተጠብቋል።
