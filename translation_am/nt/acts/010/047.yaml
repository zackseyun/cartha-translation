revisions:
- from: “ታዲያ እንደ እኛው መንፈስ ቅዱስን የተቀበሉት እነዚህ ሰዎች እንዳይጠመቁ ውሃውን ሊከለክላቸው የሚችል ማን ነው?”
  to: “እነዚህ ሰዎች እንደ እኛም መንፈስ ቅዱስን የተቀበሉ ስለሆኑ፣ በውሃ እንዳይጠመቁ ውሃውን ሊከለክል የሚችል ማን ነው?”
  rationale: The revision preserves the negative-answer rhetorical question and the sequence in which these people have received the Holy Spirit before water baptism. It makes ውሃውን the unambiguous object of withholding and uses an idiomatic comparative expression for ‘just as we also [did].’
  reviewer_model: gpt-5.6-terra
