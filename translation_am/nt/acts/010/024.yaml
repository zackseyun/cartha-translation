  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸂τῇ δὲ⸃ ἐπαύριον ⸀εἰσῆλθεν εἰς τὴν Καισάρειαν. ὁ δὲ Κορνήλιος ἦν προσδοκῶν αὐτοὺς συγκαλεσάμενος τοὺς συγγενεῖς αὐτοῦ καὶ τοὺς ἀναγκαίους φίλους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/024.yaml
  text: On the next day he entered Caesarea[a]. Now Cornelius was expecting them and had called together his relatives and close friends.
translation:
  language: am
  text: በማግስቱም ወደ ቂሳርያ ገባ[a]። ቆርኔሌዎስም ዘመዶቹንና የቅርብ ወዳጆቹን ሰብስቦ እነርሱን እየጠበቀ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክ ጽሑፍ “ገባ” የሚለው ግስ ነጠላ ቁጥር ነው፤ ቀጥሎ ያለው “እነርሱን” ግን ብዙ ቁጥር ነው። ይህም ቆርኔሌዎስ ጴጥሮስንና አብረውት የመጡትን ሁሉ ሲጠብቅ፣ ትረካው በዋናው ሰው በጴጥሮስ ላይ እንዳተኮረ ሊያሳይ ይችላል።
    reason: የነጠላውን ግስና የብዙ ቁጥሩን ተውላጠ ስም ልዩነት ለመግለጽ
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: በማግስቱም
  rationale: የቀጣዩን ቀን የሚያመለክተውን የግሪክ ጊዜ አገላለጽ በተፈጥሯዊ አማርኛ ያቀርባል፤ -ም ደግሞ የδέን ቀላል የትረካ ቅጥያ ይይዛል።
- source_word: εἰσῆλθεν
  choice: ገባ
  rationale: ግሱ በነጠላ ቁጥር የተጻፈ በመሆኑ ነጠላውን አገላለጽ ጠብቋል፤ ትኩረቱ በጴጥሮስ ላይ መሆኑን ያሳያል።
- source_word: Καισάρειαν
  choice: ቂሳርያ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የቦታውን ስም ቅርጽ ይጠቀማል።
- source_word: ὁ δὲ Κορνήλιος
  choice: ቆርኔሌዎስም
  rationale: δέ የሚያመለክተውን ቀላል የትረካ ሽግግር -ም በሚለው ቅጥያ ያሳያል፤ ጠንካራ ተቃርኖ አያስገባም።
- source_word: ἦν προσδοκῶν
  choice: እየጠበቀ ነበር
  rationale: የግሪኩን ቀጣይነት ያለው ያለፈ ጊዜ እና በተስፋ መጠበቅን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: αὐτούς
  choice: እነርሱን
  rationale: በምንጩ ያለውን ግልጽ ብዙ ቁጥር ይጠብቃል፤ ጴጥሮስንና አብረውት የመጡትን ያመለክታል።
- source_word: συγκαλεσάμενος
  choice: ሰብስቦ
  rationale: ቆርኔሌዎስ ከመጠበቁ አስቀድሞ ዘመዶቹንና ወዳጆቹን አንድ ላይ እንዳመጣ በአጭርና ተፈጥሯዊ መንገድ ይገልጣል።
- source_word: τοὺς συγγενεῖς αὐτοῦ
  choice: ዘመዶቹን
  rationale: የደም ወይም የቤተሰብ ዝምድና ያላቸውን በዘመናዊና ግልጽ ቃል ይገልጣል።
- source_word: τοὺς ἀναγκαίους φίλους
  choice: የቅርብ ወዳጆቹን
  rationale: ἀναγκαῖος ከφίλος ጋር ሲመጣ ‘አስፈላጊ’ በሚለው ቀጥተኛ ትርጉም ሳይሆን የቅርብ ወይም የታመኑ ወዳጆችን ያመለክታል።
