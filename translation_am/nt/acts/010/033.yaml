base_translation:
  language: en
  yaml_path: translation/nt/acts/010/033.yaml
  text: So I sent for you at once[a], and you did well to come. Now then[b], we are all here before God to hear everything that has been commanded to you by the Lord.
translation:
  language: am
  text: ስለዚህ ወዲያውኑ[a] እንድትመጣ አስጠራሁህ፤ አንተም በመምጣትህ መልካም አደረግህ። አሁን እንግዲህ ጌታ[b] ያዘዘህን ሁሉ ለመስማት ሁላችንም በእግዚአብሔር ፊት እዚህ ተገኝተናል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወዲያው” ወይም “ሳይዘገይ።”
    reason: lexical_alternative
  - marker: b
    text: በግሪክኛው “ጌታ” ይላል። በዐውዱ ይህ ምናልባት ኢየሱስን ያመለክታል፤ አንዳንዶች ግን በአጠቃላይ እግዚአብሔርን እንደሚያመለክት ይረዱታል።
    reason: alternative_reading
