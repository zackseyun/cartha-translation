  rationale: ቃል በቃል ‘ወደ አንተ ላክሁ’ ቢሆንም፣ በዐውዱ ቆርኔሌዎስ መልእክተኞችን ልኮ ጴጥሮስን ማስጠራቱን ያመለክታል።
