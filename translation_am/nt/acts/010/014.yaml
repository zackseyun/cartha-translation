review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Peter’s emphatic refusal, direct address, causal clause, and his claim never to have eaten such food. However, rendering κοινόν as ርኩስ and ἀκάθαρτον as ያልነጻ makes the two closely related ritual categories sound needlessly synonymous in Amharic. The source retains two distinct descriptors.
  naturalness: The sentence is fluent modern standard Amharic. Recasting the paired descriptors as የተለመደና ርኩስ is natural and preserves their distinction without adding interpretation.
  terminology: ጌታ ሆይ and በፍጹም አይሆንም are appropriate. የተለመደ here conveys κοινόν (“common/profane”) while ርኩስ conveys ἀκάθαρτον (“unclean”); the explanatory footnote protects the ritual sense of the first term.
  issues:
  - severity: medium
    issue: The paired terms κοινὸν and ἀκάθαρτον are translated with near-synonymous Amharic expressions.
    rationale: ርኩስ and ያልነጻ both normally communicate uncleanness. κοινόν literally denotes what is common/profane and is distinct from ἀκάθαρτον, even though both occur in a ritual-purity context.
  revised_text: ጴጥሮስ ግን፣ “በፍጹም አይሆንም፣ ጌታ ሆይ! የተለመደና ርኩስ ነገር ፈጽሞ በልቼ አላውቅምና” አለ።
  revised_footnotes:
  - marker: a
    text: “የተለመደ” የሚለው ቃል በዚህ አውድ በሥርዓተ-ንጽሕና መሠረት የተለየ ወይም የተቀደሰ ያልሆነን ማለት ነው።
    reason: Clarifies the ritual sense of κοινόν and distinguishes it from ርኩስ, without resolving the relationship of the two categories beyond the Greek conjunction.
  revision_rationale: The revision preserves the Greek καὶ as “ና,” retains the emphatic negative and causal relationship, and gives the two Greek ritual descriptors distinguishable Amharic renderings. A brief footnote supplies the needed contextual sense of κοινόν without imposing a theological conclusion.
