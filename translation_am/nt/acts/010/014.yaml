  text: ὁ δὲ Πέτρος εἶπεν· Μηδαμῶς, κύριε, ὅτι οὐδέποτε ἔφαγον πᾶν κοινὸν ⸀καὶ ἀκάθαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/014.yaml
  text: But Peter said, “By no means, Lord, because I have never eaten anything common and unclean.”
translation:
  language: am
  text: ጴጥሮስ ግን፣ “በፍጹም አይሆንም፣ ጌታ ሆይ! የተለመደና ርኩስ ነገር ፈጽሞ በልቼ አላውቅምና” አለ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδαμῶς
  choice: በፍጹም አይሆንም
  rationale: ጠንካራውን እምቢታ በተፈጥሯዊና ክብር ባለው ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: κύριε
  choice: ጌታ ሆይ
  rationale: የቀጥታ አድራሻውን ሁኔታና የκύριος መደበኛውን የአማርኛ አቻ ይጠብቃል።
- source_word: κοινὸν
  choice: ርኩስ
  rationale: በዚህ የአይሁድ የምግብ ንጽሕና አውድ κοινός ተራ ከሚለው ይልቅ ለቅዱስ አገልግሎት ያልተለየን፣ በሥርዓት የረከሰን ያመለክታል።
- source_word: ἀκάθαρτον
  choice: ያልነጻ
  rationale: የሥርዓታዊ ንጽሕና እጦትን ያለ ተጨማሪ የእምነት ትርጓሜ ይገልጣል።
- source_word: ὅτι
  choice: አላውቅምና
  rationale: ለጴጥሮስ እምቢታ የተሰጠውን ምክንያት በተፈጥሯዊ የአማርኛ ምክንያታዊ አገባብ ያቀርባል።
- source_word: οὐδέποτε ἔφαγον
  choice: ፈጽሞ በልቼ አላውቅም
  rationale: እስከዚያ ጊዜ ድረስ ፈጽሞ እንዳልበላ የሚያሳየውን የግሪክ አገላለጽ ተፈጥሯዊ በሆነ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: የκοινὸν καὶ ἀκάθαρτον ግንኙነት
  choice: ርኩስና ያልነጻ
  alternative: ርኩስ ወይም ያልነጻ
  rationale: የSBLGNT ንባብ καὶ ነው፤ ስለዚህ የሁለቱን ቃላት ቅንጅት ሳይፈታ በ“እና” ተጠብቋል። ይህም አንድ ነገር ሁለቱንም ባሕርያት መያዙን ወይም ሁለት ተያያዥ ምድቦችን መጥቀሱን በግድ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና በቀላሉ የሚገባ መደበኛ አማርኛ። የግሪኩ ጠንካራ እምቢታ፣ ምክንያታዊ አገናኝ እና καὶ በግልጽ ሁኔታ ተጠብቀዋል።
