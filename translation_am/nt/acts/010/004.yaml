- source_word: ἔμφοβος γενόμενος
  choice: ፈርቶም
  rationale: ወደ ፍርሃት ሁኔታ መግባቱን በአጭርና ተፈጥሯዊ አገላለጽ ይገልጣል፤ ከጽሑፉ በላይ አያጋንንም።
- source_word: Τί ἐστιν
  choice: ምንድን ነው?
  rationale: በዚህ ዐውደ ንባብ መልእክተኛው ምን እንደሚሻ ወይም ጉዳዩ ምን እንደሆነ የሚጠይቅ ቀጥተኛ አገላለጽ ነው።
- source_word: κύριε
  choice: ጌታ ሆይ
  rationale: የክብርና የአድናቆት አድራሻውን ይጠብቃል፤ በዚህ ዐውድ ግን ቃሉ በራሱ ስለ ኢየሱስ የተሟላ እምነት መግለጫን አያስገድድም።
- source_word: προσευχαί
  choice: ጸሎቶችህ
  rationale: የግሪኩን ብዙ ቁጥርና መደበኛ ትርጉም በግልጽ ሁኔታ ይጠብቃል።
- source_word: ἐλεημοσύναι
  choice: ለድሆች የሰጠኸው ምጽዋት
  rationale: ምጽዋት የቃሉ የተለመደ አማርኛ አቻ ነው፤ “ለድሆች የሰጠኸው” የሚለው ሐረግ ዘመናዊ አንባቢዎች የምሕረት ስጦታ ትርጉሙን በግልጽ እንዲረዱ ያደርጋል።
- source_word: ἀνέβησαν
  choice: ወደ ላይ ወጥተዋል
  rationale: ከጸሎትና ከመሥዋዕት ምስል ጋር የተያያዘውን ወደ ላይ የመውጣት ዘይቤ ይጠብቃል።
- source_word: εἰς μνημόσυνον
  choice: መታሰቢያ ሆነው
  rationale: ድርጊቶቹ በእግዚአብሔር ፊት ለመታሰቢያ መቅረባቸውን ያስተላልፋል፤ ጽሑፉ ያልገለጸውን የሥርዓተ መሥዋዕት ዝርዝር አያክልም።
- source_word: ἔμπροσθεν τοῦ θεοῦ
  choice: በእግዚአብሔር ፊት
