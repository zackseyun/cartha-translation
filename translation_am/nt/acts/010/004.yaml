theological_decisions:
- issue: ቆርኔሌዎስ κύριε ብሎ የተናገረበት ኃይል
  choice: ጌታ ሆይ
  alternative: ጌታዬ / ጌታ
  rationale: ይህ ለሰማያዊው መልእክተኛ የቀረበ የክብር አድራሻ ሊሆን ይችላል። “ጌታ ሆይ” የቃሉን ከፍ ያለ መዝገብ ይጠብቃል፤ ነገር ግን አንባቢው ይህን የተሟላ ክርስቶሳዊ እምነት መግለጫ አድርጎ እንዲወስድ ተጨማሪ ትርጉም አያስገባም።
- issue: የጸሎትና የምጽዋት መታሰቢያ ቋንቋ
  choice: መታሰቢያ ሆነው ወደ ላይ ወጥተዋል
  alternative: እግዚአብሔር እንዲያስባቸው ደርሰዋል
  rationale: የመጀመሪያው አገላለጽ የግሪኩን ወደ ላይ መውጣትና መታሰቢያ ዘይቤ ይጠብቃል። አማራጩ በእግዚአብሔር ላይ ቀድሞ ያለመታወስ ሐሳብ ሊያስገባ ስለሚችል አልተመረጠም።
