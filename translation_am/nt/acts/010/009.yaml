  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπαύριον ὁδοιπορούντων ἐκείνων καὶ τῇ πόλει ἐγγιζόντων ἀνέβη Πέτρος ἐπὶ τὸ δῶμα προσεύξασθαι περὶ ὥραν ἕκτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/009.yaml
  text: On the next day[a], while those men were traveling and drawing near to the city, Peter went up on the housetop to pray, about the sixth hour.
translation:
  language: am
  text: በማግስቱ፣ እነዚያ ሰዎች እየተጓዙና ወደ ከተማይቱ ሲቃረቡ፣ ጴጥሮስ ለመጸለይ በስድስተኛው ሰዓት አካባቢ[a] ወደ ጣራው ወጣ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በአይሁድ የቀን ሰዓት አቆጣጠር ይህ እኩለ ቀን አካባቢ ማለት ነው።
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: በማግስቱ
  rationale: የጊዜውን አገላለጽ ‘በሚቀጥለው ቀን’ በተፈጥሯዊና አጭር ዘመናዊ አማርኛ ያቀርባል፤ δέ ያለው ቀላል የትረካ ትስስር በአውዱና በሥርዓተ ነጥቡ ተሸክሟል።
- source_word: ὁδοιπορούντων ἐκείνων
  choice: እነዚያ ሰዎች በመንገድ ላይ ሳሉ
  rationale: የgenitive absolute በአንድ ጊዜ የሚከናወን ድርጊትን ይጠብቃል፤ ‘እነዚያ ሰዎች’ በአውዱ የቆርኔሌዎስን መልእክተኞች በግልጽ ይመለከታል።
- source_word: τῇ πόλει ἐγγιζόντων
  choice: ወደ ከተማይቱ ሲቃረቡ
  rationale: ἐγγίζω ያለውን የመቅረብ ትርጉምና ከቀደመው ተሳቢ ግስ ጋር ያለውን የጊዜ ግንኙነት ይጠብቃል።
- source_word: ἀνέβη
  choice: ወጣ
  rationale: ወደ ቤት ጣራ የሚደረገውን ወደ ላይ እንቅስቃሴ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐπὶ τὸ δῶμα
  choice: ወደ ቤቱ ጣራ
  rationale: δῶμα በዚህ አውድ ሰዎች ሊወጡበት የሚችሉትን ጠፍጣፋ የቤት ጣራ ያመለክታል፤ አማርኛው አገላለጽ ይህን በቀጥታ ያስተላልፋል።
- source_word: προσεύξασθαι
  choice: ለመጸለይ
  rationale: ከἀνέβη በኋላ ያለውን የዓላማ ኢንፊኒቲቭ በተፈጥሯዊ የዓላማ አገላለጽ ይተረጉማል።
- source_word: περὶ ὥραν ἕκτην
  choice: በሰዓት አቆጣጠር ስድስተኛው ሰዓት አካባቢ[a]
  rationale: περί ያለውን ግምታዊነት ‘አካባቢ’ በማለት ይጠብቃል፤ የምንጩን ባህላዊ የሰዓት አቆጣጠር በዋናው ጽሑፍ አቆይቶ ዘመናዊ ማብራሪያውን በግርጌ ማስታወሻ ይሰጣል።
