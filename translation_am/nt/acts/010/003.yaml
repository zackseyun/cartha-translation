id: ACT.10.3
reference: Acts 10:3
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἶδεν ἐν ὁράματι φανερῶς ὡσεὶ ⸀περὶ ὥραν ἐνάτην τῆς ἡμέρας ἄγγελον τοῦ θεοῦ εἰσελθόντα πρὸς αὐτὸν καὶ εἰπόντα αὐτῷ· Κορνήλιε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/003.yaml
  text: He saw clearly in a vision[a], about the ninth hour of the day, an angel of God coming in to him and saying to him[b], “Cornelius.”
translation:
  language: am
  text: ቆርኔሌዎስ በቀኑ ዘጠነኛው ሰዓት ገደማ[a]፣ የእግዚአብሔር መልአክ ወደ እርሱ ሲገባና “ቆርኔሌዎስ” ሲለው በራእይ በግልጽ[b] አየ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በዘመናዊ የሰዓት አቆጣጠር ከሰዓት በኋላ ሦስት ሰዓት ገደማ ማለት ነው።
    reason: cultural_note
  - marker: b
    text: ወይም፣ “በግልጥ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδεν
  choice: አየ
  rationale: የὁράω ቀጥተኛ ትርጉም ሲሆን፣ በትረካው ውስጥ ያለውን የተፈጸመ የማየት ድርጊት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐν ὁράματι
  choice: በራእይ
  rationale: ὅραμα ከእግዚአብሔር የተሰጠ ልዩ እይታን ያመለክታል፤ “በራእይ” ዘዴውን ከሚገባው በላይ ሳይተረጉም በአጭሩ ያቀርበዋል።
- source_word: φανερῶς
  choice: በግልጽ
  rationale: ራእዩ ያልደበዘዘና በግልጥ የታየ መሆኑን ያሳያል፤ ተውሳኩ ከ“አየ” ጋር ያለው ግንኙነት ተጠብቋል።
- source_word: ὡσεὶ περὶ ὥραν ἐνάτην τῆς ἡμέρας
  choice: በቀኑ ዘጠነኛው ሰዓት ገደማ
  rationale: የጥንቱን የሰዓት አቆጣጠር በዋናው ጽሑፍ ይጠብቃል፤ “ገደማ” የὡσεὶ/περὶን ግምታዊነት ያስተላልፋል።
- source_word: ἄγγελον τοῦ θεοῦ
  choice: የእግዚአብሔር መልአክ
  rationale: በራእይ አውድ ውስጥ ἄγγελος ሰማያዊ መልእክተኛን ያመለክታል፤ “መልአክ” መደበኛና ትክክለኛ ምርጫ ነው።
- source_word: εἰσελθόντα πρὸς αὐτὸν
  choice: ወደ እርሱ ገብቶ
  rationale: εἰσελθόντα ወደ ቆርኔሌዎስ መግባቱን ያሳያል፤ የአማርኛው ተከታታይ ግስ የግሪኩን ቦዝ አንቀጽ በተፈጥሯዊ መንገድ ያቀርባል።
- source_word: καὶ εἰπόντα αὐτῷ
  choice: ሲለው
  rationale: ሁለተኛውን ቦዝ አንቀጽ ከዋናው “አየ” ጋር በማያያዝ፣ መልአኩ ለቆርኔሌዎስ መናገሩን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Κορνήλιε
  choice: ቆርኔሌዎስ
  rationale: የΚορνήλιος የጥሪ ቅርጽ ነው፤ በአማርኛ የተለመደው የስሙ ቅርጽ ተጠብቆ፣ የጥሪ ኃይሉ በቀጥተኛ ንግግርና በአጋኖ ምልክት ተገልጧል።
theological_decisions:
- issue: በዚህ አውድ የἄγγελος ማንነት
  choice: ሰማያዊ መልአክ
  alternative: ሰው መልእክተኛ
  rationale: ክስተቱ በራእይ መታየቱና መልእክተኛው “የእግዚአብሔር” መባሉ ሰማያዊ ፍጡር መሆኑን በግልጽ ይደግፋሉ፤ ከጽሑፉ በላይ የሆነ የትምህርተ እምነት ማብራሪያ አልተጨመረም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ለተፈጥሯዊ የአማርኛ ፍሰት የጊዜ ሐረጉና የመልአኩ ድርጊቶች ከዋናው “አየ” በፊት ቀርበዋል። የግሪኩ የጥንት ሰዓት አቆጣጠር በዋናው ጽሑፍ ተጠብቆ ዘመናዊ አቻው በእግር ማስታወሻ ተብራርቷል።
