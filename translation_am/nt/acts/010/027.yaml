  text: ከእርሱም ጋር እየተነጋገረ ወደ ውስጥ ገባ፤ ብዙ ሰዎችም ተሰብስበው እንዳሉ አገኘ[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከእርሱ ጋር እየተነጋገረ ወደ ውስጥ ገባ፤ ብዙ ሰዎችም ተሰብስበው እንዳሉ ያገኛል።” ግሪክኛው ትረካውን ሕያው ለማድረግ “ያገኛል” የሚለውን ታሪካዊ የአሁን ጊዜ ይጠቀማል።
