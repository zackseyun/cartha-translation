  text: Ἔτι λαλοῦντος τοῦ Πέτρου τὰ ῥήματα ταῦτα ἐπέπεσε τὸ πνεῦμα τὸ ἅγιον ἐπὶ πάντας τοὺς ἀκούοντας τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/044.yaml
  text: While Peter was still speaking these words[a], the Holy Spirit fell upon all those hearing the word.
translation:
  language: am
  text: ጴጥሮስ ገና እነዚህን ቃላት እየተናገረ ሳለ፣ ቃሉን በሚሰሙት ሁሉ ላይ መንፈስ ቅዱስ ወረደ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔτι λαλοῦντος τοῦ Πέτρου
  choice: ጴጥሮስ ገና … እየተናገረ ሳለ
  rationale: የግሪኩን በአንድ ጊዜ የቀጠለ ድርጊት የሚገልጽ የጄኒቲቭ አብሶሉት አወቃቀር በተፈጥሯዊ የአማርኛ ጊዜ አንቀጽ ያስተላልፋል።
- source_word: τὰ ῥήματα ταῦτα
  choice: እነዚህን ቃላት
  rationale: የተነገሩትን ቃላት ቀጥታና ግልጽ በሆነ መንገድ ይጠቅሳል።
- source_word: ἐπέπεσε
  choice: ወረደ
  rationale: በመንፈስ ቅዱስ ዐውድ ውስጥ ἐπιπίπτω የሚያሳየውን ድንገተኛ በላያቸው መምጣት በተፈጥሯዊና ክቡር አማርኛ ያቀርባል፤ ‘ወደቀ’ የሚለው ቀጥተኛ አቻ በአማርኛ የተሳሳተ ስሜት ሊሰጥ ይችላል።
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: መንፈስ ቅዱስ
  rationale: በዘመናዊ መደበኛ አማርኛ የተለመደ፣ ግልጽና ክቡር አጠራር ነው።
- source_word: ἐπὶ πάντας τοὺς ἀκούοντας
  choice: በሚሰሙት ሁሉ ላይ
  rationale: የἐπίን በላይ መምጣትና πάντας የሚያሳየውን ሁሉንም አካታችነት ይጠብቃል፤ የአሁን ጊዜ ተሳቢውንም በሚሰሙት ብሎ ያንጸባርቃል።
- source_word: τὸν λόγον
  choice: ቃሉን
  rationale: ከግሪኩ λόγος ጋር ያለውን የቃል ቅርበት ይጠብቃል፤ በዐውዱም ጴጥሮስ የሰበከውን መልእክት ያመለክታል።
theological_decisions:
- issue: የመንፈስ ቅዱስ ድርጊት አተረጓጎም
  choice: መንፈስ ቅዱስ ወረደ
  alternative: መንፈስ ቅዱስ በላያቸው መጣ
  rationale: የሉቃስን ሕያው ትረካዊ ኃይል ይጠብቃል፤ ከጽሑፉ በላይ ስለ መንፈስ ጥምቀት የሃይማኖት ትርጓሜ አያስገባም።
- issue: λόγος በስብከት ዐውድ
  choice: ቃሉን
  alternative: መልእክቱን
  rationale: ቃሉን የሚለው የምንጩን ቅርጽና ሊኖረው የሚችለውን መጽሐፍ ቅዱሳዊ ክብደት ይጠብቃል፤ ዐውዱ ግን የተሰበከውን መልእክት እንደሚያመለክት ግልጽ ነው።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ መደበኛና ክቡር አማርኛን ይጠቀማል። ‘ገና … ሳለ’ የድርጊቶቹን በአንድ ጊዜ መከናወን ተፈጥሯዊ አድርጎ ያሳያል። የእንግሊዝኛው [a] ምልክት ከተሳሳተ ቦታ ጋር የተያያዘ ስለሆነና አማርኛው ‘ወረደ’ ትርጉሙን በግልጽ ስለሚያቀርብ የግድ የሆነ የግርጌ ማስታወሻ አልተጨመረም።
