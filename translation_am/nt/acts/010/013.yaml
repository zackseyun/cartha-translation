  yaml_path: translation/nt/acts/010/013.yaml
  text: 'And a voice came to him: “Get up[a], Peter; kill and eat.”'
translation:
  language: am
  text: አንድ ድምፅም ወደ እርሱ መጣ፤ “ጴጥሮስ ሆይ፣ ተነሥተህ እረድ[a] እና ብላ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሠዋ እና ብላ።” “እረድ” ተብሎ የተተረጎመው ግስ “ሠዋ” ማለትም ሊሆን ይችላል፤ እዚህ ግን በራእዩ አውድ ለምግብ እንስሳን ማረድን የሚያመለክት ይመስላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: መጣ
  rationale: φωνὴ እንደ ባለቤት ሲመጣ፣ ድምፅ ወደ እርሱ መድረሱን በተፈጥሯዊ አማርኛ የሚገልጽ ክስተታዊ አገላለጽ ነው።
- source_word: φωνὴ
  choice: ድምፅ
  rationale: በራእዩ አውድ ውስጥ የሚናገር ድምፅን እንጂ ተራ ድምፀትን አያመለክትም።
- source_word: πρὸς αὐτόν
  choice: ወደ እርሱ
  rationale: ንግግሩ ለጴጥሮስ መቅረቡንና ወደ እርሱ መመራቱን ይገልጻል።
- source_word: Ἀναστάς
  choice: ተነሥተህ
  rationale: የግሪኩ ያለፈ ጊዜ አንቀጸ ግስ ከተከታዮቹ ትእዛዛት ጋር በትእዛዛዊ ቅደም ተከተል ይሠራል፤ በአማርኛም ‘ተነሥተህ … እረድ’ የተፈጥሮ አገላለጽ ነው።
- source_word: Πέτρε
  choice: ጴጥሮስ ሆይ
  rationale: የስሙን የጥሪ ቅርጽ በአማርኛ በግልጽ ለማሳየት ‘ሆይ’ ተጨምሯል።
- source_word: θῦσον
  choice: እረድ
  rationale: በእንስሳትና በመብላት አውድ ውስጥ ለምግብ እንስሳን ማረድ ዋናው ሐሳብ ነው፤ ግሱ የመሠዋት ትርጉምም ሊኖረው ስለሚችል አማራጩ በማስታወሻ ተጠብቋል።
- source_word: φάγε
  choice: ብላ
  rationale: ቀጥተኛ የነጠላ ወንድ ትእዛዝ ሲሆን ‘ብላ’ ትክክለኛና ተፈጥሯዊ ነው።
- source_word: καὶ
  choice: ም / እና
  rationale: የመጀመሪያው καί የትረካውን ቀጣይነት በ‘ም’ ያሳያል፤ በትእዛዞቹ መካከል ያለው καί ደግሞ በ‘እና’ ተተርጉሟል።
theological_decisions:
- issue: θῦσον በመሥዋዕታዊ ቃል ይተርጎም ወይስ ለምግብ እንስሳን በማረድ ቃል?
  choice: በዋናው ጽሑፍ ‘እረድ’ ተብሏል።
  alternative: ‘ሠዋ’ ወይም ‘መሥዋዕት አድርግ’
  rationale: የቅርብ አውዱ እንስሳትን ለመብላት ስለማዘጋጀት እንጂ ሥርዓታዊ መሥዋዕት ስለማቅረብ አይደለም። ሆኖም የግሪኩ ግስ መሥዋዕታዊ ፍቺ ሊኖረው ስለሚችል ይህ አማራጭ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ይጠቀማል። ‘ጴጥሮስ ሆይ’ የጥሪውን ቅርጽ ያስጠብቃል፤ ‘እረድ’ ደግሞ በዚህ አውድ ከአጠቃላዩ ‘ግደል’ ይልቅ ለእንስሳ እርድ ተፈጥሯዊና ትክክለኛ ነው።
