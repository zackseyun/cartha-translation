lexical_decisions:
- source_word: παραγενομένου δὲ αὐτοῦ
  choice: እርሱም በደረሰ ጊዜ
  rationale: የግሪኩ የጄኒቲቭ አብሶሉት አወቃቀር ጊዜያዊውን ሁኔታ ያመለክታል፤ ይህ አተረጓጎም የድርጊቶቹን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: περιέστησαν αὐτὸν
  choice: በዙሪያው ቆመው
  rationale: ግሱ አንድን ሰው ከብቦ ወይም በዙሪያው መቆምን ያመለክታል፤ ይህ ምርጫ የፍርድ ችሎቱን አካላዊ ትዕይንት ያለ አላስፈላጊ ማጋነን ያሳያል።
- source_word: οἱ ἀπὸ Ἱεροσολύμων καταβεβηκότες Ἰουδαῖοι
  choice: ከኢየሩሳሌም የወረዱት አይሁድ
  rationale: Ἰουδαῖοι አይሁድን ወይም የይሁዳ ነዋሪዎችን ሊያመለክት ይችላል፤ እዚህ ግን ከኢየሩሳሌም የመጡ አይሁዳዊ ከሳሾችን ስለሚያመለክት ‘አይሁድ’ ተመርጧል። ‘የወረዱት’ የኢየሩሳሌምን ከፍታና የሉቃስን ጂኦግራፊያዊ አገላለጽ ይጠብቃል።
- source_word: πολλὰ καὶ βαρέα αἰτιώματα
  choice: ብዙና ከባድ ክሶች
  rationale: αἰτιώματα መደበኛ የሕግ ክሶችን ሲያመለክት፣ βαρέα የክሶቹን ክብደትና አሳሳቢነት ያሳያል።
- source_word: καταφέροντες
  choice: በእርሱ ላይ አቀረቡ
  rationale: በሕጋዊ አውድ ግሱ ክስን በአንድ ሰው ላይ ማቅረብን ያመለክታል፤ በአማርኛ ‘ክስ አቀረቡ’ ተፈጥሯዊና ግልጽ ነው።
- source_word: ἃ οὐκ ἴσχυον ἀποδεῖξαι
  choice: ማስረጃ ሊያቀርቡባቸው ያልቻሉትን
  rationale: ἰσχύω ከኢንፊኒቲቭ ጋር ችሎታን ያመለክታል፤ ἀποδείκνυμι ደግሞ በማስረጃ ማረጋገጥን ወይም ማስረዳትን ይገልጣል። ይህ አገላለጽ ክሶቹን በማስረጃ ማጽናት እንዳልቻሉ ያሳያል።
