  rationale: «እርሱ ራሱ» የተውላጠ ስሙን አጽንዖት ያስተላልፋል፤ «ስላለ» ደግሞ ይግባኙ ለመላክ ውሳኔው ምክንያት መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐπικαλεσαμένου
  choice: ይግባኝ ስላለ
  rationale: በሮማዊው የሕግ አውድ ጉዳዩን ወደ ከፍተኛው የንጉሠ ነገሥት ሥልጣን ማቅረብን የሚገልጽ ግልጽና ዘመናዊ የአማርኛ ሕጋዊ አገላለጽ ነው።
- source_word: τὸν Σεβαστόν
  choice: ንጉሠ ነገሥቱን
  rationale: Σεβαστός በዚህ ስፍራ የሮማውን ገዥ ማዕረግ እንጂ ታሪካዊውን አውግስጦስ በስሙ አያመለክትም፤ «ንጉሠ ነገሥት» ለዘመናዊ አንባቢ ተግባሩን በግልጽ ያሳያል።
- source_word: ἔκρινα
