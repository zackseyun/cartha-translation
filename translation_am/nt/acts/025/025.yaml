lexical_decisions:
- source_word: κατελαβόμην
  choice: ተረዳሁ
  rationale: በዚህ የፍርድ አውድ ከምርመራ በኋላ የደረሰበትን ግንዛቤና ውሳኔ ያመለክታል፤ «ተረዳሁ» ትርጉሙን ሳያጠብ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: μηδὲν ἄξιον ... θανάτου
  choice: ሞት የሚገባውን ምንም ነገር
  rationale: የሞት ቅጣት ሊያስከትል የሚገባ ምንም ድርጊት አለመኖሩን ይገልጣል፤ «የሞት ቅጣት» ብሎ በግልጽ ሕጋዊ አገላለጽ ከመተርጎም ይልቅ የግሪኩን ሰፊ አገላለጽ ይጠብቃል።
- source_word: πεπραχέναι
  choice: እንዳላደረገ
  rationale: ፍጹም የግሪክ ግስ ከአሁኑ የፍርድ ግምገማ በፊት የተፈጸመ ድርጊትን ያመለክታል፤ «አደረገ» ሰፊና ተፈጥሯዊ ነው።
- source_word: αὐτοῦ δὲ τούτου ἐπικαλεσαμένου
