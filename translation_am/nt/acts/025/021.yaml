base_translation:
  language: en
  yaml_path: translation/nt/acts/025/021.yaml
  text: But when Paul appealed to be kept in custody for the decision of the Emperor[a], I ordered that he be kept in custody until I send him to Caesar.
translation:
  language: am
  text: ጳውሎስ ግን በንጉሠ ነገሥቱ[a] ውሳኔ በእስር እንዲቆይ ይግባኝ በጠየቀ ጊዜ፣ ወደ ቄሳር እስክልከው ድረስ በእስር እንዲቆይ አዘዝሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በቀጥታ፦ “የተከበረው።” የግሪኩ Σεβαστός ከላቲኑ “አውግስጦስ” ጋር እኩል የሆነ የሮማ ንጉሠ ነገሥት ማዕረግ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλεσαμένου
  choice: ይግባኝ ባለ ጊዜ
  rationale: በሮማውያን የፍርድ አውድ የቀረበ መደበኛ ይግባኝን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል።
- source_word: τηρηθῆναι / τηρεῖσθαι
  choice: በእስር እንዲቆይ
  rationale: ቃሉ በዚህ አውድ መጠበቅን ብቻ ሳይሆን በባለሥልጣን እጅ ታስሮ መቆየትን ያመለክታል፤ በሁለቱም ቦታዎች ወጥነቱ ተጠብቋል።
- source_word: διάγνωσιν
  choice: ውሳኔ
  rationale: የፍርድ ሂደቱን ወይም የመጨረሻ ፍርድን ከልክ በላይ ሳይወስን፣ የባለሥልጣኑን የዳኝነት ውሳኔ በሰፊ ትርጉም ያሳያል።
- source_word: Σεβαστοῦ
  choice: ንጉሠ ነገሥቱ
  rationale: Σεβαστός እዚህ የሮማ ገዢ መዓርግ እንጂ የግል ስም አይደለም። ይህ ምርጫ ለአማርኛ አንባቢ ተፈጥሯዊ ሆኖ የንጉሠ ነገሥቱን ማዕረግ ይገልጻል፤ ቀጥተኛው የግሪክ ማዕረግ በማስታወሻ ተጠብቋል።
- source_word: ἀναπέμψω
  choice: እስክልከው
  rationale: ጳውሎስን ወደ ከፍተኛው የንጉሠ ነገሥት ሥልጣን መላክን በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: πρὸς Καίσαρα
  choice: ወደ ቄሳር
  rationale: ታሪካዊውን የንጉሠ ነገሥት መጠሪያ ይጠብቃል፤ በሐዋርያት ሥራ አውድም የተለመደና ሊገባ የሚችል ነው።
