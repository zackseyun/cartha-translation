base_translation:
  language: en
  yaml_path: translation/nt/acts/025/002.yaml
  text: So the chief priests and the leading men of the Jews presented their case against Paul to him[a], and they urged him,
translation:
  language: am
  text: ከዚያም የካህናት አለቆችና የአይሁድ ታላላቆች በጳውሎስ ላይ ያላቸውን ክስ ለእርሱ አቀረቡ[a]፤ እርሱንም አጥብቀው ለመኑት፣
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ስለ ጳውሎስ አሳወቁት» ወይም «በጳውሎስ ላይ ክስ አቀረቡለት»። የግሪኩ ግስ አንድን ጉዳይ ማሳወቅ ማለት ሊሆን ይችላል፤ በዚህ አውድ ግን የሕግ ጉዳይን ለባለሥልጣን የማቅረብ ፍቺ አለው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεφάνισάν
  choice: ያላቸውን ክስ ... አቀረቡ
  rationale: ግሱ አንድን ጉዳይ ለባለሥልጣን ማሳወቅን ያመለክታል፤ በዚህ የፍርድ አውድ ደግሞ በጳውሎስ ላይ ያላቸውን ጉዳይ እንደ ክስ ማቅረባቸውን ያሳያል። አተረጓጎሙ ግሪኩ በግልጽ ያልጠቀሰውን መደበኛ የክስ ሂደት አያክልም።
- source_word: τέ
  choice: ስለዚህ
  rationale: ቅንጣቱ ይህን ክንውን ከቀደመው የትረካ ፍሰት ጋር ያገናኛል፤ «ስለዚህ» በአማርኛ ይህን ግንኙነት በተፈጥሮ ያሳያል።
- source_word: αὐτῷ
  choice: ለእርሱ
  rationale: በአውዱ ፊስጦስን የሚያመለክት የተዘዋዋሪ ተሳቢ ተውላጠ ስም ነው።
- source_word: οἱ ἀρχιερεῖς
  choice: የካህናት አለቆች
  rationale: የኢየሩሳሌምን ከፍተኛ የክህነት አመራር ቡድን የሚገልጽ የተለመደ አማርኛ አገላለጽ ነው።
- source_word: οἱ πρῶτοι τῶν Ἰουδαίων
  choice: የአይሁድ ታላላቆች
  rationale: πρῶτοι በዚህ ስፍራ በማኅበራዊ ወይም በፖለቲካዊ ደረጃ ጎልተው የሚታዩ ሰዎችን ያመለክታል፤ «ታላላቆች» የክብርና የሥልጣን ደረጃቸውን በተፈጥሮ ይገልጻል።
- source_word: κατὰ τοῦ Παύλου
  choice: በጳውሎስ ላይ
  rationale: κατά ከገቢ አገባብ ጋር እዚህ ተቃዋሚነትንና ክስን ያመለክታል።
- source_word: παρεκάλουν
  choice: አጥብቀው ለመኑት
  rationale: ያልተፈጸመው የግስ ጊዜ ቀጣይ ወይም ተደጋጋሚ ልመናን ያሳያል፤ «አጥብቀው ለመኑት» በፖለቲካዊና በሕጋዊ አውድ ያደረጉትን ጠንካራ ጥያቄ ይገልጻል።
- source_word: αὐτόν
  choice: እርሱን
  rationale: እንደገና ፊስጦስን የሚያመለክት፣ የልመናው ተሳቢ የሆነ ተውላጠ ስም ነው።
