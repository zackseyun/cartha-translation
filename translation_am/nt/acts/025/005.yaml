    rationale: 'συγκαταβάντες is participial but functions with the imperative κατηγορείτωσαν in an exhortation: Festus tells the qualified persons to come/go down with him. In Amharic, ይውረዱ clearly expresses this instruction and prevents the descent from sounding merely antecedent to the accusation.'
