revisions:
- from: ከሳሾቹም ተነሥተው ስለ እርሱ ሲከሱ፣ እኔ እጠረጥራቸው ከነበሩት ክፉ ድርጊቶች[a] አንዱንም ክስ አላቀረቡም፤
