  text: So on the next day, Agrippa and Bernice came with great pomp and entered the audience hall with both the military tribunes and the prominent men of the city, and at Festus's command Paul was brought in.
translation:
  language: am
  text: ስለዚህ በማግስቱ አግሪጳና በርኒቄ በታላቅ ድምቀት[a] መጥተው፣ ከሻለቆችና ከከተማዋ ታዋቂ ሰዎች[b] ጋር ወደ መስሚያ አዳራሹ ገቡ፤ ፊስጦስም ባዘዘ ጊዜ ጳውሎስ ወደ ውስጥ ተወሰደ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በብዙ ግርማ” ወይም “በታላቅ ትዕይንት።”
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “ከከተማዋ ታዋቂ ወንዶች።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ οὖν ἐπαύριον
  choice: ስለዚህ በማግስቱ
  rationale: የጊዜውን አገላለጽና οὖν የሚያሳየውን የትረካ ትስስር በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: ἐλθόντος τοῦ Ἀγρίππα καὶ τῆς Βερνίκης
  choice: አግሪጳና በርኒቄ ... መጥተው
  rationale: የግሪኩን የጄኒቲቭ አብሶሉት አወቃቀር በተፈጥሯዊ የአማርኛ ተውሳከ ግስ ቅርጽ ይገልጻል።
- source_word: μετὰ πολλῆς φαντασίας
  choice: በታላቅ ድምቀት
  rationale: φάντασία በዚህ ዐውድ ሕዝባዊ ሥነ ሥርዓታዊ ግርማንና የውጫዊ ትዕይንትን ያመለክታል፤ ‘ድምቀት’ ይህን በዘመናዊና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: εἰσελθόντων εἰς τὸ ἀκροατήριον
  choice: ወደ መስሚያ አዳራሹ ገቡ
  rationale: ἀκροατήριον ለይፋዊ ችሎት ወይም ለመስማት የተዘጋጀን ስፍራ ያመለክታል፤ ‘መስሚያ አዳራሽ’ የፍርድ ቤት ትርጉምን ከሚገባው በላይ አያስገባም።
- source_word: σύν τε χιλιάρχοις
  choice: ከሻለቆችና
  rationale: χιλίαρχος ከፍተኛ የጦር አዛዥን ያመለክታል፤ ‘ሻለቃ’ በአማርኛ መጽሐፍ ቅዱሳዊና ወታደራዊ አጠቃቀም የተለመደ ተመጣጣኝ ቃል ነው። τε ከሚቀጥለው ቡድን ጋር ያለው ቅንጅት በ‘ከ...ና ከ...’ ተጠብቋል።
- source_word: ἀνδράσιν τοῖς κατ’ ἐξοχὴν τῆς πόλεως
  choice: ከከተማዪቱ ታዋቂ ሰዎች
  rationale: κατ’ ἐξοχήν የክብርና የማኅበራዊ ታዋቂነት ደረጃን ያሳያል። ‘ሰዎች’ በዘመናዊ አማርኛ ተፈጥሯዊ ቢሆንም የግሪኩ ἀνδράσιν በቀጥታ ‘ወንዶች’ ሊባል እንደሚችል በማስታወሻ ተጠቅሷል።
- source_word: κελεύσαντος τοῦ Φήστου
  choice: ፊስጦስም ባዘዘ ጊዜ
  rationale: የፊስጦስን ይፋዊ ትእዛዝ በግልጽና ተፈጥሯዊ የአማርኛ ጊዜያዊ ሐረግ ይገልጻል።
- source_word: ἤχθη ὁ Παῦλος
  choice: ጳውሎስ ወደ ውስጥ ተወሰደ
  rationale: የἄγω ተገብሮ ቅርጽ ጳውሎስ በሌሎች ታጅቦ ወደ አዳራሹ እንደገባ ያሳያል፤ ‘ተወሰደ’ ተገብሮነቱን ይጠብቃል።
