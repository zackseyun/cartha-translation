- from: ጳውሎስም ራሱን ሲከላከል፣ “በአይሁድ ሕግም ላይ፣ በቤተ መቅደሱም ላይ፣ በቄሳርም ላይ ምንም ኃጢአት አልሠራሁም[a]” አለ።
  to: ጳውሎስም ራሱን ሲከላከል፣ “የአይሁድን ሕግ ሆነ ቤተ መቅደሱን ሆነ ቄሳርን በምንም አልበደልሁም[a]” አለ።
