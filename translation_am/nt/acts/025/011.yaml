base_translation:
  language: en
  yaml_path: translation/nt/acts/025/011.yaml
  text: If[a], then, I am doing wrong and have done anything deserving death, I do not refuse to die. But if there is nothing to the things these men are accusing me of, no one can hand me over to them as a favor. I appeal to Caesar.
translation:
  language: am
  text: እንግዲህ በደል እየሠራሁ ከሆነና ለሞት የሚያበቃ አንዳች ነገር ፈጽሜ ከሆነ፣ መሞትን እምቢ አልልም። እነዚህ ሰዎች የሚከሱኝ ነገሮች ምንም መሠረት ከሌላቸው ግን፣ ማንም ለእነርሱ ውለታ ለማድረግ አሳልፎ ሊሰጠኝ አይችልም[a]። ቄሳርን ይግባኝ እላለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እነርሱን ለማስደሰት አሳልፎ ሊሰጠኝ አይችልም።” የግሪኩ ግስ አንድን ሰው እንደ ውለታ መስጠትን ወይም አሳልፎ መስጠትን ያካትታል።
    reason: lexical_alternative
