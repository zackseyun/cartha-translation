  choice: መሞትን አልቃወምም
  rationale: ጥፋተኛ ከሆነ ሞትን ለመቀበል እምቢ እንደማይል በአጭርና በክብር ይገልጣል።
- source_word: οὐδέν ἐστιν ὧν οὗτοι κατηγοροῦσίν μου
  choice: እነዚህ ሰዎች ከሚከሱኝ ነገሮች አንዳችም መሠረት ከሌለው
  rationale: ክሶቹ ምንም ይዘት ወይም መሠረት እንደሌላቸው ያሳያል፤ ‘እውነት’ የሚለውን ቃል ሳይጨምር የግሪኩን አገላለጽ ይጠብቃል።
- source_word: χαρίσασθαι
  choice: ለእነርሱ ውለታ ለማድረግ አሳልፎ ሊሰጠኝ
  rationale: ግሱ አንድን ሰው እንደ ውለታ መስጠትን ያመለክታል፤ በዚህ የፍርድ ዐውድ ጳውሎስን ለከሳሾቹ አሳልፎ መስጠት ነው።
- source_word: Καίσαρα ἐπικαλοῦμαι
  choice: ወደ ቄሳር ይግባኝ እላለሁ
  rationale: ይህ የሮም ዜጋ ወደ ንጉሠ ነገሥቱ የሚያቀርበውን ሕጋዊ ይግባኝ በግልጽ የአማርኛ የሕግ ቃል ይገልጣል።
- source_word: μὲν οὖν ... δὲ
