- source_word: ἄξιον θανάτου πέπραχά τι
  choice: ሞት የሚያስገባ አንዳች ነገር ፈጽሜ
  rationale: የፍርድ ዐውዱንና የፍጹም ጊዜውን ውጤት ያሳያል፤ τι ያለውን ያልተወሰነ ትርጉምም ‘አንዳች ነገር’ በማለት ይጠብቃል።
