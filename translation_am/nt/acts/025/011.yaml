theological_decisions:
- issue: ጳውሎስ ስለ ሞት ቅጣትና ስለ ይግባኝ የተናገረው የፍርድ አንድምታ
  choice: ጳውሎስ በእውነት ሞት የሚያስገባ ጥፋት ካደረገ ሞትን እንደማይቃወም በሁኔታዊ አነጋገር ይናገራል፤ ነገር ግን ገዥው ያለ ፍትሕ ለከሳሾቹ አሳልፎ ሊሰጠው እንደማይችል ያስረግጣል።
  alternative: ጳውሎስ የፍርድ ሂደቱን ሕጋዊነት ምንም ሳይቀበል በንግግር ስልት ብቻ እየተናገረ ነው።
  rationale: ጥቅሱ በዋናነት ሕጋዊ ክርክር ነው። ትርጉሙ ስለ ሞት ያለውን ሁኔታዊ ተቀባይነትና ያለ ፍትሕ አሳልፎ መሰጠትን መቃወሙን ይጠብቃል፤ ከዚህ በላይ ሰፊ የእምነት ድምዳሜ አያስገባም።
