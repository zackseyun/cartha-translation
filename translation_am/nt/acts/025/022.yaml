    text: “እኔም ሰውየውን መስማት እፈልግ ነበር” ተብሎም ሊተረጎም ይችላል፤ καὶ αὐτός አጽንዖትን ወይም “እኔም” የሚል የጭማሪ ትርጉምን ሊያሳይ ይችላል።
