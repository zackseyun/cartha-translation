    reason: lexical_alternative
  - marker: c
    text: “ከእርሱ ትሰማለህ” ተብሎም ሊተረጎም ይችላል፤ የግሪኩ አገላለጽ ሰውየው ራሱ ሲናገር መስማትን ሊያመለክት ይችላል።
