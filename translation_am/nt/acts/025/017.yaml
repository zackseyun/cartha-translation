base_translation:
  language: en
  yaml_path: translation/nt/acts/025/017.yaml
  text: So when they had come together here[a], I made no delay, but on the next day I sat on the judgment seat and ordered the man to be brought.
translation:
  language: am
  text: እንግዲህ እነርሱ እዚህ በተሰበሰቡ ጊዜ፣ ምንም ሳላዘገይ በማግስቱ በፍርድ ወንበር ላይ ተቀምጬ[a] ሰውየው እንዲቀርብ አዘዝኩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በፍርድ መድረኩ ላይ ተቀምጬ” ሊባልም ይችላል። የግሪኩ βῆμα ቃል ባለሥልጣኑ ፍርድ የሚሰጥበትን ወንበር ወይም ከፍ ያለ የፍርድ መድረክ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: συνελθόντων
  choice: በተሰበሰቡ ጊዜ
  rationale: የድርጊቱን ጊዜ የሚገልጸውን የግሪክ አገባብ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ በዐውዱ የተሰበሰቡት ከሳሾቹና ጉዳዩ የሚመለከታቸው ሰዎች ናቸው።
- source_word: οὖν
