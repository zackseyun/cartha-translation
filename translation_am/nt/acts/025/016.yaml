id: ACT.25.16
reference: Acts 25:16
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: πρὸς οὓς ἀπεκρίθην ὅτι οὐκ ἔστιν ἔθος Ῥωμαίοις χαρίζεσθαί τινα ⸀ἄνθρωπον πρὶν ἢ ὁ κατηγορούμενος κατὰ πρόσωπον ἔχοι τοὺς κατηγόρους τόπον τε ἀπολογίας λάβοι περὶ τοῦ ἐγκλήματος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/016.yaml
  text: To them I answered that it is not the custom of the Romans to hand over any man before the accused has the accusers face to face and receives an opportunity for a defense concerning the charge[a][b].
translation:
  language: am
  text: “ተከሳሹ ከሳሾቹ በፊቱ ሳይቀርቡና ስለ ክሱ ራሱን ለመከላከል ዕድል ሳያገኝ፣ ማንንም ሰው አሳልፎ መስጠት[a] የሮማውያን ልማድ አይደለም” ብዬ መለስኩላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እንደ ሞገስ ለሌሎች መስጠት»፤ የግሪክ ግስ የከሳሽን ጥያቄ ለማርካት አንድን ሰው አሳልፎ የመስጠትን ሐሳብ ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθος
  choice: ልማድ
  rationale: የተመሠረተ አሠራርን ወይም ልማድን ያመለክታል፤ «ልማድ» በዚህ የሕግና የአስተዳደር አውድ ግልጽና ተፈጥሯዊ ነው።
- source_word: Ῥωμαίοις
  choice: የሮማውያን
  rationale: የሮማውያንን የፍርድ አሠራር እንደ አንድ የሕግ ሥርዓት ያመለክታል።
- source_word: χαρίζεσθαί
  choice: አሳልፎ መስጠት
  rationale: በአውዱ የከሳሾችን ጥያቄ ለማርካት አንድን ሰው ለእነርሱ አሳልፎ የመስጠትን የፍርድ ትርጉም ያስተላልፋል፤ የ«ሞገስ» ጥላ ትርጉሙ በማስታወሻ ተጠብቋል።
- source_word: τινα ἄνθρωπον
  choice: ማንንም ሰው
  rationale: ቃሉን በቀጥታ ያንጸባርቃል፤ በአማርኛም በዚህ የሕግ አውድ ለማንኛውም ሰው የሚሠራ ተፈጥሯዊ አገላለጽ ነው።
- source_word: ὁ κατηγορούμενος
  choice: ተከሳሹ
  rationale: ክስ የቀረበበትን ሰው በአጭርና በሕጋዊ አውድ ተስማሚ ቃል ይገልጣል።
- source_word: κατὰ πρόσωπον
  choice: ፊት ለፊት
  rationale: ተከሳሹ ከከሳሾቹ ጋር በቀጥታ መጋፈጡን የሚያሳየውን የግሪክ ፈሊጥ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: τόπον ... ἀπολογίας
  choice: ራሱን ለመከላከል ዕድል
  rationale: τόπος እዚህ አካላዊ ቦታ ሳይሆን ዕድልን ያመለክታል፤ ἀπολογία ደግሞ በክስ ፊት የሚቀርብ መከላከያ ነው።
- source_word: ἐγκλήματος
  choice: ክሱ
  rationale: የሕግ ክስን በግልጽና በተለመደ ዘመናዊ አማርኛ ይገልጣል።
