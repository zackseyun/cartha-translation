  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሕግ አገላለጽ ተጠቅሟል። የግሪኩ ረዥም የጊዜ አወቃቀር በተፈጥሯዊ አማርኛ «ሳይገናኝና ... ሳያገኝ» ተተርጉሟል። የእንግሊዝኛው [b] ማስታወሻ በአማርኛ «ማንንም ሰው» የፆታ ግራ መጋባት ስለማይፈጥር አልተካተተም።
