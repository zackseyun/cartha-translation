revisions:
- from: ስለዚህ ፌስጦስ፣ “ጳውሎስ በቂሳርያ በጥበቃ ላይ ነው፤ እኔም ራሴ በቅርቡ ወደዚያ ልሄድ ነው” ብሎ መለሰ።
  to: ፌስጦስ ግን ጳውሎስ በቂሳርያ በቁጥጥር ሥር እንደሚገኝ፣ እርሱ ራሱም በቅርቡ ሊነሣ እንደሆነ መለሰ።
  rationale: The revision preserves the passive custodial sense of τηρεῖσθαι, the location Caesarea, Festus's emphatic self-reference, and the short time frame. It removes the unstated destination and uses indirect reporting consistent with the Greek syntax.
