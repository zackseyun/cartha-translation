  yaml_path: translation/nt/acts/025/004.yaml
  text: Festus therefore answered that Paul was being kept in Caesarea, and that he himself was about to leave shortly.
translation:
  language: am
  text: ፌስጦስ ግን ጳውሎስ በቂሳርያ በቁጥጥር ሥር እንደሚገኝ፣ እርሱ ራሱም በቅርቡ ሊነሣ እንደሆነ መለሰ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τηρεῖσθαι
  choice: በጥበቃ ላይ ነው
  rationale: የግሱን ተገብሮአዊ ትርጉም በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል፤ ጳውሎስ በሥልጣን ሥር ታስሮ እንደተጠበቀ ያመለክታል።
- source_word: εἰς Καισάρειαν
  choice: በቂሳርያ
  rationale: በዚህ አወቃቀር εἰς ከτηρεῖσθαι ጋር ቦታን የሚያመለክት ሲሆን፣ በአማርኛ ‘በቂሳርያ’ የሚለው ግልጽና ተፈጥሯዊ ነው።
- source_word: ἑαυτὸν
  choice: እኔም ራሴ
  rationale: ፌስጦስ ራሱ እንደሚሄድ የሚሰጠውን አጽንዖት ይጠብቃል።
- source_word: ἐν τάχει
  choice: በቅርቡ
  rationale: ‘በአጭር ጊዜ/ቶሎ’ የሚለውን የጊዜ ሐሳብ በተለመደ አማርኛ ያቀርባል።
- source_word: ἐκπορεύεσθαι
  choice: ወደዚያ ልሄድ
  rationale: ቃሉ በመሠረቱ ‘መውጣት/መነሣት’ ማለት ቢሆንም፣ በአውዱ ፌስጦስ ወደ ቂሳርያ ሊጓዝ መሆኑን ተፈጥሯዊ በሆነ አማርኛ ያሳያል።
