  rationale: κἀκεῖ ያለውን ‘በዚያ’ እና κρίνεσθαι ያለውን ሰፊ የሕግ ፍርድ ትርጉም ይጠብቃል፤ ‘ክሱ እንዲታይ’ ብሎ ከማጥበብ ይቆጠባል።
- source_word: περὶ τούτων
