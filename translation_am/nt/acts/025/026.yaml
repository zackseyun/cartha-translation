  - marker: b
    text: “ምርመራ” የሚለው “ችሎት” ወይም “ጥያቄና ማጣራት” ተብሎም ሊተረጎም ይችላል፤ የጳውሎስን ጉዳይ ለማጣራት የሚደረገውን የፍርድ ሂደት ያመለክታል።
