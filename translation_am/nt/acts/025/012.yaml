  yaml_path: translation/nt/acts/025/012.yaml
  text: Then Festus[a], after conferring with the council, answered, “You have appealed to Caesar; to Caesar you will go.”
translation:
  language: am
  text: በዚያን ጊዜ ፌስጦስ ከምክር ቤቱ ጋር ከተማከረ በኋላ፣ “ለቄሳር ይግባኝ ጠይቀሃል፤ ወደ ቄሳር ትሄዳለህ[a]” ብሎ መለሰ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በቄሳር ፊት ትቀርባለህ።” ሐረጉ ይግባኝ ከጠየቀ በኋላ በንጉሠ ነገሥቱ ፍርድ ችሎት ፊት የመቅረብን ሕጋዊ ትርጉም ይዟል።
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: በዚያን ጊዜ
  rationale: የትረካውን ቀጣይ ድርጊት የሚያመለክት ተፈጥሯዊ የጊዜ አገናኝ ነው።
- source_word: συλλαλήσας
  choice: ከተማከረ በኋላ
  rationale: ከዋናው ግስ በፊት የተፈጸመውን የውይይትና የምክክር ተግባር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: μετὰ τοῦ συμβουλίου
  choice: ከምክር ቤቱ ጋር
  rationale: συμβούλιον በዚህ ዐውድ የሚያመለክተውን አማካሪ ወይም ውሳኔ ሰጪ አካል ይገልጻል፤ በግሪኩ ያልተገለጸውን ‘የእርሱ’ የሚል ባለቤትነት አይጨምርም።
- source_word: ἀπεκρίθη
  choice: መለሰ
  rationale: ለፍርድ ቤት ዐውዱ የሚስማማ ግልጽና የተለመደ የትረካ ግስ ነው።
- source_word: Καίσαρα
  choice: ቄሳር
  rationale: የሮማውን መሪ ስም/ማዕረግና የሕግ ዐውዱን ለመጠበቅ በተለመደው የአማርኛ ትርጉም ቅርጽ ቀርቧል።
- source_word: ἐπικέκλησαι
  choice: ይግባኝ ብለሃል
  rationale: ፍጹም ጊዜውንና በሕግ ዐውድ የቄሳርን ሥልጣን በይግባኝ መጠየቅን በዘመናዊ ሕጋዊ አማርኛ ያስተላልፋል።
- source_word: ἐπὶ Καίσαρα
  choice: ወደ ቄሳር
  rationale: ከπορεύσῃ ጋር ሆኖ ወደ ይግባኝ ባለሥልጣኑ መሄድን ያሳያል፤ ‘በቄሳር ፊት’ የሚለው የፍርድ ችሎት ትርጉም በአማራጭነት በማስታወሻ ተጠብቋል።
- source_word: πορεύσῃ
  choice: ትሄዳለህ
  rationale: የወደፊት እንቅስቃሴን ቀጥተኛና ተፈጥሯዊ በሆነ መንገድ ያቀርባል፤ በግሱ ውስጥ በግልጽ ያልተገለጸውን ‘ትላካለህ’ የሚል አንቀጽ አይጨምርም።
