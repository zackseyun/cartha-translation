- source_word: μὴ δεῖν αὐτὸν ζῆν μηκέτι
  choice: ከእንግዲህ በሕይወት ሊኖር አይገባውም
  rationale: δεῖ የሚያሳየውን የግዴታ ወይም የተገቢነት ኃይል ይጠብቃል፤ አነጋገሩን በቀጥታ የሞት ፍርድ ቃል አድርጎ አያጠብበውም።
