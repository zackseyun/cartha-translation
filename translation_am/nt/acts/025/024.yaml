  yaml_path: translation/nt/acts/025/024.yaml
  text: And Festus says[a], “King Agrippa, and all the men present with us, you see this man, about whom the whole body of the Jews petitioned me, both in Jerusalem and here[b], shouting that he ought no longer to live.”
translation:
  language: am
  text: ፌስጦስም እንዲህ አለ፦ “ንጉሥ አግሪጳ፣ ከእኛም ጋር በዚህ የተገኛችሁ ወንዶች ሁሉ፣ ይህን ሰው ታዩታላችሁ። መላው የአይሁድ ሕዝብ[a] ስለ እርሱ በኢየሩሳሌምም ሆነ በዚህ ስፍራ አቤቱታ አቀረቡልኝ፤ ‘ከእንግዲህ በሕይወት ሊኖር አይገባውም’[b] እያሉ ጮኹ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የአይሁድ ብዙ ሕዝብ።” የግሪኩ አገላለጽ ሕዝቡን እንደ አንድ ስብስብ ይጠቅሳል፤ ይህም ፌስጦስ ተቃውሞውን ጠቅልሎ የገለጸበት እንጂ እያንዳንዱ አይሁዳዊ ያለ ልዩነት ተቃወመ ማለት የግድ አይደለም።
