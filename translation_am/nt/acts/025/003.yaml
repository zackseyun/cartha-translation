- source_word: ὅπως μεταπέμψηται αὐτὸν εἰς Ἰερουσαλήμ
  choice: ጳውሎስን ወደ ኢየሩሳሌም እንዲያስመጣው
  rationale: ὅπως ከንዑስ አንቀጽ ጋር የጥያቄውን ይዘት ያሳያል፤ μεταπέμψηται ደግሞ ፊስጦስ ጳውሎስን በሌሎች አማካይነት እንዲመጣ ማድረጉን በ‘እንዲያስመጣው’ ያስረዳል። የግሱ ሌላ ትርጉም በማስታወሻ ተጠብቋል።
- source_word: ἐνέδραν ποιοῦντες
