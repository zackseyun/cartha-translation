- source_word: κατὰ τὴν ὁδόν
  choice: በመንገድም ላይ
  rationale: ጳውሎስ ወደ ኢየሩሳሌም በሚጓዝበት ጎዳና ላይ የታቀደውን ድብቅ ጥቃት በተለመደ አማርኛ ይገልጣል።
theological_decisions:
- issue: የካህናቱ ጥያቄና ድብቅ ዓላማ ግንኙነት
  choice: ጥያቄያቸውን በመጀመሪያ በመግለጽ፣ የግድያ ዕቅዳቸውን ‘አስበው ነበር’ በሚል ተከታይ ሐረግ ማቅረብ
