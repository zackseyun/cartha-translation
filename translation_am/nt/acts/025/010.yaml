  text: ጳውሎስ ግን እንዲህ አለ፦ “ልዳኝ በሚገባበት በቄሳር ፍርድ ወንበር[a] ፊት ቆሜአለሁ[b]። በአይሁድ ላይ ምንም በደል አላደረግሁም[c]፤ አንተም ይህን በሚገባ ታውቃለህ።”
  philosophy: optimal-equivalence
