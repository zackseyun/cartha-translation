  text: ἄλογον γάρ μοι δοκεῖ πέμποντα δέσμιον μὴ καὶ τὰς κατ’ αὐτοῦ αἰτίας σημᾶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/027.yaml
  text: For it seems unreasonable to me[a], when sending a prisoner, not also to indicate the charges against him.
translation:
  language: am
  text: እስረኛን ስልክ፣ በእርሱ ላይ ያሉትን ክሶችም አብሬ አለማመልከት ምክንያታዊ አይመስለኝም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλογον
  choice: ምክንያታዊ እንዳልሆነ
  rationale: ቃሉ ምክንያት ወይም አግባብ የጎደለውን ያመለክታል፤ ይህ አገላለጽ የፊስጦስን አስተዳደራዊ ግምገማ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δοκεῖ μοι
  choice: ይመስለኛል
  rationale: የግሪኩን ግላዊና በመጠኑ ጥንቃቄ ያለበትን ግምገማ በተለመደ ዘመናዊ አማርኛ ይገልጣል።
- source_word: πέμποντα
  choice: ስልክ
  rationale: የአሁን ጊዜው ተሳቢ ግስ ዋናው ፍርድ በሚፈጸምበት ሁኔታ ላይ መሆኑን በአጭርና ተፈጥሯዊ የአማርኛ ጊዜ አንቀጽ ያሳያል።
- source_word: δέσμιον
  choice: እስረኛን
  rationale: በሕጋዊው አውድ በቁጥጥር ሥር ያለን ሰው የሚገልጥ ግልጽና መደበኛ ቃል ነው።
- source_word: μὴ καὶ
  choice: አብሬ አለመግለጼ
  rationale: καί ያለውን ጨማሪ ኃይል ‘አብሬ’ በሚለው ቃል ይጠብቃል፤ እስረኛውን ከክስ መግለጫው ጋር አለመላክ አግባብ እንዳልሆነ ያሳያል።
- source_word: τὰς κατ’ αὐτοῦ αἰτίας
  choice: በእርሱ ላይ የቀረቡትን ክሶች
  rationale: αἰτίαι በዚህ የፍርድ አውድ ‘ክሶች’ ማለት ነው፤ ‘የቀረቡትን’ የሚለው አገላለጽ ክሶቹ በእርሱ ላይ የተነሱ መሆናቸውን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: σημᾶναι
  choice: መግለጽ
  rationale: ‘ማመልከት፣ ማሳወቅ፣ በግልጽ መግለጽ’ የሚለውን የቃሉን ስፋት በመደበኛ የሕግና የአስተዳደር አገላለጽ ያስተላልፋል።
