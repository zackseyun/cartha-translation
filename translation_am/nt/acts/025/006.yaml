base_translation:
  language: en
  yaml_path: translation/nt/acts/025/006.yaml
  text: After spending among them no more than eight or ten days[a], he went down to Caesarea, and on the next day, after taking his seat on the tribunal, he ordered Paul to be brought in.
translation:
  language: am
  text: በመካከላቸው ስምንት ወይም አሥር ቀናት ያልበለጠ ጊዜ ከቆየ በኋላ፣ ወደ ቂሳርያ ወረደ፤ በማግስቱም በፍርድ ወንበሩ ላይ ተቀምጦ[a] ጳውሎስን እንዲያመጡት አዘዘ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በፍርድ መድረኩ ላይ ተቀምጦ።” የግሪኩ βῆμα የባለሥልጣንን የፍርድ መቀመጫ ወይም መድረክ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Διατρίψας δὲ ἐν αὐτοῖς
