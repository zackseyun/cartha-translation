  rationale: የቀደመውን ቆይታ እንደ ጊዜያዊ ቅድመ ድርጊት ያሳያል፤ ἐν αὐτοῖς ደግሞ ‘በመካከላቸው’ ተብሎ ተፈጥሯዊ ሆኖ ተተርጉሟል።
- source_word: ἡμέρας οὐ πλείους ὀκτὼ ἢ δέκα
  choice: ከስምንት ወይም ከአሥር ቀን ያልበለጠ ጊዜ
  rationale: የግሪኩን አሉታዊ ንጽጽርና ‘ስምንት ወይም አሥር’ የሚለውን ግምታዊ አገላለጽ ሳያጠብ ያቆያል።
- source_word: καταβὰς εἰς Καισάρειαν
