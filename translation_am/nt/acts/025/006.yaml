- source_word: καθίσας ἐπὶ τοῦ βήματος
  choice: በፍርድ ወንበሩ ላይ ተቀምጦ
  rationale: βῆμα በዚህ የሕግ አውድ የባለሥልጣኑን የፍርድ መቀመጫ ወይም መድረክ ያመለክታል፤ የተመረጠው አገላለጽ ለዘመናዊ አንባቢ ግልጽ ነው።
- source_word: ἐκέλευσεν τὸν Παῦλον ἀχθῆναι
  choice: ጳውሎስ እንዲቀርብ አዘዘ
  rationale: በፍርድ ሂደት ውስጥ እስረኛው በባለሥልጣናዊ ትእዛዝ እንዲመጣ መደረጉን በተፈጥሯዊ የአማርኛ የሕግ አገላለጽ ያስተላልፋል።
