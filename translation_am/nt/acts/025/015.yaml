  yaml_path: translation/nt/acts/025/015.yaml
  text: Concerning him[a], when I arrived in Jerusalem, the chief priests and the elders of the Jews informed me, asking for a sentence of condemnation against him.
translation:
  language: am
  text: 'እኔ ወደ ኢየሩሳሌም በደረስኩ ጊዜ፣ የአይሁድ የካህናት አለቆችና ሽማግሌዎች ስለ እርሱ አሳወቁኝ፤ በእርሱም ላይ የጥፋተኝነት ፍርድ[a] እንድሰጥ ጠየቁኝ።


    [a] ወይም፣ “በእርሱ ላይ የኩነኔ ፍርድ እንዲሰጥ” ወይም “ጥፋተኛ ነው የሚል ፍርድ እንዲሰጥ።”'
  philosophy: optimal-equivalence
  footnotes:
