  yaml_path: translation/nt/acts/018/022.yaml
  text: And after going down to Caesarea[a], he went up and greeted the church, then went down to Antioch.
translation:
  language: am
  text: ወደ ቂሳርያ ከወረደ በኋላ፣ ወደ ላይ ወጥቶ ቤተ ክርስቲያንን[a] ሰላምታ ሰጠ፤ ከዚያም ወደ አንጾኪያ ወረደ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወደ ላይ ወጥቶ ሰላምታ የሰጣት ቤተ ክርስቲያን ምናልባት በኢየሩሳሌም ያለችው ናት። ብዙ ትርጉሞች እዚህ ‘ኢየሩሳሌም’ ብለው በግልጽ ይጨምራሉ፤ በግሪኩ ጽሑፍ ግን ስሟ አልተጠቀሰም።
    reason: alternative_reading
lexical_decisions:
- source_word: κατελθὼν
  choice: ከወረደ በኋላ
  rationale: የቀደመውን ድርጊት የሚያመለክተውን የአኦሪስት ተሳቢ ግስ በተፈጥሯዊ አማርኛ ያቀርባል፤ የሉቃስን አቅጣጫዊ አነጋገርም ይጠብቃል።
- source_word: Καισάρειαν
  choice: ቂሳርያ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደው የስፍራው ስም ነው፤ ከአውዱ የባሕር ዳርቻዋ ቂሳርያ መሆኗ ይገባል።
- source_word: ἀναβὰς
  choice: ወደ ላይ ወጥቶ
  rationale: የግሪኩን አቅጣጫዊ ትርጉም ይጠብቃል፤ በጽሑፉ ያልተጠቀሰውን ‘ወደ ኢየሩሳሌም’ አይጨምርም።
- source_word: ἀσπασάμενος
  choice: ሰላምታ ሰጠ
  rationale: በዚህ የጉዞ ትረካ ውስጥ ያለውን ‘ሰላምታ ማቅረብ’ የሚለውን ቀጥተኛና ተፈጥሯዊ ትርጉም ይገልጣል።
- source_word: τὴν ἐκκλησίαν
  choice: ቤተ ክርስቲያንን
  rationale: በሐዋርያት ሥራ የክርስቲያኖችን ማኅበረሰብ ለማመልከት በዘመናዊ መደበኛ አማርኛ የተለመደና በአውዱ ግልጽ የሆነ አገላለጽ ነው።
- source_word: κατέβη
  choice: ወረደ
  rationale: የግሪኩን አቅጣጫዊና መልክዓ ምድራዊ አነጋገር በአጭር ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: Ἀντιόχειαν
  choice: አንጾኪያ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደው የስፍራው ስም ነው፤ በዚህ አውድ የሶርያዋ አንጾኪያ መሆኗ ይታወቃል።
theological_decisions:
- issue: ‘ወደ ላይ ወጥቶ’ የሚለው የሚያመለክተውን መድረሻ ኢየሩሳሌም ብሎ መግለጽ ወይም አለመግለጽ
  choice: በዋናው ጽሑፍ መድረሻውን ሳይገልጹ መተው
  alternative: ‘ወደ ኢየሩሳሌም ወጥቶ’ ብሎ በግልጽ መተርጎም
  rationale: የጉዞው ቅደም ተከተልና ‘ቤተ ክርስቲያንን’ ሰላምታ መስጠቱ ኢየሩሳሌምን በጠንካራ ሁኔታ ያመለክታሉ፤ ሆኖም የግሪኩ ጽሑፍ ኢየሩሳሌምን በስም አይጠቅስም። ስለዚህ ዋናው ጽሑፍ አሻሚነቱን ይጠብቃል፣ አይቀርም የሚባለው መረዳት ግን በማስታወሻ ይገለጣል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የሉቃስ አቅጣጫዊ የጉዞ ቃላት ‘ወረደ/ወጣ/ወረደ’ ተጠብቀዋል፤ ግሪኩ ያልገለጸው መድረሻ በዋናው ጽሑፍ አልተጨመረም።
