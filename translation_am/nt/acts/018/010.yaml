  text: because I am with you[a], and no one will attack you to harm you[b], because I have many people in this city.
translation:
  language: am
  text: ምክንያቱም እኔ ከአንተ ጋር ነኝ፤ ማንም ሊጎዳህ በአንተ ላይ አይነሣም[a]፤ በዚህች ከተማ ብዙ ሕዝብ አለኝና[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ማንም ሊጎዳህ እጁን በአንተ ላይ አይጭንም።»
    reason: lexical_alternative
  - marker: b
    text: «በዚህች ከተማ ብዙ ሕዝብ አለኝ» የሚለው ምናልባት፣ ገና የሚያምኑ ሰዎችንም ጨምሮ፣ በቆሮንቶስ የጌታ የሆኑ ብዙ ሰዎችን ያመለክታል።
    reason: cross_reference
lexical_decisions:
- source_word: διότι
  choice: ምክንያቱም / አለኝና
  rationale: በቁጥሩ ውስጥ ሁለት ጊዜ የቀረበውን ምክንያታዊ ግንኙነት ተፈጥሯዊ በሆነ የአማርኛ አገላለጽ ያስተላልፋል።
- source_word: ἐγώ εἰμι μετὰ σοῦ
  choice: እኔ ከአንተ ጋር ነኝ
  rationale: ግልጽ የሆነውን ἐγώ በ«እኔ» በማስቀመጥ አጽንዖቱን ይጠብቃል፤ የመገኘትንም ተስፋ በቀጥታ ያቀርባል።
- source_word: οὐδεὶς
  choice: ማንም … አይ-
  rationale: አሉታዊውን ያልተወሰነ ባለቤት በተፈጥሯዊ የአማርኛ አወቃቀር ያሳያል።
- source_word: ἐπιθήσεταί σοι
  choice: አይነሣብህም
  rationale: በዚህ አውድ በጳውሎስ ላይ የሚደረግን ጠላትነት ያዘለ እርምጃ የሚገልጽ ተፈጥሯዊ አማርኛ ነው፤ «እጁን አይጭንብህም» የሚለው ይበልጥ ቃል በቃል አማራጭ በማስታወሻ ቀርቧል።
- source_word: τοῦ κακῶσαί σε
  choice: ሊጎዳህ
  rationale: የጠላትነት እርምጃውን ዓላማ ወይም ውጤት ያሳያል፤ አካላዊም ሆነ ሌላ ጉዳትን ሊያካትት ይችላል።
- source_word: λαός
  choice: ሕዝብ
  rationale: ለተናጋሪው የሚ属 ሰዎችን በጋራ የሚያመለክተውን ቃል ይጠብቃል፤ ትርጉሙን ወደ «ነዋሪዎች» ብቻ አያጠብም።
- source_word: ἐστί μοι
  choice: አለኝ
  rationale: በግሪክኛው የεἰμί እና የዳቲቭ አገባብ የተገለጸውን የባለቤትነት ሐሳብ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: πολὺς
  choice: ብዙ
  rationale: መጠኑን በቀጥታና በተለመደ ቃል ያስተላልፋል።
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: በዚህች ከተማ
  rationale: πόλιςን «ከተማ» ብሎ ይተረጉማል፤ የቅርብ አመልካቹንም «ዚህች» በማለት ይጠብቃል።
theological_decisions:
- issue: በከተማይቱ ያለው «ብዙ ሕዝብ» ማንነት
  choice: ዋናው ጽሑፍ «በዚህች ከተማ ብዙ ሕዝብ አለኝ» በማለት የግሪክኛውን ክፍት አገላለጽ ይጠብቃል።
  alternative: ይህ በቆሮንቶስ አስቀድመው የጌታ የሆኑትን ብቻ ወይም ለጳውሎስ ደጋፊ የሆኑ ብዙ ሰዎችን እንደሚያመለክት ሊተረጎም ይችላል።
  rationale: በሐዋርያት ሥራ አውድ «ሕዝብ» የጌታ የሆኑትን፣ ገና የሚያምኑትንም ጨምሮ፣ ሊያመለክት ይችላል። ሆኖም ዋናው ትርጉም ይህን በግልጽ ተጨማሪ ቃላት አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የምንጩን ሁለት ምክንያታዊ አንቀጾችና በ«እኔ» ላይ ያለውን አጽንዖት ጠብቋል።
