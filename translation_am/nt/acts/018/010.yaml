  terminology: “ሕዝብ,” “ከተማ,” and “አለኝ” appropriately render λαός, πόλις, and ἐστί μοι. The footnote should retain its tentative explanatory force and avoid the malformed/overly idiomatic construction “ሳይሆን አይቀርም.”
