  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Κρίσπος δὲ ὁ ἀρχισυνάγωγος ἐπίστευσεν τῷ κυρίῳ σὺν ὅλῳ τῷ οἴκῳ αὐτοῦ, καὶ πολλοὶ τῶν Κορινθίων ἀκούοντες ἐπίστευον καὶ ἐβαπτίζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/008.yaml
  text: But Crispus[a], the synagogue ruler, believed in the Lord together with his whole household, and many of the Corinthians, hearing, were believing and were being baptized.
translation:
  language: am
  text: የምኩራቡ አለቃ ቀርስጶስ ግን ከቤተሰቡ ሁሉ ጋር በጌታ አመነ፤ ከቆሮንቶስ ሰዎችም ብዙዎች ሲሰሙ ያምኑና ይጠመቁ ነበር።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም ይበልጥ በተለመደ አነጋገር፦ “ከቆሮንቶስ ሰዎችም ብዙዎች ሰምተው አመኑ፣ ተጠመቁም።” ግሪክኛው ምላሻቸው በሂደት ላይ እንደነበረ የሚያሳዩ የግስ ቅርጾችን ይጠቀማል።
    reason: የግስ ገጽታን የሚጠብቀውን አተረጓጎምና ይበልጥ ፈሳሽ የሆነውን አማራጭ ለማሳየት።
lexical_decisions:
- source_word: Κρίσπος
  choice: ቀርስጶስ
  rationale: የግሪክኛውን የግል ስም በተለመደው የአማርኛ መጽሐፍ ቅዱስ አጻጻፍ ያቀርባል።
- source_word: ἀρχισυνάγωγος
  choice: የምኩራቡ አለቃ
  rationale: የምኩራብን መሪ ኃላፊ ያመለክታል፤ አስተዳደራዊ ዝርዝር ሳይጨምር ሚናውን በግልጽ አማርኛ ይገልጣል።
- source_word: ἐπίστευσεν τῷ κυρίῳ
  choice: በጌታ አመነ
  rationale: የግሪክኛውን πιστεύω ከዳቲቭ ጋር ያለውን አገባብ በተፈጥሯዊ አማርኛ ይገልጣል፤ κύριοςን ያለ ማብራሪያ ‘ጌታ’ ብሎ ይጠብቃል።
- source_word: σὺν ὅλῳ τῷ οἴκῳ αὐτοῦ
  choice: ከቤተሰቡ ሁሉ ጋር
  rationale: οἶκοςን እንደ ሕንፃ ሳይሆን እንደ ቤተሰብ ያቀርባል፤ σύνንና ὅλοςንም በግልጽ ይጠብቃል።
- source_word: πολλοὶ τῶν Κορινθίων
  choice: ከቆሮንቶስ ሰዎችም ብዙዎች
  rationale: የከፊል ዘርፉን ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ከቆሮንቶስ ሕዝብ መካከል ብዙዎች መሆናቸውን ያሳያል።
- source_word: ἀκούοντες
  choice: ሲሰሙ
  rationale: ከሚከተሉት ድርጊቶች ጋር በአንድ ጊዜ የሚካሄድ መስማትን በተፈጥሯዊ መንገድ ያቀርባል፤ በግሪክኛው ያልተገለጸውን የመስማት ነገር አይጨምርም።
- source_word: ἐπίστευον καὶ ἐβαπτίζοντο
  choice: ያምኑና ይጠመቁ ነበር
  rationale: የሁለቱን ያለፈ ጊዜ ቀጣይ/ተደጋጋሚ ገጽታ ይጠብቃል፤ ἐβαπτίζοντο ያለውን ተቀባይ ድምፅም ‘ይጠመቁ’ በማለት ያሳያል።
theological_decisions:
- issue: ‘ከቤተሰቡ ሁሉ ጋር’ የሚለው የእምነት ወሰን
  choice: ሐረጉን በቀጥታ ማቅረብ፣ የእያንዳንዱን የግል እምነት ሁኔታ ወይም የቤተሰቡን የጋራ ውክልና አለመወሰን
  alternative: እያንዳንዱ የቤተሰብ አባል በተመሳሳይ መንገድ በግሉ አመነ ብሎ መግለጽ፣ ወይም ሐረጉን የቤተሰብ የጋራ ማጠቃለያ ብቻ አድርጎ መተርጎም
  rationale: ግሪክኛው ቀርስጶስ ከቤተሰቡ ሁሉ ጋር ማመኑን ይናገራል፣ ግን የእያንዳንዱን ተሳትፎ አይዘረዝርም። ትርጉሙ ይህን ያልተፈታ ውጥረት ይጠብቃል።
- issue: ‘ጌታ’ የሚለው ማንን እንደሚያመለክት
  choice: κύριοςን ‘ጌታ’ ብሎ መተርጎም፣ ‘ጌታ ኢየሱስ’ ብሎ አለማስፋት
  alternative: በሐዋርያት ሥራ ዐውድ መሠረት ‘በጌታ ኢየሱስ’ ማለት
  rationale: ዐውዱ ኢየሱስን ቢያመለክትም፣ በዚህ ጥቅስ ግሪክኛው τῷ κυρίῳ ብቻ ይላል፤ ዋናው ጽሑፍ የምንጩን ማዕረግ ያለ ማስፋት ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። ‘ያምኑና ይጠመቁ ነበር’ የሚለው ትንሽ መደበኛ ቢሆንም የግሪክኛውን ቀጣይ/ተደጋጋሚ ገጽታ በተፈጥሯዊ አማርኛ ያስተላልፋል።
