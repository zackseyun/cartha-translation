  rationale: ቀላል የትረካ ቅጥያውን በተፈጥሯዊ የአማርኛ አያያዥ ቅጥያ ያስተላልፋል።
- source_word: ἀπήλασεν
  choice: አባረራቸው
  rationale: ግሡ በሥልጣን ከቦታው ማስወጣትን ወይም ማባረርን ያመለክታል፤ ይህ ምርጫ እንደ «አሰናበታቸው» ካለ ለስላሳ አገላለጽ ይልቅ የድርጊቱን ጥንካሬ ይጠብቃል።
- source_word: αὐτοὺς
  choice: እነርሱን / -አቸው
  rationale: ተውላጠ ስሙ በዐውዱ ወደ ቀደሙት ወገኖች ይመለሳል፤ ማንነታቸውን ከጽሑፉ በላይ አይወስንም።
- source_word: ἀπὸ τοῦ βήματος
  choice: ከፍርድ ወንበሩ
  rationale: ከይፋዊው የፍርድ መስጫ መቀመጫ ወይም መድረክ አካባቢ መወገዳቸውን ያሳያል።
- source_word: βήματος
  choice: የፍርድ ወንበር
  rationale: በዚህ የሕግ ዐውድ βῆμα የባለሥልጣኑን ይፋዊ የፍርድ መስጫ ወንበር ወይም መድረክ ያመለክታል፤ «የፍርድ ወንበር» ሕጋዊ ትርጉሙን በግልጽ ይጠብቃል።
