  text: καὶ διὰ τὸ ὁμότεχνον εἶναι ἔμενεν παρ’ αὐτοῖς καὶ ⸀ἠργάζετο, ἦσαν γὰρ σκηνοποιοὶ ⸂τῇ τέχνῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/003.yaml
  text: And because he was of the same trade[a], he stayed with them and worked, for they were tentmakers by trade.
translation:
  language: am
  text: ከእነርሱ ጋር አንድ ዓይነት ሙያ ስለነበረው፣ ከእነርሱ ጋር ቆየ፤ ይሠራም ነበር፤ በሙያቸው ድንኳን ሠሪዎች[a] ነበሩና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የቆዳ ሠሪዎች»፤ የግሪኩ ቃል ድንኳን ሠሪዎችን ወይም ከድንኳን ሥራ ጋር ተያያዥ የሆነ የእጅ ሙያ የሚሠሩ ሰዎችን በሰፊው ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ ὁμότεχνον εἶναι
  choice: ሙያቸውም አንድ ስለነበር
  rationale: διά ከአርቲክል ያለው የማድረጊያ ግስ ጋር ምክንያትን ይገልጣል፤ ὁμότεχνος ደግሞ አንድ ዓይነት ሙያ መጋራትን ያመለክታል። ይህ አተረጓጎም ጳውሎስንና አቂላን ከጵርስቅላ ጋር በተመሳሳይ ሙያ ያገናኛል።
- source_word: ἔμενεν παρ’ αὐτοῖς
  choice: ከእነርሱ ጋር ተቀመጠ
  rationale: μένω በዚህ የትረካ አውድ አብሮ መኖርን ወይም መቆየትን ያመለክታል፤ «ተቀመጠ» በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: ἠργάζετο
  choice: አብሯቸውም ይሠራ ነበር
  rationale: የግሪኩ ያልተጠናቀቀ የግስ አቀራረብ ቀጣይ ወይም ተደጋጋሚ ሥራን ያሳያል፤ «ይሠራ ነበር» ይህን ገጽታ ይጠብቃል። «አብሯቸው» በአውዱ ያለውን የጋራ ሥራ በተፈጥሮ ያብራራል።
- source_word: σκηνοποιοὶ
  choice: ድንኳን መሥራት
  rationale: σκηνοποιός በተለምዶ ድንኳን ሠሪን ያመለክታል። ዋናው ጽሑፍ ይህን በጣም የታወቀውንና የሚመስለውን ትርጉም ይዟል፤ ሰፋ ያለው የቆዳ ሥራ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: τῇ τέχνῃ
  choice: ሙያቸው ... ነበር
  rationale: τέχνη የእጅ ጥበብን፣ ሙያን ወይም የሥራ ዘርፍን ያመለክታል። አማርኛው ድንኳን መሥራት መደበኛ ሙያቸው እንደነበር ግልጽ ያደርጋል።
