  text: And he found a Jew named Aquila[a], a native of Pontus, who had recently come from Italy with Priscilla his wife because Claudius had ordered all the Jews to leave Rome; and he went to them.
translation:
  language: am
  text: እርሱም አቂላ የተባለ አንድ አይሁዳዊ አገኘ። አቂላ በትውልድ የጳንጦስ ሰው ነበር፤ ቀላውዴዎስ አይሁድ ሁሉ ከሮም እንዲወጡ[a] ስላዘዘ፣ ከሚስቱ ጵርስቅላ ጋር ከጣሊያን በቅርቡ መጥቶ ነበር። ጳውሎስም ወደ እነርሱ ሄደ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ «አይሁድ ሁሉ ከሮም እንዲባረሩ»። ግሪኩ በቃል ቃል ከሮም መለየትን ይገልጣል፤ በዋናው ጽሑፍ «እንዲወጡ» የሚለው ተፈጥሯዊ አገላለጽ ተጠቅሟል።
