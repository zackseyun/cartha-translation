  rationale: የአኦሪስት ተሳቢው ከሚከተለው ድርጊት በፊት የሆነውን ተግባር ያሳያል፤ በአማርኛ ትረካ ውስጥ «አገኘ» ግልጽና ተፈጥሯዊ ነው።
- source_word: τινα Ἰουδαῖον
  choice: አንድ አይሁዳዊ
  rationale: τινα አንድን ያልተወሰነ ግለሰብ ያስተዋውቃል፤ Ἰουδαῖον እዚህ የብሔርና የሃይማኖት ማንነትን ያመለክታል።
- source_word: ὀνόματι Ἀκύλαν
  choice: አቂላ የተባለ
  rationale: ሰውን በስሙ ለማስተዋወቅ በዘመናዊ አማርኛ የተለመደና ቀጥተኛ አገላለጽ ነው።
- source_word: Ποντικὸν τῷ γένει
  choice: በትውልድ የጳንጦስ ሰው
  rationale: τῷ γένει የትውልድ ወይም የአመጣጥ ስፍራን ያመለክታል፤ ይህ አተረጓጎም ጂኦግራፊያዊ አመጣጡን ግልጽ ያደርጋል።
- source_word: προσφάτως ἐληλυθότα ἀπὸ τῆς Ἰταλίας
  choice: ከጣሊያን በቅርቡ መጥቶ ነበር
  rationale: ፍጹም ተሳቢው ከዋናው የትረካ ድርጊት በፊት በቅርብ ጊዜ የተፈጸመን መምጣት ያሳያል፤ «መጥቶ ነበር» ይህን ቀዳሚነት ይጠብቃል።
- source_word: καὶ Πρίσκιλλαν γυναῖκα αὐτοῦ
  choice: ከሚስቱ ጵርስቅላ ጋር
  rationale: καί በዚህ አገባብ ጵርስቅላ ከአቂላ ጋር ከጣሊያን መምጣቷን ያሳያል፤ «ከ...ጋር» በአማርኛ ይህን ግንኙነት በተፈጥሮ ይገልጣል።
- source_word: διὰ τὸ διατεταχέναι Κλαύδιον
  choice: ቀላውዴዎስ ... ስላዘዘ
  rationale: διά ከጽሑፋዊ የግስ ስም ጋር ምክንያትን ይገልጣል፤ διατάσσω በንጉሠ ነገሥታዊ አገባብ ኦፊሴላዊ ትእዛዝን ያመለክታል።
- source_word: χωρίζεσθαι πάντας τοὺς Ἰουδαίους ἀπὸ τῆς Ῥώμης
  choice: አይሁድ ሁሉ ከሮም እንዲወጡ
  rationale: χωρίζεσθαι ከἀπό ጋር ከሮም መለየትን ያሳያል። «እንዲወጡ» ትእዛዙንና ውጤቱን በተፈጥሯዊ አማርኛ ይገልጣል፤ «እንዲባረሩ» ግን ከግሪኩ ቃል ይልቅ የበረታ ትርጓሜ ስለሆነ አልተመረጠም።
- source_word: προσῆλθεν αὐτοῖς
  choice: ወደ እነርሱ ሄደ
  rationale: προσέρχομαι ወደ ሰዎች መቅረብን ወይም መሄድን ይገልጣል፤ በዚህ የትረካ አቅጣጫ «ወደ እነርሱ ሄደ» ግልጽ ነው።
