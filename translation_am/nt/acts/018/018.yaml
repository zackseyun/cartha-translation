  text: Ὁ δὲ Παῦλος ἔτι προσμείνας ἡμέρας ἱκανὰς τοῖς ἀδελφοῖς ἀποταξάμενος ἐξέπλει εἰς τὴν Συρίαν, καὶ σὺν αὐτῷ Πρίσκιλλα καὶ Ἀκύλας, κειράμενος ⸂ἐν Κεγχρεαῖς τὴν κεφαλήν⸃, εἶχεν γὰρ εὐχήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/018.yaml
  text: After Paul had remained many more days[a], he said farewell to the brothers and sailed away for Syria, and with him were Priscilla and Aquila. In Cenchreae he had his head shaved[e][d][c][b], for he had a vow.
translation:
  language: am
  text: ጳውሎስም ሌሎች ብዙ ቀናት ቆይቶ፣ ወንድሞችን[a] ተሰናብቶ፣ ከጵርስቅላና ከአቂላ ጋር ወደ ሶርያ በመርከብ ተነሣ። ስእለት ነበረበትና፣ በቀንክርያ ራሱን አስላጨ[b][c][d]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃሉ በቀጥታ “ወንድሞች” ይላል፤ በዚህ አውድ ግን ወንዶችንና ሴቶችን የሚያካትተውን የአማኞች ማኅበረሰብ ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ጸጉሩን አስቆረጠ።” የግሪኩ ግስ ጸጉርን መቁረጥን ወይም መሸለትን በአጠቃላይ ሊያመለክት ይችላል፤ ሙሉ በሙሉ መላጨትን ብቻ አያስገድድም።
    reason: lexical_alternative
  - marker: c
    text: ሰዋሰዉ በተፈጥሮ ጳውሎስን ቢያመለክትም፣ አንዳንድ ተርጓሚዎች ጸጉሩን ያስቆረጠውና ስእለቱ የነበረበት አቂላ ነው ይላሉ።
    reason: alternative_reading
  - marker: d
    text: ጽሑፉ “ስእለት” ብቻ ይላል። ብዙዎች ይህን ከናዝራዊ ስእለት ጋር ያያይዙታል፤ ነገር ግን ይህ በግልጽ አልተነገረም።
    reason: cultural_note
lexical_decisions:
- source_word: προσμείνας … ἔτι ἡμέρας ἱκανὰς
  choice: ከዚያ በኋላ ብዙ ቀናት ቆይቶ
  rationale: ἔτι ከቀደመው ቆይታ በተጨማሪ መቆየቱን፣ ἡμέρας ἱκανὰς ደግሞ ብዙ ቀናትን ያመለክታል። ቅደም ተከተሉም ተሳቢው ድርጊት ከዋናው ግስ በፊት መፈጸሙን ይጠብቃል።
- source_word: τοῖς ἀδελφοῖς
  choice: ወንድሞችንና እህቶችን
  rationale: ብዙ ቁጥር ἀδελφοί በክርስቲያናዊው ማኅበረሰብ አጠቃቀም ወንድና ሴት አማኞችን በአንድነት ሊያካትት ይችላል፤ የቤተሰብ ምሳሌውን ለማቆየት “አማኞች” ከማለት ይልቅ ይህ ተመርጧል።
- source_word: ἀποταξάμενος
  choice: ተሰናብቶ
  rationale: መሰናበትን የሚገልጽ ተፈጥሯዊና ክቡር የአማርኛ አገላለጽ ነው።
- source_word: ἐξέπλει εἰς τὴν Συρίαν
  choice: ወደ ሶርያ በመርከብ ሄደ
  rationale: ἐκπλέω በመርከብ መነሳትን ያመለክታል፤ አገላለጹ መጓጓዣውንና መድረሻውን በግልጽ ያስቀምጣል።
- source_word: καὶ σὺν αὐτῷ Πρίσκιλλα καὶ Ἀκύλας
  choice: ጵርስቅላና አቂላም ከእርሱ ጋር ነበሩ
  rationale: የግሪኩን አብሮነት የሚያሳይ ሐረግ እንደ ገለልተኛ አንቀጽ በቅርብ ይወክላል።
- source_word: κειράμενος … τὴν κεφαλήν
  choice: ራሱን አስላጨ
  rationale: κειράμενος ጸጉርን መቁረጥ ወይም መላጨት ሊያመለክት ይችላል፤ ከκεφαλήνና ከስእለቱ አውድ ጋር “ራሱን አስላጨ” የሚለው የተለመደውን ድርጊት በተፈጥሯዊ አማርኛ ያሳያል፣ ሌላው የቃሉ ክልል በማስታወሻ ተጠብቋል።
- source_word: ἐν Κεγχρεαῖς
  choice: በክንክራኦስ
  rationale: የግሪኩን የቦታ ስም Κεγχρεαί በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የሚታወቀውን ቅርጽ ተከትሎ ያቀርባል።
- source_word: εἶχεν γὰρ εὐχήν
  choice: ስእለት ነበረበትና
  rationale: ἔχειν εὐχήν ስእለት በእርሱ ላይ እንዳለ የሚገልጽ ሲሆን፣ አማርኛው የቀጠለ ሁኔታን በተፈጥሯዊ መንገድ ያሳያል። γάρ የምክንያት ግንኙነቱ “-ና” በሚለው ተጠብቋል።
theological_decisions:
- issue: κειράμενος የሚያመለክተው ሰው
  choice: ድርጊቱ ለጳውሎስ ተሰጥቷል።
  alternative: አንዳንዶች ድርጊቱን ከአቂላ ጋር ያያይዙታል።
  rationale: ወንዳዊ ነጠላው κειράμενος በተፈጥሮ ከዋናው የሐረጉ ባለቤት ከጳውሎስ ጋር ይስማማል። ነገር ግን በትርጓሜ ታሪክ የተነሳው ሌላ አስተያየት በማስታወሻ ተጠብቋል።
- issue: የεὐχή ዓይነት
  choice: በአጠቃላይ “ስእለት” ተብሎ ተተርጉሟል።
  alternative: የናዝራዊ ስእለት
  rationale: ጽሑፉ የስእለቱን ዓይነት አይገልጽም። ከናዝራዊ ስእለት ጋር ማያያዝ የሚቻል ቢሆንም፣ ይህን በዋናው ጽሑፍ ላይ መጨመር ከምንጩ በላይ መወሰን ይሆናል።
