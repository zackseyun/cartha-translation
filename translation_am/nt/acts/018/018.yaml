  register: ዘመናዊ፣ ግልጽና ክቡር አማርኛ ተጠቅሟል። የግሪኩ ረጅም ዓረፍተ ነገር ለተነባቢነት በሁለት ተከፍሏል፤ የድርጊቶቹ ቅደም ተከተልና የምክንያት ግንኙነት ተጠብቋል።
