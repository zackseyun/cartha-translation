base_translation:
  language: en
  yaml_path: translation/nt/acts/018/024.yaml
  text: A certain Jew named Apollos[a], an Alexandrian by birth, an eloquent man, arrived in Ephesus, being mighty in the Scriptures.
translation:
  language: am
  text: አጵሎስ የሚባል አንድ አይሁዳዊ፣ የእስክንድርያ ተወላጅ የሆነ አንደበተ ርቱዕ[a] ሰው፣ በቅዱሳት መጻሕፍት የበረታ ሆኖ ወደ ኤፌሶን ደረሰ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የተማረ።” በግሪክኛ λόγιος የሚለው ቃል አንደበተ ርቱዕነትን ወይም የትምህርት ዕውቀትን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰουδαῖος
  choice: አይሁዳዊ
  rationale: በዚህ አውድ ቃሉ የአጵሎስን የዘርና የሃይማኖት ማንነት ያመለክታል፤ መልክዓ ምድራዊውን ‘የይሁዳ ሰው’ አያመለክትም።
- source_word: δέ τις
  choice: አንድ … ነበር
  rationale: τις አዲስ ተሳታፊን በመጠነኛ ያልተወሰነነት ያስተዋውቃል፤ δέ ደግሞ የትረካ ሽግግር ነው። በአማርኛ ይህ በተፈጥሯዊ የዓረፍተ ነገር አወቃቀር ተገልጧል።
- source_word: Ἀπολλῶς ὀνόματι
  choice: አጵሎስ የሚባል
  rationale: የሰውን ስም ለማስተዋወቅ ተፈጥሯዊና የተለመደ የአማርኛ አገላለጽ ነው።
- source_word: Ἀλεξανδρεὺς τῷ γένει
  choice: ትውልዱ የእስክንድርያ የሆነ
  rationale: ሐረጉ የትውልድ ስፍራን ወይም መገኛን ያመለክታል፤ ‘ዘር’ ብሎ መተርጎም ዘመናዊ አንባቢን ሊያሳስት ይችላል።
- source_word: ἀνὴρ λόγιος
  choice: አንደበተ ርቱዕ ሰው
  rationale: ἀνήρ ወንድ ሰውን በግልጽ ያመለክታል፤ λόγιος ደግሞ ‘አንደበተ ርቱዕ’ ወይም ‘የተማረ’ ሊሆን ስለሚችል ዋናው ጽሑፍ የንግግር ችሎታውን ይዟል፣ ሌላውም ትርጉም በማስታወሻ ተጠብቋል።
- source_word: κατήντησεν εἰς Ἔφεσον
  choice: ወደ ኤፌሶን መጣ
  rationale: ግሱ መድረስን ያመለክታል፤ ይህ አገላለጽ በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: δυνατὸς ὢν ἐν ταῖς γραφαῖς
  choice: በመጻሕፍትም እጅግ የበረታ ሆኖ
  rationale: δυνατός የችሎታውን ጥንካሬ ያሳያል፤ γραφαί በዚህ የአይሁድ አውድ ቅዱሳት መጻሕፍትን ያመለክታል።
theological_decisions:
- issue: λόγιος የሚለው ቃል የንግግር ችሎታን ወይስ የትምህርት ዕውቀትን ያመለክታል?
  choice: አንደበተ ርቱዕ
  alternative: የተማረ
  rationale: ሁለቱም በግሪኩ ቃል ሊጠቁሙ ይችላሉ። አውዱ የንግግር ችሎታን ይፈቅዳል፤ ‘በመጻሕፍት የበረታ’ የሚለው ቀጣይ ሐረግም ዕውቀቱን ለብቻው ይገልጻል። ሆኖም የቃሉ እርግጠኛ ያልሆነ ገጽታ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘አንደበተ ርቱዕ’ በቤተ መጻሕፍታዊ አገባብ የታወቀ ቢሆንም አሁንም ሊገባ የሚችልና የተከበረ አገላለጽ ነው።
