  yaml_path: translation/nt/acts/018/021.yaml
  text: but after taking leave and saying[a], “I will return to you again[b], if God wills,” he set sail from Ephesus.
translation:
  language: am
  text: ነገር ግን ተሰናብቶ፣ “እግዚአብሔር ቢፈቅድ[b]፣ እንደገና ወደ እናንተ እመለሳለሁ” ብሎ[a] ከኤፌሶን በመርከብ ተነሣ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች ‘እግዚአብሔር ቢፈቅድ፣ እንደገና ወደ እናንተ እመለሳለሁ’ ብሎ የሚለውን ክፍል አያካትቱም።
    reason: textual_variant
  - marker: b
    text: ወይም፣ ‘በእግዚአብሔር ፈቃድ።’
