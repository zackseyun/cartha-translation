lexical_decisions:
- source_word: ἀλλὰ
  choice: ነገር ግን
  rationale: ከዚህ በፊት ረዘም ላለ ጊዜ እንዲቆይ ከቀረበለት ጥያቄ ጋር ያለውን ንፅፅር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἀποταξάμενος
  choice: ተሰናብቶ
  rationale: የመሰናበትን ተግባርና ከዋናው ግስ በፊት መፈጸሙን በአጭርና ተፈጥሯዊ አገላለጽ ይጠብቃል።
- source_word: καὶ εἰπών
  choice: ብሎ
  rationale: የግሪኩን ሁለተኛ ቦዝ አንቀጽ በተፈጥሯዊ የአማርኛ የንግግር አቀራረብ ያስተላልፋል።
- source_word: Πάλιν
  choice: እንደገና
  rationale: የመመለሱን ድግግሞሽ በግልጽ የሚያሳይ መደበኛ የአማርኛ ቃል ነው።
- source_word: ἀνακάμψω
  choice: እመለሳለሁ
  rationale: የወደፊት መመለስን በቀጥታና በተፈጥሯዊ ሁኔታ ይገልጻል።
- source_word: πρὸς ὑμᾶς
  choice: ወደ እናንተ
  rationale: πρός ከተሳቢ ጋር የሚገልጸውን አቅጣጫ በትክክል ያስተላልፋል።
- source_word: τοῦ θεοῦ θέλοντος
  choice: እግዚአብሔር ከፈቀደ
  rationale: የግሪኩን ግልጽ የቅድመ ሁኔታ ትርጉምና ጉዞው በእግዚአብሔር ፈቃድ ላይ መመርኮዙን ይጠብቃል።
- source_word: ἀνήχθη
  choice: በመርከብ ተነሣ
  rationale: በጉዞ ትረካ ውስጥ ግሱ ያለውን የባሕር ጉዞ መጀመር ትርጉም በግልጽ ያሳያል።
- source_word: ἀπὸ τῆς Ἐφέσου
  choice: ከኤፌሶን
  rationale: ከከተማይቱ መነሣቱን የሚገልጽ መደበኛ አገላለጽ ነው፤ ኤፌሶንም በአማርኛ የተለመደው የስሙ ቅርጽ ነው።
theological_decisions:
- issue: የጳውሎስ የጉዞ ዕቅድና የእግዚአብሔር ፈቃድ
  choice: እግዚአብሔር ከፈቀደ
  alternative: በእግዚአብሔር ፈቃድ
