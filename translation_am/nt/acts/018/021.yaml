translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለመደበኛ አንባቢ ቀላል የሆነ አማርኛ ይጠቀማል። የግሪኩ ቦዝ አንቀጾች ‘ተሰናብቶ’ እና ‘ብሎ’ በሚሉ ተፈጥሯዊ ቅርጾች ተጠብቀዋል፤ የባሕር ጉዞውም እንዳይደበዝዝ ‘በመርከብ’ ተገልጿል።
