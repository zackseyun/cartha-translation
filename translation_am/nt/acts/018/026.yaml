  yaml_path: translation/nt/acts/018/026.yaml
  text: And he began to speak boldly in the synagogue. But when Priscilla and Aquila heard him[a], they took him aside and explained the way of God to him more accurately.
translation:
  language: am
  text: እርሱም በምኩራብ ውስጥ በድፍረት መናገር ጀመረ። ጵርስቅላና አቂላም ሲሰሙት፣ ለብቻው ወሰዱት[a]፤ የእግዚአብሔርንም መንገድ ይበልጥ በትክክል አብራሩለት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከእነርሱ ጋር ወሰዱት” ወይም “ተቀበሉት።” የግሪኩ ግስ አንድን ሰው ወደ ራስ መውሰድን ወይም መቀበልንም ሊያመለክት ይችላል።
