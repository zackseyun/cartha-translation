lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: ከዚህ በኋላ
  rationale: በትረካ ውስጥ የክስተቶችን ቅደም ተከተል በተፈጥሯዊ ዘመናዊ አማርኛ የሚገልጽ ነው፤ ቃል በቃል ‘ከእነዚህ ነገሮች በኋላ’ ማለትም ይቻላል።
- source_word: χωρισθεὶς
  choice: ተነሥቶ
  rationale: ከአንድ ቦታ መለየትንና መሄድን በዚህ ዐውድ በተፈጥሯዊ አማርኛ ያሳያል፤ የግሪኩን የተውሳከ ግስ ቅርጽ በማያስገድድ መንገድ ይወክላል።
- source_word: ἐκ τῶν Ἀθηνῶν
  choice: ከአቴና
  rationale: ἐκ የመነሻ ቦታን ‘ከ’ በማለት ያመለክታል፤ አቴና በአማርኛ የተለመደው የከተማዋ ስም ነው።
- source_word: ἦλθεν
  choice: ሄደ
  rationale: ትረካው ከአቴና ወደ ሌላ ከተማ የተደረገን ጉዞ ስለሚናገር፣ ‘ሄደ’ በአማርኛ የተፈጥሮ አገላለጽ ነው፤ ‘መጣ’ የሚለው መዝገበ ቃላዊ አማራጭ ቢሆንም የትረካውን የእይታ ነጥብ ሊያዛባ ይችላል።
- source_word: εἰς Κόρινθον
  choice: ወደ ቆሮንቶስ
  rationale: εἰς የጉዞውን መድረሻ ያመለክታል፤ ‘ወደ’ ለከተማ ጉዞ የተለመደና ትክክለኛ የአማርኛ አገላለጽ ነው።
