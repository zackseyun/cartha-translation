  text: ⸀κατήντησαν δὲ εἰς Ἔφεσον, κἀκείνους κατέλιπεν αὐτοῦ, αὐτὸς δὲ εἰσελθὼν εἰς τὴν συναγωγὴν ⸀διελέξατο τοῖς Ἰουδαίοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/019.yaml
  text: They came to Ephesus[a], and he left them there[c][b]; but he himself entered into the synagogue and reasoned with the Jews.
translation:
  language: am
  text: 'እነርሱም ወደ ኤፌሶን ደረሱ[a]፤ እርሱም እነዚያን በዚያ ተዋቸው[b]። እርሱ ራሱ ግን ወደ ምኩራብ ገብቶ ከአይሁድ ጋር ተወያየ[c]።


    [a] ወይም፣ “ወደ ኤፌሶን መጡ።”

    [b] “እነዚያን” የሚለው ባለፈው ቁጥር የተጠቀሱትን የጳውሎስ ባልንጀሮች፣ ጵርስቅላንና አቂላን ያመለክታል።

    [c] ወይም፣ “ሐሳብ ተለዋወጠ።” የግሪኩ ቃል በምክንያታዊ ንግግር መወያየትን ያመለክታል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወደ ኤፌሶን መጡ።”
    reason: lexical_alternative
  - marker: b
    text: “እነዚያን” የሚለው ባለፈው ቁጥር የተጠቀሱትን የጳውሎስ ባልንጀሮች፣ ጵርስቅላንና አቂላን ያመለክታል።
    reason: cross_reference
  - marker: c
    text: ወይም፣ “ሐሳብ ተለዋወጠ።” የግሪኩ ቃል በምክንያታዊ ንግግር መወያየትን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: κατήντησαν
  choice: ደረሱ
  rationale: ግሱ ወደ መድረሻ መድረስን ያመለክታል፤ “ደረሱ” በዘመናዊ አማርኛ ተፈጥሯዊና ትክክለኛ ነው።
- source_word: δὲ … δὲ
  choice: -ም … ግን
  rationale: የመጀመሪያው δέ የትረካውን ቀጣይነት በ“-ም” ያሳያል፤ ሁለተኛው ግን ባልንጀሮቹ በዚያ መቅረታቸውንና እርሱ ራሱ ወደ ምኩራብ መግባቱን ያነጻጽራል።
- source_word: κἀκείνους
  choice: እነዚያን
  rationale: የግሪኩን “እነዚያን” የሚል አመልካች ኃይል ይጠብቃል፤ ስሞቹን ወደ ዋናው ጽሑፍ አያስገባም።
- source_word: κατέλιπεν … αὐτοῦ
  choice: በዚያ ተዋቸው
  rationale: καταλείπω በቦታው ትቶ መሄድን፣ αὐτοῦ ደግሞ “በዚያ” የሚለውን የቦታ ሐሳብ ያሳያሉ።
- source_word: αὐτὸς
  choice: እርሱ ራሱ
  rationale: ተውላጠ ስሙ አጽንዖት ያለው ስለሆነ ከተዋቸው ሰዎች ጋር ያለውን ንጽጽር ይጠብቃል።
- source_word: εἰσελθὼν εἰς τὴν συναγωγήν
  choice: ወደ ምኩራብ ገብቶ
  rationale: ቦዝ አንቀጹን ለዋናው ድርጊት ቅድመ ሁኔታ በሚያሳይ ተፈጥሯዊ የአማርኛ አወቃቀር ያቀርባል።
- source_word: διελέξατο
  choice: ተወያየ
  rationale: ቃሉ ምክንያታዊና ምላሽ የሚጠይቅ ንግግርን ያመለክታል፤ “ተወያየ” ከ“ተከራከረ” ያነሰ ጠበኛ ሲሆን የንግግሩን የጋራ ባሕርይ ይጠብቃል።
- source_word: τοῖς Ἰουδαίοις
  choice: ከአይሁድ ጋር
  rationale: የግሪኩን ተቀባይ በአማርኛ ከተውሳከ ግሱ ጋር በተፈጥሯዊ “ከ…ጋር” አወቃቀር ያቀርባል።
