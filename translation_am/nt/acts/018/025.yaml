  text: οὗτος ἦν κατηχημένος τὴν ὁδὸν τοῦ κυρίου, καὶ ζέων τῷ πνεύματι ἐλάλει καὶ ἐδίδασκεν ἀκριβῶς τὰ περὶ τοῦ ⸀Ἰησοῦ, ἐπιστάμενος μόνον τὸ βάπτισμα Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/025.yaml
  text: This man had been instructed in the way of the Lord[a], and being fervent in spirit, he was speaking and teaching accurately the things concerning Jesus, knowing only the baptism of John.
translation:
  language: am
  text: ይህ ሰው የጌታን መንገድ ተምሮ ነበር፤ በመንፈስ ቅንዓት ያለውም ሆኖ፣ ስለ ኢየሱስ የሆኑትን ነገሮች በትክክል ይናገርና ያስተምር ነበር፤ የሚያውቀው ግን የዮሐንስን ጥምቀት ብቻ ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατηχημένος
  choice: ተምሮ ነበር
  rationale: ፍጹም ተደርጎ ያለው አንቀጽ ከዚህ በፊት የተቀበለውን ትምህርትና የቀጠለውን ውጤት ያመለክታል፤ ይህ አተረጓጎም በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን በኋላ የተፈጠረ ቴክኒካዊ የቤተ ክርስቲያን ቃል አያስገባም።
- source_word: τὴν ὁδὸν τοῦ κυρίου
  choice: በጌታ መንገድ
  rationale: ‘መንገድ’ የሚለውን የቀደመው ክርስቲያናዊ አገላለጽ ጠብቆ κύριοςን ‘ጌታ’ ብሎ ይተረጉማል።
- source_word: ζέων τῷ πνεύματι
  choice: በመንፈሱም ቀናተኛ ሆኖ
  rationale: ζέων የመቃጠልን ወይም የመፍላትን ኃይለኛ ቅንዓት ያሳያል። ‘ቀናተኛ’ ተፈጥሯዊ አማርኛ ነው፤ ‘መንፈሱ’ ደግሞ የአጵሎስን ውስጣዊ መንፈስ ወይም መንፈስ ቅዱስን ሊያመለክት የሚችለውን አሻሚነት ይጠብቃል።
- source_word: ἐλάλει καὶ ἐδίδασκεν
  choice: ይናገርና ያስተምር ነበር
  rationale: ሁለቱ ያልተጠናቀቁ ግሶች ቀጣይ ወይም የተለመደ ተግባርን ያሳያሉ፤ የአማርኛው ‘ነበር’ አወቃቀር ይህን ገጽታ ይገልጣል።
- source_word: ἀκριβῶς
  choice: በትክክል
  rationale: ትምህርቱ ትክክለኛና የተጠና መሆኑን ይገልጣል፤ ከዕውቀቱ ውሱንነት ጋር ያለውን የትረካ ውጥረትም ይጠብቃል።
- source_word: τὰ περὶ τοῦ Ἰησοῦ
  choice: ስለ ኢየሱስ የሚመለከቱትን ነገሮች
  rationale: የትምህርቱን ሰፊ ይዘት ሳያጠብ የግሪኩን አገላለጽ በግልጽና በክቡር አማርኛ ያቀርባል።
- source_word: ἐπιστάμενος μόνον τὸ βάπτισμα Ἰωάννου
  choice: የሚያውቀው ግን የዮሐንስን ጥምቀት ብቻ ነበር
  rationale: አሳታፊውን አወቃቀር በተፈጥሯዊ አማርኛ የዕውቀቱን ውሱንነት በሚያሳይ ሁኔታ ይገልጣል። ‘ግን’ ከትክክለኛ ትምህርቱ ጋር ያለውን በዐውደ ንባቡ የሚታየውን ንጽጽር ያሳያል።
theological_decisions:
- issue: በζέων τῷ πνεύματι ውስጥ τῷ πνεύματι የሚያመለክተው
  choice: የአጵሎስ ውስጣዊ መንፈስ/ቅንዓት
  alternative: መንፈስ ቅዱስ
  rationale: የግሪኩ ሐረግ ሁለቱንም ንባቦች ሊፈቅድ ይችላል። ዋናው ጽሑፍ ‘በመንፈሱ’ በማለት የሰውን ውስጣዊ ቅንዓት በቅድሚያ ያቀርባል፤ አማራጩን ግን በማስታወሻ በመግለጽ ሥነ መለኮታዊውን አሻሚነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር መደበኛ አማርኛ ተጠቅሟል። የግሪኩ የቀጣይ ተግባር ገጽታ በ‘ይናገርና ያስተምር ነበር’ ተጠብቋል፤ በ‘መንፈስ’ ላይ ያለው አሻሚነት በዋናው ጽሑፍና በግርጌ ማስታወሻ ቀርቧል።
