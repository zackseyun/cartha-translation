  yaml_path: translation/nt/acts/018/011.yaml
  text: So he stayed there a year and six months, teaching the word of God among them.
translation:
  language: am
  text: እርሱም በመካከላቸው የእግዚአብሔርን ቃል እያስተማረ አንድ ዓመትና ስድስት ወራት ቆየ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάθισεν
  choice: በዚያ ቆየ
  rationale: ግሱ በቀጥታ ‘ተቀመጠ’ ሊል ቢችልም፣ በዚህ የትረካ አውድ ለተወሰነ ጊዜ በአንድ ስፍራ መቆየትን ያመለክታል።
- source_word: δὲ
  choice: ስለዚህ
  rationale: ይህ ቀላል አያያዥ ነው፤ ከቀደመው መለኮታዊ ማበረታቻ በኋላ የተከተለውን የጳውሎስ ተግባር በተፈጥሯዊ ሁኔታ ያገናኛል።
- source_word: ἐνιαυτὸν καὶ μῆνας ἓξ
  choice: አንድ ዓመት ከስድስት ወር
  rationale: የቆይታውን ጊዜ በዘመናዊና ተፈጥሯዊ አማርኛ በቀጥታ ይገልጣል።
- source_word: διδάσκων
  choice: እያስተማረ
  rationale: የአሁን ጊዜ አሳታፊው ከመቆየቱ ጋር በአንድ ጊዜ የቀጠለውን የማስተማር ተግባር ያሳያል።
- source_word: ἐν αὐτοῖς
  choice: በመካከላቸው
  rationale: ἐν ከወሰን ተውላጠ ስም ጋር እዚህ ማኅበራዊና ስፍራዊ ትርጉም አለው፤ ጳውሎስ በማኅበረሰቡ መካከል ሲያገለግል እንደነበር ያሳያል።
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: የእግዚአብሔርን ቃል
  rationale: በሐዋርያት ሥራ ውስጥ λόγος ብዙ ጊዜ ከእግዚአብሔር የሚታወጅውን መልእክት ያመለክታል፤ ይህ አገላለጽ የተለመደውን መጽሐፍ ቅዱሳዊ ቃልና ሥነ መለኮታዊ ድምፁን ይጠብቃል።
