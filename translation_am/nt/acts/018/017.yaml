language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐπιλαβόμενοι δὲ ⸀πάντες Σωσθένην τὸν ἀρχισυνάγωγον ἔτυπτον ἔμπροσθεν τοῦ βήματος· καὶ οὐδὲν τούτων τῷ Γαλλίωνι ⸀ἔμελεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/017.yaml
  text: Then they all seized Sosthenes[a], the synagogue ruler, and beat him in front of the tribunal. But Gallio paid no attention to these things.
translation:
  language: am
  text: ከዚያም ሁሉም የምኩራቡን አለቃ ሶስቴኔስን[a] ይዘው በፍርድ ወንበሩ ፊት ይደበድቡት ነበር። ጋልዮ ግን ለእነዚህ ነገሮች ምንም ግድ አልሰጠም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች ‘ሁሉም’ ብቻ ከማለት ይልቅ ‘ግሪኮች ሁሉ’ ይላሉ። እጅግ ጥንታዊው ጽሑፍ አጭር ሲሆን የቡድኑን ማንነት አይገልጽም።
    reason: textual_variant
lexical_decisions:
- source_word: ἐπιλαβόμενοι
  choice: ይዘው
  rationale: ጠላትነት ባለበት ሁኔታ አጥብቆ መያዝን ያመለክታል፤ ‘ይዘው’ በዐውዱ ውስጥ ተፈጥሯዊና ግልጽ ነው።
- source_word: πάντες
  choice: ሁሉም
  rationale: ቃሉ ቡድኑን በስም ሳይለይ ሁሉን የሚያጠቃልል ኃይል አለው፤ የግሪኩን ያልተወሰነ ማጣቀሻ ይጠብቃል።
- source_word: ἀρχισυνάγωγον
  choice: የምኩራቡን አለቃ
  rationale: በምኩራብ ውስጥ ያለውን መሪ ባለሥልጣን በተለመደና ግልጽ አማርኛ ይገልጣል።
- source_word: ἔτυπτον
  choice: ይደበድቡት ነበር
  rationale: የግሪኩ ያልተፈጸመ ያለፈ ጊዜ ቅርጽ ቀጣይነት ወይም ተደጋጋሚ መምታትን ያሳያል፤ ይህ አገላለጽ ያንን ገጽታ ይጠብቃል።
- source_word: ἔμπροσθεν τοῦ βήματος
  choice: በፍርድ ወንበሩ ፊት
  rationale: βῆμα ገዥው ፍርድ የሚሰጥበትን ሕጋዊ መድረክ ያመለክታል፤ ‘የፍርድ ወንበር’ በአማርኛ የሕግ ዐውዱን በግልጽ ያስተላልፋል።
- source_word: οὐδὲν τούτων … ἔμελεν
  choice: ለዚህ ሁሉ ምንም ትኩረት አልሰጠም
  rationale: የግሪኩን ፈሊጣዊ ትርጉም፣ ጉዳዩ ለጋልዮስ እንዳላሳሰበው፣ በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: δέ … καί
  choice: ከዚያም … ግን
  rationale: የመጀመሪያውን የትረካ ሽግግርና በድብደባው እና በጋልዮስ ቸልተኝነት መካከል ያለውን ንፅፅር በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: የπάντες (‘ሁሉም’) ማንነት
  choice: በዋናው ጽሑፍ ‘ሁሉም’ ተብሎ ቡድኑ ሳይለይ ቀርቷል።
  alternative: ‘ግሪኮች ሁሉ’ ወይም ‘አይሁድ ሁሉ’ ብሎ መለየት
  rationale: የSBLGNT ጽሑፍ πάντες ብቻ ይላል፣ ግልጽ ስም አይሰጥም። አንዳንድ የእጅ ጽሑፎች ‘ግሪኮች ሁሉ’ የሚል ንባብ ቢኖራቸውም፣ ዋናው ትርጉም የምንጩን አሻሚነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ይደበድቡት ነበር’ የድርጊቱን ቀጣይነት ይጠብቃል፤ የሕዝቡ ማንነት ግን ከምንጩ በላይ አልተወሰነም።
