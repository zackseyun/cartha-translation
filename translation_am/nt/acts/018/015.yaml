  text: εἰ δὲ ⸀ζητήματά ἐστιν περὶ λόγου καὶ ὀνομάτων καὶ νόμου τοῦ καθ’ ὑμᾶς, ὄψεσθε αὐτοί· ⸀κριτὴς ἐγὼ τούτων οὐ βούλομαι εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/015.yaml
  text: But if these are questions about a word and names and your own law[a], you yourselves will see to it; I do not want to be a judge of these things.
translation:
  language: am
  text: ነገር ግን ጥያቄዎች ስለ ቃል[a]፣ ስለ ስሞችና ስለ የእናንተ ሕግ ከሆኑ፣ እናንተው ራሳችሁ ተመልከቱት፤ እኔ በእነዚህ ነገሮች ላይ ፈራጅ መሆን አልፈልግም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ስለ መልእክት” ወይም “ስለ ትምህርት”። የግሪክኛው λόγος ሰፊ ትርጉም ያለው ቃል ሲሆን፣ ክርክር የተነሣበትን ትምህርት ወይም አጠራር ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήματά
  choice: ጥያቄዎቹ
  rationale: ቃሉ በምርመራ ወይም በክርክር ላይ ያሉ ጉዳዮችን ያመለክታል። “ጥያቄዎቹ” የፍርድ ሂደቱን ዐውድ ሳያጠፋ ጥላቻን አላስፈላጊ ሁኔታ አያጎላም።
- source_word: περὶ λόγου
  choice: ስለ ቃል
  rationale: λόγος ሰፊ የትርጉም ክልል ስላለው፣ “ቃል” ምንጩን በቅርብ ይከተላል፤ መልእክትን፣ ትምህርትን ወይም አጠራርን ብቻ በመምረጥ አሻሚነቱን አያስወግድም።
- source_word: ὀνομάτων
  choice: ስለ ስሞች
  rationale: ቀጥተኛውን ብዙ ቁጥር ይጠብቃል፤ ስሞቹ ወይም መጠሪያዎቹ በትክክል ምንን እንደሚያመለክቱ ሳይወስን ይተዋል።
- source_word: νόμου τοῦ καθ’ ὑμᾶς
  choice: ስለ ራሳችሁ ሕግ
  rationale: ገሊዮስ ጉዳዩን ከሮም ፍትሐ ብሔር ሥልጣን ለይቶ የከሳሾቹ ማኅበረሰብ ሕግ እንደሆነ የሚያሳየውን ርቀት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὄψεσθε αὐτοί
  choice: ጉዳዩን እናንተው ራሳችሁ ተመልከቱት
  rationale: የግሪክኛው የወደፊት ጊዜ መካከለኛ ቅርጽ በዚህ ዐውድ “ራሳችሁ አስተናግዱት” የሚል ተግባራዊ ኃይል አለው። የአማርኛው ትእዛዛዊ አነጋገር ይህን ፈሊጣዊ ትርጉምና የαὐτοίን አጽንዖት በተፈጥሮ ያሳያል።
- source_word: κριτὴς
  choice: ፈራጅ
  rationale: የፍርድ ቤቱን ዐውድና ገሊዮስ ጉዳዩን ለመዳኘት አለመፈለጉን በግልጽ ያሳያል።
- source_word: οὐ βούλομαι εἶναι
  choice: መሆን አልፈልግም
  rationale: የβούλομαιን ፈቃድና ምርጫ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል፤ ንግግሩን እንደ መደበኛ ሕጋዊ ውሳኔ ከሚገባው በላይ አያጠናክርም።
theological_decisions:
- issue: ገሊዮስ λόγος በማለት ያመለከተው ነገር
  choice: ልዩ የሥነ መለኮት ይዘት ሳይወሰን “ቃል” ተብሎ ተተርጉሟል።
  alternative: “መልእክት፣” “ትምህርት፣” ወይም “አስተምህሮ”
  rationale: ጥቅሱ ገሊዮስ በአይሁድ ውስጣዊ ክርክር ላይ ለመፍረድ አለመፈለጉን ያሳያል፤ λόγος በዚህ ስፍራ በግልጽ አልተወሰነም። ስለዚህ ትርጉሙ አሻሚነቱን ይጠብቃል፣ ዋና አማራጮቹንም በግርጌ ማስታወሻ ያቀርባል።
