  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “እናንተው ራሳችሁ” የምንጩን አጽንዖት ይጠብቃል፤ “ፈራጅ” ደግሞ የፍርድ ዐውዱን በተፈጥሮ ያሳያል።
