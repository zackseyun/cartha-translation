base_translation:
  language: en
  yaml_path: translation/nt/acts/018/027.yaml
  text: And when he wanted to go across to Achaia[a], the brothers encouraged him and wrote to the disciples to welcome him. When he arrived[b], he greatly helped those who had believed through grace.
translation:
  language: am
  text: እርሱም ወደ አካይያ ተሻግሮ መሄድ በፈለገ ጊዜ፣ ወንድሞች[b] አበረታቱት፤ ለደቀ መዛሙርቱም እንዲቀበሉት ጻፉ። ሲደርስም፣ በጸጋ አምነው የነበሩትን[a] እጅግ ረዳቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በጸጋ እጅግ ረዳቸው፤ እነርሱም አምነው የነበሩ ናቸው።” ‘በጸጋ’ የሚለው የግሪክ ሐረግ አማኞቹ ካመኑበት መንገድ ይልቅ አጵሎስ ከሰጣቸው እርዳታ ጋር ሊያያዝ ይችላል።
    reason: alternative_reading
  - marker: b
    text: “ወንድሞች” የሚለው ቃል ሴቶችንም ጨምሮ ሰፊውን የአማኞች ማኅበረሰብ ሊያመለክት ይችላል፤ የግሪኩ ቃል ግን በተባዕታይ ብዙ ቁጥር ቅርጽ ነው።
    reason: lexical_alternative
