id: ACT.18.23
reference: Acts 18:23
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ποιήσας χρόνον τινὰ ἐξῆλθεν, διερχόμενος καθεξῆς τὴν Γαλατικὴν χώραν καὶ Φρυγίαν, ⸀στηρίζων πάντας τοὺς μαθητάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/023.yaml
  text: And after spending some time there[a], he departed and traveled from place to place through the Galatian region and Phrygia, strengthening all the disciples.
translation:
  language: am
  text: በዚያም ጥቂት ጊዜ ካሳለፈ በኋላ ተነሣ፤ በቅደም ተከተል በገላትያ አገርና በፍርግያ እያለፈ ደቀ መዛሙርቱን ሁሉ አበረታታ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιήσας χρόνον τινά
  choice: በዚያም ጥቂት ጊዜ ካሳለፈ በኋላ
  rationale: ποιέω ከ χρόνον ጋር ሲገናኝ ‘ጊዜ ማሳለፍ’ የሚለውን ፈሊጣዊ ትርጉም ይሰጣል። ‘በዚያ’ የሚለው ቀደም ሲል የተጠቀሰውን ስፍራ ከዐውደ ንባቡ ያመለክታል።
- source_word: ἐξῆλθεν
  choice: ተነሣ
  rationale: በጉዞ ትረካ ውስጥ ከአንድ ስፍራ ተነሥቶ መሄድን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: διερχόμενος
  choice: እየተጓዘ
  rationale: በክልሎቹ ውስጥ ቀጣይነት ያለውን መንቀሳቀስ በግልጽና ተፈጥሯዊ ቋንቋ ይገልጣል።
- source_word: καθεξῆς
  choice: በየቦታው
  rationale: ጉዞው በቅደም ተከተል ከአንድ ስፍራ ወደ ሌላ መካሄዱን በተለመደ አማርኛ ያስተላልፋል።
- source_word: τὴν Γαλατικὴν χώραν
  choice: በገላትያ አገር
  rationale: χώρα ሰፊ አካባቢን፣ አገርን ወይም ክልልን ሊያመለክት ስለሚችል ‘አገር’ የቦታውን ሰፊ ትርጉም ይጠብቃል፤ የሮምን አስተዳደራዊ ክፍለ ሀገር ብቻ እንደሚያመለክትም አይወስንም።
- source_word: καὶ Φρυγίαν
  choice: እና በፍርግያ
  rationale: የስፍራው ስም በአማርኛ ድምፅ ተጽፏል፤ χώρα በትርጉም ለሁለቱም ስፍራዎች እንደሚሠራ ተቆጥሯል።
- source_word: στηρίζων
  choice: አበረታታ
  rationale: στηρίζω ማጽናትን፣ ማበርታትን ወይም ማጽናናትን ሊገልጥ ይችላል። እዚህ ‘አበረታታ’ የደቀ መዛሙርቱን እምነትና ጽናት የማጠናከር ሰፊ ሐሳብ ይጠብቃል።
- source_word: πάντας τοὺς μαθητάς
  choice: ደቀ መዛሙርቱን ሁሉ
  rationale: ‘ደቀ መዛሙርት’ በሐዋርያት ሥራ የኢየሱስን ተከታዮች የሚጠራበት የተለመደ ቃል ሲሆን፣ ‘ሁሉ’ πάνταςን በግልጽ ያስተላልፋል።
