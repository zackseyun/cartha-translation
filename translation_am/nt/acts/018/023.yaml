  to: በዚያም ጥቂት ጊዜ ካሳለፈ በኋላ ተነሣ፤ በቅደም ተከተል በገላትያ አገርና በፍርግያ እያለፈ ደቀ መዛሙርቱን ሁሉ አበረታታ።
