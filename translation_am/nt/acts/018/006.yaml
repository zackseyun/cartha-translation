  text: እነርሱ ግን ሲቃወሙና ሲሳደቡ[a]፣ ልብሶቹን አራግፎ እንዲህ አላቸው፤ “ደማችሁ በራሳችሁ ላይ ይሁን![b] እኔ ንጹሕ ነኝ። ከእንግዲህ ወዲህ ወደ አሕዛብ[c] እሄዳለሁ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እግዚአብሔርን ሲሳደቡ።” የግሪኩ ግስ የስድብ ንግግርን ወይም ስድበ እግዚአብሔርን ሊያመለክት ይችላል፤ በዚህ አውድ ጳውሎስንና መልእክቱን የሚመለከት በጥላቻ የተሞላ ስድብ መሆኑ ይታያል።
    reason: lexical_alternative
  - marker: b
    text: “ደማችሁ በራሳችሁ ላይ ይሁን” ማለት፣ ለሚመጣው ውጤት ኃላፊነቱ የእነርሱ ነው ማለት ነው።
    reason: cultural_note
  - marker: c
