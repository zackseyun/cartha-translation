  text: የአካባቢውም ሰዎች[a] ከተለመደው ያለፈ ቸርነት[b] አሳዩን፤ ዝናብ ስለጣለና ብርድም ስለነበር፣ እሳት አንድደው ሁላችንንም ተቀበሉ።
  philosophy: optimal-equivalence
  footnotes:
