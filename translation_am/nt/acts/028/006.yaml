lexical_decisions:
- source_word: προσεδόκων
  choice: ይጠብቁ ነበር
  rationale: ያልተፈጸመን ነገር በተከታታይ በመጠባበቅ የነበራቸውን ግምት የኢምፐርፌክት ጊዜውን ገጽታ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: πίμπρασθαι
  choice: ሰውነቱ ያብጣል
  rationale: በእባብ ንክሻ አውድ ቃሉ የሰውነትን ማበጥ ያመለክታል፤ “ሰውነቱ” መጨመሩ በአማርኛ ግልጽ ያደርገዋል።
- source_word: καταπίπτειν ἄφνω νεκρόν
  choice: በድንገት ወድቆ ይሞታል
  rationale: ድንገተኛ መውደቁንና የሞት ውጤቱን በግልጽና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐπὶ πολὺ
  choice: ረጅም ጊዜ ከጠበቁ
  rationale: ለረጅም ጊዜ በትኩረት ሲጠባበቁ መቆየታቸውን ከአገባቡ ጋር ተስማሚ በሆነ የጊዜ ንዑስ ሐረግ ይገልጻል።
- source_word: θεωρούντων
  choice: ካዩ
  rationale: በትኩረት ተመልክተው ያስተዋሉትን ውጤት በአጭርና ተፈጥሯዊ አገላለጽ ያቀርባል።
- source_word: μηδὲν ἄτοπον
  choice: ምንም ያልተለመደ ነገር
  rationale: ἄτοπος ሊይዘው የሚችለውን “ያልተለመደ፣ ከተራው ውጭ፣ ያልተገባ” የሚለውን ሰፊ ፍቺ አንዱን ብቻ ሳይጫን ያቆያል።
- source_word: μεταβαλόμενοι
  choice: ሐሳባቸውን ቀይረው
  rationale: ቀድሞ የነበራቸውን ፍርድ በመቀየር ወደ ሌላ ድምዳሜ መድረሳቸውን ግልጽ ያደርጋል።
- source_word: ἔλεγον
  choice: ይሉ ጀመር
  rationale: ኢምፐርፌክቱ ሊያመለክት የሚችለውን የንግግሩን መጀመርና ቀጣይነት ይይዛል።
- source_word: θεόν
  choice: አንድ አምላክ
  rationale: በብዙ አማልክት እምነት አውድ ያለ መስተዋድድ የቀረበው θεόν ከአማልክቱ አንዱን ያመለክታል፤ “አንድ አምላክ” ይህን ሳያወሳስብ ያሳያል።
theological_decisions:
- issue: αὐτὸν εἶναι θεόν የሚለውን የደሴቱ ሰዎች የተሳሳተ ድምዳሜ የጳውሎስ መለኮታዊነት እንደ ክርስቲያናዊ አስተምህሮ ሳያስመስል መተርጎም
  choice: “እርሱ አንድ አምላክ ነው”
  alternative: “እርሱ አምላክ ነው” ወይም “እርሱ መለኮታዊ ነው”
  rationale: ትረካው የአካባቢውን ሰዎች በብዙ አማልክት እምነት የተቀረጸ የተሳሳተ ግምት ይዘግባል። “አንድ አምላክ” ማለት ጳውሎስን ከአንዱ እውነተኛ አምላክ ጋር አያሳስትም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። የግሪኩን ተደጋጋሚ δὲ በተፈጥሯዊ ፍሰት “ግን” እና “ሆኖም” በማለት አቅርቧል፤ ቀጥተኛ ንግግር በጥቅስ ምልክት መቅረቡ የተናጋሪዎቹን ድምዳሜ ግልጽ ያደርጋል።
