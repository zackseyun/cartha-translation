  rationale: πρώτους እዚህ የቅደም ተከተል ሳይሆን የማኅበራዊ ሥልጣንና ታዋቂነት ማዕረግን ያመለክታል።
- source_word: συνελθόντων δὲ αὐτῶν
  choice: እነርሱም በተሰበሰቡ ጊዜ
  rationale: የግሪኩን genitive absolute በተፈጥሯዊ የጊዜ ንዑስ አረፍተ ነገር ይተረጉማል።
- source_word: Ἐγώ, ἄνδρες ἀδελφοί
