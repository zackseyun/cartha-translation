  rationale: ተሳቢው በአውዱ የንጽጽር/የተቃርኖ ኃይል አለው፤ ጳውሎስ ጥፋት ባያደርግም እንደተላለፈ ያለውን ውጥረት ይጠብቃል።
- source_word: τῷ λαῷ
  choice: በሕዝባችን ላይ
  rationale: λαός በአውዱ የአይሁድን ሕዝብ ያመለክታል፤ ‘ሕዝባችን’ የጳውሎስንና የተናጋሪዎቹን የጋራ ማንነት በተፈጥሯዊ አማርኛ ያሳያል።
