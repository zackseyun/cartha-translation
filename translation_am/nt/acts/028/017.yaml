- source_word: συγκαλέσασθαι αὐτὸν
  choice: ጳውሎስ ... ሰበሰበ
  rationale: የσυν- የመሰብሰብ ኃይልን በተፈጥሯዊ አማርኛ ያሳያል፤ በአውዱ ግልጽ የሆነው ባለቤት ስም ለግልጽነት ተጠቅሷል።
- source_word: τοὺς ὄντας τῶν Ἰουδαίων πρώτους
