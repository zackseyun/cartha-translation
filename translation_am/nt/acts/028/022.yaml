  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። የግሪኩ ጨዋ መደበኛ ቃና በ‘ተገቢ እንደሆነ እንቆጥራለን’ ተጠብቋል፤ የግሪኩን አወቃቀር በግድ ከመኮረጅ ይልቅ ‘እናውቃለን’ የሚለው ተፈጥሯዊ አገላለጽ ተመርጧል።
