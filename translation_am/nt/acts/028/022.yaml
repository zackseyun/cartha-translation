  language: am
  text: ነገር ግን አንተ የምታስበውን ከአንተ መስማት ተገቢ ነው ብለን እናስባለን፤ ስለዚህ ወገን[a] ግን በየቦታው እንደሚቃወሙት ለእኛ የታወቀ ነውና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ቡድን” ወይም “እንቅስቃሴ”፤ የግሪኩ αἵρεσις በዚህ ስፍራ በኋላ በቴክኒካዊ ትርጉም የተለመደውን “ኑፋቄ” የሚል ፍቺ የግድ አይሰጥም።
