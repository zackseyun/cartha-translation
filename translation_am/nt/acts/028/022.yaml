  rationale: ግሱ በዚህ ዐውድ የግዴታ ጥያቄን ሳይሆን ነገሩ ተገቢ ነው የሚል ጨዋና መደበኛ ግምትን ያሳያል።
- source_word: παρὰ σοῦ ἀκοῦσαι
  choice: ከአንተ መስማት
  rationale: παρά ከአንተው፣ ማለትም ከጳውሎስ በቀጥታ መስማትን ያጎላል፤ የአማርኛው አገላለጽም ይህን በተፈጥሮ ይይዛል።
- source_word: ἃ φρονεῖς
  choice: የምታስበውን
  rationale: φρονέω እዚህ የግለሰቡን አመለካከት ወይም ሐሳብ ያመለክታል።
- source_word: αἱρέσεως
  choice: ወገን
  rationale: በሐዋርያት ሥራ ዐውድ ቃሉ የታወቀ ሃይማኖታዊ ቡድንን ወይም እንቅስቃሴን ያመለክታል፤ በኋላ የተለመደውን ‘ኑፋቄ’ የሚል ቴክኒካዊ የትምህርት ፍቺ አያስገባም።
