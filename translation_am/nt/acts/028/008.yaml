  text: ἐγένετο δὲ τὸν πατέρα τοῦ Ποπλίου πυρετοῖς καὶ ⸀δυσεντερίῳ συνεχόμενον κατακεῖσθαι, πρὸς ὃν ὁ Παῦλος εἰσελθὼν καὶ προσευξάμενος ἐπιθεὶς τὰς χεῖρας αὐτῷ ἰάσατο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/008.yaml
  text: It happened that the father of Publius was lying sick with fevers and dysentery. Paul went in to him[a], and after praying and laying his hands on him, healed him.
translation:
  language: am
  text: የጳፕልዮስ አባት ትኩሳትና የደም ተቅማጥ ይዘውት ታሞ ተኝቶ ነበር። ጳውሎስም ወደ እሱ ገባ፤ ከጸለየ በኋላ እጆቹን በእሱ ላይ ጭኖ ፈወሰው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: ነበር፤ …ም
  rationale: የግሪኩን የትረካ ሽግግር በአማርኛ ተፈጥሯዊ የአረፍተ ነገር አወቃቀርና በ‘ም’ አያያዥ ያሳያል፤ ‘እንዲህም ሆነ’ የሚለውን ግትር አገላለጽ ያስወግዳል።
- source_word: πατέρα τοῦ Ποπλίου
  choice: የጳፕልዮስ አባት
  rationale: የግሪኩን የባለቤትነት ግንኙነት በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: πυρετοῖς
  choice: ትኩሳት
  rationale: የግሪኩ ብዙ ቁጥር ተደጋጋሚ ወይም ከባድ የትኩሳት ሁኔታን ሊያመለክት ቢችልም፣ በዘመናዊ አማርኛ ‘ትኩሳት’ በተለምዶ የማይቆጠር የበሽታ ስም ስለሆነ ይህ አገላለጽ ተፈጥሯዊ ነው።
- source_word: δυσεντερίῳ
  choice: ተቅማጥ
  rationale: የአንጀት በሽታውን በቀላሉ የሚገባ ዘመናዊ የአማርኛ ቃል ይገልጻል።
- source_word: συνεχόμενον κατακεῖσθαι
  choice: ይዘውት ታሞ ተኝቶ ነበር
  rationale: συνέχω የበሽታዎቹን መያዝና ቀጣይ ሥቃይ፣ κατάκειμαι ደግሞ በሕመም መተኛቱን ያሳያል፤ አገላለጹ ሁለቱንም ያቆያል።
- source_word: πρὸς ὃν ὁ Παῦλος εἰσελθὼν
  choice: ጳውሎስም ወደ እሱ ገባ
  rationale: ጳውሎስ ታማሚው ወዳለበት መግባቱንና ወደ እሱ መቅረቡን በግልጽ ያሳያል።
- source_word: προσευξάμενος
  choice: ከጸለየ በኋላ
  rationale: የአኦሪስት ተሳቢውን ከዋናው ድርጊት በፊት የተከናወነ እንደሆነ በግልጽ ያስተላልፋል።
- source_word: ἐπιθεὶς τὰς χεῖρας αὐτῷ
  choice: እጆቹን በእሱ ላይ ጭኖ
  rationale: የግሪኩን ብዙ ቁጥር ‘እጆች’ እና የእጅ መጫን ድርጊት በቀጥታ ይጠብቃል።
- source_word: ἰάσατο αὐτόν
  choice: ፈወሰው
  rationale: የፈውሱን የትረካ ውጤት በቀጥታና በተለመደ መጽሐፍ ቅዱሳዊ ቃል ይገልጻል።
theological_decisions:
- issue: የጳውሎስ የፈውስ ድርጊት ባሕርይ
  choice: ጸሎትን፣ እጅ መጫንንና ፈውስን ጽሑፉ በሚያቀርበው ቅደም ተከተል በቀጥታ መተርጎም
  alternative: ፈውሱን በግልጽ ‘ተአምራዊ’ ማለት ወይም እንደ ሕክምናዊ ማገገም ብቻ መግለጽ
  rationale: ጥቅሱ ፈውሱን ይናገራል፣ ነገር ግን ፈጣንነቱን፣ ሥርዓታዊ ባሕርዩን ወይም የሕክምና ዘዴን አይገልጽም፤ ትርጉሙም ተጨማሪ ሥነ መለኮታዊ መለያ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። በእንግሊዝኛው ያለው [a] ምልክት ከሚያብራራው ሐረግ ጋር የማይዛመድ ሆኖ ስለቀረበ ወደ አማርኛው አልተዛወረም፤ συνεχόμενον የሚያመለክተው የበሽታዎቹ መያዝ ‘ይዘውት’ በሚለው ዋና ጽሑፍ ውስጥ ተጠብቋል።
