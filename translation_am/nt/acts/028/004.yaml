base_translation:
  language: en
  yaml_path: translation/nt/acts/028/004.yaml
  text: When the islanders saw the creature hanging from his hand[a], they said to one another, “Surely this man is a murderer, whom Justice has not allowed to live[d][c][b], though he was brought safely from the sea.”
translation:
  language: am
  text: የደሴቲቱ ሰዎች[a] ፍጡሩ ከእጁ ተንጠልጥሎ ባዩ ጊዜ እርስ በርሳቸው እንዲህ አሉ፤ “ይህ ሰው በእርግጥ ነፍሰ ገዳይ ነው፤ ከባሕሩ በሰላም ተርፎ ቢሆንም፣ ፍትሕ[b] በሕይወት እንዲኖር አልፈቀደለትም።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል “ባርባሮቹ”፤ ይህ ቃል በዚያ ዘመን ግሪክኛ የማይናገሩ የአካባቢውን ነዋሪዎች ያመለክታል እንጂ ጨካኞች ማለት አይደለም።
    reason: lexical_alternative
  - marker: b
    text: እዚህ “ፍትሕ” የበደለኛን ሰው እንደሚቀጣ ሰው ሆኖ ቀርቧል፤ ይህም የደሴቲቱን ሰዎች አረማዊ አመለካከት ሊያንጸባርቅ ይችላል።
    reason: cultural_note
lexical_decisions:
- source_word: βάρβαροι
  choice: የደሴቲቱ ሰዎች
  rationale: ቃሉ በዚህ አውድ ግሪክኛ የማይናገሩትን የማልታ ነዋሪዎች ያመለክታል እንጂ የጭካኔ ፍርድ አይደለም። ይህ አተረጓጎም ዘመናዊ አማርኛ ተናጋሪን ከማሳሳት ይጠብቃል።
- source_word: κρεμάμενον τὸ θηρίον
  choice: እባቡ ... ተንጠልጥሎ
  rationale: θηρίον በራሱ አጠቃላይ ‘ፍጡር/እንስሳ’ ቢሆንም፣ በቅርብ አውዱ (ቁ. 3) ፍጡሩ እባብ መሆኑ በግልጽ ተጠቅሷል። ‘ተንጠልጥሎ’ የκρεμάμενονን የሚታይ ሁኔታ ያስተላልፋል።
- source_word: πρὸς ἀλλήλους ἔλεγον
  choice: እርስ በርሳቸው ... ተባባሉ
  rationale: የመነጋገርን የጋራ ባሕርይ በተፈጥሯዊ አማርኛ ያሳያል፤ የኢምፐርፌክት ገጽታውንም ሳያጋንን ይይዛል።
- source_word: Πάντως φονεύς
  choice: በእርግጥ ነፍሰ ገዳይ
  rationale: Πάντως የተናጋሪዎቹን ጠንካራ ድምዳሜ፣ φονεύςም ሆን ብሎ ሰው የገደለን ሰው በግልጽ ያስተላልፋሉ።
- source_word: διασωθέντα ἐκ τῆς θαλάσσης
  choice: ከባሕሩ በሰላም ቢያመልጥም
  rationale: διασῴζω ከአደጋ ደኅና መውጣትን ያመለክታል። የቅናሽ ተሳቢው ከዋናው ግስ ጋር ያለውን ተቃርኖ ‘ቢ...ም’ በሚለው ተፈጥሯዊ መዋቅር ተገልጿል።
- source_word: ἡ δίκη
  choice: ፍትሕ
  rationale: ቃሉ የበደል ቅጣትን እንደሚፈጽም ኃይል ሰብአዊ ባሕርይ ተሰጥቶት ቀርቧል። ዋናው ጽሑፍ ‘ፍትሕ’ በማለት ይህን ይጠብቃል፤ የባሕል ዳራው በማስታወሻ ተብራርቷል።
- source_word: ζῆν οὐκ εἴασεν
  choice: በሕይወት እንዲኖር አልፈቀደለትም
  rationale: የግሪክኛውን ‘እንዲኖር አልፈቀደም’ ፍቺ ቀጥተኛና ተፈጥሯዊ በሆነ አማርኛ ያቀርባል።
theological_decisions:
- issue: የδίκη ሰብአዊ አቀራረብ
  choice: ‘ፍትሕ’ ተብሎ በማስታወሻ የተናጋሪዎቹ አረማዊ አመለካከት እንደሆነ ማብራራት
  alternative: ‘የፍትሕ አምላክት’ ወይም ‘በቀል’ ብሎ መተርጎም
  rationale: ጽሑፉ የደሴቲቱን ሰዎች ድምዳሜ ይዘግባል እንጂ ተራኪው ይህን እምነት እንደሚያጸድቅ አይናገርም። ‘የፍትሕ አምላክት’ ማለት ከግሪክኛው በላይ የተወሰነ አፈታሪካዊ ማንነት ሊጭን ይችላል።
