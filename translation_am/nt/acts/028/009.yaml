- from: ይህም ከሆነ በኋላ፣ በደሴቲቱ ላይ ከነበሩት ሰዎች መካከል የተለያዩ ሕመሞች የነበሩባቸው ሌሎቹም እየመጡ ይፈወሱ ነበር።
  to: ይህም ከተከሰተ በኋላ፣ በደሴቲቱ ላይ ሕመሞች የነበሯቸው የቀሩት ሰዎችም እየመጡ ይፈወሱ ነበር።
