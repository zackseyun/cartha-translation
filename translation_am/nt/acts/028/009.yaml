id: ACT.28.9
reference: Acts 28:9
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τούτου ⸀δὲ γενομένου καὶ οἱ λοιποὶ οἱ ⸂ἐν τῇ νήσῳ ἔχοντες ἀσθενείας⸃ προσήρχοντο καὶ ἐθεραπεύοντο,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/009.yaml
  text: And after this happened[a], the rest of those on the island who had diseases also came and were healed.
translation:
  language: am
  text: ይህም ከተከሰተ በኋላ፣ በደሴቲቱ ላይ ሕመሞች የነበሯቸው የቀሩት ሰዎችም እየመጡ ይፈወሱ ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τούτου δὲ γενομένου
  choice: ይህም ከሆነ በኋላ
  rationale: የግሪኩን ጊዜ አመልካች የጄኒቲቭ አብሶሉት አወቃቀርና δέ የሚያሳየውን የትረካ ሽግግር በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: οἱ λοιποί
  choice: ሌሎቹም
  rationale: ከቀድሞ ከተጠቀሰው ታማሚ በተጨማሪ የቀሩትን ሰዎች በአጭርና ተፈጥሯዊ አገላለጽ ይጠቁማል።
- source_word: οἱ ἐν τῇ νήσῳ
  choice: በደሴቲቱ ላይ ከነበሩት ሰዎች መካከል
  rationale: በደሴቲቱ የሚገኙትን ቡድን ግልጽ ያደርጋል፤ በአማርኛ ለደሴት ‘ላይ’ የሚለው ተፈጥሯዊ ነው።
- source_word: ἔχοντες ἀσθενείας
  choice: የተለያዩ ሕመሞች የነበሩባቸው
  rationale: ἔχοντες የሚለውን ‘የነበሩባቸው’ በማለትና ἀσθενείας የሚለውን ብዙ ቁጥር ‘ሕመሞች’ በማለት ይጠብቃል፤ ‘የተለያዩ’ ብዙ ዓይነት ሕመም መኖሩን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: προσήρχοντο
  choice: እየመጡ
  rationale: ያልተጠናቀቀውን የኢምፐርፌክት ገጽታ፣ ሰዎቹ ተከታትለው መምጣታቸውን፣ ያሳያል፤ በግሪኩ በግልጽ የሌለው ‘ወደ እርሱ’ አልተጨመረም።
- source_word: ἐθεραπεύοντο
  choice: ይፈወሱ ነበር
  rationale: የኢምፐርፌክትን ቀጣይነትና የግሱን ተደራጊ ቅርጽ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: καὶ
  choice: ሌሎቹም
  rationale: ሁለተኛው καί ይህን ፈውስ ከቀደመው ክስተት ጋር እንደ ተጨማሪ ድርጊት ያገናኛል፤ የአማርኛው ‘-ም’ ይህን በተፈጥሯዊ ሁኔታ ያስተላልፋል።
