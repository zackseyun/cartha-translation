  text: διὰ ταύτην οὖν τὴν αἰτίαν παρεκάλεσα ὑμᾶς ἰδεῖν καὶ προσλαλῆσαι, ἕνεκεν γὰρ τῆς ἐλπίδος τοῦ Ἰσραὴλ τὴν ἅλυσιν ταύτην περίκειμαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/020.yaml
  text: For this reason[a], therefore, I asked to see you and to speak with you, for it is because of the hope of Israel that I am wearing this chain.
translation:
  language: am
  text: ስለዚህ ምክንያት እንግዲህ፣ እንድገናኛችሁና ከእናንተ ጋር እንድነጋገር ጠይቄአችኋለሁ፤ በዚህ ሰንሰለት ታስሬ ያለሁት ስለ የእስራኤል ተስፋ[a] ነውና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የእስራኤል ተስፋ።” ይህ ሐረግ ጳውሎስ ከሚያውጀው ከቃል ኪዳኑና ከትንሣኤ ተስፋ ጋር ሊዛመድ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ ταύτην οὖν τὴν αἰτίαν
  choice: ስለዚህ ምክንያት እንግዲህ
  rationale: የምክንያት ሐረጉንም ሆነ የድምዳሜ አመልካቹን οὖν ይጠብቃል፤ በአማርኛም ግንኙነቱን በግልጽ ያሳያል።
- source_word: παρεκάλεσα
  choice: ጠየቅኋችሁ
  rationale: በዚህ አውድ ጳውሎስ የአካባቢውን የአይሁድ መሪዎች እንዲመጡ መጠየቁን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: ἰδεῖν
  choice: ላያችሁ
  rationale: የግሱን ቀጥተኛ ትርጉም ‘ማየት’ ይጠብቃል፤ በአውዱ የመገናኘትን ሐሳብም በተፈጥሮ ያስተላልፋል።
- source_word: προσλαλῆσαι
  choice: ከእናንተ ጋር ልነጋገር
  rationale: አንድ ወገን ብቻ ከሚናገርበት ንግግር ይልቅ የጋራ ውይይትን ያመለክታል።
- source_word: ἕνεκεν γὰρ
  choice: ስለ ... ነውና
  rationale: ἕνεκεν የሚያሳየውን ምክንያትና γάρ የሚሰጠውን ማብራሪያ በተፈጥሯዊ የአማርኛ አወቃቀር ይጠብቃል።
- source_word: τῆς ἐλπίδος τοῦ Ἰσραήλ
  choice: ስለ እስራኤል ተስፋ
  rationale: የግሪኩን አጭር የባለቤትነት/ዝምድና ሐረግ ሳያሰፋ ያቆያል፤ ተስፋው የእስራኤል የሆነ፣ ለእስራኤል የተሰጠ ወይም እስራኤል የሚጠብቀው መሆኑን በጽሑፉ ውስጥ አይወስንም።
- source_word: ἅλυσιν
  choice: ሰንሰለት
  rationale: የግሪኩን ነጠላ ቁጥርና የእስረኛ ማሰሪያ ምስል በቀጥታ ይጠብቃል።
- source_word: περίκειμαι
  choice: የታሰርኩት
  rationale: ቃል በቃል ‘በዙሪያዬ ያለ/የለበስኩት’ የሚለው በአማርኛ ከሰንሰለት ጋር ሲቀርብ ያልተለመደ ስለሆነ፣ የአካላዊ እስራቱን ሁኔታ በግልጽና ተፈጥሯዊ አገላለጽ ያስተላልፋል።
theological_decisions:
- issue: ‘የእስራኤል ተስፋ’ የሚለው ሐረግ ትርጉም
  choice: በዋናው ጽሑፍ ‘የእስራኤል ተስፋ’ ተብሎ ያለ ትርጓሜያዊ ማስፋፊያ ቀርቧል።
  alternative: ‘ለእስራኤል የተሰጠው ተስፋ፣’ ‘የእስራኤል የትንሣኤ ተስፋ፣’ ወይም ‘የእስራኤል የመሲሑ ተስፋ።’
  rationale: ሐረጉ ከቃል ኪዳን፣ ከትንሣኤና ከመሲሑ ጋር የተያያዘውን የእስራኤል ተስፋ ሊያመለክት ቢችልም፣ ግሪኩ አጭርና አመላካች ሆኖ ይቀራል። ትርጉሙም ያንን ሥነ መለኮታዊ ስፋትና ውጥረት አይዘጋም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ስለዚህ ምክንያት እንግዲህ’ የሚለው አገላለጽ ትንሽ ድግግሞሽ ቢኖረውም የግሪኩን ሁለትዮሽ ሎጂካዊ ግንኙነት ለመጠበቅ ተመርጧል።
