base_translation:
  language: en
  yaml_path: translation/nt/acts/028/014.yaml
  text: There we found brothers, and we were invited to stay with them seven days. And so we came to Rome.
translation:
  language: am
  text: በዚያም ወንድሞችን[a] አገኘን፤ ከእነርሱም ጋር ሰባት ቀናት እንድንቆይ ተጋበዝን። እንዲህም ወደ ሮም መጣን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ወንድሞችና እኅቶች»፤ የግሪኩ ቃል «ወንድሞች» ይላል፣ በዚህ ዐውድ ግን በአጠቃላይ የእምነት ባልንጀሮችን፣ ወንዶችንና ሴቶችን ጨምሮ፣ ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: በዚያም
  rationale: የቦታ አመልካች ተውሳክ ሲሆን ቀደም ሲል የተጠቀሰውን ፑቲዮሊን ያመለክታል፤ «በዚያም» በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: εὑρόντες
  choice: አገኘን
  rationale: የግሪኩ የተውሳከ ግስ መዋቅር በአማርኛ የድርጊቱን ቅደም ተከተል በሚጠብቅ ፍጹም ግስ ተተርጉሟል።
- source_word: ἀδελφοὺς
  choice: ወንድሞችን
  rationale: የግሪኩን ቃል ቀጥተኛ ጾታዊ ቅርጽ ይጠብቃል፤ በዚህ ዐውድ አማኞችን በአጠቃላይ ሊያመለክት መቻሉ በማስታወሻ ተገልጿል።
- source_word: παρεκλήθημεν
  choice: ተጋበዝን
  rationale: በእንግዳ ተቀባይነት ዐውድ ውስጥ የቀረበላቸውን ጥያቄ በተፈጥሯዊ አማርኛ ያሳያል፤ ተገብሮአዊውንም ቅርጽ ይጠብቃል።
- source_word: παρ’ αὐτοῖς ἐπιμεῖναι ἡμέρας ἑπτά
  choice: ከእነርሱም ጋር ሰባት ቀን እንድንቆይ
  rationale: አብሮነትን፣ መቆየትንና የጊዜውን ርዝመት ግልጽና ተፈጥሯዊ በሆነ አማርኛ ያስተላልፋል።
- source_word: καὶ οὕτως
  choice: እንዲህም
  rationale: የጉዞውን ቀጣይነትና «በዚህ ሁኔታ» የሚለውን አገናኝ ኃይል በአጭር ተፈጥሯዊ አገላለጽ ይጠብቃል።
- source_word: εἰς τὴν Ῥώμην ἤλθαμεν
  choice: ወደ ሮም መጣን
  rationale: ወደ መድረሻው መድረስንና የሉቃስን የመጀመሪያ ሰው ብዙ ቁጥር የጉዞ ትረካ ይጠብቃል።
theological_decisions:
- issue: የἀδελφοὺς ተጠቃሽ
  choice: በአካባቢው ያሉ የእምነት ወንድሞች፣ በዐውዱም ምናልባት አማኞች በአጠቃላይ
  alternative: የሥጋ ወንድሞች ወይም አይሁዳውያን ወገኖች በአጠቃላይ
  rationale: በሐዋርያት ሥራ የጉዞና የእንግዳ ተቀባይነት ዐውድ ውስጥ «ወንድሞች» በተለምዶ ክርስቲያን አማኞችን ያመለክታል። ዋናው ጽሑፍ የቃሉን ቅርጽ ሲጠብቅ ሰፊውን ዐውዳዊ ትርጉም በማስታወሻ ያሳያል።
