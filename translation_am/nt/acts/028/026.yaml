  text: ⸀λέγων· Πορεύθητι πρὸς τὸν λαὸν τοῦτον καὶ εἰπόν· Ἀκοῇ ἀκούσετε καὶ οὐ μὴ συνῆτε, καὶ βλέποντες βλέψετε καὶ οὐ μὴ ἴδητε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/026.yaml
  text: 'saying[a], ‘Go to this people and say: You will indeed hear, but you will never understand; and seeing, you will indeed see[b], but you will never perceive.’'
translation:
  language: am
  text: እንዲህ በማለት፦ “ወደዚህ ሕዝብ ሄደህ እንዲህ በላቸው፤ ‘በርግጥ ትሰማላችሁ[a]፣ ነገር ግን ፈጽሞ አታስተውሉም፤ እያያችሁም በርግጥ ታያላችሁ፣ ነገር ግን ፈጽሞ አትገነዘቡም[b]።’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “በመስማት ትሰማላችሁ።” ይህ በግሪኩ የኢሳይያስ ጥቅስ ውስጥ የተጠበቀ አጽንዖት ያለው የዕብራይስጥ ዓይነት አገላለጽ ነው።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “እያያችሁ ታያላችሁ፣ ነገር ግን ፈጽሞ አታዩም።” ግሪኩ የማየት ቃላትን ይደግማል፤ የመጨረሻው ግስ ግን በዐውዱ ውስጣዊ ግንዛቤን ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: እንዲህ በማለት
  rationale: የአሁን ጊዜ አጋዥ ግስ ሆኖ ጥቅሱን ከቀደመው ንግግር ጋር ያያይዛል፤ የአማርኛው አገላለጽ ይህን ተያያዥነት ይጠብቃል።
- source_word: Πορεύθητι
  choice: ሄደህ
  rationale: የመንቀሳቀስ ትእዛዙ በቀጣዩ ‘በላቸው’ ጋር በተፈጥሯዊ የአማርኛ ቅንብር ተያይዟል።
- source_word: λαὸν τοῦτον
  choice: ይህ ሕዝብ
  rationale: λαός የጋራ ሕዝብን ያመለክታል፤ ‘ይህ ሕዝብ’ የኢሳይያስን ትንቢታዊ አነጋገር ይጠብቃል።
- source_word: εἰπόν
  choice: እንዲህ በላቸው
  rationale: ቀጥተኛውን ንግግር በተፈጥሯዊ አማርኛ ያስገባል፤ ብዙ አባላት ያሉትን ‘ሕዝብ’ በትርጉም ደረጃ ያነጋግራል።
- source_word: Ἀκοῇ ἀκούσετε
  choice: መስማትን ትሰማላችሁ
  rationale: በግሪክ የተጠበቀውን ሴማዊ የተመሳሳይ ሥር ድግግሞሽና አጽንዖት በአማርኛ ያንጸባርቃል።
- source_word: οὐ μὴ συνῆτε
  choice: ፈጽሞ አታስተውሉም
  rationale: οὐ μή ያለውን ጠንካራ አሉታዊ አጽንዖት ‘ፈጽሞ’ ያሳያል፤ συνίημι ደግሞ ውስጣዊ መረዳትን ያመለክታል።
- source_word: βλέποντες βλέψετε
  choice: ማየትንም ታያላችሁ
  rationale: የማየት ቃል ድግግሞሽንና ከመስማት አንቀጽ ጋር ያለውን ትይዩነት ይጠብቃል።
- source_word: οὐ μὴ ἴδητε
  choice: ፈጽሞ አትገነዘቡም
  rationale: በዐውዱ ውስጥ ከአካላዊ ማየት በተቃራኒ ያለውን ውስጣዊ ግንዛቤ ይገልጣል፤ ሆኖም ቀጥተኛው ‘አታዩም’ በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: ከኢሳይያስ የተጠቀሰው የስሜት ሕዋሳት ቋንቋ አካላዊ መስማትንና ማየትን ከውስጣዊ ግንዛቤ ጋር ያነጻጽራል።
  choice: συνίημιን ‘ማስተዋል’፣ በዐውዱ ያለውን ἴδητεን ‘መገንዘብ’ ብሎ መተርጎም።
  alternative: የመጨረሻውን ግስ ‘አታዩም’ ብሎ በመተርጎም የማየትን ቃላዊ ድግግሞሽ ሙሉ በሙሉ መጠበቅ።
  rationale: ጥቅሱ የውጭ ስሜት ሕዋሳት ተሳትፎን ከውስጣዊ አለመረዳት ጋር ያቆራኛል። ‘መገንዘብ’ ይህን የዐውድ ኃይል ያሳያል፤ የግሪኩ ቃላዊ አማራጭ ግን በማስታወሻ ተገልጿል።
