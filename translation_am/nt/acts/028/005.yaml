lexical_decisions:
- source_word: ὁ μὲν οὖν
  choice: እርሱም
  rationale: ὁ በዚህ ስፍራ ተውላጠ ስም ሆኖ ጳውሎስን ያመለክታል፤ μέν οὖν ያለውን ቀላል የትረካ ሽግግር «-ም» በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἀποτινάξας
  choice: አራግፎ
  rationale: የአኦሪስት አጋዥ ግስ ከዋናው ግስ በፊት የተፈጸመውን ድርጊት ያሳያል፤ «አራግፎ» ነገሩን ከእጁ እንዳስወገደ በአጭርና ተፈጥሯዊ መንገድ ይገልጣል።
- source_word: τὸ θηρίον
  choice: እንስሳው
  rationale: θηρίον አጠቃላይ የእንስሳ ቃል ነው፤ አውዱ እባብ መሆኑን ቢያሳይም በዚህ ቁጥር ያለውን የግሪክ ቃል አጠቃላይነት «እንስሳው» ይጠብቃል።
- source_word: εἰς τὸ πῦρ
  choice: ወደ እሳቱ
  rationale: εἰς ከተሳቢ ስም ጋር የሚገልጠውን የአቅጣጫ እንቅስቃሴ በቀጥታ ያስተላልፋል።
- source_word: ἔπαθεν οὐδὲν κακόν
  choice: ምንም ጉዳት አልደረሰበትም
  rationale: የግሪኩን «ምንም ክፉ ነገር አልተቀበለም» የሚል ፍቺ በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጣል።
