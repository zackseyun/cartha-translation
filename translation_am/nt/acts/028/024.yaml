translation:
  language: am
  text: አንዳንዶቹም በሚነገረው ነገር ተሳመኑ፤ ሌሎቹ ግን አላመኑም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπείθοντο
  choice: አመኑ
  rationale: በዚህ ዐውደ ንባብ ግሱ በተነገረው መልእክት መረታትንና መቀበልን ያመለክታል። በአማርኛ «አመኑ» ከተቃራኒው ἠπίστουν ጋር ያለውን ግልጽ ንጽጽር በተፈጥሮ ያስተላልፋል፤ ከጥቅሱ በላይ የሆነ የመዳን ፍርድ ግን አይጨምርም።
- source_word: τοῖς λεγομένοις
  choice: በተነገረው ነገር
  rationale: የንግግሩን ይዘት በተፈጥሮአዊ አማርኛ ይገልጣል። የግሪኩ የአሁን ጊዜ አሳታፊ ቀጣይነት በዐውዱ ግልጽ ስለሆነ፣ ከባድ የሆነው «ይነገር በነበረው» አልተመረጠም።
- source_word: ἠπίστουν
  choice: አላመኑም
  rationale: «አላመኑም» የግሱን ‘አለማመን/አለመቀበል’ ትርጉም በቀጥታ ያስተላልፋል። «ለማመን እምቢ አሉ» የሚለውን ጠንካራ የፈቃድ እምቢታ ሳያስገባ የግሪኩን አሻሚነት ይጠብቃል።
- source_word: οἱ μὲν ... οἱ δὲ
  choice: አንዳንዶቹም ... ሌሎቹ ግን
  rationale: በቡድኑ ውስጥ የነበረውን መከፋፈልና ንጽጽር በተፈጥሮአዊ አማርኛ ያሳያል።
- source_word: καὶ
  choice: -ም
  rationale: የአማርኛው ተያያዥ ቅጥያ «-ም» ጥቅሱን ከቀደመው ትረካ ጋር ያገናኛል።
theological_decisions:
- issue: የምላሹ ንጽጽር ባሕርይ
  choice: ጥቅሱ አንዳንዶች መልእክቱን እንደተቀበሉና ሌሎች እንዳላመኑ ብቻ ያሳያል።
  alternative: የመጀመሪያዎቹን ፍጹም የዳኑ አማኞች፣ የሌሎቹንም ፍጹም የደነደኑ የማያምኑ ሰዎች አድርጎ መወሰን።
  rationale: የግሪኩ ጽሑፍ በተሰበከው መልእክት ላይ የተሰጡ የተለያዩ ምላሾችን ይገልጣል፤ የእያንዳንዳቸውን የመጨረሻ መንፈሳዊ ሁኔታ ግን አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። በትርጉሙ ውስጥ የማያስፈልግ እጅግ ቃል በቃል የሆነ አገላለጽ ተወግዷል፣ የምንጩ ንጽጽር ግን ተጠብቋል።
