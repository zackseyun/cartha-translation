- from: የእግዚአብሔርን መንግሥት እየሰበከ፣ ስለ ጌታ ኢየሱስ መሲሕ[a] የሚመለከቱትንም ነገሮች በሙሉ ድፍረት ያለ እንቅፋት ያስተምር ነበር።
