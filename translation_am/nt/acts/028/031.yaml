  yaml_path: translation/nt/acts/028/031.yaml
  text: proclaiming the kingdom of God and teaching the things concerning the Lord Jesus the Messiah with all boldness[a], unhindered.
translation:
  language: am
  text: የእግዚአብሔርን መንግሥት እየሰበከ፣ ስለ ጌታ ኢየሱስ መሲሕ ያሉ ነገሮችንም በፍጹም ድፍረት ያለ እንቅፋት እያስተማረ ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κηρύσσων
  choice: እየሰበከ
  rationale: ቀጣይነት ያለውን የጳውሎስ የሕዝብ ፊት አዋጅ ተግባር በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: የእግዚአብሔርን መንግሥት
  rationale: የβασιλεία የመንግሥትና የንግሥና አገዛዝ ገጽታዎችን በተለመደው የአዲስ ኪዳን አገላለጽ ይጠብቃል።
- source_word: διδάσκων
  choice: ያስተምር ነበር
  rationale: ከκηρύσσων ጋር ተቀናጅቶ የጳውሎስን ቀጣይ የማስተማር ተግባር ያሳያል።
- source_word: τὰ περὶ
  choice: የሚመለከቱትንም ነገሮች
  rationale: የግሪኩን ሰፊ አገላለጽ ሳያጠብ በግልጽና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τοῦ κυρίου
  choice: ስለ ጌታ
  rationale: κύριοςን እዚህ እንደ ክርስቶሳዊ ማዕረግ በተለመደው አማርኛ ይተረጉማል።
- source_word: Ἰησοῦ Χριστοῦ
  choice: ኢየሱስ መሲሕ
  rationale: ኢየሱስን እንደ ስም በተለመደው ቅርጽ ያቀርባል፤ Χριστόςንም ትርጉሙን የሚያሳይ የማዕረግ ቃል ‘መሲሕ’ ብሎ ይሰጣል።
- source_word: μετὰ πάσης παρρησίας
  choice: በሙሉ ድፍረት
  rationale: πάσηςን እንደ ማጠናከሪያ ጠብቆ የπαρρησίαን ያለ ፍርሃትና በግልጽ የመናገር ሐሳብ ያስተላልፋል።
- source_word: ἀκωλύτως
  choice: ያለ እንቅፋት
  rationale: የመጽሐፉን መደምደሚያ አጽንዖት—ወንጌሉ ሳይከለከል መሰራጨቱን—በአጭርና ተፈጥሯዊ አማርኛ ይገልጻል።
theological_decisions:
- issue: Χριστόςን በክርስቶሳዊ የማዕረግ ቅንብር መተርጎም
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: በዚህ አውድ Χριστός የማዕረግ ኃይሉን እንደያዘ ሊነበብ ስለሚችል ‘መሲሕ’ ትርጉሙን ይገልጣል፤ በስም መሰል አጠቃቀም ‘ክርስቶስ’ ማለትም የሚቻል መሆኑ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ሁለቱ የአሁን ጊዜ አሳታፊ ግሶች በአማርኛ ተፈጥሯዊ የትረካ ቅርጽ ተቀናጅተዋል፤ የመጨረሻው ἀκωλύτως ያለው አጽንዖት በአረፍተ ነገሩ መጨረሻ አካባቢ ተጠብቋል።
