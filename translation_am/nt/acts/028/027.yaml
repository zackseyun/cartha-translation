- source_word: ἐκάμμυσαν
  choice: ዓይኖቻቸውን ጨፈኑ
  rationale: ዓይንን መዝጋት ወይም አጥብቆ መጨፈንን በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: μήποτε
  choice: ይህ ባይሆን ኖሮ
  rationale: በዐውዱ ያለውን አሉታዊ ውጤት/ዓላማ በሚነበብ አማርኛ ያስተላልፋል፤ ‘እንዳያዩ’ የሚለው ጠንካራ የዓላማ ፍቺ በማስታወሻ ተጠብቋል።
- source_word: συνῶσιν
  choice: ሊያስተውሉ
  rationale: በልብ መረዳትንና ውስጣዊ ግንዛቤን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐπιστρέψωσιν
  choice: ተመልሰው ሊመጡ
  rationale: የመዞርንና የመመለስን አቅጣጫዊ ምስል ይጠብቃል፤ ‘ንስሐ ሊገቡ’ ብሎ ትርጉሙን ከምንጩ በላይ አያጠብም።
- source_word: ἰάσομαι
  choice: እፈውሳቸው ነበር
  rationale: ከμήποτε ንዑስ አረፍተ ነገር በኋላ ያለውን ሁኔታዊ ውጤት በአማርኛ በግልጽ ያቀርባል።
theological_decisions:
