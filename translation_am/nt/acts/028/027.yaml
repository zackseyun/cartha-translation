- issue: የἐπιστρέψωσιν የመለወጥ ትርጉም
  choice: ተመልሰው ሊመጡ
  alternative: ሊመለሱ፣ ዞር ሊሉ፣ ንስሐ ሊገቡ
  rationale: የመመለስን ዘይቤና የመንፈሳዊ ለውጥን አንድምታ ይጠብቃል፤ አንድን የተወሰነ ዶክትሪናዊ አገላለጽ አያስገድድም።
