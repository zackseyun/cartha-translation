  rationale: ቃሉ በቀጥታ ‘ወፍሯል/ወፍሮአል’ የሚል ምስል ቢኖረውም፣ እዚህ የልብን ድንዛዜና ስሜት አልባነት ያመለክታል፤ ‘ደንዝዟል’ ይህን ዘይቤያዊ ፍቺ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: καρδία
  choice: ልብ
  rationale: መጽሐፍ ቅዱሳዊውን የሰው ውስጣዊ ማንነት ቃል ይጠብቃል፤ በኋላ ካለው ‘በልባቸው ሊያስተውሉ’ ጋርም የቃል አንድነት ይኖረዋል።
- source_word: βαρέως ἤκουσαν
  choice: በጆሮአቸው በከባድ ሰሙ
