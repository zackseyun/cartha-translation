review_pass:
  verdict: revise
  source_fidelity: The draft preserves the citation’s central imagery and the sequence of seeing, hearing, understanding, returning, and healing. However, “ተመልሰው ሊመጡ” adds the idea of coming back, whereas ἐπιστρέψωσιν simply means “turn/return,” and the wording for βαρέως ἤκουσαν is not idiomatic Amharic.
  naturalness: “በጆሮአቸውም በከባድ ሰሙ” is a calque and sounds unnatural in modern standard Amharic. “ለመስማት ከብዶአቸው ሰሙ” communicates the metaphor naturally without weakening it. The conditional sequence is also smoother when its coordinated verbs are expressed consistently.
  terminology: ልብ, ዓይን, ጆሮ, and ፈውስ are appropriate. “ሊመለሱ” preserves the directional and conversion-related sense of ἐπιστρέψωσιν without importing a narrower doctrinal term such as “ንስሐ ሊገቡ.”
  issues:
  - severity: medium
    issue: Unnatural rendering of βαρέως ἤκουσαν
    rationale: “በከባድ ሰሙ” is not natural Amharic usage. The Greek conveys dull, burdensome, or difficult hearing; “ለመስማት ከብዶአቸው ሰሙ” conveys this clearly and idiomatically.
  - severity: medium
    issue: Overtranslation of ἐπιστρέψωσιν
    rationale: “ተመልሰው ሊመጡ” includes “come,” which is absent from the Greek and may imply a more specific destination. “ሊመለሱ” retains the source ambiguity.
