    text: ወይም፣ “የደሴቲቱ ከፍተኛ ባለሥልጣን።” የግሪክኛው አገላለጽ በደሴቲቱ ላይ ከፍተኛ ደረጃ ወይም መሪነት የነበረውን ሰው ሊያመለክት ይችላል።
