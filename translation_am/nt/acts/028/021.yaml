  text: οἱ δὲ πρὸς αὐτὸν εἶπαν· Ἡμεῖς οὔτε γράμματα περὶ σοῦ ἐδεξάμεθα ἀπὸ τῆς Ἰουδαίας, οὔτε παραγενόμενός τις τῶν ἀδελφῶν ἀπήγγειλεν ἢ ἐλάλησέν τι περὶ σοῦ πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/021.yaml
  text: But they said to him[a], “We have received no letters from Judea about you[b], nor has any of the brothers who came reported or spoken anything evil about you.”
translation:
  language: am
  text: እነርሱ ግን፣ “እኛ ስለ አንተ ከይሁዳ ምንም ደብዳቤዎች አልተቀበልንም፤ ከወንድሞች[a] መካከል የመጣ ማንም ስለ አንተ ክፉ ነገር ያስታወቀን ወይም የተናገረ የለም” አሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: እዚህ «ወንድሞች» የሚለው ከይሁዳ የመጡ የአይሁድ ወገኖችን ሊያመለክት ይችላል፤ ጽሑፉ ግን ክርስቲያን አማኞች መሆናቸውን በግልጽ አይናገርም።
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ ... εἶπαν
  choice: እነርሱም ... አሉት
  rationale: δέ በአማርኛው የትረካ ፍሰት በ«-ም» ተገልጧል፤ ግልጽ ተቃርኖ ከሌለ በ«ነገር ግን» ማጠናከር አያስፈልግም።
- source_word: πρὸς αὐτόν
  choice: አሉት
  rationale: የንግግሩ ተቀባይ በአማርኛው ግስ ውስጥ በተፈጥሮ ተካቷል።
- source_word: Ἡμεῖς
  choice: እኛ
  rationale: በግሪክኛው ያለው አጽንዖት ተጠብቆ ግልጽ ተውላጠ ስም ተጠቅሟል።
- source_word: οὔτε ... οὔτε
  choice: ምንም ... አልደረሰንም፤ ... ማንም የለም
  rationale: የተያያዘው አሉታዊ አወቃቀር በተፈጥሯዊ ዘመናዊ አማርኛ ተገልጧል።
- source_word: γράμματα
  choice: ደብዳቤ
  rationale: በዚህ አውድ ቃሉ የጽሑፍ መልእክቶችን ወይም ደብዳቤዎችን ያመለክታል።
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: ከይሁዳ
  rationale: የቦታውን ስምና የመነሻውን ሐረግ በአጭርና በተለመደ መንገድ ያቀርባል።
- source_word: παραγενόμενός τις τῶν ἀδελφῶν
  choice: ከወንድሞችም መጥቶ ... ማንም
  rationale: παραγενόμενος የመምጣትን ሐሳብ ያስቀምጣል፤ በምንጩ የሌለው «ወደዚህ» አልተጨመረም። ἀδελφοί ደግሞ በቀጥታ «ወንድሞች» ተብሏል።
- source_word: ἀπήγγειλεν ἢ ἐλάλησέν τι
  choice: የነገረን ወይም የተናገረ
  rationale: የሁለቱ ግሶች ልዩነት በቀላሉ ተጠብቋል፤ የመጀመሪያው ሪፖርት ማድረስን፣ ሁለተኛው መናገርን ያመለክታል።
- source_word: πονηρόν
  choice: ክፉ ነገር
  rationale: ቃሉ በዚህ አውድ ስለ ጳውሎስ የሚነገር መጥፎ ወይም ክፉ ነገርን ያመለክታል።
theological_decisions:
- issue: የ«τῶν ἀδελφῶν» ማንነት
  choice: «ወንድሞች» ተብሎ ማንነታቸው ሳይወሰን ተተርጉሟል።
  alternative: «አይሁድ ወገኖች» ወይም «ክርስቲያን ወንድሞች»
  rationale: አውዱ ከይሁዳ የመጡ የአይሁድ ወገኖችን ሊያመለክት ቢችልም፣ ግሪክኛው ክርስቲያን መሆናቸውንም ሆነ አለመሆናቸውን በግልጽ አይወስንም፤ ስለዚህ ግልጽ ያልሆነው ነገር ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪክኛው የንግግር አወቃቀር በተፈጥሯዊ አማርኛ ተደራጅቷል፤ የ«ወንድሞች» ማንነት ሆን ተብሎ አልተወሰነም።
