  text: οἵτινες ἀνακρίναντές με ἐβούλοντο ἀπολῦσαι διὰ τὸ μηδεμίαν αἰτίαν θανάτου ὑπάρχειν ἐν ἐμοί·
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/018.yaml
  text: who[a], after examining me, wanted to release me because there was no basis for the death penalty in my case.
translation:
  language: am
  text: እነርሱም ከመረመሩኝ በኋላ፣ በእኔ ላይ በሞት የሚያስቀጣ ምንም ክስ ስላልነበረ፣ ሊፈቱኝ ፈለጉ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በእኔ ላይ ሞት የሚገባው ምንም ክስ ስላላገኙ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: እነርሱም
  rationale: The resumptive pronoun naturally links the relative clause to the preceding Amharic context; the qualitative nuance of ὅστις is not overexpressed.
- source_word: ἀνακρίναντές με
  choice: ከመረመሩኝ በኋላ
  rationale: Expresses the aorist participle's action as prior to the desire to release, while retaining the judicial sense of examination.
- source_word: ἐβούλοντο
  choice: ፈለጉ
  rationale: A natural modern Amharic expression of the officials' intention; context supplies the past reference.
- source_word: ἀπολῦσαι
  choice: ሊፈቱኝ
  rationale: In the custodial and judicial setting, መፍታት naturally means to release or set free.
- source_word: διὰ τὸ ... ὑπάρχειν
  choice: ስላልነበረ
  rationale: Naturally conveys the causal force of διά with the articular infinitive.
- source_word: μηδεμίαν αἰτίαν θανάτου
  choice: ለሞት የሚያበቃ ምንም ክስ
  rationale: Preserves the forensic sense of αἰτία while expressing θανάτου as a charge warranting death, without specifying a narrower sentencing procedure than the Greek requires.
- source_word: ἐν ἐμοί
  choice: በእኔ ላይ
  rationale: An idiomatic forensic rendering meaning against or concerning Paul, rather than an inward quality in him.
theological_decisions:
- issue: Whether αἰτία θανάτου means an accusation deserving death or a legal basis for imposing death
  choice: ለሞት የሚያበቃ ምንም ክስ
  alternative: የሞት ቅጣት ለመፍረድ ምንም ምክንያት
  rationale: The chosen wording keeps both the charge and its capital consequence visible and avoids resolving the judicial expression too narrowly.
translation_notes:
  register: Modern standard Amharic in Ge'ez script; dignified but accessible. The judicial vocabulary is clear without being excessively technical. The footnote marker is placed at the end of the verse because it qualifies the causal clause as a whole.
