  rationale: በትረካው ውስጥ ከቀደመው ስፍራ የቀጠለውን ጉዞ በተፈጥሯዊ ዘመናዊ አማርኛ ያመለክታል።
- source_word: περιελόντες
  choice: መልሕቁን አንሥተን
