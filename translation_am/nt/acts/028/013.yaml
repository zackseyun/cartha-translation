  text: ὅθεν ⸀περιελόντες κατηντήσαμεν εἰς Ῥήγιον. καὶ μετὰ μίαν ἡμέραν ἐπιγενομένου νότου δευτεραῖοι ἤλθομεν εἰς Ποτιόλους,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/013.yaml
  text: From there[a], after weighing anchor, we came to Rhegium. And after one day, when a south wind came up, on the second day we came to Puteoli,
translation:
  language: am
  text: ከዚያም መልሕቁን አንሥተን[a] ወደ ሬጊዮን ደረስን። ከአንድ ቀንም በኋላ፣ የደቡብ ነፋስ በተነሣ ጊዜ፣ በሁለተኛው ቀን ወደ ፑቲዮሊ መጣን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በመርከብ ተነሥተን።” περιελόντες የሚለው የግሪክ ቃል የባሕር ጉዞን የሚመለከት ሲሆን፣ በተለይ መልሕቅን ማንሣትን፣ ወይም በአጠቃላይ መርከብ ጉዞ መጀመርን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
