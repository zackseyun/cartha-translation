  text: እርሱም ከተጠራ በኋላ፣ ጠርጠሉስ እንዲህ በማለት ሊከሰው ጀመር፦ “በአንተ አማካይነት ብዙ ሰላም እያገኘን ስለሆንን፣ በቅድመ አሳቢነትህም[b] ለዚህ ሕዝብ ማሻሻያዎች[a] እየተደረጉ ስለሆኑ፣”
  philosophy: optimal-equivalence
