  rationale: በፍርድ አውድ ውስጥ ውሳኔውን ወይም ሂደቱን ማዘግየትን በተፈጥሯዊ አማርኛ ያሳያል። የግሪኩ ቀጥተኛ ተሳቢ ግን ‘እነርሱን’ የሚል ብዙ ቁጥር ተውላጠ ስም መሆኑ በግርጌ ማስታወሻ ተጠብቋል።
