    text: በቃል በቃል፣ “እነርሱን ለሌላ ጊዜ አሳደረ።” ወይም፣ “የፍርድ ሂደቱን ለሌላ ጊዜ አሳደረ።” የግሪኩ ግስ የፍርድ እርምጃን ማዘግየት ወይም ለሌላ ጊዜ ማሳደር ሊያመለክት ይችላል።
