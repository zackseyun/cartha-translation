lexical_decisions:
- source_word: συνεπέθεντο
  choice: በክሱ ተባበሩ
  rationale: ግሱ ከሌሎች ጋር በጥቃት ወይም በተቃውሞ መተባበርን ያመለክታል። በዚህ የፍርድ ሂደት አውድ ‘በክሱ ተባበሩ’ የአይሁድን ከቀረበው ክስ ጋር መቀላቀል በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: δὲ καὶ
