  rationale: δὲ የትረካውን ፍሰት በቀላሉ ያስቀጥላል፤ καὶ ደግሞ አይሁድ በድርጊቱ መጨመራቸውን ያሳያል። ‘ደግሞ’ ሁለቱንም ተግባሮች በተፈጥሯዊ ሁኔታ ይይዛል።
- source_word: οἱ Ἰουδαῖοι
  choice: አይሁድ
  rationale: በችሎቱ የተገኙትን የአይሁድ ቡድን በቀጥታ ያመለክታል፤ ጽሑፉ በግልጽ ያልጨመረውን ‘ከሳሾች’ የሚል መግለጫ አልተጨመረም።
- source_word: φάσκοντες
