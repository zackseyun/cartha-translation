- source_word: οὕτως ἔχειν
  choice: እንደተባለው ነው
  rationale: ይህ የግሪክ ፈሊጥ ‘ነገሩ እንዲህ ነው’ ወይም ‘እውነታው ይህ ነው’ የሚል ፍቺ አለው። ምርጫው ክሶቹ በቀረቡበት መልክ እውነት ናቸው ብለው ማረጋገጣቸውን ያሳያል።
