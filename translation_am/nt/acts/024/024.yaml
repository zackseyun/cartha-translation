    text: ወይም፣ “በክርስቶስ ኢየሱስ።” የግሪኩ Χριστός እዚህ እንደ ማዕረግ ስለሚያገለግል “መሲሕ” ተብሎ ተተርጉሟል።
    reason: alternative_reading
