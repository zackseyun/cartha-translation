id: ACT.24.5
reference: Acts 24:5
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εὑρόντες γὰρ τὸν ἄνδρα τοῦτον λοιμὸν καὶ κινοῦντα ⸀στάσεις πᾶσι τοῖς Ἰουδαίοις τοῖς κατὰ τὴν οἰκουμένην πρωτοστάτην τε τῆς τῶν Ναζωραίων αἱρέσεως,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/005.yaml
  text: For we have found this man to be a plague, stirring up riots among all the Jews throughout the inhabited world, and also a ringleader of the sect of the Nazarenes,
translation:
  language: am
  text: ይህ ሰው ቸነፈር መሆኑን፣ በመላው ዓለም ባሉት አይሁድ ሁሉ መካከል ዓመፆችን እንደሚያስነሣ፣ እንዲሁም የናዝራውያን ወገን ዋና መሪ መሆኑን አግኝተናልና።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λοιμόν
  choice: እንደ ቸነፈር
  rationale: ቃሉ በቀጥታ ‘ቸነፈር/ወረርሽኝ’ ማለት ሲሆን እዚህ ሰውየውን እጅግ ጎጂና አደገኛ ነው ብሎ የሚከስ ዘይቤ ነው። ‘እንደ’ በማለት ዘይቤው በአማርኛ ግልጽ ሆኗል።
- source_word: κινοῦντα στάσεις
  choice: ዓመፅ ሲያስነሣ
  rationale: στάσεις በዚህ የፍርድ ክስ አውድ ሁከትን፣ አመፅን ወይም አመፃዊ ግጭትን ያመለክታል፤ ‘ዓመፅ’ የክሱን ፖለቲካዊ ክብደት ይጠብቃል።
- source_word: οἰκουμένην
  choice: መላው ዓለም
  rationale: በጥንቱ አጠቃቀም ‘የሰው የሚኖርበት ዓለም’ በተለይም የሮምን ዓለም ሊያመለክት ይችላል፤ ‘መላው ዓለም’ ተናጋሪው የሚያቀርበውን ሰፊ ክስ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: πρωτοστάτην
  choice: መሪ
  rationale: ቃሉ ቀዳሚ፣ ዋና መሪ ወይም ግንባር ቀደም የሆነን ሰው ያመለክታል፤ ‘መሪ’ በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: αἱρέσεως
  choice: ወገን
  rationale: በዚህ ዘመን ቃሉ በዋናነት ቡድን፣ ፓርቲ ወይም ክፍል ማለት ነው፤ ኋላ የጠነከረውን ‘ኑፋቄ’ የሚለውን መለኮታዊ ፍርድ ሳያስገባ ‘ወገን’ ገለልተኛውን ትርጉም ይጠብቃል።
- source_word: Ναζωραίων
  choice: ናዝራውያን
  rationale: የኢየሱስን ተከታዮች ተቃዋሚዎቻቸው የሚጠሩበትን የቡድን ስያሜ በቀጥታ ይጠብቃል።
theological_decisions:
- issue: αἵρεσις እንደ የኋለኛው ዘመን ‘ኑፋቄ’ መተርጎም
  choice: ወገን
  alternative: ኑፋቄ
  rationale: ጽሑፉ የጠርጤሎስን ክስ እየዘገበ ነው፤ αἵρεσις በዚህ አውድ ‘ቡድን/ወገን’ ማለት እንጂ የተረጋገጠ የመናፍቃን ፍርድ አይደለም።
- issue: የክሱን ንግግር እንደ ተራኪው ፍርድ አለማቅረብ
  choice: የክስ አቀራረቡን በቀጥታ ማቆየት
  alternative: ጳውሎስ በእርግጥ ዓመፅ እንዳስነሣ የሚያስመስል ማብራሪያ መጨመር
  rationale: ቁጥሩ የከሳሾቹን ቃል እንጂ የተራኪውን ማረጋገጫ አያቀርብም፤ ትርጉሙ ይህን የትረካ ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ የፍርድ ክስ ቋንቋ ተጠቅሟል። የግሪኩ ረጅም አረፍተ ነገርና የምክንያት አያያዥ γάρ ‘ና’ በሚለው መደምደሚያ ተጠብቋል።
