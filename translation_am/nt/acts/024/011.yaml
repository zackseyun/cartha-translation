  rationale: የገዥውን እውነታውን መርምሮ የማወቅ ችሎታ በፍርድ ነክ አውድ ያስተላልፋል፤ የአካባቢያዊውን ኃይል ከጥብቅ ምክንያታዊነት ይጠብቃል።
