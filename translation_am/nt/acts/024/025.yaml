- from: እርሱም ስለ ጽድቅ፣ ስለ ራስን መግዛትና ስለሚመጣው ፍርድ ሲወያይ፣ ፊልክስ ፈርቶ፣ “ለአሁኑ ሂድ፤ አመቺ ጊዜ ሳገኝ መልሼ እጠራሃለሁ” ብሎ መለሰ።
  to: እርሱም ስለ ጽድቅ፣ ስለ ራስን መግዛትና ስለሚመጣው ፍርድ ሲወያይ፣ ፊልክስ ፈርቶ፣ “ለአሁን ሂድ፤ አመቺ ጊዜ ሳገኝ እጠራሃለሁ” ብሎ መለሰ።
