id: ACT.24.25
reference: Acts 24:25
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: διαλεγομένου δὲ αὐτοῦ περὶ δικαιοσύνης καὶ ἐγκρατείας καὶ τοῦ κρίματος τοῦ ⸀μέλλοντος ἔμφοβος γενόμενος ὁ Φῆλιξ ἀπεκρίθη· Τὸ νῦν ἔχον πορεύου, καιρὸν δὲ μεταλαβὼν μετακαλέσομαί σε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/025.yaml
  text: But as he was discussing righteousness and self-control and the coming judgment, Felix became afraid and answered, “For now, go away. When I get an opportunity, I will summon you.”
translation:
  language: am
  text: እርሱም ስለ ጽድቅ፣ ስለ ራስን መግዛትና ስለሚመጣው ፍርድ ሲወያይ፣ ፊልክስ ፈርቶ፣ “ለአሁን ሂድ፤ አመቺ ጊዜ ሳገኝ እጠራሃለሁ” ብሎ መለሰ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαλεγομένου
  choice: ሲወያይ
  rationale: The verb denotes reasoned discussion or discourse; this natural Amharic rendering preserves that sense without reducing it merely to preaching.
- source_word: δικαιοσύνης
  choice: ጽድቅ
  rationale: A standard, dignified equivalent that retains the term’s moral and theological range.
- source_word: ἐγκρατείας
  choice: ራስን መግዛት
  rationale: A clear modern Amharic expression for self-control or mastery over one’s impulses.
- source_word: τοῦ κρίματος τοῦ μέλλοντος
  choice: ስለሚመጣው ፍርድ
  rationale: Directly represents the coming judgment while preserving its future orientation.
- source_word: ἔμφοβος γενόμενος
  choice: ፈርቶ
  rationale: Naturally expresses Felix becoming afraid in context without unnecessary intensification.
- source_word: Τὸ νῦν ἔχον πορεύου
  choice: ለአሁኑ ሂድ
  rationale: Idiomatic and concise, conveying dismissal for the present rather than permanently.
- source_word: καιρὸν δὲ μεταλαβὼν
  choice: አመቺ ጊዜ ሳገኝ
  rationale: Conveys obtaining or finding a suitable opportunity, without asserting whether Felix sincerely intended to do so.
- source_word: μετακαλέσομαί σε
  choice: መልሼ እጠራሃለሁ
  rationale: Preserves the sense of summoning Paul again.
theological_decisions:
- issue: Scope of δικαιοσύνη
  choice: ጽድቅ
  alternative: ትክክለኛ ኑሮ
  rationale: The broader term avoids narrowing righteousness solely to ethical conduct or importing a specialized doctrinal explanation.
- issue: Nature of the future judgment
  choice: ስለሚመጣው ፍርድ
  alternative: ስለ መጨረሻው ፍርድ
  rationale: The source says the judgment that is coming, not explicitly the final judgment; the translation therefore preserves the wording and its theological openness.
translation_notes:
  register: Modern standard Amharic in Ge’ez script, with dignified but ordinary phrasing. The parallel sequence ስለ ጽድቅ፣ ስለ ራስን መግዛትና ስለሚመጣው ፍርድ reflects the Greek coordination clearly. No footnotes are needed.
