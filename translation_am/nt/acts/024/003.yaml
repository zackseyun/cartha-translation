  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ይህን እውቅና እንሰጣለን” ወይም “ይህን በደስታ እንቀበላለን።” የግሪኩ ግስ “መቀበል” ወይም “በደስታ መቀበል” ማለት ሊሆን ይችላል፤ በዚህ የመደበኛ ሙገሳ አውድ ግን ለፊልክስ የተሰጡትን ጥቅሞች በይፋ እውቅና መስጠትን ማመልከቱ ይበልጥ ይታያል።
    reason: lexical_alternative
