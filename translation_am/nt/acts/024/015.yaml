  text: having hope in God—which these men themselves also accept—that there is going to be a resurrection of both the righteous and the unrighteous[a].
translation:
  language: am
  text: በእግዚአብሔር ተስፋ አለኝ፤ እነዚህም ራሳቸው የሚቀበሉት ተስፋ ነው፤ ይኸውም የጻድቃንም የዓመፀኞችም ትንሣኤ እንደሚሆን ነው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እነርሱ ራሳቸውም የሚጠባበቁት።” የግሪኩ ግስ “መቀበል” ወይም “ተስፋ አድርጎ መጠባበቅ” ማለት ሊሆን ይችላል፤ እዚህ ላይ የጋራ ተስፋቸውን የሚያጎላ ይመስላል።
