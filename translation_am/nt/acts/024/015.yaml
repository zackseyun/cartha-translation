review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys hope directed to God, the emphatic shared expectation of Paul's present opponents, and the inclusion of both righteous and unrighteous. However, it recasts the Greek noun phrase “a resurrection ... of righteous and unrighteous” as a verbal clause and does not explicitly express the future-expectation force of μέλλειν ἔσεσθαι as fully as a revised rendering can.
  naturalness: The Amharic is generally clear, but “ጻድቃንም ዓመፀኞችም ከሙታን እንደሚነሡ” is somewhat less idiomatic and less formally parallel to the source than a noun-based expression with “ትንሣኤ.” “በእግዚአብሔር ተስፋ አለኝ” is a natural modern-standard expression for the opening.
  terminology: Use the established, precise biblical term “ትንሣኤ” for ἀνάστασις. Retain “ጻድቃን” and “ዓመፀኞች” for the explicit moral contrast, without adding any doctrinal detail concerning timing or judgment.
  issues:
  - severity: medium
    issue: ἀνάστασιν is rendered as a finite verbal clause rather than as “ትንሣኤ.”
    rationale: Although the draft communicates rising from the dead, the Greek explicitly uses the noun “resurrection.” Using “ትንሣኤ” is both more precise and more natural in this formal biblical register.
  - severity: low
    issue: The future prospective force of μέλλειν ἔσεσθαι is only implicit.
    rationale: “እንደሚነሡ” can indicate a future event in context, but “ትንሣኤ እንደሚሆን” more directly conveys that a resurrection is going to take place.
  - severity: low
    issue: The relation of the resurrection to both groups can be expressed more closely to the Greek.
    rationale: “የጻድቃንም የዓመፀኞችም ትንሣኤ” preserves the source’s genitive construction and its inclusive τε καί pairing.
  revised_text: በእግዚአብሔር ተስፋ አለኝ፤ እነዚህም ራሳቸው የሚቀበሉት ተስፋ ነው፤ ይኸውም የጻድቃንም የዓመፀኞችም ትንሣኤ እንደሚሆን ነው።[a]
