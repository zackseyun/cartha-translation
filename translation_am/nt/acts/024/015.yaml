lexical_decisions:
- source_word: ἐλπίδα ἔχων εἰς τὸν θεόν
  choice: በእግዚአብሔር ተስፋ አድርጌአለሁ
  rationale: የተስፋውን ዒላማ በግልጽ ያሳያል፤ የግሪኩን የስምና የአሳታፊ ግስ አወቃቀር በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል።
- source_word: καὶ αὐτοὶ οὗτοι
  choice: እነዚህ ሰዎች ራሳቸውም
  rationale: οὗτοι ያለውን የቅርብ ጠቋሚነትና αὐτοὶ ያለውን አጽንዖት ይጠብቃል፤ የፍርድ ቤቱን አውድም ያስማማል።
- source_word: προσδέχονται
  choice: የሚቀበሉት
  rationale: በዚህ አውድ ጳውሎስ ከከሳሾቹ ጋር ያለውን የጋራ እምነት እያጎላ ነው። ግሱ ‘ይጠባበቃሉ’ የሚል ትርጉምም ሊኖረው ስለሚችል አማራጩ በማስታወሻ ተጠብቋል።
- source_word: ἀνάστασιν
  choice: ከሙታን እንደሚነሡ
  rationale: ‘ትንሣኤ’ የሚለውን የስም ቅርጽ በግልጽ የግስ ሐረግ በመግለጽ ለዘመናዊ አንባቢ ተፈጥሯዊ ያደርገዋል፤ ከሞት መነሣት መሆኑንም ያሳያል።
- source_word: μέλλειν ἔσεσθαι
  choice: እንደሚነሡ
  rationale: የወደፊቱን እርግጠኛ ክስተት በአማርኛው የወደፊት ግስ ያስተላልፋል፤ ‘በቅርቡ’ የሚል በግሪኩ ያልተወሰነ ጊዜያዊ ትርጉም አያስገባም።
- source_word: δικαίων τε καὶ ἀδίκων
  choice: ጻድቃንም ዓመፀኞችም
  rationale: የሁለቱን የሥነ ምግባር ተቃርኖና τε καὶ የሚያመለክተውን ሁለቱንም የማካተት ኃይል ይጠብቃል።
theological_decisions:
- issue: ትንሣኤው የሚያካትታቸው ወገኖች
  choice: ጻድቃንም ዓመፀኞችም ከሙታን እንደሚነሡ
  alternative: የሰዎች አጠቃላይ ትንሣኤ ብቻ ብሎ መግለጽ
  rationale: ግሪኩ ጻድቃንንና ዓመፀኞችን በግልጽ ይጠቅሳል። ትርጉሙ ይህን ወሰን ይጠብቃል፤ ስለ ትንሣኤያቸው ጊዜ፣ ቅደም ተከተል ወይም የፍርድ ሥርዓት ግን ጽሑፉ ያልገለጸውን አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ረዥሙ የግሪክ አወቃቀር በሰሚኮሎን ተከፍሎ የ‘ተስፋ’ ማጣቀሻ በግልጽ ተደግሟል።
