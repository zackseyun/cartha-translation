    text: ወይም፣ በአውዱ ይበልጥ በግልጽ፣ “ከጳውሎስ ጉቦ ይጠብቅ ነበር።” የግሪኩ ጽሑፍ ግን በቀጥታ “ገንዘብ” ይላል።
