- source_word: μεταπεμπόμενος
  choice: ያስጠራው
  rationale: ፊልክስ ጳውሎስን ወደ ራሱ እንዲያመጡት ማዘዙን ከእስር ዐውዱ ጋር በሚስማማ መንገድ ያሳያል።
- source_word: ὡμίλει αὐτῷ
  choice: ያነጋግረው ነበር
  rationale: ቃሉ መደበኛ ንግግር ወይም ውይይትን ያመለክታል፤ ይህም ተደጋጋሚና ግላዊ ውይይቱን በተፈጥሯዊ አማርኛ ይገልጻል።
theological_decisions:
- issue: የፊልክስን ብልሹ ዓላማ በዋናው ጽሑፍ ‘ጉቦ’ ብሎ በግልጽ መግለጽ ወይም አለመግለጽ
  choice: በዋናው ጽሑፍ ‘ገንዘብ’ ብሎ ማቆየትና የጉቦውን አንድምታ ለዐውዱ እና ለግርጌ ማስታወሻው መተው
  alternative: ‘ጳውሎስ ጉቦ እንደሚሰጠው’ ወይም ‘ከጳውሎስ ጉቦ ይጠብቅ ነበር’ ብሎ መተርጎም
  rationale: ዐውዱ ጉቦን በጠንካራ ሁኔታ ቢያመለክትም χρήματα በቀጥታ ‘ገንዘብ’ ይላል እንጂ ለጉቦ የተለየ ቃል አይጠቀምም። ስለዚህ የምንጩን ትክክለኛ የቃል ወሰንና የትረካውን አንድምታ ሁለቱንም ተጠብቋል።
