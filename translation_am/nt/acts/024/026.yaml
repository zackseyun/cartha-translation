base_translation:
  language: en
  yaml_path: translation/nt/acts/024/026.yaml
  text: At the same time he was hoping that money would be given to him by Paul[a]; therefore he also sent for him more often and talked with him.
translation:
  language: am
  text: በዚሁ ጊዜም ጳውሎስ ገንዘብ እንደሚሰጠው[a] ተስፋ ያደርግ ነበር፤ ስለዚህም ይበልጥ አዘውትሮ ያስጠራውና ከእርሱ ጋር ይነጋገር ነበር።
  philosophy: optimal-equivalence
  footnotes:
