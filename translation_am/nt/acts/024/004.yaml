  language: am
  text: 'ነገር ግን፣ ከዚህ በላይ እንዳላዘገይህ[a]፣ በቸርነትህ[b] በአጭሩ እንድትሰማን እለምንሃለሁ።


    [a] ወይም፣ “ከዚህ በላይ ጊዜህን እንዳልወስድ።”


    [b] ወይም፣ “በርኅራኄህ” ወይም “በደግነትህ።” የግሪክኛው ቃል ፍትሐዊነትን፣ ገርነትን ወይም በፍርድ ጊዜ ርኅራኄ ማሳየትን ሊያመለክት ይችላል።'
  philosophy: optimal-equivalence
