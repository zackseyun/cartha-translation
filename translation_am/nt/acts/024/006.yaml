lexical_decisions:
- source_word: ὃς
  choice: እርሱም
  rationale: አንጻራዊው ተውላጠ ስም በቀደመው ክስ የተጠቀሰውን ጳውሎስን ያመለክታል፤ በአማርኛ የክሱን ቀጣይነት በተፈጥሮ ለማሳየት «እርሱም» ተመርጧል።
- source_word: καὶ
  choice: እንኳ
  rationale: በዚህ የክስ አውድ καὶ ክሱን የሚያጠናክር ኃይል አለው፤ «እንኳ» ይህን አጽንዖት በዘመናዊ አማርኛ ያስተላልፋል።
- source_word: τὸ ἱερὸν
  choice: መቅደሱን
  rationale: ἱερόν የቤተ መቅደሱን አጠቃላይ ግቢ ሊያመለክት ይችላል፤ «መቅደስ» ግን በአማርኛ የተለመደና በአውዱ ግልጽ ነው።
- source_word: ἐπείρασεν
  choice: ሞከረ
  rationale: ግሱ ድርጊቱን ለማድረግ መሞከርን እንጂ መፈጸሙን አያመለክትም፤ «ሞከረ» ይህን በቀጥታ ይገልጣል።
- source_word: βεβηλῶσαι
  choice: ሊያረክስ
  rationale: βεβηλόω ቅዱስ ቦታን ማርከስ ወይም ቅድስናውን መድፈር ማለት ነው፤ «ሊያረክስ» የቤተ መቅደስ ንጽሕናንና ቅድስናን የሚመለከተውን ክስ በተደራሽ ቋንቋ ያሳያል።
- source_word: ὃν
  choice: -ው
  rationale: ጳውሎስን የሚያመለክተው ተሳቢ ተውላጠ ስም በአማርኛ «ያዝነው» በሚለው ግስ ውስጥ በተፈጥሮ ተካትቷል።
- source_word: ἐκρατήσαμεν
  choice: ያዝነው
  rationale: κρατέω እዚህ በኃይል መያዝን ወይም ቁጥጥር ሥር ማዋልን ያመለክታል፤ «ያዝነው» ከመደበኛው «አሰርነው» ይልቅ የግሪኩን አካላዊ የመያዝ ገጽታ ይጠብቃል።
theological_decisions:
- issue: የሐዋርያት ሥራ 24፥6 አጭር ንባብና ረዥም የቅጂ ልዩነት
