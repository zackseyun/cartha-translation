  rationale: የቀረበው የግሪክ ምንጭ አጭሩን ንባብ ይዟል፤ ስለዚህ ተጨማሪው ንባብ ወደ ዋናው ጽሑፍ ሳይገባ ለአንባቢዎች በግርጌ ማስታወሻ ተጠቅሷል።
