- source_word: μετὰ πολλῆς βίας
  choice: በታላቅ ኃይል
  rationale: ሐረጉ ኃይል ተጠቅሞ ከእጃቸው ማስወጣቱን ያሳያል፤ «ግፍ» ብሎ የሥነ ምግባር ፍርድ ከመጨመር ይልቅ የግሪኩን አካላዊ ማስገደድ ይጠብቃል።
- source_word: ἀπήγαγεν (ἀπάγω)
  choice: ወስዶታል
  rationale: ግሱ አንድን ሰው ከቦታው ይዞ ማስወገድን ያመለክታል። «ከእጃችን ወስዶታል» ከἐκ τῶν χειρῶν ἡμῶν ጋር ተያይዞ በአማርኛ ተፈጥሯዊና ግልጽ ነው።
