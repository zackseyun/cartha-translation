  text: ἐν τούτῳ ⸀καὶ αὐτὸς ἀσκῶ ἀπρόσκοπον συνείδησιν ⸀ἔχειν πρὸς τὸν θεὸν καὶ τοὺς ἀνθρώπους διὰ παντός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/016.yaml
  text: In view of this[a], I myself also strive always to have a blameless conscience before God and men.
translation:
  language: am
  text: ስለዚህ[a] እኔ ራሴም ሁልጊዜ በእግዚአብሔርና በሰዎች ፊት ነቀፋ የሌለበት ሕሊና እንዲኖረኝ እጥራለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በዚህ ምክንያት»።
    reason: ἐν τούτῳ በቀጥታ «በዚህ» ማለት ሲሆን፣ በዐውዱ ከቀደመው የተስፋ ገለጻ የሚነሣ ምክንያታዊ ወይም ውጤታዊ ግንኙነትን ያመለክታል።
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: ስለዚህ
  rationale: አገላለጹ በቀደመው ክፍል የተጠቀሰውን የትንሣኤ ተስፋ መሠረት ያደረገ ውጤታዊ ግንኙነት ያሳያል፤ «ስለዚህ» ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: καὶ αὐτὸς
  choice: እኔም
  rationale: «እኔ» የαὐτόςን አጽንዖት፣ «-ም» ደግሞ የκαίን ጨማሪ ኃይል በአጭርና ተፈጥሯዊ መንገድ ይጠብቃሉ።
- source_word: ἀσκῶ
  choice: እጥራለሁ
  rationale: ቃሉ ልምምድን፣ ራስን ማሰልጠንን ወይም ትጋትን ያመለክታል፤ «እጥራለሁ» በዚህ ዐውድ ያለውን ቀጣይ የሥነ ምግባር ጥረት ያሳያል።
- source_word: ἀπρόσκοπον
  choice: ነቀፋ የሌለበት
  rationale: ቃሉ መሰናክል ካለመሆንና ከወቀሳ ነጻ ከመሆን ጋር የተያያዘ ነው፤ ከ«ሕሊና» ጋር «ነቀፋ የሌለበት» ግልጽና ክብር ያለው ዘመናዊ አገላለጽ ነው።
- source_word: συνείδησιν
  choice: ሕሊና
  rationale: የውስጥ የሥነ ምግባር ግንዛቤንና ራስን የመመርመር ችሎታን ለሚያመለክተው συνείδησις የተለመደና ተገቢ የአማርኛ ቃል ነው።
- source_word: ἔχειν
  choice: እንዲኖረኝ
  rationale: ከἀσκῶ ጋር የጥረቱን ዓላማ የሚገልጽ የግስ አወቃቀር ነው፤ በአማርኛ «እንዲኖረኝ እጥራለሁ» ተፈጥሯዊ ነው።
- source_word: πρὸς τὸν θεὸν καὶ τοὺς ἀνθρώπους
  choice: በእግዚአብሔርና በሰዎች ፊት
  rationale: πρός በዚህ ስፍራ ግንኙነትንና ተጠያቂነትን ይገልጻል፤ «በ…ፊት» ይህን በተለመደ የአማርኛ አነጋገር ያስተላልፋል። ἀνθρώπους በዐውዱ ሁሉንም ሰዎች በአጠቃላይ ስለሚያመለክት «ሰዎች» ተመርጧል።
- source_word: διὰ παντός
  choice: ሁልጊዜ
  rationale: ሐረጉ ቀጣይነትን ወይም በሁሉም ጊዜ መሆንን ይገልጻል፤ «ሁልጊዜ» ግልጽና ዘመናዊ አቻ ነው።
theological_decisions:
- issue: ἀνθρώπους በአጠቃላይ ለሰው ልጆች የተጠቀመ መሆኑ
  choice: ሰዎች
  alternative: የሰው ልጆች
  rationale: ምንም እንኳ ἀνθρώπους የወንድ ፆታ ብዙ ቁጥር ቅርጽ ቢኖረውም፣ እዚህ ወንዶችን ብቻ ሳይሆን ሰዎችን በአጠቃላይ ይወክላል። «ሰዎች» ይህን ትርጉም በትክክልና በተፈጥሯዊ አማርኛ ያቀርባል።
- issue: የἐν τούτῳ የምክንያት ወይም የማጣቀሻ ኃይል
  choice: ስለዚህ
  alternative: በዚህም
  rationale: የግሪኩ ሐረግ «በዚህ» ተብሎ በቅርብ ሊተረጎም ቢችልም፣ በዐውዱ ጳውሎስ በቀደመው ቁጥር ከገለጸው የትንሣኤ ተስፋ የሚነሣ የተግባር ውጤት እየገለጸ ነው። «ስለዚህ» ግንኙነቱን ግልጽ ያደርጋል፤ የትንሣኤው ተስፋ እንደ ማጣቀሻም ሆነ እንደ ምክንያት መታየቱን አይክድም።
