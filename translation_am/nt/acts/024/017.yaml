  yaml_path: translation/nt/acts/024/017.yaml
  text: After several years I came to bring alms to my nation[a], and offerings.
translation:
  language: am
  text: ከብዙ ዓመታት በኋላ ግን ለሕዝቤ ምጽዋት[a] ለመስጠትና መባዎችን ለማቅረብ መጣሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ምጽዋት” የሚለው የግሪክ ቃል ለተቸገሩ የሚሰጡ የርኅራኄ ስጦታዎችን ያመለክታል።
    reason: lexical_clarification
lexical_decisions:
- source_word: δι’ ἐτῶν δὲ πλειόνων
  choice: ከብዙ ዓመታት በኋላ ግን
  rationale: διά ከግሳዊ ጊዜ አገላለጽ ጋር ‘ከ…በኋላ’ የሚል ፍቺ አለው፤ πλειόνων በዚህ አውድ ረዘም ያለ የዓመታት ጊዜን ያመለክታል። δέ ያለውን ቀላል የንግግር ሽግግር ‘ግን’ ያስተላልፋል።
- source_word: ἐλεημοσύνας
  choice: ምጽዋት
  rationale: ቃሉ ለተቸገሩ የሚሰጥ የርኅራኄ ስጦታን ያመለክታል፤ ‘ምጽዋት’ በአማርኛ ይህን ትርጉም በአጭሩ ይገልጣል።
- source_word: ποιήσων
  choice: ለመስጠት
  rationale: ποιέω በቀጥታ ‘ማድረግ’ ሊባል ቢችልም፣ ከἐλεημοσύνας ጋር የምጽዋት መስጠትን የሚገልጥ ፈሊጣዊ አገላለጽ ነው።
- source_word: εἰς τὸ ἔθνος μου
  choice: ለሕዝቤ
  rationale: ἔθνος እዚህ ጳውሎስ የራሱ ወገን አድርጎ የሚጠራውን የአይሁድን ሕዝብ ያመለክታል፤ ‘ለሕዝቤ’ አቅጣጫውንና ዝምድናውን በተፈጥሮ ይገልጣል።
- source_word: παρεγενόμην
  choice: መጣሁ
  rationale: በዚህ አውድ ግሱ ወደ ስፍራው መምጣትን ወይም መድረስን ያመለክታል፤ ‘መጣሁ’ ተፈጥሯዊና ግልጽ ነው።
- source_word: προσφοράς
  choice: መባዎችን
  rationale: ቃሉ በተለይ በአምልኮ አውድ የሚቀርቡ ስጦታዎችን ወይም መባዎችን ያመለክታል፤ የግሪኩን ሰፊ ፍቺ ሳያጠብ ‘መባዎችን’ ተመርጧል።
theological_decisions:
- issue: ጳውሎስ ለሕዝቡ ያመጣው የርኅራኄ እርዳታ ባሕርይ
  choice: ἐλεημοσύναςን ‘ምጽዋት’ ብሎ መተርጎም
  alternative: ‘ለድሆች የሚሰጥ ስጦታ’ ወይም ‘የበጎ አድራጎት ስጦታ’
  rationale: ይህ በዋናነት የቃላት ምርጫ እንጂ የትምህርተ እምነት ውሳኔ አይደለም። ‘ምጽዋት’ የተቸገሩትን ለመርዳት የሚሰጥ ስጦታ መሆኑን ይጠብቃል፤ የግሪኩንም አጭርነት ያንጸባርቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። ‘ምጽዋት’ እና ‘መባ’ በመለየት የርኅራኄ ስጦታውን ከአምልኮ መባዎች ጋር አያደባልቅም።
