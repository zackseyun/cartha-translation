base_translation:
  language: en
  yaml_path: translation/nt/acts/012/021.yaml
  text: On an appointed day[a], Herod, having put on royal clothing and having sat down on the tribunal[b], was delivering a public address to them.
translation:
  language: am
  text: በተወሰነ ቀንም ሄሮድስ ንጉሣዊ ልብስ[a] ለብሶ፣ በመድረኩ[b] ላይ ተቀምጦ፣ በሕዝብ ፊት ለእነርሱ ንግግር እያደረገ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የንጉሥ አልባሳት።” የግሪኩ ቃል በአጠቃላይ ድንቅ ወይም የከበረ አለባበስንም ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በፍርድ ወንበሩ ላይ” ወይም “በኦፊሴላዊ መድረኩ ላይ።” የግሪኩ βῆμα ብዙ ጊዜ ኦፊሴላዊ ወንበርን ወይም ከፍ ያለ መድረክን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: τακτῇ δὲ ἡμέρᾳ
  choice: በተወሰነ ቀንም
  rationale: τακτός ቀድሞ የተወሰነ ወይም የተቀጠረ ቀንን ያመለክታል፤ ደግሞም δέ ያለውን ቀላል የትረካ ትስስር “ም” ይጠብቃል።
- source_word: ἐνδυσάμενος
  choice: ለብሶ
  rationale: የአኦሪስት መካከለኛ አንቀጽ ሄሮድስ ራሱ ልብሱን ከለበሰ በኋላ የተከተለውን ድርጊት ያሳያል፤ “ለብሶ” በአማርኛ አጭርና ተፈጥሯዊ ነው።
- source_word: ἐσθῆτα βασιλικὴν
  choice: ንጉሣዊ ልብስ
  rationale: ἐσθής በአጠቃላይ ልብስን ወይም አለባበስን ሊያመለክት ስለሚችል፣ ከጽሑፉ በላይ የተወሰነ የልብስ ዓይነት ሳይጨመር “ንጉሣዊ ልብስ” ተመርጧል።
- source_word: καθίσας
  choice: ተቀምጦ
  rationale: ይህ የቀደመ ድርጊትንና የድርጊቶቹን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐπὶ τοῦ βήματος
  choice: በዙፋነ ፍርዱ ላይ
  rationale: βῆμα ባለሥልጣን የሚቀመጥበትን የፍርድ ወንበር ወይም ከፍ ያለ ኦፊሴላዊ መድረክ ሊያመለክት ይችላል። “ዙፋነ ፍርድ” ኦፊሴላዊውን ትርጉም ይጠብቃል፤ አማራጩ በማስታወሻ ተገልጧል።
- source_word: ἐδημηγόρει
  choice: በሕዝብ ፊት ንግግር ያደርግ ነበር
  rationale: δημηγορέω በሕዝባዊ ጉባኤ ፊት መናገርን ያመለክታል፤ የኢምፐርፌክት ቅርጹንም “ያደርግ ነበር” በማለት እየተካሄደ እንደነበረ ተጠብቋል።
- source_word: πρὸς αὐτούς
  choice: ለእነርሱ
  rationale: ንግግሩ ወደተመለከተው አድማጭ ቡድን መቅረቡን በቀጥታ ያሳያል።
