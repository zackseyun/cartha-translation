  verdict: revise
  source_fidelity: The draft conveys Peter's realization, his movement to Mary's house, John's additional name Mark, and the gathered group's ongoing prayer. However, the relative construction around John, Mark, Mary, and the house is overly tangled in Amharic, and the footnote marker is placed at the end of the verse rather than beside the name phrase it explains.
  naturalness: The current sequence “ማርቆስ ተብሎ ወደሚጠራው የዮሐንስ እናት ወደ ሆነችው ወደ ማርያም ቤት” is difficult to parse. Splitting the identification of Mary into a separate clause produces clear, modern standard Amharic without adding meaning.
  terminology: The established biblical Amharic forms ማርያም, ዮሐንስ, and ማርቆስ are appropriate. “ማርቆስ ተብሎ የሚጠራው” naturally represents the additional-name construction without requiring “ደግሞ.”
  issues:
  - severity: medium
    issue: The modifier chain identifying Mary is syntactically cumbersome and temporarily obscures who is called Mark and whose house Peter entered.
    rationale: Greek identifies Mary as John's mother and John as the one called Mark. In the draft, repeated “ወደ” forms and nested relatives make these relationships difficult to follow in natural Amharic.
  - severity: medium
    issue: Footnote marker [a] is detached from the expression “ማርቆስ ተብሎ የሚጠራው” that it documents.
    rationale: The marker should immediately follow the additional-name phrase, rather than appear after the final prayer clause.
