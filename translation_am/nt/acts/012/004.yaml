base_translation:
  language: en
  yaml_path: translation/nt/acts/012/004.yaml
  text: After arresting him[a], he put him in prison, handing him over to four squads of soldiers to guard him[b], intending to bring him out to the people after the Passover.
translation:
  language: am
  text: እርሱንም ከያዘው በኋላ በወኅኒ አኖረው፤ እንዲጠብቁትም እያንዳንዳቸው አራት ወታደሮች ላሉባቸው አራት ቡድኖች[a] አስረከበው። ከአይሁድ ፋሲካ[b] በኋላ በሕዝቡ ፊት ሊያቀርበው አስቦ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በቃል በቃል፣ “አራት የወታደሮች አራት-አራት ቡድኖች”፤ ይህም እያንዳንዱ አራት ወታደሮች ያሉት አራት ቡድኖች ማለት ነው።
    reason: lexical_alternative
  - marker: b
    text: የግሪኩ πάσχα የአይሁድን ፋሲካ ያመለክታል፤ በአንዳንድ የቆዩ የእንግሊዝኛ ትርጉሞች ግን በዚህ ስፍራ “Easter” ተብሎ ተተርጉሟል።
    reason: alternative_reading
lexical_decisions:
- source_word: πιάσας
  choice: ከያዘው በኋላ
  rationale: የቀደመውን የቁጥጥር ድርጊትና ከዋናው ግስ ጋር ያለውን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἔθετο εἰς φυλακήν
  choice: በወኅኒ አኖረው
  rationale: የእስር ቦታ ማስገባትን በክቡር የትረካ ቋንቋ የሚገልጽ ተፈጥሯዊ አገላለጽ ነው።
- source_word: παραδοὺς
  choice: አስረከበው
  rationale: ጴጥሮስን ለወታደሮቹ ጥበቃ በኃላፊነት መስጠቱን ያሳያል።
- source_word: τέσσαρσιν τετραδίοις στρατιωτῶν
  choice: አራት አራት ወታደሮች ላሉባቸው አራት ቡድኖች
  rationale: τετράδιον እያንዳንዱ አራት አባላት ያሉትን ቡድን ስለሚያመለክት፣ የቡድኖቹንም ብዛት የእያንዳንዳቸውንም አባላት ብዛት በግልጽ ያስቀምጣል።
- source_word: φυλάσσειν αὐτόν
  choice: እንዲጠብቁት
  rationale: ወታደሮቹ የተረከቡበትን ዓላማ በአጭርና በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: βουλόμενος
  choice: አስቦ ነበር
  rationale: የሄሮድስን የታቀደ ዓላማ ያሳያል፤ ስሜታዊ ፍላጎትን ከሚያጎላ አተረጓጎም ይርቃል።
- source_word: μετὰ τὸ πάσχα
  choice: ከአይሁድ ፋሲካ በኋላ
  rationale: በዚህ ዐውድ πάσχα የሚያመለክተው የአይሁድን የፋሲካ በዓል ነው፤ በአማርኛ «ፋሲካ» ብቻውን የክርስቲያኖችን የትንሣኤ በዓልም ሊያመለክት ስለሚችል «አይሁድ» የሚለው መግለጫ የምንጩን ትርጉም ግልጽ ያደርጋል።
- source_word: ἀναγαγεῖν αὐτὸν τῷ λαῷ
  choice: ወደ ሕዝቡ ሊያወጣው
  rationale: ለሕዝቡ ፊት በይፋ ለማቅረብ ከወኅኒ ማውጣትን ይገልጻል፤ ጽሑፉ በግልጽ ያልጠቀሰውን መደበኛ ፍርድ አያክልም።
- source_word: λαῷ
  choice: ሕዝቡ
  rationale: በሐዋርያት ሥራ ውስጥ በይፋ የተሰበሰበውን ወይም የሚመለከተውን ሕዝብ በተፈጥሯዊና ሰፊ ትርጉም ይገልጻል።
theological_decisions:
- issue: የπάσχα አተረጓጎም
  choice: አይሁድ ፋሲካ
  alternative: ፋሲካ / የትንሣኤ በዓል
  rationale: የግሪኩ πάσχα በዚህ ስፍራ የአይሁድን Passover ያመለክታል። «የትንሣኤ በዓል» ብሎ መተርጎም የኋለኛውን የክርስቲያን በዓል ወደ ጽሑፉ ያስገባል፤ «ፋሲካ» ብቻውንም በዘመናዊ አማርኛ አሻሚ ሊሆን ስለሚችል የአይሁድ በዓል መሆኑ ተገልጿል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክቡር የትረካ አማርኛን ይጠቀማል። «ወኅኒ» መደበኛውን የመጽሐፍ ቅዱስ ትረካ ክብር ሲጠብቅ፣ የዓረፍተ ነገሩ አወቃቀር ለዘመናዊ አንባቢ ቀላል እንዲሆን በሁለት ሐረጎች ተደራጅቷል።
