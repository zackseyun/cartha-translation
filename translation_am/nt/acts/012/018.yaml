  text: Γενομένης δὲ ἡμέρας ἦν τάραχος οὐκ ὀλίγος ἐν τοῖς στρατιώταις, τί ἄρα ὁ Πέτρος ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/018.yaml
  text: When day came[a], there was no small disturbance among the soldiers over what had become of Peter.
translation:
  language: am
  text: ቀን ሲሆን፣ በጴጥሮስ ላይ ምን እንደ ደረሰ በወታደሮቹ መካከል ትንሽ ያልሆነ ግርግር ተነሣ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: ቀን በሆነ ጊዜ
  rationale: የግሪኩን ጊዜ ገላጭ genitive absolute በተፈጥሯዊ አማርኛ ያስተላልፋል፤ δέ ያለው የትረካ ሽግግር በአማርኛው የአንቀጽ አወቃቀር ተሸክሟል።
- source_word: τάραχος οὐκ ὀλίγος
  choice: ትንሽ ያልሆነ ሁከት
  rationale: οὐκ ὀλίγος የሚለውን ሊቶቲስ ሳያለሰልስ ‘ትንሽ ያልሆነ’ ብሎ ይጠብቃል፤ ‘ሁከት’ ደግሞ በቡድኑ ውስጥ የተነሣውን ግርግርና መታወክ ያመለክታል።
- source_word: ἐν τοῖς στρατιώταις
  choice: በወታደሮቹ መካከል
  rationale: στρατιώταιςን በቀጥታ ‘ወታደሮች’ ብሎ ይተረጉማል፤ ἐν ደግሞ ሁከቱ በየትኛው ቡድን ውስጥ እንደነበር በ‘መካከል’ ያሳያል።
- source_word: τί ἄρα
  choice: ምን እንደሆነ
  rationale: ወታደሮቹ በመደነቅና በመጠየቅ የጴጥሮስን ሁኔታ ለማወቅ መፈለጋቸውን እንደ ተዘዋዋሪ ጥያቄ ያቀርባል፤ ἄρα የሚያክለው የግራ መጋባት ጥላ በአውዱ ይገኛል።
- source_word: ὁ Πέτρος
  choice: ጴጥሮስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ ልማድ የጸናውን የግል ስም ቅርጽ ይጠቀማል።
- source_word: ἐγένετο
  choice: እንደሆነ
  rationale: τί ... ἐγένετο የሚለውን ‘ምን ሆነ/ምን ደረሰበት’ የሚል ፈሊጣዊ ትርጉም ይይዛል፤ አገባቡ ጴጥሮስ ወዴት እንደጠፋ ያለውን ጥያቄ ክፍት ያደርጋል።
