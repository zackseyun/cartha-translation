review_pass:
  verdict: revise
  source_fidelity: The temporal clause and the litotic expression are substantially represented, and “ወታደሮቹ” accurately renders στρατιώταις. However, the draft’s “ጴጥሮስ ምን እንደሆነ” is syntactically liable to mean “what Peter was/is,” rather than the indirect question “what had become of Peter.”
  naturalness: “ቀን ሲሆን” is a more natural modern-standard rendering of the temporal genitive absolute. Recasting the final clause with “በጴጥሮስ ላይ ምን እንደ ደረሰ” makes the intended sense clear and idiomatic.
  terminology: “ጴጥሮስ” follows established Amharic biblical usage. “ግርግር” is a natural term for the soldiers’ substantial disturbance, while “ትንሽ ያልሆነ” retains the Greek litotes without adding an unwarranted cause or degree of violence.
  issues:
  - severity: medium
    issue: The indirect question is ambiguously and unnaturally attached to Peter.
    rationale: “ጴጥሮስ ምን እንደሆነ” can be read as asking what Peter is, not what happened to him. The Greek τί ἄρα ὁ Πέτρος ἐγένετο concerns Peter’s fate/whereabouts.
  revised_text: ቀን ሲሆን፣ በጴጥሮስ ላይ ምን እንደ ደረሰ በወታደሮቹ መካከል ትንሽ ያልሆነ ግርግር ተነሣ።
