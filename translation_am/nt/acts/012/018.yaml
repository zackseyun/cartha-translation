translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ሊቶቲስ ለአጽንዖቱ በቅርብ ቅርጽ ተጠብቋል። በቀረበው የእንግሊዝኛ ጽሑፍ ያለው [a] ማስታወሻ ከጠቀሰው ጽሑፍ ጋር የማይዛመድ ስለሆነ እና ለአማርኛው ረቂቅ አስፈላጊ የሆነ የጽሑፍ ልዩነት ስለሌለ አልተጨመረም።
