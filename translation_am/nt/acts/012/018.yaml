  rationale: The revision clarifies the Greek idiom τί ... ἐγένετο as an indirect question about what happened to Peter, while preserving the source’s temporal transition, its litotic “not small” emphasis, and the location of the disturbance among the soldiers. No Amharic footnote is required, since the English note supplies only an English stylistic alternative and no textual or semantic uncertainty needing separate annotation.
