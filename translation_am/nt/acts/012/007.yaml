source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἄγγελος κυρίου ἐπέστη, καὶ φῶς ἔλαμψεν ἐν τῷ οἰκήματι· πατάξας δὲ τὴν πλευρὰν τοῦ Πέτρου ἤγειρεν αὐτὸν λέγων· Ἀνάστα ἐν τάχει· καὶ ἐξέπεσαν αὐτοῦ αἱ ἁλύσεις ἐκ τῶν χειρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/007.yaml
  text: And behold[a], an angel of the Lord stood near, and a light shone in the cell. Striking Peter on the side, he woke him, saying[b], “Get up quickly.” And his chains fell off from his hands.
translation:
  language: am
  text: እነሆም፣ የጌታ መልአክ በአጠገቡ ቆመ[a]፤ በእስር ክፍሉም[b] ውስጥ ብርሃን አበራ። መልአኩም የጴጥሮስን ጎን መትቶ ቀሰቀሰውና፣ “ፈጥነህ ተነሥ!” አለው። ሰንሰለቶቹም ከእጆቹ ላይ ወደቁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በአጠገቡ ተገኘ” ወይም “ድንገት ተገለጠ።” የግሪኩ ግስ በአጠገብ መቆምንም ሆነ ድንገተኛ መገኘትን ሊያጎላ ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በክፍሉ” ወይም “በጓዳው።” የግሪኩ ቃል ይበልጥ አጠቃላይ ነው፤ “የእስር ክፍል” የሚለው ግን ከእስር ቤቱ ዐውድ ጋር ይስማማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: እነሆም
  rationale: የትረካውን ድንገተኛነትና ትኩረት የሚስብ ኃይል ይጠብቃል፤ በአማርኛም ክቡርና የሚገባ የትረካ አገላለጽ ነው።
- source_word: ἄγγελος κυρίου
  choice: የጌታ መልአክ
  rationale: የግሪኩን የባለቤትነት/የመላክ ግንኙነት በተለመደና ግልጽ የአማርኛ አገላለጽ ያስተላልፋል።
- source_word: ἐπέστη
  choice: በአጠገቡ ቆመ
  rationale: የአካላዊ ቅርበቱን ሐሳብ ያስተላልፋል፤ ግሱ ድንገተኛ መገኘትንም ሊያመለክት ስለሚችል አማራጩ በማስታወሻ ተጠብቋል።
- source_word: φῶς ἔλαμψεν
  choice: ብርሃን አበራ
  rationale: የስምና የግስ ጥምረቱን በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: ἐν τῷ οἰκήματι
  choice: በእስር ክፍሉ ውስጥ
  rationale: οἴκημα በአጠቃላይ ክፍልን ወይም መኖሪያን ሊያመለክት ቢችልም፣ የእስር ቤቱ ዐውደ ንባብ ይህን ምርጫ ይደግፋል።
- source_word: πατάξας τὴν πλευρὰν
  choice: የጴጥሮስን ጎን መትቶ
  rationale: የπατάσσωን ጠንካራ አካላዊ ንክኪ ሳያለዝብ ይጠብቃል፤ πλευράም በቀጥታ ‘ጎን’ ተብሏል።
- source_word: ἤγειρεν αὐτόν
  choice: ቀሰቀሰው
  rationale: በዚህ ዐውድ ጴጥሮስን ከእንቅልፍ ማንቃቱን በግልጽ ያሳያል።
- source_word: Ἀνάστα ἐν τάχει
  choice: ፈጥነህ ተነሥ
  rationale: የትእዛዙን አስቸኳይነት በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐξέπεσαν αὐτοῦ αἱ ἁλύσεις ἐκ τῶν χειρῶν
  choice: ሰንሰለቶቹም ከእጆቹ ላይ ወደቁ
  rationale: የሰንሰለቶቹን ድንገተኛ መውደቅ ይጠብቃል፤ χείρን ወደ ‘አንጓ’ ሳይተረጉም ‘እጆች’ ብሎ ያቀርባል።
theological_decisions:
- issue: ἄγγελος κυρίου በሚለው ሐረግ κύριοςን መተርጎም
  choice: ጌታ
  alternative: ባለቤት / አለቃ
  rationale: ‘ጌታ’ በአዲስ ኪዳን ዐውድ የተለመደውን የκύριος ትርጉም ይጠብቃል፤ ተጨማሪ የእምነት ትርጓሜም አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር የአማርኛ የትረካ ዘይቤ ተጠቅሟል። “እነሆም” የሉቃስን ትኩረት ሰጪ ዘይቤ ለመጠበቅ ተመርጧል፤ የማስታወሻ ምልክቶቹ ከሚመለከታቸው ቃላት ጋር በትክክል ተያይዘዋል።
