  text: οἱ δὲ πρὸς αὐτὴν εἶπαν· Μαίνῃ. ἡ δὲ διϊσχυρίζετο οὕτως ἔχειν. οἱ δὲ ἔλεγον· Ὁ ἄγγελός ⸂ἐστιν αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/015.yaml
  text: But they said to her[a], “You are out of your mind.” But she kept insisting that it was so. And they kept saying, “It is his angel.”
translation:
  language: am
  text: እነርሱ ግን እሷን፣ “አብደሻል” አሏት። እሷ ግን እንዲሁ መሆኑን አጥብቃ ታረጋግጥ ነበር። እነርሱም፣ “የእርሱ መልአክ ነው”[a] ይሉ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም ምናልባት፣ “ጠባቂ መልአኩ፣” “ወኪል መልአኩ፣” ወይም አንዳንድ ተርጓሚዎች እንደሚሉት “መንፈሱ ወይም መናፍስቱ።” የግሪኩ ጽሑፍ በቀላሉ “የእርሱ መልአክ” ይላል።
    reason: alternative_reading
lexical_decisions:
- source_word: Μαίνῃ
  choice: አብደሻል
  rationale: የግሪኩን ቀጥተኛና ብርቱ የእብደት ክስ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል፤ ከሕክምናዊ ምርመራ ይልቅ በንግግር የተነገረ ውድቅ ማድረግ ነው።
- source_word: διϊσχυρίζετο
  choice: አጥብቃ ትናገር ነበር
  rationale: የኢምፐርፌክት ጊዜውን ቀጣይነትና የግሱን አጽንዖት ይጠብቃል።
- source_word: οὕτως ἔχειν
  choice: ነገሩ እንደዚያ እንደሆነ
  rationale: ‘ሁኔታው እንዲህ ነው’ የሚለውን ፈሊጣዊ ትርጉም በግልጽ አማርኛ ያስተላልፋል።
- source_word: ἔλεγον
  choice: ይሉ ነበር
  rationale: ተደጋጋሚውን ወይም ቀጣዩን ንግግር የኢምፐርፌክት ቅርጽ ያንጸባርቃል።
- source_word: ἄγγελός
  choice: መልአክ
  rationale: በዚህ አውድ ቃሉ ከጴጥሮስ ጋር የተያያዘ ሰማያዊ ፍጡርን ሊያመለክት ስለሚችል የተለመደውን የመጽሐፍ ቅዱስ ቃል ይጠቀማል።
- source_word: αὐτοῦ
  choice: የእርሱ
  rationale: የግሪኩን የባለቤትነት ግንኙነት በግልጽ ይጠብቃል።
theological_decisions:
- issue: “የእርሱ መልአክ” የሚለው ሐረግ ትርጉም
  choice: በዋናው ጽሑፍ “የእርሱ መልአክ” ተብሎ ቀጥታ ተተርጉሟል።
  alternative: “ጠባቂ መልአኩ፣” “ወኪል መልአኩ፣” ወይም በአንዳንድ ተርጓሚዎች አስተያየት “መንፈሱ/ጥላው።”
  rationale: ግሪኩ በቀላሉ ‘የእርሱ መልአክ’ ይላል እንጂ የተናጋሪዎቹን እምነት አያብራራም። ስለዚህ ልዩ የነገረ መለኮት አቋም ሳይጨመር ያለው ግራ አጋቢነት ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። “አብደሻል” የንግግሩን ቀጥተኛ ኃይል ይጠብቃል፤ “ትናገር ነበር” እና “ይሉ ነበር” ደግሞ የግሪኩን ቀጣይ ድርጊት ያሳያሉ።
