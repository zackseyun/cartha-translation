  text: καὶ ἐπιγνοῦσα τὴν φωνὴν τοῦ Πέτρου ἀπὸ τῆς χαρᾶς οὐκ ἤνοιξεν τὸν πυλῶνα, εἰσδραμοῦσα δὲ ἀπήγγειλεν ἑστάναι τὸν Πέτρον πρὸ τοῦ πυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/014.yaml
  text: And when she recognized Peter’s voice[a], because of her joy she did not open the gate[b], but ran in and reported that Peter was standing at the gate.
translation:
  language: am
  text: የጴጥሮስን ድምፅ ለይታ ባወቀች ጊዜ፣ ከደስታዋ የተነሣ በሩን[a] ሳትከፍት ወደ ውስጥ ሮጣ፤ ጴጥሮስ በበሩ ፊት ቆሞ እንዳለ አስታወቀች[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “የግቢው መግቢያ” ወይም “የውጭው በር።” የግሪኩ ቃል πυλών ከመንገድ ወደ ግቢው የሚያስገባውን መግቢያ ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “ጴጥሮስ በበሩ ፊት ቆሞ መሆኑን አስታወቀች።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνοῦσα
  choice: ባወቀች ጊዜ
  rationale: የአኦሪስት አሳታፊው ድምፁን ሰምታ ወዲያው ማወቋን ያመለክታል፤ ይህ አገላለጽ በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: φωνὴν
  choice: ድምፅ
  rationale: በዐውዱ ሮዳ ከውጭ የሚናገረውን ጴጥሮስን በድምፁ ለይታ አውቃለች።
- source_word: ἀπὸ τῆς χαρᾶς
  choice: ከደስታዋ የተነሣ
  rationale: ἀπό እዚህ የምክንያት ግንኙነትን ይገልጣል፤ ሐረጉም ለተግባሯ ምክንያቱ ደስታዋ መሆኑን በግልጽ ያሳያል።
- source_word: οὐκ ἤνοιξεν
  choice: ሳትከፍት
  rationale: ግሱ መክፈትን ብቻ ይገልጣል፤ ‘ቁልፉን ሳትከፍት’ የሚል ያልተጠቀሰ ዝርዝር አልተጨመረም።
- source_word: πυλῶνα / πυλῶνος
  choice: በር
  rationale: πυλών ከመንገድ ወደ ቤቱ ግቢ የሚያስገባውን ውጫዊ በር ወይም መግቢያ ሊያመለክት ይችላል፤ ‘በር’ በዐውዱ አጭርና ተፈጥሯዊ ነው።
- source_word: εἰσδραμοῦσα
  choice: ወደ ውስጥ ሮጣ
  rationale: ወደ ውስጥ የተደረገውን ፈጣን እንቅስቃሴ ጠብቆ የታሪኩን ፍጥነት ያስተላልፋል።
- source_word: ἀπήγγειλεν
  choice: አስታወቀች
  rationale: ἀπαγγέλλω ዜናን ወይም መረጃን ማሳወቅን ይገልጣል፤ የተመረጠው ቃል ለትረካው ተስማሚ ነው።
- source_word: ἑστάναι
  choice: ቆሞ እንዳለ
  rationale: የፍጹም ጊዜ የግስ ስም ጴጥሮስ በዚያ ቆሞ የመቆየቱን ሁኔታ ያሳያል።
- source_word: πρὸ τοῦ πυλῶνος
  choice: ከበሩ ፊት
  rationale: πρό ከባለቤት አገባብ ጋር ‘በፊት/ከፊት’ የሚል የቦታ ትርጉም አለው፤ ይህ ምንጩን በግልጽ ይጠብቃል።
