base_translation:
  language: en
  yaml_path: translation/nt/acts/012/020.yaml
  text: He was very angry with the Tyrians and Sidonians[a]. But they came to him with one accord, and after persuading Blastus, the king’s chamberlain, they were asking for peace[d][c][b], because their country was fed from the king’s domain.
translation:
  language: am
  text: እርሱም በጢሮስና በሲዶና ሰዎች ላይ እጅግ ተቆጥቶ ነበር[a]። እነርሱ ግን በአንድ ሐሳብ ወደ እርሱ መጡ፤ የንጉሡን መኝታ ቤት ኃላፊ የነበረውን ብላስጦስን[b] ካሳመኑ በኋላ፣ አገራቸው ምግብ የምትገኘው ከንጉሡ ግዛት ስለነበር[c] ሰላምን ይለምኑ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለጢሮስና ለሲዶና ሰዎች ጠላት ሆኖባቸው ነበር።” የግሪኩ ቃል ኃይለኛ ቁጣን ወይም ጠላትነትን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “በንጉሡ መኝታ ቤት ላይ የተሾመው።” ይህ ምናልባት ወደ ንጉሡ የግል ክፍሎች መግባት የሚችል የቤተ መንግሥት ባለሥልጣን ነበር።
    reason: cultural_note
  - marker: c
    text: ወይም፣ “ክልላቸው የምግብ አቅርቦቱን ከንጉሡ ግዛት ያገኝ ስለነበር።”
    reason: lexical_alternative
