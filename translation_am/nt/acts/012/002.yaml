lexical_decisions:
- source_word: ἀνεῖλεν
  choice: ገደለው
  rationale: ግሱ በዚህ አውድ ያዕቆብን እንዲሞት ማድረጉን ያመለክታል። «ገደለው» ይህን በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል፤ በጥቅሱ ያልተገለጸውን የፍርድ ሂደት አይጨምርም።
- source_word: δὲ
  choice: -ም
  rationale: ከቀደመው ትረካ ጋር የሚያገናኝና ታሪኩን ወደፊት የሚያራምድ ቀላል አያያዥ ሆኖ «እርሱም» ውስጥ ተወክሏል።
- source_word: Ἰάκωβον
  choice: ያዕቆብን
  rationale: በአማርኛ የመጽሐፍ ቅዱስ ስም አጠራር የተለመደውን ቅርጽ ይጠቀማል።
- source_word: τὸν ἀδελφὸν Ἰωάννου
  choice: የዮሐንስን ወንድም
  rationale: የትኛው ያዕቆብ እንደሆነ የሚለየውን ገላጭ ሐረግ በተፈጥሯዊ የአማርኛ ቅደም ተከተል ያቀርባል።
- source_word: μαχαίρῃ
  choice: በሰይፍ
  rationale: የመሣሪያ ዳቲቭን በአማርኛው «በ-» በመግለጽ የግድያውን መሣሪያ በቀጥታ ያሳያል።
theological_decisions:
- issue: የሄሮድ ድርጊት ባሕርይ
  choice: በዋናው ጽሑፍ «ገደለው» ተብሎ የሞት ማድረሱ ብቻ ተገልጿል።
  alternative: «አስገደለው» ወይም «በሞት ቀጣው» ብሎ መተርጎም።
  rationale: የግሪኩ ἀνεῖλεν ያዕቆብ እንደተገደለ ይገልጣል፤ ሰፊው አውድ ይፋዊ ቅጣትን ሊጠቁም ቢችልም፣ ጥቅሱ ራሱ የሕግ ሂደትን በግልጽ አይጠቅስም። ስለዚህ ይህ አተረጓጎም ያልተገለጸ የሕግ ፍቺ አይጨምርም።
