  text: እርሱም የዮሐንስን ወንድም ያዕቆብን በሰይፍ ገደለው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «አስገደለው» ወይም «በሞት ቀጣው»። የግሪኩ ቃል ያዕቆብን እንዲሞት ማድረጉን ብቻ ይገልጣል፤ ሰፊው አውድ ይፋዊ የሞት ቅጣት እንደነበረ ሊጠቁም ይችላል።
