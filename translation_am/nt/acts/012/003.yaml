  verdict: revise
  source_fidelity: The draft correctly conveys Herod's perception, the Jews as those pleased, Peter as an additional target, and the parenthetical temporal note. However, «ቀጠለ» normally means continued an already ongoing action and does not adequately express προσέθετο with the infinitive as taking the further step of arresting Peter. «የቂጣ በዓል» also fails to state the defining ‘unleavened’ element of τῶν ἀζύμων.
  naturalness: The revised wording is modern, clear Amharic. «ተጨማሪ እርምጃ ወሰደ» naturally expresses the additive/sequential force without implying that Peter's arrest was already underway.
  terminology: «አይሁድ» appropriately preserves the source's unqualified term. «የእርሾ አልባ ቂጣ በዓል» accurately names the Festival of Unleavened Bread and avoids conflating it with Passover.
  issues:
  - severity: medium
    issue: «ጴጥሮስንም ለመያዝ ቀጠለ»
    rationale: «ቀጠለ» suggests that the arrest of Peter had already begun and was being continued. προσέθετο συλλαβεῖν instead adds Peter as a further object/action after the preceding event.
  - severity: medium
    issue: «የቂጣ በዓል»
    rationale: This generic phrase omits the explicit σημασία of ἄζυμα, ‘unleavened.’ The main text should retain that distinction rather than leaving it only to the note.
