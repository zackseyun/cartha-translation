  rationale: θύρα «በር» ሲሆን πυλών የውጭ መግቢያን ወይም የበር መግቢያ ክፍልን ያመለክታል። «የመግቢያውን በር» ሁለቱንም ሐሳቦች በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: προσῆλθε
  choice: መጣች
  rationale: προσέρχομαι ወደ አንድ ሰው ወይም ስፍራ መቅረብን ወይም መምጣትን ያመለክታል፤ በዚህ የቤት ውስጥ ትረካ «መጣች» ተፈጥሯዊ ነው።
- source_word: παιδίσκη
  choice: አገልጋይ ልጃገረድ
  rationale: ቃሉ ወጣት ሴት አገልጋይን ወይም ባሪያን ሊያመለክት ይችላል። «አገልጋይ ልጃገረድ» ዕድሜዋንና በቤቱ ያላትን ተግባር ያሳያል፤ የባርነት ሕጋዊ ሁኔታ የሚቻል ትርጉም መሆኑ በማስታወሻ ተጠብቋል።
- source_word: ὑπακοῦσαι
  choice: ልትመልስ
  rationale: ὑπακούω በመሠረቱ መስማት ወይም መታዘዝ ሊሆን ቢችልም፣ በር ሲንኳኳ በሚኖረው አውድ ጥሪውን መመለስ ማለት ነው።
- source_word: ὀνόματι Ῥόδη
  choice: ሮዴ የተባለች
