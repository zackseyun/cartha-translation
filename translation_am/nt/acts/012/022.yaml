base_translation:
  language: en
  yaml_path: translation/nt/acts/012/022.yaml
  text: And the crowd kept shouting[a], “The voice of a god, and not of a man!”
translation:
  language: am
  text: ሕዝቡም፣ “ይህ የአምላክ ድምፅ ነው እንጂ የሰው አይደለም!” እያሉ ይጮኹ ነበር።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ይህ የእግዚአብሔር ድምፅ ነው እንጂ የሰው አይደለም!” የግሪኩ ጽሑፍ በዚህ መንገድም ሊነበብ ይችላል፤ ነገር ግን ከአውዱ አንጻር ሕዝቡ ሄሮድን በአረማዊ መንገድ ስለሚያሞግስ፣ “የአምላክ” የሚለው ትርጉም ይበልጥ የተገባ ይመስላል።
    reason: alternative_reading
lexical_decisions:
- source_word: δῆμος
  choice: ሕዝቡ
  rationale: እዚህ ቃሉ በስፍራው የተሰበሰበውን ሕዝብ ያመለክታል፤ «ሕዝቡ» ተፈጥሯዊና ክብር ያለው የአማርኛ አገላለጽ ነው።
- source_word: ἐπεφώνει
  choice: እያሉ መጮኻቸውን ቀጠሉ
  rationale: ያልተጠናቀቀው የግስ አቀራረብ ጩኸቱ ቀጣይ ወይም ተደጋጋሚ እንደነበር ያሳያል፤ ይህ አገላለጽ ያንን ገጽታ በግልጽ ያስተላልፋል።
- source_word: Θεοῦ
  choice: የአምላክ
  rationale: ጽሑፉ የአምላክን ድምፅ ከሰው ድምፅ የሚያነጻጽር ሲሆን፣ «አምላክ» በዚህ አረማዊ የውዳሴ አውድ አንድን መለኮታዊ ፍጡር ሊያመለክት ይችላል፤ ከ«እግዚአብሔር» ይልቅ የግሪኩን አሻሚነት ይጠብቃል።
- source_word: φωνὴ
  choice: ድምፅ
  rationale: ቀጥተኛና ተፈጥሯዊ ትርጉም ሲሆን በአጭር የውዳሴ ንግግር ውስጥ ያለውን የስም አገላለጽ ይጠብቃል።
- source_word: ἀνθρώπου
  choice: የሰው
  rationale: ከ«የአምላክ» ጋር ያለውን ቀጥተኛ ንጽጽር በተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: Θεοῦ እንደ «የአምላክ» ወይም «የእግዚአብሔር» መተርጎም
  choice: የአምላክ
  alternative: የእግዚአብሔር
  rationale: አውዱ ሄሮድን በመለኮታዊ ክብር የሚያሞግስ አረማዊ ሕዝብ ነው፤ የግሪኩ ስምም ያለ የተወሰነ መስተዋድድ ቀርቧል። «የአምላክ» ይህን አውድ ይጠብቃል፤ «የእግዚአብሔር» ግን ሕዝቡ የእስራኤልን አምላክ በተለይ እንዳመለከተ ሊያስመስል ይችላል። ቢሆንም የግሪኩ አገላለጽ ሌላውን ንባብ ስለሚፈቅድ በማስታወሻ ተጠቅሷል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። «መጮኻቸውን ቀጠሉ» የግሪኩን ቀጣይ/ተደጋጋሚ ገጽታ ያሳያል፤ «የአምላክ» ደግሞ በአማርኛ የቁጥር መድብ አለመኖሩ ምክንያት የግሪኩን አሻሚነት በከፊል እየጠበቀ ከአረማዊው አውድ ጋር ይስማማል።
