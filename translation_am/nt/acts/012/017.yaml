  text: κατασείσας δὲ αὐτοῖς τῇ χειρὶ σιγᾶν διηγήσατο αὐτοῖς πῶς ὁ κύριος αὐτὸν ἐξήγαγεν ἐκ τῆς φυλακῆς, εἶπέν ⸀τε· Ἀπαγγείλατε Ἰακώβῳ καὶ τοῖς ἀδελφοῖς ταῦτα. καὶ ἐξελθὼν ἐπορεύθη εἰς ἕτερον τόπον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/017.yaml
  text: But motioning to them with his hand to be silent[a], he explained to them how the Lord had brought him out of the prison. And he said, “Report these things to James and to the brothers.” Then he departed and went to another place.
translation:
  language: am
  text: እርሱ ግን ዝም እንዲሉ በእጁ ምልክት ሰጥቶ፣ ጌታ እንዴት ከእስር ቤት እንዳወጣው በዝርዝር ነገራቸው። ከዚያም፣ “እነዚህን ነገሮች ለያዕቆብና ለወንድሞች[a] ንገሩ” አለ። ከዚያ ወጥቶ ወደ ሌላ ስፍራ ሄደ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለወንድሞችና ለእህቶች።” የግሪኩ ጽሑፍ “ለወንድሞች” ይላል፤ እንደ አውዱ ግን ሰፊውን የአማኞች ማኅበር ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: κατασείσας … τῇ χειρὶ σιγᾶν
  choice: ዝም እንዲሉ በእጁ ምልክት አድርጎላቸው
  rationale: የእጅ እንቅስቃሴው ዓላማ ሰዎቹን ጸጥ ማሰኘት መሆኑን በተፈጥሯዊ አማርኛ ይገልጣል፤ የምልክቱን ትክክለኛ ቅርጽ ግን አይጨምርም።
- source_word: διηγήσατο
  choice: በዝርዝር ነገራቸው
  rationale: ግሱ የተፈጸመውን ነገር በቅደም ተከተል መተረክን ወይም በሚገባ ማብራራትን ያመለክታል።
- source_word: πῶς
  choice: እንዴት
  rationale: ጴጥሮስ የጌታን የማዳን ተግባር እንዴት እንደተፈጸመ መናገሩን ያሳያል።
- source_word: ὁ κύριος
  choice: ጌታ
  rationale: የግሪኩን መለኮታዊ ማዕረግ ይጠብቃል፤ በዚህ ስፍራ ማዕረጉ በተለይ ኢየሱስን ወይም እግዚአብሔርን እንደሚያመለክት ትርጉሙ አይወስንም።
- source_word: ἐξήγαγεν ἐκ τῆς φυλακῆς
  choice: ከእስር ቤት እንዳወጣው
  rationale: ከታሰረበት ስፍራ ወደ ውጭ የመምራትንና የማውጣትን ሐሳብ በግልጽ ያስተላልፋል።
- source_word: Ἀπαγγείλατε
  choice: ንገሩ
  rationale: አስፈላጊውን ዜና ለሌሎች እንዲያስተላልፉ የተሰጠውን ትእዛዝ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: Ἰακώβῳ
  choice: ለያዕቆብ
  rationale: የግሪኩ ስም በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን ቅርጽ ይከተላል።
- source_word: τοῖς ἀδελφοῖς
  choice: ለወንድሞች
  rationale: በግሪኩ ያለውን ተባዕታይ ብዙ ቁጥር በቀጥታ ይጠብቃል፤ በአውዱ ሰፊውን የአማኞች ማኅበር ሊያካትት እንደሚችል በማስታወሻ ተገልጧል።
- source_word: ἐξελθὼν ἐπορεύθη εἰς ἕτερον τόπον
  choice: ወጥቶ ወደ ሌላ ስፍራ ሄደ
  rationale: ከነበረበት ቦታ መውጣቱንና ያልተጠቀሰ ሌላ ቦታ መሄዱን የሁለቱንም ግሶች ሐሳብ በማቆየት ይገልጣል።
theological_decisions:
- issue: የκύριος አመልካች ማንነት
  choice: “ጌታ” ተብሎ ተተርጉሟል፤ ጴጥሮስን ከእስር ያወጣው መለኮታዊ አድራጊ ነው።
  alternative: በተለይ “ጌታ ኢየሱስ” ወይም “እግዚአብሔር” ብሎ መግለጽ።
  rationale: ጽሑፉ κύριος ብቻ ይላል። በሐዋርያት ሥራ ይህ ማዕረግ ብዙ ጊዜ የተነሣውን ኢየሱስ ሊያመለክት ቢችልም፣ የመለኮታዊ ተግባር አገላለጹ እግዚአብሔርንም ሊያመለክት ይችላል። ትርጉሙ ይህን አሻሚነት አይፈታም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “በዝርዝር ነገራቸው” የትረካውን ሙሉነት ሲጠብቅ፣ “ወጥቶ … ሄደ” ደግሞ የግሪኩን ሁለት ተከታታይ ድርጊቶች ተፈጥሯዊ በሆነ አገላለጽ ያቀርባል።
