base_translation:
  language: en
  yaml_path: translation/nt/acts/012/023.yaml
  text: Immediately an angel of the Lord struck him[a], because he did not give the glory to God, and becoming worm-eaten[c][b], he died.
translation:
  language: am
  text: ወዲያውም የጌታ መልአክ መታው፤ ምክንያቱም ክብርን ለእግዚአብሔር አልሰጠም። በትሎች ተበልቶ[a] ሞተ[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ትሎች በልተውት»።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «ነፍሱ ወጣች»።
    reason: lexical_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: ወዲያውም
  rationale: ድርጊቱ ሳይዘገይ መፈጸሙን በተፈጥሯዊና በዘመናዊ አማርኛ ያሳያል።
- source_word: ἐπάταξεν
  choice: መታው
  rationale: ግሱ መምታትን ያመለክታል፤ ሞቱ በኋላ ተለይቶ ስለሚገለጥ፣ «ገደለው» ወይም «ጥሎት ገደለው» ብሎ ውጤቱን አስቀድሞ አይወስንም።
- source_word: ἄγγελος κυρίου
  choice: የጌታ መልአክ
  rationale: በግሪክ መልአክ ያለ መለያ አንቀጽ ቢሆንም፣ አማርኛ ቁጥርን በግድ እንዲገልጽ አይጠይቅም፤ ይህም «አንድ»ን ሳያስገባ አንድ መልአክ መሆኑን በተፈጥሯዊ አገላለጽ ያቀርባል።
- source_word: ἀνθ’ ὧν
  choice: ምክንያቱም
  rationale: የፍርዱን ምክንያት በግልጽና ተፈጥሯዊ አማርኛ ያስተዋውቃል።
- source_word: οὐκ ἔδωκεν τὴν δόξαν τῷ θεῷ
  choice: ለእግዚአብሔር ክብሩን አልሰጠም
  rationale: የግሪኩን የተወሰነ ክብር ጥቅስ በ«ክብሩን» ይጠብቃል፤ ለእግዚአብሔር የሚገባውን ክብር አለመመለሱን ያሳያል።
- source_word: γενόμενος σκωληκόβρωτος
  choice: በትል ተበልቶ
  rationale: የትል መብላትን ግልጽና ሕያው በሆነ ዘመናዊ አማርኛ ያስተላልፋል፤ የአሳታፊውን ከሞቱ ጋር ያለ ቅደም ተከተል ይጠብቃል።
- source_word: ἐξέψυξεν
  choice: ሞተ
  rationale: ግሱ ሕይወቱ ማለፉን ያመለክታል፤ «ሞተ» ቀጥተኛ፣ ግልጽና ተፈጥሯዊ የአማርኛ አቻ ነው።
theological_decisions:
- issue: የተገለጠው ፍርድ ባሕርይና የድርጊቶቹ ጊዜ ግንኙነት
  choice: ሞቱ በጌታ መልአክ አማካይነት የመጣ መለኮታዊ ፍርድ መሆኑን እና ምክንያቱ ለእግዚአብሔር ክብሩን አለመስጠቱ መሆኑን ጽሑፉ እንደሚያቀርበው መተርጎም፤ ነገር ግን የሕክምና ሂደቱን ወይም ትክክለኛውን የጊዜ ርዝመት አለመጨመር።
  alternative: እንደ ተፈጥሯዊ ሞት ብቻ መውሰድ፣ ወይም መልአኩ በመታው ቅጽበት እንደሞተ በግልጽ መወሰን።
  rationale: ጽሑፉ መልአኩንና የፍርዱን ምክንያት በግልጽ ይጠቅሳል፤ በትል መበላቱን ከሞቱ በፊት በአሳታፊ አወቃቀር ያቀርባል፣ ግን ከዚያ በላይ ዝርዝር የጊዜ ወይም የሕክምና ማብራሪያ አይሰጥም።
