  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። አጭር ዓረፍተ ነገሮቹ የፍርዱን ድንገተኛነትና ክብደት ይጠብቃሉ።
