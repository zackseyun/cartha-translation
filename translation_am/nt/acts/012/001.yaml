lexical_decisions:
- source_word: Κατ’ ἐκεῖνον δὲ τὸν καιρόν
  choice: በዚያ ጊዜ አካባቢ
  rationale: κατά ከጊዜ አመልካች ተሳቢ ጋር ‘በዚያ ጊዜ አካባቢ’ የሚል ግምታዊ ጊዜ ያመለክታል፤ δέ ያለው ቀላል የትረካ ሽግግር በአማርኛው ዐውድና ሥርዓተ ነጥብ እንዲታይ ተደርጓል።
- source_word: ἐπέβαλεν ... τὰς χεῖρας
  choice: እጁን ዘረጋባቸው
  rationale: የግሪኩን ምሳሌያዊ አገላለጽና ጠላትነት ያዘለውን ድርጊት ይጠብቃል፤ ‘አሰራቸው’ ማለት ትርጉሙን በእስር ብቻ ይገድበዋል።
- source_word: Ἡρῴδης ὁ βασιλεύς
  choice: ንጉሥ ሄሮድ
  rationale: በዘመናዊ አማርኛ የማዕረግና የስም ተፈጥሯዊ ቅደም ተከተል ነው።
- source_word: κακῶσαί
  choice: ለማንገላታት
  rationale: ቃሉ ጉዳትንና ክፉ አያያዝን ያመለክታል፤ ‘ለማሳደድ’ ከሚለው ይልቅ የሃይማኖታዊ ስደትን ቴክኒካዊ ሐሳብ አያስገባም።
- source_word: τινας τῶν ἀπὸ τῆς ἐκκλησίας
  choice: ከቤተ ክርስቲያን ወገን የሆኑትን አንዳንዶች
  rationale: ከክርስቲያኑ ማኅበረሰብ ጋር የሚቆጠሩ የተወሰኑ ሰዎችን በግልጽና ተፈጥሯዊ አማርኛ ያመለክታል።
theological_decisions:
- issue: ἐκκλησία አተረጓጎም
  choice: ቤተ ክርስቲያን
