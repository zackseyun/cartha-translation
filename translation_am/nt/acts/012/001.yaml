    text: ቃል በቃል፣ “እጆቹን ጣለ።” አገላለጹ በቤተ ክርስቲያን ወገን ባሉ አንዳንድ ሰዎች ላይ የተወሰደ የጠላትነት ድርጊትን ያመለክታል።
