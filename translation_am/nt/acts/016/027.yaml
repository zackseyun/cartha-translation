    text: ወይም ይበልጥ ቃል በቃል፣ “የእስር ቤቱ ደጆች ተከፍተው እንደነበር አየ።” የግሪኩ ፍጹም ተሳቢ ቅጽ ደጆቹ ተከፍተው በነበሩበት ሁኔታ ላይ ያተኩራል።
    reason: lexical_alternative
  - marker: b
    text: μάχαιρα ሰይፍን ወይም እንደ ጩቤ ያለ አጭር ስለታማ መሣሪያን ሊያመለክት ይችላል፤ “ሰይፍ” በዚህ አውድ የተለመደው ትርጉም ስለሆነ ተጠብቋል።
    reason: lexical_alternative
