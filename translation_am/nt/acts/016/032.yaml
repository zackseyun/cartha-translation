base_translation:
  language: en
  yaml_path: translation/nt/acts/016/032.yaml
  text: And they spoke the word of the Lord to him[c][b][a], together with all who were in his house.
translation:
  language: am
  text: እነርሱም የጌታን ቃል[a] ለእርሱና በቤቱ ውስጥ ለነበሩት ሁሉ[c] ተናገሩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ስለ ጌታ የሆነውን መልእክት።” “የጌታ ቃል” የሚለው የግሪክኛ ሐረግ የጌታ የሆነውን፣ ከጌታ የመጣውን፣ ወይም ስለ ጌታ የሚናገረውን መልእክት ሊያመለክት ይችላል።
    reason: alternative_reading
  - marker: c
    text: በቃል ቃል፣ “ለእርሱ፣ ከቤቱ ውስጥ ከነበሩት ሁሉ ጋር።”
    reason: previous_rendering
lexical_decisions:
- source_word: ἐλάλησαν
  choice: ተናገሩ
  rationale: The aorist of λαλέω denotes speaking the gospel message. ተናገሩ is natural and dignified without adding the more public nuance of ‘proclaimed.’
- source_word: αὐτῷ
  choice: ለእርሱ
  rationale: The dative pronoun identifies the jailer as the person addressed; the Amharic benefactive/directional form naturally expresses ‘to him.’
- source_word: τὸν λόγον
  choice: ቃል
  rationale: ቃል preserves the established New Testament idiom while contextually denoting a spoken message.
- source_word: τοῦ κυρίου
  choice: የጌታን
  rationale: The genitive is retained in a form that does not decide whether the message belongs to, comes from, or concerns the Lord.
- source_word: σὺν πᾶσι τοῖς ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: ከቤቱ ውስጥ ከነበሩት ሁሉ ጋር
  rationale: This directly reflects σύν, ‘with/together with,’ and includes all those present in his house without silently changing the phrase into a second indirect object.
- source_word: οἰκίᾳ
  choice: ቤቱ
  rationale: ቤት retains the concrete sense ‘house’; the contextual alternative ‘household/family’ is supplied in a footnote.
theological_decisions:
- issue: Nuance of ‘the word of the Lord’
  choice: የጌታን ቃል
  alternative: ከጌታ የመጣውን መልእክት / ስለ ጌታ የሆነውን መልእክት
  rationale: The Greek genitive can indicate a message belonging to or coming from the Lord, or a message concerning the Lord. The main text preserves this ambiguity.
- issue: Recipients included by σύν
  choice: ለእርሱ፣ ከቤቱ ውስጥ ከነበሩት ሁሉ ጋር
  alternative: ለእርሱና በቤቱ ውስጥ ለነበሩት ሁሉ
  rationale: The chosen wording preserves the explicit ‘with’ construction while the alternative makes the household members explicit as parallel addressees.
translation_notes:
  register: Modern standard Amharic in Geʽez script. The wording is dignified but ordinary, retains the familiar biblical term ቃል, and uses contemporary punctuation to clarify the σύν phrase without resolving its syntactic nuance.
