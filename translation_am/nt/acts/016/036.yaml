  text: ἀπήγγειλεν δὲ ὁ δεσμοφύλαξ τοὺς λόγους ⸀τούτους πρὸς τὸν Παῦλον, ὅτι Ἀπέσταλκαν οἱ στρατηγοὶ ἵνα ἀπολυθῆτε· νῦν οὖν ἐξελθόντες πορεύεσθε ἐν εἰρήνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/036.yaml
  text: 'And the jailer reported these words to Paul: “The magistrates have sent word that you may be released[a]. So now[b], come out and go in peace.”'
translation:
  language: am
  text: የእስር ቤቱም ጠባቂ ይህን መልእክት ለጳውሎስ ነገረው፦ “ባለሥልጣናቱ[a] ከእስር እንድትለቀቁ መልእክት ልከዋል። ስለዚህ አሁን ወጥታችሁ በሰላም ሂዱ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ባለሥልጣናቱ” የሚለው στρατηγοί የተባሉትን የፊልጵስዩስ ከተማ የሲቪል ባለሥልጣናት ያመለክታል፤ በቴክኒካዊ አጠራር “ፕራይተሮች” ሊባሉ ይችላሉ።
    reason: cultural_note
lexical_decisions:
- source_word: ἀπήγγειλεν
  choice: ነገረው
  rationale: መረጃን ወይም የተላለፈን ቃል ማድረስን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል።
- source_word: ὁ δεσμοφύλαξ
  choice: የእስር ቤቱ ጠባቂ
  rationale: በዚህ አውድ እስረኞችንና እስር ቤቱን የሚጠብቀውን ባለሥልጣን በግልጽ ይጠቁማል።
- source_word: τοὺς λόγους τούτους
  choice: ይህን መልእክት
  rationale: ቃል በቃል ‘እነዚህን ቃላት’ ሊባል ቢችልም፣ እዚህ የተላለፈ ይዘት ስለሆነ ‘መልእክት’ ተፈጥሯዊና ግልጽ ነው።
- source_word: Ἀπέσταλκαν
  choice: መልእክት ልከዋል
  rationale: የግሪኩ ግስ የተላከውን ነገር በግልጽ አይጠቅስም፤ አውዱ ግን ትእዛዝ ወይም መልእክት መላኩን ያሳያል። ፍጹም ጊዜውም የተፈጸመው ተግባር አሁን ያለውን ውጤት ያሳያል።
- source_word: οἱ στρατηγοὶ
  choice: የከተማው መሳፍንት
  rationale: በፊልጵስዩስ የሮማ ቅኝ ግዛት አውድ στρατηγοί የከተማውን ዋና የሲቪል ባለሥልጣናት ያመለክታል፤ ‘መሳፍንት’ የመጽሐፍ ቅዱስ አንባቢዎች የሚያውቁት ክቡር ቃል ሲሆን ማብራሪያው በግርጌ ማስታወሻ ተሰጥቷል።
- source_word: ἵνα ἀπολυθῆτε
  choice: እንድትፈቱ
  rationale: ከእስር እንዲለቀቁ የተሰጠውን ትእዛዝ ወይም ፈቃድ በተፈጥሯዊ ተገብሮ አገላለጽ ያስተላልፋል።
- source_word: νῦν οὖν
  choice: ስለዚህ አሁን
  rationale: οὖν ያለውን የውሳኔ ወይም የውጤት ኃይልና νῦν ያለውን የጊዜ ምልክት ይጠብቃል።
- source_word: ἐξελθόντες πορεύεσθε
  choice: ወጥታችሁ … ሂዱ
  rationale: የአኦሪስት አንቀጽንና የትእዛዝ ግስን ተከታታይ ድርጊት በሚያሳይ ተፈጥሯዊ የአማርኛ አወቃቀር ያቀርባል።
- source_word: ἐν εἰρήνῃ
  choice: በሰላም
  rationale: ያለ ጉዳትና ግጭት መሄድን የሚያመለክት የተለመደና ክቡር የአማርኛ አገላለጽ ነው።
