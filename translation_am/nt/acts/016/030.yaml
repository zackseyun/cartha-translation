  yaml_path: translation/nt/acts/016/030.yaml
  text: And after bringing them outside[a], he said, “Sirs[b], what must I do so that I may be saved?”
translation:
  language: am
  text: ከዚያም ወደ ውጭ አውጥቶአቸው፣ “ጌቶች ሆይ፣[a] እድን ዘንድ ምን ማድረግ ይገባኛል?”[b] አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ጌቶች ሆይ” የሚለው በዚህ ስፍራ ግሪክኛውን κύριοι እንደ አክብሮት መጠሪያ ይተረጉማል፤ መለኮታዊውን “ጌታ” ማዕረግ አያመለክትም።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ለመዳን ምን ማድረግ አለብኝ?”
    reason: lexical_alternative
lexical_decisions:
- source_word: προαγαγὼν αὐτοὺς ἔξω
  choice: ወደ ውጭ አውጥቶአቸው
  rationale: የግሪኩ የአኦሪስት አጋዥ ግስ ከዋናው የንግግር ግስ በፊት የተፈጸመውን ተግባር ያሳያል፤ ይህ አተረጓጎም ቅደም ተከተሉንና ወደ ውጭ የሚደረገውን እንቅስቃሴ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἔφη
  choice: አለ
  rationale: በትረካ ውስጥ የንግግር መግቢያ ሆኖ የሚሠራውን ግስ በቀላልና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: Κύριοι
  choice: ጌቶች ሆይ
  rationale: የብዙ ቁጥር መጠሪያው ጳውሎስንና ሲላስን በአክብሮት የሚጠራ ማኅበራዊ አገላለጽ ነው፤ እዚህ መለኮታዊውን ‘ጌታ’ ማዕረግ አያመለክትም።
- source_word: τί με δεῖ ποιεῖν
  choice: ምን ማድረግ ይገባኛል
  rationale: δεῖ የግዴታን ወይም የአስፈላጊነትን ኃይል ይገልጣል፤ ይህ ምርጫ በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: ἵνα σωθῶ
  choice: እድን ዘንድ
  rationale: የዓላማውን አንቀጽና የግሪኩን ተደራጊ ቅርጽ በአማርኛ የተለመደ አገላለጽ ይጠብቃል።
theological_decisions:
- issue: በወህኒ ጠባቂው ጥያቄ ውስጥ σωθῶ ያለው ትርጉም
  choice: እድን
  alternative: ከአደጋ እድን / ነፃ ልውጣ
  rationale: σῴζω ከአደጋ መታደግንም ሆነ ሰፊውን መንፈሳዊ ድነት ሊያመለክት ይችላል። ቁጥር 31 በቅርብ ዐውድ ስለሚከተል፣ ‘እድን’ የድነትን አቅጣጫ በተገቢ ሁኔታ ያስተላልፋል፤ ቃሉን ግን ወደ አንድ ጠባብ የአስተምህሮ ሥርዓት አይወስነውም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የንግግሩ አክብሮታዊ አድራሻና የጥያቄው አስቸኳይነት ተጠብቀዋል።
