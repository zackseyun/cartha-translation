    text: ወይም፣ «በክርስቲያናዊው እምነት።» የግሪኩ ሐረግ አብያተ ክርስቲያናቱ በጋራ በያዙት የክርስቲያን እምነትና ኑሮ እየተጠነከሩ መሆናቸውን፣ ወይም በአጠቃላይ በእምነት እየተጠነከሩ መሆናቸውን ሊያመለክት ይችላል።
