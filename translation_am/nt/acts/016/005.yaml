lexical_decisions:
- source_word: αἱ μὲν οὖν
  choice: ስለዚህ
  rationale: የቀደመውን ትረካ የሚያጠቃልልና ውጤቱን የሚያሳይ የንግግር ሽግግር ነው፤ «ስለዚህ» ይህን ግንኙነት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐκκλησίαι
  choice: ማኅበራቱ
  rationale: በዚህ ዐውድ ቃሉ በየስፍራው ያሉትን የክርስቲያኖች ማኅበረሰቦች ያመለክታል፤ «ማኅበራቱ» ብዙ ቁጥሩንና አካባቢያዊ ማኅበራዊ ትርጉሙን በግልጽ ይይዛል።
- source_word: ἐστερεοῦντο
  choice: እየጸኑ
  rationale: የግሪኩ ያልተጠናቀቀ ጊዜና ተገብሮአዊ ቅርጽ በቀጣይነት ይጸኑ እንደነበር ያሳያል፤ አማርኛው በዐውዱ የሚታወቀውን ተገብሮአዊ ኃይል ሳያስወግድ ቀጣይነቱን ያሳያል።
- source_word: τῇ πίστει
  choice: በእምነቱ
  rationale: መስተዋድዱ ያለበት ቅርጽ በዐውዱ ማኅበራቱ የተቀበሉትን የጋራ ክርስቲያናዊ እምነት ሊያመለክት ይችላል፤ «በእምነቱ» ይህን ዋና ንባብ ይይዛል፣ ሰፊው የ«በእምነት» ንባብም በማስታወሻ ተጠብቋል።
- source_word: ἐπερίσσευον
  choice: እየጨመሩ ሄዱ
  rationale: ግሱ በቀጣይነት መብዛትን ያሳያል፤ «እየጨመሩ ሄዱ» የግሪኩን ያልተጠናቀቀ ገጽታ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: τῷ ἀριθμῷ
  choice: በቍጥር
  rationale: ይህ የተጨመሩበትን ረገድ ያመለክታል፤ «በቍጥር» እድገቱ የአባላት ቁጥር መጨመር መሆኑን በአጭሩ ይገልጻል።
- source_word: καθ’ ἡμέραν
  choice: ዕለት ዕለት
  rationale: ሐረጉ በየቀኑ ተደጋጋሚ የሆነ እድገትን ያሳያል፤ «ዕለት ዕለት» ይህን ስርጭታዊ ስሜት ይጠብቃል።
theological_decisions:
- issue: የτῇ πίστει ትርጉም
  choice: «በእምነቱ»—ማኅበራቱ የያዙት የጋራ ክርስቲያናዊ እምነት
  alternative: «በእምነት»—በአጠቃላይ በማመን ወይም በመታመን
  rationale: መስተዋድዱና የማኅበራት ዐውዱ የጋራውን እምነት የሚያመለክተውን ንባብ ያጠናክራሉ፤ ሆኖም ግሪኩ የግል እምነትን ሙሉ በሙሉ ስለማያስቀር አማራጩ በግርጌ ማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ማኅበራቱ» የአካባቢያዊ ክርስቲያን ማኅበረሰቦችን ያመለክታል፤ ተደራራቢዎቹ «እየጸኑ» እና «እየጨመሩ ሄዱ» የሁለቱን የግሪክ ያልተጠናቀቁ ግሶች ቀጣይነት ያንጸባርቃሉ።
