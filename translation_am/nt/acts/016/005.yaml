  text: So the churches were being strengthened in the faith and were increasing in number day by day[a].
translation:
  language: am
  text: ስለዚህ አብያተ ክርስቲያናቱ በእምነት[a] እየተጠነከሩ፣ በቁጥርም ዕለት ዕለት እየበዙ ነበሩ።
  philosophy: optimal-equivalence
  footnotes:
