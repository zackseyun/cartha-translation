  text: τοῦτον ἠθέλησεν ὁ Παῦλος σὺν αὐτῷ ἐξελθεῖν, καὶ λαβὼν περιέτεμεν αὐτὸν διὰ τοὺς Ἰουδαίους τοὺς ὄντας ἐν τοῖς τόποις ἐκείνοις, ᾔδεισαν γὰρ ἅπαντες ⸂ὅτι Ἕλλην ὁ πατὴρ αὐτοῦ⸃ ὑπῆρχεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/003.yaml
  text: Paul wanted him to go out with him[a], and after taking him, he circumcised him because of the Jews who were in those places[c][b], for they all knew that his father was a Greek.
translation:
  language: am
  text: ጳውሎስ ጢሞቴዎስ ከእርሱ ጋር እንዲጓዝ[a] ፈለገ፤ ወስዶም በእነዚያ ስፍራዎች ባሉት አይሁድ ምክንያት[b] ገረዘው፤ ምክንያቱም አባቱ ግሪካዊ[c] እንደነበር ሁሉም ያውቁ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “ከእርሱ ጋር ሊወጣ።” ይህ አገላለጽ ለጉዞ መነሳትን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ስለ አይሁድ” ወይም “ለአይሁድ ሲል።”
    reason: lexical_alternative
  - marker: c
    text: ግሪክኛው “ግሪካዊ” ይላል፤ በዚህ አውድ ይህ የጢሞቴዎስ አባት አይሁዳዊ እንዳልነበር የሚያመለክት ይመስላል።
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτον
  choice: ጢሞቴዎስን
  rationale: አመልካች ተውላጠ ስሙ በቀደመው አውድ የተጠቀሰውን ጢሞቴዎስን ያመለክታል፤ ስሙን መጥቀስ በአማርኛ የዓረፍተ ነገሩን መጀመሪያ ግልጽ ያደርጋል።
- source_word: ἠθέλησεν
  choice: ፈለገ
  rationale: የጳውሎስን ፍላጎትና ዓላማ በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: σὺν αὐτῷ ἐξελθεῖν
  choice: ከእርሱ ጋር ይዞት ለመጓዝ
  rationale: ἐξελθεῖν ቃል በቃል ‘መውጣት’ ቢሆንም በዚህ አውድ ለጉዞ መነሳትን ያመለክታል፤ ‘ይዞት’ የጢሞቴዎስን አብሮነት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: λαβὼν
  choice: ወስዶ
  rationale: ከዋናው ግስ በፊት የተፈጸመውን ተግባር በአጭርና ተፈጥሯዊ የአማርኛ አገባብ ያሳያል።
- source_word: περιέτεμεν
  choice: ገረዘው
  rationale: የግሪክ ግሱን ቀጥተኛና መደበኛ ትርጉም ያቀርባል።
- source_word: διὰ τοὺς Ἰουδαίους
  choice: በአይሁድ ምክንያት
  rationale: διά ከወደቃዊ ቅጽ ጋር የምክንያት ወይም የአነሳሽነት ግንኙነትን ያሳያል፤ ትርጉሙ ድርጊቱን ከአይሁድ ጋር ያያይዛል እንጂ ዓላማውን ከልክ በላይ አይተረጉምም።
- source_word: τοὺς ὄντας ἐν τοῖς τόποις ἐκείνοις
  choice: በእነዚያ ስፍራዎች ባሉት
  rationale: የአካባቢውን አይሁድ በቅርብ መዋቅርና በተፈጥሯዊ አማርኛ ይለያል።
- source_word: ᾔδεισαν γὰρ ἅπαντες
  choice: ምክንያቱም ... ሁሉም ያውቁ ነበር
  rationale: γάρ የሚሰጠውን ማብራሪያዊ ምክንያትና ἅπαντες የሚያጠናክረውን ሁሉን አቀፍ እውቀት ይጠብቃል።
- source_word: Ἕλλην
  choice: ግሪካዊ
  rationale: ቀጥተኛውን የዘር/ባህል መለያ ይጠብቃል፤ ‘አሕዛብ’ ብሎ በመተርጎም ሊጨመር የሚችለውን ትርጓሜ አያስገባም።
- source_word: ὁ πατὴρ αὐτοῦ ὑπῆρχεν
  choice: አባቱ ... እንደነበር
  rationale: ὑπάρχωን ያለ አላስፈላጊ አጽንዖት በቀላልና ተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: የጢሞቴዎስ መገረዝ ከአካባቢው አይሁድ ጋር ያለው ግንኙነት
  choice: ቁጥሩ በግልጽ የሚሰጠውን ምክንያት—የአካባቢው አይሁድ የጢሞቴዎስን የአባት ወገን ያውቁ እንደነበር—ብቻ ማቅረብ
  alternative: ድርጊቱን ለድነት አስፈላጊ እንደሆነ የሚያስተምር ወይም የሚስዮን ስልት ብቻ እንደሆነ በግልጽ መወሰን
  rationale: የግሪክ ጽሑፉ ድርጊቱን ከአይሁድ እውቀት ጋር ያያይዛል፤ ነገር ግን ስለ ድነት፣ ስለ ኪዳን አባልነት ወይም ስለ ጳውሎስ ሙሉ ዓላማ ተጨማሪ ዶግማዊ ድምዳሜ አይሰጥም።
