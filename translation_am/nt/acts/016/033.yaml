  terminology: “ተጠመቁ” is the standard neutral rendering of ἐβαπτίσθη. “የቤቱ ሰዎች ሁሉ” suitably renders the broad household expression οἱ αὐτοῦ πάντες and does not narrow it to a nuclear family.
