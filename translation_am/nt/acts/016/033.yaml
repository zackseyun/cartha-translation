  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ጥቅም ላይ ውሏል። የግሪኩ የድርጊት ቅደም ተከተልና የፍጥነት አጽንዖት ተጠብቋል፤ የጥምቀት አፈጻጸምን ወይም የቤቱ ሰዎችን ዕድሜ የሚወስን የእምነት ቡድን ትርጓሜ አልገባም።
