theological_decisions:
- issue: οἱ αὐτοῦ πάντες በጥምቀቱ ውስጥ የሚያካትታቸው ሰዎች
  choice: ‘የቤቱ ሰዎች ሁሉ’ ተብሎ ተተርጉሟል፤ ዕድሜያቸው፣ የእያንዳንዳቸው የእምነት ኑዛዜ ወይም የጥምቀቱ አፈጻጸም አልተገለጸም።
  alternative: ‘ቤተሰቡ ሁሉ’ ወይም ‘የእሱ ወገኖች ሁሉ’
  rationale: ጥቅሱ እሱና የቤቱ ሰዎች ሁሉ መጠመቃቸውን ይናገራል፤ ነገር ግን ስለሕፃናት ጥምቀት፣ ስለግል እምነት ኑዛዜ ወይም ስለጥምቀት አፈጻጸም የኋላ ዘመን ክርክሮችን በራሱ አይፈታም።
