    issue: በማግሥቱም is narrower than the Greek temporal expression.
    rationale: τῇ ἐπιούσῃ means “on the following day,” not necessarily “the next morning.”
  - severity: low
    issue: ደረስን adds an explicit arrival assertion in the second travel clause.
    rationale: The Greek has εἰς Νέαν Πόλιν with the travel verb understood from the preceding clause; retaining “traveled” better preserves the itinerary wording without adding emphasis on arrival.
