lexical_decisions:
- source_word: Ἀναχθέντες
  choice: በመርከብ ተነሥተን
  rationale: ἀνάγω በባሕር ጉዞ አውድ ‘መርከብ አስነሥቶ መጓዝ/በመርከብ መነሣት’ ማለት ነው። ይህ አተረጓጎም የባሕር ጉዞውን ግልጽ አድርጎ የግሪኩን የቅደም ተከተል አገባብ ይጠብቃል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ቃሉ ከቀደመው ትረካ የሚነሣ የውጤት ወይም የትረካ ቀጣይነት ግንኙነትን ያመለክታል፤ ‘ስለዚህ’ ሁለቱንም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀπὸ Τρῳάδος
  choice: ከጢሮአዳ
  rationale: ἀπό የመነሻ ስፍራን ያመለክታል፤ ጢሮአዳ የቦታውን ስም በአማርኛ የተለመደ አጻጻፍ ያቀርባል።
- source_word: εὐθυδρομήσαμεν
  choice: በቀጥታ … ተጓዝን
  rationale: ግሱ ቀጥተኛ የባሕር መስመር ይዞ መጓዝን ያመለክታል። ‘በቀጥታ ተጓዝን’ ይህን ኃይል በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል፤ የመርከብ አውዱም በቀደመው ሐረግ ግልጽ ሆኗል።
- source_word: εἰς Σαμοθρᾴκην
  choice: ወደ ሳሞትራቄ
  rationale: εἰς መድረሻን ያመለክታል፤ ሳሞትራቄ የቦታው ስም በድምፅ ተቀራራቢ ሁኔታ የተጻፈ ነው።
- source_word: τῇ δὲ ἐπιούσῃ
  choice: በማግሥቱም
  rationale: ይህ የጊዜ ሐረግ ‘በሚቀጥለው ቀን’ ማለት ነው። ‘በማግሥቱም’ አጭር፣ ተፈጥሯዊና δέ የሚሰጠውን ቀጣይነት ያካተተ ነው።
- source_word: εἰς Νέαν Πόλιν
  choice: ወደ ኔያጳሊስ ደረስን
  rationale: Νέα Πόλις እዚህ የቦታ ስም ስለሆነ ከመተርጎም ይልቅ ‘ኔያጳሊስ’ ተብሎ ተጽፏል። በግሪኩ ሁለተኛው የመድረሻ ሐረግ ግሱን ከቀደመው ይወስዳል፤ ‘ደረስን’ በአማርኛ ይህን ስውር ግስ በተፈጥሯዊ ሁኔታ ያሟላል።
