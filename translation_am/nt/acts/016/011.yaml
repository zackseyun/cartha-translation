  naturalness: The prose is generally clear and modern. Repeating ተጓዝን for the second leg makes the temporal sequence explicit and is more natural than supplying “arrived” in this concise itinerary.
  terminology: The established Amharic forms ጢሮአዳ, ሳሞትራቄ, and ኔያጳሊስ are retained. No theological terminology is involved.
