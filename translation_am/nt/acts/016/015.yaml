  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ቤተሰቧ’ እና ‘ቤቴ’ የሚሉት ተመሳሳይ የግሪክ ቃል በየአውዳቸው ያላቸውን ማኅበራዊና ቦታዊ ፍቺ ይለያሉ።
