  text: ὡς δὲ ἐβαπτίσθη καὶ ὁ οἶκος αὐτῆς, παρεκάλεσεν λέγουσα· Εἰ κεκρίκατέ με πιστὴν τῷ κυρίῳ εἶναι, εἰσελθόντες εἰς τὸν οἶκόν μου ⸀μένετε· καὶ παρεβιάσατο ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/015.yaml
  text: And when she and her household were baptized[a], she urged us, saying, “If you have judged me to be faithful to the Lord, come into my house and stay.” And she prevailed upon us.
translation:
  language: am
  text: እርሷና ቤተሰቧ በተጠመቁ ጊዜ፣ “ለጌታ ታማኝ[a] እንደሆንሁ ከፈረዳችሁ፣ ወደ ቤቴ ገብታችሁ ቆዩ” ብላ ለመነችን። በጽኑም አሳመነችን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በጌታ የምታምን እንደሆንሁ።” የግሪኩ ቅጽል ቃል “ታማኝ፣” “የምትታመን፣” ወይም “አማኝ” የሚል ፍቺ ሊኖረው ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: ከ… በኋላ
  rationale: የድርጊቶቹን ጊዜያዊ ቅደም ተከተል በተፈጥሯዊ አማርኛ ያሳያል፤ δέን ከልክ በላይ አያጎላም።
- source_word: ἐβαπτίσθη καὶ ὁ οἶκος αὐτῆς
  choice: እርሷና ቤተሰቧ ከተጠመቁ
  rationale: ግሱ በግሪክ ነጠላ ቢሆንም ሊድያንና ቤተሰቧን በአንድነት ያካትታል፤ ብዙ ቁጥር በአማርኛ ተፈጥሯዊ ነው።
- source_word: ὁ οἶκος αὐτῆς
  choice: ቤተሰቧ
  rationale: እዚህ οἶκος ሕንፃውን ሳይሆን የቤቱን ሰዎች ያመለክታል።
- source_word: παρεκάλεσεν
  choice: ለመነችን
  rationale: በአውዱ የእንግድነት ጥሪን የያዘ አጥብቆ መጠየቅን ያመለክታል፤ የተናጋሪዋን ጽናት የመጨረሻው ሐረግ ይጨምርለታል።
- source_word: Εἰ κεκρίκατέ με πιστὴν τῷ κυρίῳ εἶναι
  choice: ለጌታ ታማኝ እንደሆንሁ ከቆጠራችሁኝ
  rationale: κεκρίκατέ የደረሱበትን የተረጋጋ ግምገማ ያሳያል፤ ታማኝ ደግሞ የπιστήን የእምነት፣ የታማኝነትና የታመነነት ስፋት ሙሉ በሙሉ ሳያጠብ ይጠብቃል።
- source_word: εἰσελθόντες εἰς τὸν οἶκόν μου μένετε
  choice: ወደ ቤቴ ገብታችሁ ቆዩ
  rationale: ተሳቢውን ድርጊትና ዋናውን ትእዛዝ በግልጽና ተፈጥሯዊ አማርኛ ያቀርባል፤ እዚህ οἶκος የሚያመለክተው መኖሪያ ቤቱን ነው።
- source_word: παρεβιάσατο ἡμᾶς
  choice: አጥብቃም ግድ አለችን
  rationale: የግሪኩን ጠንካራ ልመናና ጽኑ አሳሳብ ያስተላልፋል፤ ያለበትን ኃይል ጠብቆ የግዳጅ ወይም የኃይል ትርጉም አያስገባም።
theological_decisions:
- issue: የሊድያ ቤተሰብ ጥምቀት ሊያስነሳ የሚችለው የእምነት ክርክር
  choice: ታሪካዊ መግለጫውን ‘እርሷና ቤተሰቧ ከተጠመቁ’ ብሎ በቀጥታ ማቅረብ
  alternative: የቤተሰቡን አባላት ዕድሜ ወይም የግል እምነት ሁኔታ በትርጉሙ መወሰን
  rationale: ጥቅሱ የቤተሰቡን አባላት ዕድሜና የእያንዳንዳቸውን የእምነት ሁኔታ አይገልጽም፤ ስለዚህ በኋላ የተነሱ የጥምቀት አቋሞችን አያስገባም።
- issue: πιστὴν በሊድያ ራስን መግለጫ ያለው ትርጉም
  choice: ለጌታ ታማኝ
  alternative: በጌታ የምታምን፤ በጌታ ፊት የታመንሁ
  rationale: ይህ አገላለጽ ቃሉ ሊይዘው የሚችለውን እምነት፣ ታማኝነትና ታመነነት በአንድ ትርጉም ሳይገድብ ይጠብቃል።
