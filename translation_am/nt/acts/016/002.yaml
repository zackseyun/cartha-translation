    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: እርሱም
  rationale: አንጻራዊው ተውላጠ ስም በቁጥር 1 የተጠቀሰውን ጢሞቴዎስን ያመለክታል፤ በአማርኛ ከቀደመው ንግግር ጋር በተፈጥሮ ለማያያዝ “እርሱም” ተመርጧል።
- source_word: ἐμαρτυρεῖτο
  choice: መልካም ምስክርነት የተሰጠው ነበር
  rationale: የμαρτυρέω ያልተፈጸመ ጊዜ ተገብሮ ቅርጽ ነው፤ እዚህ ሌሎች ስለ ጢሞቴዎስ መልካም ምስክርነት እንደሰጡ ወይም መልካም ስም እንደነበረው ያሳያል። ይህ አገላለጽ ተገብሮነቱንና አዎንታዊ ትርጉሙን ይጠብቃል።
- source_word: ὑπὸ
  choice: በ…ወንድሞች
  rationale: ከተገብሮ ግስ ጋር ድርጊቱን የፈጸሙትን ሰዎች ያመለክታል፤ የአማርኛው “በ” ይህን በተፈጥሮ ያስተላልፋል።
- source_word: τῶν ἐν Λύστροις καὶ Ἰκονίῳ
  choice: በልስጥራና በኢቆንዮን ባሉ
  rationale: ቅድመ አቀማመጡ ወንድሞቹ በሁለቱ ከተሞች የሚገኙ መሆናቸውን ይገልጣል፤ “ባሉ” ይህን ገላጭ ግንኙነት በግልጽ ያሳያል።
- source_word: ἀδελφῶν
  choice: ወንድሞች
  rationale: የግሪኩ ቃል በሰዋስው ወንድ ብዙ ቁጥር ነው። ዋናው ጽሑፍ ይህን ቅርጽ ይጠብቃል፤ በቀደምት ክርስቲያናዊ አጠቃቀም ግን ሴቶችንም ጨምሮ የእምነት ባልንጀሮችን ሊያመለክት እንደሚችል የግርጌ ማስታወሻው ያብራራል።
theological_decisions:
- issue: ለክርስቲያን ማኅበረሰቡ የተጠቀሰውን ἀδελφῶν በጾታ የተለየ ቃል መተርጎም
