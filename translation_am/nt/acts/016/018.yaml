  text: And she kept doing this for many days[a]. But Paul, becoming greatly troubled, turned to the spirit and said[b], “I command you in the name of Jesus the Messiah to come out of her.” And it came out that very hour.
translation:
  language: am
  text: ይህንም ለብዙ ቀናት እያደረገች ቀጠለች። ጳውሎስ ግን እጅግ ተረብሾ ወደ መንፈሱ[b] ዞሮ፣ “በኢየሱስ፣ በመሲሑ[a] ስም ከእርሷ እንድትወጣ አዝዝሃለሁ” አለው። መንፈሱም በዚያው ቅጽበት ወጣ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በኢየሱስ ክርስቶስ ስም።” የግሪኩ Χριστός እዚህ እንደ ማዕረግ ያለውን ትርጉም ለመጠበቅ “መሲሑ” ተብሎ ተተርጉሟል።
    reason: alternative_reading
  - marker: b
    text: ግሪኩ በቀጥታ “ለመንፈሱ” ብቻ ይላል፤ አውዱ ይህ ባሪያይቱን የያዘው መንፈስ መሆኑን ያሳያል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίει ἐπὶ πολλὰς ἡμέρας
  choice: ለብዙ ቀናት እያደረገች ቀጠለች
  rationale: ያለፈ ጊዜን የሚያመለክተው ያልተጠናቀቀ ግስ ተደጋጋሚና ቀጣይ ድርጊትን ስለሚገልጥ፣ ይህ አተረጓጎም ኃይሉን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: διαπονηθεὶς
  choice: እጅግ ተረብሾ
  rationale: ቃሉ ቀላል መበሳጨትን ብቻ ሳይሆን በጥልቅ መረበሽንና መጨነቅን ይገልጣል፤ ይህ ምርጫ ቁጣን ሳይጨምር ክብደቱን ይጠብቃል።
- source_word: ἐπιστρέψας
  choice: ዞሮ
  rationale: ጳውሎስ ከመናገሩ በፊት አቅጣጫውን መቀየሩን በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τῷ πνεύματι
  choice: ወደ መንፈሱ
  rationale: ግሪኩ ያለ ተጨማሪ ገላጭ ቃል ‘ለመንፈሱ’ ይላል፤ ስለዚህ ‘ክፉ’ ወይም ‘ጋኔን’ የሚል ትርጓሜ አልተጨመረም።
- source_word: Παραγγέλλω σοι
  choice: አዝዝሃለሁ
  rationale: ለመንፈሱ የተሰጠውን ባለሥልጣን ትእዛዝ በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐν ὀνόματι Ἰησοῦ Χριστοῦ
  choice: በኢየሱስ መሲሑ ስም
  rationale: Χριστός እዚህ የቅብዓትና የመሲሓዊ ማንነት ማዕረግ ስለሆነ፣ ‘መሲሑ’ የሚለው ትርጉሙንና የተወሰነነቱን ይጠብቃል።
- source_word: ἐξελθεῖν ἀπ’ αὐτῆς
  choice: ከእርሷ እንድትወጣ
  rationale: መንፈሱን በቀጥታ በማነጋገር ከሴቲቱ እንዲወጣ የተሰጠውን ትእዛዝ ይጠብቃል።
- source_word: ἐξῆλθεν αὐτῇ τῇ ὥρᾳ
  choice: መንፈሱም በዚያው ሰዓት ወጣ
  rationale: ‘በዚያው ሰዓት’ ፈጣን ፍጻሜውን ሲጠብቅ፣ በአማርኛ ግልጽነት ሲባል ከአውዱ የሚታወቀው ርዕሰ ጉዳይ ‘መንፈሱ’ ተደግሟል።
theological_decisions:
- issue: በἐν ὀνόματι Ἰησοῦ Χριστοῦ ውስጥ Χριστοῦን እንዴት መተርጎም እንደሚገባ
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: በዚህ አገባብ Χριστός እንደ ቋሚ ስም ብቻ ሳይሆን የኢየሱስን መሲሓዊ ማንነት የሚገልጥ ማዕረግ ነው፤ ‘መሲሑ’ ይህን ትርጉም ግልጽ ያደርጋል።
- issue: መንፈሱን በዋናው ጽሑፍ ‘ክፉ መንፈስ’ ወይም ‘ጋኔን’ ብሎ መግለጽ ወይስ አለመግለጽ
  choice: መንፈሱ
  alternative: ክፉው መንፈስ / ጋኔኑ
  rationale: ጥቅሱ πνεῦμα ብቻ ይላል። የቀደመው አውድ የመንፈሱን ባሕርይ ቢያሳይም፣ ዋናው ጽሑፍ ምንጩ ያልጨመረውን ገላጭ ቃል አይጨምርም።
