  text: ⸀Διῆλθον δὲ τὴν Φρυγίαν ⸀καὶ Γαλατικὴν χώραν, κωλυθέντες ὑπὸ τοῦ ἁγίου πνεύματος λαλῆσαι τὸν λόγον ἐν τῇ Ἀσίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/006.yaml
  text: And they passed through the region of Phrygia and Galatia[b][a], having been forbidden by the Holy Spirit to speak the word in Asia.
translation:
  language: am
  text: እነርሱም የፍርግያና የገላትያ ክልልን አለፉ፤ ቃሉን በእስያ[a] እንዳይናገሩ በመንፈስ ቅዱስ ተከልክለው ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይህ በትንሿ እስያ ምዕራባዊ ክፍል የነበረውን የሮም የእስያ አውራጃ ያመለክታል፤ የዛሬዋን የእስያ አህጉር አይደለም።
    reason: cultural_note
lexical_decisions:
- source_word: Διῆλθον
  choice: አለፉ
  rationale: የግሱን በአንድ ክልል ውስጥ አቋርጦ የመጓዝ ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δὲ
  choice: እነርሱም
  rationale: δὲ ታሪኩን የሚያስቀጥል ቀላል አያያዥ ስለሆነ፣ -ም የሚለው ቅጥያ በአማርኛ ይህን ተግባር በተፈጥሯዊ ሁኔታ ያከናውናል።
- source_word: τὴν Φρυγίαν καὶ Γαλατικὴν χώραν
  choice: በፍርግያና በገላትያ አውራጃ
  rationale: χώρα የሚለውን ‘ክልል/አገር’ ሐሳብ ‘አውራጃ’ በሚል ያስተላልፋል፤ የግሪኩ አገባብ ሁለት አካባቢዎችን ወይም አንድ የተዋሐደ ክልላዊ መጠሪያን ሊያመለክት የሚችለው ግልጽነት በማስታወሻ ተጠብቋል።
- source_word: κωλυθέντες
  choice: ተከልክለው ነበር
  rationale: የአኦሪስት ተገብሮ አካፋይ ቅርጹንና መናገራቸው በቀጥታ የተከለከለ መሆኑን ያሳያል።
- source_word: ὑπὸ τοῦ ἁγίου πνεύματος
  choice: በመንፈስ ቅዱስ
  rationale: በሉቃስና በሐዋርያት ሥራ የተለመደውን የመለኮታዊው መንፈስ መጠሪያና የድርጊቱን ወኪልነት ያስጠብቃል።
- source_word: λαλῆσαι
  choice: እንዳይናገሩ
  rationale: λαλέω የሚለውን ሰፊ ‘መናገር’ ትርጉም ይጠብቃል፤ ‘መስበክ’ የሚል የጠበበ ሐሳብ አያስገባም።
- source_word: τὸν λόγον
  choice: ቃሉን
  rationale: በሉቃስ–ሐዋርያት ሥራ የተለመደውን ‘ቃሉ’ የሚል አገላለጽ ይጠብቃል፤ ወደ ‘ወንጌል’ ወይም ‘መልእክት’ በመተርጎም አያጠበውም።
- source_word: ἐν τῇ Ἀσίᾳ
  choice: በእስያ
  rationale: ታሪካዊውን የቦታ ስም በዋናው ጽሑፍ ይጠብቃል፤ ዘመናዊቷን አህጉር እንደማያመለክት በማስታወሻ ተብራርቷል።
