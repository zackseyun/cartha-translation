  rationale: ጉዳዩ ትምህርተ እምነታዊ ሳይሆን ታሪካዊና ሰዋሰዋዊ አሻሚነት ያለው ነው። ‘ዋነኛ’ የከተማዋን ታዋቂነት ያሳያል፤ ግሪኩ የማያስገድደውን የአስተዳደር ዋና ከተማነት አያስገባም፣ ሌላውን ንባብም በማስታወሻ ያቆያል።
