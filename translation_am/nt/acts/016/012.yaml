  text: ⸀κἀκεῖθεν εἰς Φιλίππους, ἥτις ἐστὶν ⸂πρώτη τῆς μερίδος⸃ Μακεδονίας πόλις, κολωνία. ἦμεν δὲ ἐν ⸀ταύτῃ τῇ πόλει διατρίβοντες ἡμέρας τινάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/012.yaml
  text: and from there to Philippi[a], which is a leading city of the district of Macedonia, a Roman colony[b]. And we stayed in this city for some days.
translation:
  language: am
  text: ከዚያም ወደ ፊልጵስዩስ ሄድን። ይህችም የመቄዶንያ ክፍል ዋነኛ ከተማ[a]፣ የሮም ቅኝ ከተማም[b] ናት። በዚህች ከተማ ጥቂት ቀናት ቆየን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የመቄዶንያ ክፍል የመጀመሪያ ከተማ።” የግሪኩ ሐረግ ለመተርጎም አስቸጋሪ ነው፤ “የመጀመሪያ” የሚለው ደረጃን፣ ታዋቂነትን ወይም በጉዞ ቅደም ተከተል መቅደምን ሊያመለክት ይችላል።
    reason: alternative_reading
  - marker: b
    text: ይህም በሮም አገዛዝ ሥር ልዩ ሕጋዊ ደረጃ የተሰጣት የሮም ቅኝ ከተማ ማለት ነው።
    reason: cultural_note
lexical_decisions:
- source_word: κἀκεῖθεν εἰς Φιλίππους
  choice: ከዚያም ወደ ፊልጵስዩስ ሄድን
  rationale: κἀκεῖθεν የቀደመውን የጉዞ ቅደም ተከተል ያገናኛል። በግሪኩ ግስ በግልጽ ባይደገምም፣ በአማርኛ የተሟላና ተፈጥሯዊ ዓረፍተ ነገር እንዲሆን ‘ሄድን’ ከአውዱ ተሞልቷል።
- source_word: ἥτις ἐστὶν
  choice: ይህችም … የምትገኝ … ነበረች
  rationale: አብራሪውን አንጻራዊ ሐረግ በተፈጥሯዊ አማርኛ ይገልጣል፤ የከተማ ስምም በሴት ፆታ ተመልካች ተከትሏል።
- source_word: πρώτη τῆς μερίδος Μακεδονίας πόλις
  choice: በመቄዶንያ ክፍል የምትገኝ ዋነኛ ከተማ
  rationale: πρώτη ደረጃን፣ ታዋቂነትን ወይም ቅደም ተከተልን ሊያመለክት ስለሚችል ‘ዋነኛ’ የታሰበውን ታዋቂነት ያስተላልፋል፤ አሻሚነቱ በግርጌ ማስታወሻ ተጠብቋል። μερίς እዚህ የክልል ንዑስ ክፍልን ያመለክታል።
- source_word: κολωνία
  choice: የሮም ቅኝ ከተማ
  rationale: ቃሉ ፊልጵስዩስ በሮም አገዛዝ ሥር የነበራትን ልዩ ሕጋዊ የቅኝ ከተማነት ያመለክታል፤ ‘የሮም’ የሚለው ታሪካዊ ማጣቀሻውን ግልጽ ያደርጋል።
- source_word: ἦμεν … διατρίβοντες
  choice: ቆየን
  rationale: ይህ የተዋሃደ የግስ አገባብ በአንድ ስፍራ ለተወሰነ ጊዜ መቆየትን ያሳያል፤ ‘ቆየን’ በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: ἐν ταύτῃ τῇ πόλει
  choice: በዚህች ከተማ
  rationale: የግሪኩን አመልካች ቃልና ለከተማ የሚስማማውን ሴት ፆታ ቅርጽ ይጠብቃል።
- source_word: ἡμέρας τινάς
  choice: ጥቂት ቀናት
  rationale: ትክክለኛ ቁጥር ያልተወሰነ አጭር ጊዜን በተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: በፊልጵስዩስ መግለጫ ውስጥ πρώτη የሚለው ቃል ትርጉም
  choice: ‘ዋነኛ ከተማ’ ተብሎ ተተርጉሟል
