    issue: Awkward coordination in “አንተም ሆንክ ቤተሰብህ”
    rationale: This construction is unnatural and potentially obscures the simple coordination σὺ καὶ ὁ οἶκός σου (“you and your household”). Recasting it as “አንተና ቤተሰብህም” supplies normal Amharic coordination without adding an interpretation.
