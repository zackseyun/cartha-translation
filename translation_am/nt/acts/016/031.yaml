  text: οἱ δὲ εἶπαν· Πίστευσον ἐπὶ τὸν κύριον ⸀Ἰησοῦν, καὶ σωθήσῃ σὺ καὶ ὁ οἶκός σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/031.yaml
  text: And they said[a], “Believe in the Lord Jesus[b], and you will be saved—you and your household.”
translation:
  language: am
  text: እነርሱም፣ “በጌታ ኢየሱስ እመን፤ አንተና ቤተሰብህም ትድናላችሁ[a]” አሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ቤተሰብህ” የሚለው በቤቱ ውስጥ ያሉትን ሰዎች ያመለክታል እንጂ የቤቱን ሕንፃ አይደለም።
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: እነርሱም ... አሉት
  rationale: δέ በዚህ ቦታ ቀላል የትረካ አያያዥ ነው፤ “እነርሱም” የተቃርኖ ሐሳብ ሳይጨምር የአማርኛን ተፈጥሯዊ ፍሰት ይጠብቃል። ከአውዱ የተነሣ የንግግሩ ተቀባይ ነጠላ ቁጥር ስለሆነ “አሉት” ተመርጧል።
- source_word: Πίστευσον ἐπὶ τὸν
  choice: በ... እመን
  rationale: የአንድ ጊዜ ወሳኝ ምላሽ የሚጠይቀውን የትእዛዝ አኳኋን በቀጥታ ያስተላልፋል። ἐπί ከተሳቢ ጋር እምነት የሚያመራበትን አካል ያመለክታል፤ “በ... እመን” በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: κύριον Ἰησοῦν
  choice: ጌታ ኢየሱስ
  rationale: “ጌታ” የκύριοςን የክብርና የክርስቶሳዊ ክብደት ይጠብቃል፤ “ኢየሱስ” በአማርኛ የተለመደው የስሙ ቅርጽ ነው።
- source_word: σωθήσῃ
  choice: ትድናላችሁ
  rationale: የσῴζωን የወደፊት ጊዜ ተገብሮ ትርጉም በተፈጥሯዊ አማርኛ ያቀርባል። “መዳን” በዚህ የወንጌል አውድ መንፈሳዊውንና ሰፊውን የነፃ መውጣት ትርጉም ሳያጠብ ይጠብቃል።
- source_word: σὺ καὶ ὁ οἶκός σου
  choice: አንተም ሆንክ ቤተሰብህ
  rationale: οἶκος በዚህ አውድ ሕንፃን ሳይሆን በቤቱ ውስጥ ያሉትን ሰዎች ያመለክታል። “አንተም ሆንክ ቤተሰብህ” ሁለቱንም በተስፋው ውስጥ ያካትታል፤ ብዙ ተሳቢዎች ስላሉ ግሱ “ትድናላችሁ” ተብሎ በብዙ ቁጥር ቀርቧል።
theological_decisions:
- issue: “አንተና ቤተሰብህ” የሚለው የተስፋ ወሰን
  choice: ሐረጉ ቤተሰቡን በተስፋው ውስጥ እንደሚያካትት በቀጥታ ተተርጉሟል፤ የእስር ቤት ጠባቂው እምነት ብቻ ቤተሰቡን በራስ-ሰር ያድናል የሚል ሐሳብ አልተጨመረም።
  alternative: የቤቱ አለቃ እምነት ብቻ ለመላው ቤተሰብ ድነትን ያስገኛል ብሎ መተርጎም፣ ወይም የቤተሰቡን መካተት በማሳነስ ተስፋውን ለግለሰቡ ብቻ ማድረግ።
  rationale: የግሪኩ ሐረግ የእስር ቤት ጠባቂውንና ቤተሰቡን ይጠቅሳል፤ ነገር ግን ይህ ቁጥር ብቻውን የእያንዳንዱን ሰው እምነት አስፈላጊነት ወይም የቤተሰብ ድነትን ዘዴ አይወስንም። ትርጉሙ ያለውን የሥነ መለኮት ውጥረት ሳይፈታ ጠብቆታል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ትእዛዙ ነጠላ ቁጥር (“እመን”) ሆኖ ሲቀርብ፣ ተስፋው አንተንና ቤተሰብህን ስለሚያካትት “ትድናላችሁ” ተብሏል። በዋናው ጽሑፍ [a] ምልክት ተካትቷል።
