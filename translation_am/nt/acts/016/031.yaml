review_pass:
  verdict: revise
  source_fidelity: The imperative “በጌታ ኢየሱስ እመን” accurately renders Πίστευσον ἐπὶ τὸν κύριον Ἰησοῦν. The draft’s plural “ትድናላችሁ” communicates the inclusive force of “you and your household,” though Greek has a singular verb addressed initially to the jailer; plural agreement is the natural Amharic form once both he and his household are stated as the subject.
  naturalness: “አንተም ሆንክ ቤተሰብህ” is not natural in this context. “አንተና ቤተሰብህም” is clear, idiomatic modern standard Amharic, and preserves the coordinated scope of the promise.
  terminology: “ጌታ ኢየሱስ,” “እመን,” “ትድናላችሁ,” and “ቤተሰብህ” are suitable and theologically noninterpretive. The retained footnote appropriately clarifies that ቤተሰብ denotes people in the household rather than a building.
  issues:
