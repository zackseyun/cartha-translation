base_translation:
  language: en
  yaml_path: translation/nt/acts/016/017.yaml
  text: She kept following Paul and us and crying out[a], saying, “These men are servants of the Most High God, who are proclaiming to you the way of salvation.”
translation:
  language: am
  text: እርሷ ጳውሎስንና እኛን እየተከተለች፣ “እነዚህ ሰዎች የልዑል አምላክ ባሪያዎች ናቸው፤ ለእናንተ የመዳን መንገድን[a] ያውጃሉ” እያለች ትጮኽ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አንድ የመዳን መንገድን።” ግሪኩ ቃል በቃል “የመዳን መንገድን” ይላል፤ ከ«መንገድ» በፊት መወሰኛ አንቀጽ ስለሌለ፣ በእንግሊዝኛ “a way” ወይም “the way” ተብሎ ሊረዳ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: κατακολουθοῦσα
  choice: እየተከተለች
  rationale: የአሁን ጊዜ አጋዥ ግስ ከኢምፐርፌክት ዋና ግስ ጋር ተያይዞ ቀጣይ ወይም ተደጋጋሚ ተግባርን ያሳያል፤ ይህ አገላለጽ በአማርኛ ተፈጥሯዊ ነው።
- source_word: ἔκραζεν
  choice: ትጮኽ ነበር
  rationale: ኢምፐርፌክቱ የቀጠለ ወይም የተደጋገመ ከፍተኛ ድምፅ ያለውን ንግግር ያመለክታል፤ አገላለጹ ስሜታዊ ሁኔታዋን ከግሪኩ በላይ አይወስንም።
- source_word: δοῦλοι
  choice: ባሪያዎች
  rationale: ቃሉ የጌታ ንብረት የመሆንንና በእርሱ ሥልጣን ሥር መሆንን ያመለክታል፤ “አገልጋዮች” ይህን ጥንካሬ ሊያሳንስ ይችላል።
- source_word: τοῦ θεοῦ τοῦ ὑψίστου
  choice: የልዑል አምላክ
  rationale: የመለኮት ማዕረጉን በአማርኛ በተለመደና በተከበረ አገላለጽ ያቀርባል።
- source_word: καταγγέλλουσιν
  choice: ያውጃሉ
  rationale: ግሱ በይፋ ማስታወቅን ወይም ማወጅን ያመለክታል፤ የአሁን ጊዜውንም ገጽታ ይጠብቃል።
- source_word: ὑμῖν
  choice: ለእናንተም
  rationale: ዳቲቩ የአዋጁን ተቀባዮች ያመለክታል፤ “ለእናንተ” ይህን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὁδὸν σωτηρίας
  choice: የመዳን መንገድን
  rationale: ይህ ቀጥተኛና ተፈጥሯዊ የአማርኛ አገላለጽ ሲሆን፣ አማርኛው በራሱ አንድነትን ወይም ወሰንተኝነትን በግድ አይወስንም፤ የግሪኩ የአንቀጽ እጥረት በማስታወሻ ተገልጿል።
theological_decisions:
- issue: የὁδὸν σωτηρίας ወሰንተኝነት
  choice: የመዳን መንገድን
  alternative: አንድ የመዳን መንገድን / የመዳንን መንገዱን
  rationale: በግሪክ ὁδόν ያለ አንቀጽ ቀርቧል። ዋናው የአማርኛ ንባብ ይህን ልዩነት በግድ ሳይፈታ ተፈጥሯዊ ሆኖ ያቀርበዋል፤ ሁለቱም የትርጉም ዕድሎች በማስታወሻው ተጠብቀዋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። “ባሪያዎች” የሚለው ቃል የδοῦλοιን የባለቤትነትና የተገዥነት ኃይል ለመጠበቅ ተመርጧል፤ የመዳን መንገድ የሚለው ሐረግ ግን የምንጩን አሻሚነት አይፈታም።
