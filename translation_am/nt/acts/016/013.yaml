  text: τῇ τε ἡμέρᾳ τῶν σαββάτων ἐξήλθομεν ἔξω τῆς ⸀πύλης παρὰ ποταμὸν οὗ ⸂ἐνομίζομεν προσευχὴν⸃ εἶναι, καὶ καθίσαντες ἐλαλοῦμεν ταῖς συνελθούσαις γυναιξίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/013.yaml
  text: On the Sabbath day we went outside the gate beside the river[a], where we supposed there was a place of prayer, and after sitting down we were speaking to the women who had gathered there.
translation:
  language: am
  text: በሰንበት ቀንም ከበሩ ውጭ ወደ ወንዝ ዳር፣ የጸሎት ስፍራ እንዳለበት ወደ ገመትነው ሄድን፤ ተቀምጠንም በዚያ ለተሰበሰቡት ሴቶች እንናገር ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ τε ἡμέρᾳ τῶν σαββάτων
  choice: በሰንበት ቀንም
  rationale: የግሪኩን የተለመደ አገላለጽ ‘በሰንበት ቀን’ በሚል ተፈጥሯዊና ግልጽ አማርኛ ያቀርባል፤ τε የትረካ ትስስርም በ‘ም’ ተንጸባርቋል።
- source_word: ἐξήλθομεν ἔξω τῆς πύλης
  choice: ከበሩ ውጭ … ሄድን
  rationale: ወደ ውጭ የመውጣቱን አቅጣጫና ከበሩ ባሻገር መሄዳቸውን ያሳያል። ‘የከተማው’ የሚለው በግሪኩ በግልጽ ስለሌለ አልተጨመረም።
- source_word: παρὰ ποταμόν
  choice: ወደ ወንዝ ዳር
  rationale: παρά ከተሳቢ አገባብ ጋር ወደ ወንዙ አጠገብ የሚደረግን እንቅስቃሴ ያመለክታል፤ ‘ወደ ወንዝ ዳር’ ይህን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: οὗ ἐνομίζομεν προσευχὴν εἶναι
  choice: የጸሎት ስፍራ በዚያ ያለ መስሎን ነበር
  rationale: νομίζω የሚያመለክተውን ግምት ‘መስሎን ነበር’ ይጠብቃል። προσευχή ጸሎትን ወይም ለጸሎት የተለየን ስፍራ ሊያመለክት ይችላል፤ በዚህ አውድ ‘የጸሎት ስፍራ’ ይበልጥ ይስማማል።
- source_word: καὶ καθίσαντες
  choice: ተቀምጠንም
  rationale: የግሪኩ ቀዳሚ ድርጊት ከዋናው ግስ በፊት መከናወኑን በአጭርና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐλαλοῦμεν
  choice: እንናገር ነበር
  rationale: ያልተጠናቀቀውን ወይም ቀጣይ የነበረውን የግሪክ ኢምፐርፌክት ገጽታ ይጠብቃል።
- source_word: ταῖς συνελθούσαις γυναιξίν
  choice: በዚያ ለተሰበሰቡት ሴቶች
  rationale: ሴቶቹ አስቀድመው በዚያ መሰብሰባቸውን ያሳያል፤ ‘በዚያ’ የሚለው ከቅርብ አውዱ የተገኘ ተፈጥሯዊ ማብራሪያ ነው።
theological_decisions:
- issue: በዚህ አውድ προσευχή የሚለው ትርጉም
  choice: የጸሎት ስፍራ
  alternative: ጸሎት፤ ወይም በትርጓሜ የተጨመረ ‘ምኵራብ’
  rationale: ትረካው በወንዝ ዳር ሰዎች ስለሚሰበሰቡበት ቦታ ይናገራል፤ προσευχήም በሄለናዊ የአይሁድ አጠቃቀም የጸሎት ቦታን ሊያመለክት ይችላል። ‘ምኵራብ’ ግን ግሪኩ በግልጽ የማይለውን ተቋማዊ ትርጉም ያክላል። የቃሉ እውነተኛ አሻሚነት በግርጌ ማስታወሻ ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። የትረካውን ብዙ ቁጥር አንደኛ ሰው አነጋገርና የግሶቹን ገጽታ ለመጠበቅ ተሞክሯል።
