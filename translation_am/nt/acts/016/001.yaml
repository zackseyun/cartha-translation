  text: እርሱም ደግሞ ወደ ደርቤና ወደ ልስጥራ ደረሰ። እነሆም፣ ጢሞቴዎስ የሚባል አንድ ደቀ መዝሙር በዚያ ነበር፤ እናቱ አማኝ[a] አይሁዳዊት ነበረች፣ አባቱ ግን ግሪካዊ ነበር።
