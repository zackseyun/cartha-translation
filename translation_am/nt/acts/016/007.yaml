base_translation:
  language: en
  yaml_path: translation/nt/acts/016/007.yaml
  text: But when they came to Mysia[a], they were trying to go into Bithynia, and the Spirit of Jesus did not permit them.
translation:
  language: am
  text: ነገር ግን ወደ ሚስያ አካባቢ[a] ሲደርሱ፣ ወደ ቢታንያ ለመሄድ ይሞክሩ ነበር፤ የኢየሱስ መንፈስም አልፈቀደላቸውም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወደ ሚስያ” ወይም “በሚስያ በኩል።” የግሪኩ ሐረግ ምናልባት የሚስያን ድንበር አካባቢ መድረሳቸውን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
