  choice: በደረሱ ጊዜ
  rationale: የአዎሪስት አጋዥ ግስን ጊዜያዊ ተግባሩንና የክስተቶቹን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከቀደመው ትረካ ጋር ያለውን ቀላል ለውጥ ወይም ንፅፅር ያሳያል።
- source_word: κατὰ τὴν Μυσίαν
  choice: ወደ ሚስያ አካባቢ
  rationale: κατά ከወራሽ ቅጽ ጋር በጂኦግራፊያዊ አጠቃቀም ‘አጠገብ፣ በኩል፣ አካባቢ’ ሊል ይችላል፤ ሐረጉ ሚስያ ውስጥ ፈጽሞ መግባታቸውን ሳያስገድድ ድንበሯ አካባቢ መድረሳቸውን ይጠብቃል።
- source_word: ἐπείραζον
  choice: ይሞክሩ ነበር
  rationale: የግሱን ኢምፐርፌክት ገጽታና በሂደት ላይ የነበረውን ሙከራ ያሳያል።
- source_word: εἰς τὴν Βιθυνίαν πορευθῆναι
  choice: ወደ ቢታንያ ለመሄድ
  rationale: የታሰበውን ጉዞና ወደ ክልሉ የሚደረገውን እንቅስቃሴ በግልጽ አማርኛ ይገልጻል።
- source_word: οὐκ εἴασεν
  choice: አልፈቀደላቸውም
  rationale: ἐάω የሚለውን ‘መፍቀድ’ ትርጉም በትክክል ይገልጻል፤ ‘ከለከላቸው’ ከሚለው ያነሰ ጥንካሬ ያለውን የግሪኩን አገላለጽ ይጠብቃል።
- source_word: τὸ πνεῦμα Ἰησοῦ
  choice: የኢየሱስ መንፈስ
  rationale: በግሪኩ ያለውን ያልተለመደ ክርስቶሎጂያዊ ሐረግ ሳያስተካክል ወይም ‘መንፈስ ቅዱስ’ ብሎ ሳይተካ በቀጥታ ያስተላልፋል።
theological_decisions:
- issue: τὸ πνεῦμα Ἰησοῦ የሚለውን ክርስቶሎጂያዊ ሐረግ መተርጎም
