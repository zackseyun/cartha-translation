id: ACT.16.10
reference: Acts 16:10
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὡς δὲ τὸ ὅραμα εἶδεν, εὐθέως ἐζητήσαμεν ἐξελθεῖν ⸀εἰς Μακεδονίαν, συμβιβάζοντες ὅτι προσκέκληται ἡμᾶς ὁ ⸀θεὸς εὐαγγελίσασθαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/010.yaml
  text: And when he had seen the vision[a], we immediately sought to go on into Macedonia[c][b], concluding that God had called us to proclaim the good news to them.
translation:
  language: am
  text: እርሱ ራእዩን ካየ በኋላ፣ ወዲያውኑ ወደ መቄዶንያ ለመሄድ ፈለግን፤ እግዚአብሔር ምሥራቹን እንድንሰብክላቸው ጠርቶናል ብለን ተረዳን።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ
  choice: እርሱም … ካየ በኋላ
  rationale: የትረካውን ቀጣይነትና የድርጊቶቹን ጊዜያዊ ቅደም ተከተል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τὸ ὅραμα
  choice: ራእዩን
  rationale: በመለኮታዊ መገለጥ አውድ የሚታይን ራእይ በትክክል የሚገልጽ የተለመደ ቃል ነው።
- source_word: εὐθέως
  choice: ወዲያውኑ
  rationale: ተግባሩ ሳይዘገይ መከናወኑን በግልጽ ያስተላልፋል።
- source_word: ἐζητήσαμεν
  choice: ጣርን
  rationale: በዚህ አውድ ζητέω ለማድረግ መጣርን ወይም መዘጋጀትን ያመለክታል፤ «ጣርን» ከ«ፈለግን» ይልቅ ይህን የተግባር ኃይል ይጠብቃል።
- source_word: ἐξελθεῖν εἰς Μακεδονίαν
  choice: ወደ መቄዶንያ ለመሄድ
  rationale: የመነሳትና የመድረሻውን ሐሳብ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል፤ «ወጥተን» ብሎ መጨመር በአማርኛ አላስፈላጊ ክብደት ይፈጥራል።
- source_word: συμβιβάζοντες
  choice: ተረድተን
  rationale: ከራእዩ ማስረጃ መደምደሚያ ላይ መድረሳቸውን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: προσκέκληται
  choice: እንደጠራን
  rationale: ፍጹም ግሱ ቀድሞ የተፈጸመና ውጤቱ የቀጠለ የመለኮታዊ ጥሪ ድርጊትን ያሳያል፤ «ጠራን» ከ«ጋበዘን» ወይም «መራን» ይልቅ የግሪኩን ኃይል ይጠብቃል።
- source_word: εὐαγγελίσασθαι αὐτούς
  choice: ምሥራቹን ለእነርሱ እንድናበስር
  rationale: የምሥራቹን ይዘትና የማወጅ ድርጊት በግልጽ፣ በተከበረ እና ለዘመናዊ አንባቢ ተደራሽ ቋንቋ ያስተላልፋል።
theological_decisions:
- issue: ትረካው ወደ መጀመሪያ ሰው ብዙ ቁጥር መለወጡ
  choice: «እንድናበስር» እና «ጣርን» በማለት የግሪኩን ‘እኛ’ ቅርጽ በግልጽ ማቆየት
  alternative: ትረካውን ግለሰብ አልባ አድርጎ መተርጎም
  rationale: ምንጩ በግልጽ ወደ መጀመሪያ ሰው ብዙ ቁጥር ይለወጣል፤ ትርጉሙ ይህን የጽሑፉን ባህሪ ስለ ደራሲነት ተጨማሪ ግምት ሳያስገባ ይጠብቃል።
- issue: በπροσκέκληται ἡμᾶς ὁ θεὸς ያለው የመለኮታዊ መሪነት አገላለጽ
  choice: «እግዚአብሔር … እንደጠራን»
  alternative: «እግዚአብሔር እየመራን እንደሆነ» ወይም «እንደጋበዘን»
  rationale: ግሱ ጥሪን ወይም መጥራትን ይገልጻል፤ «ጠራን» የእግዚአብሔርን ቀዳሚ ድርጊት ሳያዳክም ያቆያል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ረጅም ዓረፍተ ነገር አንድነት ተጠብቋል፤ ነገር ግን ዋናው መደምደሚያ «እንደጠራን» ከጥሪው ዓላማ ጋር ተፈጥሯዊ እንዲሆን ተደርጓል። የቃላት አማራጮቹ ትርጉሙን በእግር ማስታወሻ የሚጠይቅ ደረጃ የማይለውጡ ስለሆኑ ማስታወሻ አልተጨመረም።
