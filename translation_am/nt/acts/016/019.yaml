- source_word: ἐξῆλθεν
  choice: እንደጠፋ
  rationale: ቃል በቃል “ወጣ” ቢሆንም፣ በአማርኛ ስለ ተስፋ “ወጣ” ማለት ተፈጥሯዊ አይደለም። “እንደጠፋ” የገቢ ምንጫቸው መቋረጡን ግልጽ ያደርጋል፤ የግሪክኛው ምስላዊ አነጋገር በማስታወሻው ተጠብቋል።
- source_word: ἡ ἐλπὶς τῆς ἐργασίας αὐτῶν
  choice: የገቢያቸው ተስፋ
  rationale: ἐλπίς የሚለውን “ተስፋ” በቀጥታ ይጠብቃል፤ ἐργασία በዚህ አውድ ተራ ሥራን ሳይሆን ከልጅቱ ጥንቆላ ያገኙትን ገቢ ያመለክታል። “ትርፍ” በማስታወሻ እንደ አማራጭ ቀርቧል።
- source_word: ἐπιλαβόμενοι
