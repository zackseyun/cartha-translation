review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the loss of the masters’ expected earnings, the public marketplace, and the general civic authorities. However, ἐπιλαβόμενοι has a forceful sense ('seizing'), which plain ይዘው understates. The revised wording makes this explicit without altering the sequence of actions.
  naturalness: The revision uses more idiomatic modern Amharic possessive phrasing (የገቢ ተስፋቸው) and a natural coordinated verbal form for the participle and main verb.
  terminology: ጌቶቿ appropriately represents the girl’s masters in this slaveholding context. ገዥዎች remains suitably broad for ἄρχοντες and does not prematurely equate them with the more specific officials in the following verse.
  issues:
  - severity: medium
    issue: The wording ይዘው can mean simply 'taking/holding' and does not clearly communicate the hostile, forceful sense of ἐπιλαβόμενοι.
    rationale: The Greek participle denotes seizing or laying hold of Paul and Silas. Using ያዙአቸውና preserves that force clearly.
  - severity: low
    issue: የገቢያቸው ተስፋ is understandable but less natural than የገቢ ተስፋቸው.
    rationale: The revised word order is smoother in modern standard Amharic while retaining 'their hope of income/profit.'
