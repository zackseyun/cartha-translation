- source_word: ἀγορὰν
  choice: የገበያ አደባባይ
  rationale: ἀγορά የንግድ ስፍራም የሕዝብና የሲቪክ ጉዳዮች አደባባይም ነበር። “የገበያ አደባባይ” ሁለቱንም ገጽታዎች ያስተላልፋል።
