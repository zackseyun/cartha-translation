theological_decisions:
- issue: በሮቹን የከፈተውና ሰንሰለቶቹን የፈታው ማን እንደሆነ
  choice: የምንጩን ተደራጊ አገላለጽ «ተከፈቱ…ተፈቱ» በማለት መጠበቅ
  alternative: «እግዚአብሔር በሮቹን ከፈተ፣ ሰንሰለቶቹንም ፈታ» ብሎ ፈጻሚውን በግልጽ መጨመር
  rationale: ዐውዱ ድርጊቱን ተአምራዊ አድርጎ ቢያቀርብም፣ ይህ ንጥል ሐረግ ፈጻሚውን በቀጥታ አይሰይምም፤ ትርጉሙም ያንን ክፍትነት ጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ የትረካ አማርኛ ይጠቀማል። የእንግሊዝኛው የግርጌ ማስታወሻ ምልክቶች ከሚያብራሯቸው ቃላት ጋር ያልተጣጣሙ ስለነበር፣ ከግሪክ ምንጭ ጋር የሚዛመደው የδεσμά/ἀνέθη አማራጭ ብቻ በ[a] በትክክለኛው ቦታ ቀርቧል። «እስር ቤት» በአማርኛ δεσμωτήριονን በቂ ስለሚወክል ለእንግሊዝኛው prison/jail ልዩነት ሰው ሠራሽ የአማርኛ አማራጭ አልተጨመረም።
