  yaml_path: translation/nt/acts/016/026.yaml
  text: Suddenly there was a great earthquake[a], so that the foundations of the prison were shaken; and immediately all the doors were opened[b], and everyone's chains were unfastened.
translation:
  language: am
  text: ድንገትም ታላቅ የምድር መንቀጥቀጥ ሆነ፤ በዚህም የእስር ቤቱ መሠረቶች ተናወጡ። ወዲያውም በሮቹ ሁሉ ተከፈቱ፤ የሁሉም ሰንሰለቶች[a] ተፈቱ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የሁሉም ማሰሪያዎች ላሉ።» የግሪኩ δεσμά «ማሰሪያዎች» ወይም «ሰንሰለቶች» ሊሆን ይችላል፤ ἀνέθηም «ላሉ» ወይም «ተፈቱ» ተብሎ ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
