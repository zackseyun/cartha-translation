- source_word: παραχρῆμα
  choice: ወዲያውም
  rationale: ነገሩ ያለ መዘግየት መከሰቱን በተለመደ የትረካ ቋንቋ ይገልጣል።
- source_word: ἠνεῴχθησαν ... αἱ θύραι πᾶσαι
  choice: በሮቹ ሁሉ ተከፈቱ
  rationale: πᾶσαιን «ሁሉ» ብሎ ያቆያል፤ ተደራጊውን ግስም «ተከፈቱ» ብሎ በቀጥታ ይመልሳል።
- source_word: πάντων τὰ δεσμὰ
  choice: የሁሉም ሰንሰለቶች
  rationale: πάντων እያንዳንዱን ታሳሪ ያካተተ መሆኑን «የሁሉም» ያሳያል፤ δεσμά በእስር ቤት አውድ «ሰንሰለቶች» ተብሎ በግልጽ ተተርጉሟል።
- source_word: ἀνέθη
