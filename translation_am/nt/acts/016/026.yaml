- source_word: σεισμὸς ἐγένετο μέγας
  choice: ታላቅ የምድር መናወጥ ሆነ
  rationale: μέγαςን ሳያጋንን «ታላቅ» ብሎ ያቆያል፤ σεισμόςንም በግልጽና በተለመደ አገላለጽ ይተረጉማል።
- source_word: ὥστε σαλευθῆναι
