  text: ἐφώνησεν δὲ ⸂φωνῇ μεγάλῃ ὁ Παῦλος⸃ λέγων· Μηδὲν πράξῃς σεαυτῷ κακόν, ἅπαντες γάρ ἐσμεν ἐνθάδε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/028.yaml
  text: But Paul shouted with a loud voice[a], saying, “Do not do yourself any harm, for we are all here.”
translation:
  language: am
  text: ጳውሎስ ግን በታላቅ ድምፅ ጮኾ፣ “በራስህ ላይ ምንም ክፉ ነገር አታድርግ፤[a] ሁላችንም እዚህ ነንና” አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ራስህን አትጉዳ።” የግሪኩ አገላለጽ ቃል በቃል “በራስህ ላይ ምንም ክፉ ነገር አታድርግ” የሚል ሰፊ ትርጉም አለው፤ በዐውዱ ግን የወኅኒ ጠባቂው ሊያደርስበት ያሰበውን ራስን መጉዳት ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφώνησεν
  choice: ጮኾ
  rationale: ቃሉ በአስቸኳይ ሁኔታ የተደረገ ከፍተኛና ኃይለኛ ጥሪን ያመለክታል፤ “ጮኾ” ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δὲ
  choice: ግን
  rationale: የወኅኒ ጠባቂውን የቀደመ ድርጊት የሚያቋርጥ ለውጥና መጠነኛ ተቃርኖ ያሳያል።
- source_word: φωνῇ μεγάλῃ
  choice: በታላቅ ድምፅ
  rationale: የግሪኩን ግልጽ አገላለጽ በተፈጥሯዊና ክቡር አማርኛ ይጠብቃል።
- source_word: λέγων
  choice: አለ
  rationale: የጳውሎስን ንግግር ይዘት በተፈጥሯዊ የአማርኛ የንግግር አወቃቀር ያስገባል።
- source_word: Μηδὲν πράξῃς σεαυτῷ κακόν
  choice: በራስህ ላይ ምንም ክፉ ነገር አታድርግ
  rationale: የግሪኩን ሰፊ ቀጥተኛ ትርጉም፣ ራስን የሚመለከተውን ኃይልና አሉታዊ ትእዛዙን ይጠብቃል፤ በዐውዱ ግን ራስን ለመጉዳት የነበረውን ዕቅድ ያመለክታል።
- source_word: ἅπαντες
  choice: ሁላችንም
  rationale: በቦታው የነበሩት እስረኞች አንዳቸውም እንዳልጠፉ የሚያሳየውን አጽንዖት ይገልጻል።
- source_word: γάρ
  choice: ነንና
  rationale: ጠባቂው ራሱን መጉዳት የሌለበትን ምክንያት በተፈጥሯዊ የአማርኛ አገናኝ ያቀርባል።
- source_word: ἐνθάδε
  choice: እዚህ
  rationale: ቀላልና ቀጥተኛ የቦታ አመልካች ነው።
- source_word: ὁ Παῦλος
  choice: ጳውሎስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የስሙን አጻጻፍ ይከተላል።
