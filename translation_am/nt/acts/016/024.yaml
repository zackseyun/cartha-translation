  text: እርሱም እንዲህ ያለ ትእዛዝ ተቀብሎ ወደ ውስጠኛው የእስር ክፍል[a] ጣላቸው፤ እግሮቻቸውንም በእንጨት እግር መቆለፊያ[b] አጥብቆ አሰራቸው።
