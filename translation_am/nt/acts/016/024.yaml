- source_word: τοὺς πόδας αὐτῶν
  choice: እግሮቻቸውን
  rationale: πούς በቀጥታ «እግር» ማለት ነው፤ የብዙ ቁጥሩና የባለቤትነት አመልካቹ በተፈጥሯዊ አማርኛ ተጠብቀዋል።
- source_word: εἰς τὸ ξύλον
  choice: በእንጨት እግር መቆለፊያ
  rationale: ξύλον በቀጥታ «እንጨት» ወይም «ከእንጨት የተሠራ ነገር» ማለት ነው፤ በዚህ የእስር ቤት ዐውድ ግን እግርን የሚይዝ የእንጨት መሣሪያን ያመለክታል።
