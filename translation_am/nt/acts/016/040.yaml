  text: ἐξελθόντες δὲ ⸀ἀπὸ τῆς φυλακῆς εἰσῆλθον πρὸς τὴν Λυδίαν, καὶ ἰδόντες ⸂παρεκάλεσαν τοὺς ἀδελφοὺς⸃ καὶ ἐξῆλθαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/040.yaml
  text: After they came out of the prison[a], they went to Lydia, and when they saw the brothers, they encouraged them and departed.
translation:
  language: am
  text: 'ከወኅኒ ቤቱም ከወጡ በኋላ ወደ ልድያ ሄዱ፤ ወንድሞችንም[a] አይተው አበረታቷቸው፤ ከዚያም ወጡ።


    [a] ወይም፣ “ወንድሞችንና እኅቶችን።” የግሪኩ ቃል በወንድ ጾታ ብዙ ቁጥር ቢሆንም፣ ወንዶችንና ሴቶችን ያካተቱ የእምነት ወገኖችን ሊያመለክት ይችላል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወንድሞችንና እኅቶችን።” የግሪኩ ቃል በወንድ ጾታ ብዙ ቁጥር ቢሆንም፣ ወንዶችንና ሴቶችን ያካተቱ የእምነት ወገኖችን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: ከወጡ በኋላ
  rationale: የግሪኩን ቀዳሚ ድርጊትና የትረካውን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἀπὸ τῆς φυλακῆς
  choice: ከወኅኒ ቤቱ
  rationale: በዐውዱ የተጠቀሰውን የታወቀ ወኅኒ ቤት በውስን አመልካች ያቀርባል።
- source_word: εἰσῆλθον πρὸς τὴν Λυδίαν
  choice: ወደ ልድያ ሄዱ
  rationale: ወደ ልድያ ለመጎብኘት መሄዳቸውን በተፈጥሯዊ አማርኛ ይገልጣል፤ በግሪኩ በግልጽ ያልተጠቀሰውን ‘ቤት’ አይጨምርም።
- source_word: ἰδόντες
  choice: አይተው
  rationale: ከዋናው ግስ በፊት የሆነውን ድርጊት በአማርኛ ተውሳከ ግስ በቀላሉ ያስተላልፋል።
- source_word: παρεκάλεσαν
  choice: አበረታቷቸው
  rationale: παρακαλέω በዚህ ዐውድ ማበረታታትን፣ ማጽናናትን ወይም መምከርን ሊያካትት ይችላል፤ ‘አበረታቷቸው’ ሰፊውን የእረኝነት ሐሳብ ይጠብቃል።
- source_word: τοὺς ἀδελφούς
  choice: ወንድሞችን
  rationale: የግሪኩን ወንድ ፆታ ብዙ ቁጥር ቅርጽ በዋናው ጽሑፍ ይጠብቃል፤ ድብልቅ የአማኞች ቡድንን ሊያካትት እንደሚችል በማስታወሻ ተገልጧል።
- source_word: ἐξῆλθαν
  choice: ከዚያም ሄዱ
  rationale: ከስፍራው ተለይተው መሄዳቸውን ያለ አላስፈላጊ ድግግሞሽ በተፈጥሯዊ የትረካ አማርኛ ያቀርባል።
theological_decisions:
- issue: ἀδελφοί የሚለው ቃል ወንዶችንና ሴቶችን የያዘ የክርስቲያኖች ስብስብ ሊያመለክት መቻሉ
  choice: ወንድሞችን
  alternative: ወንድሞችንና እኅቶችን / አማኞችን
  rationale: ዋናው ጽሑፍ የምንጩን ሰዋሰዋዊ ቅርጽ ይጠብቃል፤ ልድያንና ሌሎች ሴት አማኞችን ሊያካትት የሚችለው ሰፊ ትርጉም ግን በግርጌ ማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ወኅኒ ቤት’ የመጽሐፍ ቅዱስን ክብር የሚጠብቅ ሆኖ አሁንም የሚገባ አገላለጽ ነው።
