  rationale: πεπιστευκώς በነጠላ ቁጥር በቀጥታ ጠባቂውን ያመለክታል፤ πανοικεὶ ግን በዋናነት የደስታውን የቤተሰብ አቀፍ መጠን ያሳያል። ሆኖም ቤተሰቡም አምኖ ነበር የሚለውን አማራጭ ንባብ ጽሑፉ ፈጽሞ ስለማይዘጋው በማስታወሻ ተጠብቋል።
