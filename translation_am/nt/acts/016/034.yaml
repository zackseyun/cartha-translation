  rationale: የፍጹም ጊዜውን አንቀጽ በተፈጥሯዊ የአማርኛ ተውሳከ ግስ ይተረጉማል፤ የአማኙን ነጠላ ርዕሰ ጉዳይ ጠብቆ ግልጽ ያልሆነ ምክንያታዊ አገናኝ አይጨምርም።
theological_decisions:
- issue: የደስታውና የማመኑ ከመላው ቤተሰብ ጋር ያላቸው ዝምድና
  choice: ዋናው ጽሑፍ ጠባቂው አምኖ ከመላው ቤተሰቡ ጋር ደስ እንዳለው ያቀርባል።
