  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ቀላል የሆነ አማርኛ ይጠቀማል። “ማዕድ አቀረበላቸው” የእንግዳ ተቀባይነቱን ሐሳብ በተፈጥሯዊ ቋንቋ ሲያቀርብ፣ “በእግዚአብሔርም አምኖ” የግሪኩን የአንቀጽ ቅርጽና የርዕሰ ጉዳዩን ነጠላነት ይጠብቃል።
