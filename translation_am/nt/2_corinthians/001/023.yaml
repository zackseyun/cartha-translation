  text: Ἐγὼ δὲ μάρτυρα τὸν θεὸν ἐπικαλοῦμαι ἐπὶ τὴν ἐμὴν ψυχήν, ὅτι φειδόμενος ὑμῶν οὐκέτι ἦλθον εἰς Κόρινθον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/023.yaml
  text: But I call God as witness upon my own life[b][a], that to spare you I did not come again to Corinth.
translation:
  language: am
  text: እኔ ግን በሕይወቴ ላይ[a] እግዚአብሔርን ምስክር አድርጌ እጠራለሁ፤ እናንተን ለመቆጠብ እንደገና ወደ ቆሮንቶስ አልመጣሁም[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በራሴ ላይ”፤ ቃል በቃል፣ “በነፍሴ ላይ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ከእንግዲህ ወዲያ ወደ ቆሮንቶስ አልመጣሁም።”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγὼ δὲ
  choice: እኔ ግን
  rationale: የδέን መጠነኛ ንጽጽርና በἐγώ የተሰጠውን የመናገሪያ አጽንዖት በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: μάρτυρα τὸν θεὸν ἐπικαλοῦμαι
  choice: እግዚአብሔርን ምስክር አድርጌ እጠራዋለሁ
  rationale: ጳውሎስ የሚናገረውን እውነት እግዚአብሔር እንዲመሰክርለት በከባድ መሐላዊ አነጋገር መጥራቱን ይገልጣል።
- source_word: ἐπὶ τὴν ἐμὴν ψυχήν
  choice: በራሴ ነፍስ ላይ
  rationale: የἐπίን መሐላዊ አገባብና ኃላፊነቱ በጳውሎስ ራስ ላይ መሆኑን ሳይደብቅ በቅርብ መልኩ ያስተላልፋል፤ የአገባቡ አማራጭ በማስታወሻ ተጠቅሷል።
- source_word: ὅτι
  choice: ብዬ
  rationale: የመሐላውን ይዘት በተፈጥሯዊ የአማርኛ ቀጥተኛ ንግግር አገባብ ያስገባል።
- source_word: φειδόμενος ὑμῶν
  choice: እናንተን ለመቆጠብ
  rationale: አለመምጣቱ እነርሱን ከጥብቅ እርምጃ ለመታደግ እንደነበር በአጭርና ተፈጥሯዊ አገላለጽ ያሳያል።
- source_word: οὐκέτι ἦλθον
  choice: እንደገና … አልመጣሁም
  rationale: በዐውደ ንባቡ የታሰበውን የዳግም ጉብኝት አለማድረግ በግልጽ አማርኛ ይገልጣል፤ οὐκέτι እንደ ‘ከእንግዲህ ወዲያ’ ሊተረጎም የሚችለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: εἰς Κόρινθον
  choice: ወደ ቆሮንቶስ
  rationale: ወደ ከተማዋ የሚደረገውን እንቅስቃሴ በመደበኛ የአማርኛ አገባብ ያቀርባል።
theological_decisions:
- issue: የመሐላዊው ሐረግ ኃላፊነት በጳውሎስ ላይ መሆኑ
  choice: በራሴ ነፍስ ላይ
  alternative: በራሴ ላይ፤ በሕይወቴ ላይ
  rationale: ጽሑፉ የሚያሳየውን ከባድ ራስን ተጠያቂ የሚያደርግ ምስክርነት ይጠብቃል፤ ‘ነፍስ’ን ወደ አንድ ልዩ ሥነ መለኮታዊ ፍቺ አይገድብም።
