- source_word: ἐπὶ πάσῃ τῇ θλίψει ἡμῶν
  choice: በመከራችን ሁሉ
  rationale: θλῖψις ጫና፣ ስቃይና መከራን የሚያጠቃልል ነው፤ «መከራ» በዚህ አውድ ክብደቱን በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: εἰς τὸ δύνασθαι ἡμᾶς
  choice: እንድንችል
  rationale: የግሪኩን የዓላማ ወይም የውጤት ፍሰት በአማርኛ ተፈጥሯዊ በሆነ የዓላማ አገባብ ያሳያል።
- source_word: τοὺς ἐν πάσῃ θλίψει
