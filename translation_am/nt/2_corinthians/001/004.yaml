  yaml_path: translation/nt/2_corinthians/001/004.yaml
  text: who comforts us in all our affliction[a], so that we may be able to comfort those in any affliction through the comfort with which we ourselves are comforted by God.
translation:
  language: am
  text: በመከራችን ሁሉ[a] የሚያጽናናን፣ በማናቸውም መከራ ውስጥ ያሉትን እኛ ራሳችን ከእግዚአብሔር በምንጽናናበት መጽናናት ማጽናናት እንድንችል ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በችግራችን ሁሉ የሚያበረታታን … ማበረታታት … ማበረታቻ»፤ በግሪክኛው ጥቅሱ ሁሉ አንድ የቃል ቤተሰብ ተደጋግሟል።
    reason: lexical_alternative
