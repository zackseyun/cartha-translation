    reason: cultural_note
lexical_decisions:
- source_word: βουλόμενος
  choice: ለማድረግ ሳስብ
  rationale: የጳውሎስን ቀደም ሲል የነበረውን የጉዞ ሐሳብ በተፈጥሯዊ አማርኛ ይገልጣል፤ መደበኛ ዕቅድ እንደነበረ ከልክ በላይ አይወስንም።
- source_word: τῇ ἐλαφρίᾳ ἐχρησάμην
  choice: በወላዋይነት አደረግሁትን
  rationale: አገላለጹ የዓላማ አለመጽናትንና በቀላሉ ሐሳብን መለዋወጥን ያመለክታል፤ የጥያቄውንም የመከላከያ ቃና ይጠብቃል።
- source_word: ἃ βουλεύομαι ... βουλεύομαι
  choice: የማቅደውን ... አቅዳለሁን
  rationale: በግሪክ ያለውን አጽንዖታዊ ድግግሞሽ በአማርኛም በተፈጥሯዊ መልኩ ይጠብቃል።
- source_word: κατὰ σάρκα
  choice: በሥጋ መሠረት
  rationale: የጳውሎስን ጉልህና ትርጉሙ በዐውድ የሚወሰን ቃል ሳያጠብ ይጠብቃል፤ አንባቢውን ለማገዝ ትርጓሜያዊ አማራጩ በማስታወሻ ተሰጥቷል።
- source_word: παρ’ ἐμοὶ
  choice: እኔ ዘንድ
  rationale: አንድ ነገር በጳውሎስ አካሄድ ወይም ባሕርይ ዘንድ መገኘቱን በክቡርና የተለመደ አማርኛ ያሳያል።
- source_word: τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ
  choice: “አዎ፣ አዎ” እና “አይ፣ አይ”
  rationale: የግሪኩን ድግግሞሽ በቀጥታ በመጠበቅ የወላዋይነትን ክስ ያጎላል፤ ሁለቱ ተቃራኒ ምላሾች አብረው እንደሚቆሙ የሚገልጸው ፍቺ በማስታወሻ ተብራርቷል።
theological_decisions:
- issue: κατὰ σάρκα ውስጥ σάρξ የሚለውን ቃል መተርጎም
  choice: በሥጋ መሠረት
  alternative: በሰው ብቻ መለኪያ / በዓለማዊ አካሄድ
  rationale: “ሥጋ” በጳውሎስ ጽሑፎች ትርጉሙ እንደ ዐውዱ የሚለያይ ጉልህ ቃል ነው። እዚህ ምሳሌያዊ አገላለጽ ቢሆንም፣ ቃሉን መጠበቅ የጽሑፉን ሥነ መለኮታዊ ውጥረት ይጠብቃል፤ አንድን ትርጓሜ ብቻ አስቀድሞ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ሦስት ተከታታይ የክርክር ጥያቄዎች፣ የβουλεύομαι ድግግሞሽና “አዎ፣ አዎ / አይ፣ አይ” የሚለው ሚዛናዊ አወቃቀር ተጠብቀዋል።
