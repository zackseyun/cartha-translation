base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/017.yaml
  text: So when I intended this[a], was I acting lightly? Or do I plan what I plan according to the flesh, so that with me there should be both “Yes, yes” and “No[d][c][b], no”?
translation:
  language: am
  text: እንግዲህ ይህን ባሰብሁ ጊዜ፣ በቀላልነት[a] ተጠቀምሁን? ወይስ የማቅደውን በሥጋ መሠረት[b] አቅዳለሁን፣ እኔ ዘንድ “አዎ፣ አዎ” እና “አይ፣ አይ”[c] እንዲሆን?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በወላዋይነት” ወይም “ሐሳቤን በቀላሉ እየለዋወጥሁ” ተብሎም ሊተረጎም ይችላል።
