base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/009.yaml
  text: Indeed[a], we ourselves had the sentence of death within ourselves, so that we would not rely on ourselves but on God, who raises the dead.
translation:
  language: am
  text: ነገር ግን፣ እኛ ራሳችን በውስጣችን የሞት ፍርድ[a] ነበረን፤ ይህም በራሳችን እንዳንታመን፣ ነገር ግን ሙታንን በሚያስነሣው በእግዚአብሔር እንድንታመን ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የሞት ውሳኔ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: እንዲያውም
  rationale: ከቀደመው አሳብ ጋር ያለውን ጠንካራ ንፅፅርና አጽንዖት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: αὐτοὶ ἐν ἑαυτοῖς
  choice: እኛ ራሳችን በውስጣችን
  rationale: የαὐτοὶን አጽንዖትና የἐν ἑαυτοῖςን ውስጣዊ የግል ልምምድ ይጠብቃል።
- source_word: τὸ ἀπόκριμα τοῦ θανάτου
  choice: የሞት ፍርድ
  rationale: በዐውዱ ውስጥ ሞት የተወሰነ ይመስል የነበረውን ወሳኝ የፍርድ ውጤት ያመለክታል፤ “የሞት ውሳኔ” የሚለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ἐσχήκαμεν
  choice: እንደተሰጠብን ተሰምቶን ነበር
  rationale: ግሪኩ በራሳቸው ውስጥ ያዙትን የተረጋጋ ሁኔታ ይገልጣል፤ በአማርኛ ቃል በቃል “ነበረን” ከማለት ይልቅ የሞት ፍርድ እንደተወሰነባቸው የነበራቸውን ውስጣዊ እርግጠኝነት በተፈጥሯዊ ሁኔታ ያቀርባል።
- source_word: ἵνα μὴ πεποιθότες ὦμεν ἐφ’ ἑαυτοῖς ἀλλ’ ἐπὶ τῷ θεῷ
  choice: ይህም በራሳችን ሳይሆን … በእግዚአብሔር እንድንታመን ነበር
  rationale: የዓላማውን ግንኙነትና በራስ መታመን/በእግዚአብሔር መታመን ያለውን ቀጥተኛ ንፅፅር ይጠብቃል።
- source_word: τῷ ἐγείροντι τοὺς νεκρούς
  choice: ሙታንን በሚያስነሣው
  rationale: እግዚአብሔርን ሙታንን በማስነሣት ኃይሉ የሚገልጠውን ተሳቢ ቅጽ በቀጥታና በታወቀ መጽሐፍ ቅዱሳዊ አገላለጽ ያቀርባል።
theological_decisions:
- issue: τοὺς νεκρούς እንደ አጠቃላይ ስብስብ ወይም በተብራራ መልኩ መተርጎም
  choice: ሙታንን
  alternative: የሞቱትን ሰዎች
  rationale: “ሙታንን” ትክክለኛ፣ ተፈጥሯዊና በመጽሐፍ ቅዱሳዊ አጠቃቀም የታወቀ ሲሆን ተጨማሪ ትርጓሜ አያስገባም።
- issue: የἵνα ሐረግ ዓላማን ወይም ውጤትን ማመልከቱ
  choice: ዓላማን በ“እንድንታመን” ማቅረብ
  alternative: ውጤትን በ“ስለዚህ ታመንን” ማቅረብ
  rationale: ἵνα በዚህ ዐውድ የዚያ አስጨናቂ ልምምድ ዓላማ ራስን ከመታመን ወደ እግዚአብሔር መታመን መምራት መሆኑን በተሻለ ሁኔታ ያሳያል።
