  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “እኛ ራሳችን” የሚለው አጽንዖት ተጠብቋል፤ “በራሳችን … በእግዚአብሔር” የሚለውም ንፅፅር ግልጽ ሆኗል።
