  choice: በእምነት
  rationale: ዳቲቩ እዚህ መንገድን ወይም መሠረትን ሊገልጽ ይችላል፤ ‘በእምነት’ ይህን አጭርና በተፈጥሮ ያስተላልፋል።
- source_word: ἑστήκατε
  choice: ጸንታችሁ ቆማችኋል
  rationale: ፍጹም ጊዜው ከቀድሞ የተመሠረተና አሁንም የቀጠለ መቆምን ያሳያል፤ ‘ጸንታችሁ ቆማችኋል’ ይህን ውጤታዊና ቀጣይ ሁኔታ ይጠብቃል።
theological_decisions:
- issue: በሁለቱም ስፍራ የπίστις ትርጉም
  choice: እምነት
  alternative: መታመን
  rationale: አውዱ የቆሮንቶስ ሰዎችን የማመን አቋም ይገልጻል። ‘እምነት’ የቃሉን ሰፊና የተለመደ ሃይማኖታዊ አጠቃቀም ይጠብቃል፤ ‘መታመን’ የሚለው አማራጭም በማስታወሻ ተጠብቋል።
