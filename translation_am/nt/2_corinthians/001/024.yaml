  alternative: የደስታችሁ ተባባሪዎች
  rationale: ዋናው ትርጉም የሥራውን ዓላማ በተፈጥሯዊ አማርኛ ያቀርባል፤ የግሪኩ የዝምድና አወቃቀር ግን ሌላ ቀጥተኛ አተረጓጎምን ስለሚፈቅድ በማስታወሻ ተጠብቋል።
- issue: የτῇ πίστει ዳቲቭ ኃይል
  choice: በእምነት
  alternative: በእምነት ውስጥ
  rationale: ዋናው ንባብ እምነትን የጽናቱ መንገድ ወይም መሠረት አድርጎ ያሳያል፤ ዳቲቩ የሁኔታ ወይም የዘርፍ ትርጉምም ሊኖረው ስለሚችል ‘በእምነት ውስጥ’ በማስታወሻ ቀርቧል።
