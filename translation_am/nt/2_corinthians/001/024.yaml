- source_word: τῆς χαρᾶς ὑμῶν
  choice: ለደስታችሁ
  rationale: የግሪኩ የዝምድና አቀራረብ ለደስታቸው የሚደረግን ሥራ ሊያመለክት ስለሚችል ‘ለደስታችሁ’ ተፈጥሯዊና ግልጽ ነው።
