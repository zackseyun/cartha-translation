  yaml_path: translation/nt/2_corinthians/001/006.yaml
  text: But if we are afflicted[a], it is for your comfort and salvation; or if we are comforted, it is for your comfort[b], which is at work in enduring the same sufferings that we also suffer.
translation:
  language: am
  text: መከራ ቢደርስብን፣ ይህ ለእናንተ መጽናናትና መዳን ነው[a]፤ ብንጽናናም፣ ይህ ለእናንተ መጽናናት ነው[b]፤ ይህም እኛም የምንቀበላቸውን ያንኑ ሥቃዮች በትዕግሥት ስትታገሡ ውጤታማ ይሆናል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የጥንት ቅጂዎች «ብንጽናናም፣ ይህ ለእናንተ መጽናናት ነው» የሚለውን ክፍል አያካትቱም።
    reason: textual_variant
