id: 2CO.1.12
reference: 2 Corinthians 1:12
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ἡ γὰρ καύχησις ἡμῶν αὕτη ἐστίν, τὸ μαρτύριον τῆς συνειδήσεως ἡμῶν, ὅτι ἐν ⸀ἁγιότητι καὶ εἰλικρινείᾳ ⸀τοῦ θεοῦ, ⸀οὐκ ἐν σοφίᾳ σαρκικῇ ἀλλ’ ἐν χάριτι θεοῦ, ἀνεστράφημεν ἐν τῷ κόσμῳ, περισσοτέρως δὲ πρὸς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/012.yaml
  text: 'For this is our boast: the testimony of our conscience[a], that we conducted ourselves in the world in holiness and sincerity of God[c][b], not in fleshly wisdom but in the grace of God—and especially toward you.'
translation:
  language: am
  text: ትምክህታችን ይህ ነውና፤ በዓለም ውስጥ፣ በተለይም ከእናንተ ጋር፣ በሥጋዊ ጥበብ[c] ሳይሆን በእግዚአብሔር ጸጋ፣ በቅድስና[a]ና ከእግዚአብሔር በሆነ ቅንነት[b] እንደኖርን ሕሊናችን ይመሰክራል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች “ቅድስና” በሚለው ፈንታ “ቀላልነት” የሚል ንባብ አላቸው።
    reason: textual_variant
  - marker: b
    text: ወይም፣ “እግዚአብሔራዊ ቅንነት።”
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “በሰው ጥበብ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: καύχησις
  choice: ትምክህት
  rationale: የጳውሎስን በመልካም ሕሊና ላይ የተመሠረተ የኩራት ምክንያት በተለመደ መጽሐፍ ቅዱሳዊ ቃል ይገልጣል፤ ትዕቢትን ብቻ አያመለክትም።
- source_word: μαρτύριον τῆς συνειδήσεως ἡμῶν
  choice: ሕሊናችን ይመሰክራል
  rationale: የግሪኩን የስም አገላለጽ በተፈጥሯዊ የአማርኛ ግስ ሲያቀርብ፣ ሕሊናው የውስጥ ምስክርነት እንደሚሰጥ ያስጠብቃል።
- source_word: ἁγιότητι
  choice: በቅድስና
  rationale: የSBLGNTን ዋና ንባብ እና የቃሉን ሥነ ምግባራዊና ሃይማኖታዊ ክብደት በቀጥታ ይጠብቃል።
- source_word: εἰλικρινείᾳ τοῦ θεοῦ
  choice: ከእግዚአብሔር በሆነ ቅንነት
  rationale: τοῦ θεοῦን እንደ ምንጭ ወይም ባሕርይ በተፈጥሯዊ አማርኛ ይገልጣል፤ የእግዚአብሔር የራሱ ቅንነት ነው የሚል ያልታሰበ ትርጉም አያስከትልም።
- source_word: σοφίᾳ σαρκικῇ
  choice: በሥጋዊ ጥበብ
  rationale: የσαρκ- ቃል ቤተሰብን ግልጽ አድርጎ በመጠበቅ ከሰው ተፈጥሮና ከዓለማዊ አስተሳሰብ የሚመነጨውን ጥበብ ያመለክታል።
- source_word: χάριτι θεοῦ
  choice: በእግዚአብሔር ጸጋ
  rationale: የጳውሎስን χάρις ቃል ሥነ መለኮታዊ ክብደት በተለመደው የአማርኛ አገላለጽ ይጠብቃል።
- source_word: ἀνεστράφημεν
  choice: እንደኖርን
  rationale: በዚህ አውድ የሕይወት አካሄድንና ምግባርን በቀላል፣ ዘመናዊ አማርኛ ይገልጣል።
- source_word: περισσοτέρως δὲ πρὸς ὑμᾶς
  choice: በተለይም ከእናንተ ጋር
  rationale: የπερισσοτέρωςን አጽንዖትና የπρὸς ὑμᾶςን ግንኙነታዊ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: በεἰλικρινείᾳ τοῦ θεοῦ ውስጥ የτοῦ θεοῦ ኃይል
  choice: ከእግዚአብሔር በሆነ ቅንነት
  alternative: እግዚአብሔራዊ ቅንነት፤ የእግዚአብሔር ቅንነት
  rationale: የዘር አገባቡ ምንጭን ወይም ባሕርይን ሊያመለክት ይችላል። የተመረጠው አገላለጽ ቅንነቱ ከእግዚአብሔር መሆኑን ያሳያል፣ ነገር ግን ሐረጉን የእግዚአብሔር የራሱ ቅንነት ብሎ አይወስነውም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። የግሪኩ ረጅም ዓረፍተ ነገር በአማርኛ ተፈጥሯዊ ቅደም ተከተል ተደርድሯል፤ የጳውሎስ ትምክህት መሠረቱ የሕሊናው ምስክርነት መሆኑ ግን ተጠብቋል። የእግሊዝኛው የግርጌ ማስታወሻ ምልክቶች ከሚመለከቷቸው ቃላት ጋር እንዲያያዙ ተቀምጠዋል።
