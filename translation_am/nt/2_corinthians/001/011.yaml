  text: as you also join in helping us by prayer[c][b][a], so that thanks may be given by many on our behalf for the gracious gift given to us.
translation:
  language: am
  text: እናንተም ስለ እኛ በጸሎት ተባብራችሁ ትረዱናላችሁ፤ ይህም ለእኛ በተሰጠው የጸጋ ስጦታ[c] ምክንያት፣ ከብዙ ሰዎች[b] ስለ እኛ ምስጋና በብዙዎች አማካይነት[a] እንዲቀርብ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በብዙዎች አማካይነት፣ ለእኛ በተሰጠው የጸጋ ስጦታ ምክንያት፣ ከብዙ ሰዎች ስለ እኛ ምስጋና እንዲቀርብ።”
    reason: alternative_reading
  - marker: b
    text: ቃል በቃል፣ “ከብዙ ፊቶች።”
