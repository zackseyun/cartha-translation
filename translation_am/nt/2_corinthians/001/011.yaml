    reason: lexical_alternative
lexical_decisions:
- source_word: συνυπουργούντων
  choice: ከእኛ ጋር በመተባበር ትረዱናላችሁ
  rationale: የ συν-ን የጋራ ተሳትፎና የ ὑπουργέωን የእርዳታ ሐሳብ በዘመናዊና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τῇ δεήσει
  choice: በጸሎት
  rationale: የልመና ጸሎትን ያመለክታል፤ በ- የተባባሪነቱ መንገድ ጸሎት መሆኑን ያሳያል።
- source_word: ἵνα
  choice: ይህም ... እንዲቀርብ ነው
  rationale: የዓላማ ወይም የውጤት ግንኙነቱን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐκ πολλῶν προσώπων
  choice: ከብዙ ሰዎች የተነሣ
  rationale: πρόσωπον ቃል በቃል ‘ፊት’ ቢሆንም እዚህ ሰዎችን በፈሊጣዊ አገባብ ይወክላል፤ ἐκ የምስጋናውን ምንጭ እንዲታይ ተጠብቋል።
- source_word: χάρισμα
  choice: የጸጋ ስጦታ
  rationale: የስጦታንም ሆነ በጸጋ የመሰጠቱን ገጽታ ይጠብቃል፤ በዐውዱ የአምላክን መዳን ወይም ውለታ ያመለክታል።
- source_word: διὰ πολλῶν
  choice: በብዙዎች አማካይነት
  rationale: አስቸጋሪውን የግሪክ ሐረግ ከጽሑፉ ሳያስወግድ የብዙዎችን ተሳትፎ ይጠብቃል።
- source_word: εὐχαριστηθῇ
  choice: ምስጋና እንዲቀርብ
  rationale: የግሪኩን ተገብሮ ቅርጽ በአማርኛ ተፈጥሯዊ በሆነ የምስጋና አቀራረብ ይገልጣል።
- source_word: ὑπὲρ ἡμῶν
  choice: ስለ እኛ
  rationale: በእነርሱ ፈንታ፣ ለእነርሱ ጥቅም ወይም እነርሱን በሚመለከት የሚለውን ሰፊ አገባብ ሳያጠብ ይይዛል።
theological_decisions:
- issue: የἐκ πολλῶν προσώπων እና διὰ πολλῶν ግንኙነት
  choice: ሁለቱንም የ‘ብዙዎች’ ማጣቀሻዎች በዋናው ጽሑፍ ማቆየት
  alternative: ሁለተኛውን ሐረግ በአማርኛ አስቀርቶ ለእኛ የተሰጠ ብሎ ማቀላጠፍ
  rationale: የግሪኩ አወቃቀር አሻሚ ስለሆነ የብዙ ሰዎች ጸሎትና ምስጋና መካከል ያለውን ሥነ መለኮታዊ ትስስር በዝምታ መፍታት አይገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ድግግሞሽና የአገባብ አሻሚነት ሙሉ በሙሉ እንዳይጠፋ፣ “ከብዙ ሰዎች” እና “በብዙዎች አማካይነት” ሁለቱም ተጠብቀዋል።
