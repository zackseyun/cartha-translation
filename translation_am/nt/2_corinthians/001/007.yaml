- from: ለእናንተም ያለን ተስፋ የጸና ነው፤ ምክንያቱም በመከራዎች እንደምትካፈሉ ሁሉ፣ በመጽናናትም[a] እንደምትካፈሉ እናውቃለን።
  to: ለእናንተ ያለን ተስፋም ጽኑ ነው፤ እናንተ በመከራዎቹ እንደምትካፈሉ ሁሉ፣ በማጽናናቱም እንደምትካፈሉ ስለምናውቅ ነው።
