id: 2CO.1.7
reference: 2 Corinthians 1:7
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἡ ἐλπὶς ἡμῶν βεβαία ὑπὲρ ⸀ὑμῶν· εἰδότες ὅτι ⸀ὡς κοινωνοί ἐστε τῶν παθημάτων, οὕτως καὶ τῆς παρακλήσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/007.yaml
  text: And our hope for you is firm[a], because we know that just as you share in the sufferings, so also you share in the comfort.
translation:
  language: am
  text: ለእናንተ ያለን ተስፋም ጽኑ ነው፤ እናንተ በመከራዎቹ እንደምትካፈሉ ሁሉ፣ በማጽናናቱም እንደምትካፈሉ ስለምናውቅ ነው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλπίς
  choice: ተስፋ
  rationale: የግሪኩን የመጠበቅና የመተማመን ሐሳብ በተለመደና ግልጽ ቃል ያስተላልፋል።
- source_word: βεβαία
  choice: የጸና
  rationale: ተስፋው ጽኑ፣ የተረጋገጠና የማይናወጥ መሆኑን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ὑπὲρ ὑμῶν
  choice: ለእናንተም ያለን
  rationale: ተስፋው ከቆሮንቶስ ሰዎች ጋር ያለውን የማጣቀሻ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: εἰδότες
  choice: ምክንያቱም ... እናውቃለን
  rationale: የግሪኩ አሳታፊ ግስ ለጸናው ተስፋ ምክንያት እንደሚሰጥ በግልጽ ያሳያል።
- source_word: ὡς ... οὕτως καί
  choice: እንደ ... ሁሉ፣ ...ም
  rationale: የግሪኩን ተዛማጅ አወቃቀር በተለመደ የአማርኛ ንጽጽር ይጠብቃል።
- source_word: κοινωνοί
  choice: ትካፈላላችሁ / እንደምትካፈሉ
  rationale: በአንድ ነገር ተካፋይ ወይም ተሳታፊ የመሆንን ትርጉም በቀጥታና ተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: παθημάτων
  choice: መከራዎች
  rationale: በዐውደ ንባቡ ያሉትን ሥቃዮችና ጭንቀቶች የሚያካትት ግልጽና የተለመደ አገላለጽ ነው።
- source_word: παρακλήσεως
  choice: መጽናናት
  rationale: በምዕራፉ ውስጥ የተደጋገመውን የመጽናናት ጭብጥ ይጠብቃል፤ ቃሉ ማበረታታትንም ሊያመለክት ስለሚችል አማራጩ በማስታወሻ ቀርቧል።
- source_word: '[elliptical second clause]'
  choice: እንደምትካፈሉ
  rationale: በሁለተኛው ንዑስ አረፍተ ነገር ግሪኩ ግሱን ባይደግምም፣ ለግልጽና ተፈጥሯዊ አማርኛ ከመጀመሪያው ንዑስ አረፍተ ነገር ተወስዶ ተደግሟል።
