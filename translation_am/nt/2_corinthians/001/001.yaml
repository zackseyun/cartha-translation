id: 2CO.1.1
reference: 2 Corinthians 1:1
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ καὶ Τιμόθεος ὁ ἀδελφὸς τῇ ἐκκλησίᾳ τοῦ θεοῦ τῇ οὔσῃ ἐν Κορίνθῳ, σὺν τοῖς ἁγίοις πᾶσιν τοῖς οὖσιν ἐν ὅλῃ τῇ Ἀχαΐᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/001.yaml
  text: 'Paul[a], an apostle of Messiah Jesus by the will of God, and Timothy our brother, to the church of God that is in Corinth[b], together with all the saints who are in all Achaia:'
translation:
  language: am
  text: በእግዚአብሔር ፈቃድ የመሲሑ ኢየሱስ ሐዋርያ የሆነው ጳውሎስ፣ እና ወንድማችን ጢሞቴዎስ፣ በቆሮንቶስ ላለችው የእግዚአብሔር ቤተ ክርስቲያን፣ በመላው አካይያ ካሉት ቅዱሳን ሁሉ ጋር፦
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόστολος
  choice: ሐዋርያ
  rationale: በጳውሎስ የደብዳቤ መግቢያ ውስጥ የተሰጠውን ልዩ ተልእኮና ሥልጣን በትክክል የሚያመለክት የተለመደ የአማርኛ መጽሐፍ ቅዱሳዊ ቃል ነው።
- source_word: Χριστοῦ Ἰησοῦ
  choice: የመሲሑ ኢየሱስ
  rationale: Χριστός እዚህ የቅቡዕነት ማዕረግን እንዲያሳይ «መሲሑ» ተብሎ ተተርጉሟል፤ የግሪኩ የባለቤትነት አወቃቀርም «የመሲሑ ኢየሱስ ሐዋርያ» በሚል ተጠብቋል።
- source_word: διὰ θελήματος θεοῦ
  choice: በእግዚአብሔር ፈቃድ
  rationale: διά ከባለቤት አገባብ ጋር እዚህ የጳውሎስ ሐዋርያነት መሠረትና መንስኤ የእግዚአብሔር ፈቃድ መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὁ ἀδελφὸς
  choice: ወንድማችን
  rationale: ግሪኩ በቀጥታ «ወንድሙ» ቢልም፣ በማኅበረ ምእመናን አውድ ያለውን የጋራ ወንድማማችነት «ወንድማችን» በተፈጥሯዊና ግልጽ ሁኔታ ይገልጣል።
- source_word: ἐκκλησίᾳ
  choice: ቤተ ክርስቲያን
  rationale: በጳውሎስ የሰላምታ አጻጻፍ ለሚጠራው የአማኞች ማኅበር በዘመናዊ መደበኛ አማርኛ የተለመደና ክብር ያለው አቻ ነው።
- source_word: ἁγίοις
  choice: ቅዱሳን
  rationale: በጳውሎስ አጠቃቀም ለእግዚአብሔር የተለዩትን ምእመናን የሚያመለክት አጭርና የተለመደ ቃል ነው።
- source_word: σὺν
  choice: ጋር
  rationale: የቆሮንቶስ ማኅበርን ከመላው አካይያ ቅዱሳን ጋር የሚያካትተውን ግንኙነት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐν ὅλῃ τῇ Ἀχαΐᾳ
  choice: በመላው አካይያ
  rationale: ὅλῃ የሚያሳየውን የክልሉን ሙሉ ስፋት ያስተላልፋል።
theological_decisions:
- issue: በመግቢያው ውስጥ Χριστόςን መተርጎም
  choice: መሲሑ ኢየሱስ
  alternative: ክርስቶስ ኢየሱስ
  rationale: Χριστός እዚህ የማዕረግ ኃይሉን ይዞ ስለሚታይ «መሲሑ» ተመርጧል፤ ይህም የቅቡዕነት ትርጉሙን በግልጽ ያቆያል። በአማርኛ «ክርስቶስ» እንደ ተለመደ ስያሜ ስለሚሠራ አማራጩ ተገንዝቧል፣ ነገር ግን የምንጩን የማዕረግ አጽንዖት በግልጽ ለማሳየት «መሲሑ» ተጠቅሟል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የደብዳቤ መግቢያ አጻጻፍ ተጠቅሟል። የግሪኩ ረጅም የሰላምታ አወቃቀር ተጠብቆ፣ የአማርኛ ቅደም ተከተል ግን ለተፈጥሯዊ ንባብ ተስተካክሏል።
