revisions:
- from: ክርስቶስ የተቀበላቸው መከራዎች[a][b] ወደ እኛ እንደሚትረፈረፉ፣ እንዲሁ ደግሞ በክርስቶስ በኩል መጽናናታችን ይትረፈረፋልና።
  to: ምክንያቱም፣ የክርስቶስ መከራዎች[a][b] ወደ እኛ እንደሚትረፈረፉ፣ እንዲሁም በክርስቶስ አማካኝነት መጽናናታችን ይትረፈረፋል።
  rationale: The revision restores the formally transparent and interpretively open genitive “የክርስቶስ መከራዎች,” rather than asserting that Christ himself endured the sufferings. It retains the Greek comparison, the repeated overflow image, and the causal link, while making the mediated-agency phrase more idiomatic. Footnote a now consistently uses the first-person plural contextual referent and preserves the ambiguity without doctrinal expansion.
