  language: am
  text: ምክንያቱም፣ የክርስቶስ መከራዎች[a][b] ወደ እኛ እንደሚትረፈረፉ፣ እንዲሁም በክርስቶስ አማካኝነት መጽናናታችን ይትረፈረፋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለክርስቶስ ስንል የምንቀበላቸው መከራዎች።” የግሪኩ አገላለጽ የክርስቶስ የሆኑ መከራዎችን ወይም ስለ እርሱ የምንቀበላቸው መከራዎችን ሊያመለክት ይችላል።
    reason: alternative_reading
  - marker: b
    text: “ክርስቶስ” የሚለው ቃል፣ የማዕረግ ትርጉሙ ጎልቶ ሲታይ፣ “መሲሕ” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: -ና (ይትረፈረፋልና)
  rationale: በቀደመው ንግግር ላይ ምክንያት ወይም ማብራሪያ ይጨምራል፤ በአማርኛ የግስ ቅጥያው ይህን ግንኙነት በተፈጥሮ ያሳያል።
- source_word: καθὼς ... οὕτως
  choice: እንደሚ...፣ እንዲሁ ደግሞ
  rationale: የግሪኩን ተዛማጅ ንጽጽር ‘እንደ... እንዲሁ’ በግልጽ የአማርኛ አወቃቀር ያቆያል።
- source_word: περισσεύει
  choice: ይትረፈረፋል
  rationale: የመብዛትንና ከመጠን በላይ የመፍሰስን ምስል ይይዛል፤ በሁለቱም የጥቅሱ ክፍሎች መደገሙም የምንጩን ትይዩነት ያስጠብቃል።
- source_word: τὰ παθήματα
  choice: መከራዎች
  rationale: በዚህ አውድ πάθημα የሚያመለክተውን ሥቃይና መከራ በተለመደና ክቡር አማርኛ ይገልጻል።
- source_word: τοῦ Χριστοῦ
  choice: ክርስቶስ የተቀበላቸው
  rationale: የግሪኩን ባለቤትነታዊ ግንኙነት ከክርስቶስ ጋር አቆይቶ በተፈጥሯዊ አማርኛ ይገልጻል፤ ለክርስቶስ ሲባል የሚደርስ መከራ የሚለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: εἰς ἡμᾶς
  choice: ወደ እኛ
  rationale: የεἰςን አቅጣጫዊ ኃይል በቀጥታ ይጠብቃል፣ መከራዎቹም በጳውሎስና በባልደረቦቹ ላይ እንደሚደርሱ ያሳያል።
- source_word: διὰ τοῦ Χριστοῦ
  choice: በክርስቶስ በኩል
  rationale: διά ከዝርያ ስም ጋር የሚገልጸውን መካከለኛ አማካይነት በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἡ παράκλησις ἡμῶν
  choice: መጽናናታችን
  rationale: በአቅራቢያው አውድ መከራን የሚቃረነውን የመጽናናት ሐሳብ ይይዛል፣ የአንደኛ መደብ ብዙ ባለቤትነትንም በአጭሩ ያሳያል።
