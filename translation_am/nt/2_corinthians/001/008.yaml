  text: ወንድሞች ሆይ፣[a] በእስያ[b] ስለደረሰብን መከራ እንዳታውቁ አንፈልግም፤ እጅግ ከአቅማችን በላይ ተጫንብን፣ ስለዚህም በሕይወት ስለመኖር እንኳ ተስፋ ቆርጠን ነበር።[c]
  philosophy: optimal-equivalence
