id: 2CO.1.2
reference: 2 Corinthians 1:2
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b].
translation:
  language: am
  text: ከአባታችን ከእግዚአብሔርና ከጌታ[b] ከኢየሱስ መሲሕ[a] ጸጋና ሰላም ለእናንተ ይሁን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በተለምዶ፣ “ኢየሱስ ክርስቶስ።”
    reason: lexical_alternative
  - marker: b
    text: “ጌታ” የሚለው ቃል በአንዳንድ አገባቦች “ባለቤት” ወይም “መምህር” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: ጸጋ
  rationale: በጳውሎስ ሰላምታዎች የተለመደውን መጽሐፍ ቅዱሳዊና ሥነ መለኮታዊ ክብደት ይጠብቃል።
- source_word: ὑμῖν
  choice: ለእናንተ
  rationale: የግሪኩን ተቀባይ አመልካች በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: εἰρήνη
  choice: ሰላም
  rationale: የጳውሎስን የሰላምታ ቀመርና ሰፊውን መጽሐፍ ቅዱሳዊ ትርጉም የሚጠብቅ የተለመደ አቻ ነው።
- source_word: ἀπὸ
  choice: ከ…ና ከ…
  rationale: አመጣጡን ወይም ምንጩን ያመለክታል፤ በአማርኛ በሁለቱም ስሞች ፊት ‘ከ’ን መድገም ግንኙነቱን ግልጽ ያደርጋል።
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: ከአባታችን ከእግዚአብሔር
  rationale: ‘አባታችን’ የሚለውን ለ‘እግዚአብሔር’ አብራሪ ሆኖ በተፈጥሯዊና ክብር ባለው አማርኛ ያቀርባል።
- source_word: κυρίου
  choice: ጌታ
  rationale: በዚህ የበረከት ቀመር ለኢየሱስ የተሰጠውን የክብር ማዕረግ በትክክል ይወክላል።
- source_word: Ἰησοῦ Χριστοῦ
  choice: ኢየሱስ መሲሕ
  rationale: ‘ኢየሱስ’ን እንደ ስም፣ Χριστόςን ደግሞ ትርጉሙን የሚያሳይ መሲሓዊ ማዕረግ አድርጎ ያቀርባል።
theological_decisions:
- issue: በጳውሎስ ሰላምታ Χριστοῦን መተርጎም
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: ቃሉን እንደ ማዕረግ መተርጎም መሲሓዊ ትርጉሙን ግልጽ ያደርጋል፤ የተለመደው ቅጽ ግን በማስታወሻ ተጠብቋል።
- issue: κυρίου ለኢየሱስ በሚያመለክትበት ጊዜ
  choice: ጌታ
  alternative: ባለቤት / መምህር
  rationale: ‘ጌታ’ የአዲስ ኪዳንን ክርስቶሳዊ አጠቃቀምና የክብር ደረጃ ከአማርኛ ልማድ ጋር በተሻለ ሁኔታ ይጠብቃል።
- issue: በግሪኩ ያልተገለጸውን ግስ በአማርኛ ማቅረብ
  choice: ይሁን
  alternative: ግስ ሳይጨመር ቃል በቃል ማቅረብ
  rationale: የግሪኩ ሰላምታ ግስ የሌለው ቢሆንም፣ ‘ይሁን’ በአማርኛ የበረከት ምኞቱን በተፈጥሯዊ ሁኔታ ይገልጻል እንጂ አዲስ ሥነ መለኮታዊ ይዘት አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ምንጭ-አመልካች አወቃቀር ተጠብቆ፣ ግስ የሌለው ሰላምታ በአማርኛ ተፈጥሯዊ እንዲሆን ‘ይሁን’ ተጨምሯል።
