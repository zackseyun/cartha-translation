base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/020.yaml
  text: For however many promises of God there are[a], in him is the Yes[c][b]. Therefore also through him is the Amen to God for glory through us.
translation:
  language: am
  text: የእግዚአብሔር ተስፋዎች ምንም ያህል ቢሆኑ፣ በእርሱ “አዎ” አለ።[a] ስለዚህም በእርሱ በኩል “አሜን”[b] ለእግዚአብሔር ክብር በእኛ በኩል ነው።[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም የበለጠ በግልጽ፣ “በእርሱ የራሳቸውን ‘አዎ’ ያገኛሉ።”
    reason: alternative_reading
  - marker: b
    text: “አሜን” ከዕብራይስጥ የተወሰደ የማረጋገጫ ቃል ሲሆን፣ “በእውነት” ወይም “እንዲሁ ይሁን” የሚል ዓይነት ትርጉም አለው።
    reason: cultural_note
  - marker: c
    text: ወይም፣ “በእኛ በኩል ለእግዚአብሔር ክብር።”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅσαι
  choice: ምንም ያህል ቢሆኑ
  rationale: የተስፋዎቹን ቁጥር ሳይወስን ሁሉንም በአንድነት የሚያካትተውን የግሪኩን አገላለጽ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐπαγγελίαι θεοῦ
  choice: የእግዚአብሔር ተስፋዎች
  rationale: ተስፋዎቹ የእግዚአብሔር የራሱ ቃል ኪዳኖች መሆናቸውን ግልጽና መደበኛ በሆነ አገላለጽ ያሳያል።
- source_word: ἐν αὐτῷ τὸ Ναί
  choice: በእርሱ “አዎ” አለ
  rationale: የግሪኩን አጭርና አጽንዖታዊ አገላለጽ ይጠብቃል፤ “ተፈጸሙ” የሚል ትርጓሜያዊ ግስ በዋናው ጽሑፍ ውስጥ አይጨምርም።
- source_word: διὸ καὶ
  choice: ስለዚህም
  rationale: ጳውሎስ ከመጀመሪያው ንግግር የሚያወጣውን ድምዳሜ በአጭርና ተፈጥሯዊ መንገድ ያመለክታል።
- source_word: δι’ αὐτοῦ
  choice: በእርሱ በኩል
  rationale: διά ከዘር አመልካች ጋር ያለውን የአማላጅነት ወይም የመንገድነት ሐሳብ ያስተላልፋል።
- source_word: τὸ Ἀμὴν
  choice: “አሜን”
  rationale: በአማርኛ የእምነት እና የአምልኮ ቋንቋ ውስጥ የተለመደውን የቃሉን ቅርጽና ልዩ ድምፅ ይጠብቃል።
- source_word: τῷ θεῷ
  choice: ለእግዚአብሔር
  rationale: “አሜን” የሚቀርብለትን ተቀባይ የግሪኩን የተሳቢ ቅርጽ በመከተል ያሳያል።
- source_word: πρὸς δόξαν
  choice: ለክብር
  rationale: የሐረጉን ዓላማዊ አቅጣጫ ይጠብቃል፤ ከየትኛው ክፍል ጋር እንደሚያያዝ ከሚገባው በላይ አይወስንም።
- source_word: δι’ ἡμῶν
  choice: በእኛ በኩል
  rationale: የግሪኩን ሰፊ አገላለጽ ይጠብቃል፤ “በአገልግሎታችን” የሚል ያልተጻፈ ማብራሪያ አይጨምርም።
theological_decisions:
- issue: በክርስቶስ ያለውን “አዎ” እንደ ተስፋዎቹ ፍጻሜ በግልጽ ግስ መተርጎም ወይም የጳውሎስን አጭር አገላለጽ መጠበቅ
  choice: “በእርሱ ‘አዎ’ አለ” በማለት የጳውሎስን አጭር አገላለጽ መጠበቅ
  alternative: “በእርሱ ተስፋዎቹ ሁሉ ተፈጽመዋል” ወይም “በእርሱ ‘አዎ’ ሆነዋል”
  rationale: ክፍሉ በክርስቶስ ያለውን ፍጻሜ በጠንካራ ሁኔታ ቢያመለክትም፣ ግሪኩ በቀጥታ “ተፈጸመ” አይልም። ስለዚህ ሥነ መለኮታዊውን ሐሳብ ሳይክድ የጽሑፉን አጽንዖትና ጥቅጥቅነት መጠበቅ ተመርጧል።
- issue: πρὸς δόξαν ከ“ለእግዚአብሔር” ወይም ከ“በእኛ በኩል” ጋር ያለው ሰዋሰዋዊ ትስስር
  choice: “በእኛ በኩል ለክብር” በሚል ቅርጽ የምንጩን ቅደም ተከተልና መጠነኛ አሻሚነት መጠበቅ
  alternative: “በእኛ በኩል ለእግዚአብሔር ክብር” ወይም “እግዚአብሔር እንዲከብር”
  rationale: ዓላማው የእግዚአብሔር ክብር መሆኑ ከአውዱ ግልጽ ቢሆንም፣ የግሪኩ ሐረግ ግንኙነቱን በተስፋፋ አገላለጽ አይወስንም። ዋናው ጽሑፍ ይህን ጥቅጥቅነት ይጠብቃል፣ የበለጠ ግልጽ አማራጭም በማስታወሻ ቀርቧል።
