  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ የሚገባ መደበኛ አማርኛ ተጠቅሟል። “አዎ” እና “አሜን” በጥቅስ ምልክት መቅረባቸው የጳውሎስን ትይዩ አጽንዖት ያሳያል። “በኩል” የሚለው በአንድ ሐረግ ሁለት ጊዜ ቢመጣም፣ δι’ αὐτοῦ እና δι’ ἡμῶν ያላቸውን ትይዩ አወቃቀር ሆን ተብሎ ይጠብቃል።
