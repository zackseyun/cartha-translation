  text: ὃς ἐκ τηλικούτου θανάτου ἐρρύσατο ἡμᾶς καὶ ⸀ῥύσεται, εἰς ὃν ἠλπίκαμεν ὅτι καὶ ἔτι ῥύσεται,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/010.yaml
  text: who rescued us from so great a death and will rescue us[a], in whom we have hoped that he will indeed rescue us again,
translation:
  language: am
  text: እርሱ ከእንዲህ ካለ ታላቅ ሞት[a] ታደገን፤ ወደፊትም ይታደገናል። እርሱ አሁንም እንደሚታደገን በእርሱ ተስፋ አድርገናል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከእንዲህ ካለ ለሞት ከሚያበቃ አደጋ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: τηλικούτου
  choice: እንዲህ ካለ ታላቅ
  rationale: የአደጋውን እጅግ ከፍተኛነት የሚያጎላውን የግሪክ ቃል አጽንዖት በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: θανάτου
  choice: ሞት
  rationale: የግሪኩን ቀጥተኛ ምስል ያቆያል፤ ሐረጉ ለሞት የሚያበቃ አደጋን ሊያመለክት እንደሚችል በግርጌ ማስታወሻ ተገልጿል።
- source_word: ἐρρύσατο
  choice: ታደገን
  rationale: ከከባድ አደጋ ማዳንን በግልጽና በዘመናዊ አማርኛ ይገልጣል።
- source_word: ῥύσεται
  choice: ይታደገናል
  rationale: ከἐρρύσατο ጋር ያለውን የቃል ወጥነት ጠብቆ የወደፊቱን ጊዜ በግልጽ ያሳያል።
- source_word: εἰς ὃν
  choice: በእርሱ
  rationale: የተስፋው ማረፊያ ግለሰብ መሆኑን በተፈጥሯዊ የአማርኛ አገባብ ይገልጣል።
- source_word: ἠλπίκαμεν
  choice: ተስፋ አድርገናል
  rationale: የፍጹም ጊዜውን ከቀድሞ ተጀምሮ እስከአሁን የቀጠለ የተረጋጋ ተስፋ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: καὶ ἔτι
  choice: አሁንም ደግሞ
  rationale: የቀጣይነትንና የድጋሚ መታደግ ጉጉትን ሁለቱንም ያሳያል።
theological_decisions:
- issue: “ሞት” የሚለውን ቃል ቃል በቃል ማቆየት ወይስ “ለሞት የሚያበቃ አደጋ” ብሎ በዋናው ጽሑፍ መተርጎም
  choice: በዋናው ጽሑፍ “ሞት” ተብሎ ተጠብቋል።
  alternative: “ለሞት የሚያበቃ አደጋ” ብሎ ትርጉማዊ አገላለጽ መጠቀም።
  rationale: ግሪኩ θάνατος በቀጥታ “ሞት” ይላል፤ ይህን ምስልና የጳውሎስን አጽንዖት ማቆየት ለምንጩ ቅድሚያ ይሰጣል። ትርጉማዊው አማራጭ ግን በግርጌ ማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። “ታደገን/ይታደገናል” የሚለው የቃል ወጥነት ተጠብቋል፤ የግሪኩ ረዥም አገባብ ግን ለአማርኛ ንባብ ግልጽነት በሦስት አጫጭር ሐረጎች ተደርጓል።
