id: 2CO.1.19
reference: 2 Corinthians 1:19
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ ⸂τοῦ θεοῦ γὰρ⸃ υἱὸς ⸂Ἰησοῦς Χριστὸς⸃ ὁ ἐν ὑμῖν δι’ ἡμῶν κηρυχθείς, δι’ ἐμοῦ καὶ Σιλουανοῦ καὶ Τιμοθέου, οὐκ ἐγένετο Ναὶ καὶ Οὒ, ἀλλὰ Ναὶ ἐν αὐτῷ γέγονεν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/019.yaml
  text: For the Son of God[a], Jesus the Messiah, who was proclaimed among you through us—through me and Silvanus and Timothy—did not become Yes and No; rather[d][c][b], in him it has become Yes.
translation:
  language: am
  text: የእግዚአብሔር ልጅ ኢየሱስ መሲሕ[a]፣ በእኛ አማካይነት—በእኔ፣ በስልዋኖስና በጢሞቴዎስ አማካይነት—በመካከላችሁ የታወጀው፣ “አዎን” እና “አይ” አልሆነም፤ ይልቁንም በእርሱ “አዎን” ሆኗል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ኢየሱስ ክርስቶስ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱὸς τοῦ θεοῦ
  choice: የእግዚአብሔር ልጅ
  rationale: የግሪኩን የማዕረግ አገላለጽ ሙሉ በሙሉ ይጠብቃል፤ በዘመናዊ አማርኛም ተፈጥሯዊ ነው።
- source_word: Ἰησοῦς Χριστός
  choice: ኢየሱስ መሲሕ
  rationale: Χριστός እዚህ ከኢየሱስ ጋር በቋሚ የግል መጠሪያ መልክ ቢቀርብም፣ የቃሉን የቅቡዕነት ማዕረግ ግልጽ ለማድረግ ‘መሲሕ’ ተመርጧል፤ ‘ክርስቶስ’ በማስታወሻ ቀርቧል።
- source_word: κηρυχθείς
  choice: የታወጀው
  rationale: የκηρύσσωን የአዋጅና የሕዝብ ፊት ማስታወቅ ትርጉም ይጠብቃል፤ ‘የተሰበከው’ ደግሞ የተለመደ አማራጭ ነው።
- source_word: δι’ ἡμῶν … δι’ ἐμοῦ καὶ Σιλουανοῦ καὶ Τιμοθέου
  choice: በእኛ አማካይነት—በእኔ፣ በስልዋኖስና በጢሞቴዎስ አማካይነት
  rationale: የδιάን የመሣሪያነት/አማካይነት ግንኙነትና በግሪኩ ያለውን ድግግሞሽ ይጠብቃል።
- source_word: οὐκ ἐγένετο Ναὶ καὶ Οὔ
  choice: “አዎን” እና “አይደለም” አልሆነም
  rationale: የግሪኩን ቃል በቃል ተቃርኖ ሳይፈታ ይጠብቃል፤ ἐγένετοንም ‘አልሆነም’ በማለት ይወክላል።
- source_word: ἀλλὰ Ναὶ ἐν αὐτῷ γέγονεν
  choice: ይልቁንም በእርሱ “አዎን” ሆኗል
  rationale: ἐν αὐτῷን ሳይተረጉም እንዳለ ያቆያል፤ የγέγονενን የተፈጸመና ውጤቱ የቀጠለ ሁኔታ ‘ሆኗል’ ያንጸባርቃል።
theological_decisions:
- issue: Χριστόςን እንደ ማዕረግ ወይስ እንደ ስም አካል መተርጎም
  choice: ኢየሱስ መሲሕ
  alternative: ኢየሱስ ክርስቶስ
  rationale: ‘መሲሕ’ የΧριστόςን ማዕረጋዊ ኃይል ይገልጣል፤ በአማርኛ የተለመደው ‘ክርስቶስ’ ግን ስም መሰል አጠቃቀሙን ስለሚወክል በማስታወሻ ተጠብቋል።
- issue: Ναί/Οὔን በትርጓሜ መፍታት ወይስ የጳውሎስን አገላለጽ ማቆየት
  choice: “አዎን” እና “አይደለም” … “አዎን”
  alternative: ወላዋይ አልሆነም፤ ታማኝ ነው
  rationale: ዋናው ጽሑፍ የጳውሎስን ሥነ ንግግራዊ ውጥረት ይጠብቃል፤ ‘ወላዋይ’ ወይም ‘ታማኝ’ ብሎ በመፍታት ትርጓሜን በጽሑፉ ላይ አይጭንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የአማካይነት መዋቅርና ‘አዎን/አይደለም’ የሚለው የሥነ ንግግር ውጥረት ተጠብቀዋል።
