- source_word: ἐπιγινώσκετε
  choice: ምትረዱት
  rationale: በዚህ አውድ ከማንበብ ባለፈ የጽሑፉን ሐሳብ መገንዘብን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐπιγνώσεσθε
  choice: እንደምትረዱት
  rationale: የቀደመውን ግስ ድግግሞሽና የወደፊት ጊዜ ኃይል ይጠብቃል፤ የሙላት ሐሳቡም በἕως τέλους ይገለጣል።
- source_word: ἕως τέλους
  choice: እስከ መጨረሻ
  rationale: የግሪኩን ጊዜያዊ ወይም የሙላት አሻሚነት ሳይወስን በቀጥታ ይጠብቃል።
- source_word: οὐ γὰρ ... ἀλλ’ ἢ
  choice: ከ...በቀር ሌላ ነገር አይደለም
