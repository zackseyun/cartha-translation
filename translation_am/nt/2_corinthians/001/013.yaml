lexical_decisions:
- source_word: ἄλλα
  choice: ሌላ ነገር
  rationale: በተከለከለ አገባብ ውስጥ ያለውን ገለልተኛ ብዙ ቁጥር በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἀναγινώσκετε
