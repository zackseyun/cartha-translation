  to: በእናንተም በኩል አልፌ ወደ መቄዶንያ ልሄድ፣ እንደገናም ከመቄዶንያ ወደ እናንተ ልመጣና በእናንተ ተሸኝቼ ወደ ይሁዳ ልሄድ አስቤ ነበር።
