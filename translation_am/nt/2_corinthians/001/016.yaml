  text: καὶ δι’ ὑμῶν διελθεῖν εἰς Μακεδονίαν, καὶ πάλιν ἀπὸ Μακεδονίας ἐλθεῖν πρὸς ὑμᾶς καὶ ὑφ’ ὑμῶν προπεμφθῆναι εἰς τὴν Ἰουδαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/016.yaml
  text: and through you to pass into Macedonia[a], and again from Macedonia to come to you and by you to be sent on to Judea.
translation:
  language: am
  text: በእናንተም በኩል አልፌ ወደ መቄዶንያ ልሄድ፣ እንደገናም ከመቄዶንያ ወደ እናንተ ልመጣና በእናንተ ተሸኝቼ ወደ ይሁዳ ልሄድ አስቤ ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δι’ ὑμῶν διελθεῖν
  choice: በእናንተም በኩል አልፌ … ልሄድ
  rationale: διά ከዘር ቅጽ ጋር የጉዞውን መስመር፣ διελθεῖν ደግሞ አልፎ መጓዝን ያመለክታሉ፤ ይህ አገላለጽ ሁለቱንም በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: εἰς Μακεδονίαν
  choice: ወደ መቄዶንያ
  rationale: εἰς የመድረሻ አቅጣጫን ያሳያል፤ «ወደ» በአማርኛ የተፈጥሮ የጉዞ አገላለጽ ነው።
- source_word: πάλιν ἀπὸ Μακεδονίας ἐλθεῖν πρὸς ὑμᾶς
  choice: እንደገናም ከመቄዶንያ ወደ እናንተ ልመጣ
  rationale: πάλιν የድጋሚ እንቅስቃሴን፣ ἀπό መነሻን፣ πρὸς ὑμᾶς ደግሞ ወደ ተቀባዮቹ መምጣትን ያሳያሉ። «ተመልሼ» የሚለው ትርጉም በዐውዱ ቢኖርም በግሪኩ በግልጽ ስላልተጻፈ አልተጨመረም።
- source_word: ὑφ’ ὑμῶν προπεμφθῆναι
  choice: በእናንተ እርዳታ … ልሸኝ
  rationale: προπέμπω በጉዞ ዐውድ ተጓዥን ለቀጣዩ መንገድ በማሰናዳትና በመርዳት መሸኘትን ብዙ ጊዜ ያመለክታል። ὑφ’ ὑμῶν የቆሮንቶስ ሰዎችን የድርጊቱ ፈጻሚዎች አድርጎ ያቀርባል።
- source_word: εἰς τὴν Ἰουδαίαν
  choice: ወደ ይሁዳ
  rationale: የመድረሻውን አቅጣጫ በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
