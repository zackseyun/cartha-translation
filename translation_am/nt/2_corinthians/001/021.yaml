id: 2CO.1.21
reference: 2 Corinthians 1:21
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ δὲ βεβαιῶν ἡμᾶς σὺν ὑμῖν εἰς Χριστὸν καὶ χρίσας ἡμᾶς θεός,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/021.yaml
  text: But the one who establishes us with you in Messiah[a], and who anointed us, is God.
translation:
  language: am
  text: ነገር ግን ከእናንተ ጋር በመሲሑ[a] የሚያጸናንና የቀባን እግዚአብሔር ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በክርስቶስ።” የግሪኩ ማዕረግ Χριστός (ክሪስቶስ) ሲሆን፣ እዚህ “መሲሕ” ተብሎ ተተርጉሟል።
    reason: alternative_reading
lexical_decisions:
- source_word: βεβαιῶν
  choice: የሚያጸናን
  rationale: ግሱ ጽኑ ወይም የተረጋጋ ማድረግን ያመለክታል፤ የአሁን ጊዜውን ቀጣይ ባሕርይም «የሚያጸናን» በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: σὺν ὑμῖν
  choice: ከእናንተ ጋር
  rationale: ጳውሎስንና ተቀባዮቹን በአንድነት የሚያካትተውን የጋራ ተሳትፎ በግልጽ ያሳያል።
- source_word: εἰς Χριστόν
  choice: በመሲሑ
  rationale: εἰς ቃል በቃል «ወደ» ሊባል ቢችልም፣ እዚህ ከመሲሑ ጋር ያለውን ግንኙነትና አንድነት ያመለክታል፤ «በመሲሑ» ይህን ትርጉም በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: χρίσας
  choice: የቀባን
  rationale: የχρίωን መሠረታዊ የመቀባት ትርጉምና ከመሲሕነት ቋንቋ ጋር ያለውን ቃላዊ ግንኙነት ይጠብቃል።
- source_word: θεός
  choice: እግዚአብሔር
  rationale: በመደበኛ የአማርኛ መጽሐፍ ቅዱስ አጠቃቀም θεόςን በክብርና በተፈጥሯዊነት ይወክላል፤ በአረፍተ ነገሩ መጨረሻ «ነው» ጋር መቅረቡ የግሪኩን አጽንዖት ይጠብቃል።
- source_word: Χριστόν
  choice: መሲሑ
  rationale: Χριστός እዚህ የቅቡዕነት ማዕረግ ስለሆነ «መሲሑ» የዕብራዊውን የማዕረግ ሐሳብ ይጠብቃል፤ የተለመደው «ክርስቶስ» በማስታወሻው ቀርቧል።
theological_decisions:
- issue: በεἰς Χριστόν ውስጥ ያለው የεἰς ኃይል
  choice: ግንኙነትንና በመሲሑ ውስጥ መካተትን የሚገልጽ «በመሲሑ»
  alternative: ይበልጥ ቃል በቃል «ወደ መሲሑ»
  rationale: ግሪኩ «ወደ» የሚለውን አቅጣጫዊ ንባብ ሊፈቅድ ቢችልም፣ በጳውሎስ አጠቃቀም እዚህ ዋናው ሐሳብ ከመሲሑ ጋር በተያያዘ መጽናት ነው። «በ» ተፈጥሯዊ ሲሆን የግንኙነቱን ምሥጢር ከሚገባው በላይ አይገድብም።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለመደበኛ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩን የአረፍተ ነገር አጽንዖት ለመጠበቅ «እግዚአብሔር ነው» በመጨረሻ ቀርቧል።
