  text: just as you also came to understand us in part[a], that we are your boast, just as you also are ours[b], in the day of our Lord Jesus.
translation:
  language: am
  text: 'እናንተም እኛን በከፊል[a] እንደተረዳችሁ ሁሉ፣ በጌታችን ኢየሱስ ቀን እኛ የእናንተ መመኪያ እንደሆንን፣ እናንተም የእኛ መመኪያ[b] እንደሆናችሁ ተረድታችኋል።


    [a] ወይም፣ “በከፊል ብቻ” ወይም “በተወሰነ መጠን።”


    [b] ወይም፣ “የምንመካባችሁ ምክንያት።”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በከፊል ብቻ” ወይም “በተወሰነ መጠን።”
    reason: lexical_alternative
  - marker: b
