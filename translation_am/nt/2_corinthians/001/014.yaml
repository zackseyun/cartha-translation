  rationale: የግንዛቤውን ከፊላዊነት በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል፤ መጠኑንም ሳይወስን ይተዋል።
- source_word: καύχημα
  choice: መመኪያ
  rationale: የጳውሎስን የመመካት ቃላዊ ምስልና የሁለቱን ወገኖች የተመላላሽ ደስታ ይጠብቃል፤ በዐውዱ ውስጥ ራስን ከፍ ማድረግን ብቻ አያመለክትም።
- source_word: καθάπερ
  choice: እንዲሁ
  rationale: ጳውሎስና ማኅበሩ እርስ በርሳቸው መመኪያ መሆናቸውን የሚያሳየውን ግልጽ ንጽጽር ይጠብቃል።
- source_word: ἡμέρᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: በጌታችን በኢየሱስ ቀን
  rationale: የመጨረሻውን ዘመን የሚመለከተውን የተለመደ አገላለጽ እና κύριος የሚለውን ክርስቶሳዊ ማዕረግ ‘ጌታ’ ብሎ ይጠብቃል።
- source_word: καθὼς καὶ
  choice: እናንተም … እንደ
  rationale: ከቀደመው ሐሳብ ጋር ያለውን ንጽጽራዊ ትስስርና καί የሚያመለክተውን ‘ደግሞ’ ሐሳብ በተፈጥሯዊ የአማርኛ አገባብ ያስቀምጣል።
