base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], the Father of mercies and God of all comfort[d][c][b],
translation:
  language: am
  text: የጌታችን[b] የኢየሱስ መሲሕ[a] አምላክና አባት፣ የምሕረቶች[c] አባትና የመጽናናት[d] ሁሉ አምላክ የተባረከ ይሁን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ኢየሱስ ክርስቶስ።”
    reason: alternative_reading
  - marker: b
    text: “ጌታ” የሚለው “ባለቤት” ወይም “ገዥ” የሚለውንም ትርጉም ሊይዝ ይችላል።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “ርኅራኄዎች።”
    reason: lexical_alternative
  - marker: d
    text: ወይም፣ “ማበረታቻ” ወይም “ማጽናኛ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: የተባረከ ይሁን
  rationale: በግሪክኛው ያለውን የምስጋና አዋጅ ቅርጽና የቅጽሉን ኃይል ይጠብቃል፤ በአማርኛም ክቡርና የተለመደ የአምልኮ አገላለጽ ነው።
- source_word: θεὸς καὶ πατὴρ
  choice: አምላክና አባት
  rationale: አንዱ መስተዋድድ ሁለቱን ስሞች ለአንድ ተጠቃሽ እንደሚያስተሳስር ያሳያል።
- source_word: κυρίου
  choice: ጌታ
  rationale: የκύριοςን ክርስቶሳዊ አጠቃቀም በተፈጥሯዊና በታወቀ አማርኛ ያስተላልፋል።
- source_word: Χριστοῦ
  choice: መሲሕ
  rationale: Χριστός እዚህ የቅቡዕነት ማዕረግን እንዲታይ በትርጉሙ ‘መሲሕ’ ተብሏል፤ የተለመደው ቅጽ ‘ክርስቶስ’ በማስታወሻ ቀርቧል።
- source_word: οἰκτιρμῶν
  choice: ምሕረቶች
  rationale: የግሪክኛውን ብዙ ቁጥር ይጠብቃል፤ የአምላክን ብዙ ዓይነትና የተትረፈረፈ ርኅራኄ ያመለክታል።
- source_word: παρακλήσεως
  choice: መጽናናት
  rationale: በመከራ ውስጥ የሚሰጠውን ማጽናኛ፣ ድጋፍና ማበረታቻ በዐውዱ በተፈጥሯዊ ሁኔታ ያስተላልፋል።
theological_decisions:
- issue: በἸησοῦ Χριστοῦ ውስጥ ያለውን Χριστός መተርጎም
  choice: ኢየሱስ መሲሕ
  alternative: ኢየሱስ ክርስቶስ
  rationale: ‘መሲሕ’ የቃሉን የማዕረግ ትርጉም ግልጽ ያደርጋል፤ ‘ክርስቶስ’ ግን በአማርኛ የተለመደ የተዋሐደ ስም־ማዕረግ ቅርጽ ስለሆነ እንደ አማራጭ ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለሕዝብ ንባብ ተስማሚ የሆነ መደበኛ አማርኛን ይጠቀማል። የግሪክኛው ረዥም የምስጋና ሐረግ በአንድ ዓረፍተ ነገር ተጠብቋል፤ ‘ምሕረቶች’ የሚለውም የምንጩን ብዙ ቁጥር ያንጸባርቃል።
