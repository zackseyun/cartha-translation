  text: Καὶ ταύτῃ τῇ πεποιθήσει ἐβουλόμην ⸂πρότερον πρὸς ὑμᾶς ἐλθεῖν⸃, ἵνα δευτέραν ⸀χάριν ⸀σχῆτε,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/015.yaml
  text: And with this confidence I intended to come to you first[a], so that you might have a second benefit[b],
translation:
  language: am
  text: በዚህ መተማመን፣ መጀመሪያ[a] ወደ እናንተ ልመጣ ፈልጌ ነበር፤ ይህም ሁለተኛ ጥቅም እንድታገኙ[b] ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «አስቀድሜ»።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «ሁለተኛ ጸጋ እንዲኖራችሁ» ወይም «ሁለተኛ በጎ ውለታ እንድታገኙ»።
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθήσει
  choice: እርግጠኝነት
  rationale: ቃሉ ጽኑ መተማመንን ወይም እርግጠኝነትን ያመለክታል፤ «እርግጠኝነት» በዘመናዊ አማርኛ ግልጽና በዐውዱ ተስማሚ ነው።
- source_word: ἐβουλόμην
  choice: አስቤ ነበር
  rationale: የፈቃድንና የዓላማን ሐሳብ ይገልጣል፤ ይህ አተረጓጎም እንደ የማይለወጥ መደበኛ ዕቅድ ሳያጠነክረው የጳውሎስን የቀድሞ ሐሳብ ያሳያል።
- source_word: πρότερον πρὸς ὑμᾶς ἐλθεῖν
  choice: መጀመሪያ ወደ እናንተ ልመጣ
  rationale: πρότερον የጉዞውን ቅደም ተከተል («መጀመሪያ») ወይም ቀደም ያለ ጊዜን («አስቀድሜ») ሊያመለክት ይችላል፤ ቀጣዩ ቁጥር የጉዞ ቅደም ተከተልን ስለሚያብራራ «መጀመሪያ» በዋናው ጽሑፍ ተመርጧል።
- source_word: δευτέραν χάριν
  choice: ሁለተኛ በረከት
  rationale: χάρις በዚህ ዐውድ ከጳውሎስ ጉብኝት የሚገኝን በጎ ነገር፣ ጥቅም ወይም ጸጋ ያመለክታል። «በረከት» አዎንታዊውን ሃይማኖታዊ ድምፀት ሳያጠፋ በዐውዱ ውስጥ ተፈጥሯዊ ነው።
- source_word: σχῆτε
  choice: እንድታገኙ
  rationale: ἔχω እዚህ «ማግኘት» ወይም «መቀበል» በሚል ፈሊጣዊ ትርጉም ገብቷል፤ «እንድታገኙ» በአማርኛ ተፈጥሯዊ ነው።
theological_decisions:
- issue: χάρις እዚህ የማዳን ጸጋን ወይስ ከጉብኝቱ የሚገኝን በጎ ነገር ያመለክታል?
  choice: በረከት
  alternative: ጸጋ፤ ጥቅም
  rationale: የጉዞው ዐውድ ከጉብኝቱ የሚገኝ በጎ ነገርን ያመለክታል፤ «በረከት» ግን የχάριςን ሰፊ አዎንታዊ ትርጉም በሙሉ ወደ ተራ «ጥቅም» አያጠብበውም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና በቀላሉ የሚገባ የአማርኛ አጻጻፍ ተጠቅሟል። የግሪኩ ዓረፍተ ነገር አቀራረብ በአማርኛ ተፈጥሯዊ እንዲሆን የዓላማው ሐረግ ከዋናው ግስ በፊት ቀርቧል፤ የπρότερον እና χάρις አማራጭ ትርጉሞች በማስታወሻ ተጠብቀዋል።
