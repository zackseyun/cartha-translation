  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የሁለትዮሽ አወቃቀር «ትርፍ/እጥረት» በሚለው ትይዩ አገላለጽ ተጠብቋል። በቀረበው የእንግሊዝኛ ንባብ የማስታወሻው ምልክት ከ«present time» በኋላ ቢታይም፣ የማስታወሻው ይዘት በግልጽ ሁኔታ ἰσότηςን ስለሚመለከት ምልክቱ ከ«እኩልነት» በኋላ ተቀምጧል።
