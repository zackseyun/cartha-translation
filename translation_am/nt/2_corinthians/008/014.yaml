base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/014.yaml
  text: At the present time[a], your abundance is for their need, so that their abundance may also be for your need, in order that there may be equality.
translation:
  language: am
  text: በአሁኑ ጊዜ ያላችሁ ትርፍ የእነርሱን እጥረት ለማሟላት፣ የእነርሱም ትርፍ የእናንተን እጥረት እንዲያሟላ፣ እኩልነት[a] እንዲኖር ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ፍትሐዊነት” ወይም “ሚዛናዊነት።” እዚህ ላይ የግሪኩ ቃል ሀብት ለሁሉም ፍጹም እኩል መሆኑን ሳይሆን፣ እርስ በርስ እጥረትን በሚዛናዊነት ማሟላትን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ νῦν καιρῷ
  choice: በአሁኑ ጊዜ
  rationale: καιρός እዚህ አሁን ያለውን ሁኔታዊ ጊዜ ያመለክታል፤ ይህ አተረጓጎም በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: τὸ ὑμῶν περίσσευμα
  choice: ያላችሁ ትርፍ
  rationale: περίσσευμα ከራስ ፍላጎት በላይ ያለውን ቁሳዊ በቂነት ያመለክታል፤ «ትርፍ» ገንዘብን ብቻ ሳይወስን ይህን ሐሳብ ያስተላልፋል።
- source_word: εἰς τὸ ἐκείνων ὑστέρημα
  choice: የእነርሱን እጥረት ይሙላ
  rationale: εἰς ከὑστέρημα ጋር ሲመጣ ትርፉ ወደ እጥረታቸው መሟላት የሚያመራውን ዓላማ ያሳያል፤ ይህ አገላለጽ በአማርኛ ተፈጥሯዊ ነው።
- source_word: ἵνα καὶ
  choice: የእነርሱም ... እንዲሞላ
  rationale: ἵνα ዓላማን፣ καί ደግሞ የሁለትዮሽ መረዳዳትን ያሳያሉ፤ «-ም» እና «እንዲ-» ሁለቱንም ይጠብቃሉ።
- source_word: τὸ ἐκείνων περίσσευμα
  choice: የእነርሱም ትርፍ
  rationale: የግሪኩን ተመጣጣኝ ድግግሞሽና የተ reciprocal አወቃቀር ለመጠበቅ περίσσευμα እንደ መጀመሪያው «ትርፍ» ተብሎ ተተርጉሟል።
- source_word: γένηται εἰς τὸ ὑμῶν ὑστέρημα
  choice: የእናንተን እጥረት እንዲሞላ
  rationale: የዓላማ ንዑስ አረፍተ ነገሩን እና በግሪኩ ያለውን ተደጋጋሚ መዋቅር በግልጽ አማርኛ ይጠብቃል።
- source_word: ὅπως γένηται ἰσότης
  choice: በዚህም እኩልነት እንዲኖር
  rationale: ἰσότης ቀጥተኛ ትርጉሙ «እኩልነት» ነው፤ አውዱ ግን የንብረት ፍጹም ተመሳሳይነትን ሳይሆን እጥረትን በጋራ ማሟላትን ያመለክታል።
theological_decisions:
- issue: በጳውሎስ የልግስና ጥሪ ውስጥ የἰσότης ትርጉም
  choice: በሁለትዮሽ አቅርቦት የሚገኝ እኩልነት
  alternative: ፍትሐዊነት ወይም ሚዛናዊነት
  rationale: አውዱ አማኞች እርስ በርሳቸው እጥረታቸውን ስለማሟላት እንጂ ሁሉም ፍጹም ተመሳሳይ ንብረት ስለሚኖራቸው አይናገርም፤ ቀጥተኛው ቃል በዋናው ጽሑፍ ተጠብቆ የአውዱ ልዩነት በማስታወሻ ተገልጿል።
