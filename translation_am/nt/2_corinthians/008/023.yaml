  text: As for Titus[a], he is my partner and fellow worker for you; as for our brothers, they are messengers of the churches[b], the glory of Messiah.
translation:
  language: am
  text: ቲቶን በተመለከተ፣ እርሱ ባልደረባዬና ለእናንተ አብሮኝ የሚሠራ ነው፤ ወንድሞቻችንንም በተመለከተ፣ እነርሱ የአብያተ ክርስቲያናት መልእክተኞች[a]፣ የመሲሑ ክብር[b] ናቸው።
  philosophy: optimal-equivalence
