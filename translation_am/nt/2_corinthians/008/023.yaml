  choice: ቲቶን በተመለከተ
  rationale: የግሪኩ አገላለጽ ግስ የተተወበትና ሁለት ትይዩ ጉዳዮችን የሚያስተዋውቅ ነው፤ ይህ አተረጓጎም የ‘ስለ/በተመለከተ’ ትርጉሙን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: κοινωνὸς ἐμὸς
  choice: ባልደረባዬ
  rationale: κοινωνός ከሌላው ጋር ተካፋይነትንና አጋርነትን ያመለክታል፤ ‘ባልደረባዬ’ የግንኙነቱንና የአገልግሎት አጋርነቱን በግልጽ ያሳያል።
- source_word: εἰς ὑμᾶς συνεργός
  choice: ለእናንተ አብሮኝ የሚሠራ
  rationale: συνεργός አብሮ የሚሠራን ሰው ያመለክታል፤ εἰς ὑμᾶς ደግሞ ሥራው ወደ ቆሮንቶስ ሰዎች ያተኮረ መሆኑን ያሳያል። ‘ለእናንተ’ የ‘ለጥቅማችሁ’ የሚለውን ተጨማሪ ትርጓሜ ሳያስገባ ቅርብ ሆኖ ይተረጉማል።
- source_word: ἀδελφοὶ ἡμῶν
