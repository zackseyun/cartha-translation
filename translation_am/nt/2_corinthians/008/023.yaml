- source_word: ἀπόστολοι ἐκκλησιῶν
  choice: የቤተ ክርስቲያናት መልእክተኞች
  rationale: ἀπόστολοι በሰፊ ትርጉሙ የተላኩ መልእክተኞችን ወይም ወኪሎችን ሊያመለክት ይችላል። አውዱ በጉባኤዎች የተላኩ ወኪሎችን ስለሚመለከት፣ ይህ ምርጫ የተለየ ሥልጣናዊ ማዕረግ ሳያስገባ ትርጉሙን ያስተላልፋል።
- source_word: δόξα Χριστοῦ
  choice: የመሲሑ ክብር
  rationale: ይህ ግስ የሌለው የገላጭ ስም ሐረግ ነው። ቀጥተኛው የባለቤትነት አወቃቀር ሰዎቹ የመሲሑን ክብር የሚገልጡ መሆናቸውን ያሳያል፤ Χριστόςም እዚህ እንደ ማዕረግ ‘መሲሕ’ ተብሎ ተተርጉሟል።
theological_decisions:
- issue: ἀπόστολοι ለስማቸው ያልተጠቀሰው ወንድሞች የሚሰጠው ትርጉም
  choice: ሥልጣናዊ ማዕረግ ያልሆነው ‘የቤተ ክርስቲያናት መልእክተኞች/ወኪሎች’
  alternative: ‘የቤተ ክርስቲያናት ሐዋርያት’
  rationale: ጳውሎስ በዚህ አውድ ከስጦታው ስብስብ ጋር የተያያዙ የጉባኤዎችን ወኪሎች ያስተዋውቃል። ‘የቤተ ክርስቲያናት’ የሚለውም ከጉባኤዎቹ የተላኩ መሆናቸውን ይደግፋል፤ ጽሑፉ የግድ የማይናገረውን ልዩ ሐዋርያዊ ማዕረግ አይጨምርም።
- issue: Χριστοῦ እንደ ማዕረግ ወይም እንደ ስም መቅረቡ
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: Χριστός በዚህ ስፍራ የተቀባውን የሚያመለክት ማዕረግ ሆኖ ይሠራል፤ ‘መሲሕ’ የማዕረጉን ትርጉም በግልጽ ያቀርባል።
- issue: δόξα Χριστοῦ የሚለው ሐረግ ግንኙነት
  choice: ‘የመሲሑ ክብር’ በሚል ቀጥተኛና አሻሚነቱን የሚጠብቅ አተረጓጎም
  alternative: ‘ለመሲሑ ክብር የሆኑ’
  rationale: የግሪኩ ሐረግ ግስ የሌለውና በዘር ሐረግ የተገለጸ በመሆኑ፣ ሰዎቹ የመሲሑን ክብር የሚያንጸባርቁ ወይም ለእርሱ ክብር የሚያመጡ መሆናቸውን ሊያመለክት ይችላል። ቀጥተኛው አተረጓጎም ይህን ጥቃቅን አሻሚነት ይጠብቃል።
