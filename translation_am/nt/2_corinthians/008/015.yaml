base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/015.yaml
  text: 'as it is written: The one who had much did not have too much[a], and the one who had little did not have too little.'
translation:
  language: am
  text: እንዲህ ተጽፎአል፦ “ብዙ የነበረው ትርፍ አልነበረውም፤ ጥቂት የነበረውም እጥረት አልነበረበትም።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ዘፀአት 16፥18ን ይበልጥ ቃል በቃል በመከተል፦ “ብዙ የሰበሰበው ትርፍ አልነበረውም፤ ጥቂት የሰበሰበውም እጥረት አልነበረበትም።”
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: እንዲህ ተብሎ እንደተጻፈ
  rationale: የግሪኩ ፍጹም ጊዜ ጽሑፉ እንደ ቋሚ ምስክር መኖሩን ያሳያል፤ ይህም በአማርኛ የተለመደውን የቅዱስ መጽሐፍ ጥቅስ መግቢያ ይጠብቃል።
- source_word: Ὁ τὸ πολὺ
  choice: ብዙ የነበረው
  rationale: ግሪኩ የመሰብሰብን ግስ በግልጽ አይደግምም። ስለዚህ የብዛት ሁኔታን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐπλεόνασεν
  choice: አልተረፈውም
  rationale: በዚህ ዐውድ ከሚያስፈልገው በላይ ትርፍ አለመኖሩን ያሳያል፤ ከተቃራኒው አገላለጽ ጋርም ተመጣጣኝ ነው።
- source_word: ὁ τὸ ὀλίγον
  choice: ጥቂት የነበረው
  rationale: ከመጀመሪያው ሐረግ ጋር ያለውን ትይዩነት ይጠብቃል፤ በጳውሎስ ጥቅስ ውስጥ ያልተገለጸውን ‘ሰበሰበ’ የሚለውን ግስ አያስገባም።
- source_word: ἠλαττόνησεν
  choice: አልጎደለበትም
  rationale: እጥረት ወይም ከሚያስፈልገው በታች መሆንን በተፈጥሯዊና ግልጽ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: ጳውሎስ የዘፀአት 16፥18ን በልግስናና በእኩልነት ዐውድ መጥቀሱ
  choice: ቃሉን በመጨረሻው የአቅርቦት ውጤት—ትርፍና እጥረት አለመኖር—አንጻር መተርጎም
  alternative: “ብዙ የሰበሰበው ትርፍ አልነበረውም፤ ጥቂት የሰበሰበውም አልጎደለበትም”
  rationale: ጳውሎስ የመናውን ታሪካዊ ዐውድ ይጠቅሳል፤ ነገር ግን በግሪክ ጥቅሱ ውስጥ ‘ሰበሰበ’ የሚለውን ግስ አይደግምም። ዋናው ትርጉም ማንም ትርፍ ወይም እጥረት እንዳይኖረው የሚያሳየው ተመጣጣኝ አቅርቦት ነው።
