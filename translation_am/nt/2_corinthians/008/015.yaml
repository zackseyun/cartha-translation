  to: እንዲህ ተጽፎአል፦ “ብዙ የነበረው ትርፍ አልነበረውም፤ ጥቂት የነበረውም እጥረት አልነበረበትም።”[a]
  rationale: The revised text preserves Paul’s wording as a citation about the resulting distribution of provision, without importing the Exodus verb “gathered” into the main translation. It improves the Scripture-citation formula and makes the paired concepts of surplus and lack explicit in natural Amharic. The footnote supplies the Exodus-shaped alternative while maintaining the same meaning.
