language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἰς τὸ παρακαλέσαι ἡμᾶς Τίτον ἵνα καθὼς προενήρξατο οὕτως καὶ ἐπιτελέσῃ εἰς ὑμᾶς καὶ τὴν χάριν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/006.yaml
  text: So we urged Titus that[a], just as he had previously begun, he should also complete among you this act of grace.
translation:
  language: am
  text: ስለዚህ፣ ቲቶን አስቀድሞ እንደጀመረው፣ እንዲሁም ይህን የጸጋ ተግባር[a] በመካከላችሁ እንዲያጠናቅቅ አጥብቀን ጠየቅነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ይህን በጸጋ የተሞላ ሥራ”፤ ቃል በቃል፣ “ይህን ጸጋ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλέσαι
  choice: አጥብቀን ጠየቅነው
  rationale: ቃሉ ቲቶ ተግባሩን እንዲያከናውን በጽኑ መጠየቅን ያመለክታል፤ ይህ አተረጓጎም ‘አበረታታነው’ ከሚለው ይበልጥ የአውዱን ኃይል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Τίτον
  choice: ቲቶን
  rationale: የግሪክኛው የግል ስም በተለመደው የአማርኛ አጻጻፍ ‘ቲቶ’ ተብሎ ተጽፎ፣ የቀጥታ ተሳቢነቱን ለማሳየት -ን ተጨምሮበታል።
- source_word: καθὼς προενήρξατο
  choice: አስቀድሞ እንደጀመረው
  rationale: προενήρξατο ቀደም ብሎ መጀመሩን ያመለክታል፤ ‘አስቀድሞ’ የግሪክኛውን ጊዜያዊ ልዩነት በግልጽ ሁኔታ ያቆያል።
- source_word: ἐπιτελέσῃ
  choice: እንዲፈጽም
  rationale: ግሱ የተጀመረውን ሥራ ወደ ፍጻሜ ማድረስን ያመለክታል፤ ἵνα የዓላማውን ሐረግ ስለሚያስገባ ‘እንዲፈጽም’ ተብሏል።
- source_word: εἰς ὑμᾶς
  choice: በመካከላችሁ
  rationale: በዚህ አውድ ተግባሩ በቆሮንቶስ ማኅበረሰብ ውስጥ እንደሚፈጸም ያመለክታል፤ ‘በመካከላችሁ’ ይህን አቅጣጫዊና ማኅበረሰባዊ ስሜት ያሳያል።
- source_word: καὶ τὴν χάριν ταύτην
  choice: ይህንም የጸጋ ተግባር
  rationale: καί የተጨማሪነት ስሜቱን ‘-ም’ ያሳያል፤ χάρις በአውዱ ለቅዱሳን የሚደረገውን ተጨባጭ የልግስና አገልግሎት ሲያመለክት፣ ‘የጸጋ ተግባር’ የጸጋን ቃላዊ ክብደትና የተግባሩን ተጨባጭነት አብሮ ይጠብቃል።
theological_decisions:
- issue: በስጦታው አውድ የχάρις ትርጉም
  choice: ‘የጸጋ ተግባር’—ለቅዱሳን የሚደረገውን ልገሳና አገልግሎት የሚያመለክት
  alternative: ‘ጸጋ’ ብቻ ወይም ‘ስጦታ’
  rationale: የ2 ቆሮንቶስ 8 አቅራቢያ ስለ ቅዱሳን መዋጮና ቲቶ ሥራውን ስለማጠናቀቁ ይናገራል። ‘የጸጋ ተግባር’ መዋጮው ተጨባጭ ተግባር መሆኑን ሳያጠፋ፣ ጳውሎስ በጸጋ ቋንቋ የሰጠውን መንፈሳዊ አቀራረብ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘አጥብቀን ጠየቅነው’ የπαρακαλέωን ኃይል በተፈጥሯዊ ንግግር ያቀርባል፤ ‘የጸጋ ተግባር’ ደግሞ ሆን ብሎ የቃሉን ሥነ መለኮታዊና ተግባራዊ ጫና አብሮ ይይዛል።
