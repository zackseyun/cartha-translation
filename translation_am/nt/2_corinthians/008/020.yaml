lexical_decisions:
- source_word: στελλόμενοι τοῦτο
  choice: ቅድመ ጥንቃቄ ለማድረግ
  rationale: መካከለኛው አሳታፊ ቅርጽ ሊነሣ የሚችልን ነቀፋ ለማስቀረት አስቀድሞ እርምጃ መውሰድን ያመለክታል፤ ይህ አገላለጽ የመከላከልን ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: μή τις ἡμᾶς μωμήσηται
  choice: ማንም እንዳይወቅሰን
  rationale: μή ከንዑስ አንቀጽ ጋር የመከላከል ዓላማን ያሳያል፤ μωμάομαι ደግሞ መውቀስን ወይም ነቀፋ ማቅረብን ይገልጣል።
- source_word: ἐν τῇ ἁδρότητι ταύτῃ
  choice: ስላለው ለጋስ ስጦታ
  rationale: ἐν እዚህ የነቀፋውን ጉዳይ ወይም ዘርፍ ያመለክታል፤ ἁδρότης ብዛትን፣ ልግስናን ወይም የተትረፈረፈ መዋጮን ሊያመለክት ስለሚችል በዐውደ ንባቡ ‘ለጋስ ስጦታ’ ተመርጧል።
- source_word: τῇ διακονουμένῃ ὑφ’ ἡμῶν
  choice: በእኛ አስተዳደር ሥር ስላለው
  rationale: διακονέω በዚህ የገንዘብ ድጋፍ ዐውድ ስጦታውን በኃላፊነት ማስተዳደርን ያመለክታል፤ አገላለጹም የተሳቢውን ቅርጽ እና የጋራውን ‘በእኛ’ ይጠብቃል።
theological_decisions:
- issue: ጳውሎስ ስጦታውን በማስተዳደር ረገድ የነበረው ስጋት
  choice: ጥቅሱ በገንዘብ አስተዳደር ውስጥ ተግባራዊ ተጠያቂነትንና ነቀፋን አስቀድሞ መከላከልን እንዲያጎላ ተተርጉሟል።
  alternative: ጉዳዩን ተጠያቂነትን ሳያጎላ እንደ ተራ የጉዞ ዝግጅት ማቅረብ።
  rationale: የግሪኩ ሐሳብ ጳውሎስና ባልደረቦቹ መዋጮውን በሚያስተዳድሩበት ሁኔታ ማንም እንዳይወቅሳቸው አስቀድመው እርምጃ መውሰዳቸው ላይ ነው፤ ትርጉሙ ከዚህ በላይ የሆነ የእምነት ሥርዓት አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘አስተዳደር’ የገንዘብ ስጦታውን በኃላፊነት የመያዝን ሐሳብ ያስተላልፋል፤ ‘ቅድመ ጥንቃቄ’ ደግሞ የστελλόμενοιን መከላከያ አቅጣጫ ያሳያል።
