  text: For I do not mean that there should be relief for others and hardship for you, but equality[a]—
translation:
  language: am
  text: ምክንያቱም ለሌሎች እፎይታ እና ለእናንተ ችግር እንዲሆን ማለቴ አይደለም፤ ይልቁንም በእኩልነት[a]—
  philosophy: optimal-equivalence
  footnotes:
