review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the contrast between relief for others and burden for the Corinthians, and correctly anchors the lexical note to ἰσότης. However, it leaves γάρ untranslated and recasts the fragmentary ἀλλ’ ἐξ ἰσότητος as an explicit purpose clause ('so that equality may exist'), which is more interpretive than the Greek and obscures the source's deliberately continuing syntax.
  naturalness: The current Amharic is clear and modern. A balanced nominal construction ('relief for others ... hardship for you') is more natural for this antithetical Greek clause, while retaining the terminal dash to show that the thought continues into the next verse.
  terminology: እፎይታ suitably represents ἄνεσις in this material-sharing context. እኩልነት is a valid direct rendering of ἰσότης; the footnote appropriately preserves ፍትሐዊነት as an alternative without imposing strict sameness. ችግር is a clear contextual rendering of θλῖψις.
  issues:
  - severity: medium
    issue: The explanatory γάρ is omitted.
    rationale: γάρ links this clarification to the preceding appeal. Rendering it as ምክንያቱም preserves the source's explanatory force.
  - severity: medium
    issue: ‘እኩልነት እንዲኖር ነው’ supplies and foregrounds an explicit purpose not stated in the Greek fragment.
    rationale: The source ends with ἀλλ’ ἐξ ἰσότητος and continues syntactically into v. 14. ‘በእኩልነት—’ better retains both the prepositional sense and the open continuation.
  revised_text: ምክንያቱም ለሌሎች እፎይታ እና ለእናንተ ችግር እንዲሆን ማለቴ አይደለም፤ ይልቁንም በእኩልነት[a]—
