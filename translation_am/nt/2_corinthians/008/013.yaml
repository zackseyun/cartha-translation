  choice: እኩልነት
  alternative: ፍትሐዊነት
  rationale: ‘እኩልነት’ የግሪኩን ቃል በቀጥታ ያንጸባርቃል፤ ሆኖም ቃሉ የንብረትን ፍጹም ተመሳሳይነት የግድ ሳያመለክት ፍትሐዊ ሚዛንንም ሊገልጥ ስለሚችል ይህ አማራጭ በማስታወሻ ተጠብቋል።
