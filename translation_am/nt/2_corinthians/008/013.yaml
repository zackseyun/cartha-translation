    text: ወይም፣ “ፍትሐዊነት።” የግሪኩ ቃል ፍትሐዊ ሚዛንን ያመለክታል፤ የንብረትን ፍጹም ተመሳሳይነት የግድ አያመለክትም።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ ἵνα
  choice: ማለቴ አይደለም
  rationale: በግሪክ ንግግሩ ውስጥ የተዘለለውን የዓላማ ሐሳብ በተፈጥሯዊ አማርኛ ይገልጣል፤ γάρ ያለው ማብራሪያዊ ግንኙነት በአንቀጹ ፍሰት ይታወቃል።
- source_word: ἄλλοις ἄνεσις
  choice: ሌሎች እፎይታን እንዲያገኙ
  rationale: ἄνεσις በዚህ የልገሳ አውድ ከጫና ወይም ከችግር መቃለልን ያመለክታል፤ ‘እፎይታ’ ይህን በግልጽ ይገልጣል።
- source_word: ὑμῖν θλῖψις
  choice: እናንተ እንድትቸገሩ
  rationale: θλῖψις እዚህ ልገሳው በቆሮንቶስ ሰዎች ላይ የሚያመጣውን ተግባራዊ ችግርና ጫና ያሳያል።
- source_word: ἀλλ’ ἐξ ἰσότητος
  choice: ይልቁንም እኩልነት እንዲኖር ነው
  rationale: ἀλλά ግልጽ ንፅፅርን ያሳያል፤ ἰσότης በቀጥታ ‘እኩልነት’ ሊባል ይችላል፣ ἐξ ደግሞ በተፈጥሯዊው የአማርኛ አገላለጽ ውስጥ ተዋህዷል።
theological_decisions:
