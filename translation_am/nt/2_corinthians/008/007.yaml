base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/007.yaml
  text: But just as you abound in everything—in faith and speech and knowledge and all diligence and in our love in you—see that you also abound in this grace[a][b].
translation:
  language: am
  text: ነገር ግን በሁሉም ነገር፣ በእምነት፣ በንግግር፣ በእውቀት፣ በሙሉ ትጋትና ከእኛ በእናንተ ውስጥ ባለው ፍቅር እንደምትበዙ ሁሉ፣ በዚህ ጸጋም እንድትበዙ አድርጉ።[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለእኛ ባላችሁ ፍቅር።” የግሪኩ ሐረግ ለመተርጎም አስቸጋሪ ነው፤ አንዳንድ የብራና ቅጂዎች “ከእናንተ በእኛ ውስጥ ባለው ፍቅር” የሚል ንባብ አላቸው።
    reason: alternative_reading
  - marker: b
    text: ይህም ይህን የጸጋ የልገሳ ሥራ ማለት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: περισσεύετε / περισσεύητε
  choice: ትበዙ / እንድትበዙ
  rationale: የብዛትን ምስል ይጠብቃል፤ በቁጥሩ ውስጥ ለሁለቱም የግስ አጠቃቀሞች አንድ ወጥ ትርጉም ይሰጣል።
- source_word: ἐν παντί
  choice: በሁሉም ነገር
  rationale: ቀጥሎ ያለውን ዝርዝር በሰፊው የሚያጠቃልል ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
- source_word: πίστει
  choice: በእምነት
  rationale: በዚህ የክርስቲያናዊ ባሕርያት ዝርዝር ውስጥ πίστις የሚያመለክተውን ዋና ትርጉም ይጠብቃል።
- source_word: λόγῳ
  choice: በንግግር
  rationale: በዝርዝሩ አውድ λόγος የመናገርን ችሎታ ወይም አገላለጽ ሊያመለክት ስለሚችል፣ ‘ንግግር’ ከ‘ቃል’ ይልቅ ተፈጥሯዊና ግልጽ ነው።
- source_word: γνώσει
  choice: በእውቀት
  rationale: የግሪኩን መደበኛ ትርጉም በቀጥታ የሚያስተላልፍ ሲሆን ከዝርዝሩም ጋር ይስማማል።
- source_word: πάσῃ σπουδῇ
  choice: በሙሉ ትጋት
  rationale: σπουδή የሚያሳየውን ቅንዓት፣ ትጉህነትና ጥረት በአጭር እና በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τῇ ἐξ ἡμῶν ἐν ὑμῖν ἀγάπῃ
  choice: ከእኛ በእናንተ ውስጥ ባለው ፍቅር
  rationale: የጉዳዩን አስቸጋሪ ሰዋሰዋዊ አወቃቀር ሳያስወግድ ἐξ ἡμῶν እና ἐν ὑμῖν የሚሉትን ሁለቱንም ቅድመ አያያዞች ይጠብቃል፤ ሌላው ሊሆን የሚችለው ትርጉም በማስታወሻ ቀርቧል።
- source_word: χάριτι
  choice: ጸጋ
  rationale: ቃሉ በዚህ አውድ የልገሳን የጸጋ ሥራ ቢያመለክትም፣ የጳውሎስን ሥነ መለኮታዊ የቃል ምርጫ ይጠብቃል፤ ተጨባጩ ማጣቀሻ በማስታወሻ ተብራርቷል።
theological_decisions:
- issue: በኢየሩሳሌም ስብስብ አውድ χάρις የሚለው ትርጉም
  choice: በዋናው ጽሑፍ ‘ጸጋ’ ተብሎ ተተርጉሟል፤ አውዱ ይህ የልገሳን የጸጋ ሥራ እንደሚያመለክት ያሳያል።
  alternative: ‘የጸጋ ሥራ’፣ ‘ስጦታ’ ወይም ‘የልገሳ ሥራ’
  rationale: ‘ጸጋ’ የሚለው የጳውሎስን ሥነ መለኮታዊ ጥልቀት ይጠብቃል፤ ቃሉን በገንዘብ ልገሳ ብቻ አያጥበውም።
- issue: τῇ ἐξ ἡμῶν ἐν ὑμῖν ἀγάπῃ የሚለው አስቸጋሪ ሐረግ
  choice: ‘ከእኛ በእናንተ ውስጥ ባለው ፍቅር’ በማለት የተቀበለውን የጽሑፍ ቅርጽ በቅርብ መከተል
  alternative: ‘ለእኛ ባላችሁ ፍቅር’ ወይም ‘በእናንተ ውስጥ ባለው ፍቅራችን’
  rationale: ሐረጉ በሰዋሰውና በጽሑፍ ልዩነት ረገድ አሻሚ ስለሆነ፣ ዋናው ጽሑፍ አሻሚነቱን አያስወግድም፤ ተፈጥሯዊው አማራጭ በማስታወሻ ተጠቅሷል።
