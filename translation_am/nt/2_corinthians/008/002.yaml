  - severity: medium
    issue: ባለጠግነት is an unnatural rendering of πλοῦτος in this phrase.
    rationale: It usually means 'being rich' rather than 'wealth/abundance.' የልግስናቸው ብልጽግና naturally conveys the abundance of their generosity.
