  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: συνεπέμψαμεν δὲ μετ’ αὐτοῦ τὸν ἀδελφὸν οὗ ὁ ἔπαινος ἐν τῷ εὐαγγελίῳ διὰ πασῶν τῶν ἐκκλησιῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/018.yaml
  text: And we sent with him the brother whose praise in the gospel is throughout all the churches—[a]
translation:
  language: am
  text: ከእርሱም ጋር፣ በወንጌል ረገድ በሁሉም ቤተ ክርስቲያናት የሚመሰገነውን ወንድም ላክን።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በወንጌል ረገድ በሁሉም ቤተ ክርስቲያናት መልካም ስም ያለውን ወንድም።”
    reason: ἔπαινος እንደ “ምስጋና” ወይም “መልካም ስም/ምስክርነት” ሊተረጎም ይችላል፤ διὰ πασῶν τῶν ἐκκλησιῶν ደግሞ ምስጋናው በሁሉም ቤተ ክርስቲያናት እንደሚታወቅ ያሳያል።
lexical_decisions:
- source_word: συνεπέμψαμεν
  choice: ከእርሱም ጋር ... ላክን
  rationale: የአኦሪስት አመልካች ቅርጹ የተፈጸመ ድርጊትን ይገልጣል፤ σύν የአብሮነትን ሐሳብ ስለሚያክል፣ በአማርኛ ‘ከእርሱ ጋር ... ላክን’ ተብሎ በተፈጥሮ ተተርጉሟል።
- source_word: δὲ
  choice: -ም
  rationale: እዚህ δέ ጠንካራ ተቃርኖ ሳይሆን ትረካውን የሚያስቀጥል ለስላሳ አያያዥ ነው፤ የአማርኛው ‘-ም’ ይህን ፍሰት በተፈጥሮ ያሳያል።
- source_word: μετ’ αὐτοῦ
  choice: ከእርሱ ጋር
  rationale: μετά ከባለቤት አገባብ ጋር አብሮነትን ያመለክታል፤ ‘ከእርሱ ጋር’ ቀጥተኛና ተፈጥሯዊ ነው።
- source_word: τὸν ἀδελφόν
  choice: ወንድም
  rationale: የተወሰነው ተባዕታይ ነጠላ ስም ለቆሮንቶስ ሰዎች የሚታወቅ አንድ ክርስቲያን ወንድምን ያመለክታል፤ ግሪኩ ያልጨመረው ‘የእኛን’ አልተጨመረም።
- source_word: οὗ ὁ ἔπαινος
  choice: ምስጋና ... የተስፋፋለትን
  rationale: የዝምድናው አወቃቀር ለዚያ ወንድም የሚሰጠውን ምስጋና ያመለክታል፤ በአማርኛ የባለቤትነት ቃልን በግድ ሳያስገባ ይህ አቀራረብ ግንኙነቱን ግልጽ ያደርጋል።
- source_word: ἔπαινος
  choice: ምስጋና
  rationale: ቃሉ ምስጋናን ወይም መልካም ምስክርነትን ሊያመለክት ይችላል፤ ‘ምስጋና’ የስሙን ቅርጽ የሚጠብቅ ቀጥተኛ አቻ ነው።
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: በወንጌል ያለው
  rationale: ሐረጉ ምስጋናው ከወንጌል ጋር ያለውን የመስክ ወይም የግንኙነት ትርጉም ይጠብቃል፤ ‘በመስበክ’ ወይም ‘በአገልግሎት’ ብሎ ጽሑፉ ያልገለጸውን አይወስንም።
- source_word: διὰ πασῶν τῶν ἐκκλησιῶν
  choice: በሁሉም ቤተ ክርስቲያናት የተስፋፋለትን
  rationale: διά ከባለቤት አገባብ ጋር በመላው ስብስብ የሚደርስ ስፋትን ያሳያል፤ ይህ አገላለጽ ምስጋናው በሁሉም ማኅበራት መታወቁን በተፈጥሮ ያስተላልፋል።
- source_word: ἐκκλησιῶν
  choice: ቤተ ክርስቲያናት
  rationale: በጳውሎስ አጠቃቀም ቃሉ በአካባቢዎች ያሉ የክርስቲያኖችን ማኅበራት ያመለክታል፤ ‘ቤተ ክርስቲያናት’ በዘመናዊ አማርኛ የተለመደና ግልጽ ነው።
theological_decisions:
- issue: የἀδελφός ማንነትና አቋም
  choice: ለቆሮንቶስ ሰዎች የሚታወቅ አንድ ወንድ ክርስቲያን ተባባሪን የሚያመለክት ‘ወንድም’ ተብሎ ተተርጉሟል።
  alternative: ‘ወንድም’ን ጾታ ያልተወሰነ የእምነት ጓደኛ ትርጉም መስጠት።
  rationale: በጉዞና በመላክ አውድ ውስጥ ያለው ተባዕታይ ነጠላ ቅርጽና መስተዋድድ አንድ የተወሰነ ወንድን ያመለክታል፤ የግል ማንነቱ ግን አልተጨመረም።
- issue: የἐν τῷ εὐαγγελίῳ ትክክለኛ ግንኙነት
  choice: የአገልግሎት ሚናውን ሳይወስን ‘በወንጌል ያለው’ ተብሎ ክፍትነቱ ተጠብቋል።
  alternative: ‘ወንጌልን በመስበኩ’ ወይም ‘በወንጌል ሥራው’ ብሎ ማብራራት።
  rationale: ግሪኩ ምስጋናው ከወንጌል ጋር እንደተያያዘ ይናገራል እንጂ በግልጽ መስበክን ወይም የተወሰነ የአገልግሎት ሹመትን አይጠቅስም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ አማርኛ ተጠቅሟል። የግሪኩ ረጅም የዝምድና አወቃቀር ተፈጥሯዊ በሆነ የአማርኛ ሐረግ ቀርቧል፤ ስለ ወንድሙ የወንጌል ተግባር ያለው አሻሚነት አልተወገደም።
