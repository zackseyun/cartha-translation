- from: ከእርሱም ጋር፣ በወንጌል ያለው ምስጋና በሁሉም ቤተ ክርስቲያናት የተስፋፋለትን ወንድም ላክን።[a]
  to: ከእርሱም ጋር፣ በወንጌል ረገድ በሁሉም ቤተ ክርስቲያናት የሚመሰገነውን ወንድም ላክን።[a]
  rationale: The revision replaces an unnatural nominal construction and the potentially misleading image of praise “spreading” with a direct, idiomatic relative clause. “በወንጌል ረገድ” preserves the open semantic relation of ἐν τῷ εὐαγγελίῳ and does not specify preaching, office, or another form of ministry.
