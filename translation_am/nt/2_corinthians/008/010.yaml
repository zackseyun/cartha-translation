theological_decisions:
- issue: የጳውሎስ ንግግር ከሐዋርያዊ ሥልጣን አንጻር ያለው ኃይል
  choice: ጳውሎስ ቀጥተኛ ትእዛዝ ከመስጠት ይልቅ በጥንቃቄ የታሰበ ምክር ይሰጣል።
  alternative: ጳውሎስ ሥልጣናዊ መመሪያ ይሰጣል።
  rationale: የቅርብ አውዱ ትእዛዝንና γνώμηን ይለያል (8፥8፣ 8፥10)። «ምክሬን» ሐዋርያዊ ክብደቱን ሳያሳንስ ንግግሩን ግልጽ ትእዛዝ አድርጎ ከማጠናከር ይቆጠባል።
