base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/010.yaml
  text: 'And in this matter I give my judgment: for this is beneficial for you[b][a], who began last year not only to do it but also to will it.'
translation:
  language: am
  text: በዚህ ጉዳይ ላይ ምክሬን እሰጣለሁ፤[a] ይህ ለእናንተ ይጠቅማልና፤ እናንተም ካለፈው ዓመት ጀምሮ ይህን ማድረግ ብቻ ሳይሆን ለማድረግ ፈቃደኛ መሆንንም[b] የጀመራችሁ ናችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «አስተያየቴን»። ጳውሎስ ይህን እንደ ትእዛዝ ከመናገር ይልቅ በጥንቃቄ የታሰበ ምክር እየሰጠ ነው።
    reason: lexical_alternative
  - marker: b
