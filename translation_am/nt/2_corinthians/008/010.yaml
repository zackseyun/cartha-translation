- source_word: τὸ θέλειν
  choice: ለማድረግ መፈለግንም
  rationale: የውስጥ ፈቃድን ከተግባራዊ ክንውን ለይቶ ያሳያል፤ «መፈለግ» የθέλεινን የፈቃድ ኃይል በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: προενήρξασθε
  choice: ቀድማችሁ ጀምራችኋል
  rationale: የግሱን ‘አስቀድሞ መጀመር’ ስሜት ይጠብቃል፤ ምንም እንኳ የጊዜ ሐረጉ ቀደምትነቱን ቢያሳይም፣ የተዋሐደውን ግስ ባሕርይ ሙሉ በሙሉ አያጠፋም።
