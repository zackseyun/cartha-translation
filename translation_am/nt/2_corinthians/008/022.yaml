  text: And we have sent with them our brother[a], whom we have often tested in many matters and found to be diligent, but who is now even more diligent because of his great confidence in you.
translation:
  language: am
  text: ከእነርሱም ጋር ወንድማችንን ልከናል፤ እርሱን በብዙ ጉዳዮች ብዙ ጊዜ ፈትነን ትጉህ መሆኑን ያረጋገጥነው ነው። አሁን ግን እናንተን በእጅጉ ስለሚተማመን እጅግ ይበልጥ ትጉህ ሆኗል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አሁን ግን በእናንተ ላይ ባለው ታላቅ መተማመን እጅግ ይበልጥ ትጉህ ሆኗል።” የግሪኩ ሐረግ ‘ስለ’ ወይም ‘በ’ ተብሎ በትንሹ ሊተረጎም ይችላል፤ በሁለቱም አገባብ በእናንተ ላይ ያለው ታላቅ መተማመን ትጋቱን እንዳሳደገ ያመለክታል።
