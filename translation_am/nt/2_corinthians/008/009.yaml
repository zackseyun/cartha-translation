  text: γινώσκετε γὰρ τὴν χάριν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὅτι δι’ ὑμᾶς ἐπτώχευσεν πλούσιος ὤν, ἵνα ὑμεῖς τῇ ἐκείνου πτωχείᾳ πλουτήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/009.yaml
  text: For you know the grace of our Lord Jesus Christ[a], that though he was rich, yet for your sake he became poor[b], so that you by his poverty might become rich.
translation:
  language: am
  text: የጌታችንን የኢየሱስ ክርስቶስን[a] ጸጋ ታውቃላችሁና፤ እርሱ ባለጠጋ ቢሆንም፣ እናንተ በእርሱ ድህነት ባለጠጎች እንድትሆኑ፣ ስለ እናንተ ድሃ ሆነ[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ኢየሱስ መሲሕ” ተብሎም ሊተረጎም ይችላል። የግሪኩ Χριστός (ክርስቶስ) “የተቀባው” ማለት ሲሆን፣ “መሲሕ” ተመሳሳይ ትርጉም ያለው ማዕረግ ነው።
    reason: alternative_reading
  - marker: b
    text: “ባለጠጋ” እና “ድሃ” የሚሉት ቃላት የክርስቶስን ቀድሞ የነበረ ብልጽግናና ስለ ሌሎች ሲል ራሱን ዝቅ ማድረጉን የሚያነጻጽሩ ምሳሌያዊ አገላለጾች ሊሆኑ ይችላሉ፤ ጳውሎስ ግን እዚህ ምሳሌውን በግልጽ አይተረጉመውም።
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκετε
  choice: ታውቃላችሁ
  rationale: የአሁን ጊዜ አመልካች ግስ ሲሆን፣ ጳውሎስ ቆሮንቶሳውያን አስቀድመው የሚያውቁትን እውቀት ይጠቅሳል።
- source_word: χάριν
  choice: ጸጋ
  rationale: ቃሉ ጸጋን፣ ውለታን ወይም በልግስና የተገለጠ ቸርነትን ሊያመለክት ይችላል፤ ‘ጸጋ’ ክርስቶስ በቸርነት ያደረገውንም ሆነ በዐውዱ ያለውን የልግስና አርአያነት ይይዛል።
- source_word: κυρίου
  choice: ጌታችን
  rationale: የተለመደውን የሥልጣንና የክርስቶሳዊ ክብር ማዕረግ ይጠብቃል፤ ἡμῶν የሚለውም በባለቤትነት ቅጥ ተካቷል።
- source_word: Ἰησοῦ Χριστοῦ
  choice: የኢየሱስ ክርስቶስን
  rationale: ‘ክርስቶስ’ በአማርኛ የጸናና ለተራ አንባቢ የሚታወቅ መጽሐፍ ቅዱሳዊ ማዕረግ ነው፤ ትርጉሙን የሚገልጠው ‘መሲሕ’ በማስታወሻ ተሰጥቷል።
- source_word: δι’ ὑμᾶς
  choice: ስለ እናንተ
  rationale: በዚህ ዐውድ διά ከተሳቢ ጋር ያለውን ለእነርሱ ጥቅም ሲል የተደረገ ድርጊት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐπτώχευσεν
  choice: ድሃ ሆነ
  rationale: ከቀድሞው ባለጠግነት ወደ ድህነት የሆነውን ለውጥ በቀጥታ ያሳያል፣ የለውጡንም መንገድ ከግሪኩ በላይ አይወስንም።
- source_word: πλούσιος ὤν
  choice: ባለጠጋ ሆኖ ሳለ
  rationale: የአሳቢ አንቀጹን ንፅፅራዊ ኃይል ይጠብቃል፤ እርሱ ባለጠጋ ቢሆንም ድሃ መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τῇ ἐκείνου πτωχείᾳ
  choice: በእርሱ ድህነት
  rationale: የዘዴ ወይም የመንገድ ዳቲቭን ‘በ’ በሚለው መስተዋድድ ይገልጣል፤ ἐκείνου ያለው አጽንዖትም ‘እርሱ’ በሚለው ተጠብቋል።
- source_word: πλουτήσητε
  choice: ባለጠጎች እንድትሆኑ
  rationale: ἵνα የሚያስገባውን ዓላማ ወይም ውጤት ይገልጣል፣ ‘ድሃ ሆነ’ ከሚለው ጋር ያለውንም ሆነ/መሆን ትይዩነት ይጠብቃል።
theological_decisions:
- issue: የክርስቶስ ‘ባለጠጋ’ መሆንና የአማኞች ‘ባለጠጎች’ መሆን ትርጉም
  choice: የሀብትና የድህነት ንፅፅሩን በዋናው ጽሑፍ እንዳለ መጠበቅ፣ የሚያመለክተውን የሀብት ዓይነት አለመወሰን
  alternative: ‘ባለጠጋ’ ማለት በተለይ ከሥጋ መልበሱ በፊት የነበረው መለኮታዊ ክብር ነው ወይም ‘ባለጠጎች መሆን’ በተለይ መንፈሳዊ የድነት በረከቶች ናቸው ብሎ መወሰን
  rationale: ግሪኩ የክርስቶስን ራስን መስጠት ለልግስና አርአያ አድርጎ ሲያቀርብ፣ የ‘ሀብት’ እና የ‘ድህነት’ ወሰንን በግልጽ አይተረጉምም፤ ስለዚህ ሥነ መለኮታዊ ውጥረቱ ተጠብቋል።
