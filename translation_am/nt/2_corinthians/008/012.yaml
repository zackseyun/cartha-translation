base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/012.yaml
  text: For if the readiness is present[a], it is acceptable according to what one has[b], not according to what one does not have.
translation:
  language: am
  text: ምክንያቱም ፈቃደኝነት[a] ካለ፣ ሰው ባለው መሠረት ተቀባይ ነው፤ ሰው በሌለው ነገር መሠረት ግን አይደለም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ጉጉት» ወይም «ዝግጁነት»።
    reason: lexical_alternative
lexical_decisions:
- source_word: προθυμία
  choice: ፈቃደኝነት
  rationale: ቃሉ በፈቃድና በትጋት የተሞላ ዝግጁ አመለካከትን ያመለክታል። «ፈቃደኝነት» በዐውዱ ያለውን ለመስጠት የመዘጋጀት ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: πρόκειται
  choice: ካለ
  rationale: በዚህ አገባብ ግሱ በቃል በቃል «ከፊት ተቀምጧል» ሳይሆን ፈቃደኝነቱ በእርግጥ መኖሩን ይገልጣል።
- source_word: καθὸ ἐὰν ἔχῃ
  choice: ሰው ባለው መጠን
  rationale: ሐረጉ ተቀባይነቱ በሰውየው እጅ ባለው አቅም እንደሚመዘን ያሳያል። «ሰው» የግሪኩን አጠቃላይ ነጠላ አመልካች ያለ ፆታ ገደብ ያቀርባል።
- source_word: εὐπρόσδεκτος
  choice: ተቀባይነት አለው
  rationale: ይህ አገላለጽ «ተቀባይ ነው» ወይም «በመልካም ይቀበላል» የሚለውን የግሪክ ትርጉም ይጠብቃል፤ ተቀባዩንም ሆን ብሎ አይጨምርም።
- source_word: οὐ καθὸ οὐκ ἔχει
  choice: በሌለው መጠን ግን አይደለም
  rationale: ይህ ቀዳሚውን ሐረግ በተመጣጣኝ መዋቅር ይቃረናል፤ ፈቃደኝነቱ የሚመዘነው ሰው በሌለው ነገር እንዳልሆነ ያሳያል።
- source_word: εἰ γὰρ
  choice: ምክንያቱም … ካለ
  rationale: «ምክንያቱም» የγὰρን አብራሪ ኃይል፣ «ካለ» ደግሞ የεἰን ሁኔታዊ ኃይል በተፈጥሯዊ አማርኛ ይጠብቃሉ።
theological_decisions:
- issue: የተቀባይነቱ ተቀባይ ማንነት
  choice: ጥቅሱ ፈቃደኛ መስጠት ሰው ባለው አቅም መጠን ተቀባይነት እንዳለው ይናገራል፤ ተቀባይነቱ በእግዚአብሔር ፊት፣ በማኅበሩ ፊት ወይም በሁለቱም ፊት መሆኑን ግን አይወስንም።
  alternative: «በእግዚአብሔር ፊት ተቀባይነት አለው» ወይም «በማኅበሩ ዘንድ ተቀባይ ነው» ብሎ መግለጽ።
  rationale: εὐπρόσδεκτος መቀበልን ወይም ማጽደቅን ያመለክታል፤ ጽሑፉ ግን የሚቀበለውን በግልጽ አይጠቅስም። ስለዚህ ትርጉሙ ይህን ግልጽ ያልሆነ ሁኔታ እንዳለ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ያ ፈቃደኝነት» የሚለው መደገም የεὐπρόσδεκτοςን ሰዋሰዋዊ ማጣቀሻ ግልጽ ያደርጋል፤ የተቀባይነቱን ተቀባይ ግን አይወስንም።
