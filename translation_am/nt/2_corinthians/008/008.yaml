base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/008.yaml
  text: I am not saying this as a command[b][a], but through the earnestness of others I am also testing the genuineness of your love.
translation:
  language: am
  text: ይህን እንደ ትእዛዝ አልናገርም፤ ነገር ግን በሌሎች ትጋት[a] የፍቅራችሁንም እውነተኛነት እየፈተንኩ[b] ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በሌሎች ጉጉት”፤ σπουδή ትጋትን፣ ጉጉትን ወይም ቁርጠኛ ጥረትን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “የፍቅራችሁን እውነተኛነት እያረጋገጥኩ” ወይም “ለፈተና እያቀረብኩ”።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιταγή
  choice: ትእዛዝ
  rationale: የሐዋርያዊ ሥልጣን ግዴታ ያለበትን ትእዛዝ የሚያመለክተውን አገላለጽ በተፈጥሯዊና ግልጽ አማርኛ ያስተላልፋል።
- source_word: διὰ τῆς ἑτέρων σπουδῆς
  choice: በሌሎች ትጋት አማካይነት
  rationale: διά ከዘር አመልካች ጋር ያለውን የመንገድ ወይም የመሣሪያ ኃይል ይጠብቃል፤ ἑτέρωνንም ማንነታቸውን ሳይጨምር ‘ሌሎች’ ብሎ ያቀርባል።
- source_word: σπουδή
  choice: ትጋት
  rationale: በዚህ የልግስና አውድ ያለውን ከልብ የሆነ ጉጉት፣ ቁርጠኝነትና ንቁ ጥረት በአጭር አማርኛ ይገልጣል።
- source_word: ἀγάπη
  choice: ፍቅር
  rationale: የተለመደውንና በአውዱ በልገሳ የሚገለጠውን ἀγάπη በቀጥታ ያስተላልፋል።
- source_word: γνήσιον
  choice: እውነተኛነት
  rationale: በአንቀጹ እንደ ስም የተጠቀመውን ቅጽ፣ ማለትም ፍቅሩ ከሐሰት ያልሆነና ትክክለኛ መሆኑን፣ ይጠብቃል።
- source_word: δοκιμάζων
  choice: እየፈተንኩ
  rationale: ከዋናው ግስ ጋር በአንድ ጊዜ የሚካሄድ የመመርመር ወይም የማረጋገጥ ተግባርን ያሳያል፤ የአሁን ጊዜ አሳታፊውንም ተፈጥሯዊ በሆነ የአማርኛ ቅጽ ያቀርባል።
- source_word: καί
  choice: -ም (የእናንተንም)
  rationale: የግሪኩን ጨማሪ ኃይል በተፈጥሯዊው የአማርኛ አጣቃሽ ‘-ም’ ያሳያል።
- source_word: ὑμετέρας
  choice: የእናንተን
  rationale: በቁጥር ብዙ ለሆኑት የቆሮንቶስ ሰዎች የሚያመለክተውን የባለቤትነት ቅጽ ግልጽ አድርጎ ያስተላልፋል።
theological_decisions:
- issue: ጳውሎስ ስለ ልገሳ የያዘው አነጋገር
  choice: ጳውሎስ እንደ ትእዛዝ እየተናገረ እንዳልሆነ በግልጽ ይክዳል፤ ንግግሩንም የፍቅራቸውን እውነተኛነት ከመፈተን ጋር ያያይዛል።
  alternative: ንግግሩ በቃላት የለዘበ ቢሆንም በተግባር ግን ትእዛዝ ነው ብሎ መተርጎም።
  rationale: οὐ κατ’ ἐπιταγὴν λέγω የሚለው ግልጽ ክህደት እንደ ድብቅ ትእዛዝ ሊለወጥ አይገባም። ትርጉሙ በሐዋርያዊ ሥልጣንና ከፍቅር በሚመነጭ ፈቃደኛ ተግባር መካከል ያለውን ውጥረት ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። “በ…አማካይነት” የሚለው ቅጽ ትንሽ መደበኛ ቢሆንም የግሪኩን የመንገድ/መሣሪያ ግንኙነት በግልጽ ይጠብቃል።
