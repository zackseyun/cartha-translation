lexical_decisions:
- source_word: ἔνδειξιν
  choice: ማስረጃ
  rationale: ቃሉ አንድን ነገር ግልጽ የሚያደርግ ማሳያ ወይም ማስረጃ ማለት ነው፤ በዚህ አውድ ፍቅራቸውን በተግባር እንዲያረጋግጡ የቀረበውን ጥሪ ያሳያል።
- source_word: ἀγάπης
  choice: ፍቅራችሁን
  rationale: ἀγάπη በተለመደውና ግልጽ የአማርኛ ቃል ‘ፍቅር’ ተተርጉሟል፤ እዚህ በተግባር የሚገለጥ ፍቅርን ያመለክታል።
- source_word: καυχήσεως ὑπὲρ ὑμῶν
  choice: ስለ እናንተ የምንመካበትን ምክንያት
  rationale: ‘መመካት’ የκαύχησιςን የንግግር ኃይል ይጠብቃል፤ ‘ምክንያት’ መጨመሩ ከἔνδειξις ጋር ያለውን የአንድ ግስ ተሳታፊነት በተፈጥሯዊ አማርኛ ያቀርባል። ὑπὲρ ὑμῶν ‘ስለ እናንተ’ ተብሏል።
- source_word: εἰς αὐτοὺς
  choice: ለእነርሱ
  rationale: ይህ በቀደመው አውድ የተጠቀሱትን ወንድሞች፣ ማለትም የቤተ ክርስቲያኖችን ተወካዮች፣ ያመለክታል።
- source_word: ἐνδεικνύμενοι
  choice: አሳዩ
  rationale: አሳቢው በአውዱ የትእዛዝ ኃይል አለው፤ ‘አሳዩ’ ይህን በግልጽና ዘመናዊ አማርኛ ይገልጣል።
- source_word: εἰς πρόσωπον τῶν ἐκκλησιῶν
  choice: በቤተ ክርስቲያኖች ፊት
  rationale: አገላለጹ በሕዝብ ፊት ወይም በተወካዮቻቸው ፊት መግለጥን ያመለክታል፤ ‘በ…ፊት’ የግሪኩን ምስልና የአደባባይ ትርጉሙን ይጠብቃል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ሐሳብ የሚወጣውን መደምደሚያና ማበረታቻ በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: καύχησις የሚያመለክተው የጳውሎስ መመካት ትርጉም
  choice: ስለ እናንተ የምንመካበት ምክንያት
