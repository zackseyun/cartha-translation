source:
  edition: SBLGNT
  text: ὅτι τὴν μὲν παράκλησιν ἐδέξατο, σπουδαιότερος δὲ ὑπάρχων αὐθαίρετος ἐξῆλθεν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/017.yaml
  text: For he accepted the appeal[a], but being more earnest[d][c][b], he went to you of his own accord.
translation:
  language: am
  text: ምክንያቱም ልመናውን ተቀበለ፤ ነገር ግን ይበልጥ ትጉ ሆኖ በራሱ ፈቃድ ወደ እናንተ ሄደ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወደ እናንተ ተነሳ።” የግሪኩ ግስ ቃል በቃል “ወጣ” ማለት ነው።
    reason: የἐξῆλθεν ቃል በቃል ትርጉምና አቅጣጫዊ ገጽታ ለማሳየት።
lexical_decisions:
- source_word: ὅτι
  choice: ምክንያቱም
  rationale: በዐውዱ የቀደመውን ምስጋና የሚያብራራ ምክንያታዊ አገናኝ ነው።
- source_word: τὴν παράκλησιν ἐδέξατο
  choice: ልመናችንን ተቀብሎአል
  rationale: παράκλησις እዚህ ጳውሎስ ለቲቶ ያቀረበውን ልመና ወይም ጥሪ ያመለክታል፤ ἐδέξατο ደግሞ በፈቃደኝነት መቀበሉን ይገልጣል። በአማርኛ ባለቤትነቱ ከዐውዱ ግልጽ እንዲሆን ‘ልመናችንን’ ተብሏል።
- source_word: σπουδαιότερος δὲ ὑπάρχων
  choice: ነገር ግን ይበልጥ ቀናተኛ ስለሆነ
  rationale: የንጽጽር ኃይሉን በ‘ይበልጥ’ ይጠብቃል፤ σπουδαῖος በዚህ ዐውድ ጉጉትንና ትጋትን ያመለክታል።
- source_word: αὐθαίρετος
  choice: በራሱ ፈቃድ
  rationale: ያለ ግድ በገዛ ፈቃዱና ተነሳሽነቱ እንደሠራ የሚያሳየውን ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐξῆλθεν πρὸς ὑμᾶς
  choice: ወደ እናንተ ሄደ
  rationale: የእንቅስቃሴውን አቅጣጫ ይጠብቃል። ἐξῆλθεν ቃል በቃል ‘ወጣ’ ሊባል ቢችልም፣ በአማርኛ ‘ሄደ’ በዚህ ዐውድ ተፈጥሯዊ ነው።
theological_decisions: []
