base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/021.yaml
  text: For we take thought for what is good[a], not only before the Lord but also before people.
translation:
  language: am
  text: በጌታ ፊት ብቻ ሳይሆን፣ በሰዎች ፊትም መልካም የሆነውን[a] ለማድረግ አስቀድመን እናስባለንና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የተከበረውን” ወይም “ትክክል የሆነውን።”
    reason: lexical_alternative
lexical_decisions:
- source_word: προνοοῦμεν
  choice: አስቀድመን እናስባለን
  rationale: ግሱ አስቀድሞ ማሰብን፣ ጥንቃቄ ማድረግንና ዝግጅት ማድረግን ያመለክታል፤ በዚህ የገንዘብ አያያዝ አውድ ውስጥ የታሰበና ጥንቃቄ የተሞላበት አካሄድን ይገልጣል።
- source_word: γὰρ
  choice: እና…ና
  rationale: ለቀደመው ሐሳብ ምክንያት የሚሰጠውን አገናኝ በተፈጥሯዊ የአማርኛ አገባብ ያሳያል።
- source_word: καλὰ
  choice: መልካም የሆነውን
  rationale: የግሪኩ ገለልተኛ ብዙ ቁጥር በሥነ ምግባር መልካም፣ ክቡር ወይም ትክክል የሆነ ነገርን ሊያመለክት ይችላል። ዋናው ጽሑፍ ሰፊውን ትርጉም ይጠብቃል፤ የክብርና የትክክለኛነት አማራጮች በማስታወሻ ተጠብቀዋል።
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: ብቻ ሳይሆን…ም
  rationale: የግሪኩን ተመጣጣኝ ንጽጽር በተፈጥሯዊና ግልጽ የአማርኛ አወቃቀር ያቀርባል።
- source_word: ἐνώπιον
  choice: ፊት
  rationale: ‘በፊት’ ወይም ‘በዓይን ፊት’ የሚለውን የመታየትና የተጠያቂነት ሐሳብ በሁለቱም አንቀጾች አጭርና ተፈጥሯዊ በሆነ መንገድ ይገልጣል።
- source_word: κυρίου
  choice: ጌታ
  rationale: κύριος በፕሮጀክቱ የተለመደ አጠቃቀም ‘ጌታ’ ተብሎ ተተርጉሟል።
- source_word: ἀνθρώπων
  choice: ሰዎች
  rationale: ቃሉ እዚህ ወንዶችን ብቻ ሳይሆን በአጠቃላይ ሰብዓዊ ታዛቢዎችን ያመለክታል።
theological_decisions:
- issue: በገንዘብ ተጠያቂነት አውድ ውስጥ የκαλὰ ሥነ ምግባራዊ ትርጉም
  choice: በዋናው ጽሑፍ ‘መልካም የሆነውን’ ተብሎ ሰፊ ትርጉሙ ተጠብቋል።
  alternative: ‘የተከበረውን’ ወይም ‘ትክክል የሆነውን’
  rationale: ጥቅሱ በጌታም ሆነ በሰዎች ፊት የሚመሰገንና ከነቀፋ የራቀ አካሄድን ያጎላል። ግሪኩ ሰፊውን ‘መልካም’ ትርጉምና በሕዝብ ፊት ክብር ያለውን አካሄድ ሁለቱንም ሊያመለክት ስለሚችል፣ ዋናው ጽሑፍ ትርጉሙን አያጠብም፤ አማራጮቹንም በማስታወሻ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ የምክንያት አገናኝ በአማርኛው የመጨረሻ ‘እና…ና’ አወቃቀር ተፈጥሯዊ ሆኗል፤ የπρονοοῦμεν አስቀድሞ የማሰብ ገጽታም በግልጽ ተጠብቋል።
