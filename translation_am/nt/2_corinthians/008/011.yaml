reference: 2 Corinthians 8:11
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: νυνὶ δὲ καὶ τὸ ποιῆσαι ἐπιτελέσατε, ὅπως καθάπερ ἡ προθυμία τοῦ θέλειν οὕτως καὶ τὸ ἐπιτελέσαι ἐκ τοῦ ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/011.yaml
  text: But now complete the doing of it also[a], so that just as there was the eagerness to will it[b], so also there may be the completion from what you have.
translation:
  language: am
  text: አሁን ግን ያንን ማድረግ ፈጽሙ፤ ለማድረግ የነበራችሁ ፈቃደኝነት እንደነበረ ሁሉ፣ ካላችሁት መጠን እንድትፈጽሙም እንዲሁ ይሁን።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: አሁን ግን
  rationale: የጊዜውን አጽንዖትና ከቀደመው ሐሳብ ወደ ተግባር የሚያሸጋግረውን መጠነኛ ንፅፅር ይጠብቃል።
- source_word: τὸ ποιῆσαι
  choice: ማድረጉን
  rationale: ቀድሞ የታሰበውን የስጦታ ተግባር የሚያመለክተውን የስም አገላለጽ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐπιτελέσατε
  choice: ፈጽሙት
  rationale: የጀመሩትን ነገር ወደ ፍጻሜ የማድረስን ትርጉም ይገልጣል።
- source_word: ἡ προθυμία τοῦ θέλειν
  choice: ለማድረግ ያሳያችሁት ጉጉት
  rationale: προθυμία የሚያመለክተውን ፈቃደኛ ዝግጁነትና ጉጉት ያስተላልፋል፤ θέλειν ደግሞ በዐውዱ ውስጥ ያለውን የማድረግ ፈቃድ ይገልጣል።
- source_word: τὸ ἐπιτελέσαι
  choice: ፈጽማችሁ እንድታጠናቅቁት
  rationale: ከἐπιτελέσατε ጋር ያለውን የቃል ግንኙነት ይጠብቃል፣ በአማርኛም ወደ ፍጻሜ ማድረስን ግልጽ ያደርጋል።
- source_word: ἐκ τοῦ ἔχειν
  choice: ካላችሁ መጠን
  rationale: መስጠቱ አሁን ባላቸው አቅምና ሀብት መሠረት እንዲሆን የሚያሳየውን የምንጭ ወይም የመጠን ኃይል ይጠብቃል።
theological_decisions:
- issue: ባለው አቅም መሠረት የመስጠት አንድምታ
  choice: ጥቅሱ ቆሮንቶሳውያን ቃል የገቡትን ስጦታ አሁን ባላቸው መጠን እንዲፈጽሙ ያሳስባል።
  alternative: ሰው ያሰበውን መልካም ነገር አቅሙ ምንም ቢሆን እንዲፈጽም የሚጠይቅ አጠቃላይ ትእዛዝ።
  rationale: የቅርብ ዐውዱ ስለተስፋ የተሰጠው መዋጮ ነው፤ ἐκ τοῦ ἔχειν ደግሞ ከአሁኑ ይዞታ ወይም አቅም መስጠትን ያመለክታል፣ ከአቅም በላይ የሆነ ግዴታን አያስገባም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። የግሪኩን የፈቃድና የፍጻሜ ንፅፅር ጠብቆ፣ የቃል በቃል አወቃቀሩ በአማርኛ እንዳይከብድ በተፈጥሯዊ አገባብ ተደርጓል።
