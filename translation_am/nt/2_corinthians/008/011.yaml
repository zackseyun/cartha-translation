revisions:
- from: አሁን ግን ማድረጉንም ፈጽሙት፤[a] ይህም፣ ለማድረግ ያሳያችሁት ጉጉት እንደነበረ፣ እንዲሁ ካላችሁ መጠን ፈጽማችሁ እንድታጠናቅቁት ነው።[b]
  to: አሁን ግን ያንን ማድረግ ፈጽሙ፤ ለማድረግ የነበራችሁ ፈቃደኝነት እንደነበረ ሁሉ፣ ካላችሁት መጠን እንድትፈጽሙም እንዲሁ ይሁን።
