review_pass:
  verdict: revise
  source_fidelity: The draft preserves the major lexical elements, but it redundantly renders the single participle δεόμενοι as both «እየተማጸኑን» and «ለመኑን». Its «የመርዳት» also narrows the ministry/service to an explicit act of helping, whereas διακονία remains the broader ‘service/ministry.’ A revision retains χάρις as «ጸጋ», κοινωνία as «ተሳትፎ», and the direction of the service toward the saints.
  naturalness: The duplicated request verbs are unnatural and unnecessarily repetitive in modern Amharic. A single participial expression, with an explicit but idiomatic result/complement clause, reads smoothly while retaining the Greek verse’s continuing syntax and final dash.
  terminology: «ቅዱሳን» is appropriate for ἁγίους, and «ጸጋ» appropriately preserves the Pauline resonance of χάρις. «ተሳትፎ» is a clear modern rendering of κοινωνία in this collection context. «አገልግሎት» adequately renders διακονία without over-specifying the nature of the aid.
  issues:
  - severity: medium
    issue: 'The request is expressed twice: «እየተማጸኑን ... ለመኑን».'
    rationale: δεόμενοι ἡμῶν is one participial expression (‘begging us’). The doubling adds emphasis and verbal content not present in the source and is stylistically awkward.
  - severity: medium
    issue: «የመርዳት» is an unwarranted narrowing of the genitival phrase.
    rationale: Although the wider context concerns material relief, τῆς διακονίας denotes service/ministry here. The verse itself does not explicitly say ‘helping,’ so «በ... አገልግሎት የመካፈል» more closely preserves the source wording and breadth.
  - severity: low
    issue: The supplied demonstrative «ይህን» lacks a direct Greek correspondent.
    rationale: The Greek article does not require a demonstrative. Omitting it makes the Amharic closer to the source without reducing clarity.
  revised_text: በብዙ ልመና እየተማጸኑን፣ ለቅዱሳን በሚደረገው አገልግሎት የመካፈልን ጸጋና ተሳትፎ እንድንሰጣቸው—[a]
