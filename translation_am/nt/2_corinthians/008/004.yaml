translation:
  language: am
  text: በብዙ ልመና እየተማጸኑን፣ ለቅዱሳን በሚደረገው አገልግሎት የመካፈልን ጸጋና ተሳትፎ እንድንሰጣቸው—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ለቅዱሳን በሚደረገው አገልግሎት የመካፈል መብትና ተሳትፎ።»
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ πολλῆς παρακλήσεως δεόμενοι ἡμῶν
  choice: በብዙ ልመና እየተማጸኑን ... ለመኑን
  rationale: παράκλησις በዚህ አውድ ማጽናናትን ሳይሆን ጽኑ ልመናን ያመለክታል፤ δεόμενοι ያለውን ከፍተኛ የልመና ኃይልም «እየተማጸኑን» ይገልጣል። የግሪኩ አንቀጽ የቀደመውን ሐሳብ የሚቀጥል ቢሆንም፣ በአማርኛ ግልጽ እንዲሆን «ለመኑን» ተደግፏል።
- source_word: τὴν χάριν
  choice: ጸጋ
  rationale: χάρις እዚህ የተሳትፎ በጎ ዕድልን ወይም መብትን ሊጠቁም ቢችልም፣ «ጸጋ» የጳውሎስን ቁልፍ ቃልና ሆን ተብሎ ያልተወሰነውን ስፋት ይጠብቃል።
- source_word: τὴν κοινωνίαν
  choice: ተሳትፎ
  rationale: κοινωνία በዚህ የመዋጮ አውድ በአገልግሎቱ በጋራ መካፈልን ያመለክታል፤ «ተሳትፎ» በዘመናዊ አማርኛ ይህን ትርጉም በግልጽ ይሰጣል።
- source_word: τῆς διακονίας τῆς εἰς τοὺς ἁγίους
  choice: ለቅዱሳን የሚደረገውን አገልግሎት
  rationale: διακονία የቁሳዊ እርዳታውን ክብር እንደ አገልግሎት ያቀርባል፤ εἰς የአገልግሎቱን አቅጣጫና ተጠቃሚዎች ያሳያል።
- source_word: τοὺς ἁγίους
  choice: ቅዱሳን
  rationale: ቃሉ ጳውሎስ አማኞችን በአጠቃላይ የሚጠራበትን መጠሪያ ይጠብቃል፤ ለተለየ ልሂቃን ቡድን አይወስነውም።
theological_decisions:
- issue: χάρις እንደ «ጸጋ» ወይም «መብት/በጎ ዕድል»
  choice: ጸጋ
  alternative: የተሳትፎ መብት / በጎ ዕድል
  rationale: «ጸጋ» የቃሉን ሥነ መለኮታዊ ድምፅና በዚህ አውድ ያለውን የተሰጠ መብት ጥላ በአንድነት ይጠብቃል፤ አማራጩ በማስታወሻ ተገልጿል።
- issue: ἅγιοι የሚያመለክተው
  choice: ቅዱሳን
  alternative: የእግዚአብሔር ቅዱስ ሕዝብ
  rationale: የጳውሎስን መደበኛ መጠሪያ ይጠብቃል፤ ቃሉን ከጊዜ በኋላ በተፈጠረ የተለየ የቅድስና ማዕረግ አይገድበውም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ሐረግ ከቀደመው ቁጥር ጋር ሰዋሰዋዊ ትስስር ስላለው የመጨረሻው ሰረዝ ተጠብቋል። «ይህን» በአማርኛ የተጨመረው የታወቀውን አገልግሎት በተፈጥሯዊ ሁኔታ ለማመልከት ነው።
