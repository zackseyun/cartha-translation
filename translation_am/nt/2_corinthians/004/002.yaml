- source_word: πρὸς πᾶσαν συνείδησιν ἀνθρώπων
  choice: ለሰው ሁሉ ሕሊና
  rationale: πᾶσανን በእያንዳንዱ ሰው የሞራል ግንዛቤ ላይ እንደሚደረግ ጥሪ ያቀርባል፣ ጾታንም አይወስንም።
- source_word: ἐνώπιον τοῦ θεοῦ
