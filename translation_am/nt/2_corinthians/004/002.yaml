theological_decisions:
- issue: በአገልግሎት ውስጥ በማታለልና እውነትን በግልጥ በማቅረብ መካከል ያለው ንጽጽር
  choice: ጥቅሱ የሐዋርያዊ አገልግሎትን ግልጽነትና ታማኝነት እንዲገልጥ ተተርጉሟል።
  alternative: ጥቅሱን ስለ ንግግር ዘዴ ብቻ ወይም ስለ መጽሐፍ ቅዱስ አያያዝ ብቻ የተሰጠ ቴክኒካዊ አስተምህሮ አድርጎ መውሰድ።
  rationale: የቅርብ አውዱ የጳውሎስንና የባልደረቦቹን ምግባርና መልእክት በአንድነት ያነጻጽራል፤ ትርጉሙ ጽሑፉ ያልገለጠውን የቡድን ልዩ አስተምህሮ አያስገባም።
