base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/002.yaml
  text: Instead[a], we have renounced the hidden things of shame, not walking in cunning nor falsifying the word of God[b], but by the open display of the truth commending ourselves to every human conscience before God.
translation:
  language: am
  text: ነገር ግን የኀፍረትን ስውር ነገሮች ትተናል፤ በተንኮል ሳንመላለስ፣ የእግዚአብሔርንም ቃል ሳናበላሽ፣[a] ይልቁንም እውነትን በግልጥ በማሳየት፣ በእግዚአብሔር ፊት ራሳችንን ለሰው ሁሉ ሕሊና እናቀርባለን።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የእግዚአብሔርን ቃል አንበርዝም።” የግሪኩ ግስ አንድን ነገር በማታለል መቀየጥን ወይም ማበላሸትን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “እውነትን በግልጥ በማሳየት” የሚለው “እውነትን በመግለጥ” ተብሎም ሊተረጎም ይችላል፤ የግሪኩ ቃል ከቃል ስብከት ብቻ ይልቅ እውነትን ግልጥ ማድረግን ያጎላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπειπάμεθα
  choice: ትተናል
  rationale: የተወሰነና ቆራጥ እምቢታን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል፤ አውዱ ተናጋሪዎቹ እነዚህን ልማዶች እንደተዉ ያሳያል።
- source_word: τὰ κρυπτὰ τῆς αἰσχύνης
  choice: ሰዎች ከኀፍረት የተነሣ በስውር የሚያደርጉትን
  rationale: የግሪኩን የኀፍረትና የመሰወር ግንኙነት በተረዳ አማርኛ ያቀርባል፤ ‘የኀፍረት ስውር ነገሮች’ ከሚለው ቃል በቃል አቀራረብ ይበልጥ ተፈጥሯዊ ነው።
