base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/006.yaml
  text: For God[a], who said[c][b], “Light will shine out of darkness,” has shone in our hearts for the illumination of the knowledge of the glory of God in the face of Messiah.
translation:
  language: am
  text: ምክንያቱም፣ “ብርሃን ከጨለማ ይብራ” ያለው እግዚአብሔር፣ በመሲሑ ፊት ያለውን የእግዚአብሔር ክብር እውቀት ብርሃን ለማብራት፣ በልባችን ውስጥ አበራ።[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በመሲሑ ፊት” የሚለው “በመሲሑ ማንነት” ተብሎም ሊገባ ይችላል። የግሪኩ አባባል በቀጥታ “ፊት” የሚለውን ምስል ይይዛል።
    reason: alternative_reading
  - marker: b
    text: “ብርሃን ከጨለማ ይብራ” የሚለው አባባል ዘፍጥረት 1፥3ን ያስታውሳል፤ የፍጥረትን ብርሃን ምስል እግዚአብሔር በሰዎች ልብ ውስጥ ከሚያደርገው የመገለጥ ሥራ ጋር ያገናኛል።
    reason: cross_reference
lexical_decisions:
- source_word: ὅτι
  choice: ምክንያቱም
  rationale: በዐውዱ ይህ ሐረግ ከቀደመው ንግግር ጋር ምክንያታዊ ግንኙነት ያሳያል፤ ይህም በዘመናዊ አማርኛ ግልጽ ነው።
- source_word: Ἐκ σκότους φῶς λάμψει
  choice: ብርሃን ከጨለማ ይብራ
  rationale: የἐκን የመነሻ ትርጉምና የλάμψειን የወደፊት ጊዜ ይጠብቃል፤ የፍጥረት ብርሃን ምስልንም ያስተላልፋል።
- source_word: ὃς ἔλαμψεν ἐν ταῖς καρδίαις ἡμῶν
  choice: በልባችን ውስጥ አበራ
  rationale: ἔλαμψεν እዚህ በቀጥታ ‘አበራ’ ተብሎ ተተርጉሟል፤ ‘ልብ’ም የውስጣዊ ሰውነትን የሚወክለውን መጽሐፍ ቅዱሳዊ ምሳሌ ይጠብቃል።
- source_word: πρὸς φωτισμὸν τῆς γνώσεως
  choice: የማወቅ ብርሃን እንዲሰጥ
  rationale: ቃል በቃል የሆነው ‘ለእውቀት ማብራት’ በአማርኛ ከባድ ስለሚሆን፣ ዓላማን የሚገልጸው πρὸς በተፈጥሯዊ የግስ አቀራረብ ተሰጥቷል።
- source_word: τῆς δόξης τοῦ θεοῦ
  choice: የእግዚአብሔር ክብር
  rationale: የግሪኩን የባለቤትነት ግንኙነት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐν προσώπῳ Χριστοῦ
  choice: በመሲሑ ፊት
  rationale: πρόσωπον በቀጥታ ‘ፊት’ ማለት ሲሆን፣ በዐውዱ ያሉት የብርሃንና የክብር ምስሎች ይህን ተጨባጭ አተረጓጎም ይደግፋሉ። Χριστός ደግሞ እዚህ እንደ ማዕረግ ‘መሲሕ’ ተብሎ ተተርጉሟል።
theological_decisions:
- issue: የΧριστοῦ አተረጓጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: በዚህ ዐውድ Χριστός እንደ ማዕረግ ስለሚሠራ፣ ትርጉሙን የሚገልጸው ‘መሲሕ’ ተመርጧል።
- issue: የἐν προσώπῳ Χριστοῦ ትርጉም
  choice: በመሲሑ ፊት
  alternative: በመሲሑ ማንነት
  rationale: ‘ፊት’ የሚለው ቀጥተኛ ትርጉም በዐውዱ ያለውን የሚታይ ክብርና ብርሃን ምስል ይጠብቃል፤ ‘ማንነት’ ግን ሊሆን የሚችል ፈሊጣዊ አማራጭ ነው።
