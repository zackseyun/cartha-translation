  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διωκόμενοι
  choice: ስደት ይደርስብናል
  rationale: ቃሉ በጠላትነት መከታተልንና ጭቆናን ያመለክታል፤ ይህ አገላለጽ በዘመናዊ አማርኛ የስደትን ሥቃይ በግልጽ ያስተላልፋል።
- source_word: ἐγκαταλειπόμενοι
  choice: አንተውም
  rationale: በችግር ውስጥ ብቻን መተውን ወይም መጣልን ያሳያል፤ አጭሩ አገላለጽ የግሪኩን ተቃርኖና ምት ይጠብቃል።
- source_word: καταβαλλόμενοι
  choice: ወደ መሬት እንጣላለን
  rationale: ግሱ ወደ ታች መጣልን ወይም መውደቅን ያመለክታል፤ ይህ ምርጫ አካላዊ ትግል የሚመስለውን ምስል በግልጽ ይጠብቃል።
- source_word: ἀπολλύμενοι
  choice: አንጠፋም
  rationale: ከመሬት መጣል ጋር ያለውን ተቃርኖ በማጉላት ፍጹም ጥፋት እንዳልደረሰ ያሳያል።
- source_word: ἀλλ’ οὐκ
  choice: ግን ... አን...ም
  rationale: የግሪኩን ሁለት ሚዛናዊ ተቃርኖዎች በተፈጥሯዊ የአማርኛ አሉታዊ አወቃቀር ያቀርባል።
theological_decisions:
- issue: ἐγκαταλειπόμενοι በሃይማኖታዊ ድምፅ ‘የተጣልን’ ተብሎ ይተረጎም ወይስ በዘመናዊ ንግግር ‘የተተውን’ ተብሎ ይቀርብ?
  choice: አንተውም
  alternative: አንጣልም
  rationale: ጥቅሱ የተለየ ጥቅስ ወይም ስም የተሰጠው መሠረተ ትምህርት አያስገድድም፤ ‘አንተውም’ በችግር ጊዜ ብቻ አለመቅረትን በተፈጥሯዊና ግልጽ አማርኛ ያስተላልፋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ሚዛናዊ ተቃርኖ በሁለቱም ሐረጎች ‘ግን ... አን...ም’ በሚለው አወቃቀር ተጠብቋል።
