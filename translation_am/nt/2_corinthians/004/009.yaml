- from: ስደት ይደርስብናል፣ ግን አንተውም[a]፤ ወደ መሬት እንጣላለን[b]፣ ግን አንጠፋም።
  to: ስደት ቢደርስብንም፣ አንተወንም፤ ወደ መሬት ብንጣልም፣ አንጠፋም።
  rationale: The revision corrects the central voice-and-meaning error by replacing the active «አንተውም» with «አንተወንም» (“we are not abandoned / no one abandons us”). It retains the hostile-oppression sense of διωκόμενοι, the physical-overthrow imagery of καταβαλλόμενοι, and the ultimate-loss sense of ἀπολλύμενοι. Footnotes are omitted because neither alternative is needed to preserve a source ambiguity in the Amharic text.
  reviewer_model: gpt-5.6-terra
