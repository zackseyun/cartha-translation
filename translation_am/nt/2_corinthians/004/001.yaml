  alternative: ምሕረቱን የአገልግሎቱ ብቸኛ ምክንያት አድርጎ መተርጎም
  rationale: καθὼς የንጽጽርን ወይም የተዛማጅነትን ሐሳብ ይይዛል፤ ትርጉሙ ከጽሑፉ በላይ ዝርዝር ሥነ መለኮታዊ ምክንያት አይጨምርም።
