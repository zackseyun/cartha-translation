- source_word: ἠλεήθημεν
  choice: ምሕረትን እንደተቀበልን
  rationale: የግሪኩን ተገብሮ ቅርጽና የምሕረት ተቀባይነት ይጠብቃል።
- source_word: ἐγκακοῦμεν
  choice: ተስፋ አንቆርጥም
