base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/007.yaml
  text: But we have this treasure in clay jars[b][a], so that the surpassing greatness of the power may be of God and not from us.
translation:
  language: am
  text: ነገር ግን፣ ይህን መዝገብ በሸክላ ማሰሮዎች[a] ውስጥ ይዘናል፤ ይህም የኃይል እጅግ ታላቅነት[b] ከእግዚአብሔር እንጂ ከእኛ እንዲሆን ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በሸክላ ዕቃዎች።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “እጅግ ታላቅ የሆነው ኃይል” ወይም “ከሁሉ የሚበልጠው ኃይል።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχομεν
  choice: አለን
  rationale: የአሁን ጊዜ የባለቤትነት ሐሳብን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከቀደመው ሐሳብ ጋር ያለውን ንፅፅርና ሽግግር ይጠብቃል።
- source_word: τὸν θησαυρὸν τοῦτον
  choice: ይህ መዝገብ
  rationale: θησαυρός የሚያመለክተውን ውድ ሀብት ይገልጣል፤ አመልካቹም ወደ ቀደመው አውድ እንዲያመለክት ተጠብቋል።
- source_word: ἐν ὀστρακίνοις σκεύεσιν
  choice: በሸክላ ማሰሮዎች ውስጥ
  rationale: ὀστράκινος ከተጠበሰ ሸክላ የተሠራን፣ σκεῦος ደግሞ ዕቃን ወይም መያዣን ያመለክታል፤ ይህ አተረጓጎም ደካማነትንና በቀላሉ መሰበርን የሚያሳየውን ምስል በዘመናዊ ቋንቋ ይጠብቃል።
- source_word: ἵνα
  choice: እንዲሆን ነው
  rationale: የዓላማን ሐሳብ በተፈጥሯዊ የአማርኛ አገባብ ያስተላልፋል፤ የውጤት ጥላውንም አያስወግድም።
- source_word: ἡ ὑπερβολὴ τῆς δυνάμεως
  choice: የኃይሉ እጅግ ታላቅነት
  rationale: የግሪኩን የስም ሐረግ አወቃቀር በመጠበቅ ὑπερβολή የሚገልጠውን ከመደበኛው በላይ የሆነ መጠን ያሳያል።
- source_word: τοῦ θεοῦ καὶ μὴ ἐξ ἡμῶν
  choice: ከእግዚአብሔር እንጂ ከእኛ
  rationale: የኃይሉን ምንጭ በተመለከተ በእግዚአብሔርና በእኛ መካከል ያለውን ግልጽ ንፅፅር ይጠብቃል።
theological_decisions:
- issue: የ“መዝገብ” እና የ“ሸክላ ማሰሮዎች” ዘይቤ
  choice: ዘይቤውን ሳይተረጉሙ በዋናው ጽሑፍ ማቆየት
  alternative: “የወንጌል መዝገብ” ወይም “በደካማ ሰውነታችን” ብሎ በትርጓሜ ማስፋት
  rationale: አውዱ የዘይቤውን ፍቺ ቢያብራራም፣ ይህ ቁጥር ራሱ ምስላዊ አነጋገሩን ክፍት ይተዋል።
- issue: የἵνα አንቀጽ ኃይል
  choice: ዓላማን በሚያሳይ “እንዲሆን ነው” መተርጎም
  alternative: እንደ ንጹሕ ውጤት “በዚህም ... ሆነ” ብሎ መተርጎም
  rationale: ἵνα የውጤት ጥላ ሊኖረው ቢችልም፣ በዚህ ስፍራ የዓላማ ንባቡ ተፈጥሯዊ ሲሆን አንቀጹን ከልክ በላይ አይወስንም።
- issue: τοῦ θεοῦ እና ἐξ ἡμῶν የሚያሳዩት ምንጭ
  choice: “ከእግዚአብሔር እንጂ ከእኛ” በማለት የምንጭ ንፅፅሩን ማሳየት
  alternative: “የእግዚአብሔር እንጂ የእኛ አይደለም”
  rationale: ἐξ በግልጽ ምንጭን ያመለክታል፤ የአማርኛው “ከ” ይህን ሐሳብ እና ንፅፅሩን በቀጥታ ያቆያል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። “መዝገብ” የተሰኘው ቃል ዘይቤውን ይጠብቃል፤ “የሸክላ ማሰሮዎች” ደግሞ ከጥንታዊው የሸክላ መያዣ ምስል ጋር ተስማሚ ሆኖ በዘመናዊ አጠቃቀም ተፈጥሯዊ ነው።
