  text: Ἔχοντες δὲ τὸ αὐτὸ πνεῦμα τῆς πίστεως, κατὰ τὸ γεγραμμένον· Ἐπίστευσα, διὸ ἐλάλησα, καὶ ἡμεῖς πιστεύομεν, διὸ καὶ λαλοῦμεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/013.yaml
  text: But having the same spirit of faith[a], according to what is written, “I believed; therefore I spoke,” we also believe; therefore we also speak[b],
translation:
  language: am
  text: ነገር ግን፣ ተብሎ እንደተጻፈው፣ “አመንሁ፤ ስለዚህ ተናገርሁ፤” እኛም ያንኑ የእምነት መንፈስ ይዘን እናምናለን፤ ስለዚህም እንናገራለን።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔχοντες δὲ
  choice: ነገር ግን … ስላለን
  rationale: የአሁን ጊዜውን አሳታፊ ግስ ከዋናው ግስ ጋር በተፈጥሯዊ የአማርኛ ምክንያታዊ አገናኝ ያስተሳስራል፤ δὲ የሚያሳየውን መጠነኛ ንጽጽርም ‘ነገር ግን’ ይጠብቃል።
- source_word: τὸ αὐτὸ πνεῦμα τῆς πίστεως
  choice: ያንኑ የእምነት መንፈስ
  rationale: αὐτό የሚያሳየውን አንድነትና የግሪኩን የዘርፍ ግንኙነት ይጠብቃል። ‘መንፈስ’ በአማርኛ የውስጥ ዝንባሌንም ሆነ መንፈስ ቅዱስን ሊያመለክት ስለሚችል የምንጩን አሻሚነት አያጠፋም።
- source_word: κατὰ τὸ γεγραμμένον
  choice: ተብሎ እንደተጻፈው
  rationale: የቅዱስ መጽሐፍ ጥቅስን የሚያስተዋውቀውን የተለመደ አገላለጽ በግልጽና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: Ἐπίστευσα, διὸ ἐλάλησα
  choice: አመንሁ፤ ስለዚህ ተናገርሁ
  rationale: የπιστεύω እና λαλέω ቀጥተኛ ትርጉምንና διό የሚያሳየውን ውጤታዊ አመክንዮ ይጠብቃል።
- source_word: καὶ ἡμεῖς πιστεύομεν, διὸ καὶ λαλοῦμεν
  choice: እኛም … እናምናለን፤ ስለዚህም እንናገራለን
  rationale: ἐγώ/ἡμεῖς ያለውን ትይዩነትና በሁለተኛው καί ያለውን ‘እንዲሁም’ ኃይል በአማርኛው ‘-ም’ ይገልጣል።
theological_decisions:
- issue: πνεῦμα እዚህ መንፈስ ቅዱስን ወይስ በእምነት የተሞላ የጋራ ውስጣዊ ዝንባሌን ያመለክታል?
  choice: ዋናው ጽሑፍ ‘የእምነት መንፈስ’ በማለት አሻሚነቱን ጠብቋል፤ በአውዱ ግን የጋራ የእምነት ዝንባሌ ቀዳሚ ነው።
  alternative: ‘ያንኑ እምነትን የሚሰጥ መንፈስ ቅዱስ’ ተብሎ ሊገባ ይችላል።
  rationale: ጥቅሱ ‘አመንሁ፤ ስለዚህ ተናገርሁ’ በሚለው የመዝሙረኛው ተሞክሮ ከጳውሎስ ጋር ያገናኛል፤ ሆኖም ግሪኩ መንፈስ ቅዱስን እንዳይሆን አያስወግድም።
- issue: የπιστ- ቃላት ቡድን አተረጓጎም
  choice: እምነት / አመንሁ / እናምናለን
  alternative: መታመን / ታመንሁ / እንታመናለን
  rationale: ‘እምነት/ማመን’ የስምና የግስ ግንኙነቱን በተፈጥሯዊ ዘመናዊ አማርኛ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ረጅም አረፍተ ነገርና ትይዩ አመክንዮ ተጠብቋል፤ የአማርኛ ተፈጥሯዊ የግስ መጨረሻ አወቃቀር ምክንያት የጥቅሱ መግቢያ ቀድሞ ተቀምጧል።
