base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/016.yaml
  text: Therefore we do not lose heart. But even if our outer man is wasting away[a], yet our inner man is being renewed day by day.
translation:
  language: am
  text: ስለዚህ ተስፋ አንቆርጥም። ነገር ግን፣ ውጫዊው ሰዋችን እየተበላሸ ቢሄድም፣ ውስጣዊው ሰዋችን[a] ግን ቀን በቀን እየታደሰ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ውጫዊው ማንነታችን” እና “ውስጣዊው ማንነታችን።” ግሪኩ “ሰው” የሚለውን ቃል በወካይ ፍቺ ተጠቅሞ፣ በሰው ውጫዊና ውስጣዊ ሕይወት መካከል ሆን ብሎ የተደረገ ንጽጽር ያቀርባል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: ስለዚህ
  rationale: ከቀደመው ሐሳብ የሚወጣውን ድምዳሜ በተፈጥሯዊና ግልጽ አማርኛ ያሳያል።
- source_word: οὐκ ἐγκακοῦμεν
  choice: ተስፋ አንቆርጥም
  rationale: በጳውሎስ አጠቃቀም ያለውን አለመድከምና ድፍረትን አለማጣት የሚለውን ፍቺ በተለመደ አማርኛ ይገልጣል።
- source_word: ἀλλ’ εἰ καὶ
  choice: ቢሄድም
  rationale: ሁኔታውን እውነተኛ ወይም የታወቀ ነገር አድርጎ የሚቀበለውን አ concessive ኃይል በአማርኛው -ም ቅጥያ ይጠብቃል።
- source_word: ὁ ἔξω ἡμῶν ἄνθρωπος
  choice: ውጫዊው ሰውነታችን
  rationale: በዘመናዊ አማርኛ የሚሰማ ሲሆን የሚታየውንና ለመበስበስ የተጋለጠውን የሰው ውጫዊ ሕይወት ይጠቁማል፤ የግሪኩን ሰው-ተኮር ንጽጽር በአማራጭ ማስታወሻ ያቆያል።
- source_word: διαφθείρεται
  choice: እየተበላሸ ቢሄድም
  rationale: የአሁን ጊዜ ተደራጊ ቅርጹንና ቀጣይ የመዳከም/የመበላሸት ሂደትን ያሳያል፤ ፍጹም ጥፋትን አያስገባም።
- source_word: ὁ ἔσω ἡμῶν
  choice: ውስጣዊው ማንነታችን
  rationale: ከውጫዊው ሰው ጋር ያለውን ሆን ተብሎ የተደረገ ንጽጽር በተፈጥሯዊ አማርኛ ያቀርባል፣ ያልተገለጸ ቴክኒካዊ የነፍስና የሥጋ ክፍፍልም አያስገባም።
- source_word: ἀνακαινοῦται
  choice: እየታደሰ ነው
  rationale: የቀጠለ ተደራጊ መታደስን በግልጽ ያሳያል።
- source_word: ἡμέρᾳ καὶ ἡμέρᾳ
  choice: ቀን በቀን
  rationale: ተደጋጋሚና ቀጣይ መሆኑን የሚገልጥ ተፈጥሯዊ የአማርኛ አባባል ነው።
theological_decisions:
- issue: በὁ ἔξω ἄνθρωπος እና በὁ ἔσω መካከል ያለው ሰዋዊ ንጽጽር
  choice: “ውጫዊው ሰውነታችን” እና “ውስጣዊው ማንነታችን” ተብሎ ተተርጉሟል።
  alternative: “ውጫዊው ሰዋችን” እና “ውስጣዊው ሰዋችን”
  rationale: ዋናው ጽሑፍ ለዘመናዊ አንባቢ ተፈጥሯዊ ሆኖ ውጫዊ መዳከምንና ውስጣዊ መታደስን ያነጻጽራል። ሆኖም ግሪኩ ἄνθρωποςን በወካይ ፍቺ መጠቀሙና ሆን ብሎ ያቆመው ትይዩ ንጽጽር በማስታወሻው ተጠብቋል፤ ጥቅሱ ከሚናገረው በላይ የሥጋና የነፍስ ሥርዓተ አስተምህሮ አልተጫነበትም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር አማርኛ ተጠቅሟል። “ተስፋ አንቆርጥም” የግሪኩን ፈሊጣዊ ፍቺ በተለመደ አነጋገር ያቀርባል፤ “ቀን በቀን” ደግሞ የሂደቱን ቀጣይነት ይጠብቃል።
