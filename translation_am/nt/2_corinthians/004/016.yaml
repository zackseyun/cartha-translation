  rationale: The revision restores the source’s outer/inner human parallel, avoids interpreting the outer term as only the body and the inner term as a distinct technical “identity,” and explicitly represents the adversative-concessive transition. The footnote is revised to match the corrected main text and retains a natural Amharic alternative without imposing a body-soul theory.
