  text: because we know that the one who raised Jesus will also raise us with Jesus and will present us with you[a].
translation:
  language: am
  text: ኢየሱስን[a] ያስነሣው እርሱ እኛንም ከኢየሱስ ጋር እንደሚያስነሣንና ከእናንተ ጋር እንደሚያቀርበን ስለምናውቅ፣ ይህን እናደርጋለን።
  philosophy: optimal-equivalence
  footnotes:
