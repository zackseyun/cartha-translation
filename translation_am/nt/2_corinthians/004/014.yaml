    text: አንዳንድ የእጅ ጽሑፎች “ጌታ ኢየሱስን” ይላሉ።
    reason: textual_variant
lexical_decisions:
- source_word: εἰδότες
  choice: ስለምናውቅ ነው
  rationale: የግሪኩ አሳቢ ግስ በዐውዱ የጳውሎስን ጽናት ምክንያት ያሳያል፤ ይህ አተረጓጎም የምክንያት ኃይሉን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὁ ἐγείρας
  choice: ያስነሣው እርሱ
  rationale: አድራጊውን በግሪኩ እንደተገለጠው ሳይሰይም፣ ኢየሱስን ያስነሣውን ይጠቅሳል።
- source_word: τὸν Ἰησοῦν
  choice: ኢየሱስን
  rationale: ዋናውን የSBLGNT ንባብ በቀጥታ ይከተላል፤ “ጌታ” ያለበት ንባብ በማስታወሻ ተጠብቋል።
- source_word: καὶ ἡμᾶς
  choice: እኛንም ... እንደሚያስነሣን
  rationale: “ም” የሚለው ቅጥያ የκαίን ጨማሪ ኃይል ጠብቆ፣ የኢየሱስንና የአማኞችን ትንሣኤ ያያይዛል።
- source_word: σὺν Ἰησοῦ
  choice: ከኢየሱስ ጋር
  rationale: σύν የአብሮነትን ትርጉም ያሳያል፤ የመሣሪያ ትርጉም አይጨመርም።
- source_word: παραστήσει
  choice: እንደሚያቀርበን
  rationale: ግሱ በፊት ማቅረብን ሊያመለክት ሲችል፣ የማቅረቡን ቦታ ወይም ሁኔታ ግን ከግሪኩ በላይ አይወስንም።
- source_word: σὺν ὑμῖν
  choice: ከእናንተ ጋር
  rationale: የጳውሎስና የቆሮንቶስ አማኞችን የጋራ ተስፋ በተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: ἐγείρας ተከትሎ ያለው የጽሑፍ ልዩነት
  choice: በዋናው ጽሑፍ “ኢየሱስን” የሚለውን የSBLGNT ንባብ መከተል
  alternative: “ጌታ ኢየሱስን”
  rationale: ልዩነቱ የጽሑፍ ምስክሮች ጉዳይ እንጂ የትምህርት ልዩነት አይደለም፤ ረዘም ያለው ንባብ በማስታወሻ ተገልጧል።
- issue: የπαραστήσει የመጨረሻው ዘመን ኃይል
  choice: ከትንሣኤው በኋላ ጳውሎስና ቆሮንቶሳውያን በአንድነት እንደሚቀርቡ በሰፊው መግለጽ
  alternative: ይህን በተለይ በፍርድ ፊት መቅረብ ወይም አጠቃላይ ነፃ መውጣት ብሎ መወሰን
  rationale: ዐውዱ የወደፊቱን ትንሣኤና መቅረብ ያመለክታል፤ ግሪኩ ግን የመቅረቡን ትክክለኛ መድረክ አይገልጥም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለመደበኛ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ አሳቢ ግስ የምክንያት ኃይል በአማርኛ ዋና ዐረፍተ ነገር አወቃቀር ተገልጧል።
