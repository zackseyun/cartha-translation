  text: always carrying in the body the death of Jesus[a], so that the life of Jesus may also be revealed in our body.
translation:
  language: am
  text: የኢየሱስን ሞት[a] ሁልጊዜ በሰውነት እየተሸከምን ነን፤ የኢየሱስ ሕይወትም በሰውነታችን እንዲገለጥ ዘንድ።
  philosophy: optimal-equivalence
  footnotes:
