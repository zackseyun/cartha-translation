    text: ወይም፣ «የኢየሱስን መሞት»። የግሪኩ ስም በሰውነት የሚሸከሙትን የሞት ሁኔታ ወይም ተሞክሮ አጉልቶ ሊያሳይ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: ሁልጊዜ
  rationale: ቀጣይነት ያለውን ሁኔታ በተፈጥሯዊና በግልጽ ዘመናዊ አማርኛ ይገልጣል።
- source_word: νέκρωσιν
  choice: ሞት
  rationale: ቃሉ የሞትን ሁኔታ ወይም ተሞክሮ ሊያመለክት ይችላል፤ «ሞት» ከ«ሕይወት» ጋር ያለውን ትይዩነት ይጠብቃል፣ አማራጩም በእግር ማስታወሻ ቀርቧል።
- source_word: τοῦ Ἰησοῦ
  choice: የኢየሱስን
  rationale: የግሪኩን የባለቤትነት አገናኝ ሳይጠብብ ይጠብቃል፤ ሞቱ ከኢየሱስ ጋር ያለውን ትክክለኛ ግንኙነት ትርጉሙ አይጨምርበትም።
- source_word: ἐν τῷ σώματι
  choice: በሰውነት
  rationale: በመጀመሪያው ሐረግ ግልጽ የሆነ የባለቤትነት ተውላጠ ስም ስለሌለ፣ «በሰውነታችን» ብሎ በመጨመር ከሁለተኛው ሐረግ ጋር አልተስማማም።
- source_word: περιφέροντες
  choice: እየተሸከምን
  rationale: የአሁን ጊዜውን ቀጣይ ድርጊትና በሰውነት የመሸከምን ምሳሌያዊ አገላለጽ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἵνα
  choice: ይህም … እንዲ… ነው
  rationale: የዓላማን ወይም የውጤትን ግንኙነት ግልጽና ተነባቢ በሆነ የአማርኛ አወቃቀር ይገልጣል።
- source_word: καὶ
  choice: ደግሞ
  rationale: በኢየሱስ ሞትና ሕይወት መካከል ያለውን ተጓዳኝ ጭማሪ ያሳያል።
- source_word: ζωὴ
  choice: ሕይወት
  rationale: ቀጥተኛና በዐውዱ ውስጥ ግልጽ ትርጉም ነው፤ የተነሣውን የኢየሱስ ሕይወት ያመለክታል።
- source_word: ἐν τῷ σώματι ἡμῶν
  choice: በሰውነታችን
  rationale: የግሪኩን ነጠላ «ሰውነት» ከብዙ ባለቤት ጋር በአማርኛ ይጠብቃል፤ ይህም የጋራ ሐዋርያዊ አገልግሎትን ንግግራዊ ኃይል ያቆያል።
- source_word: φανερωθῇ
  choice: እንዲገለጥ
  rationale: የዓላማውን ንዑስ ሐረግና የተደራጊ ቅርጹን በግልጽ ዘመናዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: νέκρωσις ከኢየሱስ ጋር ያለው ትርጉም
  choice: «የኢየሱስ ሞት»
  alternative: «የኢየሱስ መሞት»
  rationale: ሁለቱም በዐውዱ ሊቻሉ ቢችሉም፣ «ሞት» የስሙን መዝገበ ቃላዊ ክልልና ከ«ሕይወት» ጋር ያለውን ትይዩነት በተሻለ ይጠብቃል። አማራጩ ግን በእግር ማስታወሻ ተጠብቋል።
- issue: የσῶμα ቁጥር
  choice: በሁለቱም ሐረጎች ነጠላ «ሰውነት»ን መጠበቅ
  alternative: ሁለተኛውን «በሰውነቶቻችን» ብሎ ማብዛት
  rationale: ግሪኩ በሁለቱም ቦታዎች ነጠላ ቁጥር ይጠቀማል። ነጠላውን መጠበቅ የንግግሩን ትይዩነትና የጋራ ሰውነታዊ አገልግሎት ስሜት ያቆያል።
