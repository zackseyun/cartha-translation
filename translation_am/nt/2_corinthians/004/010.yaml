  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ አማርኛ ተጠቅሟል። «እየተሸከምን» የግሪኩን ቀጣይ ድርጊት በተፈጥሯዊ አገላለጽ ይይዛል፤ የሰውነት ነጠላ ቁጥርና የሞት/ሕይወት ትይዩነት ተጠብቀዋል።
