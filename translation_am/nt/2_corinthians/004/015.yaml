  yaml_path: translation/nt/2_corinthians/004/015.yaml
  text: For all things are for your sake[a], so that as grace increases through more and more people, thanksgiving may overflow to the glory of God.
translation:
  language: am
  text: ሁሉም ነገር ስለ እናንተ ነውና፤ ይህም ጸጋው ቁጥራቸው እየበዛ በሚሄዱ ሰዎች በኩል እየበዛ፣ ምስጋናን ለእግዚአብሔር ክብር እንዲያበዛ ነው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ πάντα
  choice: ሁሉም ነገር
  rationale: የግሪኩን ሁሉን አቀፍ አገላለጽ ሳያጠብ በዘመናዊ አማርኛ ተፈጥሯዊ ሆኖ ያቀርባል።
- source_word: γὰρ
  choice: ነውና
  rationale: ከቀደመው ሐሳብ ጋር ያለውን የምክንያትና የማብራሪያ ግንኙነት ያሳያል።
- source_word: δι’ ὑμᾶς
  choice: ስለ እናንተ
  rationale: ነገሮቹ ለተቀባዮቹ ጥቅም ወይም ሲባል እንደሆነ የሚያሳየውን διά ከተሳቢ ጋር ያለውን ኃይል በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἵνα
  choice: ይህም … እንዲ… ነው
  rationale: የዓላማ ወይም የውጤት ግንኙነቱን በግልጽ የአማርኛ አወቃቀር ያስተላልፋል።
- source_word: ἡ χάρις
  choice: ጸጋው
  rationale: የተወሰነ መስተዋድድ ያለውን የግሪክ ስም ይከተላል፤ የእግዚአብሔርን ቸርነትና በሥራ ላይ ያለ ስጦታውን ሳያጠብ ይጠብቃል።
- source_word: πλεονάσασα
  choice: እየበዛ
  rationale: ከዋናው ግስ ጋር የተያያዘውን የጸጋ መብዛት በፈሳሽና ተፈጥሯዊ የአማርኛ ተውሳከ ግስ ያቀርባል።
- source_word: διὰ τῶν πλειόνων
  choice: ቁጥራቸው እየጨመረ በሚሄድ ሰዎች አማካይነት
  rationale: በንጽጽር ደረጃ የቀረበውን πλειόνων እየጨመረ ያለ የሰዎች ቁጥር በሚል አገባብ ያሳያል፤ ሌሎቹ ሊሆኑ የሚችሉ ንባቦች በማስታወሻ ተጠብቀዋል።
- source_word: τὴν εὐχαριστίαν
  choice: ምስጋና
  rationale: ወደ እግዚአብሔር የሚቀርበውን ምስጋና በተለመደና ግልጽ ቃል ይገልጣል።
- source_word: περισσεύσῃ
  choice: እንዲትረፈረፍ
  rationale: ግሱ የሚገልጠውን ከመጠን በላይ መብዛት በጠንካራና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: εἰς τὴν δόξαν τοῦ θεοῦ
  choice: ለእግዚአብሔር ክብር
