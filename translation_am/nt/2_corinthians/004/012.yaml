  text: ὥστε ⸀ὁ θάνατος ἐν ἡμῖν ἐνεργεῖται, ἡ δὲ ζωὴ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/012.yaml
  text: So then[a], death is at work in us, but life in you.
translation:
  language: am
  text: ስለዚህ ሞት በእኛ ውስጥ እየሠራ ነው፤ ሕይወት ግን በእናንተ ውስጥ እየሠራች ነው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: ስለዚህ
  rationale: ከቀደመው ሐሳብ የሚመጣውን ውጤት ወይም ድምዳሜ በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: ὁ θάνατος
  choice: ሞት
  rationale: የግሪኩ መስተዋድድ በአማርኛ ከአጠቃላይ ስም ጋር መገለጽ አያስፈልገውም፤ ‘ሞት’ የሐዋርያትን ለሞት የሚያጋልጥ መከራ እንደሚሠራ ያለ ተግባራዊ እውነታ ይጠብቃል።
- source_word: ἐν ἡμῖν
  choice: በእኛ ውስጥ
  rationale: የἐν ቀጥተኛውን ግንኙነትና በሐዋርያት እና በቆሮንቶስ ሰዎች መካከል ያለውን ትይዩ ንጽጽር ይጠብቃል።
- source_word: ἐνεργεῖται
  choice: ይሠራል / ትሠራለች
  rationale: ቀጣይና ውጤታማ እንቅስቃሴን በተፈጥሯዊ አማርኛ ያሳያል፤ ግሱ በሁለተኛው ክፍል በግሪኩ በግልጽ ባይደገምም በአማርኛ ለግልጽነት ተደግሟል።
- source_word: ἡ δὲ ζωὴ
  choice: ሕይወት ግን
  rationale: δέ በሞትና በሕይወት መካከል ያለውን ግልጽ ተቃርኖ ያመለክታል፤ ‘ግን’ ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐν ὑμῖν
  choice: በእናንተ ውስጥ
  rationale: ከ‘በእኛ ውስጥ’ ጋር ያለውን አጭርና ቀጥተኛ ትይዩነት ይጠብቃል፤ ግላዊና ማኅበራዊ ትርጉሙንም ክፍት ያደርጋል።
theological_decisions:
- issue: የሞትና የሕይወት ንጽጽር ትርጉም
  choice: ጳውሎስ ሐዋርያት የሚቀበሉትን ለሞት የሚያጋልጥ መከራ በአገልግሎታቸው ለቆሮንቶስ ሰዎች ከሚደርሰው ሕይወት ጋር ያነጻጽራል፤ አነጋገሩ በአካላዊ ወይም በመንፈሳዊ ትርጉም ብቻ አልተገደበም።
  alternative: ለሐዋርያት አካላዊ ሞት ብቻ እና ለቆሮንቶስ ሰዎች አካላዊ ጥበቃ ብቻ፤ ወይም ለሐዋርያት መንፈሳዊ ራስን መካድ ብቻ እና ለቆሮንቶስ ሰዎች ዘላለማዊ ሕይወት ብቻ።
  rationale: ቁጥር 10–11 የኢየሱስን ሞትና ሕይወት በሐዋርያት ሰውነት መገለጥ ይናገራል፤ ሰፊው አውድም ለሌሎች ሕይወትን ስለሚያደርስ አገልግሎት ነው። ስለዚህ ‘ሞት’ና ‘ሕይወት’ የሚሉት አጭር ቃላት ያለ ትርጓሜያዊ ማጥበብ ተጠብቀዋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። የግሪኩን አጭር ተቃርኖ ለመጠበቅ ሁለቱ ክፍሎች ትይዩ ሆነው ቀርበዋል፤ በሁለተኛው ክፍል የተገመተው ግስ በአማርኛ ለተፈጥሯዊነትና ለግልጽነት ተደግሟል።
