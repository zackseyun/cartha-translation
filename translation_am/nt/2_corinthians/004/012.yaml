review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the inferential force of ὥστε, the death/life antithesis, and the parallel locations ‘in us/in you.’ However, ἐνεργεῖται denotes present ongoing effective activity; the simple forms ይሠራል / ትሠራለች can naturally be read as habitual or future in modern Amharic. A progressive construction more clearly represents the Greek aspect.
  naturalness: The wording is clear and appropriately dignified. Recasting the verbs as እየሠራ ... ነው makes the intended ongoing sense more natural and explicit in contemporary standard Amharic.
  terminology: ሞት and ሕይወት are correct, theologically noninterpretive renderings. ስለዚህ and ግን suitably convey the inferential and contrastive connections. The supplied second verb is acceptable for Amharic clarity.
  issues:
  - severity: low
    issue: The finite verbs ይሠራል / ትሠራለች do not explicitly mark the ongoing activity of ἐνεργεῖται.
    rationale: Although they can be understood in a general-present sense, they may also suggest habitual or future action. The progressive construction preserves the source's present, active-operational sense more directly.
  revised_text: ስለዚህ ሞት በእኛ ውስጥ እየሠራ ነው፤ ሕይወት ግን በእናንተ ውስጥ እየሠራች ነው።
