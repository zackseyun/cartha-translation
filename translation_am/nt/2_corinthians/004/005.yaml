  to: እኛ የምንሰብከው ራሳችንን አይደለም፤ መሲሕ ኢየሱስ ጌታ መሆኑን እንጂ፣ ራሳችንንም ስለ ኢየሱስ ስንል የእናንተ ባሪያዎች መሆናችንን ነው።
