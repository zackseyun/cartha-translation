  text: οὐ γὰρ ἑαυτοὺς κηρύσσομεν ἀλλὰ ⸂Χριστὸν Ἰησοῦν⸃ κύριον, ἑαυτοὺς δὲ δούλους ὑμῶν διὰ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/005.yaml
  text: For we do not proclaim ourselves[a], but Messiah Jesus as Lord[c][b], and ourselves as your servants for Jesus' sake.
translation:
  language: am
  text: እኛ የምንሰብከው ራሳችንን አይደለም፤ መሲሕ ኢየሱስ ጌታ መሆኑን እንጂ፣ ራሳችንንም ስለ ኢየሱስ ስንል የእናንተ ባሪያዎች መሆናችንን ነው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κηρύσσομεν
  choice: እንሰብካለን
  rationale: ቃሉ መልእክትን በአደባባይ ማወጅን ያመለክታል፤ «መስበክ» በዘመናዊ አማርኛ ተፈጥሯዊና ለዚህ አውድ ተስማሚ ነው።
- source_word: ἑαυτοὺς
  choice: ራሳችንን
  rationale: ተውላጠ ስሙ በግሪኩ ሁለት ጊዜ በመደገሙ የጳውሎስንና የባልደረቦቹን ሚና ከስብከታቸው ይዘት ይለያል፤ ድግግሞሹ በትርጉሙም ተጠብቋል።
- source_word: Χριστὸν Ἰησοῦν
  choice: መሲሑ ኢየሱስ
  rationale: Χριστός እዚህ የተቀባውን ንጉሥ የሚጠቁም ማዕረግ ሆኖ ስለሚሠራ «መሲሕ» ተብሏል፤ የግሪኩ ቅደም ተከተልም ተጠብቋል።
- source_word: κύριον
  choice: ጌታ
  rationale: በዚህ ሐረግ የሚሰበከው ስለ ኢየሱስ ጌትነት ነው፤ «ጌታ» የκύριοςን ክብርና ሥልጣን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δούλους
  choice: ባሪያዎች
  rationale: δοῦλος ከተራ አገልጋይነት ይልቅ ጠንካራ የበታችነትና የባለቤትነት ግንኙነትን ሊገልጥ ይችላል፤ ከ«ጌታ» ጋር ያለውን ሆን ተብሎ የተደረገ ንጽጽር ለመጠበቅ «ባሪያዎች» ተመርጧል።
- source_word: ὑμῶν
  choice: የእናንተ
  rationale: ከδοῦλοι ጋር ያለው የባለቤትነት ቅርጽ ወደ ቆሮንቶስ ሰዎች ያቀናውን ትሑት አገልግሎት በቀጥታ ይገልጣል።
- source_word: διὰ Ἰησοῦν
  choice: ስለ ኢየሱስ ስንል
  rationale: διά ከአኩዛቲቭ ጋር እዚህ ምክንያትን ወይም ተነሳሽነትን ያመለክታል፤ የአማርኛው ሐረግ «ለኢየሱስ ሲባል» የሚለውን ሐሳብ በተፈጥሯዊ መንገድ ይገልጣል።
theological_decisions:
- issue: Χριστός እንደ ማዕረግ ወይም እንደ ስም መተርጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: በዚህ አውድ Χριστός ስለ ኢየሱስ የሚታወጀውን ማንነት የሚገልጥ ማዕረግ ነው፤ ስለዚህ «መሲሑ» የማዕረጉን ኃይል ይጠብቃል።
- issue: Χριστὸν Ἰησοῦν κύριον የሚለው ሐረግ አወቃቀር
  choice: መሲሑ ኢየሱስ ጌታ መሆኑን
  alternative: ጌታውን መሲሑን ኢየሱስን
  rationale: κύριον ኢየሱስን በጌትነት የሚገልጥ ትንቢታዊ ሙላት መሆኑን በግልጽና ተፈጥሯዊ አማርኛ ያሳያል፤ የግሪኩን ኑዛዜ አያሰፋም።
- issue: δοῦλοι የሚያመለክተው የበታችነት መጠን
  choice: ባሪያዎች
  alternative: አገልጋዮች
  rationale: ከኢየሱስ «ጌታ» መሆን ጋር የተደረገውን ጠንካራ ንጽጽርና የሐዋርያቱን ራስ ዝቅ ማድረግ ይጠብቃል፤ አማራጩ ግን በአንዳንድ አውዶች ተፈጥሯዊ ቢሆንም የቃሉን ኃይል ሊያለዝብ ይችላል።
