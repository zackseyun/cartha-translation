  - severity: medium
    issue: The gospel/glory relation is recast too specifically.
    rationale: '''የመሲሑን ክብር የሚያበስረው'' interprets the genitive chain as ''that proclaims the Messiah''s glory.'' This is plausible, but a closer Amharic construction can retain the source''s layered relation without adding the verbal idea ''proclaims.'''
