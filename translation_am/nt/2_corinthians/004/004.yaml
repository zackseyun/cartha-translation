  yaml_path: translation/nt/2_corinthians/004/004.yaml
  text: In their case[a], the god of this age has blinded the minds of the unbelieving, so that the light of the gospel of the glory of Messiah, who is the image of God[c][b], might not shine on them.
translation:
  language: am
  text: በእነርሱ ረገድ፣ የዚህ ዘመን አምላክ[b] የማያምኑ ሰዎችን አእምሮ አሳውሯል፤ ይህም የእግዚአብሔር አምሳል የሆነው የመሲሑ ክብር የምሥራች ብርሃን እንዳይበራላቸው ነው[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የእግዚአብሔር አምሳል የሆነው የመሲሑ ክብር የምሥራች ብርሃን እንዳያዩ”። እዚህ ያለው ብርቅ ግስ ብርሃኑ ማብራቱን ወይም እነርሱ ብርሃኑን ማየታቸውን ሊያጎላ ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “የዚህ ዓለም አምላክ”። የግሪክኛው αἰών በአብዛኛው “ዘመን” ማለት ሲሆን፣ እዚህ አሁን ያለውን የወደቀ ዘመን ያጎላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν οἷς
  choice: በእነርሱ ረገድ
  rationale: ሐረጉ በቀደመው አውድ የተጠቀሱትን የማያምኑ ሰዎች ያመለክታል፤ ይህ አተረጓጎም ምሥጢራዊ መኖርን ሳያመለክት የሐረጉን ማጣቀሻ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὁ θεὸς τοῦ αἰῶνος τούτου
  choice: የዚህ ዘመን አምላክ
  rationale: αἰών እዚህ የተፈጠረውን ዓለም ሳይሆን አሁን ያለውን ዘመን ያጎላል፤ ጽሑፉ የማንነት ስም ስለማይሰጥ ትርጉሙም ስም አይጨምርም።
- source_word: ἐτύφλωσεν
  choice: አሳውሮታል
  rationale: የተፈጸመውን ድርጊትና አሁን ያለውን ውጤት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τὰ νοήματα τῶν ἀπίστων
  choice: የማያምኑትን አእምሮ
  rationale: νόημα በዚህ አውድ የተናጠል ሐሳቦችን ሳይሆን የማስተዋል ችሎታን ያመለክታል፤ ἀπίστων ደግሞ የማያምኑትን ሰዎች ይጠቁማል።
- source_word: εἰς τὸ μὴ αὐγάσαι
  choice: እንዳያበራላቸው
  rationale: የዓላማን ወይም የውጤትን ግንኙነት ይጠብቃል፤ ብርሃኑ በእነርሱ ላይ እንዳያበራ የሚለውን ንባብ በዋናው ጽሑፍ ያቀርባል።
- source_word: τὸν φωτισμὸν τοῦ εὐαγγελίου
  choice: የምሥራች ብርሃን
  rationale: የብርሃን ዘይቤውን በግልጽና በተለመደ አማርኛ ይጠብቃል።
- source_word: τῆς δόξης τοῦ Χριστοῦ
  choice: የመሲሑን ክብር የሚያበስረው
  rationale: በግሪክኛው ያለውን የስሞች ተከታታይ ግንኙነት በሚነበብ አማርኛ ያቀርባል፤ የምሥራቹ ይዘት የመሲሑ ክብር መሆኑን ያሳያል።
- source_word: ὅς ἐστιν εἰκὼν τοῦ θεοῦ
  choice: የእግዚአብሔር አምሳል የሆነውን
  rationale: ስለ መሲሑ የተነገረውን ቀጥተኛ መግለጫ ያለ ሥነ መለኮታዊ ማስፋፊያ ይጠብቃል።
theological_decisions:
- issue: “የዚህ ዘመን አምላክ” የሚለው ማንን እንደሚያመለክት
  choice: ጽሑፉ እንዳለው “የዚህ ዘመን አምላክ” ተብሎ ተተርጉሟል።
  alternative: “ሰይጣን” ብሎ በግልጽ መሰየም፣ ወይም ግላዊነት የሌለው የዓለም ሥርዓት አድርጎ መውሰድ።
  rationale: ሐረጉ በተለምዶ የግል ክፉ ኃይልን እንደሚጠቁም ቢታወቅም፣ ትርጉሙ በምንጩ የሌለውን ስም አይጨምርም።
- issue: αὐγάσαι ከ φωτισμός ጋር ያለው አገባብ
  choice: የምሥራቹ ብርሃን በማያምኑት ላይ እንዳያበራ የሚለው ንባብ።
  alternative: የማያምኑት የምሥራቹን ብርሃን እንዳያዩ የሚለው ንባብ።
  rationale: ግሱ ብርቅ ሲሆን ሁለቱንም አቅጣጫዎች ሊፈቅድ ይችላል፤ ዋናው ጽሑፍ ከ“ብርሃን” ጋር በቀጥታ የሚስማማውን ንባብ ይዟል፣ ሌላውም በማስታወሻ ተጠብቋል።
- issue: “የእግዚአብሔር አምሳል” የሚለው ክርስቶሳዊ አገላለጽ
  choice: የምንጩ ቀጥተኛ መግለጫ ያለ ተጨማሪ ማብራሪያ ተጠብቋል።
  alternative: በኋላ የተቀመሩ ሥነ መለኮታዊ ቃላትን በጽሑፉ ውስጥ መጨመር።
  rationale: ጥቅሱ ስለ መሲሑ ያለውን ጠንካራ መግለጫ ራሱ ይናገራል፤ ትርጉሙ ከምንጩ በላይ አያስፋፋውም።
