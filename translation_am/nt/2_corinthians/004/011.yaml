  yaml_path: translation/nt/2_corinthians/004/011.yaml
  text: For we who are living are always being handed over to death for Jesus’ sake[b][a], so that the life of Jesus also may be revealed in our mortal flesh.
translation:
  language: am
  text: ምክንያቱም ሕያዋን የሆንን እኛ ስለ ኢየሱስ[a] ሁልጊዜ ለሞት አሳልፈው ይሰጡናል፤ ይህም የኢየሱስ ሕይወት ደግሞ በሟች ሥጋችን[b] እንዲገለጥ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በኢየሱስ ምክንያት” ወይም “ለኢየሱስ ሲባል።”
    reason: lexical_alternative
  - marker: b
    text: እዚህ “ሥጋ” የሚለው ለሞት የተጋለጠውን አካላዊ ሕልውናችንን ያመለክታል እንጂ “ኃጢአተኛ ተፈጥሮን” አይደለም።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀεί
  choice: ሁልጊዜ
  rationale: ቀጣይነትንና ተደጋጋሚ ሁኔታን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: γάρ
  choice: ይህም ... ነው / የማብራሪያ ግንኙነት
  rationale: በግሪክ ያለውን ከቀደመው አሳብ ጋር የሚያገናኝ የማብራሪያ ግንኙነት በአማርኛው የዓረፍተ ነገር አወቃቀር ይገለጣል።
- source_word: οἱ ζῶντες
  choice: ሕያዋን የሆንን እኛ
  rationale: ያለውን ተሳቢ የአሁን ጊዜ አገላለጽና ከሞት ጋር ያለውን ንፅፅር ይጠብቃል።
- source_word: παραδιδόμεθα εἰς θάνατον
  choice: ለሞት እንሰጣለን
  rationale: የአሁን ጊዜውን ተደጋጋሚ ተገብሮና ወደ ሞት የመሰጠትን አቅጣጫ በተፈጥሯዊ መንገድ ይገልጣል።
- source_word: διὰ Ἰησοῦν
  choice: ስለ ኢየሱስ
  rationale: διά ከተሳቢ ጋር የሚያመለክተውን ምክንያት—በኢየሱስ ምክንያት ወይም ለእርሱ ሲባል—ክፍት በሆነ አማርኛ ይጠብቃል።
- source_word: ἵνα
  choice: እንዲ... ነው
