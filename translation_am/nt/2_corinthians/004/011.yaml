- source_word: ἡ ζωὴ τοῦ Ἰησοῦ
  choice: የኢየሱስ ሕይወት
  rationale: የግሪኩን የባለቤትነት አገላለጽና ከሞት ጋር ያለውን ሥነ መለኮታዊ ንፅፅር ይጠብቃል።
- source_word: φανερωθῇ
  choice: እንዲገለጥ
  rationale: የግሪኩን ተገብሮ ግስ ይጠብቃል፤ ድርጊቱን ፈጻሚ በግልጽ አይጨምርም።
- source_word: ἐν τῇ θνητῇ σαρκὶ ἡμῶν
  choice: ሟች በሆነው ሥጋችን
  rationale: σάρξን ‘ሥጋ’ ብሎ በመተርጎም የጳውሎስን ቃል ይጠብቃል፤ θνητός ደግሞ የአካላዊ ሕልፈት ተጋላጭነትን ያብራራል።
theological_decisions:
- issue: በጳውሎስ አገባብ σάρξን መተርጎም
  choice: ሥጋ
  alternative: አካል፤ ኃጢአተኛ ተፈጥሮ
  rationale: ‘ሟች’ የሚለው ገላጭ ቃል በዚህ ስፍራ የሚያመለክተው ለሞት የተጋለጠ አካላዊ ሕልውናን እንጂ የኃጢአት ሥነ ምግባራዊ መርሕን አይደለም። ‘ሥጋ’ የምንጩን ቃልና ድምፀት ይጠብቃል።
- issue: διὰ Ἰησοῦν ያለው የምክንያት/ዓላማ ልዩነት
  choice: ስለ ኢየሱስ
  alternative: በኢየሱስ ምክንያት፤ ለኢየሱስ ሲባል
  rationale: ‘ስለ’ የመከራው ምክንያት ኢየሱስ መሆኑን ያሳያል፣ ነገር ግን ‘ለእርሱ ሲባል’ የሚለውን ተዛማጅ ጥላ ፍቺ አያስወግድም።
