base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/002.yaml
  text: But I beg that when I am present I may not have to be bold with the confidence by which I consider daring to confront some who regard us as walking according to the flesh[a].
translation:
  language: am
  text: ነገር ግን፣ በመካከላችሁ ስገኝ፣ በሥጋ መሠረት እንደምንመላለስ በሚቆጥሩን አንዳንዶች ላይ ለመድፈር በማስበው መተማመን በድፍረት መሥራት እንዳያስፈልገኝ እለምናለሁ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በሰው መለኪያ መሠረት እንደምንኖር።”
    reason: የκατὰ σάρκαን አውዳዊና ይበልጥ ትርጓሜያዊ አማራጭ ለማሳየት።
lexical_decisions:
- source_word: δέομαι
  choice: እለምናችኋለሁ
  rationale: ግሱ ከቀላል ጥያቄ የበለጠ አጽንዖት ያለውን ልመና ይገልጣል፤ የተሳቢው ቅርጽ በአማርኛ ከአውዱ ግልጽ የሆኑትን የቆሮንቶስ ሰዎች ያመለክታል።
- source_word: τὸ μὴ παρὼν θαρρῆσαι
  choice: በመካከላችሁ ስገኝ በድፍረት እንዳልሠራ
  rationale: የጳውሎስን የልመና ይዘት በተፈጥሯዊ አማርኛ ይገልጣል፤ παρών ከመቅረት ጋር ያለውን ንፅፅር ይጠብቃል፣ θαρρέω ደግሞ በቆራጥነት መሥራትን ያመለክታል።
- source_word: τῇ πεποιθήσει ᾗ λογίζομαι
  choice: አስቤ ባለኝ እምነት
  rationale: πεποίθησις የውስጥ መተማመንን ይገልጣል፤ λογίζομαι ደግሞ የታሰበ ፍርድ ወይም ውሳኔ መሆኑን ያሳያል። 'እምነት' እዚህ መተማመን/የልብ ሙሉነት ትርጉም አለው።
- source_word: τολμῆσαι ἐπί τινας
  choice: አንዳንዶች ላይ ለመድፈር
  rationale: የτολμάωን የመድፈር ኃይልና የἐπί ከሰዎች ጋር ያለውን ተቃራኒ አቅጣጫ ይጠብቃል፤ 'ለመጋፈጥ' ከሚለው የበለጠ ቅርጹን በቅርብ ይከተላል።
- source_word: τοὺς λογιζομένους ἡμᾶς
  choice: በሚቆጥሩን
  rationale: የተቃዋሚዎቹን ግምገማና አመለካከት በአጭርና ተፈጥሯዊ ቋንቋ ይገልጣል።
- source_word: κατὰ σάρκα
  choice: በሥጋ መሠረት
  rationale: የጳውሎስን አስፈላጊና ባለብዙ ትርጉም ቃል σάρξ በቀጥታ ይጠብቃል፤ 'በሰው መለኪያ' የሚለውን ብቻ በመምረጥ አሻሚነቱን አያጠብም።
- source_word: περιπατοῦντας
  choice: እንደምንመላለስ
  rationale: የአኗኗርና የሥነ ምግባር ምሳሌያዊ አጠቃቀሙን ጠብቆ፣ የጳውሎስን የመራመድ ምስል በአማርኛ ያስተላልፋል።
theological_decisions:
- issue: κατὰ σάρκα ውስጥ σάρξ እንዴት እንደሚተረጎም
  choice: በሥጋ መሠረት
  alternative: በሰው መለኪያ መሠረት
  rationale: የከሳሾቹ አባባል ሰብዓዊ፣ ዓለማዊ ወይም ሥጋዊ አካሄድን ሊያመለክት ይችላል። 'ኃጢአተኛ ተፈጥሮ' ብሎ መተርጎም ከጽሑፉ በላይ ይወስናል፤ ስለዚህ ቀጥተኛው አገላለጽ በዋናው ጽሑፍ፣ ሰብዓዊ መለኪያን የሚገልጠው አማራጭ በማስታወሻ ተቀምጧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ረጅም አረፍተ ነገር ትኩረቱን ሳያጣ በአማርኛ ተፈጥሯዊ ቅደም ተከተል ተደርድሯል፤ የ'መመላለስ' ምሳሌና የ'ሥጋ' አሻሚነት ተጠብቀዋል።
