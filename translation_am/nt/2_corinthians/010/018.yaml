  to: ራሱን የሚያመሰግን[a] ሰው ሳይሆን፣ ጌታ የሚያመሰግነው ሰው ነው ተቀባይነት ያለውና።
  rationale: The revision replaces a competence-oriented expression with one that communicates approval or acceptability after evaluation, the sense required by δόκιμος. No change is made to the repeated rendering of συνίστημι, the ambiguity of «ጌታ», or the footnote anchor and lexical alternative.
