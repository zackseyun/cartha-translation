reference: 2 Corinthians 10:18
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὐ γὰρ ὁ ἑαυτὸν ⸀συνιστάνων, ἐκεῖνός ἐστιν δόκιμος, ἀλλὰ ὃν ὁ κύριος συνίστησιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/018.yaml
  text: For it is not the one who commends himself who is approved[a], but the one whom the Lord commends.
translation:
  language: am
  text: ራሱን የሚያመሰግን[a] ሰው ሳይሆን፣ ጌታ የሚያመሰግነው ሰው ነው ተቀባይነት ያለውና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ራሱን የሚያቀርብ … ጌታ የሚያቀርበው»። በሁለቱም ስፍራ አንድ የግሪክ ግስ ጥቅም ላይ ውሏል።
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιστάνων / συνίστησιν
  choice: የሚያመሰግን / የሚያመሰግነው
  rationale: በዚህ ዐውደ ንባብ ግሱ አንድን ሰው ለተቀባይነት ማቅረብን ወይም ማመስገንን ያመለክታል። በሁለቱም ስፍራ ተመሳሳዩን የአማርኛ ግስ በመጠቀም የግሪኩ ድግግሞሽ ተጠብቋል።
- source_word: δόκιμος
  choice: ብቁ ሆኖ ይገኛል
  rationale: ቃሉ ከምርመራ ወይም ከግምገማ በኋላ ተቀባይነት ያገኘን ሰው ያመለክታል። «ብቁ ሆኖ ይገኛል» ይህን ሐሳብ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: κύριος
  choice: ጌታ
  rationale: የግሪኩን የማዕረግ ስም በመደበኛው የአማርኛ አቻ ይተረጉማል፤ ጥቅሱ በግልጽ ያልጠቀሰውን ማንነት አይጨምርም።
- source_word: ἑαυτὸν
  choice: ራሱን
  rationale: የነጠላውን አንጸባራቂ ተውላጠ ስም በቀጥታና ተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: γὰρ
  choice: -ና (ይገኛልና)
  rationale: γάρ ከቀደመው ሐሳብ ጋር ያለውን ምክንያታዊ ወይም ማብራሪያዊ ግንኙነት በአማርኛ ተፈጥሯዊ በሆነው የመጨረሻ «-ና» ያሳያል።
theological_decisions:
- issue: የ«ጌታ» (ὁ κύριος) ማንነት
  choice: በዋናው ጽሑፍ «ጌታ» ብቻ ተብሎ ቀርቧል።
  alternative: «ጌታ ኢየሱስ» ወይም «እግዚአብሔር»
  rationale: በጳውሎስ አጠቃቀም «ጌታ» ብዙ ጊዜ ኢየሱስን ሊያመለክት ቢችልም፣ ጥቅሱ κύριος ብቻ ይላል። ትርጉሙ ያንን አሻሚነት ሳይፈታ ጠብቋል።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ ነው። የግሪኩ ተቃርኖ—ራስን ማመስገን እና በጌታ መመስገን—በተመሳሳይ ግስ ተጠብቋል።
