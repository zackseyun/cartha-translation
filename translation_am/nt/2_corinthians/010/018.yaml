review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately preserves the contrast, the singular representative person, the title «ጌታ», and the explanatory force of γάρ. However, «ማመስገን» most directly means thanking or praising, whereas συνίστημι here is specifically commending/recommending someone for approval. «ውዳሴ» can be used, but «ማሳመን/መደገፍ»? Need safe. Use «ራሱን የሚያቀርብ» is literal presentation but doesn''t clearly commend. «ራሱን የሚያስተዋውቅ» self promotes, Lord introduces? no. «የሚያመሰግን» accepted biblical usage for commend? likely Amharic Bible has ራሱን የሚያመሰግን. But issue δόκιμος = approved not qualified. revise only approved. '
  naturalness: «ብቁ ሆኖ ይገኛል» can suggest innate qualification or competence rather than standing approved after evaluation. «ተቀባይነት ያለው» is more natural and expresses the evaluative sense. The revised word order is also smoother in modern standard Amharic.
  terminology: Keep «ጌታ» without identifying the referent. Retain the same Amharic verb in both clauses to reflect the Greek repetition. Render δόκιμος as «ተቀባይነት ያለው».
  issues:
  - severity: medium
    issue: δóκιμος is rendered «ብቁ ሆኖ ይገኛል».
    rationale: This can mean competent or qualified, while the Greek term in this contrast denotes the person who has been approved/accepted. The revision makes that evaluative result explicit.
  revised_text: ራሱን የሚያመሰግን[a] ሰው ሳይሆን፣ ጌታ የሚያመሰግነው ሰው ነው ተቀባይነት ያለውና።
