  yaml_path: translation/nt/2_corinthians/010/007.yaml
  text: 'You are looking at outward appearances[a]. If anyone is confident in himself that he belongs to Messiah, let him consider this again within himself: that just as he belongs to Messiah[b], so also do we.'
translation:
  language: am
  text: ነገሮችን በውጫዊ ገጽታ ትመለከታላችሁ።[a] ማንም ራሱ የመሲሑ እንደሆነ በራሱ የሚተማመን ከሆነ፣ እርሱ የመሲሑ እንደሆነ ሁሉ እኛም የመሲሑ እንደሆንን ይህን በራሱ ደግሞ ያስብ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “እንደ ፊት ገጽታ ያሉትን ነገሮች ትመለከታላችሁ።” ወይም፣ “በፊታችሁ ያለውን ተመልከቱ።” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὰ κατὰ πρόσωπον
  choice: በውጫዊ ገጽታ
  rationale: ሐረጉ በዐይን የሚታየውን ወይም የላይኛውን ገጽታ ያመለክታል፤ ይህ አተረጓጎም በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን የሐረጉን ፈሊጣዊ ትርጉም ያስተላልፋል።
- source_word: βλέπετε
  choice: ትመለከታላችሁ
  rationale: ቅርጹ አመልካች ወይም ትእዛዛዊ ሊሆን ቢችልም፣ ዐውደ ንባቡ ጳውሎስ እየገሠጸ መሆኑን ስለሚያመለክት እንደ አመልካች ተተርጉሟል።
- source_word: πέποιθεν ἑαυτῷ
  choice: በራሱ የሚተማመን
  rationale: ፍጹም ጊዜው የጸና እርግጠኝነትን ያሳያል፤ ይህ አገላለጽ ግለሰቡ ስለ ራሱ ያለውን የተረጋጋ መተማመን ይገልጣል።
- source_word: Χριστοῦ εἶναι
  choice: የመሲሑ እንደሆነ
  rationale: የግሪኩ የባለቤትነት ቅርጽ ለመሲሑ መሆንን፣ ማለትም የእርሱ ወገን መሆንን ያሳያል፤ Χριστόςም እዚህ እንደ ማዕረግ ‘መሲሕ’ ተብሏል።
- source_word: λογιζέσθω πάλιν ἐφ’ ἑαυτοῦ
  choice: ይህን በራሱ ደግሞ ያስብ
  rationale: ትእዛዙ ግለሰቡ በውስጡ ተመልሶ ነገሩን እንዲመዝን ይጠይቃል፤ ‘ደግሞ’ የπάλινን ድጋሚነት ይጠብቃል።
- source_word: καθὼς αὐτὸς Χριστοῦ οὕτως καὶ ἡμεῖς
  choice: እርሱ የመሲሑ እንደሆነ ሁሉ እኛም የመሲሑ እንደሆንን
  rationale: የንጽጽሩን ሚዛናዊነት ይጠብቃል፤ በግሪኩ በሁለተኛው ክፍል የተተወው ግስ በአማርኛ ለግልጽነት ተደግሟል።
theological_decisions:
- issue: Χριστοῦ አተረጓጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: Χριστός በዚህ ስፍራ የተቀባውን የሚያመለክት ማዕረግ ነው፤ ‘መሲሑ’ ይህን የማዕረግ ኃይል በግልጽ ያስተላልፋል።
- issue: የመሲሑ መሆን የሚገልጸው ግንኙነት
