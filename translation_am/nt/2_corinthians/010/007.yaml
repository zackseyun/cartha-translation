  rationale: ዋናው ጽሑፍ የግሪኩን አጭርና ጠንካራ የባለቤትነት አገላለጽ ይጠብቃል፤ የወገንነት ወይም የባለቤትነት ፍቺው በማስታወሻ ተብራርቷል።
