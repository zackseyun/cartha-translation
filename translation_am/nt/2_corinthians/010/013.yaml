base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/013.yaml
  text: But we will not boast beyond measure[a], but according to the measure of the sphere that God assigned to us—a measure that reaches even to you—
translation:
  language: am
  text: እኛ ግን ከልክ አልፈን አንመካም፤ ይልቁንም እግዚአብሔር ለእኛ በመደበው ክልል[a] መጠን እንመካለን፤ ይህም መጠን እስከ እናንተ ድረስ ይደርሳል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ክልል” ተብሎ የተተረጎመው የግሪክኛ ቃል መለኪያ በትርን፣ መሥፈርትን ወይም የተመደበ የሥራ ወሰንን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄμετρα
  choice: ከልክ አልፈን
  rationale: ቃሉ በዚህ አገባብ ተገቢውን ወሰን ማለፍን ያመለክታል፤ ይህ አተረጓጎም የመጠንና የወሰን ምሳሌውን በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: καυχησόμεθα
  choice: እንመካለን
  rationale: በክርክሩ አውድ ጳውሎስ ስለ ራስ መመካትና የሥራ ድርሻን ስለመጠየቅ እየተናገረ ነው፤ “መመካት” ቀጥተኛና የተለመደ አቻ ነው።
- source_word: κατὰ τὸ μέτρον
  choice: በ…መጠን
  rationale: ከተመደበው መጠን ጋር የሚስማማ መመካትን ያሳያል፤ በግሪክኛው ያለውን የመጠን ምሳሌም ይጠብቃል።
- source_word: κανόνος
  choice: ክልል
  rationale: በዚህ አውድ ቃሉ በዋናነት እግዚአብሔር የመደበውን የሥራ መስክ ወይም ወሰን ያመለክታል፤ “ክልል” የቦታና የድርሻ ምሳሌውን ያስተላልፋል። ሌሎቹ የቃሉ ትርጉሞች በማስታወሻው ቀርበዋል።
- source_word: οὗ ἐμέρισεν ἡμῖν ὁ θεὸς
  choice: እግዚአብሔር በመደበልን
  rationale: μερίζω እዚህ ድርሻን ማከፋፈል ወይም መመደብን ያሳያል፤ “መደበ” ተፈጥሯዊ ሲሆን መለኮታዊ ምደባውን ይገልጣል።
- source_word: μέτρου
  choice: ይህም መጠን
  rationale: ሁለተኛውን μέτρον በግልጽ መድገም የምንጩን አጽንዖት ይጠብቃል፣ የተመደበው ክልልም የሚደርስበትን ስፋት ያብራራል።
- source_word: ἐφικέσθαι ἄχρι καὶ ὑμῶν
  choice: እናንተ ዘንድም ይደርሳል
  rationale: ἐφικέσθαι የመድረስን ስፋት፣ καί ደግሞ ቆሮንቶሳውያን በዚያ ክልል ውስጥ መካተታቸውን በአጽንዖት ያሳያል።
theological_decisions:
- issue: በጳውሎስ የአገልግሎት ክርክር ውስጥ κανών የሚያመለክተው
  choice: ቆሮንቶሳውያንንም የሚያካትት፣ እግዚአብሔር የመደበው የሥራ ክልል
  alternative: ጳውሎስ መመካቱን የሚለካበት ደንብ ወይም መሥፈርት
  rationale: ቅርብ አውዱ መጠንን፣ ምደባንና “እናንተ ዘንድም መድረስን” ያጎላል። ስለዚህ የቦታና የተመደበ ድርሻ ሐሳብ ዋና ነው፤ ሆኖም የመሥፈርት ትርጉሙ በማስታወሻው ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “ከልክ አልፈን” ተፈጥሯዊ አገላለጽ ሲሆን፣ “መጠን” በመድገም የግሪክኛው የመለኪያ ምሳሌ ተጠብቋል።
