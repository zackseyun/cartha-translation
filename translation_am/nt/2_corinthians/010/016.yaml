lexical_decisions:
- source_word: ὑπερέκεινα ὑμῶν
  choice: ከእናንተም አልፈን ባሉት አገሮች
  rationale: የግሪኩ ሐረግ ከቆሮንቶስ ሰዎች አካባቢ ባሻገር ያሉትን ስፍራዎች ያመለክታል፤ ይህ አተረጓጎም ጂኦግራፊያዊውንና አንጻራዊውን ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: εὐαγγελίσασθαι
  choice: የምሥራቹን ለመስበክ
  rationale: የጳውሎስን የወንጌል አዋጅ ዓላማ በግልጽና በተለመደ ዘመናዊ አማርኛ ይገልጻል።
- source_word: ἀλλοτρίῳ κανόνι
  choice: በሌላው የሥራ ድንበር ውስጥ
  rationale: κανών እዚህ የሌላ ሰው የተመደበ የአገልግሎት ወሰን ወይም መስክ ማለት ነው፤ ‘የሥራ ድንበር’ የወሰንንና የአገልግሎትን ሐሳብ አንድ ላይ ይይዛል።
- source_word: τὰ ἕτοιμα
  choice: አስቀድሞ ስለተዘጋጀው ነገር
  rationale: ግሪኩ ‘የተዘጋጁትን ነገሮች’ በሚል ሰፊ አገላለጽ ይቆያል፤ ትርጉሙም ‘ሥራ’ ብሎ በዋናው ጽሑፍ እንዳይጨምር አሻሚነቱን ይጠብቃል።
- source_word: καυχήσασθαι
  choice: ላለመመካት
  rationale: በአውዱ የሌላ ሰውን ውጤት የራስ አድርጎ መኩራራትን ያመለክታል፤ ‘መመካት’ በዙሪያው ካለው የጳውሎስ ክርክር ጋር የቃሉን ግንኙነት ይጠብቃል።
theological_decisions:
- issue: በጳውሎስ የአገልግሎት አውድ የκανών ትርጉም
  choice: የተመደበ የሥራ ወይም የአገልግሎት ድንበር
