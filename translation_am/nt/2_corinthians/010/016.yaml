  alternative: በአጠቃላይ ዝግጁ የሆኑ ነገሮች
  rationale: አውዱ ጳውሎስ በሌላ ሰው መስክ ስለተሠራው እንደማይመካ ያመለክታል፤ ሆኖም ዋናው ጽሑፍ ‘ሥራ’ ብሎ በግልጽ ስለማይናገር ትርጉሙ ሰፋ ብሎ ተቀምጧል።
