    text: “ከእናንተ ባሻገር ባሉት ስፍራዎች ወንጌልን ለመስበክ” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “የአገልግሎት መስክ” የሚለው በዚህ አውድ የግሪኩን κανών ቃል እንደ ተመደበ የአገልግሎት ክልል ወይም መስክ ይረዳዋል፤ የሥነ ምግባር ሕግ ወይም በኋላ የተለመደው “ቀኖና” ማለት አይደለም።
    reason: cultural_note
  - marker: c
    text: “በሌላ ሰው መስክ ውስጥ አስቀድሞ በተሠራ ሥራ ላለመመካት” ተብሎም ሊገለጽ ይችላል።
