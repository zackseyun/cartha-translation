  text: ከእናንተ ባሻገር ባሉት ስፍራዎች የምሥራቹን ለመስበክ[a]፣ በሌላ ሰው የአገልግሎት መስክ[b] ውስጥ አስቀድሞ በተዘጋጁ ነገሮች ላለመመካት[c]።
  philosophy: optimal-equivalence
  footnotes:
