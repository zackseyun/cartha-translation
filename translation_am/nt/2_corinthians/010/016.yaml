  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የዓላማ ኢንፊኒቲቭ ከቀደመው ቁጥር ጋር የሚያያዝ በመሆኑ ዓረፍተ ነገሩ ‘ነው’ በሚል ተጠናቋል፤ የቁጥሩ አውዳዊ ትስስር እንዲታይ የመጀመሪያው ‘ም’ አያያዥ ተጠብቋል።
