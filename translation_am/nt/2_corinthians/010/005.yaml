  rationale: εἰς ወደ ውጤታዊ ሁኔታ የሚደረግን እንቅስቃሴ ያሳያል፤ ይህ አገላለጽ ሐሳቡ ወደ ታዛዥነት መምጣቱን በተፈጥሯዊ አማርኛ ያቀርባል።
