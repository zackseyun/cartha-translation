  rationale: በዐውዱ የሐዋርያዊ ሥልጣን የሚወስደውን የቅጣት እርምጃ ያመለክታል፤ ግላዊ በቀልን አያስገባም። የፍትሕ እርምጃ ወይም በቀል የመውሰድ ትርጉም እንደሚቻል በማስታወሻ ተጠብቋል።
- source_word: πᾶσαν παρακοήν
  choice: ያለመታዘዝን ድርጊት ሁሉ
