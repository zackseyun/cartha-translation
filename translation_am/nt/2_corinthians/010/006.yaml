    text: ወይም፣ “በያለመታዘዝ ሁሉ ላይ ፍትሕን ለማስፈን” ወይም “ያለመታዘዝን ሁሉ ለመበቀል።” የግሪኩ ግስ ፍትሕን የማስፈን ወይም የመበቀል ትርጉም ሊኖረው ይችላል፤ በዚህ ዐውድ ግን የቅጣት እርምጃን የሚያመለክት ይመስላል።
    reason: lexical_alternative
