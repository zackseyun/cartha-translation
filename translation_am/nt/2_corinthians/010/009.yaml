translation:
  language: am
  text: በደብዳቤዎቹ ማስፈራራችሁ እንደምችል እንዳልመስል፤
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα μὴ
  choice: እንዳይ...
  rationale: የἵνα ሐረጉን ዓላማ ወይም ውጤትና አሉታዊነቱን በተፈጥሯዊ የአማርኛ አገባብ ያሳያል፤ ከቀደመው አውድ ጋር ለማያያዝ «ይህን እላለሁ» ተገልጧል።
- source_word: δόξω
  choice: የምሞክር እንዳይመስል
  rationale: δοκέω እዚህ «መምሰል/መታየት» ማለት ነው፤ የመጀመሪያ ሰው ማጣቀሻው «የምሞክር» በሚለው ሐረግ ተጠብቋል።
- source_word: ὡς ἂν
  choice: የምሞክር
  rationale: ቃል በቃል «እንደ» ማለት በአማርኛ ከባድ ስለሚሆን፣ የሚያመለክተው የመምሰል ወይም የሚታይ ዓላማ በ«የምሞክር ... እንዳይመስል» አወቃቀር ተላልፏል።
- source_word: ἐκφοβεῖν
  choice: ላስፈራራችሁ
  rationale: ግሱ ከባድ ፍርሃት ማሳደርን ወይም ማስፈራራትን ያመለክታል፤ «ማስፈራራት» ተፈጥሯዊና ግልጽ ነው።
- source_word: ὑμᾶς
  choice: -አችሁ
  rationale: የብዙ ሰው ቀጥተኛ ተሳቢነቱ በግሱ ላይ ባለው ቅጥያ ተገልጧል።
- source_word: διὰ τῶν ἐπιστολῶν
  choice: በደብዳቤዎቹ
  rationale: διά ከዝርያ አመልካች ጋር የመሣሪያነትን ትርጉም ይሰጣል። የግሪኩ የተወሰነ አመልካች «ደብዳቤዎቹ» ተብሎ ተጠብቋል፤ «የእኔ» የሚለው በግሪኩ በግልጽ አልተጻፈም።
