  text: 'Let such a person consider this: what we are in word by letters when absent[b][a], we are also in deed when present.'
translation:
  language: am
  text: እንዲህ ያለው ሰው[a] ይህን ያስብ፤ እኛ በሌለንበት ጊዜ በደብዳቤዎች በቃል[b] እንደምንሆን፣ በተገኘንበት ጊዜም በተግባር እንዲሁ ነን።
  philosophy: optimal-equivalence
  footnotes:
