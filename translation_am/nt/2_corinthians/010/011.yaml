lexical_decisions:
- source_word: λογιζέσθω
  choice: ያስብ
  rationale: የሦስተኛ መደብ ነጠላ ትእዛዝ ሲሆን፣ ነገሩን በጥንቃቄ እንዲያስብበትና ከግምት እንዲያስገባ ይጠይቃል። «ያስብ» በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: ὁ τοιοῦτος
  choice: እንዲህ ያለው ሰው
  rationale: ቀደም ሲል የተጠቀሰውን ዓይነት ተቃዋሚ በነጠላ ቁጥር ይጠቅሳል፤ አገላለጹም ግልጽና ዘመናዊ ነው።
- source_word: οἷοί ἐσμεν
  choice: እንደምንሆን
  rationale: የሰዎቹን ባሕርይ ወይም ሁኔታ የሚገልጠውን የጥራት ንጽጽር ያቆያል።
- source_word: τῷ λόγῳ
  choice: በቃል
  rationale: የሁኔታ ወይም የመስክ ዳቲቭ ሲሆን፣ ከτῷ ἔργῳ ጋር ያለውን «በቃል—በተግባር» ቀጥተኛ ንጽጽር ይጠብቃል።
- source_word: δι’ ἐπιστολῶν
  choice: በደብዳቤዎቻችን
  rationale: διά ከጄኒቲቭ ጋር የመሣሪያነትን ወይም የመገናኛ መንገድን ያመለክታል። «በደብዳቤዎቻችን» ቃላቸው የተላለፈበትን ማስተላለፊያ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἀπόντες
  choice: በሌለንበት ጊዜ
  rationale: ሁኔታዊ ክፍለ ግስ ነው፤ ከπαρόντες ጋር ያለውን የመቅረትና የመገኘት ንጽጽር ግልጽ ያደርጋል።
- source_word: τοιοῦτοι
  choice: እንዲሁ እንሆናለን
  rationale: የመጀመሪያውን የጥራት መግለጫ በድጋሚ በማንሣት ሁለቱን ሁኔታዎች ያመሳስላል። የወደፊት ቅርጹ ጳውሎስ በአካል ሲመጣ ድርጊቱ ከደብዳቤው ቃል ጋር እንደሚጣጣም በአማርኛ በተፈጥሯዊነት ያሳያል።
- source_word: παρόντες
  choice: በተገኘንበት ጊዜ
  rationale: ከἀπόντες ጋር ትይዩ የሆነ ሁኔታዊ ክፍለ ግስ ሲሆን፣ በአካል መገኘትን ያመለክታል።
- source_word: τῷ ἔργῳ
  choice: በተግባር
  rationale: የመስክ ዳቲቭ ነው፤ «በቃል» ከሚለው ጋር ያለውን ጠንካራ ንጽጽር በተለመደና ግልጽ አማርኛ ይጠብቃል።
theological_decisions:
- issue: ጳውሎስ በደብዳቤ የሚናገረውን ከበአካል ተግባሩ ጋር ማነጻጸሩ
  choice: በሌለበት ጊዜ በደብዳቤ የገለጠው ቃል፣ በተገኘበት ጊዜ ከሚያደርገው ተግባር ጋር እንደሚጣጣም ቀጥተኛ ማረጋገጫ አድርጎ መተርጎም
  alternative: ጥቅሱን ስለወደፊት ቅጣት የሚሰነዘር ግልጽ ዛቻ አድርጎ ማስፋት፣ ወይም «ቃል» እና «ተግባር»ን እንደ አነጋገር ስልትና ኃይል ብቻ መተርጎም
  rationale: ግሪኩ በሌሉበት ጊዜ በደብዳቤ ያሉትንና በተገኙበት ጊዜ በተግባር የሚሆኑትን በቀጥታ ያነጻጽራል። ስለዚህ የማስጠንቀቂያው ኃይል ተጠብቆ፣ ጽሑፉ ያላለው ተጨማሪ የእምነት ወይም የቤተ ክርስቲያን አቋም አልተጨመረም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «በቃል … በተግባር» የሚለው አጭር የንጽጽር መዋቅር የግሪኩን ርቱዕነት ይጠብቃል።
