  text: οὐ γὰρ ὡς μὴ ἐφικνούμενοι εἰς ὑμᾶς ὑπερεκτείνομεν ἑαυτούς, ἄχρι γὰρ καὶ ὑμῶν ἐφθάσαμεν ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/014.yaml
  text: For we are not overextending ourselves[a], as though we had not reached you[c][b], for we came even as far as you with the gospel of Messiah—
translation:
  language: am
  text: ምክንያቱም፣ እናንተ ዘንድ እንዳልደረስን ያህል ራሳችንን ከልክ በላይ አንዘረጋም፤[a] የመሲሑን[c] ወንጌል ይዘን[b] እስከ እናንተም ድረስ ደርሰናልና—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ራሳችንን ከተገቢው ወሰን በላይ አንዘረጋም።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በመሲሑ ወንጌል” ወይም “በመሲሑ ወንጌል አገልግሎት።”
    reason: source_ambiguity
  - marker: c
    text: ወይም፣ “የክርስቶስን።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπερεκτείνομεν ἑαυτούς
  choice: ራሳችንን ከወሰናችን በላይ አንዘረጋም
  rationale: የግሪኩን ‘ከተገቢው ወሰን አልፎ መዘርጋት’ የሚለውን ምስላዊ አነጋገር ይጠብቃል፤ በአማርኛም ትርጉሙ ግልጽ እንዲሆን ‘ከወሰናችን በላይ’ ተጨምሯል።
- source_word: ὡς μὴ ἐφικνούμενοι εἰς ὑμᾶς
  choice: እናንተ ዘንድ እንዳልደረስን ያህል
  rationale: ጳውሎስና ባልደረቦቹ ቆሮንቶስ ያልደረሱ ቢሆን ኖሮ ከወሰናቸው አልፈዋል የሚባሉበትን መላምታዊ ሁኔታ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἄχρι γὰρ καὶ ὑμῶν ἐφθάσαμεν
  choice: እስከ እናንተም ድረስ ደርሰናልና
  rationale: ἄχρι የሚያሳየውን የመድረሻ ወሰን በ‘እስከ…ድረስ’፣ አጽንዖት የሚሰጠውን καί ደግሞ በ‘-ም’ ይገልጣል፤ ἐφθάσαμεν ያለፈውን የተፈጸመ መድረስ ያመለክታል።
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: ወንጌል ይዘን
  rationale: ἐν እዚህ የወንጌል አገልግሎትን አብሮነት፣ መሣሪያ ወይም የእንቅስቃሴ መስክ ሊያመለክት ይችላል፤ ‘ወንጌል ይዘን’ በአማርኛ ተፈጥሯዊ ሲሆን ወንጌሉን ይዘው መድረሳቸውን ያሳያል።
- source_word: τοῦ Χριστοῦ
  choice: የመሲሑን
  rationale: Χριστός በዚህ ሐረግ የተቀባውን ንጉሥ የሚያመለክት ማዕረግ ሆኖ ስለሚሠራ፣ ‘መሲሕ’ የማዕረጉን ትርጉም በግልጽ ያቀርባል።
theological_decisions:
- issue: τοῦ Χριστοῦ እንደ ማዕረግ ወይም እንደ ስም መተርጎም
  choice: የመሲሑን
  alternative: የክርስቶስን
  rationale: ‘የ…ወንጌል’ በሚለው አገባብ Χριστός የመሲሑን ማዕረግ በግልጽ ሊያቆይ ይችላል። በአማርኛ የተለመደው ‘ክርስቶስ’ ግን ትክክለኛ አማራጭ ስለሆነ በእግር ማስታወሻ ቀርቧል።
