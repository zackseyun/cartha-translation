  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የ‘መዘርጋት’ ምስላዊ አነጋገር ተጠብቆ፣ ትርጉሙን ለማብራራት ‘ከወሰናችን በላይ’ ተጨምሯል። በግሪኩ ያለው ሐሳብ ወደሚቀጥለው ቁጥር ስለሚቀጥል የረጅም ሰረዝ ምልክት ተጠብቋል።
