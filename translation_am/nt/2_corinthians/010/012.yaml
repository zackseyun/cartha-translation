  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለውን መደበኛ አማርኛ ይጠቀማል። በግሪኩ ያለውን የ‘ራስ’ ድግግሞሽ በተቻለ መጠን ጠብቆ የራስ-ተኮር ንጽጽሩን ምጸት አጉልቷል።
