- source_word: συγκρῖναι / συγκρίνοντες
  choice: ለማወዳደር / እያወዳደሩ
  rationale: በሁለቱም ቦታ ተመሳሳይ ቃል መጠቀሙ የግሪኩን ድግግሞሽና የክርክሩን ኃይል ይጠብቃል።
- source_word: ἑαυτοὺς συνιστανόντων
  choice: ራሳቸውን ከሚያመሰግኑት
  rationale: የተውላጠ ስሙን ራስን የማመስገን አጽንዖት ያስተላልፋል፤ ይህም በዐውደ ንባቡ ዋና ጉዳይ ነው።
- source_word: μετροῦντες
  choice: እየለኩ
  rationale: የመለኪያውን ዘይቤ በቀጥታ በመጠበቅ ራሳቸውን በራሳቸው መሥፈርት እንደሚገመግሙ ያሳያል።
- source_word: οὐ συνιᾶσιν
  choice: አያስተውሉም
  rationale: የማስተዋል እጥረታቸውን በተፈጥሯዊና ክብር ባለው ዘመናዊ አማርኛ ይገልጣል፤ ያልተገለጸውን ነገር በመጨመር አይፈታውም።
