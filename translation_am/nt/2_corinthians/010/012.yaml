  yaml_path: translation/nt/2_corinthians/010/012.yaml
  text: For we do not dare to classify or compare ourselves with some of those who commend themselves[a]. But when they measure themselves by themselves and compare themselves with themselves[b], they do not understand.
translation:
  language: am
  text: ምክንያቱም እኛ ራሳቸውን ከሚያመሰግኑት አንዳንዶቹ ጋር ራሳችንን ለመመደብ[a] ወይም ለማወዳደር አንደፍርም። እነርሱ ግን ራሳቸውን በራሳቸው እየለኩ፣ ራሳቸውንም ከራሳቸው ጋር እያወዳደሩ[b] አያስተውሉም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ራሳችንን በእነርሱ መካከል ለማስገባት” ወይም “ከእነርሱ ጋር በአንድ ደረጃ ለመቁጠር።” የግሪኩ ግስ ራስን ከሌሎች ጋር በአንድ ምድብ ማስገባትን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “ራሳቸውን በራሳቸው ውስጥ እየለኩ፣ ራሳቸውንም ከራሳቸው ጋር እያወዳደሩ።” ሐሳቡ ራሳቸውን የራሳቸው መሥፈርት እንደሚያደርጉ ነው።
    reason: lexical_alternative
