  rationale: ይህ ምርጫ ዳቲቩን ወደ መሣሪያዊ ወይም የምንጭ ትርጉም በግድ ሳይወስን የግሪኩን አጭርና አሻሚ አገላለጽ በቅርብ ይጠብቃል።
- issue: λογισμοὺς ገለልተኛ አሳቦች ወይስ ተቃዋሚ አስተሳሰቦች መሆናቸው
  choice: ክርክሮች
  alternative: አስተሳሰቦች፣ ሐሳቦች፣ ግምቶች
  rationale: የቅርብ ዐውዱ እግዚአብሔርን ከማወቅ ጋር የሚቃወሙ የአስተሳሰብ አወቃቀሮችን ይጠቁማል፤ ሆኖም ሰፊው የ«አስተሳሰቦች» አማራጭ በማስታወሻ ቀርቧል።
