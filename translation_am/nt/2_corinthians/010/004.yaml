base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/004.yaml
  text: For the weapons of our warfare are not fleshly[c][b][a], but powerful before God for the tearing down of strongholds—tearing down arguments
translation:
  language: am
  text: የውጊያችን መሣሪያዎች ሥጋዊ[a] አይደሉምና፤ ነገር ግን ምሽጎችን ለማፍረስ በእግዚአብሔር ዘንድ ኃያላን ናቸው[b]—ክርክሮችንም[c] በማፍረስ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የሥጋ»፤ በዚህ ዐውድ በሰው አቅም ወይም በዓለማዊ መንገድ የሚደረጉ ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «በእግዚአብሔር ኃይል ብርቱ ናቸው» ወይም «በመለኮታዊ ኃይል የበረቱ ናቸው»።
    reason: alternative_reading
  - marker: c
    text: ወይም፣ «አስተሳሰቦችን» ወይም «ግምቶችን»።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπλα
  choice: መሣሪያዎች
  rationale: የወታደራዊውን ምሳሌያዊ ምስል በተፈጥሯዊ አማርኛ ይጠብቃል፤ በዐውዱም የውጊያ መሣሪያዎች መሆናቸው ግልጽ ነው።
- source_word: στρατείας
  choice: ውጊያ
  rationale: የቀጣይ ወታደራዊ ትግልን ያመለክታል፤ «ዘመቻ» ከሚለው ይልቅ ሰፊና በዐውዱ ተፈጥሯዊ ነው።
- source_word: σαρκικὰ
  choice: ሥጋዊ
  rationale: ከσάρξ ጋር ያለውን የቃልና የሥነ መለኮት ግንኙነት ይጠብቃል፤ ትርጉሙን «ኃጢአተኛ» ወይም «ዓለማዊ» ብሎ አስቀድሞ አያጠብም።
- source_word: δυνατὰ τῷ θεῷ
  choice: በእግዚአብሔር ፊት ኃያላን
  rationale: የግሪኩን ዳቲቭ ያለ ግልጽ መሠረት መሣሪያዊ ትርጉም ሳይጨምር በቅርብ ይወክላል፤ የአገላለጹ መጠነኛ አሻሚነት በማስታወሻ ተጠብቋል።
- source_word: καθαίρεσιν
  choice: ለማፍረስ
  rationale: ምሽግን የማፍረስ ግልጽ ምስልን ይጠብቃል፤ ከκαθαιροῦντες ጋር ያለውን የቃል ድግግሞሽም ያስተጋባል።
- source_word: ὀχυρωμάτων
  choice: ምሽጎች
  rationale: የተመሸጉ ጠንካራ ስፍራዎችን የሚገልጽ የተለመደና ለወታደራዊው ምስል የሚስማማ ቃል ነው።
- source_word: λογισμοὺς
  choice: ክርክሮች
  rationale: በቀጣዩ ቁጥር ከተገለጸው እግዚአብሔርን ከማወቅ ጋር የሚቃወም አስተሳሰብ ጋር ይስማማል፤ «አሳቦች» ከሚለው ይልቅ የተቃውሞውን ገጽታ ያሳያል።
- source_word: καθαιροῦντες
  choice: እናፈርሳለን
  rationale: የግሪኩን ተሳቢ አገላለጽ በተፈጥሯዊ አማርኛ እንደ ዋና ግስ ያቀርባል፤ ከ«ለማፍረስ» ጋር ያለውን ሥርወ ቃላዊ ትስስር ይጠብቃል።
theological_decisions:
- issue: በጳውሎስ የሰው አቅምና የመለኮት ኃይል ንጽጽር ውስጥ σαρκικὰን መተርጎም
