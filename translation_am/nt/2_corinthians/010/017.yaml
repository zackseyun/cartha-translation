  text: But the one who boasts must boast in the Lord[a].
translation:
  language: am
  text: ነገር ግን፣ የሚመካ በጌታ ይመካ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም ቃል በቃል፣ «የሚመካ በጌታ ይመካ።» ጳውሎስ የኤርምያስ 9፥24ን (በሰባ ሊቃናት ትርጉም 9፥23) እያስተጋባ ሊሆን ይችላል።
    reason: cross_reference
lexical_decisions:
- source_word: Ὁ ... καυχώμενος
  choice: የሚመካ
  rationale: ከመስተዋድዱ ጋር ያለው የአሁን ጊዜ አጋኝ ግስ ስማዊ ሆኖ በአጠቃላይ የሚመካን ሰው ያመለክታል፤ «የሚመካ» ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: በዐውዱ ሕጋዊ ያልሆነውን መመካት ከትክክለኛው መመካት ጋር የሚያነጻጽር መጠነኛ ተቃርኖ ያሳያል።
- source_word: καυχώμενος / καυχάσθω
  choice: የሚመካ / ይመካ
  rationale: καυχάομαι መመካትን ወይም መኩራራትን ያመለክታል። «ይመካ» የሦስተኛ መደብ ትእዛዛዊውን ኃይል በአጭርና በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐν
  choice: በ
  rationale: ከመመካት ግስ ጋር ሲገባ የመመኪያውን መሠረት ወይም ዙሪያ ያሳያል፤ «በጌታ መመካት» ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
- source_word: κυρίῳ
  choice: ጌታ
  rationale: የፕሮጀክቱን መደበኛ አተረጓጎም በመከተል κύριος «ጌታ» ተብሏል፤ ግሪኩ ተጨማሪ መለያ ስለማይሰጥ ማንነቱ ከዚህ በላይ አልተወሰነም።
theological_decisions:
- issue: በጥቅስ ወይም በጥቅስ ፍንጭ ዐውድ «ጌታ» የሚያመለክተው
  choice: ጌታ
  alternative: ጌታ ኢየሱስ፤ እግዚአብሔር
  rationale: ጳውሎስ የኤርምያስን ንግግር የሚያስታውስ ቢሆንም፣ የግሪኩ κυρίῳ በዚህ ስፍራ ማንነቱን በግልጽ አይወስንም። ስለዚህ ትርጉሙ ሥነ መለኮታዊውን ድምፀትና አሻሚነት ጠብቆ «ጌታ» ይላል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «መመካት» የግሪኩን የንግግር ጫፍ ሳያጠፋ በአማርኛ መጽሐፍ ቅዱሳዊ ዐውድ የተለመደ ነው።
