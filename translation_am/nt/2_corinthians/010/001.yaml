language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ἐγὼ Παῦλος παρακαλῶ ὑμᾶς διὰ τῆς πραΰτητος καὶ ἐπιεικείας τοῦ Χριστοῦ, ὃς κατὰ πρόσωπον μὲν ταπεινὸς ἐν ὑμῖν, ἀπὼν δὲ θαρρῶ εἰς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/001.yaml
  text: I myself[a], Paul, appeal to you by the meekness and gentleness of Messiah—I who am humble face to face among you[c][b], but bold toward you when absent.
translation:
  language: am
  text: እኔው ጳውሎስ፣ በመሲሑ የዋህነትና ገርነት እለምናችኋለሁ—በአካል በመካከላችሁ ሳለሁ ትሑት፣ በሌለሁ ጊዜ ግን ለእናንተ ደፋር የሆንሁ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αὐτὸς δὲ ἐγὼ Παῦλος
  choice: እኔ ጳውሎስ ራሴ
  rationale: የግሪኩን አጽንዖት በተፈጥሯዊ አማርኛ ያስተላልፋል፤ δέ የንግግር ሽግግር ስለሚያመለክት በተለየ ጊዜያዊ ቃል አልተተረጎመም።
- source_word: παρακαλῶ ὑμᾶς
  choice: እለምናችኋለሁ
  rationale: በዚህ ስፍራ ያለውን ግላዊና ከልብ የሆነ ልመና ያሳያል፤ ቀጥተኛ ትእዛዝ አያደርገውም።
- source_word: διὰ τῆς πραΰτητος καὶ ἐπιεικείας
  choice: በ…የዋህነትና ገርነት
  rationale: διά ከወራሽ ሁኔታ ጋር የልመናውን መሠረት ወይም አማካይነት ያሳያል፤ ሁለቱንም ተዛማጅ ነገር ግን የተለያዩ የገጸ ባሕርይ ቃላት ጠብቋል።
- source_word: τοῦ Χριστοῦ
  choice: የመሲሑ
  rationale: Χριστός እዚህ እንደ ማዕረግ ስለሚሠራ፣ ትርጉሙን የሚገልጠው «መሲሕ» ተመርጧል።
- source_word: κατὰ πρόσωπον
  choice: በፊታችሁ ሳለሁ
  rationale: ቃል በቃል «በፊት» የሚለውን፣ ከመቅረት ጋር ባለው ንጽጽር መሠረት «በአካል በፊታችሁ ስገኝ» በሚል ተፈጥሯዊ ሐረግ ያቀርባል።
- source_word: ταπεινὸς
  choice: ትሑት
  rationale: የትሕትናን ወይም የዝቅተኝነትን መሠረታዊ ትርጉም ይጠብቃል፤ «ፈሪ» ብሎ የተቃዋሚዎቹን ክስ አይጭንም።
- source_word: ἐν ὑμῖν
  choice: በመካከላችሁ
  rationale: ጳውሎስ በቆሮንቶስ ሰዎች መሃል በአካል መገኘቱን በግልጽ ያሳያል።
- source_word: ἀπὼν δὲ θαρρῶ εἰς ὑμᾶς
  choice: በሌለሁበት ግን ለእናንተ ደፋር ነኝ
  rationale: የመገኘትና የመቅረት ንጽጽሩን ይጠብቃል፤ εἰς ὑμᾶςን ጠላትነት ሳያክል አቅጣጫን በሚያሳይ «ለእናንተ» ያቀርባል።
theological_decisions:
- issue: የ Χριστοῦ አተረጓጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: ቃሉ እዚህ እንደ ማዕረግ የሚሠራ ስለሆነ፣ የተቀባውን ንጉሥ የሚያመለክተው ማዕረጋዊ ትርጉም ተጠብቋል።
- issue: የጳውሎስ ራስ-ገለጻ ምጸታዊ ወይም ቀጥተኛ መሆኑ
  choice: «ትሑት» በማለት አሻሚነቱን መጠበቅ
  alternative: «ፈሪ» ወይም «ዝቅ ያልሁ»
  rationale: ግሪኩ ጳውሎስ የተቃዋሚዎቹን አባባል በምጸት እየደገመ እንደሆነ በግልጽ አይልም፤ ስለዚህ ትርጉሙ ይህን የንግግር ውጥረት አልፈታም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ አጽንዖት፣ የፊት-ለፊት መገኘትና የመቅረት ንጽጽር፣ እንዲሁም በ«ትሑት» ውስጥ ያለው ሊሆን የሚችል ምጸት ተጠብቋል።
