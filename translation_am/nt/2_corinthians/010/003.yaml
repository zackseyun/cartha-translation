  yaml_path: translation/nt/2_corinthians/010/003.yaml
  text: For though we walk in the flesh[a], we do not wage war according to the flesh—
translation:
  language: am
  text: ምክንያቱም፣ በሥጋ[a] ብንኖርም፣ እንደ ሥጋ አንዋጋም—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ምክንያቱም፣ በሰውነት ብንኖርም፣ በሰው መለኪያ አንዋጋም።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν σαρκὶ
  choice: በሥጋ
  rationale: የሰውን ሥጋዊ ሕልውና የሚጠቁመውን አገላለጽ በአንጻራዊ ቀጥተኛነት ያቆያል፤ እዚህ ‘የኃጢአት ባሕርይ’ የሚለውን ጠባብ ትርጉም አያስገባም።
- source_word: γὰρ
  choice: ምንም እንኳ … ግን
  rationale: γάρ ከቀደመው ሐሳብ ጋር የሚያያዘው ማብራሪያ በአማርኛው የአንቀጹ ሙሉ አወቃቀር ውስጥ ተፈጥሯዊ በሆነ የንጽጽር ቅርጽ ተገልጧል።
- source_word: περιπατοῦντες
  choice: የምንኖር ብንሆንም
  rationale: ቃሉ ቃል በቃል ‘የምንመላለስ’ ቢሆንም፣ እዚህ የኑሮን ሁኔታ ያመለክታል። ‘የምንኖር’ ይህን ፍቺ በዘመናዊና ግልጽ አማርኛ ያቀርባል፤ የቅናሽ አንቀጹም ከሚከተለው ንጽጽር ጋር ይስማማል።
- source_word: οὐ κατὰ σάρκα
  choice: እንደ ሥጋ ግን አንዋጋም
  rationale: κατὰ σάρκα መለኪያን፣ ዘዴን ወይም መርሕን ሊያመለክት ይችላል። ‘እንደ ሥጋ’ የσάρξን ድግግሞሽ ጠብቆ የሰው መለኪያ፣ ዓለማዊ ዘዴ ወይም ሥጋዊ መርሕ ከሚሉት አንዱን ብቻ አይጭንም።
- source_word: στρατευόμεθα
  choice: አንዋጋም
  rationale: በዐውዱ ያለውን ወታደራዊ ምስል በተፈጥሯዊና ግልጽ አማርኛ ያቆያል።
theological_decisions:
- issue: በሁለቱም ቦታዎች የσάρξ አተረጓጎም
  choice: በዋናው ጽሑፍ ሁለቱንም ‘ሥጋ’ በማለት መተርጎም
  alternative: ‘በሰውነት እንኖራለን … በሰው መለኪያ አንዋጋም’ ወይም ‘በሰው ድካም … በዓለማዊ መንገድ’
  rationale: የመጀመሪያው አጠቃቀም የሰውን ሥጋዊ ሕልውና፣ ሁለተኛው ደግሞ በሰዋዊ ወይም ሥጋዊ መርሕ መመራትን ይጠቁማል። ተመሳሳይ ቃል መጠቀሙ የጳውሎስን የቃል ድግግሞሽና የሐሳብ ውጥረት ይጠብቃል፤ ‘የኃጢአት ባሕርይ’ የሚል ጠባብ ትርጓሜም አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የσάρξ ድግግሞሽ በ‘ሥጋ’ ተጠብቋል፤ የπεριπατεῖν ፈሊጣዊ ፍቺ ግን ለተፈጥሯዊነት ‘መኖር’ ተብሎ ተሰጥቷል። ሰረዙ ሐሳቡ በቀጣዩ ቁጥር እንደሚቀጥል ያመለክታል።
