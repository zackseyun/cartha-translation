- issue: የἁπλότης ትርጉም
  choice: ቅንነት
  alternative: ቀላልነት፤ አንድ ልብነት
  rationale: አውዱ ከመሲሑ ጋር ስላለ ያልተከፋፈለና ከተንኮል ነጻ ታማኝነት ይናገራል፤ ሊኖሩ የሚችሉ ሌሎች ጥላዎች በማስታወሻ ተጠብቀዋል።
- issue: καὶ τῆς ἁγνότητος በዋናው ጽሑፍ መካተቱ
  choice: «እና ንጽሕና»ን ማካተት
  alternative: ሐረጉን መተው
  rationale: SBLGNT ሐረጉን በዋናው ጽሑፍ ያካትታል፤ የሚተዉት የእጅ ጽሑፎች ልዩነት ግን በማስታወሻ ተገልጧል።
