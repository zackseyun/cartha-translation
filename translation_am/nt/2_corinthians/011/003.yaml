base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/003.yaml
  text: But I fear that somehow[a], just as the serpent deceived Eve by his cunning[d][c][b], your minds may be corrupted from the sincerity and purity that are toward Messiah.
translation:
  language: am
  text: ነገር ግን፣ እባቡ ሔዋንን በተንኮሉ እንዳታለላት፣ እንደምንም አሳቦቻችሁ ለመሲሑ ካላችሁ ቅንነት[a]ና ንጽሕና[b] እንዳይበላሹ እፈራለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ቅንነት» የተባለው «ቀላልነት» ወይም «አንድ ልብነት» ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: አንዳንድ የእጅ ጽሑፎች «እና ንጽሕና» የሚለውን ሐረግ አያካትቱም።
    reason: textual_variant
lexical_decisions:
- source_word: φοβοῦμαι
  choice: እፈራለሁ
  rationale: የጳውሎስን ቀጣይነት ያለው ስጋት በቀጥተኛና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: μή πως
  choice: እንደምንም … እንዳይ…
  rationale: የስጋቱን ይዘትና የመከሰት አደጋ ሳያስወግድ በአማርኛ የተለመደውን የስጋት አገባብ ይጠቀማል።
- source_word: ὁ ὄφις
  choice: እባቡ
  rationale: የዘፍጥረትን ትረካ የሚያስታውሰውን የተወሰነ እባብ ያመለክታል።
- source_word: ἐξηπάτησεν
  choice: እንዳታለላት
  rationale: የግሱን የማታለል ትርጉም በግልጽ መደበኛ አማርኛ ያቀርባል።
- source_word: ἐν τῇ πανουργίᾳ αὐτοῦ
  choice: በተንኮሉ
  rationale: ἐν እዚህ የመሣሪያን ወይም የአድራጎትን መንገድ ያመለክታል፤ πανουργία ደግሞ ተንኮለኛ ብልሃትን ይገልጣል።
- source_word: φθαρῇ τὰ νοήματα ὑμῶν
  choice: አሳባችሁ … እንዳይበላሽ
  rationale: ተገብሮአዊውን ሊከሰት የሚችል የአእምሮና የሐሳብ መበላሸት ይጠብቃል፤ የግሪኩ ገለልተኛ ብዙ ቁጥር ስም ከነጠላ ግስ ጋር ያለው አገባብ በተፈጥሯዊ አማርኛ ተወክሏል።
- source_word: τῆς ἁπλότητος
  choice: ቅንነት
  rationale: በዚህ አውድ ቃሉ ንጹሕ ልብነትን፣ ያልተከፋፈለ ታማኝነትንና ከሐሰት ነጻ መሆንን ያመለክታል።
- source_word: καὶ τῆς ἁγνότητος
  choice: እና ንጽሕና
  rationale: የታጨች ድንግል ምሳሌ ባለበት አውድ ሥነ ምግባራዊና መንፈሳዊ ንጽሕናን ሳያጠብ ይገልጣል።
- source_word: τῆς εἰς τὸν Χριστόν
  choice: ለመሲሑ ካላችሁ
  rationale: የቅንነቱና የንጽሕናው አቅጣጫ ወደ መሲሑ መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
