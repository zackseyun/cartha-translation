  rationale: ሁለቱ ስሞች የተቋቋማቸውን የእጦት ሁኔታዎች ይገልጣሉ፤ ተያይዘው መተርጎማቸው የግሪኩን አጭር ዝርዝር ይጠብቃል።
- source_word: ἐν νηστείαις πολλάκις
  choice: ብዙ ጊዜ በጾም[a]
