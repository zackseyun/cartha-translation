- source_word: ἐν ἀγρυπνίαις πολλάκις
  choice: ብዙ ጊዜ እንቅልፍ በማጣት
  rationale: ἀγρυπνία ነቅቶ መቆየትን ወይም እንቅልፍ ማጣትን ያመለክታል፤ ይህ አተረጓጎም ተደጋጋሚነቱን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: ἐν λιμῷ καὶ δίψει
