    issue: “በማዋረዴ” is stronger than the source’s self-humbling language.
    rationale: In modern Amharic it can suggest being disgraced or humiliated. “ራሴን ዝቅ በማድረጌ” preserves voluntary self-lowering without adding that intensity.
  - severity: low
    issue: “ሰበክሁላችሁ” may suggest preaching in a narrower ecclesial or sermonic sense.
    rationale: εὐαγγελίζω denotes announcing/proclaiming the gospel. “አበሰርኳችሁ” is natural Amharic and more directly reflects that meaning.
