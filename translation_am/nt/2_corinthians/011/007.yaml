- source_word: ἐμαυτὸν ταπεινῶν
  choice: ራሴን በማዋረዴ
  rationale: የድርጊቱን ራስን ዝቅ የማድረግ ትርጉምና ከክብር/ማዕረግ ጋር ያለውን ንጽጽር በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἵνα ὑμεῖς ὑψωθῆτε
  choice: እናንተ ከፍ እንድትሉ
  rationale: የዓላማውን አንቀጽ እና ጳውሎስ ራሱን ከማዋረዱ ጋር ያለውን የክብር ተቃርኖ ይጠብቃል፤ ተገብሮ ቅርጹን በአማርኛ ተፈጥሯዊ በሆነ አገላለጽ ያቀርባል።
- source_word: ὅτι
  choice: ስለ
  rationale: ሊባል ለሚችለው «ኃጢአት» ምክንያት ወይም ይዘት የሆነውን ቀጣይ አንቀጽ በግልጽ ሁኔታ ያገናኛል።
- source_word: δωρεὰν
  choice: ያለ ክፍያ
  rationale: በገንዘብ ክፍያ ሳይቀበል የሚለውን አውዳዊ ትርጉም በግልጽና በክብር ያስተላልፋል፤ «በነፃ» እንደ አጭር አማራጭ ተጠቅሷል።
- source_word: τὸ τοῦ θεοῦ εὐαγγέλιον
  choice: የእግዚአብሔርን ወንጌል
  rationale: የግሪኩን የባለቤትነት/ምንጭ ግንኙነት ሳይወስን በተለመደው የአማርኛ መጽሐፍ ቅዱሳዊ ቃል ያቀርባል።
- source_word: εὐηγγελισάμην ὑμῖν
  choice: ሰበክሁላችሁ
  rationale: ወንጌልን ለእነርሱ ማወጁን በዘመናዊና በተለመደ አማርኛ ይገልጣል።
theological_decisions:
- issue: ጳውሎስ ራሱን ስለማዋረዱና ያለ ክፍያ ስለሰበከው ያቀረበው የአጸፋ ጥያቄ
  choice: ጥያቄውንና ምጸቱን በቀጥታ ማቅረብ፣ ስለ አገልጋዮች ክፍያ ተጨማሪ የእምነት ፍርድ ሳይጨመር
  alternative: ጳውሎስ የሐዋርያነት መብቱን እንደካደ አስፍቶ መተርጎም፣ ወይም ምጸቱን ወደ ተራ ይቅርታ ማለዘብ
  rationale: ግሪኩ ራሱን ማዋረዱና ወንጌልን ያለ ክፍያ ማወጁ «ኃጢአት» እንደሆነ በምጸታዊ ጥያቄ ያቀርባል፤ ትርጉሙ ይህን ውጥረት ይጠብቃል እንጂ ከጽሑፉ በላይ አይፈታውም።
