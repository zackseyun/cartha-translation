  terminology: “የእግዚአብሔርን ወንጌል” is appropriate. “አበሰርኳችሁ” directly expresses proclaiming good news and avoids narrowing εὐηγγελισάμην to a sermon setting. The lexical-alternative footnotes are retained with their anchors.
