base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/007.yaml
  text: Or did I commit a sin by humbling myself so that you might be exalted[b][a], because I proclaimed the gospel of God to you free of charge?
translation:
  language: am
  text: 'ወይስ እናንተ ከፍ እንድትሆኑ ራሴን ዝቅ በማድረጌ፣ የእግዚአብሔርን ወንጌል ያለ ክፍያ[b] ስለ አበሰርኳችሁ፣ ኃጢአት ሠራሁ[a]?


    [a] ወይም፣ «ኃጢአት አደረግሁ?» የግሪኩ አነጋገር ቃል በቃል «ኃጢአት ሠራሁ» የሚል ነው።


    [b] ወይም፣ «በነፃ»።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ኃጢአት አደረግሁ?» የግሪኩ አነጋገር ቃል በቃል «ኃጢአት ሠራሁ» የሚል ነው።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «በነፃ»።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: ወይስ
  rationale: ከቀደመው ሐሳብ ጋር የተያያዘውን ስለታም የአጸፋ ጥያቄ በተፈጥሯዊ አማርኛ ያስተዋውቃል።
