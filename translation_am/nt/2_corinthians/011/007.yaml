  source_fidelity: The draft accurately preserves the rhetorical question, the moral category of “sin,” the purpose relation between Paul’s self-lowering and the Corinthians’ elevation, and the gratuitous proclamation of God’s gospel. A small wording change better represents ταπεινῶν without the unnecessarily harsh connotation of public humiliation.
