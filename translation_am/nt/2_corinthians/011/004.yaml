base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/004.yaml
  text: For if someone comes and proclaims another Jesus[a], whom we did not proclaim, or if you receive a different spirit, which you did not receive, or a different gospel, which you did not accept[c][b], you put up with it well enough.
translation:
  language: am
  text: ማንም ሰው መጥቶ እኛ ያልሰበክነውን ሌላ ኢየሱስ ቢሰብክ፣ ወይም እናንተ ያልተቀበላችሁትን የተለየ መንፈስ[a] ብትቀበሉ፣ ወይም ያልተቀበላችሁትን የተለየ ወንጌል[b] ብትቀበሉ፣ በደንብ ትታገሡታላችሁና![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ሌላ መንፈስ» ተብሎም ሊተረጎም ይችላል። የግሪኩ ቃል ከቀድሞ ከተቀበሉት የተለየ መንፈስን ያጎላል።
    reason: lexical_alternative
  - marker: b
    text: «ሌላ ወንጌል» ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: c
    text: «በደንብ ትታገሡታላችሁ» የሚለው ምጸታዊ አነጋገር ይመስላል፤ የቆሮንቶስ ሰዎች እንዲህ ያለውን ስብከት በቀላሉ መታገሣቸውን ይወቅሳል።
    reason: interpretive_tone
lexical_decisions:
- source_word: ὁ ἐρχόμενος
  choice: አንድ ሰው መጥቶ
  rationale: በአውዱ ውስጥ በእነርሱ ዘንድ የሚመጣን ያልተወሰነ ሰው ያመለክታል፤ ይህ አተረጓጎም በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: ἄλλον Ἰησοῦν
  choice: ሌላ ኢየሱስ
  rationale: የኢየሱስን ስም እየተጠቀመ ነገር ግን በተለየ መልኩ የሚቀርብን ተቀናቃኝ ስብከት ያሳያል።
- source_word: κηρύσσει / ἐκηρύξαμεν
  choice: ቢሰብክ / ያልሰበክነውን
  rationale: «መስበክ» ለሕዝብ በይፋ ማወጅን የሚገልጽ በጳውሎስ ጽሑፎችም የተለመደ የአማርኛ ቃል ነው።
- source_word: πνεῦμα ἕτερον
  choice: የተለየ መንፈስ
  rationale: ἕτερος በዚህ አውድ የዓይነት ልዩነትን ያጎላል፤ የመንፈሱ ማንነት ግን ሳይወሰን ተቀምጧል።
- source_word: λαμβάνετε / ἐλάβετε
  choice: ብትቀበሉ / ያልተቀበላችሁትን
  rationale: λαμβάνω የቀረበውን ወይም የተሰጠውን መቀበል ያመለክታል።
- source_word: εὐαγγέλιον ἕτερον
  choice: የተለየ ወንጌል
  rationale: «ወንጌል» የተለመደው አቻ ቃል ሲሆን «የተለየ» ደግሞ የἕτερονን ንጽጽራዊ ኃይል ያስቀምጣል።
- source_word: ἐδέξασθε
  choice: ያልተቀበላችሁትን
  rationale: በአማርኛ «መቀበል» ማለት መቀበልንና በፈቃድ ማጽደቅን ሊያካትት ይችላል፤ ግሱ ከቀደመው λαμβάνω ጋር ያለው ረቂቅ ልዩነት በአውዱ ይገባል።
- source_word: καλῶς ἀνέχεσθε
  choice: በደንብ ትታገሡታላችሁና!
  rationale: «መታገሥ» ἀνέχομαι የሚያመለክተውን መቻልና መታገሥ ይገልጣል፤ «በደንብ» እና የአጋኖ ምልክቱ በአውዱ ያለውን ምጸታዊ ወቀሳ ያሰማሉ።
- source_word: εἰ μὲν γὰρ
  choice: ቢ…ና
  rationale: የግሪኩን ምክንያታዊና ሁኔታዊ ፍሰት በተፈጥሯዊ የአማርኛ ሐረግ ያቀርባል።
