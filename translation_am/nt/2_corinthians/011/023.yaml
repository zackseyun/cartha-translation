- source_word: ἐν πληγαῖς ὑπερβαλλόντως
  choice: በድብደባ ከመጠን በላይ
  rationale: πληγή ድብደባን፣ ምትን ወይም ቁስልን ሊያመለክት ይችላል፤ በዚህ የመከራ ዝርዝር ‘ድብደባ’ ሳያጠብ ትርጉሙን በግልጽ ያቀርባል።
- source_word: ἐν θανάτοις πολλάκις
  choice: ለሞትም ብዙ ጊዜ ተጋልጬአለሁ
