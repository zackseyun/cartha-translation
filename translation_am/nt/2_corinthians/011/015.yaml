base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/015.yaml
  text: So it is no great thing if his servants also disguise themselves as servants of righteousness[a], whose end will be according to their works.
translation:
  language: am
  text: ስለዚህ የእርሱ አገልጋዮችም ራሳቸውን የጽድቅ[a] አገልጋዮች አስመስለው ቢታዩ ምንም አያስደንቅም፤ መጨረሻቸውም እንደ ሥራቸው ይሆናል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የፍትሕ አገልጋዮች።” የግሪኩ ቃል “ጽድቅ” ወይም “ፍትሕ” ማለት ይችላል፤ እዚህ ግን ከትክክለኛው ነገር ጋር የተሰለፉ የመምሰላቸውን ሁኔታ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μέγα
  choice: ምንም አያስደንቅም
  rationale: የግሪኩ አነጋገር ነገሩ የሚያስገርም ወይም የሚያስደንቅ አለመሆኑን ይገልጣል፤ ይህ አተረጓጎም በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ቁጥር የሚወጣውን ድምዳሜ በግልጽ ያሳያል።
- source_word: διάκονοι
  choice: አገልጋዮች
  rationale: በዚህ አውድ የሰይጣንን ፈቃድ የሚፈጽሙ ወኪሎችን ያመለክታል፤ ‘አገልጋዮች’ ከክህነታዊ የማዕረግ ስሜት የጸዳ እና ግልጽ ነው።
- source_word: μετασχηματίζονται
  choice: ራሳቸውን … አስመስለው ቢያቀርቡ
  rationale: ግሱ ውስጣዊ ለውጥን ሳይሆን ውጫዊ መልክንና አቀራረብን በማታለል መቀየርን ያመለክታል።
- source_word: ὡς
  choice: … አስመስለው
  rationale: የተላበሱትን የሐሰት ሚናና መልክ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: δικαιοσύνης
  choice: ጽድቅ
  rationale: በዚህ ስፍራ ትክክለኛና ቅን የመሆንን ውጫዊ መልክ ያመለክታል፤ ‘ፍትሕ’ የሚለው ሌላ የቃሉ ትርጉም በእግር ማስታወሻ ተጠብቋል።
- source_word: τὸ τέλος
  choice: መጨረሻቸው
  rationale: የሚጠብቃቸውን የመጨረሻ ውጤት ወይም ፍርድ በአጭርና በተለመደ አነጋገር ይገልጣል።
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: እንደ ሥራቸው
  rationale: የመጨረሻ ውጤታቸው ከድርጊታቸው ጋር እንደሚመጣጠን የሚገልጠውን የፍርድ አነጋገር ይጠብቃል።
theological_decisions:
- issue: በጳውሎሳዊው አገላለጽ δικαιοσύνη የሚለውን ቃል መተርጎም
  choice: ጽድቅ
  alternative: ፍትሕ
  rationale: አውዱ እነዚህ ሰዎች ከትክክለኛውና ከቅኑ ነገር ጋር የተሰለፉ መስለው እንደሚታዩ ያመለክታል። ‘ጽድቅ’ ይህን በሚገባ ሲያስተላልፍ፣ ‘ፍትሕ’ የሚለው እውነተኛ የቃሉ አማራጭ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። ‘ራሳቸውን … አስመስለው ቢያቀርቡ’ የሚለው አነጋገር ውጫዊ ማስመሰልን ያሳያል፤ ‘እንደ ሥራቸው’ የሚለውም የምንጩን አጭር የፍርድ አገላለጽ ይጠብቃል።
