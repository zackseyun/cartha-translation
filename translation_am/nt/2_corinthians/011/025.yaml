base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/025.yaml
  text: Three times I was beaten with rods[a], once I was stoned, three times I was shipwrecked; I have spent a night and a day in the deep.
translation:
  language: am
  text: ሦስት ጊዜ በበትር ተመታሁ፤ አንድ ጊዜ በድንጋይ ተወገርሁ፤ ሦስት ጊዜ መርከብ ተሰበረብኝ፤ አንድ ሌሊትና አንድ ቀን በጥልቅ ውሃ ውስጥ[a] አሳለፍሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በክፍት ባሕር።”
    reason: lexical_alternative
lexical_decisions:
- source_word: τρὶς
  choice: ሦስት ጊዜ
  rationale: የድርጊቱን ሦስት ጊዜ መደጋገም በተፈጥሯዊና ግልጽ አማርኛ ያሳያል፤ በሁለቱም ስፍራዎች በተመሳሳይ መንገድ ተተርጉሟል።
- source_word: ἐραβδίσθην
  choice: በበትር ተመታሁ
  rationale: ግሱ በበትር መምታትን በተለይ ስለሚያመለክት መሣሪያው በግልጽ ተጠቅሷል፤ ተገብሮአዊውም አቀራረብ ተጠብቋል።
- source_word: ἅπαξ
  choice: አንድ ጊዜ
  rationale: አንድ ጊዜ ብቻ መፈጸሙን በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: ἐλιθάσθην
  choice: በድንጋይ ተወገርሁ
  rationale: λιθάζω የሚያመለክተውን በድንጋይ የመውገር ኃይለኛ ድርጊት በትክክል ይገልጣል።
- source_word: ἐναυάγησα
  choice: መርከብ ተሰበረብኝ
  rationale: የመርከብ መሰበር አደጋ እንደደረሰበት በተለመደና ለአንባቢ ግልጽ በሆነ አማርኛ ያስተላልፋል።
- source_word: νυχθήμερον
  choice: አንድ ሌሊትና አንድ ቀን
  rationale: የግሪኩን የሌሊትና የቀን ቅደም ተከተል ይጠብቃል፤ ‘ሃያ አራት ሰዓት’ የሚል ከምንጩ የበለጠ ትክክለኛ መስሎ የሚታይ አገላለጽንም ያስወግዳል።
- source_word: ἐν τῷ βυθῷ
  choice: በጥልቁ
  rationale: βυθός የጥልቅ ውሃን ወይም የባሕርን ጥልቅ ስፍራ ያመለክታል፤ አጭር ትርጉሙ የምንጩን መጠነኛ አሻሚነት ይጠብቃል።
- source_word: πεποίηκα
  choice: አሳለፍሁ
  rationale: ποιέω ከጊዜ መግለጫ ጋር ሲመጣ ‘ጊዜን ማሳለፍ’ የሚለውን ፍቺ ይሰጣል፤ ይህም በአማርኛ ተፈጥሯዊ ነው።
