base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/011.yaml
  text: Why? Because I do not love you? God knows I do.
translation:
  language: am
  text: ለምን? ስለማልወዳችሁ ነው? እግዚአብሔር ያውቃል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም ትርጉሙን ግልጽ በማድረግ፣ “እንደምወዳችሁ እግዚአብሔር ያውቃል።” የግሪኩ ጽሑፍ በቀጥታ “እግዚአብሔር ያውቃል” ብቻ ይላል።
    reason: የግሪኩ አጭር አነጋገር የተገመተውን መልስ ሳይገልጽ ስለሚተው፣ የትርጉም አማራጩን ለማሳየት።
lexical_decisions:
- source_word: διὰ τί
  choice: ለምን?
  rationale: ምክንያቱን የሚጠይቀውን አጭርና አጽንዖታዊ ጥያቄ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ὅτι οὐκ ἀγαπῶ ὑμᾶς
  choice: ስለማልወዳችሁ ነው?
  rationale: ὅτιን ከቀደመው ‘ለምን?’ ጋር እንደ ምክንያታዊ መልስ ያገናኛል፤ አሉታውን፣ ፍቅርንና ብዙ ቁጥር ተሳቢውን ይጠብቃል።
- source_word: ὁ θεὸς
  choice: እግዚአብሔር
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ ንባብ ውስጥ ለእውነተኛው አምላክ የተለመደ፣ ክብር ያለውና ለአንባቢዎች ግልጽ ስያሜ ነው።
- source_word: οἶδεν
  choice: ያውቃል
  rationale: የግሪኩን አጭር መደምደሚያ በቀጥታ ይጠብቃል፤ በጽሑፉ ያልተነገረውን ‘እንደምወዳችሁ’ በዋናው ጽሑፍ አይጨምርም።
theological_decisions:
- issue: የመጨረሻውን ὁ θεὸς οἶδεν እንደ ባዶ ‘እግዚአብሔር ያውቃል’ መተርጎም ወይስ የተገመተውን አዎንታዊ መልስ ግልጽ ማድረግ
  choice: እግዚአብሔር ያውቃል።
  alternative: እንደምወዳችሁ እግዚአብሔር ያውቃል።
  rationale: የግሪኩ ጽሑፍ የሚያስቀምጠው ‘እግዚአብሔር ያውቃል’ ብቻ ነው። ዐውደ ንባቡ ጳውሎስ እንደሚወዳቸው ቢያመለክትም፣ ትርጉሙ የጽሑፉን አጭርነትና የንግግሩን ውጥረት ይጠብቃል፤ የተገመተው ሙሉ ሐሳብ በማስታወሻ ይገለጻል።
translation_notes:
  register: ትርጉሙ አጭር፣ የተፈጥሮ ንግግር ያለውና ክብር የጠበቀ ዘመናዊ መደበኛ አማርኛ ነው። ሁለቱ ጥያቄዎች የግሪኩን አጽንዖት ይጠብቃሉ፤ የመጨረሻው አጭር ንግግር ደግሞ የምንጩን እውነተኛ አሻሚነት አያጠፋም።
