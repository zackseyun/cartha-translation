  yaml_path: translation/nt/2_corinthians/011/001.yaml
  text: I wish you would bear with me in a little foolishness[a]. But indeed[b], do bear with me.
translation:
  language: am
  text: በትንሽ ሞኝነት[a] ብትታገሡኝ እመኛለሁ! እንዲያውም፣ ታገሡኝ[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በትንሽ ቂልነት።»
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «ታገሡኝ» ማለት «ቻሉኝ/ተቀበሉኝ» ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὄφελον
  choice: ደስ ባለኝ
  rationale: ያልተፈጸመን ምኞት በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል፤ ከተከታዩ ብትታገሡኝ ጋርም የግሪኩን የምኞት ኃይል ያስጠብቃል።
- source_word: ἀνείχεσθέ / ἀνέχεσθέ
  choice: ብትታገሡኝ / ታገሡኝ
  rationale: ἀνέχομαι እዚህ አንድን ሰው በትዕግሥት መቀበልን ወይም መቻልን ያመለክታል። ግሱን በመድገም የግሪኩ ተደጋጋሚ ልመና ተጠብቋል።
- source_word: μου
  choice: -ኝ
  rationale: ከታገሡ ጋር የተያያዘው የመጀመሪያ መደብ ነጠላ ተሳቢ በአማርኛ በግሱ ላይ በቅጥያ በተፈጥሯዊነት ተገልጧል።
- source_word: μικρόν τι
  choice: በጥቂት
  rationale: የጳውሎስን ሆን ብሎ የሚያሳንስ አነጋገር በአጭርና ተፈጥሯዊ መንገድ ያስተላልፋል።
- source_word: ἀφροσύνης
  choice: ሞኝነቴ
  rationale: ሞኝነት የቃሉን መሠረታዊ ፍቺና በዐውዱ ያለውን ራስን ዝቅ አድርጎ የመናገር ምጸት ይጠብቃል፤ የባለቤትነት ቅጥያው ይህ የተናጋሪው ተግባር መሆኑን በአማርኛ ግልጽ ያደርጋል።
- source_word: ἀλλὰ καὶ
  choice: እንዲያውም
  rationale: ወደ ልመናው በማጠናከር የሚመለሰውን አጽንዖት በተፈጥሯዊ አማርኛ ይገልጣል፤ ንጹሕ ተቃርኖ ብቻ እንዳይመስልም ያደርጋል።
theological_decisions:
- issue: ጳውሎስ ንግግሩን ሞኝነት ብሎ መጥራቱ
  choice: ራስን ዝቅ አድርጎ የሚያቀርብ ምጸታዊ አነጋገር እንደሆነ ሳይለዝብ ሞኝነቴ ተብሎ ተጠብቋል
  alternative: ጥቂት የማይረባ ነገር
  rationale: ይህ ቁጥር ጳውሎስ በምጸት ወደሚያቀርበው የመመካት ክፍል መግቢያ ነው። ግልጽ የሆነውን ሞኝነት የሚለውን ቃል ማቆየት የጽሑፉን ሥነ ንግግራዊና ሥነ መለኮታዊ ውጥረት አያጠፋም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የምኞቱ ኃይል በ«ብት… ደስ ባለኝ»፣ የተደገመው ልመና ደግሞ በ«ታገሡኝ» ተጠብቋል።
