base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/009.yaml
  text: And when I was present with you and was in need[a], I was not a burden to anyone; for the brothers who came from Macedonia supplied what I lacked. And in everything I kept myself from being a burden to you[b], and will keep doing so.
translation:
  language: am
  text: ከእናንተ ጋር ሳለሁ እጥረት በገጠመኝ ጊዜ፣ ለማንም ሸክም አልሆንኩም[a]፤ ምክንያቱም ከመቄዶንያ የመጡት ወንድሞች[b] የጎደለኝን አሟሉልኝ። በሁሉም ነገር ለእናንተ ሸክም እንዳልሆን ራሴን ጠብቄአለሁ፤ ወደፊትም እጠብቃለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ ግስ ‘ማንንም አላስቸገርኩም’ ተብሎም ሊተረጎም ይችላል፤ እዚህ ግን በተለይ በገንዘብ ወይም በኑሮ ረገድ በሌላ ሰው ላይ ሸክም መሆንን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: “ወንድሞች” የተባለው ተባዕታይ ብዙ ቁጥር ያለውን የግሪክ ቃል ይተረጉማል። ጳውሎስ እንደ ዐውዱ ቃሉን የእምነት ባልንጀሮችን በሰፊው ለማመልከት ሊጠቀምበት ይችላል፤ እዚህ ግን ከመቄዶንያ የመጡ የተወሰኑ ወንድ ተባባሪዎችን የሚያመለክት ይመስላል።
    reason: lexical_alternative
