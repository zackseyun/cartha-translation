  source_fidelity: The draft accurately conveys Paul’s presence, material need, refusal to burden anyone, Macedonian support, and his past and future resolve. The masculine plural ἀδελφοί is appropriately rendered ወንድሞች. A small syntactic revision makes the causal γάρ relationship explicit and smooth in Amharic.
