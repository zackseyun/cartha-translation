review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the present-and-future resolve, the repeated use of ἀφορμή, the purpose clauses, and the comparison with Paul and his coworkers. However, the first occurrence of “አጋጣሚ” is syntactically detached from the verb, while “አጋጣሚውን” is less clear about whose opportunity is being removed. A modest recasting makes the repeated noun and the deprivation sense explicit without adding interpretation.
  naturalness: “አጋጣሚ ከሚፈልጉት ሰዎች አጋጣሚውን ለመንጠቅ” is awkward in modern standard Amharic. “የሚፈልጉትን አጋጣሚ ለማስቀረት” is clear and idiomatic. The remainder is natural, though “እንዲገኙ” is best retained with an explicit comparison.
  terminology: “አጋጣሚ” is an appropriate neutral main-text equivalent for ἀφορμή. The note properly preserves “ሰበብ” and “ምክንያት” as alternatives. “መንጠቅ” is vivid but is not the most idiomatic collocation with an abstract opportunity in this construction; “ማስቀረት” accurately conveys the metaphorical deprivation intended by ἐκκόψω.
  issues:
  - severity: medium
    issue: The repeated ἀφορμή construction is unclear in the main text.
    rationale: 'The phrase separates the first “አጋጣሚ” from its governing action and then uses a definite “አጋጣሚውን,” which can obscure the Greek sense: Paul intends to deprive those seeking an opportunity of that opportunity.'
