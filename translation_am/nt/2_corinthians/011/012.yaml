  text: Ὃ δὲ ποιῶ καὶ ποιήσω, ἵνα ἐκκόψω τὴν ἀφορμὴν τῶν θελόντων ἀφορμήν, ἵνα ἐν ᾧ καυχῶνται εὑρεθῶσιν καθὼς καὶ ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/012.yaml
  text: But what I am doing[a], I will continue to do, in order to cut off the opportunity from those who want an opportunity, so that in what they boast about they may be found to be just as we are.
translation:
  language: am
  text: ነገር ግን እያደረግሁ ያለሁትን ማድረጌን እቀጥላለሁ፤ ይህም አጋጣሚ[a] ከሚፈልጉት ሰዎች የሚፈልጉትን አጋጣሚ ለማስቀረት ነው፤ ይህም በሚመኩበት ነገር እንደ እኛ ሆነው እንዲገኙ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “አጋጣሚ” የሚለው ቃል በሁለቱም ስፍራ “ሰበብ” ወይም “ምክንያት” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃ δὲ ποιῶ καὶ ποιήσω
  choice: ነገር ግን እያደረግሁ ያለሁትን ማድረጌን እቀጥላለሁ
  rationale: የአሁኑን ድርጊትና ወደፊትም በዚያው ለመቀጠል ያለውን ቁርጠኝነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐκκόψω
  choice: ለመንጠቅ
  rationale: ተቃዋሚዎቹ የሚፈልጉትን መነሻ ከእነርሱ የማስወገድ ምሳሌያዊ ኃይል ይጠብቃል፤ በአማርኛም ‘አጋጣሚውን መንጠቅ’ ተፈጥሯዊ ነው።
- source_word: ἀφορμή
  choice: አጋጣሚ
  rationale: ቃሉ አጋጣሚን፣ መነሻን ወይም ሰበብን ሊያመለክት ይችላል። ‘አጋጣሚ’ በዋናው ጽሑፍ የቃሉን ገለልተኛና ሰፊ ትርጉም ይጠብቃል።
- source_word: τῶν θελόντων ἀφορμήν
  choice: አጋጣሚ ከሚፈልጉት ሰዎች
  rationale: የግሪኩን አጭርና የተሰነዘረ አገላለጽ ይጠብቃል፤ የἀφορμήን ድግግሞሽም በአማርኛው ያስቀራል።
- source_word: ἐν ᾧ καυχῶνται
  choice: በሚመኩበት ነገር
  rationale: የመመካታቸውን ጉዳይ ወይም መስክ ሳይገድብ በግልጽ ዘመናዊ አማርኛ ያቀርባል።
- source_word: εὑρεθῶσιν καθὼς καὶ ἡμεῖς
  choice: እንደ እኛ ሆነው እንዲገኙ
  rationale: የεὑρεθῶσινን ተገብሮአዊ አገላለጽና ከጳውሎስና ከባልደረቦቹ ጋር የሚደረገውን ንጽጽር ይጠብቃል።
theological_decisions:
- issue: ተቃዋሚዎቹ የሚፈልጉት ἀφορμή ምንነት
  choice: በዋናው ጽሑፍ ገለልተኛ የሆነውን ‘አጋጣሚ’ መጠቀም
  alternative: ‘ሰበብ’ ወይም ‘ምክንያት’
  rationale: ዐውደ ንባቡ የክርክር ቃና ቢኖረውም ἀφορμή በራሱ ምግባራዊ ክፋትን የሚያሳየውን ‘ሰበብ’ አያስገድድም። ስለዚህ ዋናው ጽሑፍ አሻሚነቱን ይጠብቃል፤ ሌሎቹ አማራጮች በማስታወሻ ተጠቅሰዋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ የἀφορμή ድግግሞሽ እና የንጽጽሩ ዓላማ ተጠብቀዋል።
