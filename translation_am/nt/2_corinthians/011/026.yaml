- source_word: ἐξ ἐθνῶν
  choice: ከአሕዛብ
  rationale: ከጳውሎስ ወገኖች ጋር ያለውን የግሪኩን ንጽጽር የሚጠብቅ የተለመደ ቃል ነው።
- source_word: ἐν πόλει
  choice: በከተማ ውስጥ
  rationale: የግሪኩን ነጠላና አጠቃላይ አገላለጽ ይጠብቃል።
- source_word: ἐν ἐρημίᾳ
