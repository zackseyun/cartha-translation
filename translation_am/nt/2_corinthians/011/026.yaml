  text: ብዙ ጊዜ በጉዞዎች፣ ከወንዞች በሚመጣ አደጋ፣ ከወንበዴዎች በሚመጣ አደጋ፣ ከገዛ ወገኖቼ[a] በሚመጣ አደጋ፣ ከአሕዛብ በሚመጣ አደጋ፣ በከተማ ውስጥ በሚያጋጥም አደጋ፣ በምድረ በዳ በሚያጋጥም አደጋ፣ በባሕር ላይ በሚያጋጥም አደጋ፣ በሐሰተኛ ወንድሞች[b] መካከል በሚያጋጥም አደጋ፣
  philosophy: optimal-equivalence
