  rationale: የተደጋጋሚ ጉዞን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል፤ የግሪኩን ብዙ ቁጥርም ይጠብቃል።
- source_word: κινδύνοις
  choice: በሚመጣ/በሚያጋጥም አደጋ
  rationale: ተደጋጋሚውን ‘አደጋ’ በመጠበቅ የዝርዝሩን ክምችትና ምት ያሳያል፤ እንደ ምንጩ ወይም ቦታው የአማርኛው ግስ ተስማምቷል።
- source_word: ποταμῶν
  choice: ከወንዞች በሚመጣ
  rationale: አደጋው ከወንዞች መሆኑን ያሳያል፤ ጎርፍ ወይም ወንዝ መሻገር ብሎ ምንጩ ያልገለጠውን አይጨምርም።
- source_word: λῃστῶν
  choice: ከወንበዴዎች
  rationale: በጉዞ አውድ ያሉ ዘራፊዎችን በግልጽና በተለመደ አማርኛ ይገልጣል።
- source_word: ἐκ γένους
  choice: ከገዛ ወገኖቼ
