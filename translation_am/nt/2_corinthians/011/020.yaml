base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/020.yaml
  text: For you put up with it if someone enslaves you[a], if someone devours you, if someone takes from you, if someone exalts himself[b], if someone strikes you in the face.
translation:
  language: am
  text: ማንም ባሪያ ቢያደርጋችሁ፣ ማንም ቢበላችሁ፣ ማንም ከእናንተ ቢወስድ[b]፣ ማንም ራሱን ከፍ ቢያደርግ፣ ማንም ፊታችሁ ላይ ቢመታችሁ፣ ትታገሡታላችሁና።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ችላ ትላላችሁ” ወይም “ትቀበሉታላችሁ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ቢበዘብዛችሁ።” የግሪኩ ቃል በቀጥታ “ቢወስድ” ይላል፤ በዚህ አውድ ግን ብዝበዛን የሚያመለክት ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέχεσθε
  choice: ታግሳችሁ ትቀበሉታላችሁ
  rationale: የቆሮንቶስ ሰዎች ግፍን በተግባር እየታገሡ መቀበላቸውን በዘመናዊና ተፈጥሯዊ አማርኛ ያሳያል፤ የጳውሎስን ምጸታዊ ወቀሳም አያለዝብም።
- source_word: γὰρ
  choice: -ና
  rationale: ቁጥሩን ከቀደመው ሐሳብ ጋር የሚያገናኘውን ማብራሪያዊ ኃይል በአማርኛ ተፈጥሯዊ በሆነ የዓረፍተ ነገር መጨረሻ አገናኝ ይገልጻል።
- source_word: καταδουλοῖ
  choice: ባሪያ ቢያደርጋችሁ
  rationale: ወደ ባርነት ወይም ፍጹም ተገዥነት የማስገባትን ጠንካራ ትርጉም ሳያለዝብ ያስተላልፋል።
- source_word: κατεσθίει
  choice: ቢበላችሁ
  rationale: የመበዝበዝን ምስል ቃል በቃል በሚቀርብ ሕያውና በአማርኛም ሊገባ በሚችል አገላለጽ ይጠብቃል።
- source_word: λαμβάνει
  choice: ከእናንተ ቢወስድ
  rationale: የግሪኩን ሰፊ ‘መውሰድ’ ትርጉም ይጠብቃል፤ አውዱ ብዝበዛን ቢያመለክትም ገንዘብን ወይም ሌላ ነገርን ብቻ በማለት አይገድበውም።
- source_word: ἐπαίρεται
  choice: ራሱን ከፍ ቢያደርግ
  rationale: የራስን ከፍ ማድረግና ትዕቢትን የሚያመለክተውን አንጸባራቂ ኃይል ይጠብቃል።
- source_word: εἰς πρόσωπον ὑμᾶς δέρει
  choice: ፊታችሁን ቢመታችሁ
  rationale: የአካላዊ ጥቃትና ውርደትን ተጨባጭ ምስል ያስተላልፋል፤ ድርጊቱን ‘በጥፊ መምታት’ ብቻ አድርጎ አያጠብበውም።
- source_word: εἴ τις
  choice: ማንም … ቢ-
  rationale: በእያንዳንዱ አንቀጽ የተደገመውን ሁኔታዊ አወቃቀርና የንግግሩን ምት ይጠብቃል።
theological_decisions:
- issue: የጳውሎስ ምጸታዊ ወቀሳ
  choice: የቆሮንቶስ ሰዎች ጨቋኞችን መታገሣቸው በድርጊቶቹ ዝርዝር ብቻ ተገልጿል።
  alternative: ጨቋኞቹን ‘ሐሰተኛ ሐዋርያት’ ወይም ‘ሐሰተኛ አስተማሪዎች’ ብሎ በዋናው ጽሑፍ በግልጽ መሰየም።
  rationale: ሰፊው አውድ ምጸትንና ሐሰተኛ ሐዋርያትን ቢያመለክትም፣ ይህ ቁጥር ራሱ ድርጊቶቹን ይዘረዝራል እንጂ ፈጻሚዎቹን አይሰይምም።
- issue: λαμβάνει የሚለው ያልተገለጸ ተሳቢ
  choice: ‘ከእናንተ ቢወስድ’ ተብሎ የመውሰዱ ነገር ሳይወሰን ቀርቧል።
  alternative: ‘ቢበዘብዛችሁ’ ወይም ‘ገንዘባችሁን ቢወስድ’ ብሎ ትርጉሙን መወሰን።
  rationale: አውዱ ብዝበዛን ይጠቁማል፣ ነገር ግን የግሪኩ ግስ የተወሰነ ነገር አይጠቅስም፤ ስለዚህ እውነተኛው የቃሉ ስፋት ተጠብቋል።
