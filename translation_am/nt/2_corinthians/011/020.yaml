    rationale: “ታግሳችሁ ትቀበሉታላችሁ” uses two near-synonymous expressions for the one Greek verb. “ትታገሡታላችሁ” is sufficient, natural, and retains the supplied object implied by the preceding conditional clauses.
  - severity: low
    issue: Less idiomatic expression for striking the face
    rationale: “ፊታችሁን ቢመታችሁ” is understandable but awkward because both the face and the people are marked as objects. “ፊታችሁ ላይ ቢመታችሁ” is standard modern Amharic and preserves the concrete insult.
