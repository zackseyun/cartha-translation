review_pass:
  verdict: revise
  source_fidelity: The draft retains the fivefold conditional sequence and accurately conveys enslavement, exploitative devouring, unspecified taking, self-exaltation, and a blow to the face. However, the rendering of ἀνέχεσθε is unnecessarily doubled, and the final action needs a more idiomatic Amharic expression for striking someone on the face.
  naturalness: The repeated “ማንም … ቢ-” structure is effective and natural. “ታግሳችሁ ትቀበሉታላችሁ” is redundant, while “ፊታችሁን ቢመታችሁ” is less natural than “ፊታችሁ ላይ ቢመታችሁ.”
  terminology: “ባሪያ ቢያደርጋችሁ,” “ከእናንተ ቢወስድ,” and “ራሱን ከፍ ቢያደርግ” appropriately preserve the source wording and its ambiguity. No doctrinal terminology is introduced.
