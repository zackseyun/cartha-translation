  yaml_path: translation/nt/2_corinthians/011/033.yaml
  text: and through a window in a basket I was lowered through the wall and escaped his hands[a].
translation:
  language: am
  text: በቅጥሩ ውስጥ ባለ መስኮት በኩል፣ በቅርጫት ውስጥ ሆኜ ወደ ታች ተወረድኩ፤ ከእጆቹም አመለጥኩ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ «በገመድ በተሠራ ቅርጫት ውስጥ ሆኜ በቅጥሩ ውስጥ ባለ መስኮት በኩል ወደ ታች ተለቀቅሁ።»
    reason: lexical_alternative
lexical_decisions:
- source_word: θυρίδος
  choice: መስኮት
  rationale: ቃሉ መስኮትን ወይም ትንሽ ክፍተትን ያመለክታል፤ በዚህ አውድ «መስኮት» ተፈጥሯዊና ግልጽ ነው።
- source_word: σαργάνῃ
  choice: ቅርጫት
  rationale: ከገመድ፣ ከዊኬር ወይም ከሌላ ነገር የተጎነጎነ መያዣን ያመለክታል፤ «ቅርጫት» ለዘመናዊ አንባቢ ግልጽ ሲሆን የቁሱ ዓይነት በግሪኩ እርግጠኛ ስላልሆነ በዋናው ጽሑፍ አልተጨመረም።
- source_word: ἐχαλάσθην
  choice: ወደ ታች ተወረድኩ
  rationale: የግሪኩን ተደራጊ ቅርጽና ወደ ታች የማውረድን እንቅስቃሴ በግልጽ ያሳያል።
- source_word: διὰ τοῦ τείχους
  choice: በቅጥሩ በኩል
  rationale: እንቅስቃሴው በቅጥሩ ውስጥ ባለ መስኮት በኩል መሆኑን በተፈጥሯዊ አማርኛ ይገልጣል፤ «የከተማው ቅጥር» የሚለው በጽሑፉ በግልጽ ስላልተጠቀሰ አልተጨመረም።
- source_word: ἐξέφυγον τὰς χεῖρας αὐτοῦ
  choice: ከእጁም አመለጥኩ
  rationale: የአንድ ሰውን ቁጥጥር ወይም ሥልጣን ከሚያመለክተው ሕያው የግሪክ አገላለጽ ጋር ቅርብ ሆኖ በአማርኛም ተፈጥሯዊ ነው።
