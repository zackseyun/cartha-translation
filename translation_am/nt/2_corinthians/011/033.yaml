  rationale: The revision resolves minor clarity and idiomatic-flow problems while preserving the Greek passive construction, the basket as the container/means, the window-and-wall setting, and the vivid plural ‘hands.’ The alternative footnote retains the audit trail’s more specific ‘rope-basket’ rendering and ‘let down’ alternative.
