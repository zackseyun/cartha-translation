lexical_decisions:
- source_word: ἐν Δαμασκῷ
  choice: በደማስቆ
  rationale: ἐν ከዳቲቭ ጋር ቦታን ያመለክታል፤ «በደማስቆ» በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: ἐθνάρχης
  choice: ገዥ
  rationale: ቃሉ በሕዝብ ወይም በአካባቢ ላይ ሥልጣን ያለውን ባለሥልጣን ያመለክታል። ታሪካዊውን የማዕረግ ልዩነት በተረጋገጠ የአማርኛ ቃል ሙሉ በሙሉ ማስቀመጥ አስቸጋሪ ስለሆነ፣ «ገዥ» ለተራ አንባቢ ግልጽ ሆኖ ዋናውን ትርጉም ያቆያል።
- source_word: Ἁρέτα τοῦ βασιλέως
  choice: የንጉሥ አሬታስ
  rationale: የግሪኩ ጄኒቲቭ ገዥው ከንጉሥ አሬታስ ጋር ያለውን የሥልጣን ወይም የአገልግሎት ግንኙነት ያሳያል፤ የአማርኛው «የ-» ይህን ሳይገድብ ያስቀምጣል።
- source_word: ἐφρούρει
  choice: ይጠብቅ ነበር
  rationale: ኢምፐርፌክት ግሱ ባለፈ ጊዜ ቀጣይ የነበረ ቁጥጥርን ያሳያል፤ «ይጠብቅ ነበር» የቀጣይነቱንና የደኅንነት ቁጥጥሩን ሐሳብ ይይዛል።
- source_word: τὴν πόλιν Δαμασκηνῶν
  choice: የደማስቆን ሰዎች ከተማ
  rationale: Δαμασκηνῶν ጄኒቲቭ ብዙ ቁጥር ሲሆን ቃል በቃል «የደማስቆ ሰዎች ከተማ» ይላል። ዋናው ጽሑፍ ይህን ልዩ አገላለጽ ያቆያል፤ ተፈጥሯዊው አማራጭ በማስታወሻ ቀርቧል።
- source_word: πιάσαι με
  choice: እኔን ለመያዝ
  rationale: አኦሪስት ኢንፊኒቲቩ የጥበቃውን ዓላማ ያሳያል። «ለመያዝ» ጠላትነት ያለበትን መቆጣጠር ይገልጣል፤ «ለማሰር» ከሚለው ያነሰ ትርጓሜ ይጨምራል።
