  text: በደማስቆ፣ የንጉሥ አሬታስ ኤትናርክ[b] እኔን ለመያዝ የደማስቆን ከተማ[a] ይጠብቅ ነበር፤
  philosophy: optimal-equivalence
  footnotes:
