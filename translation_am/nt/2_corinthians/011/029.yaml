  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τίς ἀσθενεῖ, καὶ οὐκ ἀσθενῶ; τίς σκανδαλίζεται καὶ οὐκ ἐγὼ πυροῦμαι;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/029.yaml
  text: Who is weak[a], and I am not weak? Who is caused to stumble, and I do not burn with indignation?
translation:
  language: am
  text: ማን ደካማ ነው፣ እኔስ ደካማ አልሆንም? ማን ይሰናከላል፣ ውስጤስ አይነድም?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ውስጤ አይነድም?» የሚለው የግሪኩን «መቃጠል» ምሳሌ ያቆያል። ከፍተኛ ሐዘንን፣ ቅንዓትን ወይም ቁጣን ሊገልጥ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσθενεῖ / ἀσθενῶ
  choice: ይደክማል / አልደክምም
  rationale: የግሪኩ ግስ አካላዊ፣ ማኅበራዊ ወይም መንፈሳዊ ድካምን ሊያመለክት ይችላል። «ይደክማል» ይህን ስፋት ከ«ይታመማል» በተሻለ ይጠብቃል፣ ጳውሎስም በሌሎች ድካም እንደሚሳተፍ ያሳያል።
- source_word: σκανδαλίζεται
  choice: ይሰናከላል
  rationale: ይህ ቃል አንድ ሰው ተጠልፎ ወደ መንፈሳዊ ወይም ሥነ ምግባራዊ ውድቀት መድረሱን በምሳሌያዊ አነጋገር ያሳያል። «ይሰናከላል» ምሳሌውን ይጠብቃል፤ መሰናከሉ ቅር መሰኘትን፣ ኃጢአት መሥራትን ወይም መንፈሳዊ ውድቀትን እንደሚያመለክት አስቀድሞ አይወስንም።
- source_word: πυροῦμαι
  choice: በውስጤ አልቃጠልም
  rationale: ቃሉ በቀጥታ «መቃጠል» ማለት ሲሆን፣ እዚህ ከፍተኛ የውስጥ መነሳሳትን በምሳሌ ይገልጣል። «በውስጤ» ይህ አካላዊ እሳት ሳይሆን ውስጣዊ ስሜት መሆኑን በተፈጥሯዊ አማርኛ ያሳያል፤ ሐዘን፣ ቅንዓት ወይም ቁጣ ከመካከላቸው የትኛው እንደሆነ ግን አይወስንም።
- source_word: τίς
  choice: ማን
  rationale: ስለ ሰዎች የሚቀርቡትን አጽንዖታዊ ጥያቄዎች በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: καὶ οὐκ ἐγὼ
  choice: እኔስ … አል…ም
  rationale: «እኔስ» በሚለው አገላለጽ በግሪኩ ἐγώ ላይ ያለውን አጽንዖት እና የአጽንዖታዊውን ጥያቄ ኃይል በተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: በπυροῦμαι የተገለጠው የጳውሎስ ውስጣዊ ምላሽ
  choice: «በውስጤ አልቃጠልም?» በማለት የመቃጠልን ምሳሌ ማቆየት
  alternative: «በቁጣ አልነድም?» ወይም «እጅግ አላዝንም?»
  rationale: ጳውሎስ ከሌሎች ድካምና መሰናከል ጋር ያለውን ጥልቅ ተሳትፎ ይገልጣል፤ የግሪኩ ምሳሌ ግን ስሜቱን ቁጣ፣ ሐዘን ወይም ቅንዓት ብሎ በአንዱ ብቻ አይወስንም። ስለዚህ ምሳሌውን ማቆየት የምንጩን እውነተኛ አሻሚነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ተደጋጋሚዎቹ አጽንዖታዊ ጥያቄዎችና «እኔስ» የሚለው ንጽጽር ተጠብቀዋል።
