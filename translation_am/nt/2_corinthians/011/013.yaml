source:
  edition: SBLGNT
  text: οἱ γὰρ τοιοῦτοι ψευδαπόστολοι, ἐργάται δόλιοι, μετασχηματιζόμενοι εἰς ἀποστόλους Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/013.yaml
  text: For such men are false apostles[a], deceitful workers, disguising themselves as apostles of Messiah.
translation:
  language: am
  text: እንደዚህ ያሉት ሐሰተኛ ሐዋርያት፣ አታላይ ሠራተኞች፣ ራሳቸውን የመሲሑ[a] ሐዋርያት አስመስለው የሚቀርቡ ናቸውና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የክርስቶስ ሐዋርያት።” የግሪኩ Χριστός እንደ ስም በተጠቀሰበት ጊዜ “ክርስቶስ” ተብሎ ሊተረጎም ይችላል፤ እዚህ “መሲሕ” የተባለው የማዕረጉን ትርጉም ለመጠበቅ ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: ናቸውና
  rationale: ከቀደመው ሐሳብ ጋር ያለውን አብራሪ ግንኙነት በተፈጥሯዊ የአማርኛ አገላለጽ ያሳያል።
- source_word: τοιοῦτοι
  choice: እንደዚህ ያሉት
  rationale: ቀደም ሲል የተገለጹትን ዓይነት ሰዎች ያመለክታል፤ ግሪኩ በግልጽ ‘ወንዶች’ ስለማይል ያንን ቃል አይጨምርም።
- source_word: ψευδαπόστολοι
  choice: ሐሰተኛ ሐዋርያት
  rationale: ሐዋርያት ነን ብለው በሐሰት የሚቀርቡትን በግልጽና በተለመደ አገላለጽ ያሳያል።
- source_word: ἐργάται δόλιοι
  choice: አታላይ ሠራተኞች
  rationale: ሥራቸው በማታለል የተሞላ መሆኑን የቃል ጥንዱን የሞራል ክብደት በመጠበቅ ያስተላልፋል።
- source_word: μετασχηματιζόμενοι
  choice: ራሳቸውን … አስመስለው የሚቀርቡ
  rationale: ውስጣዊ ለውጥን ሳይሆን ሆን ብሎ የሌላ ማንነት መልክ ይዞ መቅረብን ያሳያል።
- source_word: εἰς ἀποστόλους Χριστοῦ
  choice: የመሲሑ ሐዋርያት አስመስለው
  rationale: εἰς ከተሳቢው ጋር የተያዘውን የተወሰደ ማንነት ወይም ሚና በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: Χριστοῦ
  choice: የመሲሑ
  rationale: በዚህ የባለቤትነትና የውክልና ሐረግ ውስጥ Χριστός የማዕረግ ትርጉሙን ጠብቆ ቀርቧል።
theological_decisions:
- issue: የΧριστοῦ አተረጓጎም
  choice: የመሲሑ
  alternative: የክርስቶስ
  rationale: Χριστός እዚህ ‘የተቀባው’ የሚለውን የማዕረግ ትርጉም እንደያዘ ሊነበብ ይችላል፤ ‘መሲሕ’ ይህን ትርጉም ይጠብቃል። በስም መልክ የተለመደው ‘ክርስቶስ’ ግን በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለአብዛኛው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ሐዋርያት’ የተለመደውን መጽሐፍ ቅዱሳዊ ቃል ይጠብቃል፤ ‘አስመስለው የሚቀርቡ’ ደግሞ የሐረጉን የማታለል ኃይል በተፈጥሯዊ አነጋገር ያሳያል።
