source:
  edition: SBLGNT
  text: ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ⸀Ἰησοῦ οἶδεν, ὁ ὢν εὐλογητὸς εἰς τοὺς αἰῶνας, ὅτι οὐ ψεύδομαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/031.yaml
  text: The God and Father of the Lord Jesus[a], he who is blessed forever, knows that I am not lying.
translation:
  language: am
  text: የጌታ ኢየሱስ አምላክና አባት፣ እርሱም ለዘላለም የተባረከ ነው፣ እኔ እንደማልዋሽ ያውቃል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: አምላክና አባት
  rationale: ሁለቱንም ስሞች በአንድ የተያያዘ መግለጫ ያቀርባል፤ የግሪኩን የተወሰነ አገላለጽና የጳውሎስን ክቡር ምስክርነት ይጠብቃል።
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: የጌታ ኢየሱስ
  rationale: κύριος በተለመደው ማዕረግ ‘ጌታ’ ተብሎ ተተርጉሟል፤ በግሪኩ የሌለው ‘የእኛ’ አልተጨመረም።
- source_word: οἶδεν
  choice: ያውቃል
  rationale: የግሱን ቀጥተኛ ፍቺ ይጠብቃል፤ ንግግሩ የመሐላ መሰል ኃይል ቢኖረውም ‘ምስክር ነው’ ብሎ አያሰፋውም።
- source_word: ὁ ὢν εὐλογητὸς
  choice: እርሱም ... የተባረከ ነው
  rationale: እግዚአብሔርን የሚገልጸውን የምስጋና አገላለጽ በተፈጥሯዊ አማርኛ ይይዛል።
- source_word: εἰς τοὺς αἰῶνας
  choice: ለዘላለም
  rationale: የማያቋርጥ ዘመንን የሚገልጸውን የምስጋና ኃይል በተለመደና ግልጽ አማርኛ ያስተላልፋል።
- source_word: ὅτι
  choice: እንደማልዋሽ
  rationale: ὅτι እዚህ የሚታወቀውን ይዘት ያስገባል እንጂ ምክንያትን አይገልጽም።
- source_word: οὐ ψεύδομαι
  choice: እኔ እንደማልዋሽ
  rationale: የአሁኑን ንግግር የሚመለከተውን ‘አልዋሽም’ የሚለውን ማረጋገጫ በተፈጥሯዊ አማርኛ ይገልጻል።
theological_decisions:
- issue: ‘አምላክና አባት’ ከ‘ጌታ ኢየሱስ’ ጋር ያለው ግንኙነት
  choice: ‘የጌታ ኢየሱስ አምላክና አባት’ ተብሎ ቀጥታ ተተርጉሟል።
  alternative: ያለውን የአካላት ልዩነት ለማለዘብ በአገላለጽ መቀየር።
  rationale: ጽሑፉ እግዚአብሔር አብንና ጌታ ኢየሱስን በግንኙነት እየገለጸ ይለያቸዋል፤ ትርጉሙም ይህን ውጥረት ሳያለዝብ ይጠብቃል።
- issue: የምስጋናው ንዑስ አረፍተ ነገር ትስስር
  choice: ‘እርሱም ለዘላለም የተባረከ ነው’ የሚለው እግዚአብሔርን የሚገልጽ ጣልቃ የገባ የምስጋና ንግግር ሆኖ ቀርቧል።
  alternative: ያለ ማቋረጫ ከዋናው ሐረግ ጋር በጥብቅ ማያያዝ።
  rationale: የግሪኩን ገላጭ ሐረግ ተግባር ይጠብቃል፤ በአማርኛም የጳውሎስን ክቡር የመሐላ መሰል ንግግር ግልጽ ያደርጋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የምስጋና ጣልቃ ንግግር በነጠላ ሰረዞች ተለይቷል። የእንግሊዝኛው የግርጌ ማስታወሻ ምልክት ከተሳሳተ ቦታ ጋር የተያያዘ ስለሚመስልና ‘for the ages’ በአማርኛ ከ‘ለዘላለም’ ይልቅ ጠቃሚ የትርጉም አማራጭ ስላልሆነ የግርጌ ማስታወሻ አልተጨመረም።
