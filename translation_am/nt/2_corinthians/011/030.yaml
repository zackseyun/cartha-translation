  text: Εἰ καυχᾶσθαι δεῖ, τὰ τῆς ἀσθενείας μου καυχήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/030.yaml
  text: If I must boast[a], I will boast in the things of my weakness.
translation:
  language: am
  text: መመካት ካለብኝ፣ ድካሜን በሚያሳዩ ነገሮች እመካለሁ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰ
  choice: ካለብኝ
  rationale: ከδεῖ ጋር ተያይዞ የግሪኩን ሁኔታዊ አነጋገር ‘… ካለብኝ’ በሚል ተፈጥሯዊ የአማርኛ አገላለጽ ያቀርባል፤ ‘ስለሚገባኝ’ ብሎ ወደ ምክንያታዊ ንባብ አይቀይረውም።
- source_word: καυχᾶσθαι / καυχήσομαι
  choice: መመካት / እመካለሁ
  rationale: የጳውሎስን ተደጋጋሚ ቃልና ምጸታዊ ንግግር በተመሳሳይ የአማርኛ ሥር ይጠብቃል፤ ‘መኩራራት’ ከሚለው ይልቅ የጽሑፉን ሥነ መለኮታዊ ተቃርኖ በደንብ ያስተላልፋል።
- source_word: δεῖ
  choice: ካለብኝ
  rationale: የግዴታን ወይም የግፊትን ኃይል በአጭርና ተፈጥሯዊ መንገድ ይገልጣል።
- source_word: τὰ τῆς ἀσθενείας μου
  choice: ድካሜን በሚያሳዩ ነገሮች
  rationale: τὰ የተባለውን ብዙ ቁጥር ‘ነገሮች’ በማለት ይጠብቃል፣ የዘርፍ ሐረጉንም በአማርኛ ሊገባ በሚችል መልኩ ይገልጣል።
- source_word: ἀσθενείας
  choice: ድካሜ
  rationale: በዐውዱ ያሉትን አዋራጅና የሰውን አቅም ውስንነት የሚያሳዩ ሁኔታዎች ያካትታል፤ ‘ሕመም’ ብሎ ወደ አካላዊ በሽታ ብቻ አያጠብበውም።
theological_decisions:
- issue: የጳውሎስ መመካት ባሕርይ
  choice: ጳውሎስ በድካሙ የሚመካበትን ምጸታዊና ተቃርኗዊ ንግግር ያለ ተጨማሪ የአስተምህሮ ማብራሪያ ማቅረብ
  alternative: ‘በድካሜ እመካለሁ’ ብሎ ብዙ ቁጥሩንና ያልተለመደውን የግሪክ አወቃቀር ማለስለስ
  rationale: ጥቅሱ ተራ መመካትን በድካም ከመመካት ጋር ያነጻጽራል። ትርጉሙ ይህን ሥነ መለኮታዊ ውጥረት ሳይፈታው መጠበቅ አለበት።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩን ያልተለመደ አወቃቀር ቃል በቃል ከመድገም ይልቅ፣ ‘ድካሜን በሚያሳዩ ነገሮች’ የሚለው ግልጽ አገላለጽ ተመርጧል።
