id: 2CO.11.22
reference: 2 Corinthians 11:22
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ἑβραῖοί εἰσιν; κἀγώ. Ἰσραηλῖταί εἰσιν; κἀγώ. σπέρμα Ἀβραάμ εἰσιν; κἀγώ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/022.yaml
  text: Are they Hebrews? So am I[a]. Are they Israelites? So am I. Are they Abraham’s offspring? So am I.
translation:
  language: am
  text: ዕብራውያን ናቸው? እኔም ነኝ። እስራኤላውያን ናቸው? እኔም ነኝ። የአብርሃም ዘር[a] ናቸው? እኔም ነኝ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክኛው «ዘር» የሚለው ቃል ነጠላ ቅርጽ ቢኖረውም የአብርሃምን ዘሮች በጋራ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑβραῖοί
  choice: ዕብራውያን
  rationale: የብሔርና የባህል ማንነትን የሚገልጠውን የተለመደ ቃል በመጠቀም ከ«እስራኤላውያን» ጋር ያለውን ልዩነት ይጠብቃል።
- source_word: κἀγώ
  choice: እኔም ነኝ
  rationale: καί + ἐγώ የሚለውን አጭርና አጽንዖታዊ ምላሽ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ሦስት ጊዜ መደገሙም የጥቅሱን ምት ይጠብቃል።
- source_word: Ἰσραηλῖται
  choice: እስራኤላውያን
  rationale: የእስራኤል ሕዝብ አባልነትን በትክክል ይገልጣል፤ ቃሉን ከ«ዕብራውያን» እና ከ«የአብርሃም ዘር» ጋር አያዋህደውም።
- source_word: σπέρμα Ἀβραάμ
  choice: የአብርሃም ዘር
  rationale: «ዘር» በአማርኛ ተፈጥሯዊ የሆነ ስብስባዊ ነጠላ ቃል ሲሆን የአብርሃምን ትውልድ ያመለክታል፤ የግሪኩን ነጠላ ስብስባዊ አገላለጽም ይጠብቃል።
- source_word: εἰσιν
  choice: ናቸው? / ነኝ
  rationale: ተደጋጋሚውን የጥያቄና የምላሽ አወቃቀር በተፈጥሯዊ የአማርኛ ሰዋስው ያቀርባል።
theological_decisions:
- issue: በአይሁዳዊ ማንነት መጠሪያዎች መካከል ያለው ስውር ልዩነት
  choice: «ዕብራውያን»፣ «እስራኤላውያን» እና «የአብርሃም ዘር» የሚሉትን ሦስት የተለያዩ መጠሪያዎች መጠበቅ
  alternative: ሁሉንም «አይሁድ» ወይም «የአብርሃም ዘሮች» በሚል አንድ አይነት ቃል ማቅረብ
  rationale: የጳውሎስ አጽንዖታዊ ንግግር ተደራራቢ ነገር ግን የማይመሳሰሉ የማንነትና የትውልድ ጥያቄዎችን በመደርደር ላይ የተመሠረተ ነው፤ ትርጉሙ ይህን ልዩነት አያጥፋም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና በቀላሉ የሚገባ አማርኛን ይጠቀማል። አጭር ጥያቄዎቹና «እኔም ነኝ» የሚለው ተደጋጋሚ ምላሽ የምንጩን ፈጣን ንግግራዊ ምትና አጽንዖት ይጠብቃሉ።
