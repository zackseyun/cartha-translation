base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/006.yaml
  text: But even if I am unskilled in speech[a], I am not in knowledge; indeed[c][b], in every way we have made this plain among all to you.
translation:
  language: am
  text: 'በንግግር ያልሠለጠንሁ ብሆን እንኳ[a]፣ በእውቀት ግን እንዲህ አልሆንም፤ ይልቁንም በሁሉም መንገድ፣ በሁሉም ነገር ይህን ለእናንተ ግልጽ አድርገናል[b]።


    [a] ወይም፣ “በመናገር ያልሠለጠንሁ ብሆን እንኳ።” ይህም የተዋጣለት የንግግር ጥበብ ሥልጠና እንደሌለኝ ማለት ነው።


    [b] የግሪኩ አገላለጽ አጭርና የታመቀ ስለሆነ፣ “በሁሉም መንገድ ለእናንተ በሁሉ ዘንድ ግልጽ አድርገነዋል” ወይም “በሁሉም ሁኔታና በሁሉም ነገር ለእናንተ ግልጽ አድርገናል” ተብሎም ሊገባ ይችላል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በመናገር ያልሠለጠንሁ ብሆን እንኳ።” ይህም የተዋጣለት የንግግር ጥበብ ሥልጠና እንደሌለኝ ማለት ነው።
    reason: lexical_alternative
