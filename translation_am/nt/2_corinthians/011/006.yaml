    reason: alternative_reading
lexical_decisions:
- source_word: ἰδιώτης
  choice: ያልሠለጠነ
  rationale: በዚህ ዐውድ ቃሉ አጠቃላይ አለማወቅን ሳይሆን በንግግር ጥበብ መደበኛ ሥልጠና ወይም የተዋጣለት አቀራረብ አለመኖርን ያመለክታል።
- source_word: τῷ λόγῳ
  choice: በንግግር
  rationale: እዚህ λόγος የመናገር ችሎታንና የንግግር አቀራረብን ያመለክታል፤ “በንግግር” ከእውቀት ጋር ያለውን ንጽጽር በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: γνώσει
  choice: በእውቀት
  rationale: ቀጥተኛውን የ‘እውቀት’ ፍቺ ይጠብቃል፣ እንዲሁም ጳውሎስ በንግግር ብቃትና በይዘት እውቀት መካከል ያደረገውን ንጽጽር ግልጽ ያደርጋል።
- source_word: φανερώσαντες
  choice: ግልጽ አድርገናል
  rationale: የግሪኩ አካፋይ ግስ ነገሩ በተግባር እንደተገለጠ ያሳያል፤ ይህ አገላለጽ ያንን ማስረጃዊ ኃይል በተነባቢ አማርኛ ያቀርባል።
- source_word: ἐν παντί
  choice: በሁሉም መንገድ
  rationale: ሐረጉ ነገሩ ሙሉ በሙሉና በየአቅጣጫው እንደተገለጠ የሚያሳይ ተውሳካዊ አገላለጽ ነው።
- source_word: ἐν πᾶσιν
  choice: በሁሉም ነገር
  rationale: ሐረጉ ሰዎችን ወይም ጉዳዮችን ሊያመለክት የሚችል የታመቀ አገላለጽ ነው፤ ዋናው ትርጉም ሰፊውን ወሰን ሳይገድብ የነገሮችን ንባብ ይይዛል፣ ሌላው ግንዛቤም በማስታወሻ ተጠብቋል።
- source_word: εἰς ὑμᾶς
  choice: ለእናንተ
  rationale: ቆሮንቶሳውያን የዚህ ግልጽ መገለጥ ተቀባዮች መሆናቸውን በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: ጳውሎስ ስለ ንግግር ችሎታው የሰጠው መግለጫ
  choice: በተዋጣለት የንግግር ጥበብ ያልሠለጠነ መሆኑን ይቀበላል፤ እውቀት ወይም ሥልጣን እንደሌለው ግን አይናገርም።
  alternative: ጳውሎስ በአጠቃላይ ያልተማረ ነው፣ ወይም ምንም ጉድለት ሳይቀበል ፍጹም በምፀት ብቻ ይናገራል።
  rationale: ከ‘እውቀት’ ጋር ያለው ቀጥተኛ ንጽጽርና በዐውዱ ያለው ከተፎካካሪ መምህራን ጋር የአቀራረብ ጉዳይ፣ ነጥቡ የንግግር ውበትና ሥልጠና እንጂ የእውነት ወይም የትምህርት ብቃት አለመሆኑን ያሳያል።
- issue: ἐν παντὶ … ἐν πᾶσιν የሚለው የታመቀ አገላለጽ
  choice: “በሁሉም መንገድ፣ በሁሉም ነገር” በማለት የሁለቱን ሐረጎች አጠቃላይነትና አጽንዖት መጠበቅ።
  alternative: ሁለተኛውን ሐረግ “በሁሉ ሰዎች መካከል” ወይም “በሁሉ ፊት” ብሎ እንደ ሰዎች ማብራራት።
  rationale: πᾶσιν በቅርጹ ብዙ ግንዛቤዎችን ይፈቅዳል። ዋናው ትርጉም አንዱን ብቻ እንዳይወስን ሰፊ አገላለጽ ተመርጧል፣ የሰዎች ንባብም በማስታወሻ ቀርቧል።
