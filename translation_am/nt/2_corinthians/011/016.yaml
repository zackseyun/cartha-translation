base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/016.yaml
  text: Again I say[a], let no one think me to be foolish—but if not, then receive me even as foolish, so that I too may boast a little.
translation:
  language: am
  text: ደግሜ እላለሁ፤ ማንም ሰው ሞኝ እንደሆንኩ አያስብ። ካልሆነ ግን፣ እንደ ሞኝ እንኳ ተቀበሉኝ[a]፤ እኔም ጥቂት እንድመካ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ሞኝ እንደሆንኩ … እንደ ሞኝ» የሚለው «ሞኝነት እንዳለብኝ … እንደ ሞኝ ሰው» ተብሎም ሊተረጎም ይችላል። የግሪኩ ቃል ἄφρων እንደ ቅጽል ወይም እንደ ስም ሊወሰድ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν λέγω
  choice: ደግሜ እላለሁ
  rationale: የጳውሎስን ተደጋጋሚ ማሳሰቢያ በተፈጥሯዊና አጭር አማርኛ ያቀርባል።
- source_word: μή τίς με δόξῃ ἄφρονα εἶναι
  choice: ማንም ሰው ሞኝ እንደሆንኩ አያስብ
  rationale: μή ከንዑስ አድራጊ ግስ ጋር የሚሰጠውን ክልከላ በተፈጥሯዊ የአማርኛ አገላለጽ ያስተላልፋል፤ ἄφρων እዚህ በስምነት በተፈጥሯዊ ሁኔታ «ሞኝ» ተብሏል።
- source_word: εἰ δὲ μή γε
  choice: ካልሆነ ግን
  rationale: የቀደመውን ጥያቄ ካልተቀበሉ ቢያንስ የሚቀጥለውን እንዲያደርጉ የሚያቀርበውን አማራጭ ስምምነት ይገልጣል።
- source_word: κἂν ὡς ἄφρονα δέξασθέ με
  choice: እንደ ሞኝ እንኳ ተቀበሉኝ
  rationale: κἂν ያለውን የመስማማት ወይም የመቻቻል አጽንዖት «እንኳ» ያስተላልፋል፤ δέξασθέ με ቀጥተኛውን ትእዛዝ «ተቀበሉኝ» ብሎ ይጠብቃል።
- source_word: ἵνα κἀγὼ μικρόν τι καυχήσωμαι
  choice: እኔም ጥቂት እንድመካ
  rationale: ἵνα የዓላማ ግንኙነቱን፣ κἀγώ የ«እኔም»ን አጽንዖት፣ μικρόν τι ደግሞ የመጠኑን አነስተኛነት ይጠብቃሉ፤ καυχάομαι ሳይለሰልስ «መመካት» ተብሏል።
