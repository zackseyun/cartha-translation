    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: ስለሚ-
  rationale: የጳውሎስን ቀጣይ አነጋገር ምክንያት የሚያሳየውን ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: πολλοὶ
  choice: ብዙዎች
  rationale: የብዛት ትርጉሙን ቀጥተኛና ተፈጥሯዊ በሆነ አማርኛ ያቀርባል።
- source_word: καυχῶνται / καυχήσομαι
  choice: ይመካሉ / እመካለሁ
  rationale: በሁለቱ ግሶች መካከል ያለውን ሆን ተብሎ የተደረገ ድግግሞሽና የአውዱን ምጸታዊ ቃና ይጠብቃል።
- source_word: κατὰ σάρκα
  choice: በሥጋ መሠረት
  rationale: የግሪኩን አገላለጽና የσάρξን ሥነ መለኮታዊ ውጥረት ሳይፈታ ይጠብቃል፤ በዚህ አውድ ያለው ፈሊጣዊ ትርጉም በማስታወሻ ተብራርቷል።
- source_word: κἀγὼ
  choice: እኔም
  rationale: የκαί + ἐγώን አጽንዖትና ጳውሎስ የሌሎቹን አነጋገር መከተሉን በአጭሩ ያሳያል።
theological_decisions:
- issue: በκατὰ σάρκα ውስጥ ያለውን σάρξ መተርጎም
  choice: በሥጋ መሠረት
  alternative: በሰው መለኪያ / በሰዋዊ መንገድ
  rationale: ዋናው ጽሑፍ የጳውሎስን «ሥጋ» የሚል ቃልና ያለውን እውነተኛ የትርጉም ስፋት ይጠብቃል፤ አውዱ ግን አካላዊ ሰውነትን ሳይሆን ሰዋዊ ወይም ዓለማዊ መመዘኛን እንደሚያመለክት በእግር ማስታወሻው ይገለጻል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «መመካት» የአውዱን ክርክራዊና ምጸታዊ ቃና ይጠብቃል፤ «በሥጋ መሠረት» ደግሞ ፈሊጣዊ ትርጉሙን ሙሉ በሙሉ በዋናው ጽሑፍ አይወስንም።
