base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/021.yaml
  text: I say this to our shame[a], as though we had been weak[d][c][b]. Yet in whatever anyone dares to boast—I am speaking foolishly—I also dare.
translation:
  language: am
  text: ይህን ለውርደታችን እላለሁ፤ እኛ ደካሞች እንደ ነበርን ያህል። ነገር ግን ማንም በማንኛውም ነገር የሚደፍርበት ከሆነ፣ እንደ ሞኝ እናገራለሁ፤ እኔም እደፍራለሁ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ ἀτιμίαν
  choice: እኛን ለማዋረድ
  rationale: የግሪኩን ፈሊጣዊና አውዳዊ ትርጉም በተፈጥሯዊ አማርኛ ያቀርባል፤ ጳውሎስ በራሱና በባልደረቦቹ ላይ እንደሚደርስ ውርደት አድርጎ በምጸት ይናገራል።
- source_word: ὡς ὅτι
  choice: እንደ ... አድርጌ
  rationale: የመስሎ መታየትንና የምጸታዊ መቀበልን ስሜት ይጠብቃል።
- source_word: ἠσθενήκαμεν
  choice: ደካሞች እንደ ነበርን
  rationale: እዚህ ቃሉ አካላዊ ሕመምን ሳይሆን በሥልጣን፣ በድፍረት ወይም በክብር ደካማ መስሎ መታየትን ያመለክታል።
- source_word: ἐν ᾧ δ’ ἄν τις τολμᾷ
  choice: ማንም በማንኛውም ነገር ለመድፈር ቢደፍር
  rationale: የግሪኩን ግልጽ ያልሆነ የድፍረቱን ጉዳይ አልሞላም፤ በአውዱ ግን ጉራ መንዛት የተጠቆመ መሆኑን የግርጌ ማስታወሻው ያብራራል።
- source_word: ἐν ἀφροσύνῃ λέγω
  choice: እንደ ሞኝ እየተናገርኩ ነው
  rationale: የጳውሎስን ራሱን የሚያውቅ የንግግር ማስጠንቀቂያ በግልጽና ዘመናዊ አማርኛ ያቀርባል።
- source_word: τολμῶ κἀγώ
  choice: እኔም እደፍራለሁ
  rationale: ከቀደመው τολμᾷ ጋር ያለውን የግስ ድግግሞሽ ይጠብቃል፤ የድፍረቱ ነገር ከአውዱ እንዲገባ ይተዋል።
theological_decisions:
- issue: ጳውሎስ ስለ ድካሙ የሚናገረው ምጸት
  choice: ንግግሩን እውነተኛ የሐዋርያነት ድክመት እንደሚያምን ሳይሆን እንደ ምጸታዊ መቀበል ማቅረብ
  alternative: «ደካሞች ነበርን» ብሎ እንደ ቀጥተኛ እምነት ማቅረብ
  rationale: የምዕራፉ አውድ የጳውሎስ «የሞኝነት» ጉራንና ከተቃዋሚዎቹ ጋር ያለውን ምጸታዊ ንጽጽር ያሳያል፤ ትርጉሙ ይህን የንግግር አቋም ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ አጭር ሐረጎች፣ የምጸት ቃናና τολμᾷ/τολμῶ የሚለው ድግግሞሽ ተጠብቀዋል።
