  text: For I consider that I am not in the least inferior to those super-apostles[a].
translation:
  language: am
  text: ከእነዚያ እጅግ ታላላቅ ሐዋርያት[a] በምንም እንዳላንስ እቈጥራለሁና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እጅግ የተከበሩ ሐዋርያት።” የግሪኩ አገላለጽ በምፀት “ከሁሉ የሚበልጡ ሐዋርያት” ተብሎ ወይም በቀጥታ እጅግ የተከበሩ ሐዋርያትን እንደሚያመለክት ሊነበብ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: λογίζομαι
  choice: አስባለሁ
  rationale: ግሱ ነገሩን መመዘንንና ወደ አንድ ድምዳሜ መድረስን ያመለክታል፤ “አስባለሁ” በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን የጳውሎስን ግምገማ ያስተላልፋል።
- source_word: γὰρ
  choice: -ና
  rationale: γάρ ከቀደመው ሐሳብ ጋር የሚያገናኝ ማብራሪያዊ አገናኝ ነው፤ በዓረፍተ ነገሩ መጨረሻ ያለው “አስባለሁና” ይህን ፍሰት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: μηδὲν
  choice: በምንም
  rationale: ከὑστερηκέναι ጋር ሆኖ “በምንም አለመጉደል” የሚለውን አጽንዖት ይሰጣል፤ “በምንም እንዳልተናነስሁ” ይህን በግልጽ ያስተላልፋል።
- source_word: ὑστερηκέναι
  choice: እንዳልተናነስሁ
  rationale: በንጽጽሩ ውስጥ ከሌሎች ያነሰ ወይም የበታች መሆንን ያመለክታል። ፍጹም የግስ ቅርጹን በተፈጥሯዊ አማርኛ ለማስተላለፍ “እንዳልተናነስሁ” ተመርጧል።
- source_word: τῶν ὑπερλίαν ἀποστόλων
  choice: ከእነዚያ “እጅግ ታላላቅ ሐዋርያት”
  rationale: ὑπερλίαν ከመጠን በላይ ወይም እጅግ የሚል ኃይለኛ ገለጻ ነው። የጥቅስ ምልክቶቹ በዐውዱ ሊኖር የሚችለውን ምፀት ያመለክታሉ፤ ሆኖም ቃላቱ በቀጥታ “እጅግ የተከበሩ ሐዋርያት” ተብለው ሊነበቡ መቻላቸው በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: τῶν ὑπερλίαν ἀποστόλων በምፀት የጳውሎስን ተቃዋሚዎች ያመለክት ወይስ በቀጥታ እጅግ የተከበሩ ሐዋርያትን ያመለክት
  choice: በዋናው ጽሑፍ “እጅግ ታላላቅ ሐዋርያት” በጥቅስ ምልክት ቀርቧል፤ ይህም ሊኖር የሚችለውን ምፀት ያሳያል።
  alternative: “እጅግ የተከበሩ ሐዋርያት” ብሎ እንደ ቀጥተኛ አዎንታዊ መግለጫ ማንበብ።
  rationale: የ2 ቆሮንቶስ 11 አቅራቢያ ዐውድ ጳውሎስ ከሚመኩት ተቀናቃኝ አገልጋዮች ጋር እየተከራከረ መሆኑን ስለሚያሳይ ምፀታዊው ንባብ የበለጠ ይመስላል። ሆኖም የግሪኩ ሐረግ የቀጥታ ንባብንም ስለሚፈቅድ አማራጩ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። “ሐዋርያት” የተለመደውን መጽሐፍ ቅዱሳዊ ቃል ይጠብቃል፤ የጥቅስ ምልክቶቹም ምፀትን ያመለክታሉ እንጂ አሻሚነቱን ፈጽመው አይዘጉም።
