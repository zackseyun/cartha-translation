  rationale: τῶν πλειόνων የቡድኑን ትልቁን ክፍል ማለትም አብዛኞቹን ያመለክታል። የድርጊቱን ፈጻሚዎች በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
