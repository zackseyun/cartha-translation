lexical_decisions:
- source_word: ἱκανὸν
  choice: በቂ ነው
  rationale: በዐረፍተ ነገሩ ውስጥ የመስተካከያ ፍርድ ሆኖ የቀረበውን፣ የተወሰደው እርምጃ የሚያስፈልገውን መጠን እንደደረሰ የሚገልጠውን ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τῷ τοιούτῳ
