  rationale: በዐውዱ የታወቀውን አንድ ወንድ በደለኛ ያመለክታል፤ ቃል በቃል የሚቀርበው ‘እንዲህ ላለው’ በዘመናዊ አማርኛ እንግዳ ስለሚመስል ‘ለዚህ ሰው’ ተመርጧል።
- source_word: ἐπιτιμία
