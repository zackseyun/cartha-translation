base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/005.yaml
  text: But if anyone has caused grief[a], he has grieved not me, but in part all of you—to some extent[b], so that I may not overstate it.
translation:
  language: am
  text: ነገር ግን ማንም ሐዘን ካደረሰ፣ እኔን አላሳዘነም፤ ይልቁንም፣ ሁላችሁን እንዳላከብድ፣ በተወሰነ መጠን[a] ሁላችሁን አሳዝኗል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በተወሰነ መጠን” የሚለው “በከፊል” ተብሎም ሊተረጎም ይችላል። የአረፍተ ነገሩ መጨረሻ “ሁላችሁን እንዳላከብድ” ወይም “ነገሩን በሁላችሁ ላይ ከልክ በላይ እንዳላጎላ” ተብሎ ሊገለጽ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: λελύπηκεν
  choice: ሐዘን ካደረሰ / አሳዝኗል
  rationale: የግሱን የትርጉም ትስስር በተፈጥሯዊ አማርኛ ይጠብቃል፤ የአሁን ውጤት ያለውን ያለፈ ድርጊትም በአውዱ ያሳያል።
- source_word: οὐκ ἐμὲ
  choice: እኔን አላሳዘነም
  rationale: ጳውሎስ በራሱና በማኅበሩ መካከል ያደረገውን ቀጥተኛ ንጽጽር ያለ ተጨማሪ አጽንዖት ይጠብቃል።
- source_word: ἀπὸ μέρους
  choice: በተወሰነ መጠን
  rationale: ሐዘኑ ሁሉን እንደነካ ሆኖም የተገደበ መሆኑን በግልጽና ተፈጥሯዊ አማርኛ ያሳያል፤ ሌላው የ‘በከፊል’ ንባብ በማስታወሻ ተጠብቋል።
- source_word: ἐπιβαρῶ
  choice: ነገሩን በሁላችሁ ላይ እንዳላከብድ
  rationale: የሸክምን ምሳሌያዊ ምስል ይጠብቃል፤ በዚህ አውድ ጳውሎስ ነገሩን ከልክ በላይ እንዳያጎላ የሚያደርገውን ማለዘብም ያስተላልፋል።
- source_word: πάντας ὑμᾶς
  choice: ሁላችሁን / በሁላችሁ ላይ
  rationale: πάντας የሚያመለክተውን የማኅበሩን ሙሉ አካታችነት በግልጽ ይጠብቃል።
theological_decisions:
- issue: ἀπὸ μέρους ከπάντας ὑμᾶς ጋር ያለው ግንኙነት
  choice: ሐዘኑ ሁሉንም በተወሰነ መጠን እንደነካ በዋናው ጽሑፍ ተተርጉሟል።
  alternative: ‘በከፊል ሁላችሁን’ ወይም ‘ከእናንተ ከፊሎቹን’ ተብሎ ሊነበብ ይችላል።
  rationale: የግሪኩ አገላለጽ የመጠን ወይም የማኅበሩን ከፊል ሊያመለክት ስለሚችል አሻሚነቱ በማስታወሻ ተጠብቋል።
- issue: ἵνα μὴ ἐπιβαρῶ የሚያመለክተው ሸክም
  choice: ጳውሎስ ነገሩን በማኅበሩ ላይ እንዳያከብድ የሚናገረው ማለዘቢያ ሆኖ ቀርቧል።
  alternative: ‘ሁላችሁን እንዳልከብዳችሁ’ ተብሎ በቀጥታ ሰዎቹን እንደ ግሱ ተሳቢ ማቅረብ ይቻላል።
  rationale: የግሪኩ አቀማመጥ አሻሚ ነው፤ ዋናው ትርጉም የከባድነትን ምሳሌ ከአውዳዊው የንግግር ማለዘብ ጋር ያጣምራል።
