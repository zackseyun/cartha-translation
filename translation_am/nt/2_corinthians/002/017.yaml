- issue: ἐκ θεοῦ የሚያመለክተው የአገልግሎት ምንጭ
  choice: ከእግዚአብሔርም እንደሆንን
  alternative: ከእግዚአብሔር ተልከን
  rationale: ጽሑፉ ምንጭን ይገልጣል፤ መላክ በአውዱ ሊገባ ቢችልም በዚህ ሐረግ በግልጽ አልተጻፈም።
