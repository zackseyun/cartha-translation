translation:
  language: am
  text: እኛ ግን እንደ ብዙዎቹ[a] የእግዚአብሔርን ቃል ለትርፍ ሸቀጥ አድርገው የሚነግዱ አይደለንም፤ ከቅንነት እንደሆንን[c]፣ ከእግዚአብሔርም እንደሆንን፣ በእግዚአብሔር ፊት[d] በመሲሕ ተባብረን[e] እንናገራለን።
  philosophy: optimal-equivalence
  footnotes:
