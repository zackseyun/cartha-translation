- source_word: καταποθῇ
  choice: እንዳይዋጥ
  rationale: የግሪኩን ‘መዋጥ’ የሚለውን ጠንካራ ዘይቤ በአማርኛም ተፈጥሯዊ ስለሆነ በቀጥታ ይጠብቃል።
