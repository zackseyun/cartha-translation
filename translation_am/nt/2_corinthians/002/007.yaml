    text: ወይም፣ “በጸጋ ይቅር ልትሉለት”፤ ግሱ ጸጋን ወይም በጎ ፈቃድን ከማሳየት ጋር የተዛመደ ነው።
    reason: lexical_alternative
  - marker: b
