  text: ስለዚህ፣ በተቃራኒው ይልቁንም፣ እንዲህ ያለ ሰው ከመጠን በላይ በሆነ ሐዘን እንዳይዋጥ[b]፣ ይቅር ልትሉለት[a]ና ልታጽናኑት ይገባል።
  philosophy: optimal-equivalence
  footnotes:
