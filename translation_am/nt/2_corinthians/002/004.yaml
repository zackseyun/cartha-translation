  text: ከብዙ መከራና ከከባድ የልብ ጭንቀት የተነሣ፣ ብዙ እንባ እያፈሰስሁ[a] ጻፍሁላችሁ፤ እንድታዝኑ ሳይሆን፣ ለእናንተ ያለኝን እጅግ የበዛ ፍቅር እንድታውቁ ነው[b]።
  philosophy: optimal-equivalence
