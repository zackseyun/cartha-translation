    reason: lexical_alternative
  revision_rationale: The revision corrects the temporal force of ἐλθών, represents πεποιθώς with an Amharic participial construction, and repairs the literal-alternative footnote. It otherwise preserves the draft’s accurate, natural rendering and its intended shared-joy sense.
