  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ⸀ἔγραψα τοῦτο αὐτὸ ἵνα μὴ ἐλθὼν λύπην ⸀σχῶ ἀφ’ ὧν ἔδει με χαίρειν, πεποιθὼς ἐπὶ πάντας ὑμᾶς ὅτι ἡ ἐμὴ χαρὰ πάντων ὑμῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/003.yaml
  text: And I wrote this very thing so that, when I came, I might not have grief from those who ought to make me rejoice, because I was confident about all of you that my joy is the joy of you all.
translation:
  language: am
  text: ይህንኑም የጻፍኩት፣ በምመጣበት ጊዜ ደስ ሊያሰኙኝ ከሚገባቸው ሰዎች ሐዘን እንዳይደርስብኝ ነው፤[a] ስለ ሁላችሁ በመተማመኔም፣ ደስታዬ የሁላችሁም ደስታ እንደሆነ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “እኔ ደስ ልሰኝባቸው ከሚገባኝ ሰዎች።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: የጻፍኩት
  rationale: የግሪኩን አኦሪስት በአማርኛ ተፈጥሯዊ በሆነ የተፈጸመ ድርጊት አገላለጽ ያቀርባል፤ ከዓላማ ሐረጉ ጋርም ይጣጣማል።
- source_word: τοῦτο αὐτὸ
  choice: ይህንኑም
  rationale: αὐτό የሚሰጠውን አጽንዖት በአጭርና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἵνα μὴ ... λύπην σχῶ
  choice: ሐዘን እንዳይደርስብኝ
  rationale: የዓላማውን እና የአሉታውን ኃይል ይጠብቃል፤ λύπη በዚህ አውድ የስሜት ሐዘንን ያመለክታል።
- source_word: ἀφ’ ὧν ἔδει με χαίρειν
  choice: ደስ ሊያሰኙኝ ከሚገባቸው ሰዎች
  rationale: እነዚህ ሰዎች የጳውሎስ የደስታ ምንጭ ሊሆኑ እንደሚገባ በተፈጥሯዊ አማርኛ ያሳያል፤ ቀጥተኛው አገላለጽ በማስታወሻ ተጠብቋል።
- source_word: πεποιθὼς ἐπὶ πάντας ὑμᾶς
  choice: ስለ ሁላችሁ እርግጠኛ ነኝና
  rationale: ፍጹም አካፋዩ የሚያመለክተውን የጸና እምነት ያሳያል፤ -ና ከቀደመው ንግግር ጋር ያለውን ምክንያታዊ ትስስር በተፈጥሯዊ መንገድ ያቀርባል።
- source_word: ἡ ἐμὴ χαρὰ πάντων ὑμῶν ἐστιν
  choice: ደስታዬ የሁላችሁም ደስታ እንደሆነ
  rationale: የግሪኩን ቅርብ አወቃቀር ጠብቆ በጳውሎስና በቆሮንቶስ ሰዎች መካከል ያለውን የጋራ ደስታ ይገልጣል።
