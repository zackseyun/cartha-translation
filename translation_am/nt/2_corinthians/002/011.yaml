review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly identifies Satan and broadly conveys the purpose clause and the reference to his plans. However, «ሰይጣን እንዳይጠቀምብን ነው» is syntactically and semantically weak: the final «ነው» is not warranted by the Greek, and «መጠቀምብን» can mean merely ‘use us’ rather than gain an advantage at our expense. The Greek negated verb is better represented by the natural idiom ‘gain an advantage over us.’'
  naturalness: «አናውቅም አይደለምና» is an unnatural and needlessly convoluted double-negative in modern standard Amharic. «የማናውቅ አይደለንምና» preserves the Greek negated-ignorance construction naturally. The possessive «የእርሱን» also removes a minor ambiguity in the standalone verse.
  terminology: «ሰይጣን» is the standard Amharic form. «ዕቅዶች» appropriately conveys νοήματα in context, while the footnote may retain ‘አሳቦች,’ ‘ዓላማዎች,’ and ‘ተንኮሎች’ as alternatives.
  issues:
  - severity: medium
    issue: The rendering of πλεονεκτηθῶμεν is insufficiently precise and the clause ends with an extraneous «ነው».
    rationale: The Greek passive denotes being exploited or having an advantage gained over one. «በእኛ ላይ ብልጫ እንዳይወስድ» expresses this idiomatically; the Greek has no copular equivalent to «ነው».
  - severity: medium
    issue: The double-negative expression is unnatural in modern Amharic.
    rationale: «አናውቅም አይደለም» is awkward. «የማናውቅ አይደለንም» clearly and naturally means ‘we are not ignorant/unaware.’
  - severity: low
    issue: The standalone possessive reference is slightly unclear.
    rationale: Adding «የእርሱን» makes explicit that the plans belong to Satan, as αὐτοῦ does in Greek.
  revised_text: ሰይጣን በእኛ ላይ ብልጫ እንዳይወስድ፤ የእርሱን ዕቅዶች የማናውቅ አይደለንምና።
