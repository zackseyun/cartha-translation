- source_word: ἵνα
  choice: እንዳይ… ነው
  rationale: የዓላማ ወይም የታሰበ ውጤት ግንኙነቱን ከቀደመው ንግግር ጋር በተፈጥሯዊ አማርኛ ያስተሳስራል።
- source_word: πλεονεκτηθῶμεν
  choice: እንዳይጠቀምብን
  rationale: በሌላው ላይ ብልጫ በመውሰድ መጠቀምን ወይም መበዝበዝን የሚያመለክተውን ተገብሮአዊ ትርጉም በግልጽና በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: Σατανᾶ
  choice: ሰይጣን
  rationale: በአማርኛ የተለመደውን የግል ስም ቅርጽ ይጠቀማል።
- source_word: γὰρ
  choice: ነውና
  rationale: ሁለተኛው ሐረግ ለመጀመሪያው የሚሰጠውን ምክንያታዊ ማብራሪያ ያሳያል።
- source_word: νοήματα
  choice: ዕቅዶቹን
  rationale: በዚህ አውድ ቃሉ ተራ ሐሳቦችን ብቻ ሳይሆን የታሰቡ ዓላማዎችንና ዘዴዎችን ያመለክታል፤ ‘ዕቅዶቹ’ ይህን ስፋት ይጠብቃል።
- source_word: ἀγνοοῦμεν
  choice: አናውቅም አይደለም
  rationale: የግሪኩን አሉታዊ አገላለጽ—‘አንዘነጋም/አንስትም’—ሳይቀይር በዘመናዊ አማርኛ የሚገባ ድርብ አሉታዊ አቀራረብ ይሰጣል።
