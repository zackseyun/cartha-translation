  text: ስለዚህ ለእርሱ ያላችሁን ፍቅር እንድታረጋግጡ እለምናችኋለሁ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὸ
  choice: ስለዚህ
  rationale: የቀደመውን ሐሳብ ከዚህ ማሳሰቢያ ጋር የሚያገናኘውን ምክንያታዊ ድምዳሜ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: παρακαλῶ ὑμᾶς
  choice: እለምናችኋለሁ
  rationale: በዚህ ዐውድ ያለውን ጠንካራና ርኅሩኅ ልመና ያስተላልፋል፤ የብዙ ተቀባዮች ቅርጽንም ይጠብቃል።
- source_word: κυρῶσαι
  choice: እንድታረጋግጡ
  rationale: ግሱ ፍቅራቸውን በማኅበሩ ፊት ተግባራዊና የጸና መሆኑን እንዲያሳዩ የሚጠይቅ ስለሆነ፣ ‘ማረጋገጥ’ የሕጋዊ ብቻ ትርጉም ሳይጫን ዋናውን ኃይል ይይዛል።
- source_word: εἰς αὐτὸν ἀγάπην
  choice: ለእርሱ ያላችሁን ፍቅር
  rationale: የፍቅሩን ተቀባይ በግልጽ ያሳያል፣ በአማርኛም ተፈጥሯዊ አገባብ ነው።
theological_decisions:
- issue: ፍቅሩን ‘ማረጋገጥ’ የሚለው ተግባር
  choice: እንድታረጋግጡ
  alternative: እንደገና እንድታሳዩ
  rationale: የግሪኩ κυρόω ዋና ሐሳብ አንድን ነገር ማጽደቅ፣ ማረጋገጥ ወይም በተግባር የጸና ማድረግ ነው። ‘እንደገና’ የሚለው በግሪኩ በግልጽ ስለሌለ፣ ያልተገለጸ ጊዜያዊ ንጥረ ሐሳብ አልተጨመረም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለመደበኛ አንባቢ ግልጽ የሆነ አማርኛ፤ የግሪኩን አጭር የልመና ቅርጽና የብዙ ተቀባዮችን አመልካች ጠብቋል።
