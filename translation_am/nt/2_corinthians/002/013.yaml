id: 2CO.2.13
reference: 2 Corinthians 2:13
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὐκ ἔσχηκα ἄνεσιν τῷ πνεύματί μου τῷ μὴ εὑρεῖν με Τίτον τὸν ἀδελφόν μου, ἀλλὰ ἀποταξάμενος αὐτοῖς ἐξῆλθον εἰς Μακεδονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/013.yaml
  text: I had no rest in my spirit because I did not find Titus my brother[a], but after taking leave of them[c][b], I went on to Macedonia.
translation:
  language: am
  text: 'ወንድሜን ቲቶን[b] ስላላገኘሁት፣ መንፈሴ ዕረፍት አላገኘም[a]፤ ነገር ግን እነርሱን ተሰናብቼ[c] ወደ መቄዶንያ ሄድሁ።


    [a] ወይም፣ “ለመንፈሴ ዕረፍት አላገኘሁም።”

    [b] “ወንድሜ” ማለት ቲቶ የጳውሎስ የእምነት ወንድምና አብሮት የሚሠራ ሰው መሆኑን ያመለክታል።

    [c] ወይም፣ “ደህና ሁኑ ብያቸው።”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለመንፈሴ ዕረፍት አላገኘሁም።”
    reason: lexical_alternative
  - marker: b
    text: “ወንድሜ” ማለት ቲቶ የጳውሎስ የእምነት ወንድምና አብሮት የሚሠራ ሰው መሆኑን ያመለክታል።
    reason: cultural_note
  - marker: c
    text: ወይም፣ “ደህና ሁኑ ብያቸው።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσχηκα
  choice: አላገኘም
  rationale: የግሪኩ ፍጹም ጊዜ በዚህ ትረካዊ አውድ ጳውሎስ ከመሄዱ በፊት የነበረበትን ሁኔታ ይገልጣል፤ በአማርኛም ቀላል ያለፈ ጊዜ ተፈጥሯዊ ነው።
- source_word: ἄνεσιν
  choice: ዕረፍት
  rationale: የውስጥ መረጋጋት ማጣቱን በግልጽና ተፈጥሯዊ አማርኛ ያሳያል፤ “እፎይታ”ም ሊባል ቢችልም የግሪኩን ሰፊ ትርጉም የበለጠ ይጠብቃል።
- source_word: τῷ πνεύματί μου
  choice: መንፈሴ
  rationale: የጳውሎስን ውስጣዊ ማንነት ይገልጣል፤ ዳቲቩ የሚፈቅደው “ለመንፈሴ” የሚለው አማራጭ በማስታወሻ ቀርቧል።
- source_word: τῷ μὴ εὑρεῖν με Τίτον
  choice: ቲቶን ስላላገኘሁት
  rationale: አርቲክላዊው ኢንፊኒቲቭ ዕረፍት ያጣበትን ምክንያት ያሳያል፤ “ስላላገኘሁት” ይህን ግንኙነት በዘመናዊ አማርኛ በግልጽ ያቀርባል።
- source_word: ἀδελφόν μου
  choice: ወንድሜን
  rationale: የምንጩን የቤተሰብ ዘይቤና የግንኙነት ሙቀት ይጠብቃል፤ በአውዱ የእምነት ወንድምና የሥራ ባልደረባ መሆኑ በማስታወሻ ተብራርቷል።
- source_word: ἀποταξάμενος αὐτοῖς
  choice: እነርሱን ተሰናብቼ
  rationale: የአኦሪስት ተሳቢውን ቀዳሚ ድርጊት በተፈጥሯዊና ክብር ባለው አማርኛ ይገልጣል።
- source_word: ἐξῆλθον εἰς Μακεδονίαν
  choice: ወደ መቄዶንያ ሄድሁ
  rationale: የጉዞውን መዳረሻና ቀጣይ እንቅስቃሴ በተፈጥሯዊ አማርኛ ያቀርባል፤ “ወጣሁ” ቃል በቃል ቢቀርብም በዚህ አውድ አነጋገሩን ያከብዳል።
theological_decisions:
- issue: τῷ πνεύματί μου የሚለው “መንፈስ” ማንን እንደሚያመለክት
  choice: የጳውሎስን ውስጣዊ ማንነት የሚያመለክት “መንፈሴ”
  alternative: መንፈስ ቅዱስን እንደሚያመለክት መተርጎም
  rationale: የባለቤትነት ተውላጠ ስም “μου” እና የውስጥ ዕረፍት ማጣት አውድ የጳውሎስን የራሱን መንፈስ ያመለክታሉ፤ ጽሑፉ መንፈስ ቅዱስን በቀጥታ አይጠቅስም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ዓረፍተ ነገር አመክንዮ ተጠብቆ፣ ለአማርኛ ተፈጥሯዊነት የምክንያቱ ሐረግ ቀድሞ ቀርቧል።
