language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ καὶ ἔγραψα ἵνα γνῶ τὴν δοκιμὴν ὑμῶν, εἰ εἰς πάντα ὑπήκοοί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/009.yaml
  text: 'For this is why I also wrote: so that I might know the proof of you[a], whether you are obedient in everything.'
translation:
  language: am
  text: ስለዚህ ደግሞ የጻፍኩት፣ የእናንተን ማረጋገጫ[a] ለማወቅ፣ በሁሉም ነገር ታዛዦች እንደሆናችሁ ለማወቅ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የእናንተን ፈተና»፤ ወይም፣ «የተረጋገጠ ባሕርያችሁን»።
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τοῦτο γὰρ καὶ ἔγραψα
  choice: ይህንም የጻፍኩት ... ነው
  rationale: የግሪኩን ምክንያታዊና ዓላማዊ አወቃቀር በተፈጥሯዊ የአማርኛ አገላለጽ ያስተላልፋል፤ καὶ የሚያሳየውም ጭማሪ በ«ም» ተጠብቋል።
- source_word: ἵνα γνῶ
  choice: ለማወቅና ... ለማየት
  rationale: የዓላማውን ንዑስ ሐረግና ወደ ማወቅ መድረስን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τὴν δοκιμὴν ὑμῶν
  choice: ፈተናውን እንዴት እንደምታልፉ
  rationale: δοκιμή ፈተናውን፣ በፈተና የተረጋገጠውን ባሕርይ፣ ወይም ማስረጃውን ሊያመለክት ይችላል። ዋናው ትርጉም የፈተናን ሐሳብ በተፈጥሯዊ አማርኛ ያቀርባል፣ አማራጮቹንም በማስታወሻ ይጠብቃል።
- source_word: εἰ εἰς πάντα ὑπήκοοί ἐστε
  choice: በሁሉም ነገር ታዛዦች መሆናችሁን
  rationale: ከγνῶ ጋር የተያያዘውን ቀጥተኛ ያልሆነ ጥያቄና የεἰς πάνταን ሁሉን አቀፍ ኃይል ይጠብቃል።
theological_decisions:
- issue: δοκιμή የሚያመለክተው ፈተናውን ወይስ የፈተናውን ውጤት
  choice: በዋናው ጽሑፍ የፈተናው ሐሳብ ቀርቦ፣ የተረጋገጠ ባሕርይ/ማስረጃ የሚለው በማስታወሻ ተጠብቋል።
  alternative: «የተረጋገጠ ባሕርያችሁን» ወይም «ማስረጃችሁን»
  rationale: ቃሉ ሂደቱንም ሆነ በፈተና የታየውን ውጤት ሊያመለክት ስለሚችል፣ የግሪኩ እውነተኛ አሻሚነት እንዳይጠፋ ተደርጓል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። ብዙ ቁጥር «ታዛዦች» የግሪኩን ብዙ ቁጥር በግልጽ ያሳያል።
