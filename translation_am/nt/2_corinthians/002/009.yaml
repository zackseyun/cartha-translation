    text: ወይም፣ «የእናንተን ፈተና»፤ ወይም፣ «የተረጋገጠ ባሕርያችሁን»።
    reason: lexical_alternative
  revision_rationale: The revision restores the source’s single purpose of coming to know the Corinthians’ δοκιμή and preserves εἰ as an indirect question. «ስለዚህ ደግሞ» reflects εἰς τοῦτο γὰρ καί, and the footnote preserves lexical ambiguity in δοκιμή without adding the notion of passing a test.
