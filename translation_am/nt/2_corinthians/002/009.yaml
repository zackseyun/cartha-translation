review_pass:
  verdict: revise
  source_fidelity: 'The draft substantially alters the syntax and sense of τὴν δοκιμὴν ὑμῶν, εἰ εἰς πάντα ὑπήκοοί ἐστε. It introduces an unsupported idea of how the readers “pass the test” and turns the verse into two coordinated purposes. The Greek has one purpose: Paul wrote to ascertain their δοκιμή, specifically whether they are obedient in everything.'
  naturalness: The revised wording is modern, clear, and suitably dignified Amharic. It retains the indirect-question sense with «እንደሆናችሁ» and avoids the unnatural expansion about passing an examination.
  terminology: «ማረጋገጫችሁ» renders δοκιμή as proof/evidence while the note preserves the viable senses “test” and “proven character.” This is less interpretively loaded than depicting the readers as passing a test.
  issues:
  - severity: high
    issue: Unsupported expansion of δοκιμή
    rationale: «ፈተናውን እንዴት እንደምታልፉ» means “how you pass the test,” but neither a test to be passed nor the manner of passing it occurs in the Greek.
  - severity: high
    issue: The indirect question is not retained as such
    rationale: εἰ after γνῶ asks whether they are obedient in all things. The draft uses «መሆናችሁን» as a declarative content clause and thereby weakens the question/uncertainty.
  - severity: medium
    issue: One Greek purpose clause is split into two purposes
    rationale: The added «ለማወቅና ... ለማየት» gives Paul two distinct aims, whereas ἵνα γνῶ governs both δοκιμή and the εἰ clause.
  revised_text: ስለዚህ ደግሞ የጻፍኩት፣ የእናንተን ማረጋገጫ[a] ለማወቅ፣ በሁሉም ነገር ታዛዦች እንደሆናችሁ ለማወቅ ነው።
  revised_footnotes:
