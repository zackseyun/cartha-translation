source:
  edition: SBLGNT
  text: ὅτι Χριστοῦ εὐωδία ἐσμὲν τῷ θεῷ ἐν τοῖς σῳζομένοις καὶ ἐν τοῖς ἀπολλυμένοις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/015.yaml
  text: For we are the aroma of Messiah to God among those who are being saved and among those who are perishing[b][a],
translation:
  language: am
  text: ምክንያቱም በሚድኑትም ሆነ በሚጠፉት መካከል፣ እኛ ለእግዚአብሔር የመሲሑ[a] መዓዛ ነን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የክርስቶስ መዓዛ»።
    reason: alternative_rendering
lexical_decisions:
- source_word: ὅτι
  choice: ምክንያቱም
  rationale: ቀደም ሲል የተነገረውን ሐሳብ የሚያብራራውን ምክንያታዊ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Χριστοῦ
  choice: የመሲሑ
  rationale: Χριστός እዚህ የቅቡዕነት ማዕረግን ስለሚያመለክት «መሲሕ» ተብሎ ተተርጉሟል፤ የባለቤትነት ቅርጹም የመዓዛውን ከመሲሑ ጋር ያለ ግንኙነት ይጠብቃል።
- source_word: εὐωδία
  choice: መዓዛ
  rationale: የሽታውን ዘይቤ በክብር ያለውና በዘመናዊ አማርኛ የሚገባ ቃል ያስተላልፋል፤ በግሪኩ በግልጽ ያልተጨመረውን «ጣፋጭ» የሚል ቅጽል አይጨምርም።
- source_word: τῷ θεῷ
  choice: ለእግዚአብሔር
  rationale: የግሪኩን ዳቲቭ በቀጥታ በማስተላለፍ መዓዛው ከእግዚአብሔር አንጻር ያለውን አቅጣጫዊ ግንኙነት ያሳያል።
- source_word: ἐν τοῖς σῳζομένοις
  choice: በሚድኑት … መካከል
  rationale: የአሁን ጊዜ አሳታፊ ግስ የሚያሳየውን ቀጣይ ሂደት «በሚድኑት» ይጠብቃል፤ «መካከል» ደግሞ ἐν በዚህ አውድ ያለውን ማኅበራዊ ክልል በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐν τοῖς ἀπολλυμένοις
  choice: በሚጠፉት መካከል
  rationale: «በሚጠፉት» የአሁን ጊዜውን ቀጣይ ሂደት ይጠብቃል፣ የጥፋቱንም አይነት ከግሪኩ በላይ አይወስንም።
theological_decisions:
- issue: በσῳζομένοις እና ἀπολλυμένοις ያለው ቀጣይ ሂደት
  choice: «በሚድኑት» እና «በሚጠፉት»
  alternative: «በዳኑት» እና «በጠፉት»
  rationale: የግሪኩ የአሁን ጊዜ አሳታፊ ግሶች ድነትንና ጥፋትን እየተከናወኑ እንዳሉ ሂደቶች ያቀርባሉ፤ ትርጉሙ ይህን የሥነ መለኮት ውጥረት ወደ ተጠናቀቀ ሁኔታ አያሳጥረውም።
- issue: Χριστός እንደ ማዕረግ ወይም እንደ ስም መቅረቡ
  choice: «መሲሕ» እንደ ማዕረግ
  alternative: «ክርስቶስ» የሚለው የተለመደ ቅርጽ
  rationale: በዚህ የባለቤትነት አገባብ የማዕረጉ ትርጉም አሁንም ይሰማል፤ ሆኖም በአማርኛ የተለመደው ቅርጽ በማስታወሻ ቀርቧል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። «በ…ም ሆነ በ…» የሚለው ቅንብር ሁለቱን ቡድኖች በተፈጥሯዊ አማርኛ ያገናኛል፣ የግሪኩንም ተደጋጋሚ ἐν ትርጉም ይጠብቃል።
