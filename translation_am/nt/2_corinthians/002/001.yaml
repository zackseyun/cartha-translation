  naturalness: 'The proposed revision uses a standard, fluent Amharic sentence order: the content of the decision precedes «ወሰንሁ». It avoids an unnecessary periphrastic past form while retaining the personal-deliberative nuance of ἐμαυτῷ.'
  terminology: «በሐዘን» appropriately preserves the source’s ambiguity as to whether the sorrow concerns Paul, the Corinthians, or the visit’s sorrowful character. «በራሴ» is retained for the inward/personal force without imposing an interpretation.
