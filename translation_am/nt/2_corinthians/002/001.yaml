  yaml_path: translation/nt/2_corinthians/002/001.yaml
  text: 'For I decided this for myself: not to come to you again in sorrow[a].'
translation:
  language: am
  text: ምክንያቱም እንደገና በሐዘን[a] ወደ እናንተ ላለመምጣት በራሴ ይህን ወሰንሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ሐዘን ይዤ።»
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκρινα
  choice: ወስኜ ነበር
  rationale: እዚህ የκρίνω የአኦሪስት ቅርጽ ጳውሎስ አስቀድሞ ያደረገውን የተረጋጋ የግል ውሳኔ ያመለክታል፤ ይህ አተረጓጎም በአማርኛ ተፈጥሯዊ ነው።
- source_word: γὰρ
  choice: ምክንያቱም
  rationale: ከቀደመው ንግግር ጋር ያለውን ገላጭና ምክንያታዊ ትስስር በግልጽ ያሳያል።
- source_word: ἐμαυτῷ
  choice: በራሴ
  rationale: ውሳኔው ጳውሎስ በግሉና ሆን ብሎ የደረሰበት መሆኑን ይገልጣል።
- source_word: τοῦτο
  choice: ይህን
  rationale: ተውላጠ አመልካቹ ወደሚከተለው የውሳኔ ይዘት ያመለክታል፤ የግሪኩን አወቃቀርም ይጠብቃል።
- source_word: τὸ μὴ ... ἐλθεῖν
  choice: ላለመምጣት
  rationale: በአንቀጽ የተወሰነው የግስ መደብ የውሳኔውን ይዘት ይገልጣል፤ ይህ በዘመናዊ አማርኛ ቀጥተኛና ተፈጥሯዊ ነው።
- source_word: πάλιν
  choice: እንደገና
  rationale: የድግግሞሽን ሐሳብ በግልጽ ያስተላልፋል።
- source_word: ἐν λύπῃ
  choice: በሐዘን
  rationale: λύπη ሐዘንን፣ ልቅሶን ወይም ጭንቀትን ሊያመለክት ይችላል፤ «በሐዘን» የግሪኩን ሰፊ ትርጉምና የመስተዋድዱን አሻሚነት ይጠብቃል።
- source_word: πρὸς ὑμᾶς
  choice: ወደ እናንተ
  rationale: ከመምጣት ግስ ጋር πρός ወደ ሰዎች የሚደረግን እንቅስቃሴ ያመለክታል።
theological_decisions:
- issue: ἐν λύπῃ ሐዘኑ የማን እንደሆነ አይወስንም
  choice: በሐዘን
  alternative: ሐዘን እያመጣሁባችሁ / እናንተን ለማሳዘን
  rationale: የግሪኩ ሐረግ ጳውሎስ ራሱ በሐዘን መምጣቱን፣ ለእነርሱ ሐዘን ማምጣቱን ወይም ሁለቱንም ሊያካትት ይችላል፤ ትርጉሙ ይህን አሻሚነት አይፈታም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የአማርኛ አገላለጽ ተጠቅሟል። ከፊል ኮሎኑ ከ«ይህን» በኋላ የሚመጣውን የውሳኔ ይዘት ያብራራል።
