reference: 2 Corinthians 2:2
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἰ γὰρ ἐγὼ λυπῶ ὑμᾶς, καὶ ⸀τίς ὁ εὐφραίνων με εἰ μὴ ὁ λυπούμενος ἐξ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/002.yaml
  text: For if I grieve you[a], who is there to make me glad except the one who is grieved by me?
translation:
  language: am
  text: ምክንያቱም እኔ እናንተን ባሳዝናችሁ፣ በእኔ ምክንያት ከሚያዝነው[a] በቀር እኔን ደስ የሚያሰኘኝ ማን ነው?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እኔ ካሳዘንኩት»። ἐξ ἐμοῦ ምንጭን ወይም ምክንያትን ይገልጻል፤ ስለዚህ «በእኔ ወይም በእኔ ምክንያት የሚያዝነው» ማለት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπῶ
  choice: ባሳዝናችሁ
  rationale: ግሱ ለሌሎች ሐዘንን ወይም ሥቃይን ማስከተልን ያመለክታል፤ «ማሳዘን» ይህን አስደራጊ ኃይል በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: εὐφραίνων
  choice: ደስ የሚያሰኘኝ
  rationale: ጳውሎስን ደስ የሚያሰኘውን ሰው የሚጠቁም ተሳቢ ነው፤ ይህ አተረጓጎም ከ«ማሳዘን» ጋር ያለውን ንጽጽር ይጠብቃል።
- source_word: τίς ὁ εὐφραίνων με
  choice: እኔን ደስ የሚያሰኘኝ ማን ነው?
  rationale: የግሪኩን ስማዊ ተሳቢና የአጻጻፉን ርቱዕ ጥያቄ በተፈጥሯዊ አማርኛ ያንጸባርቃል።
- source_word: ὁ λυπούμενος
  choice: ከሚያዝነው
  rationale: የአሁን ጊዜውን ተደራጊ ተሳቢ «የሚያዝነው» ብሎ በመተርጎም የሰዋስውን መልክ ይጠብቃል።
- source_word: ἐξ ἐμοῦ
  choice: በእኔ
  rationale: መስተዋድዱ ምንጭን ወይም ምክንያትን ሊገልጽ ስለሚችል «በእኔ» ዋናውን ትርጉም በአጭሩ ያቀርባል፤ «በእኔ ምክንያት» የሚለው አማራጭ በማስታወሻው ተጠቅሷል።
- source_word: γὰρ
  choice: እኔ … ባሳዝናችሁ
  rationale: በዐውደ ንባቡ ያለው ምክንያታዊ ትስስር በአማርኛው የ«ቢ-» ሁኔታዊ አወቃቀርና በአረፍተ ነገሩ ቀጣይነት ተፈጥሯዊ ሆኖ ተገልጧል፤ የተለየ «እንግዲህ» ወይም «ምክንያቱም» መጨመር አስፈላጊ አልሆነም።
theological_decisions:
- issue: ὁ λυπούμενος እና ἐξ ἐμοῦ የሚገልጹት ሐዘን
  choice: በእኔ ከሚያዝነው
  alternative: እኔ ካሳዘንኩት
  rationale: ዋናው ጽሑፍ የግሪኩን ተደራጊ ቅርጽና የምንጭ/ምክንያት አሻሚነት ይጠብቃል፤ በጳውሎስ ድርጊት ላይ ብቻ የሚያተኩረውን አማራጭ አያስገድድም።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ ነው። «ማሳዘን» እና «ደስ ማሰኘት» የሚሉት ተቃራኒ አገላለጾች የግሪኩን የሐዘንና የደስታ ንጽጽር ይጠብቃሉ።
