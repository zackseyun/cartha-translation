id: 2CO.2.10
reference: 2 Corinthians 2:10
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ᾧ δέ τι χαρίζεσθε, κἀγώ· καὶ γὰρ ἐγὼ ⸂ὃ κεχάρισμαι, εἴ τι⸃ κεχάρισμαι, δι’ ὑμᾶς ἐν προσώπῳ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/010.yaml
  text: To anyone whom you forgive anything[a], I do too. For what I have forgiven—if I have forgiven anything—I have forgiven for your sake in the presence of Messiah,
translation:
  language: am
  text: ለማንም ሰው ማንኛውንም ነገር ይቅር ብትሉ፣ እኔም ይቅር እላለሁ። እኔም ይቅር ያልኩት፣ ይቅር ያልኩት ነገር ካለ፣ ስለ እናንተ በመሲሑ ፊት[a] ይቅር ያልኩት ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «መሲሑን ወክዬ»።
    reason: lexical_alternative
lexical_decisions:
- source_word: χαρίζεσθε / κεχάρισμαι
  choice: ይቅር ብትሉ / ይቅር ያልኩት / ይቅር ብያለሁ
  rationale: χαρίζομαι በሰፊው በጸጋ መስጠትን ሊያመለክት ቢችልም፣ በዚህ የተግሣጽና የእርቅ ዐውድ የበደል ዕዳን መተው ማለት ስለሆነ «ይቅር ማለት» ተመርጧል።
- source_word: ᾧ ... τι
  choice: ለማንም በማንኛውም ነገር
  rationale: የዘመድ ተውላጠ ስምና ያልተወሰነው τι ክፍት የሆነውን የሰውና የጉዳይ ወሰን በተፈጥሯዊ አማርኛ ያሳያሉ።
- source_word: κἀγώ
  choice: እኔም ይቅር እላለሁ
  rationale: የጳውሎስን ተባባሪና ምላሽ ሰጪ አቋም በግልጽ አማርኛ ያሳያል።
- source_word: ὃ κεχάρισμαι, εἴ τι κεχάρισμαι
  choice: እኔም ይቅር ያልኩት ነገር ካለ—በእርግጥ ይቅር ያልኩት ነገር ካለ—
  rationale: የግሪኩን ራስን ዝቅ የሚያደርግ ሁኔታዊ አነጋገር ሳያለሰልስ ያቆያል፤ ሰረዙም የመሀል ሐሳቡን ያሳያል።
- source_word: δι’ ὑμᾶς
  choice: ስለ እናንተ
  rationale: ይቅርታው ለቆሮንቶስ ሰዎች ጥቅምና ሲባል መደረጉን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐν προσώπῳ Χριστοῦ
  choice: በመሲሑ ፊት
  rationale: πρόσωπον ፊትን፣ መገኘትን ወይም ሰውነትን/ውክልናን ሊያመለክት ይችላል። «በመሲሑ ፊት» ጳውሎስ በመሲሑ መገኘትና እይታ ሥር መሥራቱን ይገልጣል፤ ሌላው ትርጉም በማስታወሻ ተጠብቋል።
- source_word: Χριστοῦ
  choice: መሲሑ
  rationale: Χριστός እዚህ የቅቡዕነት ማዕረግ ነው፤ ስለዚህ እንደ ስም ብቻ ሳይቀር «መሲሑ» ተብሎ ተተርጉሟል።
theological_decisions:
- issue: ἐν προσώπῳ Χριστοῦ መገኘትን ወይስ ውክልናን ያመለክታል?
  choice: በመሲሑ ፊት
  alternative: መሲሑን ወክዬ
  rationale: ዋናው ጽሑፍ በመሲሑ ፊትና እይታ ሥር የመፈጸምን ሐሳብ ይይዛል፤ πρόσωπον ሊኖረው የሚችለው የሰውነት/ውክልና ሐሳብ ግን በማስታወሻ ተጠብቋል።
- issue: Χριστός እንደ ማዕረግ ወይስ እንደ ስም መቅረብ
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: በዚህ ስፍራ የΧριστός የማዕረግ ኃይል ንቁ ስለሆነ «መሲሑ» ተመርጧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ድግግሞሽና ሁኔታዊ ውጥረት በሰረዝ ተጠብቋል።
