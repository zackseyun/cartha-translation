  yaml_path: translation/nt/2_corinthians/002/016.yaml
  text: To the one[a], a fragrance from death to death; to the other, a fragrance from life to life[c][b]. And who is sufficient for these things?
translation:
  language: am
  text: ለአንዳንዶች ከሞት ወደ ሞት ሽታ፣[a][b] ለሌሎች ግን ከሕይወት ወደ ሕይወት ሽታ። ታዲያ ለእነዚህ ነገሮች ብቁ የሆነ ማን ነው?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ሽታ» የሚለው ቃል «መዓዛ» ወይም «ጠረን» ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: «ከሞት ወደ ሞት» እና «ከሕይወት ወደ ሕይወት» የሚሉት ሐረጎች ምንጭና ውጤትን—«ከሞት የሚመነጭና ወደ ሞት የሚያመራ» እና «ከሕይወት የሚመነጭና ወደ ሕይወት የሚያመራ»—ወይም የተጠናከረ ባሕርይን ሊገልጹ ይችላሉ።
    reason: alternative_reading
  - marker: c
    text: «ብቁ»፣ «በቂ» ወይም «ችሎታ ያለው»።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀσμή
  choice: ሽታ
  rationale: «ሽታ» በዘመናዊ አማርኛ ተፈጥሯዊና ከአዎንታዊም ሆነ ከአሉታዊ ተጽእኖ ጋር ሊሠራ የሚችል ነው፤ በአውዱ ያለውን ለሁለት ወገኖች የሚለያይ የሽታ ምሳሌ ይጠብቃል።
- source_word: ἐκ θανάτου εἰς θάνατον
  choice: ከሞት ወደ ሞት የሚያደርስ
  rationale: የግሪኩን ከ…ወደ… ትይዩ አወቃቀር ይጠብቃል፤ «የሚያደርስ» በአማርኛ ዓረፍተ ነገሩን ተፈጥሯዊ ሲያደርግ የምንጭና የውጤት ንባብን ያሳያል።
- source_word: ἐκ ζωῆς εἰς ζωήν
  choice: ከሕይወት ወደ ሕይወት የሚያደርስ
  rationale: ከቀዳሚው ሐረግ ጋር ያለውን ሚዛናዊ ትይዩነት ጠብቆ የግሪኩን አጭር አገላለጽ በግልጽ አማርኛ ያቀርባል።
- source_word: πρὸς ταῦτα
  choice: ለእነዚህ ነገሮች
  rationale: የταῦταን ብዙ ቁጥር ያንጸባርቃል፣ እንዲሁም ለተገለጹት ከባድ ኃላፊነቶች ብቁ ስለመሆን የቀረበውን ጥያቄ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἱκανός
  choice: ብቁ
  rationale: «ብቁ» ለተግባሩ የሚመጥን፣ በቂ ወይም ችሎታ ያለው የሚለውን የἱκανός ሐሳብ በዘመናዊና ክቡር አማርኛ ያስተላልፋል።
theological_decisions:
- issue: «ከሞት ወደ ሞት» እና «ከሕይወት ወደ ሕይወት» የሚሉት ጥንድ ሐረጎች ትርጓሜ
  choice: በዋናው ጽሑፍ የግሪኩን ከ…ወደ… አወቃቀር በመጠበቅ ምንጭና ውጤትን የሚጠቁም ንባብ ማቅረብ፣ ሌላውን የማጠናከሪያ ንባብ በማስታወሻ መግለጽ
  alternative: ሐረጎቹን ሙሉ በሙሉ እንደ ጠንካራ ባሕርይ መግለጫ፣ ማለትም «የሞት ሽታ» እና «የሕይወት ሽታ» ብሎ መተርጎም
  rationale: ግሪኩ ምንጭና ውጤትን ወይም የተጠናከረ ባሕርይን ሊገልጽ ይችላል። ዋናው ጽሑፍ ትይዩ ቅርጹን ይጠብቃል፤ ማስታወሻውም አንዱን ንባብ ብቻ እንደ ግዴታ እንዳንወስን ያደርጋል።
- issue: በአውዱ የተገለጸው ሽታ ማንነት
  choice: ከቁጥር 15 የሚቀጥለውን የመጀመሪያ ሰው ብዙ ቁጥር በ«ነን» መግለጽ
  alternative: ግሱን በመተው ቁርጥራጭ ሐረግ ብቻ ማቅረብ
  rationale: ግሪኩ ቁጥር 16 ከቀደመው ዓረፍተ ነገር ጋር በሰዋስው የተያያዘ ነው። አማርኛው ቁጥሩ ለብቻው ሲነበብ ግልጽ እንዲሆን «ነን» ተጨምሯል፣ አዲስ ሥነ መለኮታዊ ትርጓሜ ሳይጫን።
