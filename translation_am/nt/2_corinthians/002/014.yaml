  rationale: አገላለጹ ስለ እግዚአብሔር ያለውን እውቀት፣ ማለትም እርሱን ማወቅን፣ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: φανεροῦντι
  choice: እንዲታወቅ የሚያደርግ
  rationale: ግሱ መዓዛውን ግልጽ ወይም የታወቀ ማድረግን ያመለክታል፤ ይህ አተረጓጎም በአማርኛ ተፈጥሯዊ ሆኖ ምሳሌያዊውን አነጋገር ይጠብቃል።
- source_word: δι’ ἡμῶν
  choice: በእኛ በኩል
  rationale: διά ከባለቤት አገናዛቢ ጋር የመሣሪያነትን ወይም የወኪልነትን ሐሳብ ስለሚያሳይ፣ “በእኛ በኩል” ተብሏል።
- source_word: ἐν παντὶ τόπῳ
