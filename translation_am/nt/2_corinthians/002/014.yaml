  rationale: ቃሉ ተራ ድልን ብቻ ሳይሆን የድል ሰልፍን ምስል ያሳያል፤ ἡμᾶς የግሱ ቀጥተኛ ተሳቢ መሆኑም ተጠብቋል። ሌላው ሊሆን የሚችለው ትርጉም በእግር ማስታወሻ ቀርቧል።
- source_word: ἐν τῷ Χριστῷ
