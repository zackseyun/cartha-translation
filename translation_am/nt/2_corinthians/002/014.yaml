    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: ይመስገን
  rationale: “Τῷ δὲ θεῷ χάρις” የምስጋና አነጋገር ስለሆነ፣ በዘመናዊና ክብር ባለው አማርኛ “እግዚአብሔር ይመስገን” ተብሎ ተተርጉሟል።
- source_word: θριαμβεύοντι
