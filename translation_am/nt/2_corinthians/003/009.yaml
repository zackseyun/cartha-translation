source:
  edition: SBLGNT
  text: εἰ γὰρ ⸂τῇ διακονίᾳ⸃ τῆς κατακρίσεως δόξα, πολλῷ μᾶλλον περισσεύει ἡ διακονία τῆς ⸀δικαιοσύνης δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/009.yaml
  text: For if the ministry of condemnation came with glory[a], much more does the ministry of righteousness abound in glory.
translation:
  language: am
  text: የኩነኔ አገልግሎት በክብር ከመጣ፣ የጽድቅ[a] አገልግሎትማ እጅግ የበለጠ በክብር ይትረፈረፋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ፍትሕ»።
    reason: lexical_alternative
lexical_decisions:
- source_word: διακονία
  choice: አገልግሎት
  rationale: በዚህ አውድ ጳውሎስ ሁለት የቃል ኪዳን አገልግሎቶችን እያነጻጸረ ስለሆነ፣ «አገልግሎት» ከአንድ ጊዜ የሚፈጸም ተግባር ይልቅ ሰፊውን ሐሳብ ይይዛል።
- source_word: κατάκρισις
  choice: ኩነኔ
  rationale: «ኩነኔ» የጥፋተኝነት ፍርድንና የፍርድ ውጤቱን የሚገልጽ ሲሆን፣ ከጽድቅ ጋር ያለውን የሕግ ነክ ንጽጽር ይጠብቃል።
- source_word: δόξα
  choice: ክብር
  rationale: «ክብር» በአውዱ የሚገኘውን መለኮታዊ ግርማና ክብር በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: πολλῷ μᾶλλον
  choice: እጅግ የበለጠ
  rationale: ይህ አገላለጽ የግሪኩን ጠንካራ የንጽጽር አጽንዖት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: περισσεύω
  choice: ይትረፈረፋል
  rationale: ቃሉ ከበቂ በላይ መብዛትን ወይም መትረፍረፍን ያመለክታል፤ «ይትረፈረፋል» ይህን የብዛት ኃይል ይጠብቃል።
- source_word: δικαιοσύνη
  choice: ጽድቅ
  rationale: «ጽድቅ» በጳውሎሳዊ አውድ ዋናውን ትርጉም ይጠብቃል፤ «ፍትሕ» የሚለው አማራጭ ገጽታ በማስታወሻ ተቀምጧል።
- source_word: εἰ γὰρ τῇ διακονίᾳ … δόξα
  choice: … በክብር ከመጣ
  rationale: የግሪኩ የመጀመሪያ ሐረግ ግስ የለውም። አማርኛው «በክብር ከመጣ» ብሎ በማሟላት ክብሩ ይህን አገልግሎት አብሮት እንደመጣ ያሳያል፣ ከጽድቅ አገልግሎት የተትረፈረፈ ክብርም ጋር ያለውን ልዩነት ይጠብቃል።
theological_decisions:
- issue: በሁለቱ አገልግሎቶች ንጽጽር ውስጥ δικαιοσύνη እንዴት እንደሚተረጎም
  choice: ጽድቅ
  alternative: ፍትሕ
  rationale: «ጽድቅ» የጳውሎስን ሰፊ የቃሉን አጠቃቀምና ከኩነኔ ጋር ያለውን ንጽጽር ይጠብቃል፤ የፍትሕ ገጽታው እንዳይጠፋ በእግር ማስታወሻ ተጠቅሷል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «አገልግሎትማ» የሚለው ቅርጽ በሁለቱ አገልግሎቶች መካከል ያለውን ጠንካራ ንጽጽር በተፈጥሯዊ ሁኔታ ያሳያል።
