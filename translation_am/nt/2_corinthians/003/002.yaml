lexical_decisions:
- source_word: ἐπιστολή
  choice: ደብዳቤ
  rationale: የተጻፈ መልእክትን በዘመናዊና ግልጽ አማርኛ ይገልጣል፤ የጳውሎስንም ዘይቤ ይጠብቃል።
