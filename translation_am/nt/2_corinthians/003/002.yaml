- source_word: ὑμεῖς ἐστε
  choice: እናንተ ናችሁ
  rationale: የግል ተውላጠ ስሙን አጽንዖት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐγγεγραμμένη
  choice: የተጻፋችሁ
  rationale: ፍጹም ተገብሮ አንቀጹ አሁንም ተጽፎ የሚኖረውን ሁኔታ ያመለክታል፤ በአማርኛ ከሰዎች ብዛት ጋር በተፈጥሮ ተስማምቷል።
- source_word: ἐν ταῖς καρδίαις ἡμῶν
