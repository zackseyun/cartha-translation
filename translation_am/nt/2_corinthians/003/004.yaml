  text: Such confidence we have through Messiah toward God[a][b].
translation:
  language: am
  text: እንዲህ ያለ መተማመን በመሲሑ[a] በኩል በእግዚአብሔር ፊት[b] አለን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በክርስቶስ»።
    reason: alternative_reading
  - marker: b
    text: ቃል በቃል፣ «ወደ እግዚአብሔር»።
