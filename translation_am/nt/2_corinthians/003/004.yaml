lexical_decisions:
- source_word: Πεποίθησιν
  choice: መተማመን
  rationale: በዚህ አውድ ቃሉ የተረጋጋ እምነትንና ድፍረትን ያመለክታል፤ «መተማመን» ይህን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: δὲ τοιαύτην
  choice: እንዲህ ያለ
  rationale: τοιαύτην ከቀደመው ሐሳብ ጋር የሚያገናኝ የጥራት አመልካች ነው። δὲ ቀላል አገናኝ ስለሆነ በአማርኛው የዓረፍተ ነገር ፍሰት ውስጥ ተወክሏል።
- source_word: ἔχομεν
  choice: አለን
  rationale: የግሪኩን «አለን/ይዘናል» ቀጥተኛ ትርጉም በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: διὰ τοῦ Χριστοῦ
  choice: በመሲሑ በኩል
  rationale: διά ከዘር ቅጽ ጋር የመሣሪያነትን ወይም የመካከለኛነትን ሐሳብ ይገልጣል፤ «በ…በኩል» ይህን ያስተላልፋል። Χριστός እዚህ እንደ ማዕረግ «መሲሕ» ተብሏል።
- source_word: πρὸς τὸν θεόν
  choice: በእግዚአብሔር ፊት
  rationale: πρός በቀጥታ «ወደ» ማለት ቢችልም፣ እዚህ መተማመኑ ከእግዚአብሔር ጋር ያለውን አቅጣጫዊና ግንኙነታዊ ማጣቀሻ ያሳያል፤ «በእግዚአብሔር ፊት» በአማርኛ ግልጽና ተፈጥሯዊ ነው፣ ቃል በቃል ቅጹም በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: የΧριστοῦ አተረጓጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: ቃሉ በዚህ ስፍራ እንደ ማዕረግ ስለሚሠራ «መሲሑ» ተመርጧል፤ በባህላዊ የአማርኛ መጽሐፍ ቅዱስ አጠቃቀም የተለመደው «ክርስቶስ» በማስታወሻ ቀርቧል።
- issue: የπρὸς τὸν θεόν ግንኙነታዊ አቅጣጫ
  choice: በእግዚአብሔር ፊት
  alternative: ወደ እግዚአብሔር
  rationale: ዋናው ጽሑፍ ተፈጥሯዊ አማርኛን ይጠቀማል፣ ነገር ግን የግሪኩ አቅጣጫዊ አነጋገር እንዳይጠፋ ቃል በቃል አማራጩ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «መተማመን» ከልክ ያለፈ ስሜታዊነትን ሳያክል የጽኑ እርግጠኝነትን ሐሳብ ያቀርባል።
