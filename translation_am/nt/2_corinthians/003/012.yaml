    issue: The first footnote alternative is grammatically possible but less idiomatic than a construction with “በ… እንሠራለን.”
    rationale: Recasting it as “በታላቅ ግልጽነት እንሠራለን” gives a more natural Amharic alternative while preserving the lexical range of παρρησία.
