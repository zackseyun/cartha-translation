  naturalness: “በታላቅ ድፍረት እንሠራለን” is natural, dignified modern Amharic and retains the broad scope of the Greek construction. The comma after “ስለዚህ” clarifies the sentence’s logical flow.
  terminology: “ተስፋ” and “ድፍረት” are suitable standard renderings. The footnote should preserve the lexical sense of openness/frankness without treating speech as the only possible sense in the main text.
  issues:
  - severity: medium
    issue: The main text adds the specific action of speaking.
    rationale: χρώμεθα means “we use/exercise” and, with παρρησίᾳ, can concern frank or open conduct broadly. Although speech is contextually plausible, it is not explicitly stated in this clause and should not be made obligatory in the main translation.
