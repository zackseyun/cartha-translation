base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/011.yaml
  text: For if what was being brought to an end came with glory[c][b][a], much more what remains is in glory.
translation:
  language: am
  text: ምክንያቱም ወደ ፍጻሜ የሚመጣው በክብር ከመጣ፣[a][b] የሚጸናው ይልቁንም በክብር ነው።[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የሚወገደው»፣ «ወደ ጎን የሚተወው» ወይም «የሚሻረው»።
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ «በክብር በኩል»።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ «የሚቀረው» ወይም «የሚቀጥለው»።
    reason: lexical_alternative
lexical_decisions:
- source_word: καταργούμενον
  choice: የሚወገደው
  rationale: ቃሉ አንድ ነገር ከሥራ ውጭ መሆኑን፣ መወገዱን ወይም ወደ ፍጻሜ መምጣቱን ሊያመለክት ይችላል። እዚህ «የሚወገደው» የአሁን ጊዜ ተሳቢ አንቀጽንና ጊዜያዊነትን ይጠብቃል፤ «እየደበዘዘ» የሚለውን ዐውዳዊ ትርጓሜ ወደ ዋናው ጽሑፍ አያስገባም።
- source_word: διὰ δόξης
  choice: በክብር
  rationale: διά ከባለቤት አገባብ ጋር «በ/በኩል» የሚል ሐሳብ አለው። «በክብር» በአማርኛ አጭርና ተፈጥሯዊ ሲሆን የግሪኩን አገባብ ይጠብቃል።
- source_word: μένον
  choice: የሚኖረው
  rationale: μένω «መኖር፣ መቆየት፣ ጸንቶ መቀጠል» ማለት ይችላል። «የሚኖረው» ገለልተኛ የስም ተግባር ያለውን አንቀጽ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐν δόξῃ
  choice: በክብር ነው
  rationale: ἐν የሁኔታን ወይም የክልልን ሐሳብ ሊያሳይ ይችላል። «በክብር ነው» ከδιὰ δόξης ጋር ያለውን የአነጋገር ንጽጽር ሳያጠፋ ቀጥተኛ ትርጉም ይሰጣል።
- source_word: πολλῷ μᾶλλον
  choice: እጅግ ይበልጥ
  rationale: ይህ ጠንካራ የንጽጽር አገላለጽ ነው። «እጅግ ይበልጥ» የግሪኩን አጽንዖት በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: በሚወገደውና በሚኖረው መካከል ያለው ንጽጽር
  choice: ጥቅሱ ራሱ የማይሰይማቸውን ነገሮች «የሚወገደው» እና «የሚኖረው» ብሎ ማቅረብ
  alternative: በጥቅሱ ውስጥ «የብሉይ ኪዳን አገልግሎት» እና «የአዲስ ኪዳን አገልግሎት» ብሎ በግልጽ መጨመር
  rationale: የግሪኩ ጽሑፍ ገለልተኛ የስም ተግባር ያላቸውን አንቀጾች ይጠቀማል እንጂ ኪዳኖቹን በዚህ ጥቅስ በስም አይጠቅስም። ስለዚህ ትርጉሙ የጳውሎስን አሻሚነትና የንጽጽር አቀራረብ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ የሚገባ መደበኛ አማርኛ ተጠቅሟል። «እንኳ…የሚኖረውማ» የሚለው አወቃቀር የγάρ ምክንያታዊ ትስስርንና የπολλῷ μᾶλλον ጠንካራ ንጽጽርን በተፈጥሯዊ አማርኛ ያሳያል።
