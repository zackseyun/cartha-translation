  yaml_path: translation/nt/2_corinthians/003/014.yaml
  text: But their minds were hardened[a]. For until this very day, at the reading of the old covenant, the same veil remains, not being lifted[b], because in Messiah it is removed.
translation:
  language: am
  text: 'ነገር ግን አእምሯቸው ደነደነ። እስከ ዛሬ ድረስ የቀድሞው ኪዳን[a] ሲነበብ፣ ያው መጋረጃ ሳይነሳ እንዳለ ይቆያል፤ በመሲሑ ይወገዳልና[b]።


    [a] ወይም፦ “ብሉይ ኪዳን።” ግሪክኛው በቀጥታ “የቀድሞው ኪዳን” ይላል።


    [b] ወይም፦ “ምክንያቱም በመሲሑ የቀድሞው ኪዳን ይሻራል።” በግሪክኛው የሚወገደው መጋረጃው እንደሆነ ወይም የሚሻረው የቀድሞው ኪዳን እንደሆነ ሊረዳ ይችላል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “ብሉይ ኪዳን።” ግሪክኛው በቀጥታ “የቀድሞው ኪዳን” ይላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፦ “ምክንያቱም በመሲሑ የቀድሞው ኪዳን ይሻራል።” በግሪክኛው የሚወገደው መጋረጃው እንደሆነ ወይም የሚሻረው የቀድሞው ኪዳን እንደሆነ ሊረዳ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπωρώθη
  choice: ደነደነ
  rationale: መንፈሳዊ ግንዛቤ የመደንደኑን ተገብሮአዊ ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ሆን ብሎ የማመፅን ሐሳብ አያጠናክርም።
- source_word: νοήματα
  choice: አእምሯቸው
  rationale: በዐውዱ የማስተዋልና የመገንዘብ ችሎታቸውን ያመለክታል፤ ይህ አገላለጽ በዘመናዊ አማርኛ ግልጽ ነው።
- source_word: ἄχρι γὰρ τῆς σήμερον ἡμέρας
  choice: እስከ ዛሬዋ ዕለት ድረስ
  rationale: የግሪክኛውን ጊዜያዊ አጽንዖት በተፈጥሯዊና ክብር ባለው አማርኛ ይጠብቃል።
- source_word: κάλυμμα
  choice: መጋረጃ
  rationale: በአጎራባች ቁጥሮች ካለው የሙሴ መጋረጃ ምሳሌ ጋር ያለውን ትስስር ይጠብቃል።
- source_word: ἐπὶ τῇ ἀναγνώσει
  choice: ሲነበብ
  rationale: “በንባቡ ጊዜ” የሚለውን ሐሳብ በአጭርና በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: παλαιᾶς διαθήκης
  choice: የቀድሞው ኪዳን
  rationale: διαθήκη በዚህ ስፍራ “ኪዳን” ማለት ነው፤ “የቀድሞው” የሚለውም παλαιᾶςን ያለ ትርጓሜያዊ ጭማሪ ይተረጉማል።
- source_word: μένει
  choice: እንዳለ ይኖራል
  rationale: መጋረጃው ያለበትን ሁኔታ ቀጥሎ መኖሩን ያሳያል።
- source_word: μὴ ἀνακαλυπτόμενον
  choice: ሳይነሳ
  rationale: የመጋረጃውን ምስላዊ አነጋገር በመጠበቅ፣ አሉታዊውን ተገብሮአዊ ክፍለ ነገር ተፈጥሯዊ በሆነ አማርኛ ያቀርባል።
- source_word: ἐν Χριστῷ
  choice: በመሲሑ
  rationale: Χριστόςን እንደ ማዕረግ “መሲሕ” ብሎ ይተረጉማል፤ ἐν ደግሞ በዐውዱ “በ” ተብሎ በተፈጥሯዊ ሁኔታ ቀርቧል።
- source_word: καταργεῖται
  choice: ይወገዳል
  rationale: መጋረጃውን እንደ ቅርብ ተመላሽ በመውሰድ “ይወገዳል” የምስሉን ሐሳብና የግሱን ተገብሮአዊ ቅርጽ ይጠብቃል፤ ሌላው የተመላሽ አማራጭ በማስታወሻ ተመዝግቧል።
theological_decisions:
- issue: የκαταργεῖται ተመላሽ
  choice: በዋናው ጽሑፍ የግሱ የተገመተ ባለቤት መጋረጃው ነው፤ ስለዚህ “በመሲሑ ይወገዳል” ተብሏል።
  alternative: የሚሻረው ወይም ወደ ጎን የሚተወው የቀድሞው ኪዳን ነው።
  rationale: τὸ αὐτὸ κάλυμμα የቅርብ ተመላሽ ሲሆን፣ μὴ ἀνακαλυπτόμενονም የመጋረጃውን ምስል ይቀጥላል። ሆኖም የግሪክኛው አገባብ የቀድሞውን ኪዳን እንደ ተመላሽ የመውሰድ አማራጭን ሙሉ በሙሉ ስለማይዘጋ፣ ይህ ጉልህ አሻሚነት በእግር ማስታወሻ ተጠብቋል።
