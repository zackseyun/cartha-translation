  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “መጋረጃ፣” “ኪዳን” እና “መሲሕ” የሚሉት ቃላት የጽሑፉን ምስላዊና ሥነ መለኮታዊ ውጥረት ሳያስወግዱ በታወቀ የመጽሐፍ ቅዱስ አጠራር ቀርበዋል።
