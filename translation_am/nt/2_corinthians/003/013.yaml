- source_word: εἰς τὸ τέλος
  choice: ፍጻሜ
  rationale: τέλος ማለት መጨረሻ፣ ፍጻሜ፣ ግብ ወይም ውጤት ሊሆን ይችላል። ከκαταργουμένου ጋር በዚህ አውድ ፍጻሜ የመቋረጥን ሐሳብ ይይዛል፣ አማራጩም በማስታወሻ ተጠብቋል።
- source_word: τοῦ καταργουμένου
  choice: ይወገድ የነበረውን ነገር
  rationale: የአሁን ተሳቢ ክፍለ ግስ የሚካሄድ የመወገድ ወይም የኃይል ማጣት ሂደትን ይገልጻል። ‘ይወገድ የነበረው’ የግሪኩን አጠቃላይ ትርጉም ከ‘እየደበዘዘ’ የብርሃን ብቻ ትርጓሜ ይልቅ በቅርብ ይጠብቃል።
