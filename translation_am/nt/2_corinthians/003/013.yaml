- source_word: πρὸς τὸ μὴ ἀτενίσαι
  choice: አተኩረው እንዳያዩ
  rationale: የዓላማ ግንባታውንና ἀτενίζω የሚያመለክተውን በጥሞና የማየት ጠንካራ ስሜት ይጠብቃል።
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: የእስራኤል ልጆች
