  text: እኛም ሙሴ እንዳደረገው አናደርግም፤ እርሱ የእስራኤል ልጆች[b] እየተወገደ የነበረው ነገር ፍጻሜ ላይ አተኩረው እንዳያዩ በፊቱ ላይ መጋረጃ ይሸፍን ነበር።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “እየተወገደ የነበረው ነገር ግብ ወይም ውጤት ላይ።”
    reason: alternative_reading
  - marker: b
    text: “የእስራኤል ልጆች” የግሪኩ ቀጥተኛ አገላለጽ ነው፤ ፈሊጣዊ ትርጉሙ “እስራኤላውያን” ማለት ነው።
