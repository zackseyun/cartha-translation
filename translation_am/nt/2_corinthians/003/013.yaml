- source_word: κάλυμμα
  choice: መሸፈኛ
  rationale: በፊት ላይ የሚደረግ መጋረጃን በግልጽ የሚገልጽና ቀጣዩን የጳውሎስ ዘይቤም ለመሸከም የሚስማማ ቃል ነው።
- source_word: πρόσωπον αὐτοῦ
