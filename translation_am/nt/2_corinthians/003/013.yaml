  rationale: ቅርብ አውዱ በሚወገደውና በሚኖረው መካከል ያለውን ንጽጽር ያጎላል። ዋናው ጽሑፍ የመወገድን ሐሳብ ይጠብቃል፤ τέλος ግን ‘ግብ’ ወይም ‘ውጤት’ ሊሆን የሚችለው እውነተኛ አሻሚነት በማስታወሻ ተገልጿል።
