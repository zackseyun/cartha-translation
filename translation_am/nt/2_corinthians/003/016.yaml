    issue: The main temporal expression does not convey the indefinite/iterative force.
    rationale: The draft’s “በተመለሰ ጊዜ” can imply one past return. Replacing “ጊዜ” with “ቁጥር” expresses the source’s ‘whenever’ force without adding interpretation.
