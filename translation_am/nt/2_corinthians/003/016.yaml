  text: But whenever one turns to the Lord[b][a], the veil is removed.
translation:
  language: am
  text: ነገር ግን ማንም ወደ ጌታ በተመለሰ ቁጥር፣ መሸፈኛው ይወገዳል።[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወደ ጌታ በተመለሰ ቁጥር።”
    reason: የግሪኩ ጽሑፍ ግልጽ የሆነ ስማዊ ባለቤት ስለሌለው ያለ “ማንም” ሊተረጎም ይችላል።
  - marker: b
    text: ወይም፣ “መሸፈኛው ይነሳል።”
    reason: περιαιρεῖται መወገድን ወይም መነሳትን ሊገልጽ ይችላል።
lexical_decisions:
- source_word: ἡνίκα δὲ ἐὰν
  choice: ነገር ግን … በተመለሰ ጊዜ
  rationale: δέ የሚያሳየውን ንፅፅር “ነገር ግን” ይጠብቃል፤ ἡνίκα ከἐὰν እና ከንዑስ አንቀጽ ግስ ጋር ያለውን ያልተወሰነ ጊዜያዊ ሁኔታ “በ…ጊዜ” በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐπιστρέψῃ
  choice: በተመለሰ
  rationale: ወደ አንድ አቅጣጫ መዞርን ወይም መመለስን ያሳያል፤ “ተመለሰ” የንስሐን ወይም የመለወጥን ሥነ መለኮታዊ ትርጉም ከጽሑፉ በላይ ሳይወስን አቅጣጫዊውን ምስል ይጠብቃል።
- source_word: πρὸς κύριον
  choice: ወደ ጌታ
  rationale: πρός ከተሳቢ ጋር ያለውን ወደ ሰው የሚያመለክት አቅጣጫ “ወደ” በግልጽ ያስተላልፋል፤ κύριος ደግሞ ያለ ተጨማሪ መለያ “ጌታ” ተብሎ ተተርጉሟል።
- source_word: περιαιρεῖται
  choice: ይወገዳል
  rationale: የአሁን ጊዜ ተደራጊ ቅርጹን ይጠብቃል፤ ድርጊቱን የሚፈጽመውን ባለቤት አይጨምርም።
- source_word: τὸ κάλυμμα
  choice: መሸፈኛው
  rationale: κάλυμμα የሚሸፍን ነገርን ያመለክታል፤ በሙሴ መሸፈኛ ዐውደ ንባብ ውስጥ “መሸፈኛው” ግልጽና ተፈጥሯዊ ነው።
theological_decisions:
- issue: ያልተገለጸው የἐπιστρέψῃ ባለቤት ግለሰብን ወይስ ሌላ የዐውደ ንባብ ባለቤትን ያመለክታል?
  choice: “ማንም” በማለት አጠቃላይና ያልተወሰነ ባለቤት ማቅረብ
  alternative: ባለቤቱን ሳይጨምሩ “ወደ ጌታ በተመለሰ ጊዜ” ማለት
  rationale: የግሪኩ ግስ ግልጽ ስም ባይኖረውም ነጠላ ባለቤትን ያሳያል። “ማንም” አጠቃላይ ኃይሉን ይጠብቃል፣ ነገር ግን ዐውደ ንባቡ ሌላ መገናኛ እንዲኖረው የሚያስችለውን አማራጭ በማስታወሻ ያቀርባል።
- issue: “ጌታ” በዚህ ዐውደ ንባብ ማንን ያመለክታል?
  choice: ጽሑፉ እንዳለው “ጌታ” ብቻ ማለት
  alternative: “ጌታ ክርስቶስ” ወይም “ጌታ፣ ማለትም መንፈስ” ብሎ መግለጽ
  rationale: ይህ ቁጥር κύριον ብቻ ይላል። በአቅራቢያው ዐውደ ንባብ የጌታና የመንፈስ ግንኙነት ውስብስብ ቢሆንም፣ ትርጉሙ በዋናው ጽሑፍ ውስጥ ማንነቱን በተጨማሪ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “መሸፈኛ” ከዐውደ ንባቡ የሙሴ ምስል ጋር የሚስማማ ሲሆን፣ “ጌታ” የሚለው ያለ ትርጓሜያዊ ጭማሪ ተጠብቋል።
