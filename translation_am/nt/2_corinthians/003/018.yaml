  text: ἡμεῖς δὲ πάντες ἀνακεκαλυμμένῳ προσώπῳ τὴν δόξαν κυρίου κατοπτριζόμενοι τὴν αὐτὴν εἰκόνα μεταμορφούμεθα ἀπὸ δόξης εἰς δόξαν, καθάπερ ἀπὸ κυρίου πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/018.yaml
  text: And we all[a], with unveiled face, beholding the glory of the Lord as in a mirror, are being transformed into the same image from glory to glory, just as from the Lord[b], the Spirit.
translation:
  language: am
  text: እኛ ሁላችን ግን ባልተሸፈነ ፊት የጌታን ክብር በመስታወት እያየን[a]፣ ከክብር ወደ ክብር ያንኑ መልክ እየተለወጥን ነው፤ ይህም ከጌታ፣ ከመንፈስ እንደሚመጣ ሁሉ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የጌታን ክብር እንደ መስታወት እያንጸባረቅን።”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνακεκαλυμμένῳ προσώπῳ
  choice: ባልተሸፈነ ፊት
  rationale: የግሪኩን ነጠላ የስብስብ አገላለጽና ከመገለጥ የተገኘውን የአሁን ሁኔታ ይጠብቃል።
- source_word: δόξαν κυρίου
  choice: የጌታን ክብር
  rationale: የዝምድናውን አገላለጽ ቀጥታና በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: κατοπτριζόμενοι
  choice: በመስታወት እያየን
  rationale: ግሱ በመስታወት ማየትን ወይም እንደ መስታወት ማንጸባረቅን ሊያመለክት ይችላል፤ ዋናው ጽሑፍ ከማየት ወደ መለወጥ ያለውን የአውዱን እንቅስቃሴ ተከትሏል፣ ሌላውም ንባብ በማስታወሻ ተጠብቋል።
- source_word: τὴν αὐτὴν εἰκόνα
  choice: ያንኑ መልክ
  rationale: ከጌታ ክብር ጋር ያለውን ትስስር በግልጽና ዘመናዊ አማርኛ ያስቀምጣል።
- source_word: μεταμορφούμεθα
  choice: እየተለወጥን ነው
  rationale: የአሁን ጊዜውን፣ ተገብሮአዊውንና ቀጣይነት ያለውን የመለወጥ ሂደት ይገልጣል።
- source_word: ἀπὸ δόξης εἰς δόξαν
  choice: ከክብር ወደ ክብር
  rationale: የግሪኩን አጭርና ክፍት አገላለጽ ያለ ትርጓሜያዊ ማስፋት ይጠብቃል።
- source_word: ἀπὸ κυρίου πνεύματος
  choice: ከጌታ፣ ከመንፈሱ
  rationale: የግሪኩን የታመቀና ከአንድ በላይ አገባብ ሊኖረው የሚችል አገላለጽ በትንሹ ትርጓሜ ያቀርባል፤ ግልጽ አማራጮቹ በማስታወሻ ተሰጥተዋል።
- source_word: κύριος
  choice: ጌታ
  rationale: በዚህ አውድ ለκύριος ተፈጥሯዊና የተለመደ አማርኛ ነው።
theological_decisions:
- issue: የκατοπτριζόμενοι ትርጉም
  choice: የጌታን ክብር በመስታወት ማየት
  alternative: የጌታን ክብር እንደ መስታወት ማንጸባረቅ
  rationale: አውዱ የጌታን ክብር ከማየት ወደ መለወጥ የሚሄድ ቢመስልም፣ ግሱ ሌላውን ትርጉምም በእውነት ሊሸከም ስለሚችል አማራጩ አልተወገደም።
- issue: በἀπὸ κυρίου πνεύματος ውስጥ κυρίου እና πνεύματος ያላቸው ዝምድና
  choice: ከጌታ፣ ከመንፈሱ
  alternative: ከመንፈስ ከሆነው ጌታ፤ ወይም ከጌታ መንፈስ
  rationale: የግሪኩ ሐረግ አጭርና አሻሚ ነው። ዋናው ንባብ ቃላቱን በቅርብ ይከተላል፤ ከዚህ የበለጠ የሚወስኑ ንባቦች በማስታወሻ ተጠብቀዋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ነጠላ የስብስብ አገላለጽ “ፊት” ተጠብቋል፤ በሁለቱ አሻሚ ሐረጎች ላይ ዋናው ጽሑፍ ከምንጩ ጋር ቅርብ ሆኖ አማራጮቹ በማስታወሻ ቀርበዋል።
