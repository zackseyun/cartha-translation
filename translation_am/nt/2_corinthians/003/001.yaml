    text: ወይም፣ “የምስክርነት ደብዳቤዎች።”
    reason: lexical_alternative
  revision_rationale: The revision replaces the misleading testimony/attestation wording with natural Amharic expressions for self-commendation and commendatory letters, while preserving the Greek rhetorical form, the repeated-action nuance, and the lexical relationship between the verb and the letters.
