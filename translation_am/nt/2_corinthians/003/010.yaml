id: 2CO.3.10
reference: 2 Corinthians 3:10
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ γὰρ οὐ δεδόξασται τὸ δεδοξασμένον ἐν τούτῳ τῷ μέρει ⸀εἵνεκεν τῆς ὑπερβαλλούσης δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/010.yaml
  text: For indeed[a], what had been glorified has not been glorified in this respect, because of the glory that surpasses it.
translation:
  language: am
  text: በእርግጥም፣ ክብር የተሰጠው በዚህ ረገድ፣ ከሚልቀው ክብር የተነሣ፣ ክብር አልተሰጠውም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ γὰρ
  choice: በእርግጥም
  rationale: የሐረጉን አጽንዖትና ከቀደመው ሐሳብ ጋር ያለውን አያያዥነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οὐ δεδόξασται
  choice: ክብር የለውም
  rationale: ግሪኩ ፍጹም ተደራጊ ግስ ቢጠቀምም፣ ቃል በቃል «አልከበረም» ማለት በአማርኛ የተፈለገውን ንጽጽራዊ አያዎ በግልጽ አያቀርብም፤ «ክብር የለውም» ከአውዱ ገደብ ጋር ይህን ኃይል ይጠብቃል።
- source_word: τὸ δεδοξασμένον
  choice: ክብር የነበረው
  rationale: ግልጽ ያልተጠቀሰውን ስም ሳይጨምር የአንቀጽ ያለውን የፍጹም ተሳቢ ግስ ስማዊ አጠቃቀም በተፈጥሯዊ አማርኛ ይወክላል።
- source_word: ἐν τούτῳ τῷ μέρει
  choice: በዚህ ረገድ
  rationale: ክብሩ ፈጽሞ መካዱን ሳይሆን ክደቱ በተወሰነው የንጽጽር አንጻር መሆኑን ያሳያል።
- source_word: εἵνεκεν
  choice: ስላለ
  rationale: የምክንያት ግንኙነቱን ግልጽና ተፈጥሯዊ በሆነ አማርኛ ያቀርባል።
- source_word: τῆς ὑπερβαλλούσης δόξης
  choice: ከእርሱ የሚበልጠው ክብር
  rationale: የὑπερβαλλούσηςን ንጽጽራዊ ኃይል በግልጽ ያሳያል፤ «ከእርሱ» የሚለው ከአውዱ የተሟላ ሲሆን የኋለኛው ክብር የቀደመውን እንደሚበልጥ ያመለክታል።
- source_word: δόξα / δεδοξασμένον wordplay
  choice: ክብር የነበረው ... ክብር የለውም ... ክብር
  rationale: የδοξ- ቃል ሥር ድግግሞሽንና የጳውሎስን አያዎአዊ ንጽጽር በ«ክብር» ድግግሞሽ ያንጸባርቃል።
theological_decisions:
- issue: ጳውሎስ የቀደመው አገልግሎት ምንም ክብር እንዳልነበረው ፈጽሞ ይክዳል ወይስ በንጽጽር ይናገራል?
  choice: «በዚህ ረገድ» በሚለው የተገደበ ንጽጽራዊ ክደት፤ የቀደመው ክብር ከሚበልጠው ክብር አንጻር ክብር እንደሌለው ይቆጠራል።
  alternative: የቀደመው አገልግሎት እውነተኛ ክብር እንዳልነበረው ፍጹም መካድ።
  rationale: «በዚህ ረገድ» የሚለው ሐረግ ክደቱን ይገድባል፤ በምዕራፉም አውድ የቀደመው አገልግሎት ክብር እንደነበረው ተነግሮ፣ ያ ክብር በታላቁ ክብር እንደተሸፈነ ይታያል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ አያዎአዊ አነጋገር በ«ክብር የነበረው ... ክብር የለውም» ተጠብቋል። በቀረበው የግሪክ ጽሑፍ የግርጌ ማስታወሻ የሚጠይቅ የትርጉም ልዩነት ስለሌለ የእንግሊዝኛው [a] ማስታወሻ አልተወሰደም፤ እሱም ከግሪኩ የተለየ አማራጭ ሳይሆን የእንግሊዝኛ አገላለጽ ልዩነት ነው።
