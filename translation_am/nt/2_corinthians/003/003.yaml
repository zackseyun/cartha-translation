  text: showing that you are a letter from the Messiah[a], ministered by us, written not with ink but with the Spirit of the living God[d][c][b], not on stone tablets but on tablets of hearts of flesh.
translation:
  language: am
  text: እናንተ በእኛ አገልግሎት የቀረበች የመሲሑ ደብዳቤ[a] መሆናችሁ ግልጽ ነው፤ የተጻፈችውም በቀለም ሳይሆን በሕያው እግዚአብሔር መንፈስ፣ በድንጋይ ጽላቶች ላይ ሳይሆን በጽላቶች፣ ማለትም በየሥጋ ልቦች ላይ ነው።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የመሲሑ ደብዳቤ” የሚለው “ከመሲሑ የመጣች ደብዳቤ” ማለትም መሲሑ ምንጯ ወይም ደራሲዋ መሆኑን ሊያመለክት ይችላል። “መሲሕ” የግሪኩን Χριστός ማዕረግ ይተረጉማል፤ በባህላዊ አጠራር “ክርስቶስ” ነው።
    reason: alternative_reading
  - marker: b
    text: “የሥጋ ልቦች” የሚለው አነጋገር ከድንጋይ ጽላቶች ጋር በተቃራኒ ልቦቹ ራሳቸው እንደ ጽላቶች መሆናቸውን ያሳያል፤ የአዲስ ኪዳንን ተስፋ፣ በተለይም ሕዝቅኤል 11፥19 እና 36፥26ን፣ ያስታውሳል።
