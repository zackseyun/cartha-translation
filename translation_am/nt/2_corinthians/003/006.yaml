  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ሚዛናዊ ንጽጽር—ፊደል/መንፈስ፣ መግደል/ሕይወት መስጠት—ተጠብቋል።
