base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/006.yaml
  text: who also made us competent as servants of a new covenant[a], not of the letter but of the Spirit; for the letter kills[c][b], but the Spirit gives life.
translation:
  language: am
  text: እርሱም የአዲስ ኪዳን አገልጋዮች[a] እንድንሆን ብቁ አደረገን፤ የፊደል[b] ሳይሆን የመንፈስ[c] አገልጋዮች አደረገን። ፊደል ይገድላልና፤ መንፈስ ግን ሕይወትን ይሰጣል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አገልጋዮች” በሚለው ፋንታ “አገልጋዮች/አገልጋዮች መሪዎች” ማለት ሳይሆን፣ “ሚኒስተሮች” ተብሎ ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “ፊደል” ማለት “የተጻፈ ሕግ” ተብሎም ሊገባ ይችላል።
    reason: lexical_alternative
  - marker: c
    text: “መንፈስ” የሚለው በሁለቱም ስፍራዎች መንፈስ ቅዱስ ተብሎ ሊገባ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἱκάνωσεν
  choice: ብቁ አደረገን
  rationale: ከአምላክ የሚመጣውን ለአገልግሎት ብቁ የማድረግ ተግባር በተፈጥሯዊና ግልጽ አማርኛ ያስተላልፋል።
- source_word: διακόνους
  choice: አገልጋዮች
  rationale: የአገልግሎትን መሠረታዊ ትርጉም ይጠብቃል፤ ጽሑፉ ያልገለጸውን የኋለኛ ዘመን ቤተ ክርስቲያናዊ ሹመት አያስገባም።
- source_word: καινῆς διαθήκης
  choice: የአዲስ ኪዳን
  rationale: የግሪኩን የባለቤትነት ግንኙነት በተፈጥሯዊ አማርኛ ያቀርባል፤ ‘አዲስ ኪዳን’ የሚለውንም ዋና ጽንሰ ሐሳብ ይጠብቃል።
- source_word: γράμματος / γράμμα
  choice: ፊደል
  rationale: የጳውሎስን አጭርና ኃይለኛ ንጽጽር ይጠብቃል፤ ‘የተጻፈ ሕግ’ የሚለው የበለጠ ትርጓሜያዊ አማራጭ በማስታወሻ ቀርቧል።
- source_word: πνεύματος / πνεῦμα
  choice: መንፈስ
  rationale: በአማርኛ የፊደል መጠን ልዩነት ስለሌለ፣ ቃሉ መንፈስ ቅዱስን ወይም ‘መንፈስ’ን ሊያመለክት የሚችለውን የግሪክ ጽሑፍ አሻሚነት በተፈጥሮ ይጠብቃል።
- source_word: ἀποκτέννει
  choice: ይገድላል
  rationale: የግሪኩን ቀጥተኛና ኃይለኛ የአሁን ጊዜ አገላለጽ ይጠብቃል።
- source_word: ζῳοποιεῖ
  choice: ሕይወትን ይሰጣል
  rationale: ‘ሕያው ያደርጋል’ የሚለውን የግሪክ ትርጉም በተፈጥሯዊና የተለመደ ዘመናዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: πνεῦμα መንፈስ ቅዱስን ወይስ በአጠቃላይ ‘መንፈስ’ን ያመለክታል?
  choice: መንፈስ፣ በዐውደ ንባቡ በዋናነት መንፈስ ቅዱስን እንደሚያመለክት
  alternative: በአጠቃላይ ‘መንፈስ’ ወይም የውስጣዊ መንፈሳዊ ትርጉም
  rationale: የአዲሱ ኪዳንና ሕይወት ሰጪነት ዐውደ ንባብ መንፈስ ቅዱስን ይጠቁማል፤ ሆኖም ግሪኩ የትልቅና ትንሽ ፊደል ልዩነት ስለማያሳይ አማራጩ በማስታወሻ ተጠብቋል።
- issue: ‘ፊደል ይገድላል’ የሚለው አገላለጽ ወሰን
  choice: የጳውሎስን አጭር አገላለጽ ሳይሰፋ መጠበቅ
  alternative: ‘የተጻፈው ሕግ ሞትን ያመጣል’ ብሎ መተርጎም
  rationale: ግሪኩ γράμμα በዐውደ ንባቡ የተጻፈውን ሕግ ሊያመለክት ቢችልም፣ በዋናው ጽሑፍ እንዲህ ማስፋት የጳውሎስን ሆን ብሎ ያቆየውን አጭር ንጽጽር ያጠባል።
