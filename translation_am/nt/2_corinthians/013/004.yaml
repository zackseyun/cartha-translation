theological_decisions:
- issue: በመስቀሉ ላይ የክርስቶስ ‘ድካም’ ትርጉም
  choice: ጽሑፉ እንዳለው ‘በድካም’ ተብሎ ተጠብቋል።
  alternative: ድካሙን የሰዎች የውጭ እይታ ብቻ አድርጎ መግለጽ።
  rationale: የክርስቶስን መለኮት ወይም ኃጢአት አልባነት ሳይክድ፣ በስቅለቱ የታየውን የድካምና የእግዚአብሔር ኃይል አያዎ ተቃርኖ ይጠብቃል።
- issue: ‘ከእርሱ ጋር እንኖራለን’ የሚለው ማጣቀሻ
  choice: በቆሮንቶስ ሰዎች ዘንድ የሚገለጠውን በክርስቶስ ኃይል የተሞላ ሐዋርያዊ ሕይወትም ሆነ ሰፊውን የትንሣኤ ሕይወት አስተጋብኦ ሊያካትት በሚችል መልኩ ክፍት ተደርጎ ተተርጉሟል።
  alternative: የመጨረሻውን ትንሣኤ ብቻ ወይም የአሁኑን ሐዋርያዊ አገልግሎት ብቻ እንደሚያመለክት መወሰን።
  rationale: የቅርብ ዐውዱ εἰς ὑμᾶς በማለት ከቆሮንቶስ ሰዎች ጋር ያለውን ግንኙነት ያሳያል፤ ከክርስቶስ ጋር የመኖር ቋንቋው ግን ሰፊ የትንሣኤ አስተጋብኦም አለው።
