  text: καὶ ⸀γὰρ ἐσταυρώθη ἐξ ἀσθενείας, ἀλλὰ ζῇ ἐκ δυνάμεως θεοῦ. καὶ γὰρ ἡμεῖς ἀσθενοῦμεν ἐν αὐτῷ, ἀλλὰ ⸀ζήσομεν σὺν αὐτῷ ἐκ δυνάμεως θεοῦ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/004.yaml
  text: For indeed he was crucified in weakness[a], but he lives by the power of God. For indeed we are weak in him[d][c][b], but we will live with him by the power of God toward you.
translation:
  language: am
  text: እርሱ በድካም ተሰቅሏልና[a]፤ ነገር ግን በእግዚአብሔር ኃይል ሕያው ነው። እኛም በእርሱ ደካሞች ነን፤ ነገር ግን ከእርሱ ጋር በእግዚአብሔር ኃይል[b] ወደ እናንተ[c] እንኖራለን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “ከድካም።” የግሪኩ ἐξ ምንጭን ወይም መሠረትን በግልጽ ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “ከእግዚአብሔር ኃይል።” ግሪኩ ἐκ የሚለውን ቃል በመድገም መለኮታዊ ኃይልን ከድካም ጋር ያነጻጽራል።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “ለእናንተ” ወይም “በእናንተ ዘንድ።” εἰς ὑμᾶς የሚለው የግሪክ ሐረግ አቅጣጫን፣ ዝምድናን ወይም ውጤትን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσταυρώθη
  choice: ተሰቅሏል
  rationale: የግሪኩን ተደራጊ አውራረድ የሚጠብቅና ለመስቀል ሞት የተለመደው ትክክለኛ አገላለጽ ነው።
- source_word: ἐξ ἀσθενείας
  choice: በድካም
  rationale: ἐξ ምንጭን ወይም መሠረትን ሊያመለክት ቢችልም፣ በዚህ ዐውድ በድካም ሁኔታ መሰቀሉን በተፈጥሯዊ አማርኛ ያሳያል፤ የቀጥታው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ζῇ
  choice: ሕያው ነው
  rationale: የአሁን ጊዜውንና ቀጣይ ሕይወትን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: ἐκ δυνάμεως θεοῦ
  choice: በእግዚአብሔር ኃይል
  rationale: የመለኮታዊውን ኃይል ምንጭና አድራጊነት በተፈጥሯዊ አማርኛ ያሳያል፤ ከድካም ጋር ያለው ተቃርኖም ይጠበቃል።
- source_word: ἀσθενοῦμεν
  choice: ደካሞች ነን
  rationale: ከመጀመሪያው የድካም ሐረግ ጋር ያለውን የቃል ግንኙነት ይጠብቃል።
- source_word: ἐν αὐτῷ
  choice: በእርሱ
  rationale: ጳውሎሳዊውን በክርስቶስ የመሆን ጥቅጥቅ ያለ አገላለጽ ሳይዘረጋ ይጠብቃል።
- source_word: ζήσομεν
