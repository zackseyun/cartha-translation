  text: For we are not able to do anything against the truth[a], but for the truth.
translation:
  language: am
  text: እውነትን በመቃወም ምንም ነገር ማድረግ አንችልምና፤ ለእውነት[a] ግን ማድረግ እንችላለን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እውነትን ለመደገፍ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: አንችልምና
  rationale: γάρ ከቀደመው ንግግር ጋር ያለውን የምክንያት ወይም የማብራሪያ ግንኙነት በአማርኛው ‘-ና’ ያሳያል፤ οὐ ደግሞ ግሱን ይክዳል።
- source_word: δυνάμεθά
  choice: ማድረግ አንችልም / እንችላለን
  rationale: δύναμαι ችሎታን ወይም አቅምን ያመለክታል። በሁለተኛው አንቀጽ ግሱ በግሪክ ቢታወቅም ባይደገም፣ በአማርኛ ግልጽና ተፈጥሯዊ እንዲሆን ‘እንችላለን’ ተደግሟል።
- source_word: τι
  choice: ምንም
  rationale: በአሉታዊ አንቀጽ ውስጥ τι ያለውን ሰፊ ትርጉም ‘ምንም’ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: κατὰ τῆς ἀληθείας
  choice: እውነትን በመቃወም
  rationale: κατά ከዘር ስም ጋር እዚህ ‘በመቃወም/በተቃራኒ’ የሚለውን ትርጉም ይሰጣል። ‘እውነትን በመቃወም’ ይህን ግንኙነት በዘመናዊ አማርኛ ግልጽ ያደርጋል።
- source_word: ἀλλὰ
  choice: ግን
  rationale: ἀλλά በሁለቱ አንቀጾች መካከል ያለውን ጠንካራ ንፅፅር ‘ግን’ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὑπὲρ τῆς ἀληθείας
  choice: ለእውነት
  rationale: ὑπέρ እዚህ ድጋፍን ወይም በአንድ ነገር ወገን መሆንን ያመለክታል። ‘ለእውነት’ የግሪኩን አጭር ንፅፅር ይጠብቃል፤ የበለጠ ግልጽ አማራጭ በማስታወሻው ቀርቧል።
theological_decisions:
- issue: በጳውሎስ ንፅፅር ውስጥ ‘እውነት’ የሚለው ስፋት
  choice: ‘እውነት’ የሚለው ሳይጠበብ ተጠብቋል።
  alternative: ‘የወንጌል እውነት’ ወይም ‘እውነት የሆነው’
  rationale: ዐውደ ንባቡ የወንጌልን እውነት ቢያካትትም፣ የግሪኩ አገላለጽ ከአንድ የተወሰነ የትምህርት ቀመር የሰፋ ነው። ስለዚህ ጽሑፉ ራሱ ያልገደበውን ትርጉም አልገደብንም።
- issue: በሁለተኛው አንቀጽ የተሰወረው ግስ እና የ‘ብቻ’ ሐሳብ
  choice: የታወቀው ግስ ‘እንችላለን’ ተገልጾ ተተርጉሟል፤ ‘ብቻ’ ግን በዋናው ጽሑፍ አልተጨመረም።
  alternative: ‘እውነትን ለመደገፍ ብቻ እንችላለን’
  rationale: ግሪኩ በሁለተኛው አንቀጽ ግሱን በአጭሩ ያስታውቃል፣ ነገር ግን ‘ብቻ’ የሚል ቃል የለውም። ስለዚህ የንፅፅሩ ኃይል ተጠብቆ ያልተጻፈ ገደብ አልተጨመረም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ‘በእውነት ላይ/ለእውነት’ አጭር ንፅፅር በተቻለ መጠን ተጠብቋል፤ የὑπέρ የድጋፍ ሐሳብ ደግሞ በእግር ማስታወሻ ግልጽ ተደርጓል።
