source:
  edition: SBLGNT
  text: διὰ τοῦτο ταῦτα ἀπὼν γράφω, ἵνα παρὼν μὴ ἀποτόμως χρήσωμαι κατὰ τὴν ἐξουσίαν ἣν ⸂ὁ κύριος ἔδωκέν μοι⸃, εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/010.yaml
  text: For this reason I write these things while absent[a], so that when present I may not have to act harshly[b], according to the authority that the Lord gave me for building up and not for tearing down.
translation:
  language: am
  text: 'ስለዚህ ከእናንተ ርቄ ሳለሁ እነዚህን ነገሮች እጽፋለሁ፤ በእናንተ ዘንድ በምገኝበት ጊዜ ጌታ በሰጠኝ ሥልጣን መሠረት በጥብቅ እንዳልሠራ[a] ነው። ይህ ሥልጣን ለማነጽ እንጂ ለማፍረስ[b] አይደለም።


    [a] ወይም፣ «ጥብቅነትን እንዳልጠቀም» ወይም «በሹል ሁኔታ እንዳላያዛችሁ።»


    [b] ወይም፣ «ለመገንባት እንጂ ለማፍረስ።» ግሪክኛው የግንባታ ምሳሌን ይጠቀማል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ጥብቅነትን እንዳልጠቀም» ወይም «በሹል ሁኔታ እንዳላያዛችሁ።»
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «ለመገንባት እንጂ ለማፍረስ።» ግሪክኛው የግንባታ ምሳሌን ይጠቀማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ስለዚህ
  rationale: ከቀደመው አውድ ጋር ያለውን ምክንያታዊና ውጤታዊ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ταῦτα
  choice: እነዚህን ነገሮች
  rationale: የግሪክኛውን ብዙ ቁጥር ጠብቆ የደብዳቤውን ይዘት ወይም ቀደም ሲል የተሰጡትን ማስጠንቀቂያዎች ያመለክታል።
- source_word: ἀπὼν
  choice: ከእናንተ ርቄ ሳለሁ
  rationale: ከπαρὼν ጋር ያለውን ንጽጽር በተፈጥሯዊ የጊዜ ሐረግ ይገልጻል፤ «ከእናንተ» የሚለው ከአውዱ የተገነዘበ ነው።
- source_word: γράφω
  choice: እጽፋለሁ
  rationale: የደብዳቤ አጻጻፍን ቀጥተኛነት የሚጠብቅ የአሁን ጊዜ አገላለጽ ነው።
- source_word: ἵνα
  choice: ይህም ... እንዳልሠራ ... ነው
  rationale: የዓላማውን ኃይል በተፈጥሯዊ የአማርኛ አወቃቀር ያሳያል።
- source_word: παρὼν
  choice: በመጣሁ ጊዜ
  rationale: ጳውሎስ በተቀባዮቹ ዘንድ በአካል መገኘቱን በግልጽና ተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: μὴ ἀποτόμως χρήσωμαι
  choice: በጥብቅ እንዳልሠራ
  rationale: ἀποτόμως የሚያሳየውን ጥብቅነት ወይም ሹል አያያዝ ያስተላልፋል፤ χράομαιን በአውዱ መሠረት እንደ አያያዝ ወይም እርምጃ ይገልጻል። ሌሎች ሊሆኑ የሚችሉ አተረጓጎሞች በማስታወሻው ተጠብቀዋል።
- source_word: κατὰ τὴν ἐξουσίαν
  choice: በ...ሥልጣን መሠረት
  rationale: κατά ከተሰጠው ሥልጣን ጋር መስማማትን ወይም በእሱ መሠረት መሥራትን ያሳያል።
- source_word: ὁ κύριος
  choice: ጌታ
  rationale: ማንነቱን ከዚህ ጥቅስ በላይ ሳይወስን የግሪክኛውን የክብር መጠሪያ ይጠብቃል።
- source_word: ἔδωκέν μοι
  choice: በሰጠኝ
  rationale: ጳውሎስ ሥልጣኑን ከጌታ እንደተቀበለ በቀጥታ ይገልጻል።
- source_word: εἰς οἰκοδομὴν
  choice: ለማነጽ
  rationale: የመገንባትን ምሳሌ እየጠበቀ መንፈሳዊና ማኅበረሰባዊ ማጠናከርን በተለመደ አማርኛ ያሳያል።
- source_word: καθαίρεσιν
  choice: ለማፍረስ
  rationale: ከοἰκοδομή ጋር ያለውን የግንባታ ምሳሌያዊ ንጽጽር በግልጽ ሁኔታ ይጠብቃል።
theological_decisions:
- issue: ጳውሎስ ሥልጣንን እንደሰጠው የተጠቀሰው «ጌታ» ማንነት
  choice: ጌታ
  alternative: በተለይ «ጌታ ኢየሱስ» ብሎ መግለጽ፣ ወይም በሰፊ መለኮታዊ ትርጉም መውሰድ
  rationale: ግሪክኛው ὁ κύριος ብቻ ይላል። ትርጉሙ ጥቅሱ በግልጽ ከሚናገረው በላይ ማንነቱን ሳይወስን «ጌታ» የሚለውን መጠሪያ ይጠብቃል።
- issue: የተሰጠው ሥልጣን ዓላማ
  choice: ለማነጽ እንጂ ለማፍረስ አይደለም
  alternative: ሥልጣኑ ለቅጣት ፈጽሞ አይውልም ብሎ መወሰን
  rationale: ጽሑፉ የሥልጣኑን ዓላማ በግንባታ ምሳሌ ያነጻጽራል፤ ይህን ንጽጽር ይጠብቃል እንጂ ጳውሎስ ጥብቅ እርምጃ ሊወስድ ይችል እንደሆነ በቅርብ አውድ ያለውን ውጥረት አያስወግድም።
