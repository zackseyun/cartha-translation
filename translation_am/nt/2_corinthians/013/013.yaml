id: 2CO.13.13
reference: 2 Corinthians 13:13
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἡ χάρις τοῦ κυρίου Ἰησοῦ Χριστοῦ καὶ ἡ ἀγάπη τοῦ θεοῦ καὶ ἡ κοινωνία τοῦ ἁγίου πνεύματος μετὰ πάντων ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/013.yaml
  text: The grace of the Lord Jesus Christ[a], and the love of God, and the fellowship of the Holy Spirit[b], be with all of you.
translation:
  language: am
  text: የጌታ ኢየሱስ መሲሕ[a] ጸጋ፣ የእግዚአብሔር ፍቅርና የመንፈስ ቅዱስ ኅብረት[b] ከሁላችሁ ጋር ይሁን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም በባህላዊው አጠራር፣ “ኢየሱስ ክርስቶስ።”
    reason: alternative_reading
  - marker: b
    text: ወይም “ከመንፈስ ቅዱስ ጋር ያለ አንድነት” ወይም “በመንፈስ ቅዱስ መካፈል።”
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: ጸጋ
  rationale: በጳውሎስ የቡራኬ ንግግር ውስጥ የተለመደውን ሰፊ መንፈሳዊ ትርጉም የሚያስተላልፍ የአማርኛ ቃል ነው።
- source_word: κυρίου
  choice: ጌታ
  rationale: እዚህ κύριος ለኢየሱስ የተሰጠ ማዕረግ ስለሆነ፣ ተፈጥሯዊና የተለመደው አቻ ቃል ነው።
- source_word: Ἰησοῦ Χριστοῦ
  choice: ኢየሱስ መሲሕ
  rationale: Ἰησοῦ እንደ ስም ተጽፏል፤ Χριστοῦ ደግሞ ‘የተቀባው’ የሚለውን ማዕረጋዊ ትርጉም ለማስጠበቅ ‘መሲሕ’ ተብሏል። ባህላዊው አጠራር በማስታወሻ ቀርቧል።
- source_word: ἀγάπη
  choice: ፍቅር
  rationale: በዚህ የቡራኬ አውድ ውስጥ ቀጥተኛ፣ የተፈጥሮና ሙሉ አቻ ቃል ነው።
- source_word: θεοῦ
  choice: እግዚአብሔር
  rationale: የግሪኩን ቀላል የባለቤትነት አገባብ ‘የእግዚአብሔር ፍቅር’ በማለት ይጠብቃል፤ ፍቅሩን ‘ለእናንተ’ ብሎ አይገድበውም።
- source_word: κοινωνία
  choice: ኅብረት
  rationale: ቃሉ አብሮነትን፣ መጋራትንና ተሳትፎን ሊያመለክት ይችላል፤ ‘ኅብረት’ ይህን ስፋት ሳያጠብ በቡራኬው ውስጥ ተፈጥሯዊ ነው።
- source_word: ἁγίου πνεύματος
  choice: መንፈስ ቅዱስ
  rationale: የመለኮታዊውን መንፈስ ስያሜ በዘመናዊ መደበኛ አማርኛ ያቀርባል።
- source_word: μετὰ πάντων ὑμῶν
  choice: ከሁላችሁ ጋር ይሁን
  rationale: μετά አብሮ መሆንን ያመለክታል፤ πάντων የሚገልጸው ሁሉን አካታችነት ‘ሁላችሁ’ በሚለው በግልጽ ተጠብቋል። በግሪኩ የታሰበው ግስ በአማርኛ ‘ይሁን’ ተብሎ ተሞልቷል።
theological_decisions:
- issue: የΧριστοῦ ማዕረጋዊ ትርጉም
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: Χριστός እዚህ ከኢየሱስ ጋር የተያያዘ ማዕረግ ነው። ‘መሲሕ’ ማዕረጉንና ‘የተቀባው’ የሚለውን ዳራ ያስጠብቃል፤ ባህላዊው ‘ክርስቶስ’ ግን በማስታወሻ ቀርቧል።
- issue: κοινωνία τοῦ ἁγίου πνεύματος የሚያመለክተው ግንኙነት
  choice: የመንፈስ ቅዱስ ኅብረት
  alternative: ከመንፈስ ቅዱስ ጋር ያለ አንድነት፤ በመንፈስ ቅዱስ መካፈል
  rationale: የግሪኩ የባለቤትነት አገባብ መንፈስ ቅዱስ የሚሰጠውን ኅብረት፣ ከእርሱ ጋር ያለን ኅብረት ወይም በእርሱ መካፈልን ሊያካትት ይችላል። ዋናው ጽሑፍ አንዱን ብቻ በመምረጥ ይህን የትርጉም ውጥረት አያጠፋም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ የቡራኬ አገላለጽ ተጠቅሟል። የግሪኩን ሦስት ተያያዥ ሐረጎች አወቃቀር ለማስጠበቅ ስሞቹ በትይዩ ቀርበዋል፤ በአማርኛ ተፈጥሯዊነት ምክንያት የመጨረሻው ማያያዣ ‘እና’ ከ‘ፍቅር’ ጋር ‘ፍቅርና’ ተብሎ ተዋህዷል።
