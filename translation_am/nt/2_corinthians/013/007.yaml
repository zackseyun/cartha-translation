base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/007.yaml
  text: We pray to God that you may do nothing wrong—not so that we may appear approved[a], but so that you may do what is right[c][b], even if we may seem disqualified.
translation:
  language: am
  text: እናንተ ምንም ክፉ ነገር[a] እንዳታደርጉ ወደ እግዚአብሔር እንጸልያለን፤ ይህም እኛ ብቁ ሆነን[b] እንድንታይ ሳይሆን፣ እናንተ መልካሙን እንድታደርጉ ነው፤ እኛ ግን ብቁ እንዳልሆንን ብንቆጠርም[c]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ምንም ክፉ እንዳታደርጉ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ተቀባይነት ያገኘን ሆነን” ወይም “እውነተኛ መሆናችን ተረጋግጦ።” የግሪኩ ቃል ተፈትኖ ብቁ ወይም ተቀባይነት ያገኘ መሆንን ያመለክታል።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “እኛ ግን ብቁ እንዳልሆንን ብንሆንም” ወይም “እንደ ብቁ ያልሆንን ብንሆንም።” የግሪኩ ቃል በ[b] ላይ ካለው “ብቁ” ከሚለው ቃል ጋር ተቃራኒ ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: εὐχόμεθα δὲ πρὸς τὸν θεόν
  choice: ወደ እግዚአብሔር እንጸልያለን
  rationale: εὔχομαι እዚህ የጸሎት ተግባርን፣ πρός ደግሞ ጸሎቱ ወደ እግዚአብሔር መቅረቡን ያመለክታሉ። δέ ቀላል አያያዥ ስለሆነ በአማርኛው የአረፍተ ነገሩ ፍሰት ውስጥ ተዋሕዷል።
- source_word: μὴ ποιῆσαι ὑμᾶς κακὸν μηδέν
  choice: እናንተ ምንም ክፉ ነገር እንዳታደርጉ
  rationale: ድርብ አሉታዊው ሐሳብ ምንም ዓይነት ክፉ ድርጊት እንዳይፈጸም የሚገልጽ ሲሆን፣ ይህ አባባል በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: οὐχ ἵνα ἡμεῖς δόκιμοι φανῶμεν
  choice: እኛ ፈተናውን ያለፍን ሆነን እንድንታይ ሳይሆን
  rationale: οὐχ ἵνα የተካደ ዓላማን ያሳያል፤ δόκιμοι ከመፈተንና ብቁ ሆኖ ከመገኘት ጋር የተያያዘ ሲሆን φανῶμεν ደግሞ ‘መታየትን’ ይገልጻል።
- source_word: ἵνα ὑμεῖς τὸ καλὸν ποιῆτε
  choice: እናንተ መልካሙን እንድታደርጉ
  rationale: τὸ καλόν በዚህ ሥነ ምግባራዊ አውድ ‘መልካሙን’ ማለት ሲሆን፣ ἵνα ከንዑስ አንቀጹ ጋር የዓላማን ሐሳብ ይጠብቃል።
- source_word: ἡμεῖς δὲ ὡς ἀδόκιμοι ὦμεν
  choice: እኛ ግን ፈተናውን እንዳላለፍን ሆነን ብንታይም
  rationale: ἀδόκιμοι ከδόκιμοι ጋር ተቃራኒ ሆኖ ‘ፈተናውን ያላለፉ/ተቀባይነት ያላገኙ’ የሚለውን ሐሳብ ይይዛል። ὡς ከቀደመው φανῶμεν ጋር በመያያዝ የመታየት ወይም እንደዚያ የመቆጠር ሐሳብ ሊሰጥ ይችላል።
theological_decisions:
- issue: ጳውሎስ ራሱን ὡς ἀδόκιμοι ብሎ የገለጸበት ትርጉም
  choice: እኛ ግን ፈተናውን እንዳላለፍን ሆነን ብንታይም
  alternative: እኛ ግን ፈተናውን እንዳላለፍን ብንሆንም
  rationale: የቅርቡ አውድ δόκιμοι እና ἀδόκιμοι የሚሉትን ተቃራኒ ቃላት ከፈተናና ከሚታየው ማረጋገጫ ጋር ያያይዛል። ዋናው ትርጉም ጳውሎስ በሰዎች ዓይን ፈተናውን እንዳላለፈ ሊታይ እንደሚችል ያቆያል፤ ይህንም ስለ መጨረሻ ፍርድ ወይም ዘላለማዊ ውድቀት ወደሚናገር የተለየ ትምህርት አይለውጠውም። ሆኖም የὡς አገላለጽ የሚፈቅደው አማራጭ በማስታወሻው ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። “ፈተናውን ያለፍን/እንዳላለፍን” የሚለው ጥንድ በግሪኩ δόκιμοι/ἀδόκιμοι መካከል ያለውን የቃላት ግንኙነት በተፈጥሯዊ አማርኛ ይጠብቃል።
