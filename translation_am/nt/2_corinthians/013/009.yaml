source:
  edition: SBLGNT
  text: χαίρομεν γὰρ ὅταν ἡμεῖς ἀσθενῶμεν, ὑμεῖς δὲ δυνατοὶ ἦτε· ⸀τοῦτο καὶ εὐχόμεθα, τὴν ὑμῶν κατάρτισιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/009.yaml
  text: 'For we rejoice when we are weak and you are strong[a]. And this also is what we pray for: your restoration.'
translation:
  language: am
  text: እኛ ደካሞች ስንሆን እናንተ ግን ብርቱዎች ስትሆኑ ደስ ይለናልና። ይህንንም እንጸልያለን፤ እንድትስተካከሉ[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “መብሰላችሁ፣” “ሙሉ መሆናችሁ፣” ወይም “መታጠቃችሁ።” የግሪኩ ቃል አንድ ነገር ወደ ትክክለኛ ሁኔታ መመለስን፣ መታጠቅን ወይም ወደ ሙሉነት መድረስን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρομεν
  choice: ደስ ይለናል
  rationale: የአሁን ጊዜውን የጳውሎስ ደስታ በተፈጥሯዊና በዘመናዊ አማርኛ ይገልጣል።
- source_word: γὰρ
  choice: -ና
  rationale: ከቀደመው አውድ ጋር ያለውን የማብራሪያ ግንኙነት በአማርኛ ተፈጥሯዊ በሆነ ድኅረ ቅጥያ ያሳያል።
- source_word: ὅταν
  choice: ስንሆን … ስትሆኑ
  rationale: ከንዑስ አንቀጹ ጋር ተዋሕዶ አጠቃላይ ጊዜያዊውን ‘ስንሆን/በሆንን ጊዜ’ ሐሳብ በተፈጥሯዊ አማርኛ ይሰጣል።
- source_word: ἀσθενῶμεν
  choice: ደካሞች ስንሆን
  rationale: አካላዊ፣ ማኅበራዊ ወይም የአቀራረብ ድካምን ሳይወስን ሰፊውን የግሪክ ቃል ትርጉም ይጠብቃል።
- source_word: δυνατοὶ ἦτε
  choice: ብርቱዎች ስትሆኑ
  rationale: ከ‘ደካሞች’ ጋር ያለውን ቀጥተኛ ንጽጽር ይጠብቃል፤ ኃያላን የሚለውን ከመምረጥ ይልቅ በዚህ አውድ ተፈጥሯዊ ነው።
- source_word: τοῦτο καὶ εὐχόμεθα
  choice: ደግሞም የምንጸልየው … ነው
  rationale: εὔχομαιን ‘እንጸልያለን’ በሚለው ሃይማኖታዊ አውድ ይተረጉማል፤ የግሪኩን አጽንዖትም በአማርኛ የትኩረት አወቃቀር ያቀርባል።
- source_word: κατάρτισιν
  choice: መታደሳችሁ
  rationale: በአውዱ የቆሮንቶስ ሰዎች ወደ ትክክለኛ ሁኔታ እንዲመለሱ ያለውን የእረኝነት ምኞት ይገልጣል፤ የመብሰልና የተሟላ መሆን አማራጮች በማስታወሻ ተጠብቀዋል።
theological_decisions:
- issue: የκατάρτισις ትርጉም ከጳውሎስ የእረኝነት ዓላማ ጋር ያለው ግንኙነት
  choice: መታደሳችሁ
  alternative: መብሰላችሁ ወይም የተሟላችሁ መሆን
  rationale: የተመረጠው ቃል የጉባኤውን ወደ ትክክለኛ ሁኔታ መመለስ የሚመኘውን አውዳዊ ሐሳብ ያሳያል፤ ነገር ግን ቃሉን የኃጢአት የሌለበት ፍጹምነት እንደሚያስተምር አይወስንም፣ ሌሎቹንም ሊሆኑ የሚችሉ ትርጉሞች አይደብቅም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የ‘ደካሞች/ብርቱዎች’ ንጽጽርና የγὰρ ማብራሪያዊ ኃይል ተጠብቀዋል።
