base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/001.yaml
  text: 'This is the third time I am coming to you: “Every matter will be established by the testimony of two witnesses or three.”[a][b]'
translation:
  language: am
  text: ይህ ወደ እናንተ የምመጣበት ሦስተኛ ጊዜ ነው፤ “ማንኛውም ጉዳይ በሁለት ወይም በሦስት ምስክሮች ምስክርነት ይረጋገጣል።”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ቃል ሁሉ በሁለት ወይም በሦስት ምስክሮች አፍ ይጸናል።” የግሪኩ አነጋገር ዘዳግም 19፥15ን በቅርብ የሚከተል ሕጋዊ ፈሊጥ ነው።
    reason: lexical_alternative
  - marker: b
    text: ዘዳግም 19፥15ን ይመልከቱ።
    reason: cross_reference
lexical_decisions:
- source_word: Τρίτον τοῦτο
  choice: ይህ ሦስተኛ ጊዜ ነው
  rationale: ገላጭ ሐረጉ ከἔρχομαι ጋር በተውሳካዊ አገልግሎት የመምጣቱን ሦስተኛ ጊዜነት ያመለክታል፤ ይህ አቀራረብ በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: ἔρχομαι πρὸς ὑμᾶς
  choice: ወደ እናንተ የምመጣው
  rationale: የግሪኩን የአሁን ጊዜ ቅርጽና በአውዱ ያለውን በቅርብ የሚፈጸም መምጣት ያለ ተጨማሪ ማብራሪያ ይጠብቃል።
- source_word: ἐπὶ στόματος
  choice: በ…ምስክርነት
  rationale: ቃል በቃል ‘በአፍ’ የሚለው በዘመናዊ አማርኛ ግልጽ አይደለም፤ በዘዳግም 19፥15 ያለውን ሕጋዊ ፈሊጥ ‘ምስክርነት’ በሚለው በትክክል ያስተላልፋል።
- source_word: δύο μαρτύρων καὶ τριῶν
  choice: በሁለት ምስክሮች ወይም በሦስት ምስክሮች
  rationale: በጥቅሱ ያለው καί የተከማቸ አምስት ምስክሮችን ሳይሆን ‘ሁለት ወይም ሦስት’ የሚለውን የተለመደ ሕጋዊ ቀመር ይወክላል። ስሙን መድገም የግሪኩን አወቃቀር እና ግልጽነት ይጠብቃል።
- source_word: σταθήσεται
  choice: ይረጋገጣል
  rationale: የἵστημι የወደፊት ተደራጊ ቅርጽ በሕጋዊ አውድ ‘የተረጋገጠ ይሆናል’ ማለት ነው፤ ‘ይረጋገጣል’ ተፈጥሯዊና ትክክለኛ ነው።
- source_word: πᾶν ῥῆμα
  choice: ማንኛውም ጉዳይ
  rationale: ῥῆμα ቃል ወይም ንግግር ሊሆን ቢችልም፣ በዚህ ሕጋዊ ጥቅስ ለምርመራ የቀረበን ጉዳይ ያመለክታል፤ ‘ጉዳይ’ ይህን ሳያጠብ በግልጽ ያስተላልፋል።
theological_decisions:
- issue: ጳውሎስ የዘዳግምን ሕጋዊ ጥቅስ በተግሣጽ አውድ መጠቀሙ
  choice: ጥቅሱ ማንኛውም ጉዳይ በምስክሮች እንደሚረጋገጥ የሚገልጽ ሰፊ ሕጋዊ መርሕ ሆኖ ተተርጉሟል።
  alternative: πᾶν ῥῆμαን ‘እያንዳንዱ ቃል’ ወይም በበለጠ ጠባብ መልኩ ‘እያንዳንዱ ክስ’ ብሎ መተርጎም።
  rationale: ግሪኩ የሕግ መርሕን ይጠቅሳል፤ ትርጉሙ በጽሑፉ ያልተገለጸን የቤተ ክርስቲያን ሥነ ሥርዓት ወይም ልዩ ዶክትሪን ሳያስገባ ሰፊውን የሕግ ኃይል ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። የሕግ ጥቅሱን ይዘት ለማሳየት ‘ምስክርነት’ እና ‘ይረጋገጣል’ ተመርጠዋል፤ ቃል በቃል አማራጭ ግን በማስታወሻ [a] ተጠብቋል።
