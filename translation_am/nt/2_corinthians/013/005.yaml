review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the two imperatives, the rhetorical question concerning the Messiah’s presence in the readers, and the test/approval wordplay. Its final sentence, however, expands the compact Greek exception (εἰ μήτι) into a more explanatory construction and weakens its rhetorical force. The revision retains the cautious ‘unless perhaps/indeed’ sense without adding an explanatory assertion.
  naturalness: The opening and the distinction between ፈትኑ and መርምሩ are clear modern standard Amharic. The wording ‘ይህ የማይሆነው … ብቻ ነው’ is cumbersome and less direct than the Greek. A short exception introduced by ‘በቀር’ is more natural in this rhetorical context.
  terminology: ኢየሱስ መሲሕ appropriately renders the title as ‘Jesus the Messiah.’ በእናንተ ውስጥ is a defensible primary rendering of ἐν ὑμῖν, and the supplied footnote adequately preserves the corporate alternative. ‘ፈተናውን ያላለፋችሁ’ naturally communicates ἀδόκιμοι without importing later theological terminology.
  issues:
  - severity: medium
    issue: The rendering of εἰ μήτι is unnecessarily expanded and syntactically indirect.
    rationale: ‘ይህ የማይሆነው … ብቻ ነው’ adds an explicit ‘this does not happen’ formulation not present in Greek. It also obscures the concise rhetorical exception. ‘ምናልባት … ከሆናችሁ በቀር’ preserves the exception and its slight softening.
  revised_text: በእምነት ውስጥ መሆናችሁን ለማወቅ ራሳችሁን ፈትኑ፤ ራሳችሁን መርምሩ። ወይስ ኢየሱስ መሲሕ በእናንተ ውስጥ እንዳለ[a] ስለ ራሳችሁ አታውቁምን?—ምናልባት ፈተናውን ያላለፋችሁ ከሆናችሁ በቀር።
