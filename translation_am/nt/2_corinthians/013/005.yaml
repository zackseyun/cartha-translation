base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/005.yaml
  text: Test yourselves to see whether you are in the faith[a]; examine yourselves[c][b]. Or do you not recognize that Jesus the Messiah is in you?—unless indeed you are disqualified.
translation:
  language: am
  text: በእምነት ውስጥ መሆናችሁን ለማወቅ ራሳችሁን ፈትኑ፤ ራሳችሁን መርምሩ። ወይስ ኢየሱስ መሲሕ በእናንተ ውስጥ እንዳለ[a] ስለ ራሳችሁ አታውቁምን?—ምናልባት ፈተናውን ያላለፋችሁ ከሆናችሁ በቀር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በመካከላችሁ እንዳለ።”
    reason: alternative_reading
lexical_decisions:
- source_word: πειράζετε
  choice: ፈትኑ
  rationale: በዚህ አውድ ግሱ መፈተን ወይም ወደ ኃጢአት መፈተንን ሳይሆን፣ እውነተኛነትን ለማረጋገጥ ራስን መፈተሽን ያመለክታል።
- source_word: ἐν τῇ πίστει
  choice: በእምነት ውስጥ
  rationale: የግሪኩን የተወሰነ አገላለጽና የክርስቲያናዊ እምነት ወሰን ወይም እውነተኛ የግል እምነት ሊሆን የሚችለውን ጥምር ፍቺ ይጠብቃል።
- source_word: δοκιμάζετε
  choice: መርምሩ
  rationale: ከፈትኑ ጋር ተቀራራቢ ቢሆንም፣ በጥንቃቄ መመርመርና ብቁነትን ማረጋገጥ የሚለውን ገጽታ ያሳያል።
- source_word: ἐπιγινώσκετε
  choice: አታውቁምን
  rationale: በአማርኛ የንግግር ዘይቤ ተፈጥሯዊ ሆኖ የግሪኩን ሙሉ ማወቅ ወይም መገንዘብ ያስተላልፋል።
- source_word: ἑαυτούς
  choice: ስለ ራሳችሁ
  rationale: በአገባቡ ከማወቅ ግስ ጋር የተያያዘውን ራስን የሚመለከት ኃይል ይጠብቃል።
- source_word: Ἰησοῦς Χριστός
  choice: ኢየሱስ መሲሕ
  rationale: Ἰησοῦς እንደ ስም በተለመደው መልኩ ተጽፏል፤ Χριστός ደግሞ በዚህ የእምነት ንግግር ውስጥ ማዕረጉን እንዲገልጥ ‘መሲሕ’ ተብሏል።
- source_word: ἐν ὑμῖν
  choice: በእናንተ ውስጥ
  rationale: የራስን መመርመር አውድ የመሲሑን በአማኞች ውስጥ መኖር ይደግፋል፤ የማኅበራዊው ፍቺ በግርጌ ማስታወሻ ተጠብቋል።
- source_word: εἰ μήτι
  choice: ይህ የማይሆነው … ከሆናችሁ ብቻ ነው
  rationale: የግሪኩን ልዩ ሁኔታ የሚያቀርብ አገላለጽ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀδόκιμοί
  choice: ፈተናውን ያላለፋችሁ
  rationale: ቃሉ በራስ-ፈተናው አውድ ብቁ ሆኖ አለመገኘትን ያመለክታል፤ ይህ አተረጓጎም ከጊዜ በኋላ የተጫኑ ሥነ-መለኮታዊ ፍቺዎችን አያስገባም።
theological_decisions:
- issue: የΧριστός አተረጓጎም
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: በዚህ አውድ ቃሉ እንደ ማዕረግ የእምነት ኃይል ስላለው፣ ትርጉሙን የሚገልጠው ‘መሲሕ’ ተመርጧል።
- issue: የἐν τῇ πίστει ፍቺ
  choice: በእምነት ውስጥ
  alternative: በእውነተኛ የግል እምነት / በክርስቲያናዊው እምነት ውስጥ
  rationale: ግሪኩ በክርስቲያናዊው እምነት መጽናትንም ሆነ እውነተኛ የግል እምነት መኖርን ሊያመለክት ስለሚችል፣ ትርጉሙ ውጥረቱን ሳይፈታ ጠብቆታል።
- issue: የἐν ὑμῖν ፍቺ
  choice: በእናንተ ውስጥ
  alternative: በመካከላችሁ
  rationale: አፋጣኙ የራስ-ምርመራ አውድ ‘በእናንተ ውስጥ’ የሚለውን ይደግፋል፤ የግሪኩ የማኅበር ፍቺ ግን በማስታወሻ ተጠብቋል።
- issue: የἀδόκιμοι ሥነ-መለኮታዊ ክብደት
  choice: ፈተናውን ያላለፋችሁ
  alternative: ውድቅ የሆናችሁ / ብቁ ሆናችሁ ያልተገኛችሁ
  rationale: በፈተናና ምርመራ ዙሪያ ያለውን የቃላት ግንኙነት ይጠብቃል፤ የመጨረሻ ፍርድን በግድ አይወስንም።
