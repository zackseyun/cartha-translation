  text: But I hope that you will know that we are not disqualified[a].
translation:
  language: am
  text: ነገር ግን እኛ በፈተና ውድቅ እንዳልሆንን[a] እንደምታውቁ ተስፋ አደርጋለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በፈተና ያልወደቅን።” የግሪኩ ቅጽል ቃል አንድ ሰው ከተፈተነ በኋላ ብቁ ሆኖ አለመገኘቱን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίζω
  choice: ተስፋ አደርጋለሁ
  rationale: የአሁን ጊዜ አንደኛ መደብ ነጠላ ግስ ሲሆን፣ ጳውሎስ ወደፊት የሚፈጸም ነገር እንደሚጠብቅ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከቀደመው ሐሳብ ጋር ያለውን መጠነኛ ንጽጽር በግልጽና በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: γνώσεσθε
  choice: እንደምታውቁ
  rationale: የወደፊት ጊዜውን መገንዘብ የሚያመለክተውን ግስ በአማርኛ የይዘት ንዑስ ሐረግ ውስጥ ተፈጥሯዊ በሆነ መንገድ ይገልጣል።
- source_word: ἡμεῖς
  choice: እኛ
  rationale: በግሪክ ጽሑፉ የተገለጸውን ተውላጠ ስምና መጠነኛ አጽንዖቱን ይጠብቃል።
- source_word: οὐκ ἐσμὲν
  choice: እንዳልሆንን
  rationale: ቀላሉን አሉታዊ አያያዥ ግስ ያለ ተጨማሪ ማጠናከሪያ ይተረጉማል።
- source_word: ἀδόκιμοι
  choice: ውድቅ
  rationale: በዐውደ ንባቡ ውስጥ ከመፈተንና ብቁ ሆኖ ከመገኘት ጋር የተያያዘውን የግምገማ ትርጉም በዘመናዊና ግልጽ አማርኛ ያስተላልፋል፤ በኋለኛው የሥነ መለኮት አጠቃቀም የተጫነ ቃል አያስገባም።
theological_decisions:
- issue: በፈተናና በሐዋርያዊ ብቃት ዐውድ ውስጥ ἀδόκιμοιን መተርጎም
  choice: ውድቅ እንዳልሆንን
  alternative: ፈተናውን እንዳልወደቅን
  rationale: ዋናው ንባብ ጳውሎስና አብረውት የሚሠሩት ሰዎች ሲመረመሩ ብቁ ሆነው እንደሚገኙ የሚጠቁመውን ግምገማዊ ኃይል ይጠብቃል። በተመሳሳይም ጽሑፉ በቀጥታ የማይናገረውን የዘላለማዊ ኩነኔ ወይም የድነት ሁኔታ አይጨምርም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። “ውድቅ” የፍርድ ወይም የዘላለማዊ ኩነኔ ልዩ የሥነ መለኮት ትርጉም ሳይጫንበት፣ በአቅራቢያው ዐውድ ያለውን የመፈተንና ብቁ ሆኖ የመገኘት ምስል ያስተላልፋል።
