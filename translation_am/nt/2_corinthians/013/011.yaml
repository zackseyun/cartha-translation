- source_word: τὸ αὐτὸ φρονεῖτε
  choice: አንድ አሳብ ይኑራችሁ
  rationale: ‘አንድን ነገር አስቡ’ የሚለውን ቃል በቃል ሐሳብ በተፈጥሯዊ የአማርኛ አገላለጽ ይይዛል።
- source_word: εἰρηνεύετε
  choice: በሰላም ኑሩ
  rationale: በጉባኤው ውስጥ ቀጣይነት ያለውን ሰላማዊ ኑሮ የሚጠይቀውን የአሁን ጊዜ ትእዛዝ በግልጽ ያስተላልፋል።
- source_word: ὁ θεὸς τῆς ἀγάπης καὶ εἰρήνης
