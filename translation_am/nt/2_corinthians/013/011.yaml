    text: “ወንድሞች” የሚለው እዚህ ለመላው ጉባኤ የቀረበ አድራሻ ሲሆን ወንዶችንና ሴቶችን ያካትታል።
    reason: cultural_note
  - marker: c
    text: የግሪኩ ቃል በደብዳቤ መዝጊያ “ደህና ሁኑ” የሚል የመሰናበቻ ሰላምታም ሊሆን ይችላል፤ እዚህ ግን ከሌሎቹ ትእዛዛት ጋር “ደስ ይበላችሁ” የሚለው ይበልጥ የተስማማ ነው።
    reason: lexical_alternative
  - marker: d
