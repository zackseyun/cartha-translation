  text: መሲሕ በእኔ እየተናገረ መሆኑን የሚያረጋግጥ ማስረጃ ስለምትፈልጉ፣ እርሱ ለእናንተ ደካማ አይደለም፤ ይልቁንም በእናንተ ውስጥ[a] ኃያል ነው።
