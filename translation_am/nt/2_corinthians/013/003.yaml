lexical_decisions:
- source_word: ἐπεὶ
  choice: ስለምትፈልጉ
  rationale: የሐረጉን ምክንያታዊ ግንኙነት በተፈጥሯዊ አማርኛ ከ ζητεῖτε ጋር በማዋሐድ ያሳያል።
- source_word: δοκιμήν
  choice: ማረጋገጫ
  rationale: በዚህ አውድ የፈተናውን ሂደት ሳይሆን አንድን ነገር የሚያፀድቅ ማስረጃ ወይም ማረጋገጫ ያመለክታል።
- source_word: ζητεῖτε
  choice: ምትፈልጉ
  rationale: የቆሮንቶስ ሰዎች ቀጣይነት ያለውን ጥያቄ በተፈጥሯዊ የአሁን ጊዜ አገላለጽ ያቀርባል።
- source_word: τοῦ ἐν ἐμοὶ λαλοῦντος Χριστοῦ
  choice: በእኔ ውስጥ የሚናገረው መሲሕ
  rationale: የግሪኩን ἐν ἐμοί ‘በእኔ ውስጥ’ በቅርብ ይጠብቃል፤ የማረጋገጫው ይዘትም በአማርኛ ግልጽ ይሆናል።
- source_word: Χριστοῦ
  choice: መሲሕ
  rationale: Χριστός በዚህ ስፍራ የቅቡዕነት ማዕረጉን ይዞ ስለቀረበ፣ ትርጉሙን የሚጠብቀው ‘መሲሕ’ ተመርጧል።
- source_word: εἰς ὑμᾶς
  choice: ለእናንተ
  rationale: ወደ ተቀባዮቹ ያለውን አቅጣጫዊና ግንኙነታዊ ኃይል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οὐκ ἀσθενεῖ
  choice: ደካማ አይደለም
  rationale: ከ δυνατεῖ ጋር ያለውን የድካምና የኃይል ተቃርኖ በግልጽ ይጠብቃል።
- source_word: ἀλλὰ δυνατεῖ
  choice: ይልቁንም … ኃያል ነው
  rationale: ያልተለመደውን δυνατέω በኃይል ቃል በመተርጎም ከ‘ደካማ’ ጋር ያለውን ቀጥተኛ ተቃርኖ ይጠብቃል።
- source_word: ἐν ὑμῖν
  choice: በእናንተ ውስጥ
  rationale: የግሪኩን ἐν በቀጥታ ይወክላል፤ ብዙ ተቀባዮችን የሚያመለክተው ሐረግ ውስጣዊም ሆነ ማኅበራዊ አንብቦትን ክፍት ያደርጋል።
theological_decisions:
- issue: የ Χριστοῦ አተረጓጎም
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: ቃሉ እዚህ የማዕረግ ኃይሉን ይዞ ስለሚታይ፣ ‘መሲሕ’ የቅቡዕነቱን ትርጉም ይጠብቃል።
- issue: የ ἐν ἐμοί እና ἐν ὑμῖν ኃይል
  choice: ‘በእኔ ውስጥ የሚናገረው’ እና ‘በእናንተ ውስጥ ኃያል’
  alternative: ‘በእኔ በኩል የሚናገረው’ እና/ወይም ‘በመካከላችሁ ኃያል’
  rationale: ዋናው ጽሑፍ ἐνን በቅርብ ይጠብቃል፤ የመሲሑ ንግግር በጳውሎስ ውስጥ መሆኑን ወይም በእርሱ በኩል መሆኑን፣ እንዲሁም ኃይሉ በአማኞቹ ውስጥ ወይም በጉባኤያቸው መካከል መታየቱን አስመልክቶ ያለውን የትርጉም ውጥረት በግድ አይፈታም።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። ‘ደካማ/ኃያል’ የሚለው ተቃርኖ የአውዱን ሥነ-መለኮታዊ ውጥረት ይጠብቃል።
