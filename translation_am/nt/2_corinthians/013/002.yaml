lexical_decisions:
- source_word: προείρηκα
  choice: አስቀድሜ ተናግሬአለሁ
  rationale: የግሪክኛውን ፍጹም ጊዜ፣ ማለትም ቀድሞ የተነገረው አሁንም ኃይል እንዳለው፣ ይጠብቃል፤ “አስጠንቅቄአለሁ” በማለት አውዳዊውን የማስጠንቀቂያ ስሜት በቃሉ ላይ አይጭንም።
- source_word: προλέγω
  choice: አስቀድሜ እላለሁ
  rationale: ቃሉን በቀጥታ “አስቀድሞ መናገር” ብሎ ያቀርባል፤ ከπροείρηκα ጋር ያለውን የቃል ቅርርብም ይጠብቃል።
- source_word: ὡς παρὼν τὸ δεύτερον καὶ ἀπὼν νῦν
  choice: ለሁለተኛ ጊዜ በእናንተ ዘንድ በነበርሁ ጊዜ እንዳልሁት፣ አሁንም ከእናንተ ርቄ ሳለሁ
  rationale: የግሪክኛውን አጭርና የታመቀ ንጽጽር በተፈጥሯዊ አማርኛ ያብራራል፤ በሁለተኛው ጉብኝት መገኘቱንና አሁን መራቁን ያነጻጽራል።
- source_word: τοῖς προημαρτηκόσιν
  choice: ቀድሞ ኃጢአት ለሠሩት
  rationale: ቀደም ሲል ኃጢአት የሠሩትን ይለያል፤ ንስሐ ገብተው እንደሆነ ወይም እንዳልሆነ በትርጉሙ አይወስንም።
- source_word: τοῖς λοιποῖς πᾶσιν
  choice: ለቀሩት ሁሉ
  rationale: ከቀድሞ ኃጢአት ከሠሩት ውጭ ያሉትን ሁሉ የሚያካትተውን ሰፊ ወሰን ይጠብቃል።
- source_word: ἐὰν ἔλθω εἰς τὸ πάλιν
  choice: እንደገና ብመጣ
  rationale: የግሪክኛውን ቀጥተኛ አገላለጽ በተፈጥሯዊ አማርኛ ያቀርባል፤ “ለሦስተኛ ጊዜ” የሚለው አውዳዊ ማብራሪያ በማስታወሻ ተቀምጧል።
- source_word: οὐ φείσομαι
  choice: አልራራላቸውም
  rationale: ከጥብቅ እርምጃ አለመቆጠብን በተለመደና ግልጽ አማርኛ ይገልጣል፤ በአውዱ የተጠቀሱትን ሰዎች የሚያመለክተው ተውላጠ ስም ተጨምሯል።
theological_decisions:
- issue: የጳውሎስ የጥብቅ እርምጃ ማስጠንቀቂያ ወሰን
  choice: ማስጠንቀቂያው ቀድሞ ኃጢአት የሠሩትንም ቀሪዎቹንም ሁሉ ያነጋግራል፤ ጳውሎስ ተመልሶ ቢመጣ ከጥብቅ እርምጃ እንደማይቆጠብ ይናገራል።
  alternative: ማስጠንቀቂያው ቀድሞ ኃጢአት የሠሩትን ብቻ ያመለክታል፣ ወይም የተወሰነ የቤተ ክርስቲያን ቅጣት ሳይገለጽ አጠቃላይ ሐዋርያዊ ጥብቅነትን ያመለክታል።
  rationale: ሰዋሰዋዊው አወቃቀር “ቀድሞ ኃጢአት ለሠሩትና ለቀሩት ሁሉ” ብሎ ሁለቱንም ወገኖች ያነጋግራል። ትርጉሙ የእርምጃውን ዓይነት በተወሰነ የቤተ ክርስቲያን ሥርዓት አይገድብም።
