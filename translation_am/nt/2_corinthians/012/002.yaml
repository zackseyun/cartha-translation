- source_word: ἕως τρίτου οὐρανοῦ
  choice: እስከ ሦስተኛው ሰማይ ድረስ
  rationale: የἕωςን ወሰን በግልጽ ያሳያል፣ የጥንቱን ‘ሦስተኛው ሰማይ’ አገላለጽም ሳይተረጉም ይጠብቃል።
theological_decisions:
- issue: ἐν Χριστῷ የሚለውን ሐረግ መተርጎም
  choice: በመሲሕ የሆነ
