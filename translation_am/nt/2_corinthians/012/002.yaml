  rationale: ምንጩ ‘አላውቅም’ የሚለውን ሁለት ጊዜ ይደግማል፣ ዕውቀቱንም ለእግዚአብሔር ይተዋል፤ ስለዚህ ትርጉሙ ይህን ያልተፈታ ውጥረት አይወስንም።
- issue: ‘ሦስተኛው ሰማይ’ የሚለውን አገላለጽ ማቆየት
  choice: ሦስተኛው ሰማይ
  alternative: ከፍተኛው ሰማይ ወይም ገነት
  rationale: ጽሑፉ የጥንቱን የአይሁድ የዓለም አወቃቀር አገላለጽ ይጠቀማል፤ ትርጉሙ ይህን ምስል ከመተርጎም ይልቅ እንዳለ ያቆየዋል።
