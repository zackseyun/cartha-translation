base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/002.yaml
  text: I know a man in Messiah who[a], fourteen years ago—whether in the body I do not know, or outside the body I do not know[c][b], God knows—was caught up to the third heaven.
translation:
  language: am
  text: ከአሥራ አራት ዓመት በፊት በመሲሕ[a] ያለ አንድ ሰው አውቃለሁ። ይህ ሰው በሰውነት ሆኖ እንደነበር አላውቅም፤ ወይም ከሰውነት ውጭ ሆኖ እንደነበር አላውቅም—እግዚአብሔር ያውቃል[b]—እስከ ሦስተኛው ሰማይ[c] ድረስ ተነጠቀ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም በባህላዊው አጠራር፣ “በክርስቶስ።” የግሪኩ ሐረግ ἐν Χριστῷ ነው፤ እዚህ “መሲሕ” ተብሎ የተተረጎመው የማዕረጉን ትርጉም ለማቆየት ነው።
    reason: alternative_reading
  - marker: b
    text: ጳውሎስ ይህ ነገር በሰውነት ወይም ከሰውነት ውጭ እንደተፈጸመ በግልጽ አይወስንም፤ ጽሑፉ የተሞክሮውን ሁኔታ ያልተፈታ አድርጎ ይተወዋል።
    reason: lexical_alternative
  - marker: c
    text: “ሦስተኛው ሰማይ” የሚለው ሐረግ የጥንታዊ የአይሁድ የአጽናፈ ዓለም አመለካከት ቋንቋን ያንጸባርቃል፤ ትርጉሙ ሐረጉን ከመፍታት ይልቅ እንዳለ አቆይቶታል።
    reason: cultural_note
