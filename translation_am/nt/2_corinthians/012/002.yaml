- source_word: πρὸ ἐτῶν δεκατεσσάρων
  choice: ከአሥራ አራት ዓመት በፊት
  rationale: የግሪኩን የጊዜ ሐረግ በግልጽና ተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
