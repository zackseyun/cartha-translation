base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/014.yaml
  text: Look, this is the third time I am ready to come to you, and I will not be a burden to you. For I do not seek what is yours, but you. For children are not obligated to store up for their parents, but parents for their children.
translation:
  language: am
  text: እነሆ፣ ይህን ሦስተኛ ጊዜ ወደ እናንተ ለመምጣት ዝግጁ ነኝ[a]፤ በእናንተም ላይ ሸክም አልሆንም[b]። የምፈልገው ያላችሁን ሳይሆን እናንተን ነውና። ልጆች ለወላጆቻቸው ሀብት ማከማቸት አይገባቸውም፤ ወላጆች ግን ለልጆቻቸው ማከማቸት ይገባቸዋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “ይህን ሦስተኛ ጊዜ ወደ እናንተ ለመምጣት ዝግጁ ነኝ።”
    reason: lexical_alternative
  - marker: b
    text: እዚህ የተተረጎመው ግስ በአንድ ሰው ላይ፣ በተለይም በገንዘብ ረገድ፣ ጫና ማድረግን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: እነሆ
  rationale: የጽሑፉን ትኩረት ጠሪ ኃይል በክብር ያለውና ለዘመናዊ አማርኛ አንባቢ የሚታወቅ ቃል ይገልጣል።
- source_word: τρίτον τοῦτο ἑτοίμως ἔχω ἐλθεῖν
  choice: ይህን ሦስተኛ ጊዜ ወደ እናንተ ለመምጣት ዝግጁ ነኝ
  rationale: የግሪኩን የአሁን ዝግጁነትና ‘ሦስተኛ’ የሚለውን አገላለጽ ይጠብቃል፤ ሁለት ቀደምት ጉብኝቶች በእርግጥ ተፈጽመዋል ብሎ አይወስንም።
- source_word: καταναρκήσω
  choice: ሸክምም አልሆንባችሁም
  rationale: በዐውዱ ያለውን ቁሳዊ ወይም ገንዘባዊ ጫና ሳያጠብ ተፈጥሯዊ በሆነ አማርኛ ያቀርባል።
- source_word: ζητῶ τὰ ὑμῶν ἀλλὰ ὑμᾶς
  choice: የምፈልገው እናንተን እንጂ ያላችሁን አይደለም
  rationale: በሰዎቹና በንብረታቸው መካከል ያለውን ተቃርኖ በግልጽና ተፈጥሯዊ አገላለጽ ይጠብቃል።
- source_word: ὀφείλει
  choice: አይገባቸውም / ይገባቸዋል
  rationale: የግዴታን ወይም የተገቢነትን ስሜት በዘመናዊ አማርኛ በቀጥታ ያስተላልፋል።
- source_word: θησαυρίζειν
  choice: ሀብት ማከማቸት
  rationale: የ‘መዝገብ/ሀብት ማከማቸት’ መሠረታዊ ምስልን በመጠበቅ የቤተሰብ ድጋፍ ዐውድን ግልጽ ያደርጋል።
- source_word: γονεῦσιν / γονεῖς; τέκνα / τέκνοις
  choice: ወላጆች; ልጆች
  rationale: ሁለቱም የግሪክ ቃላት ጾታን የማይለዩ አጠቃላይ የቤተሰብ ቃላት ስለሆኑ ትክክለኛ አቻዎች ናቸው።
theological_decisions:
- issue: የጳውሎስ ‘ሦስተኛ ጊዜ’ አገላለጽ
  choice: ‘ይህን ሦስተኛ ጊዜ ... ዝግጁ ነኝ’ ተብሎ የአሁኑ ዝግጁነት ተጠብቋል።
  alternative: ‘ለሦስተኛ ጊዜ እመጣለሁ’ ብሎ ሁለት የተፈጸሙ ቀደምት ጉብኝቶችን በግልጽ መወሰን።
  rationale: የግሪክ አገላለጽ ሦስተኛውን ዝግጁነት ወይም የታሰበውን ጉብኝት ያጎላል፤ ጥቅሱ ራሱ ከሚለው በላይ የጉዞ ታሪኩን አልተወሰነም።
- issue: ‘ሸክም’ የሚለው ዓይነት
  choice: በዋናው ጽሑፍ ሰፊው አገላለጽ ተጠብቆ የገንዘብ ፍቺው በማስታወሻ ተገልጧል።
  alternative: ‘የገንዘብ ሸክም አልሆንባችሁም’ ብሎ በዋናው ጽሑፍ ፍቺውን ማጥበብ።
  rationale: ዐውዱ ቁሳዊ ድጋፍን ያመለክታል፣ ሆኖም ግስ ሰፊ የሆነውን ‘መጫን’ ስሜትም ሊይዝ ይችላል።
