  text: ⸀Πάλαι δοκεῖτε ὅτι ὑμῖν ἀπολογούμεθα; ⸀κατέναντι θεοῦ ἐν Χριστῷ λαλοῦμεν. τὰ δὲ πάντα, ἀγαπητοί, ὑπὲρ τῆς ὑμῶν οἰκοδομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/019.yaml
  text: Have you been thinking all along that we are defending ourselves to you? Before God[a], in Messiah, we are speaking. And everything, beloved[b], is for your building up.
translation:
  language: am
  text: እስካሁን ድረስ ለእናንተ ራሳችንን እየተከላከልን ነው ብላችሁ ስታስቡ ነበርን? በእግዚአብሔር ፊት፣ በመሲሑ[a] ውስጥ እንናገራለን። ውዶች ሆይ፣ ነገር ሁሉ እናንተን ለማነጽ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በክርስቶስ ውስጥ»።
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλαι
  choice: ይህን ሁሉ ጊዜ … ኖራችኋል
  rationale: ቃሉ እዚህ ላይ በሩቅ ዘመን የተፈጸመን ነገር ሳይሆን እስከአሁን የቀጠለን ግምት ያመለክታል፤ ይህ አባባል ያንን ቀጣይነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: δοκεῖτε
  choice: ስታስቡ ኖራችኋልን?
  rationale: የአንባቢዎቹን እስከዚያ ጊዜ የቆየ ግምት በጥያቄ መልክ ይገልጣል።
- source_word: ἀπολογούμεθα
  choice: ራሳችንን እየተከላከልን
  rationale: የግስ ቅርጹ ራስን ማስረዳትን ወይም ራስን መከላከልን ያመለክታል፤ ምርጫው የፍርድ ነክ ጥላውን በግልጽ ዘመናዊ ቋንቋ ይጠብቃል።
- source_word: κατέναντι θεοῦ
  choice: በእግዚአብሔር ፊት
  rationale: ንግግሩ በእግዚአብሔር መገኘትና በእርሱ ፊት ባለ ተጠያቂነት እንደሚደረግ ያሳያል።
- source_word: ἐν Χριστῷ
  choice: በመሲሑ ሆነን
  rationale: Χριστός እዚህ የማዕረግ ኃይሉን ይዞ ስለሚታይ ‘መሲሕ’ ተብሎ ተተርጉሟል፤ ‘ሆነን’ ደግሞ በመሲሑ ውስጥ ያለውን ኅብረት ወደ መሣሪያዊ ትርጉም እንዳያጠብ ይረዳል።
- source_word: λαλοῦμεν
  choice: እንናገራለን
  rationale: የአሁን ጊዜውን ቀጥተኛና ሕያው የንግግር ኃይል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: τὰ δὲ πάντα
  choice: ነገር ሁሉ
  rationale: የጳውሎስን ንግግርና አገልግሎት በአጠቃላይ ያመለክታል፤ δέ የሚያሳየው ቀላል ሽግግር በአማርኛው የአረፍተ ነገር ቅደም ተከተል በተፈጥሮ ተገልጧል።
- source_word: ἀγαπητοί
  choice: ውዶቼ ሆይ
  rationale: የፍቅር ጥሪውን በዘመናዊ፣ ክብር ባለውና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὑπὲρ τῆς ὑμῶν οἰκοδομῆς
  choice: እናንተን ለማነጽ
  rationale: οἰκοδομή የመገንባትን ምሳሌያዊ ምስል ይጠብቃል፤ የተመረጠው አገላለጽ መንፈሳዊ ማጠናከርን በቀላሉ ያስገነዝባል።
theological_decisions:
- issue: የΧριστῷ አተረጓጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: በዚህ ሐረግ Χριστός እንደ ስም ብቻ ሳይሆን ‘የተቀባው’ የሚለውን የማዕረግ ትርጉም ይዟል፤ ስለዚህ ‘መሲሑ’ ተመርጧል።
- issue: ἐν Χριστῷ የሚያመለክተው ግንኙነት
  choice: በመሲሑ ሆነን
  alternative: በመሲሑ
  rationale: ይህ አገላለጽ ንግግሩ በመሲሑ ጋር ባለ ኅብረት ውስጥ እንደሚደረግ ያሳያል፤ መሲሑን እንደ መሣሪያ ብቻ አያቀርብም።
translation_notes:
  register: ዘመናዊ መደበኛ አማርኛ፤ ቀጥተኛው የክርክር ቃና፣ በእግዚአብሔር ፊት ያለው ክብደትና የፍቅር ጥሪው ተጠብቀዋል። የግሪክ አረፍተ ነገሮች አጭርና ጠንካራ ሆነው እንዲሰሙ ሦስት ክፍሎች ተጠብቀዋል።
