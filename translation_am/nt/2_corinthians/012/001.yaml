id: 2CO.12.1
reference: 2 Corinthians 12:1
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Καυχᾶσθαι ⸀δεῖ· οὐ ⸂συμφέρον μέν⸃, ἐλεύσομαι ⸀δὲ εἰς ὀπτασίας καὶ ἀποκαλύψεις κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/001.yaml
  text: Boasting is necessary[a], though it is not beneficial[b]; but I will go on to visions and revelations of the Lord.
translation:
  language: am
  text: መመካት ያስፈልጋል፤ ጠቃሚ ግን አይደለም[b]፤ ሆኖም ወደ ጌታ ራእዮችና መገለጦች[a] እሸጋገራለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ከጌታ የሆኑ ራእዮችና መገለጦች»። የግሪኩ ጄኒቲቭ ጌታን እንደ ምንጭ ሊያመለክት ይችላል፤ «የጌታ» ግን የግሪኩን አገላለጽና አሻሚነት ይበልጥ ይጠብቃል።
    reason: alternative_reading
  - marker: b
    text: ወይም የአረፍተ ነገሩን ግንኙነት፣ «መመካት ያስፈልጋል—ጠቃሚ ባይሆንም—ሆኖም ወደ … እሸጋገራለሁ» ብሎ መረዳት ይቻላል።
    reason: previous_rendering
lexical_decisions:
- source_word: Καυχᾶσθαι
  choice: መመካት
  rationale: የአሁን ጊዜው መካከለኛ አንቀጽ እዚህ እንደ ስም ያገለግላል፤ «መመካት» የድርጊቱን ሐሳብ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: δεῖ
  choice: ያስፈልጋል
  rationale: አስፈላጊነትን በግልጽና በዘመናዊ አማርኛ ይገልጣል፤ ግዴታውንም አያዳክምም።
- source_word: οὐ συμφέρον μέν
  choice: ጠቃሚ ግን አይደለም
  rationale: συμφέρον ጥቅም ወይም በጎ ውጤት ያለውን ያመለክታል፤ «ጠቃሚ» ለዘመናዊ አንባቢ ቀጥተኛ ነው፣ «ግን»ም የμένን የንጽጽር ተግባር ያሳያል።
- source_word: ἐλεύσομαι δὲ
  choice: ሆኖም … እሸጋገራለሁ
  rationale: በዚህ ዐውድ ወደ ሌላ የንግግር ርዕስ መሄድን ያመለክታል፤ «እሸጋገራለሁ» ይህን በተፈጥሯዊ አማርኛ ያቀርባል፣ «ሆኖም»ም የδέን ንጽጽር ይጠብቃል።
- source_word: εἰς ὀπτασίας
  choice: ወደ … ራእዮች
  rationale: ὀπτασία ከተፈጥሮ በላይ የሆነ የማየት ልምምድን ወይም ራእይን ያመለክታል፤ «ራእዮች» ተለምዶ የሚገባና ብዙ ቁጥሩን የሚጠብቅ ነው።
- source_word: καὶ ἀποκαλύψεις
  choice: እና መገለጦች
  rationale: ἀποκάλυψις የተሰወረ ነገር መገለጥን ያመለክታል፤ «መገለጦች» በዚህ ሃይማኖታዊ ዐውድ የተለመደና ግልጽ ነው።
- source_word: κυρίου
  choice: የጌታ
  rationale: የግሪኩን ጄኒቲቭ ግንኙነት በቀጥታ ይጠብቃል፤ ራእዮቹና መገለጦቹ ከጌታ የመጡ መሆናቸውን ወይም ከጌታ ጋር መዛመዳቸውን በግድ አይለይም።
theological_decisions:
- issue: የκυρίου ከ«ራእዮችና መገለጦች» ጋር ያለው ግንኙነት
  choice: የጌታ ራእዮችና መገለጦች
  alternative: ከጌታ የሆኑ ራእዮችና መገለጦች
  rationale: ጄኒቲቩ ምንጭን፣ ባለቤትነትን ወይም አጠቃላይ ዝምድናን ሊያመለክት ይችላል። «የጌታ» የሚለው አገላለጽ የግሪኩን ሥነ መለኮታዊ ጥንቃቄና አሻሚነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ራእዮች» እና «መገለጦች» በመጽሐፍ ቅዱሳዊ ዐውድ የታወቁ ቃላት ሲሆኑ፣ «እሸጋገራለሁ» የጳውሎስን ወደ አዲስ ርዕስ መሄድ በተፈጥሯዊ ንግግር ያሳያል።
