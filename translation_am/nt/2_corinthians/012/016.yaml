- source_word: κατεβάρησα
  choice: ሸክም አልሆንኩባችሁም
  rationale: ቃሉ በቀጥታ ማክበድን ያመለክታል፤ በዐውደ ንባቡ ግን በተለይ ቁሳዊ ወይም ገንዘባዊ ጫና አለመጫንን ያሳያል። ‘ሸክም መሆን’ ምሳሌያዊነቱንና ዐውደ ንባቡን ይጠብቃል።
