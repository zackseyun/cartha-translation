theological_decisions:
- issue: ከἀλλὰ በኋላ ያለው ንግግር የጳውሎስ እውነተኛ ኑዛዜ ነው ወይስ በምጸት የደገመው ክስ?
  choice: ዋናው ጽሑፍ ‘ተንኮለኛ ሆኜ፣ በማታለል ያዝኳችሁ’ ብሎ የግሪኩን ቀጥተኛ ቅርጽና የክሱን ኃይል ይጠብቃል፤ ምጸታዊነቱ በማስታወሻ ይገለጣል።
  alternative: ‘እኔ ተንኮለኛ ስለነበርኩ በማታለል ተጠቀምኩባችሁ’ ብሎ እንደ ቀጥተኛ ኑዛዜ መተርጎም፣ ወይም በዋናው ጽሑፍ ‘እንደሚሉት’ በማከል ምጸቱን ግልጽ ማድረግ።
  rationale: በአቅራቢያው ዐውደ ንባብ ጳውሎስ ቆሮንቶስን እንዳልበዘበዘ ይክዳል፤ ስለዚህ ንግግሩ በእርሱ ላይ የቀረበን ክስ በምጸት የሚደግም መሆኑ የበለጠ ይመስላል። ሆኖም ትርጉሙ ይህን በዋናው ጽሑፍ በማብራራት የንግግሩን ውጥረት አያጠፋም።
