review_pass:
  verdict: revise
  source_fidelity: The draft correctly recognizes that the μή-clause continues the fear expressed in v.20 and retains the three distinct vice terms. However, እንዳላዝን means “that I may not mourn,” reversing the sense of πενθήσω (“I will/may mourn”) within the feared outcome.
  naturalness: Most wording is understandable modern standard Amharic, but the final negative clause produces an unnatural and semantically contradictory sequence. Recasting the participial descriptions directly before ብዙዎችን makes the object of mourning clear and fluent.
  terminology: ርኩሰት, ዝሙት, and ብልግና preserve the distinct, overlapping moral terms without imposing a narrow interpretation. የእፍረት ገደብ የሌለው is explanatory and may be omitted because ብልግና naturally conveys the shameless, unrestrained sense in this register.
  issues:
  - severity: high
    issue: The phrase እንዳላዝን is negative.
    rationale: It states that Paul fears he will not mourn, whereas πενθήσω states that he will mourn. The negative ላ must be removed.
  - severity: medium
    issue: The relationship of the unrepentance and the three sins is syntactically obscured.
    rationale: Placing ስለሠሩት before the vice list and ንስሐ ባለመግባታቸው afterward is possible but cumbersome. A relative clause, “ስለ... ንስሐ ያልገቡ,” clearly represents μὴ μετανοησάντων ἐπὶ.
  revised_text: እንደገና ስመጣ፣ አምላኬ በእናንተ ፊት ዝቅ እንዳያደርገኝ፣ ከዚህ በፊት ኃጢአት የሠሩና ስለሠሩት ርኩሰት፣ ዝሙትና ብልግና ንስሐ ያልገቡ ብዙዎችን እንዳዝን እፈራለሁ።
  revised_footnotes:
  - marker: a
    text: ወይም፣ “አምላኬ በመካከላችሁ እንዳያዋርደኝ።” የግሪኩ ግስ “ዝቅ ማድረግ፣ ዝቅ ማሰኘት” ወይም እንደ ዐውዱ “ማዋረድ” ሊል ይችላል።
    reason: lexical_alternative
  revision_rationale: The revision corrects the reversed negation of the mourning clause, retains the continuation of Paul’s fear from the preceding verse, and makes the Greek participial sequence clear in natural Amharic. It also retains a single lexical footnote for ταπεινόω without adding interpretive material.
