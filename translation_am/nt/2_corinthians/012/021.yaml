  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: μὴ πάλιν ⸂ἐλθόντος μου⸃ ⸀ταπεινώσῃ ⸀με ὁ θεός μου πρὸς ὑμᾶς, καὶ πενθήσω πολλοὺς τῶν προημαρτηκότων καὶ μὴ μετανοησάντων ἐπὶ τῇ ἀκαθαρσίᾳ καὶ πορνείᾳ καὶ ἀσελγείᾳ ᾗ ἔπραξαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/021.yaml
  text: I fear that when I come again[a], my God may humble me before you[d][c][b], and I will mourn over many who have sinned before and have not repented of the impurity and sexual immorality and sensuality that they practiced.
translation:
  language: am
  text: እንደገና ስመጣ፣ አምላኬ በእናንተ ፊት ዝቅ እንዳያደርገኝ፣ ከዚህ በፊት ኃጢአት የሠሩና ስለሠሩት ርኩሰት፣ ዝሙትና ብልግና ንስሐ ያልገቡ ብዙዎችን እንዳዝን እፈራለሁ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ πάλιν ἐλθόντος μου
  choice: እንደገና ስመጣ ... እንዳይ... እፈራለሁ
  rationale: የቁጥር 20ን የፍርሃት አገባብ በአማርኛ ግልጽ ለማድረግ የተዘዋዋሪ አሉታዊ ሐረግ ተጠቅሟል፤ πάλιν ደግሞ ‘እንደገና’ ተብሏል።
- source_word: ταπεινώσῃ με ὁ θεός μου πρὸς ὑμᾶς
  choice: አምላኬ በእናንተ ፊት ዝቅ እንዳያደርገኝ
  rationale: ταπεινόω የሚያመለክተውን ዝቅ መደረግ ጠብቆ፣ πρὸς ὑμᾶςን በቆሮንቶሳውያን ፊት ወይም በመካከላቸው የሚፈጸም ነገር አድርጎ ያቀርባል።
- source_word: πενθήσω
  choice: እንዳላዝን
  rationale: πενθέω የሚያሳየውን ከባድ ሐዘን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: πολλοὺς τῶν προημαρτηκότων
  choice: ከዚህም በፊት ኃጢአት ከሠሩት ብዙዎች መካከል
  rationale: የግሪኩን ክፍላዊ አገባብ ‘ብዙዎች ከ...’ ጠብቆ፣ προημαρτηκότων የቀደመ ኃጢአትንና አሁንም ያለውን ጉዳዩን ያሳያል።
- source_word: μὴ μετανοησάντων
  choice: ንስሐ ባለመግባታቸው
  rationale: ቀድሞ ኃጢአት የሠሩት ሰዎች እስከ ጳውሎስ መምጣት ድረስ ንስሐ እንዳልገቡ ያመለክታል።
- source_word: ἀκαθαρσίᾳ
  choice: ርኩሰት
  rationale: ሰፊውን የሥነ ምግባር ንጽሕና ማጣት በአጭርና በተለመደ ቃል ይገልጣል።
- source_word: πορνείᾳ
  choice: ዝሙት
  rationale: πορνείαን በዘመናዊ አማርኛ የሚወክል የተለመደ ሰፊ የፆታ ብልሹነት ቃል ነው።
- source_word: ἀσελγείᾳ
  choice: የእፍረት ገደብ የሌለው ብልግና
  rationale: ἀσέλγεια ያለውን እፍረተ ቢስና ገደብ የለሽ ባሕርይ ከአጠቃላዩ ‘ብልግና’ ጋር በግልጽ ያቀርባል።
- source_word: ᾗ ἔπραξαν
  choice: ስለሠሩት
  rationale: አንስታይ ነጠላ የሆነው አንጻራዊ ተውላጠ ስም የተዘረዘሩትን ሦስት ኃጢአቶች በአንድነት እንደሚመለከት በተፈጥሯዊ አማርኛ ተገልጧል።
theological_decisions:
- issue: ከቀደመው ቁጥር የሚቀጥለው የμή አገባብ
  choice: ሐረጉን ‘እንዳይ... እፈራለሁ’ በሚል የፍርሃት አገባብ ማቅረብ
  alternative: ‘ምናልባት ... ዝቅ ያደርገኝ ይሆናል’ የሚል ራሱን የቻለ ግምታዊ ንግግር
  rationale: ግሪኩ በቁጥር 20 ከተገለጸው φοβοῦμαι ጋር ይቀጥላል፤ ይህ ሰዋሰዋዊ ግንኙነት እንጂ የትምህርተ እምነት ማብራሪያ አይደለም።
- issue: የሦስቱ የሥነ ምግባር ጥፋቶች ልዩነት
  choice: ‘ርኩሰት፣ ዝሙትና የእፍረት ገደብ የሌለው ብልግና’ ብሎ ሦስቱን ለይቶ ማቅረብ
  alternative: ሦስቱን በአንድ አጠቃላይ የፆታ ኃጢአት ቃል ማጠቃለል
  rationale: ጽሑፉ ትርጉማቸው የሚደራረብ ቢሆንም የተለያዩ ሦስት ቃላትን ይዘረዝራል፤ ትርጉሙም ልዩነታቸውን ሳያጠብ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የμή ሐረግ ከቁጥር 20 የቀጠለ መሆኑን ለማሳየት ‘እፈራለሁ’ በግልጽ ተጨምሯል።
