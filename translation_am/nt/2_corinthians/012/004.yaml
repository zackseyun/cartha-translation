base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/004.yaml
  text: that he was caught up into paradise and heard inexpressible words, which a man is not permitted to speak.
translation:
  language: am
  text: እርሱ ወደ ገነት እንደተነጠቀና ሊነገሩ የማይችሉ፣ ሰው እንዲናገራቸው ያልተፈቀዱ ቃላትን እንደሰማ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ሊነገሩ የማይችሉ” የሚለው ለግሪኩ ἄρρητα ሲሆን፣ “መናገር ያልተፈቀደላቸው” የሚል ገጽታም ሊኖረው ይችላል፤ በቀጣዩ ሐረግ ግን ይህ ያለመፈቀድ በግልጽ ተገልጿል።
    reason: ἄρρητα ያለውን የትርጉም ስፋት ያሳያል፤ ሆኖም ከοὐκ ἐξὸν አንጻር ያለውን ልዩነት ይጠብቃል።
lexical_decisions:
- source_word: ἡρπάγη
  choice: ተነጥቆ ተወሰደ
  rationale: የግሪኩን ድንገተኛና በውጭ ኃይል መወሰድ የሚያመለክተውን ተገብሮ ቅርጽ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: παράδεισον
  choice: ገነት
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የተለመደና የግሪኩን ቃል በቀጥታ የሚወክል ነው።
- source_word: ἄρρητα ῥήματα
  choice: ሊገለጹ የማይችሉ ቃላት
  rationale: ἄρρητα በትርጉም ሊነገሩ የማይችሉ ወይም መነገር የሌለባቸው የሚል ድርብ ገጽታ ሊኖረው ስለሚችል፣ የመግለጽ አለመቻልን ይይዛል፤ ቀጣዩ ሐረግ ደግሞ ያለመፈቀዱን ገጽታ ያሳያል።
- source_word: οὐκ ἐξὸν ἀνθρώπῳ λαλῆσαι
  choice: ሰው እንዲናገራቸው ያልተፈቀዱ
  rationale: ἐξόν የፈቃድን ወይም ሕጋዊነትን ሐሳብ ይይዛል፤ ἄνθρωπος እዚህ ማንኛውንም ሰብዓዊ ፍጡር ስለሚወክል ‘ሰው’ ተመርጧል።
theological_decisions:
- issue: ‘ወደ ገነት’ የሚለው ቦታ ከቁጥር 2 ‘ሦስተኛው ሰማይ’ ጋር ያለው ግንኙነት
  choice: ገነት የሚለውን ብቻ ማቆየት
  alternative: ገነትን በትርጓሜ ከሦስተኛው ሰማይ ጋር ማመሳሰል ወይም መለየት
  rationale: ጥቅሱ ራሱ ግንኙነቱን በግልጽ አይፈታም፤ ትርጉሙ ያንን የትርጓሜ ውጥረት ሳይወስን ያቆያል።
- issue: ἄρρητα የማይገለጽ ወይስ መናገር የተከለከለ
  choice: በዋናው ጽሑፍ ሁለቱንም ገጽታዎች በተከታታይ ማቅረብ
  alternative: ሁለቱንም ሐረጎች ‘መናገር የተከለከለ’ ብሎ ማዋሃድ
  rationale: ἄρρητα ῥήματα እና οὐκ ἐξὸν...λαλῆσαι የተለያዩ ሐረጎች ናቸው፤ የመጀመሪያውን የመግለጽ አለመቻል፣ የሁለተኛውን ያለመፈቀድ ማሳየት የግሪኩን ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ከአውዱ የሚገኘው ‘አውቃለሁ’ ተካትቷል እንጂ ቁጥሩ ብቻውን ሲነበብ የማይጠናቀቅ ጥገኛ ሐረግ እንዳይሆን፤ ሆኖም ይህ ከቁጥር 3 የቀጠለ የአውድ ማሟያ ነው።
