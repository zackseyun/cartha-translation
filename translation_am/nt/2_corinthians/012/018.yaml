  text: παρεκάλεσα Τίτον καὶ συναπέστειλα τὸν ἀδελφόν· μήτι ἐπλεονέκτησεν ὑμᾶς Τίτος; οὐ τῷ αὐτῷ πνεύματι περιεπατήσαμεν; οὐ τοῖς αὐτοῖς ἴχνεσιν;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/018.yaml
  text: I urged Titus to go and sent the brother with him. Titus did not take advantage of you[a], did he? Did we not walk in the same spirit? Did we not walk in the same footsteps?
translation:
  language: am
  text: ቲቶን እንዲሄድ አጥብቄ ለመንኩት፤ ወንድምንም ከእርሱ ጋር ላክሁ። ቲቶስ በእናንተ ተጠቅሞ ነበርን? በዚያው መንፈስ[a] አልተመላለስንምን? በዚያው ፈለግ አልሄድንምን?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በዚያው መንፈስ» የሚለው በመንፈስ ቅዱስ መመራትን ሊያመለክት ይችላል፤ እንዲሁም ተመሳሳይ ዝንባሌ ወይም አካሄድ ማለት ሊሆን ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: παρεκάλεσα Τίτον
  choice: ቲቶን እንዲሄድ አጥብቄ ለመንኩት
  rationale: παρακαλέω በዚህ የተግባራዊ ተልእኮ አውድ ከልብ መጠየቅን ያመለክታል፤ «እንዲሄድ» ከአውዱ የተሞላ ሲሆን የአማርኛውን ፍሰት ግልጽ ያደርጋል።
- source_word: συναπέστειλα
  choice: ከእርሱ ጋር ላክሁት
  rationale: የግሱን ‘አብሮ መላክ’ ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τὸν ἀδελφόν
  choice: ወንድሙን
  rationale: የግሪኩ የተወሰነ መስተዋድድ በአውዱ ለአንባቢዎቹ የታወቀን የእምነት ወንድም ያመለክታል፤ ያልተጻፈ ባለቤትነት አልተጨመረም።
- source_word: μήτι ἐπλεονέκτησεν ὑμᾶς
  choice: ቲቶስ በእናንተ ተጠቅሞ ነበርን?
  rationale: μήτι አሉታዊ መልስ የሚጠብቅ ጥያቄ ነው፤ «በእናንተ ተጠቅሞ» ማለት ለራሱ ጥቅም እነርሱን መበዝበዝ የሚለውን ሰፊ ሐሳብ ይይዛል።
- source_word: τῷ αὐτῷ πνεύματι
  choice: በአንድ መንፈስ
  rationale: «መንፈስ» የጋራ ዝንባሌን ወይም አካሄድን ሊያመለክት ይችላል፤ በአማርኛ ፊደል የአቢይ/ንዑስ ፊደል ልዩነት ስለሌለ የመንፈስ ቅዱስን አማራጭ ግንዛቤም በተፈጥሮ ክፍት ይተዋል።
- source_word: περιεπατήσαμεν
  choice: አልተመላለስንምን?
  rationale: የግሪኩን ‘መመላለስ’ የሕይወት አካሄድ ዘይቤ ጠብቆ ያቀርባል።
- source_word: τοῖς αὐτοῖς ἴχνεσιν
  choice: በአንድ ፈለግስ አልተከተልንምን?
  rationale: ἴχνος የእግር ፈለግንና በዘይቤ የተግባር አካሄድን ያመለክታል፤ «ፈለግን መከተል» ዘይቤውን በተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: «በአንድ መንፈስ» የሚለው ትርጉም
  choice: የጋራ ዝንባሌንና አካሄድን እንደሚያመለክት በዋና ጽሑፉ ሳይተረጎም ቀርቧል
  alternative: «በዚያው መንፈስ ቅዱስ» ማለትም በመንፈስ ቅዱስ መመራት
  rationale: ቅርብ አውዱ የጳውሎስንና የቲቶስን ተመሳሳይ ቅንነትና አካሄድ ያነጻጽራል። ሆኖም πνεῦμα መንፈስ ቅዱስንም ሊያመለክት ስለሚችል ይህ ዕድል በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የመመላለስና የፈለግ ዘይቤዎች ተጠብቀዋል፤ ሦስቱም ጥያቄዎች አሉታዊ መልስ እንደሚጠብቁ በአማርኛው የጥያቄ አቀራረብ ተንጸባርቋል።
