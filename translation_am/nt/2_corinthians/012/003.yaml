lexical_decisions:
- source_word: οἶδα
  choice: አውቃለሁ / አላውቅም / ያውቃል
  rationale: የግሪኩን የእውቀት ግስ በተለመደው የአማርኛ አቻ ተርጉሞ፣ በጥቅሱ ያለውን ድግግሞሽና በጳውሎስ አለማወቅ እና በእግዚአብሔር ማወቅ መካከል ያለውን ንፅፅር ይጠብቃል።
- source_word: τὸν τοιοῦτον ἄνθρωπον
  choice: እንዲህ ያለውን ሰው
  rationale: በቀደመው አውድ የተገለጸውን የተወሰነ ወንድ ሰው በተዘዋዋሪ የሚጠቅሰውን አገላለጽ ይጠብቃል፤ ጳውሎስ ራሱን እንደሚያመለክት በትርጉሙ ውስጥ በግልጽ አይጨምርም።
- source_word: εἴτε ... εἴτε
  choice: ይሁን ወይስ
  rationale: ሁለት አማራጭ ሁኔታዎችን በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: ἐν σώματι
  choice: በሥጋ ሆኖ
  rationale: ከተከታዩ የመለየት ሐረግ ጋር ያለውን ንፅፅር በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል። ‘ሥጋ’ በዚህ አውድ የሰውን አካል ያመለክታል።
- source_word: χωρὶς τοῦ σώματος
  choice: ከሥጋ ተለይቶ
  rationale: χωρίς የሚያመለክተውን መለየት ይጠብቃል፤ ልምምዱ ያለ አካል ወይም ከአካል ውጭ እንደነበረ በሥነ መለኮታዊ ሁኔታ አይወስንም።
- source_word: θεὸς
  choice: እግዚአብሔር
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ ንባብ የተለመደውን፣ ክቡርና ለዘመናዊ አንባቢ ግልጽ የሆነውን አቻ ይጠቀማል።
theological_decisions:
- issue: ጳውሎስ ራሱን በተዘዋዋሪ መጥቀሱና የልምምዱ ባሕርይ
  choice: የሦስተኛ መደብ አገላለጹን ‘እንዲህ ያለውን ሰው’ በማለት ማቆየት፣ እንዲሁም ልምምዱ በአካል ወይም ከአካል ተለይቶ መሆኑን ሳይወስኑ መተው
  alternative: ሰውየውን ጳውሎስ ነው ብሎ በቀጥታ መለየት፣ ወይም ከአካል ውጭ የሆነ ልምምድ እንደነበር አድርጎ መተርጎም
  rationale: የግሪኩ ጽሑፍ የአነጋገር ርቀቱን ይጠብቃል፤ ልምምዱ በሥጋ ወይም ከሥጋ ተለይቶ መሆኑንም ሳይፈታ ይተዋል። ትርጉሙም ይህን እርግጠኛ አለመሆን ይጠብቃል።
