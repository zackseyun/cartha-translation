  text: እንዲህ ያለ ሰውንም አውቃለሁ—በአካል ውስጥ ሆነ ከአካል ተለይቶ እንደነበረ አላውቅም[a]፤ እግዚአብሔር ያውቃል—
  philosophy: optimal-equivalence
  footnotes:
