  rationale: ὑπέρ እዚህ የንጽጽር ትርጉም ስላለው፣ በአማርኛ «ከ…» የሚለው አገላለጽ ንጽጽሩን በተፈጥሮ ያቀርባል።
- source_word: αὐτὸς ἐγὼ
  choice: እኔ ራሴ
  rationale: የጳውሎስን ግላዊ አጽንዖት በግልጽና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: οὐ κατενάρκησα ὑμῶν
  choice: ሸክም ካልሆንኩባችሁ
  rationale: በዐውዱ ጳውሎስ ከቆሮንቶሳውያን የገንዘብ ወይም የቁሳቁስ ድጋፍ ባለመቀበል ሸክም እንዳልሆነባቸው ያመለክታል።
- source_word: χαρίσασθέ μοι
  choice: ይቅር በሉኝ
  rationale: በዚህ የቀልድ ምጸት ያለበት ትእዛዝ ውስጥ χαρίζομαι «ይቅር ማለት» የሚለውን ትርጉም ይይዛል።
- source_word: τὴν ἀδικίαν ταύτην
