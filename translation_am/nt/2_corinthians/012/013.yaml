  rationale: የግሱን የተደራጊ ቅርጽና ከሌሎች ጉባኤዎች ጋር ያለውን ንጽጽር ያስቀምጣል፤ ቆሮንቶሳውያን በተፈጥሯቸው ያነሱ እንደሆኑ አያመለክትም።
- source_word: ὑπὲρ τὰς λοιπὰς ἐκκλησίας
