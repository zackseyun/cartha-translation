base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/013.yaml
  text: For in what were you treated as inferior to the rest of the churches[c][b][a], except that I myself did not become a burden to you? Forgive me this wrong.
translation:
  language: am
  text: እንግዲህ፣ እኔ ራሴ ሸክም አልሆንኩባችሁም ከማለት በቀር፣ ከሌሎቹ ቤተ ክርስቲያናት ይልቅ ያነሰ አያያዝ የተደረገላችሁ በምን ነበር?[a][b] ይህን በደል ይቅር በሉኝ![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ከሌሎቹ ቤተ ክርስቲያናት ይልቅ ዝቅ ተደርጋችሁ የተያዛችሁት።» የግሪኩ ግስ አንድን ሰው ከሌሎች ዝቅ አድርጎ መያዝን ወይም በጉዳት ላይ ማዋልን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ይህም ማለት፣ ጳውሎስ ከእነርሱ ድጋፍ በመቀበል የገንዘብ ሸክም አልሆነባቸውም።
    reason: cultural_note
  - marker: c
    text: ጳውሎስ እዚህ በምጸት ይናገራል፤ ተብዬው «በደል» ሸክም አለመሆኑ ነው።
    reason: rhetorical_note
lexical_decisions:
- source_word: ἡσσώθητε
