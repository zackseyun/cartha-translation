id: 2CO.12.6
reference: 2 Corinthians 12:6
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐὰν γὰρ θελήσω καυχήσασθαι, οὐκ ἔσομαι ἄφρων, ἀλήθειαν γὰρ ἐρῶ· φείδομαι δέ, μή τις εἰς ἐμὲ λογίσηται ὑπὲρ ὃ βλέπει με ἢ ἀκούει ⸀τι ἐξ ἐμοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/006.yaml
  text: For if I should want to boast[a], I would not be foolish, for I would be speaking the truth. But I refrain, so that no one may reckon me above what he sees in me or hears from me.
translation:
  language: am
  text: ምክንያቱም ልመካ ብፈልግ፣ ሞኝ አልሆንም፤ እውነትን እናገራለሁና። ነገር ግን ማንም በእኔ ከሚያየው ወይም ከእኔ ማንኛውንም ነገር ከሚሰማው በላይ እንዳይቆጥረኝ እቆጠባለሁ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θελήσω
  choice: ብፈልግ
  rationale: ἐὰν ከአዎንታዊ ንዑስ አንቀጽ ጋር የሚገልጸውን ሊሆን የሚችል ሁኔታ የአማርኛው ሁኔታዊ አወቃቀር በተፈጥሮ ያስተላልፋል።
- source_word: καυχήσασθαι
  choice: ልመካ
  rationale: በዚህ ዐውድ ያለውን በራስ መመካትና ራስን ማወደስ ትርጉም በዘመናዊና ግልጽ አማርኛ ይገልጻል።
- source_word: ἄφρων
  choice: ሞኝ
  rationale: የቅጽል ትርጉሙን በተፈጥሯዊው ‘ሞኝ አልሆንም’ አገባብ ይጠብቃል።
- source_word: ἀλήθειαν γὰρ ἐρῶ
  choice: እውነትን እናገራለሁና
  rationale: የወደፊት ግሱንና ምክንያታዊውን γάρ በግልጽ አማርኛ ይወክላል፤ በሁኔታዊው ዐውድ ውስጥም የሚኖረውን ኃይል ያስቀራል።
- source_word: φείδομαι
  choice: እቆጠባለሁ
  rationale: ጳውሎስ ከመመካት ራሱን እንደሚገታ ያሳያል፤ ይህም ከ‘እተወዋለሁ’ ይልቅ የመቆጠብን ስሜት ይጠብቃል።
- source_word: λογίσηται
  choice: እንዳይቆጥረኝ
  rationale: የመገመትና ዋጋ የመስጠትን ኃይል ይጠብቃል፤ እዚህ ሰዎች ለጳውሎስ ከሚገባው በላይ ግምት እንዳይሰጡት ያመለክታል።
- source_word: ὑπὲρ ὃ
  choice: ከ…በላይ
  rationale: የተወሰነን መለኪያ የማለፍ ትርጉም በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: βλέπει με
  choice: በእኔ ከሚያየው
  rationale: ሌላው ሰው በጳውሎስ ላይ በቀጥታ በሚመለከተው ነገር መሠረት እንዲፈርድ የሚያሳየውን የግሪኩን አገባብ ይጠብቃል።
- source_word: ἀκούει τι ἐξ ἐμοῦ
  choice: ከእኔ ከሚሰማው
  rationale: ἐξ ἐμοῦ የሚያሳየውን ከጳውሎስ የሚወጣ ንግግር በተፈጥሯዊ መንገድ ያቀርባል፤ የτι ያልተወሰነ ኃይል በአማርኛው አገባብ ሊገባ ቢችልም በማስታወሻ በግልጽ ተጠቅሷል።
theological_decisions:
- issue: ጳውሎስ ስለ መመካቱ የሚናገረውና ራሱን መግታቱ
  choice: ቢመካ እውነትን ስለሚናገር ሞኝ እንደማይሆን፣ ሆኖም ሰዎች ከታየውና ከተሰማው በላይ እንዳይገምቱት እንደሚቆጠብ ቀርቧል።
  alternative: መመካቱ በራሱ ትክክል እንደሆነ አጠናክሮ መተርጎም፣ ወይም እዚህ ያለው መመካት ሁሉ የግድ ሐሰት ወይም ኃጢአት እንደሆነ መግለጽ።
  rationale: ግሪኩ ጳውሎስ ቢመካ እውነትን እንደሚናገር ይገልጻል፤ በተመሳሳይ ጊዜ ግን የሌሎችን ከመጠን ያለፈ ግምት ለመከላከል ይቆጠባል። ትርጉሙ ይህን ውጥረት ሳይፈታ ጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ሁኔታዊ አወቃቀር፣ ምክንያታዊ ግንኙነትና የጳውሎስ ራስን መግታት ተጠብቀዋል።
