  text: φοβοῦμαι γὰρ μή πως ἐλθὼν οὐχ οἵους θέλω εὕρω ὑμᾶς, κἀγὼ εὑρεθῶ ὑμῖν οἷον οὐ θέλετε, μή πως ⸀ἔρις, ⸀ζῆλος, θυμοί, ἐριθεῖαι, καταλαλιαί, ψιθυρισμοί, φυσιώσεις, ἀκαταστασίαι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/020.yaml
  text: For I fear that perhaps when I come I may find you not as I wish[a], and I may be found by you to be as you do not wish—that perhaps there may be strife, jealousy, outbursts of anger, selfish ambition, slanders, whisperings, conceit, and disorder.
translation:
  language: am
  text: ምክንያቱም፣ ምናልባት ስመጣ እንደምፈልገው ሆናችሁ እንዳላገኛችሁ፣ እኔም እንደማትፈልጉት ሆኜ እንዳታገኙኝ እፈራለሁ፤ ምናልባትም ጠብ፣ ቅናት፣ የቁጣ ፍንዳታዎች፣ ራስን የማስቀደም ምኞት፣ ስም ማጥፋት፣ ሹክሹክታ[a]፣ ትዕቢትና ሁከት እንዳይኖሩ እፈራለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሐሜት።”
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβοῦμαι
  choice: እፈራለሁ
  rationale: የጳውሎስን ቀጣይ ስጋት ቀጥተኛና ተፈጥሯዊ በሆነ የአማርኛ አገላለጽ ያስተላልፋል።
- source_word: μή πως
  choice: እንዳል… / ምናልባትም… እንዳይ…
  rationale: በሁለቱም ቦታ የተፈራውን አጋጣሚ ያሳያል፤ የአማርኛው አገባብ የስጋትንና የጥርጣሬን ኃይል ይጠብቃል።
- source_word: ἐλθὼν
  choice: ስመጣ
  rationale: በዐውዱ ያለውን ጊዜያዊ የአሳታፊ ግስ በተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: οὐχ οἵους θέλω εὕρω ὑμᾶς
  choice: እኔ እንደምፈልጋችሁ ሆናችሁ እንዳላገኛችሁ
  rationale: የቆሮንቶስ ሰዎችን ሁኔታና ባሕርይ የሚመለከተውን አንጻራዊ አገላለጽ በግልጽ አማርኛ ያቀርባል።
- source_word: κἀγὼ εὑρεθῶ ὑμῖν οἷον οὐ θέλετε
  choice: እናንተም እኔን እንደማትፈልጉኝ ሆኜ እንዳታገኙኝ
  rationale: በግሪኩ ያለውን የጋራ አለመደሰት ትይዩነት ጠብቆ፣ ተገብሮ አወቃቀሩን ለአማርኛ ተፈጥሯዊ በሆነ አድራጊ አወቃቀር ይገልጣል።
- source_word: ἔρις
  choice: ጠብ
  rationale: በማኅበረሰቡ ውስጥ ያለን ግጭትና ክርክር በአጭርና በተለመደ ቃል ይገልጣል።
- source_word: ζῆλος
  choice: ቅናት
  rationale: በዚህ የክፉ ባሕርያት ዝርዝር ውስጥ ቃሉ አሉታዊ ትርጉም አለው።
- source_word: θυμοί
  choice: የቁጣ ፍንዳታዎች
  rationale: ብዙ ቁጥሩ ተደጋጋሚና ድንገተኛ የቁጣ መገንፈልን ያመለክታል።
- source_word: ἐριθεῖαι
  choice: ራስን የማስቀደም ምኞት
  rationale: ለግል ጥቅምና ለራስ ከፍታ የሚደረግን ወገንተኛ ጥረት ያስተላልፋል።
- source_word: καταλαλιαί
  choice: ስም ማጥፋት
  rationale: ሌሎችን በክፉ ንግግር የመውቀስና ስማቸውን የማጉደፍ ሐሳብ ያሳያል።
- source_word: ψιθυρισμοί
  choice: ሹክሹክታ
  rationale: በስውር ወይም በዝቅተኛ ድምፅ ሌሎችን የሚጎዳ ንግግርን ያመለክታል፤ ‘ሐሜት’ም ዐውዳዊ አማራጭ ነው።
- source_word: φυσιώσεις
  choice: ትዕቢት
  rationale: በምሳሌያዊ መንገድ ‘መነፋት’ የሚለውን ራስን ከፍ የማድረግ ባሕርይ በተለመደ አማርኛ ይገልጣል።
- source_word: ἀκαταστασίαι
  choice: ሁከት
  rationale: በማኅበረሰቡ ውስጥ ያለን ያልተረጋጋ ሁኔታና ሥርዓት አልበኝነት ያሳያል።
theological_decisions:
