- from: ከእናንተ ዘንድ ከላክኋቸው ሰዎች በአንዱ አማካይነት በእናንተ ላይ ትርፍ አግኝቻለሁን?[a]
  to: ወደ እናንተ ከላክኋቸው ሰዎች መካከል በማንም አማካይነት ተጠቅሜባችኋለሁን?[a]
  rationale: The revision corrects the directional error in πρὸς ὑμᾶς, preserves the rhetorical question and the partitive/distributive reference to any person Paul sent, and uses idiomatic Amharic for the unfair-advantage sense of ἐπλεονέκτησα. The lexical footnote remains appropriate and is retained with only no substantive change.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:21:18Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly recognizes the rhetorical question, the partitive reference to persons Paul sent, and the mediating sense of δι’ αὐτοῦ. However, it renders πρὸς ὑμᾶς as «ከእናንተ ዘንድ» (“from/among you”), reversing the direction of Paul’s sending. The main verb is better expressed with an idiomatic Amharic term for taking advantage, while retaining the sense of gain at the Corinthians’ expense.
  naturalness: «ወደ እናንተ ከላክኋቸው ሰዎች መካከል በማንም አማካይነት» is clear, natural modern standard Amharic and preserves the distributive force of the Greek singular pronoun. «ተጠቅሜባችኋለሁን?» is a natural rhetorical formulation.
  terminology: «ተጠቅሜባችኋለሁ» suitably conveys πλεονεκτέω here, namely taking unfair advantage for one’s own gain. The footnote supplies the more explicit alternatives «በዝብዣችኋለሁ» and «አታልዬ ጥቅም አግኝቼባችኋለሁ».
  issues:
  - severity: high
    issue: Directional meaning of πρὸς ὑμᾶς is reversed.
    rationale: «ከእናንተ ዘንድ» means “from you/from among you,” whereas Paul says that he sent persons “to you.” The translation must read «ወደ እናንተ».
  - severity: medium
    issue: The main predicate is less idiomatic and understates the exploitative sense.
    rationale: «በእናንተ ላይ ትርፍ አግኝቻለሁ» can sound like neutral profit-making. «ተጠቅሜባችኋለሁ» naturally communicates taking advantage, with the footnote preserving the stronger lexical nuances.
  revised_text: ወደ እናንተ ከላክኋቸው ሰዎች መካከል በማንም አማካይነት ተጠቅሜባችኋለሁን?[a]
  revised_footnotes:
