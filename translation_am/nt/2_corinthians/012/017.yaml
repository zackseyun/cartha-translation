    text: ወይም፣ “በዝብዣችኋለሁ” ወይም “አታልዬ ጥቅም አግኝቼባችኋለሁ።” የግሪኩ ግስ ሌላውን በማጉደል ለራስ ጥቅም ማግኘትን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: μή
