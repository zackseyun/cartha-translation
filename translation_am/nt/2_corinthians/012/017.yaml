  rationale: ከተላኩት ቡድን ውስጥ ማንኛውንም አንድ ሰው የሚያመለክተውን ከፊል-ከጠቅላላ ግንኙነት ይጠብቃል።
- source_word: ἀπέσταλκα
  choice: ከላክኋቸው
  rationale: ፍጹም ጊዜው ጳውሎስ ወደ ቆሮንቶስ የላካቸውን ወኪሎች ያመለክታል፤ የአማርኛው አንጻራዊ ግስ በዐውዱ ተፈጥሯዊ ነው።
- source_word: πρὸς ὑμᾶς
  choice: ከእናንተ ዘንድ
  rationale: ወኪሎቹ ወደ አንባቢዎቹ እንደተላኩ በተፈጥሯዊና ክብር ባለው ዘመናዊ አማርኛ ይገልጣል።
- source_word: δι’ αὐτοῦ
  choice: በአንዱ አማካይነት
  rationale: የግሪኩን ነጠላ ‘በእርሱ አማካይነት’ ከቀደመው የቡድን አመልካች ጋር በማያያዝ በአማርኛ ግልጽ የሆነ አከፋፋይ ሐሳብ ያቀርባል።
- source_word: ἐπλεονέκτησα
  choice: በእናንተ ላይ ትርፍ አግኝቻለሁ
  rationale: ግሱ ሌላውን በመጉዳት ወይም በመበዝበዝ ለራስ ጥቅም ማግኘትን ያመለክታል። ይህ አተረጓጎም የግሪኩን የ‘ተጨማሪ ጥቅም ማግኘት’ ምስል ጠብቆ ያቀርባል።
- source_word: ὑμᾶς
  choice: በእናንተ ላይ
  rationale: የትርፉ ወይም የጥቅሙ ሰለባ የሆኑትን የቆሮንቶስ አማኞች በቡድን ያመለክታል።
