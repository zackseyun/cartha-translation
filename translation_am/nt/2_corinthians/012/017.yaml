  rationale: μή አሉታዊ መልስን የሚጠብቅ የአጠያየቅ ቅርጽ ነው፤ በአማርኛ ይህን በተፈጥሯዊ የአጠያየቅ ቅጥ ማቅረብ ይቻላል።
- source_word: τινα ὧν
