  text: Γέγονα ⸀ἄφρων· ὑμεῖς με ἠναγκάσατε· ἐγὼ γὰρ ὤφειλον ὑφ’ ὑμῶν συνίστασθαι. οὐδὲν γὰρ ὑστέρησα τῶν ὑπερλίαν ἀποστόλων, εἰ καὶ οὐδέν εἰμι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/011.yaml
  text: I have become a fool; you forced me to it. For I ought to have been commended by you[a], for I fell short in nothing compared with those super-apostles, even if I am nothing.
translation:
  language: am
  text: ሞኝ ሆኛለሁ፤ እናንተ አስገደዳችሁኝ። እኔ በእናንተ ልመሰከርልኝ ይገባ ነበርና። ከእነዚያ እጅግ የላቁ ሐዋርያት[a] በምንም ነገር ወደ ኋላ አልቀርኩምና፣ ምንም ባልሆንም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ከሁሉ የላቁ ሐዋርያት።» የግሪኩ አገላለጽ እጅግ አጽንዖት ያለው ሲሆን፣ በዚህ አውድ ምጸታዊ ሊሆን ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: Γέγονα
  choice: ሆኛለሁ
  rationale: የግሪኩ ፍጹም ጊዜ ቀደም ሲል የተፈጠረና አሁንም የሚቆይ ሁኔታን ስለሚያመለክት፣ «ሆኛለሁ» የአሁኑን ውጤት ይጠብቃል።
- source_word: ἄφρων
  choice: ሞኝ
  rationale: በጳውሎስ አውዳዊና ምጸታዊ ራስን እንደ ሞኝ ማቅረብ የተፈጥሮ አማርኛ አቻ ነው።
- source_word: ὑμεῖς με ἠναγκάσατε
  choice: እናንተ አስገደዳችሁኝ
  rationale: አጽንዖት ያለውን «እናንተ» ጠብቆ፣ ከቀዳሚው ንግግር የሚገባውን የሞኝነት መመካት ሳያብራራ የግዴታውን ኃይል ያስተላልፋል።
- source_word: ὤφειλον
  choice: ይገባ ነበር
  rationale: ሊደረግ የሚገባውን ማኅበራዊና ሥነ ምግባራዊ ግዴታ በተፈጥሮ አማርኛ ይገልጣል።
- source_word: ὑφ’ ὑμῶν συνίστασθαι
  choice: በእናንተ ልመሰከርልኝ
  rationale: ተገብሮ አወቃቀሩንና የድርጊቱን ፈጻሚ «በእናንተ» ይጠብቃል፤ በዚህ አውድ συνίστημι ለአንድ ሰው በጎ ምስክርነት መስጠትን ያመለክታል።
- source_word: οὐδὲν ... ὑστέρησα
  choice: በምንም አላነስሁም
  rationale: የበታች ወይም የኋላ አለመሆንን የሚገልጠውን ንጽጽራዊ ኃይል በግልጽ አማርኛ ይጠብቃል።
- source_word: τῶν ὑπερλίαν ἀποστόλων
  choice: ከእነዚያ “እጅግ የላቁ ሐዋርያት”
  rationale: ὑπερλίαν ያለውን ከፍተኛ ማጋነን ይጠብቃል፤ የጥቅስ ምልክቶቹ ሊኖር የሚችለውን ምጸት ያመለክታሉ፣ ነገር ግን «ተብዬዎች» በማለት አይወስኑትም።
- source_word: εἰ καὶ οὐδέν εἰμι
  choice: ምንም እንኳ እኔ ምንም ባልሆን
  rationale: የእሺታ ንዑስ ሐረጉንና የጳውሎስን ራስን ዝቅ የማድረግ ንግግር በቅርብ ይጠብቃል።
theological_decisions:
- issue: የτῶν ὑπερλίαν ἀποστόλων ኃይል
  choice: በዋናው ጽሑፍ «እጅግ የላቁ ሐዋርያት» ተብሎ ተተርጉሞ፣ ምጸታዊነቱ በጥቅስ ምልክትና በማስታወሻ ተጠቁሟል።
  alternative: ምጸት የሌለበት «ከሁሉ የላቁ ሐዋርያት»፣ ወይም ምጸቱን በግልጽ የሚወስነው «ታላላቅ ነን ከሚሉት ሐዋርያት»።
  rationale: በ2 ቆሮንቶስ አውድ ሐረጉ ምጸታዊ ወይም ተቃውሟዊ መሆኑ እጅግ የሚታይ ቢሆንም፣ ግሪኩ «ተብዬ» የሚል ግልጽ ቃል አልያዘም። ስለዚህ ማጋነኑና አሻሚነቱ ሳይወገዱ ቀርበዋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ተደጋጋሚው «ና» γάρን በሁለቱም ስፍራ በቅርብ ያንጸባርቃል፤ የመጨረሻው የእሺታ ሐረግ በአማርኛ ፍሰት የተነሳ ከንጽጽሩ በፊት ቀርቧል።
