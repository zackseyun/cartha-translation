id: 2CO.12.10
reference: 2 Corinthians 12:10
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: διὸ εὐδοκῶ ἐν ἀσθενείαις, ἐν ὕβρεσιν, ἐν ἀνάγκαις, ἐν διωγμοῖς ⸀καὶ στενοχωρίαις, ὑπὲρ Χριστοῦ· ὅταν γὰρ ἀσθενῶ, τότε δυνατός εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/010.yaml
  text: Therefore I delight in weaknesses[a], in insults, in hardships, in persecutions and distresses, for the sake of Messiah; for when I am weak, then I am strong.
translation:
  language: am
  text: ስለዚህ ስለ መሲሑ[a] በድካሞች፣ በስድቦች፣ በችግሮች፣ በስደቶችና በጭንቀቶች ደስ ይለኛል፤ ምክንያቱም ደካማ በሆንሁ ጊዜ ያን ጊዜ ብርቱ ነኝ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ በተለምዶ፣ «ስለ ክርስቶስ»።
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: ስለዚህ
  rationale: ከቀደመው ሐሳብ የሚወጣውን ድምዳሜ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: εὐδοκῶ
  choice: ደስ ይለኛል
  rationale: ጳውሎስ ችግሩን በግዴታ እንደሚታገሥ ብቻ ሳይሆን በበጎ ፈቃድ እንደሚቀበለው የሚያሳየውን አያዎ ጠብቋል።
- source_word: ἐν ἀσθενείαις
  choice: በድካሞች
  rationale: ብዙ ቁጥሩንና ከአካላዊ ሕመም የሰፋውን የደካማነት ትርጉም ይጠብቃል።
- source_word: ἐν ὕβρεσιν
  choice: በስድቦች
  rationale: የማዋረድና የስድብ አያያዝን በግልጽ ዘመናዊ አማርኛ ይገልጣል።
- source_word: ἐν ἀνάγκαις
  choice: በችግሮች
  rationale: በዐውዱ ያለውን የግፊትና የአስጨናቂ ሁኔታዎች ሐሳብ በተፈጥሯዊ ቃል ያስተላልፋል።
- source_word: ἐν διωγμοῖς
  choice: በስደቶች
  rationale: ስለ መሲሑ በሚደርስ ማሳደድና ግፍ የተለመደውን መጽሐፍ ቅዱሳዊ አገላለጽ ይጠቀማል።
- source_word: καὶ στενοχωρίαις
  choice: በጭንቀቶች
  rationale: የመጨናነቅና የከባድ ግፊት ስሜትን ጠብቆ ያስተላልፋል።
- source_word: ὑπὲρ Χριστοῦ
  choice: ስለ መሲሑ
  rationale: ὑπέρ የምክንያትንና ለእርሱ ታማኝ በመሆን የሚቀበሉትን መከራ ያመለክታል፤ Χριστός ደግሞ በዚህ ዐውድ የማዕረግ ኃይሉን እንዲጠብቅ «መሲሑ» ተብሏል።
- source_word: ὅταν γὰρ ἀσθενῶ
  choice: ምክንያቱም ደካማ በሆንሁ ጊዜ
  rationale: ὅταν የሚያሳየውን አጠቃላይና ተደጋጋሚ የጊዜ ሁኔታ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τότε δυνατός εἰμι
  choice: ያን ጊዜ ብርቱ ነኝ
  rationale: ከ«ደካማ» ጋር ያለውን ቀጥተኛ ተቃርኖና የጳውሎስን አያዎ ይጠብቃል።
theological_decisions:
- issue: የΧριστοῦ አተረጓጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: በዚህ ሐረግ Χριστός እንደ ማዕረግ ሊሰማ ስለሚችል «መሲሑ» ተመርጧል፤ የተለመደው «ክርስቶስ» በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ተደጋጋሚው ἐν በ«በ-» ተጠብቋል፤ የመጨረሻው የድካምና የብርታት አያዎም ሳይፈታ ቀርቧል።
