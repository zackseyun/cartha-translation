  rationale: ቁጥሩ ራሱ የአሁኑን ሥጋዊ ሕልውና ከጌታ ጋር ፊት ለፊት ካለመሆን ጋር ያነጻጽራል። ትርጉሙ ይህን ውጥረት ይጠብቃል፤ ከጌታ ድጋፍና መንፈሳዊ ኅብረት ፈጽሞ መለየትን ግን አያክልም።
