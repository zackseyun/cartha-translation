  text: if indeed[a], when we have been clothed, we will not be found naked.
translation:
  language: am
  text: በእርግጥ፣ ለብሰን ከሆነ፣ ዕራቁቶች ሆነን አንገኝም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴ γε
  choice: ከሆነ በእርግጥ
  rationale: የεἰን ሁኔታዊ ኃይልና የγεን አጽንዖት አብሮ ይጠብቃል፤ የግሪኩን የቃላት ቅደም ተከተል ሳይጫን በአማርኛ ተፈጥሯዊ ሁኔታዊ አገላለጽ ተደርጓል።
- source_word: καὶ
  choice: —
  rationale: በዚህ አወቃቀር ያለው አገናኝ/አጽንዖታዊ ሚና በአማርኛው የአረፍተ ነገር አወቃቀር ውስጥ ተካትቷል፤ በተናጠል ‘ደግሞ’ ማለት ንባቡን ያደነዝዝ ነበር።
- source_word: ἐνδυσάμενοι
  choice: እንደ ልብስ ከለበስን በኋላ
  rationale: የተዋረደው አኦሪስት መካከለኛ ክፍለ ግስ ‘ለብሰን/ከለበስን በኋላ’ የሚለውን ቀዳሚ ድርጊት ያሳያል፤ ‘እንደ ልብስ’ የሚለው በዐውዱ ያለውን የመልበስ ዘይቤ በግልጽ አማርኛ ይጠብቃል።
- source_word: οὐ
  choice: የማን…
  rationale: የወደፊት ግሱን መደበኛ እምቢታ በአማርኛ አንጻራዊ አወቃቀር ይገልጻል።
- source_word: γυμνοὶ
  choice: ዕራቁታችንን
  rationale: ‘ዕራቁት’ የሚለው ቀጥተኛ ትርጉም የልብስን ዘይቤ ይጠብቃል፤ የዘይቤውን ሥነ መለኮታዊ ፍቺ አይወስንም።
- source_word: εὑρεθησόμεθα
  choice: የማንገኝ
  rationale: የወደፊት ተደራጊ ቅርጹን ‘ዕራቁታችንን አንገኝም’ በሚለው ተፈጥሯዊ የአማርኛ አገላለጽ ያቀርባል፤ ትርጉሙ ‘እንደዚያ ሆነን መገኘት’ ነው።
theological_decisions:
- issue: የመልበስና የዕርቃንነት ዘይቤ ፍቺ
  choice: የመልበስና የዕርቃንነት ዘይቤው ሳይፈታ በዋናው ጽሑፍ ተጠብቋል።
  alternative: ‘ዕራቁት’ ማለት በሞትና በትንሣኤ መካከል ከአካል ተለይቶ መኖር፣ የሰማያዊ መኖሪያ/አካል አለመኖር፣ ወይም በእግዚአብሔር ፊት ኀፍረትና መጋለጥ ነው ብሎ መወሰን።
  rationale: ግሪኩ በዚህ ቁጥር የዘይቤውን ሙሉ ሥነ መለኮታዊ ማጣቀሻ አይገልጽም፤ ስለዚህ አንዱ አተረጓጎም ወደ ጽሑፉ አልገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ዕራቁታችንን መገኘት’ የሚለው የተደራጊውን ‘መገኘት’ ትርጉም በተፈጥሯዊ አማርኛ ለማቅረብ ተመርጧል።
