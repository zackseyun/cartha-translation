revisions:
- from: እንደ ልብስ ከለበስን በኋላ ዕራቁታችንን የማንገኝ ከሆነ በእርግጥ[a]።
  to: በእርግጥ፣ ለብሰን ከሆነ፣ ዕራቁቶች ሆነን አንገኝም።
  rationale: 'The revision corrects the grammatical roles of the Greek: the participle is rendered by “ለብሰን,” γυμνοὶ by the predicate “ዕራቁቶች ሆነን,” and the future passive by “አንገኝም.” It keeps εἴ γε as an emphatic conditional (“በእርግጥ … ከሆነ”) and does not interpret Paul’s clothing metaphor doctrinally.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:18:30Z'
review_pass:
  verdict: revise
  source_fidelity: The draft retains the broad clothing/nakedness imagery and conditional emphasis, but it changes the predicate sense of γυμνοὶ and mishandles the passive future εὑρεθησόμεθα. The Greek says that “we” will not be found “naked,” not that “our nakedness” will not be found.
  naturalness: 'The draft is syntactically strained: “ዕራቁታችንን የማንገኝ” means that we do not find our nakedness. “እንደ ልብስ” is also unnecessary and unnatural here, since ἐνδυσάμενοι itself already supplies the clothing image.'
  terminology: Use ለብሰን for ἐνδυσάμενοι and ዕራቁቶች ሆነን for the predicate adjective γυμνοὶ. This preserves the metaphor without specifying what the clothing or nakedness represents.
  issues:
  - severity: high
    issue: The object phrase “ዕራቁታችንን” does not represent γυμνοὶ.
    rationale: γυμνοὶ is a nominative plural predicate referring to “we.” The draft instead makes “our nakedness” the object of “find,” materially changing the sense.
  - severity: high
    issue: “የማንገኝ” is rendered as an active act of finding.
    rationale: εὑρεθησόμεθα is future passive, “we will be found.” Amharic should express being found in a state, e.g., “ዕራቁቶች ሆነን አንገኝም.”
  - severity: medium
    issue: “እንደ ልብስ” adds an unnecessary comparison.
    rationale: The Greek verb means to put on/clothe oneself; it does not say “as clothing.” The implicit metaphor is adequately retained by ለብሰን.
  - severity: medium
    issue: The footnote repeats the same predicate and voice errors.
    rationale: Its alternative must likewise identify the subjects as not being found naked/unclothed.
  revised_text: በእርግጥ፣ ለብሰን ከሆነ፣ ዕራቁቶች ሆነን አንገኝም።
  revised_footnotes:
  - marker: a
    text: ወይም፦ “በእርግጥ፣ ለብሰን ከሆነ፣ ልብስ የሌለን ሆነን አንገኝም።”
    reason: የቃል አማራጭ፤ γυμνοί በቀጥታ “ዕራቁቶች” ወይም በመልበስ ዘይቤው ውስጥ “ልብስ የሌለን” ሊተረጎም ይችላል።
  revision_rationale: 'The revision corrects the grammatical roles of the Greek: the participle is rendered by “ለብሰን,” γυμνοὶ by the predicate “ዕራቁቶች ሆነን,” and the future passive by “አንገኝም.” It keeps εἴ γε as an emphatic conditional (“በእርግጥ … ከሆነ”) and does not interpret Paul’s clothing metaphor doctrinally.'
