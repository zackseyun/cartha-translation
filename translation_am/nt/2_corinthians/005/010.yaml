  text: τοὺς γὰρ πάντας ἡμᾶς φανερωθῆναι δεῖ ἔμπροσθεν τοῦ βήματος τοῦ Χριστοῦ, ἵνα κομίσηται ἕκαστος τὰ διὰ τοῦ σώματος πρὸς ἃ ἔπραξεν, εἴτε ἀγαθὸν εἴτε ⸀φαῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/010.yaml
  text: For we all must be revealed before the judgment seat of Messiah[a], so that each one may receive what is due for what he has done in the body[d][c][b], whether good or bad.
translation:
  language: am
  text: 'ሁላችንም በመሲሑ[b] የፍርድ ወንበር ፊት መገለጥ[a] ይገባናልና፤ ይህም እያንዳንዱ በሰውነቱ ለሠራው ነገር[c]፣ መልካምም ይሁን መጥፎ፣ የሚገባውን እንዲቀበል ነው።


    [a] ወይም፣ «መቅረብ»። የግሪኩ ግስ በፊት መቅረብን ወይም በግልጥ መገለጥን ሊያመለክት ይችላል፤ ዋናው ጽሑፍ ሁለተኛውን ይዟል።

    [b] ግሪክ፣ «ክርስቶስ»። እዚህ ቃሉ እንደ ማዕረግ ስለሚሠራ «መሲሕ» ተብሎ ተተርጉሟል።

    [c] ቃል በቃል፣ «በሰውነት በኩል ለሠራው»፤ አገላለጹ በሰውነት የተፈጸሙ ድርጊቶችን ወይም የሰውን ምድራዊ ሕይወት ሊያመለክት ይችላል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «መቅረብ»። የግሪኩ ግስ በፊት መቅረብን ወይም በግልጥ መገለጥን ሊያመለክት ይችላል፤ ዋናው ጽሑፍ ሁለተኛውን ይዟል።
    reason: lexical_alternative
  - marker: b
    text: ግሪክ፣ «ክርስቶስ»። እዚህ ቃሉ እንደ ማዕረግ ስለሚሠራ «መሲሕ» ተብሎ ተተርጉሟል።
    reason: alternative_reading
  - marker: c
    text: ቃል በቃል፣ «በሰውነት በኩል ለሠራው»፤ አገላለጹ በሰውነት የተፈጸሙ ድርጊቶችን ወይም የሰውን ምድራዊ ሕይወት ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθῆναι
  choice: መገለጥ
  rationale: የግሪኩ ተደራጊ ግስ ከመቅረብ በላይ በግልጥ መታየትንና መጋለጥን ሊያመለክት ይችላል፤ «መገለጥ» ይህን የፍርድና የሥነ ምግባር ክብደት ይጠብቃል።
- source_word: βήματος
  choice: የፍርድ ወንበር
  rationale: በዚህ ዐውድ βῆμα ለፍርድና ለግምገማ የሚያገለግል መቀመጫ ወይም መድረክ ነው፤ ይህ አገላለጽ የሕግ ዐውዱን በግልጥ ያሳያል።
- source_word: Χριστοῦ
  choice: የመሲሑ
  rationale: Χριστός በዚህ ስፍራ እንደ ማዕረግ የሚሠራ ስለሆነ «መሲሕ» ተብሎ ቀርቧል፤ የግሪኩ «ክርስቶስ» በማስታወሻ ተጠቅሷል።
- source_word: κομίσηται
  choice: የሚገባውን እንዲቀበል
  rationale: መካከለኛው አንቀጽ እንደ ሥራው መልሶ መቀበልን ያሳያል፤ «የሚገባውን» የዋጋ መመለስ ሐሳቡን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τὰ διὰ τοῦ σώματος πρὸς ἃ ἔπραξεν
  choice: በሰውነቱ ለሠራው ነገር
  rationale: የግሪኩ አገላለጽ የታመቀ ነው። διά ከዘር ቅጽ ጋር «በ…በኩል» የሚል መሣሪያዊ ሐሳብ ሲኖረው፣ πρός ደግሞ ከተደረገው ጋር የሚመጣጠን ውጤት ያሳያል። ዋናው ትርጉም በአማርኛ ተፈጥሯዊ ሆኖ ይህን ግንኙነት ያቆያል።
- source_word: ἕκαστος
  choice: እያንዳንዱ
  rationale: ነጠላው አከፋፋይ ቃል የግል ተጠያቂነትን ያጎላል።
- source_word: ἀγαθὸν … φαῦλον
  choice: መልካምም … መጥፎ
  rationale: ሁለቱ ቃላት ሰፊ የሥነ ምግባር ተቃርኖን ያሳያሉ፤ «መጥፎ» φαῦλονን ያለ አስፈላጊ ማጠናከር ይተረጉማል።
theological_decisions:
- issue: በመሲሑ የፍርድ ወንበር ፊት የሚደረገው ግምገማ ባሕርይና ወሰን
  choice: የፍርድ ቃላትን፣ ሁሉን አቀፍ ተጠያቂነትንና ለእያንዳንዱ እንደ ሥራው መቀበልን እንዳሉ ማቆየት
  alternative: ይህን የአማኞች ሽልማት ብቻ ወይም የሰው ሁሉ የመጨረሻ ፍርድ ብቻ አድርጎ መግለጽ
  rationale: ቁጥሩ ሁሉም እንደሚገለጡና እያንዳንዱ እንደ ሥራው እንደሚቀበል ይናገራል፤ ነገር ግን የተፈራጆቹን ትክክለኛ ወሰንና የፍርዱን ውጤት በዚህ ቁጥር ብቻ አይወስንም። ትርጉሙ ይህን ሥነ መለኮታዊ ውጥረት አልፈታም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «ይገባናልና» የግሪኩን γάρ ምክንያታዊ ግንኙነት ይጠብቃል፤ ሥርዓተ ነጥቡም ረጅሙን ነጠላ ዓረፍተ ነገር ለማንበብ ቀላል ያደርገዋል።
