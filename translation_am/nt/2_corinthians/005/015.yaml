base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/015.yaml
  text: And he died for all[a], so that those who live might no longer live for themselves[b], but for the one who died and was raised for them.
translation:
  language: am
  text: እርሱም ስለ ሁሉም[a] ሞተ፤ ይህም በሕይወት ያሉት ከእንግዲህ ወዲህ ለራሳቸው ሳይሆን፣ ስለ እነርሱ ለሞተውና ለተነሣው[b] እንዲኖሩ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ስለ ሁሉም» የሚለው «ሁሉንም ወክሎ» ወይም «ለሁሉም ጥቅም» ተብሎም ሊገለጽ ይችላል። በኋላ ያለው «ስለ እነርሱ»ም ተመሳሳዩን የግሪክ መስተዋድድ (ὑπέρ) ይተረጉማል።
    reason: lexical_alternative
  - marker: b
    text: የግሪኩ ቃል «ተነሣ» ሳይሆን ተደራጊ ቅርጽ ነው፤ ስለዚህ «ተነሣ» የሚለው አገላለጽ «ተነሥቶ ነበር» ወይም «ተነሣ» ከሚለው ይልቅ «ተነሣ/ተቀሰቀሰ» የሚለውን ተደራጊ ሐሳብ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ πάντων
  choice: ስለ ሁሉም ሰው
  rationale: ὑπέρ ከዝርያ መስተዋድድ ጋር ጥቅምን ወይም ውክልናን ያመለክታል። «ስለ» በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን፣ «ሁሉም ሰው» የπάντωνን ሰዎችን የሚመለከት አገባብ ያብራራል፤ ወሰኑን ግን በሥነ መለኮታዊ ትርጓሜ አያጠብም።
- source_word: ἀπέθανεν
  choice: ሞተ
  rationale: የአንድ ጊዜ ያለፈ ክስተትን በቀጥታ ይገልጣል፤ ባለቤቱ «እርሱ» ከአውዱ ተገልጿል።
- source_word: ἵνα
  choice: ይህም ... እንዲኖሩ ነው
  rationale: የዓላማን ወይም የውጤትን ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οἱ ζῶντες
  choice: በሕይወት ያሉት
  rationale: ስማዊ የአሁን ጊዜ አንቀጽን በግልጽና በተፈጥሯዊ አማርኛ ያቀርባል፤ አውዱ የሕይወቱን ሰፊ መንፈሳዊና ህልውናዊ ትርጉም እንዲወስን ይተዋል።
- source_word: μηκέτι
  choice: ከእንግዲህ ወዲህ
  rationale: የቀድሞው የኑሮ አቅጣጫ መቋረጡን በግልጽ ያሳያል።
- source_word: ἑαυτοῖς ζῶσιν
  choice: ለራሳቸው ... እንዲኖሩ
  rationale: ዳቲቩ ኑሮው ለማን እንደተመራ ወይም ለማን ጥቅም እንደሆነ ያመለክታል፤ «ለራሳቸው መኖር» ይህን ራስን ያማከለ አቅጣጫ ተፈጥሯዊ በሆነ አነጋገር ይገልጣል።
- source_word: ἀλλὰ τῷ ... ἀποθανόντι καὶ ἐγερθέντι
  choice: ሳይሆን፣ ... ለሞተውና ለተነሣው
  rationale: «ለራሳቸው» ከሚለው ጋር ያለውን ተቃርኖ ይጠብቃል፤ ሁለቱንም የግሪክ አንቀጾች በተመጣጣኝ መዋቅር ያቀርባል።
- source_word: ἐγερθέντι
  choice: ለተነሣው
  rationale: የትንሣኤውን ድርጊት በተለመደና ክቡር የአማርኛ አገላለጽ ያቀርባል። የግሪኩ ቅርጽ ተደራጊ መሆኑ በማስታወሻ ተገልጿል።
- source_word: ὑπὲρ αὐτῶν
  choice: ስለ እነርሱ
  rationale: በቁጥሩ መጀመሪያ ያለውን ὑπέρ በተመሳሳይ «ስለ» በመድገም የቃላቱንና የሐሳቡን ትስስር ይጠብቃል።
theological_decisions:
- issue: የπάντων / αὐτῶν ወሰንና ማጣቀሻ
  choice: «ሁሉም ሰው» እና «እነርሱ» ተብሎ ያለ ማጥበብ ተተርጉሟል።
  alternative: «ሁሉ» ያለ ገደብ ሰውን ሁሉ ያመለክታል፤ ወይም በአውዱ ከክርስቶስ ጋር የሞቱትንና በእርሱ የተወከሉትን ያመለክታል።
