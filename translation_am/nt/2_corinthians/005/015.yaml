- issue: በἐγερθέντι ያለው የትንሣኤ አገላለጽ
  choice: «ለተነሣው»
  alternative: «ራሱ ለተነሣው» ወይም «እግዚአብሔር ላስነሣው»
  rationale: የመጀመሪያው አማርኛ አገላለጽ ተፈጥሯዊ ሆኖ የግሪኩን ተደራጊ ቅርጽ ለአንባቢው ክፍት ያደርጋል። «ራሱ» ማለት የሌለ አጽንዖት ይጨምራል፤ እግዚአብሔርን በስም ማስገባትም በዚህ ቁጥር ያልተገለጸውን ፈጻሚ በግልጽ ይጨምራል።
