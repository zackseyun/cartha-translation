  text: Therefore we also make it our ambition[a], whether at home or away, to be pleasing to him.
translation:
  language: am
  text: ስለዚህም፣ በቤት ብንሆንም ከቤት ርቀን ብንሆንም፣ ለእርሱ ደስ የምናሰኝ መሆንን ዓላማችን እናደርጋለን።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ዐውዱን ይበልጥ በግልጽ ለማሳየት፦ “በሥጋ ውስጥ በቤት ብንሆንም፣ ከሥጋ ርቀን ብንሆንም።”
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: ስለዚህ
  rationale: ከቀደመው ሐሳብ የሚወጣውን ድምዳሜ በተፈጥሯዊና ግልጽ አማርኛ ያመለክታል።
- source_word: καὶ
  choice: በዓረፍተ ነገሩ ቀጣይነት ውስጥ ተካቷል
  rationale: በግሪኩ ያለውን የመደመርና የቀጣይነት ኃይል በአማርኛው አወቃቀር መግለጽ ከ‘ደግሞ’ የተሻለ ተፈጥሯዊ ነው።
- source_word: φιλοτιμούμεθα
  choice: ምኞታችን እናደርጋለን
  rationale: ግሱ አንድን ነገር በጽኑ መመኘትንና ዋና ዓላማ ማድረግን ያመለክታል፤ ይህ አተረጓጎም የፍላጎቱን ጥንካሬ ይጠብቃል።
- source_word: εἴτε ἐνδημοῦντες εἴτε ἐκδημοῦντες
  choice: በቤት ብንሆንም ከቤት ርቀን ብንሆን
  rationale: ‘በቤት መሆን/ከቤት መራቅ’ የሚለውን ተቃራኒ ምስል ይጠብቃል፤ በዚህ ቁጥር ግሪኩ ያልገለጸውን ‘በሥጋ’ የሚለውን ማሟያ በዋናው ጽሑፍ አይጨምርም።
- source_word: εὐάρεστοι αὐτῷ εἶναι
  choice: እርሱን ደስ ማሰኘት
  rationale: ‘ለእርሱ ደስ የምናሰኝ መሆን’ የሚለውን ሐሳብ በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል፤ ተውላጠ ስሙንም ‘እርሱ’ ብሎ ይጠብቃል።
theological_decisions:
- issue: ‘በቤት መሆን’ና ‘ከቤት መራቅ’ የሚሉትን ከዐውዱ የሚገባውን ማሟያ በግልጽ መጨመር ወይም አለመጨመር
