  alternative: ‘በሥጋ በቤት ብንሆንም ከሥጋ ርቀን ብንሆን’ ብሎ በግልጽ መተርጎም
  rationale: ቁጥር 6–8 ስለ በሥጋ መኖርና ከጌታ ጋር መሆን ዐውዱን ያቀርባሉ፤ ሆኖም በቁጥር 9 ግሪኩ ማሟያዎቹን አይደግምም። አጭሩን አገላለጽ መጠበቅ የምንጩን ቅርጽና መጠነኛ አሻሚነት ይጠብቃል፤ ዐውዳዊ ትርጉሙ በእግር ማስታወሻ ይገለጻል።
