review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders διὰ πίστεως as በእምነት, retains the explanatory force of γάρ, preserves the περιπατέω walking metaphor, and represents the εἶδος contrast with በማየት. The proposed revision makes the negated second member explicitly parallel to the Greek verb without changing the meaning.
  naturalness: የምንመላለሰው ... ነውና፣ በማየት አይደለም is understandable, but its nominalized opening and the bare አይደለም make the antithesis less smooth in modern standard Amharic. A finite negative verb produces a clearer, more natural parallel contrast.
  terminology: እምነት is the appropriate unmarked rendering of πίστις here. መመላለስ appropriately retains the metaphor. ማየት is a defensible primary rendering of εἶδος in this established contrast; the footnote suitably preserves መልክ and የሚታየው as lexical alternatives.
  issues:
  - severity: low
    issue: The main clause is unnecessarily nominalized, and the negative half lacks an expressed parallel verb.
    rationale: Although intelligible, የምንመላለሰው ... ነውና፣ በማየት አይደለም is less idiomatic and less balanced than a finite verbal antithesis. Explicitly negating እንመላለሳለን maintains the source's contrast clearly.
  revised_text: በእምነት[a] እንመላለሳለንና፤ በማየት አንመላለስም—
