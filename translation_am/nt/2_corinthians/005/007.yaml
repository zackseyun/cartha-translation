  yaml_path: translation/nt/2_corinthians/005/007.yaml
  text: For we walk by faith[a], not by sight—
translation:
  language: am
  text: በእምነት[a] እንመላለሳለንና፤ በማየት አንመላለስም—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በመታመን።” “በማየት” የተባለውም “በመልክ” ወይም “በሚታየው” ተብሎ ሊተረጎም ይችላል። የግሪክኛው ቃል የሚታይ ቅርጽን ወይም መልክን ሊያመለክት ይችላል፤ “ማየት” የተመረጠው ከእምነት ጋር ያለውን ተቃርኖ ለመጠበቅ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ πίστεως
  choice: በእምነት
  rationale: διά ከጄኒቲቭ ጋር ዘዴን ወይም መንገድን ይገልጣል፤ በዚህ አጭር ተቃርኖ ውስጥ πίστιςን ‘እምነት’ ማለት ተፈጥሯዊና ከሚታየው ጋር ያለውን ንጽጽር የሚጠብቅ ነው።
- source_word: γὰρ
  choice: ነውና
  rationale: γάρ ቀድሞ ለተነገረው ሐሳብ ማብራሪያዊ ምክንያት ይሰጣል፤ ‘ነውና’ ይህን አገናኝ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: περιπατοῦμεν
  choice: የምንመላለሰው
  rationale: περιπατέω ቃል በቃል ‘መራመድ/መመላለስ’ ሲሆን በዘይቤ የሕይወት አካሄድን ያመለክታል። ‘መመላለስ’ ምስሉን ጠብቆ በመጽሐፍ ቅዱሳዊ አማርኛም የሚገባ ነው።
- source_word: οὐ διὰ εἴδους
  choice: በማየት አይደለም
  rationale: εἶδος የሚታይ ቅርጽን፣ መልክን ወይም የማየትን መስክ ሊያመለክት ይችላል። ‘በማየት’ ከ‘በእምነት’ ጋር ያለውን የመንገድ/የአካሄድ ተቃርኖ በአማርኛ በግልጽ ያቀርባል።
theological_decisions:
- issue: በጳውሎሳዊ አውድ πίστιςን መተርጎም
  choice: እምነት
  alternative: መታመን፤ ታማኝነት
  rationale: በዚህ ቁጥር πίστις ከεἶδος ጋር ተቃርኖ ውስጥ ነው፤ ስለዚህ ‘እምነት’ የማይታየውን በመታመን መኖርን በተሻለ ሁኔታ ይገልጣል። ‘ታማኝነት’ በቃሉ የትርጉም ክልል ውስጥ ቢሆንም ይህን ተቃርኖ አያሳይም።
- issue: εἶδος እንደ ዓይን እይታ ወይም እንደ ውጫዊ መልክ
  choice: ማየት
  alternative: መልክ፤ የሚታየው
  rationale: ግሪክኛው ቃል ከአንድ በላይ ተዛማጅ ፍቺዎች አሉት። በዋናው ጽሑፍ ‘ማየት’ የእምነትንና የእይታን ተቃርኖ በተፈጥሯዊ አማርኛ ይጠብቃል፤ የ‘መልክ’ ወይም ‘የሚታየው’ አማራጮች በማስታወሻ ተጠብቀዋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘መመላለስ’ የግሪክኛውን ዘይቤ ይጠብቃል፤ አረፍተ ነገሩ በሰረዝ መጨረሱ በሚቀጥለው ቁጥር ጋር ያለውን ቀጣይነት ያሳያል።
