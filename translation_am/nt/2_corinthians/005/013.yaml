  text: For if we are out of our minds[a], it is for God; if we are of sound mind[b], it is for you.
translation:
  language: am
  text: ምክንያቱም ራሳችንን ስተን ከሆንን[a]፣ ለእግዚአብሔር ነው፤ በቀና አእምሮ ያለን ከሆንን[b]፣ ለእናንተ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከአእምሯችን የወጣን ከሆንን።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በጤናማ አእምሮ ያለን ከሆንን” ወይም “ራሳችንን የምንገዛ ከሆንን።”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ... εἴτε
  choice: '... ከሆነ ... ከሆንን'
  rationale: ተደጋጋሚውን ሁኔታዊ ንጽጽር በተፈጥሯዊ አማርኛ ያሳያል፤ የ‘ይሁን ... ወይም’ የአማራጭነት ኃይልም በንጽጽሩ ይጠበቃል።
- source_word: γὰρ
  choice: በአማርኛው ዐውደ ንባብ በግልጽ አልተተረጎመም
  rationale: ቁጥሩ ከቀደመው ሐሳብ ጋር ያለው የማብራሪያ ግንኙነት በአማርኛ ያለ ተጨማሪ ‘እነሆ/ምክንያቱም’ ተፈጥሯዊ ሆኖ ይነበባል፤ ‘ምክንያቱም’ ማለት በዚህ አጭር ቅርጽ ከባድ ይሆናል።
- source_word: ἐξέστημεν
  choice: አእምሯችንን ስተን ከሆነ
  rationale: ‘ከአእምሮ መውጣት/ራስን መሳት’ የሚለውን ኃይለኛ ትርጉም ይጠብቃል፣ ሆኖም ጳውሎስ ቃል በቃል እብደትን እንደሚያረጋግጥ አያስገድድም።
- source_word: θεῷ
  choice: ለእግዚአብሔር
  rationale: የግሪኩን ዳቲቭ አጭርነትና ሆን ተብሎ ያልተወሰነ ግንኙነት ይጠብቃል፤ አቅጣጫን፣ ጥቅምን ወይም ስለ እግዚአብሔር መሆንን ሙሉ በሙሉ አይለይም።
- source_word: σωφρονοῦμεν
  choice: በቀና አእምሮ ከሆንን
  rationale: ከἐξέστημεν ጋር ያለውን ቀጥተኛ የአእምሮ ሁኔታ ንጽጽር ያሳያል፤ ማስተዋልን፣ ጤናማ ፍርድንና ራስን መግዛትን የሚያካትተውን ሰፊ ትርጉም አይዘጋም።
- source_word: ὑμῖν
  choice: ለእናንተ
  rationale: እንደ θεῷ ሁሉ የዳቲቩን አጭርና ጥቅም/አቅጣጫ ሊያመለክት የሚችል ኃይል በተፈጥሯዊ አማርኛ ያቆያል።
theological_decisions:
- issue: ጳውሎስ ስለ ራሱ የሚሰጠው ተቃራኒ መግለጫ
  choice: እንደ አእምሮ መሳት ሊታይ የሚችልን ሁኔታና ቀና አእምሮ ያለውን ሁኔታ በቀጥታ ማነጻጸር
  alternative: ቃሉን እንደ ቴክኒካዊ የሃይማኖታዊ ምስጠት ቃል መተርጎም፣ ወይም የሌሎችን ክስ ብቻ እንደሚደግም በትርጉሙ መወሰን
  rationale: የግሪኩ አጭርና ንጽጽራዊ አነጋገር ቃል በቃል እብደትን አያረጋግጥም፣ ቴክኒካዊ ምስጠትንም አይጠቅስም። ትርጉሙ ይህን ውጥረት ሳይፈታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ሐረግ አጭርነትና ትይዩ አወቃቀር ተጠብቋል፤ “ለእግዚአብሔር ... ለእናንተ” የሚለው ትይዩነትም ሆን ተብሎ ተቀምጧል።
