base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/014.yaml
  text: 'For the love of Messiah compels us[a], because we have concluded this: that one died on behalf of all; therefore all died.'
translation:
  language: am
  text: የመሲሑ ፍቅር[a] ግድ ይለናልና፤ ይህን ስለ ደመደምን፦ አንዱ ስለ ሁሉ ሞተ፤ ስለዚህ ሁሉ ሞቱ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “መሲሑ ለእኛ ያለው ፍቅር” ወይም “እኛ ለመሲሑ ያለን ፍቅር”፤ የግሪኩ አገላለጽ በሁለቱም መንገድ ሊገባ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγάπη
  choice: ፍቅር
  rationale: በዘመናዊ አማርኛ ἀγάπηን በተፈጥሮና በክብር የሚገልጽ መደበኛ ቃል ነው።
- source_word: τοῦ Χριστοῦ
  choice: የመሲሑ
  rationale: Χριστός በዚህ ስፍራ ማዕረግ ስለሆነ “መሲሕ” ተብሎ ተተርጉሟል፤ የአማርኛው የባለቤትነት አገላለጽም የግሪኩን ሰፊ ግንኙነት በዋናው ጽሑፍ አይገድብም።
- source_word: συνέχει
  choice: ግድ ይለናል
  rationale: ከውስጥ የሚገፋና የሚገዛ ኃይለኛ ተነሳሽነትን በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: κρίναντας τοῦτο
  choice: ይህንም ደምድመናል
  rationale: κρίνω በዚህ አውድ ያለውን በማስተዋል ወደ ውሳኔ መድረስ የሚለውን ኃይል ይገልጻል። “-ና” እና የንግግሩ ቅደም ተከተል ይህ ድምዳሜ ለቀደመው ንግግር መሠረት መሆኑን ያሳያሉ።
- source_word: εἷς
  choice: አንዱ
  rationale: ግሪኩ በአጭሩ “አንድ” ይላል፤ የሚያመለክተው መሲሑን ቢሆንም ማብራሪያ ሳይጨመር የአገላለጹ አጭርነት ተጠብቋል።
- source_word: ὑπὲρ πάντων
  choice: ስለ ሁሉ
  rationale: ὑπέρ የሚገልጸውን ለሁሉ ጥቅምና በሁሉ ፈንታ የሆነ ውክልና ሰፊ ትርጉም ይይዛል፤ አንድን የስርየት ንድፈ ሐሳብ ብቻ አይጫንም።
- source_word: ἄρα
  choice: ስለዚህ
  rationale: ከቀደመው ንግግር የሚወጣውን ድምዳሜ ግልጽ በሆነ አማርኛ ያመለክታል።
- source_word: οἱ πάντες ἀπέθανον
  choice: ሁሉ ሞቱ
  rationale: የጳውሎስን አጭርና ከባድ አመክንዮ ያለ ትርጓሜያዊ ማስፋፊያ በቀጥታ ይጠብቃል።
theological_decisions:
- issue: በἡ ἀγάπη τοῦ Χριστοῦ ውስጥ ያለው የጄኒቲቭ ግንኙነት
  choice: በዋናው ጽሑፍ “የመሲሑ ፍቅር” ተብሎ ሰፊው አገላለጽ ተጠብቋል።
  alternative: መሲሑ ለእኛ ያለው ፍቅር፤ ወይም እኛ ለመሲሑ ያለን ፍቅር
  rationale: የግሪኩ ጄኒቲቭ ፍቅሩ ከመሲሑ የሚመነጭ መሆኑን ወይም ወደ መሲሑ የሚያመራ መሆኑን ሊገልጽ ይችላል፤ አውዱ ትርጉሙን በግድ ወደ አንዱ አይወስንም።
- issue: “ሁሉ ሞቱ” የሚለው ትርጉም
  choice: ያለ ማስፋፊያ “ሁሉ ሞቱ” ተብሎ ተተርጉሟል።
  alternative: ሁሉም በመሲሑ ውክልና ሞቱ፤ ወይም አማኞች ሁሉ ከእርሱ ጋር ሞቱ
  rationale: ንግግሩ ከመሲሑ ሞት ጋር የውክልና ተሳትፎን ሊያመለክት ቢችልም፣ ጥቅሱ ራሱ ይህን በአጭሩ ይናገራል። ትርጉሙም “ሁሉ” የሚለውን ወሰን ከግሪኩ በላይ አይገድብም።
