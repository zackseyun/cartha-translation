  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ተፈጥሯዊ የሆነ አማርኛ ተጠቅሟል። “ግድ ይለናል” የσυνέχειን ኃይለኛ አነሳሽነት በቀላሉ ያስተላልፋል፤ ሥነ መለኮታዊ አሻሚነቶቹ በጽሑፉና በእግር ማስታወሻው ተጠብቀዋል።
