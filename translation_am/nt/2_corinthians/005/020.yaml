- source_word: ὑπὲρ Χριστοῦ
  choice: መሲሑን ወክለን
  rationale: ὑπέρ ከባለቤት አገባብ ጋር በዚህ የመልእክተኛነት አውድ «ስለ/በመወከል» የሚለውን ሐሳብ ይሰጣል። «ወክለን» በዘመናዊ አማርኛ የውክልናውን ትርጉም በግልጽ ያስተላልፋል፤ Χριστός ደግሞ እንደ ማዕረግ «መሲሕ» ተብሎ ተተርጉሟል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ስለ እርቅ የተነገረው ሐሳብ የሚወጣውን መደምደሚያ በግልጽ ያመለክታል።
- source_word: πρεσβεύομεν
  choice: እንደራሴዎች ሆነን እናገለግላለን
  rationale: ግሱ እንደ እንደራሴ ወይም መልእክተኛ መሥራትን ያመለክታል። ይህ አገላለጽ ቀጣይነት ያለውን አገልግሎት በተፈጥሯዊ አማርኛ ይገልጣል።
