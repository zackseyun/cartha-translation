  rationale: ὡς የንጽጽር ወይም የአቀራረብ ኃይል እንዳለው ተጠብቋል፤ παρακαλέω በዚህ አውድ ያለውን ጥብቅና ልመናዊ ጥሪ «ይማጸናል» ያስተላልፋል።
- source_word: δι’ ἡμῶν
  choice: በእኛ በኩል
  rationale: διά ከባለቤት አገባብ ጋር መንገድን ወይም አማካይነትን ያሳያል፤ «በእኛ በኩል» እግዚአብሔር በሐዋርያቱ አማካይነት መማጸኑን ያሳያል።
- source_word: δεόμεθα
  choice: እንለምናችኋለን
  rationale: የግሱን ከፍተኛ አጽንዖትና አስቸኳይ ልመና በተረዳ እና ክብር ባለው አማርኛ ያቀርባል።
- source_word: καταλλάγητε
  choice: ታረቁ
  rationale: የአንድ ጊዜ ትእዛዛዊ ጥሪውን ይጠብቃል። የአማርኛው «መታረቅ» ከሌላ ወገን ጋር ወደ ተስማማ ግንኙነት መመለስን በተፈጥሮ ይገልጣል።
- source_word: τῷ θεῷ
  choice: ከእግዚአብሔር ጋር
  rationale: ከ καταλλάσσω ጋር ያለው የመድረሻ ቅጽ በአማርኛ በተፈጥሮ «ከ…ጋር መታረቅ» ተብሎ ይገለጣል። የግሪኩ አገባብ ቃል በቃል «ለ/ወደ እግዚአብሔር» ሊቀርብ ቢችልም በአማርኛ ይህ አገላለጽ ያልተፈጥሯዊ ነው።
