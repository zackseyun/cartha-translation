lexical_decisions:
- source_word: κατεργασάμενος
  choice: ያዘጋጀን
  rationale: በቁጥር 1–4 ከተገለጸው ከወደፊቱ ሕይወት ጋር አማኞችን በዓላማ ማስማማትን ያመለክታል፤ «ያዘጋጀን» ይህን የዓላማ ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: εἰς αὐτὸ τοῦτο
  choice: ለዚሁ ነገር
  rationale: አሳይ ተውላጠ ስምና አጽንዖቱን ጠብቆ ቀደም ሲል የተነገረውን ትክክለኛ ነገር ይጠቁማል።
- source_word: θεός
  choice: እግዚአብሔር
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውና ክብር ያለው የθεός አተረጓጎም ነው።
- source_word: δοὺς
  choice: እርሱም … ሰጥቶናል
  rationale: የግሪኩን ቦዝ አንቀጽ በተፈጥሯዊ የአማርኛ ዓረፍተ ነገር ያቀርባል፤ ስጦታውንም ከእግዚአብሔር የማዘጋጀት ሥራ ጋር ያያይዛል።
- source_word: ἀρραβῶνα
  choice: ቅድሚያ ክፍያ
  rationale: ቀሪው እንደሚከተል ዋስትና የሚሆን የመጀመሪያ ክፍያ የሚለውን የንግድ ምሳሌ ይጠብቃል።
- source_word: τοῦ πνεύματος
  choice: የመንፈስን
  rationale: የግሪኩን የዝምድና ቅርጽ በዋናው ጽሑፍ ይጠብቃል፤ መንፈስ ቅዱስ ራሱ ቅድሚያ ክፍያው መሆኑን ወይም ክፍያው ከመንፈስ ጋር ያለውን ሌላ ዝምድና በግድ አይወስንም።
- source_word: δὲ
  choice: (በተለየ ቃል አልተተረጎመም)
  rationale: እዚህ ያለው ለስላሳ የንግግር ሽግግር በአማርኛው የዓረፍተ ነገር ፍሰት ተሸክሟል፤ «አሁን» ማለት በምንጩ የሌለ ጊዜያዊ ትርጉም ሊጨምር ይችላል።
theological_decisions:
- issue: «የመንፈስ ቅድሚያ ክፍያ» የሚለው ሐረግ ትርጉም
  choice: የዝምድናውን ሐረግ በዋናው ጽሑፍ በግልጽ ሳይፈታ ማቆየት፤ በዐውዱ መንፈስ ቅዱስ ራሱ የወደፊቱ ፍጻሜ ቅድሚያ ክፍያና ዋስትና መሆኑ ዋናው ንባብ ነው።
  alternative: እግዚአብሔር መንፈስ ቅዱስ ወደ ፍጻሜ የሚያደርሰውን ነገር የሚያረጋግጥ ቅድሚያ ክፍያ ሰጥቶናል ተብሎ ሊገባ ይችላል።
  rationale: τοῦ πνεύματος አገባብ መንፈስ ቅዱስ ራሱ ስጦታው እንደሆነ በጽኑ ይጠቁማል (2 ቆሮ 1፥22፤ ኤፌ 1፥13–14)፤ ሆኖም የግሪኩ የዝምድና ቅርጽ በዋናው ጽሑፍ ስለተጠበቀ አማራጩ አገባብ አልተዘጋም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «ቅድሚያ ክፍያ» የንግድ ምሳሌውን በቀጥታ ሲያቆይ፣ የትርጉም አማራጮቹ በማስታወሻ ቀርበዋል።
