  - marker: b
    text: ሐረጉ መንፈስ ቅዱስ ራሱ የመጀመሪያው ክፍያ ነው ማለት ሊሆን ይችላል፤ ወይም እግዚአብሔር፣ መንፈስ ቅዱስ ወደ ፍጻሜ የሚያደርሰውን ነገር የሚያረጋግጥ የመጀመሪያ ክፍያ ሰጥቶናል ማለት ሊሆን ይችላል።
