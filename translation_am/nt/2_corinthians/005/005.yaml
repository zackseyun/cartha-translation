    issue: «ቅድሚያ ክፍያ» can mean an advance/prepayment.
    rationale: ἀρραβών is specifically a first payment or pledge that guarantees the remainder; «የመጀመሪያ ክፍያ» communicates that installment sense more directly in modern standard Amharic.
