  source_fidelity: The draft accurately identifies God as the one who prepared us for the emphatic goal in the preceding context and preserves the participial statement that he gave the ἀρραβών of the Spirit. However, «ቅድሚያ ክፍያ» more readily denotes an advance payment in modern Amharic, rather than an initial installment that secures the remaining payment.
  naturalness: The sentence is otherwise clear, idiomatic, and suitably dignified. Replacing the commercial term with «የመጀመሪያ ክፍያ» gives a more natural and semantically precise expression for a first installment/down payment.
  terminology: «እግዚአብሔር» and «መንፈስ» are appropriate biblical-register terms. The revised wording retains the Greek genitive without deciding in the main text whether the Spirit is himself the pledge or is otherwise related to it.
