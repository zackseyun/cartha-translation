  terminology: «ድንኳን», «እናቃስታለን», «ሸክም ተጭኖብን», and «በሕይወት እንዲዋጥ» are suitable. «ልብስ ልናወልቅ» and «በላዩ ላይ ልብስ ልንደርብ» preserve the clothing metaphor without imposing an interpretation of the intermediate state.
