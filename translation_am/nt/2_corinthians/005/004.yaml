  source_fidelity: The draft preserves the tent, burden, clothing, and swallowing imagery well. However, «በእርግጥም» renders the emphatic force of καὶ γὰρ but omits its explicit connective/explanatory force (“for”). The causal relation expressed by ἐφ’ ᾧ is more clearly represented with an explicit causal construction.
