  revision_rationale: The revision corrects the sense of θαρροῦμεν, renders σῶμα as «ሰውነት», and replaces an unnatural expression with idiomatic Amharic for presence with the Lord. It preserves Paul’s contrast and does not explicitly add death, heaven, or a doctrinal explanation of the intermediate state.
