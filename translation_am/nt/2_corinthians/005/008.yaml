revisions:
- from: እንግዲህ እንበረታለን፤ ይልቁንም ከሥጋችን ርቀን ከጌታ ጋር በቤታችን መሆንን እንመርጣለን።[a]
  to: ስለዚህ በመተማመን ላይ ነን፤ ይልቁንም ከሰውነታችን ርቀን በጌታ ዘንድ መኖርን እንመርጣለን።[a]
  rationale: The revision corrects the sense of θαρροῦμεν, renders σῶμα as «ሰውነት», and replaces an unnatural expression with idiomatic Amharic for presence with the Lord. It preserves Paul’s contrast and does not explicitly add death, heaven, or a doctrinal explanation of the intermediate state.
