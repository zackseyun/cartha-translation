  text: θαρροῦμεν δὲ καὶ εὐδοκοῦμεν μᾶλλον ἐκδημῆσαι ἐκ τοῦ σώματος καὶ ἐνδημῆσαι πρὸς τὸν κύριον·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/008.yaml
  text: So we are confident and would rather be away from the body and at home with the Lord[a].
translation:
  language: am
  text: ስለዚህ በመተማመን ላይ ነን፤ ይልቁንም ከሰውነታችን ርቀን በጌታ ዘንድ መኖርን እንመርጣለን።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ከሰውነታችን ተለይተን በጌታ ዘንድ በቤት መሆንን።»
    reason: የἐκδημῆσαι እና ἐνδημῆσαι የቤት/ከቤት መራቅ ምሳሌያዊ አገላለጽ በቅርብ የሚያሳይ አማራጭ አተረጓጎም ነው።
lexical_decisions:
- source_word: θαρροῦμεν
  choice: እንበረታለን
  rationale: የአሁን ጊዜው ግስ ቀጣይ ድፍረትንና መተማመንን ያሳያል፤ «እንበረታለን» በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን ከቀደመው አውድ ጋር ይገናኛል።
- source_word: δὲ
  choice: እንግዲህ
  rationale: እዚህ ጠንካራ ተቃርኖን ሳይሆን ከቁጥር 6–7 የሚቀጥል ድምዳሜን ወይም ቀጣይ ሐሳብን ያመለክታል።
- source_word: καὶ εὐδοκοῦμεν μᾶλλον
  choice: ይልቁንም … መሆንን እንመርጣለን
  rationale: εὐδοκοῦμεν ከμᾶλλον ጋር ሲመጣ ፈቃደኛ ምርጫን ወይም ቅድሚያ መስጠትን ያሳያል፤ ይህ አገላለጽ በአማርኛ ንጽጽሩን በተፈጥሮ ያስተላልፋል።
- source_word: ἐκδημῆσαι ἐκ τοῦ σώματος
  choice: ከሥጋችን ርቀን
  rationale: ἐκδημέω ከቤት ወይም ከአገር ርቆ መኖርን ያመለክታል። «ርቀን» የጳውሎስን የቤትና የርቀት ምሳሌ ይጠብቃል፤ ግልጽ ባልሆነው ቦታ «መሞት» ብሎ አይተረጉምም። የመጀመሪያ ሰው ብዙ ቁጥር ባለቤትነት በአማርኛ «ሥጋችን» በሚለው ተፈጥሯዊ ሁኔታ ተገልጧል።
- source_word: ἐνδημῆσαι πρὸς τὸν κύριον
  choice: ከጌታ ጋር በቤታችን መሆን
  rationale: ἐνδημέω ከἐκδημέω ጋር የሚቃረን የቤት ምስል ነው። «በቤታችን መሆን» ምሳሌውን ይጠብቃል፤ πρὸς τὸν κύριον ደግሞ በዚህ አውድ የግል አብሮነትን «ከጌታ ጋር» በማለት ያሳያል።
theological_decisions:
- issue: ይህን ንግግር ስለ ሞት በኋላ ያለው መካከለኛ ሁኔታ ግልጽ የአስተምህሮ መግለጫ አድርጎ መተርጎም ወይም የጽሑፉን ምሳሌ መጠበቅ
  choice: ከሥጋ መራቅና ከጌታ ጋር በቤት መሆን የሚለውን የጳውሎስን ምሳሌ ጠብቆ መተርጎም
  alternative: «ሞተን በሰማይ ከጌታ ጋር መኖር» ብሎ በግልጽ መተርጎም
  rationale: ቁጥሩ ከሞት በኋላ ከጌታ ጋር መገኘትን በጽኑ ቢያመለክትም፣ «ሞት» እና «ሰማይ» የሚሉት ቃላት በግሪኩ የሉም። ስለዚህ ትርጉሙ ከጽሑፉ በላይ ሳይጨምር ያለውን ሥነ መለኮታዊ ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ሥጋ» የተመረጠው σῶμαን በተለመደ መጽሐፍ ቅዱሳዊ አገላለጽ ለማቅረብ ነው፤ እዚህ የሥነ ምግባር ክፉ ተፈጥሮን አያመለክትም።
