- issue: Χριστῷ እንደ ማዕረግ ወይም እንደ ስም መቅረቡ
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: የግሪኩ ቃል በዚህ ዐውድ ‘የተቀባው’ የሚለውን ማዕረግ ይይዛል፤ ‘መሲሕ’ ይህን ትርጉም ያጎላል።
- issue: ἐν ἡμῖν የሚለው አገባብ
  choice: በእኛ ውስጥ
  alternative: ለእኛ አደራ ሰጠን / በእኛ መካከል
  rationale: ዋናው ጽሑፍ ἐνን በቅርብ በመከተል የግሪኩን አሻሚነት ይጠብቃል፤ አገልግሎታዊው ትርጉም በማስታወሻ ተጠቅሷል።
