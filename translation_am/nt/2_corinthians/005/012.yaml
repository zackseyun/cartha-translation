id: 2CO.5.12
reference: 2 Corinthians 5:12
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀οὐ πάλιν ἑαυτοὺς συνιστάνομεν ὑμῖν, ἀλλὰ ἀφορμὴν διδόντες ὑμῖν καυχήματος ὑπὲρ ἡμῶν, ἵνα ἔχητε πρὸς τοὺς ἐν προσώπῳ καυχωμένους καὶ ⸂μὴ ἐν⸃ καρδίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/012.yaml
  text: We are not commending ourselves to you again[a], but giving you an opportunity to boast about us[b], so that you may have an answer for those who boast in outward appearance and not in heart.
translation:
  language: am
  text: ራሳችንን እንደገና ለእናንተ እያወደስን አይደለንም፤ ነገር ግን ስለ እኛ የምትመኩበትን አጋጣሚ እየሰጠናችሁ ነው፤ ይህም በውጫዊ መልክ እንጂ በልብ ለማይመኩት መልስ እንዲኖራችሁ ነው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνιστάνομεν
  choice: እያመሰገንን
  rationale: በዚህ ዐውደ ንባብ ራስን ማቅረብ ወይም ማስመስገን የሚለውን ሳይሆን ራስን ማወደስና ለሌሎች ማስተዋወቅ የሚለውን ሐሳብ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἀφορμὴν
  choice: አጋጣሚ
  rationale: መነሻ፣ ምክንያት ወይም ዕድል የሚለውን የቃሉን ስፋት በዐውዱ ውስጥ ተፈጥሯዊ በሆነ መንገድ ያስተላልፋል።
- source_word: καυχήματος / καυχωμένους
  choice: የምትመኩበት / ለሚመኩት
  rationale: በግስና በስም መልክ ያለውን የግሪኩን ተደጋጋሚ ቃል በአማርኛም በአንድ ሥር በመተርጎም የጥቅሱን ንጽጽር ይጠብቃል።
- source_word: ὑπὲρ ἡμῶν
  choice: በእኛ ምክንያት
  rationale: ስለ ጳውሎስና ባልደረቦቹ ወይም በእነርሱ ወገን መመካት የሚለውን ክፍት ትርጉም ይይዛል፤ ‘ስለ እኛ’ ከሚለውም ይበልጥ የውክልናውን ጥላ ያሳያል።
- source_word: ἵνα ἔχητε πρὸς
  choice: መልስ እንዲኖራችሁ
  rationale: ቃል በቃል ‘ወደ ... የሚሆን ነገር እንዲኖራችሁ’ የሚለውን ፈሊጣዊ አነጋገር፣ ለተቃዋሚዎች የሚሰጥ ምላሽ በሚለው ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐν προσώπῳ
  choice: በውጫዊ መልክ
  rationale: ቃል በቃል ‘በፊት’ ቢሆንም፣ ከ‘በልብ’ ጋር ባለው ንጽጽር የሚያመለክተውን ውጫዊ ገጽታ በግልጽ አማርኛ ይገልጣል።
- source_word: καρδίᾳ
  choice: በልብ
  rationale: የግሪኩን ምሳሌያዊና ሥነ መለኮታዊ ክብደት የሚጠብቅ መደበኛ የአማርኛ አቻ ነው።
- source_word: πάλιν
  choice: እንደገና
  rationale: የድግግሞሽን ሐሳብ በቀጥታና በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: ἐν προσώπῳ ... καὶ μὴ ἐν καρδίᾳ የሚለው ንጽጽር
  choice: በውጫዊ መልክ ... በልብ ሳይሆን
  alternative: በሕዝብ ፊት ያለ ዝና ... ውስጣዊ ቅንነት፣ ወይም ፊት ለፊት መገኘት ... የልብ አቋም
  rationale: ይህ አተረጓጎም በውጫዊ ገጽታና በውስጣዊ እውነታ መካከል ያለውን ዋና ንጽጽር ይጠብቃል፤ ሐረጉንም ወደ አንድ ጠባብ ትርጓሜ አይገድበውም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ረጅም አረፍተ ነገር አወቃቀር ተጠብቆ፣ በሥርዓተ ነጥብ ንባቡ እንዲቀልል ተደርጓል። በዋናው ጽሑፍ ያልተጠራ የግርጌ ማስታወሻ አልተጨመረም።
