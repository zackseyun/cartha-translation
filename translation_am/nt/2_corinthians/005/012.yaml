review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the major rhetorical structure and the contrast between outward appearance and heart. However, እያመሰገንን means “thanking,” not “commending/praising,” and በእኛ ምክንያት weakens ὑπὲρ ἡμῶν (“about/on behalf of us”).
  naturalness: The sentence is generally clear, but correcting the first verb and using እንጂ for the final antithesis makes the Amharic more idiomatic and precise.
  terminology: Use እያወደስን for self-commendation in this context, while retaining መመካት for the deliberate καύχημα/καυχάομαι wordplay. በውጫዊ መልክ and በልብ suitably preserve the source contrast.
  issues:
  - severity: high
    issue: እያመሰገንን mistranslates συνιστάνομεν.
    rationale: In modern Amharic ማመስገን normally means “to thank.” The Greek verb here means to commend or recommend oneself, not to express thanks.
  - severity: medium
    issue: በእኛ ምክንያት is too indirect for ὑπὲρ ἡμῶν.
    rationale: The phrase gives the Corinthians grounds for boasting about Paul and his coworkers, with a possible representative nuance. ስለ እኛ preserves this directly without overinterpreting it.
  revised_text: ራሳችንን እንደገና ለእናንተ እያወደስን አይደለንም፤ ነገር ግን ስለ እኛ የምትመኩበትን አጋጣሚ እየሰጠናችሁ ነው፤ ይህም በውጫዊ መልክ እንጂ በልብ ለማይመኩት መልስ እንዲኖራችሁ ነው።
