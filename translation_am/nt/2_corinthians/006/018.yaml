  text: “እኔም ለእናንተ አባት እሆናለሁ፤ እናንተም ለእኔ ወንድ ልጆችና ሴት ልጆች ትሆናላችሁ” ይላል ሁሉን ቻይ ጌታ።[a]
  philosophy: optimal-equivalence
  footnotes:
