  text: እንደ ኀዘንተኞች ሆነን፣ ሁልጊዜ ግን እየተደሰትን፤ እንደ ድሆች ሆነን፣ ብዙዎችን ግን ሀብታም እያደረግን[a]፤ ምንም እንደሌለን ሆነን፣ ሁሉን ግን የምንይዝ[b] ነን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ብዙዎችን የምናበለጽግ»። በዚህ አውድ ያለው ብልጽግና ቁሳዊ ሀብትን ሳይሆን መንፈሳዊ በረከትን የሚያመለክት ይመስላል።
    reason: lexical_alternative
  - marker: b
