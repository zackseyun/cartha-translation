  rationale: ቀጥተኛው አተረጓጎም የምንጩን ርቱዕ አነጋገርና የ‘አፍ/ልብ’ ትይዩነት ይጠብቃል፤ የዘይቤዎቹ ትርጉም በማስታወሻ ተብራርቷል።
