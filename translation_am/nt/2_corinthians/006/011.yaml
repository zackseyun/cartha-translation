lexical_decisions:
- source_word: στόμα
  choice: አፋችን
  rationale: ‘አፍ’ የሚለው ቀጥተኛ አተረጓጎም ጳውሎስ በ‘ልብ’ ከሚለው ጋር ያስተያየውን የአካል ዘይቤ ይጠብቃል።
- source_word: ἀνέῳγεν
  choice: ተከፍቷል
  rationale: የግሪኩን ፍጹም ጊዜ ውጤታዊ ሁኔታና የ‘መከፈት’ ዘይቤ ይጠብቃል፤ በዐውዱ ግልጽ ሆኖ መናገርን ያመለክታል።
- source_word: πρὸς ὑμᾶς
  choice: ለእናንተ
  rationale: ንግግሩ ወደ ቆሮንቶሳውያን የተመራ መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Κορίνθιοι
  choice: እናንተ ቆሮንቶሳውያን ሆይ
  rationale: የግሪኩን ቀጥተኛ የጥሪ አቀራረብ በክብር ያለውና ግልጽ በሆነ የአማርኛ አነጋገር ያስተላልፋል።
- source_word: καρδία
  choice: ልባችን
  rationale: ‘ልብ’ የፍቅርንና የውስጣዊ አመለካከትን ማዕከል የሚወክል መደበኛ ቃል ሲሆን ከ‘አፍ’ ጋር ያለውን ዘይባዊ ትይዩነት ይጠብቃል።
- source_word: πεπλάτυνται
  choice: ሰፍቷል
  rationale: የ‘መስፋት/ማስፋት’ መሠረታዊ ምስልንና ከቀደመ ድርጊት የተገኘውን የአሁን ሁኔታ በአጭርና ተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: ጳውሎስ ግልጽነቱንና ፍቅሩን ለመግለጽ የተጠቀመባቸው የአካል ዘይቤዎች
  choice: ‘አፋችን ... ተከፍቷል’ እና ‘ልባችን ... ሰፍቷል’ የሚሉትን ዘይቤዎች በዋናው ጽሑፍ ማቆየት
