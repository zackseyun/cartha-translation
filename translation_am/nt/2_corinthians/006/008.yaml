  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ተመጣጣኝ ጥንዶች «በ…ና በ…» በሚል አወቃቀር ተጠብቀዋል፤ የመጨረሻው ንጽጽር ግን በአማርኛ ግልጽ እንዲሆን የሰዎች ግምትና እውነታው ተለይተው ቀርበዋል።
