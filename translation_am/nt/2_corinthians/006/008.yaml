translation:
  language: am
  text: በክብርና በውርደት[a]፣ በክፉ ወሬና በመልካም ወሬ[b]፤ አሳቾች እንደሆንን እየተቆጠርን፣ እውነተኞች ግን ነን[c]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ክብር» የሚለው የግሪክ ቃል «ግርማ» ወይም «ክብር» ማለት ሊሆን ይችላል፤ እዚህ ግን ከ«ውርደት» ጋር በመነጻጸሩ በሰዎች ዘንድ የሚሰጥ ክብርን የሚያመለክት ይመስላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «በስም ማጥፋትና በምስጋና»። የግሪክ ቃላቱ መጥፎና መልካም ወሬን ወይም ዝናን ሊያመለክቱ ይችላሉ።
    reason: lexical_alternative
  - marker: c
    text: ቃል በቃል፣ «እንደ አሳቾች እና እውነተኞች»። አገላለጹ ጳውሎስና የሥራ አጋሮቹ በሌሎች ዘንድ እንዴት እንደሚታዩ ከእውነተኛው ሁኔታቸው ጋር ያነጻጽራል።
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ
  choice: በ
  rationale: ከተከታታይ የባለቤት ቅጽ ስሞች ጋር አገልግሎቱ የሚያልፍባቸውን ሁኔታዎች ያመለክታል፤ የ«በ… በ…» ድግግሞሽም የግሪኩን የንግግር ሚዛን ይጠብቃል።
- source_word: δόξης
  choice: ክብር
  rationale: ከἀτιμία ጋር በተቃርኖ ስለቀረበ፣ በዚህ ስፍራ በይፋ የሚሰጥ ክብርንና መልካም ግምትን ያመለክታል። የአማርኛው «ክብር» የ‘glory’ ትርጉምንም ሊሸከም ስለሚችል የቃሉን ስፋት አያጠፋም።
- source_word: ἀτιμίας
  choice: ውርደት
  rationale: ከ«ክብር» ጋር ግልጽና ተፈጥሯዊ ተቃርኖ ይፈጥራል፤ ማኅበራዊ ውርደትንና ክብር ማጣትን ይገልጣል።
- source_word: δυσφημίας
  choice: ክፉ ወሬ
  rationale: ቃሉ ጎጂ ንግግርን ወይም መጥፎ ስምን ሊያመለክት ይችላል። «ክፉ ወሬ» ከተከታዩ «መልካም ወሬ» ጋር ያለውን ቀጥተኛ ተቃርኖ ይጠብቃል።
- source_word: εὐφημίας
  choice: መልካም ወሬ
  rationale: መልካም ንግግርን፣ ምስጋናን ወይም መልካም ስምን የሚያካትተውን ትርጉም ይጠብቃል፤ ከ«ክፉ ወሬ» ጋርም የግሪኩን ጥንድ ያንጸባርቃል።
- source_word: ὡς
  choice: እንደሆንን እየተቆጠርን
  rationale: ጳውሎስና አብረውት የሚያገለግሉት በሰዎች ዘንድ እንዴት እንደሚታዩ በተፈጥሯዊ አማርኛ ግልጽ ያደርጋል፤ ክሱን እንደ እውነት አያቀርብም።
- source_word: πλάνοι
  choice: አሳቾች
  rationale: በዚህ አውድ ሌሎችን የሚያስቱ ሰዎች ተብለው መከሰሳቸውን ይገልጣል፤ «ተቅበዝባዦች» የሚለው መሠረታዊ ፍቺ ከአውዱ ጋር አይስማማም።
- source_word: ἀληθεῖς
  choice: እውነተኞች
  rationale: ከ«አሳቾች» ጋር ያለውን አጭርና ኃይለኛ ተቃርኖ ይጠብቃል፤ ቃሉ እውነት ተናጋሪነትንም እውነተኛነትንም ሊያመለክት ይችላል።
theological_decisions:
- issue: የመጨረሻው ጥንድ የሰዎችን ግምት ከእውነተኛው ሁኔታ ጋር ማነጻጸሩን ግልጽ ማድረግ
  choice: «አሳቾች እንደሆንን እየተቆጠርን፣ እውነተኞች ግን ነን»
  alternative: «እንደ አሳቾችና እውነተኞች»
  rationale: ὡς የሚያመለክተውን የሌሎች አመለካከት ግልጽ በማድረግ «አሳቾች» የሚለው ክስ እንጂ የጸሐፊው ፍርድ እንዳልሆነ ያሳያል። «ግን» ደግሞ ክሱና እውነታው መካከል ያለውን ሥነ ንግግራዊና ሥነ መለኮታዊ ውጥረት ይጠብቃል።
