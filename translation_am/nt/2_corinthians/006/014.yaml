base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/014.yaml
  text: Do not become unequally yoked with unbelievers[b][a]. For what partnership has righteousness with lawlessness? Or what fellowship has light with darkness?
translation:
  language: am
  text: ከማያምኑ ሰዎች ጋር በማይመጣጠን ቀንበር[a] አትጠመዱ። ጽድቅ[b] ከሕግ አልባነት ጋር ምን አጋርነት አለው? ወይስ ብርሃን ከጨለማ ጋር ምን ኅብረት አለው?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘በማይመጣጠን ቀንበር’ የሚለው አገላለጽ የማይጣጣሙ እንስሳት በአንድ ቀንበር የመጠመዳቸውን ምስል ያስታውሳል፤ ዘዳግም 22፥10ን ይመልከቱ።
    reason: cross_reference
  - marker: b
    text: ‘ጽድቅ’ (δικαιοσύνῃ) ወይም ‘ፍትሕ’።
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ γίνεσθε
  choice: አትጠመዱ
  rationale: የክልከላውን ኃይል በተፈጥሯዊ አማርኛ ያሳያል፤ ከቀንበሩ ምሳሌ ጋርም በቀጥታ ይጣጣማል። γίνομαι ያለውን የአንድ ሁኔታ ውስጥ መግባት ሐሳብ አያጠፋም።
- source_word: ἑτεροζυγοῦντες
  choice: በማይመጣጠን ቀንበር
  rationale: የተለያዩ ዓይነት እንስሳት በአንድ ቀንበር የመጠመዳቸውን ምስል ይጠብቃል፤ በዘመናዊ አማርኛም ትርጉሙ ግልጽ ነው።
- source_word: ἀπίστοις
  choice: ከማያምኑ ሰዎች ጋር
  rationale: ቃሉ እምነት የሌላቸውን ወይም የማያምኑትን ሰዎች ያመለክታል፤ የዳቲቭ ግንኙነቱም በ‘ጋር’ ተፈጥሯዊ ሆኖ ተገልጧል።
- source_word: μετοχὴ
  choice: አጋርነት
  rationale: የጋራ ተሳትፎንና አንድ ላይ መካፈልን ያሳያል፤ ከቀጣዩ κοινωνία ጋር ያለውን ትይዩነት ሳያጠፋ ቃላቱን ይለያል።
- source_word: δικαιοσύνῃ
  choice: ጽድቅ
  rationale: በዚህ ከሕገ ወጥነት ጋር በቀረበው ሥነ ምግባራዊና መንፈሳዊ ንጽጽር ውስጥ ‘ጽድቅ’ የቃሉን ዋና ክልል ይጠብቃል፤ ‘ፍትሕ’ የሚለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ἀνομίᾳ
  choice: ሕገ ወጥነት
  rationale: ሕግን የመጣስ ወይም ሕግ አልባ የመሆንን ሁኔታ በቀጥታ ይገልጣል፤ ከ‘ጽድቅ’ ጋር ያለውን ተቃርኖ ይጠብቃል።
- source_word: κοινωνία
  choice: ኅብረት
  rationale: የቅርብ ተካፋይነትንና የጋራ ግንኙነትን የሚገልጥ የተለመደና ክቡር አማርኛ ነው።
- source_word: φωτὶ
  choice: ብርሃን
  rationale: የግሪኩን ምሳሌያዊ ቃል በቀጥታ ይጠብቃል።
- source_word: πρὸς σκότος
  choice: ከጨለማ ጋር
  rationale: πρός በዚህ ንጽጽር የሚያሳየውን ግንኙነት በተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: በጳውሎሳዊው ንጽጽር δικαιοσύνηን መተርጎም
  choice: ጽድቅ
  alternative: ፍትሕ
  rationale: ከἀνομία ጋር ያለው ሥነ ምግባራዊና መንፈሳዊ ንጽጽር ‘ጽድቅ’ን በዋናው ጽሑፍ ይደግፋል፤ የፍትሕ ትርጉም ክልል ግን እንዳይዘጋ በግርጌ ማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር አማርኛ ተጠቅሟል። የቀንበሩ ምሳሌ ተጠብቆ ለተራው አንባቢ እንዲገባ ‘በማይመጣጠን’ ተብሎ ተገልጧል፤ μετοχή እና κοινωνία ያላቸው ቅርብ ሆኖም የተለየ ስሜት ‘አጋርነት’ እና ‘ኅብረት’ በሚሉ ቃላት ተጠብቋል።
