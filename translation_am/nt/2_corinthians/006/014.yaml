  terminology: ጽድቅ, አጋርነት, ኅብረት, ብርሃን, and ጨለማ appropriately convey the source terms. The lexical alternative ፍትሕ for δικαιοσύνη should remain footnoted. Replace ሕገ ወጥነት with ሕግ አልባነት for ἀνομία.
  issues:
