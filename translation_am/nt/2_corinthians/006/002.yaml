source:
  edition: SBLGNT
  text: λέγει γάρ· Καιρῷ δεκτῷ ἐπήκουσά σου καὶ ἐν ἡμέρᾳ σωτηρίας ἐβοήθησά σοι· ἰδοὺ νῦν καιρὸς εὐπρόσδεκτος, ἰδοὺ νῦν ἡμέρα σωτηρίας·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/002.yaml
  text: For he says[a], “At an acceptable time I listened to you, and in a day of salvation I helped you.” Behold, now is the acceptable time; behold[b], now is the day of salvation.
translation:
  language: am
  text: እንዲህ ይላልና፦ “አመቺ በሆነ ጊዜ ሰማሁህ፤[a] በመዳንም ቀን ረዳሁህ።” እነሆ፣ አሁን እጅግ አመቺ ጊዜ ነው፤ እነሆ፣[b] አሁን የመዳን ቀን ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በበጎ ፈቃድ ሰማሁህ።” ይህ ግስ በተቀባይነት ወይም በምላሽ መስማትን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “አሁን የሞገስ ጊዜ ነው፤ … አሁን የመዳን ቀን ነው።” ‘አመቺ’ የሚለው ቃል ‘የሞገስ ወይም ተስማሚ’ የሚል ሐሳብም ሊያስተላልፍ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει γάρ
  choice: እንዲህ ይላልና
  rationale: γάρ ከቀደመው ሐሳብ ጋር ያለውን የምክንያት ወይም የማብራሪያ ግንኙነት በ‘ና’ ያሳያል፤ ይላል ደግሞ በጥቅሱ ውስጥ የሚናገረውን መለኮታዊ ተናጋሪ በግል ያቆያል።
- source_word: Καιρῷ δεκτῷ
  choice: ተቀባይነት ባለው ጊዜ
  rationale: καιρός ተራ የሰዓት ፍሰትን ሳይሆን ተስማሚ ወይም የተመደበ ጊዜን ያመለክታል፤ δεκτός ያለውን ተቀባይነትና በጎ ምላሽ ሳያጠብ ይገልጣል።
- source_word: ἐπήκουσά σου
  choice: ሰማሁህ
  rationale: ቃሉ መስማትን ያመለክታል፣ በዐውዱም በበጎ መስማትን ወይም ምላሽ መስጠትን ሊያካትት ይችላል። ‘ሰማሁህ’ ይህን ስፋት ሳይዘጋ ያቆያል።
- source_word: ἐν ἡμέρᾳ σωτηρίας
  choice: በመዳንም ቀን
  rationale: የግሪኩን ያለ አመልካች አንቀጽ አገላለጽ በአማርኛ በተፈጥሮ ያቆያል፤ σωτηρία በዚህ ዐውድ ‘መዳን’ ተብሎ ግልጽና የተለመደ ሆኖ ተተርጉሟል።
- source_word: ἐβοήθησά σοι
  choice: ረዳሁህ
  rationale: βοηθέω እርዳታ መስጠትን ወይም ለእርዳታ መድረስን ያመለክታል፤ ‘ረዳሁህ’ ግልጽና ተፈጥሯዊ ነው።
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: የአንባቢውን ትኩረት የሚጠራውንና የንግግሩን አጽንዖት የሚጠብቀው ክብር ያለው የአማርኛ አቻ ነው።
- source_word: καιρὸς εὐπρόσδεκτος
  choice: እጅግ ተቀባይነት ያለው ጊዜ
  rationale: εὐπρόσδεκτος ከδεκτός ይበልጥ ጠንካራ የመቀበልና የሞገስ ስሜት አለው፤ ‘እጅግ’ ይህን አጽንዖት ሲያሳይ ከቀደመው አገላለጽ ጋር ያለውን የቃል ግንኙነት ያቆያል።
- source_word: ἡμέρα σωτηρίας
  choice: የመዳን ቀን
  rationale: በአማርኛ የተፈጥሮ አገላለጽ ሲሆን የግሪኩ ሐረግ አመልካች አንቀጽ እንደሌለው በግድ ‘አንድ’ ብሎ ሳይጨምር ያቆያል።
theological_decisions:
- issue: የጊዜና የመዳን ቀን ሐረጎች የተወሰኑ ወይስ ያልተወሰኑ ሆነው መተርጎም
  choice: በጥቅሱ ውስጥ ያልተወሰነውን አገላለጽ በተፈጥሯዊ አማርኛ ማቆየት፤ በጳውሎስ ትግበራ ደግሞ ‘የመዳን ቀን’ የሚለውን ተፈጥሯዊ ቅርጽ መጠቀም
  alternative: ‘የተወሰነው ተቀባይነት ያለው ጊዜ’ እና ‘ያ የመዳን ቀን’ ብሎ በግልጽ መወሰን፣ ወይም ‘አንድ የመዳን ቀን’ ማለት
  rationale: የግሪኩ ሐረጎች አመልካች አንቀጽ የላቸውም። አማርኛ ግን ያልተወሰነነትን ለማሳየት ሁልጊዜ ‘አንድ’ አያስፈልገውም፤ ስለዚህ ተፈጥሯዊነትን ሳያጣ የምንጩን ክፍትነት ይጠብቃል።
- issue: λέγει የሚለው እግዚአብሔርን በግል ወይስ መጽሐፍን በኢ-ግላዊ መንገድ ያመለክታል
  choice: ‘እንዲህ ይላል’ በማለት ግላዊ ተናጋሪውን ማቆየት
  alternative: ‘መጽሐፍ እንዲህ ይላል’ ማለት
  rationale: የጥቅሱ ድምፅ እግዚአብሔርን ተናጋሪ አድርጎ ያቀርባል። ስሙን ሳይጨምር ‘ይላል’ ማለት ይህን መለኮታዊ የንግግር ሸካራነት ያቆያል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለመደበኛ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የጥቅሱ ግጥማዊ ትይዩነትና የ‘እነሆ … እነሆ’ አጽንዖት ተጠብቋል።
