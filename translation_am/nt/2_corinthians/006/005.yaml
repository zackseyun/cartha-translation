  text: በድብደባዎች፣ በእስሮች፣ በሁከቶች፣ በልፋቶች፣ እንቅልፍ በሌለባቸው ሌሊቶች፣ በጾሞች፣
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πληγαῖς
  choice: መደብደብ
  rationale: ቃሉ አካላዊ ድብደባን ወይም መመታትን ያመለክታል፤ በዚህ ዝርዝር ውስጥ ተፈጥሯዊና ግልጽ አገላለጽ ነው።
- source_word: φυλακαῖς
  choice: መታሰር
  rationale: በዐውዱ የእስር ቤት ልምምድን ሳይሆን በእስር መቆየትን ያሳያል።
- source_word: ἀκαταστασίαις
  choice: ሁከት
  rationale: ቃሉ ረብሻን፣ ያልተረጋጋ ሁኔታን ወይም አመፅን ሊያመለክት ይችላል፤ ‘ሁከት’ ይህን ስፋት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: κόποις
  choice: ድካም
  rationale: κόπος ከከባድ ጥረት የሚመጣን ድካምና ልፋት ያካትታል፤ እዚህ ‘ድካም’ ከመከራዎቹ ዝርዝር ጋር ይስማማል።
- source_word: ἀγρυπνίαις
  choice: እንቅልፍ ማጣት
  rationale: ቃሉ ነቅቶ ማደርን ወይም እንቅልፍ አልባ ሌሊቶችን ያመለክታል፤ በዐውዱ ምክንያቱ ስላልተገለጸ አጠቃላይ ትርጉሙ ተጠብቋል።
- source_word: νηστείαις
  choice: ጾም
  rationale: νηστεία በፈቃድ የሚደረግን ጾምም ሆነ ምግብ ማጣትን ሊያመለክት ይችላል፤ ‘ጾም’ ቀጥተኛውን የቃሉን አቻ ይሰጣል።
theological_decisions:
- issue: የνηστείαις ፍቺ—ሃይማኖታዊ ጾም ወይስ በችግር ምግብ ማጣት
  choice: ጾም
  alternative: ረሃብ / ምግብ ማጣት
  rationale: ግሪክኛው ሁለቱንም ሊፈቅድ ቢችልም፣ በዚህ ቦታ በግልጽ አንዱን አይወስንም። ቀጥተኛው አማርኛ ‘ጾም’ ነው፤ በግድ የሚገጥም ረሃብ ተብሎ አልተፈታም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና በቀላሉ የሚገባ መደበኛ አማርኛ። የἐν ተደጋጋሚ አወቃቀር በእያንዳንዱ ክፍል ‘በ-’ በማለት ተጠብቋል።
