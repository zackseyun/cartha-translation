  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ይጠቀማል። “ቤተ መቅደስ፣” “ሕያው፣” “ጣዖታት” እና “ሕዝብ” የሚሉት ቃላት የመጽሐፍ ቅዱስን ክብርና የኪዳን ድምፅ ሳያደበዝዙ ለዘመናዊ አንባቢ የሚገቡ ናቸው።
