  text: τίς δὲ συγκατάθεσις ναῷ θεοῦ μετὰ εἰδώλων; ⸂ἡμεῖς γὰρ ναὸς θεοῦ ἐσμεν⸃ ζῶντος· καθὼς εἶπεν ὁ θεὸς ὅτι Ἐνοικήσω ἐν αὐτοῖς καὶ ἐμπεριπατήσω, καὶ ἔσομαι αὐτῶν θεός, καὶ αὐτοὶ ἔσονταί ⸀μου λαός.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/016.yaml
  text: 'And what agreement has the temple of God with idols? For we are the temple of the living God[a], just as God said: “I will dwell among them and walk among them, and I will be their God[b], and they will be my people.”'
translation:
  language: am
  text: የእግዚአብሔር ቤተ መቅደስስ ከጣዖታት ጋር ምን ስምምነት[a] አለው? እኛ የሕያው እግዚአብሔር ቤተ መቅደስ ነንና፤ እግዚአብሔር እንዳለው፦ “በመካከላቸው እኖራለሁ[b]፣ በመካከላቸውም እመላለሳለሁ፤ አምላካቸውም እሆናለሁ፣ እነርሱም ሕዝቤ ይሆናሉ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “መግባባት” ወይም “አንድ ዓላማ መያዝ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም “በእነርሱ ውስጥ እኖራለሁ።” የግሪኩ መስተዋድድ “ውስጥ” ወይም “መካከል” ተብሎ ሊተረጎም ይችላል፤ እዚህ የማኅበሩ የኪዳን ዐውድ “በመካከላቸው”ን ይደግፋል።
    reason: alternative_reading
lexical_decisions:
- source_word: συγκατάθεσις
  choice: ስምምነት
  rationale: ቃሉ ስምምነትን፣ መግባባትን ወይም ተመሳሳይ ዓላማ መያዝን ያመለክታል። “ስምምነት” በዘመናዊ አማርኛ ግልጽ ሲሆን በዐውዱ ያሉትን ሊጣጣሙ የማይችሉ ጥንዶች የሚያነጻጽረውን ጥያቄ ይጠብቃል።
- source_word: ναῷ / ναὸς
  choice: ቤተ መቅደስ
  rationale: ναός ሰፊውን የቤተ መቅደስ ግቢ ሳይሆን መቅደሱን ወይም ዋናውን የተቀደሰ ሕንፃ ያመለክታል። “ቤተ መቅደስ” የአምልኮ ትርጉሙንና ዘይቤውን ይጠብቃል።
- source_word: εἰδώλων
  choice: ጣዖታት
  rationale: በዚህ ዐውድ ገለልተኛ ምስሎችን ሳይሆን ለአምልኮ የተደረጉ ጣዖታትን ያመለክታል።
- source_word: ζῶντος
  choice: ሕያው
  rationale: የቦዘኑትን ጣዖታት ከእውነተኛው ሕያው እግዚአብሔር ጋር የሚያነጻጽረውን የመጽሐፍ ቅዱስ አገላለጽ ይጠብቃል።
- source_word: καθὼς εἶπεν ὁ θεὸς
  choice: እግዚአብሔርም እንዲህ ብሏል
  rationale: ቀጥሎ ያለውን ቀጥተኛ ጥቅስ በተፈጥሯዊ አማርኛ ያስተዋውቃል፤ καθώς የያዘው የማስረጃ ግንኙነትም ይታያል።
- source_word: Ἐνοικήσω ἐν αὐτοῖς
  choice: በመካከላቸው እኖራለሁ
  rationale: ἐν እንደ “ውስጥ” ወይም “መካከል” ሊተረጎም ይችላል። ብዙ ቁጥር ያለው αὐτοῖς፣ የኪዳኑ ማኅበራዊ ዐውድና ቀጥሎ ያለው “በመካከላቸው እመላለሳለሁ” እዚህ “በመካከላቸው”ን ይደግፋሉ።
- source_word: ἐμπεριπατήσω
  choice: በመካከላቸውም እመላለሳለሁ
  rationale: የእግዚአብሔርን ከሕዝቡ ጋር መገኘት በሕያው የመመላለስ ምስል ያቀርባል።
- source_word: ἔσομαι αὐτῶν θεός
  choice: አምላካቸውም እሆናለሁ
  rationale: የኪዳኑን የግንኙነት አገላለጽ በተፈጥሯዊና ክብር ባለው አማርኛ ያስተላልፋል።
- source_word: λαός
  choice: ሕዝብ
  rationale: በኪዳን ቀመር ውስጥ ቃሉ የእግዚአብሔርን ሕዝብ በጋራ ያመለክታል።
theological_decisions:
- issue: የማኅበሩ ቤተ መቅደስ ምስል
  choice: እኛ የሕያው እግዚአብሔር ቤተ መቅደስ ነን
  alternative: እኛ የሕያው እግዚአብሔር አንድ ቤተ መቅደስ ነን
  rationale: በግሪኩ የመስሪያ ስም ሆኖ የቀረበው ναὸς በዚህ ስፍራ የማንነትና የተወሰነነት ኃይል አለው። “ቤተ መቅደስ” ማለት ጉባኤውን በጋራ የሚያመለክተውን የጳውሎስን ዘይቤ ይጠብቃል፤ “አንድ” የሚል ያልተገለጸ ትርጉምም አያስገባም።
- issue: የመለኮታዊ ማደር አገላለጽ
  choice: በመካከላቸው እኖራለሁ
  alternative: በእነርሱ ውስጥ እኖራለሁ
  rationale: ጥቅሱ ማኅበሩን በጋራ የሚመለከት የኪዳን አገላለጽ ነው። “በመካከላቸው” ይህን የጋራ ትርጉምና ከ“እመላለሳለሁ” ጋር ያለውን ትይዩነት ይጠብቃል፤ “በእነርሱ ውስጥ” የሚለው እውነተኛ የቃል አማራጭ በማስታወሻ ተጠብቋል።
