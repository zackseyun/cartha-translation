id: 2CO.6.6
reference: 2 Corinthians 6:6
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐν ἁγνότητι, ἐν γνώσει, ἐν μακροθυμίᾳ, ἐν χρηστότητι, ἐν πνεύματι ἁγίῳ, ἐν ἀγάπῃ ἀνυποκρίτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/006.yaml
  text: in purity[a], in knowledge, in patience, in kindness, in the Holy Spirit, in sincere love,
translation:
  language: am
  text: በንጽሕና፣ በእውቀት፣ በትዕግሥት፣ በደግነት፣ በመንፈስ ቅዱስ[a]፣ በቅን ፍቅር፣
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በቅዱስ መንፈስ»፤ አገላለጹ መንፈስ ቅዱስን ሳይሆን የሰውን ቅዱስ ውስጣዊ ዝንባሌ የሚገልጥ ከሆነ።
    reason: alternative_reading
lexical_decisions:
- source_word: ἁγνότητι
  choice: በንጽሕና
  rationale: ἁγνότης ሰፊ የሥነ ምግባር ንጽሕናን ያመለክታል፤ «ንጽሕና» ቃሉን በጾታዊ ንጽሕና ብቻ ሳይገድብ ተፈጥሯዊ ትርጉሙን ይጠብቃል።
- source_word: γνώσει
  choice: በእውቀት
  rationale: γνῶσις እውቀትን፣ በዚህም አውድ ምናልባት ተግባራዊና መንፈሳዊ ግንዛቤን ያካትታል፤ «እውቀት» ስፋቱን ይጠብቃል።
- source_word: μακροθυμίᾳ
  choice: በትዕግሥት
  rationale: μακροθυμία በሰዎች ወይም በችግር ፊት ለረጅም ጊዜ መታገሥን ያመለክታል፤ «ትዕግሥት» ዘመናዊና ግልጽ ነው።
- source_word: χρηστότητι
  choice: በደግነት
  rationale: χρηστότης ለሌሎች በጎና ርኅሩኅ መሆንን ያመለክታል፤ «ደግነት» ይህን ግንኙነታዊ ባሕርይ በተፈጥሮ ይገልጣል።
- source_word: πνεύματι ἁγίῳ
  choice: በመንፈስ ቅዱስ
  rationale: ያለ መስተዋድድ መጣጥፍ ቢሆንም የጳውሎስ አጠቃቀምና አውዱ መለኮታዊውን መንፈስ ቅዱስ ማመልከቱን ይበልጥ ይደግፋሉ።
- source_word: ἀγάπῃ ἀνυποκρίτῳ
  choice: ግብዝነት በሌለበት ፍቅር
  rationale: ἀνυπόκριτος ማስመሰል ወይም ግብዝነት የሌለበትን ያመለክታል፤ ይህ አተረጓጎም ከ«ፍቅር» ጋር ተፈጥሯዊ ሆኖ ሙሉ ትርጉሙን ይገልጣል።
- source_word: ἐν
  choice: በ-
  rationale: ተደጋጋሚው ἐν የአካሄድ፣ የመሣሪያ ወይም የሁኔታ ግንኙነትን ሊያመለክት ይችላል፤ የአማርኛው «በ-» ይህን ስፋትና የዝርዝሩን ምት ይጠብቃል።
theological_decisions:
- issue: የπνεύματι ἁγίῳ አመልካች
  choice: መለኮታዊው መንፈስ ቅዱስ
  alternative: ቅዱስ መንፈስ ወይም ቅዱስ ዝንባሌ እንደ ሰው ውስጣዊ ባሕርይ
  rationale: በጳውሎስ የተለመደው አጠቃቀም መለኮታዊውን መንፈስ ቅዱስ ማመልከቱን ይበልጥ ይደግፋል። ሆኖም የግሪኩ አገላለጽ የሰውን ቅዱስ መንፈስ ወይም ዝንባሌ ሊገልጥ የሚችል በመሆኑ አማራጩ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ተደጋጋሚ ἐν በ«በ-» ተንጸባርቋል፤ በመጨረሻው ሐረግ ግን ተፈጥሯዊ የአማርኛ አገባብ ለመጠበቅ «ግብዝነት በሌለበት ፍቅር» ተብሏል።
