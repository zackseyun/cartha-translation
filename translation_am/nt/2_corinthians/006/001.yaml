  text: Συνεργοῦντες δὲ καὶ παρακαλοῦμεν μὴ εἰς κενὸν τὴν χάριν τοῦ θεοῦ δέξασθαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/001.yaml
  text: Working together with him[a], we also urge you not to receive the grace of God in vain.
translation:
  language: am
  text: ከእርሱ ጋር ተባብረን[a]፣ የእግዚአብሔርን ጸጋ በከንቱ እንዳትቀበሉ ደግሞ እንማጸናችኋለን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እንደ አብሮ ሠራተኞች ሆነን፣ ደግሞ እንማጸናችኋለን»። የግሪኩ ተሳቢ ግስ ጳውሎስ ከማን ጋር እንደሚሠራ በግልጽ ሳይጠቅስ ሊተረጎም ይችላል፤ ነገር ግን አውዱ እግዚአብሔርን በጽኑ ያመለክታል።
    reason: alternative_reading
lexical_decisions:
- source_word: Συνεργοῦντες
  choice: ከእርሱ ጋር አብረን እየሠራን
  rationale: የግሱን ተግባራዊ ኃይል ይጠብቃል። ግሪኩ አብሮ የሚሠራውን ወገን በስም ባይገልጽም፣ 5፥18–20 ያለው አውድ እግዚአብሔርን በጽኑ ያመለክታል፤ ስለዚህ «ከእርሱ ጋር» ለተፈጥሯዊ አማርኛ ተጨምሯል፣ አማራጩም በግርጌ ማስታወሻ ተጠብቋል።
- source_word: δὲ
  choice: —
  rationale: እዚህ ጠንካራ ተቃርኖ ሳይሆን ረጋ ያለ የንግግር ሽግግር ነው፤ በአማርኛው የዓረፍተ ነገር ፍሰት ውስጥ ተዋሕዷል።
- source_word: καὶ
  choice: ደግሞ
  rationale: ማሳሰቡ ከአብሮ መሥራቱ ጋር የተጨመረ ተግባር መሆኑን በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: παρακαλοῦμεν
  choice: እናሳስባችኋለን
  rationale: ቃሉ ያለውን የጽኑ ልመናና ማበረታቻ ኃይል በግልጽና በክብር የተሞላ ዘመናዊ አማርኛ ይገልጣል።
- source_word: μὴ
  choice: እንዳት-
  rationale: ከማሳሰቢያ ግስ በኋላ የሚመጣውን አሉታዊ የዓላማ አወቃቀር በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: εἰς κενὸν
  choice: በከንቱ
  rationale: «ያለ ውጤት» ወይም «ያለ ፋይዳ» የሚለውን ፈሊጣዊ ትርጉም አጭርና ኃይለኛ በሆነ አማርኛ ይጠብቃል።
- source_word: χάριν
  choice: ጸጋ
  rationale: በጳውሎስ አጠቃቀም ያለውን የእግዚአብሔር ቸርነትና የጸጋ ተግባር የሚገልጽ የተመሰረተ እና ትክክለኛ ቃል ነው።
- source_word: τοῦ θεοῦ
  choice: የእግዚአብሔርን
  rationale: የግሪኩን የባለቤትነት/ምንጭ ዝምድና በቀጥታ ይጠብቃል፣ «ከእግዚአብሔር የመጣውን» ብሎ ከሚተረጉመውም ያነሰ ትርጓሜ ያክላል።
- source_word: δέξασθαι
  choice: እንዳትቀበሉ
  rationale: «መቀበል» የδέχομαιን መሠረታዊ ትርጉምና የአንቀጹን መንፈሳዊ ክብደት ይጠብቃል።
- source_word: ὑμᾶς
  choice: -ችሁ- / -ችኋለን
  rationale: የግሪኩ የብዙ ቁጥር ሁለተኛ መደብ ተውላጠ ስም በአማርኛ ግስ ቅጥያዎች በትክክል ተገልጧል።
theological_decisions:
- issue: «Συνεργοῦντες» የሚለው አብሮ የመሥራት ግስ ያልተገለጸ ተባባሪ
  choice: «ከእርሱ ጋር አብረን እየሠራን»፤ «እርሱ» በአውዱ እግዚአብሔርን ያመለክታል።
  alternative: «አብረን እየሠራን» ወይም «እንደ አብሮ ሠራተኞች» ብሎ ተባባሪውን ሳይገልጹ መተርጎም።
  rationale: ቀዳሚው አውድ የእርቅን ሥራ ለእግዚአብሔር ይሰጣል፣ ጳውሎስንም እንደ መልእክተኛ ያቀርባል (5፥18–20)። ሆኖም ግሪኩ ተባባሪውን በግልጽ ስላልሰየመ፣ እውነተኛው ሰዋሰዋዊ አሻሚነት በግርጌ ማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ጸጋ» የተለመደውን መጽሐፍ ቅዱሳዊ ክብደት ይጠብቃል፤ «እናሳስባችኋለን» ደግሞ ከጥንታዊ ወይም ከቴክኒካዊ አነጋገር ይልቅ ተፈጥሯዊ ሆኖ የጽኑ ጥሪውን ኃይል ያስተላልፋል።
