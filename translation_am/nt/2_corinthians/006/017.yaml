  text: διὸ ἐξέλθατε ἐκ μέσου αὐτῶν, καὶ ἀφορίσθητε, λέγει κύριος, καὶ ἀκαθάρτου μὴ ἅπτεσθε· κἀγὼ εἰσδέξομαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/017.yaml
  text: Therefore[a], come out from among them and be separate, says the Lord, and do not touch what is unclean[c][b]; and I will receive you.
translation:
  language: am
  text: ስለዚህ፣ “ከመካከላቸው ውጡ፤ ተለዩም[a]፤ ጌታ ይላል። ርኩስ የሆነውን አትንኩ[b][c]፤ እኔም እቀበላችኋለሁ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለብቻችሁ ተለዩ” ወይም “የተለያችሁ ሁኑ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ርኩስ የሆነ ማንኛውንም ነገር አትንኩ።”
    reason: lexical_alternative
  - marker: c
    text: ጳውሎስ የብሉይ ኪዳንን ትንቢታዊ አነጋገር፣ በተለይም ኢሳይያስ 52፥11ን፣ እያስተጋባ ነው።
    reason: cross_reference
lexical_decisions:
- source_word: διὸ
  choice: ስለዚህ
  rationale: ከቀደመው ሐሳብ የሚወጣውን ድምዳሜ በተፈጥሯዊና ግልጽ አማርኛ ያመለክታል።
- source_word: ἐξέλθατε
  choice: ውጡ
  rationale: የብዙ ቁጥር ቀጥተኛ ትእዛዝ ሲሆን፣ ቆራጥ የመውጣት ጥሪውን ይጠብቃል።
- source_word: ἐκ μέσου αὐτῶν
  choice: ከመካከላቸው
  rationale: የቦታንም ሆነ የማኅበራዊ መለየትን ገጽታ በአጭርና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἀφορίσθητε
  choice: ተለዩ
  rationale: የመለየት ትእዛዙን ይጠብቃል፤ የግሪኩን ተገብሮአዊ ቅርጽ በአማርኛ ሙሉ በሙሉ ማንጸባረቅ ባይቻልም፣ የግል ወይም የኑፋቄ ትርጓሜ አያስገባም።
- source_word: λέγει κύριος
  choice: ጌታ ይላል
  rationale: የነቢያትን የጥቅስ አነጋገር በተለመደ አማርኛ ይጠብቃል።
- source_word: ἀκαθάρτου
  choice: ርኩስ የሆነውን
  rationale: ግሪኩ አንድን የተወሰነ ነገር ሳይጠቅስ የርኩሰትን ምድብ ያመለክታል፤ ይህ አተረጓጎም ያንን ክፍትነት ይጠብቃል።
- source_word: μὴ ἅπτεσθε
  choice: አትንኩ
  rationale: በንጽሕናና በመለየት ምስል ውስጥ ያለውን ‘መንካት’ የሚለውን መሠረታዊ ትርጉም ይይዛል።
- source_word: κἀγὼ
  choice: እኔም
  rationale: καί እና ἐγώ የተዋሐዱበትን ቅርጽና በ‘እኔ’ ላይ ያለውን አጽንዖት በተፈጥሯዊ ሁኔታ ይጠብቃል።
- source_word: εἰσδέξομαι ὑμᾶς
  choice: እቀበላችኋለሁ
  rationale: በበጎ ፈቃድ መቀበልን ያመለክታል፤ ለትንቢታዊና ለቃል ኪዳናዊ አውዱም ተስማሚ ነው።
theological_decisions:
- issue: በብሉይ ኪዳን ዳራ ባለው ትንቢታዊ ጥቅስ ውስጥ κύριοςን መተርጎም
  choice: ጌታ
  alternative: እግዚአብሔር
  rationale: የግሪኩ የአዲስ ኪዳን ጽሑፍ κύριος ይላል። የብሉይ ኪዳኑን ዳራ አምኖ ሳለ፣ በግሪኩ ላይ የሌለውን መለኮታዊ ስም በቀጥታ አያስገባም።
- issue: የመለየት ትእዛዙ ወሰን
  choice: ተለዩ
  alternative: ራሳችሁን ለዩ / የተለያችሁ ሁኑ
  rationale: ጽሑፉ የሚጠይቀውን ግልጽ ልዩነት ይገልጻል፤ ነገር ግን ከሰዎች ሁሉ ሙሉ በሙሉ መገለልን ወይም የተወሰነ የኑፋቄ አተገባበርን አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የትንቢታዊ ጥቅሱን ቅርጽ ለማሳየት የጥቅስ ምልክቶች ገብተዋል፤ የግሪኩ ሥርዓተ ነጥብና የንግግሩ ፍሰት በተፈጥሯዊ የአማርኛ ሥርዓተ ነጥብ ተቀርጿል።
