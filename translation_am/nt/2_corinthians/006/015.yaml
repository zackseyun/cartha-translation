id: 2CO.6.15
reference: 2 Corinthians 6:15
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τίς δὲ συμφώνησις ⸀Χριστοῦ πρὸς Βελιάρ, ἢ τίς μερὶς πιστῷ μετὰ ἀπίστου;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/015.yaml
  text: And what harmony is there between Messiah and Beliar? Or what share does a believer have with an unbeliever?[a]
translation:
  language: am
  text: እና በመሲሑና በቤልያር መካከል ምን ስምምነት አለ? ወይስ አማኝ ከማያምን ሰው ጋር ምን ድርሻ አለው?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቤልያር፦ በግሪክ Βελιάρ፤ ስሙ «ቤልያል» በሚለው ሌላ ቅርጽም ይታወቃል።
    reason: alternative_reading
lexical_decisions:
- source_word: συμφώνησις
  choice: ስምምነት
  rationale: ቃሉ መስማማትን፣ መጣጣምን ወይም አብሮ መሄድን ያመለክታል፤ «ስምምነት» በዚህ የንጽጽር ጥያቄ ውስጥ ተፈጥሯዊና ግልጽ ነው።
- source_word: Χριστοῦ
  choice: መሲሑ
  rationale: Χριστός እዚህ የማዕረግ ኃይሉን ይዞ ከቤልያር ጋር በተቃርኖ ቀርቧል፤ «መሲሑ» ይህን የማዕረግ ትርጉም ያስቀምጣል።
- source_word: Βελιάρ
  choice: ቤልያር
  rationale: በግሪኩ የተጻፈውን Βελιάρ በቀጥታ የሚከተል የስም ፊደል ማስተላለፍ ነው፤ የተለመደው ሌላ ቅርጽ በማስታወሻ ተጠቅሷል።
- source_word: μερίς
  choice: ድርሻ
  rationale: ቃሉ አንድ ሰው ያለውን ክፍል ወይም ተሳትፎ ያመለክታል፤ «ድርሻ» በአማርኛ ይህን በግልጽ ያስተላልፋል።
- source_word: πιστῷ
  choice: አማኝ
  rationale: ቅጽሉ እዚህ እንደ ስም ሆኖ የሚያምንን ሰው ያመለክታል፤ «አማኝ» አጭርና ተፈጥሯዊ ነው።
- source_word: ἀπίστου
  choice: የማያምን ሰው
  rationale: ከπιστῷ ጋር ባለው ተቃርኖ እምነት የሌለውን ሰው ያመለክታል፤ «የማያምን ሰው» ከ«እምነት የለሽ» ይልቅ ገለልተኛና ቀጥተኛ ነው።
- source_word: πρὸς
  choice: በ…ና በ… መካከል
  rationale: ከσυμφώνησις ጋር ሲገናኝ የሁለት ወገኖችን ግንኙነት ያሳያል፤ ይህ አወቃቀር በአማርኛ ተፈጥሯዊ ነው።
- source_word: μετὰ
  choice: ከ… ጋር
  rationale: የአብሮነትን ወይም የግንኙነትን ሐሳብ በቀጥታ ያስተላልፋል።
- source_word: δὲ
  choice: እና
  rationale: δέ እዚህ ተከታታይ የንጽጽር ጥያቄዎችን ይቀጥላል፤ «እና» ፍሰቱን ሳያጠናክር ያቆያል።
theological_decisions:
- issue: የΧριστός አተረጓጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: በዚህ ተቃርኖ Χριστός እንደ ማዕረግ ጎልቶ ይታያል፤ «መሲሑ» የ«ተቀባው»ን ማዕረጋዊ ትርጉም ይጠብቃል።
- issue: የΒελιάρ መለያ
  choice: ቤልያር እንደ ተገቢ ስም በፊደል ማስተላለፍ
  alternative: ቤልያል
  rationale: ዋናው ጽሑፍ ያለውን የግሪክ ቅርጽ ሳይተረጉም ያቆያል፤ የሚታወቀው ሌላ ቅርጽ ግን ለአንባቢው በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ሁለቱ የንጽጽር ጥያቄዎች እና የግሪኩ ሚዛናዊ አወቃቀር ተጠብቀዋል።
