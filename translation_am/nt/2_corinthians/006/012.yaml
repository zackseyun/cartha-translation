review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the negation, the contrasting δέ, and the repeated passive image of στενοχωρεῖσθε. However, “በእኛ የተነሳ” can sound merely causal (“because of us”) rather than identifying Paul and his coworkers as the alleged source of restriction. “በእኛ በኩል” expresses the relational/source sense more naturally. “በራሳችሁ ፍቅር ውስጥ” is understandable but is less idiomatic and makes the possessive emphasis awkward; “በራሳችሁ ፍቅራችሁ” better conveys the figurative σπλάγχνα as their own affections while retaining the inward-location metaphor through በ.
  naturalness: The revision uses natural modern standard Amharic and keeps the compact, balanced rhetorical form of the Greek. It avoids the somewhat awkward nominal construction “የተገደባችሁት ... ነው” while retaining the same passive verb in both clauses.
  terminology: “ተገድባችኋል” consistently renders στενοχωρεῖσθε in both clauses. “ፍቅራችሁ” is a contextually appropriate figurative rendering of σπλάγχνα, denoting affectionate feeling rather than literal internal organs. The footnote provides a more literal alternative, including “በእኛ ውስጥ” and “ልባችሁ,” without presenting it as the sole meaning.
  issues:
  - severity: medium
    issue: The phrase “በእኛ የተነሳ” is potentially over-causal.
    rationale: It may be heard as “because of us,” whereas ἐν ἡμῖν here contrasts the location/source of the Corinthians’ constraint with their own affections.
  - severity: low
    issue: “በራሳችሁ ፍቅር ውስጥ” is stylistically awkward and weakly marks the possessive.
    rationale: The source explicitly has “your” affections. “በራሳችሁ ፍቅራችሁ” is more idiomatic and clearly places the limitation in their own affections.
  revised_text: ከእኛ በኩል አልተገደባችሁም፤ በራሳችሁ ፍቅራችሁ ግን ተገድባችኋል።[a]
  revised_footnotes:
