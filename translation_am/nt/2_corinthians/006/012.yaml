  yaml_path: translation/nt/2_corinthians/006/012.yaml
  text: You are not restricted by us[a], but you are restricted in your own affections.
translation:
  language: am
  text: ከእኛ በኩል አልተገደባችሁም፤ በራሳችሁ ፍቅራችሁ ግን ተገድባችኋል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በእኛ ውስጥ አልተጨናነቃችሁም፤ በራሳችሁ ልባችሁ ውስጥ ግን ተጨናንቃችኋል።”
    reason: ἐν ἡμῖν እና ἐν τοῖς σπλάγχνοις ὑμῶν የሚያሳዩትን የቃል በቃል የ“ውስጥ” ምስል እና στενοχωρεῖσθε የሚለውን “መጨናነቅ” አማራጭ ለማሳየት።
lexical_decisions:
- source_word: στενοχωρεῖσθε
  choice: ተገደባችሁ
  rationale: ግሱ በጠባብ ስፍራ መጨናነቅን፣ በምሳሌያዊ አገባብም መገደብን ያመለክታል። በሁለቱም ሐረጎች ተመሳሳይ ቃል መጠቀሙ የጳውሎስን ንጽጽር ይጠብቃል።
- source_word: ἐν ἡμῖν
  choice: በእኛ የተነሳ
  rationale: ἐν በቀጥታ ‘በ…ውስጥ’ ሊባል ቢችልም፣ እዚህ ገደቡ ከጳውሎስና ከባልደረቦቹ እንዳልመጣ የሚያሳይ የምንጭ ወይም የምክንያት አገባብ ነው።
- source_word: δὲ
  choice: ግን
  rationale: በሁለቱ ሐረጎች መካከል ያለውን ግልጽ ንጽጽር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐν τοῖς σπλάγχνοις ὑμῶν
  choice: በራሳችሁ ፍቅር ውስጥ
  rationale: σπλάγχνα በቃል የውስጥ አካላትን፣ በምሳሌያዊ አገባብ ግን ጥልቅ ስሜትን፣ ፍቅርንና ርኅራኄን ያመለክታል። ‘ፍቅር’ የአንቀጹን ግንኙነታዊ አውድ በተፈጥሯዊ አማርኛ ይገልጣል፤ ‘በራሳችሁ’ ደግሞ ገደቡ በእነርሱ ውስጥ መሆኑን ያጎላል።
- source_word: οὐ
  choice: አል…ም
  rationale: የመጀመሪያውን ሐረግ የሚክድ መደበኛ የአማርኛ አሉታዊ አወቃቀር ነው።
theological_decisions:
- issue: የσπλάγχνα ምሳሌያዊ ትርጉም
  choice: የቆሮንቶስ ሰዎች ውስጣዊ ፍቅርና ስሜታዊ ክፍትነት
  alternative: ቀጥተኛው ‘የውስጥ አካላት’ ወይም አጠቃላዩ ‘ልብ’
  rationale: አውዱ ጳውሎስ ለእነርሱ ያለውን ክፍትነት ከእነርሱ የተገደበ ምላሽ ጋር ያነጻጽራል። ስለዚህ ቃሉ ሥጋዊ አካልን ሳይሆን ጥልቅ ውስጣዊ ፍቅርን ያመለክታል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የመገደብ ቃል መደገሙ የግሪክ ጽሑፉን የንጽጽር አወቃቀር ይጠብቃል።
