  text: ነገር ግን ወንድሞቹን ላክሁ፤ ስለ እናንተ ያለን መመካት በዚህ ጉዳይ[b] ከንቱ እንዳይሆን[a]፣ እኔ እንደ ተናገርኩትም ተዘጋጅታችሁ እንድትገኙ ነው።
