  text: being enriched in every way for all generosity[a], which through us produces thanksgiving to God—
translation:
  language: am
  text: በሁሉም ነገር ለልግስና[a] ሁሉ ባለጠጎች እየተደረጋችሁ ነው፤ ይህም በእኛ በኩል ለእግዚአብሔር ምስጋናን ያስገኛል—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ልግስና” የተተረጎመው የግሪክ ቃል በሌሎች ዐውዶች “ቅንነት” ወይም “ቀላልነት” ማለት ሊሆን ይችላል፤ እዚህ ግን የመስጠት ዐውድ “ልግስና” የሚለውን ትርጉም ይደግፋል።
