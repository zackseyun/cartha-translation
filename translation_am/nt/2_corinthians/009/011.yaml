lexical_decisions:
- source_word: ἐν παντὶ
  choice: በሁሉም ነገር
  rationale: የግሪኩን ሰፊና ሁሉን አቀፍ አገላለጽ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: πλουτιζόμενοι
  choice: ባለጠጎች እየተደረጋችሁ
  rationale: የአሁን ጊዜ ተደራጊ አንቀጽንና እግዚአብሔር ያልተጠቀሰው አድራጊ መሆኑን ይጠብቃል፤ ሀብቱም ለመስጠት የሚያስችል እንጂ የብልጽግና ተስፋ እንዳይመስል ዐውዱ ይገድበዋል።
- source_word: εἰς πᾶσαν ἁπλότητα
  choice: ለልግስና ሁሉ
  rationale: εἰς የዓላማን ወይም የውጤትን አቅጣጫ ያሳያል፤ ἁπλότης በዚህ የስጦታ ዐውድ ውስጥ ለጋስነትን ያመለክታል።
- source_word: ἥτις
  choice: ይህም ልግስና
  rationale: ተውላጠ ስሙ ወደ ቀድሞው ልግስና መመለሱን በአማርኛ ግልጽ ያደርጋል።
- source_word: κατεργάζεται
  choice: ያስገኛል
  rationale: ግሱ አንድን ውጤት ማስከተልን ያመለክታል፤ ‘ያስገኛል’ ተፈጥሯዊና ትክክለኛ ነው።
- source_word: δι’ ἡμῶν
  choice: በእኛ በኩል
  rationale: ጳውሎስና ባልደረቦቹ ስጦታውን የሚያደርሱበትን መካከለኛ ሚና ሳይጨምር ያስተላልፋል።
- source_word: εὐχαριστίαν τῷ θεῷ
  choice: ለእግዚአብሔር ምስጋናን
  rationale: የስም ሐረጉንና ምስጋናው ወደ እግዚአብሔር መቅረቡን ይጠብቃል።
theological_decisions:
- issue: በስጦታው ዐውድ ውስጥ የἁπλότης ትርጉም
  choice: ልግስና፣ ማለትም እጅን ከፍቶ መስጠት
