  rationale: ቃሉ በሌሎች ዐውዶች ቅንነትን ወይም ቀላልነትን ሊያመለክት ቢችልም፣ እዚህ የገንዘብ ስጦታና ከእርሱ የሚመጣው ምስጋና ዐውድ ልግስናን ይደግፋል።
translation_notes:
