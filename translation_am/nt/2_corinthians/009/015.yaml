  rationale: ጥቅሱ ራሱ ‘ስጦታው’ ብቻ ይላል። ቅርብ አውዱ ጸጋና ለጋስነትን ሲያነሳ፣ ታሪካዊ የክርስቲያን ንባብ ደግሞ ክርስቶስን በማዕከል ያያል። ጽሑፉ ያልወሰነውን ትርጉም ላለመወሰን አገላለጹ አልተጠበበም።
