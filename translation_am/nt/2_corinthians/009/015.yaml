lexical_decisions:
- source_word: χάρις
  choice: ምስጋና ይሁን
  rationale: ከተቀባይ ተሳቢው τῷ θεῷ ጋር በዚህ የአድናቆት አገላለጽ ውስጥ χάρις ማለት ‘ጸጋ’ ሳይሆን ምስጋናን ያመለክታል፤ ‘ምስጋና ይሁን’ የግሪኩን የውዳሴ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τῷ θεῷ
  choice: ለእግዚአብሔር
  rationale: የምስጋናውን ተቀባይ የሚያመለክት ተሳቢ ስለሆነ ‘ለእግዚአብሔር’ ተብሎ ቀጥተኛና ተፈጥሯዊ ሆኖ ተተርጉሟል።
- source_word: ἐπὶ
  choice: ስለ
  rationale: ከተሳቢ ጋር የምስጋናውን ምክንያት ወይም መሠረት ያሳያል፤ ‘ስለ’ ይህን ግንኙነት በአጭርና በተለመደ አማርኛ ይገልጣል።
- source_word: ἀνεκδιηγήτῳ
  choice: ሊነገር ስለማይችለው
  rationale: ቅጽሉ በሙሉ በቃላት ሊተረክ ወይም ሊገለጽ የማይችልን ነገር ያመለክታል፤ ይህ ሐረግ ትርጉሙን በግልጽና በዘመናዊ አማርኛ ያቀርባል።
- source_word: αὐτοῦ
  choice: ስጦታው
  rationale: የሦስተኛ መደብ ወንድ ነጠላ አመልካች ቅጥያው በአውዱ ወደ እግዚአብሔር ይመለሳል፤ በአማርኛ ‘ስጦታው’ የባለቤትነት ግንኙነቱን በተፈጥሯዊ መንገድ ይገልጣል።
- source_word: δωρεᾷ
  choice: ስጦታ
  rationale: δωρεά በነፃ የተሰጠን ስጦታ ያመለክታል፤ ‘ስጦታ’ ብቻውን በቂ ስለሆነ ‘ነፃ’ የሚል ተጨማሪ ቃል አልገባም።
