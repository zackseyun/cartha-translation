translation:
  language: am
  text: እያንዳንዱ ሰው በልቡ እንደወሰነ ይስጥ፤ በሐዘን[a] ወይም በግድ አይስጥ፤ እግዚአብሔር በደስታ የሚሰጥን ሰው ይወዳልና።
  philosophy: optimal-equivalence
  footnotes:
