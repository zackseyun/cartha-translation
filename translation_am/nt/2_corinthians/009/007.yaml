    text: ወይም፣ “ሳይወድ” ወይም “በጸጸት።” የግሪኩ ቃል በቀጥታ “ከሐዘን” ወይም “ከልብ መከፋት” ማለት ነው።
    reason: lexical_alternative
lexical_decisions:
