base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/006.yaml
  text: 'This: the one who sows sparingly will also reap sparingly[a], and the one who sows with blessings will also reap with blessings.'
translation:
  language: am
  text: ነገሩ ይህ ነው፦ በጥቂት የሚዘራ በጥቂት ያጭዳል፤ በበረከት[a] የሚዘራም በበረከት ያጭዳል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በበረከት” የሚለው “በልግስና” ወይም “በብዛት” ተብሎም ሊተረጎም ይችላል። ግሪኩ “በረከቶች” የሚለውን ስም ይጠቀማል፤ በዚህ አውድ ግን ለጋስ መጠንን በፈሊጥ ሊገልጽ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο δέ
  choice: ነገሩ ይህ ነው፦
  rationale: የግሪክ ሐረጉ የሚከተለውን መርሕ በአጽንዖት ያስተዋውቃል። ይህ አተረጓጎም በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን በጽሑፉ የሌለ የጊዜ ትርጉም አይጨምርም።
- source_word: ὁ σπείρων
  choice: የሚዘራ
  rationale: በአጠቃላይ ለማንኛውም ዘሪ የሚሠራውን ምሳሌያዊ አነጋገር እና የተሳቢ አንቀጹን ቅርጽ ይጠብቃል።
- source_word: φειδομένως
  choice: በጥቂት
  rationale: በዘር ምሳሌው ውስጥ መጠኑን ቀንሶ መዝራትን በግልጽ ያሳያል፤ ከምንጩ በላይ የሆነ የስስት ወቀሳ አይጨምርም።
- source_word: καὶ θερίσει
  choice: ያጭዳል
  rationale: የወደፊት ውጤቱን በተፈጥሯዊ የአማርኛ አገላለጽ ያቀርባል፤ የ‘ደግሞ’ ተዛማጅነት በሁለቱ ትይዩ ሐረጎችና በ‘-ም’ ተጠብቋል።
- source_word: ἐπ’ εὐλογίαις
  choice: በበረከት
  rationale: εὐλογία የሚለውን የ‘በረከት’ ስም በሁለቱም ቦታ በመጠበቅ የጳውሎስን የቃል ድግግሞሽና ከበረከት ጋር ያለውን ትስስር ያቆያል፤ በዚህ አውድ ‘በልግስና/በብዛት’ የሚለው ፈሊጣዊ ትርጉምም ሊኖረው ይችላል።
theological_decisions:
- issue: ἐπ’ εὐλογίαις በልግስና መስጠትን ወይስ ‘በረከትን’ በቃል በቃል ያመለክታል?
  choice: ዋናው ጽሑፍ ‘በበረከት’ የሚለውን የስም ቅርጽ ይጠብቃል።
  alternative: ‘በልግስና’ ወይም ‘በብዛት’ ተብሎ ፈሊጣዊ ትርጉሙን መግለጽ።
  rationale: አውዱ ልግስናን ቢያመለክትም የግሪኩ ስም ‘በረከት’ የሚለውን ሥነ መለኮታዊ ድምፀት ይይዛል። ይህን በዋናው ጽሑፍ ማቆየት ጥቅሱን ለቁሳዊ ብልጽግና እንደ ማይቀር ዋስትና አያቀርበውም፤ የመዝራትና የማጨድ ተዛማጅነትን እንደ ምሳሌያዊ መርሕ ይተዋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የመዝራትና የማጨድ ትይዩነት፣ የቃላት ድግግሞሽ እና የ‘በረከት’ አሻሚነት ተጠብቀዋል።
