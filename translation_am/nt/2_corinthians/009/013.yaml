  text: διὰ τῆς δοκιμῆς τῆς διακονίας ταύτης δοξάζοντες τὸν θεὸν ἐπὶ τῇ ὑποταγῇ τῆς ὁμολογίας ὑμῶν εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ καὶ ἁπλότητι τῆς κοινωνίας εἰς αὐτοὺς καὶ εἰς πάντας,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/013.yaml
  text: Because of the proof provided by this ministry[a], they glorify God for the obedience of your confession to the gospel of the Messiah and for the generosity of your sharing with them and with everyone[d][c][b],
translation:
  language: am
  text: በዚህ አገልግሎት በተሰጠው ማረጋገጫ ምክንያት፣ ለመሲሑ ወንጌል ባደረጋችሁት ኑዛዜ የሚታየውን ታዛዥነታችሁን፣ እንዲሁም ለእነርሱና ለሁሉም በልግስና መካፈላችሁን ስለሚያዩ፣ እግዚአብሔርን ያከብራሉ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “የዚህ አገልግሎት ማረጋገጫ ምክንያት፣ ለመሲሑ ወንጌል የኑዛዜአችሁ ታዛዥነትና ለእነርሱም ሆነ ለሁሉ የልግስና መካፈላችሁ ስለሆነ።” እዚህ “መካፈል” በተለይ ለቁሳዊ እርዳታ የሚደረግ ልግስናን ሊያመለክት ይችላል።
    reason: የὑποταγῇ τῆς ὁμολογίας ጥብቅ የሰዋስው ግንኙነትን እና በዚህ ዐውድ κοινωνία የሚያመለክተውን ቁሳዊ ተካፋይነት ለማሳየት።
lexical_decisions:
- source_word: δοκιμῆς τῆς διακονίας ταύτης
  choice: በዚህ አገልግሎት በተረጋገጠው ታማኝነታችሁ
  rationale: δοκιμή በዐውዱ ፈተናውን ብቻ ሳይሆን በአገልግሎቱ የተገለጠውን የተፈተነ ባሕርይ ያመለክታል፤ ‘የተረጋገጠ ታማኝነት’ ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δοξάζοντες τὸν θεόν
  choice: እግዚአብሔርን ያከብራሉ
  rationale: የግሪኩ ተሳቢ ግስ በአማርኛ ለግልጽነት ዋና ግስ ሆኖ ቀርቧል፤ ‘ያከብራሉ’ የδοξάζωን ክብደት ይጠብቃል።
- source_word: ὑποταγῇ τῆς ὁμολογίας ὑμῶν
  choice: በምትናገሩት እምነት መሠረት ስለታዘዛችሁ
  rationale: ቃል በቃል ‘የኑዛዜአችሁ መገዛት’ በአማርኛ ግልጽ አይደለም። ይህ አቀራረብ የተናገሩት እምነትና ተግባራዊ ታዛዥነታቸው ያላቸውን ግንኙነት ያሳያል።
- source_word: εὐαγγέλιον τοῦ Χριστοῦ
  choice: የመሲሑ ወንጌል
  rationale: Χριστός እዚህ የማዕረግ ስም በመሆኑ ‘መሲሕ’ ተብሎ ተተርጉሟል፤ የግሪኩ የባለቤትነት ግንኙነትም ተጠብቋል።
- source_word: ἁπλότητι τῆς κοινωνίας
  choice: በልግስና ስላካፈላችሁ
  rationale: በመዋጮው ዐውድ ἁπλότης ልግስናን፣ κοινωνία ደግሞ በቁሳዊ እርዳታ መካፈልን ያመለክታሉ።
- source_word: εἰς αὐτοὺς καὶ εἰς πάντας
  choice: ለእነርሱና ለሁሉም ሰው
  rationale: የልግስናውን አቅጣጫና ተቀባዮች በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: Χριστοῦ እንደ ማዕረግ ወይም ስም መቅረቡ
  choice: የመሲሑ ወንጌል
  alternative: የክርስቶስ ወንጌል
  rationale: Χριστός በዚህ ሐረግ ውስጥ የተቀባውን ንጉሥ የሚያመለክት ማዕረግ ነው፤ ‘መሲሑ’ ማለት የማዕረጉን ኃይል ይጠብቃል።
- issue: ὑποταγῇ τῆς ὁμολογίας ያለው የሰዋስው ግንኙነት
  choice: በምትናገሩት እምነት መሠረት ስለታዘዛችሁ
  alternative: ለእምነት ኑዛዜአችሁ ስለተገዛችሁ
  rationale: የግሪኩ ሐረግ የኑዛዜውን ታዛዥነት ወይም ከኑዛዜው ጋር የተያያዘውን ታዛዥነት ሊያመለክት ይችላል። ዋናው ትርጉም የእምነት ንግግርንና ተግባርን ያገናኛል፤ የቃል በቃል አማራጩ በማስታወሻ ተጠብቋል።
