  choice: ለእግዚአብሔር በሚቀርቡ ብዙ ምስጋናዎች የሚትረፈረፍ
  alternative: ብዙ ምስጋናዎችን ለእግዚአብሔር የሚያበዛ
  rationale: የግሪኩ አገባብ መንገድን፣ ተጓዳኝ ሁኔታን ወይም ውጤትን ሊያመለክት ስለሚችል፣ ዋናው ትርጉም አንዱን ብቻ በግድ አይወስንም።
