  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: (καθὼς γέγραπται· Ἐσκόρπισεν, ἔδωκεν τοῖς πένησιν, ἡ δικαιοσύνη αὐτοῦ μένει εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/009.yaml
  text: 'as it is written: “He scattered abroad[a], he gave to the poor; his righteousness remains forever.”'
translation:
  language: am
  text: 'እንደተጻፈው፦


    “በተነ፤ ለድሆች ሰጠ፤

    ጽድቁም[a] ለዘላለም ይኖራል።”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ፍትሑ ለዘላለም ይኖራል።” የግሪኩ ቃል ጽድቅንም ፍትሕንም ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: እንደተጻፈው
  rationale: ቅዱሳት መጻሕፍትን ለመጥቀስ የሚያገለግለውን መደበኛ የጥቅስ መግቢያ በተፈጥሯዊና በክብር ባለው አማርኛ ያስተላልፋል።
- source_word: Ἐσκόρπισεν
  choice: በተነ
  rationale: የማሰራጨትንና በስፋት የመስጠትን ምስላዊ አገላለጽ ይጠብቃል፤ ‘አከፋፈለ’ ከሚለው ይልቅ የመዝሙሩን ግጥማዊ ኃይል ይዞ ይቀራል።
- source_word: ἔδωκεν
  choice: ሰጠ
  rationale: የግሪኩን የተፈጸመ ድርጊት በቀላል ያለፈ ጊዜ በቀጥታና በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τοῖς πένησιν
  choice: ለድሆች
  rationale: ጥቂት አቅም ያላቸውንና ችግረኞችን የሚያመለክተውን ቃል በቀጥታ ያስተላልፋል።
- source_word: ἡ δικαιοσύνη αὐτοῦ
  choice: ጽድቁ
  rationale: የδικαιοσύνηን የጽድቅና የቅን ተግባር ስፋት በአጭር መልኩ ይጠብቃል፤ የፍትሕ ትርጉሙ በማስታወሻ ተጠብቋል።
- source_word: μένει
  choice: ይኖራል
  rationale: አለመጥፋትንና ጸንቶ መቆየትን በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: εἰς τὸν αἰῶνα
  choice: ለዘላለም
  rationale: ያለ መጨረሻ መቆየትን የሚገልጽ መደበኛና ግልጽ የአማርኛ አቻ ነው።
theological_decisions:
- issue: በጳውሎሳዊ አውድ δικαιοσύνηን መተርጎም
  choice: ጽድቁ
  alternative: ፍትሑ / ፍትሐዊነቱ
  rationale: በዚህ የመዝሙር ጥቅስ ቃሉ የለጋሹን ጻድቅ ባሕርይ ወይም የጽድቅ ተግባር ሊያመለክት ይችላል። ‘ጽድቁ’ የቃሉን ሰፊ መጽሐፍ ቅዱሳዊ አጠቃቀም ሲጠብቅ፣ የፍትሕ ንባቡ በማስታወሻ ተቀምጧል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የመዝሙሩን ግጥማዊ ቅርጽ ለማሳየት ጥቅሱ በመስመር ተከፍሎ ቀርቧል፤ የግሪኩ የመበተን ምስልም ተጠብቋል።
