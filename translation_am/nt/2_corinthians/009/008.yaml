  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ተደጋጋሚ የ‘ሁሉ/ሁልጊዜ’ አጽንዖትና የ‘መብዛት’ የቃል ትይዩነት በተቻለ መጠን ተጠብቋል።
