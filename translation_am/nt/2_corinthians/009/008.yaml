base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/008.yaml
  text: And God is able to make all grace abound to you[a], so that in everything, at all times, having all sufficiency, you may abound in every good work.
translation:
  language: am
  text: እግዚአብሔርም ጸጋን ሁሉ ለእናንተ እንዲበዛ ማድረግ ይችላል፤ ይህም በሁሉም ነገር ሁልጊዜ ሙሉ በቂነት እያላችሁ፣[a] በመልካም ሥራ ሁሉ እንድትበዙ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የሚያስፈልጋችሁ ሁሉ እያላችሁ።” የግሪኩ ቃል በቂነትን፣ ተገቢ መጠን መኖርን ወይም እርካታን ሊያመለክት ይችላል፤ እዚህ ግን ሰው በራሱ ብቻ መብቃቱን ሳይሆን፣ እግዚአብሔር የሚሰጠውን በቂ አቅርቦት ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνατεῖ
  choice: ማድረግ ይችላል
  rationale: የእግዚአብሔርን ችሎታና ኃይል በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: δὲ
  choice: -ም
  rationale: ከቀደመው ንግግር ጋር ያለውን ቀላል አያያዥነት ያሳያል፤ ጠንካራ ተቃርኖ አያስገባም።
- source_word: πᾶσαν χάριν
  choice: ጸጋን ሁሉ
  rationale: የπᾶσανን ሁሉን አቀፍ አጽንዖትና የχάριςን ሰፊ መለኮታዊ ትርጉም ይጠብቃል፤ በዐውዱም ልግስናን የሚያስችል ቸር አቅርቦትን ያካትታል።
- source_word: περισσεῦσαι εἰς ὑμᾶς
  choice: ለእናንተ እንዲበዛ ማድረግ
  rationale: የጸጋውን ወደ ተቀባዮቹ መብዛትና የእግዚአብሔርን አስገኚ ተግባር ይጠብቃል።
- source_word: ἵνα
  choice: ይህም ... እንድትበዙ ነው
  rationale: የዓላማና የውጤት ግንኙነቱን በግልጽ አማርኛ ያሳያል።
- source_word: ἐν παντὶ πάντοτε
  choice: በሁሉም ነገር ሁልጊዜ
  rationale: ጳውሎስ በπαν- ቃላት የሚሰጠውን ተደጋጋሚ ሁሉን አቀፍ አጽንዖት ይጠብቃል።
- source_word: πᾶσαν αὐτάρκειαν ἔχοντες
  choice: የሚያስፈልጋችሁን ሁሉ ኖሯችሁ
  rationale: በዐውዱ ያለውን ከእግዚአብሔር የሚገኝ በቂ አቅርቦት በተፈጥሯዊ አማርኛ ይገልጣል፤ ራስን ችሎ ከሌላ ነጻ የመሆን ፍልስፍናዊ ሐሳብን አያስገባም።
- source_word: περισσεύητε
  choice: እንድትበዙ
  rationale: ከቀደመው περισσεῦσαι ጋር ያለውን የመብዛት የቃል ድግግሞሽና አጽንዖት ይጠብቃል።
- source_word: εἰς πᾶν ἔργον ἀγαθόν
  choice: በመልካም ሥራ ሁሉ
  rationale: ከ‘መብዛት’ ጋር ተፈጥሯዊ የአማርኛ አገባብ ሲሆን፣ የተሰጠው አቅርቦት ወደ ሁሉም መልካም ተግባር እንደሚያመራ ያሳያል።
theological_decisions:
- issue: በልግስና ዐውድ ውስጥ የχάρις ትርጉም
  choice: የእግዚአብሔር ሰፊ ጸጋ፣ ለልግስና የሚያበቃ አቅርቦቱንም ጨምሮ
  alternative: ጸጋዊ ሞገስ ብቻ፣ ወይም ስጦታ
  rationale: የአቅራቢያው ዐውድ ስለ መስጠት ቢናገርም χάριςን ወደ ገንዘብ ብቻ ማጥበብ አይገባም፤ ‘ጸጋ’ ሰፊውን መለኮታዊ ስፋት ይጠብቃል።
- issue: የαὐτάρκεια ትርጉም
  choice: ከእግዚአብሔር የሚገኝ በቂነት፣ ማለትም የሚያስፈልገው ሁሉ መኖር
  alternative: እርካታ፣ ወይም ራስን ችሎ መኖር
  rationale: ዐውዱ አማኞች ለጋስ እንዲሆኑ እግዚአብሔር ስለሚያቀርብላቸው ይናገራል። ስለዚህ ከእርሱ የተለየ ራስን ችሎ መኖርን አያመለክትም።
