translation:
  language: am
  text: ከእኔ ጋር መቄዶንያውያን መጥተው ዝግጁ ሳትሆኑ ቢያገኟችሁ፣ እኛ—እናንተን ሳንጠቅስ—በዚህ መተማመን እንዳንዋረድ ምናልባት።
