theological_decisions:
- issue: የጸሎቱና የናፍቆቱ አገባባዊ ግንኙነት
  choice: ሰዎቹ ስለ ቆሮንቶስ ሰዎች ጸሎት እያቀረቡ እንደሚናፍቋቸው ሁለቱንም ድርጊቶች ማቆየት
