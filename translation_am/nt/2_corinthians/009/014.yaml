  text: እነርሱም ስለ እናንተ በሚያቀርቡት ጸሎት[a]፣ በእናንተ ላይ ካለው እጅግ የበዛ የእግዚአብሔር ጸጋ የተነሣ እናንተን ይናፍቃሉ።
