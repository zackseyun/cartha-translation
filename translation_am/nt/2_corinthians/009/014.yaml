lexical_decisions:
- source_word: δέησις
  choice: ጸሎት
  rationale: ቃሉ ከልብ የሚቀርብን ልመና ሊያመለክት ቢችልም፣ «ጸሎት» በዘመናዊ አማርኛ ተፈጥሯዊና ሰፊ ትርጉም ያለው ሲሆን ስለ ሌሎች መማለድንም ያካትታል።
- source_word: αὐτῶν
  choice: እነርሱም … በሚያቀርቡት
