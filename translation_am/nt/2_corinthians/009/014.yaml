- source_word: ὑπὲρ ὑμῶν
  choice: ስለ እናንተ
  rationale: ὑπέρ ከዝርያ ቅርጽ ጋር በጸሎት አውድ «ስለ፣ ለ» የሚለውን ትርጉም ይሰጣል፤ «ስለ እናንተ» ተፈጥሯዊ ነው።
- source_word: ἐπιποθούντων
  choice: ይናፍቃሉ
  rationale: ቃሉ የቀጠለና ጥልቅ የሆነን የመጓጓት ስሜት ይገልጣል፤ የግሪኩ ተሳቢ አገባብ ለግልጽነት በአማርኛ በዋና ግስ ተተርጉሟል።
- source_word: διὰ
