- issue: ጸጋው በቆሮንቶስ ሰዎች «ላይ» ወይም «መካከል» መሆኑ
  choice: «በእናንተ ላይ ካለው» ብሎ የἐπίን ምስላዊ አገላለጽ ማቆየት
  alternative: «በእናንተ መካከል ከሚሠራው» ብሎ ጸጋውን እንደ ተግባራዊ ኃይል መግለጽ
  rationale: ጽሑፉ ἐφ’ ὑμῖν ይላል፤ «በ…ላይ» ቀጥተኛውን ምስል ይጠብቃል እንጂ ጸጋው በምን መልኩ እንደሚሠራ ተጨማሪ ትርጓሜ አያስገባም።
