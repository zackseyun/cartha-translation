  rationale: εἰς በዚህ አውድ የአገልግሎቱን አቅጣጫ ወይም ተጠቃሚዎች ሊያመለክት ይችላል። ‘ለቅዱሳን ስለሚደረገው’ በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን ሁለቱንም ገጽታዎች ይጠብቃል።
- source_word: ἁγίους
