- source_word: περισσόν
  choice: አላስፈላጊ
  rationale: በዚህ ስፍራ περισσόν ‘አስፈላጊ ያልሆነ፣ ትርፍ’ የሚል ስሜት አለው። ‘አላስፈላጊ’ የጳውሎስን የንግግር ኃይል ጠብቆ ለዘመናዊ አንባቢ ግልጽ ነው።
- source_word: μοί ἐστιν τὸ γράφειν ὑμῖν
  choice: ለእናንተ መጻፍ ለእኔ … ነው
  rationale: የግሪኩን የተውሳከ ግስ አወቃቀርና በ‘ለእኔ’ ላይ ያለውን አጽንዖት በተፈጥሯዊ አማርኛ ያስተላልፋል።
