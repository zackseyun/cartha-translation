  text: οἶδα γὰρ τὴν προθυμίαν ὑμῶν ἣν ὑπὲρ ὑμῶν καυχῶμαι Μακεδόσιν ὅτι Ἀχαΐα παρεσκεύασται ἀπὸ πέρυσι, καὶ ⸀τὸ ὑμῶν ζῆλος ἠρέθισε τοὺς πλείονας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/002.yaml
  text: 'For I know your eagerness[a], which I boast about to the Macedonians on your behalf: that Achaia has been ready since last year[c][b], and your zeal has stirred up most of them.'
translation:
  language: am
  text: ጉጉታችሁን[a] አውቃለሁና፤ ስለ እናንተም ለመቄዶንያውያን፣ “አካይያ[b] ከያለፈው ዓመት ጀምሮ ዝግጁ ሆናለች” ብዬ እመካለሁ፤ ቅንዓታችሁም ከእነርሱ አብዛኞቹን[c] አነሳስቷል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በጎ ፈቃዳችሁን” ወይም “ዝግጁነታችሁን።”
    reason: lexical_alternative
  - marker: b
    text: አካይያ ቆሮንቶስን የምታካትት የሮም አውራጃ ነበረች፤ ጳውሎስ የክልሉን ስም በዚያ ላሉ አማኞች ተወካይ አድርጎ ይጠቀማል።
    reason: cultural_note
  - marker: c
    text: ወይም፣ “ብዙኃኑን።”
    reason: lexical_alternative
lexical_decisions:
- source_word: προθυμίαν
  choice: ጉጉታችሁን
  rationale: ቃሉ በፈቃደኝነት የተሞላ ዝግጁነትንና ትጋትን ያመለክታል፤ ‘ጉጉት’ በዚህ የምስጋና አውድ ተፈጥሯዊ ሲሆን ተራ የዝግጅት ሁኔታን ብቻ አያመለክትም።
- source_word: καυχῶμαι
  choice: እመካለሁ
  rationale: የጳውሎስን ጠንካራ የንግግር አገላለጽ ሳያለዝብ በዘመናዊ አማርኛ በተፈጥሮ ያስተላልፋል።
- source_word: ὑπὲρ ὑμῶν
  choice: ስለ እናንተ
  rationale: ከκαυχῶμαι ጋር በመጣበት አውድ ጳውሎስ ለመቄዶንያ ሰዎች እነርሱን በመልካም እንደሚናገር ያሳያል።
- source_word: Μακεδόσιν
  choice: ለመቄዶንያ ሰዎች
  rationale: የቦታውን ሰዎች የሚያመለክተውን የግሪክ ዳቲቭ ብዙ ቁጥር ግልጽና ተፈጥሯዊ በሆነ አማርኛ ይገልጣል።
- source_word: Ἀχαΐα
  choice: አካይያ
  rationale: ግሪኩ የሮምን አውራጃ በስም ይጠቅሳል፤ የቦታውን ስም ማቆየት የጳውሎስን ቃልና ሰፊውን ክልላዊ ማመልከቻ ይጠብቃል።
- source_word: παρεσκεύασται
  choice: ዝግጁ ናት
  rationale: የፍጹም ጊዜው ግስ ከቀደመ ዝግጅት የተገኘን የአሁን ሁኔታ ያመለክታል፤ ከ‘ካለፈው ዓመት ጀምሮ’ ጋር ይህ አገላለጽ ተፈጥሯዊ ነው።
- source_word: ἀπὸ πέρυσι
  choice: ካለፈው ዓመት ጀምሮ
  rationale: ካለፈው ዓመት እስከ አሁን የቀጠለውን ጊዜ በግልጽ ያሳያል።
- source_word: τὸ ὑμῶν ζῆλος
  choice: ቅንዓታችሁ
  rationale: ζῆλος በዚህ አውድ አዎንታዊ ትጋትንና ጠንካራ ፍላጎትን ይገልጣል፤ ‘ቅንዓት’ የቃሉን ኃይል ይጠብቃል።
- source_word: ἠρέθισε
  choice: አነሳስቷል
  rationale: ግሱ ማነቃቃትን ወይም ለተግባር ማነሳሳትን ያመለክታል፤ አዎንታዊውን አውድ ያለ አሉታዊ ጥላ ያስተላልፋል።
- source_word: τοὺς πλείονας
  choice: አብዛኞቹን
  rationale: ‘አብዛኞቹን’ የሚለው ብዙኃኑን ወይም ከግማሽ በላይ የሆኑትን የሚያመለክተውን የግሪክ አገላለጽ በአጭሩ ይጠብቃል።
theological_decisions:
- issue: ‘አካይያ’ የሚያመለክተው
  choice: የቦታው ስም ‘አካይያ’ ተጠብቆ፣ በአውዱ በዚያ ላሉ አማኞች ተወካይ ሆኖ እንዲገባ ተደርጓል።
  alternative: ‘እናንተ’ ወይም ‘በአካይያ ያሉ አማኞች’ ብሎ በቀጥታ መተርጎም።
  rationale: ግሪኩ Ἀχαΐα የሚለውን የክልሉን ስም በግልጽ ይጠቀማል። ስሙን ማቆየት የጽሑፉን አገላለጽና ከቆሮንቶስ የሰፋውን ክልላዊ ወሰን ይጠብቃል።
- issue: የጳውሎስ መመካት ኃይል
  choice: ‘እመካለሁ’ ተብሎ በቀጥታ ተተርጉሟል።
  alternative: ‘በኩራት እናገራለሁ’ ወይም ‘አወድሳለሁ’ ብሎ ማለዘብ።
  rationale: καυχῶμαι ጠንካራ የንግግር ቃል ነው፤ ጽሑፉ ያለውን የሐዋርያውን የንግግር ኃይል ለማቆየት ማለዘብ አልተመረጠም።
