  footnotes:
  - marker: a
    text: ወይም፣ “ተቀበሉን” ወይም “ልባችሁን ክፈቱልን።” የግሪኩ ቃል በቀጥታ “ለእኛ ስፍራ ስጡ” ይላል፤ ይህም ምናልባት ከ6፥11–13 የቀጠለ የግንኙነት ዘይቤ ነው።
    reason: lexical_alternative
