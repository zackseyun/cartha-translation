- source_word: ἐπλεονεκτήσαμεν
  choice: አልበዘበዝንም
  rationale: ለግል ጥቅም ሌላውን መጠቀሚያ ማድረግን፣ መጨቆንን ወይም መበዝበዝን በግልጽ ዘመናዊ አማርኛ ያስተላልፋል፤ በገንዘብ ማጭበርበር ብቻ አይገድበውም።
theological_decisions:
- issue: Χωρήσατε ἡμᾶς የሚለው ጥሪ ባሕርይ
  choice: ጳውሎስንና አብረውት ያሉትን በግንኙነታቸውና በፍቅራቸው ውስጥ ስፍራ እንዲሰጧቸው የቀረበ ጥሪ
  alternative: በአጠቃላይ እንዲቀበሏቸው ወይም እንዲያስተናግዷቸው የቀረበ ጥሪ
