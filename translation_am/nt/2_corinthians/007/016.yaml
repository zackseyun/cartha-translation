  text: I rejoice that in every way I have confidence in you[a].
translation:
  language: am
  text: በሁሉም ነገር በእናንተ እንደምተማመን ደስ ይለኛል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በሁሉም ነገር ስለ እናንተ እርግጠኛ ስለሆንሁ ደስ ይለኛል።”
    reason: ὅτι ይዘትን ወይም ምክንያትን፣ ἐν ὑμῖν ደግሞ ‘በእናንተ’ ወይም ‘ስለ እናንተ’ ሊያመለክት የሚችለውን እውነተኛ የትርጉም ስፋት ለማሳየት።
lexical_decisions:
- source_word: χαίρω
  choice: ደስ ይለኛል
  rationale: የአሁን ጊዜውን የደስታ መግለጫ በተፈጥሯዊና ክብር ባለው ዘመናዊ አማርኛ ያቀርባል።
- source_word: ὅτι
  choice: እንደም…
  rationale: እዚህ ὅτι በዋናነት የጳውሎስን የደስታ ይዘት ያስተዋውቃል፤ የአማርኛው እንደም… ይህን በተፈጥሮ ያሳያል።
- source_word: ἐν παντί
  choice: በሁሉም ነገር
  rationale: ሐረጉ አጠቃላይ ወሰንን ይገልጣል፤ ይህ አተረጓጎም ‘በሁሉ’ ወይም ‘በማንኛውም ረገድ’ ሊሆን የሚችለውን ስፋት ሳያጠብ ያቀርባል።
- source_word: θαρρῶ
  choice: እተማመናለሁ
  rationale: በዚህ አውድ θαρρέω የጸና እምነትንና ድፍረትን ይገልጣል፤ ‘እተማመናለሁ’ ከሰዎች ጋር ሲያያዝ ተፈጥሯዊ ነው።
- source_word: ἐν ὑμῖν
  choice: በእናንተ
  rationale: የግሪኩን ἐν ቀጥተኛ ግንኙነታዊ ኃይል ይጠብቃል፤ በአውዱ ‘ስለ እናንተ’ የሚለው ትርጉምም ሊኖረው ይችላል።
