  source_fidelity: The principal contrast and outcomes are accurately conveyed. However, the current note incorrectly states that ἀμεταμέλητον agrees grammatically with and directly modifies μετάνοιαν. It is neuter accusative rather than feminine accusative, and is best treated as an adverbial qualifier or as semantically associated with the repentance-to-salvation expression. The wording should avoid presenting one syntactic analysis as certain.
