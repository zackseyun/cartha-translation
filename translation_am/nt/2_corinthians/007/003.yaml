id: 2CO.7.3
reference: 2 Corinthians 7:3
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸂πρὸς κατάκρισιν οὐ⸃ λέγω, προείρηκα γὰρ ὅτι ἐν ταῖς καρδίαις ἡμῶν ἐστε εἰς τὸ συναποθανεῖν καὶ συζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/003.yaml
  text: I do not say this to condemn you[a], for I have said before that you are in our hearts[b], to die together and to live together.
translation:
  language: am
  text: ይህን የምለው ልኮንናችሁ አይደለም[a]፤ እናንተ አብረን ለመሞትና አብረን ለመኖር በልባችን ውስጥ እንዳላችሁ ከዚህ በፊት ተናግሬአለሁና[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለኩነኔ” ወይም “የኩነኔ ዓላማ ይዤ።”
    reason: lexical_alternative
  - marker: b
    text: “አብረን ለመሞትና አብረን ለመኖር” የሚለው የግሪክ አገላለጽ በሞትም በሕይወትም ያለውን የጋራ ቁርኝት ያጎላል። ሐረጉ “ለጋራ ሞትና ለጋራ ሕይወት” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς κατάκρισιν
  choice: ልኮንናችሁ
  rationale: πρός ከወቃሽ ስም κατάκρισιν ጋር የንግግሩን ዓላማ ወይም አቅጣጫ ያመለክታል። በአማርኛ ‘ልኮንናችሁ’ ይህን ኃይል በተፈጥሯዊና ግልጽ አገላለጽ ያስተላልፋል።
- source_word: λέγω
  choice: ይህን የምለው
  rationale: ‘ይህን’ የሚለው ተውላጠ ስም በግሪኩ በቀጥታ ባይኖርም ጳውሎስ ወደ ቀደመው ንግግሩ እንደሚያመለክት በአማርኛ በተፈጥሮ ያሳያል።
- source_word: προείρηκα
  choice: ከዚህ በፊት ተናግሬአለሁ
  rationale: የግሪኩ ፍጹም ጊዜ ቀድሞ የተነገረና አሁንም ተገቢነቱ የቀጠለ ንግግርን ያመለክታል።
- source_word: ἐν ταῖς καρδίαις ἡμῶν ἐστε
  choice: በልባችን ውስጥ እንዳላችሁ
  rationale: ‘ልባችን’ የግሪኩን ብዙ ቁጥር ያንጸባርቃል፤ አገላለጹም ጥልቅ ፍቅርንና ውስጣዊ ቁርኝትን ይገልጣል።
- source_word: εἰς τὸ συναποθανεῖν καὶ συζῆν
  choice: አብረን ለመሞትና አብረን ለመኖር
  rationale: εἰς ከስማዊ ግስ ጋር ዓላማን ወይም ውጤትን ሊገልጽ ይችላል። በሁለቱም ግሶች ያለው συν- የጋራ ቁርኝትን ስለሚያጎላ፣ ‘አብረን’ በሁለቱም ሐረጎች ተጠብቋል።
theological_decisions:
- issue: ‘አብረን ለመሞትና አብረን ለመኖር’ የሚለውን አገላለጽ በተወሰነ የኪዳን፣ የጋብቻ ወይም ከክርስቶስ ጋር የመዋሐድ ትርጉም መተርጎም
  choice: ጽሑፉ በግልጽ የሚያሳየውን ጥልቅ የጋራ ቁርኝት ብቻ ማቆየት
  alternative: እንደ ኪዳናዊ ታማኝነት ወይም በክርስቶስ የመካፈል ቴክኒካዊ አገላለጽ አድርጎ መግለጽ
  rationale: ጥቅሱ ጥልቅ ፍቅርንና በሞትም በሕይወትም የሚጸና አብሮነትን ይገልጣል፤ ነገር ግን ይህን በአንድ የተወሰነ ሥነ መለኮታዊ ምድብ አይገድበውም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለመደበኛ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። የሐረጉ ስሜታዊ ጥንካሬ በ‘በልባችን ውስጥ’ እና በተደጋገመው ‘አብረን’ ተጠብቋል።
