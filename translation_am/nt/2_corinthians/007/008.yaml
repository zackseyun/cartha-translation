id: 2CO.7.8
reference: 2 Corinthians 7:8
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὅτι εἰ καὶ ἐλύπησα ὑμᾶς ἐν τῇ ἐπιστολῇ, οὐ μεταμέλομαι· εἰ καὶ μετεμελόμην (⸀βλέπω ὅτι ἡ ἐπιστολὴ ἐκείνη εἰ καὶ πρὸς ὥραν ἐλύπησεν ὑμᾶς),
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/008.yaml
  text: For even if I grieved you with the letter[a], I do not regret it—though I did regret it, for I see that that letter grieved you[b], though only for a time.
translation:
  language: am
  text: በደብዳቤው ባሳዘንኋችሁም እንኳ፣ አሁን አልጸጸትም፤ ቀደም ሲል ተጸጽቼ ነበር ቢሆንም፣ ያ ደብዳቤ ለጥቂት ጊዜ ብቻ እንዳሳዘናችሁ አያለሁና።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλύπησα
  choice: ባሳዘንኋችሁ
  rationale: λυπέω ሐዘንን ወይም የልብ ሥቃይን ማስከተልን ያመለክታል፤ «አሳዘንኋችሁ» ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐν τῇ ἐπιστολῇ
  choice: በደብዳቤው
  rationale: ἐν እዚህ የመሣሪያ ወይም የምክንያት ስሜት ስላለው፣ «በደብዳቤው» የሐዘኑን መንስኤ በተፈጥሯዊ አነጋገር ያሳያል።
- source_word: μεταμέλομαι
  choice: አልጸጸትም
  rationale: በዚህ አውድ μεταμέλομαι የሞራል ንስሐን ሳይሆን በቀድሞው ድርጊት መጸጸትን ይገልጣል።
- source_word: μετεμελόμην
  choice: ተጸጽቼ የነበርኩ
  rationale: የግሪኩ ያልተፈጸመ ጊዜ ቅርጽ ቀደም ሲል የቆየን የጸጸት ሁኔታ ሊያጎላ ይችላል፤ ይህ አተረጓጎም ከአሁኑ «አልጸጸትም» ጋር ያለውን ንጽጽር ይጠብቃል።
- source_word: βλέπω
  choice: አያለሁ
  rationale: ቃሉ በቀጥታ «አያለሁ» ማለት ሲሆን፣ ጳውሎስ የደብዳቤውን ጊዜያዊ ተጽእኖ መገንዘቡንም በተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: ἡ ἐπιστολὴ ἐκείνη
  choice: ያ ደብዳቤ
  rationale: «ያ» የሚለው አመልካች ἐκείνη ያለውን የተወሰነነትና የርቀት ስሜት ይጠብቃል።
- source_word: πρὸς ὥραν
  choice: ለጥቂት ጊዜ ብቻ
  rationale: ይህ አገላለጽ በቃል «ለአንድ ሰዓት» ቢሆንም ፈሊጣዊ ትርጉሙ «ለአጭር ጊዜ» ነው፤ «ብቻ» ጊዜያዊነቱን ያጎላል።
- source_word: ὅτι
  choice: -ና
  rationale: የመጀመሪያው ὅτι ካለፈው ንግግር ጋር የሚያገናኝ ማብራሪያ ነው፤ በአማርኛ የሐረጉ መጨረሻ «አያለሁና» ይህን የምክንያት ግንኙነት በተፈጥሯዊ መንገድ ያሳያል።
- source_word: εἰ καὶ
  choice: ቢሆንም እንኳ / ቢሆንም
  rationale: የተደጋገመው εἰ καὶ የመፍቀድ ወይም የተቃርኖ ሐረግ ያስገባል፤ የአማርኛው ቅርጽ ይህን አመክንዮና የንግግሩን ምት ይጠብቃል።
theological_decisions:
- issue: በጳውሎስ ስሜታዊ ገለጻ μεταμέλομαι ያለው ትርጉም
  choice: «መጸጸት» ተብሎ ተተርጉሟል።
  alternative: «ንስሐ መግባት» ወይም «ማዘን»
  rationale: አውዱ ጳውሎስ የቀድሞው ደብዳቤ ስላመጣው አሳዛኝ ውጤት የነበረውን የጊዜያዊ ጸጸት ይመለከታል፤ በእግዚአብሔር ፊት የሚደረግ የሞራል ንስሐን አይናገርም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ተቃርኖ—አሁን አለመጸጸትና ቀደም ሲል የነበረ ጸጸት—ሳይለሰልስ ተጠብቋል።
