  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὅτι εἴ τι αὐτῷ ὑπὲρ ὑμῶν κεκαύχημαι, οὐ κατῃσχύνθην, ἀλλ’ ὡς πάντα ἐν ἀληθείᾳ ἐλαλήσαμεν ὑμῖν, οὕτως καὶ ἡ καύχησις ἡμῶν ⸀ἡ ἐπὶ Τίτου ἀλήθεια ἐγενήθη.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/014.yaml
  text: For if I have boasted to him at all about you[a], I was not put to shame; rather, just as we spoke everything to you in truth[b], so also our boasting to Titus proved true.
translation:
  language: am
  text: ምክንያቱም፣ ስለ እናንተ ለቲቶ በምንም ነገር ተመክቼ ቢሆን፣ ለእፍረት አልተዳረግሁም፤ ነገር ግን ሁሉን ነገር ለእናንተ በእውነት እንደተናገርን፣ እንዲሁ ለቲቶ ያደረግነው መመካታችን እውነት ሆኖ ተገኘ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κεκαύχημαι
  choice: ብመካ
  rationale: የግሪኩን የመመካት ንግግራዊ ኃይል ይጠብቃል፤ በዚህ አውድ ኃጢአታዊ ትዕቢትን ሳይሆን ስለ ቆሮንቶስ ሰዎች በእምነት የተነገረ ውዳሴን ያመለክታል።
- source_word: οὐ κατῃσχύνθην
  choice: አላፈርኩም
  rationale: የጳውሎስ መመካት ሐሰት ሆኖ እንዳልተገኘና እርሱም ለእፍረት እንዳልተዳረገ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: πάντα ἐν ἀληθείᾳ ἐλαλήσαμεν
  choice: ሁሉን ነገር በእውነት እንደተናገርን
  rationale: πάντα ያለውን ሰፊ ወሰንና ἐν ἀληθείᾳ ያለውን የእውነተኛነት ሁኔታ ይጠብቃል።
- source_word: ἡ καύχησις ἡμῶν
  choice: መመካታችን
  rationale: ከቀደመው κεκαύχημαι ጋር ያለውን የቃል ሥር ግንኙነት ይጠብቃል።
- source_word: ἡ ἐπὶ Τίτου
  choice: በቲቶ ፊት የነበረው
  rationale: የግሪኩን አገላለጽ በቅርብ ይከተላል፤ አውዱ ይህ ስለ ቆሮንቶስ ሰዎች ለቲቶ የተነገረ መመካት መሆኑን ያሳያል።
- source_word: ἀλήθεια ἐγενήθη
  choice: እውነት ሆኖ ተገኘ
  rationale: መመካቱ ከእውነታው ጋር እንደተስማማና ትክክል ሆኖ እንደተረጋገጠ የግሪኩን ፈሊጣዊ ትርጉም ይገልጣል።
- source_word: ὅτι
  choice: (ከአውዱ ጋር የተያያዘ ምክንያታዊ መግቢያ)
  rationale: በአማርኛ የቀደመው አውድ በቀጥታ ሲነበብ ልዩ የመግቢያ ቃል ሳይጨመር ምክንያታዊ ግንኙነቱ በተፈጥሮ ይገባል።
theological_decisions:
- issue: የጳውሎስ ‘መመካት’ ባሕርይ
  choice: እንደ መመካት ተተርጉሟል፤ አውዱ ይህ በቆሮንቶስ ሰዎች ላይ ያለ እምነትና ውዳሴ መሆኑን ያሳያል።
  alternative: ‘እምነታችን’ ወይም ‘ኩራታችን’ ብሎ ማለስለስ።
  rationale: καυχάομαι/καύχησις ያላቸውን ጠንካራ ንግግራዊ ቅርጽና የቃል ግንኙነት መጠበቅ ይገባል፤ ጽሑፉ ይህን እንደ ኃጢአታዊ ትዕቢት አያቀርበውም።
- issue: ἐπὶ Τίτου የሚለው ግንኙነት
  choice: ‘በቲቶ ፊት’ ተብሎ የመመካቱን ተቀባይ ወይም መገኛ በማሳየት ተተርጉሟል።
  alternative: ‘ስለ ቲቶ’ ወይም ‘ለቲቶ’ ብሎ መተርጎም።
  rationale: የግሪኩ ሐረግ በአገባቡ ከአንድ በላይ አቀራረብን ሊፈቅድ ቢችልም፣ ቀዳሚው αὐτῷ ὑπὲρ ὑμῶν የመመካቱ ይዘት ስለ ቆሮንቶስ ሰዎች፣ ተቀባዩም ቲቶ መሆኑን ያሳያል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና በቀላሉ የሚገባ መደበኛ አማርኛን ይጠቀማል። ‘መመካት’ የሚለው ቃል የግሪኩን ተደጋጋሚ የቃል ሥር ይጠብቃል፤ የሞራል ፍርዱ ከቃሉ ብቻ ሳይሆን ከአውዱ እንዲገኝ ተደርጓል።
