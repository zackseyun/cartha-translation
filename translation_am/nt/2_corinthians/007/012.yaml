  choice: በመካከላችሁ
  rationale: በዚህ አስቸጋሪ አወቃቀር ውስጥ መገለጡ በቆሮንቶስ ሰዎች መካከል መሆኑን በተፈጥሯዊ አማርኛ ይገልጻል።
