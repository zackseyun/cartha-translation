- source_word: τοῦ ἀδικηθέντος
  choice: የተበደለው ሰው
  rationale: የግሪኩን ተደራጊ አንቀጽ ይጠብቃል፤ ከ«የበደለው ሰው» ጋርም ያለውን ትይዩነት ያሳያል።
- source_word: ἀλλ’ ἕνεκεν τοῦ φανερωθῆναι
