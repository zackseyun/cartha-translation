- source_word: τὴν σπουδὴν ὑμῶν
  choice: ያላችሁ ትጋት
  rationale: σπουδή የሚያመለክተውን ከልብ የሆነ ጥረት፣ ጉጉትና ጥልቅ አሳቢነት በአጭርና ክቡር አማርኛ ይገልጻል።
- source_word: τὴν ὑπὲρ ἡμῶν
  choice: ለእኛ
  rationale: ትጋታቸው ወደ ጳውሎስና ባልደረቦቹ ያለውን አቅጣጫ ወይም አሳቢነት በቀጥታ ያሳያል።
