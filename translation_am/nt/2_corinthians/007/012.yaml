  yaml_path: translation/nt/2_corinthians/007/012.yaml
  text: So even if I wrote to you[a], it was not because of the one who did wrong, nor because of the one who was wronged[b], but so that your earnestness for us might be made known among you before God.
translation:
  language: am
  text: ስለዚህ፣ ለእናንተ ብጽፍም፣ የጻፍኩት ስለበደለው ሰው አልነበረም፤ ስለተበደለውም ሰው አልነበረም፤ ነገር ግን ለእኛ ያላችሁ ትጋት[b] በመካከላችሁ በእግዚአብሔር ፊት እንዲገለጥ ነበር።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች፣ «ለእናንተ ያለን ትጋት በመካከላችሁ በእግዚአብሔር ፊት እንዲገለጥ» ይላሉ።
    reason: textual_variant
  - marker: b
