  alternative: «ለእናንተ ያለን ትጋት በመካከላችሁ በእግዚአብሔር ፊት እንዲገለጥ» የሚለው የሌሎች የእጅ ጽሑፎች ንባብ።
  rationale: ዋናው ትርጉም SBLGNT ያተመውን ὑμῶν … ὑπὲρ ἡμῶν በቀጥታ ይከተላል፤ አስቸጋሪነቱን በግድ ሳይፈታ ሌላውን ጥንታዊ ንባብ በማስታወሻ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «በደለ/ተበደለ» የሚለው ትይዩ አገላለጽ የግሪኩን ንጽጽር ይጠብቃል፤ የጽሑፍ ልዩነቱና የσπουδή የትርጉም ስፋት በተገቢው ቦታ በማስታወሻ ተቀምጠዋል።
