  choice: … ስለ … አልነበረም
  rationale: ἕνεκεν የምክንያትን ወይም የዓላማን ግንኙነት ያሳያል፤ በዚህ ተቃርኖ ውስጥ «ስለ … አልነበረም» ግልጽና ተፈጥሯዊ ነው።
- source_word: τοῦ ἀδικήσαντος
