base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/009.yaml
  text: Now I rejoice[a], not because you were grieved, but because you were grieved into a change of mind; for you were grieved according to God[c][b], so that you might suffer no loss from us.
translation:
  language: am
  text: አሁን ግን ደስ ይለኛል፤ ስላዘናችሁ ሳይሆን፣ ወደ ንስሐ[a] ስላዘናችሁ ነው። እግዚአብሔር በሚሻው መንገድ አዝናችኋልና[b]፣ በምንም ነገር ከእኛ የተነሣ እንዳትጎዱ[c] ዘንድ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወደ የአሳብ ለውጥ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ከእግዚአብሔር ጋር በሚስማማ ሁኔታ” ወይም “በእግዚአብሔር ፈቃድ መሠረት።”
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “በእኛ ምክንያት ምንም ኪሳራ እንዳይደርስባችሁ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν
  choice: አሁን ግን
  rationale: የጳውሎስን የአሁኑን ደስታ ከቀድሞው ኀዘን ጋር በተፈጥሯዊ አማርኛ ያነጻጽራል።
- source_word: χαίρω
  choice: ደስ ይለኛል
  rationale: በዘመናዊ አማርኛ ተፈጥሯዊ ሆኖ የግሱን የደስታ ትርጉም ይጠብቃል።
- source_word: ἐλυπήθητε
  choice: ስላዘናችሁ / አዝናችኋል
  rationale: የግሪኩን ተደጋጋሚ የኀዘን ሐሳብ ይጠብቃል፤ በአማርኛም ኀዘኑን ያለተጨማሪ የአድራጊነት ግምት በተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: εἰς μετάνοιαν
  choice: ወደ ንስሓ ስለመራችሁ
  rationale: εἰς የሚያመለክተውን ወደ ውጤት የሚያመራ እንቅስቃሴ በተፈጥሯዊ አማርኛ ይገልጣል፤ μετάνοια በዚህ ዐውድ ያለውን ሥነ ምግባራዊና መንፈሳዊ ኃይል “ንስሓ” ያስተላልፋል።
- source_word: κατὰ θεόν
  choice: በእግዚአብሔር ፈቃድ መሠረት
  rationale: ኀዘኑ ከእግዚአብሔር መለኪያ ወይም ፈቃድ ጋር የሚስማማ መሆኑን ይገልጣል፤ የሐረጉን ሌሎች ሊሆኑ የሚችሉ ንባቦች በማስታወሻ ተጠብቀዋል።
- source_word: ζημιωθῆτε
  choice: እንዳትጎዱ
  rationale: በἵνα የተገለጠውን የታሰበ ውጤት ያስተላልፋል፤ ጉዳቱን ወደ አካላዊ ጉዳት ብቻ አያጠብም።
- source_word: ἐξ ἡμῶν
  choice: ከእኛ የተነሣ
  rationale: ἐξ የሚያመለክተውን ምንጭ ወይም ምክንያት በግልጽ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: κατὰ θεόν የሚገልጠው የኀዘን ባሕርይ
  choice: በእግዚአብሔር ፈቃድ መሠረት
  alternative: እግዚአብሔር በሚፈልገው መንገድ፤ ከእግዚአብሔር ጋር በሚስማማ ሁኔታ
  rationale: ሐረጉ ኀዘኑን ከእግዚአብሔር ፈቃድ፣ መለኪያ ወይም ዓላማ ጋር ያዛምዳል። ዋናው ጽሑፍ ይህን ግንኙነት ያስቀምጣል፤ ትርጉሙን ወደ አንድ ልዩ ሥነ መለኮታዊ ትርጓሜ አያጠብም።
- issue: μετάνοια በዚህ ዐውድ ያለው ትርጉም
  choice: ንስሓ
  alternative: የአሳብ ለውጥ
  rationale: ቃሉ የአሳብ ለውጥን ቢያካትትም፣ በዚህ ዐውድ የሥነ ምግባርና የመንፈስ መመለስን ያመለክታል። “ንስሓ” በአማርኛ ይህን በአጭርና በታወቀ ቃል ያስተላልፋል።
