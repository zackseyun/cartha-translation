    rationale: The Greek vocative means ‘beloved’ and contains no μου (‘my’). ‘ወዳጆች ሆይ’ preserves the affectionate address without adding possessive force.
  - severity: low
    issue: ‘እግዚአብሔርን በመፍራት’ is less direct than the source construction.
