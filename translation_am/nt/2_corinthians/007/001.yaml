translation:
  language: am
  text: እንግዲህ ወዳጆች ሆይ፣ እነዚህ ተስፋዎች ስላሉን፣ ከሥጋና ከመንፈስ ርኩሰት ሁሉ ራሳችንን እናንጻ፤ በእግዚአብሔር ፍርሃት[a] ቅድስናን ፍጹም እያደረግን።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: እዚህ ‘የእግዚአብሔር ፍርሃት’ ተራ ድንጋጤን ብቻ ሳይሆን፣ በእግዚአብሔር ፊት ያለ የአክብሮት ፍርሃትን ያካትታል።
