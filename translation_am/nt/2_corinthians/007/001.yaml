  terminology: ‘ተስፋዎች,’ ‘ሥጋ,’ ‘መንፈስ,’ ‘ርኩሰት,’ ‘ቅድስና,’ and ‘ፍርሃት’ suitably retain the source’s theological vocabulary and do not resolve its flesh/spirit language into a denominational interpretation.
