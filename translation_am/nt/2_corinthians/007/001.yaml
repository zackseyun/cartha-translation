theological_decisions:
- issue: በ‘ሥጋና መንፈስ ርኩሰት’ ውስጥ የσάρξ ፍቺ
  choice: ‘ሥጋ’ ተብሎ ተተርጉሟል።
  alternative: ‘አካል’ ወይም ‘የኃጢአት ባሕርይ’
  rationale: ከ‘መንፈስ’ ጋር ያለው ንጽጽር የሰውን አካላዊና ውስጣዊ ገጽታ በአንድነት ያመለክታል፤ ‘የኃጢአት ባሕርይ’ የሚለው ትርጉም እዚህ ላይ አውዱን ከሚፈቅደው በላይ ይወስናል።
- issue: የκαθαρίσωμεν አሳሳቢ ኃይል
  choice: ጳውሎስንና አንባቢዎቹን ያካተተ ‘ራሳችንን እናንጻ’
  alternative: ‘ራሳችንን ማንጻት ይገባናል’
  rationale: የግሪኩ የመጀመሪያ ሰው ብዙ ቁጥር ንዑስ አንቀጽ ቀጥተኛና አካታች ማሳሰቢያ ነው።
- issue: ከእግዚአብሔር ጋር በተያያዘ የφόβος ፍቺ
  choice: ‘እግዚአብሔርን በመፍራት’ ተብሎ ጠንካራው ቃል ተጠብቋል።
  alternative: ‘ለእግዚአብሔር ክብር በመስጠት’
  rationale: ቃሉ የአክብሮት ድንጋጤን ያካትታል፣ ግን ወደ ‘አክብሮት’ ብቻ ማለስለስ መጽሐፍ ቅዱሳዊውን ውጥረት ያጠፋል።
