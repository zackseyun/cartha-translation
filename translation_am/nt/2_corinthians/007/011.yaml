source:
  edition: SBLGNT
  text: ἰδοὺ γὰρ αὐτὸ τοῦτο τὸ κατὰ θεὸν ⸀λυπηθῆναι πόσην κατειργάσατο ὑμῖν σπουδήν, ἀλλὰ ἀπολογίαν, ἀλλὰ ἀγανάκτησιν, ἀλλὰ φόβον, ἀλλὰ ἐπιπόθησιν, ἀλλὰ ζῆλον, ἀλλὰ ἐκδίκησιν· ἐν παντὶ συνεστήσατε ἑαυτοὺς ἁγνοὺς ⸀εἶναι τῷ πράγματι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/011.yaml
  text: 'For see what earnestness this very grief according to God has produced in you: but also a defense[a], but also indignation, but also fear, but also longing, but also zeal, but also vindication[c][b]. In every way you proved yourselves to be pure in the matter.'
translation:
  language: am
  text: እነሆ፣ እንደ እግዚአብሔር ፈቃድ ማዘናችሁ[a] በእናንተ ምን ያህል ትጋትን አስገኘ! እንዲያውም ራሳችሁን መከላከልን[b]፣ እንዲያውም ቁጣን፣ እንዲያውም ፍርሃትን፣ እንዲያውም ናፍቆትን፣ እንዲያውም ቅንዓትን፣ እንዲያውም ቅጣትን[c] አስገኘ። በሁሉም ረገድ በዚህ ጉዳይ ንጹሓን መሆናችሁን አረጋገጣችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ይህ እግዚአብሔራዊ ሐዘን።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ራሳችሁን ከወቀሳ ማጥራትን።”
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “ፍትሕን ማስፈጸምን” ወይም “ጉዳዩን ማስተካከልን።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: እነሆ
  rationale: ዐውዱ የሚያቀርበውን ማስረጃ በአጽንዖት እንዲመለከቱ ይጠራል፤ γάρ የሚያሳየው ከቀደመው ንግግር ጋር ያለው ምክንያታዊ ግንኙነት በአማርኛው የንግግር ፍሰት ውስጥ ተካትቷል።
- source_word: τὸ κατὰ θεὸν λυπηθῆναι
  choice: በእግዚአብሔር ፈቃድ መሠረት ያዘናችሁት ይህ ሐዘን
  rationale: κατὰ θεόν ሐዘኑ ከእግዚአብሔር መለኪያ ወይም ፈቃድ ጋር መስማማቱን ያመለክታል። አገላለጹ እግዚአብሔር ራሱ እንዳዘነ እንዳይመስል በተፈጥሯዊ አማርኛ ተተርጉሟል፤ አጭሩ አማራጭ በማስታወሻ ቀርቧል።
- source_word: πόσην κατειργάσατο ὑμῖν σπουδήν
  choice: በእናንተ ምንኛ ትጋትን አስገኘ
  rationale: κατεργάζομαι ውጤትን ማስገኘትን፣ σπουδή ደግሞ በቁም ነገር የተሞላ ፈጣንና ትጉህ ምላሽን ያመለክታሉ።
- source_word: ἀλλὰ
  choice: እንዲያውም
  rationale: እዚህ ἀλλά ተቃርኖን ከማሳየት ይልቅ የሐሳቡን ደረጃ እያሳደገ ተጨማሪ ማስረጃዎችን ይዘረዝራል። ድግግሞሹ የግሪኩን አጽንዖት ለማቆየት ተጠብቋል።
- source_word: ἀπολογίαν
  choice: ራሳችሁን መከላከልን
  rationale: ቃሉ ለቀረበ ወቀሳ መልስ መስጠትንና ከተሳትፎ ራስን ማጥራትን ሊያመለክት ይችላል፤ ዋናው ጽሑፍ ሰፊውን ትርጉም ያቆያል።
- source_word: ἀγανάκτησιν
  choice: መቆጣትን
  rationale: ቃሉ በተፈጸመው ክፋት ምክንያት የተነሣ ጠንካራ ቁጣንና መበሳጨትን ያሳያል፤ የቁጣው ዒላማ በግሪኩ ስላልተገለጸ ትርጉሙም አልወሰነውም።
- source_word: φόβον
  choice: ፍርሃትን
  rationale: የፍርሃቱ ዒላማ እግዚአብሔር፣ ጳውሎስ ወይም የጉዳዩ ውጤት መሆኑ በጽሑፉ አልተወሰነም፤ ስለዚህ ግልጽ ያልሆነው ሁኔታ ተጠብቋል።
- source_word: ἐπιπόθησιν
  choice: ናፍቆትን
  rationale: ጠንካራ ምኞትንና እንደገና ለመቀራረብ መፈለግን በተፈጥሯዊና ክብር ባለው አማርኛ ያሳያል።
- source_word: ζῆλον
  choice: ቅንዓትን
  rationale: ቃሉ የጋለ ትጋትንና ቁርጠኝነትን ያሳያል፤ ከቀደመው σπουδή የተለየ ቃል በመጠቀም ልዩነቱ ተጠብቋል።
- source_word: ἐκδίκησιν
  choice: ፍትሕን ማስፈጸምን
  rationale: ቃሉ በደልን መበቀል፣ ቅጣት ማስፈጸም ወይም ነገሩን በፍትሕ ማስተካከል ሊያመለክት ይችላል። “ፍትሕን ማስፈጸም” የግል በቀልን ሳያስገባ በደሉን ለማስተካከል የወሰዱትን ቆራጥ እርምጃ ያሳያል፤ የቅጣትና የበቀል አማራጮች በማስታወሻ ተጠብቀዋል።
- source_word: ἐν παντὶ συνεστήσατε ἑαυτοὺς ἁγνοὺς εἶναι τῷ πράγματι
  choice: በሁሉም ረገድ በጉዳዩ ንጹሓን መሆናችሁን አረጋገጣችሁ
  rationale: συνίστημι እዚህ ማሳየት ወይም በማስረጃ ማረጋገጥ ማለት ነው። ἁγνούς የሞራል ንጽሕናን ወይም በጉዳዩ ከበደል ነጻ መሆንን ይይዛል፤ “ንጹሓን” ሁለቱንም ገጽታዎች ያስቀራል።
theological_decisions:
- issue: የκατὰ θεόν አገላለጽ
  choice: በእግዚአብሔር ፈቃድ መሠረት
  alternative: እግዚአብሔራዊ
  rationale: ሐዘኑ ከእግዚአብሔር ፈቃድ ወይም መለኪያ ጋር የተስማማ መሆኑን ያሳያል። “እግዚአብሔራዊ” የሚለው አጭር ነው፣ ግን ግንኙነቱን ከምንጭ ጽሑፉ ይልቅ በበለጠ ሁኔታ ሊተረጉም ይችላል።
- issue: በንስሐ ዐውድ ውስጥ የἐκδίκησις ትርጉም
  choice: ፍትሕን ማስፈጸም
  alternative: ቅጣትን / በደሉን መበቀልን
  rationale: ዐውዱ የቆሮንቶስ ሰዎች ጥፋቱን በቁም ነገር ተቀብለው ነገሩን ለማስተካከል የወሰዱትን እርምጃ ያሳያል። ዋናው ምርጫ የግል በቀልን አያስገባም፣ ሆኖም የቃሉን የቅጣት ገጽታ በማስታወሻ ያቆያል።
- issue: “በጉዳዩ ንጹሓን” የሚለው አገላለጽ
  choice: ንጹሓን መሆናችሁን አረጋገጣችሁ
  alternative: ከበደል ነጻ መሆናችሁን አሳያችሁ
  rationale: ጽሑፉ የእነርሱን ቀደምት አያያዝ ሁሉ ከጥፋት ነጻ ነበር ብሎ እንዲወሰን አያስገድድም፤ ከዚህ ይልቅ አሁን በሰጡት ምላሽ በጉዳዩ ላይ ትክክለኛ አቋማቸውን እንዳሳዩ ያመለክታል። “ንጹሓን” ይህን የሞራልና የማስረጃ ውጥረት ይጠብቃል።
