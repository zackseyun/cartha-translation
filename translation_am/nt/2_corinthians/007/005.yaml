lexical_decisions:
- source_word: Καὶ γὰρ
  choice: በ...ጊዜ እንኳ
  rationale: ጥምረቱ ከቀደመው አውድ ጋር የሚያገናኝ ማብራሪያና አጽንዖት አለው፤ በአማርኛ ‘እንኳ’ አጽንዖቱን በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: ἐλθόντων ἡμῶν εἰς Μακεδονίαν
  choice: ማኬዶንያ በደረስን ጊዜ
  rationale: የግሪኩ ገላጭ ሐረግ ጊዜን ያመለክታል፤ ‘በደረስን ጊዜ’ በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: οὐδεμίαν ἔσχηκεν ἄνεσιν
  choice: ምንም ዕረፍት አላገኘም
  rationale: ἄνεσις ከጫና የሚገኝን ዕረፍት፣ ፋታ ወይም እፎይታ ያመለክታል፤ ይህ አገላለጽ የሐረጉን ክብደት ይጠብቃል።
- source_word: ἡ σὰρξ ἡμῶν
  choice: ሥጋችን
  rationale: እዚህ σάρξ የኃጢአት ተፈጥሮን ሳይሆን ሰውነታዊና ሰብአዊ ድካምን በሚያካትት መልኩ ያመለክታል። ቀጥተኛው አገላለጽ የምንጩን ቅርጽና አሻሚነት ይጠብቃል።
- source_word: ἀλλ’ ἐν παντὶ θλιβόμενοι
  choice: ይልቁንም በሁሉም አቅጣጫ ተጨንቀን ነበር
  rationale: θλίβω በጫና ሥር መሆንን ወይም መጨነቅን ያመለክታል፤ ‘በሁሉም አቅጣጫ’ የἐν παντίን ስፋት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἔξωθεν μάχαι
  choice: በውጭ ግጭቶች
  rationale: μάχαι ቃል ጠብን፣ ግጭትን ወይም ተቃውሞን ሊያመለክት ይችላል፤ ‘ግጭቶች’ ትርጉሙን ሆን ብሎ ወደ አካላዊ ውጊያ አያጠብበውም።
- source_word: ἔσωθεν φόβοι
  choice: በውስጥ ፍርሃቶች
  rationale: ይህ አገላለጽ ከ‘በውጭ’ ጋር ያለውን ትይዩ ንጽጽር ጠብቆ ውስጣዊ ፍርሃቶችን ይገልጣል።
