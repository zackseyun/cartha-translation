  text: For even when we came into Macedonia[a], our flesh had no rest, but we were afflicted in every way—conflicts on the outside, fears on the inside—
translation:
  language: am
  text: ምክንያቱም ወደ ማኬዶንያ በደረስን ጊዜም እንኳ፣ ሥጋችን ምንም ዕረፍት አላገኘም[a]፤ ይልቁንም በሁሉም መንገድ ተጨንቀን ነበር—በውጭ ግጭቶች፣ በውስጥ ፍርሃቶች—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እኛ ራሳችን ምንም ዕረፍት አላገኘንም።” የግሪኩ ጽሑፍ “ሥጋችን” ይላል፤ ይህም ሰውነታዊ ድካምንና የሰው ልጅ ጭንቀትን የሚገልጽ ቀጥተኛ አነጋገር ነው።
