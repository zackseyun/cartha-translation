  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὐ μόνον δὲ ἐν τῇ παρουσίᾳ αὐτοῦ, ἀλλὰ καὶ ἐν τῇ παρακλήσει ᾗ παρεκλήθη ἐφ’ ὑμῖν, ἀναγγέλλων ἡμῖν τὴν ὑμῶν ἐπιπόθησιν, τὸν ὑμῶν ὀδυρμόν, τὸν ὑμῶν ζῆλον ὑπὲρ ἐμοῦ, ὥστε με μᾶλλον χαρῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/007.yaml
  text: and not only by his coming, but also by the comfort with which he was comforted because of you, as he reported to us your longing, your mourning, and your zeal for me, so that I rejoiced even more.
translation:
  language: am
  text: በመምጣቱ[a] ብቻ ሳይሆን፣ ስለ እናንተ በተጽናናበት መጽናናት[b]ም ተጽናናን። እርሱ ናፍቆታችሁን፣ ልቅሶአችሁን[c]፣ ለእኔ ያላችሁን ቅንዓት ስለ ነገረን፣ እኔም ይበልጥ ደስ አለኝ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በመገኘቱ።”
    reason: lexical_alternative
  - marker: b
    text: “መጽናናት” እና “ተጽናና” በሚሉት ፈንታ “መበረታታት” እና “ተበረታታ” ተብለውም ሊተረጎሙ ይችላሉ።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “ሐዘናችሁ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρουσίᾳ
  choice: በመምጣቱ
  rationale: በዚህ የግል ጉዞ አውድ ቃሉ የቲቶ መምጣትን ያመለክታል፤ አማራጩ ‘በመገኘቱ’ ነው።
- source_word: παρακλήσει / παρεκλήθη
  choice: መጽናናት / ባገኘው
  rationale: የሐዘን እፎይታና ማበረታቻ ሁለቱንም የሚያካትተውን ስሜታዊ አውድ ያስተላልፋል። በአማርኛ ተፈጥሯዊ እንዲሆን የግሪኩ ስምና ተዛማጅ ግስ በቃል ተመሳሳይነት አልተደገሙም።
- source_word: ἐφ’ ὑμῖν
  choice: ስለ እናንተ
  rationale: አገላለጹ ቲቶ ያገኘው መጽናናት ከቆሮንቶስ ሰዎችና ከምላሻቸው ጋር የተያያዘ መሆኑን ያሳያል፤ የምክንያትና የርዕሰ ጉዳይ ንባቦችን አያጠብም።
- source_word: ἐπιπόθησιν
  choice: እኔን ለማየት እንደናፈቃችሁ
  rationale: ጠንካራ ናፍቆትን በተፈጥሯዊ አማርኛ ያስተላልፋል፤ የተናፋቂው ሰው ጳውሎስ መሆኑ ከአውዱ ተገልጿል።
- source_word: ὀδυρμόν
  choice: እንዳዘናችሁ
  rationale: ቃሉ ጥልቅ ሐዘንንና ልቅሶን ሊያመለክት ይችላል፤ ዋናው ንባብ ተፈጥሯዊውን ‘ማዘን’ ይጠቀማል።
- source_word: ζῆλον ὑπὲρ ἐμοῦ
  choice: ለእኔ እንደቀናችሁ
  rationale: ζῆλος የሚያመለክተውን ከፍተኛ ቅንዓትና ትጋት ይጠብቃል፤ ‘ለእኔ’ የድጋፍ፣ የጥብቅና ወይም የጉዳይ ግንኙነቱን ሰፊ አድርጎ ይተዋል።
- source_word: ὥστε με μᾶλλον χαρῆναι
  choice: ስለዚህ ይበልጥ ደስ አለኝ
  rationale: የውጤት ግንኙነቱንና μᾶλλον የሚያሳየውን ንጽጽር በቀጥታ ያስተላልፋል።
