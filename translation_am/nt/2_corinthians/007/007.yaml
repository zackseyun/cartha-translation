  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ረጅም ዓረፍተ ነገር ለግልጽነት በሁለት ተከፍሏል፤ የቁጥሩ መጀመሪያ ከቀዳሚው ቁጥር ጋር ያለውን ሰዋሰዋዊ ትስስር በ“ብቻ ሳይሆን” ይጠብቃል።
