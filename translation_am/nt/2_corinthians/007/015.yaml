base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/015.yaml
  text: And his affection for you is even greater as he remembers the obedience of all of you[a], how you received him with fear and trembling.
translation:
  language: am
  text: እርሱም የሁላችሁን ታዛዥነት፣ እንዲሁም በፍርሃትና በመንቀጥቀጥ[a] እንዴት እንደተቀበላችሁት ሲያስታውስ፣ ለእናንተ ያለው ጥልቅ ፍቅር ይበልጥ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በአክብሮትና በመንቀጥቀጥ»። «ፍርሃትና መንቀጥቀጥ» የሚለው የጳውሎስ አገላለጽ በከባድነትና በትሕትና የሚሰጥ ምላሽን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλάγχνα
  choice: ጥልቅ ፍቅር
  rationale: ቃሉ በቀጥታ የውስጥ አካላትን ቢያመለክትም፣ በዚህ አገባብ ከልብ የሚመነጭ ጥልቅ ፍቅርንና ርኅራኄን ያሳያል። «ጥልቅ ፍቅር» ምሳሌያዊ ትርጉሙን በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: περισσοτέρως
  choice: ይበልጥ እየጨመረ ነው
  rationale: ቲቶ ትዝ ሲለው ለቆሮንቶስ ሰዎች ያለው ፍቅር ከፍ እንደሚል የሚያሳየውን ንጽጽራዊ ማጠናከሪያ ይጠብቃል።
- source_word: εἰς ὑμᾶς
  choice: ለእናንተ ያለው
  rationale: የፍቅሩን አቅጣጫ በተፈጥሯዊ የአማርኛ አገላለጽ ያሳያል።
- source_word: ἀναμιμνῃσκομένου
  choice: ሲያስታውስ
  rationale: የቲቶ ፍቅር መጨመር የተገለጠበትን አብሮ የሚከናወን ሁኔታ ያሳያል።
- source_word: ὑπακοήν
  choice: ታዛዥነት
  rationale: የቆሮንቶስ ማኅበር ለተላከለት መመሪያ የሰጠውን ታዛዥ ምላሽ በቀጥታ ያስተላልፋል።
- source_word: πάντων ὑμῶν
  choice: የሁላችሁን
  rationale: መላው ማኅበር በአጽንዖት መካተቱን ይጠብቃል።
- source_word: μετὰ φόβου καὶ τρόμου
  choice: በፍርሃትና በመንቀጥቀጥ
  rationale: የጳውሎስን የተለመደ ጥምር አገላለጽ እና በውስጡ ያለውን ክብደትና የትሕትና ምላሽ ሳይደበዝዝ ይጠብቃል፤ የትርጉም ስፋቱ በግርጌ ማስታወሻ ተገልጧል።
- source_word: ἐδέξασθε
  choice: እንደተቀበላችሁት
  rationale: ቲቶን መቀበላቸውን፣ መቀበልና በጎ አቀባበል ማድረግን ሊያካትት በሚችል ሰፊ አገላለጽ ያቀርባል።
- source_word: αὐτόν
  choice: -ት (እንደተቀበላችሁት)
  rationale: የአማርኛው የተሳቢ ቅጥያ የግሪኩን «እርሱን» ይወክላል፤ በአውዱ የሚያመለክተው ቲቶን ነው።
theological_decisions:
- issue: «በፍርሃትና በመንቀጥቀጥ» ቲቶን ከመቀበላቸው ጋር ያለው ትርጉም
  choice: አገላለጹን በዋናው ጽሑፍ በቀጥታ ማቆየት፣ ከባድነት፣ አክብሮትና ትሑት ምላሽ ሊያመለክት እንደሚችል በግርጌ ማብራራት
  alternative: «በአክብሮትና በመንቀጥቀጥ» ብሎ በዋናው ጽሑፍ መተርጎም፣ ወይም ቃላቱን ቀጥተኛ ድንጋጤ ብቻ አድርጎ መረዳት
  rationale: ይህ የጳውሎስ አገላለጽ ከቀጥተኛ ፍርሃት በላይ ከባድነትንና ትሕትናን ሊያካትት ይችላል። ቀጥተኛውን ቃል ማቆየትና ሌላውን አማራጭ በማስታወሻ ማቅረብ የጽሑፉን ትርጉማዊ ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩን ረዥም አገባብ ሳይከብድ ለማቅረብ «እንዲሁም» ተጨምሯል፤ የሁለቱን የማስታወስ ይዘቶች—ታዛዥነታቸውንና እርሱን የተቀበሉበትን ሁኔታ—ግልጽ ያደርጋል።
