  terminology: «ጥልቅ ፍቅር» suitably communicates σπλάγχνα in modern standard Amharic. «ታዛዥነት» and «በፍርሃትና በመንቀጥቀጥ» are accurate and natural. The note preserves the idiom's reverential-serious nuance without eliminating its literal force.
