  yaml_path: translation/nt/2_corinthians/007/004.yaml
  text: I have great boldness toward you[a], and great boasting on your behalf. I am filled with encouragement[c][b]; I overflow with joy in all our affliction.
translation:
  language: am
  text: ለእናንተ ታላቅ ድፍረት አለኝ[a]፤ ስለ እናንተም በእጅጉ እመካለሁ። በማበረታቻ ተሞልቻለሁ[b]፤ በመከራችንም ሁሉ መካከል[c] በደስታ እጅግ እትረፈረፋለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በእናንተ ታላቅ መተማመን አለኝ»። የግሪኩ παρρησία በግልጽና በነጻነት መናገርንም ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «በመጽናናት ተሞልቻለሁ»። የግሪኩ παράκλησις ማበረታታትንም ማጽናናትንም ያካትታል።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ «መከራችን ሁሉ ቢኖርም»። ግሪኩ በቀጠለ መከራ መካከል የሚትረፈረፍ ደስታን ሊያመለክት ይችላል።
    reason: lexical_alternative
