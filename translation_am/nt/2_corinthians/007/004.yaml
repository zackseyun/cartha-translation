- source_word: πρὸς ὑμᾶς
  choice: ለእናንተ
  rationale: የጳውሎስ ድፍረት ወደ ቆሮንቶስ ሰዎች ያለውን ግንኙነታዊ አቅጣጫ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: καύχησις
  choice: እመካለሁ
  rationale: በጳውሎስ አጠቃቀም ያለውን አዎንታዊ የመመካት ንግግር ይጠብቃል፤ እዚህ ራስን ከፍ ማድረግን ሳይሆን ስለ እነርሱ በደስታ መናገርን ያመለክታል።
- source_word: ὑπὲρ ὑμῶν
  choice: ስለ እናንተ
  rationale: ዐውደ ንባቡ ጳውሎስ እነርሱን በተመለከተና ለእነርሱ ክብር እንደሚመካ ስለሚያሳይ፣ ይህ አገላለጽ በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: πεπλήρωμαι
  choice: ተሞልቻለሁ
  rationale: የግሪኩ ፍጹም ተደራጊ ቅርጽ ከቀደመ ድርጊት የተገኘውን አሁናዊ ሁኔታ ያሳያል።
- source_word: παρακλήσει
  choice: ማበረታቻ
  rationale: ቃሉ ማበረታታትንና ማጽናናትን ያካትታል። «ማበረታቻ» በዚህ ዐውደ ንባብ ያለውን የማጠናከር ገጽታ በግልጽ ያቀርባል፤ ሌላው ገጽታ በማስታወሻ ተጠብቋል።
- source_word: ὑπερπερισσεύομαι
  choice: ከመጠን በላይ ሞልቷል
  rationale: የተጠናከረው ግስ እጅግ መብዛትንና መትረፍረፍን ያሳያል፤ አገላለጹም በአማርኛ የብዛቱን ኃይል ይጠብቃል።
- source_word: χαρᾷ
  choice: ደስታዬ
  rationale: χαρά በቀጥታ ደስታን ያመለክታል፤ የባለቤትነት ቅጥያው የመጀመሪያ መደብ ግሱን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐπὶ πάσῃ τῇ θλίψει ἡμῶν
  choice: በመከራችን ሁሉ መካከል
  rationale: ደስታው መከራ በሌለበት ሳይሆን በመከራው መካከል እንደሚበዛ ያሳያል፤ የግሪኩን ግንኙነታዊ ውጥረት አይፈታውም።
- source_word: πολλή ... πολλή
  choice: ታላቅ ... በእጅጉ
  rationale: ተደጋጋሚውን የብዛት አጽንዖት በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ከየስሞቹና ግሱ ጋር የሚስማማ ልዩ አገላለጽ ተመርጧል።
