  text: ἀλλ’ ὅτε εἶδον ὅτι οὐκ ὀρθοποδοῦσιν πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου, εἶπον τῷ ⸀Κηφᾷ ἔμπροσθεν πάντων· Εἰ σὺ Ἰουδαῖος ὑπάρχων ἐθνικῶς ⸂καὶ ⸀οὐκ Ἰουδαϊκῶς ζῇς⸃, ⸀πῶς τὰ ἔθνη ἀναγκάζεις Ἰουδαΐζειν;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/014.yaml
  text: But when I saw that they were not walking in step with the truth of the gospel[a], I said to Cephas before them all, “If you, though a Jew, live like a Gentile and not like a Jew[b], how do you compel the Gentiles to live like Jews?”
translation:
  language: am
  text: ነገር ግን፣ በወንጌሉ እውነት መሠረት ቀጥ ብለው እንደማይሄዱ ባየሁ ጊዜ[a]፣ በሁሉም ፊት ኬፋን እንዲህ አልኩት፤ “አንተ አይሁዳዊ ሆነህ ሳለህ፣ እንደ አሕዛብ ትኖራለህ እንጂ እንደ አይሁዳዊ አትኖርም፤ ታዲያ አሕዛብን እንደ አይሁዳውያን እንዲኖሩ እንዴት ታስገድዳቸዋለህ?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ይበልጥ ቃል በቃል፦ “ወደ ወንጌሉ እውነት ቀጥ ብለው እንደማይሄዱ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፦ “አሕዛብን የአይሁድን ልማድ እንዲከተሉ እንዴት ታስገድዳቸዋለህ?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀρθοποδοῦσιν
  choice: ቀጥ ብለው እንደማይሄዱ
  rationale: የግሪኩን ‘ቀጥ ብሎ መራመድ’ ምስል ይጠብቃል፤ በዐውዱም ምግባራቸው ከወንጌሉ እውነት ጋር አለመጣጣሙን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου
  choice: በወንጌሉ እውነት መሠረት
  rationale: πρός ከὀρθοποδοῦσιν ጋር የአቅጣጫ ብቻ ሳይሆን ከመለኪያ ጋር መስማማትን ያመለክታል፤ ይህ አገላለጽ ያንን ሐሳብ ግልጽ ያደርጋል።
- source_word: Κηφᾷ
  choice: ኬፋን
  rationale: ጳውሎስ እዚህ የተጠቀመውን ኬፋ የሚለውን ስም ይጠብቃል፤ በአማርኛ የቀጥታ ግስ ተሳቢ ስለሆነ -ን ተጨምሯል።
- source_word: ἐθνικῶς
  choice: እንደ አሕዛብ
  rationale: የአኗኗር ሁኔታን የሚገልጸውን ተውሳክ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: Ἰουδαϊκῶς
  choice: እንደ አይሁዳውያን
  rationale: ከἐθνικῶς ጋር ያለውን ተቃርኖና ሰዋሰዋዊ ትይዩነት ይጠብቃል።
- source_word: ἀναγκάζεις
  choice: ታስገድዳቸዋለህ
  rationale: ግሱ የያዘውን የግዳጅ ወይም የጠንካራ ጫና ኃይል በግልጽ አማርኛ ያስተላልፋል።
- source_word: Ἰουδαΐζειν
  choice: እንደ አይሁዳውያን እንዲኖሩ
  rationale: በአይሁዳውያን ልማድ መኖርን በዘመናዊና ቀላል አማርኛ ይገልጻል፤ ‘እንዲያይሁዱ’ የሚለው ባህላዊ ቃል በማስታወሻ ተጠብቋል።
- source_word: πῶς
  choice: እንዴት
  rationale: ጥያቄውን እንደ ችሎታ (‘እንዴት ትችላለህ?’) ሳይተረጉም፣ የአድራጎቱን አለመጣጣም በቀጥታ ይጠይቃል።
theological_decisions:
- issue: Ἰουδαΐζειν የሚለውን ቃል የኋለኛ ዘመን የአስተምህሮ ክርክር ሳይጫንበት መተርጎም
  choice: እንደ አይሁዳውያን እንዲኖሩ
  alternative: እንዲያይሁዱ / የአይሁድን ልማዶች እንዲቀበሉ
  rationale: የቅርብ ዐውዱ የማዕድ ኅብረትንና የብሔራዊ-ማኅበራዊ ድንበሮችን ይመለከታል። ምርጫው ሐሳቡን ግልጽ ሲያደርግ የኋለኛ ዘመን ቴክኒካዊ ትርጉም አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ቀጥ ብሎ መሄድ’ የሚለው ምስላዊ አነጋገር ተጠብቆ፣ የዓረፍተ ነገሩ ግንባታ ለአማርኛ ንባብ ተፈጥሯዊ ሆኗል።
