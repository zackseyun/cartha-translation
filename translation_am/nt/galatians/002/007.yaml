- source_word: τῆς περιτομῆς
  choice: ለተገረዙት
  rationale: ከ«ለአልተገረዙት» ጋር ያለውን ትይዩነትና በግሪኩ ያለውን የቃል ምርጫ ይጠብቃል።
- source_word: '[ellipsis after Πέτρος τῆς περιτομῆς]'
  choice: ወንጌልን እንዲሰብክ አደራ እንደተሰጠው
