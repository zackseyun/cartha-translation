theological_decisions:
- issue: ἀκροβυστία / περιτομήን በዘር ስያሜ («አሕዛብ / አይሁድ») ወይስ በግሪኩ ባለው የቃል ኪዳን ምልክት መተርጎም
  choice: ለአልተገረዙት / ለተገረዙት
  alternative: ለአሕዛብ / ለአይሁድ፤ የአለመገረዝ / የመገረዝ
  rationale: ይህ ምርጫ ጳውሎስ የተጠቀመበትን የመገረዝ ሁኔታ መሠረት ያደረገ የቃል ኪዳንና የቡድን ስያሜ ይጠብቃል፤ ወደ ንጹሕ የዘር ስያሜም አይቀይረውም።
- issue: τὸ εὐαγγέλιον τῆς ἀκροβυστίας የተለያየ ወንጌል ያመለክት እንደሆነ ወይስ የአገልግሎት ቡድንን
  choice: ለእያንዳንዱ ቡድን ወንጌልን የመስበክ አደራ
  alternative: «የአለመገረዝ ወንጌል / የመገረዝ ወንጌል» ብሎ ቃል በቃል መተርጎም
  rationale: አውዱና ትይዩ ሰዋሰው አንድ ወንጌል ለተለያዩ የአገልግሎት ቡድኖች አደራ መሰጠቱን ያመለክታሉ፤ ቃል በቃሉ ግን በማስታወሻ ተጠብቋል።
