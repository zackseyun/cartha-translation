  text: ነገር ግን በተቃራኒው፣[a] ለአልተገረዙት የሚሆነው ወንጌል በአደራ እንደተሰጠኝ፣ ልክ እንደ ጴጥሮስም ለተገረዙት የሚሆነው ወንጌል በአደራ እንደተሰጠው ባዩ ጊዜ፣
