- source_word: ἰδόντες
  choice: ባዩ ጊዜ
  rationale: የአኦሪስት አሳታፊውን እንደ ዋናው ድርጊት ሁኔታ በግልጽና ተፈጥሯዊ የጊዜ ሐረግ ይገልጻል።
- source_word: πεπίστευμαι
  choice: አደራ እንደተሰጠኝ
  rationale: ፍጹም ተደራጊ ግሱ እዚህ መልእክትና ኃላፊነት በአደራ መቀበልን ያመለክታል።
- source_word: τὸ εὐαγγέλιον
  choice: ወንጌልን
  rationale: በጳውሎሳዊ አውድ የተለመደውንና ሥነ መለኮታዊ ክብደቱን የሚጠብቀውን ቃል ይጠቀማል።
- source_word: τῆς ἀκροβυστίας
  choice: ለአልተገረዙት
  rationale: የግሪኩን የመገረዝ ሁኔታ የሚገልጽ ቡድናዊ ስያሜ ይጠብቃል፤ «ለአሕዛብ» ብሎ በሰፊው አይተረጉመውም።
- source_word: καθὼς
