  text: εἰ δὲ ζητοῦντες δικαιωθῆναι ἐν Χριστῷ εὑρέθημεν καὶ αὐτοὶ ἁμαρτωλοί, ἆρα Χριστὸς ἁμαρτίας διάκονος; μὴ γένοιτο·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/017.yaml
  text: But if[a], while seeking to be justified in Messiah, we ourselves also were found to be sinners, is Messiah then a servant of sin? May it never be!
translation:
  language: am
  text: ነገር ግን በመሲሑ[a] ጻድቃን እንድንቈጠር ስንፈልግ፣ እኛም ራሳችን ኃጢአተኞች ሆነን ብንገኝ፣ ታዲያ መሲሑ የኃጢአት አገልጋይ ነውን? ፈጽሞ አይሁን!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: መሲሕ፦ እዚህና በዚህ ቁጥር በሚቀጥለው ስፍራ በተለምዶ «ክርስቶስ» ተብሎ ይተረጎማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητοῦντες
  choice: ስንፈልግ
  rationale: ዋናው ግስ ከሚገልጸው ሁኔታ ጋር በአንድ ጊዜ የሚከናወን ፍለጋ መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: δικαιωθῆναι
  choice: ጻድቃን ተብለን ለመቈጠር
  rationale: የግሪኩን ተደራጊ ቅርጽና የፍርድ አዋጅ ገጽታ በግልጽ ዘመናዊ አማርኛ ይጠብቃል፤ ሰው በባሕርይ ጻድቅ እንደሚደረግ ብቻ አያስገድድም።
- source_word: ἐν Χριστῷ
  choice: በመሲሑ
  rationale: ἐν የሚያሳየውን ከመሲሑ ጋር ያለ ግንኙነት/መሠረት ሳይጠብብ ያቀርባል፤ Χριστός እዚህ እንደ ማዕረግ ተተርጉሟል።
- source_word: εὑρέθημεν
  choice: ሆነን ከተገኘን
  rationale: የግሪኩን ተደራጊ አገላለጽና የክርክሩን ምርመራዊ ኃይል ይጠብቃል።
- source_word: καὶ αὐτοὶ ἁμαρτωλοί
  choice: እኛ ራሳችንም ኃጢአተኞች
  rationale: αὐτοὶ የሚሰጠውን አጽንዖት «ራሳችንም» በማለት በግልጽ ያሳያል።
- source_word: ἁμαρτίας διάκονος
  choice: የኃጢአት አገልጋይ
  rationale: διάκονος የሚያመለክተውን ማገልገል ይጠብቃል፤ መደበኛ የቤተ ክርስቲያን ሹመትን በጽሑፉ ውስጥ አያስገባም።
- source_word: μὴ γένοιτο
  choice: ፈጽሞ አይሁን!
  rationale: የጳውሎስን ኃይለኛ እምቢታና የምኞታዊውን የግስ ቅርጽ ተፈጥሯዊ በሆነ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: ንግግሩ መሲሑ ኃጢአትን እንደሚያስከትል የሚያስተምር እንዳይመስል
  choice: «ታዲያ መሲሑ የኃጢአት አገልጋይ ነውን?» የሚል የክርክር ጥያቄ ሆኖ ቀርቧል።
  alternative: «መሲሑ ኃጢአትን ያስከትላልን?»
  rationale: ግሪኩ የሚያቀርበው ወዲያው የሚካድ አመክንዮአዊ ውጤት እንጂ መሲሑ ኃጢአትን ይፈጥራል የሚል አስተምህሮ አይደለም። «አገልጋይ» የጽሑፉን ውጥረት ሳይፈታ ይጠብቃል።
- issue: δικαιωθῆναι የፍርድ አዋጅ ወይም የውስጥ ለውጥ ብቻ እንደሆነ አስቀድሞ መወሰን
  choice: «ጻድቃን ተብለን ለመቈጠር»
  alternative: «ጻድቃን ለመሆን»
  rationale: የተደራጊውን ቅርጽና የተቀባይነት/አዋጅ ገጽታ ያሳያል፤ ከግሪኩ በላይ ወደ አንድ የሥነ መለኮት ሥርዓት አያጠብበውም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ታዲያ» የἆραን የመደምደሚያ ጥያቄ ኃይል ያሳያል፤ «ነውን?» የአጻጻፍ ቅርጹን በክብር ይጠብቃል።
