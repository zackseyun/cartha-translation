  text: For through the law I died to the law, so that I might live to God. I have been crucified with Messiah.
translation:
  language: am
  text: ምክንያቱም እኔ በሕግ ለሕግ ሞትኩ፤ ይህም ለእግዚአብሔር እንድኖር ዘንድ ነው። ከመሲሑ ጋር ተሰቅያለሁ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: ግን
  rationale: በአማርኛ የቀደመውን ሐሳብ የሚያብራራ የክርክር ቅጥያ ሆኖ በተፈጥሮ ይነበባል፤ እዚህ ‘ምክንያቱም’ ከማለት ይልቅ የግሪኩን አጭር ፍሰት ይጠብቃል።
- source_word: διὰ νόμου
  choice: በሕግ በኩል
  rationale: διά ከወራሽ ስም ጋር ያለውን የመንገድ ወይም የመሣሪያ ኃይል ይጠብቃል፤ ትርጉሙን ወደ ‘በሕጉ ፍርድ’ አያሰፋውም።
- source_word: νόμῳ
  choice: ለሕግ
  rationale: የግሪኩን ዳቲቭ ቅርጽና ‘ለሕግ መሞት’ የሚለውን ጥቅጥቅ ያለ ጳውሎሳዊ አገላለጽ ይጠብቃል።
- source_word: ἀπέθανον
  choice: ሞትሁ
  rationale: አኦሪስቱን እንደ ወሳኝ የቀድሞ ክስተት በቀላል ያለፈ ጊዜ ይገልጣል።
- source_word: ἵνα θεῷ ζήσω
  choice: ይህም ለእግዚአብሔር እንድኖር ነው
  rationale: ἵνα የሚያመለክተውን ዓላማ በተፈጥሯዊ አማርኛ ይገልጣል፤ θεῷ ያለውን አቅጣጫዊና ግንኙነታዊ ኃይል ‘ለእግዚአብሔር’ በማለት ይጠብቃል።
- source_word: Χριστῷ
  choice: ከመሲሑ ጋር
  rationale: Χριστόςን እንደ ማዕረግ ‘መሲሕ’ ብሎ ያቀርባል፤ የአማርኛው የወሰን ቅጥያ ማዕረጉን ተፈጥሯዊ ያደርገዋል።
- source_word: συνεσταύρωμαι
  choice: ተሰቅያለሁ
  rationale: ፍጹም ጊዜው ያለፈ ድርጊትንና እስከአሁን የሚቆየውን ውጤቱን በአማርኛ ፍጹም ቅርጽ ይጠብቃል፤ ‘ከ...ጋር’ ደግሞ συν-ን ይወክላል።
theological_decisions:
- issue: ‘በሕግ በኩል ለሕግ ሞትሁ’ የሚለውን ጥቅጥቅ ያለ ንግግር ማብራራት ወይም እንዳለ መተው
  choice: በሕግ በኩል ለሕግ ሞትሁ
  alternative: በሕጉ ፍርድ ከሕግ ሥልጣን ነፃ ሆንሁ
  rationale: የግሪኩ ንግግር አጭርና በሥነ መለኮት ውጥረት የተሞላ ነው። ሕጉ ይህን እንዴት እንዳደረገ በዋናው ጽሑፍ ማብራራት ከምንጩ በላይ አንድ ትርጓሜ መጫን ይሆናል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የመጀመሪያው አረፍተ ነገር የምንጩን ሥነ መለኮታዊ ጥቅጥቅነት ሆን ብሎ ይጠብቃል።
