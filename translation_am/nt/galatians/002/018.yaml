  rationale: የግሪኩን ሁኔታዊ አሳብ በአማርኛው የቅድመ ሁኔታ ግስ ይገልጻል፤ γάρ ከቀደመው ክርክር ጋር ያለው ማብራሪያዊ ግንኙነት በቁጥሩ ፍሰት ውስጥ በተፈጥሮ ይገኛል።
