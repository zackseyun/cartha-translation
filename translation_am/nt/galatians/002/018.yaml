- source_word: κατέλυσα
  choice: ያፈረስኳቸውን
  rationale: ከοἰκοδομῶ ጋር ያለውን የሕንፃ ዘይቤ በግልጽ ሁኔታ ይጠብቃል፤ ‘ያጠፋሁት’ የሚለው አማራጭ ዘይቤውን ያደበዝዛል።
- source_word: πάλιν οἰκοδομῶ
  choice: እንደገና ብገነባ
  rationale: πάλινን ‘እንደገና’ ብሎ እና οἰκοδομῶን ‘ብገነባ’ ብሎ በመተርጎም የመልሶ መገንባትን ምስልና ሁኔታዊ አሳቡን ይጠብቃል።
- source_word: παραβάτην
  choice: በደለኛ
  rationale: የπαραβάτηςን ሕጋዊና ሥነ ምግባራዊ ጥላ ሳያጠብ በዘመናዊ አማርኛ ለአንባቢው በቀላሉ ይገባል፤ ‘ሕግ ተላላፊ’ የሚለው አማራጭ ትርጉሙን ይበልጥ ወደ ተወሰነ ሕግ ሊያጠብ ይችላል።
- source_word: ἐμαυτὸν συνιστάνω
  choice: ራሴን ... አረጋግጣለሁ
  rationale: የአንደኛ መደብ አንጸባራቂውን ἐμαυτόν እና የ‘ማሳየት/ማረጋገጥ’ ኃይል ያለውን συνιστάνω በግልጽ ይገልጻል።
