  choice: በደለኛ
  alternative: ሕግ ተላላፊ
  rationale: የግሪኩ ቃል ሕጋዊ ጥላ ቢኖረውም በራሱ የትኛውን ሕግ እንደሚያመለክት አይገድብም፤ ትርጉሙ የአውዱን ሥነ መለኮታዊ ውጥረት ክፍት ያደርገዋል።
