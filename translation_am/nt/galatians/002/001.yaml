  text: Ἔπειτα διὰ δεκατεσσάρων ἐτῶν πάλιν ἀνέβην εἰς Ἱεροσόλυμα μετὰ Βαρναβᾶ συμπαραλαβὼν καὶ Τίτον·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/001.yaml
  text: Then after fourteen years I went up again to Jerusalem with Barnabas, also taking Titus along.
translation:
  language: am
  text: ከዚያም ከአሥራ አራት ዓመታት በኋላ ከበርናባስ ጋር እንደገና ወደ ኢየሩሳሌም ወጣሁ፤ ቲቶንም አብሬ ወሰድኩት።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔπειτα
  choice: ከዚያም
  rationale: የጳውሎስን ትረካ በተፈጥሯዊ የቅደም ተከተል አገናኝ ይቀጥላል።
- source_word: διὰ δεκατεσσάρων ἐτῶν
  choice: ከአሥራ አራት ዓመት በኋላ
  rationale: διά ከዘር አገባብ ጋር በዚህ ጊዜያዊ አጠቃቀም አንድ ክስተት ከመፈጸሙ በፊት ያለፈውን ጊዜ ያመለክታል።
- source_word: πάλιν
  choice: እንደገና
  rationale: ወደ ኢየሩሳሌም የተደረገው ጉዞ የተደገመ መሆኑን በግልጽ ያሳያል።
- source_word: ἀνέβην
  choice: ወጣሁ
  rationale: ወደ ኢየሩሳሌም መጓዝን ‘መውጣት’ ብሎ የሚገልጸውን የምንጩን የተለመደ አነጋገርና መልክዓ ምድራዊ አቅጣጫ ይጠብቃል።
- source_word: εἰς Ἱεροσόλυμα
  choice: ወደ ኢየሩሳሌም
  rationale: εἰς የመድረሻ አቅጣጫን የሚያመለክትበትን መደበኛ ትርጉም ያስተላልፋል።
- source_word: μετὰ Βαρναβᾶ
  choice: ከበርናባስ ጋር
  rationale: በርናባስ ከጳውሎስ ጋር እንደተጓዘ ቀጥተኛና ተፈጥሯዊ በሆነ አማርኛ ይገልጻል።
- source_word: συμπαραλαβὼν καὶ Τίτον
  choice: ቲቶንም አብሬ ወሰድሁት
  rationale: ተሳቢው ግስ ከዋናው ጉዞ ጋር አብሮ የተፈጸመውን ድርጊት ያሳያል፤ -ም ደግሞ ቲቶ ከበርናባስ በተጨማሪ አብሮ መሄዱን ያስተላልፋል።
theological_decisions:
- issue: የአሥራ አራቱ ዓመታት መቆጠር ከየት እንደሚጀምር
  choice: የጊዜውን መነሻ አለመግለጽ
  alternative: ከቀደመው የኢየሩሳሌም ጉዞ ወይም ከጳውሎስ መጠራት ጀምሮ እንደሆነ መግለጽ
  rationale: የግሪክ ጽሑፉ የአሥራ አራቱ ዓመታት መነሻ የትኛው ክስተት እንደሆነ በግልጽ አይወስንም፤ ትርጉሙም ይህን አሻሚነት ጠብቋል።
translation_notes:
