    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεργήσας / ἐνήργησεν
  choice: የሠራው / ሠርቷል
  rationale: የሁለቱን የግሪክ ግስ የቃል ዝምድናና በጴጥሮስና በጳውሎስ አገልግሎት መካከል ያለውን ትይዩነት ለመጠበቅ ተመሳሳይ የአማርኛ ግስ ተጠቅመናል፤ ‘ኃይል ሰጠ’ የሚለውን ትርጓሜ በጽሑፉ ላይ አልጨመርንም።
- source_word: Πέτρῳ / ἐμοὶ
  choice: በጴጥሮስ በኩል / በእኔም በኩል
  rationale: በዐውዱ ውስጥ ያለውን መሣሪያዊ የዳቲቭ አጠቃቀም ያሳያል፤ ድርጊቱ በጴጥሮስና በጳውሎስ አገልግሎት በኩል መከናወኑን ይገልጣል።
- source_word: εἰς ἀποστολὴν
  choice: ሐዋርያ ሆኖ/ሆኜ እንዲያገለግል/እንዳገለግል
  rationale: ‘ሐዋርያነት’ የሚለውን ስም በተፈጥሯዊና በቀላሉ በሚገባ የአማርኛ ሐረግ ገልጦ፣ ወደ ሐዋርያዊ ተልእኮና አገልግሎት የሚያመለክተውን አቅጣጫ ይጠብቃል።
- source_word: τῆς περιτομῆς
  choice: ለተገረዙት
  rationale: ‘ግርዛት’ የተገረዙትን የአይሁድ ሕዝብ በውክልና የሚያመለክት በመሆኑ፣ የዐውዱን ፍቺ በግልጽ አማርኛ ያቀርባል፤ ቀጥተኛው አገላለጽ በግርጌ ማስታወሻ ተጠብቋል።
- source_word: τὰ ἔθνη
  choice: አሕዛብ
  rationale: በጳውሎስ ዐውድ ከተገረዙት ጋር የሚነጻጸሩትን አይሁድ ያልሆኑ ሕዝቦች የሚያመለክት የተለመደ አማርኛ ቃል ነው፤ ‘ብሔራት’ የሚለው አማራጭ በግርጌ ማስታወሻ ቀርቧል።
theological_decisions:
- issue: የድርጊቱን አድራጊ ‘እግዚአብሔር’ ብሎ በግልጽ መጨመር ወይም አለመጨመር
  choice: ‘የሠራው’ የሚለውን ስማዊ አገላለጽ ማቆየት
  alternative: ‘እግዚአብሔር ... ሠርቷል’ ብሎ በግልጽ መተርጎም
  rationale: ግሪኩ በቀጥታ ‘እግዚአብሔር’ የሚል ስም ሳይጠቀም ‘የሠራው’ የሚል አርቲክል ያለው ቦዝ አንቀጽ ይጠቀማል። ይህን ቅርጽ ማቆየት ከዐውዱ የሚገባውን መለኮታዊ አድራጊ ሳይክድ፣ በምንጩ ያልተጻፈውን ስም ከመጨመር ይቆጠባል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅመናል። ‘ሠራ’ የሚለውን ድግግሞሽ በመጠበቅ የግሪኩ ትይዩ አወቃቀር ተንጸባርቋል፤ ‘አሕዛብ’ የሚለው ቃል ከ‘ተገረዙት’ ጋር ያለውን ታሪካዊ ንጽጽር ይጠብቃል።
