  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἰδότες ⸀δὲ ὅτι οὐ δικαιοῦται ἄνθρωπος ἐξ ἔργων νόμου ἐὰν μὴ διὰ πίστεως ⸂Ἰησοῦ Χριστοῦ⸃, καὶ ἡμεῖς εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν, ἵνα δικαιωθῶμεν ἐκ πίστεως Χριστοῦ καὶ οὐκ ἐξ ἔργων νόμου, ⸂ὅτι ἐξ ἔργων νόμου οὐ δικαιωθήσεται⸃ πᾶσα σάρξ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/016.yaml
  text: Yet knowing that a person is not justified by works of the law except through faith in Jesus the Messiah[a], even we have believed in Messiah Jesus, so that we might be justified by faith in Messiah and not by works of the law[c][b], because by works of the law no flesh will be justified.
translation:
  language: am
  text: ነገር ግን ሰው በሕግ ሥራዎች እንደማይጸድቅ፣ በኢየሱስ መሲሕ በማመን እንጂ፣ እያወቅን፣ እኛም በሕግ ሥራዎች ሳይሆን በመሲሕ በማመን እንድንጸድቅ በመሲሕ ኢየሱስ አምነናል፤ ምክንያቱም ሥጋ ሁሉ[c] በሕግ ሥራዎች አይጸድቅም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: ቃል በቃል፣ “ሥጋ ሁሉ።” ሰው ሁሉን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιοῦται / δικαιωθῶμεν / δικαιωθήσεται
  choice: የሚጸድቀው / እንድንጸድቅ / አይጸድቅም
  rationale: በአማርኛ የመጽሐፍ ቅዱስ ቋንቋ የተለመደውንና የፍርድ ነክ ኃይሉን የሚጠብቀውን ‘መጽደቅ’ በሦስቱም ቦታዎች በወጥነት ተጠቅመናል።
- source_word: ἄνθρωπος
  choice: ሰው
  rationale: ነጠላ አጠቃላይ ትርጉሙን በተፈጥሯዊና ሁሉን አካታች ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἐξ ἔργων νόμου
  choice: በሕግ ሥራዎች
  rationale: የጳውሎስን ልዩ አገላለጽ ይጠብቃል፤ ‘መልካም ሥራዎች’ ብሎ ትርጉሙን አያሰፋውም።
- source_word: διὰ πίστεως Ἰησοῦ Χριστοῦ
  choice: በኢየሱስ መሲሕ በማመን
  rationale: የግሪኩን ግራ ሊያጋባ የሚችል የጄኒቲቭ ግንኙነት በዋናው ጽሑፍ እንደ ‘በኢየሱስ መሲሕ ማመን’ ተርጉሞ፣ ሌላው ትርጉም በማስታወሻ ተጠብቋል።
- source_word: εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν
  choice: በመሲሕ ኢየሱስ አምነናል
  rationale: πιστεύω εἰς የሚለውን በተፈጥሯዊ አማርኛ ያቀርባል፤ የተፈጸመውና አሁንም ውጤት ያለው እምነት ‘አምነናል’ ተብሎ ተገልጿል።
- source_word: ἐκ πίστεως Χριστοῦ
  choice: በመሲሕ በማመን
  rationale: ከቀደመው πίστις Χριστοῦ ጋር ወጥነትን ይጠብቃል፤ ‘የመሲሑ ታማኝነት’ የሚለው አማራጭ በማስታወሻ ቀርቧል።
- source_word: Χριστοῦ / Χριστόν
  choice: መሲሕ
  rationale: Χριστόςን እንደ ማዕረግ ‘መሲሕ’ ብሎ ይተረጉማል፤ በአማርኛም የታወቀና ክቡር አጠራር ነው።
- source_word: πᾶσα σάρξ
  choice: ሥጋ ለባሽ ሁሉ
  rationale: የቅዱሳት መጻሕፍትን ምሳሌያዊ አገላለጽ ይጠብቃል፣ በአማርኛም ‘ሰው ሁሉ’ የሚለውን ትርጉም በግልጽ ያስተላልፋል።
- source_word: εἰδότες δὲ
  choice: ነገር ግን … እንደሆነ እናውቃለን
  rationale: የδέን ለስላሳ ተቃርኖና የεἰδότεςን የጋራ ዕውቀት በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἐὰν μὴ
  choice: ሳይሆን
  rationale: በዐውዱ ያለውን ‘ከሕግ ሥራዎች ሳይሆን፣ በእምነት’ የሚል ተቃርኖ በተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: πίστις Χριστοῦ / πίστεως Ἰησοῦ Χριστοῦ የሚለው አገላለጽ
  choice: በኢየሱስ መሲሕ ማመን / በመሲሕ ማመን
  alternative: የኢየሱስ መሲሕ ታማኝነት / የመሲሑ ታማኝነት
  rationale: የግሪኩ ጄኒቲቭ አወቃቀር በክርስቶስ ላይ የሚደረግ እምነትን ወይም የክርስቶስን ታማኝነት ሊያመለክት ይችላል። ዋናው ጽሑፍ የመጀመሪያውን ይከተላል፤ እውነተኛው አማራጭ ግን በማስታወሻ ተጠብቋል።
- issue: δικαιόω የሚለው የፍርድ ነክ ቃል
  choice: መጽደቅ
  alternative: ጻድቅ ሆኖ መቆጠር / ጻድቅ ተብሎ መፈረድ
  rationale: ‘መጽደቅ’ የግሪኩን አጭርና የሥነ መለኮት ኃይል ይጠብቃል፣ አንድን ብቻ የትርጓሜ አቅጣጫ አያስገድድም።
- issue: ἄνθρωπος አጠቃላይ ነጠላ ትርጉም
  choice: ሰው
  alternative: አንድ ሰው
  rationale: ‘ሰው’ በአማርኛ ፆታን ሳይለይ አጠቃላይ ነጠላ ሰውን በተፈጥሮ ይገልጻል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅመናል። የጳውሎስ ዋና ዋና የሥነ መለኮት ቃላት—‘መጽደቅ፣’ ‘የሕግ ሥራዎች፣’ እና ‘መሲሕ’—ተጠብቀዋል፤ የπίστις Χριστοῦ አሻሚነትም በማስታወሻዎች ተገልጿል።
