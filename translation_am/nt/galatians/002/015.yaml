lexical_decisions:
- source_word: Ἡμεῖς
  choice: እኛ
  rationale: ግልጽ ተውላጠ ስሙን በመጠበቅ የንግግሩን መጠነኛ አጽንዖት ያሳያል።
- source_word: φύσει
  choice: በትውልድ
  rationale: በዚህ አውድ ቃሉ ውስጣዊ ሥነ ምግባርን ሳይሆን የተፈጥሮ ወይም የዘር አመጣጥን ያመለክታል፤ “በትውልድ” ይህን በዘመናዊ አማርኛ በግልጽ ያቀርባል።
- source_word: Ἰουδαῖοι
