- source_word: ἐξ ἐθνῶν
  choice: ከአሕዛብ ወገን የሆንን
  rationale: የἐξን የመገኛ ወይም የወገን ሐሳብ ይጠብቃል፤ በጳውሎስ አውድ ἔθνη ከአይሁድ ውጭ ያሉ ሕዝቦችን ያመለክታል።
- source_word: ἁμαρτωλοί
  choice: “ኃጢአተኞች”
  rationale: የግሪኩን ቀጥተኛና የተለመደ ቃል ይጠብቃል። የጥቅስ ምልክቶቹ በዚህ አውድ የቀረበውን የተለመደ የአይሁድ መለያ አነጋገር እንደሆነ ያሳያሉ፣ ነገር ግን ቃሉን አያለዝቡትም።
theological_decisions:
- issue: ንግግሩ ጳውሎስ አይሁድ ከአሕዛብ በሥነ ምግባር ይበልጣሉ ብሎ እንደሚያጸድቅ እንዲሰማ ማድረግ ወይም አለማድረግ
  choice: ጽሑፉ የቀረበውን የብሔር ንጽጽር ሳያለዝብ ይጠብቃል፤ “ኃጢአተኞች” የሚለውን በጥቅስ ምልክት በማቅረብ የአነጋገሩን አውዳዊ ባሕርይ ያመለክታል።
  alternative: “እንደ አሕዛብ ኃጢአተኞች ተብለን የማንቆጠር” ብሎ በትርጓሜ ማስፋት።
  rationale: ግሪኩ ንጽጽሩን አጭርና ቀጥተኛ አድርጎ ያቀርባል። ቀጣዩ አውድ ሐሳቡን ቢያብራራም፣ ያንን ማብራሪያ ወደዚህ ነጠላ ቁጥር ማስገባት አይገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ሴሚኮሎኑ የግሪኩን καί ተያያዥ ንጽጽር በተፈጥሯዊ አማርኛ ያቀርባል። የግርጌ ማስታወሻ ምልክቶች በዋናው ጽሑፍ [a][b] ብለው ተካተዋል።
