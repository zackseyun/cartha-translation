lexical_decisions:
- source_word: συνυπεκρίθησαν
  choice: ከእርሱ ጋር በግብዝነት አደረጉ
  rationale: የσύν-ን የጋራ ተሳትፎ እና የὑποκρίνομαιን የማስመሰል ባሕርይ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: αὐτῷ
  choice: ከእርሱ ጋር
  rationale: የድርጊት ተባባሪነትን የሚገልጸውን ዳቲቭ በግልጽ ሁኔታ ያሳያል።
- source_word: οἱ λοιποὶ Ἰουδαῖοι
  choice: የቀሩትም አይሁድ
  rationale: λοιποί ከጴጥሮስ ውጭ ያሉትን የቀረውን ቡድን ያመለክታል፤ Ἰουδαῖοι ደግሞ በዚህ ዐውድ የአይሁድን ሕዝብ ያመለክታል።
- source_word: συναπήχθη
  choice: አብሮ ተሳበ
  rationale: ተገብሮ ቅርጹንና በሌሎች ተጽእኖ አብሮ የመወሰድን ሐሳብ ይጠብቃል፤ συν- ያለውንም የአብሮነት ኃይል ያሳያል።
- source_word: ὑποκρίσει
  choice: በግብዝነታቸው
  rationale: የማስመሰልና ከእውነተኛ አቋም በተቃራኒ የመሥራት ባሕርይን የሚገልጽ መደበኛ አማርኛ ነው።
