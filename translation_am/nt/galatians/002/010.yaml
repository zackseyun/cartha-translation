  text: ድሆችን እንድናስብ ብቻ ጠየቁን፤ እኔም ይህንኑ ለማድረግ እጅግ ተጋሁ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μόνον
  choice: ብቻ
  rationale: በስምምነቱ ላይ የተጨመረው ብቸኛ ጥያቄ መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τῶν πτωχῶν
  choice: ድሆችን
  rationale: በተግባራዊ እርዳታ የሚታሰቡ ድሆችን በቀጥታና በተለመደ ቃል ይገልጻል።
- source_word: ἵνα μνημονεύωμεν
  choice: እንድናስብ
  rationale: የጥያቄውን ይዘት ያሳያል፤ ‘ማሰብ’ በዚህ አውድ ለድሆች ተግባራዊ እንክብካቤ ማድረግን የሚያካትት ሲሆን የግሪኩን አገላለጽ አያሰፋውም።
- source_word: ὃ
  choice: ይህንኑ
  rationale: ከዚህ በፊት የተጠቀሰውን ጥያቄ በሙሉ ወደኋላ ያመለክታል።
- source_word: ἐσπούδασα
  choice: እጅግ እጓጓ ነበር
  rationale: ቃሉ የሚያመለክተውን ቅን ፍላጎትና ተግባራዊ ትጋት በዘመናዊና ተፈጥሯዊ አማርኛ ይይዛል።
- source_word: αὐτὸ τοῦτο ποιῆσαι
  choice: ይህንኑ ለማድረግ
  rationale: αὐτὸ τοῦτο ያለውን ‘ይህንኑ ነገር’ የሚል አጽንዖት ግልጽና ተፈጥሯዊ በሆነ መንገድ ይጠብቃል።
theological_decisions:
- issue: ጥያቄውን የገለጸው ማን እንደሆነ
  choice: ጠየቁን
  alternative: ግልጽ ያልሆነ ሐረግ፦ ‘ድሆችን እንድናስብ ብቻ’
  rationale: የግሪኩ አረፍተ ነገር በቀደመው አውድ የተገነዘበውን ጥያቄ በግስ ሳይደግም ይተዋል፤ በአማርኛ ሙሉና ተፈጥሯዊ እንዲሆን ‘ጠየቁን’ ተጨምሯል፣ ብዙ ቁጥሩም በ2፥9 የተጠቀሱትን ሰዎች ይመለከታል።
- issue: ‘ማሰብ’ ተግባራዊ እርዳታን በግልጽ መግለጽ አለበት ወይስ አይገባም
  choice: እንድናስብ
  alternative: እንድንረዳ
  rationale: μνημονεύω በቀጥታ ‘ማሰብ/ማስታወስ’ ማለት ነው፤ አውዱ ተግባራዊ እንክብካቤን ቢጠቁምም ‘እንድንረዳ’ ብሎ መተርጎም የምንጩን አገላለጽ ከሚገባው በላይ ይወስናል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ይህንኑ’ የግሪኩን አጽንዖት ይጠብቃል፤ ሰረዝ-ነጥቡም ሁለቱን ተያያዥ ክፍሎች በተፈጥሯዊ ሁኔታ ያገናኛል።
