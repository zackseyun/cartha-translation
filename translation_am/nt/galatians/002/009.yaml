  text: καὶ γνόντες τὴν χάριν τὴν δοθεῖσάν μοι, Ἰάκωβος καὶ Κηφᾶς καὶ Ἰωάννης, οἱ δοκοῦντες στῦλοι εἶναι, δεξιὰς ἔδωκαν ἐμοὶ καὶ Βαρναβᾷ κοινωνίας, ἵνα ⸀ἡμεῖς εἰς τὰ ἔθνη, αὐτοὶ δὲ εἰς τὴν περιτομήν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/009.yaml
  text: and recognizing the grace that had been given to me[a], James and Cephas and John, who were regarded as pillars, gave to Barnabas and me the right hands of fellowship[c][b], so that we would go to the Gentiles and they to the circumcised.
translation:
  language: am
  text: ለእኔ የተሰጠውን ጸጋ በተገነዘቡ ጊዜ፣ እንደ ዓምዶች የሚታሰቡት ያዕቆብ፣ ኬፋና ዮሐንስ ለእኔና ለበርናባስ የኅብረት ቀኝ እጆችን[a] ሰጡን፤ እኛ ወደ አሕዛብ[b]፣ እነርሱም ወደ ተገረዙት[c] እንድንሄድ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፦ “የኅብረት ቀኝ እጆችን።” ይህ ሐረግ የስምምነትና የአጋርነት ምልክትን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፦ “ወደ አገራት።” በዚህ አውድ ከአይሁድ ውጭ ያሉ ሕዝቦች ማለት ነው።
    reason: lexical_alternative
  - marker: c
    text: ቃል በቃል፦ “ወደ ግርዛት፤” ማለትም ወደ አይሁድ።
    reason: lexical_alternative
lexical_decisions:
- source_word: γνόντες
  choice: በተገነዘቡ ጊዜ
  rationale: ድርጊቱን ያስከተለውን መረዳትና እውቅና መስጠት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: χάριν
  choice: ጸጋ
  rationale: ቃሉ በጳውሎስ አጠቃቀም መለኮታዊ ሞገስንና በጥሪው የሚሠራውን ስጦታ የሚያካትት ሰፊ ትርጉሙን ይጠብቃል።
- source_word: Κηφᾶς
  choice: ኬፋ
  rationale: የግሪኩን የግል ስም በቀጥታ ያስተላልፋል፤ ‘ጴጥሮስ’ በሚለው ሌላ የታወቀ መጠሪያ አይተካውም።
- source_word: οἱ δοκοῦντες στῦλοι εἶναι
  choice: እንደ ዓምዶች የሚታሰቡት
  rationale: የሕዝብ ዘንድ የነበራቸውን ከፍተኛ አቋም ያሳያል፤ ንቀትን ወይም የጳውሎስን የግል ጥርጣሬ አያስገባም።
- source_word: δεξιὰς ... κοινωνίας
  choice: የኅብረት ቀኝ እጃቸውን
  rationale: የግሪኩን ብዙ ቁጥር በተፈጥሯዊ አማርኛ ‘እጃቸውን’ በማለት ይይዛል፤ ሐረጉም እውቅናን፣ ስምምነትንና የጋራ ተልእኮን ያመለክታል።
- source_word: ἔθνη
  choice: አሕዛብ
  rationale: በዚህ አውድ ከአይሁድ ውጭ ያሉ ሕዝቦችን ያመለክታል።
- source_word: περιτομήν
  choice: ተገረዙት
  rationale: ቃሉ የተገረዙትን፣ ማለትም አይሁድን፣ በምትክ የሚያመለክት መሆኑን በግልጽ አማርኛ ያሳያል።
theological_decisions:
- issue: κοινωνίας እንደ ‘ኅብረት’ ወይም ‘አጋርነት’ መተርጎም
  choice: ኅብረት
  alternative: አጋርነት
  rationale: አውዱ በሐዋርያዊ እውቅናና በተልእኮ ክፍፍል ላይ ቢያተኩርም፣ ‘ኅብረት’ የቃሉን ግንኙነታዊና የተሳትፎ ስፋት ሳያጠብ ይጠብቃል።
- issue: οἱ δοκοῦντες የንቀት ድምፅ እንዳለው መወሰን
  choice: ገለልተኛ የሕዝብ ዘንድ አቋም—‘የሚታሰቡት’
  alternative: ‘ዓምዶች የሚመስሉት’
  rationale: ግሪኩ በሌሎች ዘንድ የነበራቸውን እውቅና ሊገልጽ ይችላል፤ ትርጉሙ ጳውሎስ እየናቃቸው ነው ብሎ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ረጅም አረፍተ ነገርና የ‘እኛ/እነርሱ’ ንጽጽር ተጠብቋል፤ በግሪኩ የተተወው ‘መሄድ’ ግስ ለአማርኛ ግልጽነት በሁለቱም ክፍሎች ተጨምሯል።
