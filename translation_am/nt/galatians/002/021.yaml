id: GAL.2.21
reference: Galatians 2:21
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὐκ ἀθετῶ τὴν χάριν τοῦ θεοῦ· εἰ γὰρ διὰ νόμου δικαιοσύνη, ἄρα Χριστὸς δωρεὰν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/021.yaml
  text: I do not nullify the grace of God[a], for if righteousness comes through the law[c][b], then Messiah died for nothing.
translation:
  language: am
  text: የእግዚአብሔርን ጸጋ አልጥልም፤ ጽድቅ[a] በሕግ የሚገኝ ከሆነ፣ እንግዲያውስ መሲሑ[b] በከንቱ[c] ሞተ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ፍትሕ»።
    reason: lexical_alternative
  - marker: b
    text: ግሪክ፣ Χριστός፤ እዚህ እንደ ማዕረግ ስለሚያገለግል «መሲሑ» ተብሎ ተተርጉሟል። ወይም፣ «ክርስቶስ»።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ «ያለ ፋይዳ»።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετῶ
  choice: አልሽርም
  rationale: ቃሉ አንድን ነገር ዋጋ ቢስ ወይም የማይሠራ ማድረግን ያመለክታል፤ «አልሽርም» የጸጋውን ውጤት ከንቱ አላደርግም የሚለውን የጳውሎስ ክርክር በአጭሩ ይይዛል።
- source_word: χάριν
  choice: ጸጋ
  rationale: «ጸጋ» የእግዚአብሔርን ነፃ ቸርነት በተለመደና ክቡር ቋንቋ ያስተላልፋል።
- source_word: διὰ νόμου
  choice: በሕግ
  rationale: διά ከዘር ቅጽ ጋር የሚገልጠውን መንገድ ወይም መሣሪያ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δικαιοσύνη
  choice: ጽድቅ
  rationale: «ጽድቅ» በጳውሎስ አገባብ ያለውን ትክክለኛ አቋምና ቅንነት ሳያሰፋ ይይዛል፤ «ፍትሕ» የሚለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: Χριστὸς
  choice: መሲሑ
  rationale: Χριστός እዚህ እንደ ማዕረግ ስለሚሠራ፣ «መሲሑ» የ‘ተቀባው’ን ትርጉም ይጠብቃል።
- source_word: δωρεὰν
  choice: በከንቱ
  rationale: በዚህ አገባብ የሞቱን ፋይዳ ቢስነት ያመለክታል፤ «በከንቱ» ክርክሩን በተፈጥሯዊና ግልጽ አማርኛ ያቀርባል።
- source_word: ἄρα
  choice: እንግዲያውስ
  rationale: ከቀደመው ግምታዊ ንግግር የሚከተለውን ድምዳሜ በግልጽ ያሳያል።
theological_decisions:
- issue: በሕግና በጽድቅ መካከል ያለው ግንኙነት
  choice: ጽድቅ በሕግ የሚገኝ ከሆነ የመሲሑ ሞት ከንቱ ይሆናል የሚለው ሁኔታዊ ክርክር ተጠብቋል።
  alternative: δικαιοσύνηን «ፍትሕ» ብሎ መረዳት የቃል ኪዳን ሥርዓትን ወደ ትክክል ማምጣት የሚለውን ገጽታ ሊያጎላ ይችላል።
  rationale: ጥቅሱ ራሱ የሚያቀርበውን ተቃራኒ ግምት ብቻ በግልጽ ያስቀምጣል፤ ጽድቅ እንዴት እንደሚገኝ ከጥቅሱ በላይ በማብራራት የአንድ ወገን ዶክትሪን አልተጨመረም።
- issue: Χριστός እንደ ማዕረግ ወይም እንደ ስም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: በዚህ ክርክር Χριστός የተቀባውን የሚያመለክት ማዕረግ በመሆኑ «መሲሑ» የምንጩን ትርጉም ይጠብቃል፤ የተለመደው «ክርስቶስ» ግን በማስታወሻ ተጠቅሷል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። የግሪኩ ግስ የሌለበት ሁኔታዊ ሐረግ «የሚገኝ ከሆነ» ተብሎ በተፈጥሯዊ መንገድ ተሟልቷል፤ የክርክሩ ድምዳሜ «እንግዲያውስ» በሚለው ተጠብቋል።
