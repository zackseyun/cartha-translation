lexical_decisions:
- source_word: Ὅτε δὲ
  choice: ነገር ግን … በመጣ ጊዜ
  rationale: የጊዜውን ሽግግርና የδέን መጠነኛ ተቃርኖ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: Κηφᾶς
  choice: ኬፋ
  rationale: በግሪክ ምንጭ ያለውን የስም ቅርጽ በአማርኛ ፊደል ይጠብቃል፤ ከጴጥሮስ ጋር መለየቱ በማስታወሻ ተገልጿል።
- source_word: ἦλθεν εἰς Ἀντιόχειαν
  choice: ወደ አንጾኪያ በመጣ ጊዜ
  rationale: ወደ ከተማው የተደረገውን እንቅስቃሴ በተለመደ የአማርኛ አገላለጽ ያቀርባል።
- source_word: κατὰ πρόσωπον αὐτῷ
  choice: በፊቱ
  rationale: ቀጥተኛና ግልጽ ግጭትን የሚያመለክተውን ምስላዊ አነጋገር ይጠብቃል።
- source_word: ἀντέστην
  choice: ተቃወምኩት
  rationale: ጳውሎስ በግልጽ እንደተጋፈጠው በተፈጥሯዊና ግልጽ አማርኛ ያስተላልፋል።
- source_word: ὅτι
  choice: ስለ
  rationale: የተቃውሞውን ምክንያት በቀጥታ ያስገባል።
- source_word: κατεγνωσμένος ἦν
  choice: የተወቀሰ ነበር
  rationale: የግሪኩን ተደራጊ ቅርጽና የውጤት ሁኔታ ይጠብቃል፤ ማን እንደወቀሰው ወይም በምን መሠረት እንደተወቀሰ አይወስንም።
theological_decisions:
- issue: የΚηφᾶς ማንነትና አተረጓጎም
  choice: በዋናው ጽሑፍ «ኬፋ» የሚለውን ስም ማቆየት
  alternative: ለአንባቢ ቅርበት «ጴጥሮስ» ብሎ መተርጎም
  rationale: ምንጩ Κηφᾶς ይላል፤ ስለዚህ የምንጩን የስም ቅርጽ ማቆየት ይመረጣል፣ ከጴጥሮስ ጋር ያለው መለያ ግን በማስታወሻ ይገለጻል።
- issue: የκατεγνωσμένος ἦν ኃይል
  choice: «የተወቀሰ ነበር» ብሎ ተደራጊውንና የውጤት ሁኔታውን ማቆየት
  alternative: «በግልጽ ተሳስቶ ነበር» ወይም «በደለኛ ሆኖ ተገኝቶ ነበር»
  rationale: ዋናው ትርጉም ምንጩ ያለውን ተደራጊ አሻሚነት ሳይፈታ ይጠብቃል፤ የበደል ሐሳብን የሚያጎላው አማራጭ በማስታወሻ ተቀምጧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «በፊቱ» የሚለው ምስላዊ አነጋገር ቀጥተኛ መጋፈጥን ይገልጣል። ሁሉም የማስታወሻ ምልክቶች በዋናው ጽሑፍ ተካተዋል።
