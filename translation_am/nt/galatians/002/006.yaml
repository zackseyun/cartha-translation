  rationale: የጽሑፉ ዋና ነጥብ የመሪዎቹን ሕጋዊነት መካድ ሳይሆን፣ ማዕረጋቸው ለወንጌሉ እውነት መሠረት አለመሆኑ ነው።
- issue: προσανατίθημι እዚህ ‘መጨመር’ ወይስ ‘ተጨማሪ ግዴታ መጫን’ ማለት መሆኑ
