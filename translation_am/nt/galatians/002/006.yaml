  alternative: ‘ምንም ተጨማሪ ነገር አላስጫኑብኝም።’
  rationale: ግሱ ለጳውሎስ መልእክት ምንም አለመጨመራቸውን ወይም ተጨማሪ ግዴታ አለመጫናቸውን ሊያመለክት ይችላል፤ ዋናው ትርጉም አንዱን ብቻ አይገድብም።
