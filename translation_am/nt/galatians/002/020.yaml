language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ζῶ δὲ οὐκέτι ἐγώ, ζῇ δὲ ἐν ἐμοὶ Χριστός· ὃ δὲ νῦν ζῶ ἐν σαρκί, ἐν πίστει ζῶ τῇ τοῦ ⸂υἱοῦ τοῦ θεοῦ⸃ τοῦ ἀγαπήσαντός με καὶ παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/020.yaml
  text: And it is no longer I who live[a], but Messiah lives in me. And the life that I now live in the flesh, I live by faith in the Son of God, who loved me and gave himself for me.
translation:
  language: am
  text: ከእንግዲህ ወዲህ የምኖረው እኔ አይደለሁም፤ ነገር ግን መሲሑ በእኔ ይኖራል። አሁን በሥጋ የምኖረውን ሕይወት ደግሞ፣ በእግዚአብሔር ልጅ በማመን[a] እኖራለሁ፤ እርሱም ወደደኝና ስለ እኔ ራሱን ሰጠ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በእግዚአብሔር ልጅ ታማኝነት።»
    reason: የግሪኩ የባለቤትነት አገባብ እንደ «በእግዚአብሔር ልጅ የሚደረግ እምነት» ወይም እንደ «የእግዚአብሔር ልጅ ታማኝነት» ሊነበብ ይችላል።
lexical_decisions:
- source_word: Χριστός
  choice: መሲሑ
  rationale: የግሪኩን የማዕረግ ስም እንደ ማዕረግ ይተረጉማል፤ በአማርኛም የታወቀና ተፈጥሯዊ ነው።
- source_word: ὃ δὲ νῦν ζῶ
  choice: አሁን በሥጋ የምኖረውንም ሕይወት
  rationale: በግሪክ በአጭሩ የተገለጸውን አገባብ በአማርኛ ግልጽ ለማድረግ ‘ሕይወት’ የሚለውን በተፈጥሯዊ ሁኔታ ያስገባል።
- source_word: σάρξ
  choice: ሥጋ
  rationale: በዚህ አውድ የአሁኑን ምድራዊና አካላዊ ኑሮ ያመለክታል፤ ‘የኃጢአት ተፈጥሮ’ የሚል ትርጓሜ አይጨምርም።
- source_word: πίστει
  choice: እምነት
  rationale: የቃሉን ዋና ትርጉም ይጠብቃል፤ ከተከታዩ የባለቤትነት አገባብ ጋር ያለው አሻሚነት በማስታወሻ ተጠብቋል።
- source_word: τῇ τοῦ υἱοῦ τοῦ θεοῦ
  choice: በእግዚአብሔር ልጅ ላይ ባለኝ
  rationale: ዋናው ጽሑፍ የተቀባይ ትርጉሙን፣ ማለትም በእግዚአብሔር ልጅ ላይ የሚደረግ እምነትን፣ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ
  choice: ስለ እኔ ራሱን በሰጠው
  rationale: የፈቃደኝነትና የራስን መስጠት ሐሳብ በግልጽና ተፈጥሯዊ አማርኛ ይተላለፋል።
theological_decisions:
- issue: በτῇ τοῦ υἱοῦ τοῦ θεοῦ ውስጥ ያለው የπίστις ከባለቤትነት አገባብ ጋር የሚኖረው ትርጉም
  choice: በእግዚአብሔር ልጅ ላይ ባለኝ እምነት
  alternative: በእግዚአብሔር ልጅ ታማኝነት
  rationale: የግሪኩ አገባብ እምነት ወደ ልጁ የሚያመራ መሆኑን ወይም የልጁን ታማኝነት ማመልከቱን ሊፈቅድ ይችላል። ዋናው ጽሑፍ በአውዱ ቀጥተኛና ለአንባቢ ግልጽ የሆነውን ንባብ ይዟል፤ ሌላው ንባብ ግን በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አማርኛ አንባቢ ግልጽ የሆነ አገላለጽ ተጠቅሟል። ‘መሲሑ’ የማዕረጉን ትርጉም ይጠብቃል፤ ‘ሥጋ’ የጳውሎስን ቁልፍ ቃል ሳያብራራ ያቆያል።
