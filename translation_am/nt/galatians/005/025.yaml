  rationale: በገላትያ 5 ውስጥ በሥጋና በመንፈስ መካከል ያለው ንጽጽር እዚህ የተጠቀሰው መንፈስ ቅዱስ መሆኑን በጽኑ ያመለክታል። ዋናው ጽሑፍ ግን የግሪኩን አጭር ‘መንፈስ’ አጠራር ይጠብቃል።
- issue: የዳቲቩ ግንኙነት
