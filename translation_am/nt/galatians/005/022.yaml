source:
  edition: SBLGNT
  text: Ὁ δὲ καρπὸς τοῦ πνεύματός ἐστιν ἀγάπη, χαρά, εἰρήνη, μακροθυμία, χρηστότης, ἀγαθωσύνη, πίστις,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/022.yaml
  text: But the fruit of the Spirit is love[a], joy, peace, patience, kindness, goodness, faithfulness,
translation:
  language: am
  text: የመንፈስ ቅዱስ ፍሬ ግን ፍቅር፣ ደስታ፣ ሰላም፣ ትዕግሥት፣ ቸርነት፣ በጎነትና እምነት[a] ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ታማኝነት»። የግሪኩ πίστις እምነትን፣ መታመንን ወይም ታማኝነትን ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: ግን
  rationale: ከቁጥር 19–21 ከተዘረዘሩት የሥጋ ሥራዎች ጋር ያለውን ንጽጽር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: καρπὸς
  choice: ፍሬ
  rationale: የግሪኩን ዘይቤና ነጠላ ቁጥር ይጠብቃል፤ ባሕርያቱ የመንፈስ አንድ ወጥ ውጤት እንደሆኑ ያቀርባል።
- source_word: τοῦ πνεύματός
  choice: የመንፈስ ቅዱስ
  rationale: በአካባቢው ክፍል ከሥጋ ጋር የተቃረነው የእግዚአብሔር መንፈስ ነው፤ አማርኛ የአቢይ ፊደል ልዩነት ስለማይጠቀም፣ «ቅዱስ» የታሰበውን አመልካች በግልጽ ያስተላልፋል።
- source_word: ἀγάπη
  choice: ፍቅር
  rationale: የተለመደ፣ ግልጽና ሰፊ ትርጉም ያለው ዘመናዊ አቻ ነው።
- source_word: χαρά
  choice: ደስታ
  rationale: በዘመናዊ አማርኛ የውስጥ ሐሴትን በግልጽና በአጭር ይገልጣል።
- source_word: εἰρήνη
  choice: ሰላም
  rationale: ውስጣዊና እርስ በርስ ያለን ሰላም ሳያጠብ የቃሉን መደበኛ ትርጉም ይጠብቃል።
- source_word: μακροθυμία
  choice: ትዕግሥት
  rationale: ለረጅም ጊዜ መታገሥንና ቁጣን መቆጣጠርን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: χρηστότης
  choice: ቸርነት
  rationale: ለሌሎች የሚታይ ርኅራኄና ደግ አያያዝን ይገልጣል፤ ከቀጣዩ ἀγαθωσύνη ጋርም ተገቢውን የቃላት ልዩነት ይጠብቃል።
- source_word: ἀγαθωσύνη
  choice: በጎነት
  rationale: ሰፊውን የሥነ ምግባር መልካምነት ይገልጣል፤ ከ«ቸርነት» ለይቶ የግሪኩን ሁለት ቃላት ያንጸባርቃል።
- source_word: πίστις
  choice: እምነት
  rationale: የπίστις መደበኛ አቻ ሲሆን እምነትንና መታመንን ይይዛል፤ በዚህ የበጎ ባሕርያት ዝርዝር ውስጥ «ታማኝነት» የሚለው ትርጉምም ሊሆን ስለሚችል በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: የπνεῦμα አመልካች
  choice: መንፈስ ቅዱስ
  alternative: የሰው መንፈስ
  rationale: በገላትያ 5 ያለው ወዲያውኑ ከሥጋ ጋር የሚደረገው ንጽጽርና የጳውሎስ ሰፊ ክርክር ይህን በአማኞች ውስጥ የሚሠራውን መንፈስ ቅዱስ እንደሚያመለክት ይደግፋሉ።
- issue: በበጎ ባሕርያት ዝርዝር ውስጥ የπίστις አተረጓጎም
  choice: እምነት
  alternative: ታማኝነት
  rationale: πίστις እምነትን፣ መታመንን ወይም ታማኝነትን ሊያመለክት ይችላል። ዋናው ጽሑፍ መደበኛውን «እምነት» ይዞ፣ በዚህ ዐውደ ንባብ ተገቢ የሆነውን «ታማኝነት» በማስታወሻ ያቆያል።
