- source_word: ἐπιθυμίαις
  choice: ምኞቶቹ
  rationale: ቃሉ ብዙ ጊዜ ያልተገባ ጠንካራ ፍላጎትን ያመለክታል፤ “ምኞት” ትርጉሙን በሰፊው ይጠብቃል እንጂ በወሲባዊ ፍትወት ብቻ አይገድበውም።
theological_decisions:
