    text: እዚህ “ሥጋ” የሚለው ከመንፈስ ጋር የሚቃረነውን፣ በኃጢአት የወደቀውን የሰው ባሕርይ ያመለክታል፤ አንዳንድ ትርጉሞች “ኃጢአተኛ ባሕርይ” ብለው ይተረጉሙታል።
