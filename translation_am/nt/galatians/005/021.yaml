  rationale: ዝርዝሩ በተጠቀሱት ብቻ እንደማይወሰን የሚያሳየውን ክፍት አጠቃላይ አገላለጽ ይጠብቃል።
- source_word: ἃ προλέγω ὑμῖν … καθὼς προεῖπον
  choice: አስቀድሜ እንዳስጠነቀቅኋችሁ አሁንም አስጠነቅቃችኋለሁ
