theological_decisions:
- issue: የጳውሎስ ማስጠንቀቂያ አንድ ጊዜ የተፈጸመን ድርጊት ወይስ የተለመደ አኗኗርን ማመልከቱ
  choice: «የሚለማመዱ» ተብሎ ተተርጉሟል።
  alternative: «የሚያደርጉ» ወይም «የሚፈጽሙ»
  rationale: πράσσοντες የሚለው የአሁን ጊዜ ተካፋይ ቅርጽ በዚህ የክፉ ሥራዎች ዝርዝር አውድ ባሕርይ የሆነ ወይም ተደጋጋሚ ተግባርን በተፈጥሯዊ ሁኔታ ያመለክታል። ይህ የጽሑፉን ከባድ ማስጠንቀቂያ ይጠብቃል፤ ነገር ግን ስለ አንድ ጊዜ ውድቀት ጽሑፉ ያልተናገረውን የትምህርት ድምዳሜ አያስገባም።
