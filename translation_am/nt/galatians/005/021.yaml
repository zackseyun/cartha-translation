- source_word: κῶμοι
  choice: የጥጋብ ፈንጠዝያ
  rationale: ቃሉ ብዙውን ጊዜ ከመጠጥ ጋር የተያያዘ ገደብ የለሽ፣ ሁከት የበዛበት ፈንጠዝያን ያመለክታል፤ የግድ የወሲብ ትርጉም ስለሌለው ያንን የሚያስገባ ቃል አልተመረጠም።
