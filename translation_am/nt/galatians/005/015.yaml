id: GAL.5.15
reference: Galatians 5:15
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: εἰ δὲ ἀλλήλους δάκνετε καὶ κατεσθίετε, βλέπετε μὴ ὑπ’ ἀλλήλων ἀναλωθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/015.yaml
  text: But if you bite and devour one another[a], watch out that you are not consumed by one another.
translation:
  language: am
  text: ነገር ግን፣ እርስ በርሳችሁ የምትነካከሱና የምትበላላችሁ ከሆነ፣ እርስ በርሳችሁ እንዳትጠፉ ተጠንቀቁ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: ነገር ግን፣ ... ከሆነ
  rationale: εἰ የሁኔታ አንቀጽን፣ δέ ደግሞ ከቀደመው ሐሳብ ጋር ያለውን መጠነኛ ተቃርኖ ያሳያል፤ ይህ አቀራረብ በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: ἀλλήλους
  choice: እርስ በርሳችሁ
  rationale: በማኅበሩ ውስጥ ያለውን የተ互 ድርጊት በግልጽ ያሳያል።
- source_word: δάκνετε
  choice: የምትነካከሱ
  rationale: ግሱ ቃል በቃል ‘መንከስ’ ማለት ሲሆን፣ ‘መነካከስ’ ተደጋጋሚነቱንና የእርስ በርስ ንክሻውን በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: κατεσθίετε
  choice: የምትበላሉ
  rationale: የመብላትን ጠንካራና አውዳሚ ምስል ይጠብቃል፤ የተ互 ቅርጹም የግሪኩን ἀλλήλους ኃይል ያንጸባርቃል።
- source_word: βλέπετε
  choice: ተጠንቀቁ
  rationale: በዚህ አውድ ንቁ ጥንቃቄን የሚጠይቀውን ትእዛዝ በዘመናዊና ክብር ባለው አማርኛ ያስተላልፋል።
- source_word: μὴ ... ἀναλωθῆτε
  choice: እንዳትጠፉ
  rationale: አሉታዊ ማስጠንቀቂያውንና ወደ ሙሉ ጥፋት የሚደርሰውን ውጤት በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ὑπ’ ἀλλήλων
  choice: እርስ በርሳችሁ
  rationale: በግሪኩ ተገብሮ አቀራረብ ያለውን የተ互 አድራጊነት፣ ማለትም ማኅበሩ ራሱን በራሱ ማጥፋቱን፣ በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: በክርስቲያን ማኅበር ውስጥ ያለው የእንስሳዊ ጥቃት ምስል
  choice: ‘መነካከስ’ እና ‘መበላላት’ የሚሉትን ግልጽ ምስሎች ማቆየት፣ የመጨረሻውን ውጤት ግን ‘መጥፋት’ በማለት መግለጽ
  alternative: ምስሉን ሙሉ በሙሉ ለማቆየት ‘እንዳትበሉ’ ወይም ለማለዘብ ‘እርስ በርሳችሁ እንዳትጎዳዱ’ ማለት
  rationale: የጳውሎስ ንግግር ሆን ተብሎ የተሳለና አስቸኳይ ነው። የመነካከስና የመበላላት ቃላት ይህን ይጠብቃሉ፤ ‘እንዳትጠፉ’ ደግሞ ἀναλίσκω የሚያመለክተውን ሙሉ ውድመት ግልጽ ያደርጋል፣ ከκατεσθίωም ጋር ያለውን የቃል ልዩነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ። የተ互 ግሶች ‘የምትነካከሱ’ እና ‘የምትበላሉ’ ለመደበኛ አንባቢ ተፈጥሯዊ ሆነው የግሪኩን ሕያው ምስል ያቆያሉ።
