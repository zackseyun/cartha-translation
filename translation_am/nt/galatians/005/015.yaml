review_pass:
  verdict: revise
  source_fidelity: The conditional and reciprocal warning are retained, and the final warning appropriately conveys mutual ruin. However, የምትበላሉ can be heard as simple “eat” and does not clearly carry the reciprocal, intensified force of κατεσθίετε (“devour”).
  naturalness: The sentence is natural modern standard Amharic. Making the second verb explicitly reciprocal improves clarity without making the imagery unnatural.
  terminology: መነካከስ preserves δάκνετε well. Replacing the simple eating expression with መበላላት better maintains the vivid paired imagery of biting and devouring. እንዳትጠፉ is an acceptable natural rendering of ἀναλωθῆτε in this metaphorical warning.
  issues:
  - severity: medium
    issue: The rendering of κατεσθίετε as የምትበላሉ is insufficiently reciprocal and may understate the compound verb’s devouring imagery.
    rationale: ἀλλήλους governs both present verbs, and κατεσθίω is stronger than ordinary “eat.” የምትበላላችሁ explicitly expresses mutual devouring while retaining the literal metaphor.
  revised_text: ነገር ግን፣ እርስ በርሳችሁ የምትነካከሱና የምትበላላችሁ ከሆነ፣ እርስ በርሳችሁ እንዳትጠፉ ተጠንቀቁ።
