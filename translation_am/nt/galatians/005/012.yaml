  text: I wish those who are upsetting you would even mutilate themselves[a][b].
translation:
  language: am
  text: የሚያውኳችሁ ሰዎች እንኳ ራሳቸውን ቢቆርጡ እመኛለሁ![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ቃል በቃል፣ «ራሳቸውን ቢቆርጡ።» በዚህ የግርዛት አውድ ውስጥ፣ ቃሉ ከግርዛት አልፈው ራሳቸውን ማጉደል ወይም መስለብ የሚለውን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «የሚያስጨንቋችሁ።»
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄφελον
  choice: ቢቆርጡ እመኛለሁ
  rationale: የግሪኩ ቃል ጠንካራ ምኞትን ይገልጣል፤ «እመኛለሁ» በዘመናዊ አማርኛ ይህን በተፈጥሮ ያስተላልፋል።
- source_word: καὶ
  choice: እስከ
  rationale: እዚህ καί ንግግሩን የሚያጠናክርና ከግርዛት የበለጠ መቁረጥን የሚያመለክት ነው፤ «እስከ» የንግግሩን መጨመር በተፈጥሮ ያሳያል።
- source_word: ἀποκόψονται
  choice: ራሳቸውን እስከ መስለብ ቢቆርጡ
  rationale: በግርዛት አውድ ውስጥ ግሱ ከመቁረጥ ጋር የተያያዘ ሹፈታዊ ንግግር ሲሆን ራስን መስለብን ያመለክታል። «ቢቆርጡ» የቃሉን መሠረታዊ ምስል ይጠብቃል፤ «እስከ መስለብ» ደግሞ በዚህ አውድ የሚገመተውን ኃይለኛ ፍቺ ያብራራል።
- source_word: οἱ ἀναστατοῦντες
  choice: የሚያውኳችሁ እነዚያ ሰዎች
  rationale: ተሳቢው በገላትያ አማኞች መካከል ሁከትና ግራ መጋባት የሚፈጥሩትን ያመለክታል፤ «የሚያውኳችሁ» ይህን በዘመናዊና ግልጽ አማርኛ ይገልጣል።
- source_word: ὑμᾶς
  choice: -አችሁ
  rationale: የሁለተኛ መደብ ብዙ ቁጥር ተሳቢን በአማርኛው ግስ ላይ ያሳያል።
theological_decisions:
- issue: የጳውሎስ ምኞት ከግርዛት ጋር ያለው ግንኙነት
  choice: ጳውሎስ የግርዛት አስገዳጆች ከግርዛት አልፈው ራሳቸውን እስከ መስለብ እንዲቆርጡ በሹፈትና በጠንካራ አጋኖ እንደሚመኝ ተተርጉሟል።
  alternative: ከማኅበሩ ራሳቸውን ብቻ እንዲለዩ ወይም በአጠቃላይ እንዲጠፉ የሚመኝ ነው።
  rationale: የቅርብ አውዱ የግርዛት ክርክር ስለሆነ ἀποκόψονται በመቁረጥ ላይ ያለውን ኃይለኛ የቃል ጨዋታ የሚያመለክት መሆኑ ከአውዱ ጋር ይበልጥ ይስማማል። የ«መቆረጥ» አሻሚነት ግን በማስታወሻ ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለው አማርኛ ይጠቀማል። የጳውሎስን ጠንካራ ሹፈት ሳያለዝብ ያቀርባል፤ የἀποκόψονταιን ቃል በቃል አማራጭና የአውዱን ፍቺ በማስታወሻ ያስቀምጣል።
