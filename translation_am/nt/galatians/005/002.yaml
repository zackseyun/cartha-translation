  rationale: የአውዱን የኪዳንና የጽድቅ ክርክር በትርጉሙ ውስጥ በማብራሪያ አልጨመርንም፤ እንዲሁም የጳውሎስን ቃል ከአውዱ በላይ አላሰፋንም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ይጠቀማል። «እነሆ» መጽሐፍ ቅዱሳዊ ክብርን ሳያጣ የማስጠንቀቂያውን አጽንዖት ይይዛል፤ የአረፍተ ነገሩ አወቃቀርም በተፈጥሯዊ የአማርኛ ቅደም ተከተል ቀርቧል።
