  text: 'Look: I[a], Paul, say to you that if you receive circumcision[b], Messiah will benefit you nothing.'
translation:
  language: am
  text: እነሆ፣ እኔ ጳውሎስ እላችኋለሁ፤ ብትገረዙ[a]፣ መሲሑ[b] ምንም አይጠቅማችሁም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ራሳችሁን ብታስገርዙ» ወይም «እንድትገረዙ ብትፈቅዱ»።
    reason: lexical_alternative
  - marker: b
    text: ግሪክኛው «ክርስቶስ» ይላል፤ እዚህ Χριστός እንደ ማዕረግ ስለሚያገለግል «መሲሑ» ተብሎ ተተርጉሟል።
    reason: alternative_reading
lexical_decisions:
- source_word: Ἴδε
  choice: እነሆ
  rationale: ንግግሩን በአጽንዖት የሚያስተዋውቅ የትኩረት ቃል ነው፤ «እነሆ» የጳውሎስን ከባድ ማስጠንቀቂያ በአጭሩ ያቆያል።
- source_word: ἐγὼ Παῦλος
  choice: እኔ ጳውሎስ
  rationale: ግልጽ ተውላጠ ስሙንና የግል ስሙን አብሮ በማቆየት የራስ መግለጫውንና አጽንዖቱን ይጠብቃል።
- source_word: λέγω ὑμῖν
  choice: እላችኋለሁ
  rationale: ቀጥተኛውን «እላችኋለሁ» የሚለውን ንግግር በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐὰν περιτέμνησθε
  choice: ብትገረዙ
  rationale: የግሪኩን ተገብሮ ወይም መካከለኛ ኃይል በአጭርና ተፈጥሯዊ ሁኔታዊ አገላለጽ ያቆያል፤ ራሳቸውን ለግርዛት የማቅረብ ጥላ ሐሳብም በማስታወሻ ተጠብቋል።
