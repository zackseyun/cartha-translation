base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/013.yaml
  text: For you were called to freedom[a], brothers; only do not use your freedom as an opportunity for the flesh[d][c][b], but through love serve one another.
translation:
  language: am
  text: እናንተስ፣ ወንድሞች ሆይ[a]፣ ለነጻነት ተጠርታችኋልና። ነገር ግን ነጻነታችሁን ለሥጋ[c] አጋጣሚ[b] አታድርጉት፤ ይልቁንም በፍቅር እርስ በርሳችሁ አገልግሉ[d]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ወንድሞች” የሚለው ቃል በግሪክ ወንዳዊ ብዙ ቁጥር ነው፤ በዚህ መልእክት ግን ሴቶችንም ጨምሮ መላውን የእምነት ማኅበር ይጠራል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ለሥጋ መነሻ።” ይህም ራስን ወደ ማርካት የሚያመራው ኃጢአተኛ ምኞት የሚነሣበት መሠረት ወይም ዕድል ማድረግ ማለት ነው።
    reason: lexical_alternative
  - marker: c
    text: እዚህ “ሥጋ” ማለት አካላዊው ሰውነት ብቻ ሳይሆን በኃጢአት የወደቁ የሰው ምኞቶችንም ያመለክታል፤ አንዳንድ ትርጉሞች “ኃጢአተኛ ባሕርይ” ብለው ይተረጉሙታል።
    reason: alternative_reading
  - marker: d
    text: “አገልግሉ” ተብሎ የተተረጎመው ግስ “ባሪያ” ከሚለው ቃል ጋር የተዛመደ ሲሆን፣ ራስን ለሌሎች አገልግሎት አሳልፎ የመስጠትን ሐሳብ ይይዛል።
    reason: lexical_alternative
