  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἡ γὰρ σὰρξ ἐπιθυμεῖ κατὰ τοῦ πνεύματος, τὸ δὲ πνεῦμα κατὰ τῆς σαρκός, ταῦτα ⸀γὰρ ⸂ἀλλήλοις ἀντίκειται⸃, ἵνα μὴ ἃ ⸀ἐὰν θέλητε ταῦτα ποιῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/017.yaml
  text: For the flesh desires what is against the Spirit[a], and the Spirit what is against the flesh; for these oppose each other[b], so that you do not do the things you want.
translation:
  language: am
  text: ምክንያቱም ሥጋ መንፈስን የሚቃወም ነገር ይመኛል፤ መንፈስም[a] ሥጋን የሚቃወም ነገር ይመኛል። እነዚህ እርስ በርሳቸው ይቃወማሉና፣ የምትፈልጉትን እንዳታደርጉ።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: እዚህ ‘መንፈስ’ የሚለው በአውዱ መሠረት መንፈስ ቅዱስን ያመለክታል፤ ሆኖም የሰውን መንፈስ እንደሚያመለክት ተደርጎም ሊነበብ ይችላል።
    reason: alternative_reading
  - marker: b
    text: ‘እንዳታደርጉ’ የሚለው የሁለቱን ተቃውሞ ዓላማ ወይም ውጤት ሊገልጥ ይችላል።
    reason: preserved_ambiguity
lexical_decisions:
- source_word: σὰρξ
  choice: ሥጋ
  rationale: የጳውሎስን ዘይቤያዊና ሥነ ምግባራዊ አጠቃቀም ሳይፈታ ይጠብቃል፤ ‘ኃጢአተኛ ባሕርይ’ ብሎ መተርጎም ትርጓሜያዊ ማብራሪያን ወደ ዋናው ጽሑፍ ያስገባል።
- source_word: ἐπιθυμεῖ
  choice: የሚቃወም ምኞት አለው
  rationale: ἐπιθυμεῖ የሚለውን የመመኘት ሐሳብና κατά ከዘር ስም ጋር ያለውን የተቃውሞ አቅጣጫ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: πνεῦμα
  choice: መንፈስ
  rationale: በገላትያ 5 ያለው አውድ በዋናነት የእግዚአብሔርን መንፈስ ያመለክታል፤ በአማርኛ የፊደል አቢይነት ልዩነት ስለሌለ አሻሚነቱ በማስታወሻ ተጠብቋል።
- source_word: ἀλλήλοις ἀντίκειται
  choice: እርስ በርሳቸው ይቃወማሉ
  rationale: የሁለቱን የጋራ ተቃውሞ በአጭርና ተፈጥሯዊ አገላለጽ ያቀርባል።
- source_word: ἵνα μὴ ἃ ἐὰν θέλητε ταῦτα ποιῆτε
  choice: እናንተ የምትፈልጉትን እንዳታደርጉ ያደርጋሉ
  rationale: ἵνα μή የሚኖረውን የውጤት/ዓላማ ኃይል በተነባቢ አማርኛ ይገልጣል፤ የአንባቢውን ፈቃድ መልካም ወይም ክፉ ብሎ አይወስንም።
theological_decisions:
- issue: በጳውሎስ ሥነ ምግባራዊ አውድ ውስጥ የσάρξ ትርጉም
  choice: በዋናው ጽሑፍ ‘ሥጋ’ ተብሎ የጳውሎስ ዘይቤ ተጠብቋል።
  alternative: ኃጢአተኛ ባሕርይ
  rationale: አውዱ ከሥጋዊ አካል በላይ የሆነ ሥነ ምግባራዊ አጠቃቀምን ቢያመለክትም፣ ትርጓሜያዊ መፍትሔን በዋናው ጽሑፍ ከመጫን ይልቅ ዋናውን ምስል መጠበቅ ተመርጧል።
- issue: የπνεῦμα ተጠቃሽ
  choice: በአውዱ መሠረት መንፈስ ቅዱስ እንደሚያመለክት ተወስዷል።
  alternative: የሰው መንፈስ
  rationale: በገላትያ 5 ዙሪያ ያሉት ቁጥሮች በሥጋና በመንፈስ መካከል ያለውን ንፅፅር ከመንፈስ ቅዱስ ሥራ ጋር ያያይዙታል፤ ሆኖም የሰው መንፈስ ሊሆን የሚችለው ንባብ በማስታወሻ ተጠብቋል።
- issue: የἵνα μή አገባብ
  choice: የሁለቱ ተቃውሞ ተግባራዊ ውጤት እንደሆነ ተተርጉሟል።
  alternative: እናንተ የምትፈልጉትን እንዳታደርጉ በዓላማ ይቃወማሉ
  rationale: ግሪኩ ዓላማን ወይም ውጤትን ሊያመለክት ይችላል፤ ትርጉሙ ይህን አስገዳጅነት ሳያጠናክር ተግባራዊ ውጤቱን ያቀርባል።
