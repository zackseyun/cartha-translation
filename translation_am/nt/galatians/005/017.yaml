review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the reciprocal conflict between flesh and Spirit and retains the ambiguity of πνεῦμα in a footnote. However, it omits the initial γάρ (‘for’), and its final wording, ‘... እንዳታደርጉ ያደርጋሉ,’ adds an explicit causative predicate not present in Greek. The revised wording represents the ἵνα μή clause as the consequence/purpose of the opposition without adding that predicate.
  naturalness: The revised text uses clear, modern standard Amharic. ‘የሚቃወም ነገር ይመኛል’ naturally supplies the object implied by ἐπιθυμεῖ κατὰ while retaining the adversative force of κατά.
  terminology: ‘ሥጋ’ appropriately preserves σάρξ as Paul’s metaphor rather than interpretively replacing it with ‘sinful nature.’ ‘መንፈስ’ is retained; Amharic capitalization does not distinguish Holy Spirit from human spirit, so the contextual alternative is appropriately footnoted. The footnote about ἵνα μή should explain the construction rather than imply a stronger causal verb in the text.
  issues:
  - severity: medium
    issue: The initial γὰρ is not represented.
    rationale: The verse begins ‘For,’ linking it to the preceding statement. The draft’s later ‘-ና’ reflects the second γὰρ but does not represent the first.
  - severity: medium
    issue: ‘... እንዳታደርጉ ያደርጋሉ’ overstates the final clause.
    rationale: Greek has an ἵνα μή clause, not an explicit plural causative verb (‘they make/cause’). This wording introduces a more determinate causal assertion than the source supplies.
  - severity: low
    issue: The phrase ‘ምኞት አለው’ is less direct than the verbal sense of ἐπιθυμεῖ.
    rationale: Using ‘ይመኛል’ more directly reflects the Greek verb and reads more smoothly in modern Amharic.
  revised_text: ምክንያቱም ሥጋ መንፈስን የሚቃወም ነገር ይመኛል፤ መንፈስም[a] ሥጋን የሚቃወም ነገር ይመኛል። እነዚህ እርስ በርሳቸው ይቃወማሉና፣ የምትፈልጉትን እንዳታደርጉ።[b]
