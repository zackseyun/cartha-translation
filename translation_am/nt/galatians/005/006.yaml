  rationale: በዚህ አውድ ዋናው አነባበብ “እምነት” ነው፤ ሆኖም ቃሉ የታማኝነትንና የመታመንን ጥላ ትርጉሞች ሊይዝ ስለሚችል እነዚህ በማስታወሻ ተጠቅሰዋል።
- issue: ἐνεργουμένη መካከለኛ/ተደራጊ ቅርጽ
  choice: የሚሠራ
  alternative: ንቁ የሚሆን፣ ራሱን የሚገልጥ፣ ውጤታማ የሚሆን
  rationale: የግሪኩ ቅርጽ እምነት በፍቅር መሥራቱን ወይም ንቁና ውጤታማ መሆኑን ሊገልጥ ይችላል። ዋናው ጽሑፍ አንዱን ሰዋሰዋዊ አነባበብ ከልክ በላይ እንዳይወስን “የሚሠራ” ይላል፤ ሌሎቹ አማራጮች በማስታወሻ ተጠብቀዋል።
