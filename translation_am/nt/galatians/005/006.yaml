lexical_decisions:
- source_word: ἐν γὰρ Χριστῷ Ἰησοῦ
  choice: ምክንያቱም በመሲሑ ኢየሱስ ውስጥ
  rationale: γάρ ቀዳሚውን ሐሳብ የሚያብራራ ምክንያት ስለሚያስገባ “ምክንያቱም” ተብሏል። ἐν የጳውሎስን ከመሲሑ ጋር ያለ ኅብረት እንዳይጠፋ “በ…ውስጥ” ተብሎ ተጠብቋል፤ Χριστός ደግሞ እዚህ እንደ ማዕረግ “መሲሕ” ተብሏል።
- source_word: οὔτε περιτομή τι ἰσχύει οὔτε ἀκροβυστία
  choice: መገረዝም ሆነ አለመገረዝ ምንም አይጠቅምም
  rationale: ሁለቱ ተቃራኒ የማንነት ሁኔታዎች በትይዩ ተጠብቀዋል። τι ἰσχύει በዚህ አውድ የሚያመለክተው ጉልበትን ብቻ ሳይሆን ጥቅምን ወይም ውጤታማነትን ስለሆነ “ምንም አይጠቅምም” ተብሏል።
- source_word: ἀλλὰ πίστις
  choice: የሚጠቅመው ግን … እምነት ነው
  rationale: ἀλλά ጠንካራውን ንፅፅር በ“ግን” ያሳያል። በአማርኛ የዓረፍተ ነገሩን ንፅፅር ግልጽና ተፈጥሯዊ ለማድረግ “የሚጠቅመው … ነው” የሚለው ከቀዳሚው ግስ ተሟልቷል። πίστις በዋናው ጽሑፍ “እምነት” ተብሏል።
- source_word: δι’ ἀγάπης ἐνεργουμένη
  choice: በፍቅር የሚሠራ
  rationale: διά ከጄኒቲቭ ጋር መንገድን ወይም መሣሪያነትን ስለሚገልጥ “በፍቅር” ተብሏል። ἐνεργουμένη እምነት በፍቅር ንቁና ውጤታማ መሆኑን ይገልጣል፤ “የሚሠራ” የግሱን ኃይል ሳያጠፋ የመካከለኛና የተደራጊ አነባበብ ውጥረትን በአጭሩ ይጠብቃል።
theological_decisions:
- issue: Χριστός እንዴት እንደሚተረጎም
  choice: መሲሑ
  alternative: ክርስቶስ
