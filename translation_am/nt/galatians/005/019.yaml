    issue: The translation concludes the vice list with “ናቸው።”
    rationale: The Greek text ends with a comma after ἀσέλγεια, and the English audit trail likewise retains a trailing comma. The Amharic should remain syntactically open for the continuing list in Galatians 5:19–21.
  - severity: low
    issue: The explicit resumptive construction “እነርሱም … ናቸው” is unnecessarily heavy.
