  terminology: “የሥጋ,” “የጾታ ብልግና,” “ርኩሰት,” and “የማያፍር ልቅነት” appropriately preserve the source sense and register. The footnote preserves “ሥጋ” in the text while providing an interpretive alternative without making it the primary translation.
