  text: φανερὰ δέ ἐστιν τὰ ἔργα τῆς σαρκός, ἅτινά ⸀ἐστιν πορνεία, ἀκαθαρσία, ἀσέλγεια,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/019.yaml
  text: 'The works of the flesh are evident: sexual immorality[a], impurity, sensuality,'
translation:
  language: am
  text: የሥጋ[a] ሥራዎች ግልጽ ናቸው፤ እነዚህም፦ የጾታ ብልግና፣ ርኩሰት፣ የማያፍር ልቅነት፣
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ኃጢአተኛ ባሕርይ»። የግሪኩ ቃል «ሥጋ» (σάρξ) ነው፤ ጳውሎስ እዚህ ቃሉን የወደቀውን የሰው ምኞትና ዝንባሌ ለማመልከት በዘይቤ ይጠቀምበታል።
    reason: alternative_reading
lexical_decisions:
- source_word: φανερὰ
  choice: ግልጽ
  rationale: ቃሉ በግልጽ የሚታይን ወይም በቀላሉ የሚታወቅን ነገር ያመለክታል፤ «ግልጽ» በዘመናዊ አማርኛ ተፈጥሯዊና ቀጥተኛ ነው።
- source_word: δέ
  choice: በአማርኛው በተለየ ቃል አልተተረጎመም
  rationale: δέ ከቀደመው ሐሳብ ወደ ዝርዝሩ የሚያሸጋግር ለስላሳ የንግግር ምልክት ነው፤ በዚህ አጭር አማርኛ ዓረፍተ ነገር ሽግግሩ ያለ ተጨማሪ ቃል በተፈጥሮ ይገባል።
- source_word: τὰ ἔργα
  choice: ሥራዎች
  rationale: «ሥራዎች» የἔργαን መሠረታዊ ትርጉም ይጠብቃል፤ ከሚቀጥለው «የመንፈስ ፍሬ» ጋር ያለውን የጳውሎስ ንጽጽርም ሳያደበዝዝ ያቀርባል።
- source_word: τῆς σαρκός
  choice: የሥጋ
  rationale: σάρξ በዚህ ሥነ ምግባራዊ አውድ ዘይቤያዊ ኃይል ቢኖረውም፣ «ሥጋ» የጳውሎስን ቃልና ከመንፈስ ጋር ያለውን ክርክር ይጠብቃል፤ ትርጓሜያዊው አማራጭ በማስታወሻ ተገልጧል።
- source_word: ἅτινά ἐστιν
  choice: እነርሱም … ናቸው
  rationale: ይህ አገላለጽ ተከታዩን ዝርዝር ያስተዋውቃል፤ «እነርሱም … ናቸው» ይህን ተግባር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: πορνεία
  choice: የጾታ ብልግና
  rationale: πορνεία በሰፊው ሕገ ወጥ ወይም ሥነ ምግባር የጎደለውን የጾታ ተግባር ያመለክታል፤ «የጾታ ብልግና» ስፋቱን ሳያጠብ ለዘመናዊ አንባቢ ግልጽ ነው።
- source_word: ἀκαθαρσία
  choice: ርኩሰት
  rationale: ቃሉ በዚህ አውድ የሥነ ምግባር ንጽሕና ጉድለትን ያመለክታል፤ «ርኩሰት» ይህን ሐሳብ በአጭሩ ይይዛል።
- source_word: ἀσέλγεια
  choice: የማያፍር ልቅነት
  rationale: ἀσέλγεια እፍረት የለሽና ገደብ ያጣ ባሕርይን፣ በተለይም በጾታዊ ምግባር የሚታይን ልቅነት ያመለክታል፤ ይህ አገላለጽ ሁለቱንም ገጽታዎች ያስጠብቃል።
theological_decisions:
- issue: በጳውሎስ ሥነ ምግባራዊ አውድ የσάρξ አተረጓጎም
  choice: ሥጋ
  alternative: ኃጢአተኛ ባሕርይ
  rationale: «ሥጋ» የምንጩን ዘይቤና በሥጋና በመንፈስ መካከል ያለውን ሥነ መለኮታዊ ውጥረት ይጠብቃል፤ «ኃጢአተኛ ባሕርይ» ግን አንድ የትርጓሜ አቅጣጫ ስለሆነ በዋናው ጽሑፍ አልተተካም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። የማስታወሻው ምልክት ከሚያብራራው «ሥጋ» ቃል ቀጥሎ ተቀምጧል።
