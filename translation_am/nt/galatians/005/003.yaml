  terminology: «እመሰክራለሁ», «ሕጉን ሁሉ», and «ግዴታ አለበት» are appropriate renderings. «ለመፈጸም» is idiomatic with «ግዴታ አለበት» and clearly expresses ποιῆσαι in this legal context.
