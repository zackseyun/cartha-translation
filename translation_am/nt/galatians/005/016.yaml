  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Λέγω δέ, πνεύματι περιπατεῖτε καὶ ἐπιθυμίαν σαρκὸς οὐ μὴ τελέσητε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/016.yaml
  text: But I say[a], walk by the Spirit, and you will certainly not carry out the desire of the flesh.
translation:
  language: am
  text: እላለሁ ግን፤ በመንፈስ ቅዱስ ኑሩ፤ የሥጋንም ምኞት ፈጽሞ አትፈጽሙም።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ሥጋ» የሚለው «ኃጢአተኛ ባሕርይ» ተብሎም ሊብራራ ይችላል። የግሪኩ ቃል በቀጥታ «ሥጋ» ማለት ሲሆን፣ ጳውሎስ አንዳንድ ጊዜ ከመንፈስ የሚቃረነውን በኃጢአት የወደቀ የሰው ዝንባሌ ለማመልከት ይጠቀምበታል።
    reason: alternative_reading
lexical_decisions:
- source_word: Λέγω δέ
  choice: እኔ ግን እላለሁ
  rationale: δέ ከቀደመው ሐሳብ ወደ ጳውሎስ ቀጣይ ምክር የሚያደርገውን መጠነኛ ተቃርኖ ወይም ሽግግር ያሳያል፤ «ግን» ይህን ሳያጋንን ያቆያል።
- source_word: πνεύματι
  choice: በመንፈስ
  rationale: የዳቲቭ ቅርጹ መሣሪያን ወይም የኑሮ መስክን ሊያመለክት ይችላል፤ «በመንፈስ» ሁለቱንም ገጽታዎች በተፈጥሯዊ አማርኛ ክፍት ያደርጋል። የዐውደ ንባቡ ማጣቀሻ መንፈስ ቅዱስ ነው።
- source_word: περιπατεῖτε
  choice: ተመላለሱ
  rationale: የጳውሎስን የመራመድ ምሳሌያዊ ምስል ይጠብቃል፤ በአማርኛም የቀጣይ ኑሮና ምግባር ትርጉም ሊያስተላልፍ ይችላል።
- source_word: ἐπιθυμίαν
  choice: ምኞት
  rationale: ቃሉ እንደ ዐውደ ንባቡ መልካም ወይም ክፉ ፍላጎትን ሊያመለክት ይችላል። እዚህ «የሥጋ» የሚለው ገላጭ አሉታዊ መሆኑን ያሳያል፤ «ምኞት» ግን ከ«ዝሙት ፍላጎት» ይልቅ ሰፊውን ትርጉም ይጠብቃል።
- source_word: σαρκὸς
  choice: የሥጋ
  rationale: ጳውሎስ ከመንፈስ ጋር የሚያነጻጽረውን የራሱን ቃልና ሥነ መለኮታዊ ውጥረት ይጠብቃል፤ ትርጉሙን «ኃጢአተኛ ባሕርይ» ብሎ በዋናው ጽሑፍ አይወስነውም።
- source_word: οὐ μὴ τελέσητε
  choice: ፈጽሞ አትፈጽሙም
  rationale: οὐ μή ያለውን ጠንካራ እምቢታ «ፈጽሞ ... አት...ም» ያስተላልፋል፤ τελέω ደግሞ ምኞቱን ወደ ተግባር ማድረስን ያመለክታል።
theological_decisions:
- issue: የπνεύματι ማጣቀሻ
  choice: መንፈስ ቅዱስ
  alternative: የሰው መንፈስ ወይም አጠቃላይ መንፈሳዊ መርሕ
  rationale: በገላትያ 5 ዐውደ ንባብ መንፈስና ሥጋ የሚነጻጸሩበት መንገድ ማጣቀሻው መንፈስ ቅዱስ መሆኑን ይደግፋል።
- issue: የσάρξ አተረጓጎም
  choice: ሥጋ
  alternative: ኃጢአተኛ ባሕርይ
  rationale: እዚህ ቃሉ ከመንፈስ የሚቃረን ሥነ ምግባራዊ ትርጉም ቢኖረውም፣ «ሥጋ» የጳውሎስን የቃል ምርጫና የትርጉም ስፋት ይጠብቃል፤ አማራጩ በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ተመላለሱ» የምንጩን ምሳሌያዊ አነጋገር ሲጠብቅ፣ «ፈጽሞ አትፈጽሙም» ጠንካራውን አሉታዊ አገላለጽ ያስተላልፋል።
