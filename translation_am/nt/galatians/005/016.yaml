  to: እላለሁ ግን፤ በመንፈስ ቅዱስ ኑሩ፤ የሥጋንም ምኞት ፈጽሞ አትፈጽሙም።[a]
  rationale: The revision removes an unwarranted emphatic pronoun and replaces a potentially misleading movement verb with idiomatic modern Amharic that conveys continual life in dependence on the Holy Spirit. It retains the source’s strong negation, the concrete Pauline term «ሥጋ», and the existing alternative-reading footnote.
