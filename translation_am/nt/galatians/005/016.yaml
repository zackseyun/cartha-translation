review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the adversative transition, the Spirit–flesh contrast, and the emphatic negation. However, «እኔ» adds an unnecessary emphatic subject not expressed in Λέγω, and «ተመላለሱ» commonly suggests going back and forth or repeated movement rather than Paul’s idiomatic call for an ongoing manner of life.
  naturalness: «በመንፈስ ቅዱስ ኑሩ» is clear, modern, and idiomatic Amharic for the intended ethical metaphor. «የሥጋን ምኞት ፈጽሞ አትፈጽሙም» is understandable and appropriately forceful.
  terminology: Retaining «ሥጋ» in the text preserves Paul’s terminology without imposing the interpretive gloss «ኃጢአተኛ ባሕርይ». Identifying the contextual referent as «መንፈስ ቅዱስ» is warranted by the immediate context and improves clarity.
  issues:
  - severity: low
    issue: «እኔ» is added in the opening clause.
    rationale: Λέγω δέ means “But/Now I say”; the explicit first-person pronoun is not present and gives the speaker unnecessary emphasis.
  - severity: medium
    issue: «ተመላለሱ» is not the most natural modern rendering of περιπατεῖτε in this context.
    rationale: In ordinary modern Amharic it can evoke going to and fro. «ኑሩ» naturally conveys the continuing pattern of life intended by Paul’s walking metaphor.
  revised_text: እላለሁ ግን፤ በመንፈስ ቅዱስ ኑሩ፤ የሥጋንም ምኞት ፈጽሞ አትፈጽሙም።[a]
  revised_footnotes:
