base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/001.yaml
  text: For freedom Messiah set us free[a]; therefore stand firm[b], and do not again be held by a yoke of slavery.
translation:
  language: am
  text: ነፃነት እንዲኖረን መሲሑ ነፃ አወጣን[a]፤ ስለዚህ ጸንታችሁ ቁሙ[b]፤ ዳግመኛም በባርነት ቀንበር እንዳትጠመዱ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በነፃነት መሲሑ ነፃ አወጣን።” በግሪኩ ያለው የመነሻ ሐረግ የተጨመቀ ስለሆነ፣ እርስ በርሳቸው በሚቀራረቡ ከአንድ በላይ መንገዶች ሊገባ ይችላል።
    reason: alternative_reading
  - marker: b
    text: “ጸንታችሁ ቁሙ” የሚለው ትእዛዝ በጽናት መቀጠልን ያመለክታል። የመጨረሻው የግሪክ ግስም በአንድ ነገር ሥር መገዛትን ወይም መጠመድን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ ἐλευθερίᾳ
  choice: ነፃነት እንዲኖረን
  rationale: የመነሻውን የተጨመቀ የዓላማ ወይም የውጤት አገላለጽ በተፈጥሯዊ አማርኛ ያቀርባል፤ በእግር ማስታወሻውም የቦታ/ሁኔታ አማራጭ ተጠብቋል።
- source_word: Χριστὸς
  choice: መሲሑ
  rationale: Χριστός በዚህ ስፍራ የቅባት ማዕረግን የሚያመለክት በመሆኑ፣ ትርጉሙንና የአይሁድን መሲሐዊ ዳራ የሚጠብቀው ማዕረግ ተመርጧል።
- source_word: ἠλευθέρωσεν
  choice: ነፃ አወጣን
  rationale: ἐλευθερόω ከእስራት ወይም ከግዛት ነፃ ማውጣትን ያመለክታል፤ ከ‘ነፃነት’ ጋር ያለውን የቃል ግንኙነትም ይጠብቃል።
- source_word: στήκετε
  choice: ጸንታችሁ ቁሙ
  rationale: የአሁን ጊዜ ትእዛዙ ቀጣይ ጽናትን ይጠይቃል፤ ይህ አገላለጽ ግልጽና ክብር ያለው ዘመናዊ አማርኛ ነው።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው መግለጫ የሚወጣውን ድምዳሜ በግልጽ ያሳያል።
- source_word: ζυγῷ δουλείας
  choice: በባርነት ቀንበር ሥር
  rationale: ቀንበር የመገዛት ምሳሌ ሲሆን ‘ባርነት’ የδουλείαን ጠንካራ ትርጉም ይጠብቃል፤ ‘ሥር’ የሚለውም በቀንበር የመያዝን ምስል በአማርኛ ተፈጥሯዊ ያደርገዋል።
- source_word: ἐνέχεσθε
  choice: አትያዙ
  rationale: በአንድ ነገር ሥር መያዝን፣ መገዛትን ወይም መጠመድን የሚያስተላልፈውን መካከለኛ/ተደራጊ ኃይል ይጠብቃል።
- source_word: πάλιν
  choice: ዳግመኛ
  rationale: ወደ ቀድሞ ሁኔታ መመለስን በቀጥታና በክብር ያመለክታል።
theological_decisions:
- issue: Χριστόςን እንደ ማዕረግ ወይስ እንደ ስም መተርጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: ግሪኩ በዚህ አውድ የተቀባውን ንጉሥ/አዳኝ ማዕረግ ያጎላል፤ ‘መሲሑ’ የማዕረጉን ትርጉም ያስተላልፋል እንጂ ወደ አንድ ወገን የእምነት ልዩነት አይወስድም።
- issue: δουλείαን ምን ያህል ጠንክሮ መተርጎም
  choice: ባርነት
  alternative: እስራት / ተገዥነት
  rationale: አውዱ ነፃነትን ከተቃራኒው ጋር በኃይል ያነጻጽራል፤ ‘ባርነት’ የግሪኩን ሙሉ ክብደት ይጠብቃል።
