  text: But if you are led by the Spirit[b][a], you are not under the law.
translation:
  language: am
  text: ነገር ግን በመንፈስ የምትመሩ ከሆነ[a]፣ ከሕግ በታች[b] አይደላችሁም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በመንፈስ እየተመራችሁ ከሆነ።”
    reason: lexical_alternative
  - marker: b
    text: “ከሕግ በታች” ማለት በሕጉ ሥልጣን ወይም ግዛት ሥር መሆንን ያመለክታል፤ ከገላትያ 5፥23 ጋር ያነጻጽሩ።
    reason: cross_reference
lexical_decisions:
- source_word: εἰ
  choice: ከሆነ
  rationale: የሁኔታ አንቀጽን የሚያስገባውን የግሪክ ቃል በተፈጥሯዊ የአማርኛ አገላለጽ ያቀርባል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: በሥጋና በመንፈስ መካከል ካለው የአውዱ ንጽጽር ጋር የሚስማማውን መጠነኛ ተቃርኖ ያሳያል።
- source_word: πνεύματι
  choice: በመንፈስ
  rationale: የመሪውን ወይም የአድራጊውን ሚና የሚጠቁመውን ዳቲቭ ያንጸባርቃል፤ በገላትያ 5፥16–25 አውድ ውስጥ መንፈስ የሚለው መንፈስ ቅዱስን ያመለክታል።
- source_word: ἄγεσθε
  choice: የምትመሩ
  rationale: የአሁን ጊዜ ተደራጊ ቅርጹንና የብዙ ሰው አመልካቹን በተፈጥሯዊ አማርኛ ይጠብቃል፤ ቀጣይነቱን ይበልጥ የሚያጎላ አማራጭ በእግር ማስታወሻ ቀርቧል።
- source_word: οὐκ ἐστὲ
  choice: አይደላችሁም
  rationale: አሉታዊውን የመሆን ግስና የሁለተኛ መደብ ብዙ ቁጥርን በቀጥታ ያስተላልፋል።
- source_word: ὑπὸ νόμον
  choice: ከሕግ በታች
  rationale: የግሪኩን ምሳሌያዊ አገላለጽ ይጠብቃል፤ በአውዱም በሙሴ ሕግ ሥልጣን ወይም ግዛት ሥር መሆንን ያመለክታል።
theological_decisions:
- issue: የπνεύματι አመልካች
  choice: መንፈስ ቅዱስ
  alternative: የሰው መንፈስ
  rationale: በገላትያ 5 ያለው ተደጋጋሚ ንጽጽር በሥጋና አማኞችን በሚመራው መንፈስ መካከል ነው። ዋናው ጽሑፍ “በመንፈስ” በማለት ይህን አውዳዊ ትርጉም ይጠብቃል።
- issue: የὑπὸ νόμον ትርጉም
  choice: ከሕግ በታች መሆን
  alternative: በአጠቃላይ ከማንኛውም ሕግ በታች መሆን
  rationale: በገላትያ መልእክት ውስጥ ሐረጉ በተለምዶ በሙሴ ሕግ ሥልጣን ወይም ግዛት ሥር መሆንን ያመለክታል፤ ትርጉሙ ይህን የጳውሎስን ንጽጽር ያለ አስፋፊ የእምነት ሥርዓት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ከሕግ በታች” የሚለው ቅርጽ የምንጩን ምሳሌያዊ አነጋገር ሲጠብቅ ትርጉሙ በእግር ማስታወሻ ተብራርቷል።
