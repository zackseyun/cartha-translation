  rationale: ከእርሾ ጋር ተያይዞ መጠኑ አነስተኛ መሆኑን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ζύμη
  choice: እርሾ
  rationale: ሊጥን የሚያቦካውን ንጥረ ነገር የሚያመለክት ግልጽና በመጽሐፍ ቅዱሳዊ ንግግርም የታወቀ ቃል ነው።
- source_word: ὅλον
