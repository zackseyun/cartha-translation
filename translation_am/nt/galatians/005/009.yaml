- source_word: φύραμα
  choice: ሊጡን
  rationale: የተቦካ ወይም የተደባለቀ የሊጥ ክምርን በዘመናዊ አማርኛ በቀላሉ ያስተላልፋል፤ በአውዱም አጠቃላይ የሊጥ መጠን ይገባል።
- source_word: ζυμοῖ
  choice: ያቦካዋል
  rationale: እርሾው ሊጡን እንዲቦካ ማድረጉን በቀጥታና በተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: የምሳሌያዊው አባባል ኃይል
  choice: የእርሾና የሊጥን ተጨባጭ ምስል ሳይተረጉሙ ማቆየት
  alternative: “ጥቂት የሐሰት ትምህርት ማኅበሩን ሁሉ ያበላሻል” ብሎ የአውዱን አንድምታ በግልጽ መግለጽ
  rationale: ጳውሎስ በቁጥሩ ራሱ የሚናገረው ምሳሌያዊ አባባሉን እንጂ ትርጓሜውን አይደለም። ምስሉን ማቆየት የንግግሩን ኃይልና እውነተኛ አንድምታ ይጠብቃል።
translation_notes:
  register: አጭር፣ ምሳሌያዊና የተከበረ ዘመናዊ አማርኛ ተጠቅሟል። “እርሾ” እና “ሊጥ” በተለመደ ንግግር ግልጽ ሲሆኑ የጥንቱን ተጨባጭ ምስልም ይጠብቃሉ።
