    text: ወይም፣ «በአንድ ቃል።» ግሪኩ ቃል በቃል «በአንድ ቃል/አባባል» ይላል፤ እዚህ ግን አንድ አባባል ወይም ትእዛዝ ማለት ነው።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «ተሞልቷል» ወይም፣ በትርጓሜ፣ «ይጠቃለላል።» የግሪኩ ግስ በቀጥታ «ተፈጽሟል» የሚል ሲሆን፣ የሕጉ ዓላማ በዚህ ትእዛዝ ወደ ሙላት እንደሚደርስም ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ γὰρ
  choice: -ና
  rationale: γάρ ከቀደመው ሐሳብ ጋር የሚያያዝ ምክንያታዊ ማብራሪያ ነው፤ በአማርኛ የዓረፍተ ነገሩ መጨረሻ ያለው “-ና” ይህን ግንኙነት ተፈጥሯዊ አድርጎ ያሳያል።
- source_word: ὁ πᾶς νόμος
  choice: ሕጉ ሁሉ
  rationale: የተወሰነውን ሕግ በአጠቃላይ መሆኑን πᾶς የሚሰጠውን ሙሉ ኃይል ይጠብቃል።
- source_word: ἐν ἑνὶ λόγῳ
  choice: በአንድ ንግግር
  rationale: λόγος እዚህ አንድን ቃል ብቻ ሳይሆን የተጠቀሰውን አንድ አባባል ወይም ትእዛዝ ያመለክታል፤ “ንግግር” ይህን ስፋት ይጠብቃል።
- source_word: πεπλήρωται
  choice: ይፈጸማል
  rationale: የግሪኩን የተፈጸመ ሁኔታ የሚያሳይ ፍጹም ተደራጊ ቅርጽ በተፈጥሯዊ አማርኛ ያቀርባል፤ ትርጉሙን “ይጠቃለላል” ብሎ ብቻ አያጠብም።
- source_word: Ἀγαπήσεις
  choice: ውደድ
  rationale: ከዘሌዋውያን 19፥18 የተጠቀሰውን የትእዛዝ ኃይል በዘመናዊና ግልጽ አማርኛ ያስተላልፋል።
- source_word: τὸν πλησίον σου
  choice: ባልንጀራህን
  rationale: በቅዱሳት መጻሕፍት አገባብ የታወቀና የቅርብ ሰውን የሚያመለክት ተፈጥሯዊ ምርጫ ነው።
- source_word: ὡς σεαυτόν
  choice: እንደ ራስህ
  rationale: የንጽጽሩን ቀጥተኛ አሳብ በግልጽና በተለመደ አማርኛ ይጠብቃል።
theological_decisions:
- issue: ሕጉ ከፍቅር ትእዛዝ ጋር ያለው ግንኙነት
  choice: ሕጉ ሁሉ ባልንጀራን በመውደድ ትእዛዝ ይፈጸማል
