  verdict: revise
  source_fidelity: The draft correctly retains the inferential conclusion, the universal scope of doing good, and the special priority for fellow believers. However, «እድል ባገኘን ጊዜ» can imply a particular opportunity already obtained rather than the ongoing availability expressed by ὡς καιρὸν ἔχομεν.
  naturalness: The wording is generally clear and modern. «እድል እስካለን ድረስ» is more idiomatic and more naturally expresses the continuing temporal-opportunity sense. The household phrase is retained in clear Amharic.
