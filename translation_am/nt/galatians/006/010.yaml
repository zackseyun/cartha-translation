base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/010.yaml
  text: So then[a], as we have opportunity, let us do what is good toward everyone[c][b], and especially toward those who are of the household of faith.
translation:
  language: am
  text: ስለዚህ፣ እድል እስካለን ድረስ[a] ለሁሉም ሰው መልካም እናድርግ፤ በተለይም ለእምነት ቤተሰብ አባላት[b][c]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ጊዜው ሳለን።» የግሪኩ καιρός በአጠቃላይ ጊዜን ብቻ ሳይሆን አመቺውን ወይም ተገቢውን ጊዜ ያጎላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «የእምነት ቤተሰብ የሆኑት።» ግሪኩ የአማኞችን ማኅበር አባላት ለመግለጽ የቤተሰብ ቋንቋ ይጠቀማል።
    reason: lexical_alternative
  - marker: c
    text: «እምነት» የሚለው የጋራውን ክርስቲያናዊ እምነት በሚያመለክት መልኩ «እምነቱ» ተብሎም ሊገባ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρα οὖν
  choice: ስለዚህ
  rationale: ሁለቱ የመደምደሚያ ቃላት ከቀደመው ሐሳብ የሚወጣውን ድምዳሜ ያመለክታሉ፤ «ስለዚህ» በዘመናዊ አማርኛ ይህን አመክንዮአዊ ግንኙነት በተፈጥሮ ያሳያል።
- source_word: ὡς καιρὸν ἔχομεν
  choice: እድል ባገኘን ጊዜ
  rationale: καιρός ተራ የጊዜ ርዝመትን ሳይሆን ለተግባር አመቺና ተገቢ የሆነን ጊዜ ያጎላል። ይህ አባባል እድሉ በተገኘ ቁጥር የሚለውን ቀጣይ ማበረታቻ ይይዛል።
- source_word: ἐργαζώμεθα
  choice: እናድርግ
  rationale: የአሁን ጊዜ አበረታች ንዑስ ግስ ማኅበሩን ወደ ቀጣይ ተግባር ይጋብዛል፤ «እናድርግ» ከ«መልካም» ጋር ተፈጥሯዊ አማርኛ ነው።
- source_word: τὸ ἀγαθὸν
  choice: መልካም
  rationale: በስም ተግባር የዋለው ገላጭ ቃል በዐውዱ መልካም የሆነውን ተግባር ያመለክታል፤ «መልካም እናድርግ» ግልጽና የተለመደ ነው።
- source_word: πρὸς πάντας
  choice: ለሁሉም ሰው
  rationale: πρός የተግባሩን አቅጣጫ ወደ ሰዎች ያመለክታል፤ «ለሁሉም ሰው» ሁሉን አቀፍ ወሰኑን በተፈጥሮ ያስተላልፋል።
- source_word: μάλιστα δὲ
  choice: በተለይም
  rationale: ይህ ቃል ሌሎችን ሳያስቀር በሰፊው ትእዛዝ ውስጥ ልዩ ቅድሚያን ያሳያል።
- source_word: τοὺς οἰκείους τῆς πίστεως
  choice: ለእምነት ቤተሰብ አባላት
  rationale: οἰκεῖοι የቤት ወይም የቤተሰብ አባላትን ያመለክታል። ትርጉሙ የቤተሰብን ዘይቤ ጠብቆ በአማርኛ በግልጽ ያቀርበዋል።
- source_word: πίστεως
  choice: እምነት
  rationale: በዚህ ሐረግ πίστεως ቤተሰቡን የሚለይበትን መስክ ወይም ማንነት ያመለክታል። «እምነት» የሚለው ምርጫ ምንጩን ሳያጠብ ሐሳቡን ይጠብቃል።
theological_decisions:
- issue: መልካም ማድረግ ያለበት ወሰንና ቅድሚያ
  choice: ጥቅሱ ለሁሉም ሰው መልካም ማድረግን ያዛል፤ በእምነት ማኅበር ውስጥ ላሉት ግን ልዩ ቅድሚያ ይሰጣል።
  alternative: ትእዛዙ ለአማኞች ብቻ ነው፣ ወይም ለአማኞች ምንም ልዩ ግዴታ አይሰጥም።
  rationale: πρὸς πάντας ሁሉን አቀፍ ወሰን ሲያሳይ፣ μάλιστα ግን በዚያው ወሰን ውስጥ ልዩ ቅድሚያን ያሳያል፤ ትርጉሙ ሁለቱንም ያልተደበላለቀ አብሮ ይጠብቃል።
- issue: በ«τῆς πίστεως» ውስጥ πίστεως የሚለው ትርጉም
  choice: ቤተሰቡን የሚለይ ባሕርይ እንደሆነ «እምነት» ተብሎ ተጠብቋል።
  alternative: «የእምነቱ» በሚል የጋራ ክርስቲያናዊ እምነትን በይበልጥ ማጉላት፣ ወይም «ታማኝነት» ማለት።
  rationale: ዐውዱ የአማኞችን የጋራ ማንነት ይጠቁማል፣ ነገር ግን ምንጩ በግድ ወደ ተቋማዊ ወይም ወደ ቀመራዊ ትርጉም አያጠበውም።
