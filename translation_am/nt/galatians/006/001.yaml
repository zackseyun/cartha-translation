  text: Ἀδελφοί, ἐὰν καὶ προλημφθῇ ἄνθρωπος ἔν τινι παραπτώματι, ὑμεῖς οἱ πνευματικοὶ καταρτίζετε τὸν τοιοῦτον ἐν πνεύματι πραΰτητος, σκοπῶν σεαυτόν, μὴ καὶ σὺ πειρασθῇς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/001.yaml
  text: Brothers[a], even if a man is caught in some trespass, you who are spiritual should restore such a one in a spirit of gentleness, watching yourself[c][b], lest you also be tempted.
translation:
  language: am
  text: ወንድሞች[a]፣ አንድ ሰው በአንዳች በደል ተይዞ ቢገኝ[b]፣ መንፈሳውያን የሆናችሁ እናንተ በየዋህነት መንፈስ እንዲህ ያለ ሰውን መልሱ። ራስህንም ጠብቅ፣ አንተም እንዳትፈተን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ወንድሞች” በግሪክ ተባዕታዊ ብዙ ቁጥር ነው፤ በዚህ አውድ ወንድና ሴት አማኞችን በአጠቃላይ ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በአንዳች በደል ተውጦ ቢገኝ” ወይም “በአንዳች በደል ድንገት ተይዞ ቢገኝ።”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀδελφοί
  choice: ወንድሞችና እህቶች
  rationale: ቃሉ በቅርጹ ተባዕታዊ ብዙ ቁጥር ቢሆንም፣ በጉባኤ አውድ ወንድና ሴት አማኞችን በጋራ ሊያመለክት ይችላል፤ ይህ አተረጓጎም በዘመናዊ አማርኛ አድማጮቹን በግልጽ ያሳያል።
- source_word: προλημφθῇ
  choice: ቢያዝ
  rationale: በበደል መያዝን በተፈጥሯዊ አማርኛ ይገልጣል፤ በበደሉ መወሰድ ወይም ድንገት መያዝ የሚለው ሌላው የግስ ጥላ በማስታወሻ ተጠብቋል።
- source_word: ἔν τινι παραπτώματι
  choice: በአንዳች በደል
  rationale: παράπτωμα የሞራል ጥፋትን ወይም መተላለፍን ያመለክታል፤ ‘በደል’ ግልጽና የተለመደ ሲሆን τινιን ‘አንዳች’ ያንጸባርቃል።
- source_word: οἱ πνευματικοὶ
  choice: መንፈሳውያን የሆናችሁ
  rationale: በመንፈስ የሚመሩ ወይም በመንፈሳዊ ብስለት የሚታወቁ ሰዎች ሊሆኑ የሚችሉትን ሰፊ ትርጉም ሳይገድብ ያቆያል።
- source_word: καταρτίζετε
  choice: እንዲመለስ አስተካክሉት
  rationale: ግሱ የተበላሸውን ማደስ፣ ወደ ትክክለኛ ሁኔታ መመለስ ወይም ማስተካከልን ይገልጣል፤ አገላለጹም ዓላማው ሰውየውን መቅጣት ሳይሆን መመለስ መሆኑን ያሳያል።
- source_word: ἐν πνεύματι πραΰτητος
  choice: በየዋህነት መንፈስ
  rationale: πνεῦμα የሰውን ዝንባሌ ወይም በመንፈስ የተቀረጸ አካሄድን ሊያመለክት የሚችለውን አሻሚነት ይጠብቃል።
- source_word: σκοπῶν σεαυτόν
  choice: ራስህን ተጠንቀቅ
  rationale: ሌላውን የሚያስተካክለው ሰው ራሱን በትኩረት እንዲጠብቅ የሚሰጠውን ቀጥተኛ ማሳሰቢያ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: μὴ καὶ σὺ πειρασθῇς
  choice: አንተም እንዳትፈተን
  rationale: በሞራላዊው አውድ πειράζωን ‘መፈተን’ ብሎ በመተርጎም አስተካካዩም ለተመሳሳይ ፈተና ተጋላጭ መሆኑን ይጠብቃል።
theological_decisions:
- issue: Ἀδελφοί የተባለው ቃል ጾታዊ ቅርጽና የአድማጮች ወሰን
  choice: ወንድሞችና እህቶች
  alternative: ወንድሞች
  rationale: የግሪክ ቅርጹ ተባዕታዊ ብዙ ቁጥር ነው፤ ሆኖም በጉባኤው አውድ የሁለቱንም ጾታ አማኞች ሊያካትት ይችላል። ዋናው ጽሑፍ የታሰቡትን አድማጮች በግልጽ ያሳያል፤ የቃሉ ቅርጽ በማስታወሻ ተጠብቋል።
- issue: προλημφθῇ በበደል ሲገኝ መያዝን ወይስ በበደል መወሰድን ያመለክታል
  choice: በአንዳች በደል ቢያዝ
  alternative: በአንዳች በደል ቢወሰድ / ድንገት ቢያዝ
  rationale: ግሱ አንድ ሰው በድርጊቱ መገኘቱንም ሆነ በበደሉ መወሰዱን ሊያመለክት ይችላል። ‘ቢያዝ’ አጭርና ተፈጥሯዊ ሲሆን ሌሎቹ ጥላዎች በማስታወሻ ቀርበዋል።
- issue: πνεύματι የሰው ዝንባሌን ወይስ መንፈስ ቅዱስን ያመለክታል
  choice: በየዋህነት መንፈስ
  alternative: በየዋህነት / መንፈስ ቅዱስ በሚሰጠው የዋህነት
  rationale: ምንጩ ሆን ብሎ ሊተወው የሚችለውን የሰው ዝንባሌና የመንፈስ ፍሬ ትስስር ትርጉሙ ሳይወስን ይጠብቃል።
