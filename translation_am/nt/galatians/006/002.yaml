review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the reciprocal command, the plural burdens, the present imperative, the resultative future, and “the law of the Messiah.” However, ሸክማችሁን means simply “your burdens” and does not itself securely encode the reciprocal possessive force of ἀλλήλων.
  naturalness: The wording is generally clear and suitably modern, but placing እርስ በርሳችሁ beside ሸክማችሁን is less precise and less natural than an explicit reciprocal possessive construction.
  terminology: መሲሕ appropriately translates Χριστός as a title, while the footnote responsibly provides the established transliterated alternative ክርስቶስ. ሕግ and ትፈጽማላችሁ are appropriate renderings.
  issues:
  - severity: medium
    issue: The reciprocal possessive relationship in ἀλλήλων is not expressed unambiguously.
    rationale: እርስ በርሳችሁ ሸክማችሁን can be read as “carry your burdens among one another.” Changing it to የእርስ በርሳችሁን ሸክሞች explicitly conveys “one another’s burdens” and retains the Greek plural.
  revised_text: የእርስ በርሳችሁን ሸክሞች ተሸከሙ፤ በዚህም መንገድ የመሲሑን[a] ሕግ ትፈጽማላችሁ።
  revised_footnotes:
