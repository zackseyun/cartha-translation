id: GAL.6.2
reference: Galatians 6:2
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἀλλήλων τὰ βάρη βαστάζετε, καὶ οὕτως ⸀ἀναπληρώσετε τὸν νόμον τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/002.yaml
  text: Carry one another’s burdens[a], and in this way you will fulfill the law of Messiah.
translation:
  language: am
  text: የእርስ በርሳችሁን ሸክሞች ተሸከሙ፤ በዚህም መንገድ የመሲሑን[a] ሕግ ትፈጽማላችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ «የክርስቶስን ሕግ»።
    reason: Χριστός በአማርኛ «መሲሕ» ተብሎ በትርጉም ወይም «ክርስቶስ» ተብሎ በተለመደ የድምፅ ዝውውር ሊቀርብ ይችላል።
lexical_decisions:
- source_word: ἀλλήλων
  choice: እርስ በርሳችሁ
  rationale: የግልግል ተውላጠ ስም ያለውን የጋራና የተመላላሽ እርምጃ በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: βάρη
  choice: ሸክማችሁን
  rationale: βάρη ብዙ ቁጥር ሲሆን በዚህ ሥነ ምግባራዊ አውድ የእያንዳንዱን ሰው ከባድ ችግርና ጫና በምሳሌያዊ አነጋገር ያመለክታል፤ የብዙ ቁጥሩ ኃይል በባለቤት ቅጥያው ተጠብቋል።
- source_word: βαστάζετε
  choice: ተሸከሙ
  rationale: የብዙ ቁጥር ትእዛዝን ይጠብቃል፤ የግሪኩ የቀጣይነት ገጽታ ደግሞ ይህን እንደ ልማድ የሚደረግ ተግባር እንዲታይ ያደርጋል።
- source_word: οὕτως
  choice: በዚህም መንገድ
  rationale: ትእዛዙን ከውጤቱ ጋር የሚያገናኘውን ትርጉም ግልጽና ተፈጥሯዊ በሆነ አማርኛ ያስተላልፋል።
- source_word: ἀναπληρώσετε
  choice: ትፈጽማላችሁ
  rationale: በምንጩ ያለውን የወደፊት አመልካች ቅርጽ ጠብቆ፣ እርስ በርስ ሸክምን መሸከም የሚያስገኘውን ውጤት ይገልጣል።
- source_word: νόμον
  choice: ሕግ
  rationale: የግሪኩን መደበኛ ትርጉምና በጳውሎስ ንግግር ያለውን ሕጋዊና ሥነ ምግባራዊ ድምፅ ይጠብቃል።
- source_word: τοῦ Χριστοῦ
  choice: የመሲሑን
  rationale: Χριστός እዚህ ሕጉን የሚወስን ማዕረግ ነው፤ «መሲሕ» የቅቡዕነትንና የአይሁድን መሲሐዊ ዳራ ይጠብቃል።
theological_decisions:
- issue: የΧριστοῦ አተረጓጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: በዚህ ሐረግ Χριστός እንደ ማዕረግ ስለሚሠራ «መሲሑ» የሚለው ትርጉሙን ይገልጣል፤ በቤተ ክርስቲያናዊ ወግ የተለመደው «ክርስቶስ» ግን በማስታወሻ ተጠብቋል።
- issue: የἀναπληρώσετε የግስ አይነት
  choice: የወደፊት ውጤት፦ ትፈጽማላችሁ
  alternative: የትእዛዝ ንባብ፦ ፈጽሙ
  rationale: የቀረበው SBLGNT ምንጭ ἀναπληρώσετε የሚለውን የወደፊት አመልካች ቅርጽ ይሰጣል፤ ስለዚህ ወደ ሁለተኛ ትእዛዝ አልተለወጠም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «እርስ በርሳችሁ … ተሸከሙ» የሚለው አወቃቀር የጋራ ኃላፊነትን በተፈጥሯዊ አነጋገር ያሳያል።
