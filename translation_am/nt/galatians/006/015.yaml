id: GAL.6.15
reference: Galatians 6:15
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸂οὔτε γὰρ⸃ περιτομή τί ⸀ἐστιν οὔτε ἀκροβυστία, ἀλλὰ καινὴ κτίσις.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/015.yaml
  text: For neither circumcision counts for anything[a], nor uncircumcision[b], but a new creation.
translation:
  language: am
  text: መገረዝም ሆነ አለመገረዝ ምንም ዋጋ የላቸውምና[a]፤ ዋጋ ያለው አዲስ ፍጥረት[b] ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፦ “ምንም አይደሉም”፤ ወይም፦ “ለምንም አይቆጠሩም።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፦ “አዲስ ፍጡር።” በዚህ ዐውድ “አዲስ ፍጥረት” የሚለው ይበልጥ ሰፊውን ትርጉም ይጠብቃል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε γὰρ
  choice: …ም ሆነ …ም … የላቸውምና
  rationale: የ«οὔτε … οὔτε»ን ሁለትዮሽ አሉታዊ ንጽጽር «…ም ሆነ …ም» በማለት፣ γάρንም ምክንያታዊ ግንኙነት በሚያሳየው «-ና» ቅጥያ ይገልጣል።
- source_word: περιτομή
  choice: መገረዝ
  rationale: አካላዊውን ሥርዓትና በጳውሎስ ክርክር ውስጥ ያለውን የማንነት ምልክት በቀጥታ የሚያስተላልፍ የተለመደ አማርኛ ነው።
- source_word: τί ἐστιν
  choice: ምንም ዋጋ የላቸውም
  rationale: በዚህ ዐውድ ሐረጉ ወሳኝነት ወይም ተቀባይነት እንደሌለው ይገልጣል፤ ይህ አገላለጽ ትርጉሙን በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: οὔτε ἀκροβυστία
  choice: አለመገረዝ
  rationale: ከ«መገረዝ» ጋር ያለውን ቀጥተኛ ተቃርኖ ይጠብቃል፤ ቃሉ እዚህ የሚያመለክተው ያልተገረዘ ሁኔታን እንጂ የአካል ክፍልን አይደለም።
- source_word: ἀλλὰ
  choice: ፤ ዋጋ ያለው … ነው
  rationale: በሁለቱ የማንነት ሁኔታዎችና በእውነተኛው ወሳኝ ነገር መካከል ያለውን ጠንካራ ንጽጽር በአማርኛ ተፈጥሯዊ በሆነ ሞላ አገላለጽ ያሳያል።
- source_word: καινὴ κτίσις
  choice: አዲስ ፍጥረት
  rationale: καινὴ በዓይነቱ አዲስ መሆንን ይገልጣል፤ κτίσις ደግሞ «ፍጥረት» ወይም «የተፈጠረ ፍጡር» ሊሆን ይችላል። «አዲስ ፍጥረት» የግለሰብንም ሆነ ሰፊውን የመታደስ እውነታ ሳይገድብ ይጠብቃል።
theological_decisions:
- issue: የመገረዝና ያለመገረዝ ሁኔታ ከአዲስ ፍጥረት ጋር ያለው ንጽጽር
  choice: ጳውሎስ ለሁለቱም ሁኔታዎች ወሳኝ ዋጋ እንደሌላቸው በመናገር ከአዲስ ፍጥረት ጋር ያነጻጽራቸዋል።
  alternative: ጳውሎስ ስለ ማኅበራዊ የማንነት ምልክቶች ብቻ ይናገራል፤ ወይም ሁለቱ ሁኔታዎች እኩል የመዳን መንገዶች ናቸው።
  rationale: የግሪኩ ጽሑፍ ሁለቱም «ምንም» እንዳልሆኑ በግልጽ ይክዳል፤ ወሳኙን ነገር ግን «አዲስ ፍጥረት» ብሎ ያቀርባል። ትርጉሙ ከጽሑፉ በላይ የተለየ የእምነት ሥርዓት አያክልም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። በግሪኩ ያለው ግስ አልባ ንጽጽር በአማርኛ ሙሉና ተፈጥሯዊ እንዲሆን «ዋጋ ያለው … ነው» ተብሎ ቀርቧል። የ[b] ምልክት ከሚያብራራው καινὴ κτίσις ጋር ተያይዟል።
