  source_fidelity: The translation accurately conveys the explanatory γάρ through -ና, the neither/nor pairing, the contextual force of τί ἐστιν as lack of decisive value, and the adversative contrast with καινὴ κτίσις. “አዲስ ፍጥረት” preserves the broad sense of κτίσις without narrowing it to an individual creature.
