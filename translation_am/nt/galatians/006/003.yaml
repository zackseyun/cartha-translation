  text: For if anyone thinks he is something when he is nothing[a], he deceives himself.
translation:
  language: am
  text: ምክንያቱም አንድ ሰው ምንም ሳይሆን ሳለ ራሱን አንዳች ነገር ቢቆጥር፣ ራሱን ያታልላል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ራሱን ያሳስታል።”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: ምክንያቱም ... ቢያስብ
  rationale: γάρ ከቀደመው ምክር ጋር ያለውን የምክንያት ግንኙነት፣ εἰ ደግሞ ሁኔታዊ አገላለጹን በተፈጥሯዊ አማርኛ ያስቀምጣሉ።
- source_word: δοκεῖ
  choice: ቢያስብ
  rationale: እዚህ ግሱ በሌሎች ዘንድ መምሰልን ሳይሆን ሰውየው ስለ ራሱ ያለውን ግምት ያመለክታል።
- source_word: τις
  choice: አንድ ሰው
  rationale: ያልተወሰነውንና ማንኛውንም ሰው የሚወክለውን ኃይል በተለመደ አማርኛ ያስተላልፋል።
- source_word: εἶναί τι
  choice: ራሱን ትልቅ ነገር እንደሆነ
  rationale: ቃል በቃል ‘አንድ ነገር መሆን’ የሚለው ፈሊጥ ራስን ከፍ አድርጎ ወይም ጠቃሚ አድርጎ መቁጠርን ያመለክታል፤ ‘ትልቅ ነገር’ በአማርኛ ይህን ንፅፅር በግልጽ ይገልጣል።
- source_word: μηδὲν ὤν
  choice: ምንም ሳይሆን ሳለ
  rationale: μηδέν ከὤν ጋር ተሳቢ ሆኖ የቆመውን ‘ምንም አለመሆን’ እና ከራስ ግምቱ ጋር ያለውን ንፅፅር ሳያሰፋ ያቆያል።
- source_word: φρεναπατᾷ
  choice: ያታልላል
  rationale: በአእምሮ ራስን ማሳሳትን የሚገልጽ ግስ ሲሆን፣ ‘ያታልላል’ ዋናውን የማታለል ትርጉም በግልጽ ያስተላልፋል።
- source_word: ἑαυτόν
  choice: ራሱን
  rationale: ወደ ነጠላው አጠቃላይ ርዕሰ ጉዳይ የሚመለሰውን አንጸባራቂ ተውላጠ ስም በተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: አጠቃላይ ነጠላ ሰው ማመልከቻ
  choice: አንድ ሰው / ራሱን
  alternative: ማንም / ራሳቸውን
  rationale: ግሪኩ በአጠቃላይ የሚወክል ነጠላ ቅርጽ ይጠቀማል። አማርኛው ‘አንድ ሰው’ ብሎ ሁሉን አካታች ትርጉሙን ሲጠብቅ፣ ‘ራሱን’ የሚለውም የነጠላውን አንጸባራቂ ግንኙነት ያቆያል።
