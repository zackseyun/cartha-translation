id: GAL.6.14
reference: Galatians 6:14
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐμοὶ δὲ μὴ γένοιτο καυχᾶσθαι εἰ μὴ ἐν τῷ σταυρῷ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ ἐμοὶ κόσμος ἐσταύρωται ⸀κἀγὼ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/014.yaml
  text: But far be it from me to boast except in the cross of our Lord Jesus the Messiah[a], through which the world has been crucified to me[b], and I to the world.
translation:
  language: am
  text: እኔ ግን በጌታችን ኢየሱስ መሲሕ መስቀል ካልሆነ በቀር በሌላ እንድመካ ፈጽሞ አይሁንልኝ። በዚያ መስቀል[a] አማካይነት ዓለም ለእኔ ተሰቅሏል፤ እኔም ለዓለም ተሰቅያለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በእርሱ አማካይነት»፤ ተዛማጅ ተውላጠ ስሙ መስቀሉን ሳይሆን ጌታችን ኢየሱስ መሲሕን እንደሚያመለክት ከተወሰደ።
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: እንዳልመካ!
  rationale: ከካυχᾶσθαι ጋር በተፈጥሯዊ አማርኛ ተዋሕዶ የጳውሎስን ጽኑ እምቢታና የግል አጽንዖት ያሳያል።
- source_word: καυχᾶσθαι
  choice: መመካት
  rationale: በአውዱ ያለውን በአንድ ነገር መኩራትና እሱን የክብር መሠረት ማድረግ የሚለውን የጳውሎስ አጠቃቀም ያስተላልፋል።
- source_word: εἰ μὴ
  choice: ካልሆነ በቀር
  rationale: ብቸኛውን የመመኪያ መሠረት የሚያመለክተውን ልዩ ሁኔታ በግልጽ አማርኛ ይገልጣል።
- source_word: σταυρῷ
  choice: መስቀል
  rationale: በአዲስ ኪዳን የሕማማት እና የጳውሎስ ሥነ መለኮታዊ አውድ ውስጥ የተለመደና ትክክለኛ ቃል ነው።
- source_word: κυρίου
  choice: ጌታ
  rationale: κύριοςን በዘመናዊና በተከበረ የአማርኛ መጽሐፍ ቅዱስ አጠቃቀም ይተረጉማል።
- source_word: Χριστοῦ
  choice: መሲሕ
  rationale: Χριστός እዚህ እንደ ማዕረግ ስለሚሠራ፣ ትርጉሙን ከተራ ስም ይልቅ በግልጽ ያቆያል።
- source_word: δι’ οὗ
  choice: በዚህም መስቀል
  rationale: የቅርብ አመልካቹ σταυρῷ ነው፤ መስቀሉን እንደ መንገድ ወይም መሣሪያ የሚገልጠውን ኃይል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: κόσμος
  choice: ዓለም
  rationale: በዚህ አውድ ከእግዚአብሔር የራቀውን የዓለም ሥርዓት ጨምሮ ሰፊውን የቃሉን ወሰን ያቆያል።
- source_word: ἐσταύρωται
  choice: ተሰቅሏል
  rationale: የግሪኩን ፍጹም ተደራጊ ቅርጽ—የተፈጸመና ውጤቱ የሚቀጥል ድርጊት—እንዲሁም የመስቀልን ዘይቤ ይጠብቃል።
- source_word: κἀγὼ κόσμῳ
  choice: እኔም ለዓለም ተሰቅያለሁ
  rationale: በግሪክ የተዘለለውን ግስ በአማርኛ ለግልጽነት ይሞላል፣ ትይዩነቱንም ያቆያል።
theological_decisions:
- issue: በἸησοῦ Χριστοῦ ውስጥ Χριστοῦን መተርጎም
  choice: ኢየሱስ መሲሕ
  alternative: ኢየሱስ ክርስቶስ
  rationale: Χριστός ከቅቡዕነትና ከተስፋው ንጉሥ ጋር ያለውን የማዕረግ ትርጉም ለመጠበቅ «መሲሕ» ተመርጧል፤ የአማርኛ አገባብ የተለየ የውስንነት አንቀጽ አያስፈልገውም።
- issue: የδι’ οὗ አመልካችና ኃይል
  choice: መስቀሉን ያመለክታል፤ «በዚህም መስቀል»
  alternative: ጌታ ኢየሱስ መሲሕን ያመለክታል፤ «በእርሱም»
  rationale: በሰዋስውና በቅርበት የሚገኘው አመልካች σταυρῷ ስለሆነ ዋናው ጽሑፍ መስቀሉን ይከተላል። ሌላው የአመልካች እድል ግን የግሪኩ ፆታ ቅርጽ ሁለቱንም ስለማያስወግድ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የመጨረሻው ትይዩ ንግግር በአማርኛ ግልጽ እንዲሆን በግሪክ የተዘለለው ግስ ተሞልቷል። የδι’ οὗ አማራጭ አመልካች በውሳኔ መዝገቡ ተጠብቋል፤ ነገር ግን ዋናው ትርጉም ግልጽ ስለሆነ የእግር ማስታወሻ አልተጨመረም።
