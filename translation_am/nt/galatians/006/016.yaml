    reason: alternative_reading
lexical_decisions:
- source_word: ὅσοι
  choice: ሁሉ
  rationale: ከግሳዊው አንቀጽ ጋር ሲጣመር “የሚመላለሱ ሁሉ” የግሪኩን አካታችና ያልተወሰነ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: κανόνι
  choice: መሥፈርት
  rationale: በዚህ አውድ κανών ምግባርን የሚመራ ደንብ ወይም መለኪያ ነው፤ “መሥፈርት” ይህን ሐሳብ በግልጽና ወቅታዊ ቋንቋ ይገልጣል።
- source_word: στοιχήσουσιν
  choice: ተከትለው የሚመላለሱ
  rationale: στοιχέω በአንድ መሥፈርት መሠረት በሥርዓት መሄድን ያመለክታል። ይህ ምርጫ የመሄድን ዘይቤ ጠብቆ ትርጉሙንም ለዘመናዊ አንባቢ ግልጽ ያደርጋል።
- source_word: εἰρήνη
  choice: ሰላም
  rationale: በበረከት ምኞቱ ውስጥ የεἰρήνηን የተለመደ እና ቀጥተኛ ፍቺ ያስተላልፋል።
- source_word: ἔλεος
  choice: ምሕረት
  rationale: የἔλεος መደበኛ አቻ ሲሆን ከ“ሰላም” ጋር የበረከት ምኞትን ይመሠርታል።
- source_word: ἐπ’ αὐτοὺς ... καὶ ἐπὶ
  choice: በእነርሱ ላይ ... እንዲሁም በ... ላይ
  rationale: የἐπίን መደገምና የበረከት አገላለጹን ይጠብቃል።
- source_word: Ἰσραὴλ τοῦ θεοῦ
  choice: የእግዚአብሔር እስራኤል
  rationale: የግሪኩን የባለቤትነት ግንኙነት በቀጥታ ይጠብቃል፤ አገላለጹ ማንን እንደሚያመለክትም በትርጉሙ ውስጥ አይወስንም።
theological_decisions:
- issue: “የእግዚአብሔር እስራኤል” የሚያመለክተው ቡድን
  choice: አገላለጹ በቀጥታ “የእግዚአብሔር እስራኤል” ተብሎ ተተርጉሟል።
  alternative: አማኝ አይሁድ፤ መላዋ ቤተ ክርስቲያን፤ ወይም አይሁድና አሕዛብ አማኞችን ያካተተ የእግዚአብሔር ሕዝብ።
  rationale: የግሪኩ አገላለጽ ብቻውን ከእነዚህ ትርጓሜዎች አንዱን አያስገድድም፤ ቀጥተኛው ትርጉም የሥነ መለኮት ውጥረቱን ይጠብቃል።
- issue: ከ“የእግዚአብሔር እስራኤል” በፊት ያለው የመጨረሻ καί
  choice: “እንዲሁም” ተብሎ ተተርጉሞ አሻሚነቱ በማስታወሻ ተገልጧል።
  alternative: ተጨማሪ ቡድንን የሚያመለክት “እና”፤ ወይም ያንኑ ቡድን የሚያብራራ “ማለትም/እንዲያውም”።
  rationale: καί በዚህ አውድ ተጨማሪ ቡድንን ሊጨምር ወይም የቀደመውን ቡድን ዳግም ሊገልጥ ይችላል፤ ዋናው ጽሑፍ ክርክሩን በግድ አይወስንም።
