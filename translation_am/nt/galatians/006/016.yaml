  yaml_path: translation/nt/galatians/006/016.yaml
  text: And as many as will walk by this rule—peace be upon them and mercy[c][b][a], and upon the Israel of God.
translation:
  language: am
  text: 'በዚህ መሥፈርት መሠረት ለሚኖሩ ሁሉ[a]፣ ሰላምና ምሕረት በእነርሱ ላይ እና[c] በየእግዚአብሔር እስራኤል[b] ላይ ይሁን።


    [a] ወይም፣ “ይህን መሥፈርት የሚከተሉ ሁሉ።” ግሱ በአንድ ደንብ መሠረት በሥርዓት መሄድን ወይም ከእርሱ ጋር እርምጃን ማስተካከልን ያመለክታል።


    [b] “የእግዚአብሔር እስራኤል” የሚለው አገላለጽ አከራካሪ ነው፤ ጳውሎስ አማኝ አይሁድን፣ መላዋን ቤተ ክርስቲያንን ወይም በሰፊው የእግዚአብሔርን ሕዝብ ማለቱ ሊሆን ይችላል። ትርጉሙ ይህን ክርክር ሳይወስን የግሪኩን አገላለጽ ጠብቋል።


    [c] የመጨረሻው “እና” ሌላ ቡድን እንደሚጨምር (“እና በየእግዚአብሔር እስራኤል ላይ”) ወይም ያንኑ ቡድን እንደገና እንደሚገልጥ (“ማለትም፣ በየእግዚአብሔር እስራኤል ላይ”) ሊነበብ ይችላል።'
  philosophy: optimal-equivalence
