lexical_decisions:
- source_word: τὸ καλὸν
  choice: መልካም ነገር
  rationale: በποιέω ጋር ያለው ሐረግ መልካምና ተገቢ የሆነውን ማድረግ የሚል ሥነ ምግባራዊ ትርጉም አለው፤ «መልካም ነገር» በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: ποιοῦντες
  choice: ማድረጋችንን
  rationale: የአሁን ጊዜ አንቀጽ ድርጊቱ ቀጣይ መሆኑን ያሳያል፤ ከ«አንታክት» ጋር ይህን ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: μὴ ἐγκακῶμεν
  choice: አንታክት
  rationale: ግሱ በመልካም ሥራ እየቀጠሉ መድከምን ወይም ልብ መቁረጥን ያመለክታል፤ «አንታክት» አጭር፣ ክቡርና የተለመደ አገላለጽ ነው።
- source_word: καιρῷ ... ἰδίῳ
  choice: በተገቢው ጊዜ
  rationale: καιρός የተወሰነውን ወይም አመቺውን ወቅት፣ ἴδιος ደግሞ ለነገሩ የሚገባውን ጊዜ ያመለክታል።
- source_word: θερίσομεν
  choice: እናጭዳለን
  rationale: የወደፊት ጊዜ ግሱ በአውዱ ያለውን የዘርና የመከር ምሳሌ በቀጥታ ይጠብቃል።
- source_word: μὴ ἐκλυόμενοι
  choice: ተስፋ ሳንቆርጥ
  rationale: አንቀጹ ደክሞ መለቀቅን፣ መሸነፍን ወይም ተስፋ መቁረጥን ያመለክታል። «ተስፋ ሳንቆርጥ» የሁኔታ/ቅድመ ሁኔታ ኃይሉን ያስተላልፋል፣ ከቀደመው «አንታክት»ም ይለያል።
theological_decisions:
- issue: በἐγκακῶμεν እና ἐκλυόμενοι መካከል ያለው የጽናት አገላለጽ ግንኙነት
  choice: ሁለቱን ተዛማጅ ሆነው ግን በተለያዩ ቃላት፣ «አንታክት» እና «ተስፋ ሳንቆርጥ» ብሎ መተርጎም
  alternative: ሁለቱንም በ«አንድከም» ወይም «ተስፋ አንቁረጥ» በሚል ተመሳሳይ አገላለጽ መተርጎም
  rationale: ጳውሎስ ተዛማጅ ነገር ግን ፍጹም አንድ ያልሆኑ ሁለት አገላለጾችን ይጠቀማል። ልዩነታቸውን መጠበቅ የንግግሩን ኃይል ያቆያል፤ ጽሑፉ ከሚለው በላይም ምንም የእምነት አቋም አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር አማርኛ ተጠቅሟል። የግብርናው ምሳሌ «እናጭዳለን» በሚል ተጠብቋል፤ ሁለቱ የጽናት አገላለጾችም ሳይደባለቁ ተለይተዋል።
