lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: ምክንያቱም ... እንኳ ... አይ...ም
  rationale: γάρ ከቀደመው ሐሳብ ጋር ያለውን የማብራሪያ ግንኙነት በ«ምክንያቱም»፣ οὐδέ የሚሰጠውን አጽንዖት ደግሞ በ«እንኳ ... አይ...ም» ያሳያል።
- source_word: οἱ περιτεμνόμενοι
  choice: የሚገረዙት
  rationale: በመስተዋድድ የተደገፈውን የአሁን ጊዜ አሳታፊ ግስ በተፈጥሯዊ አማርኛ ስማዊ አንቀጽ ይገልጣል፤ ቡድኑን ከግርዛት ጋር በማያያዝ ይጠቅሳል እንጂ «ግርዛትን የሚያስፋፉ» ብሎ አይተረጉምም።
- source_word: αὐτοὶ
  choice: ራሳቸው
  rationale: የእነርሱን ተጠያቂነትና የንግግሩን አጽንዖት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: νόμον φυλάσσουσιν
  choice: ሕጉን ይጠብቃሉ
  rationale: φυλάσσω በዚህ ዐውድ ሕግን መታዘዝና መፈጸምን ያመለክታል፤ «ሕጉን መጠበቅ» የተለመደና ክቡር አገላለጽ ነው።
- source_word: ὑμᾶς περιτέμνεσθαι
  choice: እናንተ እንድትገረዙ
  rationale: የግሪኩን ተገብሮ ትርጉም ግልጽና ተፈጥሯዊ በሆነ የአማርኛ ሐረግ ያቀርባል።
- source_word: ἵνα
  choice: እንዲ
  rationale: የዓላማ ግንኙነቱን በአማርኛ ተያያዥ ግስ ቅርጽ በግልጽ ሁኔታ ያሳያል።
- source_word: ἐν τῇ ὑμετέρᾳ σαρκὶ
  choice: በእናንተ ሥጋ
  rationale: σάρξን «ሥጋ» ብሎ በቀጥታ ይተረጉማል፤ በግርዛት ዐውድ ውስጥ የሚታየውን አካላዊ ትርጉም ይጠብቃል።
