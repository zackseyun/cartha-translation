  text: ምክንያቱም የተገረዙት[a] ራሳቸው እንኳ ሕጉን አይጠብቁም፤ ነገር ግን በሥጋችሁ እንዲመኩ እናንተ እንድትገረዙ ይፈልጋሉ።
