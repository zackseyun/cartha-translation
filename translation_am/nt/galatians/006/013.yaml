- issue: የπεριτεμνόμενοι አሳታፊ ግስ ኃይል
  choice: ቡድኑን ከግርዛት ጋር የሚያያይዘው «የሚገረዙት»
  alternative: «ግርዛትን የሚያስፋፉት» ወይም «የተገረዙት»
  rationale: የግሪኩ የአሁን ጊዜ አሳታፊ ግስ የመካሄድ ወይም የተለመደ ልማድ ጥላ ትርጉም ሊኖረው ስለሚችል «የሚገረዙት» ይህን ውጥረት ይጠብቃል፤ «የሚያስፋፉት» ደግሞ ከቃሉ በላይ ይተረጉማል።
