  rationale: ‘ሰው’ በዘመናዊ አማርኛ ነጠላ ወካይ ሆኖ ማንኛውንም ሰብዓዊ ፍጡር በተፈጥሯዊ ሁኔታ ያካትታል፤ የግሪኩን አጠቃላይ ኃይል ያለ ፆታዊ ጠባብነት ያስተላልፋል።
- source_word: τοῦτο καὶ θερίσει
  choice: ያንኑ ደግሞ ያጭዳል
  rationale: ‘ያንኑ’ የሚለው τοῦτο የሚሰጠውን አጽንዖት ይጠብቃል፤ ‘ደግሞ’ καίን ይወክላል፤ ‘ያጭዳል’ ደግሞ ከመዝራት ጋር የተጣመረውን የመከር ምሳሌ ይጠብቃል።
