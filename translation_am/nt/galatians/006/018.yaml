  text: Ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ μετὰ τοῦ πνεύματος ὑμῶν, ἀδελφοί· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/018.yaml
  text: The grace of our Lord Jesus Christ be with your spirit[a], brothers[b]. Amen.
translation:
  language: am
  text: የጌታችን የኢየሱስ መሲሕ[a] ጸጋ ከመንፈሳችሁ ጋር ይሁን፣ ወንድሞች[b]። አሜን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ በተለመደው አጠራር፣ «ኢየሱስ ክርስቶስ»። የግሪኩ Χριστός ማዕረግ ትርጉሙን ለመጠበቅ እዚህ «መሲሕ» ተብሎ ተተርጉሟል።
    reason: alternative_reading
  - marker: b
    text: እዚህ «ወንድሞች» የሚለው የአማኞችን ማኅበረሰብ የሚያናግር ሲሆን ወንዶችንም ሴቶችንም ሊያካትት ይችላል፤ አማራጭ፦ «ወንድሞችና እህቶች»።
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: ጸጋ
  rationale: በጳውሎስ የበረከት መደምደሚያዎች የተለመደውን ቃልና ሥነ መለኮታዊ ክብደቱን ይጠብቃል።
- source_word: κυρίου
  choice: ጌታ
  rationale: κύριος የሚያመለክተውን ማዕረግ በተፈጥሯዊና በተለመደ አማርኛ ያስተላልፋል።
- source_word: Ἰησοῦ Χριστοῦ
  choice: ኢየሱስ መሲሕ
  rationale: Ἰησοῦ እንደ ስም ተጽፎ፣ Χριστός ደግሞ የተቀባውን ንጉሥ የሚያመለክት ማዕረግ መሆኑን «መሲሕ» ይጠብቃል።
- source_word: μετὰ
  choice: ከ… ጋር ይሁን
  rationale: በግሪክ ግስ ያልተገለጸበትን የበረከት አነጋገር በተፈጥሯዊ አማርኛ «ይሁን» በመጨመር ያቀርባል።
- source_word: πνεύματος ὑμῶν
  choice: መንፈሳችሁ
  rationale: የግሪኩን ነጠላ «መንፈስ» ከብዙ ተናጋሪዎች ባለቤትነት ጋር በመጠበቅ የጉባኤውን የጋራ አድራሻ ያሳያል።
- source_word: ἀδελφοί
  choice: ወንድሞች
  rationale: የግሪኩን ተባዕታይ ብዙ ቁጥር ቅርጽ ይጠብቃል፤ ቃሉ መላውን አማኝ ማኅበረሰብ ሊያካትት እንደሚችል በማስታወሻ ተገልጿል።
- source_word: ἀμήν
  choice: አሜን
  rationale: የተለመደውን የአምልኮና የማጽደቂያ መደምደሚያ ይጠብቃል።
theological_decisions:
- issue: በጳውሎስ የመደምደሚያ በረከት Χριστόςን መተርጎም
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: በዚህ ስፍራ Χριστός የማዕረግ ኃይሉን ይዞ ስለሚገኝ «መሲሕ» ትርጉሙን በግልጽ ያቀርባል፤ የተለመደው «ክርስቶስ» በማስታወሻ ተጠብቋል።
- issue: ἀδελφοί ለድብልቅ የአማኞች ጉባኤ ሲውል
  choice: ወንድሞች
  alternative: ወንድሞችና እህቶች
  rationale: ዋናው ጽሑፍ የግሪኩን ሰዋሰዋዊ ተባዕታይ ብዙ ቁጥር ይጠብቃል፤ በአውዱ ሴቶችንም ሊያካትት የሚችለው የማኅበረሰብ አጠቃቀም በማስታወሻ ተገልጿል።
- issue: πνεύματος ὑμῶν ያለውን ነጠላና ብዙ ቁጥር ውጥረት መጠበቅ
  choice: መንፈሳችሁ
  alternative: ከእናንተ ጋር
  rationale: አጠቃላይ «እናንተ» በማለት የπνεῦμαን ልዩ ቃላዊ ይዘት ከማጥፋት ይልቅ፣ ጳውሎስ ለብዙዎች ሲናገር የተጠቀመውን ነጠላ «መንፈስ» ጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ የበረከት አነጋገር ተጠቅሟል። «ከመንፈሳችሁ ጋር ይሁን» የምንጩን ቃላዊ ቅርጽ ከተፈጥሯዊ አማርኛ ጋር ያስማማል።
