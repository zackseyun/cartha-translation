- source_word: οὗτοι
  choice: እነዚህ
  rationale: ጠቋሚው ተውላጠ ስም ያለውን አጽንዖት ይጠብቃል፤ እነዚሁ ሰዎች ግፊቱን እንደሚያደርጉ ያጎላል።
- source_word: ἀναγκάζουσιν ὑμᾶς περιτέμνεσθαι
  choice: እናንተን እንድትገረዙ ያስገድዷችኋል
  rationale: በአንባቢዎቹ ላይ የሚደረገውን ቀጣይ ግፊትና የግርዛትን ተገብሮ መቀበል በግልጽ ዘመናዊ አማርኛ ያሳያል።
- source_word: μόνον ἵνα
  choice: … እንዳይሰደዱ ብቻ
  rationale: ጳውሎስ ለእነርሱ የሚያቀርበውን ብቸኛ ዓላማ እና የἵναን ዓላማዊ ኃይል ይጠብቃል።
- source_word: τῷ σταυρῷ τοῦ Χριστοῦ
  choice: በመሲሑ መስቀል ምክንያት
  rationale: ዳቲቩን እንደ ምክንያት/ግንኙነት በተፈጥሯዊ አማርኛ ይገልጣል፤ Χριστόςን በዚህ ርዕሳዊ አጠቃቀም ‘መሲሕ’ ብሎ ይተረጉማል።
- source_word: μὴ διώκωνται
