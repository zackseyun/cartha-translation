theological_decisions:
- issue: ἐν σαρκί የሚለው ሐረግ
  choice: በሥጋ
  alternative: በውጫዊ ሁኔታ / በሰው ፊት
  rationale: ‘ሥጋ’ የጳውሎስን ሥነ መለኮታዊ ቃልና ሆን ተብሎ ያልተፈታውን ውጥረት ይጠብቃል፤ የውጫዊ መልክ ትርጉሙ በማስታወሻ ተብራርቷል።
- issue: Χριστοῦ በτῷ σταυρῷ τοῦ Χριστοῦ
  choice: የመሲሑ
  alternative: የክርስቶስ
  rationale: በዚህ የባለቤትነት ሐረግ ውስጥ Χριστός እንደ ማዕረግ ያለው ፍቺ ሕያው ነው፤ ስለዚህ ‘መሲሕ’ ተመርጧል፣ ባህላዊው አተረጓጎም ግን በማስታወሻ ተጠብቋል።
- issue: τῷ σταυρῷ ከδιώκωνται ጋር ያለው ግንኙነት
  choice: በ…መስቀል ምክንያት እንዳይሰደዱ
  alternative: ስለ…መስቀል እንዳይሰደዱ
  rationale: ዳቲቩ ምክንያታዊ ወይም የማጣቀሻ ግንኙነት ሊገልጥ ይችላል፤ ዋናው ጽሑፍ ምክንያታዊውን ንባብ በግልጽ አማርኛ ሲያቀርብ አማራጩን በማስታወሻ ይጠብቃል።
