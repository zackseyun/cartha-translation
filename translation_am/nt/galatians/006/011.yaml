  text: See with what large letters I have written to you with my own hand[a].
translation:
  language: am
  text: በምን ያህል ትልልቅ ፊደላት በገዛ እጄ እንደጻፍኩላችሁ ተመልከቱ።[a]
  philosophy: optimal-equivalence
  footnotes:
