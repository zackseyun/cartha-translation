    reason: alternative_reading
lexical_decisions:
- source_word: Ἴδετε
  choice: ተመልከቱ
  rationale: የብዙ ቁጥር ቀጥተኛ ትእዛዝና ትኩረት የሚጠራ አገላለጽ ነው።
- source_word: πηλίκοις
  choice: ምን ያህል በትልልቅ
  rationale: የመጠን አጽንዖቱን በተፈጥሯዊ አማርኛ ይገልጣል፤ ከγράμμασιν ጋር ሲነበብ የፊደሎቹን ትልቅነት ያመለክታል።
- source_word: γράμμασιν
  choice: ፊደላት
  rationale: በዚህ ዐውድ የጽሑፍ ምልክቶችን፣ ማለትም የፊደሎቹን አካላዊ መጠን ለማመልከት የተሻለ ነው።
- source_word: ὑμῖν
  choice: እንደጻፍኩላችሁ
  rationale: የግሪኩን ተቀባይ ዳቲቭ በአማርኛው -ላችሁ ቅጥያ በተፈጥሯዊነት ያሳያል።
- source_word: ἔγραψα
  choice: እንደጻፍኩ
  rationale: የአንድ ጊዜ ያለፈ ድርጊትን ያሳያል፤ ከተመልከቱ ጋር የአማርኛ ተያያዥ ሐረግ ሆኖ ተቀርጿል።
- source_word: τῇ ἐμῇ χειρί
  choice: በገዛ እጄ
  rationale: የመሣሪያ ትርጉሙንና ἐμῇ የሚሰጠውን የግል አጽንዖት ግልጽ እና ተፈጥሯዊ በሆነ አማርኛ ይጠብቃል።
theological_decisions:
- issue: የπηλίκοις γράμμασιν ትርጉም
  choice: የፊደሎቹ አካላዊ ትልቅነት
  alternative: በገዛ እጄ ምን ያህል ረጅም ደብዳቤ እንደጻፍኩላችሁ
  rationale: γράμματα በመደበኛነት ፊደላትን ወይም የጽሑፍ ምልክቶችን ሊያመለክት ይችላል፤ «በገዛ እጄ» የሚለውም የእጅ ጽሑፉን ባሕርይ ያጠናክራል። ሆኖም የደብዳቤውን ርዝመት የሚያመለክት ታሪካዊ አማራጭ ስላለ፣ አሻሚነቱ በግርጌ ማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። «በገዛ እጄ» የግል አጽንዖቱን ይጠብቃል።
