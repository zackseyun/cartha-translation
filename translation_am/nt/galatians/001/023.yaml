  to: እነርሱ ግን፣ “ቀድሞ እኛን ያሳድድ የነበረው ሰው አሁን ቀድሞ ያፈርስ የነበረውን እምነት[a] ይሰብካል” ሲባል ብቻ ይሰሙ ነበር።
