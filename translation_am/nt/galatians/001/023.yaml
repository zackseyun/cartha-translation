theological_decisions:
- issue: የτὴν πίστιν ትርጉም
  choice: ‘እምነት’ ማለት ጳውሎስ አሁን የሚሰብከውን የክርስትና መልእክትና የእምነት ይዘት ያመለክታል
  alternative: የማመን ተግባር፤ ወይም በዐውዱ ‘ወንጌል’
  rationale: ከቀድሞው ስደትና ከአሁኑ ስብከት ጋር ያለው ንጽጽር፣ ቃሉ በዋናነት የሚታመነውን መልእክት እንደሚያመለክት ይጠቁማል፤ ሆኖም ‘እምነት’ የግሪኩን ቃልና የትርጉም ስፋቱን ይጠብቃል።
