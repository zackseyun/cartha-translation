lexical_decisions:
- source_word: μόνον
  choice: ብቻ
  rationale: የይሁዳ አብያተ ክርስቲያናት እውቀት በዚህ ወሬ ብቻ የተወሰነ መሆኑን ያሳያል።
- source_word: ἀκούοντες ἦσαν
  choice: ይሰሙ ነበር
  rationale: የግሪኩን ቀጣይ ወይም ተደጋጋሚ ያለፈ ድርጊት በተፈጥሯዊ የአማርኛ አገላለጽ ያቀርባል።
- source_word: ὁ διώκων ἡμᾶς ποτε
  choice: ቀድሞ ያሳድደን የነበረው ሰው
  rationale: ጳውሎስን በቀድሞው ድርጊቱ የሚለየውን ስማዊ ቦዝ አንቀጽ በግልጽና ተፈጥሯዊ ሁኔታ ይተረጉማል።
- source_word: νῦν εὐαγγελίζεται
