  rationale: εὐαγγελίζεται የምሥራቹን መልእክት ማወጅን ያመለክታል፤ ‘ይሰብካል’ በዘመናዊ አማርኛ የታወቀና ቀጥተኛ ነው።
- source_word: τὴν πίστιν
  choice: እምነት
  rationale: በዐውዱ የግል የማመን ተግባርን ብቻ ሳይሆን ጳውሎስ አሁን የሚያውጀውን የክርስትና መልእክትና የእምነት ይዘት ያመለክታል።
- source_word: ἣν ποτε ἐπόρθει
