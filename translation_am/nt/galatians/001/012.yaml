id: GAL.1.12
reference: Galatians 1:12
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὐδὲ γὰρ ἐγὼ παρὰ ἀνθρώπου παρέλαβον αὐτό, ⸀οὔτε ἐδιδάχθην, ἀλλὰ δι’ ἀποκαλύψεως Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/012.yaml
  text: For I neither received it from a human source[a], nor was I taught it, but through a revelation of Jesus the Messiah.
translation:
  language: am
  text: ምክንያቱም እኔ ይህን ከሰው አልተቀበልኩም፤ እንዲሁም ማንም አላስተማረኝም፤ ነገር ግን በኢየሱስ መሲሕ በተሰጠ መገለጥ[a] ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪኩ ያለው አገላለጽ “ከኢየሱስ መሲሕ የመጣ መገለጥ” ወይም “ስለ ኢየሱስ መሲሕ የሆነ መገለጥ” ማለት ሊሆን ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: παρὰ ἀνθρώπου
  choice: ከሰው
  rationale: ነጠላውን አጠቃላይ የሰው ምንጭ ሐሳብ በተፈጥሯዊ አማርኛ ያሳያል፤ አንድን የተወሰነ ግለሰብ አያመለክትም።
- source_word: παρέλαβον
  choice: ተቀበልኩት
  rationale: በወግ ወይም በመልእክት ርክክብ አውድ ያለውን ‘መቀበል’ ትርጉም በቀጥታ ይጠብቃል።
- source_word: ἐδιδάχθην
  choice: ማንም አላስተማረኝም
  rationale: የግሪኩን ተደራጊ ሐሳብ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል፤ መልእክቱ በሰው ትምህርት እንዳልተላለፈ ያሳያል።
- source_word: δι’ ἀποκαλύψεως
  choice: በ… መገለጥ
  rationale: διά የሚያመለክተውን መንገድ ወይም አማካይነት ያሳያል፤ ‘መገለጥ’ ደግሞ ἀποκάλυψιςን በተለመደ እና በክብር ባለው አገላለጽ ይተረጉማል።
- source_word: Ἰησοῦ Χριστοῦ
  choice: የኢየሱስ መሲሕ
  rationale: Χριστόςን እንደ ማዕረግ ‘መሲሕ’ ብሎ ያቀርባል፤ የግሪኩ የባለቤትነት ቅርጽ ኢየሱስ የመገለጡ ሰጪ ወይም ይዘት ሊሆን የሚችለውን አሻሚነት እንዳለ ይተዋል።
theological_decisions:
- issue: ἀποκαλύψεως Ἰησοῦ Χριστοῦ ውስጥ ያለው የግሪክ የባለቤትነት ቅርጽ
  choice: ‘በኢየሱስ መሲሕ መገለጥ’ በማለት አሻሚነቱን በዋናው ጽሑፍ መጠበቅ
  alternative: ‘ኢየሱስ መሲሕ በገለጠልኝ መገለጥ’ ወይም ‘ስለ ኢየሱስ መሲሕ በሆነ መገለጥ’
  rationale: የመጀመሪያው ንባብ መገለጡ ከኢየሱስ መሲሕ እንደመጣ ሊያሳይ ይችላል፤ ሁለተኛው ደግሞ መገለጡ ስለ እርሱ እንደሆነ ሊያሳይ ይችላል። ግሪኩ ሁለቱንም ስለሚፈቅድ ዋናው ጽሑፍ አንዱን ብቻ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ግልጽ እና ክብር ያለው አማርኛ ተጠቅሟል። ‘ይህንን’ በቀደመው አውድ የተጠቀሰውን ወንጌል ያመለክታል፤ በግሪኩ የሌለውን ስም በግልጽ አልጨመረም። ረዘም ያለው የግሪክ ዓረፍተ ነገር ለአማርኛ ንባብ ግልጽነት በሁለት ዓረፍተ ነገሮች ቀርቧል።
