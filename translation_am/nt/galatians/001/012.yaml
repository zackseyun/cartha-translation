  to: ምክንያቱም እኔ ይህን ከሰው አልተቀበልኩም፤ እንዲሁም ማንም አላስተማረኝም፤ ነገር ግን በኢየሱስ መሲሕ በተሰጠ መገለጥ[a] ነው።
