    text: በግሪኩ ያለው አገላለጽ “ከኢየሱስ መሲሕ የመጣ መገለጥ” ወይም “ስለ ኢየሱስ መሲሕ የሆነ መገለጥ” ማለት ሊሆን ይችላል።
    reason: alternative_reading
  revision_rationale: The revised wording gives the sentence a natural Amharic form and represents the audit trail’s primary source-oriented understanding of ἀποκαλύψεως Ἰησοῦ Χριστοῦ. Since the Greek genitive can also be understood objectively, the footnote explicitly preserves that ambiguity without imposing a doctrinal resolution.
