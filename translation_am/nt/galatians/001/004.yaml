  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τοῦ δόντος ἑαυτὸν ⸀ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν ὅπως ἐξέληται ἡμᾶς ἐκ τοῦ ⸂αἰῶνος τοῦ ἐνεστῶτος⸃ πονηροῦ κατὰ τὸ θέλημα τοῦ θεοῦ καὶ πατρὸς ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/004.yaml
  text: who gave himself for our sins so that he might rescue us from the present evil age[a], according to the will of our God and Father,
translation:
  language: am
  text: እርሱም ከዚህ ካለው ክፉ ዘመን[a] ያድነን ዘንድ፣ እንደ የእኛ አምላክና አባት ፈቃድ፣ ስለ ኃጢአቶቻችን ራሱን ሰጠ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ከዚህ ካለው ክፉ ዓለም።»
    reason: lexical_alternative
lexical_decisions:
- source_word: δόντος
  choice: ራሱን ሰጠ
  rationale: «ሰጠ» የδίδωμιን ቀጥተኛ ፍቺ ያስተላልፋል፤ «ራሱን» ደግሞ ድርጊቱ በፈቃድ መሆኑን ሳያጋንን ይጠብቃል።
- source_word: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: ስለ ኃጢአታችን
  rationale: «ስለ» በዚህ አውድ የመወከልንና የቤዛነትን ኃይል የሚሸከም ተፈጥሯዊ አማርኛ ሲሆን፣ ጽሑፉ ያልገለጸውን የስርየት ንድፈ ሐሳብ አይጨምርም።
- source_word: ἐξέληται
  choice: ያድን
  rationale: ቃሉ ከአደጋ ወይም ከሚቆጣጠር ሁኔታ ማውጣትን ያመለክታል፤ «ያድን» ይህን በግልጽና በዘመናዊ አማርኛ ያቀርባል።
- source_word: αἰῶνος τοῦ ἐνεστῶτος πονηροῦ
  choice: ከአሁኑ ክፉ ዘመን
  rationale: «ዘመን» የαἰώνን ጊዜያዊና ዓለማዊ ስፋት ከ«ዓለም» ይልቅ በትክክል ይጠብቃል፤ «አሁኑ» እና «ክፉ» ደግሞ ἐνεστῶτος እና πονηροῦን ይወክላሉ።
- source_word: κατὰ τὸ θέλημα
  choice: እንደ ... ፈቃድ
  rationale: ይህ አገላለጽ ድርጊቱ ከእግዚአብሔር ዓላማ ጋር መስማማቱን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: አምላካችንና አባታችን
  rationale: አንድን አካል የሚጠቁመውን የግሪክ አገባብ በግልጽ ሁኔታ ይጠብቃል።
theological_decisions:
- issue: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν የስርየትን ዘዴ በተወሰነ አስተምህሮ መጥበብ አለበት ወይስ የለበትም
  choice: ስለ ኃጢአታችን
  alternative: በኃጢአታችን ምክንያት፤ ስለ እኛ ኃጢአት
  rationale: ምንጩ የቤዛነት ክብደት ቢኖረውም የስርየትን ሙሉ ዘዴ አይገልጽም፤ የተመረጠው አገላለጽ ይህን ውጥረት ይጠብቃል።
- issue: αἰώνን «ዘመን» ወይስ «ዓለም» ብሎ መተርጎም
  choice: አሁኑ ክፉ ዘመን
  alternative: አሁኑ ክፉ ዓለም
  rationale: αἰών በቀዳሚነት የጊዜን ወቅትና ሥርዓት ያመለክታል፤ «ዘመን» ይህን የምንጩን ትርጉም በተሻለ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ተውሳከ ግስ በአማርኛ ተፈጥሯዊ ሙሉ ዐረፍተ ነገር ተቀርቧል፤ «ያድን ዘንድ» ዓላማን በክቡር ነገር ግን በሚገባ የተለመደ አገላለጽ ያሳያል።
