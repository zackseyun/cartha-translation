lexical_decisions:
- source_word: καὶ
  choice: እነርሱም
  rationale: καί የቀደመውን ትረካ የሚቀጥል አያያዥ ነው፤ የአማርኛው «-ም» ተፈጥሯዊ ማያያዣ ሆኖ ሲያገለግል፣ በዐውዱ የሚታወቀው ብዙ ቁጥር ባለቤት «እነርሱ» ለግልጽነት ተጨምሯል።
- source_word: ἐδόξαζον
  choice: ያከብሩ ነበር
  rationale: δοξάζω ክብርን መስጠትን ያመለክታል፤ ኢምፐርፌክት ግሱ ቀጣይነት ወይም ተደጋጋሚነት ስላለው «ያከብሩ ነበር» ይህን ገጽታ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐν ἐμοὶ
  choice: በእኔ ምክንያት
  rationale: ἐν በመሠረቱ «በ…ውስጥ/በ…» ቢሆንም፣ በዚህ ዐውድ ማኅበራቱ ስለጳውሎስ በሰሙት ነገር የተነሣ እግዚአብሔርን ማክበራቸውን የሚገልጽ ምክንያታዊ/ተዛምዶአዊ አገባብ ነው። የቅርብ ቀጥተኛው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: τὸν θεόν
  choice: እግዚአብሔርን
  rationale: የἐδόξαζον ቀጥተኛ ተሳቢ ነው፤ «እግዚአብሔር» በዘመናዊ መደበኛ አማርኛ ለθεός የተለመደና ክብር ያለው አቻ ነው።
theological_decisions:
- issue: የἐν ἐμοὶ ትርጉም
  choice: ምክንያታዊ/ተዛምዶአዊ፦ «በእኔ ምክንያት»
  alternative: ይበልጥ ቀጥተኛ፦ «በእኔ»
  rationale: የቅርብ ዐውዱ ማኅበራቱ ስለጳውሎስ መለወጥና አገልግሎት ሰምተው የሰጡትን ምላሽ ይገልጻል። «በእኔ ምክንያት» ዋናውን ዐውዳዊ ትርጉም ግልጽ ያደርጋል፤ የግሪኩን አጭር አገባብና ሊኖረው የሚችለውን ሌላ ንባብ ግን በማስታወሻ ይጠብቃል።
translation_notes:
