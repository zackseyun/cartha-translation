  text: Παῦλος ἀπόστολος, οὐκ ἀπ’ ἀνθρώπων οὐδὲ δι’ ἀνθρώπου ἀλλὰ διὰ Ἰησοῦ Χριστοῦ καὶ θεοῦ πατρὸς τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/001.yaml
  text: Paul[a], an apostle—not from men nor through a man, but through Jesus the Messiah and God the Father, who raised him from the dead,
translation:
  language: am
  text: ጳውሎስ፣ ከሰዎችም ሆነ በሰው በኩል ያልሆነ፣ ነገር ግን በኢየሱስ መሲሕ[a] እና እርሱን ከሙታን ባስነሣው እግዚአብሔር አብ በኩል የሆነ ሐዋርያ፣
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በኢየሱስ ክርስቶስ በኩል።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόστολος
  choice: ሐዋርያ
  rationale: በዘመናዊ አማርኛ የጳውሎስን የተልእኮ ሥልጣንና የታወቀውን የአገልግሎት ማዕረግ የሚጠብቅ መደበኛ ቃል ነው።
- source_word: ἀπ’ ἀνθρώπων
  choice: ከሰዎች ያልተላከ
  rationale: ἀπό የምንጭን ሐሳብ ይገልጣል፤ በአማርኛ የሐዋርያነቱን መነሻ በግልጽና ተፈጥሯዊ አነጋገር ለማሳየት ‘ያልተላከ’ ተጨምሯል።
- source_word: δι’ ἀνθρώπου
  choice: በሰውም በኩል ያልተላከ
  rationale: διά ከወራሽ ጋር አማካይነትን ይገልጣል፤ ነጠላው ‘ሰው’ ከብዙ ቁጥሩ ‘ሰዎች’ ጋር ያለውን የንግግር ንጽጽር ይጠብቃል።
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: በኢየሱስ መሲሕ በኩል
  rationale: የተደገመው διά እውነተኛውን የተልእኮ አማካይነት ከተካደው ሰብአዊ አማካይነት ጋር ያነጻጽራል፤ Χριστός እዚህ የማዕረግ ኃይሉን እንዲጠብቅ ‘መሲሕ’ ተብሏል።
- source_word: θεοῦ πατρὸς
  choice: እግዚአብሔር አብ
  rationale: ይህ በአማርኛ የተለመደ፣ ክቡርና ግልጽ መለኮታዊ ማዕረግ ሲሆን ከኢየሱስ መሲሕ ጋር የተቀናጀውን የተልእኮ ምንጭ ይጠብቃል።
- source_word: τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν
  choice: እርሱን ከሙታን ባስነሣው
  rationale: የግሪኩ አንቀጽ ያለው ተሳቢ አገላለጽ ‘እግዚአብሔር አብን’ እንደሚገልጥ ያሳያል፤ ‘ከሙታን’ የትንሣኤውን አባባል በተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: በἸησοῦ Χριστοῦ ውስጥ Χριστοῦን መተርጎም
  choice: ኢየሱስ መሲሕ
