  rationale: በዚህ ሰላምታ Χριστός እንደ ተራ የስም ክፍል ብቻ ሳይሆን የተቀባውን ንጉሥ የሚያመለክት ማዕረግ ሆኖ ይሠራል፤ ‘መሲሕ’ ይህን ኃይል ይጠብቃል።
