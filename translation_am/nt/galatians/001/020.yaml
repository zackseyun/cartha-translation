  text: What I am writing to you—behold[a], before God[b], I am not lying.
translation:
  language: am
  text: እኔ ግን ለእናንተ የምጽፈው ነገር፣ እነሆ፣ በእግዚአብሔር ፊት አልዋሽም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἃ
  choice: የምጽፈው ነገር
  rationale: ብዙ ቁጥር ያለው ዝምድናዊ ተውላጠ ስም በዚህ አገባብ ጳውሎስ የሚጽፈውን ይዘት ያመለክታል፤ ይህ አተረጓጎም በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: δὲ
  choice: ደግሞ
  rationale: እዚህ ላይ ጠንካራ ተቃርኖን ሳይሆን ረጋ ያለ የንግግር ሽግግርን ያሳያል።
- source_word: γράφω ὑμῖν
  choice: ለእናንተ የምጽፈው
  rationale: የአሁን ጊዜውን ግስና የደብዳቤውን ተቀባዮች በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: ቃሉ የሚሰጠውን የተከበረና አጽንዖታዊ ኃይል በቀጥታ ይጠብቃል።
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: በእግዚአብሔር ፊት
  rationale: ተናጋሪው በእግዚአብሔር ፊት ተጠያቂ መሆኑን የሚገልጠውን ክቡርና ፍርዳዊ ድምፀት ይጠብቃል።
- source_word: οὐ ψεύδομαι
  choice: አልዋሽም
  rationale: የጳውሎስን ቀጥተኛና አጽንዖታዊ የሐሰት ክህደት በአጭር ዘመናዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: ጳውሎስ እግዚአብሔርን የጠራበት ንግግር ኃይል
  choice: ንግግሩ ጳውሎስ በእግዚአብሔር ፊት ተጠያቂ ሆኖ እውነቱን እንደሚናገር በክብደት የሚያረጋግጥ ሆኖ ተተርጉሟል።
  alternative: እንደ ተራ ማጠናከሪያ ብቻ መውሰድ፣ ወይም በግሪክ ጽሑፉ ከተገለጠው በላይ መደበኛ መሐላ አድርጎ መተርጎም።
  rationale: ἐνώπιον τοῦ θεοῦ ለእውነት የቀረበ ክቡር ማረጋገጫና በእግዚአብሔር ፊት ያለ ተጠያቂነትን ያመለክታል፤ ነገር ግን ጽሑፉ በግልጽ ያልጠቀሰውን የመሐላ ቀመር አልተጨመረም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ሰረዙ ἰδοὺ የሚያመጣውን ድንገተኛ አጽንዖት ያጎላል።
