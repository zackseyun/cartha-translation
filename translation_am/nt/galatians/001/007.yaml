id: GAL.1.7
reference: Galatians 1:7
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὃ οὐκ ἔστιν ἄλλο· εἰ μή τινές εἰσιν οἱ ταράσσοντες ὑμᾶς καὶ θέλοντες μεταστρέψαι τὸ εὐαγγέλιον τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/007.yaml
  text: which is not another gospel[b][a]; except that there are some who are troubling you and wanting to distort the gospel of Messiah.
translation:
  language: am
  text: ይህም ሌላ ወንጌል አይደለም፤ የሚያውኳችሁና የመሲሑን[a] ወንጌል ሊያጣምሙ[b] የሚፈልጉ አንዳንዶች አሉ እንጂ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የክርስቶስን»።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «ሊያበላሹ»።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο
  choice: ሌላ ወንጌል
  rationale: በግሪክ ጽሑፉ ἄλλο ብቻውን ቢቆምም፣ ከቁጥር 6 የሚታወቀው ስም ‘ወንጌል’ ነው፤ ስለዚህ ለአማርኛ ግልጽነት ስሙ ተጨምሯል።
- source_word: εἰ μή
  choice: … አሉ እንጂ
  rationale: ይህ አገላለጽ ጥብቅ ሁኔታን ሳይሆን ማብራሪያዊ ልዩ ሁኔታን ያስገባል፤ ‘እንጂ’ ይህን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ταράσσοντες
  choice: የሚያውኳችሁ
  rationale: ቃሉ ማወክን፣ መረበሽንና ግራ ማጋባትን ያመለክታል፤ ‘የሚያውኳችሁ’ የድርጊቱን ኃይል በአጭርና ተፈጥሯዊ መንገድ ይጠብቃል።
- source_word: θέλοντες
  choice: የሚፈልጉ
  rationale: የሰዎቹን ፍላጎትና ዓላማ ሳያጋንን በቀጥታ ይገልጣል።
- source_word: μεταστρέψαι
  choice: ሊያጣምሙ
  rationale: ግሱ አንድን ነገር ከትክክለኛ ቅርጹ ወደ ተበላሸ ወይም ተቃራኒ ቅርጽ መለወጥን ያመለክታል፤ ‘ማጣመም’ ይህን በዘመናዊና ግልጽ አማርኛ ያስተላልፋል።
- source_word: εὐαγγέλιον
  choice: ወንጌል
  rationale: ‘ወንጌል’ በአማርኛ የተለመደና በጳውሎስ አጠቃቀም ያለውን ልዩ ሃይማኖታዊ ክብደት የሚጠብቅ ቃል ነው።
- source_word: Χριστοῦ
  choice: የመሲሑን
  rationale: Χριστός እዚህ የቅቡዕ ንጉሥ ማዕረግን እንደያዘ በመቁጠር ‘መሲሕ’ ተመርጧል፤ የግሪኩ የባለቤትነት ቅርጽ በ‘የ…ን’ ተገልጧል።
theological_decisions:
- issue: Χριστοῦ እንደ ማዕረግ ወይም እንደ ስም መተርጎም
  choice: የመሲሑን
  alternative: የክርስቶስን
  rationale: ሐረጉ ከኢየሱስ መሲሐዊ ሥልጣንና ተግባር ጋር የተያያዘውን ወንጌል ያመለክታል። ‘መሲሑ’ የማዕረጉን ኃይል በግልጽ ይጠብቃል፤ ‘ክርስቶስ’ የሚለው የተለመደ አማራጭ በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ቀላል የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ አንጻራዊ መዋቅር ከቀደመው ቁጥር ጋር ያለውን ትስስር ለማቆየት ‘ይህም’ ተብሎ ተጀምሯል።
