translation_notes:
  register: ዘመናዊ፣ ክቡርና በቀላሉ የሚገባ የትረካ ቋንቋ ተጠቅሟል። ‘ሶርያና ኪልቅያ’ የሁለቱን ስፍራዎች ግንኙነት በተፈጥሯዊ አማርኛ ያቀርባል፤ ሁለተኛው ‘ወደ’ ግልጽነትን ይጨምራል። የእንግሊዝኛው የ‘into/to’ እና ‘regions/districts’ ማስታወሻዎች በአማርኛ ዋናው ንባብ ውስጥ በተፈጥሮ ስለተዋሃዱ ያለአስፈላጊነት አልተደገሙም።
