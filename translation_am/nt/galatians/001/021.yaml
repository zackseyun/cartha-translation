  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπειτα
  choice: ከዚያም
  rationale: በጳውሎስ ትረካ ውስጥ የድርጊቶቹን ቅደም ተከተል በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: ἦλθον
  choice: ሄድኩ
  rationale: የግሪኩ ግስ በቀጥታ ‘መጣሁ’ ሊባል ቢችልም፣ ከቀድሞው ስፍራ ወደ ተጠቀሱት አካባቢዎች የተደረገውን ጉዞ በአማርኛ ‘ሄድኩ’ በተፈጥሮ ይገልጣል።
- source_word: εἰς
  choice: ወደ
  rationale: ወደ መዳረሻ የሚደረግን እንቅስቃሴ በተፈጥሯዊ አማርኛ ያሳያል፤ ‘ወደ … ውስጥ’ ከማለት ይልቅ ከአካባቢ ስሞች ጋር ይበልጥ ለስላሳ ነው።
- source_word: κλίματα
  choice: አውራጃዎች
  rationale: ቃሉ አንዲትን ከተማ ሳይሆን ጂኦግራፊያዊ ክልሎችን ወይም አካባቢዎችን ያመለክታል፤ ‘አውራጃዎች’ የብዙ ቁጥሩንና የክልል ትርጉሙን ያስጠብቃል።
- source_word: Συρίας
  choice: ሶርያ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደ የቦታው ስም ነው።
- source_word: Κιλικίας
  choice: ኪልቅያ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደ የቦታው ስም ነው።
