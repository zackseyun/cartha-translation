  yaml_path: translation/nt/galatians/001/016.yaml
  text: to reveal his Son in me[a], so that I might proclaim him among the Gentiles, I did not immediately consult with flesh and blood[b],
translation:
  language: am
  text: 'ልጁን በእኔ[a] እንዲገልጥ እና እኔም በአሕዛብ መካከል እርሱን የምሥራች እንዳበስር፣ ወዲያውኑ ሥጋና ደምን[b] አላማከርኩም።


    [a] ወይም፣ “ለእኔ” ወይም “በእኔ በኩል”።


    [b] “ሥጋና ደም” ማለት ሰውን ወይም ሰዎችን የሚያመለክት ፈሊጣዊ አነጋገር ነው።'
  philosophy: optimal-equivalence
  footnotes:
