- source_word: υἱὸν αὐτοῦ
  choice: ልጁን
  rationale: የግሪኩን የዝምድና ማዕረግና ክርስቶሳዊ ክብደት ያለ ማስፋፋት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐν ἐμοὶ
  choice: በእኔ ውስጥ
  rationale: ἐν የሚለውን መሠረታዊ የ‘ውስጥ’ ትርጉም በመጠበቅ፣ ውስጣዊ መገለጥ፣ ለጳውሎስ መገለጥ፣ ወይም በእርሱ በኩል መገለጥ የሚሉትን አማራጮች ሳይዘጋ ያቆያል።
- source_word: ἵνα εὐαγγελίζωμαι αὐτὸν
  choice: እኔም … እርሱን የምሥራች እንዳበስር
  rationale: εὐαγγελίζω የምሥራችን ማብሰር ሲሆን፣ αὐτόν ቀጥተኛ ተሳቢ መሆኑን ‘እርሱን’ በማለት ይጠብቃል፤ ስለ ልጁ መልእክት ብቻ ሳይሆን ልጁ ራሱ የአዋጁ ይዘት መሆኑን አያደበዝዝም።
- source_word: ἐν τοῖς ἔθνεσιν
  choice: በአሕዛብ መካከል
  rationale: በጳውሎስ ዐውድ ἔθνη በተለምዶ አይሁድ ያልሆኑትን ሕዝቦች ያመለክታል፤ ‘አሕዛብ’ ይህን ልዩነት በአጭር ይገልጣል።
- source_word: εὐθέως
  choice: ወዲያውኑ
  rationale: የግሪኩን የፈጣን ጊዜ ምልክት በተፈጥሯዊና ግልጽ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: οὐ προσανεθέμην
  choice: አላማከርኩም
  rationale: የመካከር፣ ከሌሎች ጋር የመነጋገር ወይም ምክር የመጠየቅ ሐሳብን በቀጥታ ያስተላልፋል።
- source_word: σαρκὶ καὶ αἵματι
  choice: ሥጋና ደምን
  rationale: የጳውሎስን ሕያው ፈሊጥ በዋናው ጽሑፍ ይጠብቃል፤ ሰውን ወይም ሰዎችን ማመልከቱ በግርጌ ማስታወሻ ተብራርቷል።
theological_decisions:
- issue: ἐν ἐμοὶ ከልጁ መገለጥ ጋር ያለው ግንኙነት
  choice: በዋናው ጽሑፍ ‘በእኔ ውስጥ’ የሚለውን ቀጥተኛና አሻሚ አተረጓጎም ማቆየት
  alternative: ‘ለእኔ’ ወይም ‘በእኔ በኩል’
  rationale: ሐረጉ ውስጣዊ መገለጥን፣ ለጳውሎስ መገለጥን፣ ወይም ለተልእኮ በጳውሎስ በኩል መገለጥን ሊያመለክት ይችላል። ትርጉሙ አንዱን ብቻ በመምረጥ የጽሑፉን ውጥረት አያስወግድም።
