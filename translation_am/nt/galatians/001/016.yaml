  - marker: b
    text: “ሥጋና ደም” ማለት ሰውን ወይም ሰዎችን የሚያመለክት ፈሊጣዊ አነጋገር ነው።
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκαλύψαι
