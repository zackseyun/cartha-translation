    issue: The main text adds ‘በወደደ ጊዜ’ (‘when he desired’).
    rationale: This wording derives from the preceding verse’s context, not from the supplied Greek text of Galatians 1:16. It should not be incorporated into this verse’s translated text.
  - severity: low
    issue: ‘በእኔ ውስጥ’ is more spatial than needed.
    rationale: ‘በእኔ’ better preserves ἐν ἐμοί in natural modern Amharic without deciding between inward, recipient, and instrumental nuances.
  - severity: low
    issue: Footnote a has punctuation inside the final quotation.
    rationale: Placing the sentence punctuation after the closing quotation mark makes the alternatives read more cleanly in Amharic.
