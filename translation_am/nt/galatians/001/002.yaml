lexical_decisions:
- source_word: καὶ οἱ σὺν ἐμοὶ πάντες ἀδελφοί
  choice: ከእኔም ጋር ያሉት ወንድሞች ሁሉ
  rationale: καὶ ከቀደመው ቁጥር ጋር ያለውን ቀጣይነት በ«-ም» ያሳያል። ἀδελφοί በሰዋስው የወንድ ፆታ ብዙ ቁጥር ስለሆነ «ወንድሞች» ተብሎ ተተርጉሟል፤ ሁለቱንም ፆታዎች ሊያካትት የሚችለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ἐκκλησίαις
  choice: ቤተ ክርስቲያናት
  rationale: በጳውሎስ የደብዳቤ አድራሻዎች ἐκκλησία በተፈጥሯዊና በተለመደው የአማርኛ አጠቃቀም «ቤተ ክርስቲያን» ነው፤ የብዙ ቁጥሩም በግልጽ ሁኔታ ተጠብቋል።
- source_word: τῆς Γαλατίας
  choice: የገላትያ
  rationale: የግሪክኛውን የባለቤትነት አገባብ በቀጥታ የሚያንጸባርቅና በአማርኛ ተፈጥሯዊ የሆነ አገላለጽ ነው። በዋናው ጽሑፍ ግን ከ«ለ» ጋር «ለገላትያ ቤተ ክርስቲያናት» ተብሎ ለተፈጥሯዊ የደብዳቤ አድራሻ ተዋቅሯል።
