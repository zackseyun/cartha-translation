base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/018.yaml
  text: Then after three years I went up to Jerusalem to visit Cephas[b][a], and I stayed with him fifteen days.
translation:
  language: am
  text: ከዚያም ከሦስት ዓመታት በኋላ ከኬፋ[a] ጋር ለመተዋወቅ[b] ወደ ኢየሩሳሌም ወጣሁ፤ ከእርሱም ጋር ለአሥራ አምስት ቀናት ቆየሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ኬፋ የጴጥሮስ የአራማይክ ስም ነው።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ “ኬፋን ለመጎብኘት።” የግሪክኛው ግስ አንድን ሰው በአካል ተገናኝቶ የመተዋወቅንም ሐሳብ ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔπειτα
  choice: ከዚያም
  rationale: በጳውሎስ ትረካ ውስጥ የሚቀጥለውን ክስተት በተፈጥሯዊ ዘመናዊ አማርኛ ያመለክታል።
- source_word: μετὰ ἔτη τρία
  choice: ከሦስት ዓመት በኋላ
