- source_word: ἀνῆλθον
  choice: ወጣሁ
  rationale: ወደ ኢየሩሳሌም መሄድን እንደ ‘መውጣት’ የሚገልጸውን የምንጩን አቅጣጫዊ ልዩነት ይጠብቃል።
- source_word: Ἱεροσόλυμα
  choice: ኢየሩሳሌም
  rationale: በዘመናዊ አማርኛ የተለመደው የቦታው ስም ነው።
- source_word: ἱστορῆσαι
