  text: And I was advancing in Judaism beyond many of my contemporaries among my people[b][a], being far more zealous for the traditions of my fathers.
translation:
  language: am
  text: 'በወገኔ መካከል በዕድሜ እኩዮቼ ከሆኑት ብዙዎች ይልቅ በአይሁድነት[a] እየገሰገስሁ ነበር፤ ለአባቶቼ ወጎች እጅግ የበለጠ ቀናተኛ ሆኜ ነበር።


    [a] “በአይሁድነት” የሚለው “በአይሁድ ሃይማኖት” ወይም “በአይሁዳውያን አኗኗር” ተብሎም ሊተረጎም ይችላል።'
  philosophy: optimal-equivalence
  footnotes:
