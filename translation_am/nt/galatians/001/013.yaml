  choice: ላጠፋትም እጥር ነበር
  alternative: አወድማት ነበር
  rationale: ግሱ የኃይለኛ ውድመት ሐሳብ ቢኖረውም ኢምፐርፌክቱ ቀጣይ ጥረትን ሊያሳይ ይችላል። የቤተ ክርስቲያኗ ፍጹም መጥፋት እንደተፈጸመ ሳይገልጽ የግሪኩን ኃይልና አሻሚነት ለመጠበቅ ይህ አገላለጽ ተመርጧል።
