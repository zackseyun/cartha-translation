  rationale: ጽሑፉ ራሱ ጠንካራና ፍርዳዊ ነው። የተመረጠው አገላለጽ ይህን ክብደት ሳያሳንስ፣ በኋላ የተፈጠረ ልዩ ቤተ ክርስቲያናዊ ትርጉም አያስገባም።
