source:
  edition: SBLGNT
  text: οὐδὲ ἀνῆλθον εἰς Ἱεροσόλυμα πρὸς τοὺς πρὸ ἐμοῦ ἀποστόλους, ἀλλὰ ἀπῆλθον εἰς Ἀραβίαν, καὶ πάλιν ὑπέστρεψα εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/017.yaml
  text: Nor did I go up to Jerusalem to those who were apostles before me, but I went away to Arabia, and returned again to Damascus.
translation:
  language: am
  text: እንዲሁም ወደ ኢየሩሳሌም፣ ከእኔ በፊት ሐዋርያት ወደ ሆኑት ዘንድ አልወጣሁም፤ ይልቁንም ወደ ዐረቢያ ሄድኩ፤ ከዚያም እንደገና ወደ ደማስቆ ተመለስኩ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ
  choice: አልወጣሁም
  rationale: ከቀደመው አሉታዊ አሳብ ጋር ያለውን ትስስር በአማርኛው የአሉታ ግስ እና «-ም» ያስተላልፋሉ።
- source_word: ἀνῆλθον
  choice: ወደ ኢየሩሳሌም አልወጣሁም
  rationale: ወደ ኢየሩሳሌም መጓዝን «መውጣት» ብሎ መግለጽ የምንጩን ጂኦግራፊያዊና ልማዳዊ አጠቃቀም ይጠብቃል።
- source_word: πρὸς τοὺς πρὸ ἐμοῦ ἀποστόλους
  choice: ከእኔም በፊት ሐዋርያት የነበሩትን ለማግኘት
  rationale: «ከእኔ በፊት» የጊዜ ቀዳሚነትን ይጠብቃል፤ «ለማግኘት» ደግሞ πρός በዚህ የጉዞ አውድ ያለውን ወደ ሰዎች መቅረብ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἀλλὰ
  choice: ይልቁንም
  rationale: ወደ ኢየሩሳሌም አለመሄዱን ከወደ ዐረቢያ መሄዱ ጋር ያለውን ግልጽ ተቃርኖ ያሳያል።
- source_word: ἀπῆλθον εἰς Ἀραβίαν
  choice: ወደ ዐረቢያ ሄድኩ
  rationale: የመነሳትን አነስተኛ ስሜት በአማርኛ በግድ መድገም ሳያስፈልግ፣ መዳረሻውንና ዋናውን የጉዞ ትርጉም በተፈጥሯዊ ቋንቋ ይገልጻል።
- source_word: πάλιν ὑπέστρεψα εἰς Δαμασκόν
  choice: ከዚያም እንደገና ወደ ደማስቆ ተመለስኩ
  rationale: «እንደገና» የπάλινን ድግግሞሽ ሲጠብቅ፣ «ተመለስኩ» የὑποστρέφωን የመመለስ እንቅስቃሴ በግልጽ ያቀርባል።
theological_decisions:
- issue: «ከእኔ በፊት» የሚለው ሐዋርያትን በምን አንጻር እንደሚገልጽ
  choice: ከጳውሎስ በፊት ሐዋርያት የነበሩ፣ ማለትም የጊዜ ቀዳሚነት
  alternative: ከጳውሎስ በሥልጣን ወይም በማዕረግ የበለጡ
  rationale: πρὸ ἐμοῦ በተፈጥሮው የጊዜ ቀዳሚነትን ያመለክታል፤ ትርጉሙም ጥቅሱ ያልተናገረውን የሥልጣን ተዋረድ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «ሐዋርያት»፣ «ኢየሩሳሌም»፣ «ዐረቢያ» እና «ደማስቆ» የተለመዱ የመጽሐፍ ቅዱስ ቅርጾች ናቸው።
