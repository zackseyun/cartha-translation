base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/009.yaml
  text: 'As we have said before[a], so now I say again: if anyone is preaching a gospel to you contrary to what you received[b], let him be accursed.'
translation:
  language: am
  text: አስቀድመን እንደተናገርነው፣ አሁንም ደግሜ እላለሁ፤ ማንም እናንተ ከተቀበላችሁት በተቃራኒ የሆነ ወንጌል ቢሰብክላችሁ፣ የተረገመ ይሁን።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ወይም፣ “በእርግማን ሥር ይሁን”፤ በግሪክ፦ ἀνάθεμα ἔστω።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς προειρήκαμεν
  choice: አስቀድመን እንደተናገርነው
  rationale: የቀድሞውን ንግግርና አሁንም ያለውን ተግባራዊ ክብደት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἄρτι πάλιν λέγω
  choice: አሁንም ደግሜ እላለሁ
  rationale: ἄρτι የአሁኑን ጊዜ፣ πάλιν ደግሞ የንግግሩን መደገም ያመለክታሉ፤ ምርጫው ሁለቱንም ይጠብቃል።
- source_word: εἴ τις ὑμᾶς εὐαγγελίζεται
  choice: ማንም … ወንጌል ቢሰብክላችሁ
  rationale: ግሱ መልካም ዜናን ማወጅ ማለት ቢሆንም፣ በገላትያ ዐውድ የወንጌልን መልእክት ያመለክታል፤ ይህ አተረጓጎም የግሱን ኃይልና የንጽጽሩን ትኩረት ይጠብቃል።
- source_word: παρ’ ὃ
  choice: ከ… የተለየ
  rationale: παρά በዚህ ዐውድ ከተቀበሉት መልእክት መዛባትን ያሳያል፤ ‘የተለየ’ በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን የሐረጉን አሉታዊ ንጽጽር ይገልጣል። ‘ካለፈ’ የሚለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: παρελάβετε
  choice: ከተቀበላችሁት
  rationale: παραλαμβάνω አንድን የተላለፈ መልእክት መቀበልን ያመለክታል፤ ‘ተቀበላችሁ’ ትክክለኛና የተለመደ አቻ ነው።
- source_word: ἀνάθεμα ἔστω
  choice: የተረገመ ይሁን
  rationale: ἀνάθεμα በእርግማን ሥር መሆንንና ለጥፋት መለየትን የሚያመለክት ከባድ ፍርዳዊ ቃል ነው፤ ምርጫው ይህን ክብደት ያለ ተጨማሪ የአስተምህሮ ማብራሪያ ያስተላልፋል።
theological_decisions:
- issue: በἀνάθεμα ἔστω ያለው የጳውሎስ ፍርድ ኃይል
  choice: የተረገመ ይሁን
  alternative: በእርግማን ሥር ይሁን
  rationale: ዋናው ጽሑፍ የግሪኩን ከባድ ማስጠንቀቂያ ይጠብቃል፣ ነገር ግን ግሪኩ በግልጽ ያልጠቀሰውን ተጨማሪ የአስተምህሮ ዝርዝር አያስገባም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። የምንጭ ጽሑፉ ቁጥር የሌለውን ‘ማንም’ በፆታ-ገለልተኛ መልኩ ተርጉሟል። በቀረበው የእንግሊዝኛ ንባብ የማስታወሻዎቹ ምልክቶች ከይዘታቸው ጋር ተቀያይረው ስለታዩ፣ [a] ከπαρ’ ὃ ጋር፣ [b] ደግሞ ከἀνάθεμα ἔστω ጋር እንዲዛመዱ ተቀምጠዋል።
