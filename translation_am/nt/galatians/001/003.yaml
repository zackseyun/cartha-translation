  rationale: የጸጋና የሰላም ምንጭን በግልጽ ያመለክታል።
- source_word: θεοῦ πατρός
  choice: ከአባታችን ከእግዚአብሔር
  rationale: ἡμῶνን ከπατρός ጋር በመያዝ ‘እግዚአብሔር አባታችን’ የሚለውን ግንኙነት በተፈጥሯዊና በክብር ያቀርባል።
- source_word: κυρίου ἡμῶν
  choice: ከጌታችን
  rationale: κύριος የሚያመለክተውን የጌትነት ማዕረግና ἡμῶν የሚገልጸውን ግንኙነት ይጠብቃል።
- source_word: Ἰησοῦ Χριστοῦ
  choice: ከኢየሱስ መሲሕ
  rationale: Χριστός እዚህ የቅቡዕነት ማዕረጉን ስለሚይዝ ‘መሲሕ’ ተብሎ ተተርጉሟል፤ ባህላዊው ‘ክርስቶስ’ በማስታወሻ ቀርቧል።
theological_decisions:
- issue: Χριστοῦ እንደ ተተረጎመ ማዕረግ ወይስ እንደ ባህላዊው ‘ክርስቶስ’ መቅረቡ
  choice: ኢየሱስ መሲሕ
  alternative: ኢየሱስ ክርስቶስ
  rationale: በዚህ ሰላምታ Χριστός ሙሉ በሙሉ የግል ስም ብቻ ሆኖ ሳይቀር የቅቡዕነት ማዕረጉን ይዟል፤ ስለዚህ ‘መሲሕ’ በዋናው ጽሑፍ፣ የተለመደው አማራጭ ደግሞ በማስታወሻ ቀርቧል።
