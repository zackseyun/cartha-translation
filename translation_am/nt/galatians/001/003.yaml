  - marker: b
    text: በግሪኩ ጽሑፍ ላይ “እና ጌታችን” የሚለው ክፍል እርግጠኛ አይደለም፤ አንዳንድ የእጅ ጽሑፎች በዚህ ቦታ ይለያያሉ።
