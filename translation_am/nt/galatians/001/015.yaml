- source_word: ὁ ἀφορίσας με
  choice: የለየኝ … እርሱ
  rationale: የግሪኩን በመስተዋድድ የተጠቀሰ አድራጊ በተፈጥሯዊ አማርኛ ይገልጣል፤ «ለየኝ» ለተለየ ዓላማ መለየትን ያሳያል እንጂ «መረጠኝ» ወይም «ሾመኝ» የሚል ተጨማሪ ትርጓሜ አያስገባም።
- source_word: ἐκ κοιλίας μητρός μου
  choice: ከእናቴ ማኅፀን ጀምሮ
  rationale: የግሪኩን ግልጽ የማኅፀን ምስልና የነቢያት ጥሪ አነጋገር ይጠብቃል።
- source_word: καλέσας
