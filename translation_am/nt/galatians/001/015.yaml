  choice: የለየኝ
  alternative: የመረጠኝ፤ የሾመኝ
  rationale: ግሪኩ ለተለየ ዓላማ የመለየትን ሐሳብ ይደግፋል፣ በተለይም ከነቢያዊ ጥሪ አነጋገር ጋር፤ ሆኖም የተወሰነ ሥርዓተ እምነታዊ ትርጓሜ አያስገድድም።
