- source_word: διὰ τῆς χάριτος αὐτοῦ
  choice: በጸጋው
  rationale: διά ከዝርያ ቅጽ ጋር ያለውን የመንገድ/የአማካይነት ሐሳብ በተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
