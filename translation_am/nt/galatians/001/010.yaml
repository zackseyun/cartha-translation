base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/010.yaml
  text: For am I now persuading people[a], or God? Or am I seeking to please people? If I were still pleasing people[b], I would not be Messiah’s servant.
translation:
  language: am
  text: ምክንያቱም አሁን ሰዎችን ነው የማሳምነው ወይስ እግዚአብሔርን?[a] ወይስ ሰዎችን ደስ ለማሰኘት እፈልጋለሁ? አሁንም ሰዎችን ደስ እያሰኘሁ ብሆን ኖሮ፣ የመሲሑ ባሪያ[b] ባልሆን ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «አሁን የሰዎችን ይሁንታ ነው የምፈልገው ወይስ የእግዚአብሔርን?»
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «የመሲሑ አገልጋይ»።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρτι γὰρ
  choice: ታዲያ አሁን
  rationale: Ἄρτι የአሁኑን ሁኔታ ያመለክታል፤ γὰρ ደግሞ ከቀደመው ክርክር ጋር ያለውን ምክንያታዊ ትስስር በተፈጥሯዊው «ታዲያ» ያሳያል።
- source_word: πείθω
  choice: የማሳምነው
  rationale: የግሱን መሠረታዊ «ማሳመን» ትርጉም ይጠብቃል፤ እግዚአብሔርን ስለማሳመን የቀረበውን ሆን ተብሎ የተጠቀመ አሻሚ ንጽጽርም አያስወግድም።
- source_word: ἀνθρώπους
  choice: ሰዎችን
  rationale: ወንዶችን ብቻ ሳይሆን ሰዎችን በአጠቃላይ ያመለክታል።
- source_word: ζητῶ
  choice: እፈልጋለሁ
  rationale: በዐውዱ ውስጥ ግብን ወይም ዓላማን መሻትን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: ἀρέσκειν / ἤρεσκον
  choice: ደስ ለማሰኘት / ደስ የማሰኝ
  rationale: የሌሎችን ውዴታና ሞገስ ለማግኘት መፈለግን በተለመደና ግልጽ አማርኛ ያስተላልፋል።
- source_word: εἰ ἔτι
  choice: አሁንም ... ብሆን ኖሮ
  rationale: ἔτι ያለፈ ልማድ እስከአሁን መቀጠሉን ያመለክታል፤ የአማርኛው አወቃቀርም እውን ያልሆነውን ሁኔታዊ ንግግር ያሳያል።
- source_word: Χριστοῦ
  choice: የመሲሑ
  rationale: Χριστός እዚህ ላይ የቅቡዕ ንጉሥ ማዕረግን ይዞ ስለቀረበ፣ «መሲሕ» የሚለው የማዕረጉን ትርጉም በግልጽ ያቆያል።
- source_word: δοῦλος
  choice: ባሪያ
  rationale: ቃሉ ከተራ አገልጋይነት ይልቅ ሙሉ ባለቤትነትንና ታማኝነትን የሚያጎላ ስለሆነ «ባሪያ» ጥንካሬውን ይጠብቃል።
theological_decisions:
- issue: πείθω ከእግዚአብሔር ጋር ሲገናኝ ያለው አሻሚነት
  choice: «ሰዎችን ... ማሳመን ወይስ እግዚአብሔርን?» በማለት ቀጥተኛውን ንጽጽር ማቆየት
  alternative: «የሰዎችን ይሁንታ ነው የምፈልገው ወይስ የእግዚአብሔርን?»
  rationale: የግሪኩ ግስ «ማሳመን» ሊል ወይም በዐውዱ «ይሁንታን ማግኘት» ሊያመለክት ይችላል። ዋናው ጽሑፍ ቀጥተኛውን የቃል ኃይል ያቆያል፤ አማራጩ በማስታወሻ ቀርቧል።
- issue: Χριστοῦ δοῦλος አተረጓጎም
  choice: የመሲሑ ባሪያ
  alternative: የክርስቶስ አገልጋይ
  rationale: ንጽጽሩ ሰዎችን ከማስደሰት ይልቅ ለመሲሑ ሙሉ በሙሉ መገዛትን ያጎላል። «ባሪያ» የδοῦλοςን ጥንካሬ፣ «መሲሕ» ደግሞ የΧριστόςን ማዕረጋዊ ስሜት ይጠብቃሉ።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ይጠቀማል። የጥያቄዎቹ የክርክር ኃይል ተጠብቋል፤ የπείθω አሻሚነት በዋናው ጽሑፍና በማስታወሻው አብሮ ቀርቧል።
