  text: ታዲያ ሕጉ ለምን ተሰጠ? የተስፋው ቃል የተገባለት ዘር[a] እስኪመጣ ድረስ፣ በመተላለፎች ምክንያት[b] ተጨመረ፤ በመላእክት አማካይነት በአማካይ እጅ ተደነገገ[c]።
