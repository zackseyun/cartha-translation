  choice: በመላእክት አማካይነት በአስታራቂ እጅ ተደነገገ
  rationale: διαταγεὶς መደንገግን ወይም በሥርዓት ማዘጋጀትን ያመለክታል፤ «በ...እጅ» ደግሞ የግሪኩን ተጨባጭ አነጋገርና የአማካይነት ሐሳብ ይጠብቃል።
