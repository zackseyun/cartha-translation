- source_word: ᾧ ἐπήγγελται
  choice: የተስፋው ቃል የተነገረለት
  rationale: የፍጹም ጊዜውን ቀድሞ የተደረገና ጸንቶ የሚኖር ተስፋ ይገልጣል፤ የተስፋ ቃል በዐውዱ ግልጽ ነው።
