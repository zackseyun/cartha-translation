    text: ወይም፣ «ተወላጅ» ወይም «የዘር ሐረግ አባል»።
    reason: lexical_alternative
  - marker: b
    text: «በመተላለፎች ምክንያት» የሚለው፣ መተላለፎችን ለመቋቋም፣ ለማጋለጥ ወይም ለመግታት ማለት ሊሆን ይችላል፤ ግሪኩ ከዚህ የበለጠ አይወስንም።
