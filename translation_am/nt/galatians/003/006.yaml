revisions:
- from: እንዲሁም አብርሃም እግዚአብሔርን አመነ፤ ይህም ለእርሱ እንደ ጽድቅ[a] ተቈጠረለት፣
  to: አብርሃም እግዚአብሔርን እንዳመነ፣ ይህም ለእርሱ እንደ ጽድቅ[a] ተቆጠረ፣
  rationale: The revision restores the comparative meaning of καθὼς, streamlines the Amharic recipient construction without changing the passive accounting metaphor, and retains both the Pauline default term ጽድቅ and the lexical-alternative footnote. The trailing comma is retained because the construction continues into the following verse.
