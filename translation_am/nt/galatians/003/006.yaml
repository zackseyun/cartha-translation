  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καθὼς Ἀβραὰμ ἐπίστευσεν τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/006.yaml
  text: Just as Abraham believed God[a], and it was counted to him as righteousness,
translation:
  language: am
  text: አብርሃም እግዚአብሔርን እንዳመነ፣ ይህም ለእርሱ እንደ ጽድቅ[a] ተቆጠረ፣
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ «ፍትሕ»።
    reason: δικαιοσύνη የሚለው ቃል በዚህ አውድ ‘ጽድቅ’ ወይም ‘ፍትሕ’ ሊተረጎም ስለሚችል፣ የቃላዊ አማራጩን ለመጠበቅ።
lexical_decisions:
- source_word: καθὼς
  choice: እንዲሁም
  rationale: ከቀጣዩ የአብርሃም ምሳሌ ጋር የሚያያይዘውን የንጽጽር ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: Ἀβραὰμ
  choice: አብርሃም
  rationale: በአማርኛ የመጽሐፍ ቅዱስ ወግ የተለመደው የስሙ ቅርጽ ነው።
- source_word: ἐπίστευσεν τῷ θεῷ
  choice: እግዚአብሔርን አመነ
  rationale: የግሪኩን ዳቲቭ አገባብ እግዚአብሔር የተናገረውን እውነት አድርጎ መቀበልን በሚገልጽ መንገድ ያቀርባል፤ ‘በእግዚአብሔር አመነ’ ብሎ የማመንን ነገር በትርጓሜ አያሰፋም።
- source_word: ἐλογίσθη αὐτῷ
  choice: ለእርሱ … ተቈጠረለት
  rationale: የλογίζομαιን ተገብሮ የሂሳብና የደረጃ መመደብ ገጽታ ይጠብቃል። ድርብ የተጠቃሚ ምልክቱ በአማርኛ ተፈጥሯዊ ነው።
- source_word: εἰς δικαιοσύνην
  choice: እንደ ጽድቅ
  rationale: δικαιοσύνηን በጳውሎሳዊው አውድ የተለመደውን ‘ጽድቅ’ በመጠቀም ያስተላልፋል፤ εἰς የሚያሳየውን ውጤት ወይም የተቈጠረበትን ደረጃ ‘እንደ’ ይገልጻል።
theological_decisions:
- issue: በጳውሎሳዊ ጥቅስ δικαιοσύνηን መተርጎም
  choice: ጽድቅ
  alternative: ፍትሕ
  rationale: ‘ጽድቅ’ በዚህ አውድ የተቈጠረውን የቅንነት ደረጃ እና ከእግዚአብሔር ጋር ትክክለኛ አቋም የሚያመለክተውን የጳውሎስ ክርክር በተሻለ ሁኔታ ይገልጻል፤ ‘ፍትሕ’ የሚለው እውነተኛ የቃሉ አማራጭ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የመጨረሻው ሥርዓተ ነጥብ ሐረጉ ወደ ቀጣዩ ቁጥር እንደሚቀጥል ለማሳየት ሙሉ ነጥብ አይደለም።
