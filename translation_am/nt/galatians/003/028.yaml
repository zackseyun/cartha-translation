  text: οὐκ ἔνι Ἰουδαῖος οὐδὲ Ἕλλην, οὐκ ἔνι δοῦλος οὐδὲ ἐλεύθερος, οὐκ ἔνι ἄρσεν καὶ θῆλυ· ⸀πάντες γὰρ ὑμεῖς εἷς ἐστε ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/028.yaml
  text: There is no Jew or Greek[a], there is no servant or free, there is no male and female[b]; for you are all one in Messiah Jesus.
translation:
  language: am
  text: አይሁዳዊም ሆነ ግሪካዊ የለም፤ ባሪያም ሆነ ነጻ ሰው የለም፤ ወንድና ሴትም የለም[a]፤ ምክንያቱም እናንተ ሁላችሁ በመሲሑ ኢየሱስ[b] አንድ ናችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ግሪኩ ቃል በቃል “ወንድና ሴት” ይላል፤ ይህም ዘፍጥረት 1፥27ን የሚያስታውስ ሊሆን ይችላል። “ወንድም ሆነ ሴት የለም” ተብሎም ሊተረጎም ይችላል።
    reason: alternative_reading
  - marker: b
    text: ግሪኩ “በክርስቶስ ኢየሱስ” የሚል ነው፤ Χριστός እዚህ ማዕረግ ስለሆነ “በመሲሑ ኢየሱስ” ተብሎ ተተርጉሟል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔνι
  choice: የለም
  rationale: የሕልውና አሉታውን በተፈጥሯዊና አጭር አማርኛ ይገልጣል፤ ሦስት ጊዜ መደገሙም የጳውሎስን አጽንዖት ይጠብቃል።
- source_word: Ἰουδαῖος … Ἕλλην
  choice: አይሁዳዊም ሆነ ግሪካዊ
  rationale: የጽሑፉን የዘርና የሃይማኖት ንጽጽር ይጠብቃል፤ Ἕλλην የሚለውን ሰፋ አድርጎ ‘አሕዛብ’ ብሎ አይተረጉምም።
- source_word: δοῦλος … ἐλεύθερος
  choice: ባሪያም ሆነ ነጻ ሰው
  rationale: የታሰረ ማኅበራዊ ሁኔታንና የነጻነት ሁኔታን በግልጽ ያነጻጽራል።
- source_word: ἄρσεν καὶ θῆλυ
  choice: ወንድና ሴት
  rationale: የጾታ ቃላቱንና καὶ የሚለውን ‘እና’ በመጠበቅ ዘፍጥረት 1፥27ን ሊያስታውስ የሚችለውን አነጋገር ያቆያል።
- source_word: πάντες … ὑμεῖς
  choice: እናንተ ሁላችሁ
  rationale: የሁሉንም አካታችነትና የሁለተኛ መደብ ብዙ ቁጥር አጽንዖት ይጠብቃል።
- source_word: εἷς ἐστε
  choice: አንድ ናችሁ
  rationale: የጋራ አንድነትን ይገልጣል፤ ‘አንድ ሰው’ ወይም ‘ተባብራችኋል’ ብሎ ትርጉሙን አያሰፋም።
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: በመሲሑ ኢየሱስ
  rationale: ἐνን ‘በ’ ብሎ ይጠብቃል፤ Χριστόςንም እንደ ማዕረግ ‘መሲሑ’ ብሎ ያቀርባል።
theological_decisions:
- issue: ἄρσεν καὶ θῆλυ የሚለውን በተመሳሳይ አሉታዊ ጥምረት ማለስለስ ወይስ የግሪኩን ‘እና’ መጠበቅ
  choice: ወንድና ሴትም የለም
  alternative: ወንድም ሆነ ሴት የለም
  rationale: በቀደሙት ጥምረቶች οὐδὲ ቢኖርም እዚህ καὶ ተጠቅሟል። ‘እና’ን መጠበቅ የዘፍጥረት 1፥27 አስተጋብኦንና የጽሑፉን ውጥረት አያጠፋም።
- issue: εἷς ἐστεን በትርጓሜ ማስፋት
  choice: አንድ ናችሁ
  alternative: አንድ ሰው ናችሁ / ተባብራችኋል
  rationale: ጥቅሱ በመሲሑ ያለውን አንድነት ያረጋግጣል፤ ልዩነቶቹ ፈጽመው ጠፍተዋል የሚል ተጨማሪ ዶክትሪን አያስገባም።
- issue: Χριστόςን እንደ ስም ወይስ እንደ ማዕረግ መተርጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: በዚህ ሐረግ Χριστός የተቀባውን ንጉሥ የሚያመለክት ማዕረግ መሆኑን ‘መሲሑ’ በግልጽ ያሳያል።
