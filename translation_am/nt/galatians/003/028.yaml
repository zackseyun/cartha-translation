  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የሦስቱ ንጽጽሮች ትይዩ አወቃቀር ተጠብቋል፤ ሴሚኮሎኖቹም ክፍሎቹን በግልጽ ይለያሉ።
