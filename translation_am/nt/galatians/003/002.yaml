    text: ወይም፣ “በእምነት መስማት።” ሐረጉ “የእምነትን መልእክት በመስማት” ወይም “መልእክቱን በእምነት በመስማት” ማለት ሊሆን ይችላል።
    reason: alternative_reading
  - marker: b
    text: እዚህ “እምነት” በሚለው ፋንታ “ታማኝነት” የሚለው ፍቺ አነስተኛ ዕድል ቢኖረውም፣ የግሪኩ አገላለጽ የተጨመቀ ስለሆነ አንዳንድ ጊዜ ይነሣል።
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο μόνον
  choice: ይህን ብቻ
  rationale: የጳውሎስን አጽንዖት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: θέλω μαθεῖν ἀφ’ ὑμῶν
  choice: ከእናንተ ማወቅ እፈልጋለሁ
  rationale: μαθεῖν በዚህ ጥያቄያዊ አውድ ‘ማወቅ’ ተብሎ በተፈጥሯዊ አማርኛ ቀርቧል፤ ἀφ’ ὑμῶν የብዙ ቁጥር አድራሻውን ‘ከእናንተ’ በማለት ይጠብቃል።
- source_word: ἐξ ἔργων νόμου
  choice: ሕጉ የሚያዘውን ሥራ በመሥራት
  rationale: የግሪኩን አጭር አገላለጽ ለዘመናዊ አማርኛ አንባቢ ግልጽ አድርጎ፣ መንፈስን ለመቀበል መሠረት የሆነው የሕግ ሥራ ነውን የሚለውን ንጽጽር ይጠብቃል።
- source_word: τὸ πνεῦμα
  choice: መንፈስን
  rationale: በገላትያ 3 አውድ የሚያመለክተው ከእግዚአብሔር የተቀበሉትን መንፈስ ነው፤ በግሪኩ የሌለው ‘ቅዱስ’ የሚል ቃል አልተጨመረም።
- source_word: ἐλάβετε
  choice: የተቀበላችሁት
  rationale: የተፈጸመውን ያለፈ ተግባር እና የብዙ ቁጥር አድራሻን በተፈጥሯዊ የአማርኛ ጥያቄ ያቀርባል።
- source_word: ἐξ ἀκοῆς πίστεως
  choice: በእምነት በመስማት
  rationale: የግሪኩን የጄኒቲቭ ግንኙነት ሙሉ በሙሉ ሳይፈታ፣ ከሕግ ሥራ ጋር ያለውን የመንገድ ወይም የመሠረት ንጽጽር በተነባቢ አማርኛ ያሳያል።
- source_word: πίστεως
  choice: እምነት
  rationale: በዚህ አውድ ዋናውና ተፈጥሯዊው ትርጉም ‘እምነት’ ነው፤ ‘ታማኝነት’ የሚለው ያነሰ ዕድል ያለው ልዩነት በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: ‘መንፈስ’ የሚለው ማንን እንደሚያመለክት
  choice: ለአማኞች የተሰጠውን የእግዚአብሔር መንፈስ እንደሚያመለክት ተወስዷል።
  alternative: አጠቃላይ መንፈሳዊ ልምምድን ወይም ኃይልን እንደሚያመለክት ማንበብ።
  rationale: በገላትያ 3 ያለው ቅርብ አውድ የገላትያ አማኞች መንፈስን ስለ መቀበላቸው ይናገራል።
- issue: ἀκοῆς πίστεως የሚለው የተጨመቀ አገላለጽ
  choice: ‘በእምነት በመስማት’ ተብሎ ዋናው ጽሑፍ ላይ ቀርቧል።
  alternative: ‘እምነትን በመስማት’ ወይም ‘መልእክቱን በእምነት በመስማት’ ብሎ ማንበብ።
  rationale: የግሪኩ ሐረግ የመስማትና የእምነትን ግንኙነት በግልጽ አይወስንም፤ ዋናው ትርጉም ይህን አሻሚነት በተቻለ መጠን ጠብቆ፣ ሌሎቹን ንባቦች በማስታወሻ ያቀርባል።
