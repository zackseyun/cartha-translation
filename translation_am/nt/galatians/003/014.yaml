- issue: τοῦ πνεύματος የሚያመለክተው የዝምድና ዓይነት
  choice: የመንፈስን ተስፋ ቃል
  alternative: ተስፋ የተሰጠውን መንፈስ
  rationale: ዋናው ጽሑፍ የግሪኩን አሻሚ የዝምድና ቅርጽ ያቆያል፤ በዐውዱ የሚመረጠው ትርጓሜ ግን በማስታወሻ ቀርቧል።
