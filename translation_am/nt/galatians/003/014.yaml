lexical_decisions:
- source_word: ἵνα … ἵνα
  choice: እንዲደርስ፣ … እንድንቀበል ነው
  rationale: ሁለቱንም የዓላማ ሐረጎች በተፈጥሯዊ የአማርኛ አገባብ ያቆያል።
- source_word: εἰς τὰ ἔθνη
  choice: ለአሕዛብ
  rationale: በዐውዱ ያለውን የአይሁድና የአሕዛብ ንጽጽር በግልጽ ሁኔታ ያሳያል፤ ‘ለብሔራት’ የሚለው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ἡ εὐλογία τοῦ Ἀβραὰμ
  choice: የአብርሃም በረከት
  rationale: የግሪኩን የባለቤትነት ግንኙነትና ከአብርሃም ጋር የተያያዘውን በረከት በቀጥታ ይገልጻል።
- source_word: γένηται
  choice: እንዲደርስ
  rationale: ቃሉ በመሠረቱ ‘እንዲሆን/እንዲመጣ’ የሚል ቢሆንም፣ በረከቱ ወደ አሕዛብ መምጣቱን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: በመሲሑ ኢየሱስ
  rationale: Χριστός እዚህ የማዕረግ ኃይሉን ስለሚይዝ ‘መሲሕ’ ተብሎ ተተርጉሟል፤ የታወቀው ባህላዊ አቀራረብ በማስታወሻ ቀርቧል።
- source_word: τὴν ἐπαγγελίαν τοῦ πνεύματος
  choice: የመንፈስን ተስፋ ቃል
  rationale: የግሪኩን የዝምድና አገባብ ሳይፈታ ያቆያል፤ ትርጉሙ ‘ተስፋ የተሰጠው መንፈስ’ ሊሆን እንደሚችል በማስታወሻ ተገልጧል።
- source_word: λάβωμεν διὰ τῆς πίστεως
  choice: በእምነት እንድንቀበል
  rationale: የመቀበያውን መንገድ እምነት መሆኑንና የዓላማውን አገባብ ይጠብቃል።
theological_decisions:
- issue: Χριστῷ እንደ ማዕረግ ወይም እንደ ስም የሚመስል ቅጽ መተርጎም
  choice: በመሲሑ ኢየሱስ
  alternative: በክርስቶስ ኢየሱስ
