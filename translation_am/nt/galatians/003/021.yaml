  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩ የንግግር ጥያቄ፣ ጠንካራ እምቢታ፣ መላምታዊ ሁኔታ እና የመደምደሚያ አጽንዖት ተጠብቀዋል።
