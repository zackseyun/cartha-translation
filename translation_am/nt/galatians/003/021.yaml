  text: Ὁ οὖν νόμος κατὰ τῶν ἐπαγγελιῶν τοῦ θεοῦ; μὴ γένοιτο· εἰ γὰρ ἐδόθη νόμος ὁ δυνάμενος ζῳοποιῆσαι, ὄντως ⸂ἐκ νόμου ἂν⸃ ἦν ἡ δικαιοσύνη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/021.yaml
  text: Is the law then against the promises of God? May it never be! For if a law had been given that was able to give life[a], then righteousness really would have been from the law.
translation:
  language: am
  text: እንግዲህ ሕግ የእግዚአብሔርን ተስፋዎች የሚቃወም ነውን? ፈጽሞ አይደለም! ሕይወትን ሊሰጥ የሚችል ሕግ ተሰጥቶ ቢሆን ኖሮ፣ ጽድቅ[a] በእርግጥ ከሕግ የሚመጣ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ፍትሕ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: ሕግ
  rationale: የግሪኩን አጠቃላይ የሕግ ምድብ ይጠብቃል፤ በዐውዱ የሙሴ ሕግ ቢካተትም ያንን ብቻ እንዳያመለክት ያልተወሰነ አገላለጽ ተመርጧል።
- source_word: κατὰ
  choice: የሚቃወም
  rationale: ከጄኒቲቭ ጋር ያለውን የተቃውሞ ትርጉም በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐπαγγελιῶν
  choice: ተስፋዎች
  rationale: በግሪኩ ያለው ብዙ ቁጥር ተጠብቋል።
- source_word: μὴ γένοιτο
  choice: ፈጽሞ አይደለም!
  rationale: የጳውሎስን ጠንካራ የክህደት አገላለጽ በግልጽና በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἐδόθη
  choice: ተሰጥቶ ቢሆን ኖሮ
  rationale: በግሪኩ ያለውን ያልተፈጸመ መላምታዊ ሁኔታ በአማርኛ በተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: δυνάμενος
  choice: ሊሰጥ የሚችል
  rationale: ሕጉ ያለውን ወይም የሌለውን ችሎታ የሚያመለክተውን አሳብ ግልጽ ያደርጋል።
- source_word: ζῳοποιῆσαι
  choice: ሕይወትን ሊሰጥ
  rationale: ‘ሕያው ማድረግ’ የሚለውን መሠረታዊ ትርጉም በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ὄντως
  choice: በእርግጥ
  rationale: የመደምደሚያውን አጽንዖት በተለመደና ክብር ባለው አገላለጽ ያስተላልፋል።
- source_word: ἐκ νόμου
  choice: ከሕግ ይገኝ
  rationale: ἐκ የሚያሳየውን ምንጭ ወይም መነሻ በአማርኛ ግልጽ ያደርጋል፤ በሕግ መጠበቅ የሚል ዝርዝር ትርጓሜ አያስገባም።
- source_word: δικαιοσύνη
  choice: ጽድቅ
  rationale: በጳውሎሳዊው ክርክር የተለመደውንና ከእግዚአብሔር ፊት ትክክል መሆንን ሊያካትት የሚችለውን ቃል ይጠብቃል፤ ‘ፍትሕ’ የሚለው አማራጭ በማስታወሻ ተቀምጧል።
theological_decisions:
- issue: በጳውሎስ ክርክር ውስጥ δικαιοσύνη የሚለው ትርጉም
  choice: ጽድቅ
  alternative: ፍትሕ
  rationale: ዐውዱ ሕግ፣ ተስፋ እና ከእግዚአብሔር ፊት ትክክል መሆንን ያያይዛል፤ ‘ጽድቅ’ ይህን ክርክር በደንብ ይይዛል፣ ነገር ግን ‘ፍትሕ’ የሚለውን ተገቢ የቃሉ ስፋት ላለማጥፋት በግርጌ ማስታወሻ ተጠብቋል።
