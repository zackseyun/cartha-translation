  text: τῷ δὲ Ἀβραὰμ ἐρρέθησαν αἱ ἐπαγγελίαι καὶ τῷ σπέρματι αὐτοῦ· οὐ λέγει· Καὶ τοῖς σπέρμασιν, ὡς ἐπὶ πολλῶν, ἀλλ’ ὡς ἐφ’ ἑνός· Καὶ τῷ σπέρματί σου, ὅς ἐστιν Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/016.yaml
  text: The promises were spoken to Abraham and to his offspring[a]. It does not say, “And to offsprings,” as referring to many, but as referring to one[c][b], “And to your offspring,” who is Messiah.
translation:
  language: am
  text: ተስፋዎቹ ለአብርሃምና ለዘሩ[a] ተነገሩ። ብዙዎችን እንደሚያመለክት፣ “ለዘሮችም”[b] አይልም፤ ነገር ግን አንድን እንደሚያመለክት፣ “ለዘርህም” ይላል፤ እርሱም መሲሕ[c] ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በዚህ ቁጥር ሁሉ “ዘር” ተብሎ የተተረጎመው የግሪክኛው ቃል ነጠላ ቅርጽ ያለው፣ ብዙ ዘሮችንም በአንድነት ሊያመለክት የሚችል ስም ነው፤ ይህም ለጳውሎስ ክርክር ዋና ነጥብ ነው።
    reason: lexical_alternative
  - marker: b
    text: በግሪክኛ፣ “ለዘሮችም”፤ ጳውሎስ በቃሉ ነጠላና ብዙ ቁጥር መካከል ያለውን ልዩነት ያጎላል።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “ክርስቶስ።”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρρέθησαν
  choice: ተነገሩ
  rationale: የግሪክኛውን የተደራጊ ቅርጽና የንግግር ሐሳብ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐπαγγελίαι
  choice: ተስፋዎቹ
  rationale: የእግዚአብሔርን የተስፋ ቃሎች በግልጽና በተለመደ የመጽሐፍ ቅዱስ አማርኛ ይገልጣል።
- source_word: σπέρμα / σπέρματι
  choice: ዘር / ለዘሩ / ለዘርህ
  rationale: “ዘር” ነጠላ ቅርጹንና የጋራ ስምነቱን ይጠብቃል፤ የጳውሎስ ክርክርም በዚህ ቅርጽ ላይ የተመሠረተ ነው።
- source_word: τοῖς σπέρμασιν
  choice: ለዘሮችህም
  rationale: ብዙ ቁጥሩን በግልጽ በማሳየት ጳውሎስ በነጠላና በብዙ ቁጥር መካከል የሚያደርገውን ንጽጽር ይጠብቃል።
- source_word: ὡς ἐπὶ πολλῶν / ἀλλ’ ὡς ἐφ’ ἑνός
  choice: ብዙዎችን እንደሚያመለክት / አንድን እንደሚያመለክት
  rationale: የሐረጎቹን ማብራሪያዊ ኃይልና ትይዩ መዋቅር በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: Χριστός
  choice: መሲሕ
  rationale: በዚህ የመለያ አገላለጽ ውስጥ ቃሉ የተቀባውን አዳኝ የሚያመለክት ማዕረግ ሆኖ ይሠራል፤ “ክርስቶስ” በግርጌ ማስታወሻ ተጠቅሷል።
theological_decisions:
- issue: በጳውሎስ የመለያ አገላለጽ ውስጥ Χριστόςን መተርጎም
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: እዚህ Χριστός እንደ ማዕረግ እየሠራ የተስፋው ዘር ማንነትን ይገልጣል። “መሲሕ” የማዕረጉን ትርጉም ግልጽ ያደርጋል፤ ባህላዊው “ክርስቶስ” ግን እንደ አማራጭ ተጠብቋል።
- issue: የσπέρμα ነጠላ የጋራ ስምነትና ጳውሎስ የሚያጎላው ነጠላ ቅርጽ
  choice: “ዘር” በዋናው ጽሑፍ ተጠብቆ፣ ሰዋሰዋዊ ውጥረቱ በግርጌ ማስታወሻ ተብራርቷል
  alternative: “ዘር ሐረግ” ወይም “ትውልድ” ብሎ ማለዘብ
  rationale: የጳውሎስን ክርክር በቀጥታ ለመከተል ነጠላው ቅርጽ መታየት አለበት፤ ነገር ግን σπέρμα የጋራ ስም ሊሆን የሚችለው እውነት እንዳይጠፋ በማስታወሻ ተገልጧል።
