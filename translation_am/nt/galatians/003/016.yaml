  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪክኛው ነጠላ/ብዙ ቁጥር የቃል ጨዋታ እንዳይጠፋ “ዘር/ዘሮች” ተጠብቋል፤ የጋራ ስሙ እርግጠኛ ያልሆነ ወሰንም በማስታወሻ ተገልጧል።
