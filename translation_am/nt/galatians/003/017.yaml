  yaml_path: translation/nt/galatians/003/017.yaml
  text: 'This is what I mean: the law[a], which came four hundred and thirty years later, does not invalidate a covenant previously ratified by God[b], so as to abolish the promise.'
translation:
  language: am
  text: ይህን ማለቴ ነው፤ ከአራት መቶ ሠላሳ ዓመት በኋላ የመጣው ሕግ፣ እግዚአብሔር አስቀድሞ ያጸደቀውን ቃል ኪዳን አያፈርስም[a]፤ ተስፋውንም ከንቱ ለማድረግ አይችልም[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አይሽረውም።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ተስፋውን ዋጋ አልባ ለማድረግ” ወይም “ተስፋውን ወደ ጎን ለማስቀመጥ።”
    reason: lexical_alternative
