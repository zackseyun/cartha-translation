  verdict: revise
  source_fidelity: The draft accurately preserves the address, the rhetorical ‘bewitch’ metaphor, the public-before-your-eyes force, and Jesus’ crucifixion. However, ‘ተስሎ’ specifically suggests being drawn/painted, which is not required by προεγράφη and narrows its sense of publicly and vividly setting something forth. The construction ‘ተስሎ ቀርቦላችሁ’ is also unnecessarily double and less direct.
  naturalness: The address and rebuke are natural modern standard Amharic. A single connected sentence more naturally retains the Greek relative connection, and ‘በግልጽ ተገልጦ ነበር’ is clearer and more idiomatic than ‘ተስሎ ቀርቦላችሁ ነበር.’
  terminology: ‘መሲሕ’ appropriately renders Χριστός as a meaningful title. ‘አስማታችሁ’ retains the vivid rhetorical metaphor without asserting literal sorcery. No doctrinally loaded alteration is introduced.
  issues:
  - severity: medium
    issue: ‘ተስሎ ቀርቦላችሁ ነበር’ over-specifies and duplicates the portrayal expression.
