translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ የሚገባ አማርኛን ይጠቀማል። “ሆይ” የግሪኩን ቀጥተኛ ጥሪ እና የተግሣጹን ኃይል ይጠብቃል፤ አጭር ሁለተኛው ዓረፍተ ነገር ደግሞ የግሪኩን ዝምድና በተፈጥሯዊ አማርኛ ያቀርባል።
