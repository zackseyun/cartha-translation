- source_word: ἐβάσκανεν
  choice: አስማታችሁ
  rationale: ግሱ የሚያስነሳውን የአስማት ወይም የጎጂ ተጽእኖ ምስል ይጠብቃል፤ ‘አሳታችሁ’ ብቻ የንግግሩን ስለት ያደበዝዛል።
- source_word: οἷς κατ’ ὀφθαλμοὺς
