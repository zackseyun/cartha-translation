  text: እናንተ የማታስተውሉ ገላትያውያን ሆይ፣ ኢየሱስ መሲሕ እንደተሰቀለ በዓይናችሁ ፊት በግልጽ ተገልጦ ነበርና፣ ማን አስማታችሁ?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
