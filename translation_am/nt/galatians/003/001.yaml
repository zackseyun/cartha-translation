    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνόητοι
  choice: የማታስተውሉ
  rationale: የማሰብና የመረዳት ጉድለትን የሚገልጸውን ተግሣጽ ያስተላልፋል፤ ከግሪኩ በላይ ከባድ የሞራል ፍርድ አይጨምርም።
- source_word: Γαλάται
  choice: ገላትያውያን
