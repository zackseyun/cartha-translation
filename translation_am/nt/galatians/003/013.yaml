  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘እርግማን በመሆን’ የሚለው ሆን ተብሎ የምንጩን ኃይለኛ አገላለጽ ጠብቋል። የግርጌ ማስታወሻ ምልክቶች [a]፣ [b]፣ [c] ሁሉም በዋናው ጽሑፍ ውስጥ ተካተዋል።
