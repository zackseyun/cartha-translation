  text: Χριστὸς ἡμᾶς ἐξηγόρασεν ἐκ τῆς κατάρας τοῦ νόμου γενόμενος ὑπὲρ ἡμῶν κατάρα, ⸂ὅτι γέγραπται⸃· Ἐπικατάρατος πᾶς ὁ κρεμάμενος ἐπὶ ξύλου,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/013.yaml
  text: 'The Messiah redeemed us from the curse of the law by becoming a curse for us[d][c][b][a], because it is written: “Cursed is everyone who hangs on a tree.”'
translation:
  language: am
  text: መሲሑ ስለ እኛ እርግማን ሆኖ፣ ከሕጉ እርግማን ዋጀን፤ ምክንያቱም፣ “በእንጨት ላይ የሚሰቀል ሁሉ የተረገመ ነው” ተብሎ ተጽፏል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Χριστός
  choice: መሲሑ
  rationale: የማዕረጉን ትርጉም በግልጽ ያቀርባል፤ በዚህ አውድ የማዕረግ ኃይሉ ጎልቶ ይታያል።
- source_word: ἐξηγόρασεν
  choice: ዋጀን
  rationale: ከአንድ ባርነት ወይም ፍርድ ዋጋ በመክፈል ነጻ የማውጣትን የግሪኩን የግብይትና የማዳን ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: κατάρας / κατάρα
  choice: እርግማን
  rationale: የቃሉን የፍርድና የቃል ኪዳን ክብደት ያለ ትርጓሜያዊ ማስፋፋት ይጠብቃል።
- source_word: τοῦ νόμου
  choice: ከሕጉ
  rationale: ግሪኩን ቀጥተኛ የባለቤትነት ግንኙነት ‘የሕጉ እርግማን’ በሚለው ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: γενόμενος
  choice: በመሆን
  rationale: የአድራጊ አንቀጹን ከመዋጀቱ ጋር እንደ መንገድ ወይም ዘዴ ያገናኛል።
- source_word: ὑπὲρ ἡμῶν
  choice: ስለ እኛ
  rationale: ጥቅምንና ውክልናን ያስተላልፋል፣ ነገር ግን ቅያሬን ብቻ በግድ አይወስንም።
- source_word: ὅτι γέγραπται
  choice: ምክንያቱም … ተብሎ ተጽፏል
  rationale: የጥቅሱን ምክንያታዊና ማብራሪያዊ ኃይል በዘመናዊ አማርኛ ያቀርባል።
- source_word: κρεμάμενος
  choice: የሚሰቀል
  rationale: በጥቅሱ ውስጥ ያለውን አጠቃላይ አገላለጽ ተፈጥሯዊ በሆነ አማርኛ ይጠብቃል።
- source_word: ξύλου
  choice: እንጨት
  rationale: ቃሉ በቀጥታ ‘እንጨት/ዛፍ’ ማለት ሲችል፣ የዘዳግምን ጥቅስ ሳይገድብ ‘እንጨት’ የሚለውን ሰፊ የምንጭ ትርጉም ይጠብቃል።
theological_decisions:
