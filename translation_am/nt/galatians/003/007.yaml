id: GAL.3.7
reference: Galatians 3:7
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Γινώσκετε ἄρα ὅτι οἱ ἐκ πίστεως, οὗτοι ⸂υἱοί εἰσιν⸃ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/007.yaml
  text: Know, then, that those of faith—these are Abraham’s sons.
translation:
  language: am
  text: እንግዲህ፣ ከእምነት የሆኑት—እነዚህ የአብርሃም ልጆች እንደሆኑ እወቁ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γινώσκετε
  choice: ዕወቁ
  rationale: The imperative force is preserved directly and naturally in modern standard Amharic.
- source_word: ἄρα
  choice: እንግዲህ
  rationale: Marks the inferential conclusion drawn from the preceding argument.
- source_word: οἱ ἐκ πίστεως
  choice: ከእምነት የሆኑት
  rationale: Retains the source's compact and somewhat open-ended expression rather than interpreting it more narrowly as merely ‘those who believe.’
- source_word: οὗτοι
  choice: እነዚህ
  rationale: Preserves the emphatic demonstrative identification in the Greek.
- source_word: υἱοί
  choice: ልጆች
  rationale: In this kinship and inheritance context, the inclusive natural Amharic term communicates descendants/heirs without restricting the statement to males.
- source_word: Ἀβραάμ
  choice: አብርሃም
  rationale: Uses the established Amharic biblical form of the name Abraham.
theological_decisions:
- issue: Meaning of οἱ ἐκ πίστεως
  choice: ከእምነት የሆኑት
  alternative: የሚያምኑት
  rationale: The chosen wording preserves Paul's source-oriented formulation and its theological density without reducing it to the act of believing alone.
- issue: Gender and filial status in υἱοί
  choice: ልጆች
  alternative: ወንዶች ልጆች
  rationale: The argument identifies those of faith as belonging to Abraham's family and sharing filial standing; generic ‘children’ is natural and inclusive in Amharic while preserving the kinship claim.
translation_notes:
  register: Modern, dignified standard Amharic. The sentence preserves the Greek inferential opening and the emphatic subject-resumptive structure ‘those … these,’ while remaining readily understandable.
source_grounding:
  english_pob_role: consult_only
