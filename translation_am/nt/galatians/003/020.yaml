  rationale: በሁለት ወገኖች መካከል ሆኖ ስምምነትን የሚያመጣን ወይም የሚያጸናን ሰው በተፈጥሯዊና በተለመደ አማርኛ ይገልጣል፤ የሕግና የቃል ኪዳን አውዱንም ይጠብቃል።
