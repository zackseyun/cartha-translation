  alternative: «አንድ እግዚአብሔር ብቻ አለ»።
  rationale: አማራጩ ሐሳቡን ቢገልጥም «ብቻ» የሚል ማብራሪያ ይጨምራል። የተመረጠው አገላለጽ የግሪኩን ቀላልነትና ምናልባትም ዘዳግም 6፥4ን የሚያስታውሰውን ድምፀት ይጠብቃል።
