  text: But the Scripture imprisoned everything under sin[b][a], so that the promise by faith in Jesus the Messiah might be given to those who believe.
translation:
  language: am
  text: ነገር ግን መጽሐፍ ቅዱስ ሁሉን ነገር በኃጢአት ሥር አግቷል፤ ይህም በኢየሱስ መሲሕ በማመን የሚገኘው የተስፋ ቃል ለሚያምኑት እንዲሰጥ ነው።[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በኢየሱስ መሲሕ ታማኝነት»።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ «ሁሉን ነገር በኃጢአት ሥር አስሮ ዘጋው»።
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέκλεισεν
  choice: አስሮ ዘጋው
  rationale: የግሱን በአንድ ሥር አግቶ የመዝጋት ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል፤ የእስር ምስሉንም ይጠብቃል።
- source_word: ἡ γραφή
  choice: መጽሐፍ
  rationale: በጳውሎስ አጠቃቀም ቅዱሳት መጻሕፍትን እንደ አንድ ምስክር የሚወክለውን ነጠላ ስም በአጭርና የተለመደ መጽሐፍ ቅዱሳዊ ቋንቋ ይገልጻል።
- source_word: τὰ πάντα
  choice: ሁሉን ነገር
  rationale: ገለልተኛውን ብዙ ቁጥር ሰፊና አጠቃላይ ወሰን ይጠብቃል፤ ሰዎችን ብቻ አድርጎ አይገድበውም።
- source_word: ὑπὸ ἁμαρτίαν
  choice: በኃጢአት ሥር
  rationale: የመገዛትን ወይም በሥልጣን ሥር የመሆንን ምስል ያለ ትርጓሜያዊ ማስፋፊያ ይጠብቃል።
- source_word: ἡ ἐπαγγελία
  choice: ተስፋው
  rationale: የግሪኩን ስም ቀጥተኛ ትርጉም ይሰጣል፤ በዐውዱ የተጠቀሰውን የእግዚአብሔር ተስፋ ያመለክታል።
- source_word: ἐκ πίστεως Ἰησοῦ Χριστοῦ
  choice: በኢየሱስ መሲሕ በማመን
  rationale: ዋናው ጽሑፍ አገባቡን እንደ ተደራጊ የዘር አገባብ፣ ማለትም በኢየሱስ መሲሕ ማመን፣ ያቀርባል፤ እውነተኛው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: Χριστοῦ
  choice: መሲሕ
  rationale: ከኢየሱስ ጋር የተያያዘውን የቅቡዕነት ማዕረግ ግልጽ ያደርጋል።
- source_word: δοθῇ
  choice: እንዲሰጥ
  rationale: ከἵνα ጋር ያለውን የዓላማ ግንኙነትና ተደራጊ ድምፅ በተፈጥሯዊ አማርኛ ይወክላል።
- source_word: τοῖς πιστεύουσιν
  choice: ለሚያምኑ
  rationale: የአሁን ጊዜ ተሳቢ ግስን ንቁ ምላሽ ይጠብቃል፤ እንደ ቋሚ መለያ ብቻ አያቀርበውም።
theological_decisions:
- issue: πίστεως Ἰησοῦ Χριστοῦ የዘር አገባብ
  choice: ተደራጊ የዘር አገባብ፦ «በኢየሱስ መሲሕ በማመን»
  alternative: ባለቤታዊ የዘር አገባብ፦ «በኢየሱስ መሲሕ ታማኝነት»
  rationale: የግሪኩ አገባብ በእውነት አሻሚ ነው። ዋናው ጽሑፍ የተለመደውን በመሲሑ የማመን ንባብ ይይዛል፤ የመሲሑን ታማኝነት የሚያመለክተው ንባብ ግን በማስታወሻ ተጠብቋል።
