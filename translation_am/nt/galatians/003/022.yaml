    reason: lexical_alternative
  revision_rationale: The revision restores a clear source-like progression from Scripture’s act of confinement to its purpose, replaces the misleading ‘hope’ wording with the standard Amharic expression for a promise, and uses an idiomatic confinement verb. The contested Christ-faith genitive remains unresolved in the main text and is explicitly preserved in the footnote. Both required footnote anchors are retained.
