  text: እንዲህ ያህል ማስተዋል የጎደላችሁ ናችሁን? በመንፈስ[a] ጀምራችሁ፣ አሁን በሥጋ[b] ወደ ፍጻሜ እየደረሳችሁ ነውን?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በመንፈስ ውስጥ።”
