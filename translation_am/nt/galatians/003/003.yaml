  terminology: በመንፈስ and በሥጋ appropriately retain the established Pauline contrast. The footnote for ሥጋ appropriately gives interpretive possibilities without replacing the source term in the main text. The alternative for ἐπιτελεῖσθε is simplified to a genuine lexical/rendering alternative and does not repeat an unnecessarily expanded full clause.
