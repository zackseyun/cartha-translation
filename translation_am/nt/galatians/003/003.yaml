lexical_decisions:
- source_word: οὕτως ἀνόητοί
  choice: እንዲህ ያለ ማስተዋል እንዴት ያጥራችኋል?
  rationale: የግሪኩን ጠንካራ የተግሣጽ ጥያቄ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል፤ ἀνόητος የማስተዋልና የመለየት እጥረትን ያመለክታል።
- source_word: ἐναρξάμενοι
  choice: ጀምራችሁ
  rationale: የአኦሪስት አሳታፊውን ከዋናው ግስ በፊት የተፈጸመ ተግባር አድርጎ በአማርኛ በተፈጥሮ ይገልጣል።
- source_word: πνεύματι
  choice: በመንፈስ
  rationale: በገላትያ 3 አውድ የሚጠቀሰው ቅዱስ መንፈስ ነው፤ በ- የመሣሪያንም ሆነ የሁኔታን ንባብ በአማርኛ ሊሸከም ይችላል።
- source_word: νῦν
  choice: አሁን
  rationale: በመንፈስ በመጀመርና ወደ ሥጋ በመዞር መካከል ያለውን ጊዜያዊ ንጽጽር በግልጽ ይጠብቃል።
- source_word: σαρκὶ
  choice: በሥጋ
  rationale: የጳውሎስን መንፈስ–ሥጋ ንጽጽርና የቃሉን ብዙ ንብርብር ሳይፈታ ይጠብቃል።
- source_word: ἐπιτελεῖσθε
  choice: ወደ ፍጻሜ እየደረሳችሁ ነውን?
  rationale: የአሁን ጊዜውን ሂደትና ወደ ሙላት/ፍጻሜ የመድረስን ሐሳብ ይገልጣል፤ የመካከለኛ/ተደራጊ ቅርጹ አሻሚነት በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: የπνεύματι ተጠቃሽ
  choice: ቅዱስ መንፈስ
  alternative: የሰው መንፈስ ወይም መንፈሳዊ መርሕ
  rationale: በቅርብ አውዱ መንፈስን መቀበል፣ ተአምራትና በእምነት መኖር ይጠቀሳሉ፤ ስለዚህ ቅዱስ መንፈስ ዋናው ንባብ ነው።
- issue: ከመንፈስ ጋር በተነጻጸረው σάρξ ያለው ትርጉም
  choice: ሥጋ
  alternative: የሰው ጥረት ወይም ኃጢአተኛ ተፈጥሮ
  rationale: ቀጥተኛው ቃል የጳውሎስን ሆን ብሎ ያቆየውን የትርጉም ውጥረት ይጠብቃል፤ አንድን ትርጓሜ ብቻ አያስገድድም።
- issue: የἐπιτελεῖσθε ድምፅ
  choice: ወደ ፍጻሜ እየደረሳችሁ ነውን?
  alternative: ፍጹማን እየተደረጋችሁ ነውን? ወይም እየፈጸማችሁ ነውን?
  rationale: የግሪኩ መካከለኛ/ተደራጊ ቅርጽ ከአንድ በላይ አገባባዊ ንባብን ይፈቅዳል፤ ዋናው ጽሑፍ የሂደትና ፍጻሜን ሐሳብ ይጠብቃል።
