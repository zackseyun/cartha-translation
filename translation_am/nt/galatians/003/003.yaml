  - marker: b
    text: “በሥጋ” እዚህ “በሰው ጥረት” የሚል ሐሳብ ሊያካትት ይችላል፤ “በኃጢአተኛ ተፈጥሮ” ተብሎም ሊገባ ይችላል።
