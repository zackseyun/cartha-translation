  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። የጳውሎስ የተግሣጽ ጥያቄና የመንፈስ–ሥጋ ንጽጽር ተጠብቀዋል።
