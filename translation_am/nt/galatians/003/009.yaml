  yaml_path: translation/nt/galatians/003/009.yaml
  text: So then[a], those who are of faith are blessed along with Abraham, the faithful one.
translation:
  language: am
  text: ስለዚህ፣ ከእምነት የሆኑት ከታማኙ አብርሃም ጋር[a] ይባረካሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ከአማኙ አብርሃም ጋር»።
    reason: πιστός በዚህ አውድ ‘ታማኝ’ ወይም ‘አማኝ’ ተብሎ ሊገባ ይችላል።
lexical_decisions:
- source_word: ὥστε
  choice: ስለዚህ
  rationale: ከቀደመው ሐሳብ የሚወጣውን ድምዳሜ በተፈጥሯዊና ግልጽ አማርኛ ያሳያል።
- source_word: οἱ ἐκ πίστεως
  choice: ከእምነት የሆኑት
  rationale: የግሪኩን የቡድን ማንነት አመልካች አወቃቀር ሳያጠፋ በአጭሩ ያቀርባል፤ ከምንጩ በላይ ‘የሚኖሩ’ ወይም ‘የሚመኩ’ የሚል ግስ አይጨምርም።
- source_word: πίστεως
  choice: እምነት
  rationale: በዚህ አውድ ጳውሎስ በእምነት ስለሚለዩ ሰዎች ይናገራል፤ ‘እምነት’ የሚለው ትርጉም ይህን በቀጥታ ይገልጣል።
- source_word: εὐλογοῦνται
  choice: ይባረካሉ
  rationale: የግሪኩን ተደራጊ ቅርጽና የአሁን ጊዜ አገላለጥ ይጠብቃል፤ በረከቱ የሚቀበሉት እንጂ የሚያገኙት በሥራቸው እንዳልሆነ አወቃቀሩ ያሳያል።
- source_word: σὺν
  choice: ከ…ጋር
  rationale: በአማርኛ አብሮነትንና በበረከቱ መካፈልን በተፈጥሯዊ ሁኔታ ይገልጣል።
- source_word: τῷ πιστῷ Ἀβραάμ
  choice: ከታማኙ አብርሃም
  rationale: πιστός የሚለውን ‘ታማኝ’ በሚለው የተለመደ ትርጉም ያቀርባል፤ በዚህ አውድ ‘አማኝ’ ሊሆን የሚችለው ንባብ በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: በአብርሃም ላይ የተጠቀሰውን πιστός እንዴት መተርጎም እንደሚገባ
  choice: ታማኙ አብርሃም
  alternative: አማኙ አብርሃም
  rationale: πιστός ‘ታማኝ’ ወይም ‘አማኝ’ ሊሆን ይችላል። ዋናው ጽሑፍ የቅጽሉን መደበኛ ፍቺ ይይዛል፤ ምዕራፉ በአብርሃም እምነት ላይ ስለሚያተኩር ሌላው ንባብ በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ከእምነት የሆኑት’ የሚለው ትንሽ መደበኛ ቢሆንም የግሪኩን የማንነት አገላለጥ ለመጠበቅ ተመርጧል።
