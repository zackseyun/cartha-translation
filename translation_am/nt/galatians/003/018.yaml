  text: εἰ γὰρ ἐκ νόμου ἡ κληρονομία, οὐκέτι ἐξ ἐπαγγελίας· τῷ δὲ Ἀβραὰμ δι’ ἐπαγγελίας κεχάρισται ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/018.yaml
  text: For if the inheritance is from the law[a], it is no longer from a promise; but God has graciously given it to Abraham through a promise.
translation:
  language: am
  text: ርስቱ ከሕግ የሚገኝ ከሆነ፣ ከተስፋ ቃል የሚገኝ ከእንግዲህ ወዲህ አይደለም፤ እግዚአብሔር ግን ለአብርሃም በተስፋ ቃል በጸጋ ሰጥቶታል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እግዚአብሔር ለአብርሃም በተስፋ ቃል ሰጥቶታል።»
    reason: lexical_alternative
lexical_decisions:
- source_word: κληρονομία
  choice: ርስት
  rationale: የወራሽነት ድርሻን የሚያመለክተውን መደበኛውን የጳውሎስ አጠቃቀም ይጠብቃል።
- source_word: ἐκ νόμου
  choice: ከሕግ የሚገኝ
  rationale: ἐκ የሚያሳየውን ምንጭ ወይም መሠረት ጠብቆ፣ ከተስፋ ቃል ጋር ያለውን ተቃርኖ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐπαγγελίας
  choice: የተስፋ ቃል
  rationale: በአብርሃም ዐውደ ንባብ ውስጥ ያለውን መለኮታዊ ቃል ኪዳን በግልጽና በተለመደ አገላለጽ ያስተላልፋል።
- source_word: οὐκέτι
  choice: አይሆንም
  rationale: በሁኔታዊው ዐረፍተ ነገር ውስጥ ርስቱ በሕግ ላይ ከተመሠረተ ከተስፋ ቃል ሊሆን እንደማይችል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: δι’ ἐπαγγελίας
  choice: በተስፋ ቃል
  rationale: διά የሚያሳየውን መንገድ ወይም መሣሪያ ይጠብቃል።
- source_word: κεχάρισται
  choice: በጸጋው ሰጥቶታል
  rationale: የፍጹም ጊዜውን ዘላቂ ውጤት በ«ሰጥቶታል» ይወክላል፤ የχαρίζομαιን የጸጋና የነጻ ስጦታ ስሜትም በ«በጸጋው» ያስቀምጣል።
- source_word: τῷ Ἀβραὰμ
  choice: ለአብርሃም
  rationale: የስጦታውን ተቀባይ በግልጽ ያሳያል።
theological_decisions:
- issue: በχαρίζομαι ውስጥ ያለውን የጸጋ ትርጉም በግልጽ ማሳየት
  choice: በጸጋው ሰጥቶታል
  alternative: ሰጥቶታል / ፈቅዶለታል
  rationale: ግሱ ተራ መስጠትን ብቻ ሳይሆን በችሮታ የሚሰጥ ስጦታን ያመለክታል፤ ይህም ጳውሎስ በሕግና በተስፋ ቃል መካከል የሚያደርገውን ንጽጽር ያለ ተጨማሪ የእምነት ሥርዓት ግምት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ከ… የሚገኝ» የሚለው አወቃቀር የግሪኩን የምንጭ ንጽጽር በተፈጥሯዊ አነጋገር ይጠብቃል።
