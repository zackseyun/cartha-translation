  verdict: revise
  source_fidelity: The draft preserves the comparative force, temporal clause, explicit first-person plural, and slavery metaphor. However, the phrasing "በ... ሥር ባሪያዎች ሆነን" is less direct than the Greek passive and can be improved to express being enslaved to the στοιχεῖα. The disputed sense of στοιχεῖα should remain open through an appropriately qualified main rendering and footnote.
  naturalness: The verse is understandable, but "በዓለም መሠረታዊ ሥርዓቶች ሥር" is heavy and repetitive because of the two uses of ሥር. "... ለ... ባሪያዎች ሆነን" is more idiomatic modern standard Amharic.
  terminology: '"መሠረታዊ መርሆች" naturally renders the non-personal reading adopted in the English audit trail. The footnote retains the viable reading of cosmic spiritual powers without forcing it into the main text.'
  issues:
