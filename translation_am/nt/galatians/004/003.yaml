id: GAL.4.3
reference: Galatians 4:3
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὕτως καὶ ἡμεῖς, ὅτε ἦμεν νήπιοι, ὑπὸ τὰ στοιχεῖα τοῦ κόσμου ⸀ἤμεθα δεδουλωμένοι·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/003.yaml
  text: So also we[a], when we were children, were enslaved under the elemental principles of the world.
translation:
  language: am
  text: እንደዚሁም እኛ፣ ሕፃናት በነበርንበት ጊዜ፣ ለዓለም መሠረታዊ መርሆች[a] ባሪያዎች ሆነን ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የዓለም መሠረታዊ መንፈሳዊ ኃይላት”። የግሪክኛው ቃል መሠረታዊ መርሆችን ወይም ነገሮችን፣ እንዲሁም የዓለም መንፈሳዊ ኃይላትን ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ
  choice: እንደዚሁም
  rationale: ከቀደመው የወራሽ ምሳሌ ጋር ያለውን ንጽጽር በተፈጥሯዊና አጭር አማርኛ ያስተላልፋል።
- source_word: ἡμεῖς
  choice: እኛ
  rationale: በግሪክኛው የተገለጸውን አጽንዖት ለመጠበቅ የመጀመሪያ መደብ ብዙ ቁጥር ተውላጠ ስም በግልጽ ተቀምጧል።
- source_word: ὅτε ἦμεν νήπιοι
  choice: ሕፃናት በነበርንበት ጊዜ
  rationale: νήπιοι በአውዱ የሕጋዊ አቅመ አዳም አለመድረስንና ያለመብሰልን ያመለክታል፤ ‘ሕፃናት’ የምሳሌውን ቀጣይነት ይጠብቃል።
- source_word: ὑπὸ
  choice: ሥር
  rationale: የመገዛትንና የቁጥጥርን ምሳሌያዊ ኃይል ይጠብቃል።
- source_word: τὰ στοιχεῖα τοῦ κόσμου
  choice: የዓለም መሠረታዊ ሥርዓቶች
  rationale: στοιχεῖα መሠረታዊ ነገሮችን፣ መርሆችን ወይም ሥርዓቶችን፣ እንዲሁም መንፈሳዊ ኃይላትን ሊያመለክት ይችላል። ‘መሠረታዊ ሥርዓቶች’ በዋናው ጽሑፍ የማይገባ ግለሰባዊነትን ሳያስገባ በአውዱ የሚነበብ ነው፤ ሌላው ትርጉም በማስታወሻ ተጠብቋል።
- source_word: ἤμεθα δεδουλωμένοι
  choice: ባሪያዎች ሆነን ነበር
  rationale: የባርነትን ጠንካራ ትርጉምና የቀጠለ ያለፈ ሁኔታን በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: የτὰ στοιχεῖα τοῦ κόσμου ትርጉም
  choice: በዋናው ጽሑፍ ‘የዓለም መሠረታዊ ሥርዓቶች’ ተብሏል።
  alternative: ‘የዓለም መሠረታዊ መንፈሳዊ ኃይላት’ ወይም ‘የዓለም መሠረታዊ ነገሮች’
  rationale: ሐረጉ በገላትያና በቆላስይስ ውስጥ አከራካሪ ነው። የቀደመው አውድ በአሳዳጊዎች ሥር ያለን ያልደረሰ ወራሽ ስለሚያጎላ፣ ሰውነት ያልተሰጠው አተረጓጎም በዋናው ጽሑፍ ተመርጧል፤ ሆኖም የኮስሚክ መንፈሳዊ ኃይላት አተረጓጎም እንዳይጠፋ በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ሥር’ እና ‘ባሪያዎች’ የሚሉት ቃላት የግሪክኛውን የመገዛት ምሳሌ ይጠብቃሉ።
