    issue: Repetitive and less-direct expression of subjection
    rationale: The sequence "በ... ሥር ... ሥር ባሪያዎች" is stylistically cumbersome. The Greek ἤμεθα δεδουλωμένοι directly states that the subjects were enslaved, and Amharic "ለ... ባሪያዎች ሆነን" conveys this naturally.
  - severity: low
    issue: Main-text term ሥርዓቶች is somewhat over-specific
    rationale: Στοιχεῖα can denote basic elements or principles and may also denote cosmic powers. "መርሆች" better matches the selected English reading, while the note preserves the broader dispute.
