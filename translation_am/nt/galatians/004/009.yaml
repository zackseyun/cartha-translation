- source_word: δουλεύειν θέλετε
  choice: ባሪያዎች መሆን ትፈልጋላችሁን?
  rationale: የδουλεύωን የባርነት ምስልና የθέλωን ፈቃድ ይጠብቃል፤ ከቀላሉ ‘ማገልገል’ ይልቅ የገላትያን የባርነት አውድ በግልጽ ያሳያል።
