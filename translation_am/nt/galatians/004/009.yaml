  text: But now[a], having come to know God—or rather, having been known by God—how can you turn back again to the weak and poor elemental principles, to which you want to be enslaved all over again?
translation:
  language: am
  text: አሁን ግን እግዚአብሔርን ካወቃችሁ፣ ወይም ይልቁንም በእግዚአብሔር የታወቃችሁ ከሆነ፣ እንዴት ወደ ደካማና ድሀ መሠረታዊ ነገሮች[a] እንደገና ትመለሳላችሁ፤ እንደገና ከመጀመሪያው ለእነርሱ ባሪያ መሆን ትፈልጋላችሁ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “መሠረታዊ መርሆች፣” “የመጀመሪያ ነገሮች፣” ወይም “መሠረታዊ መንፈሳዊ ኃይሎች” ሊሆን ይችላል።
