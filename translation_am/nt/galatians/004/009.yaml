  choice: የዓለም መሠረታዊ ነገሮች
  alternative: የዓለም መሠረታዊ ኃይሎች፣ መሠረታዊ መርሆች፣ የመጀመሪያ ነገሮች
  rationale: ቃሉ መሠረታዊ የሃይማኖት ሥርዓቶችን፣ የዓለም ክፍሎችን ወይም ከእነርሱ ጋር የተያያዙ ኃይሎችን ሊያመለክት ይችላል። ዋናው ጽሑፍ አንዱን ብቻ ሳይወስን አማራጮቹን በማስታወሻ ያቀርባል።
- issue: ‘በእግዚአብሔር መታወቅ’ የሚለው አጽንዖት
  choice: የእነርሱን እግዚአብሔርን ማወቅ በማረም፣ እግዚአብሔር እነርሱን ማወቁን ያስቀድማል
  alternative: የመለኮታዊ ቀዳሚነት አጽንዖት የሌለው ግንኙነታዊ አገላለጽ
  rationale: μᾶλλον δέ እውነተኛ የሐሳብ ማረሚያ ነው። ትርጉሙ ይህን ያሳያል፣ ነገር ግን ጥቅሱ ከሚለው በላይ የተወሰነ የእምነት ሥርዓት አያስገባም።
