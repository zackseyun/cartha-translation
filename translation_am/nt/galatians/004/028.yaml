  text: You[a], brothers, like Isaac, are children of promise.
translation:
  language: am
  text: እናንተ ግን፣ ወንድሞች ሆይ፣[a] እንደ ይስሐቅ የተስፋ ልጆች ናችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: እዚህ “ወንድሞች” የሚለው ተባዕታይ ብዙ ቁጥር ቃል ለመላው ጉባኤ የቀረበ ጥሪ ሲሆን፣ ወንዶችንም ሴቶችንም ያካትታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: እናንተ
  rationale: የሁለተኛ ሰው ብዙ ቁጥር ተውላጠ ስም በግልጽ መጠቀሱንና ያለውን አጽንዖት ይጠብቃል።
- source_word: δέ
  choice: ግን
  rationale: ከቀደመው ሐሳብ ጋር ያለውን ለስላሳ ንጽጽርና የንግግር ሽግግር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἀδελφοί
  choice: ወንድሞች ሆይ
  rationale: የግሪኩን ተባዕታይ ብዙ ቁጥር የጥሪ ቅርጽ ይጠብቃል፤ ለመላው ጉባኤ የተወካይነት አጠቃቀሙ በማስታወሻ ተገልጿል።
- source_word: κατὰ Ἰσαὰκ
  choice: እንደ ይስሐቅ
  rationale: ይስሐቅ የንጽጽሩ ምሳሌ መሆኑን በተፈጥሯዊና ግልጽ አማርኛ ያቀርባል።
- source_word: ἐπαγγελίας
  choice: የተስፋ
  rationale: ‘የተስፋ ልጆች’ የሚለው የጳውሎስን አገላለጽና ሥነ መለኮታዊ ክብደት ሳይተረጉም ይጠብቃል።
- source_word: τέκνα
  choice: ልጆች
  rationale: ጾታን የማይለይ ብዙ ቁጥር ሲሆን የቤተሰብ አባልነትን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐστέ
  choice: ናችሁ
  rationale: የሁለተኛ ሰው ብዙ ቁጥር የአሁን ጊዜ አያያዥ ግስን በቀጥታ ያስተላልፋል።
theological_decisions:
- issue: አማኞች በጳውሎስ ምሳሌያዊ ክርክር ከይስሐቅ ጋር መነጻጸራቸው
  choice: እንደ ይስሐቅ የተስፋ ልጆች ናችሁ
  alternative: እንደ ይስሐቅ በተስፋ የተገኙ ልጆች ናችሁ
  rationale: የግሪኩ አገባብ ይስሐቅን የንጽጽር ምሳሌ፣ ‘የተስፋ ልጆች’ን ደግሞ የአንባቢዎቹ መገለጫ አድርጎ ያቀርባል፤ ይህ አተረጓጎም ንጽጽሩንና የቃል ኪዳኑን ግንኙነት ተጨማሪ ዶክትሪን ሳያስገባ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “ሆይ” የጥሪ ቅርጹን በግልጽ ሲያሳይ ከመጠን በላይ ጥንታዊ አይደለም።
