  text: You are carefully observing days and months and seasons and years.
translation:
  language: am
  text: ቀኖችን፣ ወራትን፣ ወቅቶችን[a] እና ዓመታትን በጥንቃቄ ትጠብቃላችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የተወሰኑ ጊዜያትን።” ዝርዝሩ በቀን መቁጠሪያ መሠረት የሚጠበቁ ጊዜያትን ያመለክታል፤ καιρούς የሚለው ቃል “የተወሰኑ ጊዜያት” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμέρας
  choice: ቀኖችን
  rationale: የግሪኩን ተራ የጊዜ ስያሜ ያለ ተጨማሪ ‘ልዩ’ ወይም ‘ቅዱስ’ ገላጭ ቃል በቀጥታ ያስተላልፋል።
- source_word: παρατηρεῖσθε
  choice: በጥንቃቄ ትጠብቃላችሁ
  rationale: የአሁን ጊዜውን ቀጣይ ተግባርና ቃሉ ሊያመለክተው የሚችለውን ጥብቅ ልብ ማለት ይጠብቃል፤ ‘መጠበቅ’ም ስርዓትን ማክበር በሚለው ትርጉም ተፈጥሯዊ ነው።
- source_word: μῆνας
  choice: ወራትን
  rationale: የወር የብዙ ቁጥር ቀጥተኛና ተፈጥሯዊ አቻ ነው።
- source_word: καιρούς
  choice: ወቅቶችን
  rationale: καιρός ወቅትን ወይም የተወሰነ ጊዜን ሊያመለክት ይችላል፤ ‘ወቅቶች’ በዋናው ጽሑፍ ውስጥ አሻሚነቱን ሳያጠብ የቀን መቁጠሪያዊውን ቅደም ተከተል ይጠብቃል።
- source_word: ἐνιαυτούς
  choice: ዓመታትን
  rationale: የግሪኩን የብዙ ቁጥር በቀጥታ በመተርጎም የጊዜ ዝርዝሩን ያጠናቅቃል።
- source_word: καὶ
  choice: ፣ … እና
  rationale: ተደጋጋሚውን አያያዥ በዘመናዊ አማርኛ ተፈጥሯዊ የዝርዝር ሥርዓተ ነጥብና ‘እና’ በመጠቀም ያቀርባል።
theological_decisions:
- issue: ዝርዝሩ በግልጽ የአይሁድ ወይም የሃይማኖት ቀን መቁጠሪያ ሥርዓቶች መሆኑን መጨመር
  choice: የጊዜ ስያሜዎቹን ያለ ‘ልዩ፣’ ‘ቅዱስ’ ወይም ‘የበዓል’ ተጨማሪ ቃላት ማቆየት
  alternative: ‘ልዩ ቀኖችን’ ወይም ‘የሃይማኖት ቀኖችን’ ብሎ መተርጎም
  rationale: ዐውደ ንባቡ የሥርዓታዊ ቀን መቁጠሪያ አከባበርን ቢያመለክትም፣ ግሪኩ ራሱ የጊዜ ክፍሎቹን ያለ ገላጭ ቃል ይዘረዝራል፤ ትርጉሙም ይህን መጠን ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ትጠብቃላችሁ’ ለብዙ ሰዎች የተነገረ ሲሆን በዐውደ ንባቡ ሥርዓትን መከተልን ያመለክታል።
