  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: γέγραπται γὰρ ὅτι Ἀβραὰμ δύο υἱοὺς ἔσχεν, ἕνα ἐκ τῆς παιδίσκης καὶ ἕνα ἐκ τῆς ἐλευθέρας·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/022.yaml
  text: For it is written that Abraham had two sons[a], one by the servant woman and one by the free woman.
translation:
  language: am
  text: ምክንያቱም አብርሃም ሁለት ወንድ ልጆች እንደነበሩት ተጽፏል፤ አንዱ ከባሪያይቱ የተወለደ፣ ሌላውም ከነጻይቱ የተወለደ ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγραπται
  choice: ተጽፎአል
  rationale: ቅዱስ ጽሑፍን ለማስጠቀስ የሚያገለግለውን ፍጹም ተደራጊ ቅርጽና ቀጣይ ሥልጣኑን የሚጠብቅ ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
- source_word: γὰρ
  choice: ምክንያቱም
  rationale: ከቀደመው ክርክር ጋር ያለውን የማብራሪያና የምክንያት ግንኙነት በዘመናዊ አማርኛ በግልጽ ያሳያል።
- source_word: ὅτι
  choice: እንደ
  rationale: የተጻፈውን ይዘት በአማርኛ ተፈጥሯዊ በሆነ የተዘዋዋሪ ንግግር ቅርጽ ያስገባል።
- source_word: Ἀβραὰμ
  choice: አብርሃም
  rationale: በአማርኛ የተለመደው የመጽሐፍ ቅዱስ ስም ቅርጽ ነው።
- source_word: δύο υἱοὺς
  choice: ሁለት ወንዶች ልጆች
  rationale: υἱούς ወንድ ልጆችን በተለየ ሁኔታ ስለሚያመለክት፣ ጾታዊ ትክክለኛነቱን ይጠብቃል።
- source_word: ἔσχεν
  choice: እንደነበሩት
  rationale: በዚህ የዘር ሐረግ አውድ ‘ነበሩት’ ወላጅነትን በተፈጥሯዊና በቂ ሁኔታ ይገልጻል፤ ‘ወለደ’ ከሚለውም ያነሰ ትርጓሜያዊ ነው።
- source_word: ἕνα ... καὶ ἕνα
  choice: አንዱ ... አንዱም
  rationale: የግሪኩን ሚዛናዊ ትይዩ አወቃቀር በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐκ
  choice: ከ
  rationale: የእናትነትን ምንጭ በአማርኛ ለመግለጽ ‘ከ’ ተፈጥሯዊ ሲሆን የግሪኩን የምንጭ ሐሳብም ይጠብቃል።
- source_word: παιδίσκης
  choice: ባሪያይቱ ሴት
  rationale: ቃሉ ሴት ባሪያን ወይም አገልጋይ ሴትን ሊያመለክት ይችላል፤ እዚህ ግን የጳውሎስ ክርክር በባርነትና በነጻነት ተቃርኖ ላይ ስለተመሠረተ ‘ባሪያ’ የሚለው ማኅበራዊ ሁኔታዋን በግልጽ ያሳያል።
- source_word: ἐλευθέρας
  choice: ነጻይቱ ሴት
  rationale: በስም ፋንታ የቆመውን ቅጽል ‘ነጻይቱ ሴት’ በማለት በተፈጥሯዊ አማርኛ ይገልጻል፣ ከባሪያይቱም ጋር ያለውን ተቃርኖ ይጠብቃል።
theological_decisions:
- issue: በጳውሎስ ምሳሌያዊ ክርክር ውስጥ ዋና የሆነው የማኅበራዊ ሁኔታ ተቃርኖ
  choice: παιδίσκη/ἐλευθέρα የሚሉትን ‘ባሪያይቱ ሴት’/‘ነጻይቱ ሴት’ ብሎ መተርጎም
  alternative: ‘አገልጋይዋ ሴት’/‘ነጻይቱ ሴት’ ወይም ‘ገረዲቱ’/‘ነጻይቱ’
  rationale: በአካባቢው አውድ ያለው ክርክር በባርነትና በነጻነት ሥነ መለኮታዊ ፋይዳ ላይ ይመሠረታል። ‘ባሪያይቱ’ የሚለው ቃል ከጽሑፉ በላይ ሳይጨምር ይህን ተቃርኖ ግልጽ ያደርጋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተመርጧል። የ‘ባሪያይቱ ሴት/ነጻይቱ ሴት’ ትይዩነት የግሪኩን ተቃርኖ ይጠብቃል። በቀረበው የእንግሊዝኛ ማስታወሻ ውስጥ ምልክቱና ይዘቱ የማይጣጣሙ ስለሆኑ፣ ትርጉሙ ‘ባሪያይቱ ሴት’ የሚለውን ግልጽ ምርጫ ተከትሎ ያለ ግርጌ ማስታወሻ ቀርቧል።
