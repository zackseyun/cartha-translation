review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the scriptural citation formula, Abraham, the number and sex of the children, and the decisive slave/free contrast. However, “ሁለት ወንዶች ልጆች” is grammatically less natural than “ሁለት ወንድ ልጆች,” and the final clauses are clearer and more idiomatic when the implied birth relationship is stated.
  naturalness: 'A modest revision improves modern standard Amharic: “ተጽፏል” is the standard contracted form, “ወንድ ልጆች” is natural, and “ከ… የተወለደ” makes the two maternal relations clear without adding information.'
  terminology: “ባሪያይቱ” and “ነጻይቱ” are natural substantival feminine forms and retain the Greek slavery/freedom antithesis. Adding “ሴት” after each is redundant. No doctrinal interpretation is introduced.
  issues:
  - severity: low
    issue: Number agreement/natural collocation in “ሁለት ወንዶች ልጆች”
    rationale: For two male children, modern Amharic idiom is “ሁለት ወንድ ልጆች.”
  - severity: low
    issue: The maternal clauses omit an easily supplied but important relation
    rationale: “አንዱ ከባሪያይቱ … ነበር” is understandable, but “የተወለደ” is clearer and more natural in Amharic while faithfully expressing ἐκ in this genealogical context.
  revised_text: ምክንያቱም አብርሃም ሁለት ወንድ ልጆች እንደነበሩት ተጽፏል፤ አንዱ ከባሪያይቱ የተወለደ፣ ሌላውም ከነጻይቱ የተወለደ ነበር።
