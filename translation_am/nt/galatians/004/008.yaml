    text: ወይም፣ “ድሮ፣ እግዚአብሔርን ሳታውቁ፣ በተፈጥሮ በእውነት አማልክት ላልሆኑት ባሪያዎች ሆናችሁ ነበር።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλὰ
  choice: ነገር ግን
  rationale: ከቀደመው ሐሳብ ጋር ያለውን ንፅፅር በተፈጥሯዊና በክብር ባለው ዘመናዊ አማርኛ ያሳያል።
- source_word: τότε μὲν
  choice: በዚያን ጊዜ
  rationale: የገላትያ ሰዎችን ያለፈ ሁኔታ ያመለክታል፤ μέν በሚቀጥለው ቁጥር ካለው ሁኔታ ጋር የሚኖረውን ንፅፅር ያዘጋጃል።
- source_word: οὐκ εἰδότες θεὸν
  choice: እግዚአብሔርን ሳታውቁ
  rationale: የአሳታፊውን ሐረግ ከቀድሞው ዘመን ጋር በተያያዘ የጊዜ ሁኔታ አድርጎ ያቀርባል፤ ‘ማወቅ’ የግል ግንኙነትንም ሊያካትት የሚችለውን የጳውሎስን አጠቃቀም ይጠብቃል።
- source_word: ἐδουλεύσατε
  choice: ባሪያዎች ሆናችሁ ነበር
  rationale: δουλεύω የሚያመለክተውን ባርነትና መገዛት ያለማዳከም ይገልጣል፤ በገላትያ መልእክት ውስጥ ካለው የባርነትና የነፃነት ንፅፅር ጋርም ይስማማል።
- source_word: τοῖς φύσει μὴ οὖσι θεοῖς
  choice: በተፈጥሯቸው አማልክት ላልሆኑት
  rationale: እነዚህ ነገሮች ወይም ፍጡራን በእውነተኛ ማንነታቸው አማልክት እንዳልሆኑ የሚናገረውን ሐሳብ ይጠብቃል፤ ‘ጣዖታት’ ወይም ‘አጋንንት’ ብሎ ያልተገለጸውን አይወስንም።
theological_decisions:
- issue: ቀድሞ ይመለኩ የነበሩት አካላት ምንነት
  choice: “በተፈጥሯቸው አማልክት ላልሆኑት” በማለት የእውነተኛ ምንነታቸውን መካድ
  alternative: “በእውነት አማልክት ላልሆኑት” ወይም “አማልክት ተብለው ለሚጠሩት”
  rationale: φύσει μὴ οὖσι θεοῖς እነዚህ በምንነታቸው አማልክት እንዳልሆኑ ይገልጣል። ጳውሎስ በዚህ ስፍራ ጣዖታት ወይም አጋንንት ብሎ ስላልለያቸው፣ ትርጉሙም ያንን ክፍትነትና ሥነ መለኮታዊ ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና የተከበረ አማርኛ ተጠቅሟል። “ባሪያዎች ሆናችሁ” የግሪኩን የባርነት ኃይል ይጠብቃል፤ “አማልክት ላልሆኑት” ደግሞ የተጠቃሹን ግላዊ ወይም ግላዊ ያልሆነ ምንነት አስቀድሞ አይወስንም።
