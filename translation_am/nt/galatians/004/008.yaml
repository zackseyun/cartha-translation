    text: ወይም፣ “ድሮ፣ እግዚአብሔርን ሳታውቁ፣ በተፈጥሮ በእውነት አማልክት ላልሆኑት ባሪያዎች ሆናችሁ ነበር።”
    reason: lexical_alternative
  revision_rationale: The revision makes the rendering of φύσει idiomatic and maintains the ontological force of the Greek. It also repairs the footnote so that it unambiguously expresses enslavement rather than possession of slaves. No interpretive identification of the referents has been added.
