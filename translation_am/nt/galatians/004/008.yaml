  text: But at that time[a], when you did not know God, you were enslaved to those that by nature are not gods.
translation:
  language: am
  text: ነገር ግን በዚያን ጊዜ[a]፣ እግዚአብሔርን ሳታውቁ፣ በተፈጥሮ አማልክት ላልሆኑት ባሪያዎች ሆናችሁ ነበር።
  philosophy: optimal-equivalence
  footnotes:
