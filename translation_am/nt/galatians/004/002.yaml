theological_decisions:
- issue: የτοῦ πατρός ባለቤትነት/አድራጊነት ትርጉም
  choice: ‘አባቱ እስከወሰነው ጊዜ’ ተብሎ አባቱ ጊዜውን እንደሚወስን ተተርጉሟል።
