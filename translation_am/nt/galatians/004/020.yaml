  yaml_path: translation/nt/galatians/004/020.yaml
  text: But I wish I could be with you right now and change my tone[a], because I am perplexed about you.
translation:
  language: am
  text: ነገር ግን፣ አሁኑኑ ከእናንተ ጋር ብሆንና የአነጋገሬን ቃና[a] ብለውጥ እመኛለሁ፤ ስለ እናንተ ግራ ገብቶኛልና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ድምፄን።” የግሪኩ ቃል ቃል በቃል “ድምፄን መለወጥ” ይላል፤ በዚህ ዐውድ ግን የንግግሩን ቃና ወይም የአነጋገሩን ሁኔታ ማለቱ ይመስላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤθελον
  choice: እመኝ ነበር
  rationale: ያልተሳካውን የጳውሎስን ወቅታዊ ምኞት በተፈጥሯዊ አማርኛ ያሳያል፤ ከሚከተለው የሁኔታ አገላለጽ ‘ብሆንና … ብለውጥ’ ጋርም ይስማማል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከቀደመው ተግሣጽና ልመና ጋር ያለውን ለስላሳ ንፅፅር ወይም ሽግግር ያሳያል።
- source_word: παρεῖναι πρὸς ὑμᾶς
  choice: ከእናንተ ጋር ብሆን
  rationale: በአካል በመካከላቸው የመገኘትን ሐሳብ በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: ἄρτι
  choice: አሁኑኑ
  rationale: የጊዜውን አፋጣኝነትና አስቸኳይነት በግልጽ ያስተላልፋል።
- source_word: ἀλλάξαι τὴν φωνήν μου
  choice: የንግግሬን ቃና ብለውጥ
  rationale: φωνή ቃል በቃል ‘ድምፅ’ ማለት ቢችልም፣ በዚህ ዐውድ የአነጋገር ሁኔታን ወይም ቃናን ያመለክታል። ‘የንግግሬን ቃና’ ሐሳቡን ግልጽ ያደርጋል።
- source_word: ὅτι
  choice: ስለ … ስለ
  rationale: የጳውሎስን ምኞት ምክንያት በአማርኛ የምክንያት አንቀጽ ያቀርባል።
- source_word: ἀποροῦμαι
  choice: ግራ ስለገባኝ
  rationale: የመደናገር፣ የመቸገርና ምን ማድረግ እንዳለበት ያለማወቅን ስሜት በተለመደ አማርኛ ይገልጣል።
- source_word: ἐν ὑμῖν
  choice: ስለ እናንተ
  rationale: ግራ መጋባቱ ከገላትያ ሰዎች ጋር በተያያዘ መሆኑን ያሳያል፤ ቃል በቃል ‘በእናንተ’ ከማለት ይልቅ ተፈጥሯዊ ነው።
theological_decisions:
- issue: በዐውዱ ውስጥ የφωνή ትርጉም
  choice: ጳውሎስ የንግግሩን ቃና ወይም የአነጋገሩን ሁኔታ ስለመለወጥ ይናገራል።
  alternative: የሥጋዊ ድምፁን ብቻ መለወጥ ይፈልጋል።
  rationale: በአቅራቢያው ዐውድ የእረኝነት ተግሣጽና ጭንቀት አለ፤ ስለዚህ ሐረጉ በአካል ቢገኝ እንዴት እንደሚያነጋግራቸው ያመለክታል። ሆኖም የቃል በቃል አማራጩ በማስታወሻ ተጠብቋል።
