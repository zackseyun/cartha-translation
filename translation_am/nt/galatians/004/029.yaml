source:
  edition: SBLGNT
  text: ἀλλ’ ὥσπερ τότε ὁ κατὰ σάρκα γεννηθεὶς ἐδίωκε τὸν κατὰ πνεῦμα, οὕτως καὶ νῦν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/029.yaml
  text: But just as then the one born according to the flesh persecuted the one born according to the Spirit[b][a], so also it is now.
translation:
  language: am
  text: ነገር ግን በዚያን ጊዜ በሥጋ የተወለደው[a] በመንፈስ የተወለደውን[b] ያሳድደው እንደነበረ ሁሉ፣ አሁንም እንዲሁ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በተለመደው ሰብአዊ መንገድ የተወለደው”፤ ቃል በቃል፣ “በሥጋ የተወለደው።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በመንፈስ ያለውን።” “የተወለደውን” የሚለው ቃል በግሪኩ በሁለተኛው ሐረግ አልተደገመም፤ ትይዩነቱን ግልጽ ለማድረግ ከመጀመሪያው ሐረግ ተጨምሯል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: ነገር ግን
  rationale: ከቀደመው ሐሳብ ጋር ያለውን ንፅፅራዊ ሽግግር በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: ὥσπερ τότε ... οὕτως καὶ νῦν
  choice: በዚያን ጊዜ ... እንደነበረ ሁሉ፣ አሁንም እንዲሁ ነው
  rationale: የግሪኩን ተዛማጅ ንፅፅርና በያኔና በአሁን መካከል ያለውን የጊዜ ልዩነት ይጠብቃል።
- source_word: ὁ ... γεννηθεὶς
  choice: የተወለደው
  rationale: ስምን ተክቶ የቆመውን የግሪክ ተሳቢ አንቀጽ በግልጽና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: κατὰ σάρκα
  choice: በሥጋ
  rationale: የጳውሎስን ‘ሥጋ’ ቃልና ከመንፈስ ጋር ያለውን ንፅፅር ይጠብቃል፤ በዚህ አውድ የተለመደውን ሰብአዊ መወለድ ያመለክታል እንጂ ‘ኃጢአተኛ ተፈጥሮ’ የሚል ትርጉም አያስገባም።
- source_word: ἐδίωκε
  choice: ያሳድደው እንደነበረ
  rationale: የተራዘመውን ወይም የተደጋገመውን ያለፈ ጊዜ ጠላትነት የግሪኩን ያልተፈጸመ ጊዜ ቅርጽ በአማርኛ ያሳያል።
- source_word: τὸν κατὰ πνεῦμα
  choice: በመንፈስ የተወለደውን
  rationale: በሁለቱ ወገኖች መካከል ያለውን ትይዩነት ለአማርኛ አንባቢ ግልጽ ለማድረግ ‘የተወለደውን’ ከመጀመሪያው ሐረግ በመድገም ያቀርባል።
- source_word: πνεῦμα
  choice: መንፈስ
  rationale: በገላትያ መልእክት አውድ የተስፋውን ልጅና አማኞችን ከሚመለከተው መለኮታዊ መንፈስ ጋር ያያይዘዋል፤ የአማርኛ ፊደል የአቢይና የንዑስ ፊደል ልዩነት ስለሌለው ፍቺው ከአውዱ ይታወቃል።
- source_word: νῦν
  choice: አሁንም
  rationale: የጥንቱ ንድፍ በጳውሎስ ዘመንም መቀጠሉን ‘አሁን’ ከሚለው የጊዜ አመልካችና καί ከሚያሳየው ‘ደግሞ’ ሐሳብ ጋር ያቀርባል።
theological_decisions:
- issue: በእስማኤልና በይስሐቅ ንፅፅር ውስጥ κατὰ σάρκα የሚለው ትርጉም
  choice: በተለመደው ሰብአዊ መወለድ የተወለደ
  alternative: በኃጢአተኛ ተፈጥሮ የተወለደ
  rationale: የቅርብ አውዱ የእስማኤልን ተፈጥሯዊ መወለድ ከይስሐቅ የተስፋ መወለድ ጋር ያነፃፅራል፤ ስለዚህ ‘ሥጋ’ን በዋናው ጽሑፍ ማቆየት የቃሉን ትስስር ሳያጠፋ ያልተፈለገ የሥነ ሰብእ ፍቺ እንዳይጫንበት ያደርጋል።
- issue: πνεῦμα የሚያመለክተው
  choice: መንፈስ ቅዱስ
  alternative: የሰው መንፈስ ወይም መንፈሳዊ መርሕ
  rationale: ከተስፋው ልጅና ከአማኞች ማንነት ጋር ያለው የገላትያ መልእክት አውድ መለኮታዊውን መንፈስ ያመለክታል፤ ሆኖም ትርጉሙ የግሪኩን ቀላል ‘መንፈስ’ አገላለጽ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘በሥጋ’ እና ‘በመንፈስ’ የሚሉት ትይዩ ሐረጎች የግሪኩን ሥነ አነጋገርና ሥነ መለኮታዊ ውጥረት እንዲጠብቁ ተደርጓል።
