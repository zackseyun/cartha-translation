  rationale: በἀλλά የተገናኘውን ‘ይህ ሳይሆን ያኛው’ ንጽጽር በተፈጥሯዊ የአማርኛ አወቃቀር ያቀርባል፤ ግሪኩ የማይገልጸውን ‘ከእንግዲህ’ የሚል ጊዜያዊ ሐሳብ አይጨምርም።
- source_word: παιδίσκης
