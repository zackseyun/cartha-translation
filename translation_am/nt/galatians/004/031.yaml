  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ ቃል በቀጥታ ‘ወንድሞች’ ይላል፤ ነገር ግን በወካይነት ወንድሞችንና እኅቶችን በአንድነት ሊያመለክት ይችላል።
