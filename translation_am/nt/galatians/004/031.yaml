- source_word: τῆς ἐλευθέρας
  choice: የነጻይቱ
  rationale: በሴት ጾታ የቀረበውን ስም የሚተካ ቅጽ ጠብቆ ወደ ሣራ መመለሱን ያሳያል፤ ከ‘ባሪያይቱ’ ጋር ያለውን ሹል ንጽጽርም ይጠብቃል።
theological_decisions:
- issue: የአጋርና የሣራን ምሳሌያዊ ንጽጽር ምን ያህል በግልጽ ማቅረብ እንዳለበት
  choice: ‘የባሪያይቱ’ እና ‘የነጻይቱ’ ብሎ መተርጎም
  alternative: ‘የአገልጋይቱ … የነጻይቱ’ ወይም ‘የባሪያዋ … የነጻዋ’
  rationale: የጳውሎስ ክርክር በባርነትና በነጻነት መካከል ባለው ንጽጽር ላይ ስለሚመሠረት፣ ‘ባሪያ’ የሚለው ቃል ሐሳቡን ሳያለዝብ ይጠብቃል፤ ከጽሑፉ በላይ የሆነ የሃይማኖት ድምዳሜ አይጨምርም።
- issue: ἀδελφοί ድብልቅ ጾታ ላለው ተደራሲ ሲነገር እንዴት መተርጎም እንዳለበት
  choice: በዋናው ጽሑፍ ‘ወንድሞች ሆይ’ ብሎ ማቆየትና ሰፊውን አመልካችነት በማስታወሻ መግለጽ
  alternative: ‘ወንድሞችና እኅቶች ሆይ’ ወይም ‘ወገኖች ሆይ’
  rationale: የግሪኩን ወንድ ጾታ ያለውን የዝምድና ቅርጽ ይጠብቃል፤ ቃሉ ሴቶችንም በወካይነት ሊያካትት መቻሉን ግን ለዘመናዊ አንባቢ ያብራራል።
translation_notes:
  register: ዘመናዊ፣ ክቡር እና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ባሪያይቱ/ነጻይቱ’ የሚሉት ጥንድ ቃላት የግሪኩን ትይዩ አወቃቀርና የሴት ጾታ ማጣቀሻ ይጠብቃሉ።
