review_pass:
  verdict: revise
  source_fidelity: The draft preserves the verse’s parallel use of ζηλόω and leaves the object of ἐκκλεῖσαι appropriately unspecified. However, «በመልካም ዓላማ» narrows οὐ καλῶς to motive, whereas the Greek more broadly judges their pursuit as not good/right. The form «ሊያገልሏችሁ» is also not the standard inflection for ‘exclude you (plural).
  naturalness: «ብርቱ ፍላጎት ያሳያሉ» is understandable but less direct and natural here than an active expression of earnest pursuit. «እናንተን አጥብቀው ይፈልጋሉ» and its corresponding purpose clause are modern, clear, and retain the rhetorical symmetry.
  terminology: «አጥብቀው ይፈልጋሉ» represents the earnest, attention-seeking sense of ζηλόω without forcing a romantic meaning. «ሊያገሏችሁ» accurately renders ἐκκλεῖσαι while retaining its unexpressed point of exclusion. The footnotes preserve both the lexical range and the contextual—but not certain—interpretation.
  issues:
  - severity: medium
    issue: «በመልካም ዓላማ አይደለም» restricts οὐ καλῶς to intention.
    rationale: The phrase evaluates the manner/quality of their pursuit and can include motive, but does not explicitly say ‘purpose.’ «በመልካም መንገድ አይደለም» is broader.
  - severity: medium
    issue: «ሊያገልሏችሁ» is an irregular/incorrect form in this context.
    rationale: For ‘they want to exclude you’ with a plural second-person object, the standard form is «ሊያገሏችሁ».
  revised_text: እነርሱ እናንተን አጥብቀው ይፈልጋሉ[a]፤ ነገር ግን በመልካም መንገድ አይደለም። ይልቁንም እናንተን ሊያገሏችሁ[b] ይፈልጋሉ፤ ይህም እናንተ እነርሱን አጥብቃችሁ እንድትፈልጉ ነው።
