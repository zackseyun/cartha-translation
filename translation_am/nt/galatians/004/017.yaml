  text: They are zealous for you[a], but not in a good way. Rather, they want to shut you out[b], so that you may be zealous for them.
translation:
  language: am
  text: እነርሱ እናንተን አጥብቀው ይፈልጋሉ[a]፤ ነገር ግን በመልካም መንገድ አይደለም። ይልቁንም እናንተን ሊያገሏችሁ[b] ይፈልጋሉ፤ ይህም እናንተ እነርሱን አጥብቃችሁ እንድትፈልጉ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ስለ እናንተ ይቀናሉ»። የግሪኩ ግስ አጥብቆ መፈለግን ወይም የአንድን ሰው ቀልብና ድጋፍ ለማግኘት መጣርንም ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «ከውጭ ሊያስቀሯችሁ»። ምናልባት ከጳውሎስና ከባልደረቦቹ ለይተው፣ በምትኩ እነርሱን እንድትፈልጉ ማድረግ ይፈልጋሉ።
    reason: alternative_reading
lexical_decisions:
- source_word: ζηλοῦσιν / ζηλοῦτε
  choice: ብርቱ ፍላጎት ያሳያሉ / ብርቱ ፍላጎት እንድታሳዩ
  rationale: ζηλόω ቅንዓትን፣ ጽኑ ፍላጎትን ወይም የሌላውን ቀልብና ድጋፍ ለማግኘት መጣርን ሊገልጽ ይችላል። «ብርቱ ፍላጎት ማሳየት» የፍቅር ግንኙነት ትርጉምን ሳያስገድድ የሐሰተኛ መምህራኑን የራስ ጥቅም ፍለጋ ያሳያል፤ በሁለቱም አጠቃቀሞች ተመሳሳይ አገላለጽ በመጠቀም የግሪኩን የንግግር ትይዩነት ይጠብቃል።
- source_word: οὐ καλῶς
  choice: በመልካም ዓላማ አይደለም
  rationale: ቃሉ ተግባራቸው በአሠራር ወይም በዓላማ ትክክል አለመሆኑን ሊያመለክት ይችላል። ዐውዱ ተንኮለኛ ዓላማቸውን ስለሚገልጥ፣ ይህ አገላለጽ በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: ἐκκλεῖσαι
  choice: ሊያገልሏችሁ
  rationale: ἐκκλείω «ከውጭ ማስቀረት፣ ማግለል» ማለት ነው። «ማግለል» ማህበራዊና ግንኙነታዊ ርቀትን ያሳያል፤ ነገር ግን ከማን ወይም ከምን እንደሚያገልሏቸው ጽሑፉ ያልገለጠውን አይጨምርም።
- source_word: ἵνα
  choice: ይህም … እንድታሳዩ ነው
  rationale: የዓላማ አንቀጽን በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: ἐκκλεῖσαι ὑμᾶς የሚለው የማግለል ነገር
  choice: ዋናው ጽሑፍ «እናንተን ሊያገልሏችሁ» ብሎ ከማን ወይም ከምን እንደሆነ ሳይወስን ያስቀምጠዋል።
  alternative: ከጳውሎስና ከባልደረቦቹ ሊለዩአቸው ወይም ከእግዚአብሔር በረከትና ከቤተ ክርስቲያን ሊያስወጡአቸው።
  rationale: ቁጥር 16–20 የጳውሎስንና የገላትያ ሰዎችን ግንኙነት እንዲሁም የተቀናቃኝ መምህራንን ተጽዕኖ ያተኩራል። የዓላማው አንቀጽም ገላትያውያን እነዚያን ሰዎች እንዲፈልጉ ያለመ ግንኙነታዊ ማግለልን ይደግፋል፤ ሆኖም ከምን እንደሚያገልሏቸው ግሪኩ በግልጽ አይናገርም።
