  register: ዘመናዊ፣ ግልጽና ክቡር አማርኛ ተጠቅሟል። «እነርሱ/እናንተ» የሚለው ትይዩ አገላለጽ የግሪኩን ንጽጽር ይጠብቃል፤ የግሱ ሁለት ጊዜ መደገምም በአንድ ዓይነት አገላለጽ ተንጸባርቋል።
