  revision_rationale: The revision preserves the source’s present apprehension (φοβοῦμαι), its uncertain feared possibility (μή πως), Paul’s already-performed strenuous labor (κεκοπίακα), and its possible futility (εἰκῇ). It removes the future-oriented and repetitive wording while retaining the directional sense of εἰς ὑμᾶς (“ለእናንተ”).
