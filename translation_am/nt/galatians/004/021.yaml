source:
  edition: SBLGNT
  text: Λέγετέ μοι, οἱ ὑπὸ νόμον θέλοντες εἶναι, τὸν νόμον οὐκ ἀκούετε;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/021.yaml
  text: Tell me[a], you who want to be under the law, do you not listen to the law?
translation:
  language: am
  text: እስቲ ንገሩኝ፤ እናንተ ከሕግ በታች መሆን የምትፈልጉ፣ ሕጉን አትሰሙምን?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ሕጉን አታዳምጡምን?» ተብሎም ሊተረጎም ይችላል። የግሪኩ ግስ «መስማት» ወይም «አዳምጦ ልብ ማለት» ማለት ሊሆን ይችላል። «ሕጉ» የሙሴን ሕግ፣ በተለይም ጳውሎስ ቀጥሎ የሚጠቅሰውን በመጽሐፍ የተጻፈ ታሪክ የሚያመለክት ይመስላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγετέ μοι
  choice: እስቲ ንገሩኝ
  rationale: የብዙ ሰዎች ትእዛዝ የሆነውን አገላለጽ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል፤ «እስቲ» የጳውሎስን ቀጥተኛ ጥያቄና ተግዳሮት ያሳያል።
- source_word: οἱ ὑπὸ νόμον θέλοντες εἶναι
  choice: እናንተ ከሕግ በታች መሆን የምትፈልጉ
  rationale: ቡድኑን በፍላጎታቸው የሚለየውን የግሪክ አገላለጽ በግልጽ መንገድ ይጠብቃል፤ «ከሕግ በታች» የሚለውም የጳውሎስን ሕጋዊና የቃል ኪዳን ፈሊጥ ይጠብቃል።
- source_word: νόμον / τὸν νόμον
  choice: ሕግ / ሕጉን
  rationale: በሁለቱም ቦታዎች አንድ ቃል በመጠቀም፣ ከሕግ በታች መሆንንና ሕጉን መስማትን የሚያገናኘውን የጳውሎስ የቃል ጨዋታ ይጠብቃል።
- source_word: οὐκ ἀκούετε
  choice: አትሰሙምን?
  rationale: «መስማት» በአማርኛም ድምፅን መስማትንና ለተባለው ትኩረት መስጠትን ሊያመለክት ስለሚችል፣ የግሪኩን እውነተኛ የትርጉም ስፋት ይጠብቃል።
theological_decisions:
- issue: «ሕግ» የሚያመለክተው
  choice: «ሕግ/ሕጉ» ተብሎ ተተርጉሟል፤ የሙሴን ሕግና ጳውሎስ ቀጥሎ የሚጠቅሰውን የመጽሐፍ ክፍል ሁለቱንም እንዲያስችል ተደርጓል።
  alternative: ሁለተኛውን ብቻ «የሙሴ ሕግ» ወይም «ኦሪት» ብሎ በግልጽ መጥቀስ።
  rationale: ጳውሎስ νόμοςን ሰዎቹ ከበታቹ ሊሆኑ እንደሚፈልጉት ሥርዓትም፣ ሊሰሙት እንደሚገባ የመጽሐፍ ቃልም ይጠቀምበታል። ትርጉሙ ይህን ውጥረት አልጠበበውም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ ነው። «እስቲ ንገሩኝ» የንግግር ተፈጥሯዊነትን ሲጠብቅ፣ ሰሚዎቹን በቀጥታ የሚጋፈጠውን ድምፅ አያለዝብም።
