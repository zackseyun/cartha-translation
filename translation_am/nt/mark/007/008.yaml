id: MRK.7.8
reference: Mark 7:8
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀ἀφέντες τὴν ἐντολὴν τοῦ θεοῦ κρατεῖτε τὴν παράδοσιν τῶν ⸀ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/008.yaml
  text: Leaving the commandment of God[a], you hold fast to the tradition of men.
translation:
  language: am
  text: የእግዚአብሔርን ትእዛዝ ትታችሁ የሰዎችን ወግ አጥብቃችሁ ትይዛላችሁ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφέντες
  choice: ትታችሁ
  rationale: የዋናው ግስ ድርጊት ሲፈጸም የእግዚአብሔር ትእዛዝ ወደ ጎን መተዉን የሚገልጸውን የአኦሪስት ተካፋይ ቅርጽ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ‘በመተው’ ከሚለውም ይበልጥ ቀጥተኛ ነው።
- source_word: ἐντολὴν
  choice: ትእዛዝ
  rationale: በዚህ ሃይማኖታዊ ክርክር ውስጥ ከእግዚአብሔር የመጣውን ግዴታ ያለበት ትእዛዝ በግልጽና በክብር ይገልጻል።
- source_word: τοῦ θεοῦ
  choice: የእግዚአብሔርን
  rationale: ትእዛዙ የማን እንደሆነና ምንጩ መለኮታዊ መሆኑን የግሪኩን የባለቤትነት ግንኙነት በቀጥታ ያሳያል።
- source_word: κρατεῖτε
  choice: አጥብቃችሁ ትይዛላችሁ
  rationale: ተራ መከተልን ሳይሆን በጽናት መጣበቅን የሚያመለክተውን κρατέω ያስተላልፋል።
- source_word: παράδοσιν
  choice: ወግ
  rationale: ከቀደሙት ትውልዶች የተላለፈን ሰብአዊ ልማድ በተፈጥሯዊና በቀላሉ በሚገባ ዘመናዊ አማርኛ ይገልጻል፤ ‘ትውፊት’ም ሊባል ይችላል።
- source_word: ἀνθρώπων
  choice: ሰዎች
  rationale: ቃሉ ወንዶችን ብቻ ሳይሆን ሰውን በአጠቃላይ ያመለክታል። ‘ሰዎች’ የሰብአዊውንና የመለኮታዊውን ንጽጽር በትክክል ይጠብቃል።
theological_decisions:
- issue: በመለኮታዊ ትእዛዝና በሰብአዊ ወግ መካከል ያለው ንጽጽር
  choice: ‘የእግዚአብሔርን ትእዛዝ’ እና ‘የሰዎችን ወግ’ የሚለውን ቀጥተኛ ተቃርኖ መጠበቅ
  alternative: ንጽጽሩን በማለስለስ ‘የተለመደውን ልማድ’ ማለት
  rationale: የቁጥሩ ዋና ነጥብ ሰዎች ያስተላለፉትን ወግ ከእግዚአብሔር ትእዛዝ በላይ ማስቀደማቸውን መገሠጽ ነው። ይህ አተረጓጎም ንጽጽሩን ይጠብቃል፤ ነገር ግን ጥቅሱ ከሚለው አልፎ ሁሉንም ወግ እንደሚኮንን አያቀርበውም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ወግ’ በተፈጥሯዊ አገላለጽ የተላለፈ ልማድን ይገልጻል፤ ‘አጥብቃችሁ ትይዛላችሁ’ ደግሞ የግሪኩን የጽኑ መጣበቅ ስሜት ይጠብቃል።
