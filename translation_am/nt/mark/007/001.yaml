  language: am
  text: ፈሪሳውያንና ከጸሐፍት መካከል አንዳንዶች ከኢየሩሳሌም መጥተው ወደ እርሱ ተሰበሰቡ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: በአማርኛው በተናጠል አልተተረጎመም
  rationale: በማርቆስ ትረካ ውስጥ καί ብዙ ጊዜ የትረካ ቅጥያ ነው፤ እዚህ «እና» ብሎ መጀመር በዘመናዊ አማርኛ ያልተፈጥሯዊ ስለሆነ የቅጥያው ኃይል በአውዱ እንዲገኝ ተደርጓል።
- source_word: συνάγονται πρὸς αὐτὸν
  choice: ወደ እርሱ ተሰበሰቡ
  rationale: πρός ከተሳቢ ጋር ወደ ኢየሱስ የሚያመራውን እንቅስቃሴና ከእርሱ ጋር መሰባሰብን ያሳያል። የግሪኩ ትረካዊ የአሁን ጊዜ በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜ ተተርጉሟል።
- source_word: οἱ Φαρισαῖοι
  choice: ፈሪሳውያን
  rationale: ለዚህ የአይሁድ ቡድን በአማርኛ የተለመደው ቅርጽ ነው።
- source_word: τινες τῶν γραμματέων
  choice: ከጸሐፍትም አንዳንዶቹ
  rationale: የክፍል አመልካቹን የግሪክ አገባብ በግልጽ ይጠብቃል፤ የተጠቀሱት ጸሐፍት ሁሉ ሳይሆኑ ከእነርሱ የተወሰኑት ናቸው።
- source_word: γραμματέων
  choice: ጸሐፍት
  rationale: የγραμματεῖςን ቀጥተኛና በወንጌላት አማርኛ የተለመደ ስያሜ ይጠብቃል፤ «የሕግ መምህራን» የሚለው ሙያቸውን የሚያብራራ ነገር ግን የበለጠ ትርጓሜያዊ ነው።
- source_word: ἐλθόντες ἀπὸ Ἱεροσολύμων
  choice: ከኢየሩሳሌም መጥተው
  rationale: ተሳቢው ድርጊት ከዋናው የመሰብሰብ ድርጊት በፊት መሆኑን በተፈጥሯዊ የአማርኛ ተከታታይ ግስ ያሳያል።
