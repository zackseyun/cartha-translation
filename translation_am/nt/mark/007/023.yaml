  text: πάντα ταῦτα τὰ πονηρὰ ἔσωθεν ἐκπορεύεται καὶ κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/023.yaml
  text: All these evil things come out from within and defile the man[a].
translation:
  language: am
  text: እነዚህ ክፉ ነገሮች ሁሉ ከውስጥ ይወጣሉ፤ ሰውንም ያረክሳሉ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντα ταῦτα τὰ πονηρά
  choice: እነዚህ ክፉ ነገሮች ሁሉ
  rationale: የግሪኩን አጽንዖትና አጠቃላይነት በተፈጥሯዊ አማርኛ ያስተላልፋል፤ በቀደመው ክፍል የተዘረዘሩትን ክፋቶች ያመለክታል።
- source_word: ἔσωθεν
  choice: ከውስጥ
  rationale: የነገሮቹን ውስጣዊ ምንጭ በአጭርና በተለመደ አገላለጽ ያሳያል።
- source_word: ἐκπορεύεται
  choice: ይወጣሉ
  rationale: የግሪኩ ግስ ከገለልተኛ ብዙ ቁጥር ባለቤት ጋር በነጠላ ቢመጣም፣ አማርኛ ከብዙ ቁጥሩ ‘ነገሮች’ ጋር የሚስማማውን ብዙ ቁጥር ግስ ይፈልጋል።
- source_word: κοινοῖ
  choice: ያረክሳሉ
  rationale: በዚህ የንጽሕና አውድ ውስጥ ግሱ ሰውን ርኩስ ማድረግን ያመለክታል፤ ‘ያረክሳሉ’ ሥነ ሥርዓታዊና ሥነ ምግባራዊ ትርጉሙን ይይዛል።
- source_word: τὸν ἄνθρωπον
  choice: ሰውን
  rationale: ‘ሰውን’ በአማርኛ ለአንድ የሰው ልጅ በአጠቃላይ የሚሰጥ ተፈጥሯዊ ነጠላ አገላለጽ ነው፤ የግሪኩን አጠቃላይ ሰብአዊ ማጣቀሻ ያለ አላስፈላጊ የፆታ ገደብ ያስተላልፋል።
theological_decisions:
- issue: τὸν ἄνθρωπον በሰው ርኩሰት ላይ በሚናገር አጠቃላይ ዐረፍተ ነገር ውስጥ መተርጎም
  choice: ሰውን
  alternative: ወንዱን / የሰው ልጅን
  rationale: ἄνθρωπος እዚህ የተወሰነ ወንድን ሳይሆን ማንኛውንም ሰው በወካይ ነጠላ ቁጥር ያመለክታል። ‘ሰውን’ ነጠላነቱንና አጠቃላይ ኃይሉን በተፈጥሯዊ አማርኛ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር አማርኛ ተጠቅሟል። በአማርኛ ‘ሰውን’ የሚለው አጠቃላይ ሰብአዊ ትርጉም ግልጽ ስለሆነ የእንግሊዝኛውን የፆታ አማራጭ ለማብራራት የግርጌ ማስታወሻ አያስፈልግም።
