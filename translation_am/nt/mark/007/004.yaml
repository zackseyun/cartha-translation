  verdict: revise
  source_fidelity: The draft correctly renders the marketplace setting, the ritual-washing sense of βαπτίσωνται and βαπτισμοί, and the included SBLGNT reading καὶ κλινῶν. However, the Amharic expression for the received practices is syntactically awkward, and “የመመገቢያ መደገፊያዎች” does not naturally denote κλῖναι.
  naturalness: “ሊጠብቋቸው የተቀበሏቸው” is not idiomatic in this construction; “እንዲጠብቁ የተቀበሏቸው” is clear and natural. The utensil-washing list is more naturally introduced as “...ማጠቦች።” “የመመገቢያ አልጋዎች” intelligibly represents the ancient reclining couches without calling them mere supports.
  terminology: “መታጠብ/ማጠቦች” appropriately avoids importing Christian-baptism terminology. “የናስ ዕቃዎች” is acceptable for χαλκίων. “ማሰሮዎች” is a reasonable general rendering of ξεστῶν. The revised wording retains “የመመገቢያ አልጋዎች” for κλινῶν and preserves the textual-variant note.
  issues:
  - severity: medium
    issue: Awkward construction for παρέλαβον κρατεῖν
