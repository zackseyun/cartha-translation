base_translation:
  language: en
  yaml_path: translation/nt/mark/007/004.yaml
  text: 'And when they come from the marketplace[a], they do not eat unless they wash themselves[b], and there are many other things that they have received to keep: washings of cups and pitchers and copper vessels and dining couches—'
translation:
  language: am
  text: ከገበያም ሲመለሱ ራሳቸውን ካልታጠቡ[a] በስተቀር አይበሉም። እንዲጠብቁ የተቀበሏቸው ሌሎች ብዙ ነገሮችም አሉ፤ እነርሱም የጽዋዎችን፣ የማሰሮዎችን፣ የናስ ዕቃዎችንና የመመገቢያ አልጋዎችን[b] ማጠቦች ናቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ራሳቸውን ካላጠመቁ” ተብሎም ሊተረጎም ይችላል። ግሪክኛው ቃል ብዙ ጊዜ “ማጥመቅ” ተብሎ የሚተረጎመው ግስ ነው፤ እዚህ ግን ከንጽሕና ልማዶች ጋር የተያያዘ ሥርዓታዊ መታጠብን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: አንዳንድ የጥንት የእጅ ጽሑፎች “እና የመመገቢያ አልጋዎችን” የሚለውን አያካትቱም።
    reason: textual_variant
lexical_decisions:
- source_word: ἀγορᾶς
  choice: ገበያ
  rationale: ቃሉ የሕዝብ መገበያያ ስፍራን ያመለክታል፤ “ገበያ” በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: βαπτίσωνται
  choice: ራሳቸውን ካልታጠቡ
  rationale: የግሱን መካከለኛ ድምፅ በ“ራሳቸውን” ያንጸባርቃል፤ በዚህ የሥርዓታዊ ንጽሕና አውድ “መታጠብ” ከክርስቲያናዊ ጥምቀት ጋር ያልተፈለገ ግንኙነት አይፈጥርም። የ“ማጥመቅ” አማራጭ በእግር ማስታወሻ ተጠብቋል።
- source_word: παρέλαβον κρατεῖν
  choice: ሊጠብቋቸው የተቀበሏቸው
  rationale: ወጉን መቀበልና አጥብቆ መጠበቅ የሚሉትን ሁለቱንም ገጽታዎች በቅርበት ይገልጻል።
- source_word: βαπτισμοὺς
  choice: ማጠብ
  rationale: በዕቃዎች ላይ የሚደረጉ ሥርዓታዊ እጥበቶችን ይገልጻል፤ “ጥምቀቶች” የሚለው በዚህ አውድ የተሳሳተ ሃይማኖታዊ ግንዛቤ ሊፈጥር ይችላል።
- source_word: ξεστῶν
  choice: ማሰሮዎች
  rationale: ቃሉ እንደ እንስራ፣ ማሰሮ ወይም መቅጃ ያለ ዕቃ ሊያመለክት ይችላል፤ “ማሰሮዎች” ሳያጠብ ተፈጥሯዊ አማርኛ ይሰጣል።
- source_word: χαλκίων
  choice: የናስ ዕቃዎች
  rationale: ከመዳብ ወይም ከመዳብ ቅይጥ የተሠሩ ዕቃዎችን የሚያመለክት ግልጽና የተለመደ አማርኛ ነው።
- source_word: κλινῶν
  choice: የመመገቢያ መደገፊያዎች
  rationale: κλίνη አልጋን ወይም መደገፊያ ሶፋን ሊያመለክት ይችላል፤ በዚህ የምግብ አውድ ሰዎች ተደግፈው የሚመገቡባቸውን ዕቃዎች ያመለክታል።
- source_word: ἄλλα πολλά
  choice: ሌሎች ብዙ ነገሮች
  rationale: የግሪክኛውን ሰፊ አገላለጽ ሳያጠብ ይጠብቃል፤ “ልማዶች” ወይም “ወጎች” ማለት ጽሑፉን ከሚለው በላይ ይወስነዋል።
theological_decisions:
- issue: በሥርዓታዊ ንጽሕና አውድ የβαπτίσωνται / βαπτισμοὺς ትርጉም
  choice: “መታጠብ / ማጠብ” ተብሎ ተተርጉሟል።
  alternative: “ራሳቸውን ማጥመቅ / ጥምቀቶች”
  rationale: ክፍሉ ስለ ፈሪሳውያን የንጽሕና ልማዶች እንጂ ስለ ክርስቲያናዊ ጥምቀት አይናገርም። “መታጠብ” ይህን አውድ ይጠብቃል፤ የመጥለቅ ወይም የማጥመቅ ትርጉም ግን በማስታወሻ ተገልጿል።
- issue: καὶ κλινῶν የሚለው የጽሑፍ ልዩነት
  choice: በዋናው ጽሑፍ ተካትቶ የጽሑፍ ልዩነቱ በእግር ማስታወሻ ተገልጿል።
  alternative: “እና የመመገቢያ መደገፊያዎችን” የሚለውን ከዋናው ጽሑፍ ማስወገድ
  rationale: SBLGNT ሐረጉን በጽሑፉ ውስጥ ያካትታል፣ ነገር ግን ጉልህ የእጅ ጽሑፍ ልዩነት አለ፤ ሁለቱም መረጃዎች በግልጽ ተጠብቀዋል።
