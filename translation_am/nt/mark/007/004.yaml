  - severity: medium
    issue: Inadequate rendering of κλινῶν
    rationale: “የመመገቢያ መደገፊያዎች” normally suggests objects used for support rather than couches/beds. “የመመገቢያ አልጋዎች” better communicates reclining dining couches.
