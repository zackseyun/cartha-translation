  text: ባስተላለፋችሁት[b] ወጋችሁ የእግዚአብሔርን ቃል ከንቱ ታደርጋላችሁ[a]፤ እንዲህ ያሉ ብዙ ተመሳሳይ ነገሮችንም[c] ታደርጋላችሁ።
  philosophy: optimal-equivalence
  footnotes:
