  register: ዘመናዊ፣ የተከበረና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ወግ’ በዐውዱ የተላለፈ ልማድን ወይም ትምህርትን የሚገልጥ ሲሆን፣ ከምንጩ በላይ የቤተ እምነት ፍቺ አልተጫነበትም።
