lexical_decisions:
- source_word: ἀκυροῦντες
  choice: ከንቱ ታደርጋላችሁ
  rationale: ቃሉ አንድን ነገር ኃይል አልባ ወይም የማይሠራ ማድረግን ያመለክታል። ይህ አተረጓጎም የእግዚአብሔር ቃል ሥልጣንና ተግባራዊ ውጤት እንደተሻረ የሚያሳየውን ክስ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: የእግዚአብሔርን ቃል
  rationale: የግሪኩን የባለቤትነት አወቃቀር በቀጥታ የሚያንጸባርቅ ሲሆን፣ በዐውዱም መለኮታዊውን ትእዛዝና ትምህርት ያመለክታል።
- source_word: τῇ παραδόσει ὑμῶν
  choice: በ…ወጋችሁ
  rationale: መሣሪያዊውን የዳቲቭ ትርጉም ‘በ’ ይገልጣል፤ ‘ወጋችሁ’ ደግሞ ጽሑፉ በቀጥታ ያለውን ‘የእናንተ ወግ’ ያስተላልፋል።
- source_word: ᾗ παρεδώκατε
  choice: ባስተላለፋችሁት
  rationale: ወጉ እነርሱ ለሌሎች ያስተላለፉት መሆኑን በአጭርና ተፈጥሯዊ አማርኛ ያሳያል፤ ከ‘ወግ’ ጋር ያለውን የቃላት ግንኙነትም ይጠብቃል።
- source_word: παρόμοια τοιαῦτα πολλὰ
  choice: ይህን የመሰሉ ሌሎች ብዙ ነገሮችንም
  rationale: በግሪኩ ያለውን አጽንዖት ሳያጠፋ፣ በአማርኛ የሚፈጠርን አላስፈላጊ ድግግሞሽ ያስወግዳል።
- source_word: ποιεῖτε
  choice: ታደርጋላችሁ
  rationale: የአሁን ጊዜው ግስ የተለመደና ቀጣይ ተግባርን ስለሚገልጥ፣ ቀላሉ የአሁን ጊዜ አተረጓጎም ተመርጧል።
theological_decisions:
- issue: በኢየሱስ ክስ ውስጥ ‘ወግ’ የሚለው ቃል ባሕርይ
  choice: ጽሑፉ እንዳለው ‘ወጋችሁ’ ተብሎ ተተርጉሟል፤ ይህ የተለየ ወግ ከእግዚአብሔር ቃል ጋር እንደተቃረነ ዐውዱ እንዲያሳይ ተደርጓል።
  alternative: ‘የሰው ወጋችሁ’ ብሎ በግልጽ መጨመር።
  rationale: በዚህ ቁጥር የግሪኩ ጽሑፍ ‘የእናንተ ወግ’ ይላል እንጂ ‘የሰው’ የሚል ቅጽል የለውም። ስለዚህ ምንጩ ያልጨመረውን ሥነ መለኮታዊ ማብራሪያ ወደ ዋናው ጽሑፍ አልገባም።
