  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀καὶ ἐπερωτῶσιν αὐτὸν οἱ Φαρισαῖοι καὶ οἱ γραμματεῖς· Διὰ τί ⸂οὐ περιπατοῦσιν οἱ μαθηταί σου⸃ κατὰ τὴν παράδοσιν τῶν πρεσβυτέρων, ἀλλὰ ⸀κοιναῖς χερσὶν ἐσθίουσιν τὸν ἄρτον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/005.yaml
  text: And the Pharisees and the scribes asked him[a], “Why do your disciples not walk according to the tradition of the elders, but eat bread with unclean hands?”
translation:
  language: am
  text: ፈሪሳውያንና ጸሐፍትም፣ “ደቀ መዛሙርትህ የሽማግሌዎችን ወግ የማይከተሉት፣ ነገር ግን በረከሱ እጆች[a] እንጀራ የሚበሉት ለምንድር ነው?” ብለው ጠየቁት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “በተራ እጆች”፤ ይህም በሥርዓት ረገድ የረከሱ እጆችን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπερωτῶσιν
  choice: ጠየቁት
  rationale: ታሪካዊ የአሁን ጊዜውን በተፈጥሯዊ የአማርኛ ትረካ በኃላፊ ጊዜ ያቀርባል።
- source_word: γραμματεῖς
  choice: ጸሐፍት
  rationale: በወንጌላት አውድ የሕግ ሊቃውንት የሆኑትን የታወቀ ቡድን የሚጠቁም መደበኛ የመጽሐፍ ቅዱስ ቃል ነው።
- source_word: περιπατοῦσιν
  choice: የማይኖሩት
  rationale: ቃሉ በቀጥታ ‘መራመድ’ ቢሆንም እዚህ የአኗኗርን ወይም የተግባርን ሁኔታ ያመለክታል፤ ‘ይኖራሉ’ በአማርኛ ፈሊጡን በግልጽ ያስተላልፋል።
- source_word: κατὰ τὴν παράδοσιν τῶν πρεσβυτέρων
  choice: የሽማግሌዎችን ወግ ተከትለው
  rationale: κατά የሚያመለክተውን ከተቀመጠ መሥፈርት ጋር መስማማት ያስተላልፋል፤ ‘የሽማግሌዎች’ የሚለውም የግሪኩን ገንዘብ ሳይተረጉም ይጠብቃል።
- source_word: κοιναῖς χερσὶν
  choice: በረከሱ እጆች
  rationale: κοινός እዚህ አካላዊ ቆሻሻነትን ሳይሆን በሥርዓት ረገድ መርከስን ያመለክታል። የግሪኩ ‘የጋራ/ተራ’ የሚለው ቀጥተኛ ትርጉም በአማርኛ ይህን ፍቺ አያስተላልፍም።
- source_word: ἄρτον
  choice: እንጀራ
  rationale: ἄρτος በቀጥታ እንጀራ/ዳቦ ማለት ነው፤ እዚህ ምግብን በአጠቃላይ ሊወክል ቢችልም የምንጩን የተወሰነ ስም ይጠብቃል።
theological_decisions:
- issue: κοινός የሚያመለክተው የሥርዓት ሁኔታ
  choice: በረከሱ እጆች
  alternative: ባልነጹ እጆች፤ በተራ እጆች
  rationale: ክርክሩ ስለ ንጽሕና ወግና ሥርዓታዊ መርከስ እንጂ ስለ አካላዊ ቆሻሻነት ወይም ስለ ሞራላዊ ክፋት አይደለም። ትርጉሙ ይህን ልዩነት ይጠብቃል።
- issue: περιπατέω ያለው የአኗኗር ፈሊጣዊ ፍቺ
  choice: ተከትለው የማይኖሩት
  alternative: የማይሄዱት፤ የማይመላለሱት
  rationale: ቃሉን በቀጥታ ‘መራመድ’ ማለት በአማርኛ የአካላዊ እንቅስቃሴ ግንዛቤን ሊያስከትል ይችላል፤ እዚህ ግን የተግባር ሥርዓትን ያመለክታል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ረጅም ጥያቄ በተፈጥሯዊ የአማርኛ አገባብ ቀርቦ፣ የሥርዓታዊ ርኩሰት ፍቺ በማስታወሻ ተብራርቷል።
