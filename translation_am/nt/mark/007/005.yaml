review_pass:
  verdict: revise
  source_fidelity: The verse’s participants, question, contrast, tradition of the elders, ritual sense of κοινός, and ‘bread’ are all represented. However, ‘የሽማግሌዎችን ወግ ተከትለው የማይኖሩት’ can imply that the disciples follow the tradition but do not live, rather than that they do not conduct themselves in accordance with it.
  naturalness: The sentence is otherwise clear and appropriately formal. Recasting the idiom as ‘የማይከተሉት’ is more idiomatic and removes the scope ambiguity created by ‘ተከትለው የማይኖሩት.’
  terminology: ‘ፈሪሳውያን,’ ‘ጸሐፍት,’ ‘ወግ,’ and ‘እንጀራ’ are suitable. ‘በረከሱ እጆች’ adequately conveys ritual defilement, while the footnote correctly distinguishes the literal sense of κοινός from physical dirtiness or moral evil.
  issues:
  - severity: medium
    issue: Scope ambiguity in the rendering of περιπατοῦσιν κατὰ τὴν παράδοσιν
    rationale: The participial wording ‘ወግ ተከትለው የማይኖሩት’ may be read as ‘while following the tradition, they do not live,’ which is not the intended accusation. The Greek means that their conduct is not in conformity with the tradition.
