  text: ὑμεῖς δὲ λέγετε· Ἐὰν εἴπῃ ἄνθρωπος τῷ πατρὶ ἢ τῇ μητρί· Κορβᾶν, ὅ ἐστιν Δῶρον, ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/011.yaml
  text: But you say[a], ‘If a man says to his father or his mother, “Corban” (that is, a gift)[b], whatever you might have benefited from me—’
translation:
  language: am
  text: እናንተ ግን እንዲህ ትላላችሁ፤ “አንድ ሰው ለአባቱ ወይም ለእናቱ፣ ‘ቍርባን[a]’—ማለትም፣ ‘ስጦታ’[b]—ከእኔ ልትጠቀምበት የምትችለው ማንኛውም ነገር ቢል፣”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ቍርባን” ማለት ለእግዚአብሔር ስጦታ እንዲሆን የተለየ፣ ስለዚህም ለቤተሰብ መደበኛ ጥቅም የማይውል ነገር ነው።
    reason: cultural_note
  - marker: b
    text: ወይም፣ “መባ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: እናንተ ግን እንዲህ ትላላችሁ
  rationale: ግን ከቀደመው ንግግር ጋር ያለውን ንፅፅር ያሳያል፤ እንዲህ ደግሞ ቀጥተኛውን ንግግር በተፈጥሯዊ አማርኛ ያስገባል።
- source_word: Ἐὰν εἴπῃ ἄνθρωπος
  choice: አንድ ሰው ... ቢል
  rationale: ἐὰν ከንዑስ አንቀጽ ጋር የሚያቀርበውን ሁኔታዊ ምሳሌ በተፈጥሯዊው የአማርኛ ቢ- ቅርጽ ይገልጣል፤ ἄνθρωπος እዚህ አጠቃላይ ወካይ ስለሆነ “ሰው” ተብሏል።
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: አባቱን ወይም እናቱን
  rationale: በአማርኛ “አንድን ሰው እንዲህ አለው” በሚለው ተፈጥሯዊ አወቃቀር ተቀባዩ በተሳቢ ቅጥያ ይቀርባል፤ ሁለቱም የዝምድና ቃላት ተጠብቀዋል።
- source_word: Κορβᾶν
  choice: ቍርባን
  rationale: ግሪክ ጽሑፉ ራሱ የሴማዊውን ቃል በድምፅ አስተላልፎ ከዚያ ይተረጉመዋል። “ቍርባን” በአማርኛ የታወቀውን ታሪካዊ ቃል ይጠብቃል፤ ትርጉሙም በጽሑፉና በማስታወሻው ተገልጧል።
- source_word: ὅ ἐστιν Δῶρον
  choice: ይህም ‘ስጦታ’ ማለት ነው
  rationale: የማርቆስን ማብራሪያ በግልጽ ሁኔታ ያቀርባል። δῶρον በቀጥታ “ስጦታ” ሲሆን “መባ” የሚለው አማራጭ የአምልኮ አውዱን ይጠቁማል።
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: ከእኔ ልትጠቀምበት የምትችለው ማንኛውም ነገር
  rationale: ὃ ἐὰν ያለው ያልተወሰነ አንጻራዊ ትርጉም “ማንኛውም ነገር” ተብሎ ተላልፏል፤ ὠφεληθῇς የመርዳትንና የመጥቀምን ሰፊ ሐሳብ እንዳያጠብ በ“ልትጠቀምበት” ተተርጉሟል።
theological_decisions:
- issue: በቤተ መቅደስ ስጦታ መለየትና በሰው ወግ አውድ ውስጥ የΚορβᾶν አተረጓጎም
  choice: “ቍርባን” የሚለውን ታሪካዊ ቃል በዋናው ጽሑፍ ማቆየትና “ስጦታ” ብሎ መግለጽ
  alternative: በዋናው ጽሑፍ “ለእግዚአብሔር የተሰጠ መባ” ብሎ በቀጥታ መተርጎም
  rationale: የግሪኩ ጽሑፍ የሴማዊውን ቃል አቆይቶ ራሱ ስለሚያብራራው፣ ይህ አቀራረብ ታሪካዊና ሃይማኖታዊ ልዩነቱን ይጠብቃል፤ ጽሑፉ ከሚናገረው በላይ ስለ ስእለቱ ሕጋዊ አሠራር የተወሰነ ትርጓሜ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ቍርባን የሚለው ቃል ታሪካዊ ቅርጹን ሲጠብቅ በዋናው ጽሑፍና በእግር ማስታወሻ ተብራርቷል። የመጨረሻው ሰረዝ ሐሳቡ በቁጥር 12 እንደሚቀጥል ያመለክታል።
