review_pass:
  verdict: revise
  source_fidelity: The draft conveys the conditional example and the sense of potential benefit from the speaker. However, it relocates Mark’s explanatory gloss (“that is, a gift”) to after the quoted formula, whereas the Greek places it immediately after Κορβᾶν and before the relative clause. The revised wording restores that sequence while retaining the verse’s intentionally incomplete syntax, which continues in v. 12.
  naturalness: “ለአባቱ ወይም ለእናቱ” is the clearest modern Amharic way to mark the addressee after “ቢል.” The revised punctuation and appositional wording are readable while preserving the source’s formula-like, unfinished construction.
  terminology: “ቍርባን” appropriately preserves the Semitic loanword retained in Greek. “ስጦታ” is the direct equivalent of δῶρον; “መባ” remains a suitable lexical alternative in the footnote. The cultural note appropriately explains dedication to God without claiming more about the vow’s legal operation than the passage states.
  issues:
  - severity: medium
    issue: The Markan gloss is placed after the complete quoted formula rather than immediately after “ቍርባን.”
    rationale: In Greek, “Κορβᾶν, ὅ ἐστιν Δῶρον” precedes “ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς.” Moving the gloss changes the source’s discourse order and makes it seem external to the quotation.
  - severity: low
    issue: The addressees are marked as direct objects (“አባቱን ... እናቱን”) rather than explicitly as persons addressed.
    rationale: Although colloquial Amharic can allow this after speech verbs, “ለአባቱ ወይም ለእናቱ” is more explicit and natural for the Greek datives τῷ πατρὶ ἢ τῇ μητρί.
