  text: καὶ φέρουσιν αὐτῷ κωφὸν ⸀καὶ ⸀μογιλάλον, καὶ παρακαλοῦσιν αὐτὸν ἵνα ἐπιθῇ αὐτῷ τὴν χεῖρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/032.yaml
  text: And they brought to him a man who was deaf and had difficulty speaking[a], and they begged him to lay his hand on him.
translation:
  language: am
  text: እነርሱም መስማት የተሳነውንና መናገር የሚከብደውን ሰው[a] ወደ እርሱ አመጡ፤ እጁንም እንዲጭንበት አጥብቀው ለመኑት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም ይበልጥ ቃል በቃል፣ “ደንቆሮና በችግር የሚናገር ሰው።”
    reason: lexical_alternative
lexical_decisions:
- source_word: φέρουσιν
  choice: አመጡ
  rationale: በማርቆስ ዘገባ የተለመደውን ታሪካዊ የአሁን ጊዜ አገላለጽ በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜ በመተርጎም የድርጊቱን ቅደም ተከተል ይጠብቃል።
- source_word: κωφόν
  choice: መስማት የተሳነውን … ሰው
  rationale: κωφός በአንዳንድ አውድ ዲዳነትንም ሊያመለክት ቢችልም፣ እዚህ የንግግር ችግሩ በሌላ ቃል ተገልጿል፤ ስለዚህ የመስማት እክልን ለይቶ የሚገልጥ አገላለጽ ተመርጧል።
- source_word: μογιλάλον
  choice: መናገር የሚከብደውን
  rationale: ብርቅዬው ቃል ሙሉ በሙሉ መናገር አለመቻልን ሳይሆን በችግር መናገርን ያመለክታል። ይህ አገላለጽ ትርጉሙን በዘመናዊና ግልጽ አማርኛ ያስተላልፋል።
- source_word: παρακαλοῦσιν
  choice: አጥብቀው ለመኑት
  rationale: በፈውስ አውድ ያለውን ከተራ ጥያቄ የበለጠ ጽኑ ልመና ያሳያል።
- source_word: ἵνα ἐπιθῇ αὐτῷ τὴν χεῖρα
  choice: እጁንም እንዲጭንበት
  rationale: የልመናቸውን ይዘት በተፈጥሯዊ አማርኛ ያቀርባል፤ “እጁን” የሚለውም በግሪክ ያለውን ነጠላ ቁጥር ይጠብቃል።
theological_decisions:
- issue: የሰውየው እክል ምንነት
  choice: መስማት የተሳነውና መናገር የሚከብደው ሰው
  alternative: ደንቆሮና ዲዳ
  rationale: κωφός እና μογιλάλος የተለያዩ ሁለት ገጽታዎችን—የመስማት እክልንና በችግር መናገርን—ይገልጣሉ። “ዲዳ” ማለት μογιλάλος ከሚያመለክተው በላይ ሙሉ የንግግር አለመቻልን ሊያስረዳ ይችላል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ሰውየውን በእክሉ ብቻ ከመሰየም ይልቅ ሰውነቱን የሚያስቀድም አገላለጽ ተመርጧል፤ በግሪክ ያለው አጭርና ቀጥተኛ የትረካ ሂደትም ተጠብቋል።
