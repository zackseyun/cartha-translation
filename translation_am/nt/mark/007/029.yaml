  choice: ይህን ቃል ስለተናገርሽ
  rationale: διά ከተደራሽ ተሳቢ ጋር ምክንያትን ያመለክታል፤ λόγος ደግሞ ሴቲቱ ቀደም ሲል የሰጠችውን መልስ ያመለክታል። በአማርኛ “ይህን ቃል ስለተናገርሽ” የምክንያቱን ኃይልና የቃሉን ነጠላነት በተፈጥሯዊ አገላለጽ ይጠብቃል።
- source_word: ὕπαγε
  choice: ሂጂ
  rationale: ትእዛዙ ለአንዲት ሴት የተነገረ የመሄድ ፈቃድና ማሰናበት ነው፤ “ሂጂ” አጭር፣ ግልጽና ቀጥተኛ ነው።
- source_word: ἐξελήλυθεν
  choice: ወጥቷል
  rationale: የግሪኩ ፍጹም ጊዜ የተፈጸመና ውጤቱ የቀጠለ ድርጊትን ያሳያል። “ወጥቷል” ጋኔኑ መውጣቱንና ከእሷ ተለይቶ መቆየቱን ይገልጣል።
- source_word: ἐκ τῆς θυγατρός σου
  choice: ከሴት ልጅሽ
