- source_word: τὸ δαιμόνιον
  choice: ጋኔኑ
  rationale: δαιμόνιον በዚህ አውድ ጋኔንን በቀጥታ ይጠቅሳል። “ጋኔኑ” የግሪኩን የተወሰነ ስም ያንጸባርቃል፤ “ርኩስ መንፈስ” የሚለውን በዚህ ሐረግ የሌለ ቃል አያስገባም።
- source_word: καὶ εἶπεν αὐτῇ
  choice: እርሱም እንዲህ አላት
  rationale: “-ም” የκαίን የትረካ ቅጥልጥል በተፈጥሯዊ አማርኛ ያሳያል፤ “እንዲህ” ቀጥሎ ያለውን ቀጥተኛ ንግግር በግልጽ ያስተዋውቃል።
