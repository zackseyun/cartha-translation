base_translation:
  language: en
  yaml_path: translation/nt/mark/007/030.yaml
  text: And when she went away to her house, she found the child lying on the bed[a], and the demon gone.
translation:
  language: am
  text: ወደ ቤቷ በሄደች ጊዜ፣ ልጅቷን በአልጋው ላይ ተኝታ አገኘቻት፤ ጋኔኑም ወጥቶ ነበር።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በቃል ቅርብ፦ “ጋኔኑ ወጥቶ ነበር።” የግሪኩ ፍጹም ተካፋይ መውጣቱ ተፈጽሞ ጋኔኑ በዚያ እንዳልነበረ ያሳያል።
    reason: የἐξεληλυθόςን የተጠናቀቀ የመውጣት ሁኔታ ለማብራራት።
lexical_decisions:
- source_word: ἀπελθοῦσα εἰς τὸν οἶκον αὐτῆς
  choice: ወደ ቤቷ ሄዳ
  rationale: የግሪክ የቀደመ ድርጊት አሳቢ ተካፋይንና ወደ ራሷ ቤት የመሄድን አቅጣጫ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: εὗρεν
  choice: አገኘቻት
  rationale: የትረካውን ዋና ግስ በተለመደው አማርኛ ይገልጣል፤ የነገሩ ቅንብር ልጅቱን በዚህ ሁኔታ እንዳገኘች ያሳያል።
- source_word: παιδίον
  choice: ልጅቱ
  rationale: ቃሉ በዚህ ጥቅስ ልጅን ይጠቁማል፤ ከአውዱ ሴት ልጅዋ መሆኗ ግልጽ ስለሆነ የአማርኛ ሴታዊ ቅርጽ ተፈጥሯዊ ነው።
- source_word: βεβλημένον ἐπὶ τὴν κλίνην
  choice: በአልጋው ላይ ተኝታ
  rationale: ፍጹም ተገብሮ ተካፋዩ የልጅቱን ውጤታዊ ሁኔታ ይገልጣል፤ ‘ተኝታ’ ያልተጠቀሰ የኃይል እርምጃ ሳያስገባ በአልጋ ላይ መሆኗን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τὸ δαιμόνιον
  choice: ጋኔኑ
  rationale: በጥቅሱ የተጠቀሰውን δαιμόνιον በቀጥታ የሚያስተላልፍ የተለመደ አማርኛ ቃል ነው።
- source_word: ἐξεληλυθός
  choice: ወጥቶ
  rationale: የἐξέρχομαι ፍጹም ተካፋይ መውጣቱ ተፈጽሞ ጋኔኑ ከዚያ እንደሌለ ያሳያል፤ ‘ወጥቶ’ የመውጣቱን ድርጊት በግልጽ ሁኔታ ይጠብቃል።
