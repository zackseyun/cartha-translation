  text: ሴቲቱ ግሪካዊት[a]፣ በትውልድም ሲሮፊንቄያዊት[b] ነበረች፤ ጋኔኑን ከሴት ልጇ ውስጥ እንዲያወጣ ደጋግማ ትለምነው ነበር።
  philosophy: optimal-equivalence
  footnotes:
