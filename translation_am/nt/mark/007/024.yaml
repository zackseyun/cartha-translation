language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸂Ἐκεῖθεν δὲ⸃ ἀναστὰς ἀπῆλθεν εἰς τὰ ⸀ὅρια ⸀Τύρου. καὶ εἰσελθὼν εἰς οἰκίαν οὐδένα ἤθελεν γνῶναι, καὶ οὐκ ἠδυνήθη λαθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/024.yaml
  text: From there he got up and went away to the region of Tyre[a]. After entering a house, he wanted no one to know it[c][b], yet he could not remain hidden.
translation:
  language: am
  text: ከዚያም ተነሥቶ ወደ ጢሮስ አካባቢ[a] ሄደ። ወደ አንድ ቤትም ገብቶ ማንም እንዳያውቅ ፈለገ[b]፤ ነገር ግን ተሰውሮ ሊቀር አልቻለም[c]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወደ ጢሮስ ግዛት።” የግሪኩ ቃል የድንበር መስመሩን ብቻ ሳይሆን ከጢሮስ ጋር የተያያዘውን ክልል ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “ማንም እንዲያውቅ አልፈለገም።” በግሪኩ ማንም ሊያውቀው ያልፈለገው ነገር በግልጽ አልተጠቀሰም፤ ከአውዱ ግን በዚያ መኖሩን ወይም ያለበትን ቦታ ያመለክታል።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “ማንም ሳያውቀው ሊቀር አልቻለም።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκεῖθεν δὲ
  choice: ከዚያም
  rationale: Ἐκεῖθεν ከቀደመው ስፍራ መነሣትን ያመለክታል፤ δέ ደግሞ ቀላል የትረካ አያያዥ ስለሆነ “-ም” በሚለው ተፈጥሯዊ አያያዝ ተገልጧል።
- source_word: ἀναστὰς
  choice: ተነሥቶ
  rationale: የትረካውን ተከታታይ ድርጊትና የመነሣቱን ተጨባጭ ሐሳብ በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: ἀπῆλθεν
  choice: ሄደ
  rationale: ከነበረበት ቦታ ተነሥቶ ወደ ሌላ ስፍራ መሄዱ በአውዱ ግልጽ ስለሆነ “ሄደ” ተፈጥሯዊና በቂ ነው።
- source_word: εἰς τὰ ὅρια Τύρου
  choice: ወደ ጢሮስ አካባቢ
  rationale: ὅρια ድንበርን ብቻ ሳይሆን ከጢሮስ ጋር የተያያዘውን ክልል ወይም ግዛትም ሊያመለክት ይችላል፤ “አካባቢ” ይህን ስፋት ሳያጠብ በቀላሉ ያስተላልፋል።
- source_word: καὶ εἰσελθὼν εἰς οἰκίαν
  choice: ወደ አንድ ቤትም ገብቶ
  rationale: የግስ አጋሪው ቀጣዩን ድርጊት ያሳያል፤ οἰκίαν ያለ አመልካች የቀረበ ስለሆነ “አንድ ቤት” ተብሏል።
- source_word: οὐδένα ἤθελεν γνῶναι
  choice: ማንም እንዳያውቅ ፈለገ
  rationale: በግሪኩ የ“ማወቅ” ነገር በግልጽ አልተጠቀሰም፤ አማርኛውም ይህን አሻሚነት በተፈጥሯዊ ሁኔታ ሊጠብቅ ይችላል።
- source_word: καὶ οὐκ ἠδυνήθη λαθεῖν
  choice: ነገር ግን ተሰውሮ ሊቀር አልቻለም
  rationale: λανθάνω ከሰዎች እይታ መሰወርን ወይም ሳይታወቅ መቅረትን ያመለክታል፤ የፈለገውንና የሆነውን ተቃርኖ “ነገር ግን” ያጎላል።
