- source_word: δόλος
  choice: ተንኮል
  rationale: ሰውን ሆን ብሎ በማታለል የሚፈጸምን ተንኮለኛ አካሄድ በአጭሩ ይገልጣል።
- source_word: ἀσέλγεια
