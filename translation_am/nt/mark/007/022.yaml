  text: ምንዝርነቶች፣ ስግብግብነት፣ ክፋቶች፣ ተንኮል፣ እፍረተ ቢስ ልቅ ምግባር፣ ክፉ ዓይን[a]፣ ስድብ[b]፣ ትዕቢት፣ ሞኝነት።
  philosophy: optimal-equivalence
  footnotes:
