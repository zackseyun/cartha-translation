  yaml_path: translation/nt/mark/007/034.yaml
  text: And looking up to heaven[a], he sighed and said to him, “Ephphatha,” that is[b], “Be opened.”
translation:
  language: am
  text: ወደ ሰማይ ቀና ብሎ ተመልክቶ ቃተተ፤[a] እንዲህም አለው፦ “ኤፍታታ”[b]፤ ትርጉሙም “ተከፈት” ማለት ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አንጎራጎረ።” ግሱ ጥልቅ ትንፋሽን ወይም ማንጎራጎርን ሊገልጽ ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “ኤፍታታ” የአረማይክ ቃል ሲሆን “ተከፈት” ማለት ነው።
