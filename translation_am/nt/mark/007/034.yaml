lexical_decisions:
- source_word: ἀναβλέψας εἰς τὸν οὐρανόν
  choice: ወደ ሰማይ አሻቅቦ ተመልክቶ
  rationale: ወደ ላይ የተደረገውን እይታና የድርጊቶቹን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያስተላልፋል፤ በዚህ አውድ ሰማይ ከሰማያዊው አቅጣጫ ጋር የተያያዘውን የጸሎት መሰል እንቅስቃሴ ይጠብቃል።
- source_word: ἐστέναξεν
  choice: ቃተተ
  rationale: ግሱ በሐዘን ወይም በውስጣዊ ሸክም የሚወጣን ጥልቅ ትንፋሽ ወይም ማንጎራጎር ሊገልጽ ይችላል። “ቃተተ” ይህን ስፋት በአጭርና በተፈጥሯዊ አማርኛ ይይዛል።
- source_word: λέγει αὐτῷ
  choice: እርሱንም … አለው
  rationale: ታሪካዊውን የአሁን ጊዜ ግስ በአማርኛ ትረካ የተለመደው ባለፈ ጊዜ ያቀርባል፤ αὐτῷ የሚያመለክተውን ሰው በግልጽ ይጠብቃል።
- source_word: Εφφαθα
  choice: ኤፍታታ
  rationale: ማርቆስ ያቆየውን የአረማይክ ቃል በግእዝ ፊደል በድምፅ ቅርበት ያቀርባል፤ የጸሐፊው የራሱ ትርጉም ቀጥሎ ተጠብቋል።
- source_word: Διανοίχθητι
  choice: ተከፈት
  rationale: የነጠላ ቁጥር ትእዛዙንና በግሪክ ያለውን ተደራጊ ቅርጽ በቀጥታና በተለመደ አማርኛ ይገልጻል።
theological_decisions:
- issue: የαὐτῷ ተሳቢ
  choice: ቃሉን ለሰውየው ተናገረው
  alternative: ትእዛዙ በተዘዋዋሪ ለጆሮዎቹ ወይም ለንግግር ችሎታው የተነገረ መሆኑን መግለጽ
  rationale: የግሪኩ ተሳቢ በተፈጥሮ ሰውየውን ያመለክታል። ትእዛዙ የተዘጉትን ችሎታዎቹን ቢመለከትም፣ ትርጉሙ ያልተገለጸውን ተሳቢ በማከል አይፈታውም።
