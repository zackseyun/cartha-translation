id: MRK.7.15
reference: Mark 7:15
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὐδέν ἐστιν ἔξωθεν τοῦ ἀνθρώπου εἰσπορευόμενον εἰς αὐτὸν ὃ δύναται ⸂κοινῶσαι αὐτόν⸃· ἀλλὰ τὰ ⸂ἐκ τοῦ ἀνθρώπου ἐκπορευόμενά⸃ ἐστιν τὰ κοινοῦντα τὸν ⸀ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/015.yaml
  text: There is nothing outside a man that by going into him is able to defile him; rather, the things that come out from the man are what defile the man.
translation:
  language: am
  text: ከሰው ውጭ ያለ ምንም ነገር ወደ ውስጡ በመግባት ሊያረክሰው[a] አይችልም፤ ይልቁንም ከሰው የሚወጡት ነገሮች ሰውን የሚያረክሱት እነርሱ ናቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ርኩስ ሊያደርገው።” የግሪኩ ግስ በንጽሕና ሥርዓት አንጻር አንድን ሰው ርኩስ ማድረግን ሊያመለክት ይችላል፤ “ማርከስ” ግን በአውዱ ያለውን ሰፊ ሥነ ምግባራዊ ኃይልም ይይዛል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδέν
  choice: ምንም ነገር የለም
  rationale: ፍጹም አሉታዊ ትርጉሙን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἔξωθεν τοῦ ἀνθρώπου
  choice: ከሰው ውጭ ሆኖ
  rationale: ውጫዊውን ምንጭ ያሳያል፤ በኋለኛው ‘ከሰው የሚወጡት’ ከሚለው ጋር ያለውን ንጽጽርም ይጠብቃል።
- source_word: τοῦ ἀνθρώπου / τὸν ἄνθρωπον
  choice: ሰው / ሰውን
  rationale: ἄνθρωπος እዚህ አጠቃላይ ሰብአዊ ማጣቀሻ አለው፤ ‘ሰው’ በአማርኛ ተፈጥሯዊ፣ ነጠላና አጠቃላይ ነው።
- source_word: εἰσπορευόμενον εἰς αὐτόν
  choice: ወደ ውስጡ በመግባት
  rationale: የአሳታፊውን የአድራጎት ሁኔታ በግልጽና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: δύναται
  choice: ሊያረክሰው የሚችል
  rationale: የችሎታን ሐሳብ በቀጥታ ይጠብቃል።
- source_word: κοινῶσαι / κοινοῦντα
  choice: ሊያረክሰው / የሚያረክሱት
  rationale: κοινόω በዚህ የንጽሕና ክርክር ውስጥ ሰውን ርኩስ ማድረግን ያመለክታል፤ ‘ማርከስ’ ሥርዓታዊና ሥነ ምግባራዊ ድምፁን ሳያጠብ ይይዛል።
- source_word: ἀλλὰ
  choice: ይልቁንም
  rationale: ጠንካራውን ተቃርኖና የማስተካከያ ኃይል ያሳያል።
- source_word: τὰ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενα
  choice: ከሰው የሚወጡት ነገሮች
  rationale: የግሪኩን ገለልተኛ ብዙ ቁጥርና ከውጭ ወደ ውስጥ ከመግባት ጋር ያለውን ንጽጽር ይጠብቃል።
theological_decisions:
- issue: በንጽሕና ክርክር ውስጥ የκοινόω ትርጉም
  choice: ማርከስ
  alternative: ርኩስ ማድረግ
  rationale: ‘ማርከስ’ የሥርዓታዊ ንጽሕናንና በአውዱ የሚገኘውን ሰፊ ሥነ ምግባራዊ ኃይል አብሮ ሊሸከም ይችላል።
- issue: ἄνθρωποςን አጠቃላይ በሆነ ነጠላ ቁጥር መተርጎም
  choice: ሰው
  alternative: የሰው ልጅ
  rationale: ‘ሰው’ የምንጩን ነጠላና ተወካይ አገላለጽ ይጠብቃል፤ በዘመናዊ አማርኛም ለሰው ሁሉ በተፈጥሮ ይሠራል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የግሪኩ ውጭ/ወደ ውስጥ እና ከውስጥ/ወደ ውጭ ንጽጽር ተጠብቋል።
