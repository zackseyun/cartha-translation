  text: καὶ λέγει αὐτοῖς· Οὕτως καὶ ὑμεῖς ἀσύνετοί ἐστε; οὐ νοεῖτε ὅτι πᾶν τὸ ἔξωθεν εἰσπορευόμενον εἰς τὸν ἄνθρωπον οὐ δύναται αὐτὸν κοινῶσαι,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/018.yaml
  text: And he said to them[b][a], “So are you also without understanding? Do you not understand that everything that enters into the man from outside is not able to defile him,”
translation:
  language: am
  text: እርሱም እንዲህ አላቸው፦ “እናንተም እንዲሁ የማታስተውሉ ናችሁን? ከውጭ ወደ ሰው ውስጥ የሚገባው ሁሉ ሊያረክሰው[a] እንደማይችል አታስተውሉምን?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “ርኩስ ሊያደርገው።” የግሪኩ ግስ በዚህ ዐውድ ከሥርዓታዊ ንጽሕና ጋር የተያያዘ ፍቺ አለው።
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: አላቸው
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ አገላለጽ በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜ ሆኖ ተተርጉሟል።
- source_word: Οὕτως καὶ ὑμεῖς
  choice: እናንተም እንዲሁ
  rationale: καί የሚያሳየውን ‘እናንተም’ የሚል አጽንዖትና οὕτως የሚያሳየውን ‘እንዲሁ’ የሚል ፍቺ ይጠብቃል።
- source_word: ἀσύνετοί
  choice: ማስተዋል የላችሁም
  rationale: የማስተዋልና የመረዳት እጥረትን በግልጽና ተፈጥሯዊ አማርኛ ይገልጻል፤ ከሚከተለው νοεῖτε ጋርም ያለውን የትርጉም ትስስር ይጠብቃል።
- source_word: νοεῖτε
  choice: አታስተውሉም
  rationale: በዐውዱ የታሰበውን በአእምሮ መገንዘብና መረዳት በተለመደ አማርኛ ያስተላልፋል።
- source_word: πᾶν τὸ ἔξωθεν εἰσπορευόμενον
  choice: ማንኛውም ከውጭ … የሚገባ ነገር
  rationale: πᾶν ከስማዊው አሳታፊ ጋር ያለውን አጠቃላይ ፍቺ ይጠብቃል፤ ἔξωθεν ደግሞ ‘ከውጭ’ ተብሎ በግልጽ ተተርጉሟል።
- source_word: εἰς τὸν ἄνθρωπον
  choice: ወደ ሰው
  rationale: εἰς የሚያሳየውን ወደ ውስጥ የመግባት አቅጣጫ ይጠብቃል፤ ‘ሰው’ ደግሞ ἄνθρωπον እዚህ ያለውን አጠቃላይ የሰው ልጅ ማመልከቻ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: κοινῶσαι
  choice: ሊያረክሰው
  rationale: በንጽሕና ክርክሩ ዐውድ አንድን ሰው ርኩስ ወይም ለሥርዓታዊ ንጽሕና የማይበቃ ማድረግን ይገልጻል።
theological_decisions:
- issue: በκοινόω ያለው የንጽሕና ቃል አጠቃቀም
  choice: ሊያረክሰው
  alternative: ርኩስ ሊያደርገው
  rationale: ዐውዱ ስለ ሥርዓታዊ ንጽሕና የሚደረግ ክርክር ስለሆነ፣ ትርጉሙ የሥነ ምግባር ብክለትን ብቻ እንዳያመለክት ‘ማርከስ’ ተመርጦ የንጽሕናው ገጽታ በማስታወሻ ተብራርቷል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የጥያቄዎቹ ቅርጽ የኢየሱስን ገሳጭ አጽንዖት ይጠብቃል። ንግግሩ በቀጣዩ ቁጥር ስለሚቀጥል የዐውዱ ትስስር እንዳይጠፋ ተጠንቅቋል።
