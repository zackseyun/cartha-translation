    text: ወይም “የቤት ውሾች” ወይም በቀላሉ “ውሾች።” የግሪኩ ቃል የማሳነስ ቅጥ ያለው ስለሆነ፣ የዱር ተዟዟሪ ውሾችን ከማጉላት ይልቅ ትናንሽ ወይም የቤት ውሾችን ሊያመለክት ይችላል።
