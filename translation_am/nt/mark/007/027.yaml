  source_fidelity: The draft accurately retains the imperfect aspect of ἔλεγεν (ይላት ነበር), the permissive/jussive force of Ἄφες, the priority expressed by πρῶτον, the satiation implicit in χορτασθῆναι, and the concrete household imagery of bread being taken and thrown to dogs. “መልካም አይደለም” is a defensible direct rendering of καλόν ἐστιν and does not overinterpret it as a legal judgment. The metaphor remains unexplained in the main text, as in Greek.
