  verdict: revise
  source_fidelity: The draft retains all principal Greek elements, but «እግሩ» singular does not reflect τοὺς πόδας, and the placement of «ወዲያው» can be made clearer as the woman's immediate response upon hearing about Jesus. «የያዛት» is possible but is less close to the Greek idiom ‘had an unclean spirit’ than «ያለባት».
  naturalness: The proposed revision uses clear modern standard Amharic. «ትንሽ ሴት ልጅ» makes the daughter's sex and the diminutive nuance explicit; «በእግሮቹ ፊት ወደቀች» naturally conveys falling at his feet.
  terminology: «ርኩስ መንፈስ» is an appropriate consistent rendering of πνεῦμα ἀκάθαρτον. The lexical footnote should retain ‘ሴት ልጅ’ as the base expression and identify θυγάτριον as its diminutive. The alternative «ንጹሕ ያልሆነ መንፈስ» is understandable but less idiomatic than the established «ርኩስ መንፈስ».
  issues:
  - severity: medium
    issue: The text has singular «እግሩ» for Greek plural τοὺς πόδας.
    rationale: The source explicitly says ‘his feet’; plural «እግሮቹ» should be used.
  - severity: medium
    issue: «ርኩስ መንፈስ የያዛት» is less natural and less source-transparent than an Amharic expression meaning ‘had/was afflicted with an unclean spirit.’
    rationale: «ርኩስ መንፈስ ያለባት» naturally preserves the source construction without adding a distinct possession formulation.
  - severity: low
    issue: «ትንሽ ልጅዋ» can leave the feminine sense of θυγάτριον unexpressed.
    rationale: «ትንሽ ሴት ልጅዋ» clearly represents ‘little daughter.’
