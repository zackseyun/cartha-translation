- source_word: γυνὴ
  choice: አንዲት ሴት
  rationale: ያለ መስተዋድድ የቀረበችውን ሴት በትረካው ውስጥ እንደ አዲስ ተሳታፊ ያስተዋውቃል።
- source_word: θυγάτριον
  choice: ትንሽ ልጅዋ
  rationale: የቃሉን የማሳነሻ ቅርጽና የእናትና ልጅ ዝምድና በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: πνεῦμα ἀκάθαρτον
  choice: ርኩስ መንፈስ
  rationale: የማርቆስን መደበኛ አገላለጽ በቀጥታ ይጠብቃል፤ ‘ጋኔን’ የሚለውን የትርጓሜ ማስፋት አያስገባም።
- source_word: ἐλθοῦσα
