base_translation:
  language: en
  yaml_path: translation/nt/mark/007/025.yaml
  text: But immediately a woman whose little daughter had an unclean spirit[a], having heard about him[c][b], came and fell at his feet.
translation:
  language: am
  text: ነገር ግን ትንሽ ሴት ልጅዋ ርኩስ መንፈስ ያለባት አንዲት ሴት ስለ እርሱ እንደሰማች ወዲያውኑ መጥታ በእግሮቹ ፊት ወደቀች።[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ትንሽ ሴት ልጅ” የተተረጎመው የግሪኩ θυγάτριον የ“ሴት ልጅ” ማሳነሻ ቅርጽ ስለሆነ ነው፤ “ሴት ልጅዋ” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “ርኩስ መንፈስ”፤ “ንጹሕ ያልሆነ መንፈስ” ተብሎም ሊተረጎም ይችላል፤ በባህላዊ አረዳድም ጋኔንን ያመለክታል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’
