- source_word: προσέπεσεν πρὸς τοὺς πόδας αὐτοῦ
  choice: እግሩ ላይ ወደቀች
  rationale: የአካላዊ ምስሉንና የትሕትና ልመናውን ሳያጋንን በተለመደ አማርኛ ያስተላልፋል።
