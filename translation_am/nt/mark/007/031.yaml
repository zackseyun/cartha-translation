base_translation:
  language: en
  yaml_path: translation/nt/mark/007/031.yaml
  text: And again[a], after departing from the region of Tyre, he came through Sidon to the Sea of Galilee[b], through the midst of the region of the Decapolis.
translation:
  language: am
  text: እንደገናም ከጢሮስ አውራጃ ወጥቶ፣ በሲዶና በኩል[a] በዲካፖሊስ አውራጃ መካከል አልፎ[b] ወደ ገሊላ ባሕር መጣ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በሲዶና ውስጥ አልፎ።” የግሪኩ ሐረግ በሲዶና ውስጥ ወይም በሲዶና መንገድ መጓዙን ሊገልጽ ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በዲካፖሊስ አውራጃዎች መካከል።” ἀνὰ μέσον የሚለው የግሪክ አገላለጽ “በመካከል” ወይም “መሃል” ተብሎ በይበልጥ ቃል በቃል ሊተረጎም ይችላል፤ የተገለጸውም የጉዞ መስመር ከመልክዓ ምድር አንጻር ለመረዳት አስቸጋሪ ነው።
    reason: lexical_alternative
