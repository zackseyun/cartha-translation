  yaml_path: translation/nt/mark/007/007.yaml
  text: But they worship me in vain[a], teaching as doctrines the commandments of men.
translation:
  language: am
  text: ነገር ግን የሰዎችን ትእዛዛት እንደ ትምህርት እያስተማሩ፣ በከንቱ ያመልኩኛል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የሰዎችን ትእዛዛት ትምህርት ብለው እያስተማሩ።»
    reason: የግሪኩ διδασκαλίας ἐντάλματα ἀνθρώπων አገባብ የሰዎች ትእዛዛት እንደ ትምህርት እንደሚቀርቡ በሁለት ተቀራራቢ መንገዶች ሊገለጥ ይችላል።
lexical_decisions:
- source_word: μάτην
  choice: በከንቱ
  rationale: ድርጊቱ ዓላማውን እንደማይመታና ፍሬ ቢስ እንደሆነ በተፈጥሯዊና በተለመደ አማርኛ ያሳያል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከቀደመው ንግግር፣ በከንፈር ማክበርና ልብ መራቅ፣ ጋር ያለውን ተቃርኖ ያሳያል።
- source_word: σέβονταί με
  choice: ያመልኩኛል
  rationale: ለእግዚአብሔር የሚቀርበውን አምልኮና ክብር በግልጽ የሚገልጥ ሲሆን መስተዋድዱንና ተሳቢውን በተፈጥሯዊ የአማርኛ ግስ ያጣምራል።
- source_word: διδάσκοντες
  choice: እያስተማሩ
  rationale: ተሳቢ የአምልኮአቸውን አካሄድ ወይም ባሕርይ የሚገልጠውን የአሁን ጊዜ አሳታፊ መዋቅር ይጠብቃል።
- source_word: διδασκαλίας
  choice: እንደ ትምህርት
  rationale: የሰው ትእዛዛት ሥልጣን እንዳለው ትምህርት ሆነው እንደሚቀርቡ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐντάλματα
  choice: ትእዛዛት
  rationale: ሥልጣናዊ መመሪያዎችን የሚያመለክተውን ሃይማኖታዊ ድምፀት ይጠብቃል።
- source_word: ἀνθρώπων
  choice: የሰው
  rationale: ትእዛዛቱ ከእግዚአብሔር ሳይሆን ከሰዎች እንደመጡ የሚያሳየውን የምንጭ ትርጉም በጾታ ያልተወሰነ አገላለጽ ያቀርባል።
theological_decisions:
- issue: በመለኮታዊ አምልኮና በሰው ሥልጣን መካከል ያለውን ተቃርኖ መተርጎም
  choice: የሰውን ትእዛዛት እንደ ትምህርት እያስተማሩ
  alternative: ትምህርት ብለው የሰውን ትእዛዛት እያስተማሩ
  rationale: ግሪኩ የሰው ትእዛዛት የትምህርት ደረጃና ሥልጣን ተሰጥቷቸው እንደሚሰጡ በታመቀ መልኩ ይገልጣል። የተመረጠው አገላለጽ ይህን ግንኙነት ግልጽ ሲያደርግ፣ በጽሑፉ ያለውን ትችት—የሰው ትእዛዝ የመለኮታዊ ትምህርት ስፍራ ሲይዝ አምልኮ ከንቱ መሆኑን—ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለሕዝብ ቀላል የሆነ መደበኛ አማርኛ ተጠቅሟል። «በከንቱ» የትንቢታዊውን ጥብቅ ድምፀት ይጠብቃል፤ «የሰው» ደግሞ የፆታ ልዩነትን ሳይሆን ሰብአዊ ምንጭን ያመለክታል።
