review_pass:
  verdict: revise
  source_fidelity: 'The main rendering accurately conveys the Greek: the contrast (δὲ), Isaiah''s apt prophecy concerning the hypocrites, the scriptural citation, outward honor, and inward distance from God are all retained. The footnote, however, inaccurately describes the Greek number and possession in the first clause: χείλεσιν is plural (''lips'') and has no explicit possessive pronoun; αὐτῶν (''their'') modifies καρδία (''heart'').'
  naturalness: The verse is fluent, dignified modern standard Amharic. ‘በትክክል ትንቢት ተናገረ’ and ‘ከእኔ የራቀ ነው’ are clear and natural in this register.
  terminology: ‘ግብዞች,’ ‘ትንቢት,’ ‘ሕዝብ,’ and ‘ያከብረኛል’ are appropriate, established renderings. The mixed collective wording ‘በከንፈሮቹ … ልባቸው’ is defensible and reflects the Greek’s collective-singular construction together with plural αὐτῶν.
  issues:
  - severity: medium
    issue: The footnote says that Greek uses singular nouns ‘people’ and ‘heart,’ while its proposed ‘literal’ alternative also makes ‘lips’ singular and implies a singular possessive construction.
    rationale: In the source, λαός (‘people’) and καρδία (‘heart’) are singular, but χείλεσιν is plural (‘lips’). Moreover, αὐτῶν (‘their’) occurs only with ‘heart’; the first clause has no expressed possessive pronoun. The note should state these details accurately.
  revised_text: እርሱ ግን እንዲህ አላቸው፤ “ኢሳይያስ ስለ እናንተ ግብዞች በትክክል ትንቢት ተናገረ፤ እንደተጻፈው፣ ‘ይህ ሕዝብ በከንፈሮቹ ያከብረኛል፤ ልባቸው ግን ከእኔ የራቀ ነው።’”[a]
