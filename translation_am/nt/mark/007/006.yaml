reference: Mark 7:6
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ εἶπεν ⸀αὐτοῖς· Καλῶς ἐπροφήτευσεν Ἠσαΐας περὶ ὑμῶν τῶν ὑποκριτῶν, ὡς γέγραπται ⸀ὅτι Οὗτος ὁ λαὸς τοῖς χείλεσίν με τιμᾷ, ἡ δὲ καρδία αὐτῶν πόρρω ἀπέχει ἀπ’ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/006.yaml
  text: 'But he said to them[a], “Isaiah prophesied well about you hypocrites, as it is written: ‘This people honors me with their lips, but their heart is far from me.’”'
translation:
  language: am
  text: እርሱ ግን እንዲህ አላቸው፤ “ኢሳይያስ ስለ እናንተ ግብዞች በትክክል ትንቢት ተናገረ፤ እንደተጻፈው፣ ‘ይህ ሕዝብ በከንፈሮቹ ያከብረኛል፤ ልባቸው ግን ከእኔ የራቀ ነው።’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ግሪኩ ‘ሕዝብ’ንና ‘ልብ’ን በነጠላ ቁጥር፣ ‘ከንፈሮች’ን ግን በብዙ ቁጥር ይጠቀማል። ‘የእነርሱ’ የሚለው ባለቤትነት ቃል ከ‘ልብ’ ጋር ነው። ስለዚህ፣ ‘ይህ ሕዝብ በከንፈሮቹ ያከብረኛል፤ ልቡ ግን ከእኔ የራቀ ነው’ የሚለውም የነጠላ የስብስብ አገላለጽ አማራጭ ነው።
    reason: የስብስብ ስም ቁጥርና የባለቤትነት አመልካች አማራጭን ለማሳየት
lexical_decisions:
- source_word: δὲ
  choice: ግን
  rationale: ከቀደመው ንግግር ጋር ያለውን መጠነኛ ንጽጽርና የመልሱን ዙር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Καλῶς ἐπροφήτευσεν
  choice: በትክክል ትንቢት ተናገረ
  rationale: Καλῶς የሚሰጠውን አዎንታዊ ግምገማ በዚህ ክርክራዊ አውድ ‘በትክክል’ በግልጽ ያቀርባል፤ ἐπροφήτευσενም የነቢያዊ ንግግሩን ባሕርይ ይጠብቃል።
- source_word: περὶ ὑμῶν τῶν ὑποκριτῶν
  choice: ስለ እናንተ ግብዞች
  rationale: περί የማመልከቻ ትርጉሙን ‘ስለ’ ይይዛል፤ ὑποκριτῶν ደግሞ ተደራሲዎቹን በቀጥታ የሚለይ አፖዚሽናዊ ስያሜ ነው።
- source_word: ὡς γέγραπται ὅτι
  choice: እንደተጻፈው፣
  rationale: የጥቅስ መግቢያውን በተለመደና ክቡር የአማርኛ አገላለጽ ያቀርባል።
- source_word: Οὗτος ὁ λαὸς
  choice: ይህ ሕዝብ
  rationale: የግሪኩን ነጠላ ጠቋሚና ስም እንዲሁም የኢሳይያስን ትንቢታዊ ድምፅ ይጠብቃል።
- source_word: τοῖς χείλεσίν με τιμᾷ
  choice: በከንፈሮቹ ያከብረኛል
  rationale: τιμάωን ‘ያከብረኛል’ በማለት ቀጥተኛ ይተረጉማል፤ ነጠላው ባለቤት አመልካች ከ‘ይህ ሕዝብ’ ጋር ሰዋስዋዊ ወጥነት አለው።
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: ልባቸው ግን
  rationale: የግሪኩን ነጠላ ‘ልብ’ እና ብዙ ባለቤትነት በተፈጥሯዊ አማርኛ ይጠብቃል፤ ይህም የሕዝቡን የጋራ ውስጣዊ ዝንባሌ ያመለክታል።
- source_word: πόρρω ἀπέχει ἀπ’ ἐμοῦ
  choice: ከእኔ የራቀ ነው
  rationale: አገላለጹ የሚያመለክተውን መንፈሳዊና ግንኙነታዊ ርቀት በቀላልና ታማኝ ሁኔታ ይገልጣል።
theological_decisions:
- issue: ኢየሱስ የኢሳይያስ 29፥13ን በተቃዋሚዎቹ ላይ በቀጥታ መተግበሩ
  choice: ‘ስለ እናንተ ግብዞች’ እና ‘ይህ ሕዝብ’ የሚሉትን ቀጥተኛ ወቀሳዎች ሳይለሰልሱ ማቆየት
  alternative: ንግግሩን ከተደራሲዎቹ በማራቅ አጠቃላይ ሰዎችን የሚመለከት ለስላሳ አባባል ማድረግ
  rationale: የግሪኩ ጽሑፍ ኢየሱስ ትንቢቱን በፊቱ ባሉት ሰዎች ላይ በግልጽ እንደሚተገብር ያሳያል፤ ትርጉሙም ይህን ኃይል ያለ ተጨማሪ ዶክትሪናዊ ማብራሪያ ይጠብቃል።
- issue: ‘ሕዝብ’ ነጠላ ሆኖ ሳለ የአባላቱን የጋራ ልብ መግለጽ
  choice: ‘በከንፈሮቹ’ ከሚለው ነጠላ የሰዋስው ማጣቀሻ ጋር ‘ልባቸው’ የሚለውን የጋራ አመልካች ማቆየት
  alternative: ሁለቱንም ሙሉ በሙሉ ነጠላ በማድረግ ‘ልቡ’ ማለት፣ ወይም ሁለቱንም ብዙ ቁጥር ማድረግ
  rationale: ግሪኩ λαόςንና καρδίαን ነጠላ፣ αὐτῶνን ግን ብዙ ቁጥር ያደርጋል። የተመረጠው አገላለጽ ይህን የስብስብ ስም ውጥረት በተፈጥሯዊ አማርኛ ያስቀራል።
