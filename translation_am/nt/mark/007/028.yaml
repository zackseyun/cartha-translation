  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἡ δὲ ἀπεκρίθη καὶ λέγει αὐτῷ· ⸀Κύριε, ⸀καὶ τὰ κυνάρια ὑποκάτω τῆς τραπέζης ⸀ἐσθίουσιν ἀπὸ τῶν ψιχίων τῶν παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/028.yaml
  text: But she answered and said to him[a], “Lord[b], even the little dogs under the table eat from the children's crumbs.”
translation:
  language: am
  text: እርሷ ግን መልሳ እንዲህ አለችው፤ “ጌታ ሆይ[a]፣ ከገበታው በታች ያሉት ትንንሽ ውሾች እንኳ[b] ከልጆቹ ፍርፋሪዎች ይበላሉ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ κύριε የሚለው ቃል “ጌታ ሆይ” ማለት ሲሆን፣ እንደ “Sir” ያለ የክብር አጠራርም ሊሆን ይችላል።
    reason: alternative_reading
  - marker: b
    text: የግሪኩ ቃል ትናንሽ ወይም በቤት የሚኖሩ ውሾችን ያመለክታል፤ “ትንንሽ ውሾች” የሚለው የማሳነስ ስሜቱን ይጠብቃል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη καὶ λέγει αὐτῷ
  choice: መልሳ እንዲህ አለችው
  rationale: የመልስ ንግግሩንና ወደ ኢየሱስ መናገሯን በተፈጥሯዊ የአማርኛ ትረካ ያስተላልፋል፤ የግሪኩ ታሪካዊ የአሁን ጊዜ ቅርጽ በአማርኛ በአለፈ ጊዜ ተገልጧል።
- source_word: Κύριε
  choice: ጌታ ሆይ
  rationale: κύριεን በቀጥታ የአድራሻ ቅርጽ ይገልጻል፤ ቃሉ የክብር አጠራርም ሊሆን ስለሚችል አማራጩ በማስታወሻ ተጠብቋል።
- source_word: καὶ
  choice: -ም
  rationale: ትንንሽ ውሾቹም የሚበሉ መሆናቸውን የሚያጎላውን የመደመር ወይም ‘እንኳ’ ኃይል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: κυνάρια
  choice: ትንንሽ ውሾች
  rationale: የግሪኩን የማሳነስ ቅርጽ ይጠብቃል፤ በቤት አካባቢ ያሉ ትናንሽ ውሾችን ሊያመለክት ይችላል።
- source_word: ὑποκάτω τῆς τραπέζης
  choice: ከገበታው በታች ያሉት
  rationale: የቦታውን ግንኙነት ግልጽና ተፈጥሯዊ በሆነ አማርኛ ያስተላልፋል።
- source_word: ἐσθίουσιν ἀπὸ τῶν ψιχίων τῶν παιδίων
  choice: ከልጆቹ ፍርፋሪ ይበላሉ
  rationale: የአሁን ጊዜውን ልማዳዊ ትርጉምና ἀπό ያለውን ከከፊል የመውሰድ ኃይል በአጭር አማርኛ ያቀርባል፤ ψιχία ‘ፍርፋሪ’ ተብሏል።
theological_decisions:
- issue: በሴቲቱ ንግግር ውስጥ κύριος የሚለውን አጠራር መተርጎም
  choice: ጌታ ሆይ
  alternative: ጌታዬ / ክቡር ጌታ
  rationale: ‘ጌታ’ የሚለውን ዋና ትርጉም ይጠብቃል፤ በዚህ ዐውድ ቃሉ ተራ የክብር አጠራር ሊሆን የሚችልበት እድል በማስታወሻ ተገልጧል፣ ስለዚህ የሴቲቱን ሙሉ ክርስቶሎጂያዊ ግንዛቤ ከጽሑፉ በላይ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የቃል ቅደም ተከተል በተፈጥሯዊ የአማርኛ አገባብ ተደርጓል፤ በκύριε ውስጥ ያለው የ‘ጌታ’ና የክብር አጠራር አሻሚነት በማስታወሻ ተጠብቋል።
