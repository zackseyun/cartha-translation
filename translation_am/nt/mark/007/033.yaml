theological_decisions:
- issue: የኢየሱስን የፈውስ ድርጊት አገላለጽ
  choice: አካላዊ ድርጊቶቹን ብቻ በቀጥታ መግለጽ፤ ምራቁን በሰውየው ምላስ ላይ እንዳደረገ አለመጨመር
