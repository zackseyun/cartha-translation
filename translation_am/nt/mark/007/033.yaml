  rationale: የግሪኩ ጽሑፍ ኢየሱስ እንደተፋና የሰውየውን ምላስ እንደነካ ብቻ ይናገራል፤ ምራቁ የት እንደደረሰ ወይም የድርጊቱ ትርጉም ምን እንደሆነ አይገልጽም።
