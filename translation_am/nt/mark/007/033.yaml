  yaml_path: translation/nt/mark/007/033.yaml
  text: And taking him aside from the crowd privately[a], he put his fingers into his ears, and after spitting[b], he touched his tongue.
translation:
  language: am
  text: ከሕዝቡ ለይቶ በግል ወደ ጎን ወሰደው[a]፤ ጣቶቹንም በሰውየው ጆሮዎች ውስጥ አስገባ፤ ከተፋም በኋላ[b] ምላሱን ዳሰሰ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በግል ወሰደው።”
    reason: lexical_alternative
  - marker: b
    text: የግሪኩ ጽሑፍ፣ “ከተፋም በኋላ ምላሱን ዳሰሰ” ይላል፤ ኢየሱስ ምራቁን በሰውየው ምላስ ላይ እንዳደረገ በግልጽ አይናገርም።
