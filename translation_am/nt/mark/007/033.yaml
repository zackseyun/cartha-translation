lexical_decisions:
- source_word: ἀπολαβόμενος αὐτὸν ἀπὸ τοῦ ὄχλου
  choice: ከሕዝቡም ለይቶ ወደ ጎን ወሰደው
  rationale: የግሪኩ አገላለጽ ሰውየውን ከሕዝቡ መለየትን ያመለክታል፤ ይህ ትርጉም ድርጊቱን በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: κατ’ ἰδίαν
