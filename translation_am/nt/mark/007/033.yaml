- source_word: ἔβαλεν τοὺς δακτύλους αὐτοῦ εἰς τὰ ὦτα αὐτοῦ
  choice: ጣቶቹንም በሰውየው ጆሮዎች ውስጥ አስገባ
  rationale: ተጨባጩን አካላዊ ድርጊት ይጠብቃል፤ ‘የሰውየው’ የሚለው ማብራሪያ በአማርኛ የባለቤት ተውላጠ ስም ግራ እንዳያጋባ ያደርጋል።
- source_word: πτύσας
  choice: ከተፋም በኋላ
  rationale: የቀደመውን ወይም ከዋናው ድርጊት ጋር የተያያዘውን ድርጊት በተፈጥሯዊ አማርኛ ያሳያል፤ ምራቁ የት እንደደረሰ አይጨምርም።
