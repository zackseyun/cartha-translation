  text: And they were utterly astonished[a], saying, “He has done everything well[b]. He makes even the deaf hear and the mute speak.”
translation:
  language: am
  text: እነርሱም ከመጠን በላይ ተደንቀው እንዲህ አሉ፦ “ሁሉንም ነገር በሚገባ አድርጓል።[a] መስማት የተሳናቸው እንዲሰሙ፣ መናገር የተሳናቸውም እንዲናገሩ ያደርጋል።”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ሁሉንም ነገር በሚገባ አድርጓል” የሚለው “ሁሉን ነገር መልካም አድርጓል” ተብሎም ሊተረጎም ይችላል፤ አገላለጹ ስለ እግዚአብሔር ሥራዎች የሚናገረውን የቅዱሳት መጻሕፍት ቋንቋ ሊያስታውስ ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ይህ አገላለጽ፣ በእግዚአብሔር ተሐድሶ መስማት የተሳናቸው እንደሚሰሙና መናገር የተሳናቸው እንደሚናገሩ የሚገልጸውን ኢሳይያስ 35፥5–6 ያስታውሳል።
    reason: cross_reference
lexical_decisions:
