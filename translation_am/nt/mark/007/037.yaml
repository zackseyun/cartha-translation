  rationale: የግሪኩን እጅግ የተጠናከረ የመደነቅ ሐሳብ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል፤ የተካሄደውን ምላሽም ያሳያል።
- source_word: Καλῶς πάντα πεποίηκεν
  choice: ሁሉንም ነገር በሚገባ አድርጎአል
  rationale: Καλῶς የድርጊቱን ጥራት የሚገልጽ ተውሳከ ግስ ስለሆነ “በሚገባ” ተብሏል፤ ፍጹም ጊዜውም የተፈጸመው ሥራ አሁን ያለውን ውጤት እንዲያሳይ “አድርጎአል” ተብሏል።
- source_word: τοὺς κωφοὺς ποιεῖ ἀκούειν
  choice: መስማት የተሳናቸው እንዲሰሙ ... ያደርጋል
  rationale: የποιεῖ ከግስ ስም ጋር ያለውን አስደራጊ አገባብ በቀጥታ ያቆያል፤ “መስማት የተሳናቸው” የሰዎቹን ክብር የጠበቀ እና ግልጽ አገላለጽ ነው።
- source_word: ἀλάλους λαλεῖν
  choice: መናገር የተሳናቸውም እንዲናገሩ
  rationale: የመናገር አለመቻልን በግልጽና በክብር ይገልጻል፤ -ም የግሪኩን καὶ የማስተባበር ኃይል ያስተላልፋል።
theological_decisions:
- issue: “ሁሉንም ነገር በሚገባ አድርጎአል” የሚለው ንግግር ከፍጥረት ቋንቋ ጋር ሊኖረው የሚችል ድምፀ አስተጋብኦ
  choice: የሕዝቡን ንግግር በቀጥተኛ ቋንቋ ማቆየትና የሚቻለውን አስተጋብኦ በማስታወሻ መጠቆም
  alternative: “ሁሉን ነገር መልካም አድርጎአል” ብሎ በዋናው ጽሑፍ መተርጎም
  rationale: ግሪኩ በቀጥታ የሥራውን መልካምነት ይገልጻል፤ ሊኖር የሚችለውን የቅዱሳት መጻሕፍት አስተጋብኦ በዋናው ጽሑፍ ከሚገባው በላይ አልተጠናከረም።
- issue: ከኢሳይያስ 35፥5-6 ጋር ያለው ግልጽ የተሐድሶ አስተጋብኦ
  choice: የመስማትና የመናገር ተአምራትን በዋናው ጽሑፍ በቀጥታ ማቆየት፣ ማጣቀሻውን ግን በግርጌ ማስታወሻ መግለጽ
  alternative: ኢሳይያስን በዋናው ጽሑፍ በግልጽ መጥቀስ
  rationale: ማርቆስ ራሱ በዚህ ጥቅስ ኢሳይያስን በስም አይጠቅስም፤ ስለዚህ አስተጋብኦው እንዳይጠፋ ተጠቁሟል እንጂ ወደ ዋናው ጽሑፍ አልገባም።
