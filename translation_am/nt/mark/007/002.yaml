  rationale: ὅτι ያዩትን ይዘት ያስገባል፤ በአማርኛ ይህ በ‘ሲበሉ አዩ’ የአረፍተ ነገር አወቃቀር በተፈጥሮ ተገልጿል።
- source_word: κοιναῖς χερσίν
  choice: በረከሰ እጅ
  rationale: κοινός ቃል በቃል ‘የጋራ/ተራ’ ማለት ቢሆንም በዚህ የአይሁድ ሥርዓታዊ ንጽሕና ዐውድ የረከሰ ወይም ንጹሕ ያልሆነ ማለት ነው። ‘በረከሰ እጅ’ ትርጉሙን በተፈጥሯዊ አማርኛ ያቀርባል፤ ቃል በቃል አገላለጹ በማስታወሻ ተጠብቋል።
- source_word: τοῦτ’ ἔστιν ἀνίπτοις
  choice: ማለትም እጃቸውን ሳይታጠቡ
  rationale: የማርቆስን ገላጭ ሐረግ በግልጽና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐσθίουσιν
  choice: ሲበሉ
  rationale: በትረካው ያለው የአሁን ጊዜ ግስ ከማየቱ ጋር በአንድ ጊዜ የተከናወነውን ድርጊት ያሳያል።
- source_word: τοὺς ἄρτους
  choice: እንጀራውን
  rationale: ἄρτους በቁጥር ብዙ ‘እንጀራዎች/ኅብስቶች’ ቢሆንም እዚህ ምግብ ሆኖ የሚበላውን እንጀራ ያመለክታል፤ ‘እንጀራውን’ በአማርኛ ተፈጥሯዊ ነው።
