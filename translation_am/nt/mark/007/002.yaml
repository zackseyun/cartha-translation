    reason: lexical_alternative
  revision_rationale: The revision restores the implied subject from the preceding verse and places the connective -ም on that subject. It also makes ‘hands’ plural in the translation and footnote. No theological interpretation beyond the ritual-purity meaning indicated by the Greek term and Mark’s own gloss has been added.
