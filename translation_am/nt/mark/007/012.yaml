    issue: The temporal expression does not explicitly express “no longer.”
    rationale: «ከዚያም በኋላ» primarily means “after that,” whereas οὐκέτι states that a formerly permitted action is no longer permitted. «ከእንግዲህ ወዲህ» naturally conveys this in Amharic.
