translation:
  language: am
  text: ከእንግዲህ ወዲህ ለአባቱ ወይም ለእናቱ ምንም ነገር እንዲያደርግ አትፈቅዱለትም።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «አባቱን ወይም እናቱን ለመርዳት ምንም ነገር እንዲያደርግ።» ሰፊው የግሪክ አገላለጽ በዚህ አውድ ተግባራዊ ወይም የገንዘብ ድጋፍንም ሊያካትት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: ከዚያም በኋላ … አትፈቅዱለትም
  rationale: የቀድሞው ሁኔታ መቋረጡን በተፈጥሯዊ የአማርኛ አገላለጽ ያሳያል፤ በአውዱም ከተነገረው የቁርባን ቃል በኋላ ያለውን ውጤት ይገልጣል።
- source_word: ἀφίετε
  choice: አትፈቅዱለትም
  rationale: እዚህ ἀφίημι ይቅር ማለትን ሳይሆን መፍቀድን ወይም መተውን ያመለክታል። አሉታዊውን እና ተደራሹን በተፈጥሯዊ አማርኛ ይይዛል።
- source_word: αὐτόν
  choice: እንዲያደርግ … ለት
  rationale: የወንድ ነጠላ ተደራሽን በግስ እና በቅጥያ ውስጥ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: οὐδὲν ποιῆσαι
  choice: ምንም ነገር እንዲያደርግ
  rationale: ግሪኩ የማንኛውንም ተግባር መከልከል የሚያሳይ ሰፊ አገላለጽ ነው፤ የድጋፍን ዓይነት በዋናው ጽሑፍ አያጠብም።
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: ለአባቱ ወይም ለእናቱ
  rationale: የግሪኩን የጥቅም ተቀባይ ዳቲቭ በ«ለ» ይገልጣል፤ በአውዱ የግለሰቡ ወላጆች መሆናቸውን የባለቤትነት ቅጥያዎቹ በግልጽ ያሳያሉ።
theological_decisions:
- issue: ከቁርባን አውድ የሚገኘውን የገንዘብ ወይም የቁሳዊ ድጋፍ ሐሳብ በዋናው ጽሑፍ ግልጽ ማድረግ ወይም አለማድረግ
  choice: «ምንም ነገር እንዲያደርግ» የሚለውን ሰፊ አገላለጽ መጠበቅ
  alternative: «ለአባቱ ወይም ለእናቱ የሚረዳ ምንም ነገር እንዲያደርግ» ወይም «ወላጆቹን በገንዘብ እንዲደግፍ»
  rationale: የቅርብ አውዱ ቁሳዊ ድጋፍን ቢያመለክትም፣ የቁጥሩ የግሪክ አገላለጽ በራሱ ሰፊ ነው። ይህን ስፋት በዋናው ጽሑፍ መጠበቅና የአውዱን ሐሳብ በማስታወሻ ማብራራት የምንጩን ውጥረት አይፈታውም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ከዚያም በኋላ» ከቀዳሚው ቁጥር ጋር ያለውን የምክንያትና ውጤት ትስስር በተፈጥሯዊ መንገድ ያሳያል።
