  verdict: revise
  source_fidelity: The draft accurately represents ἀφίετε αὐτὸν οὐδὲν ποιῆσαι as not permitting the man to do anything, and it retains the broad beneficiary sense of the datives, «ለአባቱ ወይም ለእናቱ». The masculine singular referent is appropriately retained through «-ለት». However, «ከዚያም በኋላ» can mean simply “after that” and does not as directly convey οὐκέτι, “no longer.”
  naturalness: The sentence is otherwise natural, clear modern standard Amharic. Replacing the opening phrase with «ከእንግዲህ ወዲህ» gives the customary, idiomatic expression for the cessation expressed by οὐκέτι.
  terminology: No theological terminology occurs in this verse. The footnote suitably marks “help” and material support as contextual implications rather than narrowing the main text.
  issues:
