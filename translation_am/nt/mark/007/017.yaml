  rationale: ደቀ መዛሙርቱ የጠየቁበትን ጊዜያዊ ሁኔታ በግልጽ ያሳያል።
- source_word: εἰσῆλθεν εἰς οἶκον
  choice: ወደ አንድ ቤት በገባ
  rationale: οἶκον ያለ መስተዋድድ የተጠቀሰ ስለሆነ ‘አንድ ቤት’ የሚለው ከ‘ወደ ቤቱ’ ይልቅ የግሪኩን ቅርጽ ይጠብቃል፤ የመግባትንም ድርጊት በቀጥታ ያቀርባል።
- source_word: ἀπὸ τοῦ ὄχλου
  choice: ከሕዝቡ ተለይቶ
  rationale: ወደ ቤቱ መግባቱ ከሕዝቡ ተለይቶ መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐπηρώτων
  choice: ጠየቁት
  rationale: ያልተጠናቀቀው የግሪክ ግስ ቀጣይነትን ሊጠቁም ቢችልም፣ በአማርኛ ትረካ ቀላል ያለፈ ጊዜ ተፈጥሯዊ ነው፤ ተሳቢውንም በ‘-ት’ ያሳያል።
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ደቀ መዛሙርቱ
  rationale: የባለቤትነት ግንኙነቱን በተለመደና ክብር ባለው የአማርኛ አገላለጽ ያቀርባል።
- source_word: τὴν παραβολήν
  choice: ምሳሌው
  rationale: παραβολή የሚለውን የማርቆስ የራሱን የትምህርት ምድብ ይጠብቃል፤ ቃሉ በዚህ አውድ ሰፋ ብሎ ሊገባ መቻሉ በማስታወሻ ተገልጿል።
