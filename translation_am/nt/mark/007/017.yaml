base_translation:
  language: en
  yaml_path: translation/nt/mark/007/017.yaml
  text: And when he entered a house away from the crowd[a], his disciples asked him about the parable.
translation:
  language: am
  text: ከሕዝቡም ተለይቶ ወደ አንድ ቤት በገባ ጊዜ፣ ደቀ መዛሙርቱ ስለ ምሳሌው[a] ጠየቁት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ንግግሩ” ወይም “ምሳሌያዊ ንግግሩ።” የግሪኩ ቃል παραβολή ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: -ም
  rationale: የማርቆስን ተከታታይ ትረካ በተፈጥሯዊ የአማርኛ አያያዥ ቅጥያ ያስቀጥላል።
- source_word: ὅτε
