id: MRK.7.35
reference: Mark 7:35
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀καὶ ⸀ἠνοίγησαν αὐτοῦ αἱ ἀκοαί, καὶ ἐλύθη ὁ δεσμὸς τῆς γλώσσης αὐτοῦ, καὶ ἐλάλει ὀρθῶς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/035.yaml
  text: And his ears were opened[a], and the bond of his tongue was released[c][b], and he spoke plainly.
translation:
  language: am
  text: ጆሮዎቹም ተከፈቱ፤ የምላሱም እስራት ተፈታ፣ በትክክልም ይናገር ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠνοίγησαν
  choice: ተከፈቱ
  rationale: የግሪኩን የተደራጊ ቅርጽና የመስማቱ ድንገተኛ መመለስ ያንጸባርቃል።
- source_word: αἱ ἀκοαί
  choice: ጆሮዎቹ
  rationale: ቃሉ የመስማት ችሎታንም ሊያመለክት ቢችል፣ ብዙ ቁጥር ያለው አገላለጽ በዚህ የፈውስ አውድ በተፈጥሯዊ አማርኛ ‘ጆሮዎቹ’ ተብሎ ይገለጣል።
- source_word: ἐλύθη
  choice: ተፈታ
  rationale: የλύωን የተደራጊ ትርጉም በተፈጥሯዊ አማርኛ ይገልጣል፤ እስራት ከሚለው ምስላዊ ቃልም ጋር ይስማማል።
- source_word: ὁ δεσμὸς τῆς γλώσσης αὐτοῦ
  choice: የምላሱም እስራት
  rationale: ‘እስራት’ የሚለው ቃል የግሪኩን ማሰሪያ/እገዳ ምስል ይጠብቃል፤ ‘የንግግር እንቅፋቱ’ ብሎ ትርጉሙን ከልክ በላይ አይተረጉምም።
- source_word: ἐλάλει
  choice: ይናገር ነበር
  rationale: የግሪኩን ያልተፈጸመ ጊዜ ቅርጽና ቀጣይ የንግግር ተግባር ያሳያል፤ ‘መናገር ጀመረ’ የሚል በግልጽ ያልተጻፈ ጅማሬ አይጨምርም።
- source_word: ὀρθῶς
  choice: በትክክል
  rationale: ቃሉ ቀጥ ብሎ፣ በትክክል ወይም በአግባቡ መናገርን ያመለክታል፤ በዚህ አውድ የንግግሩን መስተካከል በአጭርና ተፈጥሯዊ ቋንቋ ይገልጣል።
theological_decisions:
- issue: የምላሱን ፈውስ የሚገልጠውን ሐረግ ምስላዊነት መጠበቅ ወይም በትርጓሜ መተካት
  choice: የምላሱም እስራት ተፈታ
  alternative: የንግግር እንቅፋቱ ተወገደ / ምላሱ ነጻ ወጣ
  rationale: ምንጩ ክሊኒካዊ ቃል ሳይጠቀም የእስራት ምስል ይጠቀማል። ይህን መጠበቅ ተአምራዊውን ፈውስ ሳያደበዝዝ ከምንጩ ቅርብ ያደርገዋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። በSBLGNT የቀረበው ጽሑፍ የእንግሊዝኛው ረቂቅ ያከለውን ‘ወዲያውም’ የሚደግፍ εὐθέως ስለሌለው፣ ቃሉ በዋናው ትርጉም ውስጥ መካተት የለበትም።
