source:
  edition: SBLGNT
  text: ἔσωθεν γὰρ ἐκ τῆς καρδίας τῶν ἀνθρώπων οἱ διαλογισμοὶ οἱ κακοὶ ἐκπορεύονται, ⸂πορνεῖαι, κλοπαί, φόνοι,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/021.yaml
  text: 'For from within[a], out of the heart of men, evil thoughts come out: sexual immoralities, thefts, murders[b],'
translation:
  language: am
  text: ምክንያቱም ከሰዎች ልብ ውስጥ ክፉ ሐሳቦች ይወጣሉ፤ የዝሙት ድርጊቶች፣ ስርቆቶች፣ ግድያዎች፣
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔσωθεν
  choice: ከውስጥ
  rationale: የነገሩን ውስጣዊ ምንጭ ያመለክታል፤ በአውዱ ካለው ውጫዊ ነገር ጋር የሚታየውን ንፅፅር ይጠብቃል።
- source_word: γὰρ
  choice: ምክንያቱም
  rationale: ይህ አረፍተ ነገር ቀደም ሲል ለተነገረው ማብራሪያና ምክንያት መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: καρδίας
  choice: ልብ
  rationale: የውስጣዊ ሰውነት፣ የፈቃድና የሥነ ምግባር ማዕከልን የሚያመለክተውን መጽሐፍ ቅዱሳዊ ምስል ይጠብቃል።
- source_word: ἀνθρώπων
  choice: ሰዎች
  rationale: በዚህ አጠቃቀም የግሪኩ ወንድ ጾታ ብዙ ቁጥር የሰውን ዘር በአጠቃላይ ያመለክታል፤ «ሰዎች» ይህን በተፈጥሯዊና ትክክለኛ አማርኛ ያስተላልፋል።
- source_word: διαλογισμοὶ οἱ κακοὶ
  choice: ክፉ ሐሳቦች
  rationale: የውስጥ አስተሳሰቦችንና የሥነ ምግባር ክፋታቸውን ግልጽ በሆነ ዘመናዊ አማርኛ ይገልጣል።
- source_word: ἐκπορεύονται
  choice: ይወጣሉ
  rationale: ከልብ ውስጥ ወደ ውጭ የመውጣትን ምስል ጠብቆ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: πορνεῖαι
  choice: የዝሙት ድርጊቶች
  rationale: ብዙ ቁጥሩን ይጠብቃል፤ ቃሉንም ወደ አንድ የተወሰነ የጾታ ኃጢአት ሳያጠብ ሕገ ወጥ የጾታ ድርጊቶችን በስፋት ያመለክታል።
- source_word: κλοπαί
  choice: ስርቆቶች
  rationale: በክፉ ድርጊቶች ዝርዝር ውስጥ ያለውን ብዙ ቁጥርና ተጨባጭ ድርጊቶች ይጠብቃል።
- source_word: φόνοι
  choice: ግድያዎች
  rationale: ከአጠቃላይ መግደል ይልቅ ሕገ ወጥና የሥነ ምግባር ክፋት ያለበትን መግደል ይገልጣል።
theological_decisions:
- issue: ἀνθρώπων በአጠቃላይ ሰውን ሁሉ ማመልከቱ
  choice: ሰዎች
  alternative: ወንዶች፤ የሰው ልጆች
  rationale: የግሪኩ ቅርጽ ሰዋስዋዊ ወንድ ጾታ ቢሆንም በዚህ አውድ ወንዶችን ብቻ አያመለክትም። «ሰዎች» የመነሻውን አጠቃላይ ትርጉም ያለ ሥነ መለኮታዊ ማጥበብ ያቀርባል።
- issue: πορνεῖαι የሚያመለክተው ወሰንና ብዙ ቁጥር
  choice: የዝሙት ድርጊቶች
  alternative: ዝሙት፤ የጾታ ብልግናዎች
  rationale: የተወሰነ አንድ ምድብ ሳይጫንበት በግሪኩ ያለውን ሰፊ የሕገ ወጥ ጾታዊ ድርጊቶች ሐሳብና ብዙ ቁጥር ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የንጥሎች ዝርዝር በቀጣዩ ቁጥር ስለሚቀጥል ጥቅሱ በኮማ ተዘግቷል። የመነሻ ጽሑፉ ንባብ በዚህ ጥቅስ ልዩ የግርጌ ማስታወሻ አያስፈልገውም።
