id: MRK.7.19
reference: Mark 7:19
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὅτι οὐκ εἰσπορεύεται αὐτοῦ εἰς τὴν καρδίαν ἀλλ’ εἰς τὴν κοιλίαν, καὶ εἰς τὸν ἀφεδρῶνα ἐκπορεύεται; —⸀καθαρίζων πάντα τὰ βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/019.yaml
  text: because it does not enter into his heart but into his stomach[a], and goes out into the latrine"—thus cleansing all foods.
translation:
  language: am
  text: ምክንያቱም ወደ ልቡ ሳይሆን ወደ ሆዱ ይገባል፤ ከዚያም ወደ መጸዳጃ ይወጣል?”—በዚህም ምግቦችን ሁሉ በማንጻት።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የመጨረሻው ሐረግ አገባቡ አሻሚ ነው። ወይም፣ “በዚህም ምግቦችን ሁሉ ንጹሕ እንደሆኑ አሳወቀ፤” ይህን ሐረግ የማርቆስ ማብራሪያ አድርጎ በመውሰድ። ወይም ምግብ በመፈጨትና ከሰውነት በመውጣት ሂደት ጋር የተያያዘ “ምግቦችን ሁሉ በማንጻት/በማስወገድ” ተብሎ ሊነበብ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: καρδίαν
  choice: ልቡ
  rationale: የግሪኩን ‘ልብ’ ቀጥተኛ ምስል በመጠበቅ የውስጥ ሰውነትን ከምግብ መፍጫ አካል ጋር ያለውን ንጽጽር ይጠብቃል።
- source_word: κοιλίαν
  choice: ሆዱ
  rationale: በዚህ የምግብ መፈጨት አውድ ውስጥ ተፈጥሯዊና ግልጽ የአማርኛ አቻ ነው።
- source_word: ἀφεδρῶνα
  choice: መጸዳጃ
  rationale: የሰውነት ቆሻሻ የሚወገድበትን ስፍራ በግልጽና በጨዋ አነጋገር ያመለክታል።
- source_word: καθαρίζων
  choice: ያነጻል
  rationale: የግሪኩን አሻሚ ተሳቢ አንቀጽ ከ‘ንጹሕ እንደሆነ አወጀ’ ይልቅ በቀጥተኛው ‘ያነጻል’ በማቅረብ ጽሑፋዊ ግልጽነቱን ይጠብቃል።
- source_word: βρώματα
  choice: ምግቦችን
  rationale: የግሪኩን ብዙ ቁጥር በመጠበቅ የተለያዩ የምግብ ዓይነቶችን ያመለክታል።
- source_word: αὐτοῦ
  choice: ልቡ / ሆዱ
  rationale: ተውላጠ ስሙን በአማርኛ ባለቤትነት ቅጥያ በተፈጥሯዊ ሁኔታ ይወክላል።
- source_word: εἰσπορεύεται / ἐκπορεύεται
  choice: ይገባል / ይወጣል
  rationale: በምንጩ ያለውን የመግባትና የመውጣት ንጽጽር በቀላል ዘመናዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: የκαθαρίζων πάντα τὰ βρώματα አገባብና ትርጉም
  choice: ከዋናው ንግግር ቀጥሎ ‘በዚህም ምግቦችን ሁሉ ያነጻል’ ተብሎ ቀጥተኛ ትርጉም ቀርቧል።
  alternative: ሐረጉን የማርቆስ ማብራሪያ አድርጎ ‘በዚህም ምግቦችን ሁሉ ንጹሕ እንደሆኑ አሳወቀ’ ብሎ መተርጎም፤ ወይም የምግብ መፈጨት ሂደቱን እንደሚጠቅስ መውሰድ።
  rationale: የወንድ ፆታ ነጠላ ተሳቢው የተራኪው ማብራሪያ ሊሆን ይችላል፤ ሆኖም የምግብ መፈጨትንና መውጣትን እንደሚጠቅስ ማንበብም ይቻላል። ዋናው ጽሑፍ የግሪኩን ‘ማንጻት’ ቀጥተኛ ቃል ይጠብቃል፤ እውነተኛው የአገባብ አሻሚነት በማስታወሻ ተገልጿል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የሰውነት ተግባሩ በቀጥታ ቢገለጽም ‘መጸዳጃ’ የሚለው ቃል ጨዋነትን ይጠብቃል።
