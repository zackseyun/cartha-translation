review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the heart/stomach/latrine contrast, but it changes the source’s closing interrogative punctuation into a declarative sentence and recasts the final masculine participle as an independent finite verb with an implicit subject. The revision restores the question and retains the participial, syntactically unresolved character of καθαρίζων.
  naturalness: ልቡ, ሆዱ, and መጸዳጃ are natural modern standard Amharic in this register. A dash followed by a participial phrase appropriately signals the difficult explanatory continuation without supplying an unwarranted subject.
  terminology: 'Key terms are retained faithfully: ልብ for καρδία, ሆድ for κοιλία, መጸዳጃ for ἀφεδρών, and ምግቦች for the plural βρώματα. The footnote presents both the widely adopted Markan-explanatory reading and the digestive-process reading without privileging a doctrinal conclusion.'
  issues:
  - severity: medium
    issue: The source punctuation is interrogative, while the draft ends Jesus’ statement with a full stop.
    rationale: SBLGNT places a question mark after ἐκπορεύεται. In context this completes Jesus’ rhetorical question, so the Amharic should end the quotation with ጥያቄ ምልክት.
  - severity: medium
    issue: “በዚህም ምግቦችን ሁሉ ያነጻል” makes καθαρίζων a finite verb and supplies an unclear subject.
    rationale: The Greek has a masculine singular participle whose attachment is disputed. Rendering it as a finite verb both weakens that formal feature and tends to select the digestive-process interpretation. A participial Amharic rendering better preserves the ambiguity.
  revised_text: ምክንያቱም ወደ ልቡ ሳይሆን ወደ ሆዱ ይገባል፤ ከዚያም ወደ መጸዳጃ ይወጣል?”—በዚህም ምግቦችን ሁሉ በማንጻት።[a]
