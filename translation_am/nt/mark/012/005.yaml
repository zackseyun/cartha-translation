  text: ⸀καὶ ἄλλον ἀπέστειλεν· κἀκεῖνον ἀπέκτειναν, καὶ πολλοὺς ἄλλους, ⸂οὓς μὲν δέροντες οὓς δὲ ἀποκτέννοντες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/005.yaml
  text: And he sent another[a], and they killed that one; and many others—some they beat, and some they killed.
translation:
  language: am
  text: እርሱም ሌላ ሎሌ ላከ፤ እነርሱም ያንንም ገደሉት። እንዲሁም ሌሎች ብዙ ሎሌዎችን ላከ፤[a] ከእነርሱም አንዳንዶቹን ደበደቡ፣ ሌሎቹንም ገደሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ «... ሌሎች ብዙዎችን—አንዳንዶቹን እየደበደቡ፣ ሌሎቹንም እየገደሉ።» በግሪኩ «ላከ» የሚለው ግስ ከቀደመው ሐረግ ይሞላል።
    reason: የግሪክኛውን አጭር አገባብና የአሳታፊ ግሶቹን ይበልጥ ቀጥተኛ አቀራረብ ለማሳየት።
lexical_decisions:
- source_word: ἄλλον
  choice: ሌላ ሎሌ
  rationale: ἄλλον በቀደመው አውድ የተጠቀሰውን ሎሌ ያመለክታል። በአማርኛ ስሙን መድገም ማጣቀሻውን ግልጽ ያደርጋል።
- source_word: ἀπέστειλεν
  choice: ላከ
  rationale: ቀላል ያለፈ ድርጊትን በተፈጥሯዊና ቀጥተኛ አማርኛ ይገልጣል።
- source_word: κἀκεῖνον
  choice: ያንን
  rationale: የἐκεῖνονን አመልካች አጽንዖት ይጠብቃል፤ የκαί ጭማሪ ሐሳብም በተከታታዩ ትረካ ውስጥ ይታያል።
- source_word: ἀπέκτειναν / ἀποκτέννοντες
  choice: ገደሉት / ገደሉ
  rationale: የመግደልን ግልጽ እና ኃይለኛ ትርጉም ያለ ማለዘብ ያስተላልፋል።
- source_word: πολλοὺς ἄλλους
  choice: ሌሎች ብዙ ሎሌዎችን
  rationale: ባለቤቱ ተጨማሪ ብዙ ሎሌዎችን እንደላከ ያሳያል፤ ሎሌዎች የሚለው ከአውዱ የተሞላ ነው።
- source_word: οὓς μὲν ... οὓς δὲ
  choice: አንዳንዶቹን ... ሌሎቹንም
  rationale: በሁለቱ ቡድኖች ላይ የደረሰውን የተለያየ አያያዝ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: δέροντες
  choice: ደበደቡ
  rationale: ቃሉ መምታትን ወይም ክፉኛ መደብደብን ያመለክታል፤ የፍርድ ግርፋት እንደሆነ ሳይወስን የዓመፁን ክብደት ያስተላልፋል።
theological_decisions:
- issue: የግሪክ አሳታፊ ግሶችን በአማርኛ መግለጽ
  choice: “አንዳንዶቹን ደበደቡ፣ ሌሎቹንም ገደሉ” በሚሉ ዋና ግሶች መተርጎም
  alternative: “አንዳንዶቹን እየደበደቡ፣ ሌሎቹን እየገደሉ”
  rationale: ይህ የአጻጻፍና የአገባብ ውሳኔ ነው፤ ሁለቱን የግሪክ አሳታፊ ግሶች በአማርኛ ዋና ግሶች መግለጽ የስርጭት ሐሳቡን በግልጽና ተፈጥሯዊ ሁኔታ ያቀርባል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለሕዝብ ቀላል የሆነ አማርኛ ተጠቅሟል። “ሎሌ” በምሳሌው የወይኑን ቦታ ባለቤት የሚወክሉትን የተላኩ አገልጋዮች ለመግለጽ ተመርጧል።
