  text: ὅταν γὰρ ἐκ νεκρῶν ἀναστῶσιν, οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται, ἀλλ’ εἰσὶν ὡς ⸀ἄγγελοι ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/025.yaml
  text: For when they rise from the dead[a], they neither marry nor are given in marriage, but are like angels in heaven.
translation:
  language: am
  text: ምክንያቱም ከሙታን ሲነሡ አያገቡም፤ ለጋብቻም አይሰጡም፤ ነገር ግን እንደ በሰማያት ያሉ መላእክት ናቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν γὰρ
  choice: ምክንያቱም ... በሚነሡበት ጊዜ
  rationale: γάρ ያለውን የማብራሪያ ግንኙነት ‘ምክንያቱም’ ያሳያል፤ ὅταν ያለውን ጊዜያዊ ትርጉም ደግሞ ‘በ...ጊዜ’ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐκ νεκρῶν ἀναστῶσιν
  choice: ከሙታን በሚነሡበት
  rationale: ‘ከሙታን’ ἐκ νεκρῶν የሚለውን የትንሣኤ አገላለጽ ይጠብቃል፤ ‘ይነሣሉ’ ደግሞ የግሪኩን ንቁ የግስ ቅርጽ ያንጸባርቃል።
- source_word: οὔτε γαμοῦσιν οὔτε γαμίζονται
  choice: አያገቡም፣ ለጋብቻም አይሰጡም
  rationale: ሁለቱን የተለያዩ ግሶች ሳያዋህድ የመጋባትንና ለጋብቻ የመሰጠትን ልዩነት ይጠብቃል፤ οὔτε...οὔτε ያለው ተጓዳኝ ክህደት በ‘አይ...ም፣ ...ም አይ...ም’ ተገልጧል።
- source_word: ἀλλ’ εἰσὶν
  choice: ነገር ግን ... ናቸው
  rationale: አሁን ካለው የጋብቻ ሥርዓት ጋር ያለውን ተቃርኖ በግልጽ ሁኔታ ያሳያል።
- source_word: ὡς ἄγγελοι
  choice: እንዳሉ መላእክት
  rationale: ὡς ማነጻጸርን እንጂ የማንነት አንድነትን አያመለክትም፤ አገላለጹ የተነሡት ሰዎች መላእክት ይሆናሉ የሚል ትርጉም እንዳይሰጥ ያደርጋል።
- source_word: ἐν τοῖς οὐρανοῖς
  choice: በሰማያት
  rationale: የግሪኩን ብዙ ቁጥር በቀጥታ የሚያንጸባርቅ፣ በመጽሐፍ ቅዱሳዊ አማርኛም ተፈጥሯዊና የተለመደ አገላለጽ ነው።
