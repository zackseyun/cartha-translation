  choice: ከሙታን የተነሡት ሰዎች በጋብቻ አለመግባታቸው ረገድ መላእክትን ይመስላሉ።
  alternative: ከሙታን የተነሡት ሰዎች መላእክት ይሆናሉ።
  rationale: ὡς የሚለው አነጻጻሪ ቃል መመሳሰልን እንጂ ወደ መላእክት የመለወጥን ሐሳብ አይገልጽም።
