  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὐδὲ τὴν γραφὴν ταύτην ἀνέγνωτε· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες, οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/010.yaml
  text: 'Have you not even read this Scripture: ‘The stone that the builders rejected[a], this has become the cornerstone’?”'
translation:
  language: am
  text: '“ይህን የቅዱስ መጽሐፍ ክፍል እንኳ አላነበባችሁምን?


    ‘ገንቢዎች የጣሉት ድንጋይ፣


    እርሱ የማዕዘን ድንጋይ[a] ሆነ።’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “የማዕዘን ራስ”፤ በባሕላዊ አተረጓጎም፣ “ዋናው የማዕዘን ድንጋይ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: γραφὴν
  choice: የቅዱስ መጽሐፍ ቃል
  rationale: በአዲስ ኪዳን አጠቃቀም γραφή ቅዱስ መጽሐፍን ወይም ከእርሱ የተወሰደን ክፍል ያመለክታል፤ ይህ አተረጓጎም ኢየሱስ የጠቀሰውን የመጽሐፍ ቃል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οὐδὲ
  choice: እንኳ ... አላ...ምን
  rationale: οὐδέ ያለውን አጽንዖት በአማርኛው ‘እንኳ’ ይጠብቃል።
- source_word: ἀνέγνωτε
  choice: አላነበባችሁምን
  rationale: ያለፈ ድርጊትን በሚጠይቅ የወቀሳ ጥያቄ መልክ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: Λίθον
  choice: ድንጋይ
  rationale: የመዝሙር 118 ጥቅስ የሚያመለክተውን የታወቀ ድንጋይ በዐውዱ ግልጽ በሆነ መልኩ ያቀርባል።
- source_word: ἀπεδοκίμασαν
  choice: የናቁት
  rationale: ቃሉ ከመረመሩ በኋላ ብቁ አይደለም ብሎ መጣልን ያመለክታል፤ ‘የናቁት’ በዚህ የግንባታ ምሳሌ ውስጥ አጭርና ተፈጥሯዊ ነው።
- source_word: οἱ οἰκοδομοῦντες
  choice: ግንበኞች
  rationale: ስም ሆኖ የገባውን ተሳቢ አጭርና ግልጽ በሆነ ዘመናዊ አማርኛ ይተረጉማል።
- source_word: ἐγενήθη
  choice: ሆነ
  rationale: የግሪኩን አኦሪስት በቀጥተኛ ያለፈ ጊዜ ያቀርባል፤ ድንጋዩ ያገኘውን አዲስ ስፍራና ሁኔታ ይገልጻል።
- source_word: εἰς κεφαλὴν γωνίας
  choice: የማዕዘን ድንጋይ
  rationale: በአማርኛ የግንባታውን ምሳሌ በግልጽና በተለመደ ቃል ያቀርባል፤ የግሪኩ ቀጥተኛ አገላለጽ ‘የማዕዘን ራስ’ በእግር ማስታወሻ ተጠብቋል።
theological_decisions:
- issue: በመዝሙር 118፥22 ያለው የድንጋይ ምሳሌ መሲሐዊ አጠቃቀም
  choice: የድንጋይ፣ የግንበኞችና የማዕዘን ድንጋይ ምሳሌው ያለ ትርጓሜያዊ ጭማሪ ተጠብቋል።
  alternative: በዋናው ጽሑፍ ድንጋዩ መሲሑን እንደሚያመለክት በግልጽ መጨመር።
  rationale: ዐውዱ ቃሉን በኢየሱስ ላይ ቢያውለውም፣ ትርጉሙ የቅዱስ መጽሐፉን ምሳሌ ራሱ እንዲናገር ይተወዋል፤ ይህም የጽሑፉን መለኮታዊ ክብደትና ውጥረት ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። የጥቅሱ ግጥማዊ አቀራረብ በመስመር ክፍፍል ተጠብቋል።
