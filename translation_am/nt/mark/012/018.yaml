base_translation:
  language: en
  yaml_path: translation/nt/mark/012/018.yaml
  text: And Sadducees came to him, who say there is no resurrection, and they began questioning him, saying,
translation:
  language: am
  text: ትንሣኤ የለም የሚሉ ሰዱቃውያንም ወደ እርሱ መጥተው እንዲህ ሲሉ ይጠይቁት ጀመሩ፦
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σαδδουκαῖοι
  choice: ሰዱቃውያን
  rationale: በዘመናዊ መደበኛ አማርኛ የተለመደውን የቡድኑን ስም ይጠቀማል።
- source_word: ἀνάστασιν
  choice: ትንሣኤ
  rationale: ከሞት መነሣትን የሚያመለክተው የተለመደና ትክክለኛ መጽሐፍ ቅዱሳዊ ቃል ነው።
- source_word: ἐπηρώτων
  choice: ይጠይቁት ጀመር
  rationale: የግሱን ያልተፈጸመ የአለፈ ጊዜ ገጽታ በተፈጥሯዊ አማርኛ የድርጊቱን መጀመርና መቀጠል በሚያሳይ መንገድ ያቀርባል።
- source_word: λέγοντες
  choice: እንዲህ ሲሉ
  rationale: የሚከተለውን ቀጥተኛ ንግግር በተፈጥሯዊ አማርኛ ያስገባል።
theological_decisions:
- issue: የሰዱቃውያን አቋም
  choice: ትንሣኤ የለም የሚሉ
  alternative: ትንሣኤን የሚክዱ
  rationale: የግሪኩን ‘ትንሣኤ የለም ይላሉ’ የሚለውን አገላለጽ በቅርብ ይጠብቃል፤ ተጨማሪ የትርጓሜ ጫናም አያስገባም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ ነው። ‘ሰዱቃውያንም’ የሚለው ተያያዥነትን፣ ‘ይጠይቁት ጀመር’ ደግሞ የἐπηρώτωνን ቀጣይነት ያሳያል።
