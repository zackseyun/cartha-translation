id: MRK.12.32
reference: Mark 12:32
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀καὶ εἶπεν αὐτῷ ὁ γραμματεύς· Καλῶς, διδάσκαλε, ἐπ’ ἀληθείας εἶπες ὅτι εἷς ἐστιν καὶ οὐκ ἔστιν ἄλλος πλὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/032.yaml
  text: And the scribe said to him[a], “Well said, Teacher. You have spoken truly that he is one, and there is no other besides him.”
translation:
  language: am
  text: ጸሐፊውም፣ “መምህር ሆይ፣ መልካም ብለሃል። እርሱ አንድ እንደሆነ[a]፣ ከእርሱም በቀር ሌላ እንደሌለ በእውነት ተናግረሃል” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም አውዱን ይበልጥ ግልጽ በማድረግ፣ “እግዚአብሔር አንድ ነው።” ግሪኩ “እርሱ አንድ ነው” ብቻ ይላል፤ ተሳቢው ከቀዳሚው አውድ ይታወቃል።
    reason: alternative_reading
lexical_decisions:
- source_word: γραμματεύς
  choice: ጸሐፊ
  rationale: በወንጌላት አውድ የኦሪት ሕግ ምሁር የሆነውን የታወቀ ቡድን የሚያመለክት የተለመደና አጭር ትርጉም ነው።
- source_word: Καλῶς
  choice: መልካም ተናገርህ
  rationale: ጸሐፊው የኢየሱስን ቀዳሚ መልስ በማድነቅ ‘በመልካም/በትክክል’ ማለቱን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: διδάσκαλε
  choice: መምህር ሆይ
  rationale: በቀጥታ ንግግር ውስጥ የδιδάσκαλοςን የአድራሻ ቅርጽ በክብርና በተፈጥሯዊነት ያስተላልፋል።
- source_word: ἐπ’ ἀληθείας
  choice: በእውነት
  rationale: ንግግሩ እውነተኛ መሆኑን የሚያረጋግጠውን ተውሳካዊ ኃይል በግልጽ አማርኛ ይጠብቃል።
- source_word: εἷς ἐστιν
  choice: እርሱ አንድ ነው
  rationale: ግሪኩ ‘እግዚአብሔር’ የሚለውን ስም ሳይደግም በአውዱ የሚታወቅ ተሳቢ ይጠቀማል፤ ይህ ምርጫ ያንን አጭርነት ይጠብቃል።
- source_word: πλὴν αὐτοῦ
  choice: ከእርሱ በቀር
  rationale: የማግለያውን ‘ከእርሱ በስተቀር/በቀር’ ትርጉም በተፈጥሯዊና ግልጽ አማርኛ ያቀርባል።
theological_decisions:
- issue: በεἷς ἐστιν ውስጥ ያልተገለጸው ተሳቢ
  choice: በዋናው ጽሑፍ ‘እርሱ አንድ ነው’ የሚለውን የግሪኩን አጭር አነጋገር መጠበቅ
  alternative: ‘እግዚአብሔር አንድ ነው’ ወይም ‘አንድ አምላክ አለ’
  rationale: ቀዳሚው አውድ ተሳቢው እግዚአብሔር መሆኑን ግልጽ ያደርጋል፤ ሆኖም ይህ ቁጥር θεόςን በግልጽ አይደግምም። ስለዚህ የምንጩን አሻሚ ያልሆነ ነገር ግን አጭር አነጋገር ጠብቆ ማቅረብ ተመራጭ ነው።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። ‘ጸሐፊ’ በወንጌላት የተለመደውን ቃል ይጠብቃል፤ የግሪኩ ያልተገለጸ ተሳቢም በዋናው ጽሑፍ አልተስፋፋም።
