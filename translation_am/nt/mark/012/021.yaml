lexical_decisions:
- source_word: ὁ δεύτερος
  choice: ሁለተኛው
  rationale: በግሪክኛው የደረጃ ቅጽል በስም ፈንታ ቆሟል። በዐውዱ ወንድም መሆኑ ቢታወቅም፣ በዚህ ሐረግ በግልጽ ስላልተጠቀሰ «ሁለተኛው» ብቻ ተተርጉሟል።
- source_word: ἔλαβεν αὐτήν
  choice: ወሰዳት
  rationale: የግሪክኛውን «ወሰዳት» የሚለውን መሠረታዊ አገላለጽ ይጠብቃል፤ በዚህ የአማችነት ጋብቻ ዐውድ ግን ሚስት አድርጎ መውሰዱን ያመለክታል። ግልጽ የዐውድ ትርጉሙ በግርጌ ማስታወሻ ቀርቧል።
- source_word: ἀπέθανεν
  choice: ሞተ
  rationale: የትረካውን ቀጥተኛና ግልጽ አነጋገር የሚጠብቅ ተፈጥሯዊ የአማርኛ አቻ ነው።
- source_word: μὴ καταλιπὼν
  choice: ሳይተው
  rationale: ከሞቱ ጋር የተያያዘውን አብሮአዊ ሁኔታ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: σπέρμα
  choice: ዘር
  rationale: σπέρμα በዚህ ዐውድ ልጅን ወይም ትውልድን ያመለክታል። «ዘር» የምንጩን ቃላዊ ምስል ይጠብቃል፣ በዚህ የአማችነት ጋብቻ ዐውድም የሚወለድ ተተኪ ልጅ ማለት መሆኑ ይገባል።
- source_word: ὁ τρίτος ὡσαύτως
  choice: ሦስተኛውም እንዲሁ ሆነ
  rationale: የግሪክኛውን አጭርና የተደጋገመውን ድርጊት በዐውድ የሚያስገነዝብ አገላለጽ በተፈጥሯዊ አማርኛ ያቀርባል።
