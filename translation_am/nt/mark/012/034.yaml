  text: καὶ ὁ Ἰησοῦς ἰδὼν ⸀αὐτὸν ὅτι νουνεχῶς ἀπεκρίθη εἶπεν αὐτῷ· Οὐ μακρὰν εἶ ἀπὸ τῆς βασιλείας τοῦ θεοῦ. καὶ οὐδεὶς οὐκέτι ἐτόλμα αὐτὸν ἐπερωτῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/034.yaml
  text: And Jesus[a], seeing that he had answered wisely, said to him, “You are not far from the kingdom of God.” And no one any longer dared to question him.
translation:
  language: am
  text: ኢየሱስም እርሱ በማስተዋል እንደመለሰ አይቶ፣ “አንተ ከእግዚአብሔር መንግሥት ሩቅ አይደለህም”[a] አለው። ከዚያ በኋላም ማንም ሊጠይቀው አልደፈረም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከእግዚአብሔር መንግሥት ቅርብ ነህ።” ግሪክኛው ቅርበትን ይገልጻል እንጂ ወደ መንግሥቱ መግባትን በግልጽ አይናገርም።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: አይቶ
  rationale: የግሪክኛውን ተሳቢ ግስ በተፈጥሯዊ የአማርኛ አገባብ ያቀርባል፤ ኢየሱስ መልሱን ተመልክቶ መናገሩንም ይጠብቃል።
- source_word: νουνεχῶς
  choice: በማስተዋል
  rationale: ቃሉ አስተዋይነትንና የታሰበ ጥሩ ፍርድን ያመለክታል፤ ‘በማስተዋል’ ይህን በዘመናዊና ክቡር አማርኛ ያስተላልፋል።
- source_word: ἀπεκρίθη
  choice: እንደመለሰ
  rationale: ከ‘አይቶ’ ጋር ተያይዞ የድርጊቶቹን ቅደም ተከተል በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Οὐ μακρὰν εἶ ἀπὸ
  choice: ከ… ሩቅ አይደለህም
  rationale: የምንጩን የቦታ ቅርበት ምሳሌ በቀጥታ ይጠብቃል፤ ሰውየው ወደ መንግሥቱ ገብቷል የሚል ተጨማሪ ፍቺ አያስገባም።
- source_word: βασιλείας τοῦ θεοῦ
  choice: የእግዚአብሔር መንግሥት
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የታወቀ ሲሆን፣ የንግሥናን አገዛዝና ግዛት ሁለቱንም ሊያመለክት የሚችለውን ስፋት ይጠብቃል።
- source_word: οὐκέτι
  choice: ከዚያ በኋላም
  rationale: ከዚያ ጊዜ ጀምሮ ጥያቄው እንዳልቀጠለ የሚያሳየውን ጊዜያዊ ኃይል በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἐτόλμα
  choice: አልደፈረም
  rationale: የግሪክኛውን የመድፈር ወይም የመሞከር ሐሳብ ቀጥተኛና የተለመደ በሆነ አማርኛ ያስተላልፋል።
- source_word: ἐπερωτῆσαι
  choice: ሊጠይቀው
  rationale: በዐውደ ንባቡ ለፈተና የሚቀርብ ጥያቄን ሊያካትት ቢችልም፣ ምንጩ የሚፈቅደውን ስፋት ሳያጠብ ‘መጠየቅ’ በሚለው ገለልተኛ ቃል ተተርጉሟል።
