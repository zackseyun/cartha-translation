  text: Καὶ ἀποστέλλουσιν πρὸς αὐτόν τινας τῶν Φαρισαίων καὶ τῶν Ἡρῳδιανῶν ἵνα αὐτὸν ἀγρεύσωσιν λόγῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/013.yaml
  text: And they send to him some of the Pharisees and some of the Herodians[a], so that they might trap him by a word.
translation:
  language: am
  text: እነርሱም ከፈሪሳውያንና ከሄሮድሳውያን አንዳንዶችን ወደ እርሱ ላኩ፤ በንግግር ሊያጠምዱት።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστέλλουσιν
  choice: ላኩ
  rationale: የግሪኩ ግስ ታሪካዊ የአሁን ጊዜን ቢጠቀምም፣ በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜ መጠቀም ድርጊቱን ግልጽ ያደርገዋል።
- source_word: τινας τῶν Φαρισαίων καὶ τῶν Ἡρῳδιανῶν
  choice: ከፈሪሳውያንና ከሄሮድሳውያን አንዳንዶቹን
  rationale: የክፍል አመልካቹን አወቃቀር በመጠበቅ ከሁለቱም ቡድኖች የተወሰኑ ሰዎች እንደተላኩ ያሳያል።
- source_word: Φαρισαίων
  choice: ፈሪሳውያን
  rationale: በአማርኛ የተለመደውን የአይሁድ ቡድን ስም ይጠቀማል።
- source_word: Ἡρῳδιανῶν
  choice: ሄሮድሳውያን
  rationale: ከሄሮድስ ጋር የተቆራኘውን ቡድን ስም በአማርኛ ፊደል ያቀርባል።
- source_word: ἵνα
  choice: ሊያጠምዱት
  rationale: የዓላማ ንዑስ ሐረጉን በተፈጥሯዊው የአማርኛ ሊ- አወቃቀር ያሳያል።
- source_word: ἀγρεύσωσιν
  choice: ሊያጠምዱት
  rationale: ቃሉ ከአደን የተወሰደውን የማጥመድ ምስል በዘይቤ ይጠብቃል።
- source_word: λόγῳ
  choice: በቃል
  rationale: የመሣሪያ ወይም የዘዴ ትርጉሙንና የነጠላውን λόγος ቅርጽ ይጠብቃል፤ በንግግሩ እንደሚያጠምዱት አውዱ ያሳያል።
theological_decisions:
- issue: በግሪኩ የብዙ ቁጥር ግስ ውስጥ ብቻ የታወቀው የድርጊቱ ባለቤት
  choice: እነርሱም
  alternative: የካህናት አለቆች፣ ጸሐፍትና ሽማግሌዎች፤ ወይም ባለሥልጣናቱ
  rationale: ቁጥሩ የላኪዎቹን ማንነት እንደገና አይጠቅስም፤ ስለዚህ ከአውዱ የተወሰደ ዝርዝር ማንነት በዋናው ጽሑፍ ውስጥ ሳይጨመር የግሪኩ ያልተገለጸ ብዙ ቁጥር ተጠብቋል።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራ አንባቢ የሚገባ ነው። “በቃል ሊያጠምዱት” የሚለው ሐረግ የምንጩን አጭርነትና የአደን ዘይቤ ይጠብቃል፤ የበለጠ ግልጽ አማራጭ በማስታወሻው ተሰጥቷል።
