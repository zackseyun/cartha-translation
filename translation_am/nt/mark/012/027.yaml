  text: οὐκ ἔστιν ⸀θεὸς νεκρῶν ⸀ἀλλὰ ζώντων· ⸀πολὺ πλανᾶσθε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/027.yaml
  text: He is not God of the dead[a], but of the living[b]. You are greatly mistaken.
translation:
  language: am
  text: እርሱ የሙታን አምላክ ሳይሆን የሕያዋን አምላክ ነው።[a] እጅግ ተሳስታችኋል።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በቃል በቃል፣ “አምላክ የሙታን አይደለም፤ የሕያዋን ነው።”
    reason: የአገባብ አማራጭ
  - marker: b
    text: ወይም፣ “በእጅጉ በስህተት ላይ ናችሁ።”
    reason: የቃላት አማራጭ
lexical_decisions:
- source_word: θεὸς
  choice: አምላክ
  rationale: በዚህ አውድ ቃሉ የአብርሃምን፣ የይስሐቅንና የያዕቆብን አምላክ ያመለክታል፤ ስለዚህ ያልተወሰነውን ‘አንድ አምላክ’ ሳይሆን መለኮታዊውን መጠሪያ ‘አምላክ’ መጠቀም ተገቢ ነው።
- source_word: νεκρῶν
  choice: የሙታን
  rationale: የብዙ ቁጥር ዘርፍ ቅርጹ በስም ተግባር ‘ሙታንን’ ያመለክታል፤ ይህም ከ‘ሕያዋን’ ጋር ያለውን ቀጥተኛ ንጽጽር ይጠብቃል።
- source_word: ἀλλὰ ζώντων
  choice: ሳይሆን የሕያዋን
  rationale: ζώντων በስም ተግባር የቆመ ተሳቢ ሲሆን ‘ሕያዋንን’ ያመለክታል። ‘ሳይሆን’ የοὐκ … ἀλλάን ጠንካራ ተቃርኖ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οὐκ ἔστιν
  choice: እርሱ … ሳይሆን … ነው
  rationale: በግሪክ ግልጽ ተውላጠ ስም ባይኖርም፣ ከቅርብ አውዱ አምላክ እንደ ባለቤት ይገባል። ‘እርሱ’ በአማርኛ አረፍተ ነገሩን ግልጽና ተፈጥሯዊ ያደርገዋል።
- source_word: πολὺ
  choice: እጅግ
  rationale: ቃሉ πλανᾶσθεን በተውሳከ ግስ ተግባር ያጠናክራል፤ ‘እጅግ’ ይህን ኃይል በዘመናዊና ክብር ባለው አማርኛ ያስተላልፋል።
- source_word: πλανᾶσθε
  choice: ተሳስታችኋል
  rationale: መካከለኛ/ተገብሮ ቅርጹ እዚህ በእምነት ጉዳይ ስህተት ውስጥ መሆንን ያሳያል። ‘ተሳስታችኋል’ የውጭ አታላይን በግድ ሳያስገባ የኢየሱስን ግሳጼ በተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: የኢየሱስ ክርክር ለትንሣኤና በአምላክ ፊት ሕያው ስለ መሆን የሚያመለክተው
  choice: ንግግሩን በ‘ሙታን’ና ‘ሕያዋን’ መካከል ያለ ቀጥተኛ ንጽጽር አድርጎ መተርጎም
  alternative: ትርጉሙን በማስፋት ስለ ትንሣኤ ወይም ስለ መካከለኛው ሁኔታ ግልጽ የትምህርት ማብራሪያ ማከል
  rationale: ጥቅሱ የትንሣኤን እውነታ ለማስረዳት በኢየሱስ ክርክር ውስጥ ቢገኝም፣ ትርጉሙ ከተጻፈው በላይ የሆነ የሥነ መለኮት ማብራሪያ አያስገባም። ቀላሉ ንጽጽር የጽሑፉን ኃይልና የሥነ መለኮት ውጥረት ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ይጠቀማል። ‘ሙታን/ሕያዋን’ የሚለው ሚዛናዊ ንጽጽር ተጠብቋል፤ ‘ተሳስታችኋል’ም ንግግራዊ ሳይሆን ለተራ አንባቢ ቀላል የሆነ ግሳጼ ነው።
