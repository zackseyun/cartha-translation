review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the explanatory γάρ, the contrast between the other contributors and the woman, her poverty, the totality of what she gave, and βίος as her means of subsistence rather than her biological life. However, «ከተረፋቸው ላይ» is not idiomatic and can be read as ‘from what remained of them’; it should explicitly mean what remained over for them.
  naturalness: The register is appropriately modern and clear. Replacing the awkward surplus expression with «ከተረፈላቸው ነገር» gives natural standard Amharic without weakening the contrast.
  terminology: «ከድህነቷ», «ያላትን ሁሉ», and «መተዳደሪያዋን በሙሉ» are suitable. «አስገብተዋል/አስገባች» appropriately retains the offering-box action in context.
  issues:
  - severity: medium
    issue: «ከተረፋቸው ላይ» is grammatically and idiomatically weak.
    rationale: The Greek ἐκ τοῦ περισσεύοντος αὐτοῖς means ‘from what was surplus to them.’ In Amharic, «ከተረፈላቸው ነገር» clearly expresses that surplus, while the draft's possessive form and «ላይ» can obscure the intended relationship.
  revised_text: ሁሉም ከተረፈላቸው ነገር አስገብተዋልና፤ እርሷ ግን ከድህነቷ ያላትን ሁሉ፣ መተዳደሪያዋን በሙሉ[a] አስገባች።
