  text: ⸀καὶ λαβόντες αὐτὸν ἔδειραν καὶ ἀπέστειλαν κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/003.yaml
  text: And they took him[a], beat him, and sent him away empty-handed.
translation:
  language: am
  text: እነርሱም ያዙት፣ ደበደቡትም፣ ባዶ እጁንም ሰደዱት።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβόντες
  choice: ያዙት
  rationale: የግሪኩ የቅድም ድርጊት አገላለጽ በዐውዱ ተከታታይ ድርጊትን ያሳያል። «ያዙት» የግሱን ሰፊ ትርጉም ይጠብቃል፤ «አፈኑት» ወይም «ነጠቁት» ከምንጩ በላይ ኃይል ሊጨምር ይችላል።
- source_word: ἔδειραν
  choice: ደበደቡት
  rationale: δέρω በዚህ ዐውድ በኃይል መምታትን ያመለክታል። «ደበደቡት» ተፈጥሯዊና ግልጽ ሲሆን መደበኛ ግርፋትን በማለት ከምንጩ የማይገኝ ዝርዝር አይጨምርም።
- source_word: ἀπέστειλαν
  choice: ሰደዱት
  rationale: ἀποστέλλω ከእነርሱ ዘንድ መላክን ያሳያል። በአማርኛ «ሰደዱት» የማስወጣት ስሜትን በተፈጥሮ ይይዛል።
- source_word: κενόν
  choice: ባዶ እጁን
  rationale: κενόν ቃል በቃል «ባዶ» ማለት ሲሆን፣ እዚህ አገልጋዩ የመጣበትን ነገር ሳያገኝ መመለሱን ያሳያል። «ባዶ እጁን» ይህን ትርጉም በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: καὶ ... καὶ
  choice: እነርሱም ... ደበደቡትም ... ሰደዱት
  rationale: የተደጋገመው καί ቀጥተኛ የትረካ ቅደም ተከተልን ያገናኛል። የአማርኛው «-ም» አያያዥ ይህን ተመሳሳይ ቀላል ትይዩነት በተፈጥሮ ይጠብቃል።
