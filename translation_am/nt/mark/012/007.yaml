base_translation:
  language: en
  yaml_path: translation/nt/mark/012/007.yaml
  text: But those tenant farmers said to one another[a], ‘This is the heir. Come, let us kill him[b], and the inheritance will be ours.’
translation:
  language: am
  text: እነዚያ ተከራይ ገበሬዎች ግን እርስ በርሳቸው[a] እንዲህ አሉ፦ “ወራሹ ይህ ነው፤ ኑ፣ እንግደለው፤ ርስቱም የእኛ ይሆናል[b]።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በመካከላቸው።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ርስቱም ለእኛ ይሆናል።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνοι δὲ
  choice: እነዚያ … ግን
  rationale: ἐκεῖνοι ያለውን አመልካችነት “እነዚያ” ይጠብቃል፤ δέ ደግሞ ቀላል ተቃርኖን “ግን” በማለት ያሳያል።
- source_word: γεωργοὶ
  choice: ተከራይ ገበሬዎች
  rationale: በወይኑ ቦታ ምሳሌ አውድ እነዚህ መሬቱን ተከራይተው የሚያርሱና ለባለቤቱ ኃላፊነት ያለባቸው ሰዎች መሆናቸውን ያብራራል።
- source_word: πρὸς ἑαυτοὺς εἶπαν
  choice: እርስ በርሳቸው … አሉ
  rationale: በቡድኑ ውስጥ የተደረገውን የጋራ ንግግር በተፈጥሯዊ አማርኛ ይገልጣል፤ የውስጥ ሐሳብ ብቻ እንደሆነ አያስመስልም።
- source_word: ὅτι
  choice: ቀጥተኛ ንግግር በጥቅስ ምልክት
  rationale: ὅτι እዚህ ቀጥተኛ ንግግርን ያስገባል፤ በአማርኛ ይህን በጥቅስ ምልክትና በመጨረሻው “አሉ” ማቅረብ ተፈጥሯዊ ነው።
- source_word: Οὗτός ἐστιν ὁ κληρονόμος
  choice: ወራሹ ይህ ነው
  rationale: “ወራሽ” የκληρονόμοςን ሕጋዊና ቤተሰባዊ ትርጉም በተለመደ ዘመናዊ አማርኛ ይገልጣል፤ የአመልካቹ አጽንዖትም ተጠብቋል።
- source_word: δεῦτε
  choice: ኑ
  rationale: የብዙ ቁጥር የማነሳሻ ጥሪውን በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀποκτείνωμεν
  choice: እንግደለው
  rationale: የመጀመሪያ ሰው ብዙ ቁጥር የማነሳሻ አሳብን በቀጥታ ይገልጣል፤ በግሪኩ ያልተገለጸ ተጨማሪ ሕጋዊ ፍርድ አያክልም።
- source_word: καὶ ἡμῶν ἔσται ἡ κληρονομία
  choice: ርስቱም የእኛ ይሆናል
  rationale: የἡμῶνን አጽንዖትና የይዞታ ተስፋቸውን በተፈጥሯዊ አማርኛ ይጠብቃል፤ በግሪኩ የሌለው “የእርሱ” አልተጨመረም።
