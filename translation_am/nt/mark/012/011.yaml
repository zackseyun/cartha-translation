  text: This came from the Lord[b][a], and it is marvelous in our eyes.
translation:
  language: am
  text: ይህ ከጌታ ዘንድ ሆነ[a][b]፤ በዓይናችንም ድንቅ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ይህ በጌታ ሆነ።» የግሪኩ ሐረግ ምንጭን ወይም አድራጊነትን ሊያመለክት ይችላል።
    reason: lexical_alternative
