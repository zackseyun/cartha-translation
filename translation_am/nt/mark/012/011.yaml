    text: ይህ ንግግር ከመዝሙር 118፥23 የተጠቀሰ ነው።
    reason: cross_reference
lexical_decisions:
- source_word: παρὰ κυρίου
  choice: ከጌታ ዘንድ
  rationale: παρά ከወራሽ ስም ጋር በዋናነት ምንጭን ወይም መነሻን ያመለክታል። «ከጌታ ዘንድ» ይህን ፍቺ በተፈጥሯዊና ክብር ባለው አማርኛ ያስተላልፋል፤ የአድራጊነት ፍቺውም በማስታወሻ ተጠብቋል።
- source_word: κυρίου
  choice: ጌታ
  rationale: በግሪኩ የተጻፈው κύριος ስለሆነ «ጌታ» ተብሎ ተተርጉሟል። ጥቅሱ እግዚአብሔርን ቢያመለክትም፣ ከዕብራይስጡ የመለኮታዊውን ስም አጻጻፍ ወደ ግሪኩ ጽሑፍ አያስገባም።
- source_word: ἐγένετο
  choice: ሆነ
  rationale: γίνομαι እዚህ አንድ ነገር መሆኑን ወይም መፈጸሙን ያመለክታል። «ሆነ» አጭርና ተፈጥሯዊ ሆኖ የግሪኩን ሰፊ ፍቺ ይጠብቃል።
- source_word: αὕτη
  choice: ይህ
  rationale: የአመልካቹ ቃል ማጣቀሻ ቀደም ሲል የተነገረው፣ የተጣለው ድንጋይ የማዕዘን ራስ መሆኑ ነው። «ይህ» ያንን ማጣቀሻ ሳያብራራ ይጠብቃል።
- source_word: θαυμαστὴ
  choice: ድንቅ
  rationale: θαυμαστός አስደናቂና ልዩ የሆነን ነገር ይገልጣል። «ድንቅ» በዘመናዊ አማርኛ ግልጽ ሲሆን የመዝሙሩን ከፍ ያለ ቃናም ይጠብቃል።
- source_word: ἐν ὀφθαλμοῖς ἡμῶν
  choice: በዓይናችን
  rationale: ይህ ሴማዊ አነጋገር «በእኛ እይታ» ወይም «ለእኛ» ማለት ነው። «በዓይናችን» ምስላዊ አገላለጹን በግልጽ አማርኛ ይጠብቃል።
theological_decisions:
- issue: እግዚአብሔርን በሚያመለክት የመዝሙር ጥቅስ ውስጥ κύριοςን መተርጎም
