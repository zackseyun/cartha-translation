  rationale: የግሪኩ ሐረግ ምንጭንም አድራጊነትንም ሊያመለክት ይችላል። ዋናው ጽሑፍ የምንጭን ፍቺ በቀጥታ ይዟል፤ ሌላው ትርጉም ግን በማስታወሻ ተጠብቋል።
