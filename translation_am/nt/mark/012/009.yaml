source:
  edition: SBLGNT
  text: ⸀τί ποιήσει ὁ κύριος τοῦ ἀμπελῶνος; ἐλεύσεται καὶ ἀπολέσει τοὺς γεωργούς, καὶ δώσει τὸν ἀμπελῶνα ἄλλοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/009.yaml
  text: What will the owner of the vineyard do? He will come and destroy the tenant farmers[a], and give the vineyard to others.
translation:
  language: am
  text: የወይን አትክልቱ ባለቤት ምን ያደርጋል? ይመጣል፤ ተከራይ ገበሬዎቹን ያጠፋቸዋል፤ የወይን አትክልቱንም ለሌሎች ይሰጣል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί ποιήσει
  choice: ምን ያደርጋል?
  rationale: የግሪኩን ቀጥተኛ የወደፊት ጊዜ ጥያቄ በተፈጥሯዊ አማርኛ ያቀርባል፤ በምንጩ የሌለ አያያዥ ቃል አይጨምርም።
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: የወይኑ ቦታ ባለቤት
  rationale: κύριος በዚህ ምሳሌ ውስጥ የወይኑን ቦታ ባለንብረት ያመለክታል፤ «ባለቤት» ይህን አውዳዊ ትርጉም ያለ አላስፈላጊ መለኮታዊ ማዕረግ ያስተላልፋል።
- source_word: ἀμπελῶνος / ἀμπελῶνα
  choice: የወይኑ ቦታ / የወይኑን ቦታ
  rationale: ἀμπελών ወይን የሚተከልበትን መሬት ያመለክታል፤ «የወይን ቦታ» ለዘመናዊ አንባቢ ግልጽና ተፈጥሯዊ ነው።
- source_word: ἐλεύσεται
  choice: መጥቶ
  rationale: ከሚከተሉት የወደፊት ድርጊቶች ጋር በአማርኛ ተፈጥሯዊ ቅደም ተከተል ያገናኛል፤ የመምጣቱን ድርጊት ይጠብቃል።
- source_word: ἀπολέσει
  choice: ያጠፋቸዋል
  rationale: የἀπόλλυμιን ከባድና ወሳኝ ፍርድ ያስተላልፋል፤ «ይገድላቸዋል» ከሚለው ይልቅ የግሪኩን ሰፊ የትርጉም ወሰን ይጠብቃል።
- source_word: τοὺς γεωργούς
  choice: ተከራይ ገበሬዎቹን
  rationale: በምሳሌው አውድ γεωργοί የሌላውን የወይን ቦታ ተከራይተው የሚያርሱ ሰዎች ናቸው፤ ይህ አገላለጽ የእርሻና የኪራይ ገጽታዎቹን ሁለቱንም ያሳያል።
- source_word: δώσει
  choice: ይሰጣል
  rationale: የδίδωμιን ቀጥተኛና ሰፊ ትርጉም ይጠብቃል፤ «ያከራያል» ወይም «አደራ ይሰጣል» ብሎ ከምንጩ በላይ አይወስንም።
- source_word: ἄλλοις
  choice: ለሌሎች
  rationale: ግሪኩ ሌሎቹ ማን እንደሆኑ አይገልጽም፤ አማርኛውም ይህን ክፍትነት ይጠብቃል።
theological_decisions:
- issue: በምሳሌያዊና ሰብአዊ አውድ κύριοςን መተርጎም
  choice: ባለቤት
  alternative: ጌታ / አለቃ
  rationale: የቅርብ አውዱ ቃሉን የወይኑ ቦታ ባለንብረት አድርጎ ይገድበዋል። «ባለቤት» የምሳሌውን ሰፊ ሥነ መለኮታዊ ጠቀሜታ ሳይክድ፣ በቃሉ ላይ በቀጥታ መለኮታዊ ማዕረግ አይጭንም።
