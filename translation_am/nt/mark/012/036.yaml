    rationale: The participle «ሆኖ» normally means “being/having become.” Attached to «መንፈስ ቅዱስ», it may imply that David himself was the Holy Spirit rather than that he spoke in/by the Holy Spirit.
  - severity: medium
    issue: Footnote markers do not correspond to the English POB audit-trail marker assignments.
    rationale: The supplied English record assigns [a] to the Psalm 110:1/Hebrew-background note and [b] to the alternative “by the Holy Spirit” note. The draft reverses these markers. Re-anchoring resolves this structural audit-trail inconsistency without changing meaning.
