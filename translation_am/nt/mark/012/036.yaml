  text: ⸀αὐτὸς Δαυὶδ εἶπεν ἐν ⸂τῷ πνεύματι τῷ⸃ ἁγίῳ· ⸀Εἶπεν ⸀κύριος τῷ κυρίῳ μου· ⸀Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ⸀ὑποκάτω τῶν ποδῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/036.yaml
  text: David himself said in the Holy Spirit[a], ‘The Lord said to my Lord[b], “Sit at my right hand until I put your enemies under your feet.”’
translation:
  language: am
  text: ዳዊት ራሱ በመንፈስ ቅዱስ[b] እንዲህ ብሎ ነበር፦ “ጌታ[a] ለጌታዬ፣ ‘ጠላቶችህን ከእግሮችህ በታች እስካደርግ ድረስ በቀኜ ተቀመጥ’ አለ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ጥቅሱ ከመዝሙር 110፥1 ነው። በዕብራይስጡ ጽሑፍ የመጀመሪያው “ጌታ” መለኮታዊውን ስም (ያህዌን፤ በባህል “እግዚአብሔር” ተብሎ የሚተረጎመውን) ይወክላል፤ ሁለተኛው ግን የዳዊትን ጌታ ያመለክታል።
    reason: cross_reference
  - marker: b
    text: ወይም፣ “በመንፈስ ቅዱስ።”
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτὸς
  choice: ራሱ
  rationale: የαὐτόςን አጽንዖት በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ተናጋሪው ዳዊት ራሱ መሆኑን ያጎላል።
- source_word: ἐν τῷ πνεύματι τῷ ἁγίῳ
  choice: በመንፈስ ቅዱስ ሆኖ
  rationale: የἐνን ‘በ/ውስጥ’ ሐሳብ ሳያጠብ በዘመናዊ አማርኛ ተፈጥሯዊ ያደርገዋል፤ የመንፈስ ቅዱስን ተሳትፎ ያረጋግጣል እንጂ ትክክለኛውን የተመስጦ አሠራር አይወስንም።
- source_word: κύριος / τῷ κυρίῳ μου
  choice: ጌታ / ለጌታዬ
  rationale: በግሪኩ ያለውን κύριος በሁለቱም ቦታ አንድ ወጥ በሆነ ‘ጌታ’ ይተረጉማል፤ የመዝሙር 110፥1 የዕብራይስጥ ዳራ በማስታወሻ ተገልጿል።
- source_word: Κάθου
  choice: ተቀመጥ
  rationale: ትእዛዛዊውን ቅርጽ በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐκ δεξιῶν μου
  choice: በቀኜ
  rationale: ‘በቀኝ እጄ/በቀኝ በኩል’ የሚለውን የግሪክ ፈሊጥ በተለመደና ክብር ባለው አማርኛ ይገልጣል።
- source_word: ἕως ἂν θῶ
  choice: እስካደርግ ድረስ
  rationale: ከትእዛዙ አንጻር የሚጠበቀውን የወደፊት ድርጊት በግልጽ አማርኛ ያስተላልፋል።
- source_word: ὑποκάτω τῶν ποδῶν σου
  choice: ከእግሮችህ በታች
  rationale: ማርቆስ የተጠቀመውን ‘ከእግሮችህ በታች’ የሚለውን ምስል በቅርበት ይጠብቃል፤ ‘የእግር መረገጫ’ የሚለውን ያልተጻፈ ቃል አያክልም።
theological_decisions:
- issue: ዳዊት በመንፈስ ቅዱስ ስለ መናገሩ የተጠቀሰው አገላለጽ
  choice: በመንፈስ ቅዱስ ሆኖ
  alternative: በመንፈስ ቅዱስ
  rationale: ዋናው ንባብ የግሪኩን ἐν በቅርበት ይጠብቃል፤ አማራጩ ደግሞ መንፈስ ቅዱስ የንግግሩ አስገኚ መሆኑን ሊያጎላ ይችላል። ጽሑፉ ራሱ ያልወሰነውን የተመስጦ ዘዴ አይወስንም።
- issue: በመዝሙር 110፥1 ጥቅስ ውስጥ የκύριος ድግግሞሽ
  choice: ጌታ ለጌታዬ
  alternative: እግዚአብሔር ለጌታዬ
  rationale: የግሪኩ ጽሑፍ በሁለቱም ቦታ κύριος ስለሚል ዋናው ጽሑፍ ድግግሞሹን ይጠብቃል። በዕብራይስጡ ምንጭ የመጀመሪያው ቃል መለኮታዊውን ስም እንደሚወክል በማስታወሻ ይገለጻል፤ ይህም ክርስቶሎጂያዊውን ውጥረት ሳይፈታ ያቆየዋል።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ ነው። የጥቅሱ ውስጣዊ ንግግር በጥቅስ ምልክቶች ተለይቷል፤ ‘በቀኜ’ እና ‘ከእግሮችህ በታች’ የሚሉት ቅዱስ ጽሑፋዊ ክብርን ከተፈጥሯዊ አማርኛ ጋር ያጣምራሉ።
