    text: ቃል በቃል፣ «ዘር አልተዉም»፤ ይህም ልጅ ወይም ተወላጅ አልቀረላቸውም ማለት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἑπτὰ
  choice: ሰባቱም
  rationale: ቁጥሩ ከመስተዋድዱ ጋር በስምነት የተጠቀሰ ሲሆን፣ በቀደመው አውድ የተጠቀሱትን ሰባት ወንድማማቾች ያመለክታል። «ሰባቱም» ይህን በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: οὐκ ἀφῆκαν σπέρμα
  choice: ልጅ አልተዉም
  rationale: ቃል በቃል «ዘር አልተዉም» የሚለው አገላለጽ ዘር ወይም ተወላጅ እንዳልቀረ ያመለክታል። «ልጅ አልተዉም» በዚህ የጋብቻ አውድ ትርጉሙን በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል፤ ቃል በቃል ያለው ምስል በማስታወሻው ተጠብቋል።
- source_word: ἔσχατον πάντων
  choice: ከሁሉም በኋላ
  rationale: ይህ አገላለጽ በቅደም ተከተሉ መጨረሻ ላይ የሆነውን ያመለክታል። «ከሁሉም በኋላ» የግሪኩን አጽንዖት በቀጥታ ይጠብቃል።
- source_word: καὶ ἡ γυνὴ
  choice: ሴቲቱም
  rationale: «-ም» ሴቲቱ በተከታታዩ ሞት ውስጥ መጨመሯን የሚያሳየውን καί በተፈጥሯዊ አማርኛ ያስተላልፋል፤ የተወሰነው ቅጽም ቀድሞ የታወቀችውን ሴት ያመለክታል።
- source_word: ἀπέθανεν
  choice: ሞተች
  rationale: ግሱ ሞትን በቀጥታ ይገልጣል፤ «ሞተች» የግሪኩን ግልጽነት ያለ ማለስለስ ይጠብቃል።
