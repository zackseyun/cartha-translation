  text: ἑπτὰ ἀδελφοὶ ἦσαν· καὶ ὁ πρῶτος ἔλαβεν γυναῖκα, καὶ ἀποθνῄσκων οὐκ ἀφῆκεν σπέρμα·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/020.yaml
  text: There were seven brothers; and the first took a wife[a], and when he died he left no offspring.
translation:
  language: am
  text: ሰባት ወንድማማቾች ነበሩ፤ የመጀመሪያውም ሚስት አገባ፣ ሲሞትም ዘር[a] አልተወም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ «ዘር»። በዚህ አውድ ልጅን ወይም ትውልድን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑπτὰ ἀδελφοὶ ἦσαν
  choice: ሰባት ወንድማማቾች ነበሩ
  rationale: የህልውና አገላለጹን በተፈጥሯዊ አማርኛ ያቀርባል፤ ዐውዱ በወንድ እህትማማቾች መካከል ስላለ ወንድማማቾች የሚለው ተጠብቋል።
- source_word: ὁ πρῶτος
  choice: የመጀመሪያው
  rationale: በሰባቱ መካከል ያለውን ቅደም ተከተል ያመለክታል፤ በዕድሜ ታላቅ መሆኑን አይጨምርም።
- source_word: ἔλαβεν γυναῖκα
  choice: ሚስት አገባ
  rationale: የግሪኩን የጋብቻ ፈሊጥ በዘመናዊና ተፈጥሯዊ አማርኛ በግልጽ ያስተላልፋል።
- source_word: ἀποθνῄσκων
  choice: ሲሞትም
  rationale: የአሳታፊ ግሱን ጊዜያዊ ግንኙነት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: οὐκ ἀφῆκεν σπέρμα
  choice: ዘር አልተወም
  rationale: ἀφίημι ከሞት በኋላ ትውልድን ትቶ መሄድን ያመለክታል፤ σπέρμα የሚለው ቃልም በአማርኛ «ዘር» ተብሎ የቃሉን ምስላዊና የትውልድ ትርጉም ሁለቱንም ሊይዝ ይችላል።
