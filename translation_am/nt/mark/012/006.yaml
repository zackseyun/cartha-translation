    text: ወይም፣ “አሁንም አንድ ሌላ፣ እጅግ የሚወደው ልጅ ነበረው።”
    reason: lexical_alternative
  - marker: b
    text: “ያከብሩታል” የተተረጎመው ግስ “በፊቱ ያፍራሉ” ወይም “ለእርሱ ክብር ያሳያሉ” የሚል ትርጉምም ሊኖረው ይችላል፤ እዚህ ዐውደ ንባቡ “ያከብሩታል” የሚለውን ይደግፋል።
    reason: lexical_alternative
