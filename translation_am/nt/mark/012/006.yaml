  text: አሁንም አንድ ብቻ ቀርቶት ነበር፣ የሚወደው ልጁ።[a] በመጨረሻ እርሱን ወደ እነርሱ ላከው፤ “ልጄን ያከብሩታል” አለ።[b]
  philosophy: optimal-equivalence
  footnotes:
