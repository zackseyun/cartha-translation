  text: καὶ λαβόντες ⸂ἀπέκτειναν αὐτόν, καὶ ἐξέβαλον αὐτὸν⸃ ἔξω τοῦ ἀμπελῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/008.yaml
  text: And they took him[a], killed him, and threw him out of the vineyard.
translation:
  language: am
  text: እርሱንም[a] ይዘው፣ ገደሉት፤ ከወይን እርሻው ውጭ ጣሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ አንባቢዎች በትይዩ በሚገኘው የምሳሌው ትውፊት ምክንያት «ከወይን እርሻው ውጭ ጣሉትና ገደሉት» የሚለውን ቅደም ተከተል ሊጠብቁ ይችላሉ፤ ነገር ግን እዚህ በማርቆስ ያለው የግሪክ ጽሑፍ «ገደሉት፤ ከወይን እርሻው ውጭ ጣሉት» ይላል።
    reason: cross_reference
lexical_decisions:
- source_word: λαβόντες
  choice: ይዘው
  rationale: የግሪኩ የአኦሪስት አሳታፊ ቅርጽ ከዋናዎቹ ግሶች በፊት የተፈጸመውን ድርጊት ያሳያል። «ይዘው» በአማርኛ ተፈጥሯዊ ሲሆን፣ በቃሉ ውስጥ በግድ የሌለውን የኃይል ስሜት አይጨምርም።
- source_word: ἀπέκτειναν
  choice: ገደሉት
  rationale: ἀποκτείνω በቀጥታ «መግደል» ማለት ነው፤ «ገደሉት» የታሪኩን ግልጽና ከባድ ድርጊት በዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἐξέβαλον
  choice: ውጭ ጣሉት
  rationale: ἐκβάλλω በዚህ አውድ ኃይለኛ ማስወጣትን ወይም ወደ ውጭ መጣልን ያመለክታል። «ውጭ ጣሉት» ይህን ኃይል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: ከወይኑ አትክልት ውጭ
  rationale: ἔξω ከዝርያ ቅጽ ጋር ከአንድ ቦታ ወደ ውጭ መንቀሳቀስን ያሳያል፤ «ከ…ውጭ» ይህን አቅጣጫ በግልጽ ያስተላልፋል።
- source_word: ἀμπελῶνος
  choice: የወይን አትክልት
  rationale: ἀμπελών ወይን የሚተከልበትን ስፍራ ያመለክታል፤ «የወይን አትክልት» ለዘመናዊ አንባቢ ግልጽና የተለመደ ነው።
theological_decisions:
- issue: በምሳሌው ውስጥ የመግደሉና ወደ ውጭ የመጣሉ ቅደም ተከተል
  choice: የግሪኩን ቅደም ተከተል በመከተል፣ መጀመሪያ ገደሉት፤ ከዚያም ከወይኑ አትክልት ውጭ ጣሉት።
  alternative: በትይዩ የምሳሌው ትውፊት መሠረት መጀመሪያ ወደ ውጭ ጣሉት፣ ከዚያም ገደሉት ተብሎ ሊጠበቅ ይችላል።
  rationale: የSBLGNT የማርቆስ 12፥8 ጽሑፍ ድርጊቶቹን ይዘው፣ ገደሉት፣ ውጭ ጣሉት በሚል ቅደም ተከተል ያቀርባል። ትርጉሙ ከትይዩ ታሪኮች ጋር ለማስማማት ሳይሞክር ይህንኑ ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለው አማርኛ ይጠቀማል። የፈጣኑን የትረካ ቅደም ተከተል ለመጠበቅ «ይዘው…ገደሉት…ጣሉት» የሚለው አጭር አወቃቀር ተመርጧል።
