- issue: በὅτι ἐγείρονται ያለው የትንሣኤ አገላለጽ
  choice: እነርሱ እንደሚነሡ
  alternative: እነርሱ እንደሚነሡ እንደሚደረጉ
  rationale: ጥቅሱ ስለ ሙታን ትንሣኤ ይናገራል። ተፈጥሯዊው የአማርኛ ግስ ትንሣኤውን በግልጽ ያሳያል፤ የግሪኩን ተገብሮአዊ ቅርጽ በከባድና ተፈጥሯዊ ባልሆነ አገላለጽ አይጫንም።
- issue: በመለኮታዊው ራስን መግለጫ ያለው የአሁን ጊዜና ድግግሞሽ
  choice: እኔ የአብርሃም አምላክ፣ የይስሐቅም አምላክ፣ የያዕቆብም አምላክ ነኝ
  alternative: እኔ የአብርሃም፣ የይስሐቅና የያዕቆብ አምላክ ነኝ
  rationale: የአሁን ጊዜውና ‘አምላክ’ የሚለው ቃል ድግግሞሽ ለኢየሱስ ክርክር ጠቃሚ ስለሆኑ ያለ ማጠቃለል ተጠብቀዋል።
