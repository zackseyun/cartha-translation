source:
  edition: SBLGNT
  text: περὶ δὲ τῶν νεκρῶν ὅτι ἐγείρονται οὐκ ἀνέγνωτε ἐν τῇ βίβλῳ Μωϋσέως ἐπὶ τοῦ βάτου ⸀πῶς εἶπεν αὐτῷ ὁ θεὸς λέγων· Ἐγὼ ὁ θεὸς Ἀβραὰμ καὶ ⸂ὁ θεὸς Ἰσαὰκ καὶ ὁ⸃ θεὸς Ἰακώβ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/026.yaml
  text: And concerning the dead[a], that they are raised, have you not read in the book of Moses, in the passage about the bush, how God spoke to him, saying, ‘I am the God of Abraham and the God of Isaac and the God of Jacob’?”
translation:
  language: am
  text: ስለ ሙታን እንደሚነሡም፣ በሙሴ መጽሐፍ ውስጥ ስለ ቁጥቋጦው በሚናገረው ክፍል[a] እግዚአብሔር እንዲህ ብሎ እንዴት እንደተናገረው አላነበባችሁምን? ‘እኔ የአብርሃም አምላክ፣ የይስሐቅም አምላክ፣ የያዕቆብም አምላክ ነኝ።’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በቁጥቋጦው”፤ የግሪኩ አገላለጽ የመጽሐፍ ክፍሉን በቁጥቋጦው ታሪክ ሊለየው ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τῶν νεκρῶν
  choice: ስለ ሙታንም
  rationale: περί ከባለቤት አገባብ ጋር የውይይቱን ርዕስ ያስገባል፤ δέ ደግሞ ከቀደመው ንግግር ጋር ቀላል ትስስር እንዲኖር ‘-ም’ ተብሎ ተወክሏል።
- source_word: ὅτι ἐγείρονται
  choice: እነርሱ እንደሚነሡ
  rationale: የአሁን ጊዜው ግስ በዚህ አውድ የሙታንን ትንሣኤ ያመለክታል። የአማርኛው ‘ይነሣሉ’ ቅርጽ ተፈጥሯዊ ሲሆን የግሪኩን ተገብሮአዊ/መካከለኛ ቅርጽ ከሚፈቅደው በላይ አይወስንም።
- source_word: οὐκ ἀνέγνωτε
  choice: አላነበባችሁምን?
  rationale: የኢየሱስን አፅንዖታዊ ጥያቄ በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐν τῇ βίβλῳ Μωϋσέως
  choice: በሙሴ መጽሐፍ ውስጥ
  rationale: βίβλος መጽሐፍን ወይም ጥቅል መጽሐፍን ሊያመለክት ቢችልም፣ ‘የሙሴ መጽሐፍ’ በአማርኛ ግልጽና የተለመደ ነው።
- source_word: ἐπὶ τοῦ βάτου
  choice: በቁጥቋጦው ክፍል[a]
  rationale: አገላለጹ በቁጥቋጦው ታሪክ የሚታወቀውን የመጽሐፍ ክፍል ሊጠቁም ይችላል፤ ‘ክፍል’ ይህን የጥቅስ ማመልከቻ ተግባር ለዘመናዊ አንባቢ ግልጽ ያደርጋል።
- source_word: πῶς εἶπεν αὐτῷ ὁ θεὸς λέγων
  choice: እግዚአብሔር እንዴት እንደተናገረው ... እንዲህ አለው
  rationale: πῶς የተነገረውን ይዘት ያስገባል፤ የግሪኩ λέγων ጥቅሱን ስለሚያስከትል ‘እንዲህ አለው’ ተብሎ በተፈጥሯዊ አማርኛ ተሰጥቷል።
- source_word: Ἐγὼ ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ
  choice: እኔ የአብርሃም አምላክ፣ የይስሐቅም አምላክ፣ የያዕቆብም አምላክ ነኝ
  rationale: ‘ነኝ’ የሚለው የአሁን ጊዜ መለያ በግልጽ ተጠብቋል፤ ‘አምላክ’ በየስሙ መደገሙም የግሪኩን አፅንዖት ያቆያል።
