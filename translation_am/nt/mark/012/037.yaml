  - marker: b
    text: እዚህ “ልጅ” የሚለው “የዳዊት ልጅ” የተባለውን መሲሐዊ ማዕረግ ያስተጋባል፤ “ዘር” ወይም “ተወላጅ” የሚል ሰፊ ትርጉምም ሊኖረው ይችላል።
