  rationale: ጥቅሱ መሲሑ የዳዊት ዘር ብቻ ከመሆን የሚበልጥ ማንነት እንዳለው ውጥረት ይፈጥራል፤ ትርጉሙ ግን ጽሑፉ ያልተናገረውን ሙሉ ዶክትሪናዊ ማብራሪያ አያስገባም።
