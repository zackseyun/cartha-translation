  rationale: πόθεν ቃል በቃል ‘ከወዴት’ ቢሆንም፣ እዚህ የምክንያትና የአመክንዮ ጥያቄ ስለሚያቀርብ ‘እንዴት’ ተፈጥሯዊ ነው። υἱός ‘ልጅ’ ተብሎ መቆየቱ ‘የዳዊት ልጅ’ የሚለውን መሲሐዊ ማዕረግ ያስተጋባል።
