    text: ወይም፣ «ግምጃ ቤት» ወይም «የመባ ሳጥን»፤ የግሪኩ ቃል የቤተ መቅደሱን ግምጃ ቤት ወይም ከእርሱ ጋር የተያያዙ የመባ መቀበያዎችን ሊያመለክት ይችላል።
