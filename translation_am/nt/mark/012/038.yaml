  text: እርሱም ሲያስተምር እንዲህ ይል ነበር፦ “ረጃጅም ልብሶችን[b] ለብሰው መዞርንና በገበያ ስፍራዎች ሰላምታን መቀበልን ከሚፈልጉ የሕግ ጻፎች ተጠንቀቁ[a]።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ተጠንቀቁ” ወይም “ራሳችሁን ከ… ጠብቁ” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
