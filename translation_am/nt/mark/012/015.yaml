  text: ὁ δὲ εἰδὼς αὐτῶν τὴν ὑπόκρισιν εἶπεν αὐτοῖς· Τί με πειράζετε; φέρετέ μοι δηνάριον ἵνα ἴδω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/015.yaml
  text: But knowing their hypocrisy[a], he said to them[b], “Why are you testing me? Bring me a denarius so that I may see it.”
translation:
  language: am
  text: እርሱ ግን ግብዝነታቸውን አውቆ፣ “ለምን ትፈትኑኛላችሁ?[a] እንዳየው አንድ ዲናር[b] አምጡልኝ” አላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለምን ትፈታተኑኛላችሁ?”
    reason: lexical_alternative
  - marker: b
    text: ዲናር በተለምዶ የአንድ ቀን ደመወዝ ያህል ዋጋ የነበረው የሮም የብር ሳንቲም ነበር።
    reason: cultural_note
lexical_decisions:
- source_word: εἰδὼς
  choice: አውቆ
  rationale: የግሪኩን የማወቅና የመገንዘብ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὑπόκρισιν
  choice: ግብዝነታቸውን
  rationale: ቅንነትን በማስመሰል የተደበቀውን ወጥመድ እና የቃሉን ሥነ ምግባራዊ ክብደት ይጠብቃል።
- source_word: Τί με πειράζετε
  choice: ለምን ትፈትኑኛላችሁ?
  rationale: Τί በዚህ አገባብ ‘ለምን’ የሚል ተግባር አለው፤ πειράζετε ደግሞ በጥላቻ የሚደረግን ፈተና ያመለክታል።
- source_word: φέρετέ μοι
  choice: አምጡልኝ
  rationale: ዕቃውን ወደ ተናጋሪው እንዲያመጡ የሚሰጠውን ትእዛዝ በተፈጥሯዊና አጭር አማርኛ ይገልጣል።
- source_word: δηνάριον
  choice: አንድ ዲናር
  rationale: የታሪካዊውን የሮም ሳንቲም ስም ይጠብቃል፤ ትርጉሙ በማስታወሻ ተብራርቷል።
- source_word: ἵνα ἴδω
  choice: አየው ዘንድ
  rationale: የዓላማውን ንዑስ ሐረግ ይጠብቃል፤ በግሪኩ ያልተገለጸው ነገር ግን የሚገባው ተሳቢ ‘እሱን’ በግስ ቅጥያው ተካትቷል።
theological_decisions:
- issue: πειράζετε የሚገልጠው የኢየሱስ ወቀሳ
  choice: ትፈትኑኛላችሁ
  alternative: ትፈታተኑኛላችሁ / ትፈትኑኛላችሁ ማለትም ትፈታተኑኛላችሁ
  rationale: አውዱ እርሱን ለማጥመድ የታሰበ ጠላትነት ያለበትን ፈተና ያሳያል። ‘መፈተን’ ይህን ያስተላልፋል፣ ነገር ግን ‘ወደ ኃጢአት ማባበል’ የሚለውን ጠባብ ትርጉም አያስገድድም።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ ነው። የምንጭ ጽሑፉ ቃላት ቅደም ተከተል ሳይጫን፣ የግሪኩ ተቃርኖና ዓላማ ተጠብቀዋል። በቀረበው የእንግሊዝኛ የማስታወሻ ምልክቶች እና ይዘቶች መካከል የተገላቢጦሽ ስህተት ስለነበር፣ [a] ከ‘መፈተን’ ጋር፣ [b] ደግሞ ከ‘ዲናር’ ጋር ተያይዟል።
