source:
  edition: SBLGNT
  text: Καὶ προσελθὼν εἷς τῶν γραμματέων ἀκούσας αὐτῶν συζητούντων, ⸀ἰδὼν ὅτι καλῶς ⸂ἀπεκρίθη αὐτοῖς⸃, ἐπηρώτησεν αὐτόν· Ποία ἐστὶν ⸂ἐντολὴ πρώτη πάντων⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/028.yaml
  text: And one of the scribes came up and heard them debating, and seeing that he had answered them well, he asked him, “Which commandment is the first of all?”
translation:
  language: am
  text: ከጸሐፍትም አንዱ ቀርቦ ሲከራከሩ ሰማቸው፤ እርሱም ኢየሱስ መልካም እንደመለሰላቸው አይቶ፣ “ከትእዛዛት ሁሉ የመጀመሪያው[a] የትኛው ነው?” ብሎ ጠየቀው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከሁሉ ዋነኛው” ወይም “ከሁሉ የሚበልጠው።”
    reason: lexical_alternative
lexical_decisions:
- source_word: γραμματέων
  choice: ጸሐፍት
  rationale: በወንጌል አውድ የአይሁድን ሕግ የሚያውቁና የሚተረጉሙ እውቅና ያላቸውን ባለሙያዎች የሚጠቁም የተለመደ ቅዱስ ቃላዊ አጠራር ነው።
- source_word: προσελθὼν
  choice: ቀርቦ
  rationale: ወደ ኢየሱስ መቅረቡን በተፈጥሯዊና አጭር አማርኛ ያሳያል።
- source_word: ἀκούσας αὐτῶν συζητούντων
  choice: ሲከራከሩ ሰማቸው
  rationale: በክርክር ጥያቄዎች ላይ የነበረውን ይፋዊ ምልልስ ያሳያል፤ ቃሉ ከተራ ውይይት የበለጠ ግጭት ቢኖረውም የግድ ጠላትነትን አያመለክትም።
- source_word: ἰδὼν ὅτι καλῶς ἀπεκρίθη αὐτοῖς
  choice: እርሱም መልካም እንደመለሰላቸው አይቶ
  rationale: የግሪኩን የማስተዋል አገባብና καλῶς የሚለውን ቀጥተኛ ግምገማ ይጠብቃል።
- source_word: ἐπηρώτησεν
  choice: ጠየቀው
  rationale: በአውዱ ውስጥ ግልጽና ተፈጥሯዊ የሆነ አተረጓጎም ነው።
- source_word: ἐντολή
  choice: ትእዛዝ
  rationale: የሙሴን ሕግ ትእዛዛት በሚመለከተው የመጽሐፍ ቅዱስ አውድ ትክክለኛና የተለመደ ቃል ነው።
- source_word: πρώτη πάντων
  choice: ከትእዛዛት ሁሉ የመጀመሪያው
  rationale: πρώτη የሚለውን ቀጥተኛ ‘የመጀመሪያ’ ትርጉም በዋናው ጽሑፍ ይጠብቃል፤ የደረጃና የአስፈላጊነት ትርጉሙ በማስታወሻ ቀርቧል።
theological_decisions:
- issue: በትእዛዛቱ መካከል πρώτη የሚለው የሚያመለክተው
  choice: ከትእዛዛት ሁሉ የመጀመሪያው
  alternative: ከሁሉ ዋነኛው፤ ከሁሉ የሚበልጠው
  rationale: የግሪኩ ቃል በቅደም ተከተል ‘መጀመሪያ’ ወይም በደረጃ ‘ዋነኛ’ ሊሆን ይችላል። ዋናው ጽሑፍ ቀጥተኛውን አነጋገር በመጠበቅ ይህን ልዩነት አይዘጋም፤ ሌሎቹን አማራጮች ማስታወሻው ያቀርባል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና በቀላሉ የሚገባ መደበኛ አማርኛ ተጠቅሟል። ‘ጸሐፍት’ ታሪካዊውን የቡድን መጠሪያ ይጠብቃል፤ የንግግሩ ፍሰት ግን በዘመናዊ አማርኛ ተዋቅሯል።
