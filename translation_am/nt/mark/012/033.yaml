  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ τὸ ἀγαπᾶν αὐτὸν ἐξ ὅλης ⸀τῆς καρδίας καὶ ἐξ ὅλης τῆς ⸀συνέσεως καὶ ἐξ ὅλης τῆς ἰσχύος καὶ τὸ ἀγαπᾶν τὸν πλησίον ὡς ἑαυτὸν ⸀περισσότερόν ἐστιν πάντων τῶν ὁλοκαυτωμάτων καὶ θυσιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/033.yaml
  text: and to love him with all the heart and with all the understanding and with all the strength[a], and to love one’s neighbor as oneself, is more than all burnt offerings and sacrifices.
translation:
  language: am
  text: እርሱንም በሙሉ ልብ፣ በሙሉ ማስተዋልና በሙሉ ኃይል መውደድ፣ ባልንጀራንም እንደ ራስ መውደድ፣ ከሁሉም ሙሉ በሙሉ ከሚቃጠሉ መባዎች[a]ና መሥዋዕቶች ይበልጣል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ሙሉ በሙሉ የሚቃጠል መባ” የተባለው የግሪክ ቃል፣ በመሠዊያው ላይ ሙሉው በእሳት የሚቃጠል መባን በተለይ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾶν
  choice: መውደድ
  rationale: የግስ ኃይሉንና በሁለቱ የፍቅር ትእዛዛት መካከል ያለውን ትይዩነት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: αὐτόν
  choice: እርሱን
  rationale: ተውላጠ ስሙን እንዳለ ይጠብቃል፤ ከአውዱ የሚመለከተው እግዚአብሔርን መሆኑ ግልጽ ነው።
- source_word: ἐξ ὅλης τῆς καρδίας
  choice: በፍጹም ልብ
  rationale: የልብን ሙሉ ቁርጠኝነት በተለመደና ክቡር አገላለጽ ያስተላልፋል።
- source_word: συνέσεως
  choice: ማስተዋል
  rationale: ቃሉ የሚያመለክተውን መረዳትና ልቦናዊ ግንዛቤ ከአእምሮ ብቻ የሰፋ ትርጉም ይዞ ያቀርባል።
- source_word: ἰσχύος
  choice: ኃይል
  rationale: የሰውን ሙሉ ብርታትና አቅም የሚገልጽ ግልጽ አማርኛ ነው።
- source_word: πλησίον
  choice: ባልንጀራ
  rationale: ነጠላውን ጠቅላላ ሥነ ምግባራዊ አገልግሎት በተለመደው የመጽሐፍ ቅዱስ አማርኛ ያስተላልፋል።
- source_word: ὡς ἑαυτόν
  choice: እንደ ራስ
  rationale: ቀጥተኛ ሁለተኛ መደብ ሳያስገባ የግሪኩን ጠቅላላ አንጸባራቂ አገላለጽ ይጠብቃል።
- source_word: περισσότερόν ἐστιν
  choice: ይበልጣል
  rationale: ግልጽ የብልጫ ንጽጽሩን ያለ ተጨማሪ ትርጓሜ ያስተላልፋል።
- source_word: πάντων τῶν ὁλοκαυτωμάτων καὶ θυσιῶν
  choice: ሙሉ በሙሉ ከሚቃጠሉ መባዎችና ከመሥዋዕቶች ሁሉ
  rationale: ὁλοκαυτώματα በመሠዊያው ላይ ሙሉ በሙሉ የሚቃጠል መባ መሆኑን ይለያል፤ πάντων የሁለቱንም ወገኖች አጠቃላይነት እንዲያካትት ‘ሁሉ’ በመጨረሻ ተቀምጧል።
theological_decisions:
- issue: የፍቅር ትእዛዛት ከመሥዋዕታዊ አምልኮ ጋር ያላቸው ግንኙነት
  choice: እግዚአብሔርን በሙሉ ማንነት መውደድና ባልንጀራን እንደ ራስ መውደድ ከመባዎችና ከመሥዋዕቶች ሁሉ እንደሚበልጥ ተተርጉሟል።
  alternative: ጥቅሱ የመሥዋዕትን ሥርዓት ሙሉ በሙሉ ይሽራል ብሎ መግለጽ፣ ወይም ፍቅርንና መሥዋዕትን እኩል ማድረግ።
  rationale: περισσότερόν ἐστιν ግልጽ ብልጫን ይገልጻል፤ ነገር ግን ጥቅሱ ራሱ የመሥዋዕትን ሥርዓት በግልጽ እንደተሻረ አይናገርም። ስለዚህ ያለው ሥነ መለኮታዊ ውጥረት ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ትይዩ አወቃቀር በሁለቱ ‘መውደድ’ ሐረጎች ተጠብቋል፤ የግርጌ ማስታወሻው ምልክትም ከሚያብራራው ‘ሙሉ በሙሉ ከሚቃጠሉ መባዎች’ ቀጥሎ ተቀምጧል።
