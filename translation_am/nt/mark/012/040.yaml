    text: ወይም፣ “የበለጠ የጥፋተኝነት ፍርድ።”
    reason: lexical_alternative
  revision_rationale: The essential correction replaces the mistranslation of κατεσθίοντες with የሚበሉ, a deliberately vivid metaphor matching “devour.” Minor wording changes improve modern standard Amharic while preserving the participial accusations, the pretense behind the prayers, and the open lexical range of κρίμα.
