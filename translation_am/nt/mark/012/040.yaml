  text: የመበለቶችን ቤቶች የሚበሉና ለይስሙላ[a] ረጅም ጸሎት የሚያደርጉ እነዚህ የበለጠ ፍርድ[b] ይቀበላሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለታይታ” ወይም “በማስመሰል።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “የበለጠ የጥፋተኝነት ፍርድ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεσθίοντες
  choice: የሚውጡ
  rationale: የግሪኩን ‘መዋጥ/በልቶ መጨረስ’ ሕያው ምስል ጠብቆ፣ የመበለቶችን ንብረት በጭካኔ መበዝበዝን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τὰς οἰκίας τῶν χηρῶν
  choice: የመበለቶችን ቤቶች
  rationale: ‘ቤቶች’ የሚለውን ቀጥተኛ ምስል ይጠብቃል፤ በዐውዱ ቤተሰብን ወይም ንብረትን ሊያካትት ቢችልም ትርጉሙን ከልክ በላይ አይወስንም።
- source_word: προφάσει
  choice: ለይምሰል
  rationale: የውሸት መልክን፣ ማስመሰልን ወይም ለታይታ መሆንን በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: μακρὰ προσευχόμενοι
  choice: ረጅም ጸሎት የሚጸልዩ
  rationale: μακρά የጸሎቱን ረዥም ቆይታ እንደሚገልጽ ያሳያል፤ የተለመደና ግልጽ የአማርኛ አገላለጽ ነው።
- source_word: λήμψονται
  choice: ይቀበላሉ
  rationale: የወደፊቱን የመቀበል ድርጊት በክብር ባለውና በፍርድ ዐውድ ተስማሚ በሆነ ቃል ያቀርባል።
- source_word: περισσότερον κρίμα
  choice: የበለጠ ፍርድ
  rationale: የንጽጽሩን ኃይል ይጠብቃል፤ κρίμα ፍርድንም የጥፋተኝነት ውሳኔንም ሊያመለክት ስለሚችል ‘ፍርድ’ የሚለው ዋና ትርጉም ሆኖ አሻሚነቱን ይጠብቃል።
theological_decisions:
- issue: በሃይማኖታዊ ግብዝነት ላይ በተሰጠው ማስጠንቀቂያ κρίμα ያለው ኃይል
  choice: ፍርድ
  alternative: የጥፋተኝነት ፍርድ
  rationale: ዐውዱ ቅጣት ያለበትን መለኮታዊ ፍርድ ቢያመለክትም፣ ሰፊው ‘ፍርድ’ የሚለው ቃል የግሪኩን የቃላት ወሰንና በጽሑፉ ያለውን ክፍትነት ይጠብቃል፤ ቅጣታዊው አማራጭ በማስታወሻ ቀርቧል።
