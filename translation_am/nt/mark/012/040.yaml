review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the plural victims, the future consequence, and the comparative force of περισσότερον. However, የሚውጡ means “who go out,” not “who devour/consume,” and therefore fails to render κατεσθίοντες. The revision restores the Greek’s vivid metaphor without reducing it to an interpretive term such as “exploit.”
  naturalness: ለይምሰል is understandable but less natural in contemporary standard Amharic than ለይስሙላ. Also, ረጅም ጸሎት የሚጸልዩ is redundant; ረጅም ጸሎት የሚያደርጉ is idiomatic and retains the sense of prolonged prayer.
  terminology: ቤቶች faithfully retains οἰκίας without specifying estates or property. ፍርድ appropriately preserves the lexical breadth of κρίμα; its punitive context is not denied, but the wording does not force “condemnation.”
  issues:
  - severity: high
    issue: የሚውጡ is used for κατεσθίοντες.
    rationale: ውጡ means “go out,” whereas κατεσθίοντες means “devour/consume.” This changes the accusation and must be corrected.
  - severity: medium
    issue: The expression for prolonged prayer is redundant and awkward.
    rationale: ረጅም ጸሎት የሚጸልዩ literally repeats the prayer concept. ረጅም ጸሎት የሚያደርጉ is standard, clear Amharic.
  - severity: low
    issue: ለይምሰል is less current than ለይስሙላ.
    rationale: ለይስሙላ naturally conveys prayer performed as a pretense or for display, while retaining the source’s motive of outward appearance.
  revised_text: የመበለቶችን ቤቶች የሚበሉና ለይስሙላ[a] ረጅም ጸሎት የሚያደርጉ እነዚህ የበለጠ ፍርድ[b] ይቀበላሉ።
  revised_footnotes:
