base_translation:
  language: en
  yaml_path: translation/nt/mark/012/043.yaml
  text: And calling his disciples to himself[a], he said to them, “Truly I say to you that this poor widow has put in more than all those who are putting into the treasury.”
translation:
  language: am
  text: ደቀ መዛሙርቱንም ወደ እርሱ ጠርቶ፣ “እውነት እላችኋለሁ፤ ይህች ድሃ መበለት ወደ የመባ ማስቀመጫው[a] ከሚያስገቡት ሁሉ ይልቅ ብዙ አስገብታለች” አላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “የመባ ሳጥን” ወይም “የግምጃ ማስቀመጫ።” የግሪክኛው ቃል በቤተ መቅደሱ ያለውን የመባ ማስቀመጫ ወይም የግምጃ ክፍል ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: ወደ እርሱ ጠርቶ
  rationale: የግሱን መካከለኛ ድምፅ እና ኢየሱስ ደቀ መዛሙርቱን ወደ ራሱ መጥራቱን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: μαθητὰς
  choice: ደቀ መዛሙርቱን
  rationale: በአማርኛ የአዲስ ኪዳን አጠቃቀም የተለመደውንና የተከታይነትን ግንኙነት የሚያሳየውን ቃል ይጠቀማል።
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: እውነት እላችኋለሁ
  rationale: የቃሉን ክብደትና የተረጋገጠ አነጋገር በግልጽ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: χήρα
  choice: መበለት
  rationale: የግሪክኛው ቃል ቀጥተኛና መደበኛ አቻ ነው።
- source_word: πτωχὴ
  choice: ድሀ
  rationale: ድህነቷን በቀላልና በተፈጥሯዊ ቋንቋ ይገልጣል፤ ከጽሑፉ በላይ የከፋ እጦትን አይጨምርም።
- source_word: πλεῖον πάντων
  choice: ከሁሉ ይልቅ ብዙ
  rationale: ንጽጽሩን በቅርብ ይጠብቃል፤ ብዛቱ በገንዘብ መጠን ብቻ እንደሆነ በትርጉሙ ውስጥ አይወስንም።
- source_word: ἔβαλεν
  choice: አስገብታለች
  rationale: መባን ወደ ማስቀመጫ ማስገባትን በተፈጥሯዊ አማርኛ ያሳያል፤ የተፈጸመው ድርጊት አሁን ለሚሰጠው ግምገማ መሠረት መሆኑንም ይጠብቃል።
- source_word: τῶν βαλλόντων
  choice: ከሚያስገቡት
  rationale: የአሁን ጊዜ ክፍለ ግሱ ሌሎች ሰዎች በዚያን ጊዜ መባ እያስገቡ መሆናቸውን ያሳያል።
- source_word: γαζοφυλάκιον
  choice: ግምጃ ቤት
  rationale: የቤተ መቅደሱን የመባ ማስቀመጫ ወይም የግምጃ ክፍል የሚያመለክተው የተለመደ አጭር አቻ ነው፤ የቁሳዊ ማስቀመጫው ትርጉም በማስታወሻ ቀርቧል።
theological_decisions:
- issue: የመበለቲቱ ስጦታ ግምገማ
  choice: ኢየሱስ መበለቲቱ ከሌሎቹ ሁሉ ይልቅ ብዙ እንዳስገባች በቀጥታ ይናገራል፤ የንጽጽሩ መለኪያ በትርጉሙ ውስጥ አልተጨመረም።
  alternative: ከሁሉ የሚበልጥ የገንዘብ መጠን እንደሰጠች ብቻ የሚያስረዳ ትርጉም።
  rationale: ቁጥር 44 እርሷ ከድህነቷ፣ ሌሎቹ ግን ከትርፋቸው እንደሰጡ ያብራራል። “ከሁሉ ይልቅ ብዙ” የሚለው አቀራረብ ይህን አውድ ክፍት አድርጎ ሳለ ትርጓሜን ወደ ዋናው ጽሑፍ አያስገባም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። የግሪክኛው ተከታታይ አወቃቀር በ“ጠርቶ” ተጠብቋል፤ የግምጃ ቤቱ ትክክለኛ ቅርጽ ግን በጽሑፉ ውስጥ ሳይገደብ በማስታወሻ ተገልጿል።
