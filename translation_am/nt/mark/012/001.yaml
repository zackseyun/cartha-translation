  text: Καὶ ἤρξατο αὐτοῖς ἐν παραβολαῖς ⸀λαλεῖν· Ἀμπελῶνα ⸂ἄνθρωπος ἐφύτευσεν⸃, καὶ περιέθηκεν φραγμὸν καὶ ὤρυξεν ὑπολήνιον καὶ ᾠκοδόμησεν πύργον, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/001.yaml
  text: 'And he began to speak to them in parables: “A man planted a vineyard[a], and put a fence around it, and dug a winepress pit, and built a tower, and leased it to tenant farmers[d][c][b], and went away.”'
translation:
  language: am
  text: እርሱም ለእነርሱ በምሳሌዎች መናገር ጀመረ፦ “አንድ ሰው የወይን እርሻ ተከለ፤ በዙሪያውም አጥር አደረገ[a]፣ የወይን መጭመቂያ ጉድጓድ ቆፈረ[b]፣ ማማም ሠራ። ከዚያም ለተከራይ ገበሬዎች በኪራይ ሰጠው[c]፣ ሄደም።”[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በዙሪያው አጥር አቆመ” ወይም “በቁጥቋጦ ከለለው።” የግሪኩ φραγμός አጥርን፣ የቁጥቋጦ ክልልን፣ ወይም ሌላ መከለያን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ለወይን መጭመቂያው ጉድጓድ ቆፈረ።” የግሪኩ ὑπολήνιον በተለይ ከወይን መጭመቂያው በታች ያለውን ፈሳሽ መቀበያ ገንዳ ወይም ጉድጓድ ያመለክታል።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “ለገበሬዎች አከራየው” ወይም “ለወይን አብቃዮች በኪራይ ሰጠው።”
    reason: lexical_alternative
  - marker: d
    text: የወይን እርሻ መትከል፣ መከለልና ለሥራ ማዘጋጀት የሚለው ምስል ኢሳይያስ 5፥1–2ን ያስታውሳል።
    reason: cross_reference
lexical_decisions:
- source_word: ἤρξατο … λαλεῖν
  choice: ይናገራቸው ጀመር
  rationale: የድርጊቱን መጀመር በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል፤ λαλεῖν የመናገርን ሐሳብ ይጠብቃል።
- source_word: ἐν παραβολαῖς
  choice: በምሳሌዎች
  rationale: የግሪኩን ብዙ ቁጥርና ኢየሱስ የተጠቀመበትን የንግግር ዘዴ በቀጥታ ያስተላልፋል።
- source_word: Ἀμπελῶνα
  choice: የወይን እርሻ
  rationale: ወይን የሚተከልበትን ቦታ በግልጽና በተለመደ አማርኛ ይገልጣል።
- source_word: ἄνθρωπος
  choice: አንድ ሰው
  rationale: በምሳሌው መክፈቻ ያልተወሰነውን የመሬት ባለቤት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: περιέθηκεν φραγμόν
  choice: ዙሪያውንም አጠረው
  rationale: የወይን እርሻው በመከለያ መከበቡን ይገልጣል፤ መከለያው አጥር ወይም ቁጥቋጦ መሆኑን ሳይወስን የግሪኩን ስፋት ይጠብቃል።
- source_word: ὤρυξεν ὑπολήνιον
  choice: የወይን መጭመቂያ ጉድጓድ ቆፈረ
  rationale: ὑπολήνιον ከወይን መጭመቂያው በታች ያለውን ፈሳሽ መቀበያ ጉድጓድ እንደሚያመለክት ያሳያል።
- source_word: ᾠκοδόμησεν πύργον
  choice: ማማም ሠራ
  rationale: በወይን እርሻ ውስጥ የሚሠራውን የጥበቃ ማማ በቀጥታ ይገልጣል።
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: ለተከራይ ገበሬዎች ሰጥቶ
  rationale: እርሻው የባለቤቱ እንደሆነ ሲቆይ ገበሬዎቹ ተከራዮች መሆናቸውን ያብራራል፤ የኪራዩን ዝርዝር አይጨምርም።
- source_word: ἀπεδήμησεν
  choice: ወደ ሌላ አገር ሄደ
  rationale: ሰውየው ከአካባቢው ለጊዜው ተለይቶ መሄዱን በግልጽ አማርኛ ይገልጣል።
theological_decisions:
- issue: የἄνθρωπος አተረጓጎም
  choice: አንድ ሰው
  alternative: አንድ ወንድ፤ አንድ ባለቤት
  rationale: ግሪኩ በዚህ ቦታ የታሪኩን ገጸ ባሕርይ በአጠቃላይ ያስተዋውቃል። “አንድ ሰው” ፆታን አላስፈላጊ ሁኔታ ሳያጎላ የምንጩን ሐሳብ ይጠብቃል።
- issue: የγεωργοῖς ማኅበራዊና ኢኮኖሚያዊ ግንኙነት
  choice: ተከራይ ገበሬዎች
  alternative: ገበሬዎች፤ ወይን አብቃዮች
  rationale: ἐξέδετο እርሻው ለሌሎች በኪራይ መሰጠቱን ስለሚያመለክት፣ “ተከራይ” የባለቤቱንና የገበሬዎቹን ልዩነት ያሳያል፤ ይህም ለምሳሌው ቀጣይ ክፍል አስፈላጊ ነው።
- issue: ከኢሳይያስ 5፥1–2 ጋር ያለው አስተጋብኦ
  choice: በእግር ማስታወሻ መጠቆም
  alternative: በዋናው ጽሑፍ ውስጥ መግለጽ
  rationale: የወይን እርሻው፣ የአጥሩና የማማው ምስል ኢሳይያስን ያስታውሳል፤ ሆኖም ማርቆስ በግልጽ ስላልጠቀሰው ትስስሩ በማስታወሻ ብቻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ የትረካ ቋንቋ ተጠቅሟል። አጭር ተከታታይ ግሶች የግሪኩን የዝግጅት ድርጊቶች ቅደም ተከተል ይጠብቃሉ፤ ቴክኒካዊው “ὑπολήνιον” ግን ለግልጽነት “የወይን መጭመቂያ ጉድጓድ” ተብሎ ቀርቧል።
