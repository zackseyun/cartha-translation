source:
  edition: SBLGNT
  text: Διδάσκαλε, Μωϋσῆς ἔγραψεν ἡμῖν ὅτι ἐάν τινος ἀδελφὸς ἀποθάνῃ καὶ καταλίπῃ γυναῖκα καὶ ⸂μὴ ἀφῇ τέκνον⸃, ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν ⸀γυναῖκα καὶ ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/019.yaml
  text: Teacher[a], Moses wrote for us that if someone's brother dies and leaves behind a wife and leaves no child[c][b], his brother should take the wife and raise up offspring for his brother.
translation:
  language: am
  text: “መምህር ሆይ፣ ሙሴ፣ ‘የአንድ ሰው ወንድም ሚስት ትቶ ልጅ ሳይተው[a][c] ቢሞት፣ ወንድሙ ሚስቱን ወስዶ ለወንድሙ ዘር እንዲያስነሣ[b]’ ብሎ ጻፈልን።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ልጅ” የሚለው በግሪክ ነጠላ ቁጥር ነው፤ እዚህ ግን አጠቃላይ ፍቺ አለው። አንዳንድ ትርጉሞች “ልጆች ባይኖሩት” ይላሉ።
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “ለወንድሙ ዘር ያስነሣ”፤ ይህ ለሞተው ወንድም የዘር ተከታይ ማስገኘትን የሚያመለክት ፈሊጣዊ አነጋገር ነው።
    reason: lexical_alternative
  - marker: c
    text: እዚህ የተጠቀሰውን የሙሴ ሕግ ለማየት ዘዳግም 25፥5ን ይመልከቱ።
    reason: cross_reference
lexical_decisions:
- source_word: Διδάσκαλε
  choice: መምህር ሆይ
  rationale: የግሪኩን የቀጥታ ጥሪ ቅርጽ የሚጠብቅ፣ በዘመናዊ አማርኛም ግልጽና ክብር ያለው አገላለጽ ነው።
- source_word: Μωϋσῆς ἔγραψεν ἡμῖν
  choice: ሙሴ … ብሎ ጻፈልን
  rationale: ἡμῖν የተጠቃሚነትን ወይም የማጣቀሻን ሐሳብ ስለሚይዝ፣ ‘ጻፈልን’ ሕጉ ለእስራኤል መጻፉን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐάν τινος ἀδελφὸς ἀποθάνῃ
  choice: የአንድ ሰው ወንድም … ቢሞት
  rationale: τινος ያልተወሰነውን ‘የአንድ ሰው’ በማለት ይገልጣል፤ ἀδελφός የሚለውም በሕጉ የተጠቀሰውን ወንድ ዘመድ ግልጽ አድርጎ ይጠብቃል።
- source_word: καταλίπῃ γυναῖκα
  choice: ሚስት ትቶ
  rationale: καταλείπω በሞት ጊዜ ከኋላ መተውን ያመለክታል፤ ‘ሚስት ትቶ’ ይህን በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: μὴ ἀφῇ τέκνον
  choice: ልጅ ባይተው
  rationale: τέκνον ነጠላ ቁጥር ስለሆነ ‘ልጅ’ ተብሎ ተተርጉሟል፤ ነጠላው በዚህ አውድ አጠቃላይ ፍቺ አለው።
- source_word: ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα
  choice: ወንድሙ ሚስቲቱን ወስዶ
  rationale: በዚህ የሕግና የጋብቻ አውድ λάβῃ ሴቲቱን በጋብቻ መውሰድን ያመለክታል። ‘ወስዶ’ የምንጩን አገላለጽ ይጠብቃል፤ ‘መበለቲቱን አግብቶ’ የሚለው ይበልጥ ትርጓሜያዊ ነው።
- source_word: ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ
  choice: ለወንድሙ ዘር እንዲያስነሣለት
  rationale: ‘ዘር ማስነሣት’ የወንድምን ሚስት የማግባት ግዴታና ለሞተው ወንድም የዘር ተከታይ ማስገኘትን የሚያመለክት የሕግ ፈሊጣዊ አነጋገር ነው።
theological_decisions:
- issue: የወንድምን ሚስት ስለማግባት የሙሴ ሕግ ፈሊጣዊ አነጋገር
  choice: ‘ሚስቲቱን ወስዶ ለወንድሙ ዘር እንዲያስነሣለት’ ተብሎ የምንጩ ሕጋዊና ቤተሰባዊ አገላለጽ ተጠብቋል።
  alternative: ‘መበለቲቱን አግብቶ ለሞተው ወንድሙ ልጆችን እንዲወልድለት’
  rationale: አማራጩ ፍቺውን ግልጽ ቢያደርግም፣ ‘ሞተው’ እና ‘ልጆችን መውለድ’ የሚሉትን ትርጓሜያዊ ማብራሪያዎች ወደ ዋናው ጽሑፍ ያስገባል። የተመረጠው አገላለጽ የግሪኩን ፈሊጥና ሕጋዊ ውጥረት ይጠብቃል።
- issue: በዘመድነትና በጋብቻ ቃላት የፆታ መግለጫ
  choice: ‘ወንድም’ እና ‘ሚስት’ የሚሉት ፆታን የሚገልጹ ቃላት ተጠብቀዋል።
  alternative: ፆታን የማይገልጹ እንደ ‘ወንድም ወይም እኅት’ እና ‘የትዳር ጓደኛ’ ያሉ አገላለጾችን መጠቀም
  rationale: የግሪኩ ጽሑፍ በተለይ ስለ ወንድምና ስለ ሚስት የሚናገር የወንድና የሴት ጋብቻ ሕግ ነው፤ ስለዚህ ምንጩ የገለጸው ፆታ አልተደበቀም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። ‘መምህር ሆይ’ የጥሪውን ክብር ይጠብቃል፤ ‘ሚስቲቱን ወስዶ’ እና ‘ዘር እንዲያስነሣለት’ ደግሞ ትርጉሙ በማስታወሻ እየተብራራ የምንጩን ሕጋዊ ፈሊጥ በዋናው ጽሑፍ ይጠብቃሉ።
