source:
  edition: SBLGNT
  text: ἐν τῇ ἀναστάσει ⸂ὅταν ἀναστῶσιν⸃ τίνος αὐτῶν ἔσται γυνή; οἱ γὰρ ἑπτὰ ἔσχον αὐτὴν γυναῖκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/023.yaml
  text: In the resurrection[a], when they rise, whose wife will she be? For the seven had her as wife.
translation:
  language: am
  text: በትንሣኤ[a] ጊዜ፣ ሲነሡ፣ ከእነርሱ የማን ሚስት ትሆናለች? ሰባቱ ሚስት አድርገው ነበሯት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እንደገና ሲነሡ»። ግሪኩ በቀጥታ «ሲነሡ» ይላል፤ የትንሣኤው ዐውድ ትርጉሙን ያስረዳል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάστασις
  choice: ትንሣኤ
  rationale: በሰዱቃውያን ጋር በተነሣው ክርክር ውስጥ ቃሉ የወደፊቱን ከሞት መነሣት ያመለክታል፤ «ትንሣኤ» በአማርኛ የተለመደና ግልጽ አቻ ነው።
- source_word: ὅταν ἀναστῶσιν
  choice: እነርሱ በሚነሡበት ጊዜ
  rationale: ὅταν ከአዎሪስት ሰብጃንክቲቭ ጋር የወደፊት ጊዜን የሚያመለክት ጊዜያዊ ንዑስ ሐረግ ነው። «እንደገና» የሚለው በግሪኩ በግልጽ ስለሌለ በዋናው ጽሑፍ አልተጨመረም።
- source_word: τίνος αὐτῶν
  choice: ከእነርሱ የማን
  rationale: የጥያቄውን ባለቤትነትና ከሰባቱ መካከል አንዱን የመለየት ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἔσται γυνή
  choice: ሚስት ትሆናለች
  rationale: የግሪኩን የትንቢት ጊዜና የጋብቻ ግንኙነት በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: γυνή
  choice: ሚስት
  rationale: በሁለቱም አጠቃቀሞች ዐውዱ የጋብቻ ስለሆነ «ሴት» ከሚለው ሰፊ ትርጉም ይልቅ «ሚስት» ትክክለኛ ነው።
- source_word: οἱ γὰρ ἑπτὰ
  choice: ሰባቱም
  rationale: γάρ ለቀደመው ጥያቄ ማብራሪያዊ ምክንያት ይሰጣል። በአማርኛ «-ም» ግንኙነቱን በተፈጥሮ ያሳያል፤ ቀዳሚው ዐውድ ሰባቱ ወንድማማቾች መሆናቸውን ያስረዳል።
- source_word: ἔσχον αὐτὴν γυναῖκα
  choice: ሚስት አድርገው ነበራት
  rationale: ἔχω + ተሳቢ + γυναῖκα የጋብቻ ሁኔታን ይገልጻል። ይህ አተረጓጎም «አገቧት» ከሚለው የድርጊት አገላለጽ ይልቅ የግሪኩን ግንኙነታዊ አጽንዖት ይጠብቃል።
theological_decisions:
- issue: ከሰዱቃውያን ጋር ባለው ክርክር የትንሣኤ ቋንቋ
  choice: በትንሣኤ ... እነርሱ በሚነሡበት ጊዜ
  alternative: ከሞት በሚነሡበት ጊዜ ... እንደገና ሲነሡ
  rationale: ጥቅሱ የወደፊቱን ትንሣኤ ያስቀምጣል፤ ሆኖም «ከሞት» ወይም «እንደገና» የሚሉትን በግሪኩ ያልተገለጹ ቃላት በዋናው ጽሑፍ አንጨምርም። ዐውዱ ትርጉሙን ያቀርባል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ትንሣኤ» የተለመደውን መጽሐፍ ቅዱሳዊ ቃል ይጠብቃል፤ የሐረጉ አወቃቀር ግን የዘመኑን ተፈጥሯዊ አጠቃቀም ይከተላል።
