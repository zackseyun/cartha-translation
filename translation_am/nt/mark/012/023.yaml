review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the resurrection setting, the future-oriented temporal clause, the partitive question, and the marital sense of γυνή. However, «ሰባቱም» can add an explicit “all” emphasis not present in οἱ ἑπτά, and «ነበራት» is not the standard plural form for “they had her.”
  naturalness: «እነርሱ በሚነሡበት ጊዜ» is understandable but needlessly heavy. «ሲነሡ» is natural modern Amharic and preserves the temporal force. The revised final clause uses standard plural agreement.
  terminology: «ትንሣኤ» and «ሚስት» are appropriate established terms. The footnote appropriately presents “again” as an alternative without putting it into the main text.
  issues:
  - severity: medium
    issue: Plural agreement in the final clause
    rationale: «ሰባቱ ... ነበራት» does not use the normal plural form for “the seven had her.” «ነበሯት» correctly expresses a plural subject with the feminine object.
  - severity: low
    issue: Possible added emphasis in «ሰባቱም»
    rationale: The suffix -ም can be read as “all seven,” whereas οἱ ἑπτά simply says “the seven.” «ሰባቱ» stays closer to the source while the prior context identifies them.
  - severity: low
    issue: Cumbersome temporal clause
    rationale: The explicit pronoun in «እነርሱ በሚነሡበት ጊዜ» is unnecessary. «ሲነሡ» is idiomatic and retains the plural, future-contextual sense supplied by ὅταν with the aorist subjunctive.
  revised_text: በትንሣኤ[a] ጊዜ፣ ሲነሡ፣ ከእነርሱ የማን ሚስት ትሆናለች? ሰባቱ ሚስት አድርገው ነበሯት።
