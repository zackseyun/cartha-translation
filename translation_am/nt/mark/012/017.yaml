  alternative: ይህን እንደ ጠንካራ የሲቪል ሥልጣን ድጋፍ ወይም እንደ ቄሳር ጥያቄ ስውር ማሳነስ መተርጎም
  rationale: ጥቅሱ ለቄሳርና ለእግዚአብሔር የሚገባ ነገር እንዳለ ይናገራል፣ ነገር ግን ሙሉ የፖለቲካ ሥነ መለኮት አይዘረዝርም። ትርጉሙ ይህን ውጥረትና ትይዩነት ሳይፈታ ይጠብቃል።
