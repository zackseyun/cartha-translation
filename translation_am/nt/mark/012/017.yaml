  text: ⸂ὁ δὲ⸃ Ἰησοῦς εἶπεν ⸀αὐτοῖς· ⸂Τὰ Καίσαρος ἀπόδοτε⸃ Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ. καὶ ⸀ἐξεθαύμαζον ἐπ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/017.yaml
  text: But Jesus said to them[a], “Give back to Caesar the things that are Caesar’s, and to God the things that are God’s.” And they were utterly amazed at him.
translation:
  language: am
  text: ኢየሱስ ግን፣ “የቄሳር የሆኑትን ነገሮች ለቄሳር፣ የእግዚአብሔር የሆኑትንም ነገሮች ለእግዚአብሔር መልሱ[a]” አላቸው። እነርሱም በእርሱ እጅግ ተደነቁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የቄሳር የሆኑትን ነገሮች ለቄሳር፣ የእግዚአብሔር የሆኑትንም ነገሮች ለእግዚአብሔር ስጡ።” የግሪኩ ግስ «መመለስ፣» «መክፈል፣» ወይም የሚገባውን «መስጠት» ማለት ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόδοτε
  choice: መልሱ
  rationale: የግሪኩ ግስ የሚገባውን መመለስ፣ መክፈል ወይም መስጠትን ሊያመለክት ይችላል። “መልሱ” ነገሩ ለባለቤቱ እንዲሰጥ የሚጠይቀውን ኃይል ይጠብቃል፤ ትርጉሙንም በግብር ክፍያ ብቻ አይወስነውም።
- source_word: Τὰ Καίσαρος ... Καίσαρι
  choice: የቄሳርን ለቄሳር
  rationale: በአማርኛ የተወው ስም በአገባቡ በግልጽ ስለሚሞላ፣ ይህ አጭር አገላለጽ “የቄሳር የሆኑትን ነገሮች ለቄሳር” የሚለውን የባለቤትነት ኃይል በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: τὰ τοῦ θεοῦ ... τῷ θεῷ
  choice: የእግዚአብሔርንም ለእግዚአብሔር
  rationale: ከመጀመሪያው ሐረግ ጋር ያለውን ሆን ተብሎ የተሠራ ትይዩነት ይጠብቃል፣ የእግዚአብሔር የሆነውንም ከማጥበብ ይቆጠባል።
- source_word: ἐξεθαύμαζον
  choice: እጅግ ተደነቁ
  rationale: ግሱ የተጠናከረ መደነቅን ያመለክታል። “እጅግ ተደነቁ” ይህን ኃይል በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: ἐπ’ αὐτῷ
  choice: በእርሱ
  rationale: የመደነቃቸውን ነገር ወይም ምክንያት በቀጥታ ይጠቁማል፤ መደነቃቸው በእርሱ መልስ ምክንያት መሆኑን በትርጓሜ አያብራራም።
- source_word: δὲ
  choice: ግን
  rationale: በንግግሩ ውስጥ ያለውን ቀላል ተቃርኖና ሽግግር ያሳያል።
- source_word: εἶπεν αὐτοῖς
  choice: አላቸው
  rationale: የግሪኩን “ለእነርሱ አለ” በተፈጥሯዊና አጭር የአማርኛ የንግግር መግቢያ ያስተላልፋል።
theological_decisions:
