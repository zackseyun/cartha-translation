  text: ⸂ἀπεκρίθη ὁ Ἰησοῦς⸃ ὅτι Πρώτη ⸀ἐστίν· Ἄκουε, Ἰσραήλ, κύριος ὁ θεὸς ἡμῶν κύριος εἷς ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/029.yaml
  text: 'Jesus answered[a], “The first is: Hear, O Israel, the Lord our God[b], the Lord is one.'
translation:
  language: am
  text: ኢየሱስም እንዲህ ብሎ መለሰ፤ “የመጀመሪያው ይህ ነው፦ ‘እስራኤል ሆይ፣ ስማ፤ ጌታ[a] አምላካችን፣ ጌታ አንድ ነው።’[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይህ ንግግር ከሸማው (ዘዳግም 6፥4) የተጠቀሰ ስለሆነ፣ እዚህ “ጌታ” የሚለው ቃል ሰብዓ ሊቃናት ትርጉም የመለኮታዊውን ስም YHWH ለመተካት የተጠቀመበትን የግሪክ κύριος ያንጸባርቃል።
    reason: cross_reference
  - marker: b
    text: ወይም፣ “ጌታ አምላካችን አንድ ጌታ ነው፤” ወይም፣ “ጌታ አምላካችን ነው፣ ጌታ ብቻ።” የግሪኩ አገላለጽ ዘዳግም 6፥4ን ያስተጋባል፤ የእግዚአብሔርን አንድነት፣ ብቸኛ አምላክነት ወይም ሁለቱንም ሊያጎላ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: መለሰ
  rationale: በውይይት ውስጥ የሚመጣውን መልስ በተፈጥሯዊና በተለመደ አማርኛ ይገልጻል።
- source_word: Πρώτη
  choice: የመጀመሪያው
  rationale: ቅጽሉ በራሱ እንደ ስም ቆሞ ከአውዱ የሚታወቀውን ‘ትእዛዝ’ ያመለክታል፤ ቃሉን በግልጽ ሳይጨምር ይህን ያስቀራል።
- source_word: Ἄκουε
  choice: ስማ
  rationale: የሸማውን መክፈቻ ቃል ቀጥተኛ በሆነ የትእዛዝ አገላለጽ ይጠብቃል።
- source_word: Ἰσραήλ
  choice: እስራኤል ሆይ
  rationale: የቀጥታ ጥሪውን በተፈጥሯዊና በክብር ባለው የአማርኛ አነጋገር ያሳያል።
- source_word: κύριος
  choice: ጌታ
  rationale: የግሪኩን κύριος በቀጥታ ይተረጉማል፤ በዘዳግም 6፥4 ዳራ የመለኮታዊውን ስም የሚወክል መሆኑ በማስታወሻ ተገልጿል።
- source_word: θεὸς ἡμῶν
  choice: አምላካችን
  rationale: የባለቤትነት ግንኙነቱን በአጭርና ተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: εἷς
  choice: አንድ
  rationale: የግሪኩን አጭር እና ትርጉም የተሸከመ አገላለጽ ይጠብቃል፤ ‘ብቻ’ የሚለውን ትርጓሜ በዋናው ጽሑፍ አይጨምርም።
theological_decisions:
- issue: የሸማውን የመጨረሻ ሐረግ እና በአንድነትና ብቸኝነት መካከል ያለውን የትርጉም ውጥረት ማቆየት
  choice: ጌታ አምላካችን፣ ጌታ አንድ ነው
  alternative: ጌታ አምላካችን አንድ ጌታ ነው፤ ወይም፣ ጌታ አምላካችን ነው፣ ጌታ ብቻ
  rationale: ይህ አተረጓጎም የግሪኩን የቃላት ቅደም ተከተል በቅርብ ይከተላል፤ አገላለጹ በእግዚአብሔር አንድነት፣ ብቸኛ አምላክነት ወይም በሁለቱም ላይ ማተኮሩን በዋናው ጽሑፍ በአንድ አቅጣጫ አይወስንም።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ ነው። “ስማ” እና “እስራኤል ሆይ” የሸማውን ሥነ ሥርዓታዊና ቃል ኪዳናዊ ድምፅ ሳያረጁ ይጠብቃሉ።
