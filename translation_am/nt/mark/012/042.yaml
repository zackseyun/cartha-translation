  source_fidelity: The draft accurately represents the poor widow, her arrival, the two lepta, and their equivalence to one quadrans. The final demonstrative, however, is singular (ይህም) although its antecedent is the two coins; recasting it as a value-equivalence statement is clearer while retaining the sense of ὅ ἐστιν.
