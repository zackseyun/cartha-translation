  text: And a poor widow came and put in two lepta[c][b][a], which is a quadrans.
translation:
  language: am
  text: አንዲት ድሃ መበለትም መጥታ ሁለት ሌፕታ[a][b] አስገባች፤ እነዚህም የአንድ ቆድራንስ[c] ያህል ነበሩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ሌፕቶን እጅግ ትንሽ ዋጋ ያለው ሳንቲም ነበር፤ ሁለት ሌፕታ ከአንድ የሮማውያን ቆድራንስ ጋር እኩል ነበሩ።
    reason: cultural_note
  - marker: b
    text: ወይም፣ “ሁለት ትናንሽ የነሐስ ሳንቲሞች።”
    reason: lexical_alternative
  - marker: c
    text: ቆድራንስ በግሪኩ ጽሑፍ የተጠቀሰው የሮማውያን ሳንቲም ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθοῦσα
  choice: መጥታ
  rationale: የግሪኩን የቀደመ ድርጊት ተሳቢ አገባብ በተፈጥሯዊ የአማርኛ ቅደም ተከተል ያሳያል።
- source_word: μία
