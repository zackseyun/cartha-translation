- source_word: χήρα πτωχὴ
  choice: ድሀ መበለት
  rationale: የሁለቱንም ቃላት መደበኛ ትርጉም በግልጽና በዘመናዊ አማርኛ ይገልጣል፤ ‘በጣም የተቸገረች’ ማለት በዚህ ጥቅስ ያልተገለጸውን ደረጃ ይጨምራል።
- source_word: ἔβαλεν
  choice: አስገባች
  rationale: በመባ ማስገቢያ ውስጥ ገንዘብ የማስገባትን ድርጊት በተፈጥሯዊ አማርኛ ያሳያል፤ ‘ወረወረች’ ከሚለው የኃይል ስሜት ይርቃል።
- source_word: λεπτὰ δύο
  choice: ሁለት ሌፕታ
  rationale: የግሪኩን ታሪካዊ የሳንቲም ስምና የብዙ ቁጥር ቅርጽ ይጠብቃል፤ ለአንባቢው ማብራሪያ በማስታወሻ ቀርቧል።
- source_word: ὅ ἐστιν
  choice: ይህም … ነው
  rationale: ሁለቱ ሌፕታ ከአንድ ቈድራንጤስ ጋር በዋጋ እንደሚተካከሉ የሚገልጸውን አብራሪ ንግግር በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: κοδράντης
  choice: ቈድራንጤስ
  rationale: የሮማውያንን ታሪካዊ የሳንቲም ስም በድምፅ ቅርብ ሆኖ ይጠብቃል፤ ዘመናዊ የገንዘብ ስም መተካት የተሳሳተ የዋጋ ግንዛቤ ሊፈጥር ይችላል።
