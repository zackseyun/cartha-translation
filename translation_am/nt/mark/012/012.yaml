language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Καὶ ἐζήτουν αὐτὸν κρατῆσαι, καὶ ἐφοβήθησαν τὸν ὄχλον, ἔγνωσαν γὰρ ὅτι πρὸς αὐτοὺς τὴν παραβολὴν εἶπεν. καὶ ἀφέντες αὐτὸν ἀπῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/012.yaml
  text: And they were seeking to seize him[a], but they feared the crowd, for they knew that he had spoken the parable against them. So they left him and went away.
translation:
  language: am
  text: 'እርሱንም ለመያዝ ይፈልጉ ነበር፤ ነገር ግን ሕዝቡን ፈሩ፤ ምሳሌውን በእነርሱ ላይ[a] እንደተናገረ አውቀው ነበርና። ስለዚህ ትተውት ሄዱ።


    [a] ወይም፣ “እነርሱን አስመልክቶ” ወይም “ለእነርሱ።”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እነርሱን አስመልክቶ” ወይም “ለእነርሱ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: ይፈልጉ ነበር
  rationale: ያልተፈጸመ ቀጣይ ወይም የሙከራ ተግባርን የሚያሳየውን የግሪክ imperfect ገጽታ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: κρατῆσαι
  choice: ለመያዝ
  rationale: መያዝን ወይም በኃይል መቆጣጠርን ያመለክታል፤ በግሪኩ በግልጽ ያልተጠቀሰ መደበኛ የሕግ ሂደት ‘ማሰር’ በማለት አይጨመርም።
- source_word: ἐφοβήθησαν τὸν ὄχλον
  choice: ሕዝቡን ፈሩ
  rationale: የግሪኩን ቀጥተኛና አጭር አገላለጽ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἔγνωσαν
  choice: አውቀው ነበር
  rationale: እነርሱ የደረሱበትን የተረጋገጠ ግንዛቤ ያሳያል፤ የምሳሌው መነገር ከዚህ በፊት መሆኑንም የአማርኛው አወቃቀር ያሳያል።
- source_word: πρὸς αὐτοὺς
  choice: በእነርሱ ላይ
  rationale: በዚህ የጠላትነት አውድ ምሳሌው እነርሱን የሚወቅስ ሆኖ መቅረቡን በተፈጥሯዊ አማርኛ ይገልጣል፤ የበለጠ ቀጥተኛ አማራጮች በማስታወሻ ተጠብቀዋል።
- source_word: τὴν παραβολὴν
  choice: ምሳሌውን
  rationale: የግሪኩን የተወሰነ አመልካች ይጠብቃል፤ ከዚያ በፊት የተነገረውን ምሳሌ ያመለክታል።
- source_word: ἀφέντες αὐτὸν
  choice: ትተውት
  rationale: እርሱን ብቻውን መተዋቸውንና የመያዝ ሙከራቸውን ማቋረጣቸውን በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀπῆλθον
  choice: ሄዱ
  rationale: ከቦታው መሄዳቸውን በዘመናዊና የተለመደ አማርኛ ይገልጣል።
theological_decisions:
- issue: የπρὸς αὐτοὺς አቅጣጫዊ ወይም ተቃዋሚ ኃይል
  choice: በእነርሱ ላይ
  alternative: እነርሱን አስመልክቶ፤ ለእነርሱ
  rationale: አውዱ ምሳሌው እነርሱን የሚወቅስ መሆኑን ይደግፋል፤ ሆኖም πρός በራሱ ‘እነርሱን አስመልክቶ’ ወይም ‘ለእነርሱ’ የሚል አነስተኛ ተቃዋሚነት ያለው ትርጉም ሊኖረው ስለሚችል አሻሚነቱ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የቁጥሩ ትይዩ አረፍተ ነገሮችና የምክንያት ግንኙነቱ ተጠብቀዋል።
