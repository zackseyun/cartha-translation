  text: ⸂ἔφη αὐτοῖς ὁ Ἰησοῦς⸃· Οὐ διὰ τοῦτο πλανᾶσθε μὴ εἰδότες τὰς γραφὰς μηδὲ τὴν δύναμιν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/024.yaml
  text: 'Jesus said to them[a], “Is this not why you are mistaken: because you know neither the Scriptures nor the power of God?”'
translation:
  language: am
  text: ኢየሱስ እንዲህ አላቸው፤ “መጻሕፍትንም ሆነ የእግዚአብሔርን ኃይል ስለማታውቁ፣ የምትሳሳቱት ለዚህ አይደለምን?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “መጻሕፍትንም ሆነ የእግዚአብሔርን ኃይል ስለማታውቁ፣ የምትሳቱት ለዚህ አይደለምን?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτοῖς ὁ Ἰησοῦς
  choice: ኢየሱስም እንዲህ አላቸው
  rationale: φημί ቀጥተኛ ንግግርን የሚያስገባ ‘አለ’ ማለት ነው፤ ‘እንዲህ አላቸው’ በአማርኛ ተፈጥሯዊ ሲሆን እንደ ‘መለሰ’ ያለ ተጨማሪ ፍቺ አያስገባም።
- source_word: Οὐ διὰ τοῦτο
  choice: ስለዚህ አይደለምን?
  rationale: οὐ ያለው ጥያቄ ስምምነትን የሚጠብቅ የአጽንዖት ጥያቄ ነው፤ διὰ τοῦτο ደግሞ ምክንያትን ያመለክታል።
- source_word: πλανᾶσθε
  choice: የተሳሳታችሁት
  rationale: ቃሉ ‘ተሳሳታችሁ/ተሳታችሁ’ ወይም ‘ተሳስታችሁ ተመራችሁ’ ሊል ይችላል። እዚህ ‘ተሳሳታችሁ’ የተሳሳተ ግንዛቤን የሚገልጥ ሲሆን የማታለል ምንጭ አይጨምርም።
- source_word: μὴ εἰδότες
  choice: ስለማታውቁ
  rationale: አሉታዊው ተሳቢ አገላለጽ ለስህተታቸው ምክንያቱን ይሰጣል፤ የምክንያት ሐረግ በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: τὰς γραφὰς
  choice: መጻሕፍትን
  rationale: ብዙ ቁጥር ያለው γραφαί በዚህ የአይሁድ አውድ የተቀደሱትን የታወቁ መጻሕፍት ያመለክታል፤ ‘መጻሕፍት’ የተለመደና ክቡር የአማርኛ አጠራር ነው።
- source_word: μηδὲ τὴν δύναμιν τοῦ θεοῦ
  choice: የእግዚአብሔርን ኃይል
  rationale: δύναμις ‘ኃይል’ ሲሆን τοῦ θεοῦ ባለቤትነትን ይገልጣል። ‘…ም ሆነ…’ የሚለው አወቃቀር μὴ…μηδέ የሚገልጠውን ‘አንዱንም ሌላውንም አለማወቅ’ ያስተላልፋል።
theological_decisions:
- issue: πλανᾶσθε የሚገልጠው የስህተት ባሕርይ
  choice: የተሳሳታችሁት
  alternative: የተሳሳተ መንገድ የሄዳችሁት / የተሳታችሁት
  rationale: ግሪኩ ቀላል ስህተትንም ሆነ መሳትን ሊያመለክት ይችላል። አውዱ ስለ ትንሣኤ፣ ስለ መጻሕፍትና ስለ እግዚአብሔር ኃይል ያላቸውን የተሳሳተ ግንዛቤ ይገሥጻል፤ ትርጉሙ ስህተቱ በማታለል እንደመጣ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የአጽንዖት ጥያቄው እና የምክንያት ግንኙነቱ ተጠብቀዋል፤ የግሪኩ πλανᾶσθε አማራጭ ፍቺም በማስታወሻ ቀርቧል።
