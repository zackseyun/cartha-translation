  edition: SBLGNT
  text: ⸀δευτέρα αὕτη· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν. μείζων τούτων ἄλλη ἐντολὴ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/031.yaml
  text: 'The second is this: ‘You shall love your neighbor as yourself.’ There is no other commandment greater than these[a].'
translation:
  language: am
  text: ሁለተኛው ይህ ነው፤ “ባልንጀራህን እንደ ራስህ ውደድ።” ከእነዚህ[a] የሚበልጥ ሌላ ትእዛዝ የለም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “እነዚህ” የሚለው ብዙ ቁጥር በአውዱ የተጠቀሱትን ሁለቱን ትእዛዛት በአንድነት ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: δευτέρα αὕτη
  choice: ሁለተኛውም ይህ ነው
  rationale: በግሪክኛው የተተወውን “ትእዛዝ” ከአውዱ እንዲገባ በማድረግ፣ የ“ሁለተኛው”ን ቅደም ተከተላዊ አጽንዖት ይጠብቃል። “ም” ከቀደመው የመጀመሪያ ትእዛዝ ጋር ተፈጥሯዊ ትስስር ያደርጋል።
- source_word: Ἀγαπήσεις
  choice: ውደድ
  rationale: በጥቅሱ ውስጥ የወደፊት ጊዜ ቅርጽ የትእዛዝ ኃይል አለው፤ የአማርኛው ቀጥተኛ ትእዛዛዊ ቅርጽ ይህን በተፈጥሮ ያስተላልፋል።
- source_word: τὸν πλησίον σου
  choice: ባልንጀራህን
  rationale: “ባልንጀራ” ከዘሌዋውያን 19፥18 ጋር ያለውን ቅዱስ ጽሑፋዊ ትስስር የሚጠብቅ፣ ከአካባቢ ጎረቤትነት በላይ ለሌላው ሰው የሚደረግን ሥነ ምግባራዊ ግዴታ ሊያመለክት የሚችል የተለመደ ቃል ነው።
- source_word: ὡς σεαυτόν
  choice: እንደ ራስህ
  rationale: የግሪክኛውን አጭር ንጽጽር ሳያብራራ ወይም “ራስህን እንደምትወድ” የሚል ያልተጻፈ አባባል ሳይጨምር ይጠብቃል።
- source_word: μείζων τούτων ἄλλη ἐντολὴ οὐκ ἔστιν
  choice: ከእነዚህ የሚበልጥ ሌላ ትእዛዝ የለም
  rationale: የμείζωνን የንጽጽር ኃይልና የτούτωνን ብዙ ቁጥር በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐντολή
  choice: ትእዛዝ
  rationale: በኦሪት ትእዛዛት አውድ ውስጥ የቃሉን ሕጋዊና ቃል ኪዳናዊ ክብደት የሚያስተላልፍ ግልጽና የተለመደ አማርኛ ነው።
theological_decisions:
- issue: በመጨረሻው ሐረግ ያለው τούτων (“እነዚህ”) የሚያመለክተው
  choice: በአውዱ የተጠቀሱትን ሁለቱን ትእዛዛት በአንድነት የሚያመለክት ብዙ ቁጥር
  alternative: የብዙ ቁጥር አገላለጽ ቢኖርም ወዲያውኑ ቀድሞ የተጠቀሰውን ሁለተኛውን ትእዛዝ ብቻ በአጠቃላይ ማመልከት
  rationale: τούτων በቅርጹ ብዙ ቁጥር ስለሆነ ትርጉሙ “ከእነዚህ” ብሎ ያለውን ሰዋሰዋዊ መረጃ ይጠብቃል፤ አውዱም እግዚአብሔርንና ባልንጀራን ስለመውደድ የተሰጡትን ሁለት ትእዛዛት ያሳያል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛ ተጠቅሟል። “ባልንጀራ” ቅዱስ ጽሑፋዊ ትስስሩን ይጠብቃል፤ የዓረፍተ ነገሩ አወቃቀር ደግሞ ለዘመናዊ አንባቢ ተፈጥሯዊ ነው።
