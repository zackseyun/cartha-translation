  to: ኢየሱስም መልሶ፣ በቤተ መቅደስ ሲያስተምር፣ እንዲህ አለ፤ “የሕግ መምህራን መሲሑ[a] የዳዊት ልጅ ነው ብለው እንዴት ይላሉ?”
  rationale: The revision restores the source's response participle in idiomatic Amharic, removes the unsupported possessive from 'temple,' and adjusts the question's syntax to express 'say that' naturally. It retains the draft's appropriately nonsectarian rendering of the messianic title and its alternative-reading footnote.
