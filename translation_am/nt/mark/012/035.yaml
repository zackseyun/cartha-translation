language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Καὶ ἀποκριθεὶς ὁ Ἰησοῦς ἔλεγεν διδάσκων ἐν τῷ ἱερῷ· Πῶς λέγουσιν οἱ γραμματεῖς ὅτι ὁ χριστὸς υἱὸς ⸂Δαυίδ ἐστιν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/035.yaml
  text: And Jesus answered and said[a], as he was teaching in the temple, “How do the scribes say that the Messiah is the son of David?”
translation:
  language: am
  text: ኢየሱስም መልሶ፣ በቤተ መቅደስ ሲያስተምር፣ እንዲህ አለ፤ “የሕግ መምህራን መሲሑ[a] የዳዊት ልጅ ነው ብለው እንዴት ይላሉ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ክርስቶስ።” የግሪኩ Χριστός እዚህ እንደ መሲሐዊ ማዕረግ ጥቅም ላይ ውሏል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς ... ἔλεγεν
  choice: እንዲህ አለ
  rationale: ἀποκριθείς በማርቆስ ውስጥ ቀድሞ የቀረበ ግልጽ ጥያቄ ሳይኖርም ለሁኔታው የሚሰጥን ምላሽ ሊያስተዋውቅ ይችላል። በአማርኛ “መልሶ እንዲህ አለ” የሚለው እዚህ ከባድና ያልተፈጥሯዊ ስለሆነ፣ የንግግሩን መግቢያ በተፈጥሯዊ ሁኔታ ተርጉሟል።
- source_word: διδάσκων ἐν τῷ ἱερῷ
  choice: በቤተ መቅደሱ ሲያስተምር
  rationale: የአሁን ጊዜ አሳታፊው ዋናው ንግግር በመምህርነት ሥራው መካከል መነገሩን ያሳያል። ἱερόν አጠቃላይ የቤተ መቅደስ ግቢን ሊያመለክት ቢችልም፣ “ቤተ መቅደስ” የተለመደና ግልጽ ነው።
- source_word: Πῶς λέγουσιν
  choice: እንዴት ይላሉ?
  rationale: Πῶς በቅርበት “እንዴት” የሚል ሲሆን፣ ጥያቄው የጸሐፍትን አባባል የሚመረምር የክርክር ጥያቄ ነው። “እንዴት ሊሉ ይችላሉ?” ማለት በግሪኩ ላይ ያልተገለጸ የአለመቻል ሐሳብ ሊጨምር ስለሚችል አልተመረጠም።
- source_word: οἱ γραμματεῖς
  choice: የሕግ መምህራን
  rationale: በወንጌላት አውድ γραμματεῖς የሙሴን ሕግ የሚያጠኑና የሚያስተምሩ ባለሙያዎችን ያመለክታል። “ጸሐፍት” ታሪካዊ ቃል ቢሆንም ለዘመናዊ አንባቢ ተራ ጸሐፊዎችን ሊያስመስል ይችላል።
- source_word: ὁ χριστός
  choice: መሲሑ
  rationale: እዚህ Χριστός እንደ የአይሁድ ተስፋ ማዕረግ ጥቅም ላይ ውሏል፤ “መሲሕ” ይህን መሲሐዊ አውድ በግልጽ ያስተላልፋል።
- source_word: υἱὸς Δαυίδ
  choice: የዳዊት ልጅ
  rationale: ቃሉ የታወቀውን መሲሐዊ የዳዊት ዘርና የወራሽነት መጠሪያ ይይዛል፤ ቀጥተኛው የአማርኛ አቀራረብ አሻሚነቱን ሳይፈታ ይጠብቃል።
theological_decisions:
- issue: Χριστόςን እንደ ማዕረግ መተርጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: በዚህ ጥያቄ Χριστός እንደ ስም ሳይሆን እስራኤል የምትጠብቀውን የተቀባ ንጉሥ የሚያመለክት ማዕረግ ነው። “መሲሕ” ይህን ማዕረጋዊ አጠቃቀም ያጎላል፤ “ክርስቶስ” የሚለው ተለምዷዊ አማራጭ በማስታወሻ ቀርቧል።
- issue: ጥያቄው የዳዊት ዘርነትን ይክዳል ወይስ የመሲሑን የላቀ ማንነት ይጠይቃል?
  choice: ጥያቄውን ያለ ትርጓሜያዊ ማብራሪያ ማቆየት
  alternative: “መሲሑ የዳዊት ልጅ ብቻ ነው” ብሎ ማስፋት
  rationale: የግሪኩ ጽሑፍ “ብቻ” አይልም፣ የዳዊት ልጅነትንም በቀጥታ አይክድም። ስለዚህ ትርጉሙ የክርክሩን ውጥረትና ቀጣዩ ጥቅስ የሚያብራራውን ክፍት ጥያቄ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የጥያቄው አነጋገር ከግሪኩ ጋር ቅርብ ሆኖ ተፈጥሯዊ እንዲሰማ ተደርጓል።
