  text: ⸀καὶ ἐλθόντες λέγουσιν αὐτῷ· Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ καὶ οὐ μέλει σοι περὶ οὐδενός, οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων, ἀλλ’ ἐπ’ ἀληθείας τὴν ὁδὸν τοῦ θεοῦ διδάσκεις· ἔξεστιν ⸂δοῦναι κῆνσον Καίσαρι⸃ ἢ οὔ; δῶμεν ἢ μὴ δῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/014.yaml
  text: And they came and said to him[a], “Teacher, we know that you are truthful and do not care about anyone, for you do not look at the face of men, but truly teach the way of God. Is it lawful to pay the poll tax to Caesar or not? Should we pay it[b], or should we not pay it?”
translation:
  language: am
  text: 'እነርሱም መጥተው እንዲህ አሉት፤ “መምህር ሆይ፣ እውነተኛ እንደሆንህና ለማንም ሰው ግድ እንደማይልህ እናውቃለን፤ የሰዎችን ፊት አትመለከትምና፣[a] ይልቁንም የእግዚአብሔርን መንገድ በእውነት ታስተምራለህ። ለቄሳር የራስ ቀረጥ መክፈል[b] ተፈቅዶልናል? እንክፈል ወይስ አንክፈል?”


    [a] ወይም፣ “ለሰዎች አታዳላም” ወይም “በሰዎች ውጫዊ ገጽታ አትመራም።”


    [b] የግሪኩ ቃል κῆνσος (ኬንሶስ) ሮማውያን በሕዝብ ቆጠራ መሠረት ያስከፍሉትን የራስ ቀረጥ ያመለክታል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለሰዎች አታዳላም” ወይም “በሰዎች ውጫዊ ገጽታ አትመራም።”
    reason: lexical_alternative
  - marker: b
    text: የግሪኩ ቃል κῆνσος (ኬንሶስ) ሮማውያን በሕዝብ ቆጠራ መሠረት ያስከፍሉትን የራስ ቀረጥ ያመለክታል።
    reason: cultural_note
lexical_decisions:
- source_word: Διδάσκαλε
  choice: መምህር ሆይ
  rationale: የማስተማር ሚናውን በተፈጥሯዊና በክብር ባለው ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἀληθὴς
  choice: እውነተኛ
  rationale: በግለሰብ ላይ የተነገረውን የእውነትና የታማኝነት ባሕርይ ያሳያል።
- source_word: οὐ μέλει σοι περὶ οὐδενός
  choice: ለማንም እንደማታዳላ
  rationale: ቃል በቃል ‘ስለ ማንም አይገድህም’ ማለት በአማርኛ ግድየለሽነትን ሊያመለክት ይችላል፤ በዐውዱ ግን በሰዎች ሥልጣን ወይም አስተያየት አለመገፋፋትን ያሳያል።
- source_word: οὐ ... βλέπεις εἰς πρόσωπον ἀνθρώπων
  choice: የሰዎችን ፊት አትመለከትም
  rationale: የግሪኩን ግልጽ ምስላዊ አነጋገር ይጠብቃል፤ ፈሊጣዊ ትርጉሙ በግርጌ ማስታወሻ ተገልጧል።
- source_word: ἐπ’ ἀληθείας
  choice: በእውነት
  rationale: ትምህርቱ በእውነትና ያለ ማዳላት መሆኑን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: የእግዚአብሔርን መንገድ
  rationale: የምንጩን የመንገድ ምስልና የተለመደውን መጽሐፍ ቅዱሳዊ አገላለጽ ይጠብቃል።
- source_word: ἔξεστιν
  choice: ተፈቅዶአልን
  rationale: ጥያቄው በሕግና በሥነ ምግባር የተፈቀደ ስለመሆኑ ነው፤ ይህም በዘመናዊ አማርኛ ግልጽ ነው።
- source_word: δοῦναι κῆνσον Καίσαρι
  choice: ለቄሳር የራስ ቀረጥ መክፈል
  rationale: δοῦναι በግብር ዐውድ ‘መክፈል’ ሲሆን κῆνσος በተለይ ከሮማውያን የሕዝብ ቆጠራ ጋር የተያያዘውን ቀረጥ ያመለክታል።
- source_word: δῶμεν ἢ μὴ δῶμεν
  choice: እንክፈል ወይስ አንክፈል?
  rationale: የግሪኩን አጭር፣ ቀጥተኛና ወጥመድ የሆነ ድግግሞሽ ይጠብቃል።
theological_decisions:
- issue: ስለ ሰው ፊት የተጠቀሰውን ፈሊጥ መተርጎም
  choice: በዋናው ጽሑፍ “የሰዎችን ፊት አትመለከትም” የሚለውን ምስላዊ አነጋገር ማቆየት፣ ፈሊጣዊ ፍቺውንም በማስታወሻ መግለጽ
  alternative: “ለሰዎች አታዳላም” ወይም “በውጫዊ ገጽታ አትመራም”
  rationale: ይህ የምንጩን ምስል ይጠብቃል፣ ነገር ግን አንባቢው ፈሊጡን እንዳይሳሳት ትርጉሙን ያብራራል፤ የቤተ እምነት ልዩ አቋም አያስገባም።
- issue: κῆνσος የሚያመለክተው የቀረጥ ዓይነት
  choice: “የራስ ቀረጥ” ብሎ መግለጽ
  alternative: “ግብር” ወይም “ቀረጥ” ብቻ
  rationale: ሰፊው ‘ግብር’ ታሪካዊ ልዩነቱን ያጠፋል፤ ‘የራስ ቀረጥ’ ከሮማውያን የሕዝብ ቆጠራ ጋር ያለውን ግንኙነት ይጠብቃል።
