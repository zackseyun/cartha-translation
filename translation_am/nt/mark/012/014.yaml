  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የምንጩ ምስላዊ አነጋገር በሚቻልበት ቦታ ተጠብቆ፣ በአማርኛ የሚያሳስት ቃል በቃል አገላለጽ ግን በተፈጥሯዊ ፈሊጥ ተተክቷል።
