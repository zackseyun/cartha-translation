  rationale: εἰ ἄρα ያለውን ጥርጣሬ ‘ምናልባት’ በማለት ይጠብቃል፤ በዛፉ ላይ ሊገኝ የሚጠበቀውን ‘ፍሬ’ በማለት ከዐውደ ንባቡ በግልጽ ያሳያል።
- source_word: ἐλθὼν ἐπ’ αὐτὴν
  choice: ወደ እርሷም በደረሰ ጊዜ
