base_translation:
  language: en
  yaml_path: translation/nt/mark/011/013.yaml
  text: And seeing from a distance a fig tree having leaves[a], he went to see whether perhaps he would find anything on it. But when he came to it, he found nothing except leaves, for it was not the season for figs.
translation:
  language: am
  text: ከሩቅ ቅጠሎች ያሉባትን አንዲት የበለስ ዛፍ አይቶ፣ ምናልባት በእርሷ ላይ አንዳች ነገር ያገኝ እንደሆነ ለማየት ወደ እርሷ ሄደ። ወደ እርሷም በደረሰ ጊዜ ከቅጠሎች በቀር በእርሷ ላይ ምንም አላገኘም፤ የበለስ ወቅት[a] አልነበረምና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የበለስ ጊዜ አልነበረምና።”
    reason: καιρός ‘ወቅት’ ወይም ‘ጊዜ’ ተብሎ ሊተረጎም ይችላል።
