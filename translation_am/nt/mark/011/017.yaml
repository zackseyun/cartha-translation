  text: καὶ ἐδίδασκεν ⸂καὶ ἔλεγεν⸃ ⸀αὐτοῖς· Οὐ γέγραπται ὅτι Ὁ οἶκός μου οἶκος προσευχῆς κληθήσεται πᾶσιν τοῖς ἔθνεσιν; ὑμεῖς δὲ ⸀πεποιήκατε αὐτὸν σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/017.yaml
  text: And he was teaching and saying to them[a], “Is it not written[b], ‘My house will be called a house of prayer for all the nations’? But you have made it a den of robbers.”
translation:
  language: am
  text: እያስተማረ እንዲህም ይላቸው ነበር፦ “እንዲህ ተብሎ አልተጻፈምን? ‘ቤቴ ለብሔራት ሁሉ የጸሎት ቤት ይባላል።’[a] እናንተ ግን የወንበዴዎች ዋሻ አድርጋችሁታል።”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ለብሔራት ሁሉ” የሚለው “ለሕዝቦች ሁሉ” ተብሎም ሊተረጎም ይችላል። የግሪኩ አገላለጽ ኢሳይያስ 56፥7ን ያስተጋባል፤ ቤተ መቅደሱ ከእስራኤል ውጭ ላሉ ብሔራትም የታሰበ መሆኑን ያጎላል።
    reason: lexical_alternative
  - marker: b
    text: “የወንበዴዎች ዋሻ” የሚለው ኤርምያስ 7፥11ን ያስተጋባል። “ወንበዴዎች” ተብሎ የተተረጎመው የግሪክ ቃል በአንዳንድ አውዶች “ዘራፊዎች” ወይም “ታጣቂ ዘራፊዎች” ማለት ሊሆን ይችላል።
    reason: cross_reference
lexical_decisions:
- source_word: ἐδίδασκεν καὶ ἔλεγεν
  choice: እያስተማረም እንዲህ ይላቸው ነበር
  rationale: የሁለቱን የኢምፐርፌክት ግሶች ቀጣይ ወይም ተደጋጋሚ ተግባር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Οὐ γέγραπται
  choice: እንዲህ ተብሎ አልተጻፈምን?
  rationale: ቅዱስ ጽሑፍን የሚጠቅሰውን ፍጹም ተደራጊ አገላለጽና የጥያቄውን አጽንዖት ይጠብቃል።
- source_word: Ὁ οἶκός μου
  choice: ቤቴ
  rationale: ‘ቤት’ የሚለውን ቀጥተኛ ምስላዊ አገላለጽና የኢሳይያስን ጥቅስ ይጠብቃል፤ ‘ቤተ መቅደሴ’ ብሎ አይተረጉመውም።
- source_word: οἶκος προσευχῆς
  choice: የጸሎት ቤት
  rationale: የግሪኩን የጄኒቲቭ አወቃቀር በተለመደና ግልጽ አማርኛ ያቀርባል።
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: ለሕዝቦች ሁሉ
  rationale: የቤቱን ለሁሉም ሕዝቦች የታሰበ ስፋት ያሳያል፤ ‘አሕዛብ’ በዘመናዊ አማርኛ ሊያስከትል የሚችለውን ጠባብ ወይም አሉታዊ ትርጉም ያስወግዳል።
- source_word: πεποιήκατε
  choice: አድርጋችሁታል
  rationale: ያለፈው ድርጊት አሁን ያለውን ሁኔታ እንዳስከተለ የሚያሳየውን ፍጹም ጊዜ ይጠብቃል።
- source_word: σπήλαιον λῃστῶν
  choice: የዘራፊዎች ዋሻ
  rationale: የኤርምያስ 7፥11ን ጥቅስ በተፈጥሯዊ አማርኛ ያስተጋባል፤ λῃστήςን ከአውዱ በላይ ፖለቲካዊ ትርጉም አይጭንበትም።
theological_decisions:
- issue: የትንቢታዊው ጥቅስ ሁሉን አቀፍ ስፋት
  choice: ለሕዝቦች ሁሉ
  alternative: ለአሕዛብ ሁሉ / ለአገራት ሁሉ
  rationale: የግሪኩ ἔθνη እና የኢሳይያስ 56፥7 ሐሳብ ቤቱ ከእስራኤል ውጭም ላሉ ሕዝቦች የታሰበ መሆኑን ያሳያሉ፤ ትርጉሙ ይህን ሳያጠብ ይጠብቃል።
- issue: λῃστῶν በኢየሱስ ወቀሳ ያለው ኃይል
  choice: ዘራፊዎች
  alternative: ወንበዴዎች / ቀማኞች
  rationale: ቃሉ በአንዳንድ አውዶች ወንበዴዎችን ወይም ብርጋንዶችን ሊያመለክት ቢችልም፣ እዚህ የኤርምያስ 7፥11 ጥቅስ ዋናውን አውድ ይወስናል፤ ‘ዘራፊዎች’ የጥቅሱን ኃይል ያለ አስፈላጊ ፖለቲካዊ ማብራሪያ ይጠብቃል።
