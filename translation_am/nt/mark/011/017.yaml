  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የቀጣይ ድርጊቱ ገጽታ ‘እያስተማረ… ይላቸው ነበር’ በሚለው ተጠብቋል፤ የትንቢታዊ ጥቅሶቹም ክብርና አጽንዖት ሳይጠፋ ቀርቧል።
