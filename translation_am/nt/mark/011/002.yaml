  text: καὶ λέγει αὐτοῖς· Ὑπάγετε εἰς τὴν κώμην τὴν κατέναντι ὑμῶν, καὶ ⸀εὐθὺς εἰσπορευόμενοι εἰς αὐτὴν εὑρήσετε πῶλον δεδεμένον ἐφ’ ὃν οὐδεὶς ⸀οὔπω ἀνθρώπων ⸀ἐκάθισεν· ⸂λύσατε αὐτὸν καὶ φέρετε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/002.yaml
  text: And he says to them[a], “Go into the village opposite you, and as soon as you enter it, you will find a colt tied there, on which no one has yet sat[b]. Untie it and bring it.”
translation:
  language: am
  text: እንዲህም አላቸው፦ “ከእናንተ ትይዩ ወዳለው መንደር ሂዱ፤ ወደ መንደሩም እንደገባችሁ፣ ማንም ሰው እስካሁን ያልተቀመጠበትን[b] የታሰረ ውርንጫ[a] ወዲያው ታገኛላችሁ። ፍቱትና አምጡት።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የአህያ ውርንጫ።” የግሪኩ πῶλον ወጣት እንስሳን ሊያመለክት ይችላል፤ በዚህ ዐውድ ኢየሱስ የሚቀመጥበትን የአህያ ውርንጫ ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “ከሰዎች ማንም እስካሁን ያልተቀመጠበት።” አነጋገሩ ማንም ሰው እንዳልጋለበው በግልጽ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑπάγετε
  choice: ሂዱ
  rationale: የእንቅስቃሴ ትእዛዝን በተፈጥሯዊና ቀጥተኛ አማርኛ ያስተላልፋል።
- source_word: κώμην
  choice: መንደር
  rationale: πόλις ከሚለው ከተማን ከሚያመለክት ቃል በተለየ፣ κώμη አነስ ያለ ሰፈራን ያመለክታል።
- source_word: τὴν κατέναντι ὑμῶν
  choice: በፊታችሁ ያለው
  rationale: ደቀ መዛሙርቱ ካሉበት ትይዩ ወይም ፊት ለፊት ያለውን መንደር በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: εὐθὺς εἰσπορευόμενοι εἰς αὐτὴν
  choice: ወደ መንደሩም እንደገባችሁ … ወዲያው
  rationale: εὐθύς የሚያመለክተውን ፈጣን ተከታታይነት ከመግባታቸው ጋር አያይዞ ያስተላልፋል።
- source_word: πῶλον
  choice: ውርንጫ
  rationale: ቃሉ ወጣት እንስሳን ያመለክታል፤ በዚህ ዐውድ ኢየሱስ የሚቀመጥበትን ወጣት እንስሳ ለመግለጽ ውርንጫ ተፈጥሯዊ ምርጫ ነው። ዝርያው በማስታወሻ ተብራርቷል።
- source_word: δεδεμένον
  choice: የታሰረ
  rationale: ፍጹም ተገብሮ አካፋይ ቅርጹ ውርንጫው ታስሮ ባለበት ሁኔታ መሆኑን ያሳያል።
- source_word: οὐδεὶς οὔπω ἀνθρώπων ἐκάθισεν
  choice: ማንም ሰው እስካሁን ያልተቀመጠበት
  rationale: ἀνθρώπων የሰውን ማጣቀሻ በግልጽ ሁኔታ ይጠብቃል፤ οὔπω ደግሞ ‘እስካሁን’ ተብሎ ተተርጉሟል።
- source_word: λύσατε αὐτὸν καὶ φέρετε
  choice: ፍቱትና አምጡት
  rationale: የታሰረውን እንስሳ መፍታትንና ወደ ተናጋሪው ማምጣትን በአጭርና ቀጥተኛ ትእዛዝ ያስተላልፋል።
