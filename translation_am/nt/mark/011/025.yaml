base_translation:
  language: en
  yaml_path: translation/nt/mark/011/025.yaml
  text: And whenever you stand praying[a], forgive, if you have anything against anyone[b], so that your Father who is in the heavens may also forgive you your trespasses.
translation:
  language: am
  text: ቆማችሁ ስትጸልዩ፣ በማንም ላይ ያላችሁ ምንም ነገር ቢኖር ይቅር በሉ፤ ይህም በሰማያት ያለው አባታችሁ[a] እንዲሁም በደሎቻችሁን[b] ይቅር እንዲላችሁ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በሰማይ ያለው አባታችሁ።” የግሪኩ ጽሑፍ “በሰማያት” በሚል የብዙ ቁጥር ቅርጽ ነው።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “መተላለፎቻችሁን” ወይም “ጥፋቶቻችሁን።”
    reason: lexical_alternative
lexical_decisions:
- source_word: στήκετε
  choice: ቆማችሁ
  rationale: የግሪኩን የመቆም አካላዊ አቋም ይጠብቃል፤ ቃሉን ‘ስትጸልዩ’ ብቻ በማለት አያለሰልሰውም።
- source_word: προσευχόμενοι
  choice: በምትጸልዩበት
  rationale: ከ‘ቆማችሁ’ ጋር በአንድ ጊዜ የሚከናወነውን ድርጊት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἀφίετε
  choice: ይቅር በሉ
  rationale: በግለሰቦች መካከል ያለን በደል የመተውና ይቅር የማለት ትርጉም በግልጽ ያስተላልፋል።
- source_word: εἴ τι ἔχετε κατά τινος
  choice: በማንም ላይ ያላችሁ አንዳች ነገር ቢኖር
  rationale: τι እና τινος ያላቸውን ሰፊና ያልተወሰነ ኃይል ይጠብቃል፤ ‘ቅሬታ’ ብሎ ከምንጩ በላይ አይገድበውም።
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: በሰማያት ያለው አባታችሁ
  rationale: οὐρανοῖς በብዙ ቁጥር መሆኑን ‘ሰማያት’ በማለት ይጠብቃል።
- source_word: ἀφῇ
  choice: ይቅር እንዲላችሁ
  rationale: ከἵνα ጋር ያለውን የዓላማ ወይም የውጤት ግንኙነት በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: παραπτώματα
  choice: በደሎቻችሁን
  rationale: የተሳሳተ እርምጃን፣ ጥፋትን ወይም መተላለፍን የሚያመለክተውን ቃል በግንኙነታዊውና በጸሎታዊው አውድ በተለመደ አማርኛ ያቀርባል።
theological_decisions:
- issue: የሰው ይቅርታና የአብ ይቅርታ ያላቸው ሁኔታዊ ግንኙነት
  choice: ‘ይቅር በሉ፤ ይህም ... ይቅር እንዲላችሁ ነው’ በማለት የጽሑፉን ቀጥተኛ ግንኙነት መጠበቅ
  alternative: የሰውን ይቅርታ የተቀበለው ይቅርታ ማስረጃ ብቻ አድርጎ መተርጎም፣ ወይም ሁኔታዊ ኃይሉን ማለስለስ
  rationale: ἵνα ... ἀφῇ ሌሎችን ይቅር በማለትና ከአብ ይቅርታ መቀበል መካከል እውነተኛ የጽሑፍ ግንኙነት ያቀርባል፤ ትርጉሙ ይህን ሥነ መለኮታዊ ውጥረት በሌላ ሥርዓት አይፈታውም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የመቆም አቋም፣ የ‘ማንም/አንዳች’ ስፋት፣ የ‘ሰማያት’ ብዙ ቁጥር እና በሁለቱ ይቅርታዎች መካከል ያለው ግንኙነት ተጠብቀዋል። የማስታወሻ ምልክቶቹ ከሚያብራሯቸው ቃላት ቀጥለው ተቀምጠዋል።
