review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the standing posture, the broad indefinite scope of “anything against anyone,” the plural “heavens,” and the stated linkage between forgiving others and the Father’s forgiveness. However, the Greek καί (“also”) in the final clause is not explicitly represented, and the opening can be made more idiomatic without losing the participial relationship.
  naturalness: “ቆማችሁ በምትጸልዩበት ጊዜ ሁሉ” is understandable but somewhat heavy in modern standard Amharic. “ቆማችሁ ስትጸልዩ” is more natural. “በማንም ላይ ያላችሁ አንዳች ነገር” is grammatical but less smooth than “በማንም ላይ ያላችሁ ምንም ነገር.”
  terminology: “ይቅር በሉ” appropriately renders interpersonal ἀφίετε, and “በደሎቻችሁ” is a suitable modern rendering of παραπτώματα. The plural “ሰማያት” is correctly retained. The alternative terms in the footnote are appropriate.
  issues:
  - severity: medium
    issue: The final καί (“also”) is not explicit in the translated main text.
    rationale: The Greek states that the Father may also forgive the readers. Adding “እንዲሁም” preserves this connective without introducing theological interpretation.
  - severity: low
    issue: The opening and the indefinite grievance expression are slightly cumbersome.
    rationale: A modest idiomatic revision improves readability while retaining the concrete posture of standing and the unrestricted force of τι / τινος.
