lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: መልሶ
  rationale: የግሪኩ አንቀጽ በንግግር ውስጥ ምላሽን ያስተዋውቃል፤ «መልሶ» ይህን የትረካ ተግባር በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: λέγει
  choice: እንዲህ አላቸው
  rationale: በግሪክ የታሪክ አሁን ጊዜ ቢጠቀምም፣ በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜ ተመራጭ ነው። «እንዲህ» የሚከተለውን ቀጥተኛ ንግግር በግልጽ ያስተዋውቃል።
- source_word: Ἔχετε
  choice: ይኑራችሁ
  rationale: የአሁን ጊዜ ትእዛዝ ቀጣይ አቋምን ሊያመለክት ይችላል፤ «ይኑራችሁ» ትእዛዙን በተፈጥሯዊና አጭር መንገድ ያቀርባል።
- source_word: πίστιν
  choice: እምነት
  rationale: በዚህ ዐውድ «እምነት» የትእዛዙ ተፈጥሯዊ ማሟያ ነው፤ «መታመን» የሚለው ትርጉም ቢቻልም፣ የስም ቅርጹን ለማቆየት «እምነት» ተመርጧል።
- source_word: θεοῦ
  choice: በእግዚአብሔር
  rationale: ከπίστιν ጋር ያለው የባለቤትነት ቅርጽ በሰዋስው አሻሚ ነው። ዐውዱ ደቀ መዛሙርቱ በእግዚአብሔር እንዲያምኑ የቀረበ ማበረታቻ መሆኑን ስለሚያመለክት፣ «በእግዚአብሔር» በዋናው ጽሑፍ ተመርጧል፤ ሌሎቹ አማራጮች በማስታወሻ ተጠብቀዋል።
