lexical_decisions:
- source_word: ἔρχονται
  choice: መጡ
  rationale: የግሪኩን ታሪካዊ የአሁን ጊዜ አገላለጽ በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜ ማቅረብ የድርጊቱን ቅደም ተከተል ግልጽ ያደርጋል።
- source_word: εἰσελθὼν
  choice: ገብቶ
  rationale: የግሪኩን ቦዝ አንቀጽ ከዋናው ድርጊት ጋር በተፈጥሯዊ አማርኛ ያገናኛል፤ ወደ መቅደሱ መግባቱ ማስወጣት ከመጀመሩ በፊት መሆኑን ያሳያል።
- source_word: τὸ ἱερὸν / ἐν τῷ ἱερῷ
  choice: ቤተ መቅደሱ / በቤተ መቅደሱ ውስጥ
  rationale: «ቤተ መቅደስ» የተለመደና ግልጽ አማርኛ ነው፤ እዚህ ቃሉ የውስጠኛውን ቅድስተ ቅዱሳን ሳይሆን ሰፊውን የቤተ መቅደስ ግቢ እንደሚያመለክት በማስታወሻ ተገልጿል።
- source_word: ἤρξατο ἐκβάλλειν
  choice: ማስወጣት ጀመረ
  rationale: የድርጊቱን መጀመር በግልጽ ይጠብቃል፤ «ማስወጣት» በዚህ አውድ የἐκβάλλωን ጠንካራ እንቅስቃሴ በተፈጥሯዊ ቋንቋ ያስተላልፋል።
- source_word: τοὺς πωλοῦντας καὶ τοὺς ἀγοράζοντας
  choice: ይሸጡና ይገዙ የነበሩትን
  rationale: ሁለቱን ተመሳሳይ ቦዝ አንቀጾች በተመጣጣኝ መዋቅር በማቅረብ ቀጣይ ንግድ ላይ የነበሩ ሰዎችን ያመለክታል።
- source_word: κολλυβιστῶν
  choice: የገንዘብ መንዛሪዎች
  rationale: ሳንቲም ወይም ምንዛሬ የሚቀይሩ ሰዎችን በዘመናዊና በሚገባ በሚታወቅ አማርኛ ይገልጻል።
- source_word: καθέδρας
  choice: ወንበሮች
  rationale: የመቀመጫ ዕቃዎቹን ከግሪኩ በላይ ሳይወስን በተለመደ አማርኛ ያቀርባል።
- source_word: περιστερὰς
  choice: ርግብ
  rationale: በመሥዋዕት አውድ የπεριστεράን ትርጉም የሚያስተላልፍ የተለመደ አማርኛ ቃል ነው።
- source_word: κατέστρεψεν
  choice: ገለበጠ
  rationale: ጠረጴዛዎቹንና ወንበሮቹን መገልበጡን በግልጽና በጠንካራ አገላለጽ ያስተላልፋል።
