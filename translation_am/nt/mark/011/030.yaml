language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τὸ βάπτισμα ⸀τὸ Ἰωάννου ἐξ οὐρανοῦ ἦν ἢ ἐξ ἀνθρώπων; ἀποκρίθητέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/030.yaml
  text: Was John's baptism from heaven or from men? Answer me[a][b].
translation:
  language: am
  text: የዮሐንስ ጥምቀት ከሰማይ[a] ነበር ወይስ ከሰዎች[b]? መልሱልኝ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ከእግዚአብሔር።» የግሪኩ ጽሑፍ «ከሰማይ» ይላል፤ ይህም መለኮታዊ ምንጭን ወይም ሥልጣንን የሚያመለክት የአይሁድ አነጋገር ነው።
    reason: lexical_alternative
  - marker: b
    text: «ከሰዎች» ማለት ከሰው ብቻ የመጣ፣ ማለትም ምንጩ ወይም ሥልጣኑ ሰብዓዊ የሆነ ማለት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ βάπτισμα τὸ Ἰωάννου
  choice: የዮሐንስ ጥምቀት
  rationale: የግሪኩን የባለቤትነት አገባብ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ይህም ከዮሐንስ ጋር የተያያዘውን ጥምቀት ያመለክታል።
- source_word: ἐξ οὐρανοῦ
  choice: ከሰማይ
  rationale: የምንጩን አገላለጽ በቀጥታ ይጠብቃል፤ በዚህ የአይሁድ አነጋገር መለኮታዊ ምንጭ ወይም ሥልጣን ይጠቁማል።
- source_word: ἐξ ἀνθρώπων
  choice: ከሰዎች
  rationale: ἀνθρώπων በዚህ ስፍራ ሰዎችን በአጠቃላይ ያመለክታል፤ «ከሰማይ» ከሚለው ጋር ያለውን የምንጭና የሥልጣን ንፅፅር በግልጽ ያቆያል።
- source_word: ἀποκρίθητέ μοι
  choice: መልሱልኝ
  rationale: የብዙ ቁጥር ቀጥተኛ ትእዛዙንና «ለእኔ» የሚለውን አቅጣጫ በተፈጥሯዊና ጠንካራ አማርኛ ያስተላልፋል።
- source_word: ἦν ἢ
  choice: ነበር ወይስ
  rationale: የግሪኩን የመሆን ግስና የሁለት አማራጭ ጥያቄ ቅርጽ በቅርብ ይከተላል።
theological_decisions:
- issue: «ከሰማይ» የሚለው በኢየሱስ ጥያቄ ውስጥ ያለው ትርጉም
  choice: «ከሰማይ» የሚለውን ፈሊጣዊ አገላለጽ በዋናው ጽሑፍ ማቆየት
  alternative: «ከእግዚአብሔር» ብሎ በግልጽ መተርጎም
  rationale: አገላለጹ መለኮታዊ ምንጭን ወይም ሥልጣንን የሚጠቁም የአይሁድ አነጋገር ቢሆንም፣ በግልጽ «እግዚአብሔር» ብሎ መተካት የምንጩን እውነተኛ አገላለጽ ይተረጉማል። ቀጥተኛውን ምስል ማቆየት የጥያቄውን ሥነ ንግግራዊ ኃይልና አሻሚነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «መልሱልኝ» ለብዙ ሰዎች የተሰጠውን ቀጥተኛ ትእዛዝ ይጠብቃል፤ «ከሰማይ … ከሰዎች» የሚለውም የምንጩን ተቃርኖ ያቆያል።
