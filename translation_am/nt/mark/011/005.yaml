  choice: አንዳንዶቹ
  rationale: ያልተወሰነ የሰዎች ክፍልን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: τῶν ἐκεῖ ἑστηκότων
  choice: በዚያም ቆመው ከነበሩት
  rationale: የἵστημι ፍጹም አንቀጽን እና ἐκεῖን ጠብቆ፣ ሰዎቹ በዚያ ቆመው የነበሩ መሆናቸውን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἔλεγον αὐτοῖς
