- source_word: λύοντες
  choice: እየፈታችሁ
  rationale: የታሰረውን እንስሳ መፍታትን በግልጽ ይገልጣል፤ የአሁን አንቀጽ ቀጣይነትንም በ‘እየ-’ ይይዛል።
- source_word: τὸν πῶλον
  choice: ውርንጫውን
  rationale: πῶλος በመሠረቱ ወጣት እንስሳን የሚያመለክት በመሆኑ፣ ‘ውርንጫ’ የማርቆስን በአንጻራዊነት አጠቃላይ ቃል ከ‘የአህያ ውርንጫ’ ይልቅ በቅርብ ይጠብቃል።
