  text: በዚያ ቆመው ከነበሩት አንዳንዶቹ፣ “ውርንጫውን[a] እየፈታችሁ ምን ታደርጋላችሁ?” እንዲህ እያሉ ይሏቸው ነበር።
  philosophy: optimal-equivalence
  footnotes:
