base_translation:
  language: en
  yaml_path: translation/nt/mark/011/007.yaml
  text: And they brought the colt to Jesus, and they threw their cloaks on it, and he sat on it.
translation:
  language: am
  text: ውርንጫውንም ወደ ኢየሱስ አመጡ፤ ልብሳቸውንም በላዩ ላይ ጣሉ፤ እርሱም በላዩ ተቀመጠ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πῶλον
  choice: ውርንጫውን
  rationale: ቃሉ የወጣት እንስሳን ያመለክታል፤ በአውዱ ከቀደሙት ቁጥሮች ጋር ሲነበብ የአህያ ውርንጫ መሆኑ ግልጽ ነው።
- source_word: ἱμάτια
  choice: ልብሳቸውን
  rationale: ውጫዊ ልብሶችን የሚጠቁመውን የግሪክ ቃል በተፈጥሯዊና ሰፊ የአማርኛ ቃል ይገልጻል።
- source_word: ἐπιβάλλουσιν
  choice: ጣሉ
  rationale: በውርንጫው ላይ ልብሶቹን የማኖር/የመጣል ድርጊት በቀጥተኛና ተፈጥሯዊ አማርኛ ተገልጿል።
- source_word: ἐκάθισεν ἐπ’ αὐτόν
  choice: በላዩ ተቀመጠ
  rationale: የምንጩን ቀጥተኛ አገላለጽ ይጠብቃል፤ በአውዱ ኢየሱስ ውርንጫው ላይ መቀመጡ ግልጽ ነው።
