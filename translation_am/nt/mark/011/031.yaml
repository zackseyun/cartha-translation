id: MRK.11.31
reference: Mark 11:31
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ⸀διελογίζοντο πρὸς ἑαυτοὺς λέγοντες· ⸂Τί εἴπωμεν;⸃ ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ· Διὰ τί ⸀οὖν οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/031.yaml
  text: And they were reasoning among themselves[a], saying, “What should we say? If we say, ‘From heaven,’ he will say, ‘Why then did you not believe him?’”
translation:
  language: am
  text: እርስ በርሳቸው እየተመካከሩ፣ “ምን እንበል? ‘ከሰማይ[a] ነው’ ብንል፣ ‘ታዲያ ለምን አላመናችሁትም?’ ይለናል” አሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ከሰማይ” የሚለው “ከእግዚአብሔር” ወይም “መለኮታዊ ምንጭ ያለው” ማለት የሆነ የአይሁድ አክብሮታዊ አገላለጽ ነው።
    reason: cultural_note
lexical_decisions:
- source_word: διελογίζοντο
  choice: እየተወያዩ
  rationale: ያልተጠናቀቀውን የቡድን ውስጥ ምክክር ያሳያል፤ የግሪኩን ኢምፐርፌክት ገጽታ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: πρὸς ἑαυτοὺς
  choice: እርስ በርሳቸው
  rationale: የግል ውስጣዊ ሐሳብን ሳይሆን በቡድኑ መካከል የተደረገ የጋራ ምክክርን ያመለክታል።
- source_word: Τί εἴπωμεν;
  choice: ምን እንበል?
  rationale: የውሳኔ ጥያቄውን በአጭር፣ ተፈጥሯዊና ዘመናዊ አማርኛ ያቀርባል።
- source_word: Ἐξ οὐρανοῦ
  choice: ከሰማይ ነው
  rationale: ቃል በቃል የሆነውን የአይሁድ አክብሮታዊ አገላለጽ ይጠብቃል፤ ‘ከእግዚአብሔር’ ብሎ ትርጓሜውን በዋናው ጽሑፍ ውስጥ አያስገባም።
- source_word: ἐρεῖ
  choice: ይለናል
  rationale: በአውዱ የሚጠበቀውን የኢየሱስ ምላሽ በተፈጥሯዊ አማርኛ ይገልጻል፤ የተዘዋዋሪው ተቀባይ ‘እኛን’ ከንግግሩ ግልጽ ስለሆነ በግሱ ተካትቷል።
- source_word: Διὰ τί οὖν
  choice: ታዲያ ለምን
  rationale: οὖν የሚያሳየውን ከቀደመው መልስ የሚነሳ ምክንያታዊ ግንኙነት በተለመደ አማርኛ ይጠብቃል።
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: አላመናችሁትም
  rationale: የዮሐንስን ምስክርነት እውነት አድርጎ አለመቀበልን ያሳያል፤ ‘በእርሱ አላመናችሁም’ ከሚለው የተለየ የግሪክ አገባብን ይጠብቃል።
theological_decisions:
- issue: ‘ከሰማይ’ የሚለው አገላለጽ ስለ ዮሐንስ ጥምቀትና ሥልጣን ያለው ትርጉም
  choice: በዋናው ጽሑፍ ‘ከሰማይ ነው’ የሚለውን አገላለጽ ማቆየት
  alternative: ‘ከእግዚአብሔር ነው’ ብሎ መተርጎም
  rationale: ይህ መለኮታዊ ምንጭን ወይም ፈቃድን የሚያመለክት የአይሁድ አክብሮታዊ አገላለጽ ነው። የምንጩን ቃል ማቆየት የትረካውን አነጋገር ሳያሳጥር ትርጉሙን በማስታወሻ ለማብራራት ያስችላል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የቡድን ምክክሩ ቀጣይነት ‘እየተወያዩ’ በሚለው ተጠብቋል።
