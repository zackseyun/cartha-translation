  text: καὶ ⸀ἔλεγον αὐτῷ· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; ⸀ἢ τίς σοι ⸂ἔδωκεν τὴν ἐξουσίαν ταύτην⸃ ἵνα ταῦτα ποιῇς;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/028.yaml
  text: And they were saying to him[b][a], “By what authority are you doing these things? Or who gave you this authority to do these things?”
translation:
  language: am
  text: እንዲህ እያሉት ነበር፦ “እነዚህን ነገሮች በምን ሥልጣን[a] ታደርጋለህ? ወይስ እነዚህን እንድታደርግ[b] ይህን ሥልጣን የሰጠህ ማን ነው?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይበልጥ ቃል በቃል፣ “በምን ዓይነት ሥልጣን?”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “እነዚህን ታደርግ ዘንድ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: ይሉት ነበር
  rationale: ያልተፈጸመው የግስ ጊዜ የንግግሩን ቀጣይነት ወይም ድግግሞሽ ስለሚያመለክት፣ ቀላል ያለፈ ጊዜ ከሆነው ‘አሉት’ ይልቅ ‘ይሉት ነበር’ የግሱን ገጽታ ይጠብቃል።
- source_word: Ἐν ποίᾳ ἐξουσίᾳ
  choice: በምን ሥልጣን
  rationale: ἐν ከወራጅ ቅጽ ጋር በዚህ አገባብ ድርጊቱ በምን ሕጋዊ መሠረት ወይም ፈቃድ እንደሚፈጸም ይጠይቃል፤ ‘በምን ሥልጣን’ ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐξουσίᾳ / ἐξουσίαν
  choice: ሥልጣን
  rationale: ቃሉ የተሰጠ መብትን፣ ፈቃድን ወይም የማዘዝ ሥልጣንን ሊያመለክት ይችላል፤ በቤተ መቅደሱ አውድ የኢየሱስን የመሥራት ብቃትና ሕጋዊነት ለሚገዳደር ጥያቄ ‘ሥልጣን’ ተስማሚ ነው።
- source_word: ταῦτα ποιεῖς / ταῦτα ποιῇς
  choice: እነዚህን ነገሮች ታደርጋለህ / እነዚህን እንድታደርግ
  rationale: የብዙ ቁጥር አመልካቹ ταῦτα የኢየሱስን ቅርብ ጊዜ ድርጊቶችና ትምህርት በስፋት ስለሚመለከት ‘እነዚህን ነገሮች’ ተብሎ ተጠብቋል።
- source_word: ἢ
  choice: ወይስ
  rationale: ሁለተኛውን በቅርብ የተያያዘ አማራጭ ጥያቄ ስለሚያስገባ፣ በቀጥታ ጥያቄ ውስጥ ‘ወይስ’ ተፈጥሯዊ ነው።
- source_word: τίς σοι ἔδωκεν
  choice: የሰጠህ ማን ነው
  rationale: የአንድ ጊዜ ያለፈ ድርጊት የሚያመለክተው ἔδωκεν በአማርኛ በዘመድ ሐረግና በጥያቄ አገባብ ተፈጥሯዊ ሆኖ ተተርጉሟል።
- source_word: ἵνα ταῦτα ποιῇς
  choice: እነዚህን እንድታደርግ
  rationale: ἵνα ከንዑስ አንቀጽ ጋር ዓላማን ወይም የታሰበ ውጤትን ሊገልጽ ይችላል፤ ‘እንድታደርግ’ ከ‘ሥልጣን ሰጠህ’ ጋር በተፈጥሯዊ አማርኛ ይያያዛል።
theological_decisions:
- issue: የኢየሱስ ሥልጣን ምንጭ
  choice: የመሪዎቹ ንግግር የኢየሱስን ሥልጣን የሚገዳደር ገለልተኛ ጥያቄ ሆኖ ተተርጉሟል።
  alternative: ከአውዱ ተነሥቶ ‘ከእግዚአብሔር በተሰጠህ ሥልጣን’ የሚል ግልጽ ፍቺ መጨመር።
  rationale: ቁጥሩ የተቃዋሚዎቹን ጥያቄ ብቻ እንጂ የተራኪውን መልስ አይሰጥም፤ ስለዚህ የሥልጣኑ ምንጭ በትርጉሙ ውስጥ አልተወሰነም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለመደበኛ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። ‘ይሉት ነበር’ የግሪክኛውን ያልተፈጸመ ገጽታ ሲጠብቅ፣ ‘በምን ሥልጣን’ ደግሞ የቃል በቃል አገባቡን ሳያከብድ የጥያቄውን ኃይል ያስተላልፋል።
