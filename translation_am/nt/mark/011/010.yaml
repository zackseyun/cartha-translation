base_translation:
  language: en
  yaml_path: translation/nt/mark/011/010.yaml
  text: Blessed is the coming kingdom of our father David! Hosanna in the highest![a]
translation:
  language: am
  text: የአባታችን የዳዊት የሚመጣው መንግሥት የተባረከ ነው! ሆሳዕና በአርያም![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ሆሳዕና” የሚለው “እባክህ አድን” ወይም “አሁን አድን” የሚል ልመናን ሊያንጸባርቅ ይችላል፤ እዚህ ግን እንደ የአምልኮ ምስጋና እልልታ ያገለግላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογημένη
  choice: የተባረከ ይሁን
  rationale: የሕዝቡን የምስጋና አዋጅ በተፈጥሯዊና በክብር ያቀርባል፤ ‘የተመሰገነ’ ከሚለውም ይልቅ የበረከት አገላለጹን ይጠብቃል።
- source_word: ἡ ἐρχομένη βασιλεία
  choice: የሚመጣው መንግሥት
  rationale: የአሁን ጊዜ አሳታፊውን የመምጣት ኃይል ይጠብቃል፤ ከግሪኩ በላይ የተወሰነ የፍጻሜ ዘመን ፍቺ አይጨምርም።
- source_word: βασιλεία
  choice: መንግሥት
  rationale: በዳዊታዊው የንግሥና አውድ ውስጥ ተፈጥሯዊ ሲሆን ንጉሣዊ ግዛትንና አገዛዝን አብሮ ሊያመለክት ይችላል።
- source_word: τοῦ πατρὸς ἡμῶν Δαυίδ
  choice: የአባታችን የዳዊት
  rationale: ዳዊትን እንደ ክቡር ቅድመ አባት የሚጠራውን አገላለጽ ይጠብቃል፣ ሐረጉም ‘መንግሥት’ን እንዲወስን ያደርጋል።
- source_word: Ὡσαννὰ
  choice: ሆሳዕና
  rationale: በአዲስ ኪዳን አጠቃቀም የተለመደ የአምልኮ እልልታ ስለሆነ በድምፅ ቅርብ መልኩ ተጠብቋል፤ መሠረታዊ የማዳን ልመና ትርጉሙ በማስታወሻ ተገልጿል።
- source_word: ἐν τοῖς ὑψίστοις
  choice: በአርያም
  rationale: ከፍተኛውን ሰማያዊ ስፍራ የሚያመለክተውን ፈሊጣዊ አገላለጽ በአማርኛ የታወቀና አጭር ቃል ያቀርባል።
theological_decisions:
- issue: የዳዊት መንግሥት አዋጅ ምንነት
  choice: የሚመጣውን መንግሥት በቀጥታ ከዳዊት ጋር ማያያዝ
  alternative: ‘የሚመጣው መሲሐዊ መንግሥት’ ብሎ በግልጽ መተርጎም
  rationale: አውዱ መሲሐዊ ተስፋን በጽኑ ቢያመለክትም የግሪኩ ጽሑፍ ‘መሲሐዊ’ የሚለውን ቃል አያክልም፤ ስለዚህ ጥቅሱ ያለው ሥነ መለኮታዊ ውጥረት ሳይፈታ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ሆሳዕና’ እና ‘በአርያም’ የተለመደውን የቅዱስ ጽሑፍና የአምልኮ አገላለጽ ይጠብቃሉ።
