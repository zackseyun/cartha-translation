base_translation:
  language: en
  yaml_path: translation/nt/mark/011/018.yaml
  text: And the chief priests and the scribes heard it[a], and they were seeking how they might destroy him, for they feared him, because the whole crowd was astonished at his teaching.
translation:
  language: am
  text: የካህናት አለቆችና ጸሐፍትም ይህን ሰሙ፤ እንዴት ሊያጠፉት እንደሚችሉም ይፈልጉ ነበር።[a] እርሱን ይፈሩ ነበርና፤ ሕዝቡ በሙሉ በትምህርቱ ይደነቅ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሊገድሉት” ወይም “ለሞት ሊዳርጉት።” የግሪኩ ግስ በሰፊው “ማጥፋት” ማለት ሊሆን ቢችልም፣ ዐውደ ንባቡ የመግደል ዓላማን ይጠቁማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: ይህን ሰሙ
  rationale: ግሱ ‘ሰሙ’ ወይም ‘ወሬውን ሰሙ’ ሊል ይችላል። በአማርኛ ንግግሩ ተፈጥሯዊ እንዲሆን ‘ይህን’ ተጨምሯል፤ ይህም በቤተ መቅደሱ የተደረገውንና የተነገረውን የቀደመ ክስተት ያመለክታል።
- source_word: ἀρχιερεῖς
  choice: የካህናት አለቆች
  rationale: ቃሉ በኢየሩሳሌም ያሉትን የካህናት መሪዎች በቡድን ያመለክታል፤ ‘ሊቀ ካህናት’ በብዙ ቁጥር ቢቀርብ ብዙ የበላይ ሊቃነ ካህናት እንዳሉ ሊያሳስት ይችላል።
- source_word: γραμματεῖς
  choice: ጸሐፍት
  rationale: በወንጌላት ውስጥ ያሉትን የአይሁድ የሕግ ሊቃውንት የሚያመለክተውን የተለመደ መጽሐፍ ቅዱሳዊ ቃል ይጠብቃል።
- source_word: ἐζήτουν
  choice: ይፈልጉ ነበር
  rationale: የግሪኩ ያልተፈጸመ የኃላፊ ጊዜ ቅርጽ ቀጣይ ፍለጋን ወይም ሙከራን ያሳያል፤ የአማርኛው ‘ይፈልጉ ነበር’ ይህን ይጠብቃል።
- source_word: πῶς αὐτὸν ἀπολέσωσιν
  choice: እንዴት እርሱን ሊያጠፉት እንደሚችሉ
  rationale: ‘እንዴት’ የእርምጃውን መንገድ ያሳያል፤ ‘ሊያጠፉት’ የἀπόλλυμιን ሰፊ የ‘ማጥፋት’ ትርጉም ይጠብቃል፣ ዐውደ ንባቡ ግን የመግደል ዓላማን እንደሚጠቁም በማስታወሻ ተገልጧል።
- source_word: ἐφοβοῦντο
  choice: ይፈሩት ነበር
  rationale: ቀጣይ የፍርሃት ሁኔታን የሚገልጠውን የግሪኩን ቅርጽ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: πᾶς ὁ ὄχλος
  choice: ሕዝቡ ሁሉ
  rationale: የሕዝቡን አጠቃላይና አጽንዖት ያለው ምላሽ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐξεπλήσσετο ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: በትምህርቱ ይደነቅ ነበር
  rationale: ‘ይደነቅ ነበር’ ቀጣይ የመደነቅ ሁኔታን ይጠብቃል፤ ‘በትምህርቱ’ ደግሞ የመደነቁን መሠረት ወይም ምክንያት ያመለክታል።
