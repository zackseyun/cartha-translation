  yaml_path: translation/nt/mark/011/012.yaml
  text: And on the next day, when they had gone out from Bethany, he was hungry.
translation:
  language: am
  text: በማግስቱም ከቢታንያ በወጡ ጊዜ፣ እርሱ ተራበ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: -ም
  rationale: የግሪኩ Καὶ የትረካ ቅጥያ ኃይል በአማርኛ በተፈጥሮአዊው አያያዥ ቅጥያ «-ም» ተጠብቋል።
- source_word: τῇ ἐπαύριον
  choice: በማግስቱ
  rationale: የሚቀጥለውን ቀን በተፈጥሮአዊና በዘመናዊ አማርኛ ይገልጣል።
- source_word: ἐξελθόντων αὐτῶν
  choice: በወጡ ጊዜ
  rationale: የዘር ፍጹም አገባቡን እንደ ጊዜ ንዑስ ሐረግ በመተርጎም ብዙ ቁጥሩን እና ከዋናው ግስ ጋር ያለውን ጊዜያዊ ግንኙነት ጠብቋል።
- source_word: ἀπὸ Βηθανίας
  choice: ከቢታንያ
  rationale: ἀπό ከቦታ መነሳትን ያመለክታል፤ Βηθανία ደግሞ እንደ ቦታ ስም «ቢታንያ» ተጽፏል።
- source_word: ἐπείνασεν
  choice: ተራበ
  rationale: የረሃብን ሁኔታ ወይም መጀመር በአማርኛ ተፈጥሮአዊ በሆነ አጭር ያለፈ ጊዜ ግስ ይገልጣል።
theological_decisions:
- issue: የἐπείνασεν ያልተገለጸ ባለቤት
  choice: «እርሱ» በማለት ኢየሱስን በተውላጠ ስም ማመልከት
  alternative: ለግልጽነት «ኢየሱስ» የሚለውን ስም መጨመር
  rationale: በግሪኩ የግሱ ባለቤት በስም አልተጠቀሰም፣ ከአውዱ ግን ኢየሱስ መሆኑ ግልጽ ነው። «እርሱ» የምንጩን አጭርነት ይጠብቃል፤ ረሃቡንም ያለ ትምህርታዊ ማስፋፊያ በቀጥታ ይገልጣል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የማርቆስ ትረካዊ አያያዝ በ«-ም» ተጠብቋል፤ የግሪኩ ብዙ ቁጥር «በወጡ» እና የዋናው ግስ ነጠላ ባለቤት «እርሱ» ተለይተው ቀርበዋል።
