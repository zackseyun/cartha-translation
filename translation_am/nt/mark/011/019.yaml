- source_word: ὀψὲ ἐγένετο
  choice: ማታ በሆነ
  rationale: ‘ማታ ሆነ’ የሚለውን ጊዜያዊ ፍቺ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐξεπορεύοντο
  choice: ይወጡ ነበር
  rationale: የግሱን ተደጋጋሚ ወይም ልማዳዊ ያለፈ ድርጊት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἔξω τῆς πόλεως
  choice: ከከተማይቱ
  rationale: የመውጣትን እንቅስቃሴና ከከተማው ውስጥ ወደ ውጭ መሄድን በአጭሩ ያሳያል።
- source_word: πόλεως
  choice: ከተማይቱ
  rationale: ግሪክኛው ኢየሩሳሌምን በስም ሳይጠቅስ ‘ከተማይቱ’ ስለሚል፣ የምንጩን አገላለጽ ይጠብቃል።
