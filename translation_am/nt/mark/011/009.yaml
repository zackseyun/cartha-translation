  text: ከፊት የሚሄዱትም ከኋላ የሚከተሉትም እንዲህ ብለው ይጮኹ ነበር፦ “ሆሳዕና![a] በጌታ ስም የሚመጣው የተባረከ ነው!”[b]
  philosophy: optimal-equivalence
