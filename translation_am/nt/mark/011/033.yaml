id: MRK.11.33
reference: Mark 11:33
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἀποκριθέντες ⸂τῷ Ἰησοῦ λέγουσιν⸃· Οὐκ οἴδαμεν. καὶ ὁ ⸀Ἰησοῦς λέγει αὐτοῖς· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/033.yaml
  text: And answering Jesus[a], they say, “We do not know.” And Jesus says to them, “Neither do I tell you by what authority I do these things.”
translation:
  language: am
  text: እነርሱም ለኢየሱስ መልሰው፣ “አናውቅም” አሉ። ኢየሱስም፣ “እኔም እነዚህን ነገሮች በምን ሥልጣን እንደማደርግ አልነግራችሁም” አላቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: ብለው መለሱለት
  rationale: የግሪኩ አሳታፊ ግስ የመልስ አሰጣጥን ያስተዋውቃል፤ በአማርኛ የቀጥታ ንግግሩን ተከትሎ ይህ አገላለጽ ተፈጥሯዊና ታማኝ ነው።
- source_word: λέγουσιν / λέγει / λέγω
  choice: መለሱለት / አላቸው / አልነግራችሁም
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ ቅርጽ በተፈጥሯዊ የአማርኛ ትረካ በአለፈ ጊዜ ተተርጉሟል፤ በመጨረሻው ሐረግ ደግሞ λέγω ከተዘዋዋሪ ጥያቄ ጋር “አልነግራችሁም” ተብሎ ተፈጥሯዊ ሆኗል።
- source_word: Οὐκ οἴδαμεν
  choice: አናውቅም
  rationale: የአሁን ጊዜ ትርጉም ያለውን ግልጽ አሉታዊ መልስ በቀጥታ ያስተላልፋል።
- source_word: Οὐδὲ ἐγὼ
  choice: እኔም ቢሆን … አልነግራችሁም
  rationale: ለእነርሱ አሉታዊ መልስ የተመጣጠነውን የኢየሱስን አሉታዊ ምላሽ ያሳያል።
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: በምን ሥልጣን
  rationale: የድርጊቶቹን ሥልጣናዊ መሠረት ወይም ፈቃድ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ταῦτα
  choice: እነዚህን ነገሮች
  rationale: የግሪኩን ገለልተኛ ብዙ ቁጥር ጠብቆ ቀደም ሲል የተጠቀሱትን የኢየሱስ ድርጊቶች ያመለክታል።
- source_word: ποιῶ
  choice: እንደማደርግ
  rationale: በተዘዋዋሪው ጥያቄ ውስጥ የግሪኩን የአሁን ጊዜ ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
