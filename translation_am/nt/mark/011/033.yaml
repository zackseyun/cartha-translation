translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ታሪካዊ የአሁን ጊዜ በአማርኛ ተፈጥሯዊ የትረካ አለፈ ጊዜ ቀርቧል። በቀረበው የእንግሊዝኛ ንባብ ላይ ያለው [a] ከግሪኩ የዚህ ቁጥር አወቃቀር ጋር የማይዛመድ ስለሚመስል በአማርኛው ረቂቅ ውስጥ አልገባም፤ ἐν ποίᾳ ἐξουσίᾳ በቀጥታ “በምን ሥልጣን” ተብሏል።
