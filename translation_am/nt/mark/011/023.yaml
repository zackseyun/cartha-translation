  rationale: τόυτῳ ያለውን ቀጥተኛና ሕያው ጠቋሚነት ይጠብቃል።
- source_word: Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν
  choice: ተነሥተህ ወደ ባሕር ተጣል
  rationale: ሁለቱን ተከታታይ ትእዛዛትና ተራራው ከቦታው ተነሥቶ ወደ ባሕር የመጣሉን ግልጽ ምስል በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: μὴ διακριθῇ ἐν τῇ καρδίᾳ αὐτοῦ
  choice: በልቡም ሳይጠራጠር
