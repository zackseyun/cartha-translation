base_translation:
  language: en
  yaml_path: translation/nt/mark/011/023.yaml
  text: Truly I tell you[a], whoever says to this mountain, ‘Be lifted up and be thrown into the sea,’ and does not doubt in his heart but believes that what he says is happening[b], it will be so for him.
translation:
  language: am
  text: እውነት እላችኋለሁ፤ ማንም ይህን ተራራ፣ “ተነሣ ወደ ባሕርም ተጣል” ቢለው፣ በልቡም ሳይጠራጠር[a]፣ ነገር ግን የሚናገረው እየሆነ መሆኑን[b] ቢያምን፣ ይሆንለታል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ሳያወላውል” ወይም “በውስጡ ሳይከፋፈል።” የግሪኩ ግስ ጥርጣሬን ብቻ ሳይሆን በውስጥ የመከፋፈልን ሐሳብም ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም “የሚናገረው እንደሚሆን” ወይም “እንደሚፈጸም።” ግሪኩ ከወደፊቱ የውጤት ሐረግ በፊት የአሁን ጊዜ ግስ ይጠቀማል።
    reason: lexical_alternative
