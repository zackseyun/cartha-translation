- source_word: ὅτι ὃ λαλεῖ γίνεται
  choice: የሚናገረው እየሆነ እንዳለ
  rationale: γίνεται የተጠቀመበትን የአሁን ጊዜ መልክ ወደ ወደፊት ጊዜ ሳይቀይር በአማርኛ ቀጣይ አገላለጽ ያቀርባል።
