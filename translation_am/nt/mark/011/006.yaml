  rationale: በዐውዱ ወደ ደቀ መዛሙርቱ ይመለሳል፤ δέ የትረካውን ፍሰት በተፈጥሯዊው «-ም» ያገናኛል።
- source_word: εἶπαν αὐτοῖς
