  rationale: ἀφίημι መፍቀድ፣ መልቀቅ ወይም እንዲሄድ መተው ሊል ይችላል፤ በዚህ ዐውድ ቆመው እንዳያግዷቸውና ውርንጭላውን ይዘው እንዲሄዱ መፍቀዳቸውን ያመለክታል።
