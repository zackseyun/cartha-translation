base_translation:
  language: en
  yaml_path: translation/nt/mark/011/011.yaml
  text: And he entered Jerusalem[a], into the temple courts; and after looking around at everything, since it was already late[c][b], he went out to Bethany with the twelve.
translation:
  language: am
  text: እርሱም ወደ ኢየሩሳሌም፣ ወደ ቤተ መቅደሱ ግቢ[a] ገባ። በዙሪያው ያለውን ሁሉ ከተመለከተ በኋላ፣ ጊዜው አስቀድሞ አርፍዶ ስለነበር[b]፣ ከአሥራ ሁለቱ[c] ጋር ወደ ቢታንያ ወጣ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “የቤተ መቅደሱ አካባቢ” ወይም በአጭሩ “ቤተ መቅደሱ።” የግሪኩ ቃል የውስጠኛውን መቅደስ ብቻ ሳይሆን ሰፊውን የቤተ መቅደስ ስፍራ ያመለክታል።
    reason: lexical_alternative
  - marker: b
