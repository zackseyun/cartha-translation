  text: ἀλλὰ εἴπωμεν· Ἐξ ἀνθρώπων;— ἐφοβοῦντο τὸν ⸀ὄχλον, ἅπαντες γὰρ εἶχον τὸν Ἰωάννην ⸂ὄντως ὅτι⸃ προφήτης ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/032.yaml
  text: But if we say[a], ‘From men’?”—they were afraid of the crowd[b], for everyone held that John truly was a prophet.
translation:
  language: am
  text: ነገር ግን፣ «ከሰዎች ነው[a] ብንልስ?»—ሕዝቡን ፈሩ፤ ሁሉም ዮሐንስ በእውነት ነቢይ እንደነበረ ያምኑ ነበርና።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ሰዋዊ ምንጭ ነው»።
    reason: lexical_alternative
  - marker: b
    text: የግሪኩ አገላለጽ፣ «ሁሉም ዮሐንስን በእርግጥ ነቢይ አድርገው ይቆጥሩት ነበር» ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ εἴπωμεν· Ἐξ ἀνθρώπων;
  choice: «ከሰዎች ነው ብንልስ?»
  rationale: የ«ከሰዎች» ቃል የዮሐንስ ጥምቀት ምንጭ ሰዋዊ ነው የሚለውን አማራጭ ይገልጣል፤ «ብንልስ?» ደግሞ ἀλλά የሚያሳየውን ተቃራኒ አማራጭና εἴπωμεν ያለውን የምክክር ንዑስ ጥያቄ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐφοβοῦντο τὸν ὄχλον
  choice: ሕዝቡን ፈሩ
  rationale: ἐφοβοῦντο በዚህ አውድ ፍርሃታቸውን ይገልጣል፤ ὄχλος ደግሞ በቦታው የተሰበሰበውን ሕዝብ ያመለክታል።
- source_word: ἅπαντες γὰρ εἶχον
  choice: ሁሉም ... ያምኑ ነበርና
  rationale: εἶχον እዚህ ላይ ስለአንድ ሰው የተያዘን አመለካከት ያሳያል። «ያምኑ ነበር» ይህን ትርጉምና የኢምፐርፌክት ቀጣይ ሁኔታ በተፈጥሯዊ አማርኛ ይገልጣል፤ -ናም የγὰρን ምክንያታዊ ግንኙነት ያስቀምጣል።
- source_word: ὄντως ὅτι προφήτης ἦν
  choice: በእውነት ነቢይ እንደነበረ
  rationale: «በእውነት» የὄντωςን አጽንዖት ይጠብቃል፤ የ«እንደነበረ» ግንባታም ይህ የሕዝቡ እምነት መሆኑን ግልጽ ያደርጋል።
theological_decisions:
- issue: Ἐξ ἀνθρώπων የሚለው የዮሐንስ ጥምቀት ምንጭን እንዴት እንደሚገልጥ
  choice: ከሰዎች ነው
  alternative: ሰዋዊ ምንጭ ነው
  rationale: ዋናው ትርጉም የግሪኩን የምንጭ አገላለጽ በቅርብ ይከተላል፤ «ሰዋዊ ምንጭ ነው» ትርጉሙን የሚያብራራ ቢሆንም የበለጠ ትርጓሜያዊ ነው።
- issue: ὄντως ὅτι προφήτης ἦν የሚለው የሕዝቡን አመለካከት ወይስ የተራኪውን ቀጥተኛ ማረጋገጫ እንደሚያቀርብ
  choice: ሁሉም ዮሐንስ በእውነት ነቢይ እንደነበረ ያምኑ ነበር
  alternative: ሁሉም ዮሐንስን በእርግጥ ነቢይ አድርገው ይቆጥሩት ነበር
  rationale: የተመረጠው አገላለጽ የὄντωςን አጽንዖት ሳያጠፋ ንግግሩን በሕዝቡ እምነት ውስጥ ያቆየዋል፤ ስለዚህ በዚህ ሐረግ ብቻ ከተራኪው የቀረበ አዲስ የነገረ መለኮት ማረጋገጫ አያክልም።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ሕዝቡን ፈሩ» አጭርና ተፈጥሯዊ ሲሆን፣ «ያምኑ ነበርና» ምክንያቱንና የቆየውን የሕዝብ አመለካከት ያሳያል።
