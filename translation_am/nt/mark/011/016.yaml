  text: And he would not allow anyone to carry a vessel through the temple courts[a][b].
translation:
  language: am
  text: ማንም ሰው በቤተ መቅደሱ ግቢ[a] ዕቃ[b] ይዞ እንዲያልፍ አይፈቅድም ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በቤተ መቅደሱ አካባቢ»። የግሪኩ ቃል የውስጠኛውን መቅደስ ብቻ ሳይሆን ሰፊውን የቤተ መቅደስ ግቢ ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «መያዣ» ወይም «መሣሪያ»። የግሪኩ ቃል ሰፊ ትርጉም ያለው ሲሆን የዕቃውን ዓይነት አይወስንም።
