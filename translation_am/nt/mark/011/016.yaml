  rationale: የግሱን ያልተፈጸመ ያለፈ ጊዜ ቅርጽና በዚያ ወቅት የቀጠለውን መከልከል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἵνα τις διενέγκῃ
  choice: ማንም ሰው … ይዞ እንዲያልፍ
  rationale: ከፈቃድ ግስ ጋር ያለውን ἵνα እና የተዘዋዋሪውን ድርጊት በአማርኛ ተፈጥሯዊ በሆነ ጥገኛ ሐረግ ይገልጻል።
- source_word: διενέγκῃ
  choice: ይዞ እንዲያልፍ
  rationale: ዕቃን በአንድ ስፍራ ውስጥ አሳልፎ የመውሰድን አቅጣጫዊ ሐሳብ በግልጽና በተለመደ አማርኛ ያስተላልፋል።
- source_word: σκεῦος
  choice: ዕቃ
  rationale: የግሪኩ ቃል ዕቃን፣ መሣሪያን ወይም መያዣን ሊያመለክት ስለሚችል፣ «ዕቃ» ሳያጠብ ሰፊ ትርጉሙን ይጠብቃል።
- source_word: διὰ τοῦ ἱεροῦ
  choice: በቤተ መቅደሱ ግቢ
  rationale: ἱερόν የውስጠኛውን መቅደስ ብቻ ሳይሆን ሰፊውን የቤተ መቅደስ ግቢና አካባቢ ያመለክታል፤ «ግቢ» ይህን ልዩነት ለዘመናዊ አንባቢ ግልጽ ያደርጋል።
theological_decisions:
- issue: ἱερόν ከኢየሩሳሌም ቤተ መቅደስ ጋር ያለው ትርጉም
  choice: ሰፊው የቤተ መቅደስ ግቢ
  alternative: ቤተ መቅደሱ፤ የቤተ መቅደሱ አካባቢ
  rationale: ጽሑፉ ኢየሱስ በውስጠኛው መቅደስ ሳይሆን በሰፊው የቤተ መቅደስ ክልል ውስጥ መተላለፍን እንደከለከለ ያመለክታል፤ ይህ አተረጓጎም በግሪክ ቃሉ ያለውን ልዩነት ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛን ይጠቀማል። «ይዞ እንዲያልፍ» የሚለው አገላለጽ ቃል በቃል ከሆነው «አሳልፎ እንዲወስድ» ይልቅ ተፈጥሯዊ ሲሆን የመሻገርን አቅጣጫዊ ሐሳብ ይጠብቃል።
