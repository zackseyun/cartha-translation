  text: Καὶ ἔρχονται πάλιν εἰς Ἱεροσόλυμα. καὶ ἐν τῷ ἱερῷ περιπατοῦντος αὐτοῦ ἔρχονται πρὸς αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς καὶ οἱ πρεσβύτεροι
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/027.yaml
  text: And they came again to Jerusalem. And as he was walking in the temple courts[a], the chief priests and the scribes and the elders came to him.
translation:
  language: am
  text: እንደገናም ወደ ኢየሩሳሌም መጡ። እርሱም በቤተ መቅደሱ ግቢ[a] ውስጥ እየተራመደ ሳለ፣ የካህናት አለቆች፣ ጸሐፍትና ሽማግሌዎች ወደ እርሱ መጡ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በቤተ መቅደሱ ውስጥ” ወይም “በቤተ መቅደሱ ክልል ውስጥ”፤ የግሪኩ ቃል በተለይ ውስጠኛውን መቅደስ ሳይሆን ሰፊውን የቤተ መቅደስ ስፍራ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: መጡ
  rationale: የግሪኩ ግስ በአሁን ጊዜ ቅርጽ የቀረበ ታሪካዊ አሁን ጊዜ ነው፤ በተፈጥሯዊ የአማርኛ ትረካ ግን ያለፈ ጊዜው «መጡ» የትረካውን ፍሰት ይጠብቃል።
- source_word: πάλιν
  choice: እንደገና
  rationale: ወደ ኢየሩሳሌም የተደረገው መምጣት መደገሙን በቀጥታ ያሳያል።
- source_word: Ἱεροσόλυμα
  choice: ኢየሩሳሌም
  rationale: በዘመናዊ መደበኛ አማርኛ የተለመደው የቦታው ስም ነው።
- source_word: ἐν τῷ ἱερῷ
  choice: በቤተ መቅደሱ ግቢ ውስጥ
  rationale: ἱερόν ከውስጠኛው መቅደስ (ναός) ይልቅ ሰፊውን የቤተ መቅደስ ስፍራ ያመለክታል፤ «ግቢ» ይህን የቦታ ልዩነት በግልጽ ያስተላልፋል።
- source_word: περιπατοῦντος αὐτοῦ
  choice: እርሱም … እየተመላለሰ ሳለ
  rationale: የጄኒቲቭ አብሶሉት አወቃቀሩ በጀርባ እየቀጠለ ያለ ሁኔታን ይገልጻል፤ «እየተመላለሰ ሳለ» ይህን በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἀρχιερεῖς
  choice: የካህናት አለቆች
  rationale: በብዙ ቁጥር የካህናትን መሪ ባለሥልጣናት ያመለክታል፤ አንድን ሊቀ ካህን ብቻ እንዳያመለክት «የካህናት አለቆች» ተመርጧል።
- source_word: γραμματεῖς
  choice: ጸሐፍት
  rationale: ቀጥተኛና በወንጌል ትረካ የተለመደ አቻ ቃል ነው፤ «የሕግ መምህራን» የሚለውን ጠባብ ትርጓሜ አያስገባም።
- source_word: πρεσβύτεροι
  choice: ሽማግሌዎች
  rationale: በዚህ ተቋማዊ አውድ ቃሉ የታወቁ የአይሁድ መሪዎችን እንጂ በዕድሜ የገፉ ወንዶችን ብቻ አያመለክትም።
- source_word: πρὸς αὐτόν
  choice: ወደ እርሱ
  rationale: ወደ ኢየሱስ የተደረገውን እንቅስቃሴ በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: የἱερόν አተረጓጎም
  choice: በቤተ መቅደሱ ግቢ ውስጥ
  alternative: በቤተ መቅደሱ ውስጥ / በቤተ መቅደሱ ክልል ውስጥ
  rationale: ይህ አተረጓጎም ኢየሱስ በውስጠኛው መቅደስ እንደነበረ የሚያስመስል ግንዛቤን ያስወግዳል፤ ግሪኩ ሕዝብ ሊገኝበት የሚችለውን ሰፊ የቤተ መቅደስ ስፍራ ሊያመለክት ይችላል። ይህ ከትምህርተ እምነት ይልቅ የቃልና የቦታ ውሳኔ ነው።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ሁለት ተከታታይ καί የሚፈጥሩት የትረካ ቅንጅት በ«-ም» ተጠብቋል፤ ነገር ግን አማርኛው እንዳይደነቃቀፍ የአረፍተ ነገሩ አወቃቀር በተፈጥሯዊ ሁኔታ ተደርጓል።
