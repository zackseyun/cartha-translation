  rationale: τί በቃል ‘ምን’ ሊባል ቢችልም፣ እዚህ ድርጊቱን የሚጠይቅ ወይም የሚቃወም ፈሊጣዊ ጥያቄ ነው፤ ‘ለምን’ ይህን ትርጉም በግልጽ አማርኛ ያቀርባል።
- source_word: εἴπατε
