base_translation:
  language: en
  yaml_path: translation/nt/mark/011/003.yaml
  text: And if anyone says to you[a], ‘Why are you doing this?’ say[b], ‘The Lord has need of it,’ and he will send it back here immediately.
translation:
  language: am
  text: ማንም፣ ‘ይህን ለምን ታደርጋላችሁ?’ ቢላችሁ፣ ‘ጌታ[a] ያስፈልገዋል፤ ወዲያውም መልሶ ወደዚህ ይልከዋል[b]’ በሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ባለቤቱ ያስፈልገዋል።” የግሪኩ κύριος “ጌታ” ወይም “ባለቤት/አለቃ” ማለት ሊሆን ይችላል፤ እዚህ ግን በወንጌሉ አውድ መሠረት “ጌታ” ተብሎ ተተርጉሟል።
    reason: alternative_reading
  - marker: b
    text: የግሪኩ ἀποστέλλει በቅርጹ የአሁን ጊዜ ነው፤ እዚህ ግን ወደፊት በቅርቡ የሚፈጸም ድርጊትን እንደሚያመለክት ተረድቶ “ይልከዋል” ተብሏል።
    reason: lexical_alternative
