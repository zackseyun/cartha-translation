  text: ብዙዎችም ልብሳቸውን በመንገድ ላይ ዘረጉ፤ ሌሎች ደግሞ ከመስኮች የቆረጧቸውን ቅጠላማ ቅርንጫፎች[a] ዘረጉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ቅርንጫፎች»። የግሪኩ ቃል በሰፊው የተቆረጡ ቅጠሎችን፣ ቅጠላማ ቅርንጫፎችን ወይም የዕፅዋት ክምርን ያመለክታል እንጂ በተለይ የዘንባባ ዝንጣፊዎችን አይልም።
