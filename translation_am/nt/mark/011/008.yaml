lexical_decisions:
- source_word: πολλοὶ
  choice: ብዙዎች
  rationale: ቁጥራዊውን ትርጉም ያለ ተጨማሪ አጽንኦት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἱμάτια
  choice: ልብሳቸውን
