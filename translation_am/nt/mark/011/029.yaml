  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Ἰησοῦς εἶπεν αὐτοῖς· Ἐπερωτήσω ⸀ὑμᾶς ἕνα λόγον, καὶ ἀποκρίθητέ μοι, καὶ ἐρῶ ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/029.yaml
  text: But Jesus said to them[a], “I will ask you one question. Answer me[b], and I will tell you by what authority I do these things.”
translation:
  language: am
  text: ኢየሱስ ግን እንዲህ አላቸው፦ “አንድ ጥያቄ እጠይቃችኋለሁ።[a] መልሱልኝ፤[b] እኔም ይህን በምን ሥልጣን እንደማደርግ እነግራችኋለሁ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አንድ ጉዳይ”፤ ቃል በቃል፣ “አንድ ቃል።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “አንድ ጥያቄ እጠይቃችኋለሁ፤ መልሱልኝ፤ እኔም ይህን በምን ሥልጣን እንደማደርግ እነግራችኋለሁ።”
    reason: previous_rendering
lexical_decisions:
- source_word: δὲ
  choice: ግን
  rationale: ከቀደመው የመሪዎቹ ጥያቄ ወደ ኢየሱስ መልስ የሚደረገውን ቀላል ንጽጽርና የትረካ ሽግግር ያሳያል።
- source_word: εἶπεν αὐτοῖς
  choice: እንዲህ አላቸው
  rationale: በዘመናዊ አማርኛ ቀጥተኛ ንግግርን በተፈጥሯዊና በክብር የሚያስተዋውቅ አገላለጽ ነው።
- source_word: Ἐπερωτήσω ὑμᾶς
  choice: እኔም … እጠይቃችኋለሁ
  rationale: የወደፊት ጊዜውንና ኢየሱስ በተቃራኒው ጥያቄ እንደሚጠይቃቸው በተፈጥሯዊ አማርኛ ያቀርባል፤ ‘እኔም’ የመልስ ጥያቄነቱን ያጎላል።
- source_word: ἕνα λόγον
  choice: አንድ ጥያቄ
  rationale: λόγος በቀጥታ ‘ቃል’ ሊባል ቢችልም፣ እዚህ መልስ የሚጠይቅ ጉዳይን ያመለክታል፤ ‘ጥያቄ’ ዐውደ ንባቡን በግልጽ ያስተላልፋል፣ ሌሎቹ ዕድሎችም በማስታወሻ ተጠብቀዋል።
- source_word: ἀποκρίθητέ μοι
  choice: መልሱልኝ
  rationale: የቀጥታ ትእዛዙን ኃይል በአጭርና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐρῶ ὑμῖν
  choice: እነግራችኋለሁ
  rationale: መረጃ እንደሚገልጥላቸው በተፈጥሯዊ አማርኛ የሚያሳይ የወደፊት ጊዜ አገላለጽ ነው።
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: በምን ሥልጣን
  rationale: የድርጊቱን ሕጋዊ ወይም የተሰጠ መሠረትና ፈቃድ ይጠይቃል፤ በአማርኛም የተለመደና ትክክለኛ አገላለጽ ነው።
- source_word: ταῦτα ποιῶ
  choice: ይህን የማደርገው
  rationale: በክርክር ላይ ያሉትን የኢየሱስ ድርጊቶች ያመለክታል፤ በአማርኛ ነጠላ ጠቋሚው በአጠቃላይ የተጠቀሱትን ድርጊቶች ተፈጥሯዊ ሁኔታ ይወክላል።
theological_decisions:
- issue: በዐውደ ንባቡ የἐξουσία ትርጉም
  choice: ሥልጣን
  alternative: መብት፣ ኃይል
  rationale: ውይይቱ ኢየሱስ ይህን ለማድረግ ስላለው ሕጋዊ ወይም የተሰጠ ሥልጣን እንጂ ስለ ችሎታው ብቻ አይደለም፤ ‘ሥልጣን’ ተቋማዊና ሥነ መለኮታዊ ክብደቱን ሳያጠብ ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛን ይጠቀማል። የግሪኩ ተከታታይ καὶ አገናኞች በአማርኛ የንግግር ፍሰት መሠረት በነጥብና በድርብ ነጥብ ቀርበዋል፤ የቀድሞው ቀጣይ አወቃቀር በማስታወሻ [b] ተጠብቋል።
