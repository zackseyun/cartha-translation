  text: καὶ ⸀εὐθὺς ἐπιγνοὺς ὁ Ἰησοῦς τῷ πνεύματι αὐτοῦ ὅτι ⸀οὕτως διαλογίζονται ἐν ἑαυτοῖς ⸀λέγει αὐτοῖς· Τί ταῦτα διαλογίζεσθε ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/008.yaml
  text: And immediately Jesus[a], perceiving in his spirit that they were reasoning this way within themselves, said to them, “Why are you reasoning about these things in your hearts?”
translation:
  language: am
  text: 'ወዲያውም ኢየሱስ እንዲህ በውስጣቸው እያሰቡ እንዳሉ በመንፈሱ ተረድቶ[a]፣ “እነዚህን ነገሮች በልባችሁ ለምን ታስባላችሁ?” አላቸው።


    [a] “በመንፈሱ አውቆ” ወይም “በውስጡ ተገንዝቦ” ሊባልም ይችላል። ግሪክኛው ኢየሱስ ይህን የተረዳበትን መንገድ በግልጽ አይወስንም።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በመንፈሱ አውቆ” ወይም “በውስጡ ተገንዝቦ” ሊባልም ይችላል። ግሪክኛው ኢየሱስ ይህን የተረዳበትን መንገድ በግልጽ አይወስንም።
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: ወዲያውም
  rationale: የማርቆስን ፈጣን የትረካ እንቅስቃሴ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἐπιγνοὺς
  choice: ተረድቶ
  rationale: ግሱ ግልጽ ማወቅን ወይም መገንዘብን ያመለክታል፤ “ተረድቶ” የእውቀቱን መንገድ ሳይወስን ዐውዱን በተፈጥሯዊነት ይገልጣል።
- source_word: τῷ πνεύματι αὐτοῦ
  choice: በመንፈሱ
  rationale: የግሪክኛውን የዳቲቭ ስፍራዊ ወይም መሣሪያዊ አሻሚነት በተቻለ መጠን ይጠብቃል፤ የኢየሱስን ውስጣዊ መንፈስ ወይም የመረዳቱን መንገድ በግድ አይወስንም።
- source_word: οὕτως διαλογίζονται ἐν ἑαυτοῖς
  choice: እንዲህ በውስጣቸው እያሰቡ እንዳሉ
  rationale: ንግግሩ በመካከላቸው የተደረገ ክርክር ሳይሆን ውስጣዊ ሐሳብ መሆኑን ያሳያል፤ “እንዲህ” የοὕτωςን የአኳኋን ኃይል ይጠብቃል።
- source_word: Τί ταῦτα διαλογίζεσθε
  choice: እነዚህን ነገሮች ... ለምን ታስባላችሁ?
  rationale: በዚህ የጥያቄ አወቃቀር τί ምክንያትን ይጠይቃል፤ “ለምን” ይህን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: በልባችሁ
  rationale: መጽሐፍ ቅዱሳዊውን የ“ልብ” ጽንሰ ሐሳብ—ሐሳብንና ውስጣዊ ዓላማን ጨምሮ—ሳይቀንስ ይጠብቃል።
theological_decisions:
- issue: “በመንፈሱ ተረድቶ” በሚለው ሐረግ የኢየሱስ እውቀት ባሕርይ
  choice: “በመንፈሱ” የሚለውን አገላለጽ መጠበቅና ኢየሱስ ውስጣዊ ሐሳባቸውን እንደተረዳ ማቅረብ፣ የተረዳበትን መንገድ ግን አለመወሰን
  alternative: ይህን በግልጽ መለኮታዊ ሁሉን አዋቂነት ብቻ ወይም የሰው ልጅ ጥልቅ ግንዛቤ ብቻ አድርጎ መተርጎም
  rationale: ጥቅሱ ኢየሱስ ውስጣዊ ሐሳባቸውን እንዳወቀ በግልጽ ይናገራል፤ τῷ πνεύματι αὐτοῦ ግን የእውቀቱን ሥነ መለኮታዊ ዘዴ በራሱ አይወስንም። ስለዚህ የምንጩ አሻሚነትና ሥነ መለኮታዊ ውጥረት ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ልብ” እና “መንፈስ” የሚሉት መጽሐፍ ቅዱሳዊ ቃላት ተጠብቀዋል፤ ከመጠን በላይ ትርጓሜ የሚጭን አገላለጽ ተወግዷል።
