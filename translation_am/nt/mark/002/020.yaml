review_pass:
  verdict: approve
  source_fidelity: The translation accurately conveys the contrast, future prospect, passive removal of the bridegroom from his companions, and the consequent future fasting. The Amharic singular idiom «ጊዜ ይመጣል» is a natural rendering of Greek «days will come» without asserting a different event; the final «በዚያ ቀን» correctly preserves the singular Greek phrase ἐν ἐκείνῃ τῇ ἡμέρᾳ.
  naturalness: «ነገር ግን ሙሽራው ከእነርሱ የሚወሰድበት ጊዜ ይመጣል፤ በዚያ ቀንም ይጾማሉ።» is fluent, clear modern standard Amharic with an appropriately dignified biblical register.
  terminology: «ሙሽራው» naturally retains the bridegroom metaphor, and «ይጾማሉ» is the established and accurate term for fasting. The passive «የሚወሰድበት» properly leaves the agent and exact manner of removal unstated.
