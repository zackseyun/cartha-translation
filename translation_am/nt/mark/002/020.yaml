reference: Mark 2:20
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν ἐν ⸂ἐκείνῃ τῇ ἡμέρᾳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/020.yaml
  text: But days will come when the bridegroom is taken away from them[a], and then they will fast in that day.
translation:
  language: am
  text: ነገር ግን ሙሽራው ከእነርሱ የሚወሰድበት ጊዜ ይመጣል፤ በዚያ ቀንም[a] ይጾማሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ ሐረግ ነጠላ ቁጥር ነው፤ «በዚያ ቀን» ይላል እንጂ «በእነዚያ ቀኖች» አይልም።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: ነገር ግን … ጊዜ ይመጣል
  rationale: δέ ከቀደመው ሁኔታ ጋር ያለውን ንጽጽር «ነገር ግን» በማለት ያሳያል። «ቀኖች ይመጣሉ» የሚለው ቀጥተኛ አገላለጽ በዘመናዊ አማርኛ እንግዳ ስለሚሆን፣ የግሪኩን የወደፊት ጊዜ ፍቺ በተፈጥሯዊው «ጊዜ ይመጣል» ተላልፏል።
- source_word: ὅταν
  choice: የሚ…በት
  rationale: ከወደፊቱ የሙሽራው መወሰድ ጋር የተያያዘውን «ጊዜ» በተፈጥሯዊ የአማርኛ አንጻራዊ ሐረግ ያሳያል፤ ተደጋጋሚነትን አያመለክትም።
- source_word: ἀπαρθῇ
  choice: የሚወሰድበት
  rationale: ተገብሮአዊውን ቅርጽ ይጠብቃል፤ የሚወስደውን አካልም ሆነ የመወሰዱን መንገድ አይጨምርም።
- source_word: ἀπ’ αὐτῶν
  choice: ከእነርሱ
  rationale: ከሙሽራው ጋር ካሉት ሰዎች መለየቱን በአጭርና ግልጽ አማርኛ ያሳያል።
- source_word: ὁ νυμφίος
  choice: ሙሽራው
  rationale: የሰርጉን ዘይቤ የሚጠብቅ፣ በዘመናዊ አማርኛም የተለመደ ቃል ነው።
- source_word: καὶ τότε
  choice: …ም
  rationale: የአማርኛው «ም» ከሙሽራው መወሰድ በኋላ ጾሙ እንደሚከተል በተፈጥሯዊ ሁኔታ ያገናኛል።
- source_word: νηστεύσουσιν
  choice: ይጾማሉ
  rationale: የወደፊት ድርጊቱንና የሃይማኖታዊውን ልማድ ትክክለኛ ትርጉም ይጠብቃል።
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: በዚያ ቀን
  rationale: የግሪኩን ነጠላ ቁጥር በግልጽ ሁኔታ ይጠብቃል፤ «በእነዚያ ቀኖች» ብሎ አያሰፋውም።
theological_decisions:
- issue: ኢየሱስን በሙሽራው ዘይቤ መግለጽ
  choice: «ሙሽራው» የሚለውን ዘይቤ እንዳለ ማቆየት
  alternative: «እኔ ከእነርሱ በምወሰድበት ጊዜ» ብሎ መተርጎም
  rationale: ዐውደ ንባቡ ኢየሱስ ስለራሱ እየተናገረ መሆኑን ቢያሳይም፣ የግሪኩ ጽሑፍ በግልጽ «እኔ» ከማለት ይልቅ ዘይቤውን ይጠቀማል።
- issue: ሙሽራው የሚወሰድበት ሁኔታ
  choice: ተገብሮአዊውን «የሚወሰድበት» ማቆየት
  alternative: «በሞት ከእነርሱ የሚለይበት» ወይም «በኃይል የሚወሰድበት»
  rationale: ንግግሩ ወደ ኢየሱስ ሞት እንደሚያመለክት ሊገባ ቢችልም፣ በዚህ ጥቅስ ድርጊቱን የሚፈጽመውም ሆነ የመወሰዱ መንገድ አልተገለጸም።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ጊዜ ይመጣል» የግሪኩን ፈሊጣዊ «ቀኖች ይመጣሉ» በተፈጥሯዊ አማርኛ ያቀርባል፤ የመጨረሻው «በዚያ ቀን» ግን የምንጩን ነጠላ ቁጥር በትክክል ጠብቋል።
