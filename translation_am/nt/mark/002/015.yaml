reference: Mark 2:15
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Καὶ ⸀γίνεται κατακεῖσθαι αὐτὸν ἐν τῇ οἰκίᾳ αὐτοῦ, καὶ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ, ἦσαν γὰρ πολλοὶ καὶ ⸀ἠκολούθουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/015.yaml
  text: And it happened that he was reclining at table in his house[a], and many tax collectors and sinners were reclining with Jesus and his disciples, for there were many, and they were following him.
translation:
  language: am
  text: እንዲህም ሆነ፤ ኢየሱስ በቤቱ[a] በማዕድ ተቀምጦ ሳለ፣ ብዙ ቀረጥ ሰብሳቢዎችና ኃጢአተኞች ከኢየሱስና ከደቀ መዛሙርቱ ጋር በማዕድ ተቀምጠው ነበር፤ ብዙዎች ነበሩና፣ እርሱን ይከተሉ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በሌዊ ቤት»፤ አንዳንዶች «በኢየሱስ ቤት» ማለት እንደሆነ ይረዱታል። የግሪክ ጽሑፉ «በእርሱ ቤት» ብቻ ይላል።
    reason: የግሪክ ተውላጠ ስሙ ማንን እንደሚያመለክት አሻሚ ስለሆነ ዋና አማራጭ ንባቦችን ለማሳወቅ።
lexical_decisions:
- source_word: γίνεται
  choice: እንዲህም ሆነ
  rationale: የማርቆስን ታሪካዊ የአሁን ጊዜ አጠቃቀም በተፈጥሯዊ የአማርኛ ትረካ አገላለጽ ያቀርባል።
- source_word: κατακεῖσθαι
  choice: ማዕድ ላይ ተቀምጦ ሳለ
  rationale: ቃሉ ለመብላት በማዕድ ዙሪያ መደገፍን ያመለክታል፤ በዘመናዊ አማርኛ «ተቀምጦ» ተፈጥሯዊ ሲሆን «ማዕድ ላይ» የምግቡን ሁኔታ ግልጽ ያደርጋል።
- source_word: ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: በእርሱ ቤት
  rationale: የባለቤትነት ተውላጠ ስሙንና የሚያመለክተው ሰው አለመግለጹን ይጠብቃል።
- source_word: τελῶναι
  choice: ቀረጥ ሰብሳቢዎች
  rationale: በዚያ ዘመን የገቢ ቀረጥ ሰብሳቢዎችን በግልጽና በዘመናዊ ቃል ይገልጻል።
- source_word: ἁμαρτωλοὶ
  choice: ኃጢአተኞች
  rationale: የግሪክ ጽሑፉን ቀጥተኛ ስያሜ ይጠብቃል፤ ማኅበራዊ ወይም ሃይማኖታዊ ምድብነቱን በትርጉም አይጨምርም።
- source_word: συνανέκειντο
  choice: ከ… ጋር ማዕድ ላይ ተቀምጠው ነበር
  rationale: አብሮ የመመገብን ሁኔታና ከኢየሱስ ጋር ያላቸውን ቅርበት በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: μαθηταῖς
  choice: ደቀ መዛሙርቱ
  rationale: በአማርኛ የአዲስ ኪዳን ንባብ የተለመደና ግንኙነታዊውን የተማሪነት ትርጉም የሚጠብቅ ቃል ነው።
- source_word: ἦσαν γὰρ πολλοὶ
  choice: ብዙዎች ነበሩና
  rationale: γάρ የሚሰጠውን ማብራሪያዊ ግንኙነት በ«ና» ይጠብቃል።
- source_word: ἠκολούθουν αὐτῷ
  choice: እርሱንም ይከተሉት ነበር
  rationale: ያልተፈጸመውን የግሪክ ግስ ቀጣይና ልማዳዊ እርምጃ በአማርኛ ያሳያል።
theological_decisions:
- issue: የ«በእርሱ ቤት» (αὐτοῦ) ተውላጠ ስም ማመልከቻ
  choice: በዋናው ጽሑፍ «በእርሱ ቤት» ተብሎ ባለቤቱ ሳይገለጽ ቀርቷል።
  alternative: «በሌዊ ቤት» ወይም «በኢየሱስ ቤት»
  rationale: የግሪክ ተውላጠ ስሙ በቅርብ ዐውድ አሻሚ ነው። ብዙዎች ከቀደመው ቁጥር ተነስተው የሌዊ ቤት እንደሆነ ሲረዱ፣ አንዳንዶች የኢየሱስ ቤት እንደሆነ ይረዳሉ። ትርጉሙ የምንጩን አሻሚነት አልፈታም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። «ማዕድ ላይ ተቀምጦ» የጥንቱን የመደገፍ አቀማመጥ ቃል በቃል ሳያስገድድ የምግብ ዐውዱን ይጠብቃል።
