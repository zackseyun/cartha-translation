  rationale: ጉዳዩ በዋናነት የትርጉም እንጂ የትምህርተ እምነት አይደለም። በአማርኛ ትረካ መካከል ድንገተኛ የጊዜ ለውጥ ያልተፈጥሯዊ ሊመስል ስለሚችል፣ የትረካውን ቅልጥፍናና ግልጽነት የሚጠብቀው ቅርጽ ተመርጧል።
