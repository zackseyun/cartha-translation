base_translation:
  language: en
  yaml_path: translation/nt/mark/002/014.yaml
  text: And as he was passing by[a], he saw Levi the son of Alphaeus sitting at the tax booth, and he says to him, “Follow me.” And he rose and followed him.
translation:
  language: am
  text: ኢየሱስም ሲያልፍ፣ በቀረጥ መቀበያ ቦታ[a] ተቀምጦ የነበረውን የእልፍዮስን ልጅ ሌዊን አየ፤ “ተከተለኝ” አለው። እርሱም ተነሥቶ ተከተለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በጉምሩክ መቀበያ ቦታ።” የግሪኩ ቃል ቀረጥ ወይም የጉምሩክ ክፍያ የሚሰበሰብበትን ስፍራ ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: παράγων
  choice: በመንገድ ሲያልፍ
  rationale: የአሁን ጊዜ አጋዥ ግስ ከεἶδεν ጋር በአንድ ጊዜ የተካሄደውን ቀጣይ ድርጊት ያሳያል፤ ይህ አተረጓጎም በአማርኛ ተፈጥሯዊ ነው።
- source_word: εἶδεν
  choice: አየው
  rationale: የὁράω ቀጥተኛ ትርጉም ሲሆን ‘አስተዋለው’ የሚለውን ተጨማሪ የትርጓሜ ጥላ አያስገባም።
- source_word: Λευὶν
  choice: ሌዊን
  rationale: የግል ስሙ በአማርኛ በተለመደው መልኩ ተጽፏል።
- source_word: τὸν τοῦ Ἁλφαίου
  choice: የእልፍዮስን ልጅ
  rationale: የግሪኩ የባለቤትነት አወቃቀር የወላጅነት ዝምድናን ያመለክታል፤ ‘ልጅ’ በማለት ግንኙነቱ በተፈጥሯዊ አማርኛ ግልጽ ሆኗል።
- source_word: καθήμενον
  choice: ተቀምጦ
  rationale: ኢየሱስ ሌዊን ባየው ጊዜ የነበረበትን ሁኔታ በቀጥታ ያሳያል።
- source_word: ἐπὶ τὸ τελώνιον
  choice: በቀረጥ መሰብሰቢያው
  rationale: τελώνιον ቀረጥ ወይም የጉምሩክ ክፍያ የሚሰበሰብበትን ስፍራ ያመለክታል፤ ይህ ምርጫ ትርጉሙን ሳያጠብ ለዘመናዊ አንባቢ ግልጽ ያደርገዋል።
- source_word: λέγει
  choice: አለው
  rationale: የማርቆስ ታሪካዊ የአሁን ጊዜ ቅርጽ በአማርኛ ቃል በቃል ‘ይለዋል’ ቢባል በዚህ የአለፈ ጊዜ ትረካ ውስጥ ያልተፈጥሯዊ ሊሆን ስለሚችል፣ ተፈጥሯዊው የትረካ አለፈ ጊዜ ተመርጧል።
- source_word: Ἀκολούθει μοι
  choice: ተከተለኝ
  rationale: ትእዛዙን በቀጥታ ያስተላልፋል፤ በግሪኩ የሌለው ‘ና’ የሚል ቃል አልተጨመረም።
- source_word: ἀναστὰς
  choice: ተነሥቶ
  rationale: ከዋናው ግስ በፊት የተፈጸመውን ድርጊትና የድርጊቶቹን ቅደም ተከተል ያሳያል።
- source_word: ἠκολούθησεν αὐτῷ
  choice: ተከተለው
  rationale: ከኢየሱስ ትእዛዝ ጋር ያለውን የቃል ትስስር ይጠብቃል፤ ድርጊቱንም ያለ ተጨማሪ ትርጓሜ ያቀርባል።
