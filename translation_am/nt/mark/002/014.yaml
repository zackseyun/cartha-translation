- issue: በማርቆስ ትረካ ያለው ታሪካዊ የአሁን ጊዜ
  choice: λέγει በተፈጥሯዊ የአማርኛ የአለፈ ጊዜ ትረካ ‘አለው’ ተብሎ ተተርጉሟል።
