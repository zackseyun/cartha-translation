id: MRK.2.18
reference: Mark 2:18
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Καὶ ἦσαν οἱ μαθηταὶ Ἰωάννου καὶ οἱ ⸀Φαρισαῖοι νηστεύοντες. καὶ ἔρχονται καὶ λέγουσιν αὐτῷ· Διὰ τί οἱ μαθηταὶ Ἰωάννου καὶ οἱ ⸀μαθηταὶ τῶν Φαρισαίων νηστεύουσιν, οἱ δὲ σοὶ μαθηταὶ οὐ νηστεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/018.yaml
  text: John's disciples and the Pharisees were fasting. And they come and say to him[a], "Why do John's disciples and the disciples of the Pharisees fast, but your disciples do not fast?"
translation:
  language: am
  text: የዮሐንስ ደቀ መዛሙርትና ፈሪሳውያን ይጾሙ ነበሩ። ወደ እርሱም መጥተው፣ “የዮሐንስ ደቀ መዛሙርትና የፈሪሳውያን ደቀ መዛሙርት ለምን ይጾማሉ፣ የአንተ ደቀ መዛሙርት ግን ለምን አይጾሙም?” አሉት[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሰዎች ወደ እርሱ መጥተው አሉት።” በግሪክ ጽሑፉ “መጡ” እና “አሉ” የሚሉት ግሶች ባለቤት በግልጽ አልተጠቀሰም።
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν ... νηστεύοντες
  choice: ይጾሙ ነበር
  rationale: ያለፈ ጊዜ ቀጣይ ድርጊትን የሚያሳየውን የግሪክ አገባብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: οἱ μαθηταὶ Ἰωάννου
  choice: የዮሐንስ ደቀ መዛሙርት
  rationale: የዝምድናውን ወይም የተከታይነቱን ግንኙነት ግልጽና የተለመደ በሆነ አገላለጽ ያቀርባል።
- source_word: οἱ Φαρισαῖοι
  choice: ፈሪሳውያን
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደው የቡድኑ ስም ነው።
- source_word: ἔρχονται καὶ λέγουσιν
  choice: መጥተው … አሉት
  rationale: የማርቆስን ታሪካዊ አሁን ጊዜ በአማርኛ ተፈጥሯዊ የትረካ ቅርጽ ያቀርባል፤ ያልተገለጸውን ባለቤት ግን አይለይም።
- source_word: Διὰ τί
  choice: ለምንድን ነው?
  rationale: ቀጥተኛና ተፈጥሯዊ የአማርኛ የምክንያት ጥያቄ ነው።
- source_word: νηστεύουσιν
  choice: የሚጾሙት
  rationale: በጥያቄው ውስጥ የልማድ ወይም የተደጋጋሚ ልምምድ ትርጉምን ያስተላልፋል።
- source_word: οἱ δὲ σοὶ μαθηταὶ
  choice: የአንተ ደቀ መዛሙርት ግን
  rationale: δέ የሚያሳየውን ንጽጽር በ“ግን” ግልጽ ያደርጋል፤ የባለቤትነት ግንኙነቱንም ይጠብቃል።
theological_decisions:
- issue: “መጥተው … አሉት” የሚለው ባለቤት ማንነት
  choice: ባለቤቱን ሳይለይ በግሱ ውስጥ ብቻ ማሳየት
  alternative: “ሰዎች መጥተው አሉት” ማለት ወይም ከዐውዱ አንድን ቡድን ለይቶ መጥቀስ
  rationale: በግሪክ ጽሑፉ የግሶቹ ባለቤት በግልጽ አልተጠቀሰም። ትርጉሙ ጽሑፉ ያልሰጠውን ልዩ መረጃ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “ደቀ መዛሙርት” እና “ፈሪሳውያን” የተለመዱ መጽሐፍ ቅዱሳዊ ቃላት ስለሆኑ ተጠብቀዋል።
