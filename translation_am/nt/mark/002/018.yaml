    rationale: Finite verbs, ይጾማሉ and አይጾሙም, naturally convey the customary present sense of νηστεύουσιν and read more idiomatically than paired nominalized relative clauses.
  - severity: medium
    issue: Footnote quotation is incomplete and its anchor is misplaced
    rationale: The alternative quotation stops after the participial phrase and omits the speech verb. The note concerns the implicit subject of both ‘come’ and ‘say,’ so its marker should follow አሉት.
