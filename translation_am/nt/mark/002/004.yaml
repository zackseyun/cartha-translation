id: MRK.2.4
reference: Mark 2:4
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ μὴ δυνάμενοι ⸀προσενέγκαι αὐτῷ διὰ τὸν ὄχλον ἀπεστέγασαν τὴν στέγην ὅπου ἦν, καὶ ἐξορύξαντες χαλῶσι τὸν κράβαττον ⸀ὅπου ὁ παραλυτικὸς κατέκειτο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/004.yaml
  text: And not being able to bring him to him because of the crowd[a], they removed the roof where he was, and after digging through it[c][b], they lower the mat on which the paralyzed man was lying.
translation:
  language: am
  text: በሕዝቡ ብዛት ምክንያት ሽባውን ወደ ኢየሱስ ማቅረብ ስላልቻሉ፣ እርሱ ባለበት ስፍራ ጣራውን ከፈቱ፤ ጣራውንም ቆፍረው ቀዳዳ ካደረጉ በኋላ፣ ሽባው ተኝቶበት የነበረውን ምንጣፍ ወደ ታች አወረዱ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ δυνάμενοι
  choice: ስላልቻሉ
  rationale: የግሪኩን አሳቢ ሁኔታዊ አንቀጽ በተፈጥሯዊ አማርኛ የምክንያት ግንኙነት አድርጎ ያቀርባል።
- source_word: προσενέγκαι αὐτῷ
  choice: ሽባውን ወደ ኢየሱስ ማቅረብ
  rationale: በግሪኩ ያሉትን ሁለት ተለያዩ ተውላጠ ስሞች በአማርኛ አሻሚነት እንዳይፈጠር ተጠቃሾቻቸውን በግልጽ ይለያል።
- source_word: διὰ τὸν ὄχλον
  choice: በሕዝቡ ብዛት ምክንያት
  rationale: ὄχλος የተሰበሰበውን ሕዝብ ያመለክታል፤ ችግሩ ብዛቱ መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἀπεστέγασαν τὴν στέγην
  choice: ጣራውን ከፈቱ
  rationale: ብርቅዬው ግስ የጣራውን መሸፈኛ ማንሳትን ወይም መክፈትን ያመለክታል፤ ይህ አገላለጽ ድርጊቱን በግልጽና ተፈጥሯዊ ሁኔታ ይገልጻል።
- source_word: ὅπου ἦν
  choice: እርሱ ባለበት ስፍራ
  rationale: የተከፈተውን የጣራ ቦታ ከኢየሱስ ስፍራ ጋር ያዛምዳል፤ ቀጥ ብሎ ከላዩ መሆኑን ጽሑፉ በግልጽ ስለማይል አይጨምርም።
- source_word: ἐξορύξαντες
  choice: ቆፍረውም ካስቦረቁት በኋላ
  rationale: የጣራውን ንጥረ ነገር ሳይወስን በመቆፈር ክፍተት መፍጠራቸውን ያሳያል።
- source_word: χαλῶσι
  choice: ወደ ታች አወረዱ
  rationale: ወደ ታች የማውረድ ድርጊቱን ግልጽ ያደርጋል፤ የግሪኩ ታሪካዊ የአሁን ጊዜ በአማርኛ ትረካ ተፈጥሯዊ በሆነ ያለፈ ጊዜ ተተርጉሟል።
- source_word: κράβαττον
  choice: ምንጣፍ
  rationale: ቃሉ ቀላል የመኝታ ንጣፍን እንጂ ትልቅ አልጋን አያመለክትም፤ ‘ምንጣፍ’ ለዘመናዊ አንባቢ ግልጽ ነው።
- source_word: ὅπου ὁ παραλυτικὸς κατέκειτο
  choice: ሽባው ተኝቶበት የነበረውን
  rationale: አንጻራዊው ሐረግ ምንጣፉን እንደሚገልጽ በተፈጥሯዊ አማርኛ ያቀርባል።
