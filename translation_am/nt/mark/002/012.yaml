base_translation:
  language: en
  yaml_path: translation/nt/mark/002/012.yaml
  text: And he got up[a], and immediately picked up the mat and went out before them all, so that they were all amazed and glorified God, saying, “We have never seen anything like this.”
translation:
  language: am
  text: እርሱም ተነሣ፤ ወዲያውም ምንጣፉን አንሥቶ በሁሉም ፊት ወጣ። በዚህም ሁሉም እጅግ ተደነቁና እግዚአብሔርን አከበሩ፤ “እንዲህ ያለ ነገር ከቶ አይተን አናውቅም” አሉ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “እንዲህ ከቶ አላየንም።” የግሪኩ አገላለጽ ይህን የመሰለ ነገር ከዚህ በፊት አይተው እንደማያውቁ ያመለክታል።
    reason: lexical_alternative
