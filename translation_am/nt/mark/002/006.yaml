    issue: The verb «ያስቡ ነበር» is semantically less specific than διαλογιζόμενοι.
    rationale: While it can express thought, the Greek participle here emphasizes internal deliberation or reasoning. «ያሰላስሉ ነበር» preserves that nuance more closely.
