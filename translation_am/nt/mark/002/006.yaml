  yaml_path: translation/nt/mark/002/006.yaml
  text: 'But some of the scribes were sitting there[a], reasoning in their hearts:'
translation:
  language: am
  text: ነገር ግን ከጻፎቹ አንዳንዶቹ በዚያ ተቀምጠው በልባቸው ያሰላስሉ ነበር፤[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «በውስጣቸው ያሰላስሉ» ወይም «በአእምሯቸው ያስቡ» ተብሎም ሊተረጎም ይችላል። ግሪኩ ቃል በቃል «በልባቸው» ይላል፤ ይህም ውስጣዊ ሐሳብን የሚያመለክት መጽሐፍ ቅዱሳዊ ፈሊጥ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δέ
  choice: ነገር ግን ... ነበር
  rationale: δέ ወደ ጻፎቹ ውስጣዊ ምላሽ የሚያሸጋግር ቀላል ንጽጽር ስላለው፣ «ነገር ግን» የትረካውን ለውጥ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τινες τῶν γραμματέων
  choice: ከጻፎች አንዳንዶቹ
  rationale: የክፍል አመልካቹን የግሪክ አገባብ ጠብቆ ከጻፎቹ ሁሉ መካከል አንዳንዶቹን ብቻ ያመለክታል፤ «ጻፎች» በወንጌላት አውድ γραμματεῖςን የሚያመለክት የተለመደ ቃል ነው።
- source_word: ἐκεῖ
  choice: በዚያ
  rationale: ቦታውን በአጭርና ተፈጥሯዊ አማርኛ ያመለክታል።
- source_word: καθήμενοι
  choice: ተቀምጠው
  rationale: በትዕይንቱ ውስጥ የነበራቸውን አቀማመጥ ያሳያል፤ ከዋናው ግስ ጋርም ተፈጥሯዊ የአማርኛ ግንኙነት ይፈጥራል።
- source_word: διαλογιζόμενοι
  choice: ያስቡ
  rationale: ቃሉ ውስጣዊ ማሰላሰልንና ምክንያታዊ ሐሳብን ሊያመለክት ይችላል። «ያስቡ» ቀጥሎ የሚቀርበውን ውስጣዊ ጥያቄ ሳይቀድም በተፈጥሯዊ አማርኛ ይገልጸዋል።
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: በልባቸው
  rationale: የውስጥ ሐሳብና ማሰላሰል ማዕከል እንደሆነ የሚገልጠውን መጽሐፍ ቅዱሳዊ ፈሊጥ ይጠብቃል፤ በአማርኛም ተረድቶ ይነበባል።
theological_decisions:
- issue: የκαρδίαις ሰውነታዊና ውስጣዊ ፈሊጥ
  choice: በልባቸው
  alternative: በውስጣቸው / በአእምሯቸው
  rationale: የግሪኩን «ልብ» የሚለውን ምስል መጠበቅ ልብን የውስጣዊ ሐሳብ ማዕከል አድርጎ የሚያቀርበውን መጽሐፍ ቅዱሳዊ አገላለጽ ያስቀራል፤ ዘመናዊውን የልብና የአእምሮ ክፍፍል በጽሑፉ ላይ አይጭንም።
