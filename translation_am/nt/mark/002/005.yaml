id: MRK.2.5
reference: Mark 2:5
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸂καὶ ἰδὼν⸃ ὁ Ἰησοῦς τὴν πίστιν αὐτῶν λέγει τῷ παραλυτικῷ· Τέκνον, ⸂ἀφίενταί σου⸃ αἱ ⸀ἁμαρτίαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/005.yaml
  text: And Jesus[a], seeing their faith, says to the paralyzed man, “Child, your sins are forgiven.”
translation:
  language: am
  text: ኢየሱስም እምነታቸውን አይቶ ሽባውን፣ “ልጄ፣[a] ኃጢአቶችህ ተሰርየዋል” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ልጅ”፤ የግሪኩ τέκνον በርኅራኄ የሚነገር “ልጅ” ማለት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: አይቶ
  rationale: የግሪኩን የቦዝ አንቀጽ ቅርጽ ከዋናው ግስ ጋር በተፈጥሮ ያገናኛል።
- source_word: πίστιν αὐτῶν
  choice: እምነታቸውን
  rationale: πίστις በዚህ አውድ ሽባውን ወደ ኢየሱስ ያመጡትን ሰዎች የታየ እምነትና መታመን ያመለክታል፤ αὐτῶν የብዙ ሰዎችን ባለቤትነት ይጠብቃል።
- source_word: λέγει
  choice: አለው
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ ቅርጽ በተፈጥሮአዊ የአማርኛ ትረካ በኃላፊ ጊዜ ተተርጉሟል።
- source_word: παραλυτικῷ
  choice: ሽባውን
  rationale: በዘመናዊ አማርኛ ለሽባ ሰው የሚያገለግል አጭርና የተለመደ አገላለጽ ነው።
- source_word: Τέκνον
  choice: ልጄ
  rationale: የቃሉን ርኅራኄና የቀረበ አጠራር ይገልጣል፤ የግሪኩ ቃል በራሱ ወንድ ፆታን አያስገድድም።
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: ኃጢአቶችህ ተሰርየውልሃል
  rationale: ይቅርታውን እንደ ወቅታዊ እውነታ የሚያውጅ የግሪኩን ተገብሮ ቅርጽ ይጠብቃል፤ ድርጊቱን ያደረገውን በግልጽ አይጨምርም።
- source_word: ἁμαρτίαι
  choice: ኃጢአቶች
  rationale: የግሪኩን ብዙ ቁጥር ጠብቆ የተለመደውን መጽሐፍ ቅዱሳዊ ቃል ይጠቀማል።
theological_decisions:
- issue: የኢየሱስ የኃጢአት ስርየት ንግግር ባሕርይ
  choice: “ኃጢአቶችህ ተሰርየውልሃል” ተብሎ እንደ ቀጥተኛ አዋጅ ተተርጉሟል።
  alternative: “ኃጢአቶችህ እየተሰረዩልህ ነው” ወይም የስርየቱን አድራጊ በግልጽ መጨመር።
  rationale: የአሁን ጊዜው ተገብሮ ግስ ስርየቱን እንደ አሁናዊ እውነታ ያቀርባል፤ ጽሑፉ ያልገለጸውን አድራጊ ወይም ሂደት ሳይጨምር የንግግሩን ኃይልና ሥነ መለኮታዊ ውጥረት ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና በቀላሉ የሚገባ አማርኛን ይጠቀማል። “ልጄ” የአጠራሩን ሙቀት ይጠብቃል፤ “ሽባው” ደግሞ ከአሮጌ ወይም ቴክኒካዊ አገላለጽ ይልቅ ተፈጥሯዊ ነው።
