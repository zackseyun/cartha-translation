- from: ኢየሱስም እምነታቸውን አይቶ ሽባውን፣ “ልጄ፣[a] ኃጢአቶችህ ተሰርየውልሃል” አለው።
  to: ኢየሱስም እምነታቸውን አይቶ ሽባውን፣ “ልጄ፣[a] ኃጢአቶችህ ተሰርየዋል” አለው።
  rationale: The revision corrects the forgiveness predicate to an idiomatic plural passive matching ኃጢአቶች and the Greek plural subject. It retains the source’s unexpressed agent, the direct declarative force, the participial construction, and the tender but non-male-specific force of τέκνον. The footnote is clarified without adding interpretive content.
