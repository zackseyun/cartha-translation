    text: ወይም “ልጅ”፤ የግሪኩ τέκνον በርኅራኄ የሚነገር “ልጅ” ማለት ነው።
    reason: lexical_alternative
  revision_rationale: The revision corrects the forgiveness predicate to an idiomatic plural passive matching ኃጢአቶች and the Greek plural subject. It retains the source’s unexpressed agent, the direct declarative force, the participial construction, and the tender but non-male-specific force of τέκνον. The footnote is clarified without adding interpretive content.
