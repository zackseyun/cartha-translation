  rationale: κύριος የተወሰነ ፈቃድን ብቻ ሳይሆን ጌትነትን ይገልጣል፤ ትርጉሙም ከጽሑፉ በላይ ሳይጨምር ይህን ጠንካራ አባባል ይጠብቃል።
- issue: «የሰው ልጅ» የሚለው ማንነት
  choice: እንደ ኢየሱስ መጠሪያ «የሰው ልጅ» የሚለውን ቅርጽ ማቆየት
  alternative: «ሰው» ወይም «ሰብአዊው» ብሎ በአጠቃላይ ማብራራት
  rationale: በማርቆስ ውስጥ ሐረጉ ኢየሱስን የሚያመለክት መጠሪያ ሆኖ ይሠራል፤ ይህን በሌላ ቃል መፍታት ሥነ መለኮታዊና ከዳንኤል ጋር ያለውን አገናኝ ሊያደበዝዝ ይችላል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «የሰው ልጅ» እና «ጌታ» የተባሉት የታወቁ መጽሐፍ ቅዱሳዊ ቃላት በተፈጥሯዊ የአማርኛ አገባብ ተጠብቀዋል።
