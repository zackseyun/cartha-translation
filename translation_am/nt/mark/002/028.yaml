lexical_decisions:
- source_word: ὥστε
  choice: ስለዚህ
  rationale: ከቀደመው ንግግር የሚደረሰውን ድምዳሜ በተፈጥሯዊና ግልጽ አማርኛ ያሳያል።
- source_word: κύριος
  choice: ጌታ
  rationale: በዚህ አውድ ላይ ሉዓላዊነትንና ሥልጣንን የሚገልጠውን የግሪኩን ጠንካራ ትርጉም ይጠብቃል።
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: የሰው ልጅ
  rationale: በወንጌላት ውስጥ የኢየሱስ የታወቀ ራስን መጠሪያ ስለሆነ፣ ክርስቶሳዊና ዳንኤላዊ አገናኙን ሳይፈታ ይጠብቃል።
- source_word: καὶ
  choice: -ም
  rationale: ከ«የሰንበት» ጋር የተያያዘው የአማርኛው «-ም» እዚህ «ደግሞ/እንኳ» የሚለውን አሳዳጊ ስሜት በተፈጥሯዊ አገላለጽ ያስተላልፋል፤ የቀላል «እና/ደግሞ» አማራጭ ግን በማስታወሻ ተጠብቋል።
- source_word: σαββάτου
  choice: የሰንበት
  rationale: የግሪኩን ነጠላ የባለቤትነት ቅርጽ በተለመደው የአማርኛ መጽሐፍ ቅዱሳዊ ቃል ያስተላልፋል።
theological_decisions:
- issue: የሰው ልጅ በሰንበት ላይ ስላለው ሥልጣን የንግግሩ ክርስቶሳዊ ኃይል
  choice: «የሰንበትም ጌታ ነው» በማለት የጌትነት አባባሉን ቀጥታ ማቅረብ
