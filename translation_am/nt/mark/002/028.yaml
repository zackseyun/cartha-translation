translation:
  language: am
  text: ስለዚህ የሰው ልጅ የሰንበትም ጌታ ነው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ስለዚህ የሰው ልጅ ደግሞ የሰንበት ጌታ ነው።» የግሪኩ አያያዥ ቃል «እና/ደግሞ» ተብሎ ሊተረጎም ይችላል፤ እዚህ ግን «እንኳ» የሚል አሳዳጊ አጽንዖት ሊኖረው ይችላል።
