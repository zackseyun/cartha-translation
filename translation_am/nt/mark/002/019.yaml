    issue: 'The first rhetorical question is positive in form: መጾም ይችላሉን?'
    rationale: Μὴ δύνανται ... νηστεύειν; is a negative rhetorical question expecting a negative answer. The Amharic wording should explicitly convey that the guests cannot fast while the bridegroom is with them.
  - severity: low
