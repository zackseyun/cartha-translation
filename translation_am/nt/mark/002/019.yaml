  source_fidelity: The draft correctly retains the temporal setting, the bridegroom image, and the explicit second-clause sense of having the bridegroom with them. However, its first question is affirmative in form (ይችላሉን?) although the Greek μή-question expects a negative answer. The revised wording makes that negative rhetorical force clear.
