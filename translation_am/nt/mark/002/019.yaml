  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος ἐν ᾧ ὁ νυμφίος μετ’ αὐτῶν ἐστιν νηστεύειν; ὅσον χρόνον ⸂ἔχουσιν τὸν νυμφίον μετ’ αὐτῶν⸃ οὐ δύνανται νηστεύειν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/019.yaml
  text: And Jesus said to them[a], “The wedding guests cannot fast while the bridegroom is with them, can they? As long as they have the bridegroom with them, they cannot fast.”
translation:
  language: am
  text: ኢየሱስም እንዲህ አላቸው፤ “የሰርግ እንግዶች[a] ሙሽራው ከእነርሱ ጋር ሳለ ሊጾሙ አይችሉም፣ አይደል? ሙሽራው ከእነርሱ ጋር ያላቸው እስከሆነ ድረስ ሊጾሙ አይችሉም።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “የሰርግ አዳራሹ ልጆች” ወይም “የሙሽራ ክፍሉ ልጆች”፤ በሰርግ ደስታ የሚሳተፉትን የሚያመለክት ፈሊጥ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ δύνανται ... νηστεύειν;
  choice: መጾም ይችላሉን?
  rationale: μή ያለበት ጥያቄ አሉታዊ መልስን ይጠብቃል፤ በአማርኛ አውድና በሚከተለው ‘አይችሉም’ ይህ ኃይል በተፈጥሮ ይገለጣል።
- source_word: οἱ υἱοὶ τοῦ νυμφῶνος
  choice: የሰርጉ ታዳሚዎች
  rationale: ቃል በቃል ‘የሙሽራ ክፍል/የሰርግ አዳራሽ ልጆች’ የሚለው ፈሊጥ በሰርጉ ደስታ የሚሳተፉትን ያመለክታል፤ ‘ታዳሚዎች’ ከ‘ሚዜዎች’ ይልቅ የሰፋውን ትርጉም ይጠብቃል።
- source_word: ἐν ᾧ ... ἐστιν
  choice: '... ሳለ'
  rationale: አገባቡ በዚህ ስፍራ የጊዜ ትርጉም ስላለው፣ ‘ሳለ’ በተፈጥሮ ‘while’ የሚለውን ያስተላልፋል።
- source_word: ὁ νυμφίος / τὸν νυμφίον
  choice: ሙሽራው / ሙሽራውን
  rationale: ‘ሙሽራ’ በዘመናዊ አማርኛ የወንድ ሙሽራን ሊያመለክት የሚችልና የጽሑፉን ምሳሌያዊ ምስል የሚጠብቅ ቃል ነው።
- source_word: μετ’ αὐτῶν
  choice: ከእነርሱ ጋር
  rationale: μετά ከጄኒቲቭ ጋር አብሮነትን ያመለክታል፤ ይህ ቀጥተኛና ተፈጥሯዊ አተረጓጎም ነው።
- source_word: ὅσον χρόνον
  choice: እስካላቸው ድረስ
  rationale: የቆይታ ጊዜን የሚያመለክተውን አገባብ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἔχουσιν τὸν νυμφίον μετ’ αὐτῶν
  choice: ሙሽራውን ከእነርሱ ጋር እስካላቸው ድረስ
  rationale: ሁለተኛው ሐረግ ἐστιν ሳይሆን ἔχουσιν (‘አላቸው’) ይጠቀማል፤ የግሪኩን ልዩነት ለማስጠበቅ ‘እስካላቸው’ ተብሏል።
- source_word: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς
  choice: ኢየሱስም እንዲህ አላቸው
  rationale: የትረካውን ቅደም ተከተል በ‘-ም’ ያገናኛል፤ ‘እንዲህ አላቸው’ ግልጽና የተለመደ የንግግር መግቢያ ነው።
theological_decisions:
- issue: ኢየሱስ እንደ ሙሽራ በምሳሌ መቅረቡ
  choice: ‘ሙሽራው’ የሚለውን ምስል ሳይተረጉሙ ማቆየት
  alternative: መሲሐዊ ወይም ሌላ ሥነ መለኮታዊ መለያውን በትርጉሙ ውስጥ በግልጽ መጨመር
  rationale: ጥቅሱ ምስሉን ያቀርባል እንጂ ሥነ መለኮታዊ ፍቺውን በግልጽ አይዘረዝርም፤ ስለዚህ አንባቢው የጽሑፉን ውጥረትና ጥልቀት እንዲያጤን ምስሉ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር አማርኛ ተጠቅሟል። የግሪኩ ድግግሞሽና በἐστιν/ἔχουσιν መካከል ያለው ልዩነት በተቻለ መጠን ተጠብቋል።
