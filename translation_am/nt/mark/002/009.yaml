id: MRK.2.9
reference: Mark 2:9
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: τί ἐστιν εὐκοπώτερον, εἰπεῖν τῷ παραλυτικῷ· ⸀Ἀφίενταί σου αἱ ἁμαρτίαι, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ ἆρον ⸂τὸν κράβαττόν σου⸃ καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/009.yaml
  text: 'Which is easier: to say to the paralyzed man[a], ‘Your sins are forgiven,’ or to say, ‘Get up, pick up your mat, and walk’?”'
translation:
  language: am
  text: ሽባውን፣ ‘ኃጢአቶችህ ይቅር ተብለውልሃል’[a] ማለት ወይስ ‘ተነሥ፤ ምንጣፍህን አንሥተህ ተራመድ’ ማለት፣ የትኛው ይቀላል?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ኃጢአቶችህ ይቅር ተብለዋል።” የግሪኩ ግስ ከስርየቱ የተገኘውን የአሁን ሁኔታ እንደሚያጎላ ሊገባ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ἐστιν εὐκοπώτερον
  choice: የትኛው ይቀላል?
  rationale: ንጽጽራዊውን ጥያቄ በተፈጥሯዊና በዘመናዊ አማርኛ ይገልጻል።
- source_word: εἰπεῖν
  choice: ማለት
  rationale: በሁለቱም አማራጮች ቀጥተኛ ንግግርን በቀላሉና በወጥነት ያስተዋውቃል።
- source_word: τῷ παραλυτικῷ
  choice: ሽባውን
  rationale: በአማርኛ የተለመደ፣ ግልጽና አጭር መጠሪያ ነው፤ በዐውዱም የታወቀውን ሰው ያመለክታል።
- source_word: Ἀφίενταί σου αἱ ἁμαρτίαι
  choice: ኃጢአቶችህ ተሰርየውልሃል
  rationale: የግሪኩን ተገብሮአዊ መግለጫና የይቅርታውን ውጤታማ ሁኔታ በተፈጥሯዊ አማርኛ ይጠብቃል፤ የድርጊቱን ፈጻሚ አይጨምርም።
- source_word: ἁμαρτίαι
  choice: ኃጢአቶች
  rationale: በዚህ ዐውድ መደበኛውና ትክክለኛው የአማርኛ አቻ ነው።
- source_word: Ἔγειρε
  choice: ተነሥ
  rationale: ሰውየው ከተኛበት እንዲነሣ የሚሰጠውን ትእዛዝ በተፈጥሯዊ ቋንቋ ያሳያል።
- source_word: ἆρον
  choice: አንሥተህ
  rationale: ምንጣፉን ከቦታው ማንሣትና ይዞ መሄድን በአማርኛው የትእዛዝ ቅደም ተከተል ያሳያል።
- source_word: τὸν κράβαττόν σου
  choice: ምንጣፍህን
  rationale: κράβαττος የሚያመለክተውን ቀላልና ተንቀሳቃሽ የመኝታ ንጣፍ በግልጽ ሁኔታ ያስተላልፋል፤ ‘አልጋ’ የበለጠ ከባድ ዕቃ ሊያስመስል ይችላል።
- source_word: περιπάτει
  choice: ሂድ
  rationale: በዚህ የትእዛዝ ቅደም ተከተል ውስጥ መራመድን በተፈጥሯዊ አማርኛ ይገልጻል።
theological_decisions:
- issue: የኃጢአት ስርየት መግለጫ
  choice: ኃጢአቶችህ ተሰርየውልሃል
  alternative: ኃጢአቶችህ ይሰረዩልሃል
  rationale: የተመረጠው አተረጓጎም አሁን ያለውን የስርየት ሁኔታ ያጎላል፤ የግሪኩን ተገብሮአዊ አገላለጽ በመጠበቅ ፈጻሚውን አይጨምርም፣ በታሪኩ ውስጥ በኃጢአት ይቅርታና በሚታይ ፈውስ መካከል ያለውን ውጥረትም አይፈታም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የንግግሩ ንጽጽራዊ ቅርጽና የትእዛዞቹ ፈጣን ቅደም ተከተል ተጠብቋል።
