base_translation:
  language: en
  yaml_path: translation/nt/mark/002/011.yaml
  text: I say to you[a], get up, pick up your mat[b], and go to your house.
translation:
  language: am
  text: “አንተን እልሃለሁ፤ ተነሥ፣ ምንጣፍህን[a] አንሣና ወደ ቤትህ[b] ሂድ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ቀላል አልጋህን።” የግሪክኛው κράβαττος ቀላል የመኝታ ምንጣፍን ወይም ተንቀሳቃሽ አልጋን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ወደ ቤት ሂድ።” በግሪክኛ ቃል በቃል፣ “ወደ ቤትህ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σοὶ λέγω
  choice: አንተን እልሃለሁ
  rationale: በግሪክኛው የተውላጠ ስሙ ቀድሞ መቀመጡ የቀጥታና የግል አነጋገር አጽንዖት አለው። “አንተን እልሃለሁ” ይህን አጽንዖት በተፈጥሯዊ የአማርኛ አገላለጽ ያስተላልፋል።
- source_word: ἔγειρε
  choice: ተነሥ
  rationale: ሽባው ሰው ካለበት እንዲነሣ የተሰጠውን ግልጽና ቀጥተኛ ትእዛዝ ያሳያል።
- source_word: ἆρον
  choice: አንሣ
  rationale: ተንቀሳቃሽ የመኝታ ምንጣፉን ከቦታው አንሥቶ እንዲወስድ የሚያዝዝ ተፈጥሯዊ የአማርኛ ቃል ነው።
- source_word: κράβαττόν
  choice: ምንጣፍ
  rationale: ቃሉ ቀላልና ተንቀሳቃሽ የመኝታ ንጣፍን ወይም ቀላል አልጋን ያመለክታል። “ምንጣፍ” ሙሉ የአልጋ እቃን ሳያስታውስ ተሸክሞ ሊወሰድ የሚችለውን ነገር በግልጽ ያሳያል።
- source_word: ὕπαγε
  choice: ሂድ
  rationale: የግሪክኛውን ቀጥተኛ ትእዛዝ በዘመናዊና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: εἰς τὸν οἶκόν σου
  choice: ወደ ቤትህ
  rationale: የεἰςን አቅጣጫና የοἶκόνን ቀጥተኛ ትርጉም ይጠብቃል፤ በአማርኛም ተፈጥሯዊ ነው።
theological_decisions:
- issue: የኢየሱስ የፈውስ ትእዛዝ ቃናና ኃይል
  choice: እያንዳንዱን ተግባር በቀጥታ የሚያዝዝ ግላዊና ሥልጣናዊ ንግግር
  alternative: ይበልጥ ጥንታዊ ቃና ያለው “ተነሣ፣ አልጋህን ተሸከምና ወደ ቤትህ ሂድ”
  rationale: ጥቅሱ የኢየሱስን አፋጣኝ ሥልጣን በተከታታይ ትእዛዞች ያቀርባል። ትርጉሙ ይህን ኃይል ይጠብቃል፤ ነገር ግን ከጽሑፉ በላይ የሆነ የሃይማኖት ትርጓሜ አይጨምርም።
