  text: καὶ ἔλεγεν αὐτοῖς· Τὸ σάββατον διὰ τὸν ἄνθρωπον ἐγένετο ⸀καὶ οὐχ ὁ ἄνθρωπος διὰ τὸ σάββατον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/027.yaml
  text: And he was saying to them[a], “The Sabbath came into being for man, and not man for the Sabbath.”
translation:
  language: am
  text: እርሱም እንዲህ ይላቸው ነበር፦ “ሰንበት ለሰው[a] ሲል ሆነ እንጂ፣ ሰው ለሰንበት ሲል አልሆነም።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለሰው ልጆች”። በግሪክ ነጠላ የሆነው “ሰው” የሚለው ቃል እዚህ ሰዎችን ሁሉ ወክሎ ተጠቅሟል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: ይላቸው ነበር
  rationale: የግሪኩ ያልተፈጸመ ጊዜ (imperfect) ንግግሩን እየቀጠለ ወይም ደጋግሞ እንደተናገረ ሊያመለክት ስለሚችል፣ ይህ አተረጓጎም የግሱን ገጽታ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: σάββατον
  choice: ሰንበት
  rationale: ቃሉ የሰንበትን ቀንና ሥርዓት ያመለክታል፤ “ሰንበት” በአማርኛ የተለመደና በቂ ነው።
- source_word: διὰ τὸν ἄνθρωπον
  choice: ለሰው ሲል
  rationale: διά ከተሳቢ ቅጽ ጋር ዓላማን ወይም ጥቅምን፣ ‘ስለ/ለ… ሲል’ የሚለውን ሐሳብ ይገልጣል። ነጠላው ἄνθρωπος እዚህ ሰውን በአጠቃላይ ወክሎ ይጠቀማል።
- source_word: ἐγένετο
  choice: ሆነ
  rationale: γίνομαι ‘መሆን/ወደ መኖር መምጣት’ የሚል ሰፊ ትርጉም አለው። “ሆነ” ከዓላማ ሐረጉ ጋር ተፈጥሯዊ ሲሆን፣ ‘ተፈጠረ’ ወይም ‘ተሠራ’ ብሎ ትርጉሙን አላስፈላጊ ሁኔታ አያጠብብም።
- source_word: οὐχ ὁ ἄνθρωπος διὰ τὸ σάββατον
  choice: ሰው ለሰንበት ሲል አልሆነም
  rationale: የግሪኩን ተቃርኖና የሁለቱን ሐረጎች ትይዩነት ይጠብቃል፤ በምንጩ የተተወው ግስም በአማርኛ ለግልጽነት ተደግሟል።
theological_decisions:
- issue: በአጠቃላይ መርሕ ውስጥ ያለው ወካይ ነጠላ ἄνθρωπος
  choice: በዋናው ጽሑፍ “ሰው” ተብሎ ተተርጉሟል።
  alternative: “የሰው ልጆች” ወይም “የሰው ዘር”
  rationale: የግሪኩ ነጠላ ἄνθρωπος ወንድን ብቻ ሳይሆን የሰውን ልጅ በአጠቃላይ ወክሎ ይገልጣል። “ሰው” በዘመናዊ አማርኛም ይህን ወካይ ነጠላነትና የንግግሩን ትይዩነት ይጠብቃል፤ አጠቃላይ ትርጉሙ በማስታወሻ ተገልጿል።
- issue: ἐγένετο ስለ ሰንበት አመጣጥና ዓላማ የሚሰጠው ሐሳብ
  choice: “ሆነ”
  alternative: “ተፈጠረ” ወይም “ተሠራ”
  rationale: ጥቅሱ ሰንበት ለሰው ጥቅም እንደተሰጠ ያስረዳል፤ የግሱን ሰፊ ትርጉም ሳያጠብብ “ሆነ” ይህን ዓላማዊ ተቃርኖ ያቆያል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። “እንጂ” የሁለቱን አንቀጾች ጠንካራ ተቃርኖ በተፈጥሯዊ አማርኛ ያሳያል።
