    text: ወይም፣ “እነሆ፣ በሰንበት የሚያደርጉት ያልተፈቀደው ምንድን ነው?” የግሪኩ τί “ምን” ተብሎ ሊነበብ ይችላል፤ በዐውዱ ግን “ለምን” የሚለው ፍቺ የበለጠ የተገባ ይመስላል።
