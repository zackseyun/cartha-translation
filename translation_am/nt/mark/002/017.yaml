  naturalness: The revised wording is idiomatic modern standard Amharic and gives the medical comparison a clear, balanced form. “ጤነኞች” is a natural contextual rendering in the physician contrast; its more literal lexical alternative remains footnoted.
  terminology: ሐኪም, በሽተኞች, ጻድቃን, and ኃጢአተኞች are appropriate established Amharic biblical terms. The note on “ጻድቃን” appropriately retains the possible contextual irony without imposing it on the main text.
