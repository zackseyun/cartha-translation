base_translation:
  language: en
  yaml_path: translation/nt/mark/002/016.yaml
  text: And the scribes of the Pharisees[a], seeing that he was eating with sinners and tax collectors, were saying to his disciples, “Why does he eat with tax collectors and sinners?”
translation:
  language: am
  text: የፈሪሳውያን ጸሐፍትም እርሱ ከኃጢአተኞችና ከቀረጥ ሰብሳቢዎች ጋር ሲበላ[a] አይተው፣ ለደቀ መዛሙርቱ እንዲህ ይሉ ነበር፤ “ከቀረጥ ሰብሳቢዎችና ከኃጢአተኞች ጋር ለምን ይበላል?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክኛው ቃል በቃል “ከ… ጋር ይበላል” ይላል። በዚህ አውድ ይህ አገላለጽ ከእነርሱ ጋር ማዕድ መጋራቱን ያመለክታል።
    reason: lexical_alternative
