  text: Καὶ ⸀εἰσελθὼν πάλιν εἰς Καφαρναοὺμ δι’ ⸀ἡμερῶν ἠκούσθη ὅτι ⸂ἐν οἴκῳ⸃ ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/001.yaml
  text: And when he entered Capernaum again after some days[a], it was heard that he was at home.
translation:
  language: am
  text: ከጥቂት ቀናት በኋላ እርሱ እንደገና ወደ ቅፍርናሆም ገባ፤ በቤት[a] እንዳለም ተሰማ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በአንድ ቤት ውስጥ።”
    reason: ἐν οἴκῳ የሚለው ሐረግ ቤት ውስጥ መገኘትን ወይም በቤት መሆንን ሊገልጽ ይችላል፤ የቤቱን ባለቤት አይወስንም።
lexical_decisions:
- source_word: εἰσελθὼν
  choice: ገባ
  rationale: የግሪኩ ያለፈ ጊዜ አድራጊ አንቀጽ ከዋናው ግስ በፊት የሆነውን ድርጊት ያመለክታል፤ በአማርኛ ትረካ ግን የጊዜውን ቅደም ተከተል በተፈጥሯዊ ሁኔታ ለማቅረብ “ገባ” ተብሏል።
- source_word: πάλιν
  choice: እንደገና
  rationale: መመለስን ወይም ድርጊቱ ዳግመኛ መፈጸሙን የሚገልጥ የተለመደ አማርኛ አቻ ነው።
- source_word: Καφαρναούμ
  choice: ቅፍርናሆም
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደው የቦታው ስም አጻጻፍ ነው።
- source_word: δι’ ἡμερῶν
  choice: ከጥቂት ቀናት በኋላ
  rationale: የተወሰኑ ቀናት ካለፉ በኋላ የሚለውን ያልተወሰነ የጊዜ ርቀት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἠκούσθη
  choice: ተሰማ
  rationale: በግሪኩ ያለውን ግለሰብ ያልተጠቀሰበትን ተደራጊ የወሬ አገላለጽ ይጠብቃል።
- source_word: ἐν οἴκῳ
  choice: በቤቱ
  rationale: በዐውዱ የሚታወቅ ቤት ወይም የማረፊያ ቤት ሊያመለክት ይችላል፤ “በቤቱ” በአማርኛ ተፈጥሯዊ ሲሆን፣ “በአንድ ቤት” የሚለው ይበልጥ ቃል በቃል አማራጭ በማስታወሻ ቀርቧል።
- source_word: ἐστίν
  choice: እንዳለ
  rationale: የግሪኩን የአሁን ጊዜ ቅርጽ በተዘዋዋሪ ንግግር ውስጥ ይጠብቃል፤ ከ“ተሰማ” ጋርም ተፈጥሯዊ ነው።
theological_decisions:
- issue: ἐν οἴκῳ የኢየሱስን የገዛ መኖሪያ ቤት ወይም በአጠቃላይ አንድን ቤት ማመልከቱ
  choice: በቤቱ
  alternative: በአንድ ቤት
  rationale: ዐውዱ ለአንባቢው የሚታወቅ ቤት መሆኑን ሊያመለክት ቢችልም፣ የግሪኩ ሐረግ ባለቤትነቱን በግልጽ አይወስንም። ስለዚህ ዋናው ጽሑፍ ተፈጥሯዊውን አገላለጽ ይዞ፣ ያልተወሰነውን አማራጭ በማስታወሻ ያሳያል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ የትረካ አማርኛ ተጠቅሟል። “እርሱ” የተጨመረው በአማርኛ አረፍተ ነገር የተሳቢውን ማጣቀሻ ግልጽ ለማድረግ ነው፤ አዲስ መረጃ አይጨምርም።
