base_translation:
  language: en
  yaml_path: translation/nt/mark/002/021.yaml
  text: No one sews a patch of unshrunk cloth onto an old garment[a]; otherwise[b], the patch pulls away from it—the new from the old—and a worse tear results.
translation:
  language: am
  text: ማንም ያልተኮማተረ ጨርቅ ቁራጭን በአሮጌ ልብስ ላይ አይሰፋም፤[a] አለዚያ አዲሱ መጠገኛ ከአሮጌው ልብስ ይነቀላል፤ መቀደዱም ይባስ ይሆናል።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ያልተኮማተረ” የሚለው፣ ገና ተገቢውን የማጠናቀቂያ ሂደት ያላለፈና ከታጠበ በኋላ ሊኮማተር የሚችል ጨርቅ ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “መሙያውን ከእሱ፣ አዲሱ ከአሮጌው፣ ይወስዳል፤ የባሰ መቀደድም ይሆናል።” ሐሳቡ አዲሱ መጠገኛ ከአሮጌው ልብስ ተነቅሎ ቀዳዳውን ይበልጥ እንደሚያሰፋ ነው።
    reason: lexical_alternative
