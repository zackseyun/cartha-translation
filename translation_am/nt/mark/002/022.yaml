  text: καὶ οὐδεὶς βάλλει οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή, ⸂ῥήξει ὁ οἶνος⸃ τοὺς ἀσκούς, καὶ ὁ οἶνος ⸂ἀπόλλυται καὶ οἱ ἀσκοί⸃. ἀλλὰ οἶνον νέον εἰς ἀσκοὺς ⸀καινούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/022.yaml
  text: And no one puts new wine into old wineskins[a]. Otherwise, the wine will burst the wineskins, and the wine is ruined, and the wineskins too[b]. But new wine is for fresh wineskins.
translation:
  language: am
  text: አዲስ የወይን ጠጅ ባረጁ የቆዳ ከረጢቶች[a] ውስጥ የሚያደርግ ማንም የለም። አለዚያ የወይን ጠጁ ከረጢቶቹን ይቀድዳቸዋል፤ የወይን ጠጁም ይባክናል[b]፣ ከረጢቶቹም ይጠፋሉ። ነገር ግን አዲስ የወይን ጠጅ ለአዲስ የቆዳ ከረጢቶች ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: እነዚህ ከእንስሳት ቆዳ ተሠርተው የወይን ጠጅ ለማስቀመጥ ያገለግሉ የነበሩ ከረጢቶች ናቸው።
    reason: cultural_clarification
  - marker: b
    text: ወይም፣ “ይጠፋል።”
    reason: lexical_alternative
lexical_decisions:
- source_word: βάλλει
  choice: ያደርግ
  rationale: በዕቃ ውስጥ ስለማስገባት በተነገረበት በዚህ አውድ፣ አጠቃላዩን የግሪክ ግስ ሳያጠብ ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: οἶνον νέον
  choice: አዲስ የወይን ጠጅ
  rationale: ገና የተሠራና በመፍላት ላይ ያለ የወይን ጠጅን የሚያመለክተውን ምስል ይጠብቃል።
- source_word: ἀσκούς
  choice: የቆዳ ከረጢቶች
  rationale: የግሪኩ ቃል ፈሳሽ ለመያዝ የሚያገለግል ከእንስሳት ቆዳ የተሠራ ዕቃን ያመለክታል፤ ይህ አተረጓጎም ባህላዊውን ምስል ግልጽ ያደርገዋል።
- source_word: παλαιούς
  choice: ባረጁ
  rationale: ዕቃዎቹ ያረጁ መሆናቸውን በቀጥታ ይገልጣል፣ ያልተጠቀሰውን 'ያለቁ' የሚል ሐሳብም አይጨምርም።
- source_word: ῥήξει
  choice: ይቀድዳቸዋል
  rationale: የሚፈላው ጠጅ በቆዳው ዕቃ ላይ ግፊት አድርጎ እንደሚቀደው በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἀπόλλυται
  choice: ይባክናል
  rationale: በዚህ አውድ የወይን ጠጁ ከጥቅም ውጭ ሆኖ እንደሚጠፋ ያስተላልፋል፤ 'ይጠፋል' የሚለው ይበልጥ ቀጥተኛ አማራጭ በማስታወሻ ተጠቅሷል።
- source_word: καινούς
  choice: አዲስ
  rationale: ከአረጁት የቆዳ ከረጢቶች ጋር ያለውን ግልጽ ንፅፅር ይጠብቃል፤ ቃሉ በጥራት አዲስ ወይም ትኩስ የመሆንን ሐሳብ ሊይዝ ይችላል።
theological_decisions:
- issue: የመጨረሻው ሐረግ ግስ የሌለው አጭር አነጋገር መሆኑ
  choice: “አዲስ የወይን ጠጅ ለአዲስ የቆዳ ከረጢቶች ነው” ተብሎ እንደ አጠቃላይ መርሕ ተተርጉሟል።
  alternative: “አዲስ የወይን ጠጅ በአዲስ የቆዳ ከረጢቶች ውስጥ መደረግ አለበት።”
  rationale: በግሪኩ የመጨረሻ ሐረግ ግልጽ ግስ የለውም። እንደ አጠቃላይ መርሕ ማቅረቡ ምሳሌያዊውን አጭርነት ይጠብቃል፣ በጽሑፉ ያልተገለጸውን የግዴታ ትርጉምም አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የቆዳ ከረጢት የሚለው ባህላዊ ምስል ተጠብቆ በአጭር ማስታወሻ ተብራርቷል።
