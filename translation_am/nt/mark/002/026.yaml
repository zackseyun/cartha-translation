  rationale: οἶκος τοῦ θεοῦን ቀጥተኛና በአማርኛ የተለመደ ቅዱስ አገላለጽ በመጠቀም ይጠብቃል።
- source_word: ἐπὶ Ἀβιαθὰρ ἀρχιερέως
