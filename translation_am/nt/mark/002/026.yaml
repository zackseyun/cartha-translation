- source_word: οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ τοὺς ἱερεῖς
  choice: ከካህናት በቀር ማንም ሊበላው ያልተፈቀደውን
  rationale: የἔξεστινን ሕጋዊና ሥርዓታዊ ፈቃድ በተፈጥሯዊ አማርኛ ይገልጻል፤ ልዩነቱ ለካህናት ብቻ መሆኑንም ግልጽ ያደርጋል።
