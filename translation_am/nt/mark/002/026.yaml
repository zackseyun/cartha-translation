  rationale: ἐπί ከባለቤት አገባብ ጋር ያለውን ሰፊ ጊዜያዊ ትርጉም ይጠብቃል፤ አብያታር በዚያው ቅጽበት ሊቀ ካህናት ነበር የሚል ጠባብ የዘመን ውሳኔ አያስገባም።
