base_translation:
  language: en
  yaml_path: translation/nt/mark/002/026.yaml
  text: how he entered into the house of God in the time of Abiathar the high priest[a], and ate the bread of the Presence, which it is not lawful to eat except for the priests[b], and also gave some to those who were with him?
translation:
  language: am
  text: በሊቀ ካህኑ አብያታር ዘመን[a] ወደ እግዚአብሔር ቤት እንዴት እንደገባ፣ ከካህናት በቀር ማንም ሊበላው ያልተፈቀደውን በእግዚአብሔር ፊት የሚቀርበውን እንጀራ[b] እንደበላ፣ ከእርሱም ጋር ለነበሩት እንደሰጠ አላነበባችሁምን?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አብያታር ሊቀ ካህን በነበረበት ጊዜ።” ይህ ሐረግ በሰፊ መልኩ ከሊቀ ካህኑ አብያታር ጋር የተያያዘውን ዘመን ወይም የትረካውን አውድ ሊያመለክት ይችላል።
    reason: alternative_reading
  - marker: b
    text: ይህ በመቅደሱ በእግዚአብሔር ፊት የሚቀመጠውን የተቀደሰ እንጀራ ያመለክታል።
    reason: cultural_note
