id: MRK.2.25
reference: Mark 2:25
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ⸀λέγει αὐτοῖς· Οὐδέποτε ἀνέγνωτε τί ἐποίησεν Δαυὶδ ὅτε χρείαν ἔσχεν καὶ ἐπείνασεν αὐτὸς καὶ οἱ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/025.yaml
  text: And he said to them, “Have you never read what David did when he was in need and was hungry, he and those with him?”
translation:
  language: am
  text: እርሱም፣ “ዳዊት በተቸገረበትና እርሱና ከእርሱ ጋር የነበሩት በተራቡበት ጊዜ፣ ምን እንዳደረገ ፈጽሞ አላነበባችሁምን?” አላቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χρείαν ἔσχεν
  choice: በተቸገረ
  rationale: የግሪኩን ‘እጥረት/አስፈላጊነት ነበረበት’ ሐሳብ በተፈጥሯዊና በዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἐπείνασεν
  choice: በተራበ
  rationale: ግሱን በቀጥታ ይገልጻል፤ ‘ተቸገረ’ ከሚለውም የተለየ ሐሳብ መሆኑን ይጠብቃል።
- source_word: Οὐδέποτε ἀνέγνωτε
  choice: ፈጽሞ አላነበባችሁምን?
  rationale: አሉታዊውን የንግግር ጥያቄና ‘በፍጹም/ከቶ’ የሚለውን አጽንዖት ይጠብቃል።
- source_word: αὐτὸς καὶ οἱ μετ’ αὐτοῦ
  choice: እርሱና ከእርሱ ጋር የነበሩት
  rationale: ዳዊትንና አብረውት የነበሩትን በግልጽ ሁኔታ ይለያል።
theological_decisions:
- issue: የዳዊት ችግርና ረሃብ ግንኙነት
  choice: ‘በተቸገረና በተራበ ጊዜ’ በማለት ሁለቱንም ግሶች ተጠብቀዋል።
  alternative: ‘በተራበ ጊዜ’ ብቻ ማለት
  rationale: ምንጩ χρείαν ἔσχεν እና ἐπείνασεν የሚሉትን ሁለት ተያያዥ ግን የተለያዩ መግለጫዎች ይዟል።
- issue: ‘ምን አደረገ’ የሚለው ርዕሰ ጉዳይ
  choice: በአማርኛ የቡድኑን ድርጊት በተፈጥሯዊ አገባብ ‘ምን እንዳደረጉ’ ተብሏል።
  alternative: የግሪኩን ነጠላ ቁጥር በጥብቅ በመከተል ‘ዳዊት ምን እንዳደረገ’ ማለት
  rationale: ግሪኩ ἐποίησεν በነጠላ ቁጥር ዳዊትን ዋና ተዋናይ ያደርጋል፤ ሆኖም αὐτὸς καὶ οἱ μετ’ αὐτοῦ በረሃቡ ውስጥ ቡድኑን ያካትታል። የአማርኛው ብዙ ቁጥር አገባቡን ያለሰልሳል፣ ግን ዳዊትን የስሙ ተጠቃሽ በማድረግ ዋናነቱን ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የጥያቄ ኃይልና የ‘ፈጽሞ’ አጽንዖት ተጠብቋል፤ የግርጌ ማስታወሻ አላስፈለገም።
