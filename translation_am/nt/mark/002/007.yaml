base_translation:
  language: en
  yaml_path: translation/nt/mark/002/007.yaml
  text: Why does this man speak like this? He is blaspheming! Who can forgive sins except God alone?[a][b]
translation:
  language: am
  text: “ይህ ሰው ለምን እንዲህ ይናገራል? ስድብ ይናገራል! ከእግዚአብሔር ብቻ በቀር ኃጢአቶችን ይቅር ማለት የሚችል ማን ነው?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከአንዱ እግዚአብሔር በቀር።”
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ... λαλεῖ
  choice: የሚናገረው ለምንድር ነው?
  rationale: Τί በዚህ አገባብ የንግግሩን ይዘት ‘ምን?’ ብሎ ከመጠየቅ ይልቅ ምክንያቱን ‘ለምን?’ ብሎ የሚጠይቅ ስለሆነ፣ ተፈጥሯዊው የአማርኛ አገላለጽ ተመርጧል።
- source_word: οὗτος
  choice: ይህ ሰው
  rationale: ጠቋሚው ቃል ኢየሱስን በርቀት የሚጠቅስ ቢሆንም፣ በግሪኩ ከተገለጠው በላይ ንቀትን ሳይጨምር ‘ይህ ሰው’ በተፈጥሯዊ አማርኛ ያስተላልፈዋል።
- source_word: οὕτως
  choice: እንዲህ
  rationale: የኢየሱስን የንግግር አይነትና ይዘት የሚመለከተውን ተቃውሞ በአጭርና ተፈጥሯዊ መንገድ ይገልጣል።
- source_word: βλασφημεῖ
  choice: ይሳደባል
  rationale: በዚህ አውድ ቃሉ በእግዚአብሔር ላይ የተደረገ የስድብ ክስን ይገልጣል። ‘ይሳደባል’ በዘመናዊ አማርኛ የክሱን ክብደት ይጠብቃል።
- source_word: τίς δύναται
  choice: የሚችል ማን ነው?
  rationale: ችሎታንና ሥልጣንን የሚጠይቀውን የግሪክ አገላለጽ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἀφιέναι ἁμαρτίας
  choice: ኃጢአትን ይቅር ማለት
  rationale: ἀφίημι ከἁμαρτίας ጋር በዚህ አውድ ‘ኃጢአትን ይቅር ማለት’ ማለት ነው፤ ቀጥተኛ የቃል ትርጉሞች የታሰበውን ፍቺ ያደበዝዛሉ።
- source_word: εἰ μὴ εἷς ὁ θεός
  choice: ከአንዱ ከእግዚአብሔር በቀር
  rationale: የግሪኩን የማግለል አገባብ እና εἷς የሚለውን ‘አንድ’ በግልጽ መያዝ ያስችላል፤ ‘እግዚአብሔር ብቻ’ የሚለው ተፈጥሯዊ አማራጭ ቢሆንም፣ በዚህ ረቂቅ እትም የቃሉ መገኘት ተጠብቋል።
theological_decisions:
- issue: οὗτος የንቀት ድምፅ ምን ያህል እንዲኖረው
  choice: ይህ ሰው
  alternative: ይህ፤ ይህ ግለሰብ
  rationale: የጸሐፍትን ተቃዋሚና የርቀት አቀራረብ ያሳያል፣ ነገር ግን ግሪኩ በግልጽ ያልጨመረውን ከባድ ንቀት አያስገባም።
- issue: βλασφημεῖ የሚያቀርበው ሥነ መለኮታዊ ክስ
  choice: ይሳደባል!
  alternative: ስድብ ይናገራል!፤ እግዚአብሔርን ይሳደባል!
  rationale: የጸሐፍትን ክስ እንደ ክስ ይጠብቃል፤ ‘እግዚአብሔርን’ በጽሑፉ ውስጥ መጨመር የታሰበውን ፍቺ ቢያብራራም በግሪኩ ያልተገለጸ ተሳቢ ያስገባል። ትርጉሙም ስለ ኢየሱስ ማንነት ያለውን ትረካዊ ውጥረት አይፈታም።
- issue: εἷς ὁ θεός እንደ ‘እግዚአብሔር ብቻ’ ወይም ‘አንዱ እግዚአብሔር’ መተርጎም
  choice: ከአንዱ ከእግዚአብሔር በቀር
  alternative: ከእግዚአብሔር ብቻ በቀር
  rationale: εἷς የሚለውን የቁጥር/ብቸኝነት አጽንዖት በዋናው ጽሑፍ ይጠብቃል፤ ተፈጥሯዊው የአማርኛ አማራጭ በማስታወሻ ቀርቧል።
