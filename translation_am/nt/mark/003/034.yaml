  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ περιβλεψάμενος ⸂τοὺς περὶ αὐτὸν κύκλῳ⸃ καθημένους λέγει· Ἴδε ἡ μήτηρ μου καὶ οἱ ἀδελφοί μου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/034.yaml
  text: And looking around at those seated around him in a circle[a], he says, “Behold, my mother and my brothers!”
translation:
  language: am
  text: በዙሪያው በክብ ተቀምጠው የነበሩትን በዙሪያው ቃኝቶ፣ “እነሆ፣ እናቴና ወንድሞቼ!” ይላል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: ዙሪያውን ተመልክቶ
  rationale: የኢየሱስን ሆን ብሎ በዙሪያው ወዳሉት ሰዎች መመልከት በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: τοὺς περὶ αὐτὸν κύκλῳ καθημένους
  choice: በዙሪያው በክብ ተቀምጠው የነበሩትን
  rationale: περὶ αὐτόν፣ κύκλῳ እና καθημένους የሚያመለክቱትን በእርሱ ዙሪያ መሆንን፣ የክብ አቀማመጥንና መቀመጣቸውን ሁሉ ይጠብቃል።
- source_word: λέγει
  choice: ይላል
  rationale: የማርቆስን ሕያው ታሪካዊ የአሁን ጊዜ አገላለጽ ይጠብቃል።
- source_word: Ἴδε
  choice: እነሆ
  rationale: ትኩረትን የሚጠራውን አመልካች ኃይል በክቡርና በተለመደ የመጽሐፍ ቅዱስ አማርኛ ይገልጣል።
- source_word: μήτηρ
  choice: እናቴ
  rationale: መደበኛውን የዘመድነት ትርጉምና የመጀመሪያ መደብ ባለቤትነትን በግልጽ ሁኔታ ይጠብቃል።
- source_word: ἀδελφοί
  choice: ወንድሞቼ
  rationale: የግሪክኛውን ወንድ ፆታ ብዙ ቁጥር ቅርጽ በዋናው ጽሑፍ ይጠብቃል፤ ቃሉ ሴቶችንም ሊያካትት የሚችልበት ሰፊ አጠቃቀም በማስታወሻ ተገልጿል።
theological_decisions:
- issue: ሴቶችንም ሊያካትት በሚችል ቡድን ውስጥ የἀδελφοί ፆታዊ አገላለጽ
  choice: ወንድሞቼ
  alternative: ወንድም እህቶቼ
  rationale: ዋናው ጽሑፍ የምንጩን ሰዋሰዋዊ ቅርጽ ይጠብቃል፤ በኢየሱስ ዙሪያ ያለው ቡድን ሴቶችንም ሊያካትት የሚችልበትን እውነተኛ ስፋት ግን ማስታወሻው ሳይደብቅ ያቀርባል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር አማርኛ ተጠቅሟል። “እነሆ” የἼδεን የትኩረት ጥሪ ይጠብቃል፤ “ይላል” ደግሞ የማርቆስን ታሪካዊ የአሁን ጊዜ ዘይቤ ያቆያል።
