- from: በዙሪያው በክብ ተቀምጠው የነበሩትን ዙሪያውን ተመልክቶ፣ “እነሆ፣ እናቴና ወንድሞቼ[a]!” ይላል።
  to: በዙሪያው በክብ ተቀምጠው የነበሩትን በዙሪያው ቃኝቶ፣ “እነሆ፣ እናቴና ወንድሞቼ!” ይላል።
