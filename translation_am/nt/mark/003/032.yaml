base_translation:
  language: en
  yaml_path: translation/nt/mark/003/032.yaml
  text: And a crowd was sitting around him[a], and they said to him, “Look, your mother and your brothers are outside looking for you.”
translation:
  language: am
  text: ብዙ ሕዝብም በዙሪያው ተቀምጦ ነበር፤ እነርሱም፣ “እነሆ፣ እናትህና ወንድሞችህ ውጭ ሆነው እየፈለጉህ ነው[a]” አሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሊያገኙህ እየፈለጉ ነው።” የግሪኩ ግስ “መፈለግ” ወይም “መሻት” ማለት ሊሆን ይችላል፤ እዚህ ግን በአካል ሊያገኙት መሞከራቸውን የሚያመለክት ይመስላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάθητο
  choice: ተቀምጦ ነበር
  rationale: የግሪኩ ያልተፈጸመ ጊዜ በዚህ ስፍራ በሂደት ላይ የነበረውን ትዕይንት ያሳያል፤ ይህ አተረጓጎም ያንን ቀጣይነት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: περὶ αὐτὸν ὄχλος
  choice: ብዙ ሕዝብም በዙሪያው
  rationale: περί ከተሳቢ ሙያ ጋር እዚህ ቦታዊ መክበብን ያመለክታል፤ “በዙሪያው” ይህን ምስል በግልጽ ያቀርባል። ὄχλος ደግሞ በተፈጥሯዊ መንገድ “ብዙ ሕዝብ” ተብሏል።
- source_word: λέγουσιν
  choice: አሉት
  rationale: በግሪክ ያለው ታሪካዊ የአሁን ጊዜ በአማርኛ ትረካ በተፈጥሯዊ ያለፈ ጊዜ ተተርጉሟል።
- source_word: Ἰδοὺ
  choice: እነሆ
  rationale: ቃሉ ትኩረትን የሚስብ የንግግር ምልክት ነው፤ “እነሆ” በክቡር ነገር ግን ሊገባ በሚችል አማርኛ ይህን ኃይል ይጠብቃል።
- source_word: μήτηρ
  choice: እናት
  rationale: ቀጥተኛና የተለመደ የዝምድና ቃል ነው።
- source_word: ἀδελφοί
  choice: ወንድሞች
  rationale: የግሪኩ ቃል በሰዋስው ወንድ ብዙ ቁጥር ነው፤ ጥቅሱ ራሱ የዝምድናውን ትክክለኛ ባሕርይ ስለማያብራራ፣ ያለ ትርጓሜያዊ መስፋፋት “ወንድሞች” ተብሏል።
- source_word: ἔξω
  choice: ውጭ ሆነው
  rationale: “ውጭ” የቦታውን ትርጉም በቀጥታ ይሰጣል፤ “ሆነው” በአማርኛ ዓረፍተ ነገሩን ተፈጥሯዊ ያደርገዋል።
- source_word: ζητοῦσίν σε
  choice: እየፈለጉህ ነው
  rationale: ζητέω “መፈለግ” ወይም “ማፈላለግ” ሊል ይችላል፤ በዚህ ትዕይንት “እየፈለጉህ ነው” ተፈጥሯዊ ሲሆን የቃሉን ስፋትም ይጠብቃል።
theological_decisions:
- issue: የ“ወንድሞች” ማጣቀሻ
  choice: ἀδελφοίን “ወንድሞች” ብሎ ያለ ትርጓሜያዊ ጭማሪ ማቅረብ
  alternative: “ዘመዶች” ወይም “ወንድም እህቶች” ብሎ ማስፋት
  rationale: ጥቅሱ የተለመደውን የዝምድና ቃል ይጠቀማል እንጂ የኢየሱስን ቤተሰባዊ ግንኙነት በሥነ መለኮታዊ መንገድ አይተረጉምም። ስለዚህ የቤተ እምነት ልዩ አቋም ሳይገባ ቀጥተኛው የቃል ትርጉም ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። የትዕይንቱን ቀጣይነት “ተቀምጦ ነበር” በማለት፣ ትኩረት ሰጪውን ἰδού ደግሞ “እነሆ” በማለት ጠብቋል።
