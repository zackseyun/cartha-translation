base_translation:
  language: en
  yaml_path: translation/nt/mark/003/035.yaml
  text: For whoever does the will of God, this one is my brother and sister and mother.
translation:
  language: am
  text: የእግዚአብሔርን ፈቃድ የሚፈጽም ማንም ቢሆን፣ ይህ ሰው[a] ወንድሜም እህቴም እናቴም ነውና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ‘ይህኛው ሰው።’ በግሪክ አጽንዖት ያለው አመልካች ተውላጠ ስም አለ፤ ቃል በቃል ‘ይህኛው’ ማለት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ... ἂν ποιήσῃ
  choice: የሚፈጽም ማንም ቢሆን
  rationale: የዝምድና ተውላጠ ስም፣ ἄν እና የንዑስ አንቀጽ ግስ በአንድነት ያልተወሰነ አጠቃላይ ሁኔታን ይገልጣሉ፤ ይህ አገላለጽ ‘ማንም ቢሆን’ በሚል ተፈጥሯዊ አማርኛ ተላልፏል።
- source_word: γὰρ
  choice: ነውና
  rationale: γάρ ከቀደመው ንግግር ጋር የምክንያት ወይም የማብራሪያ ግንኙነት ይፈጥራል፤ በአማርኛ ከአረፍተ ነገሩ መጨረሻ ጋር የተያያዘው ‘-ና’ ይህን በተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: ποιήσῃ
  choice: የሚፈጽም
  rationale: በዚህ አውድ ποιέω ፈቃድን መፈጸም ወይም በተግባር ማዋልን ያመለክታል።
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: የእግዚአብሔርን ፈቃድ
  rationale: የግሪኩን የባለቤትነት ግንኙነት በግልጽና በተለመደ መጽሐፍ ቅዱሳዊ አማርኛ ይገልጣል።
- source_word: οὗτος
  choice: ይህ ሰው
  rationale: የማመልከቻውን አጽንዖት ይጠብቃል፤ ‘ሰው’ ደግሞ ወንድን ብቻ እንዳያመለክት ያደርጋል።
- source_word: ἀδελφός μου καὶ ἀδελφὴ καὶ μήτηρ
  choice: ወንድሜም እኅቴም እናቴም
  rationale: ሦስቱንም የዝምድና ስሞች በግልጽ ያቆያል፤ ተደጋጋሚው καί በ‘-ም ... -ም ... -ም’ ተላልፎ የዝርዝሩን ድምር አጽንዖት ይጠብቃል።
- source_word: ἐστίν
  choice: ነው
  rationale: ከነጠላው ‘ይህ ሰው’ ጋር የሚስማማ ቀጥተኛ የአገናኝ ግስ ነው።
theological_decisions:
- issue: በተቀላቀሉ የፆታ ዝምድና ስሞች ፊት ያለው ነጠላ ባለቤት
  choice: ይህ ሰው
  alternative: እርሱ
  rationale: ግሪኩ ሰዋሰዋዊ ተባዕታይ ነጠላ ቅርጽ ቢጠቀምም፣ ከዚያ በኋላ ‘ወንድም፣ እኅት፣ እናት’ ይላል። ‘ይህ ሰው’ የοὗτοςን አጽንዖት ጠብቆ ትርጉሙን ለወንድ ብቻ እንዳይገድብ ያደርጋል።
- issue: የኢየሱስ የቤተሰብ ንግግር ባሕርይ
  choice: ወንድሜም እኅቴም እናቴም
  alternative: የቤተሰቤ አባል
  rationale: ግልጽ የዝምድና ስሞቹ የእግዚአብሔርን ፈቃድ በመፈጸም ዙሪያ የቤተሰብ አባልነትን እንደገና የሚገልጸውን ሥነ ንግግራዊና ሥነ መለኮታዊ ኃይል ይጠብቃሉ።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘እኅት’ የሚለው መደበኛ የመጽሐፍ ቅዱስ አጻጻፍ ሲሆን ንግግሩን ጥንታዊ አያደርገውም።
