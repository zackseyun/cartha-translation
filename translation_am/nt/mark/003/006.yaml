- from: ፈሪሳውያንም ወጥተው ወዲያውኑ ከሄሮድስ ወገኖች ጋር በእርሱ ላይ መከሩ፤ እንዴት እርሱን እንደሚያጠፉት[a] ዕቅድ አወጡ።
