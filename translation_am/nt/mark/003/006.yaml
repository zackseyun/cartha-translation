base_translation:
  language: en
  yaml_path: translation/nt/mark/003/006.yaml
  text: And the Pharisees went out and immediately began plotting with the Herodians against him[a], how they might destroy him.
translation:
  language: am
  text: ፈሪሳውያንም ወጥተው ወዲያውኑ ከሄሮድሳውያን ጋር እርሱን እንዴት እንደሚያጠፉት በእርሱ ላይ ምክር አደረጉ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθόντες
  choice: ወጥተው
  rationale: የግሪኩ የቀደመ ድርጊት አመልካች ተሳቢ ግስ በአማርኛ ተከታታይ ድርጊትን በተፈጥሮ በሚገልጽ አገባብ ተተርጉሟል።
- source_word: εὐθὺς
  choice: ወዲያውኑ
  rationale: ማርቆስ በተደጋጋሚ የሚጠቀምበትን የአስቸኳይነት ኃይል በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: μετὰ τῶν Ἡρῳδιανῶν
  choice: ከሄሮድስ ወገኖች ጋር
  rationale: μετά ኅብረትን ያመለክታል፤ Ἡρῳδιανοί ደግሞ ከሄሮድስ ቤተ መንግሥት ፍላጎት ጋር የተሰለፉትን ወገኖች ይጠቅሳል። ይህ አገላለጽ ለተራው አንባቢ ከቀጥተኛ ትርጉመ ድምፅ ይበልጥ ግልጽ ነው።
- source_word: συμβούλιον ἐδίδουν
  choice: መከሩ፤ … ዕቅድ አወጡ
  rationale: ይህ የግሪክ ፈሊጥ ምክክር ማድረግንና ዕቅድ መያዝን ያመለክታል። ዐውደ ንባቡ የጥላቻ ዓላማ ስላለው፣ ሁለቱ አገላለጾች የምክክሩን የሴራ ባሕርይ በግልጽ ያሳያሉ።
- source_word: κατ’ αὐτοῦ
  choice: በእርሱ ላይ
  rationale: κατά እዚህ የተቃውሞና የጥላቻ አቅጣጫ አለው፤ የአማርኛው አገላለጽም ይህን በተፈጥሮ ያስተላልፋል።
- source_word: ὅπως
  choice: እንዴት … እንደሚያጠፉት
  rationale: ከቀጣዩ ንዑስ አንቀጽ ጋር የታሰበውን ዓላማና ዘዴ ያሳያል፤ ‘እንዴት’ የምክክሩን የዘዴ ፍለጋ ገጽታ ይጠብቃል።
- source_word: ἀπολέσωσιν
  choice: እንደሚያጠፉት
  rationale: ἀπόλλυμι ማጥፋት፣ ማጥፋትን ማስከተል ወይም መግደል ሊያመለክት ይችላል። ‘ማጥፋት’ ሰፊውን የቃሉን ክልል ይጠብቃል፤ በዚህ ዐውድ ግን የግድያ ዓላማ እንዳለው የግርጌ ማስታወሻው ያብራራል።
theological_decisions:
- issue: የመሪዎቹን ዓላማ በዋናው ጽሑፍ በቀጥታ ‘መግደል’ ብሎ መግለጽ ወይም የግሪኩን ሰፊ ትርጉም መጠበቅ
  choice: በዋናው ጽሑፍ ‘ማጥፋት’ የሚለውን ሰፊ አገላለጽ መጠበቅ
  alternative: ‘ሊገድሉት’ ወይም ‘ለሞት ሊዳርጉት’
  rationale: ዐውደ ንባቡ የግድያ ዓላማን በጠንካራ ሁኔታ ቢያመለክትም፣ ἀπόλλυμι ከ‘መግደል’ የሰፋ የትርጉም ክልል አለው። ስለዚህ ዋናው ጽሑፍ ይህን ስፋት ይጠብቃል፣ የግርጌ ማስታወሻውም በዐውዱ ያለውን ግልጽ የሞት ዓላማ ያቀርባል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ከሄሮድስ ወገኖች’ የቡድኑን ግንኙነት ያብራራል፤ የግሪኩ የትርጉም ስፋትና የዐውዱ የግድያ አንድምታ በዋና ጽሑፍና በግርጌ ማስታወሻ ተመጣጥነው ቀርበዋል።
