review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the principal elements of the Greek: the Pharisees'' departure, immediacy, association with the Herodians, hostile deliberation against Jesus, and the broad sense of ἀπολέσωσιν. However, “መከሩ … ዕቅድ አወጡ” renders one Greek idiom twice and adds a completed planning action beyond the source’s single imperfect expression.'
  naturalness: The proposed sentence is understandable, but the paired predicates “መከሩ፤ … ዕቅድ አወጡ” are redundant and make the sentence less natural. A single expression, “በእርሱ ላይ ምክር አደረጉ,” is idiomatic, clear, and sufficiently conveys hostile consultation in context.
  terminology: “ሄሮድስ ወገኖች” is explanatory but does not retain the conventional group designation as well as “ሄሮድሳውያን.” The latter is the standard Amharic form for Ἡρῳδιανοί and avoids suggesting merely any persons sympathetic to Herod. “ማጥፋት” appropriately retains the lexical breadth of ἀπόλλυμι; the footnote properly gives the contextually explicit lethal alternatives.
  issues:
  - severity: medium
    issue: The Greek idiom συμβούλιον ἐδίδουν is translated twice.
    rationale: “መከሩ” and “ዕቅድ አወጡ” duplicate the one source expression and the latter may imply a settled plan, whereas the imperfect describes their deliberating/taking counsel.
  - severity: low
    issue: The group name is paraphrased rather than represented by its standard designation.
    rationale: “ከሄሮድሳውያን ጋር” is a recognizable conventional rendering of Ἡρῳδιανοί and is more precise than the broad phrase “ከሄሮድስ ወገኖች ጋር.”}],
  - severity: low
    issue: The infinitive-like purpose/how clause is separated from the deliberation by an unnecessary second clause.
    rationale: Keeping “እርሱን እንዴት እንደሚያጠፉት” directly with “ምክር አደረጉ” better reflects ὅπως and improves Amharic flow.
  revised_text: ፈሪሳውያንም ወጥተው ወዲያውኑ ከሄሮድሳውያን ጋር እርሱን እንዴት እንደሚያጠፉት በእርሱ ላይ ምክር አደረጉ።
