  terminology: “አእምሮውን ስቷል” clearly conveys the accusation expressed by ἐξέστη without making a clinical diagnosis. The revised footnote retains “ቤተሰቡ” and “የገዛ ሰዎቹ” as possible, but not certain, referents of the Greek idiom.
