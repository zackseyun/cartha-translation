  rationale: The revision replaces the interpretively expanded «ማንነቱን እንዳያሳውቁ» with «እንዳያስታውቁት», preserving the Greek’s direct reference to Jesus and its deliberate lack of specification. It also refines the formal footnote alternative. The rendering retains repeated action («ብዙ ጊዜ») and sternness («አጥብቆ»), without adding a theological identification absent from the verse.
