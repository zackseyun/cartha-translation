  yaml_path: translation/nt/mark/003/012.yaml
  text: And he sternly warned them many times not to make him known[a].
translation:
  language: am
  text: እርሱም እንዳያስታውቁት[a] ብዙ ጊዜ አጥብቆ አስጠነቀቃቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እንዳይገልጡት»፣ «በይፋ እንዳያሳውቁት»፤ በይበልጥ ቃል በቃል፣ «ግልጽ እንዳያደርጉት»።
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ
  choice: ብዙ ጊዜ
  rationale: ከἐπετίμα ጋር በተውሳክ አገልግሎት የተደጋገመ ወይም የጠነከረ ድርጊትን ያመለክታል፤ «ብዙ ጊዜ» የብዙ ቁጥር ኃይሉን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐπετίμα
  choice: አጥብቆ … አስጠነቀቃቸው
  rationale: በዐውዱ ርኩሳን መናፍስትን በሥልጣን የሚከለክል ጠንካራ ትእዛዝ ነው። «አስጠነቀቀ» ከ«አጥብቆ» ጋር የግሱን ጥብቅ ኃይል በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: αὐτοῖς
  choice: -አቸው
  rationale: በቅርብ ዐውድ የተጠቀሱትን ርኩሳን መናፍስት የሚያመለክት የሦስተኛ መደብ ብዙ ቁጥር ተውላጠ ስም ነው።
- source_word: ἵνα μὴ
  choice: እንዳያ-
  rationale: የማስጠንቀቂያውን ይዘትና ክልከላ በተፈጥሯዊ የአማርኛ ንዑስ አረፍተ ነገር ያሳያል።
- source_word: αὐτὸν φανερὸν ποιήσωσιν
  choice: ማንነቱን እንዳያሳውቁ
  rationale: φαινερός ከποιέω ጋር «የታወቀ/የተገለጠ ማድረግ» የሚል ፈሊጣዊ ትርጉም አለው። «ማንነቱን ማሳወቅ» የኢየሱስን ማንነት ለሌሎች መግለጥን በግልጽ አማርኛ ያሳያል፤ የትኛውን የማንነት ማዕረግ እንደሚያመለክት ግን አይጨምርም።
theological_decisions:
- issue: ኢየሱስ ለርኩሳን መናፍስት የሰጠው ትእዛዝ ባሕርይ
  choice: ትእዛዙ የኢየሱስን ማንነት እንዳያሳውቁ የሚከለክል ሆኖ ተተርጉሟል፤ ጥቅሱ ከሚናገረው በላይ ማንነቱን አይወስንም።
  alternative: ትእዛዙ እርሱን በተለይ «የእግዚአብሔር ልጅ» ብለው እንዳይገልጡት ነው፤ ወይም የመሲሐዊ ምስጢር አጽንዖት የሌለው አጠቃላይ የዝምታ ትእዛዝ ነው።
  rationale: የቅርብ ዐውዱ የኢየሱስን ማንነት መግለጥን ይጠቁማል፤ ይህ ጥቅስ ራሱ ግን «የታወቀ እንዳያደርጉት» ብቻ ይላል። ትርጉሙ የተወሰነ ክርስቶሎጂያዊ ማዕረግ ሳይጨምር ይህንን ውጥረት ጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «እርሱም» የግሪክኛውን καὶ እና በዐውዱ የታወቀውን ባለቤት ያቆያል፤ የአማርኛ ቃላት ቅደም ተከተል ግን ለተፈጥሯዊነት ተስተካክሏል።
