id: MRK.3.24
reference: Mark 3:24
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἐὰν βασιλεία ἐφ’ ἑαυτὴν μερισθῇ, οὐ δύναται σταθῆναι ἡ βασιλεία ἐκείνη·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/024.yaml
  text: And if a kingdom is divided against itself, that kingdom cannot stand.
translation:
  language: am
  text: እናም አንድ መንግሥት በራሱ ላይ ቢከፋፈል፣ ያ መንግሥት ሊቆም አይችልም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: አንድ
  rationale: Greek καί links this sentence to the preceding argument, but an explicit Amharic connective would be less natural here; beginning directly with the conditional preserves the flow. አንድ naturally introduces the generic kingdom.
- source_word: ἐὰν
  choice: ቢ-
  rationale: The Amharic conditional prefix ቢ- naturally represents ἐάν with the subjunctive in this general conditional statement.
- source_word: βασιλεία
  choice: መንግሥት
  rationale: መንግሥት conveys a kingdom as a corporate political realm, fitting the analogy better here than an abstract term for reign.
- source_word: ἐφ’ ἑαυτὴν
  choice: በራሱ ላይ
  rationale: This idiomatic expression conveys internal opposition, corresponding to 'against itself,' while retaining the reflexive force.
- source_word: μερισθῇ
  choice: ቢከፋፈል
  rationale: The passive/reflexive Amharic form expresses becoming divided without specifying an external agent and fits the aorist passive subjunctive condition.
- source_word: οὐ δύναται
  choice: አይችልም
  rationale: This is the direct, natural modern Amharic expression of inability.
- source_word: σταθῆναι
  choice: ሊቆም
  rationale: ሊቆም preserves the metaphor of standing while naturally implying continued stability or endurance.
- source_word: ἡ βασιλεία ἐκείνη
  choice: ያ መንግሥት
  rationale: The demonstrative ያ preserves the Greek repetition and points back emphatically to the kingdom in the conditional clause.
theological_decisions:
- issue: Nature of the saying
  choice: Presented as a general conditional principle within Jesus’ argument.
  alternative: Expanded into a broad sociopolitical or doctrinal maxim.
  rationale: The wording retains the proverb-like force but does not add claims about political structures, Satan, or doctrine beyond the immediate statement.
translation_notes:
  register: Modern standard Amharic in Ge’ez script; concise, dignified, and readily understandable. The sentence preserves the kingdom/standing imagery and the internal-division condition without explanatory expansion.
source_grounding:
  english_pob_role: consult_only
