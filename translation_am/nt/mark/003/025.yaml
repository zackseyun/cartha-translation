id: MRK.3.25
reference: Mark 3:25
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἐὰν οἰκία ἐφ’ ἑαυτὴν μερισθῇ, οὐ ⸀δυνήσεται ⸂ἡ οἰκία ἐκείνη σταθῆναι⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/025.yaml
  text: And if a house is divided against itself[a], that house will not be able to stand.
translation:
  language: am
  text: እናም አንድ ቤት[a] በራሱ ላይ ቢከፋፈል፣ ያ ቤት ሊቆም አይችልም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ቤተሰብ” ተብሎም ሊተረጎም ይችላል፤ οἰκία ሁለቱንም ሊያመለክት ቢችልም፣ “ሊቆም” የሚለው ምስል “ቤት” የሚለውን ይደግፋል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκία
  choice: ቤት
  rationale: ቃሉ ሕንፃንም ቤተሰብንም ሊያመለክት ይችላል፤ ከσταθῆναι (‘መቆም’) ጋር ያለው ምስላዊ ግንኙነት ግን ‘ቤት’ን ይደግፋል። በአማርኛም ‘ቤት’ ሁለቱንም ገጽታዎች በመጠኑ ሊይዝ ይችላል።
- source_word: ἐφ’ ἑαυτὴν
  choice: በራሱ ላይ
  rationale: ይህ አገላለጽ በውስጡ የተነሣ ተቃውሞን ያሳያል፤ ‘በራሱ ላይ’ የግሪኩን ምስል ጠብቆ በአማርኛ ተፈጥሯዊ ነው።
- source_word: μερισθῇ
  choice: ቢከፋፈል
  rationale: የግሪኩን አንቀጽ ተገብሮ ቅርጽና አጠቃላይ ሁኔታ ገላጭ አወቃቀር ያስቀምጣል።
- source_word: δυνήσεται
  choice: አይችልም
  rationale: የወደፊት ችሎታ አለመኖርን ይገልጣል፤ በ‘ቢ…’ ሁኔታዊ አወቃቀር ውስጥ ‘ሊ… አይችልም’ ተፈጥሯዊና ትክክለኛ ነው።
- source_word: σταθῆναι
  choice: ሊቆም
  rationale: የመቆምን ቀጥተኛ ምስል ይጠብቃል፤ የመጽናትና ያለመፍረስ ትርጉምም በአውዱ ይገባል።
- source_word: ἡ οἰκία ἐκείνη
  choice: ያ ቤት
  rationale: ἐκείνη ያለውን አመልካችና አጽንዖት ‘ያ’ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: καὶ ἐὰν
  choice: አንድ … ቢ
  rationale: የቁጥሩ አጭር ቅንጭብ በአማርኛ ብቻውን ሲቀርብ ሁኔታዊውን ኃይል ‘ቢ’ በግልጽ ያስተላልፋል፤ መነሻው ካί ግን ከቀዳሚው ቁጥር ጋር በተከታታይ ንባብ ሊተረጎም ይችላል።
