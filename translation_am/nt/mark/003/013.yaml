id: MRK.3.13
reference: Mark 3:13
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Καὶ ἀναβαίνει εἰς τὸ ὄρος καὶ προσκαλεῖται οὓς ἤθελεν αὐτός, καὶ ἀπῆλθον πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/013.yaml
  text: And he went up on the mountain and called to himself those whom he wanted[b][a], and they came to him.
translation:
  language: am
  text: ኢየሱስም ወደ ተራራው ወጣ፤ እርሱ ራሱ የፈለጋቸውን ወደ እርሱ ጠራ፤ እነርሱም ወደ እርሱ ሄዱ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβαίνει
  choice: ወጣ
  rationale: የግሪኩ ቃል ታሪካዊ የአሁን ጊዜ ቅርጽ ቢኖረውም፣ በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜ መጠቀም ይስማማል፤ ‘ወጣ’ የከፍታ አቅጣጫውን ይጠብቃል።
- source_word: εἰς τὸ ὄρος
  choice: ወደ ተራራው
  rationale: ከ‘ወጣ’ ጋር ሲነበብ ወደ ተራራው መውጣትን በተፈጥሯዊ አማርኛ ያሳያል፤ መስተዋድዱም በወሰን ቅጥያው ‘-ው’ ተንጸባርቋል።
- source_word: προσκαλεῖται
  choice: ወደ እርሱ ጠራ
  rationale: መካከለኛው የግስ ቅርጽ የግል ተሳትፎንና ወደ ራሱ መጥራትን ያመለክታል፤ ‘ወደ እርሱ ጠራ’ ይህን ግንኙነታዊ አቅጣጫ በግልጽ ይጠብቃል።
- source_word: οὓς ἤθελεν αὐτός
  choice: እርሱ ራሱ የፈለጋቸውን
  rationale: ግልጹ αὐτός አጽንዖት ስላለው ‘እርሱ ራሱ’ ተብሎ ተጠብቋል፤ ‘የፈለጋቸውን’ ደግሞ θέλωን በተፈጥሯዊና ያልተጋነነ አማርኛ ያቀርባል።
- source_word: ἀπῆλθον πρὸς αὐτόν
  choice: ወደ እርሱ ሄዱ
  rationale: ἀπέρχομαι በመሠረቱ የመሄድን እንቅስቃሴ ሲያመለክት፣ πρὸς αὐτόν አቅጣጫው ወደ ኢየሱስ መሆኑን ያሳያል፤ ‘ሄዱ’ ይህን ከ‘መጡ’ ይልቅ በቅርብ ይጠብቃል።
theological_decisions:
- issue: ኢየሱስ በራሱ ፈቃድ የጠራቸው መሆኑ ላይ ያለው አጽንዖት
  choice: ‘እርሱ ራሱ የፈለጋቸውን’ በማለት የαὐτός አጽንዖት ተጠብቋል።
  alternative: ‘የፈለጋቸውን’ ብቻ ማለት
  rationale: ጥቅሱ የኢየሱስን የግል ተነሳሽነት በግልጽ ያጎላል፤ ነገር ግን ትርጉሙ ከጥቅሱ ቃላት በላይ ሄዶ ስለ ምርጫ የተወሰነ የእምነት ሥርዓት አያስገባም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ይጠቀማል። የግሪኩ ታሪካዊ የአሁን ጊዜ በተፈጥሯዊ የአማርኛ ትረካ ወደ ያለፈ ጊዜ ተለውጧል፤ የαὐτός አጽንዖት ግን ተጠብቋል።
