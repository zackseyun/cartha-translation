  text: καὶ Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν τοῦ Ἰακώβου (καὶ ἐπέθηκεν αὐτοῖς ⸀ὀνόματα Βοανηργές, ὅ ἐστιν Υἱοὶ Βροντῆς),
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/017.yaml
  text: and James the son of Zebedee[a], and John the brother of James (he gave them the name Boanerges, which means Sons of Thunder),
translation:
  language: am
  text: የዘብዴዎስ ልጅ ያዕቆብንና የያዕቆብን ወንድም ዮሐንስንም (እርሱም ቦአኔርጌስ፣ ማለትም «የነጎድጓድ ልጆች»፣ ብሎ ሰየማቸው)።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰάκωβον
  choice: ያዕቆብን
  rationale: በአማርኛ የመጽሐፍ ቅዱስ የስም አጠራር የተለመደውን ቅርጽ ይጠብቃል፤ የግሪኩን የተሳቢ ሁኔታም -ን ያሳያል።
- source_word: τὸν τοῦ Ζεβεδαίου
  choice: የዘብዴዎስን ልጅ
  rationale: የዘር ወይም የአባትነት ግንኙነቱን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Ἰωάννην
  choice: ዮሐንስን
  rationale: በአማርኛ የተለመደውን የስሙን ቅርጽ ይጠቀማል።
- source_word: τὸν ἀδελφὸν τοῦ Ἰακώβου
  choice: የያዕቆብን ወንድም
  rationale: እዚህ ἀδελφός ቀጥተኛ የቤተሰብ ወንድምነትን ያመለክታል።
- source_word: ἐπέθηκεν αὐτοῖς ὀνόματα
  choice: የሚል ስም ሰጣቸው
  rationale: ἐπιτίθημι ከ‘ስም’ ጋር ሲመጣ ‘ስም ሰጠ’ ወይም ‘ሰየመ’ የሚል ፍቺ አለው። አንዱን የጋራ ቅጽል ስም በተፈጥሯዊ አማርኛ ለማቅረብ ነጠላው ‘ስም’ ተመርጧል፤ የግሪኩ ብዙ ቁጥር በማስታወሻ ተገልጿል።
- source_word: Βοανηργές
  choice: ቦአኔርጌስ
  rationale: ጽሑፉ የሴማዊውን ቅጽል ስምና ትርጉሙን ሁለቱንም ስለሚያቀርብ፣ ስሙ ተጽፎ ትርጉሙ ተከትሎ ቀርቧል።
- source_word: ὅ ἐστιν
  choice: ትርጉሙም … ማለት ነው
  rationale: የሚከተለው ሐረግ የቅጽል ስሙ ትርጉም መሆኑን በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Υἱοὶ Βροντῆς
  choice: የነጎድጓድ ልጆች
  rationale: ምስላዊውንና ኃይለኛውን ቅጽል ስም በቀጥታ ይጠብቃል።
