lexical_decisions:
- source_word: ἐποίησεν
  choice: ሾመ
  rationale: ግሱ በቀጥታ ‘አደረገ’ ሊባል ቢችልም፣ በዚህ አውድ ኢየሱስ አሥራ ሁለቱን ለይቶ ቡድን አድርጎ ማቋቋሙን ያመለክታል፤ ‘ሾመ’ ይህን ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τοὺς δώδεκα
  choice: አሥራ ሁለቱን
  rationale: ይህ አገላለጽ ኢየሱስ ለይቶ ያቋቋማቸውን የታወቁትን አሥራ ሁለት ደቀ መዛሙርት ያመለክታል።
- source_word: ἐπέθηκεν ὄνομα
  choice: … የሚል ስም ሰጠው
  rationale: የግሪክኛው ‘ስም ጫነበት’ የሚለውን ፈሊጣዊ አነጋገር የመሰየሙን ድርጊት ግልጽ በሚያደርግ ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: Σίμωνι
  choice: ስምዖን
  rationale: የግል ስሙ በተለመደው የአማርኛ መጽሐፍ ቅዱሳዊ አጻጻፍ ተጽፏል።
- source_word: Πέτρον
  choice: ጴጥሮስ
  rationale: ቃሉ እዚህ የተሰጠ የግል ስም ስለሆነ ትርጉሙን በዋናው ጽሑፍ በመተካት ፈንታ ስሙ በተለመደው የአማርኛ ቅርጽ ቀርቧል፤ የስሙ ትርጉም በማስታወሻ ተገልጿል።
theological_decisions:
- issue: ኢየሱስ ለአሥራ ሁለቱ ያደረገው ድርጊት
  choice: አሥራ ሁለቱንም ሾመ
  alternative: አሥራ ሁለቱንም አደረገ / መረጠ
  rationale: አውዱ ኢየሱስ እነርሱን እንደ ተለየ ቡድን ማቋቋሙን ያሳያል። ‘ሾመ’ ይህን ኃይል ይጠብቃል፣ ነገር ግን በግሪክኛው የሌለ የኋለኛ ዘመን ቤተ ክርስቲያናዊ ማዕረግ አያስገባም።
- issue: Πέτρος እንደ ስም ወይም እንደ ትርጉም መቅረቡ
  choice: ጴጥሮስ
  alternative: ዓለት
  rationale: Πέτρος እዚህ ለስምዖን የተሰጠ የግል ስም ነው። ስለዚህ ስሙ በጽሑፉ ውስጥ ተጠብቆ፣ የቃሉ ፍቺ በማስታወሻ ቀርቧል።
