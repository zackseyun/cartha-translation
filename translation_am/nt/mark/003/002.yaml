base_translation:
  language: en
  yaml_path: translation/nt/mark/003/002.yaml
  text: And they were watching him closely to see whether he would heal him on the Sabbath[a], so that they might accuse him.
translation:
  language: am
  text: እርሱ በሰንበት[a] ያንን ሰው ይፈውሰው እንደሆነ ለማየት፣ እንዲከሱት በቅርብ ይከታተሉት ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ግሪኩ በቃል ቅርጹ “በሰንበታት” የሚል ብዙ ቁጥር ይጠቀማል፤ ይህ ግን አንዱን የሰንበት ቀን በፈሊጣዊ አነጋገር ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: παρετήρουν
  choice: በቅርብ ይከታተሉት ነበር
  rationale: የኢምፐርፌክት ጊዜውን ቀጣይነትና በአውዱ ያለውን ጥንቃቄ የተሞላበት ጠላትነታዊ ክትትል ያሳያል።
- source_word: εἰ
  choice: እንደሆነ ሊያዩ
  rationale: ከመከታተል ግስ በኋላ ያለውን ቀጥተኛ ያልሆነ ጥያቄ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τοῖς σάββασιν
  choice: በሰንበት[a]
  rationale: የግሪኩ ብዙ ቁጥር ቅርጽ በኮይኔ ግሪክ አንዱን የሰንበት ቀን በፈሊጣዊ አገባብ ሊያመለክት ይችላል፤ ነጠላው በዘመናዊ አማርኛ ተፈጥሯዊ ነው፣ የቅርጹ መረጃም በማስታወሻ ተጠብቋል።
- source_word: θεραπεύσει
  choice: ይፈውሰው
  rationale: በቀጥተኛ ያልሆነው ጥያቄ ውስጥ የወደፊት አመልካቹን በአማርኛ በተፈጥሯዊ ሁኔታ ያቀርባል።
- source_word: ἵνα κατηγορήσωσιν αὐτοῦ
  choice: እርሱን ሊከሱት
  rationale: ἵνα የሚያሳየውን የዓላማ ኃይል እና κατηγορέω የሚያመለክተውን ክስ ያለ አስፈላጊነት ወደ መደበኛ የፍርድ ሂደት ሳያጠናክር ይገልጣል።
theological_decisions:
- issue: የተከታታዮቹ ዓላማ አቀራረብ
  choice: ክስ ለማቅረብ ምክንያት የሚፈልግ ጠላትነታዊ ክትትል
  alternative: መደበኛ የፍርድ ክስ ሊመሠርቱበት ወይም ሊከሱት
  rationale: አውዱ ስለ ሰንበት ፈውስ ያለ ግጭትን ያሳያል፤ κατηγορέω የፍርድ ቤት ፍቺ ሊኖረው ቢችልም፣ ጥቅሱ ከመክሰስ በላይ የተደራጀ ሕጋዊ ሂደትን አይገልጽም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “በቅርብ ይከታተሉት ነበር” ቀጣይ እና ጠላትነታዊ ምልከታን ያሳያል፤ ያልተገለጸው የ“እነርሱ” ማንነት አልተጨመረም።
