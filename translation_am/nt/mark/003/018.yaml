base_translation:
  language: en
  yaml_path: translation/nt/mark/003/018.yaml
  text: and Andrew[a], and Philip, and Bartholomew, and Matthew, and Thomas, and James the son of Alphaeus, and Thaddaeus, and Simon the Cananaean.
translation:
  language: am
  text: እና እንድርያስን፣ ፊልጶስን፣ በርተሎሜዎስን፣ ማቴዎስን፣ ቶማስን፣ የእልፍዮስን ልጅ ያዕቆብን፣ ታዴዎስንና ቀናተኛው ስምዖንን[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ግሪክ፦ ካናናዊው። ይህ ቃል ከአራማይክ የመጣ ሲሆን፣ “ቀናተኛ” ማለት እንደሆነ ይታሰባል፤ ሉቃስ 6፥15ን ይመልከቱ። “ከነዓናዊ” ብሎ መተርጎም እዚህ የዘር ወይም የአገር መለያ መሆኑን በስህተት ሊያስገነዝብ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: እንዲሁም / ፣ / እና
  rationale: የግሪኩን ተከታታይ ዝርዝር ትስስር በተፈጥሯዊ የአማርኛ ሥርዓተ ነጥብና ማያያዣ ጠብቋል፤ እያንዳንዱን καὶ በቃል መድገም በአማርኛ ከባድ ይሆናል።
- source_word: Ἀνδρέαν, Φίλιππον, Βαρθολομαῖον, Μαθθαῖον, Θωμᾶν, Θαδδαῖον
  choice: እንድርያስ፣ ፊልጶስ፣ በርተሎሜዎስ፣ ማቴዎስ፣ ቶማስ፣ ታዴዎስ
  rationale: የግል ስሞቹ በተለመደው የአማርኛ መጽሐፍ ቅዱሳዊ አጻጻፍ ተጽፈዋል፤ የግሪክ ተሳቢ ሁኔታቸውም በአማርኛ -ን ተገልጧል።
- source_word: Ἰάκωβον τὸν τοῦ Ἁλφαίου
  choice: የእልፍዮስን ልጅ ያዕቆብን
  rationale: የግሪኩ የዘር ሐረግ የአባትነት ግንኙነትን ስለሚጠቁም፣ በግልጽና ተፈጥሯዊ አማርኛ ‘የእልፍዮስ ልጅ’ ተብሏል።
- source_word: Σίμωνα τὸν Καναναῖον
  choice: ቀናተኛው ስምዖን
  rationale: Καναναῖος በዚህ ስፍራ የከነዓን ዘርነትን ሳይሆን ከአራማይክ የመጣውን ‘ቀናተኛ’ የሚል ቅጽል ያመለክታል፤ የሉቃስ 6፥15 ζηλωτής ትይዩም ይህን ይደግፋል።
- source_word: implicit governing verb from Mark 3:14–16
  choice: ሾመ
  rationale: ጥቅሱ በግሪክ የቀደመውን የሹመት ግስ የሚቀጥል የስም ዝርዝር ነው። ቁጥሩ ብቻውን ሲነበብ ሙሉና ተፈጥሯዊ እንዲሆን ‘ሾመ’ ተደግሟል።
theological_decisions:
- issue: የΣίμων ቅጽል Καναναῖος ትርጉም
  choice: ቀናተኛው ስምዖን
  alternative: ከነዓናዊው ስምዖን / ቃናናዊው ስምዖን
  rationale: ቃሉ የጎሳ ወይም የአገር መለያ እንደሆነ ማቅረብ አሳሳች ነው። የአራማይክ ዳራውና የሉቃስ ትይዩ ቃል ‘ቀናተኛ’ የሚለውን ትርጉም ይደግፋሉ፤ ይህም የተወሰነ ፓርቲ አባልነትን ከሚያስገድድ ይልቅ ቅጽሉን ብቻ ያስተላልፋል።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ ነው። ስሞቹ የተለመደውን የአማርኛ መጽሐፍ ቅዱስ አጻጻፍ ይከተላሉ። በግሪኩ ያልተደገመው ‘ሾመ’ ከቀደመው አውድ ተገንዝቦ ጥቅሱ ብቻውን ሲቀርብ የአማርኛ ዓረፍተ ነገር እንዲሟላ ተጨምሯል።
