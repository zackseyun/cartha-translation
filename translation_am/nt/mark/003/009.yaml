  text: καὶ εἶπεν τοῖς μαθηταῖς αὐτοῦ ἵνα πλοιάριον προσκαρτερῇ αὐτῷ διὰ τὸν ὄχλον ἵνα μὴ θλίβωσιν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/009.yaml
  text: And he told his disciples that a small boat should stay ready for him because of the crowd[a], so that they might not crush him.
translation:
  language: am
  text: በሕዝቡ ምክንያት፣ ሕዝቡ እንዳይጨናንቀው፣ አንዲት ትንሽ ጀልባ ለእርሱ ዝግጁ ሆና እንድትቆይ ደቀ መዛሙርቱን ነገራቸው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እንዳይጨፍልቀው» ወይም «እንዳይጫኑበት።» የግሪኩ ግስ መጫንን፣ መጨናነቅን ወይም በግፊት መጨፍለቅን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: ነገራቸው
  rationale: ከተዘዋዋሪ የትእዛዝ ይዘት ጋር በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን፣ λέγω የሚያመለክተውን የመናገር ተግባር ይጠብቃል።
- source_word: μαθηταῖς
  choice: ደቀ መዛሙርቱን
  rationale: በወንጌላት ውስጥ ለμαθητής የተለመደው እና የመምህርና ተከታይ ግንኙነትን የሚጠብቅ አገላለጽ ነው።
- source_word: πλοιάριον
  choice: አንዲት ትንሽ ጀልባ
  rationale: የቃሉን የትንሽነት ስሜት በግልጽና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: προσκαρτερῇ
  choice: ዝግጁ ሆና እንድትቆይ
  rationale: በዚህ አውድ ያለውን በቀጣይነት ዝግጁና በአቅራቢያ የመሆን ትርጉም በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: αὐτῷ
  choice: ለእርሱ
  rationale: ጀልባዋ ለኢየሱስ ጥቅም ዝግጁ እንድትሆን መታሰቡን የሚያሳይ ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
- source_word: διὰ τὸν ὄχλον
  choice: ሕዝቡ … እንዳይጨፈልቀው
  rationale: διά ከአኩዛቲቭ ጋር የሚገልጠው ምክንያት በዓላማው አንቀጽ ውስጥ በተፈጥሯዊ የአማርኛ አወቃቀር ተካትቷል።
- source_word: θλίβωσιν
  choice: እንዳይጨፈልቀው
  rationale: ግሱ የመጫን፣ የመጨናነቅ ወይም በኃይል የመጨፍለቅ ስፋት አለው፤ «እንዳይጨፈልቀው» የሕዝቡን አካላዊ ግፊት በግልጽ ያሳያል።
