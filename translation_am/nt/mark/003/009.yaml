    reason: lexical_alternative
  revision_rationale: The revision explicitly renders διὰ τὸν ὄχλον as በሕዝቡ ምክንያት while retaining the following purpose, እንዳይጨናንቀው. It also adopts a natural main-text term for crowd pressure and retains lexical breadth in the footnote.
