base_translation:
  language: en
  yaml_path: translation/nt/mark/003/020.yaml
  text: And he comes into a house[a], and the crowd gathers again[c][b], so that they are not even able to eat bread.
translation:
  language: am
  text: እርሱም ወደ አንድ ቤት[a] ገባ፤ ሕዝቡም እንደገና ተሰበሰበ፤ ስለዚህም እነርሱ ዳቦ እንኳ ለመብላት[b] አልቻሉም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ወደ ቤት»። የግሪኩ አገላለጽ ቃል በቃል «ወደ አንድ ቤት» ይላል፤ ነገር ግን በአገላለጹ ወደ መኖሪያ ቤት መመለስን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ «ዳቦ እንኳ ለመብላት»፤ ማለትም ምግብ ለመብላት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: ገባ
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ ቅርጽ የትረካውን ሕያውነት ቢያሳይም፣ በተፈጥሯዊ ዘመናዊ አማርኛ ያለፈ ጊዜው «ገባ» ይስማማል።
- source_word: εἰς οἶκον
  choice: ወደ አንድ ቤት
  rationale: οἶκον ያለ መስተዋድድ አንቀጽና ያለ ባለቤትነት ተውላጠ ስም ስለመጣ፣ የማን ቤት እንደሆነ ሳይወሰን የምንጩን ክፍትነት ይጠብቃል።
- source_word: συνέρχεται πάλιν ὁ ὄχλος
  choice: ሕዝቡም እንደገና ተሰበሰበ
  rationale: συνέρχεται በዚህ አውድ የሕዝቡን መሰብሰብ፣ πάλινም ድግግሞሹን ያመለክታሉ። «ሕዝቡ» ὁ ὄχλοςን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ὥστε μὴ δύνασθαι αὐτοὺς
  choice: ስለዚህ እርሱና ከእርሱ ጋር የነበሩት ... አልቻሉም
  rationale: ὥστε ውጤትን ያሳያል። የብዙ ቁጥር αὐτούς በአማርኛ ግልጽ እንዲሆን ኢየሱስንና አብረውት የነበሩትን በመጠኑ ገልጿል።
- source_word: μηδὲ ἄρτον φαγεῖν
  choice: እንጀራ እንኳ ለመብላት
  rationale: ἄρτος ቃል በቃል ዳቦ ቢሆንም በአውዱ ምግብ መብላትን ሊወክል ይችላል። «እንጀራ» በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም ይህን ሁለት ደረጃ ትርጉም ሊሸከም ይችላል።
theological_decisions:
- issue: የαὐτούς ማመልከቻ
  choice: እርሱና ከእርሱ ጋር የነበሩት
  alternative: እነርሱ
  rationale: የግሪኩ ብዙ ቁጥር ኢየሱስንና አብረውት የነበሩትን ያመለክታል፤ ይህ ማብራሪያ የቡድኑን ማንነት ከአውዱ ብቻ ያቀርባል እንጂ የተለየ ትምህርተ እምነት አያስገባም።
