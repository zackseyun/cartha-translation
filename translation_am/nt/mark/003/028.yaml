id: MRK.3.28
reference: Mark 3:28
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Ἀμὴν λέγω ὑμῖν ὅτι πάντα ἀφεθήσεται ⸂τοῖς υἱοῖς τῶν ἀνθρώπων, τὰ ἁμαρτήματα⸃ καὶ ⸂αἱ βλασφημίαι ὅσα ἐὰν⸃ βλασφημήσωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/028.yaml
  text: Truly I tell you that all sins will be forgiven to the sons of men[a], and whatever blasphemies they may utter;
translation:
  language: am
  text: እውነት እላችኋለሁ፤ ለሰው ልጆች[a] ኃጢአቶች ሁሉና የሚናገሯቸው ስድቦች ሁሉ ይቅር ይባላሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ለሰዎች»። የግሪክ አገላለጽ ሰዎችን በአጠቃላይ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: እውነት እላችኋለሁ
  rationale: የንግግሩን ክብደትና ቀጥተኛ አድራሻ በተፈጥሯዊ ዘመናዊ አማርኛ ይጠብቃል።
- source_word: πάντα ... τὰ ἁμαρτήματα
  choice: ኃጢአት ሁሉ
  rationale: πάντα የሚያመለክተውን ሙሉ ወሰን ይጠብቃል፤ በአማርኛም ነጠላ ስም ከ‘ሁሉ’ ጋር መጠቀም ተፈጥሯዊ ነው።
- source_word: ἀφεθήσεται
  choice: ይቅር ይባልላቸዋል
  rationale: በኃጢአት አውድ ያለውን ‘ይሰረያል/ይቅር ይባላል’ ትርጉም ይገልጣል፤ የግሪኩን ተቀባይ ለሰው ልጆችም በ‘-ላቸዋል’ ያሳያል።
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: ለሰው ልጆች
  rationale: የምንጩን ሴማዊ ቅርጽ በአማርኛ የተለመደ አገላለጽ ይጠብቃል፤ አጠቃላይ የሰው ልጆችን እንደሚያመለክት የግርጌ ማስታወሻው ያብራራል።
- source_word: αἱ βλασφημίαι ὅσα ἐὰν βλασφημήσωσιν
  choice: የሚናገሩት ስድብ ሁሉ
  rationale: βλασφημίαι ያለውን የስድብና የእግዚአብሔርን ክብር የሚነካ ንግግር ኃይል ይጠብቃል፤ ὅσα ἐὰν የሚያሳየውን ክፍትና አጠቃላይ ወሰን ‘ሁሉ’ ይገልጣል።
theological_decisions:
- issue: የይቅርታው ስፋትና በሚቀጥለው ቁጥር ያለው ማስጠንቀቂያ
  choice: ይህን ቁጥር በራሱ አገላለጽ ሰፊ የይቅርታ መግለጫ አድርጎ መተርጎም
  alternative: የሚቀጥለውን ልዩ ሁኔታ በዚህ ቁጥር ውስጥ በትርጉም መጨመር
  rationale: ቁጥር 28 የይቅርታውን ስፋት ይናገራል፤ ቀጣዩ ቁጥር ማስጠንቀቂያውን ይሰጣል። ትርጉሙ ይህን የጽሑፉን ውጥረት አስቀድሞ አይፈታውም።
- issue: τοῖς υἱοῖς τῶν ἀνθρώπων የሚለው አጠቃላይ አገላለጽ
  choice: በዋናው ጽሑፍ ‘ለሰው ልጆች’ ብሎ ማቆየትና አጠቃላይ ትርጉሙን በግርጌ ማብራራት
  alternative: በዋናው ጽሑፍ ‘ለሰዎች’ ብሎ ብቻ መተርጎም
  rationale: ይህ ምርጫ የምንጩን አገላለጽ ይጠብቃል፤ ሆኖም ወንዶችን ብቻ እንደማያመለክት ማስታወሻው ግልጽ ያደርጋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ አማርኛ ተጠቅሟል። ‘እውነት እላችኋለሁ’ የኢየሱስን የተከበረ የማረጋገጫ ንግግር ያቆያል፤ ‘ይቅር ይባልላቸዋል’ ደግሞ በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
