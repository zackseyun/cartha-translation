  edition: SBLGNT
  text: καὶ εἰ ὁ Σατανᾶς ἀνέστη ἐφ’ ἑαυτὸν καὶ ⸀ἐμερίσθη, οὐ δύναται ⸀στῆναι ἀλλὰ τέλος ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/026.yaml
  text: And if Satan has risen up against himself and is divided[a], he cannot stand, but has come to an end.
translation:
  language: am
  text: ሰይጣንም በራሱ ላይ ቢነሣና ቢከፋፈል፣ ሊቆም አይችልም፤ ነገር ግን ፍጻሜ አለው[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ቃል በቃል፣ “ነገር ግን ፍጻሜ አለው።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σατανᾶς
  choice: ሰይጣን
  rationale: በአማርኛ የጸናውን የግል ስም ቅርጽ ይጠቀማል።
- source_word: ἀνέστη ἐφ’ ἑαυτὸν
  choice: በራሱ ላይ ተነሥቶ
  rationale: በዐውዱ ያለውን ራስን የመቃወም ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐμερίσθη
  choice: ከተከፋፈለ
  rationale: የውስጥ መከፋፈልን የሚገልጸውን ተደራጊ ቅርጽ በአማርኛ ሁኔታዊ አገባብ ያቀርባል።
- source_word: οὐ δύναται στῆναι
  choice: ሊቆም አይችልም
  rationale: መጽናት ወይም መቀጠል አለመቻልን የሚገልጸውን ምሳሌያዊ አነጋገር ሳያጠፋ በቀጥታ ይተረጉማል።
- source_word: ἀλλὰ τέλος ἔχει
  choice: ፍጻሜው ደርሷል
  rationale: ቃል በቃል ‘ፍጻሜ አለው’ የሚለውን አገላለጽ በተፈጥሯዊና ክቡር አማርኛ ያቀርባል፤ በዐውዱም የተከፋፈለው አገዛዝ መቀጠል እንደማይችል ያሳያል።
theological_decisions:
- issue: ስለ ሰይጣን ፍጻሜ የተነገረው ንግግር ወሰን
  choice: ንግግሩን በኢየሱስ ምክንያታዊ ክርክር ውስጥ ያለ ውጤት አድርጎ ማቅረብ
  alternative: ጥቅሱን ብቻውን ስለ መጨረሻው ዘመን ፍጹም ሽንፈት የሚሰጥ የተሟላ የእምነት መግለጫ አድርጎ ማስፋት
  rationale: ግሪኩ የተከፋፈለ የሰይጣን አገዛዝ ሊጸና እንደማይችል በምክንያታዊ ክርክር ይገልጻል፤ ከቅርብ ዐውዱ በላይ የሆነ የአስተምህሮ ዝርዝር አይጨመርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የሁኔታው አንቀጽ በ‘ከ-’ ቅርጽ ቀርቦ የግሪኩን ምክንያታዊ አወቃቀር ጠብቋል።
