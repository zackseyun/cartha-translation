  to: ሰይጣንም በራሱ ላይ ቢነሣና ቢከፋፈል፣ ሊቆም አይችልም፤ ነገር ግን ፍጻሜ አለው[a]።
  rationale: The revision avoids portraying the end as already completed while retaining the Greek’s terse conclusion. The footnote is retained as an audit-trail marker and identifies the close literal form; the main wording preserves the same form in natural Amharic. The paired conditional verbs make the logical structure explicit without adding theological interpretation.
