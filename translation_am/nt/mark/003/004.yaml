id: MRK.3.4
reference: Mark 3:4
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ἔξεστιν τοῖς σάββασιν ⸀ἀγαθοποιῆσαι ἢ κακοποιῆσαι, ψυχὴν σῶσαι ἢ ἀποκτεῖναι; οἱ δὲ ἐσιώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/004.yaml
  text: And he said to them[a], “Is it lawful on the Sabbath to do good or to do harm[b], to save a life or to kill?” But they were silent.
translation:
  language: am
  text: እርሱም፣ “በሰንበት መልካም ማድረግ ወይስ ክፉ ማድረግ፣ ሕይወትን ማዳን ወይስ መግደል ተፈቅዷል?” አላቸው። እነርሱ ግን ዝም አሉ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔξεστιν
  choice: ተፈቅዷል
  rationale: ጥያቄው በሰንበት ሕግና ልማድ መሠረት የተፈቀደውን ስለሚጠይቅ፣ ይህ አገላለጽ ሕጋዊና ሥነ ምግባራዊ ኃይሉን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τοῖς σάββασιν
  choice: በሰንበት
  rationale: የግሪኩ ብዙ ቁጥር በኮይኔ ግሪክ አንድን የሰንበት ቀን ለማመልከት የሚያገለግል የተለመደ ፈሊጥ ነው፤ ነጠላው የአማርኛ አተረጓጎም ዐውደ ንባቡን በግልጽና ተፈጥሯዊ ሁኔታ ያቀርባል።
- source_word: ἀγαθοποιῆσαι
  choice: መልካም ማድረግ
  rationale: ግሱ ጠቃሚና መልካም ድርጊትን በቀጥታ ያመለክታል፤ ይህም አጭርና ተፈጥሯዊ ነው።
- source_word: κακοποιῆσαι
  choice: ክፉ ማድረግ
  rationale: ቃሉ ‘ክፉ ማድረግ’ ወይም ‘ጉዳት ማድረስ’ ሊል ይችላል፤ ከመልካም ማድረግ ጋር ያለውን ሥነ ምግባራዊ ተቃርኖ ለመጠበቅ ‘ክፉ ማድረግ’ ተመርጧል።
- source_word: ψυχὴν
  choice: ሕይወትን
  rationale: ከመግደል ጋር ባለው ተቃርኖ ቃሉ የሰውን ሕይወት ማትረፍን ያመለክታል እንጂ በተለይ ኢ-ቁሳዊ ‘ነፍስን’ አይደለም።
- source_word: σῶσαι
  choice: ማዳን
  rationale: የማትረፍንና ሕይወትን የመጠበቅን ትርጉም በተለመደ አማርኛ ያስተላልፋል።
- source_word: ἀποκτεῖναι
  choice: መግደል
  rationale: የግሱን መሠረታዊ ትርጉም ያቀርባል፤ ‘መግደል’ን እንደ ወንጀል በቅድሚያ የሚወስን ተጨማሪ ፍቺ አያስገባም።
- source_word: ἐσιώπων
  choice: ዝም አሉ
  rationale: የአለፈ ጊዜው ቀጣይነት በዐውደ ንባቡ ለጥያቄው መልስ ሳይሰጡ ዝም ማለታቸውን ያሳያል፤ ‘ዝም አሉ’ በአማርኛ ተፈጥሯዊ የትረካ አገላለጽ ነው።
theological_decisions:
- issue: በሰንበት ሕግ ክርክር ውስጥ የτοῖς σάββασιν ብዙ ቁጥር ፈሊጥ አተረጓጎም
  choice: በሰንበት
  alternative: በሰንበታት
  rationale: የግሪኩ ብዙ ቁጥር እዚህ ፈሊጣዊ ሲሆን በዐውደ ንባቡ ያለውን አንድ የሰንበት ቀን ያመለክታል። ‘በሰንበታት’ በአማርኛ ተደጋጋሚ ወይም ብዙ ሰንበታትን ሊያስመስል ስለሚችል ነጠላው ተመርጧል።
- issue: κακοποιῆσαι የሚያመለክተው ሥነ ምግባራዊ ክፋት ወይም ተግባራዊ ጉዳት
  choice: ክፉ ማድረግ
  alternative: ጉዳት ማድረስ
  rationale: ቃሉ ሁለቱንም ገጽታዎች ሊይዝ ይችላል። ‘ክፉ ማድረግ’ ከἀγαθοποιῆσαι ‘መልካም ማድረግ’ ጋር ያለውን ቀጥተኛ ተቃርኖ ይጠብቃል፣ ቀጣዩም ‘ሕይወትን ማዳን ወይስ መግደል’ የተግባራዊ ጉዳቱን ገጽታ ያብራራል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ አማርኛን ይጠቀማል። የግሪኩ ጥያቄ ትይዩ አወቃቀር—መልካም/ክፉ ማድረግ፣ ማዳን/መግደል—ተጠብቋል። አስፈላጊ የጽሑፍ ወይም የትርጉም አሻሚነት የሚጠይቅ የግርጌ ማስታወሻ የለም።
