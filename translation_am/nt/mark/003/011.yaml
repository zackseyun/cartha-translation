  text: ርኩሳን መናፍስትም ባዩት ቁጥር በፊቱ ይወድቁ ነበር[a]፤ “አንተ የእግዚአብሔር ልጅ ነህ!” እያሉም ይጮኹ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በፊቱ ራሳቸውን ይጥሉ ነበር” ተብሎም ሊተረጎም ይችላል። የግሪኩ ግስ በአንድ ሰው ፊት በተገዥነት ወይም በልመና መውደቅን ሊያመለክት ይችላል።
