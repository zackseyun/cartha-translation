id: MRK.3.5
reference: Mark 3:5
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ περιβλεψάμενος αὐτοὺς μετ’ ὀργῆς, συλλυπούμενος ἐπὶ τῇ πωρώσει τῆς καρδίας αὐτῶν, λέγει τῷ ἀνθρώπῳ· Ἔκτεινον τὴν ⸀χεῖρα· καὶ ἐξέτεινεν, καὶ ἀπεκατεστάθη ἡ χεὶρ ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/005.yaml
  text: And after looking around at them with anger[a], grieved at the hardness of their hearts, he says to the man, “Stretch out your hand.” And he stretched it out, and his hand was restored.
translation:
  language: am
  text: እርሱም በቁጣ በዙሪያው ያሉትን ተመልክቶ፣ በልባቸው ግትርነት[a] እያዘነ፣ ሰውየውን፣ “እጅህን ዘርጋ” ይለዋል። እርሱም ዘረጋት፤ እጁም እንደ ቀድሞው ተመለሰች።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክ ቃሉ በነጠላ ቁጥር “ልብ” ይላል፤ ይህም የሁሉንም ልብ በአንድነት የሚገልጽ ሊሆን ይችላል። “በልቦቻቸው ግትርነት” ተብሎም ሊተረጎም ይችላል።
    reason: የግሪኩን ነጠላ ቅርጽና በአማርኛ የሚቻለውን ብዙ ቁጥር አማራጭ ለማሳየት።
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: ዙሪያውን ተመለከታቸው
  rationale: የቡድኑን ሁሉ የሚያካትተውን ዙሪያ የመመልከት እንቅስቃሴ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: μετ’ ὀργῆς
  choice: በቁጣ
  rationale: ቁጣውን ሳያለዝብ ቀጥተኛና የተለመደ አማርኛ ይሰጣል።
- source_word: συλλυπούμενος
  choice: እያዘነ
  rationale: ከቁጣው ጋር አብሮ ያለውን ሐዘን ያሳያል፤ በግሪክ ያለውን ተከታታይ ድርጊትም ይጠብቃል።
- source_word: ἐπὶ τῇ πωρώσει τῆς καρδίας αὐτῶν
  choice: በልባቸው ድንዛዜ
  rationale: πώρωσις የሚያመለክተውን የውስጥ ግትርነትና የማይሰማ መሆን ያስተላልፋል፤ ነጠላውን ‘ልብ’ ከብዙ ባለቤቶች ጋር ጠብቋል።
- source_word: λέγει
  choice: ይለዋል
  rationale: የማርቆስን ሕያው ታሪካዊ የአሁን ጊዜ አገላለጽ ይጠብቃል።
- source_word: Ἔκτεινον τὴν χεῖρα
  choice: እጅህን ዘርጋ
  rationale: ትእዛዙን በቀጥታና በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἀπεκατεστάθη
  choice: ወደ ቀድሞ ሁኔታዋ ተመለሰች
  rationale: እጁ ወደ ትክክለኛው ቀድሞ ሁኔታ መመለሷን ያሳያል፤ ትርጉሙን በ‘ተፈወሰች’ ብቻ አያጠብም።
theological_decisions:
- issue: የኢየሱስ ቁጣና ሐዘን
  choice: ሁለቱንም ስሜቶች ‘በቁጣ’ እና ‘እያዘነ’ በማለት በግልጽ ማቅረብ
  alternative: ቁጣውን ‘ቅሬታ’ በማለት ማለዘብ ወይም ሐዘኑን ብቻ ማጉላት
  rationale: ምንጩ ቁጣንና ሐዘንን አብሮ ያቀርባል፤ ይህን ሥነ መለኮታዊና ሥነ ምግባራዊ ውጥረት ማለዘብ አይገባም።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ ነው። ‘ይለዋል’ የማርቆስን ሕያው የትረካ ስልት ይጠብቃል፤ ‘ድንዛዜ’ ደግሞ የልብን መደንዘዝ በተፈጥሯዊ አገላለጽ ያሳያል።
