  text: and Judas Iscariot[a], who also betrayed him.
translation:
  language: am
  text: እና የአስቆሮቱ ይሁዳ፣ እርሱም ኢየሱስን አሳልፎ የሰጠው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “አሳልፎ የሰጠው” የሚለው “ኢየሱስን የከዳው” ተብሎም ሊተረጎም ይችላል። የግሪኩ ግስ በመሠረቱ “አሳልፎ መስጠት” ማለት ነው፤ በዚህ አውድ ግን ይሁዳ በኢየሱስ ላይ ያደረገውን ክህደት ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: እና
  rationale: የሐዋርያትን ዝርዝር የሚያስተሳስር ተራ አያያዥ ስለሆነ።
- source_word: Ἰούδαν Ἰσκαριώθ
  choice: የአስቆሮቱን ይሁዳን
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠራር የታወቀውን ቅርጽ ይከተላል፤ Ἰσκαριώθ እርግጠኛ ያልሆነ ሥርወ ቃል ስላለው ትርጉም አልተሰጠውም።
- source_word: ὃς καὶ
  choice: ደግሞ … የሰጠውን
  rationale: ይሁዳን በተጨማሪ ተግባሩ የሚለይበትን አንጻራዊ ሐረግ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: παρέδωκεν
  choice: አሳልፎ የሰጠውን
  rationale: የግሱን ‘ለሌላ አሳልፎ መስጠት’ የሚለውን መሠረታዊ ፍቺ ይጠብቃል፤ በዚህ አውድ የክህደት ስሜቱ በግልጽ ይገባል ነገር ግን የግሱ ሰፊ ትርጉም አይጠበብም።
- source_word: αὐτόν
  choice: -ውን
  rationale: በግሱ ላይ የተያያዘው ተሳቢ ተውላጠ ስም ኢየሱስን ያመለክታል።
theological_decisions:
- issue: ይሁዳ በኢየሱስ ላይ ያደረገውን παραδίδωμι መተርጎም
  choice: አሳልፎ የሰጠውን
  alternative: የከዳውን
  rationale: ግሱ በቀጥታ ‘አሳልፎ መስጠት’ ማለት ሲሆን፣ ይሁዳ ባለበት አውድ ክህደትን ያመለክታል። ዋናው ጽሑፍ የምንጩን ሰፊ የቃል ክልል ይጠብቃል፤ የአውዱ አማራጭ በማስታወሻ ተገልጿል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። ክፍሉ የቀደመውን የስም ዝርዝር ስለሚያጠናቅቅ የተሳቢ ምልክቱ በስሙ ላይ ተጠብቋል።
