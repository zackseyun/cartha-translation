revisions:
- from: እና ደግሞ አሳልፎ የሰጠውን የአስቆሮቱን ይሁዳን።[a]
  to: እና የአስቆሮቱ ይሁዳ፣ እርሱም ኢየሱስን አሳልፎ የሰጠው።[a]
  rationale: A safe correction is required because the original Amharic syntax changes who performed the handing-over. The revision restores Judas as subject, identifies Jesus as the object referred to by αὐτόν, retains both occurrences of καί through “እና” and “እርሱም,” and keeps the lexical ambiguity of παρέδωκεν available in the footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:00:27Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the basic sense of παραδίδωμι as ‘hand over,’ but its relative construction is grammatically misattached: “አሳልፎ የሰጠውን የአስቆሮቱን ይሁዳን” means, or strongly suggests, ‘Judas Iscariot whom [someone] handed over,’ reversing the Greek relation. The revised wording makes Judas the subject of the action and Jesus its object.'
  naturalness: The revised sentence is clear, modern standard Amharic and works naturally as the final item in the preceding apostolic list. “እርሱም” appropriately conveys the relative clause with its adverbial καί.
  terminology: “የአስቆሮቱ ይሁዳ” retains the established Amharic biblical form of the name. “አሳልፎ የሰጠው” preserves the broader lexical sense of παρέδωκεν, while the footnote supplies “የከዳው” as the contextually apt alternative.
  issues:
  - severity: high
    issue: The relative clause reverses the subject/object relationship.
    rationale: In the draft, the accusative relative form “የሰጠውን” modifies “ይሁዳን,” making Judas the one handed over. Greek ὃς ... παρέδωκεν αὐτόν identifies Judas as the one who handed Jesus over.
  - severity: medium
    issue: The antecedent of the object pronoun is not clear in the Amharic draft.
    rationale: The Greek pronoun refers to Jesus, and the draft’s attached suffix is both structurally misdirected and unclear. Naming Jesus in the revised clause prevents ambiguity without altering meaning.
  revised_text: እና የአስቆሮቱ ይሁዳ፣ እርሱም ኢየሱስን አሳልፎ የሰጠው።[a]
  revised_footnotes:
  - marker: a
    text: “አሳልፎ የሰጠው” የሚለው “ኢየሱስን የከዳው” ተብሎም ሊተረጎም ይችላል። የግሪኩ ግስ በመሠረቱ “አሳልፎ መስጠት” ማለት ነው፤ በዚህ አውድ ግን ይሁዳ በኢየሱስ ላይ ያደረገውን ክህደት ያመለክታል።
    reason: lexical_alternative
