  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸂ἀλλ’ οὐδεὶς δύναται⸃ ⸂εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ εἰσελθὼν τὰ σκεύη⸃ αὐτοῦ διαρπάσαι ἐὰν μὴ πρῶτον τὸν ἰσχυρὸν δήσῃ, καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/027.yaml
  text: But no one can enter the house of the strong man and plunder his goods unless he first ties up the strong man[b][a]; then indeed he will plunder his house.
translation:
  language: am
  text: ነገር ግን ማንም አስቀድሞ ኃያሉን ሰው ካላሰረው በቀር፣ ወደ ኃያሉ ሰው ቤት ገብቶ ንብረቱን[a] ሊዘርፍ አይችልም፤ ከዚያም ቤቱን ይዘርፋል።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ዕቃዎቹን” ወይም “ንብረቶቹን።”
    reason: lexical_alternative
  - marker: b
    text: “ኃያሉ ሰው” ኢየሱስ ሰይጣንን ስለማሸነፉ በጠቀሙበት ምሳሌ ውስጥ ያለ ምስል ነው፤ ትርጉሙ በዋናው ጽሑፍ ሳይገለጽ ምስሉ እንዳለ ተጠብቋል።
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: ነገር ግን
  rationale: ከቀደመው ክስና ከኢየሱስ መልስ ጋር ያለውን ተቃርኖ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οὐδεὶς δύναται
  choice: ማንም ... ሊዘርፍ አይችልም
  rationale: የግሪኩን ፍጹም አለመቻል በተለመደ የአማርኛ አሉታዊ አገባብ ይገልጣል።
- source_word: τοῦ ἰσχυροῦ / τὸν ἰσχυρόν
  choice: ኃያሉን ሰው / የኃያሉ ሰው
  rationale: በስም ፈንታ የቆመውን ቅጽል ግልጽ በማድረግ የምሳሌውን ምስል ይጠብቃል።
- source_word: εἰς τὴν οἰκίαν ... εἰσελθὼν
  choice: ወደ ... ቤት ገብቶ
  rationale: የመግባትን ድርጊትና አቅጣጫ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τὰ σκεύη αὐτοῦ
  choice: ንብረቱን
  rationale: σκεύη በቀጥታ ዕቃዎችን ወይም መሣሪያዎችን ሊያመለክት ቢችልም፣ በቤት ዘረፋ አውድ የሰውየውን ንብረት በአጠቃላይ ያመለክታል።
- source_word: διαρπάσαι / διαρπάσει
  choice: ሊዘርፍ / ይዘርፋል
  rationale: ግሱ ንብረትን በኃይል መውሰድን ያመለክታል፤ “መዝረፍ” የምሳሌውን ጠንካራ ምስል ይጠብቃል።
- source_word: ἐὰν μὴ πρῶτον ... δήσῃ
  choice: አስቀድሞ ... ካላሰረው በቀር
  rationale: ዘረፋው ከመፈጸሙ በፊት አስፈላጊ የሆነውን ቅድመ ሁኔታ በግልጽ ሁኔታ ይገልጣል።
- source_word: καὶ τότε
  choice: ካሰረው በኋላ ግን
  rationale: ኃያሉ ሰው ከታሰረ በኋላ የሚከተለውን ድርጊት በተፈጥሯዊ የአማርኛ ቅደም ተከተል ያሳያል።
theological_decisions:
- issue: “ኃያሉ ሰው” በኢየሱስ ክርክር ውስጥ ያለው ምሳሌያዊ ፍቺ
  choice: ምሳሌያዊውን “ኃያሉ ሰው” በዋናው ጽሑፍ እንዳለ ማቆየት
  alternative: በዋናው ጽሑፍ “ሰይጣን” ብሎ በግልጽ መተርጎም
  rationale: አውዱ ምሳሌውን ከሰይጣን መሸነፍ ጋር ያያይዘዋል፤ ግሪኩ ግን ትርጓሜውን በቀጥታ ሳይገልጽ ምስሉን ይጠቀማል። ስለዚህ ዋናው ጽሑፍ ምሳሌውን ይጠብቃል፣ ማብራሪያውም በማስታወሻ ይሰጣል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ረዥም ሁኔታዊ አወቃቀር ሳይጠፋ በተፈጥሯዊ የአማርኛ ቅደም ተከተል ተደርጓል።
