id: MRK.3.23
reference: Mark 3:23
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενος αὐτοὺς ἐν παραβολαῖς ἔλεγεν αὐτοῖς· Πῶς δύναται Σατανᾶς Σατανᾶν ἐκβάλλειν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/023.yaml
  text: 'And after calling them to himself, he was speaking to them in parables: “How can Satan cast out Satan?”'
translation:
  language: am
  text: እርሱም ወደ ራሱ ጠርቶአቸው በምሳሌዎች እንዲህ ይላቸው ነበር፤ “ሰይጣን ሰይጣንን እንዴት ሊያስወጣ ይችላል?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: ወደ ራሱ ጠርቶአቸው
  rationale: የግሱን መካከለኛ ቅርጽና ወደ ተናጋሪው እንዲቀርቡ የመጥራትን ሐሳብ በተፈጥሯዊ አማርኛ ያሳያል፤ የተከታታይነቱንም ሐሳብ ሳያስፋፋ ይጠብቃል።
- source_word: ἐν παραβολαῖς
  choice: በምሳሌዎች
  rationale: የግሪኩን ብዙ ቁጥር ይጠብቃል፤ ንግግሩ በምሳሌያዊ ንጽጽሮች መቅረቡንም ሳይገድብ ያሳያል።
- source_word: ἔλεγεν
  choice: እንዲህ ይላቸው ነበር
  rationale: የኢምፐርፌክት ግስን ቀጣይ ወይም የተዘረጋ ንግግር ገጽታ በተፈጥሯዊ የአማርኛ ትረካ ያሳያል።
- source_word: Πῶς δύναται
  choice: እንዴት … ሊያስወጣ ይችላል?
  rationale: ስለ ችሎታ ወይም ስለ እድል የሚጠይቀውን የአጻጻፍ ጥያቄ በቀጥተኛና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: Σατανᾶς
  choice: ሰይጣን
  rationale: በዘመናዊ መደበኛ አማርኛ የተለመደውን የስሙን ቅርጽ ይጠቀማል።
- source_word: ἐκβάλλειν
  choice: ሊያስወጣ
  rationale: በማርቆስ የአጋንንት ማስወጣትን የሚያመለክተውን መደበኛ ሐሳብ ያስተላልፋል፤ ከአውዱ በላይ ትርጓሜ አይጨምርም።
theological_decisions:
- issue: ሰይጣን በራሱ ላይ ስለሚሠራ የቀረበው ጥያቄ ኃይል
  choice: “ሰይጣን ሰይጣንን እንዴት ሊያስወጣ ይችላል?” ተብሎ የማይቻልነትን የሚያጎላ የአጻጻፍ ጥያቄ ሆኖ ተተርጉሟል።
  alternative: “ሰይጣን ሰይጣንን ማስወጣት እንዴት ይችላል?”
  rationale: ግሪኩ ችሎታን ወይም መቻልን ይጠይቃል። በአውዱ ጥያቄው ክሱ ያለውን ውስጣዊ ቅራኔ ያጋልጣል፤ ትርጉሙ ግን ይህን በማብራሪያ ሳይፈታ የጥያቄውን ኃይል ብቻ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “በምሳሌዎች” የሚለው የምንጩን ብዙ ቁጥር ጠብቋል፤ ምንም የግርጌ ማስታወሻ አላስፈለገም።
