translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። የማርቆስን ተደራራቢ ዝርዝር በ‘-ም’ ቅጥያ ጠብቋል፤ በዋናው ጽሑፍ ያልተወሰኑ የቃላት አማራጮች በማስታወሻ ቀርበዋል። በተሰጠው የእንግሊዝኛ ንባብ [a] ምልክት ከ‘Jerusalem’ ጋር ቢታይም የማስታወሻው ይዘት πέραν τοῦ Ἰορδάνουን ስለሚመለከት፣ በምንጭ ጽሑፉ መሠረት ከ‘ከዮርዳኖስ ማዶም’ ጋር ተያይዟል።
