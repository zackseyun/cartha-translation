  text: καὶ ἀπὸ Ἱεροσολύμων καὶ ἀπὸ τῆς Ἰδουμαίας ⸀καὶ πέραν τοῦ Ἰορδάνου ⸁καὶ περὶ Τύρον καὶ Σιδῶνα, πλῆθος πολύ, ⸀ἀκούοντες ὅσα ⸀ἐποίει ἦλθον πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/008.yaml
  text: and from Jerusalem[a], and from Idumea, and beyond the Jordan, and around Tyre and Sidon, a great crowd, hearing what he was doing[c][b], came to him.
translation:
  language: am
  text: ከኢየሩሳሌምም፣ ከኤዶምያስም፣ ከዮርዳኖስ ማዶም[a]፣ በጢሮስና በሲዶና ዙሪያ ካለው አካባቢም[b] እጅግ ብዙ ሰዎች፣ እርሱ ያደርግ የነበረውን[c] ሰምተው፣ ወደ እርሱ መጡ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከዮርዳኖስ ማዶ ካለው ክልል።” የግሪኩ አገላለጽ ከዮርዳኖስ ወንዝ ማዶ ያለውን ክልል ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ከጢሮስና ከሲዶና አካባቢ።” ግሪኩ “በጢሮስና በሲዶና ዙሪያ” ይላል፤ ስለዚህ ከተሞቹን ብቻ ሳይሆን በዙሪያቸው ያለውን ክልል ያመለክታል።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “እርሱ ያደርግ የነበረውን ሁሉ።” የግሪኩ አንጻራዊ ተውላጠ ስም አጠቃላይ ሐሳብን ሊይዝ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ Ἱεροσολύμων
  choice: ከኢየሩሳሌምም
  rationale: ἀπό ከዘርፍ አገባብ ጋር የመነሻ ቦታን ያመለክታል፤ የቦታውም ስም በተለመደው የአማርኛ አጻጻፍ ተቀምጧል።
- source_word: ἀπὸ τῆς Ἰδουμαίας
  choice: ከኤዶምያስም
  rationale: የክልሉን ስም በአማርኛ በሚታወቀው መልክ በመጥቀስ የመነሻ ትርጉሙን ይጠብቃል።
- source_word: πέραν τοῦ Ἰορδάνου
  choice: ከዮርዳኖስ ማዶም
  rationale: πέραν ወንዙን ተሻግሮ ያለውን ወገን ወይም ክልል ያመለክታል፤ ‘ማዶ’ ይህን የቦታ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: περὶ Τύρον καὶ Σιδῶνα
  choice: በጢሮስና በሲዶና ዙሪያ ካለው አካባቢም
  rationale: περί እዚህ የከተሞቹን ዙሪያ እንጂ ከተሞቹን ብቻ አያመለክትም፤ በዝርዝሩ ውስጥ የመነሻ ሐሳብ በአማርኛ ግልጽ እንዲሆን ‘ካለው አካባቢ’ ተጨምሯል።
- source_word: πλῆθος πολύ
  choice: እጅግ ብዙ ሕዝብ
  rationale: የሰዎቹን እጅግ ብዙ መሆን በቀላልና በተለመደ አማርኛ ይገልጻል።
- source_word: ἀκούοντες
  choice: ሰምተው
  rationale: የግሪኩን ተካፋይ ግስ ከዋናው ግስ ጋር ያገናኛል፤ ግንኙነቱን በግድ ምክንያታዊ አድርጎ አይወስንም።
- source_word: ὅσα ἐποίει
  choice: እርሱ ያደርግ የነበረውን
  rationale: ἐποίει የቀጠለ ወይም ተደጋጋሚ ድርጊትን የሚያመለክት ኢምፐርፌክት ነው፤ ὅσα ደግሞ ‘ያደርግ የነበረውን’ ወይም በአጠቃላይ ‘ያደርግ የነበረውን ሁሉ’ ሊሆን ይችላል።
- source_word: ἦλθον πρὸς αὐτόν
  choice: ወደ እርሱ መጡ
  rationale: πρός ከተሳቢ ጋር ወደ ሰው የሚደረግን እንቅስቃሴ ያሳያል፤ ይህም በአማርኛ ተፈጥሯዊና ትክክለኛ ነው።
- source_word: καὶ ... καὶ ... καὶ
  choice: -ም ... -ም ... -ም
  rationale: ተደጋጋሚው καί የሚፈጥረውን የተከማቸ ዝርዝር ስሜት የአማርኛው አያያዥ ቅጥያ ‘-ም’ በተፈጥሯዊ ሁኔታ ያስተላልፋል።
