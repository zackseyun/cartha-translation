lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: መልሶላቸውም
  rationale: የግሪኩን አሳታፊ ግስ ‘መልሶ’ በማለት ይጠብቃል፤ ከαὐτοῖς ጋር ተዋሕዶ ‘ለእነርሱ መልሶ’ የሚለውን ትርጉም በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: αὐτοῖς
  choice: -ላቸው
  rationale: ተውላጠ ስሙ የመልሱን ተቀባዮች ያመለክታል፤ በአማርኛ በግሱ ላይ እንደ ቅጥያ መግለጹ ተፈጥሯዊ ነው።
- source_word: λέγει
  choice: እንዲህ ይላል
  rationale: በማርቆስ የተለመደውን ታሪካዊ የአሁን ጊዜ አገላለጽ ጠብቆ የትረካውን ሕያውነት ያስቀራል።
- source_word: Τίς
  choice: እነማን
  rationale: ጥያቄው እናትንና ብዙ ወንድሞችን በአንድ ላይ ስለሚጠቅስ፣ የብዙ ቁጥር ጥያቄ ቃል በአማርኛ ተፈጥሯዊ ነው።
- source_word: μήτηρ
  choice: እናቴ
  rationale: የμουን ባለቤትነት ከስሙ ጋር በማዋሐድ ‘my mother’ የሚለውን በመደበኛና በክብር ባለው አማርኛ ይገልጣል።
- source_word: ἢ
  choice: ወይም
  rationale: የምንጩን አማራጭ አያያዥ በቀጥታ ይጠብቃል፤ ‘እና’ በማለት የግሪኩን አገላለጽ አይለውጥም።
- source_word: ἀδελφοί
  choice: ወንድሞቼ
  rationale: በግሪክ ያለውን ተባዕታይ ብዙ ቁጥርና የμουን ባለቤትነት በግልጽ ሁኔታ ይጠብቃል።
theological_decisions:
- issue: የἀδελφοί የቤተሰብ ቃል አተረጓጎም
  choice: ወንድሞቼ
  alternative: ወንድሞቼና እህቶቼ / ዘመዶቼ
  rationale: ቃሉ በቅርጹ ተባዕታይ ብዙ ቁጥር ነው፤ ጽሑፉ ያልገለጠውን ጾታ ወይም የዝምድና ዓይነት በመጨመር ማንኛውንም የእምነት ትርጓሜ አያስገባም።
- issue: በμήτηρ ነጠላና በἀδελφοί ብዙ ቁጥር መካከል ያለው ሰዋሰዋዊ ውጥረት
  choice: በአማርኛ የብዙ ቁጥር መጠየቂያና አያያዥ ግስ መጠቀም
  alternative: እናቴ ማን ናት? ወንድሞቼስ እነማን ናቸው?
  rationale: ግሪኩ ነጠላውን ἐστιν ከመጀመሪያው ስም ጋር ያስማማል፤ ይህን በአማርኛ ቃል በቃል መድገም ሰዋሰዋዊ ግጭት ይፈጥራል። የብዙ ቁጥር አገላለጹ የጥያቄውን አንድነት ይጠብቃል፤ ‘ወይም’ ግን የምንጩን አሻሚ አያያዝ ያስቀራል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የማርቆስን ሕያው ትረካ ለማቆየት ታሪካዊው የአሁን ጊዜ ግስ ተጠብቋል፤ የግሪኩ ἢ ደግሞ በ‘ወይም’ ተተርጉሞ አሻሚነቱ አልተወገደም።
