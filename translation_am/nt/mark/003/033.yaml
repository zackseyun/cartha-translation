  rationale: The revision makes the participial response construction natural in modern standard Amharic while preserving Mark’s historical present and the addressee αὐτοῖς. It retains “ወይም” for the source conjunction ἢ and “ወንድሞቼ” for ἀδελφοί. Footnote a is corrected so that it accurately describes the Greek participle-plus-main-verb construction.
