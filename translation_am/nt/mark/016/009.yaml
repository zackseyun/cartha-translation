review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the resurrection, early timing, first day of the week, Mary Magdalene, seven demons, and the prior expulsion. However, ἐφάνη takes Mary as the person to whom he appeared; the draft's «ከመግደላዊት ማርያም ታየ» uses «ከ» (“from”) and can instead mean that he appeared from her. The dative relationship needs explicit «ለ».
  naturalness: The main sentence is otherwise clear, but replacing «ከ… ታየ» with «ለ… ታየ» produces idiomatic and unambiguous modern standard Amharic. «በመጀመሪያ» appropriately represents the sequential force of πρῶτον.
  terminology: «ከሙታን ከተነሣ», «መግደላዊት ማርያም», and «አጋንንት» are established and suitable terms. The textual-variant note is appropriate, but «የተለያዩ አነባበቦች» is more natural and precise than saying that manuscripts “have a different reading.”
  issues:
  - severity: high
    issue: The appearance is phrased with «ከመግደላዊት ማርያም ታየ».
    rationale: «ከ» marks source/separation in Amharic, while the Greek dative Μαρίᾳ marks the recipient of the appearance. «ለመግደላዊት ማርያም ታየ» is required to preserve the source meaning.
  - severity: low
    issue: The footnote's final wording is slightly unnatural.
    rationale: «አንዳንዶቹም የተለየ አነባበብ አላቸው» can imply each manuscript has one distinct reading. «በአንዳንዶቹም ልዩ ልዩ አነባበቦች ይገኛሉ» accurately expresses that variation occurs in some manuscripts.
  revised_text: ከሙታን ከተነሣ በኋላ[a]፣ በሳምንቱ የመጀመሪያ ቀን ማልዶ፣ ሰባት አጋንንትን አስቀድሞ ካስወጣላት ለመግደላዊት ማርያም በመጀመሪያ ታየ።
