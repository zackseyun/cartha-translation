lexical_decisions:
- source_word: Ἀναστὰς
  choice: ከሙታን ከተነሣ በኋላ
  rationale: የግሪኩ የአኦሪስት አጋዥ ግስ ከዋናው ግስ ἐφάνη በፊት የተፈጸመውን ድርጊት ያሳያል። በትንሣኤ አውድ ‘ከሙታን’ መጨመር በአማርኛ ትርጉሙን ግልጽና ተፈጥሯዊ ያደርገዋል።
- source_word: δὲ
  choice: በተለየ ቃል አልተተረጎመም
  rationale: δέ ቀላል የንግግር ማያያዣ ነው፤ እዚህ ላይ በአማርኛ በተለየ ማያያዣ መተርጎሙ ያልተገባ ተቃርኖ ወይም የጊዜ አጽንዖት ሊፈጥር ስለሚችል በዓረፍተ ነገሩ ፍሰት ተወክሏል።
- source_word: πρωῒ
  choice: ማልዶ
  rationale: ቃሉ የሚያመለክተውን የማለዳ ቀደምት ጊዜ አጭርና ተፈጥሯዊ በሆነ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: πρώτῃ σαββάτου
  choice: በሳምንቱ የመጀመሪያ ቀን
  rationale: የኮይኔ ግሪክ የጊዜ አገላለጽ ትርጉም ለዘመናዊ አማርኛ አንባቢ ግልጽ በሆነ መንገድ ቀርቧል።
- source_word: ἐφάνη
  choice: ታየ
  rationale: ይህ ቅርጽ በትንሣኤ መገለጥ አውድ ‘ታየ’ ወይም ‘ተገለጠ’ ሊባል ይችላል፤ ‘ታየ’ የግሪኩን አጭርነትና በአማርኛ የተለመደውን መጽሐፍ ቅዱሳዊ አገላለጽ ይጠብቃል።
- source_word: πρῶτον
  choice: በመጀመሪያ
  rationale: የመገለጦቹን ቅደም ተከተል በቀጥታ ያሳያል።
- source_word: Μαρίᾳ τῇ Μαγδαληνῇ
  choice: ከመግደላዊት ማርያም
  rationale: ‘መግደላዊት ማርያም’ በአማርኛ የተለመደው የስሙ ቅርጽ ነው፤ ከ‘ታየ’ ጋር የተፈጥሯዊ አማርኛ አገባብ ‘ከ… ታየ’ ተጠቅሟል።
- source_word: παρ’ ἧς
  choice: ካስወጣላት
  rationale: ከἐκβεβλήκει ጋር ተዋሕዶ አጋንንቱ ከእርሷ መውጣታቸውን ያሳያል፤ የአማርኛው ተጠቃሚ ግስ ይህን ግንኙነት ተፈጥሯዊ ያደርገዋል።
- source_word: ἐκβεβλήκει
  choice: አስቀድሞ … ካስወጣላት
  rationale: የፕሉፐርፌክት ቅርጹ ድርጊቱ ከመታየቱ በፊት መፈጸሙን ያሳያል፤ ‘አስቀድሞ’ ይህን የጊዜ ግንኙነት ግልጽ ያደርጋል። ‘አስወጣ’ በአጋንንት ማስወጣት አውድ ተፈጥሯዊ ነው።
- source_word: ἑπτὰ δαιμόνια
  choice: ሰባት አጋንንት
  rationale: ቁጥሩ ቃል በቃል ተጠብቋል፤ δαιμόνια በወንጌላት የማስወጣት አውድ ‘አጋንንት’ ተብሎ በትክክል ይተረጎማል።
