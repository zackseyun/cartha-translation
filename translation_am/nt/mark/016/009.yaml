  text: ⟦Ἀναστὰς δὲ πρωῒ πρώτῃ σαββάτου ἐφάνη πρῶτον Μαρίᾳ τῇ Μαγδαληνῇ, ⸀παρ’ ἧς ἐκβεβλήκει ἑπτὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/009.yaml
  text: After he had risen[a], early on the first day of the week, he appeared first to Mary Magdalene, from whom he had cast out seven demons.
translation:
  language: am
  text: ከሙታን ከተነሣ በኋላ[a]፣ በሳምንቱ የመጀመሪያ ቀን ማልዶ፣ ሰባት አጋንንትን አስቀድሞ ካስወጣላት ለመግደላዊት ማርያም በመጀመሪያ ታየ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የማርቆስ ወንጌል 16፥9–20 በአንዳንድ ቀደምት የእጅ ጽሑፎች ውስጥ የሉም፤ ሌሎች የእጅ ጽሑፎች ግን ያካትቷቸዋል፣ በአንዳንዶቹም ልዩ ልዩ አነባበቦች ይገኛሉ።
