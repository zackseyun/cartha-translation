  yaml_path: translation/nt/mark/016/010.yaml
  text: She went and reported it to those who had been with him[a], who were mourning and weeping.
translation:
  language: am
  text: እርሷም ሄዳ፣ ከእርሱ ጋር ለነበሩት፣ እያዘኑና እያለቀሱ ሳሉ፣ ነገረቻቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκείνη
  choice: እርሷም
  rationale: አመልካች ተውላጠ ስሙ በቀደመው ቁጥር የተጠቀሰችውን መግደላዊት ማርያምን ያመለክታል፤ በዘመናዊ አማርኛ ‘እርሷ’ ተፈጥሯዊ ነው። ‘ም’ የትረካውን ቅደም ተከተል ያገናኛል።
- source_word: πορευθεῖσα
  choice: ሄዳ
  rationale: የአኦሪስት አሳታፊው ከዋናው ግስ በፊት የተፈጸመውን እንቅስቃሴ ያሳያል፤ ‘ሄዳ … ነገረቻቸው’ ይህን ቅደም ተከተል በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἀπήγγειλεν
  choice: ነገረቻቸው
  rationale: ἀπαγγέλλω መልእክትን መንገር ወይም ማሳወቅን ያመለክታል። በግሪክ ግልጽ ቀጥተኛ ተሳቢ ስለሌለ፣ ‘ነገረቻቸው’ ያልተገለጸውን መልእክት ሳይጨምር ትርጉሙን ያስተላልፋል።
- source_word: τοῖς μετ’ αὐτοῦ γενομένοις
  choice: ከእርሱ ጋር ለነበሩት
  rationale: ሐረጉ ቀድሞ ከኢየሱስ ጋር የነበሩትን ወገኖች ይለያል። ‘ከእርሱ ጋር ለነበሩት’ የሐረጉን ቅርጽና ጊዜያዊ አመለካከት ይጠብቃል።
- source_word: πενθοῦσι
  choice: እያዘኑ
  rationale: πενθέω በሞት ወይም በከባድ ጥፋት ምክንያት ማዘንን ያመለክታል፤ ‘እያዘኑ’ በዘመናዊ አማርኛ ግልጽና ክብር ያለው ነው።
- source_word: καὶ κλαίουσιν
  choice: እያለቀሱ
  rationale: κλαίω በግልጽ ሁኔታ ማልቀስን ያመለክታል፤ ‘እያለቀሱ’ ከአጠቃላዩ ‘እያዘኑ’ የተለየውን የእንባ መግለጫ ይጠብቃል።
- source_word: πενθοῦσι καὶ κλαίουσιν
  choice: እያዘኑና እያለቀሱ ለነበሩት
  rationale: ሁለቱ የአሁን ጊዜ አሳታፊዎች መልእክቱን የተቀበሉትን ሰዎች በዚያን ጊዜ የነበሩበት ሁኔታ ይገልጣሉ። አማርኛው ይህን እንደ ገላጭ ሐረግ ያቀርባል።
