  text: Μετὰ δὲ ταῦτα δυσὶν ἐξ αὐτῶν περιπατοῦσιν ἐφανερώθη ἐν ἑτέρᾳ μορφῇ πορευομένοις εἰς ἀγρόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/012.yaml
  text: After these things[b][a], he appeared in a different form to two of them as they were walking on their way into the countryside.
translation:
  language: am
  text: ከዚህም በኋላ፣ ከእነርሱ ሁለቱ በእግራቸው ወደ ገጠር[b] እየሄዱ ሳሉ፣ በተለየ መልክ[a] ተገለጠላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በሌላ መልክ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ወደ እርሻ።” በዚህ አውድ “ወደ ገጠር” የሚለው ἀγρός ሊኖረው የሚችለውን ሰፊ ትርጉም ያንጸባርቃል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: ከዚህም በኋላ
  rationale: የμετά የጊዜ ቅደም ተከተልንና የδέ አያያዥ ኃይልን በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: δυσὶν ἐξ αὐτῶν
  choice: ከእነርሱ ሁለቱ
  rationale: ሁለቱ ከትልቁ ቡድን የተወሰዱ መሆናቸውን በግልጽና ተፈጥሯዊ አነጋገር ያሳያል።
- source_word: περιπατοῦσιν
  choice: በእግራቸው … እየሄዱ ሳሉ
  rationale: የእግር ጉዞውንና ከዋናው ግስ ጋር በአንድ ጊዜ መከናወኑን ያሳያል።
- source_word: ἐφανερώθη
  choice: ተገለጠላቸው
  rationale: በዚህ የትንሣኤ ትረካ ውስጥ ግሱ ለእነርሱ መታየቱን ያመለክታል፤ ይህ አተረጓጎም የግሪኩን ተገብሮአዊ ቅርጽም በመጠኑ ይጠብቃል።
- source_word: ἐν ἑτέρᾳ μορφῇ
  choice: በተለየ መልክ
  rationale: ἑτέρᾳ የልዩነትን ሐሳብ፣ μορφήም መልክን ወይም የሚታይ ቅርጽን ያመለክታሉ፤ ንባቡ ልዩነቱን ሳይተረጉም ይጠብቃል።
- source_word: πορευομένοις εἰς ἀγρόν
  choice: ወደ ገጠር እየሄዱ
  rationale: πορεύομαι ዓላማ ያለውን ጉዞ ያሳያል፤ ἀγρός በዚህ አውድ አንድን እርሻ ብቻ ሳይሆን የገጠር አካባቢን ሊያመለክት ይችላል።
theological_decisions:
- issue: ἐν ἑτέρᾳ μορφῇ የሚለው የትንሣኤ መገለጥ ባሕርይ
  choice: ልዩነቱን ሳይብራራ ‘በተለየ መልክ’ ተብሎ ተተርጉሟል።
  alternative: በሌላ መልክ፤ የተለየ አስመስሎ
  rationale: ጥቅሱ ኢየሱስ በተለየ መልክ መገለጡን ይናገራል፤ ልዩነቱ በአካላዊ መልክ፣ በተመልካቾቹ ግንዛቤ ወይም በሌላ ሁኔታ መሆኑን ግን አይወስንም። ትርጉሙ ይህን ክፍትነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩን ሁለት የእንቅስቃሴ አገላለጾች በአማርኛ የሚፈጠር ከባድ ድግግሞሽን በማስወገድ ‘በእግራቸው … እየሄዱ ሳሉ’ በሚል ተዋህደዋል።
