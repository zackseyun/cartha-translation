  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ πιστεύσας καὶ βαπτισθεὶς σωθήσεται, ὁ δὲ ἀπιστήσας κατακριθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/016.yaml
  text: The one who has believed and been baptized will be saved[b][a], but the one who has disbelieved will be condemned.
translation:
  language: am
  text: 'ያመነና የተጠመቀ ይድናል[a][b]፤ ያላመነ ግን ይኮነናል።


    [a] ወይም በተለመደ አነጋገር፦ “የሚያምንና የሚጠመቅ ሁሉ ይድናል፤ የማያምን ግን ይኮነናል።”


    [b] ወይም፦ “አምኖ የተጠመቀ።”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም በተለመደ አነጋገር፦ “የሚያምንና የሚጠመቅ ሁሉ ይድናል፤ የማያምን ግን ይኮነናል።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፦ “አምኖ የተጠመቀ።”
    reason: previous_rendering
lexical_decisions:
- source_word: ὁ πιστεύσας
  choice: ያመነ
  rationale: The substantival aorist participle is rendered with a generic representative singular relative form. ያመነ naturally presents belief as completed relative to the future outcome without limiting the reference to males.
- source_word: βαπτισθεὶς
  choice: የተጠመቀ
  rationale: This preserves the aorist participial sense and explicitly retains the passive/reflexive morphology conventionally used in Amharic for receiving baptism.
- source_word: σωθήσεται
  choice: ይድናል
  rationale: ይድናል is the established, natural Amharic equivalent for the future passive soteriological sense of σῴζω in this context.
- source_word: ὁ δὲ ἀπιστήσας
  choice: ያላመነ ግን
  rationale: ያላመነ directly contrasts with ያመነ and preserves the generic singular participial construction; ግን clearly conveys the adversative force of δέ.
- source_word: κατακριθήσεται
  choice: ይፈረድበታል
  rationale: This idiomatic passive construction communicates an adverse judicial verdict—condemnation—without adding details about the sentence or punishment.
- source_word: καὶ
  choice: -ና
  rationale: The Amharic conjunctive suffix naturally and directly coordinates believing and being baptized.
- source_word: δὲ
  choice: ግን
  rationale: ግን naturally marks the contrast between the two clauses.
theological_decisions:
- issue: Relationship of belief and baptism to salvation
  choice: Both participles are coordinated plainly in the description of the person who will be saved.
  alternative: Explicitly make baptism either the instrumental cause of salvation or merely incidental.
  rationale: The Greek joins belief and baptism in the first clause, while the second clause explicitly identifies disbelief—not lack of baptism—as the ground stated for condemnation. The translation preserves this asymmetry and does not settle the doctrinal tension.
- issue: Generic masculine singular construction
  choice: Use the generic singular relative forms ያመነ and ያላመነ.
  alternative: Use plural forms or add an explicitly gendered noun such as ሰው.
  rationale: Amharic relative verb forms preserve the representative singular naturally without implying that the saying applies only to men.
- issue: Force of κατακριθήσεται
  choice: Render as ይፈረድበታል, an adverse judgment in context.
  alternative: Use the broader ይፈረድበታል only as neutral judgment, or expand it into an explicit statement of eternal punishment.
  rationale: The source verb denotes condemnation, but the verse itself does not spell out the character or duration of the sentence. The context supplies the adverse force without interpretive expansion.
translation_notes:
  register: Modern standard Amharic in Ge'ez script. The wording is concise, dignified, and accessible. The main text preserves the source's representative singular and completed-action perspective, while the first footnote supplies the more idiomatic generic-present formulation.
