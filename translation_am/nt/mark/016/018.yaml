  text: ⸀ὄφεις ἀροῦσιν κἂν θανάσιμόν τι πίωσιν οὐ μὴ αὐτοὺς βλάψῃ, ἐπὶ ἀρρώστους χεῖρας ἐπιθήσουσιν καὶ καλῶς ἕξουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/018.yaml
  text: They will pick up snakes[a], and if they drink anything deadly, it will certainly not harm them; they will lay hands on the sick[d][c][b], and they will recover.
translation:
  language: am
  text: እባቦችን[a] ያነሳሉ፤ ለሞት የሚዳርግ ማንኛውንም ነገር[b] ቢጠጡ እንኳ፣ ከቶ አይጎዳቸውም። በታመሙ ሰዎች ላይ እጆቻቸውን ይጭናሉ፤ እነርሱም ደኅና ይሆናሉ[c]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ ቀደምት የእጅ ጽሑፎች ማርቆስ 16፥9–20ን አያካትቱም፤ ይህ ቁጥር የማርቆስ ረጅሙ መደምደሚያ አካል ነው።
    reason: textual_variant
  - marker: b
    text: ወይም፣ ‘የሚገድል ማንኛውንም ነገር’፤ ሐረጉ ሰፊ ነው፣ በመርዝ ብቻም አይወሰንም።
    reason: lexical_alternative
  - marker: c
    text: ቃል በቃል፣ ‘ደኅና ይሆናሉ።’
    reason: lexical_alternative
