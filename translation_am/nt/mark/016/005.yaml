id: MRK.16.5
reference: Mark 16:5
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ εἰσελθοῦσαι εἰς τὸ μνημεῖον εἶδον νεανίσκον καθήμενον ἐν τοῖς δεξιοῖς περιβεβλημένον στολὴν λευκήν, καὶ ἐξεθαμβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/005.yaml
  text: And when they entered the tomb, they saw a young man sitting on the right, clothed in a white robe, and they were alarmed.
translation:
  language: am
  text: መቃብሩ ውስጥ በገቡ ጊዜ፣ በቀኝ በኩል ተቀምጦ ነጭ ረጅም ልብስ የለበሰ አንድ ወጣት[a] አዩ፤ እጅግም ደነገጡ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “መልአክ።” ማርቆስ እዚህ “ወጣት” ብሎ ይገልጠዋል፤ ሰፊው ዐውደ ንባብና ተጓዳኝ ዘገባዎች ግን መልአካዊ መልእክተኛ መሆኑን ያመለክታሉ።
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθοῦσαι
  choice: በገቡ ጊዜ
  rationale: የአኦሪስት አንቀጽ ግንኙነቱን እንደ ጊዜ አመልካች በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ባለቤቶቹ ከዐውደ ንባቡ ሴቶቹ ናቸው።
- source_word: μνημεῖον
  choice: መቃብር
  rationale: በትንሣኤው ዐውድ የቀብር ስፍራውን በግልጽና በተለመደ አማርኛ ይገልጣል።
- source_word: νεανίσκον
  choice: አንድ ወጣት
  rationale: ግሪኩ በቀጥታ ወጣት ወንድን ይጠቁማል፤ በዚህ ቁጥር ጽሑፉ በግልጽ ‘መልአክ’ ስለማይል ገላጭ አጠራሩ ተጠብቋል።
- source_word: καθήμενον
  choice: ተቀምጦ
  rationale: የወጣቱን አቀማመጥ በተፈጥሯዊና ቀጥተኛ አማርኛ ይገልጣል።
- source_word: ἐν τοῖς δεξιοῖς
  choice: በቀኝ በኩል
  rationale: በመቃብሩ ውስጥ የነበረበትን ስፍራ በተለመደ የአማርኛ አገላለጽ ያሳያል።
- source_word: περιβεβλημένον στολὴν λευκήν
  choice: ነጭ ረጅም ልብስ የለበሰ
  rationale: የፍጹም አንቀጹን የለበሰበት ሁኔታ ያስተላልፋል፤ στολή ከተራ ልብስ ይልቅ ረጅም ውጫዊ ልብስን ሊያመለክት ስለሚችል ‘ረጅም’ ተጨምሯል።
- source_word: ἐξεθαμβήθησαν
  choice: እጅግም ደነገጡ
  rationale: ከተራ መደነቅ የበረታ ድንጋጤና መረበሽ ይገልጣል፤ ወደ ፍጹም ሽብር ሳያጋንን የግሪኩን ጥንካሬ ይጠብቃል።
theological_decisions:
- issue: የνεανίσκος ማንነት
  choice: በዋናው ጽሑፍ ‘ወጣት’ ተብሎ ገላጭ አጠራሩ ተጠብቋል።
  alternative: መልአክ
  rationale: ሰፊው ዐውደ ንባብ፣ ነጩ ልብስና ተጓዳኝ ዘገባዎች መልአካዊ መልእክተኛ መሆኑን ቢጠቁሙም፣ ማርቆስ 16፥5 ራሱ νεανίσκος የሚለውን ገላጭ ቃል ይጠቀማል። ስለዚህ ትርጉሙ የጽሑፉን አሻሚነት ሳይፈታ ጠብቆታል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ አንቀጽ ግንኙነት በተፈጥሯዊ የጊዜ ሐረግ ተላልፏል፤ የወጣቱ ማንነት ግን በዋናው ጽሑፍ አልተተረጎመም።
