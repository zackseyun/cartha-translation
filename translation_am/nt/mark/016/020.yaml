  text: እነርሱም ወጥተው በሁሉም ስፍራ አወጁ፤ ጌታም ከእነርሱ ጋር ይሠራ ነበር፤ ቃሉንም[a] በተከተሉት ምልክቶች[b] ያረጋግጥ ነበር።
  philosophy: optimal-equivalence
  footnotes:
