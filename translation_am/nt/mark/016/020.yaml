    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνοι δὲ
  choice: እነርሱም
  rationale: ዐረፍተ ነገሩን ከቀደመው ትረካ ጋር በተፈጥሮ ያያይዛል፤ ἐκεῖνοι የቀደመውን የደቀ መዛሙርት ቡድን ያመለክታል።
- source_word: ἐξελθόντες
