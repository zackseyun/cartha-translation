theological_decisions:
- issue: “ጌታ” የሚለው ማንን እንደሚያመለክት
  choice: ዋናው ጽሑፍ “ጌታ” የሚለውን ማዕረግ እንዳለ ይጠብቃል፤ የቅርብ አውዱ ከሞት የተነሣውን ኢየሱስን ያመለክታል።
  alternative: በአጠቃላይ እግዚአብሔርን ማመልከቱ
  rationale: ማርቆስ 16፥19 ኢየሱስን “ጌታ” ብሎ ስለሚጠራው ይህ ማጣቀሻ በቅርብ አውዱ ይቀጥላል፤ ትርጉሙ ግን ስሙን በመጨመር ከምንጩ በላይ አይገልጽም።
- issue: የምልክቶቹ ተግባር
  choice: ምልክቶቹ የታወጀውን ቃል የማረጋገጫ መንገድ ሆነው ቀርበዋል።
  alternative: ምልክቶቹ አዋጆቹን ብቻ ተከትለዋል፣ የማረጋገጥ ተግባር ግን የላቸውም።
  rationale: የሰዋስው አወቃቀሩ “ቃሉን ማረጋገጥ”ን ከ“በምልክቶች” ጋር በግልጽ ያገናኛል፤ ከዚህ ባለፈ ስለምልክቶች ቆይታ ወይም መደበኛነት አቋም አይጨመርም።
