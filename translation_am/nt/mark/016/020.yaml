- source_word: ἐκήρυξαν πανταχοῦ
  choice: በየስፍራው ሁሉ አወጁ
  rationale: κηρύσσω የሕዝብ ፊት ይፋዊ አዋጅን ያመለክታል፤ አወጁ ይህን ስፋት ከሃይማኖታዊ ቴክኒካዊ ቃል ውጭ ይጠብቃል።
- source_word: τοῦ κυρίου συνεργοῦντος
  choice: ጌታም ከእነርሱ ጋር ይሠራ ነበር
  rationale: የግሪኩን የጌታ ተባባሪ እንቅስቃሴ እና ከአዋጁ ጋር ያለውን በአንድ ጊዜ መከናወን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τὸν λόγον
  choice: ቃሉን
