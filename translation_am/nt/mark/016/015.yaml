  choice: ወደ ዓለም ሁሉ
  rationale: κόσμος የተልእኮውን ሰፊ መድረክ ያመለክታል፤ ἅπαντα ደግሞ ሙሉነቱን ያጠናክራል። «ዓለም ሁሉ» ይህን አጠቃላይ ወሰን በተፈጥሯዊ አማርኛ ይጠብቃል።
