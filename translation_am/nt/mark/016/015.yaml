  yaml_path: translation/nt/mark/016/015.yaml
  text: And he said to them[b][a], “Go into all the world and proclaim the good news to all creation.”
translation:
  language: am
  text: እርሱም፣ “ወደ ዓለም ሁሉ ሂዱ፤ የምሥራቹን[b] ለፍጥረት ሁሉ[a] አውጁ” አላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለፍጡር ሁሉ።” የግሪኩ ሐረግ እያንዳንዱን ፍጡር ለይቶ ወይም ፍጥረትን በጥቅል እንደሚያመለክት ተደርጎ ሊተረጎም ይችላል።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ “ወንጌሉን።” የግሪኩ εὐαγγέλιον ቃል በቀጥታ “የምሥራች” ማለት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: Πορευθέντες
  choice: ሂዱ
  rationale: ዋናውን ትእዛዝ ቀድሞ የመጣው የግስ ተውሳከ አካል ከκηρύξατε ጋር የተጓዳኝ ሁኔታ ኃይል አለው፤ በተፈጥሯዊ አማርኛ ይህ «ሂዱ» በሚል ትእዛዝ በግልጽ ይተላለፋል።
