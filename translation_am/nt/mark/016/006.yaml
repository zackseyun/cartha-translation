  register: ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛ ተጠቅሟል። የአማርኛን ተፈጥሯዊ የቃላት ቅደም ተከትሎ ናዝሬታዊውን ከኢየሱስ በፊት አስቀምጧል፤ የማርቆስን ታሪካዊ የአሁን ጊዜ በቀጥታ መኮረጅ በአማርኛ ሰው ሠራሽ ስለሚመስል ተፈጥሯዊው ያለፈ ጊዜ ተመርጧል።
