  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ δὲ λέγει αὐταῖς· Μὴ ἐκθαμβεῖσθε· Ἰησοῦν ζητεῖτε τὸν Ναζαρηνὸν τὸν ἐσταυρωμένον· ἠγέρθη, οὐκ ἔστιν ὧδε· ἴδε ὁ τόπος ὅπου ἔθηκαν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/006.yaml
  text: But he says to them[a], “Do not be alarmed. You are looking for Jesus the Nazarene, the one who has been crucified. He has been raised; he is not here[b]. Look—the place where they laid him.”
translation:
  language: am
  text: እርሱ ግን እንዲህ አላቸው፤ “አትደንግጡ። የተሰቀለውን ናዝሬታዊውን[a] ኢየሱስን ትፈልጋላችሁ። እርሱ ተነሥቷል[b]፤ እዚህ የለም። እርሱን ያኖሩበትን ስፍራ ተመልከቱ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የናዝሬቱ” ወይም “ናዝራዊው።” የግሪኩ ቃል ከናዝሬት የተወሰደ መጠሪያ ነው።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ተነሣ” ወይም “ተነሥቶአል።” የግሪኩ ግስ ተሳቢ ነው፤ “ተነሥቷል” የሚለው ይህን ቅርጽ ያሳያል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκθαμβεῖσθε
  choice: አትደንግጡ
  rationale: ግሱ ከተራ መደነቅ ይልቅ ከፍተኛ ድንጋጤንና ስሜታዊ መረበሽን ያመለክታል፤ ይህ አገላለጽ ተፈጥሯዊና ለአውዱ ተስማሚ ነው።
- source_word: Ναζαρηνὸν
  choice: ናዝሬታዊውን
  rationale: ከናዝሬት ስም የተወሰደውን የግሪክ ቅጽል በመጠሪያ ስም መልክ ይጠብቃል።
- source_word: ἐσταυρωμένον
  choice: የተሰቀለውን
  rationale: ፍጹም ተሳቢው የተፈጸመውን ስቅለትና ቀጣይ ጠቀሜታውን ያመለክታል፤ የአማርኛው አንጻራዊ ቅጽ ተፈጥሯዊ ሆኖ ይህን ይይዛል።
- source_word: ἠγέρθη
  choice: እርሱ ተነሥቷል
  rationale: የአማርኛው ተነሥቷል የትንሣኤውን እውነታ በተፈጥሯዊ አገላለጽ ያስተላልፋል፤ የግሪኩ ቅርጽ ሰዋሰዋዊ ተሳቢ መሆኑ በማስታወሻ ተጠብቋል።
- source_word: ὧδε
  choice: በዚህ
  rationale: ቀጥተኛና ተፈጥሯዊ የቦታ አመልካች ነው።
- source_word: ἴδε
  choice: ተመልከቱ
  rationale: ትኩረታቸውን ወደ መቃብሩ ስፍራ የሚመራ የትእዛዝ ቅጽ ሲሆን ዘመናዊና የተከበረ ነው።
- source_word: τόπος
  choice: ስፍራ
  rationale: በዐውዱ ያለውን የተወሰነ የመቃብር ቦታ በግልጽና በተከበረ ቋንቋ ይገልጣል።
- source_word: ἔθηκαν
  choice: ያኖሩበትን
  rationale: በቀብር ዐውድ ውስጥ አስከሬኑን በዚያ ማኖራቸውን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ζητεῖτε
  choice: ትፈልጋላችሁ
  rationale: በዚያን ጊዜ እየፈለጉት መሆናቸውን የሚያሳይ ግልጽና የተለመደ አማርኛ ነው።
- source_word: λέγει αὐταῖς
  choice: እንዲህ አላቸው
  rationale: ግሪኩ ታሪካዊ የአሁን ጊዜን ቢጠቀምም፣ በአማርኛ ትረካ ያለፈ ጊዜ ይበልጥ ተፈጥሯዊ ስለሆነ የንግግሩን ሕያውነት “እንዲህ” በማለት ጠብቋል።
theological_decisions:
- issue: የትንሣኤው አገላለጽና የግሱ ድምፅ
  choice: እርሱ ተነሥቷል
  alternative: እርሱ ተነሥቷል/ከሞት ተነሥቷል፤ በቃል ቅርብ አገላለጽ፦ ተነሥቷል (ተነሥቶአል) ወይም እንዲነሣ ተደርጓል
  rationale: ἠγέρθη በግሪክ ተሳቢ ቅርጽ ነው፤ ይህም እግዚአብሔርን ያልጠቀሰ ነገር ግን የእርሱን ድርጊት ሊያመለክት የሚችል አገላለጽ ነው። በአማርኛ “ተነሥቷል” የተለመደና ግልጽ ሲሆን፣ የሰዋሰውን ልዩነት ሳይደብቅ በማስታወሻ ማቅረብ አሻሚነቱን ይጠብቃል።
