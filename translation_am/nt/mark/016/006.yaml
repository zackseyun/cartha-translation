review_pass:
  verdict: revise
  source_fidelity: The draft communicates the central sense well, including the crucified Jesus, the resurrection, his absence from the tomb, and the place of burial. However, ὧδε is more naturally rendered by እዚህ, and the final relative clause should explicitly retain the object ‘him’ (αὐτόν). The Greek passive ἠγέρθη should be retained in the wording and explained accurately in a note.
  naturalness: አትደንግጡ and ተመልከቱ are natural modern standard Amharic. በዚህ የለም is less idiomatic than እዚህ የለም. Explicitly saying እርሱን in the final clause is clear and natural.
  terminology: የተሰቀለውን and ናዝሬታዊውን are appropriate. The note on ἠγέρθη should not define the passive as ‘እንዲነሣ ተደርጓል,’ which introduces a causative formulation not required by the Greek. A lexical-alternative note for Ναζαρηνόν should be anchored at that designation, corresponding to the audit trail.
  issues:
  - severity: medium
    issue: The locative expression በዚህ የለም is awkward in modern Amharic.
    rationale: ὧδε means ‘here’; እዚህ የለም is the normal, direct Amharic expression.
  - severity: medium
    issue: The final clause does not explicitly express αὐτόν (‘him’).
    rationale: ያኖሩበትን can imply the object from context, but እርሱን ያኖሩበትን fully represents the Greek clause without unnecessary expansion.
  - severity: medium
    issue: The existing resurrection footnote inaccurately glosses the Greek passive with a causative construction.
    rationale: ‘እንዲነሣ ተደርጓል’ means that someone caused him to rise and is not a suitable literal equivalent. The note should simply identify the Greek passive and distinguish the active alternative.
  - severity: low
    issue: The lexical alternative for Ναζαρηνόν lacks a footnote anchor.
    rationale: The English audit trail preserves the designation’s alternatives (‘the Nazorean’/‘of Nazareth’). An Amharic note at ናዝሬታዊውን preserves this relevant lexical information.
  revised_text: እርሱ ግን እንዲህ አላቸው፤ “አትደንግጡ። የተሰቀለውን ናዝሬታዊውን[a] ኢየሱስን ትፈልጋላችሁ። እርሱ ተነሥቷል[b]፤ እዚህ የለም። እርሱን ያኖሩበትን ስፍራ ተመልከቱ።”
