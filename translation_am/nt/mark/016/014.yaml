  rationale: ኃይለኛ የቃል ወቀሳን በክብር ባለውና በተለመደ የመጽሐፍ ቅዱስ አማርኛ ይገልጻል።
- source_word: ἀπιστίαν
  choice: አለማመናቸውን
  rationale: የቀረበላቸውን ምስክርነት አለመቀበላቸውን በዚህ አውድ በቀጥታ ይገልጻል።
- source_word: σκληροκαρδίαν
  choice: የልባቸውን ድንዳኔ
  rationale: የልብን መደንደን የሚገልጸውን መጽሐፍ ቅዱሳዊ ዘይቤ ሳያጠፋ ለዘመናዊ አንባቢ ተፈጥሯዊ ነው።
