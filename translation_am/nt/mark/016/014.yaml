  text: Ὕστερον ⸀δὲ ἀνακειμένοις αὐτοῖς τοῖς ἕνδεκα ἐφανερώθη, καὶ ὠνείδισεν τὴν ἀπιστίαν αὐτῶν καὶ σκληροκαρδίαν ὅτι τοῖς θεασαμένοις αὐτὸν ⸀ἐγηγερμένον οὐκ ἐπίστευσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/014.yaml
  text: Later[a], he appeared to the eleven themselves as they were reclining at the table, and he rebuked their unbelief and hardness of heart[c][b], because they had not believed those who had seen him after he had been raised.
translation:
  language: am
  text: ከዚያ በኋላ[a]፣ አሥራ አንዱ በማዕድ ተደግፈው[b] ሳሉ ተገለጠላቸው። ከሞት ከተነሣ በኋላ እርሱን ያዩትን[c] ሰዎች ስላላመኑ፣ አለማመናቸውንና የልባቸውን ድንዳኔ ገሠጻቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በኋላም።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በማዕድ ተቀምጠው።” የግሪኩ ቃል በምግብ ጊዜ በማዕድ ዙሪያ ተደግፎ የመመገብን የዚያን ዘመን ልማድ ያመለክታል።
    reason: cultural_note
  - marker: c
    text: ወይም፣ “እርሱን ከሞት ተነሥቶ ያዩትን።” የግሪኩ አገላለጽ ቃል በቃል “እርሱን ተነሥቶ/ተነስቶ ተገኝቶ ያዩትን” የሚል ሲሆን፣ ተደራጊ ፍጹም ቅርጽ ነው።
    reason: lexical_alternative
