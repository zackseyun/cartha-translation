- source_word: ἐγηγερμένον
  choice: ከሞት ከተነሣ በኋላ
  rationale: ፍጹም ተደራጊው አንቀጽ የትንሣኤውን የተፈጸመ ሁኔታ ያመለክታል። በአማርኛ የተደራጊውን ቅርጽ ቃል በቃል ማስገባት ከባድና አሻሚ ስለሆነ፣ ተፈጥሯዊው የትንሣኤ አገላለጽ ተመርጦ የግሪኩ ቅርጽ በማስታወሻ ተጠብቋል።
- source_word: οὐκ ἐπίστευσαν
  choice: ስላላመኑ
