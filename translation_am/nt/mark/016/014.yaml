- source_word: ἐφανερώθη
  choice: ተገለጠላቸው
  rationale: በትንሣኤ መገለጥ አውድ ተፈጥሯዊና ግልጽ ሲሆን የግሪኩን ተደራጊ ቅርጽም ያንጸባርቃል።
- source_word: ὠνείδισεν
