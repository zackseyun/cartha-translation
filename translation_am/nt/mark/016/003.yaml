lexical_decisions:
- source_word: ἔλεγον
  choice: ይባባሉ ነበር
  rationale: የግሪኩ ኢምፐርፌክት ቅርጽ በመንገድ ላይ ሳሉ ቀጣይ ወይም ተደጋጋሚ ንግግር መሆኑን ያሳያል፤ «ይባባሉ ነበር» ይህን ገጽታ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: πρὸς ἑαυτάς
  choice: እርስ በርሳቸው
  rationale: ቃል በቃል «ወደ ራሳቸው» ሊባል ቢችልም፣ በዚህ ብዙ ቁጥር አውድ ሴቶቹ እርስ በርሳቸው እየተነጋገሩ መሆናቸውን ያመለክታል።
- source_word: Τίς
  choice: ማን
  rationale: ድርጊቱን የሚፈጽም ሰው ማን እንደሆነ የሚጠይቅ ቀጥተኛና ተፈጥሯዊ አቻ ነው።
- source_word: ἀποκυλίσει
  choice: ያንከባልልልናል
  rationale: ግሱ ድንጋዩን ከሚዘጋበት ቦታ በማንከባለል ማስወገድን ይገልጣል፤ የግሪኩን ተጨባጭ ምስልና ἡμῖν የሚያሳየውን «ለእኛ» ትርጉም በአንድ የአማርኛ ግስ ያቀርባል።
- source_word: ἡμῖν
  choice: -ልናል
  rationale: ዳቲቩ ድርጊቱ ለእነርሱ ጥቅም ወይም በእነርሱ ፈንታ እንዲፈጸም ያሳያል፤ ይህ በአማርኛው ግስ ውስጥ በ«-ልናል» ተካቷል።
- source_word: τὸν λίθον
  choice: ድንጋዩን
  rationale: ምንጩ «ድንጋይ» ብቻ ይላል፤ ከአውዱ ትልቅ መሆኑ ቢታወቅም «ትልቁን» የሚል ቃል አልተጨመረም።
- source_word: ἐκ τῆς θύρας
  choice: ከመግቢያ
  rationale: θύρα «በር» ወይም «መግቢያ» ሊሆን ይችላል፤ እዚህ የመቃብር ክፍት መግቢያ ስለሆነ «መግቢያ» በዘመናዊ አማርኛ ግልጽ ነው።
- source_word: τοῦ μνημείου
  choice: የመቃብሩ
  rationale: በትንሣኤው ትረካ አውድ μνημεῖον አስከሬን የተቀመጠበትን መቃብር ያመለክታል፤ «መቃብር» የተለመደና ግልጽ አቻ ነው።
