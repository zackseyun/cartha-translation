  text: Καὶ διαγενομένου τοῦ σαββάτου ⸀Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ⸂ἡ τοῦ⸃ Ἰακώβου καὶ Σαλώμη ἠγόρασαν ἀρώματα ἵνα ἐλθοῦσαι ἀλείψωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/001.yaml
  text: And when the Sabbath was over[a], Mary Magdalene, Mary the mother of James, and Salome bought spices so that they might come and anoint him.
translation:
  language: am
  text: ሰንበትም ካለፈ በኋላ፣ መግደላዊት ማርያም፣ የያዕቆብ ማርያም[a] እና ሰሎሜ ሄደው እንዲቀቡት ሽቱዎችን ገዙ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ግሪኩ ቃል በቃል፣ “የያዕቆብ ማርያም” ይላል፤ ይህም ማርያምን ከያዕቆብ ጋር ባላት ግንኙነት ይለያታል። በተለምዶ የያዕቆብ እናት እንደሆነች ይገባል።
    reason: lexical_alternative
lexical_decisions:
- source_word: διαγενομένου τοῦ σαββάτου
  choice: ሰንበትም ካለፈ በኋላ
  rationale: የግሪኩ የጊዜ አገላለጽ ዋናው ድርጊት ሰንበት ካለፈ በኋላ መፈጸሙን ያሳያል፤ ይህ አተረጓጎም በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: መግደላዊት ማርያም
  rationale: በአማርኛ የመግደላ ከተማ ማንነቷን የሚገልጽ የተለመደ መጠሪያ ነው።
- source_word: Μαρία ἡ τοῦ Ἰακώβου
  choice: የያዕቆብ ማርያም[a]
  rationale: ግሪኩ ‘የያዕቆብ [የሆነችው] ማርያም’ ብሎ ግንኙነቱን ሳይጠቅስ ይገልጻል። አማርኛውም ይህን እውነተኛ አሻሚነት ይጠብቃል፤ ባህላዊው የእናትነት ግንዛቤ በማስታወሻ ተብራርቷል።
- source_word: Σαλώμη
  choice: ሰሎሜ
  rationale: በአማርኛ የተለመደውን የግል ስም አጻጻፍ ይከተላል።
- source_word: ἠγόρασαν
  choice: ገዙ
  rationale: ቀላል የትረካ ግስ ሲሆን ቀጥተኛና ተፈጥሯዊ አቻው ነው።
- source_word: ἀρώματα
  choice: ሽቱዎችን
  rationale: ለቀብር ዝግጅት የሚውሉ መዓዛ ያላቸውን ቅባቶችና ቅመማ ነገሮች በተፈጥሯዊ አማርኛ ያመለክታል።
- source_word: ἵνα ἐλθοῦσαι ἀλείψωσιν αὐτόν
  choice: ሄደው እንዲቀቡት
  rationale: ἵνα ዓላማን ያሳያል፤ ἐλθοῦσαι ከመቀባቱ በፊት ወደ ስፍራው መድረሳቸውን ያመለክታል። ‘ሄደው’ በአማርኛ ከተራኪው እይታ አንጻር ተፈጥሯዊ ሲሆን፣ ‘እንዲቀቡት’ የἀλείφωን ቀጥተኛ ትርጉም ይጠብቃል።
theological_decisions:
- issue: “Μαρία ἡ τοῦ Ἰακώβου” የሚለው አገላለጽ ማርያምን ከያዕቆብ ጋር በምን ዝምድና እንደሚያዛምዳት
