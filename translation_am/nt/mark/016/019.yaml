  rationale: μετά ከአንቀጻዊ የግስ ስም ጋር ያለውን ጊዜያዊ ትርጉምና αὐτοῖς የሚያመለክተውን ተቀባይ በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἀνελήμφθη
