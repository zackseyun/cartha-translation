    reason: ይህ ቁጥር የሚገኝበትን ረጅም የማርቆስ መደምደሚያ ዋና የጽሑፍ ምስክርነት ልዩነት በግልጽና ገለልተኛ ሁኔታ ማመልከት።
lexical_decisions:
