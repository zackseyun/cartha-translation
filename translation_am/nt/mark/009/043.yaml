    text: ወይም፦ “ኃጢአት እንድትሠራ ቢያደርግህ።” የግሪኩ ግስ አንድን ሰው ማሰናከልን፣ እንዲወድቅ ማድረግን ወይም ወደ ኃጢአት ማስገባትን ሊያመለክት ይችላል።
