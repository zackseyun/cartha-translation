  alternative: ኃጢአትን ከመራቅ ጋር ብቻ የሚያመሳስል ገላጭ ትርጉም
  rationale: ምንባቡ የኃጢአትንና የፍርድን ከባድነት በአስደንጋጭ የአካል ምስል ይገልጻል፤ ትርጉሙ ይህን የንግግር ኃይል አያለዝብም።
