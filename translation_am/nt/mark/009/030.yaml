  yaml_path: translation/nt/mark/009/030.yaml
  text: And from there[a] they went on through Galilee[b], and he did not want anyone to know.
translation:
  language: am
  text: ከዚያም ወጥተው በገሊላ ውስጥ እያለፉ ነበር፤[a] እርሱም ማንም እንዲያውቅ አልፈለገም።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በገሊላ ውስጥ እየተጓዙ ነበር” ተብሎም ሊተረጎም ይችላል። የግሪኩ ያልተጠናቀቀ የግስ ቅርጽ ቀጣይ እንቅስቃሴን አጉልቶ ሊያሳይ ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ኢየሱስ ማንም ምን እንዲያውቅ እንዳልፈለገ የግሪኩ ጽሑፍ በግልጽ አይናገርም፤ በአውዱ የሚያመለክተው በገሊላ መገኘቱን ወይም በዚያ የሚያልፍበትን መንገድ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀκεῖθεν
  choice: ከዚያም
  rationale: καί እና ἐκεῖθεν የተዋሐዱበትን የትረካ ቀጣይነትና ከቦታው መነሣት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐξελθόντες
  choice: ወጥተው
  rationale: ከቀደመው ስፍራ መውጣታቸውን በግልጽ ያስቀምጣል፤ የግሪኩን የቀደመ ድርጊት አጭርና ተፈጥሯዊ በሆነ ተያያዥ ግስ ይገልጣል።
- source_word: παρεπορεύοντο
  choice: እያለፉ ሄዱ
  rationale: ያልተጠናቀቀው የግስ ቅርጽ የሚያመለክተውን ቀጣይ ጉዞ ይጠብቃል፤ በክልሉ ውስጥ እያለፉ መጓዛቸውንም በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: διὰ τῆς Γαλιλαίας
  choice: በገሊላ
  rationale: διά ከባለቤት ገላጭ ጋር የሚሰጠውን በአንድ ክልል ውስጥ አልፎ የመሄድ ትርጉም ከእንቅስቃሴ ግሱ ጋር በግልጽ ያቀርባል።
- source_word: οὐκ ἤθελεν
  choice: አልፈለገም
  rationale: θέλω እዚህ የሚገልጠውን ፈቃድ ወይም ፍላጎት በዘመናዊና ግልጽ አማርኛ ይገልጣል።
- source_word: ἵνα τις γνοῖ
  choice: ማንም እንዲያውቅ
  rationale: ዓላማው ሰው እንዳያውቅ መፈለጉ መሆኑን ይገልጣል፤ የሚታወቀው ነገር በግሪኩ እንዳልተገለጠ በትርጉሙም አልተጨመረም።
theological_decisions:
- issue: የἤθελεν ያልተገለጠ ባለቤት
  choice: እርሱም፣ ማለትም ኢየሱስ
  alternative: ግሱን ያለ ግልጽ ተውላጠ ስም መተርጎም
  rationale: ነጠላው ግስ በትረካው አውድ ወደ ኢየሱስ ይመለሳል፤ ‘እርሱም’ ማለት በአማርኛ ግልጽነትን ይሰጣል እንጂ ከጽሑፉ ያለፈ ሥነ መለኮታዊ ይዘት አይጨምርም።
- issue: ያውቁት ዘንድ ያልፈለገው ነገር
  choice: ግልጽ ተሳቢ ሳይጨመር መተው
  alternative: ማንም በዚያ መኖሩን ወይም የጉዞውን መንገድ እንዳያውቅ በማለት ማብራራት
  rationale: ግሪኩ γνοῖ የሚለው ግስ ግልጽ ተሳቢ የለውም። አውዱ የኢየሱስን በዚያ መገኘት ወይም ጉዞ ሊያመለክት ቢችልም፣ ትርጉሙ ይህን አሻሚነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘እያለፉ ሄዱ’ የጉዞውን ቀጣይነት ይጠብቃል፤ የ‘እንዲያውቅ’ ተሳቢ ደግሞ በምንጩ እንዳልተገለጠ ተትቷል።
