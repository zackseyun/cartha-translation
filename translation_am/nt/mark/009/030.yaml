  source_fidelity: The draft accurately represents the departure participle (ἐξελθόντες), travel through Galilee (διὰ τῆς Γαλιλαίας), Jesus as the singular subject of ἤθελεν, and the unstated object of γνοῖ. However, the perfective main verb ሄዱ (“they went”) weakens the ongoing/imperfect force of παρεπορεύοντο.
  naturalness: እያለፉ ሄዱ is understandable, but it combines an ongoing converb with a completed main verb and is less smooth than an imperfect ongoing expression. በገሊላ ውስጥ እያለፉ ነበር is natural modern Amharic and clearly expresses passing through the region.
  terminology: ገሊላ and ኢየሱስ are standard forms. The wording ማንም እንዲያውቅ correctly leaves the object of “know” unstated, as does the Greek.
  issues:
  - severity: low
    issue: The rendering እያለፉ ሄዱ does not consistently preserve the imperfect aspect of παρεπορεύοντο.
