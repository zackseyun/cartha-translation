  text: ὁ δὲ Ἰησοῦς εἶπεν· Μὴ κωλύετε αὐτόν, οὐδεὶς γάρ ἐστιν ὃς ποιήσει δύναμιν ἐπὶ τῷ ὀνόματί μου καὶ δυνήσεται ταχὺ κακολογῆσαί με·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/039.yaml
  text: But Jesus said[a], “Do not stop him[b], for there is no one who will do a mighty work in my name and soon be able to speak evil of me.”
translation:
  language: am
  text: ኢየሱስ ግን እንዲህ አለ፦ “አትከልክሉት፤ በስሜ ኃያል ሥራ[a] የሚያደርግና ብዙም ሳይቆይ ስለ እኔ ክፉ ሊናገር[b] የሚችል ማንም የለምና።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ተአምር”፤ በግሪክ “ኃይል” ወይም “ኃያል ድርጊት” (δύναμιν)።
    reason: lexical_alternative
  - marker: b
    text: ወይም “ሊሰድበኝ” ወይም “ሊዘልፈኝ”፤ በግሪክ “ስለ እኔ ክፉ ሊናገር”።
    reason: lexical_alternative
lexical_decisions:
- source_word: κωλύετε
  choice: አትከልክሉት
  rationale: μή ከአሁን ጊዜ ትእዛዛዊ ግስ ጋር የተሰጠውን ክልከላ በቀጥታ ያሳያል፤ በዐውዱም ደቀ መዛሙርቱ ሰውየውን ለማስቆም መሞከራቸውን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: δύναμιν
  choice: የኃይል ሥራ
  rationale: የቃሉን ‘ኃይል’ መሠረታዊ ፍቺና በወንጌላት ውስጥ ያለውን ኃያል ድርጊት የማመልከት አጠቃቀም ይጠብቃል፤ ‘ተአምር’ ብሎ ብቻ በማለት የፍቺውን ክልል አያጠብም።
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: በስሜ
  rationale: ድርጊቱ የኢየሱስን ስም በመጥራት ወይም በሥልጣኑ እንደሚደረግ በአጭርና በተለመደ አገላለጽ ያስተላልፋል።
- source_word: ταχὺ
  choice: ብዙም ሳይቆይ
  rationale: የጊዜን ቅርበት በተፈጥሯዊ አማርኛ ይገልጣል፤ የድርጊቱን ፍጥነት እንጂ ጊዜውን እንዳያመለክት የሚያደርግ አሻሚነትን ያስወግዳል።
- source_word: κακολογῆσαί με
  choice: ስለ እኔ ክፉ ሊናገር
  rationale: ‘ክፉ መናገር፣ መስደብ፣ ስም ማጥፋት’ የሚለውን የግሱን ሰፊ ክልል ሳያጠብ የግሪኩን አገላለጽ በግልጽ አማርኛ ያቀርባል።
- source_word: οὐδεὶς γάρ ἐστιν ὃς … δυνήσεται
  choice: … ሊናገር የሚችል ማንም የለምና
  rationale: የግሪኩን ‘ማንም የለም’ አጽንዖትና የመቻልን ሐሳብ ይጠብቃል፤ ‘-ና’ም γάρ የሚሰጠውን ምክንያት ያመለክታል።
theological_decisions:
- issue: በኢየሱስ ስም የተደረገው ድርጊት ምንነት
  choice: δύναμινን ‘የኃይል ሥራ’ ብሎ መተርጎም
  alternative: ‘ተአምር’ ወይም ‘ኃያል ሥራ’
  rationale: ይህ ምርጫ የምንጩን የፍቺ ስፋት ይጠብቃል፤ ጽሑፉ ከሚለው በላይ ድርጊቱን በአንድ የተወሰነ ዘመናዊ የ‘ተአምር’ ግንዛቤ አይገድበውም።
- issue: ድርጊት ፈጻሚው ከኢየሱስ ጋር ያለው ግንኙነት
  choice: ኢየሱስ በዚህ ጥቅስ የተናገረውን ውስን ምክንያት ብቻ ማቅረብ
  alternative: ሰውየው ሙሉ ደቀ መዝሙር ነው ወይም ስሙን ለጥቅሙ ብቻ ይጠቀማል የሚል ትርጓሜ መጨመር
  rationale: ጥቅሱ በኢየሱስ ስም የኃይል ሥራ የሚያደርግ ሰው ብዙም ሳይቆይ ስለ እርሱ ክፉ ሊናገር እንደማይችል ይናገራል፤ ስለ ሰውየው መንፈሳዊ ሁኔታ ተጨማሪ ፍርድ አይሰጥም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ምክንያታዊ አወቃቀር ተጠብቆ ንግግሩ በአማርኛ ተፈጥሯዊ እንዲሆን ተደርጓል። የማስታወሻ ምልክቶቹ ከሚያብራሯቸው ቃላት ጋር በትክክል ተያይዘዋል።
