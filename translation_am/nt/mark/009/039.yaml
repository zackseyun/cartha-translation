review_pass:
  verdict: revise
  source_fidelity: The draft accurately reflects the prohibition (Μὴ κωλύετε), action in Jesus’ name, the temporal force of ταχὺ, and the future potential of δυνήσεται. Its wording for κακολογῆσαί με appropriately conveys hostile speech without adding claims about the practitioner’s standing. However, የኃይል ሥራ is an overly literal and somewhat unnatural Amharic noun phrase; it can suggest work involving power rather than a powerful deed.
  naturalness: The sentence is otherwise clear, modern, and suitably dignified. Replacing የኃይል ሥራ with ኃያል ሥራ gives a natural Amharic expression while retaining the sense of δύναμιν as a powerful deed rather than restricting it to ‘miracle.’
  terminology: ኢየሱስ, በስሜ, and ክፉ ሊናገር are appropriate. ኃያል ሥራ is preferable terminology for δύναμιν in this context. The second note’s alternative should use a direct equivalent of reviling rather than the more specifically reputational ‘defame my name.’
  issues:
  - severity: low
    issue: የኃይል ሥራ is unnatural in this context.
    rationale: Although lexically motivated, the genitive phrase is not idiomatic for a mighty deed in modern standard Amharic and may be understood as work related to power.
  - severity: low
    issue: The alternative ስሜን ሊያጠፋ in footnote b is narrower than κακολογῆσαί με.
    rationale: The Greek denotes speaking abusively or badly of Jesus, not necessarily damaging his reputation; ሊዘልፈኝ is a closer alternative.
  revised_text: ኢየሱስ ግን እንዲህ አለ፦ “አትከልክሉት፤ በስሜ ኃያል ሥራ[a] የሚያደርግና ብዙም ሳይቆይ ስለ እኔ ክፉ ሊናገር[b] የሚችል ማንም የለምና።”
