base_translation:
  language: en
  yaml_path: translation/nt/mark/009/031.yaml
  text: For he was teaching his disciples and telling them[a], “The Son of Man is being handed over into the hands of men, and they will kill him, and after he is killed[b], after three days he will rise.”
translation:
  language: am
  text: ደቀ መዛሙርቱን እያስተማረ እንዲህ ይላቸው ነበርና፦ “የሰው ልጅ ወደ ሰዎች እጅ[a] እየተሰጠ ነው፤ እነርሱም ይገድሉታል፤ ከተገደለ በኋላም፣ ከሦስት ቀን በኋላ[b] ይነሣል።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በሰዎች እጅ።” ግሪክኛው ቃል በቃል “ወደ ሰዎች እጆች” ይላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በሦስት ቀን።” እዚህ የግሪክኛው ጽሑፍ “ከሦስት ቀን በኋላ” ይላል፤ ይህ አነጋገር በሌሎች ስፍራዎች “በሦስተኛው ቀን” ከሚለው ጋር ጎን ለጎን ጥቅም ላይ ይውላል።
    reason: alternative_reading
