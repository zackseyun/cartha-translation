source:
  edition: SBLGNT
  text: καὶ καθίσας ἐφώνησεν τοὺς δώδεκα καὶ λέγει αὐτοῖς· Εἴ τις θέλει πρῶτος εἶναι ἔσται πάντων ἔσχατος καὶ πάντων διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/035.yaml
  text: And sitting down, he called the twelve and says to them, “If anyone wants to be first, he will be last of all and servant of all.”
translation:
  language: am
  text: ኢየሱስም ተቀምጦ አሥራ ሁለቱን ጠራና፣ “ማንም ቀዳሚ መሆን ቢፈልግ፣ ከሁሉ የመጨረሻና የሁሉ አገልጋይ ይሆናል” አላቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθίσας
  choice: ተቀምጦ
  rationale: የግሪክ የቅድሚያ ድርጊትን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: πρῶτος
  choice: ቀዳሚ
  rationale: በደረጃና በክብር ፊተኛ መሆንን በአጭሩ ይገልጻል።
- source_word: ἔσχατος
  choice: የመጨረሻ
  rationale: ከπρῶτος ጋር ያለውን ቀጥተኛ ተቃርኖ ይጠብቃል።
- source_word: διάκονος
  choice: አገልጋይ
  rationale: ሌሎችን የሚያገለግል ሰው የሚለውን መሠረታዊ ትርጉም ያስተላልፋል፤ የተቋማዊ ማዕረግ አያስገባም።
- source_word: λέγει
  choice: አላቸው
  rationale: የታሪካዊ አሁን ጊዜውን በተፈጥሯዊ የአማርኛ ትረካ ያቀርባል፤ የግሪኩን የንግግር መግቢያ ተግባር ይጠብቃል።
- source_word: ἔσται
  choice: ይሁን
  rationale: በዚህ የደቀ መዝሙርነት ትምህርት ውስጥ ያለውን ትእዛዛዊ ኃይል በተፈጥሯዊ አማርኛ ያሳያል፤ የግሪኩ ቅርጽ ግን የወደፊት ጊዜ መሆኑ በውሳኔው ተመዝግቧል።
theological_decisions:
- issue: ἔσται የወደፊት ጊዜ ቅርጽ እንደ ትእዛዝ ወይስ እንደ ውጤት
  choice: ይሁን
  alternative: ይሆናል
  rationale: ንግግሩ ቀዳሚ መሆንን ለሚፈልግ ሰው የደቀ መዝሙርነት መንገድ እያስተማረ ነው። “ይሁን” ይህን ኃይል ያሳያል፤ “ይሆናል” የግሪኩን ሰዋሰዋዊ ቅርጽ በይበልጥ በቀጥታ ይከተላል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለሕዝብ ቀላል የሆነ የአማርኛ ትረካ። ግልጽ ለማድረግ የኢየሱስ ስም ተጨምሯል፤ በቀደመው አውድ ያለውን ተውላጠ ስም ይገልጻል።
