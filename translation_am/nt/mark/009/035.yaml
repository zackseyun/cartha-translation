review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents καθίσας, the calling of the Twelve, and the paired expressions “last of all” and “servant of all.” However, ἔσται is future indicative, not imperative; rendering it as ይሁን changes the statement into a direct command and does not preserve the source form’s ambiguity/force as closely as ይሆናል.
  naturalness: The wording is clear, idiomatic modern standard Amharic, and appropriately dignified. The conditional construction reads naturally with ይሆናል.
  terminology: ቀዳሚ, የመጨረሻ, and አገልጋይ are suitable nonsectarian renderings of πρῶτος, ἔσχατος, and διάκονος. The explicit subject ኢየሱስ is contextually clear and does not alter the sense.
  issues:
  - severity: medium
    issue: ἔσται is rendered as ይሁን.
    rationale: The Greek is future indicative (“will be”), whereas ይሁን is an imperative (“let him be/be”). Although the saying can carry exhortative implications, the translation should retain the indicative wording without resolving it into an imperative.
  revised_text: ኢየሱስም ተቀምጦ አሥራ ሁለቱን ጠራና፣ “ማንም ቀዳሚ መሆን ቢፈልግ፣ ከሁሉ የመጨረሻና የሁሉ አገልጋይ ይሆናል” አላቸው።
  revised_footnotes: []
  revision_rationale: Only the rendering of ἔσται has been changed, from the imperative ይሁን to the future indicative ይሆናል, preserving the Greek grammatical form and avoiding an unnecessary interpretive narrowing. No footnotes are required.
