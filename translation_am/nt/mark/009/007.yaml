base_translation:
  language: en
  yaml_path: translation/nt/mark/009/007.yaml
  text: 'And a cloud came[a], overshadowing them, and a voice came out of the cloud: “This is my beloved Son; listen to him.”'
translation:
  language: am
  text: ደመናም መጥቶ ጋረዳቸው፤ ከደመናውም ድምፅ ወጣ፤ “ይህ የምወደው ልጄ ነው፤ እርሱን አድምጡ[a]።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እርሱን ስሙ።” ትእዛዙ ድምፅን ብቻ ከመስማት ይልቅ በትኩረት ሰምቶ ቃሉን ልብ ማለትን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: መጥቶ / መጣ
  rationale: ግሱ ደመናውና ድምፁ በድንገት መከሰታቸውን በተፈጥሯዊ አማርኛ ያሳያል፤ በግሪኩ ያለውን ክስተታዊ ኃይል ሳይጨምር ይጠብቃል።
- source_word: νεφέλη
  choice: ደመና
  rationale: የቃሉ ቀጥተኛና መደበኛ ፍቺ ነው፤ መለኮታዊ መገኘትን የሚያስታውሰውን ዐውድ በትርጓሜ ሳይሰፋ ይተዋል።
- source_word: ἐπισκιάζουσα
  choice: ጋረዳቸው
  rationale: ደመናው በእነርሱ ላይ ጥላ ማድረጉን ወይም መሸፈኑን በተፈጥሯዊና ክቡር አማርኛ ያሳያል።
- source_word: φωνή
  choice: ድምፅ
  rationale: በዐውዱ ግልጽ ንግግር የሚያሰማ ድምፅ ነው፤ በግሪኩ የሌለውን ‘ተናገረ’ የሚል ግስ አልተጨመረም።
- source_word: ἐκ τῆς νεφέλης
  choice: ከደመናው
  rationale: የἐκን የመነሻ ኃይል በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: የምወደው ልጄ
  rationale: የአባትና የልጅን ግንኙነት እና የἀγαπητόςን የፍቅር ክብደት በተፈጥሯዊ ዘመናዊ አማርኛ ይጠብቃል።
- source_word: ἀκούετε αὐτοῦ
  choice: እርሱን አድምጡ
  rationale: የአሁን ጊዜ ትእዛዙ በትኩረት መስማትንና ለተሰማው ትኩረት መስጠትን ያመለክታል፤ ‘ታዘዙት’ ብሎ ትርጉሙን አያጠብም።
theological_decisions:
- issue: የኢየሱስ ማንነትን የሚገልጠው መለኮታዊ ንግግር
  choice: “ይህ የምወደው ልጄ ነው” ተብሎ ቀጥተኛ የሰማይ ማረጋገጫ ሆኖ ተተርጉሟል።
  alternative: የትርጓሜ ሐሳብ ጨምሮ የልጅነቱን ዓይነት ማብራራት።
  rationale: ግሪኩ ኢየሱስን የእግዚአብሔር ልጅ ብሎ በግልጽ ያቀርባል፤ ትርጉሙም ከጽሑፉ በላይ የሆነ የእምነት ሥርዓት ማብራሪያ አይጨምርም።
- issue: የἀκούετε αὐτοῦ ትእዛዛዊ ኃይል
  choice: “እርሱን አድምጡ”
  alternative: “እርሱን ስሙ” ወይም “እርሱን ታዘዙ”
  rationale: ቃሉ በትኩረትና ተቀባይነት መስማትን ያካትታል፤ ነገር ግን ‘መታዘዝ’ ብቻ ብሎ አይወስነውም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ሁለት ተከታታይ ክስተቶችና ቀጥተኛ ንግግር በሰረዝ ነጥብ ተለይተዋል። የእግሊዝኛው የእግር ማስታወሻ ይዘት ከἀκούετε αὐτοῦ ጋር ስለሚዛመድ፣ [a] ምልክቱ ከ“አድምጡ” በኋላ ተቀምጧል።
