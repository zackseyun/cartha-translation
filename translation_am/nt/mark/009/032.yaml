lexical_decisions:
- source_word: οἱ δὲ
  choice: እነርሱ ግን
  rationale: δέ ከቀደመው የኢየሱስ ንግግር ጋር ያለውን ቀላል ንፅፅር ያሳያል፤ በዐውዱ ያልተጠቀሱት ሰዎች ደቀ መዛሙርቱ ስለሆኑ “እነርሱ” ተብሏል።
- source_word: ἠγνόουν
  choice: አልተረዱትም
  rationale: በዚህ ዐውድ ἀγνοέω አለማወቅን ብቻ ሳይሆን የተነገረውን ሐሳብ አለመረዳትን ያመለክታል። የኢምፐርፌክት ጊዜው የቀጠለ ያለመረዳት ሁኔታን ይጠቁማል፤ በተፈጥሯዊ አማርኛ በቀላል አሉታዊ ያለፈ ጊዜ ተገልጿል።
- source_word: τὸ ῥῆμα
  choice: ይህን ንግግር
  rationale: ῥῆμα ኢየሱስ አሁን የተናገረውን መልእክት ወይም ንግግር ያመለክታል። “ይህን” ወደ ቀደመው ትንቢታዊ ንግግር በግልጽ ያመለክታል፤ “ንግግር” የቃሉን ሰፊ የተነገረ መልእክት ትርጉም ይጠብቃል።
- source_word: ἐφοβοῦντο
  choice: ፈሩ
  rationale: φοβέομαι የፍርሃት ሁኔታን ያመለክታል። “ፈሩ” በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው፤ የኢምፐርፌክትን ቀጣይ ሁኔታ ዐውዱ ያስገነዝባል።
- source_word: αὐτὸν
  choice: እርሱን
  rationale: ተውላጠ ስሙ ኢየሱስን ያመለክታል፤ ቀጥተኛ ተሳቢ ሆኖ ተተርጉሟል።
- source_word: ἐπερωτῆσαι
  choice: ለመጠየቅ
  rationale: ἐπερωτάω መጠየቅ ወይም ጥያቄ ማቅረብ ማለት ነው። ከ“ፈሩ” ጋር “ለመጠየቅ” ተፈጥሯዊና ትክክለኛ የአማርኛ አገላለጽ ነው።
