  verdict: revise
  source_fidelity: The draft accurately conveys the disciples’ failure to understand Jesus’ preceding utterance and their fear of asking him. However, the Greek imperfect ἐφοβοῦντο is more clearly represented by an ongoing past expression than by the punctual-sounding ፈሩ.
  naturalness: The wording is generally clear and idiomatic. “ለመጠየቅ ይፈሩ ነበር” is especially natural and explicitly retains the ongoing past sense. “ያንን ንግግር” naturally identifies the previously spoken saying without treating the Greek article as an explicit demonstrative.
  terminology: ንግግር is an appropriate rendering of ῥῆμα in this context. The footnote should give genuine lexical alternatives rather than the more interpretive phrase “የተናገረውን.”
  issues:
  - severity: low
    issue: The imperfect aspect of ἐφοβοῦντο is not explicit in “ፈሩ.”
    rationale: Although context can permit a simple past in Amharic, “ይፈሩ ነበር” better reflects the Greek ongoing state of fear while remaining idiomatic.
  - severity: low
    issue: The footnote’s first proposed alternative, “የተናገረውን,” is interpretive rather than a close lexical alternative for τὸ ῥῆμα.
    rationale: The source term can denote a spoken word, saying, or statement. Alternatives such as “ቃሉን” and “ንግግሩን” preserve that lexical range more directly.
  revised_text: እነርሱ ግን ያንን ንግግር[a] አልተረዱትም፤ እርሱን ለመጠየቅም ይፈሩ ነበር።
