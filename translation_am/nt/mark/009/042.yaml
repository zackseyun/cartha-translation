  source_fidelity: 'The translation accurately reflects the Greek: the broad metaphor of σκανδαλίσῃ is retained in “የሚያሰናክል”; “እነዚህ ታናናሾች” preserves the non-exclusive scope of μικρῶν; and “በእኔ ከሚያምኑት” properly renders πιστευόντων εἰς ἐμέ. The comparative warning and the conditional construction are naturally conveyed by “...ቢጣል ይሻለዋል.” “በአህያ የሚዞር የወፍጮ ድንጋይ” correctly identifies μύλος ὀνικός as a donkey-driven millstone.'
