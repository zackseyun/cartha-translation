  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Καὶ ὃς ⸀ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν ⸀τούτων τῶν πιστευόντων ⸂εἰς ἐμέ⸃, καλόν ἐστιν αὐτῷ μᾶλλον εἰ περίκειται ⸂μύλος ὀνικὸς⸃ περὶ τὸν τράχηλον αὐτοῦ καὶ βέβληται εἰς τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/042.yaml
  text: And whoever causes one of these little ones who believe in me to stumble[a], it is better for him if a donkey millstone is put around his neck and he is thrown into the sea.
translation:
  language: am
  text: በእኔ ከሚያምኑት ከእነዚህ ታናናሾች አንዱን የሚያሰናክል ማንም፣ በአህያ የሚዞር የወፍጮ ድንጋይ[a] በአንገቱ ታስሮ ወደ ባሕር ቢጣል ይሻለዋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ትልቅ የወፍጮ ድንጋይ”፤ ይህም በተለይ በአህያ የሚዞረውን ድንጋይ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίσῃ
  choice: የሚያሰናክል
  rationale: የመሰናከልን ዘይቤ ይጠብቃል፤ ግሱ ኃጢአት እንዲሠራ ማድረግን፣ ከእምነት ማውደቅን ወይም መሰናክል መሆንን ሊያመለክት ስለሚችል “ኃጢአት የሚያሠራ” ብሎ ትርጉሙን አያጠብም።
- source_word: μικρῶν τούτων
  choice: ከእነዚህ ታናናሾች
  rationale: አገላለጹን ለሕፃናት ብቻ ሳይወስን፣ ትሑታንን ወይም ደካማ ተደርገው የሚታዩ አማኞችንም እንዲያካትት ስፋቱን ይጠብቃል።
- source_word: τῶν πιστευόντων εἰς ἐμέ
  choice: በእኔ ከሚያምኑት
  rationale: πιστεύω εἰς የሚለውን ግላዊ እምነት ቀጥተኛና ተፈጥሯዊ በሆነ አማርኛ ያቀርባል።
- source_word: καλόν ἐστιν αὐτῷ μᾶλλον
  choice: ይሻለዋል
  rationale: በግሪኩ ያለውን የንጽጽር ኃይል በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: μύλος ὀνικός
  choice: በአህያ የሚዞር የወፍጮ ድንጋይ
  rationale: በእጅ ከሚዞረው ትንሽ ድንጋይ የተለየውን፣ በአህያ የሚዞረውን ትልቅ የወፍጮ ድንጋይ በግልጽ ያመለክታል።
- source_word: περίκειται ... περὶ τὸν τράχηλον
  choice: በአንገቱ ታስሮ
  rationale: በአንገት ዙሪያ መደረጉን በተፈጥሯዊ አማርኛ ያሳያል፤ ከዚያ በኋላ የመጣውን ወደ ባሕር መጣልም በግልጽ ያገናኛል።
- source_word: βέβληται εἰς τὴν θάλασσαν
  choice: ወደ ባሕር ቢጣል
  rationale: የግሪኩን ተገብሮአዊ ቅርጽና ከባድ ውጤት በአማርኛ ሁኔታዊ ንጽጽር ውስጥ ተፈጥሯዊ አድርጎ ያቀርባል።
theological_decisions:
- issue: “እነዚህ ታናናሾች” የሚያመለክታቸው
  choice: ቃሉ ሕፃናትን ብቻ ሳይወስን በኢየሱስ የሚያምኑ ትሑታንን ወይም ተጋላጭ ሰዎችን ሊያካትት በሚችል ሰፊ አገላለጽ ተተርጉሟል።
  alternative: “እነዚህ ትንንሽ ልጆች” በማለት ለሕፃናት ብቻ መወሰን፣ ወይም “እነዚህ ትሑት ደቀ መዛሙርት” በማለት ትርጓሜውን በጽሑፉ ውስጥ መግለጽ።
  rationale: “በእኔ የሚያምኑ” የሚለው ሐረግ ከዕድሜ ምድብ የሰፋ ማጣቀሻ እንዳለ ይጠቁማል፤ ሆኖም ሕፃናትን አያስወግድም። ስለዚህ ትርጉሙ ይህን ጥርጣሬ አይፈታም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “የሚያሰናክል” የሚለው ቃል የምንጩን ዘይቤና ሰፊ የትርጉም ክልል ይጠብቃል።
