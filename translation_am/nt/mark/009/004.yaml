revisions:
- from: ኤልያስም ከሙሴ ጋር ታያቸው፤ እነርሱም ከኢየሱስ ጋር ይነጋገሩ ነበር።
  to: ኤልያስም ከሙሴ ጋር ታየላቸው፤ ሁለቱም ከኢየሱስ ጋር ይነጋገሩ ነበር።
  rationale: 'The revision clarifies the appearance-to-them construction and the identity of the two people conversing with Jesus, while preserving the source text’s straightforward narrative and its reciprocal sense. No footnote is needed: ከኢየሱስ ጋር ይነጋገሩ ነበር already naturally expresses the lexical sense represented by the English alternative “were conversing with Jesus.”'
