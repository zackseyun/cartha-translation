id: MRK.9.4
reference: Mark 9:4
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ὤφθη αὐτοῖς Ἠλίας σὺν Μωϋσεῖ, καὶ ἦσαν συλλαλοῦντες τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/004.yaml
  text: And Elijah appeared to them with Moses[a], and they were talking with Jesus.
translation:
  language: am
  text: ኤልያስም ከሙሴ ጋር ታየላቸው፤ ሁለቱም ከኢየሱስ ጋር ይነጋገሩ ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὤφθη
  choice: ታያቸው
  rationale: የግሱን ተገብሮአዊ/ውስጠገብ ትርጉም ‘ታየ፣ ተገለጠ’ በተፈጥሯዊ አማርኛ ይገልጣል፤ ድንገተኛውን መታየት ያለ ተጨማሪ ትርጓሜ ያቀርባል።
- source_word: αὐτοῖς
  choice: -አቸው (ታያቸው)
  rationale: ለማን እንደታየ የሚያመለክተውን ዳቲቭ በአማርኛው የተያያዘ ተውላጠ ስም በተፈጥሯዊ ሁኔታ ይወክላል።
- source_word: Ἠλίας
  choice: ኤልያስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደው የግል ስም ቅርጽ ነው።
- source_word: σὺν Μωϋσεῖ
  choice: ከሙሴ ጋር
  rationale: አብሮነትን በግልጽና ተፈጥሯዊ የአማርኛ አገባብ ይገልጣል።
- source_word: συλλαλοῦντες
  choice: ይነጋገሩ ነበር
  rationale: ግሱ የሁለትዮሽ ንግግርን ወይም መወያየትን ያመለክታል፤ ‘ይነጋገሩ ነበር’ ቀጣይነት ያለውን ድርጊትና የጋራ ውይይቱን በዘመናዊ አማርኛ ያስተላልፋል።
- source_word: τῷ Ἰησοῦ
  choice: ከኢየሱስ ጋር
  rationale: συλλαλέω የሚያመለክተውን የጋራ ንግግር ከቀጥተኛ ‘ለኢየሱስ’ ይልቅ በትክክልና በተፈጥሯዊነት ያቀርባል።
theological_decisions:
- issue: በመለወጥ ትዕይንቱ ውስጥ የኤልያስና የሙሴ ማንነት እና መታየት
  choice: ኤልያስ ከሙሴ ጋር እንደታየና ሁለቱም ከኢየሱስ ጋር እንደተነጋገሩ ትረካውን በቀጥታ ማቅረብ
  alternative: መታየቱን ራእይ ብቻ ወይም ምሳሌያዊ ውክልና አድርጎ መግለጽ
  rationale: የግሪክ ጽሑፉ ኤልያስንና ሙሴን እንደታዩና ከኢየሱስ ጋር እንደተነጋገሩ በቀጥታ ያቀርባል፤ ትርጉሙ ክስተቱን ምሳሌያዊ ወይም ግላዊ ራእይ ብቻ አድርጎ ሊያዳክመው ወይም ከጽሑፉ ውጭ የሆነ ዶክትሪናዊ ማብራሪያ ሊጨምርበት አይገባም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። ‘ይነጋገሩ ነበር’ የግሪክ ብዙ ቁጥር ተሳቢን በግልጽ ለማሳየት ‘እነርሱም’ ከሚለው ጋር ቀርቧል። በተሰጠው የእንግሊዝኛ ማስታወሻ ውስጥ ምልክቱና ይዘቱ የማይጣጣሙ በመሆናቸው፣ እንዲሁም አማርኛው ‘ከኢየሱስ ጋር ይነጋገሩ’ የሚለውን የቃሉን የጋራ ንግግር በቀጥታ ስለሚገልጥ፣ የግርጌ ማስታወሻ አልተጨመረም።
