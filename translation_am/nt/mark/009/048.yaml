lexical_decisions:
- source_word: ὅπου
  choice: በዚያም
  rationale: የተገለጸውን ስፍራ የሚያመለክት አንጻራዊ ተውሳከ ግስ ነው፤ በአማርኛ የአውዱን ቀጣይነት ጠብቆ «በዚያም» ተብሎ በተፈጥሮ ይተረጎማል።
- source_word: ὁ σκώληξ αὐτῶν
