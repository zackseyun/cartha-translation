  text: But Jesus said to him[b][a], “ ‘If you can’? All things are possible for the one who believes.”
translation:
  language: am
  text: ኢየሱስም፣ “‘ከቻልክ’ ትላለህ?”[a] አለው። “ለሚያምን ሰው[b] ሁሉም ነገር ይቻላል።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ይበልጥ ቃል በቃል፣ “ያ ‘ከቻልክ’ የሚለው?” ኢየሱስ አባቱ በቀደመው ቁጥር የተናገረውን ቃል መልሶ በመጥቀስ ይሞግተዋል።
    reason: lexical_alternative
  - marker: b
    text: “ለሚያምን ሰው” የሚለው “እምነት ላለው ሰው” ወይም “ለሚተማመን ሰው” ተብሎም ሊተረጎም ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: Τὸ Εἰ δύνῃ
  choice: “ማድረግ ከቻልክ አልክ?”
  rationale: ገላጩ አንቀጽ Τὸ ከተጠቀሰው ሐረግ በፊት መምጣቱ፣ ኢየሱስ አባቱ በቀደመው ቁጥር የተናገረውን ቃል ጠቅሶ እንደሚሞግተው ያሳያል። በዘመናዊ አማርኛ የጥቅሱን ኃይል ለማስጠበቅ በጥያቄ መልክ ቀርቧል።
- source_word: δύνῃ
  choice: ማድረግ ከቻልክ
  rationale: δύναμαι ‘መቻል፣ አቅም መኖር’ ማለት ነው። በቀደመው ንግግር የተጠየቀው ኢየሱስ አንድን ነገር ማድረግ ይችል እንደሆነ ስለሆነ፣ ‘ማድረግ ከቻልክ’ ተፈጥሯዊና ግልጽ ነው።
- source_word: πάντα
  choice: ሁሉ
  rationale: ግሪኩ ገደብ ያልተጨመረበትን ሁሉን አቀፍ አገላለጽ ይዟል፤ ‘ሁሉ’ ይህን የንግግር ክብደት በአጭሩ ያስተላልፋል።
- source_word: δυνατὰ
  choice: ይቻላል
  rationale: በዚህ የዓረፍተ ነገር አወቃቀር δυνατός ‘የሚቻል’ ማለት ነው፤ ‘ይቻላል’ ተፈጥሯዊ የአማርኛ አቻ ነው።
- source_word: τῷ πιστεύοντι
  choice: ለሚያምን ሰው
  rationale: የአሁን ጊዜ ቦዝ አንቀጽ በአጠቃላይ የሚያምነውን ሰው ያመለክታል። ‘ለሚያምን ሰው’ ይህን የቦዝ አንቀጽ ኃይል ይጠብቃል።
- source_word: πιστεύοντι
  choice: ለሚያምን
  rationale: πιστεύω በመሠረታዊ ትርጉሙ ‘ማመን’ ነው፤ እንደ ዐውዱም ‘መታመን’ ወይም ‘እምነት መኖር’ ተብሎ ሊተረጎም ይችላል።
theological_decisions:
- issue: “ሁሉ ይቻላል” የሚለው አገላለጽ ወሰን
  choice: በዋናው ጽሑፍ ላይ ገደብ ሳይጨመር “ለሚያምን ሰው ሁሉ ይቻላል” ተብሎ ተቀምጧል።
  alternative: “በእግዚአብሔር ለሚያምን ሰው ሁሉ ይቻላል” ወይም “በእግዚአብሔር ኃይል ለሚያምን ሰው ሁሉ ይቻላል።”
  rationale: የግሪኩ ጽሑፍ በዚህ ስፍራ ‘በእግዚአብሔር’ የሚል ገላጭ ቃል አልጨመረም። ስለዚህ የንግግሩን ኃይልና ሥነ መለኮታዊ ውጥረት ለመጠበቅ ትርጓሜያዊ ገደብ አልተጨመረም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ጥቅም ላይ ውሏል። የአባቱን ቃል ኢየሱስ በጥያቄ መልክ መልሶ የሚሞግትበት ኃይል ተጠብቋል፤ ግሪኩ ያልገለጸው ሥነ መለኮታዊ ገደብም አልተጨመረም።
