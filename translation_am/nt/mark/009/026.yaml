source:
  edition: SBLGNT
  text: καὶ ⸂κράξας καὶ πολλὰ σπαράξας⸃ ἐξῆλθεν· καὶ ἐγένετο ὡσεὶ νεκρὸς ὥστε ⸀τοὺς πολλοὺς λέγειν ὅτι ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/026.yaml
  text: And after crying out and convulsing him greatly[a], it came out; and he became like a dead man, so that many were saying[b], “He is dead.”
translation:
  language: am
  text: እርኩሱም መንፈስ ጮኾ ልጁንም ክፉኛ አንፈራግጦ[a] ወጣ። ልጁም እንደ ሞተ ሰው ሆነ፤ ስለዚህም ብዙዎች፣ “ሞቷል” ይሉ ነበር[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ልጁን በከባድ መንፈራገጥ ውስጥ ጥሎ።”
    reason: lexical_alternative
  - marker: b
    text: ግሪክኛው፣ “እንደ ሞተ ሰው ሆነ” ይላል፤ ይህም ለተመልካቾቹ የሞተ መስሎ እንደታያቸው ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξας
  choice: ጮኾ
  rationale: የቀደመ ድርጊትን የሚገልጠውን የግሪክ አኦሪስት አንቀጸ ግስ በተፈጥሯዊ አማርኛ ይገልጣል፤ የጩኸቱን ድምፀት ከጽሑፉ በላይ አይወስንም።
- source_word: πολλὰ σπαράξας
  choice: ልጁንም ክፉኛ ካንፈራገጠው በኋላ
  rationale: σπαράσσω በዚህ የአጋንንት ማስወጣት አውድ መቀደድን ሳይሆን ኃይለኛ መንፈራገጥን ያመለክታል፤ πολλὰ የድርጊቱን ጽናት በ“ክፉኛ” ያስተላልፋል። ተሳቢው “ልጁን” ከአውዱ ተገልጿል።
- source_word: ἐξῆλθεν
  choice: ወጣ
  rationale: ከአውዱ የተገነዘበው ባለቤት እርኩሱ መንፈስ ነው፤ በአማርኛ “ወጣ” ማስወጣቱን በቀጥታ ይገልጣል።
- source_word: ἐγένετο ὡσεὶ νεκρός
  choice: እንደ ሞተ ሰው ሆነ
  rationale: ὡσεὶ ያለውን ንጽጽር ይጠብቃል፤ ተራኪው ልጁ በእርግጥ ሞተ ብሎ እንዳይናገር የመምሰሉን ሁኔታ ያስቀምጣል።
- source_word: ὥστε τοὺς πολλοὺς λέγειν
  choice: ስለዚህ ብዙዎች… አሉ
  rationale: የውጤት ግንኙነቱን በተፈጥሯዊ አማርኛ ያሳያል፤ τοὺς πολλούςን “ብዙዎች” ብሎ ይተረጉማል እንጂ “አብዛኞቹ” ብሎ አይገድበውም።
- source_word: ὅτι ἀπέθανεν
  choice: “ሞቷል”
  rationale: የተመልካቾቹን ፈጣን ድምዳሜ በቀጥታ ንግግርና በተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: ልጁ በእርግጥ ሞቶ ነበር ወይስ የሞተ ብቻ መስሎ ነበር?
  choice: ተራኪው ልጁ እንደ ሞተ ሰው መሆኑን ይገልጣል፤ “ሞቷል” የሚለው የብዙዎቹ ድምዳሜ ነው።
  alternative: ልጁ ለጊዜው በእርግጥ ሞቶ ነበር።
  rationale: ὡσεὶ (“እንደ/ያህል”) የንጽጽር ቃል ሲሆን፣ ሞቱን የሚናገሩትም ተመልካቾቹ ናቸው። ትርጉሙ የሞት መልክንና የሕዝቡን ግምት ይጠብቃል እንጂ በዚህ ቁጥር ያልተነገረ ትንሣኤ አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የመንፈሱና የልጁ ተውላጠ ስሞች ሊያሻሙ ስለሚችሉ “እርኩሱ መንፈስ” እና “ልጁ” ከአውዱ በግልጽ ተደግመዋል።
