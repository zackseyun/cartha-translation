  text: Ὃς γὰρ ἂν ποτίσῃ ὑμᾶς ποτήριον ὕδατος ἐν ⸀ὀνόματι ὅτι χριστοῦ ἐστε, ἀμὴν λέγω ὑμῖν ⸀ὅτι οὐ μὴ ⸀ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/041.yaml
  text: For whoever gives you a cup of water to drink in the name that you are Messiah's[a], truly I say to you, he will certainly not lose his reward.
translation:
  language: am
  text: ማንም ቢሆን፣ እናንተ የመሲሑ ስለሆናችሁ በመሲሑ ስም አንድ ጽዋ ውሃ የሚያጠጣችሁ፣ እውነት እላችኋለሁ፤ ሽልማቱን ፈጽሞ አያጣም።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እናንተ የመሲሑ እንደሆናችሁ በመቁጠር።” ግሪኩ በ«በስም» እና «ስለሆናችሁ» መካከል ያለውን ግንኙነት በአጭሩ ይገልጻል። «የመሲሑ» በባህላዊ አጠራር «የክርስቶስ» ሊባል ይችላል።
    reason: የἐν ὀνόματι ὅτι የአገባብ አሻሚነትን እና የΧριστόςን ባህላዊ አቻ ለማስቀመጥ።
lexical_decisions:
- source_word: Ὃς γὰρ ἂν
  choice: ማንም ቢሆን
  rationale: ያልተወሰነውን አንጻራዊ አገላለጽ በተፈጥሯዊ አማርኛ ያቀርባል፤ ጥቅሱ ከቀደመው ንግግር ጋር ያለው ምክንያታዊ ትስስር በአረፍተ ነገሩ ፍሰት ተጠብቋል።
- source_word: ποτίσῃ ὑμᾶς ποτήριον ὕδατος
  choice: አንድ ጽዋ ውሃ የሚያጠጣችሁ
  rationale: ποτίζω የመጠጥ ነገርን መስጠት ወይም ማጠጣት ማለት ነው፤ ‘ጽዋ’ የποτήριονን ቀላልና ክቡር አቻ ይሰጣል።
- source_word: ἐν ὀνόματι ὅτι χριστοῦ ἐστε
  choice: እናንተ የመሲሑ ስለሆናችሁ፣ በዚህ ስም
  rationale: ግሪኩ ‘በስም፣ የክርስቶስ ናችሁ ስለ…’ የሚል አወቃቀር አለው። ὅτιን ምክንያታዊ አድርጎ መውሰድ ተፈጥሯዊ ሲሆን፣ ‘በዚህ ስም’ የጽሑፉን ያልተገለጸ ἐν ὀνόματι ይጠብቃል እንጂ ‘በስሜ’ ብሎ አይጨምርም።
- source_word: χριστοῦ
  choice: የመሲሑ
  rationale: Χριστός እዚህ የኢየሱስን ማንነት የሚገልጽ ማዕረግ ስለሆነ ‘መሲሕ’ ተብሎ ተተርጉሟል፤ የባለቤትነት ግንኙነቱ ‘የመሲሑ’ በሚለው ተጠብቋል።
- source_word: ἀμὴν λέγω ὑμῖν
  choice: እውነት እላችኋለሁ
  rationale: የኢየሱስን የተከበረ ማረጋገጫ አገላለጽ በተለመደና ግልጽ አማርኛ ያስተላልፋል።
- source_word: οὐ μὴ ἀπολέσῃ
  choice: ፈጽሞ አያጣም
  rationale: οὐ μή ያለውን ጠንካራ እምቢታ ‘ፈጽሞ’ በማለት ግልጽ ያደርጋል።
- source_word: τὸν μισθὸν αὐτοῦ
  choice: ሽልማቱን
  rationale: μισθός እዚህ በሥነ ምግባራዊና በመጨረሻው ፍርድ አውድ የሚሰጥ ዋጋ ወይም ሽልማት ሲሆን፣ ‘ሽልማት’ ለዘመናዊ አንባቢ ግልጽ ነው።
theological_decisions:
- issue: Χριστόςን በባለቤትነት አወቃቀር መተርጎም
  choice: የመሲሑ
  alternative: የክርስቶስ
  rationale: Χριστός በዚህ አውድ ማዕረግ ነው፤ ‘መሲሕ’ የቃሉን ‘የተቀባው’ የሚለውን መሲሓዊ ይዘት ያስተላልፋል። ባህላዊው ቅርጽ በማስታወሻ ቀርቧል።
- issue: ἐν ὀνόματι ὅτι ያለው ሰዋሰዋዊ ውጥረት
  choice: እናንተ የመሲሑ ስለሆናችሁ፣ በዚህ ስም
  alternative: የመሲሑ እንደሆናችሁ በስም
  rationale: ὅτι ምክንያትን (‘ስለሆናችሁ’) ወይም የስሙን ይዘት (‘እንደሆናችሁ’) ሊገልጽ ይችላል። ዋናው ጽሑፍ ተፈጥሯዊውን ምክንያታዊ ንባብ ይዟል፤ ሌላው ንባብ በማስታወሻ ተጠብቋል።
