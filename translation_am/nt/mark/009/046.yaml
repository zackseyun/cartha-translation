  terminology: «ትል» appropriately retains the Isaiah 66:24 resonance. «አይሞትም» and «አይጠፋም» are accurate, idiomatic renderings in this context. The manuscript terminology is retained, while the footnote is revised for grammatical clarity and to avoid overstating certainty.
