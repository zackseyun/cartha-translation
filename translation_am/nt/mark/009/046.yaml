  text: where[a] their worm does not die, and the fire is not quenched.
translation:
  language: am
  text: ትላቸው የማይሞትበትና እሳቱ የማይጠፋበት ስፍራ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይህ ቁጥር ከጥንታዊ የግሪክ የእጅ ጽሑፎች—በ4ኛው መቶ ዘመን የተጻፉትን ሲናይቲከስና ቫቲካነስ ጨምሮ—እንዲሁም ከጥንታዊ የቅብጥ ትርጉሞች ውስጥ የለም፤ በባይዛንታይን አብዛኛው የእጅ ጽሑፍ ባህልና በላቲን ባህል ግን ይገኛል። በቁጥር 48 (እንዲሁም በቁጥር 44) የሚገኙትን ተመሳሳይ ቃላት በመድገም በኋላ በጸሐፊ የተጨመረ ሊሆን ይችላል።
    reason: textual_critical
lexical_decisions:
- source_word: σκώληξ
  choice: ትል
  rationale: ቃሉ የበሰበሰ ነገርን የሚበላ ትልን ወይም እጭን ሊያመለክት ይችላል። «ትል» በኢሳይያስ 66፥24 ካለው ጥቅስ ጋር ያለውን ግንኙነት ይጠብቃል፣ በአማርኛም ተፈጥሯዊና የተለመደ ነው።
- source_word: τελευτᾷ
  choice: አይሞትም
  rationale: τελευτάω መሞትን ወይም ወደ ፍጻሜ መድረስን ያመለክታል። በዚህ አውድ «አይሞትም» ቀጥተኛ ሲሆን የአሁን ጊዜውን ቀጣይነት በ«በማይሞትበት» አወቃቀር ያሳያል።
- source_word: σβέννυται
  choice: አይጠፋም
  rationale: ለእሳት «መጥፋት» በዘመናዊ አማርኛ ተፈጥሯዊ ነው፣ የግሪኩንም አይጠፋም/አይጨልም የሚለውን ሐሳብ ያስተላልፋል።
