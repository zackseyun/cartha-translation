  register: ጽሑፉ አጭር፣ ክቡርና ለዘመናዊ አማርኛ አንባቢ ተፈጥሯዊ እንዲሆን ተተርጉሟል። የግሪኩ ὅπου ሁለቱንም አንቀጾች ወደሚያገናኝ «…በሚሆንበት ስፍራ» አወቃቀር ተቀይሯል። የጽሑፍ ልዩነቱ ስለ ሙሉ ቁጥሩ በነጥብ ማስታወሻ በግልጽ ቀርቧል።
