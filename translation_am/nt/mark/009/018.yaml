id: MRK.9.18
reference: Mark 9:18
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ὅπου ⸀ἐὰν αὐτὸν καταλάβῃ ῥήσσει αὐτόν, καὶ ἀφρίζει καὶ τρίζει τοὺς ⸀ὀδόντας καὶ ξηραίνεται· καὶ εἶπα τοῖς μαθηταῖς σου ἵνα αὐτὸ ἐκβάλωσιν, καὶ οὐκ ἴσχυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/018.yaml
  text: And wherever it seizes him[a], it throws him down, and he foams and grinds his teeth and becomes rigid. And I told your disciples to cast it out, but they were not able.
translation:
  language: am
  text: የትም ቢይዘው ወደ መሬት ይጥለዋል፤ እርሱም አረፋ ያወጣል፣ ጥርሶቹን ያፋጫል፣ ይገተራልም።[a] እንዲያስወጡት ደቀ መዛሙርትህን ለመንኳቸው፤ ነገር ግን አልቻሉም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ይደርቃል፣” “ይጠወልጋል፣” ወይም “ይከሳል።” የግሪኩ ቃል በቀጥታ “ይደርቃል” ማለት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν
  choice: በ…ቦታ ሁሉ
  rationale: ያልተወሰነና ተደጋጋሚ ሁኔታን ‘በያዘውም ቦታ ሁሉ’ በሚል ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: καταλάβῃ
  choice: በያዘው
  rationale: መንፈሱ ልጁን በኃይል መያዙን በአጭርና ግልጽ አገላለጽ ይገልጣል።
- source_word: ῥήσσει
  choice: ወደ መሬት ይጥለዋል
  rationale: በዚህ ዐውድ የሚገለጠውን ኃይለኛ መጣል በግልጽ ያስተላልፋል፤ ‘ይቀደዋል’ የሚለው አካላዊ ቁስልን በስህተት ሊያመለክት ይችላል።
- source_word: ἀφρίζει
  choice: አረፋ ይደፍቃል
  rationale: ግሱ የሚገልጠውን የአረፋ ምልክት በተለመደ ዘመናዊ አማርኛ ያቀርባል።
- source_word: τρίζει τοὺς ὀδόντας
  choice: ጥርሱን ያፋጫል
  rationale: የጥርስ መፋጨትን ወይም መንከስከስን እንደ አካላዊ ምልክት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ξηραίνεται
  choice: ሰውነቱ ይገተራል
  rationale: በምልክቶቹ ቅደም ተከተል የሰውነት መገተርን በተፈጥሯዊ አማርኛ ያሳያል፤ የግሱ ቀጥተኛ ትርጉምና ሌሎች አማራጮች በአስተያየት ተጠብቀዋል።
- source_word: εἶπα
  choice: ጠየቅኋቸው
  rationale: በἵνα ከተገለጠው ዓላማ ጋር ሲነበብ፣ አባቱ ደቀ መዛሙርቱ መንፈሱን እንዲያስወጡ መጠየቁን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐκβάλωσιν
  choice: እንዲያስወጡት
  rationale: በክፉ መንፈስ ማስወጣት ዐውድ የἐκβάλλωን ትርጉም ግልጽ ያደርጋል።
- source_word: οὐκ ἴσχυσαν
  choice: አልቻሉም
  rationale: የኃይል ወይም የችሎታ እጥረትን ምክንያቱን ሳይወስን በቀጥታ ያስተላልፋል።
theological_decisions:
- issue: በ‘እንዲያስወጡት’ ውስጥ ያለው ተውላጠ ስም ማንን እንደሚያመለክት
  choice: ልጁን የሚያሠቃየውን መንፈስ ያመለክታል።
  alternative: በአጠቃላይ ሕመሙን ወይም መከራውን እንደሚያመለክት ሊወሰድ ይችላል።
  rationale: የቅርብ ዐውዱ ልጁን ስለያዘው ጠላት መንፈስና ደቀ መዛሙርቱ እርሱን ለማስወጣት ስላደረጉት ሙከራ ይናገራል፤ ‘-ት’ የሚለው ተውላጠ ስም የግሪኩን αὐτό ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የξηραίνεται ትክክለኛ አውዳዊ ፍቺ አከራካሪ ስለሆነ ዋናው ጽሑፍ ተፈጥሯዊውን አገላለጽ ሲጠቀም ቀጥተኛውና አማራጭ ፍቺዎቹ በአስተያየት ቀርበዋል።
