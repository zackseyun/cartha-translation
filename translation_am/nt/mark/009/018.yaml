review_pass:
  verdict: revise
  source_fidelity: The draft broadly follows the Greek symptom sequence and correctly retains the neuter object of expulsion. However, ὅπου ἐὰν is not well represented by “በያዘውም ቦታ ሁሉ,” which can suggest every location that he has seized. The conditional, indefinite sense is better conveyed by “የትም ቢይዘው.” εἶπα is closer to “I said/told” than to an unqualified “I asked,” although a request formulation is natural with the purpose clause.
  naturalness: “አረፋ ይደፍቃል” is not the clearest standard modern Amharic description of foaming. “አረፋ ያወጣል” is natural and precise. The plural object in “ጥርሶቹን ያፋጫል” is also more idiomatic. “ይገተራል” naturally conveys the contextual interpretation of rigidity.
  terminology: “እንዲያስወጡት” appropriately preserves the exorcistic force of ἐκβάλωσιν and leaves the neuter referent unexpanded. The footnote should preserve the debated, more literal drying/withering sense without overstating a single interpretation.
  issues:
  - severity: medium
    issue: The opening expression “በያዘውም ቦታ ሁሉ” does not clearly express the indefinite conditional force of ὅπου ἐὰν.
    rationale: It is liable to be read spatially as “in every place where he seized him,” whereas the Greek says “wherever/whenever it seizes him.” “የትም ቢይዘው” is a natural Amharic equivalent that retains the spatial-indefinite sense.
  - severity: medium
    issue: “አረፋ ይደፍቃል” is unnatural or unclear for ἀφρίζει.
    rationale: The Greek simply says that he foams. “አረፋ ያወጣል” is clear modern standard Amharic and does not add an explicit location such as the mouth.
  - severity: low
    issue: “ጥርሱን” is singular although τοὺς ὀδόντας is plural.
    rationale: A singular collective can occur in Amharic, but “ጥርሶቹን” more directly and naturally represents the source phrase.
  - severity: low
    issue: “ጠየቅኋቸው” can mean interrogated them and is less direct than the Greek εἶπα.
    rationale: “እንዲያስወጡት … ለመንኳቸው” clearly expresses the father's request while fitting the purpose clause.
  revised_text: የትም ቢይዘው ወደ መሬት ይጥለዋል፤ እርሱም አረፋ ያወጣል፣ ጥርሶቹን ያፋጫል፣ ይገተራልም።[a] እንዲያስወጡት ደቀ መዛሙርትህን ለመንኳቸው፤ ነገር ግን አልቻሉም።
