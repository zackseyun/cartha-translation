- source_word: ἁλισθήσεται
  choice: ይጨወማል
  rationale: የወደፊት ጊዜ ተደራጊ ግስ ሲሆን «በጨው መጨመር/ማጣፈጥ» የሚለውን ቀጥተኛ ምስል ይይዛል። «ይጨወማል» በአማርኛ ተደራጊነቱንና አስደናቂውን ዘይቤ ይጠብቃል።
