  choice: የፍርድ፣ የመንጻት፣ የመሥዋዕት ወይም የደቀ መዝሙርነት ፈተና መሆኑን ሳይወስን ቀጥተኛውን ዘይቤ ማቆየት
  alternative: «ሁሉም በእሳት ይፈረድበታል»፣ «ሁሉም በእሳት ይነጻል» ወይም «ሁሉም እንደ መሥዋዕት ይቀደሳል» ብሎ መተርጎም
  rationale: የግሪኩ ንግግር አጭርና ጠቃሽ ሲሆን የቅርብ ዐውዱ ከአንድ በላይ የተያያዙ ትርጓሜዎችን ይፈቅዳል። ስለዚህ ዋናው ጽሑፍ የሥነ መለኮት ውጥረቱን ሳይፈታ ይጠብቃል።
