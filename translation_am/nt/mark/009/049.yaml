review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains γάρ, the future passive force of ἁλισθήσεται, and the deliberately striking, unresolved image of being salted with fire. However, ሁሉም is collective/plural in ordinary Amharic, whereas the singular masculine substantive Πᾶς is better represented distributively as እያንዳንዱ (“each one/everyone”).
  naturalness: በእሳት ይጨወማል is understandable and suitably preserves the source's arresting metaphor. Using እያንዳንዱ makes the clause more precise and natural for the Greek singular. The alternative note is improved by using ይቀመማል, a more ordinary equivalent for “will be seasoned,” and by phrasing the cross-reference naturally.
  terminology: ጨወማል faithfully expresses salting, and መሥዋዕት is the appropriate established term for sacrifice. No doctrinal interpretation is introduced.
  issues:
  - severity: low
    issue: The main-text subject ሁሉም is collective/plural rather than distributive singular.
    rationale: Πᾶς is singular and substantival. እያንዳንዱ retains the likely personal, distributive reference without altering the metaphor.
  - severity: low
    issue: The lexical-alternative footnote has a less natural wording for “seasoned” and cross-reference phrasing.
    rationale: ይቀመማል is a clearer modern alternative for “will be seasoned,” while ዘሌዋውያን 2፥13ን ይመልከቱ is idiomatic and does not imply a stronger intertextual claim.
  revised_text: ምክንያቱም እያንዳንዱ በእሳት ይጨወማል[a][b]።
