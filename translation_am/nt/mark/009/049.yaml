    text: ወይም፣ «እያንዳንዱ በእሳት ይቀመማል።» ይህ ምስል ፍርድን፣ መንጻትን ወይም የመሥዋዕት ቋንቋን ሊያስታውስ ይችላል፤ ዘሌዋውያን 2፥13ን ይመልከቱ።
