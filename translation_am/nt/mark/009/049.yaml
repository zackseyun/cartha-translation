  rationale: በነጠላ ቁጥር የቀረበው ቅጽ እዚህ ሰዎችን በአጠቃላይ ያመለክታል፤ «ሁሉም» ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: γὰρ
