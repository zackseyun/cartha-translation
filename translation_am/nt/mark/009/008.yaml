  yaml_path: translation/nt/mark/009/008.yaml
  text: And suddenly, looking around, they no longer saw anyone except Jesus alone with them.
translation:
  language: am
  text: ድንገትም ዙሪያቸውን ሲመለከቱ፣ ከእነርሱ ጋር ያለውን ኢየሱስን ብቻ እንጂ ሌላ ማንንም ከዚያ በኋላ አላዩም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξάπινα
  choice: ድንገት
  rationale: የድርጊቱን ድንገተኛነት በተፈጥሯዊና በዘመናዊ አማርኛ ያስተላልፋል።
- source_word: περιβλεψάμενοι
  choice: ዙሪያቸውን ሲመለከቱ
  rationale: ዙሪያን ተመልክቶ የመፈተሽን ድርጊት ግልጽ ያደርጋል።
- source_word: οὐκέτι οὐδένα εἶδον
  choice: ከእንግዲህ ማንንም አላዩም
  rationale: οὐκέτι የሚያመለክተውን የሁኔታ ለውጥና οὐδένα የሚያመለክተውን ፍጹም አሉታዊነት ይጠብቃል።
- source_word: ἀλλὰ τὸν Ἰησοῦν μόνον μεθ’ ἑαυτῶν
  choice: ከእነርሱ ጋር ከነበረው ከኢየሱስ በቀር
  rationale: ἀλλά በዚህ አውድ ያለውን ‘በቀር’ ትርጉም፣ μόνον ያለውን ብቸኝነት፣ እና μεθ’ ἑαυτῶν ያለውን አብሮነት በተፈጥሯዊ አማርኛ ይይዛል።
