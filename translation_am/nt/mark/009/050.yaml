base_translation:
  language: en
  yaml_path: translation/nt/mark/009/050.yaml
  text: Salt is good[a]; but if the salt becomes unsalty, with what will you season it? Have salt in yourselves[c][b], and be at peace with one another.
translation:
  language: am
  text: ጨው መልካም ነው፤ ጨው ግን ጨዋማነቱን ቢያጣ፣ በምን ታጣፍጉታላችሁ?[a] በራሳችሁ ውስጥ ጨው ይኑራችሁ፤[b] እርስ በርሳችሁም በሰላም ኑሩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ጣዕም አልባ ቢሆን” ወይም “ጨው አልባ ቢሆን።”
    reason: lexical_alternative
  - marker: b
    text: “በራሳችሁ ውስጥ ጨው ይኑራችሁ” የሚለው ትእዛዝ የግሪኩን ዘይቤ እንዳለ ይጠብቃል። ዘይቤው ንጽሕናን፣ ጥበብን፣ ለቃል ኪዳን ታማኝ መሆንን ወይም የመጠበቅ ተጽእኖን ሊያመለክት ይችላል፤ ጽሑፉ ግን አንዱን ትርጉም በግልጽ አይወስንም።
    reason: lexical_alternative
