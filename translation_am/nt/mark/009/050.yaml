  rationale: ጥቅሱ ዘይቤውን በግልጽ አይተረጉምም፤ ስለዚህ አንድን ሥነ መለኮታዊ ትርጓሜ በጽሑፉ ላይ ከመጫን ይልቅ ያለውን አሻሚነት ማቆየት ይገባል።
- issue: የመጨረሻው የሰላም ትእዛዝ
  choice: ‘እርስ በርሳችሁም በሰላም ኑሩ’
  alternative: ‘እርስ በርሳችሁ ሰላም ይኑራችሁ’
  rationale: ‘በሰላም ኑሩ’ የεἰρηνεύετεን ቀጣይነት ያለው ተግባራዊ ትእዛዝ በተፈጥሯዊ አማርኛ ይገልጣል።
