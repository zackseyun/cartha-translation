  rationale: የጨውን አዎንታዊ ጥቅም ሳያጠብ አጭርና ተፈጥሯዊ የሆነውን ምሳሌያዊ አነጋገር ይጠብቃል።
- source_word: ἅλας / ἅλα
  choice: ጨው
  rationale: በሁለቱም ስፍራዎች ቃሉን በወጥነት በመተርጎም በመጨረሻው ትእዛዝ ያለውን ያልተተረጎመ ዘይቤ ይጠብቃል።
- source_word: ἄναλον γένηται
  choice: ጣዕሙን ቢያጣ
  rationale: ቃል በቃል ‘ጨው አልባ ቢሆን’ ማለት በአማርኛ ከጨው ጋር የማይስማማ ስለሆነ፣ የሁኔታ ለውጡንና የἄναλοςን ‘ጣዕም አልባ’ ትርጉም ተፈጥሯዊ በሆነ አገላለጽ ያስተላልፋል።
- source_word: ἐν τίνι αὐτὸ ἀρτύσετε
  choice: በምን ታጣፍጉታላችሁ?
  rationale: የመሣሪያውን ጥያቄ ‘በምን’ ብሎ ያስተላልፋል፤ ‘ማጣፈጥ’ የምግብ ማጣፈጫ ዘይቤውን ሳያሰፋ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἔχετε ἐν ἑαυτοῖς ἅλα
  choice: በራሳችሁ ውስጥ ጨው ይኑራችሁ
  rationale: የግሪኩን ዘይቤና ውስጣዊ አቅጣጫ በቀጥታ ይጠብቃል፤ ‘ጨው’ ምንን እንደሚወክል በዋናው ጽሑፍ አይወስንም።
