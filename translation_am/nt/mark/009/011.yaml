  text: καὶ ἐπηρώτων αὐτὸν λέγοντες· Ὅτι λέγουσιν οἱ γραμματεῖς ὅτι Ἠλίαν δεῖ ἐλθεῖν πρῶτον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/011.yaml
  text: And they were asking him[a], saying, “Why do the scribes say that Elijah must come first?”
translation:
  language: am
  text: እነርሱም እንዲህ እያሉ ይጠይቁት ነበር፦ “ጻፎች ኤልያስ አስቀድሞ ሊመጣ እንደሚገባ ለምን ይላሉ?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ጻፎች ኤልያስ አስቀድሞ ሊመጣ እንደሚገባ እንዴት ሆኖ ይላሉ?”
    reason: Ὅτι በዚህ የጥያቄ አውድ “ለምን?” ወይም “እንዴት ሆኖ ነው?” ተብሎ ሊተረጎም ስለሚችል የቃላት አማራጩን ይጠብቃል።
lexical_decisions:
- source_word: ἐπηρώτων
  choice: ይጠይቁት ነበር
  rationale: ያልተፈጸመው የግሪክ ግስ በትረካው ውስጥ ቀጣይ ወይም ተደጋጋሚ ጥያቄን ስለሚያመለክት፣ ይህ አተረጓጎም የጊዜውን ገጽታ ይጠብቃል።
- source_word: λέγοντες
  choice: እያሉ
  rationale: አሳቢው የጥያቄውን ይዘት ያስገባል፤ “እያሉ” የግሪኩን አወቃቀር በተፈጥሯዊ አማርኛ ያንጸባርቃል።
- source_word: Ὅτι
  choice: ለምንድን ነው?
  rationale: ὅτι በዚህ የጥያቄ አውድ “ለምን?” ወይም “እንዴት ሆኖ ነው?” የሚል ፍቺ አለው፤ “ለምንድን ነው?” ግልጽና ተፈጥሯዊ ነው።
- source_word: γραμματεῖς
  choice: ጻፎች
  rationale: በወንጌላት አውድ የሕግ ጽሑፎችን የሚያውቁና የሚተረጉሙ ታሪካዊ ቡድንን የሚያመለክት የተለመደ የአማርኛ መጠሪያ ነው።
- source_word: Ἠλίαν
  choice: ኤልያስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የስሙን ቅርጽ ይጠብቃል።
- source_word: δεῖ
  choice: መምጣት አለበት
  rationale: δεῖ ግዴታን ወይም አስፈላጊነትን ይገልጣል፤ ይህ የአማርኛ አባባል ኃይሉን በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: ἐλθεῖν
  choice: መምጣት
  rationale: ከδεῖ ጋር የተጠቀሰውን የመምጣት ድርጊት በቀጥታና በተፈጥሯዊ መንገድ ይገልጣል።
- source_word: πρῶτον
  choice: አስቀድሞ
  rationale: የጊዜ ቅድሚያን ያመለክታል፤ “አስቀድሞ” በዚህ የትንቢት አውድ ተፈጥሯዊ ነው።
theological_decisions:
- issue: በὍτι የተጀመረው የደቀ መዛሙርቱ ጥያቄ ኃይል
  choice: ስለ ጻፎች ትምህርት “ለምንድን ነው?” የሚል ቀጥተኛ ጥያቄ
  alternative: “ጻፎች ... የሚሉት እንዴት ሆኖ ነው?”
  rationale: ὅτι በዚህ አውድ ጥያቄን ያስገባል። “ለምንድን ነው?” የጥያቄውን ኃይል በግልጽ አማርኛ ያቀርባል፤ ሌላው አቀራረብም ሊሆን ስለሚችል በማስታወሻ ተጠብቋል።
- issue: የኤልያስ መምጣት ባሕርይ
  choice: “ኤልያስ አስቀድሞ መምጣት አለበት” ተብሎ ያለ ትርጓሜያዊ ጭማሪ ተተርጉሟል
  alternative: “ኤልያስ እንደገና አስቀድሞ መምጣት አለበት” ወይም “ከመሲሑ በፊት መምጣት አለበት”
  rationale: ግሪኩ ኤልያስ አስቀድሞ መምጣት እንዳለበት ብቻ ይናገራል። “እንደገና” ወይም “ከመሲሑ በፊት” ማከል በዚህ ቁጥር በግልጽ ያልተነገረ ትርጓሜ ያስገባል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ያልተፈጸመ ግስ “ይጠይቁት ነበር” ተብሎ ቀጣይነቱ ተጠብቋል፤ ነገር ግን የቃላት ቅደም ተከተሉ ለአማርኛ ተፈጥሯዊነት ተስተካክሏል።
