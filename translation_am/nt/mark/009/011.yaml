review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly conveys the imperfect, the interrogative force of ὅτι, the scribes, Elijah, necessity, and temporal priority. However, its rendering of the necessity clause is grammatically less idiomatic in modern standard Amharic: with the expressed subject ኤልያስ, a finite/subjunctive construction is preferable to መምጣት አለበት.'
  naturalness: Revising the sentence to introduce the quotation with እንዲህ እያሉ and using ኤልያስ አስቀድሞ ሊመጣ እንደሚገባ produces clear, natural modern standard Amharic while retaining the ongoing sense of ἐπηρώτων.
  terminology: ጻፎች and ኤልያስ are appropriate established biblical terms. ሊመጣ እንደሚገባ faithfully expresses δεῖ ἐλθεῖν without adding that Elijah will come again or specifying before whom he comes.
  issues:
  - severity: medium
    issue: The clause “ኤልያስ አስቀድሞ መምጣት አለበት” is syntactically awkward with an overt personal subject.
    rationale: In standard Amharic, መምጣት አለበት more naturally takes a genitival nominal subject (for example, የኤልያስ መምጣት) or should be recast with a finite/subjunctive verb. “ኤልያስ ... ሊመጣ እንደሚገባ” is idiomatic and preserves the Greek necessity.
  - severity: low
    issue: The participial introduction is more naturally placed before the direct quotation.
    rationale: “እንዲህ እያሉ ይጠይቁት ነበር፦” gives λέγοντες a clear, natural discourse function without altering its relation to the imperfect main verb.
