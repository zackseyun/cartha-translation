  text: ὁ δὲ ⸀ἔφη αὐτοῖς· Ἠλίας μὲν ἐλθὼν πρῶτον ⸀ἀποκαθιστάνει πάντα, καὶ πῶς γέγραπται ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου ἵνα πολλὰ πάθῃ καὶ ⸀ἐξουδενηθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/012.yaml
  text: He said to them[a], “Elijah indeed, having come first, restores all things. And how is it written about the Son of Man that he should suffer many things and be treated with contempt?”
translation:
  language: am
  text: እርሱም እንዲህ አላቸው፦ “ኤልያስ ቀድሞ መጥቶ ነገርን ሁሉ ያስተካክላል። ደግሞስ ስለ ሰው ልጅ ብዙ መከራ እንዲቀበልና እንዲናቅ[a] እንዴት ተጽፎአል?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እንደ ምንም እንዲቆጠር።” የግሪክኛው ግስ ዋጋ እንደሌለው ተቆጥሮ በንቀት መያዝን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτοῖς
  choice: እንዲህ አላቸው
  rationale: የትረካውን የንግግር መግቢያ በተፈጥሯዊና በክብር ባለው ዘመናዊ አማርኛ ያቀርባል።
- source_word: ἐλθὼν πρῶτον
  choice: ቀድሞ መጥቶ
  rationale: የግሪክኛውን ቅድሚያ የሚገልጥ ተሳቢ አወቃቀር ይጠብቃል።
- source_word: ἀποκαθιστάνει πάντα
  choice: ሁሉን ያድሳል
  rationale: ἀποκαθιστάνει የሚያመለክተውን ወደ ትክክለኛ ሁኔታ መመለስ በአጭርና በተፈጥሯዊ ቃል ይገልጣል፤ πάντα ያለውንም ሰፊ አጠቃላይነት አያጠብም።
- source_word: πῶς γέγραπται ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου
  choice: የሰው ልጅ … ስለ እርሱ እንዴት ተጽፎአል?
  rationale: γέγραπται የመጽሐፍ ቅዱስ ጽሑፍን የሚጠቅስ አገላለጽ መሆኑን ይጠብቃል፤ ἐπί ደግሞ ‘ስለ’ ተብሎ ተተርጉሟል።
- source_word: υἱὸν τοῦ ἀνθρώπου
  choice: የሰው ልጅ
  rationale: በወንጌላት ያለውን አስፈላጊ ማዕረግ ያለ ትርጓሜያዊ ማስፋፊያ ይጠብቃል።
- source_word: πολλὰ πάθῃ
  choice: ብዙ መከራ እንዲቀበል
  rationale: ብዙ ዓይነት ሥቃይን የሚያመለክተውን የግሪክኛውን ብዙ ቁጥር በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐξουδενηθῇ
  choice: እንዲናቅ
  rationale: ተገብሮ የመናቅንና ዋጋ እንደሌለው የመቆጠርን መሠረታዊ ሐሳብ በግልጽ ዘመናዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: የኤልያስ የማደስ ሥራና የሰው ልጅ መከራ በአንድ ላይ መቅረባቸው
  choice: ሁለተኛውን ክፍል እንደ እውነተኛ የአጽንዖት ጥያቄ ማቆየት
  alternative: ንጽጽሩን በማብራራት ‘ነገር ግን ታዲያ…’ ብሎ ማለዘብ ወይም ወደ ትምህርታዊ መግለጫ መለወጥ
  rationale: የግሪክኛው πῶς … γέγραπται … ἵνα ጥያቄውን እንደ ጥያቄ ያቀርባል፤ ትርጉሙም በመታደስና በመከራ መካከል ያለውን ውጥረት አይፈታውም።
- issue: ‘የሰው ልጅ’ የሚለው ማዕረግ
  choice: የሰው ልጅ
  alternative: መሲሑ ወይም ሰብዓዊው
  rationale: ግሪክኛው የሚሰጠውን ማዕረግ ሳይተረጉም ወይም ሳያስፋፋ ማቆየት የጽሑፉን ትርጓሜያዊ ስፋት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የንግግሩ ጥያቄያዊ ቅርጽና የጽሑፉ ሥነ መለኮታዊ ውጥረት ተጠብቀዋል።
