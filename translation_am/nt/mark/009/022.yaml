  text: ብዙ ጊዜም ሊያጠፋው ወደ እሳትና ወደ ውኃዎች[a] ጥሎታል። ነገር ግን አንዳች ማድረግ ከቻልክ፣ ርኅራኄ አድርገህልን እርዳን።[b]
  philosophy: optimal-equivalence
