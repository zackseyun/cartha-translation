  text: ὁ δὲ ἀποκριθεὶς ⸀αὐτοῖς λέγει· Ὦ γενεὰ ἄπιστος, ἕως πότε πρὸς ὑμᾶς ἔσομαι; ἕως πότε ἀνέξομαι ὑμῶν; φέρετε αὐτὸν πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/019.yaml
  text: And answering them[a], he says, “O unbelieving generation[b], how long will I be with you? How long will I put up with you? Bring him to me.”
translation:
  language: am
  text: እርሱም መልሶ እንዲህ አላቸው፤ “የማያምን ትውልድ ሆይ![a] እስከ መቼ ከእናንተ ጋር እሆናለሁ? እስከ መቼ እታገሣችኋለሁ?[b] ወደ እኔ አምጡት።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “እምነት የለሽ ትውልድ” ተብሎም ሊተረጎም ይችላል። ἄπιστος የሚለው የግሪክ ቃል አለማመንን ወይም እምነት ማጣትን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “እስከ መቼ እሸከማችኋለሁ?” ወይም “እስከ መቼ እችላችኋለሁ?” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς αὐτοῖς λέγει
  choice: እርሱም መልሶ እንዲህ አላቸው
  rationale: የግሪኩን የመልስ አሰጣጥ ይዘት በተፈጥሯዊ የአማርኛ የትረካ አገላለጽ ያቀርባል፤ የማርቆስን ታሪካዊ የአሁን ጊዜ ግስ ቃል በቃል ማስገባት በአማርኛ የማይፈጥረውን ቅልጥፍና ስለሚያመጣ በተለመደው የትረካ ጊዜ ተተርጉሟል።
- source_word: γενεὰ ἄπιστος
  choice: የማያምን ትውልድ
  rationale: ἄπιστος አለማመንን ወይም እምነት ማጣትን ሊያመለክት ይችላል። በዚህ አውድ የእምነት እጥረትን በግልጽና በተፈጥሯዊ አማርኛ ያሳያል፤ ሌላው ሊሆን የሚችለው አገላለጽ በማስታወሻ ተጠብቋል።
- source_word: ἕως πότε πρὸς ὑμᾶς ἔσομαι
  choice: እስከ መቼ ከእናንተ ጋር እሆናለሁ?
  rationale: ἕως πότε በተፈጥሯዊ ሁኔታ “እስከ መቼ” ተብሎ ተተርጉሟል፤ πρός እዚህ የመቆየትንና ከእነርሱ ጋር የመሆንን ግንኙነት ያሳያል።
- source_word: ἀνέξομαι ὑμῶν
  choice: እታገሣችኋለሁ
  rationale: ግሱ መታገሥን፣ መሸከምን ወይም ችሎ መቆየትን ያመለክታል። “እታገሣችኋለሁ” የኢየሱስን ብስጭት ሳያለዝብ በክብር ያቀርባል።
- source_word: φέρετε αὐτὸν πρός με
  choice: ወደ እኔ አምጡት
  rationale: ወንዱን ልጅ ወደ ኢየሱስ እንዲያመጡ የተሰጠውን ቀጥተኛ ትእዛዝ በግልጽ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: በἄπιστος ውስጥ ያለው የአለማመንና የእምነት ማጣት ድርብ ጥላ
