  edition: SBLGNT
  text: καὶ ⸀εὐθὺς πᾶς ὁ ὄχλος ⸂ἰδόντες αὐτὸν ἐξεθαμβήθησαν⸃, καὶ προστρέχοντες ἠσπάζοντο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/015.yaml
  text: And immediately the whole crowd[a], when they saw him, were greatly amazed, and running up to him, greeted him.
translation:
  language: am
  text: ወዲያውም ሕዝቡ ሁሉ እርሱን ባዩት ጊዜ እጅግ ተደነቁ[a]፤ ወደ እርሱም ሮጠው ሰላምታ ሰጡት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እጅግ ተገረሙ” ወይም “ደነገጡ።” የግሪኩ ግስ እንደ ዐውዱ ከፍተኛ መደነቅን፣ መገረምን ወይም መደንገጥን ሊገልጽ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: ወዲያውም
  rationale: የማርቆስን ፈጣን የትረካ እንቅስቃሴ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: πᾶς ὁ ὄχλος
  choice: ሕዝቡ ሁሉ
  rationale: በአንድነት የተጠቀሰውን ሕዝብ ሙሉ በሙሉ የሚያካትት ሐረግ ሲሆን በአማርኛም ተፈጥሯዊ ነው።
- source_word: ἰδόντες αὐτόν
  choice: እርሱን ባዩት ጊዜ
  rationale: የግሪኩን የቀደመ ግስ አጋማሽ እንደ ጊዜያዊ ሁኔታ በግልጽ ያቀርባል፤ ማየታቸው ለቀጣዩ ምላሽ መነሻ እንደሆነም ያሳያል።
- source_word: ἐξεθαμβήθησαν
  choice: እጅግ ተደነቁ
  rationale: ግሱ የሚያመለክተውን ከፍተኛ ድንጋጤ ወይም መደነቅ ያስተላልፋል፤ ምክንያቱን ወይም ፍርሃትን ግን በትርጉሙ ላይ አይጨምርም።
- source_word: προστρέχοντες
  choice: ወደ እርሱም ሮጠው
  rationale: ወደ ኢየሱስ በፍጥነት የቀረቡበትን እንቅስቃሴ ግልጽና ተፈጥሯዊ በሆነ አማርኛ ይገልጻል።
- source_word: ἠσπάζοντο αὐτόν
  choice: ሰላምታ ሰጡት
  rationale: ἀσπάζομαι በዚህ ትረካ ውስጥ ያለውን መደበኛና ገለልተኛ የሰላምታ ትርጉም በዘመናዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: ἐξεθαμβήθησαν የሚገልጸው የሕዝቡ ምላሽ
  choice: ጠንካራ መደነቅን መግለጽ፣ ምክንያቱን ግን አለመወሰን
  alternative: እንደ ፍርሃት መተርጎም፣ ወይም ከሙሴ ጋር የሚመሳሰል የኢየሱስ ብሩህ ገጽታ እንደ ምክንያት መጨመር
  rationale: ቁጥሩ ሕዝቡ ኢየሱስን ሲያይ በጣም እንደተደነቀና ወደ እርሱ ሮጦ ሰላምታ እንደሰጠ ብቻ ይናገራል። ስለዚህ ትርጉሙ የስሜቱን ጥንካሬ ይጠብቃል፤ ጽሑፉ ያልገለጸውን መንስኤ ግን አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ወዲያውም” የማርቆስን ፈጣን የትረካ ቅኝት ይጠብቃል፤ የግሪኩ ግስ ያለው ስሜታዊ ስፋት በማስታወሻው ተጠብቋል።
