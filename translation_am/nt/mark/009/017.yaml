language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ⸂ἀπεκρίθη αὐτῷ εἷς ἐκ τοῦ ὄχλου⸃· Διδάσκαλε, ἤνεγκα τὸν υἱόν μου πρὸς σέ, ἔχοντα πνεῦμα ἄλαλον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/017.yaml
  text: And one from the crowd answered him[a], “Teacher, I brought my son to you, having a mute spirit.”
translation:
  language: am
  text: ከሕዝቡም መካከል አንዱ መለሰለት፤ “መምህር ሆይ፣ ዲዳ መንፈስ ያለበትን ወንድ ልጄን ወደ አንተ አመጣሁት።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: መለሰለት
  rationale: በወንጌላዊ ትረካ የተለመደውን ‘መለሰ’ የሚለውን ትርጉም ይጠብቃል፤ αὐτῷ ደግሞ በ‘-ለት’ ተገልጧል።
- source_word: εἷς ἐκ τοῦ ὄχλου
  choice: ከሕዝቡ መካከል አንዱ
  rationale: የክፍል አመልካቹን አገባብና ያልተወሰነውን ነጠላ ቁጥር በግልጽ አማርኛ ያስተላልፋል፤ ግሪኩ በቀጥታ ‘ሰው’ ስለማይል አልተጨመረም።
- source_word: Διδάσκαλε
  choice: መምህር ሆይ
  rationale: የጥሪ ቅርጹንና የማስተማር ሚናውን በተፈጥሯዊና ክቡር ዘመናዊ አማርኛ ይገልጣል።
- source_word: ἤνεγκα
  choice: አመጣሁት
  rationale: የአንድ ጊዜ ያለፈ ድርጊቱን በተፈጥሯዊ የአማርኛ አላፊ ጊዜ ይገልጣል፤ ‘-ት’ ቅጥያው ልጁን ያመለክታል።
- source_word: υἱόν
  choice: ልጄን
  rationale: በዐውዱ ወንድ ልጅ መሆኑ ግልጽ ቢሆንም፣ ተፈጥሯዊ አማርኛ ‘ልጄን’ የቤተሰብ ግንኙነቱን በቀጥታ ይገልጣል።
- source_word: πρὸς σέ
  choice: ወደ አንተ
  rationale: ከ‘አመጣሁት’ ጋር የመድረሻ አቅጣጫውን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἔχοντα
  choice: ያለበትን
  rationale: ተሳቢው ‘ልጄን’ የሚያብራራውን የግሪክ አጋኝ ቅርጽ በአማርኛ አንጻራዊ ሐረግ ይጠብቃል፤ ምክንያታዊነትን በግልጽ አይጨምርም።
- source_word: πνεῦμα ἄλαλον
  choice: ዲዳ መንፈስ
  rationale: ἄλαλον ለመንፈሱ የተሰጠ ቅጽል መሆኑን በቀጥታ ይጠብቃል፤ ዐውዱ ክፉ መንፈስ መሆኑን ቢያመለክትም ግሪኩ እዚህ ‘ክፉ’ ወይም ‘ጋኔን’ ስለማይል አልተጨመረም።
theological_decisions:
- issue: በአጋንንት ማስወጣት ዐውድ ውስጥ πνεῦμα የሚለው ትርጉም
  choice: መንፈስ፤ ዐውዱ ክፉ ወይም አጋንንታዊ መንፈስ መሆኑን ያመለክታል
  alternative: ክፉ መንፈስ ወይም ጋኔን ብሎ በግልጽ መተርጎም
  rationale: የትረካው ዐውድ የሚያሠቃይ መንፈስ መሆኑን ያሳያል፤ ሆኖም የግሪኩ ጽሑፍ በዚህ ቁጥር πνεῦμα ብቻ ስለሚል ዋናው ጽሑፍ ያንን ውስንነት ይጠብቃል።
- issue: ἔχοντα ከ‘ልጄን’ ወይስ ከ‘አንተ’ ጋር የሚያያዝ መሆኑ
  choice: ከ‘ልጄን’ ጋር በማያያዝ ‘ያለበትን ልጄን’
  alternative: ከ‘አንተ’ ጋር የሚያያዝ በሚመስል አወቃቀር መተርጎም
  rationale: ἔχοντα የወንድ ፆታ ነጠላ ተሳቢ ቅርጽ ሲሆን υἱόν ን በሰዋስው ይዛመዳል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ የትረካ ቋንቋ ተጠቅሟል። ‘ዲዳ መንፈስ ያለበትን’ የሚለው አወቃቀር የግሪኩን አጋኝ ሐረግ በተፈጥሯዊ አማርኛ ይወክላል። የትርጉም ማስታወሻ አላስፈለገም።
