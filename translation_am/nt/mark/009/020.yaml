id: MRK.9.20
reference: Mark 9:20
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἤνεγκαν αὐτὸν πρὸς αὐτόν. καὶ ἰδὼν αὐτὸν ⸂τὸ πνεῦμα εὐθὺς⸃ ⸀συνεσπάραξεν αὐτόν, καὶ πεσὼν ἐπὶ τῆς γῆς ἐκυλίετο ἀφρίζων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/020.yaml
  text: And they brought him to him[a]. And when the spirit saw him, it immediately convulsed him, and he fell on the ground and rolled about[b], foaming.
translation:
  language: am
  text: እነርሱም ልጁን ወደ እርሱ አመጡት። መንፈሱም[a] እርሱን ባየ ጊዜ፣ ወዲያው ልጁን አንቀጠቀጠው፤ እርሱም በመሬት ላይ ወድቆ አረፋ እያወጣ ይንከባለል ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ርኩሱ መንፈስ»፤ ሰፊው አውድ መንፈሱን ርኩስ ብሎ ይገልጸዋል፣ ነገር ግን ይህ ቁጥር «መንፈሱ» ብቻ ይላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἤνεγκαν αὐτὸν πρὸς αὐτόν
  choice: ልጁን ወደ እርሱ አመጡት
  rationale: φέρω በዚህ አውድ ልጁን ወደ ኢየሱስ ማምጣትን ያመለክታል። ሁለቱን αὐτόν በተፈጥሯዊ አማርኛ ለማብራራት የመጀመሪያው 'ልጁን' ተብሏል።
- source_word: ἰδὼν αὐτὸν τὸ πνεῦμα
  choice: መንፈሱም እርሱን ባየ ጊዜ
  rationale: የግሪኩን ግልጽ ባለቤት τὸ πνεῦμα እና ጊዜን የሚያመለክተውን የተውሳከ ግስ ግንኙነት ይጠብቃል፤ 'እርሱን' በአውዱ ኢየሱስን ያመለክታል።
- source_word: τὸ πνεῦμα
  choice: መንፈሱ
  rationale: ቁጥሩ ራሱ 'መንፈሱ' ብቻ ይላል፤ 'ርኩስ' ወይም 'ጋኔን' በመጨመር ከዚህ ቁጥር ውጭ ያለውን መረጃ ወደ ዋናው ጽሑፍ አያስገባም።
- source_word: εὐθὺς
  choice: ወዲያው
  rationale: የማርቆስን ፈጣን የትረካ እንቅስቃሴና የቃሉን ወዲያውነት በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: συνεσπάραξεν αὐτόν
  choice: ልጁን ክፉኛ አንፈራገጠው
  rationale: ግሱ ኃይለኛ የሰውነት መንፈራገጥን ያመለክታል። 'ልጁን' ማለት በአማርኛ የተውላጠ ስሙን ማጣቀሻ ግልጽ ያደርጋል።
- source_word: πεσὼν ἐπὶ τῆς γῆς ἐκυλίετο
  choice: መሬት ላይ ወድቆ ... ይንከባለል ነበር
  rationale: ወድቆ መንከባለሉን የሚያሳየውን የተውሳከ ግስ ቅደም ተከተልና የኢምፐርፌክት ግሱን ቀጣይ እንቅስቃሴ ይጠብቃል።
- source_word: ἀφρίζων
  choice: አረፋ እየደፈቀ
  rationale: የሚታየውን አረፋ መውጣት በተፈጥሯዊ አማርኛ ይገልጣል፤ በግሪኩ በግልጽ ያልተጠቀሰውን 'ከአፉ' አይጨምርም።
theological_decisions:
- issue: የπνεῦμα መለያ
  choice: በዋናው ጽሑፍ 'መንፈሱ' ተብሏል።
  alternative: '''ርኩሱ መንፈስ'' ወይም ''ጋኔኑ'''
  rationale: ሰፊው አውድ መንፈሱ ርኩስ መሆኑን ቢያሳይም፣ ይህ ቁጥር τὸ πνεῦμα ብቻ ይላል። ትርጉሙ የቁጥሩን አነጋገር ሳያሰፋ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ የትረካ አማርኛ ተጠቅሟል። የተውላጠ ስም ግራ መጋባትን ለመቀነስ 'ልጁን' ተደግሟል፤ ሆኖም 'እርሱን' የሚለው የግሪኩ አገላለጽ መንፈሱ ኢየሱስን ማየቱን እንዲያሳይ ተጠብቋል።
