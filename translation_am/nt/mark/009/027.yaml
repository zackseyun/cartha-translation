  yaml_path: translation/nt/mark/009/027.yaml
  text: But Jesus[a], taking hold of his hand, raised him up[b], and he stood up.
translation:
  language: am
  text: ኢየሱስ ግን እጁን ይዞት አነሣው፤[a] እርሱም ተነሣ።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ከፍ አደረገው” ወይም “አስነሣው” ተብሎም ሊተረጎም ይችላል፤ የግሪኩ ግስ ከእንቅልፍ ወይም ከሞት ስለመነሣት በሚናገሩ ዐውዶችም ይሠራበታል።
    reason: lexical_alternative
  - marker: b
    text: “ቆመ” ወይም “ብድግ አለ” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ግን
  rationale: ሕዝቡ ልጁ እንደሞተ ካሰበበት ሁኔታ ጋር ያለውን ለስላሳ ንፅፅርና የትረካ ሽግግር ይጠብቃል።
- source_word: κρατήσας
  choice: ይዞ
