- source_word: τῆς χειρὸς αὐτοῦ
  choice: እጁን
  rationale: χείρ የሚለውን የተወሰነ የአካል ክፍል ሳያሰፋ ይጠብቃል።
- source_word: ἤγειρεν
  choice: አነሣው
  rationale: ኢየሱስ ልጁን ከወደቀበት እንዲነሣ ማድረጉን ይገልጻል፤ ቃሉ ለከእንቅልፍ ወይም ከሞት ማስነሣትም ሊውል የሚችለውን የቃላት ድምፅ አያጠፋም።
- source_word: ἀνέστη
  choice: ተነሣ
  rationale: ልጁ ኢየሱስ ካነሣው በኋላ መነሣቱን በዘመናዊ፣ ክቡርና ቀጥተኛ አማርኛ ያሳያል።
theological_decisions:
- issue: በἤγειρεν እና ἀνέστη ውስጥ ሊሰማ የሚችለው የትንሣኤ ቃላዊ ድምፅ
  choice: በዐውዱ ያለውን መደበኛ የመነሣት ትርጉም በ“አነሣው … ተነሣ” ማስቀደም፣ ቃላዊ ድምፁንም ማቆየት
  alternative: “እንዲቆም ረዳው፤ እርሱም ቆመ” በማለት የትንሣኤን ድምፅ ሙሉ በሙሉ ማስወገድ
  rationale: ዐውዱ ከአጋንንት መውጣት በኋላ ልጁ ከመሬት መነሣቱን እንጂ ከሞት መነሣቱን አይተርክም። ሆኖም ማርቆስ የመረጣቸው ግሶች በሌላ ስፍራ ከትንሣኤ ጋር የሚያያዝ ድምፅ ስላላቸው ያንን ውጥረት ሳይጫን መጠበቅ ተገቢ ነው።
translation_notes:
  register: ዘመናዊ መደበኛ አማርኛ፤ ክቡር ነገር ግን ለተራ አንባቢ ግልጽ የሆነ አገላለጽ። “እጁን ይዞ” የአካላዊ ንክኪውን ግልጽነት ይጠብቃል፤ “አነሣው … ተነሣ” የሁለቱን የግሪክ ግሶች የቃላት ግንኙነት በተፈጥሯዊ አማርኛ ያንጸባርቃል።
