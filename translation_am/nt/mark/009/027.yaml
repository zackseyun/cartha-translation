    rationale: The Greek explicitly says Jesus took hold of the boy's hand (τῆς χειρὸς αὐτοῦ). In Amharic, “እጁን ይዞ” may be understood reflexively as holding his own hand. “እጁን ይዞት” clearly conveys taking him by the hand while retaining the source's concise possessive wording.
  revised_text: ኢየሱስ ግን እጁን ይዞት አነሣው፤[a] እርሱም ተነሣ።[b]
