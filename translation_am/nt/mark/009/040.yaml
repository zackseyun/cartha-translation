review_pass:
  verdict: revise
  source_fidelity: The draft preserves the generic subject, the explanatory force of γάρ, and the first-person plural reference. However, “በእኛ ላይ ያልሆነ” is not a clear or idiomatic Amharic expression for καθ’ ἡμῶν (“against us”); it can be understood spatially rather than as opposition.
  naturalness: Replacing the literal spatial construction with “የማይቃወመን” gives a natural modern-Amharic expression of opposition. “ከእኛ ወገን ነው” provides a clear, balanced counterpart for ὑπὲρ ἡμῶν.
  terminology: The revision retains the source’s relational language without expanding “us” into God, the kingdom, or a mission. “ከእኛ ወገን” appropriately conveys alignment and is supported by the lexical range noted in the English audit trail.
  issues:
  - severity: medium
    issue: “በእኛ ላይ ያልሆነ” is an unnatural rendering of “not against us.”
    rationale: In Amharic, “በ… ላይ መሆን” is not the normal idiom for being opposed to someone in this construction. “የማይቃወመን” directly and naturally expresses the Greek sense of opposition.
  revised_text: የማይቃወመን ሁሉ ከእኛ ወገን ነውና።[a]
