  text: For whoever is not against us is for us[a].
translation:
  language: am
  text: የማይቃወመን ሁሉ ከእኛ ወገን ነውና።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለእኛ ነው።” የግሪኩ ὑπὲρ ἡμῶν “ለእኛ”፣ “በእኛ ፋንታ” ወይም “ከእኛ ወገን” የሚል ትርጉም ሊኖረው ይችላል።
