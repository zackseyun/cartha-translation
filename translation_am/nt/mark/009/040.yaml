  rationale: 'The text is revised solely for idiomatic clarity and source-faithful opposition/alignment imagery: καθ’ ἡμῶν is rendered “የማይቃወመን,” and ὑπὲρ ἡμῶν is rendered “ከእኛ ወገን ነው.” The concise antithetical structure and the explanatory final -ና are retained.'
