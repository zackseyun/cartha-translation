lexical_decisions:
- source_word: ὃς
  choice: ያልሆነ ሁሉ
  rationale: ὃς እዚህ አጠቃላይና ያልተወሰነ ሰውን ያመለክታል፤ በአማርኛ ‘… ሁሉ’ የሚለው አቀራረብ ይህን ኃይል በተፈጥሮ ያስተላልፋል።
- source_word: γὰρ
  choice: ነውና
  rationale: γάρ ከቀደመው ንግግር ጋር የሚያያዝ ምክንያታዊ ማብራሪያ ያስገባል፤ በአማርኛ ከግስ ጋር የተያያዘው ‘-ና’ ይህን ግንኙነት በተፈጥሮ ይገልጣል።
- source_word: οὐκ ἔστιν
  choice: ያልሆነ
  rationale: የተካደ አገናኝ ግስ በአማርኛ ቀጥተኛና ተፈጥሯዊ በሆነ አንጻራዊ ቅርጽ ተተርጉሟል።
- source_word: καθ’ ἡμῶν
  choice: በእኛ ላይ
  rationale: κατά ከባለቤት ቅጽ ጋር ተቃውሞን ይገልጣል፤ ‘በእኛ ላይ’ በዘመናዊ አማርኛ ‘against us’ የሚለውን በግልጽ ያስተላልፋል።
- source_word: ὑπὲρ ἡμῶν
  choice: ለእኛ
  rationale: ὑπέρ እዚህ ‘ለ፣ በመወገን፣ በመደገፍ’ የሚል ስፋት ሊኖረው ይችላል። ‘ለእኛ’ ከ‘በእኛ ላይ’ ጋር ያለውን አጭር ተቃርኖ ይጠብቃል፣ ሌላውንም ትርጉም አይዘጋም።
- source_word: ἐστιν
  choice: ነው
  rationale: ተቃርኖውን የሚያጠናቅቀው ቀላል አገናኝ ግስ በቀጥታ ተተርጉሟል።
theological_decisions:
- issue: ‘በእኛ ላይ’ እና ‘ለእኛ’ የሚሉት የወገንተኝነት አገላለጾች ወሰን
  choice: የመጀመሪያ ሰው ብዙ ቁጥርን እንዳለ በመጠበቅ ‘በእኛ ላይ’ እና ‘ለእኛ’ ተብሏል።
  alternative: ‘እግዚአብሔርን የማይቃወም ከእግዚአብሔር ወገን ነው’ ወይም ‘ተልእኳችንን የማይቃወም ከእኛ ወገን ነው።’
  rationale: ግሪኩ በግልጽ ‘እኛ’ ይላል። ይህን ወደ ‘እግዚአብሔር’ ወይም ‘ተልእኮ’ በማስፋት ከመተርጎም ይልቅ፣ የአባባሉ ወሰንና ሥነ መለኮታዊ ውጥረት ለዐውዱ ተትቷል።
translation_notes:
  register: ትርጉሙ አጭርነቱንና ትይዩ ተቃርኖውን ጠብቆ፣ ለዘመናዊ አንባቢ ቀላል፣ ክቡርና ተፈጥሯዊ አማርኛ ይጠቀማል።
