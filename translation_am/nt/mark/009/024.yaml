id: MRK.9.24
reference: Mark 9:24
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀εὐθὺς κράξας ὁ πατὴρ τοῦ ⸀παιδίου ἔλεγεν· ⸀Πιστεύω· βοήθει μου τῇ ἀπιστίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/024.yaml
  text: Immediately the father of the child cried out and said[a], “I believe[b]; help my unbelief!”
translation:
  language: am
  text: ወዲያውም የልጁ አባት ጮኾ፣ “አምናለሁ፤ በአለማመኔ እርዳኝ![a]” አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በእምነቴ ጉድለት እርዳኝ!” የግሪኩ ἀπιστία አለማመንን ወይም የእምነት ጉድለትን ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθύς
  choice: ወዲያውም
  rationale: የአባቱን ፈጣን ምላሽና በማርቆስ ትረካ የሚታየውን አጣዳፊነት በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: κράξας
  choice: ጮኾ
  rationale: የንግግሩን ከፍተኛ ድምፅና ስሜታዊ አጣዳፊነት ሳያጋንን ያሳያል።
- source_word: ὁ πατὴρ τοῦ παιδίου
  choice: የልጁ አባት
  rationale: παιδίον ልጅ ወይም ወንድ ልጅ ሊል ቢችልም፣ “ልጅ” የቃሉን ሰፊ የትርጉም ክልል ይጠብቃል፤ የባለቤትነት አወቃቀሩም በአማርኛ ተፈጥሯዊ ነው።
- source_word: ἔλεγεν
  choice: አለ
  rationale: የግሪኩ ኢምፐርፌክት ቀጣይነትን ሊያመለክት ቢችልም፣ ቀጥተኛ ንግግርን ለማስገባት “አለ” ተፈጥሯዊና ትክክለኛ ነው።
- source_word: Πιστεύω
  choice: አምናለሁ
  rationale: በዚህ ዐውድ πιστεύω እምነትን ወይም ማመንን ያመለክታል፤ “አምናለሁ” ቀጥተኛና ተፈጥሯዊ ትርጉም ነው።
- source_word: βοήθει
  choice: እርዳው
  rationale: የአሁን ጊዜ ትእዛዛዊውን አጣዳፊ የእርዳታ ልመና ያስተላልፋል፤ የነገሩ ቅጥያም አለማመኑን የእርዳታው ዒላማ አድርጎ ያሳያል።
- source_word: μου τῇ ἀπιστίᾳ
  choice: አለማመኔን
  rationale: ἀπιστία አለማመንን ወይም የእምነት ጉድለትን ሊያመለክት ይችላል። “አለማመኔን” ከ“አምናለሁ” ጋር ያለውን የቃልና የሐሳብ ውጥረት በቀጥታ ይጠብቃል።
theological_decisions:
- issue: በΠιστεύω እና ἀπιστίᾳ መካከል ያለው ውጥረት
  choice: “አምናለሁ፤ አለማመኔን እርዳው!” በማለት ፓራዶክሱን በዋናው ጽሑፍ ማቆየት
  alternative: “አምናለሁ፤ የእምነት ጉድለቴን እርዳኝ!”
  rationale: ንግግሩ እውነተኛ ማመንና አሁንም የሚቀር አለማመን አብረው መኖራቸውን ሆን ብሎ ያሰማል። ትርጉሙ ይህን ሥነ መለኮታዊ ውጥረት ማለስለስ ወይም መፍታት የለበትም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ቀጥተኛው ንግግር ተፈጥሯዊ እንዲሆን “አለ” ከጥቅሱ በኋላ ተቀምጧል፤ የእምነትና የአለማመን ውጥረት ሳይፈታ ተጠብቋል።
