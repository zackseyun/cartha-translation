review_pass:
  verdict: revise
  source_fidelity: The draft preserves the principal images and the contrast between entering God’s kingdom with one eye and being thrown into Gehenna. However, «ከመጣልህ» does not clearly express the Greek passive βληθῆναι (“to be thrown”) and can be understood actively. The comparative expression also needs smoother, unambiguous Amharic.
  naturalness: The opening is understandable, but the constructions «ሁለት ዐይኖች ኖረውህ» and «አንድ ዐይን ኖሮህ» are less idiomatic than expressing possession with «እያሉህ». Modern standard spelling normally uses «ዓይን».
  terminology: «የእግዚአብሔር መንግሥት» is appropriate and established. «ገሃነም» suitably retains the distinct term γέεννα; the footnote accurately gives its historical background without replacing it with «ሲኦል».
  issues:
  - severity: high
    issue: Passive force of βληθῆναι is not explicit
    rationale: «ከመጣልህ» can denote your act of throwing rather than your being thrown. «ተጥለህ» explicitly renders the passive infinitive.
  - severity: medium
    issue: Possession/condition with one or two eyes is awkward
    rationale: «... ኖረውህ/ኖሮህ» is grammatically possible but unnatural in this context. «አንድ/ሁለት ዓይኖች እያሉህ» is clearer and more idiomatic.
  - severity: low
    issue: Orthography of “eye”
    rationale: «ዓይን» is the usual modern standard spelling; «ዐይን» is an older/less common orthographic form.
  revised_text: ዓይንህም እንድትሰናከል ቢያደርግህ፣ አውጥተህ ጣለው። አንድ ዓይን እያለህ ወደ የእግዚአብሔር መንግሥት መግባት፣ ሁለት ዓይኖች እያሉህ ወደ ገሃነም[a] ተጥለህ ከመግባት ይሻልሃል፤
