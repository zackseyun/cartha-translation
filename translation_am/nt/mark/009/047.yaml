source:
  edition: SBLGNT
  text: καὶ ἐὰν ὁ ὀφθαλμός σου σκανδαλίζῃ σε, ἔκβαλε αὐτόν· καλόν ⸀σέ ἐστιν μονόφθαλμον εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς ⸀τὴν ⸀γέενναν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/047.yaml
  text: And if your eye causes you to stumble[a], throw it out. It is better for you to enter the kingdom of God with one eye than, having two eyes, to be thrown into Gehenna,
translation:
  language: am
  text: ዓይንህም እንድትሰናከል ቢያደርግህ፣ አውጥተህ ጣለው። አንድ ዓይን እያለህ ወደ የእግዚአብሔር መንግሥት መግባት፣ ሁለት ዓይኖች እያሉህ ወደ ገሃነም[a] ተጥለህ ከመግባት ይሻልሃል፤
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ገሃነም” የሚለው ቃል ከሄኖም ሸለቆ ስም የመጣ ሲሆን፣ እዚህ የመጨረሻውን ፍርድ ያመለክታል።
    reason: historical_and_lexical_clarification
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: እንድትሰናከል ቢያደርግህ
  rationale: የግሪኩን የመሰናከል ምስል ይጠብቃል፤ ትርጉሙንም በ‘ኃጢአት ማሠራት’ ብቻ አይወስነውም።
- source_word: ἔκβαλε αὐτόν
  choice: አውጥተህ ጣለው
  rationale: ἐκβάλλω ያለውን ‘ወደ ውጭ አውጥቶ መጣል’ ኃይለኛ ትእዛዝ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ‘ንቀለው’ የሚለውን በግሪኩ በግልጽ ያልተጠቀሰ ዝርዝር አያክልም።
- source_word: καλόν ... ἢ
  choice: ይሻልሃል ... ከ
  rationale: ቃል በቃል ‘መልካም ነው’ ቢሆንም፣ በንጽጽሩ ውስጥ ያለውን የ‘ይሻላል’ ኃይል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: μονόφθαλμον
  choice: አንድ ዐይን ኖሮህ
  rationale: ‘አንድ ዐይን ያለው’ የሚለውን ቀጥተኛ ምስል ለዘመናዊ አንባቢ ተፈጥሯዊ በሆነ አገላለጽ ይጠብቃል።
- source_word: βασιλείαν τοῦ θεοῦ
  choice: የእግዚአብሔር መንግሥት
  rationale: የግሪኩን የባለቤትነት ግንኙነትና የአዲስ ኪዳን የታወቀውን ሥነ መለኮታዊ አገላለጽ ይጠብቃል።
- source_word: βληθῆναι
  choice: ከመጣልህ
  rationale: የግሪኩን ተደራጊ ግስ ‘መጣል’ በሚል ግልጽና ተፈጥሯዊ ቅርጽ ያስተላልፋል።
- source_word: γέενναν
  choice: ገሃነም
  rationale: ‘ገሃነም’ ከግሪኩ γέεννα ጋር በታሪክ የተያያዘና በአማርኛ የተለመደ ቅጽ ሲሆን፣ በማብራሪያው የሄኖም ሸለቆ መሠረቱ ተጠብቋል።
theological_decisions:
- issue: በፍርድ አውድ ውስጥ γέεννα እንዴት እንደሚተረጎም
  choice: ገሃነም
  alternative: ሲኦል / የእሳት ሲኦል
  rationale: γέεννα ለመቃብር ወይም ለሙታን ዓለም ከሚያገለግሉ ሌሎች መጽሐፍ ቅዱሳዊ ቃላት የተለየ ነው። ‘ገሃነም’ የቃሉን ታሪካዊ ማንነት ይበልጥ ይጠብቃል፤ የመጨረሻ ፍርድ አውዱም በማብራሪያ ተገልጿል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የአካል ምስሎቹና የንጽጽሩ ኃይል ተጠብቀዋል፤ የግሪኩ የአረፍተ ነገር ቅደም ተከተል ግን ለተፈጥሯዊ አማርኛ ተስተካክሏል።
