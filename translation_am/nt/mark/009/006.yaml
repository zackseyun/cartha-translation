review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders Peter's lack of knowing and the plural, intensified fear. However, it leaves the second γάρ unexpressed and renders ἐγένοντο only as a stative past ('ነበር'), obscuring the entry into fear indicated by γίνομαι.
  naturalness: The phrase 'ምን ብሎ መልስ መስጠት እንዳለበት' is understandable but heavier and less idiomatic than a finite indirect-question construction. 'ምን ብሎ እንደሚመልስ' is natural modern standard Amharic.
  terminology: '''መመለስ'' appropriately retains the reply/answer sense of ἀποκριθῇ. ''እጅግ ፈሩ'' naturally conveys the strongly fearful response and, unlike ''ፈርተው ነበር,'' preserves the aoristic transition expressed by ἐγένοντο.'
  issues:
  - severity: medium
    issue: The second γάρ is not represented in the main text.
    rationale: The source gives explanatory γάρ in both clauses. Modern Amharic need not mechanically repeat one conjunction form, but the second explanatory connection should be retained, here with final '-ና.'
  - severity: medium
    issue: The rendering 'እጅግ ፈርተው ነበር' makes ἐγένοντο purely stative.
    rationale: ἐγένοντο marks their coming into a state of intense fear. 'እጅግ ፈሩ' is idiomatic and better maintains this verbal force.
  - severity: low
    issue: The first indirect-question expression is unnecessarily periphrastic.
    rationale: Replacing the nominal construction with 'ምን ብሎ እንደሚመልስ' gives a clearer, more natural equivalent without reducing the reply-specific sense.
  revised_text: ምክንያቱም ምን ብሎ እንደሚመልስ አላወቀምና፤[a] እነርሱም እጅግ ፈሩና።[b]
