  text: For he did not know what he should answer[b][a], for they were terrified.
translation:
  language: am
  text: ምክንያቱም ምን ብሎ እንደሚመልስ አላወቀምና፤[a] እነርሱም እጅግ ፈሩና።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ምን ብሎ መልስ እንደሚሰጥ።»
    reason: lexical_alternative
  - marker: b
    text: ግሪክኛው «እጅግ ፈርተው ሆኑ» በሚል መልኩ ወደ ከፍተኛ ፍርሃት ሁኔታ መግባታቸውን ያሳያል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: አላወቀም
  rationale: οἶδα እዚህ እውቀትን ወይም ማወቅን ያመለክታል፤ ከአሉታዊው οὐ ጋር «አላወቀም» ተፈጥሯዊና ትክክለኛ ነው።
- source_word: τί ἀποκριθῇ
  choice: ምን ብሎ መልስ መስጠት እንዳለበት
  rationale: ἀποκρίνομαι በተለይ መመለስን ያመለክታል፤ ይህ አገላለጽ የጥያቄያዊውን τί ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἔκφοβοι
  choice: እጅግ ፈርተው
  rationale: ἔκφοβος ከቀላል ፍርሃት የበረታ ሁኔታን ያሳያል፤ «እጅግ ፈርተው» ይህን ጥንካሬ ግልጽ በሆነ ዘመናዊ አማርኛ ይገልጻል።
- source_word: ἐγένοντο
  choice: ነበር
  rationale: ቃል በቃል «ሆኑ» ወይም «ሆነው ነበር» ሊባል ቢችልም፣ በዚህ አውድ «እጅግ ፈርተው ነበር» በአማርኛ ተፈጥሯዊ ሆኖ ውጤቱን የፍርሃት ሁኔታ ያስተላልፋል።
- source_word: γὰρ ... γὰρ
  choice: -ና፤ ...
  rationale: የመጀመሪያው γάρ በ«-ና» የምክንያት ግንኙነቱን በተፈጥሯዊ አማርኛ ያሳያል። ሁለተኛውን γάρ በተጨማሪ «ምክንያቱም» ብሎ መድገም ንግግሩን ከባድ ስለሚያደርግ፣ የማብራሪያ ግንኙነቱ በአረፍተ ነገሩ ቅደም ተከተል ተጠብቋል።
theological_decisions:
- issue: የብዙ ቁጥር ሐረጉ ባለቤት
  choice: እጅግ ፈርተው ነበር
  alternative: እርሱ እጅግ ፈርቶ ነበር
  rationale: ἔκφοβοι እና ἐγένοντο ሁለቱም በብዙ ቁጥር ናቸው። ስለዚህ ሐረጉ ጴጥሮስን ብቻ ሳይሆን በአውዱ ጴጥሮስንና አብረውት የነበሩትን ይመለከታል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «መልስ መስጠት» የἀποκρίνομαιን ልዩ የመመለስ ትርጉም ጠብቋል፤ የብዙ ቁጥር ፍርሃትም አልተነጠለም።
