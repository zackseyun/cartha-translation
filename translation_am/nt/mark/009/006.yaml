  to: ምክንያቱም ምን ብሎ እንደሚመልስ አላወቀምና፤[a] እነርሱም እጅግ ፈሩና።[b]
  rationale: The revision uses a natural Amharic indirect question for τί ἀποκριθῇ, explicitly retains both explanatory γάρ connections, and uses the finite plural verb 'ፈሩ' to retain both the plural subject and the source verb's movement into intense fear. No doctrinal inference is added.
