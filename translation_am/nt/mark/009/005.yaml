source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Πέτρος λέγει τῷ Ἰησοῦ· Ῥαββί, καλόν ἐστιν ἡμᾶς ὧδε εἶναι, καὶ ποιήσωμεν ⸂τρεῖς σκηνάς⸃, σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/005.yaml
  text: 'And Peter answered and said to Jesus[a], “Rabbi, it is good for us to be here, and let us make three shelters: one for you, one for Moses, and one for Elijah.”'
translation:
  language: am
  text: ጴጥሮስም ለኢየሱስ መልሶ እንዲህ አለው፦ “ረቢ፣ እዚህ መሆናችን መልካም ነው፤ ሦስት መጠለያዎችን[a] እንሥራ፤ አንዱን ለአንተ፣ አንዱን ለሙሴ፣ አንዱንም ለኤልያስ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ድንኳኖች” ወይም “ዳሶች”። የግሪኩ σκηνάς ጊዜያዊ መጠለያዎችን ያመለክታል፤ ከድንኳን ወይም ከዳስ ጋር የተያያዙ ፍችዎችም ሊኖሩት ይችላሉ፣ ነገር ግን ይህ ቁጥር እነዚያን ጥምረቶች በግልጽ አይገልጥም።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … λέγει
  choice: መልሶ … አለው
  rationale: ቀድሞ ግልጽ ጥያቄ ባይኖርም ἀποκριθεὶς የተለመደውን የትረካ አገላለጽ ይጠብቃል፤ የግሪኩ ታሪካዊ የአሁን ጊዜ λέγει በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜ ተተርጉሟል።
- source_word: Ῥαββί
  choice: ረቢ
  rationale: የሴማዊውን አውድና የአክብሮት መጠሪያነቱን ለማቆየት ቃሉ በድምፅ ተቀራራቢ መልክ ቀርቧል፤ ‘መምህር’ የሚለው ትርጉም ግን ከዋናው ቃል ያነሰ ግልጽነት አለው።
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: እዚህ መሆናችን መልካም ነው
  rationale: የጴጥሮስን ግምገማ ያለ ትርጓሜያዊ ማጠናከሪያ ይገልጣል፤ καλόν በቀጥታ ‘መልካም’ ተብሏል።
- source_word: ποιήσωμεν
  choice: እንሥራ
  rationale: የመጀመሪያ መደብ ብዙ ቁጥር አበረታች ንዑስ አንቀጽን በተፈጥሯዊ አማርኛ ይወክላል፤ ‘እንገንባ’ ከመሠረታዊው ποιέω የበለጠ ትርጓሜያዊ ነው።
- source_word: σκηνάς
  choice: መጠለያዎችን
  rationale: ቃሉ ጊዜያዊ ድንኳንን፣ ዳስን ወይም መጠለያን ሊያመለክት ይችላል። ‘መጠለያዎች’ መሠረታዊውን ሐሳብ በዘመናዊና ግልጽ ቋንቋ ያቀርባል፤ ሌሎቹ አማራጮች በማስታወሻ ተጠብቀዋል።
- source_word: σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν
  choice: አንዱን ለአንተ፣ አንዱን ለሙሴ፣ አንዱንም ለኤልያስ
  rationale: μίαν ሦስት ጊዜ መደገሙንና የግሪኩን ትይዩ አወቃቀር ይጠብቃል።
theological_decisions:
- issue: σκηνάς ከበዓለ ዳስ ወይም ከመቅደስ ማደሪያ ጋር ሊኖረው የሚችለው ማህበራዊና አምልኮአዊ ጥምረት
  choice: በዋናው ጽሑፍ ገለልተኛውን ‘መጠለያዎች’ መጠቀም
  alternative: ‘ድንኳኖች’፣ ‘ዳሶች’ ወይም ‘ማደሪያዎች’
  rationale: ቁጥሩ እነዚህን መዋቅሮች ከበዓለ ዳስ ወይም ከመቅደስ ማደሪያ ምሳሌ ጋር በግልጽ አያያይዛቸውም። ስለዚህ ዋናው ጽሑፍ ከምንጩ የሚበልጥ ሥነ መለኮታዊ ጥምረት አያስገባም፤ እውነተኛው የቃል ስፋት ግን በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ረቢ’ የምንጩን ባህላዊ አውድ ይጠብቃል፤ የአረፍተ ነገሩ አወቃቀር ደግሞ ተፈጥሯዊ የአማርኛ ትረካን ተከትሏል።
