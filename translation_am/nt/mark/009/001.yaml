  text: καὶ ἔλεγεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι εἰσίν τινες ⸂τῶν ὧδε⸃ ἑστηκότων οἵτινες οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὴν βασιλείαν τοῦ θεοῦ ἐληλυθυῖαν ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/001.yaml
  text: And he was saying to them[a], “Truly I say to you[d][c][b], there are some standing here who will certainly not taste death until they see the kingdom of God having come in power.”
translation:
  language: am
  text: እርሱም እንዲህ ይላቸው ነበር፦ “እውነት እላችኋለሁ፤ በዚህ ስፍራ ቆመው ካሉት መካከል አንዳንዶች፣ በኃይል መጥቶ ያለውን የእግዚአብሔር መንግሥት እስኪያዩ ድረስ ሞትን ፈጽሞ አይቀምሱም።”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ሞትን መቅመስ” ማለት “ሞትን መለማመድ” ወይም “መሞት” ማለት የሆነ ዘይቤያዊ አነጋገር ነው።
    reason: lexical_alternative
  - marker: b
    text: “በኃይል መጥቶ ያለውን የእግዚአብሔር መንግሥት” የሚለው ከኢየሱስ መለወጥ፣ ከትንሣኤው፣ ከጰንጠቆስጤ፣ በኢየሩሳሌም ላይ ከደረሰው ፍርድ፣ ወይም ከመንግሥቱ የመጨረሻ ፍጻሜ ጋር ሊያያዝ ይችላል፤ ጥቅሱ ራሱ የትኛው ክስተት እንደሆነ አይገልጽም።
    reason: alternative_reading
lexical_decisions:
