  choice: ሞትን ፈጽሞ አይቀምሱም
  rationale: οὐ μή ያለውን ጠንካራ እምቢታ ‘ፈጽሞ’ ያሳያል፤ ‘ሞትን መቅመስ’ የሚለውን የምንጩን ዘይቤም ይጠብቃል።
- source_word: ἕως ἂν ἴδωσιν
  choice: እስኪያዩ ድረስ
  rationale: ወደፊት የሚፈጸመውን ጊዜያዊ ድንበር በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: βασιλείαν τοῦ θεοῦ
  choice: የእግዚአብሔር መንግሥት
