  choice: የተወሰነ ክስተት ሳይጨመር የምንጩን ክፍት አገላለጽ መጠበቅ
  alternative: የኢየሱስ መለወጥ፣ ትንሣኤና ከፍ ከፍ ማለት፣ ጰንጠቆስጤ፣ በኢየሩሳሌም ላይ የደረሰው ፍርድ፣ ወይም የመንግሥቱ የመጨረሻ ፍጻሜ
  rationale: ግሪኩ በግልጽ የሚለየው ክስተት የለም፤ ስለዚህ ትርጉሙ የነገረ መለኮት ውጥረቱንና እውነተኛ አሻሚነቱን ይጠብቃል።
