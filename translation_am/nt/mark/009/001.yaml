- source_word: ἐληλυθυῖαν
  choice: መጥቶ
  rationale: ፍጹም አንቀጽ ያለውን የመምጣትና ከመምጣቱ የተነሳ ያለውን ሁኔታ በአማርኛ ተጓዳኝ ግስ ያቀርባል፤ በአማርኛ ‘መንግሥት’ በተለምዶ በወንድ ሰዋሰዋዊ ስምምነት ስለሚወሰድ ‘መጥቶ’ ተመርጧል።
- source_word: ἐν δυνάμει
  choice: በኃይል
  rationale: የመለኮታዊ ኃይል መገለጥን ሳይገድብ የግሪኩን ቅርጽና ሰፊ ትርጉም በቀጥታ ይጠብቃል።
