base_translation:
  language: en
  yaml_path: translation/nt/mark/009/003.yaml
  text: And his clothes became gleaming[a], very white, such as no launderer on earth is able to whiten.
translation:
  language: am
  text: ልብሶቹም የሚያንጸባርቁና እጅግ ነጭ ሆኑ፤ በምድር ላይ ያለ አንድም ልብስ አጣቢ[a] እንዲህ ሊያነጣቸው አይችልም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ልብስ አጣቢ» የተባለው ጨርቅን የሚያጸዳና የሚያነጣ ባለሙያን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱμάτια
  choice: ልብሶቹ
  rationale: አጠቃላይ የልብስ ቃል ስለሆነ፣ በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ የሆነው «ልብሶቹ» ተመርጧል።
- source_word: ἐγένετο
  choice: ሆኑ
