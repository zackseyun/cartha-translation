- source_word: στίλβοντα
  choice: እያንጸባረቁ
  rationale: ቃሉ የሚያብረቀርቅና የሚያንጸባርቅ ብርሃናማ ገጽታን ይገልጣል፤ ተጨማሪ ሥነ መለኮታዊ ትርጓሜ አያስገባም።
- source_word: λευκὰ λίαν
  choice: እጅግ ነጭ
  rationale: λευκά የቀለምን ነጭነት፣ λίαν ደግሞ ከፍተኛ ማጠናከርን ይገልጣሉ፤ «እጅግ ነጭ» ሁለቱንም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: γναφεύς
  choice: ልብስ አጣቢ
  rationale: በጥንት ጊዜ ጨርቅን የሚያጸዳና የሚያነጣውን ባለሙያ በዘመናዊ አንባቢ የሚገባ መንገድ ይገልጣል።
- source_word: ἐπὶ τῆς γῆς
  choice: በምድር ላይ
  rationale: የሰው ልጅ ምድራዊ ችሎታን የሚያመለክተውን አካባቢያዊ ሐረግ በቀጥታ ያስተላልፋል።
- source_word: οὐ δύναται οὕτως λευκᾶναι
  choice: እንዲህ ሊያነጣቸው አይችልም
  rationale: የችሎታ እጦትንና የነጭነቱን ደረጃ ያሳያል፤ «-አቸው» የሚለው ተውላጠ ስም በአማርኛ የግሱን ተሻጋሪነት ተፈጥሯዊ ለማድረግ ከዐውደ ንባቡ ተሟልቷል።
theological_decisions:
- issue: በመለወጥ ትዕይንት የታየው የልብሶቹ ሁኔታ
  choice: ልብሶቹ በሰው ችሎታ ሊደረስበት በማይቻል ሁኔታ ሲያንጸባርቁና እጅግ ነጭ ሲሆኑ በምስላዊ ቋንቋ መግለጽ
  alternative: «በክብር ብርሃን አንጸባረቁ» የሚል ገላጭ ሥነ መለኮታዊ ንባብ መጨመር
  rationale: ጥቅሱ የልብሶቹን የሚታይ ገጽታ ይገልጣል እንጂ እዚህ ላይ «ክብር» የሚል ትርጓሜ በግልጽ አይሰጥም፤ ስለዚህ ሥነ መለኮታዊ ትርጓሜው ከዐውደ ንባቡ እንዲወጣ ተትቷል።
