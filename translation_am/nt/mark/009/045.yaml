- from: እግርህም ቢያሰናክልህ፣ ቆርጠህ ጣለው። ሁለቱ እግሮችህ እያሉህ ወደ ገሃነም[a] ከመጣል፣ አንካሳ ሆነህ ወደ ሕይወት መግባት ይሻልሃል።
  to: እግርህም ቢያሰናክልህ፣ ቆርጠህ ጣለው። ሁለቱም እግሮችህ እያሉህ ወደ ገሃነም[a] መጣል ይልቅ፣ አንካሳ ሆነህ ወደ ሕይወት መግባት ይሻልሃል።
  rationale: The revision corrects the central voice and syntax error in the rendering of βληθῆναι, while retaining the source’s vivid imagery, its comparative force, and its unexpanded “life.” It also makes the “both feet” contrast slightly more idiomatic and brings the footnote into line with the English audit trail without identifying Gehenna simply with a generic afterlife term.
