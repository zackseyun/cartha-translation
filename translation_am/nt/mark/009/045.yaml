  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἐὰν ὁ πούς σου σκανδαλίζῃ σε, ἀπόκοψον αὐτόν· καλόν ἐστίν ⸀σε εἰσελθεῖν εἰς τὴν ζωὴν χωλὸν ἢ τοὺς δύο πόδας ἔχοντα βληθῆναι εἰς τὴν ⸀γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/045.yaml
  text: And if your foot causes you to stumble[a], cut it off. It is better for you to enter into life lame than, having both feet, to be thrown into Gehenna.
translation:
  language: am
  text: እግርህም ቢያሰናክልህ፣ ቆርጠህ ጣለው። ሁለቱም እግሮችህ እያሉህ ወደ ገሃነም[a] መጣል ይልቅ፣ አንካሳ ሆነህ ወደ ሕይወት መግባት ይሻልሃል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ገሃነም (hell)።” “ገሃነም” የሚለው የግሪኩ ቃል የሂኖምን ሸለቆ እና ከመለኮታዊ ፍርድ ጋር የተያያዙ ማስታወሻዎችን ያመለክታል።
    reason: የγέενναን ልዩ ታሪካዊ ማጣቀሻ ለማብራራት እና የተለመደውን አማራጭ ትርጉም ለማሳየት
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: ቢያሰናክልህ
  rationale: ‘ማሰናከል’ የመሰናከልንና የውድቀትን ምስል ይጠብቃል፤ ‘ኃጢአት ቢያሠራህ’ ከሚለው ይልቅ የግሪኩን ሰፊ ትርጉም አያጠብም።
- source_word: ἀπόκοψον αὐτόν
  choice: ቆርጠህ ጣለው
  rationale: ትእዛዙን የግሪኩን ኃይለኛና ግልጽ ምስል ሳያለዝብ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: καλόν ἐστίν ... ἢ
  choice: ከ... መግባት ይሻልሃል
  rationale: ከἢ ጋር ያለው ንጽጽር ‘ይሻላል’ የሚለውን ፈሊጣዊ ትርጉም ይፈልጋል።
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: ወደ ሕይወት መግባት
  rationale: የመግባትን ምስልና የ‘ሕይወት’ን ያልተስፋፋ አገላለጽ ይጠብቃል፤ ‘ዘላለማዊ’ የሚለው በግሪኩ ውስጥ ስለሌለ አልተጨመረም።
- source_word: χωλὸν
  choice: አንካሳ ሆነህ
  rationale: በእግርና በመራመድ ላይ ያለውን ጉዳት በትክክል ይገልጻል።
- source_word: τοὺς δύο πόδας ἔχοντα
  choice: ሁለቱ እግሮችህ እያሉህ
  rationale: ከአንካሳነት ጋር ያለውን ንጽጽር በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: βληθῆναι
  choice: ከመጣል
  rationale: የግሪኩን ተደራጊ አንቀጽ ‘መጣል’ በሚል ቀጥተኛና ግልጽ አገላለጽ ያስተላልፋል።
- source_word: γέενναν
  choice: ገሃነም
  rationale: ‘ገሃነም’ ከግሪኩ γέεννα ጋር የተያያዘውን ስም በአማርኛ የተለመደ ቅርጽ ይጠብቃል፤ አጠቃላይ የፍርድ ቃል ብቻ አድርጎ አይተካውም።
theological_decisions:
- issue: በፍርድ አውድ ውስጥ γέενναን መተርጎም
  choice: ገሃነም
  alternative: ሲኦል / የእሳት ስፍራ
  rationale: ግሪኩ አጠቃላይ የሙታን ዓለም ቃልን ሳይሆን γέενναን ይጠቀማል። ‘ገሃነም’ የቃሉን ልዩ ታሪካዊና የፍርድ ማስታወሻ ይጠብቃል።
- issue: σκανδαλίζῃ ኃጢአትን ወይም መውደቅን ብቻ ያመለክት እንደሆነ
  choice: ቢያሰናክልህ
  alternative: ኃጢአት ቢያሠራህ
  rationale: ምንጩ የመሰናከልን ምስል ይዞ ከኃጢአትና ከመውደቅ ጋር የሚያያዝ ሰፊ ትርጉም አለው፤ አንዱን ብቻ በግልጽ መወሰን አልተመረጠም።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ ነው። የግሪኩ ኃይለኛ ምስሎች አልለዘቡም፤ አማርኛው ተፈጥሯዊ እንዲሆን ግን የንጽጽሩ አወቃቀር ተስተካክሏል።
