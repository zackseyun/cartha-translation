review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately retains the metaphor of σκανδαλίζῃ, the forceful imperative to cut off the foot, the contrast between entering life lame and being thrown into Gehenna with both feet. However, “ከመጣል” is grammatically and semantically defective here: it means roughly “from throwing,” fails to express the passive βληθῆναι (“to be thrown”), and lacks the required agent-neutral passive sense.'
  naturalness: 'The opening and the first imperative are natural. The comparative sentence is understandable but is more idiomatic and clear with the infinitival alternatives kept parallel: “... መጣል ይልቅ ... መግባት ይሻልሃል.” “ሁለቱ እግሮችህ እያሉህ” is possible, but “ሁለቱም እግሮችህ እያሉህ” naturally conveys both feet.'
  terminology: “ማሰናከል,” “አንካሳ,” “ሕይወት,” and “ገሃነም” are appropriate. “ገሃነም” suitably preserves γέεννα rather than replacing it with “ሲኦል.” The footnote should also preserve the English audit trail’s familiar alternative, “ገሃነም (hell),” while explaining the historical allusion without overdefining it.
  issues:
  - severity: high
    issue: βληθῆναι is rendered “ከመጣል.”
    rationale: The Greek is an aorist passive infinitive, “to be thrown.” “ከመጣል” does not express passive voice and is syntactically unsuitable in the comparison. “ወደ ገሃነም መጣል” correctly conveys being thrown into Gehenna in Amharic’s agent-unspecified passive-compatible infinitival usage.
  - severity: low
    issue: The footnote omits the audit trail’s alternative rendering “hell.”
    rationale: The main text rightly uses “ገሃነም,” but the supplied English footnote explicitly gives “hell” as a familiar alternative. Adding it improves audit-trail alignment while retaining source specificity.
  revised_text: እግርህም ቢያሰናክልህ፣ ቆርጠህ ጣለው። ሁለቱም እግሮችህ እያሉህ ወደ ገሃነም[a] መጣል ይልቅ፣ አንካሳ ሆነህ ወደ ሕይወት መግባት ይሻልሃል።
