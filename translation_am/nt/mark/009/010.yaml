  yaml_path: translation/nt/mark/009/010.yaml
  text: And they kept the matter to themselves[b][a], discussing what it meant to rise from the dead.
translation:
  language: am
  text: እነርሱም ያንን ንግግር[a] ለራሳቸው ጠብቀው፣ «ከሙታን መነሣት»[b] ምን ማለት እንደሆነ ይወያዩ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ያንን ቃል» ወይም «ያንን አባባል»።
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ «ከሙታን መካከል መነሣት»።
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν λόγον
  choice: ይህን ንግግር
  rationale: λόγος እዚህ ኢየሱስ በቁጥር 9 የተናገረውን ንግግር ያመለክታል፤ «ይህን ንግግር» የማጣቀሻውን ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐκράτησαν
  choice: ይዘው
  rationale: κρατέω የመያዝን ወይም የማቆየትን ሐሳብ ይዟል፤ ከπρὸς ἑαυτούς ጋር ሲነበብ ንግግሩን ከራሳቸው ክበብ ውጭ እንዳላወጡት ያሳያል።
- source_word: πρὸς ἑαυτοὺς
  choice: በመካከላቸው
  rationale: ሐረጉ ጉዳዩን በራሳቸው መካከል እንዳቆዩትና ውይይታቸውም በዚያው ክበብ እንደነበር ያመለክታል።
- source_word: συζητοῦντες
  choice: ይወያዩ ነበር
  rationale: ቃሉ በጋራ መመርመርንና መወያየትን ያመለክታል፤ «ይከራከሩ» ከሚለው ይልቅ በጽሑፉ ያልተገለጸ ግጭት አያስገባም።
- source_word: τί ἐστιν
  choice: ምን ማለት እንደሆነ
  rationale: ቃል በቃል «ምን እንደሆነ» ቢሆንም፣ ደቀ መዛሙርቱ የንግግሩን ትርጉም ለመረዳት መወያየታቸውን ይህ አገላለጽ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τὸ ἐκ νεκρῶν ἀναστῆναι
  choice: ከሙታን መካከል መነሣት
  rationale: ἐκ νεκρῶν ቃል በቃል «ከሙታን መካከል» የሚል ሲሆን፣ መነሣት የትንሣኤን ሐሳብ በግልጽ ይጠብቃል።
theological_decisions:
- issue: ደቀ መዛሙርቱ ስለ ትንሣኤ የተወያዩበት አገላለጽ
  choice: ከሙታን መካከል መነሣት
  alternative: ከሙታን መነሣት
  rationale: «ከሙታን መካከል» የἐκ νεκρῶνን ቅርጽ በቅርብ ይጠብቃል፤ ደቀ መዛሙርቱ ትርጉሙን አለመረዳታቸውንም ሳይፈታ ይተዋል።
