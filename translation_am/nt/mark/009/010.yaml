review_pass:
  verdict: revise
  source_fidelity: The draft conveys the disciples' private retention of Jesus' statement and their discussion of resurrection. However, the wording for κρατέω with πρὸς ἑαυτούς is somewhat unclear in Amharic, and footnote b labels the main-text wording as a literal alternative even though it duplicates it.
  naturalness: “በመካከላቸው ይዘው” is intelligible but less idiomatic for keeping a saying to oneself/their own circle. “ለራሳቸው ጠብቀው” naturally expresses the sense without adding a stronger claim than the Greek requires.
  terminology: “ንግግር” appropriately renders λόγος here as Jesus' preceding statement. “ከሙታን መነሣት” is natural modern Amharic resurrection language; the more formally literal “ከሙታን መካከል መነሣት” belongs in the note.
  issues:
  - severity: low
    issue: The expression “በመካከላቸው ይዘው” is stylistically awkward for ἐκράτησαν πρὸς ἑαυτούς.
    rationale: It can sound like physically holding something among themselves rather than retaining the statement within their own circle. “ለራሳቸው ጠብቀው” is clearer and idiomatic.
  - severity: medium
    issue: Footnote b is internally redundant.
    rationale: The main text already reads “ከሙታን መካከል መነሣት,” while the footnote calls that identical wording literal. Moving the idiomatic rendering into the main text and the literal form into the note resolves the mismatch and preserves the lexical distinction.
  revised_text: እነርሱም ያንን ንግግር[a] ለራሳቸው ጠብቀው፣ «ከሙታን መነሣት»[b] ምን ማለት እንደሆነ ይወያዩ ነበር።
