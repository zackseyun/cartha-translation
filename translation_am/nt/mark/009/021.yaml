source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησεν τὸν πατέρα αὐτοῦ· Πόσος χρόνος ἐστὶν ὡς τοῦτο γέγονεν αὐτῷ; ὁ δὲ εἶπεν· ⸀Ἐκ παιδιόθεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/021.yaml
  text: And he asked his father[a], “How long has this been happening to him?” And he said, “From childhood.”
translation:
  language: am
  text: እርሱም አባቱን፣ “ይህ ከጀመረበት ምን ያህል ጊዜ ሆነ?” ብሎ ጠየቀ። አባቱም፣ “ከልጅነቱ ጀምሮ[a]” አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ገና ልጅ ከነበረበት ጊዜ ጀምሮ።”
    reason: የἘκ παιδιόθενን ትርጉም በሌላ ተፈጥሯዊ አገላለጽ የሚያቀርብ የቃላት አማራጭ።
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: ጠየቀው
  rationale: በዚህ ዐውደ ንባብ ቃሉ ተራና ቀጥተኛ ጥያቄን ያመለክታል፤ “ጠየቀው” ይህን በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: τὸν πατέρα αὐτοῦ
  choice: አባቱን
  rationale: αὐτοῦ በዐውዱ የታመመውን ልጅ ያመለክታል፤ “አባቱን” አጭርና ተፈጥሯዊ ነው።
- source_word: Πόσος χρόνος ἐστὶν ὡς
  choice: ምን ያህል ጊዜ ሆነው?
  rationale: የግሪኩ አነጋገር አንድ ሁኔታ ከጀመረበት ጊዜ እስከ አሁን ያለውን ቆይታ ይጠይቃል፤ ይህ አገላለጽ ትርጉሙን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τοῦτο γέγονεν αὐτῷ
  choice: ይህ ከደረሰበት
  rationale: ፍጹም ጊዜ ያለው γέγονεν ጀምሮ እስከ አሁን የቀጠለውን ሁኔታ ያሳያል፤ ከቆይታ ጥያቄው ጋር “ይህ ከደረሰበት” ይህን በግልጽ ያቀርባል።
- source_word: ὁ δὲ εἶπεν
  choice: አባቱም … አለ
  rationale: δέ እዚህ የትረካውን ቀጣይ እርምጃ ያመለክታል፤ የተናጋሪውን ማንነት ለግልጽነት በመድገም የአማርኛው አገላለጽ ተፈጥሯዊ ሆኗል።
- source_word: Ἐκ παιδιόθεν
  choice: ከልጅነቱ ጀምሮ ነው
  rationale: ἐκ ከ παιδιόθεν ጋር የሁኔታውን መነሻ በልጅነት ያደርጋል፤ “ከልጅነቱ ጀምሮ” ትክክለኛ፣ ግልጽና ዘመናዊ ነው።
