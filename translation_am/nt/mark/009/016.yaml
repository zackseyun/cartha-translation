  text: καὶ ἐπηρώτησεν ⸀αὐτούς· Τί συζητεῖτε πρὸς ⸀αὑτούς;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/016.yaml
  text: And he asked them[a], “What are you discussing with one another?”
translation:
  language: am
  text: እርሱም ጠየቃቸው፦ «እርስ በርሳችሁ ምን እየተወያያችሁ ነው?[a]»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እርስ በርሳችሁ ስለ ምን ትከራከራላችሁ?» ግሱ እንደ ዐውዱ መወያየትን፣ መከራከርን ወይም መነጋገርን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: ጠየቃቸው
  rationale: ቀጥተኛ ንግግርን በተፈጥሯዊ የአማርኛ ትረካ የሚያስገባ ሲሆን፣ በግሱ ውስጥ የሌለ ልዩ ጥንካሬ አይጨምርም።
- source_word: αὐτούς
  choice: -አቸው
  rationale: ተውላጠ ስሙን በአማርኛው ግስ ላይ በተለመደው የብዙ ቁጥር ተሳቢ ቅጥያ ይወክላል፤ ጥቅሱ ያልገለጸውን የተወሰነ ቡድን አያስገባም።
- source_word: Τί
  choice: ስለ ምን
  rationale: የውይይቱን ጉዳይ ወይም ርዕስ ይጠይቃል፤ እዚህ ላይ የምክንያት ‘ለምን’ አይደለም።
- source_word: συζητεῖτε
  choice: ትከራከራላችሁ
  rationale: ግሱ መወያየትን፣ መከራከርን ወይም ክርክርን ሊያመለክት ይችላል። በማርቆስ አውድ የጻፎችና የደቀ መዛሙርቱ ልውውጥ የክርክር መልክ ስላለው ‘ትከራከራላችሁ’ ተመርጧል፤ ሰፊው ትርጉም በማስታወሻ ተጠብቋል።
- source_word: πρὸς αὑτούς
  choice: እርስ በርሳችሁ
  rationale: በቡድኑ መካከል ያለውን የጋራ መስተጋብር በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: καὶ
  choice: እርሱም
  rationale: ድርጊቱን ከቀደመው ትረካ ጋር ያገናኛል፤ ‘ከዚያም’ የሚለውን ተጨማሪ ጊዜያዊ ትርጉም አያስገባም።
