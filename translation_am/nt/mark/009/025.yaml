  text: ἰδὼν δὲ ὁ Ἰησοῦς ὅτι ἐπισυντρέχει ὄχλος ἐπετίμησεν τῷ πνεύματι τῷ ἀκαθάρτῳ λέγων αὐτῷ· Τὸ ⸂ἄλαλον καὶ κωφὸν πνεῦμα⸃, ἐγὼ ⸂ἐπιτάσσω σοι⸃, ἔξελθε ἐξ αὐτοῦ καὶ μηκέτι εἰσέλθῃς εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/025.yaml
  text: But when Jesus saw that a crowd was quickly gathering[a], he rebuked the unclean spirit, saying to it, “You mute and deaf spirit, I command you, come out of him and never enter him again.”
translation:
  language: am
  text: ኢየሱስም ሕዝብ በፍጥነት እየተሰበሰበ መሆኑን ባየ ጊዜ፣[a] ርኩሱን መንፈስ ገሠጸው፤ “አንተ ዲዳና ደንቆሮ መንፈስ፣ እኔ አዝዝሃለሁ፤ ከእርሱ ውጣ፤ ከእንግዲህም ዳግመኛ ወደ እርሱ አትግባ!” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሕዝቡ እየሮጠ አንድ ላይ እንደሚሰበሰብ።” የግሪኩ ግስ ሰዎች በፍጥነት ከየአቅጣጫው ወደ አንድ ቦታ መሰባሰባቸውን ያመለክታል።
    reason: lexical_alternative
