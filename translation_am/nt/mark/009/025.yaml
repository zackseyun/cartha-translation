  rationale: በወንጌላት ውስጥ ኢየሱስ በመናፍስት ላይ የሚያሳየውን ሥልጣናዊ ተግሣጽ የሚገልጽ የተለመደ ቃል ነው።
- source_word: τῷ πνεύματι τῷ ἀκαθάρτῳ
  choice: ርኩሱን መንፈስ
  rationale: ἀκάθαρτος የሚያመለክተውን የርኩሰት ምድብ ይጠብቃል፤ ወደ ‘ክፉ መንፈስ’ በመቀየር የምንጩን ቃል አያሰፋም።
- source_word: Τὸ ἄλαλον καὶ κωφὸν πνεῦμα
  choice: አንተ ዲዳና ደንቆሮ መንፈስ
  rationale: ሁለቱን የተለያዩ ገላጮች—መናገር አለመቻልንና መስማት አለመቻልን—ጠብቆ ቀጥተኛውን አድራሻ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐγὼ ἐπιτάσσω σοι
  choice: እኔ አዝሃለሁ
  rationale: ἐγώ በግሪክ ግስ ውስጥ አስፈላጊ ባይሆንም በግልጽ መገኘቱ አጽንዖት ስላለው ‘እኔ’ ተጠብቋል፤ ἐπιτάσσω የሥልጣን ትእዛዝን ያመለክታል።
- source_word: ἔξελθε ἐξ αὐτοῦ
  choice: ከእርሱ ውጣ
  rationale: ቀጥተኛውን ትእዛዝና የመውጣት እንቅስቃሴ በአጭርና ግልጽ ቋንቋ ይጠብቃል።
- source_word: μηκέτι εἰσέλθῃς εἰς αὐτόν
  choice: ከእንግዲህም ዳግመኛ ወደ እርሱ አትግባ
  rationale: μηκέτι የወደፊቱን ዳግም መግባት በቆራጥነት የሚከለክል ሲሆን፣ ‘ከእንግዲህ’ እና ‘ዳግመኛ’ ይህን ኃይል በአማርኛ በግልጽ ያሳያሉ።
