  text: Καὶ ⸂ἐλθόντες πρὸς τοὺς μαθητὰς εἶδον⸃ ὄχλον πολὺν περὶ αὐτοὺς καὶ γραμματεῖς συζητοῦντας ⸂πρὸς αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/014.yaml
  text: And when they came to the disciples[a], they saw a large crowd around them, and scribes arguing with them.
translation:
  language: am
  text: 'እነርሱም ወደ ደቀ መዛሙርቱ በመጡ ጊዜ፣ በዙሪያቸው ብዙ ሕዝብና ከእነርሱ ጋር የሚከራከሩ[a] የሕግ መምህራን አዩ።


    [a] ወይም፣ “የሚወያዩ።” የግሪክኛው ግስ ውይይትን ወይም ክርክርን ሊያመለክት ይችላል፤ በዚህ አውድ ግን ክርክርን የሚያመለክት ይመስላል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የሚወያዩ።” የግሪክኛው ግስ ውይይትን ወይም ክርክርን ሊያመለክት ይችላል፤ በዚህ አውድ ግን ክርክርን የሚያመለክት ይመስላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: በመጡ ጊዜ
  rationale: የግሪክኛው የአኦሪስት አጋዥ ግስ ከዋናው ግስ ጋር ተያይዞ የድርጊቶቹን ቅደም ተከተል ያሳያል፤ ይህ አተረጓጎም በአማርኛ ተፈጥሯዊ ነው።
- source_word: πρὸς τοὺς μαθητάς
  choice: ወደ ደቀ መዛሙርቱ
  rationale: πρός ከተሳቢ ቅርጽ ጋር ወደ ሰዎች የሚደረግን እንቅስቃሴ ያመለክታል።
- source_word: εἶδον
  choice: አዩ
  rationale: በትረካው ውስጥ ቀላል ያለፈ ድርጊትን በቀጥታ ይገልጣል።
- source_word: ὄχλον πολύν
  choice: ብዙ ሕዝብ
  rationale: የተሰበሰበውን ሕዝብ ብዛት በተፈጥሯዊና በግልጽ አማርኛ ያሳያል።
- source_word: περὶ αὐτούς
  choice: በዙሪያቸው
  rationale: περί እዚህ የቦታ ግንኙነትን፣ ማለትም ሕዝቡ ደቀ መዛሙርቱን ከቦ መኖሩን ያመለክታል።
- source_word: γραμματεῖς
  choice: የሕግ መምህራን
  rationale: ቃሉ የአይሁድን የሕግ ባለሙያዎች ያመለክታል፤ “ጸሐፍት” በዘመናዊ አማርኛ ተራ ጸሐፊዎችን ሊያስብ ስለሚችል፣ የተግባራቸውን ትርጉም ግልጽ የሚያደርገው አገላለጽ ተመርጧል።
- source_word: συζητοῦντας
  choice: የሚከራከሩ
  rationale: ግሱ ውይይትንም ክርክርንም ሊያመለክት ቢችልም፣ የግጭት አውዱ ክርክርን ያመዝናል፤ የቃሉ ሰፊ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: πρὸς αὐτούς
  choice: ከእነርሱ ጋር
  rationale: ከσυζητέω ጋር ያለው πρός ከሰዎቹ ጋር በውይይት ወይም በክርክር መጋጠምን ያሳያል፤ ተውላጠ ስሙም በአውዱ ደቀ መዛሙርቱን ይመለከታል።
