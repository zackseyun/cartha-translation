  text: ἀλλὰ λέγω ὑμῖν ὅτι καὶ Ἠλίας ἐλήλυθεν, καὶ ἐποίησαν αὐτῷ ὅσα ⸀ἤθελον, καθὼς γέγραπται ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/013.yaml
  text: But I tell you that Elijah also has come[a], and they did to him whatever they wanted, just as it is written about him.
translation:
  language: am
  text: ነገር ግን እኔ እላችኋለሁ፤ ኤልያስ ደግሞ መጥቷል፤[a] የፈለጉትን ሁሉ አደረጉበት፥ ስለ እርሱ እንደተጻፈው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይህም ኤልያስ በመጥምቁ ዮሐንስ ማንነትና አገልግሎት አስቀድሞ መጥቷል ማለት ነው፤ ማርቆስ 9፥11–12ን ይመልከቱ፤ እንዲሁም ከማቴዎስ 11፥14፤ 17፥12–13 ጋር ያነጻጽሩ።
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλὰ
  choice: ነገር ግን
  rationale: ከደቀ መዛሙርቱ ግምት ጋር ያለውን ተቃርኖ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: λέγω ὑμῖν
  choice: እኔ እላችኋለሁ
  rationale: ቀጥተኛውን የንግግር ቅርጽና የብዙ ቁጥር ተናጋሪ ተቀባዮችን ይጠብቃል፤ እኔ የሚለውም የግሱን አጽንዖት በግልጽ ያቀርባል።
- source_word: ὅτι καὶ Ἠλίας ἐλήλυθεν
  choice: ኤልያስ ደግሞ መጥቷል
  rationale: ደግሞ καὶን ይወክላል፤ መጥቷል የፍጹም ጊዜውን የተጠናቀቀ መምጣትና አሁናዊ አግባብ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐποίησαν αὐτῷ
  choice: አደረጉበት
  rationale: ድርጊቱ በእርሱ ላይ መፈጸሙን በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል፤ ቀጣዩ ሐረግ ድርጊቱን ይወስናል።
- source_word: ὅσα ἤθελον
  choice: የፈለጉትን ሁሉ
  rationale: ያልተገደበውን ‘የፈለጉትን ማንኛውንም’ ትርጉም በአማርኛ የተለመደ አገላለጽ ያቀርባል።
- source_word: καθὼς γέγραπται
  choice: እንደተጻፈው
  rationale: መጽሐፍ ቅዱሳዊውን የጽሑፍ ጥቅስ ቀመር በታመቀና የተለመደ አማርኛ ይጠብቃል።
- source_word: ἐπ’ αὐτόν
  choice: ስለ እርሱ
  rationale: ከጽሑፍ ቀመሩ ጋር ἐπί የሚኖረውን ‘ስለ/በተመለከተ’ የሚል ዋና ትርጉም ይሰጣል፤ ‘በእርሱ ላይ’ ወይም ‘በእርሱ ላይ ተቃውሞ’ ብሎ አይወስነውም።
theological_decisions:
- issue: በዚህ ንግግር ውስጥ የኤልያስ ማንነት
  choice: በዋናው ጽሑፍ ‘ኤልያስ’ የሚለውን ያለ ትርጓሜያዊ መስፋፋት ማቆየት
  alternative: ኤልያስ በመጥምቁ ዮሐንስ አገልግሎትና ሚና መምጣቱን በዋናው ጽሑፍ በግልጽ መጨመር
  rationale: የግሪኩ ጽሑፍ ኤልያስን በስም ይጠራል። ዐውደ ንባቡ ንግግሩን ከመጥምቁ ዮሐንስ ጋር እንዲያያዝ ቢያደርግም፣ ይህን መለያ በትርጉሙ ውስጥ መጨመር የጽሑፉን የትርጓሜ ውጥረት ይፈታል፤ ስለዚህ በማስታወሻ ቀርቧል።
- issue: ἐπ’ αὐτόν የሚለው ሐረግ
  choice: ‘ስለ እርሱ’ ብሎ መተርጎም
  alternative: ‘በእርሱ ላይ/በእርሱ ላይ ተቃውሞ’ ብሎ መተርጎም
  rationale: ከγέγραπται ጋር ያለው አጠቃቀም ‘ስለ እርሱ’ የሚለውን ንባብ ይደግፋል፤ ነገር ግን ቅድመ አገናኙ በሌሎች ዐውዶች የተቃውሞ ስሜት ሊኖረው ስለሚችል አማራጩ ተመዝግቧል።
