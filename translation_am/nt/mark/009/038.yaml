base_translation:
  language: en
  yaml_path: translation/nt/mark/009/038.yaml
  text: John said to him[a], “Teacher, we saw someone casting out demons in your name, and we tried to stop him because he was not following us.”
translation:
  language: am
  text: ዮሐንስ እንዲህ አለው፦ “መምህር ሆይ፣ አንድ ሰው በስምህ አጋንንትን ሲያወጣ አየን፤ እኛን ስለማይከተልም ልናስቆመው ሞከርን።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እንከለክለው ነበር።” የግሪኩ ያልተፈጸመ ግስ ተደጋጋሚ ወይም የተሞከረ ድርጊትን ሊገልጽ ይችላል፤ ስለዚህ “ልናስቆመው ሞከርን” ተብሏል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔφη αὐτῷ ὁ Ἰωάννης
  choice: ዮሐንስም እንዲህ አለው
  rationale: የትረካውን ቀላል ያለፈ ጊዜ ንግግር በተፈጥሯዊ አማርኛ ያቀርባል፤ αὐτῷ በግሱ ውስጥ ‘አለው’ ተጠብቋል።
- source_word: Διδάσκαλε
  choice: መምህር ሆይ
  rationale: የግሪኩን ቀጥተኛ ትርጉምና የጥሪ አገባብ በክብር ያስተላልፋል።
- source_word: εἴδομέν τινα
  choice: አንድ ሰው ... አየን
  rationale: τινα የማይታወቅን ግለሰብ ያመለክታል፤ ‘አንድ ሰው’ በአማርኛ ተፈጥሯዊ ነው።
- source_word: ἐν τῷ ὀνόματί σου
  choice: በስምህ
  rationale: በኢየሱስ ስምና ሥልጣን መሥራትን የሚያመለክተውን መጽሐፍ ቅዱሳዊ አገላለጽ ይጠብቃል።
- source_word: ἐκβάλλοντα δαιμόνια
  choice: አጋንንትን ሲያወጣ
  rationale: የክፉ መናፍስትን ማስወጣት ተግባር በግልጽና በተለመደ የወንጌል ቃላት ይገልጻል።
- source_word: καὶ ἐκωλύομεν αὐτόν
  choice: ልናስቆመው ሞከርን
  rationale: ያልተፈጸመ ሙከራን ወይም ቀጣይ እገዳን ሊያመለክት የሚችለውን የግሪኩን ኢምፐርፌክት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὅτι οὐκ ἠκολούθει ἡμῖν
  choice: እኛን ይከተል ስላልነበር
  rationale: ἡμῖνን በቀጥታ ‘እኛን’ ብሎ ይጠብቃል፤ የደቀ መዛሙርቱን የቡድን አመለካከት ወደ ‘አንተን’ በመቀየር አያለሰልስም።
