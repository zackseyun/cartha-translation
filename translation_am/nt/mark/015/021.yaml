base_translation:
  language: en
  yaml_path: translation/nt/mark/015/021.yaml
  text: And they compelled a certain passerby[a], Simon of Cyrene, who was coming from the country, the father of Alexander and Rufus[c][b], to carry his cross.
translation:
  language: am
  text: ከገጠር[a] እየመጣ በዚያ እያለፈ የነበረውን፣ የእስክንድርና የሩፎስ አባት የሆነውን አንድ ቀሬናዊ ስምዖንን፣ መስቀሉን[c] እንዲሸከም አስገደዱት።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ከገጠር” የሚለው “ከእርሻ” ወይም “ከመስክ” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
