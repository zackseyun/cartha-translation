  rationale: ቀጥተኛ ነው፤ σῴζω ያለውን የማዳንና የመታደግ ስፋት እና የፌዙን ምፀት ይጠብቃል።
- source_word: ἑαυτὸν οὐ δύναται σῶσαι
  choice: ራሱን ማዳን አይችልም
  rationale: የችሎታ ክህደቱን በተፈጥሯዊ አማርኛ ያቀርባል፤ ከቀደመው “አዳነ” ጋር ያለውን የግስ ድግግሞሽም ይጠብቃል።
