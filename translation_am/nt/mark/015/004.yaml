  text: ὁ δὲ Πιλᾶτος πάλιν ⸀ἐπηρώτα αὐτὸν λέγων· Οὐκ ἀποκρίνῃ οὐδέν; ἴδε πόσα σου ⸀κατηγοροῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/004.yaml
  text: But Pilate again questioned him, saying, “Do you give no answer? Look how many charges they are bringing against you.”
translation:
  language: am
  text: ጲላጦስ ግን እንደገና፣ “ምንም መልስ አትሰጥምን? ምን ያህል ክስ እንደሚያቀርቡብህ ተመልከት!”[a] ብሎ ጠየቀው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ በቃል በቃል፦ “በስንት ነገር እንደሚከሱህ ተመልከት!”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ግን
  rationale: የትረካውን እድገት ከቀደመው ሁኔታ ጋር በቀላል ንፅፅር ያገናኛል።
- source_word: πάλιν
  choice: እንደገና
  rationale: የጲላጦስ ጥያቄ መደገሙን በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: ἐπηρώτα
  choice: ጠየቀው
  rationale: የግሪኩ ኢምፐርፌክት ቀጣይነትን ወይም ተደጋጋሚነትን ሊያመለክት ቢችልም፣ πάλιν መደገሙን ግልጽ ያደርገዋል፤ በዚህ ዐውድ ‘ጠየቀው’ ተፈጥሯዊና የፍርድ ምርመራውን ሳያጋንን ትክክለኛ ነው።
- source_word: λέγων
  choice: ብሎ
  rationale: በአማርኛ ንግግርን ከዋናው ግስ ጋር የሚያገናኝ ተፈጥሯዊ አገላለጽ ነው።
- source_word: Οὐκ ἀποκρίνῃ οὐδέν;
  choice: ምንም አትመልስምን?
  rationale: የኢየሱስን ዝምታ አጽንዖት የሚሰጠውን አሉታዊ ጥያቄ በቀጥታና ተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: ἴδε
  choice: እስቲ ተመልከት
  rationale: ትኩረትን ወደ ክሶቹ የሚጠራውን ትእዛዝ በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: πόσα
  choice: ስንት ነገር
  rationale: የግሪኩን ሰፊና ቃል በቃል ትርጉም ይጠብቃል፤ የመክሰስ ግሱ እነዚህ ነገሮች ክሶች መሆናቸውን በዐውዱ ግልጽ ያደርጋል።
- source_word: σου ... κατηγοροῦσιν
  choice: እንደሚከሱህ
  rationale: ከκατηγορέω ጋር ያለውን የተከሳሹን ግንኙነት በአማርኛው ቀጥተኛ ተሳቢ በተፈጥሯዊ ሁኔታ ይገልጣል፤ የአሁኑን ድርጊትም ያሳያል።
