  terminology: መሲሑ properly retains the titular, royal-anointed force of ὁ χριστός in this mocking context. የእስራኤል ንጉሥ and መስቀል are appropriate standard terms. ይሰድቡት ነበር suitably conveys ongoing reviling/insulting.
