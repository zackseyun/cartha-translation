  verdict: revise
  source_fidelity: The draft accurately represents the messianic-royal taunt, the command to come down from the cross, and the continuing reproach by those crucified with him. A small adjustment makes the paired Greek subjunctives in ἵνα ἴδωμεν καὶ πιστεύσωμεν more directly parallel in Amharic.
