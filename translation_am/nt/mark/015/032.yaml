id: MRK.15.32
reference: Mark 15:32
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ χριστὸς ὁ ⸀βασιλεὺς Ἰσραὴλ καταβάτω νῦν ἀπὸ τοῦ σταυροῦ, ἵνα ἴδωμεν καὶ ⸀πιστεύσωμεν. καὶ οἱ συνεσταυρωμένοι ⸀σὺν αὐτῷ ὠνείδιζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/032.yaml
  text: Let the Messiah[a], the King of Israel, come down now from the cross[b], so that we may see and believe.” And those who were crucified with him were also insulting him.
translation:
  language: am
  text: “መሲሑ[a]፣ የእስራኤል ንጉሥ፣ እኛ እናይና እንድናምን ከመስቀሉ አሁን ይውረድ!” ከእርሱ ጋር የተሰቀሉትም ይሰድቡት[b] ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ክርስቶስ።” የግሪኩ Χριστός በዚህ አውድ የተቀባውን ንጉሥ የሚያመለክት ማዕረግ ነው።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ “ይዘልፉት ነበር” ወይም “ይነቅፉት ነበር።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ χριστός
  choice: መሲሑ
  rationale: ቃሉ በዚህ አውድ እንደ ንጉሣዊ የተቀባ ማዕረግ በፌዝ የተነገረ ስለሆነ፣ በዘመናዊ አማርኛ የተለመደው ‘መሲሕ’ የሚለው ማዕረግ ተመርጧል።
- source_word: ὁ βασιλεὺς Ἰσραήλ
  choice: የእስራኤል ንጉሥ
  rationale: የግሪኩን የማዕረግ አገላለጽ በግልጽና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: καταβάτω νῦν ἀπὸ τοῦ σταυροῦ
  choice: አሁን ከመስቀሉ ይውረድ
  rationale: የሦስተኛ መደብ ትእዛዛዊውን የፌዝ ጥያቄና νῦν የሚያሳየውን አስቸኳይነት ያስቀምጣል።
- source_word: ἵνα ἴδωμεν καὶ πιστεύσωμεν
  choice: እኛ አይተን እንድናምን
  rationale: የἵναን የዓላማ አገላለጽና ‘ማየትና ማመን’ የሚለውን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: οἱ συνεσταυρωμένοι σὺν αὐτῷ
  choice: ከእርሱ ጋር የተሰቀሉት
  rationale: ፍጹም ተሳቢ አንቀጹንና ከኢየሱስ ጋር የመሰቀላቸውን ትርጉም ያለ ተጨማሪ ገለጻ ይጠብቃል።
- source_word: ὠνείδιζον αὐτόν
  choice: ይሰድቡት ነበር
  rationale: ያልተጠናቀቀው የግሪክ ግስ የሚያመለክተውን ቀጣይ ድርጊት ‘ነበር’ በሚለው አወቃቀር ያሳያል፤ ስድብ፣ ነቀፋና ዘለፋ የሚያካትተውን ኃይልም በቀላል ቋንቋ ያቀርባል።
theological_decisions:
- issue: Χριστός በፌዝ አውድ እንዴት እንደሚተረጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: Χριστός እዚህ እንደ ስም ሳይሆን ከ‘የእስራኤል ንጉሥ’ ጋር የተያያዘ የተቀባ ንጉሥ ማዕረግ ሆኖ ቀርቧል፤ ‘መሲሑ’ ይህን ንጉሣዊ-መሲሐዊ ኃይል ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የፌዙ ኃይል በትእዛዛዊው ‘ይውረድ’ እና በ‘አሁን’ ተጠብቋል፤ የቀጣይ ድርጊት ገጽታም ‘ይሰድቡት ነበር’ በሚለው ተገልጿል።
