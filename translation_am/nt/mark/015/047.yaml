  text: And Mary Magdalene and Mary the mother of Joses were watching where he was laid[a].
translation:
  language: am
  text: መግደላዊት ማርያምና የዮሴ[a] ማርያም እርሱ የተቀመጠበትን ስፍራ ይመለከቱ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ «የዮሴ ማርያም»። ግሪኩ ይህችን ማርያም ከዮሴ ጋር ባላት ግንኙነት ይለያታል፤ በአውዱ የዮሴ እናት ማለት ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: -ና
  rationale: በዚህ ስፍራ δέ ጠንካራ ተቃርኖን ሳይሆን የቀብሩን ትረካ በቀላሉ የሚያስቀጥል አያያዥ ነው፤ በአማርኛ ሁለቱን ስሞች በ«-ና» ማያያዝ ተፈጥሯዊ ቀጣይነቱን ያሳያል።
- source_word: Μαρία ἡ Μαγδαληνή
  choice: መግደላዊት ማርያም
  rationale: ይህ በዘመናዊ መደበኛ አማርኛ የተለመደው የስሙና የመገኛ መለያው አጠራር ነው።
- source_word: Μαρία ἡ Ἰωσῆτος
  choice: የዮሳ ማርያም
  rationale: ግሪኩ ማርያምን ከዮሳ ጋር ባላት ግንኙነት ይለያታል፣ ግን ግንኙነቱን በቀጥታ «እናት» ብሎ አይገልጽም። ይህ አተረጓጎም የምንጩን አሻሚነት ይጠብቃል።
- source_word: ἐθεώρουν
  choice: ይመለከቱ ነበር
  rationale: ያልተጠናቀቀው የግስ ጊዜ በቀድሞ ጊዜ የቀጠለ ምልከታን ያሳያል፤ «ይመለከቱ ነበር» ይህን ቆይታ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ποῦ
  choice: የት
  rationale: የቦታ ጥያቄያዊ ተውሳከ ግሱን ቀጥታና ተፈጥሯዊ በሆነ መንገድ ይወክላል።
- source_word: τέθειται
  choice: እንደተቀመጠ
  rationale: የፍጹም ጊዜ ተደራጊ ቅርጹ የመቀመጡን ድርጊትና የተገኘውን ሁኔታ ያመለክታል። በአማርኛ የግሱ ወንድ ነጠላ ቅርጽ ኢየሱስን በአውዱ ግልጽ ያደርጋል።
theological_decisions:
- issue: በተደራጊው ግስ ያልተጠቀሰው ባለቤት
  choice: በወንድ ነጠላው «እንደተቀመጠ» ኢየሱስን በአውዱ ማመልከት
  alternative: «አስከሬኑ የት እንደተቀመጠ» ብሎ ማብራራት
  rationale: ግሪኩ ባለቤቱን በግልጽ ባይጠቅስም አውዱ ኢየሱስን ያመለክታል። «እንደተቀመጠ» በአማርኛ በቂ ግልጽነት ይሰጣል፣ ኢየሱስንም «አስከሬን» ብሎ ከምንጩ በላይ አይገልጸውም።
- issue: ማርያም ከዮሳ ጋር ያላት ግንኙነት
  choice: «የዮሳ ማርያም» ብሎ ግንኙነቱን ሳይወስን መተርጎም
  alternative: «የዮሳ እናት ማርያም»
  rationale: የግሪኩ የባለቤትነት ቅርጽ ግንኙነትን ያሳያል፣ «እናት» የሚለውን ግን በቀጥታ አይጨምርም። በማርቆስ አውድ እናቱ መሆኗ የሚቻልና የተለመደ ግንዛቤ ቢሆንም፣ ዋናው ጽሑፍ አሻሚነቱን ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ቀጣይ ምልከታ በ«ይመለከቱ ነበር» ተጠብቋል፤ ከዮሳ ጋር ያለው ግንኙነት ደግሞ በዋናው ጽሑፍ ያለማስገደድ ቀርቧል።
