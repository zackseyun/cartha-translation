lexical_decisions:
- source_word: δὲ
  choice: ግን
  rationale: δὲ ለስላሳ አያያዥ ቢሆንም፣ በዚህ የትረካው ወሳኝ ነጥብ ላይ ያለውን የክስተት ለውጥና ንፅፅር በተፈጥሮ ያሳያል።
- source_word: ἀφεὶς
