  source_fidelity: The participial phrase is conveyed accurately by “ከፍ ባለ ድምፅ ጮኾ.” However, “የመጨረሻ እስትንፋሱን ተነፈሰ” is not idiomatic Amharic and uses ተነፈሰ (“breathed”) where the Greek ἐξέπνευσεν specifically evokes breathing out. “እስትንፋሱን አወጣ” preserves that imagery and naturally conveys death in context.
