  rationale: ከφωνὴν μεγάλην ጋር ሲገናኝ ድምፅን ማውጣት ወይም ጩኸትን መልቀቅ የሚለውን ፈሊጣዊ ትርጉም ያሳያል፤ ‘ጮኾ’ በአማርኛ አጭርና ተፈጥሯዊ ነው።
- source_word: φωνὴν μεγάλην
  choice: ከፍ ባለ ድምፅ
  rationale: φωνή ድምፅን፣ ጩኸትን ወይም የሰው ድምፅን ሊያመለክት ይችላል። μεγάλην እዚህ የድምፁን ከፍተኛነትና ኃይል ያሳያል፤ ‘ከፍ ባለ ድምፅ’ ይህን በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: ἐξέπνευσεν
  choice: የመጨረሻ እስትንፋሱን ተነፈሰ
  rationale: ግሱ ቃል በቃል እስትንፋስን ማውጣትን፣ በፈሊጣዊ አጠቃቀሙም መሞትን ያመለክታል። ይህ አተረጓጎም የእስትንፋስን ምስልና የንግግሩን ክብደት ሳያጠፋ ሞቱን በግልጽ ያስተላልፋል።
- source_word: ὁ δὲ Ἰησοῦς
  choice: ኢየሱስ ግን
  rationale: ከግለስም ጋር ያለው ὁ በአማርኛ ተለይቶ መተርጎም አያስፈልገውም፤ የδὲ ግንኙነት ‘ግን’ በሚለው ተጠብቋል።
theological_decisions:
- issue: የኢየሱስን ሞት ተጨማሪ ሥነ መለኮታዊ ፍቺ ሳይጨምሩ መተርጎም
  choice: የመጨረሻ እስትንፋሱን ተነፈሰ
