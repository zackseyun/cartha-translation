  alternative: ‘ሕዝቡን ደስ ለማሰኘት’ ወይም ‘ለሕዝቡ በቂ የሆነውን ለማድረግ’
  rationale: ‘ለማርካት’ የፖለቲካዊ ጫናውንና የሕዝቡን ጥያቄ የመፈጸም ሐሳብ ይጠብቃል፤ ጲላጦስ በቸርነት እንደሠራ ወይም ድርጊቱ ሞራላዊ ገለልተኛ እንደሆነ አያስመስልም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ካስገረፈው በኋላ’ ጲላጦስ ግርፋቱን ራሱ ከመፈጸሙ ይልቅ እንዲፈጸም ማዘዙን ያሳያል። የአንቀጹ ምልክቶች የድርጊቶቹን ቅደም ተከተል ግልጽ ያደርጋሉ።
