base_translation:
  language: en
  yaml_path: translation/nt/mark/015/015.yaml
  text: So Pilate[a], wanting to satisfy the crowd, released Barabbas to them; and after having Jesus flogged, he handed him over to be crucified.
translation:
  language: am
  text: ጲላጦስም ሕዝቡን ለማርካት[a] ፈልጎ በርባንን ፈታላቸው፤ ኢየሱስንም ካስገረፈው በኋላ እንዲሰቀል አሳልፎ ሰጠው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሕዝቡን ደስ ለማሰኘት።” ቃል በቃል፣ “ለሕዝቡ በቂ የሆነውን ለማድረግ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλόμενος
  choice: ፈልጎ
  rationale: የጲላጦስን ፍላጎትና ዓላማ በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል፤ ከጽሑፉ በላይ የሆነ ጥልቅ ውሳኔ አያስገባም።
- source_word: τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι
  choice: ሕዝቡን ለማርካት
  rationale: ግሪኩ ቃል በቃል ‘ለሕዝቡ በቂ የሆነውን ማድረግ’ የሚል ፈሊጥ ሲሆን፣ በዐውዱ የሕዝቡን ጥያቄ በመፈጸም ማርካትን ያመለክታል።
- source_word: ἀπέλυσεν
  choice: ፈታላቸው
  rationale: በፍርድ ዐውድ እስረኛን ነጻ መልቀቅን የሚገልጽ አጭርና ተፈጥሯዊ አማርኛ ነው፤ -ላቸው የሚለውም αὐτοῖςን ይወክላል።
- source_word: παρέδωκεν
  choice: አሳልፎ ሰጠው
  rationale: ኢየሱስን ለሌሎች ሥልጣንና እጅ አሳልፎ የመስጠትን ኃይል ይጠብቃል፤ በሕማማት ትረካውም ያለውን ጉልህ ትርጉም አያቃልልም።
- source_word: φραγελλώσας
  choice: ካስገረፈው በኋላ
  rationale: የግሪኩ የቀደመ ድርጊት ቅደም ተከተልና ጲላጦስ እንዲገረፍ ማዘዙን በአማርኛ ምክንያታዊ አደራረግ ያሳያል።
- source_word: ἵνα σταυρωθῇ
  choice: እንዲሰቀል
  rationale: የማስረከቡን ዓላማ በተፈጥሯዊ አማርኛ ይገልጣል፤ የግሪኩን ተደራጊ ቅርጽም ይጠብቃል።
- source_word: Βαραββᾶν
  choice: በርባን
  rationale: በአማርኛ የመጽሐፍ ቅዱስ ስም አጻጻፍ የተለመደውን ቅርጽ ይከተላል።
- source_word: Ἰησοῦν
  choice: ኢየሱስን
  rationale: በአማርኛ የተለመደውን የስሙን ቅርጽ ይጠቀማል፤ የተሳቢ ምልክት -ን ከግሱ አወቃቀር ጋር ያስማማል።
theological_decisions:
- issue: τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι ውስጥ የጲላጦስን ዓላማ መተርጎም
