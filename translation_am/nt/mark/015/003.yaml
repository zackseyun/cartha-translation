- source_word: κατηγόρουν
  choice: ይከሱት ነበር
  rationale: ያልተፈጸመው ያለፈ ጊዜ አኳኋን የቀጠለ ወይም የተደጋገመ ክስን ስለሚያመለክት፣ የአማርኛው ይህ አገላለጽ የቆይታውን ስሜት ይጠብቃል።
- source_word: αὐτοῦ
