  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ
  choice: እነርሱ
  rationale: በግሪኩ ስምን ተክቶ የቆመው ብዙ ቁጥር አመልካች ከቀደመው አውድ የሚታወቀውን ቡድን ያመለክታል፤ «እነርሱ» ይህን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: δὲ
  choice: ግን
  rationale: ቃሉ ከጲላጦስ ቀዳሚ ንግግር ጋር ያለውን መጠነኛ ንፅፅር ወይም የትረካ ሽግግር ያሳያል፤ «ግን» የንፅፅሩን ኃይል ሳያጋንን ያስተላልፋል።
- source_word: πάλιν
  choice: እንደገና
  rationale: ድርጊቱ መደገሙን በግልጽና በተለመደ አማርኛ ይገልጻል።
- source_word: ἔκραξαν
  choice: ጮኹ
  rationale: κράζω ከፍ ባለ ድምፅ መጮኽን ወይም ጩኸት ማሰማትን ያመለክታል፤ «ጮኹ» የድምፁን ኃይል በአጭርና በተፈጥሯዊ መንገድ ይጠብቃል።
- source_word: Σταύρωσον
  choice: ስቀለው
  rationale: ይህ ለጲላጦስ የተነገረ የሁለተኛ መደብ ነጠላ ቀጥተኛ ትእዛዝ ነው፤ «ስቀለው» ቀጥተኛነቱንና ኃይሉን ይጠብቃል።
- source_word: αὐτόν
  choice: -ው
  rationale: በ«ስቀለው» ላይ ያለው የተሳቢ ቅጥያ ኢየሱስን የሚያመለክተውን «እርሱን» በተፈጥሯዊ አማርኛ ይወክላል።
