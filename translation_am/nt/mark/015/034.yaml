base_translation:
  language: en
  yaml_path: translation/nt/mark/015/034.yaml
  text: And at the ninth hour Jesus cried out with a loud voice[a], “Eloi, Eloi, lema sabachthani?” which is translated, “My God, my God[c][b], for what reason have you forsaken me?”
translation:
  language: am
  text: በዘጠነኛውም ሰዓት ኢየሱስ በታላቅ ድምፅ፣ “ኤሎይ፣ ኤሎይ፣ ለማ ሳባክታኒ?”[a] ብሎ ጮኸ። ይህም ሲተረጎም፣ “አምላኬ፣ አምላኬ፣[b] ስለ ምን ተውኸኝ?”[c] ማለት ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎችና ብዙ የእንግሊዝኛ ትርጉም ባህሎች “ለማ” በሚለው ፈንታ “ላማ” የሚለውን ቅርጽ ያንጸባርቃሉ።
    reason: textual_variant
