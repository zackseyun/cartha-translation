  text: And the curtain of the temple was torn in two[b][a], from top to bottom.
translation:
  language: am
  text: የቤተ መቅደሱ[b] መጋረጃም[a] ከላይ እስከ ታች ለሁለት ተቀደደ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ ቃል በቤተ መቅደሱ ውስጥ የተንጠለጠለውን መጋረጃ ወይም መሸፈኛ ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: እዚህ «ቤተ መቅደስ» ተብሎ የተተረጎመው የግሪክ ቃል በተለይ የቤተ መቅደሱን ውስጠኛ መቅደስ ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: καταπέτασμα
  choice: መጋረጃ
  rationale: ቃሉ በቤተ መቅደሱ ውስጥ የተንጠለጠለውን መጋረጃ ያመለክታል። «መጋረጃ» በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ሲሆን ትርጓሜያዊ ምልክትነትን አይጨምርም።
- source_word: ναοῦ
  choice: የቤተ መቅደሱ
  rationale: ναός ከጠቅላላው የቤተ መቅደስ ግቢ ይልቅ የውስጠኛውን መቅደስ በተለይ ሊያመለክት ይችላል። «ቤተ መቅደስ» ግን በአማርኛ የታወቀና ተፈጥሯዊ ነው፤ ይህን የተለየ የቃል ክልል የግርጌ ማስታወሻው ይጠብቃል።
- source_word: ἐσχίσθη
  choice: ተቀደደ
  rationale: የግሪኩን የተደራጊ ቅርጽና የመቀደድ ግልጽ ምስል በቀጥታ ይጠብቃል።
- source_word: εἰς δύο
  choice: ለሁለት
  rationale: መጋረጃው ሁለት ክፍል መሆኑን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἀπ’ ἄνωθεν ἕως κάτω
  choice: ከላይ እስከ ታች
  rationale: የመቀደዱን አቅጣጫና ሙሉ ርዝመት በግልጽና ተፈጥሯዊ አነጋገር ያስተላልፋል።
- source_word: καὶ
  choice: -ም
  rationale: የግሪኩን ቀላል ትስስር በአማርኛ ተፈጥሯዊ በሆነው አያያዥ ቅጥያ ይገልጻል።
theological_decisions:
- issue: የቤተ መቅደሱ መጋረጃ መቀደድ ሊኖረው የሚችለው ምሳሌያዊ ትርጉም
  choice: ክስተቱን ብቻ በገላጭ ሁኔታ ማቅረብ፣ ምሳሌያዊ ትርጉሙን በዋናው ጽሑፍ አለመጨመር
  alternative: መቀደዱ ወደ እግዚአብሔር መቅረብን ወይም በቤተ መቅደሱ ሥርዓት ላይ ፍርድን እንደሚያመለክት በትርጉሙ ውስጥ መግለጽ
  rationale: ጥቅሱ ክስተቱን ይዘግባል እንጂ ምሳሌያዊ ትርጉሙን በግልጽ አይተረጉምም። ስለዚህ ሥነ መለኮታዊው ውጥረትና አሻሚነት ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የቃላት ቅደም ተከተል በአማርኛ ተፈጥሯዊ አገባብ ቀርቧል፤ የትስስር ቃሉ καὶ በ«-ም» ተወክሏል።
