- source_word: ἐπιγεγραμμένη
  choice: ተብሎ ተጽፎ ነበር
  rationale: ከἦν ጋር ያለው ፍጹም አጋዥ ቅርጽ ጽሑፉ ተጽፎ በቦታው መኖሩን ያሳያል፤ ይህ አገላለጽ በአማርኛ ተፈጥሯዊ ነው።
- source_word: βασιλεὺς
  choice: ንጉሥ
  rationale: በክሱ ጽሑፍ ውስጥ የተጠቀሰውን ንጉሣዊ ማዕረግ በቀጥታ ያስተላልፋል።
- source_word: Ἰουδαίων
  choice: አይሁድ
  rationale: በወንጌላት የሕማማት ትረካ የሚገኘውን የታወቀ የሕዝብ መጠሪያና የክስ ማዕረግ ይጠብቃል፤ ‘የይሁዳ ነዋሪዎች’ የሚለው አማራጭ በማስታወሻ ተጠቅሷል።
theological_decisions:
- issue: በመስቀሉ የክስ ጽሑፍ ውስጥ ያለው Ἰουδαίων አተረጓጎም
  choice: የአይሁድ
  alternative: የይሁዳ ነዋሪዎች
  rationale: ሐረጉ በወንጌላት የሕማማት ትረካ የተለመደውን የኢየሱስ ክስ/ማዕረግ ይገልጣል። ‘የአይሁድ’ የታወቀውን የሕዝብ መጠሪያ ይጠብቃል፤ ቃሉ በአንዳንድ አውዶች መልክዓ ምድራዊ ትርጉም ሊኖረው ስለሚችል አማራጩ በእግር ማስታወሻ ተቀምጧል።
