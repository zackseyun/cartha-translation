lexical_decisions:
- source_word: ἐπιγραφή
  choice: ጽሑፍ
  rationale: በመስቀሉ ላይ ወይም ከላዩ የተቀመጠውን የተጻፈ ማስታወቂያ በተፈጥሯዊና ሰፊ ትርጉም ያመለክታል።
- source_word: αἰτία
  choice: በእርሱ ላይ የቀረበውን ክስ
