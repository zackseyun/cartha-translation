  text: ὁ δὲ Πιλᾶτος ἀπεκρίθη αὐτοῖς λέγων· Θέλετε ἀπολύσω ὑμῖν τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/009.yaml
  text: But Pilate answered them[a], saying, “Do you want me to release to you the King of the Jews?”
translation:
  language: am
  text: ጲላጦስ ግን መልሶ፣ “የአይሁድ ንጉሥን[a] ልፈታላችሁ ትፈልጋላችሁ?” አላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የይሁዳውያን ንጉሥ።” Ἰουδαίων የሚለው የግሪክ ቃል “አይሁድ” ወይም “የይሁዳ ሰዎች” ማለት ሊሆን ይችላል፤ በሕማማት ትረካው ውስጥ ግን ይህ የተለመደ ማዕረግ ስለሆነ “የአይሁድ ንጉሥ” የሚለው ትርጉም ከአውዱ ጋር ይስማማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ግን
  rationale: በቀደመው ትረካ ላይ መጠነኛ ንፅፅርንና የትረካ ሽግግርን ያሳያል።
- source_word: ἀπεκρίθη αὐτοῖς λέγων
  choice: መልሶ፣ … አላቸው
  rationale: የግሪኩን የመልስ ሰጪነትና የንግግር መግቢያ ጠብቆ በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል።
- source_word: Θέλετε
  choice: ትፈልጋላችሁ?
  rationale: በዚህ አውድ የሕዝቡን ፍላጎት የሚጠይቅ ሲሆን፣ ይህ አገላለጽ ግልጽና የተለመደ ነው።
- source_word: ἀπολύσω ὑμῖν
  choice: ልፈታላችሁ
  rationale: የታሰረን ሰው ከእስር መልቀቅን ያመለክታል፤ የአማርኛው ጥምር ግስም ድርጊቱ ለእነርሱ እንደሚደረግ ይገልጻል።
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: የአይሁድን ንጉሥ
  rationale: በሕማማት ትረካው ውስጥ የሚደጋገመውን የፖለቲካ ማዕረግ በአማርኛ በተለመደው መልክ ያቀርባል።
theological_decisions:
- issue: τὸν βασιλέα τῶν Ἰουδαίων የሚለውን ማዕረግ መተርጎም
  choice: የአይሁድ ንጉሥ
  alternative: የይሁዳ አውራጃ ሰዎች ንጉሥ
  rationale: Ἰουδαῖοι ብሔራዊ ወይም ክልላዊ ማጣቀሻ ሊኖረው ቢችልም፣ በዚህ የሕማማት ትረካ ውስጥ የተለመደው የፖለቲካ ማዕረግ “የአይሁድ ንጉሥ” ነው። ይህ የተናጋሪውን ንግግር ያቀርባል እንጂ ተርጓሚው የጨመረው የእምነት ማረጋገጫ አይደለም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ቀላል የሆነ የትረካ ቋንቋ ተጠቅሟል። “መልሶ … አላቸው” የግሪኩን አወቃቀር ቃል በቃል ሳያደርግ ሙሉ ትርጉሙን ይጠብቃል።
