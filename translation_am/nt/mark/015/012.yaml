base_translation:
  language: en
  yaml_path: translation/nt/mark/015/012.yaml
  text: Pilate answered them again[a], “Then what do you want me to do with the one you call the king of the Jews?”
translation:
  language: am
  text: ጲላጦስም እንደገና መልሶ እንዲህ አላቸው፤ “እንግዲህ እናንተ የአይሁድ ንጉሥ የምትሉትን ሰው[a] ምን ላድርገው ትፈልጋላችሁ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እናንተ የአይሁድ ንጉሥ የምትሉትን።”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: እንደገና
  rationale: በቀጠለው ውይይት ውስጥ ጲላጦስ ዳግመኛ መናገሩን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἀποκριθεὶς ἔλεγεν
  choice: መልሶ … አላቸው
  rationale: የግሪኩን ተሳቢ አነጋገር ቃል በቃል ሳያደርግ፣ የመልስ ንግግር መሆኑንና የቀጥታ ንግግር መግቢያውን በተፈጥሯዊ የአማርኛ ትረካ ይገልጣል።
- source_word: Τί οὖν
  choice: እንግዲህ … ምን
  rationale: οὖν ከቀደመው የሕዝቡ ጥያቄ የሚከተለውን ድምዳሜ ስለሚያመለክት፣ ‘እንግዲህ’ የሐሳቡን ትስስር ይጠብቃል።
- source_word: θέλετε
  choice: ትፈልጋላችሁ
  rationale: በዚህ አውድ የሕዝቡን ፍላጎት ወይም ምርጫ በግልጽ ዘመናዊ አማርኛ ይገልጣል።
- source_word: ποιήσω
  choice: ላድርገው
  rationale: ከθέλετε ቀጥሎ ያለውን የአንደኛ መደብ ንዑስ አንቀጽ፣ ‘ምን ላድርገው ትፈልጋላችሁ?’ በሚለው ተፈጥሯዊ የአማርኛ አገባብ ያቀርባል።
- source_word: ὃν λέγετε
  choice: እናንተ … የምትሉትን ሰው
  rationale: አንጻራዊው አንቀጽ መጠሪያውን ለሕዝቡ አባባል እንደሚያስጠጋ ይጠብቃል፤ ‘እናንተ’ የሚለውም በግሪኩ ግስ ውስጥ ያለውን የሁለተኛ መደብ ብዙ ቁጥር አጽንዖት ግልጽ ያደርጋል።
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: የአይሁድ ንጉሥ
  rationale: በሕማማት ትረካው ያለውን መደበኛ የፖለቲካ ማዕረግ በቀጥታ ያስተላልፋል።
theological_decisions:
- issue: የጲላጦስ አነጋገር የኢየሱስን ንግሥና እንደሚያረጋግጥ ወይስ የሕዝቡን መጠሪያ ብቻ እንደሚያንጸባርቅ
