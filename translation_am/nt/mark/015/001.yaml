id: MRK.15.1
reference: Mark 15:1
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς πρωῒ συμβούλιον ποιήσαντες οἱ ἀρχιερεῖς μετὰ τῶν πρεσβυτέρων καὶ γραμματέων καὶ ὅλον τὸ συνέδριον δήσαντες τὸν Ἰησοῦν ἀπήνεγκαν καὶ ⸀παρέδωκαν Πιλάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/001.yaml
  text: And immediately[a], early in the morning, the chief priests held a consultation with the elders and scribes and the whole council; then they bound Jesus, led him away, and handed him over to Pilate.
translation:
  language: am
  text: ወዲያውም፣ ማለዳ ላይ፣ ዋና ካህናቱ ከሽማግሌዎቹና ከጸሐፍቱ ጋር፣ ማለትም ከመላው ሸንጎ[a] ጋር፣ ተማከሩ፤ ከዚያም ኢየሱስን አስረው ወሰዱትና ለጲላጦስ አሳልፈው ሰጡት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሳንሄድሪን።” የግሪኩ ቃል συνέδριον የአይሁድን የበላይ ምክር ሸንጎ ያመለክታል።
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθὺς
  choice: ወዲያውም
  rationale: የማርቆስን የተጣደፈ ትረካ ይጠብቃል፤ በዘመናዊ አማርኛም ተፈጥሯዊ ነው።
- source_word: πρωῒ
  choice: ማለዳ
  rationale: ድርጊቱ በጠዋት ቀደም ብሎ መፈጸሙን በአጭርና ተፈጥሯዊ አነጋገር ያሳያል።
- source_word: συμβούλιον ποιήσαντες
  choice: ተማከሩ
  rationale: የግሪኩን የጋራ ምክክር ፈሊጣዊ አገላለጽ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀρχιερεῖς
  choice: ዋና ካህናቱ
  rationale: ቃሉ አንድ ሊቀ ካህን ብቻ ሳይሆን የካህናትን መሪዎች በብዙ ቁጥር ያመለክታል።
- source_word: πρεσβυτέρων
  choice: ሽማግሌዎቹ
  rationale: በዚህ የአስተዳደር አውድ የታወቁ የሕዝብ መሪዎችን ያመለክታል።
- source_word: γραμματέων
  choice: ጸሐፍት
  rationale: ለዚህ የአይሁድ ሕግ ባለሙያዎች ባህላዊና ግልጽ የአማርኛ ቃል ነው።
- source_word: ὅλον τὸ συνέδριον
  choice: መላው ሸንጎ
  rationale: ታሪካዊውን የአይሁድ የበላይ ምክር ሸንጎ ትርጉም ያስተላልፋል፤ “ሳንሄድሪን” የሚለው ቅጽ በማስታወሻ ተጠብቋል።
- source_word: δήσαντες
  choice: አስረው
  rationale: ኢየሱስን ከመውሰዳቸው በፊት ማሰራቸውን ቀጥተኛና ግልጽ በሆነ ቃል ይገልጣል።
- source_word: ἀπήνεγκαν
  choice: ወሰዱት
  rationale: በጥበቃ ሥር ከቦታው እንዳስወገዱት ያሳያል፤ በአማርኛ “ተሸክመው” የሚል ያልተፈለገ ስሜት አያስገባም።
- source_word: παρέδωκαν
  choice: አሳልፈው ሰጡት
  rationale: በፍርድና በጥበቃ አውድ ኢየሱስን ለሮማዊው ባለሥልጣን አስረክበው መስጠታቸውን ያሳያል።
- source_word: Πιλάτῳ
  choice: ጲላጦስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደው የስሙ ቅጽ ነው።
theological_decisions:
- issue: የσυνέδριον ማጣቀሻ
  choice: በዋናው ጽሑፍ “መላው ሸንጎ” ተብሎ ተተርጉሟል።
  alternative: “መላው ሳንሄድሪን”
  rationale: ትርጉሙን ለዘመናዊ አንባቢ ግልጽ ለማድረግ ተቋሙ ተተርጉሟል፤ የታሪካዊው ስያሜ ቅጽ ግን በማስታወሻ ቀርቧል።
- issue: በሕማማቱ ትረካ ውስጥ የπαρέδωκαν ኃይል
  choice: “አሳልፈው ሰጡት” ተብሎ በፍርዳዊና በጥበቃ ሥር የማስረከብ ትርጉም ተገልጧል።
  alternative: “አስረከቡት”
  rationale: ቃሉ በሕማማቱ ትረካ ሰፊ ክብደት ቢኖረውም፣ በዚህ ቁጥር ከጽሑፉ በላይ የሆነ ዶክትሪናዊ ፍቺ ሳይጨመር ለሮማዊ ሥልጣን መሰጠቱ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የአማርኛ አገላለጽ ተጠቅሟል። የግሪኩ ተከታታይ ድርጊቶች በ“ከዚያም” እና በተያያዙ ግሶች ተፈጥሯዊ ሆነው ቀርበዋል። በቀረበው የእንግሊዝኛ ጽሑፍ [a] ከ“immediately” ቀጥሎ ቢታይም የማስታወሻው ይዘት συνέδριονን ስለሚመለከት፣ ምልክቱ ከ“ሸንጎ” ቀጥሎ በትክክለኛው ቦታ ተቀምጧል።
