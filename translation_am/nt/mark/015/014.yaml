lexical_decisions:
- source_word: ἔλεγεν
  choice: እያለ ይጠይቃቸው ነበር
  rationale: የግሪኩ ኢምፐርፌክት ጊዜ ቀጣይ ወይም ተደጋጋሚ ንግግርን ሊያመለክት ስለሚችል፣ ይህ አገላለጽ ጲላጦስ ጥያቄውን እያቀረበ እንደነበር ያሳያል።
- source_word: Τί γὰρ ἐποίησεν κακόν
  choice: ለምን? ምን ክፉ ነገር አደረገ?
  rationale: γάρ በዚህ አውድ የጥያቄውን ምክንያታዊ ኃይል ይጨምራል፤ “ለምን?” የሚለው ተፈጥሯዊ በሆነ አማርኛ ይህን ያሳያል፣ “ምን ክፉ ነገር” ደግሞ κακόνን ይጠብቃል።
- source_word: κακόν
  choice: ክፉ ነገር
  rationale: የቃሉን ሕጋዊና ሥነ ምግባራዊ ክብደት ሳያለዝብ በዘመናዊ አማርኛ በተፈጥሮ ይገልጣል።
- source_word: περισσῶς
  choice: ከዚህ ይበልጥ
  rationale: የሕዝቡ ጩኸት እየበረታ መሄዱን የሚያሳይ የንጽጽር ማጠናከሪያ ነው።
- source_word: ἔκραξαν
  choice: ጮኹ
  rationale: κράζω ከፍ ባለ ድምፅ የሚነገርን የሕዝብ ጩኸት ያመለክታል፤ “ጮኹ” አጭር፣ ግልጽና ኃይለኛ ነው።
- source_word: Σταύρωσον αὐτόν
  choice: ስቀለው!
  rationale: የግሪኩን ቀጥተኛ የትእዛዝ ቅርጽና የሕዝቡን አስቸኳይ ጥያቄ ይጠብቃል።
- source_word: δὲ
  choice: ግን
  rationale: በሁለቱም አረፍተ ነገሮች ያለውን ተቃርኖ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Πιλᾶτος
  choice: ጲላጦስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የስም ቅርጽ ይከተላል።
theological_decisions:
- issue: በጲላጦስ ጥያቄ ውስጥ κακόν ያለው የሥነ ምግባር ክብደት
  choice: “ክፉ ነገር” ተብሎ ተተርጉሟል።
  alternative: “በደል” ወይም “ጥፋት”
  rationale: “ክፉ ነገር” የቃሉን ሥነ ምግባራዊ ኃይል ይጠብቃል፤ በተመሳሳይም ጽሑፉ በግልጽ ያልወሰነውን የሕግ ምድብ አይጨምርም።
- issue: የγάρ ትርጉምና የጲላጦስ ጥያቄ ቅርጽ
  choice: “ለምን? ምን ክፉ ነገር አደረገ?”
  alternative: “ምን ክፉ ነገር አደረገ?”
  rationale: “ለምን?” የሚለው γάρ የሚያመጣውን ምክንያታዊና ተቃዋሚ ኃይል በአማርኛ ያስተላልፋል፤ የጥያቄውን የሕግና የሥነ ምግባር ውጥረትም አያስወግድም።
