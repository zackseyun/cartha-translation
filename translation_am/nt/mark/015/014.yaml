    text: ወይም፣ “ምን በደል አደረገ?”
    reason: lexical_alternative
  revision_rationale: The revision removes the added and redundant ‘asking’ from the translation of ἔλεγεν while retaining its ongoing imperfect sense. It also makes the intensified response of περισσῶς more idiomatic in modern standard Amharic. No theological or interpretive content has been added.
