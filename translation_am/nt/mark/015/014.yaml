base_translation:
  language: en
  yaml_path: translation/nt/mark/015/014.yaml
  text: But Pilate was saying to them[a], “For what evil has he done?” But they cried out all the more, “Crucify him!”
translation:
  language: am
  text: ጲላጦስ ግን፣ “ለምን? ምን ክፉ ነገር አደረገ?” ይላቸው ነበር።[a] እነርሱ ግን ይበልጥ፣ “ስቀለው!” ብለው ጮኹ።
  philosophy: optimal-equivalence
  footnotes:
