base_translation:
  language: en
  yaml_path: translation/nt/mark/015/024.yaml
  text: And they crucify him and divide his garments among themselves[a], casting lots for them to decide what each would take.
translation:
  language: am
  text: እርሱንም ይሰቅሉታል፤ ማን ምን እንደሚወስድ ለመወሰን በልብሶቹ ላይ ዕጣ እየጣሉ፣ ልብሶቹን ይከፋፈሏቸዋል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በልብሶቹ ላይ ዕጣ እየጣሉ፣ ማን ምን እንደሚወስድ ለማወቅ።»
    reason: የἐπ’ αὐτὰ τίς τί ἄρῃን አወቃቀር እና የዕጣ መጣሉን ዓላማ/ውጤት በአማራጭ አገላለጽ ለማሳየት።
lexical_decisions:
- source_word: σταυροῦσιν
  choice: ይሰቅሉታል
  rationale: የግሪኩን ታሪካዊ የአሁን ጊዜ አገላለጽ በአማርኛ የአሁን ጊዜ ቅርጽ በመጠበቅ የማርቆስን ሕያው የትረካ አቀራረብ ያስተላልፋል።
- source_word: διαμερίζονται
  choice: ይከፋፈሏቸዋል
  rationale: ግሱ አንድን ነገር ለብዙ ሰዎች በክፍል መመደብን ያመለክታል፤ ተሳቢውን የሚያመለክተው -አቸው ልብሶቹን በግልጽ ይመልሳል።
- source_word: ἱμάτια
  choice: ልብሶቹን
  rationale: የሚለበሱ ነገሮችን በተፈጥሯዊና በዘመናዊ አማርኛ የሚገልጽ ቀጥተኛ ምርጫ ነው።
- source_word: βάλλοντες κλῆρον
  choice: ዕጣ በመጣል
  rationale: የግሪኩን የዕጣ አሰጣጥ ፈሊጥ በአማርኛ የተለመደውን አገላለጽ በመጠቀም ያስተላልፋል።
- source_word: ἐπ’ αὐτὰ
  choice: በልብሶቹ ላይ
  rationale: ተውላጠ ስሙ የሚመለከተውን ልብሶች በግልጽ መድገም በአማርኛ የዓረፍተ ነገሩን ግንኙነት ያቀልላል፤ የላይ ግንኙነቱም የዕጣውን ጉዳይ ያመለክታል።
- source_word: τίς τί ἄρῃ
  choice: እያንዳንዳቸው ምን እንደሚወስዱ ለመወሰን
  rationale: የτίς τίን አከፋፋይ ኃይል—ማን የትኛውን እንደሚያገኝ—በተፈጥሯዊ አማርኛ ያብራራል፤ ዕጣው ውጤቱን እንደሚወስንም ያሳያል።
theological_decisions:
