  rationale: ይህ የእምነት ትርጓሜ ሳይሆን የትረካ አቀራረብ ጉዳይ ነው። ማርቆስ የሚጠቀምበትን ሕያው ታሪካዊ የአሁን ጊዜ መጠበቅ የግሪኩን የንግግር ቅርጽ ያንጸባርቃል።
