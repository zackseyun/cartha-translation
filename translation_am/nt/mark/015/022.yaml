base_translation:
  language: en
  yaml_path: translation/nt/mark/015/022.yaml
  text: And they bring him to the place Golgotha[a], which is translated, “Place of a Skull.”
translation:
  language: am
  text: እርሱንም ወደ ጎልጎታ ስፍራ አመጡት፤ ትርጉሙም “የራስ ቅል ስፍራ”[a] ማለት ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “የራስ ቅል ስፍራ።” በግሪክኛው አገላለጽ “ራስ ቅል” ከተወሰነ አመልካች ጋር ስላልቀረበ፣ “የአንድ ራስ ቅል ስፍራ” ወይም “የራስ ቅሉ ስፍራ” ተብሎ ሊገባ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: φέρουσιν
  choice: አመጡት
  rationale: በትረካ ውስጥ ያለውን ታሪካዊ የአሁን ጊዜ በተፈጥሯዊ የአማርኛ አወራረድ በኃላፊ ጊዜ ያቀርባል፤ ተሸክመውት እንደሄዱ ሳያስገድድ ወደ መድረሻው ማምጣታቸውን ይገልጣል።
- source_word: ἐπὶ τὸν Γολγοθᾶν τόπον
  choice: ጎልጎታ ወደሚሉት ስፍራ
  rationale: ἐπί ከተሳቢ ጋር ወደ መድረሻ የሚደረግን እንቅስቃሴ ያመለክታል። በአማርኛ የቦታውን ስምና τόπονን በተፈጥሯዊ ሁኔታ ለማቆየት “ጎልጎታ ወደሚሉት ስፍራ” ተመርጧል፤ “የሚሉት” በግሪኩ የተጨመረ መጠሪያ ሐረግ ሳይሆን በአማርኛ የስምና የ‘ስፍራ’ ተዛምዶን ተፈጥሯዊ ለማድረግ የገባ ነው።
- source_word: Γολγοθᾶν
  choice: ጎልጎታ
  rationale: የቦታው ትክክለኛ ስም በአማርኛ የተለመደውን ፊደል አጻጻፍ ተከትሎ በድምፅ ተጽፏል።
- source_word: μεθερμηνευόμενον
  choice: ትርጉሙም … ማለት ነው
  rationale: ቃሉ ስሙ ወደ ሌላ አገላለጽ መተርጎሙን ያሳያል። ይህ አገላለጽ የትርጉምን ተግባር ግልጽ አድርጎ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: Κρανίου Τόπος
  choice: የራስ ቅል ስፍራ
  rationale: የግሪኩን የዝምድና አወቃቀር በአማርኛ የ‘የ-’ አገባብ ያስተላልፋል፤ በግሪኩ የተወሰነ አመልካች አለመኖሩንም በግድ “አንድ” ወይም “ያ” በማከል አይወስንም።
