  text: καὶ ἔτυπτον αὐτοῦ τὴν κεφαλὴν καλάμῳ καὶ ἐνέπτυον αὐτῷ, καὶ τιθέντες τὰ γόνατα προσεκύνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/019.yaml
  text: And they were striking his head with a reed and spitting on him[a], and kneeling down they were bowing down to him.
translation:
  language: am
  text: እነርሱም ራሱን በሸምበቆ ይመቱትና ይተፉበት ነበር፤ ተንበርክከውም ይሰግዱለት[a] ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ያመልኩት ነበር።» የግሪኩ ግስ «በፊት መስገድን፣» «ክብር መስጠትን» ወይም «ማምለክን» ሊያመለክት ይችላል፤ እዚህ ግን ወታደሮቹ ለንጉሥ የሚሰጠውን ክብር በፌዝ ሲያስመስሉ የፈጸሙትን ድርጊት ይገልጻል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτυπτον
  choice: ይመቱት ነበር
  rationale: የግሪኩ ያልተፈጸመ ጊዜ (imperfect) ድርጊቱ በተደጋጋሚ ወይም ቀጣይነት እንደተፈጸመ ያሳያል፤ ይህ አተረጓጎም ያንን ገጽታ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: αὐτοῦ τὴν κεφαλήν
  choice: ራሱን
  rationale: የግሪኩን የባለቤትነት አገላለጽ በተፈጥሯዊና ግልጽ አማርኛ ያቀርባል።
- source_word: καλάμῳ
  choice: በሸምበቆ
  rationale: κάλαμος በዋናነት ሸምበቆን ወይም ከሸምበቆ የተሠራ በትርን ያመለክታል፤ «ሸምበቆ» የትረካውን ቁሳዊ ምስል ሳይጨምር ይጠብቃል።
- source_word: ἐνέπτυον αὐτῷ
  choice: ይተፉበት ነበር
  rationale: የተደጋጋሚውን ወይም ቀጣዩን ድርጊት የሚያሳየውን imperfect ቅርጽ ይጠብቃል፤ «በ» የሚለው የአማርኛ ግስ አያያዝ ወደ እርሱ መትፋታቸውን በተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: τιθέντες τὰ γόνατα
  choice: ተንበርክከው
  rationale: ቃል በቃል «ጉልበቶችን ማኖር» የሚለው ፈሊጥ መንበርከክን ያመለክታል፤ «ተንበርክከው» ትርጉሙን በዘመናዊ አማርኛ በግልጽ ይሰጣል።
- source_word: προσεκύνουν αὐτῷ
  choice: ይሰግዱለት ነበር
  rationale: προσκυνέω በፊት መውደቅን፣ ክብር መስጠትን ወይም ማምለክን ሊያመለክት ይችላል። «መስገድ» የአካላዊውን ድርጊትና የቃሉን ሰፊ የትርጉም ክልል ይጠብቃል፤ ዐውዱ ደግሞ ድርጊቱ የፌዝ ንጉሣዊ ክብር እንደሆነ ያሳያል።
theological_decisions:
- issue: በፌዝ ዐውድ ውስጥ προσκυνέωን መተርጎም
  choice: ይሰግዱለት ነበር
  alternative: ያመልኩት ነበር፤ በፊቱ ይደፉ ነበር
  rationale: «ይሰግዱለት ነበር» የወታደሮቹን የፌዝ የንጉሥ ክብር ትዕይንት ያሳያል፣ በቅን ልቦና እያመለኩት ነበር የሚል የነገረ መለኮት ድምዳሜም አያስገባም። ቢሆንም የግሪኩ ግስ «ማምለክ» የሚለውን ትርጉምም ሊይዝ ስለሚችል ይህ አማራጭ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «ይመቱት… ይተፉበት… ይሰግዱለት ነበር» የሚለው አወቃቀር የግሪኩን ቀጣይና ተደጋጋሚ ድርጊት ይጠብቃል።
