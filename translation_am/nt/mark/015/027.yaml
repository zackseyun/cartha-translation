  text: καὶ σὺν αὐτῷ σταυροῦσιν δύο λῃστάς, ἕνα ἐκ δεξιῶν καὶ ἕνα ἐξ εὐωνύμων ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/027.yaml
  text: And with him they crucify two robbers[a], one at his right and one at his left.
translation:
  language: am
  text: ከእርሱም ጋር ሁለት ወንበዴዎችን[a]፣ አንዱን በቀኙ አንዱንም በግራው ይሰቅላሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ዘራፊዎች”፤ ቃሉ ፖለቲካዊ ፍቺ እንዳለው ከተወሰደ፣ “ዓመፀኞች” ማለትም ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺν αὐτῷ
  choice: ከእርሱም ጋር
  rationale: σύν ከዳቲቭ ጋር አብሮነትን ያመለክታል፤ ይህ አተረጓጎም ቀጥተኛና በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: σταυροῦσιν
  choice: ይሰቅላሉ
  rationale: የአሁን ጊዜ ንቁ አመልካች ሦስተኛ መደብ ብዙ ቁጥር ነው። ማርቆስ በትረካው የሚጠቀምበትን ታሪካዊ አሁን ጊዜ ለማቆየት “ይሰቅላሉ” ተመርጧል። በዚህ የስቅለት ዐውድ ቃሉ በመስቀል ላይ መስቀልን ያመለክታል።
- source_word: δύο λῃστάς
  choice: ሁለት ወንበዴዎችን
  rationale: λῃστής ዘራፊን፣ ወንበዴን ወይም በአንዳንድ ዐውዶች ዓመፀኛን ሊያመለክት ይችላል። “ወንበዴዎች” የቃሉን ሰፊ ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ያልተገለጸ ፖለቲካዊ ትርጉምም አያስገባም።
- source_word: ἕνα ἐκ δεξιῶν
  choice: አንዱን በቀኙ
  rationale: ἐκ δεξιῶν በዚህ የቦታ ዐውድ በቀኝ በኩል መቀመጥን ያመለክታል። “በቀኙ” ከሚከተለው “በግራው” ጋር ተመጣጣኝና አጭር ነው።
- source_word: ἕνα ἐξ εὐωνύμων αὐτοῦ
  choice: አንዱንም በግራው
  rationale: εὐώνυμος እዚህ ግራ በኩልን የሚያመለክት ቃል ነው። αὐτοῦ ወደ ኢየሱስ ይመለሳል፤ “በግራው” ይህን በግልጽና ተፈጥሯዊ መንገድ ይገልጣል።
theological_decisions:
- issue: በስቅለቱ ታሪክ ውስጥ λῃσταί የሚለውን መተርጎም
  choice: ወንበዴዎች
  alternative: ዘራፊዎች፤ ምናልባትም ዓመፀኞች
  rationale: ቃሉ ጠበኛ ዘራፊዎችን ወይም ወንበዴዎችን ሊያመለክት ሲችል፣ በአንዳንድ ዐውድ ከፖለቲካዊ ዓመፅ ጋርም ሊያያዝ ይችላል። ይህ ቁጥር ብቻውን “ዓመፀኞች” የሚለውን የተወሰነ ንባብ አያስገድድም፤ ስለዚህ ዋናው ጽሑፍ ሰፊውን ትርጉም ይይዛል፣ ሌሎች አማራጮችም በማስታወሻ ተጠብቀዋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የማርቆስ ታሪካዊ አሁን ጊዜ “ይሰቅላሉ” በሚል ተጠብቋል፤ የλῃστής የትርጉም ስፋትም በግርጌ ማስታወሻ ተመዝግቧል።
