  choice: የተናጋሪዎቹን ቃል “ኤልያስን እየጠራ ነው” ብሎ ብቻ ማቅረብ
  alternative: “ኤልያስ እንዲረዳው እየጠራ ነው” ብሎ የተሳሳተ ግንዛቤያቸውን በትርጉሙ ውስጥ ማብራራት
  rationale: የግሪኩ ጽሑፍ ሰዎቹ ያሉትን ይዘግባል እንጂ ተራኪው የተሳሳተ ግንዛቤያቸውን በማብራሪያ አይጨምርም። ስለዚህ ዐውዱ የሚያሳየው ውጥረት ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር አማርኛ ተጠቅሟል። “እነሆ” የትኩረት ጥሪውን ይጠብቃል፤ “ይሉ ነበር” ደግሞ የἔλεγονን ቀጣይ ገጽታ ያንጸባርቃል።
