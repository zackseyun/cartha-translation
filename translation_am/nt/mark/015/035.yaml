  text: በዚያም ቆመው ከነበሩት አንዳንዶቹ ይህን ሰምተው፣ “እነሆ፣ ኤልያስን እየጠራ ነው[a]” ይሉ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ኤልያስ እንዲመጣ እየጠራ ነው።”
    reason: lexical_alternative
lexical_decisions:
- source_word: καί
