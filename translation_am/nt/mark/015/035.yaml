- source_word: ἔλεγον
  choice: ይሉ ነበር
  rationale: የግሪኩን ያልተጠናቀቀ ወይም ቀጣይ የንግግር ገጽታ ሳያጋንን ይገልጣል።
- source_word: Ἴδε
  choice: እነሆ
  rationale: ትኩረትን የሚስብ ቀጥተኛ አነጋገር ሲሆን በክቡር ነገር ግን ተረዳሽ አማርኛ ይሰማል።
- source_word: Ἠλίαν
  choice: ኤልያስን
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የነቢዩን ስም ይጠቀማል።
- source_word: φωνεῖ
  choice: እየጠራ ነው
  rationale: የአሁን ጊዜውን ቀጣይ ገጽታ በተፈጥሯዊ አማርኛ ያቀርባል፤ ግሱ ኤልያስን በስም መጥራትን ወይም እንዲመጣ መጣራትን ሊያመለክት የሚችለውን ክፍትነት ይጠብቃል።
theological_decisions:
