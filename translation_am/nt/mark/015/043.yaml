  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ተከታታይ ቦዝ አንቀጾች የአማርኛን ተፈጥሯዊ ፍሰት እንዲከተሉ ተደርገዋል፤ የአጽንዖትና የድፍረት ሐሳቦች ግን ተጠብቀዋል።
