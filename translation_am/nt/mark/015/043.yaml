  text: ⸀ἐλθὼν Ἰωσὴφ ⸀ὁ ἀπὸ Ἁριμαθαίας εὐσχήμων βουλευτής, ὃς καὶ αὐτὸς ἦν προσδεχόμενος τὴν βασιλείαν τοῦ θεοῦ, τολμήσας εἰσῆλθεν πρὸς ⸀τὸν Πιλᾶτον καὶ ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/043.yaml
  text: Joseph of Arimathea[a], a respected council member who was himself also waiting for the kingdom of God[d][c][b], boldly went in to Pilate and asked for the body of Jesus.
translation:
  language: am
  text: ከአርማትያ የመጣው ዮሴፍ፣ የተከበረ የምክር ቤት አባልና እርሱም ራሱ የእግዚአብሔርን መንግሥት ይጠባበቅ የነበረ፣ ደፍሮ[a] ወደ ጲላጦስ ገባና የኢየሱስን አካል ጠየቀ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ወደ ጲላጦስ ለመግባት ደፍሮ» ተብሎም ሊተረጎም ይችላል፤ የግሪኩ አገላለጽ ዮሴፍ ወደ ጲላጦስ ለመቅረብ ያሳየውን ድፍረት ያጎላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: ወደ ጲላጦስ ገባና
  rationale: የመምጣቱ ሐሳብ በዋናው የእንቅስቃሴ ግስ ውስጥ ተካትቷል፤ በአማርኛ «መጥቶ ... ገባ» ማለት እዚህ አላስፈላጊ ድግግሞሽ ይፈጥራል።
- source_word: ὁ ἀπὸ Ἁριμαθαίας
  choice: ከአርማትያስ የሆነው
  rationale: ἀπό የሚያመለክተውን የትውልድ ወይም የመገኛ ስፍራ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: εὐσχήμων
  choice: የተከበረ
  rationale: ቃሉ የማኅበራዊ ክብርና መልካም ስም ያለውን ሰው ያመለክታል፤ «የተከበረ» በዘመናዊ አማርኛ ግልጽና ክብር ያለው ነው።
- source_word: βουλευτής
  choice: የምክር ቤት አባል
  rationale: የአንድ ገዢ ምክር ቤት አባልነትን በግልጽ ይገልጻል፤ የግሪኩ ቃል ራሱ ስሙን በቀጥታ ስለማይጠቅስ «ሸንጎ» የሚለውን ልዩ መጠሪያ አልጨመረም።
- source_word: ὃς καὶ αὐτὸς
  choice: እርሱ ራሱም
  rationale: καὶ αὐτός ያለውን አጽንዖት በተፈጥሯዊ የአማርኛ አገላለጽ ይጠብቃል።
- source_word: ἦν προσδεχόμενος
  choice: ይጠባበቅ ነበር
  rationale: ቀጣይነት ያለውን ተስፋና መጠበቅ የሚገልጸውን የግሪኩን የተዋሃደ የግስ ቅርጽ ያንጸባርቃል።
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: የእግዚአብሔርን መንግሥት
  rationale: የወንጌላትን ዋና ሐረግ በቀጥታና በተለመደ መንገድ ያስተላልፋል።
- source_word: τολμήσας
  choice: ደፍሮ
  rationale: ዮሴፍ ጲላጦስን ለመቅረብ ያሳየውን ድፍረት በአጭርና ተፈጥሯዊ ቃል ይገልጻል።
- source_word: εἰσῆλθεν πρὸς τὸν Πιλᾶτον
  choice: ወደ ጲላጦስ ገባና
  rationale: εἰσῆλθεν ያለውን የመግባት ሐሳብና πρὸς ያለውን አቅጣጫ ይጠብቃል፤ ወደ ጲላጦስ ፊት መግባቱን ያመለክታል።
- source_word: ᾐτήσατο
  choice: ጠየቀ
  rationale: በዐውዱ ውስጥ አካሉን እንዲሰጡት መጠየቁን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: የኢየሱስን ሥጋ
  rationale: የግሪኩን የባለቤትነት ግንኙነት በቀጥታ ያስተላልፋል፤ «ሥጋ» በመጽሐፍ ቅዱሳዊ ዐውድ የሞተውን አካል ለማመልከት የተለመደና ክብር ያለው ነው።
theological_decisions:
- issue: የዮሴፍ ማንነትና βουλευτής የሚያመለክተው ምክር ቤት
  choice: «የምክር ቤት አባል» ተብሎ በአጠቃላይ ተተርጉሟል።
  alternative: «የአይሁድ ሸንጎ አባል»
  rationale: በታሪካዊው ዐውድ የአይሁድን ሸንጎ ሊያመለክት ቢችልም፣ የግሪኩ ቃል ሸንጎውን በስም አይጠቅስም፤ ስለዚህ ዋናው ጽሑፍ ከምንጩ የበለጠ ልዩነት አያስገባም።
- issue: የτολμήσας ኃይል
  choice: «ደፍሮ» ተብሎ የድፍረት ትርጉሙ ተጠብቋል።
  alternative: «ለመግባት ድፍረት አድርጎ»
  rationale: ጽሑፉ ጲላጦስን መቅረቡ ድፍረት እንደጠየቀ ያጎላል፤ «ደፍሮ» ይህን ኃይል ያለ ከባድ አገላለጽ ያስተላልፋል።
- issue: σῶμα በሞት ዐውድ የሚኖረው ትርጉም
  choice: «ሥጋ»
  alternative: «አስከሬን» ወይም «አካል»
  rationale: «አስከሬን» ሞቱን ግልጽ ቢያደርግም ከσῶμα የበለጠ ትርጓሜ ሊጨምር ይችላል፤ «ሥጋ» የምንጩን ቀጥተኛነትና የታሪኩን ክብር ይጠብቃል።
