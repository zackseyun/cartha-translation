  text: δραμὼν δέ ⸂τις καὶ⸃ γεμίσας σπόγγον ὄξους ⸀περιθεὶς καλάμῳ ἐπότιζεν αὐτόν, λέγων· Ἄφετε ἴδωμεν εἰ ἔρχεται Ἠλίας καθελεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/036.yaml
  text: Then someone ran[a], filled a sponge with sour wine, put it on a reed, and gave him a drink, saying, “Leave him alone[b]. Let us see whether Elijah is coming to take him down.”
translation:
  language: am
  text: ከዚያም አንድ ሰው ሮጦ ስፖንጁን በኮምጣጣ የወይን ጠጅ[a] ሞላ፤ በሸምበቆ ላይ አድርጎም ሊያጠጣው ነበር፤ እንዲህም አለ፦ “ተዉት፤[b] ኤልያስ ሊያወርደው ይመጣ እንደሆነ እንይ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ኮምጣጣ የወይን ጠጅ” ማለት ርካሽና አሲዳማ የሆነ የወይን መጠጥ ነው፤ በዘመናችን ለምግብ የሚውለውን ኮምጣጤ ብቻ አያመለክትም።
    reason: cultural_note
  - marker: b
    text: ወይም፣ “ቆዩ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: δραμὼν
  choice: ሮጦ ሄደና
  rationale: የግሪኩ የቀደመ ድርጊት ተከታዩን ድርጊት እንደሚያስከትል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τις καὶ
  choice: አንድ ሰው
  rationale: τις ያልተጠቀሰ ግለሰብን ያመለክታል፤ καί በዚህ አወቃቀር ለብቻው ‘ደግሞ’ ተብሎ መተርጎም አያስፈልግም።
- source_word: γεμίσας σπόγγον ὄξους
  choice: ስፖንጅ በኮምጣጣ ወይን ጠጅ ሞላ
  rationale: ὄξος ርካሽና አሲዳማ የወይን መጠጥን ያመለክታል፤ ‘ኮምጣጣ ወይን ጠጅ’ ከዘመናዊ የምግብ ኮምጣጤ ጋር እንዳይምታታ ያደርጋል።
- source_word: περιθεὶς καλάμῳ
  choice: በሸምበቆም ላይ አድርጎ
  rationale: κάλαμος በትክክል ሸምበቆን ያመለክታል፤ ስፖንጁን ከፍ ለማድረግ በሸምበቆው ላይ መደረጉን ያሳያል።
- source_word: ἐπότιζεν αὐτόν
  choice: እንዲጠጣ ሰጠው
  rationale: በአማርኛ የማጠጣት ድርጊቱን ተፈጥሯዊ በሆነ አነጋገር ይገልጣል፤ የግሪኩ ኢምፐርፌክት የቀጣይ ወይም የተሞከረ ድርጊት ገጽታ በዐውዱ ክፍት ሆኖ ይቆያል።
- source_word: Ἄφετε
  choice: ተዉት
  rationale: ቀጥተኛውን ‘እርሱን ተዉት/አትንኩት’ የሚለውን ትርጉም ይጠብቃል፤ ‘ቆዩ’ የሚለው ዐውዳዊ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ἴδωμεν εἰ ἔρχεται Ἠλίας
  choice: ኤልያስ … ይመጣ እንደሆነ እንይ
  rationale: የመፈተሽና የመጠበቅን ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ውጤቱን አይወስንም።
- source_word: καθελεῖν αὐτόν
  choice: ከመስቀሉ ሊያወርደው
  rationale: በስቅለት ዐውድ καθαιρέω ከፍ ካለበት ማውረድን ያመለክታል፤ ‘ከመስቀሉ’ የሚለው በዐውዱ የተገለጠውን ቦታ በአማርኛ ግልጽ ያደርጋል።
theological_decisions:
- issue: Ἄφετε የሚለው የተናጋሪው ትእዛዝ ዓላማ
  choice: ሌሎቹ ለጊዜው ኢየሱስን እንዲተዉት የሚሰጥ ትእዛዝ፣ ኤልያስ ጣልቃ ይገባ እንደሆነ ለማየት
  alternative: “ቆዩ” ወይም “እስቲ” የሚል ፈሊጣዊ ትርጉም
  rationale: ዋናው ጽሑፍ የἀφίημιን ቀጥተኛ ሐሳብ ይጠብቃል፤ ፈሊጣዊው አማራጭ ግን አሻሚነቱን ላለማጥፋት በማስታወሻ ተሰጥቷል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ስፖንጅ’ በዘመናዊ አማርኛ የታወቀ ቃል ሲሆን ‘ሸምበቆ’ የκάλαμοςን ልዩ ምስል ይጠብቃል።
