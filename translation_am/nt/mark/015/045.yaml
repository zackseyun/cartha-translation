lexical_decisions:
- source_word: γνοὺς
  choice: ካወቀ በኋላ
  rationale: የግሪኩ የአኦሪስት አሳታፊ ግስ ከመቶ አለቃው መረጃውን ከሰጠ በኋላ ጲላጦስ የፈጸመውን ቀጣይ ድርጊት ያሳያል፤ «ካወቀ በኋላ» ይህን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: ἀπὸ τοῦ κεντυρίωνος
  choice: ከመቶ አለቃው
  rationale: ἀπό ከዘርፍ አገባብ ጋር የመረጃውን ምንጭ ያመለክታል። «መቶ አለቃ» ታሪካዊውን የሮማ ወታደራዊ ማዕረግ በታወቀ የአማርኛ ቃል ይገልጣል።
- source_word: ἐδωρήσατο
  choice: እንዲሰጥ ፈቀደ
  rationale: δωρέομαι በዚህ አውድ ጲላጦስ አስከሬኑ ለዮሴፍ እንዲለቀቅ በሥልጣኑ መፍቀዱን ያመለክታል፤ ይህ አገላለጽ ከተራ «ሰጠ» ይልቅ ይፋዊውን ፈቃድ በግልጽ ያሳያል።
- source_word: πτῶμα
  choice: አስከሬኑን
  rationale: πτῶμα የሞተ ሰውን አካል በግልጽ ያመለክታል። «አስከሬን» ትክክለኛ፣ የተለመደና ለትረካው የሚስማማ ነው፤ ተለዋጭ አገላለጹ በማስታወሻ ቀርቧል።
- source_word: τῷ Ἰωσήφ
  choice: ለዮሴፍ
  rationale: የግሪኩ ዳቲቭ አገባብ የተፈቀደለትን ተቀባይ ያመለክታል።
