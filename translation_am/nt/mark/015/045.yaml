review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the temporal sequence, the centurion as Pilate’s source of information, and πτῶμα as a corpse. However, «እንዲሰጥ ፈቀደ» makes the giving potentially the action of an unstated third party, whereas ἐδωρήσατο directly describes Pilate’s act of granting/giving the body to Joseph.
  naturalness: «ከመቶ አለቃው ከሰማ በኋላ» is more idiomatic in this context than «ከመቶ አለቃው ካወቀ በኋላ». The revised wording is clear, modern standard Amharic while retaining a dignified narrative register.
  terminology: «መቶ አለቃ» appropriately represents the Roman centurion, and «አስከሬን» accurately expresses πτῶμα. «ሰጠ» directly renders the official grant without introducing an additional agent.
  issues:
  - severity: medium
    issue: The verb phrase «እንዲሰጥ ፈቀደ» is syntactically ambiguous about who would give the body.
    rationale: The Greek verb ἐδωρήσατο has Pilate himself as subject and Joseph as recipient. A direct active verb better preserves this relation.
  - severity: low
    issue: «ከመቶ አለቃው ካወቀ በኋላ» is less natural than using «ከሰማ» for receiving information from an officer.
    rationale: The source leaves the content learned unstated; «ከሰማ» naturally preserves that ellipsis and the source relation.
  revised_text: እርሱም ከመቶ አለቃው ከሰማ በኋላ፣ አስከሬኑን[a] ለዮሴፍ ሰጠው።
  revised_footnotes:
