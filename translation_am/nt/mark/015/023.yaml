lexical_decisions:
- source_word: ἐδίδουν
  choice: ይሰጡት ነበር
  rationale: ያልተፈጸመውን የግሪክ ኢምፐርፌክት ገጽታ ይጠብቃል፤ በትርጉም ደረጃ ‘ያቀርቡለት ነበር’ ሊባልም ይችላል።
- source_word: ἐσμυρνισμένον οἶνον
  choice: ከርቤ የተቀላቀለበትን ወይን ጠጅ
  rationale: የσμυρνίζωን ትርጉምና የተጨመረውን ንጥረ ነገር በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὃς δὲ
  choice: እርሱ ግን
  rationale: ὃς በዚህ ስነ አገባብ ወደ ኢየሱስ የሚመልስ አገላለጽ ነው፤ δέ ያለውን መጠነኛ ንጽጽር ‘ግን’ ይጠብቃል።
- source_word: ἔλαβεν
  choice: አልወሰደውም
  rationale: λαμβάνω ያለውን ‘መውሰድ/መቀበል’ መሠረታዊ ትርጉም በቀጥታ ያቀርባል፤ የነገሩ ተውላጠ ስም በአማርኛው ግስ ውስጥ ተካትቷል።
theological_decisions:
- issue: ኢየሱስ መጠጡን ያልወሰደበት ምክንያት
  choice: ድርጊቱን ብቻ መግለጽ፤ ምክንያት አለመጨመር
  alternative: ሥቃዩን ለማደንዘዝ የቀረበለትን መጠጥ እንደ拒否 መተርጎም፣ ወይም ልማዳዊ መጠጥን ለሌላ ምክንያት እንዳልተቀበለ መግለጽ
  rationale: የግሪክ ጽሑፉ የከርቤ ወይን ጠጅ እንደቀረበለትና እንዳልወሰደው ብቻ ይናገራል፤ የእምቢታውን ምክንያት አይገልጽም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ይሰጡት ነበር’ የድርጊቱን ቀጣይነት ወይም ሙከራ ይጠብቃል፤ የὃς δὲ ሰዋሰዋዊ ባሕርይ በተፈጥሯዊው ‘እርሱ ግን’ ተተርጉሟል።
