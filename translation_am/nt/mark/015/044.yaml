    text: ወይም፣ “ሞቶ ለተወሰነ ጊዜ እንደቆየ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμασεν
  choice: ተገረመ
  rationale: የጲላጦስን ድንጋጤ በተፈጥሯዊና በዘመናዊ አማርኛ ይገልጻል።
- source_word: εἰ ἤδη τέθνηκεν
  choice: ኢየሱስ ቀድሞውኑ መሞቱን
  rationale: εἰ በዚህ ስፍራ ቀጥተኛ ያልሆነ ጥያቄን ቢያስተዋውቅም፣ ከ‘ተገረመ’ ጋር ይህ አገላለጽ ተፈጥሯዊ ነው፤ ቀድሞውኑ ደግሞ ἤδηን ያሳያል። በግሪኩ ተውላጠ ስም ብቻ ያለ ቢሆንም፣ ግልጽነት ሲባል ‘ኢየሱስ’ ተጠቅሷል።
- source_word: προσκαλεσάμενος
  choice: ጠርቶ
  rationale: ጲላጦስ ከመጠየቁ በፊት መቶ አለቃውን ወደ እርሱ እንዳስጠራ በአጭርና ተፈጥሯዊ መንገድ ያሳያል።
- source_word: κεντυρίωνα
  choice: የመቶ አለቃውን
  rationale: የሮማውያንን ወታደራዊ ማዕረግ በመጽሐፍ ቅዱሳዊ አማርኛ የተለመደና ለአንባቢ ግልጽ በሆነ ቃል ይገልጻል።
- source_word: ἐπηρώτησεν αὐτόν
  choice: ጠየቀው
  rationale: ዋናውን ‘ጠየቀው’ የሚለውን ትርጉም በቀጥተኛና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: εἰ πάλαι ἀπέθανεν
  choice: ከሞተ ጊዜ እንዳለፈ
  rationale: πάλαι በዚህ አውድ ፍጹም ‘ከረጅም ጊዜ በፊት’ ሳይሆን፣ ከሞተ የተወሰነ ጊዜ አልፎ እንደሆነ መጠየቁን ያሳያል።
