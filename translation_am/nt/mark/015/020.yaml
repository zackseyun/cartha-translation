  source_fidelity: 'The Amharic accurately represents the sequence and force of the Greek: mockery, removal of the purple clothing, restoration of his own clothes, and taking him out for the purpose of crucifixion. The Greek historical present ἐξάγουσιν is idiomatically rendered with Amharic past narration, without loss of meaning.'
