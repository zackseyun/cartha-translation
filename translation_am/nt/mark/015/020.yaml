  terminology: “ሐምራዊውን ልብስ” responsibly makes explicit the garment understood in the Greek and in the preceding context. “የራሱን ልብሶች” preserves the emphasis of τὰ ἴδια, and “በመስቀል ላይ ሊሰቅሉት” precisely conveys crucifixion and the purpose clause. Both footnote anchors are correctly placed and their notes are accurate.
