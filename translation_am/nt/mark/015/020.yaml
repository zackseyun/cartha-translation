source:
  edition: SBLGNT
  text: καὶ ὅτε ἐνέπαιξαν αὐτῷ, ἐξέδυσαν αὐτὸν τὴν πορφύραν καὶ ἐνέδυσαν αὐτὸν τὰ ἱμάτια ⸂τὰ ἴδια⸃. καὶ ἐξάγουσιν αὐτὸν ἵνα ⸀σταυρώσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/020.yaml
  text: And when they had mocked him, they stripped the purple robe off him and put his own clothes on him. And they lead him out to crucify him.
translation:
  language: am
  text: 'እርሱንም ካፌዙበት በኋላ፣ ሐምራዊውን ልብስ[a] አውልቀውለት የራሱን ልብሶች አለበሱት። ከዚያም በመስቀል ላይ ሊሰቅሉት[b] ወደ ውጭ ወሰዱት።


    [a] ወይም፣ “ሐምራዊውን መጎናጸፊያ።” የግሪኩ ጽሑፍ በቀጥታ “ሐምራዊውን” ብቻ ይላል፤ የልብሱ ዓይነት ከአውዱ ይገባል።

    [b] ወይም፣ “በመስቀል ላይ እንዲሰቅሉት።” የግሪኩ አገላለጽ የድርጊቱን ዓላማ ያሳያል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሐምራዊውን መጎናጸፊያ።” የግሪኩ ጽሑፍ በቀጥታ “ሐምራዊውን” ብቻ ይላል፤ የልብሱ ዓይነት ከአውዱ ይገባል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በመስቀል ላይ እንዲሰቅሉት።” የግሪኩ አገላለጽ የድርጊቱን ዓላማ ያሳያል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: ካፌዙበት
  rationale: ግሱ የንቀት ፌዝን ያመለክታል፤ “አፌዙበት” በዘመናዊ አማርኛ ተፈጥሯዊና ከትረካው ክብደት ጋር የሚስማማ ነው።
- source_word: ἐξέδυσαν αὐτὸν τὴν πορφύραν
  choice: ሐምራዊውን ልብስ አውልቀውለት
  rationale: ግሱ ከሰው ላይ ልብስን ማውለቅ ያመለክታል፤ የግሪኩ “ሐምራዊውን” በአውዱ የተገነዘበውን ልብስ በግልጽ አማርኛ ያቀርባል።
- source_word: τὰ ἱμάτια τὰ ἴδια
  choice: የራሱን ልብሶች
  rationale: τὰ ἴδια የግል ባለቤትነቱን ያጎላል፤ “የራሱን” ይህን አጽንዖት ይጠብቃል።
- source_word: ἐξάγουσιν
  choice: ወደ ውጭ ወሰዱት
  rationale: በግሪክ ያለው ታሪካዊ የአሁን ጊዜ በአማርኛ ትረካ ተፈጥሯዊ በሆነ ያለፈ ጊዜ ተተርጉሟል፤ ትርጉሙም እርሱን ይዘው ወደ ውጭ ማውጣታቸውን ይጠብቃል።
- source_word: ἵνα σταυρώσωσιν αὐτόν
  choice: በመስቀል ላይ ሊሰቅሉት
  rationale: ἵνα ከንዑስ አንቀጹ ጋር ዓላማን ያሳያል፤ “ሊሰቅሉት” ይህን በተፈጥሯዊ አማርኛ ያቀርባል፣ “በመስቀል ላይ” ደግሞ የሞቱን ዓይነት በትክክል ይገልጻል።
theological_decisions:
- issue: ከስቅለቱ በፊት በኢየሱስ ላይ የተፈጸመው ውርደት
  choice: ፌዙን፣ የንጉሥነት ማላገጫ ልብሱን ማውለቃቸውን፣ የራሱን ልብስ ማልበሳቸውንና ለስቅለት ወደ ውጭ መውሰዳቸውን በቀጥታ ማቅረብ
  alternative: ድርጊቶቹን በተጨማሪ ሥነ-መለኮታዊ ማብራሪያ ማስፋት
  rationale: ጥቅሱ ቀጥተኛ ትረካ ነው፤ ትርጉሙ በጽሑፉ የሌለ ትርጓሜ ሳይጨምር ውርደቱንና የስቅለቱን ዓላማ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የትረካው አጭርነትና ከባድ ድምፅ ተጠብቋል።
