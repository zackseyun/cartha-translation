  text: ἰδὼν δὲ ὁ κεντυρίων ὁ παρεστηκὼς ἐξ ἐναντίας αὐτοῦ ὅτι ⸀οὕτως ἐξέπνευσεν εἶπεν· Ἀληθῶς ⸂οὗτος ὁ ἄνθρωπος⸃ υἱὸς ⸂θεοῦ ἦν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/039.yaml
  text: When the centurion[a], who was standing opposite him, saw that he breathed his last in this way, he said, “Truly this man was God's Son.”
translation:
  language: am
  text: በፊቱ ቆሞ የነበረው የመቶ አለቃ፣ እንዲህ መጨረሻ እስትንፋሱን እንዳወጣ ባየ ጊዜ፣ “በእውነት ይህ ሰው የእግዚአብሔር ልጅ ነበር”[a] አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በእውነት ይህ ሰው የአምላክ ልጅ ነበር።” የግሪኩ አገላለጽ ጥራታዊ ወይም ያልተወሰነ ትርጉም ሊኖረው ይችላል፤ በማርቆስ አውድ ግን “የእግዚአብሔር ልጅ” እንደ ማዕረግ መነበቡ ይበልጥ ተገቢ ይመስላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: ባየ ጊዜ
  rationale: የአንድ ጊዜ ድርጊትን የሚገልጠውን ተሳቢ ግስ በተፈጥሯዊ የአማርኛ ጊዜ ንዑስ ሐረግ ይተረጉማል፤ δέ እዚህ ላይ ቀላል አያያዥ ስለሆነ በተለየ ቃል አልተጫነም።
- source_word: κεντυρίων
  choice: የመቶ አለቃ
  rationale: የሮማውያንን ወታደራዊ ማዕረግ በተለመደና ለአማርኛ አንባቢ ግልጽ በሆነ ቃል ያቀርባል።
- source_word: ὁ παρεστηκὼς ἐξ ἐναντίας αὐτοῦ
  choice: በፊቱ ቆሞ የነበረው
  rationale: παρεστηκώς ቀድሞ የተያዘና የቀጠለ የመቆም አቋምን ያሳያል፤ ἐξ ἐναντίας αὐτοῦ ፊት ለፊት ወይም በፊቱ የነበረውን ቦታ ይገልጣል።
- source_word: ὅτι οὕτως ἐξέπνευσεν
  choice: እንዲህ እስትንፋሱ እንዳለፈ
  rationale: ἐκπνέω በቀጥታ እስትንፋስን ማውጣትና በአውዱ መሞትን ይገልጣል፤ ይህ አገላለጽ ምስላዊነቱን ይጠብቃል። οὕτως ደግሞ “እንዲህ” ተብሎ የሞቱን ሁኔታ ያመለክታል።
- source_word: Ἀληθῶς
  choice: በእውነት
  rationale: የቃሉን አጽንዖትና የተናጋሪውን ቁርጥ ያለ መግለጫ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: οὗτος ὁ ἄνθρωπος
  choice: ይህ ሰው
  rationale: ቀጥተኛ፣ ተፈጥሯዊና በአውዱ ውስጥ ኢየሱስን በግልጽ የሚያመለክት ትርጉም ነው።
- source_word: υἱὸς θεοῦ
  choice: የእግዚአብሔር ልጅ
  rationale: የግሪኩን ባለቤትነት ግንኙነት ያለ ተጨማሪ መወሰኛ በቀጥታ ያቀርባል። በማርቆስ ትረካ ውስጥ የክርስቶስ ማዕረግ የመሆኑን ኃይል ይጠብቃል፤ የማይወሰን አነባበብ ግን በማስታወሻ ተጠብቋል።
- source_word: ἦν
  choice: ነበር
  rationale: የግሪኩን ያለፈ ጊዜ ቅርጽ በቀጥታ ይጠብቃል፤ “ነው” ብሎ አይለውጠውም።
theological_decisions:
- issue: የυἱὸς θεοῦ ትርጉም እና ኃይል
  choice: የእግዚአብሔር ልጅ
