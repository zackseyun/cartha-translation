  rationale: ጥቅሱ የፌዘኞቹን ንግግር ያቀርባል፤ ከሌላ ወንጌል የሚመጣውን ትርጓሜ ወደ ዋናው ጽሑፍ ማስገባት የትረካውን የእይታ ነጥብና ያለውን ሥነ መለኮታዊ ውጥረት ይፈታል።
