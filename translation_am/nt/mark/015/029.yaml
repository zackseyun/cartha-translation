  rationale: በዚህ አውድ ያለውን የማፌዝና የፌዝ አግራሞት ይጠብቃል።
- source_word: ὁ καταλύων
  choice: አፍርሰህ … የምትሠራው
  rationale: በመስቀል ንግግሩ ውስጥ ያለውን የቀጥታ ጥሪ ቅርጽ በተፈጥሯዊ አማርኛ ያቀርባል፤ ‘አፍርሰህ’ የክሱን የታሰበ ድርጊት ያሳያል።
- source_word: ναὸν
