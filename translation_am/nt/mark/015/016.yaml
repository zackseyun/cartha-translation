review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the soldiers’ taking Jesus inside and their assembling of the entire military unit. However, it reverses and blurs the Greek appositional identification: the courtyard is identified as the praetorium, rather than the praetorium merely being a destination ‘called’ by that name. The first footnote also overstates the term by adding ‘residence.’'
  naturalness: The wording “ፕራይቶሪየም ... የግቢው ውስጥ” is awkward and leaves the spatial/appositional relationship unclear. Recasting it as ‘into the courtyard, that is, into the praetorium’ is natural modern standard Amharic.
  terminology: “ፕራይቶሪየም” appropriately retains the Roman administrative term. “ጭፍራ” can serve for the Roman cohort when supported by a cultural footnote. The footnote should describe it as a governor’s headquarters/official residence without asserting both as though the Greek itself specified them.
  issues:
  - severity: medium
    issue: The main clause presents the praetorium as the place ‘called’ something and places “inside the courtyard” after it.
    rationale: ὅ ἐστιν πραιτώριον identifies αὐλή (‘courtyard’) as πραιτώριον. The Amharic should preserve this explanatory apposition and make the movement into the courtyard clear.
  - severity: medium
    issue: Footnote a states that the praetorium means both the governor’s residence and principal office.
    rationale: πραιτώριον has a range including the governor’s residence or headquarters, but the source does not require both descriptions simultaneously. This should be presented as an alternative explanatory rendering.
  - severity: low
    issue: “የወታደሮቹን ጭፍራ” is unnecessarily possessive.
    rationale: The Greek simply says ‘the whole cohort.’ “መላውን ጭፍራ” is more direct and avoids suggesting a different group from the soldiers already named.
  revised_text: ወታደሮቹም እርሱን ወደ ግቢው ውስጥ፣ ማለትም ወደ ፕራይቶሪየም[a]፣ ወሰዱት፤ መላውን ጭፍራ[b]ም ሰበሰቡ።
  revised_footnotes:
  - marker: a
    text: ወይም፣ “የገዢው ዋና መሥሪያ ስፍራ።”
    reason: lexical_alternative
  - marker: b
    text: “ጭፍራ” የሮማውያን ወታደራዊ ክፍል ነበር፤ እዚህ ቃሉ በሮም ሥልጣን ሥር የነበሩ ወታደሮችን ያመለክታል።
    reason: cultural_note
  revision_rationale: 'The revision restores the Greek sequence and apposition: the soldiers led him into the courtyard, which is identified as the praetorium, and then assembled the whole cohort. It retains the historical Roman term while making its explanatory alternative suitably limited and non-overstated.'
