revisions:
- from: ወታደሮቹም እርሱን ፕራይቶሪየም[a] ወደሚባለው የግቢው ውስጥ ወሰዱት፤ የወታደሮቹንም ጭፍራ በሙሉ[b] ሰበሰቡ።
  to: ወታደሮቹም እርሱን ወደ ግቢው ውስጥ፣ ማለትም ወደ ፕራይቶሪየም[a]፣ ወሰዱት፤ መላውን ጭፍራ[b]ም ሰበሰቡ።
  rationale: 'The revision restores the Greek sequence and apposition: the soldiers led him into the courtyard, which is identified as the praetorium, and then assembled the whole cohort. It retains the historical Roman term while making its explanatory alternative suitably limited and non-overstated.'
