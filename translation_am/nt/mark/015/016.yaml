source:
  edition: SBLGNT
  text: Οἱ δὲ στρατιῶται ἀπήγαγον αὐτὸν ἔσω τῆς αὐλῆς, ὅ ἐστιν πραιτώριον, καὶ συγκαλοῦσιν ὅλην τὴν σπεῖραν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/016.yaml
  text: Then the soldiers led him inside the courtyard[a], which is the praetorium[b], and they call together the whole cohort.
translation:
  language: am
  text: ወታደሮቹም እርሱን ወደ ግቢው ውስጥ፣ ማለትም ወደ ፕራይቶሪየም[a]፣ ወሰዱት፤ መላውን ጭፍራ[b]ም ሰበሰቡ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የገዢው ዋና መሥሪያ ስፍራ።”
    reason: lexical_alternative
  - marker: b
    text: “ጭፍራ” የሮማውያን ወታደራዊ ክፍል ነበር፤ እዚህ ቃሉ በሮም ሥልጣን ሥር የነበሩ ወታደሮችን ያመለክታል።
    reason: cultural_note
lexical_decisions:
- source_word: Οἱ δὲ
  choice: ወታደሮቹም
  rationale: δέ በዚህ ስፍራ ጠንካራ ተቃርኖን ሳይሆን የትረካውን ቀጣይነት ያመለክታል፤ የአማርኛው “-ም” ይህን ፍሰት በተፈጥሮ ያሳያል።
- source_word: στρατιῶται
  choice: ወታደሮቹ
  rationale: የሮም ወታደሮችን ቀጥተኛና በዘመናዊ አማርኛ ግልጽ በሆነ ቃል ይገልጣል።
- source_word: ἀπήγαγον
  choice: ወሰዱት
  rationale: ግሱ አንድን ሰው መርቶ ወይም ይዞ ወደ ሌላ ስፍራ ማድረስን ያመለክታል፤ “ወሰዱት” በዚህ ዐውድ ተፈጥሯዊ ነው።
- source_word: ἔσω τῆς αὐλῆς
  choice: የግቢው ውስጥ
  rationale: የውስጥ አቅጣጫውንና αὐλή የሚያመለክተውን የሕንፃ ግቢ ሳያሰፋ ያቀርባል።
- source_word: ὅ ἐστιν πραιτώριον
  choice: ፕራይቶሪየም ወደሚባለው
  rationale: የሮማውያንን ታሪካዊ አስተዳደራዊ ቃል ጠብቆ፣ የግሪኩን ገላጭ ሐረግ “ወደሚባለው” በማለት ያንጸባርቃል። ትርጉሙ በማስታወሻ ተብራርቷል።
- source_word: συγκαλοῦσιν
  choice: ሰበሰቡ
  rationale: አንድ ላይ እንዲገኙ መጥራትን በተፈጥሯዊ አማርኛ ያሳያል። የግሪኩ ታሪካዊ የአሁን ጊዜ በአማርኛ ትረካ የተለመደውን ያለፈ ጊዜ ተጠቅሞ ተተርጉሟል።
- source_word: ὅλην τὴν σπεῖραν
  choice: የወታደሮቹን ጭፍራ በሙሉ
  rationale: σπεῖρα የሮም ወታደራዊ ክፍልን ያመለክታል፤ “ጭፍራ” የተደራጀ የወታደር ቡድንን የሚገልጥ ሲሆን “በሙሉ” ὅληνን በግልጽ ይጠብቃል።
