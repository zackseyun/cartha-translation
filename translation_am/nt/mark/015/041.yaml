  text: ⸀αἳ ὅτε ἦν ἐν τῇ Γαλιλαίᾳ ἠκολούθουν αὐτῷ καὶ διηκόνουν αὐτῷ, καὶ ἄλλαι πολλαὶ αἱ συναναβᾶσαι αὐτῷ εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/041.yaml
  text: These women[a], when he was in Galilee, used to follow him and minister to him[b]; and there were many other women who had gone up with him to Jerusalem.
translation:
  language: am
  text: እነዚህ ሴቶች፣ እርሱ በገሊላ በነበረ ጊዜ ይከተሉትና ያገለግሉት[a] ነበር፤ ከእርሱ ጋር ወደ ኢየሩሳሌም የወጡ[b] ሌሎች ብዙ ሴቶችም ነበሩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ይረዱት” ወይም “ይንከባከቡት።” የግሪኩ ግስ ተግባራዊ አገልግሎትን ወይም ድጋፍን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “ከእርሱ ጋር ወደ ኢየሩሳሌም የወጡ።” ይህ ወደ ኢየሩሳሌም መሄድን “መውጣት” ብሎ የሚገልጸውን የተለመደ መጽሐፍ ቅዱሳዊ አገላለጽ ያንጸባርቃል።
    reason: cultural_note
lexical_decisions:
- source_word: αἳ
  choice: እነዚህ ሴቶች
  rationale: አንጻራዊው ተውላጠ ስም በቀደመው ቁጥር የተጠቀሱትን ሴቶች ያመለክታል፤ ይህ አተረጓጎም ያንን ትስስር በተፈጥሯዊ አማርኛ ግልጽ ያደርገዋል።
- source_word: ὅτε ἦν ἐν τῇ Γαλιλαίᾳ
  choice: እርሱ በገሊላ በነበረ ጊዜ
  rationale: ጊዜን የሚገልጠውን ሐረግና ‘በገሊላ’ የሚለውን የስፍራ አመልካች በቀጥታ ይጠብቃል።
- source_word: ἠκολούθουν
  choice: ይከተሉት ... ነበር
  rationale: ያልተፈጸመው ያለፈ ጊዜ ቅርጽ በአንድ ጊዜ የተደረገ ተግባርን ሳይሆን የተለመደ ወይም ቀጣይ ድርጊትን ያሳያል፤ ‘ይከተሉት ነበር’ ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: διηκόνουν
  choice: ያገለግሉት ... ነበር
  rationale: ግሱ ተግባራዊ አገልግሎትን፣ እንክብካቤን ወይም ድጋፍን ሊያመለክት ይችላል። ‘ያገለግሉት’ ስፋቱንና ክብሩን ይጠብቃል፤ የቤት ውስጥ ሥራ ብቻ አድርጎ አያጠበውም።
- source_word: ἄλλαι πολλαὶ
  choice: ሌሎች ብዙ ሴቶች
  rationale: በግሪኩ ያለው የሴት ፆታ ብዙ ቁጥር ከአውዱ ግልጽ ነው፤ ‘ሴቶች’ በማለት መግለጹ በአማርኛ የማጣቀሻውን ግልጽነት ይጠብቃል።
- source_word: αἱ συναναβᾶσαι αὐτῷ
  choice: ከእርሱ ጋር ... የወጡ
  rationale: የአኦሪስት አጋዥ ግሱ ከዋናው ንግግር በፊት የሆነውን ድርጊት ያመለክታል። ‘የወጡ’ ወደ ኢየሩሳሌም መውጣት የሚለውን መጽሐፍ ቅዱሳዊና መልክዓ ምድራዊ አገላለጽ ይጠብቃል።
- source_word: εἰς Ἱεροσόλυμα
  choice: ወደ ኢየሩሳሌም
  rationale: εἰς ከከተማ ስም ጋር የመድረሻ አቅጣጫን ያሳያል፤ ‘ወደ ኢየሩሳሌም’ ተፈጥሯዊና ትክክለኛ ነው።
theological_decisions:
- issue: διηκόνουν የሚገልጸው የሴቶቹ አገልግሎት ባሕርይ
  choice: ያገለግሉት
  alternative: ይረዱት / ይንከባከቡት
  rationale: ‘ያገለግሉት’ ሴቶቹ በገሊላ ዘመን ለኢየሱስ ያደርጉትን ንቁ ድጋፍና ተግባራዊ እርዳታ ሰፋ ባለ መልኩ ያሳያል፤ ቃሉን ወደ ኋላ የተቋቋመ የቤተ ክርስቲያን ሹመት አይወስነውም፣ እንዲሁም ዝቅተኛ የቤት ሥራ ብቻ አድርጎ አያጠበውም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ያልተፈጸመ ያለፈ ጊዜ በ‘... ነበር’ ቅርጽ ተጠብቋል፤ የአገልግሎቱ ትክክለኛ ዝርዝር ሳይገደብ የቃሉ ትርጉማዊ ስፋት ተጠብቋል።
