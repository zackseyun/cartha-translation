  text: καὶ ἀγοράσας ⸀σινδόνα καθελὼν αὐτὸν ἐνείλησεν τῇ σινδόνι καὶ ⸀ἔθηκεν αὐτὸν ἐν ⸀μνημείῳ ὃ ἦν λελατομημένον ἐκ πέτρας, καὶ προσεκύλισεν λίθον ἐπὶ τὴν θύραν τοῦ μνημείου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/046.yaml
  text: And after buying a linen cloth[a], he took him down, wrapped him in the linen cloth, and laid him in a tomb that had been cut out of rock[c][b]. Then he rolled a stone against the entrance of the tomb.
translation:
  language: am
  text: የበፍታ ጨርቅ[a] ገዝቶ፣ እርሱን አውርዶ በዚያ ጨርቅ ጠቀለለው፤ ከዓለት ተፈልፍሎ በተሠራ[b] መቃብር ውስጥም አኖረው። ከዚያም ድንጋይን በመቃብሩ መግቢያ[c] ላይ አንከባለለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም «የበፍታ አንሶላ» ወይም «የሬሳ መጠቅለያ»፤ የግሪኩ ቃል σινδών ነው።
    reason: lexical_alternative
  - marker: b
    text: ወይም «ከዓለት ተቆርጦ በተሠራ»።
    reason: lexical_alternative
  - marker: c
    text: ወይም «በመቃብሩ በር»፤ የግሪኩ θύρα «በር» ወይም «መግቢያ» ማለት ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: σινδόνα / σινδόνι
  choice: የበፍታ ጨርቅ / ጨርቁ
  rationale: σινδών የበፍታ ጨርቅን፣ በዚህ አውድም ለቀብር መጠቅለያነት የዋለን ጨርቅ ያመለክታል። «ጨርቅ» ከጽሑፉ በላይ የተወሰነ ትርጉም ሳይጨምር ቁሳቁሱን ያሳያል።
- source_word: καθελών
  choice: ከመስቀሉ አወረደው
  rationale: በአውዱ የኢየሱስን ሥጋ ከመስቀል ማውረድን ያመለክታል፤ «ከመስቀሉ» በአማርኛ ድርጊቱን በግልጽና ተፈጥሯዊ ሁኔታ ይገልጻል።
- source_word: ἐνείλησεν
  choice: ጠቅልሎ
  rationale: ግሱ መጠቅለልን ወይም መከተትን ያመለክታል፤ «ጠቅልሎ» በቀብር ዝግጅት አውድ ተፈጥሯዊ ነው።
- source_word: ἔθηκεν
  choice: አኖረው
  rationale: τίθημι እዚህ ሰውነቱን በመቃብር ውስጥ ማኖርን ያመለክታል፤ «አኖረው» ግልጽና ክብር ያለው ዘመናዊ አገላለጽ ነው።
- source_word: μνημείῳ / μνημείου
  choice: መቃብር / መቃብሩ
  rationale: μνημεῖον በዚህ ስፍራ ከዓለት የተፈለፈለ የቀብር ስፍራን ያመለክታል፤ «መቃብር» በአማርኛ የተለመደና ትክክለኛ አቻ ነው።
- source_word: λελατομημένον ἐκ πέτρας
  choice: ከዓለት ተፈልፍሎ በተሠራ
  rationale: ፍጹም ተደርጎ የነበረን ሁኔታ የሚያሳየውን የግሱን ተገብሮ ቅርጽ ይጠብቃል፤ «ዓለት» πέτραን፣ «ተፈልፍሎ» ደግሞ በዓለት ውስጥ ተቆርጦ መዘጋጀቱን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: προσεκύλισεν
  choice: አንከባሎ
  rationale: ግሱ ድንጋዩን ወደ መቃብሩ መግቢያ አንከባሎ ማቅረብን ያመለክታል፤ አቅጣጫው «በመቃብሩ መግቢያ ላይ» በሚለው ሐረግ ተገልጿል።
- source_word: ἐπὶ τὴν θύραν τοῦ μνημείου
  choice: በመቃብሩ መግቢያ ላይ
  rationale: θύρα «በር» ወይም «መግቢያ» ሊሆን ይችላል። ለዓለት መቃብር «መግቢያ» ለዘመናዊ አንባቢ ግልጽ ሲሆን አማራጩ በማስታወሻ ተጠብቋል።
- source_word: ἀγοράσας
  choice: ገዝቶ
  rationale: የግሱ አዮሪስት አሳታፊ ቅርጽ ግዢው ከሚቀጥሉት ድርጊቶች በፊት መፈጸሙን ያሳያል፤ «ገዝቶ» ይህን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያቀርባል።
