- from: ሕዝቡም ወጥቶ፣ እንደ ልማዱ ያደርግላቸው የነበረውን እንዲያደርግላቸው ሊጠይቀው ጀመረ።[a]
  to: ሕዝቡም ቀርቦ፣ እንደ ልማዱ እንዲያደርግላቸው መጠየቅ ጀመረ።[a]
