  text: And the crowd came up and began to ask him to do as he used to do for them[a].
translation:
  language: am
  text: ሕዝቡም ቀርቦ፣ እንደ ልማዱ እንዲያደርግላቸው መጠየቅ ጀመረ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይበልጥ ቃል በቃል፦ “ሕዝቡም ወደ ላይ ወጥቶ፣ ለእነርሱ ያደርግ እንደነበረው [እንዲያደርግ] መጠየቅ ጀመረ።”
