lexical_decisions:
- source_word: ἀναβὰς
  choice: ወጥቶ
  rationale: የἀναβαίνω የአኦሪስት አጋዥ ግስ ሲሆን ‘ወጥቶ’ የሚለው ትርጉም የመውጣትን ወይም ወደ አንድ ስፍራ የመቅረብን እንቅስቃሴ ከጽሑፉ በላይ ሳይጨምር ያስተላልፋል።
- source_word: ὁ ὄχλος
  choice: ሕዝቡ
  rationale: ὄχλος በዚህ ትረካ በአንድነት የተሰበሰበውን ብዙ ሰው ያመለክታል፤ ‘ሕዝቡ’ በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: ἤρξατο αἰτεῖσθαι
  choice: ሊጠይቀው ጀመረ
  rationale: ἄρχομαι ከኢንፊኒቲቭ ጋር ‘ጀመረ’ የሚል ፍቺ አለው፤ αἰτέω ደግሞ እዚህ መጠየቅን ወይም መለመንን ያመለክታል። የግሱ ተሳቢ ከአውዱ ጲላጦስ መሆኑ ስለሚታወቅ ‘-ው’ በሚለው ተውላጠ ስም ተገልጿል።
- source_word: καθὼς
  choice: እንደ ልማዱ
  rationale: καθώς ‘እንደ/ልክ እንደ’ ማለት ነው። ከኢምፐርፌክት ἐποίει ጋር በየጊዜው የሚደረገውን ልማድ ስለሚገልጽ፣ ‘እንደ ልማዱ’ ፍቺውን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐποίει
  choice: ያደርግላቸው የነበረውን
  rationale: የποιέω ኢምፐርፌክት ቅርጽ በዚህ አውድ በተደጋጋሚ የተለመደ ድርጊትን ያመለክታል፤ ‘ያደርግላቸው የነበረውን’ ይህን የቀድሞ ልማድ ይጠብቃል።
- source_word: αὐτοῖς
  choice: ላቸው
  rationale: ዳቲቭ ተውላጠ ስሙ ድርጊቱ ለሕዝቡ ጥቅም እንደሚደረግ ያሳያል፤ በአማርኛ ‘ላቸው’ ይህን የተጠቃሚነት ግንኙነት በትክክል ይገልጻል።
