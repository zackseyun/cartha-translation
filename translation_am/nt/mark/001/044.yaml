source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ὅρα μηδενὶ μηδὲν εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ καὶ προσένεγκε περὶ τοῦ καθαρισμοῦ σου ἃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/044.yaml
  text: And he says to him[a], “See that you say nothing to anyone; rather, go, show yourself to the priest, and offer for your cleansing what Moses commanded, as a testimony to them.”
translation:
  language: am
  text: እንዲህም አለው፦ “ለማንም ምንም እንዳትናገር ተጠንቀቅ፤ ነገር ግን ሄደህ ራስህን ለካህኑ አሳይ፤ ለመንጻትህም ሙሴ ያዘዘውን ለእነርሱ ምስክር እንዲሆን[a] አቅርብ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ለእነርሱ ምስክር እንዲሆን” የሚለው ሐረግ፣ ለካህናቱ ወይም ለሌሎች የሚቀርብ ማስረጃ ማለት ሊሆን ይችላል፤ አንዳንዶች ደግሞ “በእነርሱ ላይ ምስክር” በሚል የበለጠ ተቃርኖአዊ ትርጉም ይረዱታል።
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅρα
  choice: ተጠንቀቅ
  rationale: ክልከላውን የሚያስጠነቅቅ የትእዛዝ ኃይል በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: μηδενὶ μηδὲν εἴπῃς
  choice: ለማንም ምንም እንዳትናገር
  rationale: ሁለቱንም አሉታዊ አጠቃላይ ቃላት፣ ተቀባዩንና የሚነገረውን፣ በግልጽ ሁኔታ ይጠብቃል።
- source_word: ἀλλὰ
  choice: ነገር ግን
  rationale: ከተከለከለው ድርጊት ወደ ታዘዘው ድርጊት ያለውን ንጽጽር ያሳያል።
- source_word: ὕπαγε
  choice: ሄደህ
  rationale: ቀጥተኛውን የመሄድ ትእዛዝ በተፈጥሯዊ አማርኛ ከሚቀጥለው ትእዛዝ ጋር ያገናኛል።
- source_word: σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: ራስህን ለካህኑ አሳይ
  rationale: የግሪኩን አንጸባራቂ ተሳቢ እና የተወሰነውን የካህን ምርመራ በቅርበት ይጠብቃል።
- source_word: προσένεγκε
  choice: አቅርብ
  rationale: በአምልኮና በመሥዋዕት አውድ ውስጥ የሚቀርበውን መባ በተገቢ ሁኔታ ይገልጻል።
- source_word: περὶ τοῦ καθαρισμοῦ σου
  choice: ለመንጻትህ
  rationale: የአምልኮ ሥርዓታዊ መንጻትን ያመለክታል፤ የፈውሱን አውድም አያጠፋም።
- source_word: ἃ προσέταξεν Μωϋσῆς
  choice: ሙሴ ያዘዘውን መባ
  rationale: ብዙ ነገሮችን የሚያመለክተውን አንጻራዊ ሐረግ በተፈጥሯዊ አማርኛ ይሰጣል፤ ‘መባ’ የሚለው ከአውዱ የተገኘ ማብራሪያ ነው።
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: ለእነርሱ ምስክር እንዲሆን
  rationale: የዓላማን ወይም የውጤትን ኃይል ይጠብቃል፤ ‘በእነርሱ ላይ’ በማለት ጠላትነትን አይጨምርም።
theological_decisions:
- issue: “ለእነርሱ ምስክር” የሚለው ሐረግ ተጠቃሽና ኃይል
  choice: የግሪኩን ሰፊ አገላለጽ በመጠበቅ ‘ለእነርሱ ምስክር’ ተብሏል።
  alternative: ‘ለካህናቱ ማስረጃ’ ወይም ‘በእነርሱ ላይ ምስክር’
  rationale: ጽሑፉ ‘በእነርሱ ላይ’ ብሎ በግልጽ አይናገርም፤ ተጠቃሾቹ ካህናቱ ወይም ሌሎች ሊሆኑ ይችላሉ። ስለዚህ ማስረጃዊም ሆነ ተቃርኖአዊ ጥላው ሳይወሰን ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የቶራውን ሥርዓታዊ አውድ ለማሳየት ‘ካህኑ፣’ ‘መንጻት፣’ እና ‘መባ’ የሚሉ የተለመዱ መጽሐፍ ቅዱሳዊ ቃላት ተመርጠዋል።
