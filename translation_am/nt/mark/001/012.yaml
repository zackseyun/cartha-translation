  text: And immediately the Spirit drives him out into the wilderness[a].
translation:
  language: am
  text: ወዲያውም መንፈስ ወደ ምድረ በዳ አስወጣው[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ወደ ምድረ በዳ ገፍቶ አስወጣው» ወይም «ወደ ምድረ በዳ ላከው»። የግሪኩ ግስ ጠንካራ ነው፤ ማርቆስ ይህንኑ ግስ አጋንንትን ስለ ማስወጣት ብዙ ጊዜ ይጠቀምበታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: -ም
  rationale: የግሪኩን ቀላል አያያዥ በአማርኛ ተፈጥሯዊ በሆነው ተከታይ አያያዥ «-ም» ያሳያል።
- source_word: εὐθὺς
  choice: ወዲያው
  rationale: ማርቆስ የሚያሳየውን ፈጣን የትረካ እንቅስቃሴ በዘመናዊና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: τὸ πνεῦμα
  choice: መንፈስ
  rationale: በአውዱ ይህ በማርቆስ 1፥10 የተጠቀሰውን መንፈስ ያመለክታል፤ «ቅዱስ» የሚለውን በግልጽ ካልተጻፈበት ጽሑፍ ላይ አልጨመረም።
- source_word: αὐτὸν
  choice: -ው
  rationale: ኢየሱስን የሚያመለክተውን ቀጥተኛ ተሳቢ በግስ ላይ በተያያዘ ተውላጠ ስም ተተርጉሟል።
- source_word: ἐκβάλλει
  choice: አስወጣው
  rationale: ከ«መራው» ወይም «ላከው» ይልቅ የግሪኩን ጠንካራ እንቅስቃሴ ያስጠብቃል፤ ነገር ግን በአማርኛ «ጣለው» ሊያስከትል የሚችለውን ያልተፈለገ የአካላዊ መወርወር ትርጉም ያስወግዳል።
- source_word: εἰς τὴν ἔρημον
  choice: ወደ ምድረ በዳ
  rationale: ἔρημος ሰው የማይኖርበትን ባዶና ምድረ በዳ ስፍራ ያመለክታል፤ የግድ አሸዋማ በረሃ ማለት አይደለም።
theological_decisions:
- issue: መንፈስ በኢየሱስ ላይ ያደረገው ድርጊት ጥንካሬ
  choice: «አስወጣው» ተብሎ የἐκβάλλει ጠንካራ ኃይል ተጠብቋል።
  alternative: «መራው» ወይም «ላከው»
  rationale: ግሱን ማለስለስ ከሌሎች ወንጌላት አገላለጽ ጋር በዝምታ ማስማማት ይሆናል። ይልቁንም የምድረ በዳው ፈተና በመለኮታዊ ተነሳሽነት እንደተከተለ የጽሑፉ ውጥረት ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ምድረ በዳ» መጽሐፍ ቅዱሳዊ ድምፁን ሳያጣ በዘመናዊ አጠቃቀም የሚገባ ሲሆን፣ «አስወጣው» የግሪኩን ጥንካሬ ከአማርኛ ተፈጥሯዊነት ጋር ያመጣጥናል።
