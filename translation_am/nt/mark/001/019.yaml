  text: ከዚያም ጥቂት ወደ ፊት ሄዶ፣ የዘብዴዎስን ልጅ ያዕቆብንና ወንድሙን ዮሐንስን አየ፤ እነርሱም በጀልባው ውስጥ መረቦቹን እየጠገኑ ነበሩ።
