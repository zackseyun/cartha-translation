  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ያውጅ ነበር” የተደጋጋሚውን የአዋጅ ተግባር ይጠብቃል፤ “እንኳ” ደግሞ ዮሐንስ እጅግ ዝቅተኛ የአገልጋይ ሥራ እንኳ ሊሠራ የሚገባው እንዳልሆነ የገለጠውን አጽንዖት በአማርኛ በተፈጥሯዊ ሁኔታ ያሳያል።
