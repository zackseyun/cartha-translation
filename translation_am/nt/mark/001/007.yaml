base_translation:
  language: en
  yaml_path: translation/nt/mark/001/007.yaml
  text: And he was proclaiming[a], saying, “The one stronger than I is coming after me[c][b], of whom I am not worthy to stoop down and untie the strap of his sandals.”
translation:
  language: am
  text: እንዲህ እያለ ያውጅ ነበር፤ “ከእኔ ይልቅ ኃያል የሆነው ከእኔ በኋላ እየመጣ ነው። እኔ ግን ጎንበስ ብዬ የጫማዎቹን ማሰሪያ ለመፍታት ብቁ አይደለሁም።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ብቁ አይደለሁም” የሚለው “የማይገባኝ ነኝ” ወይም “አልበቃም” ተብሎም ሊተረጎም ይችላል፤ አገላለጹ በመጪው ፊት ያለውን ጥልቅ ትሕትና ያሳያል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκήρυσσεν
  choice: ያውጅ ነበር
  rationale: አላፊ ጊዜው ቀጣይነትን ወይም ድግግሞሽን ያመለክታል፤ “ያውጅ” ደግሞ የአዋጅ ነጋሪነቱን ኃይል ይጠብቃል።
- source_word: λέγων
  choice: እንዲህ እያለ
  rationale: የተነገረውን ቀጥተኛ ንግግር በተፈጥሯዊ አማርኛ ያስገባል።
- source_word: Ἔρχεται
  choice: ይመጣል
  rationale: በግሪኩ ያለውን ሕያው የአሁን ጊዜ አገላለጽና የመምጣቱን ቅርበት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ὁ ἰσχυρότερός μου
  choice: ከእኔ ይልቅ ኃያል የሆነው
  rationale: በመጠን የሚያወዳድረውን ቅጽና በስም ፈንታ የቆመውን ቅጽ በግልጽ ሁኔታ ይጠብቃል።
- source_word: ὀπίσω μου
  choice: ከእኔ በኋላ
  rationale: በዚህ ዐውድ ያለውን የጊዜና የተከታታይነት ፍቺ ያስተላልፋል።
- source_word: ἱκανὸς
  choice: የሚገባኝ
  rationale: ከመጪው ሰው አንጻር ዮሐንስ የገለጠውን ጥልቅ ትሕትናና የማይገባው መሆን በተፈጥሯዊ አማርኛ ያሳያል፤ የብቃት ፍቺው ግን በማስታወሻ ተጠብቋል።
- source_word: κύψας
  choice: ጎንበስ ብዬ
  rationale: ማሰሪያውን ከመፍታቱ ጋር የተያያዘውን አካላዊ ዝቅ ማለት ያሳያል።
- source_word: λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ
  choice: የጫማውን ማሰሪያ ለመፍታት
  rationale: የጥንቱን ጫማ የሚያስረውን ማሰሪያና የመፍታቱን ተግባር በግልጽ ዘመናዊ ቃላት ይገልጣል።
theological_decisions:
- issue: የዮሐንስ ንግግር የሚገልጠው ብቃት ማጣት ወይስ የማይገባው መሆን
  choice: የሚገባኝ አይደለሁም
  alternative: ብቁ አይደለሁም / አልበቃም
  rationale: አገላለጹ በዋናነት ዮሐንስ በመጪው ፊት ያለውን ዝቅተኛ ደረጃና ጥልቅ ትሕትና ያሳያል፤ ሆኖም ἱκανός የብቃት ወይም የበቂነት ፍቺም ሊኖረው ስለሚችል አማራጩ በማስታወሻ ተጠብቋል።
