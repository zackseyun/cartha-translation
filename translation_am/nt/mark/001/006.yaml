  text: ⸂καὶ ἦν⸃ ὁ Ἰωάννης ἐνδεδυμένος τρίχας καμήλου καὶ ζώνην δερματίνην περὶ τὴν ὀσφὺν αὐτοῦ, καὶ ἔσθων ἀκρίδας καὶ μέλι ἄγριον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/006.yaml
  text: John was clothed with camel’s hair and a leather belt around his waist[a], and he was eating locusts and wild honey.
translation:
  language: am
  text: ዮሐንስ የግመል ጠጉር ልብስ ለብሶ፣ በወገቡም የቆዳ ቀበቶ ታጥቆ ነበር፤[a] አንበጣና የዱር ማርም ይበላ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የዮሐንስ አለባበስ በ2 ነገሥት 1፥8 ስለ ኤልያስ የተሰጠውን መግለጫ ያስታውሳል፤ ይህም ማርቆስ ዮሐንስን መንገድ ጠራጊ ነቢይ አድርጎ ከሚያቀርብበት ሁኔታ ጋር ይስማማል።
    reason: cross_reference
lexical_decisions:
- source_word: ἐνδεδυμένος
  choice: ለብሶ ነበር
  rationale: ፍጹም አጋዥ ግሱ ዮሐንስ ለብሶ የነበረበትን ቀጣይ ሁኔታ ያሳያል፤ ይህ አተረጓጎም በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: τρίχας καμήλου
  choice: የግመል ጠጉር ልብስ
  rationale: ሐረጉ ከግመል ጠጉር የተሠራ ልብስን እንጂ የግመል ቆዳን አያመለክትም፤ «ልብስ» በአማርኛ የአለባበሱን ትርጉም ግልጽ ያደርጋል።
- source_word: ζώνην δερματίνην
  choice: የቆዳ ቀበቶ
  rationale: ζώνη ቀበቶን ወይም መታጠቂያን፣ δερματίνην ደግሞ ከቆዳ መሠራቱን ያመለክታል።
- source_word: περὶ τὴν ὀσφὺν αὐτοῦ
  choice: በወገቡም ... ታጥቆ
  rationale: ὀσφύς የወገብን አካባቢ ያመለክታል፤ «በወገቡ ታጥቆ» በአማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: ἔσθων
  choice: ይበላ ነበር
  rationale: የአሁን ጊዜ አጋዥ ግሱ በዮሐንስ መግለጫ ውስጥ የተለመደ ወይም ቀጣይ ተግባርን ያሳያል።
- source_word: ἀκρίδας
  choice: አንበጣ
  rationale: ቃሉ በመደበኛ ፍቺው የሚበላውን ነፍሳት፣ አንበጣን፣ ያመለክታል።
- source_word: μέλι ἄγριον
  choice: የበረሃ ማር
  rationale: ሐረጉ በዱር የሚገኝ ማርን ያመለክታል፤ «የበረሃ ማር» በአማርኛ የተለመደና ተፈጥሯዊ አገላለጽ ነው።
- source_word: καὶ ἦν
  choice: ዮሐንስ ... ነበር
  rationale: καί ትረካውን ያገናኛል፤ በአማርኛ ግን ያልተጠቀሰ የጊዜ ቃል ሳይጨመር የተፈጥሮ የትረካ ቅደም ተከተል ግንኙነቱን ይሸከማል።
theological_decisions:
- issue: የዮሐንስ አለባበስና ምግብ ከነቢያዊ ምስል ጋር ያላቸው ግንኙነት
  choice: በዋናው ጽሑፍ ዮሐንስን ከኤልያስ ጋር በግልጽ ሳያመሳስሉ ጥቅሱን እንደ መግለጫ መተርጎም
