  text: And the whole city was gathered at the door[a].
translation:
  language: am
  text: ከተማውም ሁሉ በደጁ[a] ተሰብስቦ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ወደ ደጁ።» የግሪኩ መስተዋድድ ቃል በቃል ሲተረጎም እንዲህ ሊባል ይችላል፤ በዐውዱ ግን ሕዝቡ በቤቱ መግቢያ አጠገብ መሰብሰቡን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν … ἐπισυνηγμένη
  choice: ተሰብስቦ ነበር
  rationale: የἦν ኢምፐርፌክት ግስ ከፍጹም ተደራጊ አንቀጸ ግስ ἐπισυνηγμένη ጋር በመሆን በዚያ ጊዜ የነበረውን ሁኔታ ይገልጣል፤ «ተሰብስቦ ነበር» ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὅλη ἡ πόλις
  choice: ከተማውም ሁሉ
  rationale: የግሪኩን «ከተማው ሁሉ» የሚለውን ግልጽና አጽንዖት ያለው አገላለጽ ይጠብቃል። በዐውዱ የከተማውን ነዋሪዎች በከተማው ስም የሚጠራ ምሳሌያዊ አጠቃቀም ነው፤ ትርጉሙ ግን አገላለጹን አላዳከመም።
- source_word: πρὸς τὴν θύραν
  choice: በደጁ
  rationale: πρός ከአኩዛቲቭ ጋር ወደ አንድ ቦታ መቅረብን ወይም በዚያ አጠገብ የተገኘን ሁኔታ ሊገልጥ ይችላል። እዚህ የተሰበሰበውን ሕዝብ የቆመበት ቦታ ስለሚገልጥ «በደጁ» ተፈጥሯዊ ነው፤ «ወደ ደጁ» የሚለው ቃል በቃል አማራጭ በማስታወሻ ተጠብቋል።
- source_word: θύραν
  choice: ደጁ
  rationale: θύρα በቀጥታ «በር» ማለት ሲሆን፣ በዐውዱ የቤቱን መግቢያ ያመለክታል። «ደጁ» በቤት መግቢያ አጠገብ ያለውን ስፍራ በተፈጥሯዊ አማርኛ ይገልጣል።
