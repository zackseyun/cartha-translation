  text: And he went throughout all Galilee[a], preaching in their synagogues and casting out demons.
translation:
  language: am
  text: እርሱም በመላው ገሊላ[a] እየዞረ፣ በምኩራቦቻቸው ይሰብክና አጋንንትን ያስወጣ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ‘እርሱም መጥቶ በመላው ገሊላ በምኩራቦቻቸው እየሰበከና አጋንንትን እያስወጣ ነበር።’ የግሪኩ ግስ ‘መጣ’ ተብሎ ሊተረጎም ይችላል፤ በዚህ አውድ ግን በክልሉ ውስጥ እየተዘዋወረ መሄዱን የሚያመለክት ይመስላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: እየዞረ
  rationale: ግሱ በቀጥታ ‘መጣ/ሄደ’ ሊባል ቢችልም፣ ከመላው ገሊላ ከሚለው ክልላዊ ሐረግና ከተከታዮቹ ቦዝ አንቀጾች ጋር በዚህ አውድ ከቦታ ወደ ቦታ መዘዋወርን ያመለክታል። ‘እየዞረ’ ይህን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: κηρύσσων
  choice: ይሰብክና
  rationale: κηρύσσω በአደባባይ ማወጅን ያመለክታል፤ ‘መስበክ’ በምኩራብ አውድ የተፈጥሮ እና ለዘመናዊ አንባቢ ግልጽ ነው።
- source_word: εἰς τὰς συναγωγὰς αὐτῶν
  choice: በምኩራቦቻቸው
  rationale: εἰς በቃል ‘ወደ’ ቢሆንም፣ ከድርጊት ግስ ጋር የድርጊቱን ስፍራ ሊያመለክት ይችላል። ‘በምኩራቦቻቸው’ የቦታውን ትርጉምና αὐτῶνን በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: εἰς ὅλην τὴν Γαλιλαίαν
  choice: በመላው ገሊላ
  rationale: ሐረጉ እንቅስቃሴው በክልሉ ሁሉ መድረሱን ያሳያል፤ ‘በመላው’ ὅληνንም ይጠብቃል።
- source_word: τὰ δαιμόνια
  choice: አጋንንትን
  rationale: δαιμόνια በቀጥታ አጋንንትን ያመለክታል፤ አማርኛ በዚህ አጠቃላይ የተደጋጋሚ ድርጊት አውድ የግልጽነት አመልካች ሳይጨመር ‘አጋንንትን’ ማለትን ይመርጣል።
- source_word: ἐκβάλλων
  choice: ያስወጣ ነበር
  rationale: ἐκβάλλω በአጋንንት ማስወጣት አውድ ‘ማስወጣት/ማባረር’ ማለት ነው። ‘ያስወጣ ነበር’ ተደጋጋሚውን የአገልግሎት ድርጊት በግልጽ ያቀርባል።
