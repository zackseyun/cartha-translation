  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/003.yaml
  text: 'A voice of one crying out in the wilderness: ‘Prepare the way of the Lord[b][a]; make his paths straight,’'
translation:
  language: am
  text: በምድረ በዳ የሚጮኽ ሰው ድምፅ፦ “የጌታን[b] መንገድ አዘጋጁ፤ ጎዳናዎቹንም ቀጥ አድርጉ።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የኢሳይያስን ጥቅስ በሌላ ሥርዓተ ነጥብ በመከተል፦ «የሚጮኽ ሰው ድምፅ፦ “በምድረ በዳ የጌታን መንገድ አዘጋጁ፤ …”» ተብሎም ሊነበብ ይችላል።
    reason: alternative_reading
  - marker: b
    text: «ጌታ» የግሪኩን kyriou ይተረጉማል፤ ጥቅሱ ከኢሳይያስ 40፥3 የተወሰደ ሲሆን፣ በዕብራይስጡ ያህዌን (እግዚአብሔርን) ያመለክታል።
    reason: cross_reference
lexical_decisions:
- source_word: φωνὴ
  choice: ድምፅ
  rationale: φωνή እዚህ የሰውን ድምፅ ያመለክታል፤ በአማርኛም ተፈጥሯዊው አተረጓጎም «ድምፅ» ነው።
- source_word: βοῶντος
  choice: የሚጮኽ ሰው
  rationale: የግሪኩ የዝምድና ቦዝ አንቀጽ ከφωνή ጋር «የሚጮኽ ሰው ድምፅ» የሚል ግንኙነት አለው፤ «የሚጮኽ» የአዋጁን ኃይለኛ ጥሪ ይጠብቃል።
- source_word: ἐν τῇ ἐρήμῳ
  choice: በምድረ በዳ
  rationale: ἔρημος ሰው የማይኖርበትን ወይም በረሃማ ስፍራ ያመለክታል፤ «ምድረ በዳ» ከማርቆስ ዐውድና ከኢሳይያስ ጥቅስ ጋር የሚስማማ የተለመደ አገላለጽ ነው።
- source_word: Ἑτοιμάσατε
  choice: አዘጋጁ
  rationale: የብዙ ቁጥር ትእዛዙንና የቆራጥ ዝግጅት ጥሪውን በቀጥታ ያስተላልፋል።
- source_word: τὴν ὁδὸν
  choice: መንገድ
  rationale: ὁδός ቃል በቃል መንገድን ሲያመለክት ትንቢታዊውን ምሳሌያዊ ፍቺም ይሸከማል፤ «መንገድ» ሁለቱንም ይጠብቃል።
- source_word: κυρίου
  choice: የጌታን
  rationale: κύριος በግሪኩ «ጌታ» ሲሆን የዝምድና ቅርጹ በአማርኛ «የጌታን መንገድ» ተብሎ በተፈጥሮ ይተረጎማል።
- source_word: εὐθείας
  choice: ቀጥ
  rationale: εὐθύς እዚህ የሥነ ምግባር ቅንነትን ሳይሆን የጎዳናን ቀጥተኛነት ያመለክታል።
- source_word: ποιεῖτε
  choice: አድርጉ
  rationale: ከ«ቀጥ» ጋር «ቀጥ አድርጉ» የሚለው ዘመናዊና ተፈጥሯዊ የአማርኛ ትእዛዝ ነው።
- source_word: τὰς τρίβους αὐτοῦ
  choice: ጎዳናዎቹን
  rationale: τρίβος ከὁδός በመጠኑ የተለየ የመሄጃ ጎዳናን ያመለክታል፤ ብዙ ቁጥሩና αὐτοῦ የሚያመለክተው ባለቤትነት «ጎዳናዎቹን» በሚለው ተጠብቀዋል።
theological_decisions:
- issue: በዕብራይስጡ የያህዌን ስም በሚያመለክት የኢሳይያስ ጥቅስ ውስጥ κύριος እንዴት እንደሚተረጎም
  choice: ጌታ
  alternative: እግዚአብሔር
  rationale: ዋናው ጽሑፍ የግሪኩን κύριος በ«ጌታ» ያቀርባል፤ ጥቅሱ በኢሳይያስ 40፥3 ያህዌን እንደሚያመለክት በማስታወሻ ተገልጦ የግሪኩ አጠራርና የዕብራይስጡ ዳራ ሁለቱም ተጠብቀዋል።
- issue: «በምድረ በዳ» የሚለው ሐረግ ከየትኛው ክፍል ጋር እንደሚያያዝ
  choice: ከ«የሚጮኽ ሰው» ጋር
  alternative: ከ«የጌታን መንገድ አዘጋጁ» ጋር
  rationale: የማርቆስ ግሪክ አገባብ «በምድረ በዳ የሚጮኽ» የሚለውን ትስስር በተፈጥሮ ይደግፋል። ሆኖም የኢሳይያስ ጥቅሱ በሌላ ሥርዓተ ነጥብ ሊነበብ ስለሚችል አማራጩ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «ምድረ በዳ» የተለመደውን መጽሐፍ ቅዱሳዊ ድምፀት ሳያረጅ ይጠብቃል፤ ሁለቱ የሥርዓተ ነጥብ አማራጮችም ሳይደበቁ ቀርበዋል።
