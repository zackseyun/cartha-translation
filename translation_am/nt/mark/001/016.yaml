id: MRK.1.16
reference: Mark 1:16
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸂Καὶ παράγων⸃ παρὰ τὴν θάλασσαν τῆς Γαλιλαίας εἶδεν Σίμωνα καὶ Ἀνδρέαν τὸν ⸀ἀδελφὸν Σίμωνος ⸀ἀμφιβάλλοντας ἐν τῇ θαλάσσῃ, ἦσαν γὰρ ἁλιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/016.yaml
  text: And as he was passing along beside the Sea of Galilee, he saw Simon and Andrew, Simon’s brother, casting a net into the sea, for they were fishermen.
translation:
  language: am
  text: በገሊላ ባሕር ዳር ሲያልፍ፣ ስምዖንንና የስምዖንን ወንድም እንድርያስን መረብ ወደ ባሕሩ ሲጥሉ አየ፤ ዓሣ አጥማጆች ነበሩና።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ παράγων
  choice: ኢየሱስም … እያለፈ ሳለ
  rationale: የአሁን ጊዜ አሳታፊው ከዋናው ግስ εἶδεν ጋር በአንድ ጊዜ የሚከናወን ድርጊትን ያሳያል። በአማርኛ ግልጽ ለማድረግ ከአውዱ የተገነዘበው ባለቤት ‘ኢየሱስ’ ተጠቅሷል፤ ‘እያለፈ ሳለ’ ደግሞ ተጓዳኙን ድርጊት ይጠብቃል።
- source_word: παρὰ τὴν θάλασσαν
  choice: በ… ባሕር ዳር
  rationale: παρά ከአክዩዘቲቭ ጋር በዚህ አውድ በባሕሩ አጠገብ ወይም ዳር የሚደረግን እንቅስቃሴ ያመለክታል፤ ‘ባሕር ዳር’ ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
- source_word: τὴν θάλασσαν τῆς Γαλιλαίας
  choice: የገሊላ ባሕር
  rationale: θάλασσα ቃል በቃል ‘ባሕር’ ሲሆን የቦታውን የተለመደ ስያሜ ይጠብቃል።
- source_word: εἶδεν
  choice: አየ
  rationale: የὁράω ቀጥተኛ እና በቂ አቻ ሲሆን ተጨማሪ የትርጓሜ ሐሳብ አያስገባም።
- source_word: Σίμωνα καὶ Ἀνδρέαν
  choice: ስምዖንንና … እንድርያስን
  rationale: የግሪክ የግል ስሞች በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመዱትን ቅርጾች ይከተላሉ።
- source_word: τὸν ἀδελφὸν Σίμωνος
  choice: የስምዖንን ወንድም
  rationale: የዝምድናውን መለያ በተፈጥሯዊ የአማርኛ የባለቤትነት አወቃቀር ይገልጣል።
- source_word: ἀμφιβάλλοντας
  choice: መረብ ሲጥሉ
  rationale: ግሱ በተለይ የዓሣ ማጥመጃ መረብን መጣል ያመለክታል፤ ‘መረብ’ ማከል በቃሉ ፍቺ የተካተተውን ነገር በአማርኛ ግልጽ ያደርጋል።
- source_word: ἐν τῇ θαλάσσῃ
  choice: ወደ ባሕሩ
  rationale: ἐν በመሠረቱ ‘በ…ውስጥ’ ቢሆንም፣ ከመረብ መጣል ድርጊት ጋር የአማርኛ ተፈጥሯዊ አገላለጽ የእንቅስቃሴውን አቅጣጫ ‘ወደ ባሕሩ’ ብሎ ይገልጣል።
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: ዓሣ አጥማጆች ነበሩና
  rationale: γάρ ለድርጊታቸው ማብራሪያ ይሰጣል፤ በ‘-ና’ መደምደም ይህን ምክንያታዊ ኃይል በተፈጥሯዊና ክቡር የትረካ ቅኝት ያቀርባል።
