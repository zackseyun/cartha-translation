  to: በገሊላ ባሕር ዳር ሲያልፍ፣ ስምዖንንና የስምዖንን ወንድም እንድርያስን መረብ ወደ ባሕሩ ሲጥሉ አየ፤ ዓሣ አጥማጆች ነበሩና።
