lexical_decisions:
- source_word: Ἀρχὴ
  choice: መጀመሪያ
  rationale: ስም ብቻውን የቀረበበትን የግሪክ አጀማመር ሳይጨምር በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ሐረጉን ወደ ሙሉ ዓረፍተ ነገር አይለውጠውም።
