- source_word: χριστοῦ
  choice: መሲሑ
  rationale: Χριστός በዚህ መክፈቻ የኢየሱስን መሲሓዊ ማዕረግ የሚገልጽ ስለሆነ «መሲሕ» ተብሎ ተተርጉሟል፤ የአማርኛው «-ኡ» ማዕረጉን «መሲሑ» ብሎ በተፈጥሯዊ ሁኔታ ይወስነዋል።
theological_decisions:
- issue: Χριστοῦ እንደ ተተረጎመ ማዕረግ ወይስ እንደ ባህላዊ ስም መቅረቡ
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: በማርቆስ መክፈቻ Χριστός የኢየሱስን ማንነትና ሹመት የሚገልጽ ማዕረግ መሆኑን «መሲሑ» በግልጽ ያሳያል፤ ባህላዊው አማራጭ ግን በማስታወሻ ቀርቧል።
- issue: Ἰησοῦ የሚለው የባለቤትነት አገባብ የምሥራቹን ምንጭ ወይስ ይዘት እንደሚያመለክት
  choice: «የመሲሑ ኢየሱስ የምሥራች» የሚለውን ሰፊ የባለቤትነት አገባብ መጠቀም
  alternative: «ስለ መሲሑ ኢየሱስ የሚናገረው የምሥራች»
  rationale: የግሪኩ የባለቤትነት ቅርጽ የምሥራቹን ምንጭና ስለ ኢየሱስ መሆኑን ሁለቱንም ሊያካትት ይችላል። «ስለ» በማለት ወደ አንዱ ትርጉም ብቻ አልተወሰነም።
