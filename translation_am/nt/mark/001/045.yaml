id: MRK.1.45
reference: Mark 1:45
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ δὲ ἐξελθὼν ἤρξατο κηρύσσειν πολλὰ καὶ διαφημίζειν τὸν λόγον, ὥστε μηκέτι αὐτὸν δύνασθαι φανερῶς εἰς πόλιν εἰσελθεῖν, ἀλλὰ ἔξω ⸀ἐπ’ ἐρήμοις τόποις ἦν· καὶ ἤρχοντο πρὸς αὐτὸν ⸀πάντοθεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/045.yaml
  text: But after he went out, he began to proclaim widely and to spread the message, so that Jesus could no longer enter a town openly, but stayed outside in deserted places; and people were coming to him from everywhere.
translation:
  language: am
  text: እርሱ ግን ወጥቶ በስፋት ማወጅና መልእክቱን ማሰራጨት ጀመረ። ስለዚህ ኢየሱስ በግልጽ ወደ ከተማ መግባት ከእንግዲህ አልቻለም፤ ነገር ግን ከተማ ውጭ በሰው አልባ ስፍራዎች ይቆይ ነበር። ሰዎችም ከየአቅጣጫው ወደ እርሱ ይመጡ ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κηρύσσειν πολλὰ
  choice: ብዙ ማውራት
  rationale: ቃል በቃል ‘ብዙ መስበክ’ ሊባል ቢችልም፣ በዚህ አውድ የተፈወሰው ሰው በስፋት ስለ ሆነው ነገር መናገሩን ያመለክታል፤ የሥርዓታዊ ስብከት ትርጉም እንዳይጫን ‘ማውራት’ ተመርጧል።
- source_word: διαφημίζειν τὸν λόγον
  choice: ወሬውን በየቦታው ማሰራጨት
  rationale: διαφημίζειν ነገሩን በስፋት ማሰራጨትን ያሳያል፤ τὸν λόγον እዚህ በተፈጸመው ነገር ዙሪያ የተሰማውን ወሬ ያመለክታል።
- source_word: φανερῶς
  choice: በግልጽ
  rationale: ያለ መደበቅ፣ በሕዝብ ፊት በግልጽ መግባትን ያሳያል።
- source_word: ἐπ’ ἐρήμοις τόποις
  choice: ከከተማ ውጭ በሰው አልባ ስፍራዎች
  rationale: ἐρήμοις በዚህ ስፍራ ‘በረሃ’ ብቻ ሳይሆን ሰው የማይኖርበትን ወይም የተገለለን ስፍራ ያመለክታል፤ ἔξω የሚለውም ‘ከከተማ ውጭ’ በሚል ተገልጧል።
- source_word: ἤρχοντο ... πάντοθεν
  choice: ከየአቅጣጫው ... ይመጡ ነበር
  rationale: የኢምፐርፌክት ግስ ቀጣይነት ያለውን መምጣት ያሳያል፤ πάντοθεν ደግሞ ‘ከየአቅጣጫው’ ተብሎ ተፈጥሯዊ ተተርጉሟል።
theological_decisions:
- issue: በ μηκέτι αὐτὸν ውስጥ የ αὐτόν ተውላጠ ስም ማንነት
  choice: ኢየሱስ
  alternative: እርሱ
  rationale: በቅርብ ያለው የሰውየው ማጣቀሻ ግራ ሊያጋባ ስለሚችል፣ ወደ ከተማ መግባት ያልቻለው ኢየሱስ መሆኑ ከአውዱ ግልጽ ተደርጓል።
- issue: ἦν የሚያሳየው ሁኔታ
  choice: ይቆይ ነበር
  alternative: ነበር
  rationale: ግሱ የቆይታ ሁኔታን ያሳያል፤ ‘ይቆይ ነበር’ ተከታታይ መኖሩን በተፈጥሯዊ አማርኛ ያቀርባል፣ ተጨማሪ ሥነ መለኮታዊ ትርጉምም አይጭንም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ተከታታይ ድርጊት በ‘ጀመረ’፣ ‘ይቆይ ነበር’ እና ‘ይመጡ ነበር’ ተጠብቋል።
