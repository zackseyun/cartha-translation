  text: እንዲህ ብሎ ተናገረ፦ “ጊዜው ተፈጽሟል፤ የእግዚአብሔር መንግሥት[a] ቀርቧል። ንስሓ ግቡ፤ በምሥራቹም[b] እመኑ።”
  philosophy: optimal-equivalence
