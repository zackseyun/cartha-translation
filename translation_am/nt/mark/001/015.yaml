- source_word: καιρὸς
  choice: ጊዜው
  rationale: በዐውዱ የተወሰነውንና የተወጠነውን ወሳኝ ጊዜ ያመለክታል፤ ይህን ልዩ ገጽታ ዐውዱ ያብራራዋል።
- source_word: ἤγγικεν
  choice: ቀርቧል
  rationale: መቅረቡ ተከናውኖ አሁን ቅርብ መሆኑን የሚያሳየውን የፍጹም ጊዜ ገጽታ በአጭርና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: βασιλεία τοῦ θεοῦ
  choice: የእግዚአብሔር መንግሥት
  rationale: የቃሉን ሰፊ ትርጉምና መጽሐፍ ቅዱሳዊ ትስስር የሚጠብቅ የተለመደ አገላለጽ ነው፤ ‘ግዛት’ የሚለው አማራጭ በማስታወሻ ተጠቅሷል።
- source_word: μετανοεῖτε
  choice: ንስሓ ግቡ
  rationale: የአሳብና የሕይወት አቅጣጫ ወሳኝ ለውጥን የሚያመለክት፣ በአማርኛ ለሰፊው አንባቢ የታወቀና ክብር ያለው አገላለጽ ነው።
- source_word: πιστεύετε
  choice: እመኑ
  rationale: የግሪኩን ቀጥተኛ ትእዛዝ በመጠበቅ ማመንንና መታመንን ያካትታል።
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: በምሥራቹ
  rationale: εὐαγγέλιον በቀጥታ ‘መልካም ዜና/ምሥራች’ ማለት ነው፤ ‘ምሥራች’ ተፈጥሯዊና ተደራሽ ሲሆን ባህላዊው ‘ወንጌል’ በማስታወሻ ተጠብቋል።
- source_word: λέγων
  choice: እንዲህም እያለ … አለ
  rationale: ከቀደመው ትረካ ጋር ያለውን ተሳቢ ግንኙነት በተፈጥሯዊ የአማርኛ የንግግር አቀራረብ ያስተላልፋል።
