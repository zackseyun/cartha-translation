  text: καὶ ⸀εὐθὺς ἐκάλεσεν αὐτούς. καὶ ἀφέντες τὸν πατέρα αὐτῶν Ζεβεδαῖον ἐν τῷ πλοίῳ μετὰ τῶν μισθωτῶν ἀπῆλθον ὀπίσω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/020.yaml
  text: And immediately he called them[a], and leaving their father Zebedee in the boat with the hired workers, they went after him.
translation:
  language: am
  text: ወዲያውም ጠራቸው፤ እነርሱም አባታቸውን ዘብዴዎስን ከተቀጠሩ ሠራተኞች ጋር በጀልባው ውስጥ ትተው እርሱን ተከትለው ሄዱ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከእርሱ በኋላ ሄዱ።” የግሪኩ አገላለጽ ከእርሱ በስተኋላ መጓዝንም ሆነ ደቀ መዝሙር ሆኖ መከተል መጀመርን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: ወዲያውም
  rationale: የጊዜን አፋጣኝነት በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል፤ በማርቆስ ትረካ የሚታየውን የችኮላ ስሜትም ይጠብቃል።
- source_word: ἐκάλεσεν
  choice: ጠራቸው
  rationale: የκαλέωን ቀጥተኛ ትርጉም ይሰጣል፤ ‘አዘዛቸው’ የሚለውን ጠንካራ ሥልጣናዊ ሐሳብ ወይም ‘ጋበዛቸው’ የሚለውን ለስላሳ ሐሳብ አይጨምርም።
- source_word: ἀφέντες
  choice: ትተው
  rationale: ከዋናው ድርጊት በፊት የተፈጸመውን ተጓዳኝ ድርጊት በተፈጥሯዊ አማርኛ ያቀርባል፤ ‘ጥለው’ ሊያመጣ የሚችለውን አሉታዊ ፍቺ አያስገባም።
- source_word: πατέρα αὐτῶν Ζεβεδαῖον
  choice: አባታቸውን ዘብዴዎስን
  rationale: የዝምድናውን እና የሰው ስሙን በግልጽና በተለመደ የአማርኛ አገላለጽ ያቀርባል።
- source_word: πλοίῳ
  choice: ጀልባ
  rationale: በገሊላ የዓሣ ማጥመድ አውድ ውስጥ ከ‘መርከብ’ ይልቅ ተፈጥሯዊና ተመጣጣኝ ነው።
- source_word: μισθωτῶν
  choice: ከተቀጠሩ ሠራተኞች
  rationale: በደመወዝ ወይም በክፍያ የሚሠሩ ሰዎችን ያመለክታል፤ የቅጥር ሁኔታቸውን ያለ ተጨማሪ ግምት ይገልጻል።
- source_word: ἀπῆλθον ὀπίσω αὐτοῦ
  choice: እርሱን ተከትለው ሄዱ
  rationale: ከቀድሞ ቦታቸው መሄዳቸውንና ከኢየሱስ በኋላ መጓዛቸውን በተፈጥሯዊ አማርኛ ይገልጻል፤ ቃሉ ያለውን የአካላዊ መከተልና የደቀ መዝሙርነት ጥምር ገጽታ ይፈቅዳል።
theological_decisions:
- issue: በὀπίσω αὐτοῦ ውስጥ ያለው የደቀ መዝሙርነት ፍቺ
  choice: እርሱን ተከትለው ሄዱ
  alternative: ከእርሱ በኋላ ሄዱ
  rationale: የትረካውን አካላዊ እንቅስቃሴ እያሳየ የደቀ መዝሙርነትንም ፍቺ እንዲያስተጋባ ያደርጋል፤ ከሁለቱ አንዱን ብቻ አይወስንም።
