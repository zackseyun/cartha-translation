  text: Καὶ ἐγένετο ἐν ἐκείναις ταῖς ἡμέραις ἦλθεν Ἰησοῦς ἀπὸ Ναζαρὲτ τῆς Γαλιλαίας καὶ ἐβαπτίσθη ⸂εἰς τὸν Ἰορδάνην ὑπὸ Ἰωάννου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/009.yaml
  text: And it happened in those days that Jesus came from Nazareth of Galilee and was baptized in the Jordan by John[a].
translation:
  language: am
  text: በእነዚያም ቀናት ኢየሱስ ከገሊላ ከናዝሬት መጣ፤ በዮርዳኖስም በዮሐንስ ተጠመቀ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወደ ዮርዳኖስ።” የግሪኩ መስተዋድድ በይበልጥ ቃል በቃል እንዲህ ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο ἐν ἐκείναις ταῖς ἡμέραις
  choice: በዚያም ዘመን
  rationale: የግሪኩን የትረካ መሸጋገሪያና ጊዜያዊ አገላለጽ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል፤ ‘እንዲህም ሆነ’ የሚለውን ቃል በቃል መድገም በአማርኛ ከባድ ስለሚሆን የክስተት ማስገቢያ ኃይሉ በ‘ም’ ተጠብቋል።
- source_word: ἦλθεν
  choice: መጥቶ
  rationale: መሠረታዊውን የመምጣት እንቅስቃሴ ያሳያል፤ ከቀጣዩ ዋና ግስ ጋር ተፈጥሯዊ የአማርኛ ቅንብር ይፈጥራል።
- source_word: Ἰησοῦς
  choice: ኢየሱስ
  rationale: በዘመናዊ መደበኛ አማርኛ የተለመደው የስሙ አጻጻፍ ነው።
- source_word: ἀπὸ Ναζαρὲτ τῆς Γαλιλαίας
  choice: ከገሊላ ናዝሬት
  rationale: ናዝሬትን በገሊላ ውስጥ ያለች ስፍራ አድርጎ የሚለየውን የግሪክ አገላለጽ በአማርኛ የተለመደ የቦታ ስያሜ ቅደም ተከተል ያቀርባል።
- source_word: ἐβαπτίσθη
  choice: ተጠመቀ
  rationale: የግሪኩን ተደራጊ ድርጊት በተለመደው የአማርኛ መጽሐፍ ቅዱሳዊና ዘመናዊ ቃል ይተረጉማል፤ የጥምቀቱን ሥርዓታዊ መንገድ ከጽሑፉ በላይ አያጠብብም።
- source_word: εἰς τὸν Ἰορδάνην
  choice: በዮርዳኖስ
  rationale: የጥምቀቱን ቦታ በተፈጥሯዊ አማርኛ ያሳያል፤ εἰς የሚኖረው ‘ወደ/ውስጥ’ የሚል ይበልጥ ቃል በቃል አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ὑπὸ Ἰωάννου
  choice: በዮሐንስ
  rationale: በተደራጊ ግስ ውስጥ የድርጊቱን ፈጻሚ በቀጥታና በተፈጥሯዊ አማርኛ ያመለክታል።
theological_decisions:
- issue: በእምነት ቡድኖች መካከል ልዩ አቋም ሊያስከትል የሚችለውን βαπτίζω መተርጎም
  choice: ተጠመቀ
  alternative: ተዘፈቀ
  rationale: ‘ተጠመቀ’ ክስተቱን በታወቀው ስሙ ያቀርባል፤ ጥቅሱ በግልጽ ከሚናገረው በላይ የአፈጻጸም ዘዴውን አይወስንም።
- issue: εἰς በጥምቀት አውድ የሚያሳየው ቦታ ወይም እንቅስቃሴ
  choice: በዮርዳኖስ
  alternative: ወደ ዮርዳኖስ ውስጥ
  rationale: ዋናው ጽሑፍ የክስተቱን ቦታ በተፈጥሯዊ አማርኛ ያቀርባል፤ የግሪኩ መስተዋድድ ሊያሳየው የሚችለው ወደ ውስጥ እንቅስቃሴ ግን በአማራጭ ማስታወሻ አልተደበቀም።
