  register: ትርጉሙ አጭር፣ ክቡርና ለዘመናዊ አማርኛ አንባቢ ተፈጥሯዊ ነው። ‘በዚያም ዘመን’ የትረካውን ፍሰት ሳያከብድ ይጠብቃል፤ የቦታ ስሞቹም በተለመደው አማርኛ አጻጻፍ ቀርበዋል።
