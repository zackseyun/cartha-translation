  text: Καὶ ⸀εὐθὺς ἐκ τῆς συναγωγῆς ⸂ἐξελθόντες ἦλθον⸃ εἰς τὴν οἰκίαν Σίμωνος καὶ Ἀνδρέου μετὰ Ἰακώβου καὶ Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/029.yaml
  text: And immediately, after leaving the synagogue, they came into the house of Simon and Andrew, with James and John.
translation:
  language: am
  text: ወዲያውም፣ ከምኩራብ ወጥተው፣ ከያዕቆብና ከዮሐንስ ጋር ወደ ስምዖንና የእንድርያስ ቤት ገቡ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: ወዲያውም
  rationale: የማርቆስን ፈጣን የትረካ እንቅስቃሴ በተፈጥሯዊና በዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἐκ τῆς συναγωγῆς ἐξελθόντες
  choice: ከምኩራብ ወጥተው
  rationale: ἐκ የሚያመለክተውን ከውስጥ ወደ ውጭ መውጣትና የቀደመውን ድርጊት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἦλθον εἰς τὴν οἰκίαν
  choice: ወደ ... ቤት ገቡ
  rationale: መድረሻው ቤት በመሆኑ፣ ἦλθον እና εἰς የሚያሳዩትን ወደ ቤቱ መሄድና ወደ ውስጥ መግባት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: Σίμωνος καὶ Ἀνδρέου
  choice: የስምዖንና የእንድርያስ
  rationale: የዝምድና ቅጥያው ቤቱ ከሁለቱ ጋር ያለውን የባለቤትነት ወይም የመኖሪያ ግንኙነት ያሳያል።
- source_word: μετὰ Ἰακώβου καὶ Ἰωάννου
  choice: ከያዕቆብና ከዮሐንስ ጋር
  rationale: μετά ከዝርዝር ስም ጋር የሚያሳየውን አብሮነት በቀጥታ ይገልጻል።
- source_word: Σίμωνος / Ἀνδρέου / Ἰακώβου / Ἰωάννου
  choice: ስምዖን / እንድርያስ / ያዕቆብ / ዮሐንስ
  rationale: በአማርኛ መጽሐፍ ቅዱስ አጠቃቀም የተለመዱትንና ለአንባቢዎች የሚታወቁትን የስሞች ቅርጾች ይጠቀማል።
