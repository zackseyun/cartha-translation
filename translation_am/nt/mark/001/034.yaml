language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἐθεράπευσεν πολλοὺς κακῶς ἔχοντας ποικίλαις νόσοις, καὶ δαιμόνια πολλὰ ἐξέβαλεν, καὶ οὐκ ἤφιεν λαλεῖν τὰ δαιμόνια, ὅτι ᾔδεισαν ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/034.yaml
  text: And he healed many who were sick with various diseases[a], and he cast out many demons, and he would not allow the demons to speak, because they knew him.
translation:
  language: am
  text: እርሱም በተለያዩ በሽታዎች የታመሙ ብዙዎችን ፈወሰ፤ ብዙ አጋንንትንም አስወጣ። አጋንንቱም እርሱን ያውቁት ስለነበር እንዲናገሩ አይፈቅድላቸውም ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐθεράπευσεν
  choice: ፈወሰ
  rationale: θεραπεύω በዚህ የትረካ አውድ የታመሙትን ማዳንን ያመለክታል፤ «ፈወሰ» በዘመናዊ አማርኛ ተፈጥሯዊና የተለመደ ነው።
- source_word: πολλοὺς κακῶς ἔχοντας
  choice: የታመሙ ብዙዎችን
  rationale: κακῶς ἔχω የሚለው ፈሊጥ «መታመም» ማለት ስለሆነ፣ ቃል በቃል ከመተርጎም ይልቅ ትርጉሙ በተፈጥሯዊ አማርኛ ተገልጧል።
- source_word: ποικίλαις νόσοις
  choice: በተለያዩ በሽታዎች
  rationale: ποικίλος የዓይነት ልዩነትን፣ νόσος ደግሞ በሽታን ያመለክታሉ፤ ይህ አገላለጽ የግሪኩን መሣሪያዊ/ሁኔታዊ ዳቲቭ በግልጽ አማርኛ ያቀርባል።
- source_word: δαιμόνια πολλὰ ἐξέβαλεν
  choice: ብዙ አጋንንትንም አስወጣ
  rationale: ἐκβάλλω ከአጋንንት ጋር ሲጠቀስ በኃይል ማስወጣትን ያመለክታል፤ «አስወጣ» ትክክለኛና ተፈጥሯዊ ነው።
- source_word: οὐκ ἤφιεν
  choice: አይፈቅድላቸውም ነበር
  rationale: የግሪኩ ያልተፈጸመ የኃላፊ ጊዜ ቅርጽ በትዕይንቱ ውስጥ ቀጣይ ወይም ተደጋጋሚ ክልከላን ያሳያል፤ የአማርኛው «አይ…ም ነበር» ይህን ገጽታ ይጠብቃል።
- source_word: λαλεῖν
  choice: እንዲናገሩ
  rationale: λαλέω በቀጥታ «መናገር» ማለት ነው፤ የአማርኛው የተያያዥ ግስ ቅርጽ ከ«መፍቀድ» ጋር ተፈጥሯዊ ነው።
- source_word: ὅτι
  choice: ስለነበር
  rationale: ὅτι እዚህ የክልከላውን ምክንያት ይገልጣል፤ «ስለነበር» የምክንያት ግንኙነቱን በግልጽ ያሳያል።
- source_word: ᾔδεισαν αὐτόν
  choice: እርሱን ያውቁት
  rationale: ግሪኩ ቀጥተኛ ተሳቢ «እርሱን» ብቻ ይዟል፤ ይህ ትርጉም ማንነቱን የሚያብራራ ተጨማሪ ሐረግ ሳያስገባ የምንጩን አጭርነት ይጠብቃል።
theological_decisions:
- issue: የአጋንንቱን እውቀት ግልጽ የክርስቶስ ማንነት ኑዛዜ አድርጎ ማስፋት ወይም አለማስፋት
  choice: እርሱን ያውቁት ስለነበር
  alternative: ማን እንደሆነ ያውቁ ስለነበር / መሲሕ ወይም የእግዚአብሔር ልጅ መሆኑን ያውቁ ስለነበር
  rationale: ጥቅሱ በቀጥታ «እርሱን ያውቁት ነበር» ብቻ ይላል። ከአቅራቢያው አውድ የሚገኝን ዝርዝር ወደዚህ ጥቅስ አለማስገባት የጽሑፉን አሻሚነትና ሥነ መለኮታዊ ውጥረት ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ የትረካ ቋንቋ ይጠቀማል። «አይፈቅድላቸውም ነበር» የግሪኩን ያልተፈጸመ ገጽታ ይጠብቃል፤ «እርሱን ያውቁት» ደግሞ የምንጩን ቀጥተኛና አጭር አገላለጽ ያስቀራል። የእንግሊዝኛው የግርጌ ማስታወሻ ምልክት ከ«various diseases» በኋላ የተቀመጠ ቢሆንም ይዘቱ ስለ «they knew him» ነው፤ የአማርኛው ዋና ጽሑፍ ግሪኩን በቀጥታ ስለጠበቀ የግርጌ ማስታወሻ አልተጨመረም።
