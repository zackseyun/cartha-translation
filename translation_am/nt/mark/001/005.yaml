  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἐξεπορεύετο πρὸς αὐτὸν πᾶσα ἡ Ἰουδαία χώρα καὶ οἱ Ἱεροσολυμῖται ⸂πάντες, καὶ ἐβαπτίζοντο⸃ ⸂ὑπ’ αὐτοῦ ἐν τῷ Ἰορδάνῃ ποταμῷ⸃ ἐξομολογούμενοι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/005.yaml
  text: And all the Judean countryside and all the people of Jerusalem were going out to him, and they were being baptized by him in the Jordan River, confessing their sins.
translation:
  language: am
  text: የይሁዳ አገር ሰዎች ሁሉና የኢየሩሳሌም ነዋሪዎች ሁሉ ወደ እርሱ ይወጡ ነበር፤ ኃጢአታቸውንም እየተናዘዙ በዮርዳኖስ ወንዝ በእርሱ ይጠመቁ ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξεπορεύετο
  choice: ይወጡ ነበር
  rationale: ያልተፈጸመው የግስ አኳኋን በቀድሞ ጊዜ ቀጣይ ወይም ተደጋጋሚ ድርጊትን ያሳያል፤ ይህ አተረጓጎም ያንን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: πᾶσα ἡ Ἰουδαία χώρα
  choice: የይሁዳ አገር ሰዎች ሁሉ
  rationale: χώρα ክልልን ወይም ገጠራማ አገርን ያመለክታል። በግሪኩ አገሩ ወደ እርሱ እንደወጣ በወካይ አነጋገር ቢቀርብም፣ በአማርኛ ተፈጥሯዊ እንዲሆን ነዋሪዎቹ በግልጽ ተጠቅሰዋል።
- source_word: οἱ Ἱεροσολυμῖται πάντες
  choice: የኢየሩሳሌም ነዋሪዎች ሁሉ
  rationale: Ἱεροσολυμῖται የኢየሩሳሌም ነዋሪዎችን ያመለክታል፤ πάντες የሚለውም የቡድኑን አጠቃላይ ስፋት ይጠብቃል።
- source_word: ἐβαπτίζοντο
  choice: ይጠመቁ ነበር
  rationale: የግሱን ተደራጊ ድምፅና ቀጣይ/ተደጋጋሚ የቀድሞ ጊዜ አኳኋን ይጠብቃል።
- source_word: ὑπ’ αὐτοῦ
  choice: በእርሱ
  rationale: ስሙን በትርጉም ሳይጨምር በግሪኩ ያለውን ተውላጠ ስም ይጠብቃል።
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: በዮርዳኖስ ወንዝ
  rationale: ποταμός በግልጽ ‘ወንዝ’ ስለሚል ሙሉው የቦታ ሐረግ ተጠብቋል።
- source_word: ἐξομολογούμενοι
  choice: እየተናዘዙ
  rationale: ከጥምቀቱ ጋር አብሮ የሚከናወነውን ድርጊት ያሳያል፤ ‘መናዘዝ’ በዚህ አውድ ግልጽና የተለመደ ነው።
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: ኃጢአታቸውን
  rationale: የግሱን ቀጥተኛ ተሳቢና የባለቤትነት ግንኙነቱን በተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: ‘ሁሉ’ የሚለው ቃል በይሁዳና በኢየሩሳሌም ላይ ያለው ወሰን
  choice: ‘ሁሉ’ ተጠብቆ እንደ አጠቃላይ ቡድናዊ አነጋገር ክፍት ተደርጓል
  alternative: ‘ከይሁዳና ከኢየሩሳሌም ብዙዎች’ ብሎ ማለስለስ
  rationale: πᾶσα እና πάντες የጽሑፉን ጠንካራ አጠቃላይ አነጋገር ይፈጥራሉ፤ ትርጉሙ ይህን መጠበቅ አለበት፣ ነገር ግን የሒሳብ ፍጹምነትን አያስገድድም።
- issue: የጥምቀት ቃል የሚያመለክተው ሁኔታ
  choice: ‘ይጠመቁ’ ተብሎ በመተርጎም ዘዴው ወይም ሥነ መለኮታዊ ትርጉሙ አልተጨመረም
  alternative: ‘ይዘፈቁ’ ወይም ‘ይታጠቡ’ ብሎ መተርጎም
  rationale: ጥቅሱ ድርጊቱን ይዘግባል እንጂ የአፈጻጸሙን ዘዴ ወይም የኋለኛውን የእምነት ትርጓሜ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ አማርኛ ተጠቅሟል። የ‘ይወጡ ነበር’ እና ‘ይጠመቁ ነበር’ ቅርጾች የግሪኩን ቀጣይ/ተደጋጋሚ አኳኋን ያንጸባርቃሉ።
