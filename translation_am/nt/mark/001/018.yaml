  text: And immediately they left the nets and followed him[a].
translation:
  language: am
  text: ወዲያውም መረቦቹን ትተው ተከተሉት።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: -ም
  rationale: የግሪኩን ቀላል አያያዥ በአማርኛ ተፈጥሯዊ በሆነው ተያያዥ ቅጥያ ይገልጻል።
- source_word: εὐθὺς
  choice: ወዲያው
  rationale: ፈጣንነትንና አለመዘግየትን በዘመናዊና ግልጽ አማርኛ ያስተላልፋል።
- source_word: ἀφέντες
  choice: ትተው
  rationale: ከዋናው ግስ በፊት የተፈጸመውን የአኦሪስት አሳታፊ ድርጊት በተፈጥሯዊ የአማርኛ ተከታታይ ግስ ይገልጻል፤ ‘ጥለው’ ከሚለው ይልቅ ያልተጨመረ ስሜታዊ ኃይል አያስገባም።
- source_word: τὰ δίκτυα
  choice: መረቦቹን
  rationale: የግሪኩን የተወሰነ አመልካች ይጠብቃል፤ ‘መረቦቻቸውን’ በማለት በምንጩ ያልተገለጸውን የባለቤትነት ቅጥያ አይጨምርም።
- source_word: ἠκολούθησαν
  choice: ተከተሉ
  rationale: ቃሉ የሚያመለክተውን ቀጥተኛ መከተልና በዐውዱ ውስጥ የሚያድገውን የደቀ መዝሙርነት ፍቺ ሳያሰፋ ይጠብቃል።
- source_word: αὐτῷ
  choice: -ት
  rationale: የድርጊቱ ተቀባይ ኢየሱስ መሆኑን በተፈጥሯዊ የአማርኛ ተውላጠ ስም ቅጥያ ይገልጻል፤ ስሙን በመድገም ምንጩን አያሰፋም።
theological_decisions:
- issue: በἠκολούθησαν ውስጥ ያለው የደቀ መዝሙርነት ፍቺ
  choice: ተከተሉት
  alternative: ደቀ መዛሙርቱ ሆኑ / ከእርሱ ጋር ሄዱ
  rationale: ቀጥተኛውን የመከተል ድርጊትና ከዐውዱ የሚገኘውን የደቀ መዝሙርነት ጥልቅ ፍቺ አብሮ ይጠብቃል፤ ትርጉሙን ‘ደቀ መዛሙርቱ ሆኑ’ ብሎ አይፈታውም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ። አጭር የትረካ ፍሰቱና የማርቆስ አፋጣኝነት ተጠብቀዋል። የእንግሊዝኛው ‘at once’ ማስታወሻ ከ‘ወዲያው’ ጋር በአማርኛ እጅግ የተቀራረበ ተመሳሳይ አማራጭ ስለሆነ የተለየ ጠቃሚ መረጃ አይጨምርም፤ ስለዚህ የግርጌ ማስታወሻ አልተጨመረም።
