id: MRK.1.8
reference: Mark 1:8
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀ἐγὼ ἐβάπτισα ⸀ὑμᾶς ὕδατι, αὐτὸς δὲ βαπτίσει ὑμᾶς ⸀ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/008.yaml
  text: I baptized you with water[a], but he will baptize you with the Holy Spirit.
translation:
  language: am
  text: እኔ በውሃ አጠመቅኋችሁ፤ እርሱ ግን በመንፈስ ቅዱስ[a] ያጠምቃችኋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በመንፈስ ቅዱስ ውስጥ።» የግሪኩ መስተዋድድ በሁለቱም መንገድ ሊተረጎም ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ
  choice: እኔ
  rationale: ግልጽ ተውላጠ ስሙ በዮሐንስና በሚመጣው አካል መካከል ያለውን አጽንዖታዊ ንጽጽር ለማስጠበቅ ተተርጉሟል።
- source_word: ἐβάπτισα
  choice: አጠመቅኋችሁ
  rationale: βαπτίζω የሚያመለክተውን የጥምቀት ተግባር የሚጠብቅ መደበኛና በዘመናዊ አማርኛ የተለመደ አገላለጽ ነው፤ የብዙ ቁጥር ተሳቢውንም በግሱ ውስጥ ያሳያል።
- source_word: ὕδατι
  choice: በውሃ
  rationale: የግሪኩ ዳቲቭ መሣሪያን ወይም የድርጊቱን ስፍራ/ክልል ሊያመለክት ይችላል፤ «በውሃ» ይህን ሁለትዮሽ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: αὐτὸς δὲ
  choice: እርሱ ግን
  rationale: αὐτός ያለውን አጽንዖትና δέ ያለውን ንጽጽር በቀጥታ ይጠብቃል።
- source_word: βαπτίσει
  choice: ያጠምቃችኋል
  rationale: የወደፊት ጊዜውንና ከመጀመሪያው ግስ ጋር ያለውን የቃል ተከታታይነት ይጠብቃል።
- source_word: ἐν
  choice: በ
  rationale: ἐν እዚህ «በ…» የሚል የመሣሪያ ወይም የክልል ፍቺ ሊኖረው ይችላል፤ የአማርኛው «በ» ሁለቱንም ሳይገድብ ይይዛል።
- source_word: πνεύματι ἁγίῳ
  choice: መንፈስ ቅዱስ
  rationale: በማርቆስ አውድ ይህ ሐረግ መለኮታዊውን መንፈስ ቅዱስ በተፈጥሯዊ ሁኔታ ያመለክታል፤ የተለመደው አማርኛ ስያሜ ተጠብቋል።
theological_decisions:
- issue: πνεύματι ἁγίῳ መለኮታዊውን መንፈስ ቅዱስ ወይስ ግላዊ ያልሆነ ቅዱስ ኃይል ያመለክታል?
  choice: መንፈስ ቅዱስ
  alternative: ቅዱስ መንፈስ / አንድ ቅዱስ መንፈስ
  rationale: ዮሐንስ የራሱን የውሃ ጥምቀት ከሚመጣው ብርቱ አካል ጥምቀት ጋር በሚያነጻጽርበት በዚህ አውድ፣ ሐረጉ በተፈጥሯዊ ሁኔታ መለኮታዊውን መንፈስ ቅዱስ ያመለክታል።
- issue: ἐν በመሣሪያዊ ወይስ በክልላዊ ፍቺ መተርጎም
  choice: በመንፈስ ቅዱስ
  alternative: በመንፈስ ቅዱስ ውስጥ
  rationale: «በ» በአማርኛ መሣሪያዊውን «በመንፈስ ቅዱስ» እና ክልላዊውን «በመንፈስ ቅዱስ ውስጥ» የሚሉትን አቅጣጫዎች ሳያጠብ ሊይዝ ይችላል፤ አማራጩ በማስታወሻ ተገልጿል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «እኔ … እርሱ ግን» የሚለው አወቃቀር የግሪኩን አጽንዖታዊ ንጽጽር ይጠብቃል፤ «በ» ደግሞ የἐνን እውነተኛ የፍቺ ስፋት ያለ አላስፈላጊ መወሰን ያቀርባል።
