base_translation:
  language: en
  yaml_path: translation/nt/mark/001/030.yaml
  text: Simon’s mother-in-law was lying sick with a fever[b][a], and immediately they told him about her.
translation:
  language: am
  text: የስምዖን አማት ትኩሳት ይዟት ተኝታ ነበር፤ ወዲያውም ስለ እሷ ነገሩት።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክ ቃል በቃል «ስለ እሷ ይነግሩታል» ይላል፤ ይህ ያለፈውን ክስተት ሕያው አድርጎ ለመተረክ የተጠቀመ ታሪካዊ የአሁን ጊዜ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: πενθερὰ
  choice: አማት
  rationale: ቃሉ የስምዖንን የትዳር ዝምድና እናት፣ በዚህ አውድ የሚስቱን እናት፣ ያመለክታል። «አማት» በዘመናዊ አማርኛ ተፈጥሯዊና አጭር ነው።
- source_word: κατέκειτο
  choice: ተኝታ ነበር
  rationale: የግሱን ቀጣይ ያለፈ ሁኔታ ይጠብቃል፤ ከምንጩ በላይ በማጠናከር «አልጋ ላይ ወድቃ ነበር» አይልም።
- source_word: πυρέσσουσα
  choice: ትኩሳት ይዟት
  rationale: ትኩሳት እንደነበረባት በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: εὐθὺς
  choice: ወዲያውም
  rationale: በማርቆስ ትረካ የተደጋገመውን ፈጣንነትና የትረካ እንቅስቃሴ ይጠብቃል።
- source_word: λέγουσιν
  choice: ነገሩት
  rationale: በግሪክ ያለውን ታሪካዊ የአሁን ጊዜ በአማርኛ ተፈጥሯዊ በሆነ ያለፈ ጊዜ ያቀርባል፤ የምንጩ ቅርጽ በማስታወሻ ተገልጧል።
- source_word: περὶ αὐτῆς
  choice: ስለ እሷ
  rationale: «ስለ» ከተውላጠ ስሙ ጋር የግሪኩን ‘ስለ እሷ/እሷን አስመልክቶ’ የሚል ትርጉም በግልጽ ሁኔታ ያስተላልፋል።
- source_word: δὲ
  choice: በአማርኛ የአንቀጹ ሽግግር
  rationale: እዚህ δέ ጠንካራ ተቃርኖ ሳይሆን ቀላል የትረካ ማገናኛ ነው። «ግን» ማለት ያልተፈለገ ተቃርኖ ሊጨምር ስለሚችል፣ ተግባሩ በአማርኛው የአንቀጽ ሽግግር ተወክሏል።
