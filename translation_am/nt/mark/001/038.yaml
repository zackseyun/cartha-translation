base_translation:
  language: en
  yaml_path: translation/nt/mark/001/038.yaml
  text: And he said to them[a], “Let us go elsewhere, to the neighboring towns, so that I may preach there also[b], for that is why I came out.”
translation:
  language: am
  text: እርሱም፣ “ወደ ሌላ ስፍራ፣ ወደ አቅራቢያ ወዳሉት ታናናሽ ከተሞች[a] እንሂድ፤ በዚያም ደግሞ እንድሰብክ፤ የወጣሁት ለዚህ ነውና[b]” አላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪኩ ቃል ከመንደር የሚበልጡና ከከተማ የሚያንሱ ሰፈሮችን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ለዚህ ዓላማ ወጣሁ።” ሐረጉ ኢየሱስ አሁን ካለበት ስፍራ መውጣቱን ብቻ ወይም ለስብከት የመውጣቱን ሰፊ ዓላማ ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄγωμεν
  choice: እንሂድ
  rationale: የመጀመሪያ መደብ ብዙ ቁጥር አበረታች ንዑስ አንቀጽ ሲሆን፣ ‘እንሂድ’ የሚለው ግብዣዊ ኃይሉን በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἀλλαχοῦ
  choice: ወደ ሌላ ስፍራ
  rationale: አሁን ካሉበት ስፍራ ወደ ሌላ ቦታ መሄድን በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἐχομένας
  choice: በአቅራቢያ ወዳሉት
  rationale: በዐውዱ ያለውን የአጎራባችነትና የቅርበት አገላለጽ ያስተላልፋል።
- source_word: κωμοπόλεις
  choice: ታናናሽ ከተሞች
  rationale: ቃሉ ከመንደር የሚበልጡ ነገር ግን ከትልቅ ከተማ የሚያንሱ ሰፈሮችን ሊያመለክት ስለሚችል፣ ይህ ምርጫ ለዘመናዊ አንባቢ ግልጽ ሆኖ የመጠኑን ልዩነት ያሳያል።
- source_word: ἵνα καὶ ἐκεῖ κηρύξω
  choice: በዚያም ደግሞ እንድሰብክ
  rationale: ἵνα የዓላማ አገላለጽ ሲሆን፣ ‘እንድሰብክ’ ዓላማውን፣ ‘በዚያም ደግሞ’ ደግሞ καὶ ἐκεῖ ያለውን አጽንዖት ይጠብቃሉ።
- source_word: εἰς τοῦτο
  choice: ለዚህ ነውና
  rationale: የምክንያትና የዓላማ ሐረጉን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐξῆλθον
  choice: የወጣሁት
  rationale: ቃል በቃል ያለውን ‘ወጣሁ’ የሚለውን ፍቺ ይጠብቃል፤ ከአሁኑ ስፍራ መውጣቱን ወይም ለስብከት የመውጣቱን ሰፊ ዓላማ መጥቀሱን አይወስንም።
- source_word: λέγει αὐτοῖς
  choice: አላቸው
  rationale: የግሪኩን ታሪካዊ የአሁን ጊዜ አገላለጽ በአማርኛ ትረካ ውስጥ ተፈጥሯዊ በሆነ ያለፈ ጊዜ ያቀርባል።
theological_decisions:
- issue: የἐξῆλθον ወሰን
  choice: ‘የወጣሁት’ ተብሎ በአጠቃላይ ተተርጉሟል።
  alternative: ‘ከዚህ ስፍራ የወጣሁት’ ወይም ‘ለዚህ ተልእኮ የመጣሁት’
  rationale: ግሪኩ ኢየሱስ ካለበት ቦታ መውጣቱን ብቻ ሊያመለክት ይችላል፤ በሰፊውም ለስብከት መውጣቱን ሊጠቁም ይችላል። ትርጉሙ ከሁለቱ አንዱን በመወሰን ትርጉማዊ ወይም አስተምህሯዊ ጭማሪ አያደርግም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ጥቅም ላይ ውሏል። የግሪኩ አጭር ንግግርና የዓላማ አወቃቀር ተጠብቋል፤ የግርጌ ማስታወሻዎቹም ከሚያብራሩት ቃል ወይም ሐረግ ቀጥለው ተቀምጠዋል።
