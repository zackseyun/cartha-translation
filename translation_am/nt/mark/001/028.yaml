  yaml_path: translation/nt/mark/001/028.yaml
  text: And the news about him went out at once everywhere into the whole surrounding region of Galilee[a][b].
translation:
  language: am
  text: ስለ እርሱ የተሰማው ዜና[a] ወዲያው በገሊላ ዙሪያ ባለው አካባቢ ሁሉ ተሰራጨ[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ስለ እርሱ የተነገረው ዘገባ” ወይም “ዝናው።”
    reason: lexical_alternative
  - marker: b
    text: በቀጥታ፣ “በየስፍራው ወደ ገሊላ ዙሪያ ባለው አካባቢ ሁሉ ወጣ።”
    reason: literal_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: ወጣ
  rationale: የἐξέρχομαιን የመውጣት ምስል ይጠብቃል፤ ከወሬ ጋርም በአማርኛ ተፈጥሯዊ ነው።
- source_word: ἀκοὴ
  choice: የተሰማው ወሬ
  rationale: ቃሉ የተሰማን ዜና ወይም ወሬ ያመለክታል፤ ይህ አተረጓጎም ከዝና ይልቅ የሚዘዋወረውን ዘገባ ያጎላል።
- source_word: αὐτοῦ
  choice: ስለ እርሱ
  rationale: ዘርፉ የወሬውን ይዘት፣ ማለትም ወሬው ስለ ኢየሱስ መሆኑን፣ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: εὐθὺς
  choice: ወዲያው
  rationale: በማርቆስ ተደጋግሞ የሚታየውን ፈጣንነት በግልጽና በዘመናዊ አማርኛ ይገልጣል።
- source_word: πανταχοῦ
  choice: በየስፍራው
  rationale: ‘በሁሉም ስፍራ’ የሚለውን ስፋት በአጭርና ተፈጥሯዊ አገላለጽ ያስተላልፋል።
- source_word: περίχωρον
  choice: ዙሪያ
  rationale: በአንድ ቦታ ዙሪያ ያለውን አካባቢ ያመለክታል፤ የገጠር ትርጉምን ሳይጨምር የጂኦግራፊውን ሐሳብ ይጠብቃል።
- source_word: εἰς ὅλην τὴν περίχωρον τῆς Γαλιλαίας
  choice: ወደ ገሊላ ዙሪያ ሁሉ
  rationale: εἰς ያለውን የአቅጣጫና የመስፋፋት ሐሳብ ‘ወደ’ በማለት፣ ὅλην ያለውን ሙሉ ወሰን ደግሞ ‘ሁሉ’ በማለት ይጠብቃል።
theological_decisions:
- issue: የἀκοὴ αὐτοῦ ትርጉም
  choice: ስለ እርሱ የተሰማው ወሬ
  alternative: ዝናው
  rationale: አውዱ ሰዎች ስለ ኢየሱስ የሰሙት ዘገባ በፍጥነት መሰራጨቱን ያሳያል። ‘ዝናው’ ሊባል ቢችልም ቃሉ በራሱ ከሚጠይቀው በላይ የታዋቂነት ሐሳብ ሊጨምር ይችላል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ወጣ’ የግሪኩን የእንቅስቃሴ ምስል ሲጠብቅ፣ አማራጩ ‘ተሰራጨ’ ትርጉሙን በይበልጥ ፈሊጣዊ አማርኛ ያሳያል።
