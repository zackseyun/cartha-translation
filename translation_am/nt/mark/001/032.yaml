  text: Ὀψίας δὲ γενομένης, ὅτε ⸀ἔδυ ὁ ἥλιος, ἔφερον πρὸς αὐτὸν πάντας τοὺς κακῶς ἔχοντας καὶ τοὺς δαιμονιζομένους·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/032.yaml
  text: When evening came[a], when the sun had set[d][c][b], they brought to him all who were sick and those who were demon-possessed.
translation:
  language: am
  text: ማታ በሆነ ጊዜ፣ ፀሐይም በጠለቀች ጊዜ፣[a] የታመሙትን ሁሉና አጋንንት የያዛቸውን[b] ወደ እርሱ ያመጡ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ፀሐይ ከጠለቀች በኋላ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በአጋንንት የተጨነቁትን።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: ማታ በሆነ ጊዜ
  rationale: የግሪኩን ጊዜ አመልካች የጄኒቲቭ አብሶሉት አወቃቀር በተፈጥሯዊና ግልጽ አማርኛ ያስተላልፋል።
- source_word: ὅτε ἔδυ ὁ ἥλιος
  choice: ፀሐይም በጠለቀች ጊዜ
  rationale: ὅτε የሚያመለክተውን የጊዜ ግንኙነት በቅርብ ይጠብቃል፤ የአማርኛው አውድም ድርጊቱ ከፀሐይ መጥለቅ ጋር መያያዙን ግልጽ ያደርጋል።
- source_word: ἔφερον
  choice: ያመጡ ነበር
  rationale: ያልተጠቀሰውን ብዙ ቁጥር ባለቤት ሳይጨምር፣ የኢምፐርፌክት ግሡን ቀጣይነት ወይም ተደጋጋሚነት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: πρὸς αὐτὸν
  choice: ወደ እርሱ
  rationale: πρός ከአኩዛቲቭ ጋር የሚገልጸውን ወደ ሰው መቅረብ ወይም መምጣት በቀጥታ ያስተላልፋል፤ በግሪኩ ያልተደገመውን ‘ኢየሱስ’ አይጨምርም።
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: የታመሙትን ሁሉ
  rationale: πάντας ያለውን ሁሉን አቀፍ ኃይል ይጠብቃል፤ κακῶς ἔχοντας የሚለውን ፈሊጣዊ አገላለጽ በዘመናዊና ቀላል አማርኛ ይገልጻል።
- source_word: τοὺς δαιμονιζομένους
  choice: አጋንንት የያዛቸውን
  rationale: ጽሑፉ የሚጠቅሰውን እውነተኛ የአጋንንት ተጽእኖ ሳያቀልል በተለመደና ለአንባቢ ግልጽ በሆነ አማርኛ ያቀርባል።
theological_decisions:
- issue: δαιμονιζομένους የሚለውን ቃል የአጋንንትን እንቅስቃሴ ሳይክድና ከግሪኩ በላይ ዝርዝር ሳይጨምር መተርጎም
  choice: አጋንንት የያዛቸውን
  alternative: በአጋንንት የተጨነቁትን
  rationale: የተመረጠው አገላለጽ የግሪኩን ጠንካራ ትርጉም በተለመደ አማርኛ ይጠብቃል፤ አማራጩ ግን ተጽእኖውን ከሚገባው በታች ሊያቀርበው ይችላል።
- issue: የἔφερονን ኢምፐርፌክት ገጽታ መጠበቅ
  choice: ያመጡ ነበር
  alternative: አመጡ
  rationale: ‘ያመጡ ነበር’ ድርጊቱ በዚያ ጊዜ እየተካሄደ ወይም ተደጋግሞ እንደነበር ያሳያል፤ ‘አመጡ’ የትረካውን ገጽታ ያጠፋጥፋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። ‘ያመጡ ነበር’ የቀጣይ ድርጊትን ገጽታ ይጠብቃል፤ የጊዜው ሁለት ሐረጎችም የምንጩን ድግግሞሽና አጽንዖት ይዘዋል።
