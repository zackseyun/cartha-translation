  rationale: ግሱ ተራ ፍለጋን ብቻ ሳይሆን በትጋት ተከታትሎ መፈለግን ሊያመለክት ይችላል። «አጥብቀው ፈለጉት» ይህን ጥንካሬ በተፈጥሯዊ አማርኛ ያስተላልፋል።
