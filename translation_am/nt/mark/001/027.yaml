  text: καὶ ἐθαμβήθησαν ⸀ἅπαντες, ὥστε συζητεῖν ⸂πρὸς ἑαυτοὺς⸃ λέγοντας· Τί ἐστιν τοῦτο; ⸂διδαχὴ καινή⸃· κατ’ ἐξουσίαν καὶ τοῖς πνεύμασι τοῖς ἀκαθάρτοις ἐπιτάσσει, καὶ ὑπακούουσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/027.yaml
  text: And they were all amazed[a], so that they discussed among themselves, saying, “What is this? A new teaching with authority! He even commands the unclean spirits, and they obey him.”
translation:
  language: am
  text: ሁሉም እጅግ ተደነቁ፤ ከዚህም የተነሣ እርስ በርሳቸው፣ “ይህ ምንድን ነው? አዲስ ትምህርት—በሥልጣን! ርኩሳን መናፍስትን እንኳ ያዛቸዋል፤ እነርሱም ይታዘዙለታል” እያሉ ተወያዩ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ይህ ምንድን ነው? አዲስ ትምህርት በሥልጣን?” የግሪኩ ጽሑፍ ሥርዓተ ነጥብ ‘አዲስ ትምህርት’ የሚለውን ከጥያቄው ጋር በቀጥታ እንዲያያዝ ሊፈቅድ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐθαμβήθησαν
  choice: እጅግ ተደነቁ
  rationale: ግሱ በድንጋጤ የተቀላቀለ ከፍተኛ መደነቅን ያመለክታል፤ ይህ አገላለጽ በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: ἅπαντες
  choice: ሁሉም
  rationale: የቡድኑን ሙሉ ምላሽ በአጭርና ተፈጥሯዊ መንገድ ይገልጣል።
- source_word: ὥστε συζητεῖν πρὸς ἑαυτούς
  choice: እርስ በርሳቸውም … እያሉ ተወያዩ
  rationale: ὥστε ውጤትን ያሳያል፤ συζητεῖν ግን ከጠላትነት ይልቅ የጋራ ውይይትን ሊያመለክት ስለሚችል ‘ተወያዩ’ ተመርጧል።
- source_word: Τί ἐστιν τοῦτο;
  choice: ይህ ምንድን ነው?
  rationale: የግሪኩን አጭርና ድንገተኛ ጥያቄ በቀጥታ ያስተላልፋል።
- source_word: διδαχὴ καινή
  choice: አዲስ ትምህርት
  rationale: ‘ትምህርት’ ከቴክኒካዊው ‘አስተምህሮ’ ይልቅ በዚህ ትረካዊ አውድ ለሕዝብ ተፈጥሯዊና ግልጽ ነው።
- source_word: κατ’ ἐξουσίαν
  choice: በሥልጣን የሚቀርብ
  rationale: የሥልጣንን ባሕርይ ከትምህርቱ ጋር ያገናኛል፤ ነገር ግን የሐረጉን ሰፊ ተፅዕኖ በማስታወሻ ይጠብቃል።
- source_word: τοῖς πνεύμασι τοῖς ἀκαθάρτοις
  choice: ርኩሳን መናፍስትን
  rationale: ‘ርኩስ’ የἀκάθαρτοςን ሃይማኖታዊና ሥነ ምግባራዊ ክብደት የሚጠብቅ የተለመደ የመጽሐፍ ቅዱስ አማርኛ ነው።
- source_word: ἐπιτάσσει
  choice: ያዛቸዋል
  rationale: እዚህ ‘ማዘዝ’ የሥልጣን ትእዛዝን በግልጽ ይገልጣል፤ ተውላጠ ስሙ የተጨመረው ተፈጥሯዊ አማርኛን ለመፍጠር ነው።
- source_word: ὑπακούουσιν αὐτῷ
  choice: ይታዘዙለታል
  rationale: ለትእዛዙ የሚሰጠውን ታዛዥ ምላሽ በግልጽ ያሳያል።
theological_decisions:
- issue: ‘በሥልጣን’ የሚለው ሐረግ ከየትኛው የአረፍተ ነገሩ ክፍል ጋር እንደሚያያዝ
  choice: በዋናው ጽሑፍ ከ‘አዲስ ትምህርት’ ጋር አያይዞ ‘በሥልጣን የሚቀርብ አዲስ ትምህርት’ ተብሏል።
  alternative: ሙሉውን ‘ይህ ምንድን ነው? ይህ በሥልጣን የሚቀርብ አዲስ ትምህርት ምንድን ነው?’ ብሎ እንደ ጥያቄ ማንበብ፣ ወይም ‘በሥልጣን’ን በተለይ ከመናፍስትን ማዘዙ ጋር ማያያዝ።
  rationale: የግሪኩ ሥርዓተ ነጥብና አገባብ ከአንድ በላይ ንባብን ይፈቅዳሉ። ዋናው ትርጉም ተፈጥሯዊውን የአማርኛ ንባብ ይከተላል፤ አማራጩ ግን በማስታወሻ ተጠብቋል።
