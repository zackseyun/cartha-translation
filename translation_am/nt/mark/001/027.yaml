  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። ‘ርኩሳን መናፍስት’ የተለመደውን መጽሐፍ ቅዱሳዊ ቃላት ይጠብቃል፤ ሌሎቹ አገላለጾች ግን ለዛሬ አንባቢ ተፈጥሯዊ እንዲሆኑ ተደርገዋል።
