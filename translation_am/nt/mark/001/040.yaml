base_translation:
  language: en
  yaml_path: translation/nt/mark/001/040.yaml
  text: And a man with leprosy comes to him[a], pleading with him and kneeling, and saying to him, “If you are willing[d][c][b], you are able to make me clean.”
translation:
  language: am
  text: አንድ በለምጽ የተያዘ ሰውም[a] ወደ እርሱ መጥቶ፣ እየለመነው[b] ተንበርክኮ፣ “ብትፈቅድ ንጹሕ ልታደርገኝ[c] ትችላለህ” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አንድ ለምጻም።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “እየተማጸነው።”
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “ልታነጻኝ።” የግሪክኛው ግስ ከርኩሰት መንጻትንም ሆነ የሰውነት መመለስን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: λεπρὸς
  choice: በለምጽ የተያዘ ሰው
  rationale: ሰውነቱን በማስቀደም ግለሰቡን የማያዋርድ ዘመናዊ አገላለጽ ሲሆን፣ በግሪክኛው በስም ምትክ የተጠቀመውን ቅጽል ትርጉም ይጠብቃል።
- source_word: παρακαλῶν
  choice: እየለመነው
  rationale: በዚህ የፈውስ አውድ ውስጥ ያለውን አጥብቆ የመጠየቅ ስሜት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: γονυπετῶν
  choice: ተንበረከከና
  rationale: የተንበርካኪነትን አቋም በግልጽና ተፈጥሯዊ መንገድ ይገልጻል።
- source_word: Ἐὰν θέλῃς
  choice: ብትፈቅድ
  rationale: የኢየሱስን ፈቃደኛነት የሚመለከተውን ሁኔታዊ ልመና ይጠብቃል፤ እንደ ተራ የወደፊት ጊዜ አይተረጉመውም።
- source_word: δύνασαί
  choice: ትችላለህ
  rationale: የችሎታንና የኃይልን ሐሳብ በዘመናዊ መደበኛ አማርኛ በቀጥታ ይገልጻል።
- source_word: καθαρίσαι
  choice: ንጹሕ ልታደርገኝ
  rationale: ከሥጋዊ መመለስና ከሥርዓታዊ ርኩሰት መንጻት ጋር ያለውን ድርብ ጥላ ሳያጠብ የግሪክኛውን ቀጥተኛነት ይጠብቃል።
- source_word: ἔρχεται
  choice: መጥቶ
  rationale: የማርቆስን ታሪካዊ የአሁን ጊዜ በአማርኛ የትረካ ፍሰት ተፈጥሯዊ በሆነ ተከታታይ ግስ ያቀርባል፤ ቃል በቃል የአሁን ጊዜ መጠቀም በአማርኛ እንግዳ ይሆናል።
