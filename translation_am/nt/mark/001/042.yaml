lexical_decisions:
- source_word: εὐθὺς
  choice: ወዲያውም
  rationale: የድርጊቱን ፈጣንነትና በማርቆስ ትረካ የሚታየውን አጣዳፊነት በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἀπῆλθεν ἀπ’ αὐτοῦ
  choice: ከእርሱ ለቀቀ
  rationale: በግሪኩ ለምጹ የግሱ ባለቤት ሆኖ ‘ከእርሱ ሄደ’ የሚለውን ሐሳብ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἡ λέπρα
  choice: ለምጹ
  rationale: ባሕላዊውን የመጽሐፍ ቅዱስ ቃል ይጠብቃል፤ ቃሉ ከዘመናዊው የሃንሰን በሽታ የሰፋ የቆዳ በሽታ ምድብን ሊያመለክት የሚችል ቢሆንም በዋናው ጽሑፍ ሰፋ ያለ ትርጓሜ አልተጨመረም።
- source_word: ἐκαθαρίσθη
  choice: ነጻ
  rationale: የግሪኩን ተደራጊ ቅርጽ ይጠብቃል፤ በአውዱም ከአካላዊ መዳን ባሻገር ከሥርዓታዊ ርኩሰት መንጻትን ያስተጋባል።
theological_decisions:
- issue: ἐκαθαρίσθη የሚያመለክተው የአካል ፈውስና የሥርዓት ንጽሕና ግንኙነት
  choice: ነጻ
  alternative: ተፈወሰ
  rationale: ‘ተፈወሰ’ አካላዊ ማገገሙን ብቻ ሊያጎላ ይችላል፤ ‘ነጻ’ ግን በለምጽ አውድ ያለውን የአካልና የሥርዓት ንጽሕና ድርብ ትርጉም ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ሁለት ተከታታይ ሐረጎች እና የተደራጊው ግስ አቅጣጫ ተጠብቀዋል።
