    rationale: ἐν τῷ Ἠσαΐᾳ τῷ προφήτῃ identifies Isaiah as prophet; it does not contain a noun meaning “book.” The addition is not required for idiomatic Amharic and slightly expands the source.
  - severity: medium
    issue: The clause translating ὃς κατασκευάσει is rendered as a present relative phrase, “የሚያዘጋጅ.”
    rationale: κατασκευάσει is future. “እርሱም … ያዘጋጃል” preserves both the relative reference and the future force naturally.
