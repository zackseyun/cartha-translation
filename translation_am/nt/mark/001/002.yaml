base_translation:
  language: en
  yaml_path: translation/nt/mark/001/002.yaml
  text: 'Just as it is written in Isaiah the prophet: ‘Behold[a], I send my messenger before your face[c][b], who will prepare your way.’'
translation:
  language: am
  text: በነቢዩ በኢሳይያስ[a] እንደተጻፈው፦ “እነሆ፣ መልእክተኛዬን በፊትህ[c] እልካለሁ፤ እርሱም መንገድህን ያዘጋጃል።”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የጥንት ቅጂዎች “በነቢያት” ይላሉ፤ “በነቢዩ በኢሳይያስ” አይሉም።
    reason: textual_variant
  - marker: b
    text: ይህ ጥቅስ ከሚልክያስ 3፥1 እና ከኢሳይያስ 40፥3 የተወሰዱ አገላለጾችን ያጣምራል።
    reason: cross_reference
  - marker: c
    text: ወይም፣ “ከአንተ ቀድሞ።” ቃል በቃል፣ “በፊትህ ፊት።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθὼς γέγραπται
  choice: እንደተጻፈው
  rationale: የንጽጽር ኃይሉንና የቅዱስ መጽሐፍ ጥቅስ ቀመርን በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: ἐν τῷ Ἠσαΐᾳ τῷ προφήτῃ
  choice: በነቢዩ በኢሳይያስ መጽሐፍ
  rationale: ἐν የጽሑፍ ምንጭን ያመለክታል፤ “መጽሐፍ” በግሪክ በግልጽ ባይኖርም በአማርኛ የምንጭ አገላለጹን ግልጽና ተፈጥሯዊ ያደርጋል።
- source_word: Ἰδοὺ
  choice: እነሆ
  rationale: የትኩረት ጥሪውንና የትንቢታዊ ንግግሩን ክብር ይጠብቃል።
- source_word: ἀποστέλλω
  choice: እልካለሁ
  rationale: የግሪኩን የአሁን ጊዜ ቀጥተኛና ሕያው በሆነ ዘመናዊ አማርኛ ያቀርባል።
- source_word: ἄγγελόν μου
  choice: መልእክተኛዬን
  rationale: ቃሉ በዚህ ዐውድ ከሰማያዊ መልአክ ይልቅ ቀድሞ የሚላክን ወኪል ያመለክታል።
- source_word: πρὸ προσώπου σου
  choice: በፊትህ
  rationale: የግሪኩን ቃል በቃል “በፊትህ/በፊትህ ፊት” የሚለውን ፈሊጥ ያለ አላስፈላጊ ድግግሞሽ ያስተላልፋል፤ “ከአንተ ቀድሞ” የሚለውንም አማራጭ ትርጉም ይፈቅዳል።
- source_word: ὃς κατασκευάσει τὴν ὁδόν σου
  choice: መንገድህን የሚያዘጋጅ
  rationale: የዝምድና ሐረጉንና የወደፊት ውጤቱን በተፈጥሯዊ አማርኛ ይገልጣል፤ የመንገድን ቀጥተኛና ዘይቤያዊ ምስል ይጠብቃል።
theological_decisions:
- issue: ጥቅሱ ከሚልክያስና ከኢሳይያስ አገላለጽ የተዋሐደ ሆኖ ሳለ ዋናው ጽሑፍ ኢሳይያስን ብቻ መጥቀሱ
  choice: “በነቢዩ በኢሳይያስ መጽሐፍ” የሚለውን የSBLGNT ንባብ በዋናው ጽሑፍ ማቆየት
  alternative: “በነቢያት መጻሕፍት”
  rationale: ትርጉሙ የተቀበለውን የግሪክ ጽሑፍ መከተል አለበት፤ የተዋሐደውን ምንጭ ወይም የቅጂዎችን ልዩነት በዋናው ጽሑፍ ማስተካከል የለበትም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “እነሆ” የትንቢታዊውን ጥቅስ የክብር ድምፅ ይጠብቃል። ሁሉም የግርጌ ማስታወሻ ምልክቶች በዋናው ጽሑፍ ተካተዋል።
