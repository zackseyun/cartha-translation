  edition: SBLGNT
  text: καὶ ἐξεπλήσσοντο ἐπὶ τῇ διδαχῇ αὐτοῦ, ἦν γὰρ διδάσκων αὐτοὺς ὡς ἐξουσίαν ἔχων καὶ οὐχ ὡς οἱ γραμματεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/022.yaml
  text: And they were astonished at his teaching[a], for he was teaching them as one having authority, and not as the scribes.
translation:
  language: am
  text: በትምህርቱም ተደነቁ፤ ምክንያቱም እንደ ጸሐፍት ሳይሆን ሥልጣን እንዳለው[a] ያስተምራቸው ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በሥልጣን።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: ተደነቁ
  rationale: የግሱን ኃይለኛ የመገረም ስሜት በተፈጥሯዊና በዘመናዊ አማርኛ ያስተላልፋል፤ ያልተጠናቀቀው የግሪክ ጊዜ በአውዱ ውስጥ የቀጠለ ምላሽን ያመለክታል።
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: በትምህርቱ
  rationale: የመደነቃቸውን መነሻ—የኢየሱስን ትምህርት፣ ይዘቱንም ሆነ አቀራረቡን—በአጭርና ተፈጥሯዊ አገላለጽ ያሳያል።
- source_word: ἦν γὰρ διδάσκων
  choice: ያስተምራቸው ነበር
  rationale: ἦν ከአሁን ተካፋይ ጋር ያለውን ቀጣይ ድርጊት በአማርኛው የነበር ግንባታ ይጠብቃል።
- source_word: ὡς ἐξουσίαν ἔχων
  choice: ሥልጣን እንዳለው ሰው[a]
  rationale: ὡς የሚያሳየውን ንጽጽርና ἐξουσία የሚያመለክተውን ሥልጣን/መብት በቅርብ ይወክላል፤ ይበልጥ ፈሊጣዊው አማራጭ በማስታወሻው ተጠቅሷል።
- source_word: γραμματεῖς
  choice: ጸሐፍት
  rationale: የአይሁድን የሕግ ጽሑፍ ሊቃውንት የሚያመለክተውን ታሪካዊ ስያሜ በቀጥታ ይጠብቃል፤ ‘የሕግ መምህራን’ የሚለው ይበልጥ ገላጭ ትርጓሜ ነው።
theological_decisions:
- issue: ከጸሐፍት ጋር በተነጻጸረ የኢየሱስ ሥልጣን ምንነት
  choice: ንግግሩን ‘ሥልጣን እንዳለው ሰው’ ብሎ ገላጭ በሆነ መንገድ ማቅረብ
  alternative: ‘በመለኮታዊ ሥልጣን’ ብሎ በትርጓሜ ማስፋት
  rationale: ጥቅሱ የኢየሱስን አስተምህሮ ከጸሐፍት አስተምህሮ ጋር በግልጽ ያነጻጽራል፤ ነገር ግን በዚህ ዐረፍተ ነገር የሥልጣኑን ምንጭ ወይም መለኮታዊ ምንነት በቀጥታ አይገልጽም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ጸሐፍት’ የሚለው ታሪካዊ መጠሪያ ተጠብቆ፣ የግሪኩ ንጽጽርና ቀጣይ የማስተማር ገጽታ በተፈጥሯዊ የአማርኛ አገባብ ቀርቧል።
