  rationale: በወንጌላት ትረካ የተለመደውን፣ ሰው ከማይኖርበት ወይም ከተራቆተ ስፍራ ጋር የተያያዘውን ትርጉም ይገልጣል፤ በአሸዋማ በረሃ ብቻ አይወስነውም።
- source_word: τεσσεράκοντα ἡμέρας
