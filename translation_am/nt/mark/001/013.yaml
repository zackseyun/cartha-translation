base_translation:
  language: en
  yaml_path: translation/nt/mark/001/013.yaml
  text: And he was in the wilderness forty days[a], being tempted by Satan; and he was with the wild animals, and the angels were ministering to him.
translation:
  language: am
  text: እርሱም በምድረ በዳ አርባ ቀን ቆየ፤ በሰይጣንም ይፈተን ነበር።[a] ከአውሬዎችም ጋር ነበር፤ መላእክትም ያገለግሉት ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በሰይጣን ይሞከር ነበር።” የግሪኩ ግስ “መፈተን” ወይም “መሞከር” ማለት ሊሆን ይችላል፤ እዚህ ግን ሰይጣን ፈታኙ ስለሆነ “ይፈተን” የሚለው ይበልጥ ይስማማል።
    reason: lexical_alternative
lexical_decisions:
