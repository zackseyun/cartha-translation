base_translation:
  language: en
  yaml_path: translation/nt/mark/001/024.yaml
  text: saying[a], “What have you to do with us[b], Jesus the Nazarene? Have you come to destroy us? I know who you are—the Holy One of God.”
translation:
  language: am
  text: እንዲህ እያለ፦ “ከእኛ ጋር ምን ጉዳይ አለህ?[a] ኢየሱስ ናዝራዊው ሆይ፣[b] ልታጠፋን መጣህ? ማን እንደሆንህ አውቅሃለሁ—የእግዚአብሔር ቅዱስ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እኛና አንተ ምን አገናኘን?” የግሪኩ አገላለጽ መለያየትን ወይም ተቃውሞን የሚገልጥ ፈሊጥ ነው።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ከናዝሬት የሆነው ኢየሱስ ሆይ።” በግሪክ፣ “ኢየሱስ ናዝራዊው ሆይ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: እንዲህ እያለ
  rationale: የአሁን ጊዜ አንቀጽ መሆኑን እና ቀጥሎ የሚመጣውን ቀጥተኛ ንግግር በተፈጥሯዊ አማርኛ ያገናኛል።
- source_word: Τί ἡμῖν καὶ σοί
  choice: ከእኛ ጋር ምን ጉዳይ አለህ?
  rationale: ቃል በቃል ‘ለእኛና ለአንተ ምን?’ የሚለውን የመለያየት ወይም የተቃውሞ ፈሊጥ በዘመናዊና ግልጽ አማርኛ ያቀርባል፤ ‘ምን ፈልገሃል?’ በማለት ትርጉሙን ከልክ በላይ አይወስንም።
- source_word: Ἰησοῦ Ναζαρηνέ
  choice: ናዝራዊው ኢየሱስ ሆይ
  rationale: Ναζαρηνέ የቦታውን ዝምድና የሚያመለክት የጥሪ ቅጽ ነው፤ ‘ናዝራዊው’ የግሪኩን የማዕረግ/መገለጫ ቅርጽ ይጠብቃል፣ ‘ሆይ’ም ጥሪውን በአማርኛ ግልጽ ያደርጋል።
- source_word: ἦλθες ἀπολέσαι ἡμᾶς
  choice: ልታጠፋን መጣህ?
  rationale: የዓላማ ግንኙነቱን በ‘ልታጠፋን’ ይገልጣል፤ ἀπόλλυμι በዚህ የአጋንንት ማስወጣት አውድ ‘ማጥፋት’ ተብሎ በቀጥታ ተተርጉሟል፣ የብዙ ቁጥር ተውላጠ ስምም ተጠብቋል።
- source_word: οἶδά σε τίς εἶ
  choice: ማን እንደሆንህ አውቅሃለሁ
  rationale: የተናጋሪውን ቀጥተኛ የማንነት ዕውቅና በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ὁ ἅγιος τοῦ θεοῦ
  choice: የእግዚአብሔር ቅዱሱ
  rationale: ὁ ἅγιος ያለውን የተወሰነ የማዕረግ ኃይል ‘ቅዱሱ’ በማለት ይጠብቃል፤ የዝምድና ቅጹም ‘የእግዚአብሔር’ ተብሎ ያለ ተጨማሪ የእምነት ማብራሪያ ቀርቧል።
