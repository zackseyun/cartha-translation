id: MRK.1.26
reference: Mark 1:26
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ σπαράξαν αὐτὸν τὸ πνεῦμα τὸ ἀκάθαρτον καὶ ⸀φωνῆσαν φωνῇ μεγάλῃ ἐξῆλθεν ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/026.yaml
  text: And the unclean spirit[a], after convulsing him and crying out with a loud voice[b], came out of him.
translation:
  language: am
  text: ርኩሱም መንፈስ ሰውየውን አንቀጠቀጠውና በታላቅ ድምፅ ጮኾ ከእርሱ ወጣ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπαράξαν
  choice: ክፉኛ ካንቀጠቀጠው
  rationale: የግሪኩ የአንድ ጊዜ ድርጊት አመልካች ቦዝ አንቀጽ ከዋናው ግስ በፊት የተፈጸመውን ኃይለኛ መንቀጥቀጥ ያሳያል፤ ‘ክፉኛ አንቀጠቀጠው’ በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን ‘ቀደደው’ የሚለውን አሳሳች ቀጥተኛነት ያስወግዳል።
- source_word: τὸ πνεῦμα τὸ ἀκάθαρτον
  choice: ርኩሱ መንፈስ
  rationale: በወንጌላት የአጋንንታዊ መንፈስ መደበኛ መጠሪያ ነው፤ ‘ርኩስ’ የἀκάθαρτοςን የንጽሕና ጉድለትና የሥነ ምግባር ትርጉም ይጠብቃል።
- source_word: φωνῆσαν
  choice: ከጮኸ
  rationale: ከመውጣቱ ጋር ተያይዞ የተፈጸመውን ኃይለኛ የድምፅ ድርጊት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: φωνῇ μεγάλῃ
  choice: በታላቅ ድምፅ
  rationale: የግሪኩን ተጨባጭ ‘ድምፅ’ የሚለውን ቃልና የድርጊቱን ኃይለኛነት በቅርብ ይጠብቃል።
- source_word: ἐξῆλθεν ἐξ αὐτοῦ
  choice: ከእርሱ ወጣ
  rationale: መንፈሱ ሰውየውን መልቀቁን በቀጥታና በተፈጥሯዊ አማርኛ የሚገልጽ ሲሆን የግሪኩን ግላዊና ቦታዊ ምስል ይጠብቃል።
- source_word: καὶ ... καὶ
  choice: -ም ... -ና
  rationale: የማርቆስን ቀላል ቅንጅትና የትረካ ፍሰት በተፈጥሯዊ የአማርኛ አገናኞች ያቀርባል።
theological_decisions:
- issue: የተቆጣጠረው አካል ባሕርይ
  choice: ‘ርኩሱ መንፈስ’ እንደ ግላዊ አጋንንታዊ መንፈስ ቀርቧል
  alternative: ግላዊ ያልሆነ ክፉ ኃይል
  rationale: በማርቆስ ትረካ ውስጥ መንፈሱ ሰውየውን ያንቀጠቅጣል፣ ይጮኻል፣ ከእርሱም ይወጣል፤ ትርጉሙ ይህን ግላዊ ድርጊት ያለ ተጨማሪ የእምነት ሥርዓት ማብራሪያ ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። ‘ሰውየውን’ የተጨመረው በአማርኛ የ‘እርሱ’ን ማጣቀሻ ግልጽ ለማድረግ ነው፤ አዲስ ትርጉም አይጨምርም። አስፈላጊ የጽሑፍ ወይም የትርጉም አሻሚነት ስለሌለ የግርጌ ማስታወሻ አልተጨመረም።
