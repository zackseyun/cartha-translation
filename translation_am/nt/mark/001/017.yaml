id: MRK.1.17
reference: Mark 1:17
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Δεῦτε ὀπίσω μου, καὶ ποιήσω ὑμᾶς γενέσθαι ἁλιεῖς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/017.yaml
  text: And Jesus said to them, “Come after me, and I will make you become fishers of men.”
translation:
  language: am
  text: ኢየሱስም፣ “ተከተሉኝ፤ ሰዎችን የምታጠምዱ ዓሣ አጥማጆች እንድትሆኑ አደርጋችኋለሁ” አላቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δεῦτε ὀπίσω μου
  choice: ተከተሉኝ
  rationale: ቃል በቃል ‘ከኋላዬ ኑ’ ማለት ቢቻልም፣ በዚህ የደቀ መዝሙርነት ጥሪ ውስጥ ያለውን ትርጉም በተፈጥሯዊና ዘመናዊ አማርኛ ይገልጣል።
- source_word: ποιήσω ὑμᾶς γενέσθαι
  choice: እንድትሆኑ አደርጋችኋለሁ
  rationale: ‘እንድትሆኑ አደርጋችኋለሁ’ የሚለው አገላለጽ ποιήσω እና γενέσθαι የሚያሳዩትን ሂደታዊ መሆን ይጠብቃል።
- source_word: ἁλιεῖς ἀνθρώπων
  choice: ሰዎችን የምታጠምዱ ዓሣ አጥማጆች
  rationale: የዓሣ ማጥመድን ዘይቤ በግልጽ ሁኔታ ይጠብቃል፤ ἀνθρώπων በዚህ የሰው ልጆችን በአጠቃላይ ስለሚያመለክት ‘ሰዎችን’ ተብሏል።
theological_decisions:
- issue: የጥሪው እና የለውጡ አድራጊ
  choice: ኢየሱስ ራሱ ተከታዮቹን እንዲሆኑ እንደሚያደርጋቸው ጽሑፉ በቀጥታ ተጠብቋል።
  alternative: ንግግሩን የሰዎቹ የግል ጥረት ትእዛዝ ብቻ አድርጎ ማቅረብ።
  rationale: ποιήσω ὑμᾶς γενέσθαι ተናጋሪው ኢየሱስ የለውጡ አድራጊ መሆኑን ያሳያል።
- issue: ‘ሰዎችን ማጥመድ’ የሚለው ዘይቤ
  choice: ዘይቤው ሳይፈታ ተጠብቋል።
  alternative: ‘ሰዎችን ወደ እምነት ማምጣት’ ብሎ ትርጓሜውን በጽሑፉ ውስጥ ማስገባት።
  rationale: ምንጩ ራሱ ዘይቤያዊ ነው፤ ትርጉሙን በአንድ የትምህርት አተረጓጎም መወሰን አይገባም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ። ንግግሩ ለአፍ ንባብ ተፈጥሯዊ እንዲሆን ተደርጓል፤ የምንጩ የዓሣ ማጥመድ ዘይቤና ‘እንድትሆኑ’ የሚለው የመሆን ሂደት ተጠብቀዋል።
