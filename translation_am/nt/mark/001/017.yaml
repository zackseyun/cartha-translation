review_pass:
  verdict: approve
  source_fidelity: The draft accurately conveys Jesus as the speaker, the imperative call to follow him (Δεῦτε ὀπίσω μου), and his future agency in making the hearers become ἁλιεῖς ἀνθρώπων. The inclusive ሰዎች appropriately represents ἀνθρώπων without importing a gender-specific restriction.
  naturalness: The wording is clear, idiomatic modern standard Amharic, and suitable for public reading. ተከተሉኝ naturally expresses the discipleship force of “come after me,” while እንድትሆኑ አደርጋችኋለሁ preserves the becoming construction.
  terminology: ኢየሱስ, ዓሣ አጥማጆች, and the preserved fishing metaphor are appropriate. The phrase ሰዎችን የምታጠምዱ ዓሣ አጥማጆች transparently retains the source’s metaphor without prematurely interpreting it.
  issues: []
  revised_text: ኢየሱስም፣ “ተከተሉኝ፤ ሰዎችን የምታጠምዱ ዓሣ አጥማጆች እንድትሆኑ አደርጋችኋለሁ” አላቸው።
