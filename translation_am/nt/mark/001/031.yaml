  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ የትረካ አማርኛ ተጠቅሟል። የግሪኩ አረፍተ ነገር ቅደም ተከተል ተጠብቋል፤ የግሱ ገጽታ አሻሚነት በማስታወሻ ቀርቧል።
