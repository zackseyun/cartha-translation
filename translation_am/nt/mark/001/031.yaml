  text: καὶ προσελθὼν ἤγειρεν αὐτὴν κρατήσας τῆς ⸀χειρός· καὶ ἀφῆκεν αὐτὴν ὁ ⸀πυρετός, καὶ διηκόνει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/031.yaml
  text: And coming near[a], he raised her up, taking her by the hand; and the fever left her, and she served them.
translation:
  language: am
  text: ወደ እርሷም ቀርቦ እጇን ይዞ አስነሣት፤ ትኩሳቱም ለቀቃት፣ እርሷም አገለገለቻቸው[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ታገለግላቸው ነበር።” የግሪኩ ኢምፐርፌክት እርሷ በማገልገል ላይ መሆኗን ብቻ ሊገልጥ ይችላል፤ አውዱ ግን ከተፈወሰች በኋላ ወዲያው ማገልገል መጀመሯንም ይደግፋል።
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: ወደ እርሷም ቀርቦ
  rationale: የግሪኩ የቀደመ ድርጊት ኢየሱስ ወደ እርሷ መቅረቡን ያሳያል፤ አማርኛውም የድርጊቶቹን ቅደም ተከተል በተፈጥሮ ይጠብቃል።
- source_word: ἤγειρεν
  choice: አስነሣት
  rationale: ἐγείρω በዚህ አውድ ከተኛችበት ማስነሣትን ያመለክታል፤ ሆኖም የግሪኩን ጠንካራ የ‘ማስነሣት’ ቃል ይጠብቃል።
- source_word: κρατήσας τῆς χειρός
  choice: እጇን ይዞ
  rationale: የግሪኩን ‘እጇን ይዞ’ የሚለውን አብሮ የሆነ ድርጊት በግልጽና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἀφῆκεν αὐτὴν ὁ πυρετός
  choice: ትኩሳቱም ለቀቃት
  rationale: ትኩሳቱ ከእርሷ መወገዱን የግሪኩን አገላለጽ በመጠበቅ በተለመደ አማርኛ ይገልጣል።
- source_word: διηκόνει
  choice: አገለገለቻቸው
  rationale: διακονέω በዚህ የቤት አውድ ለተገኙት ሰዎች አገልግሎት መስጠቷን ያመለክታል። ቀላሉ ያለፈ ጊዜ ቅርጽ የግሪኩን ኢምፐርፌክት ‘ጀመረች’ ብሎ ሳይገድበው ተፈጥሯዊ ትረካ ይሰጣል።
- source_word: αὐτοῖς
  choice: አገለገለቻቸው
  rationale: በግሱ ውስጥ ያለው ‘-ቻቸው’ ብዙ ቁጥር ተቀባዮችን፣ ማለትም በዚያ የነበሩትን ቡድን፣ በአጭሩ ይወክላል።
theological_decisions:
- issue: ἐγείρω ከትንሣኤ ቋንቋ ጋር ሊኖረው የሚችለው ድምፀት
  choice: አስነሣት
  alternative: ከተኛችበት እንድትነሣ ረዳት
  rationale: አውዱ ፈውስን እንጂ ትንሣኤን በቀጥታ አይገልጥም፤ ሆኖም ‘አስነሣት’ የማርቆስን ጠንካራ የቃል ምርጫ ጠብቆ ያለውን ድምፀት ሳያጠፋ ይተረጉማል።
