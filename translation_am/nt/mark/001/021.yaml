  yaml_path: translation/nt/mark/001/021.yaml
  text: And they went into Capernaum, and immediately on the Sabbath he began teaching in the synagogue.
translation:
  language: am
  text: እነርሱም ወደ ቅፍርናሆም ገቡ።[a] ወዲያውም በሰንበት[b] በምኩራብ እያስተማረ ነበር።[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወደ ቅፍርናሆም ይገባሉ።” ማርቆስ ትረካውን ሕያው ለማድረግ ታሪካዊውን የአሁን ጊዜ ብዙ ጊዜ ይጠቀማል።
    reason: lexical_alternative
  - marker: b
    text: በግሪክኛው ቃል በቃል “በሰንበታት” ይላል፤ እዚህ ግን “በሰንበት” ማለት የሆነ ፈሊጣዊ አነጋገር ነው።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “ማስተማር ጀመረ” ወይም “አስተማረ።” የግሪኩ የግስ ቅርጽ ቀጣይ ድርጊትን ወይም የድርጊቱን ጅማሬ ሊያጎላ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσπορεύονται
  choice: ገቡ
  rationale: በግሪኩ የአሁን ጊዜ ቅርጽ ቢሆንም፣ ማርቆስ ለሕያው ትረካ የሚጠቀምበት ታሪካዊ አሁን ነው፤ በአማርኛ ትረካ ያለፈ ጊዜው ተፈጥሯዊ ነው።
- source_word: Καφαρναούμ
  choice: ቅፍርናሆም
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የስፍራውን ስም ቅርጽ ይከተላል።
- source_word: εὐθύς
  choice: ወዲያውም
  rationale: የድርጊቱን ፈጣንነትና የማርቆስን የትረካ ቅልጥፍና በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: τοῖς σάββασιν
  choice: በሰንበት
  rationale: የግሪኩ ቅርጽ ብዙ ቁጥር ቢሆንም፣ እዚህ ነጠላ ትርጉም ያለው የጊዜ ፈሊጥ ነው።
- source_word: ἐδίδασκεν
  choice: ያስተምር ነበር
  rationale: ያልተፈጸመው የግሪክ ግስ ቀጣይ ወይም በሂደት ላይ ያለ ድርጊትን ሊያመለክት ስለሚችል፣ ይህ አተረጓጎም የጅማሬን ሐሳብ ሳያስገድድ አሻሚነቱን ይጠብቃል።
- source_word: συναγωγήν
  choice: ምኩራብ
  rationale: በዚህ የአይሁድ አውድ συναγωγή አጠቃላይ ጉባኤን ሳይሆን የአካባቢውን የአምልኮና የትምህርት ቦታ ያመለክታል።
theological_decisions:
- issue: የἐδίδασκεν ግስ ገጽታ
  choice: ያስተምር ነበር
  alternative: ማስተማር ጀመረ / አስተማረ
  rationale: ግሪኩ ቀጣይነትን ወይም ጅማሬን ሊያመለክት ቢችልም፣ በዐውዱ የጅማሬ ትርጉምን በግድ አያረጋግጥም፤ ስለዚህ ቀጣይ ድርጊትን የሚያሳየው ቅርጽ ተመርጧል፣ አማራጩም በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ምኩራብ” የተለመደውን መጽሐፍ ቅዱሳዊ ቃል ይጠብቃል፤ የግሪኩ የግስ ገጽታ አሻሚነት በዋናው ጽሑፍና በማስታወሻው ተጠብቋል።
