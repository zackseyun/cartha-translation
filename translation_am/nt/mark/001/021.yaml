  source_fidelity: The historical present of εἰσπορεύονται is appropriately rendered with Amharic past narrative tense, and the imperfect ἐδίδασκεν is well represented by a progressive construction without forcing an inceptive sense. However, the draft supplies an additional explicit action, “ገብቶ” (“having entered”), before the teaching. The Greek construction locates the teaching at the synagogue (despite its unusual εἰς expression); it does not expressly state a separate entering action here.
