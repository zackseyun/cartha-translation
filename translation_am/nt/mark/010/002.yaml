base_translation:
  language: en
  yaml_path: translation/nt/mark/010/002.yaml
  text: And they were asking him whether it is lawful for a man to divorce a wife[a], testing him.
translation:
  language: am
  text: እርሱንም ለመፈተን፣ “አንድ ወንድ ሚስትን መፍታት በሕግ ተፈቅዶለታልን?” ብለው ይጠይቁት ነበር።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አንድ ባል ሚስቱን መፍታት በሕግ ተፈቅዶለታልን?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτων
  choice: ይጠይቁት ነበር
  rationale: ያልተጠናቀቀው የግስ አቀራረብ ቀጣይ ወይም ተደጋጋሚ ጥያቄን ስለሚያመለክት፣ ቀላል ያለፈ ጊዜ ከመጠቀም ይልቅ ይህ አተረጓጎም ተመርጧል።
- source_word: ἔξεστιν
  choice: በሕግ ተፈቅዶለታል
  rationale: በፍቺ ላይ በተነሣው የሕግ ክርክር ውስጥ ቃሉ ተግባሩ የሚቻል መሆኑን ሳይሆን በሕግ የተፈቀደ መሆኑን ያመለክታል።
- source_word: ἀνδρὶ
  choice: አንድ ወንድ
  rationale: ἀνήρ እንደ አውዱ ወንድ ወይም ባል ሊሆን ይችላል፤ እዚህ አጠቃላይ የሕግ ጥያቄውን ለማቆየት ‘አንድ ወንድ’ ተመርጧል።
- source_word: γυναῖκα
  choice: ሚስትን
  rationale: በፍቺ አውድ γυνή ተራ ሴትን ሳይሆን ሚስትን ያመለክታል፤ ግሪኩ ግን ግልጽ የባለቤትነት ተውላጠ ስም ስለሌለው ‘የገዛ ሚስቱን’ አልተጨመረም።
- source_word: ἀπολῦσαι
  choice: መፍታት
  rationale: ግሱ በቃል ደረጃ መልቀቅ ወይም ማሰናበት ሊሆን ቢችልም፣ በጋብቻ እና በሕግ አውድ ሚስትን መፍታትን ያመለክታል።
- source_word: πειράζοντες
  choice: ለመፈተን
  rationale: የተሳቢው ቅርጽ ጥያቄው ኢየሱስን ለመፈተን የቀረበ መሆኑን ያሳያል፤ ‘ሊያጠምዱት’ የሚለውን የበለጠ ትርጓሜያዊ ማስፋፊያ አያስገባም።
- source_word: Καὶ
  choice: -ም
  rationale: የግሪኩን ቀላል የትረካ ማያያዣ በአማርኛ ተፈጥሯዊ በሆነው ተያያዥ ‘-ም’ ተገልጿል።
theological_decisions:
- issue: በሕጋዊ የጋብቻ ጥያቄ ውስጥ ἀνδρὶ የሚለውን መተርጎም
  choice: አንድ ወንድ
  alternative: አንድ ባል
  rationale: የግሪኩን አጠቃላይ ወንድ ነጠላ ቅርጽ ይጠብቃል፤ ‘ሚስትን መፍታት’ የሚለውም የጋብቻውን አውድ በቂ ያደርገዋል።
- issue: γυναῖκα ውስጥ ያለው የባለቤትነት አሻሚነት
  choice: ሚስትን
  alternative: የገዛ ሚስቱን
  rationale: ግሪኩ በዚህ ስፍራ ግልጽ የባለቤትነት ተውላጠ ስም አይጠቀምም። ዋናው ጽሑፍ ይህን ቅርጽ ይጠብቃል፤ በአማርኛ ተፈጥሯዊ የሆነው አማራጭ በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የጥያቄውን ቀጣይነት፣ ሕጋዊ አውዱንና የፈተናውን ዓላማ ጠብቆ ለተፈጥሯዊ የአማርኛ አገባብ የአካላት ቅደም ተከተል ተስተካክሏል።
