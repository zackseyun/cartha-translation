id: MRK.10.34
reference: Mark 10:34
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἐμπαίξουσιν αὐτῷ καὶ ⸂ἐμπτύσουσιν αὐτῷ καὶ μαστιγώσουσιν αὐτὸν⸃ καὶ ⸀ἀποκτενοῦσιν, καὶ ⸂μετὰ τρεῖς ἡμέρας⸃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/034.yaml
  text: And they will mock him[a], and spit on him, and flog him, and kill him, and after three days he will rise.
translation:
  language: am
  text: ያፌዙበታል፣ ይተፉበታል፣ ይገርፉታል፣ ይገድሉታልም፤ ከሦስት ቀናት በኋላ[a] ይነሳል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በሦስት ቀናት ውስጥ።» የማርቆስ ግሪክ «ከሦስት ቀናት በኋላ» ይላል፤ ሌሎች ምንባቦች ግን ጊዜውን «በሦስተኛው ቀን» ብለው ይገልጹታል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμπαίξουσιν
  choice: ያፌዙበታል
  rationale: ቃሉ በንቀት መሳለቅንና ማዋረድን ያመለክታል፤ «ያፌዙበታል» በዘመናዊ አማርኛ ይህን ጠላትነት ያዘለ ፌዝ በግልጽ ያስተላልፋል።
- source_word: ἐμπτύσουσιν αὐτῷ
  choice: ይተፉበታል
  rationale: ድርጊቱ በእርሱ ላይ የተደረገ የውርደት ተግባር መሆኑን «ይተፉበታል» በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: μαστιγώσουσιν
  choice: ይገርፉታል
  rationale: «መግረፍ» በዱላ ወይም በጅራፍ የሚፈጸምን ከባድ ቅጣት የሚገልጥ ግልጽና የተለመደ የአማርኛ ቃል ነው።
- source_word: ἀποκτενοῦσιν
  choice: ይገድሉታል
  rationale: የግሪኩን ግልጽ «ይገድሉታል» የሚል ትርጉም ይጠብቃል፤ በቃሉ ውስጥ ያልተገለጠ ሕጋዊ ወይም ሥነ ምግባራዊ ገጽታ አይጨምርም።
- source_word: μετὰ τρεῖς ἡμέρας
  choice: ከሦስት ቀን በኋላ
  rationale: μετά ከተሳቢ መደብ ጋር እዚህ «በኋላ» የሚል ትርጉም አለው። የማርቆስን አነጋገር በቀጥታ ለማቆየት «በሦስተኛው ቀን» ተብሎ ከሌሎች ምንባቦች ጋር አልተስማማም።
- source_word: ἀναστήσεται
  choice: ይነሣል
  rationale: የወደፊት መካከለኛ ቅርጹን እንደ አድራጊ ያልተጠቀሰበት ኢ-ተሻጋሪ ግስ ያስተላልፋል፤ በግሪኩ ያልተጨመረውን «እንደገና» አያክልም።
theological_decisions:
- issue: የትንሣኤው አገላለጽ
  choice: ይነሣል
  alternative: ይነሣል / ይነሣል ተብሎ ከተገብሮ አገላለጽ ሊተረጎም ይችላል
  rationale: ἀναστήσεται የወደፊት መካከለኛ ቅርጽ ስለሆነ «ይነሣል» የሚለውን ኢ-ተሻጋሪ አገላለጽ ይደግፋል። ይህ አባት ኢየሱስን እንዳስነሣው የሚናገሩ ሌሎች የአዲስ ኪዳን ምንባቦችን ሳይክድ፣ የዚህን ጥቅስ የራሱን አገላለጽ ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ይጠቀማል። ተደጋጋሚው καί በ«-ም» ተጠብቆ የድርጊቶቹን ተከታታይነት ያሳያል። የግዕዝ ቅርጽ ያለው «ይነሣል» በመጽሐፍ ቅዱሳዊ አማርኛ የተለመደና ለዘመናዊ አንባቢም ግልጽ ነው።
