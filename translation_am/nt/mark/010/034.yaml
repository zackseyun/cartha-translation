review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the sequence of mocking, spitting on him, flogging, killing, and then rising. However, «በእርሱም ያፌዙበታል» is redundant and awkward, since both «በእርሱ» and the verb’s -በት construction mark the target of the mockery. The temporal phrase must use the plural «ቀናት» for τρεῖς ἡμέρας.
  naturalness: The revised wording is natural modern standard Amharic while retaining the concise, solemn narrative register. «ይነሳል» is the standard modern spelling and preserves the intransitive future sense.
  terminology: «ያፌዙበታል», «ይተፉበታል», «ይገርፉታል», and «ይገድሉታል» suitably render the Greek verbs without adding interpretive or doctrinal content. «ይነሳል» appropriately renders ἀναστήσεται as ‘he will rise,’ not ‘he will be raised.’
  issues:
  - severity: medium
    issue: Redundant and unnatural opening phrase
    rationale: «በእርሱም ያፌዙበታል» duplicates the object/target marking already expressed by «-በት» in «ያፌዙበታል». Removing «በእርሱም» gives the direct sense of ἐμπαίξουσιν αὐτῷ.
  - severity: medium
    issue: Singular noun after ‘three’
    rationale: «ከሦስት ቀን በኋላ» should be «ከሦስት ቀናት በኋላ» in standard Amharic, corresponding to the plural ἡμέρας.
  - severity: low
    issue: Footnote alternative is imprecise
    rationale: The English audit trail’s alternative is ‘in three days’; «ሦስት ቀን ሲሞላ» is not the clearest equivalent. «በሦስት ቀናት ውስጥ» states the alternative naturally and distinctly from the main text’s ‘after three days.’
  revised_text: ያፌዙበታል፣ ይተፉበታል፣ ይገርፉታል፣ ይገድሉታልም፤ ከሦስት ቀናት በኋላ[a] ይነሳል።
