  edition: SBLGNT
  text: Καὶ προσέφερον αὐτῷ παιδία ἵνα ⸂αὐτῶν ἅψηται⸃· οἱ δὲ μαθηταὶ ⸂ἐπετίμησαν αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/013.yaml
  text: And they were bringing children to him so that he might touch them[a], but the disciples rebuked them.
translation:
  language: am
  text: ሰዎችም እንዲነካቸው ልጆችን[a] ወደ እርሱ ያመጡ ነበር፤ ደቀ መዛሙርቱ ግን ገሠጿቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ትንንሽ ልጆችን።” የግሪኩ παιδία ወጣት ልጆችን ጨምሮ ልጆችን በስፋት ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέφερον
  choice: ያመጡ ነበር
  rationale: ያልተፈጸመው የግሪክ ግስ በቀድሞ ጊዜ ቀጣይ ወይም ተደጋጋሚ የነበረን ድርጊት ያመለክታል፤ ‘ያመጡ ነበር’ ይህን ገጽታ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: παιδία
  choice: ልጆችን
  rationale: ቃሉ በስፋት ልጆችን፣ ወጣት ልጆችንም ጨምሮ፣ ሊያመለክት ይችላል። ‘ልጆች’ ስፋቱን ሳያጠብ ተፈጥሯዊ ነው።
- source_word: ἵνα αὐτῶν ἅψηται
  choice: እንዲነካቸው
  rationale: ἵνα ከንዑስ አንቀጽ ጋር ዓላማን ያሳያል፤ ἅπτομαι ደግሞ በቀጥታ ‘መንካት’ ማለት ነው። ከተጓዳኝ ዘገባዎች ‘እጁን መጫን’ የሚለውን ዝርዝር አያስገባም።
- source_word: ἐπετίμησαν
  choice: ገሠጿቸው
  rationale: ቃሉ በኃይል መገሠጽን ወይም መቆጣትን ያመለክታል፤ ‘ገሠጿቸው’ የድርጊቱን ጥንካሬ በክብር ያለው ዘመናዊ አማርኛ ይጠብቃል።
- source_word: αὐτοῖς
  choice: ገሠጿቸው
  rationale: የነገሩ ተቀባዮች በግሱ ውስጥ ባለው ‘-አቸው’ ተውላጠ ቅጥያ ተገልጠዋል። ማጣቀሻው በተፈጥሮ ልጆቹን ወደ ኢየሱስ ያመጡትን ሰዎች ያመለክታል።
- source_word: δὲ
  choice: ግን
  rationale: በልጆቹ አምጪዎች ድርጊትና በደቀ መዛሙርቱ ምላሽ መካከል ያለውን ቀላል ተቃርኖ በተፈጥሯዊነት ያሳያል።
theological_decisions:
- issue: ደቀ መዛሙርቱ የገሠጿቸው እነማን እንደሆኑ
  choice: ልጆቹን ያመጡትን ሰዎች
  alternative: ልጆቹን
  rationale: αὐτοῖς በሰዋስው ብቻ ሊያሻማ ቢችልም፣ በትረካው ፍሰት ውስጥ በπροσέφερον የተጠቆሙትን አምጪዎች ማመልከቱ ይበልጥ ተፈጥሯዊ ነው። ዋናው ጽሑፍ ‘ገሠጿቸው’ በማለት የምንጩን ተውላጠ ስም ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ሰዎችም’ የግሪኩን ያልተገለጸ ብዙ ቁጥር ፈጻሚ በአማርኛ ግልጽ ያደርጋል፤ ‘ወደ እርሱ’ የመምጣትን አቅጣጫ ይጠብቃል።
