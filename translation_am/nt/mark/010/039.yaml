    reason: cross_reference
  revision_rationale: The revision retains every metaphor and verbal relationship in the Greek while correcting the Amharic relative construction for baptism. The footnote is recast for clear, faithful reference to the shared suffering and destiny, without making a doctrinal claim about sacramental baptism.
