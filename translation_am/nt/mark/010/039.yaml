  to: እነርሱም፣ “እንችላለን” አሉት። ኢየሱስ ግን እንዲህ አላቸው፤ “እኔ የምጠጣውን ጽዋ ትጠጣላችሁ፤ በምጠመቅበትም ጥምቀት ትጠመቃላችሁ።”[a]
