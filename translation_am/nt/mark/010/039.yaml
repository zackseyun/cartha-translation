id: MRK.10.39
reference: Mark 10:39
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν αὐτῷ· Δυνάμεθα. ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· ⸀Τὸ ποτήριον ὃ ἐγὼ πίνω πίεσθε καὶ τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθήσεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/039.yaml
  text: And they said to him[a], “We are able.” But Jesus said to them, “The cup that I drink, you will drink; and the baptism with which I am baptized[b], you will be baptized,”
translation:
  language: am
  text: እነርሱም፣ “እንችላለን” አሉት። ኢየሱስ ግን እንዲህ አላቸው፤ “እኔ የምጠጣውን ጽዋ ትጠጣላችሁ፤ በምጠመቅበትም ጥምቀት ትጠመቃላችሁ።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ጽዋ” እና “ጥምቀት” ኢየሱስ በቅርቡ የሚያልፍበትን መከራና ዕጣ ፈንታ የሚያመለክቱ ምሳሌዎች ናቸው፤ ደቀ መዛሙርቱም በዚህ ይካፈላሉ።
    reason: cross_reference
lexical_decisions:
- source_word: Δυνάμεθα
  choice: እንችላለን
  rationale: የግሪኩን የአሁን ጊዜ አቅም መግለጫ በተፈጥሯዊና ቀጥተኛ አማርኛ ያስተላልፋል።
- source_word: ποτήριον
  choice: ጽዋ
  rationale: በመጽሐፍ ቅዱሳዊ አጠቃቀም የተመደበ ልምምድን፣ በዚህም አውድ መከራንና ዕጣ ፈንታን፣ የሚያመለክተውን ምሳሌያዊ ምስል ይጠብቃል።
- source_word: πίνω / πίεσθε
  choice: የምጠጣውን / ትጠጣላችሁ
  rationale: የአሁንና የወደፊት ጊዜ ንፅፅሩን እንዲሁም በግሪኩ ያለውን የግስ ትይዩነት ይጠብቃል።
- source_word: βάπτισμα
  choice: ጥምቀት
  rationale: መደበኛውን የቃሉን ትርጉምና ምሳሌያዊ ኃይሉን ይጠብቃል፤ በዋናው ጽሑፍ ውስጥ ‘መከራ’ ብሎ በትርጓሜ አይተካውም።
- source_word: βαπτίζομαι / βαπτισθήσεσθε
  choice: በምጠመቀው / ትጠመቃላችሁ
  rationale: ከ‘ጥምቀት’ ጋር ያለውን የተመሳሳይ ሥር ቃል ግንኙነት ይጠብቃል፤ የወደፊቱን ተገብሮም በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: ኢየሱስ ግን እንዲህ አላቸው
  rationale: ‘ግን’ የደቀ መዛሙርቱን የተማመነ መልስና የኢየሱስን ተከታይ ንግግር የሚያገናኘውን ረጋ ያለ ንፅፅር ያሳያል።
theological_decisions:
- issue: የጽዋና የጥምቀት ምሳሌያዊ አነጋገር
  choice: ሁለቱንም ምስሎች በዋናው ጽሑፍ እንዳሉ ማቆየት
  alternative: በቀጥታ ‘መከራ’፣ ‘ሞት’ ወይም ‘ሰማዕትነት’ ብሎ መተርጎም
  rationale: ግሪኩ ምሳሌያዊ አነጋገሩን ይጠቀማል፤ አውዱ መከራንና ከኢየሱስ ዕጣ ፈንታ መካፈልን ቢያመለክትም ትርጉሙ ምስሎቹን በማብራሪያ ቃላት መተካት የለበትም።
- issue: ‘ጥምቀት’ ከሥርዓታዊ ጥምቀት ጋር ያለው ግንኙነት
  choice: βάπτισμαን ‘ጥምቀት’ ብሎ መተርጎም፣ ነገር ግን አውዱ ምሳሌያዊ መከራን እንዲያሳይ መተው
  alternative: ግራ መጋባትን ለማስቀረት ‘መከራ’ ወይም ‘የሚያጥለቀልቅ ፈተና’ ብሎ መተርጎም
  rationale: ምንጩ βάπτισμα ይላል፤ የቃሉን ቅርጽ መጠበቅ ምሳሌያዊውንና መጽሐፍ ቅዱሳዊውን ድምፅ ሳያጠፋ አውዱ ትርጉሙን እንዲገልጥ ያደርጋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ጽዋ’ መጽሐፍ ቅዱሳዊውን ምስል ለመጠበቅ ተመርጧል፤ የ‘ጥምቀት/መጠመቅ’ የሥር ቃል ድግግሞሽም ሆን ተብሎ ተጠብቋል።
