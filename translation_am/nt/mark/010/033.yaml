source:
  edition: SBLGNT
  text: ὅτι Ἰδοὺ ἀναβαίνομεν εἰς Ἱεροσόλυμα, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδοθήσεται τοῖς ἀρχιερεῦσιν καὶ ⸀τοῖς γραμματεῦσιν, καὶ κατακρινοῦσιν αὐτὸν θανάτῳ καὶ παραδώσουσιν αὐτὸν τοῖς ἔθνεσιν
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/033.yaml
  text: that[a], ‘Look, we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and the scribes[b], and they will condemn him to death and hand him over to the Gentiles.’
translation:
  language: am
  text: “እነሆ፣ ወደ ኢየሩሳሌም እየወጣን ነው፤ የሰው ልጅንም ለየካህናት አለቆችና ለጻፎች አሳልፈው ይሰጡታል።[a] እነርሱም በሞት ይፈርዱበታል፤ ለአሕዛብም[b] አሳልፈው ይሰጡታል።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: παραδίδωμι የተባለው ግስ በዚህ ቁጥር በሁለቱም ስፍራ “አስረክቦ መስጠት” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “ለአሕዛብ” የሚለው “ለብሔራት” ተብሎም ሊተረጎም ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: እንዲህም አለ፦
  rationale: በቀደመው ቁጥር የተጀመረውን የኢየሱስ ንግግር ይዘት ያስገባል፤ በአማርኛ የተፈጥሮ ዘገባ አገላለጽ ነው፣ የምክንያት ትርጉምም አይጨምርም።
- source_word: Ἰδοὺ
  choice: እነሆ
  rationale: ትኩረት የሚጠራውን የንግግር ምልክት በክቡርና በተለመደ አማርኛ ይጠብቃል።
- source_word: ἀναβαίνομεν
  choice: እየወጣን ነው
  rationale: ወደ ኢየሩሳሌም የሚደረገውን ወደ ላይ ጉዞና የግስ ቀጣይ የአሁን ጊዜ ኃይል ይጠብቃል።
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: የሰው ልጅ
  rationale: ቃል በቃል አወቃቀሩንና መለኮታዊ ድምፁን ሳይተረጉም የሚያቆይ የተለመደ ስያሜ ነው።
- source_word: παραδοθήσεται / παραδώσουσιν
  choice: አሳልፎ ይሰጣል / አሳልፈው ይሰጡታል
  rationale: የአንድን ሰው ሥልጣን ለሌሎች አሳልፎ መስጠትን ይገልጣል፤ ‘ክዳት’ ብሎ ወኪሉን አስቀድሞ አይወስንም፣ የግሱንም ድግግሞሽ ይጠብቃል።
- source_word: τοῖς ἀρχιερεῦσιν
  choice: ለካህናት አለቆች
  rationale: ብዙ የካህናት መሪዎችን ያመለክታል እንጂ አንድን ሊቀ ካህናት ብቻ አይደለም።
- source_word: τοῖς γραμματεῦσιν
  choice: ለጻፎች
  rationale: ቀጥተኛውን የቃሉን ትርጉም ይጠብቃል፤ ‘የሕግ መምህራን’ ብሎ የሥራቸውን ትርጓሜ አይጨምርም።
- source_word: κατακρινοῦσιν αὐτὸν θανάτῳ
  choice: ሞት ይፈርዱበታል
  rationale: መደበኛ የፍርድ ውሳኔንና የቅጣቱን ውጤት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τοῖς ἔθνεσιν
  choice: ለአሕዛብ
  rationale: በዚህ የሕማማት አውድ ከአይሁድ መሪዎች ወደ አይሁድ ያልሆኑ ባለሥልጣናት መተላለፉን ይገልጣል፤ ቃሉ በሌላ አውድ ‘አሕዛብ/ብሔራት’ ሊል የሚችለውን ስፋት የግርጌ ማስታወሻው ያሳያል።
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου አተረጓጎም
  choice: የሰው ልጅ
