  rationale: ባህላዊው ቀጥተኛ አተረጓጎም የግሪኩን አወቃቀር፣ ከዳንኤል ጋር ያለውን ድምፅና የክርስቶስን ራስ-ስያሜ ያለ ትርጓሜ ይጠብቃል።
- issue: τοῖς ἔθνεσιν አተረጓጎም
