review_pass:
  verdict: revise
  source_fidelity: The first occurrence of παραδίδωμι is future passive. In the draft, “የሰው ልጅም ... አሳልፎ ይሰጣል” makes the Son of Man the agent who hands someone over, rather than the one handed over. The revised wording makes him the object while retaining the unspecified agent of the Greek passive. The repeated transfer verb is retained in both clauses.
  naturalness: “እነሆ” and “ወደ ኢየሩሳሌም እየወጣን ነው” are clear and suitably biblical-modern. “ሞት ይፈርዱበታል” is natural, though “በሞት ይፈርዱበታል” more explicitly reflects the Greek dative and is idiomatic. Since this is a continuation of the preceding speech, the supplied “እንዲህም አለ፦” is omitted rather than presenting it as wording in this verse.
  terminology: “የሰው ልጅ,” “የካህናት አለቆች,” “ጻፎች,” and “አሕዛብ” are appropriate. “የካህናት አለቆች” is slightly more natural than “ካህናት አለቆች.” The footnote for παραδίδωμι is adjusted so its quoted alternative accurately applies to both inflected occurrences.
  issues:
  - severity: high
    issue: The initial passive παραδοθήσεται is rendered with the Son of Man as the active subject.
    rationale: “የሰው ልጅ ... አሳልፎ ይሰጣል” states that the Son of Man will hand over someone else. Greek states that he will be handed over; no human agent is specified.
  - severity: low
    issue: “እንዲህም አለ፦” is supplied although it is not represented by words in the verse's Greek text.
    rationale: ὅτι continues the speech introduced in the preceding verse. Omitting the supplied reporting formula avoids expanding this verse while preserving a natural continuation.
  - severity: low
