  yaml_path: translation/nt/mark/010/001.yaml
  text: And from there[a], rising, he comes into the region of Judea and beyond the Jordan, and crowds gather to him again, and as was his custom[b], he again taught them.
translation:
  language: am
  text: ከዚያም ተነሥቶ ወደ ይሁዳ አካባቢና ወደ ዮርዳኖስ ማዶ[a][b] መጣ። ሕዝቦችም እንደገና ወደ እርሱ ተሰበሰቡ፤ እርሱም እንደ ልማዱ እንደገና ያስተምራቸው ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ከዮርዳኖስ ባሻገር።» የግሪኩ ቃል ከዮርዳኖስ ወንዝ ማዶ ያለውን አካባቢ ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: የግሪኩ አገላለጽ «የይሁዳ አካባቢና ከዮርዳኖስ ማዶ» ወይም «ከዮርዳኖስ ማዶ ያለው የይሁዳ አካባቢ» ተብሎ ሊገባ ይችላል።
    reason: alternative_reading
