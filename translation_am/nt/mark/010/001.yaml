- source_word: πάλιν
  choice: እንደገና
  rationale: በቁጥሩ ሁለት ጊዜ ያለውን ድግግሞሽ በሁለቱም ቦታ ይጠብቃል።
- source_word: ὡς εἰώθει
  choice: እንደ ልማዱ
  rationale: የተለመደ ተደጋጋሚ ተግባርን በአጭርና በተፈጥሯዊ አማርኛ ያስተላልፋል።
