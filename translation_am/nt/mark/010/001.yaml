- source_word: πέραν τοῦ Ἰορδάνου
  choice: ከዮርዳኖስ ማዶ
  rationale: የዮርዳኖስን ወንዝ ማዶ ያለውን አካባቢ በተለመደና ግልጽ አማርኛ ያሳያል።
- source_word: συμπορεύονται ... ὄχλοι πρὸς αὐτόν
  choice: ሕዝቡም ... ወደ እርሱ ተሰበሰበ
