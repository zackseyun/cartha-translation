  rationale: የግሪኩ ሐረግ ሁለት አካባቢዎችን ሊጠቁም ወይም ሁለተኛው ሐረግ የመጀመሪያውን ሊገልጽ ይችላል፤ ዋናው ጽሑፍና ማስታወሻው ይህን አሻሚነት ይጠብቃሉ።
