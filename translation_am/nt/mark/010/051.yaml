  text: καὶ ἀποκριθεὶς ⸂αὐτῷ ὁ Ἰησοῦς εἶπεν⸃· Τί ⸂σοι θέλεις ποιήσω⸃; ὁ δὲ τυφλὸς εἶπεν αὐτῷ· Ραββουνι, ἵνα ἀναβλέψω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/051.yaml
  text: And answering him[a], Jesus said, “What do you want me to do for you?” And the blind man said to him, “Rabboni, that I may see again.”
translation:
  language: am
  text: ኢየሱስም መልሶ፣ “ምን እንዳደርግልህ ትፈልጋለህ?” አለው። ዓይነ ስውሩም፣ “ረቡኒ፣[a] እንደገና አይ ዘንድ” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ረቡኒ” የአራማይክ የአድራሻ ቃል ሲሆን፣ “መምህሬ” ወይም “አስተማሪዬ” ማለት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: መልሶ
  rationale: የግሪኩን የአድራጊ ቦዝ አንቀጽ ቅርጽ ይጠብቃል፤ በአማርኛም “መልሶ … አለው” ተፈጥሯዊ ነው።
- source_word: Τί σοι θέλεις ποιήσω
  choice: ምን እንዳደርግልህ ትፈልጋለህ?
  rationale: σοι የሚያመለክተውን “ለአንተ” በ“-ልህ” ያስተላልፋል፤ θέλειςንም “ትፈልጋለህ” ብሎ በግልጽና ተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: τυφλὸς
  choice: ዓይነ ስውሩ
  rationale: በግሪክ በስም ፋንታ የገባውን ቅጽል በተለመደውና ግለሰቡን በሚያመለክት የአማርኛ አገላለጽ ያቀርባል።
- source_word: Ραββουνι
  choice: ረቡኒ
  rationale: ግሪኩ ሴማዊውን የአድራሻ ማዕረግ በድምፅ አስቀምጦታል፤ የአማርኛው ትርጉምም ይህን ልዩ የታሪክና የስሜት ቀለም ይጠብቃል፣ ፍቺውም በማስታወሻ ይሰጣል።
- source_word: ἵνα ἀναβλέψω
  choice: እንደገና ማየት እንድችል
  rationale: በፈውስ አውድ ἀναβλέπω የጠፋውን የማየት ችሎታ መልሶ ማግኘትን ያመለክታል፤ ἵνα የሚያሳየውን የታሰበ ውጤትም “እንድችል” ይጠብቃል።
theological_decisions:
- issue: Ραββουνι የተባለውን የአድራሻ ማዕረግ መተርጎም
  choice: በዋናው ጽሑፍ “ረቡኒ” ተብሎ በድምፅ ተጽፎ፣ ፍቺው በግርጌ ማስታወሻ ተገለጸ
  alternative: “መምህሬ” ወይም “ጌታዬ”
  rationale: የግሪኩ ጽሑፍ የተለመደ የግሪክ ማዕረግ ሳይተካ ሴማዊውን አጠራር ስለጠበቀ፣ ያንኑ የምንጩን ቀለም በዋናው ጽሑፍ ማቆየትና ትርጉሙን በማስታወሻ መግለጽ ተመርጧል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ተሳቢ አወቃቀር በተፈጥሯዊው “መልሶ … አለው” ተጠብቋል፤ “ረቡኒ” የምንጩን ልዩ ድምፅ እንዲያቆይ ተደርጓል።
