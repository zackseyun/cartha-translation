  text: Ἦσαν δὲ ἐν τῇ ὁδῷ ἀναβαίνοντες εἰς Ἱεροσόλυμα, καὶ ἦν προάγων αὐτοὺς ὁ Ἰησοῦς, καὶ ἐθαμβοῦντο, ⸂οἱ δὲ⸃ ἀκολουθοῦντες ἐφοβοῦντο. καὶ παραλαβὼν πάλιν τοὺς δώδεκα ἤρξατο αὐτοῖς λέγειν τὰ μέλλοντα αὐτῷ συμβαίνειν
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/032.yaml
  text: They were on the road[a], going up to Jerusalem, and Jesus was going ahead of them; and they were astonished, while those who were following were afraid. And taking the Twelve aside again[b], he began to tell them the things that were about to happen to him.
translation:
  language: am
  text: ወደ ኢየሩሳሌም እየወጡ በመንገድ ላይ[a] ነበሩ፤ ኢየሱስም ከፊታቸው ይሄድ ነበር[b]። እነርሱም ተደንቀው ነበር፤ ተከትለው የሚሄዱት ግን ይፈሩ ነበር። እንደገናም አሥራ ሁለቱን ለብቻቸው ወስዶ፣ በእርሱ ላይ ሊደርስ ያለውን ነገር ሊነግራቸው ጀመር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በጉዞ ላይ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ከእነርሱ ቀድሞ ይሄድ ነበር።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῇ ὁδῷ
  choice: በመንገድ ላይ
  rationale: ተጨባጩን የጉዞ ሁኔታ በተፈጥሯዊ አማርኛ ያቆያል፤ ‘በጉዞ ላይ’ የሚለውም ትርጉም ይቻላል።
- source_word: ἀναβαίνοντες εἰς Ἱεροσόλυμα
  choice: ወደ ኢየሩሳሌም እየወጡ
  rationale: የኢየሩሳሌምን ከፍታና የጉዞውን ልማዳዊ አነጋገር የሚያንጸባርቅ ተፈጥሯዊ አገላለጽ ነው።
- source_word: προάγων αὐτούς
  choice: ከእነርሱ ቀድሞ ይሄድ ነበር
  rationale: ኢየሱስ ከቡድኑ ፊት እየሄደ መሆኑን በቀጥታ ያሳያል፤ ‘ይመራቸው ነበር’ የሚለውን ትርጓሜያዊ ጭማሪ ያስወግዳል።
- source_word: ἐθαμβοῦντο
  choice: ተደነቁ
  rationale: ከፍተኛ መደነቅንና ግራ መጋባትን ያለ አላስፈላጊ የድንጋጤ ማጋነን ያስተላልፋል።
- source_word: οἱ δὲ ἀκολουθοῦντες
  choice: ተከትለው የሚሄዱት ግን
  rationale: ቡድኑ ማንን እንደሚያካትት ሳይወስን የግሪኩን ተሳቢ አገላለጽ ይጠብቃል።
- source_word: ἐφοβοῦντο
  choice: ፈሩ
  rationale: የፍርሃትን ምላሽ ግልጽና ቀጥተኛ በሆነ አማርኛ ያቀርባል።
- source_word: παραλαβὼν πάλιν τοὺς δώδεκα
  choice: እንደገናም አሥራ ሁለቱን ለብቻቸው ወስዶ
  rationale: ኢየሱስ አሥራ ሁለቱን ለግል ትምህርት ከሌሎቹ ለይቶ መውሰዱን በዐውዱ መሠረት በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἤρξατο αὐτοῖς λέγειν
  choice: ይነግራቸው ጀመር
  rationale: የድርጊቱን መጀመር ጠብቆ በተለመደ አማርኛ ይገልጻል።
- source_word: τὰ μέλλοντα αὐτῷ συμβαίνειν
  choice: በእርሱ ላይ ሊደርሱ ያሉትን ነገሮች
  rationale: በቅርቡ የሚፈጸሙበትን ነገሮች ያሳያል፤ ግሪኩ በግልጽ ያልገለጸውን የዕጣ ፈንታ አስተሳሰብ አያክልም።
theological_decisions:
- issue: በሁለቱ ቡድኖች ስሜታዊ ምላሽ መካከል ያለው ልዩነት
  choice: ἐθαμβοῦντοን ‘ተደነቁ’፣ ἐφοβοῦντοን ደግሞ ‘ፈሩ’ ብሎ በተለያዩ ቃላት መተርጎም
  alternative: ሁለቱንም በአጠቃላይ መደነቅን ወይም ፍርሃትን በሚገልጹ ተመሳሳይ ቃላት መተርጎም
  rationale: የግሪኩ ጽሑፍ ሁለት የተለያዩ ግሶችን ይጠቀማል፤ ልዩነቱን ማቆየት የትረካውን ውጥረት ሳያስወግድ ያስተላልፋል።
