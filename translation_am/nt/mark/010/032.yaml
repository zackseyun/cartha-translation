  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የትረካው ቅደም ተከተልና በመደነቅና በፍርሃት መካከል ያለው ልዩነት ተጠብቋል።
