  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Τί με λέγεις ἀγαθόν; οὐδεὶς ἀγαθὸς εἰ μὴ εἷς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/018.yaml
  text: But Jesus said to him[a], “Why do you call me good? No one is good except one—God.”
translation:
  language: am
  text: ኢየሱስ ግን፣ “ለምን በጎ ብለህ ትጠራኛለህ?[a] ከአንዱ ከእግዚአብሔር በቀር በጎ የሆነ ማንም የለም” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም ይበልጥ ቃል በቃል፣ “ስለ ምን በጎ ትለኛለህ?”
    reason: τί በዚህ አገባብ ‘ለምን’ የሚል ሐሳብ ቢያስተላልፍም፣ ቃል በቃል ያለውን የ‘ምን’ ቅርጽ ለማሳየት።
lexical_decisions:
- source_word: δὲ
  choice: ግን
  rationale: በሰውየው ንግግርና በኢየሱስ መልስ መካከል ያለውን ቀላል ንጽጽርና የንግግር ሽግግር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: εἶπεν αὐτῷ
  choice: አለው
  rationale: ‘እንዲህ አለው’ የሚለውን ሐሳብ በአጭርና ተፈጥሯዊ አማርኛ ያቀርባል፤ የተናገረለትንም ሰው ያመለክታል።
- source_word: Τί
  choice: ለምን
  rationale: τί በቃል ደረጃ ‘ምን’ ቢሆንም፣ ከλέγεις ጋር በዚህ አገባብ ምክንያትን ይጠይቃል፤ ‘ለምን’ በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: με λέγεις ἀγαθόν
  choice: በጎ ትለኛለህ
  rationale: με የቀጥታ ተሳቢ መሆኑንና ἀγαθόν ለእርሱ የተሰጠ መግለጫ መሆኑን በቀጥታ ይጠብቃል።
- source_word: ἀγαθόν / ἀγαθὸς
  choice: በጎ
  rationale: የግሪኩን የቃል ድግግሞሽና የክርክሩን ኃይል በሁለቱም ስፍራ በአንድ ቃል ይጠብቃል፤ ‘ሥነ ምግባራዊ’ የሚል ትርጓሜ አይጨምርም።
- source_word: οὐδεὶς
  choice: የለም
  rationale: በአማርኛው ‘በጎ የለም’ የሚለው አገባብ ‘አንድም በጎ የለም’ የሚለውን ሁሉን አቀፍ እምቢታ በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: εἰ μὴ εἷς
  choice: ከአንዱ … በቀር
  rationale: የማግለያውን አገባብና εἷς የሚያጎላውን አንድነት ይጠብቃል።
- source_word: ὁ θεός
  choice: እግዚአብሔር
  rationale: በመደበኛ አማርኛ የእስራኤልን አምላክ ለመጥቀስ የተለመደ፣ የተከበረና ግልጽ ስያሜ ነው።
theological_decisions:
- issue: ስለ ክርስቶስ ማንነት ከኢየሱስ የበጎነት ንግግር ሊነሳ የሚችል አንድምታ
  choice: ንግግሩን በቀጥታ ተርጉሞ የትርጓሜ ማብራሪያ አለመጨመር
  alternative: ኢየሱስ መለኮትነቱን እንደካደ ወይም በግልጽ እንዳወጀ የሚያስመስል አተረጓጎም
  rationale: ጽሑፉ ኢየሱስ ሰውየው ‘በጎ’ ያለውን እንዲመረምር ሲጠይቅ ያቀርባል፤ ከዚህ በላይ ያለውን ክርስቶሎጂያዊ ድምዳሜ ትርጉሙ በራሱ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛ። ‘በጎ’ የሚለው ቃል በሁለቱም ጊዜ ተጠብቆ የግሪኩ ድግግሞሽ እንዲሰማ ተደርጓል።
