review_pass:
  verdict: revise
  source_fidelity: The draft preserves the discourse transition, Jesus’ question, the repeated term for “good,” and the exception identifying God. However, “በጎ የለም” can naturally be understood as “there is no good [thing]” rather than explicitly negating any person who is good; οὐδείς requires an explicit personal referent. “በጎ ትለኛለህ” is intelligible but is less idiomatic and less precise than an Amharic expression meaning “call me good.”
  naturalness: The revised wording uses natural modern standard Amharic while maintaining a dignified biblical register. “በጎ ብለህ ትጠራኛለህ” clearly and naturally expresses the predicative sense “call me good.”
  terminology: “እግዚአብሔር” is an appropriate standard Amharic rendering of ὁ θεός here. Repeating “በጎ” retains the source’s rhetorical lexical repetition and does not impose a theological interpretation.
  issues:
  - severity: medium
    issue: The clause “በጎ የለም” lacks an explicit personal subject.
    rationale: Greek οὐδείς means “no one.” In Amharic, without “ማንም,” the wording may refer to goodness as an abstraction or to a good thing, rather than stating that no person is good.
  - severity: low
    issue: “በጎ ትለኛለህ” is less idiomatic for “call me good.”
    rationale: Using “በጎ ብለህ ትጠራኛለህ” more clearly represents λέγεις with the object and predicate complement in natural modern Amharic.
  revised_text: ኢየሱስ ግን፣ “ለምን በጎ ብለህ ትጠራኛለህ?[a] ከአንዱ ከእግዚአብሔር በቀር በጎ የሆነ ማንም የለም” አለው።
