  to: ኢየሱስ ግን፣ “ለምን በጎ ብለህ ትጠራኛለህ?[a] ከአንዱ ከእግዚአብሔር በቀር በጎ የሆነ ማንም የለም” አለው።
  rationale: The revision makes the universal personal negation of οὐδείς explicit with “ማንም” and employs a more idiomatic Amharic construction for “call me good.” It retains the source’s ambiguity and does not add any Christological inference.
