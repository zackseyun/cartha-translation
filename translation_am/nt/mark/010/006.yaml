  yaml_path: translation/nt/mark/010/006.yaml
  text: But from the beginning of creation[b][a], he made them male and female.
translation:
  language: am
  text: ነገር ግን ከፍጥረት መጀመሪያ ጀምሮ፣ “ወንድና ሴት አደረጋቸው።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወንድና ሴት ፈጠራቸው።” የግሪኩ ግስ “አደረገ” የሚል ቢሆንም፣ “ፈጠረ” የዘፍጥረትን የፍጥረት አውድ ያንጸባርቃል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ δὲ ἀρχῆς κτίσεως
  choice: ነገር ግን ከፍጥረት መጀመሪያ ጀምሮ
  rationale: δὲ ከቀደመው ስለ ፍቺ ከተነገረው ጋር ንፅፅርን ስለሚያሳይ “ነገር ግን” ተብሏል፤ ἀπό የጊዜ መነሻን ስለሚጠቁም “ከ…ጀምሮ” ተብሏል።
- source_word: ἄρσεν καὶ θῆλυ
  choice: ወንድና ሴት
  rationale: የዘፍጥረቱን ጥቅስ በተፈጥሮ የፆታ ጥንድነቱን በሚገልጽና በዘመናዊ አማርኛ በተለመደ አነጋገር ያቀርባል።
- source_word: ἐποίησεν
  choice: አድርጎ ፈጠራቸው
  rationale: ποιέω በቀጥታ “አደረገ/ሠራ” ማለት ቢሆንም፣ በአማርኛ “ወንድና ሴት አደረጋቸው” የኋላ ለውጥን ሊያሰማ ይችላል። “አድርጎ ፈጠራቸው” የግሱን ትርጉምና የዘፍጥረቱን የፍጥረት አውድ በአንድነት ያስቀምጣል።
- source_word: αὐτούς
  choice: -አቸው
  rationale: በ“ፈጠራቸው” ውስጥ ያለው የብዙ ቁጥር ተሳቢ ቅጥያ የግሪኩን αὐτούς በተፈጥሯዊ አማርኛ ይወክላል።
theological_decisions:
- issue: የዘፍጥረቱ ጥቅስ የፆታ ቃላት
  choice: ወንድና ሴት
  alternative: ወንድ ሰውና ሴት ሰው
  rationale: አጭሩ አገላለጽ የግሪኩን ἄρσεν καὶ θῆλυ የፆታ ጥንድነት ይጠብቃል፤ ማኅበራዊ ሚናን የሚጨምር ትርጓሜም አያስገባም።
- issue: ያልተገለጸው መለኮታዊ ባለቤት
  choice: ባለቤቱን በግሱ ውስጥ ብቻ ማሳየት
  alternative: እግዚአብሔር ፈጠራቸው
  rationale: በግሪኩ ባለቤቱ በስም አልተገለጸም። የአማርኛው “ፈጠራቸው” የሦስተኛ መደብ ወንድ ነጠላ ባለቤትን ያሳያል፣ “እግዚአብሔር” ብሎ በግልጽ ስም ከመጨመር ይቆጠባል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የጥቅሱ ቃላት በጥቅስ ምልክት ቀርበዋል፤ ሥርዓተ ነጥቡ ለአማርኛ ተፈጥሯዊነት ተስተካክሏል።
