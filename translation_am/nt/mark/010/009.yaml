  yaml_path: translation/nt/mark/010/009.yaml
  text: Therefore[a], what God has joined together, man must not separate.
translation:
  language: am
  text: ስለዚህ እግዚአብሔር ያጣመረውን ሰው[a] አይለየው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ሰው” የተባለው ማንኛውንም ሰው ማለት ነው። የግሪኩ ነጠላ ቃል እዚህ በአጠቃላይ ፍቺ ጥቅም ላይ ውሏል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ
  choice: ያጣመረውን
  rationale: ገለልተኛ ነጠላ አንጻራዊ ተውላጠ ስም ሲሆን፣ ከዚህ በፊት የተገለጸውን የጋብቻ ኅብረት በአንድነት ያመለክታል። በአማርኛ ከግሱ ጋር ተዋሕዶ መተርጎሙ ተፈጥሯዊ ነው።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ስለ ጋብቻ እና ስለ እግዚአብሔር ዓላማ ከቀረበው ክርክር የሚወጣውን መደምደሚያ ያሳያል።
- source_word: ὁ θεὸς
  choice: እግዚአብሔር
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የግሪኩን θεός በግልጽና በክብር የሚያስተላልፍ የተለመደ ስያሜ ነው።
- source_word: συνέζευξεν
  choice: ያጣመረውን
  rationale: συζεύγνυμι ሁለትን በአንድ ቀንበር እንደማሰር ወይም አንድ ላይ እንደማጣመር ያለውን ምስላዊ ፍቺ ይይዛል። ‘አጣመረ’ በጋብቻ አውድ ተፈጥሯዊ ሆኖ የመለኮታዊውን ድርጊት ይጠብቃል።
- source_word: ἄνθρωπος
  choice: ሰው
  rationale: ያለ አመልካች የቀረበው ነጠላ ስም አጠቃላይ የሰውን ልጅ ያመለክታል። ‘ሰው’ በአማርኛ ይህን አካታች ነጠላ ኃይል በተፈጥሮ ይገልጣል።
- source_word: μὴ χωριζέτω
  choice: አይለየው
  rationale: μή ከአሁን ጊዜ ሦስተኛ መደብ ትእዛዛዊ ግስ ጋር ሆኖ ግልጽ ክልከላን ያሳያል። ‘አይለየው’ በዘመናዊ አማርኛ የክልከላውን ኃይልና የጋብቻውን አውድ በቀጥታ ያስተላልፋል።
theological_decisions:
- issue: በጋብቻ ንግግሩ ውስጥ የἄνθρωπος አጠቃላይ ኃይል
  choice: በዋናው ጽሑፍ ‘ሰው’ ተብሎ ተተርጉሟል፤ ይህም ወንድና ሴትን ያካተተ አጠቃላይ ሰብአዊ ማጣቀሻ ነው።
  alternative: ማንም ሰው
  rationale: ግሪኩ ነጠላ ስምን በአጠቃላይ ኃይል ይጠቀማል። የአማርኛው ‘ሰው’ ይህን ነጠላነትና አካታችነት ያለ ጾታዊ ግዴታ ይጠብቃል፤ ‘ማንም’ ትርጉሙን ግልጽ ቢያደርግም በግሪኩ ላይ በግልጽ የሌለ አጽንኦት ሊጨምር ይችላል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅመናል። ‘ያጣመረውን’ የግሪኩን የአንድ ላይ ማሰር ምስል ሳያከብድ ይጠብቃል፤ ‘አይለየው’ ደግሞ የትእዛዙን ክልከላ በተፈጥሯዊ አማርኛ ያቀርባል።
