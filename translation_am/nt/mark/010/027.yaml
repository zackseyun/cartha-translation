language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀ἐμβλέψας αὐτοῖς ὁ Ἰησοῦς λέγει· Παρὰ ἀνθρώποις ἀδύνατον ἀλλ’ οὐ παρὰ θεῷ, πάντα γὰρ ⸀δυνατὰ παρὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/027.yaml
  text: Jesus looked at them and said, “With men it is impossible, but not with God, because all things are possible with God.”
translation:
  language: am
  text: ኢየሱስም ተመልክቶአቸው፣ “በሰዎች ዘንድ የማይቻል ነው፤ በእግዚአብሔር ዘንድ ግን የማይቻል አይደለም፤ ሁሉ በእግዚአብሔር ዘንድ ይቻላልና” አላቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας αὐτοῖς
  choice: ተመልክቶአቸው
  rationale: የግሱን ቀጥተኛና አተኩሮ የማየት ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: Παρὰ ἀνθρώποις
  choice: በሰዎች ዘንድ
  rationale: παρά ከዳቲቭ ጋር ያለውን ‘በሰዎች በኩል/አቅም’ ትርጉም ይጠብቃል።
- source_word: ἀδύνατον
  choice: የማይቻል ነው
  rationale: የሰውን አለመቻል በግልጽና ዘመናዊ አገላለጽ ያቀርባል።
- source_word: πάντα γὰρ δυνατὰ παρὰ τῷ θεῷ
  choice: ሁሉ በእግዚአብሔር ዘንድ ይቻላልና
  rationale: γάρን በ‘-ና’ ምክንያታዊ አያያዝ ያሳያል፤ πάνταንም ያለ ተጨማሪ ገደብ ‘ሁሉ’ ብሎ ይጠብቃል።
theological_decisions:
- issue: ‘ሁሉ ይቻላል’ የሚለው ወሰን
  choice: ሁሉ በእግዚአብሔር ዘንድ ይቻላል
  alternative: እግዚአብሔር ሁሉን ማድረግ ይችላል
  rationale: የግሪኩን አገላለጽና ከሰዎች አለመቻል ጋር ያለውን ተቃርኖ በቅርብ ይጠብቃል፤ ጥቅሱ ያልገለጸውን ሥነ-መለኮታዊ ማብራሪያ አይጨምርም።
- issue: ἀλλ’ οὐ παρὰ θεῷ የሚለው አሉታዊ ቅርጽ
  choice: በእግዚአብሔር ዘንድ ግን እንዲህ አይደለም
  alternative: ለእግዚአብሔር ግን የማይቻል አይደለም
  rationale: ‘የማይቻል’ የሚለው ከጽሑፉ ተውጦ ቢሆንም በአማርኛ በግልጽ ይመለሳል፤ ዋናውን ተቃርኖ ሳይቀይር ተፈጥሯዊ ንግግር ይሰጣል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለመደበኛ አንባቢ ግልጽ የሆነ አማርኛ። ‘በ…ዘንድ’ የሚለው ቅርጽ የግሪኩን ትይዩነት ለመጠበቅ ተመርጧል።
