- from: ኢየሱስም ተመልክቶአቸው፣ “በሰዎች ዘንድ ይህ የማይቻል ነው፤ በእግዚአብሔር ዘንድ ግን እንዲህ አይደለም፤ ሁሉ በእግዚአብሔር ዘንድ ይቻላልና” አላቸው።
  to: ኢየሱስም ተመልክቶአቸው፣ “በሰዎች ዘንድ የማይቻል ነው፤ በእግዚአብሔር ዘንድ ግን የማይቻል አይደለም፤ ሁሉ በእግዚአብሔር ዘንድ ይቻላልና” አላቸው።
  rationale: The revision removes the added demonstratives and explicitly supplies the predicate “የማይቻል” in the second clause. This is a natural Amharic resolution of the Greek ellipsis, makes the contrast unmistakable, and does not add theological interpretation. No footnotes are required.
