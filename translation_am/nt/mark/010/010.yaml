base_translation:
  language: en
  yaml_path: translation/nt/mark/010/010.yaml
  text: And in the house again[b][a], the disciples were asking him about this.
translation:
  language: am
  text: እንደገናም ወደ ቤት ከገቡ በኋላ፣ ደቀ መዛሙርቱ ስለዚህ ጉዳይ ይጠይቁት ነበር።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “እንደገና” የሚለው ከጥያቄው ጋር ተያይዞ፣ “ወደ ቤትም ከገቡ በኋላ፣ ደቀ መዛሙርቱ ስለዚህ ጉዳይ እንደገና ይጠይቁት ነበር” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: -ም
  rationale: የግሪኩን ተራኪ አያያዥ በተፈጥሯዊ የአማርኛ ቅጥያ ያሳያል።
- source_word: εἰς τὴν οἰκίαν
  choice: ወደ ቤት ከገቡ በኋላ
  rationale: εἰς የሚያመለክተውን ወደ ውስጥ መግባት በተፈጥሯዊ የትረካ አማርኛ ይገልጻል፤ ብዙ ቁጥሩ ከዐውዱ የተገነዘቡትን ኢየሱስንና ደቀ መዛሙርቱን ያመለክታል።
- source_word: πάλιν
  choice: እንደገና
  rationale: ‘እንደገና/ዳግመኛ’ የሚለውን መሠረታዊ ትርጉም ይጠብቃል፤ በዋናው ጽሑፍ ከወደ ቤት መመለስ ጋር ተያይዟል፣ ሌላው የአያያዝ እድል በማስታወሻ ቀርቧል።
- source_word: οἱ μαθηταὶ
  choice: ደቀ መዛሙርቱ
  rationale: በዐውዱ የታወቁትን የኢየሱስ ተከታዮች የሚጠቅስ የተለመደና ክቡር አገላለጽ ነው።
- source_word: περὶ τούτου
  choice: ስለዚህ ጉዳይ
  rationale: τούτου ወደ ቀደመው የፍቺ ውይይት እንደሚያመለክት ግልጽ በሆነ ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐπηρώτων αὐτόν
  choice: ይጠይቁት ነበር
  rationale: ያልተፈጸመውን የግሪክ የኃላፊ ጊዜ ገጽታ እንደ ቀጣይ ወይም ተደጋጋሚ ጥያቄ ያሳያል፤ ‘ጀመሩ’ የሚል በግልጽ ያልተጻፈ የመጀመር ሐሳብ አይጨምርም።
