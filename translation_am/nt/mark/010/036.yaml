  text: And he said to them, “What do you want me to do for you?”
translation:
  language: am
  text: እርሱም፣ “ምን እንዳደርግላችሁ ትፈልጋላችሁ?” አላቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: እርሱም
  rationale: ὁ δὲ በትረካው ውስጥ ባለቤቱን በመቀጠል ያመለክታል፤ እርሱም የሚለው ቅርጽ የδέን ቀጣይነት በተፈጥሯዊ አማርኛ ያስተላልፋል፣ ያልተገለጸ ተቃርኖም አያክልም።
- source_word: εἶπεν αὐτοῖς
  choice: አላቸው
  rationale: εἶπεν መናገርን፣ αὐτοῖς ደግሞ ብዙ ተቀባዮችን ያመለክታሉ። አላቸው ሁለቱንም በተፈጥሯዊና አጭር የአማርኛ አገላለጽ ይይዛል፤ ግሪኩ በግልጽ ስለማይል ሁለቱንም የሚል ቃል አልተጨመረም።
- source_word: Τί θέλετε
  choice: ምን ... ትፈልጋላችሁ?
  rationale: Τί ቀጥተኛውን የምን ጥያቄ ያቀርባል፤ θέλετε ደግሞ ፍላጎትን ይገልጣል። ትፈልጋላችሁ ዘመናዊ፣ ተፈጥሯዊና ቀጥተኛ ነው።
- source_word: ποιήσω ὑμῖν
  choice: እንዳደርግላችሁ
  rationale: ποιήσω በዚህ አውድ ማድረግን ያመለክታል፤ ὑμῖν ድርጊቱ ለእነርሱ ጥቅም እንደሚፈጸም የሚያሳይ ተጠቃሚ ዳቲቭ ነው። እንዳደርግላችሁ ይህን ግንኙነት በአማርኛ ግስ ቅጥያ በተፈጥሯዊ ሁኔታ ይገልጣል።
theological_decisions: []
translation_notes:
  register: ዘመናዊ መደበኛ አማርኛ፣ ክቡር ነገር ግን ለተራ አንባቢ ቀላል የሆነ ቀጥተኛ ንግግር። የግሪኩ ቀላል የትረካ ፍሰትና የጥያቄው ቀጥተኛነት ተጠብቀዋል።
