  text: Καὶ περιβλεψάμενος ὁ Ἰησοῦς λέγει τοῖς μαθηταῖς αὐτοῦ· Πῶς δυσκόλως οἱ τὰ χρήματα ἔχοντες εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/023.yaml
  text: And looking around[a], Jesus says to his disciples, “How difficult it is for those who have wealth to enter the kingdom of God!”
translation:
  language: am
  text: 'ኢየሱስም ዙሪያውን ተመልክቶ ለደቀ መዛሙርቱ፣ “ሀብት ያላቸው[a] ወደ የእግዚአብሔር መንግሥት መግባት ምንኛ እንደሚከብድ!” ይላቸዋል።


    [a] ወይም፣ “ገንዘብ ያላቸው” ወይም “ንብረት ያላቸው።”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ገንዘብ ያላቸው” ወይም “ንብረት ያላቸው።”
    reason: χρήματα ገንዘብን፣ ንብረትን ወይም ሀብትን ሊያመለክት የሚችል ሰፊ ቃል ስለሆነ የቃላት አማራጮቹን ያሳያል።
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: ዙሪያውን ተመልክቶ
  rationale: የግሪኩን የአኦሪስት አጋዥ ግስ ከዋናው ግስ በፊት የተፈጸመ ድርጊት አድርጎ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: λέγει
  choice: ይላቸዋል
  rationale: በማርቆስ ትረካ የሚገኘውን ታሪካዊ የአሁን ጊዜ ግስና የትረካውን ሕያውነት ይጠብቃል።
- source_word: Πῶς δυσκόλως
  choice: እንዴት ይከብዳቸዋል
  rationale: ‘በከባድ ሁኔታ’ የሚለውን ትርጉም በተፈጥሯዊና አጽንዖት ባለው የአማርኛ አገላለጽ ያስተላልፋል፤ የማይቻል ነው የሚል ትርጉም አይጨምርም።
- source_word: οἱ τὰ χρήματα ἔχοντες
  choice: ሀብት ያላቸው
  rationale: የግሪኩን ‘ገንዘብ/ንብረት ያላቸው’ የሚለውን አገላለጽ ሳይጠብብ ይይዛል፤ ‘ሀብታሞች’ በሚል ቋሚ የማኅበራዊ ምድብ አይተካውም።
- source_word: χρήματα
  choice: ሀብት
  rationale: ቃሉ ገንዘብን ብቻ ሳይሆን ቁሳዊ ንብረትንም ሊያመለክት ስለሚችል ‘ሀብት’ ስፋቱን ይጠብቃል።
- source_word: βασιλείαν τοῦ θεοῦ
  choice: የእግዚአብሔር መንግሥት
  rationale: የመንግሥትን ምስልና በማርቆስ ውስጥ ያለውን ሥነ መለኮታዊ ቀጣይነት የሚጠብቅ ግልጽና የተለመደ አተረጓጎም ነው።
- source_word: εἰσελεύσονται
  choice: መግባት … ይከብዳቸዋል
  rationale: የወደፊት ጊዜውን አቅጣጫ በአማርኛ የዘወትር/የወደፊት አገባብ በተፈጥሯዊ ሁኔታ ያቀርባል።
theological_decisions:
- issue: ንግግሩ ሀብት ላላቸው መግባት ፈጽሞ የማይቻል መሆኑን ወይስ እጅግ ከባድ መሆኑን ይገልጻል?
  choice: ከባድነቱን ብቻ በመግለጽ፣ ‘መግባት እንዴት ይከብዳቸዋል!’
  alternative: በተግባር ፈጽሞ የማይቻል እንደሆነ አድርጎ የሚያቀርብ የተጠናከረ ትርጉም
  rationale: δυσκόλως ከባድነትን እንጂ ፈጽሞ የማይቻልነትን አይናገርም፤ ስለዚህ ጥቅሱ ያለውን ሥነ መለኮታዊ ውጥረት ሳይፈታ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ታሪካዊው የአሁን ጊዜ ‘ይላቸዋል’ የማርቆስን ሕያው የትረካ ቅርጽ ይጠብቃል። የግርጌ ማስታወሻው ከሚያብራራው ‘ሀብት’ ቃል ጋር በቀጥታ ተያይዟል።
