review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders Jesus’ looking around, the historical present, the group characterized as possessing wealth, and entry into God’s kingdom. Its wording for difficulty, however, is less idiomatic as an Amharic exclamation and does not as clearly carry the prospective force of εἰσελεύσονται.
  naturalness: The construction ‘... መግባት እንዴት ይከብዳቸዋል!’ is understandable, but ‘ምንኛ እንደሚከብድ!’ is more natural modern standard Amharic for the Greek exclamatory expression. Adding ‘ለ’ before ‘ደቀ መዛሙርቱ’ makes the speech frame fully natural.
  terminology: ‘ሀብት,’ ‘የእግዚአብሔር መንግሥት,’ and ‘ደቀ መዛሙርቱ’ are appropriate and retain the source sense without doctrinal overstatement. The lexical-alternative footnote is correctly anchored to ‘ሀብት.’
  issues:
  - severity: low
    issue: The exclamatory difficulty clause is somewhat awkward and weakly expresses the future-oriented verb.
    rationale: Πῶς δυσκόλως ... εἰσελεύσονται is naturally conveyed by an Amharic exclamation using ‘ምንኛ እንደሚከብድ,’ which also naturally accommodates the prospective sense.
  - severity: low
    issue: The indirect-object phrase in the speech frame lacks the usual dative marker.
    rationale: ‘ለደቀ መዛሙርቱ’ is the natural form before ‘ይላቸዋል.’
