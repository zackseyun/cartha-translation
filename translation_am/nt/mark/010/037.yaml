  text: οἱ δὲ εἶπαν αὐτῷ· Δὸς ἡμῖν ἵνα εἷς ⸂σου ἐκ δεξιῶν⸃ καὶ εἷς ἐξ ⸀ἀριστερῶν καθίσωμεν ἐν τῇ δόξῃ σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/037.yaml
  text: They said to him, “Grant to us that one of us may sit at your right and one at your left in your glory.”
translation:
  language: am
  text: እነርሱም፣ “በክብርህ አንዳችን በቀኝህ፣ ሌላችንም በግራህ እንድንቀመጥ ፍቀድልን” አሉት።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δὸς ἡμῖν
  choice: ፍቀድልን
  rationale: ቃል በቃል ‘ስጠን’ ማለት ቢቻልም፣ ከἵνα ጋር ያለው የጥያቄ አገባብ በተፈጥሯዊ አማርኛ ‘እንድን... ፍቀድልን’ ተብሎ ይገለጣል።
- source_word: εἷς ... καὶ εἷς
  choice: ከእኛ አንዱ ... አንዱም
  rationale: ተናጋሪዎቹ ሁለቱ ለራሳቸው የጠየቁትን በግልጽ እና በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐκ δεξιῶν ... ἐξ ἀριστερῶν
  choice: በቀኝህ ... በግራህ
  rationale: የክብርና የሥልጣን ቦታን የሚያመለክተውን ምስላዊ አነጋገር ሳይተረጉም ይጠብቃል።
- source_word: ἐν τῇ δόξῃ σου
  choice: በክብርህ
  rationale: ἐν የሚያሳየውን የሁኔታ/የመስክ ግንኙነት በአጭርና በተለመደ መንገድ ይገልጣል።
theological_decisions:
- issue: ‘በክብርህ’ የሚያመለክተው የክብሩ ጊዜና መልክ
  choice: በክብርህ
  alternative: በመንግሥትህ / በክብር ስትገለጥ
  rationale: ግሪኩ ‘ክብር’ ይላል፤ ቃሉን ‘መንግሥት’ ወይም የወደፊት መገለጥ ብሎ መወሰን በጽሑፉ ያለውን ክፍት ትርጉም ያጠባል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። የግሪኩ የንግግር ቅደም ተከተል ለተፈጥሯዊ አማርኛ ተስተካክሏል፤ ምስላዊና ሥነ መለኮታዊ ቃላቱ ግን ተጠብቀዋል።
