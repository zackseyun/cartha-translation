review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the request introduced by Δὸς ἡμῖν, the paired placements at Jesus’ right and left, and the setting ‘in your glory.’ It preserves the source’s wording ‘glory’ without importing ‘kingdom’ or a particular eschatological interpretation.
  naturalness: The wording is generally clear and suitably dignified. However, ‘ከእኛ አንዱ ... አንዱም’ followed by the plural verb ‘እንድንቀመጥ’ is less idiomatic than using the distributive first-person forms ‘አንዳችን ... ሌላችን.’
  terminology: ‘ክብር’ is the appropriate modern standard Amharic equivalent for δόξα here. ‘ፍቀድልን’ naturally renders the request force of Δὸς ἡμῖν with the purpose clause and does not add theological interpretation.
  issues:
  - severity: low
    issue: Paired subject phrasing is slightly awkward
    rationale: Replacing the repeated ‘አንዱ’ construction with ‘አንዳችን ... ሌላችን’ makes explicit and idiomatic the sense that each speaker seeks one of the two positions, while retaining the Greek plural ‘we may sit.’
  revised_text: እነርሱም፣ “በክብርህ አንዳችን በቀኝህ፣ ሌላችንም በግራህ እንድንቀመጥ ፍቀድልን” አሉት።
  revised_footnotes: []
