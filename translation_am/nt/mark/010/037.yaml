  to: እነርሱም፣ “በክብርህ አንዳችን በቀኝህ፣ ሌላችንም በግራህ እንድንቀመጥ ፍቀድልን” አሉት።
  rationale: 'A small idiomatic revision resolves the awkward relationship between the distributive expressions and the plural verb. The revision retains every material element of the Greek: they address him, request permission for themselves, seek one place at his right and another at his left, and locate this request in his glory. No footnote is needed because the translated wording does not depend on a disputed reading or require clarification beyond the verse itself.'
