  text: Καὶ προσπορεύονται αὐτῷ Ἰάκωβος καὶ Ἰωάννης ⸀οἱ υἱοὶ Ζεβεδαίου λέγοντες ⸀αὐτῷ· Διδάσκαλε, θέλομεν ἵνα ὃ ἐὰν αἰτήσωμέν ⸀σε ποιήσῃς ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/035.yaml
  text: And James and John[a], the sons of Zebedee, came to him and said to him, “Teacher, we want you to do for us whatever we ask of you.”
translation:
  language: am
  text: 'የዘብዴዎስ ልጆች ያዕቆብና ዮሐንስ ወደ እርሱ ቀርበው[a]፣ “መምህር ሆይ፣ የምንጠይቅህን ሁሉ እንድታደርግልን እንፈልጋለን” አሉት።


    [a] ወይም፣ “ወደ እርሱ መጡ።” የግሪኩ ግስ ወደ ኢየሱስ መሄድን ወይም መቅረብን ያመለክታል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወደ እርሱ መጡ።” የግሪኩ ግስ ወደ ኢየሱስ መሄድን ወይም መቅረብን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: προσπορεύονται
  choice: ወደ እርሱ ቀርበው
  rationale: ግሱ ወደ አንድ ሰው መሄድን ወይም መቅረብን ያመለክታል። በአማርኛ ትረካ ውስጥ “ቀርበው” ተፈጥሯዊ ሲሆን ወደ ኢየሱስ የተደረገውን እንቅስቃሴ ይጠብቃል፤ የታሪክ የአሁን ጊዜውም በተፈጥሯዊ የአማርኛ ያለፈ ጊዜ ተተርጉሟል።
- source_word: οἱ υἱοὶ Ζεβεδαίου
  choice: የዘብዴዎስ ልጆች
  rationale: የግሪኩን የዝምድና መለያ በቀጥታና በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: λέγοντες αὐτῷ
  choice: አሉት
  rationale: የግሪኩ ቦዝ አንቀጽ በአማርኛ ትረካ ውስጥ ተፈጥሯዊ በሆነ ዋና ግስ ተተርጉሟል፤ “-ት” የሚለውም ንግግሩ ለእርሱ እንደተነገረ ያሳያል።
- source_word: Διδάσκαλε
  choice: መምህር ሆይ
  rationale: የጥሪ ቅርጹን በዘመናዊና ክብር ባለው አማርኛ ይገልጣል፤ ቃሉ በዋናነት አስተማሪነትን እንጂ ሌላ የሥልጣን ማዕረግን አያስገባም።
- source_word: θέλομεν
  choice: እንፈልጋለን
  rationale: የግሪኩን ቀጥተኛ ፍላጎት በግልጽና በዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἵνα
  choice: እንድታደርግልን
  rationale: ከፍላጎት ግስ በኋላ የሚመጣው ἵνα አንቀጽ በአማርኛ “እንድ-” ቅርጽ ተፈጥሯዊ ሆኖ ይተረጎማል።
- source_word: ὃ ἐὰν αἰτήσωμέν σε
  choice: የምንለምንህን ማንኛውንም ነገር
  rationale: ὃ ἐάν ያለውን ያልተወሰነ “ማንኛውንም/የትኛውንም” ሐሳብ ይጠብቃል። “መለመን” እዚህ ለአንድ ሰው ጥያቄ ማቅረብን ያመለክታል።
- source_word: ποιήσῃς ἡμῖν
  choice: እንድታደርግልን
  rationale: ποιέω ያለውን ሰፊ “ማድረግ” ትርጉም ይጠብቃል፤ “እንድትሰጠን” ወይም “እንድትፈቅድልን” ብሎ የተዘዋዋሪውን ሐሳብ አይጫንም።
