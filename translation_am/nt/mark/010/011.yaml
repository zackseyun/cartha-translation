id: MRK.10.11
reference: Mark 10:11
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ὃς ⸀ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ καὶ γαμήσῃ ἄλλην μοιχᾶται ἐπ’ αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/011.yaml
  text: And he says to them[a], “Whoever divorces his wife and marries another commits adultery against her.”
translation:
  language: am
  text: እርሱም፣ “ሚስቱን ፈትቶ ሌላ ሴት የሚያገባ ሁሉ በእሷ ላይ ያመነዝራል” አላቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: አላቸው
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ አገላለጽ በማርቆስ ትረካ የተለመደ ቢሆንም፣ በተፈጥሯዊ የአማርኛ ትረካ የኃላፊ ጊዜው አገላለጽ ግልጽና የተለመደ ነው።
- source_word: αὐτοῖς
  choice: አላቸው
  rationale: የብዙ ቁጥር ተቀባዮችን ‘-ላቸው’ የሚለው ቅጥያ በተፈጥሯዊ አማርኛ ያመለክታል።
- source_word: Ὃς ἂν
  choice: … የሚያገባ ሁሉ
  rationale: አጠቃላይና ያልተወሰነውን ሁኔታ ‘… ሁሉ’ የሚለው ዘመናዊ የአማርኛ አወቃቀር በግልጽ ያስተላልፋል።
- source_word: ἀπολύσῃ
  choice: ፈትቶ
  rationale: በጋብቻ አውድ ‘መፍታት’ ሕጋዊና ግንኙነታዊ የፍቺን ትርጉም በተለመደ አማርኛ ይገልጣል።
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: ሚስቱን
  rationale: የባለቤትነት ቅጥያውና የፍቺው አውድ γυνή እዚህ ‘ሚስት’ ማለት መሆኑን ያሳያሉ።
- source_word: γαμήσῃ ἄλλην
  choice: ሌላ ሴት የሚያገባ
  rationale: ἄλλην የሴት ጾታ ቅርጽ ስለሆነ ‘ሌላ ሴት’ ማለት ነው፤ በአማርኛም ይህን በግልጽ መግለጽ ተፈጥሯዊ ነው።
- source_word: μοιχᾶται
  choice: ያመነዝራል
  rationale: ‘ማመንዘር’ በጋብቻ ታማኝነት ላይ የሚፈጸመውን ዝሙት የሚገልጽ የተለመደና ቀጥተኛ ቃል ነው።
- source_word: ἐπ’ αὐτήν
  choice: በእሷ ላይ
  rationale: ይህ አገላለጽ ድርጊቱ በተፈታችው ሚስት ላይ የሚፈጸም በደል መሆኑን ሳያጠፋ ያስተላልፋል።
theological_decisions:
- issue: ἐπ’ αὐτήν ድርጊቱ በሚስቱ ላይ የተፈጸመ በደል መሆኑን የሚያሳይ ኃይል
  choice: በእሷ ላይ ያመነዝራል
  alternative: ያመነዝራል፤ ከሌላዋ ጋር ያመነዝራል
  rationale: የግሪኩን ቅድመ አቀማመጥ በመተው ድርጊቱ ሚስቱን የሚበድል መሆኑ እንዳይጠፋ ተጠብቋል።
- issue: Ὃς ἂν የሚያሳየው አጠቃላይ ሁኔታና በአውዱ ያለው ወንድ ባል
  choice: ሚስቱን ፈትቶ ሌላ ሴት የሚያገባ ሁሉ
  alternative: ማንም ሰው ሚስቱን ፈትቶ…
  rationale: ‘… ሁሉ’ ያልተወሰነውን አጠቃላይ ሁኔታ ይጠብቃል፤ ‘ሚስቱን’ እና ‘ሌላ ሴት’ ደግሞ የአውዱን ባል በቂ ግልጽ ያደርጋሉ።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። በግሪኩ ያለው ‘ሌላ’ የሴት ጾታ ቅርጽ በአማርኛ ‘ሌላ ሴት’ ተብሎ በዋናው ጽሑፍ በግልጽ ስለተተረጎመ የቃላት አማራጭ የግርጌ ማስታወሻ አላስፈለገም።
