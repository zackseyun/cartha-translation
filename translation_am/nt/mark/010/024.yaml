  text: οἱ δὲ μαθηταὶ ἐθαμβοῦντο ἐπὶ τοῖς λόγοις αὐτοῦ. ὁ δὲ Ἰησοῦς πάλιν ἀποκριθεὶς λέγει αὐτοῖς· Τέκνα, πῶς δύσκολόν ⸀ἐστιν εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/024.yaml
  text: But the disciples were astonished at his words. Jesus answered again and said to them[a], “Children, how difficult it is to enter the kingdom of God!”
translation:
  language: am
  text: ደቀ መዛሙርቱ ግን በቃላቱ ተደነቁ። ኢየሱስም ደግሞ መልሶ እንዲህ አላቸው፦ “ልጆች ሆይ፣ ወደ እግዚአብሔር መንግሥት መግባት እንዴት ከባድ ነው![a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች፣ “ልጆች ሆይ፣ በሀብት ለሚታመኑት ወደ እግዚአብሔር መንግሥት መግባት እንዴት ከባድ ነው!” ይላሉ።
    reason: textual_variant
lexical_decisions:
- source_word: ἐθαμβοῦντο
  choice: ተደነቁ
  rationale: ግሱ ጠንካራ የመደነቅ ስሜትን ያመለክታል፤ የግሪኩ ኢምፐርፌክት ቅርጽ በአማርኛ ትረካ ተፈጥሯዊ በሆነው ቀላል ያለፈ ጊዜ ተተርጉሟል።
- source_word: ἐπὶ τοῖς λόγοις αὐτοῦ
  choice: በቃሉ
  rationale: ἐπί ከዳቲቭ ጋር የመደነቃቸውን መነሻ ወይም ምክንያት ያሳያል። ብዙ ቁጥር ያለው λόγοις በዚህ አውድ ‘ባለው ነገር’ ማለት ስለሆነ፣ ‘በቃሉ’ የተፈጥሮ አማርኛ ነው።
- source_word: πάλιν
  choice: እንደገና
  rationale: የኢየሱስን ዳግም መናገር የሚያሳየውን የንግግር ፍሰት በግልጽ ሁኔታ ይጠብቃል።
- source_word: ἀποκριθεὶς λέγει
  choice: መልሶ እንዲህ አላቸው
  rationale: ሁለቱንም የግሪክ ግሶች ሳይጥል፣ የሴማዊ ተጽዕኖ ያለበትን አገላለጽ በተፈጥሯዊና ክቡር አማርኛ ያቀርባል።
- source_word: Τέκνα
  choice: ልጆች ሆይ
  rationale: ሞቅ ያለ የቤተሰብ ቅርበት የሚያሳይ ቀጥተኛ ጥሪ ነው፤ በግሪኩ የሌለውን ‘የእኔ’ ወይም ‘ትንንሽ’ የሚል ትርጉም አይጨምርም።
- source_word: πῶς δύσκολόν ἐστιν
  choice: እንዴት ከባድ ነው
  rationale: πῶς ያለውን የአጽንዖትና የአድናቆት ኃይል ይጠብቃል፤ ቀላል የማረጋገጫ ንግግር ብቻ አያደርገውም።
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν
  choice: ወደ እግዚአብሔር መንግሥት መግባት
  rationale: የኢንፊኒቲቭ ሐረጉን ይዘት በቀጥታና በተለመደ የአማርኛ አገላለጽ ያስተላልፋል።
theological_decisions:
- issue: ‘በሀብት ለሚታመኑ’ የሚለውን ረዘም ያለ ንባብ በዋናው ጽሑፍ ማካተት ወይም አለማካተት
  choice: የSBLGNTን አጭር ንባብ፣ ‘ወደ እግዚአብሔር መንግሥት መግባት እንዴት ከባድ ነው’ በዋናው ጽሑፍ መከተል
  alternative: ‘ልጆች ሆይ፣ በሀብት ለሚታመኑ ወደ እግዚአብሔር መንግሥት መግባት እንዴት ከባድ ነው!’
  rationale: የቀረበው የግሪክ ምንጭ አጭሩን ንባብ ይዟል። ረዘም ያለው ንባብ ንግግሩን በሀብት በሚታመኑት ላይ ብቻ በማጥበብ የትርጓሜ ውጤት ስላለው፣ ወደ ዋናው ጽሑፍ ሳይገባ በግርጌ ማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክቡር መደበኛ አማርኛ ተጠቅሟል። ‘ልጆች ሆይ’ የጥሪውን ርኅራኄ ይጠብቃል፤ ‘እንዴት ከባድ ነው’ ደግሞ የግሪኩን አጽንዖትና ያልተፈታ ሥነ መለኮታዊ ውጥረት አያለዝብም።
