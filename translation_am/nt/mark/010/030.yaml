  rationale: ግሪኩ የተትረፈረፈ ምላሽንና ቀጣይ ስደትን አብሮ ያቀርባል፤ ትርጉሙ ይህን ውጥረት አይፈታም።
- issue: የቤተሰብ ቃላት ጾታዊ ትክክለኛነት
  choice: ἀδελφοὺς እና ἀδελφὰςን ለይቶ «ወንድሞችን፣ እህቶችን» ማለት
  alternative: ሁለቱን በአንድ አጠቃላይ ጾታ-አልባ ቃል ማቅረብ
  rationale: ምንጩ ሁለቱን ለይቶ ስለጠቀሰ ትርጉሙም ልዩነቱን ይጠብቃል።
