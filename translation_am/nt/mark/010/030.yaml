  text: ἐὰν μὴ λάβῃ ἑκατονταπλασίονα νῦν ἐν τῷ καιρῷ τούτῳ οἰκίας καὶ ἀδελφοὺς καὶ ἀδελφὰς καὶ ⸀μητέρας καὶ τέκνα καὶ ἀγροὺς μετὰ διωγμῶν, καὶ ἐν τῷ αἰῶνι τῷ ἐρχομένῳ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/030.yaml
  text: who will not receive a hundredfold now in this time—houses and brothers and sisters and mothers and children and fields[a], with persecutions—and in the age to come[b], eternal life.
translation:
  language: am
  text: አሁን በዚህ ዘመን፣ ከስደቶች ጋር፣ መቶ እጥፍ[a] ቤቶችን፣ ወንድሞችን፣ እህቶችን፣ እናቶችን፣ ልጆችንና እርሻዎችን የማያገኝ የለም፤ በሚመጣው ዘመን[b] ደግሞ የዘላለም ሕይወትን ያገኛል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «መቶ ጊዜ ያህል»።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «በመጪው ዘመን»።
    reason: lexical_alternative
lexical_decisions:
- source_word: λάβῃ
  choice: የማያገኝ የለም
  rationale: በተስፋ ቃሉ አውድ ውስጥ λαμβάνω የሚያመለክተው በምላሹ የሚሰጠውን ማግኘት ነው፤ ይህ አገላለጽ የግሪኩን አሉታዊ አጽንዖትም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἑκατονταπλασίονα
  choice: መቶ እጥፍ
  rationale: የመቶ እጥፍ ብዛትን ቀጥተኛና በአማርኛ የተለመደ በሆነ መንገድ ያሳያል።
- source_word: νῦν ἐν τῷ καιρῷ τούτῳ
  choice: አሁን በዚህ ዘመን
  rationale: አሁን ያለውን ዘመን ከሚመጣው ዘመን ጋር የሚያነጻጽረውን ጊዜያዊ አጽንዖት ይጠብቃል።
- source_word: οἰκίας
  choice: ቤቶችን
  rationale: ተጨባጭ የሆነውን ብዙ ቁጥር በቀጥታ ይጠብቃል።
- source_word: ἀδελφοὺς καὶ ἀδελφὰς
  choice: ወንድሞችን፣ እህቶችን
  rationale: ግሪኩ ወንድና ሴት ወንድማማቾችን ለይቶ ስለዘረዘረ ልዩነቱ ተጠብቋል።
- source_word: μητέρας καὶ τέκνα
  choice: እናቶችን፣ ልጆችን
  rationale: የሁለቱንም ስሞች ብዙ ቁጥርና ሰፊ የቤተሰብ ትርጉም ይጠብቃል።
- source_word: ἀγρούς
  choice: እርሻዎችን
  rationale: ἀγρός በዚህ አውድ የእርሻ መሬቶችን ያመለክታል፤ «እርሻዎች» ተጨባጭና ተፈጥሯዊ ነው።
- source_word: μετὰ διωγμῶν
  choice: ከስደት ጋር
  rationale: በአሁኑ ዘመን ያለው በረከት መከራን እንደማያስቀር በግልጽ ያስቀምጣል። «ስደት» እንደ ስብስብ ስም በአማርኛ ተፈጥሯዊ ነው።
- source_word: ἐν τῷ αἰῶνι τῷ ἐρχομένῳ
  choice: በሚመጣው ዘመን
  rationale: αἰώνን እንደ ዘመን ይተረጉማል፤ ከ«አሁን በዚህ ዘመን» ጋር ያለውን የፍጻሜ ዘመን ንጽጽር ይጠብቃል።
- source_word: ζωὴν αἰώνιον
  choice: የዘላለምን ሕይወት
  rationale: በአማርኛ የተለመደና ትክክለኛ የፍጻሜ ዘመን አገላለጽ ነው።
theological_decisions:
