  choice: ቤቶችን፣ የቤተሰብ ግንኙነቶችንና እርሻዎችን እውነተኛ የአሁኑ ዘመን ምላሽ አድርጎ በቀጥታ መተርጎም፣ «ከስደት ጋር» የሚለውንም ሳያለዝቡ ማቆየት
