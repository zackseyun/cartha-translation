  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸂ἔφη ὁ Ἰησοῦς⸃· Ἀμὴν λέγω ὑμῖν, οὐδείς ἐστιν ὃς ἀφῆκεν οἰκίαν ἢ ἀδελφοὺς ἢ ἀδελφὰς ἢ ⸂μητέρα ἢ πατέρα⸃ ἢ τέκνα ἢ ἀγροὺς ἕνεκεν ἐμοῦ καὶ ἕνεκεν τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/029.yaml
  text: Jesus said, “Truly I say to you, there is no one who has left house or brothers or sisters or mother or father or children or fields for my sake and for the sake of the gospel,”
translation:
  language: am
  text: ኢየሱስ እንዲህ አለ፦ “እውነት እላችኋለሁ፤ ስለ እኔና ስለ ወንጌል ቤትን ወይም ወንድሞችን ወይም እህቶችን ወይም እናትን ወይም አባትን ወይም ልጆችን ወይም እርሻዎችን የተወ ማንም የለም፤”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφη
  choice: እንዲህ አለ
  rationale: የኢየሱስን ንግግር በተፈጥሯዊና ግልጽ አማርኛ ያስገባል፤ በግሪኩ ያልተገለጸ የመመለስ ወይም የማወጅ ተጨማሪ ሐሳብ አያስገባም።
- source_word: Ἀμὴν
  choice: እውነት
  rationale: ከንግግር በፊት የመጣውን የማረጋገጫና የጥብቅ አዋጅ አገላለጽ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: λέγω ὑμῖν
  choice: እላችኋለሁ
  rationale: የግሪኩን ቀጥተኛነትና የተከበረ የአዋጅ ቅርጽ ይጠብቃል።
- source_word: οὐδείς ἐστιν ὃς
  choice: … የተወ ማንም የለም
  rationale: አጠቃላይ አሉታዊውን ትርጉም በተለመደ የአማርኛ አገባብ ያቀርባል፤ ሐረጉ በቀጣዩ ቁጥር እንደሚሟላም ክፍት ሆኖ ይቆያል።
- source_word: ἀφῆκεν
  choice: የተወ
  rationale: መልቀቅን በቀጥታ ይገልጻል፤ በግሪኩ ያልተገለጸውን የመካድ ወይም የኃላፊነት ጥሎ መሄድ ጽኑ ሐሳብ አያክልም።
- source_word: οἰκίαν
  choice: ቤትን
  rationale: ሕንፃን ወይም የመኖሪያ ንብረትን ሊያመለክት የሚችለውን ቀጥተኛ ቃል ይጠብቃል።
- source_word: ἀδελφοὺς / ἀδελφὰς
  choice: ወንድሞችን / እህቶችን
  rationale: ግሪኩ ወንድና ሴት ወንድማማቾችን ለይቶ ስለዘረዘረ ልዩነቱ ተጠብቋል።
- source_word: τέκνα
  choice: ልጆችን
  rationale: ጾታን ሳይለይ ዘርን ወይም ልጆችን የሚገልጸው ሰፊና ተፈጥሯዊ አቻ ቃል ነው።
- source_word: ἀγρούς
  choice: እርሻዎችን
  rationale: የሚታረሱ መስኮችን ወይም የእርሻ መሬቶችን በተጨባጭና በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἕνεκεν ἐμοῦ καὶ ἕνεκεν τοῦ εὐαγγελίου
  choice: ስለ እኔና ስለ ወንጌል
  rationale: ለመተዉ ምክንያት የሆኑትን ሁለቱንም—ኢየሱስንና ወንጌልን—በእኩል ግልጽነት ያቀርባል።
theological_decisions:
- issue: ቤትንና ቤተሰብን መተው የሚለውን ሐሳብ ከልክ በላይ አለማጠናከር
  choice: የተወ
  alternative: የካደ / ጥሎ የሄደ
  rationale: ጥቅሱ ስለ ኢየሱስና ስለ ወንጌል የሚከፈለውን የደቀ መዝሙርነት ዋጋ ይገልጻል፤ ነገር ግን የቤተሰብ ሥነ ምግባራዊ ኃላፊነትን መካድ እንደሆነ አይናገርም። “የተወ” የጽሑፉን ውጥረት ሳያጠፋ ተጨማሪ የሥነ መለኮት ፍርድ አያስገባም።
- issue: ቁጥር 29 በቁጥር 30 የሚቀጥል ያልተጠናቀቀ ሐረግ መሆኑ
  choice: የመዝጊያውን ንግግር ከፊል ማቆሚያ በመጠቀም ሐረጉን ለቀጣዩ ቁጥር ክፍት ማድረግ
  alternative: ቁጥሩን ብቻውን ሙሉ ዐረፍተ ነገር አድርጎ መዝጋት
  rationale: የግሪኩ οὐδείς … ὃς አገባብ በቁጥር 30 ባለው ἐὰν μὴ λάβῃ ይሟላል። ትርጉሙ ይህን የሰዋስውና የሐሳብ ቀጣይነት አይደብቅም።
