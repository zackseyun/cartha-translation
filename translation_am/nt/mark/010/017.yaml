  text: Καὶ ἐκπορευομένου αὐτοῦ εἰς ὁδὸν προσδραμὼν εἷς καὶ γονυπετήσας αὐτὸν ἐπηρώτα αὐτόν· Διδάσκαλε ἀγαθέ, τί ποιήσω ἵνα ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/017.yaml
  text: And as he was going out onto the road[a], one man ran up and knelt before him and asked him, “Good Teacher, what must I do so that I may inherit eternal life?”
translation:
  language: am
  text: እርሱም ወደ መንገድ ሲወጣ፣[a] አንድ ሰው ሮጦ ወደ እርሱ ቀረበና በፊቱ ተንበርክኮ፣ “በጎ መምህር ሆይ፣ የዘላለምን ሕይወት እንድወርስ ምን ላድርግ?” ብሎ ጠየቀው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ጉዞ ሊጀምር ሲዘጋጅ።” የግሪኩ አገላለጽ ወደ መንገድ መውጣትን ወይም ጉዞ መጀመርን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένου αὐτοῦ εἰς ὁδόν
  choice: እርሱም ወደ መንገድ ሲወጣ
  rationale: የድርጊቱን ተጓዳኝ ጊዜና የመንቀሳቀስ ምስል በተፈጥሯዊ አማርኛ ይጠብቃል፤ አገላለጹ ጉዞ መጀመርንም ሊያመለክት ስለሚችል አማራጩ በእግር ማስታወሻ ተጠቅሷል።
- source_word: προσδραμὼν
  choice: ሮጦ ወደ እርሱ ቀረበ
  rationale: ሰውየው በችኮላና በጉጉት መቅረቡን ግልጽ በሆነ ዘመናዊ አማርኛ ያሳያል።
- source_word: εἷς
  choice: አንድ ሰው
  rationale: ቃሉ አንድን ግለሰብ ያስተዋውቃል፤ “ሰው” በአማርኛ ተፈጥሯዊ ሲሆን ከዐውደ ንባቡ ውጭ ተጨማሪ መግለጫ አያስገባም።
- source_word: γονυπετήσας αὐτόν
  choice: በፊቱ ተንበርክኮ
  rationale: የአክብሮትና የልመናውን አኳኋን ያለ ከመጠን ያለፈ ትርጓሜ ይገልጻል።
- source_word: ἐπηρώτα αὐτόν
  choice: ጠየቀው
  rationale: የግሪኩ ኢምፐርፌክት ቅርጽ የቀጣይነት ጥላ ሊኖረው ቢችልም፣ በዚህ ትረካ ውስጥ “ጠየቀው” ተፈጥሯዊና ትክክለኛ ነው።
- source_word: Διδάσκαλε ἀγαθέ
  choice: ቸር መምህር ሆይ
  rationale: διδάσκαλος የሚለውን “መምህር” ብሎ በትክክል ያቀርባል፤ ἀγαθέ የሚለውም ለቀጣዩ ንግግር አስፈላጊ ስለሆነ “ቸር” ተብሎ ተጠብቋል።
- source_word: τί ποιήσω
  choice: ምን ላድርግ?
  rationale: የምክክር/ውሳኔ ጥያቄውን እና ሊደረግ የሚገባውን ተግባር በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἵνα
  choice: እንድወርስ
  rationale: የዓላማውን ግንኙነት በአማርኛው የ“እንድ-” መዋቅር ግልጽና አጭር አድርጎ ያሳያል።
- source_word: ζωὴν αἰώνιον
  choice: የዘላለምን ሕይወት
  rationale: የቃሉን ጊዜያዊና ሥነ መለኮታዊ አንድምታ የሚጠብቅ የተለመደና ግልጽ አገላለጽ ነው።
- source_word: κληρονομήσω
  choice: እንድወርስ
  rationale: የውርስን ምስልና የቃሉን ልዩ ትርጉም ይጠብቃል፤ “እንዳገኝ” ብሎ አያዳክመውም።
