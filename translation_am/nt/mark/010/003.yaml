reference: Mark 10:3
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Τί ὑμῖν ἐνετείλατο Μωϋσῆς;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/003.yaml
  text: But he answered them, “What did Moses command you?”
translation:
  language: am
  text: እርሱም መልሶ፣ “ሙሴ ምን አዘዛችሁ?” አላቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: ም
  rationale: δέ ቀላል አያያዥ ሲሆን፣ በዚህ የውይይት መልስ ውስጥ ያለውን መጠነኛ ተቃርኖ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: መልሶ፣ … አላቸው
  rationale: ይህን በግሪክኛ የተለመደውን ድርብ አገላለጽ ያልተንዛዛና ተፈጥሯዊ በሆነ የአማርኛ የመልስ ንግግር አወቃቀር ያቀርባል፤ αὐτοῖς ደግሞ በ«አላቸው» ተካትቷል።
- source_word: Τί
  choice: ምን
  rationale: የትእዛዙን ይዘት የሚጠይቀውን ቀጥተኛ ጥያቄ በግልጽና በተለመደ አማርኛ ያስተላልፋል።
- source_word: ὑμῖν
  choice: -አችሁ
  rationale: የትእዛዙ ተቀባዮች ብዙ ሰዎች መሆናቸውን በግሱ የተሳቢ ቅጥያ ያሳያል።
- source_word: ἐνετείλατο
  choice: አዘዘ
  rationale: በሙሴ ሕግ ዙሪያ ባለው ውይይት የግሱን ሥልጣናዊና ሕጋዊ ኃይል ይጠብቃል።
- source_word: Μωϋσῆς
  choice: ሙሴ
  rationale: በዘመናዊ መደበኛ አማርኛና በመጽሐፍ ቅዱስ አጠቃቀም የተለመደው የስሙ ቅርጽ ነው።
theological_decisions:
- issue: በኢየሱስ መልስ ውስጥ የሙሴ ሥልጣን መጠቀሱ
  choice: ጽሑፉ እንደሚለው «ሙሴ» የተባለውን የትእዛዙን ሰብዓዊ አስተላላፊ በስሙ ማቆየት
  alternative: «የሙሴ ሕግ ምን ያዛችኋል?» ወይም «እግዚአብሔር በሙሴ በኩል ምን አዘዛችሁ?»
  rationale: የግሪክኛው ጽሑፍ ሙሴን በግልጽ ይጠራል፤ «ሕግ» ወይም «እግዚአብሔር በሙሴ በኩል» የሚል ማብራሪያ ግን አይጨምርም። ስለዚህ የጥቅሱን የሥነ መለኮት ውጥረት ሳይፈታ የምንጩን አነጋገር በቀጥታ ይጠብቃል።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ ነው። «እርሱም መልሶ» የግሪክኛውን የውይይት ሽግግርና የመልስ ኃይል ይጠብቃል፤ «ምን አዘዛችሁ?» ደግሞ አጭርና ተፈጥሯዊ ቀጥተኛ ጥያቄ ነው።
