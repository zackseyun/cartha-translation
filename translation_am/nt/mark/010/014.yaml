  text: ἰδὼν δὲ ὁ Ἰησοῦς ἠγανάκτησεν καὶ εἶπεν αὐτοῖς· Ἄφετε τὰ παιδία ἔρχεσθαι πρός με, μὴ κωλύετε αὐτά, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/014.yaml
  text: But when Jesus saw it[a], he was indignant and said to them, “Let the children come to me; do not hinder them, for the kingdom of God belongs to such as these.”
translation:
  language: am
  text: ኢየሱስ ግን ይህን ባየ ጊዜ ተቆጣና እንዲህ አላቸው፤ “ልጆቹ ወደ እኔ እንዲመጡ ፍቀዱላቸው፤ አትከልክሏቸው፤ የእግዚአብሔር መንግሥት እንደነዚህ ላሉት ነውና።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ይበልጥ ቃል በቃል፣ “የእግዚአብሔር መንግሥት የእንደነዚህ ያሉ ሰዎች ነው።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Ἰησοῦς
  choice: ኢየሱስ ግን ይህን ባየ ጊዜ
  rationale: የአኦሪስት አጋማሽ ግስ የኢየሱስን ምላሽ ሁኔታ ያስተዋውቃል፤ ‘ይህን’ ከቀደመው አውድ የተረዳ ሲሆን፣ δὲ የተማሪዎቹን ድርጊት የሚቃረን ቀላል ንፅፅር ስላለው ‘ግን’ ተብሏል።
- source_word: ἠγανάκτησεν
  choice: ተቆጥቶ
  rationale: ቃሉ ጠንካራ ቅሬታንና በትክክል ያልሆነ ድርጊት ላይ የሚነሳ ቁጣን ያመለክታል፤ ‘ተቆጥቶ’ በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: Ἄφετε τὰ παιδία ἔρχεσθαι πρός με
  choice: ልጆቹ ወደ እኔ እንዲመጡ ተዉአቸው
  rationale: Ἄφετε በዚህ አውድ ‘ፍቀዱ/ተዉ’ ማለት ነው፤ ‘ተዉአቸው’ ቀጥተኛውን ትእዛዝ በተፈጥሯዊ አማርኛ ያስተላልፋል። παιδία በአጠቃላይ ‘ልጆች’ ተብሏል፣ በቃሉ ውስጥ ያልተገለጸ የዕድሜ ዝርዝር አልተጨመረም።
- source_word: μὴ κωλύετε αὐτά
  choice: አትከልክሏቸው
  rationale: κωλύω መንገድ መዝጋትን፣ መከልከልን ወይም እንቅፋት መሆንን ያመለክታል፤ የአሁን ጊዜ አስገዳጅ ቅርጹ እየተደረገ ያለን ተግባር እንዲቆምም ሊያመለክት ይችላል።
- source_word: τῶν γὰρ τοιούτων ἐστὶν
  choice: እንደነዚህ ላሉት ነውና
  rationale: τοιούτων እነዚህን ልጆች ብቻ ሳይሆን ‘እንደነዚህ ያሉትን’ በወካይነት ያመለክታል። የግሪኩ የባለቤትነት አገላለጽ በተፈጥሯዊ አማርኛ ‘ላሉት ነው’ ተብሎ ተላልፏል፣ ቀጥተኛው ቅርጽ ግን በማስታወሻ ተጠብቋል።
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: የእግዚአብሔር መንግሥት
  rationale: የተለመደ፣ ግልጽና የግሪኩን ሐረግ ቅርጽ የሚጠብቅ አተረጓጎም ነው፤ በዚህ ጥቅስ ‘አገዛዝ’ በማለት የትርጉሙን ስፋት አልተገደበም።
theological_decisions:
- issue: “τῶν ... τοιούτων” የሚያመለክተው ማንን ነው?
  choice: “እንደነዚህ ላሉት” በማለት ልጆቹ የአንድ ዓይነት ሰዎች ወኪሎች መሆናቸውን ማሳየት
  alternative: ሐረጉን ለተገኙት ልጆች ብቻ መገደብ፣ ወይም “መንግሥቱ ከእንደነዚህ ነው” ብሎ ቃል በቃል መተው
  rationale: τοιούτων ‘እንዲህ ያሉት’ ወይም ‘የዚህ ዓይነት ሰዎች’ የሚል ወካይ ኃይል አለው። ጥቅሱ ስለ ልጆች ንጽሕና፣ ራስ-ሰር መዳን ወይም ሌላ የሥነ መለኮት ዝርዝር ስለማይናገር፣ እነዚህ አልተጨመሩም።
- issue: “ἐστὶν” እና የጄኒቲቭ ሐረጉ ግንኙነት
  choice: በዋናው ጽሑፍ “ላሉት ነው” በማለት የመድረስ/የመሆን ግንኙነቱን ተፈጥሯዊ ማድረግ፣ ቃል በቃል ቅርጹን በእግር ማስታወሻ ማሳየት
  alternative: “የእንደነዚህ ነው” ብሎ ቃል በቃል መተርጎም
  rationale: ግሪኩ በቀጥታ ‘የእንደነዚህ ነው’ የሚል ቅርጽ ቢኖረውም፣ በአማርኛ ይህ እንግዳና የማይገለጥ ሊሆን ይችላል። ዋናው ትርጉም ግን መንግሥቱን ከሰዎቹ ጋር በባለቤትነት/ተገቢነት የሚያያይዘውን የጽሑፉን ውጥረት ይጠብቃል።
