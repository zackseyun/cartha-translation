  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የቀጥታ ንግግሩ ትእዛዛዊ ኃይል ተጠብቋል፤ ከጽሑፉ ያልተነሱ የቤተ እምነት ልዩ ትምህርቶች አልተጨመሩም።
