  yaml_path: translation/nt/mark/010/026.yaml
  text: And they were exceedingly astonished[a], saying to one another, “Then who can be saved?”
translation:
  language: am
  text: እነርሱም እጅግ ተደንቀው ነበር፤ እርስ በርሳቸውም፣ “ታዲያ ማን ሊድን ይችላል?” እያሉ ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: እነርሱም
  rationale: በአውዱ ያሉትን ደቀ መዛሙርት/ሰሚዎች ወደ ኋላ ያመለክታል፤ -ም የδέን የንግግር ቀጣይነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: περισσῶς ἐξεπλήσσοντο
  choice: እጅግ ተደንቀው
  rationale: περισσῶς የመደነቁን ከፍተኛ መጠን ያጠናክራል፤ ይህ አገላለጽ በዘመናዊ አማርኛ ጠንካራና ተፈጥሯዊ ነው።
- source_word: λέγοντες πρὸς ἑαυτούς
  choice: እርስ በርሳቸው … አሉ
  rationale: ብዙ ሰዎች በውይይት አውድ ሲናገሩ πρὸς ἑαυτούς የመደጋገፍ ትርጉም ስላለው ‘እርስ በርሳቸው’ ተፈጥሯዊ ነው፤ የግሪኩ ተሳቢ አንቀጽ በአማርኛ በዋና ግስ ተተርጉሟል።
- source_word: Καὶ τίς
  choice: ታዲያ ማን
  rationale: Καὶ እዚህ ከቀደመው ትምህርት የሚነሳ ውጤታዊ ጥያቄን ያስገባል፤ ‘ታዲያ’ ይህን አንድምታ በግልጽ ያቀርባል።
- source_word: δύναται σωθῆναι
  choice: ሊድን ይችላል
  rationale: δύναται ችሎታን/የመቻል ሁኔታን ያሳያል፤ σωθῆναι ደግሞ በመንግሥተ እግዚአብሔር አውድ የመዳንን ሥነ መለኮታዊ ክብደት ይይዛል።
theological_decisions:
- issue: በአውዱ ውስጥ የσωθῆναι ትርጉም
  choice: ሊድን
  alternative: ሊታደግ / ነፃ ሊወጣ
  rationale: በዙሪያው ያለው ንግግር ወደ እግዚአብሔር መንግሥት ስለመግባት ስለሆነ፣ ‘ሊድን’ ከጊዜያዊ አደጋ መታደግ ይልቅ ሰፊውን የመዳን ትርጉም ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘እርስ በርሳቸው’ በዚህ የብዙ ተናጋሪዎች አውድ πρὸς ἑαυτούςን በቂ ስለሚወክል የግድ የግርጌ ማስታወሻ አልተጨመረም።
