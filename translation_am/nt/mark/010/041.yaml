- source_word: ἀγανακτεῖν
  choice: በጣም መቆጣት
  rationale: ቃሉ ከቀላል ቅሬታ የጠነከረ ቁጣና እርካታ ማጣትን ያመለክታል፤ ይህ አገላለጽ በዘመናዊ አማርኛ ግልጽ ነው።
- source_word: περὶ Ἰακώβου καὶ Ἰωάννου
  choice: በያዕቆብና በዮሐንስ ላይ
  rationale: በአውዱ ቁጣው ወደ ሁለቱ የተመራ መሆኑን በተፈጥሯዊ አማርኛ ያሳያል፤ περί የቁጣውን ምክንያት ወይም ጉዳይም ሊያመለክት ስለሚችል አማራጩ በማስታወሻ ተጠብቋል።
- source_word: Ἰακώβου
  choice: ያዕቆብ
