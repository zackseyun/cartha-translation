revisions:
- from: ሁለቱም አንድ ሥጋ ይሆናሉ። ስለዚህ ከእንግዲህ አንድ ሥጋ ናቸው እንጂ ሁለት አይደሉም።
  to: ሁለቱ አንድ ሥጋ ይሆናሉ። ስለዚህ ከእንግዲህ ሁለት አይደሉም፤ ይልቁንም አንድ ሥጋ ናቸው።
  rationale: The revision retains all key lexical choices while restoring the source order and force of οὐκέτι εἰσὶν δύο ἀλλὰ μία σάρξ. «ይልቁንም» supplies a natural explicit adversative equivalent for ἀλλά without interpreting the meaning of “one flesh.” No footnote is necessary in Amharic, since the resultative nuance is adequately conveyed by «ይሆናሉ» and the translation remains unambiguous.
  reviewer_model: gpt-5.6-terra
