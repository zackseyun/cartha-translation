review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the future/resultative sense of ἔσονται, the biblical marital expression «አንድ ሥጋ», and the inference introduced by ὥστε. However, its second sentence reverses the Greek contrast and combines the clauses in a less transparent Amharic order. Restoring “no longer two, but one flesh” makes the source argument explicit.
  naturalness: «ሁለቱ» is more directly equivalent to οἱ δύο than «ሁለቱም» here. The revised contrast, «ሁለት አይደሉም፤ ይልቁንም አንድ ሥጋ ናቸው», is clear, idiomatic modern standard Amharic, and retains the solemn register.
  terminology: «ሥጋ» appropriately retains σάρξ and its Genesis intertext without narrowing it to «አካል» or supplying doctrinal interpretation. No names or specialized theological terms require adjustment.
  issues:
  - severity: medium
    issue: The δεύτερη clause places «አንድ ሥጋ ናቸው» before «ሁለት አይደሉም» and uses «እንጂ» in a construction that obscures the explicit Greek sequence and adversative contrast.
    rationale: The source says, “they are no longer two but one flesh.” A direct negative-then-positive contrast better preserves Jesus’ stated inference and reads more naturally.
  - severity: low
    issue: «ሁለቱም» adds an emphatic sense of “both.”
    rationale: Although not materially wrong, «ሁለቱ» more closely represents the article plus numeral, “the two,” and supports the following two/one contrast.
  revised_text: ሁለቱ አንድ ሥጋ ይሆናሉ። ስለዚህ ከእንግዲህ ሁለት አይደሉም፤ ይልቁንም አንድ ሥጋ ናቸው።
  revised_footnotes: []
  revision_rationale: The revision retains all key lexical choices while restoring the source order and force of οὐκέτι εἰσὶν δύο ἀλλὰ μία σάρξ. «ይልቁንም» supplies a natural explicit adversative equivalent for ἀλλά without interpreting the meaning of “one flesh.” No footnote is necessary in Amharic, since the resultative nuance is adequately conveyed by «ይሆናሉ» and the translation remains unambiguous.
