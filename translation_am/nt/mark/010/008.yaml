id: MRK.10.8
reference: Mark 10:8
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν· ὥστε οὐκέτι εἰσὶν δύο ἀλλὰ μία σάρξ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/008.yaml
  text: and the two will become one flesh. So they are no longer two[a], but one flesh.
translation:
  language: am
  text: ሁለቱ አንድ ሥጋ ይሆናሉ። ስለዚህ ከእንግዲህ ሁለት አይደሉም፤ ይልቁንም አንድ ሥጋ ናቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔσονται
  choice: ይሆናሉ
  rationale: የεἰμί የወደፊት ጊዜ ቅርጽ ሲሆን፣ ከεἰς እና ከውጤት ገላጭ ሐረጉ ጋር በዚህ አውድ ወደ አንድነት መምጣትን ያመለክታል፤ «ይሆናሉ» ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: οἱ δύο
  choice: ሁለቱም
  rationale: መስተዋድዱንና ቁጥሩን በአማርኛ ተፈጥሯዊ ሁኔታ ይጠብቃል፤ በቀጣዩ ንጽጽር ያለውን ግልጽ ሁለትነትም ያሳያል።
- source_word: εἰς σάρκα μίαν
  choice: አንድ ሥጋ
  rationale: εἰς የሚያመለክተው የውጤት አቅጣጫ «ይሆናሉ» በሚለው ግስ ውስጥ በቂ ሁኔታ ይገለጣል፤ «አንድ ሥጋ» የዘፍጥረትን ቋሚ የጋብቻ አገላለጽ ይጠብቃል።
- source_word: σάρκα / σάρξ
  choice: ሥጋ
  rationale: እዚህ ያለው ቃል ቀጥተኛውንና ቅዱስ ጽሑፋዊውን የጋብቻ አገላለጽ ይዟል፤ «አካል» ወይም ሌላ ትርጓሜያዊ ቃል መተካት የአገላለጹን ስፋት ያጠብባል።
- source_word: ὥστε
  choice: ስለዚህ
  rationale: ከቀደመው ንግግር የሚመነጨውን ውጤት ወይም መደምደሚያ በግልጽና በዘመናዊ አማርኛ ያሳያል።
- source_word: οὐκέτι
  choice: ከእንግዲህ … አይደሉም
  rationale: ቀድሞ የነበረ ሁኔታ ከአሁን በኋላ እንደማይቀጥል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀλλὰ μία σάρξ
  choice: አንድ ሥጋ ናቸው እንጂ
  rationale: የግሪኩን ጠንካራ ተቃርኖ በተፈጥሯዊው «… እንጂ … አይደሉም» የአማርኛ አወቃቀር ይገልጣል።
theological_decisions:
- issue: በኢየሱስ የዘፍጥረት ጥቅስ ውስጥ «አንድ ሥጋ» የሚለው ትርጉም
  choice: የቃል ኪዳንና የጋብቻ አገላለጹን «አንድ ሥጋ» በቀጥታ ማቆየት
  alternative: አንድ አካል፤ አንድ ሰው፤ በጾታ የተዋሐዱ
  rationale: ሐረጉ ሰፊ ቅዱስ ጽሑፋዊ፣ ሰብአዊና የጋብቻ ትርጉም አለው፤ ቁጥሩ ግን ይህን ወደ አንድ ብቻ ፍቺ አያጠብበውም። ምንጩን አገላለጽ ማቆየት የጽሑፉን ስፋትና መለኮታዊ ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩ አንድነትና ሁለትነት ንጽጽር ተጠብቋል፤ በአማርኛ «ይሆናሉ» የውጤት ሐሳቡን በቂ ስለሚያሳይ የεἰς ቀጥተኛ ተመሳሳይ ቃል አልተጨመረም።
