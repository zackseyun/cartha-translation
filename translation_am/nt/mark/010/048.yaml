  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἐπετίμων αὐτῷ πολλοὶ ἵνα σιωπήσῃ· ὁ δὲ πολλῷ μᾶλλον ἔκραζεν· Υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/048.yaml
  text: And many were rebuking him so that he would be silent[a], but he was crying out all the more, “Son of David, have mercy on me!”
translation:
  language: am
  text: ብዙዎችም ዝም እንዲል ይገሥጹት ነበር፤ እርሱ ግን ይበልጥ ይጮኽ ነበር፦ “የዳዊት ልጅ[a] ሆይ፣ ማረኝ!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የዳዊት ልጅ” ንጉሣዊና መሲሐዊ ማዕረግ ነው። ፍቺው “መሲሕ” ተብሎ ሊገለጽ ይችላል፤ እዚህ ግን የግሪኩ አገላለጽ እንዳለ ተጠብቋል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμων
  choice: ገሠጹት
  rationale: ግሱ የሚያመለክተውን ጠንካራ ተግሣጽ ይጠብቃል፤ የግሪኩ ያልተፈጸመ ጊዜ በዐውዱ የቀጠለ ወይም የተደጋገመ ድርጊት ሊያመለክት ቢችልም፣ በአማርኛ ተፈጥሯዊነት ሲባል ቀላሉ ያለፈ ጊዜ ተመርጧል።
- source_word: πολλοὶ
  choice: ብዙዎች
  rationale: በግሪኩ በስም ፈንታ የቆመውን ቅጽል በቀጥታ ይተረጉማል፤ ‘ሕዝቡ’ የሚል በምንጩ የሌለ የቡድን ስም አይጨምርም።
- source_word: ἵνα σιωπήσῃ
  choice: ዝም እንዲል
  rationale: የተግሣጹን ዓላማ በተፈጥሯዊና ቀጥተኛ አማርኛ ያሳያል።
- source_word: πολλῷ μᾶλλον
  choice: ከበፊቱ ይበልጥ
  rationale: የንጽጽሩን ኃይል ይጠብቃል፤ ግሪኩ በግልጽ ያልጨመረውን ‘ድምፁን ከፍ አድርጎ’ የሚል ትርጓሜ አያስገባም።
- source_word: ἔκραζεν
  choice: እያለ ይጮኽ ነበር
  rationale: የድርጊቱን ቀጣይነትና የጥሪውን አጣዳፊነት የግሪኩን ያልተፈጸመ ጊዜ በሚያንጸባርቅ መንገድ ያሳያል።
- source_word: Υἱὲ Δαυίδ
  choice: የዳዊት ልጅ ሆይ
  rationale: የግሪኩን ንጉሣዊና መሲሐዊ ማዕረግ ከመተርጎም ይልቅ ቃላቱን በቀጥታ ይጠብቃል።
- source_word: ἐλέησόν με
  choice: ማረኝ
  rationale: በዘመናዊ አማርኛ የምሕረት ልመናውን በአጭር፣ ተፈጥሯዊና ክብር ባለው አገላለጽ ያቀርባል።
theological_decisions:
- issue: ‘የዳዊት ልጅ’ የሚለው የመሲሕነት ፍቺ
  choice: ማዕረጉን ‘የዳዊት ልጅ’ ብሎ በቀጥታ ማቆየት
  alternative: ‘መሲሕ ሆይ’ ብሎ ትርጓሜውን በጽሑፉ ውስጥ መተካት
  rationale: ምንጩ Υἱὲ Δαυίδ ይላል። የማዕረጉን ቃላት ማቆየት መሲሐዊ አንድምታውን ሳይክድ የጽሑፉን አገላለጽና የትርጓሜ ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለመደበኛ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ገሠጹት’ የተግሣጹን ጥንካሬ፣ ‘ይጮኽ ነበር’ ደግሞ የጥሪውን ቀጣይነት ያሳያሉ።
