  source_fidelity: The translation accurately conveys the indefinite condition (ὃς ἂν θέλῃ), status within the group (ἐν ὑμῖν), precedence in rank (πρῶτος), the future-form injunction (ἔσται), and the universal scope of πάντων. «ባሪያ» appropriately represents the stronger force of δοῦλος in contrast with διάκονος in the preceding verse.
  naturalness: The wording is clear, idiomatic modern standard Amharic, and suitably dignified for scripture. «ቀዳሚ መሆን የሚፈልግ ሁሉ» and «የሁሉ ባሪያ ይሆናል» read naturally.
  terminology: «ባሪያ» is a sound contextual rendering of δοῦλος and preserves the deliberate escalation from «አገልጋይ» in verse 43. The footnote supplies «የሁሉ አገልጋይ» as a legitimate alternative without obscuring that contrast.
