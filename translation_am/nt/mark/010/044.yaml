  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν θέλῃ ⸂ἐν ὑμῖν εἶναι⸃ πρῶτος, ἔσται πάντων δοῦλος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/044.yaml
  text: And whoever wants to be first among you will be the servant of all[a].
translation:
  language: am
  text: ከእናንተም መካከል ቀዳሚ መሆን የሚፈልግ ሁሉ የሁሉ ባሪያ ይሆናል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «የሁሉ አገልጋይ» ተብሎም ሊተረጎም ይችላል። የግሪኩ ቃል δοῦλος (ዱሎስ) በቀደመው ቁጥር «አገልጋይ» ከተባለው ቃል የበለጠ ጠንካራ ነው፤ ስለዚህ ልዩነቱን ለማስጠበቅ እዚህ «ባሪያ» ተብሏል።
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς ἂν θέλῃ
  choice: የሚፈልግ ሁሉ
  rationale: አንጻራዊው ተውላጠ ስም ከἄν እና ከንዑስ አንቀጽ ግስ ጋር አጠቃላይና ያልተወሰነ ሁኔታን ይገልጣል፤ «የሚፈልግ ሁሉ» ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐν ὑμῖν
  choice: ከእናንተ መካከል
  rationale: በዚህ የማዕረግ እና የቅድሚያ አውድ ውስጥ በደቀ መዛሙርቱ ቡድን መካከል ያለን ደረጃ ያመለክታል።
- source_word: πρῶτος
  choice: ቀዳሚ
  rationale: በደረጃ ወይም በክብር ፊተኛ መሆንን ይገልጣል፤ «ቀዳሚ» ቀጥተኛና በአውዱ የተፈጥሮ ምርጫ ነው።
- source_word: ἔσται
  choice: ይሆናል
  rationale: የግሪኩን የወደፊት ጊዜ ቅርጽ በቀጥታ ይጠብቃል፤ ከአውዱ የሚገኘውን የትእዛዝ ኃይል «መሆን አለበት» ብሎ በግልጽ አይተካም።
- source_word: πάντων
  choice: የሁሉ
  rationale: ከδοῦλος ጋር ያለውን የባለቤትነትና የተገዥነት ግንኙነት እንዲሁም ሁሉን አቀፍ ወሰኑን በአጭሩ ያስተላልፋል።
- source_word: δοῦλος
  choice: ባሪያ
  rationale: በቀደመው ቁጥር ካለው διάκονος የበለጠ ጠንካራ ቃል ሲሆን የታሰረ ዝቅተኛ ማዕረግና ፍጹም ተገዥነትን ያመለክታል፤ «ባሪያ» ይህን ልዩነት ከ«አገልጋይ» በግልጽ ይጠብቃል።
theological_decisions:
- issue: በደቀ መዝሙርነት አባባል ውስጥ δοῦλοςን መተርጎም
  choice: ባሪያ
  alternative: አገልጋይ
  rationale: አውዱ የማዕረግ ምኞትን ከፍጹም ራስን ዝቅ ማድረግ ጋር ያነጻጽራል። ቁጥር 43 διάκονοςን ሲጠቀም ቁጥር 44 ግን ጠንካራውን δοῦλος ይጠቀማል፤ «ባሪያ» ይህን እየጨመረ የሚሄድ ኃይል ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። «ቀዳሚ» የማዕረግ አውዱን፣ «ባሪያ» ደግሞ የግሪኩን ጠንካራ ማኅበራዊ ኃይል ይጠብቃሉ።
