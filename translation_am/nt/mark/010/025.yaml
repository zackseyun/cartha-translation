base_translation:
  language: en
  yaml_path: translation/nt/mark/010/025.yaml
  text: It is easier for a camel to go through the eye of a needle than for a rich man to enter the kingdom of God[a][b][c].
translation:
  language: am
  text: ግመል በመርፌ ቀዳዳ ማለፍ፣ ባለጠጋ ወደ እግዚአብሔር መንግሥት ከመግባት ይቀላል።[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንዶች ‘ግመል’ በሚለው ፋንታ ‘ገመድ’ የሚል ሐሳብ አቅርበዋል፤ እዚህ ያለው የግሪክ ጽሑፍ ግን ‘ግመል’ ይላል።
    reason: alternative_reading
  - marker: b
    text: ‘ባለጠጋ’ የግሪኩን ወንድ ነጠላ ቅርጽ ያንጸባርቃል፤ አባባሉ ግን ባለጠጋን ሰው በአጠቃላይ ወክሎ ይናገራል።
    reason: cultural_note
lexical_decisions:
- source_word: εὐκοπώτερόν
  choice: ይቀላል
  rationale: የንጽጽር ትርጉሙን ‘ይበልጥ ቀላል ነው’ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ የንግግሩን አጋኖ አያለዝብም።
- source_word: κάμηλον
  choice: ግመል
  rationale: የSBLGNT ጽሑፍ κάμηλος ማለት ‘ግመል’ ነው፤ ‘ገመድ’ የሚለው ሐሳብ የዚህ የግሪክ ጽሑፍ ንባብ አይደለም።
- source_word: διὰ τῆς τρυμαλιᾶς τῆς ῥαφίδος
  choice: በመርፌ ቀዳዳ
  rationale: ቃላቱ የልብስ መስፊያ መርፌን ቀዳዳ ያመለክታሉ፤ ‘በመርፌ ቀዳዳ’ ግልጽና ተፈጥሯዊ ነው።
- source_word: διελθεῖν
  choice: ማለፍ
  rationale: በቀዳዳው ውስጥ አልፎ መሄድን በአጭሩና በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: πλούσιον
  choice: ባለጠጋ
  rationale: ቅጽሉ በስም ፋንታ የቆመ ወንድ ነጠላ ቅርጽ ነው። በአማርኛ ‘ባለጠጋ’ ጾታን በግድ ሳይጨምር ተወካይ ነጠላውን በተፈጥሯዊ ሁኔታ ይጠብቃል።
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: ወደ እግዚአብሔር መንግሥት
  rationale: የወንጌላትን ዋና ሐረግ βασιλεία τοῦ θεοῦ በተለመደና ትክክለኛ አማርኛ ይተረጉማል።
- source_word: εἰσελθεῖν
  choice: መግባት
  rationale: ወደ መንግሥቱ መግባትን በቀጥታ የሚገልጥ ተፈጥሯዊ አቻ ነው።
theological_decisions:
- issue: የግመልና የመርፌ ቀዳዳ ምስል ትርጓሜ
  choice: የግሪኩን ግመልና የመርፌ ቀዳዳ የሚለውን እጅግ የተጋነነ ምስል በቀጥታ ማቆየት
  alternative: ‘የመርፌ ቀዳዳ’ የተባለ ትንሽ በር ነው ብሎ መተርጎም ወይም ‘ግመልን’ በ‘ገመድ’ መተካት
  rationale: የምንጩ ጽሑፍ ግመልንና የእውነተኛ መርፌን ቀዳዳ ይጠቅሳል። ትርጉሙ የኢየሱስን አስደንጋጭ ንጽጽርና ሥነ መለኮታዊ ውጥረት ማለዘብ የለበትም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘በመርፌ ቀዳዳ’ የሚለው በአማርኛ በቂ ቀጥተኛ ስለሆነ፣ በእንግሊዝኛው ያለውን የቃላዊ አማራጭ ማስታወሻ በተለየ ግርጌ ማስታወሻ መድገም አላስፈለገም።
