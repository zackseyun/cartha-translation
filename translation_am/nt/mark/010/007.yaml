  text: ἕνεκεν τούτου καταλείψει ἄνθρωπος τὸν πατέρα αὐτοῦ καὶ τὴν μητέρα ⸂καὶ προσκολληθήσεται πρὸς τὴν γυναῖκα αὐτοῦ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/007.yaml
  text: For this reason a man will leave his father and mother and be joined to his wife,[a]
translation:
  language: am
  text: ስለዚህ ሰው አባቱንና እናቱን ትቶ ከሚስቱ ጋር ይተሳሰራል፤[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከሚስቱ ጋር ይጣበቃል።” የግሪኩ ግስ የጠበቀ ቁርኝትን ሊያጎላ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕνεκεν τούτου
  choice: ስለዚህ
  rationale: ምክንያታዊውንና ማብራሪያዊውን ግንኙነት በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: καταλείψει
  choice: ትቶ
  rationale: ከወላጆቹ ቤት መለየትን ቀጥተኛና ተፈጥሯዊ በሆነ አገላለጽ ይገልጣል፤ የግሪኩ የወደፊት ጊዜ ከዋናው ግስ ‘ይተሳሰራል’ ጋር በአማርኛ በተፈጥሮ ተገልጧል።
- source_word: ἄνθρωπος
  choice: ሰው
  rationale: ‘ሰው’ የἄνθρωπος ቀጥተኛ ፍቺ ሲሆን፣ ‘ሚስቱ’ የሚለው አውድ እዚህ የተጠቀሰው ወንድ መሆኑን ግልጽ ያደርጋል።
- source_word: τὸν πατέρα αὐτοῦ καὶ τὴν μητέρα
  choice: አባቱንና እናቱን
  rationale: የሁለቱንም የወላጅነት ግንኙነት በአጭርና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: προσκολληθήσεται
  choice: ይተሳሰራል
  rationale: የግሪኩን ተገብሮአዊ ቅርጽና በትዳር ውስጥ ያለውን የጠበቀ ቁርኝት በተነባቢ አማርኛ ያስተላልፋል። ‘ይጣበቃል’ የሚለው ይበልጥ ቀጥተኛ አማራጭ በማስታወሻ ቀርቧል።
- source_word: πρὸς τὴν γυναῖκα αὐτοῦ
  choice: ከሚስቱ ጋር
  rationale: γυνή በትዳር አውድ ውስጥ ‘ሚስት’ ማለት ነው፤ ይህ አገላለጽም ከ‘ይተሳሰራል’ ጋር ተፈጥሯዊ የአማርኛ ቅንብር ይፈጥራል።
theological_decisions:
- issue: በጋብቻ ጥቅስ ውስጥ ያለው ጾታዊ ውክልና
  choice: ሰው … ሚስቱ
  alternative: ግለሰብ … የትዳር ጓደኛው
  rationale: ἄνθρωπος በራሱ ሰፊ ትርጉም ሊኖረው ቢችልም፣ ‘ሚስቱ’ የሚለው ቅርብ አውድ በዚህ ጥቅስ ወንዱ የጋብቻ አጋር እንደተጠቀሰ ያሳያል። የጾታ ልዩነቱን በአጠቃላይ ቃል አልተደበቀም።
