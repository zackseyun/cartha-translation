    text: ወይም፣ «ሕይወቱን በብዙዎች ፈንታ ቤዛ አድርጎ ሊሰጥ።» «ለብዙዎች» ተብሎ የተተረጎመው የግሪኩ ቅድመ ቃል መተካትን ወይም ልውውጥን ሊያመለክት ይችላል።
