  yaml_path: translation/nt/mark/010/031.yaml
  text: But many who are first will be last[a], and the last first.
translation:
  language: am
  text: ነገር ግን ብዙ ፊተኞች ኋለኞች ይሆናሉ፤ ኋለኞችም ፊተኞች ይሆናሉ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὶ
  choice: ብዙ
  rationale: ቅጽሉ በስም ፈንታ ቆሞ ሰፊ ነገር ግን ሁሉን የማያካትት ቡድን ያመለክታል፤ «ብዙ» የሚለው በአማርኛ ተፈጥሯዊ ሲሆን «ሰዎች»ን በግድ አይጨምርም።
- source_word: δὲ
  choice: ነገር ግን
  rationale: በቀደመው ንግግር ላይ መጠነኛ ንፅፅርንና ሽግግርን ያሳያል።
- source_word: ἔσονται
  choice: ይሆናሉ
  rationale: የεἰμί ቀላል የወደፊት ጊዜ አያያዥ ግስ ሲሆን፣ «ይሆናሉ» ዘመናዊና ግልጽ አቻ ነው።
- source_word: πρῶτοι
  choice: ቀዳሚዎች
  rationale: በዚህ አውድ ቃሉ ቅደም ተከተልን ብቻ ሳይሆን ደረጃን ወይም ስፍራን ያመለክታል፤ «ቀዳሚዎች» አጭር ምሳሌያዊ ንፅፅሩን ይጠብቃል።
- source_word: ἔσχατοι
  choice: የኋለኞች
  rationale: ቃሉ ከπρῶτοι ጋር በደረጃ ወይም በስፍራ የተቃረነ ነው፤ «የኋለኞች» የቀጥታውን ንፅፅር ይጠብቃል።
- source_word: οἱ ἔσχατοι
  choice: የኋለኞች
  rationale: መስተዋድዱ ቅጽሉን በስም ፈንታ እንዲቆም ያደርገዋል፤ «የኋለኞች» ይህን በአጭርና ተፈጥሯዊ መንገድ ያሳያል።
- source_word: καὶ
  choice: -ም
  rationale: በአማርኛ አያያዥ ቅጥያው ሁለቱን ትይዩ ክፍሎች ተፈጥሯዊ በሆነ መንገድ ያገናኛል።
theological_decisions:
- issue: የቅደም ተከተሉ መገለባበጥ ባሕርይ
  choice: ንግግሩን በመጨረሻው ዘመን ስለሚሆን ሰፊ የደረጃ መገለባበጥ መርሕ አድርጎ ክፍት መተው
  alternative: «ቀዳሚዎች»ንና «የኋለኞች»ን ሀብታሞችና ድሆች፣ ደቀ መዛሙርትና ውጭ ያሉ ሰዎች፣ ወይም ሁሉን የሚመለከት ፍጹም ሕግ ብሎ በተለይ መተርጎም
  rationale: ጥቅሱ ሰፊና ፓራዶክሳዊ መርሕ ይናገራል እንጂ ምድቦቹን በዚሁ ቦታ አይወስንም፤ ስለዚህ ትርጉሙ የሃይማኖት ውጥረቱንና ክፍትነቱን ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅመናል። የግሪኩን አጭር ምሳሌያዊ ትይዩነት ለመጠበቅ «ቀዳሚዎች/የኋለኞች» የሚለው ንፅፅር ተመርጧል። ምንም የግርጌ ማስታወሻ አላስፈለገም።
