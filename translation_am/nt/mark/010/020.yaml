id: MRK.10.20
reference: Mark 10:20
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀ἔφη αὐτῷ· Διδάσκαλε, ταῦτα πάντα ἐφυλαξάμην ἐκ νεότητός μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/020.yaml
  text: And he said to him, “Teacher, I have kept all these things from my youth.”
translation:
  language: am
  text: እርሱም፣ “መምህር ሆይ፣ እነዚህን ሁሉ ከወጣትነቴ ጀምሮ ጠብቄአለሁ” አለው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ ἔφη αὐτῷ
  choice: እርሱም … አለው
  rationale: δέ በዚህ ቦታ ቀላል የትረካ ማያያዣ ስለሆነ በ«-ም» ተገልጿል፤ ἔφη αὐτῷ ደግሞ በተፈጥሯዊው የአማርኛ ንግግር አቀራረብ «አለው» ተብሏል።
- source_word: Διδάσκαλε
  choice: መምህር ሆይ
  rationale: የግሪኩን የጥሪ ቅርጽና ‘አስተማሪ’ የሚለውን መሠረታዊ ፍቺ በክብር ያለው ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ταῦτα πάντα
  choice: እነዚህን ሁሉ
  rationale: የማመልከቻውንና የሁሉንምነቱን ኃይል ጠብቆ፣ ቀደም ሲል የተጠቀሱትን ትእዛዛት በተፈጥሯዊ አማርኛ ያመለክታል።
- source_word: ἐφυλαξάμην
  choice: ጠብቄአለሁ
  rationale: φυλάσσω ስለ ትእዛዛት ሲነገር ‘መጠበቅ/መፈጸም’ የሚል ስፋት አለው። «ጠብቄአለሁ» የግሪኩን ቃል ቅርበት እየጠበቀ እስከ አሁን የደረሰውን የቀድሞ አኗኗር ይጠቀልላል።
- source_word: ἐκ νεότητός μου
  choice: ከወጣትነቴ ጀምሮ
  rationale: ἐκ የጊዜ መነሻን ያሳያል፤ νεότης ደግሞ በግልጽ ሁኔታ «ወጣትነት» ነው፣ ‘ልጅነት’ ብሎ የዕድሜ ወሰኑን አያሰፋም።
theological_decisions:
- issue: የተናጋሪው ራስን ስለ ትእዛዛት መጠበቅ የሰጠው ምስክርነት
  choice: «ጠብቄአለሁ» በማለት እንደ ራሱ ንግግር ተጠብቋል
  alternative: «ታዝዣለሁ» ወይም ፍጹም መታዘዙን የሚያብራራ አተረጓጎም
  rationale: ጥቅሱ የሰውየውን ጥያቄ ወይም አባባል ብቻ ይዘግባል፤ እውነተኛነቱን አያረጋግጥም ወይም አይክድም። ትርጉሙ ይህን የትረካ ገለልተኝነት ጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። «መምህር ሆይ» መጽሐፍ ቅዱሳዊ ክብርን ሳያጣ ለዘመናዊ አንባቢ የሚገባ ነው።
