review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the participial call, the public-recognition nuance of δοκοῦντες, and the two parallel statements about Gentile rulers and their prominent persons. However, the second predicate, «ሥልጣን እንደሚጠቀሙባቸው», is not idiomatic modern Amharic for exercising authority over people and weakens the explicit relational force of κατεξουσιάζουσιν.
  naturalness: A small revision makes both clauses more natural and clearly parallel in modern standard Amharic. «በእነርሱ ላይ በጭቆና መግዛት» and «ሥልጣናቸውን በእነርሱ ላይ ማውላት» communicate the intended domineering exercise of power without unnatural use of «መጠቀምባቸው».
  terminology: «አሕዛብ» is contextually defensible for τῶν ἐθνῶν, with «የአገሮች» retained as a lexical alternative. «ገዢዎች ተብለው የሚታሰቡት» faithfully conveys those regarded as rulers and avoids suggesting that their authority is unreal.
  issues:
  - severity: medium
    issue: «ሥልጣን እንደሚጠቀሙባቸው» is syntactically and idiomatically weak.
    rationale: In Amharic, people are not naturally the object of «ሥልጣን መጠቀም». The phrase can sound as though rulers are using the people rather than exercising authority over them. A construction with «ሥልጣናቸውን ... ማዋል» explicitly retains the Greek verb's ‘over them’ relation.
  - severity: low
    issue: The first clause can express the domineering force more naturally.
    rationale: «በጭቆና መግዛት» is a clear modern Amharic rendering of κατακυριεύουσιν and preserves its negative force without adding a specific historical mechanism.
