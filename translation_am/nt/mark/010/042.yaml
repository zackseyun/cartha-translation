base_translation:
  language: en
  yaml_path: translation/nt/mark/010/042.yaml
  text: And Jesus called them to himself and said to them[a], “You know that those who are considered rulers of the Gentiles lord it over them[b], and their great ones exercise authority over them.”
translation:
  language: am
  text: ኢየሱስም ወደ እርሱ ጠርቷቸው እንዲህ አላቸው፦ “የአሕዛብ[a] ገዢዎች ተብለው የሚታሰቡት[b] በእነርሱ ላይ በጭቆና እንደሚገዙ፣ ታላላቆቻቸውም ሥልጣናቸውን በእነርሱ ላይ እንደሚያውሉ ታውቃላችሁ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የአገሮች።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “አሕዛብን የሚገዙ የሚመስሉት።”
    reason: alternative_reading
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: ወደ እርሱ ጠርቷቸው
  rationale: የግሱ መካከለኛ ድምፅ ሰዎቹን ወደ ራሱ መጥራቱን ያመለክታል፤ ይህ አተረጓጎም የተግባሩን ቅደም ተከተልና የመቅረብን ሐሳብ ይጠብቃል።
- source_word: λέγει
  choice: አላቸው
  rationale: በግሪክ ታሪካዊ የአሁን ጊዜ ቢጠቀምም፣ በአማርኛ ትረካ ያለፈ ጊዜው ተፈጥሯዊና ግልጽ ነው።
- source_word: Οἴδατε
  choice: ታውቃላችሁ
  rationale: οἶδα በቅርጹ ፍጹም ቢሆንም አሁናዊ የማወቅ ትርጉም አለው፤ “ታውቃላችሁ” ቀጥተኛና ተፈጥሯዊ ነው።
- source_word: οἱ δοκοῦντες ἄρχειν
  choice: ገዢዎች እንደሆኑ የሚታሰቡት
  rationale: δοκέω እዚህ በሰዎች ዘንድ እንደ ገዢ መቆጠርን ሊያመለክት ይችላል፤ አተረጓጎሙ ሥልጣናቸው ሐሰተኛ ነው የሚል ፍርድ ሳይጨምር ይህን የሕዝብ ግምት ይጠብቃል።
- source_word: τῶν ἐθνῶν
  choice: የአሕዛብ
  rationale: በዚህ የአይሁድ አውድ ἔθνη ከአይሁድ ውጭ ያሉትን ሕዝቦች ያመለክታል፤ “አሕዛብ” ይህን አውዳዊ ንጽጽር ይጠብቃል፣ “አገሮች” የሚለውም የቃሉ ሌላ አማራጭ ነው።
- source_word: κατακυριεύουσιν
  choice: በኃይል እንደሚገዟቸው
  rationale: የተዋሃደው ግስ ከተራ አስተዳደር ይልቅ የበላይነትንና አስገዳጅ አገዛዝን ያሳያል፤ “በኃይል መግዛት” ይህን አሉታዊ ኃይል በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: οἱ μεγάλοι αὐτῶν
  choice: ታላላቆቻቸው
  rationale: μέγαλοι እዚህ በማኅበራዊ ደረጃ ከፍ ያሉትን ወይም ኃያላንን ያመለክታል፤ አተረጓጎሙ በግሪኩ ያልተገለጸ የሥልጣን ማዕረግ አይጨምርም።
- source_word: κατεξουσιάζουσιν
  choice: ሥልጣን እንደሚጠቀሙባቸው
  rationale: ግሱ በሌሎች ላይ ሥልጣንን መጠቀም ያመለክታል። ይህ ምርጫ ከቀዳሚው ኃይለኛ ግስ ጋር ያለውን ትይዩነት ሳያጠፋ የቃላቱን ልዩነት ይጠብቃል።
theological_decisions:
- issue: የτῶν ἐθνῶν ዋቢ
  choice: አሕዛብ
  alternative: አገሮች
  rationale: ንግግሩ በአሕዛብ ዓለም ያለውን የሥልጣን አጠቃቀም ኢየሱስ ለደቀ መዛሙርቱ ከሚያስተምረው መንገድ ጋር ያነጻጽራል። “አሕዛብ” አውዱን ይጠብቃል፤ ሰፊው የ“አገሮች” ትርጉም በማስታወሻ ቀርቧል።
- issue: የδοκοῦντες ኃይል
  choice: ገዢዎች እንደሆኑ የሚታሰቡት
  alternative: አሕዛብን የሚገዙ የሚመስሉት
  rationale: ሐረጉ በማኅበረሰቡ ገዢዎች ተብለው የሚታወቁትን ሊያመለክት ይችላል፤ በእርግጥ ሥልጣን የላቸውም የሚል ያልተገለጸ አቋም አልተጨመረም። የ“የሚመስሉት” አማራጭ ግን በማስታወሻ ተጠብቋል።
