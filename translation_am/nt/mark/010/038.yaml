  yaml_path: translation/nt/mark/010/038.yaml
  text: But Jesus said to them[a], “You do not know what you are asking. Are you able to drink the cup that I drink[b], or to be baptized with the baptism with which I am baptized?”
translation:
  language: am
  text: ኢየሱስ ግን እንዲህ አላቸው፤ “የምትለምኑትን አታውቁም። እኔ የምጠጣውን ጽዋ[a] መጠጣት፣ ወይም እኔ በምጠመቅበት ጥምቀት መጠመቅ ትችላላችሁ?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ጽዋ” በመጽሐፍ ቅዱስ ለአንድ ሰው የተወሰነለትን ዕጣ የሚወክል ዘይቤ ነው፤ እዚህ በተለይ ኢየሱስ የሚቀበለውን መከራ ያመለክታል።
    reason: cross_reference
  - marker: b
    text: በትርጓሜ ይበልጥ ግልጽ በማድረግ፣ “እኔ የምቀበለውን ጥምቀት መቀበል” ሊባል ይችላል። ግሪኩ ለአጽንዖት “ጥምቀት/መጠመቅ” የሚለውን የአንድ ቃል ሥር ይደግማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: ኢየሱስ ግን እንዲህ አላቸው
  rationale: δέ በዚህ አውድ የእርማት ንግግርን የሚያስገባ ቀላል ንፅፅር ስለሚያመለክት፣ ‘ግን’ ተመርጧል።
- source_word: Οὐκ οἴδατε τί αἰτεῖσθε
  choice: የምትለምኑትን አታውቁም
  rationale: οἶδα የ‘ማወቅ’ን መሠረታዊ ትርጉም ይዞ ቀርቷል፤ αἰτέω በዚህ የጥያቄ/ልመና አውድ ‘መለመን’ ተብሏል።
- source_word: δύνασθε
  choice: ትችላላችሁ?
  rationale: የችሎታና የአቅም ጥያቄን በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: πιεῖν τὸ ποτήριον ὃ ἐγὼ πίνω
  choice: እኔ የምጠጣውን ጽዋ መጠጣት
  rationale: የጽዋውን ዘይቤ ሳይፈታ የግሪኩን ተዛማጅ ግስ ይጠብቃል። ‘ጽዋ’ በመጽሐፍ ቅዱሳዊ አጠቃቀም የታወቀና ክቡር ቃል ነው።
- source_word: ἢ
  choice: ወይም
  rationale: የSBLGNT ንባብ ያለውን አማራጭ አገናኝ በቀጥታ ያሳያል፤ ‘እና’ በማለት አይስማማም።
- source_word: τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθῆναι
  choice: እኔ የምጠመቅበትን ጥምቀት መጠመቅ
  rationale: ጥምቀት/መጠመቅ የሚለውን የአንድ ሥር ድግግሞሽ ይጠብቃል፤ ዘይቤውን ‘መቀበል’ ወይም ‘ማለፍ’ በሚል ትርጓሜ አይተካም።
theological_decisions:
- issue: የ‘ጽዋ’ እና የ‘ጥምቀት’ ዘይቤያዊ አነጋገር
  choice: ሁለቱንም ዘይቤዎች በዋናው ጽሑፍ ላይ በቀጥታ ማቆየት
  alternative: ‘እኔ የምቀበለውን መከራ መቀበል’ የሚል ገላጭ ትርጉም
  rationale: አውዱ የኢየሱስን መጪ መከራ ቢያመለክትም፣ ጥቅሱ ራሱ ዘይቤዎቹን ሙሉ በሙሉ አይፈታቸውም። ስለዚህ ትርጉሙ የሥነ መለኮት ውጥረቱንና ሰፊ መጽሐፍ ቅዱሳዊ ጥምረቱን ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ጽዋ’ ከ‘ኩባያ’ ይልቅ መጽሐፍ ቅዱሳዊውን ዘይቤና ክብር ስለሚጠብቅ ተመርጧል፤ ነገር ግን አረፍተ ነገሩ ቀላልና ወቅታዊ ሆኖ ቀርቧል።
