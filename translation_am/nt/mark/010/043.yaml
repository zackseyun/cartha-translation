id: MRK.10.43
reference: Mark 10:43
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὐχ οὕτως δέ ⸀ἐστιν ἐν ὑμῖν· ἀλλ’ ὃς ⸀ἂν θέλῃ ⸂μέγας γενέσθαι⸃ ἐν ὑμῖν, ἔσται ὑμῶν διάκονος,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/043.yaml
  text: But it is not so among you[a]. Instead, whoever wants to become great among you will be your servant[b],
translation:
  language: am
  text: በእናንተ መካከል ግን እንዲህ አይደለም[a]። ይልቁንም፣ በእናንተ መካከል ታላቅ ለመሆን የሚፈልግ ማንም አገልጋያችሁ ይሆናል[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በእናንተ መካከል ግን ነገሩ እንዲህ አይደለም።”
    reason: lexical_alternative
  - marker: b
    text: “ይሆናል” የሚለው የወደፊት ጊዜ ግስ በዚህ አውድ “መሆን አለበት” የሚል ትርጉምም ሊኖረው ይችላል፤ ስለዚህ፣ “በእናንተ መካከል ታላቅ ለመሆን የሚፈልግ ማንም አገልጋያችሁ መሆን አለበት” ተብሎም ሊተረጎም ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: οὐχ οὕτως δέ ἐστιν ἐν ὑμῖν
  choice: በእናንተ መካከል ግን እንዲህ አይደለም
  rationale: የግሪኩን የአኳኋን አሉታዊ አገላለጽና ከአውዱ ጋር ያለውን ንጽጽር በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἀλλ’
  choice: ይልቁንም
  rationale: ከዓለማዊ የታላቅነት አሠራር ጋር ያለውን ጠንካራ ተቃርኖና ማረሚያ በግልጽ ያሳያል።
- source_word: ὃς ἂν θέλῃ
  choice: የሚፈልግ ማንም
  rationale: ἄν ከንዑስ አድራጊ ግስ ጋር የሚገልጸውን አጠቃላይና ያልተወሰነ ሁኔታ እንዲሁም θέλω ያለውን የፈቃድ ሐሳብ ይጠብቃል።
- source_word: μέγας γενέσθαι
  choice: ታላቅ ለመሆን
  rationale: γενέσθαι የሚያመለክተውን ወደ አንድ ሁኔታ መግባት፣ ማለትም ‘መሆን’ን፣ ይጠብቃል፤ ‘ታላቅ’ም የደረጃና የክብር ቋንቋውን ሳያጠብ ያስተላልፋል።
- source_word: ἐν ὑμῖν
  choice: በእናንተ መካከል
  rationale: ማኅበራዊውን ‘among you’ ትርጉም በተፈጥሯዊ አማርኛ ያቀርባል፤ በቁጥሩ ውስጥ ሁለቱም ጊዜ በአንድ ወጥነት ተተርጉሟል።
- source_word: ἔσται ὑμῶν διάκονος
  choice: አገልጋያችሁ ይሆናል
  rationale: διάκονος እዚህ የትሕትና አገልግሎትን እንጂ የተቋቋመ የቤተ ክርስቲያን ሹመትን አያመለክትም። ይሆናል የግሪኩን የወደፊት ጊዜ ቅርጽ ይጠብቃል።
theological_decisions:
- issue: በኢየሱስ ትምህርት ውስጥ የἔσται የወደፊት ጊዜ ግስ ኃይል
  choice: አገልጋያችሁ ይሆናል
  alternative: አገልጋያችሁ መሆን አለበት / አገልጋያችሁ ይሁን
  rationale: አውዱ የመመሪያ ኃይል ቢኖረውም፣ የግሪኩ ግስ በወደፊት ጊዜ አመልካች ቅርጽ ነው። ዋናው ጽሑፍ ይህን ቅርጽ ይጠብቃል፤ የግዴታ ስሜቱ በማስታወሻ ተገልጿል።
- issue: የδιάκονος አተረጓጎም
  choice: አገልጋይ
  alternative: ዲያቆን
  rationale: በዚህ አውድ ቃሉ ትሑት አገልግሎትን ያመለክታል፤ ‘ዲያቆን’ የሚለው ግን በዘመናዊ አማርኛ የተወሰነ የቤተ ክርስቲያን ማዕረግ ሊያስመጣ ስለሚችል አልተመረጠም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘አገልጋይ’ የአውዱን ትሑት አገልግሎት ይገልጻል፤ የኋለኛውን ተቋማዊ የቤተ ክርስቲያን ማዕረግ አያስገባም።
