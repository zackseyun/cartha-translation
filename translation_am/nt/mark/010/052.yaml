    issue: The rendering of ἀνέβλεψεν is slightly under-specific.
    rationale: ማየት ቻለ can indicate merely becoming able to see; in the immediate context of Bartimaeus’s blindness, ἀνέβλεψεν specifically reports that his sight was restored. ዓይኑ በራ is an established, natural Amharic expression for this event.
