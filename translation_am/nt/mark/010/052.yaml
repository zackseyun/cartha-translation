  verdict: revise
  source_fidelity: The draft accurately conveys Jesus’ imperative, the broad perfect sense of σέσωκέν, the immediacy of εὐθύς, and the continuing sense of ἠκολούθει. However, ማየት ቻለ (“was able to see”) is somewhat weaker than ἀνέβλεψεν in this healing context, which denotes the restoration of sight.
  naturalness: The register is clear, modern, and natural. Replacing ማየት ቻለ with the idiomatic ዓይኑ በራ more directly and naturally expresses that his sight was restored.
  terminology: እምነት and አድኖሃል are appropriate. The latter properly retains the source verb’s deliberate breadth, while the footnote supplies the legitimate healing-related alternatives without forcing one interpretation.
