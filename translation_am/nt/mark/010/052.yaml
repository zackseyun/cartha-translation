source:
  edition: SBLGNT
  text: ⸂καὶ ὁ⸃ Ἰησοῦς εἶπεν αὐτῷ· Ὕπαγε, ἡ πίστις σου σέσωκέν σε. καὶ ⸀εὐθὺς ἀνέβλεψεν, καὶ ἠκολούθει ⸀αὐτῷ ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/052.yaml
  text: And Jesus said to him[a], “Go[c][b]; your faith has saved you.” And immediately he regained his sight and followed him on the road.
translation:
  language: am
  text: ኢየሱስም፣ “ሂድ፤ እምነትህ[a] አድኖሃል[b]” አለው። ወዲያውም ዓይኑ በራ፤ በመንገድም[c] እየተከተለው ሄደ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “እምነት” እዚህ “መታመን” ተብሎም ሊገለጽ ይችላል።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ “ፈውሶሃል” ወይም “ደኅና አድርጎሃል።” የግሪኩ ግስ ማዳንንም ሆነ መፈወስን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “በመንገዱ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὕπαγε
  choice: ሂድ
  rationale: የመሄድ ቀጥተኛ ትእዛዝ ነው፤ በግሪኩ የሌለውን የባለቤትነት ሐሳብ ሳይጨምር በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: πίστις
  choice: እምነት
  rationale: በዚህ አውድ ሰውየው በኢየሱስ ላይ ያደረገውን መታመን ያመለክታል፤ “እምነት” ቁልፍ ቃሉን በተለመደ እና ክቡር አገላለጽ ያቆያል።
- source_word: σέσωκέν
  choice: አድኖሃል
  rationale: σῴζω ማዳንን፣ መፈወስን ወይም ደኅንነትን ሊያመለክት ይችላል። “አድኖሃል” ወዲያው የተከሰተውን የዓይን ፈውስ ሳይክድ የቃሉን ሰፊ የማዳን ክልል ይጠብቃል። የፍጹም ጊዜውንም ውጤት በአማርኛው ፍጹም አቀራረብ ያሳያል።
- source_word: εὐθύς
  choice: ወዲያውም
  rationale: የማርቆስን ፈጣን የትረካ እንቅስቃሴ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἀνέβλεψεν
  choice: ማየት ቻለ
  rationale: በዓይነ ስውሩ ሰው አውድ የማየት ችሎታ መሰጠቱን በግልጽ ያሳያል፤ “ወደ ላይ አየ” የሚል ቃል በቃል ትርጉም በዚህ አውድ አሳሳች ይሆናል።
- source_word: ἠκολούθει
  choice: እየተከተለው ሄደ
  rationale: ያልተፈጸመው የግሪክ ግስ የሚያሳየውን ቀጣይ ድርጊት በተፈጥሯዊ የአማርኛ ቀጣይ አገባብ ያቀርባል።
- source_word: ἐν τῇ ὁδῷ
  choice: በመንገድ
  rationale: ተጨባጩን የጉዞ ስፍራ በቀጥታ ያሳያል፤ በማርቆስ ውስጥ “መንገድ” ሊኖረው የሚችለውን የደቀ መዝሙርነት ጥልቅ ጭብጥም አያጠፋም።
- source_word: καὶ ὁ Ἰησοῦς
  choice: ኢየሱስም
  rationale: καί የትረካውን ትስስር እንደሚያሳይ በአማርኛው “-ም” በተፈጥሯዊ ሁኔታ ተወክሏል።
theological_decisions:
- issue: በኢየሱስ ንግግር ውስጥ የσῴζω ትርጉም
  choice: ሰፊውን “አድኖሃል” የሚል አገላለጽ መጠቀም
  alternative: “ፈውሶሃል” ወይም “ደኅና አድርጎሃል”
  rationale: በአውዱ የዓይን ፈውስ ግልጽ ቢሆንም፣ የግሪኩ ግስ ፈውስንም ሆነ ሰፊ ማዳንን ሊያመለክት ይችላል። “አድኖሃል” ይህን የቃልና የሥነ መለኮት ውጥረት በአንድ ጠባብ ፍቺ ሳይዘጋ ያቆየዋል።
- issue: የπίστις የአውድ ትርጉም
  choice: “እምነት” በዋናው ጽሑፍ
  alternative: “መታመን”
  rationale: “እምነት” የግሪኩን ቁልፍ ቃል በተለመደ መልኩ ሲያቆይ፣ በዚህ አውድ በኢየሱስ ላይ የተደረገ መታመን መሆኑን የግርጌ ማስታወሻው ያብራራል።
