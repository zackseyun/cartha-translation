  register: ዘመናዊ፣ ክቡርና ለሰፊ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ኢየሱስም” የግሪኩን ትረካዊ አያያዥ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ “እየተከተለው ሄደ” ደግሞ የἠκολούθειን ቀጣይነት በማይከብድ አገላለጽ ይጠብቃል።
