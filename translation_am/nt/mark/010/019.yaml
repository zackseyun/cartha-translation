  text: τὰς ἐντολὰς οἶδας· Μὴ ⸂φονεύσῃς, Μὴ μοιχεύσῃς⸃, Μὴ κλέψῃς, Μὴ ψευδομαρτυρήσῃς, Μὴ ἀποστερήσῃς, Τίμα τὸν πατέρα σου καὶ τὴν μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/019.yaml
  text: 'You know the commandments: Do not murder[a], do not commit adultery, do not steal, do not bear false witness, do not defraud[b], honor your father and mother.'
translation:
  language: am
  text: ትእዛዛቱን ታውቃለህ፦ ‘አትግደል[a]፤ አታመንዝር፤ አትስረቅ፤ በሐሰት አትመስክር፤ ለሌላው የሚገባውን አትንፈግ[b]፤ አባትህንና እናትህን አክብር።’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ነፍስ አታጥፋ።” እዚህ ያለው የግሪክኛ ግስ በተለይ ሕገ ወጥ ግድያን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: “ለሌላው የሚገባውን አትንፈግ” የሚለው “አታጭበርብር” ወይም “የሌላውን አትቀማ” ተብሎም ሊተረጎም ይችላል። ቃሉ ብዙውን ጊዜ ሰውን በመበዝበዝ፣ በመጭበርበር ወይም በመከልከል የሚገባውን ነገር መንፈግን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντολάς
  choice: ትእዛዛቱን
  rationale: የአሥርቱ ትእዛዛት ግልጽ ጥቅስና የቃል ኪዳን የሥነ ምግባር ትእዛዞች መሆናቸውን ይጠብቃል።
- source_word: οἶδας
  choice: ታውቃለህ
  rationale: οἶδα በኮይኔ ግሪክኛ የአሁን ጊዜ ትርጉም ስላለው፣ ይህ ተፈጥሯዊው የአማርኛ አቻ ነው።
- source_word: Μὴ φονεύσῃς
  choice: አትግደል
  rationale: φονεύω በአጠቃላይ ማንኛውንም መግደል ሳይሆን የሰው ነፍስን በወንጀል ማጥፋትን ያመለክታል፤ የግድያ ትእዛዙን የታወቀ አገላለጽ ለመጠበቅ ይህ ቃል ተመርጦ ልዩነቱ በማስታወሻ ተብራርቷል።
- source_word: Μὴ μοιχεύσῃς
  choice: አታመንዝር
  rationale: በሕጋዊና በሥነ ምግባራዊ አውድ μοιχεύω የሚያመለክተውን የትዳር ክህደት በተለመደ የትእዛዝ ቃል ይገልጣል።
- source_word: Μὴ κλέψῃς
  choice: አትስረቅ
  rationale: κλέπτωን በትእዛዝ ዝርዝር ውስጥ በቀጥታና በተለመደ መንገድ ይተረጉማል።
- source_word: Μὴ ψευδομαρτυρήσῃς
  choice: በሐሰት አትመስክር
  rationale: የψευδομαρτυρέωን ሕጋዊና የምስክርነት ትርጉም ይጠብቃል፤ ወደ አጠቃላይ ‘አትዋሽ’ አያሰፋውም።
- source_word: Μὴ ἀποστερήσῃς
  choice: የሌላውን መብት አትንፈግ
  rationale: ἀποστερέω ለሌላው በትክክል የሚገባውን ነገር በብዝበዛ፣ በማታለል ወይም በመከልከል መንፈግን ያመለክታል፤ ይህ አገላለጽ ስፋቱን ሳያጠብ የኢኮኖሚና የፍትሕ ገጽታውን ይጠብቃል።
- source_word: Τίμα
  choice: አክብር
  rationale: τιμάω በዚህ የትእዛዝ አውድ ከተራ አክብሮት የጠነከረውን የክብርና የግዴታ ስሜት ይይዛል።
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: አባትህንና እናትህን
  rationale: ሁለቱንም ወላጆች በግልጽ እየጠቀሰ፣ በዘመናዊ አማርኛ ተፈጥሯዊ የሆነውን የተጣመረ አገላለጽ ይጠቀማል።
theological_decisions:
- issue: የአሥርቱ ትእዛዛትን ጥቅሶችና ጠቃሽ አገላለጾች መተርጎም
