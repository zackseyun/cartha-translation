language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Καὶ ἔρχονται εἰς Ἰεριχώ. καὶ ἐκπορευομένου αὐτοῦ ἀπὸ Ἰεριχὼ καὶ τῶν μαθητῶν αὐτοῦ καὶ ὄχλου ἱκανοῦ ⸀ὁ υἱὸς Τιμαίου Βαρτιμαῖος ⸀τυφλὸς ⸂προσαίτης ἐκάθητο παρὰ τὴν ὁδόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/046.yaml
  text: And they came to Jericho[a]. And as he was going out from Jericho, along with his disciples and a considerable crowd, Bartimaeus, the son of Timaeus, a blind beggar[c][b], was sitting beside the road.
translation:
  language: am
  text: እነርሱም ወደ ኢያሪኮ መጡ። እርሱም ከደቀ መዛሙርቱና ከብዙ ሕዝብ ጋር ከኢያሪኮ እየወጣ ሳለ፣ የጢሜዎስ ልጅ በርጤሜዎስ የተባለ ዕውር ለማኝ በመንገድ ዳር ተቀምጦ ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχονται
  choice: መጡ
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ አገላለጽ በተፈጥሯዊ የአማርኛ ትረካ በኃላፊ ጊዜ ተተርጉሟል።
- source_word: ἐκπορευομένου αὐτοῦ
  choice: እየወጣ ሳለ
  rationale: ድርጊቱ ከዋናው ትረካ ጋር በአንድ ጊዜ መከናወኑንና ከከተማው የመውጣቱን እንቅስቃሴ ይጠብቃል።
- source_word: ὄχλου ἱκανοῦ
  choice: ብዙ ሕዝብ
  rationale: ἱκανός በዚህ ዐውድ በቁጥር ብዛትን ያመለክታል፤ ይህም ተፈጥሯዊና ግልጽ የአማርኛ አገላለጽ ነው።
- source_word: ὁ υἱὸς Τιμαίου Βαρτιμαῖος
  choice: የጢሜዎስ ልጅ በርጤሜዎስ የተባለ
  rationale: የግሪኩን ስምና የስሙን ማብራሪያ ሁለቱንም ጠብቆ በአማርኛ ግልጽ መታወቂያ ያቀርባል።
- source_word: τυφλὸς προσαίτης
  choice: ዕውር ለማኝ
  rationale: ሁለቱንም መግለጫዎች በቀጥታ፣ በግልጽና በዘመናዊ አማርኛ ያስተላልፋል።
- source_word: παρὰ τὴν ὁδόν
  choice: በመንገድ ዳር
  rationale: ከመንገዱ ጎን ያለውን ቦታ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: Ἰεριχώ
  choice: ኢያሪኮ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የቦታ ስም ቅርጽ ይከተላል።
theological_decisions:
- issue: የበርጤሜዎስ ትረካዊ መለያ
  choice: የጢሜዎስ ልጅ የሚለውን መግለጫና በርጤሜዎስ የሚለውን ስም ሁለቱንም በዋናው ጽሑፍ ማቆየት
  alternative: ከሁለቱ አንዱን ብቻ ማቅረብ
  rationale: የምንጭ ጽሑፉ ስሙንና ማብራሪያውን ሁለቱንም ይሰጣል፤ ሁለቱን ማቆየት የትረካውን ዝርዝር ሳይቀንስ ያስተላልፋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ የትረካ አማርኛ ተጠቅሟል። የግሪኩ ታሪካዊ የአሁን ጊዜ በአማርኛ ተፈጥሯዊ የኃላፊ ጊዜ ተሰጥቷል።
