base_translation:
  language: en
  yaml_path: translation/nt/mark/010/015.yaml
  text: Truly I say to you[a], whoever does not receive the kingdom of God like a child will certainly not enter it.
translation:
  language: am
  text: እውነት እላችኋለሁ፤ የእግዚአብሔርን መንግሥት እንደ ሕፃን[a] የማይቀበል ማንም ቢሆን ወደ መንግሥቱ ፈጽሞ አይገባም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሕፃን ሆኖ።” ሐረጉ የሕፃንን ትሕትና፣ እምነት ወይም ጥገኝነት ሊያመለክት ይችላል፤ የግሪኩ ጽሑፍ ግን የትኛው ትርጉም እንደታሰበ አይገልጽም።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: እውነት
  rationale: የንግግሩን ጥብቅነትና ሥልጣናዊነት በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል፤ በጽሑፉ ያለው አንድ ἀμήν ብቻ ነው።
- source_word: λέγω ὑμῖν
  choice: እላችኋለሁ
  rationale: የግሪኩን ቀጥተኛ አነጋገርና የብዙ ቁጥር ተቀባዮችን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ὃς ἂν
  choice: ማንም ቢሆን
  rationale: የዝምድና ተውላጠ ስሙና ἄν የሚሰጡትን አጠቃላይና ያልተወሰነ ትርጉም ያስተላልፋል።
- source_word: μὴ δέξηται
  choice: የማይቀበል
  rationale: δέχομαι መቀበል፣ በደስታ መቀበል ወይም ተቀባይነት መስጠት ሊያመለክት ቢችልም፣ ‘መቀበል’ ከመንግሥቱ ጋር የተያያዘውን ተቀባይነትና ጥገኝነት ሳያጠብ ይጠብቃል።
- source_word: βασιλείαν τοῦ θεοῦ
  choice: የእግዚአብሔርን መንግሥት
  rationale: በወንጌላት የተለመደውን አገላለጽ ይጠብቃል፤ ‘መንግሥት’ የንግሥና አገዛዝንም ሆነ ግዛቱን ሳይለይ ሊያመለክት ይችላል።
- source_word: ὡς παιδίον
  choice: እንደ ሕፃን
  rationale: ὡς የሚያሳየውን ንጽጽርና παιδίον የሚያመለክተውን ሕፃን በአጭርና ተፈጥሯዊ አማርኛ ያቀርባል፤ የሕፃኑን የተለየ ባሕርይ አይወስንም።
- source_word: οὐ μὴ εἰσέλθῃ
  choice: ፈጽሞ አይገባም
  rationale: οὐ μή ከአኦሪስት ንዑስ አንቀጽ ጋር የሚሰጠውን ጠንካራ አሉታ በግልጽና በዘመናዊ አማርኛ ይገልጣል።
- source_word: εἰς αὐτήν
  choice: ወደ መንግሥቱ
  rationale: የተውላጠ ስሙን ማጣቀሻ ግልጽ ለማድረግና በአማርኛ የተፈጥሮ ፍሰት ለመጠበቅ ‘መንግሥቱ’ ተደግሟል።
theological_decisions:
- issue: ‘እንደ ሕፃን’ ሆኖ መንግሥቱን የመቀበል ትርጉም
  choice: ንጽጽሩን እንዳለ ማቆየትና የትኛው የሕፃን ባሕርይ እንደታሰበ አለመወሰን
  alternative: በትሕትና፣ በእምነት ወይም በጥገኝነት እንደ ሕፃን ብሎ መግለጽ
  rationale: የግሪኩ ጽሑፍ ንጽጽሩን ያቀርባል እንጂ የትሕትና፣ የእምነት ወይም የጥገኝነት ትርጉምን በግልጽ አይወስንም፤ ስለዚህ ትርጉሙ ያንን ግልጽ አለመሆን ይጠብቃል።
