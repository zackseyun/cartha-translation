  text: They said[b][a], “Moses permitted us to write a certificate of divorce and send her away.”
translation:
  language: am
  text: እነርሱም፣ “ሙሴ የፍቺ ሰነድ[a] ጽፎ እንዲሰዳት[b] ፈቅዷል” አሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የፍቺ ደብዳቤ።» የግሪኩ ሐረግ ሕጋዊ የፍቺ ሰነድን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «እንዲፈታት።» ቃል በቃል፣ «እንዲሰዳት»፤ እዚህ በፍቺ አውድ ጥቅም ላይ ውሏል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: እነርሱም … አሉ
  rationale: ὁ የሚለው መስተዋድድ እዚህ በስም ፈንታ ቆሞ ቀደም ሲል የተጠቀሱትን ፈሪሳውያን ያመለክታል፤ δέ ደግሞ የንግግሩን ቀጣይነት ወይም ቀላል ንጽጽር ስለሚገልጥ «-ም» በተፈጥሯዊ አማርኛ ተተርጉሟል።
- source_word: Ἐπέτρεψεν
  choice: ፈቅዷል
  rationale: ግሱ መፍቀድን እንጂ ማዘዝን አይገልጥም፤ ይህም በቀጣዩ አውድ ያለውን በፈቃድና በትእዛዝ መካከል ያለ ልዩነት ይጠብቃል።
- source_word: Μωϋσῆς
  choice: ሙሴ
  rationale: በአማርኛ የተለመደው የስሙ አጻጻፍ ነው።
- source_word: βιβλίον ἀποστασίου
  choice: የፍቺ ሰነድ
  rationale: በዘዳግም 24፥1 የተጠቀሰውን ሕጋዊ የፍቺ ሰነድ በግልጽና በዘመናዊ አማርኛ ይገልጣል።
- source_word: γράψαι
  choice: ጽፎ
  rationale: γράφω በቀጥታ «መጻፍ» ማለት ነው፤ በአማርኛው የተከታታይ ድርጊት አገባብ መሠረት «ጽፎ» ተብሏል።
- source_word: καὶ ἀπολῦσαι
  choice: እንዲሰዳት
  rationale: ἀπολύω በዚህ የጋብቻ አውድ ሚስትን መስደድ ወይም መፍታትን ያመለክታል። «እንዲሰዳት» የግሱን ቀጥተኛ ምስል ይጠብቃል፤ «የፍቺ ሰነድ» የሚለው ደግሞ የጋብቻ አውዱን ግልጽ ያደርገዋል። በግሪክ በግልጽ ያልተደገመው ተሳቢ ከአውዱ ተረድቶ «-አት» ተብሎ ተጨምሯል።
theological_decisions:
- issue: በፍቺ ሕግ ውስጥ የሙሴ መመሪያ ባሕርይ
  choice: ሙሴ ፍቺን ፈቀደ እንጂ በአዎንታዊ መንገድ አላዘዘም
  alternative: ሙሴ ሰውየው የፍቺ ሰነድ እንዲጽፍ አዘዘ
  rationale: Ἐπέτρεψεν የሚለው ግስ በግልጽ መፍቀድን ይገልጣል። ይህ በቅርብ አውድ ኢየሱስ በልብ ጥንካሬ ምክንያት የተሰጠውን ፈቃድ ከእግዚአብሔር የፍጥረት ዓላማ የሚለይበትን ንጽጽር ይጠብቃል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። «የፍቺ ሰነድ» ሕጋዊ ትርጉሙን ሲጠብቅ፣ «እንዲሰዳት» ደግሞ የግሪኩን የቃል ምስል ያቆያል።
