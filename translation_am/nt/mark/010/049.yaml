  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ στὰς ὁ Ἰησοῦς εἶπεν· ⸂Φωνήσατε αὐτόν⸃. καὶ φωνοῦσι τὸν τυφλὸν λέγοντες αὐτῷ· Θάρσει, ⸀ἔγειρε, φωνεῖ σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/049.yaml
  text: And Jesus stopped and said[a], “Call him.” And they called the blind man, saying to him, “Take courage; get up[b], he is calling you.”
translation:
  language: am
  text: ኢየሱስም ቆም ብሎ፣ “ጥሩት” አለ። እነርሱም ዓይነ ስውሩን፣ “አይዞህ፤ ተነሥ፤ እየጠራህ ነው” ብለው ጠሩት።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στὰς
  choice: ቆም ብሎ
  rationale: የግስ ቦዝ አንቀጹ በቃል ደረጃ ‘ቆሞ’ ማለት ቢሆንም፣ በትረካው ውስጥ ኢየሱስ መሄዱን እንዳቆመ ያመለክታል፤ ‘ቆም ብሎ’ ሁለቱንም ገጽታዎች በተፈጥሯዊ አማርኛ ይይዛል።
- source_word: Φωνήσατε αὐτόν
  choice: ጥሩት
  rationale: φωνέω እዚህ አንድን ሰው መጥራትን ወይም ማስጠራትን ያመለክታል፤ ‘ጥሩት’ ቀጥተኛና ተፈጥሯዊ ትእዛዝ ነው።
- source_word: φωνοῦσι
  choice: ጠሩት
  rationale: ከኢየሱስ ትእዛዝ ጋር ያለውን የቃል ድግግሞሽ በ‘ጠራ’ ግስ መጠቀም ይጠብቃል።
- source_word: τὸν τυφλὸν
  choice: ዓይነ ስውሩን
  rationale: ግሪክኛው ቅጽል እንደ ስም የገባ ሲሆን፣ በአማርኛ ‘ዓይነ ስውሩን’ በአውዱ የታወቀውን ሰው በተፈጥሯዊ ሁኔታ ያመለክታል።
- source_word: Θάρσει
  choice: አይዞህ
  rationale: ትእዛዛዊው ቅጽ ማበረታቻና ማጽናኛ ይገልጣል፤ ‘አይዞህ’ በዘመናዊ አማርኛ ይህን ኃይል በቀጥታና በተፈጥሯዊነት ያስተላልፋል።
- source_word: ἔγειρε
  choice: ተነሥ
  rationale: ትእዛዙ ከተቀመጠበት እንዲነሣ ይጠይቃል፤ ‘ተነሥ’ አጭር፣ ግልጽና የተከበረ አገላለጽ ነው።
- source_word: φωνεῖ σε
  choice: እየጠራህ ነው
  rationale: የአሁን ጊዜው ግስ ጥሪው አሁን እየተደረገ መሆኑን ያሳያል፤ የአማርኛው ቀጣይ ድርጊት ቅጽ ይህን ፈጣንነት ይጠብቃል።
