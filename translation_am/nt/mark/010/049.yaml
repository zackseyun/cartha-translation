translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛን ይጠቀማል። የφωνέω ድግግሞሽ ‘ጥሩት/ጠሩት/እየጠራህ’ በሚሉ ተዛማጅ ቅጾች ተጠብቋል። በቀረበው የእንግሊዝኛ ማጣቀሻ የግርጌ ማስታወሻዎቹ ከምልክቶቻቸው ጋር የተዛቡ ስለሚመስሉ፣ በግሪክኛው ምንጭ ላይ የማያስፈልግ የግርጌ ማስታወሻ አልተጨመረም።
