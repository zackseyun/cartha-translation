  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐμβλέψας αὐτῷ ἠγάπησεν αὐτὸν καὶ εἶπεν αὐτῷ· Ἕν ⸀σε ὑστερεῖ· ὕπαγε ὅσα ἔχεις πώλησον καὶ δὸς ⸀τοῖς πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν οὐρανῷ, καὶ δεῦρο ἀκολούθει ⸀μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/021.yaml
  text: 'And Jesus[a], looking at him, loved him and said to him, “One thing you lack: go, sell whatever you have and give to the poor, and you will have treasure in heaven; and come, follow me.”'
translation:
  language: am
  text: ኢየሱስም ትኩር ብሎ ተመለከተውና ወደደው፤ እንዲህም አለው፦ “አንድ ነገር ይጎድልሃል፤ ሂድ፣ ያለህን ሁሉ[a] ሽጠህ ለድሆች ስጥ፤ በሰማይም መዝገብ ይኖርሃል፤ እና መጥተህ ተከተለኝ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ያለህን።” ὅσα ἔχεις የሚለው የግሪክ ሐረግ “ያለህን” ወይም “ያለህን ሁሉ” ተብሎ ሊተረጎም ይችላል፤ ዐውዱ ግን ንብረቱን በሙሉ እንደሚያመለክት ያሳያል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβλέψας
  choice: ትኩር ብሎ ተመለከተውና
  rationale: የግሪኩ ግስ ወደ ሰውየው የተመራ ትኩረት ያለውን እይታ ያመለክታል፤ ይህ አተረጓጎም ኃይሉን ሳያጋንን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἠγάπησεν αὐτόν
  choice: ወደደው
  rationale: ግሱ የኢየሱስን እውነተኛ ፍቅር በቀጥታ ይገልጣል፤ ቃሉን ወደ ተራ ደግነት አያሳንሰውም።
- source_word: Ἕν σε ὑστερεῖ
  choice: አንድ ነገር ይጎድልሃል
  rationale: በግሪክ በስም ፈንታ የቆመው ገለልተኛ ነጠላ ‘አንድ’ በአማርኛ ግልጽ እንዲሆን ‘ነገር’ ተጨምሯል፤ የአሁኑ ጉድለትም ‘ይጎድልሃል’ ተብሎ ተገልጧል።
- source_word: ὅσα ἔχεις
  choice: ያለህን ሁሉ
  rationale: ሐረጉ ‘ያለህን’ ወይም ‘ያለህን ሁሉ’ ሊሆን ይችላል፤ በዐውዱ ትእዛዙ የሰውየውን ንብረት በሙሉ ስለሚያካትት ‘ሁሉ’ ተጠቅሟል፣ የቃላዊው አማራጭም በማስታወሻ ተጠብቋል።
- source_word: πώλησον καὶ δὸς τοῖς πτωχοῖς
  choice: ሽጠህ ለድሆች ስጥ
  rationale: ሁለቱ ትእዛዛት ቀጥተኛና ተፈጥሯዊ በሆነ የአማርኛ ቅደም ተከተል ቀርበዋል፤ πτωχοῖς የሚያመለክተው ድሆችን ነው።
- source_word: θησαυρὸν ἐν οὐρανῷ
  choice: በሰማይም ሀብት
  rationale: ‘በሰማይ ሀብት’ የሰማያዊውን ዋጋና ሽልማት ምስል ሳይተረጉም በቀጥታ ያቆያል።
- source_word: δεῦρο ἀκολούθει μοι
  choice: ከዚያም መጥተህ ተከተለኝ
  rationale: δεῦρο ወደ ተናጋሪው እንዲመጣ የሚጋብዝ ሲሆን፣ ἀκολούθει ደግሞ ቀጣይ ደቀ መዝሙርነትን ሊያመለክት የሚችል የአሁን ትእዛዝ ነው፤ ‘ተከተለኝ’ ይህን ጥሪ በተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: ኢየሱስ ሰውየውን መውደዱ ምን ማለት እንደሆነ
  choice: “ወደደው” ተብሎ እንደ እውነተኛ የፍቅር መግለጫ በቀጥታ ተተርጉሟል።
  alternative: እንደ ውጫዊ ደግነት ብቻ ማቅረብ፣ ወይም በኋለኛ ሥነ መለኮታዊ ሥርዓት ውስጥ የተወሰነ ቴክኒካዊ ትርጉም መጫን።
  rationale: ጥቅሱ ἠγάπησεν αὐτόν ብሎ በግልጽ ይናገራል። ትርጉሙ ይህን አያዳክምም፣ ጽሑፉ ያልገለጠውንም የትምህርት ሥርዓት አይጭንበትም፤ ስለዚህ የትረካው ስሜታዊና ሥነ መለኮታዊ ውጥረት ተጠብቋል።
- issue: ንብረቱን ስለመሸጥ የተሰጠው ትእዛዝ ወሰን
  choice: “ያለህን ሁሉ” በማለት ትእዛዙ ንብረቱን በሙሉ እንደሚያካትት ቀርቧል።
  alternative: ትእዛዙን ወደ አጠቃላይ ለጋስነት ማለስለስ፣ ወይም ከግሪኩ በላይ በማብራሪያ ማስፋት።
  rationale: ὅσα ἔχεις በዐውዱ የሰውየውን ንብረት በሙሉ በተፈጥሮ ያመለክታል። ትርጉሙ የትእዛዙን ጥንካሬ ይጠብቃል፣ የሐረጉን የትርጉም አማራጭም በማስታወሻ ያሳያል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የቀጥታ ንግግሩ ትእዛዛዊ ኃይል እና ኢየሱስ ሰውየውን መውደዱ የሚፈጥረው የትረካ ውጥረት ተጠብቋል። የማስታወሻው ምልክት ከሚያብራራው ὅσα ἔχεις ጋር በቀጥታ ተያይዟል።
