    text: ወይም «ደጋግሞ ሳመው» ወይም «በሞቅታ ሳመው»፤ የግሪኩ ግስ ከተራው «ሳመው» የበለጠ አጽንዖት አለው።
    reason: lexical_alternative
lexical_decisions:
