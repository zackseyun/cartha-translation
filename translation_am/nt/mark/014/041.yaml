  text: καὶ ἔρχεται τὸ τρίτον καὶ λέγει αὐτοῖς· Καθεύδετε ⸀τὸ λοιπὸν καὶ ἀναπαύεσθε· ἀπέχει· ἦλθεν ἡ ὥρα, ἰδοὺ παραδίδοται ὁ υἱὸς τοῦ ἀνθρώπου εἰς τὰς χεῖρας τῶν ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/041.yaml
  text: And he comes the third time and says to them[a], “Are you still sleeping and resting? It is enough; the hour has come. Look[c][b], the Son of Man is being handed over into the hands of sinners.”
translation:
  language: am
  text: ለሦስተኛ ጊዜም መጥቶ፣ “እስካሁን ተኝታችሁና እያረፋችሁ ነውን?[a] በቃ![b] ሰዓቲቱ ደርሳለች። እነሆ፣ የሰው ልጅ በኃጢአተኞች እጅ አሳልፎ እየተሰጠ ነው” አላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከአሁን ጀምሮ ተኙ፤ ዕረፉ።” የግሪኩ አባባል እንደ ስላቃዊ ፈቃድ/ትእዛዝ ወይም እንደ ወቀሳዊ ጥያቄ ሊወሰድ ይችላል።
    reason: alternative_reading
  - marker: b
    text: “በቃ!” የሚለው አስቸጋሪ የግሪክ አገላለጽን ይተረጉማል። ሌሎች አተረጓጎሞች “ይበቃል” ወይም፣ እዚህ ግን ዕድሉ አነስተኛ የሆነ የንግድ ትርጉም፣ “ሙሉ ክፍያ ተቀብሏል” የሚሉ ናቸው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται τὸ τρίτον
  choice: ለሦስተኛ ጊዜም መጥቶ
  rationale: የግሪኩን የትረካ የአሁን ጊዜ በተፈጥሯዊ የአማርኛ ትረካ ቅርጽ ያቀርባል፤ τὸ τρίτον ደግሞ ‘ለሦስተኛ ጊዜ’ ተብሎ ግልጽ ሆኗል።
- source_word: Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε
  choice: እስካሁን ተኝታችሁ እያረፋችሁ ነውን?
  rationale: ቃላቱ በጥንታዊው ጽሑፍ ሥርዓተ ነጥብ ያልተወሰኑ ስለሆኑ እንደ ስላቃዊ ፈቃድ ወይም እንደ ወቀሳዊ ጥያቄ ሊሰሙ ይችላሉ። በዐውዱ ተፈጥሯዊ የሆነው የጥያቄ ቅርጽ በዋናው ጽሑፍ ተመርጧል፤ ሌላው አተረጓጎም በማስታወሻ ተጠብቋል።
- source_word: ἀπέχει
  choice: በቃ!
  rationale: አገላለጹ አስቸጋሪ ቢሆንም ከደቀ መዛሙርቱ እንቅልፍ ወደ ወሳኙ ሰዓት የሚያደርገውን ሽግግር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἦλθεν ἡ ὥρα
  choice: ሰዓቲቱ ደርሳለች
  rationale: ‘ሰዓት’ የተወሰነውን የመከራ ጊዜ የሚያመለክተውን የምንጩን ምስልና ክብደት ይጠብቃል።
- source_word: ἰδοὺ
  choice: እነሆ
  rationale: ትኩረት የሚጠራውን ኃይል በክብር ያለውና በአማርኛ የተለመደ ቅርጽ ይጠብቃል።
- source_word: παραδίδοται
  choice: አልፎ እየተሰጠ ነው
  rationale: ‘ክዳት’ ብቻ ብሎ ትርጉሙን ሳያጠብ፣ የመስጠትንና ለሌሎች ሥልጣን አሳልፎ የመስጠትን ሰፊ ክልል ይጠብቃል።
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: የሰው ልጅ
  rationale: የተለመደውን ራስን መጥሪያ እንደ ርዕስና እንደ ሴማዊ አገላለጽ ይጠብቃል።
- source_word: εἰς τὰς χεῖρας τῶν ἁμαρτωλῶν
  choice: በኃጢአተኞች እጅ
  rationale: በሌሎች ኃይልና ሥልጣን ሥር መግባትን የሚገልጠውን ተጨባጭ ፈሊጥ ይጠብቃል።
theological_decisions:
- issue: የΚαθεύδετε ... καὶ ἀναπαύεσθε ኃይል
  choice: ወቀሳዊ ጥያቄ፦ ‘እስካሁን ተኝታችሁ እያረፋችሁ ነውን?’
  alternative: ስላቃዊ ፈቃድ/ትእዛዝ፦ ‘አሁንም ተኙ፤ ዕረፉ።’
  rationale: የቀድሞዎቹ የግሪክ ምስክሮች ሥርዓተ ነጥብ ጉዳዩን አይወስኑም። ሁለቱም አተረጓጎሞች ሰዋስዋዊና ዐውዳዊ ድጋፍ አላቸው፤ ዋናው ጽሑፍ የወቀሳ ጥያቄን ይዟል፣ አማራጩም በማስታወሻ ተጠብቋል።
- issue: የἀπέχει ትርጉም
  choice: በቃ!
  alternative: ‘ይበቃል’ ወይም ከንግድ አገላለጽ የሚወጣ ‘ክፍያው ሙሉ ተቀብሏል’
  rationale: ቃሉ በዚህ ዐውድ አስቸጋሪ ነው። ‘በቃ!’ የትረካውን ድንገተኛ ሽግግር ይጠብቃል፤ የንግድ ትርጉሙን መጫን ግን ከጽሑፉ በላይ ግምት ይጨምራል።
- issue: የπαραδίδοται አተረጓጎም
  choice: አልፎ እየተሰጠ ነው
  alternative: እየተከዳ ነው
  rationale: ‘እየተከዳ’ ትርጉሙን ወደ ይሁዳ ድርጊት ብቻ ሊያጠብ ይችላል። የተመረጠው አገላለጽ በሕማማቱ ትረካ ያለውን ሰፊ የማስረከብ ሂደት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የትረካውን ፍጥነት ለመጠበቅ አጭር ሐረጎች ተመርጠዋል፤ እውነተኛው የአተረጓጎም አሻሚነት በማስታወሻዎች ተጠብቋል።
