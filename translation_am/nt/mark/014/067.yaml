  text: καὶ ἰδοῦσα τὸν Πέτρον θερμαινόμενον ἐμβλέψασα αὐτῷ λέγει· Καὶ σὺ μετὰ τοῦ Ναζαρηνοῦ ⸂ἦσθα τοῦ Ἰησοῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/067.yaml
  text: And seeing Peter warming himself, she looked at him and says, “You also were with Jesus the Nazarene.”
translation:
  language: am
  text: ጴጥሮስ እየሞቀ ሳለ አይታው፣ በትኩረት ተመልክታው፣ “አንተም ከናዝራዊው ኢየሱስ ጋር ነበርክ” ትለዋለች።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θερμαινόμενον
  choice: እሳት ሲሞቅ
  rationale: The participle means that Peter was warming himself; adding እሳት makes the action natural and clear in Amharic from the immediate scene without changing its sense.
- source_word: ἐμβλέψασα αὐτῷ
  choice: ትኩር ብላ ተመለከተችው
  rationale: Conveys an intent, fixed look rather than merely seeing him.
- source_word: λέγει
  choice: አለችው
  rationale: Amharic narrative convention naturally renders the historical present with a past reporting verb, while retaining the event sequence.
- source_word: τοῦ Ναζαρηνοῦ … τοῦ Ἰησοῦ
  choice: ከናዝሬቱ ኢየሱስ ጋር
  rationale: Renders the Greek designation idiomatically as Jesus from Nazareth and preserves Jesus as the referent.
theological_decisions:
- issue: Force of the designation Ναζαρηνός
  choice: ናዝሬቱ ኢየሱስ
  alternative: ኢየሱስ ናዝራዊ
  rationale: The contextual sense is geographic identification. The chosen form is clear modern Amharic and avoids adding a theological implication.
translation_notes:
  register: Modern standard Amharic in Ge'ez script; dignified but conversational direct speech. The wording follows the Greek event sequence while using natural Amharic narrative tense.
