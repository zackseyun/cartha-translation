  choice: -ም
  rationale: እዚህ δέ ጠንካራ ተቃርኖን ሳይሆን ትረካውን የሚያስቀጥል ቀላል አያያዥ ነው፤ በአማርኛ ከ«እርሱ» ጋር የተያያዘው «-ም» ይህን ተግባር በተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: εἶπεν αὐτοῖς
  choice: አላቸው
  rationale: ቀጥተኛ ንግግርን በተፈጥሯዊ አማርኛ ያስተዋውቃል፤ የብዙ ተቀባዮችንም ማመልከቻ ይጠብቃል።
- source_word: Εἷς τῶν δώδεκα
  choice: ከአሥራ ሁለቱ አንዱ
  rationale: ከኢየሱስ የቅርብ ደቀ መዛሙርት ቡድን አንዱ መሆኑን በቀጥታ ይገልጣል።
- source_word: ὁ ἐμβαπτόμενος
  choice: የሚጠቅሰው
  rationale: የግሪኩን በሂደት ላይ ያለ ወይም የተለመደ የመጥቀስ ድርጊትና የመለያ ኃይል በአጭርና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: μετ’ ἐμοῦ
  choice: ከእኔ ጋር
  rationale: μετά ከባለቤት አገባብ ጋር የሚገልጸውን አብሮነት በግልጽ አማርኛ ያስተላልፋል።
- source_word: εἰς τὸ τρύβλιον
  choice: ወደ ሳህኑ
  rationale: «ወደ» የεἰςን አቅጣጫዊ ኃይል ይጠብቃል፤ «ሳህን» ደግሞ ለምግብ የሚያገለግለውን τρύβλιον በዘመናዊ አማርኛ በተፈጥሯዊ ሁኔታ ይገልጣል።
