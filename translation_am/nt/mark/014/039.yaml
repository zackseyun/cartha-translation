- source_word: τὸν αὐτὸν λόγον
  choice: ያንኑ ነገር
  rationale: λόγος እዚህ አንዲት ቃልን ሳይሆን የተደገመውን የጸሎት ይዘት ያመለክታል፤ «ያንኑ ነገር» በአማርኛ ተፈጥሯዊ ሲሆን የግሪኩን ነጠላ አገላለጽ ትርጉም ይጠብቃል።
- source_word: εἰπών
  choice: በመናገር
  rationale: የጸሎቱ ተደጋጋሚ ይዘት እንደተነገረ የሚያሳየውን ተያያዥ ድርጊት በተፈጥሯዊ አማርኛ ያገናኛል።
