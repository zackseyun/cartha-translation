  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: -ም
  rationale: ቀዳሚውን የእስር ትረካ ከዚህ ድርጊት ጋር በተፈጥሯዊ የአማርኛ አያያዝ ያገናኛል፤ ተጨማሪ የጊዜ ወይም የምክንያት ፍቺ አያስገባም።
- source_word: ἀφέντες
  choice: ትተው
  rationale: በዚህ አውድ ኢየሱስን ትተው መሄዳቸውን በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል፤ «ክደው» ከሚለው ይልቅ የግሪኩን የትርጉም ስፋት አያጠብም።
- source_word: αὐτὸν
  choice: እርሱን
  rationale: ተውላጠ ስሙ በአውዱ ኢየሱስን ያመለክታል፤ «እርሱን» የተጠቀሰውን ሰው በግልጽ ያሳያል።
- source_word: ἔφυγον
  choice: ሸሹ
  rationale: ከአደጋ በፍርሃት ፈጥኖ መራቅን በአጭርና ክብደት ባለው ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: πάντες
  choice: ሁሉም
  rationale: የሸሹት አብረውት የነበሩት በሙሉ መሆናቸውን የግሪኩን አጽንዖት ጠብቆ ያሳያል።
theological_decisions:
- issue: ኢየሱስን ትተው የሸሹት ስፋት
  choice: ሁሉም ሸሹ
  alternative: ሁሉም ከእርሱ ሸሹ
  rationale: πάντες የሚለው በዚያ ጊዜ ኢየሱስን ትተው የሸሹትን ሙሉነት ያጎላል። ትርጉሙ ይህን አጽንዖት ሳያለዝብና ከጽሑፉ በላይ ሳያሰፋ ይጠብቃል።
