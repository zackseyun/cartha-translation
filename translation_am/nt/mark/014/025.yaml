base_translation:
  language: en
  yaml_path: translation/nt/mark/014/025.yaml
  text: Truly I tell you[c][b][a], I will certainly not drink again from the fruit of the vine until that day when I drink it new in the kingdom of God.
translation:
  language: am
  text: እውነት እላችኋለሁ፤ ከወይን ፍሬ[b] ዳግመኛ ፈጽሞ አልጠጣም[a]፤ ያንኑ በእግዚአብሔር መንግሥት አዲስ[c] ሆኖ በምጠጣበት በዚያ ቀን ድረስ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ከእንግዲህ ወዲህ ከወይን ፍሬ ፈጽሞ አልጠጣም።» ግሪኩ አጽንዖት ያለውን አሉታዊ አገላለጽ ይጠቀማል።
    reason: lexical_alternative
  - marker: b
    text: «ከወይን ፍሬ» የሚለው የግሪኩ አገላለጽ ነው፤ በዚህ ዐውድ በማዕዱ ላይ የነበረውን ከወይን ተክል የተገኘ መጠጥ ያመለክታል።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ «እንደገና።» የግሪኩ ቅጽል «አዲስ» ማለት ሲሆን፣ በመጨረሻው ዘመን የሚገለጥን አዲስነት ሊያመለክት ይችላል።
    reason: alternative_reading
