id: MRK.14.6
reference: Mark 14:6
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἄφετε αὐτήν· τί αὐτῇ κόπους παρέχετε; καλὸν ἔργον ἠργάσατο ἐν ἐμοί·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/006.yaml
  text: But Jesus said[a], “Leave her alone[c][b]. Why are you troubling her? She has done a beautiful work for me.”
translation:
  language: am
  text: 'ኢየሱስ ግን፣ “ተዉአት! ለምን ታስቸግሯታላችሁ? ለእኔ[a] መልካም ሥራ[b] ሠርታለች” አለ።


    [a] ቃል በቃል፣ “በእኔ”።


    [b] ወይም፣ “ያማረ ሥራ”።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “በእኔ”።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ያማረ ሥራ”።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄφετε αὐτήν
  choice: ተዋት!
  rationale: የወቅቱን ጣልቃ ገብነት ወዲያው እንዲያቆሙ የሚያዝዝ አጭርና ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
- source_word: τί αὐτῇ κόπους παρέχετε;
  choice: ለምን ታስቸግሯታላችሁ?
  rationale: ቃላዊ ትርጉሙ ‘መከራዎችን/ድካሞችን ታመጡባታላችሁ’ የሚል ቢሆንም፣ በዚህ አውድ ሴቲቱን ማስቸገርና ጫና ማድረግን ያመለክታል።
- source_word: καλὸν ἔργον
  choice: መልካም ሥራ
  rationale: καλός መልካምነትን፣ ውበትንና ተገቢነትን ሊያመለክት ይችላል። ‘መልካም ሥራ’ የተፈጥሮ አማርኛ ሲሆን ‘ያማረ ሥራ’ የሚለው አማራጭ በግርጌ ተጠብቋል።
- source_word: ἠργάσατο
  choice: ሠርታለች
  rationale: የተፈጸመውን ድርጊት በቀላልና ተፈጥሯዊ አማርኛ ያሳያል፤ ከ‘ሥራ’ ጋርም የተለመደ አገላለጽ ነው።
- source_word: ἐν ἐμοί
  choice: ለእኔ
  rationale: ድርጊቱ ወደ ኢየሱስ የተመራ መሆኑን በተፈጥሯዊ አማርኛ ያሳያል፤ ቃላዊው ‘በእኔ’ በግርጌ ተገልጧል።
- source_word: δὲ
  choice: ግን
  rationale: ኢየሱስ የተነሣውን ትችት በመቃወም የሰጠውን ምላሽ የሚያሳይ ለስላሳ ንፅፅር ነው።
theological_decisions:
- issue: καλὸν ἔργον ለሴቲቱ ድርጊት የሚሰጠው ግምገማ
  choice: መልካም ሥራ
  alternative: ያማረ ሥራ
  rationale: የኢየሱስን አዎንታዊ ግምገማ ይጠብቃል፤ በድርጊቱ ላይ ልዩ የሥርዓተ እምነት ትርጉም አይጭንም። የቃሉ የውበትና የተገቢነት ገጽታ በአማራጭ ግርጌ ተጠብቋል።
- issue: ἐν ἐμοί ያለው ግንኙነታዊ ኃይል
  choice: ለእኔ
  alternative: በእኔ / በእኔ ላይ
  rationale: ድርጊቱ ለኢየሱስ የተደረገ መሆኑን ያሳያል፣ ሆኖም ከግሪኩ በላይ አካላዊ ወይም ሥነ መለኮታዊ ዝርዝር አይጨምርም። ቃላዊው ቅርጽ በግርጌ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። ‘ተዋት!’ የትእዛዙን አፋጣኝነትና የኢየሱስን መከላከያዊ አቋም በተፈጥሯዊ ንግግር ያሳያል።
