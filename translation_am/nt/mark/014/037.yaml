- source_word: μίαν ὥραν
  choice: አንድ ሰዓት እንኳ
  rationale: μίαν ὥραν የጊዜ መጠንን ያሳያል፤ ‘እንኳ’ በአሉታዊ ጥያቄው ውስጥ ‘አንድ ሰዓት እንኳ’ የሚለውን ተፈጥሯዊ አጽንዖት ይሰጣል።
- source_word: γρηγορῆσαι
  choice: ነቅተህ መቆየት
  rationale: በዚህ ስፍራ ከመተኛት ጋር ያለውን ቀጥተኛ ተቃርኖ ያሳያል፤ ቃሉ የመጠበቅንና የመንቃትን ሰፊ ሐሳብም ሊይዝ ስለሚችል አማራጩ በማስታወሻ ተጠቅሷል።
