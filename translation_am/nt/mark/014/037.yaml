  rationale: ተራኪው የሚጠቀመውን ጴጥሮስ እና ኢየሱስ በቀጥታ የሚጠራበትን ስምዖን ለይቶ ጠብቋል።
- source_word: οὐκ ἴσχυσας
  choice: አልቻልክምን?
