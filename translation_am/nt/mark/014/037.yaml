  yaml_path: translation/nt/mark/014/037.yaml
  text: And he comes and finds them sleeping[a], and he says to Peter, “Simon, are you sleeping? Were you not able to stay awake one hour?”
translation:
  language: am
  text: እርሱም መጥቶ ተኝተው ሳሉ አገኛቸው፤ ጴጥሮስንም እንዲህ አለው፦ “ስምዖን፣ ተኝተሃልን? አንድ ሰዓት እንኳ ነቅተህ መቆየት አልቻልክምን?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አንድ ሰዓት እንኳ ንቁ ሆነህ መጠበቅ አልቻልክምን?”
