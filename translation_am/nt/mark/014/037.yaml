- source_word: καθεύδοντας
  choice: ተኝተው
  rationale: ተከታታይ የመተኛት ሁኔታቸውን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τῷ Πέτρῳ / Σίμων
