  edition: SBLGNT
  text: ὁ δὲ Πέτρος ἔφη αὐτῷ· ⸂Εἰ καὶ⸃ πάντες σκανδαλισθήσονται, ἀλλ’ οὐκ ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/029.yaml
  text: But Peter said to him[a], “Even if all fall away, I will not.”
translation:
  language: am
  text: ጴጥሮስ ግን፣ “ሁሉም ቢሰናከሉ[a] እንኳ፣ እኔ ግን አልሰናከልም” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ቢወድቁ” ወይም “እንዲሰናከሉ ቢደረጉ” ተብሎም ሊተረጎም ይችላል። የግሪኩ ግስ መሰናከልን፣ በአንድ ነገር መከፋትን ወይም ከእምነትና ከታማኝነት መውደቅን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ግን
  rationale: ከኢየሱስ ቀደም ሲል ከተናገረው ትንቢት ጋር የጴጥሮስን ተቃራኒ ምላሽ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἔφη αὐτῷ
  choice: አለው
  rationale: የግሪኩን ቀላል የንግግር ግስና ወደ ኢየሱስ የሚያመለክተውን ተውላጠ ስም በአማርኛ በተፈጥሯዊ ሁኔታ ይጠብቃል።
- source_word: Εἰ καὶ
  choice: ቢ… እንኳ
  rationale: ሊሆን የሚችልን እጅግ የከፋ ሁኔታ የሚያቀርበውን ሁኔታዊና አማካኝ አገላለጽ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: πάντες
  choice: ሁሉም
  rationale: በዐውዱ ውስጥ ያሉትን ደቀ መዛሙርት በሙሉ የሚያመለክተውን ሰፊ ወሰን ይጠብቃል።
- source_word: σκανδαλισθήσονται
  choice: ቢሰናከሉ
  rationale: ሰናከለ የሚለው ቃል የግሪኩን መሰናከል፣ እንቅፋት ውስጥ መግባትና ከኢየሱስ መሸሽ የሚያካትት ስፋት ይጠብቃል፤ የግሱን ተገብሮ ቅርጽ ግን አማርኛ በተፈጥሯዊ ሁኔታ አይገልጸውም።
- source_word: ἀλλ’ οὐκ ἐγώ
  choice: እኔ ግን አልሰናከልም
  rationale: በግሪኩ ያለውን አጭር ነገር ግን አጽንዖት ያለውን ተቃርኖ በግልጽ አማርኛ ያቀርባል፤ ከቀደመው ሐረግ የሚገባውን ግስ ደግሞ ይደግማል።
theological_decisions:
- issue: በደቀ መዝሙርነት ውድቀት ዐውድ ውስጥ የσκανδαλισθήσονται ትርጉም
  choice: ቢሰናከሉ
  alternative: ቢክዱና ቢሸሹ / ቢወድቁ
  rationale: “ቢሰናከሉ” የግሪኩን ምስላዊና ሰፊ ትርጉም ይጠብቃል፤ ዐውዱ የሚያመለክተውን ከኢየሱስ መሸሽ አይክድም፣ ነገር ግን ጽሑፉ ከሚለው በላይ የመጨረሻ ክህደት ፍርድ አይጭንም።
