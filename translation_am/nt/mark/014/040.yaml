  text: καὶ ⸂πάλιν ἐλθὼν εὗρεν αὐτοὺς⸃ καθεύδοντας, ἦσαν γὰρ ⸂αὐτῶν οἱ ὀφθαλμοὶ⸃ ⸀καταβαρυνόμενοι, καὶ οὐκ ᾔδεισαν τί ⸂ἀποκριθῶσιν αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/040.yaml
  text: And coming again[a], he found them sleeping, for their eyes were weighed down, and they did not know what they should answer him.
translation:
  language: am
  text: ደግሞም መጥቶ እየተኙ አገኛቸው፤ ዓይኖቻቸው በእንቅልፍ ከብደው[a] ነበሩና። ምን እንደሚመልሱለትም አያውቁም ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ዓይኖቻቸው እየከበዱ ነበር።» የግሪኩ አገላለጽ ዓይኖቻቸው በእንቅልፍ እንደተጫኑ ወይም እንደከበዱ የሚያሳይ ምስል ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: ደግሞም
  rationale: በትረካው ውስጥ የተደገመውን መምጣት በተፈጥሯዊና አጭር አማርኛ ያሳያል።
- source_word: ἐλθὼν
  choice: መጥቶ
  rationale: ከዋናው ግስ በፊት የተፈጸመውን ተያያዥ ድርጊት የአማርኛ ተከታታይ ግስ አወቃቀር በተፈጥሯዊነት ይገልጣል።
- source_word: εὗρεν αὐτοὺς καθεύδοντας
  choice: ተኝተው አገኛቸው
  rationale: καθεύδοντας የሚያመለክተውን በዚያን ጊዜ በመተኛት ላይ የነበሩበትን ሁኔታ በተለመደ አማርኛ ያስቀምጣል።
- source_word: ἦσαν γὰρ αὐτῶν οἱ ὀφθαλμοὶ καταβαρυνόμενοι
  choice: ዓይኖቻቸው በእንቅልፍ ከብደው ነበርና
  rationale: የዓይኖቻቸውን መከበድ ምስል ይጠብቃል፤ በእንቅልፍ የሚለውም በአማርኛ የክብደቱን ምክንያት በግልጽ ያሳያል። ነበርና የሚለው γάρ ያለውን ምክንያታዊ ግንኙነት ያስተላልፋል።
- source_word: οὐκ ᾔδεισαν
  choice: አላወቁም
  rationale: የዕውቀት እጥረትን ቀጥታና ተፈጥሯዊ በሆነ አማርኛ ይገልጣል።
- source_word: τί ἀποκριθῶσιν αὐτῷ
  choice: ምን እንደሚመልሱለት
  rationale: በተዘዋዋሪ ጥያቄው ያለውን ለኢየሱስ ምላሽ የመስጠት ሐሳብ በተፈጥሯዊ የአማርኛ አገባብ ያቀርባል።
