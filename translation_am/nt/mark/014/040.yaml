review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the repeated return, the disciples’ sleeping, the causal clause, and their inability to answer. However, the Greek imperfect ᾔδεισαν is more accurately represented by a past ongoing state ('they did not know') than by the Amharic perfective አላወቁም. The supplied phrase በእንቅልፍ is a legitimate clarification of the image but is not explicit in the Greek; the footnote appropriately identifies the underlying image.
  naturalness: እየተኙ አገኛቸው more clearly and naturally expresses the ongoing action of καθεύδοντας than ተኝተው አገኛቸው. Plural agreement in ነበሩና is also preferable with ዓይኖቻቸው.
  terminology: No theological or proper-name issue occurs. ዓይኖቻቸው ከብደው preserves the Greek bodily image without importing a doctrinal interpretation; በእንቅልፍ is retained as an idiomatic explanatory specification and is transparently addressed in the note.
  issues:
  - severity: medium
    issue: The rendering አላወቁም does not preserve the imperfect aspect of οὐκ ᾔδεισαν.
    rationale: The Greek describes their continuing lack of knowing what to answer at that moment. ምን እንደሚመልሱለት አያውቁም ነበር more naturally conveys that past ongoing state.
  - severity: low
    issue: ተኝተው can be read as a completed-state expression rather than the ongoing sleeping denoted by καθεύδοντας.
    rationale: እየተኙ  directly represents the participle’s ongoing verbal sense.
  - severity: low
    issue: The plural subject ዓይኖቻቸው is better matched by ነበሩና than by singular ነበርና.
    rationale: This provides standard, clear plural agreement in modern Amharic.
  revised_text: ደግሞም መጥቶ እየተኙ አገኛቸው፤ ዓይኖቻቸው በእንቅልፍ ከብደው[a] ነበሩና። ምን እንደሚመልሱለትም አያውቁም ነበር።
