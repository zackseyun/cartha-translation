id: MRK.14.21
reference: Mark 14:21
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀ὅτι ὁ μὲν υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ, οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· ⸀καλὸν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/021.yaml
  text: For the Son of Man goes just as it is written about him[a], but woe to that man through whom the Son of Man is betrayed. It would have been good for him if that man had not been born.
translation:
  language: am
  text: ምክንያቱም የሰው ልጅስ ስለ እርሱ እንደተጻፈው ይሄዳል፤ ነገር ግን የሰው ልጅን አሳልፎ ለሚሰጥ ለዚያ ሰው ወዮ![a] ያ ሰው ባልተወለደ ለእርሱ መልካም ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የሰው ልጅ በእርሱ አማካኝነት ይከዳል»።
    reason: «አሳልፎ መስጠት» የπαραδίδοται መሠረታዊ ትርጉም ነው፤ በዚህ የሕማማት ዐውድ ግን «መከዳት» ተገቢ የሆነ አማራጭ ትርጉም ነው።
lexical_decisions:
- source_word: ὅτι
  choice: ምክንያቱም
  rationale: በዐውዱ ውስጥ የኢየሱስን ማብራሪያ የሚያስገባውን ምክንያታዊ ኃይል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ὁ μὲν ... δὲ
  choice: የሰው ልጅስ ... ነገር ግን
  rationale: የμέν...δέን ተዛማጅ ንጽጽር በአማርኛው -ስ እና «ነገር ግን» በተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: የሰው ልጅ
  rationale: የኢየሱስን የታወቀ ራስ-መጠሪያና ዳንኤላዊ ድምፁን የሚጠብቅ የተለመደ ቀጥተኛ አተረጓጎም ነው።
- source_word: ὑπάγει
  choice: ይሄዳል
  rationale: ወደተወሰነው ፍጻሜ መሄዱን ያለ ተጨማሪ ትርጓሜ በቀላልና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: καθὼς γέγραπται περὶ αὐτοῦ
  choice: ስለ እርሱ እንደተጻፈው
  rationale: καθώς ያለውን የማነጻጸር ኃይልና γέγραπται የሚያመለክተውን ጸንቶ ያለ የተጻፈ ቃል ይጠብቃል።
- source_word: οὐαὶ
  choice: ወዮለት!
  rationale: የትንቢታዊ ማስጠንቀቂያና የፍርድ ከባድ ኃይል ያለው ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
- source_word: δι’ οὗ
  choice: በእርሱ አማካይነት
  rationale: διά ከዘር አገባብ ጋር ያለውን የአማካይነት ወይም የወኪልነት ትርጉም ይጠብቃል።
- source_word: παραδίδοται
  choice: አሳልፎ በሚሰጥበት
  rationale: የግሱን መሠረታዊ «አሳልፎ መስጠት» ትርጉምና ተገብሮአዊ አቀራረብ ይጠብቃል፤ ዐውዱም የክህደቱን ባሕርይ ግልጽ ያደርገዋል።
- source_word: καλὸν αὐτῷ εἰ οὐκ ἐγεννήθη
  choice: ባልተወለደ ለእርሱ መልካም በሆነ ነበር
  rationale: በግሪኩ ያለውን ያልተፈጸመ ተቃራኒ ሁኔታና ከባድ ግምገማ በትክክል ያስተላልፋል።
- source_word: ὁ ἄνθρωπος ἐκεῖνος
  choice: ያ ሰው
  rationale: በግሪኩ የተደገመውን አመልካች ቃልና የግለሰቡን ግልጽ ማመልከቻ ይጠብቃል።
theological_decisions:
- issue: በሕማማት ዐውድ ውስጥ παραδίδοταιን መተርጎም
  choice: አሳልፎ በሚሰጥበት
  alternative: በሚከዳበት
  rationale: «አሳልፎ መስጠት» የግሱን ሰፊ የቃል ትስስርና ተገብሮአዊ ቅርጽ ይጠብቃል፤ የይሁዳን ክህደት ዐውዱ ያሳያል። በዋናው ጽሑፍ የምንጩን ስፋት ሳይጠብ በማስታወሻ የክህደት ትርጉሙ ተገልጿል።
- issue: የመለኮታዊ ዕቅድና የሰው ኃላፊነት ውጥረት
  choice: «እንደተጻፈው ይሄዳል» እና «በዚያ ሰው ላይ ወዮለት» ሁለቱንም ማቆየት
  alternative: አንዱን አጽንዖት በመስጠት ሌላውን ማለዘብ
  rationale: ጥቅሱ የሰው ልጅ መንገድ ከተጻፈው ጋር እንደሚስማማና አሳልፎ የሚሰጠው ሰው ግን ተጠያቂ እንደሆነ በአንድነት ይናገራል፤ ትርጉሙ ይህን ውጥረት አይፈታውም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። «የሰው ልጅ» እና «ወዮለት» የመጽሐፍ ቅዱስን የታወቀ ክብር ይጠብቃሉ፤ የግሪኩ ድግግሞሽና ንጽጽርም ተጠብቋል።
