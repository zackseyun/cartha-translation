- source_word: ὑπηρέται
  choice: አገልጋዮቹ
  rationale: በፍርድ ቤቱ አውድ ውስጥ በበላይ ባለሥልጣናት ሥር የሚያገለግሉ ሰዎችን ያመለክታል፤ የቤት ሠራተኞች መሆናቸውን አያስገድድም።
