base_translation:
  language: en
  yaml_path: translation/nt/mark/014/065.yaml
  text: And some began to spit on him[a], and to cover his face, and to strike him with their fists, and to say to him[b], “Prophesy!” And the officers received him with blows.
translation:
  language: am
  text: አንዳንዶችም በእርሱ ላይ መትፋት፣ ፊቱን መሸፈን[a]፣ በቡጢ መምታትና፣ “ትንቢት ተናገር!” ማለት ጀመሩ። ጠባቂዎቹም በጥፊ መቱት[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ዓይኑን ሸፈኑት።” ግሪኩ በቃል “ፊቱን መሸፈን” ይላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ጠባቂዎቹ በምቶች ተቀበሉት።” የግሪኩ አገላለጽ በቃል “ጠባቂዎቹ በምቶች ተቀበሉት” የሚል ነው።
    reason: lexical_alternative
