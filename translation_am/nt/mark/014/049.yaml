  terminology: ቅዱሳት መጻሕፍት is preferred for αἱ γραφαί in this context, distinguishing Scripture from ordinary books without imposing an interpretation. ቤተ መቅደስ appropriately renders ἱερόν, with the cultural note retaining the precinct-wide sense.
