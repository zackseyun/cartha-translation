    reason: lexical_alternative
  - marker: c
    text: ይበልጥ ቃል በቃል፣ “ነገር ግን ቅዱሳት መጻሕፍት ይፈጸሙ ዘንድ።” በግሪኩ ዋናው ግስ በግልጽ አልተጻፈም፤ ከአውዱ እንዲገባ ተትቷል።
    reason: lexical_alternative
