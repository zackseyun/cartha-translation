  source_fidelity: 'The main sense is conveyed accurately: repeated public teaching, failure to seize Jesus, and the fulfillment of Scripture. The supplied Amharic completion of the Greek elliptical clause is defensible. However, ᾰἱ γραφαί is the recognized sacred Scriptures, whereas መጻሕፍት by itself can readily mean merely “books”; adding ቅዱሳት makes the referent explicit. Also, በቤተ መቅደሱ is less idiomatic here than the ordinary generic/institutional expression በቤተ መቅደስ.'
