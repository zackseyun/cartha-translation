    rationale: In modern Amharic it can denote books generally. The Greek plural here refers to the sacred scriptural writings; ቅዱሳት መጻሕፍት communicates that established referent.
  - severity: low
    issue: The form በቤተ መቅደሱ is stylistically less natural in this generic temple-setting reference.
    rationale: በቤተ መቅደስ is the usual idiomatic form and does not imply that the inner sanctuary alone is meant.
