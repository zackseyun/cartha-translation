theological_decisions:
- issue: ያልተሟላው የዓላማ ሐረግና የመጻሕፍት ፍጻሜ
  choice: ይህ የሆነው መጻሕፍት ይፈጸሙ ዘንድ ነው
  alternative: ነገር ግን መጻሕፍት ይፈጸሙ ዘንድ
  rationale: ግሪኩ ከἀλλ’ ἵνα በኋላ ዋናውን ግስ በአንድምታ ይተዋል። በዋናው አማርኛ ጽሑፍ ‘ይህ የሆነው’ ተጨምሮ ንባቡ ግልጽ ተደርጓል፤ አጭሩና ይበልጥ ቃል በቃል የሆነው አማራጭ ግን በማስታወሻ ተጠብቋል። ይህም ክስተቱ ከመጻሕፍት ፍጻሜ ጋር ያለውን ግንኙነት ያሳያል እንጂ ከግሪኩ የበለጠ ጠንካራ የግድ ትርጉም አይጨምርም።
