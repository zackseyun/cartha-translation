  rationale: በግሪኩ ያልተገለጸውን ዋና ግስ ለአማርኛ ንባብ አስፈላጊ በሆነ መጠን ይሞላል፤ የዓላማ/ውጤት ግንኙነቱንና ተገብሮአዊውን ቅርጽ ይጠብቃል።
