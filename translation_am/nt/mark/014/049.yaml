    text: እዚህ “ቤተ መቅደስ” የሚለው ውስጠኛውን መቅደስ ብቻ ሳይሆን፣ ግቢውንና በዙሪያው ያሉትን ክፍሎች ጨምሮ መላውን የቤተ መቅደስ ስፍራ ያመለክታል።
    reason: cultural_note
  - marker: b
