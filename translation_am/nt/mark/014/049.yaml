- source_word: διδάσκων
  choice: ሳስተምር
  rationale: ከዋናው ግስ ጋር በተመሳሳይ ጊዜ የቀጠለውን የማስተማር ተግባር በተፈጥሯዊ የአማርኛ ጥገኛ ሐረግ ያሳያል።
- source_word: οὐκ ἐκρατήσατέ με
