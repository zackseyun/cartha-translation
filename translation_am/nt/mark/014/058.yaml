  text: ὅτι Ἡμεῖς ἠκούσαμεν αὐτοῦ λέγοντος ὅτι Ἐγὼ καταλύσω τὸν ναὸν τοῦτον τὸν χειροποίητον καὶ διὰ τριῶν ἡμερῶν ἄλλον ἀχειροποίητον οἰκοδομήσω·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/058.yaml
  text: that[a], ‘We heard him saying, “I will destroy this temple made with hands[b], and in three days I will build another not made with hands.”’
translation:
  language: am
  text: «እኛ እርሱ፣ ‘በእጅ የተሠራውን[a] ይህን ቤተ መቅደስ አፈርሳለሁ፤ በሦስት ቀናት ውስጥ[b] በእጅ ያልተሠራ ሌላ እሠራለሁ’ ሲል ሰምተናል።»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በእጅ የተሠራ” እና “በእጅ ያልተሠራ” የሚሉት አገላለጾች χειροποίητον እና ἀχειροποίητον በሚሉት የግሪክ ቃላት መካከል ያለውን ተቃርኖ ይጠብቃሉ።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በሦስት ቀናት።” እዚህ ያለው የግሪክ አገላለጽ ድርጊቱ በሚፈጸምበት የጊዜ ገደብ ውስጥ መሆኑን በተፈጥሯዊ ሁኔታ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμεῖς ἠκούσαμεν αὐτοῦ λέγοντος
  choice: እኛ፣ … ሲል ሰምተነዋል
  rationale: ግልጽ የሆነውን Ἡμεῖς ለአጽንዖት ጠብቆ፣ የግሪኩን የተውሳከ ግስ አወቃቀር በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: καταλύσω
  choice: አፈርሳለሁ
  rationale: ስለ ሕንፃ ሲነገር ማፍረስን ወይም ማፍረስ ድረስ ማፍረስን ያመለክታል፤ ይህም በዘመናዊ አማርኛ ግልጽ ነው።
- source_word: τὸν ναὸν τοῦτον
  choice: ይህን ቤተ መቅደስ
  rationale: ναόςን በተለመደውና በሚታወቀው ‘ቤተ መቅደስ’ ተርጉሞ፣ τοῦτον ያለውን ጠቋሚ ኃይል ጠብቋል።
- source_word: χειροποίητον / ἀχειροποίητον
  choice: በእጅ የተሠራውን / በእጅ ያልተሠራ
  rationale: በሁለቱ የግሪክ ቃላት መካከል ያለውን ቀጥተኛ ተቃርኖ ይጠብቃል፤ ‘ሰው ሠራሽ/መለኮታዊ’ የሚል ትርጓሜ አያስገባም።
- source_word: διὰ τριῶν ἡμερῶν
  choice: በሦስት ቀናትም ውስጥ
  rationale: διά ከዝርያ ስም ጋር ያለውን የጊዜ ስፋት፣ ድርጊቱ በሦስት ቀናት ገደብ ውስጥ እንደሚፈጸም፣ ያሳያል።
- source_word: ἄλλον ἀχειροποίητον οἰκοδομήσω
  choice: በእጅ ያልተሠራ ሌላ እሠራለሁ
  rationale: ἄλλονን ‘ሌላ’፣ οἰκοδομήσωን ‘እሠራለሁ’ በማለት ያቀርባል፤ በግሪኩ ያልተገለጸውን ‘እንደገና’ አይጨምርም።
theological_decisions:
- issue: ንግግሩ የጠላት ምስክርነት እንጂ ተራኪው ያጸደቀው ቀጥተኛ ንግግር መሆኑን አለማሳሳት
  choice: እንደተዘገበ ምስክርነት በጥቅስ ምልክትና ‘አሉ’ ማቅረብ
  alternative: ምስክሮቹ የኢየሱስን ቃል እንዳዛቡ በትርጉሙ ውስጥ በግልጽ መጨመር
  rationale: ጥቅሱ ምስክሮቹ እንደሰሙ የተናገሩትን ይዘግባል፤ ከሌሎች ክፍሎች የተወሰደ ማስማሚያ ማብራሪያ በዋናው ጽሑፍ ሊገባ አይገባም።
- issue: በእጅ የተሠራ/ያልተሠራ የሚለውን ሥነ መለኮታዊ ጭብጥ ሳይፈታ መጠበቅ
  choice: ቀጥተኛውን የቃላት ተቃርኖ መጠበቅ
  alternative: ‘ሰው ሠራሽ/መለኮታዊ’ ብሎ ትርጓሜውን መወሰን
  rationale: ግሪኩ ሊኖረው የሚችለውን ሥነ መለኮታዊ አንድምታ ይፈቅዳል፣ ግን ትርጉሙን በራሱ አይወስንም።
