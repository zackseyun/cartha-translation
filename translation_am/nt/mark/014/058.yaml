  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ቤተ መቅደስ’ የተለመደውን መጽሐፍ ቅዱሳዊ ቃል ይጠብቃል፤ የሐረጉ አወቃቀር ግን ተፈጥሯዊ አማርኛ ነው።
