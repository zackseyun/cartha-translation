    reason: cultural_note
  - marker: c
    text: “ጽዋ” ለእርሱ የተወሰነውን ሥቃይ የሚያመለክት መጽሐፍ ቅዱሳዊ ምሳሌ ነው፤ ማርቆስ 10፥38ን ይመልከቱ።
