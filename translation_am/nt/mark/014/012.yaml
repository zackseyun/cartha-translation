  edition: SBLGNT
  text: Καὶ τῇ πρώτῃ ἡμέρᾳ τῶν ἀζύμων, ὅτε τὸ πάσχα ἔθυον, λέγουσιν αὐτῷ οἱ μαθηταὶ αὐτοῦ· Ποῦ θέλεις ἀπελθόντες ἑτοιμάσωμεν ἵνα φάγῃς τὸ πάσχα;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/012.yaml
  text: And on the first day of Unleavened Bread[a], when they were sacrificing the Passover lamb, his disciples said to him, “Where do you want us to go and prepare so that you may eat the Passover?”
translation:
  language: am
  text: በቂጣ በዓል በመጀመሪያው ቀን፣ የፋሲካውን በግ በሚሠዉበት ጊዜ[a]፣ ደቀ መዛሙርቱ፣ “አንተ ፋሲካውን እንድትበላ፣ ሄደን የት እንድናዘጋጅ ትፈልጋለህ?” አሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ፋሲካውን በሚሠዉበት ጊዜ።” የግሪኩ ጽሑፍ “ፋሲካውን” ይላል፤ በዚህ አውድ ግን ቃሉ የሚሠዋውን የፋሲካ በግ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ πρώτῃ ἡμέρᾳ τῶν ἀζύμων
  choice: የቂጣ በዓል በጀመረበት በመጀመሪያው ቀን
  rationale: “የቂጣ በዓል” እርሾ የሌለበትን እንጀራ የሚመለከተውን የበዓል ስያሜ በተለመደና በቀላሉ በሚገባ አማርኛ ያቀርባል፤ “በጀመረበት” የመጀመሪያውን ቀን በተፈጥሯዊ አገላለጽ ያሳያል።
- source_word: ὅτε τὸ πάσχα ἔθυον
  choice: የፋሲካውን በግ በሚሠዉበት ጊዜ
  rationale: θύω መሥዋዕት ማቅረብን ያመለክታል፤ በዚህ አውድ πάσχα የፋሲካውን መሥዋዕት በግ ያመለክታል። የግሪኩ ኢምፐርፌክት ቅርጽ የጊዜ አውዱን በ“በሚሠዉበት ጊዜ” ያስተላልፋል።
- source_word: λέγουσιν
  choice: አሉት
  rationale: በግሪክ ትረካ የተጠቀሰው ታሪካዊ የአሁን ጊዜ በተፈጥሯዊ የአማርኛ ትረካ ባለፈ ጊዜ ተተርጉሟል።
- source_word: Ποῦ θέλεις
  choice: የት ... ትፈልጋለህ?
  rationale: θέλω በዚህ ስፍራ ፍላጎትን ወይም ሐሳብን ያመለክታል፤ “ትፈልጋለህ” ዘመናዊና ተፈጥሯዊ ነው።
- source_word: ἀπελθόντες ἑτοιμάσωμεν
  choice: ሄደን እንድናዘጋጅልህ
  rationale: ተሳቢው የመሄድንና የማዘጋጀትን ቅደም ተከተል በተፈጥሯዊ አማርኛ ተያያዥ ግሶች ያቀርባል፤ “ልህ” የሚለው ለኢየሱስ እንደሚያዘጋጁ ግልጽ ያደርጋል።
- source_word: ἵνα φάγῃς τὸ πάσχα
  choice: አንተ የፋሲካን ራት እንድትበላ
  rationale: ἵνα የዓላማ ግንኙነቱን በ“እንድትበላ” ያሳያል። በመብላት አውድ πάσχα የፋሲካን ምግብ ስለሚያመለክት “የፋሲካን ራት” ተብሏል።
theological_decisions:
- issue: በቁጥሩ ውስጥ πάσχα ሁለት ጊዜ የሚያመለክተው
  choice: ከθύω ጋር “የፋሲካው በግ”፤ ከφάγῃς ጋር “የፋሲካ ራት”
  alternative: ሁለቱንም “ፋሲካ” ብቻ ማለት
  rationale: የቅርብ ግሶቹ አውድ የቃሉን ልዩ ልዩ ገጽታ ይወስናል፤ መሠዋት የመሥዋዕቱን እንስሳ፣ መብላት ደግሞ የፋሲካውን ራት ያመለክታል። ይህ ከቃላዊና ከአውዳዊ ማስረጃ የተነሣ እንጂ የሃይማኖት አቋምን ለማስገባት አይደለም።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ ነው። “ደቀ መዛሙርቱ”፣ “ፋሲካ” እና “መሠዋት” በአማርኛ የመጽሐፍ ቅዱስ ንባብ የታወቁ ቃላት ሲሆኑ፣ የዓረፍተ ነገሩ አወቃቀር ግን ወቅታዊና ተፈጥሯዊ ነው።
