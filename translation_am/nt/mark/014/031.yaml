  verdict: revise
  source_fidelity: The draft accurately conveys Peter's heightened, continuing insistence, the necessity of dying together with Jesus, the emphatic future denial, and the collective response. However, እንኳ (“even”) adds a concessive nuance not expressed by ἐὰν and should be removed.
