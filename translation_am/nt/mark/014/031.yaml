  text: ὁ δὲ ⸂ἐκπερισσῶς ἐλάλει⸃· Ἐὰν ⸂δέῃ με⸃ συναποθανεῖν σοι, οὐ μή σε ⸀ἀπαρνήσομαι. ὡσαύτως δὲ καὶ πάντες ἔλεγον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/031.yaml
  text: But he kept insisting all the more[a], “If I must die together with you[c][b], I will certainly not deny you.” And they all were saying the same thing.
translation:
  language: am
  text: እርሱ ግን ይበልጥ አጥብቆ[a] ይናገር ነበር፦ “ከአንተ ጋር አብሬ መሞት[b] ቢኖርብኝ፣ ፈጽሞ[c] አልክድህም።” ሁሉም እንደዚሁ ይሉ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እጅግ አጥብቆ።”
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “ከአንተ ጋር አብሬ መሞት።”
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “ከቶ አልክድህም።” የግሪኩ አገላለጽ ጠንካራ አሉታዊ አጽንዖት አለው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπερισσῶς
  choice: ይበልጥ አጥብቆ
  rationale: ቃሉ የጴጥሮስ ንግግር ከቀድሞው ይበልጥ እየጠነከረ መሄዱንና ከፍተኛ አጽንዖት እንዳለው ያሳያል።
- source_word: ἐλάλει
  choice: እያለ ይናገር ነበር
  rationale: ያልተፈጸመው የግስ ቅርጽ ቀጣይነት ወይም ድግግሞሽ ስለሚያመለክት፣ ጴጥሮስ አጥብቆ መናገሩን እንደቀጠለ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Ἐὰν δέῃ με
  choice: ቢኖርብኝ እንኳ
  rationale: δέῃ ተራ የመቻል ሁኔታን ሳይሆን ግዴታን ወይም አስፈላጊነትን ይገልጣል፤ ‘ቢኖርብኝ’ ይህን በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: συναποθανεῖν σοι
  choice: ከአንተ ጋር አብሬ መሞት
  rationale: συν- የሚለው ቅጥያ አብሮ መሞትን በግልጽ ስለሚጠቁም፣ ‘አብሬ’ የሚለው ቃል የምንጩን ኃይል ይጠብቃል።
- source_word: οὐ μή
  choice: ፈጽሞ … አልክድህም
  rationale: ሁለቱ አሉታዊ ቃላት እጅግ ጠንካራ እምቢታን ይገልጣሉ፤ ‘ፈጽሞ’ በዘመናዊ አማርኛ ይህን አጽንዖት ያስተላልፋል።
- source_word: ἀπαρνήσομαι
  choice: አልክድህም
  rationale: ‘መካድ’ በዚህ ትረካዊ አውድ ግልጽና የተለመደ ሲሆን፣ በኋላ ከሚፈጸመው የጴጥሮስ ክህደት ጋርም የቃላት ትስስሩን ይጠብቃል።
- source_word: ὡσαύτως
  choice: እንደዚሁ
  rationale: ሌሎቹ የተናገሩት ከጴጥሮስ ንግግር ጋር ተመሳሳይ መሆኑን አጭርና ተፈጥሯዊ በሆነ አገላለጽ ያሳያል።
- source_word: πάντες
  choice: ሁሉም
  rationale: የቡድኑን ሙሉ ተሳትፎ ያሳያል፤ ከአውዱ የሚታወቀውን ስም ሳያስገባ የግሪኩን አጠቃላይነት ይጠብቃል።
- source_word: ἔλεγον
  choice: ይሉ ነበር
  rationale: ያልተፈጸመውን የግስ ቅርጽ በመጠበቅ ቀጣይ ወይም ተደጋጋሚ ንግግራቸውን ያመለክታል።
theological_decisions:
- issue: የጴጥሮስ የክህደት እምቢታ ጥንካሬ
  choice: οὐ μή የሚለውን ‘ፈጽሞ … አልክድህም’ ብሎ በጠንካራ አሉታዊ አገላለጽ መተርጎም
  alternative: ‘ከቶ አልክድህም’ ወይም ‘በፍጹም አልክድህም’
  rationale: ትረካው ጴጥሮስ በራሱ ላይ ያለውን ጠንካራ እምነት ከኋለኛው ውድቀቱ ጋር በውጥረት ያቀርባል። ትርጉሙ ይህን የግሪክ አጽንዖት ይጠብቃል እንጂ የትረካውን ነገረ መለኮታዊ ውጥረት አይፈታም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። ‘እያለ ይናገር ነበር’ እና ‘ይሉ ነበር’ የሚሉት አገላለጾች የግሪኩን ቀጣይ ድርጊት ያለ ከባድ ወይም ጥንታዊ ቋንቋ ያስተላልፋሉ።
