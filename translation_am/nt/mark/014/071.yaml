base_translation:
  language: en
  yaml_path: translation/nt/mark/014/071.yaml
  text: But he began to call down curses and to swear[a], “I do not know this man you are talking about.”
translation:
  language: am
  text: እርሱ ግን እርግማን መጥራትና መማል ጀመረ[a]፤ “እናንተ የምትናገሩለት ይህን ሰው አላውቀውም” አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “መርገምና መማል ጀመረ።” ምናልባትም በራሱ ላይ እርግማን እየጠራ ማለት ሊሆን ይችላል፤ የግሪኩ ጽሑፍ ግን እርግማኑ በማን ላይ እንደተጠራ በግልጽ አይናገርም።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: እርሱ ግን
  rationale: δέ ያለውን ቀላል ንፅፅርና የትረካ እድገት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἤρξατο
  choice: ጀመረ
  rationale: ከተከታዮቹ የድርጊት ስሞች ጋር የግሪኩን የመጀመር ትርጉም በግልጽ ያቀርባል።
- source_word: ἀναθεματίζειν
  choice: እርግማን መጥራት
  rationale: ቃሉ ተራ ስድብን ሳይሆን እርግማንን መጥራት ወይም መገዘትን ያመለክታል፤ የእርግማኑን ተቀባይ ግን ግሪኩ ስላልገለጸ አልተወሰነም።
- source_word: ὀμνύναι
  choice: መማል
  rationale: መደበኛ የመሐላ ድርጊትን በተፈጥሯዊና በክቡር አማርኛ ይገልጻል።
- source_word: ὅτι
  choice: ቀጥተኛ ንግግር
  rationale: ὅτι የጴጥሮስን መሐላና ክህደት ይዘት ያስገባል፤ በአማርኛ ቀጥተኛ ጥቅስ ተፈጥሯዊ ነው።
- source_word: Οὐκ οἶδα
  choice: አላውቀውም
  rationale: የግሪኩን ቀጥተኛና ኃይለኛ ክህደት ያለ ትርጓሜያዊ ጭማሪ ይጠብቃል።
- source_word: τὸν ἄνθρωπον τοῦτον
  choice: ይህን ሰው
  rationale: τοῦτον ያለውን ጠቋሚ ኃይል በቀጥታ ይጠብቃል፤ ከግሪኩ በላይ የንቀት ቃና አይጨምርም።
- source_word: ὃν λέγετε
  choice: እናንተ የምትናገሩለትን
  rationale: ሰዎቹ እየጠቀሱት ያለውን ሰው በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጻል።
theological_decisions:
