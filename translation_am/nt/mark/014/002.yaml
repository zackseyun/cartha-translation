  yaml_path: translation/nt/mark/014/002.yaml
  text: For they were saying[a], “Not during the feast, lest there be an uproar from the people.”
translation:
  language: am
  text: ምክንያቱም፣ “በበዓሉ ወቅት አይሁን፤ ከሕዝቡ ዘንድ ሁከት[a] እንዳይነሣ” ይሉ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በሕዝቡ መካከል ሁከት እንዳይነሣ።” የግሪኩ τοῦ λαοῦ የሚለው አገባብ ሁከቱ ከሕዝቡ ዘንድ እንደሚነሣ ወይም በሕዝቡ መካከል እንደሚከሰት ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: ይሉ ነበር
  rationale: ያልተፈጸመው የግስ ጊዜ ቀጣይ ወይም ተደጋጋሚ ንግግርን ስለሚያመለክት፣ ይህ አተረጓጎም ገጽታውን በተፈጥሯዊ አማርኛ ያስቀምጣል።
