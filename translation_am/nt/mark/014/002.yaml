- source_word: Μὴ
  choice: አይሁን
  rationale: በግሪኩ ‘በበዓሉ ወቅት [አናድርገው]’ የሚል ግስ የተተወበት አጭር ምክክር ነው፤ ‘አይሁን’ አጭርነቱንና የውሳኔ ሐሳቡን ይጠብቃል።
- source_word: ἐν τῇ ἑορτῇ
