  rationale: θόρυβος ጫጫታ ያለበትን ሕዝባዊ ሁከት ያመለክታል፤ ‘ሁከት’ ነገሩን ‘አመፅ’ ወይም ‘ግርግር’ ብሎ ሳያጋንን ያስተላልፋል። የአማርኛው አገባብ ወደፊት ሊከሰት የሚችለውን ስጋት ያሳያል።
- source_word: τοῦ λαοῦ
  choice: ሕዝቡ
  rationale: የግሪኩ የባለቤትነት አገባብ ሁከቱ ከሕዝቡ ሊነሣ ወይም በሕዝቡ መካከል ሊከሰት እንደሚችል ያስችላል፤ በዋናው ጽሑፍ ‘ሕዝቡ ... እንዳያስነሣ’ የምንጭነቱን ንባብ በተፈጥሯዊ አማርኛ ይሰጣል፣ ሌላው ንባብ በማስታወሻ ቀርቧል።
