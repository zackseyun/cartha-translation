base_translation:
  language: en
  yaml_path: translation/nt/mark/014/027.yaml
  text: 'And Jesus says to them[a], “You will all fall away, because it is written: ‘I will strike the shepherd, and the sheep will be scattered.’”'
translation:
  language: am
  text: ኢየሱስም እንዲህ አላቸው፤ “ሁላችሁም ትሰናከላላችሁ፤[a] እንዲህ ተብሎ ተጽፏልና፤ ‘እረኛውን እመታለሁ፤ በጎቹም ይበተናሉ።’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሁላችሁም እንድትሰናከሉ ትደረጋላችሁ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: አላቸው
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ ቅርጽ የማርቆስን ሕያው አተራረክ ቢያሳይም፣ በተፈጥሯዊ ዘመናዊ አማርኛ ያለፈ ጊዜው ‘አላቸው’ የትረካውን ፍሰት በግልጽ ያስተላልፋል።
- source_word: σκανδαλισθήσεσθε
  choice: ትሰናከላላችሁ
  rationale: ‘መሰናከል’ የግሪኩን ዘይቤና ትርጉማዊ ስፋት ይጠብቃል፤ በዚህ አውድ ደቀ መዛሙርቱ ኢየሱስን ትተው መሸሻቸውን ያመለክታል፣ ነገር ግን ዘላቂ ክህደት እንደሆነ አስቀድሞ አይወስንም።
- source_word: γέγραπται
  choice: ተጽፏል
  rationale: የተጠናቀቀውን ተገብሮ ቅርጽና ቅዱስ ጽሑፍን የማጣቀሻ መደበኛ አነጋገር ይጠብቃል።
- source_word: Πατάξω
  choice: እመታለሁ
  rationale: የግሪኩን ግስ ኃይል በቀጥታና በዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ποιμένα
  choice: እረኛውን
  rationale: ነጠላነቱንና የተወሰነነቱን ጠብቆ የትንቢታዊውን የመንጋ ምስል ያስተላልፋል።
- source_word: τὰ πρόβατα
  choice: በጎቹ
  rationale: ብዙ ቁጥሩንና የመንጋውን ምስል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: διασκορπισθήσονται
  choice: ይበተናሉ
  rationale: የመንጋውን መበታተን በተፈጥሯዊ አማርኛ ያሳያል፤ የግሪኩ ተገብሮ ሐሳብ በአማርኛው ግስ ውስጥ በበቂ ሁኔታ ይገለጣል።
theological_decisions:
- issue: σκανδαλισθήσεσθε የደቀ መዛሙርቱን ምላሽ እንዴት እንደሚገልጽ
  choice: ትሰናከላላችሁ
  alternative: ከእኔ ትርቃላችሁ / እንድትሰናከሉ ትደረጋላችሁ
  rationale: ‘ትሰናከላላችሁ’ የምንጩን ዘይቤና አሻሚነት ይጠብቃል፤ አውዱ መሸሽንና መበተንን ያመለክታል፣ ሆኖም ቃሉን በዘላቂ ክህደት ትርጉም አይገድበውም።
- issue: Πατάξω ውስጥ የተገለጸው ድርጊት ፈጻሚ
  choice: የመጀመሪያ ሰው ነጠላ ‘እመታለሁ’ እንደተጻፈው ተጠብቋል
  alternative: ፈጻሚውን በተገብሮ ቅርጽ ማደብዘዝ፣ ‘እረኛው ይመታል’
  rationale: ጥቅሱ የመጀመሪያ ሰውን በግልጽ ይዟል፤ በመለኮታዊ ተግባርና በሰው ኃላፊነት መካከል ያለውን ውጥረት ትርጉሙ ሳያለዝብ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የቅዱስ ጽሑፍ ጥቅሱ ግጥማዊ ትይዩነቱን እንዲጠብቅ ተደርጓል።
