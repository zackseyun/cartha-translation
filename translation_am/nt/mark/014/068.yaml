    text: አንዳንድ የእጅ ጽሑፎች “ዶሮም ጮኸ” የሚለውን ሐረግ አያካትቱም።
    reason: textual_variant
  revision_rationale: The revision corrects the duplicated negative ending, preserves the Greek’s paired denial by rendering both verbs with the same referent, and uses a more precise, natural expression for the forecourt/entrance area. The bracketed SBLGNT clause remains in the text, with the manuscript variation retained in the footnote.
