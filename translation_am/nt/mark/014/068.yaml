review_pass:
  verdict: revise
  source_fidelity: The draft conveys Peter’s denial, the doubled ‘know/understand’ assertion, his movement to the προαύλιον, and the rooster’s crowing. However, the second negative contains an evident duplicated morpheme (አልገባኝምም), and the rendering can more clearly retain the object of both verbs.
  naturalness: Apart from the duplicated ም, the register is clear and modern. ‘የምትለውን’ is a more idiomatic wording than ‘የምትዪውን’ in this context, while retaining address to a woman. ‘ወደ ግቢው መግቢያ’ naturally expresses the forecourt/entrance area.
  terminology: ‘ካደ’ appropriately renders ἠρνήσατο without importing an explicit object. ‘ዶሮም ጮኸ’ is natural and accurate. The textual-variant footnote is correctly anchored to the included crowing clause.
  issues:
  - severity: medium
    issue: Typographical/grammatical duplication in አልገባኝምም
    rationale: The doubled final ም is not standard and interrupts the negative coordinated expression. It requires correction.
  - severity: low
    issue: The object of ‘understand’ is only implicit
    rationale: The Greek construction applies ‘what you are saying’ to both ‘know’ and ‘understand.’ Repeating it through the object pronoun in Amharic improves clarity without adding meaning.
  - severity: low
    issue: ‘ውጭው አደባባይ’ is somewhat imprecise for προαύλιον
    rationale: The term denotes the entrance/forecourt area before the inner courtyard. ‘ግቢው መግቢያ’ better conveys this spatial sense in natural modern Amharic.
  revised_text: እርሱ ግን፣ “የምትለውን አላውቅም፤ አልረዳውም” ብሎ ካደ። ከዚያም ወደ ግቢው መግቢያ ወጣ፤ ዶሮም ጮኸ።[a]
  revised_footnotes:
