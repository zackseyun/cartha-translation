  text: ὁ δὲ ἠρνήσατο λέγων· ⸂Οὔτε οἶδα οὔτε ἐπίσταμαι σὺ τί⸃ λέγεις, καὶ ἐξῆλθεν ἔξω εἰς τὸ προαύλιον ⸂καὶ ἀλέκτωρ ἐφώνησεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/068.yaml
  text: But he denied it[a], saying, “I neither know nor understand what you are saying.” And he went out into the forecourt, and a rooster crowed.
translation:
  language: am
  text: እርሱ ግን፣ “የምትለውን አላውቅም፤ አልረዳውም” ብሎ ካደ። ከዚያም ወደ ግቢው መግቢያ ወጣ፤ ዶሮም ጮኸ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች “ዶሮም ጮኸ” የሚለውን ሐረግ አያካትቱም።
    reason: textual_variant
lexical_decisions:
- source_word: ἠρνήσατο
  choice: ካደ
  rationale: ግሱ በዚህ አውድ ከዚያች ሴት ክስ ወይም ንግግር መካዱን ያመለክታል። በአማርኛ «ካደ» ያለ ግልጽ ተሳቢ ተፈጥሯዊ ሲሆን፣ በግሪክ ሐረጉ ውስጥ ኢየሱስ በቀጥታ ስላልተጠቀሰ «እርሱን ካደ» የሚለውን ትርጓሜ አያስገባም።
- source_word: Οὔτε οἶδα οὔτε ἐπίσταμαι
  choice: አላውቅም፤ አልገባኝምም
  rationale: ሁለቱን የእውቀት ግሶች ለይቶ በመተርጎም የጴጥሮስን የተደጋገመ እና የተጠናከረ ክህደት ይጠብቃል፤ «አልገባኝም» በንግግር አውድ ἐπίσταμαι ያለውን ‘አልረዳሁም’ የሚል ስሜት በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: σὺ τί λέγεις
  choice: የምትዪውን
  rationale: ለሴት ተናጋሪ የተመራውን δεύτερο πρόσωπο በአማርኛ ጾታዊ ስምምነት ያሳያል፤ የግሪኩን «የምትናገሪውን» ቀጥተኛ ሐሳብ በተፈጥሯዊ አጭር አገላለጽ ይይዛል።
- source_word: ἐξῆλθεν ἔξω
  choice: ወጣ
  rationale: የግሪኩ ግስና ቦታ አመልካች በቃል ሲተረጎሙ በአማርኛ ድግግሞሽ ይፈጥራሉ፤ «ወጣ» ከተከታዩ መድረሻ ጋር እንቅስቃሴውን በቂ ያስተላልፋል።
- source_word: προαύλιον
  choice: ውጭው አደባባይ
  rationale: ቃሉ ከውስጠኛው ግቢ በፊት ያለውን የመግቢያ ስፍራ ያመለክታል። «ውጭው አደባባይ» ከዋናው ግቢ የተለየ መሆኑን ለዘመናዊ አንባቢ በሚገባ ያሳያል።
- source_word: ἀλέκτωρ ἐφώνησεν
  choice: ዶሮም ጮኸ
  rationale: የዶሮን ጩኸት በተፈጥሯዊ አማርኛ የሚገልጽ ሲሆን፣ የግሪኩን አንቀጽ የሌለው ስም ሳያስገድድ ያቀርባል።
theological_decisions:
- issue: καὶ ἀλέκτωρ ἐφώνησεν የሚለው ሐረግ መካተት
  choice: «ዶሮም ጮኸ» ተብሎ በዋናው ጽሑፍ ተካቷል።
  alternative: አንዳንድ የእጅ ጽሑፎችን በመከተል ሐረጉን መተው።
  rationale: የቀረበው SBLGNT ምንጭ ሐረጉን ከጽሑፋዊ ልዩነት ምልክት ጋር ያካትታል። ስለዚህ በዋናው ጽሑፍ ተተርጉሞ፣ ያለው የጽሑፍ ምስክርነት ልዩነት በግርጌ ማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። በንግግሩ ውስጥ የተናጋሪዋ ሴትነት «የምትዪውን» በሚለው ቅርጽ ተጠብቋል፤ የእውቀት ግሶቹ ድርብነትም ሳይጠፋ ተፈጥሯዊ ተደርጓል።
