- source_word: ἐκράτησαν αὐτόν
  choice: ያዙት
  rationale: κρατέω በዚህ የእስር አውድ በኃይል መያዝንና ከቁጥጥር ሥር ማዋልን ያመለክታል። ‘ያዙት’ የግሪኩን ሰፊ ትርጉም ይጠብቃል፤ ‘አሰሩት’ የሚለው የአውዱ ትርጉም ቢሆንም የሕጋዊ ሂደት ፍቺን የበለጠ ሊያጎላ ይችላል።
