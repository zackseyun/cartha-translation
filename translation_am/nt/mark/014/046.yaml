lexical_decisions:
- source_word: οἱ δὲ
  choice: እነርሱም
  rationale: οἱ በስም ምትክ ‘እነርሱ’ ማለት ሲሆን፣ δέ ደግሞ ቀላል የትረካ ሽግግርን ወይም ንጽጽርን ያመለክታል፤ ‘-ም’ ይህን ያለ ከባድ ተቃርኖ በተፈጥሮ ያስተላልፋል።
- source_word: ἐπέβαλαν τὰς χεῖρας αὐτῷ
