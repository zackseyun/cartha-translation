  rationale: ቀላሉ አያያዥ በአማርኛው የድርጊቶቹ ቅደም ተከተል ውስጥ በተፈጥሮ ተካትቷል፤ ዐረፍተ ነገሩን በ«እና» መጀመር አያስፈልግም።
- source_word: ὑμνήσαντες
