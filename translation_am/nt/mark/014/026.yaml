- source_word: εἰς
  choice: ወደ
  rationale: መድረሻን የሚያመለክተውን የግሪክ መስተዋድድ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: τὸ Ὄρος τῶν Ἐλαιῶν
  choice: ደብረ ዘይት
  rationale: ለዚህ መልክዓ ምድራዊ ስፍራ በአማርኛ የተለመደውና የታወቀው ስያሜ ነው፤ ቃል በቃል «የወይራ ተራራ» ማለት ነው።
