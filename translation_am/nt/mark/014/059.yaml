  yaml_path: translation/nt/mark/014/059.yaml
  text: And not even in this way was their testimony consistent[a].
translation:
  language: am
  text: በዚህ መንገድ እንኳ የሰጡት ምስክርነት እርስ በርሱ አልተስማማም።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የሰጡት ምስክርነት አንድ አልነበረም»፤ ይበልጥ ቃል በቃል፣ «የሰጡት ምስክርነት እኩል አልነበረም።»
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: -ም
  rationale: ከቀደመው የትረካ ክፍል ጋር ያገናኛል፤ በአማርኛ በ«በዚህም» ውስጥ ያለው «-ም» የተፈጥሮ የትረካ ትስስርን ይጠብቃል።
- source_word: οὐδὲ
  choice: እንኳ ... አልነበረም
  rationale: የግሪኩን አጽንዖታዊ ክህደት በተፈጥሯዊ የአማርኛ አገባብ ያስተላልፋል።
- source_word: οὕτως
  choice: በዚህ መንገድ
  rationale: ወዲያው ቀደም ብሎ የተገለጠውን የክስ ምስክርነት አቀራረብ ወደኋላ ያመለክታል።
- source_word: ἴση
  choice: የተስማማ
  rationale: ቃል በቃል «እኩል» ማለት ቢሆንም፣ በፍርድ አውድ የምስክሮቹ ቃል እርስ በርሱ አለመጣጣሙን በግልጽ እና ተፈጥሯዊ መንገድ ይገልጣል።
- source_word: ἦν
  choice: አልነበረም
  rationale: ያለፈ ጊዜ የሆነውን የεἰμί አሉታዊ አገባብ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἡ μαρτυρία αὐτῶν
  choice: ምስክርነታቸው
  rationale: በፍርድ አውድ μαρτυρία የምስክሮችን ቃል ወይም ምስክርነት ያመለክታል፤ የαὐτῶνን ባለቤትነትም በቅጥያው ይገልጣል።
