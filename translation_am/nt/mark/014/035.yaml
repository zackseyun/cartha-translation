lexical_decisions:
- source_word: προελθὼν μικρὸν
  choice: ጥቂት ወደ ፊት ሄዶ
  rationale: ከሌሎቹ ትንሽ ርቀት ወደ ፊት መሄዱን በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል፤ የአማራጭ አገላለጹም በማስታወሻ ተጠብቋል።
- source_word: ἔπιπτεν ἐπὶ τῆς γῆς
  choice: መሬት ላይ ወደቀ
  rationale: የትረካውን ድርጊት በተፈጥሯዊ አማርኛ ያቀርባል፤ የግሪኩ ኢምፐርፌክት እዚህ የመጀመርያ ወይም ገላጭ የትረካ አጠቃቀም ሊኖረው ይችላል።
- source_word: προσηύχετο
  choice: ይጸልይ ነበር
  rationale: የኢምፐርፌክት ግሱን ቀጣይነት በግልጽ አማርኛ ይጠብቃል።
- source_word: ἵνα
  choice: እንድታልፍ
  rationale: የጸሎቱን ይዘት በአማርኛ ንዑስ አረፍተ ነገር በተፈጥሯዊ ሁኔታ ያስተዋውቃል።
- source_word: εἰ δυνατόν ἐστιν
  choice: ቢቻል
  rationale: የሁኔታውን ጥርጣሬና ክፍትነት ሳይጨምር በአጭርና በክቡር አማርኛ ያቀርባል።
- source_word: παρέλθῃ ἀπ’ αὐτοῦ ἡ ὥρα
  choice: ሰዓቲቱ ከእርሱ እንድታልፍ
  rationale: ‘ሰዓቲቱ’ የሚለውን በምሳሌያዊና በሥነ መለኮታዊ ክብደቱ ይጠብቃል፤ ‘ከእርሱ እንድታልፍ’ ደግሞ የπαρέρχομαιን ምስል ሳይፈታ ያስተላልፋል።
theological_decisions:
- issue: የ‘ሰዓቲቱ’ ትርጉም
  choice: ለኢየሱስ ሥቃይና ሞት የተወሰነውን ጊዜ የሚያመለክተውን ‘ሰዓቲቱ’ የሚለውን ምሳሌያዊ አገላለጽ እንዳለ ማቆየት
  alternative: ‘ጊዜው’ ወይም ‘የሥቃዩ ጊዜ’ ብሎ መተርጎም
  rationale: በማርቆስ ትረካ ውስጥ ያለውን ሥነ መለኮታዊ ክብደትና ውጥረት ይጠብቃል፤ ጽሑፉን በማብራሪያ ፍቺ አይተካም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የጸሎቱ ቀጣይነት ‘ይጸልይ ነበር’ በሚለው ተጠብቋል።
