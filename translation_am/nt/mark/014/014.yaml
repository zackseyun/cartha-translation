  verdict: revise
  source_fidelity: The draft conveys the principal referents accurately, including the householder, the Teacher, the possessive ‘my,’ the Passover, and Jesus’ disciples. However, ሄዳችሁ (‘having gone’) adds a movement command that is not expressed in this verse; the Greek directs what to say at whatever place the man enters.
  naturalness: The current wording is generally clear, but removing the added participle produces a tighter and more natural rendering of the Greek’s instruction. The nested direct speech is retained in idiomatic modern Amharic.
  terminology: መምህሩ appropriately renders Ὁ διδάσκαλος without importing the sense of κύριος. የቤቱ ባለቤት is a natural rendering of οἰκοδεσπότης. የእንግዳ ክፍሌ is suitable for κατάλυμά μου, and the footnote correctly distinguishes it from a commercial inn.
