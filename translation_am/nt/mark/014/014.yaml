  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ὅπου ⸀ἐὰν εἰσέλθῃ εἴπατε τῷ οἰκοδεσπότῃ ὅτι Ὁ διδάσκαλος λέγει· Ποῦ ἐστιν τὸ κατάλυμά ⸀μου ὅπου τὸ πάσχα μετὰ τῶν μαθητῶν μου φάγω;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/014.yaml
  text: And wherever he enters[a], say to the master of the house, ‘The Teacher says, “Where is my guest room where I may eat the Passover with my disciples?”’
translation:
  language: am
  text: እርሱ ወደሚገባበት ስፍራ ሁሉ የቤቱን ባለቤት፣ “መምህሩ፣ ‘ከደቀ መዛሙርቴ ጋር ፋሲካን የምበላበት የእንግዳ ክፍሌ[a] የት ነው?’ ይላል” በሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ማረፊያዬ” ወይም “ክፍሌ”። የግሪኩ ቃል ለማደሪያ የሚሆን ስፍራን ያመለክታል፤ እዚህ ግን የንግድ ማደሪያ ሳይሆን በግል ቤት ውስጥ ያለ የእንግዳ ክፍል መሆኑ ይመስላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν εἰσέλθῃ
  choice: እርሱም ወደሚገባበት ቦታ ሁሉ
  rationale: ὅπου ከἐάν እና ከአዮሪስት ሰብጃንክቲቭ ጋር ያለውን ያልተወሰነ ‘ወደሚገባበት ማንኛውም ቦታ’ ትርጉም በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: εἴπατε
  choice: በሉት
  rationale: ለሁለቱ ደቀ መዛሙርት የተሰጠውን የብዙ ቁጥር ትእዛዝና የቀጥታ ንግግሩን አቀራረብ ይጠብቃል።
- source_word: οἰκοδεσπότῃ
  choice: የቤቱን ባለቤት
  rationale: በቤቱና በቤተሰቡ ላይ ኃላፊነት ያለውን ሰው በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጣል፤ እዚህ ‘ባለቤት’ የሕጋዊ ይዞታን ብቻ አያመለክትም።
- source_word: Ὁ διδάσκαλος
  choice: መምህሩ
  rationale: ለኢየሱስ እንደሚታወቅ መጠሪያ የተጠቀመውን ተራ የቃሉን ትርጉም ይጠብቃል፤ ከግሪኩ በላይ የሆነ የሥልጣን ማዕረግ አያስገባም።
- source_word: κατάλυμά μου
  choice: የእንግዳ ክፍሌ
  rationale: በዚህ አውድ κατάλυμα የንግድ ማደሪያን ሳይሆን በግል ቤት ውስጥ ለእንግዶች የተዘጋጀ ክፍልን ያመለክታል፤ ‘-ሌ’ ደግሞ በግሪኩ ያለውን μου በግልጽ ያስተላልፋል።
- source_word: τὸ πάσχα
  choice: ፋሲካን
  rationale: በዚህ አውድ ‘መብላት’ የሚለው ግስ የፋሲካው ምግብ መሆኑን በቂ ስለሚያሳይ፣ በግሪኩ የሌለውን ‘ምግብ’ የሚል ማብራሪያ በዋናው ጽሑፍ አልተጨመረም።
- source_word: μετὰ τῶν μαθητῶν μου
  choice: ከደቀ መዛሙርቴ ጋር
  rationale: የኢየሱስን ተከታዮችና ተማሪዎች የሚያመለክተውን የወንጌላት የተለመደ ቃል ይጠብቃል።
- source_word: φάγω
  choice: የምበላበት
  rationale: የሚፈለገውን ቦታ የሚገልጸውን የታሰበ ድርጊት በተፈጥሯዊ የአማርኛ አንጻራዊ ሐረግ ያስተላልፋል።
theological_decisions:
- issue: የኢየሱስ መጠሪያ διδάσκαλος አተረጓጎም
  choice: መምህሩ
  alternative: ጌታው
  rationale: διδάσκαλος በቀጥታ ‘መምህር’ ማለት ነው። ‘ጌታው’ የሚለው ትርጉም ግሪኩ በዚህ ስፍራ ከሚገልጸው በላይ የሥልጣን እና የክርስቶሎጂ ፍቺ ሊያስገባ ስለሚችል አልተመረጠም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። የቀጥታ ንግግሩ ውስጣዊ ደረጃዎች በምልክተ ጥቅስ ተለይተዋል፤ የእንግዳ ክፍሉን የሚወስነው አንጻራዊ ሐረግ ከስሙ ጋር በቅርብ ተያይዟል።
