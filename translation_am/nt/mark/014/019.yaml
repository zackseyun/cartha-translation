  text: ⸀ἤρξαντο λυπεῖσθαι καὶ λέγειν αὐτῷ εἷς κατὰ εἷς· Μήτι ⸀ἐγώ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/019.yaml
  text: They began to be grieved and to say to him[a], one by one, “Surely not I?”
translation:
  language: am
  text: እነርሱም ማዘን ጀመሩ፤ አንድ በአንድም፣ “እኔ አይደለሁም፣ አይደል?” እያሉ ለእርሱ መናገር ጀመሩ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይበልጥ ቃል በቃል፣ “እኔ አይደለሁምን?” የግሪኩ ጥያቄ μήτι የሚለውን ቃል ይጠቀማል፤ ይህም “አይደለህም” የሚል አሉታዊ መልስ ይጠብቃል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: ጀመሩ
  rationale: የድርጊቶቹን መጀመር በተፈጥሯዊና ግልጽ አማርኛ ያሳያል።
- source_word: λυπεῖσθαι
  choice: ማዘን
  rationale: በዐውዱ ያለውን ሐዘንና የልብ መከፋት በክብር የሚገልጽ የተለመደ አማርኛ ነው።
- source_word: καὶ λέγειν αὐτῷ
  choice: እያሉ ጠየቁት
  rationale: λέγειν በቀጥታ ‘መናገር’ ቢሆንም፣ ተከትሎ የመጣው ንግግር ጥያቄ ስለሆነ ‘እያሉ ጠየቁት’ በአማርኛ ተፈጥሯዊ ሲሆን የመናገሩንም ይዘት ይጠብቃል።
- source_word: εἷς κατὰ εἷς
  choice: አንድ በአንድ
  rationale: እያንዳንዳቸው በተራ እንደተናገሩ በአጭርና በተለመደ አማርኛ ያሳያል።
- source_word: Μήτι ἐγώ;
  choice: እኔ አይደለሁም አይደል?
  rationale: μήτι አሉታዊ መልስ የሚጠበቅበትን ጥያቄ ያመለክታል፤ ይህ አገላለጽ ተናጋሪው ‘አይደለህም’ የሚል መልስ እንደሚጠብቅ በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: የደቀ መዛሙርቱ ጥያቄ አቅጣጫ
  choice: ጥያቄው አሉታዊ መልስን እንደሚጠብቅ በ‘እኔ አይደለሁም አይደል?’ ተተርጉሟል።
  alternative: ‘እኔ ነኝ?’
  rationale: የግሪኩ μήτι መልሱ ‘አይደለህም’ እንዲሆን የሚጠብቅ ጥያቄ ነው፤ ‘እኔ ነኝ?’ ብቻ ማለት ይህን ስሜታዊና ሰዋሰዋዊ ልዩነት ያጠፋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ቀላል የሆነ መደበኛ አማርኛ። የግሪኩን አሉታዊ መልስ የሚጠብቅ ጥያቄ በተፈጥሯዊ የአማርኛ ጥያቄ-ቅጥያ ተገልጿል።
