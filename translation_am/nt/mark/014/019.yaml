review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the disciples’ sorrow, the sequential individual responses, and the negative-answer expectation of μήτι. However, it renders λέγειν as “ጠየቁት” (“asked him”), whereas the Greek verb is “said/spoke,” and its wording does not clearly retain ἤρξαντο as governing both grieving and speaking.
  naturalness: The proposed revision is modern, clear standard Amharic. “እኔ አይደለሁም፣ አይደል?” is a natural idiomatic way to express the elliptical, negatively oriented question.
  terminology: No theological terminology is at issue. The pronoun “ለእርሱ” preserves αὐτῷ without unnecessarily substituting Jesus’ name.
  issues:
  - severity: medium
    issue: “ጠየቁት” translates the speech as asking rather than saying.
    rationale: λέγειν means “to say/speak”; although the quoted content is interrogative, the source does not use a verb specifically meaning “ask.”
  - severity: low
    issue: The scope of “ጀመሩ” is not clear for both infinitives.
    rationale: ἤρξαντο governs both “to be grieved” and “to say.” Repeating “መናገር ጀመሩ” in Amharic makes this source feature explicit and avoids suggesting that only their grief began.
  revised_text: እነርሱም ማዘን ጀመሩ፤ አንድ በአንድም፣ “እኔ አይደለሁም፣ አይደል?” እያሉ ለእርሱ መናገር ጀመሩ።[a]
  revised_footnotes:
