    reason: lexical_alternative
  revision_rationale: The revision retains the Greek’s two coordinated inceptive actions, renders λέγειν with “መናገር” rather than the narrower “መጠየቅ,” and preserves the negative expectation signaled by μήτι in idiomatic Amharic. The footnote is adjusted to identify μήτι explicitly and to explain its expected negative reply accurately.
