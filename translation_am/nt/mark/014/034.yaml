- issue: የἕως θανάτου አገላለጽ
  choice: እስከ ሞት ድረስ
  alternative: ለሞት እስክቀርብ ድረስ
  rationale: ዋናው አተረጓጎም ሐዘኑ እስከ ሞት የደረሰ መሆኑን በግልጽ ይጠብቃል፤ ምክንያታዊ ወይም ሕክምናዊ ዝርዝር አይጨምርም።
