base_translation:
  language: en
  yaml_path: translation/nt/mark/014/034.yaml
  text: And he says to them[a], “My soul is deeply grieved, even to death[c][b]. Remain here and keep watch.”
translation:
  language: am
  text: እርሱም እንዲህ ይላቸዋል፦ “ነፍሴ እጅግ አዝናለች[a]፤ እስከ ሞት ድረስ[b]። እዚህ ቆዩ፣ ንቁ[c]።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እጅግ ሐዘን ተሰምቷታል” ወይም “በሐዘን ተውጣለች።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “እስከ ሞት ደረጃ ድረስ።” ይህ ጽኑ ሐዘንን የሚገልጽ አገላለጽ ነው።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “ነቅታችሁ ቆዩ” ወይም “በንቃት ጠብቁ።”
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: አላቸው
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ ቅርጽ የማርቆስን ሕያው ትረካ ቢያጎላም፣ በተፈጥሯዊ ዘመናዊ አማርኛ ትረካ ቀላል ያለፈ ጊዜው ‘አላቸው’ ይበልጥ ግልጽ ነው።
- source_word: Περίλυπός
  choice: እጅግ አዝናለች
  rationale: ቃሉ ከፍተኛና ከባድ ሐዘንን ያመለክታል፤ ‘እጅግ አዝናለች’ ይህን ክብደት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ψυχή
  choice: ነፍሴ
  rationale: ‘ነፍሴ’ የኢየሱስን ውስጣዊ ሕይወትና መላ ማንነት የሚነካውን ጥልቅ ሐዘን ይጠብቃል፤ በአማርኛም የተለመደና ክቡር አገላለጽ ነው።
- source_word: ἕως θανάτου
  choice: እስከ ሞት ድረስ
  rationale: የግሪኩን የሐዘኑን ጽንፍ የሚገልጽ አሻሚነት ሳይፈታ፣ በቀጥታና በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: μείνατε
  choice: ቆዩ
  rationale: በዚያው ስፍራ እንዲቀሩ የተሰጠውን ትእዛዝ በግልጽና ተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ὧδε
  choice: በዚህ
  rationale: ቀላሉን የስፍራ አመልካች ‘እዚህ/በዚህ’ በተፈጥሯዊ የትእዛዝ ሐረግ ውስጥ ያቀርባል።
- source_word: γρηγορεῖτε
  choice: ንቁ
  rationale: ‘ንቁ’ ከእንቅልፍ መቆጠብንም ሆነ በንቃት መጠበቅን ሊያካትት ስለሚችል የግሪኩን የትርጉም ስፋት ይጠብቃል።
theological_decisions:
- issue: በኢየሱስ ንግግር ውስጥ ψυχήን መተርጎም
  choice: ነፍሴ
