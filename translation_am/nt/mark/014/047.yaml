  text: εἷς δέ ⸀τις τῶν παρεστηκότων σπασάμενος τὴν μάχαιραν ἔπαισεν τὸν δοῦλον τοῦ ἀρχιερέως καὶ ἀφεῖλεν αὐτοῦ τὸ ⸀ὠτάριον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/047.yaml
  text: But one of those standing nearby drew his sword and struck the high priest’s servant[a], and cut off his ear.
translation:
  language: am
  text: ነገር ግን በዚያ ቆመው ከነበሩት አንዱ ሰይፉን መዝዞ የሊቀ ካህናቱን ባሪያ[a] መታው፤ ጆሮውንም ቆረጠው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አገልጋይ።” የግሪኩ ቃል δοῦλος ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς δέ τις
  choice: ነገር ግን ... አንዱ
  rationale: δέ የሚያሳየውን ቀላል ተቃርኖ በ«ነገር ግን» ያቆያል፤ εἷς ... τις ደግሞ ግለሰቡን ሳይለይ «አንዱ» ተብሎ ተተርጉሟል።
- source_word: τῶν παρεστηκότων
  choice: በዚያ ቆመው ከነበሩት
  rationale: ፍጹም አንቀጽ የሚያመለክተውን በቦታው ቆመው የነበሩ ሰዎች ትርጉም በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: σπασάμενος τὴν μάχαιραν
  choice: ሰይፉን መዞ
  rationale: σπάομαι ከመሣሪያ ጋር ሲመጣ «መዝዞ ማውጣት» ማለት ነው፤ μάχαιρα እዚህ «ሰይፍ» ተብሎ በግልጽ ተተርጉሟል።
- source_word: ἔπαισεν
  choice: መታው
  rationale: የግድያ መሣሪያውን በመጠቀም የተፈጸመውን ኃይለኛ ምት በዘመናዊና ተፈጥሯዊ ቃል ይገልጻል።
- source_word: τὸν δοῦλον τοῦ ἀρχιερέως
  choice: የሊቀ ካህናቱን ባሪያ
  rationale: δοῦλος እዚህ የማኅበራዊ ተገዢነትና የባለቤትነት ሁኔታን ስለሚያመለክት «ባሪያ» ዋና ትርጉም ሆኗል፤ ἀρχιερεύς በተለመደው «ሊቀ ካህናት» ተተርጉሟል።
- source_word: ἀφεῖλεν αὐτοῦ τὸ ὠτάριον
  choice: ጆሮውንም ቆረጠው
  rationale: ἀφαιρέω በዚህ የጥቃት አውድ «ቆርጦ ማስወገድ» ማለት ነው፤ የὠτάριον ድንበሳዊ ቅርጽ በአማርኛ «ጆሮ» ተብሎ ተፈጥሯዊ ሆኗል። ማርቆስ ቀኝ ወይም ግራ አይልም።
theological_decisions:
- issue: በትረካዊ የማኅበራዊ ደረጃ አውድ δοῦλοςን መተርጎም
  choice: ባሪያ
  alternative: አገልጋይ
  rationale: የሊቀ ካህናቱ δοῦλος የቤት ወይም የተቋም ተገዢ መሆኑን «ባሪያ» በግልጽ ያቆያል፤ «አገልጋይ» የታሪካዊውን ማኅበራዊ ሁኔታ ሊያለሰልስ ይችላል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው የትረካ አማርኛ ተጠቅሟል። የድርጊቶቹ ቅደም ተከተል በ«መዞ ... መታው፤ ... ቆረጠው» በተፈጥሯዊ ሁኔታ ተጠብቋል።
