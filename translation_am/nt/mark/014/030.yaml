review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the historical present, the two temporal expressions (‘today’ and ‘this very night’), the sequence before the crowing, and the contrasts of twice/three times. However, ዶሮ can denote a chicken generally and does not reliably specify the male bird expressed by ἀλέκτωρ; አውራ ዶሮ is the clear modern Amharic equivalent of ‘rooster.’
  naturalness: The sentence is natural, clear modern standard Amharic. The retained historical present is marked but acceptable in narrative, and the explanatory footnote appropriately signals the more customary past-tense narrative alternative.
  terminology: እውነት እልሃለሁ faithfully conveys the solemn Ἀμὴν λέγω σοι, and ትክደኛለህ naturally renders ‘you will deny me.’ The specific animal term should be made explicit as አውራ ዶሮ.
  issues:
  - severity: medium
    issue: ዶሮ is semantically broader than ἀλέκτωρ.
    rationale: The Greek term denotes a rooster/cock. In modern Amharic, ዶሮ may refer to a chicken without specifying sex, whereas አውራ ዶሮ clearly retains the source’s male-bird reference.
