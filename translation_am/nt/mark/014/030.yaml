  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ἀμὴν λέγω σοι ὅτι σὺ σήμερον ⸂ταύτῃ τῇ νυκτὶ⸃ πρὶν ἢ δὶς ἀλέκτορα φωνῆσαι τρίς ⸂με ἀπαρνήσῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/030.yaml
  text: And Jesus says to him[a], “Truly I tell you, today, this very night, before a rooster crows twice, you will deny me three times.”
translation:
  language: am
  text: ኢየሱስም እንዲህ ይለዋል[a]፦ “እውነት እልሃለሁ፤ አንተ ዛሬ፣ በዚችው ሌሊት፣ አውራ ዶሮ ሁለት ጊዜ ሳይጮኽ ሦስት ጊዜ ትክደኛለህ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ በተለመደው የአማርኛ ትረካ የአለፈ ጊዜ፣ “አለው።” ግሪኩ የአሁን ጊዜ ግስ ይጠቀማል።
    reason: የማርቆስን ታሪካዊ የአሁን ጊዜ አጠቃቀም ለአንባቢው ማስረዳት
lexical_decisions:
- source_word: λέγει
  choice: ይለዋል
  rationale: የማርቆስን ታሪካዊ የአሁን ጊዜ አገላለጽ ለማቆየት በአሁን ጊዜ ተተርጉሟል፤ በአማርኛም የትረካውን ሕያውነት ይጠብቃል።
- source_word: Ἀμὴν λέγω σοι
  choice: እውነት እልሃለሁ
  rationale: Ἀμήν በዚህ የንግግር መግቢያ ላይ የተነገረውን እርግጠኝነትና ክብደት ያሳያል፤ ይህ አገላለጽ በዘመናዊ አማርኛ ግልጽና የተከበረ ነው።
- source_word: σὺ
  choice: አንተ
  rationale: በግሪክ በግልጽ የተጠቀሰውን አጽንዖት ለማቆየት ተካትቷል።
- source_word: σήμερον ⸂ταύτῃ τῇ νυκτὶ⸃
  choice: ዛሬ፣ በዚችው ሌሊት
  rationale: ሁለቱንም የጊዜ አገላለጾች በመጠበቅ የትንቢቱን አፋጣኝነትና አጽንዖት ያሳያል፤ “ዚችው” የግሪኩን ጠቋሚ አጽንዖት ያንጸባርቃል።
- source_word: πρὶν ἢ δὶς ἀλέκτορα φωνῆσαι
  choice: ዶሮ ሁለት ጊዜ ሳይጮኽ
  rationale: የግሪኩን ጊዜያዊ ቅደም ተከተልና δὶς የሚያመለክተውን ትክክለኛ ቁጥር በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τρίς ⸂με ἀπαρνήσῃ⸃
  choice: ሦስት ጊዜ ትክደኛለህ
  rationale: τρίς የሚያመለክተውን ሦስት ጊዜ ከዶሮው ሁለት ጊዜ መጮኽ ጋር ያለውን ንጽጽር ጠብቆ፣ ἀπαρνέομαιን በዚህ አውድ የተለመደው “መካድ” በሚለው ቃል ይተረጉማል።
theological_decisions:
- issue: σήμερον እና ταύτῃ τῇ νυκτί የተባሉትን ሁለት የጊዜ አገላለጾች ማቆየት
  choice: “ዛሬ፣ በዚችው ሌሊት” በማለት ሁለቱንም ማካተት
  alternative: “በዚችው ሌሊት” ብቻ በማለት ማዋሐድ
  rationale: የምንጩን ሁለት አገላለጾችና የቃሉን አጽንዖት ሳይቀንስ ይጠብቃል።
- issue: የማርቆስ ታሪካዊ የአሁን ጊዜ ግስ
  choice: “ይለዋል” በሚል የአሁን ጊዜ ቅርጽ ማቆየት
  alternative: “አለው” በሚል የአለፈ ጊዜ ቅርጽ ማለስለስ
  rationale: የግሪኩን λέγει ቅርጽና የማርቆስን ሕያው የትረካ ስልት ያንጸባርቃል።
- issue: ἀπαρνέομαι የሚያመለክተው ክህደት
  choice: “ትክደኛለህ”
  alternative: “ከእኔ ጋር እንደማትተዋወቅ ትናገራለህ” ወይም “ትክደኛለህ/ትተወኛለህ” በሚል ትርጓሜ ማስፋት
  rationale: “መካድ” የምንጩን ሰፊ ትርጉም ይጠብቃል፤ ክህደቱ በትክክል ምን ዓይነት እንደሚሆን ከአውዱ እንዲታወቅ ያደርጋል እንጂ በትርጉሙ ውስጥ አይገድበውም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና የተከበረ መደበኛ አማርኛ ተጠቅሟል። “እውነት እልሃለሁ” የንግግሩን ክብደት ሳያጣ ለተራ አንባቢ ተፈጥሯዊ ነው፤ “በዚችው ሌሊት” ደግሞ ያለ ጥንታዊ ወይም አስቸጋሪ ቃላት አጽንዖቱን ይጠብቃል።
