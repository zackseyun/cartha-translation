base_translation:
  language: en
  yaml_path: translation/nt/mark/014/009.yaml
  text: Truly I tell you[a], wherever the good news is proclaimed in the whole world[b], what this woman has done will also be spoken of in memory of her.
translation:
  language: am
  text: እውነት እላችኋለሁ፤ መልካሙ ዜና[a] በዓለም ሁሉ የትም ቢሰበክ፣ ይህች ሴት ያደረገችውም እርሷን ለማስታወስ[b] ይነገራል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “ወንጌል።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፦ “ለእርሷ መታሰቢያ እንዲሆን።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: እውነት
  rationale: የኢየሱስን ክብደት ያለውና ሥልጣናዊ አረጋጋጭ መግቢያ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: λέγω ὑμῖν
  choice: እላችኋለሁ
  rationale: ቀጥተኛውን ንግግርና የብዙ ሰዎች አድራሻ በአጭርና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ὅπου ἐὰν
  choice: የትም ቢሰበክ
  rationale: ድርጊቱ በማንኛውም ስፍራ ሲፈጸም የሚለውን አጠቃላይና ያልተወሰነ ሁኔታ ያሳያል።
- source_word: κηρυχθῇ
  choice: ቢሰበክ
  rationale: ይፋዊ ማወጅን የሚያመለክተውን የግሪክ ግስ በአማርኛ የተለመደ መጽሐፍ ቅዱሳዊና ግልጽ አገላለጽ ይተረጉማል።
- source_word: τὸ εὐαγγέλιον
  choice: ይህ የምሥራች
  rationale: εὐαγγέλιον የሚለውን ‘መልካም ዜና’ ትርጉም በተፈጥሯዊና በተለመደ አማርኛ ያቀርባል፤ የሚያመለክተውም በዐውዱ የተጠቀሰውን መልእክት ስለሆነ ‘ይህ’ ተጠብቋል።
- source_word: εἰς ὅλον τὸν κόσμον
  choice: በዓለም ሁሉ
  rationale: የአጽናፈ ዓለምን ሰፊ ወሰን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ὃ ἐποίησεν αὕτη
  choice: ይህች ሴት ያደረገችው
  rationale: የሴት ነጠላ አመልካች ተውላጠ ስም αὕτη በቅርብ ዐውድ ያለችውን ሴት ስለሚያመለክት፣ ማጣቀሻውን ግልጽ ያደርጋል።
- source_word: λαληθήσεται
  choice: ይነገራል
  rationale: ድርጊቷ ወደፊት በንግግር እንደሚወሳ የሚያሳየውን የወደፊት ጊዜ ተደራጊ ቅርጽ ይጠብቃል።
- source_word: εἰς μνημόσυνον αὐτῆς
  choice: እርሷን ለማስታወስ
  rationale: የመታሰቢያና የማስታወስን ዓላማ በግልጽ ዘመናዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: εὐαγγέλιον በዓለም ሁሉ ስለሚታወጅ መልእክት ሲናገር ያለው አተረጓጎም
  choice: የምሥራች
  alternative: ወንጌል
  rationale: ‘የምሥራች’ የምንጩን ቀጥተኛ ትርጉም ለዘመናዊ አንባቢ ግልጽ ያደርጋል፤ በክርስቲያናዊ አጠቃቀም የተለመደው ‘ወንጌል’ ግን በማስታወሻ ተጠብቋል።
- issue: αὕτη የሚያመለክተውን በግልጽ መጥቀስ
  choice: ይህች ሴት
  alternative: እርሷ
  rationale: የግሪኩ ቅርጽ ሴት ነጠላ ሲሆን የቅርብ ዐውዱን ሴት ያመለክታል፤ ‘ሴት’ ማለት ያለ ተጨማሪ ትርጓሜ ማጣቀሻውን ያብራራል።
- issue: εἰς μνημόσυνον αὐτῆς የሚያሳየው የመታሰቢያ ግንኙነት
  choice: እርሷን ለማስታወስ
  alternative: ለእርሷ መታሰቢያ እንዲሆን
  rationale: ዋናው ጽሑፍ የማስታወስን ዓላማ በተፈጥሯዊ አማርኛ ይገልጻል፤ የስም ቅርጹን በቅርብ የሚከተለው አማራጭ የግሪኩን መጠነኛ አገላለጻዊ ልዩነት ለመጠበቅ በማስታወሻ ቀርቧል።
