  alternative: በዋናው ጽሑፍ «አሥራ ሁለቱ ደቀ መዛሙርት» ወይም «አሥራ ሁለቱ ሐዋርያት» ብሎ ማስፋት
  rationale: የትረካው አውድ ማንነታቸውን በግልጽ ያሳያል፤ የግሪኩን አጭር አገላለጽ መጠበቅ ከአስተርጓሚ ማስፋፊያ ይቆጠባል።
