  text: ἠκούσατε τῆς βλασφημίας· τί ὑμῖν φαίνεται; οἱ δὲ πάντες κατέκριναν αὐτὸν ⸂ἔνοχον εἶναι⸃ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/064.yaml
  text: You have heard the blasphemy[b][a]. What does it seem to you? And they all condemned him as deserving death.
translation:
  language: am
  text: “ስድቡን ሰምታችኋል። ምን ይመስላችኋል?[a]” እነርሱም ሁሉ “ሞት ይገባዋል” ብለው ፈረዱበት።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም ይበልጥ በቀጥተኛ አገላለጽ፣ “ምን ትላላችሁ?” ወይም “ፍርዳችሁ ምንድን ነው?”
    reason: lexical_alternative
  - marker: b
    text: ወይም “ለሞት ተጠያቂ ነው ብለው”፣ “ሞት የሚገባው ነው ብለው”።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσατε
  choice: ሰምታችኋል
  rationale: የግሪኩ የአንድ ጊዜ ድርጊት አመልካች ግስ አሁን የሰሙትን ነገር ወዲያው ለማስታወስ በቀረበ ንግግር ውስጥ ነው፤ “ሰምታችኋል” ይህን ቅርብ ውጤት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: βλασφημίας
  choice: ስድቡን
  rationale: “ስድብ” የክሱን ከባድ ሃይማኖታዊና ፍርዳዊ ትርጉም ይጠብቃል። ቃሉ የሸንጎውን ክስ እንጂ ተራኪው ክሱን እንደ ፍትሐዊ መቀበሉን አያመለክትም፤ “እግዚአብሔርን መሳደብ” ብሎ ዒላማውን መጨመርም አያስፈልግም።
- source_word: τί ὑμῖν φαίνεται
  choice: ምን ይመስላችኋል?
  rationale: የግሪኩን አገላለጽ ቅርጽ ይጠብቃል፤ በዐውዱ ውስጥ ግን አስተያየትን ወይም የፍርድ ውሳኔን ይጠይቃል።
- source_word: πάντες
  choice: እነርሱም ሁሉ
  rationale: በፍርዱ ላይ የነበረውን ሙሉ ስምምነት በግልጽ ያሳያል።
- source_word: κατέκριναν
  choice: ፈረዱበት
  rationale: ግሱ በአንድ ሰው ላይ የጥፋተኝነት ፍርድ መስጠትን የሚያመለክት ፍርዳዊ ቃል ነው፤ “ፈረዱበት” ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἔνοχον εἶναι θανάτου
  choice: “ሞት ይገባዋል” ብለው
  rationale: ሐረጉ ለሞት ቅጣት ተገቢ ወይም ተጠያቂ መሆንን ያመለክታል። “ሞት ይገባዋል” ፍርዳዊ ኃይሉን በግልጽና ተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: በፍርድ ዐውድ ውስጥ βλασφημίαን መተርጎም
  choice: ስድብ
  alternative: የስድብ ንግግር
  rationale: ጽሑፉ የሸንጎውን ክስ ያቀርባል እንጂ ክሱ ትክክለኛ እንደሆነ በተራኪው ድምፅ አያረጋግጥም። “ስድብ” የክሱን ሃይማኖታዊና ፍርዳዊ ክብደት ይጠብቃል፤ የጽሑፉን ውጥረትም አይፈታም።
- issue: ἔνοχον εἶναι θανάτου የሚያመለክተውን የፍርድ ውሳኔ መግለጽ
  choice: ሞት ይገባዋል
  alternative: ለሞት ተጠያቂ ነው
  rationale: የተመረጠው አገላለጽ ሸንጎው ሞት የሚገባው እንደሆነ መፍረዱን ያሳያል፤ ክሱ ከተራኪው የተሰጠ መለኮታዊ ግምገማ እንደሆነ አያቀርብም።
