base_translation:
  language: en
  yaml_path: translation/nt/mark/014/044.yaml
  text: The one betraying him had given them a signal[a], saying, “The one I kiss is he[c][b]. Seize him and lead him away securely.”
translation:
  language: am
  text: እርሱን አሳልፎ የሚሰጠውም፣ “የምስመው[b] እሱ ነው፤ ያዙትና በጥንቃቄ ውሰዱት[c]” ብሎ፣ አስቀድሞ የመለያ ምልክት[a] ሰጥቷቸው ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ምልክት”፤ የግሪኩ ቃል አስቀድሞ የተስማሙበትን የመለያ ምልክት ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: መሳም የተለመደ ሰላምታ ነበር፤ እዚህ ግን ለመለየት የሚያገለግል ምልክት ሆኗል።
    reason: cultural_note
  - marker: c
    text: ወይም፣ “በደህና ውሰዱት።” በዚህ የመያዝ አውድ፣ እንዳያመልጥ በጥብቅ መያዛቸውን ማረጋገጥ ሊያመለክት ይችላል።
    reason: alternative_reading
