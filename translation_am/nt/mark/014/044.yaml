  rationale: ኃይል በመጠቀም መያዝን ያሳያል፤ በግሪኩ ያልተገለጸውን ሕጋዊ ሂደት አይጨምርም።
- source_word: ἀπάγετε ἀσφαλῶς
  choice: አጥብቃችሁ ጠብቃችሁ ውሰዱት
  rationale: በዚህ የእስር አውድ ἀσφαλῶς ከርኅራኄ ጋር የተያያዘ 'በደህና' ሳይሆን እንዳያመልጥ በጥብቅ መውሰድን ሊያመለክት ይችላል።
