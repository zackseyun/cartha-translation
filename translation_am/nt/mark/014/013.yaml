  text: καὶ ἀποστέλλει δύο τῶν μαθητῶν αὐτοῦ καὶ λέγει αὐτοῖς· Ὑπάγετε εἰς τὴν πόλιν, καὶ ἀπαντήσει ὑμῖν ἄνθρωπος κεράμιον ὕδατος βαστάζων· ἀκολουθήσατε αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/013.yaml
  text: And he sends two of his disciples and says to them[a], “Go into the city, and a man carrying a jar of water will meet you. Follow him,”
translation:
  language: am
  text: ከደቀ መዛሙርቱም ሁለቱን ላከና እንዲህ አላቸው፤ “ወደ ከተማው ግቡ፤ የውሃ እንስራ[a] የተሸከመ አንድ ወንድ ሰው ያገኛችኋል። እርሱን ተከተሉ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ውሃ የያዘ የሸክላ እንስራ።”
    reason: κεράμιον የሚለው ቃል ከሸክላ የተሠራ ዕቃን ሊያመለክት ስለሚችል የቃላት አማራጩ ተጠብቋል።
lexical_decisions:
- source_word: ἀποστέλλει
  choice: ላከ
  rationale: የግሪኩ ታሪካዊ አሁን ጊዜ በአማርኛ ትረካ በተፈጥሯዊ ሁኔታ በአለፈ ጊዜ ተገልጿል፤ ይህም የድርጊቱን ትርጉም ሳይለውጥ ንባቡን ያቀልላል።
- source_word: δύο τῶν μαθητῶν αὐτοῦ
  choice: ከደቀ መዛሙርቱ ሁለቱን
  rationale: የክፍል አመልካቹን የግሪክ አወቃቀር ‘ከ… ሁለቱን’ በሚል ግልጽ አማርኛ ያስተላልፋል።
- source_word: λέγει αὐτοῖς
  choice: እንዲህ አላቸው
  rationale: የንግግር መግቢያውን በተፈጥሯዊና በክብር የተሞላ ዘመናዊ አማርኛ ይገልጣል።
- source_word: Ὑπάγετε εἰς τὴν πόλιν
  choice: ወደ ከተማው ግቡ
  rationale: εἰς ወደ ውስጥ የሚደረግን እንቅስቃሴ ስለሚያመለክት ‘ግቡ’ የሚለው ከ‘ሂዱ’ ይልቅ ይህን ስሜት በግልጽ ያሳያል።
- source_word: ἀπαντήσει ὑμῖν
  choice: ያገኛችኋል
  rationale: በዐውዱ ውስጥ ያለውን የወደፊት ጊዜ ግንኙነት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἄνθρωπος
  choice: አንድ ሰው
  rationale: በዚህ ዐውድ የተወሰነ ወንድ ግለሰብን ያመለክታል፤ ‘አንድ ሰው’ በአማርኛ ተፈጥሯዊ ነው።
- source_word: κεράμιον ὕδατος
  choice: የውሃ እንስራ
  rationale: ‘እንስራ’ ውሃ ለመሸከም የሚያገለግል የሸክላ ዕቃን በተፈጥሯዊና ባህላዊ አማርኛ ይገልጣል፤ የዕቃው ከሸክላ መሆን በግሪኩ ሊጠቆም ስለሚችል በማስታወሻ ተጠቅሷል።
- source_word: βαστάζων
  choice: የተሸከመ
  rationale: ሰውየው በዚያ ጊዜ ዕቃውን ይዞ መሄዱን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἀκολουθήσατε αὐτῷ
  choice: እሱን ተከተሉት
  rationale: የቀጥታ ትእዛዙን ኃይልና የመከተልን ድርጊት ግልጽ አድርጎ ያስተላልፋል።
