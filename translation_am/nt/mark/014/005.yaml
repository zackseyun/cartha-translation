base_translation:
  language: en
  yaml_path: translation/nt/mark/014/005.yaml
  text: For this perfume could have been sold for more than three hundred denarii and given to the poor.” And they scolded her[a][b].
translation:
  language: am
  text: “ይህ ሽቶ[a] ከሦስት መቶ ዲናር በላይ ተሽጦ ለድሆች ሊሰጥ ይችል ነበርና።” ብለውም አጥብቀው ገሠጿት[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ሽቱ ቅባት” ወይም “ጥሩ መዓዛ ያለው ዘይት።”
    reason: lexical_alternative
  - marker: b
    text: ወይም “በጥብቅ ወቀሷት።” የግሪኩ ግስ ኃይለኛ ቅሬታን ወይም ጥብቅ ወቀሳን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: μύρον
  choice: ሽቶ
  rationale: በዚህ ዐውድ μύρον ጥሩ መዓዛ ያለውን ውድ ቅባት ወይም ዘይት ያመለክታል፤ ‘ሽቶ’ በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: ἠδύνατο ... πραθῆναι
  choice: ተሽጦ ... ሊሰጥ ይችል ነበር
  rationale: ያልተፈጸመን ያለፈ ጊዜ አማራጭ ድርጊት በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἐπάνω δηναρίων τριακοσίων
  choice: ከሦስት መቶ ዲናር በላይ
  rationale: ἐπάνω ከገንዘብ መጠን ጋር ‘ከ...በላይ’ የሚል ትርጉም አለው፤ ዲናር የታሪኩን የገንዘብ መለኪያ እንዳለ ይጠብቃል።
- source_word: δοθῆναι τοῖς πτωχοῖς
  choice: ለድሆች ሊሰጥ
  rationale: πτωχοῖς ድሆችን እንደ ማኅበራዊ ቡድን ያመለክታል፤ አጭርና ግልጽ አተረጓጎም ነው።
- source_word: ἐνεβριμῶντο αὐτῇ
  choice: አጥብቀው ገሠጿት
  rationale: ግሡ ኃይለኛ ቅሬታንና ጥብቅ የቃል ወቀሳን ያመለክታል፤ ‘አጥብቀው’ የግሡን ኃይል ያሳያል።
- source_word: γὰρ
  choice: ነበርና
  rationale: γάρ ለቀደመው ቅሬታ ምክንያት ይሰጣል፤ የአማርኛው ‘-ና’ ይህን ምክንያታዊ ግንኙነት በተፈጥሯዊ ሁኔታ ያሳያል።
