base_translation:
  language: en
  yaml_path: translation/nt/mark/014/072.yaml
  text: And immediately a rooster crowed a second time. And Peter remembered the word[a], how Jesus had said to him, “Before a rooster crows twice, you will deny me three times.” And breaking down, he wept.
translation:
  language: am
  text: ወዲያውም ዶሮ ለሁለተኛ ጊዜ ጮኸ። ጴጥሮስም ኢየሱስ፣ “ዶሮ ሁለት ጊዜ ከመጮኹ በፊት ሦስት ጊዜ ትክደኛለህ” ብሎ የነገረውን ቃል አስታወሰ። ይህንም አስቦ አለቀሰ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ይህንም አስቦ” የሚለው የግሪኩ ἐπιβαλών ቃል አስቸጋሪ ነው። “ልቡ ተሰብሮ አለቀሰ” ወይም አንድ ውጫዊ የአካል እንቅስቃሴ አድርጎ አለቀሰ ተብሎም ይረዳል።
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: ወዲያውም
  rationale: የማርቆስን ፈጣን የትረካ እንቅስቃሴ የሚጠብቅ ተፈጥሯዊ የጊዜ ተውሳክ ነው።
- source_word: ἐκ δευτέρου
  choice: ለሁለተኛ ጊዜ
  rationale: ግልጽ የሆነውን ተራ ቁጥር በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἀλέκτωρ ἐφώνησεν
  choice: ዶሮው … ጮኸ
  rationale: ለዶሮ ድምፅ በዘመናዊ አማርኛ የተለመደው አገላለጽ ነው፤ በትረካውም ቀደም ብሎ የተጠበቀውን ድርጊት ስለሚያመለክት የወሰን አመልካቹ ተፈጥሯዊ ነው።
- source_word: ἀνεμνήσθη
  choice: አስታወሰ
  rationale: በዚህ ዐውድ የግሡን ቀጥተኛና ተፈጥሯዊ ትርጉም ይሰጣል።
- source_word: τὸ ῥῆμα
  choice: ቃል
  rationale: ῥῆμα የሚያመለክተውን ንግግር በአጭርና በክብር የሚያቀርብ ሲሆን፣ የቃሉ ይዘት በሚከተለው ጥቅስ ይገለጣል።
- source_word: ὡς εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: ኢየሱስ … ብሎ የነገረውን
  rationale: ቀድሞ የተነገረውን ቃል ጴጥሮስ እንዳስታወሰ በተፈጥሯዊ የአማርኛ የተዘዋዋሪ ንግግር አወቃቀር ያሳያል።
- source_word: Πρὶν ἀλέκτορα φωνῆσαι δὶς
  choice: ዶሮ ሁለት ጊዜ ከመጮኹ በፊት
  rationale: የπρίν ጊዜያዊ ግንኙነትንና δὶς የሚለውን ግልጽ ቁጥር ይጠብቃል።
- source_word: τρίς με ἀπαρνήσῃ
  choice: ሦስት ጊዜ ትክደኛለህ
  rationale: ἀπαρνέομαι ያለውን የግል ግንኙነት ኃይል በቀጥተኛና በተለመደ የአማርኛ ግስ ይገልጣል።
- source_word: ἐπιβαλών
  choice: ልቡም ተሰብሮ
  rationale: አስቸጋሪውን ተሳቢ ግስ እንደ ስሜታዊ መፍረስ በተፈጥሯዊ አማርኛ ያቀርባል፤ ቃሉ ሌሎች አተረጓጎሞችን ሊቀበል ስለሚችል ግልጽነቱ በማስታወሻ ተጠብቋል።
- source_word: ἔκλαιεν
  choice: አለቀሰ
  rationale: ያልተጠናቀቀውን የግሪክ ግስ በአማርኛ ትረካ ውስጥ ተፈጥሯዊና ክብር ባለው ቀላል አለፈ ጊዜ ያቀርባል።
theological_decisions:
- issue: የἐπιβαλών አስቸጋሪ ትርጉም
  choice: “ልቡም ተሰብሮ” ተብሎ እንደ ስሜታዊ መፍረስ ተተርጉሟል።
  alternative: “ነገሩን ባሰበው ጊዜ” ወይም እንደ ራስን መሸፈን ያለ ውጫዊ እንቅስቃሴ።
  rationale: ጉዳዩ በዋናነት የቃልና የአገባብ እንጂ የዶክትሪን አይደለም፤ ሆኖም የጴጥሮስን ምላሽ አቀራረብ ይነካል። ዋናው ጽሑፍ የስሜቱን ኃይል ያቆያል፣ ግሪኩ በግልጽ የማያስገድደውን የአካል እንቅስቃሴ ግን አያስገባም፤ አሻሚነቱ በማስታወሻ ተገልጧል።
