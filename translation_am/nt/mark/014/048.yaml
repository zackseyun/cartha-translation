review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies Jesus as the speaker, preserves the armed-arrest setting, and renders λῃστής as ወንበዴ with an appropriate lexical note. However, its final wording, «...መጣችሁን?», is not a well-formed direct question in this context, and it weakens the explicit aorist ἐξήλθατε (“you came/went out”).
  naturalness: The revised sentence uses a natural modern Amharic rhetorical-question construction. It avoids the awkward repetition and mismatched movement verbs in the draft while retaining the Greek image of an armed party going out to make an arrest.
  terminology: ኢየሱስ, ወንበዴ, ሰይፍ, and ዱላ are suitable. The footnote appropriately explains that λῃστής may refer to more than an ordinary thief, including a violent bandit or insurgent/rebel.
  issues:
  - severity: medium
    issue: The draft ends the direct question with «መጣችሁን?»
    rationale: -ን in this form does not naturally mark a direct rhetorical question. The Greek asks directly whether they came out armed to seize him; «ወጣችሁ?» renders this clearly and retains ἐξήλθατε.
  - severity: medium
    issue: The draft divides the comparison and purpose as «ወንበዴ ለመያዝ እንደምትወጡ፣ እኔን ለመያዝ ... መጣችሁን?»
    rationale: This produces an awkward combination of generic “go out” and then “came,” and the second purpose phrase is separated unnaturally from the armed action. A single rhetorical question with «ወጣችሁ» better represents the source syntax and sense.
  revised_text: ኢየሱስም መልሶ እንዲህ አላቸው፤ “ወንበዴን[a] ለመያዝ እንደሚወጡ ሰይፍና ዱላ ይዛችሁ እኔን ለመያዝ ወጣችሁ?”
