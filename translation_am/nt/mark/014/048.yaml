- from: ኢየሱስም መልሶ እንዲህ አላቸው፤ “ወንበዴ[a] ለመያዝ እንደምትወጡ፣ እኔን ለመያዝ ሰይፍና ዱላ ይዛችሁ መጣችሁን?”
  to: ኢየሱስም መልሶ እንዲህ አላቸው፤ “ወንበዴን[a] ለመያዝ እንደሚወጡ ሰይፍና ዱላ ይዛችሁ እኔን ለመያዝ ወጣችሁ?”
  rationale: The revision restores a grammatical direct question and renders ἐξήλθατε with «ወጣችሁ». It keeps the source’s comparison—treating Jesus as one would an armed, dangerous criminal—and its purpose clause, “to arrest me,” without adding interpretive content. The lexical footnote continues to preserve the broader historical range of λῃστής.
