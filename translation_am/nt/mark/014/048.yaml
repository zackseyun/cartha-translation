source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ὡς ἐπὶ λῃστὴν ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων συλλαβεῖν με;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/048.yaml
  text: And Jesus answered and said to them[a], “Have you come out as against a robber, with swords and clubs, to arrest me?”
translation:
  language: am
  text: ኢየሱስም መልሶ እንዲህ አላቸው፤ “ወንበዴን[a] ለመያዝ እንደሚወጡ ሰይፍና ዱላ ይዛችሁ እኔን ለመያዝ ወጣችሁ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ሽፍታ” ወይም “ዓመፀኛ።” የግሪኩ λῃστής ቃል ተራ ሌባን ብቻ ሳይሆን ጉልበተኛ ዘራፊን ወይም ዓመፀኛንም ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: መልሶ እንዲህ አላቸው
  rationale: የግሪኩን የንግግር መግቢያ ቀመር በተፈጥሯዊና ክብር ባለው ዘመናዊ አማርኛ ያቀርባል፤ ሁለቱንም ግሶች በማንጸባረቅ አላስፈላጊ ድግግሞሽ አይፈጥርም።
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: ወንበዴ ለመያዝ እንደምትወጡ
  rationale: ὡς ἐπί የሚያሳየውን ‘እንደ ... ላይ’ የመዝመት ወይም የመውጣት ንጽጽር በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: λῃστὴν
  choice: ወንበዴ
  rationale: ቃሉ ቀላል ሌባን ብቻ ሳይሆን ጉልበተኛ ዘራፊን፣ ሽፍታን ወይም ዓመፀኛን ሊያመለክት ይችላል፤ ‘ወንበዴ’ ዋናውን አደገኛ ወንጀለኛ ፍቺ ያስተላልፋል።
- source_word: ἐξήλθατε
  choice: መጣችሁን?
  rationale: ተናጋሪው ባለበት ስፍራ ወደ እርሱ የመጡትን ቡድን ስለሚናገር፣ ‘መጣችሁ’ በአማርኛ ተፈጥሯዊ ነው፤ የ‘መውጣት’ ምስሉ በንጽጽሩ ‘እንደምትወጡ’ ውስጥ ተጠብቋል።
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: ሰይፍና ዱላ ይዛችሁ
  rationale: μάχαιρα በዚህ አውድ ‘ሰይፍ’ ተብሎ በተፈጥሮ ይተረጎማል፤ ξύλα ደግሞ እንደ መሣሪያ የተያዙ እንጨቶች ስለሆኑ ‘ዱላ’ ዓላማቸውን በግልጽ ያሳያል።
- source_word: συλλαβεῖν με
  choice: እኔን ለመያዝ
  rationale: συλλαμβάνω በዚህ የእስር አውድ ‘መያዝ’ ማለት ነው፤ ‘እኔን’ የግሪኩን ተጽዕኖ ይጠብቃል።
theological_decisions:
- issue: በλῃστής ውስጥ ያለው የወንጀለኛና የዓመፀኛ ትርጉም ስፋት
  choice: በዋናው ጽሑፍ ‘ወንበዴ’፣ ሰፊው የ‘ሽፍታ/ዓመፀኛ’ ፍቺ በማስታወሻ
  alternative: ሽፍታ፣ ዓመፀኛ
  rationale: ጥቅሱ ኢየሱስን በጦር መሣሪያ ሊያዙት የመጡትን ሰዎች አያያዝ ይተቻል። አንድን ብቻ በመምረጥ ታሪካዊውን ፍቺ እንዳይጠብ፣ ዋናው ቃል በጽሑፍ ተቀምጦ ሌሎቹ በማስታወሻ ተጠብቀዋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። የጥያቄው ወቀሳዊ ኃይልና የግሪኩ ንጽጽር ተጠብቀዋል።
