  text: ἀλλὰ μετὰ τὸ ἐγερθῆναί με προάξω ὑμᾶς εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/028.yaml
  text: But after I am raised[a], I will go ahead of you into Galilee.
translation:
  language: am
  text: ነገር ግን በተነሣሁ[a] በኋላ፣ ከእናንተ ቀድሜ ወደ ገሊላ እሄዳለሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከተነሣሁ በኋላ።” በግሪክኛው ያለው ግስ ተደራጊ ቅርጽ ሲሆን፣ ስለ ትንሣኤ የተለመደ አገላለጽ ነው።
    reason: የግሪክኛውን ተደራጊ ቅርጽ እና በአማርኛ ሊገለጽ የሚችለውን ተለዋጭ አገላለጽ ለማሳወቅ።
lexical_decisions:
- source_word: ἀλλὰ
  choice: ነገር ግን
  rationale: ከዚህ በፊት ከተነገረው የደቀ መዛሙርቱ መበተን ጋር ያለውን ንፅፅር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: μετὰ τὸ ἐγερθῆναί με
  choice: ከሞት ከተነሣሁ በኋላ
  rationale: μετά ከተውሳከ ግስ ጋር የሚገልጸውን የጊዜ ቅደም ተከተል ይጠብቃል፤ ‘ከሞት’ የሚለውም በዐውደ ንባቡ ያለውን የትንሣኤ ትርጉም በግልጽ እና በተለመደ አማርኛ ያቀርባል።
- source_word: ἐγερθῆναί
  choice: ከተነሣሁ
  rationale: የግሪክኛውን ተደራጊ ቅርጽና የትንሣኤ አገላለጽ በተቻለ መጠን የሚጠብቅ ተፈጥሯዊ የአማርኛ አቻ ነው።
- source_word: προάξω ὑμᾶς
  choice: ከእናንተ ቀድሜ … እሄዳለሁ
  rationale: ኢየሱስ ከደቀ መዛሙርቱ በፊት ወደተጠቀሰው ስፍራ እንደሚሄድ በዘመናዊና ግልጽ አማርኛ ይገልጻል፤ ‘እናንተ’ የብዙ ቁጥር መሆኑንም ይጠብቃል።
- source_word: εἰς τὴν Γαλιλαίαν
  choice: ወደ ገሊላ
  rationale: εἰς የሚያመለክተውን ወደ መድረሻ የሚደረግ እንቅስቃሴ በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: ἐγερθῆναί με የሚለው የትንሣኤ አገላለጽ
  choice: ከሞት ከተነሣሁ
  alternative: ከሞት ከተነሣሁ በኋላ / ከሞት በተነሣሁ ጊዜ
  rationale: የግሪክኛውን ተደራጊ አገላለጽ ያለ አስፈላጊ ትርጓሜ በተቻለ መጠን ይጠብቃል፤ በተመሳሳይም ጊዜ በአማርኛ የተለመደውን የትንሣኤ አነጋገር ይጠቀማል። ድርጊቱን ፈጻሚ በግልጽ በመጨመር ጽሑፉ ያልተናገረውን አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ከእናንተ ቀድሜ … እሄዳለሁ’ ከባህላዊው ‘እቀድማችኋለሁ’ ይልቅ የእንቅስቃሴውን ትርጉም በግልጽ ያሳያል።
