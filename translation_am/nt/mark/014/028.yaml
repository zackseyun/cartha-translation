review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the adversative, temporal sequence, future movement ahead of the disciples, plural object, and destination. However, «ከተነሣሁ» is formally active/intransitive in Amharic, whereas ἐγερθῆναί is passive. The added «ከሞት» is contextually understandable but is not expressed in this clause of the Greek source.
  naturalness: «በተነሣሁ በኋላ» is clear, idiomatic modern standard Amharic and preserves the source’s passive wording. «ከእናንተ ቀድሜ ... እሄዳለሁ» is natural and accurately conveys προάξω ὑμᾶς.
  terminology: «በተነሣሁ» appropriately retains the passive resurrection expression without specifying an unstated agent. «ገሊላ» is the standard Amharic form of Galilee.
  issues:
  - severity: medium
    issue: The main text uses the active/intransitive form «ከተነሣሁ», while the source has a passive infinitive and the footnote claims that the translation reflects that passive form.
    rationale: Replacing it with «በተነሣሁ» preserves the passive sense of ἐγερθῆναί and aligns the text with its footnote.
  - severity: low
    issue: «ከሞት» adds wording not present in the Greek clause.
    rationale: The resurrection context makes the addition understandable, but omitting it follows the source wording more closely while the footnote can identify this as a customary resurrection expression.
  revised_text: ነገር ግን በተነሣሁ[a] በኋላ፣ ከእናንተ ቀድሜ ወደ ገሊላ እሄዳለሁ።
