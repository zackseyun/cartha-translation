  text: ὁ δὲ ἐσιώπα καὶ ⸂οὐκ ἀπεκρίνατο οὐδέν⸃. πάλιν ὁ ἀρχιερεὺς ἐπηρώτα αὐτὸν καὶ λέγει αὐτῷ· Σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ εὐλογητοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/061.yaml
  text: But he kept silent and answered nothing[a]. Again the high priest questioned him and says to him, “Are you the Messiah[b], the Son of the Blessed One?”
translation:
  language: am
  text: እርሱ ግን ዝም ብሎ ቆየ፤ ምንም አልመለሰም። ሊቀ ካህናቱም እንደገና ጠየቀውና፣ “አንተ መሲሑ[a]፣ የተባረከው[b] ልጅ ነህን?” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ክርስቶስ።” የግሪኩ Χριστός (ክርስቶስ) እዚህ በአይሁድ የመሲሕ ዐውድ ውስጥ እንደ ማዕረግ ስለሚሠራ፣ “መሲሕ” ተብሎ ተተርጉሟል።
    reason: alternative_reading
  - marker: b
    text: “የተባረከው” እግዚአብሔርን በአክብሮት ለመጥቀስ የሚያገለግል የአይሁድ አገላለጽ ነው።
    reason: cultural_note
lexical_decisions:
- source_word: ἐσιώπα
  choice: ዝም አለ
  rationale: የግሱ ያልተፈጸመ ጊዜ ቅርጽ የቀጠለውን ዝምታ ያሳያል፤ በአማርኛ ዐውድ ውስጥ “ዝም አለ” ተፈጥሯዊ ሆኖ ይህን ሁኔታ ይገልጣል።
- source_word: ἀπεκρίνατο οὐδέν
  choice: ምንም አልመለሰም
  rationale: οὐδέν የመልሱን ፈጽሞ አለመኖር ያጎላል፤ “ምንም አልመለሰም” ይህን በግልጽና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: πάλιν
  choice: እንደገና
  rationale: ሊቀ ካህናቱ ጥያቄውን መድገሙን በግልጽ ያሳያል።
- source_word: ἀρχιερεὺς
  choice: ሊቀ ካህናቱ
  rationale: በዚህ የአይሁድ ፍርድ ዐውድ ለከፍተኛው የክህነት ሹመት የተለመደና ትክክለኛ አገላለጽ ነው።
- source_word: ἐπηρώτα
  choice: ጠየቀው
  rationale: የጥያቄውን የፍርድ ቤት ዐውድ ሳያጋንን በተፈጥሯዊ አማርኛ ይገልጣል፤ “እንደገና” ደግሞ ድግግሞሹን ይጠብቃል።
- source_word: λέγει
  choice: አለው
  rationale: በግሪክ ያለው ታሪካዊ የአሁን ጊዜ ቅርጽ የማርቆስ ትረካዊ ልማድ ቢሆንም፣ በዘመናዊ አማርኛ “አለው” የትረካውን ፍሰት በተፈጥሯዊነት ይጠብቃል።
- source_word: χριστός
  choice: መሲሑ
  rationale: በአይሁድ የመሲሕ ተስፋና በፍርድ ዐውዱ ውስጥ ቃሉ እንደ ማዕረግ ስለሚሠራ፣ “መሲሑ” የዕብራዊውን የተቀባ ንጉሥ ጽንሰ ሐሳብ በቀጥታ ያስተላልፋል።
- source_word: ὁ υἱὸς τοῦ εὐλογητοῦ
  choice: የቡሩኩ ልጅ
  rationale: “ቡሩኩ” ለእግዚአብሔር በአክብሮት የተጠቀመውን የአይሁድ ዙሪያ አገላለጽ ይጠብቃል፤ በዋናው ጽሑፍ “እግዚአብሔር” ብሎ በመተካት የምንጩን ተዘዋዋሪነት አያጠፋም።
theological_decisions:
- issue: χριστόςን እንደ ቀጥተኛ የመሲሕ ማዕረግ መተርጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: ቃሉ እዚህ እንደ ስም ሳይሆን በአይሁድ የፍርድ ዐውድ ውስጥ እንደ ማዕረግ ይሠራል፤ “መሲሑ” ይህን ተግባር በግልጽ ያሳያል።
- issue: τοῦ εὐλογητοῦ የሚለውን የአክብሮት አገላለጽ መጠበቅ
  choice: የቡሩኩ
  alternative: የእግዚአብሔር
  rationale: ግሪኩ እግዚአብሔርን በቀጥታ ሳይጠራ “ቡሩኩ” የሚል የአክብሮት መጠሪያ ይጠቀማል፤ ይህን መጠበቅ የአይሁድን ባህላዊና ሥነ መለኮታዊ ዐውድ አያደበዝዝም።
