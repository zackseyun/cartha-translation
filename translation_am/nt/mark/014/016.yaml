- from: ደቀ መዛሙርቱም ወጥተው ወደ ከተማይቱ ገቡ፤ እርሱም እንደነገራቸው ሆኖ አገኙት። ፋሲካውንም[a] አዘጋጁ።
  to: ደቀ መዛሙርቱም ወጥተው ወደ ከተማይቱ ገቡ፤ እርሱ እንደነገራቸውም አገኙ፤ ፋሲካውንም[a] አዘጋጁ።
  rationale: The revision removes the unnatural “ሆኖ አገኙት” and the misleading additive “-ም” attached to “እርሱ.” “እርሱ እንደነገራቸውም አገኙ” naturally retains the disciples as the continuing subject, leaves the object implicit as in Greek, and preserves the correspondence expressed by καθὼς.
