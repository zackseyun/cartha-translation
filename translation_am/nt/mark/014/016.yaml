base_translation:
  language: en
  yaml_path: translation/nt/mark/014/016.yaml
  text: And the disciples went out and came into the city[a], and found it just as he had told them, and they prepared the Passover.
translation:
  language: am
  text: ደቀ መዛሙርቱም ወጥተው ወደ ከተማይቱ ገቡ፤ እርሱ እንደነገራቸውም አገኙ፤ ፋሲካውንም[a] አዘጋጁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የፋሲካውን ምግብ።” የግሪኩ ቃል τὸ πάσχα ፋሲካን በአጠቃላይ ወይም በዚህ አውድ እየተዘጋጀ ያለውን የፋሲካ ምግብ ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: ወጥተው
  rationale: ከነበሩበት ቦታ መነሣታቸውን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: οἱ μαθηταί
  choice: ደቀ መዛሙርቱ
  rationale: በወንጌላት የኢየሱስን ተከታዮችና ተማሪዎች የሚያመለክተውን የተለመደ መጽሐፍ ቅዱሳዊ ቃል ይጠብቃል።
- source_word: ἦλθον εἰς τὴν πόλιν
  choice: ወደ ከተማይቱ ገቡ
  rationale: ወደ ከተማው ውስጥ መድረሳቸውን በዘመናዊና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: εὗρον καθὼς εἶπεν αὐτοῖς
  choice: እርሱም እንደነገራቸው ሆኖ አገኙት
  rationale: የግሱ ቀጥተኛ ተሳቢ በግሪኩ ያልተገለጸ መሆኑን ሳያጠብ፣ ሁኔታው ኢየሱስ ቀድሞ እንደነገራቸው ሆኖ መገኘቱን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἡτοίμασαν
  choice: አዘጋጁ
  rationale: ለበዓሉና ለምግቡ አስፈላጊውን ማሰናዳት በግልጽ ሁኔታ ይገልጣል።
- source_word: τὸ πάσχα
  choice: ፋሲካውን
  rationale: የግሪኩን ሰፊ ትርጉም ይጠብቃል፤ በዚህ አውድ ግን በተለይ የፋሲካን ምግብ ሊያመለክት ይችላል።
