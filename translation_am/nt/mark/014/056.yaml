  text: πολλοὶ γὰρ ἐψευδομαρτύρουν κατ’ αὐτοῦ, καὶ ἴσαι αἱ μαρτυρίαι οὐκ ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/056.yaml
  text: For many were giving false testimony against him[a], and their testimonies were not consistent.
translation:
  language: am
  text: ብዙዎች በእርሱ ላይ በሐሰት ይመሰክሩ ነበርና፤ ምስክርነቶቻቸውም እርስ በርሳቸው አይስማሙም ነበር።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “ብዙዎች በእርሱ ላይ የሐሰት ምስክርነት ይሰጡ ነበር፤ ምስክርነቶቻቸውም አይጣጣሙም ነበር።” በቃል በቃል፣ የመጨረሻው አገላለጽ “እኩል አልነበሩም” ማለት ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: ብዙዎች
  rationale: ቅጽሉ በስም ፋንታ ተጠቅሞ ብዙ ሰዎችን ያመለክታል፤ ‘ምስክሮች’ የሚለው ከግሱ ቢገባም በግልጽ ስላልተጻፈ አልተጨመረም።
- source_word: γὰρ
  choice: ነበርና
  rationale: γάρ የቀደመውን ትረካ የሚያብራራ ምክንያታዊ ግንኙነት አለው፤ በአማርኛ ‘-ና’ ይህን ግንኙነት በተፈጥሮ ያሳያል።
- source_word: ἐψευδομαρτύρουν
  choice: በሐሰት ይመሰክሩ ነበር
  rationale: ያልተፈጸመው የግስ ቅርጽ በዚያ ጊዜ የቀጠለውን ወይም የተደጋገመውን ድርጊት ያሳያል፤ ይህ አገላለጽ የፍርድ ሂደቱንም ትርጉም ይጠብቃል።
- source_word: κατ’ αὐτοῦ
  choice: በእርሱ ላይ
  rationale: በዚህ የፍርድ አውድ κατά ከባለቤት አገናዛቢ ጋር በኢየሱስ ላይ የተቃጣ ምስክርነትን ያመለክታል።
- source_word: ἴσαι
  choice: አንድ
  rationale: ቃሉ በቀጥታ ‘እኩል’ ማለት ቢሆንም፣ ምስክርነቶችን ሲገልጽ እርስ በርሳቸው መስማማታቸውን ወይም አንድ መሆናቸውን ያመለክታል።
- source_word: αἱ μαρτυρίαι
  choice: ምስክርነቶቻቸው
  rationale: መስተዋድዱ ቀደም ሲል የተጠቀሱትን ሰዎች ምስክርነት ያመለክታል፤ የባለቤትነት ቅጥያው ይህን በተፈጥሮ ግልጽ ያደርጋል።
- source_word: οὐκ ἦσαν
  choice: አልነበሩም
  rationale: የ‘መሆን’ ግስ ቀላል አሉታዊ ያልተፈጸመ ቅርጽ ነው፤ ከ‘አንድ’ ጋር ሆኖ ምስክርነቶቹ እንዳልተስማሙ ያሳያል።
