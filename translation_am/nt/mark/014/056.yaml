  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ የፍርድ አውድ ቋንቋ ተጠቅሟል። ‘ይመሰክሩ ነበር’ የግሪኩን ቀጣይ/ተደጋጋሚ ገጽታ ይጠብቃል፤ ‘አንድ አልነበሩም’ ደግሞ ἴσαι የሚያመለክተውን አለመስማማት በተፈጥሯዊ አማርኛ ያቀርባል።
