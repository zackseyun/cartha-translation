  rationale: εὐχαριστέω በቀጥታ ማመስገንን ያመለክታል። ክፍሉ በኋለኛው የክርስቲያን የቁርባን ሥርዓት ውስጥ ትልቅ ስፍራ ቢኖረውም፣ ትርጉሙ ግሪኩ ያልገለጸውን ልዩ ሥርዓተ አምልኮያዊ ቃል አያስገባም።
- issue: ποτήριον የተወሰነ ጽዋ ወይስ አንድ ጽዋ መሆኑ
  choice: ጽዋም
  alternative: ጽዋውንም፤ አንድ ጽዋም
  rationale: የግሪኩ ስም መስተዋድድ የለውም፣ የምግቡ አውድ ግን የተለየ ጽዋ ሊያመለክት ይችላል። አማርኛው ባዶ ስም ይህን አሻሚነት ከእግር ማስታወሻው ጋር ይጠብቃል።
