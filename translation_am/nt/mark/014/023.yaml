  yaml_path: translation/nt/mark/014/023.yaml
  text: And taking a cup[a], after giving thanks he gave it to them, and they all drank from it.
translation:
  language: am
  text: ጽዋ ወስዶ አመስግኖ ሰጣቸው፤ ሁሉም ከእርሱ ጠጡ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβὼν
  choice: ወስዶ
  rationale: የግሪኩን የቅድሚያ ተግባር በተፈጥሯዊ የአማርኛ አገባብ ያሳያል፤ ዋናውን ግስ የሚያዘጋጅ ተያያዥ ግስ ሆኖ ተተርጉሟል።
- source_word: ποτήριον
  choice: ጽዋም
  rationale: ποτήριον ያለ መስተዋድድ ቀርቧል። አማርኛ ያልተወሰነ መስተዋድድ ስለሌለው ባዶውን ‘ጽዋ’ በቀጥታ ማቅረብ ተፈጥሯዊ ነው፤ -ም ደግሞ ከቀደመው የእንጀራ ተግባር ጋር ‘ደግሞ’ የሚለውን ትስስር ያሳያል።
- source_word: εὐχαριστήσας
  choice: ካመሰገነ በኋላ
  rationale: ምስጋና መስጠትንና ድርጊቱ ከ‘ሰጣቸው’ በፊት መፈጸሙን ግልጽ ያደርጋል፤ ከግሪኩ በላይ ሥርዓተ አምልኮያዊ ቃል አያስገባም።
- source_word: ἔδωκεν αὐτοῖς
  choice: ሰጣቸው
  rationale: የአማርኛው የተዋሐደ ተሳቢ ቅጥያ ለ‘እነርሱ ሰጠ’ ተፈጥሯዊና ግልጽ አቻ ነው፤ የተሰጠው ጽዋ መሆኑ ከቅርብ አውዱ ይታወቃል።
- source_word: ἔπιον
  choice: ጠጡ
  rationale: የተፈጸመውን የመጠጣት ድርጊት በቀጥታና በዘመናዊ አማርኛ ይገልጣል።
- source_word: ἐξ αὐτοῦ
  choice: ከእርሱ
  rationale: የተውላጠ ስሙ መወከሻ ጽዋው ነው። በአማርኛ ‘ጽዋ’ በወንድ ፆታ ስለሚወሰድ ‘ከእርሱ’ ተፈጥሯዊ ነው፤ ሰውን እንደሚያመለክት መወሰድ የለበትም።
- source_word: πάντες
  choice: ሁሉም
  rationale: እያንዳንዳቸው መጠጣታቸውን አጽንዖት ሰጥቶ በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: የεὐχαριστήσας ቁርባናዊ ወይም ሥርዓተ አምልኮያዊ ፍንጭ
  choice: ካመሰገነ በኋላ
