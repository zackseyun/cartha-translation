  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: πάντοτε γὰρ τοὺς πτωχοὺς ἔχετε μεθ’ ἑαυτῶν, καὶ ὅταν θέλητε δύνασθε ⸀αὐτοῖς εὖ ποιῆσαι, ἐμὲ δὲ οὐ πάντοτε ἔχετε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/007.yaml
  text: For you always have the poor with you[a], and whenever you want, you are able to do good to them; but you do not always have me.
translation:
  language: am
  text: ድሆችን ሁልጊዜ ከእናንተ ጋር አሏችሁና፣ በፈለጋችሁም ጊዜ መልካም ልታደርጉላቸው[a] ትችላላችሁ፤ እኔ ግን ሁልጊዜ ከእናንተ ጋር የለሁም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ልትጠቅሟቸው»። የግሪኩ አነጋገር ለእነርሱ የሚጠቅም ነገር ማድረግን ያመለክታል እንጂ በጎ ስሜት መሰማትን ብቻ አይደለም።
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: ሁልጊዜ
  rationale: በሁለቱም ንጽጽራዊ ሐረጎች ያለውን የቀጣይ መገኘት ሐሳብ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: γὰρ
  choice: -ና
  rationale: ሐረጉ ቀዳሚውን ንግግር እንደሚያብራራ በአማርኛ ተፈጥሯዊ በሆነ አያያዥ ቅጥያ ያሳያል።
- source_word: πτωχούς
  choice: ድሆች
  rationale: ገንዘብና መተዳደሪያ የጎደላቸውን ሰዎች በግልጽና የተለመደ ቃል ይጠቅሳል።
- source_word: ἔχετε μεθ’ ἑαυτῶν
  choice: ከእናንተ ጋር አሏችሁ
  rationale: የግሪኩን ‘ከእናንተ ጋር አሏችሁ’ የሚል የመገኘትና የተደራሽነት ሐሳብ በቅርብ ይጠብቃል።
- source_word: ὅταν θέλητε
  choice: በፈለጋችሁም ጊዜ
  rationale: ያልተወሰነውን ጊዜያዊ ሁኔታ፣ ‘በፈለጋችሁ በማንኛውም ጊዜ’ የሚለውን ሐሳብ ይጠብቃል።
- source_word: δύνασθε
  choice: ትችላላችሁ
  rationale: የችሎታንና የተከፈተ አጋጣሚን ትርጉም በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: αὐτοῖς εὖ ποιῆσαι
  choice: መልካም ልታደርጉላቸው
  rationale: ለድሆች የሚጠቅም ተግባር ማድረግን ይገልጻል፤ ሐሳቡን በምጽዋት መስጠት ብቻ አይገድበውም።
- source_word: ἐμὲ δὲ
  choice: እኔ ግን
  rationale: ከድሆች ቀጣይ መገኘት ጋር ያለውን ንጽጽር በግልጽ ያሳያል።
- source_word: οὐ πάντοτε ἔχετε
  choice: ሁልጊዜ ከእናንተ ጋር የለሁም
  rationale: የግሪኩን የአሁን ጊዜ አነጋገርና የቀጣይ አለመገኘት ንጽጽር ሳይቀይር በተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: ኢየሱስ ለድሆች መልካም ማድረግን እንደሚያሳንስ ሊገባ የሚችል ግንዛቤ
  choice: ድሆች ሁልጊዜ ተደራሽ መሆናቸውንና ኢየሱስ ከእነርሱ ጋር ያለበት ጊዜ ውስን መሆኑን የሚያነጻጽር ንባብ
  alternative: ኢየሱስ ለእርሱ መሰጠትን ከድሆች ይልቅ በማስቀደም ለድሆች ያለውን ኃላፊነት ያጣጥላል የሚል ንባብ
  rationale: ‘በፈለጋችሁ ጊዜ መልካም ልታደርጉላቸው ትችላላችሁ’ የሚለው ሐረግ ለድሆች የሚደረገውን በጎ ተግባር ያረጋግጣል። ንጽጽሩ ጊዜያዊና ሁኔታዊ ነው፤ ጽሑፉ ያልተናገረውን ትምህርተ እምነታዊ ድምዳሜ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የአሁን ጊዜ አነጋገርና በሁለቱ ሐረጎች የተደገመው ‘ሁልጊዜ’ ተጠብቀዋል።
