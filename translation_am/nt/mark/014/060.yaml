language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ὁ ἀρχιερεὺς εἰς μέσον ἐπηρώτησεν τὸν Ἰησοῦν λέγων· Οὐκ ἀποκρίνῃ οὐδέν; τί οὗτοί σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/060.yaml
  text: And the high priest stood up in the middle and questioned Jesus[a], saying[c][b], “Do you answer nothing? What are these men testifying against you?”
translation:
  language: am
  text: ሊቀ ካህናቱም ተነሥቶ ወደ መካከል ገባና ኢየሱስን፣ “ምንም አትመልስምን? እነዚህ ሰዎች በአንተ ላይ የሚመሰክሩት ምንድን ነው?” ሲል ጠየቀው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς
  choice: ተነሥቶ
  rationale: የመነሣትን አካላዊ ድርጊትና የትረካውን እንቅስቃሴ በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: ὁ ἀρχιερεὺς
  choice: ሊቀ ካህናቱ
  rationale: በዚህ የፍርድ ትዕይንት የሚመራውን ዋና ካህን የሚያመለክት የተለመደ የአማርኛ አገላለጽ ነው።
- source_word: εἰς μέσον
  choice: በመካከላቸው ቆመና
  rationale: εἰς የሚያሳየውን ወደ መሀል መግባትና በጉባኤው ፊት ማዕከላዊ ቦታ መያዝ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐπηρώτησεν
  choice: ጠየቀው
  rationale: የፍርድ አውዱን ሳያጠናክር የግሪኩን ‘ጠየቀ/መረመረ’ የትርጉም ክልል በቀላልና ግልጽ አማርኛ ይገልጣል።
- source_word: ἀποκρίνῃ οὐδέν
  choice: ምንም አትመልስምን?
  rationale: የግሪኩን ቀጥተኛና ተግዳሮታዊ የንግግር ቃና ይጠብቃል።
- source_word: οὗτοί
  choice: እነዚህ ሰዎች
  rationale: በቦታው ያሉትን ምስክሮች በግልጽ ያመለክታል፤ አማርኛ በዚህ ዓይነት ጠቋሚ ተውላጠ ስም ላይ የግሪኩን ሰዋሰዋዊ ወንድነት በግድ አይገልጥም።
- source_word: καταμαρτυροῦσιν
  choice: በአንተ ላይ የሚመሰክሩት
  rationale: የቀጠለ ምስክርነትንና በአንድ ሰው ላይ የሚቀርብ የፍርድ ምስክርነትን ያስተላልፋል።
theological_decisions:
- issue: የοὗτοί የፆታ ምልክት
  choice: እነዚህ ሰዎች
  alternative: እነዚህ ወንዶች
  rationale: የግሪኩ ቅርጽ ወንድ ብዙ ቁጥር ቢሆንም፣ በአማርኛ ‘እነዚህ ሰዎች’ በቦታው ያሉትን የተወሰኑ ምስክሮች ተፈጥሯዊ በሆነ መንገድ ይጠቁማል፤ ‘ወንዶች’ ማለት የጽሑፉ ትኩረት ያልሆነውን ፆታ ከመጠን በላይ ያጎላል።
- issue: የሊቀ ካህናቱ ቦታ εἰς μέσον
  choice: በመካከላቸው ቆመና
  alternative: ወደ መካከል ገብቶ
  rationale: ሐረጉ ከቦታው ጋር የተያያዘ እንቅስቃሴን ወይም መሀል ቦታ መያዝን ሊጠቁም ይችላል። የተመረጠው አገላለጽ በጉባኤው ፊት ማዕከላዊ ቦታ መያዙን ያሳያል፣ ነገር ግን ከጽሑፉ በላይ የሥርዓት ዝርዝር አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የጥያቄዎቹ አጭርና ተግዳሮታዊ ቃና ተጠብቋል፤ ለዚህ ቁጥር አስፈላጊ የሆነ የግርጌ ማስታወሻ አልተጨመረም።
