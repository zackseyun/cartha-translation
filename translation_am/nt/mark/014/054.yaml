language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ὁ Πέτρος ἀπὸ μακρόθεν ἠκολούθησεν αὐτῷ ἕως ἔσω εἰς τὴν αὐλὴν τοῦ ἀρχιερέως καὶ ἦν συγκαθήμενος μετὰ τῶν ὑπηρετῶν καὶ θερμαινόμενος πρὸς τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/054.yaml
  text: And Peter followed him from a distance[a], as far as inside the courtyard of the high priest. He was sitting with the officers and warming himself by the fire.
translation:
  language: am
  text: ጴጥሮስም ከሩቅ ሆኖ እስከ ሊቀ ካህናቱ ግቢ ውስጥ ድረስ ተከተለው። በዚያም ከአገልጋዮች ጋር ተቀምጦ በእሳቱ[a] እየሞቀ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በብርሃኑ።” የግሪክ ጽሑፉ ቃል በቃል “ወደ ብርሃኑ” ይላል፤ ይህም በግቢው ውስጥ የነበረውን የእሳት ብርሃን የሚያመለክት ይመስላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ μακρόθεν
  choice: በሩቅ ሆኖ
  rationale: የጴጥሮስን ርቀትና ጥንቃቄ በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: ἠκολούθησεν αὐτῷ
  choice: እርሱን ተከተለ
  rationale: የግሪኩን ቀላል ያለፈ ጊዜ ትረካ በቀጥታ ይገልጣል።
- source_word: ἕως ἔσω εἰς τὴν αὐλήν
  choice: እስከ ... ግቢ ውስጥ ድረስም ደረሰ
  rationale: ጴጥሮስ በግቢው ውስጥ ድረስ መግባቱን ያሳያል፤ ወደ ቤቱ ውስጠኛ ክፍል ገባ የሚል ትርጉም አይጨምርም።
- source_word: αὐλήν
  choice: ግቢ
  rationale: በሊቀ ካህናቱ መኖሪያ የነበረውን የታጠረ ውጫዊ ስፍራ በግልጽ አማርኛ ይገልጣል።
- source_word: ἀρχιερέως
  choice: ሊቀ ካህናቱ
  rationale: በወንጌላት የሕማማት ትረካ ውስጥ ለዚህ ማዕረግ የተለመደና ትክክለኛ አገላለጽ ነው።
- source_word: ἦν συγκαθήμενος
  choice: ከ... ጋር ተቀምጦ ... ነበር
  rationale: የቀጠለውን የትዕይንት ሁኔታ እና σύν የሚያመለክተውን አብሮነት ይጠብቃል።
- source_word: μετὰ τῶν ὑπηρετῶν
  choice: ከአገልጋዮቹ ጋር
  rationale: ቃሉ የሚያመለክታቸውን በሊቀ ካህናቱ ሥር የሚያገለግሉ ባለሥራዎች ያለማጥበብ ይገልጣል፤ ‘ጠባቂዎች’ ብሎ ሚናቸውን አይወስንም።
- source_word: θερμαινόμενος
  choice: እየሞቀ ነበር
  rationale: ጴጥሮስ ራሱን ሲያሞቅ የነበረውን ቀጣይ ድርጊት በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: πρὸς τὸ φῶς
  choice: በእሳቱ
  rationale: φῶς በቀጥታ ‘ብርሃን’ ማለት ቢሆንም፣ በዚህ አውድ ሰውነቱን የሚያሞቅበትን እሳትና ብርሃኑን ያመለክታል፤ የቃል በቃል አማራጩ በማስታወሻ ተጠብቋል።
