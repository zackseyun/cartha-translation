    issue: ተዘጋጅቶ ዝግጁ የሆነ
    rationale: 'This renders both ἐστρωμένον and ἕτοιμον with near-synonymous preparation language. The Greek uses two related but distinct descriptions: the room is arranged/laid out and ready. The revision restores this distinction without over-specifying the furnishings.'
