  yaml_path: translation/nt/mark/014/015.yaml
  text: And he himself will show you a large upper room[a], furnished and ready; prepare for us there.
translation:
  language: am
  text: እርሱም ራሱ በላይኛው ፎቅ ያለ ሰፊ፣ የተደረደረና ዝግጁ ክፍል[a] ያሳያችኋል፤ በዚያ ለእኛ አዘጋጁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በላይኛው ፎቅ ያለ ሰፊ፣ ተነጥፎና ዝግጁ ክፍል።” ἐστρωμένον የሚለው ቃል ክፍሉ የቤት ዕቃ ብቻ ያለበት መሆኑን ሳይሆን ተነጥፎ፣ ተደራጅቶ ወይም ተሰናድቶ መኖሩን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: እርሱም ራሱ
  rationale: የተውላጠ ስሙን አጽንዖት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: δείξει
  choice: ያሳያችኋል
  rationale: የወደፊት ጊዜ አመልካች ግስንና ὑμῖν የሚለውን ብዙ ቁጥር ተቀባይ በግሱ ውስጥ ያካትታል።
- source_word: ἀνάγαιον
  choice: በላይኛው ፎቅ ያለውን … ክፍል
  rationale: በቤት የላይኛው ክፍል የሚገኝን ክፍል በግልጽና በዘመናዊ አማርኛ ይገልጻል።
- source_word: μέγα
  choice: ሰፊ
  rationale: ስለ ክፍል መጠን ሲነገር ተፈጥሯዊ የሆነውን ‘ትልቅ/ሰፊ’ ትርጉም ያስተላልፋል።
- source_word: ἐστρωμένον
  choice: ተዘጋጅቶ
  rationale: ቃሉ የተነጠፈ፣ የተደረደረ ወይም ለግብዣ የተሰናዳ መሆንን ሊያመለክት ስለሚችል ያንን ስፋት አያጠብም።
- source_word: ἕτοιμον
  choice: ዝግጁ የሆነ
  rationale: ክፍሉ ለጥቅም ዝግጁ መሆኑን የምንጩን ገለጻ በቀጥታ ይጠብቃል።
- source_word: ἐκεῖ
  choice: በዚያም
  rationale: የቦታውን ማመልከቻ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἑτοιμάσατε
  choice: አዘጋጁ
  rationale: ለብዙ ሰዎች የተሰጠውን ቀጥተኛ ትእዛዝ ይጠብቃል።
- source_word: ἡμῖν
  choice: ለእኛ
  rationale: የብዙ ቁጥር ተጠቃሚውን ያለ ትርጓሜያዊ ማስፋፊያ በቀጥታ ያስተላልፋል።
