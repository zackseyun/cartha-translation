  rationale: ግሪኩ ግስ በመሠረቱ ‘አሳልፎ መስጠት’ ማለት ሲሆን፣ እዚህ ከኢየሱስ ጋር ማዕድ የሚካፈል ባልንጀራ የሚፈጽመውን ክህደት ያመለክታል። ዋናው ጽሑፍ የቃሉን ስፋት ጠብቆ፣ የክህደት አውዱን በማስታወሻ ያብራራል።
