base_translation:
  language: en
  yaml_path: translation/nt/mark/014/018.yaml
  text: And while they were reclining and eating[a], Jesus said, “Truly I tell you[c][b], one of you will betray me—one who is eating with me.”
translation:
  language: am
  text: እነርሱም ተደግፈው[a] እየበሉ ሳሉ፣ ኢየሱስ፣ “እውነት እላችኋለሁ፣[b] ከእናንተ አንዱ፣ ከእኔ ጋር የሚበላው፣ አሳልፎ ይሰጠኛል”[c] አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በዚያ ዘመን በመደበኛ ማዕድ ጊዜ ተደግፎ መብላት የተለመደ ነበር።
    reason: cultural_note
  - marker: b
    text: ቃል በቃል፣ “አሜን፣ እላችኋለሁ።”
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “ይከዳኛል።” የግሪኩ ግስ አሳልፎ መስጠትን፣ ለሌሎች አሳልፎ መስጠትን ወይም መክዳትን ሊያመለክት ይችላል፤ እዚህ ከኢየሱስ ጋር ማዕድ የሚካፈል ሰው በክህደት አሳልፎ ስለሚሰጠው ይናገራል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακειμένων
  choice: ተደግፈው
  rationale: በጥንቱ የመደበኛ ማዕድ ልማድ መሠረት ሰዎች ተደግፈው ይበሉ የነበረውን አቀማመጥ ያሳያል፤ ‘ተቀምጠው’ ከማለት ይልቅ ታሪካዊውን ሁኔታ ይጠብቃል።
- source_word: ἐσθιόντων / ὁ ἐσθίων
  choice: በመብላት ላይ ሳሉ / የሚበላው
  rationale: ቀጥተኛውን ‘መብላት’ ትርጉም ይጠብቃል፤ ὁ ἐσθίων ያለውም መስተዋድዳዊ አገላለጽ ‘የሚበላው’ ተብሎ ቀርቧል።
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: እውነት እላችኋለሁ
  rationale: የኢየሱስን ክብደት ያለው የማረጋገጫ መግቢያ በተፈጥሯዊና በክብር ባለው ዘመናዊ አማርኛ ያቀርባል፤ ቀጥተኛው ‘አሜን’ በእግር ማስታወሻ ተጠብቋል።
- source_word: εἷς ἐξ ὑμῶν
  choice: ከእናንተ አንዱ
  rationale: የክፍል አመልካቹን አገላለጽ በግልጽና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: παραδώσει με
  choice: አሳልፎ ይሰጠኛል
  rationale: የግሱን ‘አሳልፎ መስጠት’ መሠረታዊ ትርጉምና በዚህ አውድ ያለውን የክህደት ኃይል ሳይዘጋ ይጠብቃል።
- source_word: μετ’ ἐμοῦ
  choice: ከእኔ ጋር
  rationale: አብሮነትን በቀጥታና በተፈጥሯዊ አማርኛ ይገልጣል።
