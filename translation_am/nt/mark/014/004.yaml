- source_word: ἡ ἀπώλεια αὕτη
  choice: እንዲህ የባከነው
  rationale: ἀπώλεια ጥፋት፣ ኪሳራ ወይም ብክነትን ሊያመለክት ይችላል። ውድ ሽቱ በመፍሰሱ ላይ ባቀረቡት ቅሬታ አውድ ‘የባከነው’ የተናጋሪዎቹን ግምገማ በግልጽ ያሳያል።
