  text: 'But some were indignant among themselves: “Why has this waste of the perfume happened?”[a][b]'
translation:
  language: am
  text: ነገር ግን አንዳንዶች እርስ በርሳቸው ተቆጥተው፣ “ይህ የሽቱ ብክነት ለምን ሆነ?” አሉ።[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እርስ በርስ እየተነጋገሩ” ወይም “በልባቸው።” የግሪክ ሐረጉ በቡድኑ ውስጥ እርስ በርስ የተደረገ ቅሬታን ወይም ውስጣዊ ምላሽን ሊያመለክት ይችላል።
