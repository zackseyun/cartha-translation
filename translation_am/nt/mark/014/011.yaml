base_translation:
  language: en
  yaml_path: translation/nt/mark/014/011.yaml
  text: When they heard it[a], they rejoiced and promised to give him money[b]. And he began seeking how he might betray him at an opportune time.
translation:
  language: am
  text: እነርሱም ይህን በሰሙ ጊዜ ደስ ብሏቸው፣ ገንዘብ[a] እንደሚሰጡት ቃል ገቡ። እርሱም በአመቺ ጊዜ እንዴት ሊያሳልፈው[b] እንደሚችል ይፈልግ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ብር።” የግሪኩ ቃል በቀጥታ ብር የተባለውን ብረት ወይም በአጠቃላይ ገንዘብን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ሊከዳው።” የግሪኩ ግስ “አሳልፎ መስጠት” ወይም “አስረክቦ መስጠት” ማለት ሊሆን ይችላል፤ እዚህ ግን የይሁዳን ተንኮለኛ ድርጊት ስለሚገልጽ፣ “መክዳት” የአውዱን ሐሳብ ያሳያል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἀκούσαντες
  choice: እነርሱም ይህን ሲሰሙ
  rationale: የግሪኩ አሳታፊ ግስ ጊዜያዊ ግንኙነትን ያሳያል፤ “ይህን” ከቀደመው አውድ በተፈጥሮ የተሟላ ተሳቢ ነው።
- source_word: ἐχάρησαν
  choice: ደስ አላቸው
  rationale: በዘመናዊ አማርኛ የእነርሱን ደስታ ቀጥተኛና ተፈጥሯዊ በሆነ አነጋገር ይገልጻል።
- source_word: ἐπηγγείλαντο αὐτῷ ἀργύριον δοῦναι
  choice: ገንዘብም ሊሰጡት ቃል ገቡ
  rationale: ἐπαγγέλλομαι የገቡትን ቃል ወይም የሰጡትን ተስፋ ያመለክታል፤ አማርኛው የግሪኩን አገባብ በተፈጥሮ ያስተላልፋል።
- source_word: ἀργύριον
  choice: ገንዘብ
  rationale: ቃሉ በቀጥታ “ብር” ማለት ቢችልም፣ በዚህ አውድ የክፍያ ገንዘብን ያመለክታል፤ ቀጥተኛው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ἐζήτει
  choice: ይፈልግ ነበር
  rationale: ያልተፈጸመው የግሪክ ግስ ቀጣይነት ያለውን ፍለጋ ያሳያል፤ ይህ ቅርጽ ያንን በአማርኛ በግልጽ ይገልጻል።
- source_word: πῶς
  choice: እንዴት
  rationale: ይሁዳ ድርጊቱን የሚፈጽምበትን መንገድ ወይም ሁኔታ የመፈለጉን ሐሳብ ይጠብቃል።
- source_word: εὐκαίρως
  choice: በአመቺ ጊዜ
  rationale: ተስማሚ ወይም ለዓላማው የሚያመች አጋጣሚን ያመለክታል፤ ጽሑፉ ያልገለጸውን ዝርዝር አይጨምርም።
- source_word: παραδοῖ
  choice: አሳልፎ እንደሚሰጠው
  rationale: የግሪኩን መሠረታዊ “አሳልፎ መስጠት” ትርጉም በዋናው ጽሑፍ ይጠብቃል፤ በአውዱ ያለው “መክዳት” ትርጉም በማስታወሻ ቀርቧል።
