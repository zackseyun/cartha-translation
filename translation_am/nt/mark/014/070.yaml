  text: ὁ δὲ πάλιν ἠρνεῖτο. καὶ μετὰ μικρὸν πάλιν οἱ παρεστῶτες ἔλεγον τῷ Πέτρῳ· Ἀληθῶς ἐξ αὐτῶν εἶ, καὶ γὰρ Γαλιλαῖος εἶ ⸂καὶ ἡ λαλιά σου ὁμοιάζει⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/070.yaml
  text: But he again denied it[a]. And after a little while, those standing nearby again were saying to Peter, “Surely you are one of them, for you are also a Galilean[b], and your speech is similar.”
translation:
  language: am
  text: እርሱ ግን እንደገና ካደ። ከጥቂት ጊዜ በኋላም በአጠገቡ ቆመው የነበሩት ሰዎች ጴጥሮስን እንደገና እንዲህ ይሉት ነበር፦ “በእርግጥ አንተ ከእነርሱ አንዱ ነህ፤ ገሊላዊም ነህና፣ አነጋገርህም ተመሳሳይ ነው[a][b]።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ዘዬህ ተመሳሳይ ነው” ወይም “የአነጋገር መንገድህ እንደ እነርሱ ነው።” የግሪኩ λαλιά የንግግር ልማድን፣ ዘዬን ወይም የአነጋገር መንገድን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: አንዳንድ የእጅ ጽሑፎች “አነጋገርህም ተመሳሳይ ነው” የሚለውን ክፍል አያካትቱም።
    reason: textual_variant
lexical_decisions:
- source_word: ἠρνεῖτο
  choice: ካደ
  rationale: የግሱ ያልተፈጸመ ጊዜ ቅርጽ ቀጣይነትን ወይም መደጋገምን ሊያመለክት ቢችልም፣ ከ πάλιν (‘እንደገና’) ጋር ‘እንደገና ካደ’ በዘመናዊ አማርኛ ተፈጥሯዊ ሆኖ ድግግሞሹን ያስቀምጣል። የተካደው ክስ ከአውዱ ስለሚታወቅ ተጨማሪ ተሳቢ አልገባም።
- source_word: μετὰ μικρὸν
  choice: ጥቂት ቆይቶም
  rationale: አጭር ጊዜ ካለፈ በኋላ የሚለውን ፍቺ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: οἱ παρεστῶτες
  choice: በአጠገቡ ቆመው የነበሩት ሰዎች
  rationale: የተሳቢ አገላለጹን የመቆምና በአቅራቢያ የመገኘት ምስል ይጠብቃል።
- source_word: ἔλεγον
  choice: ይሉት ነበር
  rationale: ያልተፈጸመውን የግስ ገጽታ እንደ ቀጣይ ወይም ተደጋጋሚ ንግግር ያሳያል።
- source_word: Ἀληθῶς
  choice: በእርግጥ
  rationale: ተናጋሪዎቹ ያላቸውን ጽኑ እርግጠኝነት በተለመደና ክብር ባለው አገላለጽ ያስተላልፋል።
- source_word: ἐξ αὐτῶν εἶ
  choice: ከእነርሱ አንዱ ነህ
  rationale: ጴጥሮስ ከኢየሱስ ጋር ከተያያዘው ቡድን አንዱ መሆኑን ግልጽና ፈሊጣዊ በሆነ መንገድ ይገልጣል።
- source_word: καὶ γὰρ Γαλιλαῖος εἶ
  choice: ገሊላዊም ነህና
  rationale: γάρ የምክንያትን ግንኙነት በ‘-ና’ ሲያቀርብ፣ καί ደግሞ በ‘-ም’ ተወክሏል።
- source_word: ἡ λαλιά σου
  choice: አነጋገርህ
  rationale: λαλιά የንግግር ልማድን፣ ዘዬን ወይም የአነጋገር መንገድን ሊያመለክት ስለሚችል፣ ‘አነጋገርህ’ ይህን ሰፊ የቃሉን ክልል ይጠብቃል።
- source_word: ὁμοιάζει
  choice: ይመሳሰላል
  rationale: ግሱ መመሳሰልን ይገልጣል። የንጽጽሩ ተሳቢ በግሪኩ በግልጽ ስላልተጠቀሰ፣ በአማርኛውም ከአውዱ እንዲገባ ተትቷል።
