base_translation:
  language: en
  yaml_path: translation/nt/mark/014/069.yaml
  text: And the servant girl[a], seeing him, began again to say to those standing nearby, “This man is one of them.”
translation:
  language: am
  text: ሴት አገልጋዪቱም እርሱን አይታ፣ በአቅራቢያ ለቆሙት[a]፣ “ይህ ሰው ከእነርሱ አንዱ ነው” ማለት እንደገና ጀመረች።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በዚያ ለነበሩት።”
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίσκη
  choice: አገልጋይዋም ልጅ
  rationale: ቃሉ ወጣት ሴት አገልጋይን ያመለክታል። «አገልጋይ ልጅ» በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን፣ ጽሑፉ በግልጽ ያልገለጠውን የባርነት ሕጋዊ ሁኔታ አይወስንም። የመድረሻው አንቀጽ «-ዋም» በቀደመው ትረካ የታወቀችውን ሴት ያመለክታል።
- source_word: ἰδοῦσα
  choice: እርሱን አይታ
  rationale: የአኦሪስት አንቀጽ ድርጊቱን ለንግግሯ ሁኔታና መነሻ አድርጎ ያቀርባል፤ «አይታ» ይህን በተፈጥሯዊ የአማርኛ ትረካ ያስተላልፋል።
- source_word: ἤρξατο πάλιν λέγειν
  choice: ማለት እንደገና ጀመረች
  rationale: «ጀመረች» የἤρξατοን የመጀመር ኃይል፣ «እንደገና» ደግሞ πάλινን ጠብቀዋል። የቃላቱ አቀማመጥ ለአማርኛ ተፈጥሯዊ ነው።
- source_word: τοῖς παρεστῶσιν
  choice: በዚያ ቆመው ለነበሩት
  rationale: በቦታው ቆመው የነበሩትን ሰዎች የሚጠቁመውን የአካባቢ ስሜት ይጠብቃል።
- source_word: Οὗτος
  choice: ይህ ሰው
  rationale: ጠቋሚው በቀጥታ ጴጥሮስን ይጠቁማል፤ «ሰው» መጨመሩ በአማርኛ ክሱን ተፈጥሯዊና ግልጽ ያደርገዋል፣ ተጨማሪ የንቀት ቃናም አያስገባም።
- source_word: ἐξ αὐτῶν
  choice: ከእነርሱ አንዱ ነው
  rationale: ከኢየሱስ ጋር ከተቆራኘው ቡድን አባል መሆኑን የሚገልጠውን ፈሊጣዊ ትርጉም በግልጽ ያቀርባል።
