source:
  edition: SBLGNT
  text: Καὶ ὄντος αὐτοῦ ἐν Βηθανίᾳ ἐν τῇ οἰκίᾳ Σίμωνος τοῦ λεπροῦ κατακειμένου αὐτοῦ ἦλθεν γυνὴ ἔχουσα ἀλάβαστρον μύρου νάρδου πιστικῆς πολυτελοῦς· ⸀συντρίψασα ⸀τὴν ἀλάβαστρον κατέχεεν ⸀αὐτοῦ τῆς κεφαλῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/003.yaml
  text: And while he was in Bethany[a], reclining at the house of Simon the leper, a woman came with an alabaster jar of very expensive pure nard perfume; she broke the jar and poured it on his head.
translation:
  language: am
  text: እርሱም በቢታንያ፣ በለምጻሙ ስምዖን ቤት ተደግፎ ሳለ፣ እጅግ ውድ የሆነ ንጹሕ[a] የናርዶስ ሽቱ የያዘ የአልባስጥሮስ ብልቃጥ ይዛ አንዲት ሴት መጣች፤ ብልቃጡንም ሰብራ ሽቱውን በራሱ ላይ አፈሰሰችው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እውነተኛ የናርዶስ ሽቱ”፤ “ንጹሕ” ተብሎ የተተረጎመው የግሪክ ቅጽል (πιστικῆς) ትርጉም አከራካሪ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄντος αὐτοῦ ... κατακειμένου αὐτοῦ
  choice: እርሱም ... በማዕድ ተቀምጦ ሳለ
  rationale: የግሪኩ ገላጭ አገባብ የትረካውን ዳራ ያሳያል። κατακεῖμαι በዚህ አውድ ለምግብ ተደግፎ መቀመጥን ስለሚጠቁም፣ «በማዕድ ተቀምጦ» ተፈጥሯዊና ግልጽ ነው።
- source_word: Βηθανίᾳ
  choice: ቢታንያ
  rationale: በአማርኛ የተለመደው የቦታው ስም ነው።
- source_word: οἰκίᾳ Σίμωνος τοῦ λεπροῦ
  choice: በለምጻሙ ስምዖን ቤት
  rationale: ግሪኩ ስምዖንን «ለምጻሙ» ብሎ ይጠራዋል፤ «የቀድሞ ለምጻም» ማለት በምንጩ የሌለ ግምት ይጨምራል።
- source_word: γυνὴ
  choice: አንዲት ሴት
  rationale: ማርቆስ በዚህ ስፍራ ሴቲቱን በስም አይለያትም፤ ያልተወሰነው አገላለጽ ተጠብቋል።
- source_word: ἀλάβαστρον
  choice: የአልባስጥሮስ ብልቃጥ
  rationale: ቃሉ ሽቱ የሚያዝበትን የአልባስጥሮስ ዕቃ ያመለክታል። «ብልቃጥ» የዕቃውን ዓይነት ከ«ዕቃ» ይልቅ ግልጽ ያደርጋል።
- source_word: μύρου νάρδου
  choice: የናርዶስ ሽቱ
  rationale: μύρον መዓዛ ያለውን ሽቱ ወይም ዘይት፣ νάρδος ደግሞ ልዩውን መዓዛማ ንጥረ ነገር ያመለክታሉ። «ሽቱ» በዘመናዊ አማርኛ ግልጽ ነው።
- source_word: πιστικῆς
  choice: ንጹሕ[a]
  rationale: የቃሉ ትርጉም አከራካሪ ነው። «ንጹሕ» ሽቱው ያልተበረዘና እውነተኛ መሆኑን ሊያመለክት የሚችለውን ዋና ንባብ ይይዛል፤ አማራጩ በማስታወሻ ተጠብቋል።
- source_word: πολυτελοῦς
  choice: እጅግ ውድ የሆነ
  rationale: ቃሉ ከፍተኛ ዋጋን ያመለክታል፤ ይህ አገላለጽ በቀጣዩ አውድ ለሚነሳው ተቃውሞ መሠረት የሆነውን የገንዘብ ዋጋ በግልጽ ያሳያል።
- source_word: συντρίψασα τὴν ἀλάβαστρον
  choice: ብልቃጡንም ሰብራ
  rationale: ተካፋዩ ግስ ከማፍሰሷ በፊት የተፈጸመውን ድርጊት ያሳያል። «ሰብራ» ድርጊቱን ያለ አላስፈላጊ ማጋነን ያቀርባል።
- source_word: κατέχεεν αὐτοῦ τῆς κεφαλῆς
  choice: ሽቱውን በራሱ ላይ አፈሰሰችው
  rationale: ግሱ በላይ ላይ ማፍሰስን ያመለክታል። የሚፈሰውን «ሽቱውን» ብሎ መድገም በአማርኛ ግልጽነትን ያስገኛል።
theological_decisions:
- issue: «ለምጻሙ ስምዖን» የሚለውን «የቀድሞ ለምጻም» ብሎ ማለዘብ ይገባ እንደሆነ
  choice: «ለምጻሙ ስምዖን» የሚለውን የምንጩን መጠሪያ እንዳለ ማቆየት
