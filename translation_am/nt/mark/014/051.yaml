  text: Καὶ ⸂νεανίσκος τις⸃ ⸀συνηκολούθει αὐτῷ περιβεβλημένος σινδόνα ἐπὶ γυμνοῦ, καὶ κρατοῦσιν ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/051.yaml
  text: And a certain young man was following him[a], wearing only a linen cloth over his naked body, and they seize him,
translation:
  language: am
  text: አንድ ወጣትም በራቁት ሰውነቱ ላይ የበፍታ ጨርቅ[a] ብቻ ለብሶ ይከተለው ነበር፤ እነርሱም ያዙት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የበፍታ አንሶላ።” የግሪኩ σινδών የበፍታ ጨርቅን ወይም አንሶላ የሚመስል ልብስን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: νεανίσκος τις
  choice: አንድ ወጣት
  rationale: νεανίσκος ወጣት ወንድን ያመለክታል፤ τις የሚሰጠውን ያልተወሰነ ነገር ግን በተለየ ግለሰብ ላይ የሚያተኩር ኃይል ‘አንድ’ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: συνηκολούθει αὐτῷ
  choice: ይከተለው ነበር
  rationale: ያልተጠናቀቀው የግስ ቅርጽ ቀደም ሲል ቀጥሎ የነበረን ድርጊት ያሳያል፤ ‘ይከተለው ነበር’ ይህን ቀጣይነት ይጠብቃል።
- source_word: περιβεβλημένος
  choice: ለብሶ
  rationale: ቃሉ በሰውነት ዙሪያ መጠቅለልን ወይም መልበስን ያመለክታል፤ በዚህ አገባብ ‘ለብሶ’ አጭርና ተፈጥሯዊ ነው።
- source_word: σινδόνα
  choice: የበፍታ ጨርቅ
  rationale: σινδών የበፍታ ጨርቅን፣ አንሶላን ወይም እንደ ልብስ የሚያገለግል ጨርቅን ሊያመለክት ይችላል፤ ‘የበፍታ ጨርቅ’ ቅርጹን ከልክ በላይ ሳይወስን ሰፊውን ትርጉም ይጠብቃል።
- source_word: ἐπὶ γυμνοῦ
  choice: በራቁት ሰውነቱ ላይ … ብቻ
  rationale: ሐረጉ ጨርቁ ሌላ ልብስ ሳይኖር በቀጥታ በራቁት ሰውነቱ ላይ እንደነበረ ያሳያል፤ ‘ብቻ’ ይህን አገባብ በግልጽ ያደርጋል።
- source_word: κρατοῦσιν αὐτόν
  choice: እነርሱም ያዙት
  rationale: κρατέω እዚህ በኃይል መያዝን ያመለክታል። የግሪኩ ታሪካዊ የአሁን ጊዜ ቅርጽ ትረካውን ሕያው ቢያደርግም፣ በተፈጥሯዊ ዘመናዊ አማርኛ ‘ያዙት’ የድርጊቱን ድንገተኛነት ሳያጠፋ ተከታታይ ትረካውን ይጠብቃል።
