  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὗτοι δέ εἰσιν οἱ παρὰ τὴν ὁδὸν ὅπου σπείρεται ὁ λόγος, καὶ ὅταν ἀκούσωσιν ⸀εὐθὺς ἔρχεται ὁ Σατανᾶς καὶ αἴρει τὸν λόγον τὸν ἐσπαρμένον ⸂εἰς αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/015.yaml
  text: 'And these are the ones along the road where the word is sown: when they hear[a], Satan immediately comes and takes away the word that was sown in them.'
translation:
  language: am
  text: ቃሉ በሚዘራበት በመንገድ ዳር ያሉት እነዚህ ናቸው፤ ቃሉን ሲሰሙ ወዲያው ሰይጣን መጥቶ በእነርሱ ውስጥ[a] የተዘራውን ቃል ይወስዳል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “ወደ እነርሱ የተዘራውን ቃል።” አንዳንድ የእጅ ጽሑፎች “በእነርሱ ውስጥ” የሚለውን ሐረግ አያካትቱም።
    reason: εἰς αὐτούς በ‘በእነርሱ ውስጥ’ ወይም ‘ወደ እነርሱ’ ሊተረጎም የሚችል ሲሆን፣ በSBLGNT በቅንፍ መቀመጡ የጽሑፍ ማስረጃው እርግጠኛ እንዳልሆነ ያመለክታል።
lexical_decisions:
- source_word: οὗτοι δέ εἰσιν
  choice: እነዚህ ናቸው
  rationale: የምሳሌውን ማብራሪያ በተፈጥሯዊ አማርኛ ያቀርባል፤ δέ ቀላል አያያዥ ስለሆነ በአማርኛው የአረፍተ ነገር ፍሰት ውስጥ በግልጽ ቃል ሳይተረጎም ተንጸባርቋል።
- source_word: οἱ παρὰ τὴν ὁδόν
  choice: በመንገድ ዳር ያሉት
  rationale: παρά ከተሳቢ ጋር በዚህ አውድ ‘በ…ዳር’ የሚል የቦታ ትርጉም አለው፤ የዘር ምሳሌው ሰዎችን እንደሚወክልም ግልጽ ያደርጋል።
- source_word: σπείρεται ὁ λόγος
  choice: ቃሉ በሚዘራበት
  rationale: λόγοςን ‘ቃል’ ብሎ መተርጎም በምንባቡ ያለውን ድግግሞሽና መጽሐፍ ቅዱሳዊ ድምፅ ይጠብቃል፤ የግሪኩ ተደራጊ ቅርጽም ተጠብቋል።
- source_word: ὅταν ἀκούσωσιν
  choice: ቃሉን ሲሰሙ
  rationale: ὅταν ከአኦሪስት ሰብጃንክቲቭ ጋር ያለውን አጠቃላይ ጊዜያዊ ትርጉም በተፈጥሯዊ ዘመናዊ አማርኛ ያሳያል።
- source_word: εὐθύς
  choice: ወዲያው
  rationale: በማርቆስ የተለመደውን ፈጣንነት በግልጽና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ὁ Σατανᾶς
  choice: ሰይጣን
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የተለመደውን የግል ስም/ማዕረግ ይጠብቃል።
- source_word: αἴρει
  choice: ይወስዳል
  rationale: ‘ያስወግዳል/ይወስዳል’ የሚለውን ሰፊ የግሪክ ትርጉም ይጠብቃል፤ ‘ይነጥቃል’ የሚለውን ተጨማሪ ኃይለኛ ምስል አያስገባም።
- source_word: τὸν ἐσπαρμένον εἰς αὐτούς
  choice: በእነርሱ ውስጥ የተዘራውን ቃል
  rationale: εἰς αὐτούς የሚፈቅደውን ውስጣዊ መቀበል በ‘በእነርሱ ውስጥ’ ያሳያል፤ ‘ወደ እነርሱ’ የሚለው አማራጭ ግን የአቅጣጫ ገጽታውን ይበልጥ ይጠብቃል።
theological_decisions:
- issue: በምሳሌው ማብራሪያ ውስጥ የሰይጣን ግላዊ ተግባር
  choice: ሰይጣን መጥቶ ቃሉን እንደሚወስድ በቀጥታ ተተርጉሟል።
  alternative: ‘ባላጋራው’ የሚል ይበልጥ አጠቃላይ ማዕረግ
  rationale: ὁ Σατανᾶς በዚህ አውድ ግላዊውን ክፉ አካል በተፈጥሮ ያመለክታል፤ ትርጉሙ ይህን ወደ ረቂቅ ኃይል አይቀንስም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የምሳሌው የመዝራት ምስልና ‘ቃል’ የሚለው ድግግሞሽ ተጠብቀዋል።
