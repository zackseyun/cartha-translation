  text: And he was saying[a], “Whoever has ears to hear, let him hear.”
translation:
  language: am
  text: እርሱም ይል ነበር፦ “ለመስማት ጆሮ ያለው[a] ይስማ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “ለመስማት ጆሮዎች ያሉት ይስማ።”
    reason: የግሪክኛውን የ«ጆሮዎች» ብዙ ቁጥርና የ«ለመስማት» ኢንፊኒቲቭ ሐረግ በቅርብ የሚያሳይ አማራጭ አነጋገር
lexical_decisions:
- source_word: καὶ
  choice: እርሱም
  rationale: «-ም» ቀላሉን የትረካ ትስስር ይጠብቃል፤ «እርሱ» ደግሞ በዐውዱ ያለውን ኢየሱስን ያመለክታል።
- source_word: ἔλεγεν
  choice: ይል ነበር
  rationale: የግሪክኛውን ያልተፈጸመ የአለፈ ጊዜ ገጽታ በተፈጥሯዊ አማርኛ ይገልጣል፤ «ደጋግሞ ይል ነበር» በማለት ከዐውዱ በላይ ድግግሞሽን አያጎላም።
- source_word: Ὃς ἔχει
  choice: ያለው
  rationale: የግሪክኛውን አጠቃላይ ነጠላ አገላለጽ በአማርኛ ተፈጥሯዊ በሆነ መንገድ ያስተላልፋል፤ የወንድ ሰው ብቻ ማመልከቱን አያስገባም።
- source_word: ὦτα
  choice: ጆሮ
  rationale: ግሪክኛው ብዙ ቁጥር «ጆሮዎች» ቢልም፣ አማርኛ በዚህ ምሳሌያዊ አገላለጽ ነጠላውን «ጆሮ» በተፈጥሮ ይጠቀማል፤ ብዙ ቁጥሩ በእግር ማስታወሻ ተጠብቋል።
- source_word: ἀκούειν
  choice: የሚሰማ
  rationale: ከ«ጆሮ» ጋር ተፈጥሯዊ የሆነ ሐረግ ይፈጥራል፣ እንዲሁም ከሚከተለው ἀκουέτω ጋር ያለውን የቃል ድግግሞሽ ይጠብቃል።
- source_word: ἀκουέτω
  choice: ይስማ
  rationale: የሦስተኛ መደብ ትእዛዛዊ ኃይልን በአጭርና በክብር የተሞላ አማርኛ ያቀርባል።
theological_decisions:
- issue: በምሳሌያዊው ንግግር ያለው አጠቃላይ ወንዳዊ ነጠላ ቅርጽ
  choice: «ያለው … ይስማ» ተብሎ ሁሉንም ሰው በሚያካትት አጠቃላይ ነጠላ ቅርጽ ተተርጉሟል።
  alternative: «ማንም … ይስማ» ወይም ብዙ ቁጥር መጠቀም
  rationale: Ὃς ἔχει በሰዋሰው ወንዳዊ ነጠላ ቢሆንም አገልግሎቱ አጠቃላይ ነው። የአማርኛው ቅርጽ ነጠላውን አወቃቀርና የምሳሌውን ቀጥተኛ ጥሪ ሳያጠፋ ለወንዶች ብቻ አይገድበውም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለአብዛኛው አንባቢ ቀላል አማርኛ ተጠቅሟል። «ይል ነበር» የምንጩን ገጽታ ይጠብቃል፤ «የሚሰማ ጆሮ» ደግሞ በአማርኛ የተለመደውን ምሳሌያዊ አገላለጽ ይከተላል።
