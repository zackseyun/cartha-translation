source:
  edition: SBLGNT
  text: καὶ αἱ μέριμναι τοῦ ⸀αἰῶνος καὶ ἡ ἀπάτη τοῦ πλούτου καὶ αἱ περὶ τὰ λοιπὰ ἐπιθυμίαι εἰσπορευόμεναι συμπνίγουσιν τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/019.yaml
  text: and the cares of the age[a], and the deceitfulness of riches, and the desires for other things entering in choke the word[d][c][b], and it becomes unfruitful.
translation:
  language: am
  text: የዚህ ዘመን ጭንቀቶች[a]፣ የሀብት አታላይነትና ለሌሎች ነገሮች ያሉ ምኞቶች ወደ ውስጥ ገብተው ቃሉን ያንቁታል፤ ቃሉም ፍሬ አልባ ይሆናል[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የዓለም ጭንቀቶች»። የግሪኩ ቃል «ዘመን»ን፣ በተዘረጋ ትርጉምም አሁን ያለውን የዓለም ሥርዓት ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: በቃል በቃል፣ «እርሱም ፍሬ አልባ ይሆናል»። በሰዋስው ቅርብ ያለው ማጣቀሻ «ቃሉ» ነው፤ ነገር ግን «ሰሚው ፍሬ አልባ ይሆናል» ወይም «ዘሩ/ተክሉ ፍሬ አልባ ይሆናል» ተብሎም ሊገባ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: μέριμναι
  choice: ጭንቀቶች
  rationale: ቃሉ አእምሮን የሚይዙ እንክብካቤዎችን፣ ስጋቶችን ወይም ጭንቀቶችን ሊያመለክት ይችላል፤ «ጭንቀቶች» በዚህ አውድ ያለውን ሸክም በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: αἰῶνος
  choice: የዚህ ዘመን
  rationale: αἰών በመሠረቱ ጊዜያዊውን «ዘመን» ያመለክታል፤ «የዚህ» የሚለው በዐውዱ ያለውን አሁናዊ ሥርዓት ያብራራል።
- source_word: ἀπάτη τοῦ πλούτου
  choice: የሀብት አታላይነት
  rationale: ሐረጉ ሀብት ሰውን የሚያስትበትን ባሕርይ ይገልጣል፤ «አታላይነት» ይህን በግልጽ ያቀርባል።
- source_word: αἱ περὶ τὰ λοιπὰ ἐπιθυμίαι
  choice: ለሌሎች ነገሮች ያሉ ምኞቶች
  rationale: ይህ ሰፊ አገላለጽ ከቃሉ ሌላ ወደሆኑ ነገሮች የሚመሩ ምኞቶችን ያመለክታል፤ የግሪኩን ብዙ ቁጥርና ሰፊ ወሰን ይጠብቃል።
- source_word: εἰσπορευόμεναι
  choice: ወደ ውስጥ ገብተው
  rationale: ተሳቢው እነዚህ ተጽእኖዎች ወደ ሰውየው ውስጥ እየገቡ መሆናቸውን ያሳያል፤ በአማርኛ ተከታታይ ግስ ሆኖ በተፈጥሯዊ መንገድ ቀርቧል።
- source_word: συμπνίγουσιν
  choice: ያንቁታል
  rationale: ግሱ ማነቅን ወይም አየር ማሳጣትን የሚያሳይ ሲሆን፣ በዘርና በእሾህ ምሳሌው ያለውን ምስል ይጠብቃል።
- source_word: τὸν λόγον
  choice: ቃሉን
  rationale: λόγος እዚህ የተሰበከውን መልእክት ያመለክታል፤ «ቃሉ» የምሳሌውን ቃላዊና መጽሐፍ ቅዱሳዊ ትስስር ይጠብቃል።
- source_word: ἄκαρπος γίνεται
  choice: ፍሬ አልባ ይሆናል
  rationale: ይህ አተረጓጎም የγίνεταιን የሂደትና የውጤት ሐሳብ ይጠብቃል፤ በአማርኛም ግልጽና ተፈጥሯዊ ነው።
theological_decisions:
- issue: የመጨረሻው ነጠላ ግስና ቅጽል ማጣቀሻ
  choice: በዋናው ጽሑፍ «ቃሉም ፍሬ አልባ ይሆናል» ተብሏል።
  alternative: ሰሚው ፍሬ አልባ ይሆናል፤ ወይም ዘሩ/ተክሉ ፍሬ አልባ ይሆናል።
  rationale: በሰዋስው ቅርብ ያለው ግልጽ ነጠላ ማጣቀሻ τὸν λόγον («ቃሉን») ነው። ሆኖም የዘር ምስሉ ሰሚውን ወይም የበቀለውን ተክል በአእምሮ ሊያመጣ ስለሚችል አማራጩ በማስታወሻ ተጠብቋል።
