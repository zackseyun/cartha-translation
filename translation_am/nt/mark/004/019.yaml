  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ተደጋጋሚ καί በአማርኛ ተፈጥሯዊ ዝርዝር በ«፣» እና «ና» ቀርቧል፤ ሦስቱም ተጽእኖዎች ወደ ውስጥ ገብተው ቃሉን እንደሚያንቁ ግልጽ ተደርጓል።
