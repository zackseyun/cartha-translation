source:
  edition: SBLGNT
  text: καὶ ⸀ἐκεῖνοί εἰσιν οἱ ἐπὶ τὴν γῆν τὴν καλὴν σπαρέντες, οἵτινες ἀκούουσιν τὸν λόγον καὶ παραδέχονται καὶ καρποφοροῦσιν ⸂ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν⸃ ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/020.yaml
  text: 'And those are the ones sown on the good soil: they hear the word and receive it and bear fruit—thirtyfold and sixtyfold and a hundredfold[a].'
translation:
  language: am
  text: በመልካም አፈር ላይ የተዘሩትም እነዚያ ናቸው፤ እነርሱ ቃሉን ይሰማሉ፣ ይቀበሉታል[a]፣ ፍሬም ያፈራሉ—ሠላሳ እጥፍ እና ስድሳ እጥፍ እና መቶ እጥፍ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ይቀበሉታል” ወይም “በደስታ ይቀበሉታል።”
    reason: παραδέχονται በአዎንታዊ ሁኔታ መቀበልን ወይም መቀበልን ያመለክታል፤ «ማጽደቅ» የሚለው የተለየ የትርጉም ጥላ ስለሚያስገባ ተወግዷል።
lexical_decisions:
- source_word: ἐκεῖνοί
  choice: እነዚያ
  rationale: በምሳሌው ማብራሪያ ውስጥ ቀደም ብሎ ከተጠቀሱት ቡድኖች የመጨረሻውን ወደ ኋላ እያመለከተ ስለሆነ የርቀት አመልካች ተጠብቋል።
- source_word: οἱ ἐπὶ τὴν γῆν τὴν καλὴν σπαρέντες
  choice: በመልካም አፈር ላይ የተዘሩት
  rationale: የግሪኩን ተደራጊ አገላለጽና የዘር ምሳሌውን ይጠብቃል፤ “አፈር” በዚህ የእርሻ አውድ ተፈጥሯዊ ነው።
- source_word: γῆν τὴν καλὴν
  choice: መልካም አፈር
  rationale: γῆ በዚህ አውድ ዘር የሚበቅልበትን አፈር ያመለክታል፤ καλὴν ከሌሎቹ የአፈር ዓይነቶች ጋር ያለውን ግምገማዊ ንጽጽር ለማስጠበቅ “መልካም” ተብሏል።
- source_word: ἀκούουσιν τὸν λόγον
  choice: ቃሉን ይሰማሉ
  rationale: የአሁን ጊዜ የግስ ቅርጽንና በማርቆስ 4 ተደጋግሞ የሚመጣውን “ቃል” ቃል-አጠቃቀም ይጠብቃል።
- source_word: παραδέχονται
  choice: ይቀበሉታል
  rationale: ቃሉን በአዎንታዊ ሁኔታ መቀበልን ያሳያል፤ ተውላጠ ስሙ “ቃሉን” ወደሚለው ይመለሳል። የ“ማጽደቅ” ወይም የ“በአክብሮት መቀበል” ጥላዎች በማስታወሻ ተጠቅሰዋል።
- source_word: καρποφοροῦσιν
  choice: ፍሬም ያፈራሉ
  rationale: የእርሻውን ምስልና መንፈሳዊ አንድምታውን ያለ ትርጓሜያዊ ማስፋፋት ይጠብቃል።
- source_word: ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν ἑκατόν
  choice: አንዱ ሠላሳ፣ አንዱ ስድሳ፣ አንዱም መቶ እጥፍ
  rationale: የተለያየውን የምርት መጠን ግልጽ ያደርጋል፤ የግሪኩ ተደጋጋሚ ἓν እና καὶ ምት በ“አንዱ” ድግግሞሽና በመጨረሻው “-ም” ተንጸባርቋል።
theological_decisions:
- issue: በመልካም አፈር የተመሰሉት ለቃሉ የሚሰጡት ምላሽ
  choice: ጥቅሱ ቃሉን መስማት፣ በአዎንታዊ ሁኔታ መቀበልና ፍሬ ማፍራትን ብቻ እንደሚገልጽ ተተርጉሟል።
  alternative: ይህን ቡድን የመጨረሻ ጽናትን እንደሚያረጋግጥ ወይም የመጀመሪያ ምላሽን ብቻ እንደሚገልጽ ማስፋት።
  rationale: የግሪክ ጽሑፉ እነዚህ ሰዎች እንደሚሰሙ፣ እንደሚቀበሉና ፍሬ እንደሚያፈሩ ይናገራል፤ ከዚያ በላይ የሆነ የእምነት ሥርዓታዊ ድምዳሜ አልተጨመረም።
