  verdict: revise
  source_fidelity: The draft accurately represents the twofold hidden/concealed parallelism and the disclosure contrast. However, ἐγένετο (‘came to be/became’) is reduced by ‘አልነበረም’ (‘there was not’), and the current conditional wording is less idiomatic than a modal exception construction in Amharic.
  naturalness: 'The revised wording uses natural modern Amharic: ‘ሊገለጥ ካልሆነ በቀር’ and ‘ሊወጣ ካልሆነ በቀር’ clearly express the exceptional orientation toward eventual disclosure. ‘የተደበቀ ሆኖ የመጣ’ preserves the becoming sense while remaining readable.'
  terminology: ‘የተሰወረ,’ ‘የተደበቀ,’ ‘ሊገለጥ,’ and ‘ወደ ግልጥ ሊወጣ’ are appropriate modern-standard renderings. The distinct terms for κρυπτόν and ἀπόκρυφον retain the Greek parallelism without making an artificial lexical distinction.
  issues:
  - severity: medium
    issue: The rendering of ἐγένετο as ‘አልነበረም’ omits the verb’s ingressive/becoming sense.
    rationale: The Greek does not merely deny that a concealed thing existed; it says that nothing came to be concealed except for coming into the open. ‘የተደበቀ ሆኖ የመጣ’ retains this aspect.
  - severity: low
    issue: The wording ‘እንዲ… ካልሆነ በቀር’ is understandable but less natural as an Amharic exception construction.
    rationale: Using ‘ሊ… ካልሆነ በቀር’ is idiomatic and leaves the Greek ἵνα clauses open to purpose/result shading.
  - severity: low
    issue: Footnote a's proposed alternative does not fully mirror the source construction and footnote b is anchored only at the end of the verse rather than at the final expression.
    rationale: The revised alternative directly states the purpose/result ambiguity, and the lexical note is attached to ‘ወደ ግልጥ ሊወጣ.’
