base_translation:
  language: en
  yaml_path: translation/nt/mark/004/022.yaml
  text: For nothing is hidden except to be revealed[b][a], nor has anything become concealed except to come to light.
translation:
  language: am
  text: ምክንያቱም፣ ሊገለጥ ካልሆነ በቀር የተሰወረ ነገር የለም፤ ወደ ግልጥ ሊወጣ[b] ካልሆነ በቀር የተደበቀ ሆኖ የመጣ ነገርም የለም።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የተሰወረ ነገር እንዲገለጥ ብቻ ነው፤ … የተደበቀ ሆኖ የመጣ ነገርም ወደ ግልጥ እንዲወጣ ብቻ ነው።” የግሪኩ ἵνα ሐረጎች ዓላማን ወይም ውጤትን ሊያመለክቱ ይችላሉ።
    reason: alternative_reading
  - marker: b
    text: ቃል በቃል፣ “ወደሚታየው/ወደ ግልጡ ሊመጣ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: ምክንያቱም
  rationale: የቀደመውን ንግግር ምክንያት ወይም ማብራሪያ አድርጎ የሚያገናኘውን የγάρ ተግባር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: κρυπτόν
  choice: የተሰወረ
  rationale: ቃሉ ከዓይን ወይም ከእውቀት የተሰወረውን ያመለክታል፤ ‘የተሰወረ’ መሠረታዊ ትርጉሙን ያቆያል።
- source_word: ἐὰν μὴ ἵνα
  choice: እንዲ… ካልሆነ በቀር
  rationale: የልዩነትን አገባብ ከἵνα የዓላማ ወይም የውጤት ኃይል ጋር በአማርኛ በተቀራረበ መንገድ ያስተላልፋል።
- source_word: φανερωθῇ
  choice: እንዲገለጥ
  rationale: የተሰወረው እንዲታወቅ ወይም በግልጽ እንዲታይ መደረጉን የሚያሳየውን ተገብሮ ቅርጽ ይጠብቃል።
- source_word: ἀπόκρυφον
  choice: የተደበቀ
  rationale: ከκρυπτόν ጋር ያለውን ትይዩነት ሳያጠፋ፣ ከእይታ የተሸሸገ መሆኑን በተለየ ቃል ያሳያል።
- source_word: ἐγένετο
  choice: አልነበረም
  rationale: በዚህ አገባብ አንድ ነገር ተደብቆ ወደ መኖር ሁኔታ መግባቱን በተፈጥሯዊ አማርኛ ያቀርባል፤ ቀጥተኛው ‘አልሆነም’ በአማርኛ እንግዳ ስለሚሰማ አልተመረጠም።
- source_word: ἔλθῃ εἰς φανερόν
  choice: ወደ ግልጥ እንዲወጣ
  rationale: የἔλθῃን የእንቅስቃሴ ምስልና የεἰς φανερόνን ‘ወደሚታይበት ስፍራ’ ሐሳብ ይጠብቃል።
theological_decisions:
- issue: በተደጋገሙት የἵνα ሐረጎች ውስጥ ያለው የዓላማና የውጤት ልዩነት
  choice: ‘እንዲገለጥ’ እና ‘እንዲወጣ’ በማለት የዓላማውን ኃይል በዋናው ጽሑፍ ማቆየት
  alternative: ‘በመጨረሻ ይገለጣል/ወደ ግልጥ ይወጣል’ በማለት እንደ ውጤት መተርጎም
  rationale: ἵνα በመደበኛነት ዓላማን ያመለክታል፣ በኮይኔ ግሪክ ግን ወደ ውጤት ሊያዘነብል ይችላል። ዋናው ትርጉም የዓላማውን ቅርጽ ይጠብቃል፤ የግርጌ ማስታወሻውም ሁለቱን ንባቦች ክፍት ያደርጋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለመደበኛ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ትይዩ አወቃቀሩና የመሰወር/መገለጥ ተቃርኖው ተጠብቀዋል።
