  rationale: የግሪኩን ጊዜ አመልካች አወቃቀር በተፈጥሯዊ አማርኛ ያቀርባል፤ θλῖψις የጭንቀትና የጫና ሁኔታን፣ διωγμός ደግሞ ስደትን ያመለክታል።
