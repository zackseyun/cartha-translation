translation_notes:
  register: ወቅታዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የእርሻው ምስልና “ቃል” የሚለው የአውድ ትስስር ተጠብቀዋል።
