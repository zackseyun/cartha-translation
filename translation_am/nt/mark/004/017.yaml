base_translation:
  language: en
  yaml_path: translation/nt/mark/004/017.yaml
  text: and they have no root in themselves[a], but are temporary; then, when affliction or persecution arises because of the word, they immediately fall away.
translation:
  language: am
  text: 'በራሳቸውም ውስጥ ሥር የላቸውም፤ ጊዜያዊ ብቻ ናቸው። ከዚያም በቃሉ ምክንያት መከራ ወይም ስደት ሲነሳ፣ ወዲያውኑ ይሰናከላሉ[a]።


    [a] ወይም፣ “ይወድቃሉ” ወይም “እንዲሰናከሉ ይደረጋሉ።” የግሪኩ ግስ አንድ ሰው በነገር ተሰናክሎ ወደ ኋላ የማለቱን ወይም ቅር ተሰኝቶ ፊቱን የማዞሩን ሐሳብም ሊያመለክት ይችላል።'
  philosophy: optimal-equivalence
  footnotes:
