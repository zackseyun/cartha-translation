    text: ወይም፣ “ይወድቃሉ” ወይም “እንዲሰናከሉ ይደረጋሉ።” የግሪኩ ግስ አንድ ሰው በነገር ተሰናክሎ ወደ ኋላ የማለቱን ወይም ቅር ተሰኝቶ ፊቱን የማዞሩን ሐሳብም ሊያመለክት ይችላል።
