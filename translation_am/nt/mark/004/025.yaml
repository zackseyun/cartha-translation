id: MRK.4.25
reference: Mark 4:25
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἔχει, δοθήσεται αὐτῷ· καὶ ὃς οὐκ ἔχει, καὶ ⸀ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/025.yaml
  text: For whoever has[a], more will be given to him; and whoever does not have, even what he has will be taken away from him.
translation:
  language: am
  text: ምክንያቱም ላለው ይሰጠዋል፤ ለሌለው ግን ያለው እንኳ ከእርሱ ይወሰዳል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃς
  choice: ላለው / ለሌለው
  rationale: የግሪኩ ያልተወሰነ አንጻራዊ አገላለጽ አጠቃላይና ምሳሌያዊ ኃይል አለው፤ በአማርኛ «ላለው/ለሌለው» ይህን በተፈጥሮ ያስተላልፋል።
- source_word: γὰρ
  choice: ምክንያቱም
  rationale: ከቀደመው ንግግር ጋር ያለውን የማብራሪያና የምክንያት ግንኙነት በግልጽ ይጠብቃል።
- source_word: ἔχει
  choice: አለው
  rationale: ቀላል የይዞታ አገላለጽ ሲሆን «አለው» በዘመናዊ አማርኛ ተፈጥሯዊና አጭር ነው።
- source_word: δοθήσεται αὐτῷ
  choice: ይሰጠዋል
  rationale: ግሪኩ የሚሰጠውን ነገር በግልጽ አይጠቅስም፤ አማርኛውም ያንኑ ክፍትነት በተፈጥሯዊ መንገድ ሊጠብቅ ይችላል።
- source_word: καὶ ὃς οὐκ ἔχει
  choice: ለሌለው ግን
  rationale: καὶ ሁለቱን ተቃራኒ ክፍሎች ያገናኛል፤ በአማርኛ «ግን» ተቃርኖውን ተፈጥሯዊ በሆነ ሁኔታ ያጎላል።
- source_word: καὶ ὃ ἔχει
  choice: ያለው እንኳ
  rationale: ከንግግሩ ተቃርኖ የሚመጣውን «እንኳ» የሚለውን አጽንዖት ይጠብቃል፤ የሚጠቀሰው ነገር ያልተወሰነ ሆኖ ይቀራል።
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: ከእርሱ ይወሰዳል
  rationale: የወደፊት ተደራጊ ቅርጹንና ከአንድ ሰው የመወገድን ትርጉም በቀጥታ ያስተላልፋል።
theological_decisions:
- issue: በ δοθήσεται ያልተገለጸውን ተሳቢ መሙላት
  choice: «ይሰጠዋል» በማለት ተሳቢውን ሳይጨምር መተርጎም
  alternative: «ተጨማሪ ይሰጠዋል»
  rationale: የግሪክ ጽሑፉ «ተጨማሪ» የሚል ቃል አልያዘም። አማርኛም ያልተገለጸውን ተሳቢ ሳይሞላ ተፈጥሯዊ ሆኖ መቅረብ ስለሚችል፣ የምንጩ አሻሚነትና የንግግሩ ውጥረት ተጠብቋል።
- issue: አጠቃላይ የወንድ ነጠላ አመልካች
  choice: «ላለው ... ከእርሱ» የሚለውን ነጠላ ቅርጽ መጠበቅ
  alternative: «ላላቸው ... ከእነርሱ» የሚል ብዙ ቁጥር
  rationale: ምንጩ ሰዋሰዋዊ ወንድ ነጠላ ቅርጽን በአጠቃላይ ኃይል ይጠቀማል፤ አማርኛው ይህን ነጠላነት ሳያጣ አጠቃላይ አባባሉን ያስተላልፋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ቀላል የሆነ የምሳሌ አባባል ቅኝት ተጠብቋል። በምንጩ የሌለው «ተጨማሪ» አልተጨመረም፤ ስለዚህ የግሪኩን አጭርነትና ክፍት ማጣቀሻ ይጠብቃል።
