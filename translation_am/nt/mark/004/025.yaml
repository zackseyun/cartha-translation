review_pass:
  verdict: approve
  source_fidelity: The rendering accurately preserves the generic proverbial construction, the explanatory force of γάρ, the unexpressed object of δοθήσεται, the emphatic «even what he has,» and the future passive removal «will be taken away from him.» The Amharic does not add «more,» appropriately retaining the Greek’s ellipsis.
  naturalness: The phrasing is concise, idiomatic modern standard Amharic and suitably proverbial in register. «ላለው … ለሌለው ግን» and «ያለው እንኳ» communicate the contrast naturally.
  terminology: No specialized theological term occurs. The generic singular construction is retained without introducing an unwarranted doctrinal interpretation. «ከእርሱ ይወሰዳል» clearly renders removal from the person concerned.
  issues: []
  revised_text: ምክንያቱም ላለው ይሰጠዋል፤ ለሌለው ግን ያለው እንኳ ከእርሱ ይወሰዳል።
  revised_footnotes: []
  revision_rationale: No safe correction is needed. In particular, retaining the unstated thing given is both natural in Amharic and closer to the Greek than importing «ተጨማሪ» (“more”). No footnote is required because the Amharic wording does not supply that implicit object.
