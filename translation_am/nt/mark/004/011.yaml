source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Ὑμῖν ⸂τὸ μυστήριον δέδοται⸃ τῆς βασιλείας τοῦ θεοῦ· ἐκείνοις δὲ τοῖς ἔξω ἐν παραβολαῖς τὰ πάντα γίνεται,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/011.yaml
  text: And he was saying to them, “To you the mystery of the kingdom of God has been given, but to those outside everything comes in parables,”
translation:
  language: am
  text: እርሱም እንዲህ ይላቸው ነበር፤ “ለእናንተ የእግዚአብሔር መንግሥት ምሥጢሩ ተሰጥቷችኋል፤ ለእነዚያ በውጭ ላሉት ግን ሁሉ ነገር በምሳሌዎች ይሆናል።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μυστήριον
  choice: ምሥጢር
  rationale: ቃሉ ቀድሞ ተሰውሮ አሁን በመገለጥ የሚታወቅን መለኮታዊ እውነት ሊያመለክት ስለሚችል፣ የግሪኩን ስፋት የሚጠብቅ የተለመደ ቃል ተመርጧል።
- source_word: τοῖς ἔξω
  choice: በውጭ ላሉት
  rationale: ከደቀ መዛሙርቱ ክበብ ውጭ ያሉትን የሚያመለክተውን የቦታና የቡድን አሻሚነት ይጠብቃል።
- source_word: ἐν παραβολαῖς
  choice: በምሳሌዎች
  rationale: παραβολή የንጽጽር ታሪክን፣ ምሳሌያዊ ንግግርንና እንቆቅልሻዊ አባባልን ሊያካትት ስለሚችል፣ በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የታወቀው ቃል ተመርጧል።
- source_word: γίνεται
  choice: ይሆናል
  rationale: ቃሉን ‘ነው’ ብሎ በማረጋጋት ፈንታ የመሆን፣ የመድረስ ወይም የመቅረብ እንቅስቃሴውን በቀጥታ ይጠብቃል።
- source_word: ἔλεγεν
  choice: ይላቸው ነበር
  rationale: ያልተፈጸመውን ወይም ቀጣይነት ያለውን የግሪክ ያለፈ ጊዜ ገጽታ በተፈጥሯዊ አማርኛ ያንጸባርቃል።
theological_decisions:
- issue: የመንግሥቱ ምሥጢር ለደቀ መዛሙርቱ መሰጠቱ
  choice: “ምሥጢር ተሰጥቷችኋል” በሚለው ተገብሮ አገባብ ተተርጉሟል።
  alternative: “ምሥጢሩን እንድታውቁ ተፈቅዶላችኋል”
  rationale: ግሪኩ የተሰጠውን ነገር ‘ምሥጢሩ’ ራሱ እንደሆነ ይናገራል፤ ‘እንድታውቁ’ ማለት ትርጓሜያዊ ማብራሪያን ይጨምራል።
- issue: “በውጭ ላሉት” የሚለው መለያ
  choice: ማንን ወይም ከምን ውጭ እንደሆኑ ሳይገለጽ ቀርቷል።
  alternative: “ከደቀ መዛሙርቱ ውጭ ላሉት”
  rationale: የምንጩን አጭርነትና አሻሚነት ለመጠበቅ፣ ጽሑፉ ያልገለጸው የቡድን ወሰን አልተጨመረም።
- issue: ሁሉ ነገር በምሳሌዎች የሚሆንበት መንገድ
  choice: “ሁሉ ነገር በምሳሌዎች ይሆናል”
  alternative: “ሁሉ ነገር በምሳሌዎች ይነገራቸዋል”
  rationale: “ይነገራቸዋል” ከዐውዱ የሚገባ ቢሆንም፣ γίνεται ያለውን ሰፊና ትንሽ አሻሚ አገላለጽ ያጠባል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “እግዚአብሔር” እና “ምሥጢር” የተለመዱ መጽሐፍ ቅዱሳዊ ቃላት ሲሆኑ፣ የአረፍተ ነገሩ አወቃቀር ግን በዘመናዊ አማርኛ ተፈጥሯዊ እንዲሆን ተደርጓል።
