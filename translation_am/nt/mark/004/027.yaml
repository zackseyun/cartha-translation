  yaml_path: translation/nt/mark/004/027.yaml
  text: and he sleeps and rises night and day[a], and the seed sprouts and grows[b], though he himself does not know how.
translation:
  language: am
  text: ሌሊትና ቀን ይተኛል፣ ይነሣልም፤ ዘሩም እርሱ እንዴት እንደሆነ ሳያውቅ ይበቅልና ያድጋል[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ያድጋል” የተባለው “ይረዝማል” ወይም “ቁመቱ ይጨምራል” ተብሎም ሊተረጎም ይችላል፤ የግሪክኛው ሁለተኛ ግስ በተለይ መርዘምን ወይም በቁመት መጨመርን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεύδῃ
  choice: ይተኛል
  rationale: በምሳሌው ውስጥ ተደጋጋሚና ቀጣይ ድርጊትን የሚገልጠውን የአሁን ጊዜ ንዑስ አንቀጽ በተፈጥሯዊ የአማርኛ አገላለጽ ያስተላልፋል።
- source_word: ἐγείρηται
  choice: ይነሣል
  rationale: እዚህ ግሱ ከእንቅልፍ መነሣትን የሚያመለክት ኢ-ተሻጋሪ አጠቃቀም ነው፤ የትንሣኤ ትርጉም እንዳይጫንበት አውዱ ያብራራዋል።
- source_word: νύκτα καὶ ἡμέραν
  choice: ሌሊትና ቀን
  rationale: የጊዜን ቀጣይ ዑደት የሚገልጠውን ግሪክኛ ፈሊጥ በተለመደና ምጥን አማርኛ ይጠብቃል።
- source_word: ὁ σπόρος
  choice: ዘሩ
  rationale: የተወሰነው መስተዋድድ ቀደም ብሎ በምሳሌው የተዘራውን ዘር መመለሱን በአማርኛው የባለቤት ቅጥያ ያሳያል።
