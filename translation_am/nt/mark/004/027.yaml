  rationale: የተክል ዕድገት መጀመሪያ የሆነውን መብቀል በግልጽና ተፈጥሯዊ ቃል ይገልጣል።
- source_word: μηκύνηται
  choice: ያድጋል
  rationale: ግሱ በመርዘም ወይም በቁመት መጨመርን በተለይ ሊያመለክት ቢችልም፣ በዚህ የተክል አውድ ‘ያድጋል’ ተፈጥሯዊና ግልጽ ነው፤ የተለየው ጥላ ትርጉም በግርጌ ማስታወሻ ተጠብቋል።
- source_word: ὡς οὐκ οἶδεν αὐτός
  choice: እሱ እንዴት እንደሆነ ሳያውቅ
