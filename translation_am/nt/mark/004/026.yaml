  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Καὶ ἔλεγεν· Οὕτως ἐστὶν ἡ βασιλεία τοῦ θεοῦ ⸀ὡς ἄνθρωπος βάλῃ τὸν σπόρον ἐπὶ τῆς γῆς
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/026.yaml
  text: 'And he was saying[c][b][a], “The kingdom of God is like this: as when a man casts the seed upon the ground,”'
translation:
  language: am
  text: እንዲህም ይል ነበር፦ “የእግዚአብሔር መንግሥት እንዲህ ናት፤ አንድ ሰው ዘርን በመሬት ላይ ቢበትን፣[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የእግዚአብሔር መንግሥት አንድ ሰው በመሬት ላይ ዘር እንደሚዘራ ናት።” በግሪኩ የታመቀው ንጽጽር በሚቀጥለው ቁጥር ይቀጥላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: ይል ነበር
  rationale: ያልተጠናቀቀው የግሪክ ግስ በትረካው ውስጥ የቀጠለ ወይም የተደጋገመ ንግግርን ሊያመለክት ስለሚችል፣ ይህ አተረጓጎም የግሱን ገጽታ ይጠብቃል።
- source_word: Οὕτως
  choice: እንዲህ
  rationale: ምሳሌያዊውን ንጽጽር በተፈጥሯዊና በዘመናዊ አማርኛ ያስገባል።
- source_word: βασιλεία τοῦ θεοῦ
  choice: የእግዚአብሔር መንግሥት
  rationale: መንግሥት የንጉሣዊ አገዛዝንም ሆነ የግዛት ስፍራን ሊያመለክት የሚችል፣ በወንጌላት አውድ የታወቀና ተገቢ ቃል ነው።
- source_word: ὡς ἄνθρωπος
  choice: አንድ ሰው … ቢበትን
  rationale: ὡς የሚያስገባውን የታመቀ ንጽጽር በአማርኛ ሁኔታዊ ግስ ይገልጻል፤ ሰው ደግሞ ወንድ ተወካይ ገጸ ባሕርይን በተፈጥሯዊ መንገድ ያመለክታል።
- source_word: βάλῃ
  choice: ቢበትን
  rationale: βάλλω በመሠረቱ መጣልን ወይም መበተንን ያመለክታል፤ በዚህ የእርሻ አውድ ዘርን በመበተን መዝራትን የሚገልጽ ተፈጥሯዊ ምርጫ ነው።
- source_word: τὸν σπόρον
  choice: ዘርን
  rationale: በአማርኛ ዘር በዚህ አውድ በአጠቃላይ ስለሚነገር ያለ አመልካች መተርጎሙ ተፈጥሯዊ ነው።
- source_word: ἐπὶ τῆς γῆς
  choice: በመሬት ላይ
  rationale: γῆ እዚህ የእርሻ መሬትን እንጂ ዓለምን አያመለክትም፤ ሐረጉም ἐπίን በግልጽ ሁኔታ ያሳያል።
theological_decisions:
- issue: ከቁጥር 27 ጋር የሚቀጥለውን የታመቀ ንጽጽር አቀራረብ
  choice: “እንዲህ ናት፤ አንድ ሰው … ቢበትን” በማለት ንጽጽሩን ክፍት አድርጎ መተው
  alternative: “አንድ ሰው በመሬት ላይ ዘር እንደሚዘራ ናት” በማለት በዚህ ቁጥር ውስጥ የተሟላ አረፍተ ነገር ማድረግ
  rationale: የግሪኩ ንጽጽር በቁጥር 27 ይቀጥላል። ሁኔታዊው አቀራረብና ኮማው ይህን ፍሰት ይጠብቃሉ፣ በምንጩ የሌለ ማብራሪያም አይጨምሩም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ይል ነበር” የትረካውን ቀጣይ ገጽታ ይጠብቃል፤ “ቢበትን” ደግሞ የዘር መዝራቱን ምስልና ወደሚቀጥለው ቁጥር የሚዘረጋውን ሰዋሰዋዊ ክፍትነት ያስቀራል።
