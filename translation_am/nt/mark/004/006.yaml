base_translation:
  language: en
  yaml_path: translation/nt/mark/004/006.yaml
  text: And when the sun rose[a], it was scorched, and because it had no root, it withered.
translation:
  language: am
  text: ፀሐይም ስትወጣ ተቃጠለ፤ ሥር ስላልነበረውም ጠወለገ[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ደረቀ።” የግሪክኛው ግስ መድረቅን ወይም መጠውለግን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὅτε ἀνέτειλεν ὁ ἥλιος
  choice: ፀሐይም ስትወጣ
  rationale: የግሪክኛውን ቀላል የትረካ ትስስርና ጊዜ አመልካች ሐረግ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐκαυματίσθη
  choice: ተቃጠለ
  rationale: በፀሐይ ሙቀት መጎዳትን የሚገልጸውን የግሪክኛውን ተገብሮአዊ ትርጉም በአጭርና ተፈጥሯዊ ቃል ይገልጻል።
- source_word: διὰ τὸ μὴ ἔχειν ῥίζαν
  choice: ሥር ስላልነበረውም
  rationale: διά ከዓርቲክላዊ የግስ ስም ጋር የሚገልጸውን ምክንያት ይጠብቃል፤ የነጠላውን ῥίζανም ‘ሥር’ ብሎ ያቀርባል።
- source_word: ἐξηράνθη
  choice: ጠወለገ
  rationale: ተክሉ እርጥበቱን አጥቶ መጠውለጉን በተፈጥሯዊ የእርሻ ምስል ይገልጻል፤ ‘ደረቀ’ የሚለው ደግሞ ትክክለኛ የቃል አማራጭ ነው።
