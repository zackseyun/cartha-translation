id: MRK.4.16
reference: Mark 4:16
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ οὗτοί εἰσιν ⸀ὁμοίως οἱ ἐπὶ τὰ πετρώδη σπειρόμενοι, οἳ ὅταν ἀκούσωσιν τὸν λόγον ⸀εὐθὺς μετὰ χαρᾶς λαμβάνουσιν αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/016.yaml
  text: 'And these are likewise the ones sown on the rocky ground: when they hear the word[a], they immediately receive it with joy,'
translation:
  language: am
  text: እንዲሁም በድንጋያማው መሬት የተዘሩት እነዚህ ናቸው፤ ቃሉን በሰሙ ጊዜ ወዲያው በደስታ ይቀበሉታል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμοίως
  choice: እንዲሁም
  rationale: ከቀደመው የምሳሌው ማብራሪያ ጋር ያለውን ተመሳሳይነትና የንግግሩን ትስስር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐπὶ τὰ πετρώδη
  choice: በድንጋያማው መሬት
  rationale: በምሳሌው ውስጥ ድንጋይ የበዛበትን የዘር ቦታ በተለመደና ግልጽ አማርኛ ይገልጣል።
- source_word: σπειρόμενοι
  choice: የተዘሩት
  rationale: የመዝራቱን ምስል ሳይተረጉም ይጠብቃል፤ በዐውዱም ዘሩ የሚወክላቸውን ሰዎች ያመለክታል።
- source_word: τὸν λόγον
  choice: ቃሉን
  rationale: በቅርብ ዐውዱ የተሰበከውን ቃል ያመለክታል፤ የምሳሌውን ተደጋጋሚ ቃላትም ይጠብቃል።
- source_word: εὐθύς
  choice: ወዲያው
  rationale: የግሪኩን ፈጣንነት በተፈጥሯዊና ቀጥተኛ አማርኛ ይገልጣል።
- source_word: μετὰ χαρᾶς
  choice: በደስታ
  rationale: ቃሉን የሚቀበሉበትን ስሜትና ሁኔታ በቀጥታ ያስተላልፋል።
- source_word: λαμβάνουσιν αὐτόν
  choice: ይቀበሉታል
  rationale: መስማትን ተከትሎ ቃሉን መቀበልን ይገልጣል፤ ዘላቂ እምነት እንዳላቸው ከጽሑፉ በላይ አያስረግጥም።
theological_decisions:
- issue: “የተዘሩት” የሚለው አገላለጽ የሚያመለክታቸው
  choice: “በድንጋያማው መሬት የተዘሩት” የሚለውን የምሳሌውን አገላለጽ መጠበቅ
  alternative: “ልባቸው እንደ ድንጋያማ መሬት የሆኑ ሰዎች” ብሎ በትርጓሜ ማቅረብ
  rationale: ግሪኩ የመዝራትን ምስል እየጠበቀ በዘሩ የተወከሉትን ሰዎች ይጠቁማል፤ ስለ ልብ የሚጨመር ማብራሪያ በጽሑፉ ውስጥ የለም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የመዝራት ምስሉና የማርቆስ ፈጣን የትረካ ቅላፄ ተጠብቀዋል። በተሰጠው የእንግሊዝኛ ጽሑፍ የእግር ማስታወሻ [a] ምልክት ከ‘the word’ በኋላ ቢታይም፣ የማስታወሻው ይዘት የἐπὶ τὰ πετρώδη አማራጭ አተረጓጎሞችን ብቻ ይገልጣል። አማርኛው ‘በድንጋያማው መሬት’ በማለት ትርጉሙን በቂ ስለሚያሳይና ተጨማሪው አማራጭ ልዩ የትርጉም መረጃ ስለማይጨምር፣ የእግር ማስታወሻ አልተጨመረም።
