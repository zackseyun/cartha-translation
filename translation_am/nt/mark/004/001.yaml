    text: ወይም፣ “ወደ እርሱ እየተሰበሰበ ነው።” ማርቆስ ትረካውን ሕያው ለማድረግ ያለፈውን ክስተት በአሁን ጊዜ መግለጹ የተለመደ ነው።
