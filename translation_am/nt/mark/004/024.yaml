  text: καὶ ἔλεγεν αὐτοῖς· Βλέπετε τί ἀκούετε. ἐν ᾧ μέτρῳ μετρεῖτε μετρηθήσεται ὑμῖν καὶ προστεθήσεται ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/024.yaml
  text: And he was saying to them[a], “Pay attention to what you hear. With the measure you use, it will be measured to you[b], and more will be added to you.”
translation:
  language: am
  text: እርሱም እንዲህ ይላቸው ነበር፦ “የምትሰሙትን ልብ ብላችሁ ስሙ። በምትሰፍሩበት መስፈሪያ ይሰፈርላችኋል፤ ደግሞም ይጨመርላችኋል[a]።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ይጨመርላችኋል” የሚለውን አንዳንዶች፣ የኢየሱስን ትምህርት ለሚቀበሉ የበለጠ መረዳት ይሰጣቸዋል ማለት እንደሆነ ይረዱታል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: ይላቸው ነበር
  rationale: የግሱን የኢምፐርፌክት አስፔክት፣ ማለትም በዚያን ጊዜ የቀጠለ ወይም የተደጋገመ ንግግር መሆኑን፣ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Βλέπετε
  choice: ልብ ብላችሁ አድምጡ
  rationale: ቃሉ በቀጥታ ‘ተመልከቱ’ ቢልም፣ እዚህ ለጥንቃቄና ለትኩረት የሚቀርብ ትእዛዝ ነው፤ ከመስማት ጋርም በአማርኛ በተፈጥሮ ይጣጣማል።
- source_word: τί ἀκούετε
  choice: የምትሰሙትን
  rationale: τί ቀጥተኛ ተሳቢ ስለሆነ ‘ምን/የምትሰሙትን’ ይሆናል፤ የሉቃስን ‘እንዴት እንደምትሰሙ’ አገላለጽ ወደ ማርቆስ አያስገባም።
- source_word: ἐν ᾧ μέτρῳ μετρεῖτε
  choice: በምትሰፍሩበት መስፈሪያ
  rationale: የመለኪያውን ምሳሌያዊ ምስልና የመስፈርቱን ወይም የመሣሪያውን ሐሳብ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: μετρηθήσεται ὑμῖν
  choice: ይሰፈርላችኋል
  rationale: የወደፊት ጊዜ ተደራጊ ቅርጽንና የምላሽ መርሕን ይጠብቃል፤ በግሪክ የሌለውን ‘መልሶ’ የሚል ትርጓሜ አይጨምርም።
- source_word: προστεθήσεται ὑμῖν
  choice: ደግሞም ይጨመርላችኋል
  rationale: የግሱን ‘መጨመር’ መሠረታዊ ትርጉም ይጠብቃል፤ የሚጨመረው ነገር በግሪክ ስላልተገለጸ በዋናው ጽሑፍ አይወሰንም።
theological_decisions:
- issue: የመስፈርና የምላሽ ንግግሩ ትርጓሜ
  choice: ንግግሩ ከኢየሱስ ትምህርት መስማት አውድ ጋር እንዳለ ሰፊ የምላሽ መርሕ ተተርጉሟል፤ አንድ ጠባብ ትርጓሜ አልተጫነበትም።
  alternative: ይህን በፍርድ፣ በልግስና፣ ወይም በመንፈሳዊ መረዳት ብቻ ማወሰን።
  rationale: ቅርብ አውዱ መስማትንና የኢየሱስን መልእክት መቀበልን ይመለከታል፤ ሆኖም ምሳሌው ፍርድን፣ ልግስናን ወይም ግብይታዊ ብድራትን ብቻ እንዲያመለክት ትርጉሙ አያስገድድም።
- issue: የሚጨመረው ነገር
  choice: በዋናው ጽሑፍ ተሳቢው ሳይሞላ ‘ይጨመርላችኋል’ ተብሏል።
  alternative: ‘የበለጠ መረዳት ይጨመርላችኋል’ ብሎ በግልጽ መወሰን።
  rationale: ዐውዱ የመረዳትን ጭማሪ ሊጠቁም ቢችልም፣ የግሪኩ ጽሑፍ የሚጨመረውን ነገር በስም አይገልጽም፤ ስለዚህ አሻሚነቱ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘መስፈሪያ/መስፈር’ የሚለው የታወቀውን መጽሐፍ ቅዱሳዊ ምሳሌ ጠብቆ በአሁኑ ቋንቋ የሚገባ ነው። በቀረበው የእንግሊዝኛ አማካሪ ጽሑፍ የ[a] ማስታወሻ ይዘት ከዋናው ንባብ ጋር የተመሳሰለ ስለማይመስል፣ በምንጭ ግሪክ የተደገፈው የትርጓሜ ማስታወሻ ብቻ ተካቷል።
