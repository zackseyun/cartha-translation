  text: καὶ ὅταν σπαρῇ, ἀναβαίνει καὶ γίνεται ⸂μεῖζον πάντων τῶν λαχάνων⸃ καὶ ποιεῖ κλάδους μεγάλους, ὥστε δύνασθαι ὑπὸ τὴν σκιὰν αὐτοῦ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/032.yaml
  text: and when it is sown[a], it comes up and becomes larger than all the garden plants, and it produces large branches[b], so that the birds of the sky are able to nest under its shade.
translation:
  language: am
  text: ሲዘራም ይበቅላል፤ ከጓሮ ተክሎች ሁሉ ይልቅ ትልቅ ይሆናል፤ ትላልቅ ቅርንጫፎችንም ያወጣል። ስለዚህ የሰማይ ወፎች[a] በጥላው ሥር ጎጆ ሊሠሩ[b] ይችላሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የሰማይ ወፎች” የሚለው “የአየር ወፎች” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “ጎጆ ሊሠሩ” የሚለው “ሊኖሩ” ወይም “ሊሰፍሩ” ተብሎም ሊተረጎም ይችላል። አገላለጹ ወፎች በታላቅ ዛፍ ቅርንጫፎች ወይም በጥላው ውስጥ መጠጊያ ሲያገኙ የሚያሳዩትን የብሉይ ኪዳን ምስሎች ሊያስታውስ ይችላል (ለምሳሌ፣ ሕዝ 17፥23፤ ዳን 4፥12)።
    reason: cross_reference
lexical_decisions:
- source_word: σπαρῇ
  choice: ሲዘራ
  rationale: ከὅταν ጋር ያለው የአኦሪስት ተደራጊ ንዑስ አንቀጽ ያልተወሰነ ጊዜን፣ ‘በሚዘራበት ጊዜ’ የሚለውን ያሳያል። ‘ሲዘራ’ የዘር ምሳሌውን የግብርና ቃላት ይጠብቃል።
- source_word: ἀναβαίνει
  choice: ይበቅላል
  rationale: በግብርና አውድ ከመሬት ወጥቶ ማደግን ያመለክታል፤ ‘ይበቅላል’ ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: γίνεται
  choice: ይሆናል
  rationale: ተክሉ በማደግ የሚደርስበትን ውጤታዊ ሁኔታ ያሳያል።
- source_word: μεῖζον πάντων τῶν λαχάνων
  choice: ከጓሮ ተክሎች ሁሉ ይልቅ ትልቅ
  rationale: λάχανα ዛፎችን ሳይሆን በጓሮ የሚበቅሉ ዕፅዋትን ያመለክታል። ‘የጓሮ ተክሎች’ ከ‘አትክልቶች’ ይልቅ ሰፊ ሲሆን የንጽጽር አወቃቀሩንም ይጠብቃል።
- source_word: ποιεῖ κλάδους μεγάλους
  choice: ትላልቅ ቅርንጫፎችንም ያወጣል
  rationale: ποιέω ከκλάδους ጋር ሲመጣ ቅርንጫፎችን ማውጣትን ይገልጣል፤ ይህ አገላለጽ ከቃል በቃል ‘ይሠራል’ ይልቅ ተፈጥሯዊ ነው።
- source_word: ὥστε δύνασθαι
  choice: ስለዚህ … ሊሠሩ ይችላሉ
  rationale: የውጤት ግንኙነቱን በግልጽና ተፈጥሯዊ የአማርኛ አወቃቀር ያሳያል።
- source_word: ὑπὸ τὴν σκιὰν αὐτοῦ
  choice: በጥላው ሥር
  rationale: σκιά ጥላ ወይም ጥላ የሚሰጥ መጠጊያን ሊያመለክት ይችላል፤ በዚህ አውድ ‘በጥላው ሥር’ ተፈጥሯዊ ነው።
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: የሰማይ ወፎች
  rationale: οὐρανόςን በቅርብ የሚያንጸባርቅና መጽሐፍ ቅዱሳዊውን ምስል የሚጠብቅ አገላለጽ ነው። ‘የአየር ወፎች’ አማራጭ በማስታወሻ ቀርቧል።
- source_word: κατασκηνοῦν
  choice: ጎጆ ሊሠሩ
  rationale: ቃሉ መኖርን፣ መስፈርን ወይም መጠለልን ሊገልጥ ይችላል። ከወፎችና ከቅርንጫፎች ጋር ‘ጎጆ ሊሠሩ’ ምስሉን በተፈጥሯዊ አማርኛ ያቀርባል፤ ሰፊው ትርጉም በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: ወፎች በቅርንጫፎች መጠጊያ የማግኘታቸው ከብሉይ ኪዳን ጋር ያለው ምስላዊ ግንኙነት
  choice: ምስሉን በዋናው ጽሑፍ በቀጥታ ማቅረብና ሊኖረው የሚችለውን የብሉይ ኪዳን ዳራ በማስታወሻ መጠቆም
  alternative: κατασκηνοῦνን ‘ሊኖሩ’ ብሎ በይበልጥ መደበኛ መንገድ በመተርጎም የሕዝቅኤልና የዳንኤልን የመንግሥት-ዛፍ ምስል በግልጽ ማስቀረት
  rationale: የግሪክ ጽሑፉ ምስሉን ያቀርባል እንጂ ትርጓሜውን በግልጽ አይወስንም። ስለዚህ ዋናው ጽሑፍ ሥነ መለኮታዊ ማንነትን አያስገባም፤ ሊኖር የሚችለውን ጥቅስ-አገናኝ ግን ማስታወሻው ይጠብቃል።
