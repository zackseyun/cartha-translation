  text: Καὶ λέγει αὐτοῖς ἐν ἐκείνῃ τῇ ἡμέρᾳ ὀψίας γενομένης· Διέλθωμεν εἰς τὸ πέραν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/035.yaml
  text: And he says to them on that day[a], when evening had come, “Let us go across to the other side.”
translation:
  language: am
  text: በዚያም ቀን ማታ ሲሆን፣ “ወደ ማዶ እንሻገር” አላቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: አላቸው
  rationale: የማርቆስን ታሪካዊ የአሁን ጊዜ አጠቃቀም በአማርኛ ቃል በቃል በአሁን ጊዜ ማቅረብ ትረካውን ያልተፈጥሯዊ ስለሚያደርገው፣ ተፈጥሯዊው ያለፈ ጊዜ ተመርጧል።
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: በዚያም ቀን
  rationale: ጊዜን የሚያመለክተውን ሐረግ በተፈጥሯዊና ግልጽ አማርኛ ይገልጻል፤ ‘ም’ ደግሞ ከቀደመው ትረካ ጋር ያገናኛል።
- source_word: ὀψίας γενομένης
  choice: ማታ በሆነ ጊዜ
  rationale: የግሪኩን ጄኒቲቭ አብሶሉት የጊዜ ትርጉም በቀላልና ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: Διέλθωμεν
  choice: እንሻገር
  rationale: የመጀመሪያ መደብ ብዙ ቁጥር አበረታች ሰብጃንክቲቭን ‘እን…’ በሚለው ተፈጥሯዊ የአማርኛ አወቃቀር ይገልጻል።
- source_word: εἰς τὸ πέραν
  choice: ወደ ማዶ
  rationale: በሐይቁ አውድ የተቃራኒውን ወገን በአጭርና ተፈጥሯዊ አማርኛ ያመለክታል።
theological_decisions: []
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ የትረካ ቋንቋ ተጠቅሟል። ጥቅሱ በአንድ ተፈጥሯዊ አማርኛ ዓረፍተ ነገር ቀርቧል። በተሰጠው የእንግሊዝኛ ንባብ የግርጌ ማስታወሻ ምልክት ከሚያብራራው አማራጭ ጋር የማይጣጣም ስለሆነ፣ ከግሪኩ የሚነሳ አስፈላጊ የግርጌ ማስታወሻ አልተጨመረም።
