  text: ከዚያም ታላቅ ዐውሎ ነፋስ ተነሣ፤[a] ማዕበሎቹም ጀልባዋን እየመቱ ወደ ውስጧ ይገቡ ነበር፤[b] ስለዚህም ጀልባዋ ቀድሞውኑ በውኃ እየሞላች ነበር።[c]
