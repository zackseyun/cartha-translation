  - marker: b
    text: ወይም፣ “ማዕበሎቹ ወደ ጀልባዋ ውስጥ ይገቡ ነበር።” የግሪኩ ያልተጠናቀቀ የግስ ቅርጽ ተደጋጋሚ ድርጊትን ያሳያል።
