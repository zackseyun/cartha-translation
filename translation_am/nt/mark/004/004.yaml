  text: And as he was sowing[a], some seed fell along the path, and the birds came and devoured it.
translation:
  language: am
  text: እርሱም ሲዘራ፣ ከዘሩ አንዳንዱ በመንገድ ዳር[a] ወደቀ፤ ወፎችም መጥተው ጨርሰው በሉት።
  philosophy: optimal-equivalence
  footnotes:
