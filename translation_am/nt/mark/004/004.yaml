lexical_decisions:
- source_word: ἐγένετο ἐν τῷ σπείρειν
  choice: እርሱም ሲዘራ
  rationale: የግሪክኛው የትረካ አገላለጽ ድርጊቱ በመካሄድ ላይ ሳለ የተፈጠረውን ያሳያል፤ «ሲዘራ» ይህን ጊዜያዊ ግንኙነት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὃ μὲν
  choice: ከዘሩ አንዳንዱ
  rationale: ይህ አገላለጽ ከሚዘራው ዘር አንድ ክፍልን በክፍፍል ያመለክታል፤ በአማርኛ ግልጽ እንዲሆን «ከዘሩ» ተጨምሯል።
- source_word: ἔπεσεν
  choice: ወደቀ
  rationale: በዚህ የመዝራት አውድ ውስጥ πίπτωን ቀጥተኛና ተፈጥሯዊ በሆነ መንገድ ይተረጉማል።
- source_word: παρὰ τὴν ὁδόν
  choice: በመንገድ ዳር
  rationale: παρά ከተሳቢ አገባብ ጋር እዚህ ከመንገዱ አጠገብ ያለውን ስፍራ ያመለክታል፤ «መንገድ» ከእርሻው ምስል ጋር ይስማማል።
- source_word: τὰ πετεινὰ
  choice: ወፎች
  rationale: የግሪክኛው ቃል እዚህ ያለ ተጨማሪ መግለጫ በአጠቃላይ ወፎችን ያመለክታል።
- source_word: κατέφαγεν
  choice: ጨርሰው በሉት
  rationale: κατεσθίω ከተራው «መብላት» የበረታ ኃይል አለው፤ «ጨርሰው በሉት» ዘሩን ሙሉ በሙሉ መብላታቸውን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: αὐτό
  choice: -ት (በሉት)
  rationale: ተውላጠ ስሙ በክፍልነት የተጠቀሰውን ዘር ያመለክታል፤ በአማርኛ ከግሱ ጋር በተያያዘው «-ት» ተወክሏል።
