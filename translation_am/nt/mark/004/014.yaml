  text: The sower sows the word[a].
translation:
  language: am
  text: ዘሪው ቃሉን[a] ይዘራል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «መልእክቱን»። የግሪክኛው λόγος የሚለው ቃል እንደ አውዱ «ቃል» ወይም «መልእክት» ማለት ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ σπείρων
  choice: ዘሪው
  rationale: በግሪክኛው የተወሰነው የአሁን ጊዜ አድራጊ ቅጽ እንደ ስም ሆኖ በመዝራት የሚታወቀውን ሰው ያመለክታል። «ዘሪው» አጭርና ተፈጥሯዊ ሲሆን የምሳሌውን ምስል ይጠብቃል፤ «ገበሬው» ግን ጽሑፉ ከሚለው በላይ ሙያን ይጨምራል።
- source_word: τὸν λόγον
  choice: ቃሉን
  rationale: λόγος እንደ አውዱ «ቃል» ወይም «መልእክት» ሊሆን ይችላል። «ቃሉን» የግሪክኛውን ቅርብ አገላለጽ ይጠብቃል፣ ከአዋጅም ጋር ያለውን ግንኙነት ሳያጠብ ያስቀምጣል።
- source_word: σπείρει
  choice: ይዘራል
  rationale: የአሁን ጊዜ አመልካች ቅጹ በምሳሌያዊው ማብራሪያ አጠቃላይ ድርጊትን ይገልጣል። «ይዘራል» ይህን ያሳያል፤ «ዘሪው—ይዘራል» የሚለውም በግሪክኛው ያለውን የአንድ ሥር ቃላት ድግግሞሽ ይጠብቃል።
theological_decisions:
- issue: በምሳሌው ማብራሪያ ውስጥ «ቃሉ» የሚያመለክተው
  choice: በዋናው ጽሑፍ «ቃሉን» ተብሎ ብቻ ተተርጉሟል።
  alternative: «መልእክቱን» ወይም «የእግዚአብሔርን ቃል»
  rationale: የግሪክኛው ጽሑፍ τὸν λόγον ብቻ ይላል። ሰፊው አውድ የታወጀ መለኮታዊ መልእክትን ቢያመለክትም፣ «የእግዚአብሔር» ወይም «ወንጌል» ብሎ መጨመር በዚህ ቁጥር በግልጽ ያልተጻፈውን ይጨምራል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። አጭሩ አወቃቀርና የ«ዘሪው—ይዘራል» ድግግሞሽ የምንጩን ቀጥተኛና ምሳሌያዊ ኃይል ይጠብቃሉ።
