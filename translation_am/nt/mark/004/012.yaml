base_translation:
  language: en
  yaml_path: translation/nt/mark/004/012.yaml
  text: so that seeing they may see and not perceive[a], and hearing they may hear and not understand[c][b], lest they turn back and it be forgiven them.
translation:
  language: am
  text: “ይህም እያዩ እንዲያዩ፣ ነገር ግን እንዳያስተውሉ[a]፤ እየሰሙም እንዲሰሙ፣ ነገር ግን እንዳይገባቸው[c]፤ እንዳይመለሱ[b]ና ይቅር እንዳይባልላቸው ነው።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እንዳይለዩ።”
    reason: lexical_alternative
  - marker: b
    text: “እንዳይመለሱ” የሚለው “ዘወር እንዳይሉ” ተብሎም፣ በዚህ አውድ ደግሞ “ንስሐ እንዳይገቡ” ተብሎ ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: c
    text: ኢየሱስ ኢሳይያስ 6፥9–10ን እያስተጋባ ነው፤ ንግግሩም በመለኮታዊ ፍርድና ሕዝቡ ምላሽ ባለመስጠቱ መካከል ያለውን ውጥረት እንዳለ ይጠብቃል።
    reason: cross_reference
lexical_decisions:
- source_word: ἵνα
  choice: ይህም … እንዲ… ነው
  rationale: የግሪኩን የዓላማ/የውጤት ኃይል በተፈጥሯዊ የአማርኛ አገባብ ያቆያል፤ የጥቅሱን አስቸጋሪ ውጥረት አያለዝብም።
- source_word: βλέποντες βλέπωσι
  choice: እያዩ እንዲያዩ
  rationale: ተሳቢውንና ዋናውን ግስ ሁለቱንም በመተርጎም የድግግሞሹን አጽንዖትና ፓራዶክሳዊ ኃይል ይጠብቃል።
- source_word: ἴδωσιν
  choice: እንዳያስተውሉ
  rationale: ከተደጋገመው βλέπω ይለያል፤ በዓይን ከማየት በላይ ያለውን የመገንዘብ ሐሳብ ያሳያል።
- source_word: ἀκούοντες ἀκούωσι
  choice: እየሰሙም እንዲሰሙ
  rationale: ከኢሳይያስ የተወሰደውን ሴማዊ ድግግሞሽና አጽንዖት ሳይሰበስብ ያቆያል።
- source_word: συνιῶσιν
  choice: እንዳይገባቸው
  rationale: የአእምሮና የመንፈስ መረዳትን በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: μήποτε
  choice: ምናልባት … እንዳይ…
  rationale: የግሪኩን አሉታዊ የወደፊት እድል (‘lest’) ያቆያል፣ ወደ ቀላል ውጤት አያለዝበውም።
- source_word: ἐπιστρέψωσιν
  choice: ተመልሰው
  rationale: የመመለስን የግስ ምስል ያቆያል፤ የንስሐ ፍቺውን በዋናው ጽሑፍ ውስጥ በግድ አያስገባም።
- source_word: ἀφεθῇ αὐτοῖς
  choice: ይቅር እንዳይባልላቸው
  rationale: ነጠላውን ተገብሮ ግስና ስሙ ያልተጠቀሰውን መለኮታዊ ፈጻሚ ይጠብቃል፤ ይቅር የሚባለውንም ነገር አይጨምርም።
theological_decisions:
- issue: የኢሳይያስ ጥቅስ የዓላማ/የውጤት ኃይልና ምሳሌዎቹ ንስሐን ይከለክላሉ የሚለው ሊከተል የሚችለው ትርጉም
  choice: “እንዲ… ምናልባት … እንዳይ…” የሚለውን የግሪኩን ዓላማ የሚመስል አገላለጽ ማቆየት
  alternative: “ውጤቱም … ሆነ” ወይም ቀላል ገላጭ አገላለጽ
  rationale: ጥቅሱ በመለኮታዊ ፍርድና በሕዝቡ ምላሽ እጦት መካከል ያለውን ሆን ተብሎ የተተወ ውጥረት ይይዛል፤ ትርጉሙ ይህን ወደ አንድ የሥነ መለኮት አቋም አያዘነብልም።
- issue: ἐπιστρέψωσιν ከንስሐ ጋር ያለው ግንኙነት
  choice: በዋናው ጽሑፍ “ተመልሰው” ማለት፣ የንስሐ ፍቺውን በማስታወሻ ማሳየት
  alternative: “ንስሐ ገብተው”
  rationale: ግሱ በትንቢታዊው አውድ የንስሐ ፍቺ ሊኖረው ቢችልም፣ ከዚያ የሰፋ የመመለስ ትርጉምም አለው፤ ትርጉሙ ይህን እውነተኛ አሻሚነት ያቆያል።
