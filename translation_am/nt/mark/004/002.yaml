- source_word: πολλά
  choice: ብዙ ነገር
  rationale: ገለልተኛ ብዙ ቁጥር ያለውን πολλά እንደ የማስተማር ይዘት ይገልጣል፤ አማራጩ «ብዙ» ብቻ መባል በእግር ማስታወሻ ተጠብቋል።
- source_word: ἔλεγεν
  choice: ይላቸው ነበር
  rationale: የግሪኩን ኢምፐርፌክት ቀጣይነት ይጠብቃል፤ ቀጣዩን ቀጥተኛ ንግግርም በተፈጥሯዊ ሁኔታ ያስገባል።
- source_word: ἐν τῇ διδαχῇ αὐτοῦ
  choice: ሲያስተምራቸውም
  rationale: ቃል በቃል «በትምህርቱ» ማለት በአማርኛ ጠንካራ ሊመስል ስለሚችል፣ ግንባታውን እንደ ትምህርቱ አውድ በተፈጥሯዊ ጊዜያዊ ሐረግ ያቀርባል።
- source_word: καὶ
  choice: እርሱም / ሲያስተምራቸውም
  rationale: የማርቆስን ተከታታይ አያያዥ ስልት በአማርኛው «-ም» በተፈጥሯዊ መንገድ ይጠብቃል።
- source_word: αὐτοὺς / αὐτοῖς
  choice: -አቸው / -ላቸው
  rationale: ተሳቢውንና ተቀባዩን በአማርኛ ግስ ላይ በሚገባ በተያያዙ ተውላጠ ስሞች ያሳያል።
