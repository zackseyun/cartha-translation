  rationale: የግሪኩን ኢምፐርፌክት ገጽታ፣ በዚያ ትዕይንት የቀጠለ የማስተማር ተግባር መሆኑን፣ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐν παραβολαῖς
