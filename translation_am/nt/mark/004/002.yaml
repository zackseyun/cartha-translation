    text: ወይም፣ «በምሳሌዎች ብዙ ያስተምራቸው ነበር።» የግሪኩ πολλά «ብዙ ነገር» ወይም በአጭሩ «ብዙ» ተብሎ ሊተረጎም ይችላል።
