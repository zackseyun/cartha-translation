- source_word: παραβολὴν
  choice: ምሳሌ
  rationale: የኢየሱስን በንጽጽርና በታሪክ መልክ የሚቀርብ ትምህርት የሚገልጽ የተለመደ መጽሐፍ ቅዱሳዊ ቃል ነው።
- source_word: πῶς
  choice: ታዲያ ... እንዴት
  rationale: καὶ πῶς ከመጀመሪያው ጥያቄ የሚነሳውን ውጤታዊ ጥያቄ ያሳያል፤ ‘ታዲያ’ ይህን አመክንዮ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: πάσας τὰς παραβολὰς
  choice: ምሳሌዎቹን ሁሉ
