  text: Καὶ λέγει αὐτοῖς· Οὐκ οἴδατε τὴν παραβολὴν ταύτην, καὶ πῶς πάσας τὰς παραβολὰς γνώσεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/013.yaml
  text: And he says to them[a], “Do you not understand this parable? Then how will you understand all the parables?”
translation:
  language: am
  text: እርሱም፣ “ይህን ምሳሌ አልገባችሁምን? ታዲያ ምሳሌዎቹን ሁሉ እንዴት ትረዳላችሁ?” አላቸው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ቃል በቃል፣ “ይህን ምሳሌ አታውቁምን? ምሳሌዎቹንስ ሁሉ እንዴት ታውቃላችሁ?” የግሪኩ ግሶች “ማወቅ” ተብለው ሊተረጎሙ ይችላሉ፤ እዚህ ግን የመረዳትን ሐሳብ ይይዛሉ።
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: አላቸው
  rationale: የግሪኩን ታሪካዊ የአሁን ጊዜ ቅርጽ በአማርኛ ተፈጥሯዊ የትረካ አገላለጽ ተርጉሟል፤ ‘ይላቸዋል’ የሚለው ቃል በቃል አማራጭ ቢሆንም እዚህ ከዐውዱ ጋር የሚፈስ ያለፈ ጊዜ ተመርጧል።
- source_word: οἴδατε
  choice: አልገባችሁምን
