base_translation:
  language: en
  yaml_path: translation/nt/mark/004/021.yaml
  text: And he was saying to them[a], “A lamp does not come to be put under a basket or under a bed[b], does it? Is it not to be put on the lampstand?”
translation:
  language: am
  text: እንዲህም ይላቸው ነበር፦ “መብራት የሚመጣው[a] ከመስፈሪያ ቅርጫት[b] ወይም ከአልጋ በታች እንዲቀመጥ ነውን? በመብራት ማስቀመጫ ላይ እንዲቀመጥ አይደለምን?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “መብራት ይመጣልን…?” የግሪኩ አገላለጽ መብራቱን እንደ ሰው አድርጎ በሕያው ምስል ያቀርበዋል።
    reason: lexical_alternative
  - marker: b
    text: የግሪኩ μόδιος የመስፈሪያ መያዣን ያመለክታል፤ በባሕላዊ ትርጉም “ቡሽል” ተብሎ ይተረጎማል።
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγεν
  choice: ይላቸው ነበር
  rationale: የግሪኩ ያልተፈጸመ ጊዜ ቅርጽ በትረካው ውስጥ ቀጣይነት ወይም ድግግሞሽ ያለውን ንግግር ሊያመለክት ስለሚችል፣ ይህ አገላለጽ ገጽታውን ይጠብቃል።
- source_word: Μήτι
  choice: … ነውን?
  rationale: አሉታዊ መልስ የሚጠበቅበትን የአጽንዖት ጥያቄ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἔρχεται ὁ λύχνος
  choice: መብራት የሚመጣው
  rationale: መብራቱን እንደ ሰው አድርጎ ‘ይመጣል’ የሚለውን ሕያውና ምሳሌያዊ የግሪክ አገላለጽ ይጠብቃል።
- source_word: λύχνος
  choice: መብራት
  rationale: ቃሉ ብርሃንን በአጠቃላይ ሳይሆን ተንቀሳቃሽ የዘይት መብራትን ያመለክታል።
- source_word: μόδιον
  choice: መስፈሪያ ቅርጫት
  rationale: μόδιος የደረቅ እህል መስፈሪያንና ለመስፈር የሚያገለግለውን ዕቃ ያመለክታል፤ ይህ ትርጉም ባሕላዊ ትርጉሙን ለዘመናዊ አንባቢ ግልጽ ያደርጋል።
- source_word: κλίνην
  choice: አልጋ
  rationale: በዚህ የቤት ውስጥ ምስል ውስጥ ተፈጥሯዊና በስፋት የሚገባ ትርጉም ነው።
- source_word: λυχνίαν
  choice: የመብራት ማስቀመጫ
  rationale: መብራት የሚቀመጥበትን ልዩ ማስቀመጫ በግልጽ ያመለክታል።
- source_word: τεθῇ
  choice: እንዲቀመጥ
  rationale: የτίθημι ተደራጊ ቅርጽንና ከἵνα ጋር ያለውን የዓላማ ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: ‘መብራቱ ይመጣል’ የሚለውን ሰውኛ አገላለጽ መጠበቅ ወይም ‘መብራት ይመጣል’ የሚለውን ‘መብራት ያመጣሉ’ ብሎ ማለስለስ
  choice: ሕያው የሆነውን ንቁ ምስል ‘መብራት የሚመጣው’ በማለት መጠበቅ
  alternative: ‘መብራት የሚያመጡት … እንዲቀመጥ ነውን?’
  rationale: ንግግሩ ምሳሌያዊና ሆን ተብሎ ሕያው የተደረገ ነው፤ ንቁውን አገላለጽ መጠበቅ ያለ አስፈላጊ ትርጓሜ የግሪኩን ኃይል ያቆያል።
- issue: በምሳሌያዊ አባባሉ ውስጥ ὁ λύχνος ያለውን የወሰን አመልካች እንዴት ማቅረብ እንደሚገባ
  choice: በአጠቃላይ ትርጉም ‘መብራት’ ብሎ ማቅረብ
  alternative: ‘መብራቱ’
  rationale: የአማርኛ ምሳሌያዊ አነጋገር አጠቃላይ መርሕን ያለ ወሰን አመልካች በተፈጥሯዊ ሁኔታ ሊገልጽ ይችላል።
