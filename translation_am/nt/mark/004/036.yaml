lexical_decisions:
- source_word: ἀφέντες
  choice: ትተው
  rationale: የግሪኩ የአኦሪስት ቦዝ አንቀጽ ከዋናው ድርጊት በፊት የተደረገውን ተከታይ ድርጊት ያሳያል፤ ‘ትተው’ በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን ሕዝቡን በሥርዓት አሰናበቱ የሚል ያልተገለጸ ሐሳብ አይጨምርም።
- source_word: ὄχλον
  choice: ሕዝቡን
  rationale: ὄχλος በዚህ አውድ የተሰበሰበውን ብዙ ሰው ያመለክታል፤ ‘ሕዝቡን’ ግልጽና ተፈጥሯዊ ነው።
- source_word: παραλαμβάνουσιν
  choice: ይዘውት ሄዱ
  rationale: παραλαμβάνω አንድን ሰው ከራስ ጋር ይዞ መሄድን ያመለክታል፤ ይህ አገላለጽ በአማርኛ ያንን ሐሳብ በተፈጥሮ ያስተላልፋል።
- source_word: ὡς ἦν
  choice: እንዳለ
  rationale: ሐረጉ ኢየሱስን ያለ ተጨማሪ ዝግጅት በነበረበት ሁኔታ እንደወሰዱት ሊያመለክት ይችላል፤ ‘እንዳለ’ ይህን ሐሳብ አጭርና ተፈጥሯዊ በሆነ መንገድ ይገልጣል።
- source_word: ἐν τῷ πλοίῳ
  choice: በጀልባው ውስጥ
  rationale: πλοῖον በዚህ የገሊላ ባሕር ትረካ ውስጥ ‘ጀልባ’ ተብሎ መተርጎሙ ተስማሚ ነው፤ ሐረጉ ኢየሱስ አስቀድሞ በጀልባው ውስጥ እንደነበረ ያሳያል።
- source_word: ἄλλα πλοῖα
  choice: ሌሎች ጀልባዎች
  rationale: ግሪኩ በቀጥታ ‘ሌሎች ጀልባዎች’ ይላል፤ ‘ትናንሽ’ የሚል ቅጽል ስለሌለ አልተጨመረም።
- source_word: ἦν μετ’ αὐτοῦ
  choice: ከእርሱ ጋር ነበሩ
  rationale: በግሪክ ገለልተኛ ብዙ ቁጥር ባለቤት ከነጠላ ግስ ጋር ቢመጣም፣ አማርኛው ከ‘ጀልባዎች’ ጋር በቁጥር ተስማምቶ ‘ነበሩ’ ይላል፤ ‘ከእርሱ ጋር’ የትረካውን አጭር አገላለጽ ይጠብቃል።
theological_decisions:
- issue: ὡς ἦν ἐν τῷ πλοίῳ የሚለው ሐረግ ከሁኔታ ወይም ከቦታ ጋር ያለው ትኩረት
  choice: በጀልባው ውስጥ እንደነበረ እንዳለ
  alternative: እንዳለ ይዘውት ሄዱ፤ እርሱም በጀልባው ውስጥ ነበር
  rationale: ዋናው ጽሑፍ የግሪኩን ቃላት ቅርበት በመጠበቅ ኢየሱስ አስቀድሞ በጀልባው እንደነበረና ያለ ተጨማሪ ዝግጅት እንደወሰዱት የሚሉትን ሁለቱንም ንባቦች ክፍት ያደርጋል፤ አሻሚነቱ በማስታወሻው በግልጽ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የትረካውን ፍጥነት ለማስጠበቅ ‘ይዘውት ሄዱ’ ተመርጧል፤ የግሪኩ ሐረግ እውነተኛ አሻሚነት በግርጌ ማስታወሻ ተገልጿል።
