base_translation:
  language: en
  yaml_path: translation/nt/mark/004/036.yaml
  text: And leaving the crowd[a], they take him with them just as he was, in the boat[b], and other boats were with him.
translation:
  language: am
  text: ሕዝቡንም ትተው፣ እርሱን እንዳለ፣ በጀልባው ውስጥ ይዘው ሄዱ[a]፤ ሌሎች ጀልባዎችም ከእርሱ ጋር ነበሩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “እንዳለ፣ በጀልባው ውስጥ” የሚለው ሐረግ ኢየሱስ አስቀድሞ በጀልባው ውስጥ እንደነበረ ወይም ያለ ተጨማሪ ዝግጅት በነበረበት ሁኔታ እንደወሰዱት ሊያጎላ ይችላል።
