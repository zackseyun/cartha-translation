  text: እጅግም ፈሩ፤[a] እርስ በርሳቸውም እንዲህ እያሉ ነበር፦ “ነፋሱና ባሕሩ እንኳ የሚታዘዙለት ይህ ታዲያ ማን ነው?”
  philosophy: optimal-equivalence
