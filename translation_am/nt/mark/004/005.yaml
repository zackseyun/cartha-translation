  text: ⸂καὶ ἄλλο⸃ ἔπεσεν ἐπὶ τὸ πετρῶδες ⸀ὅπου οὐκ εἶχεν γῆν πολλήν, καὶ ⸀εὐθὺς ἐξανέτειλεν διὰ τὸ μὴ ἔχειν βάθος γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/005.yaml
  text: And other seed fell on the rocky ground[a], where it did not have much soil, and it sprang up at once because it had no depth of soil.
translation:
  language: am
  text: ሌላ ዘርም ብዙ አፈር ባልነበረበት ድንጋያማ መሬት[a] ላይ ወደቀ፤ አፈሩም ጥልቅ ስላልነበረ ወዲያው በቀለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አለታማ መሬት።” የግሪክ ቃሉ ቀጭን አፈር ብቻ የሸፈነውን አለታማ ስፍራ ይገልጣል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο
  choice: ሌላ ዘር
  rationale: ገለልተኛ ነጠላ ቅጹ በስም ፋንታ የተጠቀሰ ሲሆን፣ ከቀደመው ዐውድ የሚገባውን ‘ዘር’ ለግልጽነት ያሟላል።
- source_word: πετρῶδες
  choice: ድንጋያማ መሬት
  rationale: ቃሉ ቀጭን አፈር የሸፈነውን አለታማ ወይም ድንጋያማ ስፍራ ያመለክታል፤ በየቦታው ድንጋይ የተበተነበትን መሬት ብቻ አያመለክትም።
- source_word: γῆν πολλήν
  choice: ብዙ አፈር
  rationale: γῆ በዚህ የእርሻ ዐውድ ለእድገት የሚሆንን አፈር ያመለክታል።
- source_word: εὐθὺς
  choice: ወዲያው
  rationale: የተግባሩን ፈጣንነት በተፈጥሯዊና በዘመናዊ አማርኛ ይገልጣል።
- source_word: ἐξανέτειλεν
  choice: በቀለ
  rationale: በእርሻ ዐውድ የዘሩን መብቀልና ከአፈር መውጣት በግልጽ ያሳያል።
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: አፈሩ ጥልቅ ስላልነበረ
  rationale: διά ከስማዊ ግስ ጋር የሚገልጠውን ምክንያት በተፈጥሯዊ የአማርኛ ሐረግ ያቀርባል፤ የአፈሩን ቀጭንነትም ይጠብቃል።
- source_word: ὅπου
  choice: ባልነበረበት
  rationale: የቦታ አንጻራዊ ትስስሩን በተፈጥሯዊ አማርኛ ያስተላልፋል።
