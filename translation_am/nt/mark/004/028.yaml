  source_fidelity: 'The translation accurately represents the Greek sequence and imagery: αὐτομάτη is conveyed by በራሷ, γῆ by ምድሪቱ in its agricultural sense, and καρποφορεῖ by ፍሬ ታፈራለች. The three stages—χόρτον, στάχυν, and πλήρης σῖτον ἐν τῷ στάχυϊ—are preserved without adding a claim of ripeness or specifying wheat.'
