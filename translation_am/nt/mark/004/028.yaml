id: MRK.4.28
reference: Mark 4:28
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀αὐτομάτη ἡ γῆ καρποφορεῖ, πρῶτον χόρτον, ⸂εἶτα στάχυν, εἶτα⸃ ⸂πλήρης σῖτον⸃ ἐν τῷ στάχυϊ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/028.yaml
  text: 'The soil bears fruit by itself: first the stalk[a], then the head, then the full grain in the head.'
translation:
  language: am
  text: ምድሪቱ በራሷ ፍሬ ታፈራለች፤ መጀመሪያ ቡቃያ፣ ከዚያ እሸት፣ ከዚያም በእሸቱ ውስጥ የሞላ እህል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτομάτη
  choice: በራሷ
  rationale: ምድሪቱ ያለሚታይ የሰው እርዳታ ፍሬ እንደምታፈራ ያሳያል፤ በዘመናዊ አማርኛም ተፈጥሯዊ ነው።
- source_word: ἡ γῆ
  choice: ምድሪቱ
  rationale: በዚህ የእርሻ አውድ የተዘራባትን መሬት ያመለክታል፤ የተወሰነው አንቀጽም በቅጥያው ተጠብቋል።
- source_word: καρποφορεῖ
  choice: ፍሬ ታፈራለች
  rationale: የእርሻውን ምስል በተፈጥሯዊና በመጽሐፍ ቅዱሳዊ አማርኛ ይጠብቃል።
- source_word: πρῶτον χόρτον
  choice: መጀመሪያ ቡቃያ
  rationale: χόρτος በእህል ዕድገት አውድ መጀመሪያ የሚታየውን አረንጓዴ ቡቃያ ያመለክታል፤ ‘ቡቃያ’ ከ‘ግንድ’ ይልቅ የመጀመሪያውን የዕድገት ደረጃ በትክክል ያሳያል።
- source_word: εἶτα
  choice: ከዚያ / ከዚያም
  rationale: ተከታታይ የዕድገት ደረጃዎችን በቀላልና ተፈጥሯዊ አማርኛ ያመለክታል።
- source_word: στάχυν
  choice: እሸት
  rationale: στάχυς የእህልን ራስ ወይም ዘለላ ያመለክታል፤ ‘እሸት’ በአማርኛ ለገና ያልደረቀ የእህል ራስና ፍሬ የተለመደ ቃል ነው።
- source_word: πλήρης σῖτον
  choice: የሞላ እህል
  rationale: πλήρης የሙላትን ሐሳብ እንጂ በግድ መብሰልን አይጨምርም፤ σῖτος ደግሞ የእህልን ዓይነት ሳይወስን ‘እህል’ ተብሎ ተተርጉሟል።
- source_word: ἐν τῷ στάχυϊ
  choice: በእሸቱ ውስጥ
  rationale: ሙሉው እህል የሚገኝበትን ቦታ ግልጽ ያደርጋል፤ στάχυς ከቀደመው አጠቃቀም ጋርም ወጥነት ተጠብቆለታል።
