base_translation:
  language: en
  yaml_path: translation/nt/mark/004/008.yaml
  text: And other seed fell into the good soil[a], and it was producing fruit, growing up and increasing, and bearing thirtyfold and sixtyfold and a hundredfold.
translation:
  language: am
  text: 'ሌላ ዘርም በመልካም አፈር ላይ ወደቀ፤[a] ፍሬ ይሰጥ ነበር፤ እየበቀለና እያደገም ሠላሳ፣ ስድሳ፣ መቶም እጥፍ ያፈራ ነበር።


    [a] ቃል በቃል፦ “ሌላም በመልካም አፈር ላይ ወደቀ።” “ዘር” የሚለው ከዐውደ ንባቡ የሚገባ ነው።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፦ “ሌላም በመልካም አፈር ላይ ወደቀ።” “ዘር” የሚለው ከዐውደ ንባቡ የሚገባ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: ሌላውም ዘር
  rationale: ገለልተኛ ጾታ ያለው የብዙ ቁጥር ቅጽ በስም ፈንታ የተጠቀሰ ሲሆን፣ በምሳሌው ዐውድ ቀደም ሲል የተጠቀሰውን ዘር ያመለክታል። በአማርኛ “ዘር”ን መጨመር ሐሳቡን ግልጽና ተፈጥሯዊ ያደርገዋል።
- source_word: γῆν τὴν καλήν
  choice: በመልካም አፈር ላይ
  rationale: በዚህ የእርሻ ዐውድ γῆ ሰፊ ጂኦግራፊያዊ ምድርን ሳይሆን ለዘር ተስማሚ የሆነ አፈርን ያመለክታል።
- source_word: ἐδίδου καρπὸν
  choice: ፍሬ ይሰጥ ነበር
  rationale: ያልተፈጸመው የግስ ቅርጽ ቀጣይ የሆነ ፍሬ መስጠትን ያሳያል።
- source_word: ἀναβαίνοντα
  choice: በቀለ
  rationale: በእርሻ ዐውድ የተክሉን ከአፈር ወጥቶ ወደ ላይ ማደግ ያመለክታል፤ “በቀለ” በአማርኛ ተፈጥሯዊ ነው።
- source_word: αὐξανόμενα
  choice: እያደገም
  rationale: ከመብቀል ቀጥሎ የሚኖረውን ቀጣይ ዕድገት ይገልጣል፣ ከἀναβαίνοντα ጋር ያለውን ልዩነትም ይጠብቃል።
- source_word: ἔφερεν
  choice: አፈራ
  rationale: ፍሬን ከተጠበቀው መጠን በብዙ እጥፍ ማምጣትን በተፈጥሯዊ የእርሻ አገላለጽ ያስተላልፋል።
- source_word: ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν ἑκατόν
  choice: አንዱ ሠላሳ እጥፍ፣ አንዱ ስድሳ እጥፍ፣ አንዱም መቶ እጥፍ
  rationale: የግሪኩ አገላለጽ የምርት መባዛትን ያመለክታል። “እጥፍ” ይህን የውጤት መጠን በግልጽ ያስተላልፋል፣ በእያንዳንዱ ቁጥር ፊት ያለውን ἓνም “አንዱ” በማለት ይጠብቃል።
