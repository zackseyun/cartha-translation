source:
  edition: SBLGNT
  text: καὶ ⸀ἄλλοι εἰσὶν οἱ εἰς τὰς ἀκάνθας σπειρόμενοι· ⸂οὗτοί εἰσιν⸃ οἱ τὸν λόγον ⸀ἀκούσαντες,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/018.yaml
  text: And others are those sown among the thorns[a]; these are the ones who have heard the word[b],
translation:
  language: am
  text: ሌሎችም በእሾህ መካከል[a] የተዘሩት ናቸው፤ እነዚህ ቃሉን[b] የሰሙት ናቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ‘ወደ እሾህ መካከል።’
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ ‘መልእክቱን።’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι
  choice: ሌሎቹ
  rationale: በምሳሌው ውስጥ ቀደም ሲል ከተጠቀሱት ቡድኖች ጋር ያለውን ንጽጽር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: εἰς τὰς ἀκάνθας
  choice: እሾህ መካከል
  rationale: εἰς በቃል ደረጃ ‘ወደ’ ሊባል ቢችልም፣ ዘሩ እሾህ ባለበት ስፍራ መውደቁን በተፈጥሯዊ አማርኛ ለመግለጽ ‘መካከል’ ተመርጧል።
- source_word: ἀκάνθας
  choice: እሾህ
  rationale: በግብርናዊው አውድ ያለውን እሾሃማ እፅዋት በግልጽና በተለመደ ቃል ይገልጣል።
- source_word: σπειρόμενοι
  choice: የተዘሩት
  rationale: የሰዎቹን ከዘር ጋር የሚያመሳስለውን የምሳሌውን ዘይቤ ይጠብቃል፤ የግሪኩን ተገብሮአዊ ቅርጽም በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: οὗτοί εἰσιν
  choice: እነዚህም ... ናቸው
  rationale: የምሳሌውን ፍቺ የሚያብራራውን የመለያ አገላለጽ ይጠብቃል።
- source_word: οἱ ... ἀκούσαντες
  choice: የሰሙት
  rationale: የአኦሪስት ተሳቢውን ከቀጣዩ ድርጊት በፊት የተፈጸመ መስማት እንደሆነ በአጭርና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τὸν λόγον
  choice: ቃሉን
  rationale: በማርቆስ የምሳሌው አውድ λόγος የተሰበከውን ቃል ወይም መልእክት ያመለክታል፤ ‘ቃሉን’ መጽሐፍ ቅዱሳዊውን አገላለጽና አውዳዊ ግንኙነቱን ይጠብቃል።
theological_decisions:
- issue: በምሳሌው ፍቺ ሰዎቹ ከዘር ጋር በዘይቤ መለየታቸው
  choice: ‘እሾህ መካከል የተዘሩት’ የሚለውን ቀጥተኛ ዘይቤ መጠበቅ
  alternative: ‘በእሾሃማ መሬት የተዘሩት’ ወይም ዘይቤውን የሚፈታ ሐረግ
  rationale: ግሪኩ የዘሩን ዘይቤ በግልጽ ይቀጥላል። ይህን መጠበቅ የኢየሱስን ማብራሪያ ሥነ ጽሑፋዊ አወቃቀር ሳይዘረጋ ያቀርባል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘የተዘሩት’ የሚለው የምሳሌውን ዘይቤ ሆን ብሎ ይጠብቃል።
