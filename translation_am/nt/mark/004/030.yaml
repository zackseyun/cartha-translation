  text: Καὶ ἔλεγεν· ⸀Πῶς ὁμοιώσωμεν τὴν βασιλείαν τοῦ θεοῦ, ἢ ἐν ⸀τίνι ⸂αὐτὴν παραβολῇ θῶμεν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/030.yaml
  text: And he was saying[a], “How should we compare the kingdom of God, or in what parable should we set it forth?”
translation:
  language: am
  text: እንዲህም ይል ነበር፦ “የእግዚአብሔርን መንግሥት ከምን ጋር እናመሳስለው? ወይስ በምን ምሳሌ እናቅርበው[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በምን ምሳሌ እንግለጸው?” የግሪኩ አገላለጽ ምሳሌው መንግሥቱን የማቅረቢያ መንገድ መሆኑን አጉልቶ ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: ይል ነበር
  rationale: የግሪኩን ያልተፈጸመ የግስ ጊዜ ቀጣይነት ወይም ተደጋጋሚነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Πῶς ὁμοιώσωμεν
  choice: ከምን ጋር እናመሳስለው?
  rationale: በአማርኛ የማመሳሰልን መንገድ በተፈጥሯዊ የምክክር ጥያቄ ይገልጣል፤ የመጀመሪያውን ብዙ ቁጥር ንግግርም ይጠብቃል።
- source_word: βασιλείαν τοῦ θεοῦ
  choice: የእግዚአብሔርን መንግሥት
  rationale: በመጽሐፍ ቅዱሳዊ አማርኛ የተለመደውንና የግዛትና የንግሥና ምስልን የሚጠብቀውን አገላለጽ ይጠቀማል።
- source_word: ἢ
  choice: ወይስ
  rationale: ሁለተኛውን የምክክር ጥያቄ ከመጀመሪያው ጋር እንደ አማራጭ አገላለጽ ያገናኛል።
- source_word: ἐν τίνι παραβολῇ
  choice: በምን ምሳሌ
  rationale: ἐν እዚህ የመሣሪያን ወይም የአቀራረብን ስሜት ሊይዝ ስለሚችል፣ “በምን ምሳሌ” ቅርብና ተፈጥሯዊ ነው።
- source_word: παραβολῇ
  choice: ምሳሌ
  rationale: በወንጌላት ውስጥ ለπαραβολή የተለመደና ለአንባቢዎች ግልጽ የሆነ ቃል ነው።
- source_word: αὐτὴν ... θῶμεν
  choice: እናቅርበው
  rationale: ቀጥተኛው “እናስቀምጠው” በአማርኛ እንግዳ ስለሚሆን፣ በምሳሌ መግለጽን የሚያመለክተውን ፈሊጣዊ ትርጉም ይሰጣል።
