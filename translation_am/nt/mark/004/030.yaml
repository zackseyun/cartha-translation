  source_fidelity: የግሪኩን ያልተፈጸመ ግስ ἔλεγεν በ«ይል ነበር» በተገቢው ቀጣይ/ተደጋጋሚ ገጽታ ያቀርባል። «ከምን ጋር እናመሳስለው?» እና «በምን ምሳሌ እናቅርበው?» የdeliberative aorist subjunctivesን እና የሁለቱን ተለዋጭ ጥያቄዎች በትክክል ያስተላልፋሉ። በሁለተኛው ሐረግ «በምን ምሳሌ» የἐν τίνι παραβολῇን መሣሪያዊ ስሜት በታማኝነት ይይዛል።
  naturalness: ንባቡ በዘመናዊ መደበኛ አማርኛ ተፈጥሯዊ፣ ግልጽ እና ለወንጌል ትረካ ተስማሚ ክብር ያለው ነው። «ወይስ» ሁለተኛውን አማራጭ የምክክር ጥያቄ በቅልጥፍና ያገናኛል።
  terminology: «የእግዚአብሔር መንግሥት» ለβασιλεία τοῦ θεοῦ የተለመደ፣ ግልጽ እና ሰፊውን የቃሉን ስሜት የሚጠብቅ ቃል ነው። «ምሳሌ» ለπαραβολή በዚህ የወንጌል አውድ ተገቢ ነው። የ[a] ማስታወሻ ምልክት በትክክለኛው የተዛማጅ ሐረግ ላይ ተቀምጧል።
