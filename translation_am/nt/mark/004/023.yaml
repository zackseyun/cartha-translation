  text: If anyone has ears to hear[a], let him hear.
translation:
  language: am
  text: የሚሰማ ጆሮ ያለው ይስማ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴ τις
  choice: የሚሰማበት … ያለው ሰው
  rationale: የግሪኩን ክፍትና አጠቃላይ ጥሪ በተፈጥሯዊ የአማርኛ አነጋገር ያቀርባል፤ ቃል በቃል ‘ማንም ቢኖረው’ ከሚለው ይልቅ የዓረፍተ ነገሩን ኃይል ይጠብቃል።
- source_word: ἔχει ὦτα
  choice: ጆሮ ያለው
  rationale: የሰውነት ክፍሎችን በነጠላ መግለጽ በአማርኛ ተፈጥሯዊ ስለሆነ የግሪኩ ብዙ ቁጥር በነጠላ ቀርቧል፤ አገላለጹ ተቀባይ ሆኖ የመስማትን ችሎታ ያመለክታል።
- source_word: ἀκούειν
  choice: የሚሰማበት
  rationale: መስማትን እንደ ችሎታ ወይም ዓላማ ይገልጻል፤ ከἀκουέτω ጋር ያለውን የግስ ድግግሞሽም ይጠብቃል።
- source_word: ἀκουέτω
  choice: ይስማ
  rationale: የሦስተኛ መደብ ነጠላ ትእዛዝን በቀጥታና በተፈጥሯዊ አማርኛ ያቀርባል፤ እዚህ ‘መስማት’ ድምፅን ከመቀበል በላይ በጥሞና ተቀብሎ ማስተዋልን ሊያካትት ይችላል።
theological_decisions:
- issue: የነጠላ አጠቃላይ ጥሪ
  choice: ያለው ሰው ይስማ
  alternative: ጆሮ ያለው ሁሉ ይስማ
  rationale: ግሪኩ ያልተወሰነ ነጠላ ተውላጠ ስምንና የነጠላ ትእዛዝን ይጠቀማል። አማርኛው ጾታን ሳያስገባ ይህን የነጠላ አወቃቀርና አጠቃላይ ኃይል ይጠብቃል።
- issue: ‘መስማት’ ያለው ሰፊ ትርጉም
  choice: ይስማ
  alternative: በጥሞና ያዳምጥ
  rationale: ‘ይስማ’ በግሪኩ ያለውን የቃል ድግግሞሽና ሆን ተብሎ የተተወውን ሰፊ ትርጉም ይጠብቃል፤ ‘ያዳምጥ’ ደግሞ ትርጉሙን ወደ ትኩረት ሰጥቶ መስማት ብቻ ሊያጠብ ይችላል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ አማርኛ። የግሪኩ አጭር፣ ቀጥተኛ እና አጽንዖታዊ አቀራረብ ተጠብቋል።
