  rationale: The revision preserves the source’s open generic condition, its hearing-word repetition, and its singular imperative, while using the established, natural Amharic idiom for “has ears to hear.” The singular ጆሮ is retained as idiomatic Amharic body-part usage and does not alter the saying’s meaning.
