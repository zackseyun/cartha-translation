review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the generic conditional force and the final third-person singular imperative. Its singular ጆሮ is idiomatic in Amharic, though the Greek has plural ὦτα. However, የሚሰማበት more explicitly means “by which one hears” and is less direct than the source’s compact idiom, “ears for hearing.”
  naturalness: The sentence is understandable and dignified, but የሚሰማ ጆሮ ያለው ይስማ is more natural, concise, and idiomatic modern standard Amharic. Omitting the redundant ሰው also better reflects the Greek’s terse formulation.
  terminology: ይስማ appropriately retains the repeated hearing verb and does not over-specify the receptive sense as ያዳምጥ would. No theological terminology or interpretive expansion is involved.
  issues:
  - severity: low
    issue: The expression የሚሰማበት ጆሮ is somewhat periphrastic.
    rationale: While grammatically intelligible, it means more specifically “an ear by which [one] hears.” The Greek idiom ὦτα ἀκούειν is better represented by the concise Amharic expression የሚሰማ ጆሮ.
  - severity: low
    issue: ሰው is unnecessary in the relative-clause construction.
    rationale: የሚሰማ ጆሮ ያለው already has open, generic singular reference and allows the final ይስማ to preserve the Greek singular imperative without introducing an extra noun.
  revised_text: የሚሰማ ጆሮ ያለው ይስማ።
  revised_footnotes: []
