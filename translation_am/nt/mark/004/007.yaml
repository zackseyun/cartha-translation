    text: ወይም፣ «ወደ እሾሆቹ ውስጥ።» የግሪኩ መስተዋድድ «ወደ ... ውስጥ» የሚል ቢሆንም፣ በዚህ አውድ «በእሾሆች መካከል» የተፈጥሮ አማርኛ ነው።
