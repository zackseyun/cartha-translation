id: MRK.4.38
reference: Mark 4:38
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ⸂αὐτὸς ἦν⸃ ⸀ἐν τῇ πρύμνῃ ἐπὶ τὸ προσκεφάλαιον καθεύδων· καὶ ⸀ἐγείρουσιν αὐτὸν καὶ λέγουσιν αὐτῷ· Διδάσκαλε, οὐ μέλει σοι ὅτι ἀπολλύμεθα;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/038.yaml
  text: But he himself was in the stern[a], asleep on the cushion; and they woke him and said to him, “Teacher, do you not care that we are perishing?”
translation:
  language: am
  text: እርሱ ራሱ ግን በጀልባው የኋለኛው ክፍል ውስጥ በትራሱ ላይ ተኝቶ ነበር። እነርሱም ቀሰቀሱትና፣ “መምህር ሆይ፣ እየጠፋን እንዳለን ግድ አይሰጥህምን?” አሉት።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτὸς ἦν
  choice: እርሱ ግን … ነበር
  rationale: ግልጽ ተውላጠ ስሙ ያለውን አጽንዖትና ከደቀ መዛሙርቱ ጋር ያለውን ንጽጽር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐν τῇ πρύμνῃ
  choice: በጀልባው የኋላ ክፍል
  rationale: πρύμνα የጀልባን ኋለኛ ክፍል፣ ማለትም stern፣ በትክክል ያመለክታል፤ ይህ አገላለጽ ለዘመናዊ አንባቢ ግልጽ ነው።
- source_word: ἐπὶ τὸ προσκεφάλαιον
  choice: ትራስ ላይ
  rationale: προσκεφάλαιον ለራስ መደገፊያ የሚያገለግል ትራስ ወይም ትራስ መሰል መደገፊያን ያመለክታል፤ ‘ትራስ’ ተፈጥሯዊና ግልጽ ምርጫ ነው።
- source_word: καθεύδων
  choice: ተኝቶ
  rationale: የኢየሱስን በዚያ ጊዜ በእንቅልፍ ላይ የመሆን ቀጣይ ሁኔታ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἐγείρουσιν
  choice: ቀሰቀሱት
  rationale: የግሪኩን ታሪካዊ የአሁን ጊዜ ቅርጽ በአማርኛ ትረካ የተለመደውን ያለፈ ጊዜ በመጠቀም ያቀርባል።
- source_word: Διδάσκαλε
  choice: መምህር ሆይ
  rationale: διδάσκαλος በቀጥታ ‘መምህር’ ማለት ነው፤ የጥሪውን ቅርጽ ‘ሆይ’ ያሳያል።
- source_word: οὐ μέλει σοι
  choice: ግድ አይሰጥህምን?
  rationale: የግሪኩን ቀጥተኛ፣ አጣዳፊና ወቃሽ ጥያቄ በተለመደ ዘመናዊ አማርኛ ይጠብቃል።
- source_word: ἀπολλύμεθα
  choice: እየጠፋን መሆናችን
  rationale: በመከሰት ላይ ያለውን የጥፋትና የሞት አደጋ ይጠብቃል፤ ትርጉሙን ‘ልንሞት ነው’ ብሎ አያጠብም።
theological_decisions:
- issue: ደቀ መዛሙርቱ ለኢየሱስ ያቀረቡት ጥያቄ ያለው የትረካ ኃይል
  choice: “እየጠፋን መሆናችን ግድ አይሰጥህምን?” ተብሎ እንደ ሹልና ወቃሽ ጥያቄ ተተርጉሟል።
  alternative: “ልንሞት መሆኑ አያሳስብህምን?” ብሎ ለስለስ ባለ መንገድ መተርጎም።
  rationale: የግሪኩ አነጋገር ወቃሽና አጣዳፊ እንጂ መረጃ ለመጠየቅ ብቻ የቀረበ አይደለም። ትርጉሙ ስለ ኢየሱስ ውስጣዊ ዝንባሌ ወይም ስለ ደቀ መዛሙርቱ እምነት ተጨማሪ ፍርድ ሳያስገባ ይህን ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘የጀልባው የኋላ ክፍል’ ከቴክኒካዊ የጀልባ ቃል ይልቅ ግልጽነትን ይሰጣል፤ ጥያቄው የመጀመሪያውን አጣዳፊና ወቃሽ ድምፅ ጠብቋል።
