review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the stern/rear section, Jesus’ sleeping state, the awakening, the address ‘Teacher,’ and the disciples’ urgent, reproachful question. However, the conjunction ግን (‘but’) imposes a contrast where the Greek has καὶ (‘and’); the emphasis belongs to αὐτός and is better expressed by ራሱ without altering the connective force.
  naturalness: The wording is generally clear modern standard Amharic. Adding ውስጥ after ‘rear section’ and using a more idiomatic sequence for the question produces smoother syntax. The revised wording retains a dignified narrative register.
  terminology: መምህር ሆይ is a precise, natural rendering of Διδάσκαλε. የኋለኛው ክፍል accurately conveys πρύμνῃ without unnecessarily introducing technical nautical vocabulary. ትራስ remains appropriate, while the footnote preserves the lexical range of προσκεφάλαιον.
  issues:
  - severity: medium
    issue: The opening uses ግን (‘but’) for Greek καὶ (‘and’).
    rationale: Although contrast is suggested by the emphatic αὐτός, the source explicitly coordinates the clause with καὶ. Rendering the emphasis as እርሱ ራሱ while retaining እና preserves both elements more closely.
  - severity: low
    issue: The phrase እየጠፋን መሆናችን is understandable but somewhat heavy in direct speech.
    rationale: እየጠፋን እንዳለን is more idiomatic in modern Amharic and preserves the Greek present, urgent sense of perishing.
  revised_text: እርሱ ራሱ ግን በጀልባው የኋለኛው ክፍል ውስጥ በትራሱ ላይ ተኝቶ ነበር። እነርሱም ቀሰቀሱትና፣ “መምህር ሆይ፣ እየጠፋን እንዳለን ግድ አይሰጥህምን?” አሉት።
