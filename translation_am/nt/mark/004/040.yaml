  text: καὶ εἶπεν αὐτοῖς· Τί δειλοί ἐστε; ⸀οὔπω ἔχετε πίστιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/040.yaml
  text: And he said to them[c][b][a], “Why are you so fearful? Do you still have no faith?”
translation:
  language: am
  text: እርሱም፣ “ለምን እንዲህ ትፈራላችሁ?[a] እስካሁን እምነት[b][c] የላችሁምን?” አላቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም ይበልጥ ቃል በቃል፣ “ለምን ፈሪዎች ናችሁ?”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ገና እምነት የላችሁምን?”
    reason: lexical_alternative
  - marker: c
    text: እዚህ “እምነት” የተባለው “መታመን” ተብሎም ሊገባ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: እርሱም
  rationale: የግሪኩን ቀላል ትስስር በአማርኛ ተፈጥሯዊ በሆነው -ም ያሳያል፤ ተናጋሪውንም በግልጽ ያቀርባል።
- source_word: εἶπεν αὐτοῖς
  choice: አላቸው
  rationale: በትረካ ውስጥ ለብዙ ተደራሲዎች የተነገረን ቀጥተኛ ንግግር በተፈጥሯዊ አማርኛ ያስተዋውቃል።
- source_word: Τί
  choice: ለምን
  rationale: ከቅጽልና ከ‘መሆን’ ግስ ጋር ያለው ጥያቄ ምክንያትን የሚጠይቅ የተግሣጽ አገላለጽ ነው።
- source_word: δειλοί
  choice: እንዲህ ትፈራላችሁ
  rationale: በማዕበሉ አውድ ያለውን ኃይለኛ ፍርሃት በዘመናዊና ግልጽ አማርኛ ያሳያል፤ ‘ፈሪዎች’ የሚለው ጠንካራ የቃሉ ክልል በማስታወሻ ተጠብቋል።
- source_word: οὔπω
  choice: እስካሁን ... የላችሁምን
  rationale: ‘ገና/እስካሁን የለም’ የሚለውን ጊዜያዊና የተግሣጽ ኃይል በተፈጥሯዊ የአማርኛ ጥያቄ ያስተላልፋል።
- source_word: ἔχετε
  choice: የላችሁምን
  rationale: ከአሉታዊው οὔπω ጋር ‘አላችሁ/የላችሁም’ የሚለውን የይዞታ ወይም የሁኔታ ግስ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: πίστιν
  choice: እምነት
  rationale: የπίστιςን መደበኛ ትርጉም ይጠብቃል፤ በዚህ አውድ ‘መታመን’ ሊሆን የሚችለው ትርጉም በማስታወሻ ተገልጿል።
theological_decisions:
- issue: በአደጋ ውስጥ πίστις እንደ ‘እምነት’ ወይም ‘መታመን’ መተርጎም
  choice: እምነት
  alternative: መታመን
  rationale: የግሪኩ ስም ያለ ተጨማሪ ተሳቢ ቀርቧል። ‘እምነት’ የቃሉን ሰፊ ክልል ሲጠብቅ፣ አውዱ የሚፈቅደው ‘መታመን’ በማስታወሻ ተቀምጧል።
- issue: δειλοί የሚለው ቃል ፍርሃትን ወይም ፈሪነትን ማመልከቱ
  choice: እንዲህ ትፈራላችሁ
  alternative: ፈሪዎች ናችሁ
  rationale: የማዕበሉ አውድ ፍርሃታቸውን በቀጥታ ያሳያል፤ ነገር ግን δειλός ያለው ጠንካራ የ‘ፈሪ’ ትርጉም እንዳይጠፋ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ጥያቄዎች የተግሣጽ ኃይላቸውን ጠብቀዋል፤ የቃላት አማራጮችም ያለ ሃይማኖታዊ ወገንተኝነት በማስታወሻ ቀርበዋል።
