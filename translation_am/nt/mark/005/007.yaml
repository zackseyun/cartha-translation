base_translation:
  language: en
  yaml_path: translation/nt/mark/005/007.yaml
  text: And crying out with a loud voice[a], he says, “What have I to do with you, Jesus, Son of the Most High God? I adjure you by God[c][b], do not torment me.”
translation:
  language: am
  text: እርሱም በታላቅ ድምፅ ጮኾ፣ “ከአንተ ጋር ምን አለኝ[a]፣ ኢየሱስ ሆይ፣ የልዑል እግዚአብሔር ልጅ? በእግዚአብሔር አስምልሃለሁ[b]፤ አታሠቃየኝ” አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “ለእኔና ለአንተ ምን?” ይህ አነጋገር መራራቅን፣ ተቃውሞን ወይም “ጣልቃ አትግባብኝ” የሚል ሐሳብን ይገልጣል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በእግዚአብሔር እለምንሃለሁ።” የግሪኩ ግስ ጥብቅ ልመናን ወይም ሰውን በመሐላ ማስገደድን ሊያመለክት ይችላል።
    reason: lexical_alternative
