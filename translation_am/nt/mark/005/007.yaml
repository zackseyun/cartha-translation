  choice: በእግዚአብሔር አምልሃለሁ
  alternative: በእግዚአብሔር እለምንሃለሁ / በእግዚአብሔር ፊት አስምልሃለሁ
  rationale: የὁρκίζωን የመሐላና የጥብቅ ማሳሰቢያ ኃይል ይጠብቃል፣ ነገር ግን ጥቅሱ ያለውን ሥነ መለኮታዊ ውጥረት ወደ ቀላል ልመና አያለሰልስም።
