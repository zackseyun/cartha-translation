  rationale: ‘መማል/ማስማል’ ያለበትን ጥብቅና የተከበረ ልመና በተለመደ የመጽሐፍ ቅዱስ አማርኛ ያስተላልፋል፤ ተናጋሪው ኢየሱስን በእግዚአብሔር ስም እየማጸነ ወይም እያስማለ ያለውን አሻሚ ኃይል አያጠፋም።
