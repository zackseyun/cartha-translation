  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ οὐκ ἀφῆκεν οὐδένα ⸂μετ’ αὐτοῦ⸃ συνακολουθῆσαι εἰ μὴ ⸀τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην τὸν ἀδελφὸν Ἰακώβου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/037.yaml
  text: And he allowed no one to accompany him except Peter and James and John, the brother of James.
translation:
  language: am
  text: ከጴጥሮስ፣ ከያዕቆብና ከያዕቆብ ወንድም ከዮሐንስ በቀር ማንም ከእርሱ ጋር እንዲሄድ አልፈቀደም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφῆκεν
  choice: አልፈቀደም
  rationale: ከግስ ማሟያው ጋር ሲሠራ ἀφίημι መፍቀድን ያመለክታል፤ የግሪኩ አሉታዊ አገባብ በአማርኛ ተፈጥሯዊ በሆነው «አልፈቀደም» ተገልጧል።
- source_word: οὐδένα
  choice: ማንም
  rationale: ከአሉታዊው «አልፈቀደም» ጋር «ማንም» በመጠቀም ሁሉን አቀፍ ክልከላው በተፈጥሯዊ አማርኛ ተጠብቋል።
- source_word: μετ’ αὐτοῦ
  choice: ከእርሱ ጋር
  rationale: የአብሮነትና የአጃቢነት ግንኙነቱን በግልጽ ሁኔታ ያስተላልፋል።
- source_word: συνακολουθῆσαι
  choice: እንዲሄድ
  rationale: ግሱ አብሮ መከተልን ወይም አጅቦ መሄድን ያመለክታል። «ከእርሱ ጋር እንዲሄድ» ይህን ትርጉም ለዘመናዊ አንባቢ ተፈጥሯዊ በሆነ አገላለጽ ያቀርባል።
- source_word: εἰ μὴ
  choice: በቀር
  rationale: በዚህ አገባብ ሁኔታን ሳይሆን ከሌሎች የተለዩትን ሰዎች የሚያሳይ ስለሆነ «በቀር» ትክክለኛና ተፈጥሯዊ ነው።
- source_word: τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην
  choice: ጴጥሮስ፣ ያዕቆብና ዮሐንስ
  rationale: ስሞቹ በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የታወቁትን ቅርጾች ይከተላሉ፤ ዝርዝሩም በዘመናዊ የአማርኛ ሥርዓተ ነጥብና ማያያዣ ቀርቧል።
- source_word: τὸν ἀδελφὸν Ἰακώβου
  choice: የያዕቆብ ወንድም
  rationale: ይህ ተጨማሪ መለያ የትኛው ዮሐንስ እንደሆነ በቀጥታ ያብራራል።
