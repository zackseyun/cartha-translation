  verdict: approve
  source_fidelity: The translation accurately conveys the total exclusion (οὐδένα with negated ἀφῆκεν), the permission to go with Jesus, and the sole exception of Peter, James, and John, identified as James’s brother. The rendering «ከእርሱ ጋር እንዲሄድ» naturally represents συνακολουθῆσαι μετ’ αὐτοῦ in context.
  naturalness: The sentence is grammatical, clear, and suitably dignified in modern standard Amharic. The exception construction with «በቀር» is natural, and the established biblical forms of the personal names are used consistently.
  terminology: «አልፈቀደም» appropriately renders ἀφῆκεν in this infinitival construction. «ማንም» with the negative verb clearly expresses “no one,” while «የያዕቆብ ወንድም» correctly preserves the identifying apposition for John.
