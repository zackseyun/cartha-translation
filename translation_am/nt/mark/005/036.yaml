  source_fidelity: The draft accurately preserves the principal reading of παρακούσας as hearing the report, Mark’s historical present (λέγει), the addressee’s office, and the two imperatives. The alternative sense of παρακούσας is appropriately retained in a footnote.
  naturalness: The phrase የሚነገረውን ቃል is intelligible but overly literal and less natural in this narrative context. እየተነገረ ያለውን ነገር naturally conveys ‘the thing/report being spoken.’ Introducing the recipient with ለ… and እንዲህ ይላል is also clearer modern Amharic.
  terminology: የምኩራብ አለቃ is an appropriate modern rendering of ἀρχισυνάγωγος. እመን is a direct, suitable rendering of πίστευε. The footnote’s ታመን is not a reliable equivalent for ‘trust’ here and is replaced by ተማመን.
