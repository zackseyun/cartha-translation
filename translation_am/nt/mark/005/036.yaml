  rationale: ቀጥተኛና ተፈጥሯዊ የትእዛዝ ቅርጽ ነው። በግሪኩ የአሁን ጊዜ ትእዛዝ ውስጥ የመቀጠል ፍንጭ ሊኖር ቢችልም፣ ያንን በዋናው ጽሑፍ ላይ ከመጠን በላይ አይወስንም።
theological_decisions:
- issue: የπαρακούσας ትርጉም
  choice: ኢየሱስ የተነገረውን ሰምቶ የምኩራቡን አለቃ አነጋገረ።
