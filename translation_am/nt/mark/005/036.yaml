- issue: በትእዛዙ ውስጥ የπιστεύω አተረጓጎም
  choice: እመን
  alternative: እምነት ይኑርህ፤ ታመን
  rationale: ‘እመን’ የግሪኩን ግስ በቀጥታ ይተረጉማል፤ ‘እምነት ይኑርህ’ እና ‘ታመን’ የትርጉም ልዩነቱን የሚያሳዩ ሕጋዊ አማራጮች በማስታወሻ ቀርበዋል።
