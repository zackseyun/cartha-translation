  - severity: medium
    issue: Footnote alternative ታመን does not naturally mean ‘trust’ in this context
    rationale: ታመን ordinarily has a passive sense (‘be believed/trusted’). ተማመን is the appropriate Amharic verb for ‘trust/rely on,’ though its lack of an expressed object makes it an alternative nuance rather than the main rendering.
