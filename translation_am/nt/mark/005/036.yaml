  rationale: ቃሉ ኢየሱስ ለኢያኢሮስ የተነገረውን ወሬ ሰምቶ ወዲያው መልስ መስጠቱን በተፈጥሯዊ አማርኛ ያሳያል። ‘ችላ ብሎ’ የሚለው ሌላው የቃሉ ትርጉም በማስታወሻ ተጠብቋል።
