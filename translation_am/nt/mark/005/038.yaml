  text: καὶ ⸀ἔρχονται εἰς τὸν οἶκον τοῦ ἀρχισυναγώγου, καὶ θεωρεῖ θόρυβον ⸀καὶ κλαίοντας καὶ ἀλαλάζοντας πολλά,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/038.yaml
  text: And they come to the house of the synagogue leader[a], and he sees a commotion, and people weeping and wailing loudly.
translation:
  language: am
  text: ወደ ምኩራብ አለቃው ቤት ደረሱ፤ ኢየሱስም ግርግርን[a]፣ የሚያለቅሱና በታላቅ ድምፅ ዋይ የሚሉ ሰዎችን አየ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሁከትን”፤ የግሪኩ ቃል ጫጫታ ያለበትን የተደበላለቀ ሁኔታ ወይም ሁከት ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: ደረሱ
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ አገላለጽ በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜ ተተርጉሟል፤ ቡድኑ ወደ ቤቱ መድረሱን በግልጽ ያሳያል።
- source_word: οἶκον
  choice: ቤት
  rationale: ቃሉን ቀጥታና ተፈጥሯዊ በሆነ መንገድ ይወክላል።
- source_word: ἀρχισυναγώγου
  choice: የምኩራብ አለቃ
  rationale: በምኩራብ ውስጥ የሚመራውን ወይም የሚቆጣጠረውን ባለሥልጣን የሚገልጽ ግልጽና የተለመደ አማርኛ ነው።
- source_word: θεωρεῖ
  choice: አየ
  rationale: ቀላልና ቀጥተኛ አቻ ነው። በዐውደ ንባቡ የግሱ ባለቤት ኢየሱስ ስለሆነ ለግልጽነት ስሙ ተጠቅሷል።
- source_word: θόρυβον
  choice: ግርግር
  rationale: ቃሉ ተራ ድምፅን ብቻ ሳይሆን ጫጫታና የተደበላለቀ ሁከት ያለበትን ሁኔታ ያመለክታል።
- source_word: κλαίοντας
  choice: የሚያለቅሱ ሰዎች
  rationale: የግሪኩ አሳታፊ ግስ ሰዎችን በስም ተክቶ ይገልጻል፤ በአማርኛም ‘ሰዎች’ መጨመሩ ትርጉሙን ግልጽና ተፈጥሯዊ ያደርገዋል።
- source_word: ἀλαλάζοντας πολλά
  choice: በታላቅ ድምፅ ዋይ የሚሉ
  rationale: ἀλαλάζω በሐዘን ጊዜ ከፍ ባለ ድምፅ ዋይታ ማሰማትን ያመለክታል፤ πολλά ደግሞ ድርጊቱን ያጠናክራል።
