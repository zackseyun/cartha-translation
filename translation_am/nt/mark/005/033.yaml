review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the Greek narrative sequence and all principal elements: the woman’s fear and trembling, her awareness of what had happened to her, her coming and falling before Jesus, and her full disclosure. A small wording adjustment better reflects γεγονός as an event that occurred to her without the potentially adverse implication that የደረሰባት can sometimes carry in modern Amharic.'
  naturalness: The draft is generally clear and idiomatic. Reordering the participial phrases to follow the Greek more closely and using በእርሷ ላይ የተፈጸመው makes the reference to the event more natural and precise in this healing context.
  terminology: ሴቲቱ, ፈርታና እየተንቀጠቀጠች, በፊቱ ወደቀች, and እውነቱን ሁሉ are suitable modern-standard Amharic renderings. The posture is retained without adding a theological interpretation.
  issues:
  - severity: low
    issue: የደረሰባትን ነገር may be heard as something adverse that befell her.
    rationale: Although it can be understood neutrally, the context is specifically the healing she has experienced. በእርሷ ላይ የተፈጸመውን ነገር preserves the Greek’s neutral wording while avoiding an unintended negative nuance.
  - severity: low
    issue: The Amharic participial order differs from the source order.
    rationale: The existing order is grammatically possible, but placing fear and trembling first more closely follows the Greek and gives the sentence a smoother narrative progression.
  revised_text: ሴቲቱ ግን ፈርታና እየተንቀጠቀጠች፣ በእርሷ ላይ የተፈጸመውን ነገር አውቃ፣ መጥታ በፊቱ ወደቀች፤ እውነቱንም ሁሉ ነገረችው።
