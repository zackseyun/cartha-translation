source:
  edition: SBLGNT
  text: ἡ δὲ γυνὴ φοβηθεῖσα καὶ τρέμουσα, εἰδυῖα ὃ γέγονεν ⸀αὐτῇ, ἦλθεν καὶ προσέπεσεν αὐτῷ καὶ εἶπεν αὐτῷ πᾶσαν τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/033.yaml
  text: But the woman[a], fearing and trembling, knowing what had happened to her[b], came and fell down before him and told him the whole truth.
translation:
  language: am
  text: ሴቲቱ ግን ፈርታና እየተንቀጠቀጠች፣ በእርሷ ላይ የተፈጸመውን ነገር አውቃ፣ መጥታ በፊቱ ወደቀች፤ እውነቱንም ሁሉ ነገረችው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: ግን
  rationale: በቀደመው ትዕይንት እና በሴቲቱ ምላሽ መካከል ያለውን ቀላል ንፅፅርና የትረካ ሽግግር ያሳያል።
- source_word: ἡ γυνὴ
  choice: ሴቲቱ
  rationale: በትረካው አስቀድሞ የተጠቀሰችውን የታወቀች ሴት ያመለክታል።
- source_word: φοβηθεῖσα καὶ τρέμουσα
  choice: ፈርታና እየተንቀጠቀጠች
  rationale: ሁለቱን ተያያዥ የስሜትና የአካል ሁኔታዎች በተፈጥሯዊ አማርኛ እያንዳንዳቸውን ሳያዳክም ይገልጣል።
- source_word: εἰδυῖα ὃ γέγονεν αὐτῇ
  choice: የደረሰባትን ነገር አውቃ
  rationale: የተፈወሰችበትን ክስተት እንዳወቀች ይገልጣል፤ የአሳታፊውን የሁኔታ ግንኙነት ይጠብቃል እንጂ በግልጽ የምክንያት ሐረግ አያደርገውም።
- source_word: ἦλθεν
  choice: መጥታ
  rationale: ቀላሉን የመቅረብ እንቅስቃሴ በተፈጥሯዊ የትረካ ቅርጽ ያቀርባል።
- source_word: προσέπεσεν αὐτῷ
  choice: በፊቱ ወደቀች
  rationale: በኢየሱስ ፊት የመውደቋን ተግባርና የአክብሮት ወይም የልመና አቋም ይጠብቃል፤ ቃሉ ከሚናገረው በላይ የአምልኮ ትርጉም አይጨምርም።
- source_word: εἶπεν αὐτῷ πᾶσαν τὴν ἀλήθειαν
  choice: እውነቱንም ሁሉ ነገረችው
  rationale: ምንም ሳትደብቅ ሙሉውን እውነት እንደተናገረችለት በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: በ προσέπεσεν αὐτῷ የተገለጠው በኢየሱስ ፊት የወሰደችው አቋም
  choice: በፊቱ ወደቀች
  alternative: በእግሩ ሥር ወደቀች፤ በፊቱ ተደፋች
  rationale: ግሱ በአክብሮት፣ በፍርሃት ወይም በልመና በአንድ ሰው ፊት መውደቅን ሊያመለክት ይችላል። የተመረጠው አተረጓጎም ድርጊቱን ይጠብቃል፤ ጥቅሱ በግልጽ ያልወሰነውን ልዩ የአምልኮ ትርጉም ግን አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የግሪኩ አሳታፊ ሐረጎች የአማርኛን ተፈጥሯዊ ቅደም ተከተል በሚከተል መልኩ ተደርድረዋል።
