  text: καὶ ἔρχονται πρὸς τὸν Ἰησοῦν, καὶ θεωροῦσιν τὸν δαιμονιζόμενον ⸀καθήμενον ἱματισμένον καὶ σωφρονοῦντα, τὸν ἐσχηκότα τὸν ⸀λεγιῶνα, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/015.yaml
  text: And they came to Jesus and saw the demon-possessed man sitting there[b][a], clothed and in his right mind—the one who had the legion—and they were afraid.
translation:
  language: am
  text: ወደ ኢየሱስም መጡ፤ አጋንንት ይዘውት የነበረውን፣ ሌጌዎን የነበረበትን[a] ሰው ተቀምጦ፣ ልብስ ለብሶ፣ ጤናማ አእምሮም ይዞ አዩት፤ ፈሩም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሌጌዎን” የተባለው የነበረበትን ሰው። “ሌጌዎን” ቀደም ሲል አጋንንቱ ራሳቸውን የጠሩበትን ስያሜ ስለሚያስተጋባ፣ እንደ ስም ሊወሰድ ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχονται
  choice: መጡ
  rationale: የግሪኩ ቃል ታሪካዊ የአሁን ጊዜ ቢሆንም፣ በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜ ይሻላል።
- source_word: θεωροῦσιν
  choice: አዩት
  rationale: ሌላውን ታሪካዊ የአሁን ጊዜ በተፈጥሯዊ የአማርኛ ትረካ ወደ ያለፈ ጊዜ ይለውጣል፤ የተመለከቱትንም ሰው በተውላጠ ስሙ ያመለክታል።
- source_word: δαιμονιζόμενον
  choice: አጋንንት ይዘውት የነበረውን ሰው
  rationale: የአጋንንትን እውነተኛ ቁጥጥር ሳያለዝብ ያለፈውን ሁኔታ በዐውዱ መሠረት ያሳያል፤ ከጥሬው ‘በአጋንንት የተያዘው’ ይልቅም ተፈጥሯዊ ነው።
- source_word: καθήμενον
  choice: ተቀምጦ
  rationale: የሰውየውን በዓይን የሚታይ ሁኔታ አጭርና ተፈጥሯዊ በሆነ መንገድ ይገልጣል።
- source_word: ἱματισμένον
  choice: ልብስ ለብሶ
  rationale: ከቀድሞው እርቃንነት ጋር ያለውን ንጽጽር በግልጽና ወቅታዊ አማርኛ ይጠብቃል።
- source_word: σωφρονοῦντα
  choice: አእምሮው ተረጋግቶ
  rationale: የተመለሰውን አእምሯዊ ጤንነትና ራስን መግዛት ክሊኒካዊ ወይም አዋራጅ ቃል ሳይጠቀም ያሳያል።
- source_word: ἐσχηκότα
  choice: የነበረበትን
  rationale: ፍጹም አንቀጹ ሰውየውን በቀድሞ ሁኔታው ይለየዋል፤ በዚህ ጊዜ ሁኔታው እንደተለወጠም ያመለክታል።
- source_word: λεγιῶνα
  choice: ሌጌዎን
  rationale: የግሪኩን λεγιών በአማርኛ የተለመደ የድምፅ ቅርጽ ያቀርባል፤ ስያሜ ወይም መግለጫ መሆኑን በግድ አይወስንም።
- source_word: ἐφοβήθησαν
  choice: ፈሩም
  rationale: ድንገተኛውን የፍርሃት ምላሽ በአጭር፣ ግልጽና ተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: የአጋንንት ቁጥጥር መግለጫ
  choice: አጋንንት ይዘውት የነበረውን ሰው
  alternative: በአጋንንት የተያዘውን ሰው
  rationale: ጽሑፉ የአጋንንትን እውነተኛ ተጽዕኖ ያቀርባል፤ ትርጉሙ ይህን ወደ ተራ ሕመም አያለዝብም፣ የአሁኑ ሁኔታ እንዳልሆነም ዐውዱን ተከትሎ ያሳያል።
- issue: λεγιών እንደ ስያሜ ወይም እንደ መግለጫ
  choice: ሌጌዎን የነበረበትን
  alternative: “ሌጌዎን” የተባለው የነበረበትን
  rationale: የግሪኩ የይስሙላ አንቀጽና የቀደመው የአጋንንቱ ራስን መጥራት ሁለቱንም አጠቃቀሞች ይፈቅዳሉ። ዋናው ጽሑፍ አሻሚነቱን ይጠብቃል፤ ማስታወሻውም የስምነት ንባቡን ያቀርባል።
