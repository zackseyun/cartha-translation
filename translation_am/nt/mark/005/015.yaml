    issue: Awkward and unclear coordination of the man's visible condition
    rationale: The Greek coordinates καθήμενον, ἱματισμένον, and σωφρονοῦντα as descriptions of the same man. The draft's word order makes the relationship of “ተቀምጦ” to the preceding clauses less smooth and natural.
  - severity: low
