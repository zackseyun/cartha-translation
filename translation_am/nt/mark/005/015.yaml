  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ታሪካዊ የአሁን ጊዜ በተፈጥሯዊ የአማርኛ ያለፈ ጊዜ ቀርቧል፤ የአእምሮ መመለሱም ከመጠን በላይ ክሊኒካዊ ወይም አዋራጅ ቃል ሳይጨመር ተገልጿል።
