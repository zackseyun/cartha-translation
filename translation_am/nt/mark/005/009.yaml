  text: καὶ ἐπηρώτα αὐτόν· Τί ⸂ὄνομά σοι⸃; καὶ ⸂λέγει αὐτῷ⸃· ⸀Λεγιὼν ὄνομά μοι, ὅτι πολλοί ἐσμεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/009.yaml
  text: And he was asking him, “What is your name?” And he says to him, “My name is Legion,[a] because we are many.”
translation:
  language: am
  text: እርሱም፣ “ስምህ ማን ነው?” ብሎ ይጠይቀው ነበር። እርሱም፣ “ስሜ ሌጌዎን[a] ነው፤ ብዙዎች ነንና” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ሌጌዎን” ወደ ግሪክ የገባ የላቲን ወታደራዊ ቃል ሲሆን፣ ብዙ ወታደሮች ያሉበትን ትልቅ የሮም ሠራዊት ክፍል ያመለክታል። እዚህ ግን ጋኔኑ የተናገረው ስም ሆኖ ብዛታቸውንም ያመለክታል።
    reason: cultural_note
lexical_decisions:
- source_word: ἐπηρώτα
  choice: ይጠይቀው ነበር
  rationale: የግሪኩን ኢምፐርፌክት አንቀጽ ቀጣይነት ወይም ድግግሞሽ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Τί ὄνομά σοι
  choice: ስምህ ማን ነው?
  rationale: ቀጥተኛውን ጥያቄ በተለመደና ተፈጥሯዊ የአማርኛ አነጋገር ያቀርባል።
- source_word: λέγει αὐτῷ
  choice: አለው
  rationale: የማርቆስ ታሪካዊ የአሁን ጊዜ አጠቃቀም በአማርኛ በቀጥታ ቢተረጎም የማይፈጥረውን ተፈጥሯዊነት ለመጠበቅ የትረካ አለፈ ጊዜ ተመርጧል።
- source_word: Λεγιὼν
  choice: ሌጌዎን
  rationale: በጽሑፉ የተናጋሪው ስም/መጠሪያ ሆኖ ስለቀረበ ትርጉሙ ሳይተካ በድምፅ ተጻፈ።
- source_word: ὄνομά μοι
  choice: ስሜ … ነው
  rationale: የግሪኩን የራስ መግለጫ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: ὅτι πολλοί ἐσμεν
  choice: ብዙዎች ነንና
  rationale: ὅτι ለስሙ ምክንያት መስጠቱንና ከነጠላ ወደ ብዙ ቁጥር የሚደረገውን ለውጥ ይጠብቃል።
theological_decisions:
- issue: ተናጋሪው ከነጠላ ራስ-መግለጫ ወደ ብዙ ቁጥር መሸጋገሩ
  choice: “ስሜ … ነው” እና “ብዙዎች ነን” የሚሉትን ሁለቱንም እንዳሉ ማቆየት
  alternative: ውጥረቱን በማለስለስ “ስማችን ሌጌዎን ነው” ማለት
  rationale: ግሪኩ ነጠላውን ራስ-መግለጫና ብዙ ቁጥሩን ምክንያት ሆን ብሎ አብሮ ያቆያል፤ ትርጉሙም ይህን ሥነ መለኮታዊና ትረካዊ ውጥረት አይፈታውም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። የኢምፐርፌክት ቀጣይነት ተጠብቋል፤ ታሪካዊው የአሁን ጊዜ ግን ለአማርኛ ትረካ ተፈጥሯዊነት በአለፈ ጊዜ ቀርቧል።
