  text: καὶ διὰ παντὸς νυκτὸς καὶ ἡμέρας ἐν τοῖς ⸂μνήμασιν καὶ ἐν τοῖς ὄρεσιν⸃ ἦν κράζων καὶ κατακόπτων ἑαυτὸν λίθοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/005.yaml
  text: And continually[a], night and day, among the tombs and on the mountains, he was crying out and cutting himself with stones.
translation:
  language: am
  text: ሌሊትና ቀን ሳያቋርጥ በመቃብሮች መካከልና በተራሮች ላይ እየጮኸ ራሱንም በድንጋዮች እየቆራረጠ ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ παντὸς νυκτὸς καὶ ἡμέρας
  choice: ሌሊትና ቀን ሳያቋርጥ
  rationale: የግሪክኛውን ቀጣይነትና ሙሉ የጊዜ ስፋት በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: μνήμασιν
  choice: መቃብሮች
  rationale: ቃሉ የሙታንን መቀበሪያ ስፍራዎች ያመለክታል፤ ይህም በአማርኛ ግልጽና የተለመደ ነው።
- source_word: ὄρεσιν
  choice: ተራሮች
  rationale: ὄρος የሚለውን መደበኛና ቀጥተኛ ትርጉም ይጠብቃል።
- source_word: ἦν κράζων
  choice: እየጮኸ ... ይኖር ነበር
  rationale: የቀድሞ ጊዜውን ቀጣይና ተደጋጋሚ ድርጊት በተፈጥሯዊ የአማርኛ አገባብ ያሳያል።
- source_word: κατακόπτων ἑαυτὸν
  choice: ራሱን ... እየቆራረጠ
  rationale: ከቀላል ‘መቁረጥ’ የበለጠ ከባድና ተደጋጋሚ የሆነውን ራስን የመጉዳት ድርጊት ያስተላልፋል።
- source_word: λίθοις
  choice: በድንጋይ
  rationale: የመሣሪያ አገባቡን በቀጥታና በተፈጥሯዊ አማርኛ ይገልጻል።
