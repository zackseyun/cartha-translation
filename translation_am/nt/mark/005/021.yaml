  text: Καὶ διαπεράσαντος τοῦ Ἰησοῦ ἐν τῷ πλοίῳ πάλιν εἰς τὸ πέραν συνήχθη ὄχλος πολὺς ἐπ’ αὐτόν, καὶ ἦν παρὰ τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/021.yaml
  text: And after Jesus had crossed over again in the boat to the other side[a], a large crowd gathered around him, and he was beside the sea.
translation:
  language: am
  text: ኢየሱስም በጀልባው እንደገና ወደ ማዶ ከተሻገረ በኋላ፣ ብዙ ሕዝብ በዙሪያው ተሰበሰበ፤ እርሱም በባሕሩ[a] ዳር ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይህም የገሊላ ባሕርን ማለት ነው፤ እርሱ ሐይቅ ቢሆንም በወንጌላት ውስጥ በተለምዶ “ባሕር” ተብሎ ይጠራል።
    reason: cultural_note
lexical_decisions:
- source_word: διαπεράσαντος
  choice: ከተሻገረ በኋላ
  rationale: የግሪኩ የአኦሪስት ተሳቢ ግስ ከዋናው ድርጊት በፊት የተፈጸመ ሁኔታን ያሳያል፤ ይህ አተረጓጎም የጊዜውን ቅደም ተከተል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐν τῷ πλοίῳ
  choice: በጀልባው
  rationale: በዚህ የሐይቅ ጉዞ አውድ ‘ጀልባ’ ተፈጥሯዊ ነው፤ የመሣሪያና የቦታ ፍቺውንም ‘በ’ በቂ ሁኔታ ያስተላልፋል።
- source_word: πάλιν
  choice: እንደገና
  rationale: ድርጊቱ ተደግሞ መፈጸሙን በግልጽ ያሳያል።
- source_word: εἰς τὸ πέραν
  choice: ወደ ማዶ
  rationale: በውኃ አካል መሻገር አውድ የተቃራኒውን ዳርቻ የሚያመለክት አጭርና ተፈጥሯዊ የአማርኛ አቻ ነው።
- source_word: συνήχθη
  choice: ተሰበሰበ
  rationale: የግሪኩን ተገብሮአዊ ቅርጽ እያንጸባረቀ በአማርኛ ለሕዝብ መሰብሰብ ተፈጥሯዊ አገላለጽ ነው።
- source_word: ὄχλος πολὺς
  choice: ብዙ ሕዝብ
  rationale: የሕዝቡን ብዛት በዘመናዊና በተለመደ አማርኛ ያስተላልፋል።
- source_word: ἐπ’ αὐτόν
  choice: በዙሪያው
  rationale: ሕዝቡ ወደ ኢየሱስ ቀርቦ ዙሪያውን መሰብሰቡን ከአውዱ ጋር በተስማማ ሁኔታ ያሳያል።
- source_word: παρὰ τὴν θάλασσαν
  choice: በባሕሩ ዳር
  rationale: παρά የሚያመለክተውን ከውኃው ዳርቻ አጠገብ የመሆን ቦታዊ ፍቺ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: θάλασσαν
  choice: ባሕር
  rationale: ምንጩ የሚጠቀመውን ‘ባሕር’ የሚለውን ቃል በዋናው ጽሑፍ ይጠብቃል፤ በትክክል ሐይቅ መሆኑ በማስታወሻ ተብራርቷል።
