  yaml_path: translation/nt/mark/005/012.yaml
  text: And they begged him[a], saying, “Send us into the pigs, so that we may enter them.”
translation:
  language: am
  text: እነርሱም፣ “ወደ አሳማዎቹ[a] ላከን፤ ወደ ውስጣቸው እንድንገባ” ብለው አጥብቀው ለመኑት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወደ እሪያዎቹ።”
    reason: χoῖρος ለሚለው ቃል የሚቻል የቃላት አማራጭ፤ በዋናው ጽሑፍ “አሳማዎቹ” የሚለው ዘመናዊና የተለመደ አገላለጽ ነው።
lexical_decisions:
- source_word: παρεκάλεσαν
  choice: አጥብቀው ለመኑት
  rationale: በዚህ አውድ παρακαλέω ተራ ጥያቄን ሳይሆን አጥብቆ መለመንን ያመለክታል፤ ይህ አገላለጽ የጥያቄውን አጣዳፊነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: αὐτόν
  choice: -ት (ለመኑት)
  rationale: ተሳቢው ኢየሱስን የሚያመለክተው የሦስተኛ መደብ ነጠላ ወንድ ተውላጠ ስም ሲሆን፣ በአማርኛ ከግሱ ጋር ተጣምሮ ቀርቧል።
- source_word: λέγοντες
  choice: ብለው
  rationale: የልመናቸውን ይዘት የሚያስተዋውቀውን የግሪክ አጋር ግስ በተፈጥሯዊ የአማርኛ አገባብ ይወክላል።
- source_word: Πέμψον ἡμᾶς
  choice: ላከን
  rationale: πέμπω በቀጥታ ‘መላክ’ ማለት ነው። አውዱ ፈቃድን ቢያካትትም፣ ትርጉሙ ያንን በማብራሪያ ሳይተካ የምንጩን ቀጥተኛ ትእዛዝ ጠብቋል።
- source_word: εἰς τοὺς χοίρους
  choice: ወደ አሳማዎቹ
  rationale: χοῖρος አሳማን ያመለክታል፤ ‘አሳማ’ በዘመናዊ መደበኛ አማርኛ ግልጽና የተለመደ ቃል ነው።
- source_word: ἵνα εἰς αὐτοὺς εἰσέλθωμεν
  choice: ግባንባቸው ዘንድ
  rationale: ἵνα የዓላማ ግንኙነቱን ያሳያል፤ εἰσέρχομαι ደግሞ ወደ ውስጥ መግባትን ይገልጣል። ‘ግባንባቸው’ የመግባቱን ተሳቢ በአማርኛ በግልጽ ያሳያል።
theological_decisions:
- issue: ተናጋሪዎቹ ለኢየሱስ ያቀረቡት ጥያቄ ባሕርይ
  choice: ተናጋሪዎቹ ከኢየሱስ ሥልጣን በታች ሆነው ወደ አሳማዎቹ ለመግባት እንዲልካቸው አጥብቀው ሲለምኑ ቀርበዋል።
  alternative: የኢየሱስን ሥልጣን ሳያጎላ፣ ቦታ እንዲቀይሩ ብቻ እንደጠየቁ ማቅረብ።
  rationale: ‘አጥብቀው ለመኑት’ እና ‘ላከን’ የሚሉት አገላለጾች ትረካው ኢየሱስ በርኩሳን መናፍስት ላይ ያለውን ሥልጣን የሚያቀርብበትን መንገድ ያንጸባርቃሉ፤ ከጽሑፉ በላይ የሆነ ዶግማዊ ማብራሪያ አይጨምሩም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። ‘ዘንድ’ የዓላማ ግንኙነቱን በአጭርና ለመጽሐፍ ቅዱስ ንባብ ተስማሚ በሆነ መልኩ ያቀርባል።
