  rationale: The revision removes the erroneous and redundant accusative እርሱን. The suffix in እያለው retains αὐτῷ (“to him”), while the quoted command remains directly addressed to the unclean spirit, preserving the source text’s syntactic and narrative tension. The imperfect is rendered naturally by እያለው ነበር.
