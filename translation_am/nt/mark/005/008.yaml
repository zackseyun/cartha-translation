  text: ἔλεγεν γὰρ αὐτῷ· Ἔξελθε τὸ πνεῦμα τὸ ἀκάθαρτον ἐκ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/008.yaml
  text: For he was saying to him[a], “Come out of the man, unclean spirit.”
translation:
  language: am
  text: “ርኩስ መንፈስ ሆይ፣ ከሰውየው ውጣ!” እያለው ነበርና።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “እያለው ነበር” የሚለው የግሪክ ግስ ድርጊቱ ቀጣይ ወይም ተደጋጋሚ እንደነበር ሊያመለክት ይችላል። “ርኩሱ መንፈስ” ተብሎም ቃል በቃል ሊተረጎም ይችላል፤ በዚህ ዐውድ ግን አገባቡ ቀጥተኛ ጥሪ ሆኖ ይሠራል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: ይለው ነበር
  rationale: የግስ ያለፈ ጊዜ ቀጣይነትን ወይም መደጋገምን የሚያሳየውን imperfect ቅርጽ ይጠብቃል።
- source_word: γὰρ
  choice: ነበርና
  rationale: ከቀደመው ቁጥር ጋር ያለውን የማብራሪያ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: αὐτῷ
  choice: እርሱን
  rationale: የግሪኩ ተውላጠ ስም በትረካው ውስጥ ወደ ሰውየው እንደሚያመለክት ይጠብቃል፤ ትእዛዙ ግን በውስጡ ላለው ርኩስ መንፈስ ነው።
- source_word: Ἔξελθε
  choice: ውጣ
  rationale: ቀጥተኛውን aorist imperative በአጭርና ተፈጥሯዊ የአማርኛ ትእዛዝ ይገልጻል።
- source_word: τὸ πνεῦμα τὸ ἀκάθαρτον
  choice: ርኩስ መንፈስ ሆይ
  rationale: ቅርጹ በሰዋስው መደበኛ የጥሪ ቅርጽ ባይሆንም እዚህ ቀጥተኛ ጥሪ ሆኖ ይሠራል፤ “ሆይ” ይህን ተግባር በግልጽ አማርኛ ያሳያል።
- source_word: ἐκ τοῦ ἀνθρώπου
  choice: ከሰውየው
  rationale: ἐκ ከመውጣት ግስ ጋር ከውስጥ ወደ ውጭ መንቀሳቀስን ያሳያል፤ ἄνθρωπος በዐውዱ የታወቀውን ወንድ ሰው ያመለክታል።
theological_decisions:
- issue: πνεῦμα ἀκάθαρτον በአጋንንት ማስወጣት ዐውድ ያለው አተረጓጎም
  choice: ርኩስ መንፈስ
  alternative: ክፉ መንፈስ
  rationale: ግሪኩ በቀጥታ “ርኩስ መንፈስ” ይላል፤ “ክፉ መንፈስ” ትርጓሜያዊ ማስፋፊያ ስለሆነ የምንጩን የርኩሰት ቃል ለመጠበቅ አልተመረጠም።
- issue: αὐτῷ የሚያመለክተው
  choice: ሰውየውን እንደሚያመለክት በዋናው ጽሑፍ ማቅረብ
  alternative: መንፈሱን እንደሚያመለክት መተርጎም
  rationale: የትረካው ወዲያውኑ ዐውድ ተውላጠ ስሙን ከሰውየው ጋር ያያይዘዋል፤ የትእዛዙ ቀጥተኛ ተቀባይ ግን ርኩሱ መንፈስ ነው። ይህ የጽሑፉ ውጥረት አልተወገደም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለአብዛኛው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ሰውየው” የዐውዱን የታወቀ ወንድ ግለሰብ በተፈጥሯዊ አገላለጽ ያመለክታል፤ “ርኩስ መንፈስ ሆይ” ደግሞ የቀጥተኛ ጥሪውን ኃይል ይጠብቃል።
