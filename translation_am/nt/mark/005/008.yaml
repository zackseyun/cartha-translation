review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the imperfect sense of ἔλεγεν, the explanatory force of γάρ, the command to leave, the designation “unclean spirit,” and the movement out of the man. However, initial እርሱን is accusative and is syntactically incompatible with αὐτῷ (“to him”); moreover, it is redundantly followed by ይለው (“he was saying to him”).
  naturalness: 'Apart from the opening construction, the wording is clear and suitably dignified. Removing the unattached accusative produces idiomatic modern Amharic while retaining the Greek’s narrative ambiguity: the speech is said to the man, while its imperative directly addresses the unclean spirit.'
  terminology: ርኩስ መንፈስ accurately renders πνεῦμα τὸ ἀκάθαρτον and should be retained. ሆይ naturally marks the Greek nominative functioning as direct address. ሰውየው appropriately refers to the particular man in context.
  issues:
  - severity: high
    issue: እርሱን is incorrectly used for αὐτῷ and is syntactically redundant.
    rationale: αὐτῷ is dative, “to him.” In the draft, እርሱን is accusative (“him”), while ይለው already incorporates the dative recipient (“he was saying to him”). The resulting opening is ungrammatical or at least seriously disfluent in Amharic.
  revised_text: “ርኩስ መንፈስ ሆይ፣ ከሰውየው ውጣ!” እያለው ነበርና።[a]
