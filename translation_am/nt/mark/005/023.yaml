base_translation:
  language: en
  yaml_path: translation/nt/mark/005/023.yaml
  text: And he begged him earnestly[a], saying, “My little daughter is at the point of death. Come and lay your hands on her, so that she may be healed and live.”
translation:
  language: am
  text: አጥብቆ ለመነው፣ እንዲህ እያለ፦ “ትንሿ ሴት ልጄ ለሞት ተቃርባለች። መጥተህ እጆችህን በእርሷ ላይ ጫን፤ እንድትድን[a]ና እንድትኖር።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “እንድትፈወስ” ወይም “ደኅና እንድትሆን” ተብሎም ሊተረጎም ይችላል። የግሪኩ ግስ መዳንን፣ መታደግን ወይም መፈወስን ሊያመለክት ይችላል፤ በዚህ ቅርብ ዐውድ ግን አካላዊ ፈውስን ያመለክታል።
    reason: alternative_reading
lexical_decisions:
- source_word: παρακαλεῖ αὐτὸν πολλὰ
  choice: አጥብቆ ለመነው
  rationale: παρακαλεῖ የሚያመለክተውን አስቸኳይ ልመና እና πολλὰ የሚሰጠውን አጽንዖት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: θυγάτριόν μου
  choice: ትንሿ ልጄ
  rationale: የግሪኩን ድንበርተኛ ቅርጽ በመጠበቅ የልጅነቷን ዕድሜና የአባቷን ፍቅር ያሳያል።
- source_word: ἐσχάτως ἔχει
  choice: ለሞት ተቃርባለች
  rationale: በዐውዱ ያለውን የመጨረሻና እጅግ አደገኛ ሁኔታ ግልጽና ተፈጥሯዊ በሆነ አማርኛ ይገልጣል።
- source_word: ἐλθὼν ἐπιθῇς τὰς χεῖρας αὐτῇ
  choice: መጥተህ እጆችህን ጫንባት
  rationale: የግሪኩን ተከታታይ ድርጊትና የእጆችን ብዙ ቁጥር በተፈጥሯዊ የአማርኛ ልመና ይጠብቃል።
- source_word: σωθῇ
  choice: ድና
  rationale: መዳንን፣ መታደግን ወይም መፈወስን ሊያመለክት የሚችለውን የግሪኩን ሰፊ ትርጉም ይጠብቃል፤ በዚህ ዐውድ ግን አካላዊ ፈውስ ዋናው ሐሳብ ነው።
- source_word: ζήσῃ
  choice: በሕይወትም ትኖር
  rationale: σωθῇ ከተባለው በኋላ የሚጠበቀውን ውጤት፣ ማለትም በሕይወት መኖሯን፣ በግልጽ ሁኔታ ያስተላልፋል።
theological_decisions:
- issue: በፈውስ ዐውድ ውስጥ σωθῇን መተርጎም
  choice: ድና
  alternative: ተፈውሳ / ጤናማ ሆና
  rationale: “ድና” የመታደግና የመፈወስ ትርጉሞችን በአማርኛም ሊሸከም ስለሚችል የምንጩን የቃላት ውጥረት ይጠብቃል፤ ወዲያውኑ ያለው ዐውድ ግን አካላዊ ፈውስን ያመለክታል።
