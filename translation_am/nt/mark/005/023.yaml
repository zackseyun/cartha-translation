revisions:
- from: እንዲህም እያለ አጥብቆ ለመነው፦ “ትንሿ ልጄ ለሞት ተቃርባለች። ድና[a] በሕይወትም ትኖር ዘንድ መጥተህ እጆችህን ጫንባት።”
  to: አጥብቆ ለመነው፣ እንዲህ እያለ፦ “ትንሿ ሴት ልጄ ለሞት ተቃርባለች። መጥተህ እጆችህን በእርሷ ላይ ጫን፤ እንድትድን[a]ና እንድትኖር።”
