review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the urgent appeal, the girl's critical condition, the coming and laying on of hands, and the intended result. However, “ድና” is an imperative (“be saved/healed!”) and does not represent the dependent purpose subjunctive σωθῇ; it must be recast as “እንድትድን.” “እንዲህም እያለ” is also less direct than the source’s simple participial introduction.
  naturalness: The revised wording uses fluent modern standard Amharic. “እንዲህ እያለ” naturally introduces the quotation, and “እንድትድንና እንድትኖር” correctly and smoothly expresses the two coordinated purpose clauses.
  terminology: “እንድትድን” appropriately retains the semantic breadth of σωθῇ (rescue/save/heal) without imposing a doctrinal reading; the footnote supplies the contextually likely healing sense. “ትንሿ ሴት ልጄ” makes θυγάτριον explicitly feminine while retaining its diminutive-affectionate force.
  issues:
  - severity: high
    issue: “ድና” is morphologically and syntactically an imperative.
    rationale: σωθῇ is an aorist passive subjunctive governed by ἵνα, coordinated with ζήσῃ. In Amharic it needs a purpose/dependent form such as “እንድትድን,” not a direct command.
  - severity: medium
    issue: The opening “እንዲህም እያለ” is awkwardly intensified.
    rationale: λέγων merely introduces Jairus’s words. “እንዲህ እያለ” is more idiomatic and avoids adding emphasis not present in the Greek.
  - severity: low
    issue: “ልጄ” alone does not explicitly identify the child as a daughter.
    rationale: The Greek θυγάτριόν is explicitly feminine. Adding “ሴት” preserves this information in Amharic.
  revised_text: አጥብቆ ለመነው፣ እንዲህ እያለ፦ “ትንሿ ሴት ልጄ ለሞት ተቃርባለች። መጥተህ እጆችህን በእርሷ ላይ ጫን፤ እንድትድን[a]ና እንድትኖር።”
