  naturalness: The proposed revision is idiomatic modern standard Amharic, keeps the compact narrative sequence, and avoids the unnecessary expansion in the draft.
  terminology: «በፊቱ ሰገደ» appropriately preserves the physical act and the contextual ambiguity of προσκυνέω. The footnote retains “worshiped” and respectful obeisance as alternatives without imposing a theological conclusion.
