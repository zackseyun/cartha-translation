id: MRK.5.6
reference: Mark 5:6
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸂καὶ ἰδὼν⸃ τὸν Ἰησοῦν ἀπὸ μακρόθεν ἔδραμεν καὶ προσεκύνησεν ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/006.yaml
  text: And seeing Jesus from a distance[a], he ran and bowed down before him,
translation:
  language: am
  text: ከሩቅ ሆኖ ኢየሱስን ባየ ጊዜ፣ ሮጦ በፊቱ ሰገደ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «አመለከው» ወይም «በክብር ሰገደለት»። የግሪኩ ግስ እንደ አውዱ አምልኮን ወይም በአክብሮት በፊት መስገድን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: ባየው ጊዜ
  rationale: የግሪኩ ያለፈ ጊዜ አጋዥ ግስ ከዋናው ድርጊት ጋር ያለውን ጊዜያዊ ቅደም ተከተል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἀπὸ μακρόθεν
  choice: ከሩቅ
  rationale: የቦታ ርቀትን በግልጽና በተለመደ ዘመናዊ አማርኛ ይገልጻል።
- source_word: ἔδραμεν
  choice: ሮጦ ወደ እርሱ መጣ
  rationale: ቀጥተኛ ትርጉሙን የሚያቆየው «ሮጠ» ቢሆንም፣ በአማርኛ «ሮጦ ወደ እርሱ መጣ» ወደ ኢየሱስ የተደረገውን እንቅስቃሴ በተፈጥሯዊ መንገድ ያቀርባል፤ ተጨማሪ የፍጥነት ኃይል አያስገባም።
- source_word: προσεκύνησεν αὐτόν
  choice: በፊቱ ሰገደ
  rationale: «ሰገደ» የአካላዊ መውደቅንና ክብር መስጠትን ሊያመለክት ይችላል፤ ቃሉ በዚህ አውድ ሙሉ ሃይማኖታዊ አምልኮን ወይም የታዛዥነት ስግደትን እንደሚያመለክት ሳይወስን የግሪኩን አሻሚነት ይጠብቃል።
- source_word: καὶ
  choice: -ም / -ና
  rationale: የማርቆስን ተከታታይ ትረካ በአማርኛ ተፈጥሯዊ የማያያዣ ቅጥያዎች ይጠብቃል።
- source_word: τὸν Ἰησοῦν
  choice: ኢየሱስን
  rationale: የግሪኩን ቀጥተኛ ተሳቢ በአማርኛው «-ን» ምልክት በትክክል ያቀርባል።
theological_decisions:
- issue: προσεκύνησεν ለኢየሱስ የቀረበ ግልጽ ሃይማኖታዊ አምልኮ ተብሎ መተርጎም አለበት ወይስ አይገባም?
  choice: በዋናው ጽሑፍ «በፊቱ ሰገደ» ተብሎ ተተርጉሟል።
  alternative: «አመለከው» ወይም «ክብር ሰጥቶ ሰገደለት»
  rationale: προσκυνέω ሃይማኖታዊ አምልኮን፣ የክብር ስግደትን ወይም በፊት መውደቅን ሊያመለክት ይችላል። ዋናው ትርጉም የሚታየውን ድርጊት በማቅረብ ምንጩ የሚፈቅደውን ሥነ መለኮታዊ ውጥረት ሳይፈታ ያቆያል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው የአማርኛ አገላለጽ ተጠቅሟል። የግሪኩ ተከታታይ ትረካ በተፈጥሯዊ የአማርኛ የግስ ቅደም ተከተል ቀርቧል።
