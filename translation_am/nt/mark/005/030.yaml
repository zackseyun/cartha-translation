  text: καὶ ⸀εὐθὺς ὁ Ἰησοῦς ἐπιγνοὺς ἐν ἑαυτῷ τὴν ἐξ αὐτοῦ δύναμιν ἐξελθοῦσαν ἐπιστραφεὶς ἐν τῷ ὄχλῳ ἔλεγεν· Τίς μου ἥψατο τῶν ἱματίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/030.yaml
  text: And immediately Jesus[a], perceiving in himself that power had gone out from him, turned around in the crowd and said, “Who touched my garments?”
translation:
  language: am
  text: ወዲያውኑም ኢየሱስ ኃይል ከእርሱ እንደወጣ በራሱ አውቆ፣ በሕዝቡ መካከል ዘወር ብሎ፣ “ልብሶቼን[a] የነካው ማን ነው?” አለ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ልብሴን።”
    reason: ἱμάτια በግሪክ ብዙ ቁጥር ቢሆንም፣ በአማርኛ ‘ልብሴን’ የሚለው ነጠላ ቅርጽ ልብስን በአጠቃላይ ሊያመለክት ይችላል።
lexical_decisions:
- source_word: εὐθὺς
  choice: ወዲያውኑ
  rationale: የማርቆስን ፈጣን የትረካ እንቅስቃሴ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἐπιγνοὺς ἐν ἑαυτῷ
  choice: በራሱ አውቆ
  rationale: ኢየሱስ ነገሩን በውስጡ በግልጽ መገንዘቡን ይጠብቃል፤ ‘ተሰምቶት’ ከሚለው ይልቅ የἐπιγινώσκωን የማወቅ ሐሳብ ይበልጥ ያንጸባርቃል።
- source_word: δύναμιν
  choice: ኃይል
  rationale: በፈውሱ ክስተት ውስጥ ከኢየሱስ የወጣውን ውጤታማ ኃይል በቀጥታ ይገልጣል፤ ‘የፈውስ ኃይል’ ብሎ ከምንጩ በላይ አይተረጉምም።
- source_word: ἐξελθοῦσαν
  choice: እንደወጣ
  rationale: ኢየሱስ ከማወቁ አንጻር ኃይሉ አስቀድሞ መውጣቱን ያሳያል።
- source_word: ἐπιστραφεὶς ἐν τῷ ὄχλῳ
  choice: በሕዝቡ መካከል ዘወር ብሎ
  rationale: በተሰበሰበው ሕዝብ ውስጥ የተደረገውን አካላዊ መዞር በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἥψατο
  choice: የነካው
  rationale: በትረካው አውድ ያለውን ቀጥተኛ የመንካት ትርጉም ይጠብቃል።
- source_word: τῶν ἱματίων
  choice: ልብሶቼን
  rationale: የግሪኩን ብዙ ቁጥር በግልጽ ይጠብቃል፤ በዘመናዊ አማርኛም ተፈጥሯዊ ነው።
theological_decisions:
- issue: ኢየሱስ ኃይል ከእርሱ መውጣቱን ማወቁ
  choice: ኃይል ከእርሱ እንደወጣ በራሱ አውቆ
  alternative: የፈውስ ኃይል ከእርሱ እንደወጣ ተሰምቶት
  rationale: ጽሑፉ የሚናገረውን እውነተኛ የኃይል መውጣትና የኢየሱስን ውስጣዊ እውቀት ሳያዳክም ይጠብቃል፤ የተአምሩን አሠራር ግን በግምት አያብራራም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ግልጽና ክብር ያለው አማርኛ ይጠቀማል። የግሪኩ ተሳቢ ግሶች በአማርኛ ተፈጥሯዊ የክስተት ቅደም ተከተል ቀርበዋል።
