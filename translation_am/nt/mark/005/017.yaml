lexical_decisions:
- source_word: καὶ
  choice: እነርሱም
  rationale: የግሪኩን ተያያዥ አገባብ በአማርኛው -ም በተፈጥሯዊ ሁኔታ ያስቀጥላል፤ ግልጽ የጊዜ ቅደም ተከተል አይጨምርም።
- source_word: ἤρξαντο
  choice: ጀመሩ
  rationale: ከመስተንተኛው ጋር ያለውን የድርጊት መጀመር ትርጉም በቀጥታና በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: παρακαλεῖν
  choice: ሊለምኑት
  rationale: በአውዱ ያለውን አጥብቆ የመጠየቅ ኃይል ያስተላልፋል፤ ከተራው ‘መጠየቅ’ የበለጠ ስሜታዊ ግፊት አለው።
- source_word: αὐτὸν
  choice: -ት
  rationale: ኢየሱስን የሚያመለክተው ተሳቢ ተውላጠ ስም በአማርኛ ከግሱ ጋር በቅጥያ ተዋሕዷል።
- source_word: ἀπελθεῖν
  choice: እንዲወጣ
  rationale: የልመናቸውን ይዘት—ከአካባቢያቸው እንዲሄድ—በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: ከአገራቸው
  rationale: ὅρια በቃል ደረጃ ‘ድንበሮች’ ሊሆን ቢችልም፣ እዚህ የሚያመለክተው በድንበሩ የተከለለውን ክልል ነው፤ ‘አገራቸው’ ይህን በዘመናዊና ተፈጥሯዊ አማርኛ ያስተላልፋል።
