id: MRK.5.13
reference: Mark 5:13
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἐπέτρεψεν ⸀αὐτοῖς. καὶ ἐξελθόντα τὰ πνεύματα τὰ ἀκάθαρτα εἰσῆλθον εἰς τοὺς χοίρους, καὶ ὥρμησεν ἡ ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν θάλασσαν, ⸀ὡς δισχίλιοι, καὶ ἐπνίγοντο ἐν τῇ θαλάσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/013.yaml
  text: And he permitted them[a]. Then the unclean spirits came out and entered the pigs, and the herd—about two thousand—rushed down the steep bank into the sea[b], and they drowned in the sea.
translation:
  language: am
  text: እርሱም ፈቀደላቸው። ርኩሳን መናፍስትም ወጥተው ወደ አሳማዎቹ ገቡ፤ መንጋውም—ሁለት ሺህ ያህል—በገደላማው ቁልቁለት[a] ተምዘግዝጎ ወደ ባሕሩ[b] ገባ፤ በባሕሩም ውስጥ ሰጠመ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በገደሉ»። የግሪኩ ቃል ገደላማ ቁልቁለትን ወይም ገደልን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ይህ የገሊላን ባሕር ያመለክታል።
    reason: cultural_note
lexical_decisions:
- source_word: ἐπέτρεψεν αὐτοῖς
  choice: ፈቀደላቸው
  rationale: ἐπιτρέπω ፈቃድ መስጠትን ያመለክታል፤ «ፈቀደላቸው» አጭር፣ ተፈጥሯዊና የትረካውን ክብር የጠበቀ ነው።
- source_word: τὰ πνεύματα τὰ ἀκάθαρτα
  choice: ርኩሳን መናፍስት
  rationale: የግሪኩን የግል መንፈሳዊ ፍጡራን አገላለጽ እና የἀκάθαρτοςን የርኩሰት ትርጉም ይጠብቃል።
- source_word: ἐξελθόντα
  choice: ወጥተው
  rationale: መናፍስቱ ከሰውየው መውጣታቸውን የሚገልጽ ተፈጥሯዊ የአማርኛ ቅደም ተከተል ነው።
- source_word: εἰσῆλθον εἰς τοὺς χοίρους
  choice: ወደ እሪያዎቹ ገቡ
  rationale: የεἰσέρχομαι εἰςን አቅጣጫዊ ኃይል በግልጽና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: χοίρους
  choice: እሪያዎቹ
  rationale: χοῖροςን በዘመናዊ መደበኛ አማርኛ በቀጥታ የሚያመለክት ቃል ነው።
- source_word: ὥρμησεν ἡ ἀγέλη
  choice: መንጋውም … ተምዘግዝጎ ገባ
  rationale: ὁρμάω የሚያሳየውን ድንገተኛና ኃይለኛ እንቅስቃሴ ያስተላልፋል፤ ነጠላውም የመንጋውን ስብስባዊ ሰዋስው ይከተላል።
- source_word: κατὰ τοῦ κρημνοῦ
  choice: በገደላማው ቁልቁለት
  rationale: κρημνός ገደላማ ቁልቁለትን ወይም ገደልን ሊያመለክት ስለሚችል፣ ዋናው ጽሑፍ አደገኛውን ቁልቁለት ያሳያል ነገር ግን ፍጹም ቀጥ ያለ ገደል መሆኑን አይጭንም።
- source_word: εἰς τὴν θάλασσαν
  choice: ወደ ባሕሩ
  rationale: θάλασσα በቀጥታ «ባሕር» ነው፤ የውኃው አካል የገሊላ ባሕር መሆኑ በማስታወሻ ተገልጿል።
- source_word: ὡς δισχίλιοι
  choice: ሁለት ሺህ ያህል
  rationale: ὡς ከቁጥር ጋር ግምታዊነትን ይገልጻል፤ «ያህል» ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐπνίγοντο
  choice: ሰጠመ
  rationale: የብዙ አባላት ስብስብ የሆነውን «መንጋው» በነጠላ በመከተል፣ በውኃ ውስጥ ገብተው መሞታቸውን ተፈጥሯዊ በሆነ ኢ-ተሻጋሪ ግስ ያሳያል።
theological_decisions:
- issue: «ለእነርሱ» የሚለው ተውላጠ ስም ተመላሽ
  choice: «ፈቀደላቸው» የሚለው ለርኩሳን መናፍስት ይመለሳል
  alternative: ተመላሹን በዋናው ጽሑፍ በስም መድገም
  rationale: ቅርብ ዐውደ ንባቡ ተመላሹ እሪያዎቹ ውስጥ ለመግባት ፈቃድ የጠየቁትን መናፍስት እንደሚያመለክት ያሳያል፤ ተውላጠ ስሙን ማቆየት ከምንጩ ጋር ይቀራረባል።
- issue: የ«ርኩሳን መናፍስት» አገላለጽ
  choice: ግላዊ መንፈሳዊ ፍጡራንን የሚገልጸውን ቋንቋ ማቆየት
  alternative: «ክፉ ኃይሎች» ብሎ መተርጎም
  rationale: πνεύματα በትረካው ውስጥ ግላዊ መንፈሳዊ ፍጡራንን ያቀርባል፤ «መናፍስት» የጽሑፉን አቀራረብ ሳይጨምር ወይም ሳይቀንስ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ መደበኛና ክብር ያለው የአማርኛ የትረካ አጻጻፍ ተጠቅሟል። የምንጩ ተውላጠ ስም፣ የመናፍስቱ ግላዊ አቀራረብ፣ የቁጥሩ ግምታዊነትና «ባሕር» የሚለው ቃል ተጠብቀዋል።
