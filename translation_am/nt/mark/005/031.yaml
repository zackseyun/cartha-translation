  text: καὶ ἔλεγον αὐτῷ οἱ μαθηταὶ αὐτοῦ· Βλέπεις τὸν ὄχλον συνθλίβοντά σε, καὶ λέγεις· Τίς μου ἥψατο;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/031.yaml
  text: And his disciples were saying to him[a], “You see the crowd pressing in on you, and you say, ‘Who touched me?’”
translation:
  language: am
  text: ደቀ መዛሙርቱም እንዲህ እያሉት ነበር፤ “በዙሪያህ እየተጨናነቀ ያለውን ሕዝብ ታያለህ፤ አንተም፣ ‘ማን ነካኝ?’ ትላለህ?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: ይሉት ነበር
  rationale: ያልተፈጸመውን የግሪክ ግስ ገጽታ በመጠበቅ፣ በዚያ ጊዜ እየተናገሩት ወይም ደጋግመው እያሉት እንደነበር ያሳያል።
- source_word: μαθηταὶ
  choice: ደቀ መዛሙርቱ
  rationale: ለኢየሱስ ተማሪዎችና ተከታዮች በአማርኛ የተለመደና በአውዱ የሚስማማ አገላለጽ ነው።
- source_word: Βλέπεις
  choice: እያየህ
  rationale: ደቀ መዛሙርቱ በዓይኑ የሚታየውን ሁኔታ እንደማስረጃ ማቅረባቸውን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὄχλον
  choice: ሕዝቡ
  rationale: በአንድ ስፍራ የተሰበሰበውን ብዙ ሰው በተፈጥሯዊና ክብር ባለው ዘመናዊ አማርኛ ይገልጣል።
- source_word: συνθλίβοντά
  choice: በዙሪያህ እየተጨናነቀብህ
  rationale: ሕዝቡ ኢየሱስን ከዙሪያው በአካል እየተጫነው መሆኑን ያሳያል፤ ‘እየጨፈለቀህ’ ከማለት ያነሰ የተጋነነ ነው።
- source_word: λέγεις
  choice: ትላለህ
  rationale: የአሁን ጊዜውን ቀጥተኛ ንግግርና የደቀ መዛሙርቱን መደነቅ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: Τίς μου ἥψατο
  choice: ማን ነካኝ?
  rationale: ἅπτομαι በዚህ አውድ ‘መንካት’ ማለት ሲሆን፣ ጥያቄውም አሁን ስለተፈጸመ አንድ የተወሰነ ድርጊት ነው።
- source_word: μου
  choice: ነካኝ
  rationale: የግሪኩ የዝምድና ቅጽ በአማርኛ በግሱ ውስጥ እንደ ቀጥተኛ ተሳቢ ‘-ኝ’ በተፈጥሯዊ ሁኔታ ተገልጿል።
