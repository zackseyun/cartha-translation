lexical_decisions:
- source_word: παρεκάλει
  choice: ለመነው
  rationale: በአጋንንት ማስወጣት ዐውድ ውስጥ ቃሉ ተራ ጥያቄን ሳይሆን አጥብቆ መማጸንን ያመለክታል፤ «ለመነው» በዘመናዊ አማርኛ ይህን በተፈጥሮ ያስተላልፋል።
- source_word: πολλὰ
  choice: ደጋግሞ
  rationale: ከግሱ ጋር በተውሳከ ግስ አጠቃቀም የተደጋጋሚ ልመናን ያሳያል፤ «ደጋግሞ» ከቃል በቃል «ብዙ» ይልቅ ግልጽና ተፈጥሯዊ ነው።
- source_word: ἵνα μὴ
  choice: እንዳያስወጣቸው
  rationale: የልመናውን ይዘት በአማርኛ ተፈጥሯዊ በሆነ አሉታዊ ተያዥ አገባብ ያቀርባል።
- source_word: αὐτὰ
