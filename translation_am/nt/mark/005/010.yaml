- source_word: ἀποστείλῃ
  choice: ያስወጣ
  rationale: በዚህ ዐውድ «መላክ/ማስወጣት» ማለት ነው፤ «ያስወጣ» ከስፍራው እንዲሄዱ መላኩን በተፈጥሮ ያሳያል፣ ነገር ግን በግሱ ውስጥ የሌለ ተጨማሪ ኃይል አያስገባም።
- source_word: ἔξω τῆς χώρας
  choice: ከአገሩ
  rationale: χώρα እዚህ የአካባቢውን ክልል ወይም ግዛት ያመለክታል እንጂ ዘመናዊ ብሔራዊ አገርን አይደለም፤ «ከአገሩ» በአማርኛ ይህን በአጭሩና በተፈጥሮ ይገልጣል።
theological_decisions:
- issue: በአጋንንቱ ንግግር ዐውድ የነጠላ ግስ ባለቤትና የብዙ ቁጥር ተውላጠ ስም ማመሳከሪያ
  choice: የ«ሌጌዎን» ተናጋሪውን በነጠላ የግስ ቅርጽ «ለመነው»፣ የሚላኩትን ግን በብዙ ቁጥር «-አቸው» መተርጎም
  alternative: የቁጥር ለውጡን ለማለስለስ ሁሉንም በነጠላ ወይም በብዙ ቁጥር መተርጎም
  rationale: የግሪኩ ጽሑፍ አንድ ተናጋሪ ስለብዙዎቹ አጋንንት የሚለምንበትን የቁጥር ውጥረት ይጠብቃል፤ ትርጉሙም ይህን ሳያስማማ ያቆየዋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። «ከአገሩ» የአካባቢ ክልልን የሚያመለክት ሲሆን፣ የግሪኩ ነጠላ/ብዙ ቁጥር ለውጥ በግሱና በዓላማ ቅጥያው ተጠብቋል።
