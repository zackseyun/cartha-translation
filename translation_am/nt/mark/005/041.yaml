source:
  edition: SBLGNT
  text: καὶ κρατήσας τῆς χειρὸς τοῦ παιδίου λέγει αὐτῇ· Ταλιθα ⸀κουμ, ὅ ἐστιν μεθερμηνευόμενον· Τὸ κοράσιον, σοὶ λέγω, ⸀ἔγειρε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/041.yaml
  text: And taking the child's hand[a], he says to her, “Talitha koum,” which is translated, “Little girl, I say to you, get up.”
translation:
  language: am
  text: የልጅቷንም እጅ ይዞ፣ “ጣሊታ ቁም” አላት፤ ትርጉሙም፣ “ትንሽ ሴት ልጅ ሆይ፣ እልሻለሁ፣ ተነሺ” ማለት ነው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ጣሊታ ቁም” የሚለው ኢየሱስ የተናገረውን የአራማይክ ንግግር በድምፅ ቅርበት የተጻፈ ነው፤ የግሪኩ ጽሑፍ κουμ (“ቁም”) ብሎ ያነባል።
    reason: የአራማይክ ሐረጉን የድምፅ ጽሕፈትና በግሪክ ጽሑፉ ያለውን κουμ ንባብ ለማብራራት።
lexical_decisions:
- source_word: κρατήσας τῆς χειρὸς τοῦ παιδίου
  choice: የልጅቱንም እጅ ይዞ
  rationale: κρατέω ከዚህ የእጅን አካላዊ መያዝ ያመለክታል፤ ይህ አተረጓጎም ድርጊቱን በተፈጥሯዊ አማርኛ ያቀርባል። παιδίον በአውዱ ሴት ልጅን ስለሚያመለክት “ልጅቱን” ተብሏል።
- source_word: λέγει αὐτῇ
  choice: አላት
  rationale: የማርቆስን ታሪካዊ የአሁን ጊዜ ግስ በአማርኛ ተፈጥሯዊ የትረካ አካሄድ በኃላፊ ጊዜ ማቅረብ ግልጽነትን ይጠብቃል።
- source_word: Ταλιθα κουμ
  choice: ጣሊታ ቁም
  rationale: ግሪክ ጽሑፉ ያቆየውን የአራማይክ ንግግር በግዕዝ ፊደል በድምፅ ቀረቤታ ተጽፎ ተጠብቋል፤ κουμ የሚለውን ንባብ “ቁም” ያንጸባርቃል።
- source_word: μεθερμηνευόμενον
  choice: ትርጉሙም … ማለት ነው
  rationale: የአራማይክ ንግግሩን ማርቆስ ራሱ እንደሚተረጉመው በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Τὸ κοράσιον
  choice: ትንሽ ልጅ ሆይ
  rationale: κοράσιον ወጣት ሴት ልጅን የሚያመለክት አነስተኛ ቅርጽ ነው፤ ዐውዱ ፆታዋን ግልጽ ስለሚያደርግ “ትንሽ ልጅ ሆይ” የሚለው የርኅራኄ አነጋገርን ይጠብቃል።
- source_word: σοὶ λέγω
  choice: እልሻለሁ
  rationale: ለሴት ልጅ በቀጥታ የተነገረውን “ለአንቺ እላለሁ” የሚል አጽንዖት ሳይጠፋ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἔγειρε
  choice: ተነሺ
  rationale: ትእዛዙ ለሴት ልጅ የተነገረ ሲሆን ከመተኛት ወይም ከመውደቅ እንድትነሳ የሚያዝ ተፈጥሯዊ ዘመናዊ አማርኛ ነው።
theological_decisions:
- issue: የኢየሱስን የአራማይክ ቃላት በዋናው ጽሑፍ ማቆየት
  choice: “ጣሊታ ቁም” የሚለውን በድምፅ ቀረቤታ ማቆየትና የማርቆስን ትርጉም ተከትሎ ማቅረብ
  alternative: የአራማይክ ቃላቱን ትቶ “ትንሽ ልጅ ሆይ፣ እልሻለሁ፣ ተነሺ” ብቻ ማቅረብ
  rationale: ምንጩ ሴማዊውን ንግግር አቆይቶ ወዲያውኑ ራሱ ይተረጉመዋል፤ ሁለቱንም ማቆየት የትረካውን ልዩ ቅርጽና ሙሉ ትርጉም ይጠብቃል።
- issue: ἔγειρε በአውዱ ያለው የትርጉም ስፋት
  choice: “ተነሺ”
  alternative: “ንቂ”
  rationale: ግሱ መንቃትንም መነሳትንም ሊያመለክት ቢችልም፣ በተከታዩ ድርጊት ልጅቱ ተነስታ መራመዷ ስለሚነገር “ተነሺ” የአውዱን አካላዊ ድርጊት በግልጽ ያቀርባል፤ የትንሣኤ አገባቡንም በግድ አያጠብብም።
