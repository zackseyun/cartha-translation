    issue: Footnote b is structurally and substantively mismatched.
    rationale: It is labeled as a lexical alternative but says “በጥሬው” and discusses “ትልቅ,” while the main text reads “ብዙ.” A revised note supplies a real alternative for the Amharic herd expression.
