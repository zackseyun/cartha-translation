lexical_decisions:
- source_word: ἦν δὲ
  choice: ነበር፤ δέ በ«-ም» ተገልጿል
  rationale: ἦν ያለፈ ጊዜንና መኖርን ያመለክታል፤ δέ የሚያሳየው ቀላል የትረካ ትስስር በአማርኛው «-ም» በተፈጥሮ ይተላለፋል።
- source_word: ἐκεῖ
  choice: በዚያ
  rationale: ቦታን የሚያመለክተውን ተውሳከ ግስ ቀጥተኛና ተፈጥሯዊ በሆነ መንገድ ይተረጉማል።
- source_word: πρὸς τῷ ὄρει
  choice: በተራራው አጠገብ
  rationale: πρός ከዳቲቭ ጋር እዚህ የአቅራቢያ ወይም የጎን ቦታን ያመለክታል፤ «አጠገብ» ይህን ሳያጠብ ያስተላልፋል።
- source_word: ἀγέλη
  choice: መንጋ
  rationale: ለእንስሳት ስብስብ የሚውል ተፈጥሯዊ የአማርኛ ቃል ነው።
- source_word: χοίρων
  choice: የአሳማዎች
  rationale: χοῖροςን በዘመናዊና ለሁሉም ግልጽ በሆነ ቃል ይተረጉማል።
- source_word: μεγάλη
  choice: ብዙ
  rationale: በመንጋ አውድ μεγάλη የመንጋውን ብዛት ወይም ትልቅነት ያመለክታል፤ በአማርኛ «ብዙ መንጋ» የእንስሳቱን ብዛት በተፈጥሮ ይገልጣል።
- source_word: βοσκομένη
  choice: እየተሰማራ
  rationale: የመንጋውን ቀጣይ የመመገብ ተግባር ይገልጣል፤ «መሰማራት» እንስሳት በመስክ ላይ ሲመገቡ የሚጠቀም ተፈጥሯዊ አገላለጽ ነው።
