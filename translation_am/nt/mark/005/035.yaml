base_translation:
  language: en
  yaml_path: translation/nt/mark/005/035.yaml
  text: While he was still speaking[a], people came from the synagogue leader's house, saying, “Your daughter has died[b]. Why do you still trouble the Teacher?”
translation:
  language: am
  text: እርሱ ገና እየተናገረ ሳለ፣ ከምኩራብ አለቃው ቤት[a] የመጡ ሰዎች፣ “ሴት ልጅህ ሞታለች፤ መምህሩን ከእንግዲህ ለምን ታስቸግራለህ?[b]” አሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “ከምኩራብ አለቃው።”
    reason: የግሪኩን አጭር አገላለጽ ለማሳየት፤ ‘ቤት’ የሚለው ከዐውዱ የተገኘ ማብራሪያ ነው።
  - marker: b
    text: ወይም፣ “ለምን ትረብሸዋለህ?”
    reason: σκύλλεις በዚህ ዐውድ ‘ማስቸገር’ ወይም ‘መረበሽ’ ሊባል ይችላል።
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: እርሱ ገና እየተናገረ ሳለ
  rationale: የግሪኩን በአንድ ጊዜ መከናወንና የἔτιን ‘ገና’ የሚል ጊዜያዊ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἔρχονται
  choice: መጥተው
  rationale: በትረካው ያለውን ታሪካዊ የአሁን ጊዜ በተፈጥሯዊ የአማርኛ ያለፈ ጊዜ ቅደም ተከተል ይገልጣል።
- source_word: ἀπὸ τοῦ ἀρχισυναγώγου
  choice: ከምኩራብ አለቃው ቤት
  rationale: ቃል በቃል ‘ከምኩራብ አለቃው’ ቢሆንም፣ አለቃው በዚያ ጊዜ ከኢየሱስ ጋር ስለነበር የዐውዱን ግልጽ ትርጉም ለማሳየት ‘ቤት’ ተጨምሯል፤ ቃል በቃል አነባበቡ በግርጌ ማስታወሻ ተጠብቋል።
- source_word: λέγοντες ὅτι
  choice: አሉት
  rationale: ተሳቢውንና ቀጥተኛ ንግግሩን በተፈጥሯዊ የአማርኛ የትረካ አወቃቀር ያቀርባል።
- source_word: Ἡ θυγάτηρ σου
  choice: ልጅህ
  rationale: በዐውዱ ሴት ልጅ መሆኗ ግልጽ ሲሆን ‘ልጅህ’ ቀጥተኛና ተፈጥሯዊ ነው፤ የግሱ ሴት ፆታ ቅጥ ‘ሞታለች’ ይህን ያስረዳል።
- source_word: ἀπέθανεν
  choice: ሞታለች
  rationale: የተፈጸመውን ሞትና አሁናዊ ውጤቱን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τί ἔτι
  choice: ከእንግዲህ ለምን
  rationale: ድርጊቱን ከአሁን በኋላ መቀጠል አላስፈላጊ መሆኑን የሚጠይቀውን የግሪኩን ፈሊጣዊ ኃይል ያሳያል።
- source_word: σκύλλεις
  choice: ታስቸግራለህ
  rationale: በዚህ ዐውድ አንድን ሰው በጥያቄ ማስቸገር ወይም መረበሽ ማለት ነው፤ የተመረጠው ቃል ክብር ያለውና ዘመናዊ ነው።
- source_word: τὸν διδάσκαλον
  choice: መምህሩን
  rationale: διδάσκαλος የሚለውን ማዕረግ ስም ሳይተካና ተጨማሪ የሥልጣን ፍቺ ሳያስገባ ይጠብቃል።
theological_decisions:
- issue: ‘መምህሩ’ የሚለው ማዕረግ ኢየሱስን የሚጠቅስበት መንገድ
  choice: መምህሩን
  alternative: ጌታውን፤ ኢየሱስን
  rationale: ግሪኩ ስሙን ሳይሆን ‘መምህሩ’ የሚለውን ማዕረግ ይጠቀማል። ይህን ማቆየት የተናጋሪዎቹን አመለካከት ይጠብቃል፤ በጽሑፉ ያልተገለጸ ተጨማሪ ክርስቶሎጂያዊ አንድምታም አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ የትረካ አማርኛ ተጠቅሟል። ‘ምኩራብ’ እና ‘መምህር’ የተለመዱ መጽሐፍ ቅዱሳዊ ቃላት ሆነው ሳለ የዛሬ አንባቢም በቀላሉ የሚረዳቸው ናቸው።
