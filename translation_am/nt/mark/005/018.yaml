  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ⸀ἐμβαίνοντος αὐτοῦ εἰς τὸ πλοῖον παρεκάλει αὐτὸν ὁ δαιμονισθεὶς ἵνα ⸂μετ’ αὐτοῦ ᾖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/018.yaml
  text: And as he was getting into the boat[a], the man who had been demon-possessed kept begging him that he might be with him.
translation:
  language: am
  text: እርሱም ወደ ጀልባው እየገባ ሳለ፣ አጋንንት ይዘውት የነበረው ሰው ከእርሱ ጋር እንዲሆን ደጋግሞ ለመነው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβαίνοντος αὐτοῦ
  choice: እርሱም ... እየገባ ሳለ
  rationale: የአሁን ጊዜ ቦዝ አንቀጹ ከዋናው ግስ ጋር በአንድ ጊዜ በሂደት ላይ ያለ ድርጊትን ያሳያል፤ «እየገባ ሳለ» ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: πλοῖον
  choice: ጀልባ
  rationale: በገሊላ ባሕር ዐውድ ውስጥ ለተጠቀሰው መርከብ «ጀልባ» ለዘመናዊ አንባቢ ተፈጥሯዊና የመጠኑን ስሜት በተገቢው የሚያስተላልፍ ቃል ነው።
- source_word: παρεκάλει
  choice: ደጋግሞ ለመነው
  rationale: ያልተጠናቀቀው የግስ ቅርጽ የቀጠለ ወይም የተደጋገመ ልመናን ያመለክታል፤ «ደጋግሞ ለመነው» ይህን ጽናትና ስሜታዊ አጣዳፊነት ያሳያል።
- source_word: ὁ δαιμονισθείς
  choice: አጋንንት ይዘውት የነበረው ሰው
  rationale: ስማዊ ሆኖ የተጠቀሰው ቦዝ አንቀጽ አስቀድሞ ከአጋንንት ነፃ የወጣውን ሰው ያመለክታል። «የነበረው» የቀድሞ ሁኔታው አሁን እንደተለወጠ በግልጽ ያሳያል።
- source_word: ἵνα μετ’ αὐτοῦ ᾖ
  choice: ከእርሱ ጋር እንዲሆን
  rationale: ἵνα ከንዑስ አንቀጹ ጋር የልመናውን ይዘት ያቀርባል፤ ትርጉሙም አብሮነትን ሳይቀንስ የምኞት ቅርጹን ይጠብቃል።
theological_decisions:
- issue: δαιμονισθείς የሚያመለክተውን የአጋንንት ቁጥጥር በሕክምናዊ ወይም በዘይቤያዊ ምድብ ሳይተካ መተርጎም
  choice: አጋንንት ይዘውት የነበረው
  alternative: በአጋንንት ኃይል ሥር የነበረው
  rationale: የተመረጠው አገላለጽ በወንጌሉ ትረካ ውስጥ ያለውን እውነተኛ የአጋንንት ተጽእኖና ቁጥጥር በተለመደ፣ ግልጽ አማርኛ ያስተላልፋል፤ ሁኔታውን ወደ ተራ ሕመም አይቀንስም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ አማርኛን ይጠቀማል። በቀረበው የእንግሊዝኛ ንባብ ያለው [a] ምልክት ከእግር ማስታወሻው ይዘት ጋር የማይጣጣም ስለሆነና በግሪክ ምንጭ ላይ በዚያ ቦታ የቃላት አማራጭ ስለሌለ በአማርኛው ረቂቅ አልተካተተም።
