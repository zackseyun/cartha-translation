  text: ⸀καὶ ἔρχεται εἷς τῶν ἀρχισυναγώγων, ὀνόματι Ἰάϊρος, καὶ ἰδὼν αὐτὸν πίπτει πρὸς τοὺς πόδας αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/022.yaml
  text: And one of the synagogue rulers[a], named Jairus, came, and when he saw him[b], he fell at his feet.
translation:
  language: am
  text: ከምኩራብ አለቆች አንዱ የሆነው ያኢሮስ መጣ፤[a] ኢየሱስንም ባየው ጊዜ በእግሮቹ ሥር ወደቀ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪክኛው፣ “ይመጣል … ይወድቃል”፤ ማርቆስ ትረካውን ሕያው ለማድረግ ያለፈውን ክስተት በአሁን ጊዜ ይገልጻል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: መጣ
  rationale: ግሪክኛው ለትረካዊ ሕያውነት የአሁን ጊዜን ቢጠቀምም፣ በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜው ይሻላል።
- source_word: εἷς τῶν ἀρχισυναγώγων
  choice: ከምኩራብ አለቆች አንዱ
  rationale: የክፍል ከጠቅላላ ግንኙነቱን ‘አንዱ’ በማለት ይጠብቃል፤ ἀρχισυνάγωγος የምኩራብን አስተዳደራዊ መሪ ያመለክታል።
- source_word: ὀνόματι Ἰάϊρος
  choice: ያኢሮስ የሚባል ሰው
  rationale: የስም መግለጫውን በዘመናዊና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: Ἰάϊρος
  choice: ያኢሮስ
  rationale: የግሪክኛውን የግል ስም በተለመደው የአማርኛ አጻጻፍ ይተረጉማል።
- source_word: ἰδὼν αὐτὸν
  choice: ኢየሱስንም ባየው ጊዜ
  rationale: የአኦሪስት አሳታፊውን ጊዜያዊ ግንኙነት በግልጽ አማርኛ ያሳያል፤ በአውዱ የተመለከተው ኢየሱስን መሆኑን በስሙ መግለጽ የአማርኛን ግልጽነት ያገለግላል።
- source_word: πίπτει πρὸς τοὺς πόδας αὐτοῦ
  choice: በእግሩ ሥር ወደቀ
  rationale: ድርጊቱን በተፈጥሯዊ አማርኛ ያሳያል፤ ግሪክኛው በዚህ ስፍራ ስግደትን የሚገልጽ ልዩ ቃል ስላልተጠቀመ፣ ትርጉሙ ከጽሑፉ በላይ አይጨምርም።
theological_decisions:
- issue: በኢየሱስ ፊት የተደረገው ድርጊት ትርጉም
  choice: በእግሩ ሥር ወደቀ
  alternative: ሰገደለት
  rationale: ግሪክኛው የመውደቅን አካላዊ ድርጊት ይገልጻል፤ ድርጊቱ ክብርን፣ ልመናን ወይም ከፍተኛ ጭንቀትን ሊያሳይ ቢችልም፣ ጽሑፉ በግልጽ ‘አመለከው’ አይልም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ምኩራብ’ የተለመደው መጽሐፍ ቅዱሳዊ ቃል ሲሆን ‘አለቆች’ የአስተዳደር ሚናውን በቀላሉ ያስተላልፋል።
