  naturalness: 'The proposed revision is smoother modern standard Amharic: it keeps Jairus and his office together as one subject and avoids the somewhat heavy parenthetic phrase “ያኢሮስ የሚባል ሰው.”'
  terminology: “ምኩራብ” and “አለቆች” are suitable established, comprehensible terms. “በእግሮቹ ሥር ወደቀ” preserves the physical posture without interpreting it as worship.
