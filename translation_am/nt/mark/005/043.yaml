base_translation:
  language: en
  yaml_path: translation/nt/mark/005/043.yaml
  text: And he strictly ordered them that no one should know this[c][b][a], and he said that she should be given something to eat.
translation:
  language: am
  text: እርሱም ማንም ይህን እንዳያውቅ አጥብቆ አዘዛቸው፤[a] ለእርሷም የምትበላው ነገር እንዲሰጣት አለ።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በሌላ አባባል፣ “ደጋግሞ ጥብቅ ትእዛዝ ሰጣቸው” ወይም “በጥብቅ አስጠነቀቃቸው።” የግሪኩ አገላለጽ ቃል በቃል “ብዙ” የሚል አጠናካሪ ቃል አለው።
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “ለእርሷ እንድትበላ እንዲሰጥ።” በተፈጥሮ አማርኛ፣ “የምትበላው ነገር እንዲሰጣት።”
    reason: lexical_alternative
lexical_decisions:
- source_word: διεστείλατο αὐτοῖς πολλὰ
  choice: አጥብቆ አዘዛቸው
  rationale: διαστέλλομαι ጠንካራ ትእዛዝን ወይም ማስጠንቀቂያን ያመለክታል፤ πολλὰ ደግሞ በዚህ አገባብ የትእዛዙን ጥብቅነት ያጠናክራል። ‘አጥብቆ አዘዛቸው’ ይህን ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἵνα μηδεὶς γνοῖ τοῦτο
  choice: ይህን ማንም እንዳያውቅ
  rationale: ἵνα ከንዑስ አንቀጹ ጋር የትእዛዙን ዓላማ ወይም የታሰበውን ውጤት ያሳያል፤ γνοῖ በዚህ ስፍራ ማወቅን ወይም መረዳትን ያመለክታል።
- source_word: εἶπεν δοθῆναι αὐτῇ φαγεῖν
  choice: ለእርሷም የምትበላው ነገር እንዲሰጣት ተናገረ
  rationale: δοθῆναι የተደራጊ ድምፅ ያለውን አወቃቀር በ‘እንዲሰጣት’ ያቆያል። φαγεῖν ቃል በቃል ‘ልትበላ’ ሲሆን፣ በአማርኛ የተፈጥሮ አነጋገር የተገመተውን ተሳቢ ‘ነገር’ መጨመር ያስፈልጋል። εἶπεν በቀጥታ ‘ተናገረ’ ተብሎ ተተርጉሟል።
theological_decisions:
- issue: የኢየሱስ ትእዛዝና ክስተቱ እንዳይታወቅ የመፈለጉ ምክንያት
  choice: ክስተቱን ማንም እንዳያውቅ ጥብቅ ትእዛዝ እንደሰጠ ብቻ ማቅረብ
  alternative: ትእዛዙን የማርቆስ ‘መሲሐዊ ምስጢር’ ጭብጥ አካል ብሎ በትርጉሙ ውስጥ ማብራራት፣ ወይም ወሰኑን ለቅርብ ቤተሰብና ምስክሮች ብቻ አድርጎ መግለጽ
  rationale: ጥቅሱ የትእዛዙን ምክንያት አያብራራም፤ ስለዚህ ያለው ሥነ መለኮታዊ ውጥረትና አሻሚነት ሳይፈታ ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። ‘እርሱም’ የግሪኩን የተገመተ ወንድ ነጠላ ባለቤት ያሳያል፤ በአውዱ ይህ ኢየሱስን ያመለክታል።
