  text: ὁ δὲ εἶπεν αὐτῇ· ⸀Θυγάτηρ, ἡ πίστις σου σέσωκέν σε· ὕπαγε εἰς εἰρήνην, καὶ ἴσθι ὑγιὴς ἀπὸ τῆς μάστιγός σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/034.yaml
  text: But he said to her[a], “Daughter, your faith has saved you. Go in peace[b], and be well from your affliction.”
translation:
  language: am
  text: እርሱ ግን፣ “ልጅ ሆይ፣ እምነትሽ አድኖሻል[a]። በሰላም ሂጂ፤ ከስቃይሽ ጤናማ ሁኚ[b]” አላት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “አድኖሻል” የሚለው የግሪክ ግስ “ፈውሶሻል” ወይም “ጤነኛ አድርጎሻል” ተብሎም ሊተረጎም ይችላል፤ ቃሉ ማዳንን፣ ከአደጋ ማስጣልን ወይም መፈወስን ሊያመለክት ይችላል።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ “ደኅና ሁኚ” ወይም “ሙሉ በሙሉ ደኅና ሁኚ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Θυγάτηρ
  choice: ልጄ ሆይ
  rationale: በአማርኛ ተፈጥሯዊና ርኅራኄ ያለው የቀጥታ አድራሻ ነው፤ የግሪኩን ቤተሰባዊ ቅርበት ይጠብቃል።
- source_word: πίστις
  choice: እምነት
  rationale: በዚህ አውድ ሴቲቱ በኢየሱስ ላይ ያደረገችውን መታመን ያመለክታል፤ ዋናውን የእምነት ቃልም ወጥነት ባለው ሁኔታ ያቆያል።
- source_word: σέσωκέν
  choice: አድኖሻል
  rationale: የአማርኛው መዳን እንደ ግሪኩ σῴζω መዳንን፣ መትረፍንና ከሕመም መፈወስን ሊያመለክት ስለሚችል የምንጩን ሰፊ ትርጉምና ፍጹም ጊዜ ይጠብቃል።
- source_word: ὕπαγε εἰς εἰρήνην
  choice: በሰላም ሂጂ
  rationale: በአማርኛ የተለመደና ተፈጥሯዊ የመሸኛ አገላለጽ ሲሆን በሰላምና በደኅንነት መሄድን ያስተላልፋል።
- source_word: ἴσθι ὑγιὴς
  choice: ጤናማ ሁኚ
  rationale: የግሪኩን ሁኔታ ገላጭ ትእዛዝ ‘ጤናማ ሁኚ’ በቀጥታና ተፈጥሯዊ ሁኔታ ይወክላል፤ ከቀደመው ‘አድኖሻል’ ጋርም አያዋሕደውም።
- source_word: μάστιγός
  choice: የሚያሰቃይሽ ሕመም
  rationale: ቃሉ በቀጥታ ‘ግርፋት’ ሊል ቢችልም እዚህ ሴቲቱን ያሰቃየውን ከባድ ሕመም በምሳሌያዊ ሁኔታ ያመለክታል፤ ይህ አገላለጽ ለዘመናዊ አንባቢ ግልጽ ሲሆን የሥቃዩን ክብደት ይጠብቃል።
theological_decisions:
- issue: የσῴζω ትርጉም ከፈውስ ጋር ያለው ግንኙነት
  choice: አድኖሻል
  alternative: ፈውሶሻል / ጤነኛ አድርጎሻል
  rationale: ‘አድኖሻል’ የአካላዊ ፈውስን ብቻ ሳይወስን የመዳንን ሰፊ ትርጉም ይጠብቃል፤ ቀጣዩ ሐረግ የሰውነት ጤንነቷን ለይቶ ስለሚገልጽ በሁለቱ አገላለጾች መካከል ያለውን መለኮታዊ ውጥረት አያጠፋም።
- issue: የπίστις አውዳዊ ትርጉም
  choice: እምነት
  alternative: መታመን / ታማኝነት
  rationale: በዚህ ታሪክ ውስጥ ቃሉ የሴቲቱን ታማኝነት ሳይሆን ወደ ኢየሱስ በመቅረብ የገለጠችውን እምነት ያመለክታል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “ልጄ ሆይ” የንግግሩን ርኅራኄ ይጠብቃል፤ “የሚያሰቃይሽ ሕመም” ደግሞ የμάστιξን ምሳሌያዊ ኃይል ግልጽ በሆነ ዘመናዊ አገላለጽ ያቀርባል።
