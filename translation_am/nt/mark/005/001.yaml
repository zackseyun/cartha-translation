    reason: textual_variant
lexical_decisions:
- source_word: Καὶ
  choice: -ም
  rationale: የማርቆስን ተከታታይ ትረካ በተፈጥሯዊ የአማርኛ አያያዥ ይጠብቃል።
- source_word: ἦλθον
  choice: እነርሱ ... መጡ
  rationale: የግሪኩን ብዙ ቁጥር በግልጽ ሁኔታ ይወክላል፤ ከአውዱ ኢየሱስንና ከእርሱ ጋር ያሉትን ያመለክታል።
- source_word: εἰς τὸ πέραν τῆς θαλάσσης
  choice: ከባሕሩ ማዶ
  rationale: ወደ ተቃራኒው ዳርቻ መሻገራቸውን በተፈጥሯዊ አማርኛ ይገልጻል፤ θάλασσαንም ‘ባሕር’ ብሎ ይጠብቃል።
- source_word: εἰς τὴν χώραν
  choice: ወደ ... አገር
  rationale: χώρα እዚህ የአንድን ሕዝብ አካባቢ ወይም ግዛት ያመለክታል፤ ‘አገር’ በዚህ አውድ ተፈጥሯዊ ነው።
- source_word: Γερασηνῶν
  choice: ጌራሴኖች
  rationale: የSBLGNTን ንባብ በድምፅ ቀረቤታ ያስተላልፋል፤ ቃሉ ከጌራሳ ጋር የተያያዙትን ሰዎች የሚጠራ የዘር/የአካባቢ ስያሜ ነው።
theological_decisions:
- issue: በአጋንንት የተያዘው ሰው ትረካ ውስጥ ያለው የቦታ ስም የጽሑፍ ልዩነት
  choice: ጌራሴኖች
  alternative: ጋዳሬኖች፤ ጌርጌሴኖች
  rationale: ዋናው ጽሑፍ የSBLGNTን Γερασηνῶν ንባብ ይከተላል፤ ሌሎቹ ጥንታዊ ንባቦች ሳይደበቁ በማስታወሻ ተጠብቀዋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የማርቆስ ቀላል ተከታታይ የትረካ አወቃቀር በ«-ም» ተጠብቋል።
