review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the plural aorist («መጡ»), the sea («ባሕር»), the regional sense of χώρα («አገር»), and the SBLGNT reading Γερασηνῶν. However, «ከባሕሩ ማዶ» uses the ablative preposition «ከ» (“from”), whereas εἰς τὸ πέραν is directional (“to the other side”).
  naturalness: The sentence is otherwise clear and appropriately modern in register. Changing «ከባሕሩ ማዶ» to «ወደ ባሕሩ ማዶ» supplies the required directional sense and is natural Amharic.
  terminology: «ጌራሴኖች» is a suitable Amharic transliteration of the gentilic Γερασηνῶν. The textual-variant footnote correctly gives the principal alternative readings, «ጋዳሬኖች» and «ጌርጌሴኖች».
  issues:
  - severity: medium
    issue: Directional sense of εἰς τὸ πέραν is weakened or reversed.
    rationale: «ከባሕሩ ማዶ» normally means “from beyond/across the sea.” The Greek states that they came “to the other side of the sea”; «ወደ ባሕሩ ማዶ» preserves this direction.
  revised_text: እነርሱም ወደ ባሕሩ ማዶ፣ ወደ ጌራሴኖች[a] አገር መጡ።
