  text: διὰ τὸ αὐτὸν πολλάκις πέδαις καὶ ἁλύσεσι δεδέσθαι καὶ διεσπάσθαι ὑπ’ αὐτοῦ τὰς ἁλύσεις καὶ τὰς πέδας συντετρῖφθαι, καὶ οὐδεὶς ⸂ἴσχυεν αὐτὸν⸃ δαμάσαι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/004.yaml
  text: because he had often been bound with shackles and chains[a], and the chains had been torn apart by him and the shackles smashed to pieces, and no one was strong enough to subdue him.
translation:
  language: am
  text: ምክንያቱም ብዙ ጊዜ በእግር ብረትና በሰንሰለት ታስሮ ነበር፤ እርሱም ሰንሰለቶቹን በጣጥሶ፣ የእግር ብረቶቹንም ሰባብሮ ነበር፤ ማንም እርሱን ለማስገዛት[a] በቂ ኃይል አልነበረውም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለመግራት።” የግሪክኛው ግስ “መግራት” ወይም በሰፊው “ማስገዛት፣ ከቁጥጥር ሥር ማዋል” ማለት ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ αὐτὸν
  choice: ምክንያቱም … ነበር
  rationale: διά ከአንቀጽ የሌለው የግስ ስም ጋር ሆኖ ለቀደመው ንግግር ምክንያትን ያስገባል፤ ይህ አተረጓጎም የምክንያት ግንኙነቱን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: πολλάκις
  choice: ብዙ ጊዜ
  rationale: የተደጋጋሚነትን ሐሳብ ግልጽና ተፈጥሯዊ በሆነ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: πέδαις / τὰς πέδας
  choice: በእግር ብረት / የእግር ብረቶቹን
  rationale: πέδη በተለይ እግርን ለማሰር የሚያገለግል ማሰሪያ ነው፤ “የእግር ብረት” ከአጠቃላዩ “ሰንሰለት” ይለየዋል።
- source_word: ἁλύσεσι / τὰς ἁλύσεις
  choice: በሰንሰለት / ሰንሰለቶቹን
  rationale: ἅλυσις ሰንሰለትን ያመለክታል፤ ከπέδαι ጋር ያለውን የሁለት ዓይነት ማሰሪያዎች ልዩነት ይጠብቃል።
- source_word: δεδέσθαι
  choice: ታስሮ ነበር
  rationale: የተፈጸመ ማሰርና ከዚያ የተገኘውን ሁኔታ በተፈጥሯዊ የአማርኛ የትረካ አወቃቀር ያቀርባል።
- source_word: διεσπάσθαι ὑπ’ αὐτοῦ
  choice: እርሱ … በጣጥሶ
  rationale: διασπάω በኃይል መበጣጠስን ያሳያል፤ የግሪክኛው ተደራጊ አወቃቀር በአማርኛ ተፈጥሯዊ እንዲሆን ፈጻሚው ግልጽ በሆነ አድራጊ አወቃቀር ተተርጉሟል።
- source_word: συντετρῖφθαι
  choice: ሰባብሮ
  rationale: συντρίβω ከቀላል መስበር የበለጠ ሙሉ በሙሉ ማድቀቅን ወይም መሰባበርን ያመለክታል፤ ድግግሞሻ ያለው የአማርኛ ቅርጽ ኃይሉን ይጠብቃል።
- source_word: οὐδεὶς ἴσχυεν
  choice: ማንም … የሚበቃ ኃይል አልነበረውም
  rationale: ἰσχύω ተራ ችሎታን ብቻ ሳይሆን ኃይልንና ብርታትን ያጎላል፤ ትርጉሙ ይህን ገጽታ ግልጽ ያደርጋል።
- source_word: δαμάσαι
  choice: ለመቆጣጠር
  rationale: በዚህ ዐውድ ዋናው ሐሳብ ግለሰቡን ከቁጥጥር ሥር ማዋል ነው። “መቆጣጠር” ይህን በተፈጥሯዊ አማርኛ ሲያቀርብ፣ “መግራት” የሚለው የቃሉ ሌላ ገጽታ በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: የሰውየው ሁኔታና ያልተለመደ ኃይል ምንጭ
  choice: ቁጥጥር ለማድረግ የተደረጉትን ተደጋጋሚ ሙከራዎችና የሰዎቹን አለመቻል ብቻ በገለልተኛ ሁኔታ መግለጽ
  alternative: በዚህ ቁጥር ራሱ የአጋንንታዊ ኃይልን ምንጭ ይበልጥ የሚያጎላ አተረጓጎም
  rationale: ግሪክኛው የተደጋገመ ማሰርን፣ የማሰሪያዎቹን መሰባበርና ማንም ሊቆጣጠረው አለመቻሉን ይገልጣል። የዙሪያው ትረካ ስለ አጋንንታዊ ጭቆና ቢናገርም፣ ትርጉሙ በዚህ ቁጥር ያልተገለጸ ተጨማሪ ማብራሪያ አያስገባም።
