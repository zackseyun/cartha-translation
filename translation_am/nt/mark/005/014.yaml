  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸂Καὶ οἱ⸃ βόσκοντες ⸀αὐτοὺς ἔφυγον καὶ ⸀ἀπήγγειλαν εἰς τὴν πόλιν καὶ εἰς τοὺς ἀγρούς· καὶ ⸀ἦλθον ἰδεῖν τί ἐστιν τὸ γεγονός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/014.yaml
  text: And those who were tending them fled and reported it in the city and in the countryside[a], and they came to see what had happened.
translation:
  language: am
  text: እነርሱንም የሚጠብቁት ሸሹ፤ በከተማውና በገጠሩ[a] ነገሩን አሳወቁ። ከዚያም ምን እንደ ሆነ ለማየት መጡ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በእርሻዎቹ።» የግሪኩ ቃል በቀጥታ እንዲህ ሊተረጎም ይችላል፤ እዚህ ግን በከተማው ዙሪያ ያሉትን የገጠር አካባቢዎች የሚያመለክት ይመስላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: βόσκοντες
  choice: የሚጠብቁት
  rationale: በዐውዱ የአሳማዎቹን መንጋ የሚንከባከቡትን ያመለክታል፤ «የሚጠብቁት» መመገብንና መንጋ መጠበቅን በተፈጥሯዊ አማርኛ ያካትታል።
- source_word: αὐτούς
  choice: እነርሱን
  rationale: ተውላጠ ስሙን ጠብቆ ያስተላልፋል፤ በቀደመው ቁጥር የተጠቀሱትን አሳማዎች እንደሚያመለክት ዐውዱ ግልጽ ያደርገዋል።
- source_word: ἔφυγον
  choice: ሸሹ
  rationale: ድንገተኛውን ሽሽት በአጭርና ጠንካራ የትረካ ቃል ያስተላልፋል።
- source_word: ἀπήγγειλαν
  choice: ያዩትን ነገር አወሩ
  rationale: ግሱ ዜናን ማድረስ ወይም ማሳወቅን ያመለክታል። አማርኛው ተፈጥሯዊ እንዲሆን በዐውዱ የታወቀው የዘገባው ይዘት በ«ያዩትን ነገር» ተገልጿል።
- source_word: εἰς τὴν πόλιν
  choice: በከተማው
  rationale: εἰς በቀጥታ «ወደ» ሊባል ቢችልም፣ ከዘገባ ግስ ጋር ዜናው የተሰራጨበትን ስፍራ «በከተማው» ማለት በአማርኛ ተፈጥሯዊ ነው።
- source_word: εἰς τοὺς ἀγρούς
  choice: በገጠሩ
  rationale: ἀγροί በቃል ደረጃ «እርሻዎች/ሜዳዎች» ሊሆን ይችላል፤ ከ«ከተማ» ጋር ባለው ንጽጽር ግን በከተማዋ ዙሪያ ያለውን የገጠር አካባቢ ስለሚያመለክት «በገጠሩ» ተመርጧል።
- source_word: ἦλθον
  choice: ሰዎቹም … መጡ
  rationale: ግሪኩ ግልጽ ስም የሌለው ብዙ ቁጥር ርዕሰ ጉዳይ አለው። በአማርኛ «ሰዎቹ» ማለት ከከተማና ከገጠር ዜናውን የሰሙትን ሰዎች በተፈጥሯዊ ሁኔታ ያመለክታል።
- source_word: ἰδεῖν
  choice: ለማየት
  rationale: የመምጣታቸውን ዓላማ በተፈጥሯዊ የአማርኛ ዓላማ አገላለጽ ያስተላልፋል።
- source_word: τί ἐστιν τὸ γεγονός
  choice: የሆነውን
  rationale: የግሪኩን ፍጹም አንቀጽ በትረካው ዐውድ «የሆነውን» በማለት አጭርና ተፈጥሯዊ አድርጎ ያቀርባል።
