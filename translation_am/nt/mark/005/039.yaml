  text: καὶ εἰσελθὼν λέγει αὐτοῖς· Τί θορυβεῖσθε καὶ κλαίετε; τὸ παιδίον οὐκ ἀπέθανεν ἀλλὰ καθεύδει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/039.yaml
  text: And after entering, he says to them, “Why are you making a commotion and weeping? The child has not died, but is sleeping.”
translation:
  language: am
  text: ወደ ውስጥም ገብቶ እንዲህ አላቸው፦ “ለምን ትረበሻላችሁ እና ታለቅሳላችሁ? ልጅቷ አልሞተችም፤ ተኝታለች እንጂ።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ልጅቷ አልሞተችም፤ ትተኛለች።” ኢየሱስ እዚህ “መተኛት” የሚለውን ቃል ለሞት በምሳሌ ተጠቅሞበት ሊሆን ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: ወደ ውስጥም ገብቶ
  rationale: የግሪኩ የአኦሪስት አጋዥ ግስ ከዋናው ግስ በፊት የሆነውን መግባት ያሳያል፤ ይህ አተረጓጎም በአማርኛ ተፈጥሯዊ ነው።
- source_word: λέγει
  choice: እንዲህ አላቸው
  rationale: ግሪኩ ታሪካዊ የአሁን ጊዜ ግስ ቢጠቀምም፣ በዘመናዊ አማርኛ ትረካ ያለፈ ጊዜው ተፈጥሯዊና ግልጽ ነው፤ ‘እንዲህ’ ቀጥሎ ያለውን ንግግር በሚገባ ያስተዋውቃል።
- source_word: Τί
  choice: ለምን
  rationale: በዚህ የጥያቄና የተግሣጽ አገባብ ‘ለምን’ የግሪኩን ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: θορυβεῖσθε
  choice: ትጮኻላችሁ
  rationale: ግሱ ጫጫታና ሁከት ማድረግን ያመለክታል፤ ‘ትጮኻላችሁ’ በሐዘኑ ትዕይንት ያለውን የሚሰማ ግርግር በቀላል ዘመናዊ አማርኛ ይገልጣል።
- source_word: κλαίετε
  choice: ታለቅሳላችሁ
  rationale: ‘ማልቀስ’ የሐዘኑን እንባና ዋይታ ሳያጋንን በክብር ይገልጣል።
- source_word: παιδίον
  choice: ሕፃኗ
  rationale: παιδίον ማለት ‘ልጅ/ሕፃን’ ነው፤ ከአውዱ ሴት መሆኗ ግልጽ ስለሆነ የአማርኛው ሴታዊ ቅርጽ ተፈጥሯዊ ሲሆን የቃሉን የዕድሜ ስሜትም ይጠብቃል።
- source_word: οὐκ ἀπέθανεν
  choice: አልሞተችም
  rationale: የግሪኩን የመሞት ክስተት በግስ መልክ ይጠብቃል፤ ‘ሙት አይደለችም’ ወደ ሁኔታዊ አገላለጽ ይቀይረው ነበር።
- source_word: καθεύδει
  choice: ተኝታለች
  rationale: የመተኛትን ቀጥተኛ ምስላዊ ቋንቋ ይጠብቃል፣ ትርጉሙንም አስቀድሞ አይፈታም።
theological_decisions:
- issue: ኢየሱስ ሞቷን ቃል በቃል እየካደ ነው ወይስ ‘መተኛት’ን ለሞት በምሳሌ እየተጠቀመ ነው?
  choice: “ተኝታለች እንጂ አልሞተችም” የሚለውን ግልጽ ንጽጽር በዋናው ጽሑፍ ማቆየት
  alternative: “ሞቷ ዘላቂ አይደለም” ወይም “ሊያስነሣት ስለሆነ እንደተኛች ናት” ብሎ መተርጎም
  rationale: ግሪኩ ንግግሩን ያለ ማብራሪያ በጠንካራ ንጽጽር ያቀርባል። ትርጉሙ የሞት ክህደት፣ ምሳሌያዊ ንግግር ወይም ሊመጣ ያለውን ትንሣኤ አስቀድሞ የሚመለከት ንግግር መሆኑን በዋናው ጽሑፍ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ተኝታለች እንጂ አልሞተችም’ የሚለው ቅደም ተከተል በአማርኛ ተፈጥሯዊ ሲሆን የግሪኩን οὐκ ... ἀλλά ተቃርኖ ይጠብቃል።
