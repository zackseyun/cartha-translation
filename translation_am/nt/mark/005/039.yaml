review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the entrance, question, lament, and the death/sleep contrast. However, ሕፃኗ normally denotes an infant or very young child, whereas παιδίον here refers to the twelve-year-old girl. The Greek contrast is also more directly represented by retaining the order “has not died, but sleeps.”
  naturalness: The proposed revision uses idiomatic modern standard Amharic. ትረበሻላችሁ better encompasses θορυβεῖσθε (“make a commotion/be disturbed”) than the narrower ትጮኻላችሁ (“shout”).
  terminology: ልጅቷ is appropriate in this context and avoids the age-specific implication of ሕፃኗ. The revised footnote preserves the sleep metaphor and its ambiguity without making the anticipated raising the explanatory basis of Jesus’ words.
  issues:
  - severity: medium
    issue: ሕፃኗ is overly age-specific.
    rationale: Although παιδίον can mean a young child, the girl in the immediate context is twelve years old. In current Amharic, ሕፃን commonly suggests an infant or toddler; ልጅቷ is more accurate and natural.
  - severity: low
    issue: ትጮኻላችሁ narrows θορυβεῖσθε to shouting.
    rationale: The Greek encompasses noisy disturbance or commotion, not merely shouting. ትረበሻላችሁ retains the broader sense while fitting the mourning setting.
  - severity: low
    issue: The footnote’s reference to Jesus’ coming raising is interpretively more specific than necessary.
    rationale: The footnote should identify the possible metaphorical use of sleep for death while leaving its precise narrative or theological explanation open.
