  yaml_path: translation/nt/mark/005/028.yaml
  text: For she was saying[a], "If I touch even his garments, I will be healed."
translation:
  language: am
  text: ምክንያቱም እንዲህ ትል ነበር፦ “ልብሶቹን ብቻ እንኳ ብነካ፣ እድናለሁ[a]።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: የግሪክኛው ግስ “መዳን፣” “መፈወስ” ወይም “ጤናማ መሆን” ማለት ይችላል፤ በዚህ አውድ የሚያመለክተው የሰውነት ፈውስን ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: ትል ነበር
  rationale: ያለፈ ጊዜ ቀጣይነትን የሚያሳየውን የግሪክኛውን ኢምፐርፌክት አንቀጽ ይጠብቃል፤ ንግግሩ በድምፅ ይሁን በልቧ የተባለ መሆኑን ሳይወስን ይተዋል።
- source_word: γὰρ
  choice: ምክንያቱም
  rationale: በፊት ለተጠቀሰው ድርጊት ምክንያት ወይም ማብራሪያ የሚሰጠውን አያያዥ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὅτι
  choice: ቀጥተኛ ጥቅስ
  rationale: የተናገረችውን ይዘት ያስገባል፤ በአማርኛ ቀጥተኛ ጥቅስ ተፈጥሯዊ ነው።
- source_word: Ἐὰν ἅψωμαι
  choice: ብነካ
  rationale: ከንዑስ አንቀጽ ጋር የተገለጸውን ሁኔታዊ ትርጉም አጭርና ተፈጥሯዊ በሆነ አማርኛ ያቀርባል።
- source_word: κἂν
  choice: ብቻ እንኳ
  rationale: ‘እንኳን ይህን ብቻ’ የሚለውን ዝቅተኛውን መጠን አጽንዖት በግልጽ አማርኛ ያሳያል።
- source_word: τῶν ἱματίων αὐτοῦ
  choice: ልብሶቹን
  rationale: ἱμάτια ብዙ ቁጥር ስለሆነ ‘ልብሶቹን’ የሚለው ሰፊ ትርጉሙንና ቁጥሩን ይጠብቃል፤ አንድ የተወሰነ መጎናጸፊያ ብቻ እንደሆነ አይወስንም።
- source_word: σωθήσομαι
  choice: እድናለሁ
  rationale: በአማርኛ ‘መዳን’ ከሕመም መፈወስንም ከአደጋ ወይም ከጥፋት መዳንንም ሊገልጽ ስለሚችል፣ የግሪክኛውን σῴζω የትርጉም ስፋት በተፈጥሯዊ ሁኔታ ይጠብቃል፤ አውዱ ግን በቀጥታ የሚያመለክተው የሰውነት ፈውስን ነው።
theological_decisions:
- issue: በፈውስ ትረካ ውስጥ σωθήσομαι የሚለውን መተርጎም
  choice: እድናለሁ
  alternative: እፈወሳለሁ / እድንበታለሁ
  rationale: የሴቲቱ የቅርብ ተስፋ ከደም መፍሰሷ በሰውነት መፈወስ ነው። ሆኖም σῴζω የመዳንንና የመፈወስን ትርጉም ሊይዝ ይችላል፤ ‘እድናለሁ’ ይህን መደራረብ ሳያጠፋ የአውዱን የፈውስ ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ትል ነበር’ የቀጣይ ወይም የተደጋጋሚ ንግግርን ገጽታ ይጠብቃል፤ ‘ልብሶቹን’ ዘመናዊና ከመጠን በላይ ሥነ ሥርዓታዊ ያልሆነ ነው።
