  choice: ይኖር ነበር
  rationale: የግሪኩ አገላለጽ ቃል በቃል ‘መኖሪያ ነበረው’ ቢሆንም፣ በዚህ አውድ የሚያመለክተው በዚያ መኖሩን ነው። ‘ይኖር ነበር’ ቀጣይ የነበረውን ሁኔታ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐν τοῖς μνήμασιν
  choice: በመቃብሮች መካከል
  rationale: μνῆμα የቀብር ስፍራን ወይም መቃብርን ያመለክታል። ‘በመቃብሮች መካከል’ የቦታውን አካባቢያዊ ትርጉም በተፈጥሯዊ ሁኔታ ያቀርባል፤ ቃል በቃል የሆነው አማራጭ በማስታወሻ ተጠብቋል።
- source_word: οὐκέτι
