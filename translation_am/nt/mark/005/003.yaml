  rationale: ነጠላውን ἁλύσει በ‘ሰንሰለት’ ያንጸባርቃል፤ ‘እንኳ’ ደግሞ οὐδέ የሚሰጠውን አጽንኦት ያስተላልፋል።
- source_word: οὐδεὶς ἐδύνατο αὐτὸν δῆσαι
  choice: ማንም ሊያስረው አይችልም ነበር
  rationale: ያለፈ ጊዜ ቀጣይ አለመቻልን እና δῆσαι የሚያመለክተውን አካላዊ ማሰር በግልጽ አማርኛ ይገልጣል።
