  text: ⸂καὶ διηγήσαντο⸃ αὐτοῖς οἱ ἰδόντες πῶς ἐγένετο τῷ δαιμονιζομένῳ καὶ περὶ τῶν χοίρων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/016.yaml
  text: And those who had seen it told them how it had happened to the demon-possessed man[a], and about the pigs.
translation:
  language: am
  text: ያዩት ሰዎችም በአጋንንት ተይዞ በነበረው ሰው[a] ላይ እንዴት እንደ ተፈጸመ እና ስለ አሳማዎቹ ነገሯቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ጋኔን ባደረበት ሰው» ወይም «በአጋንንት ቁጥጥር ሥር በነበረው ሰው»።
    reason: lexical_alternative
lexical_decisions:
- source_word: διηγήσαντο
  choice: ነገሯቸው
  rationale: ግሱ የተፈጸመውን ነገር በትረካ መልክ መግለጽን ያመለክታል፤ «ነገሯቸው» በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን የዘገባውን ይዘት ቀጣዩ ሐረግ ያብራራል።
- source_word: οἱ ἰδόντες
  choice: ያዩትም ሰዎች
  rationale: በቦታው ተገኝተው የተፈጸመውን ያዩትን ሰዎች ያመለክታል፤ «የዓይን ምስክሮች» የሚለውን የተርጓሚ ስያሜ ሳያክል የአሳታፊውን ኃይል ይጠብቃል።
- source_word: πῶς ἐγένετο
  choice: እንዴት እንደሆነ
  rationale: የክስተቱን አካሄድ ወይም ሁኔታ ይገልጣል፤ በአማርኛም ግልጽና ተፈጥሯዊ ነው።
- source_word: τῷ δαιμονιζομένῳ
  choice: በአጋንንት ተይዞ በነበረው ሰው
  rationale: በአጋንንታዊ ኃይል ቁጥጥር ሥር የነበረውን ሰው በግልጽና የሰውነቱን ማንነት በማይደብቅ መንገድ ይገልጣል፤ የአማርኛው ብዙ ቁጥር «አጋንንት» በአውዱ ከተጠቀሱት ብዙ ርኩሳን መናፍስት ጋር ይስማማል።
- source_word: περὶ τῶν χοίρων
  choice: ስለ አሳማዎቹም
  rationale: περί ከዘር አመልካች ጋር «ስለ» የሚል ትርጉም አለው፤ «አሳማዎቹ» ደግሞ በአውዱ የታወቀውን መንጋ ያመለክታል።
theological_decisions:
- issue: በአጋንንት የተጠቃውን ሰው የሚገልጸው የδαιμονιζομένῳ አተረጓጎም
  choice: በአጋንንት ተይዞ በነበረው ሰው
  alternative: ጋኔን ባደረበት ሰው፤ በአጋንንት ቁጥጥር ሥር በነበረው ሰው
  rationale: የማርቆስን ትረካ እንዳለ ይጠብቃል፤ ሁኔታውን ወደ ሥነ ልቦናዊ ምድብ አይቀንሰውም፣ እንዲሁም ሰውየውን በሁኔታው ብቻ አይሰይመውም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ያዩትም ሰዎች» የግሪክ አሳታፊ አወቃቀርን በተፈጥሯዊ አማርኛ ያቀርባል።
