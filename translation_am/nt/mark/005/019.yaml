- source_word: πρὸς τοὺς σούς
  choice: ወደ ወገኖችህ
  rationale: ግሪኩ በቀጥታ ‘ወደ ራስህ የሆኑት’ ይላል። ‘ወገኖችህ’ ቤተሰብንና ቅርብ ወዳጆችን ሊያካትት የሚችለውን ሰፊ ትርጉም ይጠብቃል።
- source_word: ἀπάγγειλον αὐτοῖς
  choice: ንገራቸው
  rationale: ἀπαγγέλλω ያየውን ወይም የተደረገውን መናገርና ማሳወቅ ነው፤ ‘ንገራቸው’ ግልጽና ተፈጥሯዊ ነው።
- source_word: ὅσα … πεποίηκεν
  choice: ምን ያህል እንዳደረገልህ
  rationale: ὅσα የተደረገውን ስፋትና መጠን ያሳያል፤ ‘ምን ያህል’ ይህን አጽንዖት ይጠብቃል።
- source_word: ἠλέησέν σε
  choice: ምሕረቱን እንዳሳየህ
  rationale: ἐλεάω ምሕረትን ማሳየት ማለት ነው። ይህ አገላለጽ ‘ማረ’ የሚለው ቃል ሊያመጣው የሚችለውን ‘ይቅር አለ’ የሚል የተጠበበ ግንዛቤ ያስወግዳል።
theological_decisions:
- issue: በዚህ አውድ ὁ κύριος ማንን እንደሚያመለክት
  choice: ጌታ
  alternative: እግዚአብሔር
  rationale: ‘ጌታ’ የκύριοςን መደበኛ ትርጉም ይጠብቃል። ቃሉን ‘እግዚአብሔር’ ብሎ በመተርጎም በእግዚአብሔር ምሕረትና በኢየሱስ ድርጊትና ሥልጣን መካከል ያለውን ሆን ተብሎ የተጠበቀ ግንኙነት አንድ ወገን አይፈታም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። ‘ይልቁንም’ የἀλλάን ጠንካራ ንጽጽር ያሳያል፤ በግሪኩ ያለው ታሪካዊ የአሁን ጊዜ λέγει በተፈጥሯዊ የአማርኛ ትረካ ‘አለው’ ተብሎ ቀርቧል።
