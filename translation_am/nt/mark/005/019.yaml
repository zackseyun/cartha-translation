base_translation:
  language: en
  yaml_path: translation/nt/mark/005/019.yaml
  text: And he did not permit him[a], but said to him, “Go to your home, to your own people[c][b], and report to them how much the Lord has done for you and has shown mercy to you.”
translation:
  language: am
  text: እርሱም አልፈቀደለትም፤ ነገር ግን እንዲህ አለው፦ “ወደ ቤትህ፣ ወደ ወገኖችህ[a] ሂድ፤ ጌታ[b] ምን ያህል እንዳደረገልህና ምሕረቱን እንዳሳየህ ንገራቸው።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ግሪኩ በቀጥታ “ወደ ራስህ የሆኑት” ይላል፤ አገላለጹ ቤተሰቡንና ሌሎች ቅርብ ሰዎቹን በሰፊው ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: አንዳንዶች “ጌታ” የሚለውን እዚህ በተለይ እግዚአብሔርን እንደሚያመለክት ይረዱታል፤ ሌሎች ደግሞ ማርቆስ በእግዚአብሔር ምሕረትና በኢየሱስ ሥልጣንና ድርጊት መካከል ያለውን ግንኙነት ሆን ብሎ እንደጠበቀ ያዩታል።
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἀφῆκεν αὐτόν
