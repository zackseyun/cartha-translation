base_translation:
  language: en
  yaml_path: translation/nt/mark/006/031.yaml
  text: And he said to them[a], “Come away by yourselves to a desolate place and rest a little.” For many were coming and going[b], and they did not even have an opportunity to eat.
translation:
  language: am
  text: እርሱም፣ “እናንተ ለብቻችሁ ሰው ወደሌለበት ስፍራ[a] ኑና ጥቂት ዕረፉ” አላቸው። የሚመጡና የሚሄዱ ሰዎች ብዙ ስለነበሩ፣ እነርሱ ለመብላት እንኳ አጋጣሚ[b] አልነበራቸውም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “ወደ ገለልተኛ ስፍራ” ወይም “ወደ በረሃማ ስፍራ።” የግሪኩ ቃል ሰው የማይኖርበትን ወይም ገለልተኛ ቦታን ያመለክታል፤ በዘመናዊው አጠቃቀም እንደሚታሰበው ደረቅ አሸዋማ በረሃ መሆን አያስፈልገውም።
    reason: lexical_alternative
  - marker: b
