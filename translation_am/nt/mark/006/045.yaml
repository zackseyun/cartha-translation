    text: ወይም፣ «ወደ ቤተ ሳይዳ አቅጣጫ።» የግሪክኛው መስተዋድድ አቅጣጫን («ወደ … አቅጣጫ») ወይም የተወሰነ መድረሻን («ወደ …») ሊያመለክት ይችላል።
