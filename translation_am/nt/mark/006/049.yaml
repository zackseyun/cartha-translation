  text: እነርሱ ግን በባሕሩ ላይ ሲራመድ ባዩት ጊዜ፣ “መንፈስ ነው”[a] ብለው አሰቡና ጮኹ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ቅዠት” ወይም “የሚታይ መንፈሳዊ መልክ።” የግሪኩ φάντασμα መንፈስን ወይም እንደ መንፈስ የሚታይ አስፈሪ መልክን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: እነርሱ ግን
