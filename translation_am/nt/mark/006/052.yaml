  revision_rationale: The revision restores the explicit contrast expressed by ἀλλ’, uses a source-close and idiomatic rendering of ἐπὶ τοῖς ἄρτοις without making the implied significance part of the main text, and renders πεπωρωμένη with the corresponding metaphor of hardening. It preserves the Greek’s singular collective “heart” and does not specify the cause of the hardening.
