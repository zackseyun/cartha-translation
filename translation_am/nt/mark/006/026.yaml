source:
  edition: SBLGNT
  text: καὶ περίλυπος γενόμενος ὁ βασιλεὺς διὰ τοὺς ὅρκους καὶ τοὺς ⸀ἀνακειμένους οὐκ ἠθέλησεν ⸂ἀθετῆσαι αὐτήν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/026.yaml
  text: And the king[a], becoming deeply grieved, because of his oaths and those reclining at the table[c][b], did not want to refuse her.
translation:
  language: am
  text: ንጉሡም እጅግ አዘነ፤ ሆኖም በመሐላዎቹና በማዕድ አብረውት በተቀመጡት ሰዎች ምክንያት ሊነፍጋት አልፈለገም።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ጥያቄዋን ወደ ጎን ሊያደርግ።” ሐሳቡ ለእርሷ የገባላትን ቃል መፈጸም እንዳይቀር አለመፈለጉ ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: περίλυπος
  choice: እጅግ አዘነ
  rationale: የቃሉን ጥልቅ ሐዘን በተፈጥሯዊና በዘመናዊ አማርኛ ያስተላልፋል።
- source_word: γενόμενος
  choice: አዘነ
  rationale: የሁኔታ ለውጡ በአማርኛው ግስ ውስጥ በተፈጥሮ ተካትቷል፤ ቀጣዩ ‘ነገር ግን’ ደግሞ የአሳቡን ተቃርኖ ያሳያል።
- source_word: ὁ βασιλεὺς
  choice: ንጉሡ
  rationale: ማርቆስ ለሄሮድ የተጠቀመበትን የግሪክ ማዕረግ በቀጥታ ይጠብቃል።
- source_word: διὰ τοὺς ὅρκους
  choice: በማለው መሐላ
  rationale: διά ከተሳቢ ጋር የምክንያትን ሐሳብ ያሳያል፤ ብዙ ቁጥሩ በዐውዱ ያለውን ተደጋጋሚ የመሐላ ንግግር በተፈጥሯዊ አማርኛ በነጠላ የስብስብ ስም ተገልጧል።
- source_word: τοὺς ἀνακειμένους
  choice: በማዕድ በተቀመጡት
  rationale: የምግብ ግብዣውን ሁኔታ ይጠብቃል፤ ቃል በቃል ‘ተደግፈው የተኙት’ ማለት በዘመናዊ አማርኛ የተሳሳተ ምስል ሊሰጥ ስለሚችል ተፈጥሯዊው አገላለጽ ተመርጧል።
- source_word: οὐκ ἠθέλησεν
  choice: አልፈለገም
  rationale: አለመቻልን ሳይሆን ፈቃደኛ አለመሆንን በግልጽ ያሳያል።
- source_word: ἀθετῆσαι αὐτήν
  choice: ሊክዳት
  rationale: በዐውዱ ንጉሡ የገባላትን ቃል ችላ ብሎ ጥያቄዋን አለመፈጸም ማለት ነው፤ ‘ሊክዳት’ የግሪኩን ሆን ብሎ ወደ ጎን የማድረግ ስፋት ይጠብቃል።
theological_decisions:
- issue: የγενόμενος አገባብ ከዋናው ግስ ጋር ያለው ግንኙነት
  choice: የተቃርኖ ፍንጭን በ‘ነገር ግን’ ማሳየት
  alternative: ያለ አያያዥ፣ ‘እጅግ አዝኖ’ ብሎ መተርጎም
  rationale: ንጉሡ በጥልቅ ቢያዝንም በመሐላውና በእንግዶቹ ፊት ሊክዳት አለመፈለጉ በትረካው የሚታየው ተቃርኖ ነው፤ ይህ አገባብ ግን ኃላፊነቱን አያስወግድለትም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘በማዕድ በተቀመጡት ፊት’ የጥንቱን የመመገቢያ አቀማመጥ ቃል በቃል ሳያስገባ የእንግዶቹን መገኘትና ማኅበራዊ ጫና ያሳያል።
