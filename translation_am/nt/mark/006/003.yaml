  text: οὐχ οὗτός ἐστιν ὁ τέκτων, ὁ υἱὸς ⸀τῆς Μαρίας ⸂καὶ ἀδελφὸς⸃ Ἰακώβου καὶ ⸀Ἰωσῆτος καὶ Ἰούδα καὶ Σίμωνος; καὶ οὐκ εἰσὶν αἱ ἀδελφαὶ αὐτοῦ ὧδε πρὸς ἡμᾶς; καὶ ἐσκανδαλίζοντο ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/003.yaml
  text: Is this not the carpenter[b][a], the son of Mary and brother of James and Joses and Judas and Simon? And are not his sisters here with us? And they took offense at him.
translation:
  language: am
  text: “ይህ አናጢው፣ የማርያም ልጅ፣ የያዕቆብ፣ የዮሴስ፣ የይሁዳና የስምዖን ወንድም[a] አይደለምን? እህቶቹስ[a] እዚህ ከእኛ ጋር የሉምን?” እያሉ በእርሱ ተሰናከሉ ነበር።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ወንድም” እና “እህቶች” የሚሉት የግሪክ ቃላት በተለምዶ ወንድምና እህቶችን ያመለክታሉ፤ አንዳንድ የክርስቲያን ትውፊቶች ግን በዚህ ስፍራ የቅርብ ዘመዶችን ወይም የእንጀራ ወንድሞችና እህቶችን እንደሚያመለክቱ ይረዷቸዋል።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ “በእርሱ ተበሳጩ” ወይም “በእርሱ ምክንያት ተሰናከሉ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκτων
  choice: አናጢ
  rationale: ቃሉ በሰፊው የእጅ ባለሙያን ወይም ግንበኛን ሊያመለክት ቢችልም፣ በዚህ አውድ የተለመደውና ግልጽ ትርጉም ‘አናጢ’ ነው።
- source_word: υἱὸς τῆς Μαρίας
  choice: የማርያም ልጅ
  rationale: የግሪኩን ጉልህ የእናት መለያ በቀጥታ ይጠብቃል፤ ቃሉ የሚያመለክተውን ማኅበራዊ ስሜት ግን አይተረጉምም።
- source_word: ἀδελφὸς
  choice: ወንድም
  rationale: የቃሉ መደበኛ ትርጉም ‘ወንድም’ ነው፤ ዘመድ ወይም የእንጀራ ወንድም የሚለው ትውፊታዊ አረዳድ በማስታወሻ ተጠቅሷል።
- source_word: Ἰωσῆτος
  choice: ዮሴስ
  rationale: በምንጩ ያለውን ልዩ የስም ቅርጽ ከ‘ዮሴፍ’ ጋር ሳያመሳስል ይጠብቃል።
- source_word: ἀδελφαὶ
  choice: እህቶች
  rationale: የቃሉ ቀጥተኛና መደበኛ ትርጉም ‘እህቶች’ ነው፤ ሌላው የዝምድና አረዳድ በማስታወሻ ቀርቧል።
- source_word: ὧδε πρὸς ἡμᾶς
  choice: እዚህ ከእኛ ጋር
  rationale: ተናጋሪዎቹ ከእህቶቹ ጋር ያላቸውን አካባቢያዊና ማኅበራዊ ቅርበት በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: በእርሱ ምክንያት ይሰናከሉ ነበር
  rationale: የግሪኩን የመሰናከል ምስልና የኢምፐርፌክት ቀጣይ ድርጊት ይጠብቃል፤ በአውዱ እርሱን አለመቀበላቸውን ያመለክታል።
theological_decisions:
- issue: የኢየሱስ ‘ወንድም’ እና ‘እህቶች’ የሚሉት የዝምድና ቃላት
  choice: በዋናው ጽሑፍ መደበኛዎቹን ‘ወንድም’ እና ‘እህቶች’ የሚሉ ቃላት መጠቀም
  alternative: ዘመዶች ወይም የእንጀራ ወንድሞችና እህቶች ብሎ መተርጎም
  rationale: ምንጩ የዝምድናውን ትክክለኛ ዓይነት አይፈታም፤ ስለዚህ ትርጉሙ መደበኛውን የቃላቱን ዋጋ ይጠብቃል፣ የክርክሩን አማራጮችም በማስታወሻ ያሳያል።
- issue: ‘የማርያም ልጅ’ የሚለው መጠሪያ ማኅበራዊ ኃይል
  choice: ያለ ተጨማሪ ማብራሪያ በቀጥታ መተርጎም
  alternative: ንቀት የያዘ መጠሪያ እንደሆነ በዋናው ጽሑፍ ማስገባት
  rationale: በአውዱ ንቀት ሊኖረው ቢችልም ጽሑፉ ይህን በግልጽ አይናገርም፤ ትርጉሙም ያንን ጥርጣሬ ክፍት ይተዋል።
- issue: ἐσκανδαλίζοντο የሚለው መንፈሳዊና ማኅበራዊ ኃይል
  choice: ‘ይሰናከሉ ነበር’ በማለት የምንጩን ምስል መጠበቅ
  alternative: ‘ተቆጡበት’ ወይም ‘አልተቀበሉትም’ ብሎ በግልጽ መፍታት
  rationale: ቃሉ መበሳጨትን፣ አለመቀበልን ወይም በእርሱ ምክንያት መሰናከልን ሊያካትት ስለሚችል የምንጩ ምስልና ጥልቀት ተጠብቋል።
