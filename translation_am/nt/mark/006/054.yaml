  text: And when they got out of the boat[a], immediately they recognized him.
translation:
  language: am
  text: ከጀልባውም በወጡ ጊዜ፣ ወዲያው ሰዎቹ አወቁት።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪኩ «ወዲያው አውቀው» የሚለው የብዙ ቁጥር ተሳቢ ማንን እንደሚያመለክት በስም አይገልጽም። ዐውደ ንባቡ ግን የአካባቢው ሰዎች ኢየሱስን እንዳወቁት ያሳያል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξελθόντων αὐτῶν
  choice: ከጀልባውም በወጡ ጊዜ
  rationale: የግሪኩን ጄኒቲቭ አብሶሉት በተፈጥሯዊ የአማርኛ ጊዜ ንዑስ አረፍተ ነገር ይገልጻል።
- source_word: πλοίου
  choice: ጀልባ
  rationale: በገሊላ ባሕር ላይ የሚጠቀሙበትን አነስተኛ መርከብ በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: εὐθὺς
  choice: ወዲያው
  rationale: በማርቆስ ዘገባ ተደጋግሞ የሚታየውን ፈጣንነት በግልጽና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐπιγνόντες
  choice: አወቁት
  rationale: በዓይን አይተው ማንነቱን መለየታቸውን ያመለክታል፤ የነገሩ ተሳቢም በአማርኛው ግስ ውስጥ ተገልጧል።
- source_word: αὐτὸν
  choice: እርሱን
  rationale: ተውላጠ ስሙ በዐውደ ንባቡ ኢየሱስን ያመለክታል።
- source_word: implicit subject of ἐπιγνόντες
  choice: ሰዎቹ
  rationale: የግሪኩ ተሳቢ በቀጥታ አልተጠቀሰም፤ ነገር ግን ቀጣዩ ቁጥር የአካባቢው ሰዎች እንደሆኑ ያሳያል። በዋናው ጽሑፍ ለግልጽነት ተጨምሯል፣ የምንጩ አሻሚነት ግን በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: ኢየሱስን ያወቁት እነማን እንደሆኑ
  choice: የአካባቢው ሰዎች እርሱን አወቁት
  alternative: ተሳቢውን ሳይገልጹ፣ «ወዲያው እርሱን አውቀው» ብሎ መተርጎም
  rationale: ይህ ከእምነት ትምህርት ይልቅ የአገባብና የዐውደ ንባብ ጉዳይ ነው። ἐπιγνόντες የብዙ ቁጥር ኖሚናቲቭ ቅጽ ስለሆነ በጄኒቲቭ አብሶሉቱ ካለው αὐτῶν ጋር በቀጥታ አይስማማም፤ ቁጥር 55 የአካባቢውን ሰዎች እንደ ፈጻሚዎች ያሳያል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። «ሰዎቹ» ለአማርኛ ግልጽነት በዋናው ጽሑፍ ተጨምሯል፤ የግሪኩ የተሳቢ አሻሚነት በእግር ማስታወሻው ተጠብቋል።
