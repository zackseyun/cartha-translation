    rationale: The wording beginning ‘እነርሱም’ supplies a subject, although the Greek participle’s subject is not explicitly named. Its final ‘አውቀው…’ is also an incomplete Amharic construction. The note should explain the ambiguity directly rather than offer a misleadingly literal alternative.
