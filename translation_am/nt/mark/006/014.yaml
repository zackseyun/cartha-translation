source:
  edition: SBLGNT
  text: Καὶ ἤκουσεν ὁ βασιλεὺς Ἡρῴδης, φανερὸν γὰρ ἐγένετο τὸ ὄνομα αὐτοῦ, καὶ ⸀ἔλεγον ὅτι Ἰωάννης ὁ βαπτίζων ⸂ἐγήγερται ἐκ νεκρῶν⸃, καὶ διὰ τοῦτο ἐνεργοῦσιν αἱ δυνάμεις ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/014.yaml
  text: And King Herod heard of it[a], for his name had become well known, and people were saying, “John the Baptizer has been raised from the dead[c][b], and because of this these powers are at work in him.”
translation:
  language: am
  text: ንጉሥ ሄሮድስም ይህን ሰማ፤ የኢየሱስ ስም በሰፊው ታውቆ ነበርና። ሰዎችም፣ “አጥማቂው ዮሐንስ[a] ከሙታን ተነሥቷል[b]፤ ስለዚህም ኃይሎች[c] በእርሱ ይሠራሉ” ይሉ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “የሚያጠምቀው ዮሐንስ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ከሙታን ተነሣ።” የግሪኩ ግስ ፍጹም ተደራጊ ቅርጽ ነው፤ “ተነሥቷል” የሚለው ይህን ቅርጽ ይጠብቃል።
    reason: alternative_reading
  - marker: c
    text: ወይም፣ “ተአምራዊ ኃይሎች” ወይም “የኃይል ሥራዎች።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: ንጉሥ ሄሮድስ
  rationale: የግሪኩን የንግሥና ማዕረግ ቀጥታ ይጠብቃል፤ በአማርኛም ተፈጥሯዊ አገላለጽ ነው።
- source_word: ἤκουσεν
  choice: ይህን ሰማ
  rationale: በቀደመው ክፍል የተገለጸውን የኢየሱስ ሥራና ዝና እንደሰማ ያመለክታል፤ ግልጽ ያልሆነውን ተሳቢ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: φανερὸν γὰρ ἐγένετο τὸ ὄνομα αὐτοῦ
  choice: የኢየሱስ ስም በሰፊው ታውቆ ነበርና
  rationale: ‘ስሙ የታወቀ ሆነ’ የሚለውን ፈሊጣዊ ሐሳብ በተፈጥሯዊ አማርኛ ያቀርባል። ተውላጠ ስሙ በአውዱ ሊያሻማ ስለሚችል ‘የኢየሱስ’ ተብሎ ግልጽ ሆኗል።
- source_word: ἔλεγον
  choice: ሰዎችም ... ይሉ ነበር
  rationale: ግልጽ ባለቤት የሌለውን የብዙ ቁጥር ግስ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: Ἰωάννης ὁ βαπτίζων
  choice: አጥማቂው ዮሐንስ
  rationale: የአማርኛው የተለመደ ማዕረግ ሲሆን የβαπτίζωνን ‘የሚያጠምቅ’ የሚል የተሳትፎ ትርጉም ያስተላልፋል። ይበልጥ ቃል በቃል የሆነው አማራጭ በማስታወሻ ተሰጥቷል።
- source_word: ἐγήγερται ἐκ νεκρῶν
  choice: ከሙታን ተነሥቷል
  rationale: በአማርኛ የትንሣኤን ሐሳብ በተፈጥሯዊ ሁኔታ ይገልጻል። የግሪኩ ፍጹም ተደራጊ ቅርጽ ያለው ልዩነት በማስታወሻ ተጠብቋል።
- source_word: διὰ τοῦτο
  choice: ስለዚህም
  rationale: የምክንያትና የውጤት ግንኙነቱን በአጭርና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐνεργοῦσιν αἱ δυνάμεις ἐν αὐτῷ
  choice: እነዚህ ኃይላት በእርሱ ይሠራሉ
  rationale: δυνάμειςን እንደ ግሱ ባለቤት፣ ἐν αὐτῷንም በቀጥታ ‘በእርሱ’ ብሎ ይጠብቃል፤ ‘ተአምራት’ ብሎ ትርጉሙን አይወስንም።
theological_decisions:
- issue: በትንሣኤ አውድ የἐγήγερται አተረጓጎም
  choice: ከሙታን ተነሥቷል
  alternative: ከሙታን እንዲነሣ ተደርጓል
  rationale: ዋናው አገላለጽ በአማርኛ ተፈጥሯዊና ግልጽ ነው፤ የግሪኩ ተደራጊ ቅርጽ ግን እንዳይጠፋ በማስታወሻ ተገልጿል።
- issue: የἸωάννης ὁ βαπτίζων ማዕረግ
  choice: አጥማቂው ዮሐንስ
  alternative: የሚያጠምቀው ዮሐንስ
  rationale: የተለመደው የአማርኛ ቅርጽ ለአንባቢዎች ግልጽ ሲሆን የግሪኩን ግሳዊ ሐሳብም ይይዛል፤ ቃል በቃል አማራጩ በማስታወሻ ተጠብቋል።
- issue: የδυνάμεις ትርጉም
  choice: ኃይላት
  alternative: ተአምራዊ ኃይላት / የኃይል ሥራዎች
  rationale: የግሪኩ ቃል ኃይሎችንም ሆነ የኃይል ሥራዎችን ሊያመለክት ስለሚችል ዋናው ጽሑፍ አሻሚነቱን ጠብቆ ‘ኃይላት’ ይላል።
