  verdict: revise
  source_fidelity: 'The draft preserves the sequence and force of the Greek: her immediate, hurried entrance; her request to the king; the separate urgency of ἐξαυτῆς; the platter; and the explicit request for John''s head. However, the title-name construction is awkward and can be made idiomatic without loss.'
