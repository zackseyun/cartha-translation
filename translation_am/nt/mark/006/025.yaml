id: MRK.6.25
reference: Mark 6:25
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ εἰσελθοῦσα ⸀εὐθὺς μετὰ σπουδῆς πρὸς τὸν βασιλέα ᾐτήσατο λέγουσα· Θέλω ἵνα ⸂ἐξαυτῆς δῷς μοι⸃ ἐπὶ πίνακι τὴν κεφαλὴν Ἰωάννου τοῦ βαπτιστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/025.yaml
  text: And she immediately went in with haste to the king and asked[a], saying, “I want you to give me at once, on a platter, the head of John the Baptizer.”
translation:
  language: am
  text: እርሷም ወዲያው በችኮላ ወደ ንጉሡ ገብታ፣ “የአጥማቂው ዮሐንስን ራስ አሁኑኑ በወጭት ላይ እንድትሰጠኝ እፈልጋለሁ” ብላ ጠየቀችው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσελθοῦσα
  choice: ወደ ንጉሡ ገብታ
  rationale: የአኦሪስት አያያዥ ግስ የእርሷን ወደ ንጉሡ መግባት ያመለክታል፤ በአማርኛ የቦታ ግንኙነቱን ከቀጣዩ ሐረግ ጋር ማዋሃድ ተፈጥሯዊ ነው።
- source_word: εὐθὺς
  choice: ወዲያው
  rationale: ማርቆስ የሚያጎላውን የተግባር ፈጣንነት በተለመደና ግልጽ አማርኛ ያስተላልፋል።
- source_word: μετὰ σπουδῆς
  choice: በችኮላ
  rationale: ፈጥኖ እና አጣድፎ መንቀሳቀስን ያሳያል፤ አዎንታዊ ጉጉትን ሳያስገባ የጊዜ አጣዳፊነቱን ይጠብቃል።
- source_word: βασιλέα
  choice: ንጉሡ
  rationale: ሄሮድስ በታሪክ የአራተኛ ክፍል ገዢ ቢሆንም የግሪኩ ጽሑፍ βασιλεύς ስለሚል በቀጥታ ‘ንጉሥ’ ተብሏል።
- source_word: ᾐτήσατο
  choice: ጠየቀችው
  rationale: αἰτέω እዚህ ጥያቄ ወይም ልመና ማቅረብን ያሳያል፤ የንግግሩ ጽናት በቀጥታው ንግግር ይገለጣል እንጂ ግሱን ‘አዘዘች’ ብሎ ማጠንከር አያስፈልግም።
- source_word: Θέλω
  choice: እፈልጋለሁ
  rationale: የተናጋሪዋን ግልጽና ቀጥተኛ ፍላጎት በዘመናዊ መደበኛ አማርኛ ይገልጻል።
- source_word: ἵνα ... δῷς μοι
  choice: እንድትሰጠኝ
  rationale: የἵνα ሐረጉ የምትፈልገውን ነገር ይገልጻል፤ ይህ ቅርጽ ተፈጥሯዊና ትክክለኛ የአማርኛ አቀራረብ ነው።
- source_word: ἐξαυτῆς
  choice: አሁኑኑ
  rationale: ጥያቄው ያለምንም መዘግየት እንዲፈጸም መፈለጓን ያጎላል፤ εὐθὺς በተናጠል ‘ወዲያው’ ተብሎ ስለተተረጎመ ሁለቱም የፍጥነት አገላለጾች ተጠብቀዋል።
- source_word: ἐπὶ πίνακι
  choice: በወጭት ላይ
  rationale: πίναξ ምግብ ለማቅረብ የሚያገለግል ሰፊ ወጭትን ያመለክታል፤ ‘ወጭት’ ለተራው አንባቢ ግልጽና ከግብዣው አውድ ጋር የሚስማማ ነው።
- source_word: κεφαλὴν
  choice: ራስ
  rationale: የትረካውን አስከፊ ግልጽነት ሳያለዝብ ቃሉን በቀጥታ ያስተላልፋል።
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: የአጥማቂውን የዮሐንስን
  rationale: βαπτιστής የሥራ ወይም የተግባር መጠሪያ ስለሆነ ‘አጥማቂ’ በማለት ትርጉሙ ተጠብቋል፤ የአማርኛ የባለቤትነትና የተሳቢ ምልክቶች ለግልጽነት ተደግመዋል።
theological_decisions:
- issue: የἸωάννου τοῦ βαπτιστοῦ አተረጓጎም
  choice: አጥማቂው ዮሐንስ
  alternative: መጥምቁ ዮሐንስ
  rationale: ‘አጥማቂ’ የβαπτιστήςን ገላጭና ተግባራዊ ኃይል በዘመናዊ አማርኛ በግልጽ ያስተላልፋል። ‘መጥምቁ’ የተለመደ ባህላዊ አማራጭ ቢሆንም ለአንዳንድ ዘመናዊ አንባቢዎች ያነሰ ግልጽ ሊሆን ይችላል።
