  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ወዲያው’ እና ‘አሁኑኑ’ በማለት εὐθὺς እና ἐξαυτῆς ለየብቻ ተጠብቀዋል። በዚህ ረቂቅ የግርጌ ማስታወሻ አላስፈለገም።
