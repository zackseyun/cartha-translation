  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በባሕሩ ዳርቻ።” የግሪኩ ጽሑፍ “በየብስ ላይ” ይላል፤ ይህም እርሱ የነበረበትን ስፍራ ጀልባይቱ በባሕር ውስጥ ከነበረችበት ስፍራ ጋር ያነጻጽራል።
