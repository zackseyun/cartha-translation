- source_word: ἐπὶ τῆς γῆς
  choice: በየብስ ላይ
  rationale: ‘የብስ’ ኢየሱስ ከባሕር ውጭ መሆኑን ከጀልባይቱ ስፍራ ጋር በግልጽ ያነጻጽራል፤ ‘በዳርቻ’ ከሚለውም ያነሰ ትርጓሜያዊ ነው።
