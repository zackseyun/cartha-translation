id: MRK.6.50
reference: Mark 6:50
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: πάντες γὰρ αὐτὸν εἶδον καὶ ἐταράχθησαν. ⸂ὁ δὲ εὐθὺς⸃ ἐλάλησεν μετ’ αὐτῶν, καὶ λέγει αὐτοῖς· Θαρσεῖτε, ἐγώ εἰμι, μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/050.yaml
  text: For they all saw him and were troubled. But he immediately spoke with them and says to them, “Take courage; I am; do not be afraid.”
translation:
  language: am
  text: ሁሉም እርሱን አይተው ደነገጡና። እርሱ ግን ወዲያውኑ ከእነርሱ ጋር ተናገረ፤ እንዲህም አላቸው፦ “አይዟችሁ! እኔ ነኝ፤ አትፍሩ።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐταράχθησαν
  choice: ደንግጠው ነበር
  rationale: በዚህ የፍርሃት አውድ ውስጥ ያለውን መታወክና መደንገጥ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: Θαρσεῖτε
  choice: አይዟችሁ
  rationale: የማበረታቻውን ትእዛዝ ‘ድፍረት ይኑራችሁ’ ከሚለው ይበልጥ ተፈጥሯዊና በንግግር የተለመደ አድርጎ ይገልጣል።
- source_word: ἐγώ εἰμι
  choice: እኔ ነኝ
  rationale: የግሪኩን አጭርና ቀጥተኛ አነጋገር ጠብቆ፣ ‘እኔው ነኝ’ ወይም መለኮታዊ ስምን በግልጽ የሚያስገባ ትርጉም በመምረጥ ያለውን አሻሚነት አይዘጋም።
- source_word: ἐλάλησεν μετ’ αὐτῶν
  choice: አነጋገራቸው
  rationale: ‘ከእነርሱ ጋር ተናገረ’ የሚለውን በተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: ἐγώ εἰμι የሚለው አነጋገር ተራ ራስን መግለጥ ነው ወይስ መለኮታዊ ማጣቀሻ አለው?
  choice: እኔ ነኝ
  alternative: እኔው ነኝ / እኔ ነኝ (ያህዌን በግልጽ በሚያመለክት ማብራሪያ)
  rationale: ሐረጉ በአውዱ ‘እኔ ነኝ’ የሚል መታወቂያ ሊሆን ቢችልም፣ የብሉይ ኪዳን መለኮታዊ የራስ መግለጫንም ሊያስታውስ ይችላል። ቀጥተኛው ትርጉም ሁለቱንም ዕድል ክፍት ያደርጋል።
- issue: የታሪካዊ ጊዜ መቀያየር፣ ἐλάλησεν ... λέγει
  choice: አነጋገራቸውና ... አላቸው
  alternative: አነጋገራቸውና ... ይላቸዋል
  rationale: የግሪክ ታሪካዊ የአሁን ጊዜን በአማርኛ ቃል በቃል መጠበቅ የትረካውን ፍሰት ያስተጓጉላል፤ ያለፈ ጊዜ በተፈጥሯዊነት አቅርቦ የንግግሩን ይዘት ሳይቀይር ያስተላልፋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። የትረካው ምክንያታዊ ግንኙነት ‘-ና’ በሚለው ቅጥያ ተጠብቋል፤ የኢየሱስ አጭር ሦስት ክፍል ንግግርም ተጠብቋል።
