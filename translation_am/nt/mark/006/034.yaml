  edition: SBLGNT
  text: καὶ ἐξελθὼν ⸀εἶδεν πολὺν ὄχλον, καὶ ἐσπλαγχνίσθη ἐπ’ ⸀αὐτοὺς ὅτι ἦσαν ὡς πρόβατα μὴ ἔχοντα ποιμένα, καὶ ἤρξατο διδάσκειν αὐτοὺς πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/034.yaml
  text: And when he went ashore[a], he saw a large crowd, and he had compassion on them, because they were like sheep without a shepherd[b]. And he began to teach them many things.
translation:
  language: am
  text: ከጀልባው ወጥቶ[a] ብዙ ሕዝብ አየ፤ እረኛ የሌላቸው በጎች እንደሆኑ[b] ራራላቸው። ብዙ ነገሮችንም ሊያስተምራቸው ጀመረ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በወጣ ጊዜ።” በአውዱ ከጀልባው ወደ የብስ መውጣቱን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: “እረኛ የሌላቸው በጎች” የሚለው ምስል ታማኝ መሪ ያጣን ሕዝብ የሚገልጸውን የመጽሐፍ ቅዱስ አነጋገር ያስተጋባል፤ ዘኍልቍ 27፥17፤ 1ኛ ነገሥት 22፥17፤ ሕዝቅኤል 34፥5ን ይመልከቱ።
    reason: cross_reference
lexical_decisions:
- source_word: ἐξελθὼν
  choice: ከጀልባውም በወጣ ጊዜ
  rationale: ቃሉ በቀጥታ ‘በወጣ ጊዜ’ ማለት ሲሆን፣ በማርቆስ 6፥32-33 ያለው የጀልባ አውድ ከጀልባው ወጥቶ ወደ የብስ መውረዱን ያመለክታል።
- source_word: πολὺν ὄχλον
  choice: ብዙ ሕዝብ
  rationale: በወንጌላት አጠቃቀም ὄχλος የተሰበሰበን ሕዝብ ያመለክታል፤ πολύν ደግሞ ብዛቱን ያጎላል።
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτοὺς
  choice: አዘነላቸው
  rationale: ግሱ ጥልቅ ርኅራኄንና ከውስጥ የሚነሣ ሐዘኔታን ያመለክታል፤ ‘አዘነላቸው’ በዘመናዊ አማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: ὡς πρόβατα μὴ ἔχοντα ποιμένα
  choice: እረኛ እንደሌላቸው በጎች
  rationale: የምንጩን የበጎችና የእረኛ ምሳሌያዊ ምስል ሳይፈታ በግልጽ አማርኛ ይጠብቃል።
- source_word: ἤρξατο διδάσκειν αὐτοὺς πολλά
  choice: ብዙ ነገርም ሊያስተምራቸው ጀመረ
  rationale: ἤρξατο የድርጊቱን መጀመር ያሳያል፤ πολλά የትምህርቱን ሰፊ ይዘት ‘ብዙ ነገር’ በማለት ይጠብቃል።
theological_decisions:
- issue: እረኛ የሌላቸው በጎች የሚለው የመሪነት ምስል
  choice: ምሳሌያዊውን አነጋገር በዋናው ጽሑፍ እንዳለ ማቆየት
  alternative: ‘መንፈሳዊ መሪ እንደሌላቸው’ ብሎ ትርጉሙን በዋናው ጽሑፍ ማስፋት
  rationale: ሐረጉ በብሉይ ኪዳን ያለውን የእግዚአብሔር ሕዝብና የመሪዎቹን ምስል ሊያስተጋባ ቢችልም፣ ትርጉሙ የምንጩን ሥነ ምሳሌ እንጂ አንድን የተወሰነ ትርጓሜ ሊያስገድድ አይገባም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የምንጩ ተከታታይ ድርጊቶችና የእረኛው ምስል ተጠብቀዋል።
