  yaml_path: translation/nt/mark/006/029.yaml
  text: And when his disciples heard[a], they came and took up his body and laid it in a tomb.
translation:
  language: am
  text: የዮሐንስ ደቀ መዛሙርትም ይህን በሰሙ ጊዜ መጥተው አስከሬኑን አንሥተው በመቃብር ውስጥ አኖሩት።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: ይህን በሰሙ ጊዜ
  rationale: የአኦሪስት አጋዥ ግሱን ጊዜያዊ ትርጉም በተፈጥሯዊ አማርኛ ያሳያል፤ ‘ይህን’ የሚለው ከአውዱ የተሰማውን የዮሐንስን ሞት ይጠቁማል።
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: የዮሐንስ ደቀ መዛሙርት
  rationale: μαθηταί በመደበኛነት ‘ደቀ መዛሙርት’ ነው። የግሪኩ αὐτοῦ ተውላጠ ስም በቅርብ አውድ ዮሐንስን ስለሚያመለክት፣ በአማርኛ ግልጽነት ስሙ ተደግሟል።
- source_word: ἦλθον
  choice: መጥተው
  rationale: ወደ አስከሬኑ ወዳለበት ስፍራ መድረሳቸውን በተፈጥሯዊ ትረካ ያሳያል።
- source_word: ἦραν
  choice: ወሰዱ
  rationale: αἴρω እዚህ ማንሳትንና ከስፍራው መውሰድን ይጨምራል፤ ‘ወሰዱ’ በቀብር አውድ ተፈጥሯዊና አጭር ነው።
- source_word: πτῶμα
  choice: አስከሬኑን
  rationale: πτῶμα በተለይ የሞተ ሰውን አካል ያመለክታል። ‘አስከሬን’ ይህን ትርጉም በትክክልና በክብር ያስተላልፋል።
- source_word: ἔθηκαν
  choice: አኖሩት
  rationale: τίθημι በዚህ የቀብር አውድ ‘ማኖር’ ማለት ሲሆን፣ አማርኛው ተፈጥሯዊና የተከበረ አገላለጽ ነው።
- source_word: ἐν μνημείῳ
  choice: በመቃብር ውስጥ
  rationale: μνημεῖον እዚህ የሙታን ማስቀመጫ የሆነ መቃብርን ያመለክታል፤ ‘በመቃብር ውስጥ’ የἐνን ስፍራዊ ኃይል ግልጽ ያደርጋል።
theological_decisions:
- issue: ‘ደቀ መዛሙርቱ’ የሚለው የማንን ደቀ መዛሙርት እንደሚያመለክት
  choice: የዮሐንስ ደቀ መዛሙርት
  alternative: የኢየሱስ ደቀ መዛሙርት
  rationale: በቅርብ አውድ የተተረከው የመጥምቁ ዮሐንስ መገደል ነው፤ የእርሱን አስከሬን ወስደው የቀበሩትም የዮሐንስ ደቀ መዛሙርት ናቸው።
