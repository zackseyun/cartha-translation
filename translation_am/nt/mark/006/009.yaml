review_pass:
  verdict: revise
  source_fidelity: The contrast, sandals, prohibition, and numeral are retained. The draft's finite construction ጫማ እንዲያደርጉ is less faithful to the Greek perfect participle with imperative force, which directs the disciples to be shod/wearing sandals. The wording for χιτῶνας should also be made explicitly plural.
  naturalness: ጫማ አድርገው is natural modern standard Amharic for being shod. ሁለት ቀሚሶች makes the two garments explicit and reads smoothly. The footnote alternative is recast idiomatically.
  terminology: ቀሚስ suitably represents the basic tunic in this context, while its plural form avoids obscuring the Greek plural. The footnote preserves the action-versus-state rendering distinction without imposing an interpretation.
  issues:
  - severity: medium
    issue: The wording ጫማ እንዲያደርጉ presents the sandal instruction as a purpose/subjunctive clause rather than the source's imperatival participial instruction.
    rationale: ὑποδεδεμένους is a perfect participle used with imperative force, expressing that they are to be shod. ጫማ አድርገው represents this more directly and naturally.
  - severity: low
    issue: ቀሚስ is singular despite the Greek plural χιτῶνας and the numeral δύο.
    rationale: Although singular count-noun use can occur in Amharic, ሁለት ቀሚሶች is clearer here and preserves the explicit plurality.
  - severity: low
    issue: The existing footnote alternative, ሁለት ቀሚስ ለብሰው እንዳይሆኑ, is awkward idiomatically.
    rationale: A direct stative alternative using እንዳይለብሱ is clearer, while the note itself can explain the possible state-of-wearing sense.
  revised_text: ነገር ግን ጫማ አድርገው፣ ሁለት ቀሚሶች እንዳይለብሱ[a]።
