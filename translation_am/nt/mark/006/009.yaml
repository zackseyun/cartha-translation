translation:
  language: am
  text: ነገር ግን ጫማ አድርገው፣ ሁለት ቀሚሶች እንዳይለብሱ[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ሁለት ቀሚሶችን እንዳይለብሱ።” የግሪኩ ግስ ልብስን የመልበስ ድርጊትን ወይም ለብሶ የመሆንን ሁኔታ ሊያመለክት ይችላል፤ ዋናው ጽሑፍ የመልበስን ድርጊት በቅርብ ያስቀምጣል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ነገር ግን
  rationale: ከቀደሙት የጉዞ መመሪያዎች ጋር ያለውን ንፅፅር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὑποδεδεμένους
  choice: ጫማ እንዲያደርጉ
  rationale: ፍጹም አንቀጽ ሆኖ በትእዛዛዊ ኃይል የቀረበውን ‘ጫማ አድርገው መሆን’ በተፈጥሯዊና ግልጽ አገላለጽ ያስተላልፋል።
- source_word: σανδάλια
  choice: ጫማ
  rationale: በዚህ የጥንት የጉዞ አውድ ሳንዳልን የሚያመለክት ቀላልና ለዘመናዊ አንባቢ የሚገባ ቃል ነው፤ የዘመኑን የጫማ ዓይነት በማያስፈልግ ሁኔታ አይገድብም።
- source_word: μὴ ἐνδύσησθε
  choice: እንዳይለብሱ
  rationale: μή ያለውን ከልካይ አወቃቀርና ራስን ልብስ የማልበስን ድርጊት በተፈጥሯዊ አማርኛ ያስተላልፋል፤ የድርጊትና የቆይታ ፍቺ ልዩነት በማስታወሻው ተጠብቋል።
- source_word: δύο
  choice: ሁለት
  rationale: ቁጥሩን በቀጥታ ያስተላልፋል።
- source_word: χιτῶνας
  choice: ቀሚስ
  rationale: በሰውነት ላይ የሚለበሰውን መሠረታዊ ልብስ ያመለክታል፤ ‘ሸሚዝ’ ከሚለው ዘመናዊ ቃል ይልቅ የጥንቱን አውድ በተሻለ ይጠብቃል።
