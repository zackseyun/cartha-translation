id: MRK.6.24
reference: Mark 6:24
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀καὶ ἐξελθοῦσα εἶπεν τῇ μητρὶ αὐτῆς· Τί ⸀αἰτήσωμαι; ἡ δὲ εἶπεν· Τὴν κεφαλὴν Ἰωάννου τοῦ ⸀βαπτίζοντος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/024.yaml
  text: And after going out, she said to her mother, “What should I ask for?” And she said, “The head of John the Baptizer.”
translation:
  language: am
  text: እርሷም ወጥታ እናቷን፣ “ምን ልለምን?” አለቻት። እናቷም፣ “የአጥማቂውን የዮሐንስን ራስ” አለቻት።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθοῦσα
  choice: ወጥታ
  rationale: የግሪኩ የአኦሪስት አሳታፊ ግስ ከዋናው ግስ በፊት የተፈጸመውን ድርጊት ያሳያል፤ ‘ወጥታ’ ቅደም ተከተሉን በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: Τί αἰτήσωμαι
  choice: ምን ልለምን?
  rationale: የምክክር ትርጉም ያለውን አኦሪስት መካከለኛ ንዑስ አንቀጽ በተፈጥሯዊ የአማርኛ ጥያቄ ይገልጻል።
- source_word: μητρὶ αὐτῆς
  choice: እናቷን
  rationale: ባለቤትነቱንና የንግግሩን ተቀባይ በአማርኛ በግልጽ ያሳያል።
- source_word: κεφαλήν
  choice: ራስ
  rationale: የተጠየቀውን ነገር ያለ ማለስለስ በቀጥታ ይተረጉማል።
- source_word: τοῦ βαπτίζοντος
  choice: አጥማቂው
  rationale: በስምነት የገባውን የአሁን ጊዜ አሳታፊ ግስ፣ ዮሐንስን በባሕርይው ተግባር የሚለይ መጠሪያ አድርጎ በትርጉም ያቀርባል።
theological_decisions:
- issue: የዮሐንስ መጠሪያ βαπτίζων አተረጓጎም
  choice: አጥማቂው
  alternative: መጥምቁ
  rationale: ‘አጥማቂው’ የግሪኩን አሳታፊ ግስ ትርጉም በግልጽ ያስተላልፋል፤ ‘መጥምቁ’ በአማርኛ የቤተ ክርስቲያን ወግ የተለመደ አማራጭ ቢሆንም የግሪኩን ተግባራዊ መጠሪያ በቀጥታ አያሳይም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። የግሪኩ የድርጊት ቅደም ተከተል ‘ወጥታ ... አለቻት’ በሚለው ተፈጥሯዊ አወቃቀር ተጠብቋል።
