source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Ὅπου ⸀ἐὰν εἰσέλθητε εἰς οἰκίαν, ἐκεῖ μένετε ἕως ἂν ἐξέλθητε ἐκεῖθεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/010.yaml
  text: And he was saying to them[a], “Wherever you enter a house, stay there until you leave that place.”
translation:
  language: am
  text: እንዲህም ይላቸው ነበር፦ “ወደ ማንኛውም ቤት ስትገቡ፣ ከዚያ ስፍራ እስክትወጡ ድረስ በዚያው ቆዩ።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “ከዚያ እስክትወጡ ድረስ።” የግሪኩ አባባል ቃል በቃል “ከዚያ እስክትወጡ” የሚል ነው፤ በዚህ ዐውድ ግን ከዚያ አካባቢ መሄድን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: ይላቸው ነበር
  rationale: የግሪኩ ያልተፈጸመ የግስ ቅርጽ በትረካው ውስጥ ቀጣይነት ወይም ድግግሞሽ ሊያመለክት ስለሚችል፣ ይህ አተረጓጎም ያንን ገጽታ በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: Ὅπου ἐὰν
  choice: በማንኛውም ስፍራ
  rationale: የተወሰነ ያልሆነውን ‘የትም/በማንኛውም ስፍራ’ የሚል አንጻራዊ ፍቺ ግልጽና ተፈጥሯዊ በሆነ አማርኛ ያስተላልፋል።
- source_word: εἰσέλθητε εἰς οἰκίαν
  choice: ወደ አንድ ቤት ስትገቡ
  rationale: εἰς የሚያመለክተውን ወደ ውስጥ የመግባት አቅጣጫ ‘ወደ’ በማለት ይጠብቃል፤ አገላለጹም በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: οἰκίαν
  choice: አንድ ቤት
  rationale: በዚህ ዐውድ ዋነኛው ሐሳብ የማደሪያ ሕንፃ ስለሆነ ‘ቤት’ የሚለው ቀጥተኛና ግልጽ ነው። ‘አንድ’ ያልተወሰነውን ቤት በተፈጥሯዊ አማርኛ ያመለክታል።
- source_word: ἐκεῖ μένετε
  choice: በዚያው ቆዩ
  rationale: ‘ቆዩ’ የμένωን መቆየት/መኖር ፍቺ ያስተላልፋል፤ ‘በዚያው’ ደግሞ በዚያ ቤት እንዲቆዩ የተሰጠውን ትእዛዝ ያጎላል።
- source_word: ἕως ἂν ἐξέλθητε ἐκεῖθεν
  choice: ከዚያ ስፍራ እስክትወጡ ድረስ
  rationale: በዐውዱ መሠረት ከአገልግሎቱ ስፍራ መውጣትን ያመለክታል፤ ሆኖም ἐκεῖθεν በቀጥታ ‘ከዚያ’ ሊተረጎም ስለሚችል ያ አማራጭ በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: በመውጫው ሐረግ ውስጥ የἐκεῖθεν ወሰን
  choice: ደቀ መዛሙርቱ ከዚያ ስፍራ እስኪወጡ ድረስ በዚያው ቤት እንዲቆዩ
  alternative: ከቤቱ እስኪወጡ ድረስ ብቻ እንዲቆዩ፣ ወይም ቃል በቃል ‘ከዚያ እስክትወጡ’
  rationale: የሚስዮናዊ ጉዞው ዐውድ ከቤት ወደ ቤት እንዳይዘዋወሩ፣ ከአካባቢው እስኪሄዱ ድረስ በተቀበላቸው ቤት እንዲቆዩ የሚሰጥ መመሪያ መሆኑን ይደግፋል። ይህ ዐውዳዊ ውሳኔ እንጂ የእምነት ልዩነትን የሚያስገባ አይደለም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ይላቸው ነበር’ የትረካውን ቀጣይ ገጽታ ይጠብቃል፤ ‘በዚያው’ የሚለው ደግሞ የአንድ ቤት ቆይታን በቀላሉ ያጎላል።
