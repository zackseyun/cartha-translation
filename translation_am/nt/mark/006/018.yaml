  text: ἔλεγεν γὰρ ὁ Ἰωάννης τῷ Ἡρῴδῃ ὅτι Οὐκ ἔξεστίν σοι ἔχειν τὴν γυναῖκα τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/018.yaml
  text: For John had been saying to Herod[a], “It is not lawful for you to have your brother’s wife.”
translation:
  language: am
  text: ዮሐንስ ሄሮድስን፣ “የወንድምህን ሚስት ማግባት አይፈቀድልህም[a]” ይለው ነበርና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የወንድምህን ሚስት ማግባት ሕጋዊ አይደለምልህ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: ይለው ነበር
  rationale: የግሪኩ ያልተፈጸመ የግስ ጊዜ በቀድሞው ጊዜ ቀጣይ ወይም ተደጋጋሚ የነበረን ንግግር ያመለክታል፤ ‘ይለው ነበር’ ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: γὰρ
  choice: ነበርና
  rationale: ከቀደመው አውድ ጋር ያለውን ምክንያታዊና ገላጭ ትስስር በአማርኛ የአረፍተ ነገር መጨረሻ ቅንብር ያሳያል።
- source_word: Ἡρῴδῃ
  choice: ሄሮድስን
  rationale: የግል ስሙን በተለመደው የአማርኛ አጻጻፍ ያቀርባል፤ የግሪኩ ተሳቢ ቅርጽ በ‘-ን’ ተገልጧል።
- source_word: Οὐκ ἔξεστίν σοι
  choice: ለአንተ ሕጋዊ አይደለም
  rationale: ἔξεστιν የተፈቀደውን ወይም ሕጋዊ የሆነውን ይገልጣል። በዚህ የጋብቻ ክልከላና የነቢያዊ ተግሣጽ አውድ ‘ሕጋዊ አይደለም’ የሞራልና የሕግ ክብደቱን ይጠብቃል።
- source_word: ἔχειν
  choice: ይዘህ መኖር
  rationale: ግሱ በቀጥታ ‘መያዝ/ያለው መሆን’ ማለት ቢሆንም፣ በጋብቻ አውድ ‘ይዘህ መኖር’ የሚለው ተፈጥሯዊ ሲሆን የቀጣይ ግንኙነቱንም ያሳያል፤ ‘ማግባት’ ብሎ ድርጊቱን ብቻ አያጠብብም።
- source_word: γυναῖκα
  choice: ሚስት
  rationale: γυνή ‘ሴት’ ወይም ‘ሚስት’ ሊሆን ይችላል፤ ‘የወንድምህን’ የሚለው ሐረግ እዚህ የጋብቻ ትርጉሙን ግልጽ ያደርጋል።
- source_word: τοῦ ἀδελφοῦ σου
  choice: የወንድምህን
  rationale: የዝምድና ግንኙነቱን በተፈጥሯዊ የአማርኛ ባለቤትነት ቅርጽ ያቀርባል።
theological_decisions:
- issue: የዮሐንስ ተግሣጽ ባሕርይ
  choice: ‘ለአንተ ሕጋዊ አይደለም’ በሚል የሕግና የሞራል ክልከላ ተተርጉሟል።
  alternative: ‘ለአንተ አልተፈቀደም’ ወይም ይበልጥ ለስላሳ በሆነ መንገድ ‘ትክክል አይደለም’ ማለት።
  rationale: ἔξεστιν ፈቃድንና ሕጋዊነትን ይመለከታል። አውዱ የዘሌዋውያንን የጋብቻ ክልከላ ሊያስተጋባ ቢችልም፣ ጥቅሱ በግልጽ ያልጠቀሰውን የሙሴ ሕግ ማብራሪያ በዋናው ጽሑፍ ላይ አልተጨመረም።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ እንዲሆን ተደርጓል። ‘ይለው ነበርና’ ቀጣይ የቀድሞ ድርጊትንና ከቀደመው አውድ ጋር ያለውን ምክንያታዊ ትስስር በተፈጥሯዊ አማርኛ ያጣምራል።
