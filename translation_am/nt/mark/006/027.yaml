  text: ንጉሡም ወዲያውኑ የሞት ፍርድ ፈጻሚውን[a] ልኮ፣ የዮሐንስን ራስ እንዲያመጣ አዘዘው። እርሱም ሄዶ በእስር ቤቱ የዮሐንስን ራስ ቆረጠ።
  philosophy: optimal-equivalence
  footnotes:
