  text: ἀπόλυσον αὐτούς, ἵνα ἀπελθόντες εἰς τοὺς κύκλῳ ἀγροὺς καὶ κώμας ἀγοράσωσιν ἑαυτοῖς ⸂τί φάγωσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/036.yaml
  text: Send them away[a], so that they may go into the surrounding countryside and villages and buy themselves something to eat.
translation:
  language: am
  text: ሕዝቡን አሰናብት፤ በዙሪያው ወደሚገኙ ገጠራማ ስፍራዎችና መንደሮች ሄደው ለራሳቸው የሚበሉትን እንዲገዙ።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ «ሕዝቡን አሰናብት፤ በዙሪያው ወደሚገኙ ገጠራማ ስፍራዎችና መንደሮች ሄደው ለራሳቸው የሚበሉትን ይግዙ።»
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόλυσον αὐτούς
  choice: ሕዝቡን ስደዳቸው
  rationale: በዚህ አውድ ἀπολύω ሰዎቹ ከቦታው እንዲሄዱ መልቀቅን ወይም መላክን ያመለክታል። «ስደዳቸው» የትእዛዙን ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል፤ αὐτούς በአውዱ የተጠቀሰውን ሕዝብ ስለሚያመለክት «ሕዝቡን» ተጨምሯል።
- source_word: ἵνα
  choice: እንዲ…
  rationale: የዓላማ ንዑስ አረፍተ ነገሩን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἀπελθόντες
  choice: ሄደው
  rationale: የቀደመ ድርጊትንና ቅደም ተከተሉን ይጠብቃል፤ መጀመሪያ ይሄዳሉ፣ ከዚያም ይገዛሉ።
- source_word: τοὺς κύκλῳ ἀγροὺς καὶ κώμας
  choice: በዙሪያው ወዳሉት ገጠሮችና መንደሮች
  rationale: κύκλῳ «በዙሪያው» የሚለውን፣ ἀγροί ደግሞ በዚህ አውድ የገጠር ስፍራዎችን ያመለክታሉ። κῶμαι «መንደሮች» ተብሏል።
- source_word: ἀγοράσωσιν
  choice: እንዲገዙ
  rationale: በገንዘብ ምግብ ማግኘትን የሚገልጽ ግልጽና ወቅታዊ ቃል ነው።
- source_word: ἑαυτοῖς τί φάγωσιν
  choice: ለራሳቸው የሚበሉትን
  rationale: ἑαυτοῖς ያለውን ለራሳቸው የመጥቀም አጽንዖት ይጠብቃል፤ τί φάγωσιν የሚበሉትን ነገር፣ ማለትም ምግብን፣ በተፈጥሯዊ አማርኛ ያስተላልፋል።
