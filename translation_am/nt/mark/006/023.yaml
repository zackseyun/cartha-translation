  text: καὶ ὤμοσεν ⸀αὐτῇ· ⸂Ὅ τι⸃ ἐάν με αἰτήσῃς δώσω σοι ἕως ἡμίσους τῆς βασιλείας μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/023.yaml
  text: And he swore to her[a], “Whatever you ask me, I will give you[b], up to half of my kingdom.”
translation:
  language: am
  text: እርሱም ለእርሷ ማለለት፦ “ከእኔ የምትጠይቂኝን ማንኛውንም ነገር[a]፣ እስከ መንግሥቴ ግማሽ ድረስ እሰጥሻለሁ[b]።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከእኔ የምትጠይቂኝን ሁሉ።”
    reason: lexical_alternative
  - marker: b
    text: “እስከ መንግሥቴ ግማሽ ድረስ” የሚለው በንጉሣዊ ንግግር የተለመደ የተጋነነ የልግስና ቃል ነው።
    reason: cultural_note
lexical_decisions:
- source_word: ὤμοσεν
  choice: ማለላት
  rationale: የግሪኩ ግስ መሐላ መፈጸምን ያመለክታል፤ “ማለላት” በዐውዱ ውስጥ ተፈጥሯዊና ግልጽ ነው።
- source_word: αὐτῇ
  choice: ላት
  rationale: የሴት ነጠላ ተቀባይን የሚያመለክተውን ዳቲቭ በአማርኛው ግስ ላይ በተዋሐደ ቅጥያ ይገልጻል።
- source_word: Ὅ τι ἐάν με αἰτήσῃς
  choice: የጠየቅሽኝን ማንኛውንም ነገር
  rationale: ያልተወሰነውንና ሰፊውን “whatever” አገላለጽ ይጠብቃል፤ የተናጋሪውና የተጠያቂው ግንኙነትም በግስ ቅጥያዎች ግልጽ ነው።
- source_word: δώσω σοι
  choice: እሰጥሻለሁ
  rationale: የወደፊት ተስፋውንና ለሴቲቱ መስጠቱን በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἕως ἡμίσους
  choice: እስከ … እኩሌታ ድረስ
  rationale: ἕως እዚህ የጊዜ ሳይሆን የመጠን ገደብን ያመለክታል፤ አገላለጹም “እስከ ግማሽ” የሚለውን ትርጉም በክብር ያቀርባል።
- source_word: τῆς βασιλείας μου
  choice: መንግሥቴ
  rationale: በዚህ የንጉሣዊ ንግግር ዐውድ βασιλεία በቀጥታ የግዛት ክልልን “መንግሥት” ብሎ መተርጎም ተፈጥሯዊ ነው፤ ልዩ ሥነ መለኮታዊ ትርጉም አይጨምርም።
theological_decisions:
- issue: በሄሮድስ ንግግር ውስጥ የβασιλεία ትርጉም
  choice: መንግሥት
  alternative: አገዛዝ፣ ንጉሣዊ ሥልጣን
  rationale: ቃሉ አገዛዝን ወይም ሥልጣንን ሊያመለክት ቢችልም፣ በዚህ የተጋነነ ንጉሣዊ ቃል ኪዳን ውስጥ “መንግሥት” የተሻለው ዐውዳዊ አቻ ነው።
translation_notes:
  register: ዘመናዊ፣ ግልጽና የተከበረ አማርኛ ተጠቅሟል። ቀጥተኛው ንግግር የመሐላውን ክብደትና የተጋነነውን ንጉሣዊ ተስፋ ይጠብቃል። የማስታወሻ ምልክቶቹ ከሚያብራሯቸው ሐረጎች ጋር ተቀምጠዋል።
