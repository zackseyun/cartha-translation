  naturalness: The revised wording uses idiomatic modern standard Amharic, with a clear oath formula and a natural prospective relative clause.
  terminology: መንግሥቴ and ግማሽ faithfully render βασιλείας μου and ἡμίσους. ማለለት is retained for taking an oath; it does not reduce the solemn force to merely 'saying.'
