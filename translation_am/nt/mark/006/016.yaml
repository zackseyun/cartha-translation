    issue: The translation adds “ከሙታን” in the direct speech.
    rationale: ἠγέρθη means “was raised/has been raised,” but the Greek text of Mark 6:16 does not include “from the dead.” The addition should be omitted to maintain source-level fidelity.
  - severity: low
    issue: “አንገቱን ያስቆረጥኩት” is less precise for ἀπεκεφάλισα.
    rationale: The Greek verb means to behead. In Amharic, referring to the head (ራስ) rather than the neck (አንገት) conveys this more precisely.
  - severity: low
