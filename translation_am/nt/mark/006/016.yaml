  text: 'ሄሮድስ ግን ይህን በሰማ ጊዜ፣ “እኔ ራሱን ያስቈረጥኩት ዮሐንስ ነው፤ እርሱ ተነሥቷል” ይል ነበር።[a][b]


    [a] “ይል ነበር” የሚለው “አለ” ተብሎም ሊተረጎም ይችላል፤ የግሪኩ ግስ ቀጣይነት ወይም ድግግሞሽ ሊያመለክት ይችላል።


    [b] “ተነሥቷል” የሚለው በግሪክ ተደራጊ ቅርጽ ነው። “ተነሣ” ወይም “ተነሥቶአል” ተብሎም ሊገለጽ ይችላል።'
  philosophy: optimal-equivalence
