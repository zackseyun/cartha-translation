source:
  edition: SBLGNT
  text: καὶ ⸂ὃς ἂν τόπος μὴ δέξηται⸃ ὑμᾶς μηδὲ ἀκούσωσιν ὑμῶν, ἐκπορευόμενοι ἐκεῖθεν ἐκτινάξατε τὸν χοῦν τὸν ὑποκάτω τῶν ποδῶν ὑμῶν εἰς μαρτύριον ⸀αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/011.yaml
  text: And whatever place does not receive you or listen to you, as you leave there, shake off the dust that is under your feet as a testimony against them.
translation:
  language: am
  text: ማንኛውም ስፍራ እናንተን ባይቀበል ወይም ባይሰማችሁ፣ ከዚያ ስትወጡ ከእግሮቻችሁ በታች ያለውን ትቢያ ለእነርሱ ምስክር እንዲሆን[a] አራግፉ[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በእነርሱ ላይ ምስክር እንዲሆን።” ግሪኩ በቀጥታ “ለእነርሱ ምስክር” ይላል፤ ሆኖም ዐውዱ መልእክቱን በሚቃወሙት ላይ የሚሆን ምስክር መሆኑን ሊያመለክት ይችላል።
    reason: alternative_reading
  - marker: b
    text: ከእግሮች ላይ ትቢያን ማራገፍ ተቀባይነት ማጣትን ተከትሎ መለየትንና ማስጠንቀቅን የሚያሳይ ምልክታዊ ድርጊት ነበር።
    reason: cultural_note
lexical_decisions:
- source_word: ὃς ἂν τόπος
  choice: ስፍራ ቢኖር
  rationale: የግሪኩን አጠቃላይና ያልተወሰነ አገላለጽ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ τόπος የሚለውንም ግልጽ ስም ይጠብቃል።
- source_word: δέξηται
  choice: የማይቀበል
  rationale: መልእክተኞቹን በእንግድነት መቀበልን ጨምሮ የግሪኩን ሰፊ ትርጉም ይጠብቃል።
- source_word: ἀκούσωσιν ὑμῶν
  choice: የማይሰማችሁ
  rationale: ከተራ ድምፅ መስማት በላይ ለመልእክታቸው ጆሮ መስጠትን በዐውዱ ያመለክታል፤ ‘የማይታዘዛችሁ’ ከሚለው ያነሰ ትርጓሜያዊ ነው።
- source_word: ἐκπορευόμενοι ἐκεῖθεν
  choice: ከዚያ ስትወጡ
  rationale: የአሳታፊውን ጊዜያዊ ኃይልና የድርጊቱን ቅደም ተከተል በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἐκτινάξατε
  choice: አራግፉ
  rationale: ትቢያን ከእግር ላይ በማራገፍ ማስወገድን በትክክልና በተለመደ አማርኛ ይገልጻል።
- source_word: τὸν χοῦν τὸν ὑποκάτω τῶν ποδῶν ὑμῶν
  choice: ከእግሮቻችሁ በታች ያለውን ትቢያ
  rationale: ὑποκάτω የሚለውን ግልጽ የቦታ አገላለጽ ጠብቆ በሚነበብ አማርኛ ያቀርባል።
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: ለእነርሱ ምስክር እንዲሆን
  rationale: αὐτοῖς የሚለውን የመዳረሻ ቅርጽ በቅርብ ይከተላል፤ በዐውዱ ያለው የማስጠንቀቂያ ወይም የተቃውሞ ኃይል በማስታወሻ ይገለጻል እንጂ በዋናው ጽሑፍ አሻሚነቱ አይወገድም።
theological_decisions:
- issue: የእግርን ትቢያ የማራገፉ ምልክት ኃይል
  choice: ለእነርሱ ምስክር እንዲሆን
  alternative: በእነርሱ ላይ ምስክር እንዲሆን
  rationale: εἰς μαρτύριον αὐτοῖς በቀጥታ ‘ለእነርሱ ምስክር’ ሊባል ይችላል፤ የመልእክቱ ውድቅ መደረግና ምልክታዊው ድርጊት ግን ተቃዋሚ ወይም የፍርድ ኃይል ሊያመለክቱ ይችላሉ። ዋናው ጽሑፍ የግሪኩን ቅርጽና አሻሚነት ይጠብቃል፤ ዐውዳዊው አማራጭ በማስታወሻ ተቀምጧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የዐረፍተ ነገሩ ቅደም ተከተል ተፈጥሯዊ እንዲሆን ተስተካክሎ፣ የምንጩ ትርጉማዊ ግንኙነቶችና በμαρτύριον αὐτοῖς ያለው አሻሚነት ተጠብቀዋል።
