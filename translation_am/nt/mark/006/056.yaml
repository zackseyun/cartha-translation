source:
  edition: SBLGNT
  text: καὶ ὅπου ἂν εἰσεπορεύετο εἰς κώμας ἢ ⸂εἰς πόλεις ἢ εἰς⸃ ἀγροὺς ἐν ταῖς ἀγοραῖς ⸀ἐτίθεσαν τοὺς ἀσθενοῦντας, καὶ παρεκάλουν αὐτὸν ἵνα κἂν τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ ἅψωνται· καὶ ὅσοι ἂν ⸀ἥψαντο αὐτοῦ ἐσῴζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/056.yaml
  text: And wherever he entered villages or cities or countryside[a], they were laying the sick in the marketplaces and begged him that they might even touch the fringe of his garment[c][b]; and as many as touched it were being healed.
translation:
  language: am
  text: እርሱም ወደ መንደሮች፣ ወደ ከተሞች ወይም ወደ ገጠር በገባበት ሁሉ፣ ሕመምተኞችን በገበያ አደባባዮች ያስቀምጡ ነበር፤ የልብሱን ጫፍ[a] እንኳ እንዲነኩ ይለምኑትም ነበር። የነኩትም ሁሉ ይፈወሱ ነበር።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ጫፍ” ተብሎ የተተረጎመው የግሪክ ቃል የልብስ ዳርቻ ወይም ጫፍ ማለት ሊሆን ይችላል፤ በአይሁድ አውድ ከልብስ ጫፍ ጋር የሚያያዝ ጥልፍ ወይም ጉንጉን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “ይድኑ ነበር።” እዚህ የግሪኩ ግሥ ከሕመም መፈወስን ወይም መመለስን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἂν
  choice: በገባበት ሁሉ
  rationale: ὅπου ከἄν ጋር ያለውን አጠቃላይና ያልተወሰነ የቦታ ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: κώμας ... πόλεις ... ἀγρούς
  choice: መንደሮች፣ ከተሞች ... ገጠር
  rationale: ሦስቱን የሰፈራና የአካባቢ ዓይነቶች ይለያል፤ ἀγρούς በዚህ ዝርዝር ውስጥ ነጠላ እርሻዎችን ሳይሆን የገጠር አካባቢን ያመለክታል።
- source_word: ἐν ταῖς ἀγοραῖς
  choice: በገበያ አደባባዮች
  rationale: ἀγορά ገበያንም ሆነ ሕዝባዊ አደባባይን ሊያመለክት ስለሚችል፣ ይህ አገላለጽ ሁለቱንም ገጽታዎች በግልጽ ያቀርባል።
- source_word: ἐτίθεσαν
  choice: ያስቀምጡ ነበር
  rationale: ያልተጠናቀቀው የግሥ ቅርጽ ተደጋጋሚ ልማዳዊ ድርጊትን ያሳያል፤ በአማርኛ ‘ነበር’ ያለው አገላለጽ ይህን ይጠብቃል።
- source_word: παρεκάλουν
  choice: ይለምኑትም ነበር
  rationale: በፈውስ አውድ ያለውን አጥብቆ የመለመን ስሜትና ተደጋጋሚነት ይገልጣል።
- source_word: ἵνα κἂν ... ἅψωνται
  choice: እንኳ እንዲነኩ
  rationale: κἄν የሚገልጠውን ‘ቢያንስ/እንኳ’ የሚል ዝቅተኛ ጥያቄ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ
  choice: የልብሱን ዘርፍ
  rationale: κράσπεδον የልብስን ጫፍ፣ ዳርቻ ወይም ዘርፍ/ሹራብ ሊያመለክት ይችላል፤ ‘ዘርፍ’ በዋናው ጽሑፍ ውስጥ አሻሚነቱን በመጠኑ ይጠብቃል።
- source_word: ἥψαντο αὐτοῦ
  choice: የነኩት
  rationale: የግሪኩ αὐτοῦ ቀጥተኛ ማጣቀሻ እርሱን ነው፤ የአማርኛው ‘የነኩት’ ይህን ይጠብቃል፣ ቀዳሚው ዐረፍተ ነገርም መንካቱ በልብሱ ዘርፍ በኩል እንደሆነ ያሳያል።
- source_word: ἐσῴζοντο
  choice: ይፈወሱ ነበር
  rationale: σῴζω ‘ማዳን’፣ ‘ማድን’ ወይም ‘መፈወስ’ ሊል ይችላል፤ በሕመምተኞች ፈውስ አውድ ውስጥ ‘ይፈወሱ ነበር’ የቅርብ ትርጉሙንና የግሡን ተደጋጋሚ ገጽታ ያቀርባል።
theological_decisions:
- issue: የἐσῴζοντο (σῴζω) አተረጓጎም
  choice: ይፈወሱ ነበር
  alternative: ይድኑ ነበር
  rationale: σῴζω ሰፊ የማዳን ትርጉም ቢኖረውም፣ በዚህ ቅርብ አውድ የታመሙ ሰዎች አካላዊ ፈውስ ነው የተጠቀሰው። ዋናው ጽሑፍ ‘ይፈወሱ’ ይላል፤ የግሪኩ ሰፊ ትርጉም ግን በማስታወሻ ተጠብቋል።
- issue: የκράσπεδον የአይሁድ ልብስ አውድ
  choice: የልብሱን ዘርፍ
  alternative: የልብሱን ጫፍ / የልብሱን ሹራብ
  rationale: ጽሑፉ ልዩ ሥርዓታዊ ትርጉምን በግድ አይወስንም። ‘ዘርፍ’ የልብሱን ዳርቻ ያመለክታል፣ የሹራብ ማጣቀሻ ሊኖር እንደሚችልም በማስታወሻ ይገለጣል።
