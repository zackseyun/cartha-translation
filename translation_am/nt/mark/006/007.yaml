  yaml_path: translation/nt/mark/006/007.yaml
  text: And he called the Twelve and began to send them out two by two[c][b][a], and he was giving them authority over the unclean spirits.
translation:
  language: am
  text: 'አሥራ ሁለቱን ጠራ፤ ሁለት ሁለት አድርጎ[a] ሊልካቸው ጀመረ፤ በርኩሳን መናፍስት ላይ ሥልጣን[b] ይሰጣቸው ነበር።


    [a] ወይም፣ «ጥንድ ጥንድ አድርጎ።»


    [b] ወይም፣ «በርኩሳን መናፍስት ላይ ኃይል።»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ጥንድ ጥንድ አድርጎ።»
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «በርኩሳን መናፍስት ላይ ኃይል።»
    reason: alternative_reading
lexical_decisions:
- source_word: προσκαλεῖται
  choice: ወደ እርሱ ጠርቶ
  rationale: የግሪኩ መካከለኛ ድምፅ እነርሱን ወደ ራሱ መጥራቱን ሊያመለክት ስለሚችል ይህ አተረጓጎም ያንን ልዩነት በተፈጥሯዊ አማርኛ ያስቀምጣል። ታሪካዊው የአሁን ጊዜ ቅርጽ ከሚከተለው ያለፈ ጊዜ ጋር እንዳይጋጭ በተከታታይ ትረካ የያለፈ ጊዜ ሆኖ ተተርጉሟል።
- source_word: τοὺς δώδεκα
  choice: አሥራ ሁለቱን
  rationale: በዐውዱ የኢየሱስን የታወቀ ቡድን የሚጠቁም ስያሜ ነው፤ «ደቀ መዛሙርት» የሚለውን በግልጽ ያልተጠቀሰ ቃል አይጨምርም።
- source_word: ἤρξατο ... ἀποστέλλειν
  choice: ሊልካቸው ጀመረ
  rationale: የἄρχομαι ከማያልቅ ግስ ጋር ያለውን «መጀመር» በተፈጥሯዊ አማርኛ ይገልጣል፤ ወደ ተልእኮ መላክን ያሳያል።
- source_word: δύο δύο
  choice: ሁለት ሁለት አድርጎ
  rationale: የግሪኩን ተደጋጋሚ አከፋፋይ አገላለጽና ምት ይጠብቃል፤ «ጥንድ ጥንድ» የሚለው ተፈጥሯዊ አማራጭ በማስታወሻ ቀርቧል።
- source_word: ἐδίδου
  choice: ይሰጣቸው ነበር
  rationale: ያልተፈጸመው የግሪክ ጊዜ ቅርጽ የቀጣይነት ወይም ከመላኩ ጋር አብሮ የተከናወነ ድርጊት መሆኑን ይጠብቃል።
- source_word: ἐξουσίαν
  choice: ሥልጣን
  rationale: በዚህ ዐውድ ጥሬ ኃይልን ብቻ ሳይሆን ከኢየሱስ የተሰጠ የመግዛትና የመፈጸም ሥልጣንን በተሻለ ሁኔታ ይገልጣል።
- source_word: τῶν πνευμάτων τῶν ἀκαθάρτων
  choice: በርኩሳን መናፍስት ላይ
  rationale: የማርቆስን «ርኩሳን መናፍስት» የሚለውን ቃል በቀጥታ ይጠብቃል፤ «አጋንንት» በማለት የጽሑፉን አገላለጽ አያጠብም።
