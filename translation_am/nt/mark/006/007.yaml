  choice: በርኩሳን መናፍስት ላይ የተሰጠ ሥልጣን
  alternative: በርኩሳን መናፍስት ላይ ኃይል
  rationale: «ሥልጣን» ኢየሱስ ለአሥራ ሁለቱ በውክልና የሰጣቸውን የመፈጸም መብትና ችሎታ ይጠብቃል፤ «ኃይል» ግን ትርጉሙን ወደ ጥሬ ችሎታ ሊያጠብ ይችላል።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ ነው። «ርኩሳን መናፍስት» የተለመደውን መጽሐፍ ቅዱሳዊ አገላለጽ ይጠብቃል፤ ነገር ግን አጠቃላይ የአረፍተ ነገሩ አወቃቀር የአሁኑን መደበኛ አማርኛ ይከተላል።
