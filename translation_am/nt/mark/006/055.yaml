base_translation:
  language: en
  yaml_path: translation/nt/mark/006/055.yaml
  text: They ran throughout that whole region and began carrying those who were sick on mats to wherever they heard he was[a].
translation:
  language: am
  text: ያንን አካባቢ ሁሉ ሮጠው ዳሰሱ፤ እርሱ እዚያ አለ ብለው ወደ ሰሙበት ቦታ ሁሉ፣ የታመሙትን በምንጣፎች[a] ተሸክመው መውሰድ ጀመሩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በቀላል አልጋዎች” ወይም “በመኝታ ምንጣፎች።” የግሪኩ ቃል ተሸክሞ ለመውሰድ የሚቻል ቀላል መኝታን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: περιέδραμον
  choice: በሩጫ ዞሩ
  rationale: የግሱን ፈጣን እንቅስቃሴና በአካባቢው ሁሉ መዘዋወር በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ὅλην τὴν χώραν ἐκείνην
  choice: ያንን አካባቢ ሁሉ
  rationale: χώρα በዚህ አውድ ዘመናዊ አገርን ሳይሆን ዙሪያውን አውራጃ ወይም ክልል ያመለክታል፤ ይህ አገላለጽ ὅλην እና ἐκείνηνንም ይጠብቃል።
- source_word: ἤρξαντο ... περιφέρειν
  choice: ተሸክመው መውሰድ ጀመሩ
  rationale: ἤρξαντο የድርጊቱን መጀመር ያሳያል፤ περιφέρειν ደግሞ በዐውዱ የታመሙትን ከስፍራ ወደ ስፍራ ተሸክሞ መውሰድን ያመለክታል።
- source_word: ἐπὶ τοῖς κραβάττοις
  choice: በተንቀሳቃሽ አልጋዎች
  rationale: κράβαττος ቀላልና ተሸክሞ ለመውሰድ የሚቻል መኝታ ነው። ‘ተንቀሳቃሽ አልጋ’ በዘመናዊ አማርኛ ግልጽ ሲሆን የቃሉን ሰፊ ትርጉም ይጠብቃል።
- source_word: τοὺς κακῶς ἔχοντας
  choice: የታመሙትን
  rationale: የግሪኩ ፈሊጣዊ አገላለጽ በዚህ ዐውድ ሕመምተኞችን ያመለክታል፤ ይህም አጭርና ተፈጥሯዊ ነው።
- source_word: ὅπου ἤκουον ὅτι ἐστίν
  choice: እርሱ አለ ብለው ወደ ሰሙበት ስፍራ ሁሉ
  rationale: ὅπου በዐውዱ መድረሻን ያሳያል፤ ἐστίν ያለውን የአሁን ጊዜ አኳኋን ‘አለ’ በማለት ጠብቆ የተዘገበውን ዜና በተፈጥሯዊ አማርኛ ያቀርባል።
