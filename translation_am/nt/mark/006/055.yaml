review_pass:
  verdict: revise
  source_fidelity: 'The draft retains the principal sense of the Greek: rapid movement throughout the whole district, the onset of carrying sick people, and taking them to each place where reports located Jesus. However, “ተንቀሳቃሽ አልጋዎች” can suggest mechanically movable beds rather than the simple portable bedding denoted by κράβαττοι, and the destination clause is awkwardly ordered in Amharic.'
  naturalness: “በሩጫ ዞሩ” is understandable, but “ሮጠው ዳሰሱ” naturally conveys running throughout an area. Recasting the final clause as “እርሱ እዚያ አለ ብለው ወደ ሰሙበት ቦታ ሁሉ” makes the reported-location sense clear and idiomatic.
  terminology: “ምንጣፎች” is a suitable primary rendering for κράβαττοι in this context. The note preserves “ቀላል አልጋዎች” as a legitimate alternative and explains the portable-bedding sense without overstating the precise object.
  issues:
  - severity: medium
    issue: “ተንቀሳቃሽ አልጋዎች” is an imprecise rendering of κραβάττοι.
    rationale: The expression commonly evokes mobile or adjustable beds in modern Amharic. The Greek refers to simple mats, pallets, or cots used as portable bedding.
  - severity: low
    issue: The wording of the reported-location clause is unnatural.
    rationale: “እርሱ አለ ብለው ወደ ሰሙበት” is intelligible but has strained word order. Adding “እዚያ” and placing the clause immediately before “ወደ ... ቦታ” clarifies the destination.
  revised_text: ያንን አካባቢ ሁሉ ሮጠው ዳሰሱ፤ እርሱ እዚያ አለ ብለው ወደ ሰሙበት ቦታ ሁሉ፣ የታመሙትን በምንጣፎች[a] ተሸክመው መውሰድ ጀመሩ።
  revised_footnotes:
  - marker: a
    text: ወይም፣ “በቀላል አልጋዎች” ወይም “በመኝታ ምንጣፎች።” የግሪኩ ቃል ተሸክሞ ለመውሰድ የሚቻል ቀላል መኝታን ያመለክታል።
    reason: lexical_alternative
  revision_rationale: The revision replaces a potentially misleading modern term for portable bedding, improves the natural Amharic flow of the final location clause, and retains the Greek’s distributive “wherever” and ingressive “began.”
