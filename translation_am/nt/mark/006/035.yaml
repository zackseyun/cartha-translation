id: MRK.6.35
reference: Mark 6:35
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Καὶ ἤδη ὥρας πολλῆς γενομένης προσελθόντες αὐτῷ οἱ μαθηταὶ αὐτοῦ ⸀ἔλεγον ὅτι Ἔρημός ἐστιν ὁ τόπος, καὶ ἤδη ὥρα πολλή·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/035.yaml
  text: And when it was already very late[a], his disciples came to him and were saying, “This place is deserted[b], and it is already very late.”
translation:
  language: am
  text: ቀኑም አስቀድሞ እጅግ መሽቶ ነበር፤ ደቀ መዛሙርቱም ወደ እሱ ቀርበው፣ “ይህ ቦታ ሰው የማይኖርበት ነው፤ ቀኑም አስቀድሞ እጅግ መሽቷል” ይሉት ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥρας πολλῆς γενομένης
  choice: ቀኑም እጅግ መሽቶ ነበር
  rationale: የግሪኩ ጄኒቲቭ አብሶሉት የቀኑን እጅግ መምሸት ይገልጻል፤ ይህ አተረጓጎም በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: προσελθόντες αὐτῷ
  choice: ወደ እሱ ቀርበው
  rationale: ወደ አንድ ሰው መቅረብን በቀጥታና በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ደቀ መዛሙርቱ
  rationale: በአማርኛ የተለመደውን የባለቤትነት ቅጽ ይጠቀማል።
- source_word: ἔλεγον
  choice: ይሉት ነበር
  rationale: ያለፈ ጊዜ ቀጣይ ድርጊትን የሚያመለክተውን የግሪኩን ኢምፐርፌክት ገጽታ ይጠብቃል፤ ድግግሞሽን አያስገድድም።
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: ይህ ቦታ ሰው የማይኖርበት ነው
  rationale: ἔρημος እዚህ ሰው የማይኖርበትን ወይም ከሰፈር የራቀን ስፍራ ያመለክታል፤ ‘በረሃ’ ብሎ የመሬቱን አይነት ከሚወስን ትርጉም ይልቅ ይህ ሐረግ የትርጉሙን ስፋት ይጠብቃል።
- source_word: καὶ ἤδη ὥρα πολλή
  choice: ቀኑም እጅግ መሽቷል
  rationale: የጊዜውን መግፋትና πολλή የሚሰጠውን አጽንዖት በተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions: []
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ሰው የማይኖርበት’ የሚለው አገላለጽ ስፍራው ደረቅ በረሃ እንደሆነ ሳይወስን የἔρημοςን ዐውዳዊ ትርጉም ያስተላልፋል።
