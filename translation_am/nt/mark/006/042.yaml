  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφαγον
  choice: በሉ
  rationale: የἐσθίω የአኦሪስት አድራጊ ቅርጽ ሲሆን ተራውን የመብላት ተግባር ያመለክታል። «በሉ» በዘመናዊ አማርኛ ቀጥተኛና ተፈጥሯዊ አቻ ነው።
- source_word: πάντες
  choice: ሁሉም
  rationale: በዐውዱ ያለውን ሕዝብ በሙሉ የሚያመለክት በስም ፋንታ የቆመ ብዙ ቁጥር ቅጽል ነው። «ሁሉም» ሁሉን አቀፍነቱን በግልጽ ይጠብቃል።
- source_word: ἐχορτάσθησαν
  choice: ጠገቡ
  rationale: የχορτάζω ተደራጊ ቅርጽ ሲሆን ሙሉ በሙሉ መመገብንና መርካትን ያመለክታል። «ጠገቡ» በምግብ ዐውድ ይህን ውጤት በተፈጥሯዊና አጭር አማርኛ ያስተላልፋል።
- source_word: καὶ ... καὶ
  choice: …፤ …ም
  rationale: የተደገመው καί ሁለቱን ድርጊቶች በቀጥታ ያስተባብራል። በአማርኛ የመጀመሪያውን καί በትረካ ቅደም ተከተልና በሥርዓተ ነጥብ መግለጽ፣ ሁለተኛውንም በ«-ም» ማስተሳሰር ተፈጥሯዊ ሲሆን የማርቆስን ቀላል ትስስር ይጠብቃል።
