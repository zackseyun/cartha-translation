source:
  edition: SBLGNT
  text: Αὐτὸς γὰρ ὁ Ἡρῴδης ἀποστείλας ἐκράτησεν τὸν Ἰωάννην καὶ ἔδησεν αὐτὸν ἐν φυλακῇ διὰ Ἡρῳδιάδα τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ, ὅτι αὐτὴν ἐγάμησεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/017.yaml
  text: For Herod himself had sent and seized John[a], and bound him in prison because of Herodias, the wife of Philip his brother[b], because he had married her.
translation:
  language: am
  text: ሄሮድስ ራሱ ልኮ ዮሐንስን አስይዞ በወኅኒ አስሮት ነበር፤ ምክንያቱም የወንድሙ የፊልጶስ ሚስት የሆነችውን ሄሮድያዳን አግብቶ ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αὐτὸς γὰρ ὁ Ἡρῴδης
  choice: ሄሮድስ ራሱ
  rationale: Αὐτός የሚሰጠውን አጽንዖት ‘ራሱ’ ያስቀምጣል፤ γάρ ከቀደመው ትረካ ጋር ያለው ማብራሪያዊ ግንኙነት በአማርኛው ዐውድና በመጨረሻው ‘ነበርና’ በተፈጥሯዊ ሁኔታ ተገልጧል።
- source_word: ἀποστείλας ἐκράτησεν
  choice: ሰዎችን ልኮ … አስይዞት
  rationale: ቀድሞ የተፈጸመውን ‘ልኮ’ እና ሄሮድስ በወኪሎቹ አማካይነት ዮሐንስን እንዳስያዘ የሚያመለክተውን አድራጊ ግስ ‘አስይዞት’ በመጠቀም የግሪኩ ትርጉም ተፈጥሯዊ በሆነ አማርኛ ተሰጥቷል።
- source_word: ἔδησεν αὐτὸν ἐν φυλακῇ
  choice: በወኅኒ አስሮት
  rationale: δέω የሚያመለክተውን ማሰር ሳይጨምር ይጠብቃል፤ φυλακή በዚህ ዐውድ የእስር ቦታ ስለሆነ ‘ወኅኒ’ ተመርጧል።
- source_word: διὰ Ἡρῳδιάδα
  choice: በሄሮድያዳ ምክንያት
  rationale: διά ከተሳቢ አገባብ ጋር የሚገልጠውን ምክንያት በግልጽ እና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ
  choice: የወንድሙ የፊልጶስ ሚስት በነበረችው
  rationale: γυνή በዚህ የዝምድና አገባብ ‘ሚስት’ ማለት ነው። ‘በነበረችው’ የሚለው ሄሮድስ ባገባት ጊዜ ከፊልጶስ ጋር የነበራትን የጋብቻ ግንኙነት ዐውዱን ሳይቀይር በግልጽ ያቀርባል።
- source_word: ὅτι αὐτὴν ἐγάμησεν
  choice: እርሷን አግብቶአት ነበርና
  rationale: γαμέω ‘ማግባት’ ተብሎ ተተርጉሟል፤ የአማርኛው ያለፈ ድርጊት አገባብ ይህ ጋብቻ የዮሐንስን እስር እንዳስከተለ ያሳያል፣ ‘-ና’ም የὅτιን ምክንያታዊ ኃይል ይጠብቃል።
theological_decisions:
- issue: የሄሮድስን ጋብቻና የዮሐንስን እስር የሚመለከተው ታሪካዊና ሥነ ምግባራዊ አቀራረብ
  choice: ጥቅሱ ሄሮድስ ዮሐንስን ያሳሰረው በሄሮድያዳና እርሷን በማግባቱ ምክንያት መሆኑን ብቻ በገላጭ ሁኔታ ያቀርባል።
  alternative: ትርጉሙ የጋብቻውን ሕገ ወጥነት በዚሁ ጥቅስ በቀጥታ ሊጨምር ይችል ነበር።
  rationale: የጋብቻው ሕጋዊና ሥነ ምግባራዊ ችግር በቀጣዩ ጥቅስ ይገለጣል፤ ይህ ጥቅስ ራሱ የሄሮድስን ድርጊትና ምክንያቱን ይተርካል። ስለዚህ በምንጩ ውስጥ ያልተገለጸ ፍርድ አልተጨመረም።
