base_translation:
  language: en
  yaml_path: translation/nt/mark/006/028.yaml
  text: And he brought his head on a platter and gave it to the girl[a], and the girl gave it to her mother.
translation:
  language: am
  text: የእርሱን ራስ በማቅረቢያ ሳህን[a] ላይ አምጥቶ ለልጅቷ ሰጣት፤ ልጅቷም ለእናቷ ሰጠችው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም «በትሪ ላይ» ወይም «በሳህን ላይ»። የግሪኩ πίναξ ምግብ ለማቅረብ የሚያገለግል ሳህን ወይም ትሪ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνεγκεν
  choice: አምጥቶ
  rationale: የግሱን ተጨባጭ የማምጣት ድርጊት በተፈጥሯዊ አማርኛ ያሳያል፤ የአያያዙን ዘዴ ከምንጩ በላይ አይወስንም።
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: ራሱን
  rationale: በአማርኛ የተፈጥሮ የባለቤትነት አገላለጽ ሲሆን፣ ተውላጠ ስሙ በቀደመው አውድ ወደ ዮሐንስ ይመለሳል።
- source_word: ἐπὶ πίνακι
  choice: በትልቅ ሳህን ላይ
  rationale: πίναξ ምግብ ለማቅረብ የሚያገለግል ሰፊ ሳህን ወይም ትሪ ሊያመለክት ይችላል፤ ይህ ምርጫ የግብዣውን አውድ በግልጽ እና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἔδωκεν
  choice: ሰጣት / ሰጠችው
  rationale: የግሪኩን ተደጋጋሚ የመስጠት ግስ ይጠብቃል፤ የአማርኛው የተሳቢ ቅጥያ በየአንቀጹ ተቀባዩን ግልጽ ያደርጋል።
- source_word: τῷ κορασίῳ / τὸ κοράσιον
  choice: ለልጅቱ / ልጅቱም
  rationale: κοράσιον ሴት ልጅን ወይም ወጣት ሴትን ያመለክታል፤ «ልጅቱ» በአውዱ ጾታዋን በቀደመው ትረካ እንዲታወቅ በማድረግ ተፈጥሯዊና ዘመናዊ ነው።
- source_word: τῇ μητρὶ αὐτῆς
  choice: ለእናቷ
  rationale: የግሪኩን ባለቤትነትና ተቀባይነት በአጭር፣ ግልጽ እና ተፈጥሯዊ አማርኛ ያስተላልፋል።
