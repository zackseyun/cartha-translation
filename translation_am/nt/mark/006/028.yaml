- from: ራሱንም በትልቅ ሳህን ላይ አምጥቶ ለልጅቱ ሰጣት፤ ልጅቱም ለእናቷ ሰጠችው።[a]
  to: የእርሱን ራስ በማቅረቢያ ሳህን[a] ላይ አምጥቶ ለልጅቷ ሰጣት፤ ልጅቷም ለእናቷ ሰጠችው።
  rationale: The revision removes an unintended reflexive reading, marks the girl explicitly as feminine, and renders πίναξ as a serving platter without adding a size qualifier. It retains the source's concrete sequence and repeated verb of giving, while the footnote preserves the lexical range of πίναξ and is anchored to that term.
