  text: ὁ δὲ λέγει αὐτοῖς· Πόσους ⸂ἔχετε ἄρτους⸃; ⸀ὑπάγετε ἴδετε. καὶ γνόντες λέγουσιν· Πέντε, καὶ δύο ἰχθύας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/038.yaml
  text: But he said to them, “How many loaves do you have? Go and see.” And when they found out, they said, “Five, and two fish.”
translation:
  language: am
  text: እርሱ ግን፣ “ስንት ዳቦ አላችሁ? ሂዱና እዩ” አላቸው። አውቀውም፣ “አምስት ዳቦና ሁለት ዓሣ አሉ” አሉት።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄρτους
  choice: እንጀራ
  rationale: በዚህ ዐውድ የሚበላ ዳቦን የሚያመለክተውን ብዙ ቁጥር በተፈጥሯዊ አማርኛ ለመግለጽ፤ ከቁጥር በኋላ ስምን በነጠላ መጠቀም የአማርኛ ልማድ ነው።
- source_word: ὑπάγετε ἴδετε
  choice: ሄዳችሁ እዩ
  rationale: ሁለቱን ትእዛዛዊ ግሶች በተፈጥሯዊና ግልጽ የአማርኛ ቅደም ተከተል ይጠብቃል።
- source_word: γνόντες
  choice: ካወቁም በኋላ
  rationale: የአኦሪስት አሳታፊውን ቀዳሚ ድርጊት—ቁጥሩን አጣርተው ማወቃቸውን—በግልጽ ያሳያል።
- source_word: ἰχθύας
  choice: ዓሣ
  rationale: የግሪክኛውን ብዙ ቁጥር ትርጉም በቁጥር ‘ሁለት’ በኋላ በተለመደው የአማርኛ ነጠላ ቅርጽ ያቀርባል።
