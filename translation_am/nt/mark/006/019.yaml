  rationale: የቀደመውን ንግግር በማስቀጠል ንፅፅሩን ያሳያል፤ በአማርኛ የስም ተከታይ -ም እና በኋለኛው ሐረግ ‘ግን’ ተፈጥሯዊ የተቃርኖ ፍሰት ይሰጣሉ።
- source_word: Ἡρῳδιὰς
