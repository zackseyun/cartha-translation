    text: ወይም፣ «በእርሱ ላይ ቂም እያነገበች ነበር» ወይም «በእርሱ ላይ ቂም ይዛበት ነበር»። የግሪኩ ፈሊጣዊ አነጋገር የቀጠለ ጥላቻን ይገልጻል።
    reason: lexical_alternative
