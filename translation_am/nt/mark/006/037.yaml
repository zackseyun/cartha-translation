  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘እናንተው’ የὑμεῖςን አጽንዖት ያስተላልፋል፤ የደቀ መዛሙርቱ ንግግር ጥያቄ መሆኑ ሳይፈታ ተጠብቋል።
