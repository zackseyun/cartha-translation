id: MRK.6.37
reference: Mark 6:37
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Δότε αὐτοῖς ὑμεῖς φαγεῖν. καὶ λέγουσιν αὐτῷ· Ἀπελθόντες ἀγοράσωμεν δηναρίων διακοσίων ἄρτους καὶ ⸀δώσομεν αὐτοῖς φαγεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/037.yaml
  text: But he answered and said to them[a], “You yourselves give them something to eat.” And they said to him[b], “Should we go and buy bread for two hundred denarii and give it to them to eat?”
translation:
  language: am
  text: እርሱ ግን መልሶ፣ “እናንተው የሚበሉትን ስጧቸው” አላቸው። እነርሱም፣ “ሄደን በሁለት መቶ ዲናር[a] ዳቦ[b] ገዝተን እንዲበሉ እንስጣቸው?” አሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንድ ዲናር በአብዛኛው የአንድ ሠራተኛ ወይም ወታደር የቀን ደመወዝ ነበር።
    reason: cultural_note
  - marker: b
    text: የግሪኩ ቃል በአጠቃላይ “ዳቦ” ወይም ነጠላ የዳቦ ጉብታዎችን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: መልሶ፣ … አላቸው
  rationale: የግሪኩን የመልስ ንግግር ትርጉም ይጠብቃል፤ ‘መልሶ አለ’ የተለመደና ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
- source_word: Δότε
  choice: ስጧቸው
  rationale: ቀጥተኛውን የትእዛዝ ኃይል ይጠብቃል።
- source_word: ὑμεῖς
  choice: እናንተው
  rationale: በግሪኩ የተገለጸውን አጽንዖት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: φαγεῖν
  choice: የሚበላ
  rationale: ‘እንዲበሉ ስጧቸው’ የሚለውን ሐሳብ አጭርና ተፈጥሯዊ በሆነ መንገድ ይገልጣል።
- source_word: Ἀπελθόντες
  choice: ሄደን
  rationale: ተሳቢውን ከዋናው ግስ ጋር በተፈጥሯዊ የአማርኛ ተከታታይ ግስ ያገናኛል።
- source_word: ἀγοράσωμεν
  choice: ገዝተን … እንስጣቸው?
  rationale: የምክክር ጥያቄውን ኃይል ይጠብቃል፤ ጥያቄው ተግባሩን ማድረግ ይገባቸው እንደሆነ ይጠይቃል።
- source_word: δηναρίων διακοσίων
  choice: በሁለት መቶ ዲናር
  rationale: የዋጋውን ግንኙነት በግልጽ አማርኛ ያሳያል፤ የጥንቱ የገንዘብ መለኪያም በተቀራራቢ ድምፅ ተጠብቋል።
- source_word: ἄρτους
  choice: ዳቦ
  rationale: በዚህ ዐውድ የሚገዛውን መሠረታዊ ምግብ በግልጽ ያመለክታል፤ የ‘እንጀራ’ን ዘመናዊ ልዩ የምግብ ትርጉም አያስገባም።
- source_word: δώσομεν αὐτοῖς φαγεῖν
  choice: እንዲበሉ እንስጣቸው
  rationale: ከኢየሱስ ትእዛዝ ጋር ያለውን ‘መስጠት’ የሚለውን የቃል ትይዩነት ይጠብቃል።
