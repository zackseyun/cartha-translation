id: MRK.6.41
reference: Mark 6:41
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κατέκλασεν τοὺς ἄρτους καὶ ἐδίδου τοῖς μαθηταῖς ⸀αὐτοῦ ἵνα ⸀παρατιθῶσιν αὐτοῖς, καὶ τοὺς δύο ἰχθύας ἐμέρισεν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/041.yaml
  text: And taking the five loaves and the two fish[a], looking up to heaven, he blessed and broke the loaves, and kept giving them to his disciples to set before them[b], and he divided the two fish among them all.
translation:
  language: am
  text: አምስቱን ዳቦዎችና ሁለቱን ዓሦች ወስዶ፣ ወደ ሰማይ ቀና ብሎ አይቶ ባረከ፤ ዳቦዎቹንም ቆርሶ፣ በሕዝቡ ፊት እንዲያቀርቡላቸው ለደቀ መዛሙርቱ እየሰጣቸው ነበር፤ ሁለቱንም ዓሦች ለሁሉ አከፋፈለ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβὼν
  choice: ወስዶ
  rationale: የድርጊቶቹን ቅደም ተከተልና የአኦሪስት አንቀጽን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἄρτους
  choice: እንጀራ / እንጀራዎቹን
  rationale: በአማርኛ የሚቆጠሩ የእንጀራ ቁርሶችን በተፈጥሯዊ መንገድ ይገልጻል፤ በሁለተኛው መጠቀስ ብዙ ቁጥር በግልጽ ተወክሏል።
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: ወደ ሰማይ አሻቅቦ በማየት
  rationale: የወደ ላይ እይታውንና የሰማይን አቅጣጫ በዘመናዊና ክብር ባለው አማርኛ ይጠብቃል።
- source_word: εὐλόγησεν
  choice: ባረከ
  rationale: የግሪኩን ግስ በቀጥታ ይወክላል፤ የተባረከውን ነገር በግድ ሳይወስን የጽሑፉን አሻሚነት ይጠብቃል።
- source_word: κατέκλασεν
  choice: ቆራርሶ
  rationale: የመቁረሱን ድግግሞሽና የብዙ እንጀራዎችን መከፋፈል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἐδίδου
  choice: ደጋግሞ ሰጣቸው
  rationale: የኢምፐርፌክት ግሱን ቀጣይነት ወይም ድግግሞሽ ያስተላልፋል።
- source_word: ἵνα παρατιθῶσιν αὐτοῖς
  choice: በሕዝቡ ፊት እንዲያቀርቡላቸው
  rationale: የዓላማውን አንቀጽና የπαρατίθημιን ተጨባጭ ‘በፊት ማቅረብ’ ምስል ይጠብቃል፤ የተውላጠ ስሙን ተቀባይ በአውዱ መሠረት እንደ ሕዝቡ ግልጽ ያደርጋል።
- source_word: ἐμέρισεν πᾶσιν
  choice: ለሁሉ አከፋፈለ
  rationale: የመከፋፈልና ለሁሉ የመድረስን ትርጉም በአጭርና ተፈጥሯዊ መልኩ ይሰጣል።
theological_decisions:
- issue: በምግብ አውድ εὐλόγησενን መተርጎም
  choice: ባረከ
  alternative: አመሰገነ
  rationale: ዋናው ግስ εὐλογέω ነው እንጂ εὐχαριστέω አይደለም። በምግብ አውድ ምስጋናን ሊያመለክት ቢችልም፣ ‘ባረከ’ የምንጩን ቃል ይጠብቃል እና የበረከቱን ቀጥተኛ ተቀባይ በግድ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የግሪኩ የድርጊት ቅደም ተከተልና የἐδίδου ድግግሞሽ ተጠብቀዋል፤ በεὐλόγησεν ያለው የቃላት ውጥረት በዋና ጽሑፍና በማስታወሻ ተገልጿል።
