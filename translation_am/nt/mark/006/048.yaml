base_translation:
  language: en
  yaml_path: translation/nt/mark/006/048.yaml
  text: And seeing them straining at the oars[a], because the wind was against them, about the fourth watch of the night he comes to them, walking on the sea[d][c][b]; and he intended to pass by them.
translation:
  language: am
  text: በመቅዘፍ ሲታገሉ አይቶ፣ ነፋሱ ይቃወማቸው ስለነበር፣ በሌሊቱ በአራተኛው የጥበቃ ጊዜ ገደማ[a] በባሕሩ ላይ[b] እየተራመደ ወደ እነርሱ ይመጣል፤ ሊያልፋቸውም ይፈልግ ነበር[c]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የሌሊቱ አራተኛ የጥበቃ ጊዜ” በሮማውያን አቆጣጠር በግምት ከ3፡00 እስከ 6፡00 ጠዋት ያለው ጊዜ ነው።
    reason: cultural_note
  - marker: b
    text: ወይም፣ “በውኃው ላይ።” የግሪኩ ጽሑፍ “በባሕሩ ላይ” ይላል።
    reason: lexical_alternative
  - marker: c
    text: “ሊያልፋቸው ይፈልግ ነበር” ማለት በቀላሉ ከእነርሱ አልፎ ሊሄድ ፈልጎ ነበር ማለት ሊሆን ይችላል፤ ነገር ግን እግዚአብሔር “በማለፍ” ራሱን የገለጠባቸውን የብሉይ ኪዳን ትዕይንቶችም ሊያስተጋባ ይችላል (ለምሳሌ፣ ዘፀ 33፥19፣ 22፤ 34፥6፤ 1 ነገ 19፥11)።
    reason: alternative_reading
