- source_word: βασανιζομένους ἐν τῷ ἐλαύνειν
  choice: በመቅዘፍ ሲታገሉ
  rationale: βασανίζω የከባድ መከራን ሐሳብ ቢይዝም፣ በዚህ ዐውድ የቀዘፋውን ከባድ ትግል በተፈጥሯዊና ግልጽ አማርኛ ይገልጣል፤ ἐν τῷ ἐλαύνειν ደግሞ በተመሳሳይ ጊዜ የተከናወነውን ድርጊት ያሳያል።
- source_word: ἐναντίος αὐτοῖς
  choice: በተቃራኒያቸው
  rationale: ነፋሱ የጉዞአቸውን አቅጣጫ ይቃወም እንደነበር በትክክል ያሳያል።
- source_word: περὶ τετάρτην φυλακὴν τῆς νυκτός
  choice: በሌሊቱም በአራተኛው የጥበቃ ጊዜ ገደማ
  rationale: የጥንቱን የሰዓት አቆጣጠር በዋናው ጽሑፍ ይጠብቃል፤ περὶ የሚያሳየውን ግምታዊነት ‘ገደማ’ ያስተላልፋል።
