  text: ἄλλοι ⸀δὲ ἔλεγον ὅτι Ἠλίας ἐστίν· ἄλλοι δὲ ἔλεγον ὅτι ⸀προφήτης ὡς εἷς τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/015.yaml
  text: But others were saying[a], “He is Elijah,” and others were saying, “He is a prophet, like one of the prophets.”
translation:
  language: am
  text: ሌሎች ግን፣ “ኤልያስ ነው” ይሉ ነበር፤ ሌሎች ደግሞ፣ “እንደ ነቢያት አንዱ ያለ ነቢይ ነው” ይሉ ነበር።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ እምብዛም የማይመስል ትርጉም፦ «ያ ነቢይ ነው።» ይህ ቃሉ የተወሰነውን የመጨረሻው ዘመን ነቢይ እንደሚያመለክት ተደርጎ ከተወሰደ ነው። ሆኖም ግሪኩ «እንደ ነቢያት አንዱ» ብሎ ስለሚቀጥል፣ በዚህ ስፍራ «ነቢይ» የሚለው አነባበብ ይበልጥ ተፈጥሯዊ ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλοι δὲ
  choice: ሌሎች ግን
  rationale: ἄλλοι ሌላ የሰዎች ቡድንን ያመለክታል፤ δέ ደግሞ መጠነኛ ንጽጽርንና የንግግር ቀጣይነትን ስለሚያሳይ፣ «ሌሎች ግን» ተፈጥሯዊ ነው።
- source_word: ἔλεγον
  choice: ይሉ ነበር
  rationale: ያልተፈጸመው የግስ ቅርጽ ቀጣይ ወይም ተደጋጋሚ ንግግርን ያሳያል፤ «ይሉ ነበር» ይህን ገጽታ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ὅτι Ἠλίας ἐστίν
  choice: «ኤልያስ ነው»
  rationale: ቀጥተኛ ንግግር በአማርኛ ተፈጥሯዊ ነው፤ Ἠλίας በተለመደው የአማርኛ መጽሐፍ ቅዱሳዊ አጻጻፍ «ኤልያስ» ተብሏል።
- source_word: προφήτης
  choice: ነቢይ
  rationale: ከአውዱና «ከነቢያት እንደ አንዱ» ከሚለው ማብራሪያ አንጻር አጠቃላይ የነቢይነት መለያን ያመለክታል። አማርኛ የእንግሊዝኛውን ያልተወሰነ አመልካች በተለየ ቃል አያስፈልገውም።
- source_word: ὡς εἷς τῶν προφητῶν
  choice: ከነቢያት እንደ አንዱ ያለ
  rationale: ὡς ንጽጽርን ያሳያል፤ ይህ አተረጓጎም ኢየሱስን ከነቢያት አንዱን እንደሚመስል የሚገልጸውን ሐሳብ በግልጽና ተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: προφήτης አጠቃላይ «ነቢይ» ወይስ የተወሰነው «ያ ነቢይ» ተብሎ መተርጎም
  choice: ነቢይ
  alternative: ያ ነቢይ
  rationale: በግሪኩ ቃሉ ያለ አመልካች መጣቱና ወዲያው «ከነቢያት እንደ አንዱ» ተብሎ መብራራቱ፣ የተወሰነ የመጨረሻው ዘመን ማዕረግን ሳይሆን አጠቃላይ የነቢይነት መለያን እንደሚያመለክት ያሳያል። ያም ሆኖ ሌላው ንባብ በማስታወሻ ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። «ይሉ ነበር» የግሪኩን ቀጣይ/ተደጋጋሚ ገጽታ ይጠብቃል።
