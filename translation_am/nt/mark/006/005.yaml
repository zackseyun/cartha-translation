  verdict: revise
  source_fidelity: The draft accurately preserves the explicit imperfect inability (οὐκ ἐδύνατο) and the healing action. However, ነገር ግን (“but”) does not adequately render εἰ μὴ, which introduces a strict exception to the preceding negative statement.
  naturalness: The wording is generally clear, modern, and suitably dignified. Recasting the exception with ከ…በስተቀር makes the logical relationship explicit and natural in Amharic.
  terminology: የኃይል ሥራ appropriately retains the δύναμις/power component while the note supplies “miracle” as an alternative. ፈወሳቸው and እጆቹን ጭኖ are appropriate standard biblical Amharic expressions.
  issues:
  - severity: medium
    issue: εἰ μὴ is rendered as ነገር ግን.
    rationale: The Greek means “except,” not merely “but.” The translation should explicitly mark the healings of a few sick people as the exception to the stated inability to do a work of power.
  revised_text: በዚያም ምንም የኃይል ሥራ[a] ማድረግ አልቻለም፤ ከጥቂት በሽተኞች ላይ እጆቹን ጭኖ ከፈወሳቸው በስተቀር።
