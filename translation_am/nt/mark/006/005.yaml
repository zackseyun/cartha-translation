base_translation:
  language: en
  yaml_path: translation/nt/mark/006/005.yaml
  text: And he was not able to do any mighty work there[a], except that he laid his hands on a few sick people and healed them.
translation:
  language: am
  text: በዚያም ምንም የኃይል ሥራ[a] ማድረግ አልቻለም፤ ከጥቂት በሽተኞች ላይ እጆቹን ጭኖ ከፈወሳቸው በስተቀር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ምንም ተአምር” ወይም “ምንም ኃይል ያለበት ሥራ።” ግሪክኛው በቃል “ምንም ኃይል” ይላል፤ ይህም ማርቆስ ተአምራዊ ሥራዎችን ለመግለጽ የሚጠቀምበት አነጋገር ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδύνατο
  choice: ማድረግ አልቻለም
  rationale: የግሪክ ጽሑፉ የሚገልጸውን እውነተኛ አለመቻል በግልጽና ተፈጥሯዊ አማርኛ ያስተላልፋል፤ ወደ ‘ማድረግ አልፈለገም’ አያለዝበውም።
- source_word: ποιῆσαι οὐδεμίαν δύναμιν
  choice: ምንም የኃይል ሥራ ማድረግ
  rationale: ποιέωን ‘ማድረግ’ ብሎ ይጠብቃል፤ δύναμιςንም በማርቆስ ውስጥ ያለውን ተአምራዊ ድርጊት የሚያመለክት አጠቃቀም ከ‘ኃይል’ የቃል ግንኙነት ጋር ያቆያል።
- source_word: εἰ μὴ
  choice: ነገር ግን
  rationale: ከቀደመው አሉታዊ ንግግር በኋላ የተጠቀሰውን ልዩ ሁኔታ በተፈጥሯዊ አማርኛ ያስገባል።
- source_word: ὀλίγοις ἀρρώστοις
  choice: በጥቂት በሽተኞች ላይ
  rationale: የሰዎቹን አነስተኛ ቁጥርና ሕመማቸውን በአጭር፣ በዘመናዊ አገላለጽ ይገልጻል።
- source_word: ἐπιθεὶς τὰς χεῖρας
  choice: እጆቹን ጭኖ
  rationale: የእጆችን አካላዊ መጫን በተለመደ አማርኛ ይገልጻል።
- source_word: ἐθεράπευσεν
  choice: ፈወሳቸው
  rationale: የθεραπεύωን የፈውስና የመመለስ ትርጉም በተለመደው የመጽሐፍ ቅዱስ አማርኛ ያስተላልፋል።
