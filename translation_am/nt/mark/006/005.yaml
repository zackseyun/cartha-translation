  alternative: ‘ምንም የኃይል ሥራ አላደረገም’ ወይም ‘ማድረግ አልፈለገም’
  rationale: ግሪክኛው δύναμαιን በአሉታዊ ቅርጽ በግልጽ ይጠቀማል። ትርጉሙ የጽሑፉን ሥነ መለኮታዊ ውጥረት መጠበቅ እንጂ ወደ ፈቃድ አለመኖር መለወጥ የለበትም።
