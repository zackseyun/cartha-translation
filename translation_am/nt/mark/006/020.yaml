id: MRK.6.20
reference: Mark 6:20
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὁ γὰρ Ἡρῴδης ἐφοβεῖτο τὸν Ἰωάννην, εἰδὼς αὐτὸν ἄνδρα δίκαιον καὶ ἅγιον, καὶ συνετήρει αὐτόν, καὶ ἀκούσας αὐτοῦ πολλὰ ⸀ἠπόρει, καὶ ἡδέως αὐτοῦ ἤκουεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/020.yaml
  text: For Herod feared John[a], knowing that he was a righteous and holy man, and he kept him safe. And when he heard him, he was greatly perplexed, and yet he listened to him gladly.
translation:
  language: am
  text: ሄሮድስ ዮሐንስን ይፈራው ነበር፤ ጻድቅና ቅዱስ ሰው መሆኑን ያውቅ ስለነበርም ይጠብቀው ነበር። ሲሰማውም እጅግ ግራ ይጋባ ነበር፤[a] ሆኖም በደስታ ያዳምጠው ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች “እጅግ ግራ ይጋባ ነበር” በሚለው ፈንታ “ብዙ ነገሮችን ያደርግ ነበር” ይላሉ።
    reason: textual_variant
lexical_decisions:
- source_word: ἐφοβεῖτο
  choice: ይፈራው ነበር
  rationale: ያልተጠናቀቀው ግስ ቀጣይ የነበረ ፍርሃትን ያሳያል፤ ቃሉን ‘ያከብረው’ ብሎ ከማለዘብ ይልቅ ቀጥተኛ ኃይሉን ይጠብቃል።
- source_word: εἰδὼς
  choice: መሆኑን ያውቅ ስለነበር
  rationale: አካፋዩ የሄሮድስን ፍርሃትና ጥበቃ ምክንያት ያመለክታል፤ በአማርኛ የምክንያት ግንኙነቱን ተፈጥሯዊ በሆነ መንገድ ያሳያል።
- source_word: ἄνδρα δίκαιον καὶ ἅγιον
  choice: ጻድቅና ቅዱስ ሰው
  rationale: ‘ጻድቅ’ የሞራል ቅንነትን፣ ‘ቅዱስ’ ደግሞ ለእግዚአብሔር የተለየን ባሕርይ ይገልጣሉ፤ ‘ሰው’ ἄνδραን በቀጥታ ይወክላል።
- source_word: συνετήρει
  choice: ይጠብቀው ነበር
  rationale: በአውዱ ዮሐንስን ከጉዳት መከላከልን ያመለክታል፤ ‘ይጠብቀው’ የመጠበቅና የመከላከል ጥላዎችን ይይዛል።
- source_word: ἀκούσας αὐτοῦ
  choice: እርሱንም በሰማ ጊዜ
  rationale: የአካፋዩን ጊዜያዊ ግንኙነትና ሰውን የመስማት ፍቺ ይጠብቃል።
- source_word: πολλὰ ἠπόρει
  choice: እጅግ ግራ ይጋባ ነበር
  rationale: ἠπόρει ግራ መጋባትን ወይም መውጫ ማጣትን ያመለክታል፤ πολλὰ ደግሞ መጠኑን ያጠናክራል።
- source_word: ἡδέως αὐτοῦ ἤκουεν
  choice: ሆኖም በደስታ ያዳምጠው ነበር
  rationale: ἡδέως ደስ እያለው ወይም በፈቃደኝነት ማዳመጡን ያሳያል፤ ‘ሆኖም’ ከግራ መጋባቱ ጋር ያለውን ውጥረት በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: ዮሐንስን ከሰማ በኋላ የሄሮድስን ምላሽ የሚገልጸው የጽሑፍ ልዩነት
  choice: የSBLGNT ንባብን በመከተል ‘እጅግ ግራ ይጋባ ነበር’ (ἠπόρει)
  alternative: ‘ብዙ ነገሮችን ያደርግ ነበር’ (ἐποίει)
  rationale: ዋናው የቀረበው ምንጭ ἠπόρειን ይዟል፤ ይህም ሄሮድስ ግራ እየተጋባ ሳለ ዮሐንስን በደስታ ያዳምጥ የነበረበትን ውጥረት ሳይፈታ ይጠብቃል። ትርጉሙን በእጅጉ የሚቀይረው አማራጭ ንባብ በግርጌ ማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ተደጋጋሚው ‘ነበር’ የግሪኩን ያልተጠናቀቀ የቀጣይ ድርጊት ገጽታ ያንጸባርቃል።
