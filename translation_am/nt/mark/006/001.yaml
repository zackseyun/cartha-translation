  text: Καὶ ἐξῆλθεν ἐκεῖθεν, καὶ ⸀ἔρχεται εἰς τὴν πατρίδα αὐτοῦ, καὶ ἀκολουθοῦσιν αὐτῷ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/001.yaml
  text: And he went out from there and came to his hometown[a], and his disciples followed him.
translation:
  language: am
  text: ከዚያም ወጥቶ ወደ አገሩ መጣ፤[a] ደቀ መዛሙርቱም ተከተሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወደ አገሩ ይመጣል፤ ደቀ መዛሙርቱም ይከተሉታል።” ግሪኩ ትረካውን ሕያው ለማድረግ ታሪካዊ የአሁን ጊዜን ይጠቀማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: ወጥቶ
  rationale: የመነሻ ስፍራውን ለቆ መሄዱን ያሳያል፤ የግሪኩን ‘መውጣት’ ምስል በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐκεῖθεν
  choice: ከዚያ
  rationale: የተነሳበትን ቦታ በአጭርና ተፈጥሯዊ አገላለጽ ይገልጣል።
- source_word: ἔρχεται
  choice: መጣ
  rationale: በግሪክ ያለው ታሪካዊ የአሁን ጊዜ በተፈጥሯዊ የአማርኛ ትረካ ወደ አለፈ ጊዜ ተቀይሯል፤ እንቅስቃሴውን በትክክል ያሳያል።
- source_word: πατρίδα
  choice: ትውልድ ስፍራው
  rationale: በዚህ አውድ የኢየሱስን የትውልድ አካባቢ ያመለክታል፤ ‘አገሩ’ ሊያስከትለው የሚችለውን ሰፊ የብሔር ወይም የፖለቲካ ትርጉም ያስወግዳል።
- source_word: ἀκολουθοῦσιν
  choice: ተከተሉት
  rationale: የአካላዊ መከተልንና የደቀ መዝሙርነትን ግንኙነት ይጠብቃል፤ ታሪካዊው የአሁን ጊዜ ለተፈጥሯዊ ትረካ በአለፈ ጊዜ ተተርጉሟል።
- source_word: μαθηταὶ
  choice: ደቀ መዛሙርቱ
  rationale: በወንጌላት አውድ የተለመደና ትክክለኛ ቃል ሲሆን ተከታይነትንና ተማሪነትን አብሮ ያሳያል።
theological_decisions:
- issue: የታሪካዊ የአሁን ጊዜ አተረጓጎም (ἔρχεται፣ ἀκολουθοῦσιν)
  choice: በአማርኛ ትረካ በቀላል አለፈ ጊዜ፣ ‘መጣ … ተከተሉት’ ተተርጉሟል።
  alternative: የግሪኩን ታሪካዊ የአሁን ጊዜ ጠብቆ፣ ‘ይመጣል … ይከተሉታል’ ማለት።
  rationale: ይህ የትረካ ስልት ውሳኔ እንጂ የእምነት ትርጓሜ አይደለም። አለፈ ጊዜው በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን፣ የግሪኩ ሕያው አቀራረብ በማስታወሻው ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። ‘ትውልድ ስፍራ’ ከ‘አገር’ ይልቅ የአውዱን አካባቢያዊ ትርጉም ይበልጥ በግልጽ ያሳያል።
