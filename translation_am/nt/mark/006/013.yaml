  text: καὶ δαιμόνια πολλὰ ἐξέβαλλον, καὶ ἤλειφον ἐλαίῳ πολλοὺς ἀρρώστους καὶ ἐθεράπευον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/013.yaml
  text: And they were casting out many demons[a], and were anointing many sick people with oil and healing them.
translation:
  language: am
  text: ብዙ አጋንንትንም ያወጡ ነበር፤ ብዙ በሽተኞችንም በዘይት[a] ይቀቧቸው እና ይፈውሷቸው ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በወይራ ዘይት።»
    reason: lexical_alternative
lexical_decisions:
- source_word: δαιμόνια
  choice: አጋንንት
  rationale: ይህ ቃል ክፉ መናፍስትን በቀጥታ ያመለክታል፤ «እርኩሳን መናፍስት» በዚህ ቁጥር ያልተጠቀሰውን የአጎራባች ንባብ እንዳያስገባ «አጋንንት» ተመርጧል።
- source_word: πολλὰ / πολλοὺς
  choice: ብዙ
  rationale: በሁለቱም ስፍራ ያለውን ግልጽ የብዛት ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐξέβαλλον
  choice: ያስወጡ ነበር
  rationale: የግሪኩን ኢምፐርፌክት ገጽታ፣ ማለትም ተደጋጋሚ ወይም ቀጣይ ድርጊትን፣ በተፈጥሯዊ የአማርኛ አወቃቀር ያሳያል።
- source_word: ἤλειφον
  choice: ይቀቡ
  rationale: ἀλείφω ዘይትን መቀባትን ወይም መተግበርን ያመለክታል፤ «ይቀቡ» በዚህ የፈውስ አውድ ውስጥ ግልጽና ዘመናዊ ነው።
- source_word: ἐλαίῳ
  choice: በዘይት
  rationale: ዋናውን የ«ዘይት» ትርጉም ይጠብቃል፤ በጥንቱ የሜዲትራኒያን አውድ የወይራ ዘይት መሆኑ የሚገመት ቢሆንም ዋናው ጽሑፍ ይህን በግልጽ አይለይም።
- source_word: ἀρρώστους
  choice: በሽተኞችን
  rationale: በግሪኩ እንደ ስም የሚሠራውን «የታመሙ ሰዎች» በአጭርና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐθεράπευον
  choice: ይፈውሷቸው ነበር
  rationale: የመፈወስን ትርጉምና የኢምፐርፌክትን ተደጋጋሚ ድርጊት ይጠብቃል፤ የተፈወሱትን በሽተኞችም በ«-አቸው» ግልጽ ያደርጋል።
- source_word: καὶ
  choice: -ም / እና
  rationale: ተደጋጋሚውን የግሪክ ማያያዣ በተፈጥሯዊ የአማርኛ ትይዩ አወቃቀር ያንጸባርቃል።
theological_decisions:
- issue: ዘይት መቀባቱ ከፈውሱ ጋር ያለው ግንኙነት
  choice: ድርጊቶቹን በታሪካዊ መግለጫ አቅርቦ ዘይቱ ፈውሱን እንዳስገኘ ወይም ፈጽሞ ምሳሌያዊ ብቻ እንደነበር አለመወሰን
  alternative: ዘይቱ ራሱ ፈውሱን አስገኘ፤ ወይም ቅባቱ ከፈውሱ ጋር ምንም ሚና የሌለው ምሳሌያዊ ድርጊት ብቻ ነበር
  rationale: ቁጥሩ ደቀ መዛሙርቱ በሽተኞችን በዘይት እንደቀቡና እንደፈወሷቸው ይናገራል፤ የዘይቱን ሥነ መለኮታዊ ወይም ምሥጢራዊ አሠራር ግን አይገልጽም። ትርጉሙ ይህን ውጥረት አይፈታም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩን ኢምፐርፌክት ገጽታ ለማሳየት «ነበር» ያለው ተደጋጋሚ የድርጊት አወቃቀር ተመርጧል፤ ከልክ ያለፈ ቤተ ክርስቲያናዊ ወይም ሕክምናዊ ቃላት አልገቡም።
