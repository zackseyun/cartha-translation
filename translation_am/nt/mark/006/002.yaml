  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። «ምኵራብ» የተለመደውን መጽሐፍ ቅዱሳዊ ቃል ይጠብቃል፤ የጥያቄዎቹ የአፍ ንግግር ተፈጥሯዊነትም ተጠብቋል።
