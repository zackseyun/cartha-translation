  text: καὶ γενομένου σαββάτου ἤρξατο ⸂διδάσκειν ἐν τῇ συναγωγῇ⸃· καὶ ⸀οἱ πολλοὶ ἀκούοντες ἐξεπλήσσοντο λέγοντες· Πόθεν τούτῳ ταῦτα, καὶ τίς ἡ σοφία ἡ δοθεῖσα ⸀τούτῳ, καὶ ⸀αἱ δυνάμεις τοιαῦται διὰ τῶν χειρῶν αὐτοῦ ⸀γινόμεναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/002.yaml
  text: And when the Sabbath came[a], he began to teach in the synagogue. And many who heard him were astonished, saying, “Where did this man get these things? And what is this wisdom given to him, and such mighty works happening through his hands?”
translation:
  language: am
  text: ሰንበትም በደረሰ ጊዜ በምኵራብ ማስተማር ጀመረ። ብዙዎችም ሲሰሙት በጣም ተደነቁ፤ እንዲህ እያሉ፦ “ይህ ሰው እነዚህን ከየት አገኘ? ለዚህ ሰው የተሰጠው ይህ ጥበብ ምንድን ነው? በእጆቹ የሚከናወኑ እንዲህ ያሉ የኃይል ሥራዎች[a] ምንድን ናቸው?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ተአምራት” ወይም “የኃይል መገለጫዎች።” የግሪኩ የብዙ ቁጥር ቃል δυνάμεις ተአምራዊ ድርጊቶችን ወይም የኃይል መገለጫዎችን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένου σαββάτου
  choice: ሰንበትም በደረሰ ጊዜ
  rationale: የግሪኩን ጊዜ ጠቋሚ ገላጭ አወቃቀር በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἤρξατο διδάσκειν
  choice: ማስተማር ጀመረ
  rationale: የድርጊቱን መጀመር በግልጽና በተለመደ አማርኛ ያሳያል።
- source_word: συναγωγῇ
  choice: ምኵራብ
  rationale: በአይሁድ አውድ ያለውን የስብሰባና የአምልኮ ስፍራ የሚያመለክት የተለመደ መጽሐፍ ቅዱሳዊ ቃል ነው።
- source_word: οἱ πολλοὶ ἀκούοντες
  choice: የሰሙትም ብዙዎች
  rationale: ተሳታፊውን አገላለጽ በተፈጥሯዊ አማርኛ አንጻራዊ ሐረግ ይገልጻል።
- source_word: ἐξεπλήσσοντο
  choice: በጣም ተደንቀው
  rationale: ቃሉ የሚያሳየውን ከፍተኛ መደነቅ ያስተላልፋል፤ የቀጣዩ የመናገር ግስም በአማርኛ አወቃቀር በ«አሉ» ይጠናቀቃል።
- source_word: Πόθεν τούτῳ ταῦτα
  choice: ይህ ሰው እነዚህን ከየት አገኘ?
  rationale: Πόθεν የምንጭ ጥያቄ መሆኑን ያሳያል፤ «ይህ ሰው» የτούτῳን የርቀት ወይም የንቀት ቃና ሳያጋንን ይጠብቃል።
- source_word: τίς ἡ σοφία ἡ δοθεῖσα τούτῳ
  choice: የተሰጠውስ ይህ ጥበብ ምንድር ነው?
  rationale: የተሰጠ መሆኑን የሚገልጸውን ተገብሮአዊ አገላለጽና የጥያቄውን አጽንዖት ይጠብቃል።
- source_word: δυνάμεις
  choice: የኃይል ሥራዎች
  rationale: በማርቆስ ውስጥ ቃሉ ተአምራዊ ድርጊቶችን ሊያመለክት ቢችልም፣ የ«ኃይል» ዋና ትርጉሙን ጠብቆ የአገላለጹን ስፋት አይዘጋም።
- source_word: διὰ τῶν χειρῶν αὐτοῦ γινόμεναι
  choice: በእጆቹስ የሚከናወኑት
  rationale: የግሪኩን «በእጆቹ» የሚል መሣሪያዊ ምስልና ድርጊቶቹ እየተፈጸሙ መሆናቸውን ይጠብቃል።
theological_decisions:
- issue: የδυνάμεις ባሕርይ
  choice: የኃይል ሥራዎች
  alternative: ተአምራት
  rationale: አውዱ ተአምራዊ ድርጊቶችን ይጠቁማል፤ ሆኖም «የኃይል ሥራዎች» የግሪኩን የኃይል ገጽታ በቅርብ ይጠብቃል እና የቃሉን ትርጉም በአንድ ትርጓሜ ብቻ አይወስንም።
- issue: የτούτῳ ቃና
  choice: ይህ ሰው
  alternative: እርሱ / ለእርሱ
  rationale: በአውዱ የሚሰማውን የማራቅ ወይም ትንሽ የንቀት ቃና ያስተላልፋል፤ ከግሪኩ በላይ ግን አያጠናክረውም።
- issue: ጥበቡ «የተሰጠ» መሆኑ
  choice: የተሰጠው ይህ ጥበብ
  alternative: ያለው ይህ ጥበብ
  rationale: δοθεῖσα የሚለውን ተገብሮአዊ ቅርጽ በግልጽ ይጠብቃል፤ ሰጪው ማን እንደሆነ ጽሑፉ ስለማይገልጽ ትርጉሙም አይጨምርም።
