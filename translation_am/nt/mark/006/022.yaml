  rationale: የተከተልነውን የግሪክ ጽሑፍ በቀጥታና በግልጽ አማርኛ ይወክላል፤ ሌላው የጽሑፍና የትርጓሜ ንባብ በእግር ማስታወሻ ተጠቅሷል።
- source_word: ὀρχησαμένης
  choice: ስትጨፍር
  rationale: ድርጊቱ ከመግባቷና ደስ ከማሰኘቷ ጋር ያለውን ተያያዥነት በተፈጥሯዊ የትረካ አማርኛ ያሳያል።
- source_word: ἀρεσάσης
  choice: ደስ አሰኘች
  rationale: ‘ደስ ማሰኘት’ የሚለውን መሠረታዊ ትርጉም ይጠብቃል፤ ስሜቱን ከልክ በላይ አያጎላም።
- source_word: τοῖς συνανακειμένοις
  choice: ከእርሱ ጋር በማዕድ የተቀመጡትን
  rationale: ከሄሮድስ ጋር በግብዣ ማዕድ የነበሩትን ያመለክታል፤ የመደገፍ ባህላዊ አቀማመጥ በማስታወሻ ተብራርቷል።
- source_word: εἶπεν ὁ βασιλεὺς
  choice: ንጉሡም ... አላት
  rationale: ማርቆስ የተጠቀመውን ‘ንጉሥ’ የሚለውን ማዕረግ ሳይቀይር ይጠብቃል፤ የአማርኛው የንግግር አወቃቀርም ተፈጥሯዊ ነው።
- source_word: τῷ κορασίῳ
  choice: ልጅቱን
  rationale: ወጣት ሴት ልጅን በተፈጥሯዊና ዘመናዊ አማርኛ ይገልጣል።
- source_word: Αἴτησόν με ὃ ἐὰν θέλῃς
  choice: የፈለግሽውን ሁሉ ጠይቂኝ
  rationale: የትእዛዝ አኳኋኑንና ገደብ የሌለውን የምርጫ ሐሳብ በግልጽ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: δώσω σοι
  choice: እሰጥሻለሁ
  rationale: የወደፊት ጊዜ ተስፋውንና ለሴት ልጅቱ የተነገረ መሆኑን በአጭር ተፈጥሯዊ አማርኛ ያሳያል።
