  text: καὶ εἰσελθούσης τῆς θυγατρὸς ⸂αὐτῆς τῆς⸃ Ἡρῳδιάδος καὶ ὀρχησαμένης ⸂καὶ ἀρεσάσης⸃ τῷ Ἡρῴδῃ καὶ τοῖς συνανακειμένοις, ⸂εἶπεν ὁ βασιλεὺς⸃ τῷ κορασίῳ· Αἴτησόν με ὃ ἐὰν θέλῃς, καὶ δώσω σοι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/022.yaml
  text: And when Herodias's daughter came in and danced[a], and pleased Herod and those reclining at the table with him, the king said to the girl, “Ask me for whatever you want[b], and I will give it to you.”
translation:
  language: am
  text: የሄሮድያዳ ልጅ[a] ገብታ ጨፍራ፣ ሄሮድስንና ከእርሱ ጋር በማዕድ የተቀመጡትን[b] ደስ አሰኘች። ንጉሡም ልጅቱን፣ “የፈለግሽውን ሁሉ ጠይቂኝ፤ እሰጥሻለሁ” አላት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎችና የጽሑፍ ወጎች “የእርሱ ልጅ ሄሮድያዳ” ብለው ያነባሉ፤ እዚህ የተከተልነው የግሪክ ጽሑፍ ግን “የሄሮድያዳ ልጅ” ይላል።
    reason: textual_variant
  - marker: b
    text: ወይም፣ “ከእርሱ ጋር ምግብ ይበሉ የነበሩትን።” የግሪክ ቃሉ በጥንቱ ልማድ መሠረት በማዕድ ተደግፈው የተቀመጡትን የግብዣ ባልንጀሮች ያመለክታል።
    reason: cultural_note
lexical_decisions:
- source_word: εἰσελθούσης
  choice: ገብታ
  rationale: የግሪኩ የአኦሪስት ተሳቢ ግስ ከዋናው ድርጊት ጋር ያለውን ጊዜያዊ ቅደም ተከተል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: τῆς θυγατρὸς αὐτῆς τῆς Ἡρῳδιάδος
