  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἀνέβη πρὸς αὐτοὺς εἰς τὸ πλοῖον, καὶ ἐκόπασεν ὁ ἄνεμος. καὶ λίαν ⸂ἐκ περισσοῦ⸃ ἐν ἑαυτοῖς ⸀ἐξίσταντο,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/051.yaml
  text: And he got into the boat with them[a], and the wind stopped. And they were utterly astonished within themselves[b],
translation:
  language: am
  text: እነርሱ ወዳሉበት ጀልባ ገባ፤ ነፋሱም ቆመ። እነርሱም በውስጣቸው እጅግ ከመጠን በላይ ተደነቁ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέβη
  choice: ገባ
  rationale: ቃሉ በቀጥታ ‘ወጣ’ የሚል ቢሆንም፣ εἰς τὸ πλοῖον በሚለው አገባብ ወደ ጀልባ መግባትን ያመለክታል፤ ‘ገባ’ በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: πρὸς αὐτοὺς
  choice: ከእነርሱም ጋር
  rationale: ኢየሱስ ወደ ጀልባው ገብቶ ከእነርሱ ጋር መሆኑን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: πλοῖον
  choice: ጀልባ
  rationale: በገሊላ ባሕር ትረካ ውስጥ ለተጠቀሰው የውኃ መጓጓዣ መጠንና አገባብ ተስማሚ የሆነ ዘመናዊ ቃል ነው።
- source_word: ἐκόπασεν ὁ ἄνεμος
  choice: ነፋሱም ተወ
  rationale: κοπάζω ስለ ነፋስ ሲነገር መብረድን ወይም ማቆምን ያመለክታል፤ ‘ተወ’ እንቅስቃሴው ማቆሙን በአጭርና ግልጽ መንገድ ያስተላልፋል።
- source_word: λίαν ἐκ περισσοῦ
  choice: ከመጠን በላይ
  rationale: ሁለቱ አጽንዖት ሰጪ አገላለጾች የደቀ መዛሙርቱን እጅግ ከፍተኛ መደነቅ ያሳያሉ፤ ‘ከመጠን በላይ’ ይህን ኃይል ተፈጥሯዊ በሆነ አማርኛ ይጠብቃል።
- source_word: ἐν ἑαυτοῖς
  choice: በውስጣቸው
  rationale: ምላሻቸው በውስጣቸው የተፈጠረ መሆኑን ያሳያል፤ የግሪኩን አንጸባራቂ ትርጉም ይጠብቃል።
- source_word: ἐξίσταντο
  choice: ተደነቁ
  rationale: ቃሉ እጅግ መገረምንና መደነቅን ያመለክታል፤ ጥንካሬው ቀድሞ ባለው ‘ከመጠን በላይ’ ተጠብቋል።
theological_decisions:
- issue: ደቀ መዛሙርቱ ለኢየሱስ ድርጊት የሰጡት ምላሽ ጥንካሬ
  choice: እነርሱም በውስጣቸው ከመጠን በላይ ተደነቁ
  alternative: እነርሱም በውስጣቸው እጅግ ከመጠን በላይ ተገረሙ
  rationale: የግሪኩን የተደራረበ አጽንዖት ይጠብቃል፣ ነገር ግን ከትረካው በላይ የሆነ ሥነ መለኮታዊ ትርጓሜ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የተደራረበ አጽንዖት በዋናው ጽሑፍ ‘ከመጠን በላይ’ ተብሎ ተጠብቆ፣ ሙሉ ቃል በቃል ኃይሉና ሌላው የἐξίσταντο ፍቺ በማስታወሻ ተገልጿል።
