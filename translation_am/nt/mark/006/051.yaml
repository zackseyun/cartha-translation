revisions:
- from: ከእነርሱም ጋር ወደ ጀልባው ገባ፤ ነፋሱም ተወ። እነርሱም በውስጣቸው ከመጠን በላይ ተደነቁ።[a]
  to: እነርሱ ወዳሉበት ጀልባ ገባ፤ ነፋሱም ቆመ። እነርሱም በውስጣቸው እጅግ ከመጠን በላይ ተደነቁ።
  rationale: The revision clarifies that Jesus entered the boat to join the disciples rather than entering alongside them, retains the strong cumulative emphasis of λίαν ἐκ περισσοῦ in natural Amharic, and keeps ἐν ἑαυτοῖς and ἐξίσταντο without importing theological interpretation.
