lexical_decisions:
- source_word: ὑμεῖς
  choice: እናንተ
  rationale: ግልጽ የሆነውንና አጽንዖት የያዘውን የሁለተኛ መደብ ብዙ ቁጥር ተውላጠ ስም ይጠብቃል።
- source_word: δὲ
