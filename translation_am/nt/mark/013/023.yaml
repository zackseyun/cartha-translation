- source_word: βλέπετε
  choice: ተጠንቀቁ
  rationale: የአሁን ጊዜ ትእዛዝ በዚህ አውድ የንቃትና የጥንቃቄ ማስጠንቀቂያ ነው፤ ቀጥተኛው ‘ተመልከቱ’ የታሰበውን ፍቺ በቂ አያስተላልፍም።
- source_word: προείρηκα
  choice: አስቀድሜ ነግሬአችኋለሁ
  rationale: አስቀድሞ መናገርንና የተነገረው አሁንም ጠቀሜታ እንዳለው የሚያሳየውን ፍጹም ጊዜ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ὑμῖν
  choice: -አችኋ-
  rationale: የብዙ ቁጥር ተቀባይን ‘ለእናንተ’ በሚለው ፍቺ በግሱ ውስጥ በተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: πάντα
  choice: ሁሉን
  rationale: ‘ሁሉንም ነገር’ የሚለውን ሰፊ ፍቺ በአጭርና ተፈጥሯዊ አማርኛ ይጠብቃል፤ ወሰኑንም አውዱ እንዲወስን ይተዋል።
theological_decisions:
- issue: የኢየሱስ ማስጠንቀቂያና አስቀድሞ የተናገረው ነገር ወሰን
  choice: ጥንቃቄውንና ‘ሁሉን’ የሚለውን ሰፊ አገላለጽ ሳይገደብ ማቆየት
  alternative: ኢየሱስ ስለወደፊቱ እያንዳንዱን ዝርዝር እንደገለጠ መተርጎም፣ ወይም ቃሉን በቅርብ ለተጠቀሱት ማስጠንቀቂያዎች ብቻ መገደብ
  rationale: πάντα በራሱ ሰፊ ቃል ነው፤ በዚህ አውድ የሚያመለክተውን ትክክለኛ ወሰን ትርጉሙ በትርጓሜ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። ‘እናንተ ግን’ የግሪኩን አጽንዖት ይጠብቃል፤ ሴሚኮሎኑም ማስጠንቀቂያውን ከምክንያታዊው ማሳሰቢያ ያገናኛል።
