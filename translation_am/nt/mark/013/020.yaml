  text: καὶ εἰ μὴ ⸂ἐκολόβωσεν κύριος⸃ τὰς ἡμέρας, οὐκ ἂν ἐσώθη πᾶσα σάρξ. ἀλλὰ διὰ τοὺς ἐκλεκτοὺς οὓς ἐξελέξατο ἐκολόβωσεν τὰς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/020.yaml
  text: And if the Lord had not cut short the days[a], no flesh would have been saved. But for the sake of the elect, whom he chose, he cut short the days.
translation:
  language: am
  text: ጌታም እነዚያን ቀናት ባያሳጥር ኖሮ፣ አንድም ሥጋ[a] ባልዳነ ነበር። ነገር ግን ለመረጣቸው ምርጦች ሲል እነዚያን ቀናት አሳጠረ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ማንም ሰው።” ቃል በቃል፣ “አንድም ሥጋ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκολόβωσεν
  choice: አሳጠረ
  rationale: የጊዜውን ርዝመት መቀነስን በተፈጥሯዊና ቀጥተኛ አማርኛ ይገልጣል፤ በሁለቱም ቦታዎች በአንድ መንገድ ተተርጉሟል።
- source_word: κύριος
  choice: ጌታ
  rationale: በአውዱ የታወቀውን መለኮታዊ ባለቤት የሚያመለክት የተለመደ መጽሐፍ ቅዱሳዊ አጠራር ነው።
- source_word: τὰς ἡμέρας
  choice: እነዚያን ቀናት
  rationale: ቀደም ሲል የተገለጸውን የመከራ ዘመን ያመለክታል፤ ‘እነዚያን’ የአውዱን የተወሰነ ማጣቀሻ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οὐκ ἂν ἐσώθη
  choice: ባልዳነ ነበር
  rationale: ተቃራኒ-እውነታዊውን ውጤት ይጠብቃል። በአውዱ የሕይወት መትረፍ የቅርብ ትርጉሙ ቢሆንም፣ σῴζω የሚያስተላልፈውን ‘መዳን’ ሳያጠብ ይተረጉማል።
- source_word: πᾶσα σάρξ
  choice: አንድም ሥጋ
  rationale: ከአሉታዊው ግስ ጋር ‘ማንም ሰው’ የሚለውን የሴማዊ/መጽሐፍ ቅዱሳዊ ፈሊጥ በቀጥታ ይጠብቃል፤ የተፈጥሯዊው ፍቺ በማስታወሻ ተገልጿል።
- source_word: διὰ τοὺς ἐκλεκτούς
  choice: ስለ ተመረጡት ሰዎች
  rationale: διά ከተሳቢ ጋር የሚገልጠውን ‘ስለ እነርሱ/ለእነርሱ ሲል’ የሚለውን ምክንያትና ጥቅም በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: ἐκλεκτούς
  choice: የተመረጡት ሰዎች
  rationale: የመመረጥን ሐሳብ በግልጽ ቋንቋ ይጠብቃል፤ ስለ ምርጫው ባሕርይ ወይም ወሰን ከጽሑፉ በላይ የሆነ አስተምህሮ አያክልም።
- source_word: οὓς ἐξελέξατο
  choice: መረጣቸው
  rationale: የἐκλεκτούς እና ἐξελέξατοን ሥርወ-ቃላዊ ትስስር ‘ተመረጡት/መረጣቸው’ በሚል ይጠብቃል።
theological_decisions:
- issue: በዚህ አውድ ‘መዳን’ የሚለው ትርጉም
  choice: ዋናው የአውድ ፍቺ በመከራው ወቅት የሰው ሕይወት ከጥፋት መጠበቅ ሲሆን፣ በዋናው ጽሑፍ ‘መዳን’ ተጠብቋል።
  alternative: ጽሑፉን ስለ ዘላለማዊ መንፈሳዊ ድነት ብቻ እንደሚናገር መተርጎም።
  rationale: አውዱ ቀኖቹ ባያጥሩ ሰዎች እንደሚጠፉ ይናገራል፤ ሆኖም σῴζωን ‘መትረፍ’ ብቻ ብሎ ማጥበብ የቃሉን ስፋት ያሳንሳል።
- issue: ‘የተመረጡት’ ማንነት
  choice: ጽሑፉ እንደሚለው በጌታ የተመረጡ ሰዎች ተብለው ቀርበዋል፤ የምርጫው አይነትና ወሰን አልተገደበም።
  alternative: ምርጫውን በግለሰባዊ ቅድመ ውሳኔ ወይም በማኅበራዊ ምርጫ ብቻ ላይ በግልጽ ማስገደድ።
  rationale: ቁጥሩ የተመረጡ ሰዎችን ይጠቅሳል፣ ነገር ግን ሰፊውን የምርጫ ክርክር አይፈታም፤ ትርጉሙም ይህን ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ የሚገባ መደበኛ አማርኛ ተጠቅሟል። ‘አንድም ሥጋ’ የሚለው ሐረግ የምንጩን መጽሐፍ ቅዱሳዊ ፈሊጥ ለመጠበቅ ሆን ተብሎ ቀርቧል፣ ተፈጥሯዊ ፍቺውም በ[a] ተብራርቷል።
