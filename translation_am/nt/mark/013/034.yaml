  rationale: በቤት ዐውድ ውስጥ በሩን የሚጠብቀውን ሰው በግልጽ ዘመናዊ አማርኛ ይገልጻል።
- source_word: ἐνετείλατο ἵνα γρηγορῇ
  choice: ነቅቶ እንዲቆይ አዘዘው
  rationale: የትእዛዙን ጥንካሬና γρηγορέω የሚለውን ቃል ቀጥተኛ የንቃት ምስል ይጠብቃል።
