  rationale: የተሰጠ የማዘዝና የመፈጸም መብትን የሚገልጸውን የቃሉን ዋና ፍቺ ይይዛል።
- source_word: ἑκάστῳ τὸ ἔργον αὐτοῦ
  choice: ለእያንዳንዳቸውም የየራሳቸውን ሥራ
