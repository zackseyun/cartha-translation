  text: ወንድም ወንድሙን ለሞት አሳልፎ ይሰጣል[a]፤ አባትም ልጁን እንዲሁ ያደርጋል፤ ልጆችም በወላጆቻቸው ላይ ይነሳሉ፤ ይገድሏቸዋል[b]።
  philosophy: optimal-equivalence
  footnotes:
