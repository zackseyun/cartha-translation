  rationale: θανατόω የሞት ፍርድን ወይም ሰውን እስከ ሞት የማድረስን ትርጉም ስለሚይዝ፣ ይህ አገላለጽ ከቀላሉ “ይገድሏቸዋል” ይልቅ የስደትና የፍርድ ዐውዱን ይጠብቃል።
