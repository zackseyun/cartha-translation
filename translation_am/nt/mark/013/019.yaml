  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἔσονται γὰρ αἱ ἡμέραι ἐκεῖναι θλῖψις οἵα οὐ γέγονεν τοιαύτη ἀπ’ ἀρχῆς κτίσεως ⸀ἣν ἔκτισεν ὁ θεὸς ἕως τοῦ νῦν καὶ οὐ μὴ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/019.yaml
  text: For those days will be a tribulation such as has not been from the beginning of the creation that God created until now[a], and never will be.
translation:
  language: am
  text: ምክንያቱም በእነዚያ ቀኖች፣ እግዚአብሔር ከፈጠረው ፍጥረት መጀመሪያ አንስቶ እስከ አሁን ድረስ እንደዚያ ያልሆነ፣ ወደፊትም ፈጽሞ የማይሆን መከራ ይሆናል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በእነዚያ ቀኖች፣ እግዚአብሔር ከፈጠረው ፍጥረት መጀመሪያ አንስቶ እስከ አሁን ድረስ እንደዚያ ያለ መከራ ከቶ አልሆነም፤ ወደፊትም ፈጽሞ አይሆንም።»
    reason: የግሪኩን ጥቅጥቅ ያለ ተሳቢ አወቃቀር በተሟላ የአማርኛ ዓረፍተ ነገር የሚያቀርብ፣ γίνομαιንም «መሆን» ብሎ የሚያሳይ አማራጭ አገላለጽ።
lexical_decisions:
- source_word: θλῖψις
  choice: መከራ
  rationale: ቃሉ ከባድ ጭንቀትንና ሥቃይን የሚያመለክት ሲሆን፣ «መከራ» በዚህ የፍጻሜ ዘመን ንግግር ውስጥ ያለውን ክብደት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: οἵα οὐ γέγονεν τοιαύτη
  choice: ያልነበረ … እንዲህ ያለ
  rationale: የግሪኩን ንጽጽራዊ አገላለጽና የመከራውን ልዩነት ይጠብቃል፤ ከዚህ ቀደም እንደሱ ያለ ነገር አለመኖሩን ያሳያል።
- source_word: ἀπ’ ἀρχῆς κτίσεως
  choice: ከ… ፍጥረት መጀመሪያ አንስቶ
  rationale: κτίσιςን «ፍጥረት» ብሎ በግልጽ በመተርጎም የፍጥረትን መጀመሪያ እንደ ጊዜ መነሻ ያቀርባል።
- source_word: ἣν ἔκτισεν ὁ θεὸς
  choice: እግዚአብሔር ከፈጠረው
  rationale: በግሪኩ ያለውን የዘመድ አረፍተ ነገርና እግዚአብሔር ፈጣሪ መሆኑን በግልጽ ይጠብቃል።
- source_word: ἕως τοῦ νῦν
  choice: እስከ አሁን
  rationale: የግሪኩን የጊዜ ገደብ ቀጥተኛና ተፈጥሯዊ በሆነ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: οὐ μὴ γένηται
  choice: ወደፊትም ፈጽሞ የማይኖር
  rationale: οὐ μή ያለውን ጠንካራ የወደፊት እምቢታ «ፈጽሞ» በማለት ይገልጣል፤ በምንጩ የሌለውን «እንደገና» የሚል ቃል አይጨምርም።
- source_word: ἔσονται … αἱ ἡμέραι ἐκεῖναι θλῖψις
  choice: እነዚያ ቀኖች … መከራ የሚሆንባቸው ይሆናሉ
  rationale: የግሪኩን ጥቅጥቅ ያለ የስም ተሳቢ አወቃቀር በተፈጥሯዊ አማርኛ ይፈታል፣ ነገር ግን «እነዚያ ቀኖች»ን የዋናው አረፍተ ነገር ርዕሰ ጉዳይ አድርጎ ይጠብቃል።
theological_decisions:
- issue: የ«ፍጥረት» አገላለጽ ወሰን
  choice: «እግዚአብሔር ከፈጠረው ፍጥረት መጀመሪያ» ተብሎ የፍጥረት አገላለጹ በግልጽ ተጠብቋል።
  alternative: «ከዓለም መጀመሪያ» ወይም በአካባቢያዊ/ቃል ኪዳናዊ መጀመሪያ ብቻ መገደብ።
  rationale: ምንጩ κτίσιςንና κτίζωን በአንድነት ይጠቀማል፤ ትርጉሙም ይህን ድግግሞሽና እግዚአብሔርን እንደ ፈጣሪ የሚጠቅሰውን አገላለጽ ያለ ሥነ መለኮታዊ ማጥበብ ይጠብቃል።
- issue: የመጨረሻው እምቢታ ጥንካሬ
  choice: «ወደፊትም ፈጽሞ የማይኖር»
  alternative: «እንደገናም አይሆንም»
  rationale: ጠንካራውን οὐ μή ይጠብቃል፣ ሆኖም በግሪኩ ያልተገለጸውን «እንደገና» አይጨምርም፤ የ«መሆን/መኖር» ስፋትም እንዳለ ይተዋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «መከራ» መጽሐፍ ቅዱሳዊ ክብደቱን ሳያጣ በዘመናዊ ንግግርም የሚገባ ነው።
