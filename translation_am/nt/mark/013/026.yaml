  text: καὶ τότε ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν νεφέλαις μετὰ δυνάμεως πολλῆς καὶ δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/026.yaml
  text: And then they will see the Son of Man coming in the clouds with great power and glory[a].
translation:
  language: am
  text: ከዚያም የሰው ልጅ በታላቅ ኃይልና ክብር በደመናዎች ሲመጣ ያዩታል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከደመናዎች ጋር ሲመጣ።” ግሪክኛው “በደመናዎች” ይላል፤ አማራጩ ግን ዳንኤል 7፥13ን የሚያስተጋባውን ምስል ይበልጥ ያጎላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: ያዩታል
  rationale: የግስ ቅርጹን ቀጥተኛ የወደፊት ጊዜ ትርጉም በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል፤ ድርጊቱ በግልጽ እንደሚታይም ይጠብቃል።
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: የሰው ልጅ
  rationale: በአማርኛ መጽሐፍ ቅዱሳዊ አጠቃቀም የታወቀውን መጠሪያ ይጠብቃል፤ ከዳንኤል 7 ጋር ያለውን ግንኙነትም ሳይፈታ ያስቀራል።
- source_word: ἐρχόμενον
  choice: ሲመጣ
  rationale: ተሳቢው ዋናውን ስም እንደሚገልጽ በተፈጥሯዊ አማርኛ ያሳያል፤ ‘መምጣት’ የሚለውን ራእያዊ ቃናም ይጠብቃል።
- source_word: ἐν νεφέλαις
  choice: በደመናዎች
  rationale: ἐν የሚያመለክተውን ቦታዊ ወይም አጃቢ ምስል ሳያጠብ የብዙ ቁጥር νεφέλαιςን ያስተላልፋል። ‘ከደመናዎች ጋር’ የሚለው የዳንኤል 7፥13ን ድምፅ ይበልጥ ሊያጎላ ስለሚችል በማስታወሻ ቀርቧል።
- source_word: μετὰ δυνάμεως πολλῆς
  choice: በታላቅ ኃይል
  rationale: μετά ከዝርያ ቅርጽ ጋር የሚገልጸውን አብሮነት በአማርኛው መሣሪያዊ/አጃቢ ‘በ’ ያስተላልፋል፤ πολλῆςም ‘ታላቅ’ በሚለው ተፈጥሯዊ አገላለጽ ተተርጉሟል።
- source_word: καὶ δόξης
  choice: እና ክብር
  rationale: δόξα በዚህ ራእያዊ አውድ ያለውን የተገለጠ ግርማና ማዕረግ ‘ክብር’ በሚለው የተለመደ መጽሐፍ ቅዱሳዊ ቃል ይጠብቃል።
theological_decisions:
- issue: ራእያዊው መጠሪያና የደመና ምስል
  choice: ‘የሰው ልጅ’ የሚለውን መጠሪያና በደመናዎች የመምጣቱን ምስል ያለ ትርጓሜያዊ ማስፋፊያ መጠበቅ
  alternative: መጠሪያውን ‘ሰው የሆነው’ ብሎ በነፃ መተርጎም ወይም የዳንኤል 7ን ጥቅስ በዋናው ጽሑፍ በግልጽ ማብራራት
  rationale: ጥቅሱ ዳንኤል 7፥13ን በጠንካራ ሁኔታ ያስተጋባል፤ ሆኖም ትርጉሙ ይህን ግንኙነት ከማብራራት ይልቅ ሊጠብቀው ይገባል። የታወቀው መጠሪያም በጽሑፉ ያለውን ክርስቶሳዊና የፍጻሜ ዘመን ውጥረት አያጠፋም።
translation_notes:
  register: ዘመናዊ፣ የተፈጥሮ ፍሰት ያለውና ክብር የጠበቀ መደበኛ አማርኛ ተጠቅሟል። የግሪክኛው የቃላት ቅደም ተከተል ለአማርኛ ተፈጥሯዊነት ተስተካክሏል፤ ነገር ግን ራእያዊው ቃናና የዳንኤል 7 ጥላ ተጠብቀዋል።
