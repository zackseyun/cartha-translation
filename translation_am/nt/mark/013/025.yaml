  text: καὶ οἱ ἀστέρες ⸂ἔσονται ἐκ τοῦ οὐρανοῦ πίπτοντες⸃, καὶ αἱ δυνάμεις αἱ ἐν τοῖς οὐρανοῖς σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/025.yaml
  text: And the stars will be falling from heaven[b][a], and the powers in the heavens will be shaken.
translation:
  language: am
  text: ከዋክብትም ከሰማይ[a] ይወድቃሉ፤ በሰማያትም ያሉት ኃይላት[b] ይናወጣሉ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከሚታየው ሰማይ።” የግሪኩ οὐρανός እንደ ዐውዱ “ሰማይ” ወይም የምድር በላይ የሚታየውን ሰማይ ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “በሰማያት ያሉት ኃይላት” ሰማያዊ ፍጥረታትን፣ የፍጥረተ ዓለም ኃይሎችን ወይም የሰማያትን ሥርዓቶች ሊያመለክት ይችላል፤ የግሪኩ አገላለጽ ከዚህ የበለጠ አይወስንም።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀστέρες
  choice: ከዋክብት
  rationale: የግሪኩን ቃል የተለመደ የሥነ ፈለክ ትርጉም በተፈጥሯዊና በክብር ያቀርባል።
- source_word: ἔσονται ... πίπτοντες
  choice: ይወድቃሉ
  rationale: የወደፊት ጊዜውን ቀጣይና ሕያው ድርጊት በአማርኛ ተፈጥሯዊ በሆነ መንገድ ያሳያል፤ የግሪኩ ግስ አወቃቀር በአማርኛ በቃል በቃል ቢቀርብ ይከብዳል።
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: ከሰማይ
  rationale: የፍጥረተ ዓለምና የራእይ ንግግሩን ክብር ይጠብቃል፤ οὐρανός ደግሞ እንደ ዐውዱ ‘ሰማይ’ ወይም ‘የሚታየው ሰማይ’ ሊሆን ስለሚችል አማራጩ በማስታወሻ ተጠቅሷል።
- source_word: δυνάμεις
  choice: ኃይላት
  rationale: ሰማያዊ ፍጥረታትን፣ የፍጥረተ ዓለም ኃይሎችን ወይም የሰማያትን ሥርዓቶች ሊያመለክት የሚችለውን ሰፊ ትርጉም ሳይገድብ ይጠብቃል።
- source_word: αἱ ἐν τοῖς οὐρανοῖς
  choice: በሰማያትም ያሉት
  rationale: በግሪኩ ያለውን ብዙ ቁጥር ‘ሰማያት’ በማቆየት የንግግሩን ሰፊ የፍጥረተ ዓለም ዐውድ ያሳያል።
- source_word: σαλευθήσονται
  choice: ይናወጣሉ
  rationale: የወደፊት ጊዜ ተገብሮ ትርጉሙን በተፈጥሯዊ አማርኛ ያቀርባል፤ ‘መናወጥ’ ከአካላዊ መንቀጥቀጥ ባሻገር የሥርዓት መታወክንም ሊይዝ ይችላል።
theological_decisions:
- issue: ‘በሰማያት ያሉት ኃይላት’ ምንነት
  choice: ማንነታቸውን ሳይወስን ‘በሰማያት ያሉት ኃይላት’ ተብሎ ተተርጉሟል።
  alternative: ‘ሰማያዊ ኃይላት’ ማለትም መላእክታዊ ፍጥረታት፣ ወይም ‘የሰማያት ኃይሎች’ ማለትም የፍጥረተ ዓለም ኃይሎችና ሥርዓቶች።
  rationale: የግሪኩ ሐረግ ሰፊና ያልተወሰነ ነው፤ የራእይ ዐውዱም ከእነዚህ አንዱን ብቻ እንድንመርጥ አያስገድድም። ስለዚህ ጽሑፉ የተወው አሻሚነት ተጠብቋል።
