  text: καὶ εἰς πάντα τὰ ἔθνη ⸂πρῶτον δεῖ⸃ κηρυχθῆναι τὸ εὐαγγέλιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/010.yaml
  text: And the good news must first be proclaimed to all the nations[a][b].
translation:
  language: am
  text: እናም የምሥራቹ ቃል[a] አስቀድሞ ለሕዝቦች ሁሉ[b] መታወጅ አለበት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ወንጌል።” የግሪኩ εὐαγγέλιον ቃል በቀጥታ “የምሥራች” ወይም “መልካም ዜና” ማለት ነው።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በሕዝቦች ሁሉ መካከል።” ἔθνη በአንዳንድ አውዶች “አሕዛብን” ወይም “ከአይሁድ ውጭ ያሉ ሕዝቦችን” ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: ደግሞም
  rationale: ንግግሩን ከቀደመው ሐሳብ ጋር ያገናኛል፤ በዚህ አውድ ተቃርኖን ሳይጨምር የቀጣይነት ኃይሉን ያሳያል።
- source_word: εἰς πάντα τὰ ἔθνη
  choice: ለአሕዛብ ሁሉ
  rationale: εἰς የአዋጁን አቅጣጫና ወሰን ያሳያል፤ ἔθνη ደግሞ ሕዝቦችን ወይም አሕዛብን ሊያመለክት ይችላል። ይህ አተረጓጎም በአማርኛ የተለመደውን መጽሐፍ ቅዱሳዊ ቃል በመጠቀም የሁሉንም ስፋት ይጠብቃል።
- source_word: πρῶτον
  choice: አስቀድሞ
  rationale: በንግግሩ ውስጥ ያለውን የጊዜ ቅድሚያ በተፈጥሯዊ አማርኛ ይገልጣል፤ ተጨማሪ የዘመን ቅደም ተከተል ትርጓሜ አያስገባም።
- source_word: δεῖ
  choice: መሰበክ አለበት
  rationale: የግድነትን ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል፤ የግድነቱን ምንጭ ግን ጽሑፉ ከሚለው በላይ አይገልጽም።
- source_word: κηρυχθῆναι
  choice: መሰበክ
  rationale: የግሱን ይፋዊ አዋጅ ሐሳብ ይይዛል፤ በአማርኛም መልእክትን በይፋ ማወጅን ለመግለጽ የተለመደና ግልጽ ነው።
- source_word: τὸ εὐαγγέλιον
  choice: የምሥራቹ ቃል
  rationale: የεὐαγγέλιονን ‘መልካም ዜና’ ትርጉም በተፈጥሯዊና በሰፊው በሚታወቅ ዘመናዊ አማርኛ ያቀርባል፤ ባህላዊው ‘ወንጌል’ በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: የἔθνη ወሰን
  choice: ለአሕዛብ ሁሉ
  alternative: በሕዝቦች ሁሉ መካከል፤ ለብሔራት ሁሉ
  rationale: ቃሉ ሕዝቦችን/ብሔራትን በአጠቃላይ ወይም ከአይሁድ ውጭ ያሉትን አሕዛብ ሊያመለክት ይችላል። ‘ሁሉ’ ዓለም አቀፉን ስፋት ይጠብቃል፤ አማራጩም በማስታወሻ ተገልጿል።
- issue: የδεῖ ኃይል
  choice: መሰበክ አለበት
  alternative: መሰበኩ የግድ ነው
  rationale: ግሪኩ ጠንካራ ግድነትን ይገልጣል፤ የግድነቱን ምንጭ ግን በዚህ ጥቅስ በግልጽ ስለማይጠቅስ፣ ትርጉሙ መለኮታዊ ዕቅድ የሚል ማብራሪያ አልጨመረም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘የምሥራቹ ቃል’ የቃሉን ትርጉም በግልጽ ያቀርባል፤ ‘ወንጌል’ የሚለው የታወቀ ባህላዊ አማራጭ በማስታወሻ ተቀምጧል።
