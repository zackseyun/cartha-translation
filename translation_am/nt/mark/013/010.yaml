review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the temporal priority (πρῶτον) and necessity (δεῖ). However, አሕዛብ in the main text conventionally tends toward “Gentiles” in Amharic and can narrow the broad/global sense of πάντα τὰ ἔθνη. The passive public-proclamation force of κηρυχθῆναι is more directly represented by መታወጅ than by መሰበክ.
  naturalness: The revised wording is modern, clear, and appropriately dignified. ለሕዝቦች ሁሉ and መታወጅ አለበት are natural in this register.
  terminology: የምሥራቹ ቃል suitably communicates εὐαγγέλιον, while “ወንጌል” remains available in a lexical footnote. Rendering ἔθνη as ሕዝቦች in the text preserves its broad referent without deciding the contextual “Gentiles” sense.
  issues:
  - severity: medium
    issue: The main-text rendering ለአሕዛብ ሁሉ may be heard as “to all the Gentiles.”
    rationale: Although ἔθνη can mean “Gentiles,” in this context the source and audit trail retain the broader sense “all the nations.” ለሕዝቦች ሁሉ preserves that scope; the possible Gentile sense should remain in the note.
  - severity: low
    issue: መሰበክ is less specific than the source’s public-proclamation nuance.
    rationale: κηρυχθῆναι is a passive infinitive for proclamation/heralding. መታወጅ more directly preserves the public announcement sense without restricting it to church preaching.
