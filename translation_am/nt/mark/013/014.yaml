  text: But when you see the abomination of desolation standing where it ought not to be (let the reader understand)[a], then let those in Judea flee to the mountains[b],
translation:
  language: am
  text: 'ነገር ግን፣ የጥፋት ርኩሰት ሊቆምበት በማይገባው ስፍራ ቆሞ ስታዩ (አንባቢው ያስተውል)[a]፣ በዚያን ጊዜ በይሁዳ ያሉት ወደ ተራሮች ይሽሹ[b]።


    [a] ወይም፣ “እርሱ ሊቆምበት በማይገባው ስፍራ ቆሞ።” በግሪክኛው “ቆሞ” የሚለው ተካፋይ ቃል ተባዕታይ ነው፤ ይህም ከ“ርኩሰት” አገላለጽ በስተጀርባ ሰዋዊ ማጣቀሻ ሊኖር እንደሚችል ሊጠቁም ይችላል።


    [b] “የጥፋት ርኩሰት” የሚለው አገላለጽ በዳንኤል መጽሐፍ የሚገኘውን ቋንቋ ያስተጋባል (ዳን. 9፥27፤ 11፥31፤ 12፥11 ይመልከቱ)።'
  philosophy: optimal-equivalence
