base_translation:
  language: en
  yaml_path: translation/nt/mark/013/027.yaml
  text: And then he will send out the angels and gather the chosen ones from the four winds[c][b][a], from the end of the earth to the end of heaven.
translation:
  language: am
  text: ከዚያም መላእክቱን ይልካል፤ ከአራቱ ነፋሳት[b]፣ ከምድር ዳርቻ እስከ ሰማይ ዳርቻ ድረስ[c] የተመረጡትን[a] ይሰበስባል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በባህላዊ አገላለጽ፣ “ምርጦቹን” ሊባል ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “ከአራቱ ነፋሳት” ማለት ከሁሉም አቅጣጫዎች ማለት ነው።
    reason: cultural_note
