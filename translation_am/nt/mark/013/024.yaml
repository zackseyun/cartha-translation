- source_word: ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς
  choice: ጨረቃም ብርሃኗን አትሰጥም
  rationale: δίδωμι ያለውን ‘መስጠት’ ምስላዊ አገላለጽ ይጠብቃል፤ φέγγοςንም በተለመደው ‘ብርሃን’ ይተረጉማል።
