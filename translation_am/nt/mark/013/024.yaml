- source_word: μετὰ τὴν θλῖψιν ἐκείνην
  choice: ከዚያ መከራ በኋላ
  rationale: μετάን በጊዜያዊ ትርጉሙ ‘በኋላ’ ብሎ ያቀርባል፤ ‘መከራ’ም θλῖψις በዚህ የፍጻሜ ዘመን ንግግር ያለውን ክብደት ያለ ትምህርታዊ ሥርዓት ጭማሪ ይገልጣል።
