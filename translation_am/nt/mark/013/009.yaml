review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the warning, handing over to local councils, beatings in synagogues, appearance before governors and kings, and the causal force of “because of me.” However, its final independent sentence (“ይህም ... ይሆናል”) slightly recasts the Greek purpose/result phrase εἰς μαρτύριον αὐτοῖς. A direct Amharic purpose construction better preserves the source syntax and relation to standing before authorities.
  naturalness: The Amharic is clear, modern, and appropriately dignified. “ሸንጎዎች,” “ምኩራቦች,” and “ትደበደባላችሁ” are natural and suitable. Rejoining the final clause to the preceding sentence improves flow and makes its function clearer.
  terminology: 'Key terms are well chosen: “አሳልፈው ይሰጧችኋል” retains the juridical sense of παραδώσουσιν; “ሸንጎዎች” preserves the plural and avoids identifying every council with the Jerusalem Sanhedrin; and “ምስክርነት” appropriately renders μαρτύριον without imposing a condemnatory sense. The footnote properly preserves the possible adversative nuance.'
  issues:
  - severity: low
    issue: The witness clause is presented as a separate result statement.
    rationale: εἰς μαρτύριον αὐτοῖς most directly qualifies the disciples’ standing before governors and kings, expressing its purpose or function. Rendering it as “ይህም ... ይሆናል” is not materially wrong, but “... ምስክርነት እንዲሆን ትቆማላችሁ” more closely reflects the Greek relationship.
