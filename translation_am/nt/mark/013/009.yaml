id: MRK.13.9
reference: Mark 13:9
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: βλέπετε δὲ ὑμεῖς ἑαυτούς· ⸀παραδώσουσιν ὑμᾶς εἰς συνέδρια καὶ εἰς συναγωγὰς δαρήσεσθε καὶ ἐπὶ ἡγεμόνων καὶ βασιλέων σταθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/009.yaml
  text: But watch yourselves. They will hand you over to councils[a], and you will be beaten in synagogues, and you will stand before governors and kings because of me, as a testimony to them.
translation:
  language: am
  text: እናንተ ግን ራሳችሁን ተጠንቀቁ። ለሸንጎዎች አሳልፈው ይሰጧችኋል፤ በምኩራቦችም ትደበደባላችሁ፤ ስለ እኔም በገዥዎችና በነገሥታት ፊት ለእነርሱ ምስክርነት[a] እንዲሆን ትቆማላችሁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለእነርሱ ምስክር እንዲሆን።” ሐረጉ “በእነርሱ ላይ ምስክርነት እንዲሆን” የሚል ፍቺም ሊኖረው ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: βλέπετε δὲ ὑμεῖς ἑαυτούς
  choice: እናንተ ግን ራሳችሁን ተጠንቀቁ
  rationale: የአሁን ጊዜው ትእዛዝ ቀጣይ ንቃትን ይጠይቃል፤ ግልጽ ተውላጠ ስሙና አንጸባራቂው ቅርጽ ያላቸውን አጽንዖት ‘እናንተ’ እና ‘ራሳችሁን’ ያቆያሉ።
- source_word: παραδώσουσιν ὑμᾶς
  choice: አሳልፈው ይሰጧችኋል
  rationale: በዚህ የስደትና የፍርድ አውድ ለባለሥልጣናት አሳልፎ መስጠትን ይገልጣል፤ የግድ ክህደትን አያስገባም።
- source_word: συνέδρια
  choice: ሸንጎዎች
  rationale: ብዙ ቁጥሩን በማቆየት የአካባቢ የአስተዳደርና የፍርድ ምክር ቤቶችን ያመለክታል፤ የኢየሩሳሌሙን ሸንጎ ብቻ አይወስንም።
- source_word: συναγωγάς
  choice: ምኩራቦች
  rationale: የአይሁድን የስብሰባና የአምልኮ ቦታ የሚገልጽ የተለመደ አማርኛ ቃል ነው።
- source_word: δαρήσεσθε
  choice: ትደበደባላችሁ
  rationale: የወደፊት ጊዜ ተደራጊ ቅርጹንና አካላዊ ድብደባውን በቀጥታ ይገልጣል፤ የመግረፊያውን ዘዴ ከምንጩ በላይ አይወስንም።
- source_word: ἐπὶ ἡγεμόνων καὶ βασιλέων σταθήσεσθε
  choice: በገዥዎችና በነገሥታት ፊት ትቆማላችሁ
  rationale: በባለሥልጣናት ፊት ለመቅረብ ያለውን ፍርዳዊ ሁኔታ ይገልጣል፤ ሁለቱን የሥልጣን መደቦችም ይለያል።
- source_word: ἕνεκεν ἐμοῦ
  choice: ስለ እኔ
  rationale: ከኢየሱስ ጋር ያላቸው ቁርኝት ለስደቱና በባለሥልጣናት ፊት ለመቅረባቸው ምክንያት መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: ይህም ለእነርሱ ምስክርነት ይሆናል
  rationale: መቅረባቸው ለባለሥልጣናቱ የሚደርስ ምስክርነት መሆኑን ያቆያል፤ የዓላማ ወይም የውጤት ጥላ ትርጉሙን አይዘጋም።
theological_decisions:
- issue: የεἰς μαρτύριον αὐτοῖς አቅጣጫና ኃይል
  choice: የደቀ መዛሙርቱ በግድ በገዥዎች ፊት መቅረብ ለእነዚያ ገዥዎች ምስክርነት ይሆናል።
  alternative: ምስክርነቱ በፍርድ ስሜት በእነርሱ ላይ ወይም በእነርሱ ላይ የሚመሰክር ነው።
  rationale: αὐτοῖς በቀጥታ ‘ለእነርሱ’ ሊባል ይችላል፤ አውዱ የክስ ምስክርነትን ሊያካትት ቢችልም የግድ አያስገድደውም። ዋናው ጽሑፍ ሰፊውን ትርጉም ይጠብቃል፣ አማራጩም በማስታወሻ ይቀርባል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ አማርኛን ይጠቀማል። ‘ሸንጎዎች’ ባህላዊ የመጽሐፍ ቅዱስ ቃል ቢሆንም በዚህ አውድ የአካባቢ ፍርድ ሰጪ ምክር ቤቶችን በአጭሩ ያስተላልፋል። የእንግሊዝኛው ማስታወሻ ምልክት ከ‘councils’ በኋላ ቢታይም ይዘቱ εἰς μαρτύριον αὐτοῖςን ስለሚመለከት [a] በ‘ምስክርነት’ ላይ ተቀምጧል።
