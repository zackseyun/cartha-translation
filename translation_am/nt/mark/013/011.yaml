id: MRK.13.11
reference: Mark 13:11
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸂καὶ ὅταν⸃ ⸀ἄγωσιν ὑμᾶς παραδιδόντες, μὴ προμεριμνᾶτε τί ⸀λαλήσητε, ἀλλ’ ὃ ἐὰν δοθῇ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τοῦτο λαλεῖτε, οὐ γάρ ἐστε ὑμεῖς οἱ λαλοῦντες ἀλλὰ τὸ πνεῦμα τὸ ἅγιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/011.yaml
  text: And when they lead you away and hand you over[a], do not worry beforehand about what you should say; but whatever is given to you in that hour, speak that. For it is not you who are speaking[b], but the Holy Spirit.
translation:
  language: am
  text: ሲወስዷችሁና አሳልፈው ሲሰጧችሁ፣[a] ምን እንደምትናገሩ አስቀድማችሁ አትጨነቁ፤ ነገር ግን በዚያች ሰዓት የሚሰጣችሁን ያንኑ ተናገሩ። የሚናገሩት እናንተ አይደላችሁምና፤ መንፈስ ቅዱስ ነው እንጂ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እየወሰዷችሁ አሳልፈው ሲሰጧችሁ።” የግሪክ አገላለጹ ዋናውን ግስና አብሮት የሚከናወነውን ድርጊት በአሳታፊ ቅርጽ ያገናኛል።
    reason: syntactic_alternative
lexical_decisions:
- source_word: καὶ ὅταν
  choice: እነርሱም ... ሲመጡ
  rationale: የወደፊት ሁኔታን ከቀደመው ንግግር ጋር በተፈጥሯዊ አማርኛ ያገናኛል፤ የግሪኩን ጊዜያዊና ሁኔታዊ ኃይል ይጠብቃል።
- source_word: ἄγωσιν ὑμᾶς παραδιδόντες
  choice: ሊወስዷችሁና አሳልፈው ሊሰጧችሁ ሲመጡ
  rationale: ἄγω የግዳጅ መወሰድን፣ παραδίδωμι ደግሞ ለባለሥልጣናት አሳልፎ መስጠትን ያመለክታሉ። የአማርኛው አገላለጽ ሁለቱንም እርምጃዎች በተፈጥሯዊ ቅንብር ይይዛል።
- source_word: μὴ προμεριμνᾶτε
  choice: አስቀድማችሁ አትጨነቁ
  rationale: የግሱን ቀድሞ በጭንቀት መያዝ የሚለውን ጊዜያዊና ስሜታዊ ኃይል በግልጽ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: τί λαλήσητε
  choice: ምን እንደምትናገሩ
  rationale: λαλέω በዚህ አውድ ‘መናገር’ ነው፤ አገላለጹ በአማርኛ ተፈጥሯዊ ሲሆን በቀጣዩ ትእዛዝ ያለውን የቃል ድግግሞሽም ይጠብቃል።
- source_word: ὃ ἐὰν δοθῇ ὑμῖν
  choice: የሚሰጣችሁን
  rationale: ሰጪውን ሳይጠቅስ የግሪኩን ተደራጊ ቅርጽና ክፍት የመለኮታዊ አቅርቦት ፍንጭ ይጠብቃል።
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: በዚያች ሰዓት
  rationale: የግሪኩን የተወሰነና ወሳኝ ጊዜ አገላለጽ በክብር ይጠብቃል።
- source_word: τοῦτο λαλεῖτε
  choice: ያንኑ ተናገሩ
  rationale: ያንኑ የሚለው ተውላጠ ስም τοῦτο ያለውን አጽንዖት—የተሰጣችሁን በትክክል ተናገሩ—በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οὐ γάρ ἐστε ὑμεῖς οἱ λαλοῦντες
  choice: የምትናገሩት እናንተ ሳትሆኑ
  rationale: ὑμεῖς ላይ ያለውን አጽንዖትና ከመንፈስ ቅዱስ ጋር ያለውን ተቃርኖ በግልጽ የአማርኛ አወቃቀር ይጠብቃል።
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: መንፈስ ቅዱስ
  rationale: የተለመደው፣ ዘመናዊና ክብር ያለው የአማርኛ ስያሜ ነው።
theological_decisions:
- issue: በስደት ጊዜ የሚነገረው ንግግር ወኪልነት
  choice: ደቀ መዛሙርቱ እንዲናገሩ ታዘዋል፤ የሚናገሩት ግን ይሰጣቸዋል፣ የንግግሩም ዋና ምንጭ መንፈስ ቅዱስ መሆኑ ተገልጿል።
  alternative: ደቀ መዛሙርቱ ፈጽሞ ተገብሮአዊ መሣሪያዎች ብቻ ናቸው የሚል የቃል በቃል ማስጻፍ አመለካከት፣ ወይም ‘መንፈስ ቅዱስ’ን አጠቃላይ መለኮታዊ ተጽዕኖ ብቻ አድርጎ ማየት።
  rationale: ግሪኩ የሰውን እውነተኛ ንግግርና የመንፈስ ቅዱስን ዋና ወኪልነት አንድ ላይ ይይዛል። ትርጉሙ ይህን ውጥረት ወደ አንዱ ሳያዘነብል ጠብቆታል።
- issue: ያልተጠቀሰው ሰጪ
  choice: ‘የሚሰጣችሁን’ የሚለው ተደራጊ አገላለጽ ተጠብቋል።
  alternative: ‘እግዚአብሔር የሚሰጣችሁን’ ወይም ‘መንፈስ ቅዱስ የሚሰጣችሁን’ ብሎ ሰጪውን በግልጽ መጨመር።
  rationale: አውዱ መለኮታዊ አቅርቦትን ቢጠቁምም የግሪክ ጽሑፉ ሰጪውን በዚህ ሐረግ አይሰይምም፤ ስለዚህ አሻሚነቱ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። ‘አሳልፈው ሊሰጧችሁ’ የሕጋዊ/የባለሥልጣን አውድን ይጠብቃል፤ ‘በዚያች ሰዓት’ ደግሞ የጽሑፉን ክብደት ሳያጣ ለዘመናዊ አንባቢ ግልጽ ነው።
