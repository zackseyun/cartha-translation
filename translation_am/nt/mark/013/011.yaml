review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the principal elements of the Greek: coercive leading and handing over, prohibition of advance anxiety, the unspecified passive provision of speech, the decisive hour, and the contrast between the disciples and the Holy Spirit. However, “ሊወስዷችሁና አሳልፈው ሊሰጧችሁ ሲመጡ” means approximately “when they come in order to lead you and hand you over,” introducing ‘come’ (ሲመጡ), which is not present in the source and weakens the direct temporal action.'
  naturalness: The first temporal clause is unnecessarily periphrastic, and the final contrast is more natural and clear when framed as “it is not you who are speaking ... but the Holy Spirit.” The revision uses standard modern Amharic while retaining the verse’s formal, solemn register.
  terminology: “አሳልፈው መስጠት,” “አስቀድሞ መጨነቅ,” and “መንፈስ ቅዱስ” are appropriate. The passive “የሚሰጣችሁን” properly leaves the giver unnamed, as does the Greek.
  issues:
  - severity: medium
    issue: The opening clause adds the action ‘come’ (ሲመጡ).
    rationale: καὶ ὅταν ... ἄγωσιν ... παραδιδόντες directly describes the time when they lead and hand the disciples over; it does not say that they come to do so. Recasting the clause removes this added element.
  - severity: low
    issue: The final clause’s syntax is less direct than the Greek’s emphatic contrast.
    rationale: “የምትናገሩት እናንተ ሳትሆኑ” is understandable but can sound structurally strained. “የሚናገሩት እናንተ አይደላችሁም ...” communicates the contrast naturally without changing its theological tension.
  revised_text: ሲወስዷችሁና አሳልፈው ሲሰጧችሁ፣[a] ምን እንደምትናገሩ አስቀድማችሁ አትጨነቁ፤ ነገር ግን በዚያች ሰዓት የሚሰጣችሁን ያንኑ ተናገሩ። የሚናገሩት እናንተ አይደላችሁምና፤ መንፈስ ቅዱስ ነው እንጂ።
