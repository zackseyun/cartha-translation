id: MRK.13.21
reference: Mark 13:21
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀καὶ τότε ἐάν τις ὑμῖν εἴπῃ· ⸀Ἴδε ὧδε ὁ ⸀χριστός, ⸁Ἴδε ἐκεῖ, μὴ πιστεύετε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/021.yaml
  text: And then[a], if anyone says to you, ‘Look, here is the Messiah!’ or, ‘Look, there!’ do not believe it.
translation:
  language: am
  text: በዚያን ጊዜም ማንም፣ “እነሆ፣ መሲሑ[a] እዚህ ነው!” ወይም “እነሆ፣ እዚያ ነው!” ቢላችሁ፣ አትመኑ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ክርስቶስ።”
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ τότε
  choice: በዚያን ጊዜም
  rationale: የጊዜውን ቀጣይነት የሚያመለክተውን τότε እና ከቀደመው ንግግር ጋር የሚያያይዘውን καί በተፈጥሯዊ አማርኛ ያቆያል።
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: ማንም … ቢላችሁ
  rationale: አጠቃላይ ሁኔታዊ አገላለጹን እና ብዙ ተደራሲዎችን የሚያመለክተውን ὑμῖν በግልጽ ያሳያል።
- source_word: Ἴδε
  choice: እነሆ
  rationale: ትኩረት የሚስበውን ቃል በዘመናዊ የመጽሐፍ ቅዱስ አማርኛ የተለመደና ክብር ባለው አገላለጽ ያቀርባል።
- source_word: ὧδε
  choice: እዚህ
  rationale: የቅርብ ቦታ አመልካቹን ቀጥተኛና ተፈጥሯዊ በሆነ መንገድ ይተረጉማል።
- source_word: ὁ χριστός
  choice: መሲሑ
  rationale: በዚህ ክፍል χριστός እንደ ስም ሳይሆን እንደ ማዕረግ፣ ማለትም የተቀባው አዳኝ፣ ተጠቅሷል፤ የግሪኩን የተወሰነ አንቀጽም የአማርኛው -ው ያንጸባርቃል።
- source_word: ἐκεῖ
  choice: እዚያ
  rationale: ከእዚህ ጋር ያለውን የሩቅ ቦታ ንጽጽር በአጭሩ ይጠብቃል።
- source_word: μὴ πιστεύετε
  choice: አትመኑ
  rationale: የክልከላውን ብዙ ቁጥር ትእዛዝ በቀጥታ ያቀርባል፤ ግሪኩ የእምነቱን ቀጥተኛ ተሳቢ ስላልገለጸ አማርኛውም ተሳቢ አይጨምርም።
theological_decisions:
- issue: የΧριστός አተረጓጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: ዐውደ ንባቡ የመጨረሻውን ዘመን የሐሰት ጠያቂዎች ስለሚመለከት፣ ቃሉ የግል ስም መሰል አጠቃቀም ሳይሆን ማዕረግ ነው። “መሲሑ” ይህን የተቀባ አዳኝ ትርጉም ይጠብቃል፤ ባህላዊው “ክርስቶስ” በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። “እነሆ” የንግግሩን አስቸኳይ የትኩረት ጥሪ ሲጠብቅ፣ “ቢላችሁ፣ አትመኑ” ለብዙ ተደራሲዎች የተሰጠውን ማስጠንቀቂያ ተፈጥሯዊ አድርጎ ያቀርባል።
