- source_word: κατ’ ἰδίαν
  choice: ለብቻቸው
  rationale: ከሌሎች ተለይተው በግል እንደጠየቁት የሚያመለክት ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
- source_word: Πέτρος καὶ Ἰάκωβος καὶ Ἰωάννης καὶ Ἀνδρέας
  choice: ጴጥሮስ፣ ያዕቆብ፣ ዮሐንስና እንድርያስ
  rationale: ስሞቹ በአማርኛ የተለመዱትን መጽሐፍ ቅዱሳዊ ቅርጾች ይከተላሉ፤ የግሪኩን ተደጋጋሚ καὶ በቃል በቃል መድገም በዘመናዊ አማርኛ ከባድ ስለሚሆን ዝርዝሩ በሥርዓተ ነጥብና «እና» ቀርቧል።
