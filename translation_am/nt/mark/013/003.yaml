  text: Καὶ καθημένου αὐτοῦ εἰς τὸ Ὄρος τῶν Ἐλαιῶν κατέναντι τοῦ ἱεροῦ ⸀ἐπηρώτα αὐτὸν κατ’ ἰδίαν Πέτρος καὶ Ἰάκωβος καὶ Ἰωάννης καὶ Ἀνδρέας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/003.yaml
  text: And as he was sitting on the Mount of Olives opposite the temple, Peter and James and John and Andrew were asking him privately,
translation:
  language: am
  text: እርሱም ቤተ መቅደሱን[a] ትይዩ በደብረ ዘይት ተቀምጦ ሳለ፣ ጴጥሮስ፣ ያዕቆብ፣ ዮሐንስና እንድርያስ ለብቻቸው ይጠይቁት ነበር፤
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: እዚህ «ቤተ መቅደስ» ተብሎ የተተረጎመው የግሪኩ ἱερόν የቤተ መቅደሱን ሕንፃዎችና ግቢዎች በአጠቃላይ ያመለክታል፤ የውስጠኛውን መቅደስ ብቻ አያመለክትም።
    reason: lexical_alternative
lexical_decisions:
- source_word: καθημένου αὐτοῦ
  choice: እርሱም … ተቀምጦ ሳለ
  rationale: የግሪኩ የgenitive absolute አወቃቀር እየቀጠለ ያለውን የትዕይንቱን ሁኔታ ያሳያል፤ «ተቀምጦ ሳለ» ይህን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: በደብረ ዘይት
  rationale: εἰς ከአቀማመጥ ግስ ጋር በዚህ ስፍራ ቦታን ያመለክታል። «ደብረ ዘይት» የቦታው የተለመደ የአማርኛ ስም ነው።
- source_word: κατέναντι τοῦ ἱεροῦ
  choice: ቤተ መቅደሱን ትይዩ
  rationale: κατέναντι ፊት ለፊት ወይም ትይዩ መሆንን ይገልጣል፤ «ትይዩ» የቦታውን ግንኙነት በግልጽና አጭር ሁኔታ ያስተላልፋል።
- source_word: ἐπηρώτα
