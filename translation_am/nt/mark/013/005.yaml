    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: -ም
  rationale: δέ በዚህ ስፍራ ቀላል አያያዥ ነው፤ ከቀደመው ትረካ ጋር ያለውን ቀጣይነት በተፈጥሮ ያሳያል፣ ግልጽ ተቃርኖም አያስገባም።
- source_word: ἤρξατο λέγειν αὐτοῖς
  choice: እንዲህ ሊላቸው ጀመር
  rationale: የመጀመርን ገጽታና αὐτοῖς የሚለውን ተውላጠ ስም ይጠብቃል፤ በግሪኩ ያልተጠቀሰውን ‘መለሰ’ ወይም ‘ለደቀ መዛሙርቱ’ አይጨምርም። ‘እንዲህ’ ቀጥሎ ያለውን ቀጥተኛ ንግግር በተፈጥሮ ያስተዋውቃል።
- source_word: Βλέπετε
  choice: ተጠንቀቁ
  rationale: የአሁን ጊዜ ትእዛዙ የሚጠይቀውን ንቁነትና ማስጠንቀቂያ በዘመናዊና ተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: μή τις ὑμᾶς πλανήσῃ
  choice: ማንም እንዳያሳስታችሁ
  rationale: μή ከንዑስ አንቀጹ ጋር መከላከል ያለበትን አደጋ ያመለክታል። ‘እንዳያሳስታችሁ’ የሐሰት አሳሳችነትንም ሆነ ከትክክለኛው መንገድ ማስወጣትን ሊያካትት ይችላል።
theological_decisions:
- issue: የπλανήσῃ ማስጠንቀቂያ ስፋት
  choice: በማታለል ከትክክለኛው መንገድ ማሳሳትን የሚያካትት ማስጠንቀቂያ
  alternative: በአእምሮ ደረጃ ብቻ ስለሚፈጸም ማታለል የተወሰነ ማስጠንቀቂያ
  rationale: πλανάω ሐሰትን ማሳመን ብቻ ሳይሆን ከመንገድ ማስወጣትንም ሊያመለክት ይችላል። ‘ማሳሳት’ ይህን ሰፊ ኃይል ያቆያል፣ ከጽሑፉ በላይም የትምህርት ትርጓሜ አይጨምርም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የትረካው ቀጣይነት በ‘-ም’ ተጠብቋል፤ በግሪኩ ያልተገለጸ ተናጋሪ ወይም የመመለስ ቃል አልተጨመረም።
