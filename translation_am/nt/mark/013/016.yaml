  text: καὶ ὁ εἰς τὸν ⸀ἀγρὸν μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω ἆραι τὸ ἱμάτιον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/016.yaml
  text: And the one in the field must not turn back to get his cloak[a].
translation:
  language: am
  text: በእርሻ ያለውም ሰው ልብሱን[a] ለመውሰድ ወደ ኋላ አይመለስ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «መደረቢያውን።»
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εἰς τὸν ἀγρόν
  choice: በእርሻ ያለው ሰው
  rationale: በግሪክኛው በአመልካች አንቀጽ የተዋቀረው ሐረግ በእርሻ ያለን አንድ ሰው በአጠቃላይ ያመለክታል፤ ይህ አተረጓጎም በአማርኛ ተፈጥሯዊ ነው።
- source_word: ἀγρός
  choice: እርሻ
  rationale: ቃሉ በዚህ የሽሽት አውድ ውስጥ የእርሻ መስክን ወይም የሚታረስ መሬትን ያመለክታል፤ «እርሻ» በዘመናዊ አማርኛ ግልጽና ተፈጥሯዊ ነው።
- source_word: μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω
  choice: ወደ ኋላ አይመለስ
  rationale: μή ከአውሪስት ትእዛዛዊ ግስ ጋር ጥብቅ ክልከላን ይገልጻል፤ «ወደ ኋላ አይመለስ» የግሪክኛውን አቅጣጫዊ አገላለጽና አስቸኳይነት ያስቀምጣል።
- source_word: ἆραι
  choice: ለመውሰድ
  rationale: የዓላማ መስጫው የሚመለሰው ልብሱን ለመውሰድ እንደሆነ ያሳያል፤ «ለመውሰድ» ሰፊውን የαἴρω ትርጉም ሳያጠብ በአማርኛ ቀጥተኛ ነው።
- source_word: ἱμάτιον
  choice: ልብስ
  rationale: ἱμάτιον ልብስን፣ በተለይም ውጫዊ ልብስን ሊያመለክት ይችላል፤ በዋናው ጽሑፍ «ልብስ» ተፈጥሯዊ ሲሆን «መደረቢያ» በማስታወሻ ተጠብቋል።
- source_word: αὐτοῦ
  choice: ልብሱን
  rationale: የሦስተኛ መደብ ነጠላ ባለቤትነት በአማርኛ በስሙ ላይ በተጨመረው «-ሱ» ተገልጿል፤ ይህም ከነጠላው አጠቃላይ ማጣቀሻ ጋር ይስማማል።
theological_decisions:
- issue: ነጠላ አጠቃላይ ማጣቀሻ
  choice: «በእርሻ ያለው ሰው ... ልብሱን» በማለት ነጠላውን አወቃቀር ማቆየት
  alternative: በብዙ ቁጥር «በእርሻ ያሉት ... ልብሳቸውን» ብሎ መተርጎም
  rationale: ግሪክኛው ነጠላ ወንድ ጾታዊ አወቃቀርና ነጠላ ተውላጠ ስም ይጠቀማል። አማርኛው ይህን ነጠላ ተወካይ አገላለጽ ይጠብቃል፤ ነገር ግን ትእዛዙን ለወንዶች ብቻ አይገድበውም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። «አይመለስ» የክልከላ ትእዛዙን በተፈጥሯዊ አማርኛ ይገልጻል፤ የአማራጭ የልብስ ዓይነት ትርጉም በግርጌ ማስታወሻ ተቀምጧል።
