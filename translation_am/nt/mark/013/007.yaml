source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀ἀκούσητε πολέμους καὶ ἀκοὰς πολέμων, μὴ θροεῖσθε· ⸀δεῖ γενέσθαι, ἀλλ’ οὔπω τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/007.yaml
  text: And when you hear of wars and reports of wars[a], do not be alarmed; these things must happen, but the end is not yet.
translation:
  language: am
  text: ጦርነቶችንና የጦርነቶች ዜናዎችን[a] በምትሰሙበት ጊዜ አትደናገጡ፤ እነዚህ መከሰት አለባቸው፤ ነገር ግን መጨረሻው ገና አይደለም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ስለ ጦርነቶች ወሬዎች»። የግሪኩ ቃል ስለ ጦርነቶች የሚሰሙ ዘገባዎችን፣ ዜናዎችን ወይም ወሬዎችን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: በምትሰሙበት ጊዜ
  rationale: ὅταν የወደፊት ጊዜን የሚመለከት ጊዜያዊ ሁኔታን ያመለክታል፤ δέ እዚህ ላይ ደካማ ማያያዣ ስለሆነ በአማርኛ የተፈጥሮ ፍሰት ውስጥ በግልጽ ቃል አልተወከለም።
- source_word: ἀκούσητε
  choice: በምትሰሙበት
  rationale: ከὅταν ጋር ያለው የአንድ ጊዜ ንዑስ አንቀጽ በአማርኛ የወደፊት ጊዜ ያለውን መደበኛ ሁኔታ በተፈጥሯዊ መንገድ ይገልጣል።
- source_word: πολέμους
  choice: ጦርነቶችን
  rationale: የπόλεμος ቀጥተኛና መደበኛ የብዙ ቁጥር ትርጉም ነው።
- source_word: ἀκοὰς πολέμων
  choice: የጦርነት ወሬዎችን
  rationale: ἀκοή ስለ አንድ ነገር የሚሰማ ዘገባ፣ ዜና ወይም ወሬ ሊያመለክት ይችላል። «ወሬዎች» በዘመናዊ አማርኛ የተሰሙ ዜናዎችንም ሆነ ያልተረጋገጡ ወሬዎችን ሊያካትት ይችላል፤ ሰፊው የቃሉ ክልል በማስታወሻ ተጠብቋል።
- source_word: μὴ θροεῖσθε
  choice: አትደናገጡ
  rationale: θροέομαι መረበሽን፣ መደንገጥን ወይም በፍርሃት መናወጥን ያሳያል፤ «አትደናገጡ» የትእዛዙን ኃይል በተፈጥሯዊ ዘመናዊ አማርኛ ይጠብቃል።
- source_word: δεῖ γενέσθαι
  choice: እነዚህ መሆን አለባቸው
  rationale: δεῖ አስፈላጊነትን ይገልጣል፤ γενέσθαι እዚህ «መከሰት/መሆን» ማለት ነው። በግሪኩ ያልተገለጸው ርዕሰ ጉዳይ ከዐውዱ በመወሰድ «እነዚህ» ተብሎ ተገልጿል።
- source_word: ἀλλ’ οὔπω τὸ τέλος
  choice: ነገር ግን መጨረሻው ገና አይደለም
  rationale: ἀλλά ንፅፅሩን፣ οὔπω ደግሞ «ገና አይደለም» የሚለውን አጽንዖት ይጠብቃሉ፤ τέλος በዐውዱ «መጨረሻው» ተብሎ በተወሰነ ቅርጽ ተተርጉሟል።
theological_decisions:
- issue: በδεῖ γενέσθαι የተገለጸው የፍጻሜ ዘመን አስፈላጊነት
  choice: «መሆን አለባቸው» በማለት δεῖ ያለው የግድ ወይም የነቢያዊ አስፈላጊነት ተጠብቋል።
  alternative: «መከሰታቸው የግድ ነው» ወይም «መሆን ያስፈልጋቸዋል»
  rationale: ጥቅሱ እነዚህ ክስተቶች መሆን እንዳለባቸው ይናገራል፤ የዚህን አስፈላጊነት ዘዴ ግን አያብራራም። ትርጉሙ የጽሑፉን ኃይል ይጠብቃል እንጂ የተወሰነ የፍጻሜ ዘመን ሥርዓትን አያስገባም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ መደበኛ አማርኛን ይጠቀማል። «አትደናገጡ» ከጥንታዊ ወይም ከከባድ አገላለጽ ይልቅ የθροεῖσθεን ስሜታዊ ኃይል በቀጥታ ያስተላልፋል።
