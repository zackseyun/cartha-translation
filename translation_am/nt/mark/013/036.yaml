  text: μὴ ἐλθὼν ἐξαίφνης εὕρῃ ὑμᾶς καθεύδοντας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/036.yaml
  text: lest, coming suddenly, he find you sleeping.
translation:
  language: am
  text: ድንገት መጥቶ ተኝታችሁ እንዳያገኛችሁ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξαίφνης
  choice: ድንገት
  rationale: የጌታው መምጣት ሳይጠበቅ በድንገት መሆኑን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል።
- source_word: καθεύδοντας
  choice: ተኝታችሁ
  rationale: የግሪኩን ቀጥተኛ ምስል ይጠብቃል፤ በአውዱ ያለውን የመንፈሳዊ ንቃት እጦት ለአንባቢው እንዲገነዘብ ይተዋል።
- source_word: εὕρῃ ὑμᾶς
  choice: እንዳያገኛችሁ
  rationale: የμή ን የማስጠንቀቂያ ኃይል ከግሱ ጋር በማዋሃድ፣ ‘እንዳይ…’ በሚለው ተፈጥሯዊ የአማርኛ አገባብ ያቀርባል።
theological_decisions:
- issue: ‘መተኛት’ ቃል ቀጥተኛ ወይም ትርጓሜያዊ ሆኖ መቅረቡ
  choice: ተኝታችሁ
  alternative: ሳትጠብቁ / ቸል ብላችሁ
  rationale: ጽሑፉ የሚጠቀምበትን ምስላዊ ቃል ጠብቆ፣ የነቃ ጥበቃን ተቃራኒ ትርጉም በትርጉሙ ውስጥ በግድ አይፈታውም።
translation_notes:
  register: አጭር፣ ክቡርና በዘመናዊ መደበኛ አማርኛ ተፈጥሯዊ የሆነ የማስጠንቀቂያ አገባብ። የግሪኩ አሳቢያዊ አወቃቀር በአማርኛው ‘እንዳይ…’ ቅርጽ ተወክሏል።
