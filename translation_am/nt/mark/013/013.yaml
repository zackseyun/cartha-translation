  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου. ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/013.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: am
  text: እናም በስሜ[a] ምክንያት በሰዎች ሁሉ ትጠላላችሁ። ነገር ግን እስከ መጨረሻ የሚጸና[b] እርሱ ይድናል።[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ስለ ስሜ።”
    reason: lexical_alternative
  - marker: b
    text: “የሚጸና” የሚለው “በጽናት የሚቀጥል” ወይም “እስከ መጨረሻ የማይናወጥ” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “ይታደጋል።” የግሪኩ ቃል መታደግን ወይም ድነትን ሊያመለክት ይችላል፤ አውዱ የቃሉን ሙሉ ስፋት ክፍት ይተዋል።
    reason: alternative_reading
lexical_decisions:
- source_word: μισούμενοι ὑπὸ πάντων
  choice: ሁሉም ይጠሏችኋል
  rationale: የግሪኩን የወደፊት ጊዜ ተገብሮ አገላለጽ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል፤ πάντων ያለውን ሰፊ አገላለጽም ሳያለዝብ ይጠብቃል።
- source_word: διὰ τὸ ὄνομά μου
  choice: በስሜም ምክንያት
  rationale: διά ከተሳቢ ጋር የሚገልጸውን ምክንያት በግልጽ ቋንቋ ያሳያል፤ ‘ስሜ’ የኢየሱስን ማንነት፣ ሥልጣንና እርሱን መከተል የሚያመለክትበትን መጽሐፍ ቅዱሳዊ ስፋት ይጠብቃል።
- source_word: ὁ δὲ ὑπομείνας
  choice: የሚጸና
  rationale: ὑπομένω በመከራ ውስጥ ሳይሸነፉ መቆየትን ያመለክታል፤ ‘የሚጸና’ ተፈጥሯዊ፣ ክቡርና ከአላስፈላጊ የእምነት ሥርዓት ቃላት የጸዳ ነው።
- source_word: εἰς τέλος
  choice: እስከ መጨረሻ
  rationale: መጨረሻው የፈተና፣ የሕይወት ወይም የዘመን ፍጻሜ መሆኑን ሳይወስን የግሪኩን ክፍት ትርጉም ይጠብቃል።
- source_word: οὗτος
  choice: እርሱ
  rationale: የግሪኩን አጽንዖት ይጠብቃል፤ በአማርኛም ‘የሚጸና እርሱ’ ተፈጥሯዊና ክቡር አገላለጽ ነው።
- source_word: σωθήσεται
  choice: ይድናል
  rationale: σῴζω መታደግንም ሆነ ሙሉ ድነትን ሊያመለክት ይችላል፤ ‘ይድናል’ ይህን ሥነ መለኮታዊ ስፋትና ውጥረት ይጠብቃል።
theological_decisions:
- issue: በጽናት አባባል ውስጥ የσωθήσεται ትርጉም
  choice: ይድናል
  alternative: ይታደጋል
  rationale: ጥቅሱ በስደት ውስጥ መጽናትን ከመጨረሻው ድነት ጋር ያያይዛል፤ ሆኖም ቃሉን ለጊዜያዊ መታደግ ብቻ ወይም ለአንድ የተወሰነ የእምነት ሥርዓት ትምህርት አያጠብበውም።
- issue: የπάντων ወሰን
  choice: ሁሉም
  alternative: ሰዎች ሁሉ
  rationale: ግሪኩ ጥላቻውን በሰፊና አጽንዖታዊ ቃል ይገልጻል፤ ትርጉሙ ይህን ሳያለዝብ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ አጽንዖት ‘የሚጸና እርሱ’ በሚለው አወቃቀር ተጠብቋል፤ የመጨረሻው ምንነትና የድነቱ ስፋት ሆን ተብሎ አልተወሰነም።
