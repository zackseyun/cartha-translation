    issue: Misplaced enclitic -ም in «በስሜም ምክንያት»
    rationale: 'This reads “also because of my name,” rather than rendering clause-initial καὶ as “and.” The conjunction should begin the sentence/clause: «እናም ... በስሜ ምክንያት ...».'
  - severity: low
    issue: Footnote anchors are not attached to their respective words or phrases
    rationale: 'Moving each marker immediately after the phrase it explains makes the audit trail and reading function clear: [a] after «በስሜ», [b] after «የሚጸና», and [c] after «ይድናል».'
