review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys future hatred, its cause in Jesus’ name, endurance to the end, and salvation. However, «በስሜም ምክንያት» incorrectly attaches -ም (“also/and”) to “my name,” while the Greek καὶ coordinates the entire first clause. A passive Amharic construction also more directly reflects μισούμενοι ὑπὸ πάντων.
  naturalness: «በሰዎች ሁሉ ትጠላላችሁ» is clear, natural modern standard Amharic and avoids the potentially less precise active expression «ሁሉም ይጠሏችኋል». The resumptive emphasis of οὗτος is naturally retained by «እርሱ».
  terminology: «ትጠላላችሁ», «ትጸናላችሁ», and «ይድናል» suitably preserve the source’s persecution, endurance, and salvation language without resolving the scope of salvation doctrinally. «ይታደጋል» remains an appropriate footnoted alternative.
  issues:
