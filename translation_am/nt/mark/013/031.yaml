  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσονται, οἱ δὲ λόγοι μου οὐ ⸀μὴ ⸁παρελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/031.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: am
  text: ሰማይና ምድር ያልፋሉ፤ ቃሎቼ ግን ፈጽሞ አያልፉም።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οὐρανὸς καὶ ἡ γῆ
  choice: ሰማይና ምድር
  rationale: የግሪኩ ቋሚ ጥምረት መላውን የተፈጠረ ዓለም የሚያመለክት ሲሆን፣ ‘ሰማይና ምድር’ በአማርኛም ተፈጥሯዊና የተለመደ አገላለጽ ነው።
- source_word: παρελεύσονται
  choice: ያልፋሉ
  rationale: በዚህ የፍጻሜ ዘመን አውድ παρέρχομαι ማለፍን ወይም ወደ ፍጻሜ መድረስን ያመለክታል፤ ‘ያልፋሉ’ ዘዴውን ሳይወስን ይህን ኃይል ይጠብቃል።
- source_word: δὲ
  choice: ግን
  rationale: በሚያልፉት ሰማይና ምድር እና በማያልፉት የኢየሱስ ቃሎች መካከል ያለውን ንጽጽር በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: οἱ λόγοι μου
  choice: ቃሎቼ
  rationale: የኢየሱስን የተነገሩ ቃሎችና አዋጆች በቀጥታና በግልጽ ሁኔታ ይገልጻል።
- source_word: οὐ μὴ παρελεύσονται
  choice: ፈጽሞ አያልፉም
  rationale: οὐ μή ከወደፊት ግስ ጋር የሚሰጠውን አጽንዖታዊ ክህደት ‘ፈጽሞ’ በማለት በዘመናዊና በግልጽ አማርኛ ያሰማል።
theological_decisions:
- issue: ኢየሱስ ስለ ቃሎቹ የተናገረው አጽንዖታዊ ክህደት
  choice: ፈጽሞ አያልፉም
  alternative: ከቶ አያልፉም፤ በምንም ሁኔታ አያልፉም
  rationale: ትርጉሙ የተፈጠረው ሥርዓት ከማለፉ ጋር በተቃራኒ የኢየሱስ ቃሎች ያላቸውን ዘላቂነትና ሥልጣን ያጎላል፤ የግሪኩን አጽንዖት ሳያዳክም በተፈጥሯዊ አማርኛ ያቀርባል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና በቀላሉ የሚገባ መደበኛ አማርኛ። የግሪኩ አጽንዖት በዋናው ጽሑፍ ‘ፈጽሞ’ ተብሎ በቂ ሁኔታ ስለተገለጸ የግርጌ ማስታወሻ አልተጨመረም።
