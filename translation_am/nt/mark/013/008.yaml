  text: ἐγερθήσεται γὰρ ἔθνος ἐπ’ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν, ⸀ἔσονται σεισμοὶ κατὰ τόπους, ⸁ἔσονται ⸀λιμοί· ⸀ἀρχὴ ὠδίνων ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/008.yaml
  text: For nation will rise against nation[a], and kingdom against kingdom. There will be earthquakes in various places; there will be famines. These are the beginning of birth pains.
translation:
  language: am
  text: ሕዝብ በሕዝብ ላይ፣ መንግሥትም በመንግሥት ላይ ይነሣልና። በተለያዩ ስፍራዎች የምድር መናወጦች ይሆናሉ፤ ረሃቦችም ይሆናሉ። እነዚህ የወሊድ ምጥ[a] መጀመሪያ ናቸው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «የወሊድ ጣር» ወይም «የወሊድ ሥቃይ»። የግሪክኛው ቃል ከወሊድ ጋር የተያያዘውን ምጥ ያመለክታል፤ እዚህም ቀጥሎ ከሚመጣው ነገር በፊት ለሚኖር መከራ በምሳሌነት ተጠቅሟል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσεται
  choice: ይነሣል
  rationale: የግስ ቅርጹ ተደራጊ ቢሆንም፣ እዚህ የግጭት መነሣትን በፈሊጣዊ አገላለጽ ያመለክታል፤ «ይነሣል» ይህን ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἔθνος ... ἐπ’ ἔθνος
  choice: ሕዝብ በሕዝብ ላይ
  rationale: ἔθνος ሕዝብን፣ ብሔርን ወይም አገርን ሊያመለክት ይችላል። «ሕዝብ በሕዝብ ላይ» የቡድኖችን ግጭት በግልጽና በተለመደ አገላለጽ ያቀርባል።
- source_word: βασιλεία ... ἐπὶ βασιλείαν
  choice: መንግሥት በመንግሥት ላይ
  rationale: እዚህ βασιλεία የፖለቲካ ግዛትን ወይም መንግሥትን ያመለክታል፤ ይህ ምርጫ ከ«ሕዝብ በሕዝብ ላይ» ጋር ያለውን ትይዩነት ይጠብቃል።
- source_word: σεισμοὶ
  choice: የምድር መናወጦች
  rationale: σεισμός በዚህ አውድ የምድር መናወጥን ያመለክታል፤ ብዙ ቁጥሩም ተጠብቋል።
- source_word: κατὰ τόπους
  choice: በየስፍራው
  rationale: κατά ከብዙ ቁጥር τόπους ጋር በተለያዩ ቦታዎች መከሰትን ያሳያል፤ «በየስፍራው» ይህን ስርጭታዊ ኃይል በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: λιμοί
  choice: ረሃቦች
  rationale: λιμός ቀላል ረሃብን ሳይሆን ሰፊ የምግብ እጥረትን ያመለክታል፤ የምንጩ ብዙ ቁጥርም ተጠብቋል።
- source_word: ἀρχὴ
  choice: መጀመሪያ
  rationale: ቃሉ እነዚህ ክስተቶች የሚከተለው ሁሉ ሳይሆኑ የአንድ ሂደት ጅማሬ መሆናቸውን ያሳያል።
- source_word: ὠδίνων
  choice: የምጥ ጣር
  rationale: ὠδίν ከወሊድ ጋር የተያያዘውን የምጥ ሥቃይ ያመለክታል። «የምጥ ጣር» ምስሉን ሳያደበዝዝ ግልጽና ተፈጥሯዊ ነው።
- source_word: ταῦτα
  choice: እነዚህ ... ናቸው
  rationale: ተውላጠ ስሙ ብዙ ክስተቶችን ይመለከታል፤ የአማርኛው ብዙ ቁጥር አገላለጽ ይህን በግልጽ ያቀርባል።
theological_decisions:
- issue: ἀρχὴ ὠδίνων የሚያቀርበው የመጨረሻ ዘመን ምስል
  choice: «የምጥ ጣር መጀመሪያ» በማለት ከሚከተለው ነገር በፊት የሚመጣውን ሥቃይ የሚያሳይ የወሊድ ምስል ተጠብቋል።
  alternative: ምስሉን «የመከራ መጀመሪያ» ብቻ በማለት ማጠቃለል፣ ወይም ከጽሑፉ በላይ ዝርዝር የፍጻሜ ዘመን ሥርዓት መጫን።
  rationale: የወሊድ ምስሉ ሥቃይንና ቀጥሎ የሚመጣ ነገርን በአንድነት ያመለክታል። ትርጉሙ ይህን ውጥረት ይጠብቃል እንጂ ጽሑፉ ያልገለጠውን የክስተቶች ሥርዓት አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ሕዝብ በሕዝብ ላይ» እና «መንግሥት በመንግሥት ላይ» የምንጩን ትይዩ አወቃቀር ይጠብቃሉ፤ «የምጥ ጣር» ደግሞ ምስላዊነቱን ሳያጠፋ በቀላሉ ይገባል።
