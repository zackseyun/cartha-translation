  text: 'And what I say to you I say to all: stay awake[a].'
translation:
  language: am
  text: እኔም ለእናንተ የምለውን ለሁሉም እላለሁ፤ ንቁ[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ነቅታችሁ ጠብቁ” ወይም “ንቁ ሁኑ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ
  choice: የምለውን
  rationale: በግሪኩ ያለው ገለልተኛ ነጠላ አንጻራዊ ተውላጠ ስም በስም ተግባር ላይ ውሎ ‘የምለውን’ ተብሎ በተፈጥሯዊ አማርኛ ተተርጉሟል።
- source_word: δὲ
  choice: -ም
  rationale: እዚህ δέ ጠንካራ ተቃርኖን ሳይሆን ከቀደመው ንግግር ጋር ቀላል ትስስርን ያሳያል፤ ከ‘እኔ’ ጋር የተያያዘው ‘-ም’ ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ὑμῖν
  choice: ለእናንተ
  rationale: ሁለተኛ መደብ ብዙ ቁጥር ተቀባይን፣ ማለትም በቅርብ የተነገራቸውን ደቀ መዛሙርት፣ በግልጽ ይወክላል።
- source_word: λέγω ... λέγω
  choice: የምለውን ... እላለሁ
  rationale: የግሪኩን ድግግሞሽና የንግግሩን አጽንዖት በአማርኛ በተፈጥሯዊ አወቃቀር ይጠብቃል።
- source_word: πᾶσιν
  choice: ለሁሉም
  rationale: የግሪኩን አጭርና አጠቃላይ ወሰን ይጠብቃል፤ በጽሑፉ ያልተገለጸውን ‘ሰዎች’ አይጨምርም።
- source_word: γρηγορεῖτε
  choice: ንቁ
  rationale: የብዙ ቁጥር ትእዛዛዊ ቅርጹ ቀጣይነት ያለውን ንቃትና ዝግጁነት ይጠይቃል፤ ‘ንቁ’ አጭር፣ ኃይለኛና በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
theological_decisions:
- issue: የኢየሱስ ማሳሰቢያ ወሰን
  choice: በቅርብ ለደቀ መዛሙርቱ የተነገረው ማሳሰቢያ ለሁሉም በግልጽ ተዘርግቷል።
  alternative: በትረካው አውድ ውስጥ ቃሉ በዚያ ለነበሩት አድማጮች ብቻ እንደሚመለከት ሊሰማ ይችላል።
  rationale: ግሪኩ ‘ለእናንተ’ እና ‘ለሁሉም’ በማለት የወሰኑን መስፋት በግልጽ ያሳያል፤ ትርጉሙም ይህን ሳያጠብ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። አጭሩ የመጨረሻ ትእዛዝ የግሪኩን አጽንዖት ይጠብቃል፤ የቃሉ የመንቃትና የመጠበቅ ጥላዎች በግርጌ ማስታወሻው ተጠብቀዋል።
