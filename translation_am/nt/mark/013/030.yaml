  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη μέχρις οὗ ⸂ταῦτα πάντα⸃ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/030.yaml
  text: Truly I say to you that this generation will certainly not pass away until all these things happen[a][b].
translation:
  language: am
  text: እውነት እላችኋለሁ፤ ይህ ትውልድ[a] እነዚህ ሁሉ እስኪከሰቱ ድረስ በፍጹም አያልፍም[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ይህ ሕዝብ» ወይም «ይህ ዘር»፤ የግሪኩ γενεά ሰፋ ያሉ ትርጉሞችን ሊይዝ ቢችልም፣ እዚህ «ትውልድ» የተፈጥሮ ትርጉሙ ነው።
    reason: lexical_alternative
  - marker: b
    text: «በፍጹም አያልፍም» የሚለው አገላለጽ በግሪክ ያለውን የተጠናከረ እምቢታ ያስተላልፋል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: እውነት
  rationale: በሲኖፕቲክ ወንጌላት የክብደትና የሥልጣን መግቢያ ቃል ነው፤ «እውነት» በዘመናዊ አማርኛ ኃይሉን በተፈጥሯዊ ሁኔታ ያስተላልፋል።
- source_word: λέγω ὑμῖν
  choice: እላችኋለሁ
  rationale: የግሪኩን ቀጥተኛ የንግግር ቅርጽ በግልጽና በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: οὐ μὴ παρέλθῃ
  choice: በፍጹም አያልፍም
  rationale: οὐ μή የተጠናከረ እምቢታ ነው፤ «በፍጹም» ይህን አጽንዖት ይጠብቃል፣ παρέρχομαι ደግሞ በቀጥታ «ማለፍ» ተብሎ ተተርጉሟል።
- source_word: ἡ γενεὰ αὕτη
  choice: ይህ ትውልድ
  rationale: በዐውዱ ውስጥ γενεά በተፈጥሮ «ትውልድ» ማለት ነው፤ አከራካሪውን የትርጓሜ ውጥረት ሳይፈታ የምንጩን አገላለጽ ይጠብቃል።
- source_word: μέχρις οὗ
  choice: እስኪ… ድረስ
  rationale: የጊዜ ወሰንን በተፈጥሯዊ የአማርኛ አገባብ ያሳያል።
- source_word: ταῦτα πάντα
  choice: እነዚህ ሁሉ
  rationale: ብዙ ቁጥሩንና የπᾶςን አጠቃላይነት በግልጽ ሁኔታ ይጠብቃል።
- source_word: γένηται
  choice: እስኪፈጸሙ
  rationale: በዚህ የፍጻሜ ዘመን ዐውድ γίνομαι የተጠቀሱት ነገሮች መከሰታቸውን ወይም መፈጸማቸውን ያመለክታል፤ «ይፈጸሙ» በአማርኛ የተፈጥሮ አገላለጽ ነው።
theological_decisions:
- issue: በፍጻሜ ዘመን ንግግሩ ውስጥ የ«ἡ γενεὰ αὕτη» ትርጉም
  choice: ያለ ትርጓሜያዊ ማስፋፊያ «ይህ ትውልድ» ተብሎ ተተርጉሟል።
  alternative: «ይህ ሕዝብ/ይህ ዘር»፣ ወይም ምልክቶቹን የሚያይ የወደፊት ትውልድ
  rationale: የግሪኩ አገላለጽ በተፈጥሮ «ይህ ትውልድ» ይላል። ክፍሉ በብዙ መንገድ ስለሚተረጎም፣ ትርጉሙ አንድን የፍጻሜ ዘመን ሥርዓት ከመምረጥ ይልቅ የምንጩን ውጥረት ጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የተጠናከረ እምቢታ በ«በፍጹም» ተጠብቋል፤ የ«ይህ ትውልድ» አከራካሪነት በዋናው ጽሑፍ ሳይፈታ አማራጮቹ በማስታወሻ ቀርበዋል።
