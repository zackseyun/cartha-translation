  text: προσεύχεσθε δὲ ἵνα μὴ ⸀γένηται χειμῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/018.yaml
  text: But pray that it may not happen in winter[a].
translation:
  language: am
  text: ነገር ግን፣ ይህ በክረምት እንዳይሆን ጸልዩ[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ አውዱን ይበልጥ ግልጽ በማድረግ፣ «ሽሽታችሁ በክረምት እንዳይሆን።» የማርቆስ የግሪክ አገላለጽ ከትይዩው ማቴዎስ 24፥20 ይልቅ አጠር ያለና ያልተገለጸ ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: προσεύχεσθε
  choice: ጸልዩ
  rationale: የሁለተኛ መደብ ብዙ ቁጥር ትእዛዝ ነው። የግስ ጊዜውን ‘ሁልጊዜ ጸልዩ’ ብሎ ከሚገባው በላይ ሳይወስን፣ በተፈጥሯዊ አማርኛ ‘ጸልዩ’ ተብሏል።
- source_word: δὲ
  choice: ነገር ግን
  rationale: ከቀደመው ማስጠንቀቂያ ጋር ለስላሳ ተቃርኖና ሽግግር ያሳያል።
- source_word: ἵνα μὴ
  choice: እንዳይሆን
  rationale: የጸሎቱን ይዘት በአሉታዊ መልክ በተፈጥሯዊ የአማርኛ አገላለጽ ያቀርባል።
- source_word: γένηται
  choice: ይህ ... እንዳይሆን
  rationale: ግሪኩ ርእሰ ጉዳዩን በግልጽ አይጠቅስም። ‘ይህ’ በቀደመው አውድ የተጠቀሰውን ሁኔታ እያመለከተ፣ የማርቆስን አጭርና ያልተፈታ አገላለጽ ይጠብቃል።
- source_word: χειμῶνος
  choice: በክረምት
  rationale: ወቅትን የሚያመለክተውን የግሪክ ዘርፍ በተለመደውና አጭር የአማርኛ አገላለጽ ይተረጉማል።
theological_decisions:
- issue: የγένηται ያልተገለጸ ርእሰ ጉዳይ
  choice: በቀደመው አውድ ያለውን ክስተት ወይም ሁኔታ በአጠቃላይ የሚያመለክት ‘ይህ ... እንዳይሆን’
  alternative: ‘ሽሽታችሁ በክረምት እንዳይሆን’
  rationale: በማርቆስ የግሪክ ጽሑፍ ‘ሽሽታችሁ’ በግልጽ አልተጻፈም፤ ይህ በማቴዎስ 24፥20 በግልጽ የሚገኝ ቃል ነው። ከትይዩው ክፍል ቃል እንዳይጨመር፣ የማርቆስ አሻሚና አጭር አገላለጽ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። ‘ይህ’ የሚለው ተውላጠ ስም አማርኛውን ተፈጥሯዊ ሲያደርግ፣ በግሪኩ ያልተገለጸውን ክስተት በተወሰነ ትርጓሜ አይቆልፍም።
