review_pass:
  verdict: revise
  source_fidelity: The draft reverses the source syntax by attaching “to take an item” to going down rather than to entering. It also adds possessive force to the initial “housetop,” whereas αὐτοῦ modifies only the later “house.” The revision preserves both coordinated prohibitions and the purpose of entering.
  naturalness: The revised wording is clear, idiomatic modern standard Amharic and retains the urgent prohibitive register.
  terminology: ጣራ appropriately renders δῶμα, with a cultural footnote clarifying the accessible flat-roof setting. ማንኛውንም ነገር accurately reflects the broad force of τι, and ቤቱ preserves the masculine singular possessive form.
  issues:
  - severity: high
    issue: The purpose phrase is attached to the wrong prohibition.
    rationale: In Greek, τι ἆραι ἐκ τῆς οἰκίας αὐτοῦ modifies “enter,” not “go down.” The draft says not to go down in order to take an item, then separately says not to enter.
  - severity: medium
    issue: The first clause unnecessarily identifies the roof as the person’s own house roof.
    rationale: ὁ ἐπὶ τοῦ δώματος says “the one on the housetop”; αὐτοῦ occurs only with the later οἰκίας. The added ቤቱ in the first clause narrows the source wording.
  revised_text: በጣራ ላይ ያለው ሰው[a] ወደ ታች አይውረድ፤ ከቤቱ ውስጥ ማንኛውንም ነገር ለመውሰድ ወደ ቤቱ አይግባ።
  revised_footnotes:
  - marker: a
    text: ወይም፣ “በጣራ ላይ ያለው ሰው።” የግሪኩ ቃል ብዙ ጊዜ ሰዎች ለመቀመጥና ለሌሎች ተግባራት የሚጠቀሙበትን ጠፍጣፋ የቤት ጣራ ያመለክታል።
    reason: cultural_note
  revision_rationale: 'The revision restores the Greek clause order and dependency: the person must neither go down nor enter the house for the purpose of taking anything from it. It avoids adding a possessive modifier to the first occurrence of “housetop,” while retaining the source’s singular masculine possessive in ቤቱ.'
