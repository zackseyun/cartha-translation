  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ⸀ὁ ἐπὶ τοῦ δώματος μὴ ⸀καταβάτω μηδὲ εἰσελθάτω ⸂τι ἆραι⸃ ἐκ τῆς οἰκίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/015.yaml
  text: Let the one on the housetop not go down[a], nor enter to take anything out of his house.
translation:
  language: am
  text: በጣራ ላይ ያለው ሰው[a] ወደ ታች አይውረድ፤ ከቤቱ ውስጥ ማንኛውንም ነገር ለመውሰድ ወደ ቤቱ አይግባ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በጣራ ላይ ያለው ሰው።” የግሪኩ ቃል ብዙ ጊዜ ሰዎች ለመቀመጥና ለሌሎች ተግባራት የሚጠቀሙበትን ጠፍጣፋ የቤት ጣራ ያመለክታል።
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἐπὶ τοῦ δώματος
  choice: በቤቱ ጣራ ላይ ያለው ሰው
  rationale: መስተዋድዳዊው ሐረግ በዚያ ቦታ ያለን ሰው በስም ተግባር ይጠቅሳል፤ አገላለጹም በአማርኛ ተፈጥሯዊ ነው።
- source_word: δώματος
  choice: የቤቱ ጣራ
  rationale: በይሁዳ አካባቢ ያለውን ጠፍጣፋና ለመጠቀሚያ የሚውል የቤት ጣራ ያመለክታል፤ የባህል ዝርዝሩ በማስታወሻ ተገልጿል።
- source_word: μὴ καταβάτω
  choice: ወደ ታች አይውረድ
  rationale: የሦስተኛ መደብ ክልከላዊ ትእዛዙን በዘመናዊና ቀጥተኛ አማርኛ ያስተላልፋል።
- source_word: μηδὲ εἰσελθάτω
  choice: ወደ ቤቱም አይግባ
  rationale: μηδέ ሁለተኛውን ክልከላ ያስተባብራል፤ የመግቢያው ቦታ ከቀጣዩ ሐረግ በግልጽ ስለሚታወቅ ‘ወደ ቤቱ’ ተብሏል።
- source_word: τι ἆραι
  choice: ዕቃ ለመውሰድ
  rationale: ወደ ቤት የመግባቱን ዓላማ ያሳያል። τι ያልተወሰነ ነገርን ስለሚጠቅስ ‘ዕቃ’ በአውዱ ውስጥ ተፈጥሯዊ ሲሆን የተለየ ንብረት አይወስንም።
- source_word: ἐκ τῆς οἰκίας αὐτοῦ
  choice: ከቤቱ
  rationale: ἐκ ከቤቱ ውስጥ አውጥቶ መውሰድን ያመለክታል፤ αὐτοῦ ያለው ወንድ ነጠላ ተወካይ አገላለጽ በ‘ቤቱ’ ተጠብቋል።
theological_decisions:
- issue: አጠቃላይ ኃይል ያለው ወንድ ነጠላ ተወካይ አገላለጽ
  choice: ቤቱ
  alternative: ቤታቸው / ቤቱን
  rationale: ግሪኩ በሰዋሰው ወንድ ነጠላ ቅርጽ ቢጠቀምም መመሪያው አጠቃላይ ኃይል አለው። ትርጉሙ የምንጩን ነጠላ ቅርጽ ሳያጠፋ በተፈጥሯዊ አማርኛ ‘ቤቱ’ ብሎ ይጠብቀዋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ሁለቱ ክልከላዎች የሁኔታውን አጣዳፊነት እንዲያሳዩ ቀጥተኛ በሆነ የትእዛዝ ቅርጽ ቀርበዋል።
