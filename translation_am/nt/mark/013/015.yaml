revisions:
- from: በቤቱ ጣራ ላይ ያለው ሰው[a] ከቤቱ ዕቃ ለመውሰድ ወደ ታች አይውረድ፤ ወደ ቤቱም አይግባ።
  to: በጣራ ላይ ያለው ሰው[a] ወደ ታች አይውረድ፤ ከቤቱ ውስጥ ማንኛውንም ነገር ለመውሰድ ወደ ቤቱ አይግባ።
  rationale: 'The revision restores the Greek clause order and dependency: the person must neither go down nor enter the house for the purpose of taking anything from it. It avoids adding a possessive modifier to the first occurrence of “housetop,” while retaining the source’s singular masculine possessive in ቤቱ.'
  reviewer_model: gpt-5.6-terra
