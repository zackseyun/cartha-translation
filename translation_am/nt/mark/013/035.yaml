- source_word: οὐκ οἴδατε
  choice: አታውቁም
  rationale: የግሪኩን ቀጥተኛ አሉታዊ አገላለጽ ያለ ተጨማሪ ትርጓሜ ያቀርባል።
- source_word: ὁ κύριος τῆς οἰκίας
  choice: የቤቱ ጌታ
  rationale: በቤት አስተዳደር ምሳሌው ውስጥ ያለውን ባለሥልጣን የሚያመለክት ተፈጥሯዊ የአማርኛ አገላለጽ ነው፤ የምሳሌውን ሰፊ ክርስቶሳዊ ፍንጭም አይዘጋም።
