  text: γρηγορεῖτε οὖν, οὐκ οἴδατε γὰρ πότε ὁ κύριος τῆς οἰκίας ἔρχεται, ⸀ἢ ὀψὲ ἢ ⸀μεσονύκτιον ἢ ἀλεκτοροφωνίας ἢ πρωΐ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/035.yaml
  text: 'Therefore stay awake[a], for you do not know when the master of the house is coming: whether in the evening, or at midnight, or at cockcrow[b], or in the morning.'
translation:
  language: am
  text: ስለዚህ ንቁ[a]፤ የቤቱ ጌታ መቼ እንደሚመጣ አታውቁምና፦ በማታ ወይም በእኩለ ሌሊት፣ ወይም ዶሮ ሲጮኽ[b]፣ ወይም በጠዋት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እየተጠባበቃችሁ ቆዩ።» ትእዛዙ ንቁና ዝግጁ ሆኖ መጠበቅን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: «ዶሮ ሲጮኽ» ከዶሮ ጩኸት ጋር የተያያዘውን የሌሊት የጥበቃ ክፍል ያመለክታል።
    reason: cultural_note
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: ንቁ
