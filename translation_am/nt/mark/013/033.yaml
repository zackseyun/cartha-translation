  yaml_path: translation/nt/mark/013/033.yaml
  text: Be on guard; stay awake[a], for you do not know when the time is.
translation:
  language: am
  text: ተጠንቀቁ፤ ነቅታችሁ ቆዩ፤ ጊዜው[a] መቼ እንደሆነ አታውቁምና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የተወሰነው ጊዜ” ወይም “ወቅቱ።” የግሪኩ καιρός ብዙ ጊዜ ወሳኝ ወይም የተወሰነ ጊዜን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: ተጠንቀቁ
  rationale: ይህ ብዙ ቁጥር ያለው ትእዛዝ በዐውዱ ማየትን ብቻ ሳይሆን አደጋን በመጠበቅ መጠንቀቅን ያመለክታል። ይህ አተረጓጎም ከሚከተለው የንቃት ትእዛዝ ይለያል።
- source_word: ἀγρυπνεῖτε
  choice: ነቅታችሁ ቆዩ
  rationale: የመንቃትን ምስላዊ አገላለጽና ቀጣይነት ያለውን ንቃት ይጠብቃል፤ በዘመናዊ አማርኛም ተፈጥሯዊ ነው።
- source_word: οὐκ οἴδατε
  choice: አታውቁም
  rationale: የማወቅ ግስን የሚክድ ቀጥተኛና ተፈጥሯዊ አተረጓጎም ነው።
- source_word: γὰρ
  choice: -ና
  rationale: ከቀደሙት ትእዛዛት በኋላ ምክንያቱን በተፈጥሯዊ የአማርኛ አገባብ ያሳያል።
- source_word: πότε
  choice: መቼ
  rationale: ጊዜን የሚጠይቀውን ተውሳከ ግስ በቀጥታና በተፈጥሯዊ ሁኔታ ይተረጉማል።
- source_word: ὁ καιρός
  choice: ጊዜው
  rationale: ቃሉ ወሳኝ ወይም የተወሰነ ጊዜን ሊያመለክት ቢችልም፣ ‘ጊዜው’ የግሪኩን ስፋትና ዐውዳዊ ክብደት ያለ አላስፈላጊ ማብራሪያ ይጠብቃል።
- source_word: ἐστιν
  choice: እንደሆነ
  rationale: ቀላሉን አያያዥ ግስ በአማርኛ ተዘዋዋሪ ጥያቄ አገባብ በተፈጥሯዊ መልኩ ያቀርባል።
theological_decisions:
- issue: በፍጻሜያዊው ዐውድ ውስጥ የκαιρός ስሜት
  choice: ጊዜው
  alternative: የተወሰነው ጊዜ፤ ወቅቱ
  rationale: በዚህ ንግግር ውስጥ καιρός ወሳኝ ወይም የተወሰነ ጊዜን ሊያመለክት ይችላል። ዋናው ጽሑፍ የግሪኩን አሻሚነት ለመጠበቅ ‘ጊዜው’ ይላል፤ ይበልጥ ግልጽ አማራጮች በማስታወሻው ተጠቅሰዋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ሁለቱ ትእዛዛት በትርጉም እንዳይደጋገሙ፣ βλέπετε ‘ተጠንቀቁ’ ተብሎ፣ ἀγρυπνεῖτε ደግሞ የንቃትን ምስል በመጠበቅ ‘ነቅታችሁ ቆዩ’ ተብሎ ቀርቧል።
