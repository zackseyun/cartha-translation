id: MRK.13.29
reference: Mark 13:29
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ⸂ἴδητε ταῦτα⸃ γινόμενα, γινώσκετε ὅτι ἐγγύς ἐστιν ἐπὶ θύραις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/029.yaml
  text: So also you[a], when you see these things happening, know that it is near, at the doors.
translation:
  language: am
  text: እንዲሁ እናንተም፣ እነዚህ ነገሮች ሲከናወኑ ስታዩ፣ ቅርብና በደጆች ላይ እንደሆነ[a] እወቁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እርሱ ቅርብና በደጆች ላይ እንደሆነ።” በግሪክ የግሱ ባለቤት በግልጽ አልተጠቀሰም።
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: እንዲሁም እናንተ
  rationale: “እንዲሁም” ንግግሩን ከቀደመው የበለስ ምሳሌ ጋር ያገናኛል፤ “እናንተ” ደግሞ በግሪኩ ያለውን አጽንዖት ይጠብቃል።
- source_word: ὅταν ἴδητε
  choice: ስታዩ
  rationale: ከወደፊት ሁኔታ ጋር የተያያዘውን “when you see” በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል።
- source_word: ταῦτα γινόμενα
  choice: እነዚህ ነገሮች ሲፈጸሙ
  rationale: ταῦτα ያለውን ብዙ ቁጥር ይጠብቃል፤ “ሲፈጸሙ” ደግሞ ክስተቶቹ ወደ መፈጸም መምጣታቸውን ያሳያል።
- source_word: γινώσκετε
  choice: እወቁ
  rationale: የብዙ ቁጥር ትእዛዙንና ከምልክቶቹ ትክክለኛውን ድምዳሜ የመረዳት ኃይል በቀጥታ ይገልጣል።
- source_word: ὅτι ἐγγύς ἐστιν
  choice: ቅርብ … እንደሆነ
  rationale: ግሪኩ ግልጽ ባለቤት አይጠቅስም። አማርኛውም ባለቤትን ሳይጨምር ተፈጥሯዊ ስለሚሆን፣ የቅርብ የሆነው ክስተቱ ወይም እርሱ መሆኑን በዋናው ጽሑፍ አይወስንም።
- source_word: ἐπὶ θύραις
  choice: በደጆች ላይ
  rationale: የግሪኩን ብዙ ቁጥር θύραις ይጠብቃል፤ ሐረጉም እጅግ መቅረብን ያመለክታል።
theological_decisions:
- issue: የἐστιν (“ቅርብ ነው”) ያልተገለጸ ባለቤት
  choice: በዋናው ጽሑፍ “ቅርብ … እንደሆነ” በማለት ባለቤቱን ሳይገልጹ መተርጎም
  alternative: “እርሱ ቅርብ እንደሆነ” ብሎ በግል ባለቤት መተርጎም
  rationale: የግሪኩ ጽሑፍ ባለቤትን በግልጽ አይናገርም። አማርኛ ይህን አሻሚነት በተፈጥሯዊ ሁኔታ ሊጠብቅ ስለሚችል፣ ጥቅሱን የሚያመለክተው የተነገረውን ፍጻሜ ነው ወይስ የሰው ልጅን ነው ብሎ አይወስንም።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ ነው። “በደጆች ላይ” የሚለው በአማርኛ ከተለመደው ነጠላ “በደጅ ላይ” ትንሽ ይልቅ ቃል በቃል ቢሆንም፣ የምንጩን ብዙ ቁጥርና ምስላዊ አገላለጽ ለመጠበቅ ተመርጧል።
