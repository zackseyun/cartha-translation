revisions:
- from: እንዲሁም እናንተ፣ እነዚህ ነገሮች ሲፈጸሙ ስታዩ፣ ቅርብ፣ በደጆች ላይ እንደሆነ[a] እወቁ።
  to: እንዲሁ እናንተም፣ እነዚህ ነገሮች ሲከናወኑ ስታዩ፣ ቅርብና በደጆች ላይ እንደሆነ[a] እወቁ።
  rationale: The revised wording corrects the Amharic coordination of “near” and “at the doors” and uses a more semantically neutral expression for events taking place. It retains the source text’s ambiguity concerning what—or who—is near and preserves the required footnote alternative.
  reviewer_model: gpt-5.6-terra
