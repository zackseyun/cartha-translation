  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ጠንካራ እምቢታ ‘አንድም … አይቀርም’ በሚል አገላለጽ ተጠብቋል፤ በምንጩ የሌለ የኑፋቄ ወይም የትርጓሜ ጭማሪ አልተደረገም።
