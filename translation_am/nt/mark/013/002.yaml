base_translation:
  language: en
  yaml_path: translation/nt/mark/013/002.yaml
  text: And Jesus said to him[c][b][a], “Do you see these great buildings? Not one stone will be left here upon another that will not be torn down.”
translation:
  language: am
  text: ኢየሱስም እንዲህ አለው፤ “እነዚህን ታላላቅ ሕንፃዎች[a] ታያለህን? እዚህ አንድም ድንጋይ በሌላ ድንጋይ ላይ[b] ሳይፈርስ[c] አይቀርም።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እነዚህን ታላላቅ የቤተ መቅደሱ ሕንፃዎች።” አውዱ የቤተ መቅደሱን ሕንፃዎች ያመለክታል፤ የግሪኩ ጽሑፍ ግን “ሕንፃዎች” ብቻ ይላል።
    reason: lexical_alternative
  - marker: b
    text: “ድንጋይ በሌላ ድንጋይ ላይ” የሚለው አነጋገር ፍጹም ጥፋትን ያመለክታል።
    reason: cultural_note
  - marker: c
    text: ወይም፣ “ሳይደመሰስ” ወይም “ሳይወድቅ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπεις
  choice: ታያለህን?
  rationale: የግሪኩን ቀጥተኛ ጥያቄ በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል፤ የትእዛዝ ትርጉም አይጨምርም።
- source_word: μεγάλας οἰκοδομάς
  choice: ግዙፍ ሕንፃዎች
  rationale: ‘ግዙፍ’ የመጠንንና የግርማን ስሜት ያሳያል፤ ‘ሕንፃዎች’ ደግሞ ግሪኩ በግልጽ ያልጨመረውን ‘የቤተ መቅደስ’ የሚል ማብራሪያ ሳያስገባ ብዙ ሕንፃዎችን ይጠቁማል።
- source_word: οὐ μὴ ἀφεθῇ
  choice: አንድም … አይቀርም
  rationale: οὐ μή የሚያሳየውን ጠንካራ የወደፊት እምቢታ ‘አንድም’ ከሚለው አጽንዖት ጋር በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ὧδε
  choice: እዚህ
  rationale: የቦታውን ቀጥተኛና በቅርብ የሚጠቁም አገላለጽ ይጠብቃል።
- source_word: λίθος ἐπὶ λίθον
  choice: ድንጋይ በሌላው ድንጋይ ላይ
  rationale: የግሪኩን ምስላዊ አነጋገር ጠብቆ በአማርኛ ግልጽና ተፈጥሯዊ ያደርገዋል።
- source_word: ὃς οὐ μὴ καταλυθῇ
  choice: የማይፈርስ
  rationale: አንጻራዊውን ሐረግ ከ‘ድንጋይ’ ጋር ያያይዛል፤ καταλύω በዚህ የሕንፃን ማፍረስ ያመለክታል።
- source_word: καὶ ὁ Ἰησοῦς εἶπεν αὐτῷ
  choice: ኢየሱስም እንዲህ አለው
  rationale: καίን በ‘-ም’ አስተላልፎ፣ εἶπεν αὐτῷን ምንም ተጨማሪ የ‘መለሰ’ ትርጉም ሳያስገባ በተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: ትንቢቱ የሚመለከታቸው ሕንፃዎች
  choice: በዋናው ጽሑፍ ‘ሕንፃዎች’ ብቻ ተብሏል።
  alternative: ‘እነዚህ ግዙፍ የቤተ መቅደሱ ሕንፃዎች’
  rationale: አውዱ የቤተ መቅደሱን ሕንፃዎች እንደሚያመለክት ግልጽ ቢሆንም፣ ግሪኩ οἰκοδομάς (‘ሕንፃዎች’) ብቻ ይላል። ስለዚህ ዋናው ጽሑፍ የምንጩን አጠቃላይ ቃል ጠብቆ፣ የአውዱን መረጃ በማስታወሻ ያቀርባል።
- issue: የλίθος ἐπὶ λίθον አነጋገር ኃይል
  choice: ምስሉ በቀጥታ ተጠብቆ ‘አንድም’ በሚል አጽንዖት ቀርቧል።
  alternative: ‘ሁሉም ፈጽሞ ይደመሰሳል’
  rationale: ቃሉ ፍጹም ጥፋትን የሚያሳይ ፈሊጣዊ አነጋገር ቢሆንም፣ የድንጋይ በድንጋይ ላይ ምስልን መጠበቅ የጽሑፉን ግልጽ አቀራረብ ያቆያል።
