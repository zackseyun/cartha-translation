    rationale: It chiefly suggests enormous physical size. In context μέγας may denote both size and impressiveness; 'ታላላቅ' preserves that broader force.
  - severity: low
    issue: The phrase 'በሌላው ድንጋይ ላይ' uses an unnecessary definite form and the relative-clause order is somewhat stiff.
    rationale: The Greek idiom is more naturally represented in Amharic as no stone will remain on another without being torn down.
  - severity: low
    issue: Footnote c's second alternative, 'ወደ ታች የማይጣል,' is not idiomatic in the syntax of the verse.
    rationale: A participial alternative matching the main clause, such as 'ሳይወድቅ,' is clearer and better anchored.
