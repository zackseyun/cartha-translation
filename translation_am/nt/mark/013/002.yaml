  verdict: revise
  source_fidelity: The draft correctly conveys Jesus' direct question, the plural 'buildings,' the emphatic prediction that no stone will remain, and the destruction of the structures. However, 'ግዙፍ' narrows μεγάλος toward physical massiveness, whereas 'ታላላቅ' more naturally retains both size and grandeur. The stone-on-stone clause is also clearer when the destruction condition is integrated with what remains.
  naturalness: 'The revised wording is more idiomatic modern standard Amharic: ''በሌላ ድንጋይ'' avoids the unnecessarily definite ''በሌላው ድንጋይ,'' and ''ሳይፈርስ አይቀርም'' expresses the Greek relative clause fluently without losing its sense.'
  terminology: '''ሕንፃዎች'' appropriately renders οἰκοδομάς without adding ''temple'' to the main text. ''ፈረሰ/ማፍረስ'' is suitable for καταλύω in this structural-destruction context. ''ታላላቅ'' is preferred for μεγάλας.'
  issues:
