  text: καὶ ἀναστενάξας τῷ πνεύματι αὐτοῦ λέγει· Τί ἡ γενεὰ αὕτη ⸂ζητεῖ σημεῖον⸃; ἀμὴν λέγω ⸀ὑμῖν, εἰ δοθήσεται τῇ γενεᾷ ταύτῃ σημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/012.yaml
  text: And sighing deeply in his spirit[a], he says, “Why does this generation seek a sign? Truly I say to you, no sign will be given to this generation.”
translation:
  language: am
  text: በመንፈሱም በጥልቅ ቃተተና እንዲህ ይላል፦ “ይህ ትውልድ ምልክት ለምን ይፈልጋል? እውነት እላችኋለሁ፤ ለዚህ ትውልድ አንዳችም ምልክት አይሰጥም።”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “ለዚህ ትውልድ ምልክት ቢሰጥ” የሚል ነው፤ ይህ ምልክት ፈጽሞ እንደማይሰጥ የሚገልጽ የግሪክኛ የመሐላ ዓይነት አነጋገር ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστενάξας
  choice: በጥልቅ ተንፍሶ
  rationale: የἀνα- አጽንዖትንና የጥልቅ ትንፋሽ ስሜታዊ ኃይልን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τῷ πνεύματι αὐτοῦ
  choice: በመንፈሱ
  rationale: የግሪክኛውን የሰው ውስጣዊ መንፈስ አገላለጽ ሳያጠፋ የድርጊቱን ውስጣዊ ስፍራ ይጠብቃል።
- source_word: λέγει
  choice: ይላል
  rationale: በማርቆስ ትረካ ያለውን ሕያው ታሪካዊ አሁን ጊዜ ይጠብቃል።
- source_word: Τί
  choice: ለምን
  rationale: በዚህ የጥያቄ አገባብ τί ምክንያትን ይጠይቃል፤ ‘ለምን’ ተፈጥሯዊና ትክክለኛ ነው።
- source_word: γενεὰ
  choice: ትውልድ
  rationale: የቃሉን የጋራ ማኅበራዊና የዘመን ትርጉም ይጠብቃል።
- source_word: ζητεῖ
  choice: ይፈልጋል
  rationale: የቃሉ ቀጥተኛ ፍቺ ሲሆን ‘ይጠይቃል’ ወይም ‘ይገዳደራል’ የሚሉትን ተጨማሪ ልዩነቶች አያስገባም።
- source_word: σημεῖον
  choice: ምልክት
  rationale: የማረጋገጫ ድንቅ ተግባርን ሊያመለክት የሚችለውን ሰፊ ሥነ መለኮታዊ ትርጉም ይጠብቃል።
- source_word: ἀμὴν λέγω ὑμῖν
  choice: እውነት እላችኋለሁ
  rationale: የኢየሱስን የተለመደ ክብደት ያለው ማረጋገጫ በግልጽና በዘመናዊ አማርኛ ያቀርባል።
- source_word: εἰ δοθήσεται τῇ γενεᾷ ταύτῃ σημεῖον
  choice: ለዚህ ትውልድ አንዳችም ምልክት አይሰጥም
  rationale: የሴማዊ አነጋገር ተጽእኖ ያለበት የመሐላ ዓይነት εἰ ሐረግ ጠንካራ እምቢታን ያሳያል፤ ‘አንዳችም’ ይህን አጽንዖት በግልጽ ያስተላልፋል።
theological_decisions:
- issue: ከἀμὴν λέγω ὑμῖν በኋላ ያለውን የመሐላ ዓይነት εἰ ሐረግ መተርጎም
  choice: እንደ ጠንካራ እምቢታ፣ ‘አንዳችም ምልክት አይሰጥም’ ተተርጉሟል።
  alternative: ‘ለዚህ ትውልድ ምልክት የሚሰጥ ከሆነ’ የሚል ቃል በቃል ግን በአማርኛ ያልተሟላ የሚመስል አገላለጽ።
  rationale: የግሪክኛው ሐረግ የተተወ የመሐላ ፍጻሜ ያለው ሲሆን ዓላማው ምልክት ፈጽሞ እንደማይሰጥ ማስታወቅ ነው። ዋናው ጽሑፍ ይህን ኃይል በግልጽ ያቀርባል፤ የቅርጹ ልዩነት በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። ‘በመንፈሱ’ የሚለው የምንጩን ሰውነታዊ-ውስጣዊ አገላለጽ ይጠብቃል፤ ‘ይላል’ ደግሞ የማርቆስን ሕያው ትረካ ያስቀጥላል። የማስታወሻው ምልክት ከሚያብራራው የመሐላ ሐረግ በኋላ ተቀምጧል።
