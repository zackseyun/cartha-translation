source:
  edition: SBLGNT
  text: ὃς γὰρ ἐὰν ἐπαισχυνθῇ με καὶ τοὺς ἐμοὺς λόγους ἐν τῇ γενεᾷ ταύτῃ τῇ μοιχαλίδι καὶ ἁμαρτωλῷ, καὶ ὁ υἱὸς τοῦ ἀνθρώπου ἐπαισχυνθήσεται αὐτὸν ὅταν ἔλθῃ ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/038.yaml
  text: For whoever is ashamed of me and of my words in this adulterous and sinful generation[a], the Son of Man will also be ashamed of him when he comes in the glory of his Father with the holy angels.
translation:
  language: am
  text: ምክንያቱም በዚህ አመንዝራና ኃጢአተኛ ትውልድ ውስጥ በእኔና በቃሎቼ የሚያፍር ማንም ቢኖር፣ የሰው ልጅም ከቅዱሳን መላእክት ጋር በአባቱ ክብር ሲመጣ በእርሱ ያፍራል።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ታማኝ ያልሆነና ኃጢአተኛ ትውልድ።” “አመንዝራ” የሚለው በዋናው ጽሑፍ የተጠበቀው ግሪኩ የቃል ኪዳን ታማኝነት ማጣትን ለማመልከት የአመንዝርነትን ተጨባጭ ትንቢታዊ ምሳሌ ስለሚጠቀም ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαισχυνθῇ / ἐπαισχυνθήσεται
  choice: የሚያፍር / ያፍራል
  rationale: የግሪኩን የኀፍረት ትርጉምና በሰውየው የአሁን ምላሽ እና በሰው ልጅ የወደፊት ምላሽ መካከል ያለውን ተመሳሳይነት ይጠብቃል፤ “ይክደዋል” ከምንጩ ይልቅ የጠነከረ ትርጓሜ ነው።
- source_word: λόγους
  choice: ቃሎቼ
  rationale: የግሪኩን ብዙ ቁጥርና የኢየሱስን ግላዊ አነጋገር ይጠብቃል፤ “መልእክቴ” ለስላሳ ቢሆንም የበለጠ ትርጓሜያዊ ነው።
- source_word: γενεᾷ
  choice: ትውልድ
  rationale: የአሁኑን ማኅበራዊና ሥነ ምግባራዊ የሰዎች ስብስብ የሚያመለክተውን መደበኛ አቻ ቃል ይሰጣል።
- source_word: μοιχαλίδι
  choice: አመንዝራ
  rationale: የቃሉን ቀጥተኛ የዝሙት ምሳሌ ይጠብቃል፤ በትንቢታዊ አጠቃቀም መንፈሳዊና የቃል ኪዳን ታማኝነት ማጣትንም ሊያመለክት ይችላል።
- source_word: ἁμαρτωλῷ
  choice: ኃጢአተኛ
  rationale: ቀጥተኛና በዘመናዊ አማርኛ የተለመደ አቻ ቃል ነው፤ “ክፉ” ምንጩ ያልጠየቀውን ጥንካሬ ሊጨምር ይችላል።
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: የሰው ልጅ
  rationale: የተመሰረተውን መሲሐዊ ማዕረግና ዳንኤላዊ ጥላውን ይጠብቃል፤ “እኔ” ብሎ መተርጎም የማዕረጉን ኃይል ያጠፋል።
- source_word: δόξῃ
  choice: ክብር
  rationale: መለኮታዊ ክብርን፣ ግርማንና ብርሃናዊ ሞገስን የሚይዘው የተለመደ መጽሐፍ ቅዱሳዊ አቻ ቃል ነው።
- source_word: μετὰ τῶν ἀγγέλων τῶν ἁγίων
  choice: ከቅዱሳን መላእክት ጋር
  rationale: የግሪኩን ቅጽል ግንባታ በተፈጥሯዊ አማርኛ ያቀርባል፤ በምንጩ የሌለውን “ከቅዱሳን መላእክቱ” የባለቤትነት ሐሳብ አይጨምርም።
- source_word: ὃς γὰρ ἐὰν
  choice: ማንም ቢኖር
  rationale: አጠቃላይ ሁኔታዊ ንግግሩን በተፈጥሯዊ አማርኛ ያስተላልፋል፤ የጥቅሱ አስረጂ ግንኙነት በአውዱ ይታያል።
- source_word: ἐν τῇ γενεᾷ ταύτῃ
  choice: በዚህ ... ትውልድ መካከል
  rationale: የኀፍረቱን ማኅበራዊና ሥነ ምግባራዊ አውድ በተፈጥሯዊ አማርኛ ግልጽ ያደርጋል።
theological_decisions:
- issue: የ“አመንዝራ” ምሳሌያዊ ኃይል
  choice: የትንቢታዊውን የመንፈሳዊና የቃል ኪዳን ታማኝነት ማጣት ምሳሌ ለመጠበቅ “አመንዝራ” በዋናው ጽሑፍ ተቀምጧል።
  alternative: “ታማኝ ያልሆነ” ብሎ መተርጎም
  rationale: ግሪኩ μοιχαλίδι የሚለውን ተጨባጭ የዝሙት ምሳሌ ይጠቀማል፤ እሱን መጠበቅ የትንቢታዊ ቋንቋውንና የኪዳን ማጣቀሻውን ሳይፈታ ያቆያል።
- issue: “የሰው ልጅ” የሚለው ማጣቀሻ
  choice: ራስን የሚያመለክተው መሲሐዊ ማዕረግ “የሰው ልጅ” እንዳለ ተጠብቋል።
  alternative: “እኔ” ወይም “መሲሑ”
  rationale: የግሪኩ ጽሑፍ የፍጻሜ ዘመንና የክርስቶስ ማንነት ክብደት ያለውን ልዩ ማዕረግ ይጠቀማል፤ በተውላጠ ስም መተካት ይህን ኃይል ያሳንሳል።
- issue: αὐτόν የሚለው ነጠላ ወንድ ተውላጠ ስም
  choice: “በእርሱ” በሚል ነጠላ ወንድ ቅርጽ ተተርጉሟል።
  alternative: “በእነርሱ”
  rationale: የግሪኩን ነጠላ ሰዋሰዋዊ ቅርጽና አጠቃላይ ወካይነቱን ይጠብቃል።
- issue: የἀφίημι ዓይነት ይቅርታ ሳይሆን የኀፍረት ተመላላሽ ፍርድ
  choice: በሁለቱም ክፍሎች “ማፈር” ተጠብቋል።
  alternative: በሁለተኛው ክፍል “መካድ” ወይም “አለመቀበል”
  rationale: የተደገመው ተመሳሳይ ግሪክ ግስ የአሁኑን ሰዋዊ ምላሽና የወደፊቱን የሰው ልጅ ምላሽ በቀጥታ ያገናኛል።
