lexical_decisions:
- source_word: ἦσαν
  choice: ነበሩ
  rationale: በዚህ አገባብ የሕዝቡን ቁጥር የሚገልጽ ሲሆን፣ በአማርኛ «ነበሩ» ተፈጥሯዊና ግልጽ ነው።
- source_word: δὲ
