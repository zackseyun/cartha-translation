  rationale: δέ ቀላል የንግግር ማያያዣ ነው። በዚህ አጭር ዐረፍተ ነገር ልዩ ቃል ከመጨመር ይልቅ በሥርዓተ ነጥብና በቀጣዩ «-ም» ማስተላለፉ ተፈጥሯዊ ነው።
- source_word: ὡς
  choice: ያህል
  rationale: ከቁጥር ጋር ያለው ὡς ግምታዊነትን ያመለክታል፤ «ያህል» ይህን በዘመናዊ አማርኛ በግልጽ ያስተላልፋል።
- source_word: τετρακισχίλιοι
  choice: አራት ሺህ
  rationale: ቁጥሩን ቀጥተኛና ግልጽ በሆነ መንገድ ይተረጉማል።
- source_word: ἀπέλυσεν
  choice: አሰናበታቸው
  rationale: በዚህ አውድ ἀπολύω ሕዝቡ እንዲሄድ መፍቀድን ወይም ማሰናበትን ያመለክታል፤ «አሰናበታቸው» ተፈጥሯዊና የአውዱን ሐሳብ የሚጠብቅ ነው።
- source_word: αὐτούς
  choice: -አቸው
  rationale: ተውላጠ ስሙ ወደ ሕዝቡ ይመለሳል፤ በአማርኛ በግሱ ላይ የተዋሐደው «-አቸው» ተፈጥሯዊ ነው።
