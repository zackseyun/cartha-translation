  choice: እንደሚገባው
  alternative: አስፈላጊ እንደሆነ
  rationale: መከራው፣ መናቁ፣ መገደሉና መነሣቱ የግድ እንደሆኑ ያሳያል፤ ነገር ግን ግሪኩ በዚህ ጥቅስ ካለው በላይ የዚያን ግዴታ ዘዴ ወይም ምንጭ አይወስንም።
