review_pass:
  verdict: revise
  source_fidelity: The draft preserves the sequence of suffering, rejection, death, and rising, and it correctly retains Mark’s ‘after three days.’ However, ሊናቅ means ‘be despised’ rather than the official rejection denoted by ἀποδοκιμασθῆναι, and እንደሚገባው weakens/misframes the impersonal necessity expressed by δεῖ.
  naturalness: The proposed revision uses a clear Amharic content clause after ‘began to teach them’ and employs the more natural plural form ቀናት in the temporal expression. Moving the footnote anchor to the temporal expression makes its reference unambiguous.
  terminology: የሰው ልጅ, ሽማግሌዎች, የካህናት አለቆች, and ጸሐፍት appropriately preserve the Gospel’s established historical terminology. እንዲጣል is used for the leadership’s formal rejection, without reducing it to personal contempt.
  issues:
  - severity: medium
    issue: ἀποδοκιμασθῆναι is rendered ሊናቅ.
    rationale: ሊናቅ primarily means ‘be despised/scorned.’ The Greek refers to being rejected or repudiated, in this context by recognized leadership groups.
  - severity: medium
    issue: δεῖ is rendered እንደሚገባው.
    rationale: This can mean ‘as is fitting/proper,’ and the possessive ending can suggest an unstated personal referent. The Greek expresses strong impersonal necessity; የግድ እንደሆነ communicates this more directly without specifying why.
  - severity: low
    issue: The footnote anchor occurs at the end of the verse.
    rationale: The note concerns only μετὰ τρεῖς ἡμέρας, so its anchor should follow the Amharic temporal phrase directly.
