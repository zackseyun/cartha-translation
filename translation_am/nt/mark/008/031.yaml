  rationale: የካህናትን መሪዎች ወይም ዋና ዋና ካህናትን ያመለክታል፤ ብዙ ሊቃነ ካህናት እንዳሉ አያስመስልም።
- source_word: τῶν γραμματέων
  choice: በጸሐፍት
  rationale: ታሪካዊ ልዩነቱንና የግሪኩን ቃላዊ ቅርጽ የሚጠብቅ የተለመደ መጽሐፍ ቅዱሳዊ አጠራር ነው።
- source_word: ἀποκτανθῆναι
  choice: ሊገደል
  rationale: የተደራጊ አንቀጹን ቀጥተኛና ከባድ ሐሳብ ያለ ተጨማሪ የሕግ ትርጓሜ ያቀርባል።
- source_word: μετὰ τρεῖς ἡμέρας
  choice: ከሦስት ቀን በኋላ
  rationale: μετά ከተሳቢ ጋር ያለውን ግልጽ ‘በኋላ’ ትርጉም ይጠብቃል፤ ‘በሦስተኛው ቀን’ ብሎ ከትይዩ ጥቅሶች ጋር አያስማማውም።
- source_word: ἀναστῆναι
  choice: ሊነሣ
  rationale: የግሪኩን አድራጊ ያልሆነ ቅርጽ በቀጥታ ይጠብቃል፤ ‘እንዲነሣ ይደረጋል’ የሚል የተደራጊ ቅርጽ አያስገባም።
