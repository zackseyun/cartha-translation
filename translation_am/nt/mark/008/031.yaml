  rationale: የማዕረጉን ቀጥተኛ ቅርጽና መጽሐፍ ቅዱሳዊ ግንኙነት ይጠብቃል።
- source_word: πολλὰ παθεῖν
  choice: ብዙ መከራ ሊቀበል
  rationale: የብዙና ሰፊ ሥቃይን ሐሳብ በተለመደና ክብር ባለው አማርኛ ይገልጣል።
- source_word: ἀποδοκιμασθῆναι
