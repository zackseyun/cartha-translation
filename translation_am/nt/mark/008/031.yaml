- source_word: ὑπὸ τῶν πρεσβυτέρων
  choice: በሽማግሌዎች
  rationale: ቃሉ ተራ በዕድሜ የገፉ ሰዎችን ሳይሆን የታወቀውን የአይሁድ አመራር ቡድን ያመለክታል።
- source_word: τῶν ἀρχιερέων
