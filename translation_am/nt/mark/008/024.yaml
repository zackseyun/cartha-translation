id: MRK.8.24
reference: Mark 8:24
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ἀναβλέψας ἔλεγεν· Βλέπω τοὺς ἀνθρώπους ὅτι ὡς δένδρα ὁρῶ περιπατοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/024.yaml
  text: And looking up, he said, “I see people, because I see them walking around like trees.”
translation:
  language: am
  text: ወደ ላይም ተመልክቶ፣ “ሰዎችን አያለሁ፤ እንደ ዛፎች ሆነው ሲራመዱ አያቸዋለሁና” አለ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβλέψας
  choice: ወደ ላይም ተመልክቶ
  rationale: የግሪኩን መሠረታዊ ፍቺ ‘ወደ ላይ መመልከት’ በተፈጥሯዊ አማርኛ ይገልጻል፤ በዐውዱ ውስጥ የእይታ መመለስንም ሊያመለክት የሚችለውን አሻሚነት አይዘጋም።
- source_word: ὅτι
  choice: …አያቸዋለሁና
  rationale: እዚህ ያለውን ምክንያታዊ/ገላጭ ግንኙነት በ‘እና’ ቅጥያ ያቀርባል፤ ሰዎችን እንዳየ የሚናገርበት ምክንያት እንደ ዛፎች ሲራመዱ ማየቱ ነው።
- source_word: ὡς δένδρα
  choice: እንደ ዛፎች
  rationale: የተዛባውን እይታ የሚገልጸውን ቀጥተኛ ንጽጽር ይጠብቃል።
- source_word: περιπατοῦντας
  choice: ሲራመዱ
  rationale: የአሁን ጊዜ ተሳቢውን ቀጣይ እንቅስቃሴ በተፈጥሯዊ አማርኛ ያሳያል፤ የሚራመዱት ሰዎቹ መሆናቸውንም ግልጽ ያደርጋል።
theological_decisions:
- issue: የፈውሱ ደረጃ በሰውየው ንግግር የሚገለጥበት መንገድ
  choice: እይታው ገና ግልጽ እንዳልሆነ የሚያሳየውን ‘ሰዎች…እንደ ዛፎች’ ንጽጽር ሳይተረጎም በቀጥታ ማቅረብ
  alternative: ከፊል ፈውስ ወይም መንፈሳዊ ምሳሌ እንደሆነ በትርጉሙ ውስጥ ማብራራት
  rationale: ጥቅሱ የሰውየውን የእይታ ሪፖርት ብቻ ይሰጣል፤ ከዚያ በላይ የሆነ የትምህርት ትርጓሜ በጽሑፉ ላይ አይጨመርም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ቀላል የሆነ አማርኛ። የግሪኩ የቃላት ቅደም ተከተል በአማርኛ ተፈጥሯዊነት መጠን ተስተካክሏል፤ ነገር ግን ሁለቱ የማየት ግሶችና ምክንያታዊው ግንኙነት ተጠብቀዋል።
