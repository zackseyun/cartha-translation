  text: ὀφθαλμοὺς ἔχοντες οὐ βλέπετε καὶ ὦτα ἔχοντες οὐκ ἀκούετε; καὶ οὐ μνημονεύετε
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/018.yaml
  text: Having eyes[a], do you not see? And having ears, do you not hear? And do you not remember?
translation:
  language: am
  text: ዓይኖች እያላችሁ[a] አታዩምን? ጆሮዎችም እያላችሁ አትሰሙምን? አታስታውሱምን?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ዓይኖች እያላችሁ አትገነዘቡምን? ጆሮዎችም እያላችሁ አታስተውሉምን?” ግሪኩ ‘ማየት’ እና ‘መስማት’ የሚሉትን የተለመዱ ግሶች ይጠቀማል፤ በዐውዱ ግን መንፈሳዊ ግንዛቤንም ሊያመለክቱ ይችላሉ።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀφθαλμοὺς ἔχοντες
  choice: ዓይኖች እያሏችሁ
  rationale: የግሪኩን የተውሳከ ግስ አወቃቀርና የንግግሩን ወቀሳዊ ኃይል በተፈጥሯዊ አማርኛ ያቆያል፤ ‘ምንም ዓይኖች ቢኖሯችሁ’ የሚለውን ተቃርኖ በግልጽ አያክልም።
- source_word: βλέπετε
  choice: አታዩምን
  rationale: መሠረታዊውን ‘ማየት’ ትርጉም ይጠብቃል፤ በዐውዱ ያለው የመንፈሳዊ ግንዛቤ ፍንጭ ከቃሉ ይልቅ በዐውዱ እንዲገለጥ ይተዋል።
- source_word: ὦτα ἔχοντες
  choice: ጆሮዎችም እያሏችሁ
  rationale: ከመጀመሪያው ሐረግ ጋር ያለውን ትይዩነት ይጠብቃል፤ ‘ም’ የሚለው ቅጥያ καὶ የሚያስከትለውን ድምር ያሳያል።
- source_word: ἀκούετε
  choice: አትሰሙምን
  rationale: የቃሉን ቀጥተኛ ስሜታዊ ትርጉም ያቆያል፤ ‘አትገነዘቡምን’ ቢባል በዐውዱ ያለው ተዘዋዋሪ ትርጉም በዋናው ጽሑፍ ውስጥ በግልጽ ይጨመር ነበር።
- source_word: μνημονεύετε
  choice: አታስታውሱምን
  rationale: የአሁን ጊዜውን ወቀሳዊ ጥያቄ በግልጽና በተለመደ አማርኛ ያቀርባል።
- source_word: οὐ / οὐκ
  choice: አታ…ምን
  rationale: አሉታዊ የንግግር ጥያቄዎቹን በተፈጥሯዊ የአማርኛ ቅርጽ ይገልጻል።
theological_decisions:
- issue: ‘ማየት’ እና ‘መስማት’ ቀጥተኛ ወይስ ዘይቤያዊ ኃይል
  choice: በዋናው ጽሑፍ ‘ማየት’ እና ‘መስማት’ የሚሉትን ቀጥተኛ ግሶች ማቆየት
  alternative: ዘይቤያዊውን ትርጉም ግልጽ ለማድረግ ‘መገንዘብ’ እና ‘ማስተዋል’ ማለት
  rationale: ጥቅሱ መንፈሳዊ ድንዛዜን የሚጠቁም የነቢያት አነጋገር ያስተጋባል፤ ሆኖም ግሪኩ የተለመዱትን ‘ማየት’ና ‘መስማት’ ግሶች ይጠቀማል። ቀጥተኛውን አገላለጽ ማቆየት ዘይቤያዊ ኃይሉን ሳይሽር የጽሑፉን እርግጠኛ ያልሆነ ስፋት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ሦስቱ ተከታታይ አሉታዊ ጥያቄዎች የኢየሱስን ወቀሳዊ የንግግር ምት ያቆያሉ።
