  text: ሕይወቱን ለማዳን የሚፈልግ ሁሉ ያጣታልና፤ ስለ እኔና ስለ ወንጌል ሕይወቱን የሚያጣ ሁሉ ግን ያድናታል።[a]
  philosophy: optimal-equivalence
  footnotes:
