  text: ⸂καὶ ἔφαγον⸃ καὶ ἐχορτάσθησαν, καὶ ἦραν περισσεύματα κλασμάτων ἑπτὰ σπυρίδας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/008.yaml
  text: And they ate and were satisfied[a], and they picked up seven baskets of leftover pieces.
translation:
  language: am
  text: እነርሱም በልተው ጠገቡ፤ ከተረፉት ቁርጥራሾችም ሰባት ቅርጫት ሰበሰቡ[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ቅርጫት» ተብሎ የተተረጎመው የግሪክ ቃል σπυρίδας ምናልባት ትልልቅ የሆኑ ቅርጫቶችን ያመለክታል። ማርቆስ በአምስት ሺህ ሰዎች መመገብ ታሪክ ላይ ሌላ የግሪክ ቃል (κόφινοι፣ 6፥43) ይጠቀማል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: በሉ
  rationale: የግሪኩን ቀላል የትረካ አላፊ ድርጊት በተፈጥሯዊ አማርኛ ያስተላልፋል፤ በአውዱ ምክንያት በጥምር አረፍተ ነገሩ «በልተው» ሆኗል።
- source_word: ἐχορτάσθησαν
  choice: ጠገቡ
  rationale: እስኪበቃቸው ድረስ መመገባቸውን በተፈጥሯዊና ግልጽ ዘመናዊ አማርኛ ይገልጣል።
- source_word: ἦραν
  choice: ሰበሰቡ
  rationale: αἴρω በቀጥታ «አነሡ» ሊባል ቢችልም፣ በተረፈው ምግብ መሰብሰብ አውድ «ሰበሰቡ» ተፈጥሯዊና ትክክለኛ ነው።
- source_word: περισσεύματα
  choice: ከተረፉት
  rationale: ከምግቡ በኋላ በትርፍ የቀረውን ነገር ይገልጣል፤ ከκλασμάτων ጋር ተያይዞ «ከተረፉት ቁርስራሾች» ተብሏል።
- source_word: κλασμάτων
  choice: ቁርስራሾች
  rationale: ከእንጀራ ወይም ከምግብ የተቆራረሱ ቁራጮችን የሚያመለክት ግልጽና የተለመደ የአማርኛ ቃል ነው።
- source_word: ἑπτὰ σπυρίδας
  choice: ሰባት ቅርጫት ሙሉ
  rationale: ቁጥሩንና የመያዣውን ዓይነት ይጠብቃል። «ሙሉ» የሚለው ቃል ሰባቱ ቅርጫቶች በቁርስራሾች መሞላታቸውን በተፈጥሯዊ አማርኛ ያሳያል፤ σπυρίς ከ6፥43 κόφινος የተለየ ቃል መሆኑ በማስታወሻ ተጠብቋል።
