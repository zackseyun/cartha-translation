  text: καὶ ἐπιλαβόμενος τῆς χειρὸς τοῦ τυφλοῦ ⸀ἐξήνεγκεν αὐτὸν ἔξω τῆς κώμης, καὶ πτύσας εἰς τὰ ὄμματα αὐτοῦ, ἐπιθεὶς τὰς χεῖρας αὐτῷ, ἐπηρώτα αὐτόν· Εἴ τι ⸀βλέπεις;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/023.yaml
  text: And taking the blind man by the hand[a], he led him out of the village; and after spitting on his eyes and laying his hands on him, he asked him, “Do you see anything?”
translation:
  language: am
  text: የዕውሩን እጅ ይዞ ከመንደሩ ውጭ አወጣው፤ በዓይኖቹም ላይ ተፍቶ[a] እጆቹን በላዩ ላይ አኖረ፤ ከዚያም፣ “ምንም ነገር ታያለህ?” ብሎ ጠየቀው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም ቃል በቃል፣ “ወደ ዓይኖቹ ተፍቶ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιλαβόμενος τῆς χειρὸς
  choice: እጁን ይዞ
  rationale: ይህ አገላለጽ ሰውየውን በእጁ ይዞ መምራቱን በተፈጥሯዊና ግልጽ አማርኛ ያሳያል።
- source_word: τοῦ τυφλοῦ
  choice: እውሩን
  rationale: ግሪኩ ቅጽልን እንደ ስም ተጠቅሟል፤ «እውሩን» የወንድ ነጠላውን ተጠቃሽ በተፈጥሯዊ አማርኛ ያመለክታል።
- source_word: ἐξήνεγκεν
  choice: ከመንደሩ ውጭ አወጣው
  rationale: ቃሉ ወደ ውጭ ማውጣትን ያመለክታል፤ እጁን ይዞ ከመንደሩ ማውጣቱ በዐውዱ ውስጥ መምራቱንም በግልጽ ያሳያል።
- source_word: ἔξω τῆς κώμης
  choice: ከመንደሩ ውጭ
  rationale: κώμη አነስተኛ ሰፈርን ወይም መንደርን ያመለክታል፤ «መንደር» ትክክለኛና ዘመናዊ ምርጫ ነው።
- source_word: πτύσας εἰς τὰ ὄμματα αὐτοῦ
  choice: በዓይኖቹም ላይ ተፍቶ
  rationale: የፈውሱን ድርጊት አካላዊና ግልጽ ባሕርይ ሳያለዝብ ያቀርባል። εἰς ቃል በቃል «ወደ» ሊባል ቢችልም፣ «በ...ላይ» በአማርኛ ተፈጥሯዊ ነው፤ የቃል በቃሉ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ἐπιθεὶς τὰς χεῖρας αὐτῷ
  choice: እጆቹን በላዩ ላይ ጫነ
  rationale: የእጆቹን አካላዊ ንክኪ በቀጥታ ይገልጣል፤ ጽሑፉ ያልጠየቀውን ሥርዓታዊ ትርጉም አይጨምርም።
- source_word: ἐπηρώτα
  choice: ጠየቀው
  rationale: ምንም እንኳ ግሪኩ ያልተፈጸመ ጊዜ ቅርጽ ቢጠቀምም፣ በአማርኛ ትረካ «ጠየቀው» ግልጽና ተፈጥሯዊ ነው።
- source_word: Εἴ τι βλέπεις;
  choice: የሆነ ነገር ታያለህ?
  rationale: τι ያለውን ያልተወሰነ ሐሳብ ይጠብቃል፤ ጥያቄውም ሰውየው አንዳች ነገር ማየት መጀመሩን ይመረምራል።
theological_decisions:
- issue: የፈውሱን አካላዊ ድርጊቶች ሳያለዝቡ መተርጎም
  choice: በዓይኖቹ ላይ መትፋቱንና እጆቹን በላዩ ላይ መጫኑን በግልጽ ማቅረብ
  alternative: አካላዊ ዝርዝሩን በሚያለዝብ አጠቃላይ የፈውስ አገላለጽ መተካት
  rationale: ጥቅሱ ተጨባጭና እንኳን ለአንባቢ የሚያስገርሙ ድርጊቶችን ይተርካል፤ ትርጉሙ እነዚህን ማለዘብ የለበትም።
- issue: እጅን መጫን ሊኖረው የሚችለው ሥርዓታዊ ፍቺ
  choice: እጆቹን በላዩ ላይ ጫነ በማለት እንደ አካላዊ ንክኪ መግለጽ
  alternative: እንደ መደበኛ ሃይማኖታዊ ሥርዓት መተርጎም
  rationale: በዐውዱ ውስጥ ሐረጉ የኢየሱስን የፈውስ ንክኪ ይገልጣል፤ ጽሑፉ የማይጠይቀውን ኋለኛ ቤተ ክርስቲያናዊ ፍቺ መጨመር አይገባም።
