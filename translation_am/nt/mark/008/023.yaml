  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የትረካው ተከታታይነት በአጭር ዓረፍተ ነገሮች ተጠብቋል። በእንግሊዝኛው የማስታወሻ ምልክት ከ«እጁን ይዞ» ቀጥሎ ቢታይም፣ የማስታወሻው ይዘት εἰς τὰ ὄμματα ስለሚመለከት ምልክቱ ከ«ተፍቶ» ቀጥሎ ተቀምጧል።
