  yaml_path: translation/nt/mark/008/037.yaml
  text: For what can a man give in exchange for his life?[a]
translation:
  language: am
  text: ሰውስ ለሕይወቱ[a] በምትክ ምን ሊሰጥ ይችላል?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ነፍስ።” የግሪክኛው ቃል እንደ አውዱ “ሕይወት፣” “ራስ” ወይም “ነፍስ” ማለት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: ምን
  rationale: τί የ‘ምን?’ ጥያቄን ያቀርባል፤ γάρ ደግሞ ከቀደመው ንግግር ጋር የማብራሪያ ትስስር ይፈጥራል። በአማርኛ የጥያቄው አውድ ይህን ትስስር በተፈጥሮ ያሳያል።
- source_word: δοῖ
  choice: ሊሰጥ ይችላል
  rationale: የድርጊቱን እውነተኛ አለመቻል በአጽንዖት የሚጠይቀውን የንግግር ጥያቄ በተፈጥሮ ያስተላልፋል።
- source_word: ἄνθρωπος
  choice: ሰው
  rationale: ἄνθρωπος እዚህ አንድን ወንድ ብቻ ሳይሆን ማንኛውንም ሰው በወካይነት ያመለክታል፤ ‘ሰው’ ይህን አጠቃላይ ኃይል በቀጥታ ይጠብቃል።
- source_word: ἀντάλλαγμα
  choice: ቤዛ
  rationale: ቃሉ በምትክ ወይም መልሶ የሚሰጥን ነገር ያመለክታል። ‘ቤዛ’ በዘመናዊ አማርኛ ለማስመለስ የሚከፈልን ዋጋ በአጭርና በክብር ይገልጻል።
- source_word: τῆς ψυχῆς αὐτοῦ
  choice: ስለ ሕይወቱ
  rationale: በማርቆስ 8፥35-37 አውድ ψυχή ሕይወትንና ሙሉ ማንነትን በተደራራቢ ሁኔታ ይጠቁማል። ‘ሕይወት’ ከቀደመው አውድ ጋር ግልጽ ትስስር ይፈጥራል፤ ‘ነፍስ’ የሚለው አማራጭ በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: በድነት አውድ ያለውን ψυχή መተርጎም
  choice: ሕይወት
  alternative: ነፍስ፤ ማንነት
  rationale: አውዱ ሰው ዓለምን ሁሉ ቢያተርፍም ψυχήውን ሊያጣ እንደሚችል ይናገራል። ‘ሕይወት’ የአውዱን ቀጣይነትና ተነባቢነት ይጠብቃል፤ ቃሉ ሥጋዊ ሕይወትን ብቻ እንዳያመለክት የ‘ነፍስ’ እና የ‘ማንነት’ ትርጉሞች በማስታወሻ ቀርበዋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የንግግር ጥያቄው አጭርነትና ኃይል ተጠብቋል፤ ψυχή ያለው የትርጉም ስፋት በዋናው ጽሑፍና በማስታወሻው በአንድነት ቀርቧል።
