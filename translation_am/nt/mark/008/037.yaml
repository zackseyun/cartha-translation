  verdict: revise
  source_fidelity: The draft correctly renders the rhetorical question, ἄνθρωπος as the generic ሰው, and ψυχή primarily as ሕይወት with a lexical note. However, it leaves γάρ entirely unrepresented and uses ቤዛ, which can more specifically suggest a ransom; ἀντάλλαγμα here is the thing offered in exchange.
  naturalness: The draft is readily understandable, but “ለሕይወቱ በምትክ ምን ሊሰጥ” is more idiomatic and directly reflects the Greek construction than “ስለ ሕይወቱ ምን ቤዛ ሊሰጥ.” ሰውስ naturally carries the discourse-linking force in this concise rhetorical question.
  terminology: Use በምትክ for ἀντάλλαγμα to retain its broad exchange sense without importing the more specialized ransom association of ቤዛ. Retain ሕይወት in the text and note ነፍስ and ራስ as context-dependent alternatives for ψυχή.
  issues:
