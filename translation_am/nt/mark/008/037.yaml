    rationale: ቤዛ commonly evokes a ransom paid for release, whereas the Greek asks broadly what one could give as an exchange for one’s ψυχή. በምትክ preserves the source sense without narrowing it.
  - severity: low
    issue: The footnote’s quoted alternative has punctuation inside the quoted word and uses “ማንነት” for “self.”
    rationale: A cleaner note is “ነፍስ” and “ራስ,” which are more direct lexical alternatives and read naturally in Amharic.
