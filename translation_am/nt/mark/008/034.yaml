  to: ሕዝቡን ከደቀ መዛሙርቱ ጋር ጠርቶ እንዲህ አላቸው፤ “ማንም በኋላዬ ሊመጣ ቢፈልግ፣ ራሱን ይካድ፣ መስቀሉንም ያንሣ፣ ይከተለኝ።”
  rationale: The revision clarifies that both the crowd and the disciples were summoned, improves the idiomatic rendering of ‘come after me,’ and retains the Greek possessive in a natural Amharic form through ‘መስቀሉን.’ The footnote remains anchored to ‘ያንሣ’ and preserves the literal cross image without reducing it to generic hardship.
