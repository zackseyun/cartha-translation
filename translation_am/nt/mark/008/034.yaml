review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the conditional invitation, the three imperative demands, the literal ‘cross,’ and the distinction between ‘come after me’ and ‘follow me.’ However, its initial word order (‘ከደቀ መዛሙርቱም ጋር ሕዝቡን’) can suggest that Jesus called the crowd while accompanied by the disciples, rather than summoning both the crowd and his disciples as the Greek σὺν τοῖς μαθηταῖς αὐτοῦ specifies.
  naturalness: The imperative sequence is clear and natural. ‘በኋላዬ ሊመጣ’ is a more idiomatic modern Amharic expression than ‘ከእኔ በኋላ መምጣት,’ while still preserving the source’s wording and its distinction from the subsequent command to follow.
  terminology: ‘ደቀ መዛሙርቱ,’ ‘ራሱን ይካድ,’ ‘መስቀል,’ and ‘ይከተለኝ’ are appropriate, understandable, and preserve the theological and historical concreteness of the Greek without interpretive paraphrase.
  issues:
  - severity: medium
    issue: Ambiguous attachment of ‘ከደቀ መዛሙርቱም ጋር’
    rationale: Placed before ‘ሕዝቡን,’ the phrase may be understood as describing Jesus’ accompaniment by the disciples as he called the crowd. The Greek indicates that he called the crowd together with his disciples; placing the phrase directly after ‘ሕዝቡን’ better expresses this.
  - severity: low
    issue: Less idiomatic rendering of ὀπίσω μου ἐλθεῖν
    rationale: ‘ከእኔ በኋላ መምጣት’ is understandable, but ‘በኋላዬ ሊመጣ’ is more natural modern Amharic and preserves the metaphorical wording without collapsing it into the later ‘follow me.’
  revised_text: ሕዝቡን ከደቀ መዛሙርቱ ጋር ጠርቶ እንዲህ አላቸው፤ “ማንም በኋላዬ ሊመጣ ቢፈልግ፣ ራሱን ይካድ፣ መስቀሉንም ያንሣ፣ ይከተለኝ።”
