  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενος τὸν ὄχλον σὺν τοῖς μαθηταῖς αὐτοῦ εἶπεν αὐτοῖς· ⸂Εἴ τις⸃ θέλει ὀπίσω μου ⸀ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/034.yaml
  text: And after calling the crowd together with his disciples[a], he said to them, “If anyone wants to come after me, let him deny himself, take up his cross[b], and follow me.”
translation:
  language: am
  text: ሕዝቡን ከደቀ መዛሙርቱ ጋር ጠርቶ እንዲህ አላቸው፤ “ማንም በኋላዬ ሊመጣ ቢፈልግ፣ ራሱን ይካድ፣ መስቀሉንም ያንሣ፣ ይከተለኝ።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: ወደ እርሱ ጠርቶ
  rationale: የአኦሪስት መካከለኛ ተውሳከ ግስ ሲሆን፣ ሕዝቡን ወደ ራሱ ጠርቶ ከዚያ እንደተናገረ የድርጊቱን ቅደም ተከተል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ὄχλον
  choice: ሕዝቡን
  rationale: በትረካው አውድ የተሰበሰበውን ብዙ ሰው በዘመናዊና ክቡር አማርኛ ይገልጻል።
- source_word: σὺν τοῖς μαθηταῖς αὐτοῦ
  choice: ከደቀ መዛሙርቱም ጋር
  rationale: σύν የአብሮነትን ሐሳብ ይጠብቃል፤ ሕዝቡና ደቀ መዛሙርቱ አብረው እንደተጠሩና እንደተነገራቸው ግልጽ ያደርጋል።
- source_word: Εἴ τις θέλει
  choice: ማንም … ቢፈልግ
  rationale: አጠቃላይና ክፍት ጥሪን የሚያስተዋውቅ ሁኔታዊ አገላለጽ ነው።
- source_word: ὀπίσω μου ἐλθεῖν
  choice: ከእኔ በኋላ መምጣት
  rationale: የደቀ መዝሙርነትን ምስል በቀጥታ ይጠብቃል፤ በኋላ ያለው ἀκολουθείτω μοι ደግሞ በተለየ ሁኔታ “ይከተል” ተብሎ እንዲተረጎም ያስችላል።
- source_word: ἀπαρνησάσθω ἑαυτόν
  choice: ራሱን ይካድ
  rationale: የሦስተኛ መደብ ትእዛዝን ይጠብቃል፤ ሐሳቡም ቀላል ራስን ከአንድ ነገር መከልከል ሳይሆን ራስን መካድ ነው።
- source_word: ἀράτω τὸν σταυρὸν αὐτοῦ
  choice: የራሱን መስቀል ያንሣ
  rationale: αἴρω የመስቀልን ቀጥተኛና ታሪካዊ ምስል እንደ “ማንሣት” ያቀርባል፤ αὐτοῦ የግለሰቡን ባለቤትነትና ዋጋ በ“የራሱን” ይጠብቃል።
- source_word: ἀκολουθείτω μοι
  choice: እኔንም ይከተል
  rationale: የአሁን ጊዜ ትእዛዝን በተፈጥሯዊ አማርኛ ያቀርባል፤ የቀጣይነት ጥላው በደቀ መዝሙርነት አውድ ውስጥ ይሰማል።
theological_decisions:
- issue: የደቀ መዝሙርነት ትእዛዞች ኃይል
  choice: “ራሱን ይካድ፣ … ያንሣ፣ … ይከተል” በሚሉ የሦስተኛ መደብ ትእዛዞች ማቅረብ
  alternative: “ሊክድ፣ ሊያነሣና ሊከተል ይገባዋል” ብሎ ማቅረብ
  rationale: ግሪኩ ክፍት ሁኔታዊ ጥሪን ከቀጥተኛ ትእዛዞች ጋር ያጣምራል፤ ትርጉሙ ይህን ውጥረት ያለ ቤተ እምነታዊ ትርጓሜ ይጠብቃል።
- issue: በአውዱ ውስጥ የσταυρός ትርጉም
  choice: “መስቀል” ብሎ በቀጥታ ማስቀመጥ
  alternative: “ሸክም፣” “መከራ፣” ወይም “የሞት መሣሪያ” ብሎ መተርጎም
  rationale: ምስሉ በሮማውያን የመስቀል ቅጣት ላይ የተመሠረተ ስለሆነ ቀጥተኛነቱና ክብደቱ ሊጠበቅ ይገባል፤ በ“ሸክም” ወይም “መከራ” ብቻ መተካት ሐሳቡን ያጠባል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ሁኔታዊ ጥሪ፣ ትእዛዛዊ ኃይልና የመስቀሉ ቀጥተኛ ምስል ተጠብቀዋል። በቀረበው የእንግሊዝኛ ንባብ [a] ምልክትና የግርጌ ማስታወሻው ይዘት መካከል ያለው አለመጣጣም ወደ አማርኛው አልተላለፈም።
