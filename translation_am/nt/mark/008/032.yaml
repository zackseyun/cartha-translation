base_translation:
  language: en
  yaml_path: translation/nt/mark/008/032.yaml
  text: And he was speaking the word openly[a]. And Peter took him aside and began to rebuke him.
translation:
  language: am
  text: እርሱም ይህን ነገር በግልጽ[a] ይናገር ነበር። ጴጥሮስም እርሱን ወደ ጎን ወስዶ ሊገሥጸው ጀመረ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በግልጥ” ወይም “በድፍረት።” የግሪኩ ቃል ያለ ሽፋንና ያለ ማድበስበስ መናገርን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησίᾳ
  choice: በግልጽ
  rationale: ቃሉ ያለ ሽፋንና ያለ ማድበስበስ በግልጽ መናገርን ያመለክታል፤ እዚህ ዋናው አጽንዖት ከድፍረት ይልቅ የንግግሩ ግልጽነት ነው።
- source_word: τὸν λόγον
  choice: ይህን ነገር
  rationale: በቀደመው ቁጥር የተነገረውን የኢየሱስ መከራ፣ ሞትና ትንሣኤ ይመለከታል። ‘ይህን ነገር’ የንግግሩን ትስስር በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐλάλει
  choice: ይናገር ነበር
  rationale: የግሪኩ ያልተፈጸመ ግስ ቀጣይ ወይም በሂደት ላይ ያለ ንግግርን ያሳያል፤ ‘ይናገር ነበር’ ይህን ገጽታ ይጠብቃል።
- source_word: προσλαβόμενος
  choice: ወደ ጎን ወስዶት
  rationale: በዐውዱ ጴጥሮስ ኢየሱስን ለብቻው አድርጎ ሊናገረው ወደ ጎን መውሰዱን ያመለክታል፤ ይህ አገላለጽ በአማርኛ ተፈጥሯዊ ነው።
- source_word: ἤρξατο ἐπιτιμᾶν αὐτῷ
  choice: ሊገሥጸው ጀመር
  rationale: ἤρξατο ከወሰን የሌለው ግስ ጋር ‘ጀመረ’ የሚለውን ኃይል ይሰጣል፤ ἐπιτιμάω ደግሞ ጠንካራ ወቀሳን ወይም ተግሣጽን ያመለክታል።
theological_decisions:
- issue: παρρησίᾳ ከኢየሱስ የመከራ ትንቢት ጋር ያለው ኃይል
  choice: በግልጽ
  alternative: በግልጥ፣ በድፍረት
  rationale: ይህ ትርጉም ኢየሱስ ስለሚመጣው መከራ ያለ ማድበስበስ መናገሩን ያጎላል፤ የጴጥሮስን ቀጥተኛ ምላሽም ያስረዳል። ጽሑፉ ከሚፈቅደው በላይ የድፍረት ሥነ መለኮታዊ አጽንዖት አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ገሠጸ’ የግሪኩን ጠንካራ የወቀሳ ኃይል ሲጠብቅ ከመጠን በላይ ቴክኒካዊ አይደለም።
