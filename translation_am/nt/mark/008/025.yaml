  alternative: ግሶቹን ሁሉ ሂደታቸውን ሳያሳዩ እንደ ተጠናቀቁ ያለፉ ድርጊቶች መተርጎም።
  rationale: የግሪኩ ተከታታይ ግሶች፣ በተለይም ἐνέβλεπεν የተባለው ያልተጠናቀቀ ግስ፣ የተከፈተ ሂደትና የቀጠለ ውጤት ያሳያሉ፤ ትርጉሙ ይህን ሳይደልዝ ይጠብቃል።
