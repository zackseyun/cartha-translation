  yaml_path: translation/nt/mark/008/025.yaml
  text: Then again he laid his hands on his eyes[a], and he saw clearly and was restored[b], and he was seeing everything distinctly.
translation:
  language: am
  text: ከዚያም እንደገና በዓይኖቹ ላይ እጆቹን አኖረ[a]፤ እርሱም አጥርቶ አየ፣ የዓይኑ ብርሃንም ተመለሰለት[b]፣ ሁሉንም ነገር በግልጽ ያይ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች፣ “በዓይኖቹ ላይ እጆቹን አኖረ፤ እርሱም አተኩሮ ተመለከተ፣ የዓይኑ ብርሃንም ተመለሰለት፣ ሁሉንም ነገር በግልጽ አየ” በሚል የሚወከል የተለየ አነባበብ አላቸው።
    reason: textual_variant
  - marker: b
    text: ወይም፣ “ሁሉንም ነገር በግልጽ ማየት ቻለ።” የመጨረሻው ሐረግ ቀጣይ ወይም የውጤት ሁኔታን የሚያሳይ ግስን፣ ግልጽ እይታን ከሚገልጽ ተውሳከ ግስ ጋር ያጣምራል።
    reason: lexical_alternative
