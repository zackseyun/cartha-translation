review_pass:
  verdict: revise
  source_fidelity: The draft preserves the forceful prohibition, the plural addressees, and the reference to speaking about Jesus. However, the initial ስለ እርሱም attaches καί (‘and’) to ‘about him,’ rather than representing the Greek narrative subject, ‘and he.’
  naturalness: The clause ለማንም እንዳይናገሩ is clear and natural. Moving -ም to the implied/expressed subject yields a more accurate and smoother sentence progression.
  terminology: አጥብቆ አስጠነቀቃቸው appropriately conveys the severe directive force of ἐπετίμησεν in this context without requiring an interpretive explanation. The lexical-alternative footnote is suitable.
  issues:
  - severity: medium
    issue: The conjunction -ም is attached to ስለ እርሱ.
    rationale: Greek καὶ ἐπετίμησεν means ‘and he warned/rebuked them’; it modifies the narrative action, not the prepositional phrase περὶ αὐτοῦ. ስለ እርሱም can be read as ‘and about him,’ while leaving the subject unmarked.
  revised_text: እርሱም ስለ እርሱ ለማንም እንዳይናገሩ አጥብቆ አስጠነቀቃቸው።[a]
