    reason: lexical_alternative
  revision_rationale: The revision places -ም on እርሱ, explicitly representing καί and the subject of ἐπετίμησεν. All other wording is retained because it accurately and naturally communicates the strong instruction not to speak to anyone about him. The footnote preserves viable lexical alternatives without imposing a reason for the command.
