    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: አጥብቆ አስጠነቀቃቸው
  rationale: ግሱ ብዙ ጊዜ ‘ገሠጸ’ የሚል ፍቺ ቢኖረውም፣ እዚህ የኢየሱስን ማንነት እንዳይገልጡ የተሰጠ ጥብቅ ክልከላ ነው። ‘አጥብቆ አስጠነቀቃቸው’ የትእዛዙን ክብደት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: αὐτοῖς
  choice: -አቸው
  rationale: በቅርቡ ዐውድ የተጠቀሱትን ደቀ መዛሙርት የሚያመለክት የብዙ ቁጥር ተውላጠ ስም ሲሆን ከግሱ ጋር ተዋሕዷል።
- source_word: ἵνα μηδενὶ λέγωσιν
  choice: ለማንም እንዳይናገሩ
  rationale: ἵνα ከንዑስ አንቀጹ ጋር የማስጠንቀቂያውን ይዘት ያሳያል፤ μηδενὶ ደግሞ ‘ለማንም’ ተብሎ በቀጥታ ተተርጉሟል።
- source_word: περὶ αὐτοῦ
  choice: ስለ እርሱ
  rationale: περί ከዘር አመልካች ጋር ‘ስለ፣ በተመለከተ’ የሚለውን ትርጉም ይሰጣል፤ ‘ስለ እርሱ’ ይህን በተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: በኢየሱስ ትእዛዝ ውስጥ ያለው ኃይልና ማንነቱን እንዳይገልጡ የተሰጠው ክልከላ
  choice: ትእዛዙን እንደ ጥብቅ ማስጠንቀቂያ ማቅረብ፣ ምክንያቱን ግን በትርጉሙ ውስጥ አለመጨመር
  alternative: ‘ገሠጻቸው’ ወይም ‘አጥብቆ አዘዛቸው’ ብሎ መተርጎም
  rationale: ጥቅሱ ጥብቅ ክልከላን በግልጽ ያሳያል፣ ነገር ግን የክልከላውን ሥነ መለኮታዊ ምክንያት አይገልጽም። ስለዚህ የትእዛዙን ክብደት ማቆየትና ያልተገለጸውን አለመጨመር ተመርጧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ግስ ክብደት በ‘አጥብቆ’ ተጠብቋል፣ አማራጭ ፍቺዎቹም በግርጌ ማስታወሻ ቀርበዋል።
