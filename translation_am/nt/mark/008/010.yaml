lexical_decisions:
- source_word: εὐθὺς
  choice: ወዲያውም
  rationale: የማርቆስን ትረካዊ ፍጥነትና የጊዜ ቅርበት በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἐμβὰς
  choice: ወደ ጀልባው ገብቶ
  rationale: የአውሪስት አንቀጸ ግስ ሆኖ ከዋናው ግስ በፊት የተፈጸመውን ድርጊት ያሳያል፤ ይህ አተረጓጎም በአማርኛ ተፈጥሯዊ ነው።
- source_word: πλοῖον
  choice: ጀልባ
  rationale: በገሊላ ባሕር ዐውድ ውስጥ መጠኑንና አጠቃቀሙን በተገቢ ሁኔታ የሚገልጽ የተለመደ ቃል ነው።
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: ከደቀ መዛሙርቱ ጋር
  rationale: μετά ከዘር ቅጽ ጋር የሚገልጸውን አብሮነት በግልጽና በክብር ባለው የአማርኛ አገላለጽ ያቀርባል።
- source_word: ἦλθεν
  choice: ሄደ
  rationale: ትረካው ከውጭ እይታ ወደ መድረሻው የተደረገን እንቅስቃሴ ስለሚገልጽ፣ ከ«መጣ» ይልቅ «ሄደ» በአማርኛ የተፈጥሮ ነው።
- source_word: τὰ μέρη
  choice: አውራጃ
  rationale: በግሪክ ብዙ ቁጥር የሆነውን «ክፍሎች/አካባቢዎች» አገላለጽ እንደ ጂኦግራፊያዊ ክልል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: Δαλμανουθά
  choice: ደማኑታ
  rationale: የቦታውን ስም ከግሪክ አጠራር በአማርኛ ፊደል የሚወክል ባህላዊና የሚነበብ አጻጻፍ ነው።
