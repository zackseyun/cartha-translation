    text: ወይም፣ «ወደ ደልማኑታ ክልል።» የግሪኩ ሐረግ ቃል በቃል «የደልማኑታ ክፍሎች/አካባቢዎች» የሚል የብዙ ቁጥር አገላለጽ ይጠቀማል።
