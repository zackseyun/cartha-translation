id: MRK.8.7
reference: Mark 8:7
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ εἶχον ἰχθύδια ὀλίγα· καὶ εὐλογήσας ⸀αὐτὰ εἶπεν ⸂καὶ ταῦτα παρατιθέναι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/007.yaml
  text: And they had a few small fish[a]; and after blessing them[b], he said to set these also before them.
translation:
  language: am
  text: ጥቂት ትናንሽ ዓሦችም ነበሯቸው፤ እርሱም ከባረካቸው በኋላ፣ እነዚህንም እንዲያቀርቡ ነገራቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰχθύδια
  choice: ትናንሽ ዓሦች
  rationale: የግሪኩ ቃል የመጠን ማነስን የሚያመለክት ቅርጽ ስላለው፣ ተራውን ‘ዓሦች’ ብቻ ከማለት ይልቅ ‘ትናንሽ ዓሦች’ ይህን ልዩነት ይጠብቃል።
- source_word: ὀλίγα
  choice: ጥቂት
  rationale: ቁጥራቸው አነስተኛ መሆኑን በተፈጥሯዊና ግልጽ አማርኛ ያሳያል።
- source_word: εὐλογήσας
  choice: ከባረካቸው በኋላ
  rationale: የአኦሪስት አንቀጽ ከዋናው ድርጊት በፊት የተፈጸመን ድርጊት ያመለክታል፤ ‘ባረከ’ ደግሞ εὐλογέωን በቅርብ ይከተላል።
- source_word: αὐτά
  choice: -አቸው
  rationale: በ‘ባረካቸው’ ውስጥ ያለው የብዙ ቁጥር ተውላጠ ስም ትናንሾቹን ዓሦች ይመለከታል።
- source_word: καὶ ταῦτα
  choice: እነዚህንም
  rationale: ‘-ም’ የκαίን ጨማሪ ኃይል፣ ‘እነዚህን’ ደግሞ የταῦταን ጠቋሚ አጽንኦት በተፈጥሯዊ አማርኛ ይጠብቃሉ።
- source_word: παρατιθέναι
  choice: እንዲያቀርቡ
  rationale: በምግብ አውድ παρατίθημι ምግብን በሰዎች ፊት ማቅረብ ወይም ማስተናገድ ማለት ነው፤ ይህ አተረጓጎም ንቁውን የትእዛዝ ሐሳብ ይጠብቃል።
- source_word: εἶπεν
  choice: ነገራቸው
  rationale: λέγω በመሠረቱ ‘መናገር’ ነው፤ ከተከታዩ የዓላማ አንቀጽ ጋር ‘እንዲያቀርቡ ነገራቸው’ የሚለው ተፈጥሯዊ አማርኛ ሲሆን የመመሪያውን ኃይልም ያሳያል።
