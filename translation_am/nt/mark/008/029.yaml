id: MRK.8.29
reference: Mark 8:29
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ αὐτὸς ⸂ἐπηρώτα αὐτούς⸃· Ὑμεῖς δὲ τίνα με λέγετε εἶναι; ⸀ἀποκριθεὶς ὁ Πέτρος λέγει αὐτῷ· Σὺ εἶ ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/029.yaml
  text: And he was asking them[a], “But who do you say that I am?” Peter answered him, “You are the Messiah.”
translation:
  language: am
  text: እርሱም ይጠይቃቸው ነበር፣ “እናንተስ ማን ነኝ ትሉኛላችሁ?” ጴጥሮስም መልሶ፣ “አንተ መሲሑ[a] ነህ።” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ክርስቶስ።”
    reason: χριστός ለሚለው የተለመደ አማራጭ አጠራር ለማሳየት።
lexical_decisions:
- source_word: καὶ αὐτὸς ἐπηρώτα αὐτούς
  choice: እርሱም ይጠይቃቸው ነበር
  rationale: “እርሱም” የαὐτόςን ጎላ ያለ አጠቃቀም ያሳያል፤ “ይጠይቃቸው ነበር” ደግሞ የἐπηρώταን ያልተፈጸመ የአላፊ ጊዜ ገጽታ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: Ὑμεῖς δὲ
  choice: እናንተስ
  rationale: “-ስ” ከቀደመው ስለ ሌሎች አስተያየት የቀረበው ጥያቄ ጋር ያለውን ንጽጽር ያሳያል፤ “እናንተ” የተገለጸውን ተውላጠ ስም አጽንዖት ይጠብቃል።
- source_word: τίνα με λέγετε εἶναι
  choice: ማን ነኝ ትሉኛላችሁ?
  rationale: የግሪኩን ከሳሽ ስምና የግስ ስም አወቃቀር ቃል በቃል ሳይኮርጅ፣ ትርጉሙን በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
- source_word: ἀποκριθεὶς ὁ Πέτρος λέγει αὐτῷ
  choice: ጴጥሮስም መልሶ … አለው
  rationale: የተሳቢውን ግስና በማርቆስ ትረካ የተለመደውን ታሪካዊ የአሁን ጊዜ በአማርኛ ተፈጥሯዊ በሆነ የአላፊ ጊዜ አገላለጽ ያስተላልፋል።
- source_word: Σὺ εἶ ὁ χριστός
  choice: አንተ መሲሑ ነህ
  rationale: ግልጽ የሆነው “አንተ” የΣύን አጽንዖት ይጠብቃል፤ “መሲሑ” ደግሞ χριστός በዚህ ስፍራ እንደ ማዕረግ መጠቀሙንና የአይሁድን መሲሐዊ ዳራ ያሳያል።
theological_decisions:
- issue: χριστόςን እንደ ማዕረግ መተርጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: χριστός በጴጥሮስ ንግግር ውስጥ እንደ ግለሰብ ስም ሳይሆን እንደ ማዕረግ ይሠራል። “መሲሑ” ይህን ትርጉምና የዕብራይስጥ ዳራውን ያቆያል፤ የተለመደው “ክርስቶስ” በማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለሕዝብ በቀላሉ የሚገባ የአማርኛ አገላለጽ ተመርጧል። የትረካው የጊዜ ገጽታና በጥያቄው ያለው ንጽጽራዊ አጽንዖት ተጠብቀዋል።
