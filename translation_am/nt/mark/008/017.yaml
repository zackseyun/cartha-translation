  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ ⸀γνοὺς λέγει αὐτοῖς· Τί διαλογίζεσθε ὅτι ἄρτους οὐκ ἔχετε; οὔπω νοεῖτε οὐδὲ συνίετε; ⸀πεπωρωμένην ἔχετε τὴν καρδίαν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/017.yaml
  text: And knowing[a], he says to them[c][b], “Why are you discussing that you have no bread? Do you not yet perceive or understand? Do you have your heart hardened?”
translation:
  language: am
  text: ይህንም አውቆ እንዲህ አላቸው፦ “እንጀራ ስለሌላችሁ ለምን ትነጋገራላችሁ?[a] ገና አታስተውሉም ወይም አትረዱም? ልባችሁ ደንድኖአልን?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “እንጀራ የለንም ብላችሁ ለምን ትነጋገራላችሁ?” ተብሎም ሊተረጎም ይችላል።
    reason: በὅτι ያለው ሐረግ ምክንያትን (“ስለሌላችሁ”) ወይም የውይይቱን ይዘት (“የለንም ብላችሁ”) ሊያመለክት ይችላል።
  - marker: b
    text: ግሪኩ በቃል በቃል “ልባችሁን ደንድኖ ይዛችኋልን?” የሚል አወቃቀር አለው።
    reason: የἔχετε ከተሳቢና ከፍጹም ተደራጊ አካል ቅጽ ጋር ያለውን አወቃቀር ለአንባቢው ለማሳየት።
lexical_decisions:
- source_word: γνοὺς
  choice: ይህንም አውቆ
  rationale: የቀደመውን ውይይት ኢየሱስ ማወቁን ያመለክታል፤ በአማርኛ የተሳቢውን ነገር በ“ይህንም” መግለጽ ተፈጥሯዊ ነው።
- source_word: διαλογίζεσθε
  choice: ትነጋገራላችሁ
  rationale: በዐውዱ ደቀ መዛሙርቱ ስለ እንጀራ እርስ በርሳቸው ያደረጉትን ውይይት ያሳያል፤ “ታስባላችሁ” ከሚለው ይልቅ የጋራ ውይይቱን ይጠብቃል።
- source_word: ἄρτους
  choice: እንጀራ
  rationale: ቃሉ ብዙ ቁጥር ቢሆንም፣ አማርኛ “እንጀራ”ን ለምግብ እንጀራ በተፈጥሯዊ ነጠላ መልክ ይጠቀማል።
- source_word: νοεῖτε
  choice: አታስተውሉም
  rationale: የአእምሮ መገንዘብንና ማስተዋልን ይገልጣል፤ ከሚከተለው συνίετε ጋር ያለውን ልዩነት ይጠብቃል።
- source_word: συνίετε
  choice: አትረዱምም
  rationale: የነገሩን ትርጉም መረዳትን ይገልጣል፤ በግሪክ ያለውን የሁለት ተዛማጅ ግሶች አጣማጅ ይጠብቃል።
- source_word: πεπωρωμένην
  choice: ደንድኖአል
  rationale: ፍጹም ተደራጊ አካል ቅጹ የቀጠለ የጠነከረ ወይም የደነደነ ሁኔታን ያሳያል፤ “ደንድኖአል” መንፈሳዊ ድንዛዜን በተለመደው መጽሐፍ ቅዱሳዊ ምሳሌ ያቀርባል።
- source_word: καρδίαν
  choice: ልባችሁ
  rationale: በዚህ ዐውድ “ልብ” ስሜትን ብቻ ሳይሆን ውስጣዊ ማስተዋልንና ምላሽ ሰጪነትን ይወክላል፤ የምንጩን ምሳሌ እንዳለ ይጠብቃል።
theological_decisions:
- issue: የመጨረሻው ጥያቄ የልብን ሁኔታ እንዴት እንደሚገልጽ
  choice: ልባችሁ ደንድኖአልን?
  alternative: ልባችሁን ደንዳና አድርጋችሁ ይዛችኋልን?
  rationale: ግሪኩ በቃል በቃል “ልባችሁን ደንድኖ ይዛችኋልን?” የሚመስል ἔχετε + ተሳቢ + አካል ቅጽ አለው። በአማርኛ ይህን በቃል በቃል ማስቀመጥ ሰዋሰዋዊ ግርታ ስለሚፈጥር፣ የቀጠለውን የድንዛዜ ሁኔታ ሳይለውጥ በተፈጥሯዊ ጥያቄ ተተርጉሟል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። የማርቆስን ታሪካዊ የአሁን ጊዜ ግስ λέγει በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜ “አላቸው” ብሎ ያቀርባል።
