review_pass:
  verdict: revise
  source_fidelity: The narrative question and the reply of seven are accurately represented. However, ἄρτους denotes counted loaves of bread; in modern standard Amharic, ዳቦ is the clearer general equivalent, whereas እንጀራ ordinarily denotes injera and can introduce an unnecessarily specific local food reference.
  naturalness: The wording is generally clear and idiomatic. Removing the commas after the sentence subjects gives smoother modern Amharic punctuation. Keeping the answer as a direct quotation followed by አሉ is natural and does not add an explicit indirect object absent from the Greek.
  terminology: Use ዳቦ for the discrete bread loaves in this context. No theological terminology or textual ambiguity requires annotation.
  issues:
  - severity: medium
    issue: እንጀራ for ἄρτους
    rationale: Although እንጀራ has historic biblical usage, in modern standard Amharic it normally refers specifically to injera. The Greek refers to loaves of bread, and ዳቦ better preserves that generic, countable sense.
  - severity: low
    issue: Unnecessary commas after እርሱም and እነርሱም
    rationale: These commas interrupt otherwise straightforward narrative syntax and are not needed in modern Amharic punctuation.
  - severity: low
    issue: Explicit indirect object in አሉት
    rationale: The Greek says simply ‘they said’; Jesus is understood from context. አሉ preserves the source’s unexpressed object while remaining natural after the quoted answer.
  revised_text: እርሱም “ስንት ዳቦ አላችሁ?” ብሎ ጠየቃቸው። እነርሱም “ሰባት” አሉ።
