  text: እርሱም “ስንት ዳቦ አላችሁ?” ብሎ ጠየቃቸው። እነርሱም “ሰባት” አሉ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: እርሱም
  rationale: የትረካውን ቀላል ትስስር በአማርኛ ተፈጥሯዊ በሆነው -ም አያያዥ ይጠብቃል።
- source_word: ἠρώτα
  choice: ጠየቃቸው
  rationale: የግሪክ ኢምፐርፌክት እዚህ በትረካ ውስጥ አንድ ጥያቄን ያመለክታል፤ ቀላሉ ያለፈ ጊዜ በዘመናዊ አማርኛ ተፈጥሯዊ ነው።
- source_word: αὐτούς
  choice: -አቸው
  rationale: ብዙ ቁጥር ተሳቢዎቹን፣ ማለትም ደቀ መዛሙርቱን፣ በግስ ላይ በተጣበቀ ተውላጠ ስም ያሳያል።
- source_word: Πόσους
  choice: ስንት
  rationale: የብዛት ጥያቄውን በቀጥታና በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἔχετε
  choice: አላችሁ
  rationale: ሁለተኛ መደብ ብዙ ቁጥር ያለውን የአሁን ጊዜ ይዞታ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἄρτους
  choice: እንጀራ
  rationale: ἄρτος በአጠቃላይ ዳቦን ወይም አንድን የዳቦ ክፍል ያመለክታል፤ በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም ‘እንጀራ’ ለምግብ/ዳቦ የተለመደ ሲሆን ‘ስንት’ የሚለው የሚቆጠሩ ክፍሎች መሆናቸውን ያሳያል።
- source_word: οἱ δὲ εἶπαν
  choice: እነርሱም … አሉት
  rationale: δέ የምላሹን ሽግግር በ-ም ያሳያል፤ εἶπαν ደግሞ ‘መለሱ’ ብሎ ትርጉሙን ከማብራራት ይልቅ ቀጥተኛውን ‘አሉ’ ይጠብቃል።
- source_word: Ἑπτά
  choice: ሰባት
  rationale: የቁጥሩን ቀጥተኛ ምላሽ ያስተላልፋል።
