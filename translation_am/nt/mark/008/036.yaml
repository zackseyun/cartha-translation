  text: For what does it profit a man to gain the whole world and forfeit his life?[a][b]
translation:
  language: am
  text: 'ምክንያቱም፣ አንድ ሰው[b] ዓለምን ሁሉ ቢያተርፍና ሕይወቱን[a] ቢያጎድል፣ ምን ይጠቅመዋል?


    [a] ወይም፣ “ነፍሱን”። የግሪኩ ψυχή (ፕሲኬ) እንደ አውዱ “ሕይወት፣” “ነፍስ፣” ወይም “ማንነት” ማለት ይችላል።


    [b] እዚህ “አንድ ሰው” የሚለው ማንኛውንም ሰው ያመለክታል።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ነፍሱን”። የግሪኩ ψυχή (ፕሲኬ) እንደ አውዱ “ሕይወት፣” “ነፍስ፣” ወይም “ማንነት” ማለት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: እዚህ “አንድ ሰው” የሚለው ማንኛውንም ሰው ያመለክታል።
    reason: cultural_note
