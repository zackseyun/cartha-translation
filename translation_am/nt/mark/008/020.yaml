reference: Mark 8:20
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὅτε ⸀καὶ τοὺς ἑπτὰ εἰς τοὺς τετρακισχιλίους, πόσων σπυρίδων πληρώματα κλασμάτων ἤρατε; ⸂καὶ λέγουσιν αὐτῷ⸃· Ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/020.yaml
  text: And when the seven were for the four thousand[a], how many large baskets full of broken pieces did you pick up? They said to him, “Seven.”
translation:
  language: am
  text: “ሰባቱንም ለአራቱ ሺህ በቆራረስሁ ጊዜ፣ በተቆራረሱ ቁርስራሾች የተሞሉ ስንት ትልልቅ ቅርጫቶችን አነሣችሁ?” ብሎ ጠየቃቸው። እነርሱም፣ “ሰባት” አሉት።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτε καὶ
  choice: ሰባቱንም ... ጊዜ
  rationale: የግሪኩን ጊዜ አመልካች አወቃቀር በተፈጥሯዊ አማርኛ ያቀርባል፤ -ም ደግሞ ይህን ከቀደመው የአምስቱ እንጀራ ክስተት ጋር ያያይዛል።
- source_word: τοὺς ἑπτὰ
  choice: ሰባቱን
  rationale: በዐውዱ የተጠቀሱትን ሰባት እንጀራዎች የሚመለከተውን የግሪኩን አጭር አገላለጽ ይጠብቃል፤ ‘እንጀራ’ በዚህ ቁጥር ውስጥ በግልጽ አልተጻፈም።
- source_word: εἰς τοὺς τετρακισχιλίους
  choice: ለአራቱ ሺህ
  rationale: እንጀራዎቹ ለተመገቡት አራት ሺህ ሰዎች መሆናቸውን አጭርና ተፈጥሯዊ በሆነ አማርኛ ይገልጣል።
- source_word: πόσων σπυρίδων
  choice: ስንት ትልቅ ቅርጫት
  rationale: σπυρίς በቁጥር 19 ከተጠቀሰው κόφινος የተለየ ትልቅ ቅርጫት ነው፤ ‘ትልቅ’ የቃላቱን ልዩነት ያስጠብቃል።
- source_word: πληρώματα κλασμάτων
  choice: የተረፈውን ቁርስራሽ ... ሙሉ
  rationale: ቅርጫቶቹ በተሰባበረና በተረፈ እንጀራ መሙላታቸውን በግልጽ ያሳያል።
- source_word: ἤρατε
  choice: አነሣችሁ
  rationale: በዐውዱ የተረፈውን ቁርስራሽ ሰብስቦ ማንሣትን የሚያመለክት ተፈጥሯዊ አገላለጽ ነው።
- source_word: καὶ λέγουσιν αὐτῷ
  choice: እነርሱም ... አሉት
  rationale: የግሪኩን ትረካዊ የአሁን ጊዜ በተፈጥሯዊ የአማርኛ ያለፈ ጊዜ ያቀርባል።
- source_word: Ἑπτά
  choice: ሰባት
  rationale: ለጥያቄው የተሰጠውን ቀጥተኛ ቁጥራዊ መልስ ይጠብቃል።
