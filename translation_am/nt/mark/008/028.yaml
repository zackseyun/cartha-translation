  text: They told him[a], saying, “John the Baptist; and others, Elijah; but others, one of the prophets.”
translation:
  language: am
  text: እነርሱም፣ አንዳንዶች መጥምቁ ዮሐንስ ነው፣ ሌሎች ኤልያስ ነው፣ ሌሎች ደግሞ ከነቢያት አንዱ ነው እንደሚሉ ነገሩት።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ ይበልጥ በቃል ተቀራራቢ ሁኔታ፦ «እነርሱም፣ ‘መጥምቁ ዮሐንስ፤ ሌሎች ኤልያስ፤ ሌሎች ደግሞ ከነቢያት አንዱ’ ብለው ነገሩት።» በግሪኩ የንግግር ፎርሙላው በኋለኞቹ አንቀጾች አይደገምም፤ «አንተ ... ነህ» የሚለውም ተረድቶ የሚገባ ነው።
