id: MRK.8.27
reference: Mark 8:27
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθεν ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὰς κώμας Καισαρείας τῆς Φιλίππου· καὶ ἐν τῇ ὁδῷ ἐπηρώτα τοὺς μαθητὰς αὐτοῦ λέγων αὐτοῖς· Τίνα με λέγουσιν οἱ ἄνθρωποι εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/027.yaml
  text: And Jesus went out[a], with his disciples, to the villages of Caesarea Philippi. And on the way he was asking his disciples, saying to them, “Who do people say that I am?”
translation:
  language: am
  text: ኢየሱስም ከደቀ መዛሙርቱ ጋር ወደ ቂሳርያ ፊልጶስ መንደሮች ወጣ። በመንገድም ላይ ደቀ መዛሙርቱን፣ “ሰዎች እኔን ማን እንደሆንሁ ይላሉ?” ብሎ ይጠይቃቸው ነበር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: ወጣ
  rationale: የግሱን የመውጣትና የመጓዝ ሐሳብ በቀጥታ ይጠብቃል፤ ከ«ወደ …» ጋርም በአማርኛ ተፈጥሯዊ ነው።
- source_word: κώμας
  choice: መንደሮች
  rationale: κώμη በተለምዶ ከትልቅ ከተማ ያነሰ የገጠር ሰፈርን ስለሚያመለክት «መንደሮች» ተመርጧል።
- source_word: Καισαρείας τῆς Φιλίππου
  choice: ቂሳርያ ፊልጶስ
  rationale: የቦታው ስም በአማርኛ የመጽሐፍ ቅዱስ አጠራር ልማድ መሠረት በድምፅ ተጽፏል።
- source_word: ἐν τῇ ὁδῷ
  choice: በመንገድም ላይ
  rationale: የትረካውን የጉዞ አውድ የሚጠብቅ ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
- source_word: ἐπηρώτα
  choice: ይጠይቃቸው ነበር
  rationale: የግሪኩ ያልተፈጸመ የኃላፊ ጊዜ አንቀጽ የሚያሳየውን ቀጣይ ወይም በሂደት ላይ የነበረ ጥያቄ ይገልጣል።
- source_word: λέγων αὐτοῖς
  choice: ብሎ
  rationale: ከቀጥተኛው ንግግር ጋር «ብሎ» ማለት የግሪኩን ተሳቢ አንቀጽ በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: Τίνα με λέγουσιν οἱ ἄνθρωποι εἶναι;
  choice: ሰዎች እኔን ማን እንደሆንሁ ይላሉ?
  rationale: ጥያቄው ስለ ኢየሱስ ማንነት ነው፤ «ሰዎች» የሚለውም ἄνθρωποι በዚህ አውድ ሁሉን አቀፍ መሆኑን ያለ ወንዶች ብቻ ገደብ በትክክል ያሳያል።
- source_word: οἱ μαθηταὶ αὐτοῦ / τοὺς μαθητὰς αὐτοῦ
  choice: ደቀ መዛሙርቱ / ደቀ መዛሙርቱን
  rationale: የαὐτοῦን ባለቤትነት የአማርኛው «-ቱ» ያሳያል፤ «ደቀ መዛሙርት» ደግሞ ለμαθηταί የተለመደና አሁንም የሚገባ ቃል ነው።
theological_decisions:
- issue: በኢየሱስ ጥያቄ ውስጥ ያለው ሁሉን አቀፍ ἄνθρωποι
  choice: ሰዎች
  alternative: ወንዶች
  rationale: ἄνθρωποι በሰዋሰው ወንድ ጾታ ቢሆንም በዚህ አውድ የሕዝቡን አጠቃላይ አመለካከት ይጠቅሳል፤ «ሰዎች» የምንጩን ሐሳብ ያለ ወንድ ጾታ ገደብ ያስተላልፋል።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ ነው። የማርቆስን የጉዞ ትረካ «በመንገድ ላይ» በሚለው ጠብቋል፤ የግሪኩን የግስ አስፔክትም «ይጠይቃቸው ነበር» በሚለው አንጸባርቋል። በዒላማው ጽሑፍ ማብራሪያ የሚያስፈልገው አሻሚ ቃል ስላልነበረ የግርጌ ማስታወሻ አልተጨመረም።
