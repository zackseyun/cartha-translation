id: MRK.8.19
reference: Mark 8:19
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὅτε τοὺς πέντε ἄρτους ἔκλασα εἰς τοὺς πεντακισχιλίους, πόσους κοφίνους ⸂κλασμάτων πλήρεις⸃ ἤρατε; λέγουσιν αὐτῷ· Δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/019.yaml
  text: When I broke the five loaves for the five thousand[a], how many baskets full of broken pieces did you pick up?” They said to him[c][b], “Twelve.”
translation:
  language: am
  text: “አምስቱን እንጀራዎች ለአምስቱ ሺህ በቆረስሁ ጊዜ፣ በቁራጮች[a] የተሞሉ ስንት ቅርጫቶችን አነሳችሁ?” እነርሱም፣ “አሥራ ሁለት” አሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ቁርስራሾች።” የግሪኩ ቃል ከተቆረሱት እንጀራዎች የተገኙ ቁራጮችን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε
  choice: በ… ጊዜ
  rationale: የመመገቡን ተአምር መልሶ የሚያመለክተውን ጊዜያዊ ንዑስ ሐረግ በተፈጥሯዊ አማርኛ ያስተዋውቃል።
- source_word: ἔκλασα
  choice: በቆረስሁ
  rationale: κλάω እንጀራን መቁረስን ያመለክታል፤ ‘ቆረስሁ’ በአማርኛ ለእንጀራ የተለመደና ግልጽ አገላለጽ ነው።
- source_word: ἄρτους
  choice: እንጀራዎች
  rationale: በዚህ የቁጥር አውድ ἄρτοι ሊቆጠሩ የሚችሉ የእንጀራ ሙሉ ቁራጮችን ያመለክታል።
- source_word: εἰς τοὺς πεντακισχιλίους
  choice: ለአምስቱ ሺህ
  rationale: εἰς እዚህ ምግቡ ለተሰጣቸው ሕዝብ ያለውን አቅጣጫ ወይም ዓላማ ያሳያል፤ ግሪኩ በዚህ ቁጥር ‘ወንዶች’ የሚል ስም ስለማያክል ትርጉሙም አይጨምረውም።
- source_word: κοφίνους
  choice: ቅርጫቶችን
  rationale: κόφινος የሚሸከም ቅርጫትን ያመለክታል፤ ‘ቅርጫት’ ለዘመናዊ አንባቢ ግልጽና የተለመደ ነው።
- source_word: κλασμάτων
  choice: በተቆራረሱ ቁርስራሾች
  rationale: ከተቆረሰው እንጀራ የቀሩትን ቁራጮች ያመለክታል፤ አገላለጹ ከቀደመው ‘በቆረስሁ’ ጋር ያለውን የቃል ግንኙነት ይጠብቃል።
- source_word: πλήρεις
  choice: የተሞሉ
  rationale: ቅርጫቶቹ በቁርስራሾቹ ሙሉ መሆናቸውን በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἤρατε
  choice: አነሳችሁ
  rationale: αἴρω በዚህ አውድ የተረፉትን ሰብስቦ ማንሳትን ያመለክታል፤ ‘አነሳችሁ’ የግሪኩን መሠረታዊ ስፋት ሳያጠብ ድርጊቱን ያስተላልፋል።
- source_word: λέγουσιν αὐτῷ
  choice: እነርሱም … አሉት
  rationale: የታሪክ ጊዜ ያለውን የግሪክ አሁን ጊዜ በአማርኛ ትረካ የተፈጥሮ ባለፈ ጊዜ ይገልጻል።
- source_word: Δώδεκα
  choice: አሥራ ሁለት
  rationale: ቀጥተኛውን የቁጥር መልስ ያለ አላስፈላጊ ማብራሪያ ያቀርባል።
theological_decisions:
- issue: የπεντακισχιλίους ወካይ አጠቃቀም
  choice: ለአምስቱ ሺህ
  alternative: ለአምስት ሺህ ወንዶች
  rationale: πεντακισχιλίους በሰዋስው የወንድ ፆታ ቅርጽ ቢኖረውም፣ ጥቅሱ ራሱ ἄνδρες (‘ወንዶች’) የሚል ስም አይጨምርም። የቡድኑን የተለመደ መጠሪያ በአሻሚነቱ ለማቆየት ‘ወንዶች’ በዋናው ጽሑፍ አልተጨመረም።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ጥያቄና አጭር መልስ ቀጥተኛነት ተጠብቋል፤ በምንጩ የሌለ ‘ወንዶች’ የሚል ማብራሪያ አልተጨመረም።
