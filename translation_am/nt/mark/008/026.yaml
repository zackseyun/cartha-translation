  text: καὶ ἀπέστειλεν αὐτὸν ⸀εἰς οἶκον αὐτοῦ λέγων· Μηδὲ εἰς τὴν κώμην ⸀εἰσέλθῃς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/026.yaml
  text: And he sent him to his home[a], saying, “Do not even enter the village.”
translation:
  language: am
  text: ኢየሱስም ሰውየውን ወደ ቤቱ ላከው[a]፤ “ወደ መንደሩ እንኳ አትግባ” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች፣ “በመንደሩም ውስጥ ለማንም አትንገር” የሚል ይጨምራሉ።
    reason: textual_variant
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: ላከው
  rationale: በዚህ ዐውድ ግሱ ኢየሱስ ሰውየውን ወደ ቤቱ እንዲሄድ መላኩን ያመለክታል፤ «ላከው» ተፈጥሯዊና ቀጥተኛ ነው።
- source_word: εἰς οἶκον αὐτοῦ
  choice: ወደ ቤቱ
  rationale: የመድረሻውን አቅጣጫና የራሱ መኖሪያ መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: λέγων
  choice: «…» አለው
  rationale: የግሪክኛውን ተያያዥ ንግግር በተፈጥሯዊ የአማርኛ ትረካ አቀራረብ ያስተላልፋል።
- source_word: Μηδὲ
  choice: እንኳ አትግባ
  rationale: μηδέ ያለውን አጽንዖታዊ ክልከላ «እንኳ» በማለት ይገልጣል፤ ቀላል ማስተባበር ብቻ አያደርገውም።
- source_word: κώμην
  choice: መንደሩ
  rationale: κώμη በተለምዶ ከተማ ያልሆነ አነስተኛ ሰፈራን ያመለክታል፤ «መንደር» ቀጥተኛና ዘመናዊ አቻ ነው።
- source_word: εἰσέλθῃς
  choice: አትግባ
  rationale: ከμηδέ ጋር ያለውን የክልከላ ንዑስ አንቀጽ በተፈጥሯዊ የአማርኛ ከልካይ ትእዛዝ ይገልጣል።
theological_decisions:
- issue: ኢየሱስ ስለ መንደሩ የሰጠው ክልከላ ወሰን
  choice: ወደ መንደሩ እንዳይገባ የተሰጠውን ቀጥተኛ ክልከላ ብቻ በዋናው ጽሑፍ ማቅረብ
  alternative: በአንዳንድ የእጅ ጽሑፎች ያለውን፣ በመንደሩ ውስጥ ለማንም እንዳይናገር የሚለውን ተጨማሪ ክልከላ ማካተት
  rationale: SBLGNT በዋናው ጽሑፍ ወደ መንደሩ እንዳይገባ የሚለውን ብቻ ይዟል። ስለዚህ ረዘም ያለው የጽሑፍ ልዩነት ወደ ዋናው ጽሑፍ አልገባም፤ በግርጌ ማስታወሻ ቀርቧል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው የትረካ አማርኛ ተጠቅሟል። «ሰውየውን» የሚለው ተውላጠ ስሙ የሚያመለክተውን ሰው ለአማርኛ አንባቢ ግልጽ ያደርጋል፤ «እንኳ» ደግሞ የክልከላውን አጽንዖት ይጠብቃል።
