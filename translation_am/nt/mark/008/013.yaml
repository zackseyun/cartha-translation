  text: And leaving them[a], he got back into the boat and went to the other side.
translation:
  language: am
  text: እነርሱንም ትቶ፣ እንደገና[a] በጀልባ ተሳፍሮ ወደ ማዶ ሄደ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «መልሶ»። የግሪኩ πάλιν «እንደገና» ወይም «መልሶ» ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφεὶς
  choice: ትቶ
  rationale: የግስ ቦዝ አንቀጹ ኢየሱስ ከእነርሱ ተለይቶ መሄዱን ያሳያል፤ «ትቶ» በአማርኛ ተፈጥሯዊና ግልጽ ነው።
- source_word: αὐτοὺς
  choice: እነርሱን
  rationale: በቀደመው አውድ የተጠቀሱትን ፈሪሳውያን የሚያመለክት ቀጥተኛ ተውላጠ ስም ነው።
- source_word: πάλιν
  choice: እንደገና
  rationale: ቃሉ በቀጥታ «እንደገና/ደግሞ» ማለት ሲሆን፣ ድጋሚ በጀልባው መግባቱን ይገልጣል።
- source_word: ἐμβὰς
  choice: በጀልባው ገብቶ
  rationale: ቦዝ አንቀጹ «ገብቶ» ማለት ነው፤ የተገባበት ጀልባ ከትረካው አውድ ግልጽ ስለሆነ ለአማርኛ አንባቢ በግልጽ ተጠቅሷል።
- source_word: ἀπῆλθεν
  choice: ሄደ
  rationale: ዋናውን የመነሳትና የመሄድ ድርጊት በቀላልና ተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: εἰς τὸ πέραν
  choice: ወደ ማዶ
  rationale: በማርቆስ የጉዞ ትረካ ውስጥ የባሕሩን ወይም የሐይቁን ሌላኛውን ወገን የሚያመለክት ተፈጥሯዊ የአማርኛ አገላለጽ ነው።
