  text: Καὶ ⸀ἔρχονται εἰς Βηθσαϊδάν. καὶ φέρουσιν αὐτῷ τυφλὸν καὶ παρακαλοῦσιν αὐτὸν ἵνα αὐτοῦ ἅψηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/022.yaml
  text: And they came to Bethsaida. And they brought a blind man to him and begged him to touch him.
translation:
  language: am
  text: እነርሱም ወደ ቤተ ሳይዳ መጡ። አንድ ዓይነ ስውር ሰው ወደ እርሱ አመጡና እንዲዳስሰው ለመኑት።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχονται
  choice: መጡ
  rationale: በግሪክ የታሪክ አሁን ጊዜ ቢሆንም፣ በተፈጥሯዊ የአማርኛ ትረካ ያለፈ ጊዜ በመጠቀም የክስተቱን ቅደም ተከተል ይጠብቃል።
- source_word: εἰς Βηθσαϊδάν
  choice: ወደ ቤተ ሳይዳ
  rationale: εἰς ወደ አንድ ስፍራ የሚደረግን እንቅስቃሴ ያመለክታል፤ የስፍራው ስም በተለመደው የአማርኛ አጻጻፍ ቀርቧል።
- source_word: φέρουσιν
  choice: አመጡ
  rationale: የግሪኩ የታሪክ አሁን ጊዜ በአማርኛ ትረካ በያለፈ ጊዜ ተተርጉሟል፤ አመጡ የአመጣጡን ሁኔታ እንደ ተሸከሙት ብሎ ሳይወስን ሰፊውን ትርጉም ይጠብቃል።
- source_word: τυφλὸν
  choice: አንድ ዓይነ ስውር
  rationale: መጠሪያ ሆኖ የተጠቀሰው የወንድ ነጠላ ቅጽ በዐውዱ አንድ ዓይነ ስውር ሰውን ያመለክታል፤ ዓይነ ስውር ተፈጥሯዊና ክብር ያለው የአማርኛ አገላለጽ ነው።
- source_word: παρακαλοῦσιν
  choice: ለመኑት
  rationale: እዚህ παρακαλέω ተራ ጥያቄን ሳይሆን አጥብቆ መለመንን ያሳያል፤ ለመኑት ይህን ጥንካሬ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἵνα αὐτοῦ ἅψηται
  choice: እንዲዳስሰው
  rationale: ἵνα ከንዑስ አንቀጹ ጋር የልመናውን ይዘት ያሳያል፤ እንዲዳስሰው በአማርኛ ይህን ተፈጥሯዊ አድርጎ ያቀርባል። መዳሰስ በፈውስ ዐውድ ውስጥ የእጅ ንክኪን በግልጽ ያሳያል።
- source_word: καὶ
  choice: -ም / እና
  rationale: የማርቆስን ተያያዥ የትረካ ስልት ለማቆየት ሁለቱም καί በአማርኛ ተወክለዋል፤ የአማርኛው -ም እና የማያያዣ ቅጽ የግሪኩን አጭር ተከታታይነት በተፈጥሯዊ መንገድ ይጠብቃሉ።
- source_word: αὐτῷ / αὐτόν
  choice: ወደ እርሱ / ለመኑት
  rationale: ተውላጠ ስሞቹ በቅርቡ ወደተጠቀሰው ኢየሱስ ያመለክታሉ፤ ስሙን በጽሑፉ ላይ ሳይጨምር የምንጩን ተውላጠ ስም ቅርጽ ተጠብቋል።
