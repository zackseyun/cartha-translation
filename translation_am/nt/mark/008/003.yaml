base_translation:
  language: en
  yaml_path: translation/nt/mark/008/003.yaml
  text: And if I send them away hungry to their homes[a], they will collapse on the way, and some of them have come from far away.
translation:
  language: am
  text: ተርበው ወደ ቤታቸው ብሰዳቸው፣ በመንገድ ላይ ይዝላሉ[a]፤ ከእነርሱም አንዳንዶቹ ከሩቅ መጥተዋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በመንገድ ላይ ይወድቃሉ።» የግሪኩ ግስ አንድ ሰው እስከመውደቅ ድረስ መድከሙን ወይም ኃይሉ ማለቁን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύσω
  choice: ብሰዳቸው
  rationale: በዚህ የሕዝቡን መመገብ ዐውድ ግሱ ሕዝቡን እንዲሄድ መስደድን ያመለክታል፤ «ብሰዳቸው» ተፈጥሯዊና ግልጽ ነው።
- source_word: νήστεις
  choice: ተርበው
  rationale: ቃሉ በቀጥታ ሳይበሉ መቆየትን ሊያመለክት ቢችልም፣ እዚህ ሆን ብሎ የሚደረግ ሃይማኖታዊ ጾምን ሳይሆን ያለ ምግብ በመቆየታቸው መራባቸውን ይገልጣል።
- source_word: εἰς οἶκον αὐτῶν
  choice: ወደየቤታቸው
  rationale: የግሪኩን አከፋፋይ ትርጉም፣ ማለትም እያንዳንዳቸው ወደራሳቸው ቤት፣ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐκλυθήσονται
  choice: ይዝላሉ
  rationale: ግሱ በድካም ኃይል ማጣትንና ለመውደቅ መቃረብን ሊገልጥ ይችላል፤ «ይዝላሉ» ይህን በዐውዱ ተፈጥሯዊ በሆነ መንገድ ይገልጣል።
- source_word: ἐν τῇ ὁδῷ
  choice: በመንገድ ላይ
  rationale: በጉዞ መካከል የሚሆነውን በመደበኛና ግልጽ አማርኛ ያሳያል።
- source_word: καί τινες αὐτῶν
  choice: ከእነርሱም አንዳንዶቹ
  rationale: ከሕዝቡ ከፊሎቹን የሚለየውን ትርጉምና καί የሚያሳየውን ቅንጅት ይጠብቃል።
- source_word: ἀπὸ μακρόθεν
  choice: ከሩቅ
  rationale: ሰዎቹ የመጡበትን ረጅም ርቀት አጭርና ተፈጥሯዊ በሆነ አማርኛ ይገልጣል።
- source_word: ἥκασιν
  choice: መጥተዋል
  rationale: የፍጹም ጊዜውን ውጤታዊ ገጽታ፣ ማለትም ከሩቅ መጥተው አሁን በዚያ መኖራቸውን፣ ይጠብቃል።
