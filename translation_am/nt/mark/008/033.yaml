source:
  edition: SBLGNT
  text: ὁ δὲ ἐπιστραφεὶς καὶ ἰδὼν τοὺς μαθητὰς αὐτοῦ ἐπετίμησεν ⸀Πέτρῳ ⸂καὶ λέγει⸃· Ὕπαγε ὀπίσω μου, Σατανᾶ, ὅτι οὐ φρονεῖς τὰ τοῦ θεοῦ ἀλλὰ τὰ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/033.yaml
  text: But turning around and seeing his disciples[a], he rebuked Peter and said, “Get behind me, Satan, because you are not setting your mind on the things of God, but on the things of men.”
translation:
  language: am
  text: እርሱ ግን ዘወር ብሎ ደቀ መዛሙርቱን አየና ጴጥሮስን ገሥጾ፣ “ከኋላዬ ሂድ፣ ሰይጣን! አሳብህ የእግዚአብሔርን ነገር ሳይሆን የሰዎችን ነገር[a] ነውና” አለው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የሰዎችን ነገር” የሚለው “ሰብአዊ ነገር” ወይም “የሰው ልጆች ጉዳይ” ተብሎም ሊተረጎም ይችላል፤ የግሪኩ ቃል ሰዎችን በአጠቃላይ ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστραφεὶς
  choice: ዘወር ብሎ
  rationale: ኢየሱስ ጴጥሮስን ከመገሠጹ በፊት በአካል ወደ ደቀ መዛሙርቱ መዞሩን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἰδὼν
  choice: አየና
  rationale: ከመዞሩ ቀጥሎ ደቀ መዛሙርቱን ማየቱንና የድርጊቶቹን ቅደም ተከተል ይጠብቃል።
- source_word: μαθητὰς
  choice: ደቀ መዛሙርቱን
  rationale: በወንጌላት ውስጥ μαθητής የሚያመለክተውን የኢየሱስ ተማሪዎችና ተከታዮች የሚለውን መደበኛ ትርጉም ይይዛል።
- source_word: ἐπετίμησεν
  choice: ገሥጾ
  rationale: ቃሉ በዚህ አውድ ያለውን ከባድና ቀጥተኛ የቃል ወቀሳ ያሳያል።
- source_word: καὶ λέγει
  choice: አለው
  rationale: የግሪኩ ታሪካዊ የአሁን ጊዜ ግስ በተፈጥሯዊ የአማርኛ ትረካ በኃላፊ ጊዜ ተተርጉሟል።
- source_word: Ὕπαγε ὀπίσω μου
  choice: ከኋላዬ ሂድ
  rationale: ቀጥተኛውን የቦታ ምስልና የትእዛዙን ጥንካሬ ይጠብቃል፤ ጴጥሮስ ከኢየሱስ ፊት ሳይቆም ከኋላው እንዲሆን የሚለውንም ክፍት አድርጎ ይተዋል።
- source_word: Σατανᾶ
  choice: ሰይጣን
  rationale: በቀጥተኛ ጥሪ የተጠቀሰውን የተለመደ የስም/የማዕረግ ቅርጽ ይጠብቃል።
- source_word: φρονεῖς
  choice: የምታስበው
  rationale: በዚህ አውድ የአእምሮ አቋምን፣ ዝንባሌንና ጉዳይን በልብ መያዝን በቀላል ዘመናዊ አማርኛ ይገልጻል።
- source_word: τὰ τοῦ θεοῦ
  choice: የእግዚአብሔርን ነገር
  rationale: ሰፊውንና ሆን ተብሎ ያልተወሰነውን አገላለጽ ይጠብቃል፤ ‘ፈቃድ’ ወይም ‘ፍላጎት’ ብሎ አይገድበውም።
- source_word: τὰ τῶν ἀνθρώπων
  choice: የሰውን ነገር
  rationale: ከእግዚአብሔር ነገር ጋር የተቃረነውን አጠቃላይ ሰብአዊ አስተሳሰብና ጉዳይ በተፈጥሯዊ አማርኛ ያሳያል፤ ጾታዊ ወንዶችን ብቻ አያመለክትም።
theological_decisions:
- issue: ኢየሱስ ጴጥሮስን ‘ሰይጣን’ ብሎ የጠራበት አመልካች
  choice: ተግሣጹና ቀጥተኛው ንግግር ወደ ጴጥሮስ እንደተነገረ ተጠብቋል፤ ‘ሰይጣን’ የሚለውም ሳይለዘብ ቀርቧል።
  alternative: ኢየሱስ ከጴጥሮስ በስተኋላ ያለውን ሰይጣን እያነጋገረ ነው፤ ወይም ‘ሰይጣን’ ማለት በግል ያልተወሰነ ‘ባላጋራ’ ብቻ ነው።
  rationale: ἐπετίμησεν Πέτρῳ ጴጥሮስን የተግሣጹ ቀጥተኛ ተቀባይ ያደርገዋል። ትርጉሙ የንግግሩን ጥንካሬ ይጠብቃል፤ ጴጥሮስ ቃል በቃል ሰይጣን ነው የሚል ተጨማሪ ሥነ መለኮታዊ መደምደሚያ ግን አይጨምርም።
- issue: τὰ τῶν ἀνθρώπων የሚያመለክተው ወሰን
  choice: ለሰው ልጆች በአጠቃላይ የሚገባ ‘የሰውን ነገር’ ተብሏል።
  alternative: የወንዶችን ነገር፤ የሰዎችን ጉዳይ፤ ሰብአዊ ነገር።
  rationale: ἄνθρωποι እዚህ ወንዶችን ብቻ ሳይሆን ሰውን በአጠቃላይ ያመለክታል። ነጠላው የአማርኛ አገላለጽ ‘የሰው’ ይህን ውክልናዊ አጠቃላይነት በተፈጥሯዊ ሁኔታ ይይዛል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ባህላዊ የመጽሐፍ ቅዱስ ቃላት ‘ደቀ መዛሙርት’፣ ‘ገሠጸ’ እና ‘ሰይጣን’ ለትክክለኛነትና ለመታወቅ ተጠብቀዋል፤ የግሪኩ አሻሚነት በ‘ነገር’ ተጠብቋል።
