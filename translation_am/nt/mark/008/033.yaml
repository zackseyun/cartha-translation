review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the sequence of turning, seeing the disciples, rebuking Peter, and addressing him sharply as “ሰይጣን.” However, “አንተ የምታስበው ... ነውና” reduces φρονεῖς to a momentary thought and is syntactically less natural for the intended enduring orientation or mindset.
  naturalness: The narrative is generally clear and modern. Revising the final clause to use “አሳብህ” gives a more idiomatic Amharic expression while retaining the broad, deliberately unspecified “things/matters” sense of the Greek.
  terminology: “ደቀ መዛሙርቱን,” “ገሥጾ,” and “ሰይጣን” are appropriate. “የእግዚአብሔር ነገር / የሰዎች ነገር” appropriately conveys the two plural articular expressions without imposing an interpretation.
  issues:
  - severity: medium
    issue: The rendering of φρονεῖς as “የምታስበው” is too narrowly cognitive and the resulting clause is less idiomatic.
    rationale: φρονεῖς denotes one’s disposition, orientation, or concern. “አሳብህ ... ነው” naturally expresses this continuing mindset and preserves the contrast without adding a doctrinal explanation.
  - severity: low
    issue: “የሰውን ነገር” may be read as an individual person’s matter rather than the generic-human contrast marked by τῶν ἀνθρώπων.
    rationale: “የሰዎችን ነገር” is clear modern Amharic for human matters generally and aligns more transparently with the Greek plural.
