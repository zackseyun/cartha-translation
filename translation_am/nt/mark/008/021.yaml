  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· ⸀Οὔπω συνίετε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/021.yaml
  text: And he was saying to them[a], “Do you not yet understand?”
translation:
  language: am
  text: እንዲህም ይላቸው ነበር፤ “እስካሁን አልተረዳችሁምን?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: ም
  rationale: ቀላሉን የትረካ ቅንጅት በአማርኛ ተፈጥሯዊ በሆነው ተያያዥ ቅጥያ ያሳያል፤ በግሪኩ የሌለ ጠንካራ የጊዜ ትርጉም አይጨምርም።
- source_word: ἔλεγεν
  choice: እንዲህ ይላቸው ነበር
  rationale: ያልተጠናቀቀውን የግሪክ ግስ ገጽታ ይጠብቃል፤ “እንዲህ” የሚከተለውን ቀጥተኛ ንግግር በተፈጥሮ ያስተዋውቃል።
- source_word: αὐτοῖς
  choice: ላቸው
  rationale: ተውላጠ ስሙን በግሱ ውስጥ በተዋሐደ መንገድ ይተረጉማል፤ “ደቀ መዛሙርቱ” የሚል በዚህ ቁጥር ያልተገለጸ ስም አይጨምርም።
- source_word: Οὔπω
  choice: እስካሁን አል…ም
  rationale: እስከዚያ ጊዜ ድረስ መረዳት ገና እንዳልተፈጸመ የሚያሳየውን “not yet / still not” ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: συνίετε
  choice: ተረዳችሁ
  rationale: የአእምሮ ግንዛቤን በዘመናዊና በሰፊው በሚገባ አማርኛ ይገልጣል፤ ሁለተኛ መደብ ብዙ ቁጥርንም ይጠብቃል።
theological_decisions:
- issue: የኢየሱስ ጥያቄ በግሪኩ ያልተገለጸ ቀጥተኛ ድርጊት ተቀባይ ይጨምር ወይስ አይጨምር
  choice: ድርጊት ተቀባዩን ሳይጨምር “እስካሁን አልተረዳችሁምን?” ብሎ መተርጎም
  alternative: “እስካሁን ይህን አልተረዳችሁምን?”
  rationale: ግሪኩ የመረዳቱን ነገር በግልጽ አይጠቅስም። ክፍት የሆነውን ጥያቄ መጠበቅ ተግሣጹን ሳያጠብ እና በጽሑፉ የሌለ ትርጓሜ ሳይጨምር ያስተላልፋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። “ይላቸው ነበር” የግሪኩን ያልተጠናቀቀ ገጽታ ይጠብቃል፤ “አልተረዳችሁምን?” ደግሞ መደበኛና ክብር ያለው የጥያቄ ቅርጽ ነው። የቀረበው የእንግሊዝኛ የግርጌ ማስታወሻ ከዋናው ንባብ የተለየ አማራጭ ስለማያቀርብ፣ በአማርኛው ረቂቅ አልተደገመም።
