  yaml_path: translation/nt/mark/008/015.yaml
  text: And he kept instructing them[a], saying, “Watch out[b]; beware of the leaven of the Pharisees and the leaven of Herod.”
translation:
  language: am
  text: እርሱም፣ “ንቁ፤ ከፈሪሳውያን እርሾና ከሄሮድስ እርሾ ተጠበቁ[a]” እያለ ደጋግሞ ያስጠነቅቃቸው ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “እርሾ” በዚህ ስፍራ ሰርጎ የሚገባ ተጽእኖን የሚያመለክት ምሳሌ ነው፤ ነገር ግን ይህ ቁጥር የተጽእኖውን ትክክለኛ ገጽታ አይገልጽም። ማቴ 16፥6፣ 12 እና ሉቃ 12፥1ን ይመልከቱ።
    reason: cross_reference
lexical_decisions:
- source_word: διεστέλλετο
