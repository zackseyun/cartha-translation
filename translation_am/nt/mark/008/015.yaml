  rationale: የግሱን ያልተፈጸመ የአለፈ ጊዜ ቅርጽ እና በዚህ ዐውድ ያለውን ጠንካራ የማስጠንቀቂያ ኃይል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: λέγων
