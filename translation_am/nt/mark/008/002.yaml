source:
  edition: SBLGNT
  text: Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον ὅτι ἤδη ἡμέραι τρεῖς προσμένουσίν μοι καὶ οὐκ ἔχουσιν τί φάγωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/002.yaml
  text: I have compassion on the crowd, because they have already remained with me for three days and have nothing to eat.
translation:
  language: am
  text: “ለሕዝቡ አዝናለሁ፤ ከእኔ ጋር እየቆዩ አሁን ሦስት ቀን ሆኗቸዋል፤ የሚበሉትም የላቸውም።”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σπλαγχνίζομαι
  choice: አዝንላቸዋለሁ
  rationale: ግሱ ጥልቅ ርኅራኄንና ማዘንን ያመለክታል። “አዝንላቸዋለሁ” በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን የአሁን ጊዜውን ኃይል ይጠብቃል።
- source_word: ἐπὶ τὸν ὄχλον
  choice: ሕዝቡ … አዝንላቸዋለሁ
  rationale: ἐπί ከዚህ ግስ ጋር የርኅራኄውን ተቀባይ ያመለክታል። በአማርኛ ይህ በግሱ ውስጥ ባለው “-ላቸው” በተፈጥሮ ተገልጿል።
- source_word: ὅτι
  choice: -ና
  rationale: የኢየሱስን ማዘን ምክንያት ያስገባል፤ በአማርኛ “ቆይተዋልና” የምክንያት ግንኙነቱን ግልጽና ተፈጥሯዊ ያደርገዋል።
- source_word: ἤδη
  choice: ሙሉ
  rationale: ἤδη ጊዜው እስከ ሦስት ቀን መድረሱን ያጎላል። “ሦስት ቀን ሙሉ” በአማርኛ የቆይታውን የደረሰበት መጠን ተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: ἡμέραι τρεῖς
  choice: ሦስት ቀን
  rationale: የቆይታውን ጊዜ በቀጥታ ይገልጻል፤ ከቁጥር በኋላ ነጠላ ስም መጠቀም በአማርኛ ተፈጥሯዊ ነው።
- source_word: προσμένουσίν μοι
  choice: ከእኔ ጋር … ቆይተዋል
  rationale: προσμένω ከአንድ ሰው ጋር መቆየትን ወይም እርሱን ተከትሎ መቀጠልን ያመለክታል። ይህ አተረጓጎም ቀጣይ መገኘታቸውን ይጠብቃል።
- source_word: οὐκ ἔχουσιν τί φάγωσιν
  choice: የሚበሉትም የላቸውም
  rationale: ምግብ እንደሌላቸው የሚገልጽ ተፈጥሯዊና ግልጽ የአማርኛ አገላለጽ ነው።
