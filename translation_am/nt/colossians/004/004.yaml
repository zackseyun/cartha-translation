- source_word: λαλῆσαι
  choice: ተናግሬ
  rationale: «መናገር» ሰፊና ቀጥተኛ አቻ ነው፤ «ማወጅ» ከግሪኩ በላይ የተወሰነ የስብከት ትርጉም ሊጨምር ይችላል።
