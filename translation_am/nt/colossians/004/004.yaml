- source_word: δεῖ
  choice: እንደሚገባኝ
  rationale: የግዴታን ወይም የአስፈላጊነትን ሐሳብ ይጠብቃል፤ «ግድ እንደሆነብኝ» የሚለው ደግሞ ይበልጥ ጠንካራ አማራጭ ነው።
