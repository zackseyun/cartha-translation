  choice: ፍትሐዊ የሆነውን
  alternative: እኩልነትን
  rationale: ቃሉ ሁለቱንም የትርጉም ክልሎች ሊሸከም ይችላል። በዋናው ጽሑፍ ከδίκαιον ጋር የሚስማማው ተፈጥሯዊ «ፍትሐዊ» ተመርጧል፤ ጉልህ የሆነው «እኩልነት» ግን በማስታወሻ ተጠብቋል።
- issue: ሰብዓዊ κύριοι እና ሰማያዊ κύριος ያላቸው የቃል ግንኙነት
  choice: ለሁለቱም «ጌታ»
  alternative: ለሰብዓዊዎቹ «አሳዳሪዎች»፣ ለሰማያዊው «ጌታ»
