  text: προσευχόμενοι ἅμα καὶ περὶ ἡμῶν, ἵνα ὁ θεὸς ἀνοίξῃ ἡμῖν θύραν τοῦ λόγου, λαλῆσαι τὸ μυστήριον τοῦ Χριστοῦ, δι’ ὃ καὶ δέδεμαι,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/003.yaml
  text: while also praying for us[a], that God may open to us a door for the word, to speak the mystery of Messiah, because of which I am also bound[d][c][b],
translation:
  language: am
  text: እንዲሁም ስለ እኛ እየጸለያችሁ፣ እግዚአብሔር የመሲሑን ምሥጢር እንናገር ዘንድ ለቃሉ በር እንዲከፍትልን፤ በዚህም ምክንያት እኔም ታስሬአለሁ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσευχόμενοι
  choice: እየጸለያችሁ
  rationale: የአሁን ጊዜ አጋዥ ግስ ሆኖ በቀደመው ቁጥር የተጀመረውን ማሳሰቢያ ይቀጥላል፤ የአማርኛው አገላለጽም ይህን ተያያዥነት ይጠብቃል።
- source_word: ἅμα καὶ
  choice: በዚያውም ጊዜ … ስለ እኛም
  rationale: “በዚያው ጊዜ” የአንድ ጊዜነቱን፣ “ም” ደግሞ የመጨመሩን ኃይል በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: περὶ ἡμῶν
  choice: ስለ እኛ
  rationale: ከጸሎት ጋር ሲመጣ περί ከባለቤት አገባብ ጋር ለሌሎች መጸለይን ያመለክታል።
- source_word: ἵνα ὁ θεὸς ἀνοίξῃ
  choice: እግዚአብሔር … እንዲከፍትልን
  rationale: የጸሎቱን ይዘትና የልመናውን አቅጣጫ የሚያሳይ ተፈጥሯዊ የአማርኛ አገባብ ነው።
- source_word: ἡμῖν θύραν τοῦ λόγου
  choice: ለቃሉ በር እንዲከፍትልን
  rationale: θύρα ያለውን የበር ምስል እንዳለ ይጠብቃል፤ λόγος ደግሞ በዚህ አውድ የሚነገረውን መልእክት የሚያመለክት “ቃል” ተብሎ ተተርጉሟል።
- source_word: λαλῆσαι
  choice: እንናገር ዘንድ
  rationale: የተከፈተው በር ዓላማ መናገር መሆኑን ያሳያል፤ ከግሱ በላይ የሆነ ቴክኒካዊ የስብከት ትርጉም አይጨምርም።
- source_word: τὸ μυστήριον
  choice: ምሥጢር
  rationale: በጳውሎስ አጠቃቀም ቀድሞ ተሰውሮ አሁን የተገለጠውን መለኮታዊ ዓላማ የሚያመለክተውን የተለመደ ቃል ይጠብቃል።
- source_word: τοῦ Χριστοῦ
  choice: የመሲሑን
  rationale: Χριστός እዚህ እንደ ማዕረግ ስለሚሠራ “መሲሕ” ተብሎ ተርጉሟል፤ የድርጊት ተሳቢ ስለሆነም “የመሲሑን” የሚለውን ቅርጽ ይዟል።
- source_word: δι’ ὃ
  choice: በዚህም ምክንያት
  rationale: διά የሚያሳየውን ምክንያት ግልጽ ያደርጋል፤ “ይህ” የሚያመለክተውን ነገር በማይገባ ሁኔታ አያጠብብም።
- source_word: δέδεμαι
  choice: ታስሬአለሁ
  rationale: ፍጹም ተደራጊ ግሱ ቀድሞ የተፈጸመ መታሰር አሁንም የቀጠለ ሁኔታ መሆኑን ያሳያል።
theological_decisions:
- issue: የΧριστοῦ አተረጓጎም
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: ቃሉ በዚህ ስፍራ የቅብዓት ማዕረግን ይዞ ይሠራል፤ “መሲሕ” የሚለው ምርጫ ይህን ማዕረጋዊ ኃይል ያስቀምጣል።
- issue: የθύραν τοῦ λόγου ዘይቤ
  choice: ለቃሉ በር
  alternative: መልእክቱን ለመናገር ዕድል
  rationale: የጳውሎስን የበር ምስል ከማብራሪያ ትርጉም ይልቅ በጽሑፉ ውስጥ እንዳለ ይጠብቃል።
- issue: የδι’ ὃ አመልካች
  choice: በዚህም ምክንያት
  alternative: ስለዚህ ምሥጢር
  rationale: የግሪኩ አመልካች በቅርብ ወዳለው ምሥጢር ሊመለስ ቢችልም፣ ከተነገረው መልእክትና ከመናገሩ ተግባር ጋር ያለውን ሰፊ ግንኙነት እንዳይዘጋ “በዚህ” የሚለው ተጠብቋል።
