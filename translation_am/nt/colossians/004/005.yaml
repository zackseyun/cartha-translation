  text: Walk in wisdom toward outsiders[b][a], making the most of the time.
translation:
  language: am
  text: ከውጭ ካሉት ሰዎች[a] ጋር በጥበብ ኑሩ፤ ጊዜውን በሚገባ ተጠቀሙበት።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከውጭ ካሉት ጋር”፤ ማለትም ከአማኞች ማኅበረሰብ ውጭ ያሉትን።
    reason: lexical_alternative
  - marker: b
    text: ቃል በቃል፣ “ጊዜውን እየዋጃችሁ”፤ ሐሳቡም የተሰጠውን አጋጣሚ በሚገባ መጠቀም ነው።
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν σοφίᾳ
  choice: በጥበብ
  rationale: የመኖርን ሁኔታና መንገድ የሚገልጠውን መስተዋድዳዊ ሐረግ እና የσοφίαን ስነ ምግባራዊ ክብደት ይጠብቃል።
- source_word: περιπατεῖτε
  choice: ኑሩ
  rationale: ቃሉ በዚህ ስፍራ የአኗኗር ዘይቤን በዘይቤያዊ አገልግሎት ያመለክታል፤ ቀጥተኛው ‘ተመላለሱ’ በዘመናዊ አማርኛ የእግር ጉዞ ትርጉምን ሊያስቀድም ስለሚችል ‘ኑሩ’ ተመርጧል።
- source_word: πρὸς τοὺς ἔξω
  choice: በውጭ ያሉትን በሚመለከት
  rationale: πρός ከአኩሳቲቭ ጋር የሚገልጠውን በእነርሱ ዘንድ ስለሚደረግ አኗኗር ያለውን አቅጣጫና ግንኙነት በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ‘በውጭ ያሉት’ ደግሞ የግሪኩን አነጋገር ይጠብቃል።
- source_word: τὸν καιρόν
  choice: እያንዳንዱን አጋጣሚ
  rationale: καιρός ጊዜን በአጠቃላይ ሳይሆን ተገቢና ምቹ ወቅትን ወይም አጋጣሚን ያመለክታል፤ በዚህ አውድ ‘አጋጣሚ’ ይህን ልዩነት በግልጽ ያስተላልፋል።
- source_word: ἐξαγοραζόμενοι
  choice: በሚገባ ተጠቀሙበት
  rationale: አሳታፊው በዚህ ሐረግ ውስጥ የቀረበውን አጋጣሚ ሙሉ በሙሉ መጠቀምን ያመለክታል። ምርጫው ይህን ፈሊጣዊ ትርጉም በዘመናዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: ἐξαγοραζόμενοιን እንደ መዋጀት ቃል ከመጠን በላይ በሥነ መለኮታዊ መንገድ የመተርጎም ዕድል
  choice: ከማያምኑ ሰዎች ጋር በጥበብ ለመኖር የቀረበን እያንዳንዱን አጋጣሚ በሚገባ መጠቀም
  alternative: ‘ጊዜውን ዋጁ’ የሚል ቀጥተኛ አተረጓጎም፣ የመዳን ወይም የስርየት ትርጉም ሊያስነሳ የሚችል
  rationale: ግሱ በዚህ አውድ የንግድ ዘይቤን ተጠቅሞ አጋጣሚን ሙሉ በሙሉ መጠቀምን ይገልጣል እንጂ የማዳን ትምህርትን አይገልጥም። የቃሉ ቀጥተኛ ምስል በግርጌ ማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። ቀጥተኛውን የመራመድ ዘይቤ ከማቆየት ይልቅ ‘ኑሩ’ ተመርጦ የግሪኩ የአኗኗር ትርጉም ግልጽ ተደርጓል፤ የ‘መግዛት’ ምስል ግን በግርጌ ማስታወሻ ተጠብቋል።
