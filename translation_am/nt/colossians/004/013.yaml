  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የግሪኩን ትይዩ አወቃቀር ሳያከብድ ይጠብቃል፤ የπόνοςን ትርጉማዊ ስፋት በግርጌ ማስታወሻ ያቀርባል።
