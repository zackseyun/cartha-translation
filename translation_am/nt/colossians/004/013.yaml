lexical_decisions:
- source_word: μαρτυρῶ γὰρ αὐτῷ
  choice: ስለ እርሱ እመሰክራለሁና
  rationale: የአሁን ጊዜውን ግስና ማብራሪያ ሰጪውን γὰρ ይጠብቃል፤ ዳቲቩ αὐτῷ ከμαρτυρέω ጋር ስለ እርሱ የሚሰጥ ምስክርነትን እንደሚያመለክት ተተርጉሟል።
- source_word: ἔχει πολὺν πόνον
  choice: ብዙ ድካም አለው
  rationale: πόνος የሚያመለክተውን ከባድ ጥረትና ድካም ይጠብቃል፤ ትርጉሙን ወደ ስሜታዊ ጭንቀት ብቻ አያጠብም።
- source_word: ὑπὲρ ὑμῶν
  choice: ለእናንተ
  rationale: ὑπέρ እዚህ ለሰዎቹ ጥቅምና ስለ እነርሱ የሚደረግን ጥረት ያመለክታል፤ በአማርኛ «ለ» ተፈጥሯዊና በቂ ነው።
- source_word: τῶν ἐν Λαοδικείᾳ
  choice: በሎዶቅያ ላሉት
  rationale: በከተማዪቱ ያሉትን አማኞች በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τῶν ἐν Ἱεραπόλει
  choice: በኢያራፖሊስ ላሉት
  rationale: ከቀዳሚው ሐረግ ጋር ያለውን ትይዩነት ይጠብቃል፤ የከተማዪቱም ስም በተለመደው የአማርኛ አጻጻፍ ቀርቧል።
theological_decisions:
- issue: በኤጳፍራ አገልግሎት አውድ ውስጥ የπόνος ትርጉም
  choice: ብዙ ድካም
  alternative: ብዙ ጥረት፣ ታላቅ አሳቢነት፣ ከባድ ጭንቀት
  rationale: የቀደመው ቁጥር በጸሎት የሚደረግን ብርቱ ተጋድሎ ስለሚጠቅስ ስሜታዊ አሳቢነት በአውዱ ሊካተት ይችላል። ሆኖም πόνος በመሠረቱ ድካምና ከባድ ጥረትን ስለሚያመለክት «ብዙ ድካም» የቃሉን ስፋት ይጠብቃል።
- issue: የμαρτυρῶ αὐτῷ ግንኙነት
  choice: ስለ እርሱ እመሰክራለሁ
  alternative: ለእርሱ እመሰክራለሁ / በእርሱ ወገን እመሰክራለሁ
  rationale: ዳቲቩ ስለ ሰውየው ወይም በእርሱ ወገን የሚሰጥ ምስክርነትን ሊያመለክት ይችላል። «ስለ እርሱ» በአማርኛ ተፈጥሯዊ ሆኖ የጳውሎስን የግል ማረጋገጫ ያሳያል።
