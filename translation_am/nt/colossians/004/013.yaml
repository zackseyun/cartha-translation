  yaml_path: translation/nt/colossians/004/013.yaml
  text: For I testify for him that he has great labor for you and for those in Laodicea and those in Hierapolis[a].
translation:
  language: am
  text: ስለ እርሱ እመሰክራለሁና፤ ለእናንተ፣ በሎዶቅያም ላሉትና በሂራጶሊስም ላሉት ብዙ ድካም እንዳለበት[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ብዙ ጥረት፣» «ከፍተኛ አሳቢነት» ወይም «ከባድ ጭንቀት።» የግሪኩ አገላለጽ ከባድ ድካምን፣ በአውዱም ከፍተኛ አሳቢነትን ሊያመለክት ይችላል።
