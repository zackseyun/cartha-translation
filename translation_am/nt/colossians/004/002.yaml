review_pass:
  verdict: revise
  source_fidelity: The draft conveys prayer, vigilance, and thanksgiving, but its Amharic pronoun «በእርሱ» is masculine while it refers to «ጸሎት», and the primary imperative «ጽኑ» can be read more generally as “stand firm” rather than sustained devotion to prayer.
  naturalness: «በጸሎት ትጉ» and «በእርሷም በምስጋና ንቁ ሁኑ» are clear, modern-standard, and retain the compact exhortatory register. They also give the participial vigilance a natural accompanying-command form in Amharic.
  terminology: «ጸሎት» for προσευχή and «ምስጋና» for εὐχαριστία are appropriate. «ትጉ» better represents the ongoing, persistent force of προσκαρτερεῖτε, while «ንቁ ሁኑ» appropriately renders γρηγοροῦντες without reducing it to literal wakefulness.
  issues:
  - severity: medium
    issue: The anaphoric pronoun is rendered «በእርሱ».
    rationale: It refers to «ጸሎት», for which the appropriate Amharic anaphoric form is «በእርሷ». The masculine form creates an unnecessary grammatical and referential inconsistency.
  - severity: low
    issue: «ጽኑ» is less precise for προσκαρτερεῖτε.
    rationale: Although acceptable in a broad sense, it can mean “be firm/steadfast” generally. «ትጉ» more directly expresses continuing devoted persistence in prayer.
  - severity: low
    issue: The main text places thanksgiving before the vigilance phrase and attaches «-ም» to thanksgiving.
    rationale: The meaning remains recoverable, but placing the prayer reference, vigilance, and thanksgiving in the source’s sequence more clearly represents the Greek construction.
  revised_text: በጸሎት ትጉ፤ በእርሷም በምስጋና ንቁ ሁኑ።[a]
  revised_footnotes:
  - marker: a
    text: ወይም፣ «በጸሎት ያለማቋረጥ ትጉ፤ በእርሷም በምስጋና ተጠንቀቁ።»
    reason: lexical_alternative
  revision_rationale: The revision corrects the pronoun’s agreement and improves the representation of the present imperative’s continuing-persistence sense. It keeps the source’s broad exhortation intact, preserves the connection of vigilance with prayer, and retains thanksgiving as the accompanying manner. The footnote offers a legitimate lexical-explicit alternative without adding interpretation.
