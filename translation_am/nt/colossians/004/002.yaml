  rationale: ቃሉ በቀጥታ ከእንቅልፍ ነቅቶ መኖርን ሊያመለክት ቢችልም፣ እዚህ በጸሎት ውስጥ ንቁና ተጠንቃቂ መሆንን ያሳያል።
- source_word: ἐν αὐτῇ
