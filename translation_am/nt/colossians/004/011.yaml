  yaml_path: translation/nt/colossians/004/011.yaml
  text: and Jesus who is called Justus[a]. These are the only ones from the circumcision who are fellow workers for the kingdom of God[c][b], and they became a comfort to me.
translation:
  language: am
  text: ዩስጦስ የሚባለውም ኢየሱስ። ከግርዛት ወገን የሆኑ[a] ከእነዚህ መካከል፣ ለእግዚአብሔር መንግሥት አብረውኝ የሚሠሩት እነዚህ ብቻ ናቸው፤ እነርሱም ለእኔ መጽናኛ ሆነውልኛል።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከአይሁድ ወገን።” ቃል በቃል፣ “ከግርዛት ወገን።” የሐረጉ አያያዝ ደግሞ፣ “ለእግዚአብሔር መንግሥት አብረውኝ ከሚሠሩት መካከል ከግርዛት ወገን የሆኑት እነዚህ ብቻ ናቸው” ተብሎ ሊተረጎም ይችላል።
    reason: lexical_alternative_and_syntactic_ambiguity
  - marker: b
