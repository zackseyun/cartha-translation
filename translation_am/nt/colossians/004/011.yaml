  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ። ቁጥሩ በቀደሙት ሰላምታዎች ዝርዝር ውስጥ እንደሚቀጥል ለማሳየት “ሰላምታ ያቀርብላችኋል” በተዘዋዋሪ ተሟልቷል፤ ዋናው የግሪክ ሐረግ የብቸኝነት አጽንዖቱን እንዲጠብቅ ተደርጓል።
