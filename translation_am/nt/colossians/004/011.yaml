    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰησοῦς ὁ λεγόμενος Ἰοῦστος
  choice: ኢየሱስ የሚባለው ዮስጦስ
  rationale: ሁለቱንም የግል ስሞች በተለመደው የአማርኛ መጽሐፍ ቅዱሳዊ አጻጻፍ ያቀርባል፤ ὁ λεγόμενος ደግሞ ሌላ ስሙን እንደሚገልጽ ይጠበቃል።
- source_word: οἱ ὄντες ἐκ περιτομῆς
  choice: ከተገረዙት ወገን
  rationale: የግሪኩን ‘ከግርዛት’ የሚል የቡድን መለያ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ‘አይሁድ’ ብሎ በቀጥታ በመተርጎም የምንጩን አገላለጽ አይወስንም።
- source_word: οὗτοι μόνοι συνεργοὶ
  choice: አብረውኝ የሚሠሩት እነዚህ ብቻ ናቸው
  rationale: μόνοι የሚያሳየውን ብቸኝነት ግልጽ ያደርጋል፤ συνεργοίንም በተፈጥሯዊ የአማርኛ ሐረግ ይገልጻል።
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: ለእግዚአብሔር መንግሥት
  rationale: εἰς ከσυνεργοί ጋር ያለውን የዓላማና የአገልግሎት ግንኙነት ‘ለ’ በሚል ግልጽ ያደርጋል።
- source_word: ἐγενήθησάν μοι παρηγορία
  choice: ለእኔ መጽናኛ ሆነውኛል
  rationale: γίνομαι የሚያመለክተውን ‘መሆን’ እና παρηγορία የሚያመለክተውን መጽናኛ/ማበረታቻ በተፈጥሯዊና ክቡር አማርኛ ያቀርባል።
theological_decisions:
- issue: ‘ከግርዛት’ የሚለው የቡድን መለያ
  choice: ከተገረዙት ወገን
  alternative: ከአይሁድ ወገን፤ ወይም ከግርዛት ወገን
  rationale: በዐውዱ የአይሁድ ወገን የሆኑ የጳውሎስ የእምነት ባልደረቦችን የሚጠቅስ ይመስላል፤ ሆኖም ዋናው ጽሑፍ ሐረጉን ወደ ተወሰነ የነገረ መለኮት ወገን ሳይቀይር የምንጩን የግርዛት ምስል ይጠብቃል።
- issue: μόνοι የሚያሻማው የአገባብ ወሰን
  choice: ከተገረዙት ወገን ... እነዚህ ብቻ
  alternative: ለመንግሥቱ አብረውኝ ከሚሠሩት መካከል የተገረዙት እነዚህ ብቻ ናቸው
  rationale: የግሪኩ የቃላት አደራደር በቅድሚያ ‘ከግርዛት’ የሚለውን ቡድን አቅርቦ በዚያ ቡድን ውስጥ እነዚህ ብቻ ባልደረቦች እንደሆኑ ያጎላል፤ የአማርኛው አደራደር ይህን ቅድሚያ ይጠብቃል።
