lexical_decisions:
- source_word: σὺν Ὀνησίμῳ
  choice: ከአናሲሞስ ጋር ይመጣል
  rationale: σύν አብሮነትን ያመለክታል። የግሪኩ ሐረግ ከቀደመው ቁጥር ጋር ስለሚያያዝ፣ በአማርኛ ቁጥሩ ለብቻው ግልጽ እንዲሆን “ይመጣል” ከቀደመው አገባብ ተሟልቷል። Ὀνήσιμος በተለመደው የአማርኛ ቅርጽ “አናሲሞስ” ተብሎ ተጽፏል።
- source_word: πιστῷ καὶ ἀγαπητῷ ἀδελφῷ
  choice: ታማኝና የተወደደ ወንድም
  rationale: πιστός እዚህ የታማኝነትን ባሕርይ፣ ἀγαπητός የፍቅርና የቅርበት ስሜትን፣ ἀδελφός ደግሞ በእምነት ማኅበር ውስጥ ያለውን ወንድማዊ ግንኙነት ይገልጣሉ።
- source_word: ὅς ἐστιν ἐξ ὑμῶν
  choice: ከእናንተ አንዱ ከሆነው
  rationale: ἐξ ὑμῶν መነሻን ወይም የማኅበሩ አባልነትን ሊጠቁም ይችላል። “ከእናንተ አንዱ” በዘመናዊ አማርኛ ተፈጥሯዊ ሲሆን፣ “ከእናንተ ወገን” የሚለው በማስታወሻ ተጠብቋል።
- source_word: πάντα ὑμῖν γνωρίσουσιν
  choice: እነርሱ ... ሁሉ ያሳውቋችኋል
  rationale: πάντα ሁሉን አቀፍ ነው፤ γνωρίζω ደግሞ ማሳወቅን ወይም መግለጽን ያመለክታል። “ያሳውቋችኋል” የግሪኩን ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τὰ ὧδε
  choice: በዚህ ያለውን ሁሉ
  rationale: ὧδε ጳውሎስ ባለበት ስፍራ ያሉትን ጉዳዮች ያመለክታል። አጠቃላይ አነጋገሩ ተጠብቆ፣ “እየሆነ ያለው” የሚል የበለጠ ትርጓሜያዊ ማስፋፊያ አልተጨመረም።
theological_decisions:
- issue: የἀδελφῷ የእምነት ማኅበራዊ ትርጉም
  choice: ወንድም
  alternative: በእምነት ወንድም
  rationale: ጽሑፉ በቀጥታ “ወንድም” ይላል፤ ዐውዱ የእምነት ወንድም መሆኑን ቢያሳይም፣ ያልተጻፈ ማብራሪያ በዋናው ጽሑፍ አልተጨመረም።
- issue: የἐξ ὑμῶν ኃይል
  choice: ከእናንተ አንዱ ከሆነው
  alternative: ከእናንተ ወገን ከሆነው
  rationale: ዋናው ትርጉም አናሲሞስን ከቆላስይስ ማኅበር ጋር ያያይዛል፤ የትውልድ ቦታን ብቻ እንዲያመለክት አያስገድድም። ከፊልሞና የሚመጣ ተጨማሪ ማኅበራዊ ወይም ሥነ መለኮታዊ ግምት አልገባም።
