  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። ቁጥር 9 በግሪክ ከቁጥር 8 ጋር ሰዋስዋዊ ትስስር ስላለው፣ “ይመጣል” የሚለው ለአማርኛ ሙሉነት ተሟልቷል።
