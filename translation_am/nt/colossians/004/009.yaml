  text: together with Onesimus[a], the faithful and beloved brother, who is one of you[b]. They will make known to you everything here.
translation:
  language: am
  text: ከታማኙና ከተወደደው ወንድም ኦኔሲሞስ[a] ጋር፣ እርሱም ከእናንተ አንዱ ነው፤ እነርሱ በዚህ ያለውን ሁሉ[b] ያሳውቋችኋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከእናንተ ወገን የሆነው።”
