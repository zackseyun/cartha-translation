- from: የተወደደው ሐኪም ሉቃስና ዴማስ ሰላምታ ይልኩላችኋል።
  to: ውዱ ሐኪም ሉቃስና ዴማስ ሰላምታ ይልኩላችኋል።
  rationale: A small idiomatic revision improves the rendering of ὁ ἀγαπητός without changing meaning. The initial noun phrase unambiguously identifies Luke as the beloved physician, while «ዴማስ» remains coordinated as the second sender of greetings.
