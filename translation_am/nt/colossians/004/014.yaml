review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the epistolary greeting, the plural addressees, Luke, his profession, and Demas. The compound subject naturally takes a plural verb in Amharic despite the Greek greeting-formula verb being singular.
  naturalness: «ሰላምታ ይልኩላችኋል» is idiomatic modern Amharic. Replacing «የተወደደው» with «ውዱ» gives the customary, more direct Amharic expression of the affectionate epithet ὁ ἀγαπητός.
  terminology: '«ሐኪም» appropriately renders ἰατρός. «ውዱ ሐኪም» preserves both the warmth and the scope of the Greek description: it qualifies Luke, not Demas.'
  issues:
  - severity: low
    issue: The epithet «የተወደደው» is less idiomatic than «ውዱ» in this appositional personal description.
    rationale: Although semantically possible, «የተወደደው» can sound like a literal passive description (“the one who was loved”). «ውዱ» is natural standard Amharic for “the beloved/dear” and better fits the concise letter register.
  revised_text: ውዱ ሐኪም ሉቃስና ዴማስ ሰላምታ ይልኩላችኋል።
