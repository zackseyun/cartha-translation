id: COL.4.14
reference: Colossians 4:14
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς Λουκᾶς ὁ ἰατρὸς ὁ ἀγαπητὸς καὶ Δημᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/014.yaml
  text: Luke, the beloved physician, and Demas greet you.
translation:
  language: am
  text: ውዱ ሐኪም ሉቃስና ዴማስ ሰላምታ ይልኩላችኋል።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάζεται
  choice: ሰላምታ ይልኩላችኋል
  rationale: በደብዳቤ መዝጊያ የሚቀርብን ሰላምታ በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል። የግሪኩ ግስ ነጠላ ቢሆንም፣ ሉቃስና ዴማስ በአንድነት የግሱ ባለቤቶች ስለሆኑ በአማርኛ የብዙ ቁጥር ግስ መጠቀም ተፈጥሯዊ ነው።
- source_word: ὑμᾶς
  choice: ለእናንተ (በ«ይልኩላችኋል» ውስጥ)
  rationale: የሁለተኛ መደብ ብዙ ቁጥር ተቀባዮችን ያመለክታል፤ በአማርኛው ግስ ውስጥ «-ላችኋል» በሚለው ቅጥያ ተገልጧል።
- source_word: Λουκᾶς
  choice: ሉቃስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደው የስሙ ቅርጽ ነው።
- source_word: ἰατρὸς
  choice: ሐኪም
  rationale: የሕክምና ባለሙያን የሚያመለክት ግልጽ፣ ዘመናዊና የተከበረ የአማርኛ ቃል ነው።
- source_word: ἀγαπητὸς
  choice: የተወደደው
  rationale: ለሉቃስ ያለውን ፍቅርና ክብር የግሪኩን ሙቀት በመጠበቅ ይገልጻል።
- source_word: καὶ
  choice: -ና
  rationale: ሉቃስንና ዴማስን በተፈጥሯዊ አማርኛ የሚያገናኝ አስተባባሪ ቅጥያ ነው።
- source_word: Δημᾶς
  choice: ዴማስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደው የግሪክ ስም ቅርጽ ነው።
theological_decisions:
- issue: «የተወደደው» የሚለው ገላጭ የሚመለከተው ማንን እንደሆነ
  choice: «የተወደደው ሐኪም» የሚለው ሙሉ ሐረግ ሉቃስን ብቻ ይገልጻል።
  alternative: «የተወደደው» ዴማስንም እንደሚጨምር ማንበብ።
  rationale: በግሪኩ Λουκᾶς ὁ ἰατρὸς ὁ ἀγαπητός የሚለው አወቃቀር «ሐኪሙ» እና «የተወደደው» የሚሉትን ሁለቱንም መግለጫዎች በቀጥታ ከሉቃስ ጋር ያያይዛል።
translation_notes:
  register: ትርጉሙ አጭር፣ ክቡርና ለዘመናዊ አማርኛ አንባቢ ተፈጥሯዊ ነው። «ሰላምታ ይልኩላችኋል» የደብዳቤውን ሰላምታ በግልጽ ያቀርባል፤ የብዙ ቁጥር ግሱም ሁለቱን ሰላምታ ላኪዎች በተፈጥሯዊ አማርኛ ያስማማል።
