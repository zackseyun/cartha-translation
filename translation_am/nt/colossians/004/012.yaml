  alternative: አገልጋይ
  rationale: በዚህ የማንነት መግለጫ ውስጥ ቃሉ የመሲሑ ሙሉ ንብረትና ታማኝ ተገዥ መሆንን ያሳያል፤ ‘አገልጋይ’ ይህን ኃይል ሊያለዝብ ይችላል።
- issue: πεπληροφορημένοι የሚያመለክተው እርግጠኝነት ወይም መረጋጋት
  choice: ፈጽማችሁ እርግጠኞች
  alternative: ፈጽማችሁ የተረጋገጣችሁ
  rationale: ዋናው ትርጉም የሙሉ እርግጠኝነትን ገጽታ ይከተላል፤ ቃሉ የተረጋጋ ወይም የጸና ሁኔታንም ሊያመለክት ስለሚችል ይህ በማስታወሻ ተጠብቋል።
