  text: ἀσπάζεται ὑμᾶς Ἐπαφρᾶς ὁ ἐξ ὑμῶν, δοῦλος ⸀Χριστοῦ, πάντοτε ἀγωνιζόμενος ὑπὲρ ὑμῶν ἐν ταῖς προσευχαῖς, ἵνα ⸀σταθῆτε τέλειοι καὶ ⸀πεπληροφορημένοι ἐν παντὶ θελήματι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/012.yaml
  text: Epaphras[a], who is one of you, greets you—a servant of Messiah, always striving for you in his prayers[b], so that you may stand mature and fully assured in all the will of God.
translation:
  language: am
  text: ከእናንተ አንዱ የሆነው ኤጳፍራ ሰላምታውን ይልክላችኋል። እርሱ የመሲሑ[a] ባሪያ ሲሆን፣ በእግዚአብሔር ፈቃድ ሁሉ የበሰላችሁና ሙሉ በሙሉ እርግጠኞች[b] ሆናችሁ እንድትቆሙ፣ ሁልጊዜ በጸሎቱ ስለ እናንተ ይተጋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም “የመሲሑ ኢየሱስ።” አንዳንድ የግሪክ ቅጂዎች እንዲህ ያነባሉ።
    reason: alternative_reading
  - marker: b
    text: ወይም “ሙሉ በሙሉ የተረጋገጣችሁ” ወይም “ሙሉ በሙሉ የተረዳችሁ።” የግሪኩ ቃል ፍጹም እርግጠኝነትን ወይም የጸና ሁኔታን ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: ሰላምታውን ይልክላችኋል
  rationale: የደብዳቤ መዝጊያ ሰላምታን በዘመናዊና ተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ὁ ἐξ ὑμῶν
  choice: የእናንተ ወገን የሆነው
  rationale: ኤጳፍራ ከቆላስይስ ማኅበረሰብ ወገን መሆኑን በግልጽና ተፈጥሯዊ አነጋገር ያሳያል።
- source_word: δοῦλος
  choice: ባሪያ
  rationale: ቃሉ ከተራ አገልጋይነት ይልቅ የባለቤትነትንና ፍጹም ታማኝነትን የሚያመለክተውን ጠንካራ ትርጉም ይጠብቃል።
- source_word: Χριστοῦ
  choice: የመሲሑ
  rationale: Χριστός የቅቡዕነት ማዕረግ ስለሆነ፣ ትርጉሙን የሚያስጠብቀው ‘መሲሕ’ ተመርጧል፤ ዋናው የግሪክ ጽሑፍ እዚህ ‘ኢየሱስ’ የሚለውን አያካትትም።
- source_word: ἀγωνιζόμενος
  choice: ይተጋል
  rationale: በጸሎት የሚደረገውን ጽኑና ቀጣይ ጥረት ያሳያል፤ ከአውዱ በላይ የትግል ምስልን አያጋንንም።
- source_word: ἐν ταῖς προσευχαῖς
  choice: በጸሎቱ
  rationale: ጸሎቱ የኤጳፍራ መሆኑን በተፈጥሯዊ አማርኛ ግልጽ ያደርጋል፤ ተደጋጋሚውን ተግባር ‘ሁልጊዜ’ ይጠብቀዋል።
- source_word: ἵνα σταθῆτε
  choice: እንድትቆሙ
  rationale: የግሪኩን የመቆም ምስል ይጠብቃል፤ ‘ጸንታችሁ’ የሚለውን በጽሑፉ ያልተገለጸ ቃል አይጨምርም።
- source_word: τέλειοι
  choice: የበሰላችሁ
  rationale: በዚህ ዐውድ τέλειος ከኃጢአት ፍጹም ነፃነትን ሳይሆን መንፈሳዊ ብስለትንና ሙሉነትን ያመለክታል።
- source_word: πεπληροφορημένοι
  choice: ፈጽማችሁ እርግጠኞች
  rationale: ፍጹም እርግጠኝነት ወይም የተረጋጋ ሁኔታ የሚለውን ኃይል ይገልጻል፤ ሌላው ሊሆን የሚችለው ትርጉም በማስታወሻ ተጠብቋል።
- source_word: ἐν παντὶ θελήματι τοῦ θεοῦ
  choice: በእግዚአብሔር ፈቃድ ሁሉ
  rationale: ሐረጉ ስለ ፈቃዱ ሙሉ ይዘት፣ ስለ መስኩ ወይም ስለ እርሱ መስማማት መሆኑን ሳይገድብ ስፋቱን ይጠብቃል።
theological_decisions:
- issue: Χριστοῦ የሚለውን ማዕረግ መተርጎም
  choice: የመሲሑ
  alternative: የክርስቶስ
  rationale: ‘መሲሕ’ የΧριστόςን ‘ቅቡዕ’ የሚለውን የማዕረግ ትርጉም ይጠብቃል፤ ‘ኢየሱስ’ በዋናው ጽሑፍ ስለሌለ አልተጨመረም።
