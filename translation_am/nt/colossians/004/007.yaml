base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/007.yaml
  text: Tychicus[a], the beloved brother and faithful minister and fellow servant in the Lord[c][b], will make known to you everything about me.
translation:
  language: am
  text: ስለ እኔ ያሉትን ነገሮች ሁሉ[a]፣ በጌታ የተወደደ ወንድም፣ ታማኝ አገልጋይ[b] እና ከእኔ ጋር ባሪያ[c] የሆነው ቲኪቆስ ያሳውቃችኋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ስለ እኔ ያለውን ሁሉ” ወይም “ሁኔታዬን ሁሉ።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ታማኝ ሚኒስትር” ወይም “ታማኝ ዲያቆን።” የግሪኩ διάκονος የሚለው ቃል “አገልጋይ” ወይም “ሚኒስትር” ማለት ሲችል፣ በአንዳንድ አውዶች ደግሞ የቤተ ክርስቲያን የዲያቆን ሹመትን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “በጌታ ከእኔ ጋር አገልጋይ።” የግሪኩ σύνδουλος የሚለው ቃል ከሌላ ሰው ጋር በአንድ ጌታ ሥር ባሪያ ሆኖ የሚያገለግልን ሰው ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὰ κατ’ ἐμὲ πάντα
  choice: ስለ እኔ ያለውን ሁሉ
  rationale: የግሪኩ ፈሊጥ የጳውሎስን ሁኔታ፣ ጉዳዮችና እሱን የሚመለከቱ ነገሮች በስፋት ያካትታል፤ ይህ አተረጓጎም πάντα የሚለውንም ሳያጠብ ይጠብቃል።
- source_word: γνωρίσει ὑμῖν
  choice: ያሳውቃችኋል
  rationale: የወደፊት ጊዜውንና ‘እንዲታወቅ ማድረግ/ማሳወቅ’ የሚለውን ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: Τυχικὸς
  choice: ቲኪቆስ
  rationale: የግሪኩን የግል ስም በተለመደው የአማርኛ ቅርጽ ይተረጉማል።
- source_word: ὁ ἀγαπητὸς ἀδελφὸς
  choice: የተወደደው ወንድም
  rationale: የጳውሎስን ሞቅ ያለ አድናቆትና ለቲኪቆስ የተጠቀመውን ነጠላ ተባዕታይ መጠሪያ ይጠብቃል።
- source_word: πιστὸς διάκονος
  choice: ታማኝ አገልጋይ
  rationale: πιστός ታማኝነትን ያመለክታል፤ διάκονος እዚህ የቤተ ክርስቲያንን መደበኛ ሹመት በግልጽ ስለማያመለክት ‘አገልጋይ’ የአውዱን ስፋት ይጠብቃል።
- source_word: σύνδουλος
  choice: አብሮኝ ባሪያ
  rationale: σύνδουλος ከሌላ ሰው ጋር በአንድ ጌታ ሥር ያለን የባርነት አገልግሎት ይገልጣል፤ ‘አብሮኝ’ የጋራነቱን፣ ‘ባሪያ’ ደግሞ የቃሉን ጠንካራ ኃይል ይጠብቃሉ።
- source_word: ἐν κυρίῳ
  choice: በጌታ
  rationale: የጳውሎስን መደበኛ የግንኙነትና የአገልግሎት ሐረግ ያለ ማብራሪያ ጭማሪ ይጠብቃል።
theological_decisions:
- issue: σύνδουλος / δοῦλος የባርነት ቃላት አተረጓጎም
  choice: አብሮኝ ባሪያ
  alternative: አብሮኝ አገልጋይ
  rationale: ዋናው ትርጉም ቲኪቆስና ጳውሎስ በጌታ ሥር ያላቸውን የጋራ ባርነት በግልጽ ይጠብቃል። ዘመናዊው ‘ባሪያ’ የሚለው ቃል ያልታሰቡ ማኅበራዊ ምስሎችን ሊያስነሳ ስለሚችል፣ ለስለስ ያለው ‘አብሮኝ አገልጋይ’ በማስታወሻ ቀርቧል።
