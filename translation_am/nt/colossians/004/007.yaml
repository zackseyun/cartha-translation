  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። የግሪኩ የሐረግ ቅደም ተከተል በተቻለ መጠን ተጠብቆ፣ ቲኪቆስን የሚገልጹት ሦስት መጠሪያዎች በግልጽ ተደርድረዋል።
