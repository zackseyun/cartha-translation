  text: Ὁ ἀσπασμὸς τῇ ἐμῇ χειρὶ Παύλου. μνημονεύετέ μου τῶν δεσμῶν. ἡ χάρις μεθ’ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/018.yaml
  text: The greeting is in my own hand—Paul's[a]. Remember my chains[b]. Grace be with you.
translation:
  language: am
  text: እኔ ጳውሎስ፣ ይህን ሰላምታ በገዛ እጄ ጻፍኩ[a]። ሰንሰለቶቼን አስቡ[b]። ጸጋ ከእናንተ ጋር ይሁን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “ሰላምታው በእኔ በጳውሎስ እጅ።” ይህ የመደምደሚያውን ሰላምታ ጳውሎስ ራሱ መጻፉን ያመለክታል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “እስራቴን አስቡ።” “ሰንሰለቶቼን” የሚለው ቃል የጳውሎስን እስራት ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπασμός
  choice: ሰላምታ
  rationale: በደብዳቤው መደምደሚያ ላይ የተጻፈውን የስንብት ሰላምታ በተፈጥሯዊና በዘመናዊ አማርኛ ይገልጻል።
- source_word: τῇ ἐμῇ χειρὶ Παύλου
  choice: እኔ ጳውሎስ፣ … በገዛ እጄ ጻፍኩ
  rationale: ቃል በቃል ቢቀርብ በአማርኛ የማይፈጥረውን ግስ በመጨመር፣ የመደምደሚያው ሰላምታ በጳውሎስ የገዛ እጅ መጻፉንና የግል ፊርማ ባሕርይ እንዳለው ያሳያል።
- source_word: μνημονεύετέ
  choice: አስቡ
  rationale: ትእዛዙን በቀጥታና በተፈጥሯዊ አማርኛ ያቀርባል፤ የግሪኩን የቀጣይነት ገጽታ ከሚገባው በላይ አያጎላም።
- source_word: μου τῶν δεσμῶν
  choice: ሰንሰለቶቼን
  rationale: የδεσμοίን ተጨባጭ ምስል ይጠብቃል፤ ቃሉ የጳውሎስን እስራት በምትክ ይገልጻል።
- source_word: ἡ χάρις
  choice: ጸጋ
  rationale: የጳውሎስን የተለመደ የበረከት መደምደሚያ ያለ ተጨማሪ ባለቤት ይጠብቃል።
- source_word: μεθ’ ὑμῶν
  choice: ከእናንተ ጋር ይሁን
  rationale: ግስ የሌለውን የግሪክ የበረከት ሐረግ በተፈጥሯዊ የአማርኛ ምኞት አገላለጽ ያቀርባል።
theological_decisions:
- issue: ግስ የሌለው የጳውሎስ መደምደሚያ በረከት
  choice: ጸጋ ከእናንተ ጋር ይሁን
  alternative: ጸጋ ከእናንተ ጋር
  rationale: ግሪኩ ግስ ባይኖረውም፣ «ይሁን» በአማርኛ የበረከት ምኞቱን በተፈጥሯዊ ሁኔታ ያሳያል፤ ያልተገለጸ የጸጋ ምንጭ አይጨምርም።
- issue: ሰንሰለቶቹ በቃል በቃል ወይም እስራትን በሚያመለክት አገላለጽ መተርጎማቸው
  choice: ሰንሰለቶቼን
  alternative: እስራቴን
  rationale: ተጨባጩን ምስልና የእስራቱን አንድምታ አብሮ ይጠብቃል፤ ጳውሎስን ማሰብ ጸሎትን፣ ድጋፍን ወይም ሌላ ምላሽን ብቻ እንደሚያመለክት አይወስንም።
translation_notes:
  register: ቋንቋው ዘመናዊ፣ ግልጽና ክብር ያለው ነው። «በገዛ እጄ» የግሪኩን አጽንዖት በተፈጥሯዊ አማርኛ ያስተላልፋል፤ «ሰንሰለቶቼን» ደግሞ የምንጩን ሕያው ምስል ይጠብቃል።
