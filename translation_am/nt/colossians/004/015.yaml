  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች «ንምፋስንና በቤቱ ያለችውን ቤተ ክርስቲያን» የሚለውን ንባብ ይደግፋሉ፤ ሌሎች ደግሞ «ንምፋንና በቤታቸው ያለችውን ቤተ ክርስቲያን» የሚለውን ንባብ ይደግፋሉ።
