  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅመናል። ‘ቤተ ክርስቲያን’ በጳውሎስ ደብዳቤዎች አውድ የተለመደውን ቤተ እምነታዊ ቃል ይጠብቃል፤ የመጨረሻው ሐረግ ግን የግሪኩን ሆን ብሎ የተተወ ስምና ታሪካዊ አሻሚነት ይጠብቃል።
