base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/016.yaml
  text: And when this letter has been read among you[a], see that it is also read in the church of the Laodiceans[b], and that you also read the one from Laodicea.
translation:
  language: am
  text: ይህ ደብዳቤ በመካከላችሁ ከተነበበ በኋላ፣[a] በሎዶቅያ ባለችው ቤተ ክርስቲያንም እንዲነበብ አድርጉ፤ እናንተም ከሎዶቅያ የመጣውን[b] አንብቡ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: እዚህ ‘መነበብ’ የሚለው በቤተ ክርስቲያኑ ስብሰባ ፊት ጮክ ተብሎ መነበብን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: በግሪክኛው ‘ደብዳቤ’ የሚለው ቃል በግልጽ አልተደገመም፤ አውዱ ግን ‘ከሎዶቅያ የመጣውን ደብዳቤ’ እንዲል ያስረዳል። ይህ ደብዳቤ በዚያን ጊዜ በሎዶቅያ የነበረ ሊሆን ይችላል፤ መጀመሪያውኑ ለሎዶቅያ የተጻፈ መሆኑ ግን አይረጋገጥም።
    reason: cultural_note
lexical_decisions:
- source_word: ἀναγνωσθῇ / ἀναγνῶτε
  choice: ከተነበበ / አንብቡ
  rationale: ቃሉ በቀጥታ ‘ማንበብ’ ማለት ነው፤ በጉባኤ ውስጥ ጮክ ብሎ መነበብን ሊያመለክት ቢችልም ይህን በዋናው ጽሑፍ ላይ አልጨመርንም።
- source_word: παρ’ ὑμῖν
  choice: በመካከላችሁ
  rationale: ደብዳቤው በቆላስይስ ማኅበረሰብ ውስጥ መነበቡን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἡ ἐπιστολή
  choice: ይህ ደብዳቤ
  rationale: የግሪኩ የተወሰነ መስተዋድድ አሁን የሚላከውን የቆላስይስ ደብዳቤ ያመለክታል፤ ‘ይህ’ በአማርኛ ማጣቀሻውን ግልጽ ያደርጋል።
- source_word: ποιήσατε ἵνα
  choice: እንዲነበብ አድርጉ
  rationale: የትእዛዙን ኃይልና የታሰበውን ውጤት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἐν τῇ Λαοδικέων ἐκκλησίᾳ
  choice: በሎዶቅያ ሰዎች ቤተ ክርስቲያን
  rationale: Λαοδικέων በሎዶቅያ ከተማ ያሉትን ሰዎች ያመለክታል፤ ἐκκλησία ደግሞ በጳውሎስ አውድ ‘ቤተ ክርስቲያን’ ተብሎ ተተርጉሟል።
- source_word: τὴν ἐκ Λαοδικείας
  choice: ከሎዶቅያ የመጣውን
  rationale: ግሪኩ ‘ደብዳቤ’ የሚለውን ስም ከአውዱ እንዲገባ ትቶታል። ይህ አተረጓጎም ያንን ስውር አገባብ ይጠብቃል፤ ἐκ የሚለውንም ‘ከ’ ብሎ ያስተላልፋል።
theological_decisions:
- issue: ‘ከሎዶቅያ የመጣው’ የሚለው ደብዳቤ ማንነት
  choice: ደብዳቤውን ከማንኛውም ከሚታወቅ ቀኖናዊ ወይም ቀኖናዊ ካልሆነ ጽሑፍ ጋር ሳናዛምድ፣ ‘ከሎዶቅያ የመጣውን’ ብለን በገለልተኛነት ተርጉመናል።
  alternative: ለሎዶቅያ የተጻፈ የጳውሎስ ደብዳቤ፣ ከሎዶቅያ ወደ ቆላስይስ የተላከ ደብዳቤ፣ ወይም ከሎዶቅያ ጋር የተያያዘ ዙር ደብዳቤ ሊሆን ይችላል።
  rationale: የግሪኩ ጽሑፍ ከሎዶቅያ ጋር ያለውን ግንኙነት ብቻ ይገልጣል እንጂ የደብዳቤውን ማንነት ወይም የመጀመሪያ ተቀባዮች አይወስንም።
