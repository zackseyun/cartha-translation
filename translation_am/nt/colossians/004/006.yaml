  yaml_path: translation/nt/colossians/004/006.yaml
  text: Let your speech always be with grace[a], seasoned with salt[b], so that you may know how you ought to answer each person.
translation:
  language: am
  text: ንግግራችሁ ሁልጊዜ በጸጋ[a] የተሞላ፣ በጨውም የተቀመመ[b] ይሁን፤ በዚህም ለእያንዳንዱ ሰው እንዴት መመለስ እንደሚገባችሁ እንድታውቁ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በሞገስ።» «በጸጋ» የሚለው ሐረግ በደግነት፣ በለዘብተኝነት ወይም በሞገስ የተሞላ ንግግርን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: «በጨው የተቀመመ» የሚለው፣ ንግግር ተገቢ፣ ማራኪና ጥበብ የተሞላበት እንጂ ጣዕም አልባ ወይም ጎጂ እንዳይሆን የሚገልጽ ዘይቤ ነው።
    reason: cultural_note
lexical_decisions:
- source_word: λόγος
  choice: ንግግር
  rationale: በዚህ የምክር አውድ ቃሉ አንድን ቃል ወይም መደበኛ መልእክት ሳይሆን የአማኞችን የንግግር አካሄድ ያመለክታል።
- source_word: ἐν χάριτι
  choice: በጸጋ
  rationale: የመስተዋድዱን ቅርጽ ይጠብቃል፤ የደግነትና የለዘብተኝነት ትርጉሙንም ሆነ የጸጋን ሰፊ ጳውሎሳዊ ድምፀት ሳይወስን ያስቀራል።
- source_word: ἅλατι ἠρτυμένος
  choice: በጨው የተቀመመ
  rationale: የምንጩን የምግብ ማጣፈጫ ዘይቤ ይጠብቃል፤ ንግግሩ ተገቢ፣ ማራኪና ጥበባዊ እንዲሆን የሚያሳየውን ውጤታዊ ባሕርይም ያስተላልፋል።
- source_word: εἰδέναι
  choice: እንድታውቁ
  rationale: የግስ ስም አገባቡ አሻሚ ቢሆንም፣ ከቀደመው ትእዛዝ ጋር ያለውን የዓላማ ወይም የውጤት ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: δεῖ
  choice: እንደሚገባችሁ
  rationale: በአውዱ የሚጠበቀውን ተገቢነትና ግዴታ ያሳያል፤ ከመጠን በላይ ጠንካራ አያደርገውም።
- source_word: ἑνὶ ἑκάστῳ
  choice: ለእያንዳንዱ ሰው
  rationale: ምላሹ ለየግለሰቡ ተስማሚ መሆን እንዳለበት የሚያጎላውን አከፋፋይ ኃይል ይጠብቃል።
- source_word: ἀποκρίνεσθαι
  choice: መመለስ
  rationale: በውይይት አውድ ለሰው መልስ መስጠትን በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጻል።
- source_word: πάντοτε
  choice: ሁልጊዜ
  rationale: የጊዜውን ሙሉ ወሰን በግልጽና ተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: ἐν χάριτι የሚለው ሐረግ የሚያመለክተው የንግግር ደግነት ብቻ ነው ወይስ የመለኮታዊ ጸጋ ድምፀትም አለው?
  choice: በጸጋ
  alternative: በደግነት / በሞገስ
  rationale: «በጸጋ» ሁለቱንም የትርጉም አቅጣጫዎች ክፍት ያደርጋል፤ አንዱን ብቻ በመምረጥ የምንጩን ትርጉማዊ ስፋት አያጠብም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የጨው ዘይቤ ተጠብቆ በማስታወሻ ተብራርቷል፤ የεἰδέναι አገባብ በዓላማ አንቀጽ በተፈጥሯዊ ሁኔታ ቀርቧል።
