language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὃν ἔπεμψα πρὸς ὑμᾶς εἰς αὐτὸ τοῦτο ἵνα ⸀γνῶτε τὰ περὶ ⸀ἡμῶν καὶ παρακαλέσῃ τὰς καρδίας ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/008.yaml
  text: 'I sent him to you for this very purpose: that you may know how we are[a], and that he may encourage your hearts.'
translation:
  language: am
  text: ስለ እኛ ያለውን ሁኔታ እንድታውቁ[a]ና ልባችሁንም እንዲያበረታታ፣ ለዚሁ ዓላማ ወደ እናንተ ላክሁት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች፣ «ስለ እናንተ ያለውን ሁኔታ እኛ እንድናውቅ» የሚል ንባብ አላቸው።
    reason: textual_variant
lexical_decisions:
- source_word: ὃν
  choice: እርሱን / -ት
  rationale: በቀደመው ቁጥር የተጠቀሰውን ቲኪቆስን የሚያመለክት ተሳቢ ነው፤ በአማርኛ በግሱ ላይ ያለው «-ት» በተፈጥሮ ይገልጠዋል።
- source_word: ἔπεμψα
  choice: ላክሁት
  rationale: የአኦሪስት አመልካች ግስን በተፈጥሯዊ ቀላል ያለፈ ጊዜ ያቀርባል።
- source_word: πρὸς ὑμᾶς
  choice: ወደ እናንተ
  rationale: ከመላክ ግስ ጋር የሰዎችን አቅጣጫ በግልጽ ያሳያል።
- source_word: εἰς αὐτὸ τοῦτο
  choice: ለዚሁ ዓላማ
  rationale: αὐτὸ τοῦτο ያለውን አጽንዖት «ዚሁ» ያስተላልፋል፤ «ዓላማ» የሐረጉን የዓላማ ትርጉም በዘመናዊ አማርኛ ያቀርባል።
- source_word: ἵνα
  choice: እንድታውቁ … እንዲያበረታታ
  rationale: የዓላማ ንዑስ አረፍተ ነገሮቹን በአማርኛ ተገቢ የ«እንዲ-» አወቃቀር ያስተላልፋል።
- source_word: γνῶτε
  choice: እንድታውቁ
  rationale: በἵνα ሥር ያለውን የዓላማ ኃይልና የሁለተኛ መደብ ብዙ ቁጥርን ይጠብቃል።
- source_word: τὰ περὶ ἡμῶν
  choice: ስለ እኛ ያለውን ሁኔታ
  rationale: የጳውሎስንና የባልደረቦቹን ዜና ወይም ሁኔታ በተፈጥሯዊና ግልጽ አማርኛ ያሳያል፤ ከግሪኩ በላይ ዝርዝር አያክልም።
- source_word: παρακαλέσῃ
  choice: እንዲያበረታታ
  rationale: παρακαλέω ማጽናናት፣ ማበረታታት ወይም መምከርን ሊያመለክት ይችላል፤ ከ«ልባችሁን» ጋር «ማበረታታት» ማጽናናትንና ማበርታትን ሳያጠብ ያቀርባል።
- source_word: τὰς καρδίας ὑμῶν
  choice: ልባችሁን
  rationale: መጽሐፍ ቅዱሳዊውን የ«ልብ» አገላለጽ በቀጥታና በተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: በዓላማው ንዑስ አረፍተ ነገር ውስጥ ያለው የጽሑፍ ልዩነት
  choice: የSBLGNTን «ስለ እኛ ያለውን ሁኔታ እንድታውቁ» (γνῶτε τὰ περὶ ἡμῶν) ንባብ በዋናው ጽሑፍ መከተል።
  alternative: «ስለ እናንተ ያለውን ሁኔታ እኛ እንድናውቅ» (γνῶμεν τὰ περὶ ὑμῶν ወይም ተመሳሳይ ልዩ ንባቦች)።
  rationale: ዋናው ጽሑፍ የቀረበውን SBLGNT ምንጭ ይከተላል፤ የማወቁን አቅጣጫ የሚቀይረው ጉልህ ልዩ ንባብ ለግልጽነት በግርጌ ማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ የዓላማ አወቃቀር በተፈጥሯዊ የአማርኛ ቅደም ተከተል ቀርቧል፤ «ልብ» የሚለው መጽሐፍ ቅዱሳዊ ምስል ተጠብቋል።
