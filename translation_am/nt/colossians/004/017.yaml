base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/017.yaml
  text: And tell Archippus[a], “See to the ministry that you received in the Lord, so that you may fulfill it.”
translation:
  language: am
  text: አርክጳስንም፣ “በጌታ የተቀበልከውን አገልግሎት[a] እንድትፈጽመው ተጠንቀቅ” በሉት።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከጌታ የተቀበልከውን አገልግሎት።”
    reason: የἐν κυρίῳ ሐረግ ጌታን የአገልግሎቱ ምንጭ አድርጎ ሊያመለክት የሚችልበትን አማራጭ ንባብ ለማሳየት።
lexical_decisions:
- source_word: εἴπατε
  choice: በሉት
  rationale: የብዙ ቁጥር ትእዛዝ መሆኑንና ጉባኤው ለአርክጳስ እንዲነግረው የተሰጠውን ቀጥተኛ ትእዛዝ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: Ἀρχίππῳ
  choice: አርክጳስን
  rationale: የግሪኩን የግል ስም በአማርኛ የተለመደውን ቅርጽ በመከተል ያቀርባል።
- source_word: Βλέπε
  choice: ተጠንቀቅ
  rationale: የነጠላ ቁጥር የአሁን ጊዜ ትእዛዝ ሲሆን፣ በተሰጠው ኃላፊነት ላይ ንቁ ሆኖ በጥንቃቄ መከታተልን ያመለክታል።
- source_word: διακονίαν
  choice: አገልግሎት
  rationale: በጌታ የተቀበለውን የክርስቲያናዊ አገልግሎት ኃላፊነት ይገልጣል፤ የተወሰነ የቤተ ክርስቲያን ሹመት እንደሆነ አይወስንም።
- source_word: παρέλαβες
  choice: የተቀበልከውን
  rationale: ኃላፊነቱ በራሱ የወሰደው ሳይሆን የተሰጠውና የተቀበለው መሆኑን ያቆያል።
- source_word: ἐν κυρίῳ
  choice: በጌታ
  rationale: ἐν የሚያሳየውን በጌታ ውስጥ፣ ከጌታ ጋር ባለ ግንኙነት፣ ወይም በጌታ ሥልጣን የሚለውን ክፍት ትርጉም ይጠብቃል።
- source_word: ἵνα
  choice: እንድትፈጽመው
  rationale: የትእዛዙን ዓላማ በተፈጥሯዊ የአማርኛ ዓላማ አንቀጽ ያቀርባል።
- source_word: πληροῖς
  choice: ሙሉ በሙሉ እንድትፈጽመው
  rationale: አገልግሎቱን በታማኝነት እስከ ፍጻሜው ማከናወንን ያሳያል፤ የπληρόωን የማሟላትና የመፈጸም ሁለቱንም ሐሳቦች ያንጸባርቃል።
theological_decisions:
- issue: የἐν κυρίῳ ፍቺ
  choice: በዋናው ጽሑፍ “በጌታ” ተብሎ ተተርጉሟል።
  alternative: “ከጌታ የተቀበልከውን”
  rationale: የግሪኩ ἐν በዋነኝነት “በ/ውስጥ” የሚል ሲሆን፣ ሐረጉ አገልግሎቱ የተቀበለበትን መንፈሳዊ ዐውድ ወይም ግንኙነት ሊያመለክት ይችላል፤ ጌታ ምንጩ መሆኑም ሊጠቆም ይችላል። ዋናው ትርጉም ይህን አሻሚነት ሳይዘጋ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “አገልግሎት” ሃይማኖታዊ ዐውዱን ያሳያል፣ ነገር ግን የተወሰነ ሹመት አያስገባም።
