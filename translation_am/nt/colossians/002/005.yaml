  text: εἰ γὰρ καὶ τῇ σαρκὶ ἄπειμι, ἀλλὰ τῷ πνεύματι σὺν ὑμῖν εἰμι, χαίρων καὶ βλέπων ὑμῶν τὴν τάξιν καὶ τὸ στερέωμα τῆς εἰς Χριστὸν πίστεως ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/005.yaml
  text: For even if I am absent in the flesh[a], yet I am with you in spirit[c][b], rejoicing and seeing your good order and the firmness of your faith in Messiah.
translation:
  language: am
  text: 'ምንም እንኳ በሥጋ[a] ከእናንተ ርቄ ብሆንም፣ በመንፈስ[b] ግን ከእናንተ ጋር ነኝ፤ ሥርዓታችሁንና በመሲሑ ያላችሁን የእምነት ጽናት[c] እያየሁ ደስ ይለኛል።


    [a] “በአካል” ማለት ነው።


    [b] እዚህ ላይ “መንፈስ” የጳውሎስን መንፈስ ወይም መንፈሳዊ መገኘት ሊያመለክት ይችላል፤ መንፈስ ቅዱስን ያመለክታል የሚለውም አማራጭ አለ።


    [c] ወይም፣ “ለመሲሑ ያላችሁ ጽኑ ታማኝነት።”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በአካል” ማለት ነው።
    reason: lexical_alternative
  - marker: b
    text: እዚህ ላይ “መንፈስ” የጳውሎስን መንፈስ ወይም መንፈሳዊ መገኘት ሊያመለክት ይችላል፤ መንፈስ ቅዱስን ያመለክታል የሚለውም አማራጭ አለ።
    reason: theological_ambiguity
  - marker: c
    text: ወይም፣ “ለመሲሑ ያላችሁ ጽኑ ታማኝነት።”
    reason: alternative_reading
lexical_decisions:
- source_word: σαρκί
  choice: በሥጋ
  rationale: ከ“በመንፈስ” ጋር ያለውን የግሪክ ተቃርኖ ይጠብቃል፤ በዚህ አውድ የሥነ ምግባር ክፋትን ሳይሆን አካላዊ መገኘትን ያመለክታል።
- source_word: πνεύματι
  choice: በመንፈስ
  rationale: ከአካላዊ መራቅ ጋር ያለውን ተቃርኖ ይጠብቃል፣ የቃሉንም ማመልከቻ ከሚገባው በላይ አይወስንም።
- source_word: χαίρων καὶ βλέπων
  choice: እያየሁ ደስ ይለኛል
  rationale: ሁለቱን በአንድ ጊዜ የሚከናወኑ ድርጊቶች በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τάξιν
  choice: ሥርዓታችሁን
  rationale: የማኅበሩን የተደራጀና የተገባ አኗኗር ያሳያል፤ ወታደራዊ ትርጉምን አያስገድድም።
- source_word: στερέωμα
  choice: ጽናት
  rationale: የጠነከረና የማይናወጥ ሁኔታን በተፈጥሯዊ የአማርኛ አገላለጽ ያስተላልፋል።
- source_word: πίστεως
  choice: እምነት
  rationale: በዚህ አገባብ ዋናውና ተፈጥሯዊው ትርጉም ነው፤ “ታማኝነት” የሚለው ሊኖር የሚችል ፍቺ በማስታወሻ ተጠብቋል።
- source_word: εἰς Χριστόν
  choice: በመሲሑ ያላችሁ
  rationale: εἰς የእምነቱን አቅጣጫና ተቀባይ ያሳያል፤ Χριστός እዚህ እንደ ማዕረግ ስለሚሠራ “መሲሑ” ተብሏል።
theological_decisions:
- issue: “በመንፈስ” የሚለው የሚያመለክተው
  choice: የጳውሎስ አካላዊ ያልሆነ የግል መገኘት
  alternative: በመንፈስ ቅዱስ ከእነርሱ ጋር መሆን
  rationale: ከ“በሥጋ” ጋር ያለው ቀጥተኛ ተቃርኖ የጳውሎስን የግል መንፈስ ያመለክታል፤ ሆኖም የመንፈስ ቅዱስ አማራጭ በማስታወሻ ተጠብቋል።
- issue: Χριστόν አተረጓጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: በዚህ ሐረግ ቃሉ እንደ ማዕረግ ይሠራል፤ “መሲሑ” ይህን ማዕረጋዊ ኃይል በግልጽ ያስተላልፋል።
- issue: πίστις በዚህ አውድ
  choice: በመሲሑ ያላችሁ እምነት
  alternative: ለመሲሑ ያላችሁ ታማኝነት
  rationale: የታመነውን ወገን የሚያመለክተው εἰς Χριστόν ከ“እምነት” ጋር በተፈጥሮ ይስማማል፤ የታማኝነት ጥላ ፍቺ ግን ሊኖር ስለሚችል አልተወገደም።
