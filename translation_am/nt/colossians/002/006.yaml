lexical_decisions:
- source_word: Ὡς
  choice: እንደ
  rationale: የእምነት ተቀባይነታቸውንና ቀጣይ ኑሯቸውን የሚያነጻጽረውን ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: οὖν
  choice: እንግዲህ
  rationale: ከቀደመው ሐሳብ የሚወጣውን መደምደሚያና ማሳሰቢያ በተፈጥሯዊ መንገድ ያሳያል።
- source_word: παρελάβετε
  choice: ተቀበላችሁት
  rationale: የቀድሞ ተግባርን ያመለክታል፤ መልእክቱን መቀበልንም ሆነ ኢየሱስን በእምነት መቀበልን ሳይገድብ ይጠብቃል።
- source_word: τὸν Χριστὸν Ἰησοῦν
  choice: መሲሕ ኢየሱስን
  rationale: Χριστόςን እንደ ማዕረግ ‘መሲሕ’ ብሎ ይተረጉማል፤ Ἰησοῦνን ደግሞ እንደ ስም ይጠብቃል።
- source_word: τὸν κύριον
  choice: ጌታ የሆነውን
  rationale: የክርስቶስን የጌትነት ማዕረግ ያስቀምጣል፤ የግሪኩን ተደራራቢ ስያሜ በግልጽ አማርኛ ያቀርባል።
- source_word: ἐν αὐτῷ
  choice: በእርሱ
  rationale: አጭሩን የጳውሎስ የኅብረት አገላለጽ ሳያብራራ ወይም ትርጉሙን ወደ አንድ አቅጣጫ ሳይገድብ ይጠብቃል።
- source_word: περιπατεῖτε
  choice: ተመላለሱ
  rationale: የአሁን ጊዜ ትእዛዙንና የኑሮን አካሄድ የሚያመለክተውን የመራመድ ዘይቤ ይጠብቃል።
theological_decisions:
- issue: በጳውሎስ የማዕረግ ሐረግ ውስጥ Χριστόςን መተርጎም
  choice: መሲሕ ኢየሱስ
  alternative: ክርስቶስ ኢየሱስ
  rationale: በዚህ ሐረግ Χριστός የተቀባውን ንጉሥ የሚያመለክት ማዕረግነቱን ይዞ ስለቀረበ፣ ትርጉሙ ‘መሲሕ’ በዋናው ጽሑፍ ተመርጧል፤ ባህላዊው ቅርጽ በማስታወሻ ተጠብቋል።
- issue: ἐν αὐτῷ የሚለው የጳውሎስ የኅብረት አገላለጽ
  choice: በእርሱ
  alternative: ከእርሱ ጋር በኅብረት
  rationale: የግሪኩ አገላለጽ አጭርና ብዙ የሥነ መለኮት ይዘት ያለው ነው። ‘በእርሱ’ ይህን ስፋትና ውጥረት ይጠብቃል፤ አማራጩ ግን አንድ ትርጓሜ በግልጽ ይጨምራል።
