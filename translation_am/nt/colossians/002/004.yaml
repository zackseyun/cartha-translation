- source_word: ἵνα
  choice: እንዳያታልላችሁ ነው
  rationale: የዓላማ ግንኙነቱን በአማርኛ ተፈጥሯዊ በሆነው ‘እንዳይ… ነው’ አወቃቀር ይገልጣል።
- source_word: μηδεὶς
  choice: ማንም … እንዳይ
  rationale: ከአሉታዊው ግስ ጋር ተጣምሮ ‘ማንም ሰው እንዳይ’ የሚለውን ፍቺ በተፈጥሯዊ አማርኛ ይሰጣል።
- source_word: ὑμᾶς
  choice: -ላችሁ
  rationale: የሁለተኛ መደብ ብዙ ቁጥር ተሳቢነቱን በግሱ ውስጥ በግልጽ ያሳያል።
- source_word: παραλογίζηται
  choice: እንዳያታልላችሁ
  rationale: በውሸተኛ ወይም በተሳሳተ አስተሳሰብ ማሳሳትን የሚያመለክተውን ግስ ግልጽና የተለመደ በሆነ ቃል ያቀርባል።
- source_word: ἐν πιθανολογίᾳ
  choice: በአሳማኝ ንግግር
  rationale: ἐν የመንገድ ወይም የመሣሪያ ሐሳብ እንዳለው በ‘በ-’ ይገለጣል፤ πιθανολογία ደግሞ አሳማኝ ወይም ምክንያታዊ የሚመስል ንግግርን ያመለክታል።
theological_decisions:
- issue: παραλογίζηται ἐν πιθανολογίᾳ የሚያስጠነቅቀው ነገር
  choice: በአሳማኝ ንግግር ከመታለል የተሰጠ አጠቃላይ ማስጠንቀቂያ
  alternative: በተለይ በሐሰተኛ ፍልስፍና ወይም በቃላት ውበት ብቻ ከመታለል የተሰጠ ማስጠንቀቂያ
  rationale: ይህ ቁጥር የተወሰነ የትምህርት ሥርዓት ሳይጠቅስ አሳማኝ በሆነ ንግግር ስለሚመጣ ማታለል ያስጠነቅቃል፤ ትርጉሙ ጽሑፉ ያልወሰነውን የክርክሩን ዓይነት አይወስንም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ይጠቀማል። ‘አሳማኝ ንግግር’ የንግግሩን የማሳመን ኃይል ያሳያል እንጂ እውነተኛ ወይም ትክክለኛ መሆኑን አያረጋግጥም፤ ይህን የቃሉን ክልል የግርጌ ማስታወሻው ያብራራል።
