  text: Θέλω γὰρ ὑμᾶς εἰδέναι ἡλίκον ἀγῶνα ἔχω ⸀ὑπὲρ ὑμῶν καὶ τῶν ἐν Λαοδικείᾳ καὶ ὅσοι οὐχ ἑόρακαν τὸ πρόσωπόν μου ἐν σαρκί,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/001.yaml
  text: For I want you to know how great a struggle I have for you and for those in Laodicea[a], and for all who have not seen my face in the flesh,
translation:
  language: am
  text: ለእናንተ፣ በሎዶቅያ ላሉት፣ እንዲሁም ፊቴን በሥጋ[a] ላላዩት ሁሉ ምን ያህል ታላቅ ትግል እንዳለኝ እንድታውቁ እፈልጋለሁና።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በአካል” ወይም “ፊት ለፊት።” የግሪኩ ቃል በቀጥታ “በሥጋ” ይላል፤ እዚህ ግን አካላዊ መገኘትን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέλω γὰρ ὑμᾶς εἰδέναι
  choice: እንድታውቁ እፈልጋለሁና
  rationale: θέλω እና የተከታዩን የመስተንተኛ ግንባታ በቀጥተኛና ተፈጥሯዊ አማርኛ ያቀርባል፤ γάρ ከቀደመው ሐሳብ ጋር ያለውን ምክንያታዊ ግንኙነት “-ና” ያሳያል።
- source_word: ἡλίκον ἀγῶνα
  choice: ምን ያህል ታላቅ ትግል
  rationale: ἡλίκον የመጠንን ታላቅነት ሲያጎላ፣ ἀγών እዚህ ጠንካራ ጥረትንና ትግልን ያመለክታል።
- source_word: ἔχω ὑπὲρ ὑμῶν
  choice: እናንተን … በመደገፍ … እንዳለኝ
  rationale: ὑπέρ ለአንድ ሰው ጥቅም ወይም ድጋፍ መታገልን ያመለክታል፤ “በመደገፍ” የሚለው ተፈጥሯዊ አማርኛ ሲሆን የግሪኩን ሐሳብ ይጠብቃል።
- source_word: τῶν ἐν Λαοδικείᾳ
  choice: በሎዶቅያም ያሉትን
  rationale: የመስተዋድድ ሐረጉ ሰዎችን በስም የሚወክል ስለሆነ “ያሉትን” ተገቢ ነው።
- source_word: ὅσοι οὐχ ἑόρακαν
  choice: ያላዩትን ሁሉ
  rationale: ὅσοι ያለውን አካታች ኃይል “ሁሉ” በግልጽ ያስተላልፋል።
- source_word: τὸ πρόσωπόν μου
  choice: ፊቴን
  rationale: የግሪኩን ቀጥተኛ ምስል ይጠብቃል፤ በአውዱም በአካል መገናኘትን ያመለክታል።
- source_word: ἐν σαρκί
  choice: በሥጋ
  rationale: σάρξ እዚህ የኃጢአት ባሕርይን ሳይሆን አካላዊ መገኘትን ይገልጣል፤ ቀጥተኛው አገላለጽ ተጠብቋል።
theological_decisions:
- issue: በሞራላዊ ያልሆነ አውድ σάρξን መተርጎም
  choice: በሥጋ
  alternative: በአካል / ፊት ለፊት
  rationale: ሐረጉ የጳውሎስን አካላዊ መገኘት ያመለክታል። “በሥጋ” የምንጩን ቃል በግልጽ ይጠብቃል፤ ትርጉሙም በእግር ማስታወሻ ተብራርቷል።
