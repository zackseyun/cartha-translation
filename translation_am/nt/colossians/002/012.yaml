- issue: የጥምቀት ቃላት ሥነ መለኮታዊ ክብደት
  choice: ከመሲሑ ጋር መቀበርንና መነሣትን ከጥምቀትና ከማመን ጋር በጽሑፉ መሠረት በቅርብ ማያያዝ
