review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains burial and raising with Messiah, baptism as the most natural antecedent of ἐν ᾧ, and resurrection from the dead. However, its placement of “በማመናችሁ” does not clearly express faith directed toward God’s working, and “አሠራር” commonly means a method or procedure rather than God’s effective working.
  naturalness: The proposed revision uses idiomatic modern standard Amharic and makes the relationship between faith and God’s action explicit without adding interpretation.
  terminology: “እምነት” is the established, natural rendering of πίστις here. “የእግዚአብሔር ሥራ” adequately conveys ἐνέργεια in accessible Amharic; “አሠራር” is less suitable in this context.
  issues:
  - severity: medium
    issue: The phrase “በእግዚአብሔር አሠራር በማመናችሁ” can be read as two loosely coordinated means rather than faith in God’s working.
    rationale: διὰ τῆς πίστεως τῆς ἐνεργείας τοῦ θεοῦ presents faith specifically related to God’s effective working. Amharic should mark that relationship explicitly.
  - severity: medium
    issue: “አሠራር” is semantically imprecise for ἐνέργεια.
    rationale: In modern Amharic, አሠራር usually denotes a way, system, or procedure of doing something. The Greek denotes God’s active/effective working.
  - severity: low
    issue: Footnote b’s proposed alternative “በመታመናችሁ” is not a clear or idiomatic lexical alternative for πίστις in this construction.
    rationale: Use “በመተማመን” as the possible ‘through trust’ alternative, while retaining the contextual note that ‘faithfulness’ can occur elsewhere.
  revised_text: በጥምቀት ከእርሱ ጋር ተቀብራችሁ፣[a] በዚያውም እርሱን ከሙታን ባስነሣው በእግዚአብሔር ሥራ ባላችሁ እምነት ከእርሱ ጋር ተነሥታችኋል።[b]
