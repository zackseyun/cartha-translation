  rationale: በδιὰ τῆς πίστεως አገባብ ውስጥ በእግዚአብሔር አሠራር ማመን ዋናው አንብቦት ነው። “መታመን” የቃሉን ግላዊ እምነት/መተማመን ገጽታ ሊያሳይ ስለሚችል በማስታወሻ ቀርቧል።
