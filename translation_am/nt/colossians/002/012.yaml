  text: በጥምቀት ከእርሱ ጋር ተቀብራችሁ፣[a] በዚያውም እርሱን ከሙታን ባስነሣው በእግዚአብሔር ሥራ ባላችሁ እምነት ከእርሱ ጋር ተነሥታችኋል።[b]
  philosophy: optimal-equivalence
  footnotes:
