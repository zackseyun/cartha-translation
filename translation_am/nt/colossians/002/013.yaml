  text: And you[a], being dead in your trespasses and the uncircumcision of your flesh, he made alive together with him, having forgiven us all our trespasses[c][b],
translation:
  language: am
  text: እናንተም በበደሎቻችሁ[a] እና በሥጋችሁ አለመገረዝ[b] ሙታን ሆናችሁ ሳለ፣ ከእርሱ ጋር ሕያዋን አደረጋችሁ፤ በደሎቻችንንም ሁሉ ይቅር ብሎልን።[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «በበደሎቻችሁ» የሚለው «በመተላለፎቻችሁ» ተብሎም ሊተረጎም ይችላል።
