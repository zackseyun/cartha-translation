  terminology: «በደል/በደሎች», «ሥጋ», and «አለመገረዝ» are suitable and do not impose an interpretive rendering such as 'sinful nature.' The pronoun «እርሱ» appropriately preserves the Greek ambiguity while its contextual referent remains clear.
