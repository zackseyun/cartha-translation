    issue: The Greek participle χαρισάμενος is translated by the separate finite clause «ይቅር አለልን።»
    rationale: Although the meaning is substantially present, the syntactic relation to the life-giving action is lost. «ይቅር ብሎልን» keeps the forgiveness closely linked as a dependent/circumstantial completed action in idiomatic Amharic.
  - severity: medium
    issue: Footnote [b] is anchored at the end of the verse rather than at «በሥጋችሁ አለመገረዝ».
    rationale: The cultural note concerns bodily uncircumcision and should be attached directly to that expression. Footnote [c] should remain with the clause where the shift to first-person plural occurs.
