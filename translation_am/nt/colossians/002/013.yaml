  - marker: b
    text: «በሥጋችሁ አለመገረዝ» በቀጥታ የሚያመለክተው በአካል ያልተገረዙ መሆናቸውን ነው፤ በአውዱ ግን መንፈሳዊ አንድምታም አለው።
