    reason: lexical_alternative
lexical_decisions:
- source_word: νεκροὺς ὄντας
  choice: ሙታን ሆናችሁ ሳለ
  rationale: የግሪኩን የሁኔታ አመልካች ተሳቢ አገባብ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ መንፈሳዊ ሞትን በተጨማሪ ቃል አይተረጉምም።
- source_word: ἐν τοῖς παραπτώμασιν
  choice: በበደሎቻችሁ
  rationale: ἐνን በ«በ» ይጠብቃል፤ παράπτωμαንም በዚህ ዐውድ በተለመደውና ግልጽ በሆነ «በደል» ይተረጉማል።
- source_word: ἀκροβυστίᾳ τῆς σαρκὸς ὑμῶν
  choice: በሥጋችሁ አለመገረዝ
  rationale: የአካል አለመገረዝን ቀጥተኛ ትርጉም ይጠብቃል፣ በአውዱ ያለውን መንፈሳዊ ፍንጭም አይሽርም።
- source_word: συνεζωοποίησεν ὑμᾶς σὺν αὐτῷ
  choice: ከእርሱ ጋር ሕያዋን አደረጋችሁ
  rationale: የጋራ ሕያው መደረግንና ከክርስቶስ ጋር ያለውን ተሳትፎ ይጠብቃል፤ የግሪኩን ተውላጠ ስም «እርሱ» እንዳለ ያቆያል።
- source_word: χαρισάμενος ἡμῖν
  choice: ይቅር አለልን
  rationale: χαρίζομαι በዚህ አውድ ያለውን የጸጋ ይቅርታ በተፈጥሯዊ የአማርኛ አገላለጽ ያቀርባል፤ ከ«እናንተ» ወደ «እኛ» የሚደረገውን ለውጥ ይጠብቃል።
- source_word: πάντα τὰ παραπτώματα
  choice: በደሎቻችንን ሁሉ
  rationale: የπάνταን ሙሉነት በ«ሁሉ» ያጎላል፣ παράπτωμαንም ከመጀመሪያው አጠቃቀም ጋር ወጥ አድርጎ ይተረጉማል።
theological_decisions:
- issue: በτῆς σαρκὸς ὑμῶν ውስጥ የσάρξ ትርጉም
  choice: ቀጥተኛውን «ሥጋ» መጠቀም፣ መንፈሳዊ ፍንጩን ግን ክፍት ማድረግ
  alternative: «ኃጢአተኛ ባሕርያችሁ» ብሎ መተርጎም
  rationale: በ2፥11 የመገረዝ አውድ ምክንያት ሐረጉ በቅድሚያ የአካል አለመገረዝን ያመለክታል፤ «ኃጢአተኛ ባሕርይ» ማለት ጽሑፉ በግልጽ ያልወሰነውን ትርጓሜ ያስገባል።
- issue: በσὺν αὐτῷ ውስጥ የαὐτῷ ተጠቃሽ
  choice: ተውላጠ ስሙን «ከእርሱ ጋር» ብሎ ማቆየት፤ በአውዱ ክርስቶስን ያመለክታል
  alternative: በዋናው ጽሑፍ «ከክርስቶስ ጋር» ብሎ ግልጽ ማድረግ
  rationale: ቁጥር 12 ከክርስቶስ ጋር መቀበርንና መነሣትን ስለሚናገር ተጠቃሹ ክርስቶስ ነው፤ ሆኖም የግሪኩን ተውላጠ ስም ማቆየት ከምንጩ ጋር ይቀራረባል።
- issue: ከὑμᾶς ወደἡμῖν የሚደረገው የሰው መደብ ለውጥ
  choice: «እናንተ/አደረጋችሁ» ከዚያም «ይቅር አለልን/በደሎቻችን» ብሎ ለውጡን ማቆየት
  alternative: ሁለቱንም ወደ «እናንተ» ወይም «እኛ» አንድ ማድረግ
  rationale: ግሪኩ ከሁለተኛ መደብ ብዙ ቁጥር ወደ መጀመሪያ መደብ ብዙ ቁጥር በግልጽ ይለወጣል፤ ይህን ማስተካከል የምንጩን ውጥረት ያጠፋል።
