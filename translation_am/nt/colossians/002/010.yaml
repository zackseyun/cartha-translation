  - marker: b
    text: “ራስ” የግሪኩን ዘይቤ ይጠብቃል፤ በዚህ ስፍራ ሐሳቡ ክርስቶስ ከገዥዎችና ከባለሥልጣናት ሁሉ በላይ መሆኑን ነው።
