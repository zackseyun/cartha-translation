translation:
  language: am
  text: እናንተም በእርሱ ተሞልታችኋል፤[a] እርሱም የገዥዎችና የባለሥልጣናት ሁሉ ራስ ነው።[b]
  philosophy: optimal-equivalence
  footnotes:
