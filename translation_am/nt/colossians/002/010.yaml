  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የጳውሎስ ‘በእርሱ’ እና ‘ራስ’ የሚሉት አጭር ሥነ መለኮታዊ አገላለጾች ሳይፈቱ ተጠብቀዋል።
