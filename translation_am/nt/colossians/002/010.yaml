lexical_decisions:
- source_word: καὶ
  choice: እናንተም
  rationale: የግሪኩን አያያዥነት በአማርኛው -ም አማካይነት በተፈጥሯዊ ሁኔታ ጠብቋል፤ ንባቡንም ከቀደመው ሐሳብ ጋር ያያይዛል።
- source_word: ἐστὲ ... πεπληρωμένοι
  choice: ሙሉ ሆናችኋል
  rationale: የተፈጸመ ድርጊት ያስገኘውን አሁናዊ ሁኔታ ይገልጣል፤ የ‘ሙላት’ን ምስል ከቁጥር 9 ጋር ይጠብቃል። የግሪኩ ተደራጊ ቅርጽ በአማርኛ ቃል በቃል ሲተረጎም የማይፈጥረውን ተፈጥሯዊነት ለማስጠበቅ ውጤታዊ ሁኔታው ተገልጧል።
- source_word: ἐν αὐτῷ
  choice: በእርሱ
  rationale: ከክርስቶስ ጋር ያለውን ኅብረትና በእርሱ ውስጥ የመሆንን አጭር የጳውሎስ አገላለጽ ሳይፈታ ይጠብቃል።
- source_word: ὅς ἐστιν
  choice: እርሱም ... ነው
  rationale: ተውላጠ ስሙ ወደ ክርስቶስ እንደሚመለስ በግልጽና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἡ κεφαλὴ
  choice: ራስ
  rationale: የግሪኩን ዘይቤ በቀጥታ ጠብቋል፤ ‘ገዥ’ ብሎ በመተርጎም ዘይቤውን በዋናው ጽሑፍ ውስጥ አይፈታውም።
- source_word: πάσης ἀρχῆς καὶ ἐξουσίας
  choice: የገዥዎችና የባለሥልጣናት ሁሉ
  rationale: በዚህ ዐውድ ἀρχή እና ἐξουσία የሚያመለክቱትን ገዥ ኃይሎች በዘመናዊና በቀላሉ በሚገባ ቋንቋ ያቀርባል፤ ‘ሁሉ’ የπάσηςን አጠቃላይነት ይጠብቃል።
theological_decisions:
- issue: አማኞች በክርስቶስ ሙሉ መሆናቸው
  choice: በክርስቶስ ሙሉ የሆኑበትን አሁናዊ ሁኔታ የሚገልጽ ንባብ
  alternative: ለድነት ምንም እንደማይጎድላቸው ‘ፍጹማን’ ናችሁ ማለት፣ ወይም በመለኮታዊ ሙላት ተሞልታችኋል ብሎ በግልጽ መፍታት
  rationale: ‘ሙሉ ሆናችኋል’ የሙላትን ጭብጥና በክርስቶስ ያለውን በቂነት ይጠብቃል፤ ነገር ግን ኃጢአት ሙሉ በሙሉ ስለመጥፋቱ ወይም ስለ አንድ የተወሰነ የድነት ሥርዓት አይወስንም።
- issue: ክርስቶስ የሥልጣናት ‘ራስ’ መሆኑ
  choice: የ‘ራስ’ን ዘይቤ በጽሑፉ ማቆየት፣ በዐውዱም ከሁሉ በላይ ያለውን ልዕልና ማመልከት
  alternative: ‘የሁሉ ምንጭ’ ወይም ‘የሁሉ ገዥ’ ብሎ ዘይቤውን በዋናው ጽሑፍ መፍታት
  rationale: በቆላስይስ ዐውድ የክርስቶስ በዓለማዊና መንፈሳዊ ኃይሎች ላይ ያለው ልዕልና ዋና ነው፤ ሆኖም የግሪኩ ዘይቤ በዋናው ጽሑፍ ተጠብቋል።
