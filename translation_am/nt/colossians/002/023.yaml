  choice: ጥበብ ያላቸው ይመስላሉ
  rationale: አገላለጹ እውነተኛ ጥበብን ሳይሆን የጥበብን መልክ ወይም ዝና ያመለክታል፤ μέν ያለውንም የመቀበልና ከዚያ የማነጻጸር ኃይል ይጠብቃል።
