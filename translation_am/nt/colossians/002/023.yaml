  rationale: የግሪኩ አገባብ እጅግ የታመቀና አከራካሪ ነው። ዋናው ትርጉም ጳውሎስ ጥበብ የሚመስሉትን የባሕታዊነት ደንቦች እየነቀፈ እንደሆነና ሥጋዊ ምኞትን ለመግታት ኃይል እንደሌላቸው የሚያሳየውን የአውዱን ፍሰት ይከተላል። ሌሎቹ እውነተኛ አማራጮች በማስታወሻ ተጠብቀዋል።
- issue: σάρξ በዚህ አውድ ያለው ትርጉም
  choice: ሥጋ
  alternative: የወደቀው የሰው ምኞት / ኃጢአተኛ ዝንባሌ
  rationale: “ሥጋ” የሚለው ቀጥተኛ ቃል የጳውሎስን ባለብዙ ገጽታ አጠቃቀም ይጠብቃል፤ አውዱ ግን ቃሉ ከወደቁ የሰው ፍላጎቶች ጋር እንደሚያያዝ ያሳያል።
