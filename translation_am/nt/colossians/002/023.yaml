  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። “ትሕትና” እና “ሥጋ” የሚሉት የተለመዱ መጽሐፍ ቅዱሳዊ ቃላት ተጠብቀዋል፤ አስቸጋሪው የመጨረሻ ሐረግ በዋናው ጽሑፍ ተፈጥሯዊ ሆኖ ቀርቦ እውነተኛ አማራጮቹ በማስታወሻ ተገልጸዋል።
