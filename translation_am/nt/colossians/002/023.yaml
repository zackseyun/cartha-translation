- source_word: ταπεινοφροσύνῃ
  choice: በትሕትና
  rationale: መደበኛውን የቃሉን ትርጉም ይጠብቃል፤ በዚህ አውድ ያለውን የይስሙላ ወይም የባሕታዊነት ገጽታ አውዱ እንዲያሳይ ይተዋል።
- source_word: ἀφειδίᾳ σώματος
  choice: ሰውነትን በጭካኔ በመያዝ
