  yaml_path: translation/nt/colossians/002/022.yaml
  text: These all perish with use[c][b][a], according to the commandments and teachings of men.
translation:
  language: am
  text: እነዚህ ሁሉ በመጠቀም የሚያልቁ ናቸው[a]፤ እነዚህ ክልከላዎችም በሰዎች ትእዛዛትና ትምህርቶች መሠረት ናቸው[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እነዚህ ሁሉ ጥቅም ላይ ሲውሉ የሚጠፉ ናቸው።» የግሪኩ አገላለጽ እነዚህ ነገሮች ጊዜያዊና በአጠቃቀም የሚያልቁ መሆናቸውን ያጎላል።
    reason: lexical_alternative
  - marker: b
    text: «የሰዎች ትእዛዛትና ትምህርቶች» የሚለው አገላለጽ ኢሳይያስ 29፥13ን የሚያስተጋባ ሳይሆን አይቀርም፤ ክልከላዎቹ ሰዋዊ ምንጭ እንዳላቸው ያጎላል።
    reason: cross_reference
lexical_decisions:
- source_word: ἅ ἐστιν πάντα
  choice: እነዚህ ሁሉ … ናቸው
  rationale: ገለልተኛ ብዙ ቁጥር ያለው አንጻራዊ ተውላጠ ስም በቀደመው ቁጥር የተጠቀሱትን የተከለከሉ ነገሮች ያመለክታል፤ ይህ አተረጓጎም በአማርኛ ተፈጥሯዊ ነው።
- source_word: εἰς φθορὰν τῇ ἀποχρήσει
  choice: ጥቅም ላይ ሲውሉ የሚጠፉ
  rationale: φθορά ጥፋትን ወይም መበላሸትን፣ ἀπόχρησις ደግሞ በመጠቀም ማለቅን ያመለክታል። ሐረጉ እነዚህ ነገሮች በአጠቃቀም ሂደት እንደሚያልቁ በግልጽ ያሳያል።
- source_word: κατὰ
  choice: መሠረት
  rationale: ደንቦቹ የሚከተሉትን መለኪያ ወይም ምንጭ ያሳያል።
- source_word: ἐντάλματα καὶ διδασκαλίας
  choice: ትእዛዛትና ትምህርቶች
  rationale: ሁለቱንም የግሪክ ስሞች ሳያዋህድ መደበኛውን የደንብና የማስተማር ልዩነት ይጠብቃል።
- source_word: τῶν ἀνθρώπων
  choice: የሰዎች
  rationale: ἀνθρώπων በዚህ አውድ ሰውን በአጠቃላይ ይጠቅሳል፤ «ሰዎች» የሰዋዊውን ምንጭ ከእግዚአብሔር ትእዛዝ ጋር ሳያደበዝዝ በተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: አንቀጹ በነገሮቹ ጊዜያዊነት ላይ ነው ወይስ በደንቦቹ ሰዋዊ ምንጭ ላይ?
  choice: ነገሮቹ በአጠቃቀም እንደሚጠፉና ደንቦቹም ከሰው ትእዛዝና ትምህርት እንደመጡ ሁለቱንም ያሳያል።
  alternative: አንቀጹን ደንቦቹ ራሳቸው እንደሚጠፉ አድርጎ ማንበብ።
  rationale: ἅ በቀደመው ቁጥር ያሉትን የክልከላ ዕቃዎች በቀጥታ ያመለክታል፤ κατὰ የሚጀምረው ሐረግ ደግሞ ክልከላዎቹን ሰዋዊ ትእዛዛትና ትምህርቶች ብሎ ይገልጻል። ትርጉሙ የጳውሎስን ነቀፋ ያቀርባል እንጂ አጽንዖቱን በአንዱ ብቻ ላይ አያስገድድም።
- issue: «የሰዎች» የሚለው ሐረግ የፆታ ወይም የምንጭ ማመልከቻ ነው?
  choice: የሰው ልጆችን በአጠቃላይ የሚጠቅስና የደንቦቹን ሰዋዊ ምንጭ የሚያጎላ ነው።
  alternative: «የወንዶች» ብሎ ለወንድ ፆታ ብቻ ማድረግ።
  rationale: ἄνθρωπος በዚህ የብዙ ቁጥር አገባብ ሰዎችን በአጠቃላይ ይጠቅሳል፤ ንጽጽሩም በሰውና በእግዚአብሔር ምንጭ መካከል ነው።
