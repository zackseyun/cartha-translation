  source_fidelity: The first clause accurately identifies the things referred to in the preceding prohibitions as perishable through use. However, the Greek κατὰ-clause characterizes the preceding prohibitive regulations as being in accordance with human commands and teachings; the draft's added predicate “were given” is more specific than the source states.
