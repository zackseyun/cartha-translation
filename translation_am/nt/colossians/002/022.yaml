  terminology: «ትእዛዛትና ትምህርቶች የሰዎች» is faithful and idiomatic for ἐντάλματα καὶ διδασκαλίας τῶν ἀνθρώπων. «በመጠቀም የሚያልቁ» clearly conveys destruction/consumption through use.
  issues:
  - severity: medium
    issue: The main text adds «የተሰጡ ናቸው» ('were given') to the second clause.
    rationale: The Greek says only that the prohibitions are 'according to' human commandments and teachings. It does not state the act of giving them. The addition is plausible but unnecessarily narrows the expression.
  - severity: low
    issue: The conjunction of the second clause can more directly identify its referent as the preceding prohibitions.
    rationale: Greek leaves the relevant regulations implicit from verse 21. In Amharic, «እነዚህ ክልከላዎች» makes that connection clear without introducing a new theological claim.
