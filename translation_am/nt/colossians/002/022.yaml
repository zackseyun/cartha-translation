  register: ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ደንቦቹም» የሚለው በግሪክ የተተወውን ከቀደመው ቁጥር የሚገባውን ሐሳብ በአማርኛ ግልጽ ለማድረግ ተጨምሯል።
