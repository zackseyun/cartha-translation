base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/007.yaml
  text: having been rooted and being built up in him[a], and being established in the faith just as you were taught, overflowing with thanksgiving.
translation:
  language: am
  text: በእርሱ ሥር ሰድዳችሁና እየታነጻችሁ፣ እንደተማራችሁት በእምነት[a] እየጸናችሁ፣ በምስጋናም እየተትረፈረፋችሁ ኑሩ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “በእምነቱ”፤ እንዲሁም “በታማኝነት” ሊተረጎም ይችላል። የግሪኩ ቃል πίστις (ፒስቲስ) “እምነት፣” “መታመን፣” ወይም “ታማኝነት” የሚሉ ፍቺዎችን ሊይዝ ይችላል፤ በዚህ ዐውድ ግን የተማሩትን እምነት ወይም የእምነት መልእክት የሚያመለክት መሆኑ ይበልጥ ይታያል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρριζωμένοι
  choice: ሥር ሰዳችሁ
  rationale: የግሪኩ ፍጹም ተሳቢ አንቀጽ ቀድሞ የተፈጸመና ውጤቱ የቀጠለ ድርጊትን ያሳያል። “ሥር ሰዳችሁ” የእፅዋትን ምሳሌ በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐποικοδομούμενοι
  choice: እየታነጻችሁ
  rationale: የአሁን ጊዜ ተሳቢ አንቀጹ ቀጣይ ሂደትን ያሳያል፤ ምርጫውም የሕንፃ ግንባታን ምሳሌ ይጠብቃል።
- source_word: ἐν αὐτῷ
  choice: በእርሱ
  rationale: ተውላጠ ስሙ በቅርብ ዐውድ ወደ ክርስቶስ ይመለሳል፤ ምንጩ ስምን ወይም ማዕረግን ሳይደግም ተውላጠ ስም ስለተጠቀመ “በእርሱ” ተጠብቋል።
- source_word: βεβαιούμενοι
  choice: እየጸናችሁ
  rationale: በዐውዱ የመረጋጋትንና ጽኑ የመሆንን ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τῇ πίστει
  choice: በእምነቱ
  rationale: መስተዋድዱና የተወሰነው አመልካች በዐውዱ የተማሩትን እምነት ወይም የእምነት መልእክት ሊያመለክቱ ይችላሉ። የግል መታመንና ታማኝነት የሚሉት አማራጮች በማስታወሻ ተጠብቀዋል።
- source_word: καθὼς ἐδιδάχθητε
  choice: እንደተማራችሁት
  rationale: καθώς ያለውን የንጽጽር ኃይልና የቀድሞውን ትምህርት ግንኙነት በአጭርና ተፈጥሯዊ መንገድ ያሳያል።
- source_word: περισσεύοντες
  choice: እየተትረፈረፋችሁ
  rationale: ቃሉ የብዛትና የመትረፍረፍ ምስል ይዟል፤ የአሁን ጊዜ ተሳቢ አንቀጹም ቀጣይነቱን ያሳያል።
- source_word: ἐν εὐχαριστίᾳ
  choice: በምስጋና
  rationale: “ምስጋና” የεὐχαριστίαን ትርጉም የሚጠብቅና በዘመናዊ አማርኛ ተፈጥሯዊ የሆነ ምርጫ ነው።
theological_decisions:
- issue: የτῇ πίστει ትርጉም
  choice: “እምነቱ”፤ ቆላስይስ ሰዎች የተማሩት የክርስቲያን እምነት ወይም መልእክት
  alternative: የግል መታመን (“በእምነት”) ወይም “ታማኝነት”
  rationale: በπίστις ላይ ያለው የተወሰነ አመልካችና ቀጥሎ ያለው “እንደተማራችሁት” የሚለው ሐረግ፣ ከውስጣዊ የመታመን ድርጊት ይልቅ የተማሩትን እምነት ወይም መልእክት እንደሚያመለክት ያጠናክራሉ። ሆኖም የቃሉ ሌሎች እውነተኛ ፍቺዎች በማስታወሻ ቀርበዋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የእፅዋት፣ የግንባታና የመትረፍረፍ ምሳሌዎች ተጠብቀዋል። በቁጥር 6 ያለውን ዋና ትእዛዝ በአማርኛ ለማሟላት “ኑሩ” በመጨረሻ ቀርቧል።
