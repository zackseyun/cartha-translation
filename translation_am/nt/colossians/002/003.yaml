  text: in whom are hidden all the treasures of wisdom and knowledge[a][b].
translation:
  language: am
  text: በእርሱም የጥበብና የእውቀት መዝገቦች ሁሉ ተሰውረው ይገኛሉ[a][b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ አንጻራዊው ተውላጠ ስም ክርስቶስን በግል ሳይሆን የእግዚአብሔርን ምስጢር በሰፊው የሚያመለክት ከሆነ፣ «በዚያ»።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ «ተከማችተው»፤ የግሪኩ ገላጭ ቃል የተሰወረ ወይም ለጥበቃ የተቀመጠ የሚል ሐሳብ ሊያመለክት ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: በእርሱም ውስጥ
  rationale: አንጻራዊው ተውላጠ ስም በቅርቡ የተጠቀሰውን ግላዊ ባለቤት፣ ክርስቶስን፣ የሚያመለክት መሆኑ ተፈጥሯዊ ነው፤ በተመሳሳይም የἐνን የስፍራ ኃይል ይጠብቃል።
- source_word: πάντες οἱ θησαυροὶ
  choice: ሀብቶች ሁሉ
  rationale: የብዙ ቁጥር ስምና መስተዋድዱ የሚሰጡትን የተወሰነና ሁሉን አቀፍ ስብስብ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τῆς σοφίας καὶ γνώσεως
  choice: የጥበብና የእውቀት
  rationale: ሁለቱን የተዛመዱ ነገር ግን የተለያዩ ጽንሰ ሐሳቦች ሳያዋህድ ቀጥተኛና የተለመደ አገላለጽ ይሰጣል።
- source_word: ἀπόκρυφοι
  choice: ተሰውረው
  rationale: ቃሉ የሚገልጸውን መሰወር በግልጽ ሁኔታ ያስተላልፋል፤ ሀብቶቹ ፈጽሞ የማይደረስባቸው ወይም ለወደፊት ብቻ የተጠበቁ ናቸው ብሎ አይወስንም።
- source_word: εἰσιν ... ἀπόκρυφοι
  choice: ተሰውረው ይገኛሉ
  rationale: የግሪኩን አያያዥ ግስና ገላጭ ቅጽ በተፈጥሯዊ ዘመናዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: ἀπόκρυφοι ምስጢራዊ መደበቅን ወይስ በክርስቶስ ውስጥ በደኅንነት መከማቸትን ያመለክት እንደሆነ
  choice: ትርጉሙን «ተሰውረው» በሚለው ገለልተኛ አገላለጽ ማቅረብ
  alternative: «ተከማችተው» በማለት መጠበቃቸውን ማጉላት፣ ወይም «ምስጢር ሆነው» በማለት ከሌሎች መደበቃቸውን ማጉላት
  rationale: የግሪኩ ቅጽ መሰወርንና በመጠባበቂያ መኖርን ሊያመለክት ስለሚችል፣ ጥቅሱ ራሱ ያልወሰነውን ሥነ መለኮታዊ ክርክር ትርጉሙ አይወስንም።
- issue: ἐν ᾧ ክርስቶስን በግል ወይስ የእግዚአብሔርን ምስጢር በሰፊው ያመለክት እንደሆነ
  choice: «በእርሱም ውስጥ» በማለት በቅርቡ የተጠቀሰውን ክርስቶስን ማመልከት
  alternative: «በዚያም ውስጥ» በማለት ቀዳሚውን ምስጢር በሰፊው ማመልከት
  rationale: ቅርብ ባለቤቱ ግላዊ የሆነው ክርስቶስ በመሆኑ ይህ ንባብ ተፈጥሯዊ ነው፤ ሰፊው ሰዋሰዋዊ አማራጭ ግን በማስታወሻ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። «ሀብቶች ሁሉ» የግሪኩን ሁሉን አቀፍ አጽንዖት ይጠብቃል፤ «ተሰውረው ይገኛሉ» ደግሞ ግልጽና ተፈጥሯዊ ሲሆን የቃሉን አሻሚነት አያጠፋም።
