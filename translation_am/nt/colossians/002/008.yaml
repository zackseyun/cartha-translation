  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Βλέπετε μή τις ὑμᾶς ἔσται ὁ συλαγωγῶν διὰ τῆς φιλοσοφίας καὶ κενῆς ἀπάτης κατὰ τὴν παράδοσιν τῶν ἀνθρώπων, κατὰ τὰ στοιχεῖα τοῦ κόσμου καὶ οὐ κατὰ Χριστόν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/008.yaml
  text: See to it that no one takes you captive through philosophy and empty deceit[a], according to human tradition, according to the elemental principles of the world[b], and not according to Messiah.
translation:
  language: am
  text: ማንም በሰው ወግና በዓለም መሠረታዊ ሥርዓቶች[a] መሠረት እንጂ በመሲሑ መሠረት ባልሆነ ፍልስፍናና ባዶ ማታለያ እንደ ምርኮ እንዳይወስዳችሁ ተጠንቀቁ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የዓለም መሠረታዊ መንፈሳዊ ኃይሎች።” የግሪኩ ሐረግ መሠረታዊ ሥርዓቶችን ወይም የዓለምን መንፈሳዊ ኃይሎች ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: Βλέπετε μή τις
  choice: ማንም … እንዳይ… ተጠንቀቁ
  rationale: የብዙ ቁጥር ትእዛዛዊ ማስጠንቀቂያውን በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἔσται ὁ συλαγωγῶν
  choice: እንደ ምርኮ ወስዶ እንዳይገዛችሁ
  rationale: συλαγωγέω የሚያመለክተውን ሰውን እንደ ዘረፋ ምርኮ ወስዶ በቁጥጥር ሥር የማዋል ምሳሌ ይጠብቃል።
- source_word: διὰ τῆς φιλοσοφίας καὶ κενῆς ἀπάτης
  choice: በ… ፍልስፍናና ባዶ ማታለያ
  rationale: διά የመሣሪያነትን ሐሳብ ያሳያል፤ ሁለቱን የተያያዙ ስሞችም ሳያዋህድ ይጠብቃል።
- source_word: κατὰ τὴν παράδοσιν τῶν ἀνθρώπων
  choice: በሰው ወግ … መሠረት
  rationale: παράδοσιςን በተፈጥሯዊው ‘ወግ’፣ κατάንም እንደ መለኪያ ወይም ደንብ ‘በ…መሠረት’ ብሎ ይተረጉማል፤ ‘ሰው’ ሁሉን አቀፍ ነው።
- source_word: κατὰ τὰ στοιχεῖα τοῦ κόσμου
  choice: በዓለም መሠረታዊ ሥርዓቶች መሠረት
  rationale: στοιχεῖα መሠረታዊ ነገሮችን፣ ሥርዓቶችን ወይም መንፈሳዊ ኃይሎችን ሊያመለክት የሚችለውን አሻሚነት በዋናው ጽሑፍ በተቻለ መጠን ይጠብቃል።
- source_word: οὐ κατὰ Χριστόν
  choice: በመሲሑ መሠረት ባልሆነ
  rationale: Χριστόςን እንደ ማዕረግ ‘መሲሑ’ ብሎ ያቀርባል፤ κατά ከቀደሙት መለኪያዎች ጋር ያለውን ንጽጽር ይጠብቃል።
theological_decisions:
- issue: የστοιχεῖα τοῦ κόσμου ትርጉም
  choice: የዓለም መሠረታዊ ሥርዓቶች
  alternative: የዓለም መሠረታዊ መንፈሳዊ ኃይሎች
  rationale: የግሪኩ ሐረግ መሠረታዊ ደንቦችን/ሥርዓቶችን ወይም የኮስሞስ መንፈሳዊ ኃይሎችን ሊያመለክት ይችላል። ዋናው ንባብ ትርጉሙን ሙሉ በሙሉ አይወስንም፤ ጠቃሚው አማራጭ በማስታወሻ ተጠብቋል።
- issue: የΧριστός አቀራረብ
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: በዚህ ንጽጽር ውስጥ Χριστός የተቀባውን ንጉሥ የሚያመለክት ማዕረግ ሆኖ ጎልቶ ይታያል፤ ‘መሲሑ’ ይህን የማዕረግ ኃይል ግልጽ ያደርጋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። ‘ፍልስፍና’ የተለመደ የብድር ቃል ስለሆነ ተጠብቋል፤ የምርኮውም ምሳሌ በግልጽ አገላለጽ ቀርቧል።
