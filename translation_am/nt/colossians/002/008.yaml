review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the imperative warning, the means (‘through philosophy and empty deceit’), the two κατά standards, and the Messiah title. However, ‘እንዳይገዛችሁ’ adds the distinct idea of ruling/controlling, which is not expressed by συλαγωγέω; the verb’s plunder/captive metaphor should stand without that addition.
  naturalness: The register is appropriate modern standard Amharic. Replacing the compound ‘ወስዶ እንዳይገዛችሁ’ with a single finite expression is clearer and more idiomatic while retaining the warning’s force.
  terminology: ‘ፍልስፍና,’ ‘ባዶ ማታለያ,’ ‘ወግ,’ and ‘መሲሑ’ are suitable. ‘መሠረታዊ ሥርዓቶች’ is a reasonable main-text rendering of στοιχεῖα, and the footnote appropriately preserves the significant cosmic-powers reading.
  issues:
  - severity: medium
    issue: ‘እንዳይገዛችሁ’ adds an unsupported action.
    rationale: συλαγωγέω means to carry off as spoil or take captive. It does not separately state that the captor will rule over the readers. ‘እንደ ምርኮ እንዳይወስዳችሁ’ conveys the source metaphor without expansion.
  revised_text: ማንም በሰው ወግና በዓለም መሠረታዊ ሥርዓቶች[a] መሠረት እንጂ በመሲሑ መሠረት ባልሆነ ፍልስፍናና ባዶ ማታለያ እንደ ምርኮ እንዳይወስዳችሁ ተጠንቀቁ።
