id: COL.2.15
reference: Colossians 2:15
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ἀπεκδυσάμενος τὰς ἀρχὰς καὶ τὰς ἐξουσίας ἐδειγμάτισεν ἐν παρρησίᾳ, θριαμβεύσας αὐτοὺς ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/015.yaml
  text: Having disarmed the rulers and the authorities, he made a public spectacle of them, triumphing over them in him.
translation:
  language: am
  text: ገዢዎችንና ሥልጣናትን ትጥቅ አስፈትቶ፣ በይፋ አሳያቸው፤ በእርሱም በድል ሰልፍ አሳለፋቸው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκδυσάμενος
  choice: የጦር መሣሪያቸውን ገፍፎ
  rationale: የግሪኩን ‘ገፍፎ/አራግፎ’ ምስል ጠብቆ፣ በዚህ አውድ ያለውን ‘ትጥቅ ማስፈታት’ ትርጉም በተፈጥሯዊ አማርኛ ያቀርባል።
- source_word: τὰς ἀρχὰς καὶ τὰς ἐξουσίας
  choice: ገዢዎችንና ሥልጣናትን
  rationale: የሁለቱን የሥልጣን ቃላት ልዩነት ይጠብቃል፤ አውዱ ከሰው በላይ የሆኑ ኃይላትን ሊያመለክት ቢችልም ይህን በገላጭ ቃል አይወስንም።
- source_word: ἐδειγμάτισεν ἐν παρρησίᾳ
  choice: በይፋ ለዕይታ አቀረባቸው
  rationale: የሕዝብ ፊት መጋለጥንና ግልጽ መታየትን በዘመናዊና ክቡር አማርኛ ያሳያል።
- source_word: θριαμβεύσας αὐτοὺς
  choice: በድል ሰልፍ መራቸው
  rationale: ግሱ ከጥንታዊ የድል ሰልፍ ምስል ጋር ያለውን አድራጊ ትርጉም ይጠብቃል።
- source_word: ἐν αὐτῷ
  choice: በእርሱም
  rationale: የወንድ ጾታ ተውላጠ ስምን ‘በእርሱ’ ብሎ በመመለስ፣ የቀረበውን ‘in him’ ንባብ ይከተላል።
theological_decisions:
- issue: የድርጊቱ አድራጊ
  choice: በአማርኛው ግስ ውስጥ እንደ ተሰወረ ሦስተኛ መደብ ወንድ ነጠላ ቀርቧል
  alternative: ‘እግዚአብሔር’ ወይም ‘ክርስቶስ’ ብሎ በግልጽ መጨመር
  rationale: የግሪኩ ጥቅስ ስሙን በዚህ ሐረግ አይደግምም፤ በአውዱ የሚወሰነውን አድራጊ በትርጉም በግድ አልተወሰነም።
- issue: ἐν αὐτῷ የሚያመለክተው
  choice: ‘በእርሱ’ ተብሎ እንደ ሰው አመልካች ተተርጉሟል
  alternative: ‘በእርሱ/በመስቀሉ’ ወይም ‘በዚያ’ ብሎ መተርጎም
  rationale: የቀረበው የጽሑፍ ውሳኔ ‘in him’ የሚለውን ንባብ ይደግፋል፤ መስቀልን በግልጽ መጨመር በዚህ ጥቅስ ውስጥ የሌለ ማብራሪያ ይሆናል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለአጠቃላይ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘በድል ሰልፍ መራቸው’ የግሪኩን ታሪካዊ ምስል ከ‘ድል አደረገባቸው’ ይልቅ በቅርብ ይጠብቃል።
