  text: በትእዛዛት[b] የተጻፈውንና በእኛ ላይ የነበረውን የዕዳ ሰነድ[a] ደምስሶ፣ ለእኛ ተቃራኒ የነበረውን ይህንኑ በመስቀሉ ላይ ቸንክሮ ከመካከል አስወግዶታል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የዕዳ ማረጋገጫ” ወይም “የተጻፈ መዝገብ።” የግሪኩ ቃል በእጅ የተጻፈ የዕዳ ማስረጃን ወይም ሕጋዊ ግዴታን ሊያመለክት ይችላል።
