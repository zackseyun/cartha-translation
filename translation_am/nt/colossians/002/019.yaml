  rationale: የአካልን ዘይቤ በቀጥታ ይጠብቃል፤ በአውዱ የሚያመለክተው ክርስቶስን ነው።
- source_word: ἐξ οὗ
  choice: ከእርሱ የተነሣ
  rationale: የዝምድና ተውላጠ ስሙ ወደ ‘ራስ’ ይመለሳል፤ ሐረጉም ምንጩን በግልጽ ያሳያል።
- source_word: πᾶν τὸ σῶμα
  choice: መላው አካል
