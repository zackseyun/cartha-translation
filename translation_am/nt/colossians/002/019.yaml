  yaml_path: translation/nt/colossians/002/019.yaml
  text: and not holding fast to the Head[a], from whom the whole body, being supplied and held together through the joints and ligaments[c][b], grows with the growth of God.
translation:
  language: am
  text: ራሱን[a] አጥብቆ ሳይዝ፣ ከእርሱ የተነሣ መላው አካል በመገጣጠሚያዎችና በጅማቶች አቅርቦት እየተሰጠውና አንድ ላይ እየተያያዘ[b]፣ ከእግዚአብሔር በሚመጣ ዕድገት ያድጋል።[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከራሱ ጋር አጥብቆ ተጣብቆ ሳይኖር።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “በመገጣጠሚያዎችና በጅማቶች እየተመገበና አንድ ላይ እየተሳሰረ።”
    reason: lexical_alternative
  - marker: c
    text: ቃል በቃል፣ “የእግዚአብሔርን ዕድገት ያድጋል።” ሐረጉ ምናልባት ከእግዚአብሔር የሚመጣውን ዕድገት ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: κρατῶν
  choice: አጥብቆ አይጣበቅም
