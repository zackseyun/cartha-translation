  rationale: አውዱ መላው አካል ከራስ ሕይወትና አቅርቦት እንደሚቀበል ያሳያል። የምንጭ ትርጉሙ ጠንካራ ቢሆንም የግሪኩ አጭር ሐረግ ሌሎች ሰዋሰዋዊ ጥላዎችን ሊፈቅድ ስለሚችል ቀጥተኛው ቅርጽ በግርጌ ማስታወሻ ተጠብቋል።
