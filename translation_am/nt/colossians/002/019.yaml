- source_word: ἁφῶν
  choice: መገጣጠሚያዎች
  rationale: በአካላዊው ዘይቤ የመገናኛ ክፍሎችን ለማመልከት ግልጽና ዘመናዊ ቃል ነው።
- source_word: συνδέσμων
  choice: ጅማቶች
  rationale: ክፍሎችን የሚያስተሳስሩ የአካል ክፍሎችን የሚያመለክት ተፈጥሯዊ የአማርኛ ቃል ነው።
- source_word: ἐπιχορηγούμενον
  choice: እየተደገፈ
  rationale: ለአካሉ የሚያስፈልገው አቅርቦትና ድጋፍ እየተሰጠው መሆኑን ያሳያል፤ ትርጉሙን ወደ ምግብ ብቻ አያጠብብም።
- source_word: συμβιβαζόμενον
