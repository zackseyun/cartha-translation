  text: “Do not handle[a], nor taste, nor touch,”
translation:
  language: am
  text: “አትያዝ[a]፣ አትቅመስ፣ አትንካ።”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አትንካ፣ አትቅመስ፣ አትንካ።” የመጀመሪያው ግስ (ἅψῃ) ‘አትንካ’ ወይም ‘አትያዝ’ ተብሎ ሊተረጎም ይችላል፤ እዚህ ግን በኋላ ካለው θίγῃς (‘አትንካ’) ለመለየት ‘አትያዝ’ ተብሏል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ
  choice: አት-
  rationale: μή ከአኦሪስት ሰብጃንክቲቭ ጋር ክልከላን ይገልጣል፤ በአማርኛ ተከታታይ ነጠላ ትእዛዛዊ ክልከላዎችን ‘አት-’ በሚለው ቅጥ መተርጎም ተፈጥሯዊ ነው።
- source_word: ἅψῃ
  choice: አትያዝ
  rationale: ἅπτω በመካከለኛ ቅርጹ ‘መንካት’ ወይም ‘መያዝ’ ሊሆን ይችላል። በኋላ ያለው θίγῃς ‘አትንካ’ ተብሎ ስለተተረጎመ፣ የሁለቱን ግሶች ልዩነት ለማቆየት ‘አትያዝ’ ተመርጧል።
- source_word: μηδὲ
  choice: ፣
  rationale: ተደጋጋሚው μηδέ ክልከላዎቹን ያያይዛል። በተፈጥሯዊ አማርኛ የ‘አት-’ ክልከላ መደጋገምና ሥርዓተ ነጥብ የመደመሩን ኃይል በበቂ ሁኔታ ያሳያሉ።
- source_word: γεύσῃ
  choice: አትቅመስ
  rationale: γεύομαι በቀጥታ ‘መቅመስ’ ማለት ነው፤ ይህም የቃሉን መሠረታዊ ትርጉምና የክልከላዎቹን አውድ ይጠብቃል።
- source_word: θίγῃς
  choice: አትንካ
  rationale: θιγγάνω በተለምዶ ‘መንካት’ ማለት ነው፤ ‘አትንካ’ ግልጽና ዘመናዊ አማርኛ ሲሆን ከመጀመሪያው ግስ ‘አትያዝ’ ጋር ያለውን ልዩነት ያቆያል።
theological_decisions:
- issue: በአውዱ ውስጥ የክልከላዎቹ ባሕርይ
  choice: ምንም የትርጓሜ ማብራሪያ ሳይጨመር እንደ ተጠቀሰ አጭር ተከታታይ ደንቦች ተተርጉሟል።
  alternative: ‘ይህን አትያዝ፣ ያንን አትቅመስ፣ አትንካ’ ብሎ ማስፋት ወይም ከሰዎች ደንቦች ጋር በግልጽ በተዘዋዋሪ ንግግር ማያያዝ።
  rationale: የግሪኩ ጽሑፍ በዚህ ቁጥር አጭር ሲሆን ክልከላዎቹን ብቻ ይዟል። ስለዚህ ከአካባቢው አውድ የተወሰደ ማብራሪያ ሳይጨመር ድንገተኛነቱ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የግሪኩ አጭርና ምት ያለው ሦስትዮሽ ክልከላ በሦስት ተከታታይ ‘አት-’ ቅርጾች ተጠብቋል።
