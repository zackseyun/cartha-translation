  text: These are a shadow of the things to come[b][a], but the body is Messiah's.
translation:
  language: am
  text: እነዚህ ሊመጡ ያሉት ነገሮች ጥላ ናቸው፤ አካሉ[a] ግን የመሲሑ ነው።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «አካል» የሚለው ቃል ከ«ጥላ» ጋር ባለው ንጽጽር «ተጨባጩ እውነታ» የሚል ሐሳብ ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «ተጨባጩ እውነታ ግን የመሲሑ ነው።»
    reason: previous_rendering
lexical_decisions:
- source_word: ἅ
  choice: እነዚህ
  rationale: በቁጥር 16 የተጠቀሱትን የምግብ፣ የመጠጥ፣ የበዓል፣ የአዲስ ጨረቃና የሰንበት ጉዳዮች ወደኋላ ያመለክታል፤ «እነዚህ» በአማርኛ ተፈጥሯዊ ነው።
- source_word: σκιὰ
  choice: ጥላ
  rationale: የግሪኩን ነጠላ ስምና ከσῶμα ጋር ያለውን ምሳሌያዊ ንጽጽር በቀጥታ ይጠብቃል።
- source_word: τῶν μελλόντων
  choice: ሊመጡ ያሉት ነገሮች
  rationale: የወደፊት አቅጣጫውን ይጠብቃል፤ እነዚህ ነገሮች ፍጻሜያዊ፣ መሲሐዊ ወይም ሁለቱም መሆናቸውን አስቀድሞ አይወስንም።
- source_word: δὲ
  choice: ግን
  rationale: በጥላውና በአካሉ መካከል ያለውን ተቃርኖ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: σῶμα
  choice: አካሉ
  rationale: የቃሉን መደበኛ ትርጉም «አካል» በመጠበቅ የጥላና የአካል ምሳሌውን ለአንባቢው ክፍት ያደርጋል። በዚህ ንጽጽር «ተጨባጩ እውነታ» የሚል ሐሳብ ሊኖረው እንደሚችል በማስታወሻ ተገልጿል።
- source_word: τοῦ Χριστοῦ
  choice: የመሲሑ
  rationale: Χριστός እዚህ እንደ ማዕረግ ተወስዶ «መሲሕ» ተብሏል፤ የግሪኩ ባለቤትነት አገላለጽም «የመሲሑ ነው» በሚል ተጠብቋል።
theological_decisions:
- issue: በጥላ ንጽጽር ውስጥ የσῶμα ትርጉም
  choice: «አካሉ» ተብሎ በቀጥታ ተተርጉሟል።
  alternative: «ተጨባጩ እውነታ» ወይም «ዋናው ነገር»
  rationale: ግሪኩ በቀጥታ «አካል» ይላል፤ ከ«ጥላ» ጋር ሲነጻጸር ግን ጥላውን የሚያስከትለውን ተጨባጭ እውነታ ሊያመለክት ይችላል። ዋናው ጽሑፍ ይህን ትርጉማዊ ውጥረት ሳይፈታ ይጠብቃል።
- issue: የΧριστοῦ አተረጓጎም
  choice: «የመሲሑ»
  alternative: «የክርስቶስ»
  rationale: ቃሉ እዚህ የተቀባውን ንጉሥ የሚያመለክት ማዕረግ ሆኖ ስለሚሠራ «መሲሕ» የማዕረጉን ትርጉም ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ከፊል ኮሎኑ የሁለቱን ተነጻጻሪ ሐረጎች ግንኙነት ያሳያል፤ «አካሉ» የሚለው ቅጽ በአማርኛ ተፈጥሯዊነትን ሲጠብቅ የግሪኩን ὁριστικό አገላለጽ ያንጸባርቃል።
