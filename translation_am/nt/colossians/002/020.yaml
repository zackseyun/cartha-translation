  text: Εἰ ἀπεθάνετε σὺν Χριστῷ ἀπὸ τῶν στοιχείων τοῦ κόσμου, τί ὡς ζῶντες ἐν κόσμῳ δογματίζεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/020.yaml
  text: 'If you died with the Messiah from the elemental principles of the world[a], why, as if living in the world[b], are you submitting yourselves to decrees:'
translation:
  language: am
  text: ከመሲሑ ጋር ለዓለም መሠረታዊ ሥርዓቶች[a] ከሞታችሁ፣ ታዲያ በዓለም እንደምትኖሩ ሰዎች ለምን ለደንቦች ትገዛላችሁ?[b]፦
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የዓለም መሠረታዊ መንፈሳዊ ኃይሎች”፤ ሌላ አማራጭ፣ “የዓለም መሠረታዊ ንጥረ ነገሮች።”
    reason: alternative_reading
  - marker: b
    text: ወይም፣ “ለምን ደንቦች ይጫኑባችኋል?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ
  choice: ከ...ከሞታችሁ
  rationale: የግሪኩን ሁኔታዊ አገባብ በአማርኛ ተፈጥሯዊ በሆነው ‘ከ...’ አወቃቀር ይጠብቃል፤ ጳውሎስ ሁኔታውን እውነት አድርጎ ሊወስደው ቢችልም ‘ስለ’ ብሎ አይፈታውም።
- source_word: ἀπεθάνετε
  choice: ከሞታችሁ
  rationale: ወሳኝ የሆነውን ያለፈ ክስተት በቀጥታ ያሳያል።
- source_word: σὺν Χριστῷ
  choice: ከመሲሑ ጋር
  rationale: Χριστός በዚህ ስፍራ የቅብዓት ማዕረግ ስለሆነ ‘መሲሑ’ የማዕረጉን ትርጉም ይጠብቃል።
- source_word: ἀπὸ τῶν στοιχείων τοῦ κόσμου
  choice: ለዓለም መሠረታዊ ሥርዓቶች
  rationale: ከ‘መሞት’ ጋር የመለየትንና ከሥልጣናቸው ነፃ የመውጣትን ሐሳብ ‘ለ...መሞት’ በተፈጥሯዊ አማርኛ ያቀርባል። στοιχεῖα መሠረታዊ ሥርዓቶችን፣ ኃይሎችን ወይም ንጥረ ነገሮችን ሊያመለክት ስለሚችል ዋናው ጽሑፍ አንዱን ትርጓሜ በግድ አይወስንም።
- source_word: τί
  choice: ለምን
  rationale: በንግግራዊው ጥያቄ ውስጥ ያለውን የምክንያት ጥያቄ ተፈጥሯዊ በሆነ አማርኛ ያስተላልፋል።
- source_word: ὡς ζῶντες ἐν κόσμῳ
  choice: አሁንም በዓለም እንደምትኖሩ ሰዎች
  rationale: ὡς የሚያሳየውን እንደሆነ የመቁጠር ወይም የማነጻጸር ሐሳብ ይጠብቃል፤ ‘አሁንም’ በአውዱ ያለውን ከቀድሞው ሥርዓት ጋር የመቀጠል ንጽጽር ግልጽ ያደርጋል።
- source_word: δογματίζεσθε
  choice: ለደንቦች ራሳችሁን ታስገዛላችሁ
  rationale: የግሱን መካከለኛ/ተደራጊ ቅርጽና አንባቢዎቹ በመገዛታቸው ያላቸውን ተሳትፎ ያሳያል፤ ተደራጊው አማራጭ በማስታወሻ ተጠብቋል።
theological_decisions:
- issue: በጳውሎስ አጠቃቀም στοιχεῖα የሚያመለክተው
  choice: በዋናው ጽሑፍ ‘የዓለም መሠረታዊ ሥርዓቶች’
  alternative: ‘የዓለም መሠረታዊ መንፈሳዊ ኃይሎች’ ወይም ‘የዓለም መሠረታዊ ንጥረ ነገሮች’
  rationale: ቃሉ የዓለምን መሠረታዊ ሥርዓቶች፣ መንፈሳዊ/ኮስሚክ ኃይሎችን ወይም ንጥረ ነገሮችን ሊያመለክት ይችላል። ዋናው ምርጫ ልዩ የኮስሞሎጂ አቋም ሳያስገባ ሰፊውን ሐሳብ ይጠብቃል፤ ሌሎቹ ንባቦች በማስታወሻ ቀርበዋል።
- issue: የδογματίζεσθε መካከለኛ ወይም ተደራጊ ኃይል
  choice: ‘ራሳችሁን ታስገዛላችሁ’ በማለት የአንባቢዎቹን ተሳትፎ ማሳየት
  alternative: ‘ደንቦች ይጫኑባችኋል’ የሚል ተደራጊ ንባብ
  rationale: የግሪኩ ቅርጽ ሁለቱንም ሊፈቅድ ስለሚችል ዋናው ጽሑፍ በአውዱ የተጠየቀውን የፈቃድ ተሳትፎ ያቀርባል፤ ተደራጊውን ንባብ ግን አያጠፋም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘መሲሑ’ የማዕረጉን ትርጉም ይጠብቃል፤ የመጨረሻው ፦ በቁጥር 21 የሚቀጥሉትን የደንቦቹን ቃላት ያስተዋውቃል።
