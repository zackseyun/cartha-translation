  text: καὶ δι’ αὐτοῦ ἀποκαταλλάξαι τὰ πάντα εἰς αὐτόν, εἰρηνοποιήσας διὰ τοῦ αἵματος τοῦ σταυροῦ αὐτοῦ, ⸂[δι’ αὐτοῦ]⸃ εἴτε τὰ ἐπὶ τῆς γῆς εἴτε τὰ ⸀ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/020.yaml
  text: and through him to reconcile all things to himself[d][c][b][a], having made peace through the blood of his cross—through him—whether the things on the earth or the things in the heavens.
translation:
  language: am
  text: 'በእርሱ በኩል[a] ሁሉንም ወደ ራሱ እንዲያስታርቅ፣ በመስቀሉ ደም ሰላም አስፍኖ—በእርሱ በኩል[d]—ይኸውም በምድር ላይ ያሉትንም ሆነ በሰማያት[c] ያሉትን[b]።


    [a] “በእርሱ በኩል” የሚለው በሁለቱም ስፍራ “በእርሱ” ተብሎም ሊተረጎም ይችላል።


    [b] እዚህ “ሁሉንም” የሚለው አገላለጽ እንደ ግሪክኛውና “በምድር ላይ ያሉትንም ሆነ በሰማያት ያሉትን” ከሚለው ቀጣይ ሐረግ ጋር በሚስማማ መልኩ ሰፊ ትርጉሙን እንደያዘ ቀርቧል፤ ይህ እርቅ ከመጨረሻው ድነት ጋር እንዴት እንደሚዛመድ ቁጥሩ ራሱ አይገልጽም።


    [c] በግሪክኛው “በሰማያት” የሚለው ብዙ ቁጥር ነው።


    [d] አንዳንድ የእጅ ጽሑፎች ሁለተኛውን “በእርሱ በኩል” የሚለውን ሐረግ አያካትቱም።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “በእርሱ በኩል” የሚለው በሁለቱም ስፍራ “በእርሱ” ተብሎም ሊተረጎም ይችላል።
    reason: lexical_alternative
  - marker: b
    text: እዚህ “ሁሉንም” የሚለው አገላለጽ እንደ ግሪክኛውና “በምድር ላይ ያሉትንም ሆነ በሰማያት ያሉትን” ከሚለው ቀጣይ ሐረግ ጋር በሚስማማ መልኩ ሰፊ ትርጉሙን እንደያዘ ቀርቧል፤ ይህ እርቅ ከመጨረሻው ድነት ጋር እንዴት እንደሚዛመድ ቁጥሩ ራሱ አይገልጽም።
    reason: alternative_reading
  - marker: c
    text: በግሪክኛው “በሰማያት” የሚለው ብዙ ቁጥር ነው።
    reason: lexical_alternative
  - marker: d
    text: አንዳንድ የእጅ ጽሑፎች ሁለተኛውን “በእርሱ በኩል” የሚለውን ሐረግ አያካትቱም።
    reason: textual_variant
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: በእርሱ በኩል
  rationale: διά ከዘር ቅጽ ጋር መንገድን ወይም አድራጊነትን ያመለክታል፤ “በእርሱ በኩል” የወልድን አማላጅ ሚና በተፈጥሯዊ አማርኛ ያስቀምጣል።
- source_word: ἀποκαταλλάξαι
  choice: እንዲያስታርቅ
  rationale: ግሱ የተበላሸን ግንኙነት ወደ እርቅ ማምጣትን ያመለክታል፤ የቅድመ ቅጥያውን ሊኖር የሚችል አጽንዖት “ፈጽሞ” በማለት አልተጨመረም።
- source_word: τὰ πάντα
  choice: ሁሉን
  rationale: ገለልተኛ ብዙ ቁጥሩ ሁሉን አቀፍ ስፋቱን ይጠብቃል፤ ከቁ. 16–17 እና ከቀጣዩ ምድርና ሰማያት ንጽጽር ጋርም ይስማማል።
- source_word: εἰς αὐτόν
  choice: ወደ ራሱ
  rationale: ከቁ. 19 የቀጠለው አድራጊ እግዚአብሔር መሆኑን አውዱ ያመለክታል፤ አንጸባራቂው ቅጽ ይህን ግንኙነት በግልጽ አማርኛ ያቀርባል።
- source_word: εἰρηνοποιήσας
  choice: ሰላምን አድርጎ
  rationale: የአኦሪስት አጋር ግሱን ከዋናው የማስታረቅ ድርጊት ጋር ያያይዛል፤ አገላለጹ ሰላም የተደረገበትን መሠረት ይጠብቃል።
- source_word: διὰ τοῦ αἵματος
  choice: በ...ደም
  rationale: διά መንገድን ያመለክታል፤ “ደም” የሚለው መሥዋዕታዊና ሥነ መለኮታዊ ክብደት ስላለው “ሞት” ተብሎ አልተተካም።
