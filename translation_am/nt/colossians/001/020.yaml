- source_word: ⸂[δι’ αὐτοῦ]⸃
  choice: በእርሱ በኩል
  rationale: በቅንፍ የተመለከተው ሐረግ በዋናው ጽሑፍ ተጠብቆ፣ ድግግሞሹ የሚሰጠውን አጽንዖት በሰረዝ ያሳያል፤ የጽሑፍ ልዩነቱ በማስታወሻ ተገልጿል።
- source_word: εἴτε ... εἴτε
  choice: '...ም ሆነ ...'
