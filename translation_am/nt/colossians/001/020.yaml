- issue: የεἰς αὐτόν ተሳቢ
  choice: እግዚአብሔር በወልድ በኩል ሁሉን ወደ ራሱ እንደሚያስታርቅ ተወስዷል።
  alternative: መሲሑ ሁሉን ወደ ራሱ ያስታርቃል።
  rationale: አገባቡ ከቁ. 19 የዓላማ ሐረግን ይቀጥላል፤ በዚያም ሙላቱ በወልድ እንዲኖር የወደደው እግዚአብሔር ነው። “ወደ ራሱ” የሚለው አውዳዊ አንጸባራቂነቱን ያሳያል።
- issue: “የመስቀሉ ደም” ትርጉም
  choice: ተጨባጭ የደምና የመስቀል ቋንቋው ተጠብቋል።
  alternative: “በመስቀል ላይ በሞተው ሞት”
  rationale: ግሪክኛው “ደም” እና “መስቀል” ብሎ በግልጽ ይናገራል፤ ሁለቱንም ማቆየት የመሥዋዕትና የታሪካዊ ስቅለት ኃይሉን ያስቀራል፣ አንድን የስርየት ንድፈ ሐሳብም አያስገድድም።
