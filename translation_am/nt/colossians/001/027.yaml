  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: οἷς ἠθέλησεν ὁ θεὸς γνωρίσαι τί τὸ πλοῦτος τῆς δόξης τοῦ μυστηρίου τούτου ἐν τοῖς ἔθνεσιν, ⸀ὅ ἐστιν Χριστὸς ἐν ὑμῖν, ἡ ἐλπὶς τῆς δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/027.yaml
  text: To them God chose to make known what is the riches of the glory of this mystery among the Gentiles[a], which is Messiah in you[b], the hope of glory.
translation:
  language: am
  text: እግዚአብሔር የዚህ ምሥጢር የክብር ብልጽግና በአሕዛብ መካከል ምን እንደ ሆነ ሊያሳውቃቸው ወደደ፤ ይኸውም በእናንተ ውስጥ[a] ያለው መሲሕ፣ የክብር ተስፋ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በመካከላችሁ»። የግሪኩ አገላለጽ መሲሑ በአማኞች ውስጥ መኖሩን ወይም በማኅበሩ መካከል መገኘቱን ሊያመለክት ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: οἷς
  choice: ለእነርሱ
  rationale: ባለቤት አመልካች የሆነውን የብዙ ቁጥር አንጻራዊ ተውላጠ ስም ከ«ማሳወቅ» ጋር በተፈጥሯዊ አማርኛ ያገናኛል።
- source_word: ἠθέλησεν
  choice: ፈለገ
  rationale: የእግዚአብሔርን ፈቃድና ዓላማ ያሳያል፤ ከግሪኩ ቃል ይልቅ ጠባብ የሆነውን «መረጠ» አያስገድድም።
- source_word: γνωρίσαι
  choice: ማሳወቅ
  rationale: የγνωρίζωን «እንዲታወቅ ማድረግ» የሚለውን ቀጥተኛ ፍቺ በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τὸ πλοῦτος τῆς δόξης
  choice: የክብር ብልጽግና
  rationale: የግሪኩን የስም ተያያዥነት ጠብቆ ብዛትን፣ ሙላትንና ውድነትን የሚያመለክተውን πλοῦτος በ«ብልጽግና» ያቀርባል።
- source_word: μυστηρίου
  choice: ምሥጢር
  rationale: ቀድሞ ተሰውሮ አሁን የተገለጠውን መለኮታዊ ዓላማ የሚገልጥ የተለመደና ትክክለኛ ቃል ነው።
- source_word: ἐν τοῖς ἔθνεσιν
  choice: በአሕዛብ መካከል
  rationale: በዚህ ዐውድ ἔθνη አይሁድ ያልሆኑትን ሕዝቦች ያመለክታል፤ «አሕዛብ» ይህን ልዩነት ይጠብቃል።
- source_word: Χριστὸς
  choice: መሲሕ
  rationale: በዚህ የማብራሪያ አገላለጽ Χριστός እንደ ማዕረግ ስለሚሠራ፣ «መሲሕ» የቅቡዕነቱን ማዕረግ በግልጽ ያስተላልፋል።
- source_word: ἐν ὑμῖν
  choice: በእናንተ ውስጥ
  rationale: ቀጥተኛውን ውስጣዊ ትርጉም ያቀርባል፤ የማኅበራዊው «በመካከላችሁ» አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ἡ ἐλπὶς τῆς δόξης
  choice: የክብር ተስፋ
  rationale: የግሪኩን አጭር የገናዥ አገላለጽ ሳይፈታ ይጠብቃል፤ ክብር የተስፋው ይዘት ወይም ግብ መሆኑን ክፍት ያደርጋል።
theological_decisions:
- issue: የΧριστός አተረጓጎም
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: ቃሉ እዚህ የምሥጢሩን ይዘት በመግለጽ እንደ ማዕረግ ይሠራል፤ «መሲሕ» ይህን ማዕረጋዊ ኃይል ግልጽ ያደርጋል።
- issue: የἐν ὑμῖν ወሰን
  choice: በእናንተ ውስጥ
  alternative: በመካከላችሁ
  rationale: ግሪኩ መሲሑ በአማኞች ውስጥ መኖሩን ወይም በማኅበሩ መካከል መገኘቱን ሊያመለክት ይችላል። ዋናው ጽሑፍ ቀጥተኛውን አተረጓጎም ሲይዝ ሌላውን በማስታወሻ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ የሚገባ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ጥቅጥቅ ያለ የገናዥ ሐረግ በተነባቢ የአማርኛ ቅደም ተከተል ቀርቧል፤ የἐν ὑμῖν አሻሚነት ግን አልተወገደም።
