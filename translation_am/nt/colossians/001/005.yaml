  text: διὰ τὴν ἐλπίδα τὴν ἀποκειμένην ὑμῖν ἐν τοῖς οὐρανοῖς, ἣν προηκούσατε ἐν τῷ λόγῳ τῆς ἀληθείας τοῦ εὐαγγελίου
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/005.yaml
  text: because of the hope laid up for you in the heavens[a], which you heard before in the word of truth[d][c][b], the gospel
translation:
  language: am
  text: በሰማያት[a] ለእናንተ ተጠብቆ ባለው ተስፋ ምክንያት ነው፤ ስለዚህ ተስፋ ቀድሞ በየእውነት ቃል[b]፣ ማለትም በወንጌል ሰምታችኋል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «በሰማይ»። የግሪኩ ቃል ብዙ ቁጥር ሲሆን ቃል በቃል «በሰማያት» ይላል።
    reason: lexical_alternative
  - marker: b
    text: «የእውነት ቃል» የሚለው «የእውነት መልእክት» ተብሎም ሊተረጎም ይችላል፤ «ወንጌል» የሚለው ይህ ቃል ወይም መልእክት ምን እንደሆነ ይገልጻል።
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὴν ἐλπίδα
  choice: በ...ተስፋ ምክንያት
  rationale: διά ከተሳቢ ጋር በዚህ አውድ ምክንያትን ወይም መሠረትን ያመለክታል፤ ይህ አተረጓጎም ከቀደመው ቁጥር ጋር ያለውን ትስስር ይጠብቃል።
- source_word: ἀποκειμένην ὑμῖν
  choice: ለእናንተ ተጠብቆ ባለው
  rationale: ἀπόκειμαι አንድ ነገር ለወደፊት ተዘጋጅቶ ወይም ተጠብቆ መኖሩን ያሳያል፤ የጥቅም ተሳቢው ὑμῖν በ«ለእናንተ» ተገልጿል።
- source_word: ἐν τοῖς οὐρανοῖς
  choice: በሰማያት
  rationale: የግሪኩን ብዙ ቁጥር በቀጥታ ይጠብቃል፤ በአማርኛም የሚገባና የተለመደ መጽሐፍ ቅዱሳዊ አገላለጽ ነው።
- source_word: ἣν προηκούσατε
  choice: ስለዚህ ተስፋ ቀድሞ ... ሰምታችኋል
  rationale: የሴት ፆታ ነጠላ አንጻራዊ ተውላጠ ስም ἣν ወደ ἐλπίδα («ተስፋ») እንደሚመለስ በግልጽ ያሳያል፤ προακούω ያለፈውን የመስማት ተግባር «ቀድሞ» በማለት ያስተላልፋል።
- source_word: ἐν τῷ λόγῳ τῆς ἀληθείας
  choice: በእውነት ቃል
  rationale: λόγος «ቃል» ወይም «መልእክት» ሊሆን ይችላል፤ «የእውነት ቃል» የምንጩን ቅርጽ ይጠብቃል፣ ቀጥሎ ያለው «ወንጌል»ም ትርጉሙን ይለያል።
- source_word: τοῦ εὐαγγελίου
  choice: ማለትም በወንጌል
  rationale: τοῦ εὐαγγελίου «የእውነት ቃል»ን የሚለይ በአቀማመጥ የተከተለ ስም ነው፤ «ማለትም» ይህን አቀማመጣዊ ግንኙነት በተፈጥሯዊ አማርኛ ያሳያል።
theological_decisions:
- issue: የἣν አመልካች ስም
  choice: አንጻራዊው ንዑስ ነገር «ተስፋ»ን ያመለክታል።
  alternative: ንዑስ ነገሩ በሰፊው መላውን የወንጌል መልእክት ያመለክታል።
  rationale: ἣν በፆታና በቁጥር ከἐλπίδα ጋር ይስማማል፤ ስለዚህ የሰዋስው ቀጥተኛ ንባብ ተጠብቋል።
- issue: የοὐρανοῖς ቁጥር
  choice: ብዙ ቁጥር «ሰማያት» ተጠቅሟል።
  alternative: ነጠላ ቁጥር «ሰማይ» መጠቀም።
  rationale: ምንጩ ብዙ ቁጥር ስለሆነ ያለ አስፈላጊ ማስተካከያ ቅርጹ ተጠብቋል፤ ይህም የተለየ መለኮታዊ ሥርዓት አያስገባም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ቁጥሩ ከቀደመው ሐረግ ጋር በምክንያት የተያያዘ በመሆኑ «ነው» ተጨምሮ የአማርኛው ሐረግ ተፈጥሯዊ እንዲሆን ተደርጓል። «ስለዚህ ተስፋ» የሚለው ድግግሞሽ የግሪኩን አንጻራዊ ተውላጠ ስም አመልካች ያለ ጥርጥር ለማሳየት ነው።
