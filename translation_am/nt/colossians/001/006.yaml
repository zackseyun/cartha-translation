    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ παρόντος εἰς ὑμᾶς
  choice: ወደ እናንተ የደረሰው
  rationale: የግሱን የመድረስና በቦታው የመገኘት ሐሳብ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ከቁጥር 5 የቀጠለውን ‘ወንጌል’ ያመለክታል።
- source_word: ἐν παντὶ τῷ κόσμῳ
  choice: በዓለም ሁሉ
  rationale: የግሪኩን ሰፊ ዓለም አቀፋዊ አገላለጽ ሳያጠብ ወይም በጂኦግራፊ ሳይወስን ይጠብቃል።
- source_word: ἐστὶν καρποφορούμενον καὶ αὐξανόμενον
  choice: ፍሬ እያፈራና እያደገ ነው
  rationale: የግሪኩን ቀጣይ ድርጊትና የእርሻውን ምሳሌያዊ አነጋገር ይጠብቃል።
- source_word: καθὼς καὶ ἐν ὑμῖν
  choice: በእናንተ መካከልም እንዲሁ
  rationale: ለማኅበሩ በጋራ የተነገረውን አገላለጽ ተፈጥሯዊ ያደርጋል፤ ‘በእናንተ ውስጥ’ የሚለው የግል ውስጣዊ ትርጉምም ሊኖረው እንደሚችል በማስታወሻ ተጠብቋል።
- source_word: ἀφ’ ἧς ἡμέρας ἠκούσατε καὶ ἐπέγνωτε
  choice: ከሰማችሁበትና ካወቃችሁበት ቀን ጀምሮ
  rationale: የድርጊቱን መነሻ ጊዜ በግልጽ አማርኛ ያሳያል፤ ἐπέγνωτεን ከመጠን በላይ ‘ፈጽሞ ተረዳችሁ’ ብሎ አያጠናክርም።
- source_word: τὴν χάριν τοῦ θεοῦ
  choice: የእግዚአብሔርን ጸጋ
  rationale: የጳውሎስን ዋና ሥነ መለኮታዊ አገላለጽ በተለመደና ክብር ባለው አማርኛ ይጠብቃል።
- source_word: ἐν ἀληθείᾳ
  choice: በእውነት
  rationale: ‘በእውነተኛነት/በእርግጥ’ እና ‘በእውነት ውስጥ’ መካከል ያለውን የግሪክ አሻሚነት በአጭር ተፈጥሯዊ አገላለጽ ይጠብቃል።
theological_decisions:
- issue: ‘በዓለም ሁሉ’ የሚለው ወሰን
  choice: የወንጌሉን ሰፊ መስፋፋት የሚገልጽ ዓለም አቀፋዊ አነጋገር ሆኖ ተተርጉሟል።
  alternative: በዚያን ጊዜ የምድር እያንዳንዱ ክፍልና ሰው ቃሉን እንደሰማ የሚገልጽ ፍጹም ቃል በቃል ንባብ።
  rationale: ዋናው ጽሑፍ የግሪኩን ሁሉን አቀፍ ቃል ይጠብቃል፤ ነገር ግን ትርጉሙ በማብራሪያ አይስፋፋም።
- issue: ἐν ἀληθείᾳ ያለው የትርጉም ልዩነት
  choice: በእውነት
  alternative: በእርግጥ፤ ወይም በእውነቱ ውስጥ
  rationale: የግሪኩ አገላለጽ ሁኔታን (‘በእርግጥ’) ወይም የእውነትን ይዘት/ክልል ሊጠቁም ስለሚችል አሻሚነቱ አልተፈታም።
- issue: የወንጌሉ ሥራ ‘በእናንተ’
  choice: በእናንተ መካከልም
  alternative: በእናንተ ውስጥም
  rationale: የማኅበሩን የጋራ ልምምድ በዋና ጽሑፍ ያሳያል፤ የውስጣዊ ለውጥ ንባብ ግን በማስታወሻ ክፍት ሆኖ ተቀምጧል።
