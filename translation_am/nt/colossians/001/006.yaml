  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ። የግሪኩ ረጅም አረፍተ ነገርና ተደጋጋሚ ንጽጽር ተጠብቋል፤ ለአማርኛ ግልጽነት ‘ይህ ወንጌል’ የሚለው ከቁጥር 5 የሚመጣውን ተውላጠ ስም በግልጽ ያሳያል።
