  text: which has come to you[a], just as also in all the world it is bearing fruit and growing, just as also among you[d][c][b], from the day you heard and came to know the grace of God in truth.
translation:
  language: am
  text: ይህ ወንጌል ወደ እናንተ የደረሰው[a] ሲሆን፣ በዓለም ሁሉ[b] ፍሬ እያፈራና እያደገ እንዳለ ሁሉ፣ እናንተም የእግዚአብሔርን ጸጋ በእውነት[d] ከሰማችሁበትና ካወቃችሁበት ቀን ጀምሮ በእናንተ መካከል[c] እንዲሁ ፍሬ እያፈራና እያደገ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከእናንተ ጋር ያለው” ወይም “ወደ እናንተ የመጣው።”
