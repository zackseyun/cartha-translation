- issue: πνευματικῇ ከመንፈስ ቅዱስ ጋር ያለው ግንኙነት
  choice: መንፈሳዊ ጥበብና ማስተዋል
  alternative: በመንፈስ የተሰጠ ጥበብና ማስተዋል
  rationale: ቅጽሉ ባሕርያቸው መንፈሳዊ መሆኑን ወይም ከመንፈስ ቅዱስ መሰጠታቸውን ሊያመለክት ይችላል። ዋናው ጽሑፍ የግሪኩን ክፍትነት ጠብቆ ‘መንፈሳዊ’ ይላል፤ ሌላውን አማራጭ ማስታወሻው ያቀርባል።
