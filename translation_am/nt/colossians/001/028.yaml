revisions:
- from: እርሱን እኛ እናውጃለን፤ ሰውን ሁሉ እየመከርንና ሰውን ሁሉ በጥበብ ሁሉ እያስተማርን፣ ሰውን ሁሉ በክርስቶስ የበሰለ አድርገን እንድናቀርብ ነው።
  to: እርሱን እኛ እናውጃለን፤ ሰውን ሁሉ እያስጠነቀቅንና ሰውን ሁሉ በሁሉም ጥበብ እያስተማርን፣ ሰውን ሁሉ በክርስቶስ የበሰለ ሆኖ እንድናቀርብ ነው።
