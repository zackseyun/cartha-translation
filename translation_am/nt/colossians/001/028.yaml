language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: ὃν ἡμεῖς καταγγέλλομεν νουθετοῦντες πάντα ἄνθρωπον καὶ διδάσκοντες πάντα ἄνθρωπον ἐν πάσῃ σοφίᾳ, ἵνα παραστήσωμεν πάντα ἄνθρωπον τέλειον ἐν ⸀Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/028.yaml
  text: Him we proclaim, warning every person and teaching every person with all wisdom, so that we may present every person mature in Messiah.
translation:
  language: am
  text: እርሱን እኛ እናውጃለን፤ ሰውን ሁሉ እያስጠነቀቅንና ሰውን ሁሉ በሁሉም ጥበብ እያስተማርን፣ ሰውን ሁሉ በክርስቶስ የበሰለ ሆኖ እንድናቀርብ ነው።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταγγέλλομεν
  choice: እናውጃለን
  rationale: የግሡን በይፋ ማሳወቅና መስበክ የሚያካትት ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: νουθετοῦντες
  choice: እየመከርን
  rationale: νουθετέω ማስጠንቀቅን ብቻ ሳይሆን አእምሮን ለማቅናት የሚሰጥ ምክርና ተግሣጽንም ያካትታል፤ ‘መምከር’ ይህን ስፋት ሳያጠብ በዘመናዊ አማርኛ ያቀርባል።
- source_word: ἐν πάσῃ σοφίᾳ
  choice: በጥበብ ሁሉ
  rationale: የπάσῃን ሙሉነት ይጠብቃል፣ ሐረጉንም በቅርብ ካለው ‘እያስተማርን’ ጋር ያያይዛል።
- source_word: τέλειον
  choice: የበሰለ
  rationale: በዚህ ዐውድ መንፈሳዊ ብስለትንና ወደ ሙሉነት መድረስን ያመለክታል፤ ‘ፍጹም’ ሊያስከትለው የሚችለውን ኃጢአት-አልባነት ብቻ የሚያጎላ ግንዛቤ ያስወግዳል።
- source_word: Χριστῷ
  choice: ክርስቶስ
  rationale: የግሪኩን የማዕረግ ቃል Χριστός በአማርኛ የተለመደውና በሰፊው የሚታወቀው ቅርጽ ነው።
theological_decisions:
- issue: የτέλειον ትርጉም
  choice: የበሰለ
  alternative: ፍጹም / የተሟላ
  rationale: ቃሉ ሙሉነትንና ብስለትን ሊያመለክት ይችላል። በዚህ ዐውድ ‘የበሰለ’ የደቀ መዝሙርነት ዕድገትን በተፈጥሯዊ ቋንቋ ያሳያል፣ ፍጹም ኃጢአት-አልባነትን ግን አያስገድድም።
- issue: ἐν Χριστῷ የሚያመለክተው ግንኙነት
  choice: በክርስቶስ
  alternative: ከክርስቶስ ጋር በመዋሐድ / በክርስቶስ ውስጥ
  rationale: የግሪኩን አጭርና ሥነ-መለኮታዊ ስፋት ያለውን አገላለጽ ሳይፈታ ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ሰውን ሁሉ’ ሦስት ጊዜ መደገሙ የግሪኩን አጽንዖት ለመጠበቅ ሆን ተብሎ ተቀምጧል።
