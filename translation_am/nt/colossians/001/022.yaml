- issue: በκατενώπιον αὐτοῦ ውስጥ የαὐτοῦ ዋቢ
  choice: ‘በፊቱ’ ብሎ የግሪኩን ተውላጠ ስም አሻሚነት መጠበቅ
  alternative: ‘በእግዚአብሔር ፊት’ ወይም ‘በክርስቶስ ፊት’ ብሎ ዋቢውን መግለጽ
