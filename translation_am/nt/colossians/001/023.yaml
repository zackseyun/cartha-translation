  text: በእምነት በእርግጥ ብትጸኑ፣ ተመሥርታችሁና ጸንታችሁ፣ ከሰማችሁት የወንጌል ተስፋም ሳትናወጡ። ይህ ወንጌል ከሰማይ በታች ባለው ፍጥረት ሁሉ[a] ተሰብኳል፤ እኔ ጳውሎስም የዚህ ወንጌል አገልጋይ[b] ሆንሁ።
