  text: Now I rejoice in my sufferings for your sake[a], and in my flesh I am filling up what is lacking in the afflictions of the Messiah for the sake of his body, which is the church[b],
translation:
  language: am
  text: አሁን ስለ እናንተ በምቀበለው መከራ ደስ ይለኛል፤ በሥጋዬም ስለ አካሉ፣ ይኸውም ቤተ ክርስቲያን ስለሆነችው፣ ከመሲሑ[b] መከራዎች የጎደለውን እሞላለሁ[a]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የቀረውን የመሲሑን መከራ እፈጽማለሁ” ተብሎም ሊተረጎም ይችላል። ጳውሎስ የመሲሑ የማስታረቂያ ሥራ ጉድለት ነበረበት እያለ አይደለም፤ ጥቅሱ ከመሲሑና ከአካሉ፣ ማለትም ከቤተ ክርስቲያን፣ ጋር በተያያዘው መከራ ጳውሎስ ስለሚኖረው ተሳትፎ ይናገራል።
    reason: alternative_reading
  - marker: b
