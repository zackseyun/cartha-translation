- source_word: ἐν τῇ σαρκί μου
  choice: በሥጋዬ
  rationale: ጳውሎስ በአካላዊ ሕልውናው የሚቀበለውን መከራ የሚያመለክተውን ሥጋ የሚለውን ቃል በቀጥታ ይጠብቃል።
