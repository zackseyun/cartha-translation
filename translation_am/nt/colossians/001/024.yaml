- issue: Χριστοῦ እንዴት እንደሚተረጎም
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: ቃሉ በዚህ አውድ እንደ ማዕረግ ስለሚሠራ፣ ‘መሲሕ’ የሚለው ትርጉም መሲሐዊ ኃይሉን በግልጽ ያሳያል።
