id: COL.1.3
reference: Colossians 1:3
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Εὐχαριστοῦμεν τῷ ⸀θεῷ πατρὶ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ πάντοτε ⸀περὶ ὑμῶν προσευχόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/003.yaml
  text: We always give thanks to God[a], the Father of our Lord Jesus the Messiah, when we pray for you,
translation:
  language: am
  text: ስለ እናንተ ስንጸልይ፣ ሁልጊዜ የጌታችን ኢየሱስ መሲሕ[a] አባት ለሆነው እግዚአብሔር እናመሰግናለን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ በባህላዊ አጠቃቀም፣ «ኢየሱስ ክርስቶስ»።
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐχαριστοῦμεν
  choice: እናመሰግናለን
  rationale: የግሪኩን ‘ምስጋናን መግለጽ’ ትርጉም በተፈጥሯዊና በክብር የተሞላ ዘመናዊ አማርኛ ያቀርባል።
- source_word: τῷ θεῷ πατρὶ
  choice: አባት የሆነውን እግዚአብሔርን
  rationale: πατρί ከθεῷ ጋር በተዛማጅ ማብራሪያ ሆኖ መቆሙን ያሳያል፤ እግዚአብሔርና አብ ሁለት የተለያዩ ተቀባዮች እንዳይመስሉም ያደርጋል።
- source_word: κυρίου
  choice: ጌታ
  rationale: ለκύριος የተለመደውን የክብርና የሥልጣን ማዕረግ ይጠብቃል።
- source_word: Ἰησοῦ Χριστοῦ
  choice: ኢየሱስ መሲሕ
  rationale: Χριστός እዚህ የተቀባውን ንጉሥ የሚያመለክት ማዕረግ መሆኑን ‘መሲሕ’ በግልጽ ያስተላልፋል፤ በአማርኛም ‘ኢየሱስ መሲሕ’ የተፈጥሮ የማዕረግ አጠቃቀም ነው።
- source_word: πάντοτε
  choice: ሁልጊዜ
  rationale: ‘always’ የሚለውን ቀጥተኛ ትርጉም ይሰጣል፤ በዓረፍተ ነገሩም ዋናውን የምስጋና ግስ ይገድባል።
- source_word: περὶ ὑμῶν
  choice: ስለ እናንተ
  rationale: περί ከዝርያ ስም ጋር ያለውን ‘ስለ/ለ’ የጸሎት ማጣቀሻ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: προσευχόμενοι
  choice: በምንጸልይበት ጊዜ
  rationale: የአሁን ጊዜ ተሳቢ ግሱ ከዋናው ግስ ጋር ያለውን ጊዜያዊ/ሁኔታዊ ግንኙነት በግልጽና ተፈጥሯዊ መንገድ ያቀርባል።
theological_decisions:
- issue: በጳውሎሳዊው የምስጋና ክፍል Χριστόςን መተርጎም
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: ቃሉ እዚህ የማዕረግ ኃይሉን ስላልጣለ፣ ‘መሲሕ’ የ‘ተቀባው’ ትርጉምን ግልጽ ያደርጋል፤ ‘ክርስቶስ’ ግን ባህላዊና ትክክለኛ አማራጭ ነው።
- issue: πάντοτε ከዋናው ግስ ወይም ከጸሎቱ ጋር ያለው ግንኙነት
  choice: ሁልጊዜ እናመሰግናለን
  alternative: ሁልጊዜ በምንጸልይበት ጊዜ እናመሰግናለን
  rationale: የግሪኩ የቃላት አቀማመጥ πάντοτεን በቀዳሚነት ከΕὐχαριστοῦμεν ጋር ያዛምዳል፤ ሆኖም ከተሳቢው ግስ ጋር ያለውን ቅርበት ሙሉ በሙሉ አያስወግድም።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ የተከበረና ለተራ አንባቢ ግልጽ የሆነ አማርኛን ይጠቀማል። የግሪኩን አገባባዊ ግንኙነት በአማርኛ ተፈጥሯዊ የሆነ ቅደም ተከተል አቅርቧል። የእንግሊዝኛው [a] ምልክት በውስጡ ካለው የግርጌ ማስታወሻ ጋር አይዛመድም፤ ማስታወሻው ‘Christ’ የሚለውን አማራጭ ሲገልጽ ምልክቱ ግን ‘God’ ላይ ተቀምጧል። ስለዚህ ያልተዛመደ ምልክት ወደ አማርኛው አልተዛወረም።
