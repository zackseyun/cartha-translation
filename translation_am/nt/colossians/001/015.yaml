  edition: SBLGNT
  text: ὅς ἐστιν εἰκὼν τοῦ θεοῦ τοῦ ἀοράτου, πρωτότοκος πάσης κτίσεως,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/015.yaml
  text: He is the image of the invisible God[a], the firstborn of all creation.
translation:
  language: am
  text: እርሱ የማይታየው አምላክ አምሳል፣ የፍጥረት ሁሉ በኩር[a] ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የፍጥረት ሁሉ በኩር” የሚለው “በፍጥረት ሁሉ ላይ በኩር” ተብሎም ሊገባ ይችላል። እዚህ “በኩር” የሚለው ቃል የቀዳሚነትን ብቻ ሳይሆን የክብር ደረጃንና የውርስ መብትንም ሊያመለክት ይችላል፤ ቀጣዮቹን ቁጥሮች ይመልከቱ።
    reason: የግሪኩን ሰዋሰዋዊ ቅርጽና አውዳዊ የትርጉም አማራጭ በግልጽነት ለማሳየት።
lexical_decisions:
- source_word: ὅς ἐστιν
  choice: እርሱ … ነው
  rationale: ὅς ወደ ቀደመው ክፍል የተጠቀሰውን ወልድ ያመለክታል። በአማርኛ አዲስ ዓረፍተ ነገር በ“እርሱ” መጀመር ተፈጥሯዊ ሲሆን፣ ἐστιν በቀላሉ “ነው” ተብሎ ተተርጉሟል።
- source_word: εἰκών
  choice: አምሳል
  rationale: “አምሳል” የመምሰልንና የማሳየትን ኃይል ይጠብቃል፤ “ምስል” ሊያስከትለው የሚችለውን የተሳለ ወይም የተቀረጸ ነገር ጠባብ ሐሳብም ያስወግዳል።
- source_word: τοῦ θεοῦ τοῦ ἀοράτου
  choice: የማይታየው አምላክ
  rationale: የግሪኩን የባለቤትነትና የገላጭ ቅጽ በተፈጥሯዊ አማርኛ ያቀርባል፤ ἀοράτου የአምላክን የማይታይነት ይገልጣል።
- source_word: πρωτότοκος
  choice: በኩር
  rationale: “በኩር” የመጀመሪያ ልጅነትን መሠረታዊ ምስል እንዲሁም ከደረጃና ከውርስ ጋር ሊኖረው የሚችለውን ትርጉም ሳይፈታ ይጠብቃል።
- source_word: πάσης κτίσεως
  choice: የፍጥረት ሁሉ
  rationale: የግሪኩን የባለቤትነት ቅርጽ በቀጥታ ይጠብቃል። “በፍጥረት ሁሉ ላይ” የሚለውን ትርጓሜ በዋናው ጽሑፍ ከማስገባት ይልቅ የሐረጉ እውነተኛ የትርጉም ውጥረት ተጠብቋል።
theological_decisions:
- issue: πρωτότοκος πάσης κτίσεως ከክርስቶስና ከፍጥረት ጋር ያለው ግንኙነት
  choice: የፍጥረት ሁሉ በኩር
  alternative: በፍጥረት ሁሉ ላይ በኩር
  rationale: ዋናው ጽሑፍ የπάσης κτίσεωςን የግሪክ የባለቤትነት ቅርጽ እና የπρωτότοκοςን ምሳሌያዊ ቃል ይጠብቃል። ሐረጉ መነሻን ብቻ ሳይሆን ደረጃንና የውርስ መብትንም ሊያመለክት ስለሚችል፣ አንዱን ትርጓሜ በዋናው ጽሑፍ በመጨመር ውጥረቱ አልተወገደም። ቀጣዮቹ ቁጥሮች ፍጥረት በእርሱና ለእርሱ እንደተፈጠረ የሚገልጡት አውድ በማስታወሻው ተጠቅሷል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “አምሳል” እና “በኩር” በመጽሐፍ ቅዱሳዊ አውድ የታወቁ ቃላት ሲሆኑ ጥንታዊ ወይም የአንድ ቤተ እምነት ልዩ አገላለጽ አይደሉም።
