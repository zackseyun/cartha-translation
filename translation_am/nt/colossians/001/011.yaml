- from: በክብሩ ኃያልነት መጠን[a] በሙሉ ኃይል እየበረታችሁ፣ ሙሉ ጽናትና ትዕግሥት ከደስታ ጋር ይኑራችሁ።
  to: በሁሉም ኃይል፣ በክብሩ ኃያልነት መጠን[a]፣ ለሁሉም ጽናትና ትዕግሥት ከደስታ ጋር እየተበረታችሁ፣
  rationale: The revision removes the unsupported imperative and restores the source’s ongoing passive participial construction. It also places the comprehensiveness of πᾶσα naturally in “ለሁሉም ጽናትና ትዕግሥት,” while retaining the dense expression “the might of his glory” and the source’s syntactic openness concerning “with joy.”
