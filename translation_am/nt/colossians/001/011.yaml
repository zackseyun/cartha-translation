  text: ἐν πάσῃ δυνάμει δυναμούμενοι κατὰ τὸ κράτος τῆς δόξης αὐτοῦ εἰς πᾶσαν ὑπομονὴν καὶ μακροθυμίαν μετὰ χαρᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/011.yaml
  text: being strengthened with all power[a], according to the might of his glory, for all endurance and patience with joy,
translation:
  language: am
  text: በሁሉም ኃይል፣ በክብሩ ኃያልነት መጠን[a]፣ ለሁሉም ጽናትና ትዕግሥት ከደስታ ጋር እየተበረታችሁ፣
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እንደ ክቡር ኃይሉ።” ግሪኩ ቃል በቃል ሲተረጎም፣ “በክብሩ ኃያልነት መጠን” ይላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πάσῃ δυνάμει
  choice: በሙሉ ኃይል
  rationale: ἐνን እዚህ እንደ መሣሪያዊ አገላለጽ ያቀርባል፤ πᾶσα የሚያመለክተውንም ሙሉነት በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: δυναμούμενοι
  choice: እየበረታችሁ
  rationale: የአሁን ጊዜውን ቀጣይ ሂደትና ተደራጊ ትርጉሙን ይጠብቃል፤ አበርቺው እግዚአብሔር መሆኑ ከጸሎቱ አውድ ይገባል።
- source_word: κατὰ τὸ κράτος τῆς δόξης αὐτοῦ
  choice: በክብሩ ኃያልነት መጠን
  rationale: κατά የመለኪያን ወይም የመስፈርትን ሐሳብ ያሳያል፤ κράτοςን ‘ኃያልነት’፣ δόξαን ‘ክብር’ በማለት የግሪኩን ጥቅጥቅ ያለ የባለቤትነት አገላለጽ ይጠብቃል።
- source_word: εἰς πᾶσαν ὑπομονὴν
  choice: ሙሉ ጽናት
  rationale: εἰς የዓላማን ወይም የውጤትን አቅጣጫ ያሳያል፤ ὑπομονή በፈተና ሥር መጽናትን ስለሚያመለክት ‘ጽናት’ ተመርጧል።
- source_word: μακροθυμίαν
  choice: ትዕግሥት
  rationale: በተለይ ከሰዎች ጋር ታጋሽ መሆንን ሊያመለክት የሚችለውን ቃል በዘመናዊና በተለመደ አማርኛ ያቀርባል፤ ከ‘ጽናት’ም ይለያል።
- source_word: μετὰ χαρᾶς
  choice: ከደስታ ጋር
  rationale: χαράን እንደ ስም ይጠብቃል፤ ሐረጉ ከጽናትና ከትዕግሥት ጋር ያለውን ሰፊ ትስስር ያለ ከመጠን በላይ ትርጓሜ ያቀርባል።
theological_decisions:
- issue: መለኮታዊው ማበርታት ከእግዚአብሔር ክብር ጋር ያለው ዝምድና
  choice: ‘በክብሩ ኃያልነት መጠን’ በማለት ኃይል መሰጠቱ ከክብሩ ጋር በተያያዘው ኃያልነት መጠን መሆኑን ማቆየት
  alternative: ‘እንደ ክቡር ኃይሉ’ ብሎ ማለስለስ
  rationale: የግሪኩን ‘የክብሩ ኃያልነት’ አወቃቀር በመጠበቅ የጳውሎስን ጥቅጥቅ ያለ አገላለጽና ሥነ መለኮታዊ ክብደት ሳይፈታ ያቀርባል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለሕዝብ የሚገባ አማርኛ ተጠቅሟል። ‘ኃይል/ኃያልነት’ የሚለው ልዩነት δύναμιςና κράτος የተባሉትን ሁለት ተዛማጅ የግሪክ ቃላት ያንጸባርቃል፤ ‘ጽናት/ትዕግሥት’ም ὑπομονήና μακροθυμία ያላቸውን ተዛማጅ ነገር ግን የተለየ ትኩረት ይጠብቃል።
