  rationale: ፍጹም ጊዜው ከቀደመ ተግባር የተገኘን ቀጣይ ሁኔታ ያመለክታል። «ተጋጥሞ ይኖራል» ሁሉ ተያይዞና ሥርዓቱን ጠብቆ መኖሩን በግልጽ ዘመናዊ አማርኛ ያሳያል።
theological_decisions:
- issue: በπρὸ πάντων የተገለጠው የክርስቶስ ከፍጥረት ጋር ያለው ግንኙነት
