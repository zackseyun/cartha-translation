  choice: እርሱ
  rationale: ተውላጠ ስሙ በግሪክ አቀማመጥ አጽንዖት አለው፤ «እርሱም» ይህን አጽንዖት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: πρὸ πάντων
  choice: ከሁሉም ነገር በፊት
