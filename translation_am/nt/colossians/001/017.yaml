    text: «ከሁሉም ነገር በፊት» የሚለው ከሁሉ በላይ የሆነ ሥልጣንንም ሊያመለክት ይችላል፤ የግሪኩ አገላለጽ ግን በዋነኝነት ቀዳሚነትን ይገልጣል።
