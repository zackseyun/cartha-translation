  yaml_path: translation/nt/colossians/001/002.yaml
  text: 'To the holy and faithful brothers in Messiah at Colossae: grace to you and peace from God our Father[a][b][c].'
translation:
  language: am
  text: በቆላስይስ ለሚኖሩ፣ በመሲሕ[c] ያሉ ቅዱሳንና ታማኝ[a] ወንድሞች[b]፤ ከእግዚአብሔር፣ ከአባታችን ጸጋና ሰላም ለእናንተ ይሁን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “አማኝ።” የግሪኩ πιστοῖς የሚያምኑትን ወይም ታማኝ የሆኑትን ሊገልጽ ይችላል።
    reason: lexical_alternative
  - marker: b
    text: የግሪኩ ቃል በቀጥታ “ወንድሞች” ይላል፤ በዐውዱ ግን ጳውሎስ ሴቶችንም ጨምሮ መላውን ማኅበረሰብ እያነጋገረ መሆኑ ይታሰባል።
    reason: lexical_alternative
  - marker: c
    text: በተለምዶ፣ “በክርስቶስ።” የግሪኩ Χριστός ማለት “መሲሕ” ማለት ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: τοῖς ἐν Κολοσσαῖς
  choice: በቆላስይስ ለሚኖሩ
  rationale: የተቀባዮቹን መኖሪያ በተፈጥሯዊ ዘመናዊ አማርኛ ይገልጣል፤ የἐνን ቦታዊ ትርጉም ይጠብቃል።
- source_word: ἁγίοις
  choice: ቅዱሳን
  rationale: ቃሉ እዚህ ἀδελφοῖςን የሚገልጽ ሲሆን ለእግዚአብሔር የተለዩ መሆናቸውን በቀጥታ ያሳያል።
- source_word: πιστοῖς
  choice: ታማኝ
  rationale: πιστός ታማኝነትን ወይም አማኝነትን ሊያመለክት ይችላል፤ ዋናው ጽሑፍ ‘ታማኝ’ ይላል፣ ሌላው ትርጉም በማስታወሻ ተጠብቋል።
- source_word: ἀδελφοῖς
  choice: ወንድሞች
  rationale: የግሪኩን ተባዕታይ ብዙ ቁጥር በቅርብ ይከተላል፤ ንግግሩ ሴቶችንም ሊያካትት እንደሚችል በማስታወሻ ተገልጿል።
- source_word: ἐν Χριστῷ
  choice: በመሲሑ ያሉ
  rationale: Χριστόςን እንደ ማዕረግ ‘መሲሕ’ ብሎ ይተረጉማል፤ ἐνንም የጳውሎስን ከመሲሑ ጋር ያለ ኅብረት ቋንቋ ሳያጠፋ ‘በ…ያሉ’ በሚል ይገልጣል።
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: ጸጋና ሰላም ለእናንተ ይሁን
  rationale: የሰላምታውን ይዘትና የቃላቱን ቅደም ተከተል በተፈጥሯዊ የአማርኛ ምኞት አገላለጽ ያቀርባል።
- source_word: ἀπὸ θεοῦ πατρὸς ἡμῶν
  choice: ከአባታችን ከእግዚአብሔር
  rationale: πατρὸς ἡμῶνን ከθεοῦ ጋር አንድን አካል የሚገልጽ አገላለጽ አድርጎ ያቀርባል፤ በግሪኩ የሌለውን ‘እና’ አይጨምርም።
theological_decisions:
- issue: በἐν Χριστῷ ውስጥ Χριστόςን መተርጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: ቃሉ እዚህ የቅብዓት ማዕረግ ትርጉሙን ይዞ ስለሚሠራ ‘መሲሑ’ ተመርጧል፤ የተለመደው አጠራር በማስታወሻ ተጠብቋል።
- issue: የἀδελφοῖς ጾታዊ አገላለጽ
  choice: ወንድሞች
  alternative: ወንድሞችና እኅቶች
  rationale: ዋናው ጽሑፍ የግሪኩን ተባዕታይ ቅርጽ ይጠብቃል፤ በዐውዱ መላውን ማኅበረሰብ፣ ሴቶችንም ጨምሮ፣ ሊያመለክት መቻሉ በማስታወሻ ተገልጿል።
- issue: የπιστοῖς የትርጉም ስፋት
  choice: ታማኝ
  alternative: አማኝ
  rationale: ጥቅሱ ታማኝነትና እምነት መካከል ያለውን የቃሉን ስፋት አይወስንም፤ አንዱ በዋናው ጽሑፍ፣ ሌላው በማስታወሻ ቀርቧል።
