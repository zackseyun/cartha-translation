  text: እኔም ለእናንተ ሲባል ከእግዚአብሔር በተሰጠኝ አደራ[a] መሠረት የእርሷ አገልጋይ ሆንሁ፤ ይህም የእግዚአብሔርን ቃል ለመፈጸም[b] ነው።
