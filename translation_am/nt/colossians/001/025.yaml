  rationale: οἰκονομία በዚህ ስፍራ በአደራ የተሰጠ ኃላፊነትን ያመለክታል፤ አገላለጹም አደራው ከእግዚአብሔር መሆኑንና ለጳውሎስ መሰጠቱን ይጠብቃል።
