  rationale: ቃሉ በዚህ አውድ የተቀባውን የሚያመለክት ማዕረግ በመሆኑ «መሲሕ» የማዕረጉን ሴማንቲክ ኃይል ይጠብቃል፤ እንደ ስም ብቻ አያቀርበውም።
