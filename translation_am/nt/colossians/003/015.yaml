    text: «ይወስን» ተብሎ የተተረጎመው የግሪክ ግሥ «እንደ ዳኛ መወሰን» ወይም «ዳኝነት መስጠት» የሚል ኃይልም ሊኖረው ይችላል።
    reason: lexical_alternative
  - marker: b
    text: «በአንድ አካል» የሚለው «ወደ አንድ አካል» ተብሎም ሊተረጎም ይችላል፤ ይህም ወደ አንድ የጋራ አካል መካተትን ያጎላል።
    reason: lexical_alternative
lexical_decisions:
