- source_word: γίνεσθε
  choice: ሁኑ
  rationale: በምክር ትእዛዝ አውድ γίνεσθε የሚጠይቀውን ቀጣይ የኑሮ ሁኔታ በተፈጥሯዊ አማርኛ ያስተላልፋል።
