  rationale: በጳውሎስ አጠቃቀም ያለውን ከእግዚአብሔር የማዳን ሥራ የሚመነጭ የግንኙነትና የማኅበረሰብ ሰላም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τοῦ Χριστοῦ
  choice: የመሲሑ
  rationale: Χριστός እዚህ የተቀባውን የሚያመለክት ማዕረግ ነው፤ «መሲሕ» የማዕረጉን ትርጉም በዘመናዊ መደበኛ አማርኛ ይጠብቃል።
- source_word: βραβευέτω
  choice: ይግዛ
  rationale: ግሡ እንደ ዳኛ መወሰንን ወይም የመሪነት ውሳኔ መስጠትን ሊያመለክት ይችላል፤ «ይግዛ» የትእዛዙንና የሚወስነውን ኃይል በተፈጥሯዊ አነጋገር ያስተላልፋል።
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: በልባችሁ
