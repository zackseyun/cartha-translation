- source_word: εἰς ἣν
  choice: ለዚህም
  rationale: ተውላጠ ስሙ ወደ «ሰላም» ይመለሳል፤ εἰς የጥሪውን ግብ በሚያመለክት መልኩ «ለዚህ» በተፈጥሯዊ አማርኛ ተተርጉሟል።
- source_word: καὶ ἐκλήθητε
  choice: ተጠርታችኋል
  rationale: የተደረገውን ጥሪ የሚገልጠውን የግሪክ ተደራጊ ቅርጽ ይጠብቃል፤ καί በአማርኛው «ም» ተንጸባርቋል።
- source_word: ἐν ἑνὶ σώματι
  choice: በአንድ አካል
  rationale: የግሪኩን ἐν ከተሳቢ ጋር ያለውን ቀጥተኛ የስፍራ/ሁኔታ አገላለጽና የጳውሎስን የአካል ምሳሌ ያለ ማብራሪያ ይጠብቃል።
- source_word: εὐχάριστοι
  choice: አመስጋኞች
