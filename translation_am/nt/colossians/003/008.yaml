id: COL.3.8
reference: Colossians 3:8
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: νυνὶ δὲ ἀπόθεσθε καὶ ὑμεῖς τὰ πάντα, ὀργήν, θυμόν, κακίαν, βλασφημίαν, αἰσχρολογίαν ἐκ τοῦ στόματος ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/008.yaml
  text: 'But now you also must put away all these things: anger, rage, malice, slander, and filthy speech from your mouth.'
translation:
  language: am
  text: አሁን ግን እናንተም እነዚህን ሁሉ ከእናንተ አስወግዱ፤ ቁጣን፣ ንዴትን፣ ክፋትን፣ ስድብንና ከአፋችሁ የሚወጣውን ጸያፍ ንግግር።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόθεσθε
  choice: ከእናንተ አስወግዱ
  rationale: የግሱን ‘ማውለቅ/ገለል ማድረግ’ ምስላዊ ኃይል በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ὀργήν
  choice: ቁጣን
  rationale: የተረጋጋ ወይም የቆየ ቁጣን ሊያመለክት የሚችል መደበኛ ቃል ነው።
- source_word: θυμόν
  choice: ንዴትን
  rationale: ከὀργή ተለይቶ ድንገተኛና ኃይለኛ የቁጣ ፍንዳታን ያሳያል።
- source_word: κακίαν
  choice: ክፋትን
  rationale: ክፉ ዝንባሌንና ሌሎችን የመጉዳት ሐሳብን ሊያካትት የሚችል ሰፊ ትርጉም ይጠብቃል።
- source_word: βλασφημίαν
  choice: ስድብን
  rationale: በዚህ የሰዎች ግንኙነት ዝርዝር ውስጥ የስም ማጥፋትንና የሚጎዳ ስድብን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: αἰσχρολογίαν
  choice: ጸያፍ ንግግር
  rationale: አሳፋሪ፣ ወራዳ ወይም ብልግና ያለበትን ንግግር የሚያካትት ሰፊና ግልጽ አገላለጽ ነው።
theological_decisions:
- issue: βλασφημία የሚያመለክተው በእግዚአብሔር ላይ የሚነገር ስድብ ብቻ ነው ወይስ ሰዎችንም የሚጎዳ ንግግር?
  choice: ስድብ
  alternative: ስም ማጥፋት / እግዚአብሔርን መሳደብ
  rationale: የግሪክ ቃሉ ሰፊ ነው፤ ዐውደ ንባቡም የአማኞችን ንግግርና ግንኙነት ስለሚመለከት ‘ስድብ’ ልዩ የእምነት ትርጓሜ ሳይጫን ሁለቱንም አቅጣጫዎች ክፍት ያደርጋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የὀργή/θυμός ልዩነት ‘ቁጣ/ንዴት’ በሚለው ጥንድ ተጠብቋል፤ የመጨረሻውም ሐረግ የጸያፍ ንግግር ምንጩ አፍ መሆኑን በተፈጥሯዊ አገባብ ያሳያል።
