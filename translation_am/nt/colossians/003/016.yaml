  alternative: በመካከላችሁ
  rationale: ቀጥተኛው አተረጓጎም በዋናው ጽሑፍ ተጠብቋል፤ የብዙ ቁጥር ተውላጠ ስሙና የእርስ በርስ ተግባሮቹ የሚያሳዩት የማኅበር አቅጣጫ በማስታወሻ ቀርቧል።
- issue: የἐν χάριτι ትርጉም
  choice: በጸጋ
  alternative: በምስጋና / በአመስጋኝነት
  rationale: ግሪኩ ጸጋን፣ ደግነትን ወይም አመስጋኝነትን ሊያመለክት ስለሚችል ዋናው ቃላዊ አቻ በጽሑፉ፣ ዐውዳዊው አማራጭ በማስታወሻ ተቀምጧል።
- issue: የἐν πάσῃ σοφίᾳ ሰዋሰዋዊ ትስስር
  choice: ከሚከተለው የማስተማርና የመምከር ሐረግ አጠገብ ማስቀመጥ
  alternative: ከ“በብዛት ይኑር” ጋር በቀጥታ ማያያዝ
  rationale: የቃላቱ አቀማመጥ ለሁለቱም ንባቦች ቦታ ይሰጣል፤ ትርጉሙ አንዱን ብቻ እንዳይወስን የግሪኩ ሐረግ በቅርብ ተጠብቋል።
