- source_word: ἐνοικείτω
  choice: ይኑር
  rationale: የማደርንና በውስጥ የመኖርን ምስል በተፈጥሯዊ አማርኛ ይጠብቃል፤ ትእዛዛዊ ቅርጹም ቀጣይ ሁኔታን ያመለክታል።
- source_word: ἐν ὑμῖν
  choice: በእናንተ ውስጥ
  rationale: የግሪኩን ቀጥተኛ አገባብ ይጠብቃል፤ ብዙ ቁጥሩ የግለሰቦችንም ሆነ የማኅበሩን አጠቃላይ ልምምድ ሊያመለክት ስለሚችል “በመካከላችሁ” የሚለው በማስታወሻ ቀርቧል።
- source_word: πλουσίως
  choice: በብዛት
  rationale: የሙላትንና የተትረፈረፈነትን ሐሳብ በግልጽ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: ἐν πάσῃ σοφίᾳ
  choice: በጥበብ ሁሉ
  rationale: የግሪኩን ቅርጽ በቅርብ ይከተላል፤ ከቃሉ መኖር ወይም ከማስተማርና ከመምከር ጋር ያለውን ሰዋሰዋዊ ግንኙነት አጥብቆ አይወስንም።
- source_word: διδάσκοντες καὶ νουθετοῦντες ἑαυτούς
  choice: እርስ በርሳችሁ እያስተማራችሁና እየመከራችሁ
  rationale: የጋራ ተግባሩን በተፈጥሯዊ አማርኛ ያሳያል፤ “መምከር” ትምህርትን ብቻ ሳይሆን የማስጠንቀቅና የማቅናት ሐሳብንም ይይዛል።
- source_word: ψαλμοῖς, ὕμνοις, ᾠδαῖς πνευματικαῖς
  choice: በመዝሙሮች፣ በውዳሴዎችና በመንፈሳዊ ዝማሬዎች
  rationale: ሦስቱን የሙዚቃ ቃላት ሳያዋህድ ይለያቸዋል፤ πνευματικαῖς በግሪኩ እንዳለው ከ“ዝማሬዎች” ጋር ተያይዟል።
- source_word: ἐν χάριτι
  choice: በጸጋ
  rationale: የχάριςን መሠረታዊ የጸጋ ትርጉም ይጠብቃል፤ “በምስጋና/በአመስጋኝነት” የሚለው ዐውዳዊ አማራጭ በማስታወሻ ተጠብቋል።
- source_word: ᾄδοντες ἐν ταῖς καρδίαις ὑμῶν τῷ θεῷ
  choice: በልባችሁ ለእግዚአብሔር … ዘምሩ
  rationale: የመዘመሩን የውስጥ ቅንነትና የተግባሩን ተቀባይ ይገልጣል፤ የአማርኛ ሐረግ እንዲፈስ ተሳቢ አንቀጹ በትእዛዝ ተገልጧል።
theological_decisions:
- issue: የΧριστοῦ አተረጓጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: ቃሉ እዚህ የተቀባውን ንጉሥ ማዕረግ ስለሚያመለክት “መሲሕ” የማዕረጉን ትርጉምና የአይሁድን ተስፋ ይጠብቃል።
- issue: የἐν ὑμῖν የግልና የማኅበር አቅጣጫ
