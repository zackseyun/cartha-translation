  text: In these things you too once walked[a], when you were living in them.
translation:
  language: am
  text: እናንተም ቀድሞ በእነዚህ ነገሮች[a] ተመላለሳችሁ፤ በእነዚህ ውስጥ ስትኖሩ ነበር።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “እናንተም ቀድሞ በእነዚህ ውስጥ ተመላለሳችሁ።” የግሪኩ አንጻራዊ ተውላጠ ስም ይበልጥ ቃል በቃል “በእነዚህ ውስጥ” ተብሎ ሊተረጎም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν οἷς
  choice: በእነዚህ ነገሮች
  rationale: የብዙ ቁጥር አንጻራዊ ተውላጠ ስሙ በቀደመው ክፍል የተጠቀሱትን ክፉ ምኞቶችና ተግባሮች ያመለክታል። “ነገሮች” የሚለውን መጨመር በአማርኛ ማጣቀሻውን ግልጽ ያደርጋል።
- source_word: καὶ ὑμεῖς
  choice: እናንተም
  rationale: “ም” ከአጽንዖት ካለው “እናንተ” ጋር በመጣመር፣ ቆላስይስ ራሳቸውም ቀድሞ በዚህ ኑሮ እንደተካፈሉ ያሳያል።
- source_word: περιεπατήσατε
  choice: ትመላለሱ ነበር
  rationale: የመራመድን ዘይቤያዊ ምስል ጠብቆ የቀድሞውን አኗኗርና ምግባር ያመለክታል፤ ከἐζῆτε ጋር ያለውን የቃል ልዩነትም አያጠፋም።
- source_word: ποτε
  choice: ቀድሞ
  rationale: ያለፈና አሁን የተተወ ጊዜን በተፈጥሯዊ አማርኛ ያመለክታል።
- source_word: ὅτε
  choice: በነበረ ጊዜ
  rationale: የቀድሞውን ምግባር ከቀድሞው የኑሮ ሁኔታ ጋር የሚያገናኘውን ጊዜያዊ ግንኙነት ያሳያል።
- source_word: ἐζῆτε
  choice: ትኖሩ በነበረ
  rationale: ያልተጠናቀቀውን የግስ አኳኋን እንደ ቀጣይ የቀድሞ ሁኔታ ይገልጣል፤ ከ“ትመላለሱ” የአኗኗር ዘይቤ ጋርም አይዋሃድም።
- source_word: ἐν τούτοις
  choice: በእነርሱ ውስጥ
  rationale: በፊት ወደተጠቀሱት ክፉ ነገሮች መልሶ ያመለክታል፤ “ውስጥ” የሚለውም በእነዚያ ነገሮች የተከበበውን የቀድሞ የኑሮ መስክ ያሳያል።
theological_decisions:
- issue: “ተመላለሱ” እና “ኖሩ” በጳውሎስ ሥነ ምግባራዊ ገለጻ ያላቸው ግንኙነት
  choice: የቀድሞውን ምግባር “ትመላለሱ ነበር” ብሎ፣ የቀድሞውን የኑሮ ሁኔታ ደግሞ “ትኖሩ በነበረ” ብሎ ለይቶ ማቅረብ
  alternative: ሁለቱንም ግሶች “ትኖሩ ነበር” ብሎ እንደ ተቀራራቢ ቃላት መተርጎም
  rationale: ይህ ምርጫ περιπατέω እና ζάω የሚሉትን የግሪክ ግሶች ልዩነት ይጠብቃል፤ ተጨማሪ የእምነት ሥርዓት ሳያስገባም የጳውሎስን ደረጃ ያለው ገለጻ ያስቀራል።
translation_notes:
  register: ዘመናዊ፣ የተከበረና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “ትመላለሱ ነበር” የጳውሎስን የመራመድ ዘይቤ ጠብቋል፤ ሁለተኛው ሐረግ ግን በአማርኛ በተፈጥሮ እንዲነበብ “ይህም … ነው” በሚል አወቃቀር ቀርቧል።
