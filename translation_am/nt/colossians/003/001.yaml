id: COL.3.1
reference: Colossians 3:1
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: Εἰ οὖν συνηγέρθητε τῷ Χριστῷ, τὰ ἄνω ζητεῖτε, οὗ ὁ Χριστός ἐστιν ἐν δεξιᾷ τοῦ θεοῦ καθήμενος·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/001.yaml
  text: If[a], then, you were raised with the Messiah, seek the things above[b], where the Messiah is, seated at the right hand of God.
translation:
  language: am
  text: እንግዲህ፣ ከመሲሑ ጋር ተነሥታችሁ ከሆነ[a]፣ መሲሑ በእግዚአብሔር ቀኝ ተቀምጦ ባለበት በላይ ያሉትን ነገሮች ፈልጉ[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «እንግዲህ፣ ከመሲሑ ጋር ስለተነሣችሁ።» የግሪኩ ንባብ ሁኔታዊ ቅርጽ («ከሆነ») ቢይዝም፣ በዐውዱ ሁኔታው እውነት መሆኑን እንደሚገምት ይታያል።
    reason: alternative_reading
  - marker: b
    text: ግሪኩ ቃል በቃል «በላይ ያሉትን» ይላል፤ በአማርኛ ለግልጽነት «ነገሮች» ተጨምሯል።
    reason: clarification
lexical_decisions:
- source_word: Εἰ οὖν
  choice: እንግዲህ ... ከሆነ
  rationale: የεἰን ሁኔታዊ ቅርጽና የοὖνን መደምደሚያዊ ኃይል በተፈጥሯዊ አማርኛ ይጠብቃል፤ አውዱ ሁኔታውን እውነት አድርጎ እንደሚወስድ በማስታወሻ ተገልጧል።
- source_word: συνηγέρθητε
  choice: ከሞት ተነሥታችሁ
  rationale: የግሱን ተደራጊ ቅርጽና የትንሣኤን ትርጉም በግልጽ አማርኛ ያሳያል፤ የσυν- አብሮነት ትርጉም በ«ከመሲሑ ጋር» ተሸክሟል።
- source_word: τῷ Χριστῷ / ὁ Χριστός
  choice: ከመሲሑ ጋር / መሲሑ
  rationale: Χριστός በዚህ አውድ የቅቡዕነት ማዕረግን ስለሚያመለክት «መሲሕ» ተብሎ ተተርጉሟል፤ የድርጊቱ አብሮነትም «ከ...ጋር» በሚለው ተጠብቋል።
- source_word: τὰ ἄνω
  choice: በላይ ያሉትን ነገሮች
  rationale: በግሪኩ ያለውን ገለልተኛ ብዙ ቁጥር ይጠብቃል፤ «ሰማያዊ ነገሮች» ብሎ ትርጉሙን ከልክ በላይ አይገድብም።
- source_word: ζητεῖτε
  choice: ፈልጉ
  rationale: የአሁን ጊዜ ትእዛዛዊ ግስን በቀጥተኛና ተፈጥሯዊ አማርኛ ያቀርባል፤ ቀጣይነቱ ከአውዱ ይታወቃል።
- source_word: οὗ
  choice: ባለበት
  rationale: ወደ «በላይ» የሚመለሰውን ስፍራዊ አንጻራዊ ቃል በተፈጥሯዊ የአማርኛ ዐረፍተ ነገር ያስተላልፋል።
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: በእግዚአብሔር ቀኝ
  rationale: የንጉሣዊ ክብርና ሥልጣን የተለመደውን መጽሐፍ ቅዱሳዊ ምስል ይጠብቃል።
- source_word: καθήμενος
  choice: ተቀምጦ
  rationale: የመሲሑን አሁናዊ ከፍ ያለ ስፍራ ያሳያል፤ «ነግሦ» ብሎ የተዘዋዋሪ ትርጓሜ አያስገባም።
theological_decisions:
- issue: በጳውሎስ ዐውድ Χριστόςን መተርጎም
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: በዚህ ጥቅስ የቅቡዕነት ማዕረጉ ንቁ ትርጉም አለው፤ ስለዚህ ከመሳሳት ይልቅ ትርጉሙን የሚያሳየው «መሲሕ» ተመርጧል።
- issue: የΕἰ ሁኔታዊ ሐረግ ኃይል
  choice: ሁኔታዊውን «ከሆነ» መጠበቅ
  alternative: «ከ... ጋር ከሞት ስለተነሣችሁ»
  rationale: አውዱ ነገሩን እውነት አድርጎ የሚወስድ ቢመስልም፣ ግሪኩ የያዘው ሁኔታዊ ቅርጽ ሳይፈታ ተጠብቋል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ ሁኔታዊ ውጥረት ተጠብቋል፣ የዐረፍተ ነገሩ ቅደም ተከተል ግን ለአማርኛ ተፈጥሯዊነት ተስተካክሏል።
