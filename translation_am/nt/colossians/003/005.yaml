lexical_decisions:
- source_word: Νεκρώσατε
  choice: ግደሉ
  rationale: የአንድ ጊዜ ወሳኝ እርምጃን የሚጠይቀውን የትእዛዝ ኃይል በግልጽና ቀጥተኛ ቃል ያስተላልፋል።
- source_word: οὖν
  choice: ስለዚህ
  rationale: ከቀደመው ሐሳብ የሚወጣውን ድምዳሜ ያሳያል።
- source_word: μέλη τὰ ἐπὶ τῆς γῆς
  choice: በምድር ላይ ያሉትን ብልቶች
  rationale: የግሪኩን የአካል ብልቶች ዘይቤና የቦታ አገላለጽ ይጠብቃል፤ በግሪኩ ያልተገለጸውን ‘የእናንተን’ አይጨምርም።
- source_word: πορνείαν
  choice: ዝሙት
  rationale: ሰፊውን የወሲብ ብልሹነት ሐሳብ በተለመደና በተከበረ የአማርኛ ቃል ያቀርባል።
- source_word: ἀκαθαρσίαν
  choice: ርኩሰት
  rationale: የሥነ ምግባር ንጽሕና እጦትን የሚገልጽ የተለመደ ቃል ነው።
- source_word: πάθος
  choice: ክፉ ስሜት
  rationale: በዚህ የክፉ ምግባሮች ዝርዝር ውስጥ πάθος የሚያመለክተውን የተዛባ ኃይለኛ ስሜት በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: ἐπιθυμίαν κακήν
  choice: ክፉ ምኞት
  rationale: κακήν የሚሰጠውን ግልጽ የሥነ ምግባር ግምገማ ይጠብቃል።
- source_word: πλεονεξίαν
  choice: ስግብግብነት
  rationale: ከልክ በላይ ለማግኘትና ለመያዝ ያለን የማይጠግብ ፍላጎት በዘመናዊና ግልጽ ቃል ይገልጻል።
- source_word: ἥτις ἐστὶν εἰδωλολατρία
  choice: ጣዖት አምልኮ የሆነው
  rationale: ስግብግብነትን ከጣዖት አምልኮ ጋር የሚያንድበትን ጠንካራ አገላለጽ ሳያለዝብ ይጠብቃል።
theological_decisions:
- issue: “ጣዖት አምልኮ የሆነው” የሚለው ሐረግ የሚመለከተው
  choice: በተለይ ስግብግብነትን ይመለከታል።
  alternative: የቀደመውን የክፉ ምግባሮች ዝርዝር በሙሉ ይጠቀልላል።
  rationale: ἥτις የሚለው ነጠላ ሴት ጾታ አንጻራዊ ተውላጠ ስም በቅርብ ካለው ነጠላ ሴት ጾታ ስም πλεονεξίαν ጋር በተፈጥሮ ይስማማል።
- issue: “በምድር ላይ ያሉትን ብልቶች” የሚለው አገላለጽ
  choice: የአካል ብልት ዘይቤውን በዋናው ጽሑፍ መጠበቅ።
  alternative: “ምድራዊ ባሕርያችሁን” ወይም “በእናንተ ያለውን ምድራዊ ነገር” ብሎ መተርጎም።
  rationale: ግሪኩ በቀጥታ ‘ብልቶች’ ይላል፤ የሚከተለው ዝርዝርም እነዚህ ምን እንደሆኑ የሚገልጽ ሆኖ ሊነበብ ይችላል። ዘይቤውን ማቆየት ጽሑፉ ያልገለጸውን ረቂቅ ትርጓሜ ከማስገባት ይቆጠባል።
