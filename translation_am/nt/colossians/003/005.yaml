base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/005.yaml
  text: 'Therefore[a], put to death the members that are on the earth: sexual immorality, impurity, passion, evil desire, and greed[b], which is idolatry.'
translation:
  language: am
  text: ስለዚህ፣ በምድር ላይ ያሉትን ብልቶች[a] ግደሉ፤ ዝሙትን፣ ርኩሰትን፣ ፍትወትን፣ ክፉ ምኞትን፣ እንዲሁም ጣዖት አምልኮ የሆነውን ስግብግብነትን[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በእናንተ ያለውን ምድራዊ ነገር።” ግሪኩ ቃል በቃል “በምድር ላይ ያሉትን ብልቶች” ይላል።
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “ንብረትን የመመኘት ፍላጎት።”
