  rationale: የτῆς τελειότητος የባለቤት አገባብ ማሰሪያው የፍጹምነት መሆኑን፣ ወይም ፍጹምነትን/ሙሉነትን ማምጣቱን ሊያመለክት ይችላል። አጭሩ ትርጉም ይህን ልዩነት አይዘጋም።
