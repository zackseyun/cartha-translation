  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: δι’ ἃ ἔρχεται ἡ ὀργὴ τοῦ θεοῦ ⸂ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας⸃·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/006.yaml
  text: Because of these things the wrath of God is coming upon the sons of disobedience[a].
translation:
  language: am
  text: በእነዚህ ነገሮች ምክንያት የእግዚአብሔር ቁጣ በየአለመታዘዝ ልጆች[a] ላይ እየመጣ ነው[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ቃል በቃል፣ “የአለመታዘዝ ልጆች”፤ ይህም አለመታዘዝ መለያቸው የሆነ ሰዎች ማለት ነው።
    reason: lexical_alternative
  - marker: b
    text: አንዳንድ የእጅ ጽሑፎች “በየአለመታዘዝ ልጆች ላይ” የሚለውን ሐረግ አያካትቱም።
    reason: textual_variant
lexical_decisions:
- source_word: δι’ ἃ
  choice: በእነዚህ ነገሮች ምክንያት
  rationale: διά ከተሳቢ መስተዋድድ ἃ ጋር ምክንያትን ይገልጣል፤ ይህ አተረጓጎምም በቀደመው ቁጥር የተጠቀሱትን ነገሮች በግልጽ ያመለክታል።
- source_word: ἔρχεται
  choice: እየመጣ ነው
  rationale: የግሱን የአሁን ጊዜ ቅርጽና የሚቀርብ ፍርድ ስሜት ይጠብቃል፤ ‘ይመጣል’ ከሚለው ይልቅ በመምጣት ላይ መሆኑን ያሳያል።
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: የእግዚአብሔር ቁጣ
  rationale: ὀργή በዚህ አውድ መለኮታዊና የፍርድ ቁጣን ያመለክታል፤ የግሪኩን የባለቤትነት ግንኙነትና ክብደት ይጠብቃል።
- source_word: ἐπὶ
  choice: ላይ
  rationale: ከተሳቢ ጋር የቁጣውን አቅጣጫና ዒላማ ያመለክታል፤ በአማርኛ የፍርድ አገላለጽ ውስጥ ‘ላይ’ ተፈጥሯዊ ነው።
- source_word: τοὺς υἱοὺς τῆς ἀπειθείας
  choice: በአለመታዘዝ ልጆች
  rationale: የግሪኩን ሴማዊ አነጋገር ቅርጽ ይጠብቃል፤ ትርጉሙ አለመታዘዝ መለያቸው የሆነ ሰዎች ማለት መሆኑ በማስታወሻ ተብራርቷል።
theological_decisions:
- issue: ‘የአለመታዘዝ ልጆች’ የሚለውን ፈሊጣዊ አገላለጽ መጠበቅ ወይስ ትርጉሙን በቀጥታ መግለጽ
  choice: ፈሊጣዊውን አገላለጽ በዋናው ጽሑፍ ማቆየት
  alternative: ‘የማይታዘዙ ሰዎች’ ወይም ‘አለመታዘዝ መለያቸው የሆኑ ሰዎች’
  rationale: ምንጩ ሰዎቹን በአለመታዘዝ የሚታወቁ እንደሆኑ በሴማዊ ፈሊጥ ይገልጣል። የምንጩን ቅርጽ በዋናው ጽሑፍ ማቆየትና ፍቺውን በማስታወሻ ማብራራት ሁለቱንም ይጠብቃል።
- issue: ‘በአለመታዘዝ ልጆች ላይ’ የሚለው ሐረግ የጽሑፍ ልዩነት
  choice: ሐረጉን በዋናው ጽሑፍ ማካተትና የጽሑፍ ልዩነቱን በማስታወሻ መግለጽ
  alternative: ሐረጉን ከዋናው ጽሑፍ ማስወገድ
  rationale: SBLGNT ሐረጉን በጽሑፉ ውስጥ ያካትታል፣ ነገር ግን የልዩ ንባብ ምልክት አድርጎበታል። ስለዚህ የተመረጠውን ጽሑፍ ማቅረብና ሌላውን የእጅ ጽሑፍ ማስረጃ አለመደበቅ ተገቢ ነው።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ቁጣ’ የፍርዱን ክብደት ይጠብቃል፤ ‘እየመጣ ነው’ ደግሞ የግሪኩን የአሁን ጊዜና የመቅረብ ስሜት ያስተላልፋል።
