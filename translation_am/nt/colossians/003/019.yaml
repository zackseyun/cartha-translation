  text: Husbands[a], love your wives, and do not be harsh toward them.
translation:
  language: am
  text: ባሎች ሆይ፣ ሚስቶቻችሁን ውደዱ፤ አትጨክኑባቸው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “በእነርሱ ላይ መራራ አትሁኑ።” የግሪኩ ግስ መራራ ወይም ቅር የተሰኘ ስሜት ማሳየትን ሊያመለክት ይችላል፤ በዚህ አውድ ግን ጨካኝ ወይም ከቂም የሚመነጭ አያያዝን ያመለክታል።
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἄνδρες
  choice: ባሎች ሆይ
  rationale: ἀνήρ ሰውን ወይም ባልን ሊያመለክት ቢችልም፣ የቤተሰብ መመሪያው አውድና ‘ሚስቶች’ የሚለው ተዛማጅ ቃል እዚህ ባሎችን እንደሚያመለክት ግልጽ ያደርጋሉ። ‘ሆይ’ የግሪኩን ቀጥተኛ አድራሻ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἀγαπᾶτε
  choice: ውደዱ
  rationale: የአሁን ጊዜ ትእዛዛዊ ኃይሉን በአጭርና ተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: τὰς γυναῖκας
  choice: ሚስቶቻችሁን
  rationale: γυνή ‘ሴት’ ወይም ‘ሚስት’ ሊሆን ይችላል፤ በዚህ የትዳር አውድ ‘ሚስቶች’ ትክክለኛው ትርጉም ነው። በአማርኛ የባለቤትነት ቅጥያው ግንኙነቱን ተፈጥሯዊ ያደርገዋል።
- source_word: μὴ πικραίνεσθε
  choice: መራራ አትሁኑ
  rationale: πικραίνω የመራርነትን፣ የመበሳጨትን ወይም የጨካኝነትን ሐሳብ ሊይዝ ይችላል። ‘መራራ አትሁኑ’ ዋናውን ምስልና በአመለካከት ያለውን አሻሚነት ሳያጠፋ ያቀርባል።
- source_word: πρὸς αὐτάς
  choice: በእነርሱም ላይ
  rationale: πρός ከተሳቢ ጋር የአመለካከትን ወይም የድርጊትን አቅጣጫ ያሳያል፤ ‘በእነርሱ ላይ’ ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
theological_decisions:
- issue: የቤተሰብ መመሪያና ጾታዊ አድራሻ
  choice: ‘ባሎች’ እና ‘ሚስቶቻችሁ’ በማለት ጾታዊውንና የትዳር ግንኙነቱን ጠብቆ ማቅረብ
  alternative: ‘ወንዶች’ እና ‘ሴቶች’ የሚሉ ሰፊ ቃላትን መጠቀም
  rationale: የግሪኩ አውድ በግልጽ ሁኔታ ባሎችን ከሚስቶቻቸው ጋር ባላቸው ግንኙነት ይናገራል፤ አጠቃላይ ወንዶችንና ሴቶችን አያመለክትም።
- issue: የπικραίνεσθε ትርጉማዊ ስፋት
  choice: በዋናው ጽሑፍ ‘መራራ አትሁኑ’ ብሎ ምስሉን መጠበቅ፣ የጨካኝ አያያዝን ፍቺ በማስታወሻ ማብራራት
  alternative: በዋናው ጽሑፍ ‘አትጨክኑባቸው’ ብሎ ብቻ መተርጎም
  rationale: ግሱ ውስጣዊ መራርነትንም ሆነ ከዚያ የሚመጣ ጨካኝ አያያዝን ሊያመለክት ይችላል። ዋናው ጽሑፍና ማስታወሻው አንድ ላይ ይህን የፍቺ ስፋት ይጠብቃሉ።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። የትእዛዝ ቅርጹ ቀጥተኛ ነው፤ ‘መራራ’ የሚለው ምስላዊ ቃል የምንጩን የፍቺ ውጥረት ይጠብቃል።
