  text: ἀπεθάνετε γάρ, καὶ ἡ ζωὴ ὑμῶν κέκρυπται σὺν τῷ Χριστῷ ἐν τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/003.yaml
  text: For you died, and your life has been hidden with the Messiah in God.
translation:
  language: am
  text: እናንተ ሞታችኋልና፣ ሕይወታችሁም ከመሲሑ[a] ጋር በእግዚአብሔር ተሰውራለች[b]።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከክርስቶስ ጋር።” የግሪኩ Χριστός “መሲሕ” ወይም “ክርስቶስ” ተብሎ ሊተረጎም ይችላል፤ እዚህ የማዕረጉን ትርጉም ለመጠበቅ “መሲሕ” ተብሏል።
    reason: alternative_reading
  - marker: b
    text: ወይም፣ “ተሰውራ አለች።” የግሪኩ ፍጹም ግስ ከተጠናቀቀ ድርጊት የተነሣውን የአሁን ሁኔታ አጽንዖት ሊሰጥ ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεθάνετε
  choice: ሞታችኋል
  rationale: የግሪኩ የአኦሪስት አመልካች ግስ ባለፈው ጊዜ የተፈጸመውን ወሳኝ ሞት ያመለክታል፤ የአማርኛው ፍጹም ግስ ይህን በተፈጥሯዊ አነጋገር ያቀርባል።
- source_word: γάρ
  choice: -ና
  rationale: ከቀደመው ምክር ጋር ያለውን የምክንያትና የማብራሪያ ግንኙነት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἡ ζωὴ ὑμῶν
  choice: ሕይወታችሁ
  rationale: የግሪኩን ‘ሕይወታችሁ’ የሚለውን ቀጥተኛ ትርጉም ያለ ትርጓሜያዊ ማስፋፊያ ይጠብቃል።
- source_word: κέκρυπται
  choice: ተሰውሯል
  rationale: ፍጹም ተደራጊ ግሱ የተፈጸመ ድርጊትንና የሚቀጥለውን ውጤታዊ ሁኔታ በአንድ ላይ ያሳያል።
- source_word: σὺν τῷ Χριστῷ
  choice: ከመሲሑ ጋር
  rationale: σύν የአብሮነትን ግንኙነት ያሳያል፤ Χριστός ደግሞ እዚህ የቅቡዕነት ማዕረግ ትርጉሙን እንዲጠብቅ ‘መሲሕ’ ተብሎ ተተርጉሟል።
- source_word: ἐν τῷ θεῷ
  choice: በእግዚአብሔር
  rationale: ἐν እዚህ የስፍራን ወይም የህልውና ክልልን ያመለክታል፤ ‘በእግዚአብሔር’ የግሪኩን አገባብ በተፈጥሯዊ አማርኛ ይጠብቃል።
theological_decisions:
- issue: Χριστῷን እንደ ማዕረግ ወይም እንደ ስም መተርጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: Χριστός በዚህ አውድ ‘የተቀባው’ የሚለውን የማዕረግ ትርጉም ይይዛል፤ ‘መሲሑ’ ይህን ትርጉም ግልጽ ያደርጋል፣ ነገር ግን ‘ክርስቶስ’ የሚለው የተለመደ አማራጭ በማስታወሻ ተጠብቋል።
- issue: የκέκρυπταιን ፍጹም ጊዜ አጽንዖት
  choice: ተሰውሯል
  alternative: ተሰውሮ አለ
  rationale: ዋናው ንባብ የተፈጸመውን ድርጊትና የአሁኑን ውጤት ያጣምራል፤ አማራጩ ደግሞ ቀጣዩን ሁኔታ ይበልጥ ጎልቶ ያሳያል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። የግሪኩ የምክንያት አያያዥ በ‘-ና’፣ የአብሮነት አገባብ በ‘ከ…ጋር’፣ የἐν ስፍራዊ/ክልላዊ ኃይል ደግሞ በ‘በእግዚአብሔር’ ቀርቧል።
