  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ የሚገባ አማርኛ ተጠቅሟል። «ብድራት» በዚህ ሃይማኖታዊ አውድ የrecompense/rewardን ሐሳብ በአጭር ይይዛል፤ ሐረጉም የምንጩን አጭር የተሳቢ ግንኙነት ጠብቋል።
