  text: knowing that from the Lord you will receive the reward of the inheritance[b][a]. Serve the Lord Messiah.
translation:
  language: am
  text: 'ከጌታ የርስቱን ብድራት እንደምትቀበሉ እያወቃችሁ፣ ጌታ መሲሕ[a] ነው የምታገለግሉት[b]።


    [a] በተለምዶ፣ «ጌታ ክርስቶስ» ተብሎም ሊተረጎም ይችላል።


    [b] የግሪኩ ግስ ቅርጽ አረጋጋጭ («የምታገለግሉት») ወይም ትእዛዛዊ («አገልግሉ») ሊሆን ይችላል፤ ሁለቱ ቅርጾች በጽሑፍ ተመሳሳይ ናቸው።'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በተለምዶ፣ «ጌታ ክርስቶስ» ተብሎም ሊተረጎም ይችላል።
    reason: alternative_reading
  - marker: b
    text: የግሪኩ ግስ ቅርጽ አረጋጋጭ («የምታገለግሉት») ወይም ትእዛዛዊ («አገልግሉ») ሊሆን ይችላል፤ ሁለቱ ቅርጾች በጽሑፍ ተመሳሳይ ናቸው።
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: እያወቃችሁ
  rationale: የግሪኩን አሳታፊ ግስ ከቀደመው ሐሳብ ጋር በማያያዝ ይጠብቃል፤ ምክንያታዊ ፍቺውንም ከልክ በላይ አይወስንም።
- source_word: ἀπὸ κυρίου
  choice: ከጌታ
  rationale: ἀπό ከተሳቢ ጋር የምንጭን ሐሳብ ያመለክታል፤ ብድራቱ ከጌታ ይመጣል።
- source_word: ἀπολήμψεσθε
  choice: እንደምትቀበሉ
  rationale: የወደፊት ጊዜ አረጋጋጭ ቅርጹን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ἀνταπόδοσιν
  choice: ብድራት
  rationale: የሚመለስ ዋጋን ወይም ሽልማትን የሚያመለክተውን አዎንታዊ ፍቺ በአጭርና ክቡር ቃል ይይዛል።
- source_word: τῆς κληρονομίας
  choice: የርስቱን
  rationale: የግሪኩን የባለቤትነት ቅርጽ በቀጥታ ይጠብቃል፤ ርስቱ ብድራቱ ራሱ መሆኑን ወይም ብድራቱን የሚገልጥ መሆኑን በትርጉም አይወስንም።
- source_word: τῷ κυρίῳ Χριστῷ
  choice: ጌታ መሲሕን
  rationale: κύριοςን «ጌታ»፣ የማዕረግ ኃይሉ ግልጽ የሆነውን Χριστόςን ደግሞ «መሲሕ» ብሎ ይተረጉማል።
- source_word: δουλεύετε
  choice: የምታገለግሉት … ነው
  rationale: የአሁን ጊዜ ሁለተኛ መደብ ብዙ ቁጥር አረጋጋጭ ቅርጹን በተፈጥሯዊ አማርኛ ይጠብቃል፤ እንደ ቀጥተኛ ትእዛዝ አይለውጠውም።
theological_decisions:
- issue: Χριστῷ በክርስቶሳዊ የማዕረግ ሐረግ ውስጥ ያለው አተረጓጎም
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: በዚህ ስፍራ Χριστός እንደ ስም ብቻ ሳይሆን እንደ ማዕረግ ይሠራል፤ «መሲሕ» ይህን የማዕረግ ኃይል ግልጽ ያደርጋል፣ የተለመደው አማራጭም በማስታወሻ ተጠብቋል።
- issue: የδουλεύετε ሰዋሰዋዊ ኃይል
  choice: አረጋጋጭ፦ «የምታገለግሉት … ነው»
  alternative: ትእዛዛዊ፦ «ጌታ መሲሕን አገልግሉ»
  rationale: የግሪኩ ቅርጽ የአሁን ጊዜ አረጋጋጭ እንጂ ትእዛዛዊ አይደለም፤ በአውዱም አማኞቹ በእውነት ለማን እንደሚያገለግሉ የሚያስታውስ ማበረታቻ ነው።
