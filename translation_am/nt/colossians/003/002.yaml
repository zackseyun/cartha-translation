- source_word: μὴ
  choice: ግን አይሁን
  rationale: ክልከላው የትእዛዙን ሁለተኛ ተሳቢ በተቃርኖ ይክዳል። በአማርኛ ግሱን ሳይደግሙ ይህን ትይዩ ንጽጽር ለማሳየት ‘ግን አይሁን’ ተፈጥሯዊ ነው።
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: በምድር ላይ ባሉት ነገሮች
