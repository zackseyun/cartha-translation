- source_word: γῆς
  choice: ምድር
  rationale: ከ‘በላይ’ ጋር ባለው ዓለማቀፋዊ ንጽጽር γῆ የተወሰነ አገርን ሳይሆን ምድርን ያመለክታል።
theological_decisions:
- issue: በφρονεῖτε ያለው የጳውሎስ ማሳሰቢያ ባሕርይ
