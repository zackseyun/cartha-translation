lexical_decisions:
- source_word: τὰ ἄνω
  choice: በላይ ባሉት ነገሮች
  rationale: በግሪክኛው መስተዋድድ ያለው ብዙ ቁጥር ከἄνω ጋር ሆኖ በላይ ያሉትን እውነታዎች ወይም ጉዳዮች ያመለክታል፤ ይህ አተረጓጎም ብዙ ቁጥሩንና ከምድራዊው ጋር ያለውን ተቃርኖ ይጠብቃል።
- source_word: φρονεῖτε
