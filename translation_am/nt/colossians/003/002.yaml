  verdict: revise
  source_fidelity: The draft correctly preserves the plural contrast between τὰ ἄνω (“the things above”) and τὰ ἐπὶ τῆς γῆς (“the things on the earth”). However, the second clause must explicitly repeat the imperative in Amharic to convey the negated command μὴ.
  naturalness: “አሳባችሁን አድርጉ” is understandable but less idiomatic than “ሐሳባችሁን … አድርጉ,” and “ግን አይሁን” is grammatically and stylistically weak here. Repeating “አታድርጉ” gives a clear, natural modern-standard imperative contrast.
  terminology: “በላይ ባሉት ነገሮች” and “በምድር ባሉት ነገሮች” faithfully retain the source’s substantive plurals and spatial contrast. The revised wording retains the broad mindset-orientation sense of φρονεῖτε without narrowing it to mere intellectual thought.
  issues:
  - severity: medium
    issue: 'The negated second clause is incomplete/unnatural: “በምድር ላይ ባሉት ነገሮች ላይ ግን አይሁን።”'
    rationale: μὴ negates the imperative φρονεῖτε. In Amharic, “አይሁን” does not naturally carry forward the plural imperative “set your minds”; the verb should be repeated as “አታድርጉ.”
  - severity: low
    issue: “አሳባችሁን አድርጉ” is less idiomatic in this exhortative context.
    rationale: “ሐሳባችሁን … አድርጉ” is a more natural and established Amharic expression for directing one’s mind toward something.
