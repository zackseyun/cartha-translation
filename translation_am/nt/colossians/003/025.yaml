lexical_decisions:
- source_word: ὁ γὰρ ἀδικῶν
  choice: ክፉ የሚያደርግ ሰው
  rationale: በግሪክኛው በመስተዋድድ የቀረበው የአሁን ጊዜ ተሳቢ ግስ በአጠቃላይ ክፉ የሚያደርግን ማንኛውንም ሰው ያመለክታል። ይህ አገላለጽ ተፈጥሯዊና ግልጽ ነው። γάρ በአውዱ የማብራሪያ ግንኙነት ቢኖረውም፣ በአማርኛ የአንቀጹ ፍሰት ያለ «ምክንያቱም» በቂ ግልጽ ነው።
- source_word: κομίσεται
  choice: ተገቢውን ይቀበላል
  rationale: ግሱ አንድ ሰው ከሠራው ጋር የሚመጣጠነውን መልሶ መቀበል ያመለክታል። «ተገቢውን ይቀበላል» የፍርድ ወይም የፍዳ አፈጻጸሙን ሳይወስን የብድራትን ሐሳብ ያስቀምጣል።
- source_word: ὃ ἠδίκησεν
  choice: ስላደረገው ክፉ ነገር
  rationale: የዝምድና ተውላጠ ስምና ያለፈ ጊዜ ግስ ሰውየው ያደረገውን የተፈጸመ ክፉ ሥራ ያመለክታሉ።
- source_word: οὐκ ἔστιν προσωπολημψία
  choice: አድልዎም የለም
  rationale: προσωπολημψία ሰውን በውጫዊ ሁኔታው፣ በማዕረጉ ወይም በማኅበራዊ አቋሙ መሠረት አድልቶ መፍረድን ያመለክታል። «አድልዎ» ዘመናዊ፣ ክቡርና በቀላሉ የሚገባ ቃል ነው።
- source_word: implicit generic masculine in ὁ ... ἀδικῶν / ἠδίκησεν
  choice: ሰው ... ያደረገው
  rationale: የግሪክኛው ቅርጽ ሰዋሰዋዊ ወንድ ነጠላ ቢሆንም አጠቃላይ ኃይል አለው። አማርኛው «ሰው» ይህን አጠቃላይነት በተፈጥሯዊ ሁኔታ ይጠብቃል።
theological_decisions:
- issue: የመለኮታዊ ፍርድ ባሕርይና አድልዎ አለመኖር
  choice: አንቀጹ ክፉ ያደረገ ሰው ለሠራው ተገቢውን እንደሚቀበልና አድልዎ እንደሌለ የሚገልጽ አጠቃላይ መርሕ ሆኖ ተተርጉሟል።
  alternative: ንግግሩን በመጨረሻው ፍርድ ብቻ መወሰን፣ ወይም በጌቶችና በባሪያዎች ማኅበራዊ ግንኙነት ብቻ ማጥበብ።
  rationale: የግሪክኛው አነጋገር ሰፊ ነው፤ የፍርዱን ጊዜ፣ ዘዴ ወይም ወሰን በግልጽ አይወስንም። ትርጉሙም ይህን የሥነ መለኮት ውጥረት አልፈታውም።
translation_notes:
  register: ዘመናዊ መደበኛ አማርኛ፣ ክቡር ነገር ግን ለተራ አንባቢ ግልጽ የሆነ አገላለጽ። «ክፉ የሚያደርግ ሰው» አጠቃላይ ማጣቀሻውን ይጠብቃል፤ «አድልዎ» ደግሞ የπροσωπολημψίαን ሐሳብ ከጥንታዊ ወይም ከቤተ እምነት-ተኮር ቃላት ውጭ ያቀርባል።
