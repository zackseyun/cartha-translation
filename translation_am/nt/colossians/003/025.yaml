    text: ወይም፣ «በደል የሚያደርግ ሰው ለሠራው በደል ተገቢውን ይቀበላል።»
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ «ለማንም ወገን ማድላት የለም።» ቃል በቃል፣ «ፊት መቀበል የለም»፤ ማለትም በውጫዊ ሁኔታ ወይም በማዕረግ ተመልክቶ ማድላት የለም።
