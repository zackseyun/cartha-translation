  terminology: '''በደል'' appropriately renders ἀδικία/ἀδικέω in this context, and ''አድልዎ'' is an accurate, modern rendering of προσωπολημψία. The note explains the literal face-related idiom and its sense of status-based favoritism without importing a doctrinal interpretation.'
