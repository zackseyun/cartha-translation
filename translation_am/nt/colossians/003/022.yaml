  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። “በሥጋ” እና “በዓይን አገልግሎት” የሚሉት ምንጭ-ቅርብ አገላለጾች የግሪክኛውን ምስልና የጳውሎስን ንጽጽር ለመጠበቅ ተቀምጠው፣ በግርጌ ማስታወሻ ተብራርተዋል።
