base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/022.yaml
  text: Servants[a], obey in everything those who are your masters according to the flesh, not with eye-service, as people-pleasers, but with sincerity of heart[b][c], fearing the Lord.
translation:
  language: am
  text: ባሪያዎች[a] ሆይ፣ በሁሉ ነገር በሥጋ ለሆኑት ጌቶቻችሁ[c] ታዘዙ፤ ሰዎችን ደስ እንደሚያሰኙ ሰዎች ሆናችሁ በዓይን አገልግሎት[b] ሳይሆን፣ ጌታን እየፈራችሁ በቅን ልብ ታዘዙ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ባሪያዎች” የተባለው የግሪክኛው δοῦλοι ቃል “አገልጋዮች” ወይም “የታሰሩ አገልጋዮች” ተብሎም ሊተረጎም ይችላል፤ ይሁን እንጂ ቃሉ በተለምዶ በጌታ ሥልጣን ሥር ያለን በባርነት የተያዘ ሰው ያመለክታል።
    reason: lexical_alternative
  - marker: c
    text: “በሥጋ ለሆኑት ጌቶቻችሁ” የሚለው “ምድራዊ ጌቶቻችሁ” ተብሎም ሊተረጎም ይችላል፤ ይህም ሥልጣናቸው በዚህ ዓለም ባለው ሰብአዊ ግንኙነት የተወሰነ መሆኑን ያጎላል።
    reason: lexical_alternative
  - marker: b
    text: “በዓይን አገልግሎት” ማለት ሰው ሲያይ ብቻ የሚሠራ ሥራ ማለት ነው።
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δοῦλοι
  choice: ባሪያዎች
  rationale: በዚህ የቤተሰብ ሥርዓት አውድ δοῦλοι በጌታ ሥልጣን ሥር የነበሩ በባርነት የተያዙ ሰዎችን ያመለክታል፤ “አገልጋዮች” ማለት ታሪካዊውን ሁኔታ ያለዝባል።
- source_word: ὑπακούετε κατὰ πάντα
  choice: በሁሉ ነገር ታዘዙ
  rationale: የትእዛዝ አኳኋኑንና κατὰ πάντα ያለውን ሰፊ ወሰን በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: τοῖς κατὰ σάρκα κυρίοις
  choice: በሥጋ ጌቶቻችሁ የሆኑትን
  rationale: κατὰ σάρκα የሚለውን የጳውሎስ አገላለጽ በመጠበቅ የሰው ጌቶች ሥልጣን ከጌታ ሥልጣን ጋር ያለውን ንጽጽር ያቆያል።
- source_word: μὴ ἐν ὀφθαλμοδουλίαις
  choice: በዓይን አገልግሎት አታገልግሉ
  rationale: የግሪክኛውን ውሁድ ቃል ምስል ይጠብቃል፤ ከግርጌ ማስታወሻውም ጋር ሲነበብ ሰው ሲያይ ብቻ ማገልገልን በግልጽ ያሳያል።
- source_word: ὡς ἀνθρωπάρεσκοι
  choice: ሰዎችን ደስ ለማሰኘት እንደሚጥሩ ሰዎች
  rationale: የሰውን ውዳሴ ለማግኘት የሚደረገውን አገልግሎት በተፈጥሯዊና ግልጽ አማርኛ ይገልጻል።
- source_word: ἀλλ’ ἐν ἁπλότητι καρδίας
  choice: ይልቁንም … በቅን ልብ
  rationale: ἁπλότης በዚህ አውድ የልብ ቅንነትንና ያልተከፋፈለ ዓላማን ያመለክታል እንጂ የአእምሮ ቀላልነትን አይደለም።
- source_word: φοβούμενοι τὸν κύριον
  choice: ጌታን እየፈራችሁ
  rationale: φοβούμενοι የሚያሳየውን ቀጣይ አኳኋንና መንፈሳዊ ተነሳሽነት ይጠብቃል፤ κύριος እዚህ መለኮታዊ ማዕረግ ነው።
theological_decisions:
- issue: በባርነት አውድ የተሰጠ ሥነ ምግባራዊ ትእዛዝ
  choice: ታሪካዊውን ማኅበራዊ ሁኔታ “ባሪያዎች…ጌቶች” በማለት በግልጽ ማቅረብ፣ ተቋሙን እንደሚደግፍ ሳይጨምሩ የሰው ጌቶችና የጌታ ልዩነትን ማቆየት
  alternative: ቃላቱን “አገልጋዮች” ወይም “ሠራተኞች” በማለት ከዘመናዊ የቅጥር ግንኙነት ጋር ማመሳሰል
  rationale: የግሪክኛው የቤተሰብ ሥርዓት ቃላት የጥንቱን ባርነት ያመለክታሉ፤ እንደ ዘመናዊ ቅጥር መተርጎም በጽሑፉ ውስጥ ያለውን ታሪካዊና ሥነ ምግባራዊ ውጥረት ይሸፍናል።
- issue: κύριος ለሰው ጌቶችና ለመለኮታዊው ጌታ መጠቀሙ
  choice: በመጀመሪያው ሐረግ “ጌቶቻችሁ”፣ በመጨረሻው “ጌታን” ማለት
  alternative: የመጨረሻውንም “ጌታችሁን” ወይም “አለቃውን” ማለት
  rationale: ተመሳሳይ የጌትነት ቃል ቢጠቀምም፣ ዐውዱ የመጨረሻውን κύριος መለኮታዊ ማዕረግ እንደሆነ ያሳያል፤ ይህም ከሰው ጌቶች ጋር ያለውን የሥልጣን ንጽጽር ይጠብቃል።
