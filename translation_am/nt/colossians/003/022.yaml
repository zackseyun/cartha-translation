review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies δοῦλοι as enslaved persons, retains the contrast between human masters and the Lord, and renders the principal terms faithfully. However, it changes the Greek construction by introducing two explicit imperatives ('አታገልግሉ' ... 'አገልግሉ') where the source has one governing imperative, qualified by contrasting prepositional phrases. The revision preserves the single-command structure more closely.
  naturalness: Several expressions are understandable, but 'በሥጋ ጌቶቻችሁ የሆኑትን' is not natural standard Amharic word order, and the repeated service imperatives are less smooth than a single, parallel formulation. The revised wording is idiomatic while retaining the source’s imagery.
  terminology: '''ባሪያዎች,'' ''ጌቶቻችሁ,'' ''ጌታን,'' and ''በቅን ልብ'' are suitable. ''በዓይን አገልግሎት'' appropriately preserves the source-near image and is sufficiently explained by its footnote.'
  issues:
  - severity: medium
    issue: The draft adds a negative imperative and a contrasting positive imperative for the eye-service/sincerity contrast.
    rationale: Greek has one imperative, ὑπακούετε ('obey'), followed by μὴ ... ἀλλά ... modifiers. Rendering the contrast as two separate commands is interpretively acceptable but less source-faithful and obscures the syntactic parallelism.
  - severity: low
    issue: The phrase 'በሥጋ ጌቶቻችሁ የሆኑትን' is awkward and can momentarily sound as though the slaves themselves are the referent.
    rationale: Reordering it as 'በሥጋ ለሆኑት ጌቶቻችሁ' naturally identifies the human masters while retaining the literal 'according to the flesh' qualifier.
