  text: bearing with one another and forgiving each other[a], if anyone has a complaint against anyone; just as the Lord also forgave you[b], so also you must do.
translation:
  language: am
  text: እርስ በርሳችሁ ተቻቻሉ፤ ማንም በሌላው ላይ ቅሬታ[a] ቢኖረው፣ እርስ በርሳችሁ ይቅር በሉ። ጌታ ይቅር እንዳላችሁ፣ እናንተም እንዲሁ አድርጉ።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “ማንም በሌላው ላይ የወቀሳ ምክንያት ቢኖረው።”
    reason: lexical_alternative
  - marker: b
    text: ግሪኩ በመጨረሻው ሐረግ ግሱን አይደግመውም፤ ከአውዱ “እናንተም እንዲሁ ይቅር በሉ” የሚለው ትርጉም ይገባል።
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνεχόμενοι ἀλλήλων
  choice: እርስ በርሳችሁ ተቻቻሉ
  rationale: ቀጣይነት ያለውን የማኅበረሰብ መቻቻል በተፈጥሯዊና ክብር ባለው ዘመናዊ አማርኛ ያስተላልፋል፤ ከ‘ታገሡ’ ይልቅ የጋራ ግንኙነቱን ያጎላል።
- source_word: χαριζόμενοι ἑαυτοῖς
  choice: እርስ በርሳችሁ ይቅር ተባባሉ
  rationale: በዚህ አውድ χαρίζομαι በደልን ይቅር ማለትን ያመለክታል፤ የመስተጋብር ቅርጹ ἑαυτοῖς ያለውን የእርስ በርስ ትርጉም ይጠብቃል።
- source_word: ἐάν τις πρός τινα ἔχῃ μομφήν
  choice: ማንም በሌላው ላይ ቅሬታ ቢኖረው
  rationale: አጠቃላይና ያልተወሰነውን ሁኔታዊ አነጋገር ይጠብቃል፤ ‘ቅሬታ’ μομφή የሚያመለክተውን የወቀሳ ምክንያት ሳያጠናክር በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: καθὼς καὶ
  choice: እንዳላችሁ
  rationale: የጌታን ይቅርታ ከአማኞች ተግባር ጋር የሚያነጻጽረውን ኃይል በአማርኛው ንጽጽራዊ ቅርጽ ያስተላልፋል።
- source_word: ὁ κύριος
  choice: ጌታ
  rationale: የክርስቶስ መጠሪያ ሊሆን የሚችለውን ማዕረግ ሳይገድብ በመደበኛው መጽሐፍ ቅዱሳዊ አማርኛ ያቀርባል።
- source_word: ἐχαρίσατο ὑμῖν
  choice: ይቅር እንዳላችሁ
  rationale: ቀደም ሲል ከተጠቀሰው χαριζόμενοι ጋር ያለውን የቃል ትስስር በ‘ይቅር’ ይጠብቃል፣ የተፈጸመውንም ድርጊት ያሳያል።
- source_word: οὕτως καὶ ὑμεῖς
  choice: እናንተም እንዲሁ አድርጉ
  rationale: በግሪክ ያልተደገመውን ግስ ለተፈጥሯዊ አማርኛ በአጠቃላይ ‘አድርጉ’ ይሞላል፤ ከአውዱ ይቅር ማለት እንደሆነ ግልጽ ሲሆን ከምንጩ በላይ አይገድብም።
theological_decisions:
- issue: የὁ κύριος ተጠቃሽ
  choice: ‘ጌታ’ ብቻ በማለት የማዕረጉን ክፍትነት መጠበቅ
  alternative: በግልጽ ‘ክርስቶስ’ ወይም ‘እግዚአብሔር’ ማለት
  rationale: በቆላስይስ አውድ በተፈጥሮ ክርስቶስን ሊያመለክት ቢችልም፣ ግሪኩ ራሱ ‘ጌታ’ ይላል፤ ትርጉሙም ከምንጩ በላይ ተጠቃሹን አይወስንም።
- issue: በመጨረሻው ሐረግ ያለው የግስ መቅረት
  choice: ‘እንዲሁ አድርጉ’ ብሎ ያልተነገረውን ግስ በአጠቃላይ ማሟላት
  alternative: ‘እናንተም እንዲሁ’ ብሎ እንደ ግሪኩ ያለ ግስ መተው፣ ወይም ‘እናንተም ይቅር በሉ’ ብሎ በግልጽ ማሟላት
  rationale: ያለ ግስ የሚቀርበው ሐረግ በአማርኛ ያልተሟላ ይመስላል። ‘አድርጉ’ ትእዛዙን ግልጽ ያደርጋል፣ ነገር ግን ግሪኩ በመጨረሻ የይቅርታውን ግስ እንዳልደገመ የግርጌ ማስታወሻው ይገልጣል።
