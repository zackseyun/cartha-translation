  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ አማርኛ ተጠቅሟል። ‘ተቻቻሉ’ እና ‘ይቅር ተባባሉ’ የማኅበረሰቡን የእርስ በርስ ግዴታ በተፈጥሯዊ መልኩ ያሳያሉ።
