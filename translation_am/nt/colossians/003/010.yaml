  source_fidelity: The draft correctly preserves the clothing metaphor, the completed force of ἐνδυσάμενοι, the ongoing passive sense of ἀνακαινούμενον, and the directional wording of εἰς ἐπίγνωσιν. However, “እርሱን በፈጠረው አምሳል” is syntactically prone to mean “the image by which he created him,” rather than “the image of his creator,” and the doubled pronouns are unnecessarily awkward.
