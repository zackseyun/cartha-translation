  rationale: ግሪክኛው «በሁሉም ነገር» ከሚለው በኋላ ግልጽ የማይካተት ሁኔታ አያክልም፤ «በጌታ»ም በሰዋስው ከ«ደስ የሚያሰኝ» ጋር ቅርብ ነው። ስለዚህ ትርጉሙ ነገረ መለኮታዊውን ውጥረት ሳይፈታ የምንጩን አገላለጽ ይጠብቃል።
