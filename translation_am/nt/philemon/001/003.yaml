  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: am
  text: ጸጋና ሰላም ከእግዚአብሔር ከአባታችን እና ከጌታ ኢየሱስ መሲሕ[a] ለእናንተ ይሁን።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፦ “ኢየሱስ ክርስቶስ።” የግሪክኛው Χριστός “መሲሕ” እንደሚል ማዕረግ ወይም በአንዳንድ አውዶች እንደ ስም በሚመስል መንገድ “ክርስቶስ” ተብሎ ሊያገለግል ይችላል።
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: ጸጋ
  rationale: በጳውሎሳዊ ሰላምታ ውስጥ የቃሉን የሰላምታም ሆነ ጥልቅ ሥነ መለኮታዊ ይዘት የሚጠብቅ የተለመደ አማርኛ አቻ ነው።
- source_word: ὑμῖν
  choice: ለእናንተ
  rationale: የድርጊቱን ተቀባዮች በተፈጥሯዊ የአማርኛ ሰላምታ አገባብ ይገልጣል።
- source_word: εἰρήνη
  choice: ሰላም
  rationale: የሰላምታውን ትርጉምና ከዕብራይስጡ ሻሎም ጋር ያለውን ሰፊ የደኅንነት ሐሳብ የሚያስተላልፍ መደበኛ አቻ ነው።
- source_word: ἀπὸ
  choice: ከ…
  rationale: የጸጋና የሰላምን ምንጭ በግልጽ ያመለክታል።
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: ከአባታችን ከእግዚአብሔር
  rationale: የግሪክ ሐረጉን ተዛማጅ አገባብ ‘እግዚአብሔር፣ አባታችን’ በተፈጥሯዊ አማርኛ ያስተላልፋል፤ ሁለት የተለያዩ አካላትን አያመለክትም።
- source_word: κυρίου
  choice: ጌታ
  rationale: የክብርና የክርስቶሳዊ ማዕረግ ኃይሉን የሚጠብቅ የተለመደ አማርኛ አቻ ነው።
- source_word: Ἰησοῦ Χριστοῦ
  choice: ኢየሱስ መሲሕ
  rationale: ኢየሱስን እንደ ስም በመጻፍ፣ Χριστόςን ደግሞ ‘የተቀባው’ የሚለውን የማዕረግ ትርጉም በሚያሳይ ‘መሲሕ’ ተርጉሟል።
theological_decisions:
- issue: በἸησοῦ Χριστοῦ ውስጥ Χριστοῦን እንዴት ማቅረብ እንደሚገባ
  choice: ኢየሱስ መሲሕ
  alternative: ኢየሱስ ክርስቶስ
  rationale: Χριστός በዚህ ሐረግ የማዕረግ ኃይሉን እንደያዘ ሊነበብ ስለሚችል ‘መሲሕ’ ትርጉሙን ግልጽ ያደርጋል፤ ሆኖም ‘ክርስቶስ’ የሚለው ስምን የመሰለ የተለመደ አቀራረብም በማስታወሻ ተጠብቋል።
translation_notes:
  register: ትርጉሙ ዘመናዊ፣ ክቡርና ለተራው አንባቢ ግልጽ የሆነ የአማርኛ የቡራኬ አገባብን ይጠቀማል። በግሪክኛው የተገለጸ ግስ ባይኖርም፣ ‘ይሁን’ በአማርኛ የሰላምታውን የተገመተ ትርጉም በተፈጥሯዊ ሁኔታ ያሟላል።
