  to: ነገር ግን፣ በማንኛውም ነገር በድሎህ ከሆነ ወይም ላንተ ዕዳ ካለበት፣ ይህን በእኔ ሒሳብ ላይ መዝግበው።[a]
  rationale: The revised text retains the source's conditional and its deliberately broad references to a possible wrong or debt. It explicitly indicates that the debt is owed to the addressee and renders the imperative as an instruction to enter the liability on Paul's account. The footnote supplies a natural alternative while explaining the underlying accounting metaphor.
