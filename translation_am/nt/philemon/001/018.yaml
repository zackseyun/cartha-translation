  text: But if he has wronged you in any way or owes you anything[a], charge this to me.
translation:
  language: am
  text: ነገር ግን፣ በማንኛውም ነገር በድሎህ ከሆነ ወይም ላንተ ዕዳ ካለበት፣ ይህን በእኔ ሒሳብ ላይ መዝግበው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ይህን ለእኔ አስከፍለው።» ግሱ አንድን ነገር በአንድ ሰው ሒሳብ ላይ የመመዝገብ ወይም የመጫን የሒሳብ አያያዝ ፍቺ አለው።
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: ነገር ግን … እንደሆነ
  rationale: δέ የሚያሳየውን መጠነኛ ተቃርኖ በ«ነገር ግን»፣ εἰ የሚያሳየውን ሁኔታ ደግሞ በ«እንደሆነ» ያቀርባል።
- source_word: τι ἠδίκησέν σε
  choice: በምንም ነገር በድሎህ
  rationale: ἀδικέω የግልንም ሆነ የንብረትን በደል ሊያካትት ስለሚችል «በድሎህ» ሰፊ ትርጉሙን ይጠብቃል፤ τι ደግሞ በ«በምንም ነገር» ተገልጧል።
- source_word: ἢ ὀφείλει
  choice: ወይም ዕዳ ኖሮበት
  rationale: ὀφείλω እዚህ የገንዘብ ወይም ሌላ ግዴታ መኖሩን ያመለክታል፤ «ዕዳ ኖሮበት» ይህን በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: τοῦτο
  choice: ይህን
  rationale: ከዚህ በፊት የተጠቀሰውን በደል ወይም ዕዳ ወደ ኋላ የሚያመለክት ቀጥተኛ ተመሳሳይ ነው።
- source_word: ἐμοὶ ἐλλόγα
  choice: በእኔ ላይ ቍጠረው
  rationale: ἐλλογέω ያለውን የሒሳብ መዝገብ ላይ የመቍጠር ወይም ዕዳን ለአንድ ሰው የማስከፈል ምሳሌያዊ ፍቺ ይጠብቃል።
