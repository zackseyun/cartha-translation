  text: τάχα γὰρ διὰ τοῦτο ἐχωρίσθη πρὸς ὥραν ἵνα αἰώνιον αὐτὸν ἀπέχῃς,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/015.yaml
  text: For perhaps he was separated from you for a time so that you might have him back forever,[a]
translation:
  language: am
  text: ምናልባትም ከአንተ ለጥቂት ጊዜ የተለየው ለዚህ ነው፤ ለዘላለም መልሰህ እንድታገኘው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ለጥቂት ጊዜ ከአንተ ሄደ።” በግሪኩ “የተለየ” የሚለው ተገብሮ ቅርጽ ቀጥተኛ ወቀሳን በለዘብታ ያስወግዳል፤ እንዲሁም ሳይገልጽ የመለኮታዊ ዓላማ ፍንጭ እንዲኖር ቦታ ይተዋል።
    reason: alternative_reading
lexical_decisions:
- source_word: τάχα
  choice: ምናልባትም
  rationale: የጳውሎስን ጥንቃቄ የተሞላበትና የማያረጋግጥ ግምት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: γὰρ
  choice: -ም / ከአውዱ ጋር የተዋሐደ ማብራሪያዊ ግንኙነት
  rationale: በአማርኛ የቀደመውን ሐሳብ የሚያብራራው ግንኙነት ‘ምናልባትም’ በሚለው አገባብና በዓረፍተ ነገሩ ፍሰት ተገልጧል።
- source_word: διὰ τοῦτο
  choice: ለዚህ ነው
  rationale: የምክንያትን ወይም የዓላማን ግንኙነት ግልጽና ተፈጥሯዊ በሆነ አገላለጽ ያቀርባል።
- source_word: ἐχωρίσθη
  choice: ከአንተ የተለየው
  rationale: የግሪኩን ተገብሮ አድራጊውን ሳይጠቅስ ይጠብቃል፤ በዚህም አናሲሞስ ራሱ ሄደ ወይም እግዚአብሔር ለየው ብሎ አይወስንም።
- source_word: πρὸς ὥραν
  choice: ለጥቂት ጊዜ
  rationale: ቃል በቃል ‘ለአንድ ሰዓት’ ሳይሆን የተወሰነና አጭር ጊዜ ማለቱን በዘመናዊ አማርኛ ያሳያል።
- source_word: ἵνα
  choice: እንድታገኘው
  rationale: የዓላማን ወይም የታሰበ ውጤትን ግንኙነት በአማርኛ የንዑስ ዓረፍተ ነገር ቅርጽ ያስተላልፋል።
- source_word: αἰώνιον
  choice: ለዘላለም
  rationale: ከጥቂት ጊዜው መለየት ጋር ያለውን ተቃርኖ ያስጠብቃል፤ ረጅም ዘመንንም ሆነ መንፈሳዊ ዘላቂነትን ሊያመለክት የሚችለውን ስፋት አይዘጋም።
- source_word: αὐτὸν
  choice: -ው
  rationale: የተሳቢ ተውላጠ ስም ቅጥያው አናሲሞስን ያመለክታል።
- source_word: ἀπέχῃς
  choice: መልሰህ እንድታገኘው
  rationale: በአውዱ ያለውን እንደገና ማግኘትና ዘላቂ ግንኙነት የሚያመለክት ትርጉም በተፈጥሯዊ አማርኛ ይገልጣል።
theological_decisions:
- issue: በἐχωρίσθη ተገብሮ የተሰወረው አድራጊ
  choice: ‘ከአንተ የተለየው’ በማለት ተገብሮውን ማስጠበቅ
  alternative: ‘ከአንተ ሄደ’ ወይም ‘እግዚአብሔር ከአንተ ለየው’
  rationale: ምንጩ አድራጊውን አይጠቅስም። ይህ አገላለጽ ቀጥተኛ ወቀሳን ሊያለዝብ እና መለኮታዊ አሳብን ሊያመለክት ይችላል፤ ትርጉሙም አንዱን ብቻ አይወስንም።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ተገብሮና የτάχα ጥንቃቄ ተጠብቀዋል፤ የአጭር ጊዜና የዘላለም ተቃርኖም ጎልቶ ቀርቧል።
