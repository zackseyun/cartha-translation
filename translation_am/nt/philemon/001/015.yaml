  source_fidelity: The draft preserves the tentative force of τάχα, the temporary-versus-enduring contrast, and the unnamed agency of ἐχωρίσθη. However, its clause order makes διὰ τοῦτο (“for this reason”) less clearly govern the separation and its following purpose clause.
