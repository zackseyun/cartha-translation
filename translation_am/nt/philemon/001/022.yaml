  yaml_path: translation/nt/philemon/001/022.yaml
  text: At the same time also prepare a guest room for me[b][a], for I hope that through your prayers I will be granted to you.
translation:
  language: am
  text: በተጨማሪም ለእኔ የእንግዳ ማረፊያ አዘጋጅ፤[a] በጸሎታችሁ በጸጋ ለእናንተ እንደምሰጥ ተስፋ አደርጋለሁና።[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “የእንግዳ ማረፊያ” የሚለው “ማረፊያ” ወይም “መስተንግዶ” ተብሎም ሊተረጎም ይችላል፤ የግሪኩ ቃል ለእንግዳ የተዘጋጀ ቦታን ወይም የመስተንገድ ተግባርን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: b
    text: “ለእናንተ እንደምሰጥ” ወይም “ለእናንተ እንደምታደል” ተብሎም ሊተረጎም ይችላል፤ የግሪኩ ግስ በነፃ ወይም በጸጋ መሰጠትን ያመለክታል፤ ሰጪው እግዚአብሔር መሆኑን ሳይገልጽ ሊጠቁም ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα δὲ καὶ
  choice: በዚሁ ጊዜ ደግሞ
  rationale: ቀደም ካለው ልመና ጋር ተጨማሪ ጥያቄ መሆኑን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἑτοίμαζέ μοι
  choice: አዘጋጅልኝ
  rationale: ትእዛዛዊውን ቅርጽና μοι የሚያመለክተውን ተጠቃሚነት በአጭርና ተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: ξενίαν
  choice: ማረፊያ
  rationale: በዐውዱ የሚዘጋጅ የእንግዳ መኖሪያ ቦታን በተፈጥሯዊ ሁኔታ ይገልጣል፤ ቃሉ መስተንግዶንም ሊያመለክት ስለሚችል አማራጩ በማስታወሻ ቀርቧል።
- source_word: ἐλπίζω γὰρ ὅτι
  choice: ተስፋ አደርጋለሁና
  rationale: γάρ ምክንያት ሰጪ መሆኑን በአማርኛው ‘-ና’ ያስቀምጣል፤ ἐλπίζω ደግሞ በቀጥታ ተተርጉሟል።
- source_word: διὰ τῶν προσευχῶν ὑμῶν
  choice: በጸሎታችሁ አማካይነት
  rationale: διά ከዘር ስም ጋር ያለውን የመንገድ ወይም የመሣሪያ ትርጉም በግልጽ ሁኔታ ይጠብቃል።
- source_word: χαρισθήσομαι ὑμῖν
  choice: ለእናንተ እንደምሰጥ
  rationale: የወደፊት ጊዜ ተደራጊ ቅርጹን ይጠብቃል፤ ሰጪውን በግልጽ ሳይጨምር ጳውሎስ ራሱ ለተቀባዮቹ እንደሚሰጥ ያለውን ተስፋ ያስተላልፋል። የጸጋ ወይም የነጻ ስጦታ ጥላ በማስታወሻ ተገልጧል።
theological_decisions:
- issue: χαρισθήσομαι የሚያመለክተው ሰጪና የጳውሎስ መመለስ
  choice: ጳውሎስ ለእነርሱ እንደሚሰጥ በተደራጊ አነጋገር መተርጎም፣ ሰጪውን ግን በዋናው ጽሑፍ አለመጥቀስ
  alternative: እግዚአብሔር ወደ እናንተ እንደሚመልሰኝ፤ ወይም እንደምፈታ
  rationale: የግሪኩ ተደራጊ ቅርጽ መለኮታዊ አድራጊነትን ሊጠቁም ቢችልም ሰጪውንም ሆነ ከእስር መፈታትን በግልጽ አይጠቅስም። ስለዚህ አሻሚነቱ ተጠብቋል።
