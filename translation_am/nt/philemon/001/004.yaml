- source_word: μνείαν σου ποιούμενος
  choice: አንተን እያነሳሁ
  rationale: ቃል በቃል ‘ስለ አንተ መጥቀስን እያደረግሁ’ የሚለውን ፈሊጥ፣ በጸሎት ውስጥ ሰውን በስም ወይም በሐሳብ ማንሳት በሚለው ተፈጥሯዊ አማርኛ ያቀርባል፤ ከዋናው ግስ ጋር የሚከናወነውን ተጓዳኝ ድርጊትም ‘እያ-’ ይጠብቃል።
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: በጸሎቴ ጊዜ ሁሉ
  rationale: ἐπί ከዝርያ ቅጽ ጋር በዚህ የጸሎት ፈሊጥ ‘በጸሎቴ ጊዜ/በጸሎቴ’ የሚለውን ይሰጣል። ብዙ ቁጥሩን በአማርኛ ተፈጥሯዊ በሆነው ‘ጊዜ ሁሉ’ የተደጋጋሚነት አገላለጽ አስተላልፏል።
