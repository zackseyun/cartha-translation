  naturalness: The revised wording uses idiomatic modern Amharic, retains the participial relationship through “እየጠቀስሁ,” and avoids the cumbersome double temporal wording. The plural “ጸሎቶቼ” represents the Greek plural naturally.
  terminology: “አምላኬን አመሰግናለሁ” appropriately renders εὐχαριστῶ τῷ θεῷ μου. “ስለ አንተ እየጠቀስሁ” accurately conveys μνείαν σου ποιούμενος without narrowing it merely to inward remembrance.
