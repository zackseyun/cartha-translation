  text: τόν ποτέ σοι ἄχρηστον νυνὶ ⸀δὲ σοὶ καὶ ἐμοὶ εὔχρηστον,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/011.yaml
  text: who once was useless to you[a], but now is useful both to you and to me,
translation:
  language: am
  text: ቀድሞ ለአንተ የማይጠቅም ነበር፤[a] አሁን ግን ለአንተም ለእኔም የሚጠቅም ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ጳውሎስ “ኦኔሲሞስ” በሚለው ስም ላይ የቃል ጨዋታ እያደረገ ሊሆን ይችላል፤ ስሙ “ጠቃሚ” ወይም “ጥቅም የሚሰጥ” ከሚለው ሐሳብ ጋር ይዛመዳል።
    reason: lexical_alternative
lexical_decisions:
- source_word: τόν
  choice: — (ቀዳሚውን ኦኔሲሞስን በተዘዋዋሪ የሚያመለክት)
  rationale: የግሪኩ አንቀጽ በክስ ቅርጽ ቀደም ሲል የተጠቀሰውን ኦኔሲሞስን ያመለክታል። በአማርኛ የቀደመው ዐረፍተ ነገር ቀጣይ ክፍል ስለሆነ የተለየ አንጻራዊ ተውላጠ ስም ሳይጨመር በተፈጥሮ ይገባል።
- source_word: ποτέ
  choice: ቀድሞ
  rationale: ከνυνὶ (‘አሁን’) ጋር ያለውን ግልጽ የጊዜ ንጽጽር በዘመናዊና ተፈጥሯዊ አማርኛ ያሳያል።
- source_word: σοι
  choice: ለአንተ
  rationale: ዳቲቩ በዚህ የግል ግንኙነት አውድ ‘ለአንተ’ ተብሎ በግልጽ ይተረጎማል።
- source_word: ἄχρηστον
  choice: የማይጠቅም
  rationale: ‘ጥቅም የሌለው/የማይጠቅም’ የሚለውን ቀጥተኛ ፍቺ ያስተላልፋል፤ ከεὔχρηστον ጋር ያለውን የቃል ንጽጽርም ይጠብቃል።
- source_word: νυνὶ δὲ
  choice: አሁን ግን
  rationale: ከቀድሞው ሁኔታ ጋር ያለውን ጠንካራ የጊዜና የተቃርኖ ለውጥ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: σοὶ καὶ ἐμοὶ
  choice: ለአንተም ለእኔም
  rationale: የግሪኩን ጥንድ አወቃቀር በአማርኛው ‘-ም … -ም’ አገባብ በግልጽ ያሳያል።
- source_word: εὔχρηστον
  choice: የሚጠቅም
  rationale: ዘመናዊና ግልጽ አቻ ሲሆን፣ ከ‘የማይጠቅም’ ጋር ያለውን ሆን ተብሎ የተደረገ ንጽጽር ይጠብቃል።
theological_decisions:
- issue: በኦኔሲሞስ ስም እና በመጠቀም/አለመጠቀም መካከል ሊኖር የሚችለው የቃል ጨዋታና የሁኔታ ለውጥ
  choice: በዋናው ጽሑፍ ‘የማይጠቅም/የሚጠቅም’ የሚለውን ቀላል ንጽጽር ማቆየት
  alternative: የስሙን የቃል ጨዋታ በግልጽ ለማጉላት እንደ ‘በእውነት ጠቃሚ’ ያለ ትርጓሜያዊ ቃል መጨመር
  rationale: የግሪኩ ጽሑፍ ንጽጽሩን ራሱ ግልጽ ያደርጋል። ቀጥተኛውን ንጽጽር መጠበቅ ሥነ ጽሑፋዊ ተፅዕኖውን ሳያጠፋ ከምንጩ በላይ እንዳይተረጎም ያደርጋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ‘ለአንተም ለእኔም’ የግሪኩን ጥንድ አገባብ ያንጸባርቃል፤ የጥቅም ቃላት ንጽጽርም በተመሳሳይ ሥርወ ቃል ተጠብቋል።
