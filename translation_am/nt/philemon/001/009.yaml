- issue: የδέσμιος Χριστοῦ Ἰησοῦ የወሰን ግንኙነት
  choice: የመሲሑ ኢየሱስ እስረኛ
  alternative: ስለ መሲሑ ኢየሱስ የታሰረ
  rationale: ግሪኩ የባለቤትነትን፣ የአገልግሎትን ወይም ስለ እርሱ መታሰርን ሊያስተጋባ ይችላል፤ ትርጉሙ ይህን ውጥረት አልፈታውም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የአማርኛ አገላለጽ ተጠቅሟል። የግሪኩ ረዥም አረፍተ ነገር እና በሚቀጥለው ቁጥር የሚሞላው ሐሳብ በመጨረሻ ሰረዝ ተጠብቋል።
