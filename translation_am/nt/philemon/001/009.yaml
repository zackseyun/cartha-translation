  rationale: በምንጩ ያለው πρεσβύτης እንጂ πρεσβευτής አይደለም፤ ስለዚህ ቀጥተኛው ከዕድሜ ጋር የተያያዘ ፍቺ ተመርጧል፣ የቤተ ክርስቲያን ሹመትም አልገባበትም።
