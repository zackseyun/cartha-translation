  text: አዎን፣ ወንድሜ፣ እኔ በጌታ ከአንተ ጥቅም ላግኝ[a]፤ በመሲሑ[c] ልቤን[b] አሳርፍ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ከአንተ ልጠቀም” ወይም “ከአንተ ደስታ ላግኝ።” ጳውሎስ “ኦኔሲሞስ” በሚለው ስምና ጠቃሚ ወይም ጥቅም በሚለው ሐሳብ መካከል የቃል ጨዋታ እያደረገ ሊሆን ይችላል።
