  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: ቃሉ በዚህ ስፍራ ከግል ስም ይልቅ ‘የተቀባው’ የሚለውን ማዕረግ ያጎላል። አማራጩ ግን በአማርኛ የተለመደና ከግሪኩ በድምፅ የተወረሰ ነው።
- issue: κυρίῳ እንዴት እንደሚተረጎም
