  - marker: b
    text: በግሪክኛ ቃል በቃል፣ “የውስጥ ክፍሎቼን።” ይህ ጥልቅ ስሜትን ወይም ውስጣዊ ማንነትን የሚያመለክት ፈሊጥ ነው።
    reason: lexical_alternative
  - marker: c
    text: ወይም፣ “በክርስቶስ።” የግሪክኛው Χριστός “የተቀባው” የሚል ማዕረግ ነው።
