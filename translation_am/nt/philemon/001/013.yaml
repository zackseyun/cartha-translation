source:
  edition: SBLGNT
  text: ὃν ἐγὼ ἐβουλόμην πρὸς ἐμαυτὸν κατέχειν, ἵνα ὑπὲρ σοῦ ⸂μοι διακονῇ⸃ ἐν τοῖς δεσμοῖς τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/013.yaml
  text: I wanted to keep him with me[a], so that on your behalf he might serve me in the chains of the gospel,
translation:
  language: am
  text: እርሱን ከእኔ ጋር ላቆየው እፈልግ ነበር፤ ይህም በወንጌል እስራቴ[a] ውስጥ በአንተ ፈንታ እንዲያገለግለኝ ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “ስለ ወንጌል በታሰርሁበት”፤ ማለትም፣ ስለ ወንጌል የተሸከመው እስራት።
    reason: alternative_reading
lexical_decisions:
- source_word: ὃν
  choice: እርሱን
  rationale: የወንድ ፆታ ነጠላ የዝምድና ተውላጠ ስም ሲሆን ወደ አናሲሞስ ይመለሳል፤ በአማርኛ ዐረፍተ ነገሩን በተፈጥሮ ለመቀጠል “እርሱን” ተመርጧል።
- source_word: ἐβουλόμην
  choice: ላቆየው እፈልግ ነበር
  rationale: ያለፈ ጊዜ ፍላጎትን ወይም ሐሳብን ይገልጣል፤ “እፈልግ ነበር” ይህን በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል።
- source_word: πρὸς ἐμαυτὸν κατέχειν
  choice: ከእኔ ጋር ላቆየው
  rationale: አናሲሞስን በጳውሎስ አጠገብ እንዲቆይ ማድረግን ያመለክታል፤ ይህ አገላለጽ የግሪኩን ትርጉም በተፈጥሯዊ አማርኛ ይይዛል።
- source_word: ἵνα
  choice: ይህም … እንዲ… ነው
  rationale: የጳውሎስን የማቆየት ዓላማ ያሳያል፤ የአማርኛው “እንዲ…” አወቃቀር የዓላማውን ኃይል ይጠብቃል።
- source_word: ὑπὲρ σοῦ
  choice: በአንተ ፈንታ
  rationale: አናሲሞስ ጳውሎስን ማገልገሉ ፊልሞና ሊያደርግለት የሚችለውን አገልግሎት በእርሱ ፈንታ እንደሚፈጽም ያሳያል፤ አገላለጹ ሙሉ ሕጋዊ ምትክነትን አያስገድድም።
- source_word: μοι διακονῇ
  choice: እኔን እንዲያገለግለኝ
  rationale: διακονέω ተግባራዊ እርዳታንና አገልግሎትን በስፋት ሊያመለክት ስለሚችል “እንዲያገለግለኝ” ከመጠን በላይ ሃይማኖታዊ ልዩ ትርጉም ሳይጭን ይተረጉመዋል።
- source_word: ἐν τοῖς δεσμοῖς τοῦ εὐαγγελίου
  choice: በወንጌል እስራቴ
  rationale: δεσμοί ቃል በቃል ማሰሪያዎችን ሲያመለክት በዚህ አውድ እስራትን ይወክላል። “በወንጌል እስራቴ” የግሪኩን አጭር የባለቤትነት አወቃቀር ይጠብቃል፤ የምክንያት ንባቡ በማስታወሻ ተገልጧል።
theological_decisions:
- issue: τοῦ εὐαγγελίου ከ δεσμοῖς ጋር ያለው የትርጉም ግንኙነት
  choice: በወንጌል እስራቴ
  alternative: ስለ ወንጌል በታሰርሁበት
  rationale: የግሪኩ የባለቤትነት ቅርጽ እስራቱ ከወንጌል ጋር ያለውን ግንኙነት በአጭሩ ይገልጣል፤ ምናልባትም ስለ ወንጌል የተሸከመውን እስራት ያመለክታል። ዋናው ጽሑፍ ይህን ወዲያውኑ ወደ ምክንያታዊ ንባብ አይወስነውም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። “እስራቴ” ከቃል በቃል “ሰንሰለቶቼ” ይልቅ በአማርኛ ተፈጥሯዊ ሲሆን የእስረኝነትን ምስል ይጠብቃል። የማስታወሻው ምልክት በሚያብራራው “በወንጌል እስራቴ” ሐረግ ላይ ተቀምጧል።
