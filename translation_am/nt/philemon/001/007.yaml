  terminology: ፍቅር, ማበረታቻ, ቅዱሳን, and ወንድሜ ሆይ are appropriate. ልቦች is a natural idiomatic rendering of σπλάγχνα, with the lexical nuance appropriately retained in the footnote.
  issues:
