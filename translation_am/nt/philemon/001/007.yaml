  text: ⸀χαρὰν γὰρ ⸂πολλὴν ἔσχον⸃ καὶ παράκλησιν ἐπὶ τῇ ἀγάπῃ σου, ὅτι τὰ σπλάγχνα τῶν ἁγίων ἀναπέπαυται διὰ σοῦ, ἀδελφέ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/007.yaml
  text: For I had much joy and encouragement because of your love[a], because the hearts of the saints have been refreshed through you, brother.
translation:
  language: am
  text: በፍቅርህ ምክንያት ብዙ ደስታና ማበረታቻ ነበረኝ፤ ምክንያቱም የቅዱሳን ልቦች[a] በአንተ አማካይነት እፎይታ አግኝተዋል፣ ወንድሜ ሆይ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም በይበልጥ ቀጥተኛ አተረጓጎም፣ “የቅዱሳን ውስጣዊ ስሜቶች።”
    reason: lexical_alternative
lexical_decisions:
- source_word: χαρὰν
  choice: ደስታ
  rationale: χαρά የሚያመለክተውን ደስ የመሰኘት ስሜት በተፈጥሯዊና በዘመናዊ አማርኛ ያስተላልፋል።
- source_word: πολλὴν ἔσχον
  choice: ብዙ … አግኝቻለሁ
  rationale: የግሪኩን ‘ብዙ ነበረኝ/ተቀበልሁ’ የሚል የልምምድ ሐሳብ በተፈጥሯዊ አማርኛ ይገልጻል።
- source_word: παράκλησιν
  choice: ማበረታቻ
  rationale: በዚህ የግንኙነት አውድ παράκλησις የሚያመለክተውን ማጽናናትና ኃይል መስጠት በግልጽ ሁኔታ ያቀርባል።
- source_word: ἐπὶ τῇ ἀγάπῃ σου
  choice: በፍቅርህ ምክንያት
  rationale: ἐπί ከዳቲቭ ጋር እዚህ ያለውን ምክንያታዊ ግንኙነት ያሳያል፤ የጳውሎስ ደስታና ማበረታቻ ከፊልሞና ፍቅር የተነሣ ነው።
- source_word: ἀγάπῃ
  choice: ፍቅር
  rationale: ἀγάπη በዚህ አውድ በቀጥታና በተለመደው መንገድ ‘ፍቅር’ ተብሎ ይተረጎማል።
- source_word: σπλάγχνα
  choice: ልቦች
  rationale: ቃሉ በቀጥታ የውስጥ አካላትን ቢያመለክትም፣ በዚህ ፈሊጣዊ አጠቃቀም ጥልቅ ውስጣዊ ስሜትንና ማንነትን ይገልጻል፤ ‘ልቦች’ ይህን በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τῶν ἁγίων
  choice: የቅዱሳን
  rationale: የጳውሎስን ለእግዚአብሔር የተለዩትን አማኞች የሚያመለክት የማኅበረሰብ ቃል ይጠብቃል።
- source_word: ἀναπέπαυται
  choice: ዕረፍት አግኝተዋል
  rationale: ἀναπαύω ያለውን ዕረፍት፣ እፎይታና መታደስ የሚያካትት ሐሳብ ያስተላልፋል፤ የፍጹም ጊዜውንም አሁን የሚታይ ውጤት ይጠብቃል።
- source_word: διὰ σοῦ
  choice: በአንተ አማካይነት
  rationale: διά ከጄኒቲቭ ጋር የሚገልጸውን አማካይነት ወይም ወኪልነት በግልጽ ያሳያል።
- source_word: ἀδελφέ
  choice: ወንድሜ ሆይ
  rationale: ቀጥተኛውን የወንድማማችነት አድራሻና የጥሪ ቅርጽ ይጠብቃል።
theological_decisions:
- issue: የἅγιοι አተረጓጎም
  choice: ቅዱሳን
  alternative: የእግዚአብሔር ሕዝብ / ቅዱሳን የሆኑት
  rationale: ‘ቅዱሳን’ ለእግዚአብሔር የተለዩትን አማኞች የሚገልጸውን የጳውሎስ ቃል ይጠብቃል፤ በኋላ የተፈጠረ የቅድስና ማዕረግ ሐሳብን አያስገባም።
- issue: በσπλάγχνα ያለው የሰው ውስጣዊ ማንነት ፈሊጥ
  choice: ልቦች
  alternative: ውስጣዊ ስሜቶች / ውስጣዊ ማንነት
  rationale: ‘ልቦች’ በአማርኛ ጥልቅ ስሜትንና ውስጣዊ ማንነትን በተፈጥሯዊ ሁኔታ ይገልጻል፤ የግሪኩን የአካል ክፍል ቀጥተኛ ስያሜ በማምጣት አንባቢን አያሳስትም።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው መደበኛ አማርኛ ተጠቅሟል። የምንጩ ሁለት ምክንያታዊ አገናኞች (γάρ እና ὅτι) በ‘…ምክንያት’ እና ‘ምክንያቱም’ ተጠብቀዋል። የግሪኩ ፈሊጥ በዋናው ጽሑፍ ተፈጥሯዊ ሆኖ ቀርቦ፣ ይበልጥ ቀጥተኛው አማራጭ በማስታወሻ ተጠብቋል።
