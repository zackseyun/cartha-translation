    reason: lexical_alternative
  revision_rationale: The revision preserves the aorist «ጻፍሁ», the emphatic personal autograph, and the future promise. It changes only the final rhetorical aside to an idiomatic Amharic expression that better reflects ἵνα μὴ λέγω σοι. The wording deliberately leaves the nature of Philemon's debt unspecified.
