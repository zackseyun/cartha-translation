- from: እኔ ጳውሎስ በገዛ እጄ ጻፍሁ፤ እኔ እከፍለዋለሁ። ራስህን ጭምር ለእኔ ዕዳ እንዳለብህ አልነግርህም![a]
  to: እኔ ጳውሎስ ይህን በገዛ እጄ ጻፍሁ[a]፤ እኔ እከፍለዋለሁ። ራስህን እንኳ ለእኔ ዕዳ እንዳለብህ ልነግርህ ቀርቶ።
