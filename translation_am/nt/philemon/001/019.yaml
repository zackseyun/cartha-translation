source:
  edition: SBLGNT
  text: ἐγὼ Παῦλος ἔγραψα τῇ ἐμῇ χειρί, ἐγὼ ἀποτίσω· ἵνα μὴ λέγω σοι ὅτι καὶ σεαυτόν μοι προσοφείλεις.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/019.yaml
  text: 'I[a], Paul, write this with my own hand: I will repay it—not to mention to you that you owe me even your very self.'
translation:
  language: am
  text: እኔ ጳውሎስ ይህን በገዛ እጄ ጻፍሁ[a]፤ እኔ እከፍለዋለሁ። ራስህን እንኳ ለእኔ ዕዳ እንዳለብህ ልነግርህ ቀርቶ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ይበልጥ ቃል በቃል፦ “እኔ ጳውሎስ በገዛ እጄ ጻፍሁ፤ እኔ እከፍለዋለሁ፤ ራስህን እንኳ ለእኔ ዕዳ እንዳለብህ እንዳልነግርህ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: ጻፍሁ
  rationale: የግሪኩን የአኦሪስት ቅርጽ በቀጥታ ይጠብቃል፤ ጳውሎስ በራሱ እጅ የጻፈውን የግል ዋስትና ያጎላል።
- source_word: τῇ ἐμῇ χειρί
  choice: በገዛ እጄ
  rationale: የግል አጽንዖቱንና ጽሑፉ በጳውሎስ እጅ መጻፉን በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: ἀποτίσω
  choice: እከፍለዋለሁ
  rationale: በቀደመው ቁጥር የተጠቀሰውን ዕዳ ወይም ጉዳት ለመክፈል የተሰጠውን የወደፊት ቃል ያስተላልፋል።
- source_word: ἵνα μὴ λέγω σοι
  choice: አልነግርህም
  rationale: ሐረጉ ጥብቅ የዓላማ አገላለጽ ሳይሆን ጳውሎስ ነገሩን እየጠቀሰ እንዳልጠቀሰው የሚናገርበትን ስልታዊ ምጸት ያሳያል።
- source_word: σεαυτόν
  choice: ራስህን ጭምር
  rationale: καί የሚሰጠውን ተጨማሪ አጽንዖት ይጠብቃል፤ ዕዳው ከገንዘብ በላይ የግል መሆኑን ሳይተረጉም ያሳያል።
- source_word: προσοφείλεις
  choice: ለእኔ ዕዳ አለብህ
  rationale: የዕዳን ሐሳብ ግልጽ በሆነ ዘመናዊ አማርኛ ያቀርባል፤ የተጨማሪነቱ ፍቺ ‘ጭምር’ በሚለው ቃል ተጠብቋል።
theological_decisions:
- issue: ፊልሞና ራሱን ጭምር ለጳውሎስ ዕዳ ያለበት መሆኑ ምን ማለት ነው?
  choice: የግል ዕዳነቱን ጠንካራ በሆነ ነገር ግን ያልተገለጸ አነጋገር ማቆየት
  alternative: ዕዳው መለወጡን፣ መዳኑን ወይም ሥጋዊ ሕይወቱን እንደሚያመለክት በግልጽ መተርጎም
  rationale: የግሪኩ ጽሑፍ ዕዳነቱን አጥብቆ ይናገራል፣ መሠረቱን ግን አይገልጽም። ስለዚህ ትርጉሙ ያንን የትርጉም ክፍተትና የሥነ መለኮት ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክቡርና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የጳውሎስ ግላዊ አጽንዖትና ስልታዊ ምጸት ተጠብቀዋል።
