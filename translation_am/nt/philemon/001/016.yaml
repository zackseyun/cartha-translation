  choice: ባሪያ
  alternative: አገልጋይ፣ የታሰረ አገልጋይ
  rationale: የአናሲሞስ ማኅበራዊ ሁኔታ በደብዳቤው አውድ ዋና በመሆኑ፣ “ባሪያ” ያንን እውነታና “ከባሪያ የሚበልጥ” የሚለውን ንጽጽር ይጠብቃል።
- issue: የἐν σαρκὶ καὶ ἐν κυρίῳ ትርጉም
  choice: በሥጋም በጌታም
  alternative: በምድራዊ ግንኙነትም በጌታም፣ በአካልም በጌታም
  rationale: አገላለጹ በሰዋዊና ማኅበራዊ ደረጃ ያለውን ግንኙነት ከበጌታ ያለው መንፈሳዊ ግንኙነት ጋር ሳያዋህድ ያቀርባል፤ ያለውንም ትርጉማዊ ስፋት ይጠብቃል።
- issue: በግሪክ ጽሑፍ ያልተገለጸውን ግስ በአማርኛ ማሟላት
  choice: አድርገህ ተቀበለው
  alternative: ግስ ሳይጨመር የዓረፍተ ነገሩን ቁርጥራጭ መጠበቅ
  rationale: ቁጥር 17 ያለውን προσλαβοῦ αὐτόν (“ተቀበለው”) በቅድሚያ በማሟላት ዓረፍተ ነገሩ በዘመናዊ አማርኛ እንዲነበብ ተደርጓል፤ ነገር ግን ይህ ግስ በቁጥር 16 የግሪክ ጽሑፍ ውስጥ በግልጽ አልተጻፈም።
