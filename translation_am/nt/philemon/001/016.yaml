translation:
  language: am
  text: ከእንግዲህ ወዲያ እንደ ባሪያ[a] ሳይሆን፣ ከባሪያ ይልቅ የተወደደ ወንድም ሆኖ፤ በተለይ ለእኔ፣ ለአንተ ግን ከዚህ ይልቅ እንዴት ይበልጥ በሥጋም[b] እና በጌታም።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ባሪያ” ተብሎ የተተረጎመው የግሪክ ቃል “አገልጋይ” ወይም “የታሰረ አገልጋይ” የሚል ሰፊ የአገልግሎት ሁኔታ ሊያመለክት ይችላል፤ እዚህ ግን የአናሲሞስን የባርነት ማኅበራዊ ሁኔታ የሚያመለክት ይመስላል።
    reason: alternative_reading
  - marker: b
    text: እዚህ “በሥጋ” ማለት በምድራዊ ወይም በማኅበራዊ ግንኙነት፣ ወይም በአካል ማለት ሊሆን ይችላል፤ “ኃጢአተኛ ተፈጥሮ” ማለት አይደለም።
    reason: lexical_alternative
