  yaml_path: translation/nt/philemon/001/024.yaml
  text: Mark, Aristarchus, Demas, and Luke, my fellow workers.
translation:
  language: am
  text: ማርቆስ፣ አርስጥሮኮስ፣ ዴማስና ሉቃስ—የሥራ ባልደረቦቼ።
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μᾶρκος
  choice: ማርቆስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ አጠቃቀም የተለመደውን የግሪክ የግል ስም አጻጻፍ ይከተላል።
- source_word: Ἀρίσταρχος
  choice: አርስጥርኮስ
  rationale: በአማርኛ የመጽሐፍ ቅዱስ ባህል የተለመደውን የስሙን አጻጻፍ ይጠብቃል።
- source_word: Δημᾶς
  choice: ዴማስ
  rationale: የግሪኩን የግል ስም በግዕዝ ፊደል በተለመደው የአማርኛ ቅርጽ ያቀርባል።
- source_word: Λουκᾶς
  choice: ሉቃስ
  rationale: በአማርኛ አንባቢዎች ዘንድ የታወቀውንና የተለመደውን የስሙን ቅርጽ ይጠቀማል።
- source_word: οἱ συνεργοί μου
  choice: አብረውኝ የሚሠሩት
  rationale: συνεργός ከሌላ ሰው ጋር በአንድነት የሚሠራን ሰው ያመለክታል። «አብረውኝ የሚሠሩት» የትብብር ሥራውንና μου የሚገልጸውን ከጳውሎስ ጋር ያላቸውን ግንኙነት በተፈጥሯዊ ዘመናዊ አማርኛ ያስተላልፋል። የመጨረሻው «-ት» ቅጥያ የተጠቀሱትን ሰዎች በአንድ ቡድን የሚለይ የግሪኩን አመልካች አንቀጽ ተግባር ያንጸባርቃል።
theological_decisions: []
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። ረጅሙ ሰረዝ ከስሞቹ በኋላ ያለውን ገላጭ ተቀጽላ ያመለክታል፤ ቁጥሩ ከቀዳሚው ሰላምታ ጋር ያለውን ሰዋሰዋዊ ትስስር ሳይደብቅ የግሪኩን አጭር አቀራረብ ይጠብቃል።
