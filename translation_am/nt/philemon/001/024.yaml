  rationale: The revision corrects the established Amharic form of Aristarchus and recasts “my fellow workers” as an idiomatic possessive apposition. It preserves the Greek's brief list structure, all named individuals, and the association denoted by μου and συνεργοί, without specifying the nature of their work.
