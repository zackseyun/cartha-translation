  source_fidelity: The draft retains the paired objects, the reference to the Lord Jesus and all the saints, and the intentional ambiguity concerning how the two nouns relate to the two prepositional phrases. However, its final “ስለምሰማ ነው” is an unnatural and incomplete causal construction in this verse-level context. Rendering the participle as “እሰማለሁና፣” naturally retains its causal, syntactically dependent force.
  naturalness: “ለጌታ ኢየሱስና ለቅዱሳን ሁሉ” is clear and idiomatic modern standard Amharic. Replacing “ስለምሰማ ነው” with “እሰማለሁና፣” removes an unnecessary copula and reads naturally as the continuation of the preceding thanksgiving sentence. Footnote markers are placed beside the words or phrase to which they apply rather than all being accumulated after the sentence.
