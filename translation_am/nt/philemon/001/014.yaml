  rationale: ጥቅሱ የፊልሞና ምላሽ ነፃና ያልተገደደ መሆኑን ያጎላል። ግሪኩ ተግባሩ በትክክል ምን እንደሆነ በግልጽ ስለማይወስን፣ ትርጉሙ ከጽሑፉ የሚበልጥ የሥነ መለኮት ወይም የሥነ ምግባር ዝርዝር አያክልም።
