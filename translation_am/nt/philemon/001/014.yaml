base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/014.yaml
  text: But without your consent I wanted to do nothing[a], so that your good deed might not be as if by compulsion[c][b], but voluntary.
translation:
  language: am
  text: ነገር ግን ያለ አንተ ስምምነት[a] ምንም ማድረግ አልፈለግሁም፤ ይህም መልካም ተግባርህ[b] በግድ የተደረገ እንዳይመስል፣ በገዛ ፈቃድህ[c] እንዲሆን ነው።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የአንተን ፈቃድ ሳላገኝ” ወይም “ያለ አንተ አስተያየት።”
    reason: lexical_alternative
  - marker: b
    text: ወይም፣ “መልካምነትህ” ወይም “ደግነትህ።” የግሪኩ ቃል በዚህ ጉዳይ ፊልሞና የሚያደርገውን መልካም ተግባር ወይም በአጠቃላይ መልካምነቱን ሊያመለክት ይችላል።
    reason: lexical_alternative
  - marker: c
    text: ቃል በቃል፣ “ነገር ግን በፈቃደኝነት፤” ማለትም “በገዛ ፈቃድህ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς ... τῆς σῆς γνώμης
  choice: የአንተን ፈቃድ ሳላገኝ
  rationale: γνώμη አስተያየትን፣ ውሳኔን ወይም ስምምነትን ሊያመለክት ይችላል፤ በዚህ አውድ ጳውሎስ ፊልሞና ፈቃዱን ሳይሰጥ እርምጃ እንደማይወስድ ስለሚናገር፣ ይህ አተረጓጎም የስምምነትን ትርጉም በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: οὐδὲν ἠθέλησα ποιῆσαι
  choice: ምንም ማድረግ አልፈለግሁም
  rationale: θέλω የፈቃድን ወይም የመሻትን ሐሳብ ይገልጣል፤ ይህ አተረጓጎም የግል ፈቃድን ንዑስ ትርጉም ሳያጠፋ የግሪኩን አወቃቀር በቅርብ ይከተላል።
- source_word: ἵνα μὴ
  choice: እንዳይመስል ... እንዲሆን ነው
  rationale: የጳውሎስን ዓላማ በተፈጥሯዊ የአማርኛ የዓላማ አወቃቀር ይገልጣል።
- source_word: ὡς κατὰ ἀνάγκην
  choice: በግድ የተደረገ እንዳይመስል
  rationale: ἀνάγκη በዚህ ስፍራ ጫናን ወይም ማስገደድን ያመለክታል፤ ‘እንዳይመስል’ የሚለው ὡς የሚሰጠውን ‘እንደ’ ወይም ‘ያለ መልክ’ ንዑስ ትርጉም ይጠብቃል።
- source_word: τὸ ἀγαθόν σου
  choice: መልካም ተግባርህ
  rationale: በጾታ አልባ መልክ ከመስተዋድድ ጋር የቀረበው ቅጽ ፊልሞና ሊያደርገው የሚችለውን ተጨባጭ መልካም ነገር ሊያመለክት ይችላል፤ ሆኖም ‘መልካምነትህ’ ወይም ‘ደግነትህ’ የሚለው አማራጭ ትርጉም በማስታወሻ ተጠብቋል።
- source_word: ἀλλὰ κατὰ ἑκούσιον
  choice: በገዛ ፈቃድህ እንዲሆን
  rationale: ἑκούσιον ያለ ማስገደድ በፈቃድ የሚደረግን ነገር ያመለክታል፤ ‘በገዛ ፈቃድህ’ ከ‘በግድ’ ጋር ያለውን ተቃርኖ ግልጽ ያደርጋል።
theological_decisions:
