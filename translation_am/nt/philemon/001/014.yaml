  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ መደበኛ አማርኛ ተጠቅሟል። ‘ፈቃድ’ በዋናው ጽሑፍ ሁለት ጊዜ መቅረቡ በግሪኩ γνώμη እና ἑκούσιον መካከል ያለውን የቃል ልዩነት በአማርኛ በከፊል ቢያጠብም፣ የመጀመሪያውን እንደ የተጠየቀ ፈቃድ፣ ሁለተኛውን እንደ ነፃ ፈቃደኝነት በአወቃቀሩ ይለያል።
