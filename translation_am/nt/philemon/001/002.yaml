id: PHM.1.2
reference: Philemon 1:2
language:
  code: am
  name: Amharic
  native_name: አማርኛ
  variant: modern standard Amharic in Ge'ez script
source:
  edition: SBLGNT
  text: καὶ Ἀπφίᾳ τῇ ⸀ἀδελφῇ καὶ Ἀρχίππῳ τῷ συστρατιώτῃ ἡμῶν καὶ τῇ κατ’ οἶκόν σου ἐκκλησίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/002.yaml
  text: 'and to Apphia our sister[a], and to Archippus our fellow soldier, and to the church in your house:'
translation:
  language: am
  text: እና ለእኅት አጵያ[a]፣ ለጦር ባልንጀራችን አርክጵስ፣ እንዲሁም በቤትህ ላለችው ቤተ ክርስቲያን፤
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: አንዳንድ የእጅ ጽሑፎች “ለእኅታችን አጵያ” ይላሉ።
    reason: textual_variant
lexical_decisions:
- source_word: Ἀπφίᾳ
  choice: አፍፍያ
  rationale: የግሪክኛውን የግል ስም ድምፅ በተቻለ መጠን በአማርኛ ፊደል የሚያቀርብ የተለመደ ቅርጽ ነው።
- source_word: ἀδελφῇ
  choice: እኅት
  rationale: ቃሉ በቀጥታ ‘እኅት’ ማለት ነው፤ በቀረበው SBLGNT ጽሑፍ ἡμῶν (‘የእኛ’) ስለሌለ ‘እኅታችን’ በዋናው ጽሑፍ አልተጨመረም።
- source_word: Ἀρχίππῳ
  choice: አርክጳስ
  rationale: የግሪክኛው የግል ስም በአማርኛ የተለመደውን የመጽሐፍ ቅዱስ አጻጻፍ ተከትሎ ተጽፏል።
- source_word: συστρατιώτῃ
  choice: አብሮን ለሚዋጋው
  rationale: ‘አብሮ የሚዋጋ ወታደር’ የሚለውን ወታደራዊ ዘይቤ ይጠብቃል፤ በአማርኛም ተፈጥሯዊ እንዲሆን በአንቀጽ ቀርቧል።
- source_word: ἐκκλησίᾳ
  choice: ቤተ ክርስቲያን
  rationale: በዚህ የመልእክት አውድ በቤት የሚሰበሰበውን የክርስቲያኖች ማኅበር የሚገልጽ በአማርኛ የተለመደ አቻ ቃል ነው።
- source_word: κατ’ οἶκόν σου
  choice: በቤትህ ላለችው
  rationale: ሐረጉ ማኅበሩ በፊልሞና ቤት እንዳለ ወይም እንደሚሰበሰብ ያመለክታል፤ ‘ለምትሰበሰበው’ ብሎ ከምንጩ በላይ ሳያብራራ የቦታውን ግንኙነት ይጠብቃል።
- source_word: καὶ
  choice: እንዲሁም / እና
  rationale: ተደጋጋሚውን የመደመር አወቃቀር በተፈጥሯዊ የአማርኛ አገናኞች ያሳያል።
theological_decisions:
- issue: ἀδελφῇ ከባለቤት ተውላጠ ስም ጋር ‘እኅታችን’ ተብሎ ይተርጎም ወይስ በቀረበው ጽሑፍ መሠረት ‘እኅት’ ብቻ ይባል?
  choice: እኅት
  alternative: እኅታችን
  rationale: የቀረበው SBLGNT ጽሑፍ τῇ ἀδελφῇ ይላል እንጂ ἡμῶν የለውም። ስለዚህ የታወቀውን ባህላዊ ንባብ በዋናው ጽሑፍ ከመጨመር ይልቅ የምንጩ ንባብ ተከትሏል፤ ልዩነቱም በማስታወሻ ተገልጿል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራው አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የደብዳቤው ተቀባዮች ዝርዝር እና የσυστρατιώτης ወታደራዊ ዘይቤ ተጠብቀዋል፤ የግሪክኛው አንቀጽ በἀδελφῇ ላይ ያለውን የተወሰነነት ስሜት ‘ለእኅት’ በማለት በቅርብ ተወክሏል።
