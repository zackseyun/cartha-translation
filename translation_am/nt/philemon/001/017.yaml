  text: So if you consider me a partner[a], receive him as you would me.
translation:
  language: am
  text: ስለዚህ እኔን አጋርህ ብለህ የምትቆጥረኝ ከሆነ፣ እኔን እንደምትቀበለኝ እርሱንም ተቀበለው።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ተቀበለው» የሚለው «በደስታ ተቀበለው» ወይም «ወደ ኅብረትህ ተቀበለው» የሚል ሐሳብም ሊኖረው ይችላል።
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ οὖν
  choice: ስለዚህ … ከሆነ
  rationale: የοὖνን ከቀደመው ሐሳብ ጋር ያለ ድምዳሜያዊ ግንኙነትና የεἰን ሁኔታዊ ኃይል በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: ἔχεις κοινωνόν
  choice: እኔን አጋርህ አድርገህ የምትቆጥረኝ
  rationale: κοινωνός በአንድ ነገር አብሮ የሚካፈልን ወይም አጋርን ያመለክታል፤ ይህ አገላለጽ ἔχεις ያለውን የግምትና የግንኙነት ስሜት በተፈጥሯዊ አማርኛ ይገልጣል።
- source_word: προσλαβοῦ
  choice: ተቀበለው
  rationale: ግሱ ሰውን መቀበል፣ በመልካም ፈቃድ ማስተናገድ ወይም ወደ ኅብረት መቀበል ሊያመለክት ይችላል፤ «ተቀበለው» ይህን ሰፊ ትርጉም ይጠብቃል።
- source_word: αὐτὸν
  choice: እርሱን
  rationale: በዐውዱ አናሲሞስን የሚያመለክተውን የተሳቢ ተውላጠ ስም በቀጥታ ይተረጉማል።
- source_word: ὡς ἐμέ
  choice: እኔን እንደምትቀበለኝ
  rationale: የὡςን ንጽጽራዊ ኃይል በግልጽና ተፈጥሯዊ አማርኛ ያስተላልፋል፤ አናሲሞስ ጳውሎስ ራሱ እንደሚቀበለው እንዲቀበል የቀረበውን ጥያቄ ያሳያል።
theological_decisions:
- issue: በጳውሎስ ልመና ውስጥ κοινωνός ያለው የግንኙነት ኃይል
  choice: አጋር
  alternative: ተካፋይ፣ የኅብረት ባልደረባ
  rationale: ቃሉ በጳውሎስና በፊልሞና መካከል ያለውን የጋራ ተሳትፎና ግንኙነት ያሳያል፤ «አጋር» ይህን ያለ ልዩ የእምነት ቡድን ቴክኒካዊ ትርጉም ያስተላልፋል።
