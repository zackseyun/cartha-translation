  text: Διό, πολλὴν ἐν Χριστῷ παρρησίαν ἔχων ἐπιτάσσειν σοι τὸ ἀνῆκον,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/008.yaml
  text: Therefore[a], though I have much boldness in Messiah to command you to do what is proper[b],
translation:
  language: am
  text: ስለዚህ፣ በመሲሑ ተገቢውን እንድታደርግ ላዝዝህ ብዙ ድፍረት ቢኖረኝም፣[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: በግሪኩ ይህ ዓረፍተ ነገር በቁጥር 9 ይቀጥላል። «ተገቢውን» የሚለው «የሚገባውን» ወይም «የሚመጥነውን» ማለት ይችላል።
    reason: የቁጥሩን ያልተጠናቀቀ አገባብና የτὸ ἀνῆκονን የቃል ስፋት ለማብራራት።
lexical_decisions:
- source_word: Διό
  choice: ስለዚህ
  rationale: ከቀደመው ሐሳብ የሚወጣውን ድምዳሜ በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: πολλὴν ... παρρησίαν
  choice: ብዙ ድፍረት
  rationale: የπαρρησίαን የመናገር ነፃነት፣ ድፍረትና እምነት ያካተተ ስፋት ሳያጠብ ተፈጥሯዊ ሆኖ ያቀርባል።
- source_word: ἐν Χριστῷ
  choice: በመሲሑ ሆኜ
  rationale: Χριστόςን እንደ ማዕረግ ‘መሲሕ’ ብሎ ይተረጉማል፤ ἐν የሚያመለክተውን ከመሲሑ ጋር ያለ ግንኙነትና በእርሱ ውስጥ ያለ ሥልጣን ሳይገድብ ‘በ…ሆኜ’ ይገልጣል።
- source_word: ἔχων
  choice: ቢኖረኝም
  rationale: በቁጥር 9 ከሚቀጥለው ልመና ጋር ያለውን ተቃርኖ የአማርኛ አሳማኝ ቅርጽ ያሳያል።
- source_word: ἐπιτάσσειν σοι
  choice: እንድታደርግ ለማዘዝ
  rationale: ἐπιτάσσω ያለውን የሥልጣን ኃይል ‘ማዘዝ’ በግልጽ ያስተላልፋል፤ የσοι ተቀባይም በሁለተኛ መደብ ግስ ውስጥ ተገልጧል።
- source_word: τὸ ἀνῆκον
  choice: ተገቢውን
  rationale: መሆን ያለበትን፣ የሚመጥነውን ወይም ተገቢውን ነገር በአጭርና ተፈጥሯዊ አማርኛ ያቀርባል።
theological_decisions:
- issue: የΧριστῷ አተረጓጎም
  choice: መሲሑ
  alternative: ክርስቶስ
  rationale: ቃሉ እዚህ እንደ ስም ብቻ ሳይሆን እንደ ማዕረግ ይሠራል፤ ‘መሲሑ’ የ‘ተቀባው’ን ማዕረጋዊ ትርጉም ይጠብቃል።
- issue: የἔχων ሰዋሰዋዊ ግንኙነት
  choice: ተቃርኗዊ፤ ‘ቢኖረኝም’
  alternative: ምክንያታዊ፤ ‘ስላለኝ’
  rationale: በቁጥር 9 የሚመጣው ‘ነገር ግን…እለምንሃለሁ’ የሚለው ሐሳብ አሳታፊውን እንደ ተቃርኗዊ እንድንረዳው ይደግፋል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ። ቁጥር 8 በግሪኩ በኮማ የሚያበቃና በቁጥር 9 የሚሟላ ስለሆነ፣ የ‘ቢኖረኝም’ ቅርጽና የመጨረሻ ኮማ ቀጣዩን ሐሳብ ያመለክታሉ።
