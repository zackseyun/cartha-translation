  text: Ἡ χάρις τοῦ ⸀κυρίου Ἰησοῦ Χριστοῦ μετὰ τοῦ πνεύματος ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/025.yaml
  text: The grace of the Lord Jesus Christ be with your spirit[a][b].
translation:
  language: am
  text: የጌታ ኢየሱስ መሲሕ ጸጋ ከመንፈሳችሁ ጋር ይሁን።[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ “የጌታ ኢየሱስ ክርስቶስ ጸጋ ከመንፈሳችሁ ጋር ይሁን።” “መንፈሳችሁ” የሚለው ባለቤትነት ቅጥያ ብዙ ቁጥር ነው፤ ስለዚህ ይህ ቡራኬ ለፊልሞና ብቻ ሳይሆን ለደብዳቤው ተቀባዮች ሁሉ ይደርሳል።
    reason: የΧριστοῦን ባህላዊ አተረጓጎም ለማሳየትና በὑμῶν ያለውን የብዙ ቁጥር መረጃ ለማቆየት።
lexical_decisions:
- source_word: χάρις
  choice: ጸጋ
  rationale: በጳውሎስ መልእክቶች የመዝጊያ ቡራኬ ውስጥ የእግዚአብሔርን ቸርነትና ሞገስ የሚገልጽ የተለመደ እና ትክክለኛ አማርኛ ቃል ነው።
- source_word: κυρίου
  choice: ጌታ
  rationale: የκύριοςን ክብርና ክርስቶሳዊ ማዕረግ በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: Ἰησοῦ Χριστοῦ
  choice: የኢየሱስ መሲሕ
  rationale: Ἰησοῦ የግል ስም ሆኖ በተለመደው መልክ ተጽፏል፤ Χριστοῦ ደግሞ እዚህ የማዕረግ ኃይሉን እንዲያሳይ ‘መሲሕ’ ተብሏል።
- source_word: μετὰ
  choice: ከ… ጋር ይሁን
  rationale: ግሪኩ ግስ የሌለው የቡራኬ ሐረግ ነው፤ ‘ይሁን’ መጨመር ትርጉሙን ሳይቀይር በአማርኛ ተፈጥሯዊ ያደርገዋል።
- source_word: πνεύματος
  choice: መንፈሳችሁ
  rationale: ቃሉ ከብዙ ቁጥር ባለቤትነት ቅጥያ ጋር ተተርጉሞ የተቀባዮቹን መንፈስ ወይም ውስጣዊ ማንነት ያመለክታል፤ መንፈስ ቅዱስን በግልጽ እንደሚያመለክት አልተወሰነም።
- source_word: ὑμῶν
  choice: -አችሁ
  rationale: የሁለተኛ መደብ ብዙ ቁጥርን በግልጽ የሚያሳይ የአማርኛ ባለቤትነት ቅጥያ ነው፤ ቡራኬው ከፊልሞና ባሻገር ለደብዳቤው ተሰብሳቢ ተቀባዮችም እንደሚደርስ ያሳያል።
theological_decisions:
- issue: በመዝጊያው ቡራኬ Χριστοῦን መተርጎም
  choice: መሲሕ
  alternative: ክርስቶስ
  rationale: በዚህ ቀመር ውስጥ የማዕረግ ኃይሉ አሁንም ስለሚሰማ ‘መሲሕ’ ይህን ትርጉም በግልጽ ያስተላልፋል፤ የተለመደው ‘ክርስቶስ’ በማስታወሻ ተጠብቋል።
- issue: ‘ከመንፈሳችሁ ጋር’ ውስጥ የመንፈስ አመልካች
  choice: የተቀባዮቹ መንፈስ ወይም ውስጣዊ ማንነት
  alternative: መንፈስ ቅዱስ
  rationale: ὑμῶν የሚለው ባለቤትነት ቅጽ በቀጥታ የተቀባዮቹን መንፈስ ይጠቁማል፤ ጽሑፉ በግልጽ ያላለውን የመንፈስ ቅዱስ አመልካች በትርጉሙ ላይ አልተጫነም።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለመደበኛ አንባቢ ግልጽ የሆነ የቡራኬ አገላለጽ ተጠቅሟል። ‘ከመንፈሳችሁ ጋር’ የግሪኩን ነጠላ ስምና የብዙ ቁጥር ባለቤትነት ይጠብቃል።
