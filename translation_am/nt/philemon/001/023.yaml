  text: Epaphras[a], my fellow prisoner in Messiah Jesus, greets you.
translation:
  language: am
  text: በመሲሑ ኢየሱስ[a] አብሮኝ የታሰረው ኤጳፍራስ ሰላምታ ያቀርብልሃል።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም በተለምዶ፣ “በክርስቶስ ኢየሱስ።”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεταί
  choice: ሰላምታ ያቀርብልሃል
  rationale: ἀσπάζομαι በዚህ አውድ ሰላምታ ማቅረብን ያመለክታል፤ ይህ አተረጓጎም በዘመናዊ አማርኛ ተፈጥሯዊና ክብር ያለው ነው።
- source_word: σε
  choice: -ልሃል
  rationale: የሁለተኛ መደብ ነጠላ ተቀባይን፣ ማለትም ፊልሞናን፣ በግስ ውስጥ በተዋሐደ ቅጥያ ያሳያል።
- source_word: Ἐπαφρᾶς
  choice: ኤጳፍራስ
  rationale: የግሪክ የግል ስምን በተለመደው የአማርኛ መጽሐፍ ቅዱሳዊ አጻጻፍ በድምፅ ተቀራራቢነት ያቀርባል።
- source_word: ὁ συναιχμάλωτός μου
  choice: አብሮኝ የታሰረው
  rationale: συναιχμάλωτος ከሌላው ጋር አብሮ የታሰረን ሰው ያመለክታል፤ ቅጹ የμουን ‘ከእኔ ጋር’ የሚል ግንኙነትም በተፈጥሯዊ አማርኛ ይጠብቃል።
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: በመሲሑ ኢየሱስ
  rationale: ἐνን ‘በ’ በማለት የጳውሎስን ከመሲሑ ጋር ያለ ኅብረት የሚገልጽ አገላለጽ ሳይዘረጋ ይጠብቃል። Χριστός እዚህ የማዕረግ ክብደቱን ስለሚይዝ ‘መሲሑ’ ተብሏል።
theological_decisions:
- issue: በጳውሎስ አገላለጽ ἐν Χριστῷ Ἰησοῦ ውስጥ Χριστῷን መተርጎም
  choice: በመሲሑ ኢየሱስ
  alternative: በክርስቶስ ኢየሱስ
  rationale: Χριστός በዚህ ስፍራ ‘የተቀባው/መሲሑ’ የሚለውን የማዕረግ ትርጉም እንዲይዝ ‘መሲሑ’ ተመርጧል። በተለምዶ የሚታወቀው ‘ክርስቶስ’ የሚለው አማራጭ በማስታወሻ ቀርቧል።
- issue: ἐν የሚያመለክተው ከመሲሑ ጋር ያለ ግንኙነት
  choice: ‘በ’ የሚለውን አጭር አወቃቀር መጠበቅ
  alternative: ‘ስለ መሲሑ’ ወይም ‘በመሲሑ ምክንያት’
  rationale: ምክንያታዊ ትርጉምን ብቻ መምረጥ በግሪኩ ያለውን ሆን ተብሎ ያልተፈታ ግንኙነታዊ ስፋት ያጠባል፤ ‘በ’ ግን ይህን ውጥረት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ግልጽና ክብር ያለው አማርኛ ተጠቅሟል። ‘አብሮኝ የታሰረው’ ከቃል በቃል ‘የእስራት ጓደኛዬ’ ይልቅ ለዘመናዊ አንባቢ ተፈጥሯዊ ሲሆን የግሪኩን ትርጉም ይጠብቃል። የማስታወሻው ምልክት ከሚመለከተው ‘በመሲሑ ኢየሱስ’ ሐረግ ቀጥሎ ተቀምጧል።
