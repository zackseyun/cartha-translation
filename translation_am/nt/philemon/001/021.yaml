  text: πεποιθὼς τῇ ὑπακοῇ σου ἔγραψά σοι, εἰδὼς ὅτι καὶ ὑπὲρ ⸀ἃ λέγω ποιήσεις.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/021.yaml
  text: Confident of your obedience[a], I wrote to you, knowing that you will do even more than I say.
translation:
  language: am
  text: በመታዘዝህ ተማምኜ፣ ከምለውም በላይ[a] እንደምታደርግ እያወቅሁ ጻፍሁልህ።
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ወይም፣ «ከምናገረው በላይ።» ጳውሎስ፣ ፊልሞና ከጠየቀው የተወሰነ ነገር የበለጠ እንደሚያደርግ እያመለከተ ሊሆን ይችላል፤ ጽሑፉ ግን ይህ በትክክል ምን እንደሆነ አይገልጽም።
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθὼς
  choice: ተማምኜ
  rationale: ፍጹም አንቀጽ የተረጋጋ እምነትን ያመለክታል፤ «ተማምኜ» ይህን ሁኔታና ከዋናው ግስ ጋር ያለውን ተሳቢ ግንኙነት በተፈጥሯዊ አማርኛ ያስተላልፋል።
- source_word: τῇ ὑπακοῇ σου
  choice: በመታዘዝህ
  rationale: ὑπακοή የመታዘዝን ወይም ለተነገረ ነገር ፈቃደኛ ሆኖ ምላሽ የመስጠትን ሐሳብ ይይዛል። «በመታዘዝህ» የግሪኩን ዳቲቭ ግንኙነት በተፈጥሯዊ ሁኔታ ያሳያል።
- source_word: ἔγραψά σοι
  choice: ጻፍሁልህ
  rationale: የአኦሪስት አመልካች ግስን እንደ ቀላል ያለፈ ጊዜ ያቀርባል፤ ተቀባዩንም «-ልህ» በሚለው ቅጥያ በግልጽ ያሳያል።
- source_word: εἰδὼς
  choice: እያወቅሁ
  rationale: የጳውሎስን እርግጠኛ እውቀት ከመጻፉ ድርጊት ጋር በተሳቢ ሁኔታ ያገናኛል።
- source_word: καὶ ὑπὲρ ἃ λέγω
  choice: ከምለውም በላይ
  rationale: ὑπέρ ከአኩዛቲቭ ጋር «ከ…በላይ/አልፎ» ማለት ነው። «-ም» የκαίን አጽንዖት በተፈጥሯዊ አማርኛ ይገልጣል፣ ነገር ግን ተጨማሪው ድርጊት ምን እንደሆነ አይወስንም።
- source_word: ποιήσεις
  choice: እንደምታደርግ
  rationale: የወደፊት ጊዜውን እርግጠኛ ግምት በተፈጥሯዊ የአማርኛ ተያያዥ አወቃቀር ያቀርባል፤ ድርጊቱንም ሆን ብሎ ክፍት ይተዋል።
theological_decisions:
- issue: በጳውሎስ ልመና ውስጥ የὑπακοή ኃይል
  choice: «መታዘዝ» ተብሎ ተተርጉሟል።
  alternative: «ፈቃደኛ ምላሽ» ወይም «መስማማት»
  rationale: የምንጩን የመታዘዝ ሐሳብና በደብዳቤው ያለውን የሐዋርያዊ ሥልጣን ግንኙነት ይጠብቃል፤ ከጽሑፉ በላይ የሆነ ግዴታ ግን አያስገባም።
- issue: «ከምለውም በላይ» የሚለው አንድምታ
  choice: ተጨማሪው ድርጊት ሳይገለጽ ክፍት ተትቷል።
  alternative: አናሲሞስን ነፃ እንዲያወጣ የተሰጠ ፍንጭ፣ ወይም በልግስና እንዲቀበለው ብቻ የተጠበቀ ነገር
  rationale: የጳውሎስ ቃል ፍንጭ ይሰጣል እንጂ ተጨማሪውን ድርጊት አይገልጽም፤ ትርጉሙ ይህን አሻሚነት ይጠብቃል።
translation_notes:
  register: ዘመናዊ፣ ክብር ያለውና ለተራ አንባቢ ግልጽ የሆነ አማርኛ ተጠቅሟል። የግሪኩ ሁለት ተሳቢ አንቀጾች ተጠብቀዋል፤ ስለ ተጨማሪው ድርጊት ያለው አሻሚነትም አልተፈታም።
