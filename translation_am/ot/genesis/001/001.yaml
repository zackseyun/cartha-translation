  yaml_path: translation/ot/genesis/001/001.yaml
  text: In the beginning, when God created the heavens and the earth[a]—
translation:
  language: am
  text: በመጀመሪያ፣ እግዚአብሔር ሰማያትንና ምድርን በፈጠረ ጊዜ[a]—
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: በባህላዊ አተረጓጎም ይህ ሙሉ ዓረፍተ ነገር ሆኖ፣ “በመጀመሪያ እግዚአብሔር ሰማያትንና ምድርን ፈጠረ።” ተብሎ ይተረጎማል። በዕብራይስጥ בְּרֵאשִׁית የውስንነት አመልካች የሌለው ሲሆን ቀጥሎም ግሱ בָּרָא ይመጣል፤ ስለዚህ ከዘፍጥረት 2፥4 ሁለተኛ ክፍል ጋር በማነጻጸር እንደ ጥገኛ የጊዜ ሐረግ ሊነበብ ይችላል። በዚህ ንባብ ዋናው ሐረግ በቁጥር 3፣ “እግዚአብሔርም፣ ‘ብርሃን ይሁን’ አለ” የሚለው ነው።
    reason: alternative_reading
lexical_decisions:
- source_word: בְּרֵאשִׁית
  choice: በመጀመሪያ፣ … በፈጠረ ጊዜ
  rationale: የרֵאשִׁיתን ‘መጀመሪያ’ የሚለውን መሠረታዊ ትርጉም ይጠብቃል፤ ከተከታዩ ግስ ጋር ያለውን ጊዜ ጠቋሚና ጥገኛ አወቃቀርም በተፈጥሯዊ አማርኛ ያሳያል።
- source_word: בָּרָא
  choice: ፈጠረ
  rationale: ለመለኮታዊ የፍጥረት ተግባር የተለመደውና ቀጥተኛው የአማርኛ አቻ ነው፤ የፍጥረቱን ዘዴ ከጽሑፉ በላይ አይወስንም።
- source_word: אֱלֹהִים
  choice: እግዚአብሔር
  rationale: የዕብራይስጡ ቃል በቅርጹ ብዙ ቢመስልም እዚህ ነጠላ ግስ ይዞ የእስራኤልን አንድ አምላክ ያመለክታል፤ ‘እግዚአብሔር’ በአማርኛ መጽሐፍ ቅዱሳዊ ንግግር ውስጥ ተፈጥሯዊና ክቡር መጠሪያ ነው።
- source_word: אֵת
  choice: '[በተናጠል አልተተረጎመም፤ የቀጥተኛ ተሳቢ ምልክት]'
  rationale: በአማርኛ የቀጥተኛ ተሳቢነቱ በ‘-ን’ ቅጥያ ተገልጧል።
- source_word: הַשָּׁמַיִם
  choice: ሰማያትን
  rationale: የዕብራይስጡን የብዙ ቁጥር ቅርጽ ይጠብቃል፤ ከ‘ምድር’ ጋር በአንድነት የፍጥረትን ሁሉን አቀፍነት ያመለክታል።
- source_word: הָאָרֶץ
  choice: ምድርን
  rationale: ቃሉ ‘ምድር’ ወይም ‘አገር/መሬት’ ሊል ቢችልም፣ ከ‘ሰማያት’ ጋር ባለው ዓለማቀፋዊ ጥምረት ‘ምድር’ ተገቢ ነው።
theological_decisions:
