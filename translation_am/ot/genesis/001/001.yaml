  choice: ጥገኛ የጊዜ ሐረግ፦ ‘በመጀመሪያ፣ እግዚአብሔር … በፈጠረ ጊዜ—’
  alternative: ራሱን የቻለ ዋና ዓረፍተ ነገር፦ ‘በመጀመሪያ እግዚአብሔር ሰማያትንና ምድርን ፈጠረ።’
  rationale: በመነሻው בְּרֵאשִׁית ላይ የውስንነት አመልካች አለመኖሩ፣ ወዲያው የሚከተለው ባለጊዜ ግስ בָּרָא፣ እንዲሁም ከዘፍጥረት 2፥4 እና ከሆሴዕ 1፥2 ጋር ያለው ትይዩ አወቃቀር ጥገኛውን የጊዜ ንባብ ይደግፋሉ። ባህላዊው ራሱን የቻለ ንባብ ግን በማስታወሻ ተጠብቋል፤ ስለዚህ የጽሑፉ አገባባዊ ውጥረት በጸጥታ አልተወገደም።
