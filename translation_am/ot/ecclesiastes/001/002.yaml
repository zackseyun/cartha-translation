  rationale: “ከንቱነት” ወይም “ትርጉም አልባነት” ከቃሉ ሰፊ ምስላዊ ኃይል አንዱን ገጽታ ብቻ ሊያጎላ ይችላል። “ትነት” አላፊነትን፣ ለመያዝ አለመቻልንና የሰው ጥበቃ ከውጤቱ ጋር ያለመጣጣሙን አንድ ላይ ሊሸከም የሚችል ተጨባጭ ምስል ነው፤ ጽሑፉንም ወደ ኒሂሊዝም አያጠብበውም።
