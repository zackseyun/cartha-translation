  choice: ቆሄሌት ብሎ በድምፅ ማስተላለፍ
  alternative: መምህሩ፣ ሰባኪው፣ ሰብሳቢው
  rationale: ሊሆኑ የሚችሉት ትርጉሞች እያንዳንዳቸው የዕብራይስጡን ስፋት በተለየ መንገድ ያጠባሉ። በድምፅ ማስተላለፉ አሻሚነቱን ይጠብቃል።
