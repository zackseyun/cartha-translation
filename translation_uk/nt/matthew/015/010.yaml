lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: покликавши до себе
  rationale: Дієприслівникова конструкція природно передає аористовий медіальний дієприкметник і спрямованість дії до мовця, не посилюючи часової послідовності словом «після».
- source_word: ὄχλον
  choice: натовп
  rationale: Звичний сучасний відповідник для зібрання людей у цій оповідній ситуації.
- source_word: εἶπεν αὐτοῖς
  choice: Він сказав їм
  rationale: Прямо й природно передає дієслово мовлення з непрямим додатком; займенник із великої літери відповідає усталеному шанобливому біблійному вжитку щодо Ісуса.
- source_word: Ἀκούετε
  choice: Слухайте
  rationale: Природний український наказовий спосіб множини, який закликає не просто чути звук, а уважно слухати.
- source_word: συνίετε
  choice: розумійте
  rationale: Передає заклик осягнути зміст почутого та зберігає паралельну наказову форму грецького тексту.
- source_word: Καὶ
  choice: І
  rationale: Зберігає простий оповідний сполучник без додавання часової чи логічної інтерпретації.
