    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: їли
  rationale: Аорист ἐσθίω прямо означає «їли»; додаток у грецькому тексті не виражений.
- source_word: πάντες
  choice: всі
  rationale: Передає повний обсяг множинного підмета — усі присутні їли.
- source_word: ἐχορτάσθησαν
  choice: наситилися
  rationale: χορτάζω у цьому контексті означає наїстися досхочу; «наситилися» природно й стисло передає цей зміст.
- source_word: τὸ περισσεῦον τῶν κλασμάτων
  choice: шматків, що залишилися
  rationale: 'Передає субстантивований дієприкметник τὸ περισσεῦον у зв’язку з родовим κλασμάτων: шматки їжі, які лишилися після трапези.'
- source_word: ἦραν
  choice: назбирали
  rationale: У контексті збирання залишків αἴρω означає підняти й зібрати; «назбирали» природно передає завершений результат.
- source_word: ἑπτὰ σπυρίδας πλήρεις
  choice: сім повних кошиків
  rationale: Зберігає число, предмет і предикативне означення повноти; можливий нюанс великого розміру σπυρίς винесено в примітку.
