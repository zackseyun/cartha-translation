base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/039.yaml
  text: And after dismissing the crowds[a], he got into the boat and came to the region of Magadan.
translation:
  language: uk
  text: Відпустивши натовпи, він сів у човен і прибув до околиць Магадана.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'У деяких рукописах: «Магдали» замість «Магадана».'
    reason: textual_variant
lexical_decisions:
- source_word: ἀπολύσας
  choice: Відпустивши
  rationale: 'Аористовий дієприкметник позначає дію, що передує головній: Ісус спершу відпустив людей, а потім сів у човен.'
- source_word: τοὺς ὄχλους
  choice: натовпи
  rationale: Передає форму множини та звичайне значення ὄχλος без архаїчного відтінку.
- source_word: ἐνέβη εἰς τὸ πλοῖον
  choice: сів у човен
  rationale: Природний український відповідник грецького вислову про посадку в човен; не додає значення початку плавання.
- source_word: ἦλθεν
  choice: прибув
  rationale: У розповіді про переміщення до названої місцевості «прибув» природно передає досягнення пункту призначення.
- source_word: τὰ ὅρια
  choice: місцевості
  rationale: Множина ὅρια тут ідіоматично означає територію або район, а не лише лінії кордону.
- source_word: Μαγαδάν
  choice: Магадан
  rationale: Основний текст відтворює назву місцевості за читанням SBLGNT; альтернативне читання подано в примітці.
theological_decisions:
- issue: Текстова форма географічної назви наприкінці вірша
  choice: Магадан
  alternative: Магдала
  rationale: Це текстологічне, а не доктринальне питання. Основний текст дотримується читання Μαγαδάν у наданому грецькому виданні, а поширений варіант збережено в примітці.
translation_notes:
  register: Сучасна, ясна й гідна оповідна українська. Збережено послідовність дій грецького тексту та форму множини «натовпи»; географічний вислів передано природно, без надмірної буквальності.
