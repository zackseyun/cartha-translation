  text: καὶ λέγει αὐτοῖς ὁ Ἰησοῦς· Πόσους ἄρτους ἔχετε; οἱ δὲ εἶπαν· Ἑπτά, καὶ ὀλίγα ἰχθύδια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/034.yaml
  text: And Jesus said to them[a], “How many loaves do you have?” And they said, “Seven, and a few small fish.”
translation:
  language: uk
  text: 'Ісус запитав їх: «Скільки у вас хлібин?» Вони відповіли: «Сім і кілька рибок».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «кілька риб»; у грецькому тексті вжито зменшувальну форму, яка може вказувати на невеликих риб.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: запитав
  rationale: Грецький історичний теперішній час буквально означає «каже», але в сучасній українській оповіді природніше вжити минулий час; з огляду на питальну репліку дієслово «запитав» точно передає мовленнєву дію.
- source_word: Πόσους ἄρτους
  choice: Скільки ... хлібин
  rationale: ἄρτους — злічувана множина від ἄρτος; «хлібин» природно передає окремі буханці або пласкі хліби, не звужуючи форму виробу.
- source_word: ἔχετε
  choice: у вас
  rationale: Українська конструкція «скільки у вас...» ідіоматично передає значення володіння, виражене грецьким ἔχετε.
- source_word: οἱ δὲ εἶπαν
  choice: Вони відповіли
  rationale: δέ тут позначає перехід до відповіді без виразного протиставлення; «відповіли» природно передає функцію репліки в діалозі.
- source_word: Ἑπτά
  choice: Сім
  rationale: Прямий відповідник числівника.
- source_word: ὀλίγα
  choice: кілька
  rationale: Природний український відповідник невеликої невизначеної кількості.
- source_word: ἰχθύδια
  choice: рибок
  rationale: Зменшувальна форма від ἰχθύς допускає значення «невеликі риби»; українське «рибок» стисло зберігає цей відтінок.
theological_decisions: []
translation_notes:
  register: Сучасна стандартна українська мова; проста, гідна діалогічна оповідь. Історичний теперішній передано минулим часом відповідно до природної української наративної норми. Маркер примітки поставлено після речення, якого стосується лексична альтернатива.
