  yaml_path: translation/nt/matthew/015/009.yaml
  text: But they worship me in vain[b][a], teaching as doctrines the commandments of men.
translation:
  language: uk
  text: Та марно вони поклоняються Мені, викладаючи людські заповіді як вчення.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μάτην
  choice: марно
  rationale: Природно передає значення «без користі, без результату» й зберігає осудливий тон цитати.
- source_word: δὲ
  choice: Та
  rationale: Передає легке протиставлення й природно продовжує докір у контексті.
- source_word: σέβονταί
  choice: поклоняються
  rationale: У цьому контексті дієслово позначає релігійне шанування Бога; «поклоняються» є природним і точним відповідником.
- source_word: με
  choice: Мені
  rationale: Українське дієслово «поклонятися» керує давальним відмінком; займенник стосується Бога в цитаті з Ісаї.
- source_word: διδάσκοντες
  choice: навчаючи
  rationale: Дієприслівник зберігає зв’язок із головним дієсловом і не звужує обставинного відтінку грецького дієприкметника.
- source_word: διδασκαλίας
  choice: як учень
  rationale: 'Форма «як учень» природно виражає предикативний зв’язок: людські заповіді викладають, надаючи їм статус авторитетного вчення.'
- source_word: ἐντάλματα
  choice: заповідей
  rationale: «Заповіді» зберігає формально-релігійне значення приписів і біблійне звучання цитати.
- source_word: ἀνθρώπων
  choice: людських
  rationale: Прикметник точно передає загальнолюдське, а не суто чоловіче значення та виразно протиставляє людське походження Божому.
theological_decisions:
- issue: Синтаксичний зв’язок у вислові διδασκαλίας ἐντάλματα ἀνθρώπων
  choice: навчаючи людських заповідей як учень
  alternative: навчаючи учень — людських заповідей
  rationale: Основний варіант ясно передає, що людським заповідям надають статус авторитетних учень. Проте стислість грецької конструкції допускає й прикладкове прочитання, тому його збережено у примітці.
- issue: Загальне значення ἀνθρώπων
  choice: людських
  alternative: людей
  rationale: Грецьке слово тут означає людей загалом і протиставляє людське Божому; «людських» природно та без гендерного звуження передає цей контраст.
translation_notes:
  register: Сучасна літературна українська з гідним біблійним звучанням. Порядок слів природний для української, а формулювання зберігає стислість і викривальний тон пророчої цитати.
