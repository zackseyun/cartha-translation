  text: But he said[a], “Are you also still without understanding?”
translation:
  language: uk
  text: 'А Він сказав: «Невже й ви досі не розумієте?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: А Він сказав
  rationale: Артикль ὁ тут ужито займенниково щодо Ісуса, а δέ позначає перехід до Його відповіді; українське «А Він сказав» природно відтворює оповідну конструкцію.
- source_word: Ἀκμὴν
  choice: досі
  rationale: Прислівник указує на стан, який триває аж до цього моменту; «досі» стисло й природно передає цей часовий відтінок.
- source_word: καὶ ὑμεῖς
  choice: й ви
  rationale: 'καί має включальне значення: докір стосується також учнів. Частка «й» разом із виразним займенником «ви» зберігає наголос оригіналу.'
- source_word: ἀσύνετοί ἐστε
  choice: не розумієте
  rationale: У контексті йдеться про брак розуміння сказаного Ісусом. Дієслівне українське формулювання природніше за буквальне «не маєте розуміння» і не посилює докір до значення моральної нерозумності.
theological_decisions:
- issue: Тон Ісусового докору учням
  choice: «Невже й ви досі не розумієте?» — виразне запитання про тривалий брак розуміння
  alternative: «Невже й ви досі нетямущі?»
  rationale: Переклад зберігає гостроту докору та здивування, але не надає ἀσύνετοι надмірно зневажливого або морально осудливого відтінку.
translation_notes:
  register: Сучасна нормативна українська мова; вислів стислий, гідний і зрозумілий. «Невже» природно передає риторичний характер грецького запитання, а «досі» відтворює Ἀκμὴν без надлишкового дублювання часових часток.
