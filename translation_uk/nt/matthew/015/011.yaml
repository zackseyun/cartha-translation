lexical_decisions:
- source_word: κοινοῖ
  choice: опоганює
  rationale: У контексті чистоти дієслово означає робити людину нечистою або оскверненою. «Опоганює» природно передає як ритуальний, так і моральний відтінок, не зводячи вислів до фізичного забруднення.
- source_word: τὸ εἰσερχόμενον εἰς τὸ στόμα
  choice: те, що входить в уста
  rationale: Субстантивований дієприкметник природно передано конструкцією «те, що». «Входить в уста» зберігає конкретний образ і напрямок εἰς.
- source_word: τὸ ἐκπορευόμενον ἐκ τοῦ στόματος
  choice: те, що виходить з уст
  rationale: Конструкція «те, що виходить» природно передає субстантивований дієприкметник, а «з уст» відтворює ἐκ τοῦ στόματος без зайвої архаїчності.
- source_word: τὸν ἄνθρωπον
  choice: людину
  rationale: Грецьке ἄνθρωπος тут має узагальнювальне значення — людська особа. Українське «людину» точно зберігає однину й не створює хибного враження, ніби йдеться лише про чоловіка.
- source_word: τοῦτο
  choice: ось що
  rationale: Окремий вказівний займенник підсилює другу частину протиставлення. «Ось що» виразно й природно зберігає цей наголос.
- source_word: οὐ ... ἀλλὰ
  choice: не ... а ...
  rationale: Звична українська конструкція чітко відтворює грецьке заперечення з протиставленням.
theological_decisions:
- issue: Значення мови чистоти в κοινόω
  choice: «опоганює» — зі збереженням ритуального та морального відтінків
  alternative: «робить нечистою»; «оскверняє»
  rationale: Контекст стосується чистоти перед Богом. Обране слово не обмежує зміст лише обрядовим статусом, але й не перетворює його на звичайне фізичне забруднення.
- issue: Узагальнювальне значення ἄνθρωπος
  choice: «людину»
  alternative: «чоловіка»
  rationale: У цьому вислові однина має представницьке, загальнолюдське значення. Українське «людина» безпосередньо відповідає цьому значенню та не усуває граматичної однини.
translation_notes:
  register: Сучасна літературна українська з урочистою біблійною стриманістю. «Уста» зберігає гідний регістр і повтор образу оригіналу; синтаксис лишається ясним для широкого кола читачів.
