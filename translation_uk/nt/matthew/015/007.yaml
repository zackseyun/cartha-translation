  text: ὑποκριταί, καλῶς ἐπροφήτευσεν περὶ ὑμῶν Ἠσαΐας λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/007.yaml
  text: 'Hypocrites[a], Isaiah rightly prophesied about you, saying:'
translation:
  language: uk
  text: 'Лицеміри! Добре пророкував про вас Ісая, кажучи:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποκριταί
  choice: Лицеміри!
  rationale: Кличний відмінок множини є прямим і різким осудливим звертанням. Окличний знак природно передає його риторичну силу українською.
- source_word: καλῶς
  choice: Добре
  rationale: Прислівник означає, що пророцтво Ісаї влучно й правдиво стосується адресатів. «Добре пророкував» зберігає також можливу близькість прислівника до самого дієслова, не звужуючи значення до одного лише «правильно».
- source_word: ἐπροφήτευσεν
  choice: пророкував
  rationale: Прямий і усталений відповідник дієслова προφητεύω, який зберігає пророчий регістр та зв’язок з Ісаєю.
- source_word: περὶ ὑμῶν
  choice: про вас
  rationale: Природний сучасний український відповідник περί з родовим відмінком у значенні «про, щодо».
- source_word: Ἠσαΐας
  choice: Ісая
  rationale: Усталена українська біблійна форма імені пророка.
- source_word: λέγων
  choice: 'кажучи:'
  rationale: Дієприкметник вводить подальшу цитату; «кажучи» стисло зберігає грецьку синтаксичну форму й функцію.
theological_decisions:
- issue: Сила звертання Ісуса до фарисеїв і книжників
  choice: Пряме осудливе звертання «Лицеміри!»
  alternative: Пом’якшене «Удаванці!» або розгорнуте «О лицеміри!»
  rationale: ὑποκριταί у цьому контексті є сильним морально-релігійним звинуваченням. «Лицеміри» точно й природно передає його, не послаблюючи осуду.
- issue: Значення καλῶς щодо пророцтва Ісаї
  choice: «Добре пророкував»
  alternative: «Правильно пророкував» або «влучно пророкував»
  rationale: Грецьке καλῶς допускає відтінки «добре, слушно, влучно». Формулювання «добре пророкував» зберігає цю широту й не усуває смислової напруги між якістю вислову та його влучним застосуванням до слухачів.
translation_notes:
  register: Сучасна нормативна українська мова з гідним біблійним звучанням. Різкість початкового кличного звертання збережено; синтаксис лишається близьким до грецького, але природним українською.
