id: MAT.15.3
reference: Matthew 15:3
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Διὰ τί καὶ ὑμεῖς παραβαίνετε τὴν ἐντολὴν τοῦ θεοῦ διὰ τὴν παράδοσιν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/003.yaml
  text: But he answered and said to them[a], “Why do you also transgress the commandment of God for the sake of your tradition?”
translation:
  language: uk
  text: 'А він у відповідь сказав їм: «Чому ж і ви порушуєте Божу заповідь через вашу традицію[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «заради вашої традиції».'
    reason: 'Лексико-синтаксична альтернатива: διά зі знахідним відмінком може підкреслювати не лише причину, а й те, в чиїх інтересах або заради чого чиниться дія.'
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: у відповідь сказав
  rationale: Природний український відповідник, який передає і значення дієприкметника «відповівши», і дієслова «сказав», не створюючи штучної конструкції «відповів і сказав».
- source_word: Διὰ τί
  choice: чому
  rationale: Природна сучасна форма запитання про причину.
- source_word: καὶ ὑμεῖς
  choice: і ви
  rationale: 'Зберігає зіставлення зі щойно висунутим звинуваченням: Ісус звертає його також до книжників і фарисеїв. Частка «ж» у ширшій фразі передає відповідний полемічний відтінок.'
- source_word: παραβαίνετε
  choice: порушуєте
  rationale: Точно й зрозуміло передає переступання або недотримання заповіді без надмірно архаїчного відтінку.
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: Божу заповідь
  rationale: Природна українська присвійна конструкція; «заповідь» зберігає біблійний і завітний регістр ἐντολή.
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: через вашу традицію
  rationale: διά зі знахідним відмінком тут найприродніше виражає причину; «традиція» прямо передає те, що було передане людьми, і не розширює докір на будь-яку традицію взагалі.
theological_decisions:
- issue: Протиставлення Божої заповіді людській традиції
  choice: «Божу заповідь» і «вашу традицію»
  alternative: «Божий наказ» і «ваше передання»
  rationale: Обрані слова чітко зберігають протиставлення божественного веління конкретній традиції співрозмовників, не перетворюючи цей вірш на загальний осуд усіх традицій.
- issue: Смисловий відтінок διά з акузативом
  choice: «через вашу традицію» — причина або підстава порушення
  alternative: «заради вашої традиції» — мета або інтерес, якому надають перевагу
  rationale: Грецька конструкція допускає відтінки причини та дії в інтересах чогось. Основний текст використовує природніше причинне формулювання, а примітка зберігає можливий цільовий відтінок.
translation_notes:
  register: Сучасна нормативна українська мова з гідним біблійним регістром. Формула «у відповідь сказав» природно відтворює семітизований грецький зворот; «порушуєте» є зрозумілим без архаїзації. Частка «ж» підтримує полемічний зв’язок із попереднім запитанням.
