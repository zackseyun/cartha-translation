  source_fidelity: 'Український текст точно передає зміст грецького оригіналу: «у відповідь сказав» природно відтворює ἀποκριθεὶς εἶπεν; «Чому ж і ви» зберігає питальну форму та зіставний наголос καὶ ὑμεῖς; «порушуєте Божу заповідь» відповідає παραβαίνετε τὴν ἐντολὴν τοῦ θεοῦ. «Через вашу традицію» є придатним сучасним відповідником διὰ τὴν παράδοσιν ὑμῶν у його причинному значенні.'
  naturalness: Фраза нормативна й природна для сучасної української, із доречним біблійним регістром. «А він у відповідь сказав їм» не є штучним дублюванням, а плавно передає формулу відповіді. Частка «ж» доречно підсилює полемічний перехід, не змінюючи змісту.
  terminology: «Божа заповідь» адекватно зберігає біблійний регістр ἐντολή та контраст із «вашою традицією» для παράδοσις. Формулювання не поширює докір на традицію як таку, а лишає його прив’язаним до практики співрозмовників. Примітка коректно подає можливий відтінок «заради вашої традиції».
