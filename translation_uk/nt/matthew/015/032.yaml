source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς προσκαλεσάμενος τοὺς μαθητὰς αὐτοῦ εἶπεν· Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον, ὅτι ἤδη ἡμέραι τρεῖς προσμένουσίν μοι καὶ οὐκ ἔχουσιν τί φάγωσιν· καὶ ἀπολῦσαι αὐτοὺς νήστεις οὐ θέλω, μήποτε ἐκλυθῶσιν ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/032.yaml
  text: Then Jesus called his disciples to him and said[a], “I have compassion on the crowd, because they have already remained with me for three days and have nothing to eat. And I do not want to send them away hungry[d][c][b], lest they collapse on the way.”
translation:
  language: uk
  text: 'Тоді Ісус покликав до себе своїх учнів і сказав: «Мені шкода цього натовпу[a], бо люди вже три дні залишаються зі мною і не мають чого їсти. Я не хочу відпускати їх голодними[b], щоб вони не знесилилися в дорозі[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Я співчуваю цьому натовпу» чи «Я сповнений співчуття до цього натовпу».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не поївши» або «натщесерце». Тут ідеться про те, що люди залишилися без їжі, а не про релігійний піст.'
    reason: lexical_alternative
  - marker: c
    text: 'Або: «щоб вони не зомліли дорогою».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: покликав до себе
  rationale: 'Передає значення середнього стану та спрямованість дії: Ісус кличе учнів до себе.'
- source_word: Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον
  choice: Мені шкода цього натовпу
  rationale: Природний сучасний український вислів, що передає глибоке співчуття Ісуса; виноска зберігає ближчий формальний варіант.
- source_word: ἤδη ἡμέραι τρεῖς προσμένουσίν μοι
  choice: люди вже три дні залишаються зі мною
  rationale: «Залишаються зі мною» передає тривалу присутність біля Ісуса, а «люди» природно відсилає до збірного іменника «натовп».
- source_word: οὐκ ἔχουσιν τί φάγωσιν
  choice: не мають чого їсти
  rationale: Точний та ідіоматичний український відповідник грецької конструкції.
- source_word: ἀπολῦσαι
  choice: відпускати
  rationale: У контексті зібраного натовпу дієслово означає дозволити людям розійтися, відіславши їх.
- source_word: νήστεις
  choice: голодними
  rationale: У контексті йдеться про людей без їжі, а не про добровільний релігійний піст.
- source_word: μήποτε ἐκλυθῶσιν
  choice: щоб вони не знесилилися
  rationale: Передає побоювання щодо виснаження або втрати сил без надмірного уточнення, чи люди знепритомніють або впадуть.
- source_word: ἐν τῇ ὁδῷ
  choice: в дорозі
  rationale: Природний український відповідник, що стосується їхньої подальшої дороги.
