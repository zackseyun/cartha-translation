  text: ὁ δὲ οὐκ ἀπεκρίθη αὐτῇ λόγον. καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ⸀ἠρώτουν αὐτὸν λέγοντες· Ἀπόλυσον αὐτήν, ὅτι κράζει ὄπισθεν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/023.yaml
  text: But he did not answer her a word[a]. And his disciples came and kept asking him, saying, “Send her away[b], because she is crying out behind us.”
translation:
  language: uk
  text: 'Але він не відповів їй ні слова. Його учні підійшли до нього й просили його: «Відпусти її[a], бо вона кричить позаду нас[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або «Відішли її». Зі слів учнів не зрозуміло, чи вони мали на увазі: «Задовольни її прохання й відпусти», чи просто: «Відішли її від нас».'
    reason: alternative_reading
  - marker: b
    text: Або «слідом за нами». Грецький вислів може вказувати як на місце («позаду нас»), так і на рух слідом («слідом за нами»).
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἀπεκρίθη αὐτῇ λόγον
  choice: не відповів їй ні слова
  rationale: Природний український відповідник грецького вислову, який зберігає наголос на цілковитій відсутності відповіді.
- source_word: προσελθόντες
  choice: підійшли
  rationale: Точно передає рух учнів до Ісуса й природно звучить в українській оповіді.
- source_word: ἠρώτουν
  choice: почали просити
  rationale: Імперфект указує на тривалу або повторювану дію; конструкція передає наполегливе продовження прохання, не посилюючи дієслово до значення «благали».
- source_word: Ἀπόλυσον αὐτήν
  choice: Відпусти її
  rationale: Вислів природно передає наказ відіслати або відпустити жінку, не уточнюючи, чи спершу слід задовольнити її прохання.
- source_word: κράζει
  choice: кричить
  rationale: Передає гучне, триваюче звертання; теперішній час зберігає безперервність дії.
- source_word: ὄπισθεν ἡμῶν
  choice: позаду нас
  rationale: Зберігає основне просторове значення грецького вислову; можливий відтінок переслідування подано в примітці.
theological_decisions:
- issue: Намір учнів у словах Ἀπόλυσον αὐτήν
  choice: Нейтральне «Відпусти її»
  alternative: «Задовольни її прохання й відпусти» або «Прожени її від нас»
  rationale: Грецький наказ не уточнює, чи учні хотіли, щоб Ісус задовольнив прохання жінки, чи лише відіслав її. Нейтральний переклад зберігає цю оповідну й богословську напругу.
translation_notes:
  register: Сучасна стандартна українська мова; простий, гідний оповідний стиль. Займенники щодо Ісуса подано з малої літери відповідно до загальних норм сучасного українського правопису. Маркери приміток розміщено біля висловів, яких вони безпосередньо стосуються.
