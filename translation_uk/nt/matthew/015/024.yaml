  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Οὐκ ἀπεστάλην εἰ μὴ εἰς τὰ πρόβατα τὰ ἀπολωλότα οἴκου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/024.yaml
  text: But he answered[a], “I was sent only to the lost sheep of the house of Israel.”
translation:
  language: uk
  text: 'Та Він відповів: «Мене послано лише до загублених овець дому Ізраїля».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або, дослівніше: «Мене не послано, хіба що до загублених овець дому Ізраїля».'
    reason: Лексико-синтаксична альтернатива, що формальніше відтворює Οὐκ ... εἰ μή.
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: А Він у відповідь сказав
  rationale: Дієприкметник ἀποκριθείς разом із εἶπεν природно передано українським зворотом «у відповідь сказав»; δέ тут позначає перехід і легке протиставлення, для чого доречне «А».
- source_word: Οὐκ ἀπεστάλην εἰ μὴ
  choice: Я посланий лише
  rationale: Заперечна конструкція з εἰ μή виражає виняткове обмеження. «Лише» природно передає її зміст, тоді як примітка зберігає формальнішу будову «не був посланий ні до кого, крім».
- source_word: τὰ πρόβατα τὰ ἀπολωλότα
  choice: загублених овець
  rationale: Збережено образ овець; перфектний дієприкметник ἀπολωλότα в цьому пастирському образі означає тих, хто загубився, а не обов’язково остаточно загинув.
- source_word: οἴκου Ἰσραήλ
  choice: дому Ізраїля
  rationale: «Дім Ізраїля» зберігає біблійний національно-завітний вислів і є зрозумілим у сучасній українській мові.
theological_decisions:
- issue: Обсяг проголошеної тут місії Ісуса
  choice: 'Збережено виразне обмеження: «лише до загублених овець дому Ізраїля».'
  alternative: Передати як пріоритет Ізраїля або додати натяк на подальшу місію серед народів.
  rationale: Грецьке Οὐκ ... εἰ μή прямо виражає обмеження. Переклад не пом’якшує вислів і не розв’язує його напруження за допомогою ширшого канонічного контексту.
translation_notes:
  register: Сучасна, гідна й загальнозрозуміла українська. Займенник «Він» написано з великої літери як усталену шанобливу практику; образність і біблійний вислів «дім Ізраїля» збережено.
