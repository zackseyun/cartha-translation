- from: 'А Він у відповідь сказав: «Я посланий лише до загублених овець дому Ізраїля».[a]'
  to: 'Та Він відповів: «Мене послано лише до загублених овець дому Ізраїля».[a]'
  rationale: The revision replaces a potentially present-oriented passive expression with Ukrainian «Мене послано», reflecting the aorist passive ἀπεστάλην and maintaining the explicit limitation of the saying. It also makes the alternative footnote closer to the Greek negative-exception construction. No theological expansion or resolution has been introduced.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:05:39Z'
review_pass:
  verdict: revise
  source_fidelity: The restrictive force of Οὐκ ἀπεστάλην εἰ μὴ and the sheep metaphor are preserved. However, «Я посланий» is naturally read as a present-state passive/adjectival expression in Ukrainian, whereas the Greek aorist passive refers to the sending/commissioning as a completed act. «Мене послано» renders this more faithfully without adding interpretation.
  naturalness: «Та Він відповів» is concise, idiomatic modern Ukrainian narrative prose. «Мене послано лише до...» is natural in a solemn biblical register and clearly expresses the stated mission.
  terminology: «Загублені вівці дому Ізраїля» appropriately retains the biblical metaphor and established idiom. The revised footnote preserves the formal negative-except construction without adding «ні до кого», which is not explicit in the Greek.
  issues:
  - severity: medium
    issue: «Я посланий» does not clearly represent the Greek aorist passive.
    rationale: In modern Ukrainian it most readily denotes a present condition (“I am sent”) rather than the completed commissioning expressed by ἀπεστάλην. The impersonal passive «Мене послано» better conveys the source form and sense.
  - severity: low
    issue: The footnote introduces «ні до кого».
    rationale: Although it communicates the intended restriction, the Greek construction directly contrasts being sent with the destination marked by εἰς. A footnote using «хіба що до» is closer and avoids an unnecessary supplied object.
  revised_text: 'Та Він відповів: «Мене послано лише до загублених овець дому Ізраїля».[a]'
  revised_footnotes:
  - marker: a
    text: 'Або, дослівніше: «Мене не послано, хіба що до загублених овець дому Ізраїля».'
    reason: Лексико-синтаксична альтернатива, що формальніше відтворює Οὐκ ... εἰ μή.
  revision_rationale: The revision replaces a potentially present-oriented passive expression with Ukrainian «Мене послано», reflecting the aorist passive ἀπεστάλην and maintaining the explicit limitation of the saying. It also makes the alternative footnote closer to the Greek negative-exception construction. No theological expansion or resolution has been introduced.
