base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/019.yaml
  text: For out of the heart come evil thoughts[a], murders, adulteries, sexual immoralities, thefts, false testimonies, and blasphemies.
translation:
  language: uk
  text: Бо із серця виходять злі помисли, убивства, перелюби, статева розпуста, крадіжки, неправдиві свідчення та наклепи[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «богозневаги». Грецьке слово може означати наклепницьку чи зневажливу мову проти людей або зневажливу мову щодо Бога — залежно від контексту.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ γὰρ τῆς καρδίας
  choice: Бо із серця
  rationale: «Бо» передає пояснювальну силу γάρ, а «із серця» — джерело, виражене ἐκ, і зберігає біблійну метафору серця як внутрішньої людини.
- source_word: ἐξέρχονται
  choice: виходять
  rationale: Природно передає рух назовні та походження названих учинків і станів із внутрішнього джерела.
- source_word: διαλογισμοὶ πονηροί
  choice: злі помисли
  rationale: «Помисли» охоплюють думки, міркування й внутрішні наміри, не звужуючи значення до ретельно складених задумів.
- source_word: φόνοι
  choice: убивства
  rationale: Прямий відповідник множини, що зберігає моральну вагу слова та структуру переліку.
- source_word: μοιχεῖαι
  choice: перелюби
  rationale: Передає порушення подружньої вірності та зберігає форму множини в переліку.
- source_word: πορνεῖαι
  choice: статева розпуста
  rationale: Природний сучасний український збірний вислів для широкого кола недозволеної статевої поведінки; буквальна множина українською звучала б неприродно.
- source_word: κλοπαί
  choice: крадіжки
  rationale: Стислий і природний відповідник множини.
- source_word: ψευδομαρτυρίαι
  choice: неправдиві свідчення
  rationale: Зберігає множину й виразний юридично-свідчильний відтінок грецького слова.
- source_word: βλασφημίαι
  choice: лихослів’я
  rationale: Передає ширше значення образливої або наклепницької мови, не звужуючи слово лише до зневаги Бога; контекст не називає об’єкта такої мови.
theological_decisions:
- issue: Спрямованість βλασφημίαι у переліку зла
  choice: У тексті вжито «лихослів’я».
  alternative: «богозневага»
  rationale: Грецьке слово може стосуватися як зневажливої чи наклепницької мови про людей, так і зневаги Бога. Оскільки об’єкт тут не названий, основний текст зберігає ширший зміст, а традиційно богословське розуміння подано в примітці.
translation_notes:
  register: Сучасна стандартна українська мова, природний і гідний біблійний стиль. Збережено ритм переліку; там, де буквальна множина була б неприродною, вжито українську збірну форму «статева розпуста». Маркер примітки поставлено після слова, якого вона стосується.
