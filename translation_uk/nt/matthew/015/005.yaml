  text: But you say[a], ‘Whoever says to his father or his mother, “Whatever you would have benefited from me is a gift,”’
translation:
  language: uk
  text: 'А ви кажете: «Хто скаже батькові чи матері: “Усе, що ти міг би мати від мене на користь, — дар[a]”»,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «пожертва». Йдеться про те, що майно, яке могло бути використане для утримання батьків, оголошували присвяченим Богові; пор. Марка 7:11, де вжито слово «корбан».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: А ви кажете
  rationale: Сполучник δὲ передає протиставлення попередній Божій заповіді, а займенник ὑμεῖς наголошено відтворено як «ви».
- source_word: Ὃς ἂν εἴπῃ
  choice: Хто скаже
  rationale: Відносний займенник з ἄν та аористом кон’юнктива виражає загальну невизначену умову; «хто скаже» природно передає її українською.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: батькові чи матері
  rationale: Давальний відмінок збережено; у парній альтернативі українське «чи» звучить природно, а присвійний займенник не потрібний для ясності.
- source_word: Δῶρον
  choice: дар
  rationale: «Дар» зберігає пряме значення δῶρον і не вводить до Матвієвого тексту технічного слова «корван», наявного в паралельному місці в Марка.
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: Усе, що ти міг би отримати від мене на допомогу
  rationale: Формулювання природно передає можливу користь або підтримку, яку батько чи мати могли одержати від мовця; «від мене» зберігає спрямування ἐξ ἐμοῦ, а «міг би» — потенційність конструкції.
theological_decisions:
- issue: Чи вводити до тексту Матвія технічний термін «корван»
  choice: Залишити Матвієве слово «дар»
  alternative: «корван» або «пожертва, присвячена Богові»
  rationale: У Матвія стоїть δῶρον, а не κορβᾶν, як у Марка 7:11. Значення присвяти Богові пояснено в примітці, а не додано до основного тексту.
translation_notes:
  register: Сучасна нормативна українська, стриманий і гідний біблійний стиль. Зворот «отримати від мене на допомогу» робить пасивну грецьку конструкцію зрозумілою без усунення її змістової напруги. Кінцева кома показує, що вислів синтаксично продовжується в наступному вірші.
