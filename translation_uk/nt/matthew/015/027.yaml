source:
  edition: SBLGNT
  text: ἡ δὲ εἶπεν· Ναί, κύριε, καὶ γὰρ τὰ κυνάρια ἐσθίει ἀπὸ τῶν ψιχίων τῶν πιπτόντων ἀπὸ τῆς τραπέζης τῶν κυρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/027.yaml
  text: She said[a], “Yes, Lord[b], for even the little dogs eat from the crumbs that fall from their masters’ table.”
translation:
  language: uk
  text: 'А вона сказала: «Так, Господи[b], бо ж і песики[a] їдять крихти, що падають зі столу їхніх господарів».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «собаки», «домашні собаки» чи «цуценята»; у грецькому тексті вжито зменшену форму, яка може вказувати на малих домашніх собак.
    reason: lexical_alternative
  - marker: b
    text: «Господи» тут можна також розуміти як шанобливе «пане».
    reason: alternative_reading
lexical_decisions:
- source_word: Ναί
  choice: Так
  rationale: Природна українська ствердна відповідь, яка передає згоду жінки з попередніми словами Ісуса.
- source_word: κύριε
  choice: Господи
  rationale: Клична форма зберігає звичне в Євангеліях звертання до Ісуса та можливий богословський відтінок, не усуваючи можливості шанобливого звертання.
- source_word: καὶ γὰρ
  choice: бо ж і
  rationale: «Бо» передає пояснювальну силу γάρ, «і» — додатковий відтінок καί, а частка «ж» природно підкреслює аргумент жінки.
- source_word: κυνάρια
  choice: песики
  rationale: Українська зменшена форма відтворює демінутив κυνάρια й природно викликає образ малих домашніх собак, не звужуючи значення до цуценят.
- source_word: ἐσθίει
  choice: їдять
  rationale: Грецьке дієслово стоїть в однині при підметі середнього роду множини; українська нормативно вимагає множини.
- source_word: ψιχίων
  choice: крихти
  rationale: Точно й природно передає дрібні частинки їжі в образі столу.
- source_word: τῶν πιπτόντων
  choice: що падають
  rationale: Відносне речення природно передає грецький дієприкметник теперішнього часу та його узагальнений характер.
- source_word: τραπέζης
  choice: столу
  rationale: Звичайне значення слова й центральна деталь домашнього образу.
- source_word: τῶν κυρίων αὐτῶν
  choice: їхніх господарів
  rationale: «Господарів» природно позначає людей, яким належать домашні тварини, і зберігає відтінок влади; «їхніх» чітко співвідноситься з песиками.
theological_decisions:
- issue: Передача κύριε у звертанні до Ісуса
  choice: Господи
  alternative: пане
  rationale: «Господи» зберігає звичне євангельське звучання та можливу глибшу оцінку особи й влади Ісуса; примітка залишає відкритим суто шанобливе прочитання.
- issue: Передача зменшеної форми κυνάρια
  choice: песики
  alternative: собаки; домашні собаки; цуценята
  rationale: Вибір відтворює формальну зменшеність грецького слова, не посилює різкості образу й не визначає вік тварин, як це зробило б слово «цуценята».
translation_notes:
  register: Сучасна нормативна українська мова з гідним, але доступним євангельським звучанням. Порядок слів і сполука «бо ж і» зберігають згоду жінки та пояснювальний хід її відповіді без додавання явного протиставного сполучника, якого немає в грецькому тексті.
