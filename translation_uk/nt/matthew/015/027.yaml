  source_fidelity: 'Текст точно передає синтаксичний і смисловий хід грецького оригіналу: ствердну відповідь («Так»), звертання κύριε («Господи»), пояснювально-додаткову сполуку καὶ γάρ («бо ж і»), зменшену форму κυνάρια («песики»), а також образ крихт, що падають зі столу господарів. Повтор прийменника ἀπό природно відображено конструкцією «крихти, що падають зі столу».'
  naturalness: Фраза звучить природно сучасною нормативною українською та зберігає стриманий євангельський регістр. «Бо ж і песики» є ідіоматичним способом передати аргументативний, підсилювальний характер вислову без штучної буквальності.
  terminology: «Господи» доречно зберігає традиційне євангельське звертання й не усуває значення шанобливого «пане», яке зазначене у примітці. «Песики» адекватно передає демінутив κυνάρια, не нав’язуючи значення «цуценята». «Господарів» природно передає людських κυρίων у межах побутової метафори.
