source:
  edition: SBLGNT
  text: Τότε προσελθόντες οἱ ⸀μαθηταὶ ⸀λέγουσιν αὐτῷ· Οἶδας ὅτι οἱ Φαρισαῖοι ἀκούσαντες τὸν λόγον ἐσκανδαλίσθησαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/012.yaml
  text: Then the disciples came and said to him[b][a], “Do you know that the Pharisees were offended when they heard this word?”
translation:
  language: uk
  text: 'Тоді учні підійшли й сказали Йому: «Чи знаєш Ти, що фарисеї, почувши ці слова[b], образилися[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «обурилися»; досл. «були введені в спотикання».
    reason: lexical_alternative
  - marker: b
    text: «Ці слова» стосуються попередніх слів Ісуса.
    reason: cross_reference
lexical_decisions:
- source_word: Τότε
  choice: Тоді
  rationale: Природний український оповідний сполучник, що позначає наступну подію.
- source_word: προσελθόντες
  choice: підійшли
  rationale: Передає наближення учнів до Ісуса; разом із особовим дієсловом природно відтворюється конструкцією «підійшли й сказали».
- source_word: οἱ μαθηταὶ
  choice: учні
  rationale: Грецький текст має означену назву вже відомої групи; в українському контексті означеність зрозуміла без додавання «Його».
- source_word: λέγουσιν αὐτῷ
  choice: сказали Йому
  rationale: Історичний теперішній час природно передано минулим часом української оповіді.
- source_word: Οἶδας
  choice: Чи знаєш Ти
  rationale: Прямо передає запитання, не підсилюючи його тлумачним «чи усвідомлюєш».
- source_word: οἱ Φαρισαῖοι
  choice: фарисеї
  rationale: Усталена українська назва цієї релігійної групи.
- source_word: ἀκούσαντες τὸν λόγον
  choice: почувши сказане
  rationale: У цьому контексті λόγος означає щойно висловлене Ісусом твердження; «сказане» звучить природніше за буквальне «це слово» й не додає нового змісту.
- source_word: ἐσκανδαλίσθησαν
  choice: обурилися
  rationale: У контексті передає різко негативну реакцію фарисеїв на вислів Ісуса, не нав’язуючи сучасного значення «спокусилися».
theological_decisions:
- issue: Значення σκανδαλίζω в описі реакції фарисеїв
  choice: обурилися
  alternative: образилися; спіткнулися
  rationale: Контекст указує на негативну реакцію на вчення. «Обурилися» природне українською, а примітка зберігає можливість значення «образилися» та буквальний образ спотикання, не перетворюючи вислів на твердження про відступництво чи моральну спокусу.
translation_notes:
  register: Сучасна, зрозуміла й водночас гідна українська оповідна мова. Збережено пряме запитання та послідовність грецького речення; історичний теперішній передано звичним українським минулим часом.
