revisions:
- from: 'Тоді учні підійшли й сказали Йому: «Чи знаєш Ти, що фарисеї, почувши сказане[b], обурилися[a]?»'
  to: 'Тоді учні підійшли й сказали Йому: «Чи знаєш Ти, що фарисеї, почувши ці слова[b], образилися[a]?»'
  rationale: The revision replaces an interpretively stronger expression of anger with the more source-near contextual sense, «образилися», and makes the referent of λόγος explicit as «ці слова». The footnote preserves both a natural alternative and the underlying stumbling metaphor without treating it as a doctrinal assertion.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:05:40Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the narrative sequence, the disciples’ approach and question, and the Pharisees’ reaction. However, «обурилися» narrows ἐσκανδαλίσθησαν to indignation; in this context the verb more directly denotes taking offense. «Почувши сказане» is understandable but less explicit than the Greek object τὸν λόγον and its reference to Jesus’ preceding statement.
  naturalness: The sentence is fluent modern Ukrainian. «Почувши ці слова» is more idiomatic and clearer than the substantivized «почувши сказане». «Образилися» is a natural contextual rendering of the reaction described.
  terminology: «Фарисеї» and «учні» are appropriate. The revised rendering retains the contextual sense of σκανδαλίζω without importing a doctrinal sense of apostasy or temptation. The alternative note should not call «спіткнулися» strictly literal without reflecting the passive/causative force of the Greek verb.
  issues:
  - severity: medium
    issue: «Обурилися» for ἐσκανδαλίσθησαν
    rationale: Although possible as an inferred reaction, «обурилися» emphasizes anger and can overstate the lexical sense. Here «образилися» more closely conveys that the Pharisees took offense, in line with the source and English audit trail.
  - severity: low
    issue: «Почувши сказане» for ἀκούσαντες τὸν λόγον
    rationale: The phrase is natural but vague. «Почувши ці слова» more clearly represents the utterance being heard and preserves its anaphoric reference to Jesus’ preceding words.
  - severity: low
    issue: Footnote’s claim that «спіткнулися» is literal
    rationale: The Greek passive of σκανδαλίζω has a causative/passive metaphorical force. A note should present «спіткнулися» as a closer literal-style alternative rather than an unqualified literal equivalent.
  revised_text: 'Тоді учні підійшли й сказали Йому: «Чи знаєш Ти, що фарисеї, почувши ці слова[b], образилися[a]?»'
  revised_footnotes:
