    reason: lexical_alternative
  - marker: b
    text: «Ці слова» стосуються попередніх слів Ісуса.
    reason: cross_reference
  revision_rationale: The revision replaces an interpretively stronger expression of anger with the more source-near contextual sense, «образилися», and makes the referent of λόγος explicit as «ці слова». The footnote preserves both a natural alternative and the underlying stumbling metaphor without treating it as a doctrinal assertion.
