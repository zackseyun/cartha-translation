base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/008.yaml
  text: This people honors me with their lips[a], but their heart is far from me.
translation:
  language: uk
  text: Цей народ шанує Мене устами, а їхнє серце[a] далеко від Мене.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «їхні серця». У грецькому тексті стоїть однина «серце», імовірно вжита збірно щодо народу як цілого.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ λαὸς οὗτος
  choice: Цей народ
  rationale: Зберігає значення λαός як збірного поняття та вказівну силу οὗτος; природно відтворює також пророче звучання цитати.
- source_word: τοῖς χείλεσίν
  choice: устами
  rationale: Давальний відмінок має інструментальне значення. «Устами» природно й виразно зберігає конкретний образ χείλη, не замінюючи його абстрактними «словами».
- source_word: με
  choice: Мене
  rationale: Прямий додаток при τιμᾷ. Написання з великої літери відповідає усталеній українській біблійній практиці щодо займенника, який стосується Бога.
- source_word: τιμᾷ
  choice: шанує
  rationale: Точно передає значення «виявляє пошану, честь» без посилення до «прославляє».
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: а їхнє серце
  rationale: «А» природно передає протиставне δέ. Однина «серце» збережена як збірне позначення внутрішнього стану всього народу.
- source_word: πόρρω
  choice: далеко
  rationale: Стисло й природно передає просторово-реляційне значення πόρρω.
- source_word: ἀπέχει ἀπ’ ἐμοῦ
  choice: далеко від Мене
  rationale: Природна українська конструкція, що передає стан віддаленості; разом із πόρρω не потребує окремого дієслова-зв’язки в теперішньому часі.
theological_decisions:
- issue: Збірна однина «серце» чи розподільна множина
  choice: 'Зберегти однину: «їхнє серце»'
  alternative: «їхні серця»
  rationale: У грецькому тексті καρδία стоїть в однині й, імовірно, змальовує народ як єдине ціле зі спільним внутрішнім налаштуванням. Збереження однини підтримує риторичну силу пророчої цитати, не усуваючи її збірності.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Конкретний образ «устами» та протиставлення зовнішньої пошани внутрішній віддаленості збережено. Порядок «їхнє серце» природніший українською, ніж буквальне «серце їхнє», без втрати наголосу оригіналу.
