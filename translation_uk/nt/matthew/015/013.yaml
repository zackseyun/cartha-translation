source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Πᾶσα φυτεία ἣν οὐκ ἐφύτευσεν ὁ πατήρ μου ὁ οὐράνιος ἐκριζωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/013.yaml
  text: But he answered and said[a], “Every plant that my heavenly Father did not plant will be uprooted.”
translation:
  language: uk
  text: 'А Він у відповідь сказав[a]: «Кожна рослина, якої не посадив Мій Небесний Отець, буде вирвана з корінням».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Кожне насадження, якого не посадив Мій Небесний Отець, буде викорінене».'
    reason: φυτεία може означати як окрему посаджену рослину, так і насадження; примітка зберігає лексичну альтернативу, наявну в англійському POB.
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: у відповідь сказав
  rationale: Природний український відповідник поширеної грецької оповідної формули, який передає обидва її складники без надмірної буквальності.
- source_word: Πᾶσα
  choice: Кожна
  rationale: Передає розподільне значення форми однини та узгоджується з іменником «рослина».
- source_word: φυτεία
  choice: рослина
  rationale: Іменник може означати посаджене або насадження; «рослина» природно підтримує образ того, що згодом виривають із корінням, не визначаючи метафоричного референта.
- source_word: ἐφύτευσεν
  choice: посадив
  rationale: Зберігає прямий землеробський образ і лексичний зв’язок із φυτεία.
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: Мій Небесний Отець
  rationale: Природна й гідна українська конструкція, що зберігає присвійність та означення οὐράνιος.
- source_word: ἐκριζωθήσεται
  choice: буде вирвана з корінням
  rationale: Ясно передає майбутній пасив і повний образ викорінення; жіночий рід узгоджено з «рослина».
theological_decisions:
- issue: Метафоричний референт вислову «кожна рослина»
  choice: Збережено відкриту метафору «кожна рослина».
  alternative: «кожне вчення», «кожна традиція» або «кожен, кого не посадив Отець»
  rationale: Грецький текст не уточнює, чи йдеться про вчення, традиції або людей, тому переклад не усуває цієї богословської неоднозначності.
translation_notes:
  register: Сучасна стандартна українська; вислів природний, гідний і доступний. Сільськогосподарську метафору та її навмисно відкритий зміст збережено.
