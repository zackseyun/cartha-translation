  text: οἱ δὲ ἐσθίοντες ἦσαν τετρακισχίλιοι ἄνδρες χωρὶς γυναικῶν καὶ παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/038.yaml
  text: Those who had eaten were four thousand men[a], besides women and children.
translation:
  language: uk
  text: А тих, хто їв, було чотири тисячі чоловіків, не рахуючи жінок і дітей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ ἐσθίοντες
  choice: А тих, хто їв
  rationale: Артикль із дієприкметником передано субстантивовано. δέ відтворено м’яким сполучником «А», а теперішній дієприкметник — природною українською підрядною конструкцією без надмірного уточнення часової завершеності.
- source_word: ἦσαν τετρακισχίλιοι
  choice: було чотири тисячі
  rationale: Прямо передає зв’язку та кількість у природній українській конструкції.
- source_word: ἄνδρες
  choice: чоловіків
  rationale: ἀνήρ тут означає саме чоловіків, а не людей загалом; це підтверджує окрема згадка жінок і дітей.
- source_word: χωρὶς
  choice: не рахуючи
  rationale: У цій формулі слово вказує, що жінки й діти не входили до названого числа; «не рахуючи» ясно й природно виражає це українською.
- source_word: γυναικῶν καὶ παιδίων
  choice: жінок і дітей
  rationale: 'Збережено загальні значення: «жінки», а не лише «дружини», і «діти» без невиправданого звуження віку.'
theological_decisions:
- issue: Гендерно конкретна формула підрахунку
  choice: Зберегти «чоловіків» і окремо назвати жінок та дітей, які не входять до числа чотирьох тисяч.
  alternative: Передати ἄνδρες як «людей».
  rationale: Грецький текст конкретно називає чоловіків і далі окремо згадує жінок та дітей; узагальнення «людей» стерло б цю відмінність.
translation_notes:
  register: Сучасна стандартна українська; виклад природний, стислий і гідний. Конструкція «не рахуючи» безпосередньо розкриває зміст χωρίς, тому примітка не потрібна.
