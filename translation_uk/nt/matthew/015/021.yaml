  yaml_path: translation/nt/matthew/015/021.yaml
  text: And Jesus went out from there and withdrew to the region of Tyre and Sidon[a].
translation:
  language: uk
  text: Ісус вийшов звідти й відійшов до околиць Тира й Сидона.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «вирушив до околиць Тира й Сидона». Грецьке дієслово можна передати нейтральніше, але «відійшов» відбиває характерне для Матвія його вживання.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: І
  rationale: Простий сполучник зберігає зв’язок із попередньою розповіддю без додаткового смислового наголосу.
- source_word: ἐξελθὼν
  choice: вийшовши
  rationale: Дієприслівник природно передає аористовий дієприкметник і позначає дію, що передує головній.
- source_word: ἐκεῖθεν
  choice: звідти
  rationale: Стисло й природно передає віддалення від попереднього місця.
- source_word: ἀνεχώρησεν
  choice: відійшов
  rationale: Передає віддалення або усамітнення, можливе в ἀναχωρέω, не посилюючи його до значення «відступив» і не приписуючи Ісусові не названої в тексті причини.
- source_word: εἰς τὰ μέρη
  choice: у краї
  rationale: Природний український відповідник для руху до ширшої місцевості, пов’язаної з названими містами; не стверджує неодмінного входу до самих міст.
- source_word: Τύρου καὶ Σιδῶνος
  choice: Тира й Сидона
  rationale: Усталені українські форми географічних назв у родовому відмінку після слова «краї».
theological_decisions:
- issue: Оповідний відтінок руху Ісуса до місцевості, пов’язаної з язичниками
  choice: Передати ἀνεχώρησεν як «відійшов», не пояснюючи мотиву.
  alternative: Нейтральніше «вирушив» або сильніше «відступив».
  rationale: Матвій може вказувати на цілеспрямоване віддалення, однак сам вірш не називає причини. «Відійшов» зберігає цей відтінок, не додаючи психологічного чи богословського пояснення.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська оповідна мова. Дієприслівникову конструкцію збережено через її природність і близькість до структури грецького речення; «краї» вжито у значенні місцевості або території.
