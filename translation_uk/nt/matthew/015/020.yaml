lexical_decisions:
- source_word: ταῦτά ἐστιν τὰ
  choice: Ось що
  rationale: Природна сучасна українська конструкція, яка зберігає вказівний наголос грецького вислову без важкого буквального «Це є те, що».
- source_word: κοινοῦντα / κοινοῖ
  choice: оскверняє / оскверняє
  rationale: У контексті суперечки про чистоту дієслово означає робити людину нечистою; «оскверняє» зберігає як обрядове тло, так і ширший моральний зміст Ісусових слів.
- source_word: τὸν ἄνθρωπον
  choice: людину
  rationale: Однина з означеним артиклем має узагальнювальне значення. Українське «людину» природно передає представницьку однину й стосується будь-якої людини.
- source_word: τὸ ... ἀνίπτοις χερσὶν φαγεῖν
  choice: їсти немитими руками
  rationale: Природний український відповідник субстантивованого інфінітива та давального знаряддя; він ясно зберігає зв’язок із питанням обрядового миття рук.
- source_word: δέ
  choice: а
  rationale: Український протиставний сполучник «а» природно й чітко передає контраст між тим, що справді оскверняє, і їжею немитими руками.
theological_decisions:
- issue: Значення κοινόω у суперечці про обрядову чистоту
  choice: Передано як «оскверняє», щоб зберегти обрядове тло та ширший моральний зміст.
  alternative: робить нечистою
  rationale: Безпосередній контекст стосується чистоти, але Ісус говорить і про внутрішнє моральне осквернення. «Оскверняє» не звужує вислів лише до обрядового статусу.
- issue: Узагальнювальна однина τὸν ἄνθρωπον
  choice: людину
  alternative: чоловіка
  rationale: ἄνθρωπος тут позначає людину взагалі, а не особу чоловічої статі. «Людину» точно зберігає однину та загальне значення.
translation_notes:
  register: Сучасна стандартна українська мова; лаконічний, гідний і зрозумілий виклад. Повтор «людину» збережено відповідно до грецького тексту, а тире природно оформлює протиставлення.
