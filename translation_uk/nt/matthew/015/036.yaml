reference: Matthew 15:36
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ⸀ἔλαβεν τοὺς ἑπτὰ ἄρτους καὶ τοὺς ἰχθύας ⸀καὶ εὐχαριστήσας ἔκλασεν καὶ ⸀ἐδίδου τοῖς ⸀μαθηταῖς οἱ δὲ μαθηταὶ ⸂τοῖς ὄχλοις⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/036.yaml
  text: He took the seven loaves and the fish[a], and after giving thanks he broke them and kept giving them to the disciples, and the disciples to the crowds.
translation:
  language: uk
  text: Він узяв сім хлібів і рибу, подякував, переломив хліби й давав учням, а учні — натовпам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαβεν
  choice: узяв
  rationale: Природний український відповідник у послідовності дій Ісуса з їжею.
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: сім хлібів
  rationale: У контексті годування ἄρτοι означає окремі хліби; означеність у природній українській не потребує окремого вираження.
- source_word: τοὺς ἰχθύας
  choice: рибу
  rationale: Збірна форма «рибу» природно передає грецьку множину без уточнення кількості.
- source_word: εὐχαριστήσας
  choice: подякував
  rationale: Дієприслівникову форму передано однорідним дієсловом у природній українській послідовності; адресата подяки не додано, бо його немає в грецькому тексті.
- source_word: ἔκλασεν
  choice: переломив хліби
  rationale: 'Доданий із контексту об’єкт усуває неприродну двозначність: ламали саме хліби, а не рибу.'
- source_word: ἐδίδου
  choice: давав
  rationale: Недоконаний вид передає тривалу або повторювану дію грецького імперфекта.
- source_word: τοῖς μαθηταῖς
  choice: учням
  rationale: Давальний відмінок без доданого присвійного займенника точно передає грецький текст.
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: а учні — натовпам
  rationale: 'Збережено еліпсис оригіналу: пропущене «давали» зрозуміле з попередньої частини; множину ὄχλοι передано як «натовпам».'
theological_decisions:
- issue: Можливий євхаристійний відгомін εὐχαριστήσας
  choice: подякував
  alternative: воздав подяку; подякував Богові
  rationale: Нейтральне оповідне формулювання не заперечує можливого відгомону, але й не вводить літургійного чи конфесійного тлумачення; не названого в грецькому тексті адресата не додано.
translation_notes:
  register: Сучасна стандартна українська; виклад стислий, природний і гідний. Недоконане «давав» відтворює імперфект, а тире зберігає грецький еліпсис у другій частині речення.
