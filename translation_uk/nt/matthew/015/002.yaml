base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/002.yaml
  text: Why do your disciples break the tradition of the elders? For they do not wash their hands when they eat bread[a][b].
translation:
  language: uk
  text: «Чому Твої учні порушують традицію старійшин? Адже вони не миють рук, коли їдять хліб[a][b]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Йдеться про миття рук у зв’язку з традицією старійшин, а не просто про звичайну гігієну.
    reason: cultural_note
  - marker: b
    text: 'Або: «коли їдять їжу» або «під час трапези»; грецьке слово «хліб» іноді може означати їжу загалом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τί
  choice: Чому
  rationale: Природний сучасний український відповідник запитання про причину.
- source_word: οἱ μαθηταί σου
  choice: Твої учні
  rationale: Прямо й природно передає іменникову групу з присвійним займенником.
- source_word: παραβαίνουσιν
  choice: порушують
  rationale: Дієслово означає переступати або порушувати встановлену норму; цей відповідник доречний і щодо припису, і щодо авторитетного звичаю.
- source_word: τὴν παράδοσιν
  choice: передання
  rationale: Передає те, що було передане попередніми авторитетами, і зберігає відмінність від ширшого поняття звичаю.
- source_word: τῶν πρεσβυτέρων
  choice: старійшин
  rationale: У контексті йдеться про визнаних попередніх юдейських авторитетів, а не просто літніх людей.
- source_word: νίπτονται
  choice: миють
  rationale: Звичайний відповідник дієслова, яке часто позначає миття частини тіла, зокрема рук.
- source_word: τὰς χεῖρας αὐτῶν
  choice: рук
  rationale: В українській після «миють» природно не повторювати присвійність, оскільки суб’єкт і належність рук очевидні з контексту.
- source_word: ὅταν
  choice: коли
  rationale: Природно передає повторювану, звичну обставину в цьому контексті.
- source_word: ἄρτον
  choice: хліб
  rationale: Зберігає буквальне значення грецького слова, не усуваючи можливого ширшого метонімічного значення.
- source_word: ἐσθίωσιν
  choice: їдять
  rationale: Теперішній час природно виражає звичну дію після «коли».
theological_decisions:
- issue: Характер миття рук
  choice: У головному тексті подано лише зв’язок із переданням старійшин, без уточнення «обрядове».
  alternative: Прямо назвати миття обрядовим або пояснити його як звичайну гігієну.
  rationale: Сам вірш визначає суперечку через передання старійшин, але не дає в головному тексті докладного пояснення характеру практики; примітка подає потрібне культурне тло без надмірного витлумачення.
- issue: Обсяг значення ἄρτον
  choice: хліб
  alternative: їжу; трапезу
  rationale: Буквальне значення збережено в тексті, а можливе ширше значення зазначено в примітці, щоб не усунути лексичну неоднозначність.
translation_notes:
  register: Сучасна стандартна українська, природна й гідна усна форма прямої мови. «Передання» обрано для авторитетної успадкованої традиції; великий ініціал у «Твої» відповідає усталеному шанобливому біблійному оформленню звертання до Ісуса.
