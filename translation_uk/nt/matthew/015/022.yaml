  naturalness: Текст звучить природно в сучасній стандартній українській, водночас зберігаючи стриманий біблійний регістр. Кличні форми «Господи, Сину Давидів» нормативні. «Тяжко одержима демоном» є зрозумілим традиційним біблійним висловом; він не є настільки архаїчним, щоб вимагати заміни.
