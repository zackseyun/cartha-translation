reference: Matthew 15:22
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ γυνὴ Χαναναία ἀπὸ τῶν ὁρίων ἐκείνων ἐξελθοῦσα ⸀ἔκραζεν λέγουσα· Ἐλέησόν με, κύριε ⸀υἱὸς Δαυίδ· ἡ θυγάτηρ μου κακῶς δαιμονίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/022.yaml
  text: And behold[a], a Canaanite woman from those regions came out and was crying out, saying, “Have mercy on me, Lord, Son of David; my daughter is badly demon-possessed.”
translation:
  language: uk
  text: 'І ось, жінка-ханаанка, вийшовши з тих країв, кричала: «Змилуйся наді мною, Господи, Сину Давидів! Моя дочка тяжко одержима демоном[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «демон тяжко мучить мою дочку».'
    reason: 'Лексична альтернатива: δαιμονίζεται вказує на демонічний вплив, не уточнюючи його точного характеру.'
lexical_decisions:
- source_word: ἰδοὺ
  choice: ось
  rationale: Природний український вказівний маркер, що зберігає раптове привернення уваги в оповіді.
- source_word: Χαναναία
  choice: жінка-ханаанка
  rationale: Передає саме Матвієве етнічне означення та його старозавітні асоціації; не підмінюється словом «сирофінікіянка» з паралельної розповіді Марка.
- source_word: ἀπὸ τῶν ὁρίων ἐκείνων
  choice: з тих країв
  rationale: ὅρια тут означає територію або місцевість; «з тих країв» природно передає множину й не звужує вислів до буквальних кордонів.
- source_word: ἐξελθοῦσα
  choice: вийшовши
  rationale: Дієприслівник зберігає супровідну аористову дію та послідовність грецького речення.
- source_word: ἔκραζεν
  choice: кричала
  rationale: Недоконаний вид українського дієслова передає тривалу або повторювану дію імперфекта.
- source_word: Ἐλέησόν με
  choice: Змилуйся наді мною
  rationale: Усталений, зрозумілий і гідний відповідник прохання про милість, який зберігає його нагальність.
- source_word: κύριε
  choice: Господи
  rationale: Клична форма природна в українській; у поєднанні з титулом «Сину Давидів» передає шанобливе й потенційно месіанське звертання.
- source_word: υἱὸς Δαυίδ
  choice: Сину Давидів
  rationale: Буквально й упізнавано передає давидівський месіанський титул, із нормативною українською кличною формою.
- source_word: κακῶς
  choice: тяжко
  rationale: Виражає серйозність стану природніше для сучасної української, ніж буквальне «погано».
- source_word: δαιμονίζεται
  choice: одержима демоном
  rationale: Стислий традиційний відповідник, який прямо зберігає приписану в тексті демонічну дію; альтернативу з меншою конкретизацією подано в примітці.
theological_decisions:
- issue: Значення κύριε в месіанському звертанні
  choice: Господи
  alternative: пане
  rationale: Поєднання з «Сину Давидів» допускає більше, ніж звичайну ввічливість. «Господи» зберігає шанобливу й можливу месіанську силу титулу, не визначаючи повноту віри жінки.
- issue: Ступінь конкретизації δαιμονίζεται
  choice: одержима демоном
  alternative: демон тяжко мучить її
  rationale: Грецьке дієслово безсумнівно вказує на демонічний вплив, але не описує точно його механізму. Основний текст використовує усталений відповідник, а примітка зберігає менш конкретизоване прочитання.
translation_notes:
  register: Сучасна стандартна українська з гідним біблійним звучанням. Кличні форми «Господи, Сину Давидів» нормативні й природні; синтаксис лишається близьким до грецького, але читабельним.
