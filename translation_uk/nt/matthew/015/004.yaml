source:
  edition: SBLGNT
  text: ὁ γὰρ θεὸς ⸀εἶπεν· Τίμα τὸν πατέρα καὶ τὴν μητέρα, καί· Ὁ κακολογῶν πατέρα ἢ μητέρα θανάτῳ τελευτάτω·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/004.yaml
  text: For God said[a], ‘Honor your father and your mother,’ and, ‘Whoever speaks evil of father or mother must surely die.’
translation:
  language: uk
  text: 'Адже Бог сказав: «Шануй свого батька і свою матір», а також: «Хто лихословить батька чи матір, той неодмінно має померти».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Хто проклинає батька чи матір, того неодмінно слід стратити».'
    reason: Лексична альтернатива для κακολογῶν і можливий явно юридичний переклад θανάτῳ τελευτάτω.
lexical_decisions:
- source_word: ὁ γὰρ θεὸς
  choice: Адже Бог
  rationale: γάρ пояснює підставу Ісусового аргументу; «Адже» природно передає пояснювально-причиновий зв’язок без зайвого підсилення.
- source_word: εἶπεν
  choice: сказав
  rationale: λέγω вводить цитату з Писання; просте «сказав» не додає сильнішого значення «наказав».
- source_word: Τίμα
  choice: Шануй
  rationale: Дієслово τιμάω означає віддавати належну шану; «шануй» зберігає етичну вагу заповіді й усталено звучить українською.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: свого батька і свою матір
  rationale: Присвійність випливає зі змісту цитованої заповіді; повторення «свого/свою» забезпечує природність і виразність української фрази.
- source_word: Ὁ κακολογῶν
  choice: Хто лихословить
  rationale: κακολογέω охоплює зле, образливе мовлення та проклинання. «Лихословить» стисло й гідно зберігає широту значення, не звужуючи його лише до формального прокляття.
- source_word: πατέρα ἢ μητέρα
  choice: батька чи матір
  rationale: Безартиклеві іменники мають узагальнений характер; «батька чи матір» природно передає альтернативу без доданого займенника.
- source_word: θανάτῳ τελευτάτω
  choice: той неодмінно має померти
  rationale: Це урочиста юридична формула смертної кари. Такий переклад зберігає категоричність, але не робить людського виконавця явнішим, ніж у грецькому тексті.
theological_decisions:
- issue: Передача формули смертної кари в цитаті із Закону
  choice: той неодмінно має померти
  alternative: того неодмінно слід стратити
  rationale: Грецьке θανάτῳ τελευτάτω категорично визначає смерть як кару, проте прямо не називає виконавця. Основний текст зберігає цю граматичну стриманість, а примітка подає можливий юридично-агентивний переклад.
- issue: Обсяг значення κακολογῶν
  choice: лихословить
  alternative: проклинає
  rationale: Основний варіант зберігає ширше значення злого чи образливого мовлення; «проклинає» можливе в контексті старозавітної правової цитати, але може надто звузити діапазон дієслова.
translation_notes:
  register: Сучасна нормативна українська мова з гідним біблійним звучанням. «Адже» чітко пов’язує вірш із попереднім аргументом; «лихословить» є зрозумілим, але не розмовним. Побудова цитат зберігає урочистість і правову суворість джерела.
