source:
  edition: SBLGNT
  text: ὥστε ⸂τὸν ὄχλον⸃ θαυμάσαι βλέποντας κωφοὺς λαλοῦντας ⸂κυλλοὺς ὑγιεῖς⸃ ⸀καὶ χωλοὺς περιπατοῦντας καὶ τυφλοὺς βλέποντας· καὶ ἐδόξασαν τὸν θεὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/031.yaml
  text: so that the crowd marveled as they saw the mute speaking, the crippled made well, the lame walking, and the blind seeing; and they glorified the God of Israel.
translation:
  language: uk
  text: Так що натовп дивувався, бачачи, як німі[a] говорять, покалічені одужали[b], кульгаві ходять, а сліпі бачать; і вони прославили Бога Ізраїлю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «глухі». Грецьке слово може означати тих, хто не чує, або тих, хто не може говорити; тут перевагу надано значенню «німі», бо далі сказано, що вони говорять.'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «покалічені стали здоровими» або «покалічені були зцілені». Грецьке слово описує покалічених людей або людей із порушенням функції кінцівок, а наступне слово — їхній відновлений здоровий стан.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Тож
  rationale: Природно передає наслідок попередніх зцілень, зберігаючи послідовне значення сполучника.
- source_word: τὸν ὄχλον
  choice: натовп
  rationale: Звичайний сучасний український відповідник для групи людей у цій оповіді.
- source_word: θαυμάσαι
  choice: дивувався
  rationale: Передає сильне здивування натовпу як наслідок побачених зцілень.
- source_word: βλέποντας
  choice: бачачи, як
  rationale: Дієприкметник стосується натовпу й пояснює причину його здивування; конструкція природна українською.
- source_word: κωφοὺς λαλοῦντας
  choice: німі говорять
  rationale: κωφός може означати нездатність чути або говорити, але λαλοῦντας безпосередньо підкреслює відновлення мовлення.
- source_word: κυλλοὺς ὑγιεῖς
  choice: покалічені стали здоровими
  rationale: κυλλός описує людей із покаліченими чи недієздатними кінцівками, а ὑγιεῖς — їхній здоровий стан після зцілення. Додавання «стали» природно виражає результат у контексті.
- source_word: χωλοὺς περιπατοῦντας
  choice: кульгаві ходять
  rationale: Точно й стисло передає протиставлення колишньої нездатності нормально ходити та відновленої ходи.
- source_word: τυφλοὺς βλέποντας
  choice: сліпі бачать
  rationale: Прямо відтворює грецьке формулювання та чудесне відновлення зору.
- source_word: ἐδόξασαν
  choice: прославили
  rationale: Зберігає богословськи вагоме значення віддання слави Богові й природно звучить українською.
- source_word: τὸν θεὸν Ἰσραήλ
  choice: Бога Ізраїлю
  rationale: Точний і усталений український відповідник грецької конструкції.
theological_decisions:
- issue: Значення κωφούς у вислові κωφοὺς λαλοῦντας
  choice: німі говорять
  alternative: глухі говорять
  rationale: Слово може стосуватися глухоти або німоти. Безпосередній контраст із «говорять» найвиразніше вказує на нездатність говорити, але справжню лексичну неоднозначність збережено в примітці.
- issue: Передача δοξάζω щодо Бога
  choice: прославили Бога Ізраїлю
  alternative: віддали славу Богові Ізраїлю; хвалили Бога Ізраїлю
  rationale: «Прославили» точно передає визнання й віддання слави Богові без звуження значення до самої словесної хвали.
translation_notes:
  register: Сучасна нормативна українська мова з гідним оповідним тоном. Паралельний перелік чудес передано короткими теперішніми формами; у завершальному реченні «люди» уточнює невиражений грецький підмет і природно відсилає до натовпу.
