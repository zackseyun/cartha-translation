  text: But he answered[a], “It is not right to take the children's bread and throw it to the little dogs.”
translation:
  language: uk
  text: 'А Він відповів: «Не годиться брати хліб у дітей і кидати песикам».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «малим собакам», «хатнім собакам» чи «цуценятам»; у грецькому тексті вжито зменшувальну форму, яка може вказувати на малих або хатніх собак.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: відповів
  rationale: Дієприкметник із особовою формою дієслова природно й точно передано одним українським дієсловом, що зберігає значення відповіді.
- source_word: καλὸν
  choice: добре
  rationale: У конструкції «недобре» слово виражає належність або доречність дії; це природний український відповідник, який не звужує вислів лише до моральної оцінки.
- source_word: λαβεῖν
  choice: взяти
  rationale: Прямий контекстуальний відповідник, що зберігає образ узяття хліба.
- source_word: τὸν ἄρτον τῶν τέκνων
  choice: хліб у дітей
  rationale: Передає належність хліба дітям природною українською конструкцією та зберігає метафоричний образ.
- source_word: βαλεῖν
  choice: кинути
  rationale: Зберігає конкретність і виразність грецького βάλλω без пом’якшення до «дати».
- source_word: κυναρίοις
  choice: песикам
  rationale: Зменшувальна українська форма відтворює грецький демінутив κυνάρια, не визначаючи однозначно, чи йдеться про цуценят, малих або хатніх собак.
theological_decisions:
- issue: Метафора про дітей і собак та її можливі етнічні й богословські референти.
  choice: Метафору збережено без пояснення її референтів у головному тексті.
  alternative: Розкрити образ як пряме протиставлення Ізраїлю та язичникам.
  rationale: Сам вірш не називає референтів образу прямо; їхнє розуміння залежить від ширшого контексту. Переклад має зберегти напруження вислову, а не вирішувати його тлумаченням.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Частку δέ передано як «А», що природно позначає перехід до відповіді. Займенник «Він» ужито без доданого імені, як у джерельному тексті.
