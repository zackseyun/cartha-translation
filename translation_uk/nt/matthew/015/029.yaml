lexical_decisions:
- source_word: μεταβὰς ἐκεῖθεν
  choice: відійшовши звідти
  rationale: Аористовий дієприкметник передає дію, що передує головному дієслову; український дієприслівник природно зберігає послідовність і стислу оповідну форму.
- source_word: ἦλθεν
  choice: прийшов
  rationale: Прямий відповідник оповідного аориста ἔρχομαι; у контексті руху Ісуса природне українське формулювання.
- source_word: παρὰ τὴν θάλασσαν τῆς Γαλιλαίας
  choice: до Галілейського моря
  rationale: παρά зі знахідним після дієслова руху може позначати наближення до берега або рух уздовж нього. Основний текст уживає природне «до», а можливість «уздовж» збережено в примітці.
- source_word: ἀναβὰς εἰς τὸ ὄρος
  choice: піднявшись на гору
  rationale: Сполука ἀναβαίνω з εἰς природно означає сходження на гору; дієприслівник передає попередність дії.
- source_word: ἐκάθητο
  choice: сидів
  rationale: Імперфект κάθημαι описує тривалий стан; українське недоконане «сидів» зберігає цей аспект без неприродної описової конструкції.
- source_word: ἐκεῖ
  choice: там
  rationale: Прямий і природний відповідник локативного прислівника.
