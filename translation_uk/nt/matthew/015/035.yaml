    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: І
  rationale: Звичайний сурядний сполучник, що продовжує послідовність дій у розповіді.
- source_word: παραγγείλας
  choice: звелівши
  rationale: Аористовий активний дієприкметник передає попередню щодо наступної головної дії вказівку Ісуса; «звелівши» зберігає директивну силу без неприродної громіздкості.
- source_word: τῷ ὄχλῳ
  choice: натовпу
  rationale: Давальний відмінок позначає адресата веління; «натовп» є природним сучасним відповідником у цьому оповідному контексті.
- source_word: ἀναπεσεῖν
  choice: розташуватися
  rationale: Інфінітив означає зайняти місце, зокрема прилягти або сісти для трапези. «Розташуватися» природно охоплює цю культурно зумовлену позу, не звужуючи значення до сучасного сидіння.
- source_word: ἐπὶ τὴν γῆν
  choice: на землі
  rationale: У цьому контексті γῆ означає поверхню землі, де мав розміститися натовп, а не світ чи територію.
