  source_fidelity: 'Текст точно передає синтаксичний і смисловий рух грецького вислову: те, що виходить з уст, має джерело в серці й робить людину нечистою. Українська конструкція «те, що виходить» природно передає субстантивований нейтральний множинний дієприкметник у його узагальнювальному значенні. «Людину» коректно відтворює родове τὸν ἄνθρωπον без невиправданого звуження до чоловічої статі.'
  naturalness: Фраза звучить природно сучасною літературною українською. Паралель «виходить з уст — походить із серця» є ясним і не штучним; «уста» доречне в доступному біблійному регістрі. Формулювання «робить людину нечистою» прозоре для сучасного читача.
  terminology: «Серце» зберігає біблійно-антропологічне значення καρδία. «Нечиста» належно передає мову чистоти в κοινόω, не зводячи її ані лише до ритуальної, ані лише до психологічної категорії. «Людина» є відповідним родовим відповідником ἄνθρωπος у цьому контексті.
