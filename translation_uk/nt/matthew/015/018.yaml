  text: τὰ δὲ ἐκπορευόμενα ἐκ τοῦ στόματος ἐκ τῆς καρδίας ἐξέρχεται, κἀκεῖνα κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/018.yaml
  text: But the things that come out of the mouth come from the heart[a], and those defile the man.
translation:
  language: uk
  text: А те, що виходить з уст, походить із серця, і саме це робить людину нечистою.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ... ἐκπορευόμενα
  choice: те, що виходить
  rationale: Субстантивований дієприкметник середнього роду множини узагальнено позначає те, що виходить з уст; природна українська конструкція передає зміст без штучної множини.
- source_word: στόματος
  choice: уст
  rationale: «Уста» зберігає тілесний образ і в цьому вислові природно вказує на мовлення, маючи гідний біблійний регістр.
- source_word: καρδίας
  choice: серця
  rationale: «Серце» зберігає біблійне уявлення про внутрішню людину — осередок думок, намірів і моральних рішень.
- source_word: ἐξέρχεται
  choice: походить
  rationale: Дієслово в однині узгоджене з нейтральним множинним підметом за грецькою нормою; «походить» природно виражає джерело і відрізняє його від попереднього «виходить».
- source_word: κἀκεῖνα
  choice: і саме це
  rationale: Передає підсилене анафоричне посилання на те, що виходить з уст; українське «це» природно узгоджується з конструкцією «те, що».
- source_word: κοινοῖ
  choice: робить ... нечистою
  rationale: У контексті суперечки про чистоту κοινόω означає робити когось нечистим або оскверняти; розгорнутий відповідник ясно зберігає категорію нечистоти.
- source_word: τὸν ἄνθρωπον
  choice: людину
  rationale: Ἄνθρωπος тут є родовим позначенням будь-якої людини, а не конкретно чоловіка; українське «людину» точно передає цей представницький зміст без звуження за статтю.
theological_decisions:
- issue: Джерело моральної нечистоти
  choice: Нечистота походить із серця і виявляється в тому, що виходить з уст.
  alternative: Звести вислів лише до обрядової нечистоти, спричиненої мовленням.
  rationale: Найближчий контекст протиставляє зовнішнє споживання їжі тому, що виходить із внутрішньої людини. Формулювання зберігає водночас мову чистоти та морально-антропологічний акцент тексту.
- issue: Значення родового τὸν ἄνθρωπον
  choice: людину
  alternative: чоловіка
  rationale: У цьому контексті артикльована однина має представницьке, загальнолюдське значення. «Людину» в сучасній українській точно передає референт, тоді як «чоловіка» могло б помилково звузити його до особи чоловічої статі.
translation_notes:
  register: Сучасна стандартна українська з гідним, доступним регістром. Синтаксичний паралелізм «виходить з уст — походить із серця» зберігає образність оригіналу; «робить людину нечистою» прозоро відтворює лексику чистоти без конфесійного уточнення.
