  text: καὶ λέγουσιν αὐτῷ οἱ ⸀μαθηταί· Πόθεν ἡμῖν ἐν ἐρημίᾳ ἄρτοι τοσοῦτοι ὥστε χορτάσαι ὄχλον τοσοῦτον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/033.yaml
  text: And the disciples said to him[c][b][a], “Where could we get enough bread in this desolate place to satisfy so large a crowd?”
translation:
  language: uk
  text: 'І учні сказали Йому: «Звідки нам узяти в цій безлюдній місцевості стільки хліба, щоб нагодувати досита такий великий натовп?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγουσιν
  choice: сказали
  rationale: Грецький історичний теперішній час природно передано минулим часом відповідно до норм української оповіді.
- source_word: οἱ μαθηταί
  choice: учні
  rationale: Означений артикль указує на вже відому з контексту групу; додавати присвійне «Його» немає потреби, бо його немає в грецькому тексті.
- source_word: Πόθεν ἡμῖν
  choice: Звідки нам узяти
  rationale: Передає питання про джерело їжі та природно розкриває еліптичну грецьку конструкцію українською.
- source_word: ἐν ἐρημίᾳ
  choice: в цій безлюдній місцевості
  rationale: ἐρημία тут означає незаселену, віддалену місцевість; «цій» природно випливає з безпосередньої ситуації.
- source_word: ἄρτοι τοσοῦτοι
  choice: стільки хліба
  rationale: Хоча ἄρτοι формально є множиною «хліби/буханці», українське збірне «хліба» природно передає потрібну кількість їжі, а τοσοῦτοι — словом «стільки».
- source_word: ὥστε χορτάσαι
  choice: щоб нагодувати досита
  rationale: Конструкція виражає передбачуваний результат, а χορτάσαι означає дати їжі до повного насичення.
- source_word: ὄχλον τοσοῦτον
  choice: такий великий натовп
  rationale: Природно передає іменник ὄχλον та наголошену величину, виражену τοσοῦτον.
theological_decisions: []
translation_notes:
  register: Сучасна нормативна українська мова; виклад природний і гідний, без конфесійно забарвлених уточнень. Еліптичну конструкцію оригіналу помірно розкрито як «нам узяти», а образ насичення збережено у вислові «нагодувати досита».
