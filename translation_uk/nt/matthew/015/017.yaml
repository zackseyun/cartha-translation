revisions:
- from: Хіба ви не розумієте, що все, що входить до уст, потрапляє в шлунок, а потім викидається до відхожого місця?[a]
  to: Хіба ви не розумієте, що все, що входить у рот, потрапляє в шлунок і викидається в нужник?[a]
  rationale: Виправлено лише відповідник до εἰς τὸ στόμα, щоб зберегти значення руху всередину й сучасну природність української. Основний відповідник ἀφεδρών уточнено як «нужник», а альтернативний, більш евфемістичний варіант збережено в примітці. Зміст, образність і неоднозначності джерела не змінено.
