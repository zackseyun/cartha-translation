source:
  edition: SBLGNT
  text: ⸀οὐ νοεῖτε ὅτι πᾶν τὸ εἰσπορευόμενον εἰς τὸ στόμα εἰς τὴν κοιλίαν χωρεῖ καὶ εἰς ἀφεδρῶνα ἐκβάλλεται;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/017.yaml
  text: Do you not understand that everything entering into the mouth goes into the stomach and is expelled into the latrine?[a]
translation:
  language: uk
  text: Хіба ви не розумієте, що все, що входить у рот, потрапляє в шлунок і викидається в нужник?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «усе, що входить у рот… викидається у відхоже місце».'
    reason: Лексичний варіант для ἀφεδρών; «відхоже місце» є більш евфемістичним відповідником до «нужник».
lexical_decisions:
- source_word: νοεῖτε
  choice: розумієте
  rationale: Дієслово тут означає розумове осягнення Ісусової думки; «розумієте» природно передає докір у формі запитання.
- source_word: πᾶν τὸ εἰσπορευόμενον
  choice: все, що входить
  rationale: Субстантивований дієприкметник середнього роду має узагальнювальне значення й охоплює все, що споживають.
- source_word: εἰς τὸ στόμα
  choice: до уст
  rationale: εἰς виражає рух усередину; «до уст» є природним і гідним українським відповідником у цьому контексті.
- source_word: κοιλίαν
  choice: шлунок
  rationale: У контексті травлення κοιλία позначає внутрішній орган або черево; «шлунок» найясніше передає фізіологічний зміст.
- source_word: χωρεῖ
  choice: потрапляє
  rationale: У цьому контексті дієслово описує проходження їжі до шлунка; «потрапляє» звучить природно й не перевантажує вислів.
- source_word: ἀφεδρῶνα
  choice: відхоже місце
  rationale: Слово позначає місце випорожнення — нужник або відхоже місце. Обраний відповідник точний, зрозумілий і стилістично гідний.
- source_word: ἐκβάλλεται
  choice: викидається
  rationale: Пасивна форма описує видалення з організму; «викидається» зберігає силу ἐκβάλλω без надмірно грубого звучання.
theological_decisions:
- issue: Зв’язок Ісусових слів із законами ритуальної чистоти
  choice: Передати фізіологічне твердження прямо, не додаючи формули про скасування харчових приписів.
  alternative: Додати тлумачне уточнення, ніби цим прямо проголошено всю їжу чистою.
  rationale: Сам вірш описує процес травлення в межах аргументу про справжнє осквернення, але не містить пояснювальної фрази з Марка 7:19. Переклад не повинен вносити її до Матвія.
translation_notes:
  register: Сучасна стандартна українська з гідним біблійним звучанням. «Хіба… не» природно передає докір у грецькому запитанні; «уста» зберігають піднесеність без архаїчної непрозорості. Маркер [a] наявний у головному тексті.
