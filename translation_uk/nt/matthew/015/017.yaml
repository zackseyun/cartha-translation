  source_fidelity: 'Потрібне невелике уточнення напрямкових прийменників: εἰς τὸ στόμα означає рух «в рот», а не лише «до уст». Решта синтаксису й змісту передані точно: загальне «усе, що входить», шлунок та пасивне «викидається» відповідають грецькому текстові. «Нужник» адекватно передає ἀφεδρών як місце випорожнення.'
  naturalness: «Входить до уст» у сучасній українській може означати наближення до губ і звучить дещо книжно. «Входить у рот» є прямим, природним і сучасним. «Викидається в нужник» зрозуміле в межах навмисно тілесного образу вислову.
  terminology: «Шлунок» точне. «Нужник» — стилістично нейтрально-розмовний, проте доречний і точний для давнього місця випорожнення; у примітці подано м’якший лексичний варіант «відхоже місце». Жодного богословського висновку, як-от проголошення всіх страв чистими, не додано.
