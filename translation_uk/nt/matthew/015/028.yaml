source:
  edition: SBLGNT
  text: τότε ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτῇ· Ὦ γύναι, μεγάλη σου ἡ πίστις· γενηθήτω σοι ὡς θέλεις. καὶ ἰάθη ἡ θυγάτηρ αὐτῆς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/028.yaml
  text: Then Jesus answered her[a], “O woman, great is your faith[b]; let it be done for you as you desire.” And her daughter was healed from that hour.
translation:
  language: uk
  text: 'Тоді Ісус відповів їй: «О жінко, велика твоя віра[a]! Нехай буде тобі, як ти хочеш». І від тієї години[b] її дочка була зцілена.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «велика твоя довіра». Грецьке πίστις може означати віру, довіру або вірність; у цьому контексті основним відповідником є «віра».'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «від тієї миті». Грецький текст буквально каже: «від тієї години».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Тоді
  rationale: Природний часовий маркер, що пов’язує відповідь Ісуса з попередньою розмовою.
- source_word: ἀποκριθεὶς ... εἶπεν αὐτῇ
  choice: Ісус відповів їй
  rationale: У грецькій оповіді дієприкметник разом із дієсловом мовлення утворює звичну формулу; українське «відповів їй» природно передає її без зайвого повтору й зберігає αὐτῇ.
- source_word: Ὦ γύναι
  choice: О жінко
  rationale: Зберігає пряме, підкреслене звертання оригіналу. У цьому контексті «жінко» є шанобливим звертанням, а не виявом зневаги.
- source_word: μεγάλη σου ἡ πίστις
  choice: велика твоя віра
  rationale: Зберігає наголос на величі віри та водночас звучить природно й урочисто українською.
- source_word: πίστις
  choice: віра
  rationale: У контексті наполегливого звернення жінки до Ісуса йдеться передусім про її віру та довіру до нього; «віра» є точним усталеним відповідником без звуження до тривалої вірності.
- source_word: γενηθήτω σοι
  choice: Нехай станеться тобі
  rationale: Передає пасивний наказовий спосіб і проголошувальну силу слів Ісуса, зберігаючи дативне значення «тобі».
- source_word: ὡς θέλεις
  choice: як ти хочеш
  rationale: Природний сучасний український відповідник, який точно передає волю або бажання жінки без надмірно піднесеної лексики.
- source_word: ἰάθη
  choice: зцілилася
  rationale: Природно передає завершене зцілення в оповіді про чудо; українська зворотна форма тут виражає зміну стану без твердження, ніби дочка зцілила себе.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: від тієї години
  rationale: Близько відтворює грецький вислів і зберігає часову точку, від якої зцілення стало дійсним.
theological_decisions:
- issue: Значення πίστις у похвалі Ісуса
  choice: віра
  alternative: довіра; вірність
  rationale: Контекст показує довірливе покладання жінки на Ісуса, тому «віра» найкраще охоплює зміст. «Довіра» можлива як смисловий відтінок, тоді як «вірність» тут менш імовірна, бо наголос не на тривалій відданості.
translation_notes:
  register: Сучасна літературна українська з помірно урочистим біблійним звучанням. Пряме звертання «О жінко» зберігає виразність грецького Ὦ γύναι, а решта речення уникає архаїчних і конфесійно маркованих форм.
