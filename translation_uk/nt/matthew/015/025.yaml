lexical_decisions:
- source_word: δὲ
  choice: А
  rationale: Частка позначає легке протиставлення й подальший розвиток розмови; українське «А» природно передає наполегливість жінки після попередніх слів Ісуса.
- source_word: ἐλθοῦσα
  choice: підійшла
  rationale: Аористовий дієприкметник природно передано особовою формою; у цьому контексті йдеться про наближення жінки до Ісуса.
- source_word: προσεκύνει αὐτῷ
  choice: упала перед Ним на коліна
  rationale: Вислів передає тілесний жест глибокої пошани, не звужуючи значення лише до богослужбового поклоніння; можливе значення «поклонилася Йому» збережено у примітці.
- source_word: λέγουσα
  choice: й сказала
  rationale: Дієприкметник природно перетворено на послідовну особову форму в українській розповіді.
- source_word: Κύριε
  choice: Господи
  rationale: Кличний відмінок природно й вагомо передає звертання κύριε до Ісуса.
- source_word: βοήθει μοι
  choice: допоможи мені
  rationale: Коротке пряме прохання зберігає терміновість і відчай жінки.
theological_decisions:
- issue: Значення προσκυνέω стосовно Ісуса
  choice: упала перед Ним на коліна
  alternative: поклонилася Йому
  rationale: Дієслово може означати земний уклін, вияв пошани або поклоніння. Основний текст виразно передає тілесну дію, не визначаючи наперед її повного богословського змісту, а примітка зберігає ширшу можливість.
translation_notes:
  register: Сучасна стандартна українська; стислий, гідний і природний виклад. Велика літера в займеннику «Ним» ужита як усталений український знак пошани при згадці про Ісуса.
