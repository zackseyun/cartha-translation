  text: καὶ προσῆλθον αὐτῷ ὄχλοι πολλοὶ ἔχοντες μεθ’ ἑαυτῶν ⸂κωφούς, τυφλούς, χωλούς, κυλλούς⸃, καὶ ἑτέρους πολλούς, καὶ ἔρριψαν αὐτοὺς παρὰ τοὺς πόδας ⸀αὐτοῦ, καὶ ἐθεράπευσεν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/030.yaml
  text: And large crowds came to him[a], bringing with them the mute, the blind, the lame, the crippled, and many others, and they laid them at his feet[b], and he healed them.
translation:
  language: uk
  text: До нього прийшли численні натовпи, привівши із собою німих[a], сліпих, кульгавих, людей з ушкодженими кінцівками[b] та багатьох інших, і поклали їх біля його ніг, а він зцілив їх.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «глухих». Грецьке слово κωφούς залежно від контексту може означати тих, хто не чує, не говорить, або має обидва ці порушення.
    reason: lexical_alternative
  - marker: b
    text: Або «скалічених». Грецьке слово κυλλούς широко означає людей з ушкодженими, деформованими чи функціонально обмеженими кінцівками.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον
  choice: прийшли до
  rationale: Природно передає аорист προσέρχομαι в оповідному контексті; значення наближення збережене прийменниковою конструкцією.
- source_word: ὄχλοι πολλοὶ
  choice: численні натовпи
  rationale: Зберігає множину ὄχλοι та кількісне значення πολλοί, не зводячи вислів лише до розміру одного натовпу.
- source_word: ἔχοντες μεθ’ ἑαυτῶν
  choice: привівши із собою
  rationale: Контекстуально й природно виражає те, що натовпи доправили цих людей до Ісуса, замість буквального, але незграбного «маючи із собою».
- source_word: κωφούς
  choice: німих
  rationale: κωφός може означати людину, яка не чує, не говорить або має обидва порушення. У тексті обрано стисле «німих», а справжню лексичну неоднозначність збережено в примітці.
- source_word: τυφλούς
  choice: сліпих
  rationale: Прямий і звичний відповідник τυφλούς у переліку людей, які потребують зцілення.
- source_word: χωλούς
  choice: кульгавих
  rationale: Точно й стисло передає порушення ходи, позначене χωλός, і дає змогу відрізнити цю групу від κυλλούς.
- source_word: κυλλούς
  choice: людей з ушкодженими кінцівками
  rationale: Передає широкий зміст слова — деформовані, покалічені або функціонально уражені кінцівки — без зневажливого означення людини за її станом.
- source_word: ἑτέρους πολλούς
  choice: багатьох інших
  rationale: Природний відповідник, що охоплює інших людей понад названі групи.
- source_word: ἔρριψαν
  choice: поклали
  rationale: Хоча дієслово може буквально означати «кинули», у цьому контексті «поклали» природно описує розміщення немічних людей біля ніг Ісуса й не нав’язує тексту непотрібної жорстокості.
- source_word: παρὰ τοὺς πόδας αὐτοῦ
  choice: біля його ніг
  rationale: Зберігає просторове значення παρά з акузативом і образ безпосереднього наближення до Ісуса.
- source_word: ἐθεράπευσεν
  choice: зцілив
  rationale: Усталений і точний відповідник θεραπεύω в євангельських розповідях про відновлення здоров’я.
