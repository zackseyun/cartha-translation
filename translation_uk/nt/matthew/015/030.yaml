translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Займенники щодо Ісуса подано з малої літери, оскільки грецький текст не кодує особливого шанобливого написання. Назви станів сформульовано стисло, але без зайвої стигматизації; для κυλλούς використано описовий вислів, щоб зберегти точність і розрізнення з χωλούς.
