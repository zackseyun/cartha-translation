lexical_decisions:
- source_word: οὐ μὴ
  choice: уже не зобов’язаний
  rationale: Подвійне заперечення має підсилювальну силу; у контексті наведеної людської постанови йдеться про заявлене звільнення від обов’язку, а не лише про передбачення майбутньої дії.
- source_word: τιμήσει
  choice: шанувати
  rationale: Зберігає прямий зв’язок із заповіддю про пошану до батьків; практичний зміст матеріальної підтримки пояснено в примітці, але не звужено в основному тексті.
- source_word: πατέρα αὐτοῦ
  choice: свого батька
  rationale: Передає грецьку форму однини без розширення до «батька чи матері».
- source_word: ἠκυρώσατε
  choice: скасували
  rationale: Природно й сильно передає значення «позбавили чинності, зробили недійсним» у сучасній українській мові.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: слово Бога
  rationale: Відтворює основний текст SBLGNT з λόγον; варіант «заповідь Бога» подано в примітці.
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: через свій переказ
  rationale: διά з акузативом тут природно виражає причину або засіб; «переказ» означає передане людське вчення чи припис, а «свій» природно співвідноситься з підметом «ви».
theological_decisions:
- issue: Чи уточнювати, що пошана включає матеріальне утримання батьків
  choice: Залишити «шанувати» в основному тексті, а практичний зміст пояснити в примітці.
  alternative: Перекласти «утримувати» або «піклуватися».
  rationale: Грецьке τιμάω означає «шанувати» й відсилає до формулювання заповіді, хоча в цьому спорі пошана явно має практичний, зокрема матеріальний, вимір.
- issue: Чи узгоджувати текст із ширшим контекстом або рукописним варіантом
  choice: Передати однину «свого батька» та читання «слово Бога» за SBLGNT.
  alternative: Розширити до «батька чи матері» або прийняти варіант «заповідь Бога».
  rationale: Переклад іде за поданим грецьким текстом; істотний текстовий варіант збережено в примітці, а не внесено до основного тексту.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Початкове «той» і закривальні лапки відбивають те, що вірш продовжує цитату з попереднього контексту. «Уже не зобов’язаний» природно передає контекстуальний дозвільний сенс підсиленого οὐ μή. «Переказ» ужито для релігійно успадкованого людського припису без конфесійного забарвлення.
