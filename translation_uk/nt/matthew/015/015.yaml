lexical_decisions:
- source_word: Ἀποκριθεὶς
  choice: у відповідь
  rationale: Аористовий дієприкметник від ἀποκρίνομαι має активне значення відповіді. Українське «у відповідь» природно поєднується з «сказав» і відтворює грецьку конструкцію без важкого «відповів і сказав».
- source_word: δὲ
  choice: А
  rationale: Частка δέ позначає перехід або легке протиставлення; «А» природно передає цей дискурсивний зв’язок українською.
- source_word: ὁ Πέτρος
  choice: Петро
  rationale: Усталена українська форма особового імені.
- source_word: εἶπεν αὐτῷ
  choice: сказав йому
  rationale: Прямо передає дієслово мовлення та давальний відмінок адресата.
- source_word: Φράσον
  choice: Поясни
  rationale: Імператив φράζω тут означає зробити зміст зрозумілим, роз’яснити; «поясни» найточніше відповідає контексту прохання про значення образного вислову.
- source_word: ἡμῖν
  choice: нам
  rationale: Природна українська форма давального відмінка при дієслові «пояснити».
- source_word: τὴν παραβολὴν
  choice: притчу
  rationale: «Притча» є усталеним відповідником παραβολή в Євангеліях і зберігає жанрову неоднозначність образного вислову.
- source_word: ταύτην
  choice: цю
  rationale: Ближній вказівний займенник стосується щойно наведеного вислову; українське «цю» точно передає його.
