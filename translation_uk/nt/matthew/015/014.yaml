id: MAT.15.14
reference: Matthew 15:14
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ἄφετε αὐτούς· ⸂τυφλοί εἰσιν ὁδηγοὶ τυφλῶν⸃· τυφλὸς δὲ τυφλὸν ἐὰν ὁδηγῇ, ἀμφότεροι εἰς βόθυνον πεσοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/014.yaml
  text: Leave them alone[a]; they are blind guides of the blind. But if a blind man guides a blind man[c][b], both will fall into a pit.
translation:
  language: uk
  text: 'Облиште їх: вони — сліпі проводирі сліпих. А якщо сліпий поведе сліпого[a], обоє впадуть у яму[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Однина чоловічого роду тут має узагальнювальне значення: вислів стосується людей загалом, а не лише чоловіків.'
    reason: cultural_note
  - marker: b
    text: 'Або: «у рів».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφετε αὐτούς
  choice: Облиште їх
  rationale: Імператив ἄφετε в цьому контексті означає залишити когось у спокої, не мати з ним справи; «облиште» стисло й природно передає цю спонукальну силу.
- source_word: τυφλοί
  choice: сліпі
  rationale: Збережено образний вислів оригіналу без пояснювального додавання на кшталт «духовно сліпі».
- source_word: ὁδηγοὶ
  choice: проводирі
  rationale: Слово означає тих, хто показує шлях. «Проводирі» зберігає конкретний образ і зв’язок із дієсловом ὁδηγῇ.
- source_word: τυφλῶν
  choice: сліпих
  rationale: Прямо передано родовий відмінок множини, зберігаючи стислу форму вислову.
- source_word: τυφλὸς ... τυφλὸν
  choice: сліпий ... сліпого
  rationale: Збережено однину й граматичний чоловічий рід грецького прислівного формулювання; загальне, представницьке значення уточнено в примітці.
- source_word: ἐὰν ὁδηγῇ
  choice: якщо ... поведе
  rationale: Умова має загальний характер. Доконаний вид у природній українській мові виразно передає можливу дію та її неминучий наслідок у головній частині.
- source_word: ἀμφότεροι
  choice: обоє
  rationale: «Обоє» природно стосується двох осіб і точно передає охоплення обох учасників.
- source_word: εἰς βόθυνον
  choice: у яму
  rationale: βόθυνος може позначати яму, рів або заглибину. «Яма» є широким, виразним і природним відповідником.
- source_word: πεσοῦνται
  choice: впадуть
  rationale: Природний український майбутній час точно передає наслідок, виражений грецькою формою.
theological_decisions:
- issue: Метафоричне значення сліпоти
  choice: Зберегти слово «сліпі» без пояснення в основному тексті.
  alternative: «духовно сліпі» або «нерозумні проводирі»
  rationale: Оригінал подає образ, а не його тлумачення. Пояснювальна заміна звузила б значення й послабила б риторичну силу вислову.
- issue: Рід у прислівному вислові
  choice: «сліпий ... сліпого»
  alternative: «сліпа людина ... сліпу людину»
  rationale: Так збережено граматичну форму грецького тексту. Водночас примітка пояснює, що однина чоловічого роду має узагальнювальний характер і не обмежує застосування вислову лише чоловіками.
translation_notes:
  register: Сучасна нормативна українська мова з лаконічним, гідним і виразним прислівним ритмом. Двокрапка природно вводить пояснення наказу, а конструкція «проводирі сліпих» зберігає образність і богословську напругу оригіналу.
