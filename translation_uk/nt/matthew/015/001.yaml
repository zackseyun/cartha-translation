  text: Τότε προσέρχονται τῷ ⸀Ἰησοῦ ἀπὸ Ἱεροσολύμων ⸂Φαρισαῖοι καὶ γραμματεῖς⸃ λέγοντες
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/001.yaml
  text: Then Pharisees and scribes from Jerusalem come to Jesus[a], saying[b],
translation:
  language: uk
  text: 'Тоді до Ісуса підходять фарисеї та книжники з Єрусалима й кажуть:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Тоді
  rationale: Природний часовий маркер, що вводить наступний епізод і зберігає послідовність оповіді.
- source_word: προσέρχονται
  choice: підходять
  rationale: Передає рух у напрямку до Ісуса; теперішній час зберігає історичний теперішній грецького тексту.
- source_word: τῷ Ἰησοῦ
  choice: до Ісуса
  rationale: Давальний відмінок при προσέρχομαι позначає особу, до якої підходять; українська конструкція природно вимагає прийменника «до».
- source_word: ἀπὸ Ἱεροσολύμων
  choice: з Єрусалима
  rationale: ἀπό виражає місце походження; форма «з Єрусалима» є нормативною й не додає припущення про офіційне уповноваження.
- source_word: Φαρισαῖοι
  choice: фарисеї
  rationale: Усталена українська назва історичної юдейської релігійної групи.
- source_word: γραμματεῖς
  choice: книжники
  rationale: Усталений біблійний відповідник для знавців і тлумачів Закону; він зберігає історичне найменування без надмірного пояснення в самому тексті.
- source_word: καὶ
  choice: та
  rationale: Природно поєднує назви двох груп українською.
- source_word: λέγοντες
  choice: й кажуть
  rationale: Дієприслівникову конструкцію передано сурядним особовим дієсловом, природнішим для сучасної української; двокрапка вводить пряму мову наступного вірша.
theological_decisions:
- issue: Історичний теперішній час
  choice: 'Збережено теперішній час: «підходять… кажуть»'
  alternative: 'Минулий час: «підійшли… сказали»'
  rationale: Грецьке προσέρχονται стоїть у теперішньому часі й надає оповіді безпосередності; український історичний теперішній тут зрозумілий і природний.
- issue: Походження з Єрусалима
  choice: Нейтральне «з Єрусалима»
  alternative: Формулювання, яке натякало б на офіційну делегацію
  rationale: Текст прямо вказує лише на місце, звідки вони прибули, тому можливого офіційного статусу не слід додавати.
translation_notes:
  register: Сучасна нормативна українська з гідним оповідним тоном. «Книжники» залишено як усталений історико-біблійний термін; порядок слів перебудовано природно для української, причому означення «з Єрусалима» стосується названих фарисеїв і книжників. Маркери приміток не потрібні, оскільки істотної неоднозначності, яку неможливо зберегти в основному тексті, тут немає.
