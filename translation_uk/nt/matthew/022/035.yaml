  text: καὶ ἐπηρώτησεν εἷς ἐξ αὐτῶν νομικὸς πειράζων ⸀αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/035.yaml
  text: And one of them, a lawyer, asked him a question, testing him.
translation:
  language: uk
  text: І один із них, знавець Закону[a], запитав його, випробовуючи його.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «законник». Ідеться про знавця юдейського Закону.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: І
  rationale: Збережено простий сполучник, який поєднує цей епізод із попереднім контекстом, без додавання виразного часового відтінку.
- source_word: ἐπηρώτησεν
  choice: запитав його
  rationale: Природний український відповідник дієслова зі значенням «запитувати, звертатися із запитанням»; слово «запитав» уже передає наявність запитання, тому додаток «поставив запитання» не потрібний.
- source_word: εἷς ἐξ αὐτῶν
  choice: один із них
  rationale: Природне відтворення грецької партитивної конструкції, яке показує належність цього чоловіка до щойно згаданої групи.
- source_word: νομικὸς
  choice: знавець Закону
  rationale: У цьому юдейському контексті йдеться не про сучасного адвоката чи юриста, а про фахівця з юдейського Закону. Велика літера в слові «Закон» уточнює зв’язок із Законом Мойсея.
- source_word: πειράζων
  choice: випробовуючи
  rationale: Дієприкметниковий зворот зберігає супровідну обставину або намір запитувача. «Випробовуючи» передає перевірку чи провокаційне випробування, не звужуючи значення до спокушання до гріха.
- source_word: αὐτόν
  choice: його
  rationale: Звичайне займенникове відтворення прямого додатка, що стосується Ісуса; написання з малої літери відповідає сучасній нейтральній видавничій практиці.
theological_decisions:
- issue: Відтінок πειράζων щодо Ісуса
  choice: випробовуючи
  alternative: спокушаючи
  rationale: Грецьке слово може означати випробування, перевірку або спокусу. Контекст підтримує значення ворожої перевірки, але переклад «випробовуючи» не конкретизує мотив понад те, що виражає текст, і не створює враження обов’язкового спонукання до гріха.
translation_notes:
  register: Сучасна стандартна українська мова; лаконічний, гідний оповідний стиль. Термін «знавець Закону» усуває сучасну асоціацію з адвокатською чи цивільно-правовою професією, а примітка зберігає традиційний коротший відповідник.
