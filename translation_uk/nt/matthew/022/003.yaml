id: MAT.22.3
reference: Matthew 22:3
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν τοὺς δούλους αὐτοῦ καλέσαι τοὺς κεκλημένους εἰς τοὺς γάμους, καὶ οὐκ ἤθελον ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/003.yaml
  text: And he sent his servants to call those who had been invited to the wedding feast[c][b][a], and they were unwilling to come.
translation:
  language: uk
  text: І він послав своїх слуг[a] покликати запрошених[b] на весільний бенкет[c], але вони не хотіли прийти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «рабів». Грецьке слово може означати як слуг, так і рабів; тут ідеться передусім про їхню роль посланців господаря.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «покликаних». У грецькому тексті тут повторено той самий корінь, що й у слові «покликати»; у цьому контексті маються на увазі люди, запрошені раніше.'
    reason: lexical_alternative
  - marker: c
    text: 'Або: «на весілля» чи «на весільне святкування».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: послав
  rationale: Аорист ἀποστέλλω природно й точно передається доконаним дієсловом «послав».
- source_word: δούλους
  choice: слуг
  rationale: δοῦλος може означати раба або слугу; тут у центрі уваги їхня роль посланців господаря, тому «слуг» природніше в контексті притчі, а альтернативу збережено в примітці.
- source_word: καλέσαι
  choice: покликати
  rationale: Інфінітив виражає мету посилання. «Покликати» частково зберігає повтор кореня καλέω з κεκλημένους, не звучачи неприродно.
- source_word: κεκλημένους
  choice: запрошених
  rationale: Перфектний пасивний дієприкметник позначає тих, кого запросили раніше; в контексті весілля «запрошених» передає це ясніше за буквальне «покликаних».
- source_word: εἰς τοὺς γάμους
  choice: на весільний бенкет
  rationale: Множина γάμοι тут стосується весільного святкування або бенкету, а не лише укладення шлюбу.
- source_word: οὐκ ἤθελον ἐλθεῖν
  choice: вони не хотіли прийти
  rationale: Конструкція з ἤθελον передає волю або бажання; «не хотіли прийти» точно й природно, не посилюючи вислів до однозначного «відмовилися».
theological_decisions:
- issue: Передача δοῦλος у притчі
  choice: слуг
  alternative: рабів
  rationale: Контекст наголошує на виконанні доручення та представницькій ролі цих осіб, а не на їхньому правовому статусі. Примітка зберігає лексичну альтернативу без нав’язування конфесійного тлумачення.
translation_notes:
  register: Сучасна стандартна українська; виклад природний і гідний. Сполучник «але» контекстуально передає протиставлення другого καί, тоді як «не хотіли» зберігає вольовий відтінок без надмірного посилення.
