  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Учителю
  rationale: Клична форма природно передає звертання до Ісуса; «учитель» є звичайним значенням διδάσκαλος і не додає ієрархічного відтінку слова «пан».
- source_word: ποία
  choice: яка
  rationale: Питальний прикметник указує на вибір однієї заповіді з-поміж заповідей Закону; українське «яка» природно передає це значення.
- source_word: ἐντολὴ
  choice: заповідь
  rationale: У юдейському біблійно-правовому контексті «заповідь» точно й усталено передає ἐντολή.
- source_word: μεγάλη
  choice: найбільша
  rationale: Хоч у грецькому тексті стоїть прикметник позитивного ступеня, у питанні про вибір серед заповідей він має природну контекстуальну силу найвищого ступеня; буквальне «велика» українською звучало б неприродно й могло б затемнити сенс.
- source_word: ἐν τῷ νόμῳ
  choice: в Законі
  rationale: Тут νόμος означає Мойсеїв Закон, тобто Тору; велика літера позначає конкретний корпус Писання й лишається зрозумілою широкому читачеві.
theological_decisions:
- issue: Чи передавати μεγάλη позитивним або найвищим ступенем
  choice: найбільша
  alternative: велика
  rationale: Форма μεγάλη граматично є позитивним ступенем, однак конструкція ποία… μεγάλη в цьому контексті ідіоматично запитує про першість серед заповідей. «Найбільша» природно передає цей контекстуальний зміст, не додаючи конфесійного тлумачення.
translation_notes:
  register: Сучасна стандартна українська; стислий, гідний і природний синтаксис. Ужито кличний відмінок «Учителю» та усталене біблійне «Закон» для Тори.
