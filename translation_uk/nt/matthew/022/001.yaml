lexical_decisions:
- source_word: Καὶ
  choice: І
  rationale: Зберігає звичайний грецький сполучник і без додавання часових відтінків продовжує розповідь.
- source_word: ἀποκριθεὶς
  choice: відповідаючи
  rationale: Відтворює аористовий дієприкметник від ἀποκρίνομαι та звичну для грецької оповіді формулу, навіть коли безпосередньо перед нею немає сформульованого запитання.
- source_word: ὁ Ἰησοῦς
  choice: Ісус
  rationale: У сучасній українській особове ім’я природно вживається без артикля, якого українська мова не має.
- source_word: πάλιν
  choice: знову
  rationale: Прямо передає повторність мовленнєвої дії.
- source_word: εἶπεν
  choice: промовив
  rationale: Природно передає дію мовлення й уникає незграбного повтору на зразок «сказав, кажучи» перед λέγων.
- source_word: ἐν παραβολαῖς
  choice: притчами
  rationale: Орудний відмінок природно передає значення способу або засобу, виражене ἐν із давальним.
- source_word: αὐτοῖς
  choice: до них
  rationale: Чітко позначає адресатів Ісусової мови.
- source_word: λέγων
  choice: двокрапка
  rationale: Грецький дієприкметник вводить подальший зміст промови; в українській це природно й точно передається двокрапкою без стилістично важкого «кажучи».
theological_decisions:
- issue: Оповідна формула «відповідаючи» без безпосередньо висловленого запитання
  choice: Зберегти «відповідаючи»
  alternative: «озвавшись» або опустити формулу
  rationale: Це звична грецька оповідна ідіома, яка пов’язує вислів із попереднім контекстом, а не окреме богословське твердження; буквальний елемент збережено, а можливу незвичність пояснено в примітці.
translation_notes:
  register: Сучасна нормативна українська, гідний оповідний стиль. Конструкцію дещо наближено до грецького синтаксису задля збереження ἀποκριθείς, але завершено природною українською двокрапкою, що вводить подальшу пряму мову.
