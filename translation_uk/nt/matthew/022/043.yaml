  text: He said to them[a], “How then does David, in the Spirit, call him Lord[b], saying,”
translation:
  language: uk
  text: 'Він сказав їм: «Як же Давид у Дусі[a] називає його Господом[b], кажучи:»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «Духом». Грецький вислів може вказувати на сферу або на засіб; «у Дусі» точніше відтворює його форму.
    reason: lexical_alternative
  - marker: b
    text: Або «паном». Грецьке κύριος тут передано усталеним титулом «Господь».
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Він запитав їх
  rationale: Історичний теперішній час природно передано минулим; у цьому контексті λέγει вводить запитання, тому «запитав» ясніше й природніше за буквальне «сказав».
- source_word: Πῶς οὖν
  choice: Як же
  rationale: «Як» зберігає питальну силу πῶς, а частка «же» природно передає логічно-висновковий відтінок οὖν.
- source_word: Δαυὶδ
  choice: Давид
  rationale: Ужито усталену українську форму біблійного імені.
- source_word: ἐν πνεύματι
  choice: у Дусі
  rationale: Близько відтворює грецький прийменниковий зворот і не усуває його можливих відтінків сфери та дії; велика літера вказує на ймовірне посилання на Святого Духа.
- source_word: καλεῖ αὐτὸν κύριον
  choice: називає Його Господом
  rationale: «Називає» природно передає καλεῖ, а «Господом» зберігає титульне й міжтекстове значення κύριον у зв’язку з Псалмом 110.
- source_word: λέγων
  choice: кажучи
  rationale: Дієприслівник стисло зберігає форму й зв’язок із цитатою, що йде далі.
theological_decisions:
- issue: Референт πνεύματι
  choice: Дух Святий
  alternative: власний дух Давида або духовний стан
  rationale: Контекст натякає на натхненне Духом промовляння Писання, але примітка зберігає граматичний відтінок способу дії.
- issue: Передача κύριος
  choice: Господь
  alternative: пан або володар
  rationale: У месіанському аргументі та цитаті з Псалма титул «Господь» найкраще зберігає богословську напругу й міжтекстовий зв’язок, не визначаючи наперед остаточного висновку аргументу.
translation_notes:
