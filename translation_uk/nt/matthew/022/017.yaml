review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the plural request to Jesus, the singular address, the legal ambiguity of ἔξεστιν, and the alternative ‘or not.’ However, κῆνσον specifically denotes the Roman poll/capitation tax, while «податок» is broader. The infinitive δοῦναι is better represented by perfective «дати» in this single proposed act than by imperfective «давати».
  naturalness: «Як ти вважаєш» is understandable, but «що ти думаєш» is the more direct and idiomatic Ukrainian equivalent in this interrogative frame. «Дати кесареві подушний податок» is clear, suitably formal, and preserves the source wording without the less natural generic collocation «давати податок».
  terminology: «Кесареві» is an appropriate established Ukrainian rendering of Καίσαρι. «Подушний податок» safely conveys κῆνσος and does not overstate which legal system is in view. «Чи дозволено» correctly retains the unspecified scope of ἔξεστιν.
  issues:
  - severity: medium
    issue: κῆνσον rendered only as «податок»
    rationale: The Greek term refers to the Roman poll/capitation tax. A generic term loses a relevant historical and lexical distinction that can be retained naturally in Ukrainian.
  - severity: low
    issue: δοῦναι rendered «давати»
    rationale: In this question about a proposed act, Ukrainian perfective «дати» more directly corresponds to the aorist infinitive and reads more naturally.
  - severity: low
    issue: «як ти вважаєш»
    rationale: This is acceptable, but «що ти думаєш» more closely and idiomatically matches τί σοι δοκεῖ in this context.
