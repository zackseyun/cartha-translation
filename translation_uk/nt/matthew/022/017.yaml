id: MAT.22.17
reference: Matthew 22:17
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: εἰπὸν οὖν ἡμῖν τί σοι δοκεῖ· ἔξεστιν δοῦναι κῆνσον Καίσαρι ἢ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/017.yaml
  text: Tell us, then, what do you think? Is it lawful to give the poll tax to Caesar, or not?
translation:
  language: uk
  text: 'Тож скажіть нам, що ти думаєш: чи дозволено дати кесареві подушний податок чи ні?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί σοι δοκεῖ
  choice: як ти вважаєш
  rationale: Природний сучасний український відповідник запитання про особисту думку; збережено однину «ти», оскільки звертаються до Ісуса.
- source_word: ἔξεστιν
  choice: чи дозволено
  rationale: Передає питання про те, що допускається законом, не уточнюючи без підстав, чи йдеться про римський або релігійний закон.
- source_word: δοῦναι
  choice: давати
  rationale: Формально зберігає дієслово «дати», важливе для подальшої відповіді Ісуса в контексті, замість звичного, але менш буквального «платити».
- source_word: κῆνσον
  choice: податок
  rationale: Йдеться про римський подушний податок; у головному тексті вжито зрозуміле загальне слово без зайвої технічності.
- source_word: Καίσαρι
  choice: кесареві
  rationale: Традиційний і зрозумілий український титул римського імператора, переданий у давальному відмінку.
theological_decisions:
- issue: Характер дозволеності у фразі ἔξεστιν
  choice: Залишено загальне «чи дозволено»
  alternative: «чи законно» або «чи дозволяє Закон»
  rationale: Грецький текст не називає конкретного закону; загальне формулювання зберігає навмисну неоднозначність пастки.
- issue: Передача δοῦναι у зв’язку з податком
  choice: «давати податок»
  alternative: «платити податок»
  rationale: Хоча «платити» природніше в податковому контексті, «давати» точніше відтворює лексичний зв’язок із подальшим висловом про те, що слід віддати кесареві й Богові.
translation_notes:
  register: Сучасна стандартна українська, ясна й гідна. Побудову дещо природно перебудовано, але збережено риторичний рух оригіналу, однину звертання та юридично-богословську неоднозначність.
