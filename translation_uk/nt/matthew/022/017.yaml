  rationale: The revision retains the deliberate legal ambiguity and the singular address to Jesus, while making the specific nature of κῆνσος explicit and using natural Ukrainian aspect and interrogative phrasing. No footnote is necessary because «подушний податок» is sufficiently clear in the text.
