  text: Last of all[a], the woman died.
translation:
  language: uk
  text: Після всіх померла й жінка.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Нарешті померла й жінка»; буквально: «Після всіх померла й жінка».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον … πάντων
  choice: Після всіх
  rationale: 'Сполука передає завершальну черговість у викладі: жінка померла після всіх згаданих братів. Український вислів природно зберігає і послідовність, і зв’язок із попереднім контекстом.'
- source_word: δὲ
  choice: й
  rationale: Слабкий сполучний відтінок δέ природно передано часткою «й», яка приєднує останню подію до попередньої розповіді без сильного протиставлення.
- source_word: ἀπέθανεν
  choice: померла
  rationale: Прямий і звичний відповідник аориста, без евфемізму.
- source_word: ἡ γυνή
  choice: жінка
  rationale: γυνή може означати «жінка» або «дружина»; тут «жінка» точніше відтворює формулювання та не пов’язує її лише з одним із кількох чоловіків.
