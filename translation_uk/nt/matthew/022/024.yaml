base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/024.yaml
  text: saying[a], “Teacher, Moses said, ‘If a man dies without having children, his brother shall marry his wife and raise up offspring for his brother.’”
translation:
  language: uk
  text: 'і казали: «Учителю, Мойсей сказав: „Якщо чоловік помре, не маючи дітей, то його брат має одружитися з його вдовою[a] і залишити потомство для свого брата“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або точніше: «виконати щодо вдови обов’язок брата її чоловіка». Грецьке слово стосується саме левіратного шлюбу — шлюбу чоловіка з удовою його померлого брата.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Учителю
  rationale: Природна сучасна форма звертання до Ісуса як до наставника; точно передає значення грецького слова.
- source_word: Ἐάν τις ἀποθάνῃ
  choice: Якщо чоловік помре
  rationale: У наведеному правовому випадку йдеться саме про чоловіка, що узгоджується з чоловічою формою дієприкметника та законом про левіратний шлюб.
- source_word: μὴ ἔχων τέκνα
  choice: не маючи дітей
  rationale: Зберігає дієприкметникову будову оригіналу й передає τέκνα широким словом «діти», а не звужує його до «синів».
- source_word: ἐπιγαμβρεύσει
  choice: має одружитися з його вдовою
  rationale: Дієслово позначає левіратний шлюб із вдовою померлого брата. Модальна конструкція «має» природно передає приписове майбутнє, а «вдова» недвозначно визначає становище жінки в цьому контексті.
- source_word: ἀναστήσει σπέρμα
  choice: продовжити рід
  rationale: Природний український відповідник біблійного звороту про народження нащадка, через якого триватиме рід померлого; буквальне «поставити насіння» було б незрозумілим.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: свого брата
  rationale: 'У сполученні «продовжити рід свого брата» передає датив користі/віднесення: потомство зараховується померлому братові.'
theological_decisions:
- issue: Гендерне формулювання правового прикладу
  choice: «Якщо чоловік помре… його брат»
  alternative: «Якщо хтось помре… брат цієї людини»
  rationale: Закон про левіратний шлюб сформульовано щодо конкретних чоловічих родинних ролей, тому їх не нейтралізовано.
- issue: Значення вислову ἀναστήσει σπέρμα
  choice: «продовжити рід свого брата»
  alternative: «поставити потомство своєму братові»
  rationale: Обране формулювання передає мету левіратного шлюбу зрозуміло й без доктринального уточнення того, як саме юридично або родовідно зараховувалося потомство.
translation_notes:
  register: Сучасна, dignified українська біблійна мова без архаїзмів. Формулу «і казали» збережено як продовження попереднього контексту. У головному тексті технічний зміст левірату передано природно, а точніше значення дієслова пояснено у примітці.
