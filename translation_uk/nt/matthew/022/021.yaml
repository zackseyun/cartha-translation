review_pass:
  verdict: revise
  source_fidelity: The principal syntax and rhetorical parallelism are preserved. However, λέγουσιν is simply “they said,” and the aorist imperative Ἀπόδοτε is more faithfully represented in this aphoristic command by the perfective Ukrainian imperative «віддайте» rather than iterative «віддавайте».
  naturalness: The wording is clear, dignified, and idiomatic modern Ukrainian. «Тож», «Кесареве», and the balanced «Богові — те, що Боже» work well. Perfective «віддайте» is more natural for the single formulated injunction.
  terminology: «Кесар» appropriately represents Καίσαρ as the Roman imperial title, and «Бог» / «Боже» accurately preserves the referent and the parallel possessive construction. Capitalization follows accepted Ukrainian biblical style.
  issues:
  - severity: medium
    issue: Imperative aspect in «віддавайте»
    rationale: Ἀπόδοτε is an aorist imperative. While Ukrainian aspect does not mechanically map Greek aspect, «віддайте» better conveys the concise, complete injunction here and avoids suggesting an ongoing or habitual action not explicit in the Greek.
  - severity: low
    issue: «Вони відповіли» adds a response nuance
    rationale: The dialogue context makes this inference harmless, but λέγουσιν αὐτῷ literally says “they said to him.” «Вони сказали Йому» is closer to the source without becoming unnatural.
