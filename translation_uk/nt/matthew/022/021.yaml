  rationale: 'The revision makes two limited source-oriented adjustments: it renders λέγουσιν without the added nuance of «відповіли» and uses the perfective imperative «віддайте» for Ἀπόδοτε. The explicit possessive clauses, the inferential «Тож», and the theological and civic parallelism remain unchanged. The footnote is adjusted so its alternative imperative matches the revised verbal form and does not imply the awkward idea of “paying God.”'
