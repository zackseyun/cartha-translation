base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/021.yaml
  text: They said to him[a], “Caesar’s.” Then he said to them, “Therefore render to Caesar the things that are Caesar’s, and to God the things that are God’s.”
translation:
  language: uk
  text: 'Вони сказали Йому: «Кесареве». Тоді Він сказав їм: «Тож віддайте кесареві те, що кесареве, а Богові — те, що Боже».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «поверніть кесареві… а Богові…». Грецьке дієслово може означати віддати назад, сплатити або віддати належне.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: Вони відповіли Йому
  rationale: Історичний теперішній час природно передано минулим; у цьому діалозі λέγω функціонально означає відповідь на поставлене запитання.
- source_word: Καίσαρος
  choice: Кесареве
  rationale: 'Субстантивований присвійний прикметник стисло й природно відповідає грецькому родовому відмінку та мається на увазі: зображення й напис належать кесареві.'
- source_word: τότε λέγει αὐτοῖς
  choice: Тоді Він сказав їм
  rationale: τότε позначає послідовність, а історичний теперішній λέγει передано природним українським минулим часом.
- source_word: Ἀπόδοτε
  choice: віддавайте
  rationale: ἀποδίδωμι означає віддати, повернути або сплатити належне. «Віддавайте» зберігає ідею належності й добре звучить у цьому афористичному вислові.
- source_word: οὖν
  choice: Тож
  rationale: Передає висновок, що випливає з їхньої відповіді, природніше за важче «отже» у прямій мові.
- source_word: τὰ Καίσαρος Καίσαρι
  choice: кесареві те, що кесареве
  rationale: Зберігає давальний адресата, присвійне значення та риторичний паралелізм оригіналу.
- source_word: τὰ τοῦ θεοῦ τῷ θεῷ
  choice: Богові — те, що Боже
  rationale: Зберігає симетрію з попередньою частиною, водночас тире природно позначає пропущене повторення дієслова українською.
theological_decisions:
- issue: Обсяг громадянського обов’язку та Божої вимоги
  choice: Збережено паралельний наказ віддавати кесареві належне кесареві, а Богові — належне Богові, без додаткового тлумачення меж цих сфер.
  alternative: Звузити вислів лише до сплати податку або подати його як схвалення необмеженої державної влади.
  rationale: Грецький текст розрізняє вимоги кесаря і Бога, але не розгортає політичної теорії; переклад має зберегти цю напругу й відкритість.
translation_notes:
  register: Сучасна нормативна українська з гідним, афористичним звучанням. «Кесар» ужито як традиційне титульне найменування римського імператора. Займенники щодо Ісуса написано з великої літери відповідно до поширеного українського біблійного стилю.
