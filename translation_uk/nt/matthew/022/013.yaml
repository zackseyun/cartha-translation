reference: Matthew 22:13
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: τότε ⸂ὁ βασιλεὺς εἶπεν⸃ τοῖς διακόνοις· Δήσαντες αὐτοῦ πόδας καὶ χεῖρας ⸂ἐκβάλετε αὐτὸν⸃ εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/013.yaml
  text: Then the king said to the attendants[a], ‘Bind his feet and hands and throw him out into the outer darkness. In that place there will be weeping and gnashing of teeth.’
translation:
  language: uk
  text: 'Тоді цар сказав слугам: «Зв’яжіть йому ноги й руки та викиньте його в темряву, що назовні.[a] Там буде плач і скрегіт зубів».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «у зовнішню темряву».'
    reason: Передає традиційний і можливий прикметниковий відповідник грецького вислову τὸ σκότος τὸ ἐξώτερον.
lexical_decisions:
- source_word: τότε
  choice: Тоді
  rationale: Природно й точно передає часовий перехід до наступної події.
- source_word: ὁ βασιλεὺς
  choice: цар
  rationale: Зберігає конкретний царський образ притчі.
- source_word: τοῖς διακόνοις
  choice: слугам
  rationale: У контексті бенкету означає осіб, які прислуговують цареві; слово «служителям» могло б набути небажаного церковного відтінку.
- source_word: Δήσαντες
  choice: Зв’яжіть
  rationale: Аористовий дієприкметник природно передано як перший наказ у послідовності дій; «зв’яжіть» точно виражає обмеження руху.
- source_word: αὐτοῦ πόδας καὶ χεῖρας
  choice: йому ноги й руки
  rationale: Збережено грецький порядок «ноги й руки»; давальний займенник є природним українським відповідником конструкції належності.
- source_word: ἐκβάλετε αὐτὸν
  choice: викиньте його
  rationale: Передає сильну, примусову дію ἐκβάλλω сучасною й виразною українською мовою.
- source_word: εἰς τὸ σκότος τὸ ἐξώτερον
  choice: в темряву, що назовні
  rationale: Безпосередньо передає просторовий образ темряви поза бенкетом і не нав’язує тлумачення вислову як окремого догматичного терміна.
- source_word: ἐκεῖ
  choice: Там
  rationale: Стисло й природно зберігає виразний локативний зміст.
- source_word: ὁ κλαυθμὸς
  choice: плач
  rationale: Точний усталений відповідник жалобного плачу або ридання без посилення значення.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: скрегіт зубів
  rationale: Усталений український відповідник образного вислову, який не звужує його до конкретної емоції.
theological_decisions:
- issue: Характер образу вигнання
  choice: Збережено конкретний образ вигнання в темряву назовні без пояснювального ототожнення.
  alternative: Назвати це пеклом, остаточним судом або лише виключенням із бенкету.
  rationale: Грецький текст подає яскравий образ суду в межах притчі, але сам не розкриває його в одному вузькому доктринальному значенні.
translation_notes:
  register: Сучасна, гідна й загальнозрозуміла українська мова. Діалог має наказову виразність; уникнуто архаїзмів і конфесійно забарвленої термінології.
