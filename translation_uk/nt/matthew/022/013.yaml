  verdict: approve
  source_fidelity: 'Текст точно передає послідовність і зміст грецького оригіналу: τότε («Тоді»), βασιλεύς («цар»), διάκονοι («слуги»), наказову силу Δήσαντες ... ἐκβάλετε («Зв’яжіть ... та викиньте»), а також грецький порядок «ноги й руки». «Темрява, що назовні» адекватно передає τὸ σκότος τὸ ἐξώτερον без зайвого доктринального тлумачення; «плач і скрегіт зубів» є точним усталеним відповідником.'
  naturalness: Переклад звучить природно сучасною літературною українською, з належною для притчі гідною, виразною тональністю. «Викиньте його» доречно відтворює примусовий характер ἐκβάλετε, а «Там буде» ясно передає ἐκεῖ ἔσται.
  terminology: «Цар», «слуги», «плач» і «скрегіт зубів» ужито послідовно й без небажаних церковно-посадових або конфесійно-інтерпретаційних нашарувань. Примітка коректно зазначає можливий традиційний відповідник «у зовнішню темряву» та не створює змістової суперечності.
