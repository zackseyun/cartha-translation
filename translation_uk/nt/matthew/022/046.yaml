lexical_decisions:
- source_word: οὐδεὶς
  choice: ніхто
  rationale: Природний український відповідник заперечного займенника, що цілковито виключає будь-яку особу.
- source_word: ἐδύνατο
  choice: не міг
  rationale: Передає минулу нездатність природною сучасною українською конструкцією.
- source_word: ἀποκριθῆναι αὐτῷ λόγον
  choice: відповісти Йому ані слова
  rationale: Український вислів «ані слова» природно передає грецьку конструкцію з λόγον та її наголос на цілковитій відсутності відповіді.
- source_word: οὐδὲ
  choice: і ... ніхто
  rationale: У поєднанні з повторним запереченням природно пов’язує другу негативну частину з першою; буквальне «ані» тут звучало б менш плавно.
- source_word: ἐτόλμησέν τις
  choice: ніхто ... не наважувався
  rationale: У контексті заперечення передає відсутність охочих зважитися на подальші запитання; форма недоконаного виду узгоджується з тривалим періодом від того дня.
- source_word: ἀπ’ ἐκείνης τῆς ἡμέρας
  choice: від того дня
  rationale: Позначає початкову точку стану, який надалі тривав.
- source_word: ἐπερωτῆσαι
  choice: ставити ... запитання
  rationale: Зберігає значення звернення із запитаннями в полемічному контексті, не посилюючи його до «допитувати».
- source_word: οὐκέτι
  choice: більше не
  rationale: Природний український спосіб передати припинення дії від зазначеного моменту.
theological_decisions:
- issue: Оповідна сила мовчання опонентів після відповіді Ісуса
  choice: Історичне твердження про їхню нездатність відповісти та небажання надалі ставити запитання
  alternative: Додати у формулювання явний наголос на вищій мудрості чи владі Ісуса
  rationale: Контекст вказує на перемогу Ісуса в суперечці, однак сам вірш прямо говорить лише про відсутність відповіді й подальших запитань; переклад не додає богословського висновку до тексту.
translation_notes:
  register: Сучасна стандартна українська, природна й гідна оповідна мова. Займенник «Йому» написано з великої літери відповідно до поширеної української біблійної традиції; це не змінює змісту грецького αὐτῷ.
