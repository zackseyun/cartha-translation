source:
  edition: SBLGNT
  text: λέγων· Τί ὑμῖν δοκεῖ περὶ τοῦ χριστοῦ; τίνος υἱός ἐστιν; λέγουσιν αὐτῷ· Τοῦ Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/042.yaml
  text: saying[a], “What do you think about the Messiah? Whose son is he?” They said to him, “David’s.”
translation:
  language: uk
  text: 'кажучи: «Що ви думаєте про Месію[a]? Чий Він син?» Вони відповіли Йому: «Давидів».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «Христа». Грецький титул Χριστός (Христос) тут ужито в месіанському значенні.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: кажучи
  rationale: Дієприкметник теперішнього часу від λέγω вводить пряму мову; формально й природно передано дієприслівником «кажучи».
- source_word: Τί ὑμῖν δοκεῖ
  choice: Що ви думаєте
  rationale: Зворот із δοκέω та давальним відмінком запитує про думку чи судження; це природний сучасний український відповідник.
- source_word: περὶ τοῦ χριστοῦ
  choice: про Месію
  rationale: Χριστός тут є титулом у юдейському месіанському контексті, тому «Месія» точніше передає його функцію, ніж ужите як ім’я «Христос».
- source_word: τίνος υἱός ἐστιν
  choice: Чий Він син?
  rationale: Запитання стосується походження та династичної належності Месії; займенник відсилає до попередньо названого Месії.
- source_word: λέγουσιν αὐτῷ
  choice: Вони відповіли Йому
  rationale: Грецький історичний теперішній природно передано минулим часом. У контексті запитання λέγουσιν означає репліку-відповідь, тому «відповіли» є природним без зміни змісту.
- source_word: Τοῦ Δαυίδ
  choice: Давидів
  rationale: Грецька еліптична відповідь у родовому відмінку відновлює поняття «син» із запитання; присвійний прикметник «Давидів» стисло зберігає цю еліптичність.
theological_decisions:
- issue: Передача Χριστός
  choice: Месія
  alternative: Христос
  rationale: У цьому місці слово функціонує як титул і предмет месіанського питання, а не як ім’я; «Месія» передає цей титульний сенс. Альтернативу зазначено у примітці.
- issue: Значення «син Давида»
  choice: Збережено буквальну мову синівства й походження
  alternative: Нащадок Давида
  rationale: «Нащадок» пояснив би династичний сенс, але послабив би дослівний зв’язок із υἱός і наступною аргументацією Ісуса; тому залишено «син».
translation_notes:
  register: Сучасна стандартна українська, природний і гідний біблійний стиль. Початкове «кажучи» збережено, оскільки вірш синтаксично продовжує попередній контекст. Велика літера у займенниках «Він», «Йому» відповідає усталеному українському біблійному регістру; вона не додає окремого тлумачення до грецького тексту.
