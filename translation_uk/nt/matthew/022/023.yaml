  text: Ἐν ἐκείνῃ τῇ ἡμέρᾳ προσῆλθον αὐτῷ Σαδδουκαῖοι, ⸀λέγοντες μὴ εἶναι ἀνάστασιν, καὶ ἐπηρώτησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/023.yaml
  text: On that day Sadducees came to him[a], saying there is no resurrection, and they questioned him.
translation:
  language: uk
  text: Того дня до нього підійшли садукеї[a], кажучи, що воскресіння немає, і запитали його.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або, виразніше: «садукеї, які кажуть, що воскресіння немає».'
    reason: 'Лексико-синтаксична альтернатива: грецький дієприкметник може описувати характерне переконання садукеїв, а не лише слова, промовлені в цю мить.'
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Того дня
  rationale: Природний сучасний український часовий вислів, який точно передає посилання на той самий день у розповіді.
- source_word: προσῆλθον αὐτῷ
  choice: до нього підійшли
  rationale: Дієслово προσέρχομαι означає наблизитися або підійти до когось; обраний вислів природний для української оповіді.
- source_word: Σαδδουκαῖοι
  choice: садукеї
  rationale: Усталена українська назва цієї юдейської релігійної групи.
- source_word: λέγοντες
  choice: кажучи
  rationale: Дієприслівникова форма близько відтворює грецький дієприкметник, не визначаючи остаточно, чи йдеться про слова, сказані саме тоді, чи про характерне переконання садукеїв.
- source_word: μὴ εἶναι ἀνάστασιν
  choice: що воскресіння немає
  rationale: Природна українська конструкція, яка прямо передає заперечення існування воскресіння.
- source_word: ἀνάστασιν
  choice: воскресіння
  rationale: Усталений український відповідник ἀνάστασις у цьому богословському контексті.
- source_word: ἐπηρώτησαν αὐτόν
  choice: запитали його
  rationale: ἐπερωτάω тут означає звернутися із запитанням; «запитали» звучить природно й не додає до тексту надмірно ворожого відтінку.
theological_decisions:
- issue: Передача заперечення воскресіння садукеями
  choice: кажучи, що воскресіння немає
  alternative: садукеї, які кажуть, що воскресіння немає
  rationale: Основний текст зберігає форму грецького дієприкметника, а примітка подає можливе виразніше розуміння цих слів як характеристики постійного вчення садукеїв. Заперечення подано як їхню позицію, а не як твердження оповідача.
translation_notes:
  register: Сучасна стандартна українська мова; оповідний стиль природний і стримано урочистий. Займенники щодо Ісуса подано з малої літери відповідно до звичайної сучасної орфографії та без додавання конфесійного маркування.
