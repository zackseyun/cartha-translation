  text: The Lord said to my Lord[a], ‘Sit at my right hand until I put your enemies under your feet’?”
translation:
  language: uk
  text: '«Господь сказав моєму Господу: „Сиди праворуч від Мене, доки Я не покладу Твоїх ворогів під Твої ноги“»?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν
  choice: сказав
  rationale: Простий і природний відповідник аориста λέγω у формулі введення цитати.
- source_word: κύριος … τῷ κυρίῳ μου
  choice: Господь … моєму Господу
  rationale: Грецький текст уживає те саме слово κύριος щодо обох осіб; однаковий відповідник зберігає цю особливість і передає відношення за допомогою «моєму».
- source_word: Κάθου
  choice: Сиди
  rationale: Природний український наказовий відповідник у контексті почесного місця та царювання.
- source_word: ἐκ δεξιῶν μου
  choice: праворуч від Мене
  rationale: Сучасно й природно передає грецький просторовий ідіом без втрати значення місця честі.
- source_word: ἕως ἂν θῶ
  choice: доки Я не покладу
  rationale: Передає часову конструкцію з ἄν та аористом кон’юнктива, спрямовану на майбутню дію.
- source_word: τοὺς ἐχθρούς σου
  choice: Твоїх ворогів
  rationale: Звичайний сучасний відповідник ἐχθρούς; займенник збережено.
- source_word: ὑποκάτω τῶν ποδῶν σου
  choice: під Твої ноги
  rationale: Безпосередньо відтворює грецьке формулювання Матвія; образ підніжка, наявний у єврейському тексті Псалма 110:1, не додається до основного тексту.
theological_decisions:
- issue: Два вживання κύριος у цитаті з Псалма 110:1
  choice: «Господь сказав моєму Господу»
  alternative: «Господь сказав моєму володареві» або «Господь Бог сказав моєму Господу»
  rationale: Однаковий переклад обох уживань зберігає форму грецького тексту й богословську напругу аргументу Ісуса. «Володареві» послабило б титульний зв’язок, а додавання «Бог» зробило б явним розрізнення, якого немає в грецькому формулюванні.
- issue: Образ перемоги над ворогами
  choice: «покладу Твоїх ворогів під Твої ноги»
  alternative: «зроблю Твоїх ворогів підніжком для Твоїх ніг»
  rationale: Основний текст слідує безпосередньому грецькому формулюванню ὑποκάτω τῶν ποδῶν σου, не підмінюючи його формою єврейського тексту Псалма.
translation_notes:
  register: Сучасна стандартна українська, урочиста, але зрозуміла. Великі літери в особових займенниках ужито як шанобливе оформлення прямої мови; вони не створюють додаткового розрізнення між двома вживаннями «Господь».
