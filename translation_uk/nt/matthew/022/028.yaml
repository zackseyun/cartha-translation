  yaml_path: translation/nt/matthew/022/028.yaml
  text: In the resurrection[a], then, whose wife of the seven will she be? For they all had her.
translation:
  language: uk
  text: Отже, у воскресінні дружиною кого з тих сімох вона буде? Адже всі вони мали її за дружину[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «усі вони мали її»; за змістом: «усі семеро одружилися з нею».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῇ ἀναστάσει
  choice: при воскресінні
  rationale: Прийменникова конструкція позначає обставину або час. «При воскресінні» природно передає запитання про майбутнє воскресіння мертвих, не розширюючи його до загального уявлення про потойбічне життя.
- source_word: οὖν
  choice: отже
  rationale: Позначає висновок із викладеної перед цим історії та зберігає логічний хід запитання.
- source_word: τίνος τῶν ἑπτὰ
  choice: чиєю … із сімох
  rationale: Родовий відмінок τίνος запитує про належність або шлюбний зв’язок, а τῶν ἑπτὰ визначає групу, з якої треба назвати чоловіка.
- source_word: γυνή
  choice: дружиною
  rationale: У шлюбному контексті γυνή означає саме дружину, а не просто жінку.
- source_word: πάντες γὰρ ἔσχον αὐτήν
  choice: Адже всі вони мали її за дружину
  rationale: γάρ подає підставу для запитання. Вислів «мали її за дружину» зберігає дієслово ἔχω та водночас ясно передає його шлюбний зміст українською.
theological_decisions:
- issue: Значення ἀνάστασις у запитанні садукеїв
  choice: Майбутнє воскресіння мертвих
  alternative: Невизначене потойбічне життя
  rationale: У контексті садукеї заперечують саме воскресіння, і далі Ісус відповідає про воскресіння. Переклад «воскресіння» зберігає конкретний зміст без додаткового богословського тлумачення.
- issue: Характер шлюбного зв’язку, вираженого ἔσχον αὐτήν
  choice: Передати як «мали її за дружину»
  alternative: «одружилися з нею» або буквально «мали її»
  rationale: Контекст безсумнівно шлюбний, але грецький текст використовує ширше дієслово «мати». Обраний вислів зберігає цю форму й усуває неприродну або двозначну українську фразу «мали її».
translation_notes:
  register: Сучасна, ясна й гідна українська мова. Інверсію в запитанні збережено настільки, наскільки вона природна українською; «адже» виразно передає пояснювальну функцію γάρ.
