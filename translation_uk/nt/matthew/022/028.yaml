  timestamp: '2026-07-19T06:15:41Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основний зміст передано точно: ἐν τῇ ἀναστάσει стосується майбутнього воскресіння, γυνή у цьому контексті — «дружина», а πάντες γὰρ ἔσχον αὐτήν належно пояснює поставлене запитання. Вислів «мали її за дружину» коректно передає шлюбний зміст ἔσχον αὐτήν, не зводячи його безпосередньо до більш тлумачного «одружилися з нею».'
  naturalness: '«Чиєю дружиною із сімох вона буде?» має неприродну синтаксичну побудову в сучасній українській: додаток «із сімох» незрозуміло приєднується до «дружиною». Природніше й так само точно: «дружиною кого з тих сімох вона буде?» «У воскресінні» є усталеним і природним відповідником ἐν τῇ ἀναστάσει в біблійному регістрі.'
  terminology: «Воскресіння», «дружина» та «Адже» відповідають контексту й регістру. «У воскресінні» зберігає означений, контекстуально конкретний зміст без конфесійного розширення.
  issues:
  - severity: medium
    issue: Неприродне приєднання «із сімох» у запитанні.
    rationale: У фразі «чиєю дружиною із сімох вона буде?» неясно, чи «із сімох» характеризує дружину, чи потенційного чоловіка. Грецький родовий зворот τῶν ἑπτὰ визначає того, кому вона буде дружиною; це слід виразити прямо.
  - severity: low
    issue: «При воскресінні» менш природне, ніж «у воскресінні».
    rationale: Обидва варіанти можливі, але «у воскресінні» — усталена сучасна біблійна формула для ἐν τῇ ἀναστάσει й краще зберігає ситуаційно-часовий характер грецького вислову.
  revised_text: Отже, у воскресінні дружиною кого з тих сімох вона буде? Адже всі вони мали її за дружину[a].
