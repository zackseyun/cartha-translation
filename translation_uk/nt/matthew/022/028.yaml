- from: Отже, при воскресінні чиєю дружиною із сімох вона буде? Адже всі вони мали її за дружину[a].
  to: Отже, у воскресінні дружиною кого з тих сімох вона буде? Адже всі вони мали її за дружину[a].
  rationale: Відредаговано лише порядок і форму запитання, щоб однозначно передати «чиєю дружиною з-поміж сімох» природною сучасною українською. «При воскресінні» замінено на усталене «у воскресінні». Пояснювальну примітку збережено, оскільки вона належно показує різницю між буквальним ἔσχον αὐτήν і його шлюбним змістом у контексті.
