  text: περὶ δὲ τῆς ἀναστάσεως τῶν νεκρῶν οὐκ ἀνέγνωτε τὸ ῥηθὲν ὑμῖν ὑπὸ τοῦ θεοῦ λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/031.yaml
  text: Concerning the resurrection of the dead[a], have you not read what was spoken to you by God, saying,
translation:
  language: uk
  text: 'А про воскресіння мертвих хіба ви не читали того, що сказав вам Бог:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περὶ δὲ
  choice: А про
  rationale: Прийменник περί з родовим відмінком вводить тему, а δέ позначає перехід; «А про» природно передає обидві функції без надмірного протиставлення.
- source_word: τῆς ἀναστάσεως τῶν νεκρῶν
  choice: воскресіння мертвих
  rationale: «Воскресіння» є усталеним і точним відповідником ἀνάστασις, а родовий «мертвих» зберігає грецьку конструкцію та вказує на тих, хто воскресає.
- source_word: οὐκ ἀνέγνωτε
  choice: хіба ви не читали
  rationale: Риторичне «хіба ви не читали» природно українською передає заперечне запитання та докір щодо незнання Писання.
- source_word: τὸ ῥηθὲν ὑμῖν ὑπὸ τοῦ θεοῦ
  choice: того, що сказав вам Бог
  rationale: Активна українська конструкція ясно й природно передає зміст грецького пасиву, зберігаючи Бога як діяча, а слухачів — як адресатів.
- source_word: λέγοντος
  choice: ':'
  rationale: Двокрапка природно вводить пряму цитату наступного вірша; окреме «кажучи» українською тут було б важким і надлишковим.
theological_decisions:
- issue: Боже авторство і зверненість Писання до слухачів
  choice: «що сказав вам Бог»
  alternative: «що було сказано вам Богом»
  rationale: Варіант зберігає явне твердження, що промовляє Бог і що сказане звернене до слухачів, не додаючи ширшої теорії натхнення.
translation_notes:
  register: Сучасна стандартна українська; природний, гідний усний стиль. Риторичний характер запитання збережено, а кінцева двокрапка показує, що речення продовжується цитатою у наступному вірші.
