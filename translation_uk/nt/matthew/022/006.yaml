  text: But the rest[a], seizing his servants, mistreated them and killed them.
translation:
  language: uk
  text: А решта, схопивши його рабів[a], познущалися з них і вбили їх.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «слуг».'
