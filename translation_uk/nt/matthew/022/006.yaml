lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: А решта
  rationale: «Решта» означає інших із раніше згаданих запрошених, а «а» природно передає легке протиставлення δέ до тих, хто просто знехтував запрошенням.
- source_word: κρατήσαντες
  choice: схопивши
  rationale: Дієприслівник передає аористовий дієприкметник і дію, що передує головним дієсловам, без додавання окремого сполучника часу.
- source_word: τοὺς δούλους αὐτοῦ
  choice: його рабів
  rationale: δοῦλος позначає підлеглу й залежну особу; у притчі йдеться про царевих посланців, тож «раби» прозоро зберігає соціальний статус, тоді як «слуги» лишається природною контекстною альтернативою.
- source_word: ὕβρισαν
  choice: поглумилися з них
  rationale: ὑβρίζω виражає зухвале, принизливе й образливе поводження, а не лише словесну образу; українське «поглумилися» передає цю насильницьку зневагу.
- source_word: ἀπέκτειναν
  choice: повбивали їх
  rationale: Форма природно передає вбивство кількох осіб без додавання юридичного відтінку, властивого слову «замордували» чи спеціального наголосу на страті.
theological_decisions:
- issue: Передача δοῦλος у контексті притчі
  choice: раби
  alternative: слуги
  rationale: «Раби» зберігає виражений грецьким словом залежний статус царевих посланців і не вносить додаткового богословського тлумачення; «слуги» можливе як м’якший функціональний відповідник.
translation_notes:
  register: Сучасна стандартна українська, стислий і гідний оповідний стиль. «Поглумилися» зберігає сильний відтінок принизливого насильства, а «повбивали» природно узгоджується з множинним об’єктом.
