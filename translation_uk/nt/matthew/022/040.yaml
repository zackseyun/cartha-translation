translation:
  language: uk
  text: На цих двох заповідях тримається весь Закон і Пророки.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «У цих двох заповідях висить увесь Закон і Пророки».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταύταις ταῖς δυσὶν ἐντολαῖς
  choice: На цих двох заповідях
  rationale: У сполученні з κρέμαται прийменник ἐν передає основу або опору. Українське «на … тримаються» природно зберігає образ залежності.
- source_word: ὅλος ὁ νόμος
  choice: весь Закон
  rationale: «Весь» передає повноту, виражену ὅλος; велика літера вказує на Закон як частину усталеної біблійної формули.
- source_word: κρέμαται
  choice: тримаються
  rationale: Форма однини в грецькому тексті узгоджується з першим членом складеного підмета за близькістю, однак українська природно вимагає множини. «Тримаються» зберігає метафору опори й залежності краще, ніж пояснювальне «залежать».
- source_word: καὶ οἱ προφῆται
  choice: і Пророки
  rationale: Збережено усталену назву частини Писання у формулі «Закон і Пророки», а не лише позначення окремих пророчих осіб.
theological_decisions:
- issue: Значення формули «Закон і Пророки»
  choice: Усталене позначення сукупного авторитетного свідчення Писання, пов’язаного з двома заповідями любові
  alternative: Лише етичні приписи законодавчих і пророчих текстів
  rationale: Переклад зберігає матвієву формулу без звуження її до окремих етичних настанов і без розгорнутого тлумачення словом «Писання».
translation_notes:
  register: Сучасна, ясна й гідна українська мова. Образ грецького κρέμαται передано природним українським висловом «тримаються на», а біблійну формулу «Закон і Пророки» збережено.
