  text: And hearing this[a], they were amazed, and leaving him, they went away.
translation:
  language: uk
  text: Почувши це[a], вони здивувалися і, залишивши Його, відійшли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Почувши, вони здивувалися і, залишивши Його, пішли».'
    reason: У грецькому тексті об’єкт дієприкметника «почувши» не виражений; «це» в основному тексті природно відсилає до щойно почутої відповіді. ἀπῆλθαν також можна передати як «пішли».
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Почувши це
  rationale: Аористовий активний дієприкметник передає дію, що передує головному дієслову; «це» природно відтворює невиражений у грецькому тексті об’єкт — щойно почуту відповідь.
- source_word: ἐθαύμασαν
  choice: вони здивувалися
  rationale: θαυμάζω тут означає подив або враження; «здивувалися» є природним сучасним відповідником без надмірного посилення.
- source_word: ἀφέντες αὐτὸν
  choice: залишивши Його
  rationale: У цьому контексті ἀφίημι означає залишити когось і відійти; переклад не додає невираженого значення «самого».
- source_word: ἀπῆλθαν
  choice: пішли геть
  rationale: ἀπέρχομαι позначає відхід; «пішли геть» природно передає напрямок від Ісуса й послідовність оповіді.
- source_word: καὶ ... καὶ
  choice: і ... і
  rationale: Сполучники зберігають просту координацію та швидкий перебіг дій, хоча перший καί після дієприкметникового звороту природно виражено одним «і» перед наступною дією.
