id: MAT.22.7
reference: Matthew 22:7
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ⸂ὁ δὲ βασιλεὺς⸃ ὠργίσθη, καὶ πέμψας τὰ στρατεύματα αὐτοῦ ἀπώλεσεν τοὺς φονεῖς ἐκείνους καὶ τὴν πόλιν αὐτῶν ἐνέπρησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/007.yaml
  text: But the king became angry, and he sent his troops, destroyed those murderers, and burned their city.
translation:
  language: uk
  text: Та цар розгнівався і, пославши своє військо, знищив тих убивць та спалив їхнє місто.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ βασιλεὺς
  choice: Та цар
  rationale: Передає контрастивно-продовжувальне δέ природним українським «та», а βασιλεύς — звичним «цар».
- source_word: ὠργίσθη
  choice: розгнівався
  rationale: Точно й природно передає вступ у стан гніву.
- source_word: τὰ στρατεύματα αὐτοῦ
  choice: своє військо
  rationale: У цьому контексті множина στρατεύματα позначає сукупність царських військових сил; українська збірна однина «військо» звучить природно.
- source_word: ἀπώλεσεν
  choice: знищив
  rationale: Зберігає сильне значення дієслова в контексті воєнної відплати.
- source_word: τοὺς φονεῖς ἐκείνους
  choice: тих убивць
  rationale: Безпосередньо передає вказівний займенник і назву винуватців.
- source_word: τὴν πόλιν αὐτῶν ἐνέπρησεν
  choice: спалив їхнє місто
  rationale: Стисло й точно відтворює навмисне знищення міста вогнем.
theological_decisions:
- issue: Можливе історико-богословське ототожнення царя, війська та міста
  choice: Не конкретизувати образи поза текстом притчі
  alternative: Назвати царя Богом, військо конкретною історичною армією або місто Єрусалимом
  rationale: Вірш прямо подає образний сюжет і не здійснює цих ототожнень; переклад має зберігати його відкритість для тлумачення.
translation_notes:
  register: Сучасна стандартна українська; природний, стислий і гідний оповідний стиль. Дієприслівникова конструкція «пославши своє військо» зберігає синтаксичну залежність грецького πέμψας від головних дій царя.
