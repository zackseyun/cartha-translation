  text: οἱ δὲ ἀμελήσαντες ἀπῆλθον, ⸀ὃς μὲν εἰς τὸν ἴδιον ἀγρόν, ⸁ὃς δὲ ⸀ἐπὶ τὴν ἐμπορίαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/005.yaml
  text: But they paid no attention and went away[a], one to his own field, another to his business.
translation:
  language: uk
  text: 'Але вони знехтували цим[a] і пішли: один — на своє поле, інший — до своєї торгової справи.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «не звернули на це уваги» чи «поставилися до цього байдуже»; у контексті йдеться про царське запрошення.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμελήσαντες
  choice: знехтували цим
  rationale: Дієприкметник від ἀμελέω передає байдужість і свідоме неврахування; займенник «цим» природно вказує на запрошення з контексту, не називаючи його прямо.
- source_word: ἀπῆλθον
  choice: пішли
  rationale: Природний сучасний відповідник, який передає віддалення запрошених після царського поклику.
- source_word: ὃς μὲν ... ὃς δὲ
  choice: один ... а інший
  rationale: Зберігає розподільну конструкцію та протиставлення μέν ... δέ природною українською мовою.
- source_word: εἰς τὸν ἴδιον ἀγρόν
  choice: на своє поле
  rationale: «Поле» безпосередньо передає ἀγρός, а «своє» зберігає наголос ἴδιον на особистому занятті.
- source_word: ἐπὶ τὴν ἐμπορίαν αὐτοῦ
  choice: у своїх торгових справах
  rationale: ἐμπορία означає торгівлю або комерційну діяльність; цей вислів природно передає напрямок до власних ділових занять і не звужує значення до товару.
theological_decisions:
- issue: Неявний додаток при ἀμελήσαντες
  choice: «знехтували цим», де «цим» у контексті стосується царського запрошення
  alternative: «не звернули уваги» або «знехтували запрошенням»
  rationale: У грецькому тексті додаток не виражений, але його подає найближчий контекст. Займенник зберігає певну неявність оригіналу й водночас забезпечує природність українського речення.
translation_notes:
  register: Сучасна стандартна українська; виклад природний і гідний. Двокрапка та парна конструкція «один — ... а інший — ...» виразно відтворюють розподіл запрошених за їхніми заняттями.
