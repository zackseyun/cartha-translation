lexical_decisions:
- source_word: λέγει
  choice: каже
  rationale: Грецький теперішній час у розповіді природно передано українським історичним теперішнім, яке тут звучить нормативно й виразно.
- source_word: αὐτοῖς
  choice: їм
  rationale: Давальний відмінок займенника передає адресатів мовлення; українське «їм» є прямим і природним відповідником.
- source_word: Τίνος
  choice: чиї
  rationale: Родовий відмінок питального займенника вказує на належність або зв’язок. Форма множини «чиї» природно узгоджує спільне питання з двома однорідними іменниками.
- source_word: εἰκών
  choice: зображення
  rationale: У контексті монети йдеться про викарбуваний образ правителя. «Зображення» точно, нейтрально й не звужує значення до конкретного виду портрета.
- source_word: αὕτη
  choice: це
  rationale: Вказівний займенник позначає зображення на показаній монеті; у перебудованому українському питанні природно стосується обох названих ознак.
- source_word: ἐπιγραφή
  choice: напис
  rationale: Слово означає написане або викарбуване позначення; «напис» є точним і загальнозрозумілим відповідником у контексті монети.
- source_word: καὶ
  choice: та
  rationale: Єднає два однорідні предмети питання. «Та» природно уникає небажаного повторення «і» після вступного сполучника.
