  text: Ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Πλανᾶσθε μὴ εἰδότες τὰς γραφὰς μηδὲ τὴν δύναμιν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/029.yaml
  text: But Jesus answered them[a], “You are mistaken, because you know neither the Scriptures nor the power of God.”
translation:
  language: uk
  text: 'Ісус же відповів їм: «Ви помиляєтеся, бо не знаєте ані Писань, ані сили Божої».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Ісус же відповів їм
  rationale: Дієприкметникову формулу Ἀποκριθεὶς ... εἶπεν природно передано одним дієсловом «відповів», без неприродного дублювання «відповідаючи, сказав». Частка δέ передана постпозитивним «же», яке позначає легкий перехід або протиставлення.
- source_word: Πλανᾶσθε
  choice: Ви помиляєтеся
  rationale: Форма може означати перебування в омані або збочення з правильного шляху. «Помиляєтеся» природно й точно передає зміст у цьому полемічному контексті, не уточнюючи безпідставно, чи омана спричинена кимось зовні.
- source_word: μὴ εἰδότες
  choice: бо не знаєте
  rationale: Дієприкметниковий зворот пояснює причину помилки; сполучник «бо» ясно й природно відтворює цей причинний зв’язок.
- source_word: τὰς γραφὰς
  choice: Писань
  rationale: Множина γραφαί у цьому юдейському контексті означає священні тексти. Усталене українське «Писання» в множинній родовій формі точно передає референт.
- source_word: μηδὲ τὴν δύναμιν τοῦ θεοῦ
  choice: ані сили Божої
  rationale: Парна конструкція «ані... ані...» відтворює зв’язок μὴ ... μηδέ, а «сила Божа» є природним і змістово точним українським відповідником.
theological_decisions:
- issue: Причина помилки садукеїв
  choice: Незнання і Писань, і сили Божої подано як причину їхньої помилки.
  alternative: Сприймати вислів лише як загальне звинувачення в омані без виразного причинного зв’язку.
  rationale: Дієприкметниковий зворот μὴ εἰδότες природно має причинне значення й пов’язує помилку з незнанням обох названих речей.
- issue: Характер омани у Πλανᾶσθε
  choice: Не уточнювати, чи вони помиляються самі, чи були введені в оману.
  alternative: «Вас введено в оману» або «ви заблукали».
  rationale: Грецька форма допускає відтінки пасивного й медіального значення. Нейтральне «помиляєтеся» зберігає смислову широту без нав’язування зовнішнього винуватця.
translation_notes:
  register: Сучасна стандартна українська; виклад стислий, гідний і зрозумілий. Збережено риторичну прямоту вислову та парну конструкцію «ані... ані...». Постпозитивне «же» надає біблійно-гідного, але не архаїчного звучання.
