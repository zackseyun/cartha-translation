lexical_decisions:
- source_word: ἐπιδείξατέ
  choice: Покажіть Мені
  rationale: Аористовий наказовий спосіб другої особи множини передає наказ показати предмет для огляду; це природний і точний український відповідник.
- source_word: νόμισμα
  choice: монету
  rationale: У цьому контексті слово означає конкретну монету в обігу, що підтверджується подальшою згадкою денарія.
- source_word: τοῦ κήνσου
  choice: якою сплачують податок
  rationale: Родовий відмінок указує на монету, призначену для сплати римського податку; описове формулювання природне українською і не звужує значення в основному тексті до конкретного виду податку.
- source_word: προσήνεγκαν
  choice: принесли
  rationale: Простий і природний наративний відповідник аориста від προσφέρω.
- source_word: δηνάριον
  choice: денарій
  rationale: Транслітерація зберігає назву конкретної історичної римської монети.
