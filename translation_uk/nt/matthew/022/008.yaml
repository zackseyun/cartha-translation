lexical_decisions:
- source_word: τότε
  choice: Тоді
  rationale: Природно передає часову послідовність розповіді.
- source_word: λέγει
  choice: каже
  rationale: Зберігає історичний теперішній час грецького тексту та його оповідну жвавість.
- source_word: δούλοις
  choice: слугам
  rationale: У контексті царського двору й притчі «слуги» природно передає їхню роль, не роблячи зайвого наголосу на правовому статусі рабів.
- source_word: Ὁ μὲν γάμος
  choice: Весільний бенкет
  rationale: У цьому контексті γάμος означає весільне святкування з приготовленою трапезою; конструкція μὲν…δὲ передана протиставленням «але».
- source_word: ἕτοιμός ἐστιν
  choice: готовий
  rationale: Прямий і природний відповідник предикативної конструкції.
- source_word: οἱ δὲ κεκλημένοι
  choice: запрошені
  rationale: У контексті бенкету дієприкметник від καλέω позначає тих, кого запросили; буквальніше «покликані» збережено в примітці.
- source_word: οὐκ ἦσαν ἄξιοι
  choice: виявилися недостойними
  rationale: Передає оцінне значення ἄξιοι та природно звучить українською після розповіді про поведінку запрошених; не уточнює понад текст підставу їхньої недостойності.
theological_decisions:
- issue: Можливі богословські конотації κεκλημένοι («покликані»)
  choice: запрошені
  alternative: покликані
  rationale: Безпосередній контекст говорить про гостей, запрошених на весільний бенкет. Основний текст передає це значення без нав’язування пізнішої богословської категорії покликання, а буквальніший варіант подано в примітці.
