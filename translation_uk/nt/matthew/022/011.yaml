  text: εἰσελθὼν δὲ ὁ βασιλεὺς θεάσασθαι τοὺς ἀνακειμένους εἶδεν ἐκεῖ ἄνθρωπον οὐκ ἐνδεδυμένον ἔνδυμα γάμου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/011.yaml
  text: But when the king came in to look at the guests reclining at the table[b][a], he saw there a man not dressed in wedding clothes.
translation:
  language: uk
  text: Коли ж цар увійшов подивитися на гостей, що напівлежали за столом[a], то побачив там чоловіка, не вдягненого у весільне вбрання.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: У грецькому тексті — «тих, хто напівлежав». На урочистих бенкетах гості за тодішнім звичаєм напівлежали за столом.
    reason: cultural_note
lexical_decisions:
- source_word: εἰσελθὼν δὲ ὁ βασιλεὺς
  choice: Коли ж цар увійшов
  rationale: Дієприкметник аориста передає дію, що передує головному дієслову, а δέ позначає новий, дещо контрастний поворот оповіді. Підрядна конструкція природна для сучасної української.
- source_word: θεάσασθαι
  choice: подивитися на
  rationale: Інфінітив виражає мету входу царя. «Подивитися на» зберігає значення уважного оглядання, не посилюючи його до формальної перевірки.
- source_word: τοὺς ἀνακειμένους
  choice: на гостей, які лежали за столом
  rationale: У контексті бенкету ἀνάκειμαι означає лежати при столі за тодішнім звичаєм. «Гостей» увиразнює мається на увазі учасників весільного бенкету, а підрядна частина зберігає історичну деталь.
- source_word: εἶδεν ἐκεῖ ἄνθρωπον
  choice: побачив там чоловіка
  rationale: Прямо відтворено просту оповідну дію, прислівник місця та чоловічий рід конкретного персонажа.
- source_word: οὐκ ἐνδεδυμένον ἔνδυμα γάμου
  choice: не вдягненого у весільне вбрання
  rationale: Перфектний дієприкметник описує наявний стан чоловіка. «Весільне вбрання» природно передає однину ἔνδυμα та одяг, належний для весільного бенкету.
theological_decisions:
- issue: Образ давнього бенкету та поза гостей
  choice: Зберегти згадку про те, що гості лежали за столом, і водночас прямо назвати їх гостями.
  alternative: Передати лише як «ті, хто лежав» або просто як «гості».
  rationale: Таке формулювання зберігає культурно-історичну деталь грецького тексту, але залишається зрозумілим сучасному читачеві й не додає богословського тлумачення.
- issue: Рід слова ἄνθρωπον
  choice: чоловіка
  alternative: людину; когось
  rationale: У притчі йдеться про конкретного персонажа чоловічого роду, тому гендерно точне відтворення відповідає формі й оповідному контексту джерела.
translation_notes:
  register: Сучасна стандартна українська; виклад природний, ясний і гідний. Історичну деталь бенкетної пози збережено без архаїчної або надмірно буквальної конструкції.
