  text: ὁ ⸀δὲ ἔφη αὐτῷ· Ἀγαπήσεις κύριον τὸν θεόν σου ἐν ὅλῃ ⸀τῇ καρδίᾳ σου καὶ ἐν ὅλῃ ⸁τῇ ψυχῇ σου καὶ ἐν ὅλῃ τῇ διανοίᾳ σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/037.yaml
  text: And he said to him[c][b][a], “You shall love the Lord your God with all your heart and with all your soul and with all your mind.”
translation:
  language: uk
  text: 'А Він сказав йому: «Люби Господа, Бога твого, усім твоїм серцем, усією твоєю душею[a] і всім твоїм розумом[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Грецьке ψυχή може також означати «життя» або «саму особу»; тут «душа» зберігає формулювання заповіді та її всеохопний зміст.
    reason: lexical_alternative
  - marker: b
    text: 'Або: «розумінням».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: А
  rationale: М’який сполучник продовжує діалог; українське «А» природно передає перехід до відповіді без наголошеного протиставлення.
- source_word: ἔφη
  choice: сказав
  rationale: Прямо передає дієслово введення прямої мови, не додаючи відсутнього в самому слові значення «відповів».
- source_word: Ἀγαπήσεις
  choice: Люби
  rationale: Форма майбутнього часу в цитованій заповіді має наказову силу. Український наказовий спосіб природно й виразно передає цю силу, не послаблюючи її до простої констатації майбутнього.
- source_word: κύριον τὸν θεόν σου
  choice: Господа, Бога свого
  rationale: «Господь» зберігає завітне звучання цитати, а прикладка «Бога свого» точно й природно передає грецьку конструкцію.
- source_word: ἐν ὅλῃ
  choice: усім / усією / всім
  rationale: В українській цю конструкцію природно передає орудний відмінок без окремого прийменника; він виражає цілковиту залученість людини.
- source_word: καρδίᾳ
  choice: серцем
  rationale: Усталений відповідник, який у біблійному контексті охоплює внутрішню людину, її прагнення і волю.
- source_word: ψυχῇ
  choice: душею
  rationale: Зберігає окремий елемент тричленної формули; слово також може позначати життя або саму особу, що відзначено у примітці.
- source_word: διανοίᾳ
  choice: розумом
  rationale: Природно передає здатність мислити й розуміти та зберігає інтелектуальний вимір заповіді.
theological_decisions:
- issue: Передача цитати з Повторення Закону у відповіді Ісуса
  choice: Збережено тричленну формулу «серцем… душею… розумом» і наказову силу вислову
  alternative: Передати ψυχή як «життя», διάνοια як «розуміння», а ἐν — буквально прийменником «у»
  rationale: Обраний варіант не зливає різні грецькі поняття в загальний переказ і водночас звучить природно сучасною українською. Він зберігає всеохопний характер любові до Бога, не визначаючи жорстко межі між складниками людської особи.
translation_notes:
  register: Сучасна нормативна українська з гідним біблійним звучанням. Наказове «Люби» природніше за буквальне майбутнє «любитимеш» для заповіді. Орудний відмінок передає ἐν без неприродної примітки про прийменник; займенник «своїм» повторено лише при першому члені та зрозуміло поширюється на весь ряд.
