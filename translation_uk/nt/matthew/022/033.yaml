lexical_decisions:
- source_word: καὶ
  choice: І
  rationale: Простий сполучник зберігає зв’язок із попередньою розповіддю.
- source_word: ἀκούσαντες
  choice: почувши це
  rationale: Дієприслівник природно передає аористовий активний дієприкметник; «це» відтворює зрозумілий із контексту предмет почутого — попередню відповідь Ісуса.
- source_word: οἱ ὄχλοι
  choice: натовпи
  rationale: Збережено граматичну множину грецького іменника з артиклем.
- source_word: ἐξεπλήσσοντο
  choice: дивувалися
  rationale: Форма недоконаного виду передає тривалу або виразно змальовану реакцію; «дивувалися» є природним сучасним відповідником без надмірного посилення.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: з Його вчення
  rationale: Конструкція ἐπί з давальним позначає підставу або привід для здивування; українське «дивуватися з» природно передає цей зв’язок, а «вчення» відповідає διδαχή без зайвої технічності.
