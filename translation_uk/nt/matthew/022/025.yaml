  text: ἦσαν δὲ παρ’ ἡμῖν ἑπτὰ ἀδελφοί· καὶ ὁ πρῶτος ⸀γήμας ἐτελεύτησεν, καὶ μὴ ἔχων σπέρμα ἀφῆκεν τὴν γυναῖκα αὐτοῦ τῷ ἀδελφῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/025.yaml
  text: There were seven brothers among us[a]. The first married and died, and having no offspring[b], he left his wife to his brother.
translation:
  language: uk
  text: Було ж у нас сім братів. Перший одружився і помер і, не маючи нащадків[a], залишив свою дружину братові[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не маючи насіння». Тут «насіння» означає потомство, нащадків.'
    reason: lexical_alternative
  - marker: b
    text: 'Ідеться про звичай левіратного шлюбу: брат померлого мав одружитися з удовою, щоб забезпечити потомство для померлого; див. Повторення Закону 25:5.'
    reason: cultural_note
lexical_decisions:
- source_word: παρ’ ἡμῖν
  choice: у нас
  rationale: Природно передає присутність або належність до спільноти мовців; у цьому контексті українське «у нас» ясніше й природніше за буквальніше «серед нас».
- source_word: ἑπτὰ ἀδελφοί
  choice: сім братів
  rationale: У контексті левіратного шлюбу йдеться саме про рідних братів чоловічої статі.
- source_word: ὁ πρῶτος
  choice: перший
  rationale: Позначає першого в послідовності, не обов’язково найстаршого.
- source_word: γήμας
  choice: одружився
  rationale: Аористовий дієприкметник указує на дію, що передувала смерті; особова форма природно передає цю послідовність українською.
- source_word: ἐτελεύτησεν
  choice: помер
  rationale: Прямий і точний відповідник без евфемізації.
- source_word: μὴ ἔχων σπέρμα
  choice: оскільки не мав нащадків
  rationale: σπέρμα буквально означає «насіння», але тут має родовий і правовий сенс — потомство або нащадки. Підрядна конструкція природно передає супровідну причинну обставину.
- source_word: ἀφῆκεν τὴν γυναῖκα αὐτοῦ
  choice: залишив свою дружину
  rationale: У контексті смерті означає залишити після себе, а не покинути чи розлучитися.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: братові
  rationale: Давальний відмінок прямо передає особу, якій залишилася вдова; присвійний займенник українською тут зайвий, бо спорідненість уже однозначна з контексту.
theological_decisions:
- issue: Чи слід прямо додати в основному тексті мету левіратного шлюбу
  choice: 'Зберегти неявність оригіналу: «залишив свою дружину братові».'
  alternative: «залишив свою дружину, щоб брат одружився з нею»
  rationale: Грецький текст передбачає звичай левіратного шлюбу, але не висловлює тут прямо слів «щоб одружився». Пояснення належить до примітки, а не до основного тексту.
translation_notes:
  register: Сучасна нормативна українська мова, проста й гідна оповідна манера. Частку δέ передано як «ж», що зберігає легкий зв’язок із попередньою розповіддю без додавання часового «тепер». Усі примітки мають відповідні маркери в основному тексті.
