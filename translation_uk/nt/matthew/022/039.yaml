  source_fidelity: 'Текст точно передає грецький вислів: Δευτέρα — «друга», δέ — м’яке «А», ὁμοία αὐτῇ — «подібна до неї», а цитована заповідь природно відтворена наказовим способом. «Свого ближнього» та «як самого себе» відповідають τὸν πλησίον σου і ὡς σεαυτόν.'
  naturalness: Формулювання «А друга подібна до неї» є природним для сучасної літературної української та водночас зберігає гідний біблійний регістр. «Люби свого ближнього, як самого себе» — усталене, зрозуміле й стилістично доречне відтворення.
  terminology: «Ближній» є точним традиційним відповідником πλησίον і не звужує значення до фізичної близькості. Переклад не додає богословських висновків щодо характеру подібності двох заповідей.
