  yaml_path: translation/nt/matthew/022/039.yaml
  text: 'And a second is like it: You shall love your neighbor as yourself[a].'
translation:
  language: uk
  text: 'А друга подібна до неї: «Люби свого ближнього, як самого себе».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Грецьке слово «друга» без артикля може означати як «друга», так і «ще одна, друга».
    reason: lexical_alternative
lexical_decisions:
- source_word: Δευτέρα
  choice: друга
  rationale: Субстантивований порядковий прикметник називає другу заповідь. Українська форма «друга» природно передає порядкове значення, не змушуючи штучно обирати між англійськими «a second» і «the second», оскільки в українській немає артиклів.
- source_word: δὲ
  choice: А
  rationale: Тут δέ є м’яким сполучником, що продовжує виклад і вводить наступний пункт без різкого протиставлення. «А» природно передає цей перехід.
- source_word: ὁμοία αὐτῇ
  choice: подібна до неї
  rationale: Прикметник ὁμοία з давальним αὐτῇ виражає подібність до першої заповіді, згаданої перед цим. Український вислів точно зберігає порівняння.
- source_word: Ἀγαπήσεις
  choice: Люби
  rationale: Форма майбутнього часу в цитаті має наказову силу. Український наказовий спосіб природно й недвозначно передає припис, зберігаючи впізнавану форму заповіді з Левит 19:18.
- source_word: τὸν πλησίον σου
  choice: свого ближнього
  rationale: Усталений біблійний та сучасний український відповідник позначає людину, щодо якої належить виявляти любов, а не лише того, хто перебуває фізично поруч.
- source_word: ὡς σεαυτόν
  choice: як самого себе
  rationale: «Як» вводить міру порівняння, а «самого себе» природно й виразно передає зворотний займенник чоловічого роду, узгоджений із адресатом вислову.
theological_decisions:
- issue: Відношення другої заповіді до першої
  choice: друга подібна до неї
  alternative: друга така сама, як вона
  rationale: Переклад зберігає твердження про подібність другої заповіді до першої, не ототожнюючи їх і не додаючи тлумачення щодо точного характеру їхньої рівності чи значущості.
translation_notes:
  register: Сучасна, проста й гідна українська мова. Форму «Люби» обрано як природне передавання наказової сили грецького майбутнього часу; цитату оформлено лапками. Збережено традиційне й зрозуміле слово «ближній».
