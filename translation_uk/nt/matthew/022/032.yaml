  text: Ἐγώ εἰμι ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ; οὐκ ἔστιν ⸂ὁ θεὸς⸃ νεκρῶν ἀλλὰ ζώντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/032.yaml
  text: I am the God of Abraham and the God of Isaac and the God of Jacob. He is not the God of the dead[a], but of the living.
translation:
  language: uk
  text: «Я — Бог Авраама, Бог Ісаака і Бог Якова». Він Бог не мертвих, а живих.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Бог — не Бог мертвих, а живих». У грецькому тексті в другому реченні слово «Бог» ужито знову; в основному тексті для природності українського викладу вжито «Він».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Я —
  rationale: Українська іменна конструкція в теперішньому часі природно передає грецьке самовизначення Ἐγώ εἰμι; тире позначає пропущену зв’язку «є» без додавання зайвого смислу.
- source_word: ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ
  choice: Бог Авраама, Бог Ісаака і Бог Якова
  rationale: Повторення «Бог» збережено для риторичної ваги оригіналу; родовий відмінок природно виражає грецьку конструкцію.
- source_word: οὐκ ἔστιν ὁ θεὸς νεκρῶν ἀλλὰ ζώντων
  choice: Він Бог не мертвих, а живих
  rationale: Стисла українська конструкція природно передає протиставлення; субстантивовані «мертвих» і «живих» відповідають грецьким формам та не додають пояснювального тлумачення.
theological_decisions:
- issue: Значення слів про патріархів у контексті суперечки про воскресіння
  choice: Передати вислів прямо, не уточнюючи, в якому саме сенсі мертві є живими перед Богом.
  alternative: Він Бог не померлих людей, а тих, хто й далі живе перед Ним.
  rationale: Оригінал підтримує аргумент Ісуса, але не формулює тут розгорнутого вчення про проміжний стан; переклад зберігає богословську напругу.
- issue: Повторне явне ὁ θεός у другому реченні
  choice: Він Бог не мертвих, а живих.
  alternative: Бог — не Бог мертвих, а живих.
  rationale: Займенник природний в українській і чітко відсилає до щойно названого Бога; примітка подає формальніший варіант, що відтворює лексичне повторення грецького тексту.
translation_notes:
  register: Сучасна нормативна українська, гідний і зрозумілий біблійний стиль. Збережено трикратне називання Бога щодо патріархів і лаконічне протиставлення «мертвих — живих».
