  text: While the Pharisees were gathered together, Jesus asked them,
translation:
  language: uk
  text: 'Коли фарисеї зібралися разом, Ісус запитав їх:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνηγμένων
  choice: Коли ... зібралися разом
  rationale: Генетив абсолютний задає супровідну часову обставину. Особова конструкція з «коли» природна в сучасній українській; «разом» передає збірне значення συνάγω.
- source_word: δὲ
  choice: не передано окремим словом
  rationale: Частка позначає слабкий перехід у розповіді, який українською тут природно виражається самим початком підрядної часової частини; додавання «а», «і» чи «тоді» могло б надмірно конкретизувати зв’язок.
- source_word: τῶν Φαρισαίων
  choice: фарисеї
  rationale: Усталена сучасна українська назва групи; у перекладеній особовій конструкції слово стоїть у називному відмінку.
- source_word: ἐπηρώτησεν
  choice: запитав
  rationale: Природний відповідник дієслова в контексті введення запитання, без зайвого відтінку допиту чи протистояння.
- source_word: αὐτοὺς
  choice: їх
  rationale: Прямий додаток, що відсилає до щойно згаданих фарисеїв.
- source_word: ὁ Ἰησοῦς
  choice: Ісус
  rationale: Власне ім’я суб’єкта; грецький артикль перед особовим ім’ям українською не відтворюється.
