  text: Це — велика й перша заповідь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Це — найголовніша заповідь». Дослівніше грецький текст має два означення: «велика й перша заповідь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  choice: Це
  rationale: Вказівний займенник відсилає до щойно наведеної заповіді у в. 37; «це» природно передає анафоричний зв’язок українською.
- source_word: ἐστὶν
  choice: —
  rationale: У теперішньому часі українська природно передає зв’язку «є» нульовою формою; тире виразно оформлює іменний присудок без зміни значення.
- source_word: μεγάλη
  choice: велика
  rationale: Позитивний ступінь прикметника означає важливість або значущість. «Найбільша» було б надмірним перетворенням на найвищий ступінь.
- source_word: πρώτη
  choice: перша
  rationale: Прямо зберігає значення першості за порядком або рангом і не зливає його зі значенням μεγάλη.
- source_word: ἐντολή
  choice: заповідь
  rationale: У біблійному та юдейському правовому контексті усталене українське «заповідь» точно відповідає ἐντολή.
theological_decisions:
- issue: Співвідношення μεγάλη і πρώτη в описі заповіді
  choice: 'Передати обидва узгоджені прикметники окремо: «велика й перша заповідь».'
  alternative: «найбільша заповідь» або «найперша заповідь»
  rationale: Грецький текст містить два прикметники позитивного ступеня, які координовано означують ἐντολή. Окреме відтворення зберігає риторичний наголос і не зводить велич та першість до одного витлумаченого найвищого ступеня.
translation_notes:
  register: Сучасна, природна й гідна українська біблійна мова. Формулювання зберігає незвичну, але змістовно важливу координацію двох грецьких прикметників; примітка подає природніший тлумачний варіант.
