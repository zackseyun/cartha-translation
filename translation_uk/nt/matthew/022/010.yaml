  text: καὶ ἐξελθόντες οἱ δοῦλοι ἐκεῖνοι εἰς τὰς ὁδοὺς συνήγαγον πάντας ⸀οὓς εὗρον, πονηρούς τε καὶ ἀγαθούς· καὶ ἐπλήσθη ὁ ⸀γάμος ἀνακειμένων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/010.yaml
  text: And those servants went out into the roads and gathered everyone they found[a], both evil and good[c][b]; and the wedding hall was filled with guests reclining at the table.
translation:
  language: uk
  text: І ті раби вийшли на дороги й зібрали всіх, кого знайшли, — і лихих, і добрих. І весільна зала[a] наповнилася гостями, які напівлежали за столом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально «весілля»; грецьке слово може також означати весільний бенкет.
    reason: lexical_alternative
  - marker: b
    text: Під час урочистої трапези в давнину гості зазвичай не сиділи, а напівлежали біля столу.
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλοι
  choice: раби
  rationale: Прямо передає підневільний статус царських домашніх рабів у світі притчі, не пом’якшуючи давньої суспільної реальності словом «слуги».
- source_word: ὁδοὺς
  choice: дороги
  rationale: Звичний широкий відповідник для публічних шляхів; контекст не вимагає звуження до міських вулиць.
- source_word: συνήγαγον
  choice: зібрали
  rationale: Природно й безпосередньо передає дію зведення людей разом.
- source_word: πάντας οὓς εὗρον
  choice: всіх, кого знайшли
  rationale: Зберігає всеохопність πάντας і відносну конструкцію оὓς εὗρον у природній сучасній українській формі.
- source_word: πονηρούς τε καὶ ἀγαθούς
  choice: і лихих, і добрих
  rationale: Відтворює виразний моральний контраст, водночас не додаючи оцінок чи богословських висновків поза текстом.
- source_word: γάμος
  choice: весільна зала
  rationale: Буквально слово позначає весілля або весільний бенкет, але дієслово «наповнилася» та згадка про учасників трапези вказують тут на місце святкування; примітка зберігає ширший буквальний діапазон.
- source_word: ἐπλήσθη
  choice: наповнилася
  rationale: Прямий природний відповідник пасивної форми зі значенням досягнення повноти.
- source_word: ἀνακειμένων
  choice: гістьми, які напівлежали за столом
  rationale: Передає учасників бенкету та звичайну для античної урочистої трапези позу; «напівлежали» точніше за звичне сучасне «сиділи».
theological_decisions:
- issue: Моральна характеристика зібраних людей
  choice: і лихих, і добрих
  alternative: і поганих, і добрих
  rationale: «Лихих» зберігає моральну гостроту πονηρούς і всеохопність запрошення, але не випереджає подальшого розвитку притчі й не ототожнює саму присутність із належною відповіддю.
translation_notes:
  register: Сучасна, зрозуміла й гідна оповідна українська. Сполука «і лихих, і добрих» зберігає риторичний баланс оригіналу; «раби» не приховує суспільного статусу персонажів. Культурно незвичну позу за столом передано точно й пояснено приміткою.
