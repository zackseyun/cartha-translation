source:
  edition: SBLGNT
  text: ἐν γὰρ τῇ ἀναστάσει οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται, ἀλλ’ ὡς ἄγγελοι ⸀θεοῦ ἐν ⸀τῷ οὐρανῷ εἰσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/030.yaml
  text: For in the resurrection they neither marry nor are given in marriage[a], but are like the angels of God in heaven.
translation:
  language: uk
  text: Бо у воскресінні[a] не одружуються і не виходять заміж, а подібні до Божих ангелів на небі.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «під час воскресіння».'
    reason: 'Лексична альтернатива: ἐν τῇ ἀναστάσει може описувати стан воскреслого життя («у воскресінні») або часову обставину («під час воскресіння»).'
lexical_decisions:
- source_word: ἐν ... τῇ ἀναστάσει
  choice: у воскресінні
  rationale: Прийменниковий вислів може вказувати як на час воскресіння, так і на стан воскреслого життя. «У воскресінні» формально зберігає грецький прийменник і не звужує значення лише до миті події.
- source_word: γαμοῦσιν
  choice: одружуються
  rationale: Сучасний загальнозрозумілий відповідник дієслова зі значенням вступу в шлюб; у цьому контексті він природно передає першу частину усталеної парної конструкції.
- source_word: γαμίζονται
  choice: виходять заміж
  rationale: Грецька форма протиставлена γαμοῦσιν і відбиває інший бік традиційного укладання шлюбу. Українська парна формула «одружуються і виходять заміж» природно зберігає цю відмінність, не вдаючись до неприродного пасиву «віддаються заміж».
- source_word: ὡς
  choice: як
  rationale: 'Позначає порівняння, а не тотожність: воскреслі подібні до ангелів у зазначеному контексті, а не стають ангелами.'
- source_word: ἄγγελοι θεοῦ
  choice: Божі ангели
  rationale: Природна українська конструкція, яка явно передає наявний у грецькому тексті родовий θεοῦ.
- source_word: ἐν τῷ οὐρανῷ
  choice: на небі
  rationale: У цьому контексті οὐρανός означає небесну сферу перебування ангелів, а не фізичне небо; «на небі» є звичним сучасним українським відповідником.
- source_word: γὰρ
  choice: бо
  rationale: Передає пояснювально-причиновий зв’язок із попереднім висловом стисло й природно.
- source_word: εἰσιν
  choice: є
  rationale: Прямо відтворює зв’язку «є», зберігаючи порівняльну конструкцію «є, як…».
theological_decisions:
- issue: Характер подібності воскреслих людей до ангелів
  choice: Люди у воскресінні подібні до ангелів у контексті відсутності шлюбу; текст не стверджує, що вони стають ангелами.
  alternative: Поширити порівняння на загальну ангельську природу чи перетворення людей на ангелів.
  rationale: Частка ὡς виражає подібність, а найближчий контекст пов’язує її з тим, що у воскресінні не укладають шлюб. Переклад «як» зберігає порівняння, не перетворюючи його на твердження про тотожність.
translation_notes:
  register: Сучасна, гідна й загальнозрозуміла українська мова. Парна формула «не одружуються і не виходять заміж» природно передає два різні грецькі дієслова та традиційні сторони укладання шлюбу. Кома перед «як» допомагає прочитати вислів як порівняння при присудку «є».
