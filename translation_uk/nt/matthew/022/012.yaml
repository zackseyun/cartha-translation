  text: καὶ λέγει αὐτῷ· Ἑταῖρε, πῶς εἰσῆλθες ὧδε μὴ ἔχων ἔνδυμα γάμου; ὁ δὲ ἐφιμώθη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/012.yaml
  text: And he says to him[a], ‘Friend, how did you come in here without a wedding garment?’ But he was speechless.
translation:
  language: uk
  text: 'І каже йому: «Друже, як ти ввійшов сюди без весільного вбрання?» А той онімів[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або, буквальніше, «був змушений замовкнути». Грецьке дієслово буквально може означати «затуляти рота» або «загнуздувати».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑταῖρε
  choice: Друже
  rationale: Клична форма природно передає звертання, яке зовні ввічливе, але в цьому контексті має відсторонено-докірливий відтінок; не посилює ані приязні, ані ворожості понад грецький текст.
- source_word: πῶς
  choice: як
  rationale: Передає запитання про спосіб або можливість входу, а не про мотив.
- source_word: εἰσῆλθες ὧδε
  choice: ти ввійшов сюди
  rationale: Докончаний вид відтворює завершену дію аориста, а вислів є природним у сучасній українській.
- source_word: μὴ ἔχων
  choice: без
  rationale: Природно й стисло передає обставинний дієприкметниковий зворот про відсутність належного вбрання.
- source_word: ἔνδυμα γάμου
  choice: весільне вбрання
  rationale: Зберігає однину та зв’язок одягу з весіллям, не уточнюючи безпідставно його конкретний вид.
- source_word: ἐφιμώθη
  choice: замовк
  rationale: У контексті означає, що чоловік не зміг нічого відповісти; українське «замовк» природно передає результат, тоді як буквальніший пасив і образ намордника подано в примітці.
theological_decisions:
- issue: Тон звертання господаря до неналежно вдягненого гостя
  choice: Зовні ввічливе, але докірливе «Друже»
  alternative: Різкіше або відстороненіше «Чоловіче» чи буквальніше «Товаришу»
  rationale: Так зберігається напруженість оповіді без привнесення надмірної теплоти або зневаги.
- issue: Передача ἐφιμώθη
  choice: Контекстуальне «замовк» у головному тексті
  alternative: Буквальніше «був змушений мовчати» або образне «йому затулило рота»
  rationale: Основний текст залишається природним українською, а пасивний характер і буквальний образ грецького дієслова збережено в примітці.
translation_notes:
  register: Сучасна стандартна українська, природний і гідний оповідний стиль. Історичний теперішній «каже» збережено відповідно до грецького λέγει; репліку сформульовано просто й виразно.
