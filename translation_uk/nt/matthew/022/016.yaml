id: MAT.22.16
reference: Matthew 22:16
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: καὶ ἀποστέλλουσιν αὐτῷ τοὺς μαθητὰς αὐτῶν μετὰ τῶν Ἡρῳδιανῶν ⸀λέγοντες· Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ καὶ τὴν ὁδὸν τοῦ θεοῦ ἐν ἀληθείᾳ διδάσκεις, καὶ οὐ μέλει σοι περὶ οὐδενός, οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/016.yaml
  text: And they send to him their disciples along with the Herodians[a], saying, “Teacher, we know that you are true and teach the way of God in truth, and you do not care about anyone[b], for you do not look at the face of men.”
translation:
  language: uk
  text: 'І вони посилають до нього своїх учнів разом з іродіанами[a] й кажуть: «Учителю, ми знаємо, що ти правдивий і правдиво навчаєш Божого шляху. Ти ні на кого не зважаєш, бо не робиш різниці між людьми[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Іродіани — ймовірно, прихильники династії Ірода.
    reason: Коротко пояснює назву історичної групи, не стверджуючи більшого, ніж дозволяють джерела.
  - marker: b
    text: 'Буквально: «не дивишся на обличчя людей»; тобто не ставишся до людей упереджено через їхнє становище або зовнішні ознаки.'
    reason: Передає буквальний образ грецької ідіоми та пояснює її значення в контексті.
lexical_decisions:
- source_word: ἀποστέλλουσιν
  choice: посилають
  rationale: Збережено грецький історичний теперішній час; в українській оповіді він зрозумілий і додає сцені безпосередності.
- source_word: μαθητὰς
  choice: учнів
  rationale: Звичний євангельський відповідник, який охоплює і учнівство, і належність до кола послідовників.
- source_word: μετὰ τῶν Ἡρῳδιανῶν
  choice: разом з іродіанами
  rationale: Природно передає спільну участь двох груп; назву історичної групи збережено транслітерацією.
- source_word: Διδάσκαλε
  choice: Учителю
  rationale: Прямий і природний український відповідник звертання до того, хто навчає.
- source_word: ἀληθὴς
  choice: правдивий
  rationale: Передає характеристику особи як щирої та вірної правді, не звужуючи вислів лише до правильності окремих слів.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: Божого шляху
  rationale: Зберігає біблійну метафору шляху як Божої волі та способу життя.
- source_word: ἐν ἀληθείᾳ
  choice: правдиво
  rationale: Природний український прислівниковий відповідник, який передає навчання відповідно до правди без неприродного калькування «в істині».
- source_word: οὐ μέλει σοι περὶ οὐδενός
  choice: Ти ні на кого не зважаєш
  rationale: 'Передає контекстуальний сенс: Ісус не дозволяє чиємусь впливові, думці або становищу визначати його слова. Формулювання не приписує йому загальної байдужості до людей.'
- source_word: οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων
  choice: бо не дивишся, хто перед тобою
  rationale: Природний український ідіоматичний вислів про неупередженість, який водночас зберігає образ бачення людини перед собою; буквальну форму подано в примітці.
theological_decisions:
- issue: Неупередженість Ісуса щодо людського статусу
  choice: 'Передано ідіоматично: «не дивишся, хто перед тобою».'
  alternative: «не дивишся на обличчя людей»; «не зважаєш на становище людей»; «не виявляєш упередженості до людей».
  rationale: Грецький образ обличчя означає, що особу не оцінюють інакше через її становище чи зовнішні ознаки. Основний текст має бути зрозумілим сучасному читачеві, а примітка зберігає доступ до буквальної форми й широти значення.
- issue: Зміст вислову οὐ μέλει σοι περὶ οὐδενός
  choice: «Ти ні на кого не зважаєш».
  alternative: «Тобі немає діла ні до кого»; «Тобі байдуже до всіх»; «Ти не дбаєш про думку жодної людини».
  rationale: У цьому контексті йдеться не про брак любові чи турботи, а про незалежність від людського впливу. Обране формулювання зберігає цю напругу, не додаючи прямо відсутнього в грецькому тексті слова «думка».
translation_notes:
  register: Сучасна стандартна українська мова, природний і водночас гідний оповідний стиль. Займенники щодо Ісуса подано з малої літери, відповідно до звичайної української граматики та без внесення конфесійної редакційної практики. Синтаксис дещо розвантажено поділом довгої грецької репліки на два речення.
