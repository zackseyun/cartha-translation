review_pass:
  verdict: approve
  source_fidelity: «Тоді фарисеї пішли й радилися, як би їм упіймати Його на слові» точно передає послідовність Τότε, рух у πορευθέντες, нараду у συμβούλιον ἔλαβον та мету, виражену ὅπως... παγιδεύσωσιν. Ідіом «упіймати на слові» доречно відтворює образ «зловити в вислові/мовленні» (ἐν λόγῳ), не вносячи додаткового змісту.
  naturalness: Текст звучить природно для сучасної стандартної української. Сполука «пішли й радилися» є плавною наративною передачею грецького дієприкметника з головним дієсловом, а «як би їм» стилістично доречне в біблійному, але не архаїчному регістрі.
  terminology: «Фарисеї» — усталена назва; шанобливе «Його» відповідає прийнятій українській біблійній орфографічній практиці. «Радилися» зберігає нейтральний характер συμβούλιον ἔλαβον, тоді як ворожий намір достатньо виражено дієсловом «упіймати». Примітка коректно подає прозорішу альтернативу та не нав’язує спірного тлумачення.
