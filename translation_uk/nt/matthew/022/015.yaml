  text: Τότε πορευθέντες οἱ Φαρισαῖοι συμβούλιον ἔλαβον ὅπως αὐτὸν παγιδεύσωσιν ἐν λόγῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/015.yaml
  text: Then the Pharisees went and took counsel how they might trap him in his words[a].
translation:
  language: uk
  text: Тоді фарисеї пішли й радилися, як би їм упіймати Його на слові[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «замислили, як упіймати Його через те, що Він скаже».'
    reason: Лексико-синтаксична альтернатива для συμβούλιον ἔλαβον та ἐν λόγῳ.
lexical_decisions:
- source_word: Τότε
  choice: Тоді
  rationale: Природно й стисло позначає наступний момент у розповіді.
- source_word: πορευθέντες
  choice: пішли
  rationale: Аористовий дієприкметник перед головним дієсловом природно передано особовою формою, що виражає попередню дію.
- source_word: οἱ Φαρισαῖοι
  choice: фарисеї
  rationale: Усталена українська назва цієї релігійної групи; означений артикль окремо не відтворюється, оскільки українська мова його не має.
- source_word: συμβούλιον ἔλαβον
  choice: радилися
  rationale: Природно передає грецький ідіоматичний вислів про спільне обмірковування плану, не додаючи в сам вислів ворожості, яку вже ясно виражає мета.
- source_word: ὅπως
  choice: як би
  rationale: Після «радилися» природно вводить зміст обговорення та водночас зберігає відтінок мети.
- source_word: αὐτὸν
  choice: Його
  rationale: Займенник стосується Ісуса; вжито традиційне шанобливе написання з великої літери.
- source_word: παγιδεύσωσιν
  choice: упіймати
  rationale: У сполученні «упіймати на слові» ясно й сучасно передає метафору пастки.
- source_word: ἐν λόγῳ
  choice: на слові
  rationale: Природний український ідіом означає викрити або поставити когось у скрутне становище через сказане ним; можливе ширше тлумачення подано в примітці.
theological_decisions:
- issue: Ступінь ворожості у вислові συμβούλιον ἔλαβον
  choice: Передати нейтральніше як «радилися», залишивши злий намір у фразі «упіймати Його на слові».
  alternative: «змовилися» або «замислили»
  rationale: Грецький текст безсумнівно описує ворожий задум, але його мету прямо виражає παγιδεύσωσιν. Нейтральніше відтворення самого ідіому не перевантажує його додатковим тлумаченням.
- issue: Спосіб пастки у вислові ἐν λόγῳ
  choice: «на слові»
  alternative: «через те, що Він скаже»
  rationale: Український ідіом стисло відтворює задум використати висловлювання Ісуса проти Нього, а примітка зберігає прозоріше формулювання можливої синтаксичної нюансованості.
translation_notes:
  register: Сучасна стандартна українська; виклад природний, стислий і гідний. Ідіом «упіймати на слові» зрозумілий широкому колу читачів, а примітка уточнює буквальніше значення.
