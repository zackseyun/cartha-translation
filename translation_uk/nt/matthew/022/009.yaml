    reason: lexical_alternative
lexical_decisions:
- source_word: πορεύεσθε
  choice: ідіть
  rationale: Теперішній наказовий спосіб має пряму спонукальну силу; «ідіть» природно й точно передає наказ у сучасній українській.
- source_word: οὖν
  choice: тож
  rationale: Слово позначає висновок або наслідок із попередніх слів; «тож» стисло й природно зберігає цей логічний зв’язок.
- source_word: ἐπὶ τὰς διεξόδους τῶν ὁδῶν
  choice: на перехрестя доріг
  rationale: διέξοδοι буквально може означати виходи або місця розгалуження доріг; у цьому контексті «перехрестя доріг» зрозуміло передає публічні місця, де дороги сходяться чи розходяться, не звужуючи образ до сучасних міських вулиць.
- source_word: ὅσους ἐὰν εὕρητε
  choice: всіх, кого знайдете
  rationale: Конструкція виражає невизначеність і широту охоплення. «Всіх, кого знайдете» природно передає кількісний відтінок ὅσους та відкритість умови з ἐάν.
- source_word: καλέσατε
  choice: запросіть
  rationale: У контексті весільної гостини καλέω означає запросити, а не просто покликати чи викликати.
- source_word: εἰς τοὺς γάμους
  choice: на весільний бенкет
  rationale: Множина γάμοι тут позначає весільне святкування або гостину, а не кілька весіль. «Весільний бенкет» чітко передає бенкетний контекст притчі.
