    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡμοιώθη
  choice: було уподібнене до
  rationale: Аорист пасивного стану від ὁμοιόω буквально виражає уподібнення в минулому часі. Такий переклад зберігає граматичну форму, не додаючи модального значення «можна уподібнити».
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Небесне Царство
  rationale: Усталений і природний український відповідник характерного для Матвія вислову; він не підмінює «небеса» словом «Бог» і лишає відкритими відтінки царювання та царства.
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: до царя
  rationale: Сполука ἄνθρωπος + βασιλεύς тут природно означає людину, яка була царем. Українське «до чоловіка-царя» було б неприродним і могло б хибно наголосити стать чи протиставлення божественному цареві.
- source_word: ὅστις
  choice: який
  rationale: Природний український відносний займенник без надмірного підсилення.
- source_word: ἐποίησεν γάμους
  choice: справив весілля
  rationale: Український ідіоматичний вислів для влаштування весільних урочистостей; він передає ποιέω з множиною γάμοι без буквального й неприродного «зробив весілля».
- source_word: τῷ υἱῷ αὐτοῦ
  choice: для свого сина
  rationale: Передає давальний відмінок зацікавленої особи й рефлексивну належність природною українською мовою.
theological_decisions:
- issue: Значення вислову «ἡ βασιλεία τῶν οὐρανῶν»
  choice: Збережено Матвіїв вислів «Небесне Царство» без богословської заміни.
  alternative: Боже Царство; небесне царювання
  rationale: Переклад не гармонізує авторське формулювання з іншими Євангеліями й не звужує його лише до території або лише до дії царювання.
- issue: Час і спосіб формули уподібнення
  choice: було уподібнене
  alternative: можна уподібнити; подібне
  rationale: Збережено аорист індикатива пасивного стану й не внесено модальності, якої граматична форма прямо не виражає.
translation_notes:
  register: Сучасна, гідна й загальнозрозуміла українська мова. «Справив весілля» звучить природно та передає святкову подію; пасивне «було уподібнене» свідомо збережено для відповідності грецькій формі.
