    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: багато
  rationale: Субстантивований прикметник означає «багато (людей)»; стислий відповідник зберігає протиставлення до ὀλίγοι.
- source_word: γάρ
  choice: бо
  rationale: Сполучник вводить пояснення до попередньої думки притчі; «бо» природно й стисло передає цей зв’язок.
- source_word: εἰσιν
  choice: не виражено окремим словом
  rationale: У сучасній українській мові зв’язку «є» в такому реченні природно опускати; теперішній час зберігається нульовою зв’язкою.
- source_word: κλητοὶ
  choice: покликаних
  rationale: Передає основне значення «покликані» та зберігає ширший смисловий і богословський відтінок; у контексті весільного бенкету можливе також «запрошених».
- source_word: ὀλίγοι
  choice: мало
  rationale: Природний український відповідник у симетричній конструкції «багато… мало», що зберігає лаконічну антитезу.
- source_word: δὲ
  choice: та
  rationale: У цій короткій сентенції «та» природно передає контраст між двома частинами, не послаблюючи його.
- source_word: ἐκλεκτοί
  choice: вибраних
  rationale: Прозоро передає значення «вибрані» без нав’язування пізнішої конфесійної термінології; традиційний варіант «обраних» подано у примітці.
theological_decisions:
- issue: Передача ἐκλεκτοί у вислові, пов’язаному з ученням про обрання
  choice: вибраних
  alternative: обраних
  rationale: Обидва варіанти можливі. «Вибраних» прямо передає лексичний зміст і не розв’язує богословської напруги на користь певної доктринальної системи; традиційний термін наведено у примітці.
- issue: Передача κλητοί у контексті притчі про весільний бенкет
  choice: покликаних
  alternative: запрошених
  rationale: «Запрошених» добре відповідає безпосередньому образу бенкету, але «покликаних» зберігає ширший діапазон грецького слова та його контраст із ἐκλεκτοί. Контекстуальну альтернативу подано у примітці.
translation_notes:
  register: Сучасна літературна українська, лаконічний і гідний афористичний стиль. Порядок слів та паралелізм «багато… та мало…» відтворюють стисле протиставлення грецького тексту.
