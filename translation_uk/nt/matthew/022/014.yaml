  text: For many are called[b][a], but few are chosen.
translation:
  language: uk
  text: Бо багато покликаних[a], та мало вибраних[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «запрошених»; у контексті весільного бенкету слово може означати запрошених на бенкет.'
