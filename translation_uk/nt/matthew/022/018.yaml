  source_fidelity: 'Текст точно передає грецький зміст: γνοὺς — «знаючи», τὴν πονηρίαν αὐτῶν — «їхній злий намір», а Τί με πειράζετε — природне українське «Чому ви випробовуєте Мене». Звертання «лицеміри» точно відповідає ὑποκριταί. Неоднозначність πειράζω належно збережена у примітці.'
