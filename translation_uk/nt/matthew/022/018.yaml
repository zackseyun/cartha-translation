  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς τὴν πονηρίαν αὐτῶν εἶπεν· Τί με πειράζετε, ὑποκριταί;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/018.yaml
  text: But Jesus[a], knowing their evil intent, said, “Why are you testing me[b], hypocrites?”
translation:
  language: uk
  text: 'Але Ісус, знаючи їхній злий намір[a], сказав: «Чому ви випробовуєте Мене[b], лицеміри?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «їхню зловмисність», або «їхнє зло».
    reason: lexical_alternative
  - marker: b
    text: Або «спокушаєте Мене?» Грецьке дієслово може означати «випробовувати», «перевіряти» або «спокушати» — залежно від контексту.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: знаючи
  rationale: Аористовий дієприкметник від γινώσκω передає обізнаність Ісуса щодо прихованого мотиву співрозмовників і природно поєднується з головним дієсловом.
- source_word: δὲ
  choice: Але
  rationale: 'Частка δέ тут виражає помірне протиставлення: Ісус не приймає улесливих слів співрозмовників, а викриває їхній намір.'
- source_word: τὴν πονηρίαν αὐτῶν
  choice: їхній злий намір
  rationale: πονηρία означає зло, нечестивість або зловмисність; у цьому контексті йдеться про злий мотив, що стояв за поставленим запитанням.
- source_word: εἶπεν
  choice: сказав
  rationale: Природний і точний відповідник стандартного оповідного вживання аориста λέγω.
- source_word: Τί
  choice: Чому
  rationale: У цій питальній конструкції τί має значення причини, тож українське «чому» передає грецьку ідіому природно.
- source_word: πειράζετε
  choice: випробовуєте
  rationale: πειράζω може означати «випробовувати», «перевіряти» або «спокушати». «Випробовуєте» зберігає широту дієслова та відповідає спробі поставити Ісуса в пастку.
- source_word: ὑποκριταί
  choice: лицеміри
  rationale: Усталений і контекстуально точний відповідник для людей, які вдають щирість, приховуючи ворожий задум.
theological_decisions:
- issue: Опис того, як Ісус розпізнав прихований мотив супротивників
  choice: Ісус знав їхній злий намір.
  alternative: Ісус розпізнав їхню зловмисність / знав їхнє зло.
  rationale: Формулювання зберігає твердження тексту про точне знання Ісусом морально злого задуму, але не розширює його до доктринального висновку, якого сам вірш прямо не висловлює.
- issue: Значення πειράζετε у зверненні до Ісуса
  choice: «випробовуєте Мене»
  alternative: «спокушаєте Мене» або «перевіряєте Мене»
  rationale: Контекст указує на ворожу перевірку з наміром упіймати Ісуса на слові. «Випробовуєте» зберігає цю напругу й не звужує значення лише до моральної спокуси.
translation_notes:
  register: Сучасна стандартна українська мова; виклад природний і гідний. «Злий намір» прояснює контекстуальне значення πονηρία, а примітка зберігає ширші лексичні можливості. Займенник «Мене» написано з великої літери за поширеною українською біблійною традицією.
