  text: If[a], then, David calls him Lord, how is he his son?
translation:
  language: uk
  text: Отже, якщо Давид називає Його[a] Господом, то як Він — його син?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або, із виразним уточненням із контексту: «Отже, якщо Давид називає Месію Господом, то як Він — його син?»'
    reason: Альтернативне, контекстуально уточнене формулювання референта займенника.
lexical_decisions:
- source_word: εἰ οὖν
  choice: Отже, якщо
  rationale: Зберігає умовну силу εἰ та висновковий зв’язок οὖν, природно передаючи хід аргументації українською.
- source_word: Δαυὶδ
  choice: Давид
  rationale: Усталена українська форма особового імені.
- source_word: καλεῖ
  choice: називає
  rationale: Передає значення «називає, іменує» й зберігає предикативний відтінок, важливий для цитати з Псалма 110:1.
- source_word: αὐτὸν
  choice: Його
  rationale: Займенник відсилає до особи, згаданої в попередньому контексті; написання з великої літери відповідає сучасній українській біблійній практиці щодо Христа, не додаючи іменника до тексту.
- source_word: κύριον
  choice: Господом
  rationale: Усталений відповідник κύριος, який зберігає почесний і христологічно вагомий зміст та відлуння Псалма 110:1.
- source_word: πῶς
  choice: як
  rationale: Прямо й природно вводить запитання про логічний зв’язок.
- source_word: υἱὸς αὐτοῦ
  choice: його сином
  rationale: Зберігає буквальний родинний і царсько-месіанський образ «сина», не звужуючи й не пояснюючи його як «нащадка».
- source_word: ἐστιν
  choice: є
  rationale: Безпосередньо передає теперішню зв’язку та допомагає зберегти гостроту риторичного питання.
theological_decisions:
- issue: Месіанський і христологічний зміст того, що Давид називає цю особу Господом
  choice: У головному тексті збережено «Господом» і «його сином» без додавання слова «Месія».
  alternative: «Якщо ж Давид називає Месію Господом, то як Він може бути Давидовим сином?»
  rationale: Грецький текст цього вірша має займенники, а їхній референт випливає з попереднього контексту. Нез’ясована напруга між Давидовим синівством і вищим становищем Господа є частиною самого запитання, тому переклад її не розв’язує.
translation_notes:
  register: Сучасна нормативна українська мова, урочиста, але зрозуміла. Порядок «Отже, якщо… то як…» природно відтворює умовно-висновкову структуру. Займенники щодо Христа подано з великої літери; присвійний «його» залишено з малої, оскільки він стосується Давида.
