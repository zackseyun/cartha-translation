base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/026.yaml
  text: But his master answered and said to him[a], ‘Wicked and lazy servant[b], you knew that I reap where I did not sow and gather where I did not scatter?
translation:
  language: uk
  text: 'А його пан відповів йому: «Злий і лінивий рабе[a], ти ж знав, що я жну там, де не сіяв, і збираю там, де не розсипав[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «слуго». Грецьке слово δοῦλος залежно від контексту може означати «раба» або «слугу».'
    reason: lexical_alternative
  - marker: b
    text: 'Ці слова можна прочитати і як твердження: «Ти знав, що я жну там, де не сіяв, і збираю там, де не розсипав».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: А ... відповів
  rationale: Дієприкметникова оповідна формула з δέ природно передається українською особовою формою; «а» позначає перехід і легке протиставлення.
- source_word: ὁ κύριος αὐτοῦ
  choice: його пан
  rationale: У контексті притчі κύριος означає пана раба, а не безпосередньо христологічний титул «Господь».
- source_word: Πονηρὲ
  choice: лукавий
  rationale: Передає морально негативну оцінку πονηρός у природній біблійній українській мові; йдеться не просто про погану якість.
- source_word: δοῦλε
  choice: рабе
  rationale: δοῦλος у соціальному контексті притчі позначає раба; українське «раб» прямо зберігає залежний статус, не пом’якшуючи його до найманого слуги.
- source_word: ὀκνηρέ
  choice: лінивий
  rationale: Сучасний і зрозумілий відповідник ὀκνηρός, що означає небажання діяти або лінощі.
- source_word: ᾔδεις
  choice: ти ж знав
  rationale: Форма від οἶδα означає наявне в минулому знання; частка «ж» природно підсилює риторичне повернення слів раба проти нього.
- source_word: θερίζω
  choice: жну
  rationale: Зберігає конкретний землеробський образ і природно співвідноситься з «сіяв».
- source_word: ὅπου οὐκ ἔσπειρα
  choice: там, де не сіяв
  rationale: Прямо й природно передає місцевий відносний зворот та аорист.
- source_word: συνάγω
  choice: збираю
  rationale: Природний відповідник у контексті збирання врожаю або плодів.
- source_word: ὅθεν οὐ διεσκόρπισα
  choice: там, де не розсипав
  rationale: Зберігає буквальний образ διασκορπίζω без додавання відсутнього в грецькому тексті слова «насіння»; українською еліпсис зрозумілий із землеробського контексту.
theological_decisions:
- issue: Сила заключних слів і пунктуація
  choice: 'Риторичне запитання: «Ти ж знав...?»'
  alternative: 'Твердження: «Ти знав, що я жну... і збираю...»'
  rationale: Грецький текст не містить знака пунктуації й допускає обидва прочитання. Запитання добре відповідає іронічній аргументації пана, який обертає слова раба проти нього, але альтернативу слід зберегти у примітці.
- issue: Чи пан підтверджує характеристику, дану рабом
  choice: Не пояснювати в перекладі, чи слова є буквальним самовизнанням пана, чи риторичним повторенням твердження раба
  alternative: Явно подати слова як фактичне самовизнання або як суто іронічну цитату
  rationale: Оригінал залишає цю напругу в межах риторичної відповіді; переклад не повинен доктринально її розв’язувати.
translation_notes:
  register: Сучасна стандартна українська з гідним оповідним тоном. Збережено землеробську образність, соціальну силу δοῦλος і неоднозначність між риторичним запитанням та твердженням. Усі маркери приміток наявні в основному тексті.
