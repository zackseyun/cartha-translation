review_pass:
  verdict: revise
  source_fidelity: 'Зміст загалом точно передано: κύριος у притчі доречно передано як «пан», δοῦλος — як «раб», а фінальне речення збережено як риторичне запитання з приміткою про можливе стверджувальне прочитання. Проте «лукавий» у сучасній українській частіше акцентує хитрість, тоді як πονηρός тут є моральним осудом («злий»). Окличний знак після звертання також не відповідає синтаксису грецького речення, де звертання безперервно переходить до запитання.'
  naturalness: «Злий і лінивий рабе» є природним, сучасним і водночас урочистим формулюванням. Кома після звертання, а не окличний знак, краще передає одне риторичне запитання. «Розсипав» можна зберегти як стислий землеробський еліпсис, не додаючи слова «насіння», якого в грецькому тексті немає.
  terminology: «Пан» і «раб» послідовно передають соціальні ролі притчі без христологічного навантаження на κύριος і без пом’якшення δοῦλος. Примітку щодо δοῦλος слід сформулювати нейтрально, без оцінного «м’якше».
  issues:
  - severity: medium
    issue: «Лукавий» звужує значення πονηρός.
    rationale: У сучасній стандартній українській «лукавий» переважно означає хитрий, підступний; πονηρός у цьому докорі має ширшу й насамперед морально негативну силу. «Злий» точніше й природніше.
  - severity: low
    issue: Окличний знак після «рабе» штучно розриває грецьке речення.
    rationale: Оригінал має звертання, після якого одразу йде зміст того, що раб нібито знав, а завершальним знаком є питання. Кома зберігає цю синтаксичну й риторичну єдність.
  - severity: low
    issue: Примітка a містить оцінне формулювання «м’якше».
    rationale: Примітка має фіксувати лексичну альтернативу, а не характеризувати її як пом’якшення; вибір залежить від контексту й перекладацької стратегії.
