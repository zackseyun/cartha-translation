source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ κύριος αὐτοῦ· Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/023.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will put you over many things. Enter into the joy of your master.’
translation:
  language: uk
  text: 'Його пан сказав йому: «Добре, добрий і вірний слуго! Ти був вірний над небагатьма; над багатьма тебе поставлю. Увійди в радість свого пана».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφη
  choice: сказав
  rationale: Природний сучасний відповідник для введення прямої мови; точно передає звичайне наративне вживання φημί.
- source_word: κύριος
  choice: пан
  rationale: У межах притчі йдеться про пана слуги. «Пан» природно передає владні стосунки, не перетворюючи слово на прямий божественний титул.
- source_word: δοῦλε
  choice: слуго
  rationale: Кличний відмінок зберігає пряме звертання. «Слуга» природне в цьому контексті управління дорученим майном; значення «раб» подано у примітці.
- source_word: Εὖ
  choice: Гаразд
  rationale: Передає схвальну оцінку господаря як природний український вигук похвали, без додавання відсутнього в грецькому тексті дієслова.
- source_word: ἀγαθὲ καὶ πιστέ
  choice: добрий і вірний
  rationale: Зберігає обидві характеристики та лексичний зв’язок πιστέ з наступним πιστός.
- source_word: ἐπὶ ὀλίγα
  choice: у малому
  rationale: Стислий природний український вислів, що позначає обмежений обсяг довіреної відповідальності й зберігає контраст із «великим».
- source_word: πιστός
  choice: вірний
  rationale: Зберігає повтор кореня й акцент на доведеній надійності слуги.
- source_word: ἐπὶ πολλῶν
  choice: над великим
  rationale: Передає розширену сферу відповідальності та формує природний український контраст «у малому — над великим»; грецька форма допускає розуміння як багатьох або значних речей.
- source_word: καταστήσω
  choice: поставлю
  rationale: У сполученні «поставлю над» природно означає призначення до ширшої відповідальності.
- source_word: εἴσελθε εἰς τὴν χαρὰν
  choice: Увійди в радість
  rationale: Зберігає просторову метафору грецького наказу, не звужуючи її до пояснювального «розділи радість».
- source_word: τοῦ κυρίου σου
  choice: свого пана
  rationale: Зворот із «свого» природний українською і точно відносить пана до адресата.
theological_decisions:
- issue: Передача κύριος у притчі про людського господаря
  choice: пан
  alternative: Господь
  rationale: Безпосередній персонаж оповіді — людський пан слуги. Такий переклад не заперечує богословського застосування притчі, але й не вносить титульне «Господь» у саму сюжетну площину.
- issue: Передача δοῦλος у цьому контексті
  choice: слуга
  alternative: раб
  rationale: У вірші на першому плані вірність у виконанні доручення. «Слуга» звучить природно, тоді як сильніше соціально-правове значення «раб» збережено в примітці.
- issue: Зміст вислову εἴσελθε εἰς τὴν χαρὰν
  choice: Увійди в радість
  alternative: Розділи радість
  rationale: Буквально-образна конструкція лишається відкритою щодо того, чи йдеться про участь у радості, святкуванні або ширшій нагороді; переклад не усуває цієї образної багатозначності.
translation_notes:
  register: Сучасна нормативна українська, гідний і доступний оповідний стиль. Збережено урочистість прямої мови, повтор «вірний» і метафору входження в радість. Кличний «слуго» відповідає живій українській граматиці.
