review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the speaker, direct address, the repeated πιστός concept, appointment to greater responsibility, and the metaphor of entering the master's joy. However, «Гаразд» is less apt for εὖ as a formula of personal commendation, and «у малому — над великим» changes the explicit few/many contrast to a small/great contrast.
  naturalness: The Ukrainian is generally fluent and appropriately dignified. «Добре» is the established and natural commendatory equivalent in this construction. «Над багатьма» is clear, idiomatic Ukrainian and better reflects the Greek plural contrast.
  terminology: «Пан» appropriately renders κύριος within the parable, while «слуга» is a defensible contextual rendering of δοῦλος. The alternative «раб» should remain footnoted. «Вірний» correctly preserves the repetition of πιστός.
  issues:
  - severity: medium
    issue: «Гаразд» for Εὖ
    rationale: In direct commendation, «Добре» is the more natural Ukrainian equivalent of «Well done»/εὖ. «Гаразд» more commonly signals agreement, acceptance, or procedural adequacy and weakens the personal praise.
  - severity: medium
    issue: «У малому ... над великим» for ἐπὶ ὀλίγα ... ἐπὶ πολλῶν
    rationale: The Greek contrasts few things with many things (both plural), not simply lesser with greater matters. «Над небагатьма ... над багатьма» retains this explicit contrast without importing a qualitative sense.
  revised_text: 'Його пан сказав йому: «Добре, добрий і вірний слуго! Ти був вірний над небагатьма; над багатьма тебе поставлю. Увійди в радість свого пана».'
  revised_footnotes:
  - marker: a
    text: Або «рабе». Грецьке слово δοῦλος залежно від контексту може означати слугу або раба.
    reason: alternative_reading
  revision_rationale: The revision strengthens the idiomatic force of the master's commendation and restores the source text's few/many contrast. It retains the parabolic «пан», the vocative «слуго», the lexical repetition «вірний», and the source's open metaphor «увійди в радість».
