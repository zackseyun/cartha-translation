- from: 'Його пан сказав йому: «Гаразд, добрий і вірний слуго[a]! У малому ти був вірний — над великим тебе поставлю. Увійди в радість свого пана».'
  to: 'Його пан сказав йому: «Добре, добрий і вірний слуго! Ти був вірний над небагатьма; над багатьма тебе поставлю. Увійди в радість свого пана».'
  rationale: The revision strengthens the idiomatic force of the master's commendation and restores the source text's few/many contrast. It retains the parabolic «пан», the vocative «слуго», the lexical repetition «вірний», and the source's open metaphor «увійди в радість».
