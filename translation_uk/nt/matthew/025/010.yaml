base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/010.yaml
  text: But while they were going away to buy[a], the bridegroom came, and those who were ready went in with him to the wedding feast, and the door was shut.
translation:
  language: uk
  text: Та коли вони пішли купувати, прийшов наречений. Ті, що були готові, увійшли з ним на весільний бенкет[a], і двері зачинилися.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «на весільне святкування» чи просто «на весілля». Грецька форма множини може означати весільне святкування загалом.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπερχομένων δὲ αὐτῶν ἀγοράσαι
  choice: Та поки вони ходили купувати
  rationale: Родовий абсолют передає одночасну дію, а інфінітив ἀγοράσαι — її мету. «Ходили купувати» природно звучить українською, зберігає відтінок відходу й не додає прямо не названого тут предмета купівлі.
- source_word: ὁ νυμφίος
  choice: наречений
  rationale: Звичайний сучасний український відповідник для чоловіка в контексті весілля; він зберігає образ притчі без внесення тлумачення в основний текст.
- source_word: αἱ ἕτοιμοι
  choice: ті, що були готові
  rationale: Прикметник жіночого роду вжито субстантивовано щодо готових дів; ця конструкція природна українською і точно передає зміст.
- source_word: εἰσῆλθον μετ’ αὐτοῦ
  choice: увійшли з ним
  rationale: Стислий і точний відповідник, який передає завершену оповідну дію.
- source_word: εἰς τοὺς γάμους
  choice: на весільний бенкет
  rationale: Формально множинне γάμοι тут означає весільне святкування або бенкет. «Весільний бенкет» ясно передає подію сучасному читачеві; ширші можливості наведено у примітці.
- source_word: ἐκλείσθη ἡ θύρα
  choice: двері зачинилися
  rationale: Українське «двері» нормативно вживається у множині. Зворотна форма природно передає грецький пасив без уточнення виконавця та зберігає остаточність сцени.
theological_decisions:
- issue: Передача весільних образів у притчі
  choice: Зберегти звичайні оповідні образи «наречений» і «весільний бенкет», не роблячи приховане христологічне тлумачення явним у перекладі.
  alternative: Уточнити в основному тексті символічне значення нареченого або передати γάμοι просто як «весілля».
  rationale: Богословський зміст має випливати з самої притчі та її контексту. Такий переклад зберігає образність і напружену остаточність сцени, не додаючи конфесійного пояснення.
translation_notes:
  register: Сучасна стандартна українська мова; виклад природний, стислий і гідний. Поділ на два речення полегшує читання, не змінюючи синтаксичних зв’язків і послідовності грецького тексту. Маркер примітки поставлено після «весільний бенкет», оскільки її зміст стосується εἰς τοὺς γάμους.
