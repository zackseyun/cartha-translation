base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/011.yaml
  text: Later[a], the other virgins also come, saying, ‘Lord, lord[c][b], open to us.’
translation:
  language: uk
  text: 'Згодом приходять і решта дів та кажуть: «Господи, Господи, відчини нам!»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: У грецькому тексті сказано просто «відчини нам»; із контексту зрозуміло, що йдеться про двері.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: пізніше
  rationale: Часовий прислівник позначає наступну подію; «пізніше» природно й точно передає послідовність.
- source_word: δὲ
  choice: А
  rationale: М’який сполучник позначає перехід у розповіді; українське «А» природно пов’язує цю подію з попередньою.
- source_word: ἔρχονται
  choice: приходять
  rationale: Теперішній час у жвавій оповіді збережено українським теперішнім «приходять».
- source_word: καὶ
  choice: також
  rationale: 'Передає додаткове значення: ці діви теж приходять.'
- source_word: αἱ λοιπαὶ παρθένοι
  choice: інші діви
  rationale: λοιπαί може означати «інші» або «решта»; «інші діви» природне в контексті двох груп і не додає тлумачення.
- source_word: λέγουσαι
  choice: й кажуть
  rationale: Українська сурядна конструкція природніше за буквальний дієприкметник передає одночасну дію.
- source_word: Κύριε κύριε
  choice: Господи, Господи
  rationale: Кличний відмінок і повтор зберігають наполегливість звернення та можливу богословську вагу κύριος.
- source_word: ἄνοιξον ἡμῖν
  choice: відчини нам
  rationale: Наказова форма й давальний займенник передані стисло; об’єкт «двері» зрозумілий із контексту, але в грецькому тексті не названий.
theological_decisions:
- issue: Передача κύριος у прямому звертанні
  choice: Господи
  alternative: пане / господарю
  rationale: «Господи» зберігає як шанобливе звертання в межах притчі, так і ширший богословський відтінок у Матвія, не усуваючи цієї напруги.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська оповідна мова. Збережено історичний теперішній час і повтор у звертанні; неявний у грецькому тексті об’єкт не додано.
