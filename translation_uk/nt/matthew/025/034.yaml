source:
  edition: SBLGNT
  text: τότε ἐρεῖ ὁ βασιλεὺς τοῖς ἐκ δεξιῶν αὐτοῦ· Δεῦτε, οἱ εὐλογημένοι τοῦ πατρός μου, κληρονομήσατε τὴν ἡτοιμασμένην ὑμῖν βασιλείαν ἀπὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/034.yaml
  text: Then the King will say to those on his right[a], ‘Come, you who are blessed by my Father[b], inherit the kingdom prepared for you from the foundation of the world.’
translation:
  language: uk
  text: 'Тоді Цар скаже тим, хто праворуч від Нього: «Прийдіть, благословенні Моїм Отцем[a], успадкуйте Царство, приготоване для вас від заснування світу[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальніше: «благословенні Мого Отця».'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «від часу заснування світу» чи «відтоді, як було засновано світ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Тоді
  rationale: Природно передає часову послідовність у сцені суду.
- source_word: ἐρεῖ
  choice: скаже
  rationale: Звичний і точний відповідник майбутнього часу дієслова λέγω у формулі введення прямої мови.
- source_word: ὁ βασιλεὺς
  choice: Цар
  rationale: У контексті це означений титул есхатологічного Судді; велика літера вказує на конкретну особу, не додаючи нового титулу.
- source_word: τοῖς ἐκ δεξιῶν αὐτοῦ
  choice: тим, хто праворуч від Нього
  rationale: Ясно передає просторове розташування групи праворуч від Царя та зберігає контекстуальний відтінок пошани.
- source_word: Δεῦτε
  choice: Прийдіть
  rationale: Передає наказовий заклик у природній для сучасної української формі множини.
- source_word: οἱ εὐλογημένοι τοῦ πατρός μου
  choice: благословенні Моїм Отцем
  rationale: Дієприкметник зберігає пасивний зміст, а орудний відмінок природно виражає Отця як джерело або діяча благословення; буквальнішу форму подано в примітці.
- source_word: κληρονομήσατε
  choice: успадкуйте
  rationale: Зберігає образ спадщини та родинно-завітний відтінок, на відміну від загального «отримайте».
- source_word: τὴν ... βασιλείαν
  choice: Царство
  rationale: У поєднанні з успадкуванням і приготуванням ідеться про есхатологічне Царство; переклад не заперечує ширшого значення Божого царювання.
- source_word: ἡτοιμασμένην ὑμῖν
  choice: приготоване для вас
  rationale: Природно передає завершену пасивну дію з тривалим результатом.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: від заснування світу
  rationale: Близько відповідає ἀπό і зберігає усталений біблійний вислів про початок світу.
theological_decisions:
- issue: Значення родового відмінка в τοῦ πατρός μου
  choice: 'Передати джерело або діяча благословення: «благословенні Моїм Отцем».'
  alternative: 'Буквальніше: «благословенні Мого Отця».'
  rationale: Грецький родовий відмінок природно вказує, від кого походить благословення. Основний варіант ясний сучасному читачеві, а примітка зберігає формальну будову оригіналу.
- issue: Значення βασιλεία в контексті есхатологічної спадщини
  choice: Царство
  alternative: царювання
  rationale: Дієслово «успадкуйте» і означення «приготоване для вас» підтримують значення успадкованого есхатологічного Царства, не усуваючи поняття Божого правління.
- issue: Синтаксичний зв’язок ἀπὸ καταβολῆς κόσμου
  choice: Пов’язати з «приготоване для вас».
  alternative: Розуміти як ширше часове означення всього запрошення.
  rationale: 'Найближчим і найприроднішим синтаксичним зв’язком є дієприкметник ἡτοιμασμένην: Царство приготоване від заснування світу.'
translation_notes:
  register: Сучасна, урочиста й загальнозрозуміла українська мова. Займенники щодо Царя та Отця написано з великої літери як редакційний знак пошани. Наказові форми «прийдіть» і «успадкуйте» зберігають урочистість прямої мови без архаїзації.
