  text: And these will go away into eternal punishment[a], but the righteous into eternal life.
translation:
  language: uk
  text: І ці підуть на вічне покарання[a], а праведні — у вічне життя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або, з наголосом на зв’язку слова αἰώνιος із «віком»: «покарання, що належить до віку» … «життя, що належить до віку». Значення цього прикметника в окремих контекстах є предметом дискусії, але тут те саме слово характеризує і «покарання», і «життя», тому переклад однаково передає його словом «вічне» в обох частинах.'
    reason: Лексична альтернатива та збереження паралелізму.
lexical_decisions:
- source_word: ἀπελεύσονται
  choice: підуть
  rationale: Майбутня форма ἀπέρχομαι передає відхід. «Підуть» природно звучить українською і не додає до тексту способу чи місця відходу.
- source_word: οὗτοι
  choice: ці
  rationale: Вказівний займенник стосується щойно описаної групи та стисло зберігає протиставлення з «праведними».
- source_word: κόλασιν
  choice: покарання
  rationale: У контексті остаточного суду κόλασις означає карний наслідок; «покарання» є ясним і нейтральним відповідником без додавання подробиць.
- source_word: αἰώνιον
  choice: вічне
  rationale: Той самий прикметник характеризує і покарання, і життя. Повторення «вічне» в обох частинах зберігає грецький паралелізм; можливий зв’язок слова з поняттям віку зазначено у примітці.
- source_word: δίκαιοι
  choice: праведні
  rationale: Субстантивований прикметник позначає людей, охарактеризованих як праведні. Це усталений, зрозумілий сучасний український відповідник.
- source_word: ζωὴν
  choice: життя
  rationale: Прямий і природний відповідник ζωή; контекст не вимагає розгортання значення.
- source_word: δὲ
  choice: а
  rationale: У цій симетричній конструкції «а» природно й виразно передає протиставлення двох груп та їхньої долі.
theological_decisions:
- issue: Передача αἰώνιον у паралельних висловах κόλασιν αἰώνιον і ζωὴν αἰώνιον
  choice: 'В обох частинах перекладено однаково: «вічне».'
  alternative: «Що належить до віку» або «вікове» в обох частинах.
  rationale: Однаковий грецький прикметник не дає перекладачеві підстав по-різному визначати тривалість або характер покарання і життя. Основний текст зберігає точну симетрію, а лексичну дискусію не приховано, а винесено до примітки.
translation_notes:
  register: Сучасна, стисла й гідна українська мова. Еліптична друга частина оригіналу збережена за допомогою тире; прийменник «у» перед «вічне життя» природно доповнює пропущене «підуть».
