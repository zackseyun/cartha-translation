  text: τότε ἀποκριθήσονται αὐτῷ οἱ δίκαιοι λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα καὶ ἐθρέψαμεν, ἢ διψῶντα καὶ ἐποτίσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/037.yaml
  text: Then the righteous will answer him[a], saying, ‘Lord, when did we see you hungry and feed you, or thirsty and give you drink?’
translation:
  language: uk
  text: 'Тоді праведні відповідатимуть йому: «Господи, коли ми бачили тебе голодним і нагодували тебе, або спраглим і напоїли тебе?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Тоді
  rationale: Природно й стисло передає часову послідовність у промові.
- source_word: ἀποκριθήσονται αὐτῷ
  choice: скажуть йому у відповідь
  rationale: Передає майбутню форму та значення відповіді природною сучасною українською мовою.
- source_word: οἱ δίκαιοι
  choice: праведні
  rationale: Субстантивований прикметник позначає людей, визнаних праведними в описаній сцені.
- source_word: λέγοντες
  choice: скажуть … у відповідь
  rationale: Значення дієприкметника природно поєднане з основним дієсловом без важкого буквального «кажучи».
- source_word: Κύριε
  choice: Господи
  rationale: Усталена клична форма, що зберігає шанобливе звертання та христологічний відтінок κύριος.
- source_word: πότε σε εἴδομεν
  choice: коли ми бачили тебе
  rationale: Прямо й природно відтворює часове питання та аорист εἴδομεν.
- source_word: πεινῶντα καὶ ἐθρέψαμεν
  choice: голодним і нагодували
  rationale: Передає стан особи та конкретну дію без зайвого розгортання.
- source_word: διψῶντα καὶ ἐποτίσαμεν
  choice: спраглим і напоїли
  rationale: «Напоїли» є точним, стислим і природним відповідником каузативного ἐποτίσαμεν.
theological_decisions:
- issue: Передача κύριος у прямому звертанні до Ісуса
  choice: Господи
  alternative: Учителю / Пане
  rationale: «Господи» зберігає як шанобливе звертання, так і можливе христологічне значення титулу, не звужуючи його до значення «учитель».
translation_notes:
  register: 'Сучасна літературна українська мова; виклад гідний, ясний і придатний для читання вголос. Синтаксис дещо згладжено: λέγοντες інтегровано у вислів «скажуть йому у відповідь». Примітку англійського консультаційного шару не перенесено, бо вона стосується суто англійського варіанта «give you drink» і не має змістової відповідності в українському тексті.'
