revisions:
- from: 'Тоді праведні скажуть йому у відповідь: «Господи, коли ми бачили тебе голодним і нагодували або спраглим і напоїли?»'
  to: 'Тоді праведні відповідатимуть йому: «Господи, коли ми бачили тебе голодним і нагодували тебе, або спраглим і напоїли тебе?»'
  rationale: Виправлено синтаксичну неясність шляхом повторення додатка «тебе» в обох сурядних частинах. Основне дієслово замінено на природніше «відповідатимуть», а всі змістові відповідники оригіналу та належний біблійний регістр збережено.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:25:05Z'
review_pass:
  verdict: revise
  source_fidelity: 'Зміст передано загалом точно: τότε — «Тоді», οἱ δίκαιοι — «праведні», Κύριε — «Господи», а паралельні дії годування й напування збережено. Проте в українському реченні пропущено сполучник «або» перед другим присудковим комплексом у спосіб, що створює синтаксичну неясність: «і нагодували або спраглим і напоїли». Грецьке ἢ чітко вводить альтернативну паралельну конструкцію.'
  naturalness: «Скажуть йому у відповідь» є зрозумілим, але дещо надлишковим, оскільки «відповідати» вже містить значення відповіді. «Відповідатимуть йому» природніше для сучасної літературної української. Після додавання «тебе» в другій частині паралелізм стає ясним і плавним.
  terminology: '«Праведні» та «Господи» доречні й відповідають установленому біблійному регістру. «Голодним», «спраглим», «нагодували», «напоїли» точно та природно передають відповідні грецькі форми. Примітка не потрібна: англійська примітка відображає лише англійську стилістичну альтернативу й не має окремого відповідника тут.'
  issues:
  - severity: medium
    issue: Неясна друга паралельна конструкція після «або».
    rationale: У тексті «...і нагодували або спраглим і напоїли» не повторено додаток «тебе», через що «спраглим» формально може сприйматися як залежне від «нагодували». Повторення «тебе» відновлює структуру πεινῶντα ... ἢ διψῶντα ... та усуває двозначність.
  - severity: low
    issue: Надлишкова конструкція «скажуть йому у відповідь».
    rationale: Вона не є помилкою, але «відповідатимуть йому» точніше й природніше відтворює ἀποκριθήσονται без семантичного дублювання.
  revised_text: 'Тоді праведні відповідатимуть йому: «Господи, коли ми бачили тебе голодним і нагодували тебе, або спраглим і напоїли тебе?»'
