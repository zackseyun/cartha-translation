  text: προσελθὼν δὲ καὶ ὁ τὸ ἓν τάλαντον εἰληφὼς εἶπεν· Κύριε, ἔγνων σε ὅτι σκληρὸς εἶ ἄνθρωπος, θερίζων ὅπου οὐκ ἔσπειρας καὶ συνάγων ὅθεν οὐ διεσκόρπισας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/024.yaml
  text: Then the one who had received the one talent also came and said[a], ‘Lord, I knew that you are a hard man[b], reaping where you did not sow and gathering where you did not scatter.’
translation:
  language: uk
  text: 'Тоді підійшов і той, хто одержав один талант, та сказав: «Господарю, я знав, що ти суворий чоловік[a]: жнеш там, де не сіяв, і збираєш звідти, де не розсипав[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «жорсткий чоловік». Грецьке слово може означати «твердий», «суворий» або «жорсткий».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «збираєш звідти, де не розсипав». Об’єкт дії, можливо зерно, у грецькому тексті не названий.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: підійшов
  rationale: Дієприкметник від προσέρχομαι передає наближення слуги перед його словами; «підійшов» природно звучить в українській оповіді.
- source_word: δὲ καὶ
  choice: Тоді ... і
  rationale: «Тоді» передає перехід до наступної дії, а «і» долучає цього слугу до тих, хто вже звітував.
- source_word: ὁ τὸ ἓν τάλαντον εἰληφὼς
  choice: той, хто одержав один талант
  rationale: Збережено означальну конструкцію та завершеність попереднього одержання; додавати слово «чоловік» немає потреби.
- source_word: τάλαντον
  choice: талант
  rationale: Збережено назву давньої вагової та грошової одиниці без звуження до конкретного металу чи сучасної суми.
- source_word: Κύριε
  choice: Господарю
  rationale: У межах притчі слуга безпосередньо звертається до свого господаря; українське «Господарю» ясно передає соціальне відношення, не додаючи тут окремого божественного титулу.
- source_word: ἔγνων σε ὅτι
  choice: я знав, що ти
  rationale: Українська конструкція природно передає заявлене слугою знання про характер господаря, не відтворюючи неприродного буквального «знав тебе, що».
- source_word: σκληρὸς ἄνθρωπος
  choice: сувора людина
  rationale: «Сувора» передає значення σκληρός у характеристиці особи, зберігаючи можливий відтінок жорсткості без надмірного посилення звинувачення.
- source_word: θερίζων ὅπου οὐκ ἔσπειρας
  choice: жнеш там, де не сіяв
  rationale: Збережено сільськогосподарський образ і паралель між жнивами та сівбою.
- source_word: συνάγων ὅθεν οὐ διεσκόρπισας
  choice: збираєш там, де не розсипав
  rationale: «Збираєш» і «розсипав» формально відтворюють дієслова джерела; об’єкт у грецькому тексті не названо, тому його не додано до основного тексту.
theological_decisions:
- issue: Передача κύριος у звертанні всередині притчі
  choice: Господарю
  alternative: Господи
  rationale: Контекст прямо описує звернення раба до власника майна. «Господарю» природно передає цей рольовий зв’язок українською, не заперечуючи ширших христологічних асоціацій притчі.
- issue: Оцінка господаря у словах слуги
  choice: Передати звинувачення як слова слуги, не підтверджуючи й не пом’якшуючи їх
  alternative: Уточнити характеристику як об’єктивно правильну або хибну
  rationale: Текст повідомляє, як слуга характеризує господаря; переклад має зберегти цю оповідну й богословську напругу.
translation_notes:
  register: Сучасна, гідна й зрозуміла українська мова. Синтаксис оповіді природний, а сільськогосподарські образи та невисловлений об’єкт при «розсипав» збережено максимально близько до грецького тексту.
