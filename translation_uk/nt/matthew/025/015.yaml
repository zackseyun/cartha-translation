source:
  edition: SBLGNT
  text: καὶ ᾧ μὲν ἔδωκεν πέντε τάλαντα ᾧ δὲ δύο ᾧ δὲ ἕν, ἑκάστῳ κατὰ τὴν ἰδίαν δύναμιν, καὶ ἀπεδήμησεν. εὐθέως
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/015.yaml
  text: And to one he gave five talents[a], to another two, and to another one, to each according to his own ability[b]; and he went away immediately.
translation:
  language: uk
  text: Одному він дав п’ять талантів[a], другому — два, а ще іншому — один, кожному відповідно до його спроможності; і відразу вирушив у дорогу.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Талант — дуже велика вагова й грошова одиниця; тут це не природна здібність чи обдарування.
    reason: lexical_alternative
  - marker: b
    text: 'Грецьке слово, перекладене як «відразу», можна також пов’язати з наступним реченням: «Відразу ж той, хто одержав п’ять талантів, пішов…»'
    reason: textual_syntax
lexical_decisions:
- source_word: τάλαντα
  choice: талантів
  rationale: Збережено історичну назву великої вагової та грошової одиниці; примітка усуває можливе сучасне розуміння слова як природного обдарування.
- source_word: ᾧ μὲν ... ᾧ δὲ ... ᾧ δὲ
  choice: одному ... другому ... а ще іншому
  rationale: Природно передає українською розподільну й протиставну послідовність одержувачів.
- source_word: ἕν
  choice: один
  rationale: Іменник «талант» зрозуміло мається на увазі з попереднього переліку, тому його не повторено.
- source_word: ἑκάστῳ κατὰ τὴν ἰδίαν δύναμιν
  choice: кожному відповідно до його спроможності
  rationale: «Спроможність» тут означає особисту здатність упоратися з дорученим, а не чудодійну силу; однина зберігає розподільний характер грецького вислову.
- source_word: ἀπεδήμησεν
  choice: вирушив у дорогу
  rationale: Передає значення від’їзду або подорожі без надмірного уточнення, чи йдеться саме про іншу країну.
- source_word: εὐθέως
  choice: відразу
  rationale: Передає часовий прислівник, водночас примітка зберігає синтаксичну неоднозначність його зв’язку з від’їздом господаря або дією першого слуги в наступному реченні.
- source_word: καὶ
  choice: і
  rationale: Зберігає простий сполучний зв’язок із попередньою розповіддю.
theological_decisions:
- issue: Значення талантів у притчі
  choice: Історичні грошово-вагові одиниці
  alternative: Природні здібності або обдарування
  rationale: Безпосередній сюжет говорить про майно, передане слугам; сучасне переносне значення слова «талант» не слід вносити в буквальний зміст оповіді.
- issue: Розподільна однина у вислові про спроможність
  choice: кожному відповідно до його спроможності
  alternative: кожному відповідно до їхньої спроможності
  rationale: Українська конструкція з «кожному» природно вимагає однини й точно відтворює грецькі форми ἑκάστῳ та ἰδίαν, не змінюючи змісту на колективний.
- issue: Синтаксичний зв’язок εὐθέως
  choice: У головному тексті пов’язано з від’їздом господаря
  alternative: Може стосуватися дії слуги на початку наступного вірша
  rationale: Грецький порядок слів і пізніша версифікація допускають обидва прочитання; альтернативу явно подано в примітці, щоб не приховувати справжньої неоднозначності.
translation_notes:
  register: Сучасна, зрозуміла й водночас гідна оповідна українська. Тире полегшують сприйняття переліку; «спроможність» запобігає небажаному повторенню «талант—здібність», а «вирушив у дорогу» природно передає подорожній відтінок дієслова.
