  naturalness: Фраза звучить природно сучасною літературною українською. Конструкції «одному… другому… а ще іншому», тире в переліку та «кожному відповідно до його спроможності» ясні й стилістично доречні для оповідного біблійного тексту.
  terminology: «Талантів» правильно зберігає історичний термін, а примітка чітко відмежовує його від сучасного значення природної здібності. «Спроможність» адекватно передає δύναμις в цьому контексті як особисту здатність/можливість, не як надприродну силу.
