reference: Matthew 25:45
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσεται αὐτοῖς λέγων· Ἀμὴν λέγω ὑμῖν, ἐφ’ ὅσον οὐκ ἐποιήσατε ἑνὶ τούτων τῶν ἐλαχίστων, οὐδὲ ἐμοὶ ἐποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/045.yaml
  text: Then he will answer them[a], saying, ‘Truly I say to you, insofar as you did not do it for one of the least of these[b], neither did you do it for me.’
translation:
  language: uk
  text: 'Тоді він відповість їм: «Істинно кажу вам: оскільки ви не зробили цього одному з цих найменших[a], то не зробили й мені».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Вислів «ці найменші» можна розуміти конкретно як учнів Ісуса або ширше — як принижених і нужденних; переклад залишає формулювання тексту без уточнення.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Тоді
  rationale: Природно й точно позначає наступний момент у сцені суду.
- source_word: ἀποκριθήσεται αὐτοῖς λέγων
  choice: він відповість їм
  rationale: Українське дієслово мовлення природно передає і присудок, і супровідний дієприкметник λέγων без важкої конструкції «відповість їм, кажучи».
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Істинно кажу вам
  rationale: Зберігає урочисту формулу Ісуса та її наголос у зрозумілій сучасній українській мові.
- source_word: ἐφ’ ὅσον
  choice: оскільки
  rationale: У цьому заперечному зіставленні передає співвіднесеність учинку щодо «найменших» з учинком щодо Ісуса; не додає окремої причини поза логікою вислову.
- source_word: οὐκ ἐποιήσατε
  choice: ви не зробили цього
  rationale: Займенник «цього» природно відсилає до названих у контексті справ милосердя.
- source_word: ἑνὶ τούτων τῶν ἐλαχίστων
  choice: для одного з цих найменших
  rationale: Зберігає представницький одниновий вислів ἑνί та суперлатив ἐλαχίστων; «для» природно вказує на особу, заради якої чинять згадані дії.
- source_word: οὐδὲ ἐμοὶ ἐποιήσατε
  choice: то не зробили й для мене
  rationale: «Й» передає додаткове заперечення οὐδέ, а повтор дієслова зберігає риторичний паралелізм.
theological_decisions:
- issue: Кого означає вислів «ці найменші»
  choice: Переклад залишає групу невизначеною в самому тексті.
  alternative: Розуміти вислів конкретно як учнів або посланців Ісуса чи ширше — як принижених і нужденних.
  rationale: Вірш прямо ототожнює ставлення до «одного з цих найменших» зі ставленням до Ісуса, але сам по собі не визначає групу настільки однозначно, щоб усунути тлумачну напругу.
translation_notes:
  register: Сучасна стандартна українська мова, урочиста, але доступна. Надлишкове «кажучи» опущено як неприродне українською, без втрати змісту. Збережено пряму мову, повтор дієслова й невизначеність вислову «ці найменші».
