    text: Вислів «ці найменші» можна розуміти конкретно як учнів Ісуса або ширше — як принижених і нужденних; переклад залишає формулювання тексту без уточнення.
    reason: alternative_reading
  revision_rationale: Замінено «для одного з цих найменших» і «для мене» на давальні конструкції «одному з цих найменших» і «мені», щоб точніше передати грецькі давальні ἑνί та ἐμοί і зберегти паралелізм вислову. Виноску та її якір збережено; вони коректно не розв'язують тлумачної неоднозначності.
