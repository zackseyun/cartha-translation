revisions:
- from: 'Тоді він відповість їм: «Істинно кажу вам: оскільки ви не зробили цього для одного з цих найменших[a], то не зробили й для мене».'
  to: 'Тоді він відповість їм: «Істинно кажу вам: оскільки ви не зробили цього одному з цих найменших[a], то не зробили й мені».'
  rationale: Замінено «для одного з цих найменших» і «для мене» на давальні конструкції «одному з цих найменших» і «мені», щоб точніше передати грецькі давальні ἑνί та ἐμοί і зберегти паралелізм вислову. Виноску та її якір збережено; вони коректно не розв'язують тлумачної неоднозначності.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:25:34Z'
review_pass:
  verdict: revise
  source_fidelity: The temporal sequence, future reply, solemn affirmation, representative singular («one»), superlative («least»), and the unresolved referent are retained. However, the Greek dative ἑνί … / ἐμοί is more directly and idiomatically represented in Ukrainian here by «одному … / мені» than by «для одного … / для мене».
  naturalness: The proposed revision uses the established, natural Ukrainian construction «зробити комусь» in this context. It maintains a dignified contemporary register and the concise parallelism of the saying.
  terminology: «Істинно кажу вам» appropriately renders the solemn Ἀμὴν λέγω ὑμῖν. «Цих найменших» preserves the demonstrative and superlative without deciding whether the group denotes disciples specifically or needy people more broadly.
  issues:
  - severity: medium
    issue: «для одного з цих найменших» / «для мене» weakens the dative correspondence.
    rationale: The source says literally that they did not do it «to one» of these least ones and «to me». In Ukrainian, «зробити це одному з …» and «зробити мені» preserve the personal dative relation more closely; «для» can shift the sense toward acting for someone's benefit.
  revised_text: 'Тоді він відповість їм: «Істинно кажу вам: оскільки ви не зробили цього одному з цих найменших[a], то не зробили й мені».'
