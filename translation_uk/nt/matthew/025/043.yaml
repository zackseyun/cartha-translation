  text: ξένος ἤμην καὶ οὐ συνηγάγετέ με, γυμνὸς καὶ οὐ περιεβάλετέ με, ἀσθενὴς καὶ ἐν φυλακῇ καὶ οὐκ ἐπεσκέψασθέ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/043.yaml
  text: I was a stranger and you did not welcome me[a], naked and you did not clothe me[b], sick and in prison and you did not visit me.
translation:
  language: uk
  text: Я був чужинцем, і ви не прийняли мене[a]; був без одягу, і ви не одягнули мене; був хворий і у в’язниці, і ви не відвідали мене[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «не прийняли до себе». Грецьке дієслово буквально означає «зібрати», але тут ідеться про гостинне прийняття чужинця.'
    reason: lexical_alternative
  - marker: b
    text: «Відвідати» тут може також мати значення «подбати», «потурбуватися», а не лише прийти побачитися.
    reason: lexical_alternative
lexical_decisions:
- source_word: ξένος
  choice: чужинець
  rationale: Передає людину поза домом чи спільнотою, яка потребує гостинного прийняття, не звужуючи значення до етнічного «іноземець».
- source_word: συνηγάγετέ
  choice: прийняли
  rationale: У сполученні з ξένος дієслово означає прийняти до себе, виявивши гостинність; природне українське «прийняли» зберігає цей зміст.
- source_word: γυμνός
  choice: нагий
  rationale: Прямий відповідник, який зберігає силу грецького слова; у контексті може також означати людину без достатнього одягу.
- source_word: περιεβάλετέ
  choice: одягнули
  rationale: Природно передає значення «вдягнути, забезпечити одягом» у названому вчинку милосердя.
- source_word: ἀσθενής
  choice: хворий
  rationale: У цьому переліку потреб найімовірніше йдеться про фізичну хворобу, хоча слово ширше може означати слабкість.
- source_word: ἐν φυλακῇ
  choice: у в’язниці
  rationale: φυλακή тут позначає стан ув’язнення; «у в’язниці» є точним і загальнозрозумілим відповідником.
- source_word: ἐπεσκέψασθέ
  choice: відвідали
  rationale: Зберігає конкретну дію грецького тексту, а примітка пояснює властивий дієслову відтінок турботливого піклування.
theological_decisions:
- issue: Зміст милосердної дії в ἐπεσκέψασθέ με
  choice: не відвідали Мене
  alternative: не подбали про Мене / не навідали Мене з турботою
  rationale: «Відвідали» зберігає конкретність названої дії, не зводячи її лише до матеріальної допомоги; примітка передає смисловий відтінок небайдужої турботи.
translation_notes:
  register: Сучасна стандартна українська з гідним біблійним звучанням. Паралельну будову грецького переліку збережено; займенник «Мене» подано з великої літери за усталеною українською біблійною практикою.
