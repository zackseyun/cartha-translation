lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: А він відповів
  rationale: Дієприкметник із особовою формою дієслова становить звичну оповідну формулу; природне українське «відповів» передає її без зайвого дублювання. «А» позначає протиставлення попередньому проханню.
- source_word: Ἀμὴν
  choice: Істинно
  rationale: У синоптичній формулі Ἀμὴν λέγω ὑμῖν слово вводить урочисте запевнення. «Істинно» зрозуміле в сучасній українській і зберігає піднесений регістр.
- source_word: λέγω ὑμῖν
  choice: кажу вам
  rationale: Прямий і природний відповідник, що зберігає урочисте безпосереднє звернення.
- source_word: οὐκ οἶδα
  choice: не знаю
  rationale: οἶδα буквально означає «знати». У контексті можливий відтінок невизнання або відмежування, однак основний текст не повинен звужувати цю смислову напругу.
- source_word: ὑμᾶς
  choice: вас
  rationale: Форма знахідного відмінка другої особи множини; українське «вас» точно передає число й синтаксичну роль.
theological_decisions:
- issue: Сила вислову «я вас не знаю» у притчі
  choice: Збережено просте, але вагоме у стосунковому сенсі формулювання «я вас не знаю».
  alternative: «Я вас не впізнаю» або «Я не маю з вами стосунків».
  rationale: У контексті вислів означає відмову в допуску та може передавати невизнання, проте розгорнутий доктринальний зміст не слід вносити до самого перекладу.
translation_notes:
  register: Сучасна стандартна українська; природний, стислий і гідний стиль. Урочисту формулу передано як «Істинно кажу вам», а неоднозначність οὐκ οἶδα збережено в основному тексті й пояснено у примітці.
