  source_fidelity: 'Текст точно передає всі складники SBLGNT: часовий маркер «Тоді», майбутню формулу порівняння, «Царство Небесне», десятьох дів, узяття власних світильників, вихід назустріч і нареченого. «Буде подібне до» є природною українською передачею майбутнього пасива ὁμοιωθήσεται; примітка належно зберігає формальніший пасивний варіант.'
