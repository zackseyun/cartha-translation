source:
  edition: SBLGNT
  text: Τότε ὁμοιωθήσεται ἡ βασιλεία τῶν οὐρανῶν δέκα παρθένοις, αἵτινες λαβοῦσαι τὰς λαμπάδας ⸀ἑαυτῶν ἐξῆλθον εἰς ⸀ὑπάντησιν τοῦ νυμφίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/001.yaml
  text: Then the kingdom of heaven will be like ten virgins[c][b][a], who took their lamps and went out to meet the bridegroom.
translation:
  language: uk
  text: Тоді Царство Небесне буде подібне до десятьох дів[a], які взяли свої світильники[b] й вийшли назустріч нареченому.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «буде уподібнене десятьом дівам». Грецьке дієслово має пасивну форму.'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «смолоскипи». Грецьке слово може означати ручні джерела світла, які несли під час процесії.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Тоді
  rationale: Природний український часовий сполучник, який пов’язує притчу з попереднім есхатологічним контекстом.
- source_word: ὁμοιωθήσεται
  choice: буде подібне до
  rationale: Природно передає українською майбутню парболічну формулу порівняння; пасивну форму грецького дієслова збережено в примітці як можливу формальнішу передачу.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Царство Небесне
  rationale: Усталений, природний український відповідник характерного для Матвія вислову; прикметникова форма передає грецький родовий зворот без неприродного буквалізму.
- source_word: δέκα παρθένοις
  choice: десятьох дів
  rationale: «Діви» зберігає значення молодих незаміжніх жінок із припущеною в контексті незайманістю, водночас звучить природніше в сучасній українській, ніж «незайманих дівчат».
- source_word: αἵτινες
  choice: які
  rationale: Природний відповідник відносного займенника, що вводить опис цих дів.
- source_word: λαβοῦσαι
  choice: взяли
  rationale: Аористовий дієприкметник природно передано особовою формою, зберігаючи послідовність дій.
- source_word: τὰς λαμπάδας ἑαυτῶν
  choice: свої світильники
  rationale: «Світильники» є зрозумілим і традиційним відповідником; грецьке слово може також означати смолоскипи, що зазначено в примітці.
- source_word: ἐξῆλθον
  choice: вийшли
  rationale: Точно й природно передає рух назовні.
- source_word: εἰς ὑπάντησιν
  choice: назустріч
  rationale: Стислий природний український відповідник ідіоми про вихід для зустрічі когось.
- source_word: τοῦ νυμφίου
  choice: нареченому
  rationale: Точно позначає чоловіка в контексті весілля й природно узгоджується зі зворотом «вийшли назустріч».
theological_decisions:
- issue: Формула порівняння в притчі
  choice: Царство Небесне буде подібне до десятьох дів
  alternative: Царство Небесне буде уподібнене десятьом дівам
  rationale: Основний текст віддає перевагу природній українській формулі, не змінюючи суті порівняння; формальний пасив грецького ὁμοιωθήσεται збережено як альтернатива в примітці.
- issue: Передача παρθένοις
  choice: дів
  alternative: незайманих дівчат; молодих незаміжніх жінок
  rationale: «Діви» зберігає традиційну й лексично містку назву без додавання пояснювальної соціальної характеристики або надмірного наголосу на фізичному стані.
translation_notes:
  register: Сучасна нормативна українська з гідним біблійним регістром. Синтаксис простий і придатний для читання вголос; уникнуто як архаїчного «жених», так і пояснювального розширення тексту.
