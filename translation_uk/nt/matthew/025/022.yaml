  text: προσελθὼν ⸀δὲ καὶ ὁ τὰ δύο ⸀τάλαντα εἶπεν· Κύριε, δύο τάλαντά μοι παρέδωκας· ἴδε ἄλλα δύο τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/022.yaml
  text: Then the one who had received the two talents also came forward and said[a], ‘Lord, you handed over to me two talents. Look[b], I gained two more talents.’
translation:
  language: uk
  text: 'Тоді підійшов і той, хто одержав два таланти, та сказав[a]: «Господи, ти передав мені два таланти. Ось[b], я здобув ще два таланти».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «пане». Грецьке звертання κύριε зазвичай перекладають як «Господи», але в цій притчі воно може бути шанобливим звертанням до пана.
    reason: alternative_reading
  - marker: b
    text: Талант був великою грошово-ваговою одиницею, а не природною здібністю.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: підійшов
  rationale: Дієприкметник аориста від προσέρχομαι позначає наближення слуги до пана перед його звітом; українська особова форма природно передає послідовність оповіді.
- source_word: δὲ καὶ
  choice: також і
  rationale: Сполука продовжує послідовність звітів і додає другого слугу; «також і» зберігає паралель із попереднім епізодом.
- source_word: ὁ τὰ δύο τάλαντα
  choice: той, хто одержав два таланти
  rationale: Субстантивована конструкція визначає слугу за довіреною йому сумою; «одержав» природно відновлює зрозумілий із контексту зміст.
- source_word: Κύριε
  choice: Господи
  rationale: Клична форма κύριος. «Господи» зберігає звичний відповідник титулу, хоча в соціальному контексті притчі можливе й звертання «пане».
- source_word: παρέδωκας
  choice: передав
  rationale: παραδίδωμι означає передати або вручити; «передав» зберігає конкретне значення дієслова, не додаючи тлумачення «довірив» безпосередньо до тексту.
- source_word: ἴδε
  choice: ось
  rationale: Вказівний вигук привертає увагу до результату; «ось» звучить природно й гідно в сучасній українській.
- source_word: ἄλλα δύο τάλαντα
  choice: ще два таланти
  rationale: ἄλλα з числівником означає додаткову таку саму кількість; «ще два» є природним українським відповідником.
- source_word: ἐκέρδησα
  choice: я здобув
  rationale: κερδαίνω означає здобути, набути, одержати прибуток; «здобув» зберігає результат, не конкретизуючи спосіб отримання прибутку.
- source_word: τάλαντα
  choice: таланти
  rationale: τάλαντον тут є великою грошово-ваговою одиницею, а не природною здібністю. Традиційний термін збережено, а значення пояснено в примітці.
theological_decisions:
- issue: Передача κύριος у звертанні в притчі
  choice: Господи
  alternative: пане
  rationale: «Господи» послідовно передає κύριος та не усуває можливого ширшого богословського відлуння; примітка зберігає соціально природне значення «пане» в межах притчі.
translation_notes:
  register: Сучасна стандартна українська, природний і гідний оповідний стиль. Синтаксис дещо розгорнуто для ясності, а традиційний термін «талант» збережено з культурною приміткою.
