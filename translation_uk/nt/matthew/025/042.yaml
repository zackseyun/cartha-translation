  yaml_path: translation/nt/matthew/025/042.yaml
  text: For I was hungry and you gave me nothing to eat[a]; I was thirsty and you gave me nothing to drink.
translation:
  language: uk
  text: Бо Я був голодний, і ви не дали Мені їсти; Я був спраглий, і ви не напоїли Мене.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπείνασα
  choice: Я був голодний
  rationale: Аорист πεινάω описує минулий стан; цей вислів природний у сучасній українській мові й зберігає особову форму та чоловічий рід мовця.
- source_word: γὰρ
  choice: Бо
  rationale: 'Передає пояснювальну силу γάρ: наведені далі вчинки пояснюють підставу вироку в контексті.'
- source_word: οὐκ ἐδώκατέ μοι φαγεῖν
  choice: ви не дали Мені їсти
  rationale: Природна українська конструкція, яка досить близько відтворює грецьке «не дали мені їсти» та явно зберігає особовий займенник μοι.
- source_word: ἐδίψησα
  choice: Я був спраглий
  rationale: Передає минулий стан і підтримує паралелізм із «Я був голодний»; «спраглий» є сучасним, стислим і гідним відповідником.
- source_word: οὐκ ἐποτίσατέ με
  choice: ви не дали Мені напитися
  rationale: У цьому контексті ποτίζω означає дати пиття. Вислів природний українською, зберігає особистий об’єкт με і структурний паралелізм із попередньою частиною.
theological_decisions:
- issue: Ступінь буквальності у висловах про ненадання їжі та пиття
  choice: «не дали Мені їсти … не дали Мені напитися»
  alternative: «не нагодували Мене … не напоїли Мене» або «не дали Мені нічого їсти … нічого пити»
  rationale: Обраний варіант природний українською та водночас ближче зберігає грецькі конструкції з δίδωμι + інфінітив і ποτίζω. Він не посилює і не послаблює богословський акцент контексту на особисто виявленому чи невиявленому милосерді.
translation_notes:
  register: Сучасна літературна українська, зрозуміла широкому читачеві, зі стримано урочистим біблійним звучанням. Займенники щодо Ісуса подано з великої літери відповідно до поширеної української біблійної традиції; це графічна шанобливість, а не додане тлумачення.
