  text: τότε ἀποκριθήσονται καὶ αὐτοὶ λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα ἢ διψῶντα ἢ ξένον ἢ γυμνὸν ἢ ἀσθενῆ ἢ ἐν φυλακῇ καὶ οὐ διηκονήσαμέν σοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/044.yaml
  text: Then they too will answer, saying, ‘Lord, when did we see you hungry or thirsty or a stranger or naked or sick or in prison, and not serve you?’
translation:
  language: uk
  text: 'Тоді й вони скажуть у відповідь: «Господи, коли ми бачили Тебе голодним, чи спраглим, чи чужинцем, чи нагим, чи хворим, чи у в’язниці — і не послужили Тобі[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «не допомогли Тобі» чи «не подбали про Тебе»; грецьке διακονέω означає практично служити комусь, допомагати або дбати про нього.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Тоді
  rationale: Природно й точно позначає наступний момент у послідовності сцени суду.
- source_word: ἀποκριθήσονται καὶ αὐτοὶ λέγοντες
  choice: й вони скажуть у відповідь
  rationale: Передає майбутню відповідь, наголос καὶ αὐτοὶ («і вони») та функцію дієприкметника λέγοντες природною сучасною українською мовою.
- source_word: Κύριε
  choice: Господи
  rationale: Звична українська клична форма титулу κύριος, що зберігає шанобливе звертання та христологічне звучання.
- source_word: πεινῶντα ἢ διψῶντα
  choice: голодним, чи спраглим
  rationale: Предикативні дієприкметники після «бачили Тебе» природно передано прикметниками; «спраглий» є точним і гідним відповідником.
- source_word: ξένον
  choice: чужинцем
  rationale: Передає людину, чужу для певної спільноти й таку, що потребує гостинності, не звужуючи значення до етнічного іноземця.
- source_word: γυμνὸν
  choice: нагим
  rationale: Зберігає пряме лексичне значення, яке в контексті може також охоплювати недостатньо одягнену людину.
- source_word: ἀσθενῆ
  choice: хворим
  rationale: У переліку тілесних і суспільних потреб значення «хворий» є найприроднішим, хоча слово ширше може означати «слабкий».
- source_word: ἐν φυλακῇ
  choice: у в’язниці
  rationale: Прямий і зрозумілий відповідник місця ув’язнення.
- source_word: οὐ διηκονήσαμέν σοι
  choice: не послужили Тобі
  rationale: Зберігає широкий зміст διακονέω як практичного служіння й допомоги, а також зв’язок між допомогою нужденним і служінням Господу.
theological_decisions:
- issue: Передача κύριος як титулу Ісуса
  choice: Господи
  alternative: Учителю / Пане
  rationale: «Господи» є усталеним відповідником у звертанні до Ісуса та зберігає богословське звучання титулу, не додаючи тверджень понад текст.
- issue: Смислова сила διακονέω в заключному запитанні
  choice: послужили Тобі
  alternative: допомогли Тобі / подбали про Тебе
  rationale: «Послужили» зберігає ширший спектр практичного служіння і не звужує його лише до турботи чи одноразової допомоги.
translation_notes:
  register: Сучасна стандартна українська, гідний біблійний регістр без архаїчної синтаксичної важкості. Великі літери в займенниках звертання до Ісуса відповідають поширеній українській біблійній традиції. Повтор «чи» зберігає риторичний перелік грецького тексту; тире виразно пов’язує весь перелік із заключним заперечним запитанням.
