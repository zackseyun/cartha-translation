  yaml_path: translation/nt/matthew/025/016.yaml
  text: The one who had received the five talents went and worked with them[b][a], and gained another five.
translation:
  language: uk
  text: Той, хто одержав п’ять талантів[b], пішов і пустив їх у діло[a], і заробив ще п’ять.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «відійшов і працював з ними»; грецький вислів означає активне використання грошей задля прибутку.'
    reason: lexical_alternative
  - marker: b
    text: Талант був великою грошовою одиницею, а не вродженим хистом.
    reason: cultural_note
lexical_decisions:
- source_word: πορευθεὶς
  choice: пішов
  rationale: Дієприкметник передає дію, що супроводжує наступну; особова форма природна українською. Не додано значення «відразу», якого грецький текст прямо не виражає.
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: той, хто одержав п’ять талантів
  rationale: Артикльований дієприкметниковий зворот визначає слугу за тим, що він одержав; українська конструкція з «той, хто» природно зберігає цю функцію.
- source_word: τάλαντα
  choice: талантів
  rationale: Збережено традиційний термін на позначення великої грошової одиниці; примітка усуває можливе сучасне розуміння як природної здібності.
- source_word: ἠργάσατο ἐν αὐτοῖς
  choice: пустив їх у діло
  rationale: Природний український вислів передає активне використання отриманих грошей задля прибутку, не звужуючи дію лише до торгівлі.
- source_word: ἐκέρδησεν
  choice: заробивши
  rationale: У грошовому контексті природно передає одержання прибутку; дієприслівник ясно пов’язує результат із використанням коштів.
- source_word: ἄλλα πέντε
  choice: ще п’ять
  rationale: Стисло й природно передає додаткову кількість.
