lexical_decisions:
- source_word: φοβηθεὶς
  choice: злякавшись
  rationale: Аористовий дієприкметник від φοβέομαι передає названу слугою причину його вчинку. «Злякавшись» природно зберігає обставинну форму й не надає страху значення побожного благоговіння.
- source_word: ἀπελθὼν
  choice: я пішов
  rationale: 'Аористовий дієприкметник позначає дію, що передує приховуванню. В українській послідовність природно передано особовою формою в ряді дій: «я пішов і сховав».'
- source_word: ἔκρυψα
  choice: сховав
  rationale: κρύπτω безпосередньо означає «ховати, приховувати». «Сховав» точно передає дію, тоді як місце приховування окремо назване словами «у землі».
- source_word: τὸ τάλαντόν σου
  choice: твій талант
  rationale: τάλαντον — велика одиниця ваги й грошової вартості. Історичний термін «талант» збережено в тексті, а його грошове значення пояснено у примітці, щоб уникнути сучасного розуміння як природної здібності.
- source_word: ἐν τῇ γῇ
  choice: у землі
  rationale: γῆ тут означає землю як місце, де було сховано талант. «У землі» є точним і природним українським відповідником.
- source_word: ἴδε
  choice: Ось
  rationale: ἴδε привертає увагу до того, що слуга повертає господареві. «Ось» природно виконує цю вказівну функцію без архаїчності.
- source_word: ἔχεις τὸ σόν
  choice: маєш своє
  rationale: Грецький вислів стислий і буквально наголошує на належному господареві. «Маєш своє» зберігає цю стислість, присвійний акцент і дещо різкий тон слуги.
theological_decisions:
- issue: Значення τάλαντον у притчі, яку часто пов’язують із природними здібностями
  choice: Зберегти історичний грошовий термін «талант» у головному тексті та пояснити його значення у примітці.
  alternative: велика сума грошей
  rationale: У грецькому тексті йдеться про високоцінну одиницю грошей або ваги, а не про природну обдарованість. Збереження терміна підтримує історичне й літературне звучання притчі, а примітка запобігає хибному сучасному прочитанню.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Синтаксис передає послідовність грецьких дій без неприродного нагромадження дієприслівників; «Ось, маєш своє» зберігає стислість і напружений тон репліки.
