  text: ⸀ἔφη αὐτῷ ὁ κύριος αὐτοῦ· Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/021.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will appoint you over many things[b]. Enter into the joy of your master.’
translation:
  language: uk
  text: 'Його пан сказав йому: «Добре зробив, рабе добрий і вірний[a]! У малому ти був вірний — над великим тебе поставлю. Увійди в радість свого пана».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «слуго». Грецьке слово δοῦλος у цьому контексті позначає залежного раба; залежно від перекладацького контексту його можуть передавати як «раб» або «слуга».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη
  choice: сказав
  rationale: Природний і точний відповідник у формулі введення прямої мови.
- source_word: κύριος
  choice: пан
  rationale: У межах притчі позначає пана раба; українське «пан» природно передає цю суспільну й владну роль, не перетворюючи слово на прямий христологічний титул.
- source_word: δοῦλε
  choice: рабе
  rationale: Грецьке δοῦλος у цьому соціальному контексті прямо позначає раба. Такий переклад зберігає історичну нерівність стосунків і добре узгоджується зі словом «пан».
- source_word: Εὖ
  choice: Гаразд
  rationale: У цьому вигуку схвалення означає, що раб учинив добре; «Гаразд» є стислим природним українським відповідником без додавання дієслова, якого в грецькому тексті немає.
- source_word: ἀγαθὲ
  choice: добрий
  rationale: Прямо передає позитивну моральну оцінку та природно поєднується з «вірний».
- source_word: πιστέ / πιστός
  choice: вірний / вірний
  rationale: Зберігає лексичний повтор і виражає надійність у виконанні довіреного обов’язку.
- source_word: ἐπὶ ὀλίγα
  choice: у малому
  rationale: Природний український вислів для малої міри довіреної відповідальності; зберігає контраст із «великим».
- source_word: ἐπὶ πολλῶν
  choice: над великим
  rationale: Передає більший обсяг відповідальності й відтворює паралельний контраст ὀλίγα—πολλῶν без невиправданого уточнення «речами».
- source_word: καταστήσω
  choice: поставлю
  rationale: У цьому контексті означає призначення до управління або відповідальності; «поставлю над» є природною українською конструкцією.
- source_word: εἴσελθε εἰς τὴν χαρὰν
  choice: Увійди в радість
  rationale: Зберігає просторову метафору оригіналу та не звужує її до пояснювального «розділи радість».
theological_decisions:
- issue: Передача κύριος у притчі, де пан може уособлювати Бога або Христа
  choice: пан
  alternative: Господь
  rationale: Безпосередній рівень оповіді описує стосунки раба і його пана. «Пан» зберігає цей сюжетний сенс, водночас не усуваючи можливого богословського значення образу.
- issue: Передача δοῦλος у контексті давнього залежного статусу
  choice: раб
  alternative: слуга
  rationale: «Раб» точніше відтворює соціальний статус, позначений δοῦλος, і не пом’якшує владної нерівності. Варіант «слуга» подано в примітці як можливий контекстуальний відповідник.
- issue: Образ входження в радість пана
  choice: Увійди в радість свого пана
  alternative: Розділи радість свого пана
  rationale: 'Буквально-образна конструкція зберігає метафору εἴσελθε εἰς і властиву їй відкритість: це може означати і прийняття до святкування, і участь у радості.'
translation_notes:
  register: Сучасна, гідна й загальнозрозуміла українська мова. Збережено урочисту стислість похвали, повтор «вірний» і метафору входження в радість. Усі приміткові маркери наявні в основному тексті.
