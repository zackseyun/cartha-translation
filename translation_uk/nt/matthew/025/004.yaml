lexical_decisions:
- source_word: φρόνιμοι
  choice: мудрі
  rationale: Передає практичну розсудливість і зберігає контраст із нерозумними дівами в ширшому контексті, не звужуючи значення до самої підготовленості.
- source_word: ἔλαβον
  choice: взяли
  rationale: У цьому оповідному контексті дієслово означає, що вони взяли олію із собою, а не отримали її.
- source_word: ἔλαιον
  choice: олію
  rationale: Звичний український відповідник; уточнення «оливкову» було б конкретнішим, ніж вимагає текст.
- source_word: ἀγγείοις
  choice: в посудинах
  rationale: Зберігає загальне значення предметів для зберігання рідини, не нав’язуючи конкретної форми чи матеріалу.
- source_word: λαμπάδων
  choice: світильниками
  rationale: λαμπάς може означати світильник або смолоскип. «Світильники» природно узгоджуються із запасом олії; іншу можливість подано у примітці.
- source_word: ἑαυτῶν
  choice: своїми
  rationale: Український зворотний присвійний займенник природно передає належність світильників самим підметам.
- source_word: μετὰ τῶν λαμπάδων ἑαυτῶν
  choice: разом зі своїми світильниками
  rationale: 'Чітко передає супровід: олію взяли додатково до світильників і разом із ними.'
