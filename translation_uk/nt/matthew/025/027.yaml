  text: ἔδει ⸂σε οὖν⸃ βαλεῖν ⸂τὰ ἀργύριά⸃ μου τοῖς τραπεζίταις, καὶ ἐλθὼν ἐγὼ ἐκομισάμην ἂν τὸ ἐμὸν σὺν τόκῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/027.yaml
  text: Therefore[a], you should have deposited my money with the bankers, and when I came, I would have received what was mine with interest.
translation:
  language: uk
  text: Тож тобі належало передати мої гроші банкірам[a], і, повернувшись, я одержав би своє з відсотками.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «віддати моє срібло банкірам».'
    reason: 'Лексична альтернатива: ἀργύρια може означати «срібло», а βαλεῖν у цьому фінансовому контексті — «віддати» або «покласти».'
lexical_decisions:
- source_word: ἔδει
  choice: тобі належало
  rationale: Імперфект безособового дієслова виражає те, що слід було зробити в минулому; цей відповідник природно передає докір.
- source_word: οὖν
  choice: тож
  rationale: Позначає висновок із попередніх слів і стисло та природно передає логічний зв’язок.
- source_word: βαλεῖν
  choice: віддати
  rationale: Буквально дієслово означає «покласти», але в поєднанні з банкірами й відсотками йдеться про передання грошей їм на зберігання та в обіг.
- source_word: τὰ ἀργύριά μου
  choice: мої гроші
  rationale: У цьому господарському контексті ἀργύρια функційно означає гроші, хоча буквально може означати срібло або срібні монети.
- source_word: τοῖς τραπεζίταις
  choice: банкірам
  rationale: Назва людей, які займалися обміном грошей і приймали кошти; згадка про відсотки підтримує відповідник «банкіри».
- source_word: ἐλθὼν ἐγὼ
  choice: повернувшись, я
  rationale: Аористовий дієприкметник позначає дію, що передує одержанню; у контексті господар повертається.
- source_word: ἐκομισάμην ἂν
  choice: одержав би
  rationale: 'Середній стан разом із ἄν передає нереалізований наслідок: господар одержав би назад належне йому.'
- source_word: τὸ ἐμὸν
  choice: своє
  rationale: Субстантивований присвійний займенник позначає те, що належить мовцеві; «своє» природно зберігає цей наголос.
- source_word: σὺν τόκῳ
  choice: з відсотками
  rationale: τόκος тут означає дохід, нарахований на гроші; сучасний нейтральний відповідник не додає оцінки законності чи моральності такої практики.
theological_decisions:
- issue: Фінансова образність притчі та можлива моральна оцінка стягнення відсотків
  choice: Передати фінансові терміни нейтрально як складник образності притчі.
  alternative: Ужити слово на кшталт «лихва», яке могло б натякати на осуд.
  rationale: Оригінал у цьому реченні не формулює загальної моральної оцінки позичання під відсотки; переклад не повинен вносити її до тексту.
translation_notes:
  register: Сучасна літературна українська мова з гідним, зрозумілим синтаксисом. «Тож» передає висновок без надмірної канцелярськості; «належало» зберігає докір; фінансову лексику подано нейтрально. Маркер примітки поставлено після відповідного речення.
