  source_fidelity: «Через довгий час» точно передає μετὰ ... πολὺν χρόνον, не перевантажуючи легкий δέ. Історичний теперішній «приходить» відповідає ἔρχεται. «Пан тих рабів» належно передає нетитулярне, побутово-економічне κύριος та τῶν δούλων ἐκείνων. «Підбиває з ними рахунки» природно відтворює ідіому συναίρει λόγον μετ’ αὐτῶν у значенні проведення розрахунку/звітності.
