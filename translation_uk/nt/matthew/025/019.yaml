  text: μετὰ δὲ ⸂πολὺν χρόνον⸃ ἔρχεται ὁ κύριος τῶν δούλων ἐκείνων καὶ συναίρει ⸂λόγον μετ’ αὐτῶν⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/019.yaml
  text: After a long time[a], the master of those servants comes and settles accounts with them.
translation:
  language: uk
  text: Через довгий час приходить пан тих рабів[a] і підбиває з ними рахунки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «господар тих слуг». Грецьке κύριος може означати «пан», «господар» або «Господь», а δοῦλοι — «раби» чи «слуги»; в основному тексті обрано значення, що найвиразніше передає господарсько-майнові відносини в цій притчі.'
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ δὲ πολὺν χρόνον
  choice: Через довгий час
  rationale: μετά з знахідним відмінком позначає наступність у часі — «через / після». Частка δέ тут є легким оповідним сполучником; природний український початок речення вже передає перехід, тому окреме «а» чи «тоді» не потрібне.
- source_word: ἔρχεται
  choice: приходить
  rationale: Збережено історичний теперішній час грецького тексту, який надає розповіді жвавості.
- source_word: ὁ κύριος
  choice: пан
  rationale: У межах притчі слово позначає того, кому підвладні раби. «Пан» природно передає цю соціальну роль і не нав’язує тут титульного христологічного прочитання.
- source_word: τῶν δούλων ἐκείνων
  choice: тих рабів
  rationale: У господарсько-майновому контексті δοῦλοι позначає людей у підневільному становищі; «раби» точніше за м’якше «слуги» зберігає цей складник значення.
- source_word: συναίρει λόγον μετ’ αὐτῶν
  choice: підбиває з ними рахунки
  rationale: Грецький вислів означає перевірити й остаточно звести рахунки або вимагати звіту. Український бухгалтерський вислів природно передає цей сенс у контексті довіреного майна.
theological_decisions:
- issue: Передача κύριος у притчі
  choice: пан
  alternative: Господь; господар
  rationale: Безпосередньо в оповіді йдеться про пана рабів, а не про явне вживання божественного титулу. Можливе ширше значення притчі не усувається, але й не вноситься в саму назву персонажа.
- issue: Передача δοῦλος
  choice: рабів
  alternative: слуг
  rationale: Підлегле, невільне становище персонажів помітне в економічній структурі притчі, тому «раби» точніше зберігає соціальну реальність вихідного слова.
translation_notes:
  register: Сучасна стандартна українська, проста й гідна оповідна мова. Історичний теперішній час збережено. Вислів «підбиває з ними рахунки» слід читати в прямому обліковому значенні, заданому контекстом притчі.
