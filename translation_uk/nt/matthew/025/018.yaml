  text: ὁ δὲ τὸ ἓν λαβὼν ἀπελθὼν ὤρυξεν ⸀γῆν καὶ ⸀ἔκρυψεν τὸ ἀργύριον τοῦ κυρίου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/018.yaml
  text: But the one who had received the one talent went away[a], dug in the ground, and hid his master's money.
translation:
  language: uk
  text: А той, хто одержав один талант, пішов, викопав яму в землі й сховав гроші свого пана.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або, букв.: «срібло свого пана».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: А той
  rationale: δέ позначає протиставлення попереднім слугам; «А той» природно передає цей перехід і субстантивовану конструкцію.
- source_word: τὸ ἓν
  choice: один талант
  rationale: У грецькому тексті «один» еліптично відсилає до таланту в Мт 25:15; іменник відновлено для ясності.
- source_word: λαβὼν
  choice: хто одержав
  rationale: Дієприкметник означає попередню щодо головних дій подію; «одержав» природно описує прийняття довіреного майна.
- source_word: ἀπελθὼν
  choice: пішов
  rationale: Передає рух геть і послідовність дій без неприродної для української надмірності.
- source_word: ὤρυξεν γῆν
  choice: закопав його в землю
  rationale: Грецький вислів буквально говорить про копання землі, але в поєднанні з наступним «сховав» природний український виклад передає очевидну дію — закопування таланту; займенник відсилає до таланту.
- source_word: ἔκρυψεν
  choice: сховав
  rationale: Прямий і загальнозрозумілий відповідник κρύπτω.
- source_word: τὸ ἀργύριον
  choice: срібло
  rationale: ἀργύριον може означати як срібло, так і гроші. «Срібло» зберігає конкретний лексичний образ оригіналу, а примітка подає контекстуальне значення.
- source_word: τοῦ κυρίου αὐτοῦ
  choice: свого пана
  rationale: У межах притчі κύριος позначає людського господаря слуги; «пан» природно передає відносини влади без прямого перетворення слова на божественний титул.
theological_decisions:
- issue: Передача κύριος у притчі, де безпосереднім референтом є людина
  choice: пан
  alternative: Господь; господар
  rationale: «Пан» зберігає владне становище персонажа й не нав'язує прямого титульного прочитання, хоча ширше символічне значення притчі не заперечується.
- issue: Передача ἀργύριον
  choice: срібло в основному тексті з альтернативою «гроші» у примітці
  alternative: гроші в основному тексті
  rationale: Це зберігає предметний образ грецького слова та водночас дає читачеві його звичайне контекстуальне значення як коштів.
translation_notes:
  register: Сучасна, проста й гідна оповідна українська. Синтаксис зроблено природним для українського читача, а приміткою збережено семантичну широту ἀργύριον.
