  verdict: revise
  source_fidelity: 'У чернетці «закопав його в землю» зміщує структуру грецького вислову: ὤρυξεν γῆν означає, що слуга копав землю, після чого окремим дієсловом сховав гроші. Безпечніше відтворити ці дві послідовні дії як «викопав яму в землі й сховав». Τὸ ἀργύριον у цьому фінансовому контексті природніше передати як «гроші», з приміткою про буквальне «срібло».'
  naturalness: «А той, хто одержав один талант» — природний сучасний український початок. «Викопав яму в землі» є нормативним і ясним способом передати грецький ідіоматичний вислів без злиття копання та приховування в одну дію.
  terminology: «Талант» правильно зберігає назву грошово-вагової одиниці в контексті притчі. «Пан» доречно передає κύριος як людського господаря в сюжеті; це не нав’язує богословського титульного прочитання. «Гроші» тут передає контекстуальне значення ἀργύριον, а примітка зберігає лексичний відтінок «срібло».
