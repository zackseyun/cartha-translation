  source_fidelity: «Тоді всі ті діви встали й приготували свої світильники» точно передає послідовність τότε, підняття ἠγέρθησαν, сукупність і вказівність πᾶσαι αἱ παρθένοι ἐκεῖναι, рефлексивну належність ἑαυτῶν та контекстуальне значення ἐκόσμησαν. «Приготували» належно передає загальне «привели до ладу/підготували», не додаючи непідтверджених технічних деталей.
  naturalness: Речення лаконічне, граматично природне й відповідає сучасному зрозумілому біблійному оповідному регістру. «Діви» має дещо піднесене біблійне забарвлення, але тут воно доречне, зрозуміле та зберігає семантичну конкретність грецького παρθένοι краще, ніж ширше «дівчата».
