  text: Then all those virgins got up and trimmed their lamps[a].
translation:
  language: uk
  text: Тоді всі ті діви встали й приготували свої світильники[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «смолоскипи» замість «світильники» (грецьке λαμπάδας); це слово може означати переносне джерело світла, а згадки про олію та приготування допускають обидва варіанти.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Тоді
  rationale: Природно позначає наступну подію в оповіді й точно передає часову послідовність.
- source_word: ἠγέρθησαν
  choice: встали
  rationale: У контексті пробудження від сну дієслово означає, що діви підвелися; форма «встали» природна й не уточнює без потреби, чи їх саме розбудили.
- source_word: πᾶσαι αἱ παρθένοι ἐκεῖναι
  choice: всі ті діви
  rationale: «Діви» зберігає конкретне значення παρθένοι та весільний контекст притчі; «ті» передає вказівний займенник ἐκεῖναι.
- source_word: ἐκόσμησαν
  choice: приготували
  rationale: Буквально дієслово означає впорядкувати або привести до ладу. Щодо світильників тут ідеться про підготовку до використання; «приготували» звучить природно й не додає непевних технічних подробиць про ґніт.
- source_word: λαμπάδας
  choice: світильники
  rationale: λαμπάς може означати переносний світильник або смолоскип. Контекст олії та підготовки добре узгоджується зі «світильниками», тоді як інший можливий переклад подано в примітці.
- source_word: ἑαυτῶν
  choice: свої
  rationale: Український зворотний присвійний займенник природно й точно вказує, що світильники належали самим дівам.
