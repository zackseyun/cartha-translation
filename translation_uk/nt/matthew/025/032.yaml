source:
  edition: SBLGNT
  text: καὶ ⸀συναχθήσονται ἔμπροσθεν αὐτοῦ πάντα τὰ ἔθνη, καὶ ἀφορίσει αὐτοὺς ἀπ’ ἀλλήλων, ὥσπερ ὁ ποιμὴν ἀφορίζει τὰ πρόβατα ἀπὸ τῶν ἐρίφων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/032.yaml
  text: And all the nations will be gathered before him[a], and he will separate them from one another, just as the shepherd separates the sheep from the goats[b],
translation:
  language: uk
  text: І зберуться перед Ним усі народи[a], і Він відділить одних від інших, як пастух відділяє овець від козлів[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «усі люди»; буквально грецькою — «усі народи» (πάντα τὰ ἔθνη).'
    reason: lexical_alternative
  - marker: b
    text: Грецьке слово ἐρίφων може точніше означати «молодих козлів» або «козенят».
    reason: lexical_alternative
lexical_decisions:
- source_word: συναχθήσονται
  choice: зберуться
  rationale: Майбутня пасивна форма συνάγω. Українське «зберуться» природно передає зібрання без називання виконавця дії, хоча граматично має зворотну форму.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: перед Ним
  rationale: Природний і гідний відповідник зі значенням перебування перед Ним, доречний у сцені суду.
- source_word: πάντα τὰ ἔθνη
  choice: усі народи
  rationale: «Народи» зберігає широту ἔθνη та не звужує значення до язичників; «усі» точно передає πάντα.
- source_word: ἀφορίσει
  choice: відділить
  rationale: Дієслово прямо позначає розмежування однієї групи з іншою.
- source_word: αὐτοὺς ἀπ’ ἀλλήλων
  choice: одних від інших
  rationale: Природний український спосіб передати взаємне розділення тих, кого зібрано.
- source_word: ὥσπερ
  choice: як
  rationale: Стисло й природно вводить порівняння; смислову відповідність ὥσπερ у цьому реченні передано повністю.
- source_word: ὁ ποιμὴν
  choice: пастух
  rationale: Загальне означення особи, яка доглядає стадо; в українській мові родова ілюстрація природно звучить без артикля, якого мова не має.
- source_word: τὰ πρόβατα
  choice: овець
  rationale: Зберігає конкретний образ овець, а не узагальнює його як стадо.
- source_word: τῶν ἐρίφων
  choice: козлів
  rationale: Природно передає традиційну пару «овець — козлів»; точніше можливе значення молодих козлів зазначено у примітці.
theological_decisions:
- issue: Обсяг значення πάντα τὰ ἔθνη
  choice: усі народи
  alternative: усі люди; усі язичники
  rationale: Формулювання зберігає лексичну широту грецького вислову й не визначає наперед, чи йдеться про етнічні народи, людство загалом або лише неюдейські народи.
translation_notes:
  register: Сучасна стандартна українська, зрозуміла широкому колу читачів, зі стриманим урочистим тоном. Займенник «Ним/Він» написано з великої літери відповідно до поширеної української біблійної практики; синтаксис лишається близьким до грецького, але звучить природно.
