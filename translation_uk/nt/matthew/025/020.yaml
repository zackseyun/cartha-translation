  source_fidelity: 'Текст точно передає послідовність і зміст грецького оригіналу: слуга підходить, приносить додаткові п’ять талантів і повідомляє про здобутий приріст. «Ще п’ять талантів» належно відтворює ἄλλα πέντε τάλαντα, а «я здобув» — ἐκέρδησα без невиправданого уточнення способу прибутку.'
