id: MAT.25.20
reference: Matthew 25:20
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ὁ τὰ πέντε τάλαντα λαβὼν προσήνεγκεν ἄλλα πέντε τάλαντα λέγων· Κύριε, πέντε τάλαντά μοι παρέδωκας· ἴδε ἄλλα πέντε τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/020.yaml
  text: And the one who had received the five talents came forward and brought another five talents[a], saying, ‘Lord, you delivered five talents to me; look[b], I have gained another five talents.’
translation:
  language: uk
  text: 'І підійшов той, хто одержав п’ять талантів, і приніс ще п’ять талантів, кажучи: «Пане[a], ти передав мені п’ять талантів; ось, я здобув ще п’ять талантів[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «Господи» чи «Господарю». Грецьке слово κύριος може означати пана, господаря або Господа.
    reason: alternative_reading
  - marker: b
    text: Талант був великою ваговою та грошовою одиницею.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: підійшов
  rationale: Дієприкметник від προσέρχομαι передає наближення слуги до пана; особова форма природно відтворює грецьку конструкцію українською.
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: той, хто одержав п’ять талантів
  rationale: Означена дієприкметникова конструкція називає слугу через раніше одержане майно, не додаючи відсутнього в грецькому тексті слова «чоловік».
- source_word: τάλαντα
  choice: талантів
  rationale: Традиційний термін зберігає назву великої вагової та грошової одиниці й не звужує значення до конкретного металу.
- source_word: προσήνεγκεν
  choice: приніс
  rationale: У цій сцені προσφέρω означає принести додаткову суму панові; «приніс» є точним і природним.
- source_word: ἄλλα πέντε τάλαντα
  choice: ще п’ять талантів
  rationale: ἄλλα з числівником позначає додаткову рівну кількість; українське «ще п’ять» звучить природніше за буквальне «інші п’ять».
- source_word: Κύριε
  choice: Пане
  rationale: У межах притчі це пряме звертання слуги до свого пана; українське «Пане» природно передає соціальне значення κύριος, не усуваючи можливого ширшого відлуння.
- source_word: παρέδωκας
  choice: передав
  rationale: παραδίδωμι буквально означає передати або віддати; «передав мені» зберігає образ вручення без додавання прямо не висловленої ідеї довіри.
- source_word: ἴδε
  choice: ось
  rationale: ἴδε привертає увагу до наявного результату; в сучасній українській репліці «ось» природніше за архаїчне «поглянь» у цьому контексті.
- source_word: ἐκέρδησα
  choice: я здобув
  rationale: κερδαίνω означає здобути прибуток або приріст; «здобув» передає результат, не створюючи враження заробітної плати.
theological_decisions:
- issue: Передача κύριος у звертанні всередині притчі
  choice: Пане
  alternative: Господи; Господарю
  rationale: Безпосередньо слово позначає пана слуги. «Пане» є сучасним і природним звертанням та не нав’язує однозначного ототожнення персонажа, водночас примітка зберігає ширший діапазон κύριος.
translation_notes:
  register: Сучасна стандартна українська, природна пряма мова й помірно урочистий біблійний тон. Повторення «п’ять талантів» збережено для риторичної паралельності оригіналу; грецькі дієприкметникові конструкції перебудовано відповідно до українського синтаксису.
