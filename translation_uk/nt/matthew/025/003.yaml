  text: ⸂αἱ γὰρ⸃ μωραὶ λαβοῦσαι τὰς λαμπάδας αὐτῶν οὐκ ἔλαβον μεθ’ ἑαυτῶν ἔλαιον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/003.yaml
  text: For the foolish[a], when they took their lamps, did not take oil with them.
translation:
  language: uk
  text: Адже нерозумні, взявши свої світильники[a], не взяли з собою олії.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «смолоскипи».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Адже
  rationale: Сполучник пояснює попереднє твердження і природно передає причинно-пояснювальний зв’язок.
- source_word: μωραὶ
  choice: нерозумні
  rationale: Субстантивований прикметник жіночого роду множини відсилає до дів із попереднього контексту; стислий переклад не повторює іменника без потреби.
- source_word: λαβοῦσαι
  choice: взявши
  rationale: Дієприслівник природно передає аористовий дієприкметник і дію, що супроводжує головну.
- source_word: λαμπάδας
  choice: світильники
  rationale: «Світильники» є природним традиційним відповідником у контексті олії; можливе значення «смолоскипи» збережено в примітці.
- source_word: οὐκ ἔλαβον
  choice: не взяли
  rationale: 'Зберігає лексичний повтор із λαβοῦσαι: «взявши — не взяли».'
- source_word: μεθ’ ἑαυτῶν
  choice: з собою
  rationale: Усталений сучасний український відповідник звороту з рефлексивним займенником.
- source_word: ἔλαιον
  choice: олії
  rationale: Прямий відповідник; у контексті йдеться про олію для світильників.
