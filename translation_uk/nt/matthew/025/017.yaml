lexical_decisions:
- source_word: ὡσαύτως
  choice: Так само
  rationale: Прислівник пов’язує дії цього слуги з діями попереднього у в. 16 та природно передає порівняльне значення.
- source_word: ὁ τὰ δύο
  choice: той, що мав два
  rationale: Артикльована еліптична конструкція позначає слугу, пов’язаного з двома талантами з контексту; переклад зберігає стислість оригіналу, не додаючи прямо «одержав».
- source_word: ἐκέρδησεν
  choice: здобув
  rationale: У фінансовому контексті дієслово означає отримання додаткового прибутку; «здобув» не звужує значення до заробітної плати.
- source_word: ἄλλα δύο
  choice: ще два
  rationale: Передає додаткові два предмети того самого виду й природно звучить сучасною українською.
