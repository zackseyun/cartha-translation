  text: Тож пильнуйте[a], бо не знаєте ні дня, ні години.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «не спіть», «будьте пильні» чи «будьте напоготові». Грецька форма наказу передає постійну пильність.'
