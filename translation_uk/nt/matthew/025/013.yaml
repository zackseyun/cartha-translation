lexical_decisions:
- source_word: γρηγορεῖτε
  choice: пильнуйте
  rationale: Теперішній наказовий спосіб у множині передає тривалу, постійну пильність. Українське «пильнуйте» природно охоплює як образ неспання в контексті притчі, так і заклик бути напоготові.
- source_word: οὖν
  choice: тож
  rationale: Позначає висновок із попередньої притчі; «тож» стисло й природно передає логічний зв’язок.
- source_word: ὅτι
  choice: бо
  rationale: Вводить причину наказу й у сучасній українській природно передає причинне значення.
- source_word: οὐκ οἴδατε
  choice: не знаєте
  rationale: Прямо відтворює заперечену форму дієслова знання у другій особі множини без невиправданого уточнення.
- source_word: τὴν ἡμέραν
  choice: дня
  rationale: У конструкції «не знаєте ні дня» родовий відмінок є нормативним українським відповідником грецького знахідного при запереченні; означеність зрозуміла з контексту.
- source_word: οὐδὲ τὴν ὥραν
  choice: ні години
  rationale: Парна конструкція «ні дня, ні години» природно передає додатковий заперечений елемент οὐδέ та зберігає усталений ритм вислову.
theological_decisions:
- issue: Образ пильності в наказі
  choice: пильнуйте
  alternative: не спіть; будьте пильні; будьте напоготові
  rationale: «Пильнуйте» зберігає образ неспання і водночас передає тривалу духовну готовність, не звужуючи вислів до буквального позбавлення сну й не нав’язуючи окремої есхатологічної схеми.
- issue: Зміст вислову «дня, ні години»
  choice: залишити вислів без пояснювального доповнення
  alternative: дня чи години приходу Сина Людського; призначеного часу
  rationale: Хоч ширший контекст стосується приходу та суду, сам вірш називає лише «день» і «годину». Переклад не додає того, чого немає в грецькому тексті.
translation_notes:
  register: Сучасна, стисла й гідна українська мова. «Тож» природно пов’язує висновок із притчею, а «пильнуйте» зберігає образність і тривалий характер наказу.
