reference: Matthew 25:29
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: τῷ γὰρ ἔχοντι παντὶ δοθήσεται καὶ περισσευθήσεται· ⸂τοῦ δὲ⸃ μὴ ἔχοντος καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/029.yaml
  text: For to everyone who has[a], more will be given, and he will have an abundance; but from the one who does not have, even what he has will be taken away from him.
translation:
  language: uk
  text: Бо кожному, хто має, буде дано, і він матиме надлишок[a]; а в того, хто не має, буде забрано навіть те, що він має.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «і він матиме вдосталь».'
    reason: Лексема περισσεύω може описувати стан достатку або надлишку; примітка подає природний український альтернативний відповідник.
lexical_decisions:
- source_word: τῷ γὰρ ἔχοντι παντὶ
  choice: Бо кожному, хто має
  rationale: Давальний відмінок субстантивованого дієприкметника з παντί має узагальнювально-розподільне значення. «Кожному, хто має» природно передає його українською, а «бо» зберігає пояснювальну функцію γάρ.
- source_word: δοθήσεται
  choice: буде дано
  rationale: Майбутній пасив від δίδωμι передано безособовою пасивною конструкцією, природною для сучасної української та такою, що не називає діяча.
- source_word: περισσευθήσεται
  choice: він матиме надміру
  rationale: Форма позначає стан достатку або надлишку як наслідок того, що було дано. «Матиме надміру» зберігає думку про надлишок і не додає невираженого в грецькому тексті додатка.
- source_word: τοῦ δὲ μὴ ἔχοντος
  choice: а в того, хто не має
  rationale: Генетивна конструкція готує позначення особи, від якої щось буде забрано. «А в того» природно передає відокремлення разом із наступним пасивним присудком, а «хто не має» зберігає узагальнювальну однину.
- source_word: καὶ ὃ ἔχει
  choice: навіть те, що він має
  rationale: 'καί має підсилювальне значення «навіть», наголошуючи на парадоксі: буде відібрано й наявне в нього.'
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: буде забрано ... в того
  rationale: Майбутній пасив αἴρω зі зворотом ἀπό виражає відібрання або усунення від особи. Українська конструкція «буде забрано в того» ясно передає і пасивність, і відокремлення.
theological_decisions:
- issue: Узагальнювальна особа в конструкціях із дієприкметниками чоловічого роду
  choice: 'Зберегти представницьку однину: «кожному, хто має ... він» і «в того, хто не має ... він»'
  alternative: 'Передати множиною: «усім, хто має ... вони»'
  rationale: Грецький текст послідовно використовує граматичну однину з узагальнювальним значенням. Українська представницька однина природна й зберігає структуру вислову без звуження його застосування лише до чоловіків.
- issue: Неназваний діяч пасивних форм
  choice: Зберегти пасивні конструкції «буде дано» і «буде забрано»
  alternative: 'Назвати Бога як діяча: «Бог дасть» і «Бог забере»'
  rationale: У контексті можливе розуміння божественної дії, однак грецький текст прямо не називає діяча. Переклад не повинен мовчки усувати цю формальну й богословську відкритість.
translation_notes:
  register: Сучасна літературна українська з гідним, афористичним звучанням. Збережено пояснювальне «бо», контраст «а» та паралельну однину обох частин. Маркер примітки поставлено безпосередньо після вислову, якого вона стосується.
