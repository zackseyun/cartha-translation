lexical_decisions:
- source_word: ἐπείνασα
  choice: я був голодний
  rationale: Аорист передає пережитий у минулому стан; цей вислів природніший у сучасній українській, ніж буквальне «я голодував».
- source_word: γὰρ
  choice: бо
  rationale: Сполучник вводить пояснення попереднього твердження й природно передається українським «бо».
- source_word: ἐδώκατέ μοι φαγεῖν
  choice: ви дали мені їсти
  rationale: Конструкція з інфінітивом означає надати комусь їжу; український вислів стислий, природний і не додає конкретного виду їжі.
- source_word: ἐδίψησα
  choice: був спраглий
  rationale: Передає стан спраги в минулому; пропуск повторного займенника природний в українському паралелізмі й не змінює суб’єкта.
- source_word: ἐποτίσατέ με
  choice: ви напоїли мене
  rationale: Дієслово ποτίζω у цьому контексті означає дати пити; «напоїли» точно й природно відтворює милосердну дію без невиправданого уточнення напою.
- source_word: ξένος
  choice: чужинцем
  rationale: Слово позначає людину, яка є чужою для певного кола й потребує гостинного прийняття; «чужинець» зберігає цю соціальну відчуженість, не звужуючи значення до юридичного статусу іноземця.
- source_word: συνηγάγετέ με
  choice: ви прийняли мене
  rationale: Хоча συνάγω буквально пов’язане зі збиранням або приведенням разом, у сполученні з ξένος тут ідеться про гостинне прийняття. «Прийняли мене» звучить природно й не додає відсутнього в грецькому тексті прямого уточнення «до дому».
theological_decisions:
- issue: Гостинність у вислові ξένος ... συνηγάγετέ με
  choice: «був чужинцем, і ви прийняли мене»
  alternative: «був чужинцем, і ви дали мені притулок»
  rationale: Обраний варіант передає особисте гостинне прийняття вразливої людини, але не звужує дію до надання житла й не переносить у текст сучасних політичних або юридичних категорій.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Збережено три паралельні твердження та пояснювальний сполучник «бо». Займенники на позначення мовця подано з малої літери, оскільки велика літера є пізнішою конфесійно-видавничою практикою, не позначеною в грецькому тексті.
