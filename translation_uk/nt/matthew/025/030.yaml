  text: καὶ τὸν ἀχρεῖον δοῦλον ἐκβάλετε εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/030.yaml
  text: And throw the worthless servant into the outer darkness[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: uk
  text: А нікчемного раба[a] викиньте у зовнішню темряву. Там буде плач і скрегіт зубів.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «слугу». Грецьке слово δοῦλος може означати «раба» або «слугу»; тут ужито «раб», оскільки в притчі виразно йдеться про залежне становище людини щодо пана.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀχρεῖον
  choice: непридатного
  rationale: Передає оцінку раба як такого, що не приніс користі й не виконав свого призначення, не додаючи відтінку моральної нікчемності понад контекст.
- source_word: δοῦλον
  choice: раба
  rationale: У контексті притчі про пана та підлеглих δοῦλος позначає людину в рабському становищі; «раб» точніше за загальніше «слуга» відтворює цей соціальний зв’язок.
- source_word: ἐκβάλετε
  choice: викиньте
  rationale: Наказовий аорист має різку, рішучу силу; «викиньте» природно передає насильницьке видалення.
- source_word: σκότος τὸ ἐξώτερον
  choice: темряву зовнішню
  rationale: Зберігає усталений у Матвія образ темряви поза місцем прийняття й радості, не розгортаючи його в доктринальне пояснення.
- source_word: ἐκεῖ
  choice: Там
  rationale: Стисло й природно вказує на щойно назване місце.
- source_word: κλαυθμὸς
  choice: плач
  rationale: Точно передає горе в повторюваній формулі Матвія без додаткового уточнення інтенсивності.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: скрегіт зубів
  rationale: Усталений український відповідник, який зберігає образ муки та/або люті, не звужуючи його значення.
theological_decisions:
- issue: Характер образу суду в притчі
  choice: Збережено образи вигнання в зовнішню темряву, плачу й скреготу зубів без прямого ототожнення з пеклом чи докладного визначення покарання.
  alternative: Безпосередньо пояснити образ як пекло або, навпаки, як тимчасове чи лише метафоричне відкинення.
  rationale: Грецький текст використовує характерну для Матвія мову суду, але не дає тут подальшого пояснення; переклад має зберегти цю богословську напругу.
translation_notes:
  register: Сучасна нормативна українська мова; стиль стислий, урочистий і зрозумілий. Збережено характерну біблійну формулу «плач і скрегіт зубів» та вираз «темрява зовнішня».
