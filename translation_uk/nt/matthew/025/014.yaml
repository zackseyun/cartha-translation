  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Ὥσπερ γὰρ ἄνθρωπος ἀποδημῶν ἐκάλεσεν τοὺς ἰδίους δούλους καὶ παρέδωκεν αὐτοῖς τὰ ὑπάρχοντα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/014.yaml
  text: For it is like a man going on a journey[a], who called his own servants and entrusted his possessions to them.
translation:
  language: uk
  text: Бо це — як один чоловік, який, вирушаючи в подорож, покликав своїх рабів[a] і довірив їм своє майно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «слуг». Грецьке слово δοῦλος може означати раба або слугу залежно від контексту; тут «рабів» передає виразну владу господаря над ними.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὥσπερ γὰρ
  choice: Адже це — як
  rationale: Ὥσπερ вводить порівняння, а γὰρ пов’язує його з попереднім висловом як пояснення. Додане «це» природно передає грецьку еліптичну конструкцію українською, не уточнюючи її понад контекст.
- source_word: ἄνθρωπος
  choice: чоловік
  rationale: У цій притчі іменник позначає конкретного господаря чоловічої статі, а не людину загалом.
- source_word: ἀποδημῶν
  choice: вирушаючи в подорож
  rationale: Дієприкметник означає відбуття в інше місце, часто на певний час; цей вислів природний українською і не додає припущення про поїздку за кордон.
- source_word: ἐκάλεσεν
  choice: покликав
  rationale: Прямий і природний відповідник; владний характер дії достатньо зрозумілий із відносин господаря та рабів.
- source_word: τοὺς ἰδίους δούλους
  choice: своїх рабів
  rationale: ἰδίους підкреслює, що вони належать до його власного дому, а δοῦλος у цьому господарському контексті позначає невільний статус і владу господаря; «своїх» стисло передає обидва займенникові компоненти.
- source_word: παρέδωκεν
  choice: довірив
  rationale: У контексті передання майна під відповідальність цей відповідник природніше за буквальне «передав» виражає доручене управління.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: своє майно
  rationale: Субстантивований вислів означає те, що належало чоловікові; «майно» точно й природно відповідає економічному контексту притчі.
theological_decisions:
- issue: Передача δοῦλος у контексті домашнього господарства притчі
  choice: раби
  alternative: слуги; невільники
  rationale: «Раби» зберігає виражений у контексті правовий і соціальний статус під владою господаря та не пом’якшує його до добровільної служби. Водночас примітка подає можливий контекстуальний відповідник «слуги».
- issue: Еліптичне порівняння Ὥσπερ γὰρ
  choice: Адже це — як
  alternative: Бо так само, як
  rationale: Обраний варіант дає природний початок речення українською, зберігаючи залежність образу від попереднього контексту й не називаючи прямо Царство там, де цього немає в грецькому тексті.
translation_notes:
  register: Сучасна нормативна українська мова, проста й гідна оповідна манера. Конструкція «Адже це — як» зберігає зв’язок із попереднім віршем, а дієприслівниковий зворот передає часову супровідність грецького дієприкметника.
