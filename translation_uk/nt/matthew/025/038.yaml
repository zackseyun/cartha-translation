id: MAT.25.38
reference: Matthew 25:38
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: πότε δέ σε εἴδομεν ξένον καὶ συνηγάγομεν, ἢ γυμνὸν καὶ περιεβάλομεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/038.yaml
  text: And when did we see you as a stranger and take you in[c][b][a], or naked and clothe you?
translation:
  language: uk
  text: Коли ж ми бачили тебе чужинцем[a] і прийняли до себе[b], або нагим[c] і одягнули?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «незнайомцем» чи «стороннім». Грецьке слово може означати людину, чужу для певного кола, зокрема того, хто потребує гостинного прийняття; воно не обов’язково вказує на іноземне походження.
    reason: lexical_alternative
  - marker: b
    text: Буквально — «зібрали» або «прийняли»; у цьому контексті йдеться про те, щоб гостинно прийняти людину до себе.
    reason: lexical_alternative
  - marker: c
    text: Або «без належного одягу». Грецьке слово може означати як наготу, так і брак достатнього одягу.
    reason: lexical_alternative
lexical_decisions:
- source_word: πότε δέ
  choice: Коли ж
  rationale: «Коли» природно передає питальний прислівник πότε, а частка «ж» легко пов’язує запитання з попереднім переліком, не створюючи надмірного протиставлення.
- source_word: σε εἴδομεν
  choice: ми бачили тебе
  rationale: Передає аорист εἴδομεν як минулу дію та зберігає прямий додаток σε; українська питальна конструкція не потребує допоміжного дієслова.
- source_word: ξένον
  choice: чужинцем
  rationale: 'Орудний відмінок природно передає предикативне значення: вони побачили його як людину, чужу для їхнього кола й таку, що потребувала гостинності. Слово не обмежує значення лише громадянством чи етнічним походженням.'
- source_word: συνηγάγομεν
  choice: прийняли до себе
  rationale: У цьому контексті συνάγω означає не просто «зібрати», а гостинно прийняти людину, давши їй прихисток. Вислів є природним і зрозумілим сучасною українською.
- source_word: ἢ γυμνὸν
  choice: або нагим
  rationale: «Або» точно передає ἢ, а «нагим» зберігає пряме значення γυμνός, не усуваючи можливого ширшого сенсу — без достатнього одягу.
- source_word: περιεβάλομεν
  choice: одягнули
  rationale: У цьому вживанні περιβάλλω означає дати або надіти на когось одяг; «одягнули» стисло й природно передає дію.
theological_decisions:
- issue: Значення ξένος у контексті суду й діл милосердя
  choice: чужинець
  alternative: незнайомець; чужоземець
  rationale: «Чужинець» зберігає соціальний образ людини з-поза свого кола, яка потребує прийняття, але не звужує вислів до національної чи правової категорії «чужоземця».
- issue: Діапазон значення γυμνός
  choice: нагий
  alternative: погано одягнений; без належного одягу
  rationale: Прямий відповідник зберігає сильний образ оригіналу, тоді як примітка вказує на можливе ширше значення й не змушує обирати лише буквальну повну наготу.
translation_notes:
  register: Сучасна, проста й гідна українська мова. Збережено паралельну будову двох запитань. Займенник «тебе» подано з малої літери, оскільки грецький текст не позначає особливого шанобливого написання, а особу співрозмовника вже визначає контекст.
