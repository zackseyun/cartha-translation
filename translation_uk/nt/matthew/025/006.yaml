lexical_decisions:
- source_word: μέσης δὲ νυκτός
  choice: А опівночі
  rationale: Грецька часова конструкція природно означає «опівночі», а δέ передано м’яким розповідним переходом «а».
- source_word: κραυγὴ γέγονεν
  choice: пролунав крик
  rationale: Це природно передає раптову появу гучного вигуку; перфект γέγονεν тут повідомляє про настання події.
- source_word: Ἰδού
  choice: Ось
  rationale: «Ось» є сучасним українським засобом привернення уваги й не має архаїчного відтінку.
- source_word: ὁ νυμφίος
  choice: молодий
  rationale: У весільному контексті «молодий» природно й точно позначає нареченого та зберігає образ притчі.
- source_word: ἐξέρχεσθε
  choice: Виходьте
  rationale: Форма наказового способу закликає слухачів вийти з місця, де вони перебувають; українське «виходьте» не нав’язує зайвої перспективи «йдіть/приходьте».
- source_word: εἰς ἀπάντησιν αὐτοῦ
  choice: йому назустріч
  rationale: Усталена українська конструкція стисло й точно передає рух для зустрічі з ним.
theological_decisions:
- issue: Притчевий референт ὁ νυμφίος
  choice: молодий, з малої літери
  alternative: Молодий / Наречений, з великої літери
  rationale: На буквальному рівні притчі йдеться про учасника весілля. Мала літера не вносить у переклад явного христологічного ототожнення, хоча ширший контекст допускає його тлумачення.
translation_notes:
  register: Сучасна, природна й гідна українська оповідна мова. «Пролунав крик» зберігає раптовість сцени, а «молодий» відповідає живому українському весільному слововжитку.
