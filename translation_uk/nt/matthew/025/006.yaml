  yaml_path: translation/nt/matthew/025/006.yaml
  text: 'But at midnight a cry rang out: ‘Look[b][a], the bridegroom! Come out to meet him.’'
translation:
  language: uk
  text: 'А опівночі пролунав крик: «Ось[a] молодий! Виходьте йому назустріч».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Дивіться: молодий!»'
