  text: Ὅταν δὲ ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ δόξῃ αὐτοῦ καὶ πάντες ⸀οἱ ἄγγελοι μετ’ αὐτοῦ, τότε καθίσει ἐπὶ θρόνου δόξης αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/031.yaml
  text: But when the Son of Man comes in his glory[a], and all the angels with him, then he will sit on his glorious throne.
translation:
  language: uk
  text: А коли Син Людський прийде у своїй славі й усі ангели з Ним, тоді Він сяде на престолі Своєї слави.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «на Своєму славному престолі».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: А коли
  rationale: Природно передає часову конструкцію майбутньої одноразової події та м’який перехід δὲ без надмірного протиставлення.
- source_word: ἔλθῃ
  choice: прийде
  rationale: Аорист кон’юнктива після ὅταν стосується майбутньої події; українська нормативно вживає майбутній час у такому підрядному реченні.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Син Людський
  rationale: Усталений біблійний титул, що зберігає зв’язок із Даниїла 7 та христологічну вагу вислову.
- source_word: ἐν τῇ δόξῃ αὐτοῦ
  choice: у своїй славі
  rationale: Передає явлену велич і честь; «слава» зберігає біблійний богословський резонанс.
- source_word: πάντες οἱ ἄγγελοι
  choice: усі ангели
  rationale: Точно відтворює грецький текст, у якому при «ангели» немає присвійного займенника.
- source_word: μετ’ αὐτοῦ
  choice: з Ним
  rationale: Прямо й природно передає значення супроводу.
- source_word: τότε καθίσει
  choice: тоді Він сяде
  rationale: Зберігає часову послідовність і активну форму майбутнього часу.
- source_word: ἐπὶ θρόνου δόξης αὐτοῦ
  choice: на престолі Своєї слави
  rationale: Близько відтворює генітивну конструкцію й водночас звучить природно та урочисто українською.
theological_decisions:
- issue: Христологічний титул ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Син Людський
  alternative: Людський Син / Той, хто є людиною
  rationale: Усталений титул не звужує його до звичайного позначення людини й зберігає даніїлівське тло царської та судової ролі.
- issue: Генітивна конструкція θρόνου δόξης αὐτοῦ
  choice: на престолі Своєї слави
  alternative: на Своєму славному престолі
  rationale: Формальніший варіант зберігає можливий зв’язок престолу саме зі славою Сина Людського, не зводячи вислів лише до якісного прикметника.
translation_notes:
  register: Сучасна літературна українська з урочистим біблійним регістром. Займенники, що стосуються Сина Людського, написано з великої літери згідно з поширеною українською релігійною практикою; синтаксис лишається ясним для широкого читача.
