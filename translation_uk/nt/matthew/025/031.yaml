  verdict: approve
  source_fidelity: Текст точно передає часово-умовну майбутню конструкцію Ὅταν δὲ ... ἔλθῃ («А коли ... прийде»), титул ὁ υἱὸς τοῦ ἀνθρώπου («Син Людський»), супровід усіх ангелів, послідовність τότε та майбутню дію καθίσει. «На престолі Своєї слави» є близьким і граматично можливим переданням ἐπὶ θρόνου δόξης αὐτοῦ, не нав’язуючи артиклевого значення, якого в грецькій немає.
  naturalness: Фраза звучить природно в сучасній літературній українській і водночас зберігає доречний урочистий біблійний регістр. «А коли» добре передає м’який дискурсивний перехід δέ. Написання займенників з великої літери відповідає поширеній релігійній редакційній практиці й не змінює змісту.
  terminology: «Син Людський» — усталений та точний відповідник титулу. «Слава», «ангели» і «престол» доречні в цьому реєстрі. Примітка коректно подає ідіоматичніший альтернативний варіант «на Своєму славному престолі»; її маркер належно прив’язано до відповідного вислову.
