source:
  edition: SBLGNT
  text: γυμνὸς καὶ περιεβάλετέ με, ἠσθένησα καὶ ἐπεσκέψασθέ με, ἐν φυλακῇ ἤμην καὶ ἤλθατε πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/036.yaml
  text: I was naked and you clothed me[a]; I was sick and you visited me[b]; I was in prison and you came to me.
translation:
  language: uk
  text: Я був без одягу — і ви одягнули Мене; хворів — і ви відвідали Мене[a]; був у в’язниці — і ви прийшли до Мене.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «подбали про Мене»; грецьке дієслово може означати відвідування з турботою чи піклуванням.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυμνὸς
  choice: нагий
  rationale: Прямо передає значення «без одягу» й природно співвідноситься з дією «одягнули»; у контексті також може йтися про брак належного одягу.
- source_word: περιεβάλετέ
  choice: одягнули
  rationale: Дієслово περιβάλλω тут означає покласти або накинути на когось одяг; «одягнули» стисло й природно передає конкретну дію.
- source_word: ἠσθένησα
  choice: хворів
  rationale: Хоча дієслово може ширше означати слабкість, у цьому контексті милосердної допомоги воно найімовірніше стосується хвороби.
- source_word: ἐπεσκέψασθέ
  choice: відвідали
  rationale: Передає основне значення дієслова ἐπισκέπτομαι, не усуваючи можливого відтінку турботливого відвідування, зазначеного у примітці.
- source_word: φυλακῇ
  choice: в’язниці
  rationale: Природний сучасний український відповідник для місця ув’язнення в цьому контексті.
- source_word: ἤλθατε πρός με
  choice: прийшли до Мене
  rationale: Буквально й природно відтворює простий грецький вислів, не додаючи значення «відвідали», уже наявного в попередній частині.
theological_decisions:
- issue: Ступінь тлумачного розширення у переліку вчинків милосердя
  choice: Збережено конкретні дії «одягнули», «відвідали» та «прийшли до Мене» без розгорнутого перефразування.
  alternative: Передати ἐπεσκέψασθέ με як «подбали про Мене», а ἤλθατε πρός με як «прийшли відвідати Мене».
  rationale: Грецький текст називає прості, відчутні вчинки милосердя. Пряме формулювання не нав’язує ширшого пастирського чи богословського пояснення та зберігає відмінність між двома діями.
translation_notes:
  register: Сучасна стандартна українська, проста й гідна оповідна мова. Еліптичне «Був нагий», «хворів», «був у в’язниці» природно продовжує пряму мову та уникає зайвого повторення займенника. Великі літери в «Мене» відповідають усталеному українському біблійному оформленню мови Христа.
