  text: τότε ἐρεῖ καὶ τοῖς ἐξ εὐωνύμων· Πορεύεσθε ἀπ’ ἐμοῦ ⸀οἱ κατηραμένοι εἰς τὸ πῦρ τὸ αἰώνιον τὸ ἡτοιμασμένον τῷ διαβόλῳ καὶ τοῖς ἀγγέλοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/041.yaml
  text: Then he will also say to those on the left[a], ‘Go away from me, you cursed, into the eternal fire prepared for the devil and his angels.’
translation:
  language: uk
  text: 'Тоді він скаже й тим, хто ліворуч: «Ідіть геть від мене, прокляті, у вічний вогонь, приготований дияволові та його ангелам».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Тоді
  rationale: Природно передає часову послідовність у сцені суду.
- source_word: ἐρεῖ
  choice: він скаже
  rationale: Точно передає майбутній час λέγω, не додаючи сили, якої немає в грецькому тексті.
- source_word: τοῖς ἐξ εὐωνύμων
  choice: тим, хто ліворуч
  rationale: Природний сучасний український відповідник для групи, розташованої ліворуч від царя в безпосередньому контексті.
- source_word: Πορεύεσθε ἀπ’ ἐμοῦ
  choice: Ідіть від мене
  rationale: Передає наказ залишити присутність мовця та зберігає значення відокремлення, виражене ἀπό.
- source_word: οἱ κατηραμένοι
  choice: прокляті
  rationale: Стисло й виразно відтворює перфектний пасивний дієприкметник у функції звертання.
- source_word: εἰς τὸ πῦρ τὸ αἰώνιον
  choice: у вічний вогонь
  rationale: Прийменник «у» передає рух до місця призначення, а «вічний» є звичайним і контекстуально належним відповідником αἰώνιος.
- source_word: τὸ ἡτοιμασμένον
  choice: приготований
  rationale: Передає результат попередньої підготовки, виражений перфектним пасивним дієприкметником.
- source_word: τῷ διαβόλῳ
  choice: дияволові
  rationale: У контексті остаточного суду διάβολος є усталеним особовим позначенням, а не загальною назвою наклепника.
- source_word: τοῖς ἀγγέλοις αὐτοῦ
  choice: його ангелам
  rationale: У цьому есхатологічному контексті ἄγγελοι означає надприродних істот, пов’язаних із дияволом, а не людських посланців.
theological_decisions:
- issue: Значення αἰώνιον у контексті суду
  choice: вічний
  alternative: довічний; віковічний; належний до віку
  rationale: «Вічний» найприродніше передає αἰώνιος у цьому контексті та зберігає вагу вислову, не розгортаючи в перекладі окремої доктринальної системи.
- issue: Референти διάβολος та ἄγγελοι
  choice: диявол і його ангели
  alternative: наклепник і його посланці
  rationale: Есхатологічний контекст і усталене вживання вказують на диявола та пов’язаних із ним надприродних істот; загальні назви тут недопередали б зміст.
translation_notes:
  register: Сучасна нормативна українська мова; пряме звертання збережено стислим і урочистим без архаїзації. Займенники щодо мовця подано з малої літери відповідно до звичайної сучасної орфографічної практики.
