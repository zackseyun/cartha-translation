source:
  edition: SBLGNT
  text: ἀπεκρίθησαν δὲ αἱ φρόνιμοι λέγουσαι· Μήποτε ⸂οὐ μὴ⸃ ἀρκέσῃ ἡμῖν καὶ ὑμῖν· ⸀πορεύεσθε μᾶλλον πρὸς τοὺς πωλοῦντας καὶ ἀγοράσατε ἑαυταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/009.yaml
  text: But the wise answered[a], saying, ‘No, lest there not be enough for us and for you. Go instead to those who sell, and buy for yourselves.’
translation:
  language: uk
  text: 'А розсудливі відповіли: «Ні, бо може не вистачити і нам, і вам.[a] Краще підіть до тих, хто продає, і купіть собі».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальніше: «щоб часом аж ніяк не вистачило і нам, і вам». У грецькому тексті після виразу побоювання стоїть посилене заперечення, яке наголошує на серйозній небезпеці нестачі.'
    reason: Збереження сили незвичної грецької заперечної конструкції та її формальнішої альтернативи.
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: відповіли
  rationale: Звичайний український відповідник наративного дієслова відповіді; природно вводить репліку.
- source_word: αἱ φρόνιμοι
  choice: розсудливі
  rationale: Субстантивований прикметник жіночого роду позначає вже згаданих дівчат; «розсудливі» передає практичну далекоглядність φρόνιμος без додавання іменника.
- source_word: λέγουσαι
  choice: не відтворено окремим словом
  rationale: Після «відповіли» окреме «кажучи» було б неприродним дублюванням в сучасній українській; двокрапка безпосередньо вводить їхню мову.
- source_word: Μήποτε οὐ μὴ ἀρκέσῃ
  choice: Ні, бо може не вистачити
  rationale: Передає рішучу відмову та сильне побоювання, що запасу виявиться недостатньо; складну грецьку конструкцію з μήποτε й посиленим запереченням пояснено в примітці.
- source_word: ἀρκέσῃ
  choice: не вистачити
  rationale: Природний сучасний вислів про недостатню кількість запасу.
- source_word: ἡμῖν καὶ ὑμῖν
  choice: і нам, і вам
  rationale: Повторюваний сполучник природно підкреслює обидві групи та передає давальний відмінок зацікавленої особи.
- source_word: πορεύεσθε
  choice: підіть
  rationale: Доконий наказовий спосіб природно виражає конкретну запропоновану дію.
- source_word: μᾶλλον
  choice: краще
  rationale: Позначає кращу альтернативу попередньому проханню.
- source_word: πρὸς τοὺς πωλοῦντας
  choice: до тих, хто продає
  rationale: Зберігає субстантивоване значення дієприкметника, не додаючи прямо назви товару, яка зрозуміла з контексту.
- source_word: ἀγοράσατε ἑαυταῖς
  choice: купіть собі
  rationale: Стисло й природно передає наказ та зворотний давальний, тобто купівлю для власного користування.
theological_decisions: []
translation_notes:
  register: Сучасна стандартна українська, проста й гідна оповідна мова. Репліку зроблено природною для усного діалогу, а незвичну силу грецького заперечення збережено через рішуче «Ні» та пояснено в примітці.
