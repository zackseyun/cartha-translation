source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ βασιλεὺς ἐρεῖ αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐφ’ ὅσον ἐποιήσατε ἑνὶ τούτων τῶν ἀδελφῶν μου τῶν ἐλαχίστων, ἐμοὶ ἐποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/040.yaml
  text: And the King will answer them[a], ‘Truly I say to you, insofar as you did it to one of the least of these brothers of mine[b], you did it to me.’
translation:
  language: uk
  text: 'І Цар відповість їм: «Істинно[a] кажу вам: тією мірою, якою ви зробили це одному з цих Моїх найменших братів[b], ви зробили це Мені».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або, буквальніше: «Амінь, кажу вам».'
    reason: lexical_alternative
  - marker: b
    text: «Братів» передає грецький іменник у формі чоловічого роду множини. Вислів «ці Мої найменші брати» може означати учнів Ісуса зокрема, віруючих загалом або, ширше, вразливих людей; переклад зберігає формулювання, не вирішуючи цього питання.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς … ἐρεῖ
  choice: відповість
  rationale: Дієприкметник разом із майбутньою формою дієслова природно передається українським особовим дієсловом «відповість», яке зберігає значення реакції на попередні слова.
- source_word: ὁ βασιλεὺς
  choice: Цар
  rationale: «Цар» точно передає царський титул; велика літера відповідає контексту, де цей образ позначає есхатологічного Суддю.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Істинно кажу вам
  rationale: Усталена й зрозуміла українська передача урочистої формули Ісуса; примітка зберігає можливість формальнішого «Амінь».
- source_word: ἐφ’ ὅσον
  choice: оскільки
  rationale: У контексті конструкція співвідносить учинок щодо одного з названих людей з учинком щодо Царя. «Оскільки» звучить природно, не перетворюючи вислів на причинне богословське пояснення.
- source_word: ἐποιήσατε
  choice: ви зробили це
  rationale: Займенник «це» природно відтворює маований із контексту вчинок і зберігає повтор та паралелізм двох частин вислову.
- source_word: ἑνὶ τούτων
  choice: одному з цих
  rationale: Передає давальний відмінок, одиничність ἑνί та вказівний займенник τούτων.
- source_word: τῶν ἀδελφῶν μου τῶν ἐλαχίστων
  choice: Моїх найменших братів
  rationale: «Братів» зберігає чоловічий множинний іменник, а «найменших» — суперлатив зі значенням найнижчого становища або значущості, не звужуючи його до конкретної соціальної категорії.
- source_word: ἐμοὶ
  choice: Мені
  rationale: Давальний відмінок прямо зберігає ототожнення вчиненого братові з учиненим Цареві.
theological_decisions:
- issue: Кого означають слова «ці Мої найменші брати»
  choice: Збережено буквальне формулювання без уточнення кола осіб.
  alternative: Учні або посланці Ісуса; усі віруючі; нужденні чи вразливі загалом.
  rationale: Сам вірш не розв’язує однозначно питання про референта, тому переклад не нав’язує жодного з основних тлумачень.
- issue: Гендерна передача ἀδελφῶν
  choice: братів
  alternative: братів і сестер; ближніх
  rationale: Грецьке слово має форму чоловічого роду множини. Розширення або нейтралізація тут водночас вирішувало б спірне питання про склад названої групи.
translation_notes:
  register: Сучасна нормативна українська мова з урочистим, але доступним біблійним звучанням. Збережено лаконічний паралелізм оригіналу та повтор «ви зробили це».
