  text: χρονίζοντος δὲ τοῦ νυμφίου ἐνύσταξαν πᾶσαι καὶ ἐκάθευδον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/005.yaml
  text: But while the bridegroom was delayed[b][a], they all became drowsy and fell asleep.
translation:
  language: uk
  text: Коли ж молодий забарився[a], усі вони стали сонними й спали[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «довго не приходив».'
    reason: Лексична альтернатива, яка виразніше передає тривалість, закладену в χρονίζω.
  - marker: b
    text: 'Або: «усі вони стали сонними й заснули». Грецький текст розрізняє настання сонливості (ἐνύσταξαν) і стан сну, переданий імперфектом (ἐκάθευδον).'
    reason: Лексико-аспектуальна альтернатива для грецького імперфекта.
lexical_decisions:
- source_word: χρονίζοντος
  choice: забарився
  rationale: Дієслово χρονίζω означає затримуватися або витрачати більше часу, ніж очікувалося. «Забарився» природно передає це українською, не уточнюючи причини затримки.
- source_word: δὲ
  choice: ж
  rationale: Частка «ж» природно позначає легкий контраст і подальший розвиток оповіді без надмірно сильного протиставлення.
- source_word: νυμφίου
  choice: молодий
  rationale: У весільному контексті «молодий» є природним українським позначенням чоловіка, який одружується, і зберігає образ притчі.
- source_word: ἐνύσταξαν
  choice: усіх їх почало хилити на сон
  rationale: Так передано початок сонливості, відмінний від наступного стану сну; водночас вислів звучить природно сучасною українською.
- source_word: πᾶσαι
  choice: усіх їх
  rationale: Форма жіночого роду стосується всіх десяти дів; український вислів чітко передає повноту групи.
- source_word: ἐκάθευδον
  choice: заснули
  rationale: 'У поєднанні з попередньою сонливістю «заснули» природно передає перехід до сну, хоча грецький імперфект може також описувати тривалий стан: «спали».'
theological_decisions:
- issue: Образ молодого у притчі
  choice: Збережено оповідний образ «молодого» без явного ототожнення з Христом у самому перекладі.
  alternative: Додати до перекладу христологічне пояснення або вжити більш інтерпретаційне позначення.
  rationale: У ширшому контексті Євангелія образ має богословський відгомін, але цей вірш безпосередньо подає подію всередині притчі. Переклад не повинен робити приховане ототожнення явним.
translation_notes:
  register: Сучасна, природна й гідна українська мова. «Молодий» відповідає весільному контексту; конструкція «почало хилити на сон» зберігає послідовність від сонливості до сну.
