  text: And when did we see you sick or in prison and come to you?[a]
translation:
  language: uk
  text: І коли ми бачили Тебе хворим чи у в’язниці й прийшли до Тебе?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «відвідали Тебе». Грецькою буквально: «прийшли до Тебе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πότε
  choice: коли
  rationale: Питальний прислівник часу; «коли» природно передає пряме запитання українською.
- source_word: δέ
  choice: і
  rationale: У низці запитань δέ є м’яким сполучником, тому нейтральне «і» краще за виразно протиставне «але».
- source_word: εἴδομεν
  choice: ми бачили
  rationale: Аорист ὁράω передає минулу дію; українська питальна конструкція природно зберігає форму «ми бачили».
- source_word: ἀσθενοῦντα
  choice: хворим
  rationale: У цьому контексті дієприкметник ἀσθενέω означає фізичну хворобу, а не загальну слабкість.
- source_word: ἐν φυλακῇ
  choice: у в’язниці
  rationale: φυλακή тут позначає місце ув’язнення; «у в’язниці» є точним і стилістично доречним відповідником.
- source_word: ἤλθομεν πρός σε
  choice: прийшли до Тебе
  rationale: Буквально й прозоро передає рух до особи, не звужуючи вислів до спеціального значення «відвідали».
theological_decisions:
- issue: Чи передавати ἤλθομεν πρός σε як «відвідали Тебе», чи буквальніше як «прийшли до Тебе»
  choice: прийшли до Тебе
  alternative: відвідали Тебе
  rationale: Грецький вислів означає прихід до особи й прямо не вживає дієслова зі значенням «відвідувати». Основний текст зберігає ширше формулювання джерела, а природний контекстуальний варіант подано у примітці.
translation_notes:
  register: Сучасна стандартна українська; проста, гідна й природна пряма мова. Займенники щодо Ісуса написано з великої літери відповідно до поширеної української біблійної традиції.
