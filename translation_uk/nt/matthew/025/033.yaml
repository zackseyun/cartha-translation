  text: And he will place the sheep at his right hand[b][a], but the goats at the left.
translation:
  language: uk
  text: І поставить овець праворуч від себе[b], а козенят — ліворуч[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «кіз». Грецьке слово ἐρίφια конкретніше означає козенят, молодих кіз.
    reason: lexical_alternative
  - marker: b
    text: 'Грецькою буквально: «з правого боку від себе… з лівого» — ідіоматичний вислів про розташування праворуч і ліворуч.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στήσει
  choice: поставить
  rationale: Майбутній активний час від ἵστημι з прямим додатком означає «поставити, розмістити». «Поставить» природно передає навмисне розташування двох груп.
- source_word: πρόβατα
  choice: овець
  rationale: Стандартний відповідник для πρόβατα; форма знахідного відмінка відповідає ролі прямого додатка.
- source_word: ἐκ δεξιῶν αὐτοῦ
  choice: праворуч від себе
  rationale: Природний український спосіб передати просторову ідіому «з правого боку від нього», зберігаючи співвіднесеність із тим самим діячем.
- source_word: ἐρίφια
  choice: козенят
  rationale: ἐρίφια є зменшеною формою й конкретніше позначає молодих кіз, козенят. Українське «козенят» природне й зберігає цю лексичну особливість оригіналу.
- source_word: ἐξ εὐωνύμων
  choice: ліворуч
  rationale: Природно передає грецьку просторову ідіому; належність до діяча зрозуміла з паралельної першої частини.
- source_word: μὲν ... δὲ
  choice: …, а …
  rationale: Українська конструкція з «а» чітко й природно передає зіставлення двох груп.
theological_decisions:
- issue: Чи виражати символічне значення правого й лівого боків безпосередньо в перекладі
  choice: 'Передати лише просторове розташування: «праворуч від себе … ліворуч»'
  alternative: Розгорнути як «на почесному місці» та «на місці осуду»
  rationale: Грецький текст прямо описує розташування. Його оцінне й символічне значення розкривається контекстом суду, тому додавати його до самого вірша було б надмірним тлумаченням.
translation_notes:
  register: Сучасна, проста й гідна українська мова. Дієслово «поставить» зберігає образ пастиря, який розміщує дві групи, а тире в другій частині природно позначає пропущений повтор дієслова.
