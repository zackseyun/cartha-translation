id: MAT.25.28
reference: Matthew 25:28
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ἄρατε οὖν ἀπ’ αὐτοῦ τὸ τάλαντον καὶ δότε τῷ ἔχοντι τὰ δέκα τάλαντα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/028.yaml
  text: Therefore take the talent from him and give it to the one who has the ten talents[a][b].
translation:
  language: uk
  text: Тож заберіть у нього талант[a] і дайте тому, хто має десять талантів.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Талант — велика міра ваги, а також відповідна велика грошова сума.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρατε
  choice: заберіть
  rationale: Аористовий наказовий спосіб множини від αἴρω тут означає вилучити щось у когось. «Заберіть» природно передає як наказ, так і значення відбирання; можливе також «візьміть».
- source_word: οὖν
  choice: тож
  rationale: Позначає висновок із попереднього присуду. «Тож» стисло й природно зберігає логічний зв’язок.
- source_word: ἀπ’ αὐτοῦ
  choice: у нього
  rationale: ἀπό з родовим відмінком виражає відокремлення. У сполученні «заберіть у нього» це природний український відповідник до «від нього».
- source_word: τὸ τάλαντον
  choice: талант
  rationale: Збережено історичну назву великої міри ваги й відповідної грошової суми; примітка запобігає ототожненню із сучасним значенням природної здібності.
- source_word: δότε
  choice: дайте
  rationale: Аористовий наказовий спосіб множини від δίδωμι прямо й природно передано наказовою формою «дайте».
- source_word: τῷ ἔχοντι
  choice: тому, хто має
  rationale: Субстантивований дієприкметник передано природною українською конструкцією без додавання слова «чоловік».
- source_word: τὰ δέκα τάλαντα
  choice: десять талантів
  rationale: Означеність грецького вислову випливає з уже згаданої в оповіді конкретної суми; українська мова не має артикля, тому природно вжито «десять талантів».
theological_decisions:
- issue: Значення τάλαντον у контексті притчі
  choice: Збережено історичний грошово-ваговий термін «талант».
  alternative: «гроші» або «велика сума грошей»
  rationale: У притчі йдеться про довірені суми та відповідальність за них. Історичний термін не зводить образ до вроджених здібностей і не звужує його тлумачення, а культурна примітка пояснює первинне значення.
translation_notes:
  register: Сучасна стандартна українська мова; стислий, гідний і природний наказовий виклад. «Тож» передає висновок, а «заберіть у нього» — значення вилучення без зайвої буквальності. Окрему примітку про варіант «візьміть» не додано, бо українське «заберіть» точніше передає значення αἴρω з ἀπό у цьому контексті й не створює суттєвої смислової альтернативи.
