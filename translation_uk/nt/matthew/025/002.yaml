  text: πέντε δὲ ⸂ἐξ αὐτῶν ἦσαν⸃ ⸂μωραὶ καὶ πέντε φρόνιμοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/002.yaml
  text: And five of them were foolish, and five were wise.
translation:
  language: uk
  text: П’ять із них були нерозумні, а п’ять — розсудливі.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέντε
  choice: п’ять
  rationale: Кількісний числівник передано прямо; повторення збережено, щоб відтворити симетрію й протиставлення грецького речення.
- source_word: δὲ
  choice: а
  rationale: У цьому контексті δέ поєднує речення з попереднім і водночас вводить розподіл групи; українське «а» природно передає цей легкий контраст.
- source_word: ἐξ αὐτῶν
  choice: із них
  rationale: Часткова конструкція вказує, що йдеться про п’ятьох із раніше названої групи; «із них» є точним і природним українським відповідником.
- source_word: ἦσαν
  choice: були
  rationale: Імперфект εἰμί тут виконує функцію простої зв’язки в описі; український минулий час «були» це природно передає.
- source_word: μωραὶ
  choice: нерозумні
  rationale: μωρός позначає брак розуму або розсудливості. «Нерозумні» природно узгоджується з жіночим референтом із попереднього вірша й не додає сильнішого зневажливого відтінку.
- source_word: φρόνιμοι
  choice: розсудливі
  rationale: φρόνιμος у цьому контексті означає практично мудрих, передбачливих і розважливих; «розсудливі» точніше передає цей відтінок у протиставленні до μωραί, ніж ширше «мудрі».
theological_decisions: []
