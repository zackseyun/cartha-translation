lexical_decisions:
- source_word: μωραὶ
  choice: нерозумні
  rationale: Субстантивований прикметник позначає нерозумних дів із притчі та природно передає протиставлення практичній розсудливості.
- source_word: φρονίμοις
  choice: розсудливим
  rationale: У контексті йдеться про практичну мудрість, передбачливість і готовність; «розсудливі» точніше передає цей відтінок, ніж загальне «мудрі».
- source_word: Δότε
  choice: Дайте
  rationale: Аористовий наказовий спосіб у множині передано прямим проханням-наказом природною українською мовою.
- source_word: ἐκ τοῦ ἐλαίου ὑμῶν
  choice: трохи вашої олії
  rationale: Прийменник ἐκ із родовим має часткове значення — просять частину наявного запасу; «трохи вашої олії» природно виражає це українською.
- source_word: λαμπάδες
  choice: світильники
  rationale: λαμπάς може означати переносний світильник або смолоскип. У сцені з олією «світильники» є природним основним відповідником, а справжню лексичну альтернативу збережено в примітці.
- source_word: σβέννυνται
  choice: гаснуть
  rationale: Форма теперішнього часу описує процес, що вже відбувається; «гаснуть» стисло й природно передає поступове згасання полум’я.
- source_word: ὅτι
  choice: бо
  rationale: Сполучник вводить причину прохання; «бо» ясно й природно зберігає причинний зв’язок.
