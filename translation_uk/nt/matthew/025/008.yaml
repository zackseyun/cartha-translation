  text: But the foolish said to the wise[a], ‘Give us some of your oil, because our lamps are going out.’
translation:
  language: uk
  text: 'А нерозумні сказали розсудливим: «Дайте нам трохи вашої олії, бо наші світильники[a] гаснуть».'
