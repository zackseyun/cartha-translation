  text: τί γὰρ ⸀ὠφεληθήσεται ἄνθρωπος ἐὰν τὸν κόσμον ὅλον κερδήσῃ τὴν δὲ ψυχὴν αὐτοῦ ζημιωθῇ; ἢ τί δώσει ἄνθρωπος ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/026.yaml
  text: For what will it profit a man if he gains the whole world but forfeits his life? Or what will a man give in exchange for his life?[a]
translation:
  language: uk
  text: Бо яка користь людині, якщо вона здобуде весь світ, але втратить своє життя?[a] Або що людина дасть в обмін на своє життя?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «свою душу» в обох випадках, де сказано «своє життя». Грецьке слово ψυχή залежно від контексту може означати «життя», «самого себе» або «душу».
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: Бо яка користь
  rationale: Передає пояснювальну силу γάρ і природно вводить українською риторичне запитання з τί.
- source_word: ὠφεληθήσεται ἄνθρωπος
  choice: яка користь людині
  rationale: Природний сучасний український відповідник зі значенням отриманої користі; буквальна пасивна конструкція була б важкою.
- source_word: ἄνθρωπος
  choice: людина
  rationale: У цьому узагальненому вислові слово позначає будь-яку людину; українське «людина» точно передає родове значення.
- source_word: τὸν κόσμον ὅλον
  choice: весь світ
  rationale: Точно й ідіоматично передає всеохопність вислову.
- source_word: κερδήσῃ
  choice: здобуде
  rationale: Передає набуття чи виграш і зберігає контраст із подальшою втратою.
- source_word: τὴν ... ψυχὴν αὐτοῦ
  choice: своє життя
  rationale: ψυχή тут може означати життя, самого себе або душу. «Життя» природно працює в контексті остаточної втрати, а «душу» збережено у примітці як справжню лексичну альтернативу.
- source_word: ζημιωθῇ
  choice: втратить
  rationale: Передає зазнання втрати без додавання ідеї навмисного зречення, якої форма сама по собі не вимагає.
- source_word: ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ
  choice: в обмін за своє життя
  rationale: Зберігає метафору обміну та зв’язок із першим уживанням ψυχή.
theological_decisions:
- issue: Значення ψυχή у вислові про остаточну втрату
  choice: життя
  alternative: душа
  rationale: Контекст не вимагає звужувати ψυχή до безтілесної складової людини; слово може охоплювати життя або саму особу. Традиційне й можливе «душа» подано в примітці, щоб не усунути богословську напругу.
translation_notes:
  register: Сучасна стандартна українська; природний, гідний і загальнозрозумілий стиль. Риторичну побудову та економічну метафору оригіналу збережено без конфесійного уточнення.
