  text: οἱ δὲ διελογίζοντο ἐν ἑαυτοῖς λέγοντες ὅτι Ἄρτους οὐκ ἐλάβομεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/007.yaml
  text: And they were discussing among themselves[a], saying, “We did not bring bread.”
translation:
  language: uk
  text: 'А вони міркували між собою, кажучи: «Ми не взяли хліба».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: А вони
  rationale: δέ тут є м’яким оповідним сполучником; «А» природно продовжує розповідь, не посилюючи протиставлення.
- source_word: διελογίζοντο
  choice: міркували
  rationale: Імперфект передає тривалу дію, а дієслово в цьому контексті означає обговорення або обмірковування почутого. «Міркували» зберігає відтінок осмислення й природно поєднується з «між собою».
- source_word: ἐν ἑαυτοῖς
  choice: між собою
  rationale: Вислів позначає обмін думками всередині групи учнів; це природний сучасний український відповідник.
- source_word: λέγοντες
  choice: кажучи
  rationale: Дієприкметниковий зворот вводить зміст їхнього міркування; формальне «кажучи» точно відтворює синтаксис і є зрозумілим українською.
- source_word: Ἄρτους
  choice: хліба
  rationale: Хоча в грецькому вжито множину, тут ідеться про хліб як дорожній припас; український родовий однини після заперечення звучить природно.
- source_word: οὐκ ἐλάβομεν
  choice: ми не взяли
  rationale: Буквальне «не взяли» природно передає значення λαμβάνω в контексті припасів, які мали взяти із собою, не додаючи відсутнього в грецькому уточнення.
theological_decisions:
- issue: Чи розкривати ὅτι як причинне «це тому, що»
  choice: Передати ὅτι як введення прямого змісту їхніх слів без додавання «це тому, що»
  alternative: «Це тому, що ми не взяли хліба»
  rationale: Грецький текст допускає розуміння ὅτι як маркера змісту після λέγοντες. Додавання «це тому, що» робить причинний висновок явним, хоча він лише випливає з контексту; коротший варіант краще зберігає формальну неоднозначність.
translation_notes:
  register: Сучасна, проста й гідна оповідна українська. Збережено поступальний вид імперфекта через недоконане «міркували» та уникнуто зайвого пояснення підтексту.
