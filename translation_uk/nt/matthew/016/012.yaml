    rationale: Грецьке οὐκ εἶπεν προσέχειν заперечує те, що Ісус сказав остерігатися буквальної закваски. Українська конструкція з «не» безпосередньо після «остерігатися» може читатися як позитивне повеління остерігатися «не закваски», хоча контекст частково усуває двозначність.
  - severity: low
    issue: «Хлібів» неприродне в цьому українському контексті
    rationale: Грецький множинний ἄρτων може бути природно переданий українським масовим «хліба». Формальну множину («хлібин») доцільно зазначити в примітці.
