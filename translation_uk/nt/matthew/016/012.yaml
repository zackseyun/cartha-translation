  source_fidelity: 'Зміст передано загалом точно: протиставлено буквальну «закваску» та вчення фарисеїв і садукеїв. Проте в оригіналі заперечення стосується дієслова «сказав», а не самого об’єкта після «остерігатися»; це варто чіткіше відобразити синтаксисом українського речення.'
  naturalness: «Закваски хлібів» формально наслідує грецьку множину, але українською звучить неприродно й радше означає різновиди хліба. Нормативніше в основному тексті вжити масовий іменник «хліба», а грецьку множину зберегти у примітці як «хлібин».
  terminology: «Закваска», «вчення», «фарисеї» та «садукеї» є точними й усталеними відповідниками. Образ не розтлумачено понад те, що пояснює сам вірш.
  issues:
