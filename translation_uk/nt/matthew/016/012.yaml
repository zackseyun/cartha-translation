  text: τότε συνῆκαν ὅτι οὐκ εἶπεν προσέχειν ἀπὸ τῆς ζύμης ⸂τῶν ἄρτων⸃ ἀλλὰ ἀπὸ τῆς διδαχῆς τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/012.yaml
  text: Then they understood that he had not said to beware of the leaven of bread[a], but of the teaching of the Pharisees and Sadducees.
translation:
  language: uk
  text: Тоді вони зрозуміли, що Він сказав остерігатися не закваски хліба[a], а вчення фарисеїв і садукеїв.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «закваски хлібин». У грецькому тексті слово «хлібина» стоїть у множині.'
    reason: лексична альтернатива та збереження формальної особливості оригіналу
lexical_decisions:
- source_word: τότε
  choice: Тоді
  rationale: Природно й точно позначає момент, коли учні нарешті зрозуміли сказане.
- source_word: συνῆκαν
  choice: вони зрозуміли
  rationale: Передає досягнення розуміння без додаткового тлумачення.
- source_word: οὐκ εἶπεν προσέχειν
  choice: Він казав остерігатися не
  rationale: Українська конструкція природно передає непряму мову та застережний зміст προσέχειν; порядок слів ясно формує протиставлення «не... а».
- source_word: ἀπὸ τῆς ζύμης
  choice: закваски
  rationale: «Закваска» зберігає буквальний образ і усталене біблійне метафоричне звучання.
- source_word: τῶν ἄρτων
  choice: хлібів
  rationale: Збережено граматичну множину грецького тексту, хоча українською можливе також збірне «хліба».
- source_word: διδαχῆς
  choice: вчення
  rationale: Сучасний і зрозумілий відповідник, який позначає зміст того, чого навчають, без зайвої конфесійної термінології.
- source_word: Φαρισαίων καὶ Σαδδουκαίων
  choice: фарисеїв і садукеїв
  rationale: Ужито нормативні українські назви цих релігійних груп.
theological_decisions:
- issue: Метафоричне значення «закваски»
  choice: Збережено образ «закваски», а його референт визначено словами самого вірша як «вчення фарисеїв і садукеїв».
  alternative: Розгорнути метафору як «лицемірство», «згубне» або «хибне вчення».
  rationale: Сам вірш пояснює закваску як вчення, але не додає тут окремої моральної характеристики; переклад не привносить пояснень із паралельних уривків.
translation_notes:
  register: Сучасна нормативна українська мова, проста й гідна за тоном. Займенник «Він» написано з великої літери за поширеною українською біблійною традицією; синтаксис побудовано природно для української непрямої мови.
