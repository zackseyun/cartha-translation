id: MAT.16.21
reference: Matthew 16:21
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Ἀπὸ τότε ἤρξατο ⸂ὁ Ἰησοῦς⸃ δεικνύειν τοῖς μαθηταῖς αὐτοῦ ὅτι δεῖ αὐτὸν ⸂εἰς Ἱεροσόλυμα ἀπελθεῖν⸃ καὶ πολλὰ παθεῖν ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων καὶ ἀποκτανθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ἐγερθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/021.yaml
  text: From that time Jesus began to show his disciples that he must go to Jerusalem and suffer many things from the elders and chief priests and scribes[a], and be killed[c][b], and on the third day be raised.
translation:
  language: uk
  text: Відтоді Ісус почав пояснювати своїм учням, що він має піти до Єрусалима, багато постраждати[a] від старійшин, первосвященників і книжників[b], бути вбитим і третього дня бути воскрешеним[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «постраждати багато чого», тобто зазнати багатьох страждань.'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «від рук старійшин, первосвященників і книжників».'
    reason: alternative_reading
  - marker: c
    text: 'Або: «воскреснути». У грецькому тексті вжито пасивну форму: «бути воскрешеним».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: Відтоді
  rationale: Природно позначає новий етап у розповіді й точно передає часовий зворот.
- source_word: ἤρξατο δεικνύειν
  choice: почав пояснювати
  rationale: Дієслово δεικνύειν означає показувати або робити зрозумілим; у контексті навчання учнів «пояснювати» природно передає цей зміст, не додаючи способу пояснення.
- source_word: δεῖ αὐτόν
  choice: він має
  rationale: Передає необхідність стисло й природно, не уточнюючи в основному тексті її джерела.
- source_word: εἰς Ἱεροσόλυμα ἀπελθεῖν
  choice: піти до Єрусалима
  rationale: Природний український відповідник руху до названого місця.
- source_word: πολλὰ παθεῖν
  choice: багато постраждати
  rationale: Природний український вислів, який передає значний обсяг страждань; буквальнішу множинність грецького звороту зазначено у примітці.
- source_word: ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων
  choice: від старійшин, первосвященників і книжників
  rationale: «Від» безпосередньо передає ἀπό і зберігає можливий відтінок джерела або діячів, не посилюючи його в основному тексті.
- source_word: ἀποκτανθῆναι
  choice: бути вбитим
  rationale: Точно й природно передає пасивний інфінітив.
- source_word: τῇ τρίτῃ ἡμέρᾳ ἐγερθῆναι
  choice: третього дня бути воскрешеним
  rationale: Зберігає часовий вислів і пасивний стан грецького дієслова.
theological_decisions:
- issue: Характер необхідності в δεῖ
  choice: «він має» без пояснення джерела необхідності
  alternative: «йому належить» або «йому необхідно»
  rationale: У цьому реченні грецький текст стверджує необхідність, але прямо не визначає, чи йдеться про Божий задум, виконання Писання або інший аспект; переклад зберігає цю напругу.
- issue: Пасивний стан ἐγερθῆναι
  choice: «бути воскрешеним»
  alternative: «воскреснути»
  rationale: Пасивна форма відповідає грецькому тексту й не називає діяча прямо, зберігаючи богословську форму вислову.
translation_notes:
  register: Сучасна літературна українська мова, зрозуміла широкому колу читачів, зі стриманим і гідним біблійним регістром. Займенник «він» не капіталізовано, щоб не додавати до грецького тексту конфесійної орфографічної практики.
