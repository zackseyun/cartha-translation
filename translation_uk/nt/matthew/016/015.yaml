  text: 'Каже їм: «А ви за кого Мене маєте?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальніше: «А ви ким кажете, що Я є?» У грецькому тексті вжито конструкцію зі знахідним відмінком та інфінітивом, яку українською природно передано словами «за кого Мене маєте».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Каже їм
  rationale: Історичний теперішній час збережено для виразності оповіді; давальний αὐτοῖς природно передано як «їм».
- source_word: Ὑμεῖς δὲ
  choice: А ви
  rationale: Окремо вжитий займенник Ὑμεῖς має наголос, а δέ протиставляє думку учнів поглядам інших людей у попередньому контексті. Українське «А ви» природно передає обидва відтінки.
- source_word: τίνα με λέγετε εἶναι
  choice: за кого Мене маєте
  rationale: Грецьку конструкцію з акузативом та інфінітивом передано природним сучасним українським зворотом про визначення чиєїсь особи. Він зберігає запитання про те, ким учні визнають Ісуса, не додаючи змісту наступної відповіді.
theological_decisions:
- issue: Наголос на особистій відповіді учнів
  choice: «А ви за кого Мене маєте?»
  alternative: «А ви ким кажете, що Я є?»
  rationale: Формулювання зберігає контраст між думками інших і відповіддю учнів, але не випереджає їхнього сповідання в наступному вірші. Буквальніша альтернатива відтворює грецьку будову, проте звучить неприродно українською.
translation_notes:
  register: Сучасна літературна українська, проста й гідна за тоном. Історичний теперішній «Каже» збережено; «А ви» передає контраст і наголос. Займенник «Мене» написано з великої літери відповідно до усталеної української біблійної традиції.
