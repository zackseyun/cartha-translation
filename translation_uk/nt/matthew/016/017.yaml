  text: ⸂ἀποκριθεὶς δὲ⸃ ὁ Ἰησοῦς εἶπεν αὐτῷ· Μακάριος εἶ, Σίμων Βαριωνᾶ, ὅτι σὰρξ καὶ αἷμα οὐκ ἀπεκάλυψέν σοι ἀλλ’ ὁ πατήρ μου ὁ ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/017.yaml
  text: And Jesus answered him[a], “Blessed are you, Simon Bar-Jonah, because flesh and blood did not reveal this to you[c][b], but my Father who is in heaven did.”
translation:
  language: uk
  text: 'Ісус же відповів йому: «Блаженний ти, Симоне, сину Йони,[a] бо не тіло й кров відкрили тобі це, а Мій Отець, Який на небесах».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Грецький текст зберігає арамейську форму патроніма Бар-Йона, тобто «син Йони».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Отець Мій, Який на небесах»; грецьке слово «небеса» стоїть у множині.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν αὐτῷ
  choice: Ісус же відповів йому
  rationale: Конструкція з дієприкметником і особовою формою дієслова буквально означає «відповівши, сказав йому», але в сучасній українській природно передається одним дієсловом «відповів». Частку δέ передано як «же», що підтримує зв’язок із попередньою реплікою.
- source_word: Μακάριος
  choice: Блаженний
  rationale: «Блаженний» зберігає урочистий і богословський відтінок μακάριος; «щасливий» могло б надто звузити значення до емоційного стану.
- source_word: Σίμων Βαριωνᾶ
  choice: Симоне, сину Йони
  rationale: Звертання передано українським кличним відмінком. Арамейський патронім, збережений у грецькому тексті як Βαριωνᾶ, перекладено за значенням для безпосередньої зрозумілості, а його форму пояснено в примітці.
- source_word: ὅτι
  choice: бо
  rationale: Тут ὅτι вводить підставу проголошеного блаженства. «Бо» природно й точно передає причинний зв’язок.
- source_word: σὰρξ καὶ αἷμα
  choice: тіло й кров
  rationale: Збережено конкретний образ грецького ідіому, який у цьому контексті означає людину або суто людське джерело. «Тіло» є сучаснішим і загальнозрозумілішим відповідником, ніж стилістично застаріле «плоть».
- source_word: ἀπεκάλυψέν σοι
  choice: відкрили тобі це
  rationale: «Відкрили» зберігає значення одкровення або розкриття прихованого. Займенник «це» природно відсилає до Петрового визнання з попереднього контексту, хоча в грецькому реченні прямий додаток не виражений.
- source_word: ἀλλ’ ὁ πατήρ μου
  choice: а Мій Отець
  rationale: «А» чітко передає протиставлення між людським і Божим джерелом відкриття. Традиційне «Отець» доречне як особове найменування Бога в устах Ісуса.
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: Який на небесах
  rationale: Відносна конструкція близько відтворює грецьке означення при «Отець», а множина «на небесах» зберігає форму τοῖς οὐρανοῖς і природно звучить українською.
theological_decisions:
- issue: Джерело Петрового визнання
  choice: Збережено протиставлення між «тілом і кров’ю» та Отцем як джерелом відкриття.
  alternative: Передати ідіом тлумачно як «не людина» або звузити його до «не власні міркування».
  rationale: Грецький ідіом широко заперечує людське походження відкриття, але не уточнює, чи йдеться саме про власний розум Петра, людського вчителя або будь-яке інше людське джерело. Переклад не звужує цієї невизначеності.
translation_notes:
  register: Сучасна, зрозуміла й водночас гідна українська мова. Кличний відмінок «Симоне» відповідає прямому звертанню; синтаксис уникнув неприродного буквального «відповівши, сказав». Образний ідіом «тіло й кров» збережено, а не замінено тлумаченням.
