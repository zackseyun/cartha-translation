id: MAT.16.3
reference: Matthew 16:3
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: καὶ πρωΐ· Σήμερον χειμών, πυρράζει γὰρ στυγνάζων ὁ οὐρανός. ⸀τὸ μὲν πρόσωπον τοῦ οὐρανοῦ γινώσκετε διακρίνειν, τὰ δὲ σημεῖα τῶν καιρῶν οὐ δύνασθε.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/003.yaml
  text: And in the morning[a], ‘Today, stormy weather, for the sky is red and overcast.’ You know how to discern the appearance of the sky[b], but you are not able to discern the signs of the times.
translation:
  language: uk
  text: 'А вранці кажете: «Сьогодні буде негода, бо небо червоне й похмуре». Вигляд неба[a] ви вмієте розпізнавати, а ознак часів[b] розпізнати не можете.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «обличчя неба».'
    reason: lexical_alternative
  - marker: b
    text: Вислів «ознаки часів» може конкретніше вказувати на духовне значення теперішнього моменту, зокрема на месіанські діла Ісуса.
    reason: alternative_reading
lexical_decisions:
- source_word: πρωΐ
  choice: вранці
  rationale: Природний український прислівник часу, що точно передає ранковий момент.
- source_word: χειμών
  choice: негода
  rationale: У цьому метеорологічному контексті слово означає погану, буремну погоду, а не пору року «зима».
- source_word: πυρράζει
  choice: червоне
  rationale: Передає червонуватий вигляд неба без зайвого посилення на кшталт «вогненно-червоне».
- source_word: στυγνάζων
  choice: похмуре
  rationale: Передає темний, похмурий або загрозливий вигляд неба й природно звучить у прогнозі погоди.
- source_word: πρόσωπον τοῦ οὐρανοῦ
  choice: вигляд неба
  rationale: «Вигляд» природно передає ідіоматичне значення буквального вислову «обличчя неба».
- source_word: γινώσκετε διακρίνειν
  choice: вмієте розпізнавати
  rationale: Конструкція виражає набуту здатність розрізняти й правильно оцінювати спостережуване.
- source_word: σημεῖα
  choice: ознаки
  rationale: «Ознаки» зберігає значення видимих свідчень або вказівок і природно поєднується з «часами».
- source_word: καιρῶν
  choice: часів
  rationale: Тут ідеться про значущі періоди чи обставини, а не про погодні сезони; широкий вислів зберігає можливий месіанський та есхатологічний відтінок.
- source_word: οὐ δύνασθε
  choice: розпізнати не можете
  rationale: Чітко передає нездатність; повторення дієслова підсилює закладений у грецькому тексті контраст.
theological_decisions:
- issue: Значення вислову «ознаки часів»
  choice: Збережено широкий вислів без звуження до суто есхатологічних ознак.
  alternative: «ознаки теперішнього часу» або «месіанські ознаки віку»
  rationale: Докір стосується нездатності збагнути духовне значення теперішнього моменту, зокрема діяльності Ісуса, але грецький вислів не обмежує його лише одним аспектом.
translation_notes:
  register: Сучасна нормативна українська мова; вислів подано ясно й гідно. Переставлено помилково розташований в англійському консультаційному шарі маркер примітки про «обличчя неба» до відповідного словосполучення. Майбутню форму «буде негода» додано для природного українського погодного вислову, оскільки грецьке іменне речення прогнозує погоду на день.
