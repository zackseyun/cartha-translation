lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: у відповідь сказав
  rationale: Природно передає поширену грецьку оповідну формулу, зберігаючи і значення відповіді, і дієслово мовлення.
- source_word: Ὀψίας γενομένης
  choice: Коли настає вечір
  rationale: Передає часову функцію родового абсолютного звороту й звичний, повторюваний характер прикмети.
- source_word: λέγετε
  choice: ви кажете
  rationale: Теперішній час виражає звичну, повторювану дію.
- source_word: Εὐδία
  choice: Буде гарна погода
  rationale: Іменник означає сприятливу, ясну погоду; майбутня форма природна в українській погодній прикметі.
- source_word: πυρράζει
  choice: червоне
  rationale: Стисло й природно описує червонуватий вигляд вечірнього неба без зайвого посилення образу.
- source_word: οὐρανός
  choice: небо
  rationale: У метеорологічному контексті йдеться про видиме небо; українське «небо» водночас природно зберігає ширший лексичний діапазон грецького слова.
