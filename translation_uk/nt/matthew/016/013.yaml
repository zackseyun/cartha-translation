  text: Ἐλθὼν δὲ ὁ Ἰησοῦς εἰς τὰ μέρη Καισαρείας τῆς Φιλίππου ἠρώτα τοὺς μαθητὰς αὐτοῦ λέγων· ⸀Τίνα λέγουσιν οἱ ἄνθρωποι εἶναι τὸν υἱὸν τοῦ ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/013.yaml
  text: When Jesus came into the region of Caesarea Philippi[a], he was asking his disciples, saying[b], “Who do people say the Son of Man is?”
translation:
  language: uk
  text: 'Коли Ісус прийшов до околиць Кесарії Филипової, він питав своїх учнів: «За кого люди вважають Сина Людського[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Син Людський» — характерне самонайменування Ісуса в Євангеліях.
    reason: terminology
lexical_decisions:
- source_word: Ἐλθὼν δὲ
  choice: Коли ... прийшов
  rationale: Аористовий дієприкметник із δέ відкриває нову сцену; українська підрядна часова конструкція природно передає часовий зв’язок, не додаючи окремого «тепер».
- source_word: εἰς τὰ μέρη
  choice: до околиць
  rationale: У цьому контексті μέρη означає територію довкола міста, а не буквальні «частини»; «до околиць» природно передає рух у цей район.
- source_word: Καισαρείας τῆς Φιλίππου
  choice: Кесарії Филипової
  rationale: Усталена українська біблійна форма назви відрізняє це місто від інших Кесарій і відтворює грецьку означальну конструкцію.
- source_word: ἠρώτα
  choice: запитував
  rationale: Імперфект допускає тривале або розгорнуте в часі запитування; недоконаний вид «запитував» зберігає цей аспект.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: Своїх учнів
  rationale: «Учні» є точним і усталеним відповідником μαθηταί, а «Своїх» природно позначає належність підметові Ісусу.
- source_word: λέγων
  choice: двокрапка перед прямою мовою
  rationale: Грецький дієприкметник вводить зміст запитання. В українській його функцію природно й без втрати змісту передають пунктуаційним оформленням прямої мови, уникаючи важкого «запитував, кажучи».
- source_word: Τίνα λέγουσιν οἱ ἄνθρωποι εἶναι
  choice: За кого люди вважають
  rationale: Це природна українська конструкція непрямого судження, яка передає «ким люди називають/вважають» без незграбного буквального інфінітива.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Сина Людського
  rationale: Усталене найменування Ісуса зберігає форму вислову, його самореферентний характер і зв’язок із біблійною традицією, зокрема Дан. 7.
theological_decisions:
- issue: Передача ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Син Людський
  alternative: Людський Син; Людина
  rationale: «Син Людський» — усталена українська біблійна форма, що зберігає неоднозначність між семітським висловом про людину, Ісусовим самонайменуванням і відлунням Дан. 7, не звужуючи його до одного тлумачення.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Збережено недоконаний вид «запитував», але буквальне «кажучи» замінено природним оформленням прямої мови. Велика літера у займенниках щодо Ісуса відповідає поширеному українському біблійному регістру.
