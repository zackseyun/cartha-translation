language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ⸀ὅτι εἰσίν τινες ⸂τῶν ὧδε ἑστώτων⸃ οἵτινες οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν τῇ βασιλείᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/028.yaml
  text: Truly I tell you[c][b][a], there are some standing here who will certainly not taste death until they see the Son of Man coming in his kingdom.
translation:
  language: uk
  text: 'Істинно кажу вам: дехто з тих, хто стоїть тут, ні в якому разі не скуштує смерті[a], аж поки не побачить Сина Людського, який приходить у Своєму Царстві[b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «аж ніяк не скуштує смерті»; у грецькому тексті вжито підсилене заперечення.'
    reason: lexical_alternative
  - marker: b
    text: Вислів «Син Людський, який приходить у Своєму Царстві» може стосуватися Преображення, воскресіння й вознесіння, П’ятидесятниці, суду над Єрусалимом або остаточного приходу; сам текст не уточнює, про яку подію йдеться.
    reason: alternative_reading
  - marker: c
    text: 'Або: «у Своєму царюванні» чи «у Своїй царській владі».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Істинно
  rationale: Передає урочисте підтвердження, яким Ісус вводить авторитетне висловлювання; це природний і гідний український відповідник без транслітерації.
- source_word: λέγω ὑμῖν
  choice: кажу вам
  rationale: Прямо й природно зберігає теперішній час та звернення до слухачів.
- source_word: εἰσίν τινες τῶν ὧδε ἑστώτων
  choice: деякі з тих, хто стоїть тут
  rationale: 'Виразно передає частковий родовий відмінок: йдеться про частину присутніх.'
- source_word: οὐ μὴ γεύσωνται θανάτου
  choice: неодмінно не скуштують смерті
  rationale: «Неодмінно не» передає підсилене заперечення οὐ μή, а «скуштують смерті» зберігає виразну грецьку метафору.
- source_word: ἕως ἂν ἴδωσιν
  choice: доки не побачать
  rationale: Природна українська часова конструкція для майбутньої події; заперечна форма після «доки» не змінює стверджувального змісту грецького дієслова.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Сина Людського
  rationale: Зберігає усталене біблійне найменування та його апокаліптичний відтінок без пояснювального перефразування.
- source_word: ἐρχόμενον
  choice: який приходить
  rationale: Передає дієприкметник як означальне підрядне речення, природніше для сучасної української; не додає відсутньої в тексті згадки про силу чи славу.
- source_word: ἐν τῇ βασιλείᾳ αὐτοῦ
  choice: у Своєму Царстві
  rationale: «Царство» зберігає конкретний біблійний образ, тоді як «Своєму» однозначно відносить його до Сина Людського; можливий динамічний відтінок царювання зазначено у примітці.
theological_decisions:
- issue: До якої події належить прихід Сина Людського у Своєму Царстві
  choice: Перекладено прямо, без ототожнення з певною подією.
  alternative: Преображення; воскресіння і вознесіння; П’ятидесятниця; суд над Єрусалимом; остаточний прихід.
  rationale: Грецький текст сам не уточнює подію, тому переклад зберігає справжню тлумачну неоднозначність і богословську напругу.
- issue: Значення βασιλεία
  choice: Царство
  alternative: царювання; царська влада
  rationale: «Царство» зберігає традиційний конкретний образ, не звужуючи значення винятково до абстрактного здійснення влади; інші лексичні можливості подано у примітці.
translation_notes:
  register: Сучасна літературна українська з урочистим, але зрозумілим біблійним регістром. Збережено метафору «скуштувати смерть», титул «Син Людський» і неоднозначність вислову про прихід. Усі приміткові маркери розміщено біля відповідних фраз.
