base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/011.yaml
  text: How do you not understand that I did not speak to you about bread? But beware of the leaven of the Pharisees and Sadducees[a][b].
translation:
  language: uk
  text: Як же ви не розумієте, що Я сказав вам не про хліб? Стережіться ж закваски фарисеїв і садукеїв.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Остерігайтеся закваски фарисеїв і садукеїв».'
    reason: lexical_alternative
  - marker: b
    text: «Закваска» тут є метафорою; у наступному вірші її пояснено як вчення фарисеїв і садукеїв.
    reason: cross_reference
lexical_decisions:
- source_word: πῶς οὐ νοεῖτε
  choice: Як же ви не розумієте
  rationale: Риторичне запитання з докірливою силою. «Як же» природно передає πῶς οὐ в сучасній українській, а «розумієте» точно відтворює νοεῖτε.
- source_word: ὅτι οὐ περὶ ἄρτων εἶπον ὑμῖν
  choice: що не про хліб Я говорив вам
  rationale: Хоча ἄρτων має форму множини, у цьому контексті український збірний іменник «хліб» звучить природніше. Конструкція з наголосом «не про хліб» зберігає виправлення хибного розуміння учнів.
- source_word: προσέχετε δὲ
  choice: Стережіться ж
  rationale: Наказова форма προσέχετε тут виражає застереження. Частка «ж» природно передає перехідно-контрастну функцію δέ, не роблячи протиставлення надмірно різким.
- source_word: ἀπὸ τῆς ζύμης
  choice: закваски
  rationale: При προσέχετε прийменник ἀπό позначає те, чого слід остерігатися. «Закваска» зберігає образ джерельного тексту й є звичним українським біблійним відповідником.
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: фарисеїв і садукеїв
  rationale: Ужито усталені українські назви цих юдейських релігійних груп; родовий відмінок передає належність або характерну пов’язаність закваски з ними.
theological_decisions:
- issue: Метафоричне значення «закваски»
  choice: Зберегти в основному тексті метафору «закваска», не замінюючи її словом «вчення».
  alternative: «Стережіться вчення фарисеїв і садукеїв».
  rationale: У самому вірші вжито ζύμη, тоді як наступний вірш пояснює цей образ як вчення. Збереження метафори відтворює послідовність джерельного тексту й не вводить пояснення завчасно.
translation_notes:
  register: Сучасна літературна українська з гідним, але доступним біблійним звучанням. «Як же» та «стережіться ж» передають докір і застереження без архаїчності. Займенник «Я» написано з великої літери згідно з поширеною українською біблійною видавничою практикою.
