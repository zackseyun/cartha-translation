source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Οἱ μὲν Ἰωάννην τὸν βαπτιστήν, ἄλλοι δὲ Ἠλίαν, ἕτεροι δὲ Ἰερεμίαν ἢ ἕνα τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/014.yaml
  text: And they said[a], “Some say John the Baptist, others Elijah, and others Jeremiah or one of the prophets.”
translation:
  language: uk
  text: 'Вони ж сказали: «Одні — Іван Хреститель, інші — Ілля, а ще інші — Єремія або один із пророків».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або, повніше: «Одні кажуть, що Ти — Іван Хреститель, інші — Ілля, а ще інші — Єремія або один із пророків».'
    reason: Пояснює неявний, але зрозумілий із контексту зміст грецького еліпсису.
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Вони ж сказали
  rationale: Займенник передає артикль у субстантивованій функції, δέ — легким зв’язком «ж», а εἶπαν природно перекладено як «сказали».
- source_word: Οἱ μὲν
  choice: Одні
  rationale: μέν відкриває розподільний перелік; українська конструкція «одні … інші …» природно зберігає грецький еліпсис.
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: Іван Хреститель
  rationale: Усталена в сучасній українській біблійній традиції назва цієї постаті.
- source_word: ἄλλοι δὲ
  choice: інші
  rationale: Продовжує розподільний ряд без потреби посилювати протиставлення.
- source_word: Ἠλίαν
  choice: Ілля
  rationale: Усталена українська форма імені старозавітного пророка.
- source_word: ἕτεροι δὲ
  choice: а ще інші
  rationale: Виразно позначає третю групу й природно передає продовження переліку.
- source_word: Ἰερεμίαν
  choice: Єремія
  rationale: Усталена українська форма імені пророка.
- source_word: ἢ ἕνα τῶν προφητῶν
  choice: або один із пророків
  rationale: Зберігає альтернативу, введену ἤ, і не додає відсутнього в грецькому тексті слова «інших».
theological_decisions:
- issue: Неявний об’єкт ототожнення
  choice: 'Збережено еліпсис: «Одні — Іван Хреститель…»'
  alternative: «Одні кажуть, що Ти — Іван Хреститель…»
  rationale: Грецький текст подає лише перелік ототожнень, а кого саме ототожнюють із цими постатями, зрозуміло з попереднього запитання Ісуса. Основний текст не додає слів, яких немає у вірші.
translation_notes:
  register: Сучасна нормативна українська мова; виклад природний і гідний. Розподільна конструкція «одні — інші — ще інші» зберігає будову переліку та його еліптичність.
