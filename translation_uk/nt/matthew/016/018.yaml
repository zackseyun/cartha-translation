id: MAT.16.18
reference: Matthew 16:18
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: κἀγὼ δέ σοι λέγω ὅτι σὺ εἶ Πέτρος, καὶ ἐπὶ ταύτῃ τῇ πέτρᾳ οἰκοδομήσω μου τὴν ἐκκλησίαν, καὶ πύλαι ᾅδου οὐ κατισχύσουσιν αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/018.yaml
  text: And I also say to you that you are Peter[a], and on this rock I will build my church[b], and the gates of Hades will not prevail against it.
translation:
  language: uk
  text: 'І я також кажу тобі: ти — Петро, і на цій скелі[a] я збудую мою Церкву, і брами світу померлих[b] не здолають її.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: У грецькому тексті є гра слів між ім’ям Петро (Πέτρος) і словом «скеля» (πέτρα). Вислів «на цій скелі» можна розуміти як посилання на самого Петра, на його визнання або на Петра як сповідника й представника апостолів.
    reason: alternative_reading
  - marker: b
    text: Грецьке ᾅδης (гадес) означає світ померлих. Традиційний переклад — «пекло».
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ δέ
  choice: І я також
  rationale: κἀγώ підсилює займенник і має значення «і я також / і я зі свого боку», а δέ позначає продовження з легким зіставленням. Такий переклад передає відповідь Ісуса на Петрове визнання, не перетворюючи її на різкий контраст.
- source_word: σοι λέγω
  choice: кажу тобі
  rationale: Прямий і природний відповідник λέγω з давальним займенником, який зберігає урочисту формулу звернення.
- source_word: Πέτρος
  choice: Петро
  rationale: Ужито усталену українську форму імені. Грецька гра слів між Πέτρος і πέτρα не повністю відтворюється українською, тому її пояснено в примітці.
- source_word: ἐπὶ ταύτῃ τῇ πέτρᾳ
  choice: на цій скелі
  rationale: ἐπί з давальним тут позначає основу, а ταύτῃ зберігає вказівне значення «цій». «Скеля» природно передає πέτρα й не усуває неоднозначності її референта.
- source_word: οἰκοδομήσω
  choice: збудую
  rationale: Зберігає буквальну будівельну метафору дієслова οἰκοδομέω та майбутній час.
- source_word: μου τὴν ἐκκλησίαν
  choice: мою Церкву
  rationale: «Церква» є усталеним українським відповідником ἐκκλησία для громади, що належить Ісусові; присвійний займенник передає μου. Велика літера позначає спільноту вірян, а не будівлю.
- source_word: πύλαι ᾅδου
  choice: брами світу померлих
  rationale: ᾅδης тут означає оселю або світ померлих, а не Геєну як місце остаточної кари. Описовий відповідник зрозумілий сучасному читачеві й зберігає образ брам.
- source_word: οὐ κατισχύσουσιν αὐτῆς
  choice: не здолають її
  rationale: κατισχύω означає «перемогти, здолати, виявитися сильнішим». «Не здолають її» стисло й природно передає протистояння, а займенник «її» стосується Церкви.
theological_decisions:
- issue: До чого стосується вислів «ця скеля» (ταύτῃ τῇ πέτρᾳ)
  choice: У перекладі залишено «на цій скелі» без уточнення референта.
  alternative: Скелею можна розуміти самого Петра, Петрове визнання Ісуса або Петра як сповідника й представника апостолів.
  rationale: Грецький текст містить виразну гру слів Πέτρος / πέτρα, однак сам переклад не повинен вирішувати давню міжтрадиційну суперечку. Примітка повідомляє про основні можливості, не віддаючи переваги жодній.
- issue: Значення ᾅδης
  choice: світ померлих
  alternative: Гадес; традиційно — пекло.
  rationale: «Світ померлих» передає значення грецького ᾅδης і не ототожнює його безпідставно з Геєною чи остаточним покаранням.
translation_notes:
  register: Сучасна літературна українська мова з урочистим, але зрозумілим синтаксисом. Збережено будівельну метафору, образ брам і богословську неоднозначність «цієї скелі». Займенники на позначення Ісуса подано з малої літери за загальними нормами сучасного українського тексту; «Церква» — з великої, щоб виразно позначити спільноту, а не споруду.
