  text: ὁ δὲ στραφεὶς εἶπεν τῷ Πέτρῳ· Ὕπαγε ὀπίσω μου, Σατανᾶ· σκάνδαλον ⸂εἶ ἐμοῦ⸃, ὅτι οὐ φρονεῖς τὰ τοῦ θεοῦ ἀλλὰ τὰ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/023.yaml
  text: But he turned and said to Peter[a], “Go behind me, Satan! You are a stumbling block to me, because you are not setting your mind on the things of God[b], but on the things of men.”
translation:
  language: uk
  text: 'А Він, обернувшись, сказав Петрові: «Іди позаду Мене, Сатано! Ти для Мене — камінь спотикання, бо ти думаєш не про те, що Боже, а про те, що людське».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στραφεὶς
  choice: обернувшись
  rationale: Дієприкметник передає фізичний поворот Ісуса перед зверненням; форма природна для сучасної української.
- source_word: Ὕπαγε ὀπίσω μου
  choice: Іди геть за Мною
  rationale: «Іди» безпосередньо передає ὕπαγε, «за Мною» зберігає просторовий образ ὀπίσω μου, а «геть» виражає різкість наказу, не зводячи його лише до традиційної формули.
- source_word: Σατανᾶ
  choice: сатано
  rationale: Кличний відмінок зберігає пряме й різке звернення, не вирішуючи, чи йдеться про власне ім’я, титул або роль противника.
- source_word: σκάνδαλον
  choice: камінь спотикання
  rationale: Усталений і зрозумілий український образ перешкоди, через яку можна спіткнутися; він точніше зберігає метафору, ніж абстрактна «спокуса».
- source_word: ἐμοῦ
  choice: для Мене
  rationale: Природно передає особу, для якої Петро став перешкодою.
- source_word: φρονεῖς
  choice: думаєш про
  rationale: У цьому протиставленні вислів означає спрямованість думок і турбот; українська конструкція природна, а тривалий контекстуальний сенс зберігається.
- source_word: τὰ τοῦ θεοῦ
  choice: Боже
  rationale: Субстантивований прикметник стисло й природно передає «те, що належить Богові / стосується Бога», зберігаючи широту грецького вислову.
- source_word: τὰ τῶν ἀνθρώπων
  choice: людське
  rationale: Субстантивована форма природно протиставляється «Божому» й охоплює людські міркування та інтереси без невластивого українській мові родового звуження.
theological_decisions:
- issue: Сила звернення «сатано» до Петра
  choice: Збережено пряме звернення «сатано» без пояснення, ким саме тут названо Петра.
  alternative: «противнику» або уточнення, що через Петра діє сатана
  rationale: Грецький текст допускає богословську напругу між іменем/титулом Сатани та роллю противника; переклад не повинен усувати цю неоднозначність.
- issue: Значення протиставлення τὰ τοῦ θεοῦ і τὰ τῶν ἀνθρώπων
  choice: «Боже» та «людське»
  alternative: «Божі задуми» та «людські інтереси»
  rationale: Стислі субстантивовані форми зберігають широту оригіналу й не звужують вислів лише до задумів, справ або інтересів.
translation_notes:
  register: Сучасна стандартна українська мова; вислів урочистий, але доступний. Різкість докору збережено через наказ «Іди геть» і пряме звернення. Займенники щодо Ісуса подано з великої літери відповідно до поширеної української біблійної традиції.
