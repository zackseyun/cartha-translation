  verdict: revise
  source_fidelity: '«Іди геть за Мною» не є вдалим відповідником Ὕπαγε ὀπίσω μου: додане «геть» спрямовує наказ на віддалення, тоді як ὀπίσω μου означає «позаду Мене / за Мною» і в контексті зберігає образ зайняття місця позаду Ісуса. Решта змісту передана загалом точно; «камінь спотикання для Мене» природно передає σκάνδαλον ἐμοῦ.'
  naturalness: «Іди позаду Мене» є природним і зрозумілим сучасним українським формулюванням та не містить семантичної напруги, властивої сполуці «іди геть за Мною». Для τὰ τοῦ θεοῦ / τὰ τῶν ἀνθρώπων конструкція «те, що Боже / те, що людське» звучить дещо ясніше, ніж еліптичне «Боже / людське», зберігаючи стислий біблійний регістр.
  terminology: «Сатано» слід писати з великої літери, оскільки Σατανᾶ тут збережено як усталене власне ім’я/титул, а не перекладено загальним «противнику». Відтворення «Боже» і «людське» не нав’язує тлумачення щодо конкретних задумів чи інтересів.
  issues:
