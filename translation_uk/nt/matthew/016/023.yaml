  to: 'А Він, обернувшись, сказав Петрові: «Іди позаду Мене, Сатано! Ти для Мене — камінь спотикання, бо ти думаєш не про те, що Боже, а про те, що людське».'
  rationale: Виправлено наказ так, щоб без доданої ідеї віддалення передати ὕπαγε ὀπίσω μου як розпорядження зайняти місце позаду Ісуса. Власну назву «Сатана» унормовано великою літерою. Протиставлення Божого й людського трохи розгорнуто для прозорості українського синтаксису без звуження значення та без богословського тлумачення.
