id: MAT.16.19
reference: Matthew 16:19
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ⸀δώσω σοι τὰς ⸀κλεῖδας τῆς βασιλείας τῶν οὐρανῶν, καὶ ὃ ⸀ἐὰν δήσῃς ἐπὶ τῆς γῆς ἔσται δεδεμένον ἐν τοῖς οὐρανοῖς, καὶ ὃ ⸁ἐὰν λύσῃς ἐπὶ τῆς γῆς ἔσται λελυμένον ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/019.yaml
  text: I will give you the keys of the kingdom of heaven[a], and whatever you bind on earth will have been bound in heaven[c][b], and whatever you loose on earth will have been loosed in heaven.
translation:
  language: uk
  text: Я дам тобі ключі Царства Небесного[a], і що ти зв’яжеш на землі, те буде зв’язане на небесах[b][c], а що ти розв’яжеш на землі, те буде розв’язане на небесах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальніше: «Царства небес». Матвій часто вживає цей вислів.'
    reason: lexical_alternative
  - marker: b
    text: 'Грецька конструкція також може наголошувати на вже завершеній дії: «виявиться вже зв’язаним… виявиться вже розв’язаним на небесах». Традиційно її часто передають просто як «буде зв’язане… буде розв’язане».'
    reason: alternative_reading
  - marker: c
    text: «Зв’язувати» й «розв’язувати» можуть означати забороняти й дозволяти або накладати й знімати обов’язки; основний текст зберігає грецьку метафору.
    reason: cultural_note
lexical_decisions:
- source_word: δώσω σοι
  choice: Я дам тобі
  rationale: 'Майбутній активний індикатив і давальний відмінок природно передаються сучасною українською як пряма обіцянка: «Я дам тобі».'
- source_word: κλεῖδας
  choice: ключі
  rationale: Збережено буквальний образ у множині без пояснювального розгортання його значення.
- source_word: βασιλείας τῶν οὐρανῶν
  choice: Царства Небесного
  rationale: Природний і усталений український відповідник Матвієвого вислову; грецьку множину «небес» подано у примітці.
- source_word: ὃ ἐὰν
  choice: що … те
  rationale: Співвідносна конструкція «що … те» природно передає грецький неозначено-відносний зворот і зберігає широту вислову.
- source_word: δήσῃς
  choice: зв’яжеш
  rationale: Збережено метафору «зв’язувати», не звужуючи її до конкретного значення на кшталт «забороняти» чи «накладати обов’язок».
- source_word: ἐπὶ τῆς γῆς
  choice: на землі
  rationale: Природний український відповідник у протиставленні землі й небес.
- source_word: ἔσται δεδεμένον
  choice: буде зв’язане
  rationale: Українська форма виражає майбутній стан як наслідок завершеної дії, хоча не відтворює можливої часової передзавершеності так виразно, як громіздке «виявиться вже зв’язаним»; нюанс зазначено в примітці.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: на небесах
  rationale: Природний український відповідник грецької множини, який водночас точно зберігає просторовий контраст із «на землі».
- source_word: λύσῃς
  choice: розв’яжеш
  rationale: Збережено симетричну пару до «зв’яжеш» і грецьку метафору λύω без надмірного тлумачення.
- source_word: ἔσται λελυμένον
  choice: буде розв’язане
  rationale: Передано майбутній результуючий стан; можливий акцент на попередній завершеності небесної дії пояснено в примітці.
theological_decisions:
- issue: Аспект і богословський зміст формули про зв’язування та розв’язування
  choice: У тексті вжито природні українські форми «буде зв’язане / буде розв’язане», а можливе розуміння як уже здійсненого на небесах подано в примітці.
  alternative: «Виявиться вже зв’язаним / виявиться вже розв’язаним на небесах» або традиційне розуміння простого майбутнього пасиву.
  rationale: Конструкція ἔσται з перфектним пасивним дієприкметником позначає майбутній стан, що є результатом завершеної дії. Вона допускає акцент на тому, що земна дія відповідає небесному рішенню, але граматика сама по собі не вимагає розбудови певної конфесійної моделі влади.
- issue: Значення ключів Царства Небесного
  choice: Образ «ключі» збережено без тлумачного доповнення.
  alternative: «Влада допускати й не допускати» або «управительська влада».
  rationale: Образ передбачає владу чи відповідальність, однак сам вірш не розкриває її в окремій формулі; буквальне збереження метафори не нав’язує певної еклезіології.
- issue: Значення дієслів «зв’язувати» й «розв’язувати»
  choice: Збережено метафоричну пару.
  alternative: «Забороняти й дозволяти» або «накладати й знімати обов’язки».
  rationale: Такі юридичні або вчительські відтінки можливі, проте не вичерпують образу й можуть передчасно вирішити його богословську неоднозначність.
translation_notes:
  register: Сучасна стандартна українська, урочиста без архаїзації. Звертання в однині передає σοι та форми другої особи однини. Усі образи оригіналу збережено, а спірний аспект перфектної конструкції не перетворено на однозначне конфесійне твердження.
