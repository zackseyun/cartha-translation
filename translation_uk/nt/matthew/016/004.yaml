  text: Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον ⸀Ἰωνᾶ. καὶ καταλιπὼν αὐτοὺς ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/004.yaml
  text: An evil and adulterous generation seeks a sign[a], and no sign will be given to it except the sign of Jonah. And leaving them[b], he went away.
translation:
  language: uk
  text: Зле й перелюбне[a] покоління шукає знаку, і жодного знаку не буде йому дано, крім знаку Йони[b]. І, залишивши їх, він пішов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «невірне покоління». Грецьке слово буквально означає «перелюбне» й, імовірно, відлунює пророчу мову про невірність Богові.'
    reason: lexical_alternative
  - marker: b
    text: «Знак Йони» пояснено в Матвія 12:39–40 у зв’язку з трьома днями й трьома ночами Йони, які зіставлено з Сином Людським.
    reason: cross_reference
lexical_decisions:
- source_word: Γενεὰ
  choice: покоління
  rationale: У Матвія γενεά природно позначає сучасне Ісусові покоління або певний рід людей; «покоління» зберігає цей усталений зміст без надмірного тлумачення.
- source_word: πονηρὰ
  choice: лукаве
  rationale: «Лукаве» природно передає морально негативне значення πονηρός у біблійному контексті; можливе також «зле», але воно тут звучить менш виразно щодо людей.
- source_word: μοιχαλὶς
  choice: перелюбне
  rationale: Збережено буквальну й гостру метафору перелюбу, яка може водночас відлунювати пророчу мову про невірність Богові.
- source_word: σημεῖον
  choice: знак
  rationale: «Знак» прямо передає σημεῖον і не додає означення «чудесний», якого в грецькому тексті немає.
- source_word: ἐπιζητεῖ
  choice: шукає
  rationale: Дієслово означає наполегливо шукати або домагатися; нейтральніше «шукає» залишає ворожий відтінок контекстові.
- source_word: οὐ δοθήσεται αὐτῇ
  choice: не буде йому дано
  rationale: Збережено майбутню пасивну конструкцію; займенник «йому» узгоджується в українській із середнім родом слова «покоління».
- source_word: εἰ μὴ
  choice: крім
  rationale: У цій конструкції вислів вводить єдиний виняток і природно передається словом «крім».
- source_word: τὸ σημεῖον Ἰωνᾶ
  choice: знак Йони
  rationale: Родовий відмінок відтворено без пояснювального додатка, щоб зберегти стислість і смислову місткість грецького вислову.
- source_word: καταλιπὼν αὐτοὺς
  choice: залишивши їх
  rationale: Дієприслівникова конструкція природно передає аористовий дієприкметник і його часовий зв’язок із головною дією.
- source_word: ἀπῆλθεν
  choice: Він пішов
  rationale: «Пішов» ясно й сучасно передає віддалення Ісуса від співрозмовників; займенник додано для природності та ясності українського речення.
theological_decisions:
- issue: Значення вислову «перелюбне покоління»
  choice: У головному тексті збережено метафору «перелюбне».
  alternative: Передати тлумачно як «невірне покоління».
  rationale: Грецьке слово прямо вживає образ перелюбу, який може вказувати і на моральний стан, і на невірність Богові в дусі пророчої мови. Переклад не звужує цю напругу до одного значення.
- issue: Значення «знаку Йони»
  choice: Вислів залишено без пояснення в головному тексті.
  alternative: Безпосередньо назвати смерть і воскресіння Ісуса.
  rationale: Матвій 12:39–40 пояснює цей образ, однак сам цей вірш подає його стисло. Пояснення винесено в примітку, щоб не додавати до основного тексту того, чого тут явно не сказано.
translation_notes:
  register: Сучасна нормативна українська мова з гідним, доступним звучанням. Ужито «знак», а не стилістично піднесене «знамення», щоб не додавати до σημεῖον обов’язкового значення чуда. Велика літера в займеннику «Він» підтримує поширену українську біблійну практику, не змінюючи змісту.
