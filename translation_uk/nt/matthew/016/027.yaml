  text: μέλλει γὰρ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεσθαι ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων αὐτοῦ, καὶ τότε ἀποδώσει ἑκάστῳ κατὰ τὴν πρᾶξιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/027.yaml
  text: For the Son of Man is about to come in the glory of his Father with his angels[b][a], and then he will repay each one according to his deed.
translation:
  language: uk
  text: Адже Син Людський незабаром прийде[a] у славі свого Отця зі своїми ангелами, і тоді він віддасть кожному за його вчинком[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «має прийти», «збирається прийти» чи просто «прийде». Грецький вислів передає наближення або очікувану близькість події.
    reason: lexical_alternative
  - marker: b
    text: Або «відповідно до того, що він зробив». У грецькому тексті стоїть однина «вчинок / дія», ужита розподільно щодо поведінки кожної людини.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλει … ἔρχεσθαι
  choice: має невдовзі прийти
  rationale: Конструкція μέλλω з інфінітивом указує на очікувану або близьку дію. Переклад зберігає відтінок наближення, не зводячи вислів до простого майбутнього часу.
- source_word: γὰρ
  choice: Адже
  rationale: Сполучник вводить обґрунтування попереднього твердження; «адже» природно передає цей пояснювальний зв’язок українською.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Син Людський
  rationale: Усталений буквальний відповідник самоназви, що зберігає її біблійні та міжтекстові зв’язки.
- source_word: ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ
  choice: у славі свого Отця
  rationale: Прийменник «у» передає сферу або вияв слави, а зворот зі «свого» природно співвідносить Отця із Сином Людським.
- source_word: μετὰ τῶν ἀγγέλων αὐτοῦ
  choice: зі своїми ангелами
  rationale: μετά з родовим відмінком виражає супровід; український вислів прямо й природно це передає.
- source_word: καὶ τότε
  choice: і тоді
  rationale: 'Збережено як сполучний, так і часовий елемент: спочатку прихід, потім відплата.'
- source_word: ἀποδώσει
  choice: віддасть
  rationale: У контексті суду дієслово означає віддати кожному належне. «Віддасть» зберігає судово-відплатний зміст без уточнення, чи йдеться про нагороду або кару.
- source_word: ἑκάστῳ κατὰ τὴν πρᾶξιν αὐτοῦ
  choice: кожному за його вчинком
  rationale: Форма «кожному» зберігає розподільний характер вислову, а однина «вчинком» відтворює грецьку однину πρᾶξιν, яка тут може узагальнювати поведінку людини.
theological_decisions:
- issue: Часовий відтінок μέλλει щодо приходу Сина Людського
  choice: Збережено відтінок близькості у вислові «має невдовзі прийти».
  alternative: «прийде» або «має прийти»
  rationale: Грецька конструкція містить більше, ніж просте позначення майбутньої події. Переклад не усуває напруження щодо очікуваної близькості приходу й водночас не розв’язує богословську дискусію про його час.
- issue: Відплата відповідно до вчинку
  choice: «віддасть кожному за його вчинком»
  alternative: «винагородить кожного за те, що він зробив» або «віддасть кожному за його вчинками»
  rationale: Текст говорить про особисту відплату на суді, але не уточнює тут її позитивного чи негативного характеру. Однина збережена, щоб не розширювати формулювання оригіналу.
translation_notes:
  register: Сучасна, зрозуміла й урочиста українська без архаїзмів. «Адже» виразно пов’язує цей вірш із попередньою думкою; «віддасть» залишає відкритим повний діапазон судової відплати. Займенники щодо божественних осіб подано з малої літери відповідно до загальної сучасної української практики, а титули «Син Людський» та «Отець» — з великої.
