  text: For whoever wants to save his life will lose it[a], but whoever loses his life for my sake will find it.
translation:
  language: uk
  text: Бо хто хоче врятувати своє життя, той втратить його[a]; а хто втратить своє життя заради Мене, той знайде його.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «душу» в усьому вірші; грецьке слово psychē залежно від контексту може означати «життя», «особу» або «душу».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἐὰν / ὃς δ’ ἂν
  choice: Бо хто... а хто...
  rationale: Неозначено-умовні конструкції природно передано українським «хто... той». γάρ збережено як «Бо», що пов’язує вислів із попереднім контекстом, а δέ — як контрастне «а».
- source_word: θέλῃ
  choice: хоче
  rationale: Передає волю або бажання природною сучасною українською мовою.
- source_word: ψυχὴν
  choice: життя
  rationale: У контексті учнівства й можливої смерті слово позначає життя людини, водночас може мати ширші значення «душа» або «саме єство»; традиційну альтернативу наведено у примітці.
- source_word: σῶσαι
  choice: врятувати
  rationale: «Врятувати» природно поєднується з «життям» і зберігає протиставлення дієслову «втратити».
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: втратить / втратить
  rationale: У цьому контексті ἀπόλλυμι означає втрату життя, а не обов’язково знищення. Українська форма майбутнього часу природна в обох частинах загальної умовної конструкції.
- source_word: ἕνεκεν ἐμοῦ
  choice: заради Мене
  rationale: Передає причину й особисту відданість Ісусові стисло та природно.
- source_word: εὑρήσει
  choice: знайде
  rationale: Буквально й виразно зберігає парадокс «втратить — знайде», не додаючи тлумачення на кшталт «здобуде».
- source_word: αὐτοῦ / αὐτήν
  choice: своє / його
  rationale: Зворотний присвійний займенник «своє» є нормативним щодо підмета «хто», а «його» граматично відсилає до іменника середнього роду «життя».
theological_decisions:
- issue: Передача ψυχή у парадоксі про учнівство
  choice: життя
  alternative: душа
  rationale: Дієслова «врятувати», «втратити» і «знайти» в контексті слідування за Ісусом найприродніше стосуються життя людини. Водночас ψυχή не завжди зводиться лише до фізичного життя, тому значущу альтернативу «душа» збережено в примітці.
translation_notes:
  register: Сучасна нормативна українська мова з гідним, доступним біблійним регістром. Конструкція «хто... той» робить загальну умову природною, а паралелізм обох частин збережено.
