  text: τότε ⸀διεστείλατο τοῖς ⸀μαθηταῖς ἵνα μηδενὶ εἴπωσιν ὅτι αὐτός ⸀ἐστιν ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/020.yaml
  text: Then he strictly instructed the disciples to tell no one that he is the Messiah[a].
translation:
  language: uk
  text: Тоді Він суворо наказав учням нікому не казати, що Він — Месія[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Христос». Грецький титул Χριστός тут перекладено словом «Месія», щоб передати його значення як титулу.'
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Тоді
  rationale: Природно й стисло позначає наступний момент у розвитку оповіді.
- source_word: διεστείλατο
  choice: суворо наказав
  rationale: Передає силу наполегливої заборони або категоричного розпорядження, не звужуючи значення до попередження про небезпеку.
- source_word: τοῖς μαθηταῖς
  choice: учням
  rationale: Означена група вже відома з контексту; українська мова не потребує артикля чи доданого присвійного займенника.
- source_word: ἵνα μηδενὶ εἴπωσιν
  choice: нікому не казати
  rationale: Природний український інфінітивний зворот після дієслова наказу точно передає зміст заборони.
- source_word: ὅτι αὐτός ἐστιν
  choice: що Він —
  rationale: ὅτι вводить зміст повідомлення, а αὐτός ἐστιν утворює просту предикацію; тире природно поєднує займенник із титулом у сучасній українській.
- source_word: ὁ χριστός
  choice: Месія
  rationale: Χριστός тут є титулом Помазаника, а не особовим ім’ям; «Месія» передає його зміст і звичне українське біблійне вживання.
theological_decisions:
- issue: Передача Χριστός як титулу
  choice: Месія
  alternative: Христос
  rationale: У цьому контексті слово позначає очікуваного Помазаника й функціонує як титул. «Месія» виразно зберігає цей зміст, тоді як «Христос» у сучасному вжитку може сприйматися як ім’я.
translation_notes:
  register: Сучасна стандартна українська, природний і водночас гідний оповідний стиль. Займенник «Він» написано з великої літери за усталеною українською біблійною традицією; змістовного наголосу на αὐτός не додано.
