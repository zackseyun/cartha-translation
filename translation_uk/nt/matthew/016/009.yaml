id: MAT.16.9
reference: Matthew 16:9
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: οὔπω νοεῖτε, οὐδὲ μνημονεύετε τοὺς πέντε ἄρτους τῶν πεντακισχιλίων καὶ πόσους κοφίνους ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/009.yaml
  text: Do you still not understand[a], nor do you remember the five loaves for the five thousand[b], and how many baskets you gathered?
translation:
  language: uk
  text: Невже ви й досі не розумієте і не пам’ятаєте про п’ять хлібів для п’яти тисяч та скільки кошиків ви зібрали?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὔπω
  choice: й досі не
  rationale: Передає часову силу прислівника в докірливому риторичному запитанні; українське «й досі не» природно виражає тривале нерозуміння.
- source_word: νοεῖτε
  choice: розумієте
  rationale: У контексті йдеться про усвідомлення значення попередніх подій, а не лише про сприйняття.
- source_word: οὐδὲ
  choice: і не
  rationale: Природно поєднує в українській два заперечені присудки, не змінюючи їхньої координації.
- source_word: μνημονεύετε
  choice: пам’ятаєте
  rationale: Прямо передає згадування попереднього нагодування.
- source_word: τοὺς πέντε ἄρτους
  choice: п’ять хлібів
  rationale: У біблійному контексті «хліби» природно позначають окремі буханці або коржі й зберігають конкретний рахунок оригіналу.
- source_word: τῶν πεντακισχιλίων
  choice: для п’яти тисяч
  rationale: Контекстуально передає зв’язок із нагодуванням п’яти тисяч, природніше за буквальне «п’яти тисяч» без прийменника.
- source_word: πόσους κοφίνους
  choice: скільки кошиків
  rationale: Зберігає конкретний образ і питання про кількість посудин.
- source_word: ἐλάβετε
  choice: ви зібрали
  rationale: У контексті збирання залишків передає дію природною сучасною українською; буквальніше дієслово може означати «взяли».
theological_decisions: []
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Початкове «Невже» передає риторичний і докірливий характер запитання, а «й досі не» — часовий відтінок οὔπω. Синтаксис збережено як одне запитання з двома координованими дієсловами.
