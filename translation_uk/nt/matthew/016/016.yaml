  text: ἀποκριθεὶς δὲ Σίμων Πέτρος εἶπεν· Σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ τοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/016.yaml
  text: Simon Peter answered[a], “You are the Messiah, the Son of the living God.”
translation:
  language: uk
  text: 'А Симон Петро відповів: «Ти — Месія[a], Син живого Бога».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Христос». Грецький титул Χριστός означає «Помазаник»; тут його передано словом «Месія», щоб зберегти значення титулу та юдейський месіанський контекст.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: відповів
  rationale: Дієприкметник ἀποκριθείς разом з εἶπεν утворює звичну грецьку формулу введення відповіді. Українське «відповів» природно передає її без дослівного дублювання «відповів і сказав».
- source_word: δὲ
  choice: А
  rationale: Частка δέ позначає м’який перехід у розповіді; «А» природно зберігає цей зв’язок у сучасній українській.
- source_word: Σίμων Πέτρος
  choice: Симон Петро
  rationale: Особові імена передано за усталеною українською біблійною формою.
- source_word: Σὺ
  choice: Ти
  rationale: Явно вжитий грецький займенник має наголос; український займенник «Ти» та інтонаційне тире зберігають виразність сповідання.
- source_word: ὁ χριστὸς
  choice: Месія
  rationale: Χριστός тут є титулом і відповідає юдейському поняттю Помазаника; «Месія» виразно передає титульне значення, тоді як «Христос» наведено у примітці як традиційний відповідник.
- source_word: ὁ υἱὸς
  choice: Син
  rationale: Артикль указує на конкретний титул; означеність в українській природно передається контекстом і великою літерою в титульному вживанні.
- source_word: τοῦ θεοῦ τοῦ ζῶντος
  choice: живого Бога
  rationale: Атрибутивний дієприкметник ζῶντος природно передано прикметником «живого», зі збереженням означення Бога та його якісного контрасту з неживими божествами.
theological_decisions:
- issue: Передача Χριστός як титулу чи іменоподібної форми
  choice: Месія
  alternative: Христос
  rationale: У Петровому сповіданні Χριστός функціонує як месіанський титул. Основний текст передає його значення, а примітка зберігає традиційний відповідник без нав’язування окремого тлумачення.
- issue: Зміст титулу «Син Божий»
  choice: Син живого Бога
  alternative: —
  rationale: Формулювання точно зберігає грецький конфесійний титул і не розгортає його в пізніші богословські визначення.
translation_notes:
  register: Сучасна, природна й урочиста українська мова. Тире після «Ти» передає наголос явного займенника; біблійні титули «Месія» і «Син» написано з великої літери.
