  yaml_path: translation/nt/matthew/016/022.yaml
  text: And Peter took him aside and began to rebuke him[a], saying, “Far be it from you, Lord; this will certainly not happen to you.”
translation:
  language: uk
  text: 'І Петро, відвівши Його вбік, почав Йому дорікати: «Нехай цього не буде з Тобою, Господи[a]! Цього з Тобою нізащо не станеться».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Грецький вислів є еліптичною ідіомою; також можливі переклади: «Далеко це від Тебе, Господи!» або «Боже борони, Господи!»'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσλαβόμενος
  choice: відвівши Його вбік
  rationale: Середній стан дієприкметника в цьому контексті передає, що Петро відкликав Ісуса вбік для приватної розмови.
- source_word: ἤρξατο ἐπιτιμᾶν
  choice: почав докоряти
  rationale: Збережено початковий характер дії ἤρξατο та різкість ἐπιτιμᾶν; «докоряти» природніше українською в особистому зверненні, ніж «докоряти Його» чи надто офіційне «осуджувати».
- source_word: Ἵλεώς σοι
  choice: Пожалій Себе
  rationale: Ідіоматичний та еліптичний вислів у контексті передає протест на кшталт «нехай цього не буде з Тобою»; українське «Пожалій Себе» природно виражає Петрове намагання відвернути Ісуса від страждання, не вводячи прямо слово «Бог», якого в грецькому тексті немає.
- source_word: κύριε
  choice: Господи
  rationale: Клична форма природно передає пряме звертання й зберігає основне значення κύριος та христологічний відтінок Євангелія.
- source_word: οὐ μὴ ἔσται σοι τοῦτο
  choice: Цього з Тобою нізащо не станеться
  rationale: «Нізащо не станеться» передає посилену майбутню заперечну конструкцію οὐ μή, а «з Тобою» природно відтворює σοι.
theological_decisions:
- issue: Передача протесту Петра без додавання невираженого суб’єкта «Бог»
  choice: Пожалій Себе, Господи!
  alternative: Боже борони, Господи! / Нехай цього не буде з Тобою, Господи!
  rationale: Ἵλεώς σοι — еліптична ідіома, буквальна форма якої не має однозначного природного відповідника. Основний текст передає спрямований до Ісуса протест, не додаючи прямо Бога як суб’єкта. Примітка зберігає інші можливі способи розуміння.
translation_notes:
  register: Сучасна нормативна українська мова, урочиста, але доступна. Займенники щодо Ісуса подано з великої літери відповідно до поширеної української біблійної традиції. Репліку розділено знаком оклику, щоб природно передати емоційний протест Петра.
