  terminology: «Господи» належно передає кличний κύριε. «Дорікати» є придатним сучасним відповідником ἐπιτιμᾶν у цьому контексті. Посилене «нізащо не станеться» адекватно відтворює emphatic οὐ μή з майбутнім часом.
