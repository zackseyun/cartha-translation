  source_fidelity: 'Початкові члени вірша передано загалом точно: Петро відводить Ісуса вбік і починає Йому дорікати. Проте «Пожалій Себе» є наказовою формою, якої немає в ἵλεώς σοι, і звужує ідіоматичний протест до заклику Ісусові самому себе пожаліти. Безпечніше передати еліптичний вислів як побажання, не вводячи невираженого суб’єкта «Бог».'
