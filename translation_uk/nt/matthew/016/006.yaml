    issue: Standalone «Пильнуйте» is stylistically less natural here.
    rationale: Although understandable, Ukrainian more commonly expresses this alerting imperative as «Будьте пильні» in combination with a following warning. The revision improves idiomatic modern usage without adding interpretation.
