  to: 'А Ісус сказав їм: «Будьте пильні та остерігайтеся закваски[a] фарисеїв і садукеїв».'
  rationale: The revision replaces the slightly marked standalone imperative «Пильнуйте» with the idiomatic warning «Будьте пильні», while retaining the Greek’s paired warning and its figurative «закваска». No theological interpretation is introduced into the main text; the explanatory footnote remains appropriately contextual.
