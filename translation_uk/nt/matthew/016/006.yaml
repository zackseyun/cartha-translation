review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the Greek transition (δὲ), Jesus’ speech, the doubled warning (Ὁρᾶτε καὶ προσέχετε), the warning directed away from the leaven (ἀπὸ τῆς ζύμης), and both group names. It properly retains «закваска» as the metaphor rather than anticipating the explanation in v. 12.
  naturalness: «Пильнуйте» without an object is somewhat less idiomatic in contemporary standard Ukrainian in this warning formula. «Будьте пильні та остерігайтеся» is clear, natural, and preserves the twofold exhortation.
  terminology: «Закваска», «фарисеї», and «садукеї» are established and appropriate Ukrainian biblical terms. The footnote’s alternative «дріжджів» is legitimate, while the main text rightly preserves the broader metaphorical term «закваска».
  issues:
