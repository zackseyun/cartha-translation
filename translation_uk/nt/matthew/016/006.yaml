source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ὁρᾶτε καὶ προσέχετε ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/006.yaml
  text: But Jesus said to them[a], “Watch out and beware of the leaven of the Pharisees and Sadducees.”
translation:
  language: uk
  text: 'А Ісус сказав їм: «Будьте пильні та остерігайтеся закваски[a] фарисеїв і садукеїв».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «дріжджів». Грецьке слово означає закваску — те, що заквашує тісто. Тут воно вжите як метафора, яку Ісус пояснює далі у зв’язку з ученням фарисеїв і садукеїв.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: А
  rationale: Передає легкий перехід або протиставлення попередньому контексту без надмірного підсилення.
- source_word: εἶπεν αὐτοῖς
  choice: сказав їм
  rationale: Прямий і природний відповідник грецької конструкції з непрямим додатком.
- source_word: Ὁρᾶτε
  choice: Пильнуйте
  rationale: У цьому наказовому вживанні дієслово не означає просто фізично «дивіться», а закликає бути насторожі.
- source_word: προσέχετε
  choice: остерігайтеся
  rationale: Разом із Ὁρᾶτε посилює застереження; українська пара «пильнуйте й остерігайтеся» зберігає риторичне подвоєння.
- source_word: ἀπὸ
  choice: —ся (закваски)
  rationale: Після українського «остерігатися» значення грецького прийменника природно передається родовим відмінком без окремого прийменника.
- source_word: ζύμης
  choice: закваски
  rationale: «Закваска» точно передає речовину, що заквашує тісто, і зберігає образність вислову; «дріжджі» є можливим сучасним функціональним відповідником, але дещо звужує давній образ.
- source_word: Φαρισαίων
  choice: фарисеїв
  rationale: Усталена українська назва цієї релігійної групи.
- source_word: Σαδδουκαίων
  choice: садукеїв
  rationale: Усталена українська назва цієї релігійної групи.
theological_decisions:
- issue: Метафоричне значення «закваски»
  choice: Зберегти метафору в основному тексті без пояснювальної заміни.
  alternative: учення або вплив
  rationale: У цьому вірші Ісус уживає образ ζύμη; його конкретне значення розкривається далі в контексті. Передчасна заміна на «учення» чи «вплив» усунула б літературну послідовність і частину образної напруги.
translation_notes:
  register: Сучасна літературна українська мова з гідним, доступним звучанням. Подвійний наказ оригіналу збережено, а метафору не розтлумачено передчасно в основному тексті.
