  terminology: «Учні» є усталеним відповідником μαθηταί у євангельському контексті. «Хліб» природно передає харчові припаси, а примітка коректно зазначає можливі буквальні відповідники «хліби» / «буханці». Маркер примітки поставлено після речення та узгоджено з наданим набором приміток.
