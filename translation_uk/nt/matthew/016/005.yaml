  text: Καὶ ἐλθόντες οἱ ⸀μαθηταὶ εἰς τὸ πέραν ἐπελάθοντο ἄρτους λαβεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/005.yaml
  text: And when the disciples came to the other side[a], they had forgotten to take bread.
translation:
  language: uk
  text: Коли учні прибули на той бік, то забули взяти хліб.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Грецькою — «хліби» або «буханці»; тут природно передано збірним словом «хліб».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: коли … прибули
  rationale: Аористовий дієприкметник передано підрядним реченням часу, природним для сучасної української мови й таким, що зберігає часовий зв’язок із головною дією.
- source_word: οἱ μαθηταὶ
  choice: учні
  rationale: У Євангеліях це усталене й контекстуально точне позначення учнів Ісуса.
- source_word: εἰς τὸ πέραν
  choice: на той бік
  rationale: Природний український відповідник євангельського вислову про переправу на протилежний бік водойми.
- source_word: ἐπελάθοντο
  choice: забули
  rationale: Дієслово означає «забути»; український доконаний минулий час природно передає завершену попередню дію без потреби штучно відтворювати англійський давноминулий час.
- source_word: ἄρτους
  choice: хліб
  rationale: Грецьке слово стоїть у множині («хліби», «буханці»), але в цьому контексті український збірний іменник «хліб» звучить природніше й передає зміст припасів.
- source_word: λαβεῖν
  choice: взяти
  rationale: Інфінітив доповнює дієслово «забули»; «взяти» безпосередньо відповідає значенню λαμβάνω в цьому контексті.
