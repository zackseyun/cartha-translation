  source_fidelity: 'Текст точно передає всі основні компоненти грецького оригіналу: часовий аористовий дієприкметник ἐλθόντες природно відтворено як «Коли ... прибули», εἰς τὸ πέραν — «на той бік», а ἐπελάθοντο ἄρτους λαβεῖν — «забули взяти хліб». Збірний «хліб» є контекстуально прийнятним відповідником множини ἄρτους, а примітка належно фіксує формальну множину оригіналу.'
