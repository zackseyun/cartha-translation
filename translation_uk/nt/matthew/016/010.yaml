  yaml_path: translation/nt/matthew/016/010.yaml
  text: Or the seven loaves for the four thousand[a], and how many large baskets you picked up?
translation:
  language: uk
  text: Або про сім хлібів для чотирьох тисяч і скільки великих кошиків ви зібрали?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ
  choice: Або
  rationale: У цьому еліптичному продовженні низки риторичних запитань сполучник природно передано як «Або»; можливе буквальніше «Ані» залежить від зв’язку з попереднім віршем.
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: сім хлібів
  rationale: У контексті нагодування ἄρτους означає окремі хліби; українське «хлібів» природно передає конкретний образ.
- source_word: τῶν τετρακισχιλίων
  choice: для чотирьох тисяч
  rationale: Родовий відмінок указує на зв’язок із нагодуванням чотирьох тисяч; прийменникова конструкція ясно передає цей контекстуальний зв’язок.
- source_word: πόσας
  choice: скільки
  rationale: Питальний прикметник узгоджується зі σπυρίδας; українське «скільки» є прямим і природним відповідником.
- source_word: σπυρίδας
  choice: великих кошиків
  rationale: σπυρίς позначає місткіший кошик, ніж κόφινος; уточнення «великих» зберігає важливе лексичне розрізнення в оповідях про нагодування.
- source_word: ἐλάβετε
  choice: ви зібрали
  rationale: У контексті залишків після нагодування дієслово означає їх збирання; «зібрали» звучить природно й точно.
