    issue: The two distinct Greek verbal expressions for coming after Jesus and following him are rendered identically as «йти за Мною».
    rationale: ὀπίσω μου ἐλθεῖν introduces the decision to come/go after Jesus, while ἀκολουθείτω is a present imperative denoting continued following. Rendering the first as «піти за Мною» and retaining «йде за Мною» for the latter preserves this distinction naturally without overtranslating.
