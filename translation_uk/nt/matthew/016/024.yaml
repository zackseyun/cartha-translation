  text: Τότε ὁ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Εἴ τις θέλει ὀπίσω μου ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/024.yaml
  text: Then Jesus said to his disciples[a], “If anyone wants to come after me, let him deny himself and take up his cross and follow me.”
translation:
  language: uk
  text: 'Тоді Ісус сказав Своїм учням: «Якщо хто хоче піти за Мною, нехай зречеться себе, візьме свій хрест і йде за Мною».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Тоді
  rationale: Природний часовий і розповідний маркер, що передає послідовність подій.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: Своїм учням
  rationale: «Учні» усталено й точно передає μαθηταί у контексті Євангелія; зворотний присвійний займенник «Своїм» природний українською, коли власником є підмет.
- source_word: Εἴ τις θέλει
  choice: Якщо хто хоче
  rationale: Передає умовність, невизначено-узагальнене τις і значення волі в θέλει; українська конструкція охоплює будь-яку людину без потреби в родовому маркуванні.
- source_word: ὀπίσω μου ἐλθεῖν
  choice: йти за Мною
  rationale: Зберігає просторову метафору учнівства й природно звучить українською. Дієслово «йти» тут відповідає контекстуальному значенню ἐλθεῖν у сполуці з ὀπίσω μου.
- source_word: ἀπαρνησάσθω ἑαυτὸν
  choice: нехай зречеться себе
  rationale: «Зректися себе» прямо й урочисто передає рішуче самозречення, виражене аористовим імперативом.
- source_word: ἀράτω τὸν σταυρὸν αὐτοῦ
  choice: візьме свій хрест
  rationale: «Взяти свій хрест» природно передає підняття хреста для несення та зберігає особистий характер ціни учнівства.
- source_word: ἀκολουθείτω μοι
  choice: йде за Мною
  rationale: Теперішній імператив має тривалий відтінок; «нехай … йде за Мною» природно передає постійне слідування, не додаючи слова «постійно».
theological_decisions:
- issue: Узагальнена граматична форма в умові та наказах
  choice: 'Використати українське «хто» з формами, узгодженими з ним: «нехай зречеться… візьме… йде».'
  alternative: «Якщо хтось хоче… нехай він зречеться себе…»
  rationale: Грецький текст має однину й граматично чоловічі форми в узагальненому значенні. Українське «хто» природно зберігає однину та універсальний обсяг вислову, не звужуючи його до чоловіків і не переходячи до множини.
- issue: Співвідношення аористових і теперішнього імперативів
  choice: Передати всі накази природною українською, а тривалий характер ἀκολουθείτω відобразити конструкцією «йде за Мною».
  alternative: Додати «нехай постійно йде за Мною».
  rationale: Граматичне протиставлення може вказувати на рішучість самозречення і взяття хреста та тривалість слідування, однак явне «постійно» було б тлумачним додаванням.
translation_notes:
  register: Сучасна стандартна українська, гідний і зрозумілий біблійний стиль. Займенники щодо Ісуса подано з великої літери як поширену українську видавничу норму. Текст зберігає паралелізм двох висловів «за Мною», відповідних різним грецьким конструкціям.
