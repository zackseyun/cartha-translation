  rationale: The revision changes only the first «йти» to perfective «піти». This distinguishes the initial movement or commitment expressed by ἐλθεῖν from the ongoing following expressed by ἀκολουθείτω, while preserving the source’s syntax, generic singular sense, and established Ukrainian biblical register.
