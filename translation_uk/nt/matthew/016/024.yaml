  source_fidelity: The draft accurately renders the temporal marker, audience, conditional universality, self-denial, personal possession of the cross, and the imperatival sequence. However, it uses the same imperfective expression «йти за Мною» for both ὀπίσω μου ἐλθεῖν and ἀκολουθείτω μοι. A modest aspectual distinction better preserves the source’s two verbal expressions and the present imperative’s ongoing force in the final command.
  naturalness: The wording is fluent, dignified modern standard Ukrainian. «Якщо хто» is idiomatic in a biblical register and naturally expresses the generic singular without artificial gender marking. «Піти за Мною» followed by «йде за Мною» is natural Ukrainian and maintains the rhetorical progression.
  terminology: «Учні», «зречеться себе», and «свій хрест» are accurate, established Gospel terminology. Capitalization of pronouns referring to Jesus is an acceptable Ukrainian editorial convention. No theological interpretation has been added.
  issues:
