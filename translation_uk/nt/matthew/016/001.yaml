id: MAT.16.1
reference: Matthew 16:1
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Καὶ προσελθόντες οἱ Φαρισαῖοι καὶ Σαδδουκαῖοι πειράζοντες ἐπηρώτησαν αὐτὸν σημεῖον ἐκ τοῦ οὐρανοῦ ἐπιδεῖξαι αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/001.yaml
  text: And the Pharisees and Sadducees came and[a], testing him, asked him to show them a sign from heaven.
translation:
  language: uk
  text: І підійшли фарисеї та саддукеї й, випробовуючи його[a], попросили показати їм знак із неба.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «спокушаючи його»; або: «намагаючись підловити його».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: підійшли
  rationale: Дієприкметник аориста позначає наближення до Ісуса перед головною дією; особова форма природно передає це українською.
- source_word: Φαρισαῖοι
  choice: фарисеї
  rationale: Усталена українська передача назви цієї релігійної групи.
- source_word: Σαδδουκαῖοι
  choice: саддукеї
  rationale: Усталена українська передача назви цієї релігійної групи.
- source_word: πειράζοντες
  choice: випробовуючи
  rationale: Передає дію перевірки з наявним у контексті ворожим відтінком, не звужуючи значення до конкретного способу пастки.
- source_word: ἐπηρώτησαν
  choice: попросили
  rationale: У конструкції з інфінітивом дієслово виражає прохання щось зробити; «попросили показати» природніше українською, ніж буквальне «запитали показати».
- source_word: σημεῖον
  choice: знак
  rationale: Зберігає широке значення грецького слова, не додаючи прямо не висловленого означення «чудесний».
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: із неба
  rationale: Природна українська передача походження або джерела знаку.
- source_word: ἐπιδεῖξαι
  choice: показати
  rationale: Прямо й природно передає інфінітив зі значенням показу або явного представлення.
theological_decisions:
- issue: Ворожий відтінок прохання фарисеїв і саддукеїв
  choice: «випробовуючи його»
  alternative: «спокушаючи його» або «намагаючись підловити його»
  rationale: «Випробовуючи» зберігає семантичну широту πειράζοντες і напруження оповіді, не визначаючи точніше, ніж грецький текст, характер їхнього задуму.
translation_notes:
  register: Сучасна стандартна українська мова; виклад природний і водночас гідний. Початкове «І» зберігає зв’язок із попередньою розповіддю, а назви груп подано в усталеній українській формі.
