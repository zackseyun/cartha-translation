  verdict: approve
  source_fidelity: 'Текст точно передає синтаксичний рух оригіналу: прихід/наближення фарисеїв і саддукеїв, супровідну дію πειράζοντες, їхнє прохання та зміст прохання. «Попросили показати їм знак із неба» природно передає ἐπηρώτησαν αὐτὸν σημεῖον ἐκ τοῦ οὐρανοῦ ἐπιδεῖξαι αὐτοῖς без додавання слова «чудесний».'
  naturalness: Фраза звучить природно сучасною літературною українською. «Підійшли ... й ... попросили показати» є ясним і не перевантаженим відтворенням грецької конструкції.
  terminology: «Фарисеї», «саддукеї», «знак» та «із неба» є усталеними й доречними відповідниками. «Випробовуючи його» зберігає широту πειράζοντες і ворожо-перевірочний контекст, не нав’язуючи конкретного тлумачення. Виноска коректно подає можливі лексичні альтернативи та має належну прив’язку.
