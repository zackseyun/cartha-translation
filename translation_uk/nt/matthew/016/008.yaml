source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς ⸀εἶπεν· Τί διαλογίζεσθε ἐν ἑαυτοῖς, ὀλιγόπιστοι, ὅτι ἄρτους οὐκ ⸀ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/008.yaml
  text: But Jesus[a], knowing this, said, “Why are you discussing among yourselves, you of little faith, that you have no bread?”
translation:
  language: uk
  text: 'Та Ісус, знаючи це, сказав: «Чому ви, маловіри, міркуєте між собою про те, що не взяли із собою хліба[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не взяли хлібів».'
    reason: Зберігає для читача грецьку множину ἄρτους і буквальніше значення ἐλάβετε, тоді як основний текст подає природний український вислів.
lexical_decisions:
- source_word: γνοὺς
  choice: зрозумівши це
  rationale: Аористовий дієприкметник передає усвідомлення Ісусом того, про що учні міркували; «це» природно відновлює невиражений у грецькому тексті додаток із контексту.
- source_word: δὲ
  choice: Та
  rationale: Передає м’який контраст і перехід до відповіді Ісуса без надмірного протиставлення.
- source_word: διαλογίζεσθε ἐν ἑαυτοῖς
  choice: міркуєте між собою
  rationale: Зберігає значення спільного обговорення або роздумування учнів; вислів ἐν ἑαυτοῖς у цьому контексті природно означає «між собою».
- source_word: ὀλιγόπιστοι
  choice: маловіри
  rationale: Стисло й прямо передає звертання-докір щодо недостатньої віри, характерне для Євангелія від Матвія.
- source_word: ὅτι
  choice: про те, що
  rationale: Тлумачить ὅτι як введення змісту міркувань. Українська конструкція «міркувати про те, що» звучить природніше, ніж буквальне приєднання сполучником «що».
- source_word: ἄρτους οὐκ ἐλάβετε
  choice: не взяли із собою хліба
  rationale: Передає буквальне «не взяли хлібів» у природній українській формі; «із собою» уточнюється з безпосереднього контексту подорожі.
theological_decisions:
- issue: Сила докору ὀλιγόπιστοι
  choice: маловіри
  alternative: ті, хто має мало віри
  rationale: Збережено прямий докір Ісуса щодо недостатньої довіри учнів, але без розширення його до загального доктринального твердження.
- issue: Функція ὅτι
  choice: 'вводить зміст міркувань: «про те, що»'
  alternative: причинове «через те, що / бо»
  rationale: Синтаксис допускає причинне прочитання, однак контекст попередньої розмови учнів краще підтримує розуміння ὅτι як позначення змісту їхніх міркувань; причинну відтіненість не слід перетворювати на окреме богословське твердження.
translation_notes:
  register: Сучасна нормативна українська мова, придатна для публічного читання. Збережено гідний, прямий тон Ісусового запитання; синтаксис дещо впорядковано для природності без усунення докору чи змістової напруги.
