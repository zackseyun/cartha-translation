  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Δεῦτε ὀπίσω μου, καὶ ποιήσω ὑμᾶς ἁλιεῖς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/019.yaml
  text: And he says to them[a], “Come after me, and I will make you fishers of men.”
translation:
  language: uk
  text: 'І каже їм: «Ідіть за Мною, і Я зроблю вас ловцями людей».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: каже
  rationale: Теперішній час зберігає грецький історичний теперішній, природний для євангельської оповіді.
- source_word: Δεῦτε ὀπίσω μου
  choice: Ідіть за Мною
  rationale: Природний український заклик до слідування, який передає і спонукальне Δεῦτε, і напрямок ὀπίσω μου без неприродного буквального «прийдіть позаду Мене».
- source_word: ποιήσω
  choice: Я зроблю
  rationale: Прямо передає майбутню активну дію та обіцянку Ісуса перетворити учнів.
- source_word: ἁλιεῖς
  choice: ловцями
  rationale: Українське «ловці» зберігає образ тих, хто ловить, і природно поєднується з родовим відмінком «людей».
- source_word: ἀνθρώπων
  choice: людей
  rationale: У цьому контексті ἄνθρωπος означає людей загалом, а українське «людей» точно й природно передає цей загальнолюдський сенс без звуження до осіб чоловічої статі.
theological_decisions:
- issue: Обсяг значення ἀνθρώπων у вислові ἁλιεῖς ἀνθρώπων
  choice: ловцями людей
  alternative: ловцями чоловіків
  rationale: Грецький родовий множини тут має загальнолюдське значення. Українське «чоловіків» помилково звузило б зміст до дорослих осіб чоловічої статі; «людей» зберігає і граматичну конструкцію, і задуману широту образу.
translation_notes:
  register: Сучасна стандартна українська, стислий і гідний біблійний стиль. Займенники щодо Ісуса подано з великої літери відповідно до поширеної української біблійної традиції; пунктуація оформлює пряму мову природно.
