  source_fidelity: «І каже їм» точно передає історичний теперішній λέγει. «Ідіть за Мною» природно передає спонукальне Δεῦτε разом з ὀπίσω μου, а «Я зроблю вас ловцями людей» зберігає майбутню обіцянку ποιήσω і образ ἁλιεῖς ἀνθρώπων.
  naturalness: Текст звучить природно в сучасній стандартній українській і зберігає стислий біблійний регістр. «Ловцями людей» є усталеним і зрозумілим образом у цьому контексті.
  terminology: «Людей» правильно передає загальнолюдське значення ἀνθρώπων; «чоловіків» було б невиправданим звуженням. Написання займенника «Мною» з великої літери відповідає поширеній українській біблійній практиці.
