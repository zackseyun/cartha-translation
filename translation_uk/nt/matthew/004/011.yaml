base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/011.yaml
  text: Then the devil left him[a], and behold, angels came and were ministering to him.
translation:
  language: uk
  text: Тоді диявол залишив його, і ось ангели підійшли й служили йому.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «прислуговували йому». Грецьке дієслово може означати «служити» або «прислуговувати»; форма імперфекта вказує на тривалу дію.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Тоді
  rationale: Природний український часовий сполучник, що позначає наступну подію в розповіді.
- source_word: ἀφίησιν
  choice: залишив
  rationale: Грецький історичний теперішній час природно передано минулим часом в українській оповіді; у цьому контексті дієслово означає, що диявол відійшов від Ісуса.
- source_word: ὁ διάβολος
  choice: диявол
  rationale: У розповіді про спокусу це усталене особове найменування супротивника; буквальне «наклепник» тут затьмарило б референцію.
- source_word: ἰδοὺ
  choice: ось
  rationale: Зберігає вказівний маркер, який привертає увагу до раптової появи ангелів, і звучить природно сучасною українською.
- source_word: ἄγγελοι
  choice: ангели
  rationale: Контекст указує на небесних посланців, тому «ангели» точніше за загальне «посланці».
- source_word: προσῆλθον
  choice: підійшли
  rationale: Передає значення наближення до Ісуса точніше, ніж ширше «прийшли».
- source_word: διηκόνουν
  choice: служили
  rationale: Недоконаний вид природно відтворює тривалу або повторювану дію грецького імперфекта; слово не уточнює способу служіння понад те, що виражає оригінал.
- source_word: αὐτῷ
  choice: йому
  rationale: Давальний займенник позначає того, кому служили ангели; малу літеру вжито без додавання відсутньої в грецькому тексті конфесійної графічної традиції.
theological_decisions:
- issue: Значення διάβολος як назви дійової особи
  choice: диявол
  alternative: наклепник
  rationale: Хоча слово етимологічно може означати «наклепник», у цьому контексті воно функціонує як усталене позначення особи, що спокушає Ісуса.
- issue: Характер ангельського служіння
  choice: служили йому
  alternative: прислуговували йому
  rationale: «Служили» зберігає широту дієслова διακονέω і не звужує дію лише до подавання їжі чи побутової прислуги.
translation_notes:
  register: Сучасна, зрозуміла й водночас гідна оповідна українська. Частку «ось» збережено для виразності; займенники щодо Ісуса подано з малої літери відповідно до звичайної сучасної орфографії та без внесення додаткової конфесійної ознаки.
