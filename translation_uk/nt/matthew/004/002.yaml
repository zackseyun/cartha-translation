lexical_decisions:
- source_word: νηστεύσας
  choice: постивши
  rationale: Аористовий активний дієприкметник виражає дію, що передує головному дієслову; український дієприслівник природно й стисло передає цей зв’язок.
- source_word: ἡμέρας τεσσεράκοντα καὶ νύκτας τεσσεράκοντα
  choice: сорок днів і сорок ночей
  rationale: Знахідний відмінок тривалості позначає проміжок часу; українською ця тривалість природно передається без додаткового прийменника.
- source_word: ὕστερον
  choice: зрештою
  rationale: Прислівник позначає наступний момент після тривалого посту. «Зрештою» зберігає часову послідовність і природно звучить у сучасній українській.
- source_word: ἐπείνασεν
  choice: зголоднів
  rationale: Аорист πεινάω тут природно позначає настання голоду; «зголоднів» точніше передає зміну стану, ніж статичне «був голодний».
- source_word: καὶ
  choice: І
  rationale: Простий сурядний сполучник зберігає безпосереднє продовження розповіді без доданої інтерпретації.
theological_decisions:
- issue: Наголос оповіді на справжній людській потребі Ісуса після посту
  choice: Він зрештою зголоднів
  alternative: Він був голодний
  rationale: «Зголоднів» ясно передає реальне настання фізичного голоду, не додаючи до тексту окремого доктринального пояснення.
translation_notes:
  register: Сучасна стандартна українська мова; виклад стислий, природний і гідний. Займенник «Він» написано з великої літери відповідно до поширеної української біблійної традиції.
