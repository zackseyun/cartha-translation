id: MAT.4.6
reference: Matthew 4:6
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Εἰ υἱὸς εἶ τοῦ θεοῦ, βάλε σεαυτὸν κάτω· γέγραπται γὰρ ὅτι Τοῖς ἀγγέλοις αὐτοῦ ἐντελεῖται περὶ σοῦ καὶ ἐπὶ χειρῶν ἀροῦσίν σε, μήποτε προσκόψῃς πρὸς λίθον τὸν πόδα σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/006.yaml
  text: 'And he said to him[a], “If you are the Son of God, throw yourself down, for it is written: ‘He will command his angels concerning you,’ and ‘On their hands they will lift you up[b], lest you strike your foot against a stone.’”'
translation:
  language: uk
  text: 'І каже Йому: «Якщо Ти Син Божий, кинься вниз, адже написано: “Своїм ангелам Він накаже про Тебе”, і: “На руках вони понесуть Тебе, щоб Ти не вдарився ногою об камінь”».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: каже
  rationale: Історичний теперішній у грецькій розповіді природно й виразно передається українським теперішнім часом.
- source_word: Εἰ
  choice: Якщо
  rationale: Зберігає умовний і випробувальний характер виклику, не перетворюючи умову на твердження.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: Син Божий
  rationale: У контексті Матвія це усталене христологічне найменування; українська форма природна й не потребує артикля.
- source_word: βάλε σεαυτὸν κάτω
  choice: кинься вниз
  rationale: Природний сучасний відповідник наказового звороту з рефлексивним займенником і прислівником напрямку.
- source_word: γέγραπται
  choice: написано
  rationale: Усталена українська формула введення цитати зі Святого Письма, яка передає чинність написаного.
- source_word: ἐντελεῖται
  choice: накаже
  rationale: Передає майбутню дію та владне доручення ангелам.
- source_word: περὶ σοῦ
  choice: про Тебе
  rationale: Прямий і природний відповідник περί з родовим відмінком, без звуження значення до «для Тебе».
- source_word: ἐπὶ χειρῶν
  choice: На руках
  rationale: Зберігає образ підтримки руками та значення прийменника ἐπί з родовим.
- source_word: ἀροῦσίν σε
  choice: вони понесуть Тебе
  rationale: У цьому контексті αἴρω означає підтримувати й нести; «понесуть» природно поєднується з образом рук.
- source_word: μήποτε προσκόψῃς πρὸς λίθον
  choice: щоб Ти не вдарив об камінь
  rationale: Природно передає запобіжний зворот μήποτε та конкретний образ удару ноги об камінь.
- source_word: τὸν πόδα σου
  choice: Своєї ноги
  rationale: Збережено грецьку однину; зворот із «своєї» нормативно вказує на підмет підрядної частини.
theological_decisions:
- issue: Христологічна сила вислову «Син Божий» у виклику спокусника
  choice: Передано як титул «Син Божий»
  alternative: Буквальніше «син Бога», що українською могло б звучати як родове, а не титульне позначення
  rationale: У контексті Євангелія від Матвія вислів є впізнаваним христологічним найменуванням; переклад зберігає цю силу, не додаючи пояснення.
- issue: Цитування Псалма спокусником
  choice: Цитату передано без виправлення чи тлумачного застереження в основному тексті
  alternative: Додати в тексті кваліфікацію щодо способу використання Писання
  rationale: Оповідь навмисно подає спокусника, який цитує Писання; переклад має зберегти цю богословську напругу, а не вирішувати її вставним коментарем.
translation_notes:
  register: Сучасна стандартна українська, гідний оповідний стиль. Великі літери в займенниках щодо Ісуса вжито відповідно до поширеної української біблійної традиції. Лапки розмежовують слова промовця та вкладену біблійну цитату.
