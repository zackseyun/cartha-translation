  terminology: '«Поклонишся мені» є вдалим основним відповідником προσκυνήσῃς у цьому контексті: він допускає значення жесту покори, але водночас передає релігійну вагу вимоги. Примітка належно подає можливі лексичні альтернативи й пояснює контекстуальну перевагу значення поклоніння. Назви та спеціальні богословські терміни в самому вірші не потребують додаткового уточнення.'
