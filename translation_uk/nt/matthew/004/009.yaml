  source_fidelity: 'Текст точно передає всі складники грецького оригіналу: καὶ εἶπεν αὐτῷ — «І сказав йому»; Ταῦτά σοι πάντα δώσω — «Усе це я дам тобі»; ἐὰν πεσὼν προσκυνήσῃς μοι — «якщо ти, впавши ниць, поклонишся мені». Дієприслівникова конструкція коректно відбиває аористний дієприкметник πεσών, а «усе це» природно передає neutrum plural Ταῦτα разом із πάντα.'
