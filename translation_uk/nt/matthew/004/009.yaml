base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/009.yaml
  text: And he said to him[a], “I will give you all these things, if you fall down and worship me.”
translation:
  language: uk
  text: 'І сказав йому: «Усе це я дам тобі, якщо ти, впавши ниць, поклонишся мені[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «вклонишся мені» чи «віддаси мені шану». Грецьке дієслово може означати простягання ниць, уклін або вияв пошани, але в цьому контексті йдеться про поклоніння.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: І
  rationale: Простий сурядний сполучник природно продовжує розповідь, не додаючи виразнішого часового відтінку.
- source_word: εἶπεν αὐτῷ
  choice: сказав йому
  rationale: Збережено займенникове формулювання грецького тексту без додавання імен, яких у цьому реченні немає.
- source_word: Ταῦτά σοι πάντα δώσω
  choice: Усе це я дам тобі
  rationale: Передано повний обсяг πάντα та вказівне Ταῦτά; порядок слів природний для сучасної української й зберігає наголос на обіцяній сукупності.
- source_word: ἐὰν
  choice: якщо
  rationale: Прямо й природно вводить умову.
- source_word: πεσὼν
  choice: впавши ниць
  rationale: Дієприслівник зберігає супровідну тілесну дію, що передує поклонінню; «ниць» виразно передає простягання або низький уклін.
- source_word: προσκυνήσῃς μοι
  choice: поклонишся мені
  rationale: Українське «поклонитися» природно передає як жест глибокої покори, так і релігійне поклоніння; контекст наступного вірша надає вимозі виразного богослужбового змісту.
theological_decisions:
- issue: Значення προσκυνέω у вимозі спокусника
  choice: поклонишся мені
  alternative: вклонишся мені; віддаси мені шану
  rationale: Контекст спокуси та відповідь Ісуса про поклоніння одному Богові в наступному вірші вказують на релігійне поклоніння. Водночас обране українське слово й примітка зберігають ширший смисловий діапазон грецького дієслова.
translation_notes:
  register: Сучасна літературна українська з урочистою, але доступною біблійною інтонацією. Займенники щодо Ісуса подано з малої літери, відповідно до форми оригіналу й нейтральної сучасної практики; риторичний наголос збережено початковим «Усе це».
