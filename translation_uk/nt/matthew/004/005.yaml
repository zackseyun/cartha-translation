lexical_decisions:
- source_word: Τότε
  choice: Тоді
  rationale: Природний український часовий прислівник, що позначає наступну подію в оповіді.
- source_word: παραλαμβάνει
  choice: бере Його з собою
  rationale: Передає значення взяття когось із собою та зберігає оповідний історичний теперішній час грецького тексту.
- source_word: ὁ διάβολος
  choice: диявол
  rationale: У цьому контексті слово є усталеним особовим найменуванням супротивника; буквальне «наклепник» тут недоречне.
- source_word: εἰς τὴν ἁγίαν πόλιν
  choice: до святого міста
  rationale: Українське «до» природно виражає спрямований рух, а «святе місто» зберігає грецьке означення без підстановки власної назви.
- source_word: ἔστησεν
  choice: ставить
  rationale: 'Перехідне каузативне значення: диявол ставить Ісуса в певному місці. Теперішній час природно продовжує жваву оповідь після παραλαμβάνει.'
- source_word: ἐπὶ τὸ πτερύγιον
  choice: на верхівці
  rationale: Читабельний відповідник імовірного архітектурного значення — високого виступу або крайньої верхньої частини; точну невизначеність збережено в примітці.
- source_word: τοῦ ἱεροῦ
  choice: храму
  rationale: У звичайній українській мові «храм» є природним відповідником, хоча грецьке ἱερόν позначає весь храмовий комплекс, а не лише внутрішнє святилище.
theological_decisions:
- issue: Ототожнення «святого міста»
  choice: Зберегти в основному тексті назву «святе місто».
  alternative: Єрусалим
  rationale: Грецький текст уживає почесне означення, а не власну назву; примітка дає потрібне географічне пояснення без заміни формулювання оригіналу.
- issue: Точне значення πτερύγιον τοῦ ἱεροῦ
  choice: верхівка храму
  alternative: крило храму; виступ храмового комплексу; найвища точка храмового комплексу
  rationale: Точне місце й архітектурна форма невідомі. Основний текст використовує природний традиційний відповідник, а примітка зберігає лексичну та просторову неоднозначність.
translation_notes:
  register: Сучасна нормативна українська мова з гідним оповідним звучанням. Історичний теперішній час збережено для жвавості розповіді; займенник «Його» написано з великої літери відповідно до усталеної української біблійної традиції, без додавання тлумачення.
