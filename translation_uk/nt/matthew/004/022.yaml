  text: οἱ δὲ εὐθέως ἀφέντες τὸ πλοῖον καὶ τὸν πατέρα αὐτῶν ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/022.yaml
  text: And they immediately left the boat and their father and followed him[a].
translation:
  language: uk
  text: І вони відразу ж[a] залишили човен і свого батька та пішли за Ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «негайно».'
    reason: Лексичний варіант для εὐθέως; «негайно» точніше формальне, тоді як «відразу ж» природніше в сучасній оповіді.
lexical_decisions:
- source_word: δὲ
  choice: І
  rationale: Слабкий сполучник продовжує розповідь; «і» природно передає простий наративний зв’язок, не посилюючи протиставлення.
- source_word: εὐθέως
  choice: відразу ж
  rationale: Передає нагальність і швидкість реакції; частка «ж» природно підсилює прислівник в українській мові.
- source_word: ἀφέντες
  choice: залишили
  rationale: 'Дієприслівникова форма позначає дію, що передує головній: спочатку вони залишили човен і батька, а тоді пішли за Ісусом. Особова форма робить український виклад природним.'
- source_word: τὸ πλοῖον
  choice: човен
  rationale: У контексті рибальства «човен» точніше й природніше за ширше «корабель».
- source_word: τὸν πατέρα αὐτῶν
  choice: свого батька
  rationale: Український зворотний присвійний займенник природно вказує на батька підмета й зберігає наголос на родинній ціні цього рішення.
- source_word: ἠκολούθησαν αὐτῷ
  choice: пішли за Ним
  rationale: У цьому контексті вислів передає і буквальний рух слідом за Ісусом, і учнівство; українське «піти за кимось» природно зберігає обидва відтінки.
- source_word: οἱ
  choice: вони
  rationale: Субстантивований артикль відсилає до двох братів із попереднього контексту; українською потрібен явний займенник.
theological_decisions:
- issue: Відгук учнів і відокремлення від батька
  choice: Передано як негайне й рішуче залишення човна та батька заради слідування за Ісусом, без твердження про остаточне покинення.
  alternative: «Покинули свого батька» могло б сильніше натякати на постійне зречення; суто тимчасовий відхід також не виражений прямо.
  rationale: Грецьке ἀφέντες підкреслює, що вони залишили їх позаду, але саме по собі не визначає тривалості цього відокремлення. «Залишили» зберігає силу оповіді без зайвого богословського уточнення.
translation_notes:
  register: Сучасна стандартна українська, природний і гідний біблійний виклад. Збережено просту послідовність дій та нагальність відповіді; уникнуто архаїчного або надмірно сильного «покинули». Займенник «Ним» написано з великої літери за поширеною українською біблійною традицією.
