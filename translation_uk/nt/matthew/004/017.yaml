  text: Ἀπὸ τότε ἤρξατο ὁ Ἰησοῦς κηρύσσειν καὶ λέγειν· Μετανοεῖτε, ἤγγικεν γὰρ ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/017.yaml
  text: From that time Jesus began to proclaim[a], saying, “Repent[c][b], for the kingdom of heaven has drawn near.”
translation:
  language: uk
  text: 'Відтоді Ісус почав проголошувати[a]: «Покайтеся[b], бо наблизилося Царство Небесне[c][d]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «проголошувати й говорити».'
    reason: previous_rendering
  - marker: b
    text: 'Або: «Змініть своє мислення і життя» чи «Наверніться». Йдеться не лише про жаль, а про зміну внутрішньої настанови та життєвого напряму.'
    reason: lexical_alternative
  - marker: c
    text: 'Грецькою буквально: «Царство небес». Це характерний для Матвія вислів, якому в інших місцях часто відповідає «Царство Боже».'
    reason: lexical_alternative
  - marker: d
    text: 'Або: «стало близьким» чи «вже близько». Грецький перфект підкреслює, що Царство наблизилося і ця близькість залишається актуальною.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: Відтоді
  rationale: Природно й стисло позначає новий етап у розповіді та зберігає часовий перехід оригіналу.
- source_word: ἤρξατο
  choice: почав
  rationale: Точно передає початок тривалої діяльності Ісуса в цьому оповідному повороті.
- source_word: κηρύσσειν
  choice: проголошувати
  rationale: Передає публічне й авторитетне звіщення; менш вузько церковне за «проповідувати» і природніше за архаїчні відповідники.
- source_word: καὶ λέγειν
  choice: кажучи
  rationale: Природно вводить зміст проголошення українською мовою. Координацію двох грецьких інфінітивів зафіксовано в примітці.
- source_word: Μετανοεῖτε
  choice: Покайтеся
  rationale: Усталений і змістовно місткий відповідник наказу змінити мислення та життєвий напрям, а не лише відчути жаль.
- source_word: ἤγγικεν
  choice: наблизилося
  rationale: 'Дококонаний вид добре передає грецький перфект: близькість настала й залишається актуальною.'
- source_word: βασιλεία
  choice: Царство
  rationale: Зберігає традиційний і зрозумілий образ царської влади, не звужуючи значення лише до території або лише до абстрактного правління.
- source_word: τῶν οὐρανῶν
  choice: Небесне
  rationale: Природний український відповідник характерного для Матвія вислову; граматичний множинний оригіналу зазначено в примітці.
theological_decisions:
- issue: Значення Μετανοεῖτε
  choice: Покайтеся
  alternative: Змініть мислення і наверніться
  rationale: «Покайтеся» зберігає моральну й духовну вагу заклику, не зводячи його ані до самого жалю, ані до суто інтелектуальної зміни поглядів.
- issue: Передача βασιλεία τῶν οὐρανῶν
  choice: Царство Небесне
  alternative: царювання небес / Царство небес
  rationale: Формулювання зберігає характерний для Матвія вислів і допускає значення як царського правління, так і царства, не нав’язуючи одного вузького богословського тлумачення.
- issue: Аспект ἤγγικεν
  choice: наблизилося
  alternative: близько / стало близьким
  rationale: 'Дококонана форма відображає перфект оригіналу: наближення вже відбулося, а його результат залишається чинним.'
translation_notes:
  register: Сучасна літературна українська мова з гідним біблійним звучанням. «Відтоді» та конструкція «проголошувати, кажучи» забезпечують природний оповідний рух; ключові богословські терміни залишено впізнаваними, а важливі мовні альтернативи винесено в примітки.
