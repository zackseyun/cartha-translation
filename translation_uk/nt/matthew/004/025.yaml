id: MAT.4.25
reference: Matthew 4:25
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: καὶ ἠκολούθησαν αὐτῷ ὄχλοι πολλοὶ ἀπὸ τῆς Γαλιλαίας καὶ Δεκαπόλεως καὶ Ἱεροσολύμων καὶ Ἰουδαίας καὶ πέραν τοῦ Ἰορδάνου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/025.yaml
  text: And large crowds followed him from Galilee and the Decapolis and Jerusalem and Judea and beyond the Jordan[a].
translation:
  language: uk
  text: І за ним ішли великі натовпи з Галилеї, і Десятимістя, і Єрусалима, і Юдеї, і з-за Йордану[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «із Зайордання».
    reason: 'Лексичний варіант: вислів πέραν τοῦ Ἰορδάνου може позначати територію по той бік Йордану як географічну область.'
lexical_decisions:
- source_word: ἠκολούθησαν
  choice: ішли за ним
  rationale: Природний український відповідник у розповідному контексті; передає буквальне слідування за Ісусом, не перебільшуючи міри учнівської відданості.
- source_word: ὄχλοι πολλοὶ
  choice: великі натовпи
  rationale: Усталений і природний вислів, що передає численність людей.
- source_word: ἀπὸ
  choice: з
  rationale: Позначає походження натовпів із перелічених місцевостей.
- source_word: Γαλιλαίας
  choice: Галилеї
  rationale: Усталена українська назва області у формі родового відмінка після «з».
- source_word: Δεκαπόλεως
  choice: Десятимістя
  rationale: Традиційна й прозора українська назва області десяти міст; форма родового відмінка збігається з називним.
- source_word: Ἱεροσολύμων
  choice: Єрусалима
  rationale: Усталена українська назва міста; грецька граматична множина не переноситься в українську.
- source_word: Ἰουδαίας
  choice: Юдеї
  rationale: Усталена українська назва області.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: з-за Йордану
  rationale: Стисло й природно передає походження людей із території по той бік Йордану; прийменник походження виражено відповідно до ἀπό, що керує всім переліком.
- source_word: καὶ ... καὶ ... καὶ
  choice: і ... і ... і
  rationale: Повтор сполучника збережено, щоб відтворити накопичувальний географічний перелік оригіналу.
theological_decisions: []
