lexical_decisions:
- source_word: Τότε
  choice: Тоді
  rationale: Природний часовий сполучник, що позначає наступну подію в оповіді.
- source_word: ἀνήχθη
  choice: був поведений
  rationale: Зберігає пасивний стан і значення спрямованого ведення; буквальний відтінок руху вгору українською тут звучав би неприродно й не є суттєвим для змісту.
- source_word: εἰς τὴν ἔρημον
  choice: у пустелю
  rationale: «Пустеля» природно передає ἔρημος як безлюдну, пустельну місцевість і відповідає усталеному українському біблійному слововживанню.
- source_word: ὑπὸ τοῦ πνεύματος
  choice: Духом
  rationale: Велика літера вказує на Божого Духа відповідно до безпосереднього контексту хрещення Ісуса, не додаючи відсутнього в грецькому тексті означення «Святий».
- source_word: πειρασθῆναι
  choice: щоб ... спокушав
  rationale: Контекст і названий діяч — диявол — підтримують значення «спокушати», тоді як можливе значення «випробовувати» збережено у примітці.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: диявол
  rationale: У цьому контексті διάβολος є усталеним позначенням особистого супротивника; активна українська конструкція природно ставить його підметом залежної частини.
theological_decisions:
- issue: Кого позначає τοῦ πνεύματος
  choice: Божого, тобто Святого, Духа
  alternative: духа взагалі або людський дух Ісуса
  rationale: Безпосередньо перед цим у розповіді Дух сходить на Ісуса під час хрещення, тому велика літера контекстуально виправдана, а додавання слова «Святий» не потрібне.
- issue: Значення πειρασθῆναι
  choice: бути спокушуваним
  alternative: бути випробуваним
  rationale: Диявол у наступній сцені схиляє Ісуса до хибних учинків, тож «спокушати» найкраще передає безпосередній сенс; ширшу семантичну можливість зазначено в примітці.
translation_notes:
  register: Сучасна нормативна, гідна українська мова. Пасив «був поведений» зберігає форму оригіналу, а активна підрядна конструкція «щоб диявол спокушав Його» природно передає грецькі інфінітив і позначення діяча без зміни смислових ролей.
