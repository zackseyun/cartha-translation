  source_fidelity: Переклад точно передає недоконаний мандрівний характер περιῆγεν («ходив по всій Галілеї»), супровідні дії, займенник αὐτῶν («їхніх»), подвійну всеохопність πᾶσαν ... πᾶσαν та сферу «серед народу». «Добру звістку про Царство» є природним і семантично можливим передаванням εὐαγγέλιον τῆς βασιλείας; примітка належно подає традиційний та формальніший варіанти без нав’язування тлумачення.
  naturalness: Текст звучить природно сучасною стандартною українською, з доречним біблійним, але не архаїчним регістром. Сполучення «ходив по всій Галілеї», «звіщаючи добру звістку» і «зцілюючи серед народу» синтаксично плавні. «Неміч» дещо книжне, однак цілком зрозуміле й стилістично доречне в цьому реєстрі.
  terminology: «Синагоги», «добра звістка», «Царство», «хвороба» та «неміч» послідовно й точно вжиті. Велика літера у «Він» та «Царство» є допустимою українською біблійною редакційною конвенцією і не змінює змісту. Примітка має коректний маркер і відповідає місцю прив’язки.
