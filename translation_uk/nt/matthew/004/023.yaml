id: MAT.4.23
reference: Matthew 4:23
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ⸂ἐν ὅλῃ τῇ Γαλιλαίᾳ⸃, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν μαλακίαν ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/023.yaml
  text: And he went throughout all Galilee[a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness among the people.
translation:
  language: uk
  text: І Він ходив по всій Галілеї, навчаючи в їхніх синагогах, звіщаючи добру звістку[a] про Царство та зцілюючи серед народу всяку хворобу й усяку неміч.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Євангеліє про Царство»; формальніше: «добру звістку Царства».'
    reason: Лексична альтернатива для εὐαγγέλιον і можливий формальніший спосіб передати родовий відмінок τῆς βασιλείας.
lexical_decisions:
- source_word: περιῆγεν
  choice: ходив
  rationale: Недоконаний вид передає тривалу мандрівну діяльність Ісуса; разом із «по всій Галілеї» дієслово природно виражає пересування регіоном.
- source_word: ἐν ὅλῃ τῇ Γαλιλαίᾳ
  choice: по всій Галілеї
  rationale: При дієслові руху цей вислів має розподільне значення — діяльність відбувалася по всьому регіону. Такий переклад природний сучасною українською.
- source_word: διδάσκων
  choice: навчаючи
  rationale: Дієприслівник передає дію, одночасну з основним дієсловом, і зберігає звичайне значення грецького слова.
- source_word: συναγωγαῖς αὐτῶν
  choice: в їхніх синагогах
  rationale: «Синагоги» точно називає юдейські місця зібрання, а «їхніх» зберігає займенник αὐτῶν.
- source_word: κηρύσσων
  choice: звіщаючи
  rationale: Вибір передає публічне й авторитетне проголошення, не звужуючи слово до пізнішого церковного жанру проповіді.
- source_word: τὸ εὐαγγέλιον
  choice: добру звістку
  rationale: Це прозоро передає безпосереднє лексичне значення εὐαγγέλιον зрозумілою сучасною мовою; традиційний відповідник наведено в примітці.
- source_word: τῆς βασιλείας
  choice: про Царство
  rationale: Родовий відмінок може вказувати на зміст звістки. Українське «про Царство» природно передає цей зв’язок, не уточнюючи понад текст, чиє саме Царство мається на увазі.
- source_word: θεραπεύων
  choice: зцілюючи
  rationale: У цьому контексті дієслово означає дійсне зцілення; український відповідник природний і достатньо широкий.
- source_word: πᾶσαν νόσον
  choice: всяку хворобу
  rationale: «Хвороба» є звичайним відповідником νόσος, а «всяку» зберігає наголос на всеохопності.
- source_word: πᾶσαν μαλακίαν
  choice: усяку неміч
  rationale: «Неміч» передає відтінок слабкості або фізичної недуги та дає змогу не зливати μαλακία з попереднім νόσος.
- source_word: ἐν τῷ λαῷ
  choice: серед народу
  rationale: Вислів природно позначає середовище, у якому відбувалися зцілення, без додаткового технічного богословського уточнення значення λαός.
theological_decisions:
- issue: Передача εὐαγγέλιον
  choice: добру звістку
  alternative: Євангеліє
  rationale: Основний текст безпосередньо й зрозуміло передає значення грецького слова, а традиційний церковний термін збережено як допустиму лексичну альтернативу в примітці.
- issue: Зв’язок εὐαγγέλιον із τῆς βασιλείας
  choice: добру звістку про Царство
  alternative: добру звістку Царства
  rationale: «Про Царство» природно читає родовий відмінок як указівку на зміст звістки. Альтернатива формальніше зберігає грецьку конструкцію, але українською може бути менш прозорою; слово «Боже» не додано, бо його немає в цьому вірші.
- issue: Обсяг зцілень у πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: всяку хворобу й усяку неміч
  alternative: кожну хворобу й кожну недугу
  rationale: Повторення «всяку / усяку» зберігає подвійну всеохопну конструкцію оригіналу, а два різні іменники не зводяться до одного поняття.
translation_notes:
  register: Сучасна стандартна українська з гідним, але доступним біблійним звучанням. Недоконане «ходив» відтворює тривалість мандрівної діяльності. Займенник «Він» і назву «Царство» подано з великої літери як шанобливе й усталене в біблійному регістрі оформлення, не додаючи відсутнього в грецькому тексті означення.
