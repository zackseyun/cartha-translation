lexical_decisions:
- source_word: Ἀκούσας
  choice: Коли … почув
  rationale: Аористовий дієприкметник має часовий зв’язок із головним дієсловом. Підрядна конструкція природна сучасною українською й передає значення «почувши / коли почув».
- source_word: δὲ
  choice: ж
  rationale: Частка позначає м’який перехід у розповіді, а не сильне протиставлення; українське «ж» природно передає цей зв’язок.
- source_word: Ἰωάννης
  choice: Івана
  rationale: Усталена українська форма імені; знахідний відмінок зумовлений синтаксисом підрядної частини.
- source_word: παρεδόθη
  choice: було передано
  rationale: Пасивна форма зберігає ширше значення παραδίδωμι — «передати, віддати» — і не звужує його в основному тексті до самого арешту.
- source_word: ἀνεχώρησεν
  choice: відійшов
  rationale: Передає відхід у відповідь на обставини, не посилюючи значення до боязкої чи військової втечі.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: до Галілеї
  rationale: Природна українська конструкція на позначення спрямованого руху; вона передає напрямкове значення εἰς.
theological_decisions:
- issue: Значення παραδίδωμι щодо Івана
  choice: було передано
  alternative: було заарештовано
  rationale: Грецьке дієслово ширше за технічне позначення арешту й у Матвія може мати смисловий відтінок передання в чужі руки. Основний текст зберігає цю широту, а контекстуально конкретніше тлумачення подано в примітці.
translation_notes:
  register: Сучасна літературна українська, природна й гідна за тоном. Ім’я «Ісус» виражено явно, оскільки суб’єкт дієприкметника зрозумілий із грецького контексту, але в окремому українському вірші явне називання усуває неясність. Займенник «він» написано з малої літери за нормами сучасної української.
