  text: When he heard that John had been handed over[a], he withdrew into Galilee.
translation:
  language: uk
  text: Коли ж Ісус почув, що Івана передали[a], він відійшов до Галілеї.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
