  text: τότε λέγει αὐτῷ ὁ Ἰησοῦς· ⸀Ὕπαγε, Σατανᾶ· γέγραπται γάρ· Κύριον τὸν θεόν σου προσκυνήσεις καὶ αὐτῷ μόνῳ λατρεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/010.yaml
  text: 'Then Jesus says to him, “Go away, Satan! For it is written: ‘You shall worship the Lord your God, and serve him only.’”'
translation:
  language: uk
  text: 'Тоді Ісус каже йому: «Відійди, Сатано! Адже написано: “Господу, Богові твоєму, поклонятимешся[a] і лише Йому служитимеш[b]”.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «поклонишся Господу, Богові твоєму». Грецьке дієслово може більш буквально означати схилитися або простягтися долілиць на знак пошани.'
    reason: lexical_alternative
  - marker: b
    text: Дієслово, перекладене як «служитимеш», може конкретніше означати священне або релігійне служіння Богові.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Тоді
  rationale: Природно й стисло передає часову послідовність оповіді.
- source_word: λέγει
  choice: каже
  rationale: Зберігає грецький історичний теперішній час і його оповідну жвавість.
- source_word: Ὕπαγε
  choice: Відійди
  rationale: Сучасний і виразний наказ піти геть без архаїчного забарвлення.
- source_word: Σατανᾶ
  choice: сатано
  rationale: Усталена українська форма власного імені у кличному відмінку.
- source_word: γέγραπται
  choice: написано
  rationale: Усталена формула введення цитати зі Святого Письма, що належно передає грецький перфект пасиву.
- source_word: Κύριον τὸν θεόν σου
  choice: Господу, Богові твоєму
  rationale: Давальний відмінок зумовлений українським дієсловом «поклонятися»; прикладка зберігає структуру вислову.
- source_word: προσκυνήσεις
  choice: поклонятимешся
  rationale: Передає релігійне поклоніння, водночас зберігаючи образ схиляння перед Богом.
- source_word: αὐτῷ μόνῳ
  choice: лише Йому
  rationale: Передає наголос на винятковості адресата служіння; порядок слів природний українською.
- source_word: λατρεύσεις
  choice: служитимеш
  rationale: Зберігає відмінність від «поклонятимешся» та допускає властивий слову відтінок священного служіння.
theological_decisions:
- issue: Розрізнення προσκυνέω та λατρεύω
  choice: «поклонятимешся» та «служитимеш»
  alternative: Передати обидва дієслова мовою поклоніння або перекласти перше як «впадеш ниць»
  rationale: 'Грецький текст уживає два споріднені, але відмінні дієслова. Їх розрізнення не звужує і не розширює твердження: лише Богові належать і поклоніння, і віддане священне служіння.'
- issue: Обсяг μόνῳ
  choice: «лише Йому служитимеш»
  alternative: «Йому лише служитимеш»
  rationale: Обидва варіанти можливі, але обраний природно наголошує, що служіння має бути спрямоване винятково до Бога.
translation_notes:
  register: Сучасна нормативна українська мова з гідним біблійним звучанням. Історичний теперішній час збережено. У прямій мові використано природний кличний відмінок «сатано»; займенник щодо Бога написано з великої літери відповідно до поширеної української видавничої практики.
