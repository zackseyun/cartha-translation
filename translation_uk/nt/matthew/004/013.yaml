id: MAT.4.13
reference: Matthew 4:13
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: καὶ καταλιπὼν τὴν Ναζαρὰ ἐλθὼν κατῴκησεν εἰς Καφαρναοὺμ τὴν παραθαλασσίαν ἐν ὁρίοις Ζαβουλὼν καὶ Νεφθαλίμ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/013.yaml
  text: And leaving Nazara[a], he came and settled in Capernaum by the sea, in the region of Zebulun and Naphtali.
translation:
  language: uk
  text: І, залишивши Назару[a], Він прийшов і оселився в Капернаумі, що біля моря, у краях Завулона й Нефталима.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Грецькою: «Назара»; у багатьох перекладах: «Назарет».'
    reason: alternative_reading
lexical_decisions:
- source_word: καταλιπὼν
  choice: залишивши
  rationale: 'Аористовий дієприкметник передає дію, що передує головній: Ісус залишив Назару, а потім прийшов і оселився в іншому місці.'
- source_word: Ναζαρὰ
  choice: Назару
  rationale: Передає саме грецьку форму Ναζαρά; знахідний відмінок природно відтворено українською формою «Назару». Звичнішу назву «Назарет» подано у примітці.
- source_word: ἐλθὼν
  choice: Він прийшов
  rationale: Другий аористовий дієприкметник природно передано особовою формою в послідовності «прийшов і оселився».
- source_word: κατῴκησεν
  choice: оселився
  rationale: У контексті дієслово означає, що Він обрав це місце для проживання, а не лише тимчасово перебував там.
- source_word: Καφαρναοὺμ
  choice: Капернаумі
  rationale: Ужито усталену українську біблійну форму назви з потрібним місцевим відмінком.
- source_word: τὴν παραθαλασσίαν
  choice: що біля моря
  rationale: Означення стосується Капернаума й указує, що місто розташоване біля моря; підрядна конструкція звучить природно українською.
- source_word: ἐν ὁρίοις
  choice: у краях
  rationale: Множина ὅρια тут позначає територію або місцевість, пов’язану із Завулоном і Нефталимом; «у краях» зберігає географічну широту вислову.
- source_word: Ζαβουλὼν
  choice: Завулона
  rationale: Ужито усталену українську біблійну форму племінної та географічної назви.
- source_word: Νεφθαλίμ
  choice: Нефталима
  rationale: Ужито усталену українську біблійну форму племінної та географічної назви.
theological_decisions: []
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Послідовність грецьких дієслів збережено природною конструкцією; географічні назви подано в усталених українських формах, крім навмисного відтворення форми «Назара» з пояснювальною приміткою.
