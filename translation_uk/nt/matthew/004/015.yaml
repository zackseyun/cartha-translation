source:
  edition: SBLGNT
  text: Γῆ Ζαβουλὼν καὶ γῆ Νεφθαλίμ, ὁδὸν θαλάσσης, πέραν τοῦ Ἰορδάνου, Γαλιλαία τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/015.yaml
  text: Land of Zebulun and land of Naphtali[a], the way of the sea, beyond the Jordan, Galilee of the Gentiles—
translation:
  language: uk
  text: Земля Завулона й земля Нефталима, дорога до моря, по той бік Йордану, Галілея язичників[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Галілея народів».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γῆ Ζαβουλὼν καὶ γῆ Νεφθαλίμ
  choice: Земле Завулона й земле Нефталима
  rationale: Грецькі називні форми в цитаті природно передано українським кличним відмінком, як звертання; повтор слова «земле» зберігає паралелізм. Усталені українські біблійні форми імен — «Завулон» і «Нефталим».
- source_word: ὁδὸν θαλάσσης
  choice: дорого до моря
  rationale: Збережено образний і дещо неоднозначний вислів пророчої цитати без звуження до конкретної прибережної дороги; кличний відмінок узгоджено з побудовою переліку.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: за Йорданом
  rationale: Природний український географічний вислів, який не уточнює точку спостереження понад те, що містить грецький текст.
- source_word: Γαλιλαία
  choice: Галилеє
  rationale: Кличний відмінок підтримує синтаксис звертання в цитаті; «Галилея» — усталена українська назва регіону.
- source_word: τῶν ἐθνῶν
  choice: язичників
  rationale: У юдейському контексті вислів позначає неюдейські народи; «язичників» природно передає етнорелігійний контраст, тоді як буквальніше «народів» лишається можливою альтернативою.
theological_decisions:
- issue: Значення ἐθνῶν в Ісаєвій цитаті
  choice: язичників
  alternative: народів
  rationale: У контексті Матвія вислів підкреслює зв’язок Галилеї з неюдейським населенням. Варіант «народів» лексично можливий і збережений у примітці, щоб не приховувати неоднозначності.
translation_notes:
  register: Сучасна, гідна українська мова з поетичною формою звертання, доречною для пророчої цитати. Тире наприкінці зберігає незавершеність речення, яке продовжується в наступному вірші.
