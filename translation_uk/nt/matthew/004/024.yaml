  text: καὶ ἀπῆλθεν ἡ ἀκοὴ αὐτοῦ εἰς ὅλην τὴν Συρίαν· καὶ προσήνεγκαν αὐτῷ πάντας τοὺς κακῶς ἔχοντας ποικίλαις νόσοις καὶ βασάνοις ⸀συνεχομένους, δαιμονιζομένους καὶ σεληνιαζομένους καὶ παραλυτικούς, καὶ ἐθεράπευσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/024.yaml
  text: And the report about him went out into all Syria[a], and they brought to him all who were sick, afflicted with various diseases and torments, those oppressed by demons, those having seizures, and paralytics[c][b], and he healed them.
translation:
  language: uk
  text: 'І звістка про нього розійшлася по всій Сирії, і до нього привели всіх недужих, уражених різними хворобами й стражданнями: одержимих демонами[a], тих, у кого були напади[b], і паралізованих; і він зцілив їх.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «тих, хто перебував під впливом демонів» або «тих, кого мучили демони».'
    reason: lexical_alternative
  - marker: b
    text: Грецьке слово σεληνιαζομένους буквально пов’язане з уявленням про вплив місяця; традиційно його перекладають як «епілептиків».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκοὴ
  choice: звістка
  rationale: У цьому контексті слово означає звістку, яку люди чули про Ісуса, а не здатність чути. «Звістка» природно передає поширювані відомості, не вдаючись до архаїчного «слава».
- source_word: ἀπῆλθεν
  choice: розійшлася
  rationale: Передає образ руху й водночас природно описує поширення звістки українською.
- source_word: Συρίαν
  choice: Сирії
  rationale: Усталена українська назва регіону; конструкція «по всій Сирії» природно передає εἰς ὅλην τὴν Συρίαν.
- source_word: προσήνεγκαν
  choice: привели
  rationale: У контексті йдеться про те, що хворих допровадили до Ісуса; «привели» є точним і природним відповідником.
- source_word: κακῶς ἔχοντας
  choice: недужих
  rationale: Грецький ідіом означає людей, які були хворими або перебували в тяжкому фізичному стані. «Недужих» стисло й гідно передає цей зміст.
- source_word: ποικίλαις νόσοις
  choice: різними хворобами
  rationale: Зберігає і різноманітність, виражену ποικίλαις, і пряме значення νόσοις.
- source_word: βασάνοις συνεχομένους
  choice: охоплених … тяжкими стражданнями
  rationale: συνεχομένους описує людей як охоплених або скутих недугами й муками, а βάσανοι вказує на сильні муки чи страждання. Додавання «тяжкими» природно передає інтенсивність.
- source_word: δαιμονιζομένους
  choice: тих, кого мучили демони
  rationale: Передає реальну демонічну дію, але не звужує широке грецьке слово до одного сучасного технічного поняття «одержимість».
- source_word: σεληνιαζομένους
  choice: тих, у кого були напади
  rationale: Доступно передає спостережуваний стан, не стверджуючи, що його спричиняв місяць, як може підказувати етимологія грецького слова. Буквальніша й традиційна інформація подана у примітці.
- source_word: παραλυτικούς
  choice: паралізованих
  rationale: Точний і загальнозрозумілий сучасний відповідник для людей із паралічем.
- source_word: ἐθεράπευσεν
  choice: зцілив
  rationale: У контексті чудес Ісуса «зцілив» є природним і точним відповідником θεραπεύω.
theological_decisions:
- issue: Як передати δαιμονιζομένους, не заперечуючи демонічної дії й не нав’язуючи вужчої категорії, ніж дозволяє грецький текст
  choice: тих, кого мучили демони
  alternative: одержимих демонами; тих, хто перебував під владою демонів
  rationale: Формулювання прямо зберігає надприродного діяча, але не визначає точного ступеня чи механізму демонічного впливу. Традиційніший варіант подано в примітці.
- issue: Як передати σεληνιαζομένους без схвалення давнього уявлення про вплив місяця
  choice: тих, у кого були напади
  alternative: епілептиків; уражених місяцем
  rationale: Основний текст описує зрозумілий сучасному читачеві прояв стану, а примітка зберігає етимологічну й традиційну неоднозначність слова.
translation_notes:
  register: Сучасна нормативна українська мова з гідним, загальнозрозумілим біблійним звучанням. Синтаксис зберігає розгорнутий перелік грецького тексту, але поділ на два речення полегшує читання. Займенники щодо Ісуса подано з малої літери відповідно до загальної сучасної орфографічної практики, без доктринального навантаження.
