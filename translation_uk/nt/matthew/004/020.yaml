  text: οἱ δὲ εὐθέως ἀφέντες τὰ δίκτυα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/020.yaml
  text: And they immediately left the nets and followed him.
translation:
  language: uk
  text: Вони ж одразу залишили сіті й пішли за Ним.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: ж
  rationale: Частка «ж» природно передає слабкий сполучний δέ, просуваючи розповідь без надмірного наголосу на протиставленні.
- source_word: εὐθέως
  choice: одразу
  rationale: «Одразу» ясно й природно передає негайність їхньої відповіді.
- source_word: ἀφέντες
  choice: залишили
  rationale: 'Аористовий дієприкметник позначає дію, що передує головній: спершу вони залишили сіті, а тоді пішли за Ісусом. Сурядна конструкція природна для сучасної української оповіді; «покинули» могло б звучати надто сильно.'
- source_word: τὰ δίκτυα
  choice: сіті
  rationale: У контексті йдеться про рибальські сіті. Означеність збережено без додавання відсутнього в грецькому тексті присвійного займенника.
- source_word: ἠκολούθησαν αὐτῷ
  choice: пішли за Ним
  rationale: Український вислів природно охоплює і буквальний рух слідом за Ісусом, і початок учнівства, не роблячи жодного з цих відтінків винятковим.
theological_decisions:
- issue: Відтінок учнівства в ἠκολούθησαν αὐτῷ
  choice: пішли за Ним
  alternative: послідували за Ним
  rationale: Обраний вислів зберігає водночас буквальний і учнівський сенси дієслова, тоді як «послідували» менш природне в сучасній стандартній українській мові.
translation_notes:
  register: Сучасна, природна й гідна оповідна українська мова. Велика літера в займеннику «Ним» ужита як усталений шанобливий біблійний правописний вибір, не змінюючи змісту оригіналу.
