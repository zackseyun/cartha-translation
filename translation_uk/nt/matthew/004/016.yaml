    reason: lexical_alternative
lexical_decisions:
- source_word: λαὸς
  choice: народ
  rationale: Природний український відповідник для збірної назви людей; у цьому контексті не обов’язково означає політичну націю.
- source_word: καθήμενος / καθημένοις
  choice: сидів / сидів
  rationale: Збережено буквальний образ і паралелізм пророцтва; «жив» або «перебував» були б пояснювальними.
- source_word: σκοτίᾳ
  choice: темряві
  rationale: Передає як буквальне, так і переносне значення, не звужуючи образ до виключно морального чи духовного сенсу.
- source_word: φῶς εἶδεν μέγα
  choice: побачив велике світло
  rationale: Природний порядок слів українською зі збереженням простого минулого часу та виразності образу.
- source_word: χώρᾳ
  choice: країні
  rationale: Передає просторове значення «земля, край, місцевість» і природно поєднується з подальшим образним висловом.
- source_word: σκιᾷ θανάτου
  choice: тіні смерті
  rationale: Зберігає явну згадку про смерть у грецькому тексті та знайомий біблійний образ, не замінюючи його тлумаченням.
- source_word: ἀνέτειλεν
  choice: зійшло
  rationale: Передає образ сходження небесного світла, закладений у дієслові, і природно узгоджується з підметом «світло».
- source_word: αὐτοῖς
  choice: тим, хто
  rationale: Давальний відмінок передано українською конструкцією «тим ... зійшло», причому адресатів прямо названо в паралельній частині речення.
theological_decisions:
- issue: Значення образів темряви та світла
  choice: Збережено пророчі образи без уточнення, чи йдеться про духовний, моральний, політичний або життєвий стан.
  alternative: Прямо витлумачити темряву як гріх або незнання, а світло — як спасенне об’явлення Месії.
  rationale: У цьому реченні грецький текст не звужує багатозначності образів, тому переклад не додає конкретного доктринального пояснення.
- issue: Вислів σκιᾷ θανάτου
  choice: Збережено буквальний компонент «смерті».
  alternative: Передати весь вислів як «глибока темрява».
  rationale: На відміну від можливого семітського ідіоматичного прочитання, грецька форма прямо містить θανάτου, тож основний текст має зберігати цю напругу й образність.
translation_notes:
  register: Сучасна літературна українська з урочистим, але зрозумілим біблійним звучанням. Повтор «сидів» і образ «зійшло світло» навмисно збережено заради поетичного паралелізму та зв’язку з Ісаєю.
