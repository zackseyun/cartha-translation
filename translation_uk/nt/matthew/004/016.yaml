  text: The people sitting in darkness saw a great light[a], and on those sitting in the region and shadow of death, a light dawned.
translation:
  language: uk
  text: Народ, що сидів у темряві, побачив велике світло, і тим, хто сидів у краї та в тіні смерті[a], зійшло світло.
