lexical_decisions:
- source_word: προσελθὼν
  choice: підійшов до Нього
  rationale: Дієприкметник аориста передає рух у напрямку до Ісуса; особова форма в сурядній конструкції звучить природно українською.
- source_word: ὁ πειράζων
  choice: спокусник
  rationale: Субстантивований дієприкметник теперішнього часу в цьому контексті позначає того, хто спокушає Ісуса; «спокусник» є точним і природним відповідником.
- source_word: Εἰ
  choice: Якщо
  rationale: Зберігає форму грецької умовної конструкції та її неоднозначну силу, не вирішуючи, чи йдеться про сумнів, припущення або виклик.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: Син Божий
  rationale: У конструкції з εἰμί це впізнаваний титул, що визначає унікальний зв’язок Ісуса з Богом; українська форма природно передає титульне значення.
- source_word: εἰπὲ ἵνα
  choice: скажи, щоб
  rationale: Природно передає наказовий спосіб εἰπὲ та підрядну конструкцію з ἵνα, не посилюючи значення до лексично невираженого «накажи».
- source_word: οἱ λίθοι οὗτοι
  choice: це каміння
  rationale: Збірний іменник «каміння» є природним українським відповідником множини λίθοι, а «це» зберігає вказівне значення.
- source_word: ἄρτοι γένωνται
  choice: стало хлібами
  rationale: «Стало» прямо передає γίνομαι, а множина «хлібами» зберігає граматичне число ἄρτοι та образ окремих хлібин.
theological_decisions:
- issue: Сила умовної конструкції Εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: «Якщо Ти Син Божий»
  alternative: «Оскільки Ти Син Божий» або «Якщо Ти справді Син Божий»
  rationale: Просте «якщо» зберігає богословську й риторичну напругу оригіналу, не приписуючи спокусникові ані сумніву, ані явного визнання.
- issue: Христологічний титул υἱὸς τοῦ θεοῦ
  choice: «Син Божий»
  alternative: «син Бога» або «один із Божих синів»
  rationale: Контекст Євангелія від Матвія вказує на усталений титул, а не на належність до невизначеного класу; переклад не додає пояснень понад текст.
translation_notes:
  register: Сучасна літературна українська мова з урочистим, але доступним біблійним звучанням. Займенник «Нього» та звертання «Ти» написано з великої літери як шанобливе позначення Ісуса. Синтаксис наближений до грецького, однак перебудований у природну українську сурядну конструкцію.
