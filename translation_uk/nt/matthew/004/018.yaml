  yaml_path: translation/nt/matthew/004/018.yaml
  text: As he was walking beside the Sea of Galilee[a], he saw two brothers, Simon who is called Peter and Andrew his brother, casting a net into the sea, for they were fishermen.
translation:
  language: uk
  text: 'Коли Ісус ішов уздовж Галілейського моря, то побачив двох братів: Симона, якого називають Петром, та Андрія, його брата. Вони закидали в море закидну сітку[a], бо були рибалками.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Грецьке слово означає рибальську сітку, яку закидають у воду.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περιπατῶν δὲ
  choice: Коли Ісус ішов
  rationale: Теперішній дієприкметник передає тривалу дію, одночасну з εἶδεν. Підрядне речення природне українською; ім’я «Ісус» відновлює підмет із контексту й усуває неприродне займенникове начало окремого вірша.
- source_word: παρὰ τὴν θάλασσαν τῆς Γαλιλαίας
  choice: уздовж Галілейського моря
  rationale: παρά зі знахідним відмінком тут позначає рух уздовж берега; традиційна українська географічна назва зберігає грецьке θάλασσα як «море».
- source_word: εἶδεν
  choice: побачив
  rationale: Простий наративний аорист ὁράω; доконаний вид природно передає одноразове сприйняття.
- source_word: δύο ἀδελφούς
  choice: двох братів
  rationale: Йдеться про двох рідних братів-чоловіків, що підтверджується подальшим називанням Симона й Андрія.
- source_word: Σίμωνα τὸν λεγόμενον Πέτρον
  choice: Симона, якого називають Петром
  rationale: Пасивний дієприкметник λεγόμενον природно передано означальним підрядним реченням без зміни часового значення.
- source_word: Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ
  choice: Андрія, його брата
  rationale: Збережено прикладкове уточнення та явний родинний зв’язок із Симоном.
- source_word: βάλλοντας ἀμφίβληστρον εἰς τὴν θάλασσαν
  choice: Вони закидали в море невід[a]
  rationale: Теперішній дієприкметник описує дію братів у момент зустрічі. «Невід» передає спеціальний вид закидної рибальської сітки; примітка уточнює значення терміна.
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: бо були рибалками
  rationale: γάρ вводить пояснення; «бо» стисло й природно виражає цей зв’язок. Чоловіча форма відповідає названим особам.
