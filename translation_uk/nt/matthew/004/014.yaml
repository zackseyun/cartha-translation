  text: ἵνα πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/014.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled, saying:'
translation:
  language: uk
  text: 'щоб сповнилося сказане через пророка Ісаю, який говорить:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: щоб
  rationale: Природно вводить підрядну частину мети або наслідку та зберігає цільовий відтінок грецької конструкції.
- source_word: πληρωθῇ
  choice: сповнилося
  rationale: Усталений український відповідник у формулах про сповнення Писання; форма з «щоб» природно передає пасивний аорист кон’юнктива, не зводячи значення до простого «збулося».
- source_word: τὸ ῥηθὲν
  choice: сказане
  rationale: Субстантивований пасивний дієприкметник стисло й природно передано українським субстантивованим дієприкметником.
- source_word: διὰ
  choice: через
  rationale: 'Передає посередницьку роль пророка: слова були промовлені через Ісаю, а не лише ним як первинним джерелом.'
- source_word: Ἠσαΐου
  choice: Ісаю
  rationale: Нормативна українська форма імені в знахідному відмінку після прийменника «через».
- source_word: τοῦ προφήτου
  choice: пророка
  rationale: Збережено явне означення ролі Ісаї та природний український порядок слів.
- source_word: λέγοντος
  choice: 'який говорить:'
  rationale: Передає дієприкметник теперішнього часу й чітко вводить наступну пряму цитату; теперішній час зберігає форму джерела.
theological_decisions:
- issue: Формула сповнення в Матвія
  choice: «щоб сповнилося»
  alternative: «щоб збулося»
  rationale: «Сповнилося» зберігає характерну для Матвія формулу та її зв’язок із Писанням, не додаючи пояснення щодо способу чи масштабу сповнення.
- issue: Посередництво пророка
  choice: «сказане через пророка Ісаю»
  alternative: «сказане пророком Ісаєю»
  rationale: Прийменник «через» точніше зберігає διά з родовим відмінком і залишає відкритим богословський вимір джерела пророчого слова.
translation_notes:
  register: Сучасна нормативна українська мова, стислий і гідний біблійний стиль. Порядок «через пророка Ісаю» природний українською та зберігає акцент на пророчому посередництві. Двокрапка позначає перехід до цитати в наступному вірші.
