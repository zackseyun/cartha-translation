  text: Πάλιν παραλαμβάνει αὐτὸν ὁ διάβολος εἰς ὄρος ὑψηλὸν λίαν, καὶ δείκνυσιν αὐτῷ πάσας τὰς βασιλείας τοῦ κόσμου καὶ τὴν δόξαν αὐτῶν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/008.yaml
  text: Again[a], the devil takes him to a very high mountain and shows him all the kingdoms of the world and their glory.
translation:
  language: uk
  text: Знову диявол бере його із собою на дуже високу гору й показує йому всі царства світу та їхню славу[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «їхню пишноту».'
    reason: Лексична альтернатива для δόξα, яке тут може означати видиму велич і розкіш царств.
lexical_decisions:
- source_word: Πάλιν
  choice: Знову
  rationale: Стисло й природно позначає повторення в послідовності спокус.
- source_word: παραλαμβάνει
  choice: бере
  rationale: Зберігає історичний теперішній час грецької оповіді й не додає невисловлених подробиць про спосіб переміщення.
- source_word: ὁ διάβολος
  choice: диявол
  rationale: У цьому контексті це усталене позначення Сатани; переклад є зрозумілим і нейтральним щодо конфесійної традиції.
- source_word: εἰς ὄρος ὑψηλὸν λίαν
  choice: на дуже високу гору
  rationale: Природно передає спрямований рух і підсилювальне λίαν, не послаблюючи наголосу на висоті гори.
- source_word: δείκνυσιν
  choice: показує
  rationale: Прямий відповідник без невиправданого посилення значення.
- source_word: πάσας τὰς βασιλείας
  choice: всі царства
  rationale: Зберігає всеохопність πάσας і політико-царський зміст βασιλείας.
- source_word: τοῦ κόσμου
  choice: світу
  rationale: Природний український відповідник κόσμος у цьому контексті.
- source_word: τὴν δόξαν αὐτῶν
  choice: їхню славу
  rationale: Зберігає основний лексичний зв’язок δόξα зі «славою», тоді як контекстуальне значення видимої величі подано у примітці як «пишнота».
theological_decisions:
- issue: Характер показу всіх царств із гори
  choice: Передати подію прямо так, як її оповідає текст, не визначаючи механізму показу.
  alternative: Тлумачити її як буквальний географічний огляд або як видіння чи надприродне відкриття.
  rationale: Грецький текст не пояснює, яким чином були показані всі царства світу, тому переклад зберігає цю невизначеність.
translation_notes:
  register: Сучасна стандартна українська мова; виклад природний, стислий і гідний. Історичний теперішній час оригіналу збережено. Займенники щодо Ісуса подано з малої літери відповідно до загальної сучасної орфографічної норми.
