  text: Καὶ προβὰς ἐκεῖθεν εἶδεν ἄλλους δύο ἀδελφούς, Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, ἐν τῷ πλοίῳ μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν καταρτίζοντας τὰ δίκτυα αὐτῶν, καὶ ἐκάλεσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/021.yaml
  text: And going on from there, he saw two other brothers, James the son of Zebedee and John his brother, in the boat with Zebedee their father, mending their nets, and he called them.
translation:
  language: uk
  text: 'І, пройшовши звідти далі, він побачив ще двох братів: Якова, сина Зеведея, та Івана, його брата, — у човні разом із Зеведеєм, їхнім батьком; вони лагодили свої сітки. І він покликав їх.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προβὰς ἐκεῖθεν
  choice: відійшовши звідти далі
  rationale: Дієприкметник від προβαίνω передає подальший рух від попереднього місця, а ἐκεῖθεν — віддалення «звідти». Формулювання природне українською та зберігає обидва компоненти.
- source_word: εἶδεν
  choice: побачив
  rationale: Звичайне оповідне значення аориста ὁράω, без підсилення до «помітив».
- source_word: ἄλλους δύο ἀδελφούς
  choice: інших двох братів
  rationale: Зберігає число та вказівку на ще одну пару братів після попередньо згаданих.
- source_word: Ἰάκωβον τὸν τοῦ Ζεβεδαίου
  choice: Якова, сина Зеведея
  rationale: Грецька родова конструкція ідентифікує Якова за батьком; українською це природно передати словом «сина».
- source_word: Ἰωάννην τὸν ἀδελφὸν αὐτοῦ
  choice: Івана, його брата
  rationale: Займенник αὐτοῦ стосується Якова; конструкція прямо називає Івана його братом.
- source_word: ἐν τῷ πλοίῳ
  choice: у човні
  rationale: У контексті рибальства πλοῖον означає човен, а не великий корабель.
- source_word: μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν
  choice: зі своїм батьком Зеведеєм
  rationale: Передає супровід, виражений μετά з родовим відмінком, і природно вказує на спільного батька братів.
- source_word: καταρτίζοντας τὰ δίκτυα αὐτῶν
  choice: лагодили свої сіті
  rationale: У цьому рибальському контексті καταρτίζω означає приводити сіті до належного стану, тобто лагодити їх. «Сіті» — усталене й точне українське позначення рибальських сітей.
- source_word: ἐκάλεσεν αὐτούς
  choice: покликав їх
  rationale: Зберігає просте формулювання джерела та зв’язок із мотивом покликання, не додаючи прямо не висловленої мети.
theological_decisions:
- issue: Учнівський зміст дієслова ἐκάλεσεν
  choice: покликав їх
  alternative: покликав їх іти за ним
  rationale: Контекст указує на поклик до учнівства, але сам вірш не містить додатка «іти за ним». Просте формулювання зберігає текстову стриманість і не усуває контекстуального підтексту.
translation_notes:
  register: Сучасна стандартна українська мова, гідний і доступний оповідний стиль. Довге грецьке речення поділено на три українські для ясності; займенник «вони» експлікує підмет дієприкметника без зміни змісту. Ім’я Ἰωάννης передано традиційною українською біблійною формою «Іван».
