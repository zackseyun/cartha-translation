  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Γέγραπται· Οὐκ ἐπ’ ἄρτῳ μόνῳ ζήσεται ⸀ὁ ἄνθρωπος, ἀλλ’ ⸀ἐπὶ παντὶ ῥήματι ἐκπορευομένῳ διὰ στόματος θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/004.yaml
  text: 'But he answered[a], “It is written: ‘Man will not live by bread alone[b], but by every word proceeding through the mouth of God.’”'
translation:
  language: uk
  text: 'Та Він у відповідь сказав: «Написано: “Не самим хлібом житиме людина, а кожним словом, що виходить із Божих уст[a]”».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «через Божі уста». Грецький вислів змальовує слово, яке Бог промовляє.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: Та Він у відповідь сказав
  rationale: Передає протиставний δέ та природно відтворює поширений зворот ἀποκριθεὶς εἶπεν без штучного дублювання «відповів і сказав».
- source_word: Γέγραπται
  choice: Написано
  rationale: Усталена українська формула введення цитати зі Святого Письма; доконаний пасив зберігає думку про чинність написаного.
- source_word: Οὐκ ἐπ’ ἄρτῳ μόνῳ
  choice: Не самим хлібом
  rationale: Пряме й природне відтворення грецького вислову без розширення значення ἄρτος до «їжі» загалом.
- source_word: ζήσεται ὁ ἄνθρωπος
  choice: житиме людина
  rationale: Майбутній час передано природною українською формою; «людина» точно виражає узагальнювальне значення ὁ ἄνθρωπος і не звужує вислів до чоловічої статі.
- source_word: παντὶ ῥήματι
  choice: кожним словом
  rationale: «Слово» природно позначає тут кожне Боже висловлювання та зберігає традиційний біблійний образ.
- source_word: ἐκπορευομένῳ διὰ στόματος θεοῦ
  choice: що виходить із Божих уст
  rationale: Природний український вислів передає рух назовні в ἐκπορευομένῳ та образ Божого мовлення; буквальне значення διά пояснено в примітці.
theological_decisions:
- issue: Узагальнювальне значення ὁ ἄνθρωπος
  choice: людина
  alternative: чоловік; людство
  rationale: У контексті це загальна істина про кожну людину, а не згадка про конкретного чоловіка. «Людина» зберігає однину та узагальнювальну силу грецької форми без зайвого тлумачення.
- issue: Формула цитування Γέγραπται
  choice: Написано
  alternative: Стоїть написано
  rationale: Усталена формула ясно вводить авторитетну цитату, не додаючи конфесійного пояснення.
- issue: Значення διά в διὰ στόματος θεοῦ
  choice: із Божих уст
  alternative: через Божі уста
  rationale: Українське «виходить із уст» природно передає цілісний образ висловленого Богом слова; примітка зберігає формальну особливість грецького прийменника та не приховує можливості буквальнішого відтворення.
translation_notes:
  register: Сучасна стандартна українська мова з гідним біблійним звучанням. Синтаксис цитати лишається простим і придатним для публічного читання; великі літери у займеннику «Він» ужито як шанобливу видавничу норму щодо Ісуса.
