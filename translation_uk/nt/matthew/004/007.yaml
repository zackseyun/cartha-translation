base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/007.yaml
  text: 'Jesus said to him[b][a], “Again it is written: ‘You shall not put the Lord your God to the test.’”'
translation:
  language: uk
  text: 'Ісус сказав йому: «Знову написано: “Не будеш випробовувати Господа, Бога твого”».[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Не піддавай Господа, Бога твого, випробуванню». Грецьке дієслово ἐκπειράζω можна передати як «випробовувати» або «піддавати випробуванню».'
    reason: lexical_alternative
  - marker: b
    text: Цитата з Повторення Закону 6:16. Грецьке «Господь» відповідає тому, як у Септуагінті передано Боже ім’я.
    reason: cross_reference
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Ісус сказав йому
  rationale: Природний український порядок слів точно передає просту формулу введення прямої мови та давальний непрямого додатка.
- source_word: Πάλιν
  choice: Ще
  rationale: У цьому контексті слово вводить додаткове, протиставлене попередній цитаті свідчення Писання; «Ще» природно звучить у формулі «Ще написано» й не додає тлумачення.
- source_word: γέγραπται
  choice: написано
  rationale: Традиційна й природна формула цитування Писання, яка передає результативний відтінок грецького перфекта.
- source_word: Οὐκ ἐκπειράσεις
  choice: Не випробовуй
  rationale: Грецький майбутній індикатив має силу заборони. «Випробовуй» передає ἐκπειράζω як навмисне піддавання перевірці; можливе простіше «не спокушай» тут було б менш прозорим для сучасного читача.
- source_word: κύριον τὸν θεόν σου
  choice: Господа, Бога твого
  rationale: Зберігає грецьке κύριον і прикладкову конструкцію «Бога твого». Порядок «Бога твого» надає біблійно-гідного звучання, лишаючись зрозумілим сучасною українською.
theological_decisions:
- issue: Передача κύριος у цитаті, що стосується Бога Ізраїлю
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Безпосереднє грецьке джерело має κύριος, тому основний текст передає його як «Господь», не підмінюючи грецьку форму графічним відтворенням єврейського Божого імені. Походження формулювання із Септуагінти пояснено у примітці.
translation_notes:
  register: Сучасна стандартна українська з урочистим, але доступним біблійним регістром. Формулу «Ще написано» збережено стислою; у самій цитаті вжито дещо піднесений порядок «Бога твого».
