base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/031.yaml
  text: Therefore[a], when his fellow servants saw what had happened, they were deeply grieved[b], and they came and reported to their lord everything that had happened.
translation:
  language: uk
  text: Тож його співраби[a], побачивши, що сталося, дуже засмутилися. Вони прийшли й докладно розповіли своєму панові[b] про все, що сталося.
  philosophy: optimal-equivalence
  footnotes:
