    text: Або «його товариші-слуги». Грецьке σύνδουλοι буквально означає «співраби», тобто рабів того самого пана.
    reason: lexical_alternative
  - marker: b
    text: Або «своєму господареві». Грецьке κύριος залежно від контексту може означати «пан», «господар» або «Господь».
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Тож
  rationale: Передає висновковий і водночас оповідний перехід від попередньої події природною сучасною українською.
- source_word: σύνδουλοι
  choice: інші раби
  rationale: Складене слово означає рабів того самого пана. Українське «інші раби» природніше за буквальне «співраби» й зберігає важливий для притчі підневільний статус.
- source_word: τὰ γενόμενα / πάντα τὰ γενόμενα
  choice: що сталося / про все, що сталося
  rationale: Природно передає субстантивований дієприкметник γίνομαι; πάντα в другому вживанні виражено словом «все».
- source_word: ἐλυπήθησαν σφόδρα
  choice: дуже засмутилися
  rationale: Передає сильний смуток або душевний біль, виражений λυπέω та підсилений σφόδρα, без надмірного уточнення характеру емоції.
- source_word: ἐλθόντες
  choice: Вони прийшли
  rationale: Дієприкметник попередньої дії природно розгорнуто в особову форму, яка зберігає послідовність подій.
- source_word: διεσάφησαν
  choice: докладно розповіли
  rationale: Дієслово означає ясно або докладно повідомити; цей варіант зберігає відтінок повного викладу, а не лише простого повідомлення.
- source_word: τῷ κυρίῳ ἑαυτῶν
  choice: своєму панові
  rationale: У контексті людського володаря притчі «пан» природно передає κύριος і водночас узгоджується з рабським статусом персонажів.
theological_decisions:
- issue: Передача слова з родини δοῦλος у соціальному контексті притчі
  choice: інші раби
  alternative: інші слуги
  rationale: У контексті боргової залежності рабський статус важливий для логіки притчі. «Слуги» було б м’якше, але послабило б значення вихідного слова.
- issue: Передача κύριος щодо людського володаря
  choice: пан
  alternative: господар
  rationale: «Пан» природно позначає володаря рабів у цій притчі й не надає людському персонажеві прямого божественного титулу. «Господар» також можливе контекстуальне прочитання.
translation_notes:
  register: Сучасна стандартна українська, природний і гідний оповідний стиль. Два речення полегшують сприйняття довгого грецького періоду; повтор «що сталося» збережено через його смислову роль. Усі приміткові маркери подано в основному тексті.
