source:
  edition: SBLGNT
  text: Ὃς δ’ ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν τούτων τῶν πιστευόντων εἰς ἐμέ, συμφέρει αὐτῷ ἵνα κρεμασθῇ μύλος ὀνικὸς ⸀εἰς τὸν τράχηλον αὐτοῦ καὶ καταποντισθῇ ἐν τῷ πελάγει τῆς θαλάσσης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/006.yaml
  text: But whoever causes one of these little ones who believe in me to stumble[c][b][a], it is better for him that a donkey millstone be hung around his neck and that he be drowned in the open sea.
translation:
  language: uk
  text: А хто призведе до падіння одного з цих малих, які вірять у Мене,[a] тому було б краще, якби йому повісили на шию жорно, яке обертає осел,[b] і його втопили у відкритому морі.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «спонукає до гріха». Грецьке дієслово може означати стати причиною того, що хтось спіткнеться, впаде, відступить або згрішить.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «осляче жорно» — велике млинове жорно, яке обертав осел.'
    reason: cultural_note
  - marker: c
    text: 'Або: «у морській глибині». Грецький вислів точніше вказує на відкрите море, далеко від берега.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίσῃ
  choice: призведе до падіння
  rationale: 'Передає метафору духовного спотикання та ширший діапазон значень дієслова: спричинити гріх, відступництво або духовну загибель. Це ширше й точніше, ніж лише «спокусить».'
- source_word: μικρῶν τούτων
  choice: цих малих
  rationale: 'Зберігає широту грецького вислову: йдеться не обов’язково лише про дітей, а й про малих, слабких або незнатних учнів.'
- source_word: τῶν πιστευόντων εἰς ἐμέ
  choice: які вірять у Мене
  rationale: Прямо й природно передає означення цих «малих» як тих, хто вірить в Ісуса.
- source_word: συμφέρει αὐτῷ
  choice: тому було б краще
  rationale: Природно передає порівняльний сенс користі або переваги в контексті суворого застереження.
- source_word: μύλος ὀνικὸς
  choice: жорно, яке обертає осел
  rationale: Ясно відрізняє велике млинове жорно, яке приводила в рух тяглова тварина, від малого ручного жорна.
- source_word: καταποντισθῇ
  choice: втопили
  rationale: Передає пасивну дію занурення у воду з наслідком смерті, природно для сучасної української.
- source_word: ἐν τῷ πελάγει τῆς θαλάσσης
  choice: у відкритому морі
  rationale: πέλαγος позначає морський простір далеко від берега; «відкрите море» лексично точніше за тлумачне «морська глибина».
theological_decisions:
- issue: Коло осіб, названих «цими малими»
  choice: Збережено широкий вислів «цих малих, які вірять у Мене», без обмеження лише дітьми.
  alternative: «цих дітей, які вірять у Мене»
  rationale: У найближчому контексті присутня дитина, однак уточнення «які вірять у Мене» дає змогу розуміти вислів ширше — як позначення смиренних або вразливих учнів. Переклад не усуває цієї напруги.
- issue: Значення σκανδαλίσῃ
  choice: «призведе до падіння» — широкий вислів, що охоплює гріх і духовне відпадіння.
  alternative: «спокусить до гріха»
  rationale: Грецьке дієслово не обмежується одноразовою спокусою чи окремим гріхом, тому основний текст зберігає ширший образ падіння.
translation_notes:
  register: Сучасна нормативна українська, зрозуміла широкому читачеві, зі стриманим і гідним біблійним звучанням. Займенник «Мене» написано з великої літери за поширеною українською традицією шанобливого позначення Ісуса; синтаксис зберігає сувору умовно-порівняльну форму оригіналу.
