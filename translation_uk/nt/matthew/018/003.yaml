review_pass:
  verdict: revise
  source_fidelity: 'Основний зміст передано точно: урочиста формула Ἀμὴν, дві узгоджені умови зміни, порівняння з дітьми та категоричне заперечення входження до Царства Небесного збережені. «Навернетеся» є припустимим переданням στραφῆτε, хоча примітка слушно зазначає можливий пасивний відтінок.'
  naturalness: «Нізащо не ввійдете» в сучасній українській мові легко сприймається як «не ввійдете безплатно / ні за що», а не як емфатичне заперечення. «Аж ніяк не ввійдете» природніше й точніше передає οὐ μή. Маркер примітки про заперечення слід поставити безпосередньо після відповідного дієслова.
  terminology: «Істинно кажу вам», «навернетеся» та «Царство Небесне» відповідають урочистому сучасному біблійному регістру. «Як діти» належно не конкретизує, які саме дитячі риси маються на увазі. У примітці пасивний варіант краще передати як «не будете повернені», а не повторювати богословськи забарвлене «навернені».
