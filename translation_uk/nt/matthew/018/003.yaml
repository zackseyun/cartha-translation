  text: καὶ εἶπεν· Ἀμὴν λέγω ὑμῖν, ἐὰν μὴ στραφῆτε καὶ γένησθε ὡς τὰ παιδία, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/003.yaml
  text: And he said[a], “Truly I say to you, unless you turn and become like children[c][b], you will certainly not enter the kingdom of heaven.”
translation:
  language: uk
  text: 'І сказав: «Істинно кажу вам: якщо не навернетеся[a] й не станете як діти, то аж ніяк не ввійдете[b] до Царства Небесного».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «не повернетеся» чи «не будете повернені». Грецька форма допускає неперехідне або пасивне розуміння.'
    reason: alternative_reading
  - marker: b
    text: 'Грецький текст містить підсилене заперечення; можливий переклад: «ніколи не ввійдете».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: Істинно
  rationale: У вступній формулі урочисто підтверджує правдивість і авторитетність вислову; «істинно» природно передає цю силу в сучасній українській біблійній мові.
- source_word: στραφῆτε
  choice: навернетеся
  rationale: 'Форма може мати неперехідний або пасивний відтінок: «повернетеся / будете повернені». «Навернетеся» стисло передає рішучу зміну спрямування, не зводячи вислів до пізнішого технічного терміна.'
- source_word: γένησθε
  choice: станете
  rationale: Природно передає зміну стану, виражену γίνομαι, і добре поєднується з попереднім дієсловом.
- source_word: ὡς τὰ παιδία
  choice: як діти
  rationale: Артикль тут може позначати дітей як клас і водночас перегукуватися з дитиною в безпосередньому контексті. Українське «як діти» природно зберігає порівняння, не додаючи невиражених якостей чи зменшувального відтінку.
- source_word: οὐ μὴ εἰσέλθητε
  choice: нізащо не ввійдете
  rationale: Подвійне заперечення οὐ μή з аористом кон’юнктива виражає особливо сильне заперечення; «нізащо не ввійдете» передає його виразно й природно.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: Царства Небесного
  rationale: Усталений і точний український відповідник характерного для Матвія вислову, який передає Боже царювання, не намагаючись додатково тлумачити його.
theological_decisions:
- issue: Значення στραφῆτε як мови про докорінну зміну
  choice: навернетеся
  alternative: повернетеся; будете навернені
  rationale: Обрано слово, що передає рішучу зміну спрямування, але саме по собі не визначає її механізму й не нав’язує конфесійного вчення про навернення.
- issue: Зміст уподібнення дітям
  choice: як діти
  alternative: як ті діти; як малі діти
  rationale: Вірш не називає конкретної дитячої якості. Переклад зберігає відкритим питання, чи йдеться про смирення, залежність, низький суспільний статус або ширший образ, який уточнює контекст.
- issue: Сила заперечення οὐ μή
  choice: нізащо не ввійдете
  alternative: ніколи не ввійдете; аж ніяк не ввійдете
  rationale: Передано категоричність грецької конструкції без послаблення твердження або додавання часової інтерпретації як єдино можливої.
translation_notes:
  register: Сучасна, зрозуміла й водночас урочиста українська мова. Збережено традиційні біблійні формули «Істинно кажу вам» і «Царство Небесне», уникаючи архаїчної синтаксичної побудови та надмірного богословського уточнення.
