source:
  edition: SBLGNT
  text: Εἰ δὲ ἡ χείρ σου ἢ ὁ πούς σου σκανδαλίζει σε, ἔκκοψον ⸀αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν εἰσελθεῖν εἰς τὴν ζωὴν ⸂κυλλὸν ἢ χωλόν⸃, ἢ δύο χεῖρας ἢ δύο πόδας ἔχοντα βληθῆναι εἰς τὸ πῦρ τὸ αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/008.yaml
  text: And if your hand or your foot causes you to stumble[a], cut it off and throw it away from you. It is better for you to enter into life maimed or lame than, having two hands or two feet, to be thrown into the eternal fire.
translation:
  language: uk
  text: А якщо твоя рука чи нога спонукає тебе спіткнутися[a], відрубай її та відкинь від себе. Краще тобі ввійти в життя скаліченим чи кульгавим, ніж із двома руками чи двома ногами бути вкинутим у вічний вогонь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «спонукає тебе згрішити». Грецьке дієслово буквально зберігає образ того, як хтось спричиняє спотикання.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίζει
  choice: спонукає тебе спіткнутися
  rationale: Зберігає грецький образ спотикання та водночас передає спричинення дії; моральний зміст пояснено у примітці, а не підставлено в основний текст.
- source_word: ἔκκοψον
  choice: відрубай
  rationale: Сильний і конкретний наказ, природний щодо руки або ноги; не пом’якшує різкості вислову.
- source_word: βάλε ἀπὸ σοῦ
  choice: відкинь від себе
  rationale: Передає рішуче усунення й віддалення від себе природною сучасною українською мовою.
- source_word: καλόν σοί ἐστιν
  choice: краще тобі
  rationale: 'У конструкції порівняння з ἤ прикметник καλόν має порівняльний зміст: «краще», а не просто «добре».'
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: ввійти в життя
  rationale: Зберігає просте «життя» без додавання слова «вічне»; есхатологічний сенс випливає з контрасту з вічним вогнем.
- source_word: κυλλὸν
  choice: калікою
  rationale: У цьому контексті позначає людину, скалічену втратою кінцівки; українське слово стисло передає наслідок відрубування руки.
- source_word: χωλόν
  choice: кульгавим
  rationale: Прямий і сучасний відповідник стану людини з ушкодженою ногою або ходою.
- source_word: δύο χεῖρας ἢ δύο πόδας ἔχοντα
  choice: із двома руками чи двома ногами
  rationale: Природна українська конструкція точно зберігає контраст із попередньою втратою руки чи ноги.
- source_word: βληθῆναι
  choice: бути вкинутим
  rationale: Зберігає пасивну форму та силу дієслова βάλλω у контексті суду.
- source_word: τὸ πῦρ τὸ αἰώνιον
  choice: вічний вогонь
  rationale: Прямий і звичний відповідник αἰώνιος у контексті остаточного суду, без перефразування природи покарання.
theological_decisions:
- issue: Чи передавати σκανδαλίζει морально як «спонукає згрішити», чи зберегти образ спотикання
  choice: спонукає тебе спіткнутися
  alternative: спонукає тебе згрішити
  rationale: Грецький текст використовує метафору спотикання. Основний текст її зберігає, а примітка подає морально виразнішу альтернативу.
- issue: Значення «життя» в εἰς τὴν ζωὴν
  choice: життя
  alternative: вічне життя
  rationale: Контекст надає слову есхатологічного значення, однак у грецькому тексті немає прикметника «вічне» при «житті», тому його не додано.
- issue: Характер наказу про тілесне каліцтво
  choice: передати буквально й різко, не визначаючи в перекладі, чи це гіпербола
  alternative: перефразувати як заклик радикально усунути причину гріха
  rationale: Переклад має зберегти напруження й силу образу, не розв’язуючи його тлумаченням у самому тексті.
translation_notes:
  register: Сучасна стандартна українська, природний і гідний біблійний стиль. Форми «відрубай», «відкинь», «ввійти» передають різкість і рух оригіналу без архаїзації. Займенникову узгодженість «її» визначено за найближчими українськими іменниками «рука» та «нога», обидва жіночого роду.
