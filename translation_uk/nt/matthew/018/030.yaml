  text: But he was not willing[a]; instead[c][b], he went away and threw him into prison until he should pay what was owed.
translation:
  language: uk
  text: Але той не хотів[a], а пішов і кинув його до в’язниці[b], аж поки той не сплатить належне[c].
  philosophy: optimal-equivalence
