lexical_decisions:
- source_word: ὁ δὲ
  choice: Але той
  rationale: Субстантивований артикль указує на раба, згаданого раніше; «той» природно відсилає до нього й зберігає протиставлення, виражене δέ.
- source_word: οὐκ ἤθελεν
  choice: не захотів
  rationale: Передає волевий зміст θέλω природною сучасною українською, не посилюючи його до однозначного «відмовився».
- source_word: ἀλλὰ ἀπελθὼν
  choice: а пішов
  rationale: «А» виражає різке протиставлення, а дієприслівникову форму передано особовим дієсловом для природності; послідовність дій збережено.
- source_word: ἔβαλεν αὐτὸν εἰς φυλακήν
  choice: кинув його до в’язниці
  rationale: «Кинув» зберігає силу βάλλω та підкреслює жорстокість учинку, тоді як «посадив» було б нейтральнішим.
- source_word: ἕως οὗ
  choice: аж поки
  rationale: Природно позначає часову межу ув’язнення та передає підсилений відтінок тривалості в контексті.
- source_word: ἀποδῷ
  choice: не сплатить
  rationale: Доконавчий вид після «поки» передає очікуване повне виконання платежу, відповідно до аористного кон’юнктива.
- source_word: τὸ ὀφειλόμενον
  choice: належне
  rationale: Субстантивований дієприкметник буквально означає «те, що належить сплатити»; «належне» стисло зберігає цю форму без звуження до конкретної суми.
