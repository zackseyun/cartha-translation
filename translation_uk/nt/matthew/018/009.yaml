id: MAT.18.9
reference: Matthew 18:9
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ ὀφθαλμός σου σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν μονόφθαλμον εἰς τὴν ζωὴν εἰσελθεῖν, ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/009.yaml
  text: And if your eye causes you to stumble[a], tear it out and throw it away from you. It is better for you to enter into life with one eye than, having two eyes[b], to be thrown into the Gehenna of fire.
translation:
  language: uk
  text: І якщо твоє око призводить тебе до падіння[a], вирви його й відкинь від себе. Краще тобі однооким увійти в життя, ніж, маючи два ока, бути вкинутим у вогняну Геєну[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «спонукає тебе грішити». Грецьке дієслово може означати спричинити спотикання, падіння або гріх.'
    reason: lexical_alternative
  - marker: b
    text: «Геєна» — назва, пов’язана з місцем остаточного суду; традиційно перекладається як «пекло».
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζει
  choice: призводить тебе до падіння
  rationale: Зберігає образ спотикання й падіння, закладений у дієслові, та не звужує його значення лише до внутрішньої спокуси; у контексті йдеться про падіння в гріх.
- source_word: ἔξελε
  choice: вирви
  rationale: Сильний наказовий вислів природно передає різкість і невідкладність грецького аористового імператива та зберігає навмисно суворий образ.
- source_word: βάλε ἀπὸ σοῦ
  choice: відкинь від себе
  rationale: Передає рішуче усунення й повне віддалення, водночас звучить природно сучасною українською.
- source_word: καλόν σοί ἐστιν
  choice: краще тобі
  rationale: 'У конструкції з ἤ вислів має порівняльне значення: один наслідок кращий за інший.'
- source_word: μονόφθαλμον
  choice: однооким
  rationale: Точно й стисло передає прикметник «одноокий» та природно узгоджується з дієсловом «увійти».
- source_word: εἰς τὴν ζωὴν
  choice: увійти в життя
  rationale: Зберігає формулювання оригіналу без додавання прикметника «вічне», хоча контекст має есхатологічний зміст.
- source_word: βληθῆναι
  choice: бути вкинутим
  rationale: Прямо передає пасивний інфінітив і силу образу примусового вкинення.
- source_word: γέενναν
  choice: Геєну
  rationale: Транслітерація зберігає специфічний юдейський історико-есхатологічний термін, не ототожнюючи його без пояснення із ширшим поняттям «пекло».
- source_word: τοῦ πυρός
  choice: вогняну
  rationale: Природний український прикметниковий відповідник грецького родового означення; зберігає виразний образ вогню.
theological_decisions:
- issue: Передача γέεννα
  choice: Геєна
  alternative: пекло
  rationale: Оригінал уживає конкретний термін γέεννα, а не загальну назву потойбіччя чи кари. Транслітерація зберігає його історичну та есхатологічну специфіку.
- issue: Передача εἰς τὴν ζωὴν
  choice: увійти в життя
  alternative: увійти у вічне життя
  rationale: Хоча в контексті ймовірно мається на увазі есхатологічне життя, слово «вічне» в грецькому тексті відсутнє, тому його не додано.
- issue: Характер вислову про око
  choice: збережено різкий буквальний образ без пояснювального пом’якшення в основному тексті
  alternative: пояснювально передати як заклик усунути причину гріха
  rationale: Переклад не повинен самостійно визначати межі образності чи послаблювати навмисно суворе формулювання Ісуса.
translation_notes:
  register: Сучасна стандартна українська мова з лаконічним, урочистим і зрозумілим синтаксисом. Збережено різкість наказів, образ падіння та есхатологічну напругу; уникнуто архаїзмів і конфесійно специфічних уточнень.
