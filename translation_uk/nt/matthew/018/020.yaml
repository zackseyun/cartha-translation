  text: οὗ γάρ εἰσιν δύο ἢ τρεῖς συνηγμένοι εἰς τὸ ἐμὸν ὄνομα, ἐκεῖ εἰμι ἐν μέσῳ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/020.yaml
  text: For where two or three are gathered in my name[a], there I am in their midst.
translation:
  language: uk
  text: Бо де двоє чи троє зібрані в Моє ім’я, там Я серед них.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗ
  choice: де
  rationale: Природно вводить обставинне речення місця й не розширює значення до «де б не».
- source_word: γάρ
  choice: бо
  rationale: Зберігає пояснювальний зв’язок із попереднім контекстом.
- source_word: δύο ἢ τρεῖς
  choice: двоє чи троє
  rationale: Українські збірні числівники природно вживаються щодо групи людей; «чи» тут передає альтернативу без зміни змісту.
- source_word: συνηγμένοι
  choice: зібрані
  rationale: Передає перфектний пасивний дієприкметник і стан людей, які зійшлися або були зібрані разом.
- source_word: εἰς τὸ ἐμὸν ὄνομα
  choice: в Моє ім’я
  rationale: Усталений і зрозумілий український відповідник, який зберігає зв’язок з ім’ям Ісуса, не звужуючи вислів до одного з можливих відтінків — влади, належності чи мети.
- source_word: ἐκεῖ
  choice: там
  rationale: Зберігає співвідносну будову грецького вислову «де… там».
- source_word: εἰμι
  choice: Я
  rationale: Українське теперішнє речення з нульовою зв’язкою природно передає грецьке «Я є», не додаючи тлумачного «присутній».
- source_word: ἐν μέσῳ αὐτῶν
  choice: серед них
  rationale: Природний сучасний відповідник просторового образу «посеред них», без зайвої урочистості.
theological_decisions:
- issue: Христологічний зміст присутності Ісуса серед зібраних учнів
  choice: Прямо передати твердження «там Я серед них», не визначаючи способу цієї присутності.
  alternative: «Там Я присутній серед них» або конфесійне сакраментальне чи еклезіологічне уточнення.
  rationale: Грецький текст стверджує присутність Ісуса, але не пояснює її метафізичного способу; переклад має зберегти це твердження без пізніших доктринальних уточнень.
translation_notes:
  register: Сучасна стандартна українська, проста й гідна синтаксична будова. Збережено пояснювальне «бо» та паралель «де… там». Займенники щодо Ісуса подано з великої літери відповідно до поширеної української біблійної видавничої практики.
