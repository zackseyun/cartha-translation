  text: ἀρξαμένου δὲ αὐτοῦ συναίρειν ⸀προσηνέχθη ⸂αὐτῷ εἷς⸃ ὀφειλέτης μυρίων ταλάντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/024.yaml
  text: And when he began to settle accounts[a], one debtor who owed ten thousand talents was brought to him.
translation:
  language: uk
  text: Коли ж він почав зводити рахунки, до нього привели одного боржника, який заборгував десять тисяч талантів.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Талант був дуже великою грошовою одиницею; у контексті притчі «десять тисяч талантів» означає неймовірно великий борг.
    reason: cultural_note
lexical_decisions:
- source_word: ἀρξαμένου δὲ αὐτοῦ
  choice: Коли ж він почав
  rationale: Родовий абсолют передає часову обставину головної дії; «коли ж він почав» природно відтворює і часовий зв’язок, і сполучник δέ.
- source_word: συναίρειν
  choice: зводити рахунки
  rationale: У фінансовому контексті дієслово означає перевіряти й упорядковувати рахунки для розрахунку; цей український вислів природно зберігає бухгалтерський образ.
- source_word: προσηνέχθη
  choice: привели
  rationale: Пасивна форма вказує, що боржника привели інші. Неозначено-особова українська конструкція звучить природніше за буквальне «був приведений» і не називає виконавців дії.
- source_word: αὐτῷ
  choice: до нього
  rationale: Давальний відмінок при пасивній формі προσφέρω позначає особу, до якої привели боржника.
- source_word: εἷς ὀφειλέτης
  choice: одного боржника
  rationale: Числівник εἷς збережено, бо він виокремлює один конкретний випадок серед рахунків, а ὀφειλέτης прямо означає боржника.
- source_word: μυρίων ταλάντων
  choice: десять тисяч талантів
  rationale: μύριοι буквально означає «десять тисяч» і водночас підкреслює величезний розмір боргу. Історичну одиницю «талант» збережено без спірного перерахунку на сучасні гроші.
theological_decisions: []
translation_notes:
  register: Сучасна, природна й гідна українська мова. Зворот «зводити рахунки» передає фінансовий зміст без архаїзмів; неозначено-особове «привели» природно відтворює грецький пасив.
