  text: So the servant fell down before him and kept pleading[a], saying, ‘Be patient with me, and I will repay you everything.’
translation:
  language: uk
  text: 'Тож раб упав ниць і вклонявся йому[a], кажучи: «Будь терпеливий до мене, і я все тобі віддам».'
  philosophy: optimal-equivalence
  footnotes:
