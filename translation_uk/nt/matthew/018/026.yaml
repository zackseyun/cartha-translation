    reason: lexical_alternative
lexical_decisions:
- source_word: πεσὼν
  choice: упав ниць
  rationale: Дієприкметник аориста від πίπτω передає фізичний рух униз; «упав ниць» природно відтворює принижену позу раба в цьому контексті.
- source_word: οὖν
  choice: Тож
  rationale: Сполучник позначає наслідок подій попереднього вірша; «тож» стисло й природно зберігає цей логічно-оповідний зв’язок.
- source_word: δοῦλος
  choice: раб
  rationale: У притчі наголошено на повній залежності цієї людини від пана та на можливості її продажу; «раб» прямо передає соціальний статус, виражений словом δοῦλος.
- source_word: προσεκύνει αὐτῷ
  choice: вклонявся йому
  rationale: У цьому контексті προσκυνέω означає шанобливе припадання перед людським володарем. Недоконаний вид «вклонявся» також відтворює тривалу або повторювану дію імперфекта, не нав’язуючи значення релігійного поклоніння.
- source_word: λέγων
  choice: кажучи
  rationale: Дієприкметник безпосередньо вводить пряму мову; буквальний відповідник природний і не додає до тексту окремого дієслова прохання.
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  choice: Будь терпеливий до мене
  rationale: Імператив просить про поблажливе терпіння й відстрочення стягнення. Цей вислів зрозумілий сучасному читачеві та не додає конкретного строку, якого грецький текст не називає.
- source_word: πάντα
  choice: все
  rationale: 'Субстантивований середній рід множини має всеохопне значення: боржник обіцяє повернути всю суму.'
- source_word: ἀποδώσω σοι
  choice: я все тобі віддам
  rationale: У контексті боргу ἀποδίδωμι означає повернути належне. Українське «віддам» природно передає повне повернення боргу.
theological_decisions:
- issue: Значення προσκυνέω щодо людського володаря
  choice: Передано як шанобливий уклін перед паном
  alternative: «поклонявся йому» або «поклонявся йому як Богові»
  rationale: У світі притчі адресатом є цар і пан, а безпосередній зміст — покірне припадання підлеглого. Варіант «вклонявся» зберігає жест глибокої пошани, не стверджуючи релігійного поклоніння, якого сам контекст не вимагає; ширший діапазон грецького дієслова зазначено у примітці.
translation_notes:
  register: Сучасна нормативна українська мова з гідним оповідним тоном. Слово «раб» зберігає соціальну реальність притчі; формулювання прямої мови просте й зрозуміле без архаїзмів.
