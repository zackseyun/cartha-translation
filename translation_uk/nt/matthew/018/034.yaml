  text: καὶ ὀργισθεὶς ὁ κύριος αὐτοῦ παρέδωκεν αὐτὸν τοῖς βασανισταῖς ἕως οὗ ἀποδῷ πᾶν τὸ ⸀ὀφειλόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/034.yaml
  text: And in anger his master handed him over to the torturers until he should pay all that was owed[a][b].
translation:
  language: uk
  text: І його пан, розгнівавшись, віддав його мучителям, аж поки він не сплатить усього, що був винен[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «Господь». Грецьке κύριος тут у межах притчі означає пана слуги, тому в основному тексті вжито «пан».
    reason: alternative_reading
  - marker: b
    text: Або «катівникам»; слабше — «тюремникам». Грецьке слово означає тих, хто завдає мук, а не просто звичайних вартових.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: розгнівавшись
  rationale: Аористовий пасивний дієприкметник ужито обставинно перед головним дієсловом; український дієприслівник природно передає попередній вияв гніву, не розширюючи причинового зв’язку.
- source_word: κύριος
  choice: пан
  rationale: У межах притчі слово позначає земного пана слуги. «Пан» природно передає владні відносини й не нав’язує титульного значення «Господь».
- source_word: παρέδωκεν
  choice: віддав
  rationale: Передає передання людини під владу інших у каральному контексті.
- source_word: βασανισταῖς
  choice: катам
  rationale: βασανιστής означає того, хто завдає мук; «кати» зберігає суворість вислову краще, ніж послаблене «тюремники».
- source_word: ἕως οὗ
  choice: аж поки
  rationale: Природна українська часова конструкція, що виразно позначає очікувану межу дії.
- source_word: ἀποδῷ
  choice: не сплатить
  rationale: Аористовий кон’юнктив після ἕως οὗ позначає очікувану майбутню межу; доконаний вид «сплатить» доречно передає завершеність.
- source_word: πᾶν τὸ ὀφειλόμενον
  choice: усього належного
  rationale: Зберігає субстантивований дієприкметниковий вислів «усе те, що належить сплатити», не вводячи іменника «борг», якого тут у грецькому тексті немає.
theological_decisions:
- issue: Чи передавати κύριος доктринально звичним титулом «Господь»
  choice: пан
  alternative: Господь
  rationale: Безпосередньо в сюжеті притчі йдеться про людського пана слуги. «Пан» зберігає оповідний зміст, не усуваючи ширшого богословського застосування притчі.
- issue: Ступінь суворості βασανισταῖς у контексті покарання
  choice: кати
  alternative: мучителі; тюремники
  rationale: Вибір зберігає лексичну силу слова та загрозливу напругу притчі, але не визначає понад сказане природи чи тривалості остаточного суду.
translation_notes:
  register: Сучасна стандартна українська, стислий і гідний оповідний стиль. «Розгнівавшись» і «аж поки» звучать природно, а «кати» зберігає суворість оригіналу. Усі примітки позначено в основному тексті.
