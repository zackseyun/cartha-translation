  source_fidelity: 'Основний зміст і синтаксичні зв’язки передано точно: гнів пана, передання під каральну владу та часова межа «поки не сплатить» відповідають грецькому тексту. Проте «катам» в українській звичайно означає виконавців смертної кари, тоді як βασανισταῖς — тих, хто завдає мук/катувань; це невиправдано звужує й дещо змінює образ.'
