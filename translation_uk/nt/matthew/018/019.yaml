source:
  edition: SBLGNT
  text: Πάλιν ⸀ἀμὴν λέγω ὑμῖν ὅτι ἐὰν δύο ⸂συμφωνήσωσιν ἐξ ὑμῶν⸃ ἐπὶ τῆς γῆς περὶ παντὸς πράγματος οὗ ἐὰν αἰτήσωνται, γενήσεται αὐτοῖς παρὰ τοῦ πατρός μου τοῦ ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/019.yaml
  text: Again[a], truly I tell you, if two of you agree on earth about any matter they ask for[c][b], it will be done for them by my Father in heaven.
translation:
  language: uk
  text: 'І знову, істинно кажу вам: якщо двоє з вас[a] на землі погодяться щодо будь-якої справи, про яку попросять[b], Мій Отець, Який на небесах[c], зробить це для них.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «якщо двоє з-поміж вас дійдуть згоди».'
    reason: lexical_alternative
  - marker: b
    text: У контексті ці слова йдуть після настанови Ісуса про відповідальність і повноваження громади (18:15–18), хоча саме формулювання тут широко говорить про узгоджене прохання.
    reason: cross_reference
  - marker: c
    text: 'Грецькою буквально: «на небесах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: І знову
  rationale: Передає додаткове або поновлене урочисте висловлювання та природно пов’язує його з попередніми словами Ісуса.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: істинно кажу вам
  rationale: Природна сучасна українська відповідність урочистій формулі Ісуса, яка зберігає її наголос без обов’язкової транслітерації «амінь».
- source_word: ἐὰν δύο συμφωνήσωσιν ἐξ ὑμῶν
  choice: якщо двоє з вас погодяться
  rationale: συμφωνέω означає дійти згоди, а ἐξ ὑμῶν природно передано як «з вас»; можливу повнішу форму наведено в примітці.
- source_word: ἐπὶ τῆς γῆς
  choice: на землі
  rationale: Зберігає просторове протиставлення Отцеві, Який на небесах.
- source_word: περὶ παντὸς πράγματος
  choice: щодо будь-якої справи
  rationale: πρᾶγμα має широке значення «справа, питання, річ»; «будь-яка справа» природно зберігає широту вислову.
- source_word: οὗ ἐὰν αἰτήσωνται
  choice: про яку попросять
  rationale: Передає невизначену відносну конструкцію та значення αἰτέω — просити; формулювання не додає прямо не висловлених обмежень.
- source_word: γενήσεται αὐτοῖς παρὰ τοῦ πατρός μου
  choice: Мій Отець ... зробить це для них
  rationale: Природна українська перебудова, що передає результат γενήσεται αὐτοῖς і джерело або діяча з παρά + родовий відмінок, не приховуючи дії Отця.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: Який на небесах
  rationale: Зберігає грецьку форму множини οὐρανοῖς, що є природною і традиційно зрозумілою українською.
theological_decisions:
- issue: Обсяг обітниці в контексті
  choice: Передати вислів широко й прямо, не додаючи до тексту обмежень щодо церковної дисципліни, молитви чи Божої волі.
  alternative: Явно обмежити обітницю рішеннями церковної громади або, навпаки, подати її як безумовну обіцянку виконання будь-якого молитовного прохання.
  rationale: Безпосередній контекст стосується взаємин і повноважень громади (18:15–18), а αἰτέω вказує на прохання, імовірно звернене до Бога. Проте сам вірш не формулює додаткових обмежень чи розширень, тому переклад зберігає його широту та контекстуальну напругу.
- issue: Джерело чи діяч у παρὰ τοῦ πατρός μου
  choice: 'Подати Отця як діяча: «Мій Отець ... зробить це».'
  alternative: 'Передати конструкцію як джерело: «це станеться для них від Мого Отця».'
  rationale: παρά з родовим відмінком може позначати джерело, а в цій конструкції також природно вказує на Того, завдяки Кому настає результат. Активна українська конструкція ясна, але не змінює змісту обітниці.
translation_notes:
  register: Сучасна, гідна й доступна українська мова. Збережено урочистість формули «істинно кажу вам», широту «будь-якої справи» та грецьку множину «на небесах». Синтаксис завершальної частини перебудовано в природну активну українську конструкцію.
