  text: Ἐν ἐκείνῃ τῇ ὥρᾳ προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ λέγοντες· Τίς ἄρα μείζων ἐστὶν ἐν τῇ βασιλείᾳ τῶν οὐρανῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/001.yaml
  text: At that time the disciples came to Jesus, saying, “Who then is greater in the kingdom of heaven?”
translation:
  language: uk
  text: 'Тієї години учні підійшли до Ісуса й запитали: «Хто ж більший у Царстві Небесному?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: Тієї години
  rationale: Формально й природно передає часовий зворот без додавання значення.
- source_word: προσῆλθον ... τῷ Ἰησοῦ
  choice: підійшли до Ісуса
  rationale: Прямий сучасний відповідник руху до особи.
- source_word: λέγοντες
  choice: й запитали
  rationale: У цьому контексті дієприкметник мовлення вводить пряме запитання; особова форма природніша українською.
- source_word: Τίς ἄρα μείζων ἐστὶν
  choice: Хто ж більший
  rationale: Збережено порівняльний ступінь μείζων («більший»), не замінюючи його найвищим («найбільший»); частку ἄρα передано як «ж».
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: у Царстві Небесному
  rationale: Усталений і зрозумілий український відповідник матвіївського вислову; прикметникова форма природно передає грецький родовий зворот.
theological_decisions:
- issue: Порівняльний чи найвищий ступінь у запитанні учнів
  choice: більший
  alternative: найбільший
  rationale: Грецьке μείζων морфологічно є порівняльним ступенем. Переклад зберігає його справжню форму й можливу контекстуальну напругу, не нормалізуючи до найвищого ступеня.
translation_notes:
  register: Сучасна стандартна українська; виклад стислий, природний і гідний. Традиційний вислів «Царство Небесне» збережено без конфесійних уточнень.
