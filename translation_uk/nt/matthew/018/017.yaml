id: MAT.18.17
reference: Matthew 18:17
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ἐὰν δὲ παρακούσῃ αὐτῶν, εἰπὸν τῇ ἐκκλησίᾳ· ἐὰν δὲ καὶ τῆς ἐκκλησίας παρακούσῃ, ἔστω σοι ὥσπερ ὁ ἐθνικὸς καὶ ὁ τελώνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/017.yaml
  text: But if he refuses to listen to them[a], tell it to the assembly. And if he also refuses to listen to the assembly, let him be to you like the Gentile and the tax collector.
translation:
  language: uk
  text: А якщо він не послухає їх, скажи про це громаді[a]. Якщо ж він не послухає й громади, нехай буде для тебе як язичник і збирач податків.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «церкві» чи «зібранню» (грецьке ekklēsia).
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακούσῃ
  choice: не послухає
  rationale: У цьому контексті вислів означає не просто не почути, а не прислухатися до звернення. Українське «не послухає» природно передає це значення, не посилюючи його до прямого «не підкориться» і не додаючи явно вираженого наміру.
- source_word: εἰπὸν
  choice: скажи про це
  rationale: Імператив означає повідомити громаді про справу. Займенникове «про це» природно відновлює зрозумілий із контексту додаток, не конкретизуючи його понад текст.
- source_word: ἐκκλησίᾳ / ἐκκλησίας
  choice: громаді / громади
  rationale: «Громада» передає зібрану спільноту й не нав’язує пізніших інституційних або конфесійних уявлень. Традиційні відповідники наведено в примітці.
- source_word: ἔστω σοι
  choice: нехай буде для тебе
  rationale: Збережено наказовий спосіб і особовий давальний σοι, не перетворюючи вислів на більш тлумачне «вважай його» або «поводься з ним».
- source_word: ὥσπερ
  choice: як
  rationale: Прямий і природний український відповідник порівняння.
- source_word: ὁ ἐθνικὸς
  choice: язичник
  rationale: У юдейському контексті слово позначає представника народів поза спільнотою завіту. «Язичник» є усталеним і зрозумілим українським біблійним відповідником, хоча не відтворює грецький артикль окремим означенням.
- source_word: ὁ τελώνης
  choice: збирач податків
  rationale: Сучасний прозорий відповідник назви професії; він зрозуміліший для широкого читача, ніж архаїчне «митар», і не додає оцінки, якої саме слово не виражає.
theological_decisions:
- issue: Передача ἐκκλησία в допасхальному контексті настанови в Євангелії від Матвія
  choice: громада
  alternative: церква; зібрання
  rationale: «Громада» відтворює спільноту, до якої слід донести справу, не визначаючи наперед її пізнішу інституційну форму. Традиційне «церква» і буквальніше «зібрання» збережено як допустимі варіанти в примітці.
- issue: Ставлення до людини, яка не прислухалася до громади
  choice: нехай буде для тебе як язичник і збирач податків
  alternative: вважай його язичником і збирачем податків; поводься з ним як зі стороннім
  rationale: Збережено порівняльну конструкцію та її напруження. Переклад не перетворює вислів на розгорнуту процедуру відлучення і не визначає детально, яку саме поведінку він приписує.
translation_notes:
  register: Сучасна нормативна українська мова з гідним, але не архаїчним звучанням. Синтаксичний паралелізм грецького тексту збережено; «збирач податків» обрано замість традиційного, але менш загальнозрозумілого «митар».
