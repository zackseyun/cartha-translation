  source_fidelity: Текст точно передає послідовність умовних кроків, дворазове παρακούσῃ як «не послухає», наказове εἰπὸν («скажи про це») та особовий відтінок ἔστω σοι («нехай буде для тебе»). Порівняння «як язичник і збирач податків» збережено без доданого процедурного тлумачення.
  naturalness: Переклад звучить природно й нормативно сучасною українською. Паралельна побудова двох речень виразна; «громада» та «збирач податків» зрозумілі широкому читачеві й відповідають стриманому біблійному регістру.
  terminology: «Громада» є вдалим нейтральним відповідником ἐκκλησία в цьому контексті; примітка належно подає «церкві» та «зібранню» як альтернативи. «Язичник» — усталений український біблійний відповідник ἐθνικός у юдейському контексті й не перетворює порівняння на доктринальну формулу.
