source:
  edition: SBLGNT
  text: ὅστις οὖν ταπεινώσει ἑαυτὸν ὡς τὸ παιδίον τοῦτο, οὗτός ἐστιν ὁ μείζων ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/004.yaml
  text: Therefore, whoever humbles himself like this child, he is the greatest in the kingdom of heaven.
translation:
  language: uk
  text: Отже, хто упокорить себе, як ця дитина, той і є найбільшим у Царстві Небесному.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταπεινώσει ἑαυτόν
  choice: впокорить себе
  rationale: Передає свідому дію самоприниження або смирення, зберігаючи зворотну конструкцію грецького тексту.
- source_word: ὡς τὸ παιδίον τοῦτο
  choice: як ця дитина
  rationale: Природний і прямий відповідник порівняння; «дитина» зрозуміле сучасному читачеві без зайвої архаїзації.
- source_word: οὗτός ἐστιν ὁ μείζων
  choice: той і є найбільшим
  rationale: Вказівне «той» відтворює підсилений грецький підмет οὗτος, а «і є» природно наголошує на парадоксальному визначенні величі.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: у Царстві Небесному
  rationale: Усталений український біблійний відповідник Матвієвого вислову «царство небес»; прикметникова форма природна й не змінює змісту.
theological_decisions:
- issue: Характер уподібнення дитині
  choice: Збережено загальне «впокорить себе, як ця дитина».
  alternative: Уточнити, що йдеться про невинність, довірливість, залежність або суспільний статус дитини.
  rationale: Грецький текст не пояснює тут точного аспекту порівняння; уточнення внесло б тлумачення без прямої текстової підстави.
- issue: Ступінь порівняння μείζων
  choice: «найбільшим»
  alternative: «більшим» або «великим»
  rationale: 'Артикль ὁ при μείζων у цій предикативній конструкції підтримує суперлативний зміст: «найбільший».'
translation_notes:
  register: Сучасна стандартна українська, гідний і загальнозрозумілий біблійний стиль. Збережено емфатичну конструкцію «той і є», яка відповідає οὗτός ἐστιν і не згладжує наголос оригіналу.
