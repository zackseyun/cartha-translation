  text: πεσὼν οὖν ὁ σύνδουλος ⸀αὐτοῦ παρεκάλει αὐτὸν λέγων· Μακροθύμησον ἐπ’ ⸀ἐμοί, καὶ ἀποδώσω σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/029.yaml
  text: So his fellow servant fell down and pleaded with him[a], saying, ‘Be patient with me, and I will repay you.’
translation:
  language: uk
  text: 'Тоді його співраб упав і став благати його: «Будь терплячим до мене, і я тобі віддам».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύνδουλος
  choice: товариш по рабству
  rationale: Передає значення людини, яка є рабом того самого пана, і зберігає важливий для притчі невільний соціальний статус без змішування з простою службою.
- source_word: παρεκάλει
  choice: благав
  rationale: У контексті відчайдушного прохання про відстрочення боргу дієслово позначає наполегливе благання; імперфект передає тривалу або повторювану дію.
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  choice: Потерпи мені
  rationale: Природний український вислів із проханням виявити терпіння й дати час; він пасує до боргового контексту та не послаблює особистої спрямованості ἐπ’ ἐμοί.
- source_word: ἀποδώσω
  choice: віддам
  rationale: У борговому контексті означає повернути належне; українське «віддам» природно передає обіцянку сплатити борг.
- source_word: πεσὼν
  choice: впав перед ним
  rationale: Зберігає фізичний жест покірного прохання; додане «перед ним» природно виражає спрямованість дії в контексті.
- source_word: οὖν
  choice: Тоді
  rationale: У цьому місці частка просуває розповідь і пов’язує реакцію боржника з попередньою вимогою; «тоді» звучить природно в українській оповіді.
theological_decisions:
- issue: Передача лексики δοῦλος у σύνδουλος
  choice: товариш по рабству
  alternative: співслуга; товариш-раб
  rationale: Вислів зберігає і спільну підлеглість одному панові, і реальність рабського становища, важливу для притчі, не вносячи конфесійного тлумачення.
translation_notes:
  register: Сучасна, зрозуміла й гідна оповідна українська. Репліка коротка та природна; формулювання зберігає соціальну гостроту рабства й образ покірного благання.
