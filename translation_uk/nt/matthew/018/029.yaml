  to: 'Тоді його співраб упав і став благати його: «Будь терплячим до мене, і я тобі віддам».'
  rationale: 'Виправлено два стилістично й семантично проблемні місця: σύνδουλος передано природним терміном «співраб», а ідіому μακροθύμησον ἐπ’ ἐμοί — сучасною конструкцією «Будь терплячим до мене». «Став благати» відтворює тривалість імперфекта παρεκάλει. Решту збережено без інтерпретаційних додатків.'
