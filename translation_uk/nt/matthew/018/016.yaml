  text: ἐὰν δὲ μὴ ἀκούσῃ, παράλαβε μετὰ σοῦ ἔτι ἕνα ἢ δύο, ἵνα ἐπὶ στόματος δύο μαρτύρων ἢ τριῶν σταθῇ πᾶν ῥῆμα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/016.yaml
  text: But if he does not listen[a], take one or two others with you[b], so that by the mouth of two or three witnesses every matter may be established.
translation:
  language: uk
  text: А якщо він не послухає, візьми з собою ще одного або двох, щоб устами двох чи трьох свідків[a] була встановлена кожна справа.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або, передаючи зміст вислову: «на підставі свідчень двох чи трьох свідків».'
    reason: lexical_alternative
  - marker: b
    text: Алюзія на Второзаконня 19:15, де справа має бути встановлена за свідченням двох або трьох свідків.
    reason: cross_reference
lexical_decisions:
- source_word: ἀκούσῃ
  choice: не послухає
  rationale: У цьому контексті дієслово означає не просто почути, а вислухати й зважити на сказане; «не послухає» природно передає відмову прислухатися.
- source_word: παράλαβε μετὰ σοῦ
  choice: візьми з собою
  rationale: Передає наказовий характер παράλαβε та значення супроводу в μετὰ σοῦ.
- source_word: ἔτι ἕνα ἢ δύο
  choice: ще одного або двох
  rationale: «Ще» передає додатковість ἔτι, а форма «одного або двох» у контексті однозначно вказує на додаткових людей.
- source_word: ἵνα
  choice: щоб
  rationale: Зберігає цільове значення сполучника та звучить природно сучасною українською.
- source_word: ἐπὶ στόματος δύο μαρτύρων ἢ τριῶν
  choice: устами двох чи трьох свідків
  rationale: Зберігає семітський юридичний зворот і виразну алюзію на Второзаконня 19:15; український вислів залишається зрозумілим.
- source_word: σταθῇ
  choice: була підтверджена
  rationale: У юридичному контексті пасивна форма означає, що справу встановлено або підтверджено свідченням; «була підтверджена» природніше за буквальне «стояла».
- source_word: πᾶν ῥῆμα
  choice: кожна справа
  rationale: Хоча буквально можливе «кожне слово», у формулі зі Второзаконня йдеться про справу, що потребує встановлення; «справа» зберігає юридичний обсяг, не звужуючи значення до конкретного обвинувачення.
theological_decisions:
- issue: Старозавітна юридична алюзія в контексті виправлення члена спільноти
  choice: Зберегти формулу «устами двох чи трьох свідків», а юридичний результат передати як підтвердження кожної справи.
  alternative: '«Щоб кожне слово стояло на устах двох чи трьох свідків» або динамічніше: «щоб кожне звинувачення підтвердили двоє чи троє свідків».'
  rationale: Обраний варіант відтворює алюзію на Второзаконня 19:15 і правовий характер вислову, але не звужує πᾶν ῥῆμα лише до звинувачення та не нав’язує конкретного конфесійного порядку дисципліни.
translation_notes:
  register: Сучасна нормативна українська мова з гідним, доступним звучанням. Біблійно-юридичний образ «устами свідків» навмисно збережено, а його зміст пояснено в примітці.
