  text: καὶ ὃς ⸀ἐὰν δέξηται ⸂ἓν παιδίον τοιοῦτο⸃ ἐπὶ τῷ ὀνόματί μου, ἐμὲ δέχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/005.yaml
  text: And whoever receives one such child in my name receives me[a][b].
translation:
  language: uk
  text: І хто прийме одну таку дитину в Моє ім’я, той приймає Мене.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «гостинно прийме». Грецьке дієслово може означати «прийняти», «гостинно зустріти» або «визнати».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «одну таку дитину»; у грецькому тексті цього вірша немає прикметника «малу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἐὰν
  choice: хто … той
  rationale: Неозначена відносна конструкція виражає загальну умову. Українська співвідносна конструкція «хто … той» природно й виразно передає значення «кожен, хто».
- source_word: δέξηται / δέχεται
  choice: прийме / приймає
  rationale: «Приймати» охоплює значення прийняття й гостинного прийому та зберігає важливий повтор того самого грецького дієслова в обох частинах речення.
- source_word: ἓν παιδίον τοιοῦτο
  choice: одну таку дитину
  rationale: Відтворює числівник ἓν і вказівну характеристику τοιοῦτο без додавання прикметника «малу», якого в цьому вірші немає.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: в Моє ім’я
  rationale: Усталений і природний український вислів, який зберігає можливі відтінки дії з огляду на ім’я, авторитет або належність до Ісуса, не звужуючи їх до одного.
- source_word: ἐμὲ
  choice: Мене
  rationale: Прямо передає наголошений займенник; паралель із повтореним дієсловом чітко виражає ототожнення прийняття дитини з прийняттям Ісуса.
theological_decisions:
- issue: Представницьке ототожнення дитини з Ісусом
  choice: Прийняти таку дитину в ім’я Ісуса означає прийняти самого Ісуса.
  alternative: Послабити вислів до значення «цим виявляє пошану Ісусові».
  rationale: Повтор δέχομαι зі зміною додатка з «однієї такої дитини» на «Мене» встановлює прямий зв’язок. Переклад зберігає його, не додаючи сакраментальних чи церковних висновків, яких текст не висловлює.
translation_notes:
  register: Сучасна літературна українська, природна й гідна за стилем. Повтор «прийме / приймає» навмисно збережено. Займенники, що стосуються Ісуса, подано з великої літери відповідно до поширеної української біблійної видавничої практики.
