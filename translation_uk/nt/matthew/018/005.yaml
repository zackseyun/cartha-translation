  verdict: approve
  source_fidelity: Текст точно передає грецьку конструкцію ὃς ἐὰν («хто … той»), числівник і характеристику ἓν παιδίον τοιοῦτο («одну таку дитину»), а також повтор дієслова δέχομαι через «прийме / приймає». Вислів «в Моє ім’я» адекватно відтворює ἐπὶ τῷ ὀνόματί μου, не звужуючи його значення до одного пояснення.
  naturalness: Фраза звучить природно в сучасній літературній українській і має належний біблійний регістр. Співвідносна модель «хто … той» є ясною та ідіоматичною. Різниця виду в «прийме / приймає» добре передає одноразову дію в умові й загальне твердження в головній частині.
  terminology: «Дитина» відповідає παιδίον без невиправданого додавання «мала». «Приймати» доречно зберігає лексичний повтор і представницький зв’язок між прийняттям дитини та Ісуса. Написання займенників з великої літери відповідає заявленій українській біблійній редакційній практиці.
