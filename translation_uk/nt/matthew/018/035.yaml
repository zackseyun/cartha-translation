review_pass:
  verdict: approve
  source_fidelity: «Так само й» adequately conveys the inferential application of the parable (Οὕτως καὶ). «Мій Небесний Отець» preserves both μου and οὐράνιος. «Учини́ть із вами» retains the deliberately broad ποιήσει ὑμῖν and its backward reference without importing a specific doctrinal outcome. The conditional, distributive «кожен із вас», masculine singular «свого брата», and idiomatic expression of heartfelt forgiveness are all faithful to the Greek sense.
  naturalness: The wording is fluent, normative modern Ukrainian with an appropriately elevated but accessible biblical register. «Від усього серця» is an established Ukrainian idiom and naturally expresses the inward sincerity required by ἀπὸ τῶν καρδιῶν ὑμῶν in a distributive construction.
  terminology: «Небесний Отець» and «простить» are standard, clear biblical Ukrainian terminology. The note responsibly explains the masculine singular «брат» without altering the source-shaped main text or imposing a theological interpretation.
