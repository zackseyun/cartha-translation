source:
  edition: SBLGNT
  text: Οὕτως καὶ ὁ πατήρ μου ὁ ⸀οὐράνιος ποιήσει ὑμῖν ἐὰν μὴ ἀφῆτε ἕκαστος τῷ ἀδελφῷ αὐτοῦ ἀπὸ τῶν καρδιῶν ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/035.yaml
  text: So also my heavenly Father will do to you[b][a], if each of you does not forgive his brother from your hearts.
translation:
  language: uk
  text: Так само й Мій Небесний Отець учинить із вами, якщо кожен із вас не простить свого брата від усього серця.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Брат» тут передає грецьке слово чоловічого роду в однині; у цьому контексті воно стосується кожного співучня або одновірця.
    reason: cultural_note
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: Так само й
  rationale: Природно вводить застосування попередньої притчі та зберігає порівняльно-висновковий зв’язок.
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: Мій Небесний Отець
  rationale: Передає присвійність і прикметник οὐράνιος; традиційне, зрозуміле й гідне українське формулювання.
- source_word: ποιήσει ὑμῖν
  choice: учинить із вами
  rationale: Зберігає широту ποιέω та відсилання до вчинку пана в притчі, не уточнюючи понад текст характер суду.
- source_word: ἐὰν μὴ
  choice: якщо ... не
  rationale: Прямо передає заперечну умову, не послаблюючи її сили.
- source_word: ἀφῆτε
  choice: простить
  rationale: У контексті міжособистісної провини й образу боргу ἀφίημι означає прощення.
- source_word: ἕκαστος
  choice: кожен із вас
  rationale: Природно виражає розподільний сенс однини щодо множинної аудиторії.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: свого брата
  rationale: Точно передає чоловічий рід і однину грецького вислову; у контексті брат має представницьке значення щодо співучня або одновірця.
- source_word: ἀπὸ τῶν καρδιῶν ὑμῶν
  choice: від усього серця
  rationale: Це природний сучасний український ідіом, що передає внутрішню щирість прощення; число в українській узгоджується розподільно з «кожен».
theological_decisions:
- issue: Обсяг і сила застереження
  choice: Пряме застереження про Божу відповідь, відповідну до дії пана в притчі
  alternative: Уточнити це як вічне засудження, втрату нагороди або загалом пом’якшити до «так само поставиться»
  rationale: Грецький текст містить сувору умовну пересторогу, але не визначає тут повної систематично-богословської категорії наслідку.
- issue: Чоловічий рід у ἀδελφῷ
  choice: свого брата
  alternative: свого брата чи сестру; ближнього; одновірця
  rationale: Основний текст зберігає граматично чоловічу однину джерела, а представницький контекстуальний сенс пояснено в примітці.
translation_notes:
  register: Сучасна нормативна українська з урочистим, але доступним біблійним регістром. «Від усього серця» обрано замість буквального «від ваших сердець» як природний український відповідник, що зберігає наголос на щирому внутрішньому прощенні.
