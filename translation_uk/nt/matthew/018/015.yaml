language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Ἐὰν δὲ ἁμαρτήσῃ ⸂εἰς σὲ⸃ ὁ ἀδελφός σου, ⸀ὕπαγε ἔλεγξον αὐτὸν μεταξὺ σοῦ καὶ αὐτοῦ μόνου. ἐάν σου ἀκούσῃ, ἐκέρδησας τὸν ἀδελφόν σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/015.yaml
  text: But if your brother sins against you[a], go and reprove him between you and him alone. If he listens to you[c][b], you have gained your brother.
translation:
  language: uk
  text: А якщо твій брат[b] згрішить проти тебе[a], піди й вкажи йому на його провину[c] наодинці. Якщо він послухає тебе, ти здобув свого брата.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'У деяких рукописах немає слів «проти тебе»: «Якщо твій брат згрішить…»'
    reason: textual_variant
  - marker: b
    text: Слово «брат» у грецькому тексті стоїть у чоловічому роді й однині; у цьому контексті воно може означати іншого учня.
    reason: lexical_alternative
  - marker: c
    text: 'Або: «викрий його».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτήσῃ
  choice: згрішить
  rationale: Аорист кон’юнктива після ἐὰν виражає загальну умову. «Згрішить» природно передає морально-релігійний зміст дієслова ἁμαρτάνω.
- source_word: εἰς σέ
  choice: проти тебе
  rationale: Прийменникова конструкція в цьому контексті вказує, що провина спрямована проти співрозмовника. Вона наявна в SBLGNT, а її текстову нестійкість зазначено у примітці.
- source_word: ὁ ἀδελφός σου
  choice: твій брат
  rationale: Збережено чоловічий рід та однину грецького вислову. У контексті йдеться про брата серед учнів, але ширше тлумачення не внесено безпосередньо до тексту.
- source_word: ὕπαγε
  choice: піди
  rationale: Стислий і природний відповідник наказової форми, що спонукає особисто звернутися до брата.
- source_word: ἔλεγξον
  choice: викрий
  rationale: Дієслово означає виявити провину та прямо вказати на неї. «Викрий» зберігає цю силу, не посилюючи її до різкого «осуди».
- source_word: μεταξὺ σοῦ καὶ αὐτοῦ μόνου
  choice: наодинці
  rationale: Українське «наодинці» природно й стисло передає приватність та винятковість розмови лише між двома особами.
- source_word: ἀκούσῃ
  choice: послухає тебе
  rationale: Передає не просто фізичне слухання, а прихильне прийняття сказаного, не звужуючи значення до безумовної покори.
- source_word: ἐκέρδησας
  choice: ти здобув
  rationale: Збережено метафору здобуття або виграшу в κερδαίνω. Варіант «повернув» природніший у деяких контекстах, але додає прямо не виражену думку про повернення.
theological_decisions:
- issue: Чи передавати ἀδελφός інклюзивно
  choice: твій брат
  alternative: твій брат або сестра; інший учень
  rationale: Основний текст зберігає граматично чоловічу форму однини. Можливе ширше контекстуальне застосування зазначено у примітці, а не вписано в переклад.
- issue: Текстовий статус εἰς σέ
  choice: включити «проти тебе» в основний текст
  alternative: «якщо твій брат згрішить» без слів «проти тебе»
  rationale: SBLGNT містить εἰς σέ. Оскільки коротший варіант істотно розширює можливу сферу настанови, його засвідчено в примітці без замовчування текстової невизначеності.
- issue: Метафора здобуття брата
  choice: ти здобув свого брата
  alternative: ти повернув свого брата
  rationale: «Здобув» зберігає метафору κερδαίνω і не визначає точніше, у якому саме сенсі брата було повернено чи відновлено.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. «Наодинці» вжито замість неприродного буквального відтворення «між тобою і ним одним»; зміст приватної розмови повністю збережено. «Викрий» має помірно формальний біблійний відтінок, але залишається зрозумілим сучасному читачеві.
