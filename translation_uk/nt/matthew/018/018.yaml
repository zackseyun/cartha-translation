source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὅσα ⸀ἐὰν δήσητε ἐπὶ τῆς γῆς ἔσται δεδεμένα ⸀ἐν οὐρανῷ καὶ ὅσα ἐὰν λύσητε ἐπὶ τῆς γῆς ἔσται λελυμένα ⸁ἐν οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/018.yaml
  text: Truly I tell you[a], whatever you bind on earth will have been bound in heaven, and whatever you loose on earth will have been loosed in heaven.
translation:
  language: uk
  text: 'Істинно кажу вам: усе, що ви зв’яжете на землі, буде вже зв’язане на небі, і все, що ви розв’яжете на землі, буде вже розв’язане на небі.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або, за традиційнішим перекладом: «буде зв’язане на небі… буде розв’язане на небі». Грецьку форму можна передати й так, однак вислів «буде вже» відображає поєднання майбутньої форми дієслова з перфектним дієприкметником, що може вказувати на стан, уже встановлений на небі.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: Істинно
  rationale: Передає урочисте запевнення, яким Ісус вводить авторитетне висловлювання; це природний і зрозумілий відповідник у сучасній українській біблійній мові.
- source_word: λέγω ὑμῖν
  choice: кажу вам
  rationale: Прямо й природно передає формулу мовлення та зберігає звернення у множині.
- source_word: ὅσα ἐὰν
  choice: усе, що
  rationale: Передає невизначено-узагальнювальне значення конструкції без неприродної буквальності.
- source_word: δήσητε
  choice: зв’яжете
  rationale: Зберігає основну метафору дієслова δέω та не звужує її завчасно до значення «забороните».
- source_word: ἐπὶ τῆς γῆς
  choice: на землі
  rationale: Природний український просторовий вислів, що зберігає протиставлення землі й неба.
- source_word: ἔσται δεδεμένα
  choice: буде вже зв’язане
  rationale: Майбутня форма εἰμί із перфектним пасивним дієприкметником описує майбутній стан як результат уже здійсненої дії. Частка «вже» виразно, але природно передає цю результативно-попередню семантику.
- source_word: ἐν οὐρανῷ
  choice: на небі
  rationale: У сучасній українській нормативно й природно говорити «на небі» про небесну сферу.
- source_word: λύσητε
  choice: розв’яжете
  rationale: Зберігає образну й лексичну протилежність до «зв’яжете», не обмежуючи значення лише дозволом або звільненням.
- source_word: ἔσται λελυμένα
  choice: буде вже розв’язане
  rationale: Відтворює майбутній стан, що є результатом попередньої дії, паралельно до ἔσται δεδεμένα.
theological_decisions:
- issue: Часова й богословська сила формули про зв’язування та розв’язування
  choice: «буде вже зв’язане / буде вже розв’язане на небі»
  alternative: «буде зв’язане / буде розв’язане на небі»
  rationale: Конструкція ἔσται з перфектним пасивним дієприкметником може вказувати на стан, уже встановлений на небі. Переклад зберігає цю часову напругу й не стверджує однозначно, що небо лише згодом затверджує земне рішення; водночас примітка подає традиційний граматично можливий варіант.
translation_notes:
  register: Сучасна стандартна українська мова, урочиста й доступна. Збережено традиційну парну метафору «зв’язати — розв’язати» та множинне «ви». Формула «буде вже» обрана як зрозумілий український спосіб передати можливе значення майбутнього перфекта без громіздкої конструкції.
