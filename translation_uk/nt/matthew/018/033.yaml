  text: οὐκ ἔδει καὶ σὲ ἐλεῆσαι τὸν σύνδουλόν σου, ὡς κἀγὼ σὲ ἠλέησα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/033.yaml
  text: Should you not also have had mercy on your fellow servant[a], as I also had mercy on you?
translation:
  language: uk
  text: Хіба тобі також не належало виявити милосердя до свого співраба[a], як і я виявив милосердя до тебе?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «співслугою». Грецьке слово σύνδουλος означає співраба — того, хто має того самого пана.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἔδει
  choice: Хіба ... не належало
  rationale: Безособове ἔδει виражає моральну належність або обов’язок; риторичне «Хіба ... не належало» природно передає докір.
- source_word: καὶ σὲ
  choice: й тобі
  rationale: καί додає адресата до відповідності між отриманим і очікуваним милосердям; давальний з інфінітивом природний в українській конструкції з «належало».
- source_word: ἐλεῆσαι / ἠλέησα
  choice: змилосердитися / змилосердився
  rationale: Однаковий український корінь зберігає лексичний повтор ἐλεάω та передає не лише жаль, а діяльне милосердя.
- source_word: τὸν σύνδουλόν σου
  choice: над своїм товаришем-рабом
  rationale: σύνδουλος позначає раба, який служить тому самому панові. «Товариш-раб» зберігає і спільність становища, і невільницький статус у контексті притчі.
- source_word: ὡς κἀγὼ
  choice: як і я
  rationale: Зворот стисло й природно зберігає порівняння та включальне καί у κἀγώ.
theological_decisions:
- issue: Передача слова σύνδουλος із групи δοῦλος
  choice: товариш-раб
  alternative: товариш-слуга; співраб
  rationale: У притчі важливе підлегле становище обох перед одним володарем. «Товариш-раб» не пом’якшує залежного статусу, водночас зрозуміло передаючи префікс σύν-; традиційніший варіант наведено в примітці.
translation_notes:
  register: Сучасна, гідна й зрозуміла українська мова. Риторичну силу докору збережено часткою «хіба», а повтор дієслова милосердя — спільним коренем «змилосердитися».
