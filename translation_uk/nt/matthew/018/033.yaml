- from: Хіба й тобі не належало змилосердитися над своїм товаришем-рабом[a], як і я змилосердився над тобою?
  to: Хіба тобі також не належало виявити милосердя до свого співраба[a], як і я виявив милосердя до тебе?
  rationale: The revision replaces the nonidiomatic «товариш-раб» with «співраб», preserving the Greek σύν- and δοῦλος components. It uses the repeated phrase «виявити милосердя» to represent the lexical repetition of ἐλεῆσαι / ἠλέησα and makes the correspondence expressed by καί and κἀγώ explicit with «також» and «як і я».
