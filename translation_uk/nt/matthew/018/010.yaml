id: MAT.18.10
reference: Matthew 18:10
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Ὁρᾶτε μὴ καταφρονήσητε ἑνὸς τῶν μικρῶν τούτων, λέγω γὰρ ὑμῖν ὅτι οἱ ἄγγελοι αὐτῶν ἐν οὐρανοῖς διὰ παντὸς βλέπουσι τὸ πρόσωπον τοῦ πατρός μου τοῦ ἐν ⸀οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/010.yaml
  text: See that you do not despise one of these little ones[c][b][a], for I tell you that their angels in heaven continually see the face of my Father who is in heaven.
translation:
  language: uk
  text: 'Стережіться, щоб не зневажити жодного з цих малих[a], бо кажу вам: їхні ангели[b] на небесах[c] завжди бачать обличчя Мого Отця, Який на небесах[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «не дивитися звисока на жодного з цих малих».'
    reason: lexical_alternative
  - marker: b
    text: Вислів «їхні ангели» може означати ангелів, пов’язаних із цими малими або таких, що їх представляють; сам цей вірш не визначає повного вчення про особистих ангелів-охоронців.
    reason: alternative_reading
  - marker: c
    text: 'Буквально грецькою: «на небесах»; обидва рази вжито форму множини.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁρᾶτε μὴ καταφρονήσητε
  choice: Стережіться, щоб не зневажити
  rationale: Ὁρᾶτε вводить застереження, а μή з аористним кон’юнктивом передає заборону. Формулювання природне українською й зберігає вагу καταφρονέω — ставитися з презирством або вважати незначущим.
- source_word: ἑνὸς τῶν μικρῶν τούτων
  choice: жодного з цих малих
  rationale: У заперечному реченні українське «жодного» природно передає грецьке «одного з». «Малих» не звужує значення лише до дітей і зберігає можливий відтінок малого віку чи становища.
- source_word: λέγω γὰρ ὑμῖν
  choice: бо кажу вам
  rationale: Прямо передає пояснювальне γάρ і усталену формулу λέγω ὑμῖν без зайвого розгортання.
- source_word: οἱ ἄγγελοι αὐτῶν
  choice: їхні ангели
  rationale: Збережено простий присвійний зв’язок без уточнення, чи йдеться про особистих ангелів-охоронців, представників або ангелів, пов’язаних із цими малими.
- source_word: ἐν οὐρανοῖς
  choice: на небесах
  rationale: Український біблійний і водночас природний відповідник грецької форми множини; тут не потрібно зводити її до однини.
- source_word: διὰ παντὸς
  choice: завжди
  rationale: Стисло й природно передає ідіому зі значенням постійності — «повсякчас», «безперестанку».
- source_word: βλέπουσι τὸ πρόσωπον
  choice: бачать обличчя
  rationale: Зберігає конкретний біблійний образ без заміни його тлумаченням на кшталт «мають доступ».
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: Мого Отця, Який на небесах
  rationale: Збережено виразну присвійність «Мого Отця» та наступне означення місця, не додаючи слова «Небесного» замість нього.
theological_decisions:
- issue: Значення вислову «їхні ангели»
  choice: Залишити буквальний вислів «їхні ангели», не визначаючи точного характеру їхнього зв’язку з малими.
  alternative: Витлумачити як особистих ангелів-охоронців, призначених кожній людині, або як ангелів, що представляють цих малих чи служать їм.
  rationale: Сам вірш стверджує цей зв’язок, але не пояснює його механізму й не встановлює повного вчення про ангелів-охоронців; буквальний переклад зберігає богословську відкритість тексту.
- issue: Кого названо «цими малими»
  choice: Передати як «ці малі», не звужуючи референт лише до дітей.
  alternative: Перекласти «ці малі діти» або однозначно ототожнити вислів лише з покірними віруючими.
  rationale: Контекст Матвія 18 включає дитину як наочний образ, але вислів може поширюватися на тих, хто упокорюється й належить Ісусові. Лаконічне «малі» зберігає цю широту.
translation_notes:
  register: Сучасна нормативна українська з гідним біблійним регістром. «Стережіться» передає силу застереження, «зневажити» — моральну вагу дієслова, а «ці малі» свідомо зберігає широту грецького вислову. Займенники щодо Бога подано з традиційної великої літери.
