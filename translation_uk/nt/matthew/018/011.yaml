lexical_decisions:
- source_word: σῴζω
  choice: спасти
  rationale: У цьому контексті дієслово означає визволити від загибелі; «спасти» є природним і усталеним українським відповідником у сотеріологічному контексті.
- source_word: τὸ ἀπολωλός
  choice: те, що загинуло
  rationale: Субстантивований перфектний активний дієприкметник середнього роду однини буквально позначає те, що опинилося в стані загибелі або втрати. Такий переклад зберігає граматичну форму й не звужує вислів лише до осіб.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Син Людський
  rationale: Усталений український відповідник титулу, який зберігає його біблійні асоціації та формальну структуру грецького вислову.
theological_decisions:
- issue: Референт середнього роду τὸ ἀπολωλός
  choice: те, що загинуло
  alternative: загиблих
  rationale: Грецький текст уживає середній рід однини, тому переклад не перетворює вислів на явно особовий множинний і зберігає широту та напруження формулювання.
translation_notes:
  register: Сучасна, dignified й зрозуміла українська мова. Сполучник «бо» природно передає γάρ; порядок слів зберігає наголос на місії Сина Людського. Маркер примітки поставлено після титулу відповідно до наданого консультаційного тексту, хоча примітка стосується всього вірша.
