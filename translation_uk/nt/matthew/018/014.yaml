  text: οὕτως οὐκ ἔστιν θέλημα ⸀ἔμπροσθεν τοῦ πατρὸς ⸀ὑμῶν τοῦ ἐν οὐρανοῖς ἵνα ἀπόληται ⸀ἓν τῶν μικρῶν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/014.yaml
  text: In the same way, it is not the will of your Father in heaven that even one of these little ones should perish.
translation:
  language: uk
  text: Так само й ваш Отець, Який на небі, не бажає, щоб загинув бодай один із цих малих.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «щоб загубився бодай один із цих малих». Грецьке дієслово може означати як «загинути», так і «загубитися»; безпосередній контекст загубленої вівці підтримує другий відтінок.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: Так само
  rationale: Природно пов’язує висновок із попередньою притчею та передає порівняльну силу вислову.
- source_word: οὐκ ἔστιν θέλημα ἔμπροσθεν τοῦ πατρὸς ὑμῶν
  choice: ваш Отець … не бажає
  rationale: Природний український відповідник ідіоми про те, чого немає у волі Отця; зміст θέλημα збережено дієслівною конструкцією без неприродного «немає волі перед».
- source_word: τοῦ ἐν οὐρανοῖς
  choice: Який на небі
  rationale: Передає означальний зворот і природно відтворює грецький множинний вислів οὐρανοῖς українським усталеним одниновим «на небі».
- source_word: ἵνα ἀπόληται
  choice: щоб загинув
  rationale: Передає серйозний наслідок дієслова ἀπόλλυμι, не усуваючи контекстуально можливого значення «загубився», поданого у примітці.
- source_word: ἓν τῶν μικρῶν τούτων
  choice: бодай один із цих малих
  rationale: «Бодай один» природно підкреслює заперечну мінімальність у контексті; «ці малі» не звужує значення лише до дітей.
theological_decisions:
- issue: Значення ἀπόληται у зв’язку з попередньою притчею про загублену вівцю
  choice: загинув
  alternative: загубився
  rationale: Основний текст зберігає сильний відтінок загибелі, а примітка засвідчує контекстуальний відтінок втрати, не вирішуючи богословську напругу однозначно.
- issue: Референт τῶν μικρῶν τούτων
  choice: цих малих
  alternative: цих малих дітей
  rationale: Грецький вислів у контексті може стосуватися не лише дітей, а й малих або вразливих учнів; ширше формулювання не звужує референта.
translation_notes:
  register: Сучасна стандартна українська, ясний і гідний біблійний стиль. Дієслівна конструкція «Отець … не бажає» усуває неприродну кальку, не змінюючи змісту; написання «Отець, Який» відповідає шанобливій традиції.
