base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/013.yaml
  text: And if he happens to find it[a], truly I tell you[b], he rejoices over it more than over the ninety-nine that have not gone astray.
translation:
  language: uk
  text: 'І якщо трапиться, що він її знайде[a], істинно кажу вам: він радіє з неї більше, ніж із дев’яноста дев’ятьох, які не заблукали[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або простіше: «якщо він її знайде».'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «які не збилися зі шляху».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: І
  rationale: Збережено простий сполучник, що продовжує хід Ісусової притчі.
- source_word: ἐὰν γένηται εὑρεῖν αὐτό
  choice: якщо станеться так, що він її знайде
  rationale: Передає умовність і виразний відтінок настання події в конструкції ἐὰν + γένηται + інфінітив, не зводячи її до простого «якщо знайде».
- source_word: ἀμὴν λέγω ὑμῖν
  choice: істинно кажу вам
  rationale: Природна й урочиста сучасна українська форма, що зберігає підсилювальну силу характерної Ісусової формули.
- source_word: χαίρει ἐπ’ αὐτῷ
  choice: радіє з неї
  rationale: Дієслово «радіє» передає сильний позитивний відгук χαίρει, а нормативна конструкція «радіти з когось/чогось» позначає об’єкт радості.
- source_word: μᾶλλον ἢ
  choice: більше, ніж
  rationale: Прямо відтворює справжнє порівняння, не створюючи враження виключення, яке могло б виникнути від «а не».
- source_word: τοῖς ἐνενήκοντα ἐννέα
  choice: із дев’яноста дев’ятьох
  rationale: Слово «овець» не повторено, оскільки в грецькому тексті іменник тут мається на увазі з контексту; українська форма залишається зрозумілою в межах притчі.
- source_word: τοῖς μὴ πεπλανημένοις
  choice: які не заблукали
  rationale: 'Передає результативний стан перфектного дієприкметника: ці вівці не збилися з належного шляху.'
theological_decisions:
- issue: Сила порівняння радості пастуха
  choice: Збережено твердження, що пастух радіє зі знайденої вівці більше, ніж із дев’яноста дев’ятьох, які не заблукали.
  alternative: Пом’якшити порівняння, щоб воно не звучало як надання переваги одній вівці, або витлумачити його як меншу цінність дев’яноста дев’ятьох.
  rationale: Грецьке μᾶλλον ἢ виражає реальне порівняння. Переклад зберігає напруження вислову, не роблячи висновку, ніби пастух не дбає про інших або вважає їх менш цінними.
translation_notes:
  register: Сучасна стандартна українська мова з гідним, виразним біблійним звучанням. Займенник жіночого роду «її» узгоджено з контекстуальною «вівцею». Формулу «істинно кажу вам» збережено урочистою, але зрозумілою; порівняння не пом’якшено і не витлумачено понад грецький текст.
