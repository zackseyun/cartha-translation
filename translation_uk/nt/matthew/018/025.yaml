  text: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι ἐκέλευσεν αὐτὸν ὁ ⸀κύριος πραθῆναι καὶ τὴν ⸀γυναῖκα καὶ τὰ τέκνα καὶ πάντα ὅσα ⸀ἔχει καὶ ἀποδοθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/025.yaml
  text: But since he was unable to repay[a], the master ordered that he be sold, along with his wife and children and all that he had[b], and that payment be made.
translation:
  language: uk
  text: А оскільки він не мав чим сплатити, господар[a] наказав, щоб його, його дружину, дітей і все, що він мав[b], продали та щоб було сплачено належне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «пан». Грецьке κύριος тут означає господаря слуги в межах притчі.
    reason: lexical_alternative
  - marker: b
    text: Тобто боржника, його родину й майно мали продати, щоб здійснити виплату.
    reason: cultural_note
lexical_decisions:
- source_word: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι
  choice: А оскільки він не мав чим сплатити
  rationale: Родовий абсолют передає обставину з причинним відтінком. Вислів «не мав чим сплатити» природно передає відсутність у боржника засобів для виплати, не звужуючи зміст до повної відсутності будь-якого майна.
- source_word: ἐκέλευσεν
  choice: наказав
  rationale: Дієслово κελεύω означає владно розпорядитися або наказати; «наказав» є точним і сучасним відповідником.
- source_word: ὁ κύριος
  choice: господар
  rationale: У межах притчі κύριος позначає людського пана, якому підлеглий слуга. «Господар» природно передає ці відносини й не створює враження, ніби тут ужито безпосередній Божий титул.
- source_word: πραθῆναι
  choice: продати його
  rationale: Пасивний інфінітив від πιπράσκω означає віддати когось на продаж; українська конструкція після «наказав» природно вживає активний інфінітив із додатком.
- source_word: τὴν γυναῖκα καὶ τὰ τέκνα
  choice: його дружину й дітей
  rationale: Означені артиклі в контексті вказують на родину боржника; присвійний займенник при «дружину» робить цей зв’язок виразним без неприродного повторення.
- source_word: πάντα ὅσα ἔχει
  choice: все, що він мав
  rationale: Фраза охоплює все його майно. Минулий час узгоджується з українською оповідною перспективою, хоча грецький текст має історичний теперішній час.
- source_word: καὶ ἀποδοθῆναι
  choice: і сплатити належне
  rationale: Другий пасивний інфінітив ἀποδίδωμι стосується виплати належної суми. «Належне» зберігає невиражений у грецькому тексті об’єкт і не додає окремого слова «борг».
theological_decisions:
- issue: Значення κύριος у притчі
  choice: господар
  alternative: пан; володар; Господь
  rationale: Тут слово називає людського господаря слуги в сюжеті притчі. Написання й переклад як прямого титулу «Господь» завчасно ототожнювали б персонажа з Богом; «господар» зберігає сюжетний рівень, не заперечуючи образного богословського значення притчі.
- issue: Характер неспроможності боржника
  choice: не мав чим сплатити
  alternative: не міг сплатити; не мав нічого, щоб віддати
  rationale: Грецький вислів буквально вказує, що він не мав засобів віддати належне. Обраний варіант передає фінансову неспроможність, але не стверджує абсолютної відсутності майна, адже далі згадано все, що він мав.
translation_notes:
  register: Сучасна літературна українська мова з гідним оповідним тоном. Синтаксис залишається близьким до послідовності грецького речення, але пристосований до природного українського слововживання. Маркери [a] і [b] розміщено безпосередньо біля пояснюваних висловів.
