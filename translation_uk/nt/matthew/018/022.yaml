id: MAT.18.22
reference: Matthew 18:22
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Οὐ λέγω σοι ἕως ἑπτάκις ἀλλὰ ἕως ἑβδομηκοντάκις ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/022.yaml
  text: Jesus says to him[a], “I do not say to you, up to seven times, but up to seventy times seven.
translation:
  language: uk
  text: 'Ісус каже йому: «Не кажу тобі: до семи разів, а до сімдесяти семи разів[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «сімдесят разів по сім».'
    reason: Альтернативне прочитання неоднозначного грецького вислову ἑβδομηκοντάκις ἑπτά.
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Ісус каже йому
  rationale: Збережено грецький історичний теперішній час і займенниковий непрямий додаток; такий виклад природний і виразний українською.
- source_word: Οὐ λέγω σοι
  choice: Не кажу тобі
  rationale: Прямо передає теперішній час дієслова та давальний відмінок займенника без зайвого тлумачення.
- source_word: ἕως ἑπτάκις
  choice: до семи разів
  rationale: У контексті лічби ἕως позначає межу, а ἑπτάκις — частотність; «до семи разів» є точним і природним відповідником.
- source_word: ἀλλὰ
  choice: а
  rationale: Український сполучник «а» природно виражає тут протиставлення двох числових меж.
- source_word: ἕως ἑβδομηκοντάκις ἑπτά
  choice: до сімдесяти семи разів
  rationale: Фраза допускає розуміння як «сімдесят сім разів» або «сімдесят разів по сім». У основному тексті обрано перше прочитання, а друге збережено в примітці.
theological_decisions:
- issue: Неоднозначний числовий вислів у настанові Ісуса про прощення
  choice: сімдесят сім разів
  alternative: сімдесят разів по сім
  rationale: Грецьке ἑβδομηκοντάκις ἑπτά синтаксично неоднозначне. Основний текст подає природне прочитання «сімдесят сім», не перетворюючи число на богословське пояснення; традиційний альтернативний варіант наведено в примітці.
translation_notes:
  register: Сучасна стандартна українська мова; виклад стислий, гідний і зрозумілий. Історичний теперішній час збережено. Двокрапка після «тобі» природно вводить названі межі, а примітка прозоро зберігає числову неоднозначність оригіналу.
