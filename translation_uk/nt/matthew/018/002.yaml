lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: покликавши
  rationale: 'Дієприкметник аориста передає попередню дію: Ісус покликав дитину, а потім поставив її перед учнями. Додавати «до себе» не обов’язково, оскільки це лише імпліцитно міститься у префіксі προσ-.'
- source_word: παιδίον
  choice: дитину
  rationale: Природний сучасний відповідник, який не уточнює ані статі, ані точного віку дитини.
- source_word: ἔστησεν
  choice: поставив
  rationale: Перехідна форма означає, що він зробив так, аби дитина стала в певному місці; українське «поставив» природно й точно передає цей каузативний зміст.
- source_word: ἐν μέσῳ αὐτῶν
  choice: посеред них
  rationale: 'Стислий і природний відповідник просторового вислову: дитину поставлено серед присутніх учнів.'
theological_decisions: []
translation_notes:
  register: Сучасна стандартна українська; простий, гідний оповідний стиль. Займенник «він» збережено відповідно до грецького дієслова й контексту, без додавання імені Ісуса, якого в цьому вірші прямо не названо.
