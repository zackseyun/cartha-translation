reference: Matthew 18:7
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: οὐαὶ τῷ κόσμῳ ἀπὸ τῶν σκανδάλων· ἀνάγκη ⸀γὰρ ἐλθεῖν τὰ σκάνδαλα, πλὴν οὐαὶ τῷ ⸀ἀνθρώπῳ δι’ οὗ τὸ σκάνδαλον ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/007.yaml
  text: Woe to the world because of stumbling blocks[a]; for it is necessary that the stumbling blocks come[b], but woe to the man through whom the stumbling block comes.
translation:
  language: uk
  text: Горе світові через те, що спричиняє падіння[a], бо воно неминуче має прийти; та горе людині[b], через яку приходить те, що спричиняє падіння!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «камені спотикання», «перешкоди», «пастки» чи «приводи до гріха». Грецьке σκάνδαλον/σκάνδαλα означає те, що змушує людину спіткнутися або впасти — через образу, зваблення чи нагоду згрішити.
    reason: lexical_alternative
  - marker: b
    text: Грецьке слово стоїть в однині й граматично належить до чоловічого роду, але тут означає будь-яку окрему людину, через яку приходить те, що спричиняє падіння.
    reason: cultural_note
lexical_decisions:
- source_word: οὐαί
  choice: горе
  rationale: Зберігає пророчий і судовий характер вигуку та його повтор у двох частинах вірша.
- source_word: κόσμῳ
  choice: світові
  rationale: Природно передає широкий зміст κόσμος — людський світ, у якому діють спокуси, не звужуючи значення до фізичного творіння.
- source_word: ἀπὸ
  choice: через
  rationale: У цьому контексті прийменник виражає причину лиха; «через» є природним причинним відповідником українською.
- source_word: σκάνδαλα / σκάνδαλον
  choice: спокуси / спокуса
  rationale: Українське «спокуса» стисло передає те, що підштовхує до гріха або падіння; примітка зберігає ширший образний діапазон грецького слова. Розрізнення множини й однини збережено.
- source_word: ἀνάγκη
  choice: необхідно
  rationale: Передає безособове твердження про необхідність, не визначаючи, чи йдеться про Божу постанову, логічну потребу або неминучість у занепалому світі.
- source_word: γάρ
  choice: бо
  rationale: Природно вводить пояснення попереднього проголошення горя.
- source_word: ἐλθεῖν ... ἔρχεται
  choice: прийти ... приходить
  rationale: Зберігає лексичний повтор і конкретний образ руху, наявні в грецькому тексті.
- source_word: πλήν
  choice: та
  rationale: Позначає виразний протиставний перехід від необхідності появи спокус до особистої відповідальності того, через кого вони приходять.
- source_word: ἀνθρώπῳ
  choice: людині
  rationale: Ἄνθρωπος означає людську особу й у цьому контексті має узагальнювальний зміст. Українське «людина» точно й природно передає цей зміст, не створюючи необґрунтованого враження, ніби застереження стосується лише чоловіків.
- source_word: δι’ οὗ
  choice: через яку
  rationale: Передає особу як посередника або причетного діяча, через якого спокуса приходить; форма узгоджена з українським іменником «людина».
theological_decisions:
- issue: Характер необхідності у вислові ἀνάγκη γὰρ ἐλθεῖν τὰ σκάνδαλα
  choice: Збережено пряме твердження «спокусам необхідно прийти» без пояснення джерела цієї необхідності.
  alternative: «Спокуси неодмінно прийдуть» або «спокуси мусять прийти».
  rationale: Грецький текст стверджує необхідність, але не називає її підстави. Переклад не приписує Богові безпосереднього спричинення спокус і водночас не послаблює вислів до простої ймовірності.
- issue: Узагальнювальне значення ἀνθρώπῳ
  choice: Вжито «людині», а приміткою уточнено одиничну й узагальнювальну форму.
  alternative: «чоловікові» або «тому, через кого».
  rationale: Грецький іменник граматично чоловічого роду й стоїть в однині, але лексично може означати будь-яку людину. Українське «чоловік» могло б невиправдано звузити застереження до осіб чоловічої статі.
translation_notes:
  register: Сучасна, зрозуміла й урочиста українська мова. Повтор «горе» та «прийти / приходить» збережено для риторичної симетрії; традиційне «спокуса» супроводжено приміткою, щоб не звужувати багатозначність σκάνδαλον.
