    issue: «Спокуси» is too narrow for σκάνδαλα / σκάνδαλον in the main text.
    rationale: In modern Ukrainian, «спокуса» predominantly means an enticement or temptation. The Greek term also includes a stumbling block, offense, or other occasion that causes a person to fall. The existing note identifies this breadth, but the main rendering should not foreground only one narrower component.
  - severity: low
    issue: «Спокусам необхідно прийти» is stylistically stiff.
    rationale: The impersonal construction is grammatically possible, but «спокуси неминуче мають прийти» is more natural Ukrainian and continues to state necessity without specifying its source.
