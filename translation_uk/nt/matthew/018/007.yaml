  source_fidelity: 'The draft preserves the twofold «горе», the causal force of ἀπό, the plural/singular distinction, the unqualified necessity, and the personal accountability expressed by δι’ οὗ. However, «спокуси» ordinarily denotes temptations or enticements in modern Ukrainian and can obscure the wider force of σκάνδαλα: occasions, obstacles, or agents that cause someone to fall or take offense. A broader rendering is warranted in the main text.'
  naturalness: «Спокусам необхідно прийти» is understandable but somewhat bureaucratic and less idiomatic than «спокуси неминуче мають прийти». The revised wording remains solemn, clear, and contemporary while retaining the Greek repetition of ‘come.’
  terminology: «Те, що спричиняє падіння» conveys the operative, broad metaphor of σκάνδαλον without restricting it to sexual or moral temptation. «Людині» is a natural and accurate Ukrainian rendering of the representative singular ἀνθρώπῳ; the note appropriately records the Greek grammatical form without making the warning male-exclusive.
