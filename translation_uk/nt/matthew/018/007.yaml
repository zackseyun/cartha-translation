- from: Горе світові через спокуси[a], бо спокусам необхідно прийти. Та горе людині[b], через яку приходить спокуса!
  to: Горе світові через те, що спричиняє падіння[a], бо воно неминуче має прийти; та горе людині[b], через яку приходить те, що спричиняє падіння!
  rationale: The revision replaces the narrower «спокуси» with a broad, intelligible Ukrainian expression that represents the semantic range of σκάνδαλον without resolving whether the stumbling is offense, enticement, or an occasion for sin. The same expression is repeated in singular and plural-reference contexts through «воно» and the final singular phrase, preserving the Greek rhetorical linkage. «Неминуче має прийти» renders ἀνάγκη … ἐλθεῖν as necessity while leaving its basis unstated. The semicolon and «та» reflect the strong adversative transition marked by πλήν.
