base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/021.yaml
  text: Then Peter came up to him and said[a], “Lord, how many times will my brother sin against me, and I forgive him? Up to seven times?”
translation:
  language: uk
  text: 'Тоді Петро підійшов до Нього й сказав: «Господи, скільки разів мій брат[a] грішитиме проти мене, і я прощатиму йому? До семи разів?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «мій брат чи сестра»; у грецькому тексті буквально «мій брат» (чоловічий рід, однина), але в цьому контексті вислів може ширше означати іншого учня.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Тоді
  rationale: Природний український часово-послідовний маркер, що зберігає плин розповіді.
- source_word: προσελθὼν αὐτῷ ὁ Πέτρος εἶπεν
  choice: Петро підійшов до Нього й сказав
  rationale: Передає наближення Петра до Ісуса та нейтральне дієслово мовлення; займенник написано з великої літери згідно з усталеною українською біблійною традицією шанобливого позначення Ісуса.
- source_word: Κύριε
  choice: Господи
  rationale: Усталена клична форма κύριος у звертанні до Ісуса, що зберігає і шанобливість, і можливий богословський відтінок.
- source_word: ποσάκις
  choice: скільки разів
  rationale: Точно виражає числову частотність і природно співвідноситься з подальшим «до семи разів».
- source_word: ἁμαρτήσει εἰς ἐμὲ
  choice: грішитиме проти мене
  rationale: Зберігає майбутній час і спрямованість провини проти Петра.
- source_word: ὁ ἀδελφός μου
  choice: мій брат
  rationale: Безпосередньо передає чоловічий рід та однину грецького вислову, не розширюючи його тлумачно в основному тексті.
- source_word: καὶ ἀφήσω αὐτῷ
  choice: а я прощатиму йому
  rationale: Недоконаний майбутній вид природно передає повторювану дію в запитанні про кількість разів; «а» виразно пов’язує гріх брата з повторним прощенням, не змінюючи смислового відношення.
- source_word: ἕως ἑπτάκις
  choice: Аж до семи разів?
  rationale: Передає запропоновану Петром верхню межу; «аж» природно відбиває відтінок значної, на його думку, кількості.
theological_decisions:
- issue: Обсяг значення ἀδελφός у контексті
  choice: В основному тексті вжито «мій брат».
  alternative: «мій брат або сестра»; «інший учень»; «одновірець»
  rationale: Грецький текст має форму чоловічого роду в однині, яка в контексті може ширше стосуватися іншого учня. Форму джерела збережено в тексті, а можливий ширший обсяг значення зазначено у примітці.
- issue: Видо-часове значення ἁμαρτήσει та ἀφήσω в запитанні про повторюваність
  choice: «грішитиме … а я прощатиму»
  alternative: «згрішить … і я прощу»; «грішить … і я прощаю»
  rationale: Форми майбутнього часу збережено, а український недоконаний вид природно виражає не один випадок, а повторювану ситуацію, про яку запитує Петро.
translation_notes:
  register: Сучасна літературна українська мова з гідним, доступним біблійним регістром. Побудова запитання збережена близькою до грецької, але оформлена природно для українського читача.
