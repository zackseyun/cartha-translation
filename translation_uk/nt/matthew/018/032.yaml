base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/032.yaml
  text: Then his master summoned him and said to him[a], ‘Wicked servant[b], I forgave you all that debt because you pleaded with me.’
translation:
  language: uk
  text: 'Тоді пан покликав його до себе та сказав йому: «Злий рабе[a], я простив[b] тобі весь той борг, бо ти благав мене».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «злий слуго». Грецьке слово δοῦλος може означати раба або слугу; тут «раб» підкреслює підневільні відносини з паном.
    reason: lexical_alternative
  - marker: b
    text: Або «я скасував тобі весь той борг» чи «я списав тобі весь той борг». Грецьке дієслово може означати як прощати, так і звільняти від боргу.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Тоді
  rationale: Природний український часовий сполучник, що продовжує послідовність подій у притчі.
- source_word: προσκαλεσάμενος
  choice: покликав його до себе
  rationale: Середній стан дієслова передає виклик людини до себе; цей вислів природний українською й зберігає владну ініціативу пана.
- source_word: ὁ κύριος αὐτοῦ
  choice: його пан
  rationale: У контексті притчі κύριος позначає пана раба, а не є божественним титулом.
- source_word: λέγει αὐτῷ
  choice: сказав
  rationale: Грецький історичний теперішній час природно передано українським минулим часом у розповіді.
- source_word: Δοῦλε πονηρέ
  choice: Злий рабе
  rationale: Раб точно передає підневільний статус у стосунках із паном, а злий виражає моральний осуд πονηρός без додавання значення хитрості.
- source_word: πᾶσαν τὴν ὀφειλὴν ἐκείνην
  choice: весь той борг
  rationale: Стислий і природний відповідник, який передає повноту списаного боргу та вказівне значення ἐκείνην.
- source_word: ἀφῆκά σοι
  choice: я простив тобі
  rationale: Зберігає навмисний зв’язок між прощенням і скасуванням боргу в образній мові Матвія.
- source_word: ἐπεὶ
  choice: бо
  rationale: Природно й ясно вводить причину в сучасній українській мові.
- source_word: παρεκάλεσάς με
  choice: ти благав мене
  rationale: Передає наполегливе особисте прохання боржника.
theological_decisions:
- issue: Передача δοῦλος у притчі про відносини пана й підневільної людини
  choice: раб
  alternative: слуга
  rationale: Економічна та правова залежність персонажа від пана істотна для притчі; слово «слуга» могло б послабити цей аспект. Примітка зберігає ширший лексичний діапазон грецького слова.
- issue: Передача ἀφίημι в контексті боргу
  choice: простив
  alternative: скасував / списав
  rationale: Безпосередньо йдеться про звільнення від боргу, але дієслово водночас пов’язує фінансовий образ із темою прощення. Основний текст зберігає цю богословську напругу, а примітка пояснює буквальний борговий відтінок.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська оповідна мова. Форми «пане/рабе» не стилізовано під церковнослов’янську; «рабе» є нормативним кличним відмінком. Побудова речення зберігає пряму й сувору тональність слів пана.
