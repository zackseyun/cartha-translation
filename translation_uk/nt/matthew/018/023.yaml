  verdict: revise
  source_fidelity: The translation accurately conveys the inferential Διὰ τοῦτο, the Matthean expression «Царство Небесне», the passive comparative force of ὡμοιώθη, the king, and the slaves (δούλοι). «Звести рахунки зі своїми рабами», however, has a prominent modern Ukrainian idiomatic sense of taking revenge on someone and can obscure the financial-accounting sense of συνᾶραι λόγον.
  naturalness: The register is otherwise clear, modern, and appropriately elevated. Replacing the potentially misleading idiom with «провести розрахунок» makes the accounting action explicit without adding interpretation.
  terminology: «Царство Небесне» is a suitable conventional Ukrainian rendering. «Раби» correctly retains the bonded status denoted by δούλοι in this royal-economic parable. The footnotes are correctly anchored and preserve relevant lexical alternatives.
  issues:
  - severity: medium
    issue: «Звести рахунки зі своїми рабами» is idiomatically ambiguous.
    rationale: In current Ukrainian, «звести рахунки з кимось» often means to retaliate against or kill someone. Although an accounting meaning is possible, the wording can misdirect readers away from the Greek financial reckoning idiom συνᾶραι λόγον.
