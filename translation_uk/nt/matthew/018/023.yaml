id: MAT.18.23
reference: Matthew 18:23
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Διὰ τοῦτο ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ βασιλεῖ ὃς ἠθέλησεν συνᾶραι λόγον μετὰ τῶν δούλων αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/023.yaml
  text: For this reason the kingdom of heaven has become like a king who wanted to settle accounts with his servants[a][b].
translation:
  language: uk
  text: Тому Царство Небесне було уподібнене до царя[a], який захотів провести розрахунок зі своїми рабами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «стало подібним до» чи «було порівняне з».'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «слугами» чи «невільниками»; грецьке δοῦλοι означає рабів і наголошує на їхньому підвладному становищі щодо царя.'
    reason: alternative_reading
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Тому
  rationale: Стисло й природно передає причинно-висновковий зв’язок із попереднім повчанням.
- source_word: ὡμοιώθη
  choice: було уподібнене до
  rationale: Зберігає пасивну форму аориста ὁμοιόω та виразно вводить порівняння.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Царство Небесне
  rationale: Усталений і природний український відповідник характерного для Матвія вислову про Боже царювання.
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: до царя
  rationale: βασιλεῖ уточнює ἀνθρώπῳ; в українській мові достатньо природного «царя», без громіздкого «людини-царя».
- source_word: ἠθέλησεν
  choice: захотів
  rationale: Безпосередньо передає волю або намір царя в сучасній оповідній мові.
- source_word: συνᾶραι λόγον
  choice: звести рахунки
  rationale: 'Передає фінансово-судовий зміст ідіоми: перевірити належне та здійснити розрахунок.'
- source_word: μετὰ τῶν δούλων αὐτοῦ
  choice: зі своїми рабами
  rationale: «Рабами» прозоро передає δοῦλοι та їхнє підвладне, невільне становище щодо царя; присвійний займенник природно відтворює αὐτοῦ.
theological_decisions:
- issue: Передача δοῦλος у царсько-господарському контексті притчі
  choice: раби
  alternative: слуги; невільники
  rationale: Влада царя, борги й подальша можливість продажу роблять невільний статус персонажів контекстуально важливим. Варіант «слуги» звучить м’якше, але може приховати цей аспект.
- issue: Пасивна форма ὡμοιώθη
  choice: було уподібнене до
  alternative: подібне до; можна порівняти з
  rationale: Обрано формальніше пасивне відтворення, щоб не згладжувати граматичну форму джерела й не визначати явно того, хто здійснює порівняння.
translation_notes:
  register: Сучасна, зрозуміла й гідна оповідна українська. Усталений вислів «Царство Небесне» поєднано з формально точним пасивом «було уподібнене»; економічну метафору збережено без додаткового тлумачення.
