  text: ἐξελθὼν δὲ ὁ δοῦλος ἐκεῖνος εὗρεν ἕνα τῶν συνδούλων αὐτοῦ ὃς ὤφειλεν αὐτῷ ἑκατὸν δηνάρια, καὶ κρατήσας αὐτὸν ἔπνιγεν λέγων· ⸀Ἀπόδος εἴ τι ὀφείλεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/028.yaml
  text: But when that servant went out[a], he found one of his fellow servants who owed him a hundred denarii, and seizing him, he began choking him, saying[b], ‘Pay back whatever you owe.’
translation:
  language: uk
  text: 'Але той раб, вийшовши, знайшов одного зі своїх співрабів, який був винен йому сто динаріїв[a]. Схопивши його, він душив його, кажучи: «Віддай усе, що ти винен!»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Динарій був звичайною платою за день праці найманого робітника або воїна.
    reason: cultural_note
  - marker: b
    text: 'Буквальніше: «Віддай, якщо щось винен».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: раб
  rationale: Передає юридично й соціально залежне становище персонажа та не пом’якшує владних відносин у притчі.
- source_word: ἐξελθὼν δὲ
  choice: Але той раб, вийшовши
  rationale: Природно передає аористовий дієприкметник і перехід δέ, зберігаючи часову послідовність.
- source_word: συνδούλων
  choice: співрабів
  rationale: Зберігає значення префікса σύν- і послідовно відтворює δοῦλος як «раб».
- source_word: ὤφειλεν
  choice: був винен
  rationale: Звичний сучасний український вислів для грошового боргу.
- source_word: ἑκατὸν δηνάρια
  choice: сто динаріїв
  rationale: Зберігає історичну назву грошової одиниці й важливий для притчі контраст між розмірами боргів.
- source_word: κρατήσας
  choice: схопивши
  rationale: Передає різку й насильницьку фізичну дію.
- source_word: ἔπνιγεν
  choice: став душити
  rationale: Передає початок і тривалість дії, виражені імперфектом.
- source_word: Ἀπόδος
  choice: Віддай
  rationale: Різкий наказ у контексті стягнення боргу; українське «віддай» природно охоплює повернення належного.
- source_word: εἴ τι ὀφείλεις
  choice: усе, що винен
  rationale: Природно передає в погрозливій вимозі невизначене «якщо щось / що б ти не був винен»; формальнішу будову збережено в примітці.
theological_decisions:
- issue: Відтворення δοῦλος у тексті притчі
  choice: раб / співраби
  alternative: слуга / товариші-слуги
  rationale: У цьому епізоді істотні підневільний статус, влада господаря та насильницький примус, тому «раб» точніше відбиває соціальну реальність оповіді без конфесійного тлумачення.
- issue: Невизначеність вислову εἴ τι ὀφείλεις
  choice: усе, що винен
  alternative: якщо щось винен
  rationale: Основний текст має природну українську вимогу, а примітка зберігає формальну умовну будову грецького вислову, не приховуючи його неоднозначності.
translation_notes:
  register: Сучасна нормативна українська мова з гідним оповідним тоном. Діалог навмисно короткий і різкий; історичний термін «динарій» збережено та пояснено в примітці.
