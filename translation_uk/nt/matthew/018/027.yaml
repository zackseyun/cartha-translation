  text: σπλαγχνισθεὶς δὲ ὁ κύριος τοῦ δούλου ἐκείνου ἀπέλυσεν αὐτόν, καὶ τὸ δάνειον ἀφῆκεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/027.yaml
  text: Then the master of that servant[a], moved with compassion[b], released him and forgave him the debt.
translation:
  language: uk
  text: Тоді пан[a] того раба, змилосердившись, відпустив його й простив йому борг[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Грецьке κύριος тут означає людського пана раба в притчі; можливий переклад: «господар».'
    reason: lexical_alternative
  - marker: b
    text: Грецький іменник точніше означає «позику» або «позичене»; у цьому контексті йдеться про борг, що виник із позики.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: змилосердившись
  rationale: Дієприкметникова форма передає глибоке співчуття, що спонукало пана до подальшої дії; українське «змилосердившись» природне в цій оповіді й зберігає емоційну силу слова.
- source_word: δὲ
  choice: Тоді
  rationale: У цьому контексті δέ позначає перехід до наступного кроку оповіді; «тоді» природно передає послідовність подій.
- source_word: κύριος
  choice: пан
  rationale: Йдеться про людського пана раба в притчі, а не про прямий Божий титул. «Пан» природно передає владне становище персонажа без надмірної богословської конкретизації.
- source_word: δοῦλου
  choice: раба
  rationale: У контексті виразно присутні підлеглість і залежний статус, тому «раб» точніше за м’якше «слуга».
- source_word: ἀπέλυσεν αὐτόν
  choice: відпустив його
  rationale: Вислів означає, що пан дозволив йому піти, звільнивши від негайного затримання чи покарання; «відпустив його» не уточнює понад сказане, чи йдеться про повне звільнення з рабства.
- source_word: τὸ δάνειον
  choice: борг
  rationale: Буквально іменник позначає позику або позичене, але разом із ἀφῆκεν у цьому контексті йдеться про скасування зобов’язання повернути її. Українське «борг» природно називає це зобов’язання; точніший буквальний відтінок зазначено у примітці.
- source_word: ἀφῆκεν αὐτῷ
  choice: простив йому
  rationale: ἀφίημι може означати відпустити, простити або скасувати. З додатком «борг» вислів природно передає прощення, тобто скасування фінансового зобов’язання, і зберігає словесний зв’язок із темою прощення в Євангелії від Матвія.
theological_decisions:
- issue: Можливе прочитання κύριος як Божого титулу
  choice: «пан» як назва людського господаря в межах притчі
  alternative: «Господь» або «господар»
  rationale: Безпосереднім референтом є пан раба. Переклад не перетворює персонажа на прямий Божий титул, але й не усуває ширшої богословської аналогії притчі.
- issue: Соціальний статус δοῦλος
  choice: «раб»
  alternative: «слуга» або «невільник»
  rationale: Ієрархічна залежність персонажа суттєва для сцени боргу, влади й милості, тому конкретне «раб» доречніше за пом’якшене «слуга».
- issue: Співвідношення позики та боргу в τὸ δάνειον ἀφῆκεν αὐτῷ
  choice: «простив йому борг»
  alternative: «простив йому позику» або «скасував його борг»
  rationale: Вислів означає скасування обов’язку повернути позичене. Обраний варіант природний українською, зберігає мотив прощення й не стверджує нічого понад фінансовий зміст у самій сцені.
translation_notes:
  register: Сучасна стандартна українська з гідним оповідним звучанням. Синтаксис стислий і природний; «змилосердившись» передає причинно-емоційний відтінок дієприкметника, а «простив йому борг» є усталеним і зрозумілим висловом.
