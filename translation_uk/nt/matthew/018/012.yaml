language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: τί ὑμῖν δοκεῖ; ἐὰν γένηταί τινι ἀνθρώπῳ ἑκατὸν πρόβατα καὶ πλανηθῇ ἓν ἐξ αὐτῶν, οὐχὶ ⸀ἀφήσει τὰ ἐνενήκοντα ἐννέα ἐπὶ τὰ ὄρη ⸀καὶ πορευθεὶς ζητεῖ τὸ πλανώμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/012.yaml
  text: What do you think? If a man has a hundred sheep[a], and one of them goes astray[c][b], will he not leave the ninety-nine on the mountains and go and seek the one going astray?
translation:
  language: uk
  text: Як ви думаєте? Якщо чоловік має сто овець і одна з них заблукає[a], то хіба він не залишить дев’яносто дев’ять на горах[b] і не піде шукати ту, що блукає[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «відіб’ється від отари». Грецьке дієслово може означати «блукати», «збитися зі шляху», а в деяких контекстах — «бути введеним в оману».'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «у горах» чи «серед пагорбів».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «ту, яка блукає»; традиційно: «загублену».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: Як ви думаєте?
  rationale: Природне сучасне українське запитання, яке зберігає безпосереднє звернення до слухачів.
- source_word: ἐὰν γένηταί τινι ἀνθρώπῳ
  choice: Якщо якийсь чоловік має
  rationale: Конструкція з γίνομαι та давальним передає володіння; «якийсь чоловік» зберігає граматично чоловічу однину та не робить особу визначеною.
- source_word: ἑκατὸν πρόβατα
  choice: сто овець
  rationale: Прямий і природний відповідник числівникового словосполучення.
- source_word: πλανηθῇ ἓν ἐξ αὐτῶν
  choice: одна з них заблукає
  rationale: «Заблукає» природно передає вівцю, що збилася зі шляху, не уточнюючи, чи її хтось звів.
- source_word: οὐχὶ ἀφήσει
  choice: то хіба він не залишить
  rationale: «Хіба не» відтворює запитання, що передбачає ствердну відповідь; «залишить» не містить надмірно сильного значення покинення назавжди.
- source_word: τὰ ἐνενήκοντα ἐννέα
  choice: дев’яносто дев’ять
  rationale: Стандартне передання числівника; іменник «овець» легко відновлюється з контексту.
- source_word: ἐπὶ τὰ ὄρη
  choice: у горах
  rationale: Природний український топографічний вислів, який зберігає конкретний образ гірської місцевості.
- source_word: καὶ πορευθεὶς ζητεῖ
  choice: і не піде шукати
  rationale: Дієприслівникову конструкцію природно передано послідовними діями; повторне «не» належить до української моделі запитання «хіба не... і не...?», а «шукати» точно відповідає ζητέω.
- source_word: τὸ πλανώμενον
  choice: ту, що блукає
  rationale: Збережено теперішній дієприкметниковий відтінок і зв’язок із попереднім πλανηθῇ; не використано «загублену», що могло б змістити образ до іншої грецької лексеми.
theological_decisions:
- issue: Узагальнено вжита чоловіча форма ἀνθρώπῳ
  choice: якийсь чоловік
  alternative: хтось / якась людина
  rationale: Переклад зберігає граматично чоловічу однину джерела, водночас «якийсь» показує невизначеність персонажа притчі.
- issue: Відтінок πλανάω в образі вівці
  choice: заблукає / ту, що блукає
  alternative: відіб’ється / буде зведена; загублену
  rationale: Так збережено і буквальний пастуший образ, і можливий переносний відтінок відхилення від правильного шляху, без нав’язування зовнішньої причини чи остаточної втраченості.
translation_notes:
  register: Сучасна стандартна українська мова; виклад природний, виразний і гідний. Риторичне запитання з «хіба не» зберігає очікувану ствердну відповідь. Лексичний повтор πλανάω передано спорідненими словами «заблукає / блукає», наскільки це дозволяє природність української.
