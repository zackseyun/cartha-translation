    issue: «якийсь чоловік» adds an unnecessary particularizing nuance.
    rationale: τινι ἀνθρώπῳ introduces a generic case in this conditional illustration. Ukrainian «Якщо чоловік має» retains the masculine singular form while reading more naturally and without suggesting a particular unknown individual.
  - severity: low
    issue: Main-text rendering of ἐπὶ τὰ ὄρη is less spatially precise than it could be.
    rationale: «У горах» is possible Ukrainian, but «на горах» more directly reflects the Greek prepositional image and is also a natural expression in this pastoral setting.
