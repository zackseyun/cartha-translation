source:
  edition: SBLGNT
  text: ὁ μὲν υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ, οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· καλὸν ἦν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/024.yaml
  text: The Son of Man indeed goes just as it is written about him[a], but woe to that man through whom the Son of Man is betrayed. It would have been better for him if that man had not been born.
translation:
  language: uk
  text: Син Людський іде, як написано про Нього, але горе тому чоловікові, через якого Сина Людського зраджують[a]. Краще було б тому чоловікові не народитися.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «видають». Грецьке дієслово може означати як «зраджувати», так і буквальніше «передавати, видавати»; тут основний текст говорить про зраду, оскільки йдеться про вчинок Юди.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὲν υἱὸς τοῦ ἀνθρώπου
  choice: Син Людський
  rationale: Збережено усталений біблійний титул; протиставлення μὲν…δὲ природно передано будовою речення та сполучником «але», без неприродного окремого відповідника для μὲν.
- source_word: ὑπάγει
  choice: іде
  rationale: Простий теперішній час зберігає невизначеність дієслова й не уточнює понад текст, чи йдеться безпосередньо про відхід, смерть або шлях на страждання.
- source_word: καθὼς γέγραπται περὶ αὐτοῦ
  choice: як і написано про Нього
  rationale: Природна українська формула передає результативний перфект γέγραπται — написане залишається чинним — і значення περὶ αὐτοῦ.
- source_word: οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ
  choice: але горе тому чоловікові
  rationale: «Горе» зберігає пророчо-судовий тон οὐαί, а «але» виразно передає контраст δέ.
- source_word: δι’ οὗ
  choice: через якого
  rationale: Передає агентне або посередницьке значення διά з родовим відмінком без надмірного уточнення.
- source_word: παραδίδοται
  choice: зраджують
  rationale: У контексті дії Юди дієслово природно означає зраду; теперішня пасивна форма передана неозначено-особовою конструкцією, звичною для сучасної української. Буквальніше «видають» подано у примітці.
- source_word: καλὸν ἦν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος
  choice: Краще було б тому чоловікові не народитися
  rationale: Українська ідіоматична контрфактична конструкція точно передає думку про те, що ненародження було б для нього кращим; повторне «тому чоловікові» зберігає наголос ὁ ἄνθρωπος ἐκεῖνος.
theological_decisions:
- issue: Співвідношення написаного в Писанні та особистої відповідальності зрадника
  choice: 'Збережено обидва твердження: шлях Сина Людського відповідає написаному, а людині, через яку Його зраджують, проголошено горе.'
  alternative: Послабити або людську відповідальність, або силу виконання написаного.
  rationale: Грецький текст ставить ці істини поруч і не пояснює їхнього систематичного співвідношення, тому переклад не усуває напруження.
- issue: Сила вислову про ненародження
  choice: Передано як суворе судове висловлювання без подальшого доктринального уточнення.
  alternative: Тлумачити його лише як гіперболу або як прямий доказ певної доктрини про остаточну долю Юди.
  rationale: Текст стверджує лише те, що цій людині було б краще не народитися; переклад не додає висновків, яких сам вірш прямо не формулює.
translation_notes:
  register: Сучасна стандартна українська; виклад природний, стислий і гідний. Збережено усталений титул «Син Людський», урочисте «горе» та повтор «тому чоловікові». Займенник «Нього» написано з великої літери відповідно до поширеної української біблійної практики.
