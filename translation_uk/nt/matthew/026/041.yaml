base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/041.yaml
  text: Stay awake and pray[a], so that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.
translation:
  language: uk
  text: Пильнуйте й моліться, щоб не ввійти в спокусу.[a] Дух готовий, а плоть слабка.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «випробування». Грецьке слово може означати як спокусу до гріха, так і випробування або тяжке випробування.
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: Не спіть
  rationale: У контексті Гетсиманії учні буквально заснули, тому природний український наказ «Не спіть» передає безпосередній зміст і водночас заклик до пильності.
- source_word: προσεύχεσθε
  choice: моліться
  rationale: Звичний і ясний відповідник теперішнього наказового способу; форма наказу допускає тривалу дію без неприродної описовості.
- source_word: ἵνα μὴ εἰσέλθητε
  choice: щоб не ввійти
  rationale: Зберігає конструкцію мети/запобігання та грецький образ входження, не замінюючи його тлумачним «не піддатися».
- source_word: πειρασμόν
  choice: спокусу
  rationale: У найближчому контексті йдеться про небезпеку моральної невірності під тиском; ширший діапазон значень слова зазначено у примітці.
- source_word: τὸ μὲν πνεῦμα πρόθυμον
  choice: Дух бадьорий
  rationale: «Бадьорий» природно передає πρόθυμος як готовність і завзяття та створює виразний контраст зі слабкістю тіла; «дух» залишено без конкретизації.
- source_word: ἡ δὲ σὰρξ ἀσθενής
  choice: а тіло слабке
  rationale: У цьому контексті σάρξ вказує на тілесну людську неміч, виразно засвідчену сном учнів. «Тіло» природніше для сучасного читача й не привносить пізнішого значення «гріховної природи».
theological_decisions:
- issue: Значення πνεῦμα
  choice: людський дух або внутрішнє прагнення; «Дух» без додаткового уточнення
  alternative: Святий Дух
  rationale: Контраст із σάρξ і щире прагнення учнів, якому суперечить їхня слабкість, схиляють до людського духу. Сам текст не називає Святого Духа, тому переклад не додає такого уточнення.
- issue: Передача σάρξ
  choice: «тіло» як людська тілесна неміч
  alternative: «плоть»; «гріховна природа»
  rationale: Сцена з учнями, які заснули, робить тілесну слабкість безпосереднім змістом. «Гріховна природа» надмірно витлумачувала б вислів, тоді як «плоть» у сучасній українській тут менш природна.
translation_notes:
  register: Сучасна, стисла й гідна українська мова. «Не спіть» природно пов’язує наказ із безпосередньою ситуацією, а пара «дух бадьорий — тіло слабке» зберігає афористичність і внутрішній контраст оригіналу.
