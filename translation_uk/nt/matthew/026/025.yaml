  text: ἀποκριθεὶς δὲ Ἰούδας ὁ παραδιδοὺς αὐτὸν εἶπεν· Μήτι ἐγώ εἰμι, ῥαββί; λέγει αὐτῷ· Σὺ εἶπας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/025.yaml
  text: Then Judas, the one betraying him, answered and said, “Surely I am not the one, Rabbi?” He said to him, “You have said so.”
translation:
  language: uk
  text: 'Тоді Юда, який мав видати Його, запитав: «Невже це я, Учителю?» Ісус відповів йому: «Ти це сказав».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Ти сказав». Грецький вислів Σὺ εἶπας дослівно вказує на слова співрозмовника й не формулює прямої відповіді «так» або «ні».'
    reason: Передає форму грецької ідіоми та зберігає її можливу непрямість, не нав’язуючи однозначного тлумачення.
lexical_decisions:
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: який зраджував Його
  rationale: Дієприкметник теперішнього часу передає дію Юди, що розгорталася; «зраджував» природно відтворює контекстуальне значення παραδίδωμι.
- source_word: Μήτι ἐγώ εἰμι
  choice: Невже це я
  rationale: Μήτι вводить запитання, що очікує заперечної відповіді; українська конструкція з «невже» зберігає цей відтінок.
- source_word: ῥαββί
  choice: Учителю
  rationale: У цьому звертанні ῥαββί означає шанованого релігійного вчителя; функціональний український відповідник звучить природно й гідно.
- source_word: Σὺ εἶπας
  choice: Ти сам сказав
  rationale: Збережено непряму, стриману формулу підтвердження без розгортання її в однозначне «так».
theological_decisions:
- issue: Ступінь прямоти відповіді Ісуса
  choice: Ти сам сказав
  alternative: Так, це ти
  rationale: Грецьке Σὺ εἶπας є непрямою ідіоматичною відповіддю; переклад не усуває її навмисної стриманості й не робить вислів прямішим за оригінал.
translation_notes:
  register: Сучасна стандартна українська; природний, стислий і гідний діалог. «Запитав» замість буквального подвійного «відповів і сказав» усуває неприродну семітську формулу без втрати змісту.
