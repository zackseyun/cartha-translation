    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδύνατο
  choice: можна було
  rationale: Імперфект δύναμαι з інфінітивами виражає нереалізовану можливість у минулому; ця українська конструкція передає її природно.
- source_word: γὰρ
  choice: Адже
  rationale: Зберігає пояснювальний зв’язок із попередньою скаргою.
- source_word: τοῦτο
  choice: це
  rationale: Відтворює вказівний займенник середнього роду без додавання назви пахощів із контексту.
- source_word: πραθῆναι
  choice: продати
  rationale: Пасивний інфінітив у безособовій українській конструкції «можна було продати» природно передає значення «могло бути продане».
- source_word: πολλοῦ
  choice: за великі гроші
  rationale: Родовий ціни позначає високу суму, за яку можна було продати річ; формулювання природне для сучасної української.
- source_word: δοθῆναι
  choice: роздати
  rationale: У цьому контексті передає передання виручених грошей бідним; префікс «роз-» природно виражає розподіл між багатьма одержувачами, не уточнюючи сум.
- source_word: πτωχοῖς
  choice: бідним
  rationale: Субстантивований прикметник у давальному множини стисло й природно позначає бідних людей.
