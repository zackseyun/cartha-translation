  text: ἢ δοκεῖς ὅτι οὐ ⸀δύναμαι παρακαλέσαι τὸν πατέρα μου, καὶ παραστήσει μοι ⸂ἄρτι πλείω⸃ δώδεκα λεγιῶνας ἀγγέλων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/053.yaml
  text: Or do you think that I cannot appeal to my Father[c][b][a], and he will at once place at my disposal more than twelve legions of angels?
translation:
  language: uk
  text: Чи, може, ти думаєш, що Я не можу попросити Свого Отця[a], і Він зараз же надасть Мені[b] понад дванадцять легіонів[c] ангелів?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «звернутися до Свого Отця» чи «покликати Свого Отця на допомогу».
    reason: lexical_alternative
  - marker: b
    text: Буквально «поставити біля Мене», тобто надати для допомоги.
    reason: lexical_alternative
  - marker: c
    text: Римський легіон був великим військовим підрозділом; цей вислів підкреслює величезну силу небесного війська.
    reason: cultural_note
lexical_decisions:
- source_word: ἢ δοκεῖς
  choice: Чи ти думаєш
  rationale: Природно передає риторичне запитання, яким Ісус указує на іншу можливість у продовженні докору.
- source_word: οὐ δύναμαι
  choice: Я не можу
  rationale: Зберігає пряме значення здатності або спроможності, не перетлумачуючи його як небажання чи відсутність дозволу.
- source_word: παρακαλέσαι
  choice: попросити
  rationale: У цьому контексті дієслово означає звернутися до Отця з проханням про допомогу; просте «попросити» звучить природно й не послаблює змісту.
- source_word: τὸν πατέρα μου
  choice: Мого Отця
  rationale: Передає особисте синівське звернення Ісуса до Бога; велика літера відповідає сучасній українській біблійній практиці.
- source_word: παραστήσει μοι
  choice: надасть Мені
  rationale: Передає зміст забезпечення доступною допомогою, тоді як буквальне «поставить біля Мене» українською може помилково звучати лише як просторове розташування.
- source_word: ἄρτι
  choice: зараз же
  rationale: Виражає негайність надання допомоги в цій ситуації.
- source_word: πλείω δώδεκα λεγιῶνας ἀγγέλων
  choice: понад дванадцять легіонів ангелів
  rationale: Зберігає порівняння, числівник і римський військовий образ оригіналу; ἀγγέλων тут означає небесних істот.
theological_decisions:
- issue: Чи йдеться про неспроможність, відсутність дозволу або небажання Ісуса звернутися по небесну допомогу
  choice: «Я не можу попросити Мого Отця» — формулювання про спроможність
  alternative: Передати вислів як небажання Ісуса або як відсутність у Нього дозволу
  rationale: δύναμαι безпосередньо позначає здатність або силу. Переклад зберігає наголос на тому, що арешт Ісуса не спричинений Його безпорадністю, не додаючи пояснення причин Його відмови від допомоги.
translation_notes:
  register: Сучасна, природна й гідна українська мова. Риторичну форму запитання збережено; військовий термін «легіон» залишено для відтворення історичного образу. Усі примітки прив’язані до відповідних місць у тексті.
