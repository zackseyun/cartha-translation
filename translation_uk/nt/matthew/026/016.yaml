lexical_decisions:
- source_word: ἀπὸ τότε
  choice: відтоді
  rationale: Природний український відповідник, що передає початок тривалої дії від зазначеного моменту.
- source_word: ἐζήτει
  choice: шукав
  rationale: Недоконаний вид природно передає тривалу або повторювану дію грецького імперфекта.
- source_word: εὐκαιρίαν
  choice: нагоди
  rationale: «Нагода» ясно й природно позначає слушну можливість або відповідний момент.
- source_word: ἵνα
  choice: щоб
  rationale: Сполучник мети природно передає функцію ἵνα в цьому реченні.
- source_word: παραδῷ
  choice: видати
  rationale: «Видати» зберігає основний зміст передання когось у чужі руки й у цьому контексті звучить природніше за буквальне «передати», не звужуючи значення до самого поняття зради.
- source_word: αὐτὸν
  choice: Його
  rationale: Займенник стосується Ісуса; вжито традиційне шанобливе написання з великої літери.
theological_decisions:
- issue: Передача παραδῷ у контексті дій Юди
  choice: видати Його
  alternative: зрадити Його
  rationale: Грецьке παραδίδωμι має ширше значення «передати, видати». Контекст характеризує вчинок як зраду, але основний текст не підмінює ширше лексичне значення вужчим тлумаченням; альтернативу наведено в примітці.
translation_notes:
  register: Сучасна, проста й гідна українська мова. Лаконічний порядок слів зберігає часовий наголос на «відтоді», а недоконане «шукав» передає тривалість дії.
