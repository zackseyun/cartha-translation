  naturalness: Текст загалом нормативний і плавний. «Не знаю, що ти кажеш» є сучасним, лаконічним і стилістично придатним для оповідного біблійного контексту.
  terminology: «Відрікся» — усталене й доречне в біблійному контексті передання ἀρνέομαι; воно не уточнює, від кого або від чого він відрікся. «Перед усіма» належно передає ἔμπροσθεν πάντων.
