  text: ὁ δὲ ἠρνήσατο ⸀ἔμπροσθεν πάντων λέγων· Οὐκ οἶδα τί λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/070.yaml
  text: But he denied it before them all[a], saying, “I do not know what you are saying.”
translation:
  language: uk
  text: 'А він відрікся перед усіма, кажучи: «Не знаю, що ти кажеш».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρνήσατο
  choice: відрікся
  rationale: Дієслово ἀρνέομαι в цьому контексті означає заперечити щойно висловлене твердження. Українське «відрікся» природно передає дію без додавання прямо не названого додатка.
- source_word: ἔμπροσθεν πάντων
  choice: перед усіма
  rationale: Точно й природно передає публічність заперечення — у присутності всіх зібраних.
- source_word: λέγων
  choice: кажучи
  rationale: Зберігає грецьку дієприкметникову конструкцію і залишається природним для біблійного оповідного стилю.
- source_word: Οὐκ οἶδα
  choice: Не знаю
  rationale: Безпосередній відповідник запереченої форми дієслова «знати»; в українській займенник «я» природно випускається.
- source_word: τί λέγεις
  choice: про що ти говориш
  rationale: Ідіоматично передає заявлене Петром нерозуміння слів співрозмовниці, не виходячи за межі значення грецького вислову.
theological_decisions:
- issue: Характер Петрового зречення
  choice: Не уточнювати в перекладі прямо не виражений об’єкт зречення.
  alternative: «Він заперечив це» або «він відрікся від Ісуса».
  rationale: Грецький текст уживає ἠρνήσατο без вираженого додатка у відповідь на попереднє звинувачення. Такий переклад зберігає дискурсивну неоднозначність і не додає богословського уточнення.
translation_notes:
  register: Сучасна нормативна українська мова; стислий, гідний оповідний стиль. Формулювання зрозуміле широкому читачеві без зайвої архаїзації.
