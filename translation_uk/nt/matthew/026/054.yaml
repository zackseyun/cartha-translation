  text: πῶς οὖν πληρωθῶσιν αἱ γραφαὶ ὅτι οὕτως δεῖ γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/054.yaml
  text: How then would the Scriptures be fulfilled[a], that it must happen this way?
translation:
  language: uk
  text: Як же тоді могли б сповнитися Писання про те, що це має статися саме так?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πῶς
  choice: Як
  rationale: Питальний прислівник вводить риторичне запитання; «як» природно передає його силу українською.
- source_word: οὖν
  choice: же тоді
  rationale: 'Передає висновковий зв’язок із попередніми словами: як за іншого розвитку подій могли б сповнитися Писання.'
- source_word: πληρωθῶσιν
  choice: сповняться
  rationale: Аорист пасивного кон’юнктива в риторичному запитанні передає можливість, поставлену під сумнів; майбутня форма природна українською в конструкції «як ... сповняться?».
- source_word: αἱ γραφαὶ
  choice: Писання
  rationale: Множина означає священні писання Ізраїлю; усталене українське позначення — «Писання».
- source_word: ὅτι
  choice: що
  rationale: Вводить зміст сказаного в Писаннях, не додаючи причинного тлумачення.
- source_word: οὕτως
  choice: так
  rationale: Стисло й природно вказує на саме такий перебіг подій.
- source_word: δεῖ
  choice: має
  rationale: Передає необхідність, пов’язану зі сповненням Писань, без доданого пояснення її джерела.
- source_word: γενέσθαι
  choice: статися
  rationale: Природний сучасний відповідник для настання описуваних подій.
theological_decisions:
- issue: Характер необхідності, вираженої δεῖ
  choice: «так має статися» без пояснювального додавання
  alternative: «так мусить статися» або «так має статися за Божим задумом»
  rationale: Поєднання сповнення Писань із δεῖ має на увазі божественну необхідність, але грецький текст не розгортає цього пояснення; переклад зберігає цю богословську напругу.
translation_notes:
  register: Сучасна нормативна українська, проста й гідна. Риторичну стислість оригіналу збережено; «же тоді» виразно пов’язує запитання з попереднім контекстом.
