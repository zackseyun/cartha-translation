lexical_decisions:
- source_word: οὐχ εὗρον
  choice: не знайшли нічого
  rationale: Додаток у грецькому тексті не виражений прямо; з контексту попереднього вірша йдеться про шукане свідчення або обвинувачення. «Нічого» природно передає відсутність придатного матеріалу, не уточнюючи того, чого не уточнює оригінал.
- source_word: πολλῶν προσελθόντων ψευδομαρτύρων
  choice: хоч виступало багато лжесвідків
  rationale: Родовий абсолют має в контексті допустове значення. «Виступало» природно описує появу свідків на судовому слуханні, а «лжесвідки» зберігає юридичний зміст ψευδομάρτυρες.
- source_word: ὕστερον δὲ
  choice: А згодом
  rationale: «Згодом» позначає пізніший момент слухання, а «а» передає легкий перехідний або протиставний відтінок δέ.
- source_word: προσελθόντες δύο
  choice: виступили двоє
  rationale: У судовому контексті προσέρχομαι означає вихід свідків для свідчення; «виступили» звучить природніше за просторове «підійшли» й зберігає акцент на двох особах.
