lexical_decisions:
- source_word: εἶπαν
  choice: Вони сказали
  rationale: Аорист подає свідчення як завершену подію в оповіді; це природний український відповідник.
- source_word: Οὗτος
  choice: Цей чоловік
  rationale: Передає вказівну й дещо зневажливу силу вислову в обвинуваченні природніше, ніж буквальне «цей» або нейтральне «він».
- source_word: ἔφη
  choice: казав
  rationale: Звичайне дієслово мовлення без додаткового відтінку урочистої заяви чи твердження; недоконаний вид природно вводить зміст приписуваного Ісусові вислову.
- source_word: Δύναμαι
  choice: Я можу
  rationale: Природно й без надмірної формальності передає здатність, виражену дієсловом δύναμαι.
- source_word: καταλῦσαι
  choice: зруйнувати
  rationale: У контексті будівлі означає знищити або розібрати; «зруйнувати» чітко передає обвинувачення.
- source_word: τὸν ναὸν τοῦ θεοῦ
  choice: Божий храм
  rationale: «Храм» є зрозумілим відповідником ναός у цьому контексті, а присвійний прикметник природно передає грецький родовий відмінок τοῦ θεοῦ.
- source_word: διὰ τριῶν ἡμερῶν
  choice: за три дні
  rationale: Природний український вислів про виконання дії в межах названого проміжку; примітка зберігає можливий часовий відтінок.
- source_word: οἰκοδομῆσαι
  choice: збудувати його
  rationale: «Збудувати» близько відтворює грецьке дієслово без інтерпретаційного уточнення «відбудувати»; займенник «його» природно відновлює об’єкт в українській.
theological_decisions:
- issue: До чого стосується вислів «Божий храм» у свідченні
  choice: Передати обвинувачення на його безпосередньому рівні як згадку про храм, не вводячи тлумачення в основний текст.
  alternative: Перекласти так, щоб вислів прямо вказував на тіло Ісуса та воскресіння.
  rationale: Матвій тут наводить заяву свідків на суді. Ідентифікацію храму з тілом Ісуса в Івана 2:19–21 доречно подати як перехресне посилання, а не вбудовувати в переклад Матвія.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Формулювання зберігає характер судового обвинувачення, але не робить його штучно архаїчним чи надмірно офіційним.
