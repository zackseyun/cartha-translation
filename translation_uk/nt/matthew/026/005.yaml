lexical_decisions:
- source_word: ἔλεγον
  choice: вони казали
  rationale: Імперфект передає тривалу або повторювану мову під час наради; українське «казали» природно зберігає цей незавершений характер.
- source_word: δέ
  choice: Але
  rationale: 'Позначає легке протиставлення попередньому наміру: задум існував, але його здійснення під час свята вважали небезпечним.'
- source_word: Μὴ ἐν τῇ ἑορτῇ
  choice: Тільки не під час свята
  rationale: Еліптичне заперечення природно відтворено як застереження; ἐν має часове значення «під час», а ἑορτή тут стосується свята Пасхи.
- source_word: ἵνα μὴ
  choice: щоб не
  rationale: Передає мету уникнення небажаного наслідку природною сучасною українською конструкцією.
- source_word: θόρυβος
  choice: заворушення
  rationale: Слово означає громадський неспокій, сум'яття або безлад; «заворушення» передає загрозу масового неспокою, не звужуючи значення до повномасштабного бунту.
- source_word: γένηται
  choice: зчинилося
  rationale: У сполученні з θόρυβος дієслово означає виникнення або початок події; «зчинилося» є природним українським відповідником.
- source_word: ἐν τῷ λαῷ
  choice: серед народу
  rationale: Прийменникова конструкція вказує на неспокій у середовищі зібраного народу; «серед народу» природно передає цей зміст.
