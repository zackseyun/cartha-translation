lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Коли настав вечір
  rationale: Родовий абсолют задає часові обставини. Такий переклад природно й точно передає настання вечора; сполучник δέ тут не потребує окремого відтворення.
- source_word: ἀνέκειτο
  choice: приліг до столу
  rationale: Дієслово позначає прийняту в давнину позу під час трапези — лежачи біля низького столу. «Приліг до столу» передає контекст трапези й не створює хибного образу звичайного сидіння.
- source_word: μετὰ
  choice: з
  rationale: У сполученні з родовим відмінком μετά прямо виражає спільну присутність; природний український відповідник — «з».
- source_word: τῶν δώδεκα μαθητῶν
  choice: дванадцятьма учнями
  rationale: Основний текст SBLGNT містить μαθητῶν, тому слово слід перекласти. «Учні» — усталений і зрозумілий відповідник μαθηταί у Євангеліях.
theological_decisions: []
translation_notes:
  register: Сучасна, природна й гідна українська мова. Ім’я «Ісус» ужито замість займенника, оскільки українською окреме ненаголошене «він» тут звучало б менш природно, а референт однозначний із контексту. Виносний знак поставлено після всього речення, як у консультаційному англійському тексті.
