  source_fidelity: Часовий зворот «Коли настав вечір» точно передає Ὀψίας δὲ γενομένης. «Дванадцятьма учнями» правильно відтворює τῶν δώδεκα μαθητῶν, а примітка належно відбиває варіант без μαθητῶν. Однак «приліг до столу» в сучасній українській може означати просто лягти поруч зі столом і не досить виразно передає трапезне ἀνέκειτο.
  naturalness: «Розлігся за столом» природніше й чіткіше вказує на позу за трапезою, не підміняючи її звичайним сидінням. Нульовий/займенниковий підмет тут не потрібен для уточнення імені, але «він» безпосередніше відповідає неявному підметові грецького тексту.
  terminology: «Учнями» — усталений точний відповідник μαθηταῖς/μαθητῶν у євангельському контексті. Ім’я Ісуса не є помилковим за контекстом, проте грецький текст уживає неявний підмет («він»), тож його збережено без додаткової експлікації.
