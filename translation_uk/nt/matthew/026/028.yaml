  text: τοῦτο γάρ ἐστιν τὸ αἷμά ⸀μου ⸀τῆς διαθήκης τὸ περὶ πολλῶν ἐκχυννόμενον εἰς ἄφεσιν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/028.yaml
  text: For this is my blood of the covenant[b][a], which is poured out for many for the forgiveness of sins.
translation:
  language: uk
  text: Бо це Моя кров завіту[a], що проливається за багатьох[b] для прощення гріхів.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'У деяких рукописах: «Моя кров нового завіту».'
    reason: textual_variant
  - marker: b
    text: 'Або: «на користь багатьох».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: це
  rationale: Безпосередньо передає вказівний займенник середнього роду; слово «чаша» в цьому реченні грецького тексту відсутнє.
- source_word: γάρ
  choice: бо
  rationale: Зберігає пояснювальний зв’язок із попереднім наказом пити й природно звучить українською.
- source_word: τὸ αἷμά μου
  choice: Моя кров
  rationale: Прямий і природний український відповідник, що зберігає жертовний та завітний зміст вислову.
- source_word: τῆς διαθήκης
  choice: завіту
  rationale: Відтворює поданий текст SBLGNT без додавання прикметника «нового»; варіант із ним зазначено у примітці.
- source_word: περὶ πολλῶν
  choice: за багатьох
  rationale: У жертовному контексті περί з родовим відмінком може виражати дію на користь або від імені інших. Вислів зберігає формулювання «багатьох», не розв’язуючи ширшої богословської суперечки.
- source_word: ἐκχυννόμενον
  choice: що проливається
  rationale: Природно передає пасивний дієприкметник теперішнього часу, узгоджений із «кров», і зберігає жертовний образ.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: для прощення гріхів
  rationale: Ясно передає цільовий або результативний відтінок εἰς і вживає зрозумілий сучасний вислів.
theological_decisions:
- issue: Чи додавати «нового» до слова «завіту»
  choice: завіту
  alternative: нового завіту
  rationale: У поданому основному грецькому тексті немає καινῆς («нового»). Основний переклад не запозичує це слово з паралельної традиції, а рукописний варіант подає в примітці.
- issue: Значення вислову περὶ πολλῶν у контексті спокути
  choice: за багатьох
  alternative: за всіх
  rationale: Грецький текст має πολλῶν — «багатьох». Переклад не замінює його словом «усіх» і не використовує цей вірш для розв’язання богословської суперечки про обсяг спокути.
- issue: Відтінок прийменника περί
  choice: за багатьох
  alternative: стосовно багатьох / на користь багатьох
  rationale: Українське «за багатьох» стисло й природно передає представницько-благодійний відтінок у жертовному контексті, тоді як можливість експліцитного прочитання «на користь багатьох» збережено в примітці.
translation_notes:
  register: Сучасна, зрозуміла й урочиста українська мова. Порядок слів природний для української; «Бо» зберігає пояснювальну функцію γάρ. Займенник «Моя» написано з великої літери відповідно до поширеної української біблійної традиції шанобливого позначення особи Христа.
