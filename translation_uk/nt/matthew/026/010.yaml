source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Τί κόπους παρέχετε τῇ γυναικί; ἔργον γὰρ καλὸν ἠργάσατο εἰς ἐμέ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/010.yaml
  text: But Jesus[a], knowing this, said to them[b], “Why are you causing trouble for the woman? For she has done a beautiful work to me.
translation:
  language: uk
  text: 'Але Ісус, знаючи це, сказав їм: «Навіщо ви завдаєте прикрощів цій жінці? Адже вона зробила для Мене прекрасне діло.[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «добре діло».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: знаючи це
  rationale: Аористовий дієприкметник від γινώσκω має обставинну функцію; «це» природно вказує на висловлене в попередньому контексті невдоволення учнів.
- source_word: δὲ
  choice: Але
  rationale: δέ позначає легке протиставлення між наріканням учнів і виправною відповіддю Ісуса.
- source_word: Τί κόπους παρέχετε
  choice: Навіщо ви завдаєте прикрощів
  rationale: Сполука κόπους παρέχετε означає завдавати комусь клопоту, болю чи прикрощів. Українське «завдаєте прикрощів» природно передає спрямовану проти жінки дію та докір Ісуса.
- source_word: τῇ γυναικί
  choice: цій жінці
  rationale: Давальний відмінок називає особу, якій завдають прикрощів; вказівне «цій» природне в безпосередній сцені, хоча в грецькому стоїть артикль.
- source_word: ἔργον καλὸν
  choice: прекрасне діло
  rationale: καλός поєднує значення добра, шляхетності й краси. «Прекрасне діло» зберігає широку позитивну оцінку вчинку.
- source_word: ἠργάσατο
  choice: зробила
  rationale: Аорист позначає завершений учинок; доконаний вид «зробила» природно передає його українською.
- source_word: εἰς ἐμέ
  choice: для Мене
  rationale: εἰς стосовно особи тут природно виражає спрямованість учинку на Ісуса; «для Мене» є нормативним українським відповідником, не звужуючи вислів до суто матеріальної користі.
theological_decisions:
- issue: Оцінка вчинку жінки
  choice: прекрасне діло
  alternative: добре діло; шляхетний учинок
  rationale: Переклад зберігає етично-естетичний відтінок καλόν і похвалу Ісуса, не додаючи сакраментального чи вчення про заслуги.
- issue: Спрямованість учинку у вислові εἰς ἐμέ
  choice: для Мене
  alternative: щодо Мене; Мені
  rationale: «Для Мене» природно передає особисту спрямованість учинку, залишаючи відкритим точний відтінок прийменника εἰς.
translation_notes:
  register: Сучасна літературна українська з гідним, доступним біблійним звучанням. «Завдаєте прикрощів» точніше й природніше за буквальне «спричиняєте клопоти». Займенник «Мене» написано з великої літери відповідно до поширеної української традиції шанобливого написання щодо Ісуса.
