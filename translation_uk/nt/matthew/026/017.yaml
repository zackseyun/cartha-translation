base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/017.yaml
  text: On the first day of Unleavened Bread[a], the disciples came to Jesus, saying[b], “Where do you want us to prepare for you to eat the Passover?”
translation:
  language: uk
  text: 'Першого дня Опрісноків[a] учні підійшли до Ісуса й сказали: «Де Ти хочеш, щоб ми приготували Тобі пасхальну трапезу[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Дослівно: «першого дня Опрісноків». Цей вислів відтворює грецьке формулювання; питання пасхальної хронології не слід вирішувати самим перекладом.'
    reason: cultural_note
  - marker: b
    text: 'Або: «Пасху». У контексті приготування й споживання πάσχα означає пасхальну трапезу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ πρώτῃ τῶν ἀζύμων
  choice: Першого дня Опрісноків
  rationale: Давальний часу природно передається родовим часу в українській. «Опрісноки» — усталена біблійна назва святкового періоду; δέ тут є слабким сполучником і не потребує окремого відтворення.
- source_word: προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ
  choice: учні підійшли до Ісуса
  rationale: προσέρχομαι означає наблизитися або підійти; «підійшли» точно й природно передає спрямовану дію.
- source_word: λέγοντες
  choice: й сказали
  rationale: Українська сурядна конструкція природніше за буквальний дієприслівник передає супровідну дію, не змінюючи змісту.
- source_word: Ποῦ θέλεις ἑτοιμάσωμέν σοι
  choice: Де Ти хочеш, щоб ми приготували Тобі
  rationale: Підрядне речення з «щоб» природно передає непряме деліберативне питання з аористом кон’юнктива; σοι збережено як «Тобі».
- source_word: φαγεῖν τὸ πάσχα
  choice: пасхальну вечерю
  rationale: У контексті дієслова «їсти» πάσχα означає пасхальну трапезу. «Пасхальна вечеря» ясно передає цей контекстуальний зміст і не змішує його з назвою християнського свята Пасхи.
theological_decisions:
- issue: Хронологічний вислів «першого дня Опрісноків» щодо часу пасхальної вечері
  choice: Збережено прямий святковий вислів «Першого дня Опрісноків».
  alternative: Тлумачно передати як «напередодні свята Опрісноків» або «першого дня Пасхи».
  rationale: Грецький текст прямо називає перший день Опрісноків. Переклад не повинен самостійно гармонізувати дискусійні питання євангельської хронології.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. «Опрісноки» збережено як усталену біблійну назву, а синтаксис прямої мови зроблено природним для сучасного читача.
