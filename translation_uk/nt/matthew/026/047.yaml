  source_fidelity: Текст точно передає часову конструкцію ἔτι αὐτοῦ λαλοῦντος, оповідний маркер ἰδού, партитив «один із дванадцятьох», кількісне значення ὄχλος πολύς, а також ἀπό без додавання невираженого дієслова «послати». «Від первосвященників і старійшин народу» належно зберігає вихідну неоднозначність щодо способу доручення натовпу.
