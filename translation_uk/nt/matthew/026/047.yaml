source:
  edition: SBLGNT
  text: Καὶ ἔτι αὐτοῦ λαλοῦντος ἰδοὺ Ἰούδας εἷς τῶν δώδεκα ἦλθεν καὶ μετ’ αὐτοῦ ὄχλος πολὺς μετὰ μαχαιρῶν καὶ ξύλων ἀπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/047.yaml
  text: And while he was still speaking[a], behold, Judas, one of the twelve, came, and with him a large crowd with swords and clubs[b], from the chief priests and elders of the people.
translation:
  language: uk
  text: Коли Він ще говорив, аж ось прийшов Юда, один із дванадцятьох, а з ним — великий натовп із мечами та палицями,[a] від первосвященників і старійшин народу.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «дерев’яними кийками». Грецьке слово буквально означає шматки дерева, тут, імовірно, використані як зброя.'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «посланий первосвященниками і старійшинами народу». Дослівніше грецькою: «від первосвященників і старійшин народу».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: Коли Він ще говорив
  rationale: Родовий абсолют передає одночасність дій; «коли... ще» природно відтворює часовий зв’язок та значення ἔτι.
- source_word: ἰδοὺ
  choice: аж ось
  rationale: Зберігає яскравий оповідний маркер та відчуття безпосередності, не додаючи значення раптовості як окремого факту.
- source_word: Ἰούδας
  choice: Юда
  rationale: Усталена українська біблійна форма особового імені.
- source_word: εἷς τῶν δώδεκα
  choice: один із дванадцятьох
  rationale: Прямо й природно передає партитивний вислів без перетворення числівника на формальний титул.
- source_word: ἦλθεν
  choice: прийшов
  rationale: Найпряміший український відповідник простого оповідного аориста ἔρχομαι.
- source_word: ὄχλος πολὺς
  choice: великий натовп
  rationale: Передає кількісне значення πολύς, не додаючи до самого іменника виразнішої ворожості, яку мало б слово «юрба».
- source_word: μετὰ μαχαιρῶν
  choice: із мечами
  rationale: «Мечі» є усталеним і досить широким відповідником μάχαιραι у сцені арешту.
- source_word: καὶ ξύλων
  choice: та палицями
  rationale: У цьому контексті множина ξύλα позначає дерев’яні предмети, використані як зброя; «палиці» природніше за буквальне «шматки дерева».
- source_word: ἀπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων τοῦ λαοῦ
  choice: від первосвященників і старійшин народу
  rationale: «Від» зберігає значення джерела або походження, не додаючи відсутнього в грецькому тексті дієслова «посланий».
theological_decisions:
- issue: Чи слід прямо сказати, що натовп був посланий юдейськими провідниками
  choice: від первосвященників і старійшин народу
  alternative: посланий первосвященниками і старійшинами народу
  rationale: Прийменник ἀπό вказує на джерело або походження; контекст допускає офіційне доручення, однак дієслова «послати» в тексті немає. Основний текст зберігає цю міру неоднозначності.
translation_notes:
  register: Сучасна, зрозуміла й гідна оповідна українська. «Аж ось» зберігає виразність ἰδοὺ; пунктуація полегшує сприйняття довгого речення. Займенник «Він» ужито з великої літери відповідно до поширеної української біблійної практики, хоча грецький текст графічно цього не позначає.
