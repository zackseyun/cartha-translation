lexical_decisions:
- source_word: τότε
  choice: Тоді
  rationale: Природно позначає наступну подію в оповіді й зберігає часову послідовність.
- source_word: ἐνέπτυσαν εἰς τὸ πρόσωπον αὐτοῦ
  choice: плювали Йому в обличчя
  rationale: Грецький вислів буквально описує плювання «в обличчя»; український відповідник природно й виразно передає акт зневаги.
- source_word: ἐκολάφισαν αὐτόν
  choice: били Його кулаками
  rationale: Дієслово κολαφίζω вказує на удари кулаком; цей переклад конкретний і не звужує дію до одного удару.
- source_word: οἱ δὲ ἐράπισαν
  choice: а інші давали Йому ляпаси
  rationale: Субстантивований артикль οἱ передає значення «інші», а ῥαπίζω зазвичай означає бити відкритою долонею. Об’єкт «Йому» відновлено з контексту.
- source_word: δέ
  choice: а
  rationale: Передає легкий перехід і розрізнення між учасниками без надмірно сильного протиставлення.
theological_decisions:
- issue: Опис наруги над Ісусом перед радою
  choice: Конкретно передати плювання, удари кулаками та ляпаси, не пом’якшуючи насильства.
  alternative: Ужити загальніші слова на кшталт «знущалися» або «били».
  rationale: Оригінал називає окремі принизливі й насильницькі дії; конкретний переклад зберігає силу оповіді без додавання богословського тлумачення.
translation_notes:
  register: Сучасна стандартна українська; виклад природний, гідний і конкретний. Займенники щодо Ісуса написано з великої літери відповідно до поширеної української біблійної практики.
