language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: καὶ ἐμνήσθη ὁ Πέτρος τοῦ ⸀ῥήματος Ἰησοῦ ⸀εἰρηκότος ὅτι Πρὶν ἀλέκτορα φωνῆσαι τρὶς ἀπαρνήσῃ με, καὶ ἐξελθὼν ἔξω ἔκλαυσεν πικρῶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/075.yaml
  text: 'And Peter remembered the word Jesus had spoken: “Before a rooster crows[a], you will deny me three times.” And he went outside and wept bitterly.'
translation:
  language: uk
  text: 'І Петро згадав те, що сказав Ісус: «Перш ніж заспіває півень, ти тричі відречешся від мене». І, вийшовши надвір, він гірко заплакав.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμνήσθη
  choice: згадав
  rationale: Аорист дієслова передає момент, коли Петро пригадав раніше сказане; «згадав» природно й точно відтворює оповідну дію.
- source_word: τοῦ ῥήματος Ἰησοῦ εἰρηκότος
  choice: те, що сказав Ісус
  rationale: Ця природна українська конструкція передає однину ῥῆμα як конкретне висловлювання та попередність дії перфектного дієприкметника εἰρηκότος без незграбного буквального звороту.
- source_word: Πρὶν ἀλέκτορα φωνῆσαι
  choice: Перш ніж заспіває півень
  rationale: Інфінітивний часовий зворот природно передано підрядним реченням. Українська мова не має артиклів, тому анартросне ἀλέκτορα не потребує окремого маркування означеності.
- source_word: τρὶς
  choice: тричі
  rationale: «Тричі» — звичний, стислий і сучасний український відповідник.
- source_word: ἀπαρνήσῃ
  choice: відречешся від мене
  rationale: Дієслово означає зректися або заперечити зв’язок із кимось; українська конструкція «відректися від когось» ясно передає зміст у цьому контексті.
- source_word: ἐξελθὼν ἔξω
  choice: вийшовши надвір
  rationale: Зворот зберігає рух із місця події назовні, природно передаючи грецьке поєднання дієприкметника з прислівником.
- source_word: ἔκλαυσεν πικρῶς
  choice: гірко заплакав
  rationale: Усталений український вислів точно передає сильний біль і каяття без доданого тлумачення.
theological_decisions:
- issue: Згадка про Ісуса без титулу
  choice: Ісус
  alternative: Господь Ісус
  rationale: Грецький текст містить лише ім’я Ἰησοῦ, тому христологічний титул не додається.
- issue: Зміст Петрового зречення
  choice: відречешся від мене
  alternative: заперечиш мене
  rationale: Обраний варіант зберігає вагу ἀπαρνέομαι як зречення зв’язку з Ісусом, не уточнюючи понад те, що висловлено в джерелі.
translation_notes:
  register: Сучасна стандартна українська мова з гідним оповідним тоном. Синтаксис зроблено природним для широкого кола читачів; займенник «мене» подано з малої літери, оскільки грецький текст не кодує шанобливої капіталізації.
