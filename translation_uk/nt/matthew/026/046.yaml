lexical_decisions:
- source_word: ἐγείρεσθε
  choice: Уставайте
  rationale: Множинний наказовий спосіб прямо звернений до учнів; «Уставайте» природно передає заклик підвестися.
- source_word: ἄγωμεν
  choice: ходімо
  rationale: Спонукальний кон’юнктив першої особи множини природно передається українським «ходімо».
- source_word: ἰδού
  choice: Ось
  rationale: Частка привертає увагу до невідкладної події; «Ось» зберігає її виразність без архаїчності.
- source_word: ἤγγικεν
  choice: наблизився
  rationale: 'Перфект позначає завершене наближення з актуальним результатом: ця людина вже близько.'
- source_word: ὁ παραδιδούς με
  choice: той, хто видає Мене
  rationale: Субстантивований дієприкметник називає людину через її теперішню дію. «Видає» зберігає конкретний сенс передавання Ісуса до рук противників і водночас у контексті передає зраду.
theological_decisions:
- issue: Передача παραδιδούς у контексті Страстей
  choice: той, хто видає Мене
  alternative: Мій зрадник; той, хто зраджує Мене
  rationale: Грецьке слово буквально описує того, хто передає Ісуса до чужих рук; у цьому контексті така дія є зрадою. Основний текст не звужує конкретну дію лише до її моральної оцінки, а примітка пояснює контекстуальний зміст.
translation_notes:
  register: Сучасна, стисла й урочиста пряма мова. «Уставайте, ходімо» передає терміновість без архаїчних форм; займенник «Мене» написано з великої літери відповідно до поширеної української біблійної видавничої практики.
