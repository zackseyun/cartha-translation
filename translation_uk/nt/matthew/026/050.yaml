review_pass:
  verdict: revise
  source_fidelity: 'Початок і слова Ісуса передано точно; кличне «Друже» добре відтворює Ἑταῖρε, а основне прочитання стислого ἐφ’ ὃ πάρει є допустимим. Проте «схопили Ісуса й узяли Його під варту» послаблює двоетапність грецького формулювання: ἐπέβαλον τὰς χεῖρας прямо згадує накладення рук, тоді як ἐκράτησαν означає схопили/оволоділи ним. «Узяли під варту» також додає формальніший юридичний відтінок.'
  naturalness: «А Ісус сказав йому» і «Друже, зроби те, заради чого ти прийшов» природні для сучасної літературної української. «Підійшли, наклали руки на Ісуса й схопили Його» є ясним, оповідно природним і водночас зберігає образність та послідовність оригіналу.
  terminology: «Друже» належно стримане й не нав’язує інтимного тону. У примітці «для чого ти прийшов?» точніше відбиває ἐφ’ ὃ, ніж «навіщо», яке може звучати як запит про причину, а не мету.
  issues:
  - severity: medium
    issue: Втрачено явну дію «наклали руки на Ісуса».
    rationale: Грецьке ἐπέβαλον τὰς χεῖρας ἐπὶ τὸν Ἰησοῦν має бути відтворене окремо від наступного ἐκράτησαν αὐτόν, щоб не зливати дві дії в одну.
  - severity: low
    issue: «Узяли Його під варту» дещо надто юридично конкретизує ἐκράτησαν.
    rationale: Дієслово описує силове захоплення; «схопили Його» передає це без доданого процедурно-правового забарвлення.
  - severity: low
    issue: Питальна альтернатива в примітці може точніше передати цільовий відтінок вислову.
    rationale: «Для чого ти прийшов?» ближче до «for what have you come?» і зберігає неоднозначність без інтерпретаційного зміщення до причинового «навіщо».
