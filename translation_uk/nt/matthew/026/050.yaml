base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/050.yaml
  text: But Jesus said to him[a], “Friend, do what you came for.” Then they came up, laid hands on Jesus, and seized him.
translation:
  language: uk
  text: 'А Ісус сказав йому: «Друже, зроби те, заради чого ти прийшов».[a] Тоді вони підійшли, наклали руки на Ісуса й схопили Його.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Друже, для чого ти прийшов?» Грецький вислів стислий і може бути зрозумілий як запитання.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑταῖρε
  choice: Друже
  rationale: Клична форма природно передає пряме звертання до Юди. У цьому контексті слово стримане й не обов’язково виражає близьку дружбу.
- source_word: ἐφ’ ὃ πάρει
  choice: зроби те, заради чого ти прийшов
  rationale: Стисла грецька конструкція допускає еліптичне спонукальне розуміння; переклад зберігає природність української, а питальне тлумачення подано в примітці.
- source_word: προσελθόντες
  choice: підійшли
  rationale: Передає рух учасників арешту до Ісуса та природну послідовність розповіді.
- source_word: ἐπέβαλον τὰς χεῖρας ἐπὶ τὸν Ἰησοῦν
  choice: схопили Ісуса
  rationale: Українське «схопили» природно передає вороже накладення рук із метою затримання, не калькуючи грецький зворот.
- source_word: ἐκράτησαν αὐτόν
  choice: узяли Його під варту
  rationale: У контексті κρατέω означає утримання після схоплення. Такий переклад відрізняє цей акт від попереднього фізичного захоплення, хоча дещо виразніше подає контекст затримання.
- source_word: δὲ
  choice: А
  rationale: «А» природно передає легкий контраст і перехід до відповіді Ісуса без надмірного протиставлення.
theological_decisions:
- issue: Тлумачення слів Ісуса до Юди
  choice: «Друже, зроби те, заради чого ти прийшов»
  alternative: «Друже, навіщо ти прийшов?»
  rationale: Основний текст передає можливе спонукальне значення стислої фрази, не роблячи звертання ані надмірно лагідним, ані осудливим. Справжню синтаксичну неоднозначність збережено в примітці.
translation_notes:
  register: Сучасна, зрозуміла й гідна оповідна українська. Кличний відмінок «Друже» зберігає пряме звертання; займенник щодо Ісуса написано з великої літери за редакційною українською традицією.
