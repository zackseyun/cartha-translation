lexical_decisions:
- source_word: βαλοῦσα
  choice: виливши
  rationale: Аористовий дієприкметник від βάλλω у цьому контексті означає вилити або нанести пахощі, а не буквально «кинути». Дієприслівник природно передає супровідну дію щодо ἐποίησεν.
- source_word: γὰρ
  choice: Бо
  rationale: γάρ вводить пояснення Ісусом учинку жінки; «бо» стисло й природно зберігає пояснювальний зв’язок.
- source_word: μύρον
  choice: пахощі
  rationale: μύρον позначає запашну олію або ароматичну мазь. «Пахощі» є зрозумілим сучасним відповідником і не нав’язує конкретної консистенції речовини.
- source_word: ἐπὶ τοῦ σώματός μου
  choice: на Моє тіло
  rationale: ἐπί з родовим відмінком тут указує на нанесення речовини на тіло.
- source_word: πρὸς τὸ ἐνταφιάσαι με
  choice: щоб приготувати Мене до поховання
  rationale: πρός з артикльованим інфінітивом виражає мету, а ἐνταφιάζω охоплює приготування тіла до поховання; переклад робить цю лексичну рису явною.
- source_word: ἐποίησεν
  choice: вона зробила це
  rationale: Загальне ποιέω стосується щойно описаного вчинку; займенник «це» природно пов’язує головне дієслово з попереднім дієприслівниковим зворотом.
- source_word: αὕτη
  choice: вона
  rationale: У контексті особу вже визначено, тому «вона» звучить природно; вказівний відтінок αὕτη тут не потребує важчого «ця жінка».
theological_decisions:
- issue: Значення ἐνταφιάζω у зв’язку зі смертю Ісуса
  choice: Учинок жінки витлумачено як приготування Ісуса до поховання.
  alternative: Учинок просто призначений «для Мого поховання», без явного наголосу на приготуванні тіла.
  rationale: Лексичне значення ἐνταφιάζω охоплює поховальне приготування або покладення до гробу. Обраний переклад зберігає передбачувальний зміст слів Ісуса, не додаючи інших доктринальних тверджень.
translation_notes:
  register: Сучасна літературна українська, ясна й гідна. Збережено пояснювальне «Бо» та структуру з дієприслівником. «Пахощі» передає ароматичну речовину без надмірного уточнення її форми; займенники щодо Ісуса подано з великої літери за усталеною українською біблійною практикою.
