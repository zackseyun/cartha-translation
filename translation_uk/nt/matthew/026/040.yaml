source:
  edition: SBLGNT
  text: καὶ ἔρχεται πρὸς τοὺς μαθητὰς καὶ εὑρίσκει αὐτοὺς καθεύδοντας, καὶ λέγει τῷ Πέτρῳ· Οὕτως οὐκ ἰσχύσατε μίαν ὥραν γρηγορῆσαι μετ’ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/040.yaml
  text: And he comes to the disciples and finds them sleeping[a], and he says to Peter, “So[b], were you not able to stay awake with me for one hour?”
translation:
  language: uk
  text: 'І приходить Він до учнів, і знаходить їх сплячими, і каже Петрові: «То ви не змогли й однієї години пильнувати[a] зі мною?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «не спати зі мною».'
    reason: Лексична альтернатива для γρηγορῆσαι; у безпосередньому протиставленні сну вона виразніше передає буквальне неспання.
lexical_decisions:
- source_word: ἔρχεται
  choice: приходить
  rationale: Збережено грецький історичний теперішній час, природний і виразний в українській біблійній оповіді.
- source_word: πρὸς τοὺς μαθητὰς
  choice: до учнів
  rationale: Природна українська передача руху до осіб.
- source_word: εὑρίσκει αὐτοὺς καθεύδοντας
  choice: знаходить їх сплячими
  rationale: Дієприкметникову конструкцію передано близько до грецької, із чітким позначенням того, що учні спали.
- source_word: λέγει τῷ Πέτρῳ
  choice: каже Петрові
  rationale: Збережено історичний теперішній час і звичну українську форму імені.
- source_word: Οὕτως
  choice: То
  rationale: У цьому запитанні слово вводить докір і здивування; «То» природно передає цю функцію сучасною українською.
- source_word: οὐκ ἰσχύσατε
  choice: ви не змогли
  rationale: Передано значення спроможності, водночас займенником «ви» виразно збережено множину грецького дієслова.
- source_word: μίαν ὥραν
  choice: й однієї години
  rationale: Родовий відмінок після заперечення природний українською; частка «й» передає докір щодо навіть такого короткого часу.
- source_word: γρηγορῆσαι
  choice: пильнувати
  rationale: Слово охоплює як буквальне неспання в протиставленні сну, так і відтінок духовної пильності, не звужуючи вислів лише до фізичного стану.
- source_word: μετ’ ἐμοῦ
  choice: зі Мною
  rationale: Пряма й природна передача значення супроводу; написання займенника з великої літери відповідає усталеному шанобливому біблійному регістру українською.
theological_decisions:
- issue: Звернення до Петра при множині дієслова ἰσχύσατε
  choice: 'Збережено Петра як названого адресата, а докір передано у множині: «ви не змогли».'
  alternative: Передати докір в однині як звернений лише до Петра або пояснити, що він представляє всю групу.
  rationale: Грецький текст прямо поєднує названого в однині Петра з дієсловом другої особи множини. Переклад зберігає цю напругу й не додає пояснення.
- issue: Конкретне неспання чи ширша пильність у γρηγορῆσαι
  choice: пильнувати
  alternative: не спати; залишатися при свідомості
  rationale: Контекст сну надає буквального сенсу, але γρηγορέω також має значення сторожкої пильності. «Пильнувати» зберігає обидва відтінки.
translation_notes:
  register: Сучасна, гідна українська оповідна мова зі збереженням історичного теперішнього часу. Повтор сполучників відтворює послідовність грецької оповіді без надмірної буквальності. Форму множини «ви» в репліці навмисно зроблено явною, щоб зберегти граматичну особливість оригіналу.
