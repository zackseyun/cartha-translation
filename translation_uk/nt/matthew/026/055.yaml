  source_fidelity: 'Зміст передано точно: часовий вислів, адресати в множині, озброєний вихід, мета затримання, щоденне навчання в храмі та подальше «не схопили» відповідають грецькому тексту. Однак «наче розбійника» після «заарештувати мене» є синтаксично неповним і менш точно відтворює ὡς ἐπὶ λῃστήν, тобто поводження із ним так, як із розбійником.'
