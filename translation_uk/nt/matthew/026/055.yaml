  terminology: «Розбійник» є придатним основним відповідником λῃστής; примітка коректно зберігає можливі ширші відтінки без нав’язування політичного значення. «Мечі та киї», «заарештувати» і «схопили» доречно передають відповідні терміни та зберігають різницю між συλλαβεῖν і κρατέω.
