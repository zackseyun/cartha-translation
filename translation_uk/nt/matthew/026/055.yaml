  text: ἐν ἐκείνῃ τῇ ὥρᾳ εἶπεν ὁ Ἰησοῦς τοῖς ὄχλοις· Ὡς ἐπὶ λῃστὴν ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων συλλαβεῖν με; καθ’ ⸀ἡμέραν ⸂ἐν τῷ ἱερῷ ἐκαθεζόμην διδάσκων⸃ καὶ οὐκ ἐκρατήσατέ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/055.yaml
  text: At that hour Jesus said to the crowds[a], “Have you come out with swords and clubs to arrest me, as against a robber? Day after day I was sitting in the temple teaching[b], and you did not seize me.”
translation:
  language: uk
  text: 'Тієї години Ісус сказав натовпам: «Невже ви вийшли з мечами та киями, щоб заарештувати мене, ніби на розбійника[a]? День у день я сидів у храмі й навчав, а ви мене не схопили».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «бандита» чи «повстанця». Грецьке λῃστής може означати не лише злодія, а й жорстокого розбійника або, в деяких контекстах, заколотника.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: Тієї години
  rationale: Зберігає часовий образ і безпосередність грецького вислову, залишаючись природним українським зворотом.
- source_word: τοῖς ὄχλοις
  choice: натовпам
  rationale: Передає множину грецького іменника без архаїчного відтінку.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: наче розбійника
  rationale: Природно передає риторичне порівняння. «Розбійник» охоплює значення озброєного грабіжника, не звужуючи його безпідставно до політичного повстанця.
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: з мечами та киями
  rationale: «Киї» ясно передають ξύλα як дерев’яну зброю, а не просто палиці чи шматки дерева.
- source_word: συλλαβεῖν με
  choice: заарештувати мене
  rationale: У контексті озброєного загону дієслово позначає взяття під варту; цей вибір також дає змогу відрізнити його від наступного κρατέω.
- source_word: καθ’ ἡμέραν
  choice: Щодня
  rationale: Стисло й природно передає повторювану дію distributive construction.
- source_word: ἐν τῷ ἱερῷ
  choice: у храмі
  rationale: ἱερόν означає храмовий комплекс, а не внутрішнє святилище; у звичайній українській мові «у храмі» природно охоплює цю ширшу територію.
- source_word: ἐκαθεζόμην διδάσκων
  choice: я сидів у храмі й навчав
  rationale: Передає тривалу, звичну дію імперфекта та одночасність дієприкметника природною українською конструкцією.
- source_word: οὐκ ἐκρατήσατέ με
  choice: ви мене не схопили
  rationale: «Схопили» відтворює значення κρατέω та зберігає лексичну відмінність від συλλαβεῖν, перекладеного як «заарештувати».
theological_decisions:
- issue: Смисловий діапазон λῃστής у риторичному запитанні Ісуса
  choice: розбійник
  alternative: бандит; повстанець
  rationale: Контекст наголошує, що з Ісусом поводяться як із небезпечним злочинцем. Основний текст не нав’язує конкретного політичного значення, а ширший можливий відтінок збережено в примітці.
translation_notes:
  register: Сучасна стандартна українська мова; виклад природний і гідний, без архаїзмів. Риторична гострота запитання збережена часткою «невже». Займенник «мене» подано з малої літери відповідно до нейтральної сучасної норми.
