  text: λέγω δὲ ⸀ὑμῖν, οὐ μὴ πίω ἀπ’ ἄρτι ἐκ τούτου τοῦ γενήματος τῆς ἀμπέλου ἕως τῆς ἡμέρας ἐκείνης ὅταν αὐτὸ πίνω μεθ’ ὑμῶν καινὸν ἐν τῇ βασιλείᾳ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/029.yaml
  text: But I tell you[a], from now on I will certainly not drink from this fruit of the vine until that day when I drink it new with you in the kingdom of my Father.
translation:
  language: uk
  text: 'Та кажу вам: віднині я вже не питиму цього плоду виноградної лози аж до того дня, коли питиму його новим з вами у Царстві мого Отця.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Та кажу вам
  rationale: Частка δέ позначає легкий перехід або протиставлення; «Та» природно передає цей зв’язок, не посилюючи його надмірно.
- source_word: οὐ μὴ πίω
  choice: я вже не питиму
  rationale: Поєднання οὐ μή з аористним кон’юнктивом виражає сильне заперечення майбутньої дії. «Вже не питиму» разом із «аж до» природно передає рішучість і визначену часову межу.
- source_word: ἀπ’ ἄρτι
  choice: віднині
  rationale: Стисле й сучасне слово точно позначає початок періоду від теперішньої миті.
- source_word: ἐκ τούτου τοῦ γενήματος τῆς ἀμπέλου
  choice: цього плоду виноградної лози
  rationale: Збережено образний вислів оригіналу, а не замінено його словом «вино»; уточнення «виноградної» робить український вислів однозначним і природним.
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: аж до того дня
  rationale: «Того дня» зберігає вказівну силу ἐκείνης, а «аж до» виразно передає часову межу.
- source_word: ὅταν αὐτὸ πίνω
  choice: коли питиму його
  rationale: Майбутня щодо моменту мовлення подія природно передана українським майбутнім часом; займенник «його» відсилає до плоду виноградної лози, тобто вмісту чаші.
- source_word: καινὸν
  choice: новим
  rationale: Форма «новим» зберігає прикметникове, предикативне вживання καινόν та не звужує значення до «знову» або «по-новому».
- source_word: μεθ’ ὑμῶν
  choice: з вами
  rationale: Прямий і природний відповідник значення спільної участі.
- source_word: ἐν τῇ βασιλείᾳ τοῦ πατρός μου
  choice: у Царстві мого Отця
  rationale: Формулювання близьке до грецької структури та зберігає урочистий характер вислову.
theological_decisions:
- issue: Чи називати вміст чаші прямо вином
  choice: У головному тексті збережено вислів «плід виноградної лози»
  alternative: вино
  rationale: Оригінал уживає γένημα τῆς ἀμπέλου, а не οἶνος. Збереження образного вислову не додає до тексту зайвої сакраментальної або символічної конкретизації.
- issue: Значення καινὸν в есхатологічній трапезі
  choice: У головному тексті вжито «новим» без уточнення характеру новизни
  alternative: по-новому; знову
  rationale: Прикметник може означати нове за якістю або способом, але сам вірш не визначає нюанс остаточно. Буквальніше «новим» зберігає цю смислову відкритість, а можливий інший відтінок подано в примітці.
translation_notes:
  register: Сучасна стандартна українська мова з урочистим, але зрозумілим біблійним регістром. Збережено образність оригіналу та неоднозначність слова καινόν; уникнуто архаїзмів і конфесійно навантажених уточнень.
