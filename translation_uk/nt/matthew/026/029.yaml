  rationale: Внесено лише стилістично-синтаксичну перестановку «новим», щоб усунути небажану прив’язку цього слова до «з вами». Основний текст і далі передає καινόν як прикметникове «новим», не вирішуючи наперед, чи йдеться про нову якість, новий стан або новий спосіб; альтернативу подано в примітці.
