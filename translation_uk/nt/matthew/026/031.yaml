id: MAT.26.31
reference: Matthew 26:31
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Τότε λέγει αὐτοῖς ὁ Ἰησοῦς· Πάντες ὑμεῖς σκανδαλισθήσεσθε ἐν ἐμοὶ ἐν τῇ νυκτὶ ταύτῃ, γέγραπται γάρ· Πατάξω τὸν ποιμένα, καὶ ⸀διασκορπισθήσονται τὰ πρόβατα τῆς ποίμνης·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/031.yaml
  text: 'Then Jesus says to them[a], “You will all fall away because of me this night, for it is written: ‘I will strike the shepherd[c][b], and the sheep of the flock will be scattered.’”'
translation:
  language: uk
  text: 'Тоді Ісус каже їм: «Усі ви цієї ночі[b] відступитеся через Мене[a], бо написано: “Уражу пастиря, і розпорошаться вівці отари”[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «спіткнетеся», «втратите стійкість» чи «образитеся». Грецьке слово має широкий діапазон значень — від спотикання до відступу; тут контекст указує на те, що учні покинуть Ісуса.
    reason: lexical_alternative
  - marker: b
    text: Або «сьогодні вночі».
    reason: lexical_alternative
  - marker: c
    text: Цитата із Захарії 13:7.
    reason: cross_reference
lexical_decisions:
- source_word: Τότε
  choice: Тоді
  rationale: Природно позначає наступну подію в оповідній послідовності.
- source_word: λέγει
  choice: каже
  rationale: Збережено грецький історичний теперішній час, який надає оповіді безпосередності.
- source_word: Πάντες ὑμεῖς
  choice: Усі ви
  rationale: Передає наголос грецького вислову на всіх учнях без винятку.
- source_word: σκανδαλισθήσεσθε
  choice: відступитеся
  rationale: У контексті йдеться про те, що учні покинуть Ісуса цієї ночі. Водночас примітка зберігає ширший діапазон грецького слова й не ототожнює цей вчинок із остаточним відпадінням.
- source_word: ἐν ἐμοὶ
  choice: через Мене
  rationale: 'Передає причинно-реляційний зміст: те, що станеться з Ісусом, стане для учнів причиною спотикання й відступу.'
- source_word: ἐν τῇ νυκτὶ ταύτῃ
  choice: цієї ночі
  rationale: Близько відтворює грецький вислів і природно звучить у сучасній українській мові.
- source_word: γέγραπται γάρ
  choice: бо написано
  rationale: Усталена й ясна формула введення цитати зі Святого Письма.
- source_word: Πατάξω
  choice: Уражу
  rationale: Передає сильну дію грецького дієслова без архаїчного або надмірно уточненого формулювання.
- source_word: τὸν ποιμένα
  choice: пастиря
  rationale: Зберігає біблійний образ і відповідний піднесений, але зрозумілий регістр.
- source_word: διασκορπισθήσονται
  choice: розпорошаться
  rationale: Природно передає майбутню розсіяність овець, зберігаючи образ цитати.
- source_word: τὰ πρόβατα τῆς ποίμνης
  choice: вівці отари
  rationale: Відтворює обидва наявні в грецькому тексті іменники, не скорочуючи вислів до самих «овець».
theological_decisions:
- issue: Значення σκανδαλισθήσεσθε щодо ставлення учнів до Ісуса
  choice: Учні відступляться через те, що станеться з Ісусом, і покинуть Його тієї ночі.
  alternative: Учні лише образяться на Ісуса або спіткнуться в загальному моральному сенсі.
  rationale: Найближчий контекст і образ розпорошених овець указують на втечу учнів. Формулювання не визначає цей вчинок як остаточне богословське відпадіння.
- issue: Історичний теперішній час λέγει
  choice: каже
  alternative: сказав
  rationale: Теперішній час зберігає оповідну фактуру грецького тексту, не змінюючи змісту.
- issue: Суб’єкт вислову «Уражу пастиря»
  choice: Збережено першу особу без пояснювального уточнення суб’єкта.
  alternative: Додати в тексті пояснення, що промовцем є Бог.
  rationale: Цитату передано у формі, наведеній Матвієм; богословську напругу щодо Божої дії не усунуто пояснювальним перефразуванням.
translation_notes:
  register: Сучасна нормативна українська мова з гідним біблійним регістром. Синтаксис лишається простим і зрозумілим; «пастир» та «отара» зберігають образність цитати, а історичне «каже» — живу оповідну форму оригіналу.
