  text: πάντοτε γὰρ τοὺς πτωχοὺς ἔχετε μεθ’ ἑαυτῶν, ἐμὲ δὲ οὐ πάντοτε ἔχετε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/011.yaml
  text: For you always have the poor with you[a], but you do not always have me.
translation:
  language: uk
  text: Бо бідні завжди з вами[a], а Я не завжди з вами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «бідних людей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: завжди
  rationale: Природно передає постійну наявність і зберігає повторюваний у вірші часовий контраст.
- source_word: γὰρ
  choice: бо
  rationale: Позначає пояснення попереднього вислову; «бо» стисло й природно передає цей зв’язок.
- source_word: τοὺς πτωχοὺς
  choice: бідні
  rationale: Означає бідних людей як групу. Субстантивований прикметник «бідні» є природним і точним українським відповідником.
- source_word: ἔχετε
  choice: з вами
  rationale: У цьому контексті дієслово виражає присутність, а не володіння. Українська конструкція «завжди з вами» природно передає зміст без неприродного «маєте при собі».
- source_word: μεθ’ ἑαυτῶν
  choice: з вами
  rationale: Передає присутність поруч зі слухачами; рефлексивна форма грецького вислову не потребує буквального «із самими собою».
- source_word: ἐμὲ
  choice: Я
  rationale: Через природну українську перебудову речення грецький знахідний «Мене» передано підметом «Я», без зміни референта чи змісту.
- source_word: δὲ
  choice: а
  rationale: «А» виразно й природно позначає контраст між постійною присутністю бідних і обмеженим часом присутності Ісуса.
- source_word: οὐ πάντοτε
  choice: не завжди
  rationale: Точно зберігає заперечення та симетричний контраст із першим «завжди».
theological_decisions:
- issue: Значення присутності Ісуса
  choice: Збережено часовий контраст між постійною присутністю бідних і тимчасовою присутністю Ісуса серед учнів.
  alternative: Розуміти вислів як применшення обов’язку піклуватися про бідних.
  rationale: Грецький текст формулює часовий контраст і не дає підстав додавати моральне знецінення бідних. Переклад не уточнює «тілесна присутність», бо цього слова в самому вірші немає.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Еліптична конструкція «бідні завжди з вами» звучить природніше за буквальне «ви завжди маєте бідних із собою» та однаково передає значення присутності в обох частинах речення.
