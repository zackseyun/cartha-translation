  source_fidelity: «Бо бідні завжди з вами, а Я не завжди з вами» точно передає пояснювальне γάρ, часовий контраст πάντοτε / οὐ πάντοτε та значення тривалої присутності, виражене ἔχετε μεθ’ ἑαυτῶν. Українська перебудова з об’єкта «Мене» на підмет «Я» не змінює змісту й природно передає протиставлення.
