  text: καὶ ἰδοὺ εἷς τῶν μετὰ Ἰησοῦ ἐκτείνας τὴν χεῖρα ἀπέσπασεν τὴν μάχαιραν αὐτοῦ καὶ πατάξας τὸν δοῦλον τοῦ ἀρχιερέως ἀφεῖλεν αὐτοῦ τὸ ὠτίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/051.yaml
  text: And behold[a], one of those with Jesus stretched out his hand, drew his sword, and struck the high priest’s servant, and cut off his ear.
translation:
  language: uk
  text: І ось, один із тих, хто був з Ісусом, простягнув руку, вихопив свій меч, ударив раба первосвященика[a] й відтяв йому вухо.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «слугу».
    reason: Лексична альтернатива для δοῦλος.
lexical_decisions:
- source_word: ἰδοὺ
  choice: ось
  rationale: Зберігає раптовість і виразність грецького оповідного маркера та природно звучить сучасною українською.
- source_word: εἷς τῶν μετὰ Ἰησοῦ
  choice: один із тих, хто був з Ісусом
  rationale: Природно передає партитивну конструкцію, не уточнюючи особи понад сказане в грецькому тексті.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: простягнув руку
  rationale: Передає фізичний рух і послідовність дій, виражену аористовим дієприкметником.
- source_word: ἀπέσπασεν τὴν μάχαιραν αὐτοῦ
  choice: вихопив свого меча
  rationale: «Вихопив» природно описує швидке витягнення зброї; «свого» ясно відносить меч до виконавця дії.
- source_word: μάχαιραν
  choice: меча
  rationale: Звичний і достатньо точний відповідник; конкретизація як короткого меча чи кинджала була б надмірною.
- source_word: πατάξας
  choice: ударив
  rationale: Ясно й сучасно передає завдання насильницького удару.
- source_word: δοῦλον
  choice: раба
  rationale: Передає суспільно-правовий статус залежної людини точніше, ніж м’якше «слуга», не додаючи оцінки від перекладача.
- source_word: ἀρχιερέως
  choice: первосвященника
  rationale: Усталений український відповідник назви цієї посади в юдейському контексті.
- source_word: ἀφεῖλεν αὐτοῦ τὸ ὠτίον
  choice: відтяв йому вухо
  rationale: Природно передає результат удару мечем і зберігає окреме особове дієслово грецького тексту.
- source_word: ὠτίον
  choice: вухо
  rationale: Зменшувальна форма тут не вимагає українського зменшувального відповідника; «мочка вуха» була б невиправданим уточненням.
theological_decisions:
- issue: Передача δοῦλος у конкретному соціальному контексті
  choice: раб
  alternative: слуга
  rationale: У сцені названо залежного члена двору первосвященника; «раб» точніше зберігає соціальну реальність вислову, тоді як «слуга» залишається можливою контекстуальною альтернативою.
translation_notes:
  register: Сучасна, зрозуміла й гідна оповідна українська. Синтаксис зберігає швидку послідовність дій оригіналу без архаїзації; маркер примітки поставлено безпосередньо після слова, якого вона стосується.
