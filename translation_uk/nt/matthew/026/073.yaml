lexical_decisions:
- source_word: μετὰ μικρὸν
  choice: Трохи згодом
  rationale: Природний український часовий вислів, що передає короткий проміжок часу.
- source_word: δὲ
  choice: —
  rationale: Слабкий оповідний сполучник; перехід природно передано порядком речень без окремого слова.
- source_word: προσελθόντες
  choice: підійшли
  rationale: Точно й природно передає рух людей до Петра.
- source_word: οἱ ἑστῶτες
  choice: ті, хто стояв там
  rationale: Зберігає дієприкметниковий зміст оригіналу й не звужує групу до випадкових сторонніх спостерігачів.
- source_word: Ἀληθῶς
  choice: Справді
  rationale: Передає впевнене твердження в живій прямій мові без надмірної урочистості.
- source_word: καὶ σὺ ἐξ αὐτῶν εἶ
  choice: ти теж один із них
  rationale: Природно передає наголошене включення Петра до згаданої групи.
- source_word: καὶ γὰρ
  choice: бо й
  rationale: «Бо» вводить підставу твердження, а підсилювальна частка «й» відтворює καί без неприродної важкості.
- source_word: ἡ λαλιά σου
  choice: твоя говірка
  rationale: «Говірка» охоплює манеру мовлення й мовні особливості, за якими впізнали Петра, не зводячи значення неоднозначного λαλιά лише до вимови.
- source_word: δῆλόν σε ποιεῖ
  choice: тебе виказує
  rationale: Природний український відповідник вислову «робить тебе явним», який зберігає думку про те, що мовлення виявляє належність Петра до групи.
