    reason: lexical_alternative
lexical_decisions:
- source_word: παραδιδοὺς
  choice: той, хто зраджував
  rationale: У розповіді про страждання Ісуса дієслово παραδίδωμι стосується зради Юди, хоча буквально може означати «видавати» або «передавати». Обране формулювання природно передає моральний зміст контексту.
- source_word: σημεῖον
  choice: знак
  rationale: σημεῖον тут означає заздалегідь домовлений розпізнавальний знак; українське «знак» точно й природно передає це значення.
- source_word: Ὃν ἂν φιλήσω
  choice: Кого я поцілую
  rationale: Неозначене відносне речення з ἄν та аористом кон’юнктива передано природною українською конструкцією, що зберігає функцію розпізнання.
- source_word: φιλήσω
  choice: поцілую
  rationale: Дієслово прямо називає поцілунок як розпізнавальний жест; додавання «привітаю поцілунком» було б надмірним уточненням.
- source_word: αὐτός ἐστιν
  choice: Той і є
  rationale: 'Стисле українське формулювання зберігає вказівний наголос грецького вислову й у контексті недвозначно означає: це саме Він.'
- source_word: κρατήσατε
  choice: схопіть
  rationale: κρατέω означає міцно взяти або затримати. «Схопіть» передає фізичну силу наказу, не звужуючи його до формально-правового «заарештуйте».
theological_decisions:
- issue: Моральне забарвлення παραδιδοὺς щодо Юди
  choice: «той, хто зраджував Його»
  alternative: «той, хто видавав Його»
  rationale: Безпосередній контекст змови й упізнання Ісуса показує, що йдеться не про нейтральну передачу, а про зраду. Водночас буквальніший варіант подано у примітці.
translation_notes:
  register: Сучасна стандартна українська, урочиста без архаїзації. Займенник «Його» щодо Ісуса написано з великої літери за поширеною українською біблійною практикою. Сполучник δέ передано як «А», без додавання відсутнього в грецькому тексті часового прислівника.
