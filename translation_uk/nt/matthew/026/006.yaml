translation:
  language: uk
  text: Коли Ісус був у Віфанії, у домі Симона прокаженого[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Прокажений» відтворює грецьке означення, за яким упізнавали Симона. Воно саме по собі не вказує, чи він хворів тоді, чи хворів раніше; грецьке слово могло означати різні шкірні захворювання.
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γενομένου
  choice: Коли Ісус був
  rationale: Родовий абсолют із γίνομαι задає часову обставину сцени. Природне українське «коли Ісус був» передає цю функцію без неприродного буквального «стався/опинився»; δέ тут є слабким переходом і не потребує окремого слова.
- source_word: ἐν Βηθανίᾳ
  choice: у Віфанії
  rationale: Пряме передавання місцевого значення ἐν із традиційною українською формою топоніма.
- source_word: ἐν οἰκίᾳ Σίμωνος
  choice: у домі Симона
  rationale: οἰκία тут позначає місце перебування, а родовий відмінок Σίμωνος — належність дому.
- source_word: τοῦ λεπροῦ
  choice: прокаженого
  rationale: Збережено стислий розповідний епітет Симона. Грецьке λεπρός могло стосуватися ширшого кола шкірних хвороб, ніж сучасна хвороба Гансена, тому уточнення подано у примітці.
theological_decisions:
- issue: Чи означає епітет, що Симон на той час і далі мав проказу
  choice: Зберегти означення «Симона прокаженого», не уточнюючи часу його стану
  alternative: «Симона, який раніше був прокаженим» або «Симона, хворого на шкірну недугу»
  rationale: Грецький текст лише називає Симона за впізнаваним епітетом і не повідомляє, чи він тоді хворів, чи вже був зцілений; переклад не повинен додавати цього висновку.
translation_notes:
  register: Сучасна, природна й гідна українська оповідна мова. Часову конструкцію передано підрядним реченням «Коли…», а кому в кінці збережено, бо вірш синтаксично продовжується далі.
