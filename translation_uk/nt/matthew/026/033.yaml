  text: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ· Εἰ πάντες σκανδαλισθήσονται ἐν σοί, ⸀ἐγὼ οὐδέποτε σκανδαλισθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/033.yaml
  text: But Peter answered him[a], “Even if all fall away because of you, I will never fall away.”
translation:
  language: uk
  text: 'Та Петро відповів Йому: «Навіть якщо всі відступляться через Тебе, я ніколи не відступлюся».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «спіткнуться» чи «будуть спонукані спіткнутися». Грецьке дієслово може означати спіткнутися, зневіритися через когось або відступитися.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ
  choice: Та Петро відповів Йому
  rationale: Дієприкметник ἀποκριθείς разом із εἶπεν утворює звичну грецьку формулу введення прямої мови, яку природно передано одним дієсловом «відповів». Частка δέ тут позначає м’яке протиставлення попереднім словам Ісуса.
- source_word: Εἰ πάντες
  choice: Навіть якщо всі
  rationale: Формальне умовне εἰ в контексті виразного протиставлення Петра всім іншим має допустове забарвлення, природно передане як «навіть якщо».
- source_word: σκανδαλισθήσονται … σκανδαλισθήσομαι
  choice: відступляться … не відступлюся
  rationale: У контексті випробування учнів дієслово σκανδαλίζω означає спіткнутися у вірності й відступити. «Відступитися» передає силу вислову, не перетворюючи його на технічне твердження про остаточне відпадіння.
- source_word: ἐν σοί
  choice: через Тебе
  rationale: У сполученні зі σκανδαλίζω прийменниковий зворот указує на того, через кого або у зв’язку з ким станеться спотикання чи відступ.
- source_word: ἐγὼ οὐδέποτε
  choice: я ніколи
  rationale: Окремо виражений займенник ἐγώ наголошує на протиставленні Петра іншим, а οὐδέποτε є категоричним запереченням у часі.
theological_decisions:
- issue: Значення σκανδαλίζω в контексті невірності учнів
  choice: відступитися
  alternative: спіткнутися; зневіритися; відпасти
  rationale: «Відступитися» природно виражає відмову від вірності Ісусові під тиском обставин, але не визначає, чи є такий відступ остаточним. Примітка зберігає ширший образний діапазон грецького дієслова.
translation_notes:
  register: Сучасна, зрозуміла й гідна оповідна українська. Займенники щодо Ісуса написано з великої літери як стилістичну форму пошани; це не змінює змісту оригіналу. Повтор дієслова збережено, щоб відтворити риторичне протиставлення «всі — я».
