  source_fidelity: 'Першу частину передано точно: «підвівся» відтворює ἀναστάς, «первосвященник» — ὁ ἀρχιερεύς, а «Ти нічого не відповідаєш?» природно передає Οὐδὲν ἀποκρίνῃ;. У другому питанні «Що це вони…» не досить ясно передає вказівний займенник οὗτοι й у сучасній українській може звучати розмовно або зміщувати наголос із змісту свідчення. Відкрите «Що ці люди свідчать проти Тебе?» зберігає еліптичність і судовий зміст грецького питання.'
