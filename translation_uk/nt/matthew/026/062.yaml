base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/062.yaml
  text: And the high priest stood up and said to him[b][a], “Do you give no answer? What is it that these men are testifying against you?”
translation:
  language: uk
  text: 'І первосвященник підвівся та сказав Йому: «Ти нічого не відповідаєш? Що ці люди свідчать проти Тебе?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς
  choice: підвівся
  rationale: Аористовий дієприкметник описує фізичну дію первосвященника перед тим, як він заговорив; «підвівся» природно передає цю дію українською.
- source_word: ὁ ἀρχιερεὺς
  choice: первосвященник
  rationale: Усталена українська назва найвищої юдейської священницької посади в цьому контексті.
- source_word: εἶπεν αὐτῷ
  choice: сказав Йому
  rationale: Збережено займенникове формулювання грецького тексту, не замінюючи його ім’ям Ісуса.
- source_word: Οὐδὲν ἀποκρίνῃ;
  choice: Ти нічого не відповідаєш?
  rationale: Пряме й природне українське питання, яке зберігає заперечний займенник οὐδέν і теперішній час дієслова.
- source_word: τί
  choice: Що це
  rationale: «Що» прямо передає питальний займенник; частка «це» природно оформлює українське запитання й підкреслює зміст висунутих свідчень без уточнення того, чого грецький текст не уточнює.
- source_word: οὗτοί
  choice: вони
  rationale: У контексті вказівний займенник стосується присутніх свідків; українське «вони» у конструкції «Що це вони…» природно зберігає вказівний наголос без додавання іменника «люди» чи «чоловіки».
- source_word: σου ... καταμαρτυροῦσιν
  choice: свідчать проти Тебе
  rationale: Дієслово з родовим займенником має судово-змагальний зміст свідчення проти обвинуваченого; переклад зберігає і юридичний відтінок, і форму теперішнього часу.
theological_decisions: []
translation_notes:
  register: Сучасна, ясна й гідна українська мова. Початкове «І» зберігає καί та оповідний зв’язок із попереднім віршем. Великі літери в займенниках щодо Ісуса відповідають поширеній українській біблійній традиції, не змінюючи змісту оригіналу.
