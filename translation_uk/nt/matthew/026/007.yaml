id: MAT.26.7
reference: Matthew 26:7
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: προσῆλθεν αὐτῷ γυνὴ ⸂ἔχουσα ἀλάβαστρον μύρου⸃ βαρυτίμου καὶ κατέχεεν ἐπὶ ⸂τῆς κεφαλῆς⸃ αὐτοῦ ἀνακειμένου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/007.yaml
  text: a woman came to him holding an alabaster jar of very costly perfume[b][a], and she poured it on his head as he was reclining at the table.
translation:
  language: uk
  text: До нього підійшла жінка з алебастровою посудиною, у якій була дуже дорога пахуча олія[a], і вилила її йому на голову, коли він напівлежав за столом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «дуже дорога пахуча мазь». Грецьке слово μύρον може означати пахучу олію або мазь.'
    reason: lexical_alternative
  - marker: b
    text: Тобто перебував у звичній для тогочасної трапези позі, напівлежачи.
    reason: cultural_note
lexical_decisions:
- source_word: προσῆλθεν αὐτῷ
  choice: до нього підійшла
  rationale: Передає спрямований рух до Ісуса природною сучасною українською мовою.
- source_word: γυνὴ
  choice: жінка
  rationale: У грецькому тексті жінку тут не названо й не описано докладніше.
- source_word: ἔχουσα ἀλάβαστρον
  choice: з алебастровою посудиною
  rationale: Дієприкметник ἔχουσα виражає, що жінка мала при собі посудину; ἀλάβαστρον позначає алебастрову посудину або флакон.
- source_word: μύρου βαρυτίμου
  choice: дуже дорога пахуча олія
  rationale: μύρον може означати ароматичну олію або мазь, а βαρύτιμος підкреслює її надзвичайно високу вартість.
- source_word: κατέχεεν
  choice: вилила
  rationale: Дієслово означає лити або виливати на щось; доконаний вид природно передає аорист у цій розповіді.
- source_word: ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: йому на голову
  rationale: Прямо й природно передає місце, куди було вилито олію.
- source_word: ἀνακειμένου
  choice: коли він напівлежав за столом
  rationale: Передає позу учасника трапези; додане «за столом» робить культурний контекст зрозумілим, а «напівлежав» зберігає значення грецького дієприкметника.
theological_decisions: []
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Уникнуто церковно-термінологічного «миро», оскільки в цьому контексті йдеться загалом про коштовну ароматичну речовину, а не про спеціально визначену обрядову суміш.
