  text: καὶ ⸀προελθὼν μικρὸν ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ προσευχόμενος καὶ λέγων· Πάτερ μου, εἰ δυνατόν ἐστιν, παρελθάτω ἀπ’ ἐμοῦ τὸ ποτήριον τοῦτο· πλὴν οὐχ ὡς ἐγὼ θέλω ἀλλ’ ὡς σύ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/039.yaml
  text: And going a little farther[a], he fell on his face, praying and saying, “My Father, if it is possible, let this cup pass from me; yet not as I will[b], but as you will.”
translation:
  language: uk
  text: 'І, відійшовши трохи далі, він упав долілиць[a] і молився, кажучи: «Отче мій, якщо можливо, нехай обмине мене ця чаша[b]. Проте не як я хочу, а як ти хочеш».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «упав обличчям до землі».'
    reason: lexical_alternative
  - marker: b
    text: «Чаша» — біблійний образ призначеної комусь долі, особливо страждання; пор. Матвія 20:22; 26:42.
    reason: cross_reference
lexical_decisions:
- source_word: προελθὼν μικρὸν
  choice: відійшовши трохи далі
  rationale: Дієприкметник аориста передає дію, що передує головній, а μικρόν у цьому сполученні означає невелику відстань. «Трохи далі» зберігає просторовий і порівняльний відтінок вислову.
- source_word: ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ
  choice: він упав обличчям до землі
  rationale: Грецький ідіоматичний вислів описує падіння долілиць у молитві. Український відповідник природно й виразно передає тілесну позу, не додаючи її тлумачення.
- source_word: προσευχόμενος καὶ λέγων
  choice: молився й казав
  rationale: Два дієприкметники теперішнього часу позначають супровідні одночасні дії. Особові дієслова природніші в сучасній українській оповіді й не змінюють часових зв’язків.
- source_word: Πάτερ μου
  choice: Отче мій
  rationale: Кличний відмінок «Отче» точно передає форму звертання, а «мій» зберігає особисту близькість без додаткового емоційного забарвлення.
- source_word: εἰ δυνατόν ἐστιν
  choice: якщо можливо
  rationale: Стислий природний український вислів точно передає умову, не додаючи вказівного займенника, якого немає в грецькому тексті.
- source_word: παρελθάτω ἀπ’ ἐμοῦ
  choice: нехай обмине мене
  rationale: Форма «нехай обмине» передає прохальну силу імператива, а додаток «мене» природно виражає значення ἀπ’ ἐμοῦ — щоб чаша пройшла повз Ісуса, не випавши йому.
- source_word: τὸ ποτήριον τοῦτο
  choice: ця чаша
  rationale: Збережено буквальний біблійний образ чаші, який у контексті метафорично означає призначену долю, особливо страждання. Пояснювальний переклад у головному тексті звузив би образ.
- source_word: πλὴν
  choice: проте
  rationale: «Проте» природно передає сильне застереження й протиставлення наступної частини молитви попередньому проханню.
- source_word: οὐχ ὡς ἐγὼ θέλω ἀλλ’ ὡς σύ
  choice: не як я хочу, а як ти хочеш
  rationale: Дієслово «хочу» безпосередньо передає θέλω та природно звучить сучасною українською. У другій частині його повторено для ясного відтворення грецького еліпсиса, не змінюючи змісту.
theological_decisions:
- issue: Метафора чаші в молитві Ісуса
  choice: У головному тексті збережено образ «ця чаша».
  alternative: це страждання; ця доля
  rationale: ποτήριον є буквальним словом «чаша», ужитим метафорично в ширшій біблійній традиції. Збереження образу не обмежує його значення лише одним витлумаченням і підтримує міжтекстові зв’язки.
- issue: Воля Ісуса щодо волі Отця
  choice: Перекладено як «не як я хочу, а як ти хочеш».
  alternative: не те, чого я бажаю, а те, чого бажаєш ти; нехай буде не моя воля, а твоя
  rationale: Формулювання зберігає реальність висловленого Ісусом бажання та його підпорядкування Отцеві. Воно не додає іменника «воля», відсутнього в грецькому тексті, і не усуває богословської напруги вислову.
translation_notes:
  register: Сучасна нормативна українська мова з урочистим, але доступним синтаксисом. Займенники на позначення Ісуса й Отця подано з малої літери відповідно до звичайної сучасної орфографічної практики; це не має богословського значення. Образ «чаші» та пряма форма молитви збережені без конфесійного уточнення.
