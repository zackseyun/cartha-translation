  terminology: «Отче мій», «ця чаша» та «не як я хочу, а як ти хочеш» вдало зберігають лексику й богословську стриманість грецького тексту. Примітка до «чаші» доречно пояснює біблійний образ, не зводячи його до одного тлумачення.
