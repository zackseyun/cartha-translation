source:
  edition: SBLGNT
  text: τοῦτο δὲ ὅλον γέγονεν ἵνα πληρωθῶσιν αἱ γραφαὶ τῶν προφητῶν. τότε οἱ μαθηταὶ πάντες ἀφέντες αὐτὸν ἔφυγον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/056.yaml
  text: But all this has happened so that the Scriptures of the prophets might be fulfilled[a]. Then all the disciples left him and fled.
translation:
  language: uk
  text: Але все це сталося, щоб сповнилися Писання пророків. Тоді всі учні, залишивши Його[a], повтікали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «покинувши Його»; у цьому контексті ἀφέντες може мати сильніше значення — залишити напризволяще, покинути.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: Але все це
  rationale: Природно позначає всю попередню ситуацію, а δέ передано м’яким протиставним сполучником «але».
- source_word: γέγονεν
  choice: сталося
  rationale: Український доконаний вид природно передає завершену подію; її актуальний наслідок зрозумілий із контексту.
- source_word: ἵνα πληρωθῶσιν
  choice: щоб сповнилися
  rationale: Зберігає конструкцію мети або наслідку та характерну для Матвія лексику сповнення.
- source_word: αἱ γραφαὶ τῶν προφητῶν
  choice: Писання пророків
  rationale: «Писання» вказує на священні тексти, а стислий родовий відмінок не уточнює понад грецький текст, чи вони написані або промовлені пророками.
- source_word: τότε
  choice: Тоді
  rationale: Природно позначає наступну подію в оповіді.
- source_word: οἱ μαθηταὶ πάντες
  choice: всі учні
  rationale: Передає наголошену повноту πάντες без додавання відсутнього в грецькому тексті присвійного займенника.
- source_word: ἀφέντες αὐτὸν
  choice: залишивши Його
  rationale: Зберігає дієприкметникову конструкцію та основне значення залишення; сильніший контекстуальний відтінок покинення подано в примітці.
- source_word: ἔφυγον
  choice: повтікали
  rationale: Доконане «повтікали» природно передає втечу всіх учнів і добре відтворює завершену послідовну дію.
theological_decisions:
- issue: Сповнення пророчих Писань
  choice: щоб сповнилися Писання пророків
  alternative: щоб справдилося написане пророками
  rationale: Обраний варіант зберігає явну лексику сповнення, множинне поняття Писань і стислий родовий зв’язок, не перетворюючи його на пояснювальний переказ.
translation_notes:
  register: Сучасна нормативна українська мова в гідному оповідному регістрі. «Писання» написано з великої літери як усталене позначення священних текстів; «повтікали» є природним літературним словом, а не розмовним спрощенням.
