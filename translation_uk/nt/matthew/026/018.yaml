source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὑπάγετε εἰς τὴν πόλιν πρὸς τὸν δεῖνα καὶ εἴπατε αὐτῷ· Ὁ διδάσκαλος λέγει· Ὁ καιρός μου ἐγγύς ἐστιν· πρὸς σὲ ποιῶ τὸ πάσχα μετὰ τῶν μαθητῶν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/018.yaml
  text: He said[a], “Go into the city to a certain man and tell him, ‘The Teacher says, “My time is near[c][b]. I am keeping the Passover with you with my disciples.”’”
translation:
  language: uk
  text: 'Він сказав: «Ідіть до міста, до такого-то[a], і скажіть йому: “Учитель каже: Мій час близько. У тебе[b] Я відзначатиму Пасху[c] зі Своїми учнями”».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «до певного чоловіка». Грецький вислів указує на конкретну, але навмисно не названу особу.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «до тебе». У цьому контексті вислів означає святкування Пасхи в адресата — «у тебе» або «у твоєму місці».'
    reason: lexical_alternative
  - marker: c
    text: 'Або: «святкуватиму Пасху» або «дотримуватимуся Пасхи». Грецький вислів буквально означає «роблю Пасху».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑπάγετε
  choice: Ідіть
  rationale: Природний український відповідник наказового способу дієслова руху без додаткового відтінку віддалення.
- source_word: πρὸς τὸν δεῖνα
  choice: до такого-то
  rationale: Передає навмисно не названу, але конкретну особу; українське «такий-то» природне й не вимагає додавати відсутнє в грецькому тексті слово «чоловік».
- source_word: Ὁ διδάσκαλος
  choice: Учитель
  rationale: Звичний і точний відповідник διδάσκαλος як титулу Ісуса в цьому повідомленні.
- source_word: Ὁ καιρός μου ἐγγύς ἐστιν
  choice: Мій час близько
  rationale: Зберігає широту καιρός і не звужує значення до смерті, трапези чи іншої конкретної події.
- source_word: πρὸς σὲ
  choice: у тебе
  rationale: Природно передає контекстуальне значення перебування в адресата, не уточнюючи прямо «у твоєму домі», чого грецький текст не називає.
- source_word: ποιῶ τὸ πάσχα
  choice: звершу Пасху
  rationale: Передає грецький усталений вислів «чинити Пасху» як дотримання пасхальної трапези; урочисте, але зрозуміле українське формулювання.
- source_word: τὸ πάσχα
  choice: Пасху
  rationale: У контексті йдеться про юдейське свято та його обрядове відзначення; традиційна українська назва з великої літери.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: зі Своїми учнями
  rationale: «Учні» є усталеним відповідником μαθηταί; «зі» природне перед сполученням приголосних.
theological_decisions:
- issue: Значення вислову Ісуса про наближення Його καιρός
  choice: Мій час близько
  alternative: Мій призначений час близько; Моя година близько
  rationale: Текст указує на близькість важливого часу, але в самому вірші не визначає його точного обсягу. Загальне «час» зберігає цю богословську й оповідну напругу.
- issue: Значення ποιῶ τὸ πάσχα
  choice: звершу Пасху
  alternative: відсвяткую Пасху; дотримаю Пасху
  rationale: Вислів позначає здійснення пасхального обряду. Переклад не вирішує понад текст усіх хронологічних або літургійних питань, пов’язаних із цією трапезою.
translation_notes:
  register: Сучасна літературна українська з гідним біблійним регістром. «До такого-то» зберігає навмисну неозначеність оригіналу; «у тебе» уникає зайвого уточнення «у твоєму домі». Займенники щодо Ісуса подано з традиційної пошанної великої літери.
