lexical_decisions:
- source_word: Οἱ δὲ κρατήσαντες
  choice: Ті, хто схопив
  rationale: Субстантивований дієприкметник передано природною українською конструкцією «ті, хто»; δέ тут лише м’яко продовжує розповідь і не потребує окремого сполучника. Аорист κρατήσαντες позначає дію, що передувала головній.
- source_word: τὸν Ἰησοῦν
  choice: Ісуса
  rationale: Прямий додаток передано звичною українською формою імені.
- source_word: ἀπήγαγον
  choice: відвели
  rationale: Дієслово означає повести або відвести геть; «відвели» стисло й природно передає рух Ісуса під вартою, не додаючи надмірно юридичного відтінку.
- source_word: πρὸς Καϊάφαν
  choice: до … Каяфи
  rationale: πρός із знахідним відмінком позначає спрямування до особи. Переклад не додає не названого в тексті дому Каяфи й не конкретизує значення як «перед Каяфу».
- source_word: τὸν ἀρχιερέα
  choice: первосвященника
  rationale: У цьому контексті ἀρχιερεύς — усталена назва найвищої священницької посади.
- source_word: ὅπου
  choice: де
  rationale: Природний і точний відповідник грецького прислівника місця.
- source_word: οἱ γραμματεῖς
  choice: книжники
  rationale: Усталений український біблійний термін для знавців і тлумачів Писання в цьому юдейському релігійно-судовому контексті.
- source_word: οἱ πρεσβύτεροι
  choice: старійшини
  rationale: Точно позначає визнаних старших провідників народу, не зводячи поняття лише до віку.
- source_word: συνήχθησαν
  choice: вже зібралися
  rationale: Аорист указує, що на час приведення Ісуса вони були там разом; «вже» природно виявляє цю попередність. Форма допускає також пасивне прочитання «були зібрані».
