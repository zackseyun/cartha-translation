source:
  edition: SBLGNT
  text: Οἴδατε ὅτι μετὰ δύο ἡμέρας τὸ πάσχα γίνεται, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς τὸ σταυρωθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/002.yaml
  text: You know that after two days the Passover is coming[a], and the Son of Man is being handed over to be crucified.
translation:
  language: uk
  text: Ви знаєте, що через два дні настане Пасха, і Сина Людського буде віддано[a] на розп’яття.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «зрадять». Грецьке дієслово може означати зраду, але ширше — «віддати» чи «передати в чиїсь руки».'
    reason: alternative_reading
lexical_decisions:
- source_word: Οἴδατε
  choice: Ви знаєте
  rationale: Форма другої особи множини від οἶδα має теперішнє значення; природний і точний український відповідник.
- source_word: μετὰ δύο ἡμέρας
  choice: через два дні
  rationale: μετά зі знахідним відмінком позначає час після певного проміжку; українське «через два дні» природно передає цей зміст.
- source_word: τὸ πάσχα
  choice: Пасха
  rationale: πάσχα називає юдейську Пасху; додавання слова «свято» не є необхідним і відсутнє в грецькому тексті.
- source_word: γίνεται
  choice: настане
  rationale: У цьому контексті γίνομαι вказує на наближення або настання Пасхи; майбутній вид природно випливає з часової вказівки «через два дні».
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сина Людського
  rationale: Усталений український відповідник самоназви Ісуса, який зберігає її біблійне й богословське звучання; знахідний відмінок зумовлений пасивною конструкцією при дієслові «віддадуть».
- source_word: παραδίδοται
  choice: віддадуть
  rationale: Дієслово має ширше значення передачі або віддання в чиїсь руки й не обмежується зрадою. Неозначено-особова українська конструкція природно передає грецький пасив та майбутню щодо моменту мовлення подію.
- source_word: εἰς τὸ σταυρωθῆναι
  choice: на розп’яття
  rationale: Конструкція εἰς з артикльованим інфінітивом виражає мету або результат; «на розп’яття» стисло й природно передає призначення віддання.
theological_decisions:
- issue: Передача παραδίδοται в провіщенні страстей
  choice: віддадуть
  alternative: зрадять
  rationale: Контекст охоплює зраду Юди, але саме грецьке дієслово ширше й може позначати передачу в чужі руки. «Віддадуть» зберігає напругу між людською зрадою, судовою передачею та ширшим богословським виміром, не звужуючи значення.
translation_notes:
  register: Сучасна стандартна українська, природний і гідний біблійний регістр. «Через два дні» та «настане Пасха» звучать ясно для широкого читача; традиційний титул «Син Людський» збережено.
