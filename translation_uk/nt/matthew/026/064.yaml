  verdict: revise
  source_fidelity: 'Зміст передано точно: звернення переходить від однини «йому» до множини «вам», а образи піднесення праворуч Сили та приходу на хмарах збережено. Проте «праворуч Сили» в українській невиразно передає відношення, яке виражає ἐκ δεξιῶν.'
  naturalness: Текст загалом має належний сучасний урочистий регістр. Формула «праворуч від Сили» є природнішою та яснішою українською. «На хмарах неба» точніше відтворює родовий зворот τοῦ οὐρανοῦ і водночас звучить сучасно.
  terminology: «Син Людський» і «Сила» вдало зберігають біблійний та шанобливий регістр. «Ти це сказав» передає ствердну, але не зведену до простого «так» формулу Σὺ εἶπας без дещо зайвого в українській «сам».
  issues:
  - severity: medium
    issue: «сидить праворуч Сили»
    rationale: Такий зворот може бути прочитаний як розташування праворуч від слова/поняття «Сила» і не є звичним українським способом передати «at the right hand of». «Праворуч від Сили» ясно передає просторово-символічне відношення, не розкриваючи перифразу як «Бог».
  - severity: low
    issue: «Ти сам це сказав»
    rationale: Емфатичне σὺ може мотивувати наголос на «ти», але «сам» у сучасній українській легко набуває додаткового значення «особисто/без сторонньої допомоги». «Ти це сказав» зберігає формулу без такого відтінку.
  - severity: low
    issue: «на хмарах небесних»
    rationale: Вислів можливий, але «на хмарах неба» природніше передає грецьке «τῶν νεφελῶν τοῦ οὐρανοῦ» та не послаблює алюзію на Даниїла 7:13.
