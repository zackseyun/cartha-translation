language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Σὺ εἶπας· πλὴν λέγω ὑμῖν, ἀπ’ ἄρτι ὄψεσθε τὸν υἱὸν τοῦ ἀνθρώπου καθήμενον ἐκ δεξιῶν τῆς δυνάμεως καὶ ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/064.yaml
  text: Jesus said to him[a], “You have said so. But I tell you[c][b], from now on you will see the Son of Man seated at the right hand of Power and coming on the clouds of heaven.”
translation:
  language: uk
  text: 'Ісус сказав йому: «Ти це сказав[a]. Та кажу вам: віднині ви побачите Сина Людського, Який сидить праворуч від Сили[b] й приходить на хмарах неба[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Ти сказав це». Грецький вислів є непрямою ствердною відповіддю.'
    reason: lexical_alternative
  - marker: b
    text: «Сила» — шанобливий спосіб говорити про Бога.
    reason: cultural_note
  - marker: c
    text: Алюзія на Даниїла 7:13 і Псалом 110:1.
    reason: cross_reference
lexical_decisions:
- source_word: Σὺ εἶπας
  choice: Ти сам це сказав
  rationale: Зберігає грецьку форму непрямої, але ствердної відповіді й не перетворює її ані на просте «так», ані на ухилення від відповіді.
- source_word: πλὴν
  choice: Та
  rationale: Природно передає сильний протиставний перехід до урочистої заяви Ісуса.
- source_word: ἀπ’ ἄρτι
  choice: віднині
  rationale: Стисло й природно позначає початок нового стану справ від цього моменту, не звужуючи вислів до миттєвого здійснення.
- source_word: ὄψεσθε
  choice: ви побачите
  rationale: Прямо передає майбутню форму ὁράω; множина «ви» відтворює перехід від звернення до первосвященника до ширшої аудиторії.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Сина Людського
  rationale: Зберігає усталене біблійне найменування та його зв’язок із Даниїла 7.
- source_word: καθήμενον
  choice: Який сидить
  rationale: Природно передає дієприкметник і водночас дозволяє контекстові Псалма 110 виражати образ царського піднесення без доданого тлумачення.
- source_word: ἐκ δεξιῶν
  choice: праворуч
  rationale: Сучасний природний український відповідник просторово-символічного вислову про місце честі й влади.
- source_word: τῆς δυνάμεως
  choice: Сили
  rationale: Зберігає шанобливе непряме позначення Бога, не замінюючи його пояснювальним «Бога».
- source_word: ἐρχόμενον
  choice: приходить
  rationale: Зберігає рух і біблійну образність алюзії на Даниїла 7:13.
- source_word: ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: на хмарах небесних
  rationale: Прозоро передає грецький прийменниковий вислів і зберігає його урочисте біблійне звучання.
theological_decisions:
- issue: Сила відповіді Σὺ εἶπας
  choice: 'Ствердна, але не зведена до прямого «так»: «Ти сам це сказав».'
  alternative: «Так» або розуміння вислову як ухильної відповіді.
  rationale: Формула приймає зміст сказаного первосвященником, однак переклад зберігає власне формулювання Ісуса та його відтінок.
- issue: Значення τῆς δυνάμεως
  choice: Збережено шанобливе позначення Бога словом «Сила».
  alternative: Явно перекласти «Бога» або «Всемогутнього».
  rationale: Референтом, найімовірніше, є Бог, проте пряме називання усунуло б стриманість і особливий регістр оригіналу.
- issue: Часовий і есхатологічний обсяг «ви побачите»
  choice: Переклад поєднує сидіння праворуч Сили та прихід на хмарах, не встановлюючи окремої часової схеми.
  alternative: Віднести все лише до найближчого майбутнього або виключно до остаточного другого приходу.
  rationale: Обидва дієприкметникові образи в грецькому тексті разом залежать від «побачите»; переклад зберігає цю напругу та міжтекстову багатозначність.
translation_notes:
  register: Сучасна стандартна українська з гідним, урочистим звучанням. Усталені біблійні назви й образи збережено, але архаїчних форм уникнуто. Займенник «Який» пишеться з великої літери відповідно до поширеної української практики шанобливого позначення Христа; «ви» передає граматичну множину.
