  rationale: Виправлено два українські звороти для ясності й природності, зберігши всі смислові компоненти оригіналу, шанобливу перифразу «Сила», граматичний перехід до множини «вам» і невизначений щодо часової схеми зв’язок між сидінням праворуч та приходом на хмарах. Виноски та їхні прив’язки збережено.
