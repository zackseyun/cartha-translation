source:
  edition: SBLGNT
  text: τότε ὁ ἀρχιερεὺς διέρρηξεν τὰ ἱμάτια αὐτοῦ ⸀λέγων· Ἐβλασφήμησεν· τί ἔτι χρείαν ἔχομεν μαρτύρων; ἴδε νῦν ἠκούσατε τὴν ⸀βλασφημίαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/065.yaml
  text: Then the high priest tore his garments[a], saying, “He has blasphemed! What further need do we have of witnesses? See[b], now you have heard the blasphemy.”
translation:
  language: uk
  text: 'Тоді первосвященник роздер свій одяг[a] і сказав: «Він учинив богохульство! Навіщо нам іще свідки? Ось, ви щойно почули богохульство».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Роздирання одягу було прилюдним знаком потрясіння, скорботи або обурення.
    reason: cultural_note
lexical_decisions:
- source_word: τότε
  choice: Тоді
  rationale: Природний український часовий сполучник, що передає послідовність подій.
- source_word: ὁ ἀρχιερεὺς
  choice: первосвященник
  rationale: Усталена назва єдиного носія найвищої священницької посади в юдейському контексті.
- source_word: διέρρηξεν τὰ ἱμάτια αὐτοῦ
  choice: роздер свій одяг
  rationale: «Роздер» точно передає сильну завершену дію; збірне «одяг» природне українською й не звужує значення до спеціального вбрання.
- source_word: λέγων
  choice: і сказав
  rationale: Особова конструкція природніша сучасною українською та зберігає одночасний зв’язок із попередньою дією.
- source_word: Ἐβλασφήμησεν
  choice: Він зневажив Бога
  rationale: Природно передає релігійно-правове звинувачення в богозневазі без архаїчного чи малозрозумілого дієслова; доданий об’єкт виражає закладений у контексті зміст терміна.
- source_word: τί ἔτι χρείαν ἔχομεν μαρτύρων;
  choice: Навіщо нам іще свідки?
  rationale: Стисла й природна українська питальна конструкція, що точно передає відмову від подальшої потреби у свідках.
- source_word: ἴδε νῦν
  choice: Ось, тепер
  rationale: «Ось» природно виконує вказівно-дискурсивну функцію ἴδε, а «тепер» явно зберігає νῦν.
- source_word: ἠκούσατε τὴν βλασφημίαν
  choice: ви почули цю богозневагу
  rationale: Минулий доконаний вид передає щойно завершене слухання; «цю» природно вказує на конкретні слова, які первосвященник характеризує як богозневагу.
theological_decisions:
- issue: Передача звинувачення βλασφημέω / βλασφημία
  choice: «зневажив Бога» / «богозневагу» як слова звинувачення первосвященника
  alternative: «богохульствував» / «богохульство»
  rationale: Обране формулювання зрозуміле сучасному читачеві й зберігає релігійно-правову вагу звинувачення. Пряма мова показує, що це оцінка первосвященника, а не окреме твердження оповідача про провину Ісуса.
translation_notes:
  register: Сучасна стандартна українська мова; виклад урочистий, але доступний. Уникнено архаїчного «ризи» та конфесійно забарвлених розширень. Маркер [a] стоїть безпосередньо після вислову, якого стосується культурна примітка.
