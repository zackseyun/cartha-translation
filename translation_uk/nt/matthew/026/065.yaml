revisions:
- from: 'Тоді первосвященник роздер свій одяг[a] і сказав: «Він зневажив Бога! Навіщо нам іще свідки? Ось, тепер ви почули цю богозневагу».'
  to: 'Тоді первосвященник роздер свій одяг[a] і сказав: «Він учинив богохульство! Навіщо нам іще свідки? Ось, ви щойно почули богохульство».'
  rationale: The revision removes the added explicit object «Бога» and restores the Greek accusation's established legal-religious terminology. It also replaces the unnecessary demonstrative «цю» with idiomatic Ukrainian and renders νῦν's immediate force as «щойно». The cultural footnote remains correctly anchored to «одяг».
  reviewer_model: gpt-5.6-terra
