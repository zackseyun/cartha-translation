    reason: cultural_note
  revision_rationale: The revision removes the added explicit object «Бога» and restores the Greek accusation's established legal-religious terminology. It also replaces the unnecessary demonstrative «цю» with idiomatic Ukrainian and renders νῦν's immediate force as «щойно». The cultural footnote remains correctly anchored to «одяг».
