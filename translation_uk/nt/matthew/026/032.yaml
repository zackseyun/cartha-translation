lexical_decisions:
- source_word: μετὰ δὲ
  choice: Але після того, як
  rationale: μετά з артикльованим інфінітивом позначає наступність у часі — «після того, як», а δέ тут передає м’яке протиставлення попередньому провіщенню про відступ учнів.
- source_word: τὸ ἐγερθῆναί με
  choice: Я буду воскрешений
  rationale: Артикльований аористний пасивний інфінітив ἐγείρω з με як логічним підметом буквально означає «після того, як Я буду воскрешений». Пасивну форму збережено; вона допускає божественну дію, але прямо її не називає.
- source_word: προάξω
  choice: Я піду попереду
  rationale: У цьому контексті προάγω означає йти раніше або попереду когось. Українське «піду попереду вас» природно зберігає просторово-часовий зміст, не додаючи обов’язкового значення формального проводу.
- source_word: ὑμᾶς
  choice: вас
  rationale: Знахідний відмінок займенника другої особи множини; українська форма «вас» однозначно передає множину.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: до Галілеї
  rationale: εἰς виражає рух у напрямку місця. Для назви регіону сучасне українське «до Галілеї» є природнішим за буквальне «у Галілею» та не втрачає напрямного значення.
theological_decisions:
- issue: Пасивна форма воскресіння в ἐγερθῆναί
  choice: «після того, як Я буду воскрешений» зі збереженням пасивного стану
  alternative: «після того, як Я воскресну»
  rationale: Грецький текст явно має пасивний інфінітив. Переклад зберігає цю форму й можливий натяк на дію Бога, не роблячи виконавця дії явним і не усуваючи властивої тексту неоднозначності.
translation_notes:
  register: Сучасна нормативна українська мова, природний і гідний біблійний стиль. Займенник «Я» написано з великої літери відповідно до поширеної української біблійної практики; синтаксис залишається зрозумілим для широкого кола читачів.
