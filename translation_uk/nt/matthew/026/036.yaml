source:
  edition: SBLGNT
  text: Τότε ἔρχεται μετ’ αὐτῶν ὁ Ἰησοῦς εἰς χωρίον λεγόμενον Γεθσημανί, καὶ λέγει τοῖς μαθηταῖς· Καθίσατε αὐτοῦ ἕως οὗ ἀπελθὼν ⸂ἐκεῖ προσεύξωμαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/036.yaml
  text: Then Jesus comes with them to a place called Gethsemane[a], and he says to the disciples, “Sit here while I go over there and pray.”
translation:
  language: uk
  text: 'Тоді Ісус приходить з ними до місця, що зветься Гефсимані, і каже учням: «Сядьте тут, поки я піду туди й помолюся».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Тоді
  rationale: Природний часовий сполучник, що зберігає послідовність розповіді.
- source_word: ἔρχεται
  choice: приходить
  rationale: Збережено історичний теперішній час грецького тексту для живого перебігу оповіді.
- source_word: μετ’ αὐτῶν
  choice: з ними
  rationale: Безпосередньо передає значення супроводу.
- source_word: χωρίον
  choice: місця
  rationale: Нейтрально передає χωρίον як місце або земельну ділянку, не додаючи запозиченого з Євангелія від Івана уточнення «сад».
- source_word: λεγόμενον
  choice: що зветься
  rationale: Природна сучасна українська формула для назви місцевості.
- source_word: Γεθσημανί
  choice: Гефсимані
  rationale: Усталена українська біблійна передача власної назви.
- source_word: λέγει
  choice: каже
  rationale: Збережено історичний теперішній час відповідно до грецького тексту.
- source_word: Καθίσατε
  choice: Посидьте
  rationale: У контексті тимчасового очікування природніше за буквальне «Сядьте» та передає наказ залишатися сидіти протягом певного часу.
- source_word: αὐτοῦ
  choice: тут
  rationale: Природний відповідник прислівника місця.
- source_word: ἕως οὗ
  choice: поки
  rationale: Зберігає часову межу, виражену конструкцією «аж доки / поки», і водночас звучить природно українською.
- source_word: ἀπελθὼν
  choice: відійду
  rationale: Передає рух від учнів і природно розгортає грецький дієприкметник у особову форму.
- source_word: ἐκεῖ
  choice: туди
  rationale: Чітко передає напрямок до іншого місця та протиставлення слову «тут».
- source_word: προσεύξωμαι
  choice: помолюся
  rationale: Аористний кон’юнктив у часовій конструкції природно передано доконаним майбутнім у першій особі.
theological_decisions:
- issue: Характер місця Гефсимані
  choice: «місця»
  alternative: «саду»
  rationale: Матвій уживає широке слово χωρίον і не називає це місце садом; варіант «сад» додавав би відомість з Ів. 18:1.
translation_notes:
  register: 'Сучасна літературна українська з гідним, доступним оповідним стилем. Історичні теперішні форми «приходить» і «каже» збережено. Виноски не потрібні: українське «поки» природно охоплює часовий відтінок ἕως οὗ без втрати змісту.'
