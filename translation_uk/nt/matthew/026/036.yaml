review_pass:
  verdict: revise
  source_fidelity: Загалом переклад точно передає послідовність розповіді, історичні теперішні форми, нейтральне χωρίον («місце») та просторовий контраст «тут—туди». Проте «Посидьте» може означати «посидьте деякий час» і дещо послаблює простий наказ Καθίσατε «сядьте».
  naturalness: «Сядьте тут, поки я піду туди й помолюся» є природнішою сучасною конструкцією. Вона чітко виражає тимчасову межу ἕως οὗ без стилістично менш прямого «відійду туди».
  terminology: «Гефсимані» — усталена українська передача назви. «Місце» належно не нав’язує тлумачення «сад». Богословськи навантажених термінів у вірші немає.
  issues:
  - severity: low
    issue: «Посидьте» замість «Сядьте»
    rationale: Καθίσατε є простим аористовим наказом сісти. Контекст «поки...» уже повідомляє, що учні мають лишатися там; «посидьте» додає відтінок нетривалого сидіння.
  - severity: low
    issue: «відійду туди»
    rationale: Хоча «відійду» можливе для ἀπελθὼν, у цій репліці «піду туди» природніше українською і прямо передає рух до відмінного місця, позначеного ἐκεῖ.
