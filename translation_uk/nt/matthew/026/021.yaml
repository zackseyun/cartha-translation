source:
  edition: SBLGNT
  text: καὶ ἐσθιόντων αὐτῶν εἶπεν· Ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/021.yaml
  text: And while they were eating[a], he said, “Truly I tell you, one of you will betray me.”
translation:
  language: uk
  text: 'Коли вони їли, він сказав: «Істинно кажу вам: один із вас зрадить мене[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або, буквальніше: «видасть мене» чи «передасть мене».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσθιόντων αὐτῶν
  choice: коли вони їли
  rationale: Родовий абсолют виражає одночасну дію; цей варіант природно й точно передає часовий зв’язок.
- source_word: Ἀμὴν
  choice: істинно
  rationale: На початку вислову Ісуса це слово є урочистим підтвердженням правдивості й авторитетності сказаного; «істинно» зберігає цю силу без надмірно церковного забарвлення.
- source_word: λέγω ὑμῖν
  choice: кажу вам
  rationale: Прямий і природний відповідник усталеної мовної формули, що зберігає звернення до слухачів.
- source_word: εἷς ἐξ ὑμῶν
  choice: один із вас
  rationale: Природний український відповідник часткового звороту.
- source_word: παραδώσει
  choice: зрадить
  rationale: Дієслово буквально має ширше значення «передасть» або «видасть», але в цьому контексті йдеться про віроломну передачу Ісуса ворогам; «зрадить» природно передає контекстуальний зміст. Майбутній час збережено.
- source_word: με
  choice: мене
  rationale: Прямий додаток, що стосується Ісуса; розширення не потрібне.
theological_decisions:
- issue: Передача παραδώσει в контексті страстей
  choice: зрадить
  alternative: видасть мене / передасть мене
  rationale: Грецьке дієслово саме по собі ширше за поняття зради, однак у цьому епізоді воно означає віроломну передачу Ісуса одним із його учнів. Основний текст передає контекстуальний зміст, а примітка зберігає ширший буквальний сенс.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Формула «Істинно кажу вам» зберігає урочистість оригіналу, не вдаючись до архаїчного «воістину». Маркер примітки поставлено після слова, якого стосується лексична альтернатива.
