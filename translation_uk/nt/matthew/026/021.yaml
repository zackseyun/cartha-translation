  source_fidelity: 'Текст точно передає всі складники грецького оригіналу: родовий абсолют як одночасну дію («Коли вони їли»), урочисту формулу Ἀμὴν λέγω ὑμῖν («Істинно кажу вам»), частковий вислів «один із вас» і майбутню дію παραδώσει. Основне «зрадить мене» адекватно передає значення в цьому наративному контексті, а примітка належно зберігає ширші буквальні відповідники дієслова.'
