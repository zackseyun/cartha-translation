source:
  edition: SBLGNT
  text: τότε ἔρχεται πρὸς τοὺς ⸀μαθητὰς καὶ λέγει αὐτοῖς· Καθεύδετε ⸀τὸ λοιπὸν καὶ ἀναπαύεσθε· ἰδοὺ ἤγγικεν ἡ ὥρα καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς χεῖρας ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/045.yaml
  text: Then he comes to the disciples and says to them[a], “Sleep on now and take your rest. Look, the hour has drawn near[c][b], and the Son of Man is being handed over into the hands of sinners.”
translation:
  language: uk
  text: 'Тоді Він приходить до учнів і каже їм[a]: «Тепер спіть і відпочивайте. Ось година наблизилася[b], і Син Людський віддається[c] в руки грішників».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Ви все ще спите й відпочиваєте?» Грецьке формулювання можна зрозуміти як риторичне запитання; основний текст зберігає можливу іронію вислову.'
    reason: alternative_reading
  - marker: b
    text: 'Або: «година настала» чи «година вже близько».'
    reason: lexical_alternative
  - marker: c
    text: 'Або: «передається» чи, вужче за значенням, «зраджується». Грецьке слово загалом означає «передавати, віддавати».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Тоді
  rationale: Природний часовий сполучник, що позначає наступну подію в оповіді.
- source_word: ἔρχεται
  choice: приходить
  rationale: Збережено історичний теперішній час, характерний для євангельської оповіді.
- source_word: πρὸς τοὺς μαθητάς
  choice: до учнів
  rationale: Природно передає рух у напрямку до учнів.
- source_word: λέγει αὐτοῖς
  choice: каже їм
  rationale: Збережено історичний теперішній час і прямий зміст вислову.
- source_word: Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε
  choice: Спіть уже й відпочивайте
  rationale: Передає поверхневу форму наказу та лишає відкритими іронічне, поступове або риторично-питальне прочитання; «уже» природно передає τὸ λοιπὸν у цьому контексті.
- source_word: ἰδοὺ
  choice: Ось
  rationale: Сучасний і гідний український засіб привернути урочисту увагу.
- source_word: ἤγγικεν ἡ ὥρα
  choice: наблизилася година
  rationale: Перфект ἐγγίζω позначає близькість, що вже настала; формулювання природне українською і не звужує значення до самого лише «настала».
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Син Людський
  rationale: Усталене й богословськи значуще найменування Ісуса, передане без перефразування.
- source_word: παραδίδοται
  choice: передається
  rationale: Зберігає ширше значення παραδίδωμι та теперішній пасив, не звужуючи вислів лише до зради Юди.
- source_word: εἰς χεῖρας ἁμαρτωλῶν
  choice: в руки грішників
  rationale: Збережено зрозумілий конкретний образ грецького вислову.
theological_decisions:
- issue: Сила вислову Καθεύδετε ... καὶ ἀναπαύεσθε
  choice: «Спіть уже й відпочивайте» — формально як наказ із можливою іронічною або поступовою силою.
  alternative: «Ви все ще спите й відпочиваєте?» або прямий наказ без іронії.
  rationale: Грецьке формулювання в контексті допускає риторичне питання або іронічно-поступовий наказ. Основний текст не розв’язує цю напругу однозначно, а примітка повідомляє альтернативу.
- issue: Значення παραδίδοται в оповіді про страсті
  choice: «передається»
  alternative: «зраджується» або «видається»
  rationale: «Передається» охоплює і людську зраду, і ширший процес віддання Ісуса в руки ворогів, не нав’язуючи вужчого тлумачення.
translation_notes:
  register: Сучасна стандартна українська мова; оповідь зберігає історичний теперішній час. Стиль природний, доступний і водночас гідний; неоднозначність першого речення та широта значення παραδίδοται збережені й пояснені в примітках.
