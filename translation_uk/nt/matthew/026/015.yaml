  source_fidelity: 'Переклад точно передає запит Юди: «Що ви готові дати мені?» відтворює вольовий відтінок θέλετε, а «і я передам Його вам» зберігає нейтральнішу семантику παραδώσω. «Вони ж» належно передає слабкий зв’язок οἱ δέ. «Відважили йому тридцять срібняків» адекватно передає платіжний контекст ἔστησαν αὐτῷ τριάκοντα ἀργύρια, не додаючи назви номіналу.'
