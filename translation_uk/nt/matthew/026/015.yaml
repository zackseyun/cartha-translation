  text: εἶπεν· Τί θέλετέ μοι δοῦναι κἀγὼ ὑμῖν παραδώσω αὐτόν; οἱ δὲ ἔστησαν αὐτῷ τριάκοντα ἀργύρια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/015.yaml
  text: He said[a], “What are you willing to give me, and I will hand him over to you?” And they weighed out for him thirty pieces of silver.
translation:
  language: uk
  text: 'Він сказав: «Що ви готові дати мені, і я передам Його вам[a]?» Вони ж відважили йому тридцять срібняків.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «видам Його вам» чи, за змістом у цьому контексті, «зраджу Його вам». Грецьке дієслово може означати «передати», «видати» або, в цьому контексті, «зрадити».
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί θέλετέ μοι δοῦναι
  choice: Що ви готові дати мені
  rationale: θέλω виражає бажання або готовність; у контексті домовленості «готові дати» природно передає вольовий відтінок.
- source_word: κἀγὼ ὑμῖν παραδώσω αὐτόν
  choice: і я передам Його вам
  rationale: παραδίδωμι має ширше значення «передавати, видавати»; «передам» зберігає цю широту, тоді як «зраджу» прямо називає моральну оцінку вчинку.
- source_word: οἱ δὲ
  choice: Вони ж
  rationale: δέ — слабкий сполучний або протиставний елемент; частка «ж» природно позначає перехід до їхньої відповіді, не посилюючи протиставлення.
- source_word: ἔστησαν αὐτῷ
  choice: відважили йому
  rationale: У цьому платіжному контексті та на тлі формулювання Захарії 11:12 дієслово вказує на відмірювання срібла; «відважили» зберігає конкретний торговельний образ, а не узагальнює його як «заплатили».
- source_word: τριάκοντα ἀργύρια
  choice: тридцять срібняків
  rationale: ἀργύρια означає срібні гроші або срібні монети без назви конкретного номіналу. «Срібняки» — зрозумілий усталений український відповідник, який не додає відсутньої в тексті грошової одиниці.
theological_decisions:
- issue: Передача παραδώσω у пропозиції Юди
  choice: передам Його вам
  alternative: видам Його вам; зраджу Його вам
  rationale: «Передам» зберігає ширший лексичний зміст дієслова й не вбудовує в саме слово повну моральну оцінку дії. Значення зради безперечно випливає з контексту й зазначене у примітці.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Збережено пряму координацію грецької репліки («і я передам»), а усталене «срібняків» ужито без уточнення номіналу.
