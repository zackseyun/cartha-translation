  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ὁ ἐμβάψας μετ’ ἐμοῦ ⸂τὴν χεῖρα ἐν τῷ τρυβλίῳ⸃ οὗτός με παραδώσει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/023.yaml
  text: He answered[b][a], “The one who dipped his hand with me in the bowl—this one will betray me.”
translation:
  language: uk
  text: 'Він відповів: «Той, хто разом зі Мною вмочив руку в миску[a], — саме він зрадить Мене[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «в блюдо».
    reason: lexical_alternative
  - marker: b
    text: Або «видасть Мене».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Він відповів
  rationale: Дієприкметник із особовою формою дієслова тут становить звичний семітизований вислів зі значенням «відповів»; буквальне «відповівши, сказав» було б неприродним українською.
- source_word: ἐμβάψας
  choice: вмочив
  rationale: Аористовий дієприкметник позначає завершену дію, за якою Ісус указує на зрадника; «вмочив» природно й точно передає дію занурення руки до посудини.
- source_word: μετ’ ἐμοῦ
  choice: разом зі Мною
  rationale: Передає супровід і спільність дії, виражені μετά з родовим відмінком; «разом» робить цей зв’язок виразним у природній українській мові.
- source_word: τὴν χεῖρα
  choice: руку
  rationale: В українській належність частини тіла суб’єктові зрозуміла з контексту, тому додавання присвійного займенника не потрібне.
- source_word: ἐν τῷ τρυβλίῳ
  choice: в миску
  rationale: τρύβλιον означає посудину для їжі — миску або блюдо. «Миска» є звичайним сучасним відповідником; можливість «блюдо» подано в примітці.
- source_word: οὗτός
  choice: саме він
  rationale: Зберігає наголошувальну силу вказівного займенника, водночас звучить природніше українською, ніж буквальне «цей» у цьому реченні.
- source_word: παραδώσει
  choice: зрадить
  rationale: У контексті розповіді про Юду дієслово позначає підступну передачу Ісуса ворогам; «зрадить» передає контекстуальний сенс, а буквальніше «видасть» збережено в примітці.
theological_decisions:
- issue: Передача παραδίδωμι в контексті вчинку Юди
  choice: зрадить
  alternative: видасть
  rationale: Дієслово саме по собі може означати «передати» або «видати», але тут стосунковий і оповідний контекст надає дії значення зради. Основний текст передає цей контекстуальний сенс, не втрачаючи буквальнішої альтернативи завдяки примітці.
translation_notes:
  register: Сучасна стандартна українська, природний і гідний стиль прямої мови. Велика літера в займенниках «Мною», «Мене» вжита як усталена шаноблива біблійна практика; вона не змінює зміст оригіналу. Конструкція «саме він» зберігає емфазу οὗτός без неприродного буквалізму.
