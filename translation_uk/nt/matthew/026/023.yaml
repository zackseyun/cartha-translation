  source_fidelity: 'Текст точно передає зміст SBLGNT: скорочена українська форма «Він відповів» природно відтворює ἀποκριθεὶς εἶπεν; «вмочив руку ... в миску» передає ἐμβάψας τὴν χεῖρα ἐν τῷ τρυβλίῳ; «разом зі Мною» відповідає μετ’ ἐμοῦ; «саме він» адекватно зберігає емфазу οὗτός; «зрадить» є обґрунтованим контекстуальним переданням παραδώσει. Значеннєво важливі буквальніші альтернативи належно подано в примітках.'
  naturalness: Фраза звучить природно в сучасній стандартній українській і зберігає гідний, неархаїчний регістр прямої мови. Конструкція «Той, хто ... , — саме він» виразна й стилістично прийнятна. «Вмочив руку в миску» є звичним і зрозумілим висловом у цьому контексті.
  terminology: «Миска» — ясний сучасний відповідник τρυβλίον; варіант «блюдо» слушно винесено до примітки. «Зрадить» відповідає наративному контексту щодо Юди, а «видасть Мене» у примітці забезпечує прозорість щодо ширшого значення παραδίδωμι. Шанобливе написання займенників з великої літери є допустимою українською біблійною редакційною конвенцією і не додає змісту.
