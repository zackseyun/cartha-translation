  text: τότε λέγει αὐτῷ ὁ Ἰησοῦς· Ἀπόστρεψον ⸂τὴν μάχαιράν σου⸃ εἰς τὸν τόπον αὐτῆς, πάντες γὰρ οἱ λαβόντες μάχαιραν ἐν μαχαίρῃ ⸀ἀπολοῦνται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/052.yaml
  text: Then Jesus said to him[a], “Put your sword back in its place, for all who take up the sword will perish by the sword.”
translation:
  language: uk
  text: 'Тоді Ісус сказав йому: «Поклади свій меч назад, на його місце, бо всі, хто береться за меч[a], від меча й загинуть».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «хто бере меч»; цей вислів, імовірно, означає вдаватися до насильства, а не просто брати зброю до рук.
    reason: Лексична альтернатива та пояснення можливого ідіоматичного значення.
lexical_decisions:
- source_word: τότε
  choice: Тоді
  rationale: Природно передає часовий прислівник, що позначає наступну подію в оповіді.
- source_word: λέγει αὐτῷ
  choice: сказав йому
  rationale: Історичний теперішній час природно передано українським минулим часом у послідовній оповіді.
- source_word: Ἀπόστρεψον
  choice: Поверни
  rationale: Аористовий наказовий спосіб вимагає негайної зворотної дії; у контексті йдеться про повернення витягненого меча.
- source_word: τὴν μάχαιράν σου
  choice: свій меч
  rationale: μάχαιρα може означати ніж, кинджал або короткий меч, але «меч» є ясним і усталеним відповідником у цій сцені; зворотний займенник природний українською при тому самому виконавцеві й власникові.
- source_word: εἰς τὸν τόπον αὐτῆς
  choice: на його місце
  rationale: Зберігає образ повернення зброї туди, де вона має бути, не додаючи прямо не названих у грецькому тексті піхов.
- source_word: πάντες γὰρ οἱ λαβόντες μάχαιραν
  choice: бо всі, хто береться за меч
  rationale: Артикльований дієприкметник має узагальнювальну, гномічну силу; «береться за меч» може означати не лише фізичне взяття зброї, а й звернення до насильства.
- source_word: ἐν μαχαίρῃ
  choice: від меча
  rationale: Природний український спосіб передати знаряддя або причину загибелі зі збереженням афористичного паралелізму.
- source_word: ἀπολοῦνται
  choice: загинуть
  rationale: Майбутня форма ἀπόλλυμι тут означає загибель; українське «загинуть» точно й урочисто передає зміст без зайвого уточнення механізму.
theological_decisions:
- issue: Обсяг Ісусового вислову про меч
  choice: 'Передати як загальний принцип: «всі, хто береться за меч, від меча й загинуть».'
  alternative: Тлумачити як абсолютну заборону будь-якого застосування сили або лише як передбачення щодо цієї конкретної миті.
  rationale: Грецька узагальнювальна конструкція охоплює «всіх, хто…». Переклад зберігає широту вислову, не нав’язуючи конфесійного висновку понад те, що прямо сказано.
translation_notes:
  register: Сучасна літературна українська, зрозуміла широкому читачеві; збережено гідний, афористичний тон вислову та повтор слова «меч».
