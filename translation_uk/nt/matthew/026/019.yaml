reference: Matthew 26:19
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: καὶ ἐποίησαν οἱ μαθηταὶ ὡς συνέταξεν αὐτοῖς ὁ Ἰησοῦς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/019.yaml
  text: And the disciples did as Jesus had directed them[a], and they prepared the Passover.
translation:
  language: uk
  text: І учні зробили так, як звелів їм Ісус, і приготували Пасху.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «пасхальну трапезу»; слово πάσχα може означати пасхальне святкування загалом, зокрема й трапезу, яку до нього готували.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν
  choice: зробили
  rationale: У сполученні з ὡς συνέταξεν природно означає, що учні вчинили відповідно до Ісусового розпорядження.
- source_word: οἱ μαθηταὶ
  choice: учні
  rationale: Усталений і природний український відповідник для μαθηταί у Євангеліях, який передає стосунок послідовників до вчителя.
- source_word: ὡς
  choice: так, як
  rationale: Передає відповідність дій учнів тому, що наказав Ісус, і природно звучить сучасною українською.
- source_word: συνέταξεν
  choice: звелів
  rationale: Слово означає наказати, розпорядитися або дати вказівку; «звелів» стисло передає Ісусову владу без неприродної різкості.
- source_word: ἡτοίμασαν
  choice: приготували
  rationale: Прямий і звичний відповідник ἑτοιμάζω в контексті підготовки до Пасхи.
- source_word: τὸ πάσχα
  choice: Пасху
  rationale: Зберігає широту грецького πάσχα, яке може означати свято, пасхальну трапезу або пов’язані з нею елементи; контекстуальну конкретизацію подано у примітці.
- source_word: ὁ Ἰησοῦς
  choice: Ісус
  rationale: Усталена українська форма особового імені.
theological_decisions:
- issue: Обсяг значення τὸ πάσχα
  choice: Пасху
  alternative: пасхальну трапезу; пасхальне ягня
  rationale: У цьому контексті йдеться про приготування до спільної трапези, однак грецький вислів не уточнює, чи мається на увазі саме трапеза, ягня або пасхальне святкування загалом. Основний текст зберігає цю широту, а примітка пояснює можливий вужчий зміст.
translation_notes:
  register: Сучасна стандартна українська мова; виклад стислий, природний і гідний. Дієслово «звелів» передає авторитет розпорядження, а «Пасху» не звужує багатозначність оригіналу.
