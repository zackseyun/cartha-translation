  source_fidelity: 'Текст точно передає структуру й зміст грецького оригіналу: учні виконали те, що Ісус їм звелів, і приготували τὸ πάσχα. «Зробили так, як» природно відтворює ἐποίησαν … ὡς, а «приготували Пасху» зберігає незвужене значення πάσχα.'
