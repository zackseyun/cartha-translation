lexical_decisions:
- source_word: ἐλθὼν
  choice: прийшовши
  rationale: Дієприслівник природно передає аористовий дієприкметник і зберігає його обставинний зв’язок із головним дієсловом.
- source_word: πάλιν
  choice: знову
  rationale: Звичний сучасний відповідник прислівника повторності.
- source_word: εὗρεν
  choice: він знайшов
  rationale: Прямо передає звичайне оповідне значення εὑρίσκω; займенник природно уточнює підмет із контексту.
- source_word: καθεύδοντας
  choice: сплячими
  rationale: Передає тривалий стан учнів у момент, коли Ісус їх знайшов.
- source_word: ἦσαν γὰρ
  choice: бо ... обважніли
  rationale: «Бо» зберігає пояснювальний зв’язок γάρ; український доконаний стан «обважніли» природно виражає результативність конструкції.
- source_word: οἱ ὀφθαλμοὶ
  choice: їхні очі
  rationale: Природне українське відтворення грецької присвійної конструкції αὐτῶν οἱ ὀφθαλμοί.
- source_word: βεβαρημένοι
  choice: обважніли
  rationale: Передає результативний стан перфектного пасивного дієприкметника βαρέω і природно описує очі, що злипаються від сонливості.
