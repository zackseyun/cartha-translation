base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/008.yaml
  text: But when the disciples saw it[a], they were indignant, saying, “Why this waste?”
translation:
  language: uk
  text: 'А коли учні це побачили, то обурилися й сказали: «Навіщо[a] таке марнотратство?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «З якою метою таке марнотратство?»'
    reason: Літеральніший варіант Εἰς τί виразніше формулює запитання про мету.
lexical_decisions:
- source_word: ἰδόντες
  choice: коли ... це побачили
  rationale: Аористовий дієприкметник передано природним українським часовим підрядним реченням. Займенник «це» відсилає до вчинку жінки, який у грецькому тексті мається на увазі, але прямо не названий.
- source_word: δὲ
  choice: А
  rationale: Частка позначає легкий контраст і перехід від учинку жінки до негативної реакції учнів.
- source_word: οἱ μαθηταὶ
  choice: учні
  rationale: Усталений і точний відповідник у євангельській оповіді; присвійний займенник у грецькому тексті відсутній.
- source_word: ἠγανάκτησαν
  choice: обурилися
  rationale: Дієслово виражає сильне невдоволення з відтінком морального осуду; «обурилися» природно передає це українською.
- source_word: λέγοντες
  choice: й сказали
  rationale: Координована конструкція природніша в сучасній українській оповіді та зберігає одночасний зв’язок мовлення з реакцією учнів.
- source_word: Εἰς τί
  choice: Навіщо
  rationale: Ідіоматично передає запитання про мету або сенс дії, не додаючи пояснення.
- source_word: ἡ ἀπώλεια αὕτη
  choice: таке марнотратство
  rationale: У контексті витрачання дорогоцінної пахучої олії ἀπώλεια означає змарнування. «Марнотратство» природно передає осудливу оцінку учнів, а «таке» відповідає вказівному αὕτη.
