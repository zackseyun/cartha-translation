base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/042.yaml
  text: Again[a], a second time he went away and prayed, saying, “My Father, if this cannot pass unless I drink it[b], your will be done.”
translation:
  language: uk
  text: 'Він знову відійшов і вдруге помолився, кажучи: «Отче Мій, якщо це[a] не може минути, хіба що Я вип’ю його[b], нехай буде воля Твоя».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Тобто чаша страждання, згадана в попередньому вірші; грецький текст цього вірша каже лише «це» та «його».
    reason: cross_reference
  - marker: b
    text: 'Або: «якщо це не може минути, якщо Я не вип’ю його».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν ἐκ δευτέρου
  choice: знову … удруге
  rationale: Збережено обидва грецькі елементи повторності без неприродного нагромадження в одному місці.
- source_word: ἀπελθὼν
  choice: відійшовши
  rationale: Дієприслівник природно передає попередню щодо молитви дію аористового дієприкметника.
- source_word: προσηύξατο λέγων
  choice: помолився, кажучи
  rationale: Безпосередньо й гідно передає дію молитви та дієприкметник, який вводить її слова.
- source_word: Πάτερ μου
  choice: Отче Мій
  rationale: Кличний відмінок і присвійний займенник точно передають особисте синівське звертання.
- source_word: εἰ οὐ δύναται τοῦτο παρελθεῖν
  choice: якщо це не може минути
  rationale: Збережено підмет «це» та значення неможливості; не додано відсутнього в цьому вірші слова «чаша» або додатка «Мене».
- source_word: ἐὰν μὴ αὐτὸ πίω
  choice: хіба що Я вип’ю його
  rationale: «Хіба що» природно передає виняткову умову ἐὰν μή, а «його» відсилає до грецького τοῦτο без додавання іменника.
- source_word: γενηθήτω τὸ θέλημά σου
  choice: нехай буде воля Твоя
  rationale: Конструкція з «нехай» передає наказовий спосіб у молитовному вислові та зберігає урочисте звучання.
theological_decisions:
- issue: Чи називати «чашу» безпосередньо в основному тексті
  choice: Залишити «це … його»
  alternative: «ця чаша … її»
  rationale: Контекст Матвія 26:39 однозначно вказує на чашу страждання, однак вірш 26:42 містить лише вказівний і особовий займенники. Основний текст не розгортає їх понад грецьке формулювання, а зв’язок пояснено в примітці.
- issue: Передача молитви покори
  choice: «нехай буде воля Твоя»
  alternative: «хай здійсниться Твоя воля»
  rationale: Обране формулювання зберігає імперативну силу γενηθήτω та перегук із молитвою в Матвія 6:10, не уточнюючи способу здійснення Божої волі.
translation_notes:
  register: Сучасна нормативна українська мова з гідним молитовним регістром. Займенники, що стосуються Ісуса й Отця, подано з великої літери як стилістичну ознаку сакрального тексту; синтаксис лишається зрозумілим для широкого читача.
