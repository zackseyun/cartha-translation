    rationale: 'У фразі «де тільки по всьому світу звіщатимуть» прислівникові компоненти конкурують за сферу дії. «Де б у всьому світі не звіщали» ясно виражає: у будь-якому місці в межах усього світу.'
  - severity: low
    issue: Велика літера в «Добру Звістку» не потрібна для лексичного перекладу.
    rationale: Грецький текст уживає загальний іменник з вказівним означенням; нижній регістр природніше зберігає цей характер, тоді як традиційний термін подано в примітці.
  - severity: low
    issue: Формулювання примітки b «говоритимуть як про пам’ятку про неї» стилістично й семантично неточне.
    rationale: Йдеться не про те, що про вчинок говоритимуть як про предмет-пам’ятку, а про його згадування як пам’ять про жінку.
