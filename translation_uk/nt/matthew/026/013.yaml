review_pass:
  verdict: revise
  source_fidelity: 'Зміст передано точно: урочисте запевнення, неозначена умова щодо всесвітнього проголошення, майбутня згадка про вчинок жінки та її меморіальна мета збережені. Однак початкове «де тільки по всьому світу» синтаксично незграбно поєднує локативну неозначеність із глобальним охопленням.'
  naturalness: «Де б у всьому світі не звіщали ... там також розповідатимуть» є природною сучасною українською конструкцією для ὅπου ἐὰν ... ἐν ὅλῳ τῷ κόσμῳ. Мала літера в «цю добру звістку» відповідає звичайному лексичному вживанню, не перетворюючи вислів на конфесійно маркований титул.
  terminology: «Звіщати», «добра звістка» та «на згадку про неї» адекватно передають κηρύσσω, εὐαγγέλιον і εἰς μνημόσυνον αὐτῆς. Альтернативу «Євангеліє» доречно лишити в примітці. Примітку b уточнено, щоб її формулювання природніше відбивало значення «як пам’ять/пам’ятник про неї».
