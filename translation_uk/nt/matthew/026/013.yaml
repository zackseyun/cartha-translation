source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὅπου ἐὰν κηρυχθῇ τὸ εὐαγγέλιον τοῦτο ἐν ὅλῳ τῷ κόσμῳ, λαληθήσεται καὶ ὃ ἐποίησεν αὕτη εἰς μνημόσυνον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/013.yaml
  text: Truly I tell you, wherever this good news is proclaimed in the whole world, what this woman has done will also be spoken of in memory of her.
translation:
  language: uk
  text: 'Істинно кажу вам: де б у всьому світі не звіщали цю добру звістку[a], там також розповідатимуть про те, що зробила ця жінка, на згадку про неї[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «це Євангеліє».'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «…буде сказано як пам’ять про неї».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Істинно
  rationale: Передає урочисте підтвердження на початку вислову Ісуса; це природний і гідний відповідник у сучасній українській біблійній мові.
- source_word: λέγω ὑμῖν
  choice: кажу вам
  rationale: Прямо й природно відтворює особове звернення без зайвого розширення.
- source_word: ὅπου ἐὰν
  choice: де тільки
  rationale: 'Передає неозначене місцеве значення конструкції: у будь-якому місці, де відбудеться названа дія.'
- source_word: κηρυχθῇ
  choice: звіщатимуть
  rationale: Активна неозначено-особова конструкція природно передає грецький пасив і зберігає значення публічного проголошення.
- source_word: τὸ εὐαγγέλιον τοῦτο
  choice: цю Добру Звістку
  rationale: Відтворює основне значення εὐαγγέλιον зрозумілою сучасною мовою; написання з великої літери позначає конкретну Добру Звістку, про яку говорить Ісус, без додавання доктринального уточнення.
- source_word: ἐν ὅλῳ τῷ κόσμῳ
  choice: по всьому світу
  rationale: Природний український відповідник із широким універсальним значенням.
- source_word: λαληθήσεται
  choice: розповідатимуть і про
  rationale: 'Природно передає майбутній пасив щодо вчинку: про нього говоритимуть або розповідатимуть.'
- source_word: ὃ ἐποίησεν αὕτη
  choice: те, що зробила ця жінка
  rationale: Неозначене αὕτη контекстуально вказує на згадану жінку; явне слово «жінка» усуває неприродну для української двозначність.
- source_word: εἰς μνημόσυνον αὐτῆς
  choice: на згадку про неї
  rationale: Лаконічно зберігає меморіальне, commemorative значення вислову, не уточнюючи понад грецький текст характер цієї пам’яті.
theological_decisions:
- issue: Передача εὐαγγέλιον
  choice: Добра Звістка
  alternative: Євангеліє
  rationale: «Добра Звістка» безпосередньо передає лексичний зміст грецького слова й лишається зрозумілою сучасному читачеві; традиційне «Євангеліє» подано у примітці як повноправний варіант.
- issue: Значення εἰς μνημόσυνον αὐτῆς
  choice: на згадку про неї
  alternative: як пам’ятку про неї
  rationale: Обраний вислів зберігає спрямованість на пам’ять про жінку, але не визначає точніше, чи сам переказ є меморіалом, чи відбувається задля її згадування.
translation_notes:
  register: Сучасна стандартна українська мова з урочистим, але доступним біблійним звучанням. Неозначено-особові форми природно передають грецькі пасиви. Порядок речення дещо перебудовано задля ясності українською, без усунення смислової напруги вислову.
