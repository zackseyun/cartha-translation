lexical_decisions:
- source_word: Τότε
  choice: Тоді
  rationale: Природний часовий сполучник, що вводить наступну подію в оповіді.
- source_word: συνήχθησαν
  choice: зібралися
  rationale: Природне сучасне українське позначення спільного зібрання; грецька форма пасивна, що відзначено у примітці.
- source_word: ἀρχιερεῖς
  choice: первосвященники
  rationale: У множині називає провідних представників священницької верхівки, а не кількох одночасних носіїв єдиної посади первосвященника.
- source_word: πρεσβύτεροι τοῦ λαοῦ
  choice: старійшини народу
  rationale: Прямо й природно передає грецьку родову конструкцію та назву визнаних провідників народу.
- source_word: εἰς τὴν αὐλὴν
  choice: у дворі
  rationale: З дієсловом зібрання українська природно виражає місце, де вони опинилися; αὐλή тут може означати внутрішній двір великої резиденції.
- source_word: τοῦ ἀρχιερέως
  choice: первосвященника
  rationale: Точно передає назву посади в однині.
- source_word: τοῦ λεγομένου Καϊάφα
  choice: якого звали Каяфою
  rationale: Природна українська конструкція, яка точно передає грецький дієприкметниковий зворот та називає особу.
