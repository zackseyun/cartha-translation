base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/069.yaml
  text: Peter was sitting outside in the courtyard[a], and one servant girl came up to him, saying, “You also were with Jesus the Galilean.”
translation:
  language: uk
  text: 'А Петро сидів надворі, на подвір’ї, і до нього підійшла одна служниця[a] та сказала: «Ти теж був з Ісусом Галілеянином».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «дівчина-служниця» чи «рабиня». Грецьке παιδίσκη може означати молоду служницю, іноді рабського стану.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: А
  rationale: Передає м’який розповідний перехід і зміну сцени без додавання часового значення.
- source_word: ἐκάθητο ἔξω
  choice: сидів надворі
  rationale: Недоконаний вид дієслова «сидів» природно передає тривалий стан у минулому, а «надворі» — просторове значення ἔξω.
- source_word: ἐν τῇ αὐλῇ
  choice: на подвір’ї
  rationale: У цьому контексті αὐλή означає відкритий внутрішній двір при резиденції первосвященника; «подвір’я» є природним сучасним відповідником.
- source_word: προσῆλθεν αὐτῷ
  choice: підійшла до нього
  rationale: Точно й природно передає фізичне наближення до Петра.
- source_word: μία παιδίσκη
  choice: одна служниця
  rationale: «Служниця» передає суспільну роль παιδίσκη, не стверджуючи напевно рабського статусу; «одна» зберігає μία, що вводить конкретну особу.
- source_word: λέγουσα
  choice: й сказала
  rationale: Українське сурядне речення природніше за буквальний дієприкметниковий зворот і точно передає супровідну мовленнєву дію.
- source_word: Καὶ σὺ
  choice: Ти теж
  rationale: «Теж» передає включальне й наголошувальне значення καί при вираженому займеннику σὺ.
- source_word: ἦσθα μετὰ
  choice: був з
  rationale: Прямо передає перебування разом, не додаючи тлумачення про формальне учнівство.
- source_word: Ἰησοῦ τοῦ Γαλιλαίου
  choice: Ісусом Галілеянином
  rationale: Зберігає прикладкове означення Γαλιλαῖος як ідентифікаційне найменування Ісуса, а не перетворює його на ширше пояснення походження.
