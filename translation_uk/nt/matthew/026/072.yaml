  yaml_path: translation/nt/matthew/026/072.yaml
  text: 'And again he denied it with an oath: “I do not know the man.”[a]'
translation:
  language: uk
  text: 'І знову він відрікся з клятвою: «Я не знаю чоловіка».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «він зрікся»; грецьке дієслово вводить зміст зречення.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: І
  rationale: Зберігає простий оповідний зв’язок без додавання виразнішого часового відтінку.
- source_word: πάλιν
  choice: знову
  rationale: Прямо й природно позначає повторення Петрового зречення.
- source_word: ἠρνήσατο
  choice: він відрікся
  rationale: У цьому контексті дієслово означає зректися, заперечивши свою причетність або знайомство; українське «відрікся» природно передає силу вислову без штучно доданого займенникового додатка.
- source_word: μετὰ ὅρκου
  choice: з клятвою
  rationale: 'Передає супровідну обставину: Петро відрікався, підкріплюючи слова клятвою. Варіант «під присягою» міг би помилково навіювати формальну судову процедуру.'
- source_word: ὅτι
  choice: ':'
  rationale: Сполучник вводить зміст зречення; в українській природно передати це двокрапкою та прямою мовою.
- source_word: Οὐκ οἶδα
  choice: Я не знаю
  rationale: Точно й природно передає заперечення знання.
- source_word: τὸν ἄνθρωπον
  choice: цього чоловіка
  rationale: Іменник тут позначає конкретного чоловіка. В українській прямій мові вказівне «цього» природно передає означеність грецького виразу, не замінюючи його ім’ям Ісуса.
theological_decisions:
- issue: Позначення Ісуса словами τὸν ἄνθρωπον у Петровому зреченні
  choice: «цього чоловіка»
  alternative: «його» або «Ісуса»
  rationale: Збережено явний іменниковий вислів, який передає дистанціювання Петра. Заміна на «Ісуса» внесла б уточнення, якого немає у грецькому тексті, а «його» послабило б риторичну силу вислову.
translation_notes:
  register: Сучасна стандартна українська; лаконічний, гідний оповідний стиль. «З клятвою» відтворює неформальний характер присягання, а «цього чоловіка» зберігає дистанціювальне формулювання Петра.
