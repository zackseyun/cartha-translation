  source_fidelity: The connective, repetition marker, oath accompaniment, and content clause are well represented. However, «цього чоловіка» introduces a demonstrative nuance absent from τὸν ἄνθρωπον; the Greek has the definite article, not a demonstrative. In Ukrainian, the bare noun can carry the contextually definite reference without adding deixis.
  naturalness: «І знову він відрікся з клятвою» is natural, concise modern Ukrainian in this narrative register. «Я не знаю чоловіка» is understandable in its immediate context and avoids adding «this/that».
  terminology: «Відрікся» appropriately renders ἠρνήσατο in Peter’s denial. «З клятвою» accurately conveys μετὰ ὅρκου without suggesting a formal courtroom oath. The supplied footnote’s proposed «заперечив» is less suitable as a lexical alternative here, since it can suggest disputing a statement rather than repudiating acquaintance.
