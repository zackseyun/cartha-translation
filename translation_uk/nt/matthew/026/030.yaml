lexical_decisions:
- source_word: ὑμνήσαντες
  choice: заспівавши хвалу
  rationale: Аористовий активний дієприкметник від ὑμνέω означає співати хвалу або хвалебні пісні. Формулювання природне українською, передає попередність дії щодо головного дієслова й не нав’язує ні однини, ні конкретної кількості пісень.
- source_word: ἐξῆλθον
  choice: вони вийшли
  rationale: Прямий і природний відповідник аориста ἐξέρχομαι у цьому оповідному контексті.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: на Оливну гору
  rationale: Усталена сучасна українська назва місцевості; прийменник «на» природно вживається з назвою гори й передає напрямок εἰς.
- source_word: καὶ
  choice: І
  rationale: Зберігає простий сурядний зв’язок із попередньою розповіддю без додавання виразнішого часового відтінку.
