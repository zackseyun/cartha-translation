  verdict: revise
  source_fidelity: 'Основний текст загалом точно передає грецький текст: збережено історичний теперішній («каже»), явний вислів «Моя душа», інтенсивність περίλυπος, ідіоматичне «аж до смерті» та подвійний відтінок γρηγορεῖτε. Однак примітка b невиправдано перетворює ідіоматичний вислів на твердження про можливу смерть мовця, а примітка c у формі «не спіть зі Мною» у сучасній українській двозначна й неприродна.'
  naturalness: Текст звучить природно в сучасній українській. «Пильнуйте зі Мною» доречне в біблійному урочистому регістрі. «Залишіться тут» точніше відбиває аористовий заклик лишитися на місці, ніж «Залишайтеся», хоча обидва варіанти можливі.
  terminology: «Душа» коректно зберігає ψυχή без доктринального звуження. «Глибоко засмучена» адекватно передає περίλυπος. У примітці до γρηγορεῖτε слід уникнути двозначного вислову та сформулювати буквальне неспання ясно.
