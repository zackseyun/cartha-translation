  text: τότε λέγει ⸀αὐτοῖς· Περίλυπός ἐστιν ἡ ψυχή μου ἕως θανάτου· μείνατε ὧδε καὶ γρηγορεῖτε μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/038.yaml
  text: Then he says to them[a], “My soul is deeply grieved, even to death[c][b]. Remain here and keep watch with me.”
translation:
  language: uk
  text: 'Тоді Він каже їм: «Моя душа глибоко засмучена[a] аж до смерті[b]. Залишіться тут і пильнуйте зі Мною[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «сповнена тяжкого смутку», «дуже засмучена» чи «пригнічена смутком».'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «до смертельної межі».'
    reason: lexical_alternative
  - marker: c
    text: 'Або: «Будьте зі Мною й не спіть». Грецьке слово може означати як буквальне неспання, так і пильну уважність.'
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Тоді
  rationale: Природний український часовий сполучник, який зберігає послідовність розповіді.
- source_word: λέγει
  choice: каже
  rationale: Теперішній час передає грецький історичний теперішній і зберігає жвавість оповіді.
- source_word: αὐτοῖς
  choice: їм
  rationale: Прямий і природний відповідник давального відмінка непрямого додатка.
- source_word: Περίλυπός
  choice: глибоко засмучена
  rationale: Передає надзвичайно сильний смуток без архаїчності; форма жіночого роду узгоджується зі словом «душа».
- source_word: ἡ ψυχή μου
  choice: Моя душа
  rationale: Зберігає виразне ψυχή та глибину внутрішнього страждання Ісуса, не перетворюючи вислів на технічне антропологічне твердження.
- source_word: ἕως θανάτου
  choice: аж до смерті
  rationale: Стисло зберігає граничну силу вислову й водночас його можливу смислову неоднозначність.
- source_word: μείνατε
  choice: Залишайтеся
  rationale: Природно передає наказ учням не йти з цього місця; форма недоконаного виду доречна для тривалої дії в контексті.
- source_word: ὧδε
  choice: тут
  rationale: Безпосередній сучасний відповідник прислівника місця.
- source_word: γρηγορεῖτε
  choice: пильнуйте
  rationale: Охоплює значення уважної пильності, не виключаючи буквального неспання, яке зазначено у примітці.
- source_word: μετ’ ἐμοῦ
  choice: зі Мною
  rationale: Прямо передає значення супроводу; «зі» забезпечує природне українське звучання.
theological_decisions:
- issue: Передача ψυχή у вислові Ісуса
  choice: Моя душа
  alternative: Я глибоко засмучений
  rationale: Збережено явний іменник ψυχή, щоб не згладжувати формулювання тексту й реальність глибокого людського страждання Ісуса, водночас не нав’язуючи технічного вчення про склад людини.
- issue: Значення γρηγορεῖτε в контексті
  choice: пильнуйте
  alternative: не спіть / залишайтеся бадьорими
  rationale: Основний варіант зберігає ширше значення пильної уважності, а примітка вказує на буквальний сенс неспання; таким чином обидва контекстуальні відтінки залишаються видимими.
- issue: Сила вислову ἕως θανάτου
  choice: аж до смерті
  alternative: до такої міри, що можу померти
  rationale: Дослівніший стислий вислів не визначає однозначно, чи йдеться про смертельну інтенсивність скорботи, чи про скорботу, що триває до смерті.
translation_notes:
  register: Сучасна стандартна українська мова з урочистим, але зрозумілим регістром. Історичний теперішній збережено. Займенники щодо Ісуса подано з великої літери відповідно до поширеної української біблійної видавничої традиції; це не змінює змісту оригіналу.
