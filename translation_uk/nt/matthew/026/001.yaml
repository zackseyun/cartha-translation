  text: 'І коли Ісус закінчив усі ці слова[a], Він сказав Своїм учням:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або, формальніше: «І сталося, коли Ісус закінчив усі ці слова, Він сказав Своїм учням».'
    reason: Лексична альтернатива, що відтворює семітизовану оповідну формулу Καὶ ἐγένετο.
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: Коли
  rationale: Матвіївська перехідна формула із семітським відтінком. Природне українське «Коли» передає часовий зв’язок і перехід у розповіді; буквальне «І сталося, коли» можливе, але в сучасній українській звучить важко.
- source_word: ἐτέλεσεν
  choice: закінчив
  rationale: Дієслово означає довести до завершення. У цьому контексті «закінчив» природно описує завершення промови перед наступною дією.
- source_word: πάντας τοὺς λόγους τούτους
  choice: усі ці слова
  rationale: Збережено пряме значення λόγους і характерну для Матвія формулу завершення промови; «усе це» було б ширшим і менш точним.
- source_word: εἶπεν
  choice: сказав
  rationale: Звичайний нейтральний відповідник λέγω в оповідному контексті, без додавання невиражених відтінків.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: Своїм учням
  rationale: «Учням» є усталеним відповідником μαθηταῖς, а «Своїм» природно й виразно передає присвійне αὐτοῦ.
