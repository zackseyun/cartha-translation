lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: Що ви думаєте?
  rationale: Дієслово δοκέω з давальним ὑμῖν утворює природне запитання про думку або судження. Такий переклад зберігає пряму форму запитання й зрозуміло звучить сучасною українською.
- source_word: οἱ δὲ ἀποκριθέντες εἶπαν
  choice: Вони відповіли
  rationale: Дієприкметник ἀποκριθέντες разом з εἶπαν є звичним оповідним зворотом зі значенням «відповіли». Частка δέ тут має слабку сполучну функцію, яку українською не обов’язково передавати окремим словом.
- source_word: ἔνοχος θανάτου
  choice: заслуговує на смерть
  rationale: У цьому судовому контексті ἔνοχος із родовим θανάτου означає винність або відповідальність, що тягне смерть. Вислів «заслуговує на смерть» природно передає винесений ними вирок, а юридичні альтернативи наведено у примітці.
- source_word: ἐστίν
  choice: Він заслуговує
  rationale: Грецька зв’язка з невираженим підметом передана українським займенником «Він» і дієслівною конструкцією, потрібною для природного повного речення.
theological_decisions:
- issue: Судовий характер вироку ради
  choice: Він заслуговує на смерть
  alternative: Він винний смерті; Він підлягає смертній карі
  rationale: Переклад передає саме проголошений радою юридичний висновок, не перетворюючи його на твердження про справжню провину Ісуса перед Богом і не додаючи пізнішого богословського тлумачення.
translation_notes:
  register: Сучасна, проста й гідна українська мова. Пряму мову оформлено природно; юридичний відтінок ключового вислову збережено в основному тексті та уточнено в примітці.
