  yaml_path: translation/nt/matthew/026/074.yaml
  text: Then he began to curse and to swear[a], “I do not know the man.” And immediately a rooster crowed.
translation:
  language: uk
  text: 'Тоді він почав накликати прокляття й присягатися[a]: «Я не знаю цього чоловіка». І відразу заспівав півень.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «почав накликати прокляття й присягатися». Найімовірніше, він накликав прокляття на самого себе, щоб підсилити своє зречення.'
    reason: Лексична альтернатива й пояснення ймовірного змісту самозакляття без внесення цього уточнення до основного тексту.
lexical_decisions:
- source_word: τότε
  choice: Тоді
  rationale: Природно передає часову послідовність і перехід до наступної дії.
- source_word: ἤρξατο
  choice: почав
  rationale: Зберігає починальний відтінок конструкції з інфінітивами та показує посилення Петрового зречення.
- source_word: καταθεματίζειν
  choice: накликати прокляття
  rationale: Передає значення урочистого прикликання прокляття, а не просто лайки; об’єкт прокляття в основному тексті не уточнено, як і в грецькому тексті.
- source_word: ὀμνύειν
  choice: присягатися
  rationale: У цьому контексті йдеться про підтвердження слів присягою; дієслово природно поєднується з прямою мовою.
- source_word: ὅτι
  choice: двокрапка й пряма мова
  rationale: Сполучник вводить зміст присяги; українською найясніше передати його прямою мовою.
- source_word: Οὐκ οἶδα
  choice: Я не знаю
  rationale: Прямо й точно передає заперечення знання або знайомства.
- source_word: τὸν ἄνθρωπον
  choice: цього чоловіка
  rationale: У живій українській прямій мові вказівна форма природно позначає конкретного чоловіка, про якого щойно йшлося, не змінюючи референта.
- source_word: καὶ εὐθέως
  choice: І відразу
  rationale: Зберігає негайність події та оповідну послідовність.
- source_word: ἀλέκτωρ ἐφώνησεν
  choice: заспівав півень
  rationale: Усталений і природний український вислів для крику півня; неозначений артикль у грецькій відсутній, а українська його граматично не потребує.
theological_decisions:
- issue: Зміст καταθεματίζειν у Петровому зреченні
  choice: Передати як «накликати прокляття», не називаючи в основному тексті, на кого саме.
  alternative: «Почав проклинати» або «почав накликати прокляття на себе».
  rationale: Поєднання з присяганням найімовірніше описує прикликання прокляття як запоруки правдивості, можливо на самого себе. Проте грецький текст прямо не називає об’єкта, тому уточнення винесено в примітку, щоб зберегти неоднозначність і не створити враження, ніби Петро проклинав Ісуса.
translation_notes:
  register: Сучасна стандартна українська, природна й гідна оповідна мова. «Присягатися» передає урочисту клятву, а не лайку; «заспівав півень» є звичним українським відповідником. Емоційне посилення зречення передано знаком оклику.
