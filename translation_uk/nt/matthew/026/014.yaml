lexical_decisions:
- source_word: Τότε
  choice: Тоді
  rationale: Природний український часовий маркер, що зберігає послідовність розповіді.
- source_word: πορευθεὶς
  choice: пішов
  rationale: Дієприкметникову форму передано особовим дієсловом відповідно до природного українського синтаксису; напрямок руху виражено прийменниковою конструкцією «до первосвященників».
- source_word: εἷς τῶν δώδεκα
  choice: один із дванадцятьох
  rationale: Збережено партитивну конструкцію та нейтральне позначення числа без нав'язування статусу власної назви.
- source_word: ὁ λεγόμενος
  choice: якого звали
  rationale: Природний сучасний український відповідник ідентифікаційної дієприкметникової конструкції, який не змінює її змісту.
- source_word: Ἰούδας Ἰσκαριώτης
  choice: Юда Іскаріот
  rationale: Ужито усталені в сучасній українській біблійній традиції форми особового імені та прізвиська.
- source_word: πρὸς τοὺς ἀρχιερεῖς
  choice: до первосвященників
  rationale: «До» передає рух у напрямку до осіб, а «первосвященники» позначає старших представників священницької влади у множині.
theological_decisions:
- issue: Передача групового позначення τῶν δώδεκα
  choice: один із дванадцятьох
  alternative: один із Дванадцятьох
  rationale: Мала літера не перетворює позначення групи на формалізовану власну назву, якої грецьке письмо саме по собі не встановлює; водночас із контексту зрозуміло, про яку групу йдеться.
translation_notes:
  register: Сучасна нормативна українська мова; виклад природний і гідний. Форму «дванадцятьох» обрано для позначення групи осіб; «первосвященників» ужито в чинному написанні разом.
