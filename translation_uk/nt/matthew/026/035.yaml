  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Πέτρος· Κἂν δέῃ με σὺν σοὶ ἀποθανεῖν, οὐ μή σε ⸀ἀπαρνήσομαι. ⸀ὁμοίως καὶ πάντες οἱ μαθηταὶ εἶπαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/035.yaml
  text: Peter said to him[a], “Even if I must die with you, I will certainly not deny you.” Likewise all the disciples also said the same.
translation:
  language: uk
  text: 'Петро сказав йому: «Навіть якщо мені доведеться померти разом із тобою, я нізащо не зречуся тебе».[a] Так само сказали й усі учні.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Я ніколи не зречуся тебе». У грецькому тексті вжито підсилене заперечення (οὐ μή).'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: сказав
  rationale: Грецький історичний теперішній час у сучасній українській оповіді природно передається минулим часом без зміни оповідної функції.
- source_word: Κἂν
  choice: Навіть якщо
  rationale: Сполука κἄν вводить допустову умову; «навіть якщо» природно передає її наголос.
- source_word: δέῃ με
  choice: мені доведеться
  rationale: Передає значення необхідності в умовній конструкції природною сучасною українською мовою.
- source_word: σὺν σοὶ ἀποθανεῖν
  choice: померти разом із тобою
  rationale: Зберігає значення смерті спільно з Ісусом; «разом із» виразно передає супровід.
- source_word: οὐ μή
  choice: нізащо не
  rationale: Природне українське підсилене заперечення, що відтворює особливу категоричність грецької конструкції.
- source_word: ἀπαρνήσομαι
  choice: зречуся тебе
  rationale: «Зректися» точно й усталено передає особисте заперечення зв’язку з Ісусом у цьому контексті.
- source_word: ὁμοίως
  choice: Так само
  rationale: Безпосередньо передає значення «подібним чином» і природно пов’язує слова решти учнів із заявою Петра.
- source_word: πάντες οἱ μαθηταὶ εἶπαν
  choice: сказали й усі учні
  rationale: Зберігає загальність πάντες, звичний відповідник μαθηταί та додатковий відтінок καί через частку «й».
theological_decisions:
- issue: Сила Петрового заперечення майбутнього зречення
  choice: «я нізащо не зречуся тебе»
  alternative: «я ніколи не зречуся тебе»
  rationale: Обидва варіанти передають підсилене οὐ μή. Основний варіант природно виражає категоричну самовпевненість Петра, не додаючи пояснення його мотивів і не усуваючи напруження з подальшою розповіддю.
translation_notes:
  register: Сучасна, природна й гідна оповідна українська. Історичний теперішній передано минулим часом; категоричність слів Петра збережено без конфесійного тлумачення.
