  source_fidelity: 'Переклад точно відтворює структуру й зміст грецького тексту: дієприкметниковий зворот παραλαβών передано як «взявши з собою»; буквальне «двох синів Зеведея» збережено без додавання імен; ἤρξατο має належне інгресивне «почав». Пара λυπεῖσθαι та ἀδημονεῖν передана як різні, але взаємодоповнювальні стани — «сумувати й тяжко тривожитися» — без невиправданого посилення до відчаю чи жаху.'
  naturalness: Фраза природна для сучасної стандартної української та зберігає стриманий урочистий біблійний регістр без архаїзації. «Тяжко тривожитися» дещо піднесене, проте зрозуміле й доречне в цьому контексті. Займенник «Він» корисно прояснює спільний суб’єкт дієприслівникового звороту й основного присудка.
  terminology: 'Імена й родинне позначення передано коректно: «Петра» та «двох синів Зеведея». Емоційна лексика не нав’язує конфесійного тлумачення й відповідає семантичній відмінності між λυπεῖσθαι та ἀδημονεῖν. Додаткова примітка не потрібна: у перекладі немає невідтвореної суттєвої неоднозначності.'
