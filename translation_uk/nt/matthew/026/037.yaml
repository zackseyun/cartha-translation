  text: καὶ παραλαβὼν τὸν Πέτρον καὶ τοὺς δύο υἱοὺς Ζεβεδαίου ἤρξατο λυπεῖσθαι καὶ ἀδημονεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/037.yaml
  text: And taking Peter and the two sons of Zebedee with him[a], he began to be sorrowful and deeply distressed.
translation:
  language: uk
  text: І, взявши з собою Петра та двох синів Зеведея, Він почав сумувати й тяжко тривожитися.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραλαβὼν
  choice: взявши з собою
  rationale: Аористовий дієприкметник παραλαμβάνω тут означає, що Ісус узяв обраних учнів із собою; цей вислів природно передає супровід і не додає зайвого змісту.
- source_word: τοὺς δύο υἱοὺς Ζεβεδαίου
  choice: двох синів Зеведея
  rationale: Збережено буквальне позначення з грецького тексту без підстановки імен Якова та Івана, яких цей вірш прямо не називає.
- source_word: ἤρξατο
  choice: почав
  rationale: Передає виразне початкове, інгресивне значення дієслова з двома залежними інфінітивами.
- source_word: λυπεῖσθαι
  choice: сумувати
  rationale: Дієслово позначає переживання смутку або скорботи; «сумувати» є зрозумілим, гідним і природним у сучасній українській мові.
- source_word: ἀδημονεῖν
  choice: тяжко тривожитися
  rationale: Передає гострий внутрішній неспокій і тяжке душевне страждання, відрізняючи цей стан від попереднього λυπεῖσθαι, але не посилюючи його до відчаю чи жаху без достатніх лексичних підстав.
- source_word: καὶ ... καὶ
  choice: і ... та ... й
  rationale: Українські сполучники природно зберігають накопичувальну координацію осіб і двох емоційних станів без стилістично важкого механічного повторення «і».
theological_decisions:
- issue: Опис емоційного стану Ісуса у світлі христології
  choice: Прямо передати обидва дієслова як справжні людські смуток і тяжку тривогу
  alternative: Послабити емоційну вразливість або, навпаки, посилити вислів до «жаху» чи «відчаю»
  rationale: Грецький текст свідчить про справжнє й тяжке людське страждання Ісуса. Переклад не применшує Його людяності й водночас не вкладає в текст безнадійності, якої ці слова самі по собі не вимагають.
translation_notes:
  register: Сучасна стандартна українська мова; виклад природний, урочистий без архаїзації. Займенник «Він» ужито для ясності підмета, оскільки український дієприслівниковий зворот потребує однозначного зв’язку з виконавцем дії.
