    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Ісус сказав йому
  rationale: Природний український порядок слів і просте дієслово мовлення точно передають грецьку оповідну формулу.
- source_word: Ἀμὴν λέγω σοι
  choice: Істинно кажу тобі
  rationale: Традиційна, але й досі зрозуміла українська формула зберігає урочисте підтвердження та особисте звернення, не залишаючи семітського ἀμήν без перекладу.
- source_word: ἐν ταύτῃ τῇ νυκτί
  choice: цієї ж ночі
  rationale: Частка «ж» природно передає наголос указівного ταύτῃ; український родовий часу не потребує буквального відтворення ἐν.
- source_word: πρὶν ἀλέκτορα φωνῆσαι
  choice: перш ніж заспіває півень
  rationale: Особова підрядна конструкція природна українською. Дієслово «заспівати» є звичним позначенням голосу півня й тут не означає людського співу.
- source_word: τρὶς
  choice: тричі
  rationale: Стисле й нормативне сучасне українське прислівникове позначення трьох повторень.
- source_word: ἀπαρνήσῃ με
  choice: ти тричі зречешся Мене
  rationale: «Зректися» точно передає відмову визнавати зв’язок з Ісусом; родовий «Мене» нормативно керується цим дієсловом. Займенник із великої літери відповідає усталеному біблійному українському оформленню прямого звернення до Ісуса.
theological_decisions:
- issue: Вступна формула Ісуса Ἀμὴν λέγω σοι
  choice: Істинно кажу тобі
  alternative: Амінь, кажу тобі; Запевняю тебе
  rationale: Обраний варіант зберігає урочистість і владність вислову, але не додає до нього окремого доктринального тлумачення.
- issue: Зміст ἀπαρνήσῃ με
  choice: зречешся Мене
  alternative: відречешся від Мене; заперечиш, що знаєш Мене
  rationale: «Зречешся Мене» зберігає місткість оригіналу й не уточнює наперед конкретної форми Петрового зречення.
translation_notes:
  register: Сучасна нормативна українська з гідним біблійним звучанням. Синтаксис природний для усного попередження; збережено урочисту формулу «Істинно кажу тобі» та наголос на цій самій ночі.
