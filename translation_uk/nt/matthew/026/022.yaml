lexical_decisions:
- source_word: λυπούμενοι σφόδρα
  choice: тяжко засмутившись
  rationale: Передає сильний смуток, виражений дієприкметником λυπούμενοι та підсилювальним прислівником σφόδρα, природною сучасною українською мовою.
- source_word: ἤρξαντο λέγειν αὐτῷ
  choice: почали … питати Його
  rationale: Буквально конструкція означає «почали говорити Йому», але пряма мова має форму запитання, тому «питати Його» природно передає комунікативну дію без зміни змісту.
- source_word: εἷς ἕκαστος
  choice: один за одним
  rationale: 'Відтворює розподільний наголос: кожен учень звертався до Ісуса окремо.'
- source_word: Μήτι ἐγώ εἰμι
  choice: Невже це я?
  rationale: Частка μήτι позначає запитання, у якому мовець очікує заперечної відповіді; українське «невже» природно передає цей відтінок.
- source_word: κύριε
  choice: Господи
  rationale: Клична форма «Господи» зберігає титул і безпосереднє звертання до Ісуса.
theological_decisions:
- issue: Передача κύριε у звертанні до Ісуса
  choice: Господи
  alternative: пане; учителю
  rationale: «Господи» зберігає звичну титульну й богословську вагу κύριε в наративі Матвія, не звужуючи його до ввічливого «пане».
translation_notes:
  register: Сучасна стандартна українська; виклад природний і гідний. Збережено емоційну силу вислову, індивідуальну послідовність запитань і очікування заперечної відповіді.
