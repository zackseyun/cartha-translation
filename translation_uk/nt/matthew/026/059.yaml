review_pass:
  verdict: revise
  source_fidelity: «Віддати Його на смерть» зазвичай означає передати когось для смерті або страти й тому вводить дію, якої в αὐτὸν θανατώσωσιν немає. Грецьке дієслово прямо виражає намір позбавити Ісуса життя. «Щоб убити Його» точно передає зміст, не уточнюючи способу смерті чи юридичного механізму. Решта перекладу добре відтворює імперфект ἐζήτουν, юридично спрямоване κατὰ та мету, введену ὅπως.
  naturalness: Текст загалом природний для сучасної української. «А» доречно передає м’який наративний перехід δέ. «Первосвященники», «увесь Синедріон», «шукали неправдивого свідчення» та «проти Ісуса» є ясними й стилістично відповідними.
  terminology: '«Первосвященники» і «Синедріон» усталені та точні. Примітку до ψευδομαρτυρίαν варто дещо уточнити: «лжесвідчення» є лексичним відповідником, а не чітко окремим значенням на противагу «неправдивому свідченню». Культурна примітка до «Синедріону» достатньо пояснює назву.'
  issues:
  - severity: medium
    issue: «віддати Його на смерть»
    rationale: Цей вислів може означати передачу Ісуса іншій стороні для смерті, тоді як αὐτὸν θανατώσωσιν означає, що вони прагнули Його вбити / позбавити життя. Така передача не виражена в цьому вірші.
  - severity: low
    issue: Формулювання лексичної примітки «може означати неправдиве свідчення або лжесвідчення»
    rationale: В українській «лжесвідчення» фактично є альтернативним словниковим відповідником «неправдивого свідчення», а не виразно іншим значенням. Нейтральніше подати його просто як альтернативний переклад.
  revised_text: А первосвященники й увесь Синедріон[b] шукали неправдивого свідчення[a] проти Ісуса, щоб убити Його.
