lexical_decisions:
- source_word: δὲ
  choice: А
  rationale: Передає м’який перехід у розповіді без надмірного протиставлення чи додавання часового значення.
- source_word: ἀρχιερεῖς
  choice: первосвященники
  rationale: Усталене українське позначення старшого священницького керівництва в юдейському контексті.
- source_word: συνέδριον ὅλον
  choice: увесь Синедріон
  rationale: Транслітерована назва точно позначає юдейську найвищу раду; примітка пояснює її звичайному читачеві. «Увесь» відтворює ὅλον.
- source_word: ἐζήτουν
  choice: шукали
  rationale: Недоконаний вид природно передає тривалу, цілеспрямовану дію грецького імперфекта.
- source_word: ψευδομαρτυρίαν
  choice: неправдивого свідчення
  rationale: Передає зміст неправдивих показань у судовому контексті, зберігаючи можливість ширшого розуміння терміна.
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: проти Ісуса
  rationale: Природно передає спрямовану проти Ісуса судову дію.
- source_word: ὅπως
  choice: щоб
  rationale: Стисло й природно виражає мету.
- source_word: αὐτὸν θανατώσωσιν
  choice: віддати Його на смерть
  rationale: Зберігає формальний судовий відтінок і мету домогтися смерті Ісуса, не уточнюючи спосіб виконання вироку.
theological_decisions:
- issue: Судовий характер наміру керівників
  choice: Тривалі пошуки неправдивого свідчення подано як засіб домогтися смерті Ісуса.
  alternative: «Шукали неправдивого свідчення, щоб убити Його».
  rationale: Грецький імперфект ἐζήτουν разом із цільовим реченням ὅπως…θανατώσωσιν показує тривалі навмисні дії в судовій обстановці; переклад не додає конкретного механізму страти.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Судову атмосферу збережено без архаїчного синтаксису; «Синедріон» пояснено в примітці.
