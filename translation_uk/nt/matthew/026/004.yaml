  text: і змовилися, щоб підступом схопити Ісуса й убити.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεβουλεύσαντο
  choice: змовилися
  rationale: У цьому контексті дієслово означає спільно радитися й виробити ворожий задум; «змовилися» природно передає узгоджену таємну дію.
- source_word: δόλῳ
  choice: підступом
  rationale: Орудний відмінок передає спосіб дії; «підступом» охоплює значення обману, хитрощів і прихованого задуму без надмірного уточнення.
- source_word: κρατήσωσιν
  choice: схопити
  rationale: У контексті насильницького затримання Ісуса «схопити» точно й природно передає значення дієслова.
- source_word: ἀποκτείνωσιν
  choice: убити
  rationale: Прямий сучасний відповідник зі збереженням сили вислову.
theological_decisions:
- issue: Зв’язок мети, виражений ἵνα
  choice: щоб підступом схопити Ісуса й убити
  alternative: як би підступом схопити Ісуса й убити
  rationale: ἵνα з кон’юнктивом тут природно виражає мету змови. Переклад «щоб» зберігає цю синтаксичну залежність і не перетворює вислів на непряме запитання.
translation_notes:
  register: Сучасна стандартна українська; стислий, гідний наративний стиль. Початкове «і» збережено для зв’язку з попереднім віршем.
