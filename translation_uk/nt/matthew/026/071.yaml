  text: ἐξελθόντα ⸀δὲ εἰς τὸν πυλῶνα εἶδεν αὐτὸν ἄλλη καὶ λέγει ⸀τοῖς ἐκεῖ· ⸀Οὗτος ἦν μετὰ Ἰησοῦ τοῦ Ναζωραίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/071.yaml
  text: But when he had gone out to the gateway, another woman saw him and says to those there, “This man was with Jesus the Nazarene.”
translation:
  language: uk
  text: 'А коли він вийшов до брами, його побачила інша жінка й каже тим, хто був там: «Цей чоловік був з Ісусом Назарянином».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πυλών
  choice: брама
  rationale: У цьому контексті слово позначає вхідну браму або прохід при дворі; «брама» природно й стисло передає місце, куди вийшов Петро.
- source_word: ἄλλη
  choice: інша жінка
  rationale: Грецький прикметник ужито самостійно в жіночому роді й він відсилає до іншої служниці або жінки; додане «жінка» робить цей граматично виражений зміст ясним українською, не звужуючи його до «служниці».
- source_word: λέγει
  choice: каже
  rationale: Збережено історичний теперішній час оригіналу, який пожвавлює розповідь.
- source_word: τοῦ Ναζωραίου
  choice: Назарянином
  rationale: Звичне українське означення походження або зв’язку Ісуса з Назаретом; воно природніше за буквальне «Ісусом, тим Назарянином».
