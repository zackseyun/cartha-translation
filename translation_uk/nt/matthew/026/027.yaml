source:
  edition: SBLGNT
  text: καὶ ⸀λαβὼν ποτήριον καὶ εὐχαριστήσας ἔδωκεν αὐτοῖς λέγων· Πίετε ἐξ αὐτοῦ πάντες,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/027.yaml
  text: And having taken a cup and given thanks[a], he gave it to them, saying, “Drink from it[c][b], all of you,”
translation:
  language: uk
  text: 'І, взявши чашу та подякувавши, Він подав її їм і сказав: «Пийте з неї всі ви».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβὼν
  choice: взявши
  rationale: Дієприслівник природно передає аористовий дієприкметник і позначає дію, що передує головному дієслову.
- source_word: ποτήριον
  choice: чашу
  rationale: Український знахідний відмінок не передає протиставлення грецького означеного й неозначеного артиклів; «чашу» природно позначає предмет у цій ситуації, не уточнюючи понад текст.
- source_word: εὐχαριστήσας
  choice: подякувавши
  rationale: Точно передає дію подяки, яка передує головній дії, і не вносить пізнішої сакраментальної термінології.
- source_word: ἔδωκεν
  choice: подав її
  rationale: «Подав» природніше українською в контексті передавання чаші; займенник «її» ясно відсилає до чаші, імпліцитного об’єкта в грецькому тексті.
- source_word: αὐτοῖς
  choice: їм
  rationale: Прямо передає давальний відмінок і стосується присутніх учнів.
- source_word: λέγων
  choice: і сказав
  rationale: Фінітна українська конструкція природно вводить пряму мову; зміст грецького дієприкметника збережено без неприродного нагромадження дієприслівників.
- source_word: Πίετε
  choice: Пийте
  rationale: Природний наказовий спосіб множини без доданого значення повного випивання.
- source_word: ἐξ αὐτοῦ
  choice: з неї
  rationale: Передає джерело пиття; жіночий займенник узгоджений з українським словом «чаша».
- source_word: πάντες
  choice: всі ви
  rationale: Ясно показує, що наказ звернений до всієї групи, а не визначає кількість вмісту, яку слід випити.
theological_decisions:
- issue: Можливі євхаристійні або сакраментальні конотації εὐχαριστήσας
  choice: подякувавши
  alternative: поблагословивши її
  rationale: Грецьке εὐχαριστέω означає «дякувати». Обраний відповідник зберігає лексичний зміст і не привносить у розповідь пізніших доктринальних формулювань.
- issue: Сфера дії πάντες у наказі
  choice: всі ви
  alternative: усі; випийте все
  rationale: πάντες найприродніше стосується невираженого підмета наказового дієслова — усіх адресатів. Переклад не підтримує хибного прочитання, ніби йдеться про обов’язкове випивання всього вмісту.
translation_notes:
  register: Сучасна нормативна українська, урочиста без архаїзації. Паралельні дієприслівники «взявши… подякувавши» відтворюють послідовність двох грецьких аористових дієприкметників; «і сказав» забезпечує природний український ритм. Великої літери в займеннику «Він» ужито як традиційну шанобливу графічну норму в біблійному контексті.
