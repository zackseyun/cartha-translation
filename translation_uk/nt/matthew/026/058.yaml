  text: ὁ δὲ Πέτρος ἠκολούθει αὐτῷ ἀπὸ μακρόθεν ἕως τῆς αὐλῆς τοῦ ἀρχιερέως, καὶ εἰσελθὼν ἔσω ἐκάθητο μετὰ τῶν ὑπηρετῶν ἰδεῖν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/058.yaml
  text: But Peter was following him from a distance[a], as far as the courtyard of the high priest. And after going inside[b], he sat with the officers to see the outcome.
translation:
  language: uk
  text: А Петро йшов за ним віддалік, аж до подвір’я первосвященника. Увійшовши всередину, він сидів разом зі службовцями[a], щоб побачити, чим усе закінчиться[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «зі слугами», «з прислужниками» чи «з вартовими». Грецьке ὑπηρέται може означати підлеглих службовців або прислужників; точний відтінок визначається контекстом.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «щоб побачити кінець». Грецьке τὸ τέλος може означати як «кінець», так і результат подій.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  choice: йшов за ним
  rationale: Імперфект передає тривалу фонову дію; природний український вислів зберігає значення слідування за Ісусом.
- source_word: ἀπὸ μακρόθεν
  choice: віддалік
  rationale: Сучасний і стислий відповідник, що передає фізичну відстань.
- source_word: ἕως τῆς αὐλῆς
  choice: аж до подвір’я
  rationale: «Аж до» передає межу руху, а «подвір’я» — внутрішній двір садиби первосвященника.
- source_word: ἀρχιερέως
  choice: первосвященника
  rationale: Усталений український відповідник у контексті євангельської розповіді про страсті.
- source_word: εἰσελθὼν ἔσω
  choice: увійшовши всередину
  rationale: 'Дієприслівникова конструкція зберігає послідовність: Петро спершу ввійшов, а потім сидів.'
- source_word: ἐκάθητο
  choice: сидів
  rationale: Імперфект позначає тривалий стан; українська форма «сидів» природно це передає.
- source_word: μετὰ τῶν ὑπηρετῶν
  choice: разом зі служителями
  rationale: ὑπηρέται означає підлеглих виконавців або прислужників; «служителі» не звужує значення лише до домашніх слуг чи озброєної варти.
- source_word: ἰδεῖν
  choice: щоб побачити
  rationale: Інфінітив виражає мету; переклад прямо передає цю синтаксичну функцію.
- source_word: τὸ τέλος
  choice: чим усе закінчиться
  rationale: Природний український вислів передає очікуваний кінець або результат подій, не уточнюючи наперед їхнього характеру.
