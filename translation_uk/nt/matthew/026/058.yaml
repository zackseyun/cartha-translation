  source_fidelity: 'Зміст і синтаксичні відношення передано точно: імперфекти ἠκολούθει та ἐκάθητο відтворено тривалими формами «йшов» і «сидів»; ἕως позначено «аж до»; εἰσελθὼν ἔσω — дієприслівниковою конструкцією з передуванням дії; ἰδεῖν — метою. «Чим усе закінчиться» природно передає відкрите τὸ τέλος, не нав’язуючи конкретного результату.'
