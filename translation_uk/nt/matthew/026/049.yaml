  text: καὶ εὐθέως προσελθὼν τῷ Ἰησοῦ εἶπεν· Χαῖρε, ῥαββί· καὶ κατεφίλησεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/049.yaml
  text: And immediately he came up to Jesus and said[a], “Greetings[b], Rabbi,” and kissed him.
translation:
  language: uk
  text: 'І відразу ж він підійшов до Ісуса й сказав: «Вітаю[a], Равві!» — і поцілував його[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальніше: «Радій»; тут це звичайна форма привітання.'
    reason: lexical_alternative
  - marker: b
    text: 'Дієслово може означати підкреслений або повторюваний поцілунок: «міцно поцілував» або «не раз поцілував».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: відразу ж
  rationale: Передає негайність дії природною сучасною українською мовою та зберігає напружений темп розповіді.
- source_word: προσελθὼν τῷ Ἰησοῦ
  choice: підійшов до Ісуса
  rationale: Дієприкметникову конструкцію природно передано особовою формою, яка виражає наближення Юди до Ісуса перед його словами.
- source_word: Χαῖρε
  choice: Вітаю
  rationale: У цьому контексті це усталена форма привітання. «Вітаю» звучить сучасно й гідно, не перетворюючи звичайне звертання на богословське проголошення.
- source_word: ῥαββί
  choice: Равві
  rationale: Збережено семітський титул у формі, усталеній в українській біблійній мові, без тлумачного звуження до «Учителю».
- source_word: κατεφίλησεν
  choice: поцілував
  rationale: Основний текст зберігає природне українське формулювання, тоді як можливий підсилений або повторюваний характер поцілунку зазначено у примітці.
- source_word: αὐτόν
  choice: його
  rationale: Звичайний займенник із малої літери точно передає посилання на Ісуса, не додаючи до грецького тексту конфесійної практики шанобливого написання.
theological_decisions:
- issue: Значення привітання Χαῖρε
  choice: Вітаю
  alternative: Радій
  rationale: У цій сцені слово функціонує як звичайне привітання, хоча буквально пов’язане із закликом радіти. Основний варіант зберігає комунікативну функцію, а примітка — буквальнішу можливість.
- issue: Сила дієслова κατεφίλησεν
  choice: поцілував
  alternative: міцно поцілував / не раз поцілував
  rationale: Префіксальне дієслово може передавати підсилену або повторювану дію, але контекст не дає змоги однозначно вибрати між цими відтінками. Тому неоднозначність збережено в примітці.
translation_notes:
  register: Сучасна, природна й водночас гідна оповідна українська мова. Частку «ж» ужито для виразного передавання εὐθέως. Титул «Равві» збережено, а займенник «його» написано з малої літери відповідно до форми джерельного тексту.
