source:
  edition: SBLGNT
  text: Ἐσθιόντων δὲ αὐτῶν λαβὼν ὁ Ἰησοῦς ⸀ἄρτον καὶ ⸀εὐλογήσας ἔκλασεν καὶ ⸂δοὺς τοῖς μαθηταῖς⸃ εἶπεν· Λάβετε φάγετε, τοῦτό ἐστιν τὸ σῶμά μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/026.yaml
  text: While they were eating[a], Jesus took bread, and after blessing it, he broke it and gave it to the disciples and said, “Take, eat[d][c][b]; this is my body.”
translation:
  language: uk
  text: 'Коли вони їли[a], Ісус узяв хліб і, промовивши благословення[b], розламав його, дав учням та сказав: «Візьміть, їжте[c]: це — моє тіло[d]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «У той час як вони їли».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально також можна передати: «поблагословивши»; дехто розуміє цю дію як подяку над хлібом.'
    reason: lexical_alternative
  - marker: c
    text: 'Або: «Візьміть і їжте».'
    reason: lexical_alternative
  - marker: d
    text: 'Грецький текст буквально має: «це є моє тіло». Дехто тлумачить ці слова як «це означає (або символізує) моє тіло», але переклад зберігає формулювання джерельного тексту.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐσθιόντων δὲ αὐτῶν
  choice: Коли вони їли
  rationale: Родовий абсолют задає часові обставини й описує тривалу дію. «Коли вони їли» природно передає цей зміст; легкий зв’язок, виражений δέ, не потребує окремого протиставного сполучника.
- source_word: λαβὼν ὁ Ἰησοῦς ἄρτον
  choice: Ісус узяв хліб
  rationale: Аористовий дієприкметник природно передано особовою формою як першу дію в послідовності. ἄρτος тут означає хліб і не вимагає уточнення «буханець».
- source_word: εὐλογήσας
  choice: промовивши благословення
  rationale: Формулювання зберігає значення εὐλογέω та не визначає без потреби, чи граматичним об’єктом благословення є сам хліб; воно також не підмінює це дієслово близьким за змістом «подякував».
- source_word: ἔκλασεν
  choice: розламав його
  rationale: Дієслово означає «ламати, розламувати»; займенник «його» природно відсилає до хліба.
- source_word: δοὺς τοῖς μαθηταῖς
  choice: дав учням
  rationale: Дієприкметник передано особовою формою для природної української оповіді. Означена група τοῖς μαθηταῖς — це вже відомі з контексту учні; додавати «своїм» немає потреби.
- source_word: Λάβετε φάγετε
  choice: Візьміть, їжте
  rationale: Два послідовні наказові аористи передано без доданого сполучника, щоб зберегти стислу, безсполучникову будову грецького вислову.
- source_word: τοῦτό ἐστιν
  choice: це —
  rationale: Українська конструкція з тире природно передає просту зв’язку «це є», не вводячи тлумачних дієслів «означає» чи «символізує».
- source_word: τὸ σῶμά μου
  choice: моє тіло
  rationale: Прямий відповідник звичайного значення σῶμα з точно переданим присвійним займенником.
theological_decisions:
- issue: Євхаристійне формулювання слів Ісуса
  choice: «це — моє тіло»
  alternative: «це означає моє тіло» або «це символізує моє тіло»
  rationale: У грецькому тексті стоїть проста зв’язка ἐστιν («є»). Переклад зберігає формулювання джерела та його богословську напругу, не закладаючи в основний текст певного конфесійного розуміння.
- issue: Характер дії εὐλογήσας
  choice: «промовивши благословення»
  alternative: «поблагословивши його» або «подякувавши»
  rationale: Джерельний текст не має вираженого додатка після εὐλογήσας. Обране формулювання не вирішує понад текст, чи благословення спрямоване безпосередньо на хліб, і не ототожнює εὐλογέω з εὐχαριστέω.
translation_notes:
  register: Сучасна нормативна українська мова з урочистою, але зрозумілою синтаксичною будовою. Послідовність дій передано плавно, без архаїзмів; пряму мову збережено стислою. Займенник «моє» подано з малої літери відповідно до звичайної сучасної орфографічної практики.
