  source_fidelity: 'Текст точно передає всі основні елементи грецького оригіналу: δεσμεύουσιν — «зв’язують», φορτία βαρέα — «важкі тягарі», покладання на плечі людей, емфатичне протиставлення «а самі» та вольову відмову «не хочуть». Вислів «і пальцем їх поворухнути» зберігає образ мінімального зусилля й значення κινῆσαι («посунути, зрушити»), не підміняючи його тлумачним «полегшити» чи «підняти». «Людям» доречно передає родовий, загальний зміст τῶν ἀνθρώπων.'
  naturalness: Переклад звучить природно сучасною стандартною українською. «Класти комусь на плечі тягарі» та «і пальцем не поворухнути» — зрозумілі й стилістично доречні звороти. Порядок слів у фінальній частині («не хочуть і пальцем їх поворухнути») виразно підкреслює контраст і не створює двозначності.
  terminology: '«Тягарі» є влучним відповідником φορτία: воно зберігає конкретний образ вантажу й допускає контекстуальний переносний сенс без нав’язування конкретного пояснення. Жодних конфесійно забарвлених або надмірно інтерпретаційних термінів не введено. Примітка не потрібна, оскільки «людям» уже природно передає загальнолюдський обсяг ἀνθρώπων.'
