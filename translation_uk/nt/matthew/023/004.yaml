  text: δεσμεύουσιν ⸀δὲ φορτία ⸀βαρέα καὶ ἐπιτιθέασιν ἐπὶ τοὺς ὤμους τῶν ἀνθρώπων, ⸂αὐτοὶ δὲ τῷ⸃ δακτύλῳ αὐτῶν οὐ θέλουσιν κινῆσαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/004.yaml
  text: They tie up heavy burdens and lay them on the shoulders of men[a], but they themselves are unwilling to move them with their finger.
translation:
  language: uk
  text: Вони зв’язують важкі тягарі й кладуть їх людям на плечі, а самі не хочуть і пальцем їх поворухнути.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεσμεύουσιν
  choice: зв’язують
  rationale: Дієслово передає дію зв’язування або скріплення; «зв’язують» зберігає конкретний образ підготовленого тягаря.
- source_word: φορτία βαρέα
  choice: важкі тягарі
  rationale: «Тягарі» зберігає як буквальний образ вантажу, так і переносний зміст обтяжливих вимог, а «важкі» точно передає βαρέα.
- source_word: ἐπιτιθέασιν ἐπὶ τοὺς ὤμους τῶν ἀνθρώπων
  choice: кладуть їх людям на плечі
  rationale: Природний український вислів, що точно зберігає тілесний образ покладеного на людські плечі тягаря; «людям» передає загальне значення ἀνθρώπων без гендерного звуження.
- source_word: αὐτοὶ δὲ
  choice: а самі
  rationale: Наголошене «самі» зберігає контраст між тим, що вони накладають на інших, і власною відмовою діяти.
- source_word: τῷ δακτύλῳ αὐτῶν
  choice: і пальцем
  rationale: Українська ідіома «і пальцем» природно передає мінімальне зусилля, підкреслене грецьким одниновим δακτύλῳ.
- source_word: οὐ θέλουσιν κινῆσαι αὐτά
  choice: не хочуть … їх поворухнути
  rationale: «Не хочуть» зберігає значення свідомої відмови у θέλουσιν, а «поворухнути» точно й природно передає κινῆσαι, не замінюючи його більш тлумачним «підняти».
theological_decisions:
- issue: Буквальне чи переносне розуміння тягарів
  choice: Збережено конкретний образ «важких тягарів» без пояснення їхнього референта.
  alternative: Прямо назвати їх приписами, релігійними правилами або законницькими вимогами.
  rationale: У контексті йдеться про обтяжливі вимоги книжників і фарисеїв, однак сам грецький текст залишає образ тягарів нерозгорнутим. Переклад не звужує закладеної в ньому неоднозначності.
translation_notes:
  register: Сучасна стандартна українська мова; виклад природний і гідний. Ритм протиставлення збережено конструкцією «а самі», а вислів «і пальцем … поворухнути» зрозумілий пересічному читачеві та відповідає образності оригіналу.
