review_pass:
  verdict: revise
  source_fidelity: Потрібне виправлення. «Хоча б одну» додає до ἕνα невисловлене значення мінімуму/поступки. Вислів «вдвічі більше за вас самих» не встановлює граматично й семантично ясного порівняння з «сином геєни». Технічне προσήλυτος доцільно передати як «прозеліт», не розмиваючи його до будь-якої «людини».
  naturalness: «Обходите море й суходіл» зрозуміле, але «мандруєте морем і суходолом» природніше передає широке пересування. «Робите його удвічі більшим сином геєни, ніж ви самі» зберігає образ та робить порівняння зрозумілим у сучасній українській.
  terminology: «Книжники», «фарисеї», «лицеміри» та «геєна» є придатними усталеними відповідниками. «Прозеліт» точно відтворює προσήλυτος; у примітці можна подати доступніший описовий варіант. «Син геєни» збережено без доктринального розтлумачення.
  issues:
  - severity: medium
    issue: «хоча б одну людину»
    rationale: ἕνα означає «одного», але не містить частки «хоча б», яка додає значення мінімальної кількості або поступки.
  - severity: medium
    issue: «вдвічі більше за вас самих»
    rationale: Українська конструкція неясно приєднує порівняння до «сином геєни» й не відтворює належно порівняльний зміст διπλότερον ὑμῶν.
  - severity: low
    issue: «людину ... вона ... її» замість технічного терміна
    rationale: Це можливо як описовий переклад, але προσήλυτος має конкретне значення «прозеліт»; уживання терміна в основному тексті точніше й усуває неузгодженість із приміткою.
