revisions:
- from: Горе вам, книжники та фарисеї, лицеміри! Бо ви обходите море й суходіл, щоб навернути хоча б одну людину[a], а коли вона навернеться, робите її сином геєни[b] вдвічі більше за вас самих.
  to: Горе вам, книжники та фарисеї, лицеміри! Бо ви мандруєте морем і суходолом, щоб здобути одного прозеліта[a], а коли він ним стане, робите його удвічі більшим сином геєни, ніж ви самі[b].
  rationale: Вилучено додане «хоча б», відновлено точний термін «прозеліт» і чоловічі займенники, що відповідають грецькій формі, а також переформульовано порівняння, щоб природно й точно передати «удвічі ... ніж ви самі». «Мандруєте морем і суходолом» передає меризм і значення наполегливих подорожей без натяку, що вони просто обходять море або суходіл навколо.
