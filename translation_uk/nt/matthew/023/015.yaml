reference: Matthew 23:15
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι περιάγετε τὴν θάλασσαν καὶ τὴν ξηρὰν ποιῆσαι ἕνα προσήλυτον, καὶ ὅταν γένηται ποιεῖτε αὐτὸν υἱὸν γεέννης διπλότερον ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/015.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! Because you travel over sea and land to make one convert, and when he becomes one[b], you make him twice as much a son of Gehenna as yourselves.
translation:
  language: uk
  text: Горе вам, книжники та фарисеї, лицеміри! Бо ви мандруєте морем і суходолом, щоб здобути одного прозеліта[a], а коли він ним стане, робите його удвічі більшим сином геєни, ніж ви самі[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «навернути одну людину». Прозеліт — людина, що прийняла юдейську віру.
    reason: lexical_alternative
  - marker: b
    text: Або «сином пекла». Грецькою — «сином геєни».
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐαὶ
  choice: Горе
  rationale: Зберігає силу пророчого осуду й природно звучить у сучасній українській.
- source_word: γραμματεῖς
  choice: книжники
  rationale: Усталена й точна назва визнаної групи знавців і тлумачів Писання; не звужує значення до сучасних учителів.
- source_word: Φαρισαῖοι
  choice: фарисеї
  rationale: Усталена українська назва цієї юдейської релігійної течії.
- source_word: ὑποκριταί
  choice: лицеміри
  rationale: Природний сучасний відповідник для морально-релігійного удавання.
- source_word: περιάγετε τὴν θάλασσαν καὶ τὴν ξηράν
  choice: обходите море й суходіл
  rationale: Передає широкі й наполегливі подорожі, зберігаючи образну пару «море й суходіл».
- source_word: ποιῆσαι ἕνα προσήλυτον
  choice: щоб навернути хоча б одну людину
  rationale: Передає результативне ποιῆσαι та наголос на одному прозеліті природною українською; спеціальний термін подано у примітці.
- source_word: ὅταν γένηται
  choice: коли вона навернеться
  rationale: Відтворює набуття людиною статусу прозеліта без додавання невираженого агента.
- source_word: υἱὸν γεέννης
  choice: сином геєни
  rationale: Зберігає семітський ідіоматичний вислів і конкретний грецький термін γεέννα, не зводячи його без пояснення до узагальненого «пекло».
- source_word: διπλότερον ὑμῶν
  choice: вдвічі більше за вас самих
  rationale: Прямо передає порівняльну силу вислову й контраст із адресатами.
theological_decisions:
- issue: Передача γεέννα
  choice: геєна
  alternative: пекло
  rationale: Грецький текст уживає конкретний термін із юдейським історичним та есхатологічним тлом; звичний узагальнений відповідник наведено в примітці.
- issue: Передача υἱὸν γεέννης
  choice: сином геєни
  alternative: приреченою на геєну людиною
  rationale: Буквальніша форма зберігає семітський ідіом і його богословську напругу, не пояснюючи його однозначно всередині тексту.
- issue: Рід займенникового посилання після προσήλυτον
  choice: одну людину ... вона ... її
  alternative: одного прозеліта ... він ... його
  rationale: Українське «людина» граматично жіночого роду, але стосується особи будь-якої статі; це природно передає неіндивідуалізований приклад, тоді як грецький чоловічий рід узгоджується з іменником προσήλυτος.
translation_notes:
  register: Сучасна, зрозуміла й водночас урочиста українська. Збережено традиційні назви «книжники», «фарисеї» та семітський вислів «син геєни». Частку «хоча б» ужито для природного відтворення наголосу на ἕνα в контексті великих зусиль заради одного наверненого.
