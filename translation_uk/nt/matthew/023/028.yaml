source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς ἔξωθεν μὲν φαίνεσθε τοῖς ἀνθρώποις δίκαιοι, ἔσωθεν δέ ⸂ἐστε μεστοὶ⸃ ὑποκρίσεως καὶ ἀνομίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/028.yaml
  text: In the same way[a], you also outwardly appear righteous to people, but inwardly you are full of hypocrisy and lawlessness.
translation:
  language: uk
  text: 'Так само й ви: зовні здаєтеся людям праведними, а всередині ви сповнені лицемірства й беззаконня.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: Так само
  rationale: Передає порівняльний зв’язок із попереднім образом побілених гробів природною сучасною українською.
- source_word: ἔξωθεν … ἔσωθεν
  choice: зовні … всередині
  rationale: Зберігає виразне просторове й метафоричне протиставлення зовнішнього вигляду та внутрішньої дійсності.
- source_word: φαίνεσθε
  choice: здаєтеся
  rationale: Передає враження, яке вони справляють на людей, не стверджуючи, що вони насправді праведні.
- source_word: τοῖς ἀνθρώποις
  choice: людям
  rationale: Природний гендерно загальний відповідник грецького позначення людей; український переклад не потребує примітки з варіантом «чоловікам».
- source_word: δίκαιοι
  choice: праведними
  rationale: Зберігає морально-релігійний зміст слова в контексті Ісусового викриття.
- source_word: μεστοὶ
  choice: сповнені
  rationale: Природно передає прикметникове значення «повні» та добре поєднується з абстрактними іменниками.
- source_word: ὑποκρίσεως
  choice: лицемірства
  rationale: Точно й зрозуміло передає морально-релігійну нещирість.
- source_word: ἀνομίας
  choice: беззаконня
  rationale: Зберігає зв’язок із порушенням або відкиненням закону, не зводячи значення до загального «зла».
theological_decisions:
- issue: Чи називає δίκαιοι справжню праведність, чи лише видимість праведності
  choice: Праведність лише у сприйнятті людей
  alternative: Справжня праведність
  rationale: Форма φαίνεσθε разом із давальним τοῖς ἀνθρώποις і протиставленням внутрішньому лицемірству та беззаконню вказує на зовнішнє враження, а не на підтвердження реального морального стану.
translation_notes:
  register: Сучасна стандартна українська, проста й гідна. Двокрапка після «ви» виразно вводить зіставлення «зовні — всередині»; займенник «ви» у другій частині збережено відповідно до грецької конструкції та для наголосу.
