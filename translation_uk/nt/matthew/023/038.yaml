  source_fidelity: «Залишається» передає радше стан тривання («remains»), ніж пасивне ἀφίεται («is left/abandoned»). Безособова пасивна конструкція «залишено» природніше відтворює те, що дім полишено адресатам, не називаючи діяча. «Пусткою» передає ἔρημος як стан запустіння, не уточнюючи механізму руйнування.
