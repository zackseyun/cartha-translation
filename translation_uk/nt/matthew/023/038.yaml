  text: Ось ваш дім залишено вам пусткою.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «ваш храм»; вислів «ваш дім» може стосуватися передусім храму, хоча грецький текст залишає його значення ширшим.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Ось
  rationale: Природний сучасний український засіб привернення уваги, який зберігає урочистість і виразність проголошення.
- source_word: ἀφίεται
  choice: залишається
  rationale: Теперішній пасивний індикатив передано формою «залишається», що зберігає пасивний зміст і не уточнює прямо діяча.
- source_word: ὑμῖν
  choice: вам
  rationale: Давальний відмінок відтворено буквально й природно, зберігаючи думку про те, що дім лишається адресатам.
- source_word: ὁ οἶκος ὑμῶν
  choice: ваш дім
  rationale: Буквальне й природне відтворення широкого грецького вислову без звуження його значення до храму, Єрусалима чи народу.
- source_word: ἔρημος
  choice: спустошеним
  rationale: Слово передає стан покинутості й запустіння в контексті пророчого суду; воно місткіше за «порожнім» і сильніше за «безлюдним».
theological_decisions:
- issue: До чого стосується вислів «ваш дім»
  choice: У головному тексті збережено «ваш дім».
  alternative: «ваш храм», «Єрусалим» або «дім Ізраїлю»
  rationale: Контекст може вказувати насамперед на храм і Єрусалим, але грецький вислів ширший. Буквальне «ваш дім» зберігає навмисну образність і не усуває богословської неоднозначності.
- issue: Діяч, який залишає дім
  choice: Збережено пасивну конструкцію «залишається».
  alternative: «Бог залишає» або «я залишаю»
  rationale: Грецький текст не називає діяча прямо, тому переклад не робить його явним.
translation_notes:
  register: Сучасна стандартна українська; стислий, урочистий і зрозумілий стиль. Порядок слів наближений до природного українського синтаксису, а образність оригіналу збережено.
