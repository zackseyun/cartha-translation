  text: ⸀τυφλοί, τί γὰρ μεῖζον, τὸ δῶρον ἢ τὸ θυσιαστήριον τὸ ἁγιάζον τὸ δῶρον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/019.yaml
  text: Blind men[a], for which is greater[b], the gift or the altar that sanctifies the gift?
translation:
  language: uk
  text: 'Сліпі! Бо що більше: дар чи жертовник, який освячує дар?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τυφλοί
  choice: Сліпі
  rationale: Субстантивований прикметник у кличній функції передає прямий докір. Українське «Сліпі!» природне й не додає слова «нерозумні», яке є в попередньому контексті, але відсутнє тут.
- source_word: τί γὰρ μεῖζον
  choice: Бо що більше
  rationale: «Що більше» зберігає порівняльне запитання, а «бо» передає пояснювальну силу γάρ.
- source_word: τὸ δῶρον
  choice: дар
  rationale: Буквальне й природне значення δῶρον; у храмовому контексті йдеться про принесений Богові дар, тобто приношення, однак ширше слово «дар» зберігає формулювання оригіналу.
- source_word: θυσιαστήριον
  choice: жертовник
  rationale: Усталений сучасний український відповідник для культового θυσιαστήριον.
- source_word: τὸ ἁγιάζον
  choice: який освячує
  rationale: Передає активний дієприкметниковий зворот і культово-богословський зміст ἁγιάζω природною сучасною українською мовою.
theological_decisions:
- issue: Культова мова ἁγιάζω про зв’язок жертовника й дару
  choice: який освячує дар
  alternative: який робить дар святим; який посвячує дар
  rationale: «Освячує» зберігає твердження, що жертовник надає дарові святості, не зводячи думку лише до церемоніального посвячення.
translation_notes:
  register: Сучасна стандартна українська; стислий, урочистий і зрозумілий виклад. Кличну функцію грецького субстантивованого прикметника природно передано вигуком «Сліпі!». Текстових або перекладацьких приміток для цього варіанта не потрібно.
