  text: And you[a], fill up the measure of your fathers.
translation:
  language: uk
  text: І ви доповніть міру своїх батьків.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «доведіть до повноти міру гріхів своїх батьків». Буквально: «доповніть міру своїх батьків». Це образ накопиченої провини, що сягає своєї межі.'
    reason: Лексична альтернатива й пояснення метафори.
lexical_decisions:
- source_word: καὶ
  choice: І
  rationale: Зберігає звичайний сполучниковий зв’язок із попереднім викриттям та риторичне продовження думки.
- source_word: ὑμεῖς
  choice: ви
  rationale: Окремо вжитий займенник має наголос; українське явне «ви» перед наказовою формою природно передає цю виразність.
- source_word: πληρώσατε
  choice: наповніть
  rationale: Аористовий наказовий спосіб, друга особа множини. «Наповніть» зберігає як форму наказу, так і образ міри, що доходить до повноти.
- source_word: τὸ μέτρον
  choice: міру
  rationale: Буквальний відповідник зберігає метафору певної кількості, яка накопичується до своєї межі, не додаючи прямо не названого слова «гріхів».
- source_word: τῶν πατέρων ὑμῶν
  choice: своїх батьків
  rationale: «Батьків» зберігає буквальне значення та риторичний зв’язок із попереднім контекстом; «своїх» є природним українським відповідником присвійного звороту при підметі «ви».
theological_decisions:
- issue: Наказ чи передбачення у словах Ісуса
  choice: 'Збережено граматичний наказ: «наповніть» — із викривальною, іронічно-судовою силою в контексті.'
  alternative: 'Передбачення: «ви наповнюєте» або «ви наповните» міру своїх батьків.'
  rationale: Форма πληρώσατε морфологічно є аористовим активним імперативом другої особи множини. Тому переклад не перетворює її на просте передбачення, водночас не пояснюючи в основному тексті риторичної сили наказу.
- issue: Що саме становить «міру»
  choice: Збережено незаповнену метафору «міру своїх батьків».
  alternative: «Повну міру гріхів своїх батьків».
  rationale: У грецькому тексті слово «гріхів» відсутнє. Контекст указує на накопичену провину, але основний текст зберігає властиву оригіналу стислість і образність; пояснення подано у примітці.
translation_notes:
  register: Сучасна нормативна українська мова; вислів короткий, урочистий і викривальний. Буквальну метафору збережено, а контекстуально зрозуміле уточнення про гріхи винесено в примітку.
