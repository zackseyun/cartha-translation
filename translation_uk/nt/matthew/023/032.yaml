  rationale: Заміна «наповніть» на «доповніть» зберігає наказовий спосіб і метафору «міри», водночас точніше й природніше передаючи доведення накопиченого до повноти. Основний текст не уточнює, чим є міра, а примітка обережно пояснює контекстуальний образ провини.
