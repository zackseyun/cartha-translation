  text: μωροὶ καὶ τυφλοί, τίς γὰρ μείζων ἐστίν, ὁ χρυσὸς ἢ ὁ ναὸς ὁ ⸀ἁγιάσας τὸν χρυσόν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/017.yaml
  text: 'You fools and blind men, for which is greater: the gold, or the temple that sanctified the gold?'
translation:
  language: uk
  text: 'Нерозумні й сліпі! Бо що більше: золото чи храм[b], який освятив[a] золото?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «зробив золото святим».'
    reason: lexical_alternative
  - marker: b
    text: Грецьке слово ναός може точніше означати храмове святилище, тобто центральну священну частину храму.
    reason: cultural_note
lexical_decisions:
- source_word: μωροὶ
  choice: нерозумні
  rationale: Клична форма множини передає прямий і гострий докір, але без неприродно образливого чи жаргонного відтінку.
- source_word: τυφλοί
  choice: сліпі
  rationale: Субстантивований прикметник у прямому звертанні природно передається українською формою множини «сліпі».
- source_word: τίς γὰρ μείζων ἐστίν
  choice: бо що більше
  rationale: τίς протиставляє два названі предмети; «що більше» є природним українським запитанням, а «бо» зберігає пояснювальну силу γάρ.
- source_word: ὁ χρυσὸς
  choice: золото
  rationale: Контекст указує на конкретне храмове золото; українська мова тут природно обходиться без окремого засобу передачі грецького артикля.
- source_word: ὁ ναὸς
  choice: храм
  rationale: «Храм» є ясним і природним відповідником; можливе точніше значення «храмове святилище» зазначено у примітці.
- source_word: ὁ ἁγιάσας
  choice: який освятив
  rationale: Аористний активний дієприкметник передано минулим доконаним дієсловом, зберігаючи форму та культове значення оригіналу без перетворення її на загальне твердження в теперішньому часі.
- source_word: τὸν χρυσόν
  choice: золото
  rationale: Повтор іменника зберігає риторичну паралельність грецького тексту.
theological_decisions:
- issue: Передача культового дієслова ἁγιάζω в храмовому контексті
  choice: освятив
  alternative: зробив святим
  rationale: '«Освятив» стисло зберігає сакральний зміст і логіку вислову: храм надає золоту священного статусу, не уточнюючи механізму понад сказане в тексті.'
translation_notes:
  register: Сучасна нормативна українська мова; тон прямий, урочистий і викривальний. Збережено пояснювальне «бо», риторичне запитання та повтор слова «золото».
