  naturalness: «На Мойсеєвому сидінні сидять» граматично можливе, проте небажано тавтологічне й менш природне. «На Мойсеєвому сидінні сіли» є усталеним біблійним і зрозумілим висловом сучасною нормативною українською.
  terminology: «Книжники» і «фарисеї» — усталені та точні відповідники. «Мойсеєве сидіння» зберігає образ καθέδρα без зайвого тлумачення його як формальної посади; пояснення про вчительський авторитет доречне в примітці.
