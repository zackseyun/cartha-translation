  text: saying[a], “The scribes and the Pharisees sit in Moses’ seat.”
translation:
  language: uk
  text: 'кажучи: «На Мойсеєвому сидінні сіли книжники та фарисеї».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «сидять на Мойсеєвому сидінні» або «посіли Мойсеєве сидіння». Грецьке дієслово може описувати зайняття цього місця або становище, яке вони обіймають; вислів позначає вчительський авторитет, пов’язаний із Мойсеєм.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: кажучи
  rationale: Дієприкметник теперішнього часу зберігає синтаксичний зв’язок із попереднім віршем і вводить пряму мову Ісуса.
- source_word: Ἐπὶ τῆς Μωϋσέως καθέδρας
  choice: на Мойсеєвому сидінні
  rationale: Прийменник ἐπί з родовим відмінком та іменник καθέδρα передають образ місця навчального авторитету, пов’язаного з Мойсеєм; «сидіння» природно зберігає метафору, не звужуючи її до конкретного предмета меблів.
- source_word: ἐκάθισαν
  choice: сидять
  rationale: Грецький аорист у цьому контексті може описувати зайняте й чинне становище. Український теперішній час природно передає цей стан, не додаючи прямо не вираженої зворотності «самі посіли».
- source_word: οἱ γραμματεῖς
  choice: книжники
  rationale: Усталена українська назва знавців і тлумачів Закону в євангельському контексті.
- source_word: οἱ Φαρισαῖοι
  choice: фарисеї
  rationale: Усталена українська передача назви цієї релігійної групи.
theological_decisions:
- issue: Чи передавати ἐκάθισαν нейтрально як чинне становище, чи як самовільне зайняття авторитетної позиції
  choice: сидять
  alternative: посіли / самі посіли
  rationale: Форма ἐκάθισαν допускає відтінок зайняття місця, але рефлексивність або осуд не виражені явно. Основний текст лишається нейтральним, а примітка зберігає можливий відтінок набутого чи привласненого авторитету.
translation_notes:
  register: Сучасна нормативна українська мова з гідним біблійним звучанням. Збережено дієприкметниковий зв’язок із попереднім віршем і традиційні, зрозумілі назви «книжники» та «фарисеї»; неоднозначність дієслова пояснено в примітці.
