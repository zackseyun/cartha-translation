  text: πάντα οὖν ὅσα ⸀ἐὰν εἴπωσιν ὑμῖν ⸂ποιήσατε καὶ τηρεῖτε⸃, κατὰ δὲ τὰ ἔργα αὐτῶν μὴ ποιεῖτε, λέγουσιν γὰρ καὶ οὐ ποιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/003.yaml
  text: Therefore[a], do and keep everything they tell you, but do not do according to their works, for they say and do not do.
translation:
  language: uk
  text: Тож усе, що вони скажуть вам, робіть і дотримуйтеся цього; але не робіть так, як вони роблять, бо вони говорять, але не роблять.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντα οὖν ὅσα ἐὰν
  choice: Тож усе, що
  rationale: «Усе, що» природно передає всеохопний зміст πάντα ὅσα ἐὰν, а «тож» стисло виражає висновкове значення οὖν.
- source_word: εἴπωσιν ὑμῖν
  choice: вони скажуть вам
  rationale: Пряме й природне відтворення λέγω без додавання значення формального навчання чи наказу.
- source_word: ποιήσατε καὶ τηρεῖτε
  choice: робіть і дотримуйтеся цього
  rationale: «Робіть» безпосередньо передає ποιέω та зберігає його повтор у вірші. «Дотримуйтеся» передає тривале виконання або додержання, виражене τηρέω; займенник «цього» робить українську фразу природною, не додаючи нового змісту.
- source_word: κατὰ δὲ τὰ ἔργα αὐτῶν μὴ ποιεῖτε
  choice: але не робіть за їхніми вчинками
  rationale: Збережено конструкцію відповідності κατὰ та повтор дієслова ποιέω. «Вчинки» природніше за «діла» позначає тут поведінку; більш ідіоматичний варіант подано у примітці.
- source_word: λέγουσιν γὰρ καὶ οὐ ποιοῦσιν
  choice: бо вони говорять, та не роблять
  rationale: Стисла антитеза та повтор ποιέω збережені без додавання відсутнього в грецькому тексті додатка.
theological_decisions:
- issue: Чи уточнювати, що йдеться про вчення книжників і фарисеїв та їхнє сидіння на Мойсеєвому місці
  choice: Не додавати уточнення, якого немає в самому вірші.
  alternative: «Усе, чого вони навчають вас» або «усе, що вони кажуть вам із Мойсеєвого місця».
  rationale: Попередній контекст визначає, хто такі «вони», але цей вірш не повторює пояснення. Лаконічність грецького тексту збережено без богословського розширення.
- issue: Чи згладжувати повтори ποιέω різними українськими дієсловами
  choice: Зберегти повтор «робіть … не робіть … не роблять».
  alternative: «виконуйте … не наслідуйте … не чинять».
  rationale: Повтор дієслова в оригіналі риторично підкреслює розрив між словами та поведінкою; його важливо не приховувати стилістичним урізноманітненням.
translation_notes:
  register: Сучасна нормативна українська мова, проста й гідна за тоном. Синтаксис лишено стислим, а навмисний повтор дієслова «робити» збережено, попри його дещо різку стилістику.
