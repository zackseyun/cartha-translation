  verdict: revise
  source_fidelity: 'Зміст передано загалом точно: «Тож» коректно відтворює οὖν, «усе, що вони скажуть вам» — всеохопний вислів πάντα ὅσα ἐὰν εἴπωσιν ὑμῖν, а «робіть і дотримуйтеся цього» розрізняє ποιήσατε та τηρεῖτε. Однак «не робіть за їхніми вчинками» є неприродною для сучасної української сполучуваністю. Заміна на «не робіть так, як вони роблять» точно передає κατὰ τὰ ἔργα αὐτῶν і водночас зберігає навмисний повтор ποιέω.'
  naturalness: Початок і завершальна антитеза мають належний сучасний нейтрально-піднесений регістр. Формула «робити за вчинками» звучить як калька; конструкція «не робіть так, як вони роблять» є нормативною, прозорою та природною.
  terminology: «Вчинки» як відповідник ἔργα можливий, але в цій синтаксичній конструкції не може природно бути стандартом для «робіть». Перефразування через «так, як вони роблять» не нав’язує тлумачення і відтворює поведінковий зміст ἔργα. Богословськи значущих термінів, що потребують іншого усталеного відповідника, немає.
