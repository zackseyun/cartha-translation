  text: ὄφεις γεννήματα ἐχιδνῶν, πῶς φύγητε ἀπὸ τῆς κρίσεως τῆς γεέννης;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/033.yaml
  text: You snakes[a], offspring of vipers! How will you escape from the judgment of Gehenna?
translation:
  language: uk
  text: Змії, поріддя гадюче! Як ви втечете від суду геєни?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «від суду пекла». Грецькою: «геєна».'
    reason: Подано поширений змістовий відповідник, водночас основний текст зберігає термін оригіналу.
lexical_decisions:
- source_word: ὄφεις
  choice: змії
  rationale: Пряме звертання з викривальною метафорою; «змії» природно й точно передає образ.
- source_word: γεννήματα ἐχιδνῶν
  choice: поріддя гадюче
  rationale: Усталене й виразне українське словосполучення зберігає значення народженого від гадюк та силу осуду; прикметникова форма природніша за буквальне «поріддя гадюк».
- source_word: πῶς φύγητε
  choice: як ви втечете
  rationale: Передає риторичне запитання та спрямованість у майбутнє, не звужуючи вислів до самої спроможності.
- source_word: κρίσεως
  choice: суду
  rationale: Зберігає широке судове значення грецького слова без посилення до однозначного «засудження».
- source_word: γεέννης
  choice: геєни
  rationale: Транслітерація зберігає конкретний історико-есхатологічний термін оригіналу, не ототожнюючи його без пояснення з усіма пізнішими уявленнями про пекло.
theological_decisions:
- issue: Передача γέεννα
  choice: геєна
  alternative: пекло
  rationale: «Геєна» зберігає специфіку грецького терміна та його юдейське тло; поширений відповідник «пекло» подано у примітці.
- issue: Значення κρίσις у сполученні κρίσεως τῆς γεέννης
  choice: суд геєни
  alternative: засудження до геєни
  rationale: Родовий зв’язок в оригіналі допускає стислий вислів «суд геєни»; розгорнуте «засудження до геєни» було б тлумачним уточненням і сильніше визначало б характер суду.
translation_notes:
  register: Сучасна, виразна й гідна українська мова. Різке викривальне звертання оригіналу збережено без пом’якшення; риторичне запитання сформульовано природно.
