reference: Matthew 23:16
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, ὁδηγοὶ τυφλοὶ οἱ λέγοντες· Ὃς ἂν ὀμόσῃ ἐν τῷ ναῷ, οὐδέν ἐστιν, ὃς δ’ ἂν ὀμόσῃ ἐν τῷ χρυσῷ τοῦ ναοῦ ὀφείλει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/016.yaml
  text: Woe to you[a], blind guides, who say, ‘Whoever swears by the temple, it is nothing[b]; but whoever swears by the gold of the temple is bound.’
translation:
  language: uk
  text: 'Горе вам, сліпі провідники, які кажете: «Якщо хто поклянеться храмом[a], то це — ніщо[b]; а якщо хто поклянеться золотом храму, той зобов’язаний».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально також можливо: «у храмі». У цьому контексті йдеться про храм як те, чим клянуться.'
    reason: lexical_alternative
  - marker: b
    text: 'Грецькою буквально: «це — ніщо», тобто таку клятву вважали необов’язковою.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: Горе вам
  rationale: Зберігає усталену пророчу формулу осуду та її сильне риторичне звучання.
- source_word: ὁδηγοὶ τυφλοὶ
  choice: сліпі провідники
  rationale: Безпосередньо передає образ людей, які ведуть інших, хоча самі сліпі.
- source_word: οἱ λέγοντες
  choice: які кажете
  rationale: Означений дієприкметник природно передано підрядним означальним реченням; друга особа узгоджується з прямим звертанням «вам».
- source_word: Ὃς ἂν ὀμόσῃ
  choice: Якщо хто поклянеться
  rationale: Передає неозначену загальну умову, виражену конструкцією з ἄν та аористом кон’юнктива.
- source_word: ἐν τῷ ναῷ
  choice: храмом
  rationale: У контексті формули присяги ἐν позначає те, чим клянуться; український орудний відмінок природно передає цей зміст.
- source_word: οὐδέν ἐστιν
  choice: то це — ніщо
  rationale: Зберігає стислість та еліптичність грецького вислову, не підставляючи пояснення безпосередньо в текст.
- source_word: χρυσῷ τοῦ ναοῦ
  choice: золотом храму
  rationale: Прямо зберігає протиставлення між самим храмом і храмовим золотом.
- source_word: ὀφείλει
  choice: той зобов’язаний
  rationale: Передає значення обов’язку, водночас зберігаючи невиражений у грецькому тексті додаток.
theological_decisions:
- issue: Еліптичні вислови про чинність клятви
  choice: Збережено стислі формули «це — ніщо» та «той зобов’язаний».
  alternative: Розгорнути їх як «така клятва ні до чого не зобов’язує» та «той зобов’язаний її виконати».
  rationale: Грецький текст не називає прямо ані відсутності зобов’язання в першій частині, ані предмета зобов’язання в другій. Збереження еліпсису не усуває справжньої мовної напруги, а примітка пояснює контекстуальний зміст.
translation_notes:
  register: Сучасна літературна українська з урочистим, але зрозумілим викривальним тоном. Вислів «поклянеться храмом» природно відтворює формулу клятви; еліптичне «той зобов’язаний» навмисно зберігає стислість оригіналу.
