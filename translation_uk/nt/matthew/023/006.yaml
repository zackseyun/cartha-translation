lexical_decisions:
- source_word: φιλοῦσι
  choice: люблять
  rationale: Теперішній час φιλέω виражає сильне уподобання; пряме «люблять» природно передає гостроту Ісусової критики.
- source_word: δὲ
  choice: не передано окремим словом
  rationale: Частка δέ тут слабко поєднує цей опис із попереднім реченням; в українській зв’язність природно зберігається без окремого сполучника.
- source_word: τὴν πρωτοκλισίαν
  choice: почесне місце
  rationale: Іменник в однині означає найпочесніше місце для лежання за столом; переклад передає суспільний статус, не нав’язуючи сучасного уявлення про звичайне сидіння.
- source_word: ἐν τοῖς δείπνοις
  choice: на бенкетах
  rationale: У контексті публічного престижу δεῖπνον позначає урочисті або формальні трапези; «бенкети» природно передає це середовище.
- source_word: τὰς πρωτοκαθεδρίας
  choice: найпочесніші місця
  rationale: Слово позначає місця найвищого статусу й першості; «найпочесніші місця» точніше за «найкращі» підкреслює саме суспільну вагу, а не зручність.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: в синагогах
  rationale: Прямий і природний український відповідник місцевого звороту.
