lexical_decisions:
- source_word: Φαρισαῖε τυφλέ
  choice: Сліпий фарисею
  rationale: Передає звертання в кличному відмінку та зберігає різку метафору духовної сліпоти без доданого пояснення.
- source_word: καθάρισον πρῶτον
  choice: очисти спочатку
  rationale: Дококонаний наказовий спосіб передає вимогу рішучої дії, а «спочатку» зберігає логічну й часову першість.
- source_word: τὸ ἐντὸς τοῦ ποτηρίου
  choice: чашу … зсередини
  rationale: Природна українська конструкція точно передає очищення внутрішньої частини чаші.
- source_word: καὶ τῆς παροψίδος
  choice: й миску
  rationale: παροψίς позначає посудину для подавання їжі; «миска» є зрозумілим сучасним відповідником, а ширші можливості зазначено у примітці.
- source_word: ἵνα γένηται καὶ τὸ ἐκτὸς αὐτοῦ καθαρόν
  choice: щоб вони стали чистими й зовні
  rationale: Зберігає результативне значення γένηται («стали») і відповідність між внутрішнім та зовнішнім очищенням. Множина природно узгоджує український вислів із двома названими посудинами, тоді як грецька має формально однину αὐτοῦ.
theological_decisions:
- issue: Конкретний образ посуду чи явне моральне тлумачення
  choice: Збережено буквальний образ очищення чаші й миски зсередини та зовні.
  alternative: Розкрити метафору як очищення внутрішнього й зовнішнього життя.
  rationale: Грецький текст залишає моральний зміст у формі конкретної метафори; явне пояснення звузило б її риторичну силу й додало б тлумачення до основного тексту.
- issue: Однина αὐτοῦ після згадки двох посудин
  choice: У природному українському реченні вжито множину «вони».
  alternative: 'Передати формальну однину: «щоб і зовнішній бік її став чистим».'
  rationale: Формальна однина в українській штучно відносила б результат лише до однієї з двох посудин, тоді як образ стосується названого посуду як цілого. Множина не змінює суті вислову.
translation_notes:
  register: Сучасна нормативна українська мова; тон прямий, урочистий без архаїзації. Конкретну побутову метафору збережено, а синтаксис зроблено природним для широкого кола читачів.
