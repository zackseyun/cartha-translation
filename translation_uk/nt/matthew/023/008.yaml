  text: But you are not to be called ‘Rabbi,’ for one is your teacher[b][a], and you are all brothers.
translation:
  language: uk
  text: А ви не дозволяйте, щоб вас називали «раббі»[a], бо у вас один учитель, а всі ви — брати[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «учитель». Титул «раббі» має значення «учитель»; транслітерація зберігає юдейське тло й не зливає його з наступним словом «учитель» у цьому вірші.
    reason: lexical_alternative
  - marker: b
    text: Грецьке ἀδελφοί має форму чоловічого роду множини; у цьому контексті воно може колективно означати співучнів.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ κληθῆτε
  choice: не дозволяйте називати себе
  rationale: 'Природно передає заборону, виражену μή з аористом пасивного кон’юнктива, і водночас зберігає пасивну думку: йдеться про титул, яким їх називають інші.'
- source_word: Ῥαββί
  choice: Раббі
  rationale: Транслітерація зберігає юдейське історичне тло та не зливає цей титул із наступним словом διδάσκαλος.
- source_word: εἷς
  choice: один
  rationale: Безпосередньо передає наголос на єдиному Учителеві, не посилюючи формулювання доданим словом «лише».
- source_word: ὑμῶν ὁ διδάσκαλος
  choice: один у вас Учитель
  rationale: Природна українська конструкція зберігає співвіднесеність Учителя з учнями та виразний наголос на εἷς.
- source_word: πάντες δὲ ὑμεῖς
  choice: а ви всі
  rationale: Передає протиставний δέ і наголошує на спільному становищі всіх адресатів.
- source_word: ἀδελφοί
  choice: брати
  rationale: Зберігає граматично чоловічий множинний іменник та родинну метафору; можливе колективне позначення учнів пояснено у примітці.
theological_decisions:
- issue: Чи є слова Ісуса абсолютною забороною всіх людських почесних титулів, чи осудом прагнення статусу серед учнів
  choice: Збережено пряму заборону без розширення її до доктринального правила поза формулюванням вірша.
  alternative: Розуміти вислів або як абсолютну заборону будь-якого вживання титулу «Раббі» та подібних титулів, або лише як вузький осуд лицемірного честолюбства.
  rationale: Грецький текст прямо формулює заборону та її підставу, але не визначає всіх можливих подальших застосувань; переклад не повинен вирішувати цю напругу замість читача.
translation_notes:
  register: Сучасна літературна українська, зрозуміла широкому читачеві, із гідним біблійним звучанням. Написання «Раббі» передає грецьке Ῥαββί; велика літера в «Учитель» контекстуально вказує на унікальну постать, не додаючи її імені до тексту.
