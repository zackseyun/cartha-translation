  text: ὁδηγοὶ τυφλοί, ⸀οἱ διϋλίζοντες τὸν κώνωπα τὴν δὲ κάμηλον καταπίνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/024.yaml
  text: Blind guides[a], straining out the gnat but swallowing the camel!
translation:
  language: uk
  text: Сліпі проводирі, які відціджують комара, а верблюда ковтають!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁδηγοὶ τυφλοί
  choice: сліпі проводирі
  rationale: Зберігає прямий метафоричний докір людям, які ведуть інших, але самі духовно не бачать; «проводирі» природно передає роль тих, хто спрямовує.
- source_word: διϋλίζοντες
  choice: відціджують
  rationale: Дієслово означає проціджувати рідину, вилучаючи з неї домішку; «відціджують» стисло й природно передає саме усунення комахи.
- source_word: τὸν κώνωπα
  choice: комара
  rationale: κώνωψ позначає дрібну комаху на зразок комара; українське «комар» є зрозумілим і зберігає різкий контраст розмірів.
- source_word: τὴν δὲ κάμηλον
  choice: а верблюда
  rationale: Протиставний δέ передано сполучником «а», який природно підкреслює абсурдну невідповідність між комаром і верблюдом.
- source_word: καταπίνοντες
  choice: ковтають
  rationale: Прямо й виразно відтворює гіперболічний образ проковтування верблюда без додавання розмовного забарвлення.
theological_decisions:
- issue: Метафорична сила образу ритуальної нечистоти
  choice: Збережено конкретний образ відціджування комара та ковтання верблюда як докір за викривлене розрізнення важливого й другорядного.
  alternative: Передати образ тлумачно як зосередження на малих провинах при нехтуванні великими.
  rationale: Сила вислову полягає в навмисно абсурдному зіставленні двох конкретних образів; буквальне збереження метафори не звужує її до одного богословського пояснення.
translation_notes:
  register: Сучасна нормативна українська мова; вислів стислий, урочисто-викривальний і образний. Порядок слів зберігає паралель та контраст грецьких дієприкметникових конструкцій.
