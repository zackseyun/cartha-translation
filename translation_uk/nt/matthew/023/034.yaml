id: MAT.23.34
reference: Matthew 23:34
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἰδοὺ ἐγὼ ἀποστέλλω πρὸς ὑμᾶς προφήτας καὶ σοφοὺς καὶ γραμματεῖς· ⸀ἐξ αὐτῶν ἀποκτενεῖτε καὶ σταυρώσετε, καὶ ἐξ αὐτῶν μαστιγώσετε ἐν ταῖς συναγωγαῖς ὑμῶν καὶ διώξετε ἀπὸ πόλεως εἰς πόλιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/034.yaml
  text: Therefore, look, I am sending to you prophets and wise men and scribes. Some of them you will kill and crucify, and some of them you will flog in your synagogues and persecute from city to city.
translation:
  language: uk
  text: Тому ось Я посилаю до вас пророків, мудреців і книжників. Одних із них ви вб’єте й розіпнете, а інших бичуватимете у ваших синагогах і переслідуватимете з міста до міста.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Тому
  rationale: Природно й точно передає висновковий зв’язок із попереднім контекстом.
- source_word: ἰδοὺ
  choice: ось
  rationale: Зберігає заклично-вказівну силу грецького слова природною сучасною українською.
- source_word: γραμματεῖς
  choice: книжників
  rationale: Усталений контекстуальний відповідник для знавців і вчителів Писання в юдейському середовищі.
- source_word: ἐξ αὐτῶν … καὶ ἐξ αὐτῶν
  choice: Одних із них … а інших
  rationale: Ясно відтворює розподільну грецьку конструкцію без припущення про точні групи чи кількість.
- source_word: μαστιγώσετε
  choice: бичуватимете
  rationale: Передає конкретне тілесне покарання, а не загальне побиття.
- source_word: διώξετε ἀπὸ πόλεως εἰς πόλιν
  choice: переслідуватимете з міста до міста
  rationale: Зберігає тривалу дію та просторову послідовність оригіналу.
theological_decisions:
- issue: Наголошений суб’єкт ἐγώ у словах Ісуса
  choice: Я посилаю
  alternative: посилаю
  rationale: Велика літера в займеннику за українською побожною видавничою нормою позначає Ісуса, а явний займенник зберігає емфазу грецького ἐγώ, не пояснюючи додатково природу Його повноважень.
- issue: Розподіл майбутніх дій між посланцями
  choice: Одних із них ви вб’єте й розіпнете, а інших бичуватимете…
  alternative: Декого з них ви вб’єте й розіпнете, а декого бичуватимете…
  rationale: Збережено граматичний розподіл між «одними» та «іншими» без твердження, що кожен із першої групи зазнає обох способів страти окремо; координаційна неоднозначність оригіналу не розгортається тлумачно.
translation_notes:
  register: Сучасна стандартна українська; урочистий, але доступний біблійний регістр. Синтаксис наближений до грецького там, де це не шкодить природності. Маркерів приміток немає, оскільки переклад не потребує текстологічного чи суттєвого пояснювального застереження.
