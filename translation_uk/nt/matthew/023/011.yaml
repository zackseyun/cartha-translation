  yaml_path: translation/nt/matthew/023/011.yaml
  text: But the greatest among you will be your servant[a].
translation:
  language: uk
  text: А найбільший серед вас буде вам слугою[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або, буквальніше: «більший із вас буде вам слугою». Грецький вищий ступінь тут може вживатися зі значенням найвищого ступеня — про найвищого за становищем у групі.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: А
  rationale: У цьому контексті δέ позначає протиставлення попередній настанові про звання й становище; українське «А» природно вводить контраст без надмірного підсилення.
- source_word: μείζων
  choice: найбільший
  rationale: 'Формально це вищий ступінь, однак у межах означеної групи він може мати значення найвищого ступеня: той, хто посідає найвище становище.'
- source_word: ὑμῶν (перше)
  choice: серед вас
  rationale: Родовий відмінок має часткове значення й указує на особу всередині групи адресатів.
- source_word: ἔσται
  choice: буде
  rationale: Звичайна й точна передача майбутнього часу дієслова εἰμί сучасною українською.
- source_word: ὑμῶν (друге)
  choice: вам
  rationale: При διάκονος цей родовий виражає відношення служіння до адресатів; «буде вам слугою» природно передає зміст.
- source_word: διάκονος
  choice: слугою
  rationale: Тут слово означає того, хто служить іншим, а не назву усталеного церковного служіння; «слуга» зберігає соціальне перевертання статусу.
theological_decisions:
- issue: Велич і служіння в Ісусовій настанові
  choice: 'Передати вислів як перевертання звичного розуміння становища: найбільший має бути слугою інших.'
  alternative: «Більший із вас буде вашим служителем».
  rationale: Такий переклад зберігає напруження між високим становищем і служінням, не перетворюючи διάκονος на технічну назву церковної посади.
translation_notes:
  register: Сучасна нормативна українська мова; лаконічний, гідний і загальнозрозумілий виклад. Конструкція «буде вам слугою» природна українською та близька до структури грецького тексту.
