  yaml_path: translation/nt/matthew/023/007.yaml
  text: and greetings in the marketplaces, and to be called by men, ‘Rabbi.’
translation:
  language: uk
  text: і привітання на ринках, і щоб люди називали їх «Раббі».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπασμοὺς
  choice: привітання
  rationale: Передає публічні шанобливі вітання, яких вони прагнули, без додавання відсутнього в грецькому тексті означення.
- source_word: ἀγοραῖς
  choice: ринках
  rationale: ἀγορά — ринок і водночас публічний міський простір; «на ринках» природно зберігає конкретний образ оригіналу.
- source_word: ὑπὸ τῶν ἀνθρώπων
  choice: люди
  rationale: 'У пасивній конструкції означає діяча: «щоб люди називали їх». У цьому загальному контексті ἄνθρωποι охоплює людей незалежно від статі, тому «люди» точніше за звужене «чоловіки».'
- source_word: Ῥαββί
  choice: Равві
  rationale: Збережено транслітерований юдейський титул, як в оригіналі; форму подано за усталеним українським біблійним ужитком.
- source_word: καλεῖσθαι
  choice: щоб … називали їх
  rationale: Природна українська перебудова пасивного інфінітива; займенник «їх» відновлює очевидний об’єкт із контексту попереднього вірша.
theological_decisions:
- issue: Загальне чи статево специфічне значення τῶν ἀνθρώπων
  choice: люди
  alternative: чоловіки
  rationale: Артикль із множиною ἄνθρωποι тут позначає людей загалом як тих, хто звертається з титулом; контекст не вимагає значення лише осіб чоловічої статі.
- issue: Передача титулу Ῥαββί
  choice: Равві
  alternative: Учителю
  rationale: Транслітерація зберігає історичний титул і зв’язок із наступним поясненням у Матвія 23:8, не підмінюючи його лише функціональним перекладом.
translation_notes:
  register: Сучасна, природна й гідна українська мова. Рядок синтаксично продовжує перелік із попереднього вірша; двокрапка природно вводить титул, яким їх називають.
