id: MAT.23.23
reference: Matthew 23:23
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ ἄνηθον καὶ τὸ κύμινον, καὶ ἀφήκατε τὰ βαρύτερα τοῦ νόμου, τὴν κρίσιν καὶ ⸂τὸ ἔλεος⸃ καὶ τὴν πίστιν· ⸀ταῦτα ἔδει ποιῆσαι κἀκεῖνα μὴ ⸀ἀφιέναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/023.yaml
  text: 'Woe to you[a], scribes and Pharisees, hypocrites! For you tithe mint and dill and cumin, and have neglected the weightier matters of the law: justice and mercy and faith. These you ought to have done, without neglecting the others.'
translation:
  language: uk
  text: 'Горе вам, книжники та фарисеї, лицеміри! Ви даєте десятину з м’яти, кропу й кмину, але занедбали вагоміше в Законі: справедливість, милосердя та вірність[a]. Це належало робити, не занедбуючи й того.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «віру». Грецьке слово може означати віру, довіру або вірність; у цьому етичному контексті його часто розуміють як вірність.
    reason: Збереження лексичної неоднозначності πίστις.
lexical_decisions:
- source_word: Οὐαὶ
  choice: Горе вам
  rationale: Зберігає силу пророчого осуду й природно звучить у сучасній українській.
- source_word: γραμματεῖς
  choice: книжники
  rationale: Усталений і точний відповідник назви знавців та тлумачів Писання в євангельському контексті.
- source_word: ὑποκριταί
  choice: лицеміри
  rationale: Передає тут основне етичне значення — людей, чиї зовнішні прояви побожності не відповідають їхнім учинкам.
- source_word: ἀποδεκατοῦτε
  choice: даєте десятину
  rationale: Ясно передає сплату десятої частини й природніше для широкого кола сучасних читачів, ніж дієслово «десятинуєте».
- source_word: ἡδύοσμον
  choice: м’ята
  rationale: Звичайна українська назва цієї рослини.
- source_word: ἄνηθον
  choice: кріп
  rationale: Стандартна українська назва згаданої пряної рослини.
- source_word: κύμινον
  choice: кмин
  rationale: Стандартна сучасна українська назва прянощів.
- source_word: ἀφήκατε
  choice: занедбали
  rationale: У цьому контексті означає залишити без належної уваги чи виконання; слово передає докір і зв’язує обидві частини вислову.
- source_word: τὰ βαρύτερα τοῦ νόμου
  choice: вагоміше в Законі
  rationale: Зберігає метафору ваги, водночас природно виражаючи більшу важливість названих вимог.
- source_word: κρίσιν
  choice: справедливість
  rationale: В етичній тріаді йдеться про справедливе ставлення та чинення правосуддя, а не лише про акт судження.
- source_word: ἔλεος
  choice: милосердя
  rationale: Усталений біблійний відповідник, який точно передає співчутливе й милостиве ставлення.
- source_word: πίστιν
  choice: вірність
  rationale: В етичному переліку вимог Закону найприродніше позначає надійність і відданість; ширше можливе значення «віра» збережено в примітці.
- source_word: ταῦτα ... κἀκεῖνα
  choice: Це ... й того
  rationale: Займенникове протиставлення збережено без нав’язування однозначного граматичного співвіднесення понад те, що виражає грецький текст.
theological_decisions:
- issue: Значення πίστιν в етичній тріаді
  choice: вірність
  alternative: віра
  rationale: Поряд зі справедливістю та милосердям слово природно описує етичну якість — надійність або відданість. Оскільки πίστις також може означати віру чи довіру, цю справжню лексичну неоднозначність зазначено в примітці.
- issue: Співвідношення дрібних і вагоміших вимог Закону
  choice: «Це належало робити, не занедбуючи й того»
  alternative: Передати лише осуд дріб’язкового виконання без позитивного схвалення першої групи дій
  rationale: Грецьке ἔδει ποιῆσαι ... μὴ ἀφιέναι прямо стверджує, що одне слід було робити, а іншого не залишати; переклад зберігає цю напругу, не скасовуючи жодної сторони.
translation_notes:
  register: Сучасна стандартна українська з урочистим, але зрозумілим біблійним регістром. «Закон» написано з великої літери як позначення Мойсеєвого Закону. Уникнено архаїзмів і вузькоконфесійної термінології.
