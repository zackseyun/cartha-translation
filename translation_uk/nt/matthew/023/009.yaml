  text: καὶ πατέρα μὴ καλέσητε ὑμῶν ἐπὶ τῆς γῆς, εἷς γάρ ἐστιν ⸂ὑμῶν ὁ πατὴρ⸃ ὁ ⸀οὐράνιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/009.yaml
  text: And call no man on earth your father[a], for one is your Father[b], the heavenly One.
translation:
  language: uk
  text: І нікого на землі не називайте своїм батьком, бо один у вас Батько — Небесний.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «бо один у вас Батько — небесний Батько»; або: «бо один у вас Батько — Той, Хто на небі».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πατέρα μὴ καλέσητε ὑμῶν
  choice: нікого… не називайте своїм батьком
  rationale: Заперечна конструкція з аористовим кон’юнктивом передає пряму заборону. «Називати своїм батьком» природно відтворює предикативне вживання πατέρα з ὑμῶν і зберігає паралель із другою частиною.
- source_word: ἐπὶ τῆς γῆς
  choice: на землі
  rationale: Природний український відповідник, що зберігає просторове протиставлення небесному.
- source_word: εἷς
  choice: один
  rationale: Безпосередньо передає грецький числівник, не додаючи слова «тільки», хоча винятковість зрозуміла з контексту.
- source_word: ὑμῶν ὁ πατήρ
  choice: у вас Батько
  rationale: Конструкція «один у вас Батько» природна українською та передає належність, виражену родовим займенником ὑμῶν.
- source_word: ὁ οὐράνιος
  choice: Небесний
  rationale: Субстантивований прикметник відтворено субстантивовано, без додавання іменника чи розгортання в підрядне речення.
theological_decisions:
- issue: Обсяг Ісусової заборони
  choice: Зберегти різке пряме формулювання без пояснювального обмеження сфери його застосування.
  alternative: Уточнити, що йдеться лише про духовний почесний титул, або подати це як абсолютну заборону будь-якого людського вживання слова «батько».
  rationale: Грецький текст формулює пряму заборону, але сам вірш не пояснює її співвідношення з біологічним чи суспільним уживанням слова. Переклад має зберегти цю богословську напругу, а не вирішувати її доданим тлумаченням.
- issue: Значення ὁ οὐράνιος
  choice: Небесний
  alternative: небесний Батько; Той, Хто на небі
  rationale: Субстантивоване «Небесний» найближче зберігає граматично виразну форму грецького тексту, тоді як альтернативи роблять неявне уточнення явним.
translation_notes:
  register: Сучасна, урочиста й загальнозрозуміла українська. Велика літера в словах «Батько» і «Небесний» позначає Бога; тире природно оформлює прикладкове найменування. У головному тексті збережено лаконічність і богословську напругу оригіналу.
