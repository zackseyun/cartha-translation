source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ⸀παρομοιάζετε τάφοις κεκονιαμένοις, οἵτινες ἔξωθεν μὲν φαίνονται ὡραῖοι ἔσωθεν δὲ γέμουσιν ὀστέων νεκρῶν καὶ πάσης ἀκαθαρσίας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/027.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you are like whitewashed tombs, which outwardly appear beautiful[b], but inwardly are full of dead people's bones and every kind of uncleanness.
translation:
  language: uk
  text: Горе вам, книжники та фарисеї, лицеміри! Бо ви схожі на побілені гроби[a], які зовні здаються гарними, а всередині повні кісток мертвих і всякої нечистоти[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «гроби, вибілені вапном».'
    reason: lexical_alternative
  - marker: b
    text: У цьому контексті «нечистота» може означати як обрядову нечистоту, так і моральну зіпсутість.
    reason: cultural_note
lexical_decisions:
- source_word: Οὐαὶ
  choice: Горе
  rationale: Зберігає силу пророчого викриття й проголошення суду, а не лише вираження смутку.
- source_word: γραμματεῖς
  choice: книжники
  rationale: Усталена й точна назва знавців і тлумачів Закону в тогочасному юдейському середовищі.
- source_word: Φαρισαῖοι
  choice: фарисеї
  rationale: Усталена українська передача назви релігійної групи.
- source_word: ὑποκριταί
  choice: лицеміри
  rationale: Природно передає викриття релігійної та моральної удаваності.
- source_word: παρομοιάζετε
  choice: ви подібні до
  rationale: Прямо й природно передає порівняння без незграбної пасивної конструкції.
- source_word: τάφοις κεκονιαμένοις
  choice: побілених гробниць
  rationale: «Гробниці» відповідають образу облаштованих місць поховання, а «побілених» передає покриття вапном.
- source_word: ἔξωθεν μὲν ... ἔσωθεν δὲ
  choice: зовні ... а всередині
  rationale: Зберігає виразний контраст між зовнішнім виглядом і внутрішньою дійсністю.
- source_word: φαίνονται ὡραῖοι
  choice: здаються гарними
  rationale: Передає і візуальну привабливість, і наголос на оманливій зовнішності.
- source_word: γέμουσιν
  choice: повні
  rationale: Стисла й природна українська передача значення «бути наповненим».
- source_word: ὀστέων νεκρῶν
  choice: кісток померлих
  rationale: Точно передає родову конструкцію й природно звучить сучасною українською.
- source_word: πάσης ἀκαθαρσίας
  choice: всякої нечистоти
  rationale: Зберігає широту вислову, не звужуючи його лише до обрядової або лише до моральної нечистоти.
theological_decisions:
- issue: Зміст ἀκαθαρσία в образі гробниць
  choice: нечистота
  alternative: обрядова нечистота; моральна зіпсутість
  rationale: Гробниці в юдейському контексті викликають уявлення про обрядове осквернення, тоді як викриття лицемірства вказує і на внутрішню моральну зіпсутість. Широке слово «нечистота» зберігає обидва відтінки.
translation_notes:
  register: Сучасна стандартна українська мова з урочистим, але зрозумілим викривальним тоном. Риторичний контраст між зовнішнім і внутрішнім збережено; вузькоконфесійних тлумачень не додано.
