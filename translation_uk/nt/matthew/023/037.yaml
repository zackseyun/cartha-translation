language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Ἰερουσαλὴμ Ἰερουσαλήμ, ἡ ⸀ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν— ποσάκις ἠθέλησα ἐπισυναγαγεῖν τὰ τέκνα σου, ὃν τρόπον ⸂ὄρνις ἐπισυνάγει⸃ τὰ νοσσία ⸀αὐτῆς ὑπὸ τὰς πτέρυγας, καὶ οὐκ ἠθελήσατε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/037.yaml
  text: Jerusalem[a], Jerusalem, the one who kills the prophets and stones those sent to her—how often I wanted to gather your children together, the way a hen gathers her chicks under her wings[b], and you were not willing!
translation:
  language: uk
  text: Єрусалиме, Єрусалиме, ти, що вбиваєш пророків і каменуєш посланих до тебе, — скільки разів Я хотів зібрати твоїх дітей, як квочка збирає своїх курчат під свої крила[a], та ви не захотіли!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Грецьке слово, перекладене як «квочка», може означати й птаха загалом, але тут образ пташенят, яких вона збирає під крила, вказує саме на квочку.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰερουσαλὴμ Ἰερουσαλήμ
  choice: Єрусалиме, Єрусалиме
  rationale: Кличний відмінок природно передає пряме, емоційно підсилене звертання з повтором.
- source_word: ἡ ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα
  choice: ти, що вбиваєш пророків і каменуєш
  rationale: Відносна конструкція природна українською та зберігає характеристичний, тривалий відтінок дієприкметників теперішнього часу.
- source_word: τοὺς ἀπεσταλμένους πρὸς αὐτήν
  choice: посланих до тебе
  rationale: Пасивний дієприкметник збережено стисло; друга особа узгоджується з прямим звертанням до персоніфікованого міста.
- source_word: ποσάκις ἠθέλησα
  choice: скільки разів Я хотів
  rationale: Передає повторюваність і справжнє бажання без посилення до значення постанови чи визначення.
- source_word: ἐπισυναγαγεῖν τὰ τέκνα σου
  choice: зібрати твоїх дітей
  rationale: Зберігає образ дітей персоніфікованого Єрусалима й не звужує його до певної групи.
- source_word: ὃν τρόπον ὄρνις ἐπισυνάγει τὰ νοσσία αὐτῆς
  choice: як квочка збирає своїх курчат
  rationale: ὄρνις може означати птаха загалом, але материнський образ із пташенятами під крилами природно конкретизується як квочка; νοσσία тут доречно передано як курчата.
- source_word: ὑπὸ τὰς πτέρυγας
  choice: під крила
  rationale: Пряме й природне відтворення просторового захисного образу; присвійність зрозуміла з контексту.
- source_word: καὶ οὐκ ἠθελήσατε
  choice: та ви не захотіли
  rationale: Множина оригіналу навмисно збережена, показуючи перехід від персоніфікованого міста до його людей; той самий корінь «хотіти» зберігає вольовий контраст.
theological_decisions:
- issue: Вольовий контраст між Ісусом і Єрусалимом
  choice: 'Обидві форми θέλω передано спільним дієсловом «хотіти»: «Я хотів… ви не захотіли».'
  alternative: Посилити першу форму як «Я постановив» або послабити її до суто емоційного «Я прагнув».
  rationale: Так зберігається явна напруга тексту між бажанням Ісуса й небажанням адресатів без розв’язання ширших богословських питань.
- issue: Зміна числа в адресуванні
  choice: «до тебе… твоїх дітей… ви не захотіли»
  alternative: 'Уніфікувати все в однині: «ти не захотів/захотіла».'
  rationale: Оригінал переходить від однини, зверненої до міста, до множини ἠθελήσατε, зверненої до людей; цю значущу зміну слід зберегти.
- issue: Ідентичність «твоїх дітей»
  choice: Збережено буквальний родинний образ без уточнення.
  alternative: «Твоїх мешканців» або «твій народ».
  rationale: «Діти» передає персоніфікацію міста та не нав’язує вужчого тлумачення.
translation_notes:
  register: Сучасна літературна українська з урочистим, але доступним звучанням. Кличний «Єрусалиме» та повтор зберігають тон плачу. «Каменуєш» є точним і загальнозрозумілим біблійним дієсловом. Знак оклику після першої характеристики природно оформлює емоційне звертання, а «та» виразно передає заключний контраст.
