  source_fidelity: 'Зміст передано точно: γάρ відтворено як «Адже», ἀπ’ ἄρτι — «відтепер», емфатичне οὐ μή — «точно не», а часову межу ἕως ἂν εἴπητε — «доки не скажете». Переклад не конкретизує, коли саме станеться майбутнє «бачення».'
  naturalness: Текст звучить нормативно й природно для сучасної української, з доречно урочистим біблійним регістром. «Точно не побачите» є зрозумілим сучасним способом передати емфатичне заперечення.
  terminology: «Благословенний», «в ім’я Господа» та «Мене» відповідають усталеній біблійній українській термінології. Утім, велика літера в «Той, Хто» може надати учасникові цитати наперед визначеного титульного/богословського статусу, якого сама граматика цитати не маркує.
  issues:
