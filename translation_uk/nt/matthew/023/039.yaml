  text: λέγω γὰρ ὑμῖν, οὐ μή με ἴδητε ἀπ’ ἄρτι ἕως ἂν εἴπητε· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/039.yaml
  text: For I tell you[a], from now on you will certainly not see me until you say[b], ‘Blessed is he who comes in the name of the Lord.’
translation:
  language: uk
  text: 'Адже кажу вам: відтепер ви точно не побачите Мене, доки не скажете: «Благословенний той, хто приходить в ім’я Господа!»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Цитата або алюзія на Псалом 118:26 (у деяких системах нумерації — 117:26).
    reason: cross_reference
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Адже кажу вам
  rationale: «Кажу вам» природно передає формулу прямого звернення, а «адже» зберігає пояснювальний зв’язок γάρ із попереднім висловом.
- source_word: οὐ μή
  choice: точно не
  rationale: Подвійне заперечення з аористом кон’юнктива має підсилювальну силу; «точно не» ясно й природно передає категоричність у сучасній українській.
- source_word: με ἴδητε
  choice: не побачите Мене
  rationale: ὁράω тут має звичайне значення фізичного або особистого бачення; переклад не уточнює подію, під час якої це станеться.
- source_word: ἀπ’ ἄρτι
  choice: відтепер
  rationale: Стисло й точно позначає початок періоду від теперішнього моменту.
- source_word: ἕως ἂν εἴπητε
  choice: доки не скажете
  rationale: Природна українська конструкція передає майбутню межу, виражену ἕως ἄν із кон’юнктивом, не визначаючи конкретного часу чи події.
- source_word: Εὐλογημένος
  choice: Благословенний
  rationale: Зберігає біблійне звучання та зміст формули благословення з Псалма 118:26.
- source_word: ὁ ἐρχόμενος
  choice: Той, Хто приходить
  rationale: Передає субстантивований дієприкметник без надмірного перетворення вислову на спеціальний титул.
- source_word: ἐν ὀνόματι κυρίου
  choice: в ім’я Господа
  rationale: Точно й природно відтворює прийменниковий вислів та його старозавітне звучання.
theological_decisions:
- issue: Майбутнє бачення Ісуса та проголошення благословення
  choice: Збережено урочисту заяву про те, що адресати не побачать Ісуса до майбутнього проголошення наведеної формули.
  alternative: Пов’язати вислів безпосередньо лише з другим приходом, майбутнім покаянням Ізраїлю або іншою конкретною історичною чи есхатологічною подією.
  rationale: Сам грецький текст установлює часову межу, але не називає конкретної події; переклад не повинен усувати цю богословську відкритість.
translation_notes:
  register: Сучасна нормативна українська мова з урочистим біблійним звучанням. «Адже» природніше за формальне «бо» на початку пояснювальної заяви; «точно не» передає емфатичне οὐ μή без архаїчності. Займенник «Мене» та компоненти позначення особи в цитаті подано з великої літери відповідно до поширеної української біблійної практики.
