    issue: Капіталізація «Той, Хто» в цитаті
    rationale: Грецьке ὁ ἐρχόμενος є звичайним артикльованим дієприкметником. Хоча контекст допускає його застосування до Ісуса, велика літера в українському тексті може інтерпретаційно звузити відкритість вислову. Нижній регістр краще зберігає формальну неоднозначність оригіналу.
  - severity: low
    issue: Місце приміткового маркера
    rationale: Примітка визначена як перехресне посилання на цитату Псалма, тому маркер слід поставити після самої цитати, а не після «скажете», щоб його обсяг був однозначним.
