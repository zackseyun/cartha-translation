  verdict: revise
  source_fidelity: Зміст і неназваного виконавця пасивних дій передано вірно; збережено двочленну антитетичну конструкцію. Проте форми «підноситиме себе / принижуватиме себе» є недоконаними майбутніми й додають відтінок тривалої або повторюваної дії, якого грецький майбутній час тут не вимагає. Для загального приповідного вислову природніші теперішні форми.
  naturalness: «Хто підносить себе, той буде принижений, а хто принижує себе, той буде піднесений» звучить нормативно й стисло в сучасній українській та зберігає симетрію вислову. Сполучник «а» природно виражає протиставне зіставлення двох частин.
  terminology: «Підносити себе / бути піднесеним» і «принижувати себе / бути приниженим» відтворюють лексичний паралелізм ὑψόω і ταπεινόω та не конкретизують агента пасивів. Альтернативу «буде понижений» краще замінити на нормативніше й семантично точніше «буде упокорений»; для ὑψωθήσεται можливе «буде звеличений».
