  text: ὅστις δὲ ὑψώσει ἑαυτὸν ταπεινωθήσεται, καὶ ὅστις ταπεινώσει ἑαυτὸν ⸀ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/012.yaml
  text: But whoever exalts himself will be humbled[b][a], and whoever humbles himself will be exalted.
translation:
  language: uk
  text: А хто підносить себе, той буде принижений[a], а хто принижує себе, той буде піднесений.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «буде упокорений»; у другій частині — «буде звеличений».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: хто
  rationale: Неозначений відносний займенник вводить загальний, приповідний принцип; українське «хто» природно передає значення «кожен, хто».
- source_word: δὲ
  choice: А
  rationale: Передає м’який контраст із попереднім контекстом без надмірно різкого протиставлення.
- source_word: ὑψώσει ἑαυτόν
  choice: підноситиме себе
  rationale: Зберігає майбутній час, зворотну конструкцію та значення самозвеличення; дієслово також утворює виразну паралель із «буде піднесений».
- source_word: ταπεινωθήσεται
  choice: буде принижений
  rationale: Прямо передає майбутній пасив, не називаючи виконавця дії.
- source_word: ταπεινώσει ἑαυτόν
  choice: принижуватиме себе
  rationale: Зберігає майбутній час і зворотність вислову, а також лексичну відповідність із «буде принижений» у першій частині.
- source_word: ὑψωθήσεται
  choice: буде піднесений
  rationale: Зберігає майбутній пасив і дзеркальну відповідність із «підноситиме себе».
theological_decisions:
- issue: Виконавець дії в пасивних формах
  choice: Залишити пасивні форми без названого виконавця
  alternative: 'Назвати Бога виконавцем: «Бог принизить / піднесе»'
  rationale: Грецький текст не називає виконавця прямо. Пасивна конструкція зберігає формулювання та богословську відкритість оригіналу.
- issue: Загальний характер вислову
  choice: Передати конструкцією «хто ... себе»
  alternative: «Кожен, хто ... себе»
  rationale: Українське «хто ... себе» природно охоплює будь-яку людину й не потребує додаткового пояснення граматичного чоловічого роду грецького займенника.
translation_notes:
  register: Сучасна нормативна українська мова; стислий, урочистий і приповідний виклад. Дзеркальна будова двох частин та майбутній час оригіналу збережені.
