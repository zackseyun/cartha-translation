  text: Truly I say to you[b][a], all these things will come upon this generation.
translation:
  language: uk
  text: 'Істинно кажу вам: усе це прийде на це покоління[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «цей рід». Грецьке слово найпряміше означає покоління сучасників, хоча в окремих контекстах може вживатися і ширше — про певне коло людей.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: Істинно
  rationale: У синоптичній формулі ἀμὴν λέγω ὑμῖν це слово є урочистим підтвердженням істинності вислову. «Істинно» природно передає його силу українською, не залишаючи незрозумілого запозичення «амінь».
- source_word: λέγω ὑμῖν
  choice: кажу вам
  rationale: Прямий і природний відповідник теперішнього часу λέγω з давальним ὑμῖν; зберігає урочистий ритм усталеної формули.
- source_word: ἥξει
  choice: прийде
  rationale: Майбутня форма ἥκω позначає прихід або настання згаданих наслідків; «прийде на» природно поєднується з наступним зворотом.
- source_word: ταῦτα πάντα
  choice: усе це
  rationale: Грецька конструкція формально має середній рід множини — буквально «усі ці речі», однак українське збірне «усе це» точніше й природніше охоплює всі щойно названі події та наслідки.
- source_word: ἐπὶ
  choice: на
  rationale: Зі знахідним відмінком у цьому контексті ἐπί виражає те, що щось приходить або спадає на когось. Українське «на» зберігає образ без надмірного тлумачення як «проти».
- source_word: γενεὰν ταύτην
  choice: цей рід
  rationale: «Цей рід» є традиційним, але й досі зрозумілим відповідником γενεὰν ταύτην, який може позначати сучасне покоління або ширше коло людей і тому краще зберігає наявну в контексті смислову напругу, ніж однозначніше «це покоління».
theological_decisions:
- issue: Значення γενεὰν ταύτην
  choice: Передано як «цей рід» без пояснення в основному тексті.
  alternative: «це покоління»; ширший клас невіруючих людей; народ упродовж часу; нинішній вік
  rationale: Грецьке γενεά найчастіше вказує на покоління, проте в контексті може характеризувати і певний людський рід або коло людей. Основний текст не повинен остаточно розв’язувати спірне есхатологічне питання; примітка подає найпряміший часовий відповідник.
translation_notes:
  register: Сучасна літературна українська з урочистим біблійним звучанням. Синтаксис стислий і виразний; двокрапка природно відділяє формулу запевнення від змісту вислову. Єдина примітка зберігає неоднозначність γενεά, не нав’язуючи конфесійного тлумачення.
