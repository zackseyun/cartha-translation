source:
  edition: robinson-pierpont-2005-byzantine
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι κατεσθίετε τὰς οἰκίας τῶν χηρῶν, καὶ προφάσει μακρὰ προσευχόμενοι· διὰ τοῦτο λήψεσθε περισσότερον κρίμα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/014.yaml
  text: Woe[a] to you, scribes and Pharisees, hypocrites! For you devour widows' houses, and as a pretext make long prayers; therefore you will receive greater condemnation.
translation:
  language: uk
  text: Горе вам, книжники та фарисеї, лицеміри! Адже ви пожираєте доми вдів і під приводом довго молитеся. За це ви приймете суворіший осуд.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Цього вірша немає в найдавніших грецьких рукописах, зокрема в Синайському й Ватиканському кодексах IV століття, а також у ранніх коптських перекладах. Проте він зберігся у візантійській більшості рукописів, старолатинських перекладах, Вульгаті та сирійських перекладах. Імовірно, пізніші переписувачі додали його для узгодження з подібними висловами в Марка 12:40 та Луки 20:47. Рукописи, що містять цей вірш, розміщують його або перед віршем 13, або після нього.
    reason: textual_critical
lexical_decisions:
- source_word: κατεσθίετε
  choice: пожираєте
  rationale: Зберігає сильну грецьку метафору безжального визиску, що веде до втрати вдовами їхнього майна й засобів до життя.
- source_word: τὰς οἰκίας τῶν χηρῶν
  choice: доми вдів
  rationale: Формально відтворює образ «домів», який у контексті охоплює майно та господарство вдів, не звужуючи значення лише до будівель.
- source_word: προφάσει
  choice: задля годиться
  rationale: Природний сучасний вислів для показної дії, яка слугує прикриттям справжніх намірів.
- source_word: περισσότερον
  choice: суворіший
  rationale: У сполученні з κρίμα передає порівняльний ступінь тяжкості карального вироку природніше, ніж буквальне «більший».
- source_word: κρίμα
  choice: осуд
  rationale: У цьому контексті означає негативний судовий вирок, а не нейтральний процес судження.
theological_decisions:
- issue: Зв’язок експлуатації вдів, показної молитви та суворішого осуду
  choice: Збережено причинно-наслідкову послідовність без додаткового пояснення міри покарання.
  alternative: Уточнити як «суворіше покарання».
  rationale: Грецьке κρίμα позначає осуд або вирок; переклад не повинен докладніше за джерело визначати характер чи тривалість покарання.
translation_notes:
  register: Сучасна нормативна українська мова з урочистим, але доступним біблійним звучанням. «Книжники», «фарисеї», «лицеміри» та «горе вам» збережено як усталені й зрозумілі біблійні відповідники; сильну викривальну образність оригіналу не пом’якшено.
