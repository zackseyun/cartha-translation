    reason: lexical_alternative
  - marker: b
    text: Тобто не брали б участі у пролитті крові пророків і не поділяли б пов’язаної з цим провини.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγετε
  choice: кажете
  rationale: Теперішній час, друга особа множини; природно передає безпосереднє звернення Ісуса.
- source_word: Εἰ ἤμεθα ἐν ταῖς ἡμέραις
  choice: Якби ми жили за днів
  rationale: Недоконаний час у нереальній умові щодо минулого передано природною українською умовною конструкцією; «за днів» зберігає часовий біблійний зворот.
- source_word: τῶν πατέρων ἡμῶν
  choice: наших батьків
  rationale: Зберігає чоловічу форму грецького πατέρων та її значення прабатьків у контексті.
- source_word: οὐκ ἂν ἤμεθα
  choice: то не були б
  rationale: Частка ἄν із недоконаним часом виражає нереальний наслідок; український умовний спосіб точно відтворює його.
- source_word: αὐτῶν κοινωνοὶ
  choice: їхніми спільниками
  rationale: κοινωνοί означає тих, хто разом з іншими бере участь або поділяє причетність; «спільники» природно передає тут моральну співучасть, не звужуючи її до юридичного терміна.
- source_word: ἐν τῷ αἵματι τῶν προφητῶν
  choice: у крові пророків
  rationale: Досить буквально зберігає конкретний образ крові й справжню стислість грецького вислову; в контексті йдеться про участь у пролитті крові та пов’язану з цим провину.
theological_decisions:
- issue: Ступінь співучасті у вислові κοινωνοὶ ἐν τῷ αἵματι
  choice: «їхніми спільниками у крові пророків»
  alternative: «співучасниками пролиття крові пророків»
  rationale: Основний текст зберігає образ «крові» й широкий зміст κοινωνοί, не перетворюючи вислів на однозначне пояснення про вбивство; примітка прояснює мається на увазі причетність.
translation_notes:
  register: Сучасна літературна українська з урочистим, але зрозумілим біблійним звучанням. Конструкція «за днів» зберігає усталений часовий образ, а «спільниками у крові» — навмисну образність і богословську напругу оригіналу.
