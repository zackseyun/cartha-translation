  text: and you say[a], ‘If we had been living in the days of our fathers[b], we would not have been partners with them in the blood of the prophets.’
translation:
  language: uk
  text: 'і кажете: «Якби ми жили за днів наших батьків, то не були б їхніми спільниками[a] у пролитті крові пророків[b]».'
  philosophy: optimal-equivalence
  footnotes:
