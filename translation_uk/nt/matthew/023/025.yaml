source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι καθαρίζετε τὸ ἔξωθεν τοῦ ποτηρίου καὶ τῆς παροψίδος, ἔσωθεν δὲ γέμουσιν ἐξ ἁρπαγῆς καὶ ⸀ἀκρασίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/025.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you clean the outside of the cup and the dish, but inside they are full of greed and self-indulgence.
translation:
  language: uk
  text: Горе вам, книжники та фарисеї, лицеміри! Бо ви очищаєте чашу й блюдо зовні, а всередині вони повні здирства й потурання собі.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «жадібності й браку самовладання». Грецькі слова можуть означати хижацьке привласнення, грабунок або здирство, а також нестримне потурання власним бажанням.'
    reason: Лексичні значення ἁρπαγή та ἀκρασία мають діапазон, який неможливо повністю відтворити однією стислою парою українських слів.
lexical_decisions:
- source_word: Οὐαὶ
  choice: Горе
  rationale: Зберігає силу пророчого осуду й природно звучить у сучасній українській біблійній мові.
- source_word: γραμματεῖς
  choice: книжники
  rationale: Усталений український відповідник для знавців і тлумачів Писання в євангельському контексті.
- source_word: Φαρισαῖοι
  choice: фарисеї
  rationale: Усталена українська передача назви цієї релігійної групи.
- source_word: ὑποκριταί
  choice: лицеміри
  rationale: Природно й точно передає морально-релігійне удавання.
- source_word: καθαρίζετε
  choice: очищаєте
  rationale: Передає теперішню активну дію та пасує до контексту ритуальної й образної чистоти.
- source_word: τὸ ἔξωθεν
  choice: зовні
  rationale: Стисло й природно зберігає протиставлення ἔσωθεν — «всередині».
- source_word: ποτηρίου
  choice: чашу
  rationale: Звичний український відповідник назви посудини; знахідний відмінок природно оформлює прямий додаток.
- source_word: παροψίδος
  choice: блюдо
  rationale: Широка назва столової посудини, яка не звужує значення до тарілки чи миски.
- source_word: ἔσωθεν
  choice: всередині
  rationale: Зберігає просторову метафору та прямий контраст із «зовні».
- source_word: γέμουσιν
  choice: вони повні
  rationale: Множина грецького дієслова узгоджується з двома посудинами — чашею та блюдом; займенник запобігає неприродній українській конструкції.
- source_word: ἁρπαγῆς
  choice: грабіжництва
  rationale: Зберігає сильний відтінок хижацького заволодіння, грабунку або здирства, не послаблюючи його до загальної «жадібності».
- source_word: ἀκρασίας
  choice: нестриманості
  rationale: Передає брак самовладання й потурання бажанням, водночас зберігаючи широту грецького слова.
theological_decisions:
- issue: До чого граматично належить внутрішня нечистота
  choice: 'Збережено образ посудин: «всередині вони повні».'
  alternative: «А всередині ви повні…»
  rationale: Форма γέμουσιν є множиною і в межах вислову природно стосується чаші та блюда, хоча метафора виразно викриває самих книжників і фарисеїв. Переклад не підмінює граматичний образ його тлумаченням.
- issue: Моральний чи експлуататорський відтінок ἁρπαγή
  choice: У тексті вжито сильніше «грабіжництво».
  alternative: «жадібність»
  rationale: ἁρπαγή може позначати хижацьке заволодіння, грабунок або здирство. Сильніший відповідник зберігає можливий суспільно-експлуататорський вимір докору, а примітка подає ширший діапазон.
translation_notes:
  register: Сучасна нормативна українська з гідним біблійним звучанням. Усталені терміни «книжники», «фарисеї», «лицеміри» збережено; синтаксис зроблено простим і виразним. Маркер примітки поставлено після пари неоднозначних моральних понять.
