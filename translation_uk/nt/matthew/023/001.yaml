  text: 'Тоді Ісус промовив до натовпів і до Своїх учнів:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Тоді
  rationale: Природний і стислий відповідник часового прислівника, що позначає наступний момент у розповіді.
- source_word: ὁ Ἰησοῦς
  choice: Ісус
  rationale: Означений артикль перед особовим ім’ям є звичайною рисою грецької оповіді й окремо українською не передається.
- source_word: ἐλάλησεν
  choice: промовив
  rationale: Передає завершену мовленнєву дію та природно вводить подальшу пряму мову, не додаючи змісту понад грецьке λαλέω.
- source_word: τοῖς ὄχλοις
  choice: до натовпів
  rationale: Збережено множину грецького ὄχλοις; прийменникова конструкція «до натовпів» природно позначає адресатів мовлення.
- source_word: καὶ
  choice: і
  rationale: Простий єднальний сполучник між двома групами адресатів.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: до Своїх учнів
  rationale: Природно передає давальний відмінок адресата й присвійний родовий αὐτοῦ; «Своїх» однозначно співвідносить учнів із підметом Ісусом.
