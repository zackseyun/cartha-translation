source:
  edition: SBLGNT
  text: καὶ ὁ ὀμόσας ἐν τῷ οὐρανῷ ὀμνύει ἐν τῷ θρόνῳ τοῦ θεοῦ καὶ ἐν τῷ καθημένῳ ἐπάνω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/022.yaml
  text: And whoever swears by heaven swears by the throne of God and by the one seated upon it[a].
translation:
  language: uk
  text: І хто клянеться небом, той клянеться Божим престолом і Тим, Хто сидить на ньому[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Тим, Хто возсідає на ньому».'
    reason: лексична альтернатива до «Тим, Хто сидить на ньому»; «возсідає» виразніше передає престольний образ, але є менш нейтральним у сучасному вжитку
lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: хто клянеться
  rationale: Артикльований аористовий дієприкметник ужито субстантивовано й узагальнено; українська форма теперішнього часу природно передає загальний принцип.
- source_word: ἐν
  choice: ким/чим клянеться (орудний відмінок без прийменника)
  rationale: 'У формулах присяги ἐν із давальним означає об’єкт, яким клянуться; в українській це природно передається орудним відмінком: «клянеться небом», «престолом», «Тим».'
- source_word: οὐρανῷ
  choice: небом
  rationale: У цьому релігійному контексті й у безпосередньому зв’язку з Божим престолом οὐρανός означає небо як небесну сферу, а не просто видимий небосхил.
- source_word: ὀμνύει
  choice: клянеться
  rationale: Теперішній час виражає загальну істину; український теперішній час передає це природно.
- source_word: θρόνῳ τοῦ θεοῦ
  choice: Божим престолом
  rationale: Присвійний прикметник природний у сучасній українській та точно передає грецький родовий відмінок τοῦ θεοῦ.
- source_word: τῷ καθημένῳ
  choice: Тим, Хто сидить
  rationale: Субстантивований дієприкметник позначає Особу, Яка сидить на престолі. Формулювання зберігає шанобливий описовий спосіб називання, не замінюючи його словом «Бог».
- source_word: ἐπάνω αὐτοῦ
  choice: на ньому
  rationale: У контексті престолу вислів означає сидіння на ньому; займенник граматично й змістово відсилає до престолу.
theological_decisions:
- issue: Кого означає «Той, Хто сидить на ньому»
  choice: Шанобливе описове позначення Бога, Який сидить на престолі
  alternative: Більш невизначене «той, хто там сидить» без прямого ототожнення
  rationale: Безпосередня згадка про Божий престол робить референта зрозумілим, але переклад зберігає грецький описовий вислів і не підставляє прямо ім’я «Бог».
translation_notes:
  register: Сучасна стандартна українська, проста й урочиста. Повтор «клянеться» збережено за грецьким синтаксисом; великі літери в «Тим, Хто» сигналізують зрозумілий із контексту божественний референт.
