  source_fidelity: Основний текст точно передає узагальнений субстантивований дієприкметник ὁ ὀμόσας («хто клянеться»), ідіоматичне значення ἐν у формулі присяги через орудний відмінок, повтор ὀμνύει та обидва об’єкти присяги. «Небом», «Божим престолом» і «Тим, Хто сидить на ньому» вірно відтворюють зміст грецького тексту. Займенник «ньому» однозначно стосується престолу.
  naturalness: Фраза звучить природно, сучасно й водночас урочисто українською. Конструкція «І хто …, той …» добре передає узагальнений вислів. «Сидить на ньому» є звичним сучасним відповідником у контексті престолу.
  terminology: «Божий престол» — природне й точне передання θρόνος τοῦ θεοῦ. Описове «Тим, Хто сидить на ньому» зберігає форму оригіналу, не замінюючи її прямо словом «Бог». Великі літери можуть послідовно позначати божественного референта в цьому контексті.
