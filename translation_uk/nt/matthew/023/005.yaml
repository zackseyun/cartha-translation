source:
  edition: SBLGNT
  text: πάντα δὲ τὰ ἔργα αὐτῶν ποιοῦσιν πρὸς τὸ θεαθῆναι τοῖς ἀνθρώποις· πλατύνουσι ⸀γὰρ τὰ φυλακτήρια αὐτῶν καὶ μεγαλύνουσι τὰ ⸀κράσπεδα,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/005.yaml
  text: But they do all their works to be seen by people[b][a], for they widen their phylacteries and enlarge their tassels.
translation:
  language: uk
  text: Усі свої вчинки вони роблять для того, щоб їх бачили люди, бо розширюють свої філактерії[a] та збільшують китиці[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «молитовні футляри». Це невеликі шкіряні футляри з уривками Писання, які деякі юдеї носили на виконання таких приписів, як у Повторенні Закону 6:8.
    reason: cultural_note
  - marker: b
    text: Або «торочки». Пор. Числа 15:38–39, де йдеться про китиці на одязі.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: всі
  rationale: У сполученні з τὰ ἔργα позначає сукупність їхніх учинків; «всі» природно й стисло передає це значення.
- source_word: δὲ
  choice: А
  rationale: Передає контраст із попереднім висловом без надмірно різкого протиставлення.
- source_word: τὰ ἔργα
  choice: свої вчинки
  rationale: «Вчинки» природніше за «діла» позначає тут поведінку та дії; присвійність випливає з αὐτῶν.
- source_word: ποιοῦσιν
  choice: роблять
  rationale: Звичайний український відповідник ποιέω у сполученні з діями або вчинками.
- source_word: πρὸς τὸ θεαθῆναι
  choice: для того, щоб їх бачили
  rationale: Виразно зберігає цільове значення грецької конструкції та пасивний зміст інфінітива.
- source_word: τοῖς ἀνθρώποις
  choice: люди
  rationale: Йдеться про людей загалом, а не лише про чоловіків; в українській підрядній конструкції природно вжито активну форму «люди бачили».
- source_word: γὰρ
  choice: бо
  rationale: Уводить пояснення попереднього твердження й природно передає причинно-пояснювальний зв’язок.
- source_word: πλατύνουσι
  choice: роблять ширшими
  rationale: Безпосередньо передає значення «розширювати, робити широким» і звучить природно щодо філактерій.
- source_word: φυλακτήρια
  choice: філактерії
  rationale: Точний усталений термін для невеликих шкіряних футлярів із текстами Писання; культурну реалію пояснено у примітці.
- source_word: μεγαλύνουσι
  choice: збільшують
  rationale: Зберігає загальне значення «робити більшим», не звужуючи його без достатніх підстав лише до подовження.
- source_word: κράσπεδα
  choice: китиці
  rationale: У цьому юдейському контексті слово позначає приписані Торою китиці на краях одягу; «китиці» конкретніше за ширше «торочки».
theological_decisions:
- issue: Передача юдейських релігійних предметів без полемічного забарвлення
  choice: Ужити точний термін «філактерії» з культурною приміткою та перекласти κράσπεδα як «китиці».
  alternative: Передати φυλακτήρια описово як «молитовні коробочки», а κράσπεδα — як «торочки».
  rationale: У вірші засуджується показове збільшення цих предметів заради людської уваги, а не самі практики чи предмети. Нейтральні конкретні назви не приписують текстові осуду юдейського звичаю як такого.
translation_notes:
  register: Сучасна літературна українська з гідним, доступним синтаксисом. Цільову конструкцію передано розгорнуто задля ясності; спеціальний культурний термін залишено в тексті й пояснено в примітці.
