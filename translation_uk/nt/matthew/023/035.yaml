id: MAT.23.35
reference: Matthew 23:35
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ὅπως ἔλθῃ ἐφ’ ὑμᾶς πᾶν αἷμα δίκαιον ἐκχυννόμενον ἐπὶ τῆς γῆς ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου ἕως τοῦ αἵματος Ζαχαρίου υἱοῦ Βαραχίου, ὃν ἐφονεύσατε μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/035.yaml
  text: so that upon you may come all the righteous blood being poured out on the earth[a], from the blood of righteous Abel to the blood of Zechariah son of Berechiah[b], whom you murdered between the sanctuary and the altar.
translation:
  language: uk
  text: щоб на вас прийшла вся праведна кров, що проливається на землі[a], — від крові праведного Авеля до крові Захарії, сина Варахії[b], якого ви вбили між святинею та жертовником.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «у краї». Грецьке слово може означати як «землю» загалом, так і певну землю чи край.'
    reason: lexical_alternative
  - marker: b
    text: Кого саме названо «Захарією, сином Варахії», достеменно не встановлено. Одні пов’язують його з пророком Захарією, інші — із Захарією, сином Єгояди (2 Хр. 24:20–22). Переклад відтворює грецький текст без змін.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως
  choice: щоб
  rationale: Природно передає цільово-наслідковий зв’язок із попереднім викриттям, не усуваючи властивої конструкції смислової напруги між метою і наслідком.
- source_word: ἔλθῃ ἐφ’ ὑμᾶς
  choice: на вас упала
  rationale: Ідіоматична українська передача буквального «прийшла на вас»; зберігає судовий образ провини за кров, яка падає на адресатів.
- source_word: πᾶν αἷμα δίκαιον
  choice: вся праведна кров
  rationale: 'Зберігає однину та метонімію грецького вислову: йдеться про кров праведних людей.'
- source_word: ἐκχυννόμενον
  choice: що проливається
  rationale: Теперішній пасивний дієприкметник передано підрядним означальним реченням із незавершеним видом, що природно українською відтворює тривалу або повторювану дію.
- source_word: ἐπὶ τῆς γῆς
  choice: на землі
  rationale: γῆ допускає значення «земля» у всесвітньому сенсі та «край/земля» як територія; основний текст зберігає ширше й природніше значення, а виноска — альтернативу.
- source_word: ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου
  choice: від крові праведного Авеля
  rationale: Природний український порядок слів зберігає епітет δίκαιος та родовий зв’язок.
- source_word: ἕως τοῦ αἵματος Ζαχαρίου υἱοῦ Βαραχίου
  choice: до крові Захарії, сина Варахії
  rationale: Точно передає межову конструкцію ἀπό…ἕως і не гармонізує патронім із паралельними біблійними переказами.
- source_word: ὃν ἐφονεύσατε
  choice: якого ви вбили
  rationale: «Вбили» природно й виразно передає φονεύω в прямому звинуваченні; контекст ясно вказує на протиправне позбавлення життя.
- source_word: μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου
  choice: між святинею та жертовником
  rationale: «Святиня» відтворює ναός як храмову будівлю або внутрішню святиню, а не весь храмовий комплекс; «жертовник» є усталеним відповідником θυσιαστήριον.
theological_decisions:
- issue: Кого названо Захарією, сином Варахії
  choice: Залишити ім’я та патронім саме так, як вони стоять у грецькому тексті, не ототожнюючи особу в основному тексті.
  alternative: Ототожнити його з пророком Захарією, сином Варахії, або із Захарією, сином Єгояди (2 Хр. 24:20–22), і відповідно гармонізувати ім’я батька.
  rationale: Історична ідентифікація спірна. Переклад має відтворювати засвідчений грецький текст, а не непомітно виправляти чи узгоджувати його; пояснення належить подати у виносці.
translation_notes:
  register: Сучасна нормативна українська з урочистим, але доступним біблійним звучанням. Збережено образ «праведної крові», видову силу теперішнього пасивного дієприкметника та розрізнення між святинею (ναός) і всім храмовим комплексом.
