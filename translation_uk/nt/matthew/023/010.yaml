  text: μηδὲ κληθῆτε καθηγηταί, ⸂ὅτι καθηγητὴς ὑμῶν ἐστιν εἷς⸃ ὁ χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/010.yaml
  text: Do not be called instructors, for you have one instructor, the Messiah[a].
translation:
  language: uk
  text: І не називайтеся наставниками, бо один у вас Наставник — Месія[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «Христос».
    reason: Лексичний альтернативний відповідник грецького ὁ χριστός.
lexical_decisions:
- source_word: μηδὲ
  choice: І не
  rationale: Сполучник продовжує низку попередніх заборон; «І не» природно зберігає зв’язок із контекстом.
- source_word: κληθῆτε
  choice: називайтеся
  rationale: Пасивна форма стосується того, щоб людину наділяли певним титулом; українська зворотна форма стисло й природно передає цей зміст.
- source_word: καθηγηταί / καθηγητής
  choice: наставниками / Наставник
  rationale: Καθηγητής може означати того, хто веде та навчає. «Наставник» природно передає обидва відтінки й не ототожнює цей термін із διδάσκαλος («учитель») у найближчому контексті.
- source_word: ὅτι
  choice: бо
  rationale: Сполучник вводить підставу заборони; «бо» звучить стисло, природно й гідно.
- source_word: ὑμῶν ἐστιν εἷς
  choice: один у вас Наставник
  rationale: Такий порядок слів природний українською і водночас зберігає наголос грецького тексту на єдиному Наставникові.
- source_word: ὁ χριστός
  choice: Месія
  rationale: Артикль і контекст указують на титульне вживання Χριστός; «Месія» передає зміст титулу та його юдейське тло.
theological_decisions:
- issue: Передача Χριστός
  choice: Месія
  alternative: Христос
  rationale: У цьому реченні слово функціонує як титул. Основний текст передає значення титулу, а традиційний відповідник подано в примітці без усунення лексичної альтернативи.
translation_notes:
  register: Сучасна нормативна українська мова; формулювання стисле й урочисте без архаїзації. Велика літера в «Наставник» у другому вживанні вказує на титульне позначення Месії, не змінюючи синтаксичного змісту.
