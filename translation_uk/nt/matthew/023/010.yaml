  source_fidelity: 'Текст точно передає всі основні елементи грецького оригіналу: продовжувальне «І не» для μηδέ, заборону набувати титулу в «не називайтеся», термін καθηγηταί/καθηγητής як «наставники/Наставник», причинний зв’язок «бо» та наголос на одному наставникові. «Месія» коректно передає титульне ὁ χριστός.'
  naturalness: Фраза звучить природно в сучасній нормативній українській і водночас зберігає стислий урочисто-настановчий регістр. «Один у вас Наставник» є зрозумілим і стилістично доречним порядком слів для цього вислову.
  terminology: «Наставник» вдало зберігає відмінність від διδάσκαλος у сусідньому контексті, не звужуючи καθηγητής лише до шкільного «викладача». «Месія» є обґрунтованим перекладом титула; примітка «Або “Христос”» належно прив’язана до цього слова й точно подає поширений альтернативний відповідник.
