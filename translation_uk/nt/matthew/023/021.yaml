lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: хто клянеться
  rationale: Субстантивований дієприкметник має узагальнене значення; цей природний український вислів передає його без зайвого граматичного маркування роду.
- source_word: ἐν τῷ ναῷ
  choice: храмом
  rationale: У формулі присяги ἐν указує на те, чим клянуться. Український орудний відмінок природно передає значення «клястися чим».
- source_word: ναῷ
  choice: храм
  rationale: У контексті йдеться про Єрусалимський храм; «храм» є ясним і звичним відповідником, хоча ναός точніше може позначати храмову святиню.
- source_word: ὀμνύει
  choice: клянеться
  rationale: Теперішній час формулює загальний принцип і природно передається українським теперішнім часом.
- source_word: ἐν αὐτῷ
  choice: ним
  rationale: Як і перше ἐν, цей вислів належить до формули присяги; орудний займенник природно означає те, чим клянуться.
- source_word: τῷ κατοικοῦντι αὐτόν
  choice: Тим, Хто живе в ньому
  rationale: Субстантивований дієприкметник позначає Бога, Який перебуває у храмі. «Живе» природно передає κατοικοῦντι, а великі літери виразно вказують на очевидного з контексту Божого референта.
theological_decisions:
- issue: Хто є Тим, Хто живе у храмі
  choice: Бог, позначений як «Той, Хто живе в ньому»
  alternative: «тим, хто живе в ньому» без великих літер
  rationale: Контекст пов’язує клятву храмом із Богом, присутність Якого надає храму святості. Великі літери відбивають зрозумілий референт, не додаючи окремого доктринального твердження.
translation_notes:
  register: Сучасна нормативна українська мова; лаконічний, урочистий і загальнозрозумілий біблійний виклад. Повтор «клянеться» збережено відповідно до грецької синтаксичної структури.
