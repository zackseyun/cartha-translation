base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/031.yaml
  text: So you testify against yourselves that you are sons of those who murdered the prophets[a].
translation:
  language: uk
  text: Тож ви свідчите проти самих себе, що ви — сини тих, хто вбив пророків.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «ви свідчите самим собі». Грецький вислів можна передати буквальніше саме так, хоча в цьому контексті їхнє свідчення викриває їх самих.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Тож
  rationale: Передає висновок із попередніх слів природною сучасною українською мовою.
- source_word: μαρτυρεῖτε
  choice: свідчите
  rationale: Точно відтворює значення дієслова й зберігає судово-викривальний відтінок контексту.
- source_word: ἑαυτοῖς
  choice: проти самих себе
  rationale: Грецький давальний буквально допускає «самим собі», але в контексті їхнє свідчення викриває їх; основний текст природно передає цю функцію, а буквальнішу можливість збережено в примітці.
- source_word: ὅτι
  choice: що
  rationale: Вводить зміст свідчення.
- source_word: υἱοί
  choice: сини
  rationale: Зберігає виразно чоловічу родинну метафору та її риторичну силу, охоплюючи як походження, так і моральну солідарність із предками.
- source_word: τῶν φονευσάντων
  choice: тих, хто повбивав
  rationale: «Повбивав» передає завершені насильницькі вбивства групи пророків і природно звучить українською; форма однини узгоджується з підрядною конструкцією «тих, хто» та має множинне значення.
- source_word: τοὺς προφήτας
  choice: пророків
  rationale: Прямий відповідник означеної групи Божих посланців в історії Ізраїлю; українська форма без окремого артикля природно передає означеність із контексту.
theological_decisions:
- issue: Чи передавати υἱοί буквально як «сини», чи ширше як «діти» або «нащадки».
  choice: сини
  alternative: діти; нащадки
  rationale: «Сини» зберігає родинну метафору оригіналу та гостроту звинувачення, не усуваючи підтексту моральної спадкоємності.
translation_notes:
  register: Сучасна стандартна українська; стислий, гідний і виразний викривальний тон. Тире після «ви» підкреслює присудкову конструкцію без додавання нового змісту.
