base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/018.yaml
  text: And[a], ‘Whoever swears by the altar, it is nothing[b]; but whoever swears by the gift on top of it is obligated.’
translation:
  language: uk
  text: 'І: «Хто поклянеться жертовником, то це нічого не важить[b]; а хто поклянеться даром[a], що на ньому, той зобов’язаний».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «пожертвою». Грецьке слово може означати дар, принесений Богові в храмі.
    reason: lexical_alternative
  - marker: b
    text: Тобто, згідно з ученням, яке тут засуджує Ісус, клятва жертовником «нічого не важить», а клятва даром на ньому вважається обов’язковою.
    reason: cultural_note
lexical_decisions:
- source_word: καί
  choice: І ще
  rationale: Сполучник продовжує низку цитованих настанов, які Ісус засуджує; «І ще» природно передає цей дискурсивний зв’язок.
- source_word: Ὃς ἂν ... ὀμόσῃ / ὃς δ’ ἂν ... ὀμόσῃ
  choice: Хто поклянеться ... а хто поклянеться
  rationale: Конструкція ὅς + ἄν з аористом кон’юнктива має узагальнено-умовне значення; українське «хто поклянеться» передає його природно й точно.
- source_word: ἐν τῷ θυσιαστηρίῳ
  choice: жертовником
  rationale: У формулі клятви ἐν позначає те, чим клянуться; безприйменниковий орудний відмінок є природним українським відповідником.
- source_word: θυσιαστήριον
  choice: жертовник
  rationale: Усталений і точний відповідник для жертовника в храмовому контексті.
- source_word: οὐδέν ἐστιν
  choice: це нічого не важить
  rationale: Український вислів природно передає твердження, що така клятва нібито не має сили, не перетворюючи його на пояснювальну парафразу.
- source_word: ἐν τῷ δώρῳ
  choice: даром
  rationale: δῶρον буквально означає дар і в храмовому контексті стосується принесеного Богові дару; культове значення зазначене у примітці.
- source_word: τῷ ἐπάνω αὐτοῦ
  choice: що на ньому
  rationale: Стисло й природно передає розташування дару на жертовнику та зберігає зв’язок займенника з жертовником.
- source_word: ὀφείλει
  choice: зобов’язаний
  rationale: Передає морально-правову обов’язковість клятви, залишаючи невисловленим додаток, як і в грецькому тексті.
theological_decisions:
- issue: Невисловлений зміст зобов’язання у формулі клятви
  choice: той зобов’язаний
  alternative: той зобов’язаний виконати клятву
  rationale: У грецькому тексті додаток при ὀφείλει не названо. Контекст указує на обов’язок дотримати клятву, але основний текст зберігає стислість і неоднозначність джерела.
translation_notes:
  register: Сучасна нормативна українська мова з гідним, доступним стилем. Формулу клятви передано природним орудним відмінком; контраст і стислість грецького вислову збережено.
