  text: ὁ οὖν ὀμόσας ἐν τῷ θυσιαστηρίῳ ὀμνύει ἐν αὐτῷ καὶ ἐν πᾶσι τοῖς ἐπάνω αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/020.yaml
  text: Therefore[a], the one who swears by the altar swears by it and by everything on it.
translation:
  language: uk
  text: Отже, хто клянеться жертовником, той клянеться ним і всім, що на ньому.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οὖν ὀμόσας
  choice: Отже, хто клянеться
  rationale: Артикльований аористовий дієприкметник має узагальнене субстантивоване значення — «хто клянеться», а οὖν передає висновок із попереднього міркування як «отже».
- source_word: ἐν τῷ θυσιαστηρίῳ
  choice: жертовником
  rationale: При ὀμνύω прийменник ἐν позначає те, чим клянуться. Український орудний відмінок природно передає формулу присяги; θυσιαστήριον — «жертовник».
- source_word: ὀμνύει
  choice: той клянеться
  rationale: Теперішній час передає загальне правило. Вказівне «той» робить співвідношення частин речення природним українською.
- source_word: ἐν αὐτῷ
  choice: ним
  rationale: Займенник стосується жертовника; орудний відмінок зберігає значення того, чим клянуться.
- source_word: καὶ ἐν πᾶσι τοῖς ἐπάνω αὐτοῦ
  choice: і всім, що на ньому
  rationale: Субстантивований вислів πᾶσι τοῖς ἐπάνω αὐτοῦ охоплює все, що перебуває на жертовнику, не звужуючи зміст лише до одного дару.
theological_decisions:
- issue: До чого належить вислів «усім, що на ньому»
  choice: Загальна згадка про все, що лежить або міститься на жертовнику
  alternative: «усіма дарами на ньому» або просторове «усім, що над ним»
  rationale: Грецький вислів ширший за окремий «дар» із попереднього контексту. Загальне формулювання зберігає широту джерельного тексту й не уточнює його понад сказане.
translation_notes:
  register: Сучасна стандартна українська; стислий, гідний і зрозумілий виклад. Повтор дієслова «клянеться» збережено відповідно до грецької риторичної побудови.
