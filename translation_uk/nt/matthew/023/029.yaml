id: MAT.23.29
reference: Matthew 23:29
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι οἰκοδομεῖτε τοὺς τάφους τῶν προφητῶν καὶ κοσμεῖτε τὰ μνημεῖα τῶν δικαίων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/029.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites, because you build the tombs of the prophets and decorate the monuments of the righteous[b],
translation:
  language: uk
  text: Горе вам, книжники та фарисеї, лицеміри, бо ви будуєте гробниці пророків і прикрашаєте пам’ятники[a] праведників!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «гробниці» чи «пам’ятні місця». Грецьке слово може означати поховальну споруду або пам’ятне місце; тут його передано як «пам’ятники», щоб відрізнити від «гробниць» раніше у вірші.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαί
  choice: Горе
  rationale: Усталений український вигук осуду й провіщення суду, що зберігає пророчий тон.
- source_word: γραμματεῖς
  choice: книжники
  rationale: Традиційне й точне позначення знавців та тлумачів юдейського Закону; не розширює значення пояснювальним перифразом.
- source_word: Φαρισαῖοι
  choice: фарисеї
  rationale: Усталена українська передача назви релігійної групи.
- source_word: ὑποκριταί
  choice: лицеміри
  rationale: Природна сучасна українська назва людей, чия зовнішня побожність не відповідає їхній справжній поведінці.
- source_word: ὅτι
  choice: бо
  rationale: Передає причинний зв’язок стисло й природно, без утворення окремого реченнєвого фрагмента.
- source_word: οἰκοδομεῖτε
  choice: ви будуєте
  rationale: Безпосередньо передає теперішній час; дієслово саме по собі не вимагає значення «відбудовуєте».
- source_word: τάφους
  choice: гробниці
  rationale: Відповідає спорудженим місцям поховання та природно поєднується з дієсловом «будуєте».
- source_word: προφητῶν
  choice: пророків
  rationale: Пряма передача родового відмінка належності або зв’язку.
- source_word: κοσμεῖτε
  choice: прикрашаєте
  rationale: Ясно передає оздоблення чи надання привабливого вигляду.
- source_word: μνημεῖα
  choice: надгробні пам’ятники
  rationale: Зберігає поховальний і меморіальний відтінки слова та відрізняє його від τάφους («гробниці») у цьому ж вірші.
- source_word: δικαίων
  choice: праведників
  rationale: Субстантивований прикметник природно передано іменником, який позначає праведних людей.
theological_decisions:
- issue: Значення δικαίων у цьому контексті
  choice: праведників
  alternative: справедливих людей
  rationale: Йдеться про морально вірних людей минулого, ймовірно в історії Ізраїлю. «Праведники» зберігає біблійну морально-богословську категорію, не звужуючи її до одного пізнішого доктринального вживання.
translation_notes:
  register: Сучасна нормативна українська з урочистим, але зрозумілим біблійним звучанням. Звертання збережено різким і риторичним; причинний сполучник «бо» поєднує проголошення горя з підставою осуду.
