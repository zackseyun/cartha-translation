  text: І прости нам наші борги[a], як і ми простили нашим боржникам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «провини». Грецький текст уживає образ заборгованості; у цьому контексті він, імовірно, стосується гріхів або образ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφες
  choice: прости
  rationale: Аористовий наказовий спосіб від ἀφίημι в контексті молитви природно передається як «прости»; у сполученні з моральними «боргами» йдеться про прощення, а не лише про фінансове звільнення.
- source_word: τὰ ὀφειλήματα ἡμῶν
  choice: наші борги
  rationale: ὀφειλήματα буквально означає «борги», «те, що належить віддати». Такий переклад зберігає грецьку метафору й лексичний зв’язок із «боржниками» у другій частині вірша.
- source_word: ὡς
  choice: як
  rationale: Стисло й природно передає порівняння між прощенням, якого просять у Бога, і прощенням, уже виявленим людьми.
- source_word: καὶ ἡμεῖς
  choice: і ми
  rationale: Другий καὶ та виражений займенник ἡμεῖς наголошують на людській стороні порівняння; «і ми» зберігає цей акцент.
- source_word: ἀφήκαμεν
  choice: простили
  rationale: Грецький аорист указує на дію як завершену. Українське «простили» природно передає це без нав’язування точнішої часової схеми, ніж дозволяє оригінал.
- source_word: τοῖς ὀφειλέταις ἡμῶν
  choice: нашим боржникам
  rationale: «Боржникам» відтворює спорідненість з «боргами» та зберігає цілісність метафори оригіналу.
theological_decisions:
- issue: Моральна метафора слова ὀφειλήματα
  choice: Зберегти в основному тексті «борги» як образ гріхів або провин перед Богом.
  alternative: «провини» або «гріхи»
  rationale: Оригінал послідовно вживає лексику боргу. Її збереження не звужує зміст до фінансових зобов’язань, а передає моральну метафору, не замінюючи її тлумаченням.
- issue: Часовий відтінок ἀφήκαμεν
  choice: Перекласти доконаним минулим часом «простили».
  alternative: «прощаємо»
  rationale: Аорист подає людське прощення як здійснену дію. Переклад «простили» зберігає напруження вислову й не перетворює його на загальну заяву про звичну поведінку.
translation_notes:
  register: Сучасна нормативна українська мова з молитовною гідністю та простою синтаксичною будовою. Лексичну пару «борги — боржники» збережено для прозорості щодо оригіналу; архаїчних і вузькоконфесійних формулювань уникнуто.
