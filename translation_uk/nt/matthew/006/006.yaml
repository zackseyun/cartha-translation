source:
  edition: SBLGNT
  text: σὺ δὲ ὅταν προσεύχῃ, εἴσελθε εἰς τὸ ταμεῖόν σου καὶ κλείσας τὴν θύραν σου πρόσευξαι τῷ πατρί σου τῷ ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/006.yaml
  text: But when you pray[a], go into your inner room, and after shutting your door, pray to your Father who is in secret; and your Father, who sees in secret[b], will reward you.
translation:
  language: uk
  text: А ти, коли молишся, увійди до своєї внутрішньої кімнати[a] і, зачинивши за собою двері, помолися своєму Отцеві, Який у таємному місці; і твій Отець, Який бачить у таємному, винагородить тебе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «приватної кімнати» чи «комори». Грецьке слово означає внутрішнє приміщення, яке використовували для усамітнення або зберігання речей.
    reason: lexical_alternative
  - marker: b
    text: Або «відплатить тобі». Грецьке дієслово може означати «віддати», «відплатити» або «винагородити» залежно від контексту.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: А ти
  rationale: Наголошений займенник із δέ передає виразне протиставлення лицемірам із попереднього вірша; українське «А ти» природно зберігає цей контраст.
- source_word: ὅταν προσεύχῃ
  choice: коли молишся
  rationale: ὅταν із кон’юнктивом має загальне часове значення; ця форма природно охоплює кожен відповідний випадок молитви.
- source_word: εἴσελθε εἰς τὸ ταμεῖόν σου
  choice: увійди до своєї внутрішньої кімнати
  rationale: ταμεῖον позначає відокремлене внутрішнє приміщення, яке могло бути коморою або приватною кімнатою; «внутрішня кімната» зберігає просторовий образ без звуження до одного призначення.
- source_word: κλείσας τὴν θύραν σου
  choice: зачини двері
  rationale: Аористовий дієприкметник указує на дію, що передує молитві. Українська послідовність однорідних наказових форм передає це природно й зрозуміло.
- source_word: πρόσευξαι τῷ πατρί σου
  choice: помолися своєму Отцеві
  rationale: Передано прямий наказ і особисте, relational designation Бога без додавання відсутнього в тексті означення «Небесному».
- source_word: τῷ ἐν τῷ κρυπτῷ
  choice: Який у таємному місці
  rationale: Субстантивований зворот допускає локативний відтінок прихованої сфери або місця. Такий переклад природніший українською, ніж буквальне «у таємному», і не ототожнює його однозначно з кімнатою.
- source_word: ὁ βλέπων ἐν τῷ κρυπτῷ
  choice: Який бачить у таємному
  rationale: 'Збережено повтор ἐν τῷ κρυπτῷ та його неоднозначність: Отець може бачити у прихованій сфері або те, що відбувається потай.'
- source_word: ἀποδώσει σοι
  choice: віддасть тобі
  rationale: 'ἀποδίδωμι має ширший діапазон, ніж лише «винагородити»: віддати, відплатити, винагородити. «Віддасть тобі» зберігає цю відкритість, а примітка пояснює контекстуальну альтернативу.'
theological_decisions:
- issue: Значення повтореного ἐν τῷ κρυπτῷ
  choice: «у таємному місці» щодо присутності Отця і «у таємному» щодо Його бачення
  alternative: «потай»; «те, що робиться потай»; однакове «у таємному місці» в обох випадках
  rationale: Грецький вислів навмисно пов’язує приховану присутність Отця з Його баченням прихованого. Українська потребує невеликої граматичної варіації, але переклад не зводить вислів ані лише до фізичного місця, ані лише до таємних учинків.
- issue: Характер Божої відповіді в ἀποδώσει σοι
  choice: «віддасть тобі» з приміткою про «винагородить»
  alternative: «винагородить тебе» або «відплатить тобі»
  rationale: Контекст підтримує позитивну Божу відповідь, однак саме дієслово не уточнює її форми. Ширший відповідник не перетворює молитву на механічний обмін і зберігає лексичну напругу.
- issue: Звернення до Бога як πατήρ
  choice: «Отець»
  alternative: «Небесний Отець»
  rationale: У цьому вірші стоїть лише «твій Отець»; додавання «Небесний» було б запозиченням із ширшого контексту, а не перекладом наявного тексту.
translation_notes:
  register: Сучасна нормативна українська з гідним біблійним регістром. Ужито «Отець» як усталене шанобливе позначення Бога; синтаксис зроблено природним, водночас збережено контраст «А ти», послідовність наказів і повтор мотиву таємного.
