id: MAT.6.2
reference: Matthew 6:2
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Ὅταν οὖν ποιῇς ἐλεημοσύνην, μὴ σαλπίσῃς ἔμπροσθέν σου, ὥσπερ οἱ ὑποκριταὶ ποιοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς ῥύμαις, ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων· ἀμὴν λέγω ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/002.yaml
  text: Therefore[a], whenever you give alms, do not sound a trumpet before you, as the hypocrites do in the synagogues and in the streets, so that they may be glorified by people. Truly I say to you[e][d][c][b], they have received their reward in full.
translation:
  language: uk
  text: 'Отже, коли даєш милостиню[a], не сурми перед собою[b], як роблять лицеміри в синагогах і на вулицях, щоб люди їх прославляли[c]. Істинно кажу вам: вони вже одержали всю свою винагороду[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «допомагаєш нужденним» чи «чиниш діла милосердя». Грецький вислів означає доброчинну допомогу бідним.'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «не сповіщай про це сурмою». Грецький текст буквально каже: «не сурми перед собою»; цей образ може бути гіперболічним або метафоричним.'
    reason: lexical_alternative
  - marker: c
    text: 'Або: «щоб люди їх хвалили» чи «шанували». Грецьке дієслово буквально означає «прославляли».'
    reason: lexical_alternative
  - marker: d
    text: 'Вислів «вже одержали всю свою винагороду» відбиває комерційну ідіому: вони вже повністю отримали ту винагороду, на яку можуть розраховувати.'
    reason: cultural_note
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: Отже, коли
  rationale: «Отже» зберігає зв’язок із попередньою настановою, а «коли» природно передає неозначену повторювану обставину з ὅταν і кон’юнктивом.
- source_word: ποιῇς ἐλεημοσύνην
  choice: даєш милостиню
  rationale: Усталений і зрозумілий український відповідник ідіоми про доброчинну допомогу нужденним.
- source_word: μὴ σαλπίσῃς ἔμπροσθέν σου
  choice: не сурми перед собою
  rationale: Збережено буквальний яскравий образ сурмління та природно передано ἔμπροσθέν σου.
- source_word: οἱ ὑποκριταί
  choice: лицеміри
  rationale: Стандартний сучасний відповідник для людей, які показово вдають побожність.
- source_word: ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς ῥύμαις
  choice: в синагогах і на вулицях
  rationale: Точно й природно називає релігійні зібрання та публічні міські місця.
- source_word: ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων
  choice: щоб люди їх прославляли
  rationale: Активна українська конструкція природніша за пасивну, зберігає мету ὅπως і сильне значення δοξάζω; ἄνθρωποι передано гендерно нейтральним «люди».
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Істинно кажу вам
  rationale: Урочиста й усталена українська формула, що зберігає авторитетну силу вислову.
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: вони вже одержали всю свою винагороду
  rationale: 'Передає комерційну ідіому ἀπέχω: винагороду вже отримано повністю, і більше нічого не належить.'
theological_decisions:
- issue: Сила дієслова δοξασθῶσιν
  choice: щоб люди їх прославляли
  alternative: щоб люди їх хвалили / шанували
  rationale: Збережено сильніше лексичне значення «прославляти», не послаблюючи риторичного контрасту між людським визнанням і Божою винагородою.
- issue: Повнота винагороди в ἀπέχουσιν
  choice: вже одержали всю свою винагороду
  alternative: мають свою винагороду
  rationale: Формулювання передає ідіоматичний відтінок повного розрахунку, не додаючи твердження про природу майбутнього суду поза безпосереднім змістом вислову.
translation_notes:
  register: Сучасна нормативна українська мова з гідним біблійним звучанням. «Милостиня», «лицеміри», «синагоги» та «істинно» є загальнозрозумілими усталеними словами; синтаксис зроблено природним без усунення образності й богословської напруги оригіналу.
