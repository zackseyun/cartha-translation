  text: μὴ οὖν μεριμνήσητε εἰς τὴν αὔριον, ἡ γὰρ αὔριον μεριμνήσει ⸀αὑτῆς· ἀρκετὸν τῇ ἡμέρᾳ ἡ κακία αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/034.yaml
  text: Therefore do not worry about tomorrow[a], for tomorrow will worry about itself. Each day has enough trouble of its own.
translation:
  language: uk
  text: Тож не турбуйтеся про завтра, бо завтра потурбується про себе. Кожному дню досить свого лиха.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Кожному дню досить свого зла». Грецьке слово може означати «зло», але тут, імовірно, йдеться про лихо, труднощі чи негаразди, що припадають на день.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεριμνήσητε
  choice: не турбуйтеся
  rationale: У контексті Матвія 6:25–34 дієслово означає тривожну заклопотаність. «Не турбуйтеся» природно передає цю думку сучасною українською.
- source_word: εἰς τὴν αὔριον
  choice: про завтра
  rationale: Прийменниковий зворот позначає спрямованість тривоги на наступний день; українське «про завтра» є точним та ідіоматичним.
- source_word: ἡ αὔριον
  choice: завтра
  rationale: Збережено персоніфікацію завтрашнього дня як підмета наступної частини речення.
- source_word: μεριμνήσει αὑτῆς
  choice: саме про себе потурбується
  rationale: Повтор кореня «турб-» відтворює зв’язок із попередньою забороною, а «саме про себе» виразно передає рефлексивне αὑτῆς.
- source_word: ἀρκετὸν τῇ ἡμέρᾳ
  choice: Кожному дню досить
  rationale: Конструкція з давальним відмінком природно передається українським «кожному дню досить», зберігаючи прислів’яну стислість і розподільний зміст.
- source_word: ἡ κακία αὐτῆς
  choice: свого лиха
  rationale: У цьому контексті κακία позначає лихо, негаразди або тягар дня, а не лише моральне зло. «Лихо» зберігає широту грецького слова та природно звучить у сентенції.
theological_decisions:
- issue: Значення κακία у вислові про тривогу
  choice: лихо
  alternative: зло; негаразди; труднощі
  rationale: Контекст говорить про щоденні тягарі, однак грецьке слово зберігає ширший відтінок зла. «Лихо» передає контекстуальне значення, не звужуючи його до суто побутових труднощів; примітка фіксує можливий буквальніший відповідник.
translation_notes:
  register: Сучасна нормативна українська мова з гідним, стислим і афористичним звучанням. Персоніфікацію «завтра» та повтор дієслова μεριμνάω збережено.
