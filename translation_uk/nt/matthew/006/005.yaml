  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Καὶ ὅταν ⸂προσεύχησθε, οὐκ ἔσεσθε ὡς⸃ οἱ ὑποκριταί· ὅτι φιλοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς γωνίαις τῶν πλατειῶν ἑστῶτες προσεύχεσθαι, ⸀ὅπως φανῶσιν τοῖς ἀνθρώποις· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσι τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/005.yaml
  text: And whenever you pray[a], you shall not be like the hypocrites, because they love to stand and pray in the synagogues and on the corners of the broad streets, so that they may be seen by people. Truly I say to you[c][b], they have received their reward.
translation:
  language: uk
  text: 'І щоразу, коли молитеся, не будьте як лицеміри, бо вони люблять стояти й молитися в синагогах та на кутах широких вулиць[a], щоб їх бачили люди. Істинно кажу вам: вони вже одержали свою нагороду[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на кутах широких вулиць»; можливий ідіоматичний переклад: «на вуличних рогах».'
    reason: lexical_alternative
  - marker: b
    text: 'Дієслово може мати комерційний відтінок: «одержали свою нагороду сповна».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν προσεύχησθε
  choice: щоразу, коли молитеся
  rationale: 'Передає неозначено-повторювальне значення конструкції ὅταν із кон’юнктивом: ідеться про молитву як повторювану практику.'
- source_word: οὐκ ἔσεσθε ὡς
  choice: не будьте як
  rationale: Майбутній час має заборонно-настановчу силу; український наказовий спосіб природно й недвозначно передає її.
- source_word: ὑποκριταί
  choice: лицеміри
  rationale: Усталений сучасний відповідник для людей, які виставляють побожність напоказ; не зводить значення до етимологічного «актори».
- source_word: φιλοῦσιν
  choice: люблять
  rationale: Зберігає сильний відтінок схильності й задоволення від публічної демонстрації.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: в синагогах
  rationale: Зберігає історичну конкретність юдейського середовища.
- source_word: ἐν ταῖς γωνίαις τῶν πλατειῶν
  choice: на розі широких вулиць
  rationale: Природне українське формулювання для помітного місця, максимально близьке до образу кутів широких вулиць; буквальну форму подано в примітці.
- source_word: ἑστῶτες προσεύχεσθαι
  choice: стояти й молитися
  rationale: Відтворює грецьку послідовність і виразно показує публічну позу, не засуджуючи саме стояння як молитовну поставу.
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις
  choice: щоб їх бачили люди
  rationale: Чітко передає мету; «люди» тут точно відтворює родове, а не суто чоловіче значення ἀνθρώποις.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Істинно кажу вам
  rationale: Дигніфікована й зрозуміла формула, що зберігає урочисту силу вислову.
- source_word: ἀπέχουσι τὸν μισθὸν αὐτῶν
  choice: вони вже одержали свою нагороду
  rationale: «Одержали» передає комерційний відтінок ἀπέχουσι, а «вже» виявляє контекстуальну завершеність без категоричного внесення слова «сповна» в основний текст.
theological_decisions:
- issue: Характер застереження щодо молитви
  choice: Засуджується молитва задля людської уваги, а не публічна молитва чи стояча постава самі по собі.
  alternative: Сприйняти слова як загальну заборону молитися стоячи або прилюдно.
  rationale: 'Підрядне речення мети ὅπως φανῶσιν τοῖς ἀνθρώποις прямо визначає предмет критики: прагнення бути побаченими.'
- issue: Завершеність нагороди лицемірів
  choice: вони вже одержали свою нагороду
  alternative: вони одержали свою нагороду сповна
  rationale: ἀπέχουσι може бути комерційним висловом про повне одержання належного. Основний текст зберігає цю завершеність через «вже», а сильніший можливий відтінок «сповна» зазначено в примітці, щоб не усунути лексичну неоднозначність.
translation_notes:
  register: Сучасна літературна українська з урочистим, але доступним звучанням. Ужито «щоразу, коли» для повторюваної ситуації, «не будьте» як природну настанову та усталену формулу «Істинно кажу вам». Усі примітки позначено в основному тексті.
