  text: And which of you[a], by being anxious, can add one cubit to his stature?
translation:
  language: uk
  text: Хто з вас, турбуючись, може додати один лікоть до тривалості свого життя?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «додати один лікоть до свого зросту». Грецьке слово ἡλικία може означати або вік чи тривалість життя, або зріст.'
    reason: alternative_reading
lexical_decisions:
- source_word: τίς δὲ ἐξ ὑμῶν
  choice: І хто з вас
  rationale: τίς з ἐξ ὑμῶν природно передається як «хто з вас», а слабко сполучне δέ — як «і», що зберігає зв’язок із попередньою думкою без надмірного протиставлення.
- source_word: μεριμνῶν
  choice: тривожачись
  rationale: Дієприкметник від μεριμνάω означає перебування в тривозі або занепокоєнні; форма «тривожачись» стисло й природно передає супровідну обставину або засіб.
- source_word: δύναται προσθεῖναι
  choice: може додати
  rationale: Передає значення спроможності в δύναται та конкретний образ додавання в προσθεῖναι.
- source_word: ἐπὶ τὴν ἡλικίαν αὐτοῦ
  choice: до тривалості свого життя
  rationale: ἡλικία може означати вік/тривалість життя або зріст. У контексті тривоги про життя основний текст передає значення тривалості життя, а реальну лексичну неоднозначність збережено в примітці.
- source_word: πῆχυν ἕνα
  choice: один лікоть
  rationale: Лікоть — буквальна давня міра довжини; її збережено, щоб не усувати навмисно конкретний і дещо парадоксальний образ вимірювання життя довжиною.
- source_word: αὐτοῦ
  choice: свого
  rationale: Український зворот «свого життя» природно співвідносить присвійність із підметом узагальненого запитання.
theological_decisions:
- issue: Значення ἡλικία в цьому вислові
  choice: тривалість життя
  alternative: зріст
  rationale: Значення «тривалість життя» добре узгоджується з ширшим контекстом Божої турботи про життя, однак «зріст» також лексично можливий і особливо природно поєднується з мірою «лікоть». Тому альтернативу подано в примітці, не усуваючи напруження оригіналу.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Збережено риторичне запитання, образ ліктя та неоднозначність слова ἡλικία; примітку поставлено безпосередньо після речення, якого вона стосується.
