lexical_decisions:
- source_word: περὶ ἐνδύματος
  choice: про одяг
  rationale: Іменник ἔνδυμα тут позначає одяг як загальну категорію матеріального забезпечення, а не один окремий предмет одягу.
- source_word: τί μεριμνᾶτε
  choice: чому ви тривожитеся
  rationale: У цьому контексті μεριμνάω означає внутрішню тривогу щодо життєвих потреб. «Тривожитеся» передає це виразніше, ніж нейтральне «думаєте» чи ширше «турбуєтеся».
- source_word: καταμάθετε
  choice: придивіться
  rationale: Дієслово закликає уважно спостерігати й осмислювати побачене. «Придивіться» природно поєднує спостереження з уважністю без зайвого пояснення в основному тексті.
- source_word: τὰ κρίνα τοῦ ἀγροῦ
  choice: польові лілії
  rationale: κρίνα найпряміше означає «лілії», а τοῦ ἀγροῦ указує на рослини, що ростуть у полі. Природний український відповідник — «польові лілії»; ширше розуміння як польових квітів зазначено у примітці.
- source_word: πῶς αὐξάνουσιν
  choice: як вони ростуть
  rationale: У контексті рослин αὐξάνω має звичайне значення природного росту.
- source_word: οὐ κοπιῶσιν
  choice: вони не трудяться
  rationale: κοπιάω позначає напружену працю або тяжкий труд. «Не трудяться» зберігає цей відтінок і паралелізм із наступним дієсловом.
- source_word: οὐδὲ νήθουσιν
  choice: і не прядуть
  rationale: νήθω означає прясти нитку або пряжу. В українській мові «прядуть» самодостатнє й не потребує доданого об’єкта.
theological_decisions:
- issue: Значення μεριμνάω в настанові Ісуса про матеріальне забезпечення
  choice: тривожитеся
  alternative: турбуєтеся / журитеся
  rationale: Форма «тривожитеся» передає саме неспокійну, обтяжливу заклопотаність, не перетворюючи вислів на заборону будь-якої розсудливої турботи.
- issue: Назва рослин κρίνα
  choice: лілії
  alternative: польові квіти
  rationale: Основне лексичне значення підтримує переклад «лілії», але точну ботанічну ідентифікацію текст не встановлює; можливе ширше розуміння збережено в примітці.
translation_notes:
  register: Сучасна нормативна українська мова з гідним, але не архаїчним звучанням. Речення зберігає стислий паралелізм грецького тексту; «придивіться» звучить природно як заклик до уважного спостереження.
