base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/032.yaml
  text: For the Gentiles eagerly seek all these things; for your heavenly Father knows that you need all these things.
translation:
  language: uk
  text: Адже всього цього язичники[a] наполегливо шукають[b]; бо ваш Небесний Отець знає, що ви всього цього потребуєте.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «народи» чи «погани». Грецьке слово може означати народи загалом, але тут, імовірно, йдеться про людей поза народом завіту.
    reason: alternative_reading
  - marker: b
    text: Або «шукають» чи «прагнуть». Грецьке дієслово може вказувати на цілеспрямований або наполегливий пошук.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: язичники
  rationale: У цьому контексті слово позначає неюдейські народи на противагу учням Ісуса. «Язичники» природно передає історико-релігійне розрізнення, не перетворюючи його на загальний моральний осуд.
- source_word: ἐπιζητοῦσιν
  choice: наполегливо шукають
  rationale: Префіксальне дієслово передає цілеспрямований, наполегливий пошук. Цей варіант зберігає його підсилений відтінок, не перебільшуючи міри зусиль.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: ваш Небесний Отець
  rationale: Природний і стислий український відповідник, що зберігає займенникове означення та небесну характеристику Отця.
- source_word: οἶδεν
  choice: знає
  rationale: Хоча форма οἶδα історично є перфектом, тут вона має теперішнє значення, яке точно передає «знає».
- source_word: χρῄζετε
  choice: ви ... потребуєте
  rationale: Сучасний природний відповідник зі значенням об’єктивної потреби.
- source_word: πάντα ... ταῦτα / τούτων ἁπάντων
  choice: всього цього ... всього цього
  rationale: Повтор збережено, оскільки він наявний у грецькому тексті й підсилює зв’язок між людським пошуком і знанням Отця.
- source_word: γὰρ ... γὰρ
  choice: Адже ... бо
  rationale: Обидва пояснювальні сполучники збережено, але передано різними природними українськими відповідниками, щоб уникнути стилістично важкого повтору.
theological_decisions:
- issue: Значення τὰ ἔθνη в повчанні Ісуса
  choice: «язичники» як позначення людей із неюдейських народів поза спільнотою учнів
  alternative: «народи» або «погани»
  rationale: Контекст протиставляє турботи учнів життєвим прагненням навколишніх народів. Обраний варіант зберігає історичне та завітне розрізнення, але сам собою не проголошує безумовного морального осуду всіх неюдеїв.
translation_notes:
  register: Сучасна літературна українська мова в гідному, загальнозрозумілому біблійному регістрі. Збережено повтор «всього цього» та обидва пояснювальні сполучники; уникнено архаїчних конструкцій на кшталт «маєте потребу».
