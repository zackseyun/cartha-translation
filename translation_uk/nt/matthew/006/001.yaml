id: MAT.6.1
reference: Matthew 6:1
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Προσέχετε ⸀δὲ τὴν ⸀δικαιοσύνην ὑμῶν μὴ ποιεῖν ἔμπροσθεν τῶν ἀνθρώπων πρὸς τὸ θεαθῆναι αὐτοῖς· εἰ δὲ μή γε, μισθὸν οὐκ ἔχετε παρὰ τῷ πατρὶ ὑμῶν τῷ ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/001.yaml
  text: But be careful not to practice your righteousness before people in order to be seen by them[a]; otherwise[b], you have no reward from your Father in the heavens.
translation:
  language: uk
  text: Але пильнуйте, щоб не чинити свою праведність перед людьми, щоб вони вас бачили[a]; інакше не маєте нагороди від вашого Отця, Який на небесах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «не чинити своїх праведних учинків». Деякі рукописи мають: «не чинити своєї милостині».'
    reason: Тут δικαιοσύνη може означати праведну поведінку або праведні вчинки; крім того, засвідчений текстовий варіант ἐλεημοσύνην — «милостиню».
lexical_decisions:
- source_word: Προσέχετε
  choice: пильнуйте
  rationale: Теперішній наказовий спосіб у множині закликає до постійної уважності; «пильнуйте» природно передає застереження.
- source_word: δὲ
  choice: але
  rationale: Позначає перехід із відтінком протиставлення до застереження.
- source_word: δικαιοσύνην
  choice: праведності
  rationale: Передає широке значення праведної поведінки й не звужує його до милостині; конкретніші можливості наведено у примітці.
- source_word: μὴ ποιεῖν
  choice: щоб не чинити
  rationale: Інфінітив із запереченням виражає дію, якої слід уникати; «чинити» пасує до праведної поведінки.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: перед людьми
  rationale: Йдеться загалом про людських спостерігачів, а не лише про чоловіків.
- source_word: πρὸς τὸ θεαθῆναι αὐτοῖς
  choice: задля того, щоб вони вас бачили
  rationale: Зберігає виразне значення мети та природно передає грецьку пасивну конструкцію українською.
- source_word: εἰ δὲ μή γε
  choice: інакше
  rationale: Стисло й природно передає умовне попередження про наслідок.
- source_word: μισθὸν
  choice: нагороди
  rationale: У контексті Божої відплати «нагорода» є природним і неманіпулятивним відповідником.
- source_word: παρὰ τῷ πατρὶ ὑμῶν
  choice: від вашого Отця
  rationale: У контексті отримання нагороди παρά з давальним доречно передати як джерело — «від».
- source_word: τῷ ἐν τοῖς οὐρανοῖς
  choice: Який на небесах
  rationale: Зберігає множину грецького τοῖς οὐρανοῖς і звичне для української біблійної мови означення Отця.
theological_decisions:
- issue: Обсяг значення δικαιοσύνην
  choice: широке «праведність», тобто праведна поведінка
  alternative: «праведні вчинки» або, за текстовим варіантом, «милостиня»
  rationale: Основний текст SBLGNT має δικαιοσύνην, природне широке значення якого не слід безпідставно звужувати до милостині; альтернативи збережено в примітці.
- issue: Передача ἀνθρώπων
  choice: «людьми»
  alternative: «чоловіками»
  rationale: У цьому контексті слово означає людей загалом, незалежно від статі.
- issue: Передача множини τοῖς οὐρανοῖς
  choice: «на небесах»
  alternative: «на небі»
  rationale: Множина відтворює грецьку форму й характерний для Матвія вислів, не додаючи окремого доктринального твердження.
translation_notes:
  register: Сучасна нормативна українська мова з гідним біблійним звучанням. «Пильнуйте» зберігає силу застереження, а «чинити своєї праведності» навмисно утримує ширший і дещо напружений образ оригіналу. Займенник «Який» написано з великої літери як шанобливе, але не доктринально навантажене оформлення означення Бога.
