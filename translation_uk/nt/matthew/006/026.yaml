id: MAT.6.26
reference: Matthew 6:26
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ἐμβλέψατε εἰς τὰ πετεινὰ τοῦ οὐρανοῦ ὅτι οὐ σπείρουσιν οὐδὲ θερίζουσιν οὐδὲ συνάγουσιν εἰς ἀποθήκας, καὶ ὁ πατὴρ ὑμῶν ὁ οὐράνιος τρέφει αὐτά· οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/026.yaml
  text: Look at the birds of the sky[a], that they do not sow or reap or gather into barns, and your heavenly Father feeds them[b]. Are you not of much more value than they are?
translation:
  language: uk
  text: 'Погляньте на птахів у небі[a]: вони не сіють, не жнуть і не збирають у комори, а ваш Небесний Отець годує їх. Хіба ви не набагато цінніші за них?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «птахів неба»; традиційно також: «небесних птахів» або «птахів повітря».'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «Хіба ви не значно перевершуєте їх?» У цьому контексті йдеться про більшу цінність або значущість.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβλέψατε
  choice: Погляньте
  rationale: Аористовий наказовий спосіб закликає спрямувати увагу на птахів. «Погляньте» природно передає наказ, не додаючи надмірного відтінку тривалого розмірковування.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: птахів у небі
  rationale: πετεινά означає птахів або летючих створінь, а οὐρανός у цьому контексті — видиме небо. Вислів «у небі» звучить сучасно й не створює враження, ніби йдеться про надприродних «небесних птахів».
- source_word: ὅτι
  choice: ':'
  rationale: Двокрапка природно вводить в українській мові зміст спостереження, на яке Ісус звертає увагу. Вона зберігає можливість розуміти ὅτι як пояснювальне «що/адже», не обтяжуючи речення неприродною конструкцією.
- source_word: οὐ σπείρουσιν οὐδὲ θερίζουσιν οὐδὲ συνάγουσιν
  choice: вони не сіють, не жнуть і не збирають
  rationale: Збережено три паралельні землеробські дії та їхній образний ряд. Повторення «не» природне українською і передає грецьке заперечення.
- source_word: εἰς ἀποθήκας
  choice: у комори
  rationale: ἀποθήκαι — місця зберігання врожаю. «Комори» є зрозумілим і доречним відповідником у землеробському контексті.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: ваш Небесний Отець
  rationale: Передано і особовий зв’язок («ваш Отець»), і означення οὐράνιος. Формулювання природне для сучасної української біблійної мови.
- source_word: τρέφει
  choice: годує
  rationale: У контексті йдеться про забезпечення їжею; «годує» є прямим і природним відповідником.
- source_word: οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
  choice: Хіба ви не набагато цінніші за них?
  rationale: Риторичне питання очікує ствердної відповіді. «Набагато цінніші» передає перевагу у значущості та підсилювальну силу μᾶλλον, не пояснюючи додатково підстави цієї цінності.
theological_decisions:
- issue: Порівняльна цінність людей і птахів у міркуванні Ісуса
  choice: Текст стверджує, що слухачі значно цінніші за птахів у контексті Божої турботи, але не називає доктринальної підстави цього.
  alternative: Пояснити в перекладі більшу цінність людей образом Божим або завітними відносинами.
  rationale: У вірші є чітке порівняння цінності, проте немає прямого пояснення його богословської основи. Переклад не додає підстави, якої сам текст тут не формулює.
translation_notes:
  register: Сучасна стандартна українська мова з гідним, доступним біблійним звучанням. Землеробську образність і риторичну силу оригіналу збережено; двокрапка робить грецьку конструкцію з ὅτι природною українською.
