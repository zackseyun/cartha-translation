id: MAT.6.20
reference: Matthew 6:20
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: θησαυρίζετε δὲ ὑμῖν θησαυροὺς ἐν οὐρανῷ, ὅπου οὔτε σὴς οὔτε βρῶσις ἀφανίζει, καὶ ὅπου κλέπται οὐ διορύσσουσιν οὐδὲ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/020.yaml
  text: But store up for yourselves treasures in heaven[a], where neither moth nor decay destroys[b], and where thieves do not break in and steal.
translation:
  language: uk
  text: А збирайте собі скарби на небі, де ні міль, ні псування[a] не нищать і де злодії не вдираються[b] й не крадуть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «іржа». Грецьке слово може ширше означати поїдання, роз’їдання чи руйнівне псування.
    reason: lexical_alternative
  - marker: b
    text: Буквально «не прокопуються» — імовірно, йдеться про злодіїв, які проламували або прокопували стіни будинків.
    reason: cultural_note
lexical_decisions:
- source_word: θησαυρίζετε
  choice: збирайте
  rationale: Природно передає наказ накопичувати скарби; форма недоконаного виду узгоджується з теперішнім наказовим способом і вказує на тривалу або повторювану дію.
- source_word: δὲ
  choice: А
  rationale: Передає протиставлення попередній забороні збирати скарби на землі, не перевантажуючи українське речення.
- source_word: ὑμῖν
  choice: собі
  rationale: Стисло й природно передає давальний відмінок користі з рефлексивним відтінком — «для себе».
- source_word: θησαυροὺς
  choice: скарби
  rationale: Зберігає множину та ключову метафору уривка.
- source_word: ἐν οὐρανῷ
  choice: на небі
  rationale: Звичний сучасний український відповідник локативного вислову без зайвого тлумачення.
- source_word: σὴς
  choice: міль
  rationale: Точна назва руйнівника одягу та інших коштовних тканин, які зберігали як майно.
- source_word: βρῶσις
  choice: псування
  rationale: Передає широкий образ того, що поїдає, роз’їдає або спричиняє руйнування, не звужуючи значення лише до іржі.
- source_word: ἀφανίζει
  choice: нищать
  rationale: Ясно передає доведення до зникнення або загибелі; множина присудка природно узгоджується з двома однорідними підметами.
- source_word: κλέπται
  choice: злодії
  rationale: Прямий і загальнозрозумілий відповідник.
- source_word: διορύσσουσιν
  choice: вдираються
  rationale: Природно передає мету дії злодіїв сучасною українською; буквальний образ прокопування крізь стіну пояснено в примітці.
- source_word: κλέπτουσιν
  choice: крадуть
  rationale: Прямий і природний відповідник дієслова.
theological_decisions:
- issue: Природа «скарбів на небі»
  choice: Збережено метафору «скарби на небі» без пояснювального розгортання.
  alternative: «небесна нагорода» або «духовні багатства»
  rationale: Оригінал не визначає тут точного змісту скарбів; збереження образу не нав’язує конкретного вчення про заслуги чи систему нагород.
- issue: Обсяг значення βρῶσις
  choice: Широке «псування».
  alternative: «іржа», «корозія» або буквальне «поїдання»
  rationale: Таке формулювання зберігає невизначеність щодо конкретного руйнівного чинника й головне протиставлення між минущими земними та нетлінними небесними скарбами.
translation_notes:
  register: Сучасна літературна українська з гідним, загальнозрозумілим звучанням. Синтаксис стислий і близький до грецького, але природний українською; метафору не витлумачено понад текст.
