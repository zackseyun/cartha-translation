  text: ὅπου γάρ ἐστιν ὁ θησαυρός ⸀σου, ἐκεῖ ἔσται καὶ ἡ καρδία ⸁σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/021.yaml
  text: For where your treasure is[a], there your heart will be also.
translation:
  language: uk
  text: Бо де твій скарб, там буде й твоє серце.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або, передаючи вислів як позачасовий принцип: «Бо де твій скарб, там і твоє серце». Проте грецьке дієслово стоїть у майбутньому часі — «буде».'
    reason: Альтернативна передача часового значення вислову.
lexical_decisions:
- source_word: ὅπου
  choice: де
  rationale: Природно вводить підрядну частину місця й точно передає співвідношення «де… там».
- source_word: γάρ
  choice: бо
  rationale: Зберігає пояснювальний зв’язок із попередньою настановою про збирання скарбів.
- source_word: θησαυρός
  choice: скарб
  rationale: Звичний і точний відповідник, який зберігає як буквальний, так і переносний зміст слова в контексті.
- source_word: σου
  choice: твій / твоє
  rationale: Передає присвійне значення займенника при словах «скарб» і «серце» з належним узгодженням в українській.
- source_word: ἐκεῖ
  choice: там
  rationale: Відповідає слову ὅπου й зберігає стислий паралелізм «де… там».
- source_word: ἔσται
  choice: буде
  rationale: Безпосередньо передає майбутній час грецького дієслова, не згладжуючи його до позачасового теперішнього.
- source_word: καρδία
  choice: серце
  rationale: Традиційний і семантично широкий відповідник, що охоплює бажання, прихильність і внутрішню спрямованість людини.
- source_word: καὶ
  choice: й
  rationale: Природно передає додаткове значення «також» і пов’язує місце серця з місцем скарбу.
theological_decisions:
- issue: Часове значення ἔσται у вислові, подібному до мудрого прислів’я
  choice: 'Збережено майбутній час: «буде»'
  alternative: 'Теперішній час: «є» — як вираження загального позачасового принципу'
  rationale: 'У грецькому тексті вжито форму майбутнього часу. Її збереження не лише констатує відповідність між скарбом і серцем, а й не усуває можливого відтінку спрямування: серце опиниться там, де міститься скарб.'
translation_notes:
  register: Сучасна нормативна українська мова; стислий, гідний і природний вислів. Конструкція «де… там» зберігає паралелізм оригіналу, а «й» передає καὶ без обтяження речення.
