source:
  edition: SBLGNT
  text: Ὁ λύχνος τοῦ σώματός ἐστιν ὁ ὀφθαλμός. ἐὰν οὖν ⸂ᾖ ὁ ὀφθαλμός σου ἁπλοῦς⸃, ὅλον τὸ σῶμά σου φωτεινὸν ἔσται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/022.yaml
  text: The eye is the lamp of the body. Therefore[a], if your eye is healthy, your whole body will be full of light.
translation:
  language: uk
  text: Око — світильник тіла. Отже, якщо твоє око здорове[a], усе твоє тіло буде сповнене світла.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «ясне», «просте», «єдине» чи «неподілене»; грецьке слово в певних контекстах може також виражати щедрість.'
    reason: 'Лексична альтернатива: ἁπλοῦς має ширший діапазон значень, ніж передає основний варіант «здорове».'
lexical_decisions:
- source_word: λύχνος
  choice: світильник
  rationale: Конкретний і природний український відповідник, який зберігає образ ока як джерела освітлення для тіла.
- source_word: σῶμα
  choice: тіло
  rationale: Прямий відповідник, що природно передає тілесний образ.
- source_word: ὀφθαλμός
  choice: око
  rationale: Буквальний відповідник доречний і для фізичного образу, і для його переносного значення.
- source_word: ἐὰν οὖν
  choice: Отже, якщо
  rationale: «Отже» передає висновковий зв’язок οὖν, а «якщо» — умову ἐάν.
- source_word: ἁπλοῦς
  choice: здорове
  rationale: У безпосередньому образі зору це природно позначає око, яке добре функціонує; ширшу смислову багатозначність збережено в примітці.
- source_word: ὅλον
  choice: усе
  rationale: Узгоджений із середнім родом слова «тіло» природний відповідник, що передає повноту.
- source_word: φωτεινόν
  choice: сповнене світла
  rationale: Ідіоматично передає стан освітленості всього тіла й зберігає образ світла.
- source_word: ἔσται
  choice: буде
  rationale: Збережено виразний майбутній час грецького дієслова.
theological_decisions:
- issue: Значення ἁπλοῦς у метафорі ока
  choice: 'У головному тексті: «здорове»'
  alternative: «просте», «єдине», «ясне», «неподілене»; у певних контекстах — пов’язане зі щедрістю
  rationale: Контраст із поганим оком і образ освітлення тіла підтримують значення належного функціонування зору. Водночас переклад не усуває ширшої моральної семантики слова, а зазначає її у примітці.
translation_notes:
  register: Сучасна нормативна українська мова; виклад стислий, гідний і зрозумілий. «Світильник» зберігає конкретність античного образу, а конструкція «сповнене світла» звучить природно та виразно.
