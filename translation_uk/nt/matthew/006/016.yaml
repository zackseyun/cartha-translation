source:
  edition: SBLGNT
  text: Ὅταν δὲ νηστεύητε, μὴ γίνεσθε ⸀ὡς οἱ ὑποκριταὶ σκυθρωποί, ἀφανίζουσιν γὰρ τὰ πρόσωπα αὐτῶν ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/016.yaml
  text: And whenever you fast[a], do not become gloomy like the hypocrites, for they disfigure their faces so that they may appear to people to be fasting. Truly I say to you, they have received their reward in full.
translation:
  language: uk
  text: 'А коли постите, не ставайте похмурими, як лицеміри, бо вони спотворюють свої обличчя, щоб показатися людям такими, що постять. Істинно кажу вам: вони вже сповна одержали свою нагороду.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅταν δὲ νηστεύητε
  choice: А коли постите
  rationale: Ὅταν із кон’юнктивом позначає невизначену або повторювану обставину часу. Українське «коли постите» природно охоплює щоразу повторювану практику, а «А» пов’язує настанову з попередніми паралельними повчаннями.
- source_word: μὴ γίνεσθε
  choice: не ставайте
  rationale: Передає відтінок входження в певний стан або прийняття певного вигляду, властивий γίνομαι, точніше за просте «не будьте».
- source_word: ὡς οἱ ὑποκριταὶ σκυθρωποί
  choice: похмурими, як лицеміри
  rationale: σκυθρωποί описує навмисно сумний, понурий вираз обличчя; «похмурими» є ясним і природним відповідником.
- source_word: ἀφανίζουσιν γὰρ τὰ πρόσωπα αὐτῶν
  choice: бо вони спотворюють свої обличчя
  rationale: У цьому контексті ἀφανίζω означає псувати або змінювати зовнішній вигляд, щоб він свідчив про піст. Конкретний образ «обличчя» збережено.
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες
  choice: щоб люди бачили, що вони постять
  rationale: Передає мету, виражену ὅπως, і зміст φανῶσιν без неприродної української конструкції «щоб здаватися людям такими, що постять». τοῖς ἀνθρώποις тут означає людей загалом.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Істинно кажу вам
  rationale: Зберігає урочисту формулу авторитетного запевнення та її традиційно впізнаваний біблійний характер.
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: вони вже сповна одержали свою нагороду
  rationale: ἀπέχω тут ужито як комерційний ідіом повного одержання належного. «Вже сповна одержали» передає завершеність виплати й контекстуальний натяк, що іншої нагороди не лишається.
theological_decisions:
- issue: Загальне значення τοῖς ἀνθρώποις
  choice: люди
  alternative: чоловіки
  rationale: ἄνθρωποι в цьому контексті стосується людей загалом, а не осіб чоловічої статі; «люди» точно й природно передає референт без звуження змісту.
- issue: Ідіоматичний зміст ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: вони вже сповна одержали свою нагороду
  alternative: вони мають свою нагороду
  rationale: Фраза означає повне одержання винагороди, а не просто її наявність. Розгорнутий переклад зберігає застереження тексту, не уточнюючи понад нього, від кого могла б бути інша нагорода.
translation_notes:
  register: Сучасна стандартна українська мова; виклад природний, гідний і зрозумілий. Збережено конкретність образів та урочистість вислову Ісуса без архаїзації. Виноски не потрібні.
