  source_fidelity: 'Текст точно передає всі основні елементи грецького оригіналу: δέ як м’який перехід («Та»), підсилене заперечення οὐδέ («навіть … не»), ім’я Соломон, вислів «у всій своїй славі», дієслово одягання та однину в порівнянні «одна з них». «Не вдягався» є природним українським способом передати тут середню форму περιεβάλετο без невластивої пасивності.'
