id: MAT.6.29
reference: Matthew 6:29
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι οὐδὲ Σολομὼν ἐν πάσῃ τῇ δόξῃ αὐτοῦ περιεβάλετο ὡς ἓν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/029.yaml
  text: But I tell you that not even Solomon in all his glory was clothed like one of these[a].
translation:
  language: uk
  text: 'Та кажу вам: навіть Соломон у всій своїй славі[a] не вдягався так, як одна з них.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «у всій своїй пишноті».'
    reason: Лексична альтернатива для δόξα, що виразніше передає царську розкіш у цьому контексті.
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Та кажу вам
  rationale: Дієслово λέγω з давальним ὑμῖν природно передається як «кажу вам», а δέ тут позначає м’яке протиставлення попередньому твердженню.
- source_word: οὐδὲ
  choice: навіть … не
  rationale: 'Така конструкція природно українською передає підсилене заперечення: порівняння не витримує навіть Соломон.'
- source_word: Σολομὼν
  choice: Соломон
  rationale: Ужито усталену українську форму біблійного особового імені.
- source_word: ἐν πάσῃ τῇ δόξῃ αὐτοῦ
  choice: у всій своїй славі
  rationale: У цьому контексті δόξα означає царську велич і розкіш; «слава» зберігає біблійний відтінок, не виключаючи значення зовнішньої пишноти.
- source_word: περιεβάλετο
  choice: не вдягався
  rationale: Середня форма περιβάλλω у цьому контексті природно означає «вдягатися»; активна українська конструкція звучить сучасно й точно передає порівняння із зовнішнім виглядом квітів.
- source_word: ὡς ἓν τούτων
  choice: так, як одна з них
  rationale: Зворот зберігає порівняння та однину ἓν; займенник жіночого роду природно відсилає до квітів, згаданих у найближчому контексті.
theological_decisions:
- issue: Значення δόξα стосовно Соломона
  choice: «слава» у значенні царської величі й розкоші
  alternative: «пишнота»
  rationale: Контекст протиставляє царську розкіш Соломона тому, як Бог наділяє красою польові квіти. Переклад «слава» лексично обґрунтований і зберігає біблійне звучання, але не надає слову значення божественної слави.
translation_notes:
  register: Сучасна, природна й гідна українська мова. Конструкція «навіть … не» передає грецьке підсилене заперечення, а «вдягався» уникає неприродної пасивної форми.
