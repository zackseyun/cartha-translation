lexical_decisions:
- source_word: ὅπως
  choice: щоб
  rationale: Природно вводить мету й зберігає цільове значення грецького сполучника.
- source_word: μὴ φανῇς τοῖς ἀνθρώποις νηστεύων
  choice: щоб не було видно людям, що ти постиш
  rationale: Безособова конструкція природна сучасною українською і передає значення «не стати явним перед людьми як той, хто постить», не звужуючи ἀνθρώποις до осіб чоловічої статі.
- source_word: ἀλλὰ τῷ πατρί σου
  choice: а лише твоєму Отцеві
  rationale: Передає різкий контраст μὴ…ἀλλά між людськими спостерігачами та Отцем. «Лише» робить український еліпсис зрозумілим, не змінюючи спрямування протиставлення.
- source_word: τῷ ἐν τῷ κρυφαίῳ
  choice: Який у таємному
  rationale: Стисле формулювання зберігає образ прихованої сфери й не уточнює без потреби, чи йдеться про місце, стан невидимості або приватність.
- source_word: ὁ βλέπων ἐν τῷ κρυφαίῳ
  choice: Який бачить у таємному
  rationale: Близько відтворює грецький текст, не додаючи прямого додатка на кшталт «усе, що робиться».
- source_word: ἀποδώσει σοι
  choice: винагородить тебе
  rationale: У контексті побожної практики дієслово означає належну відплату; «винагородить» є ясним і природним українським відповідником.
theological_decisions:
- issue: Загальне значення τοῖς ἀνθρώποις
  choice: людям
  alternative: чоловікам
  rationale: У цьому контексті йдеться про людських спостерігачів загалом, а не лише про осіб чоловічої статі.
- issue: Значення ἐν τῷ κρυφαίῳ в обох випадках
  choice: у таємному
  alternative: у потаємному місці; таємно
  rationale: Однаковий переклад зберігає словесний повтор і богословську напругу між прихованістю Отця та Його баченням, не звужуючи вислів до конкретної кімнати чи лише способу дії.
- issue: Характер Божої відповіді в ἀποδώσει
  choice: винагородить
  alternative: віддасть; відплатить
  rationale: Контекст підтримує значення винагороди, однак переклад не уточнює її форми, часу чи характеру.
translation_notes:
  register: Сучасна, зрозуміла й водночас гідна українська мова. Звертання «Отець» зберігає біблійний родинний образ; повтор «у таємному» навмисно відтворює повтор оригіналу. Маркер [a] поставлено безпосередньо після відповідного вислову.
