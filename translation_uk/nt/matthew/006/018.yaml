  source_fidelity: 'Зміст передано загалом точно: мета посту — не бути поміченим людьми, а бути спрямованим до Отця; збережено повтор ἐν τῷ κρυφαίῳ та обітницю винагороди. Проте «щоб не було видно людям» є дещо безособовим, а еліптичне «а лише твоєму Отцеві» в українській неясно виражає, що саме Отець бачить піст.'
