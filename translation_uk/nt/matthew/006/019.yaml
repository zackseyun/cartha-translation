    rationale: The phrase «міль і нищення руйнують» is unnatural and redundant in Ukrainian. βρῶσις can be represented broadly by «псування», while ἀφανίζει is naturally rendered «нищать».
  - severity: low
    issue: Explicit «стіни» in «проламують стіни»
    rationale: διορύσσουσιν means dig/break through, but the Greek does not name walls. The likely mud-brick-wall setting should remain an explanatory footnote, preserving the source text's degree of explicitness.
