source:
  edition: SBLGNT
  text: Μὴ θησαυρίζετε ὑμῖν θησαυροὺς ἐπὶ τῆς γῆς, ὅπου σὴς καὶ βρῶσις ἀφανίζει, καὶ ὅπου κλέπται διορύσσουσιν καὶ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/019.yaml
  text: Do not store up for yourselves treasures on earth[a], where moth and decay destroy[b], and where thieves break in and steal.
translation:
  language: uk
  text: Не збирайте собі скарбів на землі, де міль і псування[a] нищать, і де злодії підкопуються[b] та крадуть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «іржа» чи «тління». Грецьке слово буквально пов’язане з поїданням і може позначати різні види руйнівного псування, а не лише корозію металу.
    reason: lexical_alternative
  - marker: b
    text: Буквально «прокопують» або «проламують»; імовірно, йдеться про злодіїв, які проникали крізь стіни будинків, зроблені з глини чи сирцевої цегли.
    reason: cultural_note
lexical_decisions:
- source_word: Μὴ θησαυρίζετε
  choice: Не збирайте
  rationale: Теперішній наказовий спосіб із μή виражає заборону; «не збирайте» природно передає накопичення й зберігає словотвірний зв’язок зі «скарбами».
- source_word: ὑμῖν
  choice: собі
  rationale: 'Давальний займенник має тут зворотне значення: йдеться про накопичення для власного володіння чи користі.'
- source_word: θησαυροὺς
  choice: скарбів
  rationale: Звичайний український відповідник, що охоплює не лише гроші, а й інші цінні земні надбання.
- source_word: ἐπὶ τῆς γῆς
  choice: на землі
  rationale: Природний український вислів, який зберігає просторове протиставлення небові в наступному вірші.
- source_word: σὴς
  choice: міль
  rationale: Прямий відповідник; мається на увазі псування одягу та інших збережених речей міллю.
- source_word: βρῶσις
  choice: нищення
  rationale: Слово буквально пов’язане з поїданням і може означати ширше руйнівне псування, не лише іржу; «нищення» не звужує образ до корозії металу.
- source_word: ἀφανίζει
  choice: руйнують
  rationale: Дієслово означає доводити до зникнення, нищити або робити непридатним; форма множини природно узгоджується в українській із двома підметами.
- source_word: κλέπται
  choice: злодії
  rationale: Прямий і загальнозрозумілий відповідник.
- source_word: διορύσσουσιν
  choice: проламують стіни
  rationale: Дієслово буквально означає «прокопують, проламують»; додане «стіни» природно увиразнює історичний образ проникнення крізь стіну будинку.
- source_word: κλέπτουσιν
  choice: крадуть
  rationale: Стандартний український відповідник дієслова крадіжки.
theological_decisions:
- issue: Земна сфера в ἐπὶ τῆς γῆς
  choice: на землі
  alternative: на цій землі
  rationale: Варіант зберігає контраст із небом у безпосередньому контексті, не додаючи окремого богословського розмежування.
- issue: Значення βρῶσις
  choice: нищення
  alternative: іржа; тління; псування
  rationale: Грецьке слово ширше за окиснення металу й буквально пов’язане з поїданням або споживанням. «Нищення» зберігає широту образу, а традиційний варіант зазначено у примітці.
translation_notes:
  register: Сучасна, ясна й гідна українська мова. Синтаксичний паралелізм двох речень із «де» збережено. «Проламують стіни» конкретніше за загальне «вдираються» і передає культурний образ оригіналу без архаїчності.
