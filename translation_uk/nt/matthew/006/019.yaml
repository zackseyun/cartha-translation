  source_fidelity: 'The main sense is well retained: the prohibition, reflexive dative, earthly location, vulnerability to moth and consuming deterioration, and theft are all present. However, «проламують стіни» incorporates a specific object not expressed in the Greek text. Though historically plausible, it belongs in the note rather than the translation itself. «Підкопуються» conveys διορύσσουσιν in its burglary context without making the walls explicit.'
  naturalness: «Нищення» is awkward as a coordinated agent in «міль і нищення руйнують» and makes the wording semantically repetitive. «Псування» with «нищать» is more idiomatic modern Ukrainian and adequately preserves the broad, consuming-deterioration sense of βρῶσις.
  terminology: «Скарби», «міль», and «злодії» are appropriate. «Псування» is preferable here to the overly abstract «нищення»; the note appropriately preserves «іржа» as a traditional narrower alternative. The cultural clarification concerning mud-brick walls is useful when confined to the footnote.
