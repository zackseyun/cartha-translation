id: MAT.6.24
reference: Matthew 6:24
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Οὐδεὶς δύναται δυσὶ κυρίοις δουλεύειν· ἢ γὰρ τὸν ἕνα μισήσει καὶ τὸν ἕτερον ἀγαπήσει, ἢ ἑνὸς ἀνθέξεται καὶ τοῦ ἑτέρου καταφρονήσει. οὐ δύνασθε θεῷ δουλεύειν καὶ μαμωνᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/024.yaml
  text: No one is able to serve two masters[a], for either he will hate the one and love the other, or he will be devoted to one and despise the other. You are not able to serve God and mammon.
translation:
  language: uk
  text: Ніхто не може служити двом панам, бо або одного ненавидітиме, а другого любитиме, або одного триматиметься, а іншого зневажатиме. Не можете служити Богові й мамоні[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «багатству» чи «грошам». У грецькому тексті вжито запозичене слово «мамона»; у цьому контексті воно постає як суперницький пан.'
    reason: Лексична альтернатива та пояснення образного вживання запозиченого слова.
lexical_decisions:
- source_word: Οὐδεὶς
  choice: Ніхто
  rationale: Природний український відповідник універсального заперечного займенника.
- source_word: δύναται / δύνασθε
  choice: не може / не можете
  rationale: Передає нездатність поєднати служіння двом суперницьким панам і зберігає повтор дієслова вірша.
- source_word: δυσὶ κυρίοις
  choice: двом панам
  rationale: У контексті служіння κύριος означає пана, якому служать; «панам» природно передає соціальну метафору й не змішує її з божественним титулом.
- source_word: δουλεύειν
  choice: служити
  rationale: Природний відповідник у вислові про двох панів; залежне становище слуги додатково виражене словом «панам».
- source_word: μισήσει
  choice: ненавидітиме
  rationale: Зберігає сильний прямий зміст дієслова та його антитезу до любові, не послаблюючи вислів до «любитиме менше».
- source_word: ἀγαπήσει
  choice: любитиме
  rationale: Прямий і природний відповідник, що зберігає протиставлення ненависті.
- source_word: ἑνὸς ἀνθέξεται
  choice: одного триматиметься
  rationale: Передає образ міцної прихильності до одного з панів, не звужуючи його лише до емоційної відданості.
- source_word: καταφρονήσει
  choice: нехтуватиме
  rationale: Виражає зневажливе ставлення й відкидання іншого; природно звучить у сучасній українській.
- source_word: θεῷ
  choice: Богові
  rationale: Стандартна форма давального відмінка після «служити».
- source_word: μαμωνᾷ
  choice: мамоні
  rationale: Збережено запозичене слово, щоб не втратити риторичне представлення багатства як суперницького пана; значення пояснено у примітці.
theological_decisions:
- issue: Передача κύριος у небожественному соціальному контексті
  choice: панам
  alternative: господарям; владикам
  rationale: Множина разом із δουλεύειν описує стосунки служіння. «Панам» точно й природно передає цей образ, не створюючи враження, ніби йдеться про два божественні титули.
- issue: Передача μαμωνᾶς
  choice: мамоні
  alternative: багатству; грошам
  rationale: Збереження запозичення підтримує навмисне протиставлення Бога й мамони як двох суперницьких панів. Пояснювальні відповідники подано в примітці.
- issue: Сила дієслова μισέω
  choice: ненавидітиме
  alternative: любитиме менше
  rationale: Текст утворює виразну антитезу «ненавидіти — любити»; можливий порівняльний відтінок не слід без потреби підставляти замість прямого значення.
translation_notes:
  register: Сучасна нормативна українська з гідним, афористичним звучанням. Збережено паралельну будову двох протиставлень і прямоту завершального висновку.
