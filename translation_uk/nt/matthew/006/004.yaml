lexical_decisions:
- source_word: ὅπως ᾖ
  choice: щоб … було / щоб ти … потай
  rationale: Сполука виражає мету й пов’язує цей вислів із попередньою настановою. В українському реченні підрядна конструкція з «щоб» природно передає цільовий відтінок грецького кон’юнктива.
- source_word: ἐλεημοσύνη
  choice: давав бідним
  rationale: Іменник означає саме милостиню, тобто матеріальну допомогу нужденним, а не милосердя загалом. Дієслівний вислів зрозуміліший у сучасній українській і не звужує значення до подавання жебракам.
- source_word: ἐν τῷ κρυπτῷ
  choice: потай / приховане
  rationale: Грецький вислів позначає те, що приховане від людських очей. У першій частині «потай» природно описує спосіб давання, а в другій «бачить приховане» ясно передає Божу здатність бачити невидиме для інших.
- source_word: ὁ πατήρ σου
  choice: твій Отець
  rationale: Переклад не додає означення «Небесний», якого в грецькому тексті цього вірша немає. Велика літера відповідає усталеному українському вживанню щодо Бога.
- source_word: ὁ βλέπων
  choice: який бачить
  rationale: Субстантивований дієприкметник природно передано підрядним означальним реченням без додаткового тлумачення.
- source_word: ἀποδώσει σοι
  choice: винагородить тебе
  rationale: У цьому контексті дієслово позначає прихильну Божу відплату за приховану праведну дію. «Винагородить» є природним українським відповідником, тоді як формальніше «віддасть тобі» наведено у примітці.
theological_decisions:
- issue: Характер Божої відплати в ἀποδώσει
  choice: винагородить тебе
  alternative: віддасть тобі; відплатить тобі
  rationale: Переклад зберігає обіцянку позитивної Божої відповіді, але не визначає, чи буде винагорода земною або вічною, матеріальною або духовною.
translation_notes:
  register: Сучасна, проста й гідна українська. Дієслівна конструкція «давав бідним» усуває можливу вузьку асоціацію слова «милостиня» лише з подаванням жебракам. Ритм двох речень зберігає виразний перехід від людської прихованості до Божого бачення.
