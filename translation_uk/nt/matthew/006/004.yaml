  naturalness: '«Щоб твоя милостиня була потай» неприродне українською; нормативно й ясно: «щоб твоя милостиня була таємною» або «щоб ти подавав бідним потай». Для точного відтворення грецького іменника та повтору найкраще «щоб твоя милостиня була таємною». «Який бачить у таємниці» зрозуміле, але дещо буквальне; «який бачить усе таємне» було б інтерпретацією. Вислів «бачить у таємниці» прийнятний у біблійному, гідному регістрі та зберігає двозначність оригіналу.'
