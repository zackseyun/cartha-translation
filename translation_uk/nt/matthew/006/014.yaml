  text: ἐὰν γὰρ ἀφῆτε τοῖς ἀνθρώποις τὰ παραπτώματα αὐτῶν, ἀφήσει καὶ ὑμῖν ὁ πατὴρ ὑμῶν ὁ οὐράνιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/014.yaml
  text: For if you forgive people their trespasses[b][a], your heavenly Father will also forgive you.
translation:
  language: uk
  text: Бо якщо ви простите людям їхні провини[a], то й ваш Небесний Отець простить вам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «переступи», «проступки» чи «образи». Грецьке слово означає моральні провини або хибні кроки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: Бо якщо
  rationale: γάρ пояснює зв’язок із попередньою молитвою, а ἐάν з аористом кон’юнктива вводить реальну умовну конструкцію; «Бо якщо» природно передає обидві функції.
- source_word: ἀφῆτε … ἀφήσει
  choice: простите … простить
  rationale: В обох випадках ἀφίημι в контексті моральної провини означає «прощати». Однаковий український корінь зберігає навмисний словесний паралелізм грецького тексту.
- source_word: τοῖς ἀνθρώποις
  choice: людям
  rationale: ἄνθρωποι позначає людей загалом, а не лише чоловіків; «людям» є точним і природним відповідником.
- source_word: τὰ παραπτώματα αὐτῶν
  choice: їхні провини
  rationale: παράπτωμα означає моральний проступок, переступ або хибний крок. «Провини» природно передає морально-особистісний зміст, не звужуючи його до юридичного терміна.
- source_word: καὶ ὑμῖν
  choice: то й … вам
  rationale: Частка «й» передає відповідність, виражену καί, а «то» природно оформлює наслідок української умовної конструкції. Давальний ὑμῖν передано як «вам».
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: ваш Небесний Отець
  rationale: Природний український відповідник атрибутивної конструкції «ваш Отець, небесний». «Отець» зберігає біблійний і шанобливий регістр, а прикметник «Небесний» точно відтворює οὐράνιος.
theological_decisions:
- issue: Умовний зв’язок між прощенням людей і Божим прощенням
  choice: 'Передати вислів прямо як справжню умову: «якщо … то й».'
  alternative: Тлумачити людське прощення або як заслугу, що здобуває Боже прощення, або лише як доказ уже одержаного прощення.
  rationale: Грецький текст формулює безпосередню умову, але не пояснює її в термінах заслуги чи доказу. Переклад зберігає цю богословську напругу й не додає конфесійного тлумачення.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. «Отець» ужито як усталене біблійне звертання; умовну побудову передано природною парою «якщо … то й». Маркер примітки поставлено безпосередньо після слова, якого вона стосується.
