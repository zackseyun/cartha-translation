source:
  edition: SBLGNT
  text: Διὰ τοῦτο λέγω ὑμῖν· μὴ μεριμνᾶτε τῇ ψυχῇ ὑμῶν τί ⸀φάγητε, μηδὲ τῷ σώματι ὑμῶν τί ἐνδύσησθε· οὐχὶ ἡ ψυχὴ πλεῖόν ἐστι τῆς τροφῆς καὶ τὸ σῶμα τοῦ ἐνδύματος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/025.yaml
  text: Therefore I tell you[a], do not worry about your life, what you will eat, or about your body, what you will wear. Is not life more than food, and the body than clothing?
translation:
  language: uk
  text: 'Тому кажу вам: не тривожтеся про своє життя[a] — що вам їсти, ані про своє тіло — у що вдягнутися. Хіба життя не більше за їжу, а тіло — за одяг?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «душу»; грецьке ψυχή може мати обидва значення, але контекст їжі й одягу тут указує на життя.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Тому
  rationale: Природно й стисло передає висновок із попереднього повчання, зберігаючи логічний зв’язок.
- source_word: μεριμνᾶτε
  choice: не тривожтеся
  rationale: Передає заборону тривожної заклопотаності; сучасне й зрозуміле українське формулювання без заперечення звичайної турботи.
- source_word: ψυχῇ
  choice: життя
  rationale: У контексті їжі й тілесних потреб ψυχή означає життя людини, а не виразно нематеріальну душу.
- source_word: τί φάγητε
  choice: що вам їсти
  rationale: Природно передає непряме питання про майбутню потребу, не переобтяжуючи український текст допоміжними словами.
- source_word: σώματι
  choice: тіло
  rationale: Прямий відповідник назви фізичного тіла, яке зіставляється з одягом.
- source_word: τί ἐνδύσησθε
  choice: у що вдягнутися
  rationale: Ідіоматично передає дію одягання та зберігає форму непрямого питання.
- source_word: οὐχὶ
  choice: Хіба ... не
  rationale: Українська конструкція виразно позначає риторичне питання, що передбачає ствердну відповідь.
- source_word: πλεῖόν
  choice: більше за
  rationale: Зберігає широке порівняння значущості без додавання конкретнішого поняття вартості.
- source_word: τροφῆς
  choice: їжу
  rationale: Звичайний і точний відповідник у контексті підтримання життя.
- source_word: ἐνδύματος
  choice: одяг
  rationale: Загальна сучасна назва того, що носять; природно утворює паралель з їжею.
theological_decisions:
- issue: Значення ψυχή в повчанні Ісуса
  choice: Передано як «життя»
  alternative: «душа»
  rationale: Безпосередній контекст говорить про їжу, тіло й одяг, тому тут ψυχή найімовірніше позначає земне життя людини. Примітка зберігає ширший лексичний діапазон слова й не нав’язує антропологічної схеми.
translation_notes:
  register: Сучасна стандартна українська мова; гідний, доступний усний стиль повчання. Паралельні частини речення відокремлено тире для ясності, а риторичне питання передано природною конструкцією «Хіба ... не».
