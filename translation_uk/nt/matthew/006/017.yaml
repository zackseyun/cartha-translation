id: MAT.6.17
reference: Matthew 6:17
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: σὺ δὲ νηστεύων ἄλειψαί σου τὴν κεφαλὴν καὶ τὸ πρόσωπόν σου νίψαι,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/017.yaml
  text: But you[a], when you fast, anoint your head and wash your face[b],
translation:
  language: uk
  text: А ти, коли постиш, намасти собі голову олією[a] та вмий обличчя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «нанеси олію на голову». Грецьке дієслово може означати нанесення олії як частину звичайного догляду за собою.
    reason: lexical_alternative
  - marker: b
    text: Тобто зберігай звичайний вигляд, а не роби свій піст помітним для інших.
    reason: cultural_note
lexical_decisions:
- source_word: σὺ δὲ
  choice: А ти
  rationale: Наголошений займенник із δέ протиставляє учня лицемірам із попереднього контексту; «А ти» природно зберігає цей контраст.
- source_word: νηστεύων
  choice: коли постиш
  rationale: Дієприкметник ужито обставинно; часове підрядне речення є природним відповідником у сучасній українській.
- source_word: ἄλειψαί σου τὴν κεφαλήν
  choice: намасти собі голову олією
  rationale: Дієслово ἀλείφω означає нанесення олії; у цьому контексті йдеться про звичайний догляд за собою. Додавання слова «олією» робить природною українську конструкцію, не змінюючи змісту грецького дієслова.
- source_word: καὶ
  choice: та
  rationale: Природно поєднує дві однорідні наказові дії.
- source_word: τὸ πρόσωπόν σου νίψαι
  choice: вмий обличчя
  rationale: νίπτω зазвичай означає мити частину тіла; «вмий обличчя» — точний і природний український вислів.
theological_decisions:
- issue: Характер настанови щодо зовнішнього вигляду під час посту
  choice: Ісус велить під час посту зберігати звичайний доглянутий вигляд, а не виставляти піст напоказ.
  alternative: Тут ідеться про ритуальне помазання або про заборону постити прилюдно як таку.
  rationale: Найближчий контекст протиставляє цю настанову навмисно змарнілому вигляду лицемірів. Сам вірш не забороняє посту й не вимагає розуміти помазання як обряд.
translation_notes:
  register: Сучасна літературна українська мова; пряме звертання та наказові форми зберігають виразність оригіналу. Формулювання dignified, але зрозуміле пересічному читачеві.
