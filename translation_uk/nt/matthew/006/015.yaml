base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/015.yaml
  text: But if you do not forgive people[a], neither will your Father forgive your trespasses.
translation:
  language: uk
  text: Але якщо ви не простите людям, то й ваш Отець не простить ваших провин.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «проступків» чи «переступів».'
    reason: Лексичні альтернативи для παραπτώματα, семантичний діапазон якого охоплює провини, переступи й проступки.
lexical_decisions:
- source_word: ἐὰν δὲ μὴ
  choice: Але якщо… не
  rationale: ἐὰν вводить умову, δέ протиставляє її попередньому твердженню, а μή заперечує дію; українське «Але якщо… не» природно передає цю будову.
- source_word: ἀφῆτε
  choice: прощатимете
  rationale: У контексті людських провин ἀφίημι означає «прощати». Недоконаний вид у конструкції «якщо ви не прощатимете» природно виражає умовну настанову, не звужуючи її до одного випадку.
- source_word: τοῖς ἀνθρώποις
  choice: людям
  rationale: ἄνθρωποι позначає людей загалом, без обмеження за статтю; «людям» прямо й природно відтворює грецький іменник.
- source_word: οὐδὲ
  choice: то й… не
  rationale: Сполука «то й… не» передає негативну відповідність οὐδέ між умовою та її наслідком і зберігає паралелізм вислову.
- source_word: ὁ πατὴρ ὑμῶν
  choice: ваш Отець
  rationale: Грецький текст має лише «ваш Отець», без означення «небесний»; слово «Отець» зберігає гідний біблійний регістр.
- source_word: ἀφήσει
  choice: простить
  rationale: Повтор дієслова «прощати» відтворює повтор ἀφίημι та взаємну структуру вислову.
- source_word: τὰ παραπτώματα ὑμῶν
  choice: ваших провин
  rationale: παράπτωμα означає моральну провину, проступок або переступ. «Провини» є зрозумілим сучасним відповідником, який зберігає моральну вагу слова без надмірного уточнення.
theological_decisions:
- issue: Умовний зв’язок між людським і Божим прощенням
  choice: 'Збережено пряме умовне формулювання: якщо люди не прощають, Отець також не простить їхніх провин.'
  alternative: Перетлумачити умову лише як ознаку вже отриманого прощення або як втрату спілкування, а не самого прощення.
  rationale: Грецький текст прямо формулює умову та наслідок. Переклад не має пом’якшувати цю богословську напругу чи вирішувати її через пояснювальний парафраз.
translation_notes:
  register: Сучасна нормативна українська мова з гідним біблійним звучанням. Порядок «ваш Отець» природний для сучасного читача; умовно-наслідкова конструкція «якщо… то й…» виразно передає грецький паралелізм.
