source:
  edition: SBLGNT
  text: εἰ δὲ τὸν χόρτον τοῦ ἀγροῦ σήμερον ὄντα καὶ αὔριον εἰς κλίβανον βαλλόμενον ὁ θεὸς οὕτως ἀμφιέννυσιν, οὐ πολλῷ μᾶλλον ὑμᾶς, ὀλιγόπιστοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/030.yaml
  text: But if God so clothes the grass of the field[a], which is here today and tomorrow is thrown into an oven, will he not much more clothe you[b], you of little faith?
translation:
  language: uk
  text: А якщо Бог так одягає польову траву, яка сьогодні є, а завтра її кидають у піч[a], то хіба не набагато більше одягне вас, маловіри[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Йдеться про піч для випікання; висушену траву та інші польові рослини могли використовувати як паливо.
    reason: cultural_note
  - marker: b
    text: 'Або: «ви, що маєте мало віри». Грецьке ὀλιγόπιστοι — пряме звертання з докором за недостатню віру чи довіру.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χόρτον τοῦ ἀγροῦ
  choice: польову траву
  rationale: χόρτος означає траву або польову рослинність. «Польова трава» природно передає образ недовговічної дикої рослинності, не звужуючи його лише до квітів.
- source_word: σήμερον ὄντα
  choice: яка сьогодні є
  rationale: Дієприкметник ὄντα буквально виражає буття або наявність; ця конструкція стисло й природно зберігає наголос на теперішньому, але нетривкому існуванні трави.
- source_word: αὔριον εἰς κλίβανον βαλλόμενον
  choice: а завтра її кидають у піч
  rationale: κλίβανος — піч, зокрема для випікання, а не металургійна піч. Неозначено-особова форма «її кидають» природно передає пасивний дієприкметник βαλλόμενον.
- source_word: οὕτως ἀμφιέννυσιν
  choice: так одягає
  rationale: ἀμφιέννυμι означає «одягати». Буквальну метафору збережено, оскільки вона пов’язує цей вірш із образом убрання польових рослин у попередньому контексті.
- source_word: οὐ πολλῷ μᾶλλον
  choice: то хіба не набагато більше
  rationale: Формулювання з «хіба не» передає очікувану ствердну відповідь на риторичне запитання, а «набагато більше» зберігає силу аргументу від меншого до більшого.
- source_word: ὀλιγόπιστοι
  choice: маловіри
  rationale: Прикметник ужито як кличне звертання у множині й він докірливо вказує на недостатню віру або довіру. «Маловіри» стисло зберігає пряме звертання та його силу.
- source_word: εἰ δὲ
  choice: А якщо
  rationale: δέ позначає м’який перехід у розвитку аргументу; «А якщо» природно вводить українською умовну підставу риторичного запитання.
theological_decisions:
- issue: Аргумент про Божу турботу від меншого до більшого
  choice: 'Збережено риторичне запитання: якщо Бог одягає нетривку польову траву, то тим більше одягне учнів.'
  alternative: Перетворити запитання на пряме твердження про Боже забезпечення.
  rationale: Грецька заперечна питальна конструкція οὐ πολλῷ μᾶλλον очікує ствердної відповіді, а завершальне звертання ὀλιγόπιστοι посилює докір. Питальну форму збережено без додавання ширших доктринальних висновків.
translation_notes:
  register: 'Сучасна, зрозуміла й гідна українська мова. Збережено розгорнуту метафору одягання та пряму докірливу форму звертання. Маркери приміток розміщено біля відповідних понять: печі та слова «маловіри».'
