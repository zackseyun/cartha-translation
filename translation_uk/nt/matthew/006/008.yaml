  source_fidelity: Текст точно передає логічний висновок οὖν («Тож»), заборону, зіставлення з попередньо згаданими людьми, теперішнє значення οἶδεν, а також часову попередність πρὸ τοῦ. «Ваш Отець» не додає прикметника «небесний», якого в грецькому тексті немає. «Чого ви потребуєте» й «попросите в нього» адекватно відтворюють зміст конструкцій ὧν χρείαν ἔχετε та αἰτῆσαι αὐτόν.
