  terminology: «Отець» доречно зберігає біблійний регістр і не нав’язує конфесійної інтерпретації. Примітка коректно вказує на пасивну форму ὁμοιωθῆτε та подає придатні українські альтернативи, не перетворюючи граматичний відтінок на догматичний висновок.
