id: MAT.6.8
reference: Matthew 6:8
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: μὴ οὖν ὁμοιωθῆτε αὐτοῖς, οἶδεν γὰρ ⸀ὁ πατὴρ ὑμῶν ὧν χρείαν ἔχετε πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/008.yaml
  text: Therefore[a], do not become like them, for your Father knows what you need before you ask him.
translation:
  language: uk
  text: Тож не уподібнюйтеся їм[a], адже ваш Отець знає, чого ви потребуєте, ще до того, як ви попросите в нього.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «не ставайте такими, як вони»; буквальніше також можливо: «не будьте уподібнені до них».'
    reason: 'Лексична альтернатива: ὁμοιωθῆτε є пасивною формою, але в цьому контексті природно може означати «не ставайте / не будьте подібними».'
lexical_decisions:
- source_word: μὴ οὖν
  choice: Тож не
  rationale: «Тож» природно передає висновкове οὖν і пов’язує заборону з попереднім застереженням; «не» виражає заборонне μή.
- source_word: ὁμοιωθῆτε
  choice: уподібнюйтеся
  rationale: Природний український відповідник зі значенням «ставати або бути подібними»; у примітці збережено можливий пасивний відтінок грецької форми.
- source_word: αὐτοῖς
  choice: їм
  rationale: Займенник природно відсилає до язичників, згаданих у безпосередньому контексті, не додаючи пояснення до основного тексту.
- source_word: οἶδεν
  choice: знає
  rationale: Формально перфектна форма οἶδα має теперішнє значення, тому перекладена теперішнім часом.
- source_word: ὁ πατὴρ ὑμῶν
  choice: ваш Отець
  rationale: Точно відтворює грецький вислів без додавання означення «небесний»; «Отець» зберігає біблійний, але зрозумілий сучасному читачеві регістр.
- source_word: ὧν χρείαν ἔχετε
  choice: чого ви потребуєте
  rationale: Стисло й природно передає зміст потреби та зберігає відносну конструкцію оригіналу.
- source_word: πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν
  choice: ще до того, як ви попросите в нього
  rationale: Передає часову попередність πρὸ τοῦ з інфінітивом; конструкція «попросити в когось» природно виражає звернене до особи прохання.
theological_decisions:
- issue: Боже передзнання у зв’язку з молитвою
  choice: Прямо стверджено, що Отець знає потреби учнів до їхнього прохання.
  alternative: Додати пояснення, що молитва потрібна для стосунків, а не для повідомлення Богові невідомого, або вкласти у формулювання розгорнуте вчення про всеосяжне передзнання.
  rationale: Сам вірш лише стверджує попереднє знання Отця. Переклад не повинен усувати напруження між цим твердженням і закликом молитися чи розв’язувати ширші богословські суперечки.
translation_notes:
  register: Сучасна нормативна українська мова з гідним біблійним регістром. Синтаксис зроблено природним для широкого кола читачів; не додано слова «небесний», якого немає в цьому вірші. Займенник щодо Отця подано з малої літери відповідно до звичайної сучасної орфографії, без конфесійно зумовленої капіталізації.
