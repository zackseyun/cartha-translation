id: MAT.6.31
reference: Matthew 6:31
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: μὴ οὖν μεριμνήσητε λέγοντες· Τί φάγωμεν; ἤ· Τί πίωμεν; ἤ· Τί περιβαλώμεθα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/031.yaml
  text: Therefore do not worry[a], saying, ‘What will we eat?’ or ‘What will we drink?’ or ‘What will we wear?’
translation:
  language: uk
  text: 'Тож не тривожтеся[a], кажучи: «Що нам їсти?» або: «Що нам пити?» або: «У що нам одягнутися?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «не журіться».'
    reason: Лексична альтернатива для μεριμνάω, що також передає тривожну заклопотаність.
lexical_decisions:
- source_word: μὴ οὖν μεριμνήσητε
  choice: Тож не тривожтеся
  rationale: «Тож» передає висновкове οὖν і природно пов’язує настанову з попереднім міркуванням. «Не тривожтеся» виражає заборону тривожної заклопотаності життєвими потребами, не перетворюючи її на заборону розсудливого планування.
- source_word: λέγοντες
  choice: кажучи
  rationale: Дієприслівник прямо передає грецький дієприкметник і вводить слова, в яких виявляється тривога.
- source_word: Τί φάγωμεν;
  choice: Що нам їсти?
  rationale: Природне українське питальне формулювання передає деліберативний аорист кон’юнктива щодо майбутньої потреби без штучного уточнення часу.
- source_word: Τί πίωμεν;
  choice: Що нам пити?
  rationale: Збережено паралельну будову та природне українське вираження занепокоєння про пиття.
- source_word: Τί περιβαλώμεθα;
  choice: У що нам одягнутися?
  rationale: У цьому контексті περιβάλλω означає одягатися; формулювання природне українською та зберігає рефлексивний відтінок грецької форми.
- source_word: ἤ ... ἤ ... ἤ
  choice: або ... або ... або
  rationale: Повторення «або» зберігає трикомпонентний перелік питань в оригіналі.
theological_decisions:
- issue: Характер заборони щодо матеріальних потреб
  choice: Передати μεριμνήσητε як заборону тривожитися
  alternative: «Не турбуйтеся» або «не дбайте»
  rationale: Контекст стосується тривожної заклопотаності забезпеченням, а не цілковитої заборони відповідального піклування чи планування. «Не тривожтеся» чітко зберігає цю різницю.
translation_notes:
  register: Сучасна нормативна українська мова; тон простий і гідний. Паралелізм трьох запитань та висновковий зв’язок із попереднім контекстом збережено.
