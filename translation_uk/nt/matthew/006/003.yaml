lexical_decisions:
- source_word: σοῦ δὲ ποιοῦντος
  choice: А ти, коли подаєш
  rationale: Генітив абсолютний із δέ протиставляє цю настанову попередній; конструкція «А ти, коли…» природно передає і контраст, і часовий зв’язок. Дієслово ποιέω у сполученні з ἐλεημοσύνην передано усталеним українським висловом «подавати милостиню».
- source_word: ἐλεημοσύνην
  choice: милостиню
  rationale: У цьому контексті слово означає матеріальну допомогу бідним. «Милостиня» точно й стисло називає таке давання, а примітка подає доступніший опис значення.
- source_word: μὴ γνώτω
  choice: нехай … не знає
  rationale: Так природно передається заперечний наказ у третій особі й зберігається яскраве уособлення руки.
- source_word: ἡ ἀριστερά σου
  choice: твоя ліва рука
  rationale: Прямий відповідник зберігає образність і паралелізм вислову.
- source_word: τί ποιεῖ ἡ δεξιά σου
  choice: що робить права
  rationale: Теперішній час передано природною українською формою «робить»; слово «рука» не повторено, бо воно легко відновлюється з контексту й так вислів звучить природніше.
theological_decisions:
- issue: Значення образу лівої та правої руки
  choice: Зберегти метафору як заклик до цілковитої непоказності у благодійності.
  alternative: Розкрити її в тексті як загальну настанову про смирення або як безумовну заборону будь-якої публічної доброчинності.
  rationale: Грецький текст використовує уособлення й навмисне перебільшення. Збереження образу не звужує його до доктринального твердження, якого сам вірш прямо не формулює.
translation_notes:
  register: Сучасна, зрозуміла й водночас гідна українська мова. Усталений вислів «подавати милостиню» зберігає конкретне значення грецького ἐλεημοσύνη, а дослівний образ двох рук залишено без тлумачного розгортання.
