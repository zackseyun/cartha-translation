reference: Matthew 6:7
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Προσευχόμενοι δὲ μὴ βατταλογήσητε ὥσπερ οἱ ἐθνικοί, δοκοῦσιν γὰρ ὅτι ἐν τῇ πολυλογίᾳ αὐτῶν εἰσακουσθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/007.yaml
  text: And when you pray[a], do not heap up empty words like the Gentiles[b], for they think that they will be heard because of their many words.
translation:
  language: uk
  text: Коли молитеся, не нагромаджуйте порожніх слів[a], як язичники[b], бо вони думають, що будуть почуті через своє багатослів’я.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «не белькочіть» чи «не вдавайтеся до беззмістовних повторів». Рідкісне грецьке дієслово, ймовірно, означає порожню, механічну або надміру багатослівну мову, а не щире повторення в молитві.
    reason: lexical_alternative
  - marker: b
    text: Або «погани»; буквально йдеться про людей з інших народів, тобто тих, хто не належав до народу завіту.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσευχόμενοι δὲ
  choice: Коли молитеся
  rationale: Дієприкметник передає обставину, за якої діє заборона; підрядна конструкція природна для сучасної української. Частка δέ продовжує настанову й не потребує окремого сполучника.
- source_word: μὴ βατταλογήσητε
  choice: не нагромаджуйте порожніх слів
  rationale: Рідкісне βατταλογέω, імовірно, позначає порожню, механічну чи надмірно багатослівну мову. Такий переклад не створює враження, ніби засуджується будь-яке повторення в молитві.
- source_word: ὥσπερ οἱ ἐθνικοί
  choice: як язичники
  rationale: У юдейському контексті οἱ ἐθνικοί означає людей із народів поза Ізраїлем. «Язичники» — усталений і зрозумілий український відповідник, а примітка зберігає буквальний етнічно-завітний відтінок.
- source_word: δοκοῦσιν
  choice: вони думають
  rationale: Природно передає їхнє припущення про те, завдяки чому Бог їх почує.
- source_word: ἐν τῇ πολυλογίᾳ αὐτῶν
  choice: через своє багатослів’я
  rationale: 'Прийменниковий зворот має причинно-засобовий відтінок: саме велику кількість слів вони вважають підставою для того, щоб бути почутими.'
- source_word: εἰσακουσθήσονται
  choice: будуть почуті
  rationale: Пасивна форма означає, що їх вислухають або прихильно почують; переклад не посилює значення до «отримають відповідь».
theological_decisions:
- issue: Чи забороняє Ісус будь-яке повторення в молитві, чи саме порожнє багатослів’я
  choice: «не нагромаджуйте порожніх слів» — заборона порожньої, механічної та самовпевнено багатослівної молитви
  alternative: «не повторюйте» або «не вживайте беззмістовних повторів»
  rationale: Рідкісне дієслово не дає підстав беззастережно засуджувати кожне повторення. Контекст викриває уявлення, ніби численні слова самі собою забезпечують прихильне слухання.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. «Нагромаджуйте порожніх слів» зберігає образ надмірності та беззмістовності, а «багатослів’я» стисло передає πολυλογία. Звертання в множині відповідає грецькому тексту.
