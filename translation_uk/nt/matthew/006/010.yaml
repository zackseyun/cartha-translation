source:
  edition: SBLGNT
  text: ἐλθέτω ἡ βασιλεία σου, γενηθήτω τὸ θέλημά σου, ὡς ἐν οὐρανῷ καὶ ⸀ἐπὶ γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/010.yaml
  text: May your kingdom come; may your will be done[a], as in heaven, so also on earth.
translation:
  language: uk
  text: Нехай прийде твоє Царство; нехай здійсниться твоя воля[a] — як на небі, так і на землі.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або, можливо, слова «як на небі, так і на землі» стосуються обох прохань: і «нехай прийде твоє Царство», і «нехай здійсниться твоя воля».'
    reason: Альтернативне розуміння синтаксичної сфери порівняльного вислову.
lexical_decisions:
- source_word: ἐλθέτω
  choice: нехай прийде
  rationale: Аористовий активний імператив третьої особи однини передає прохання, звернене до Бога. Конструкція «нехай прийде» природно виражає цю спонукальну силу українською.
- source_word: βασιλεία
  choice: Царство
  rationale: Слово може означати і царське правління, і царство. «Царство» є природним і усталеним відповідником у цьому контексті, не усуваючи значення Божого царювання.
- source_word: γενηθήτω
  choice: нехай здійсниться
  rationale: Аористовий пасивний імператив від γίνομαι у сполученні з θέλημα означає, що Божа воля має стати дійсністю. «Нехай здійсниться» звучить природно й не звужує зміст до самого лише виконання людських наказів.
- source_word: θέλημα
  choice: воля
  rationale: «Воля» точно охоплює те, чого Бог бажає або що Він постановив, зберігаючи властиву слову богословську місткість.
- source_word: ὡς
  choice: як
  rationale: Сполучник вводить порівняння; українське «як» стисло й точно відтворює його функцію.
- source_word: ἐν οὐρανῷ
  choice: на небі
  rationale: Хоча грецький прийменник буквально має значення «у», український усталений і природний вислів — «на небі».
- source_word: ἐπὶ γῆς
  choice: на землі
  rationale: Прийменниковий вислів природно передається як «на землі» й утворює ясну пару з «на небі».
- source_word: καὶ
  choice: так і
  rationale: У порівняльній конструкції ὡς… καί українське «як… так і» природно виражає відповідність між небом і землею, не додаючи нового змісту.
theological_decisions:
- issue: Сфера дії вислову ὡς ἐν οὐρανῷ καὶ ἐπὶ γῆς
  choice: 'У головному тексті порівняльний вислів найтісніше пов’язано з другим проханням: «нехай здійсниться твоя воля».'
  alternative: 'Порівняльний вислів можна розуміти як такий, що стосується обох прохань: і про прихід Царства, і про здійснення Божої волі.'
  rationale: Пунктуація в сучасних грецьких виданнях є редакторською. Найближчий синтаксичний зв’язок — із другим проханням, однак грецька побудова допускає ширше розуміння; тому неоднозначність збережено в примітці.
translation_notes:
  register: Сучасна нормативна українська мова з молитовною гідністю та прямим порядком слів. Займенники на позначення Бога подано з малої літери відповідно до нейтрального сучасного видавничого стилю; «Царство» написано з великої літери як назву Божого Царства. Тире перед порівняльним висловом допомагає читачеві відчути його безпосередній зв’язок із другим проханням, не заперечуючи ширшої можливості, зазначеної у примітці.
