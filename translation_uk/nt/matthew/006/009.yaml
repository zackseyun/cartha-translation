lexical_decisions:
- source_word: Οὕτως οὖν
  choice: Отже, ... так
  rationale: «Отже» передає висновковий зв’язок οὖν із попереднім повчанням, а «так» природно вводить спосіб або взірець молитви, виражений Οὕτως.
- source_word: προσεύχεσθε ὑμεῖς
  choice: ви моліться
  rationale: Наказова форма передана прямим спонуканням «моліться», а окремий займенник «ви» зберігає наголос, створений явним ὑμεῖς.
- source_word: Πάτερ ἡμῶν
  choice: Отче наш
  rationale: Природна українська форма кличного звертання збережує спільнотне «наш».
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: що на небесах
  rationale: Відносна конструкція природно передає означальну силу грецького артикля ὁ, а множина «на небесах» відповідає τοῖς οὐρανοῖς.
- source_word: ἁγιασθήτω
  choice: нехай ... шанують як святе
  rationale: Так передано прохально-наказову силу аористового пасивного імператива та значення ставитися до чогось як до святого. Неозначено-особова форма не називає виконавця дії й звучить зрозуміло сучасною українською.
- source_word: τὸ ὄνομά σου
  choice: Твоє ім’я
  rationale: Збережено безпосередню згадку про Боже ім’я без розгортання його можливих значень — особи, слави чи відкритого характеру.
theological_decisions:
- issue: Поєднання близькості й трансцендентності у звертанні до Бога
  choice: Отче наш, що на небесах
  alternative: Отче наш, що на небі; Отче наш небесний
  rationale: Обране формулювання зберігає і родинне звертання «Отче», і грецьку множину «небесах». Варіант «небесний» є більш тлумачним, а однина «на небі» відтворює традиційну форму, але не граматичне число джерела.
- issue: Зміст прохання ἁγιασθήτω
  choice: нехай Твоє ім’я шанують як святе
  alternative: нехай святиться Твоє ім’я; нехай Твоє ім’я буде освячене
  rationale: Обране формулювання ясно передає ставлення до Божого імені як до святого, не стверджуючи, ніби воно раніше не було святим. Неозначений діяч не звужує прохання лише до людської дії, хоча українська форма природніше сприймається саме так; традиційний варіант подано в примітці.
translation_notes:
  register: Сучасна, зрозуміла й водночас урочиста українська. Збережено кличний відмінок «Отче», явний наголос на «ви» та множину «небесах». Займенники у звертанні до Бога подано з великої літери відповідно до поширеної української релігійної традиції.
