lexical_decisions:
- source_word: τὸν ἄρτον ἡμῶν
  choice: хліб наш
  rationale: Ἄρτος прямо означає «хліб» і тут виступає конкретним образом поживи; присвійний родовий ἡμῶν природно передано словом «наш».
- source_word: τὸν ἐπιούσιον
  choice: щоденний
  rationale: Рідкісний прикметник ἐπιούσιος має спірне значення. «Щоденний» — усталений і зрозумілий відповідник, який у поєднанні зі «сьогодні» виражає щоденну залежність від Божого забезпечення, не усуваючи інших можливостей, наведених у примітці.
- source_word: δὸς ἡμῖν
  choice: дай нам
  rationale: Аористовий наказовий спосіб δὸς природно й безпосередньо передано як «дай», а давальний ἡμῖν — як «нам».
- source_word: σήμερον
  choice: сьогодні
  rationale: Слово σήμερον прямо означає «сьогодні»; цей відповідник природний у сучасній українській мові й точно зберігає часовий акцент.
theological_decisions:
- issue: Значення ἐπιούσιον у Господній молитві
  choice: щоденний
  alternative: на сьогодні; на прийдешній день; потрібний для життя
  rationale: 'Точне значення ἐπιούσιος невідоме: слово може стосуватися хліба на поточний день, на наступний день або необхідного для існування хліба. Основний текст використовує усталене й читабельне «щоденний», а справжню лексичну неоднозначність збережено в примітці.'
translation_notes:
  register: Сучасна, проста й гідна молитовна мова. Порядок слів «Хліб наш щоденний» зберігає виразний акцент грецького речення та лишається природним і впізнаваним українською.
