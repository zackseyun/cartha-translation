revisions:
- from: Але якщо твоє око лихе[a], усе твоє тіло буде темне. Отже, якщо світло, що в тобі, є темрявою, то яка ж велика та темрява!
  to: Але якщо твоє око погане[a], усе твоє тіло буде темне. Отже, якщо світло, що в тобі, є темрявою, то яка ж велика темрява!
  rationale: «Погане» є сучасним природним відповідником, який найкраще зберігає семантичну широту πονηρός і не вирішує наперед, чи йдеться про моральне зло, ваду сприйняття або скупість. Альтернативи та контекстуально можливий ідіоматичний відтінок винесено до примітки. Кінцеву фразу стилістично спрощено, зберігаючи її окличну силу й ступеневе значення πόσον.
  reviewer_model: gpt-5.6-terra
