base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/023.yaml
  text: But if your eye is bad[a], your whole body will be dark. If then the light in you is darkness, how great is the darkness!
translation:
  language: uk
  text: Але якщо твоє око погане[a], усе твоє тіло буде темне. Отже, якщо світло, що в тобі, є темрявою, то яка ж велика темрява!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «лихе», «зле», «нездорове»; можливо також «скупе» — з огляду на ідіоматичне значення образу «ока» та навколишній контекст.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηρός
  choice: лихе
  rationale: «Лихе» природно передає широкий діапазон πονηρός — погане, зле, недобре — і не звужує образ лише до фізично нездорового ока чи скупості.
- source_word: σκοτεινός
  choice: темне
  rationale: Прямий і стислий відповідник предикативного прикметника, який зберігає образ темряви.
- source_word: φῶς
  choice: світло
  rationale: Збережено буквальний образ внутрішнього світла без пояснювального звуження до сприйняття чи духовного стану.
- source_word: σκότος
  choice: темрява
  rationale: Прямий відповідник, що зберігає контраст зі світлом і повтор у завершальній фразі.
- source_word: πόσον
  choice: яка ж велика
  rationale: Передає міру в окличній еліптичній конструкції та природно звучить українською.
- source_word: ὀφθαλμός
  choice: око
  rationale: Буквальний відповідник зберігає тілесний образ, пов’язаний зі сприйняттям і внутрішньою спрямованістю.
- source_word: ὅλον τὸ σῶμά σου
  choice: усе твоє тіло
  rationale: Природний український відповідник із збереженням всеохопного наголосу ὅλον.
- source_word: τὸ φῶς τὸ ἐν σοὶ
  choice: світло, що в тобі
  rationale: Близько відтворює грецьку означену конструкцію й не додає тлумачення на зразок «внутрішнє світло».
theological_decisions:
- issue: Значення образу «лихого ока»
  choice: У головному тексті залишено широкий образ «лихе око».
  alternative: 'Можливі значення: «зле око», «нездорове око» або, з огляду на семітський ідіоматичний ужиток і контекст, «скупе око».'
  rationale: Контекст Матвія 6:19–24 допускає взаємопов’язані відтінки морального зла, спотвореного сприйняття та скупості. Переклад не усуває цієї неоднозначності.
translation_notes:
  register: Сучасна літературна українська мова; виклад стислий і гідний, із збереженням метафоричного контрасту світла й темряви та окличної сили кінцівки.
