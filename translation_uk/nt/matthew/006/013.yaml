  text: καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν, ἀλλὰ ῥῦσαι ἡμᾶς ἀπὸ τοῦ ⸀πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/013.yaml
  text: And do not lead us into temptation[b][a], but deliver us from evil.
translation:
  language: uk
  text: І не введи нас у спокусу[a], але визволи нас від лукавого[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «випробування». Грецьке слово може означати як спокусу, так і випробування чи тяжке випробування.
    reason: lexical_alternative
  - marker: b
    text: Або «від зла». Грецький вислів можна розуміти особово («від лукавого») або безособово («від зла»).
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ εἰσενέγκῃς
  choice: не введи
  rationale: Прямо передає заперечне молитовне прохання з аористом кон’юнктива та зберігає образ входження в небезпечну ситуацію, не додаючи тлумачного «не допусти».
- source_word: πειρασμόν
  choice: спокусу
  rationale: У цьому молитовному контексті природне й усталене українське слово; примітка зберігає ширший діапазон значень — випробування або тяжке випробування.
- source_word: ῥῦσαι
  choice: визволи
  rationale: Передає прохання про активне Боже рятування; слово природне для гідного молитовного стилю сучасної української мови.
- source_word: τοῦ πονηροῦ
  choice: лукавого
  rationale: Артикльована форма допускає особове розуміння — «лукавий»; субстантивований прикметник «лукавого» природно це передає, а справжню граматичну неоднозначність щодо безособового «зла» збережено в примітці.
theological_decisions:
- issue: Значення τοῦ πονηροῦ
  choice: лукавого
  alternative: зла
  rationale: Грецька форма може бути чоловічого роду й означати особового супротивника або середнього роду й означати зло. Основний текст приймає природне особове прочитання, не ототожнюючи референта пояснювально з конкретним ім’ям; безособове прочитання подано в примітці.
- issue: Значення πειρασμόν
  choice: спокусу
  alternative: випробування
  rationale: Контекст допускає як спонукання до гріха, так і ситуацію випробування. Усталене «спокусу» залишено в основному тексті, а ширший зміст відкрито в примітці.
translation_notes:
  register: Сучасна нормативна українська мова з гідним молитовним звучанням. Збережено традиційно впізнавану, але не архаїчну будову прохання; тлумачні розгортання винесено до приміток.
