id: MAT.6.33
reference: Matthew 6:33
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ζητεῖτε δὲ πρῶτον τὴν ⸀βασιλείαν καὶ τὴν δικαιοσύνην αὐτοῦ, καὶ ταῦτα πάντα προστεθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/033.yaml
  text: But seek first his kingdom and his righteousness[a], and all these things will be added to you.
translation:
  language: uk
  text: Але шукайте насамперед його Царства та його праведності[a], і все це буде додано вам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «справедливості». Грецьке слово може означати і праведність, і справедливість; тут «праведність» зберігає ширший зміст — правильні взаємини з Богом і життя згідно з його волею, а не лише судову чи суспільну справедливість.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητεῖτε
  choice: шукайте
  rationale: Теперішній наказовий спосіб у множині передає постійне, діяльне прагнення; українське «шукайте» природно зберігає і наказ, і широту значення.
- source_word: δὲ
  choice: але
  rationale: Сполучник позначає протиставлення попереднім словам про тривогу щодо їжі, пиття й одягу.
- source_word: πρῶτον
  choice: насамперед
  rationale: Передає не лише часову першість, а й головний пріоритет, не вдаючись до розлогого пояснення.
- source_word: βασιλείαν
  choice: Царства
  rationale: «Царство» є усталеним і містким відповідником, який може охоплювати як царське правління Бога, так і впорядковану ним дійсність.
- source_word: δικαιοσύνην
  choice: праведності
  rationale: «Праведність» зберігає широкий зміст відповідності Божій волі, правильних взаємин і належної поведінки; можливе значення «справедливість» подано у примітці.
- source_word: αὐτοῦ
  choice: його
  rationale: Займенник збережено без пояснювальної заміни на «Бога»; з контексту він стосується Бога, Отця.
- source_word: ταῦτα πάντα
  choice: все це
  rationale: Вказує на всі щойно згадані життєві потреби — їжу, пиття та одяг.
- source_word: προστεθήσεται
  choice: буде додано
  rationale: Майбутній пасив збережено прямо, без звуження до пояснювального «буде забезпечено».
- source_word: ὑμῖν
  choice: вам
  rationale: Природний український відповідник давального відмінка при пасивній конструкції.
theological_decisions:
- issue: Передача δικαιοσύνη
  choice: праведність
  alternative: справедливість
  rationale: У цьому контексті слово охоплює відповідність Божій волі та праведне життя, тому «справедливість» могла б невиправдано звузити його до суспільного або судового виміру.
- issue: Референт αὐτοῦ
  choice: його
  alternative: Божого / Бога
  rationale: Збереження займенника відтворює форму грецького тексту й не потребує зайвого уточнення, хоча контекст ясно вказує на Бога, Отця.
- issue: Пасив у προστεθήσεται
  choice: буде додано вам
  alternative: Бог додасть вам
  rationale: Пасивну форму збережено, щоб не робити неявного виконавця граматично явним, навіть якщо в контексті ним розуміється Бог.
translation_notes:
  register: Сучасна літературна українська з гідним, загальнозрозумілим біблійним звучанням. Займенник «його» написано з малої літери відповідно до нейтральної сучасної норми, без внесення конфесійної практики шанобливої капіталізації. Велика літера в «Царства» вжита як традиційне позначення Божого Царства.
