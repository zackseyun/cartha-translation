source:
  edition: SBLGNT
  text: Εἴπατε τῇ θυγατρὶ Σιών· Ἰδοὺ ὁ βασιλεύς σου ἔρχεταί σοι πραῢς καὶ ἐπιβεβηκὼς ἐπὶ ὄνον καὶ ⸀ἐπὶ πῶλον υἱὸν ὑποζυγίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/005.yaml
  text: Tell the daughter of Zion[a], ‘Look, your king is coming to you, gentle and mounted on a donkey, and on a colt[b], the foal of a beast of burden.’
translation:
  language: uk
  text: 'Скажіть дочці Сіону: «Ось твій цар іде до тебе — лагідний[a], верхи на ослиці й на осляті[b], дитинчаті в’ючної тварини».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «смиренний». Грецьке πραΰς може означати «лагідний», «покірний» або «смиренний» і відсилає до Захарії 9:9.
    reason: lexical_alternative
  - marker: b
    text: 'Матвій зберігає пророче формулювання з двома пов’язаними назвами тварин: «на ослиці й на осляті, дитинчаті в’ючної тварини».'
    reason: cross_reference
lexical_decisions:
- source_word: Εἴπατε
  choice: Скажіть
  rationale: Аористовий наказовий спосіб множини передано природним українським наказовим дієсловом, що вводить цитату.
- source_word: τῇ θυγατρὶ Σιών
  choice: дочці Сіону
  rationale: Збережено пророче уособлення, не замінюючи його пояснювальним «народові Сіону» чи «Єрусалиму».
- source_word: Ἰδοὺ
  choice: Ось
  rationale: Сучасний і виразний український відповідник частки, яка привертає увагу.
- source_word: ὁ βασιλεύς σου
  choice: твій Цар
  rationale: Прямо збережено присвійний зворот і царську, в контексті месіанську, образність.
- source_word: ἔρχεταί σοι
  choice: іде до тебе
  rationale: Теперішній час із живою безпосередністю природно передано українським «іде до тебе».
- source_word: πραῢς
  choice: лагідний
  rationale: Слово передає незлобивість і незастосування примусу; можливий відтінок смирення збережено у примітці.
- source_word: ἐπιβεβηκὼς
  choice: верхи
  rationale: Перфектний дієприкметник позначає того, хто сів і перебуває верхи; стислий прислівниковий відповідник звучить природно українською.
- source_word: ἐπὶ ὄνον
  choice: на ослиці
  rationale: ὄνος граматично може не уточнювати стать, однак у пророчому паралелізмі з ослям природно позначає дорослу ослицю; це також узгоджується з найближчим контекстом Матвія 21:2.
- source_word: πῶλον
  choice: осляті
  rationale: Наступна прикладка визначає молоду тварину як дитинча в’ючної тварини; «осля» природніше й точніше в цьому контексті, ніж ширше «лоша».
- source_word: υἱὸν ὑποζυγίου
  choice: дитинчаті в’ючної тварини
  rationale: Семітизм «син в’ючної тварини» передано природно, зберігаючи загальне значення ὑποζύγιον, а не звужуючи його повторно до «ослиці».
theological_decisions:
- issue: Месіанська цитата із Захарії 9:9 та можливе узгодження її формулювання зі старозавітним текстом
  choice: 'Передати грецьке формулювання Матвія: «лагідний… верхи на ослиці й на осляті, дитинчаті в’ючної тварини»'
  alternative: Ужити «смиренний» або звести дві пов’язані назви тварин до одного референта
  rationale: Переклад має відображати наявний грецький текст Матвія, не гармонізуючи його мовчки з іншою формою Захарії 9:9. Подвоєне формулювання збережено, бо воно належить до тексту й несе тлумачну напругу.
translation_notes:
  register: Сучасна стандартна українська мова, зрозуміла широкому читачеві, із гідним пророчим звучанням. Уникнуто архаїчного «се» та неприродного буквального «син під’яремної тварини»; тире допомагає природно приєднати опис Царя.
