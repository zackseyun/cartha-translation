lexical_decisions:
- source_word: ἤγγισαν
  choice: наблизилися
  rationale: Аорист ἐγγίζω позначає просторове наближення; «наблизилися» природно й точно передає рух до Єрусалима.
- source_word: Ἱεροσόλυμα
  choice: Єрусалима
  rationale: Усталена українська форма назви міста; родовий відмінок зумовлений прийменником «до».
- source_word: ἦλθον
  choice: прийшли
  rationale: Прямо передає звичайне значення ἔρχομαι та зберігає окремий від попереднього дієслова етап руху.
- source_word: Βηθφαγὴ
  choice: Витфагії
  rationale: Усталена українська біблійна передача топоніма; відмінкова форма відповідає конструкції «до Витфагії».
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: до Оливної гори
  rationale: Зберігає напрямне значення εἰς і традиційну сучасну українську назву місцевості, не усуваючи синтаксичної неоднозначності зв’язку з Витфагією.
- source_word: τότε
  choice: тоді
  rationale: Природно передає часовий і оповідний перехід.
- source_word: ἀπέστειλεν
  choice: послав
  rationale: Звичайне й точне українське дієслово для доручення учням піти з певною метою.
- source_word: δύο μαθητὰς
  choice: двох учнів
  rationale: Пряма передача числівника й іменника; «учні» є усталеним відповідником μαθηταί у євангельській оповіді.
theological_decisions:
- issue: Неозначений підмет дієслів у множині перед появою імені Ісуса
  choice: Збережено займенниковий підмет «вони», а Ісуса названо лише там, де його прямо називає грецький текст.
  alternative: «Ісус та його учні наблизилися…»
  rationale: Контекст дає змогу зрозуміти склад групи, але сам вірш не називає її повністю; переклад не додає відсутнього в джерелі уточнення.
- issue: Синтаксичний зв’язок вислову про Оливну гору
  choice: «до Витфагії, до Оливної гори»
  alternative: «до Витфагії на Оливній горі»
  rationale: Основний текст максимально близько відтворює повторення εἰς, а примітка зберігає можливість розуміти другий географічний вислів як уточнення місця Витфагії.
translation_notes:
  register: Сучасна стандартна українська мова; виклад природний, стриманий і гідний. Сполучник «І коли» зберігає зв’язок із попередньою оповіддю, а лексика не має архаїчного чи конфесійно забарвленого характеру.
