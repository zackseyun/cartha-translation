source:
  edition: SBLGNT
  text: διὰ τοῦτο λέγω ὑμῖν ὅτι ἀρθήσεται ἀφ’ ὑμῶν ἡ βασιλεία τοῦ θεοῦ καὶ δοθήσεται ἔθνει ποιοῦντι τοὺς καρποὺς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/043.yaml
  text: Therefore I tell you[a], the kingdom of God will be taken away from you and given to a nation producing its fruits.
translation:
  language: uk
  text: 'Тому кажу вам: Царство Боже буде забране від вас і дане народові[a], який приносить його плоди.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «нації». Грецьке ἔθνος може означати народ або націю; тут ідеться про спільноту, визначену тим, що вона приносить плоди, без вужчого уточнення, кого саме мають на увазі.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Тому
  rationale: Стисло й природно передає висновок із попередньої притчі та цитати.
- source_word: λέγω ὑμῖν
  choice: кажу вам
  rationale: Прямо зберігає звичну формулу особистого звернення без стилістичного ускладнення.
- source_word: ἀρθήσεται ἀφ’ ὑμῶν
  choice: буде забране від вас
  rationale: Передає майбутній пасив і значення відібрання в теперішніх володільців.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Боже Царство
  rationale: Природний український відповідник, що зберігає широкий зміст βασιλεία — і царювання, і царство — без звужувального перефразування.
- source_word: δοθήσεται
  choice: і дане
  rationale: Зберігає майбутній пасив, узгоджений із попереднім присудком; повтор допоміжного дієслова в українській не потрібний.
- source_word: ἔθνει
  choice: народові
  rationale: ἔθνος у цьому контексті позначає корпоративну спільноту; «народ» природніше за «нація» в сучасній українській біблійній мові й не визначає її вузько як язичників, Церкву чи етнічну групу.
- source_word: ποιοῦντι
  choice: який приноситиме
  rationale: У метафорі плодів українською природно казати «приносити плоди»; майбутня форма узгоджує характеристику одержувача з майбутнім переданням, не заперечуючи тривалого характеру грецького дієприкметника теперішнього часу.
- source_word: τοὺς καρποὺς αὐτῆς
  choice: його плоди
  rationale: Збережено множину «плоди»; займенник граматично відсилає до «Царства» й не замінюється тлумачним уточненням.
theological_decisions:
- issue: Кого означає ἔθνει
  choice: Загально передано як «народові», без ототожнення з Церквою, язичниками або оновленим Ізраїлем.
  alternative: «нації», «язичникам», «Церкві»
  rationale: Грецький текст називає корпоративного одержувача за ознакою його плодів, але сам не дає вужчого однозначного визначення; переклад зберігає цю богословську напругу.
- issue: Значення вислову «Боже Царство»
  choice: Вислів збережено без пояснювального перефразування.
  alternative: «Боже царювання», «привілей належати до Божого народу»
  rationale: Перефразування звузило б багатозначність βασιλεία та конкретизувало б характер суду понад те, що прямо сказано в тексті.
- issue: Референт займенника αὐτῆς
  choice: «його», тобто Царства
  alternative: Розуміти як плоди самого народу або передати без займенника
  rationale: Жіноча форма αὐτῆς природно узгоджується з ἡ βασιλεία; український займенник «його» граматично відповідає середньому роду слова «Царство».
translation_notes:
  register: Сучасна, гідна й загальнозрозуміла українська. Синтаксис близький до грецького, але природний для української; образ Царства та його плодів збережено без конфесійного уточнення.
