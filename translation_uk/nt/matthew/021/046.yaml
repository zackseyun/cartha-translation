  source_fidelity: 'Загальний зміст передано точно: протиставлено намір схопити Ісуса і страх перед зібраними людьми; причинний зв’язок та оцінку Ісуса як пророка збережено. «Натовпу» як збірний відповідник множинного τοὺς ὄχλους допустимий. Проте «І, хоча ... , побоялися» має неприродний, еліптичний порядок слів; явне повторення підмета робить синтаксичний зв’язок прозорішим.'
