  text: καὶ ζητοῦντες αὐτὸν κρατῆσαι ἐφοβήθησαν τοὺς ὄχλους, ⸂ἐπεὶ εἰς⸃ προφήτην αὐτὸν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/046.yaml
  text: And although they were seeking to arrest him[a], they feared the crowds, because they regarded him as a prophet.
translation:
  language: uk
  text: І хоча вони намагалися схопити Його, вони боялися натовпу, бо люди вважали Його пророком.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζητοῦντες
  choice: хоча вони намагалися
  rationale: Дієприкметник теперішнього часу передає тривалий намір або спробу; допустимий контекстуальний поступальний зв’язок із головним дієсловом природно виражено словом «хоча».
- source_word: κρατῆσαι
  choice: схопити
  rationale: У ворожому контексті дієслово означає силоміць узяти під контроль. «Схопити» природно передає дію, не додаючи формально-правового відтінку, якого саме слово не вимагає.
- source_word: ἐφοβήθησαν
  choice: побоялися
  rationale: Аорист передано природною українською формою доконаного виду; вона виражає страх, що стримав їх від задуманої дії, без надмірного уточнення його початку.
- source_word: τοὺς ὄχλους
  choice: натовпу
  rationale: Грецька форма множини може позначати зібрані людські маси; в українському контексті збірне однинне «натовпу» звучить природніше й не змінює змісту.
- source_word: ἐπεὶ εἰς
  choice: бо
  rationale: ἐπεί вводить причину їхнього страху; «бо» стисло й природно передає причинний зв’язок.
- source_word: εἰς προφήτην αὐτὸν εἶχον
  choice: люди вважали Його пророком
  rationale: 'Ідіома ἔχω εἰς передає ставлення або оцінку: «вважати кимось». Явне «люди» природно уточнює, що мається на увазі натовп, і усуває в українській неоднозначність займенника «вони».'
- source_word: προφήτην
  choice: пророком
  rationale: Український орудний відмінок після «вважали» природно передає належність до категорії пророків без додавання твердження, що це вичерпує особу Ісуса.
theological_decisions:
- issue: Як передати оцінку Ісуса натовпом як προφήτην, не додаючи й не заперечуючи ширших христологічних тверджень
  choice: люди вважали Його пророком
  alternative: люди сприймали Його як пророка
  rationale: Формулювання подає погляд людей у межах розповіді, а не вичерпне визначення особи Ісуса; воно зберігає богословську напругу тексту.
translation_notes:
  register: Сучасна стандартна українська, природний і гідний біблійний стиль. Займенник «Його» написано з великої літери відповідно до поширеної української біблійної традиції. Лексика доступна широкому читачеві; синтаксис зберігає протиставлення між наміром схопити Ісуса та страхом перед натовпом.
