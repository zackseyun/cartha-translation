  terminology: «Схопити», «натовп» і «вважали Його пророком» є вдалими сучасними відповідниками. Написання «Його» з великої літери відповідає прийнятій біблійній редакційній традиції. Додане «люди» коректно роз’яснює, що оцінка належить натовпу, а не тим, хто хотів схопити Ісуса.
