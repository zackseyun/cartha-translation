source:
  edition: SBLGNT
  text: ὅταν οὖν ἔλθῃ ὁ κύριος τοῦ ἀμπελῶνος, τί ποιήσει τοῖς γεωργοῖς ἐκείνοις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/040.yaml
  text: Therefore[a], when the owner of the vineyard comes[b], what will he do to those farmers?
translation:
  language: uk
  text: Отже, коли прийде господар[a] виноградника, що він зробить із тими виноградарями[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «власник виноградника». Грецьке κύριος часто перекладають як «Господь» або «пан», але тут у межах притчі воно означає господаря виноградника.
    reason: lexical_alternative
  - marker: b
    text: Або «землеробами» чи, з огляду на контекст притчі, «орендарями». Грецьке слово загалом означає тих, хто обробляє землю; те, що вони орендували виноградник, випливає з ширшого контексту.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: коли
  rationale: Разом із дієсловом у кон’юнктиві вводить очікувану майбутню подію в оповіді; «коли» тут природніше за повторювальне «щоразу, коли».
- source_word: οὖν
  choice: отже
  rationale: Передає висновок або логічний перехід від попереднього розвитку притчі до запитання Ісуса.
- source_word: ἔλθῃ
  choice: прийде
  rationale: Аорист кон’юнктива після ὅταν стосується очікуваної майбутньої події; український майбутній час природно передає цей зміст.
- source_word: κύριος
  choice: господар
  rationale: У сполученні «господар виноградника» слово позначає особу, якій належить виноградник і яка ним розпоряджається; це природне українське відповідне слово без недоречного титулу «Господь».
- source_word: ἀμπελῶνος
  choice: виноградника
  rationale: Звичайний і точний відповідник назви місця, де вирощують виноград.
- source_word: τί ποιήσει
  choice: що він зробить із
  rationale: Питальна конструкція з давальним відмінком означає дію, спрямовану на згаданих виноградарів; «зробить із» природно передає це українською, не уточнюючи наперед характер дії.
- source_word: γεωργοῖς
  choice: виноградарями
  rationale: Загалом слово означає землеробів або обробників землі, а в безпосередньому контексті — людей, які обробляють виноградник. «Виноградарі» звучить природно й зберігає їхню сільськогосподарську роль; орендні відносини пояснено в примітці.
- source_word: ἐκείνοις
  choice: тими
  rationale: 'Зберігає вказівність і певне дистанціювання грецького займенника: йдеться саме про тих виноградарів.'
theological_decisions:
- issue: Передача κύριος у контексті притчі
  choice: господар
  alternative: власник; пан
  rationale: У межах сюжету слово називає господаря виноградника, а не безпосередньо вживається як божественний чи христологічний титул. «Господар» зберігає роль персонажа та не усуває можливості ширшого символічного значення притчі.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Порядок слів зберігає логічний перехід «Отже» та виразне завершальне запитання. «Господар» і «виноградарі» природні для притчового сільськогосподарського контексту.
