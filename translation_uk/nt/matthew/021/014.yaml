lexical_decisions:
- source_word: προσῆλθον
  choice: підійшли
  rationale: Дієслово προσέρχομαι передає наближення до когось; «підійшли» природно й точно виражає цей рух у сучасній українській.
- source_word: αὐτῷ
  choice: до Нього
  rationale: Давальний відмінок із προσέρχομαι позначає особу, до якої наблизилися; українською це природно передається конструкцією «до Нього».
- source_word: τυφλοὶ
  choice: сліпі
  rationale: Субстантивований прикметник у множині означає сліпих людей. «Сліпі» стисло зберігає граматичну форму й природно звучить у парі з «кульгаві».
- source_word: χωλοὶ
  choice: кульгаві
  rationale: Субстантивований прикметник позначає людей з порушенням ходи. «Кульгаві» є точним, усталеним і не надмірно різким відповідником.
- source_word: ἐν τῷ ἱερῷ
  choice: у храмі
  rationale: ἱερόν означає весь храмовий комплекс, а не лише внутрішнє святилище. Вислів «у храмі» є природним українським відповідником, а просторове уточнення подано у примітці.
- source_word: ἐθεράπευσεν
  choice: зцілив
  rationale: У контексті євангельських оповідей θεραπεύω означає відновлення здоров’я; «зцілив» точно передає дію Ісуса й відповідає гідному біблійному регістру.
theological_decisions:
- issue: Місце зцілення, позначене словом ἱερόν
  choice: Ісус зцілив їх у храмовому комплексі.
  alternative: Ісус зцілив їх на храмовому подвір’ї.
  rationale: Грецьке ἱερόν зазвичай охоплює храмову територію загалом і не означає конкретно внутрішнє святилище (ναός). Основний текст зберігає природне «у храмі», а примітка запобігає надто вузькому розумінню.
translation_notes:
  register: Сучасна стандартна українська; виклад стислий, природний і гідний. Збережено грецьку послідовність двох груп та повторне сурядне «і», характерне для розповідного стилю вірша.
