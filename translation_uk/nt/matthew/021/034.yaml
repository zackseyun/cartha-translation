lexical_decisions:
- source_word: ὅτε δὲ
  choice: А коли
  rationale: ὅτε вводить часову підрядну частину, а δέ позначає м’який перехід у розповіді; «А коли» природно передає обидва елементи без надмірного протиставлення.
- source_word: ἤγγισεν
  choice: наблизився
  rationale: Прямо передає аорист ἐγγίζω; у підрядній часовій конструкції українська доконана форма природно виражає попередню щодо головної дії подію.
- source_word: ὁ καιρὸς τῶν καρπῶν
  choice: час збирання плодів
  rationale: καιρός означає належний або визначений час, а в контексті виноградника генітив τῶν καρπῶν указує на час отримання врожаю. Додавання «збирання» робить аграрний зміст природним українською, не змінюючи референта.
- source_word: ἀπέστειλεν
  choice: послав
  rationale: Звичайний і точний український відповідник дієслова зі значенням посилання представників.
- source_word: τοὺς δούλους αὐτοῦ
  choice: своїх слуг
  rationale: δοῦλος може означати раба або слугу. Тут на передньому плані їхня роль посланців господаря; «своїх» природно співвідносить їх із підметом. Альтернативу збережено в примітці.
- source_word: πρὸς τοὺς γεωργοὺς
  choice: до виноградарів-орендарів
  rationale: γεωργοί — землероби або виноградарі; контекст притчі показує, що вони обробляють чужий виноградник як орендарі. Подвійне означення зберігає і заняття, і майнові відносини.
- source_word: λαβεῖν
  choice: щоб одержати
  rationale: Інфінітив мети від λαμβάνω передає намір господаря отримати через посланців належний йому врожай.
- source_word: τοὺς καρποὺς αὐτοῦ
  choice: належні йому плоди
  rationale: Множина «плоди» відтворює τοὺς καρπούς, а «належні йому» природно розкриває присвійне αὐτοῦ у ситуації отримання частки врожаю, не уточнюючи її розміру чи форми.
