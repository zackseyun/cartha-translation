  text: Then he came to the second and said the same[a]. And he answered, ‘I will[b], sir,’ but he did not go.
translation:
  language: uk
  text: 'Тоді він підійшов до другого сина й сказав те саме. Той відповів: «Я піду[a], пане[b]», — але не пішов.'
