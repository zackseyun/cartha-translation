    reason: alternative_reading
lexical_decisions:
- source_word: προσελθὼν δὲ
  choice: Тоді він підійшов
  rationale: Дієприкметник передає рух батька до другого сина, а δέ тут позначає перехід до наступної дії, тому природно передано словом «тоді».
- source_word: τῷ δευτέρῳ
  choice: до другого
  rationale: У грецькому тексті стоїть лише «до другого»; слово «сина» зрозуміле з безпосереднього контексту й не потребує повторення.
- source_word: ὡσαύτως
  choice: те саме
  rationale: Йдеться про те саме доручення, яке батько дав першому синові; цей відповідник стислий і природний українською.
- source_word: ἀποκριθεὶς εἶπεν
  choice: відповів
  rationale: Усталений грецький зворот дослівно означає «у відповідь сказав», але українською природно передається одним дієсловом.
- source_word: Ἐγώ
  choice: Я піду
  rationale: Грецький текст містить лише наголошене «я», що в контексті є еліптичною згодою виконати наказ. Додане дієслово робить зміст ясним українською, а примітка зберігає буквальну форму.
- source_word: κύριε
  choice: пане
  rationale: Клична форма виражає шанобливе звертання сина до людського батька. «Пане» зберігає повагу без недоречного в цьому контексті божественного титулу.
- source_word: καὶ οὐκ ἀπῆλθεν
  choice: але не пішов
  rationale: Хоча καί буквально є сполучником «і», тут українське «але» природно виражає змістовий контраст між обіцянкою та вчинком.
theological_decisions:
- issue: Передача κύριε у звертанні до батька
  choice: пане
  alternative: Господи; володарю
  rationale: Контекст притчі вказує на шанобливе звертання до людського батька, а не на христологічний чи божественний титул. Водночас примітка фіксує ширший діапазон значень грецького слова.
translation_notes:
  register: Сучасна літературна українська з природним, стислим і гідним оповідним ритмом. Еліпсис оригіналу розкрито в основному тексті для зрозумілості, а буквальну форму та семантичний діапазон κύριε збережено в примітках.
