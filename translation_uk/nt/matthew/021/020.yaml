  text: And when the disciples saw it[a], they marveled, saying, “How did the fig tree wither immediately?”
translation:
  language: uk
  text: 'Побачивши це, учні здивувалися й сказали: «Як це смоківниця відразу всохла?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: Побачивши це
  rationale: Аористовий дієприкметник передано природною українською дієприслівниковою конструкцією. «Це» відсилає до побаченого стану смоківниці в попередньому контексті.
- source_word: ἐθαύμασαν
  choice: здивувалися
  rationale: Дієслово виражає подив або враження; «здивувалися» є природним і точним у сучасній українській.
- source_word: λέγοντες
  choice: й сказали
  rationale: Буквальне «кажучи» українською тут звучало б важкувато після дієприслівника; сурядна форма природно передає супровідну мову.
- source_word: Πῶς
  choice: Як це
  rationale: «Як» передає питання про спосіб або обставини, а частка «це» природно підсилює виражений контекстом подив, не змінюючи змісту.
- source_word: παραχρῆμα
  choice: відразу
  rationale: Прислівник означає «негайно, відразу»; вибір прямо зберігає часову силу грецького слова.
- source_word: ἐξηράνθη
  choice: всохла
  rationale: У контексті дерева пасивна форма ξηραίνω природно передається українським неперехідним дієсловом «всохла».
- source_word: ἡ συκῆ
  choice: смоківниця
  rationale: Усталена сучасна українська назва фігового дерева, доречна для біблійного регістру.
theological_decisions: []
translation_notes:
  register: Сучасна стандартна українська, природний і гідний оповідний стиль. Переклад зберігає подив учнів та безпосереднє часове значення παραχρῆμα без додавання богословського тлумачення.
