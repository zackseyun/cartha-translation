    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ὅσα
  choice: усе, чого
  rationale: Сполука πᾶς з ὅσος має всеохопне значення «усе, чого» або «що б не». Обраний відповідник природний українською і зберігає широту вислову.
- source_word: ἂν αἰτήσητε
  choice: попросите
  rationale: Ἄν з аористом кон’юнктива утворює неозначену відносну конструкцію. У сполуці «усе, чого попросите» український доконаний вид природно передає можливу майбутню дію без зайвої модальності.
- source_word: ἐν τῇ προσευχῇ
  choice: в молитві
  rationale: Прийменниковий вислів природно передає обставини прохання; грецький артикль тут не вимагає означеності в українській.
- source_word: πιστεύοντες
  choice: вірячи
  rationale: Дієприслівник зберігає форму й одночасність грецького дієприкметника, пов’язуючи віру з проханням без перетворення вислову на явно умовне речення.
- source_word: λήμψεσθε
  choice: одержите
  rationale: Майбутній час λαμβάνω природно передано словом «одержите»; воно відповідає гідному біблійному регістру й не потребує окремого відтворення середнього стану.
theological_decisions:
- issue: Зв’язок віри з відповіддю на молитву
  choice: Передати πιστεύοντες дієприслівником «вірячи».
  alternative: «якщо віритимете» або «за умови, що вірите»
  rationale: Грецький текст уживає дієприкметник, а не явне умовне речення. Такий переклад зберігає наголос на вірі, не визначаючи понад текст точного механізму чи меж відповіді на молитву.
translation_notes:
  register: Сучасна, зрозуміла й водночас гідна українська мова. Порядок слів близький до грецького, але природний для українського читача; тире перед присудком не додано, щоб не створювати відсутнього в оригіналі емфатичного поділу.
