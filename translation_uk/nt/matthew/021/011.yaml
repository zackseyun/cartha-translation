source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι ἔλεγον· Οὗτός ἐστιν ⸂ὁ προφήτης Ἰησοῦς⸃ ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/011.yaml
  text: And the crowds were saying[a], “This is the prophet Jesus, from Nazareth in Galilee.”
translation:
  language: uk
  text: 'Натовпи ж казали: «Це пророк[a] Ісус із Назарета в Галілеї».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'У грецькому тексті стоїть означений артикль: буквально «the prophet». Це може вказувати на визнаного або очікуваного пророка. Українське «пророк» не виражає цієї визначеності окремим артиклем.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι
  choice: А натовпи
  rationale: Множина ὄχλοι передана множиною «натовпи», а слабкий сполучник δέ — природним оповідним «а».
- source_word: ἔλεγον
  choice: говорили
  rationale: Недоконаний вид українського дієслова природно передає тривалу або повторювану дію імперфекта, не посилюючи її до «раз у раз говорили».
- source_word: Οὗτός ἐστιν
  choice: Це
  rationale: У реченні ототожнення сучасне українське «це» природно й стисло передає вказівний займенник із дієсловом-зв’язкою.
- source_word: ὁ προφήτης
  choice: пророк
  rationale: Українська зазвичай не має артикля, тому «пророк» природно передає грецьку конструкцію; контекст може допускати як упізнання визначеного пророчого діяча, так і класифікаційне розуміння.
- source_word: Ἰησοῦς
  choice: Ісус
  rationale: Усталена українська форма особового імені.
- source_word: ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας
  choice: із Назарета, що в Галілеї
  rationale: Передає походження Ісуса та однозначно відносить географічне уточнення «Галілеї» до Назарета, природно для сучасної української.
theological_decisions:
- issue: Чи позначає ὁ προφήτης визначеного очікуваного Пророка, чи просто пророка
  choice: пророк
  alternative: той Пророк; один із пророків
  rationale: Грецький артикль може мати визначальну силу, але українська не виражає її автоматично. Основний текст не додає «той», щоб не нав’язувати натовпу виразно месіанське ототожнення, і не додає «один із», щоб не усунути можливу визначеність; неоднозначність пояснено в примітці.
translation_notes:
  register: Сучасна нормативна українська, природний і гідний оповідний стиль. «Говорили» зберігає аспект імперфекта; географічний зворот сформульовано без канцеляризму й без синтаксичної двозначності.
