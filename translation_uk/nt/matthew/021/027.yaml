source:
  edition: SBLGNT
  text: καὶ ἀποκριθέντες τῷ Ἰησοῦ εἶπαν· Οὐκ οἴδαμεν. ἔφη αὐτοῖς καὶ αὐτός· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/027.yaml
  text: And answering Jesus, they said, “We do not know.” He also said to them, “Neither will I tell you by what authority I do these things.”
translation:
  language: uk
  text: 'Вони ж відповіли Ісусові: «Не знаємо». І Він у відповідь сказав їм: «І Я не скажу вам, якою владою це роблю».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: відповіли
  rationale: Дієприкметник вводить відповідь співрозмовників; особова форма природніша в сучасній українській і точно передає функцію грецької конструкції.
- source_word: Οὐκ οἴδαμεν
  choice: Не знаємо
  rationale: Пряме й стисле заперечення знання, природне для діалогу та відповідне грецькому вислову.
- source_word: ἔφη
  choice: сказав
  rationale: Нейтральний відповідник звичайного дієслова мовлення без додаткового тлумачення.
- source_word: καὶ αὐτός
  choice: Тоді й Він
  rationale: 'Передає взаємний характер відповіді: після їхньої відмови відповідає і сам Ісус. «Тоді» природно пов’язує репліки, не змінюючи логіки вислову.'
- source_word: Οὐδὲ ἐγὼ
  choice: І Я не
  rationale: 'Зберігає наголос на взаємності: вони не дали відповіді, і Він також не дає їм запитаної інформації.'
- source_word: λέγω ὑμῖν
  choice: скажу вам
  rationale: У цьому контексті теперішня форма має силу відмови повідомити; українське майбутнє «не скажу» природно передає цю прагматичну функцію.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: якою владою
  rationale: В українській біблійній та загальній мові це природно означає підставу й уповноваження, з якими Ісус чинить ці дії.
- source_word: ταῦτα
  choice: це
  rationale: Українське займенникове «це» природно може узагальнено позначати сукупність дій, зберігаючи референцію грецького множинного ταῦτα без неприродного «ці речі».
- source_word: ποιῶ
  choice: роблю
  rationale: Простий теперішній час передає дії Ісуса в безпосередньому контексті без звуження до одноразової дії.
theological_decisions:
- issue: Значення ἐξουσία у відповіді Ісуса
  choice: влада
  alternative: право; повноваження; сила
  rationale: У суперечці йдеться не просто про здатність діяти, а про законну підставу та уповноваження Ісуса. «Влада» зберігає широкий юридичний і богословський зміст слова, не визначаючи наперед джерела цієї влади.
translation_notes:
  register: Сучасна стандартна українська; діалог викладено стисло, природно й гідно. Займенник «Він» написано з великої літери відповідно до поширеної української практики щодо Ісуса; синтаксис не перевантажено буквальним відтворенням грецького дієприкметника.
