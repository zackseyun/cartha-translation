translation:
  language: uk
  text: Тож учні пішли й зробили так, як звелів їм Ісус[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «наказав їм» чи «дав їм вказівки». Грецьке дієслово може означати віддати наказ або дати настанови; у цьому контексті можливі обидва відтінки.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθέντες
  choice: пішли
  rationale: Аористовий дієприкметник передає дію, що в оповіді передує або супроводжує основну; особова форма «пішли» природна для сучасної української.
- source_word: δὲ
  choice: Тож
  rationale: Частка позначає продовження оповіді та пов’язує вчинок учнів із попереднім дорученням Ісуса.
- source_word: οἱ μαθηταὶ
  choice: учні
  rationale: У Євангеліях це усталене й природне українське позначення послідовників Ісуса.
- source_word: ποιήσαντες
  choice: зробили
  rationale: Друга аористова дієприкметникова форма природно передається особовим дієсловом, узгодженим із «пішли».
- source_word: καθὼς
  choice: так, як
  rationale: Передає відповідність дій учнів вказівці Ісуса без додавання надмірного наголосу на точності.
- source_word: συνέταξεν
  choice: звелів
  rationale: Дієслово συντάσσω тут означає дати розпорядження або вказівки. «Звелів» стисло передає авторитетність доручення, а примітка зберігає м’якшу лексичну альтернативу.
- source_word: αὐτοῖς
  choice: їм
  rationale: Природний український давальний додаток при дієслові «звелів».
- source_word: ὁ Ἰησοῦς
  choice: Ісус
  rationale: Артикль при власному імені окремо українською не відтворюється.
