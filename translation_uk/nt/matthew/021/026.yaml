  text: ἐὰν δὲ εἴπωμεν· Ἐξ ἀνθρώπων, φοβούμεθα τὸν ὄχλον, πάντες γὰρ ⸂ὡς προφήτην ἔχουσιν τὸν Ἰωάννην⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/026.yaml
  text: But if we say[a], ‘From men,’ we fear the crowd, for they all regard John as a prophet.
translation:
  language: uk
  text: 'А якщо скажемо: «Від людей», — ми боїмося натовпу, адже всі вважають Івана пророком.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν δὲ εἴπωμεν
  choice: А якщо скажемо
  rationale: Конструкція ἐὰν з аористом кон’юнктива виражає можливу умову; українське «А якщо скажемо» природно передає хід їхнього міркування.
- source_word: Ἐξ ἀνθρώπων
  choice: Від людей
  rationale: Стисло зберігає контраст із «з неба» в попередньому вірші; йдеться про людське, а не божественне джерело.
- source_word: φοβούμεθα τὸν ὄχλον
  choice: боїмося натовпу
  rationale: Прямий і природний відповідник, що зберігає теперішній час та безпосередність їхнього страху.
- source_word: πάντες
  choice: всі
  rationale: Передає загальність переконання серед людей у натовпі без зайвого уточнення займенником.
- source_word: ὡς προφήτην ἔχουσιν τὸν Ἰωάννην
  choice: вважають Івана пророком
  rationale: Ідіома ἔχω з ὡς виражає ставлення або оцінку; «вважають … пророком» є природним сучасним українським відповідником.
- source_word: Ἰωάννην
  choice: Івана
  rationale: Ужито нормативну українську біблійну форму особового імені у знахідному відмінку.
theological_decisions:
- issue: Передача ἀνθρώπων у протиставленні небесного й людського джерела
  choice: Від людей
  alternative: Людського походження
  rationale: «Від людей» зберігає лаконічну форму та безпосередню антитезу до «з неба», не звужуючи значення до осіб чоловічої статі.
- issue: Характер ставлення натовпу до Івана
  choice: всі вважають Івана пророком
  alternative: усі визнають Івана за пророка
  rationale: Формулювання точно повідомляє про оцінку натовпу, не перетворюючи її на авторське богословське твердження і не додаючи висновків поза текстом.
translation_notes:
  register: Сучасна, природна й гідна українська мова. Репліку оформлено як продовження внутрішнього міркування релігійних провідників; збережено стислий контраст джерел влади.
