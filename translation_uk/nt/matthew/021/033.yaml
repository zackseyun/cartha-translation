  text: Ἄλλην παραβολὴν ἀκούσατε. ⸀Ἄνθρωπος ἦν οἰκοδεσπότης ὅστις ἐφύτευσεν ἀμπελῶνα καὶ φραγμὸν αὐτῷ περιέθηκεν καὶ ὤρυξεν ἐν αὐτῷ ληνὸν καὶ ᾠκοδόμησεν πύργον, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/033.yaml
  text: 'Listen to another parable: There was a landowner who planted a vineyard and put a fence around it and dug a winepress in it and built a tower[a], and leased it to tenant farmers[c][b], and went away.'
translation:
  language: uk
  text: Послухайте іншу притчу. Був один землевласник, який насадив виноградник, поставив навколо нього огорожу[b], викопав у ньому давильню для винограду, збудував башту[a], здав його виноградарям в оренду[c] і від’їхав.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Образи насадженого виноградника, огорожі, давильні для винограду й башти перегукуються з Ісаї 5:1–2.
    reason: cross_reference
  - marker: b
    text: Або «обвів його живоплотом». Грецьке слово може означати різну огороджувальну перешкоду, зокрема огорожу чи живопліт.
    reason: lexical_alternative
  - marker: c
    text: Або «здав його орендарям-землеробам». Ідеться про людей, які взяли виноградник в оренду й мали його обробляти.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἀκούσατε
  choice: Послухайте іншу притчу
  rationale: Аористовий наказовий спосіб множини ἀκούσατε природно передано прямим закликом «Послухайте», а παραβολή — усталеним і точним словом «притча».
- source_word: Ἄνθρωπος ἦν οἰκοδεσπότης
  choice: Був один землевласник
  rationale: οἰκοδεσπότης означає господаря дому чи маєтку; в контексті виноградника й орендарів «землевласник» природно передає його роль. Зворот «був один» відповідає оповідному вступу грецького речення.
- source_word: ἐφύτευσεν ἀμπελῶνα
  choice: насадив виноградник
  rationale: «Насадив виноградник» — природний український відповідник конкретного образу φυτεύω та ἀμπελών, який також зберігає відлуння Ісаї 5.
- source_word: φραγμὸν αὐτῷ περιέθηκεν
  choice: поставив навколо нього огорожу
  rationale: φραγμός позначає огорожу, паркан або живопліт. Загальне слово «огорожа» не уточнює матеріалу й точно передає функцію перешкоди навколо виноградника.
- source_word: ὤρυξεν ἐν αὐτῷ ληνὸν
  choice: викопав у ньому чавило
  rationale: ὀρύσσω означає «копати», а ληνός — споруду для вичавлювання винограду. «Чавило» є стислим традиційним українським біблійним терміном, зрозумілим із виноградарського контексту.
- source_word: ᾠκοδόμησεν πύργον
  choice: збудував башту
  rationale: πύργος буквально означає «башта». Її ймовірну сторожову функцію не внесено до основного тексту, бо грецьке слово прямо її не називає.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: здав його в оренду виноградарям
  rationale: Середній стан ἐκδίδωμι тут означає передачу в оренду, а γεωργοί — землероби, які обробляють виноградник. «Виноградарям» конкретизує заняття з контексту, тоді як «здав в оренду» ясно передає їхні орендні відносини з власником.
- source_word: ἀπεδήμησεν
  choice: від’їхав
  rationale: ἀποδημέω означає покинути місце проживання й вирушити в іншу місцевість. «Від’їхав» стисло передає це без додавання не названого в тексті місця призначення чи тривалості.
theological_decisions:
- issue: Міжтекстовий образ виноградника з Ісаї 5
  choice: Збережено конкретні сільськогосподарські образи, а зв’язок з Ісаї пояснено у примітці.
  alternative: Посилити алюзію архаїчнішою лексикою або прямо назвати пророцтво в основному тексті.
  rationale: Матвій виразно відтворює образи Ісаї 5:1–2, однак не називає цей уривок прямо. Тому переклад зберігає алюзію, не перетворюючи її на явне тлумачення.
- issue: Статус γεωργοί щодо виноградника
  choice: Відносини передано дієсловами «здав в оренду», а людей названо «виноградарями».
  alternative: Назвати їх «орендарями» або «землеробами».
  rationale: Грецьке γεωργοί саме по собі називає обробітників землі, тоді як орендний статус випливає з ἐξέδετο. Обраний вислів зберігає обидва аспекти, не ототожнюючи їх із найманими працівниками.
translation_notes:
  register: Сучасна нормативна українська мова з гідним оповідним звучанням. Синтаксис зберігає послідовність грецького переліку, але залишається природним. Термін «чавило» підтримує біблійно-аграрний образ; його значення зрозуміле з контексту виноградника.
