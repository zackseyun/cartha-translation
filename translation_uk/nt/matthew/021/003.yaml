source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμῖν εἴπῃ τι, ἐρεῖτε ὅτι Ὁ κύριος αὐτῶν χρείαν ἔχει· ⸀εὐθὺς δὲ ⸀ἀποστελεῖ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/003.yaml
  text: And if anyone says anything to you[a], you shall say[b], ‘The Lord has need of them,’ and he will send them at once.
translation:
  language: uk
  text: 'І якщо хтось вам щось скаже, скажіть: «Вони потрібні Господу[a], і він відразу пошле їх[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «господареві». Грецьке κύριος може означати як «Господь», так і «господар» чи «пан».
    reason: lexical_alternative
  - marker: b
    text: Суб’єкт у грецькому тексті не названий. Можливе розуміння, що йдеться про Господа; також його можуть пов’язувати з людиною, яка звернеться до учнів і пошле тварин.
    reason: referential_ambiguity
lexical_decisions:
- source_word: ἐάν τις
  choice: якщо хтось
  rationale: Передає невизначену умовну конструкцію природною сучасною українською мовою, не звужуючи кола можливих осіб.
- source_word: ὑμῖν
  choice: вам
  rationale: Форма давального відмінка множини звернена до учнів; українське «вам» виразно зберігає множину.
- source_word: εἴπῃ τι
  choice: щось скаже
  rationale: Дієслово λέγω з невизначеним τι охоплює будь-яке словесне зауваження чи запитання; переклад «запитає» був би надто вузьким.
- source_word: ἐρεῖτε
  choice: скажіть
  rationale: Майбутній індикатив тут має настановчий, фактично наказовий зміст; український наказовий спосіб передає його природно й чітко.
- source_word: ὅτι
  choice: двокрапка і пряма мова
  rationale: ὅτι вводить зміст відповіді; в українській це природно передається оформленням прямої мови без окремого сполучника.
- source_word: Ὁ κύριος
  choice: Господу
  rationale: «Господь» зберігає звичне титульне значення κύριος та можливу христологічну вагу; контекстуально можливе значення «господар» подано у примітці.
- source_word: αὐτῶν
  choice: вони / їх
  rationale: Займенник множини стосується двох тварин, згаданих у попередньому вірші. Конструкція «вони потрібні» природно відтворює цей зв’язок українською.
- source_word: χρείαν ἔχει
  choice: потрібні
  rationale: Українська конструкція «вони потрібні Господу» природно й точно передає грецьку ідіому «має потребу в них», уникаючи неприродної канцелярської форми.
- source_word: εὐθὺς
  choice: відразу
  rationale: Передає негайність дії сучасним нейтральним словом.
- source_word: ἀποστελεῖ αὐτούς
  choice: він ... пошле їх
  rationale: Зберігає основне значення ἀποστέλλω — «посилати» — без додавання невираженої в грецькому тексті думки про повернення чи звільнення. Займенник «він» залишає визначення суб’єкта залежним від контексту.
theological_decisions:
- issue: Значення і референт Ὁ κύριος
  choice: Господь
  alternative: господар
  rationale: Основний текст зберігає титул «Господь», що може стосуватися Ісуса й не послаблює богословської ваги вислову. Водночас κύριος може означати земного господаря, тому цю реальну лексичну можливість зазначено в примітці.
- issue: Суб’єкт дієслова ἀποστελεῖ
  choice: «він» — найімовірніше особа, яка звернулася до учнів
  alternative: «Він» — Господь
  rationale: У грецькому реченні суб’єкт прямо не названий. Найприродніше ним є щойно згаданий «хтось», який дозволить послати тварин, однак граматично можливе співвіднесення з «Господом»; переклад не підмінює цю неоднозначність поясненням у самому тексті.
translation_notes:
  register: Сучасна стандартна українська, ясна й гідна за тоном. Наказове «скажіть» природно передає настановчу силу майбутнього часу, а «вони потрібні Господу» уникає дослівної, але важчої конструкції «Господь має в них потребу». Справжню неоднозначність κύριος і неназваного суб’єкта ἀποστελεῖ збережено в примітках.
