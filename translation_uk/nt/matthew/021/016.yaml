source:
  edition: SBLGNT
  text: καὶ εἶπαν αὐτῷ· Ἀκούεις τί οὗτοι λέγουσιν; ὁ δὲ Ἰησοῦς λέγει αὐτοῖς· Ναί. οὐδέποτε ἀνέγνωτε ὅτι Ἐκ στόματος νηπίων καὶ θηλαζόντων κατηρτίσω αἶνον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/016.yaml
  text: And they said to him[a], “Do you hear what these are saying?” But Jesus says to them, “Yes. Have you never read, ‘Out of the mouth of infants and nursing babies you have prepared praise’?”
translation:
  language: uk
  text: 'І сказали Йому: «Ти чуєш, що це вони кажуть?» Ісус же каже їм: «Так. Невже ви ніколи не читали: “З уст немовлят і грудних дітей Ти приготував хвалу”?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ісус цитує Псалом 8:2 за грецькою традицією Писання. Єврейський текст часто перекладають: «З уст немовлят і грудних дітей Ти утвердив силу».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀκούεις
  choice: Ти чуєш
  rationale: Теперішній час у прямому запитанні; природно передає виклик, звернений до Ісуса.
- source_word: τί οὗτοι λέγουσιν
  choice: що вони кажуть
  rationale: Природна сучасна українська передача тривалої в цій ситуації дії; займенник не додає відсутнього в грецькому тексті іменника.
- source_word: λέγει
  choice: каже
  rationale: Збережено історичний теперішній час Матвія, який надає розповіді жвавості.
- source_word: Ναί
  choice: Так
  rationale: Пряма й природна передача простого ствердного слова.
- source_word: οὐδέποτε ἀνέγνωτε
  choice: Невже ви ніколи не читали
  rationale: Риторична конструкція «невже» природно передає докір і передбачувану обізнаність співрозмовників із Писанням.
- source_word: Ἐκ στόματος
  choice: З уст
  rationale: Формально точна й усталена українська біблійна конструкція; множина «уст» є природною в цьому цитатному стилі.
- source_word: νηπίων
  choice: немовлят
  rationale: Передає дуже малих дітей і не ототожнює цей іменник із наступним означенням тих, кого годують грудьми.
- source_word: θηλαζόντων
  choice: грудних дітей
  rationale: Сучасна, зрозуміла й гідна українська назва дітей, яких ще годують грудьми.
- source_word: κατηρτίσω
  choice: Ти приготував
  rationale: Передає грецьке значення приведення до готовності або влаштування, не замінюючи його єврейським формулюванням Псалма.
- source_word: αἶνον
  choice: хвалу
  rationale: Прямий відповідник абстрактного іменника «хвала».
theological_decisions:
- issue: Формулювання цитати з Псалма 8:2 у доводі Ісуса
  choice: 'У головному тексті передано грецьке формулювання Матвія: «Ти приготував хвалу»'
  alternative: 'Єврейський текст Псалма часто перекладають: «Ти утвердив силу»'
  rationale: Переклад має відтворювати цитату саме в тій формі, в якій її подає Матвій, не гармонізуючи її мовчки з єврейським текстом; відмінність збережено в примітці.
translation_notes:
  register: Сучасна стандартна українська мова з гідним біблійним звучанням. Історичний теперішній час у «каже» збережено. Риторичний докір передано через «Невже». Маркер примітки поставлено безпосередньо після цитати, якої вона стосується.
