- from: 'І сказали Йому: «Ти чуєш, що вони кажуть?» Ісус же каже їм: «Так. Невже ви ніколи не читали: “З уст немовлят і грудних дітей Ти приготував хвалу”?»[a]'
  to: 'І сказали Йому: «Ти чуєш, що це вони кажуть?» Ісус же каже їм: «Так. Невже ви ніколи не читали: “З уст немовлят і грудних дітей Ти приготував хвалу”?»[a]'
