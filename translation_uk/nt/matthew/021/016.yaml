  naturalness: Текст звучить природно сучасною стандартною українською і зберігає гідний біблійний регістр. Формула «грудних дітей» зрозуміла й стилістично прийнятна; «З уст» доречне в цитаті.
  terminology: «Немовлята», «грудні діти», «хвала» та «приготував» є точними відповідниками в цьому контексті. Примітка коректно пояснює відмінність між грецькою формою цитати в Матвія та поширеним перекладом єврейського тексту Псалма 8:2, не змішуючи їх у головному тексті.
