base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/013.yaml
  text: And he says to them[a], “It is written[b], ‘My house will be called a house of prayer,’ but you are making it a den of robbers.”
translation:
  language: uk
  text: 'І каже їм: «Написано[a]: “Мій дім буде названий домом молитви”, а ви робите з нього лігво розбійників[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ісус поєднує слова з Ісаї 56:7 та Єремії 7:11.
    reason: cross_reference
  - marker: b
    text: Або «бандитів». Грецьке слово може означати грабіжників або насильницьких розбійників.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: каже
  rationale: Збережено грецький історичний теперішній час, який надає розповіді жвавості й природно звучить українською.
- source_word: Γέγραπται
  choice: Написано
  rationale: Усталена українська формула введення цитати з Писання; передає результативне значення грецького перфекта й чинність написаного.
- source_word: οἶκός μου
  choice: Мій дім
  rationale: Буквально збережено «дім», а не звужено значення до «храм», щоб не втратити формулювання цитати з Ісаї 56:7.
- source_word: οἶκος προσευχῆς
  choice: домом молитви
  rationale: Природний український відповідник родового словосполучення, який зберігає впізнавану біблійну форму.
- source_word: κληθήσεται
  choice: буде названий
  rationale: Прямо передає майбутній час і пасивний стан грецького дієслова.
- source_word: ποιεῖτε
  choice: робите
  rationale: Теперішній час передає актуальну, триваючу дію без доданого тлумачення «перетворюєте».
- source_word: σπήλαιον
  choice: лігво
  rationale: У контексті йдеться не просто про природну печеру, а про схованку злочинців; «лігво» природно передає цей образ українською.
- source_word: λῃστῶν
  choice: розбійників
  rationale: Слово охоплює грабіжників і насильницьких розбійників; «розбійників» зберігає силу пророчого звинувачення та біблійний перегук.
theological_decisions:
- issue: Цитата зі Старого Завіту та алюзія на нього
  choice: Збережено впізнавані формулювання Ісаї 56:7 («Мій дім… домом молитви») та Єремії 7:11 («лігво розбійників»).
  alternative: Вільніше сучасне формулювання, яке послабило б міжтекстові зв’язки.
  rationale: Вислів Ісуса поєднує цитату й пророчу алюзію; їхня помітність важлива для богословської прозорості, не усуваючи напруження між призначенням Божого дому та поведінкою людей.
translation_notes:
  register: Сучасна нормативна українська мова з гідним біблійним звучанням. Історичний теперішній «каже» збережено; синтаксис близький до грецького, але природний для пересічного сучасного читача.
