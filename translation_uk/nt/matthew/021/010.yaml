  text: καὶ εἰσελθόντος αὐτοῦ εἰς Ἱεροσόλυμα ἐσείσθη πᾶσα ἡ πόλις λέγουσα· Τίς ἐστιν οὗτος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/010.yaml
  text: And when he entered Jerusalem[a], the whole city was stirred up, saying, “Who is this?”
translation:
  language: uk
  text: 'Коли Він увійшов до Єрусалима, усе місто сколихнулося[a] й заговорило: «Хто це?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «було потрясене». Грецьке дієслово може означати фізичне струшування, а тут описує сильне громадське збудження.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθόντος αὐτοῦ
  choice: Коли Він увійшов
  rationale: Генітив абсолютний природно передано підрядним реченням часу; це зберігає часовий зв’язок без уточнення, чи йдеться саме про одночасність або безпосередню наступність.
- source_word: Ἱεροσόλυμα
  choice: Єрусалима
  rationale: Усталена сучасна українська форма біблійної назви міста; знахідний відмінок після «до» передано родовим відповідно до української норми.
- source_word: ἐσείσθη
  choice: сколихнулося
  rationale: Дієслово σείω буквально пов’язане зі струшуванням, але тут метафорично описує сильне громадське збудження. «Сколихнулося» природно передає і образ, і контекстуальний зміст.
- source_word: πᾶσα ἡ πόλις
  choice: усе місто
  rationale: Природний український відповідник, що передає узагальнене охоплення мешканців міста.
- source_word: λέγουσα
  choice: й заговорило
  rationale: Дієприкметник узгоджений із «містом» і вводить його колективну реакцію. «Заговорило» природно передає початок поширених розмов, не замінюючи висловлювання тлумачним «запитувало».
- source_word: Τίς ἐστιν οὗτος;
  choice: Хто це?
  rationale: Стисле й природне відтворення прямого питання без додавання відсутнього в грецькому тексті слова «чоловік».
theological_decisions:
- issue: Буквальне чи переносне значення реакції міста
  choice: Передати ἐσείσθη метафорично як «сколихнулося».
  alternative: «було потрясене» або «затряслося»
  rationale: Контекст описує колективну реакцію на вхід Ісуса, а не фізичний землетрус. Водночас «сколихнулося» зберігає образ сильного струсу й не послаблює напруження оповіді.
translation_notes:
  register: Сучасна нормативна українська, природна й гідна оповідна мова. Займенник «Він» щодо Ісуса подано з великої літери згідно з поширеною українською біблійною традицією; грецький текст сам по собі не позначає такої графічної відмінності.
