revisions:
- from: 'Ісус каже їм: «Хіба ви ніколи не читали в Писаннях: “Камінь, який відкинули будівничі, — саме він став наріжним каменем[a]. Від Господа[b] це сталося, і воно дивовижне в наших очах”?»'
  to: 'Ісус каже їм: «Хіба ви ніколи не читали в Писаннях: “Камінь, який відкинули будівничі, — саме він став наріжним каменем[a]. Це сталося від Господа[b], і це дивовижне в наших очах”?»'
  rationale: Внесено лише безпечні стилістичні та термінологічні уточнення. «Це сталося від Господа, і це дивовижне» природно передає послідовність αὕτη ... καὶ ἔστιν θαυμαστή, не додаючи тлумачення. Примітку до архітектурного образу виправлено, щоб вона позначала камінь, а не абстрактну «верхівку».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:14:18Z'
review_pass:
  verdict: revise
  source_fidelity: Основний текст точно передає історичний теперішній Λέγει, риторичне Οὐδέποτε ἀνέγνωτε, образ каменя та наголос οὗτος. «Наріжний камінь» є обґрунтованим основним варіантом для κεφαλὴ γωνίας, а «від Господа» точно відтворює παρὰ κυρίου. У фінальній частині доцільно ясніше співвіднести «це» з подією, про яку йдеться в цитаті.
  naturalness: 'Текст загалом звучить природно в сучасній літературній українській і зберігає піднесений регістр біблійної цитати. Форму «воно дивовижне» краще замінити на «це дивовижне»: це природніше українською та чіткіше вказує на попередньо названу подію.'
  terminology: '«Писання», «будівничі», «наріжний камінь» і «Господь» ужито послідовно й доречно. Примітка a потребує корекції: «верхівка» не є точним архітектурним відповідником альтернативи «capstone»; «верхівний камінь» зберігає значення без штучного звуження.'
  issues:
