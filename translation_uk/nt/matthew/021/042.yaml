    rationale: «Верхівкою» називає не камінь, а його положення. Для можливої альтернативи до κεφαλὴ γωνίας точніше «верхівним каменем». Уточнення зберігає лексичну неоднозначність грецького вислову.
  - severity: low
    issue: Займенник «воно» в останній частині цитати стилістично нечіткий.
    rationale: Грецьке αὕτη стосується того, що сталося («це»). Повторення «це» в українській природніше й точніше пов’язує прикметник «дивовижне» з подією.
