id: MAT.21.42
reference: Matthew 21:42
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Λέγει αὐτοῖς ὁ Ἰησοῦς· Οὐδέποτε ἀνέγνωτε ἐν ταῖς γραφαῖς· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας· παρὰ κυρίου ἐγένετο αὕτη, καὶ ἔστιν θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/042.yaml
  text: 'Jesus said to them[a], “Have you never read in the Scriptures: ‘The stone that the builders rejected—this one has become the cornerstone. This came from the Lord[b], and it is marvelous in our eyes’?”'
translation:
  language: uk
  text: 'Ісус каже їм: «Хіба ви ніколи не читали в Писаннях: “Камінь, який відкинули будівничі, — саме він став наріжним каменем[a]. Це сталося від Господа[b], і це дивовижне в наших очах”?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «верхівним каменем»; буквально «головою кута».
    reason: lexical_alternative
  - marker: b
    text: Грецькою «від Господа»; у єврейському джерелі цієї цитати — «від ГОСПОДА» (YHWH).
    reason: alternative_reading
lexical_decisions:
- source_word: Λέγει
  choice: каже
  rationale: Збережено грецький історичний теперішній час; в українській оповіді він звучить природно й надає сцені безпосередності.
- source_word: Οὐδέποτε ἀνέγνωτε
  choice: Хіба ви ніколи не читали
  rationale: Форма риторичного запитання природно передає докір і наголос грецького Οὐδέποτε, не змінюючи змісту.
- source_word: ἐν ταῖς γραφαῖς
  choice: в Писаннях
  rationale: У контексті йдеться про священні писання Ізраїлю; усталена українська назва чітко передає це значення.
- source_word: Λίθον
  choice: Камінь
  rationale: Хоча в грецькому тексті немає артикля, цитата вказує на конкретний камінь; українська форма без додаткового означення природна в цьому поетичному рядку.
- source_word: ἀπεδοκίμασαν
  choice: відкинули
  rationale: Дієслово означає визнати непридатним і відкинути; «відкинули» стисло й точно зберігає цей зміст.
- source_word: οἱ οἰκοδομοῦντες
  choice: будівничі
  rationale: Субстантивований дієприкметник позначає тих, хто будує; «будівничі» зберігає образ і пасує до піднесеного стилю цитати.
- source_word: οὗτος
  choice: саме він
  rationale: Так передано виразний наголос вказівного займенника, що протиставляє відкинутий камінь його новому становищу.
- source_word: ἐγενήθη εἰς
  choice: став
  rationale: Українське «став» природно виражає перехід до нового становища без надмірного розгортання конструкції.
- source_word: κεφαλὴν γωνίας
  choice: наріжним каменем
  rationale: Це зрозумілий усталений відповідник образного вислову «голова кута»; можливе архітектурне розуміння як верхівки зазначено у примітці.
- source_word: παρὰ κυρίου
  choice: Від Господа
  rationale: Прийменник παρά з родовим відмінком виражає джерело або походження; «від Господа» формально й природно це передає.
- source_word: θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν
  choice: воно дивовижне в наших очах
  rationale: Збережено образний вислів оригіналу «в наших очах» і піднесене значення прикметника θαυμαστή.
theological_decisions:
- issue: Передача κύριος у цитаті з Псалма
  choice: Господь
  alternative: ГОСПОДЬ як відтворення тетраграми YHWH у єврейському джерелі цитати
  rationale: Основний текст перекладено безпосередньо з грецького κυρίου як «Господа». Водночас примітка прозоро вказує, що в єврейському тексті Псалма стоїть Боже ім’я YHWH.
- issue: Месіанське застосування образу каменя
  choice: Зберегти метафору без пояснювального додавання
  alternative: Прямо назвати камінь Месією або Ісусом
  rationale: У контексті Ісус застосовує цитату до себе, але сам наведений рядок не містить прямого ототожнення. Переклад зберігає висловлену в тексті метафору й не додає тлумачення.
translation_notes:
  register: Сучасна літературна українська з гідним, дещо піднесеним регістром біблійної цитати. Історичний теперішній «каже» збережено. Формулювання лишають образність і неоднозначність архітектурного терміна, а примітки подано саме біля відповідних слів.
