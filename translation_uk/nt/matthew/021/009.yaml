id: MAT.21.9
reference: Matthew 21:9
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι οἱ προάγοντες ⸀αὐτὸν καὶ οἱ ἀκολουθοῦντες ἔκραζον λέγοντες· Ὡσαννὰ τῷ υἱῷ Δαυίδ· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου· Ὡσαννὰ ἐν τοῖς ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/009.yaml
  text: And the crowds going ahead of him and those following were crying out[a], saying[c][b], “Hosanna to the Son of David! Blessed is the one who comes in the name of the Lord! Hosanna in the highest!”
translation:
  language: uk
  text: 'А натовпи, що йшли попереду Нього, і ті, що йшли слідом, вигукували: «Осанна Синові Давида![a] Благословенний Той, Хто приходить в ім’я Господа![b] Осанна у висотах!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Осанна» — вигук єврейського походження зі значенням приблизно «спаси, просимо» або «спаси нині»; тут він також звучить як вигук хвали. «Син Давида» — царський месіанський титул.
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: Ці слова перегукуються з Псалмом 118:26; у єврейському тексті Псалма «Господь» передає Боже ім’я YHWH.
    reason: cross_reference
lexical_decisions:
- source_word: οἱ ὄχλοι
  choice: натовпи
  rationale: Природний сучасний відповідник для груп людей у процесії; зберігає множину грецького тексту.
- source_word: οἱ προάγοντες αὐτὸν καὶ οἱ ἀκολουθοῦντες
  choice: що йшли попереду Нього, і ті, що йшли слідом
  rationale: Передає дві частини процесії, не створюючи враження, ніби перша група офіційно вела Ісуса.
- source_word: ἔκραζον λέγοντες
  choice: вигукували
  rationale: Недоконаний вид передає тривалу або повторювану дію, а окреме «кажучи» українською було б зайвим і неприродним.
- source_word: Ὡσαννά
  choice: Осанна
  rationale: Збережено усталену літургійну транслітерацію, оскільки тут слово функціонує як урочистий вигук; первісний благальний зміст пояснено в примітці.
- source_word: τῷ υἱῷ Δαυίδ
  choice: Синові Давида
  rationale: Давальний відмінок природно відповідає грецькому дативу й зберігає царський месіанський титул без парафразу.
- source_word: Εὐλογημένος ὁ ἐρχόμενος
  choice: Благословенний Той, Хто приходить
  rationale: Природно передає субстантивований дієприкметник однини та зберігає урочистий характер цитати.
- source_word: ἐν ὀνόματι κυρίου
  choice: в ім’я Господа
  rationale: Точний і усталений відповідник, який зберігає біблійний вислів та його значення уповноваження.
- source_word: ἐν τοῖς ὑψίστοις
  choice: у висотах
  rationale: Зберігає просторову й літургійну образність фрази, не конкретизуючи її понад грецький текст.
theological_decisions:
- issue: Месіанський царський титул τῷ υἱῷ Δαυίδ
  choice: Збережено «Синові Давида» як титул.
  alternative: «Месії»
  rationale: Грецький текст уживає саме давидівський титул; його збереження передає історичну й богословську фактуру, не підміняючи текст тлумаченням.
- issue: Значення Ὡσαννά
  choice: У тексті залишено «Осанна», а первісне значення пояснено в примітці.
  alternative: «Спаси нас, просимо» або «Спаси нині»
  rationale: У цьому контексті слово є не лише проханням про спасіння, а й усталеним урочистим вигуком; транслітерація зберігає обидва виміри.
- issue: κυρίου в цитаті з Псалма 118:26
  choice: Перекладено «Господа» відповідно до грецького κυρίου.
  alternative: Передати безпосередньо як особове Боже ім’я YHWH
  rationale: Безпосередній новозавітний текст містить κύριος, тоді як зв’язок із Божим ім’ям у єврейському тексті Псалма доречно відзначити в примітці.
translation_notes:
  register: Сучасна стандартна українська мова з урочистим, але зрозумілим біблійним звучанням. Уникнено неприродного буквального «вигукували, кажучи». Займенники й субстантивовані форми щодо Ісуса подано з великої літери відповідно до поширеної української біблійної практики.
