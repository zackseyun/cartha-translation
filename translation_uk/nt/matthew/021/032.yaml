source:
  edition: SBLGNT
  text: ἦλθεν γὰρ ⸂Ἰωάννης πρὸς ὑμᾶς⸃ ἐν ὁδῷ δικαιοσύνης, καὶ οὐκ ἐπιστεύσατε αὐτῷ· οἱ δὲ τελῶναι καὶ αἱ πόρναι ἐπίστευσαν αὐτῷ· ὑμεῖς δὲ ἰδόντες ⸀οὐδὲ μετεμελήθητε ὕστερον τοῦ πιστεῦσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/032.yaml
  text: For John came to you in the way of righteousness[a], and you did not believe him; but the tax collectors and the prostitutes believed him. But even after seeing this[c][b], you did not afterward change your minds so as to believe him.
translation:
  language: uk
  text: Бо Іван прийшов до вас шляхом праведності[a], та ви не повірили йому[b]; а митники й повії повірили йому. Ви ж, побачивши це, навіть згодом не змінили своєї думки[c], щоб повірити йому.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «праведним шляхом» чи «на шляху праведності». Грецький вислів може описувати праведний спосіб життя і служіння Івана або праведний шлях, який він проголошував.
    reason: lexical_alternative
  - marker: b
    text: Або «не довірилися йому». Грецьке дієслово може означати як вірити чиїмось словам, так і довіряти самій особі.
    reason: lexical_alternative
  - marker: c
    text: Або «не пошкодували» чи «не покаялися». Тут ужито не звичніше μετανοέω, а μεταμέλομαι, яке виразніше вказує на зміну думки, рішення або жаль.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν γὰρ
  choice: Бо … прийшов
  rationale: «Бо» передає пояснювальний зв’язок γὰρ із попередньою думкою, а «прийшов» природно відтворює аорист ἦλθεν.
- source_word: Ἰωάννης πρὸς ὑμᾶς
  choice: Іван прийшов до вас
  rationale: «Іван» — усталена українська форма імені; πρὸς з акузативом прямо передано як «до вас».
- source_word: ἐν ὁδῷ δικαιοσύνης
  choice: шляхом праведності
  rationale: Збережено метафору ὁδός і багатозначність вислову, який може стосуватися як праведного способу життя та служіння Івана, так і проголошеного ним шляху.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ / ἐπίστευσαν αὐτῷ
  choice: не повірили йому / повірили йому
  rationale: πιστεύω з давальним відмінком означає повірити особі або довіритися їй. Послідовний переклад зберігає контраст між двома реакціями.
- source_word: τελῶναι
  choice: митники
  rationale: Усталений і зрозумілий український відповідник для збирачів податків у римській системі.
- source_word: πόρναι
  choice: повії
  rationale: Прямий сучасний відповідник, що зберігає соціально-моральну силу грецького слова.
- source_word: ἰδόντες
  choice: побачивши це
  rationale: Дієприкметник передано обставиною попередньої дії; «це» природно вказує на щойно згадану віру митників і повій.
- source_word: οὐδὲ … ὕστερον
  choice: навіть згодом не
  rationale: Поєднання передає підсилене заперечення οὐδὲ та часовий зміст ὕστερον.
- source_word: μετεμελήθητε
  choice: змінили своєї думки
  rationale: Цей вислів точніше відбиває μεταμέλομαι як зміну рішення, думки або жаль, не ототожнюючи його без пояснення з більш звичним дієсловом μετανοέω.
- source_word: τοῦ πιστεῦσαι αὐτῷ
  choice: щоб повірити йому
  rationale: 'Конструкція передає наслідок або спрямованість зміни думки: вона мала привести до віри Іванові.'
theological_decisions:
- issue: Значення δικαιοσύνη
  choice: праведність
  alternative: справедливість
  rationale: У цьому матвіївському вислові йдеться ширше про відповідність Божій волі, тому «праведність» краще зберігає моральний і богословський зміст, не звужуючи його до суспільної справедливості.
- issue: Значення πιστεύω з αὐτῷ
  choice: повірити йому
  alternative: довіритися йому; увірувати в нього
  rationale: Текст описує реакцію на Івана та його звістку. «Повірити йому» зберігає граматичну форму й не вносить сильнішої формули «увірувати в нього», якої тут прямо немає.
- issue: Співвідношення μεταμέλομαι і покаяння
  choice: змінити свою думку
  alternative: покаятися; пошкодувати
  rationale: Переклад зберігає відмінність від μετανοέω та не вирішує наперед, чи наголос лежить на жалю, зміні рішення або повному покаянні; моральний напрям зміни вказано наступним «щоб повірити йому».
translation_notes:
  register: Сучасна стандартна українська мова, гідний і загальнозрозумілий біблійний регістр. Збережено риторичний контраст, повтор «повірили йому» та метафору шляху; уникнуто архаїзмів і конфесійно забарвлених уточнень.
