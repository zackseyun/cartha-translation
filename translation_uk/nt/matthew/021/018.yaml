  text: Early in the morning, as he was returning to the city, he became hungry.
translation:
  language: uk
  text: А рано-вранці, повертаючись до міста, він зголоднів.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρωῒ
  choice: вранці
  rationale: Прислівник позначає ранню частину дня; «вранці» природно й точно передає часову обставину без надмірного уточнення «рано-вранці».
- source_word: δὲ
  choice: А
  rationale: Слабкий сполучник продовжує розповідь; українське «А» природно позначає перехід до наступної події, не створюючи сильного протиставлення.
- source_word: ἐπανάγων
  choice: повертаючись
  rationale: 'Дієприкметник теперішнього часу описує дію, одночасну з головною: він був у процесі повернення.'
- source_word: εἰς τὴν πόλιν
  choice: до міста
  rationale: εἰς з акузативом виражає напрямок руху; «до міста» не стверджує, що він уже ввійшов у нього.
- source_word: ἐπείνασεν
  choice: зголоднів
  rationale: Аорист тут природно передає настання стану; «зголоднів» точніше за статичне «був голодний» і звучить сучасно.
theological_decisions:
- issue: Христологічний зміст згадки про голод Ісуса
  choice: Передати голод прямо як реальний людський досвід.
  alternative: Послабити подієвість формулюванням «був голодний» або додати доктринальне пояснення.
  rationale: Оповідь прямо засвідчує справжній голод Ісуса. Простий переклад зберігає свідчення про його справжню людськість, не додаючи до тексту богословського коментаря.
translation_notes:
  register: Сучасна стандартна українська, природний і гідний оповідний стиль. Займенник «він» подано з малої літери згідно зі звичайною практикою суцільного біблійного тексту. Переклад зберігає легкий сполучний відтінок δὲ через «А».
