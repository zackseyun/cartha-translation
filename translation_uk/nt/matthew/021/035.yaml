  text: καὶ λαβόντες οἱ γεωργοὶ τοὺς δούλους αὐτοῦ ὃν μὲν ἔδειραν, ὃν δὲ ἀπέκτειναν, ὃν δὲ ἐλιθοβόλησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/035.yaml
  text: And the tenant farmers took his servants; one they beat[a], another they killed, and another they stoned.
translation:
  language: uk
  text: 'І орендарі схопили його рабів[a]: одного побили, другого вбили, а третього побили камінням.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «слуг». Грецьке слово δοῦλοι може означати «рабів» або, залежно від контексту, «слуг».
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: орендарі
  rationale: У контексті притчі це люди, яким господар передав виноградник для обробітку; «орендарі» природно передає їхні договірні відносини з власником, а не лише сільськогосподарську працю.
- source_word: λαβόντες
  choice: схопили
  rationale: У подальшому контексті насильства «схопили» природно виражає фактичний зміст дієслова, не зберігаючи неприродної для української дієприкметникової конструкції.
- source_word: δούλους
  choice: рабів
  rationale: Основне значення δοῦλοι позначає залежних людей, що належать господареві й діють від його імені. «Рабів» зберігає цей соціальний статус; контекстуальну можливість «слуг» зазначено у примітці.
- source_word: ἔδειραν
  choice: побили
  rationale: Передає завдання ударів без надмірного уточнення способу чи знаряддя покарання.
- source_word: ἀπέκτειναν
  choice: вбили
  rationale: Прямий і природний відповідник, який не додає юридичної кваліфікації на кшталт «стратили» чи «вчинили вбивство».
- source_word: ἐλιθοβόλησαν
  choice: закидали камінням
  rationale: Ясно передає напад камінням, не стверджуючи понад текст, що ця дія неодмінно спричинила смерть.
- source_word: ὃν μὲν ... ὃν δὲ ... ὃν δὲ
  choice: одного ... другого ... а третього
  rationale: Природна українська розподільна конструкція, яка чітко показує різне поводження з трьома рабами.
theological_decisions:
- issue: Передача δοῦλος у притчі
  choice: рабів
  alternative: слуг
  rationale: «Рабів» точніше зберігає залежний статус посланців господаря, тоді як «слуг» можливе за функціональним значенням; альтернативу подано у примітці, щоб не усунути лексичну неоднозначність.
translation_notes:
  register: Сучасна, зрозуміла й гідна оповідна українська. Синтаксис стислий і ритмічний; «закидали камінням» зрозуміліше для широкого читача, ніж книжне «каменували».
