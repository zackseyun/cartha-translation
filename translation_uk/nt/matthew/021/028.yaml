  text: Τί δὲ ὑμῖν δοκεῖ; ἄνθρωπος εἶχεν τέκνα δύο. ⸀προσελθὼν τῷ πρώτῳ εἶπεν· Τέκνον, ὕπαγε σήμερον ἐργάζου ἐν τῷ ⸀ἀμπελῶνι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/028.yaml
  text: But what do you think? A man had two children. Going to the first[a], he said, ‘Child, go work today in the vineyard.’
translation:
  language: uk
  text: '«А як ви гадаєте? В одного чоловіка було двоє дітей[a]. Підійшовши до першої дитини, він сказав: “Дитино, іди сьогодні працювати у винограднику”».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «двох синів». Грецьке τέκνα буквально означає «дітей», не уточнюючи статі.'
    reason: 'Лексична альтернатива: поширений традиційний переклад звужує загальне грецьке слово до «синів».'
lexical_decisions:
- source_word: Τί δὲ ὑμῖν δοκεῖ;
  choice: А як ви гадаєте?
  rationale: Природно передає звернений до слухачів заклик висловити судження; «а» зберігає легку зв’язувально-протиставну силу δὲ.
- source_word: ἄνθρωπος
  choice: один чоловік
  rationale: У розповідному контексті йдеться про чоловіка, батька дітей; конструкція «В одного чоловіка було…» природна сучасною українською.
- source_word: τέκνα δύο
  choice: двоє дітей
  rationale: τέκνα є загальним словом «діти», а не спеціальним позначенням синів; збірний числівник «двоє» нормативно й природно сполучається з «дітей».
- source_word: προσελθὼν τῷ πρώτῳ
  choice: Підійшовши до першої дитини
  rationale: Дієприкметникова конструкція зберігає послідовність дій і однозначно вказує, що чоловік підійшов до першої з двох дітей.
- source_word: Τέκνον
  choice: Дитино
  rationale: Зберігає ширше значення τέκνον, не звужуючи його до «сину»; кличний відмінок відповідає прямому звертанню.
- source_word: ὕπαγε σήμερον ἐργάζου
  choice: іди сьогодні працювати
  rationale: Природна українська наказова конструкція, яка передає веління піти й працювати саме сьогодні без зайвого підсилення.
- source_word: ἐν τῷ ἀμπελῶνι
  choice: у винограднику
  rationale: Безпосередньо передає місце праці та зберігає образ виноградника.
theological_decisions:
- issue: Чи звужувати τέκνα / τέκνον до «сини / сину» відповідно до традиційного перекладу притчі
  choice: діти / Дитино
  alternative: сини / Сину
  rationale: У цьому вірші грецький текст уживає загальні τέκνα і τέκνον, а не υἱοί і υἱέ. Тому переклад зберігає ширше родинне позначення й не вносить конкретизації, якої тут прямо немає.
translation_notes:
  register: Сучасна нормативна українська з природним, але гідним оповідним звучанням. Звертання «Дитино» дещо урочистіше за побутову мову, проте точно відтворює широке значення грецького τέκνον. Лапки оформлено за українською видавничою практикою.
