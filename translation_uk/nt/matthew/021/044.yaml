revisions:
- from: І хто впаде на цей камінь, той розіб’ється; а на кого він упаде[a], того розчавить.[b]
  to: І[a] хто впаде на цей камінь, той розтрощиться; а на кого він упаде, того він розчавить[b].
  rationale: The revision strengthens the rendering of συνθλασθήσεται, clarifies the stone as the subject of λικμήσει in natural Ukrainian, and relocates the textual-variant anchor so that it scopes over the whole verse. It retains the source’s proverbial singular constructions, stone metaphor, and lexical distinction between severe breaking and pulverizing destruction.
