  text: ⸂Καὶ ὁ πεσὼν ἐπὶ τὸν λίθον τοῦτον συνθλασθήσεται· ἐφ’ ὃν δ’ ἂν πέσῃ λικμήσει αὐτόν.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/044.yaml
  text: And the one who falls on this stone will be broken to pieces[a]; but on whomever it falls[b], it will crush him.
translation:
  language: uk
  text: І[a] хто впаде на цей камінь, той розтрощиться; а на кого він упаде, того він розчавить[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Цей вірш відсутній у деяких рукописах Євангелія від Матвія, однак має паралель у Луки 20:18.
    reason: textual_variant
  - marker: b
    text: 'Або виразніше: «зітре на порох» чи «розвіє, мов полову».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πεσὼν
  choice: хто впаде… той
  rationale: Субстантивований дієприкметник має узагальнене особове значення. Українська співвідносна конструкція «хто… той» природно передає однину й афористичність вислову.
- source_word: ἐπὶ τὸν λίθον τοῦτον
  choice: на цей камінь
  rationale: Пряме просторове значення зберігає конкретний образ λίθος і зв’язок із контекстом про камінь.
- source_word: συνθλασθήσεται
  choice: розіб’ється
  rationale: Майбутній пасив описує сильне розбиття внаслідок падіння на камінь. Українське «розіб’ється» природне в цьому образі та не стирає відмінності від сильнішого λικμήσει.
- source_word: ἐφ’ ὃν δ’ ἂν πέσῃ
  choice: а на кого він упаде
  rationale: Конструкція з ἄν має невизначено-відносне значення; переклад прямо зберігає зміну напрямку удару, коли підметом падіння стає камінь. Займенник «він» граматично відсилає до «каменя».
- source_word: λικμήσει
  choice: розчавить
  rationale: Дієслово позначає нищівне подрібнення, аж до розпорошення. «Розчавить» ясно й сильно передає основний результат, а яскравіші можливі відтінки подано в примітці.
- source_word: αὐτόν
  choice: того
  rationale: Вказівне «того» природно співвідноситься з попереднім «на кого», зберігаючи особову однину без неприродного повтору займенника.
theological_decisions:
- issue: Образ каменя та метафора суду
  choice: Збережено конкретне слово «камінь» і два різні наслідки зіткнення без пояснювального ототожнення каменя в самому тексті вірша.
  alternative: Прямо назвати камінь Месією або Ісусом чи передати обидва дієслова одним загальним словом про знищення.
  rationale: Контекст пояснює образ, але сам вірш формулює його афористично. Переклад зберігає метафору, суворість суду й різницю між συνθλασθήσεται та λικμήσει, не додаючи богословського тлумачення.
- issue: Текстовий варіант щодо наявності вірша
  choice: Вірш подано в основному тексті, а його відсутність у частині рукописів зазначено в примітці.
  alternative: Вилучити вірш з основного тексту або не повідомляти про рукописну варіантність.
  rationale: SBLGNT позначає весь вірш як текстуально непевний; примітка чесно відображає зовнішні свідчення й паралель у Луки 20:18, не вирішуючи питання мовчки.
translation_notes:
  register: Сучасна нормативна українська мова з гідним, лаконічним і афористичним звучанням. Співвідносні конструкції «хто… той» і «на кого… того» роблять складний грецький синтаксис природним для широкого читача. Маркер текстологічної примітки поставлено після твердження про падіння каменя, а лексичної — після «розчавить».
