review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately preserves the two opposed movements of the image: a person falls on the stone, then the stone falls on a person. «Камінь», the generic relative constructions, and the distinction between the two outcomes are retained. However, «розіб’ється» can be weaker and less specific than συνθλασθήσεται (‘be broken/shattered to pieces’); «розтрощиться» better conveys the severe breaking while remaining distinct from λικμήσει. Making the stone explicit as the subject of the final verb removes a minor Ukrainian ambiguity without adding interpretation.'
  naturalness: The register is modern, idiomatic, and suitably terse. «Хто … той» and «на кого … того» are natural Ukrainian correlatives. Repeating «він» in the second clause is slightly more explicit but makes the syntactic subject unambiguous and reads smoothly.
  terminology: «Камінь» correctly corresponds to λίθος. «Розчавить» is an appropriate primary rendering of λικμήσει; the note properly preserves the stronger possible imagery of pulverizing or scattering. The textual-variant note is accurate and should be anchored to the verse as a whole, rather than appearing to qualify only the stone’s falling.
  issues:
  - severity: medium
    issue: «розіб’ється» is somewhat under-specific for συνθλασθήσεται.
    rationale: The Greek future passive denotes being severely broken or shattered. «Розтрощиться» gives the required force and preserves the lexical contrast with the more destructive λικμήσει.
  - severity: low
    issue: The textual-variant footnote marker is positioned after «упаде».
    rationale: The note concerns the presence or absence of the entire verse in Matthew, not merely the second clause. Moving its anchor to the beginning of the verse clearly signals its full-verse scope.
  - severity: low
    issue: The subject of «розчавить» is only implicit after the correlative construction.
    rationale: Although recoverable from «він упаде», explicitly repeating «він» makes clear that the stone, not the person, is the agent of the final action.
  revised_text: І[a] хто впаде на цей камінь, той розтрощиться; а на кого він упаде, того він розчавить[b].
