  text: Most of the crowd spread their garments on the road[b][a], and others were cutting branches from the trees and spreading them on the road.
translation:
  language: uk
  text: Більшість натовпу[a] розстелили свій одяг[b] на дорозі, а інші зрізували гілки з дерев і стелили їх на дорозі.
  philosophy: optimal-equivalence
  footnotes:
