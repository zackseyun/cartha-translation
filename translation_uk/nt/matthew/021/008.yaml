    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ πλεῖστος ὄχλος
  choice: Більшість людей у натовпі
  rationale: πλεῖστος із колективним ὄχλος означає більшу частину, тобто більшість натовпу. Додавання «людей» робить вислів природним українською, не змінюючи змісту; слабкий сполучник δέ не потребує окремого відтворення на початку речення.
- source_word: ἔστρωσαν
  choice: постелили
  rationale: 'Аорист передає завершену дію: люди поклали й розпростерли одяг на поверхні дороги. «Постелили» природно виражає цю дію українською.'
- source_word: ἑαυτῶν τὰ ἱμάτια
  choice: свій одяг
  rationale: Зворотний займенник ἑαυτῶν підкреслює, що це був їхній власний одяг; українське «свій» передає це стисло й природно. ἱμάτια — широке позначення одягу, часто верхнього.
- source_word: ἐν τῇ ὁδῷ
  choice: на дорозі
  rationale: У цьому фізичному контексті українське «на дорозі» природно передає розташування речей на поверхні шляху.
- source_word: ἄλλοι δὲ
  choice: а інші
  rationale: δέ вводить іншу групу та легке зіставлення дій; «а інші» точно й природно передає цей перехід.
- source_word: ἔκοπτον
  choice: зрізали
  rationale: Імперфект змальовує тривалу або повторювану дію в перебігу сцени; український недоконаний вид це зберігає. «Зрізали» краще пасує до відділення гілок від дерев, ніж «рубали».
- source_word: κλάδους ἀπὸ τῶν δένδρων
  choice: гілки з дерев
  rationale: Прямий і загальнозрозумілий відповідник без уточнення виду дерев, якого немає в грецькому тексті.
- source_word: καὶ ἐστρώννυον ἐν τῇ ὁδῷ
  choice: і стелили їх на дорозі
  rationale: Недоконаний вид «стелили» зберігає імперфект і показує дію в розвитку; займенник «їх» природно відсилає до гілок. Повтор «на дорозі» збережено відповідно до оригіналу.
