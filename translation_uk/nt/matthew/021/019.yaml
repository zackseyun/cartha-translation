source:
  edition: SBLGNT
  text: καὶ ἰδὼν συκῆν μίαν ἐπὶ τῆς ὁδοῦ ἦλθεν ἐπ’ αὐτήν, καὶ οὐδὲν εὗρεν ἐν αὐτῇ εἰ μὴ φύλλα μόνον, καὶ λέγει αὐτῇ· ⸀Μηκέτι ἐκ σοῦ καρπὸς γένηται εἰς τὸν αἰῶνα· καὶ ἐξηράνθη παραχρῆμα ἡ συκῆ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/019.yaml
  text: And seeing a fig tree by the road[a], he came up to it and found nothing on it except leaves alone. And he said to it, “May there no longer ever be fruit from you.” And the fig tree withered at once.
translation:
  language: uk
  text: 'Побачивши при дорозі одну смоківницю, Він підійшов до неї й не знайшов на ній нічого, крім самого листя. І сказав їй: «Нехай більше ніколи не буде від тебе плоду».[a] І смоківниця відразу всохла.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Нехай повік не буде від тебе плоду».'
    reason: Стилістичний варіант, що зберігає урочистий регістр і остаточну силу грецького вислову.
lexical_decisions:
- source_word: συκῆν μίαν
  choice: одну смоківницю
  rationale: Числівник μίαν передано явно як «одну»; українською це природно вводить у розповідь конкретне дерево, не обов’язково наголошуючи на його одиничності.
- source_word: ἐπὶ τῆς ὁδοῦ
  choice: при дорозі
  rationale: Зворот позначає розташування дерева біля дороги; «при дорозі» природно передає локативне значення.
- source_word: ἦλθεν ἐπ’ αὐτήν
  choice: підійшов до неї
  rationale: Передано рух у напрямку до дерева природним українським дієсловом.
- source_word: οὐδὲν εὗρεν ἐν αὐτῇ
  choice: не знайшов на ній нічого
  rationale: Для плодів і листя українська природно вживає «на дереві», хоча грецький прийменник буквально має значення «у».
- source_word: εἰ μὴ φύλλα μόνον
  choice: крім самого листя
  rationale: '«Самого» зберігає наголос μόνον: на дереві було лише листя й нічого більше.'
- source_word: λέγει αὐτῇ
  choice: сказав їй
  rationale: Історичний теперішній час згладжено минулим часом відповідно до природної української оповіді.
- source_word: Μηκέτι ... εἰς τὸν αἰῶνα
  choice: повік більше не
  rationale: Поєднання «більше не» та «повік» зберігає як припинення, виражене Μηκέτι, так і тривалу остаточність εἰς τὸν αἰῶνα.
- source_word: ἐκ σοῦ καρπὸς γένηται
  choice: не буде від тебе плоду
  rationale: Збережено грецький образ плоду, що походить «від» дерева, без переходу до більш тлумачного «не плодоноситимеш».
- source_word: ἐξηράνθη παραχρῆμα
  choice: відразу всохла
  rationale: «Всохла» природно описує дерево, а «відразу» точно передає негайність παραχρῆμα.
theological_decisions:
- issue: Сила Ісусового вислову до смоківниці
  choice: «Нехай повік більше не буде від тебе плоду»
  alternative: «Відтепер ти ніколи не приноситимеш плоду» або «Нехай більше ніколи не буде від тебе плоду»
  rationale: Форма γένηται у конструкції з Μηκέτι передає урочисте волевиявлення або присуд, а не лише нейтральне передбачення. Переклад зберігає цю силу й не додає до самого вірша символічного тлумачення події.
translation_notes:
  register: Сучасна літературна українська з гідним біблійним звучанням. Займенник «Він» ужито для ясного позначення Ісуса в окремо наведеному вірші. Конструкцію прокляття залишено дещо урочистою, щоб зберегти форму й напруження грецького вислову.
