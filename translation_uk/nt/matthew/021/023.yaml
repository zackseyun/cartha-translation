source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ ἱερὸν προσῆλθον αὐτῷ διδάσκοντι οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ λέγοντες· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; καὶ τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/023.yaml
  text: And when he came into the temple[a], the chief priests and the elders of the people came up to him while he was teaching and said, “By what authority are you doing these things? And who gave you this authority?”
translation:
  language: uk
  text: 'Коли Він увійшов до храму[a], під час Його навчання до Нього підійшли первосвященники та старійшини народу й запитали: «Якою владою Ти це робиш? І хто дав Тобі цю владу?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Грецьке ἱερόν означає весь храмовий комплекс або його подвір’я, а не лише внутрішню святиню.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: Коли Він увійшов
  rationale: Родовий абсолют має часовий відтінок; цей природний український відповідник передає послідовність подій, не уточнюючи її надмірно.
- source_word: ἱερὸν
  choice: до храму
  rationale: Ἱερόν означає весь храмовий комплекс, а не лише внутрішню святиню; звичне слово «храм» лишається читабельним, а точніше значення пояснено у примітці.
- source_word: προσῆλθον αὐτῷ
  choice: до Нього підійшли
  rationale: Передає фізичне наближення діячів природною сучасною українською мовою.
- source_word: διδάσκοντι
  choice: й навчав
  rationale: Дієприкметник теперішнього часу позначає дію, одночасну з наближенням керівників; сурядна конструкція природна українською і зберігає цей часовий зв’язок.
- source_word: οἱ ἀρχιερεῖς
  choice: первосвященники
  rationale: У множині слово позначає провідну священницьку верхівку, а не кількох одночасних носіїв єдиної первосвященницької посади; «первосвященники» є усталеним біблійним відповідником.
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: старійшини народу
  rationale: Точно й зрозуміло позначає визнаних провідників народу.
- source_word: Ἐν ποίᾳ ἐξουσίᾳ
  choice: Якою владою
  rationale: В українській біблійній мові ця конструкція природно виражає підставу й повноваження для дії та зберігає виклик законності Ісусових дій.
- source_word: ταῦτα ποιεῖς
  choice: Ти це робиш
  rationale: Передає теперішню дію в безпосередньому запитанні; однина «це» природна українською як узагальнене позначення сукупності згаданих дій.
- source_word: τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην
  choice: хто дав Тобі цю владу
  rationale: Простий минулий вид природно передає акт надання повноважень, не додаючи часових або богословських уточнень.
theological_decisions:
- issue: Значення ἐξουσία у виклику релігійних керівників
  choice: влада
  alternative: повноваження; право; сила
  rationale: Контекст стосується законної підстави та уповноваження Ісуса діяти й навчати у храмі, а не лише фізичної чи надприродної сили. «Влада» зберігає інституційний і богословський обсяг слова, не вирішуючи наперед питання про джерело цієї влади.
translation_notes:
  register: Сучасна стандартна українська з гідним оповідним тоном. Синтаксис спрощено до природної української послідовності без втрати одночасності дій. Займенники щодо Ісуса подано з великої літери відповідно до поширеної української біблійної традиції.
