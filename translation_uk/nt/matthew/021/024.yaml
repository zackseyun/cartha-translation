base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/024.yaml
  text: But Jesus answered them[a], “I also will ask you one question, which if you tell me, I also will tell you by what authority I do these things.”
translation:
  language: uk
  text: 'А Ісус відповів їм: «Я теж поставлю вам одне запитання[a]. Якщо ви дасте мені відповідь, то й я скажу вам, якою владою все це роблю».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «одну справу»; буквальніше — «одне слово». Грецький вислів λόγον ἕνα може означати запитання або справу, яку обговорюють.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: А Ісус відповів їм
  rationale: Дієприкметник ἀποκριθείς разом із εἶπεν природно передається одним дієсловом «відповів»; δέ тут позначає перехід із легким протиставленням, для чого в українській доречне «А».
- source_word: Ἐρωτήσω ὑμᾶς κἀγὼ
  choice: І Я поставлю вам
  rationale: Майбутній час ἐρωτήσω вводить зустрічне запитання, а κἀγώ підкреслює взаємність; українське «і Я» це зберігає.
- source_word: λόγον ἕνα
  choice: одне запитання
  rationale: Хоч λόγος буквально може означати «слово» або «справа», у цьому контексті йдеться про запитання, на яке співрозмовники мають відповісти.
- source_word: ὃν ἐὰν εἴπητέ μοι
  choice: Якщо ви дасте Мені відповідь
  rationale: Буквальне «якщо скажете Мені його» українською неприродне; у контексті λέγω означає дати запитувану відповідь, а умовність ἐάν збережена.
- source_word: κἀγὼ ὑμῖν ἐρῶ
  choice: то і Я скажу вам
  rationale: Конструкція з «то» природно виражає наслідок умови, а «і Я» зберігає повторний наголос κἀγώ на взаємності.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: якою владою
  rationale: ἐξουσία тут означає право або повноваження діяти; «якою владою» є природним українським відповідником і не звужує значення до людського дозволу.
- source_word: ταῦτα ποιῶ
  choice: це роблю
  rationale: Український збірний займенник «це» природно охоплює дії, на які вказує грецьке множинне ταῦτα, а простий теперішній час передає ποιῶ.
