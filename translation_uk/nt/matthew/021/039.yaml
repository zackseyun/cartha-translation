  text: І вони взяли його, вигнали з виноградника й убили.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβόντες
  choice: схопивши
  rationale: Аористовий дієприкметник передає дію, що передує наступним дієсловам. У цьому насильницькому контексті «схопивши» природно передає взяття особи, не додаючи окремого богословського тлумачення.
- source_word: ἐξέβαλον
  choice: викинули геть
  rationale: ἐκβάλλω тут означає силоміць видалити назовні. «Викинули геть» є природним сучасним відповідником і зберігає відчуття фізичного вигнання.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: із виноградника
  rationale: Конструкція позначає рух за межі виноградника; українське «геть із виноградника» чітко й природно передає цей напрямок.
- source_word: ἀμπελῶνος
  choice: виноградника
  rationale: ἀμπελών прямо означає виноградник; це точний і звичний відповідник у контексті притчі.
- source_word: ἀπέκτειναν
  choice: убили
  rationale: ἀποκτείνω означає вбити або позбавити життя. «Убили» є прямим відповідником без додаткового юридичного чи морального відтінку, який могли б привнести «стратили» або «замордували».
theological_decisions:
- issue: Послідовність вигнання та вбивства порівняно з паралельними оповідями
  choice: Син спочатку викинутий із виноградника, а потім убитий.
  alternative: Узгодити з Марком і Лукою, натякнувши, що його спершу вбили, а потім викинули.
  rationale: Грецький текст Матвія виразно подає послідовність ἐξέβαλον ... καὶ ἀπέκτειναν — «викинули ... й убили». Переклад зберігає власне формулювання Матвія і не гармонізує його з паралельними оповідями.
translation_notes:
  register: Сучасна стандартна українська мова; виклад стислий, природний і гідний. Сполучення «схопивши його, вони...» усуває можливу неясність підмета дієприкметника, а повтор займенника перед «викинули» підтримує зрозумілість. Порядок подій оригіналу збережено.
