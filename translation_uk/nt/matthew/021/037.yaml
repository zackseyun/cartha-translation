source:
  edition: SBLGNT
  text: ὕστερον δὲ ἀπέστειλεν πρὸς αὐτοὺς τὸν υἱὸν αὐτοῦ λέγων· Ἐντραπήσονται τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/037.yaml
  text: But later he sent his son to them[a], saying, ‘They will respect my son.’
translation:
  language: uk
  text: 'А згодом він послав до них свого сина, кажучи: «Мого сина вони пошанують».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Вони виявлять повагу до мого сина». Грецьке дієслово може означати виявляти повагу чи пошану, а в інших контекстах — соромитися.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: згодом
  rationale: Передає часову послідовність «пізніше, після того», не додаючи сильнішого значення «наостанок».
- source_word: δὲ
  choice: А
  rationale: Позначає м’який контраст і новий етап оповіді; українське «А» природно вводить посилення — після слуг посилають сина.
- source_word: ἀπέστειλεν
  choice: послав
  rationale: Прямий і природний відповідник дієслова «посилати», без додаткових технічних чи апостольських конотацій.
- source_word: πρὸς αὐτοὺς
  choice: до них
  rationale: Після дієслова посилання πρός із знахідним відмінком указує на напрямок до осіб.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: свого сина
  rationale: Зворотний присвійний займенник є природним українським відповідником і однозначно відносить сина до підмета.
- source_word: λέγων
  choice: кажучи
  rationale: Зберігає дієприкметникову конструкцію, яка вводить слова власника.
- source_word: Ἐντραπήσονται
  choice: пошанують
  rationale: У конструкції з прямим додатком дієслово означає виявити повагу або пошану. «Пошанують» природно передає цей зміст, тоді як можливий відтінок сорому зазначено у примітці.
- source_word: τὸν υἱόν μου
  choice: мого сина
  rationale: Природно передає прямий додаток і зберігає особистий, родинний характер очікування мовця.
theological_decisions:
- issue: Передача образу сина без надмірного христологічного витлумачення в самому перекладі
  choice: свого сина / мого сина
  alternative: Свого Сина / Мого Сина; свого улюбленого сина
  rationale: Грецький текст уживає звичайне υἱός без ἀγαπητός і без формальної ознаки титулу. Переклад зберігає образний рівень притчі, не заперечуючи його христологічного значення в ширшому контексті.
translation_notes:
  register: Сучасна літературна українська з гідним оповідним звучанням. Порядок слів у прямій мові («Мого сина вони пошанують») зберігає винесення грецького додатка наперед і природно наголошує на особі сина.
