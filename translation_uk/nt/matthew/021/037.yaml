  source_fidelity: «А згодом» adequately renders ὕστερον δέ as a temporal development with mild contrast. «Він послав до них свого сина» accurately represents ἀπέστειλεν πρὸς αὐτοὺς τὸν υἱὸν αὐτοῦ. The participial «кажучи» properly introduces the direct speech, and «Мого сина вони пошанують» faithfully conveys the future expectation and the object-fronting emphasis of Ἐντραπήσονται τὸν υἱόν μου.
