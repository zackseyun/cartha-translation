lexical_decisions:
- source_word: Τοῦτο
  choice: це
  rationale: Займенник середнього роду однини вказує на щойно описану подію загалом.
- source_word: δὲ
  choice: А
  rationale: Передає слабкий приєднувальний або продовжувальний зв’язок без надмірного протиставлення.
- source_word: γέγονεν
  choice: сталося
  rationale: Природно передає перфект γίνομαι у формулі здійснення пророцтва.
- source_word: ἵνα πληρωθῇ
  choice: щоб збулося
  rationale: Зберігає цільово-результативний відтінок ἵνα з пасивним кон’юнктивом і звучить природно сучасною українською.
- source_word: τὸ ῥηθὲν
  choice: сказане
  rationale: Субстантивований пасивний дієприкметник стисло й точно передано українським дієприкметником.
- source_word: διὰ τοῦ προφήτου
  choice: через пророка
  rationale: διά з родовим відмінком позначає посередництво; цей вислів зберігає образ пророка як посередника звістки.
- source_word: λέγοντος
  choice: який говорить
  rationale: Передає дієприкметник теперішнього часу, що вводить наступну цитату, не замінюючи його минулим часом.
theological_decisions:
- issue: Здійснення пророцтва і роль пророка
  choice: «збулося сказане через пророка»
  alternative: «збулося сказане пророком»
  rationale: Основний текст зберігає посередницький відтінок грецького διά з родовим відмінком і не зводить вислів лише до власних слів пророка.
- issue: Ціль чи результат у ἵνα
  choice: «щоб збулося»
  alternative: «і так збулося»
  rationale: «Щоб» зберігає властиву конструкції можливу цільову силу, водночас українською вона може охоплювати й відтінок результату; неоднозначність не усувається пояснювальним додаванням.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Збережено легкий сполучний відтінок δὲ словом «А» та формальне введення пророчої цитати.
