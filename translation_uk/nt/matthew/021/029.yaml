  text: But he answered[b][a], ‘I do not want to.’ But later he changed his mind and went.
translation:
  language: uk
  text: 'А він у відповідь сказав: «Не хочу». Та згодом передумав[a] і пішов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «пожалкував» чи «змінив своє рішення». Грецьке слово може означати жаль, який приводить до зміни подальших дій.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: у відповідь сказав
  rationale: Природно передає звичну грецьку оповідну формулу з дієприкметником, зберігаючи значення відповіді.
- source_word: Οὐ θέλω
  choice: Не хочу
  rationale: Безпосередньо й природно передає волевиявлення та особисту відмову; не посилює вислів до категоричного «не піду».
- source_word: ὕστερον
  choice: згодом
  rationale: Точно позначає наступний у часі момент і природно звучить у сучасній українській оповіді.
- source_word: μεταμεληθεὶς
  choice: передумав
  rationale: Передає зміну наміру, яка привела до іншої дії, водночас не звужуючи слово до суто богословського поняття покаяння.
- source_word: ἀπῆλθεν
  choice: пішов
  rationale: У контексті йдеться про те, що син пішов виконати прохання; коротке «пішов» природне й достатнє.
theological_decisions:
- issue: Передача μεταμεληθεὶς у контексті притчі
  choice: передумав
  alternative: пожалкував; розкаявся
  rationale: Грецьке слово може включати жаль, що веде до зміни поведінки. «Передумав» зберігає основний акцент на зміні рішення, не нав’язуючи спеціалізованого богословського значення «покаявся»; примітка засвідчує можливий відтінок жалю.
translation_notes:
  register: Сучасна, проста й гідна оповідна українська. Сполука «Та згодом» виразно передає протиставлення між первісною відмовою та наступним послухом; синтаксис природно розгортає грецький дієприкметник у особову форму.
