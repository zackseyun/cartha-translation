    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: коли … почули
  rationale: Аористовий дієприкметник природно передано підрядним реченням часу, зі збереженням послідовності дій.
- source_word: ἀρχιερεῖς
  choice: первосвященники
  rationale: Усталена українська назва старших представників священницького керівництва; форма множини тут не означає одночасного служіння кількох чинних первосвященників.
- source_word: Φαρισαῖοι
  choice: фарисеї
  rationale: Усталена українська передача назви юдейської релігійної групи.
- source_word: παραβολὰς
  choice: притчі
  rationale: Усталений і точний термін для образних оповідей та висловів Ісуса в синоптичній традиції.
- source_word: ἔγνωσαν
  choice: зрозуміли
  rationale: У цьому контексті аорист γινώσκω виражає розпізнавання або усвідомлення того, кого стосувалися притчі; «зрозуміли» звучить природно й точно.
- source_word: περὶ αὐτῶν
  choice: про них
  rationale: περί з родовим відмінком означає «про, стосовно»; переклад «проти них» був би сильнішим за безпосереднє лексичне значення.
- source_word: λέγει
  choice: говорить
  rationale: Історичний теперішній час у непрямій мові природно зберігається українським теперішнім «говорить», не змінюючи змісту.
theological_decisions:
- issue: Чи слід прямо зазначити, що притчі були спрямовані проти релігійних провідників
  choice: говорить про них
  alternative: говорить проти них
  rationale: Грецький вислів περὶ αὐτῶν прямо означає «про них». Контекст передбачає критичну спрямованість, однак основний текст не повинен посилювати значення прийменника.
translation_notes:
  register: Сучасна стандартна українська; виклад природний, стислий і гідний. Збережено традиційні біблійні терміни «первосвященники», «фарисеї» та «притчі». Займенники на позначення Ісуса подано з великої літери відповідно до поширеної української біблійної видавничої практики.
