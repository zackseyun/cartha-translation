  source_fidelity: Текст точно передає часову послідовність ἀκούσαντες—ἔγνωσαν, групи «первосвященники» й «фарисеї», «притчі» та нейтральне περὶ αὐτῶν («про них»). Для історичного теперішнього λέγει український минулий час у непрямій мові («говорив») точніше відтворює його функцію в минулому оповіданні, не змінюючи змісту.
