base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/007.yaml
  text: They brought the donkey and the colt[a], and put their cloaks on them, and he sat on them.
translation:
  language: uk
  text: Вони привели ослицю та осля, поклали на них свій верхній одяг, і Він сів на них.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «сів на одяг, покладений на тварин». У грецькому тексті вжито займенник множини, який тут може стосуватися тварин або одягу.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἤγαγον
  choice: привели
  rationale: Аорист ἄγω тут природно передає приведення тварин до Ісуса; «привели» є ясним і звичним у сучасній українській.
- source_word: τὴν ὄνον
  choice: ослицю
  rationale: Форма з артиклем жіночого роду в цьому контексті вказує на самицю осла; «ослиця» точно й природно відрізняє її від осляти.
- source_word: τὸν πῶλον
  choice: осля
  rationale: πῶλος означає молоду тварину, а в цьому контексті — молодого осла; «осля» є стислим і природним українським відповідником.
- source_word: ἐπέθηκαν ἐπ’ αὐτῶν τὰ ἱμάτια
  choice: поклали на них свій одяг
  rationale: ἱμάτια означає верхній одяг або одяг загалом. «Свій» природно відтворює контекстуальну належність одягу учням, а множинне «на них» зберігає вказівку на обох тварин.
- source_word: ἐπεκάθισεν ἐπάνω αὐτῶν
  choice: Він сів на нього
  rationale: Хоча αὐτῶν формально є множиною, у грецькій можливе співвіднесення з розкладеним одягом або всією описаною конструкцією. Буквальне українське «сів на них» майже неминуче означало б, що Ісус одночасно сів на двох тварин. «На нього» природно співвідноситься зі збірним іменником «одяг», а примітка прозоро засвідчує граматичну множину та неоднозначність оригіналу.
theological_decisions:
- issue: Референт кінцевого займенника αὐτῶν у καὶ ἐπεκάθισεν ἐπάνω αὐτῶν
  choice: 'У тексті: «Він сів на нього», тобто на покладений одяг; у примітці збережено буквальну множину й синтаксичну неоднозначність.'
  alternative: 'Буквально: «Він сів на них», що може стосуватися тварин або одягу.'
  rationale: Це синтаксична й оповідна, а не доктринальна неоднозначність. Український займенник множини після згадки двох тварин надто сильно нав’язував би неприродне розуміння, ніби Ісус сидів на обох. Основний текст передає найімовірніший предмет сидіння — одяг, а примітка не приховує форми та можливих референтів грецького тексту.
translation_notes:
  register: Сучасна, зрозуміла й гідна оповідна українська. «Ослиця та осля» точно відтворює пару тварин; «одяг» ужито як природний збірний відповідник ἱμάτια. Велику літеру в займеннику «Він» ужито щодо Ісуса відповідно до поширеної української біблійної практики.
