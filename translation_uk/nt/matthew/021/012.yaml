    issue: Неоднозначне «хто продавав і купував».
    rationale: В українській це може читатися як характеристика одних і тих самих людей. «Продавців і покупців» прямо й природно передає дві субстантивовані дієприкметникові групи τοὺς πωλοῦντας καὶ ἀγοράζοντας.
  - severity: low
    issue: Неприродний початок «І ввійшов Ісус» і дещо розмовне «поперекидав».
    rationale: Нормальний порядок «Ісус увійшов» та нейтральне «перекинув» зберігають зміст і краще відповідають сучасній стандартній українській.
  - severity: low
    issue: Формулювання примітки частково повторює обраний вислів і стоїть після другого, узагальненого «у храмі».
    rationale: Якір біля «територію храму» чіткіше вказує, яке слово пояснюється; альтернативи мають відрізнятися від основного перекладу.
