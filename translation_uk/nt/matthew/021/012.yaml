  text: Καὶ εἰσῆλθεν ⸀Ἰησοῦς εἰς τὸ ⸀ἱερόν, καὶ ἐξέβαλεν πάντας τοὺς πωλοῦντας καὶ ἀγοράζοντας ἐν τῷ ἱερῷ καὶ τὰς τραπέζας τῶν κολλυβιστῶν κατέστρεψεν καὶ τὰς καθέδρας τῶν πωλούντων τὰς περιστεράς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/012.yaml
  text: And Jesus entered the temple courts and drove out all those selling and buying in the temple courts[a], and he overturned the tables of the money changers and the seats of those selling doves.
translation:
  language: uk
  text: Ісус увійшов на територію храму[a] й вигнав звідти всіх продавців і покупців, перекинув столи міняйл і стільці тих, хто продавав голубів.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «у храм» чи «до храмового комплексу»; грецьке слово означає весь храмовий комплекс, а не лише внутрішнє святилище.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερόν
  choice: територія храму / у храмі
  rationale: Грецьке слово означає ширший храмовий комплекс, а не саме внутрішнє святилище (ναός). «Територія храму» виразно передає просторовий зміст; при повторі природне «у храмі» супроводжується приміткою.
- source_word: ἐξέβαλεν
  choice: вигнав
  rationale: Передає рішуче, силове усунення людей і природно звучить сучасною українською.
- source_word: πάντας
  choice: усіх
  rationale: Експліцитно зберігає повний обсяг означення в грецькому тексті.
- source_word: τοὺς πωλοῦντας καὶ ἀγοράζοντας
  choice: хто продавав і купував
  rationale: Природно передає субстантивовані дієприкметники та людей, зайнятих цими діями.
- source_word: τράπεζας
  choice: столи
  rationale: Зберігає звичайне значення іменника без зайвого контекстуального уточнення.
- source_word: κολλυβιστῶν
  choice: міняйл
  rationale: Усталене й зрозуміле українське позначення людей, які обмінюють гроші.
- source_word: κατέστρεψεν
  choice: поперекидав
  rationale: У контексті описує перевертання кількох столів і передає енергійність дії, не стверджуючи їх знищення.
- source_word: καθέδρας
  choice: сидіння
  rationale: Точно й достатньо широко передає назву предметів, на яких сиділи продавці.
- source_word: περιστεράς
  choice: голубів
  rationale: Звичний український відповідник, доречний у контексті жертовних птахів.
theological_decisions:
- issue: Просторовий обсяг ἱερόν у розповіді про дію Ісуса
  choice: Ісус увійшов на територію храмового комплексу, а не до внутрішнього святилища.
  alternative: Узагальнене «Ісус увійшов у храм» без просторового уточнення.
  rationale: Лексичне розрізнення між ἱερόν і ναός має історико-просторове значення. Обраний переклад не створює враження, ніби Ісус увійшов до самого святилища.
translation_notes:
  register: Сучасна стандартна українська, гідний оповідний стиль. Синтаксис зберігає послідовність грецького речення, але уникає неприродних кальок. «Поперекидав» передає множинність об’єктів і жвавість дії.
