review_pass:
  verdict: revise
  source_fidelity: 'Зміст передано загалом точно: ἱερόν належно розуміється як храмовий комплекс, ἐξέβαλεν — як рішуче вигнання, а κατέστρεψεν — як перевертання столів і сидінь. Проте «хто продавав і купував» може ненавмисно означати тих самих осіб, що робили обидві дії; грецьке формулювання охоплює дві групи — продавців і покупців.'
  naturalness: Початковий порядок слів «І ввійшов Ісус» дещо наслідує грецький синтаксис. «Поперекидав» зрозуміле, але має розмовно-експресивний відтінок; нейтральне «перекинув» краще відповідає гідному сучасному оповідному регістру. «Стільці» в цьому конкретному контексті природніше й ясніше за «сидіння».
  terminology: «Територія храму» влучно передає ἱερόν без ототожнення його з внутрішнім святилищем. «Міняйли» та «голуби» є усталеними й доречними відповідниками. Примітку слід прив’язати до першої появи цього поняття та подати реальні альтернативи до обраного формулювання.
  issues:
