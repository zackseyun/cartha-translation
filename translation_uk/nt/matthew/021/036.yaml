  source_fidelity: The draft accurately renders πάλιν, ἀπέστειλεν, ἄλλους δούλους, and the anaphoric sense of ἐποίησαν αὐτοῖς ὡσαύτως. However, «більше, ніж першого разу» compares the later sending with an occasion (“the first time”), whereas πλείονας τῶν πρώτων compares the number of later servants with the first group of servants.
