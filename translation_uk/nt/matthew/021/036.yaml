  text: πάλιν ἀπέστειλεν ἄλλους δούλους πλείονας τῶν πρώτων, καὶ ἐποίησαν αὐτοῖς ὡσαύτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/036.yaml
  text: Again he sent other servants[a], more than the first ones, and they did the same to them.
translation:
  language: uk
  text: Він знову послав інших слуг[a] — більше, ніж перших, — а з ними вчинили так само.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «рабів». Грецьке слово δοῦλος залежно від контексту може означати «слуга» або «раб».
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: знову
  rationale: Природно й стисло позначає повторення дії в розповіді.
- source_word: ἀπέστειλεν
  choice: послав
  rationale: Прямий наративний відповідник аориста ἀποστέλλω; додаткове «відправив» тут не потрібне.
- source_word: ἄλλους δούλους
  choice: інших слуг
  rationale: У контексті притчі ці люди виступають як посланці господаря; «слуг» природно передає цю роль, тоді як можливий відтінок невільницького статусу зазначено у примітці.
- source_word: πλείονας τῶν πρώτων
  choice: більше, ніж першого разу
  rationale: Конструкція порівнює чисельність другої групи з першою. Українське формулювання природно й недвозначно передає, що цього разу було послано більше слуг.
- source_word: ἐποίησαν αὐτοῖς ὡσαύτως
  choice: і з ними вчинили так само
  rationale: Ідіоматично передає дію щодо слуг і зберігає відсилання до поводження з попередньою групою у попередньому вірші.
theological_decisions:
- issue: Передача δοῦλος у притчі
  choice: слуг
  alternative: рабів
  rationale: Наголос у цьому контексті стоїть на ролі посланців господаря та на поводженні з ними, а не на їхньому юридичному статусі. Варіант «рабів» залишається лексично можливим і поданий у примітці.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська оповідна мова. Зворот «з ними вчинили так само» природно відсилає до насильства над першими слугами, не повторюючи деталей попереднього вірша.
