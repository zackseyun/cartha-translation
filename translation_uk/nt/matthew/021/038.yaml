base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/038.yaml
  text: But when the tenant farmers saw the son[a], they said among themselves, ‘This is the heir. Come, let us kill him and seize his inheritance.’
translation:
  language: uk
  text: 'А виноградарі, побачивши сина, сказали між собою: «Це спадкоємець. Ходімо, вб’ємо його й заволодіємо[a] його спадщиною».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальніше: «матимемо його спадщину»; у цьому контексті йдеться про те, щоб заволодіти нею.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: виноградарі
  rationale: У контексті притчі це орендарі, які обробляють виноградник; «виноградарі» природно передає їхню працю й узгоджується з найближчим контекстом, хоча сам іменник може ширше означати землеробів.
- source_word: ἰδόντες
  choice: побачивши
  rationale: Дієприкметник аориста передає дію, що передує їхнім словам; український дієприслівник стисло й природно зберігає цю послідовність.
- source_word: τὸν υἱὸν
  choice: сина
  rationale: Грецький текст не містить тут вираженого присвійного займенника; зв’язок із господарем зрозумілий із контексту.
- source_word: ἐν ἑαυτοῖς
  choice: між собою
  rationale: Фраза означає розмову всередині їхньої групи; це природний сучасний український відповідник.
- source_word: κληρονόμος
  choice: спадкоємець
  rationale: Звичний український відповідник із чітким юридичним значенням успадкування.
- source_word: δεῦτε
  choice: ходімо
  rationale: Слово вводить спільне спонукання до дії; «ходімо» природно поєднується з подальшим «вб’ємо».
- source_word: ἀποκτείνωμεν
  choice: вб’ємо
  rationale: Спонукальний кон’юнктив передано формою спільної пропозиції; «вб’ємо» не додає судово-правового чи окремо наголошеного морального відтінку.
- source_word: σχῶμεν
  choice: заволодіємо
  rationale: Буквально дієслово пов’язане зі значенням «мати», але в контексті вбивства спадкоємця йдеться про набуття спадщини для себе; «заволодіємо» передає цю контекстуальну силу.
- source_word: κληρονομίαν αὐτοῦ
  choice: його спадщиною
  rationale: «Спадщина» прямо відповідає κληρονομία, а «його» відтворює αὐτοῦ та зберігає логіку задуму виноградарів.
theological_decisions:
- issue: Притчеве значення сина
  choice: Залишити «сина» на рівні самої розповіді, не називаючи його прямо Ісусом.
  alternative: Додати в переклад явну вказівку, що син представляє Ісуса.
  rationale: У ширшому контексті Євангелія притча вказує на Ісуса, однак цей вірш формулює думку на рівні притчі. Просте «сина» зберігає богословську напругу й не вносить тлумачення в основний текст.
translation_notes:
  register: Сучасна літературна українська мова, зрозуміла широкому читачеві, зі стислим і гідним притчевим стилем. Апостроф у «вб’ємо» подано за чинним українським правописом.
