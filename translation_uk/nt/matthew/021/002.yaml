  yaml_path: translation/nt/matthew/021/002.yaml
  text: saying to them[a], “Go into the village opposite you, and immediately you will find a donkey tied, and a colt with her[c][b]. Untie them and bring them to me.”
translation:
  language: uk
  text: 'кажучи їм: «Ідіть у село, що навпроти вас, і відразу знайдете прив’язану ослицю та з нею осля[a]. Відв’яжіть їх і приведіть до Мене».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «молодого віслюка».
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: кажучи їм
  rationale: Дієприкметникова конструкція природно продовжує попередній контекст і близько передає грецьку форму.
- source_word: Πορεύεσθε
  choice: Ідіть
  rationale: Звичний і природний відповідник наказового способу πορεύομαι в оповідному контексті.
- source_word: κώμην
  choice: село
  rationale: κώμη позначає невелике поселення, на відміну від міста; «село» є ясним сучасним відповідником.
- source_word: κατέναντι ὑμῶν
  choice: що навпроти вас
  rationale: Передає просторове значення поселення, розташованого прямо перед учнями або на протилежному боці.
- source_word: εὐθέως
  choice: відразу
  rationale: Природний сучасний відповідник зі збереженням значення негайності.
- source_word: ὄνον δεδεμένην
  choice: прив’язану ослицю
  rationale: Жіночий рід дієприкметника δεδεμένην показує, що йдеться про самицю; українське «ослиця» виразно зберігає цю граматичну інформацію.
- source_word: πῶλον
  choice: осля
  rationale: У цьому контексті πῶλος означає молодого віслюка; «осля» точно й стисло передає вид тварини та її молодий вік.
- source_word: μετ’ αὐτῆς
  choice: з нею
  rationale: Зберігає жіночий займенник, що стосується ослиці, і природно передає спільне перебування тварин.
- source_word: λύσαντες
  choice: Відв’яжіть їх
  rationale: Аористовий дієприкметник позначає дію, яка передує наказу ἀγάγετε; в сучасній українській послідовність природно передається двома однорідними наказами.
- source_word: ἀγάγετέ μοι
  choice: приведіть до Мене
  rationale: Для живих тварин «приведіть» природніше за «принесіть» і точно передає спрямовану до Ісуса дію.
theological_decisions: []
translation_notes:
  register: Сучасна нормативна українська мова з гідним оповідним тоном. Збережено структуру вступного дієприкметника, жіночий рід назви дорослої тварини та послідовність двох наказових дій; рідкісне, але зрозуміле слово «осля» пояснено у примітці.
