source:
  edition: SBLGNT
  text: τὸ βάπτισμα ⸀τὸ Ἰωάννου πόθεν ἦν; ἐξ οὐρανοῦ ἢ ἐξ ἀνθρώπων; οἱ δὲ διελογίζοντο ⸀ἐν ἑαυτοῖς λέγοντες· Ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ ἡμῖν· Διὰ τί οὖν οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/025.yaml
  text: The baptism of John—from where was it? From heaven or from men? And they were reasoning among themselves[a], saying, “If we say, ‘From heaven,’ he will say to us[b], ‘Why then did you not believe him?’”
translation:
  language: uk
  text: 'Іванове хрещення — звідки воно походило: з неба[a] чи від людей[b]? Вони ж міркували між собою, кажучи: «Якщо скажемо: “З неба”, — він скаже нам: “Чому ж ви не повірили йому?”»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «від Бога»; грецьке «з неба» — шанобливий спосіб указати на божественне походження.'
    reason: lexical_alternative
  - marker: b
    text: Тобто від людей, суто людського походження, на противагу небесному походженню.
    reason: lexical_clarification
lexical_decisions:
- source_word: τὸ βάπτισμα τὸ Ἰωάννου
  choice: Іванове хрещення
  rationale: Передає усталене значення βάπτισμα як обряду та служіння хрещення, пов’язаного з Іваном; присвійна форма природна для сучасної української.
- source_word: πόθεν ἦν
  choice: звідки воно було
  rationale: Питання стосується джерела й походження Іванового хрещення; займенник «воно» чітко відсилає до хрещення.
- source_word: ἐξ οὐρανοῦ
  choice: з неба
  rationale: Буквально зберігає грецький вислів і його шанобливе позначення божественного походження та уповноваження.
- source_word: ἐξ ἀνθρώπων
  choice: від людей
  rationale: ἀνθρώπων означає людей загалом, а не лише чоловіків; «від людей» природно виражає людське походження на противагу небесному.
- source_word: διελογίζοντο ἐν ἑαυτοῖς
  choice: міркували між собою
  rationale: Передає тривале спільне обдумування й обговорення, виражене імперфектом і зворотом ἐν ἑαυτοῖς.
- source_word: Ἐὰν εἴπωμεν
  choice: Якщо скажемо
  rationale: Природний український відповідник умовної конструкції з аористом кон’юнктива.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: ви не повірили йому
  rationale: πιστεύω з давальним тут означає визнати правдивість слів і авторитет особи; «повірити йому» точно й природно передає цей зміст.
theological_decisions:
- issue: Значення вислову «з неба»
  choice: Зберегти в основному тексті буквальне «з неба».
  alternative: «від Бога»
  rationale: «З неба» є шанобливим способом вказати на божественне походження або уповноваження. Буквальний вислів зберігає образність і не підмінює її тлумаченням.
- issue: Протиставлення небесного та людського походження
  choice: Передати ἐξ ἀνθρώπων як «від людей».
  alternative: «від чоловіків»
  rationale: У цьому контексті йдеться про людське походження загалом, а не про стать; «від людей» точно зберігає богословське протиставлення.
translation_notes:
  register: Сучасна літературна українська з гідним біблійним звучанням. Ужито «Іванове хрещення» як природний і стислий відповідник грецької генітивної конструкції; пряму мову оформлено за сучасними українськими нормами.
