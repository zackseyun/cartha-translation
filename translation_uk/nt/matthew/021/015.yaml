id: MAT.21.15
reference: Matthew 21:15
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς τὰ θαυμάσια ἃ ἐποίησεν καὶ τοὺς παῖδας ⸀τοὺς κράζοντας ἐν τῷ ἱερῷ καὶ λέγοντας· Ὡσαννὰ τῷ υἱῷ Δαυίδ ἠγανάκτησαν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/015.yaml
  text: But when the chief priests and the scribes saw the wonderful things that he did[a], and the children crying out in the temple and saying[b], “Hosanna to the Son of David,” they were indignant.
translation:
  language: uk
  text: 'Та коли первосвященники й книжники побачили дивовижні діла, які він учинив, і дітей, що вигукували в храмі[a]: «Осанна Синові Давидовому!»[b] — вони обурилися.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Грецьке ἱερόν означає весь храмовий комплекс або його подвір’я, а не лише внутрішнє святилище.
    reason: cultural_note
  - marker: b
    text: «Осанна» — акламація єврейського походження зі значенням приблизно «Спаси, благаємо!» або «Спаси тепер!». На той час вона також уживалася як вигук хвали.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: коли ... побачили
  rationale: Аористовий дієприкметник задає обставину головної дії; підрядна конструкція природно передає часовий зв’язок українською.
- source_word: δὲ
  choice: Та
  rationale: Передає м’який контраст із попередньою сценою без надмірно різкого протиставлення.
- source_word: ἀρχιερεῖς
  choice: первосвященники
  rationale: У множині йдеться про провідних представників священницької влади, а не лише про одного чинного первосвященника.
- source_word: γραμματεῖς
  choice: книжники
  rationale: Усталений прямий відповідник для знавців і тлумачів Писання; не додає пояснення, якого немає в тексті.
- source_word: τὰ θαυμάσια
  choice: дивовижні діла
  rationale: Субстантивований прикметник означає визначні, гідні подиву вчинки; цей варіант не звужує значення винятково до чудес.
- source_word: ἐποίησεν
  choice: він учинив
  rationale: Природно поєднується з «діла» й передає просту аористову дію.
- source_word: παῖδας
  choice: дітей
  rationale: У цьому контексті найімовірніше значення — діти; «слуги» контекстуально малоймовірне, а «хлопці» невиправдано звужує стать.
- source_word: κράζοντας ... καὶ λέγοντας
  choice: що вигукували ...
  rationale: Дієслово «вигукували» передає гучну публічну акламацію, а двокрапка й пряма мова природно виражають зміст λέγοντας без важкого «вигукуючи й кажучи».
- source_word: ἐν τῷ ἱερῷ
  choice: у храмі
  rationale: Природний український відповідник; ширше значення всього храмового комплексу уточнене в примітці.
- source_word: Ὡσαννὰ
  choice: Осанна
  rationale: Збережено усталену літургійну акламацію, що водночас походить від прохання про спасіння; обидва відтінки пояснено в примітці.
- source_word: τῷ υἱῷ Δαυίδ
  choice: Синові Давидовому
  rationale: Давальний відмінок природно відповідає грецькому дативу, а буквальний титул зберігає його месіанське значення.
- source_word: ἠγανάκτησαν
  choice: вони обурилися
  rationale: Точно передає сильне невдоволення та обурення релігійних провідників.
theological_decisions:
- issue: Месіанське значення вислову «Син Давидів»
  choice: Синові Давидовому
  alternative: Давидовому нащадкові
  rationale: Буквально збережено впізнаваний у Матвія месіанський титул, не послаблюючи його переказом.
- issue: Значення Ὡσαννά
  choice: Осанна в основному тексті з поясненням у примітці
  alternative: Спаси ж! / Спаси тепер!
  rationale: У цьому контексті вислів одночасно зберігає походження від благання про спасіння та функціонує як акламація хвали; транслітерація не усуває цієї напруги.
translation_notes:
  register: Сучасна нормативна українська мова з урочистим, але доступним біблійним звучанням. Синтаксис зберігає наростання переліку до головної реакції «вони обурилися». Займенник «він» подано з малої літери відповідно до нейтральної сучасної норми й без внесення конфесійної графічної традиції.
