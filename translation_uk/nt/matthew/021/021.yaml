  verdict: revise
  source_fidelity: 'Основний зміст передано точно: відповідь Ісуса, урочиста формула, віра без сумніву, відсилання до смоківниці та образ гори збережені. Однак κἄν має виразне значення «навіть якщо / навіть коли», яке варто відтворити в основному тексті. Наказові пасивні форми Ἄρθητι καὶ βλήθητι природно передано українськими зворотними формами без зайвого штучного пасиву.'
  naturalness: 'Текст загалом природний для сучасної нормативної української. «Навіть якщо» ясніше передає наростальний характер прикладу, ніж просто «коли». Примітку варто стилістично виправити: «роздвоєні у своїх думках» звучить неприродно; «не будете двоїтися в думках» є усталенішим і зрозумілішим.'
  terminology: «Істинно кажу вам», «віра», «засумніваєтеся», «смоківниця» та «гора» відповідають сучасному біблійному регістру і не нав’язують конфесійного тлумачення. Образ гори залишено без пояснювального звуження до буквального чуда або метафори.
  issues:
