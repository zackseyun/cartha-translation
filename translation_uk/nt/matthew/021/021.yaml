    issue: κἄν передано як «коли» без експліцитного підсилення.
    rationale: κἄν (= καὶ ἐάν) вводить посилений, ескалаційний приклад; «навіть якщо» точніше зберігає цю функцію.
  - severity: low
    issue: Формулювання альтернативи в примітці «не будете роздвоєні у своїх думках» неприродне.
    rationale: Воно калькує пояснення, а не звучить як нормативний український відповідник. «Не будете двоїтися в думках» передає можливий відтінок διακρίνω природніше.
