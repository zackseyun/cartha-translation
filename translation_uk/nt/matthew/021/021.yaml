id: MAT.21.21
reference: Matthew 21:21
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐὰν ἔχητε πίστιν καὶ μὴ διακριθῆτε, οὐ μόνον τὸ τῆς συκῆς ποιήσετε, ἀλλὰ κἂν τῷ ὄρει τούτῳ εἴπητε· Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν, γενήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/021.yaml
  text: But Jesus answered them[a], “Truly I say to you, if you have faith and do not doubt, you will not only do what was done to the fig tree, but even if you say to this mountain, ‘Be taken up and thrown into the sea,’ it will happen.”
translation:
  language: uk
  text: 'Ісус же відповів їм: «Істинно кажу вам: якщо матимете віру й не засумніваєтеся[a], то не лише зробите те, що сталося зі смоківницею, а й, навіть якщо скажете цій горі: “Піднімися і кинься в море”, — станеться».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «не вагатиметеся» або «не будете двоїтися в думках».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Ісус же відповів їм
  rationale: Дієприкметникову конструкцію природно передано особовою формою; «же» відтворює м’який перехід δέ без надмірного протиставлення.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Істинно кажу вам
  rationale: Усталена й зрозуміла українська формула, що зберігає урочисте та авторитетне підсилення вислову.
- source_word: ἐὰν ἔχητε πίστιν
  choice: якщо матимете віру
  rationale: У контексті πίστις означає довірливу впевненість; «віра» є природним і богословськи ненавантаженим відповідником.
- source_word: μὴ διακριθῆτε
  choice: не засумніваєтеся
  rationale: У цьому контексті дієслово позначає внутрішній сумнів або вагання; альтернативний відтінок збережено у примітці.
- source_word: οὐ μόνον τὸ τῆς συκῆς ποιήσετε
  choice: не лише зробите те, що сталося зі смоківницею
  rationale: Грецький вислів еліптичний і відсилає до щойно описаної події зі смоківницею; переклад розкриває еліпсис без уточнення способу дії.
- source_word: κἂν τῷ ὄρει τούτῳ εἴπητε
  choice: а й коли скажете цій горі
  rationale: κἄν розширює вислів до ще разючішого прикладу; в українській реальна умовна конструкція з «коли» тут звучить природно й зберігає наростання.
- source_word: Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν
  choice: Піднімись і кинься в море
  rationale: Українські зворотні форми природно передають пасивно-результативні накази й зберігають фізичну образність підняття та кидання.
- source_word: γενήσεται
  choice: станеться
  rationale: Стислий сучасний відповідник, який прямо виражає здійснення сказаного.
theological_decisions:
- issue: Значення πίστις у вислові про надзвичайну дію
  choice: віра
  alternative: довіра; вірність
  rationale: Контекст указує на довірливу впевненість, а не передусім на вірність як рису характеру.
- issue: Характер образу пересування гори
  choice: Збережено буквальну образну форму без визначення, чи це лише метафора, чи обіцянка буквального чуда
  alternative: Звести вислів або до суто буквального пересування гори, або лише до метафори подолання труднощів
  rationale: Оригінал залишає напруження між яскравою гіперболічною образністю та можливістю надзвичайної дії; переклад не повинен наперед розв’язувати це тлумачне питання.
translation_notes:
  register: Сучасна нормативна українська мова з гідним біблійним регістром. Уникнуто архаїзмів на кшталт «воістину» та надмірно буквального, неприродного синтаксису; водночас збережено урочистість прямої мови й виразність образу.
