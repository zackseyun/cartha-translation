base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/031.yaml
  text: Which of the two did the will of the father? They said[a], “The first.” Jesus said to them, “Truly I say to you, the tax collectors and the prostitutes are going ahead of you into the kingdom of God.”
translation:
  language: uk
  text: 'Хто з двох виконав волю батька? Вони відповіли: «Перший». Ісус сказав їм: «Істинно кажу вам: збирачі податків і повії йдуть попереду вас у Царство Боже.[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «входять у Царство Боже раніше за вас». Грецький вислів передає рух попереду вас, наголошуючи на першості, але не обов’язково стверджуючи остаточне виключення.'
    reason: alternative_reading
lexical_decisions:
- source_word: τίς ἐκ τῶν δύο
  choice: Хто з цих двох
  rationale: Природне українське запитання, що зберігає часткове значення прийменника ἐκ.
- source_word: ἐποίησεν
  choice: виконав
  rationale: У сполученні з «волю» українське «виконав» звучить природно й передає конкретне значення ποιέω.
- source_word: τὸ θέλημα τοῦ πατρός
  choice: волю батька
  rationale: Формально близький переклад; у контексті йдеться про батька з притчі, а не безпосередньо про Бога.
- source_word: Ὁ πρῶτος
  choice: Перший
  rationale: Стисло й природно відтворює еліптичну грецьку відповідь.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Істинно кажу вам
  rationale: Зберігає урочисту формулу Ісуса зрозумілою сучасною українською мовою.
- source_word: τελῶναι
  choice: збирачі податків
  rationale: Зрозумілий сучасному читачеві відповідник для тогочасних податкових агентів; не вносить пізнішого адміністративного значення слова «митники».
- source_word: πόρναι
  choice: повії
  rationale: Точний, сучасний і конкретний відповідник, без архаїзації чи невиправданого розширення до загальної статевої аморальності.
- source_word: προάγουσιν ὑμᾶς
  choice: йдуть попереду вас
  rationale: Зберігає теперішній час та образ випередження, не стверджуючи однозначно остаточного виключення адресатів.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: у Царство Боже
  rationale: Природний український відповідник, який зберігає спрямованість εἰς і традиційну богословську назву.
theological_decisions:
- issue: Сила вислову προάγουσιν ὑμᾶς щодо входження в Царство
  choice: йдуть попереду вас у Царство Боже
  alternative: входять у Царство Боже раніше за вас
  rationale: Дієслово προάγω передає рух попереду або випередження. Основний переклад зберігає цей образ і напруження перестороги, не додаючи сильнішого твердження про остаточне виключення релігійних провідників.
translation_notes:
  register: Сучасна стандартна українська мова; стиль ясний, гідний і придатний для публічного читання. Збережено образність і богословську неоднозначність грецького тексту.
