base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/041.yaml
  text: They said to him[a], “He will miserably destroy those wretches, and he will lease the vineyard to other farmers[c][b], who will give him the fruits in their seasons.”
translation:
  language: uk
  text: 'Вони сказали йому: «Він лихо погубить цих лиходіїв[a], а виноградник здасть в оренду[b] іншим виноградарям, які віддадуть йому плоди у належні строки[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальніше: «лихих лихо погубить». У грецькому тексті прикметник і прислівник утворені від одного кореня, що підсилює суворість присуду.'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «віддасть виноградник іншим орендарям».'
    reason: lexical_alternative
  - marker: c
    text: 'Або: «віддадуть йому врожай у належний час».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: Вони сказали йому
  rationale: Теперішній час у грецькій тут є історичним теперішнім; минулий час природно передає українську оповідь.
- source_word: Κακοὺς κακῶς ἀπολέσει αὐτούς
  choice: Він жорстоко погубить цих негідників
  rationale: «Негідники» передає моральний осуд κακούς, «жорстоко» — підсилювальну силу κακῶς, а «погубить» зберігає суворість ἀπολέσει, не уточнюючи способу загибелі. Спільнокореневу гру слів пояснено у примітці.
- source_word: τὸν ἀμπελῶνα ἐκδώσεται
  choice: виноградник здасть в оренду
  rationale: В аграрному контексті ἐκδίδωμι означає передати землю орендарям за належну власникові частку врожаю.
- source_word: ἄλλοις γεωργοῖς
  choice: іншим виноградарям
  rationale: У контексті виноградника γεωργοί — його землероби-орендарі; «виноградарі» стисло й природно називає їхню працю, а орендні відносини вже виражено дієсловом.
- source_word: οἵτινες ἀποδώσουσιν αὐτῷ
  choice: які віддаватимуть йому
  rationale: ἀποδίδωμι позначає віддання належного; недоконаний вид передає регулярну дію орендарів у відповідні строки.
- source_word: τοὺς καρποὺς ἐν τοῖς καιροῖς αὐτῶν
  choice: плоди у відповідні строки
  rationale: «Плоди» зберігає буквальний сільськогосподарський образ і його можливий переносний відтінок; «у відповідні строки» передає множину καιροί та думку про належний час віддавання врожаю.
theological_decisions:
- issue: Суворість і характер суду над виноградарями
  choice: жорстоко погубить цих негідників
  alternative: лихих лихо погубить; доведе цих злочинців до лихого кінця
  rationale: Фраза передає різкий осуд і неминучість згубного суду, але не додає до тексту конкретного вчення про спосіб чи остаточний характер покарання.
translation_notes:
  register: Сучасна літературна українська з урочистим, але зрозумілим оповідним тоном. Формулювання зберігає сільськогосподарську образність притчі та суворість відповіді без архаїзмів і конфесійно забарвлених уточнень.
