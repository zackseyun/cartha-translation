  source_fidelity: 'Текст точно передає всі складники грецького оригіналу: καταλιπών — «залишивши», αὐτούς — «їх», ἐξῆλθεν ἔξω τῆς πόλεως — «вийшов із міста», εἰς Βηθανίαν — «до Віфанії», ηὐλίσθη ἐκεῖ — «там заночував». Українське «вийшов із міста» природно передає підсилену конструкцію без штучного дублювання. «Заночував» точно відтворює значення ночівлі, яке має ηὐλίσθη.'
