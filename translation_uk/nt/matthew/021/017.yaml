  text: καὶ καταλιπὼν αὐτοὺς ἐξῆλθεν ἔξω τῆς πόλεως εἰς Βηθανίαν, καὶ ηὐλίσθη ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/017.yaml
  text: And leaving them[a], he went out of the city to Bethany and stayed there overnight.
translation:
  language: uk
  text: І, залишивши їх, Він вийшов із міста до Віфанії й там заночував.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «зупинився там на ніч» чи «переночував там».
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλιπὼν
  choice: залишивши
  rationale: Аористовий дієприкметник позначає дію, що передує головній; форма «залишивши» природно й точно передає цей зв’язок.
- source_word: αὐτοὺς
  choice: їх
  rationale: Прямий займенниковий відповідник без додаткового уточнення, кого саме мається на увазі.
- source_word: ἐξῆλθεν ἔξω τῆς πόλεως
  choice: вийшов із міста
  rationale: Український вислів природно передає підсилену грецьку конструкцію руху за межі міста без неприродного повтору.
- source_word: πόλεως
  choice: міста
  rationale: У контексті йдеться про Єрусалим; «місто» є звичайним відповідником πόλις.
- source_word: εἰς Βηθανίαν
  choice: до Віфанії
  rationale: Природне позначення напрямку до населеного пункту; вжито усталену українську форму назви.
- source_word: ηὐλίσθη
  choice: заночував
  rationale: Точно й стисло передає значення «провести ніч, зупинитися на ніч» у сучасній українській мові.
- source_word: ἐκεῖ
  choice: там
  rationale: Зберігає вказівку на Віфанію як місце ночівлі.
theological_decisions: []
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Займенник «Він» подано з великої літери відповідно до поширеної української біблійної традиції; сам грецький текст граматично не позначає шанобливої капіталізації.
