lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: Усе це
  rationale: Природний український вислів, що передає вказівку на щойно описані події як єдине ціле та наголос ὅλον на їхній сукупності. Частка δέ тут позначає перехід у розповіді й не вимагає окремого слова.
- source_word: γέγονεν
  choice: сталося
  rationale: Перфект γίνομαι описує подію з актуальним наслідком; у сучасній українській розповіді «сталося» звучить природно й точно.
- source_word: ἵνα
  choice: щоб
  rationale: Передає можливе поєднання мети й результату, не звужуючи значення до лише одного з них.
- source_word: πληρωθῇ
  choice: збулося
  rationale: Пасивний аорист кон’юнктива у формулі здійснення Писання природно передається українським «збулося».
- source_word: τὸ ῥηθὲν
  choice: сказане
  rationale: Субстантивований пасивний дієприкметник передано стисло й природно, зі збереженням пасивної перспективи.
- source_word: ὑπὸ κυρίου
  choice: Господом
  rationale: Орудний відмінок природно передає Господа як безпосередньо названого первинного діяча пасивної конструкції, без додавання слова «Бог».
- source_word: διὰ τοῦ προφήτου
  choice: через пророка
  rationale: Зберігає розрізнення між Господом як першоджерелом вислову та пророком як посередником.
- source_word: λέγοντος
  choice: який сказав
  rationale: Узгодження з «пророка» чітко показує, що саме пророк промовляє наступну цитату; доконаний минулий час природний для української формули введення цитати.
theological_decisions:
- issue: Посередництво в пророчому слові
  choice: «сказане Господом через пророка»
  alternative: «сказане пророком від Господа»
  rationale: Грецький текст розрізняє ὑπό з родовим, що називає Господа джерелом вислову, і διά з родовим, що представляє пророка як посередника. Переклад зберігає це розрізнення, не розгортаючи його в окреме доктринальне твердження.
- issue: Формула здійснення пророцтва
  choice: «щоб збулося»
  alternative: «і так збулося»
  rationale: ἵνα з кон’юнктивом допускає відтінки мети та результату. «Щоб збулося» зберігає цю напругу й не зводить вислів лише до наслідку.
translation_notes:
  register: Сучасна стандартна українська мова; виклад природний і водночас гідний. «Усе це» уникає зайвої архаїчності, а двокрапка готує читача до цитати в наступному вірші.
