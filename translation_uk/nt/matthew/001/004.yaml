  text: Ἀρὰμ δὲ ἐγέννησεν τὸν Ἀμιναδάβ, Ἀμιναδὰβ δὲ ἐγέννησεν τὸν Ναασσών, Ναασσὼν δὲ ἐγέννησεν τὸν Σαλμών,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/004.yaml
  text: Aram fathered Amminadab[a], and Amminadab fathered Nahshon, and Nahshon fathered Salmon.
translation:
  language: uk
  text: Арам породив Амінадава[a], Амінадав породив Наасона, а Наасон породив Салмона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «Рам». У грецькому тексті стоїть «Арам» (Ἀράμ), тоді як форма «Рам» відповідає єврейському родоводу.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀρὰμ
  choice: Арам
  rationale: Ім’я передано безпосередньо за грецькою формою Ἀράμ; відповідник «Рам», узгоджений із єврейською формою родоводу, наведено в примітці.
- source_word: δὲ
  choice: сполучниковий зв’язок «а» / без окремого відтворення
  rationale: У родоводі δέ послідовно просуває перелік і не виражає сильного протиставлення. Український синтаксис не потребує механічного повторення сполучника в кожній ланці.
- source_word: ἐγέννησεν
  choice: породив
  rationale: У генеалогічному контексті дієслово позначає батьківство або походження; «породив» стисло передає формулу родоводу й зберігає можливу ширшу генеалогічну перспективу.
- source_word: Ἀμιναδάβ
  choice: Амінадав
  rationale: Усталена українська біблійна форма імені, що відповідає грецькому Ἀμιναδάβ.
- source_word: Ναασσών
  choice: Наасон
  rationale: Форма близько передає грецьке Ναασσών і відповідає традиційному українському біблійному вжитку.
- source_word: Σαλμών
  choice: Салмон
  rationale: Пряма й упізнавана українська передача грецького імені Σαλμών.
