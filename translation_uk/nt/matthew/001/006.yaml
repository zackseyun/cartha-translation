lexical_decisions:
- source_word: ἐγέννησεν
  choice: став батьком
  rationale: У родоводі γεννάω позначає батьківство й походження по чоловічій лінії. Вислів «став батьком» природний у сучасній українській мові й не має архаїчного відтінку слова «породив».
- source_word: βασιλέα
  choice: царя
  rationale: Означений артикль у вислові τὸν Δαυὶδ τὸν βασιλέα виділяє царський статус Давида; прикладка «Давида, царя» передає це без неприродного повторення означеності.
- source_word: ἐκ τῆς τοῦ Οὐρίου
  choice: від дружини Урії
  rationale: 'Грецький вислів еліптичний: буквально «від [жінки] Урії». Українське «від дружини Урії» природно відтворює зміст, не називаючи Вірсавію та зберігаючи її зв’язок з Урією.'
- source_word: Ἰεσσαὶ
  choice: Єссей
  rationale: Усталена українська біблійна форма імені.
- source_word: Δαυὶδ
  choice: Давид
  rationale: Усталена українська форма імені.
- source_word: Σολομῶνα
  choice: Соломон
  rationale: Усталена українська форма імені; у тексті вжито знахідний відмінок «Соломона».
- source_word: Οὐρίου
  choice: Урія
  rationale: Усталена українська форма імені; у тексті вжито родовий відмінок «Урії».
- source_word: δέ
  choice: не передано окремим словом
  rationale: У цьому родоводі δέ є слабким сполучним елементом. Поділ на два речення природно передає послідовність без надмірного повторення «а» чи «і».
theological_decisions:
- issue: Непряме позначення Вірсавії в Матвія
  choice: Збережено вислів «від дружини Урії» без додавання імені Вірсавії.
  alternative: «від Вірсавії» або «від тієї, що була дружиною Урії»
  rationale: Матвій свідомо називає жінку через її зв’язок з Урією. Це зберігає літературний і моральний відгомін розповіді з 2 Самуїлової та не усуває напруження, наявного в оригіналі.
translation_notes:
  register: Сучасна, гідна й загальнозрозуміла українська мова. Формулу «став батьком» обрано замість архаїчного «породив»; синтаксичну стислість родоводу та непряме позначення дружини Урії збережено.
