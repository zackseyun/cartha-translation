source:
  edition: SBLGNT
  text: Ἀβραὰμ ἐγέννησεν τὸν Ἰσαάκ, Ἰσαὰκ δὲ ἐγέννησεν τὸν Ἰακώβ, Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰούδαν καὶ τοὺς ἀδελφοὺς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/002.yaml
  text: Abraham fathered Isaac[a], and Isaac fathered Jacob, and Jacob fathered Judah and his brothers,
translation:
  language: uk
  text: Авраам став батьком Ісаака[a], а Ісаак став батьком Якова, а Яків став батьком Юди та його братів.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або «породив». Грецьке дієслово можна також передати формальніше: «став батьком».'
    reason: Лексична альтернатива для традиційнішої або формальнішої передачі родовідного дієслова.
lexical_decisions:
- source_word: ἐγέννησεν
  choice: став батьком
  rationale: У родоводі дієслово γεννάω позначає чоловіче батьківство або походження по батьківській лінії. Вислів «став батьком» природний у сучасній українській мові, зберігає батьківський характер родоводу й не стверджує понад текст, що кожна названa особа неодмінно була безпосереднім нащадком попередньої.
- source_word: δὲ
  choice: а
  rationale: У послідовності родоводу δέ є м’яким сполучником, а не позначенням сильного протиставлення. Українське «а» природно пов’язує наступні ланки переліку.
- source_word: Ἰούδαν
  choice: Юди
  rationale: Йдеться про патріарха Юду, сина Якова; форма «Юди» є родовим відмінком усталеного українського імені «Юда».
- source_word: ἀδελφοὺς αὐτοῦ
  choice: його братів
  rationale: Іменник має чоловічу форму й у цьому контексті означає інших синів Якова, тобто братів Юди.
- source_word: Ἀβραὰμ / Ἰσαάκ / Ἰακώβ
  choice: Авраам / Ісаак / Яків
  rationale: Використано усталені в сучасній українській біблійній традиції форми особових імен.
theological_decisions:
- issue: Передача родовідного дієслова
  choice: Послідовно вживати «став батьком»
  alternative: «Породив»
  rationale: «Став батьком» ясно передає чоловічу лінію родоводу природною сучасною українською мовою. Водночас ця форма не усуває можливості того, що біблійний родовід може подавати походження стисло, пропускаючи окремі покоління.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Повторення «став батьком» зберігає формульну будову грецького родоводу; «а» забезпечує природний послідовний рух речення без надмірного відтінку протиставлення.
