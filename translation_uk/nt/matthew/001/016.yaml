  text: Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰωσὴφ τὸν ἄνδρα Μαρίας, ἐξ ἧς ἐγεννήθη Ἰησοῦς ὁ λεγόμενος χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/016.yaml
  text: And Jacob fathered Joseph[a], the husband of Mary, from whom Jesus was born[b], who is called the Messiah.
translation:
  language: uk
  text: А Яків породив Йосипа, чоловіка Марії, від якої народився Ісус, якого називають Месією[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Христом». Грецьке слово χριστός тут ужите як титул і означає «Месія».'
    reason: alternative_rendering
lexical_decisions:
- source_word: δὲ
  choice: А
  rationale: Частка легко продовжує родовід; «А» природно передає перехід без надмірного протиставлення.
- source_word: ἐγέννησεν
  choice: породив
  rationale: У родоводі дієслово означає батьківство й походження. «Породив» стисло зберігає повторювану генеалогічну формулу.
- source_word: τὸν ἄνδρα Μαρίας
  choice: чоловіка Марії
  rationale: У сполученні з родовим відмінком ἀνήρ має виразне значення «чоловік» у шлюбному сенсі.
- source_word: ἐξ ἧς
  choice: від якої
  rationale: Жіночий рід займенника однозначно вказує на Марію та зберігає зміну звичної чоловічої формули родоводу.
- source_word: ἐγεννήθη
  choice: народився
  rationale: Пасивна форма тут природно передається українським «народився» і зберігає відмінність від активного «породив» щодо Йосипа.
- source_word: ὁ λεγόμενος
  choice: якого називають
  rationale: Формулювання прямо передає ідентифікаційний зворот і природно пов’язує титул з Ісусом.
- source_word: χριστός
  choice: Месією
  rationale: У вислові «якого називають…» слово функціонує як титул, тому перекладено його значення, а не подано як ім’я.
theological_decisions:
- issue: Передача титулу χριστός в ідентифікаційній формулі
  choice: Месією
  alternative: Христом
  rationale: Контекст виразно представляє χριστός як титул. «Месія» передає титульне значення, а примітка зберігає традиційний варіант.
- issue: Зміна генеалогічної формули щодо народження Ісуса
  choice: Йосипа «породив» Яків, а Ісус «народився» від Марії
  alternative: Уніфікувати обидві форми як «породив/був породжений»
  rationale: Грецький текст навмисно переходить від активного ἐγέννησεν до пасивного ἐγεννήθη та жіночого ἐξ ἧς. Переклад зберігає цю зміну, не додаючи пояснення про батьківство Йосипа.
translation_notes:
  register: Сучасна нормативна українська мова з урочистим, але зрозумілим родовідним формулюванням. Конструкція «від якої народився» чітко зберігає жіночий референт і синтаксичний злам грецького тексту.
