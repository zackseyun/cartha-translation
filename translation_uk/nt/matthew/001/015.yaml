id: MAT.1.15
reference: Matthew 1:15
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Ἐλιοὺδ δὲ ἐγέννησεν τὸν Ἐλεάζαρ, Ἐλεάζαρ δὲ ἐγέννησεν τὸν Ματθάν, Ματθὰν δὲ ἐγέννησεν τὸν Ἰακώβ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/015.yaml
  text: Eliud fathered Eleazar, and Eleazar fathered Matthan, and Matthan fathered Jacob.
translation:
  language: uk
  text: Еліуд породив Елеазара, Елеазар породив Маттана, а Маттан породив Якова.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλιοὺδ
  choice: Еліуд
  rationale: Особове ім’я передано усталеною українською біблійною транслітерацією.
- source_word: δὲ
  choice: без окремого відповідника / «а»
  rationale: У родовідному переліку δέ є слабким сполучником, який просуває послідовність. Перші два випадки природно передано зіставленням суміжних речень без окремого сполучника, а останній — словом «а», щоб зберегти зв’язність і уникнути монотонності.
- source_word: ἐγέννησεν
  choice: породив
  rationale: У родоводі дієслово означає чоловіче породження або походження по батьківській лінії. «Породив» точно, стисло й природно відтворює повторювану генеалогічну формулу.
- source_word: τὸν
  choice: окремо не перекладено
  rationale: Грецький артикль позначає прямий додаток перед власним ім’ям; в українській мові в цій конструкції артикль не відтворюється.
- source_word: Ἐλεάζαρ
  choice: Елеазар
  rationale: Особове ім’я передано усталеною українською біблійною формою.
- source_word: Ματθάν
  choice: Маттан
  rationale: Транслітерація зберігає подвоєний приголосний грецької форми та відрізняє це ім’я від інших близьких біблійних імен.
- source_word: Ἰακώβ
  choice: Яків
  rationale: Використано усталену українську біблійну форму імені; у знахідному відмінку в тексті — «Якова».
theological_decisions:
- issue: Безпосереднє батьківство чи ширше родове походження у формулі ἐγέννησεν
  choice: Збережено конкретну генеалогічну формулу «породив».
  alternative: «був предком» або «став батьком»
  rationale: Грецьке γεννάω в родоводі може функціонувати в межах ширшої лінії походження, але сам текст використовує формулу породження. Переклад не розширює її до «був предком» і не додає пояснення, якого немає у вірші.
translation_notes:
  register: Сучасна стандартна українська, стислий і гідний родовідний стиль. Повтор дієслова збережено як важливу рису грецької структури; слабкі сполучники передано природно для українського переліку.
