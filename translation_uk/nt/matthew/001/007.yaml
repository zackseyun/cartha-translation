base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/007.yaml
  text: Solomon fathered Rehoboam[a], Rehoboam fathered Abijah, and Abijah fathered Asaph.
translation:
  language: uk
  text: Соломон став батьком Ровоама, Ровоам — батьком Авії, а Авія — батьком Асафа.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Деякі рукописи мають «Аса», що відповідає імені юдейського царя в 1 Царів 15 та 2 Хронік 14–16; у цьому грецькому тексті — «Асаф».
    reason: textual_variant
lexical_decisions:
- source_word: ἐγέννησεν
  choice: породив
  rationale: У родоводі дієслово γεννάω позначає батьківство або походження по чоловічій лінії. «Породив» стисло й точно передає повторювану генеалогічну формулу та залишається зрозумілим у сучасній українській.
- source_word: δὲ
  choice: а
  rationale: Тут δέ є слабким сполучником, що продовжує генеалогічний ланцюг, а не виражає різке протиставлення. Українське «а» природно поєднує послідовні ланки.
- source_word: Σολομών
  choice: Соломон
  rationale: Усталена українська форма біблійного імені.
- source_word: Ῥοβοάμ
  choice: Ровоам
  rationale: Усталена українська біблійна форма імені, яка забезпечує впізнаваність і зв’язок зі старозавітною традицією.
- source_word: Ἀβιά
  choice: Авія
  rationale: Усталена українська форма відповідного старозавітного царського імені; вона природніша для читача, ніж безпосередніша передача грецької форми.
- source_word: Ἀσάφ
  choice: Асаф
  rationale: Основний текст SBLGNT має Ἀσάφ, тому переклад відтворює саме це ім’я, не гармонізуючи його мовчки з переліком юдейських царів.
theological_decisions:
- issue: Чи узгоджувати родовід Матвія зі старозавітним переліком царів, передаючи Ἀσάφ як «Аса»
  choice: Залишити «Асаф» в основному тексті
  alternative: Передати як «Аса»
  rationale: Наданий грецький текст читає Ἀσάφ, тому пріоритет оригіналомовного джерела вимагає зберегти «Асаф». Варіант «Аса», який відповідає імені юдейського царя у 1 Царів 15 та 2 Хронік 14–16, зазначено у примітці для текстологічної прозорості.
translation_notes:
  register: Сучасна стандартна українська з гідним біблійним звучанням. Повтор генеалогічної формули збережено заради структури й ритму оригіналу; імена подано в усталених українських біблійних формах.
