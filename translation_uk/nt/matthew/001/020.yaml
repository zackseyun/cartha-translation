source:
  edition: SBLGNT
  text: ταῦτα δὲ αὐτοῦ ἐνθυμηθέντος ἰδοὺ ἄγγελος κυρίου κατ’ ὄναρ ἐφάνη αὐτῷ λέγων· Ἰωσὴφ υἱὸς Δαυίδ, μὴ φοβηθῇς παραλαβεῖν ⸀Μαρίαν τὴν γυναῖκά σου, τὸ γὰρ ἐν αὐτῇ γεννηθὲν ἐκ πνεύματός ἐστιν ἁγίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/020.yaml
  text: But as he was considering these things, behold, an angel of the Lord appeared to him in a dream, saying, “Joseph, son of David, do not be afraid to take Mary as your wife, for what has been conceived in her is from the Holy Spirit.”
translation:
  language: uk
  text: 'Коли ж він про це розмірковував, ось ангел Господній з’явився йому уві сні й сказав: «Йосипе, сину Давида, не бійся взяти до себе Марію, свою дружину,[a] бо те, що зачате в ній, — від Святого Духа».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «взяти Марію, свою дружину». Грецький вислів у цьому контексті означає прийняти її до свого дому як дружину.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνθυμηθέντος
  choice: розмірковував
  rationale: Передає тривале внутрішнє обдумування Йосипом обставин, не подаючи його рішення як уже остаточно ухвалене.
- source_word: ἰδοὺ
  choice: ось
  rationale: Зберігає виразний оповідний маркер, який привертає увагу до раптової появи ангела.
- source_word: ἄγγελος κυρίου
  choice: ангел Господній
  rationale: Природний український відповідник неозначеної грецької конструкції; не змушує ототожнювати цього ангела зі спеціальною старозавітною постаттю.
- source_word: κατ’ ὄναρ
  choice: уві сні
  rationale: Усталений і природний український відповідник грецького ідіоматичного вислову.
- source_word: ἐφάνη
  choice: з’явився
  rationale: Точно й природно передає явлення в оповідному контексті.
- source_word: υἱὸς Δαυίδ
  choice: сину Давида
  rationale: Клична форма зберігає родовий зв’язок Йосипа з Давидом і можливий давидівський підтекст.
- source_word: μὴ φοβηθῇς
  choice: не бійся
  rationale: Природно передає заборону та емоційний зміст дієслова φοβέομαι.
- source_word: παραλαβεῖν Μαρίαν τὴν γυναῖκά σου
  choice: взяти до себе Марію, свою дружину
  rationale: «Взяти до себе» передає прийняття Марії у свій дім, а прикладка «свою дружину» зберігає те, що грецький текст уже називає її дружиною Йосипа, не натякаючи на нове набуття статусу.
- source_word: τὸ ἐν αὐτῇ γεννηθὲν
  choice: те, що зачате в ній
  rationale: Зберігає неозначену субстантивовану форму грецького вислову й природно передає допологовий контекст.
- source_word: ἐκ πνεύματός ἐστιν ἁγίου
  choice: від Святого Духа
  rationale: Прийменник «від» ясно передає джерело або походження, виражене ἐκ.
theological_decisions:
- issue: Значення κυρίου у вислові ἄγγελος κυρίου
  choice: Господній
  alternative: ангел Господа
  rationale: Прикметникова форма природна й усталена в українській біблійній мові та не вимагає специфічного теофанічного тлумачення.
- issue: Референт πνεύματός ... ἁγίου
  choice: Святий Дух
  alternative: святий дух
  rationale: У контексті розповіді Матвія вислів позначає Божественного Духа як джерело зачаття, а не невизначений дух чи безособову силу.
translation_notes:
  register: Сучасна нормативна українська мова з гідним, помірно піднесеним біблійним звучанням. «Ось» збережено як оповідний маркер; кличні форми «Йосипе, сину» відповідають українській нормі.
