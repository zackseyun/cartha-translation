source:
  edition: SBLGNT
  text: Σαλμὼν δὲ ἐγέννησεν τὸν ⸂Βόες ἐκ τῆς Ῥαχάβ, Βόες⸃ δὲ ἐγέννησεν τὸν ⸂Ἰωβὴδ ἐκ τῆς Ῥούθ, Ἰωβὴδ⸃ δὲ ἐγέννησεν τὸν Ἰεσσαί,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/005.yaml
  text: Salmon fathered Boaz by Rahab[a], and Boaz fathered Obed by Ruth, and Obed fathered Jesse,
translation:
  language: uk
  text: Салмон став батьком Боаза від Рахав, Боаз став батьком Оведа від Рут, а Овед став батьком Єссея.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγέννησεν
  choice: став батьком
  rationale: У родоводі дієслово означає чоловіче батьківство або генеалогічне походження. «Став батьком» природно звучить сучасною українською та не має архаїчного відтінку слова «породив».
- source_word: ἐκ
  choice: від
  rationale: Конструкція ἐκ із родовим відмінком імені матері позначає материнське походження. «Від Рахав» і «від Рут» стисло й виразно зберігає цю особливість грецького тексту.
- source_word: δὲ
  choice: безсполучниковий зв’язок; перед останньою ланкою — «а»
  rationale: Тут δέ є слабким послідовним сполучником, а не протиставленням. Український перелік природно допускає кому між першими ланками та «а» перед завершальною ланкою.
- source_word: Σαλμὼν
  choice: Салмон
  rationale: Усталена українська біблійна форма імені.
- source_word: Βόες
  choice: Боаз
  rationale: Форма узгоджена з усталеним українським ім’ям старозавітного персонажа й забезпечує впізнаваність між Завітами.
- source_word: Ῥαχάβ
  choice: Рахав
  rationale: Усталена українська біблійна форма імені.
- source_word: Ἰωβὴδ
  choice: Овед
  rationale: Українська форма, що відповідає усталеному імені старозавітного персонажа та зберігає міжзавітну тяглість.
- source_word: Ῥούθ
  choice: Рут
  rationale: Сучасна українська біблійна форма імені, що відповідає єврейському імені та назві книги.
- source_word: Ἰεσσαί
  choice: Єссей
  rationale: Усталена українська біблійна форма імені, подана у відмінковій формі «Єссея» після «батьком».
theological_decisions:
- issue: Генеалогічна формула та згадка матерів
  choice: Збережено батьківську лінію формулою «став батьком» і прямо названо матерів через «від Рахав» та «від Рут».
  alternative: «Породив ... від Рахав / від Рут» або «був батьком ...; матір’ю була ...».
  rationale: Грецький текст виразно поєднує ἐγέννησεν із ἐκ та іменем матері. Обране формулювання не усуває незвичної присутності матерів у родоводі й не додає тлумачення понад текст.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Повтор генеалогічної формули збережено, але сполучники пристосовано до природного українського синтаксису. Імена подано в усталених українських біблійних формах.
