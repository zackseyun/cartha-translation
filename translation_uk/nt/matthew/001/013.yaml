source:
  edition: SBLGNT
  text: Ζοροβαβὲλ δὲ ἐγέννησεν τὸν Ἀβιούδ, Ἀβιοὺδ δὲ ἐγέννησεν τὸν Ἐλιακίμ, Ἐλιακὶμ δὲ ἐγέννησεν τὸν Ἀζώρ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/013.yaml
  text: Zerubbabel fathered Abiud[a], Abiud fathered Eliakim, and Eliakim fathered Azor.
translation:
  language: uk
  text: Зоровавель породив[a] Авіуда, Авіуд породив Еліякима, а Еліяким породив Азора.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «став батьком»; у біблійних родоводах ця повторювана формула може стисло подавати лінію походження.
    reason: Лексична альтернатива та збереження можливої стислості родоводу.
lexical_decisions:
- source_word: Ζοροβαβέλ
  choice: Зоровавель
  rationale: Усталена українська біблійна форма особового імені, що передає грецьку форму та впізнавану історичну постать.
- source_word: δέ
  choice: — / а
  rationale: У цьому родоводі δέ є слабким сполучником, який продовжує перелік, а не виражає сильне протиставлення. В українському тексті перше δέ не передано окремо, а останнє природно передано сполучником «а».
- source_word: ἐγέννησεν
  choice: породив
  rationale: У формулі родоводу дієслово означає батьківство або походження по чоловічій лінії. «Породив» стисло й традиційно передає грецьку форму, не запроваджуючи окремого терміна «предок».
- source_word: Ἀβιούδ
  choice: Авіюд
  rationale: Усталена українська біблійна передача особового імені.
- source_word: Ἐλιακίμ
  choice: Еліяким
  rationale: Усталена українська біблійна форма, близька до грецького написання та впізнавана сучасному читачеві.
- source_word: Ἀζώρ
  choice: Азор
  rationale: Природна українська транслітерація грецького особового імені без додаткових діакритичних знаків.
theological_decisions:
- issue: Передача γεννάω у родоводі, де покоління можуть бути подані стисло
  choice: породив
  alternative: став батьком; був предком
  rationale: «Породив» зберігає повторювану родовідну формулу оригіналу, але саме по собі не вирішує, чи кожна ланка позначає безпосереднє батьківство, чи родовід іноді пропускає покоління. Варіант «був предком» надто явно тлумачив би зв’язок як небезпосередній.
translation_notes:
  register: Сучасна, гідна й зрозуміла українська мова. Збережено лаконічний ритм родоводу та повтор дієслова; архаїчне «породив» тут лишається прозорим і жанрово доречним.
