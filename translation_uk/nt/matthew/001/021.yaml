language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: τέξεται δὲ υἱὸν καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰησοῦν, αὐτὸς γὰρ σώσει τὸν λαὸν αὐτοῦ ἀπὸ τῶν ἁμαρτιῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/021.yaml
  text: She will bear a son[a], and you shall call his name Jesus, for he will save his people from their sins.
translation:
  language: uk
  text: Вона народить сина, і ти даси йому ім’я Ісус[a], бо саме він спасе свій народ від їхніх гріхів.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ім’я Ісус — усталена українська форма грецького Ἰησοῦς; воно відповідає єврейсько-арамейському імені Єшуа, спорідненому з ім’ям Ісус Навин, і пов’язане зі значенням «Ягве спасає». Слово «спасе» відтворює закладену тут гру слів.
    reason: Пояснення походження імені та гри слів, яку неможливо повністю передати самим перекладом.
lexical_decisions:
- source_word: τέξεται
  choice: народить
  rationale: Майбутня форма дієслова τίκτω в контексті пологів; «народить» природно й точно передає дію та її передбачений характер.
- source_word: δὲ
  choice: і
  rationale: δέ є м’яким сполучником; українське «і» природно поєднує цю обітницю з попереднім контекстом без внесення протиставлення.
- source_word: υἱὸν
  choice: сина
  rationale: Неозначений знахідний відмінок у повідомленні про народження природно передається українським «сина» без артикля.
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ
  choice: ти даси йому ім’я
  rationale: Це природний сучасний український відповідник семітсько-грецької формули називання; він зберігає пряме звернення до Йосипа та зв’язок із поясненням імені.
- source_word: Ἰησοῦν
  choice: Ісус
  rationale: Усталена українська форма новозавітного особового імені; примітка пояснює його єврейсько-арамейське тло та гру слів.
- source_word: αὐτὸς
  choice: саме він
  rationale: Окремо виражений і поставлений на початку пояснювальної частини займенник має фокусне значення; «саме він» передає наголос на дитині як виконавцеві спасіння.
- source_word: γὰρ
  choice: бо
  rationale: Вводить пояснення причини, чому дитині слід дати це ім’я.
- source_word: σώσει
  choice: спасе
  rationale: У сполученні з «народом» і «гріхами» дієслово σῴζω має значення спасіння; «спасе» є прямим і усталеним відповідником.
- source_word: τὸν λαὸν αὐτοῦ
  choice: свій народ
  rationale: Український зворот із рефлексивним присвійним займенником природно передає належність народу тому, хто є підметом, не звужуючи й не розширюючи його обсяг.
- source_word: ἀπὸ τῶν ἁμαρτιῶν αὐτῶν
  choice: від їхніх гріхів
  rationale: ἀπό позначає відділення або визволення; множина «гріхів» збережена, а займенник чітко відсилає до народу.
theological_decisions:
- issue: Наголос займенника αὐτός щодо спасительної дії Ісуса
  choice: «саме він спасе»
  alternative: «він спасе»
  rationale: Варіант зберігає фокус на названій дитині як діячеві, не додаючи пояснення про спосіб або природу спасіння.
- issue: Обсяг вислову «свій народ»
  choice: Залишено без уточнення, кого саме охоплює цей народ
  alternative: «народ Ізраїлю» або «всіх, хто йому належить»
  rationale: Сам вірш не визначає обсяг вислову докладніше; переклад не звужує його лише до Ізраїлю і не розширює до всього людства.
translation_notes:
  register: Сучасна стандартна українська мова; виклад природний, зрозумілий і водночас гідний. Займенники, що стосуються Ісуса, подано з малої літери відповідно до звичайної сучасної орфографії, без додавання відсутньої в грецькому тексті графічної шанобливості.
