source:
  edition: SBLGNT
  text: Ἀζὼρ δὲ ἐγέννησεν τὸν Σαδώκ, Σαδὼκ δὲ ἐγέννησεν τὸν Ἀχίμ, Ἀχὶμ δὲ ἐγέννησεν τὸν Ἐλιούδ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/014.yaml
  text: Azor fathered Zadok, Zadok fathered Achim, and Achim fathered Eliud.
translation:
  language: uk
  text: Азор породив Садока, Садок породив Ахіма, а Ахім породив Еліуда.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀζώρ
  choice: Азор
  rationale: Особове ім’я передано усталеною українською біблійною транслітерацією.
- source_word: δέ
  choice: а
  rationale: У родоводі δέ виконує просту сполучну й послідовну функцію; повторення здебільшого природно передається комами, а останнє — сполучником «а».
- source_word: ἐγέννησεν
  choice: породив
  rationale: У генеалогічному контексті дієслово означає чоловіче породження або походження по батьківській лінії; «породив» стисло й гідно відтворює формулу оригіналу, не звужуючи її неодмінно до безпосереднього батьківства.
- source_word: τὸν
  choice: окремо не перекладено
  rationale: Грецький знахідний артикль позначає прямий додаток перед власним ім’ям; українською в такій конструкції артикль не передається.
- source_word: Σαδώκ
  choice: Садок
  rationale: Особове ім’я передано усталеною українською біблійною формою.
- source_word: Ἀχίμ
  choice: Ахім
  rationale: Особове ім’я передано українською транслітерацією грецької форми.
- source_word: Ἐλιούδ
  choice: Еліуд
  rationale: Особове ім’я передано українською транслітерацією грецької форми.
