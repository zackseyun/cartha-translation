  terminology: Усталені українські біблійні форми імен ужито послідовно. Відмінкові форми «Манасії», «Амоса» та «Йосії» граматично правильні. Примітка коректно пояснює відмінність від традиційно відомого імені царя та не підміняє читання грецького тексту.
