id: MAT.1.10
reference: Matthew 1:10
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Ἑζεκίας δὲ ἐγέννησεν τὸν Μανασσῆ, Μανασσῆς δὲ ἐγέννησεν τὸν ⸂Ἀμώς, Ἀμὼς⸃ δὲ ἐγέννησεν τὸν Ἰωσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/010.yaml
  text: Hezekiah fathered Manasseh[a], Manasseh fathered Amos, and Amos fathered Josiah.
translation:
  language: uk
  text: Єзекія став батьком Манасії, Манасія став батьком Амоса[a], а Амос став батьком Йосії.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: У деяких перекладах тут стоїть «Амон» — відповідно до імені юдейського царя у 2 Царів 21; однак у грецькому тексті Матвія стоїть «Амос».
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγέννησεν
  choice: став батьком
  rationale: У родоводі дієслово γεννάω позначає батьківство або походження по чоловічій лінії. Вислів «став батьком» природний у сучасній українській мові, точно передає зміст і уникає архаїчного «породив».
- source_word: Ἑζεκίας
  choice: Єзекія
  rationale: Ужито усталену українську біблійну форму імені юдейського царя.
- source_word: Μανασσῆς
  choice: Манасія
  rationale: Ужито усталену українську біблійну форму особового імені; у реченні відповідно вжито родовий відмінок «Манасії».
- source_word: Ἀμώς
  choice: Амос
  rationale: Основний текст SBLGNT має форму Ἀμώς, тому її без гармонізації передано як «Амос».
- source_word: Ἰωσίας
  choice: Йосія
  rationale: Ужито поширену сучасну українську біблійну форму імені; після «батьком» — «Йосії».
- source_word: δέ
  choice: а / пунктуаційний зв’язок
  rationale: У послідовності родоводу δέ рухає перелік уперед. Перші випадки природно передано комами, а останній — сполучником «а», без надмірного повторення.
theological_decisions:
- issue: Відмінність між грецьким ім’ям у Матвія та ім’ям юдейського царя у книгах Царів і Хронік
  choice: У головному тексті залишено «Амос» відповідно до грецького Ἀμώς
  alternative: «Амон» як гармонізація з ім’ям царя у 2 Царів 21 та паралельному тексті Хронік
  rationale: Переклад безпосередньо відтворює поданий грецький текст і не виправляє його мовчки за старозавітним родоводом. Відомішу форму «Амон» зазначено у примітці, щоб зберегти текстову й історичну напругу.
translation_notes:
  register: Сучасна стандартна українська мова, проста й гідна оповідна форма. Повтор «став батьком» зберігає ритм родоводу та ясно передає родинний зв’язок. Маркер примітки поставлено безпосередньо після імені «Амос», якого вона стосується.
