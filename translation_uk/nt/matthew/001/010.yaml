  source_fidelity: 'Текст точно передає послідовність родоводу та чоловіче породження, виражене ἐγέννησεν. Імена відповідають грецькому текстові SBLGNT: «Єзекія», «Манасія», «Амос», «Йосія». Вирішально, що в основному тексті збережено «Амос» (Ἀμώς), а не гармонізоване «Амон».'
