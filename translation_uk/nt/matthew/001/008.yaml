  text: Ἀσὰφ⸃ δὲ ἐγέννησεν τὸν Ἰωσαφάτ, Ἰωσαφὰτ δὲ ἐγέννησεν τὸν Ἰωράμ, Ἰωρὰμ δὲ ἐγέννησεν τὸν Ὀζίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/008.yaml
  text: Asaph fathered Jehoshaphat[a], Jehoshaphat fathered Joram, and Joram fathered Uzziah.
translation:
  language: uk
  text: Асаф породив Йосафата[a], Йосафат породив Йорама, і Йорам породив Уззію.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: У деяких рукописах — «Аса» замість «Асаф»; ім’я «Аса» також відповідає імені юдейського царя в старозавітному родоводі.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀσὰφ
  choice: Асаф
  rationale: Передає грецьку форму імені в основному тексті без мовчазного узгодження зі старозавітним родоводом; варіант «Аса» зазначено у примітці.
- source_word: δὲ
  choice: а / без окремого відповідника
  rationale: У родоводі це слабкий сполучник, а не протиставлення; природний український синтаксис допускає його неповторення та доречне «а» перед останньою ланкою.
- source_word: ἐγέννησεν
  choice: породив
  rationale: Стисло й природно передає батьківство в родоводі, не вдаючись до архаїчного «спородив» або громіздкого «став батьком».
- source_word: Ἰωσαφάτ
  choice: Йосафат
  rationale: Усталена українська біблійна форма імені юдейського царя.
- source_word: Ἰωράμ
  choice: Йорам
  rationale: Безпосередньо передає коротку грецьку форму імені та відповідає сучасному українському біблійному вжитку.
- source_word: Ὀζίαν
  choice: Уззія
  rationale: Упізнавана українська форма імені юдейського царя; у знахідному відмінку в тексті — «Уззію».
theological_decisions:
- issue: Передача повторюваних δὲ та ἐγέννησεν у родовідній послідовності
  choice: Зберегти кожну ланку «породив», але не повторювати сполучник механічно; перед останньою ланкою вжити «а».
  alternative: «Асаф породив Йосафата, і Йосафат породив Йорама, і Йорам породив Уззію».
  rationale: Так український текст звучить природно, водночас точно зберігаючи всі три зв’язки родоводу.
- issue: Чи узгоджувати Ἀσὰφ з очікуваним історичним ім’ям Аса
  choice: Залишити «Асаф» в основному тексті, а «Аса» подати у примітці.
  alternative: Вжити «Аса» в основному тексті за старозавітним родоводом.
  rationale: Основний текст передає засвідчену грецьку форму SBLGNT і не приховує текстової та родовідної розбіжності.
translation_notes:
  register: Сучасна стандартна українська мова; стислий, гідний родовідний стиль. Імена подано в упізнаваних українських біблійних формах, але спірну грецьку форму «Асаф» збережено в основному тексті.
