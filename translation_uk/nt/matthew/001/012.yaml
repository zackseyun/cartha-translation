translation:
  language: uk
  text: Після переселення до Вавилона[a] Єхонія став батьком Салатіїла, а Салатіїл став батьком Зоровавеля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «після вавилонського полону». Грецьке слово означає переселення, тобто примусове виселення народу до Вавилона.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ
  choice: Після
  rationale: μετά зі знахідним відмінком позначає часову послідовність; слабкий сполучник δέ природно не виражати окремо на початку українського речення.
- source_word: τὴν μετοικεσίαν Βαβυλῶνος
  choice: переселення до Вавилона
  rationale: μετοικεσία означає переселення або виселення на чужину. «Переселення» природно звучить українською, а примітка уточнює примусовий характер події та можливий відповідник «вавилонський полон».
- source_word: Ἰεχονίας
  choice: Єхонія
  rationale: Ужито традиційну українську біблійну форму імені, яка відповідає грецькому Ἰεχονίας.
- source_word: ἐγέννησεν
  choice: породив
  rationale: У родоводі γεννάω передає батьківство або походження по чоловічій лінії. «Породив» стисло зберігає повторювану генеалогічну формулу, не вимагаючи безпосередності кожної ланки.
- source_word: Σαλαθιήλ
  choice: Салатіїл
  rationale: Традиційна українська біблійна форма імені, що відповідає грецькому Σαλαθιήλ.
- source_word: δὲ
  choice: а
  rationale: У другій частині δέ м’яко поєднує наступну ланку родоводу; українське «а» природно передає перехід без протиставлення.
- source_word: Ζοροβαβέλ
  choice: Зоровавель
  rationale: Традиційна й упізнавана українська біблійна форма імені, що відповідає грецькому Ζοροβαβέλ.
theological_decisions:
- issue: Передача γεννάω у родоводі
  choice: породив
  alternative: став батьком; був предком
  rationale: Збережено традиційну формулу чоловічої лінії походження, але її не слід розуміти як обов’язкове твердження про безпосереднє біологічне батьківство в кожній ланці, оскільки біблійні родоводи можуть стискати покоління.
