  text: ⸀ἐγερθεὶς δὲ ὁ Ἰωσὴφ ἀπὸ τοῦ ὕπνου ἐποίησεν ὡς προσέταξεν αὐτῷ ὁ ἄγγελος κυρίου καὶ παρέλαβεν τὴν γυναῖκα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/024.yaml
  text: Then Joseph[a], having awakened from sleep, did as the angel of the Lord commanded him and took his wife.
translation:
  language: uk
  text: Прокинувшись від сну, Йосип зробив так, як звелів йому ангел Господній, і взяв до себе свою дружину.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «прийняв свою дружину» чи «взяв свою дружину до свого дому». Грецьке дієслово може означати прийняття когось до себе, зокрема до свого дому.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθεὶς δὲ ... ἀπὸ τοῦ ὕπνου
  choice: Прокинувшись від сну
  rationale: Дієприкметникова конструкція природно передає послідовність дій і безпосередньо виражає пробудження від сну; δέ тут служить переходом у розповіді й не потребує окремого протиставного сполучника.
- source_word: ἐποίησεν ὡς
  choice: зробив так, як
  rationale: Природна українська конструкція, що точно передає відповідність дії отриманому велінню.
- source_word: προσέταξεν
  choice: звелів
  rationale: «Звелів» передає авторитетний характер наказу й відповідає гідному біблійному регістру без надмірної різкості.
- source_word: ὁ ἄγγελος κυρίου
  choice: ангел Господній
  rationale: Усталений і природний український відповідник біблійного звороту; «Господній» передає родовий відмінок κυρίου.
- source_word: παρέλαβεν
  choice: взяв до себе
  rationale: Дієслово може означати прийняти або взяти когось із собою чи до свого дому. «Взяв до себе» зберігає цей відтінок і природно звучить у шлюбному контексті.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: свою дружину
  rationale: У цьому правово-шлюбному контексті γυνή означає дружину; зворотний присвійний займенник «свою» є нормативним українським відповідником αὐτοῦ при тому самому суб’єкті.
theological_decisions:
- issue: Значення γυνή до подружнього співжиття
  choice: свою дружину
  alternative: свою жінку
  rationale: Матвій описує Марію в чинних правово-шлюбних відносинах із Йосипом, хоча наступний вірш окремо уточнює відсутність подружніх стосунків. «Дружину» передає цей статус, не стверджуючи консуммації шлюбу.
- issue: Передача κύριος у вислові ἄγγελος κυρίου
  choice: ангел Господній
  alternative: ангел Господа
  rationale: Прикметникова форма є усталеним українським біблійним висловом і точно вказує на належність ангела Господу, не додаючи окремого тлумачення Божого імені.
