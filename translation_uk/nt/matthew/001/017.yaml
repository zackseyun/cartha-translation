source:
  edition: SBLGNT
  text: Πᾶσαι οὖν αἱ γενεαὶ ἀπὸ Ἀβραὰμ ἕως Δαυὶδ γενεαὶ δεκατέσσαρες, καὶ ἀπὸ Δαυὶδ ἕως τῆς μετοικεσίας Βαβυλῶνος γενεαὶ δεκατέσσαρες, καὶ ἀπὸ τῆς μετοικεσίας Βαβυλῶνος ἕως τοῦ χριστοῦ γενεαὶ δεκατέσσαρες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/017.yaml
  text: So all the generations from Abraham to David were fourteen generations[a], and from David to the exile to Babylon fourteen generations[b], and from the exile to Babylon to the Messiah fourteen generations.
translation:
  language: uk
  text: Отже, від Авраама до Давида було всього чотирнадцять поколінь, від Давида до переселення до Вавилону було чотирнадцять поколінь, і від переселення до Вавилону до Месії[a] було чотирнадцять поколінь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Христа». Грецьке слово χριστός означає «Помазаник» і тут ужите як титул.'
    reason: alternative_reading
lexical_decisions:
- source_word: Πᾶσαι οὖν αἱ γενεαὶ
  choice: Отже, усіх поколінь
  rationale: «Отже» передає підсумковий висновок οὖν, а «усіх поколінь» зберігає Πᾶσαι та природно вводить українську підсумкову конструкцію з кількісним присудком.
- source_word: γενεαὶ
  choice: покоління
  rationale: У родоводі γενεά означає послідовні покоління; це прямий і зрозумілий український відповідник.
- source_word: ἀπὸ ... ἕως
  choice: від ... до
  rationale: Точно й природно позначає межі кожного з трьох відтинків родоводу.
- source_word: μετοικεσίας Βαβυλῶνος
  choice: переселення у Вавилон
  rationale: μετοικεσία називає примусове переміщення або виселення. «Переселення у Вавилон» зберігає акцент на події переміщення, не звужуючи значення до самого стану полону.
- source_word: τοῦ χριστοῦ
  choice: Месії
  rationale: Артикль і завершальна позиція в родоводі вказують на титульне вживання χριστός. «Месія» передає значення титулу, тоді як традиційний відповідник «Христос» подано в примітці.
- source_word: γενεαὶ δεκατέσσαρες
  choice: чотирнадцять поколінь
  rationale: Повторено в усіх трьох частинах, щоб зберегти виразну риторичну симетрію грецького тексту.
theological_decisions:
- issue: Передача титулу Χριστός
  choice: Месія
  alternative: Христос
  rationale: У цьому підсумку родоводу слово функціонує як титул очікуваного Помазаника. «Месія» виразно передає титульний зміст, а «Христос» залишається можливим традиційним відтворенням.
translation_notes:
  register: Сучасна літературна українська з урочистою, але доступною ритмікою. Тире природно оформлюють бездієслівну кількісну конструкцію; повтор сполучника «і» та формули «чотирнадцять поколінь» зберігає тричленний паралелізм оригіналу.
