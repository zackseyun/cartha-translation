  text: Ἰωσὴφ δὲ ὁ ἀνὴρ αὐτῆς, δίκαιος ὢν καὶ μὴ θέλων αὐτὴν ⸀δειγματίσαι, ἐβουλήθη λάθρᾳ ἀπολῦσαι αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/019.yaml
  text: And Joseph[a], her husband, being a righteous man and not wanting to expose her to public disgrace[c][b], intended to divorce her quietly.
translation:
  language: uk
  text: А Йосип, її чоловік[a], був праведний і, не бажаючи виставити її на ганьбу[b], вирішив потай розлучитися з нею[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «її наречений». Буквально грецькою — «її чоловік»; це відображає юридичну силу юдейських заручин.
    reason: lexical_alternative
  - marker: b
    text: Або «зробити з неї показовий приклад» чи «привселюдно її зганьбити».
    reason: lexical_alternative
  - marker: c
    text: Буквально — «потай відпустити її». У цьому контексті йдеться про формальне розірвання юридично чинних заручин.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ αὐτῆς
  choice: її чоловік
  rationale: У цьому контексті ἀνήρ означає чоловіка в юридично чинному шлюбному зв’язку. Марія була заручена з Йосипом, але юдейські заручини вже мали правову силу; це також підтверджує ἀπολῦσαι.
- source_word: δίκαιος
  choice: праведний
  rationale: «Праведний» природно передає моральний і богословський зміст δίκαιος, не звужуючи його лише до юридичної справедливості чи лише до милосердя.
- source_word: δειγματίσαι
  choice: виставляти її на ганьбу
  rationale: Дієслово означає зробити когось предметом викриття або ганьби. Український вислів передає і публічність дії, і пов’язане з нею приниження.
- source_word: ἐβουλήθη
  choice: вирішив
  rationale: Форма передає обдуманий намір або рішення; «вирішив» є ясним і природним відповідником у розповідному контексті.
- source_word: λάθρᾳ
  choice: потай
  rationale: Прислівник означає приховано, не привселюдно. «Потай» стисло зберігає контраст із публічною ганьбою.
- source_word: ἀπολῦσαι αὐτήν
  choice: розлучитися з нею
  rationale: У контексті юридично чинних юдейських заручин ἀπολύω позначає формальне розірвання зв’язку, тому «розлучитися» точніше для сучасного читача, ніж буквальне «відпустити».
- source_word: δὲ
  choice: А
  rationale: δέ тут є м’яким розповідним сполучником, який природно передається українським «А».
- source_word: ὢν καὶ μὴ θέλων
  choice: був ... і не хотів
  rationale: Особові дієслівні форми звучать українською природніше за буквальну дієприкметникову конструкцію й зберігають обидві обставини, що пояснюють рішення Йосипа.
theological_decisions:
- issue: Характеристика Йосипа як δίκαιος
  choice: «праведний» без уточнення, чи йдеться передусім про дотримання Закону, милосердя або їх поєднання
  alternative: «справедливий» або тлумачний переклад із наголосом лише на милосерді
  rationale: Грецький текст поєднує праведність Йосипа з його небажанням ганьбити Марію. Переклад зберігає цю напругу й не зводить значення до однієї етичної чи богословської риси.
- issue: Правовий статус Йосипа й Марії
  choice: У головному тексті вжито «чоловік» і «розлучитися»
  alternative: «наречений» і «розірвати заручини» або буквальніше «відпустити»
  rationale: У юдейському середовищі того часу заручини були юридично зобов’язувальними та вимагали формального розірвання. Основний текст передає правовий зміст сучасною мовою, а стадію стосунків пояснено в примітці.
translation_notes:
  register: Сучасна стандартна українська мова; виклад природний, стислий і гідний. Порядок думок дещо перебудовано для ясного українського причинно-наслідкового зв’язку без усунення змістової напруги між праведністю Йосипа та його милосердною стриманістю.
