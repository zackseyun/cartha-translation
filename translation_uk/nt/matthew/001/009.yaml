lexical_decisions:
- source_word: Ὀζίας
  choice: Озія
  rationale: Усталена українська біблійна форма імені юдейського царя, що відповідає грецькому Ὀζίας.
- source_word: δὲ
  choice: ж / а / без окремого відповідника
  rationale: У родовідному переліку δέ є слабким сполучником, який просуває оповідь. Варіативне відтворення природно передає зв’язність українською, не обтяжуючи повторювану формулу.
- source_word: ἐγέννησεν
  choice: породив
  rationale: Традиційний, стислий і зрозумілий український відповідник у родоводі; він зберігає батьківську генеалогічну формулу й повторюваний ритм грецького тексту.
- source_word: Ἰωαθάμ
  choice: Йотам
  rationale: Усталена українська біблійна форма імені юдейського царя.
- source_word: Ἀχάζ
  choice: Ахаз
  rationale: Усталена українська біблійна форма, яка відповідає старозавітному імені царя.
- source_word: Ἑζεκίαν
  choice: Єзекія
  rationale: Усталена українська біблійна форма імені юдейського царя.
theological_decisions:
- issue: Генеалогічне значення γεννάω
  choice: породив
  alternative: був батьком; став батьком; був предком
  rationale: Основний текст прямо зберігає формулу батьківського походження та літературний ритм Матвієвого родоводу. Можливість пропуску поколінь у біблійних родоводах не вводиться до перекладу як пояснювальне тлумачення.
