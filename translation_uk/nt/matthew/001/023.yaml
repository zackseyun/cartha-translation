  text: Ἰδοὺ ἡ παρθένος ἐν γαστρὶ ἕξει καὶ τέξεται υἱόν, καὶ καλέσουσιν τὸ ὄνομα αὐτοῦ Ἐμμανουήλ· ὅ ἐστιν μεθερμηνευόμενον Μεθ’ ἡμῶν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/023.yaml
  text: Behold[a], the virgin will conceive and bear a son, and they will call his name Immanuel—which is translated[d][c][b], 'God with us.'
translation:
  language: uk
  text: '«Ось діва[a] зачне й народить сина, і назвуть його Еммануїлом[b]», що в перекладі означає: «З нами Бог».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «незаймана дівчина». У ширшому обговоренні Ісаї 7:14 іноді пропонують «молода жінка», однак грецьке παρθένος і контекст розповіді Матвія підтримують переклад «діва».
    reason: lexical_alternative
  - marker: b
    text: Також передають як «Іммануїл».
    reason: transliteration_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Ось
  rationale: Природний український заклик звернути увагу, який зберігає урочистий пророчий тон цитати без архаїзації.
- source_word: ἡ παρθένος
  choice: діва
  rationale: У контексті Матвія слово означає незайману дівчину; «діва» стисло й гідно передає це значення та відповідає піднесеному стилю цитати.
- source_word: ἐν γαστρὶ ἕξει
  choice: зачне
  rationale: Природний український відповідник грецького ідіоматичного вислову «матиме в утробі», зі збереженням майбутнього часу.
- source_word: τέξεται υἱόν
  choice: народить Сина
  rationale: Точно й природно передає народження дитини чоловічої статі; велика літера відповідає українській традиції написання особових означень Ісуса в біблійному тексті.
- source_word: καλέσουσιν τὸ ὄνομα αὐτοῦ
  choice: назвуть Його
  rationale: Зберігає невизначену третю особу множини грецького дієслова й природно передає семітський вислів про надання імені.
- source_word: Ἐμμανουήλ
  choice: Еммануїл
  rationale: Усталена українська біблійна транслітерація імені.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: що в перекладі означає
  rationale: Природний сучасний український спосіб передати авторське пояснення значення імені.
- source_word: Μεθ’ ἡμῶν ὁ θεός
  choice: З нами Бог
  rationale: Прямий, стислий і богословськи не розширений переклад пояснення імені.
theological_decisions:
- issue: Значення παρθένος у контексті чудесного зачаття
  choice: діва
  alternative: молода жінка / дівчина
  rationale: У грецькому тексті Матвія та в безпосередньому контексті розповіді про зачаття Ісуса παρθένος позначає незайману дівчину. Альтернативний переклад не ставиться в основний текст, але згадується в примітці з огляду на ширшу дискусію про Ісаю 7:14.
- issue: Богословська сила пояснення імені Еммануїл
  choice: З нами Бог
  alternative: розгорнута згадка про втілення
  rationale: Переклад зберігає формулювання самого вірша й не додає доктринального пояснення, якого безпосередньо немає в тексті.
translation_notes:
  register: Сучасна нормативна українська з урочистим, але зрозумілим регістром. Збережено невизначений множинний суб’єкт «назвуть» і не розгорнуто пояснення імені понад грецький текст.
