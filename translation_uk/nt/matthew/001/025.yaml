  yaml_path: translation/nt/matthew/001/025.yaml
  text: And he did not know her until she gave birth to a son[c][b][a], and he called his name Jesus.
translation:
  language: uk
  text: І він не знав її, аж поки вона не народила сина[a][b]; і він дав йому ім’я Ісус[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Тобто не мав із нею статевих стосунків. Грецький текст буквально каже «не знав її», уживаючи дієслово «знати» як евфемізм.
    reason: lexical_alternative
  - marker: b
    text: Вислів «аж поки» указує на те, що було до народження Ісуса; сам по собі він не визначає, що сталося після цього.
    reason: alternative_reading
  - marker: c
    text: 'Грецький вислів буквально містить «назвав його ім’я Ісус»; ідіоматично: «назвав його Ісусом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγίνωσκεν
  choice: не знав
  rationale: Зберігає грецький евфемізм γινώσκω на позначення подружніх статевих стосунків; буквальність вислову лишається зрозумілою з контексту, а пряме пояснення подано у примітці.
- source_word: ἕως οὗ
  choice: аж поки
  rationale: Природний український часовий відповідник, що позначає стан речей до моменту народження, сам по собі не визначаючи того, що було згодом.
- source_word: ἔτεκεν
  choice: народила
  rationale: Сучасний і природний український відповідник дієслова τίκτω в цьому контексті.
- source_word: υἱόν
  choice: сина
  rationale: Грецький іменник ужито без артикля; українська мова не має артиклів, тому неозначеність природно передається немаркованою формою «сина», без доданого наголосу «того Сина».
- source_word: ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν
  choice: дав Йому ім’я Ісус
  rationale: Природний український відповідник семітсько-грецького звороту «назвав його ім’я Ісус»; він точно передає акт надання імені без неприродної кальки.
- source_word: Ἰησοῦν
  choice: Ісус
  rationale: Усталена українська новозавітна форма цього особового імені.
theological_decisions:
- issue: Чи вислів ἕως οὗ визначає подальше подружнє життя Марії
  choice: Передати часовий зворот як «аж поки», не стверджуючи, що після народження Ісуса подружні стосунки почалися або не почалися.
  alternative: Одні читачі вбачають у вислові зміну після народження; інші вважають, що він нічого не повідомляє про подальший час.
  rationale: Грецький зворот установлює часову межу для описаного стану до народження, але сам по собі не розв’язує питання про те, що було потім. Примітка зберігає цю богословську напругу.
translation_notes:
  register: Сучасна стандартна українська мова, гідний і загальнозрозумілий біблійний регістр. Збережено евфемізм «не знав її» та неоднозначність часового звороту; неприродний для української семітсько-грецький іменний зворот передано ідіоматично.
