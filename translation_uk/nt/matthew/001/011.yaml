  text: Josiah fathered Jeconiah and his brothers at the time of the deportation to Babylon[a].
translation:
  language: uk
  text: Йосія ж породив Єхонію та його братів під час переселення до Вавилона[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «під час вигнання до Вавилона». Грецьке слово може означати примусове переселення або вигнання.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: породив
  rationale: У родоводі дієслово γεννάω позначає батьківство або генеалогічне походження. «Породив» стисло відтворює повторювану формулу оригіналу й не уточнює ступеня спорідненості понад грецький текст.
- source_word: Ἰεχονίαν
  choice: Єхонію
  rationale: Форма імені передає грецьке Ἰεχονίας відповідно до усталеного українського біблійного вжитку; знахідний відмінок — «Єхонію».
- source_word: ἀδελφοὺς αὐτοῦ
  choice: його братів
  rationale: Грецький вислів має чоловічий рід і множину; «його братів» точно й природно передає його без гендерного узагальнення.
- source_word: ἐπὶ τῆς μετοικεσίας Βαβυλῶνος
  choice: за часу переселення до Вавилона
  rationale: ἐπί з родовим відмінком тут має часове значення, а μετοικεσία означає примусове переміщення, переселення або вигнання. «За часу» природно позначає період, а «до Вавилона» — напрямок переміщення.
- source_word: δὲ
  choice: ж
  rationale: Частка «ж» легко передає слабкий зв’язувальний і продовжувальний характер δέ у послідовності родоводу.
theological_decisions:
- issue: Генеалогічне скорочення в родоводі Матвія
  choice: Передати формулу родоводу прямо, не розв’язуючи в основному тексті історико-генеалогічних питань.
  alternative: Тлумачити ἐγέννησεν розгорнуто як «став предком», явно допускаючи пропущені покоління.
  rationale: Грецька генеалогічна формула може допускати ширший зв’язок походження, але переклад не повинен самовільно гармонізувати або конкретизувати його.
- issue: Характер вавилонського переселення
  choice: У тексті вжити «переселення», а примусовий характер і варіант «вигнання» зазначити у примітці.
  alternative: 'Основний текст: «за часу вигнання до Вавилона».'
  rationale: μετοικεσία позначає переміщення населення й у цьому контексті є примусовим; «переселення» ближче зберігає лексичний образ, тоді як примітка не приховує історичної примусовості події.
translation_notes:
  register: Сучасна нормативна українська мова з гідним біблійним звучанням. Повторювану генеалогічну формулу збережено стислою; частку δέ передано ненаголошеним «ж».
