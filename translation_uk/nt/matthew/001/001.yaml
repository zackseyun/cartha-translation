    reason: alternative_reading
lexical_decisions:
- source_word: Βίβλος
  choice: Книга
  rationale: Іменник βίβλος означає книгу, сувій або письмовий запис. На початку вірша він разом із γενέσεως утворює заголовок; «Книга» зберігає його урочисту й біблійну форму.
- source_word: γενέσεως
  choice: родоводу
  rationale: γένεσις може означати походження, народження або родовід. Оскільки далі подано перелік предків, «родоводу» найточніше передає безпосередній контекст, а ширший зміст зазначено у примітці.
- source_word: Ἰησοῦ
  choice: Ісуса
  rationale: Ужито усталену українську форму власного імені у родовому відмінку, якого вимагає конструкція «Книга родоводу».
- source_word: χριστοῦ
  choice: Месії
  rationale: Χριστός тут має силу титулу — Помазаник, Месія, — а не прізвища. «Месії» природно передає цей титул сучасною українською мовою.
- source_word: υἱοῦ Δαυὶδ
  choice: сина Давида
  rationale: Буквальне «сина» зберігає усталений месіанський титул і водночас у родовідному контексті означає нащадка Давида.
- source_word: υἱοῦ Ἀβραάμ
  choice: сина Авраама
  rationale: Буквальне «сина» зберігає біблійний родовідний вислів і завітний зв’язок з Авраамом; у цьому контексті йдеться про нащадка.
theological_decisions:
- issue: Передача Χριστός
  choice: Месія
  alternative: Христос
  rationale: У цьому заголовку слово функціонує як титул Ісуса. «Месія» виразно передає значення Помазаника й не перетворює титул на власне ім’я; традиційний варіант наведено у примітці.
- issue: Значення γενέσεως у заголовку
  choice: родовід
  alternative: походження; народження
  rationale: Безпосередньо після заголовка йде родовід, тому це найдоречніший основний відповідник. Проте ширший відтінок початку або походження не усунуто, а збережено у примітці.
translation_notes:
  register: Сучасна стандартна українська мова з лаконічним, урочистим біблійним звучанням. Родовідні формули «сина Давида» і «сина Авраама» збережено буквально, без заміни на пояснювальне «нащадка».
