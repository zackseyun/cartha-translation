translation:
  language: uk
  text: Книга родоводу[a] Ісуса Месії[b], сина Давида, сина Авраама.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «Книга походження» чи «Книга народження». Грецьке слово може мати ширше значення «походження», хоча «родовід» найкраще відповідає переліку предків, що далі.
    reason: alternative_reading
  - marker: b
