base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/003.yaml
  text: Judah fathered Perez and Zerah by Tamar[a], Perez fathered Hezron, and Hezron fathered Aram.
translation:
  language: uk
  text: Юда став батьком Переця й Зераха від Тамари; Перец став батьком Хецрона, а Хецрон — Арама.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: У деяких англійських перекладах тут стоїть «Рам», що відображає іншу традицію передачі імені; у грецькому тексті тут стоїть «Арам».
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰούδας
  choice: Юда
  rationale: У родоводі йдеться про старозавітного патріарха Юду; ця форма зберігає зв’язок з українською традицією Старого Завіту й не викликає асоціації з новозавітними особами на ім’я Юда/Юда Іскаріот.
- source_word: δὲ
  choice: ; / а
  rationale: Тут δέ є слабким сполучним елементом у послідовності родоводу, а не позначенням різкого протиставлення. У перших двох випадках його функцію природно передано пунктуацією, в останньому — сполучником «а».
- source_word: ἐγέννησεν
  choice: став батьком
  rationale: У родоводі дієслово означає батьківство або походження по батьківській лінії. Вислів «став батьком» точний, сучасний і природніший за архаїчне «породив».
- source_word: Φαρὲς
  choice: Перес
  rationale: Ім’я відповідає єврейському פֶּרֶץ; форма «Перес» підтримує впізнаваний зв’язок зі старозавітною особою, не відтворюючи механічно грецьке написання.
- source_word: Ζάρα
  choice: Зерах
  rationale: Грецька форма передає єврейське זֶרַח; «Зерах» зберігає канонічну тяглість зі старозавітним ім’ям.
- source_word: ἐκ τῆς Θαμάρ
  choice: від Тамари
  rationale: ἐκ з ім’ям матері в родоводі вказує на материнське походження. «Від Тамари» стисло й природно передає цю функцію українською.
- source_word: Ἑσρώμ
  choice: Хецрон
  rationale: Ім’я відповідає єврейському חֶצְרוֹן; форма «Хецрон» підтримує зв’язок з українським відтворенням старозавітного імені.
- source_word: Ἀράμ
  choice: Арам
  rationale: Наданий грецький текст прямо має Ἀράμ, тому основний текст передає «Арам», не гармонізуючи його мовчки з формою «Рам» в інших традиціях.
theological_decisions:
- issue: Чи узгоджувати останнє ім’я з поширеною формою старозавітного родоводу
  choice: Арам
  alternative: Рам
  rationale: Пріоритет надано наданому грецькому тексту SBLGNT, де стоїть Ἀράμ. Знайому форму «Рам» зазначено в примітці, щоб не приховувати текстову й перекладацьку традицію.
translation_notes:
  register: Сучасна літературна українська з гідним, але не архаїчним звучанням. Повторювану генеалогічну формулу збережено, водночас слабкі δέ передано природною українською пунктуацією та сполучником. Маркер примітки поставлено безпосередньо після імені «Арам», якого вона стосується.
