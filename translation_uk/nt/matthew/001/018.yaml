id: MAT.1.18
reference: Matthew 1:18
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Τοῦ δὲ ⸀Ἰησοῦ χριστοῦ ἡ ⸀γένεσις οὕτως ἦν. ⸀μνηστευθείσης τῆς μητρὸς αὐτοῦ Μαρίας τῷ Ἰωσήφ, πρὶν ἢ συνελθεῖν αὐτοὺς εὑρέθη ἐν γαστρὶ ἔχουσα ἐκ πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/018.yaml
  text: 'The birth of Jesus the Messiah happened in this way: when his mother Mary had been betrothed to Joseph[a], before they came together[c][b], she was found to be pregnant from the Holy Spirit.'
translation:
  language: uk
  text: 'Народження Ісуса Месії[a] відбулося так: коли його мати Марія була заручена з Йосипом[b], перш ніж вони зійшлися[c], виявилося, що вона вагітна від Святого Духа.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Ісуса Христа». Грецьке Χριστός тут перекладено як «Месія», щоб передати значення цього титулу.'
    reason: alternative_reading
  - marker: b
    text: Тодішні заручини були офіційним, юридично визнаним зобов’язанням, міцнішим за сучасну обіцянку одружитися.
    reason: cultural_note
  - marker: c
    text: Вислів «перш ніж вони зійшлися» може означати, що подружній союз іще не був здійснений у тілесному сенсі.
    reason: lexical_alternative
lexical_decisions:
- source_word: γένεσις
  choice: народження
  rationale: У цьому контексті слово вводить розповідь про появу на світ Ісуса; «народження» природно передає зміст і узгоджується з подальшою розповіддю.
- source_word: Ἰησοῦ χριστοῦ
  choice: Ісуса Месії
  rationale: Χριστός тут передано як титул «Месія», а не як прізвище чи нерозкладне власне ім’я.
- source_word: οὕτως ἦν
  choice: відбулося так
  rationale: Вислів указує, яким чином сталася описувана подія; український відповідник стислий і природний.
- source_word: μνηστευθείσης
  choice: була заручена
  rationale: Дієприкметник позначає формальні заручини; юридично-культурну вагу такого зв’язку пояснено в примітці.
- source_word: πρὶν ἢ συνελθεῖν αὐτούς
  choice: перш ніж вони зійшлися
  rationale: Збережено делікатний і дещо неоднозначний грецький вислів, який у контексті може стосуватися початку подружнього співжиття та його тілесного здійснення.
- source_word: εὑρέθη
  choice: виявилося
  rationale: Природна українська безособова конструкція передає значення пасивного «була виявлена», не називаючи того, хто це з’ясував.
- source_word: ἐν γαστρὶ ἔχουσα
  choice: що вона вагітна
  rationale: Це звичайний сучасний український відповідник грецького ідіоматичного вислову «мати в утробі».
- source_word: ἐκ πνεύματος ἁγίου
  choice: від Святого Духа
  rationale: Прийменник ἐκ указує на джерело або походження; «від» точно зберігає цей відтінок.
theological_decisions:
- issue: Передача Χριστός
  choice: Месія
  alternative: Христос
  rationale: У вступі до розповіді слово має виразну силу титулу. Переклад «Месія» розкриває його значення, а традиційний варіант подано в примітці.
- issue: Референт πνεύματος ἁγίου
  choice: Святий Дух
  alternative: святий дух
  rationale: У контексті розповіді Матвія вислів стосується Божого Святого Духа; відсутність артикля в грецькій не робить його неозначеним.
translation_notes:
  register: Сучасна нормативна українська мова; виклад ясний, стриманий і гідний. Збережено делікатність та смислову широту вислову про те, що Марія та Йосип ще не «зійшлися».
