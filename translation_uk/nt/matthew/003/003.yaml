base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/003.yaml
  text: 'For this is the one spoken of through Isaiah the prophet[a], saying: “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: uk
  text: 'Бо це той, про кого було сказано через пророка Ісаю: «Голос того, хто кличе в пустелі: „Приготуйте дорогу Господа[a], зробіть прямими його стежки“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «дорогу ГОСПОДА». Цитата перегукується з Ісаї 40:3, де в єврейському тексті стоїть Боже ім’я YHWH.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτος γάρ ἐστιν
  choice: Бо це той
  rationale: Зворот пояснює попередню розповідь і вказує на Івана Хрестителя, зберігаючи пояснювальну силу γάρ та вказівність οὗτος.
- source_word: ὁ ῥηθεὶς διὰ Ἠσαΐου τοῦ προφήτου
  choice: про кого було сказано через пророка Ісаю
  rationale: Пасивний дієприкметник передано природною українською конструкцією, а διά з родовим — словом «через», що зберігає уявлення про пророка як посередника звістки.
- source_word: Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ
  choice: Голос того, хто кличе в пустелі
  rationale: Родовий дієприкметник βοῶντος відтворено особовим підрядним зворотом; «пустеля» природно позначає безлюдну місцевість і відповідає контексту служіння Івана.
- source_word: Ἑτοιμάσατε τὴν ὁδὸν κυρίου
  choice: Приготуйте дорогу Господа
  rationale: Наказовий спосіб і дорожній образ збережено прямо; «дорога» природніше за «шлях» поєднується з подальшими «стежками».
- source_word: εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ
  choice: вирівняйте Його стежки
  rationale: Дієслово «вирівняйте» стисло передає заклик зробити стежки прямими; займенник збережено, а велика літера відповідає особовому позначенню Господа в українському біблійному стилі.
theological_decisions:
- issue: Передача κυρίου в цитаті з Ісаї 40:3, де єврейський текст містить Боже ім’я YHWH
  choice: Господа
  alternative: ГОСПОДА
  rationale: Основний текст перекладає наявне в грецькому тексті κυρίου звичним українським відповідником «Господа». Зв’язок цитати з єврейським Божим ім’ям не приховано, а пояснено у примітці.
translation_notes:
  register: Сучасна нормативна українська мова з гідним пророчим звучанням. Вкладені лапки чітко відмежовують євангельське цитування від слів самої пророчої цитати; двокрапка після «в пустелі» представляє зміст вигуку, не усуваючи можливої синтаксичної прив’язки вислову «в пустелі» до того, хто кличе.
