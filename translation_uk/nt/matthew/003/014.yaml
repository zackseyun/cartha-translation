  text: ὁ δὲ ⸀Ἰωάννης διεκώλυεν αὐτὸν λέγων· Ἐγὼ χρείαν ἔχω ὑπὸ σοῦ βαπτισθῆναι, καὶ σὺ ἔρχῃ πρός με;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/014.yaml
  text: But John kept trying to prevent him[a], saying, “I need to be baptized by you, and do you come to me?”
translation:
  language: uk
  text: 'Та Іван намагався Йому перешкодити[a], кажучи: «Мені треба, щоб Ти мене охрестив, а Ти приходиш до мене?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «перешкоджав Йому». Грецька форма імперфекта може вказувати на тривалу чи повторювану дію.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεκώλυεν
  choice: намагався Його зупинити
  rationale: Імперфект передає тривалу або повторювану спробу перешкодити; цей вислів природно відтворює незавершену дію українською.
- source_word: λέγων
  choice: кажучи
  rationale: Дієприкметник зберігає безпосередній зв’язок між спробою Івана зупинити Ісуса та поясненням цієї спроби.
- source_word: χρείαν ἔχω
  choice: мені потрібно
  rationale: Природний сучасний відповідник грецького звороту зі значенням потреби.
- source_word: ὑπὸ σοῦ
  choice: Тобою
  rationale: З пасивним інфінітивом прийменниковий зворот позначає особу, яка здійснює дію.
- source_word: βαπτισθῆναι
  choice: бути охрещеним
  rationale: Пасивний інфінітив передано прямо, без уточнення способу хрещення, якого цей вірш не пояснює.
- source_word: καὶ σὺ ἔρχῃ πρός με;
  choice: а Ти йдеш до мене?
  rationale: Риторичне запитання та протиставлення природно відтворено без додавання підсилювальних слів, відсутніх у грецькому тексті.
- source_word: δὲ
  choice: Та
  rationale: Передає м’яке протиставлення попередньому повідомленню про прихід Ісуса до Івана.
theological_decisions:
- issue: Заперечення Івана проти хрещення Ісуса
  choice: Слова Івана прямо виражають його власну потребу бути охрещеним Ісусом і здивування тим, що Ісус прийшов до нього.
  alternative: Пояснити заперечення передусім безгрішністю Ісуса або винятково різницею в становищі та владі.
  rationale: Сам вірш визнає вищість Ісуса та потребу Івана, але не подає повного богословського пояснення; переклад не повинен усувати цю напругу.
translation_notes:
  register: Сучасна стандартна українська мова; виклад природний і гідний. Займенники щодо Ісуса подано з великої літери відповідно до поширеної української біблійної традиції.
