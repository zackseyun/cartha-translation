- from: 'Та Іван намагався Його зупинити[a], кажучи: «Це мені потрібно бути охрещеним Тобою, а Ти йдеш до мене?»'
  to: 'Та Іван намагався Йому перешкодити[a], кажучи: «Мені треба, щоб Ти мене охрестив, а Ти приходиш до мене?»'
  rationale: The revision replaces a potentially over-specific physical sense with «перешкодити», removes the unsupported and awkward «Це», and uses a natural Ukrainian construction that plainly expresses John’s need for Jesus to baptize him. It retains the imperfective nuance by «намагався», preserves the theological restraint of the source, and keeps the footnote anchor and content aligned with the Greek imperfect.
