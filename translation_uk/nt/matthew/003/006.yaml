reference: Matthew 3:6
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: καὶ ἐβαπτίζοντο ἐν τῷ Ἰορδάνῃ ⸀ποταμῷ ὑπ’ αὐτοῦ ἐξομολογούμενοι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/006.yaml
  text: and they were being baptized by him in the Jordan River[a], confessing their sins.
translation:
  language: uk
  text: Іван хрестив їх у річці Йордані[a], а вони визнавали свої гріхи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «в річці Йордан». Грецьке слово прямо називає Йордан річкою.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβαπτίζοντο
  choice: хрестилися
  rationale: Українська зворотна форма природно передає грецький пасив у контексті прийняття обрядового хрещення; усталений термін «хрестилися» не уточнює спосіб здійснення обряду. Недоконаний вид також передає тривалу або повторювану дію.
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: в річці Йордані
  rationale: Прийменникова конструкція є місцевою, а ποταμῷ прямо називає Йордан річкою. Форма «в річці Йордані» природна українською та зберігає явний іменник «річка».
- source_word: ὑπ’ αὐτοῦ
  choice: в нього
  rationale: У сполученні «хрестилися в нього» природно передано особу, яка здійснювала хрещення; займенник збережено без підстановки імені Івана.
- source_word: ἐξομολογούμενοι
  choice: визнаючи
  rationale: Дієприслівник передає одночасність із хрещенням і відкрите словесне визнання провин; «визнаючи свої гріхи» є природним сучасним висловом.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: свої гріхи
  rationale: Зворотний присвійний займенник «свої» природний при співвіднесенні з підметом і зберігає множину «гріхи».
- source_word: καὶ
  choice: і
  rationale: Простий сполучник зберігає зв’язок із попереднім віршем без додаткового тлумачення.
theological_decisions:
- issue: Термінологія хрещення
  choice: хрестилися
  alternative: занурювалися; обмивалися
  rationale: Грецький текст говорить про прийняття хрещення, але в цьому вірші окремо не визначає спосіб обряду. Усталений термін зберігає богословську відкритість тексту.
- issue: Видове значення імперфекта
  choice: Передати недоконаним видом «хрестилися»
  alternative: охрестилися
  rationale: Імперфект може змальовувати тривалу або повторювану дію багатьох людей; недоконаний вид зберігає цей наративний відтінок, не роблячи його надмірно виразним у головному тексті.
translation_notes:
  register: Сучасна, проста й гідна оповідна українська. Порядок слів близький до грецького, але синтаксис природний; термін «хрестилися» не нав’язує конкретного способу хрещення.
