revisions:
- from: і хрестилися в нього в річці Йордані[a], визнаючи свої гріхи.
  to: Іван хрестив їх у річці Йордані[a], а вони визнавали свої гріхи.
  rationale: The revision renders the Greek passive agent unambiguously and idiomatically by using an active Ukrainian clause with the immediately established subject, Іван. It preserves the imperfect’s ongoing/repeated narrative force through «хрестив» and «визнавали», retains the explicit identification of the Jordan as a river, and keeps baptism terminology noncommittal regarding mode. The footnote is revised to a genuine Ukrainian lexical alternative for the explicit noun ‘river’; a note about a passive-form alternative is not needed in this active, natural Ukrainian rendering.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:42:35Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the narrative connective, the Jordan as a river, the imperfective sense of ἐβαπτίζοντο, and the concurrent confession of plural sins. However, «в нього» does not faithfully render ὑπ’ αὐτοῦ, which marks John as the personal agent (‘by him’), not a location, possession, or recipient relation.
  naturalness: '«Хрестилися ним» is grammatically possible but less natural in contemporary standard Ukrainian than an explicit agent: «Іван хрестив їх». Making John explicit is warranted for idiomatic Ukrainian and does not add interpretive content, since the immediate antecedent is John. The rest is clear and suitably dignified.'
  terminology: «Хрестити» appropriately preserves the established ritual term without specifying mode. «Визнаючи свої гріхи» is an apt modern rendering of ἐξομολογούμενοι τὰς ἁμαρτίας αὐτῶν. «У річці Йордан» is natural and preserves the explicit ποταμῷ.
  issues:
  - severity: medium
    issue: «в нього» for ὑπ’ αὐτοῦ
    rationale: 'The Greek preposition ὑπό with the genitive expresses agency: they were baptized by him. In Ukrainian, «хреститися в нього» can suggest being baptized at his place, by his affiliation, or seeking him out, and does not clearly identify him as the officiating agent.'
  - severity: low
    issue: Footnote’s alternative reverses the aspectual relationship
    rationale: The main text «хрестилися» is already imperfective and can express the ongoing/repeated narrative action. «були хрещені» is a valid Ukrainian passive alternative but normally sounds more resultative/perfective, so the note should present it simply as an alternative rather than say the imperfect necessarily favors the main wording over it.
  revised_text: Іван хрестив їх у річці Йордані[a], а вони визнавали свої гріхи.
  revised_footnotes:
  - marker: a
    text: Або «в річці Йордан». Грецьке слово прямо називає Йордан річкою.
    reason: lexical_alternative
  revision_rationale: The revision renders the Greek passive agent unambiguously and idiomatically by using an active Ukrainian clause with the immediately established subject, Іван. It preserves the imperfect’s ongoing/repeated narrative force through «хрестив» and «визнавали», retains the explicit identification of the Jordan as a river, and keeps baptism terminology noncommittal regarding mode. The footnote is revised to a genuine Ukrainian lexical alternative for the explicit noun ‘river’; a note about a passive-form alternative is not needed in this active, natural Ukrainian rendering.
