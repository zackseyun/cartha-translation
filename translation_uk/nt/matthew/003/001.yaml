lexical_decisions:
- source_word: Ἐν δὲ ταῖς ἡμέραις ἐκείναις
  choice: Тими днями
  rationale: Природний сучасний український відповідник часового звороту; слабкий сполучник δέ не потребує окремого відтворення, оскільки перехід виражено початком нового епізоду.
- source_word: παραγίνεται
  choice: прийшов
  rationale: Історичний теперішній час природно передано українським минулим; «прийшов» позначає появу Івана в оповіді без натяку на надприродну раптовість.
- source_word: Ἰωάννης
  choice: Іван
  rationale: Усталена українська біблійна форма імені.
- source_word: ὁ βαπτιστὴς
  choice: Хреститель
  rationale: Усталений український титул Івана; зберігає зв’язок із його діяльністю хрещення, не роблячи конфесійного твердження.
- source_word: κηρύσσων
  choice: і проповідував
  rationale: Грецький дієприкметник позначає супровідну діяльність. Особова сурядна конструкція звучить українською природніше й передає тривалу проповідницьку діяльність.
- source_word: ἐν τῇ ἐρήμῳ
  choice: у пустелі
  rationale: Йдеться про безлюдну, пустельну місцевість; українське «пустеля» не обов’язково означає лише піщану пустелю.
- source_word: τῆς Ἰουδαίας
  choice: Юдейській
  rationale: Прикметникова конструкція «Юдейська пустеля» є природною українською географічною назвою та точно вказує на область Юдеї.
theological_decisions:
- issue: Передача титулу βαπτιστής
  choice: Хреститель
  alternative: той, хто хрестить
  rationale: «Хреститель» — усталений і природний український титул; буквальніший опис можливий, але громіздкий і тут не додає потрібного змісту.
- issue: Історичний теперішній παραγίνεται
  choice: прийшов
  alternative: з’являється
  rationale: Минулий час відповідає нормам української оповіді. Варіант «з’являється» зберігає граматичну форму оригіналу, але може створити небажане враження раптової появи.
translation_notes:
  register: Сучасна стандартна українська, проста й гідна оповідна мова. Усталені біблійні форми «Іван Хреститель» і «Юдейська пустеля» забезпечують зрозумілість без архаїзації.
