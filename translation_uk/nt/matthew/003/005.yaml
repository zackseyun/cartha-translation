id: MAT.3.5
reference: Matthew 3:5
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: τότε ἐξεπορεύετο πρὸς αὐτὸν Ἱεροσόλυμα καὶ πᾶσα ἡ Ἰουδαία καὶ πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/005.yaml
  text: Then Jerusalem[a], all Judea, and all the region around the Jordan were going out to him[c][b],
translation:
  language: uk
  text: Тоді Єрусалим, уся Юдея та вся околиця Йордану виходили до нього[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «раз у раз виходили до нього»; грецький імперфект може вказувати на тривалу чи повторювану дію.'
    reason: lexical_alternative
  - marker: b
    text: «Уся Юдея» і «вся околиця Йордану» — широкі географічні вислови, що описують масовий відгук на служіння Івана, а не обов’язково кожного окремого мешканця.
    reason: cultural_note
lexical_decisions:
- source_word: τότε
  choice: Тоді
  rationale: Природний часовий сполучник, що пов’язує широкий відгук людей із попереднім описом служіння Івана.
- source_word: ἐξεπορεύετο
  choice: виходили
  rationale: Українська форма недоконаного виду передає тривалу або повторювану в минулому дію грецького імперфекта; однина в грецькому узгоджена з першим збірним географічним найменуванням, тоді як українська множина природно охоплює весь складений підмет.
- source_word: πρὸς αὐτόν
  choice: до нього
  rationale: З дієсловом руху πρός із знахідним відмінком позначає рух до особи; займенник у контексті стосується Івана.
- source_word: Ἱεροσόλυμα
  choice: Єрусалим
  rationale: Усталена сучасна українська форма назви міста; тут назва метонімічно означає його мешканців.
- source_word: πᾶσα ἡ Ἰουδαία
  choice: уся Юдея
  rationale: Зберігає цілісне географічне формулювання оригіналу без додавання слова «люди».
- source_word: πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου
  choice: вся околиця Йордану
  rationale: «Околиця» природно передає περίχωρος як навколишню місцевість, а родовий відмінок зберігає грецьку географічну конструкцію.
- source_word: καὶ ... καὶ
  choice: …, … та …
  rationale: Український перелік природно передає кумулятивне поєднання трьох географічних складників, не обтяжуючи речення повторенням «і».
theological_decisions:
- issue: Обсяг географічних узагальнень
  choice: Зберегти «уся Юдея» і «вся околиця Йордану» як широкі географічні вислови
  alternative: 'Уточнити: «люди з Єрусалима, з усієї Юдеї та з усієї околиці Йордану»'
  rationale: Оригінал риторично змальовує масовий відгук цілих місцевостей. Формальне географічне найменування зберігає цю силу й не вимагає розуміти, що йдеться буквально про кожного мешканця.
translation_notes:
  register: Сучасна літературна українська мова, урочиста без архаїзації. Метонімічні назви місцевостей збережено, як у грецькому тексті; дієслово в множині відповідає природному українському узгодженню зі складеним підметом.
