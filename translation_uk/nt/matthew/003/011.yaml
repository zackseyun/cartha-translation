id: MAT.3.11
reference: Matthew 3:11
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Ἐγὼ μὲν ⸂ὑμᾶς βαπτίζω⸃ ἐν ὕδατι εἰς μετάνοιαν· ὁ δὲ ὀπίσω μου ἐρχόμενος ἰσχυρότερός μού ἐστιν, οὗ οὐκ εἰμὶ ἱκανὸς τὰ ὑποδήματα βαστάσαι· αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ ⸂καὶ πυρί⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/011.yaml
  text: I indeed baptize you in water for repentance[a], but the one coming after me is stronger than I, whose sandals I am not worthy to carry[c][b]. He himself will baptize you in the Holy Spirit and fire.
translation:
  language: uk
  text: Я хрещу вас у воді на покаяння[a], а Той, Хто приходить після мене, сильніший за мене, і я не гідний нести Його сандалі. Він Сам хреститиме вас у Святому Дусі й вогні[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Вислів «у воді на покаяння» можна також передати як «водою задля покаяння». Прийменник ἐν може означати «у» або «за допомогою», а εἰς виражає спрямованість, не уточнюючи тут усіх подробиць зв’язку між хрещенням і покаянням.
    reason: lexical_alternative
  - marker: b
    text: Образ вогню може вказувати на очищення або на суд; грецький текст тут не усуває цієї неоднозначності.
    reason: alternative_reading
lexical_decisions:
- source_word: βαπτίζω / βαπτίσει
  choice: хрещу / хреститиме
  rationale: Усталений і зрозумілий український біблійний термін, який не звужує значення дієслова до конкретного способу обряду.
- source_word: ἐν ὕδατι
  choice: у воді
  rationale: Передає просторове значення ἐν і зберігає паралель із висловом «у Святому Дусі й вогні»; можливе знаряддєве розуміння зазначено у примітці.
- source_word: εἰς μετάνοιαν
  choice: на покаяння
  rationale: Стисло зберігає спрямованість εἰς, не визначаючи наперед точного співвідношення між покаянням і хрещенням.
- source_word: ὁ δὲ ὀπίσω μου ἐρχόμενος
  choice: а Той, Хто йде за мною
  rationale: Природний український відповідник субстантивованого дієприкметника, що зберігає послідовність приходу.
- source_word: ἰσχυρότερός μού
  choice: сильніший за мене
  rationale: Прямий, сучасний і природний відповідник порівняльної форми.
- source_word: οὗ οὐκ εἰμὶ ἱκανὸς
  choice: Я не гідний
  rationale: У формулі самоприниження ἱκανός має ідіоматичний сенс гідності або належності, а не лише фізичної спроможності.
- source_word: τὰ ὑποδήματα βαστάσαι
  choice: нести Його сандалі
  rationale: βαστάσαι означає «нести», а ὑποδήματα в цьому історичному контексті природно передати як «сандалі».
- source_word: αὐτὸς
  choice: Він Сам
  rationale: Зберігає емфатичне протиставлення служіння Івана діянню Того, Хто приходить.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: у Святому Дусі
  rationale: Зберігає повтор ἐν і передає πνεῦμα ἅγιον як особове найменування Святого Духа відповідно до контексту.
- source_word: καὶ πυρί
  choice: й вогні
  rationale: Буквально зберігає сполучення та відкритість образу вогню без додавання тлумачення в основний текст.
theological_decisions:
- issue: Значення вислову «у Святому Дусі й вогні»
  choice: Збережено буквальний вислів без пояснювального додатка.
  alternative: «у Святому Дусі й очищувальному вогні» або «у Святому Дусі й вогні суду»
  rationale: Грецький текст прямо не уточнює функцію вогню; контекст допускає дискусію щодо очищення та суду, тому переклад не усуває цієї напруги.
- issue: Референт πνεύματι ἁγίῳ
  choice: «Святий Дух» як особовий референт
  alternative: «святий дух» або «сила святого духа»
  rationale: У контексті Євангелія від Матвія вислів природно стосується Святого Духа; переклад не додає окремого пояснення про Його дію.
translation_notes:
  register: Сучасна стандартна українська мова; стиль урочистий, але доступний. Великі літери в займенниках щодо Христа вжито як видавничу шанобливу норму. Синтаксис розділено на коротші речення для ясності без зміни логічних зв’язків оригіналу.
