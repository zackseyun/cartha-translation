  - severity: low
    issue: Відносний зв’язок вислову про сандалі послаблено поділом на окреме речення
    rationale: Грецьке οὗ («чиї») безпосередньо залежить від «Того, Хто приходить». Поєднання в одному реченні ясніше відтворює цей зв’язок без зміни змісту.
