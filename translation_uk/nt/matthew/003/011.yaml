  source_fidelity: 'Зміст загалом передано точно: збережено протиставлення Іванового хрещення і хрещення Того, Хто приходить, смисл самоприниження («не гідний нести сандалі») та емфатичне «Він Сам». Однак «йде за мною» може означати буквальне слідування позаду, тоді як ὁ ὀπίσω μου ἐρχόμενος в цьому контексті природніше передати як «приходить після мене».'
  naturalness: Текст звучить сучасно й зрозуміло. «На покаяння» є припустимим біблійним відповідником εἰς μετάνοιαν і не потребує заміни. Синтаксичне приєднання вислову про сандалі до характеристики Того, Хто приходить, точніше відтворює грецьку відносну конструкцію та поліпшує зв’язність.
  terminology: «Хрестити», «покаяння», «сандалі», «Святий Дух» і «вогонь» ужито доречно. Вислів «у Святому Дусі й вогні» правомірно зберігає повтор ἐν і не розв’язує дискусійного значення образу вогню. Примітки належно пояснюють альтернативу для ἐν та відкритість образу вогню.
  issues:
