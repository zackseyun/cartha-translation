reference: Matthew 3:12
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ, καὶ διακαθαριεῖ τὴν ἅλωνα αὐτοῦ καὶ συνάξει τὸν σῖτον αὐτοῦ εἰς τὴν ⸀ἀποθήκην, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/012.yaml
  text: His winnowing fork is in his hand[a], and he will thoroughly clear his threshing floor and gather his wheat into the storehouse[b], but the chaff he will burn up with unquenchable fire.
translation:
  language: uk
  text: Віяльна лопата — у нього в руці[a]. Він дочиста очистить свій тік і збере свою пшеницю до комори[b], а полову спалить дотла невгасимим вогнем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «віяльні вила». Це знаряддя використовували, щоб підкидати обмолочене зерно під час віяння.
    reason: lexical_alternative
  - marker: b
    text: Або «сховище» чи «житниця».
    reason: lexical_alternative
lexical_decisions:
- source_word: πτύον
  choice: віяльна лопата
  rationale: Назва сільськогосподарського знаряддя, яким підкидали обмолочене зерно, щоб відділити його від полови; цей відповідник природний у сучасній українській і передає функцію знаряддя.
- source_word: διακαθαριεῖ
  choice: дочиста очистить
  rationale: Префіксальне дієслово наголошує на повному, ретельному очищенні; прислівник «дочиста» зберігає цю підсилювальну силу.
- source_word: ἅλωνα
  choice: тік
  rationale: Точний і усталений український термін на позначення місця, де молотять і віють зерно.
- source_word: σῖτον
  choice: пшеницю
  rationale: У протиставленні полові конкретне «пшениця» природно передає образ зерна, не усуваючи метафоричного характеру вислову.
- source_word: ἀποθήκην
  choice: комори
  rationale: Природна назва приміщення для зберігання врожаю; не надає грецькому слову надмірно вузького значення.
- source_word: ἄχυρον
  choice: полову
  rationale: У контексті віяння «полова» точно позначає легкі непридатні рештки, відділені від зерна.
- source_word: κατακαύσει
  choice: спалить
  rationale: Українське дієслово в цьому контексті природно означає знищення вогнем; повнота дії додатково виразна в самому образі.
- source_word: πυρὶ ἀσβέστῳ
  choice: невгасимим вогнем
  rationale: Орудний відмінок передає засіб дії, а «невгасимий» зберігає значення вогню, якого неможливо загасити.
- source_word: οὗ
  choice: у нього
  rationale: Природно пов’язує вислів із тим, хто приходить у попередньому вірші, зберігаючи належність знаряддя без важкої буквальної конструкції.
theological_decisions:
- issue: Образ суду через відділення пшениці від полови
  choice: Збережено конкретну сільськогосподарську метафору та майбутні дії без пояснення, кого саме символізують пшениця й полова.
  alternative: Прямо назвати пшеницю праведними, а полову нечестивими.
  rationale: Сам текст залишає значення в образній формі; переклад не повинен замінювати метафору богословським тлумаченням.
- issue: Характер невгасимого вогню
  choice: Передано буквально як «невгасимий вогонь» без уточнення тривалості чи способу покарання.
  alternative: Розгорнути вислів як пояснення про вічне покарання або остаточне знищення.
  rationale: Прикметник ἄσβεστος означає те, чого не можна загасити; ширші доктринальні висновки не слід вносити до перекладу.
translation_notes:
  register: Сучасна літературна українська з урочистим, але доступним звучанням. Збережено стислий ритм вислову, конкретну аграрну образність і суворий тон суду; займенник щодо особи, яка приходить, подано з малої літери відповідно до нейтральної сучасної орфографічної практики.
