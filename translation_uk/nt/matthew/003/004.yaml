base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/004.yaml
  text: John himself wore clothing made of camel’s hair and a leather belt around his waist[c][b][a], and his food was locusts and wild honey.
translation:
  language: uk
  text: Сам Іван носив одяг із верблюжої шерсті[b][c] та шкіряний пояс навколо талії[a], а їжею йому були сарана й дикий мед.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Одяг Івана нагадує вигляд пророка Іллі в 2 Царів 1:8; цей перегук важливий для того, як Матвій змальовує Івана.
    reason: cross_reference
  - marker: b
    text: 'Або: «мав одяг із верблюжої шерсті».'
    reason: lexical_alternative
  - marker: c
    text: 'Або: «носив одяг, зроблений із верблюжої шерсті».'
    reason: previous_rendering
lexical_decisions:
- source_word: αὐτὸς δὲ ὁ Ἰωάννης
  choice: Сам Іван
  rationale: αὐτός має підсилювальне значення, передане словом «сам»; δέ тут є слабким переходом і не потребує окремого слова в природній українській оповіді.
- source_word: εἶχεν τὸ ἔνδυμα αὐτοῦ
  choice: носив одяг
  rationale: Буквально εἶχεν означає «мав», але в описі вбрання природне українське «носив» точно передає тривалий стан і не створює хибного враження про замовлення одягу.
- source_word: ἀπὸ τριχῶν καμήλου
  choice: із верблюжої шерсті
  rationale: ἀπό тут позначає матеріал; «із верблюжої шерсті» є ясним і природним відповідником.
- source_word: ζώνην δερματίνην
  choice: шкіряний пояс
  rationale: ζώνη означає пояс, а δερματίνη уточнює, що він був зі шкіри.
- source_word: περὶ τὴν ὀσφὺν αὐτοῦ
  choice: на стегнах
  rationale: ὀσφύς позначає ділянку попереку або стегон; усталений український вислів «пояс на стегнах» природно передає образ без архаїчного «на чреслах».
- source_word: ἡ δὲ τροφὴ ἦν αὐτοῦ
  choice: а їжею йому були
  rationale: Конструкція природно відтворює іменний присудок і легкий протиставно-продовжувальний відтінок δέ.
- source_word: ἀκρίδες
  choice: сарана
  rationale: Стандартне лексичне значення — їстівні комахи, сарана; контекст не дає підстав для іншого тлумачення.
- source_word: μέλι ἄγριον
  choice: дикий мед
  rationale: Прямий і природний відповідник для меду, зібраного в дикій природі.
theological_decisions:
- issue: Пророчий аскетизм і перегук з образом Іллі
  choice: Опис передано прямо, а зв’язок з Іллею винесено у примітку.
  alternative: Посилити в основному тексті словесний перегук з 2 Царів 1:8.
  rationale: Грецький текст просто описує одяг і їжу Івана. Міжтекстовий зв’язок важливий, але його не слід перетворювати на додане тлумачення в основному тексті.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська оповідна мова. Збережено підсилення «сам», уникнуто архаїзмів на кшталт «чресла» та не внесено міжтекстове тлумачення до основного тексту.
