language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων ἐρχομένους ἐπὶ τὸ βάπτισμα ⸀αὐτοῦ εἶπεν αὐτοῖς· Γεννήματα ἐχιδνῶν, τίς ὑπέδειξεν ὑμῖν φυγεῖν ἀπὸ τῆς μελλούσης ὀργῆς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/007.yaml
  text: But when he saw many of the Pharisees and Sadducees coming for his baptism[a], he said to them, “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: uk
  text: 'Та побачивши багатьох із фарисеїв та саддукеїв, які приходили на його хрещення, він сказав їм: «Гадюче поріддя[a], хто застеріг вас утікати від прийдешнього гніву[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Поріддя гадюк».'
    reason: Лексико-стилістична альтернатива до Γεννήματα ἐχιδνῶν.
  - marker: b
    text: 'Або: «гніву, що має прийти».'
    reason: Розгорнутий відповідник дієприкметника μελλούσης, який наголошує на майбутньому настанні.
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: Та побачивши
  rationale: Дієприкметниковий зворот передає аористовий дієприкметник, а «та» природно зберігає перехід і легке протиставлення, виражене δέ.
- source_word: πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: багатьох із фарисеїв та саддукеїв
  rationale: 'Конструкція з родовим відмінком має часткове значення: йдеться про багатьох представників цих груп, а не неодмінно про всіх.'
- source_word: ἐρχομένους ἐπὶ τὸ βάπτισμα αὐτοῦ
  choice: які приходили на його хрещення
  rationale: Формулювання передає рух до Іванового хрещення, не додаючи прямо не висловленого твердження, що всі вони мали намір бути охрещеними чи справді охрестилися.
- source_word: Γεννήματα ἐχιδνῶν
  choice: Поріддя гадюк
  rationale: «Поріддя» передає значення народженого або породженого потомства й зберігає різкий образ пророчого докору; «гадюк» є природним сучасним відповідником множини ἐχιδνῶν.
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: хто підказав вам
  rationale: ὑποδείκνυμι може означати показати, вказати або застерегти. «Підказав» зберігає основний образ вказування, тоді як контекст утечі сам передає застережливу силу.
- source_word: φυγεῖν ἀπὸ
  choice: утікати від
  rationale: Відповідник зберігає безпосередній образ нагальної втечі, а не лише загальніше уникнення наслідків.
- source_word: τῆς μελλούσης ὀργῆς
  choice: від прийдешнього гніву
  rationale: «Прийдешній» передає те, що має настати, а «гнів» зберігає силу ὀργή і не послаблює його до загального «суду» чи «покарання».
theological_decisions:
- issue: Кого охоплює звернення до фарисеїв і саддукеїв
  choice: Іван звертається до багатьох представників цих двох груп, які прийшли до його хрещення.
  alternative: Звернення характеризує всіх фарисеїв і саддукеїв без винятку.
  rationale: Часткова конструкція πολλοὺς τῶν вказує на багатьох із цих груп і не дає підстав поширювати вислів на кожного їхнього представника.
- issue: Значення ὀργή у вислові про майбутнє
  choice: гнів
  alternative: суд; покарання
  rationale: «Гнів» безпосередньо передає ὀργή та зберігає есхатологічну й богословську напругу, не ототожнюючи сам гнів лише з його судовим наслідком.
translation_notes:
  register: Сучасна літературна українська з урочистою, але зрозумілою біблійною тональністю. Різкість Іванового докору збережено без додаткового конфесійного тлумачення. Маркери приміток поставлено біля тих висловів, яких примітки фактично стосуються.
