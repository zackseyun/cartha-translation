  text: καὶ ἰδοὺ φωνὴ ἐκ τῶν οὐρανῶν λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/017.yaml
  text: And behold[a], a voice from the heavens said, “This is my beloved Son[b], with whom I am well pleased.”
translation:
  language: uk
  text: 'І ось, голос із небес[a] промовив: «Це мій улюблений Син, якого я вподобав[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «з неба». У грецькому тексті вжито множину — «із небес».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальніше: «у якому я вподобав».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: І ось
  rationale: «Ось» природно виконує функцію грецького вказівного дискурсивного маркера, привертаючи увагу до урочистої події.
- source_word: φωνὴ
  choice: голос
  rationale: У контексті йдеться про виразний голос, який промовляє, а не просто про звук.
- source_word: ἐκ τῶν οὐρανῶν
  choice: із небес
  rationale: Збережено множину грецького тексту; український вислів «із небес» звучить природно й урочисто.
- source_word: λέγουσα
  choice: промовив
  rationale: Дієприкметник, що вводить пряму мову, передано особовим дієсловом; «промовив» природніше українською і зберігає урочистий тон.
- source_word: Οὗτός ἐστιν
  choice: Це
  rationale: Природний український відповідник ототожнювальної конструкції без зайвого буквального «цей є».
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: мій улюблений Син
  rationale: Передано і синівство, і значення ἀγαπητός — «улюблений». Велика літера в слові «Син» позначає його вживання щодо Ісуса в прямій небесній заяві.
- source_word: ἐν ᾧ εὐδόκησα
  choice: яким я задоволений
  rationale: Природна українська ідіома передає Боже благовоління та схвалення, не перетворюючи аорист на твердження лише про одноразову минулу дію. Буквальнішу конструкцію з «у якому» подано в примітці.
theological_decisions:
- issue: Небесна заява про синівство Ісуса
  choice: мій улюблений Син
  alternative: мій любий Син
  rationale: Переклад прямо зберігає синівство та особливу любов, виражені грецьким текстом, не додаючи пояснювальної доктринальної термінології.
- issue: Значення ἐν ᾧ εὐδόκησα
  choice: яким я задоволений
  alternative: у якому я знайшов уподобання
  rationale: Основний текст передає вислів природною сучасною українською, а примітка зберігає формальну будову оригіналу й можливий відтінок уподобання.
translation_notes:
  register: Сучасна літературна українська з помірно урочистим біблійним звучанням. Синтаксис спрощено відповідно до природного українського мовлення, але множину «небес» і ключові образи оригіналу збережено. Займенники щодо Бога подано з малої літери за загальною сучасною орфографічною практикою; «Син» — з великої як контекстуальне найменування Ісуса.
