  text: καὶ μὴ δόξητε λέγειν ἐν ἑαυτοῖς· Πατέρα ἔχομεν τὸν Ἀβραάμ, λέγω γὰρ ὑμῖν ὅτι δύναται ὁ θεὸς ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/009.yaml
  text: And do not presume to say among yourselves[a], ‘We have Abraham as our father,’ for I tell you that God is able to raise up children for Abraham from these stones.
translation:
  language: uk
  text: 'І не думайте казати між собою[a]: «Ми маємо Авраама за батька», бо кажу вам: Бог може породити з цього каміння дітей Авраамові.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «казати в собі» або «казати собі». Грецький вислів може означати як внутрішню розмову із собою, так і те, що вони говорять між собою як група.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δόξητε
  choice: не надумайте
  rationale: Передає заборону навіть починати плекати самовпевнене припущення; природно звучить у сучасній українській і не зводить вислів лише до нейтрального мислення.
- source_word: λέγειν ἐν ἑαυτοῖς
  choice: казати між собою
  rationale: Множинний зворот допускає як внутрішнє самонавіювання, так і розмову всередині групи. Основний текст природно відбиває груповий вимір, а примітка зберігає іншу можливість.
- source_word: Πατέρα ἔχομεν τὸν Ἀβραάμ
  choice: Наш батько — Авраам
  rationale: Природна українська форма твердження про походження, яка зберігає наголос на Авраамові як предкові та не додає богословських висновків.
- source_word: λέγω γὰρ ὑμῖν
  choice: Бо кажу вам
  rationale: Зберігає пояснювальне γάρ і урочисту формулу прямої мови без неприродної буквальності.
- source_word: δύναται
  choice: може
  rationale: У сучасній українській природно й прямо виражає Божу спроможність; контекст ясно вказує не на дозвіл, а на силу.
- source_word: ἐκ τῶν λίθων τούτων
  choice: з цього каміння
  rationale: Збірний іменник «каміння» природний українською та точно зберігає образ і вказівне значення.
- source_word: ἐγεῖραι
  choice: підняти
  rationale: Формально зберігає дієслівний образ ἐγείρω та його біблійний відтінок, не уточнюючи механізму появи нащадків і не перетворюючи вислів на явну згадку про воскресіння.
- source_word: τέκνα
  choice: дітей
  rationale: Гендерно охопне позначення дітей або нащадків, відповідне грецькому τέκνα.
- source_word: τῷ Ἀβραάμ
  choice: Авраамові
  rationale: Давальний відмінок природно передає дітей, поставлених у родинний зв’язок з Авраамом, і зберігає лаконічність джерела.
theological_decisions:
- issue: Значення походження від Авраама в Івановій пересторозі
  choice: Текст відкидає самовпевнену опору на фізичне походження від Авраама як достатню підставу безпеки перед Богом.
  alternative: Розуміти вислів як заперечення історичного батьківства Авраама щодо Ізраїлю або як твердження про заміну етнічного Ізраїлю.
  rationale: Іван прямо викриває покладання на родовід, але цей вірш сам по собі не заперечує історичного походження й не формулює ширшої доктрини заміни.
- issue: Образ «підняти дітей»
  choice: Зберегти образний вислів без уточнення, яким саме чином Бог створить або поставить Авраамові нащадків.
  alternative: Передати як «створити нащадків» або витлумачити як воскресіння.
  rationale: У контексті йдеться про Божу силу дати Авраамові дітей навіть із каміння; буквальний образ залишає навмисну риторичну силу та не нав’язує зайвого пояснення.
translation_notes:
  register: Сучасна стандартна українська з гідним, виразним і доступним синтаксисом. «Не надумайте» передає застереження від самовпевненої думки; тире в родовідній заяві робить її природною українською. Усі образи й богословська напруга джерела збережені без конфесійного уточнення.
