  terminology: Ім'я «Авраам», «Бог» і «діти» вжито коректно. Формула «маємо Авраама за батька» виразніше зберігає самовпевнену заяву про походження, наявну в грецькому Πατέρα ἔχομεν τὸν Ἀβραάμ, ніж номінативне «Наш батько — Авраам».
