source:
  edition: SBLGNT
  text: ⸂βαπτισθεὶς δὲ⸃ ὁ Ἰησοῦς ⸂εὐθὺς ἀνέβη⸃ ἀπὸ τοῦ ὕδατος· καὶ ἰδοὺ ⸀ἠνεῴχθησαν οἱ οὐρανοί, καὶ εἶδεν ⸀πνεῦμα θεοῦ καταβαῖνον ὡσεὶ ⸀περιστερὰν ἐρχόμενον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/016.yaml
  text: And when Jesus was baptized[a], he immediately came up from the water. And behold, the heavens were opened[c][b], and he saw the Spirit of God descending like a dove and coming upon him.
translation:
  language: uk
  text: А коли Ісус був охрещений, Він відразу вийшов із води.[a] І ось небеса відкрилися, і Він побачив Духа Божого, Який спускався, немов голуб, і прямував до Нього.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «піднявся від води»; можливий переклад: «вийшов із води».'
    reason: lexical_alternative
  - marker: b
    text: Грецьке слово означає «приходив / прямував», а не конкретно «сідав» або «опускався».
    reason: lexical_alternative
lexical_decisions:
- source_word: βαπτισθεὶς δὲ ὁ Ἰησοῦς
  choice: А охрестившись, Ісус
  rationale: Аористовий пасивний дієприкметник передає дію, що передує головній; український дієприслівник природно зберігає стислий зв’язок дій, а «А» передає м’який оповідний перехід δέ.
- source_word: εὐθὺς ἀνέβη ἀπὸ τοῦ ὕδατος
  choice: відразу вийшов з води
  rationale: «Відразу» передає негайність εὐθύς. У цьому контексті «вийшов з води» природно передає рух угору й геть від води, хоча ἀπό буквально означає «від», що зазначено у примітці.
- source_word: καὶ ἰδοὺ
  choice: І ось
  rationale: Зберігає виразну функцію привернення уваги та звучить природно в сучасній українській оповіді.
- source_word: ἠνεῴχθησαν οἱ οὐρανοί
  choice: небеса відкрилися
  rationale: Множина «небеса» зберігає форму й біблійний образ грецького тексту; українська зворотна форма природно передає пасив.
- source_word: πνεῦμα θεοῦ
  choice: Духа Божого
  rationale: Зберігає родовий зв’язок грецького вислову й у цьому контексті природно позначає Божого Духа, не підмінюючи текст висловом «Святий Дух».
- source_word: καταβαῖνον ὡσεὶ περιστερὰν
  choice: Який спускався, немов голуб
  rationale: «Немов» чітко зберігає порівняння ὡσεὶ й не ототожнює Духа буквально з голубом.
- source_word: ἐρχόμενον ἐπ’ αὐτόν
  choice: і сходив на Нього
  rationale: Передає рух до Ісуса й на Нього. «Сходив» уникає неприродного повтору «приходив» після «спускався» та не додає конкретного значення «сідав».
theological_decisions:
- issue: Чи πνεῦμα θεοῦ слід перекласти загально чи як посилання на Святого Духа
  choice: Духа Божого
  alternative: духа від Бога; Святого Духа
  rationale: Контекст хрещення вказує на Божого Духа, однак переклад зберігає точний вислів джерела й не замінює його ані неозначеним, ані конкретизованішим титулом.
- issue: Чи ὡσεὶ περιστερὰν описує подібність, чи буквально називає Духа голубом
  choice: немов голуб
  alternative: у вигляді голуба
  rationale: Порівняльна частка ὡσεὶ виражає подібність; переклад не уточнює безпідставно, чи йдеться про вигляд, форму або спосіб руху.
- issue: До кого граматично стосується εἶδεν («побачив»)
  choice: Він побачив
  alternative: Ісус побачив; Іван побачив
  rationale: Грецький текст не називає підмет повторно. Велика літера в займеннику відповідає українській біблійній традиції щодо Ісуса, однак сама фраза не додає нового імені й зберігає формальну стислість джерела.
translation_notes:
  register: Сучасна, зрозуміла й водночас гідна оповідна українська. Збережено біблійний образ «небеса» та уваговий вислів «І ось». Займенники щодо Ісуса й Духа Божого подано з великої літери відповідно до поширеної української біблійної практики.
