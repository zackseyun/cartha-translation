- from: А охрестившись, Ісус відразу вийшов з води.[a] І ось небеса відкрилися, і Він побачив Духа Божого, Який спускався, немов голуб, і сходив на Нього.[b]
  to: А коли Ісус був охрещений, Він відразу вийшов із води.[a] І ось небеса відкрилися, і Він побачив Духа Божого, Який спускався, немов голуб, і прямував до Нього.[b]
  rationale: 'Пасивну форму βαπτισθείς передано явно: «коли Ісус був охрещений». Основне «вийшов із води» збережено як природний український відповідник, а примітка чесно зазначає буквальніший напрямок із ἀπό. Другий дієприкметник ἐρχόμενον розрізнено з καταβαῖνον: Дух «спускався» і «прямував до» Ісуса. Маркери приміток стоять безпосередньо після відповідних слів.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:42:55Z'
