  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν ⸂πρὸς αὐτόν⸃· Ἄφες ἄρτι, οὕτως γὰρ πρέπον ἐστὶν ἡμῖν πληρῶσαι πᾶσαν δικαιοσύνην. τότε ἀφίησιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/015.yaml
  text: But Jesus answered him[a], “Permit it for now, for in this way it is fitting for us to fulfill all righteousness.” Then he permitted him.
translation:
  language: uk
  text: 'Але Ісус відповів йому: «Дозволь це тепер, бо так нам належить сповнити всю праведність[a]». Тоді він дозволив Йому.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «всю справедливість». Грецьке слово може означати праведність або справедливість; тут «праведність» краще відповідає наголосу Матвія на виконанні Божої волі.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν
  choice: Але Ісус відповів йому
  rationale: Дієприкметник ἀποκριθείς разом із εἶπεν утворює звичний вислів «відповів і сказав», який природно передається одним дієсловом «відповів». δέ позначає протиставлення запереченню Івана в попередньому вірші, тому перекладено «Але».
- source_word: Ἄφες ἄρτι
  choice: Дозволь це тепер
  rationale: У цьому контексті ἀφίημι означає дозволити дію, а не «простити» чи «залишити». «Тепер» передає безпосередній часовий відтінок ἄρτι, не додаючи тверджень про подальший розвиток подій.
- source_word: οὕτως γὰρ
  choice: бо так
  rationale: Стисле й природне українське формулювання зберігає вказівку на щойно названий спосіб дії — хрещення Ісуса Іваном.
- source_word: πρέπον ἐστὶν ἡμῖν
  choice: нам належить
  rationale: πρέπον позначає те, що є належним, відповідним і доречним. Вислів «нам належить» природний українською та зберігає моральну вагу сказаного.
- source_word: πληρῶσαι
  choice: сповнити
  rationale: «Сповнити» зберігає характерний для Євангелія від Матвія відтінок здійснення Божої волі або задуму й не звужує значення до простого завершення дії.
- source_word: πᾶσαν δικαιοσύνην
  choice: всю праведність
  rationale: Буквально й змістовно зберігає широкий вислів грецького тексту. «Праведність» тут краще відповідає контексту виконання Божої волі, тоді як можливе значення «справедливість» подано у примітці.
- source_word: τότε ἀφίησιν αὐτόν
  choice: Тоді він дозволив Йому
  rationale: Історичний теперішній час ἀφίησιν природно передано минулим часом. Повтор дієслова «дозволив» відтворює повтор ἀφίημι; займенники зберігають лаконічність грецького тексту, а контекст указує на Івана та Ісуса.
theological_decisions:
- issue: Значення вислову «всю праведність»
  choice: Широке означення виконання того, що відповідає Божій праведній волі в цій ситуації, зокрема прийняття Ісусом хрещення від Івана.
  alternative: Виконання всіх вимог закону або наголос передусім на справедливості.
  rationale: Грецький вислів не слід ані звужувати до суто юридичних вимог, ані розгортати в доктрину, якої сам вірш прямо не формулює. «Праведність» зберігає богословську широту й характерне для Матвія звучання.
- issue: Спільний суб’єкт у «нам належить»
  choice: 'Збережено множину першої особи без пояснювального розширення: Ісус говорить про Себе та Івана як учасників цієї належної дії.'
  alternative: Перефразувати так, ніби йдеться лише про обов’язок Ісуса або про загальний обов’язок усіх людей.
  rationale: Грецьке ἡμῖν прямо означає «нам»; текст не деталізує ширшого богословського змісту цієї множини, тому переклад не повинен його нав’язувати.
translation_notes:
  register: Сучасна нормативна українська мова з гідним, але доступним біблійним звучанням. Синтаксис стислий і близький до грецького, без неприродних кальок. Займенник «Йому» написано з великої літери за усталеною українською практикою шанобливого позначення Ісуса.
