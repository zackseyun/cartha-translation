  source_fidelity: The draft correctly renders the imperative ποιήσατε, the inferential οὖν, and the collective singular καρπόν. «Плід, гідний покаяння» is possible, but in contemporary Ukrainian «гідний покаяння» can be read as describing something deserving repentance, rather than fruit corresponding to repentance. The revised wording makes the genitive’s correspondence sense explicit without adding theological interpretation.
  naturalness: «Тож принесіть плід, що відповідає покаянню» is natural modern Ukrainian and retains the compact biblical-register exhortation. «Принесіть плід» works idiomatically for the metaphor.
  terminology: «Покаяння» is the established Ukrainian biblical equivalent for μετάνοια in this context. No denominationally specific wording has been introduced.
