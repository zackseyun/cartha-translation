base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/008.yaml
  text: Therefore[a], produce fruit worthy of repentance.
translation:
  language: uk
  text: Тож принесіть плід, що відповідає покаянню[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «плід, гідний покаяння».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσατε
  choice: принесіть
  rationale: Аористовий наказовий спосіб, 2-га особа множини, передає рішучий заклик. У сполученні з образом плоду українське «принесіть плід» природніше за буквальне «зробіть плід» і зберігає дієву силу наказу.
- source_word: οὖν
  choice: тож
  rationale: Передає висновок із попереднього застереження та природно пов’язує цей наказ із контекстом.
- source_word: καρπὸν
  choice: плід
  rationale: Збережено однину оригіналу; слово вжито метафорично щодо видимих наслідків або вчинків.
- source_word: ἄξιον
  choice: гідний
  rationale: Прямо передає відповідність і належність, виражену ἄξιος із родовим відмінком, не стверджуючи, що вчинки заслуговують покаяння.
- source_word: μετανοίας
  choice: покаяння
  rationale: Усталений і природний відповідник, який у цьому контексті означає справжню внутрішню переміну й навернення у відповідь на заклик Івана.
theological_decisions:
- issue: Значення вислову καρπὸν ἄξιον τῆς μετανοίας
  choice: Наказ принести видимий плід, що відповідає справжньому покаянню
  alternative: Плід, яким людина заслуговує покаяння, або плід, рівноцінний покаянню
  rationale: Конструкція з родовим відмінком виражає відповідність чи належність, а не заслугу. Переклад зберігає моральну вимогу тексту, не перетворюючи вчинки на засіб здобуття покаяння.
translation_notes:
  register: Сучасна нормативна українська мова; стислий, гідний і природний біблійний стиль. «Тож» чітко передає логічний зв’язок, а «принесіть плід» природно відтворює метафору.
