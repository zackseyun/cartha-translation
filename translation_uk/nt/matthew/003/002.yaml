lexical_decisions:
- source_word: καὶ λέγων
  choice: і казав
  rationale: Природно передає сполучник і дієприкметник теперішнього часу, пов’язуючи вислів із попереднім віршем, без додавання вужчого значення «проповідував».
- source_word: Μετανοεῖτε
  choice: Покайтеся
  rationale: У сучасній українській біблійній і загальній мові це стислий, природний заклик до докорінної зміни думок, настанови й життєвого напряму; примітка запобігає звуженню значення лише до почуття провини.
- source_word: ἤγγικεν
  choice: наблизилося
  rationale: 'Доконана форма передає грецький перфект: Царство вже наблизилося й тепер перебуває близько.'
- source_word: γὰρ
  choice: бо
  rationale: Стисло й природно вводить підставу для попереднього заклику.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Небесне Царство
  rationale: Усталений і природний український відповідник характерного для Матвія вислову; зберігає широкий зміст царювання та царської влади, не зводячи його до одного аспекту.
theological_decisions:
- issue: Значення вислову «Небесне Царство»
  choice: Збережено Матвієве формулювання «Небесне Царство».
  alternative: «Боже царювання» або «Царство Бога»
  rationale: Прямий відповідник зберігає характерну лексику й богословську образність Матвія, не підмінюючи її пояснювальним перефразуванням.
- issue: Обсяг заклику μετανοεῖτε
  choice: «Покайтеся» з поясненням у примітці
  alternative: «Змініть своє мислення»
  rationale: «Покайтеся» є природним наказовим закликом українською та охоплює внутрішню переорієнтацію, тоді як буквальніший варіант може прозвучати як суто інтелектуальна зміна думки.
translation_notes:
  register: Сучасна літературна українська з урочистою, але зрозумілою мовою. Вислів починається малою літерою, оскільки синтаксично продовжує попередній вірш.
