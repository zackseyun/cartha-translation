  source_fidelity: Переклад точно передає часовий наголос ἤδη («вже»), м’який зв’язок δέ («І»), образ сокири, що κέῖται при корені, висновкове οὖν («Отже»), а також теперішні пасивні форми ἐκκόπτεται і βάλλεται через природну неозначено-особову конструкцію «зрубують і кидають». «Доброго плоду» коректно відтворює однину καρπὸν καλὸν. Образ «вогню» не тлумачиться понад текст.
  naturalness: Текст звучить природно в сучасній нормативній українській і водночас зберігає стислий біблійний регістр. «При корені дерев» є зрозумілим і стилістично доречним способом передати образ близькості та готовності сокири.
  terminology: «Сокира», «дерево», «добрий плід», «зрубують» і «вогонь» є точними, усталеними та доступними відповідниками. Жодних конфесійно забарвлених уточнень не додано.
