id: MAT.3.10
reference: Matthew 3:10
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ἤδη ⸀δὲ ἡ ἀξίνη πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται· πᾶν οὖν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/010.yaml
  text: And already the axe is laid at the root of the trees[a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: uk
  text: І сокира вже лежить при корені дерев.[a] Отже, кожне дерево, яке не приносить доброго плоду, зрубують і кидають у вогонь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «сокиру вже приставлено до кореня дерев».'
    reason: 'Лексико-синтаксична альтернатива: κεῖται може описувати як те, що «лежить», так і те, що вже покладене або встановлене на місце.'
lexical_decisions:
- source_word: ἤδη
  choice: вже
  rationale: Передає часовий наголос і невідкладність наближеного суду.
- source_word: δὲ
  choice: І
  rationale: У цьому контексті частка має м’яко сполучне, а не виразно протиставне значення.
- source_word: ἀξίνη
  choice: сокира
  rationale: Звичайна сучасна назва знаряддя для рубання, що точно зберігає образ.
- source_word: πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται
  choice: лежить при корені дерев
  rationale: «Лежить» безпосередньо передає κεῖται, а «при корені» природно виражає близькість і готовність сокири до удару, не перетворюючи образ на вже розпочату дію.
- source_word: πᾶν οὖν δένδρον
  choice: Отже, кожне дерево
  rationale: «Отже» передає висновкову силу οὖν, а «кожне дерево» зберігає всеохопність πᾶν.
- source_word: μὴ ποιοῦν καρπὸν καλὸν
  choice: яке не приносить доброго плоду
  rationale: Природний український вислів про дерево, який передає тривалу характерну дію дієприкметникової конструкції та зберігає моральну метафору «доброго плоду».
- source_word: ἐκκόπτεται
  choice: зрубують
  rationale: У контексті дерева це найприродніший відповідник; теперішній час зберігає виразність грецької форми.
- source_word: εἰς πῦρ βάλλεται
  choice: кидають у вогонь
  rationale: Чітке сучасне формулювання, яке зберігає силу βάλλεται та невитлумачений образ вогню.
theological_decisions:
- issue: Значення образу вогню
  choice: Збережено формулювання «у вогонь» без пояснювального розширення.
  alternative: Уточнити як есхатологічний суд, тимчасову кару або пекельний вогонь.
  rationale: Текст безсумнівно змальовує суд, але в цьому вірші не конкретизує природу вогню; переклад не звужує образ до певного доктринального тлумачення.
translation_notes:
  register: Сучасна нормативна українська мова з гідним, доступним біблійним стилем. Вислів «при корені» дещо піднесений, але зрозумілий і добре зберігає стислий образ оригіналу.
