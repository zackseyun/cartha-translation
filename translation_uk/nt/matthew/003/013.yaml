source:
  edition: SBLGNT
  text: Τότε παραγίνεται ὁ Ἰησοῦς ἀπὸ τῆς Γαλιλαίας ἐπὶ τὸν Ἰορδάνην πρὸς τὸν Ἰωάννην τοῦ βαπτισθῆναι ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/013.yaml
  text: Then Jesus comes from Galilee to the Jordan[a], to John[c][b], to be baptized by him.
translation:
  language: uk
  text: Тоді Ісус приходить із Галілеї до Йордану, до Івана, щоб охреститися в нього.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «щоб він охрестив Його».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Тоді
  rationale: Природний український часовий маркер, що вводить наступну подію оповіді.
- source_word: παραγίνεται
  choice: приходить
  rationale: Теперішній час зберігає виразність грецького історичного теперішнього; дієслово передає прибуття Ісуса до місця й особи.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: із Галілеї
  rationale: Прийменник ἀπό позначає вихідний пункт; «із Галілеї» природно передає рух звідти.
- source_word: ἐπὶ τὸν Ἰορδάνην
  choice: до Йордану
  rationale: ἐπί зі знахідним відмінком у цьому контексті позначає рух у напрямку до Йордану.
- source_word: πρὸς τὸν Ἰωάννην
  choice: до Івана
  rationale: πρός зі знахідним відмінком позначає рух до особи; титул не додається, бо його немає в цьому вірші.
- source_word: τοῦ βαπτισθῆναι
  choice: щоб охреститися
  rationale: Артикльований інфінітив виражає мету; конструкція «щоб охреститися» ясно й природно передає її українською.
- source_word: ὑπ’ αὐτοῦ
  choice: в нього
  rationale: У сучасній українській «охреститися в когось» природно виражає особу, яка здійснює хрещення, не повторюючи імені Івана.
theological_decisions:
- issue: Історичний теперішній час παραγίνεται
  choice: 'Збережено теперішній час: «приходить»'
  alternative: 'Минулий час: «прийшов»'
  rationale: Так зберігається оповідна виразність грецького тексту без зміни змісту.
- issue: Назва Івана
  choice: Ужито лише «Івана»
  alternative: «Івана Хрестителя»
  rationale: Оригінал цього вірша містить тільки ім’я; додавання титулу було б пояснювальним розширенням.
- issue: Агент хрещення в ὑπ’ αὐτοῦ
  choice: «в нього», де займенник стосується Івана
  alternative: «ним» або «Іваном»
  rationale: Обраний вислів є природним для української мови та зберігає займенникову форму оригіналу.
translation_notes:
  register: Сучасна нормативна українська мова; лаконічний, гідний оповідний стиль. Історичний теперішній час збережено. Написання «Йордан» відповідає усталеній біблійній назві; «Іван» є природною українською формою імені.
