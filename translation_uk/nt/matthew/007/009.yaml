  terminology: «Чоловік» є прийнятним відповідником ἄνθρωπος в цій репрезентативній однині, а примітка коректно пояснює узагальнене вживання без зміни основного тексту. «Хліб», «камінь» і «подасть» точні та стилістично доречні.
