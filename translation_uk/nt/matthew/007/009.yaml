id: MAT.7.9
reference: Matthew 7:9
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ἢ τίς ⸀ἐστιν ἐξ ὑμῶν ἄνθρωπος, ὃν ⸀αἰτήσει ὁ υἱὸς αὐτοῦ ἄρτον— μὴ λίθον ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/009.yaml
  text: Or what man is there among you whose son asks him for bread[a], and he will give him a stone?
translation:
  language: uk
  text: Або чи є серед вас такий чоловік[a], у якого син попросить хліба, — невже він подасть йому камінь?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «така людина». Грецьке слово тут ужите в узагальненому значенні.'
    reason: Лексична альтернатива та пояснення репрезентативного чоловічого роду.
lexical_decisions:
- source_word: ἢ
  choice: Або
  rationale: Вводить наступне риторичне порівняння та природно продовжує думку попереднього вірша.
- source_word: τίς ἐστιν ἐξ ὑμῶν ἄνθρωπος
  choice: чи є серед вас такий чоловік
  rationale: Передає питальну конструкцію, частковий вислів «серед вас» і граматично чоловічий репрезентативний образ оригіналу природною українською мовою.
- source_word: ὃν αἰτήσει ὁ υἱὸς αὐτοῦ ἄρτον
  choice: у якого син попросить хліба
  rationale: Природна українська перебудова відносної конструкції. Майбутній час «попросить» відповідає αἰτήσει, а «хліба» є нормативним керуванням дієслова «просити» в значенні прохання дати щось.
- source_word: μὴ
  choice: невже
  rationale: Позначає риторичне питання, на яке очікується заперечна відповідь; «невже» чітко й природно передає це очікування.
- source_word: λίθον ἐπιδώσει αὐτῷ
  choice: він подасть йому камінь
  rationale: «Подасть» зберігає відтінок передавання предмета адресатові, а «камінь» прямо відтворює контраст із хлібом.
theological_decisions:
- issue: Репрезентативна мова чоловічого роду
  choice: такий чоловік
  alternative: така людина / хто з вас
  rationale: Оригінал уживає ἄνθρωπος у граматично чоловічій однині як представника ширшої групи. Основний текст зберігає цей образ, а примітка пояснює його узагальнений характер, не звужуючи звернення лише до чоловіків.
- issue: Заперечне очікування риторичного питання
  choice: невже він подасть
  alternative: а він подасть
  rationale: Частка μή сигналізує, що відповідь має бути «ні». Українське «невже» зберігає цю прагматичну силу, не перетворюючи питання на пряме твердження.
translation_notes:
  register: Сучасна, гідна й загальнозрозуміла українська мова. Конструкція з «невже» виразно передає риторичність, а тире відділяє умову від несподіваного й очевидно неприйнятного наслідку.
