  source_fidelity: 'Текст точно передає риторичне запитання: ἢ — «Або», partitive ἐξ ὑμῶν — «серед вас», ἄνθρωπος — «чоловік», прохання сина про хліб і очікувану заперечну відповідь на μὴ. Конструкція «у якого син попросить хліба» природно виражає, що син просить хліба у батька; «невже він подасть йому камінь?» належно передає негативно очікувану відповідь.'
