  source_fidelity: «Кожне дерево, яке не родить доброго плоду, зрубують і кидають у вогонь» точно передає розподільне πᾶν δένδρον, характеристичний теперішній дієприкметник μὴ ποιοῦν, а також два теперішні пасиви ἐκκόπτεται й βάλλεται. Неозначено-особові форми природно відтворюють узагальнений пасив без додавання виконавця. «У вогонь» не нав’язує означеності, якої в грецькому тексті немає.
  naturalness: Текст нормативний, виразний і природний для сучасної української. «Родить доброго плоду» є усталеним і зрозумілим біблійно-образним висловом; родовий відмінок після заперечення стилістично й граматично доречний. «Зрубують і кидають» добре зберігає прислівно-попереджувальний характер вислову.
  terminology: «Добрий плід» зберігає морально-оцінний зміст καλός у контексті. «Вогонь» лишається образом суду без конфесійного уточнення його часу чи остаточного характеру. Примітка a подає реальну лексичну альтернативу, а примітка b коректно зберігає богословську невизначеність тексту.
