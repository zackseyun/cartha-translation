  text: Every tree not producing good fruit is cut down and thrown into the fire[a][b].
translation:
  language: uk
  text: Кожне дерево, яке не родить доброго плоду, зрубують і кидають у вогонь.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «яке не приносить доброго плоду».'
    reason: lexical_alternative
  - marker: b
    text: «Вогонь» є образом суду; сам вірш не уточнює, чи йдеться передусім про суд у часі, наприкінці віку, чи про обидва.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶν δένδρον
  choice: Кожне дерево
  rationale: 'πᾶν з іменником в однині має розподільне значення: йдеться про кожне дерево окремо. «Кожне дерево» природно передає прислівний характер вислову.'
- source_word: μὴ ποιοῦν
  choice: яке не родить
  rationale: Дієприкметник теперішнього часу позначає характерну або тривалу дію. У сполученні з деревом і плодом українське «родить» природніше за буквальне «робить» і точно передає плодоношення.
- source_word: καρπὸν καλὸν
  choice: доброго плоду
  rationale: καλός у цьому контексті означає добрий, належний або якісний. Родовий відмінок після заперечного «не родить» є природним у сучасній українській, не змінюючи змісту грецького знахідного.
- source_word: ἐκκόπτεται
  choice: зрубують
  rationale: Пасивна форма описує звичну долю такого дерева. Неозначено-особова конструкція «зрубують» природно передає грецький пасив, а дієслово точно відповідає дії щодо цілого дерева.
- source_word: εἰς πῦρ βάλλεται
  choice: кидають у вогонь
  rationale: Конструкція передає рух усередину вогню. Неозначено-особове «кидають» узгоджується з попереднім «зрубують» і природно відтворює пасив βάλλεται; означеність образу не уточнюється понад контекст.
theological_decisions:
- issue: Образ вогню як суду
  choice: Збережено образ дерева, яке зрубують і кидають у вогонь, без уточнення точного референта вогню.
  alternative: Тимчасовий суд; есхатологічний суд; пекло.
  rationale: Вірш виразно попереджає про суд через сільськогосподарський образ, але сам по собі не визначає точніше його часу чи обсягу. Переклад не звужує богословського змісту.
translation_notes:
  register: Сучасна нормативна українська мова з гідним, зрозумілим звучанням. Неозначено-особові форми «зрубують» і «кидають» природно передають грецькі пасиви. «Родить плід» зберігає звичний біблійний образ; у примітці подано нейтральнішу сучасну альтернативу.
