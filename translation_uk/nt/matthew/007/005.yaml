  text: ὑποκριτά, ἔκβαλε πρῶτον ⸂ἐκ τοῦ ὀφθαλμοῦ σοῦ τὴν δοκόν⸃, καὶ τότε διαβλέψεις ἐκβαλεῖν τὸ κάρφος ἐκ τοῦ ὀφθαλμοῦ τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/005.yaml
  text: Hypocrite[a], first remove the beam from your eye[b], and then you will see clearly to remove the speck from your brother’s eye.
translation:
  language: uk
  text: Лицеміре, спершу вийми зі свого ока балку, і тоді ясно побачиш, як вийняти скалку з ока свого брата.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποκριτά
  choice: Лицеміре!
  rationale: Кличний відмінок однини передає пряме й різке докірливе звертання; знак оклику природно відтворює його силу українською.
- source_word: ἔκβαλε
  choice: вийми
  rationale: Аористовий наказовий спосіб ἐκβάλλω в цій тілесній метафорі природно означає усунути сторонній предмет з ока; «вийми» конкретніше й природніше за буквальне «викинь».
- source_word: πρῶτον
  choice: спершу
  rationale: Точно позначає першочерговість дії та природно звучить у сучасній українській.
- source_word: δοκόν
  choice: колоду
  rationale: δοκός — велика дерев'яна балка. «Колода» зберігає навмисно перебільшений образ і різкий контраст із малою скалкою; «балка» є близькою лексичною альтернативою.
- source_word: διαβλέψεις
  choice: ясно побачиш
  rationale: Передає підсилене значення διαβλέπω — бачити ясно, а не просто бачити.
- source_word: ἐκβαλεῖν
  choice: як вийняти
  rationale: Інфінітив після διαβλέψεις природно передано українською конструкцією «побачиш, як вийняти»; повтор дієслова зберігає зв'язок із попереднім наказом.
- source_word: κάρφος
  choice: скалку
  rationale: κάρφος означає малу суху частинку, тріску або соломинку. «Скалка» створює конкретний і зрозумілий образ стороннього предмета в оці та зберігає контраст із колодою.
- source_word: ἀδελφοῦ
  choice: брата
  rationale: Збережено чоловічий рід і однину грецького ἀδελφός, не звужуючи в самому перекладі образ до пояснювального «одновірця».
theological_decisions:
- issue: Гендерно означений споріднений термін ἀδελφοῦ
  choice: свого брата
  alternative: іншої людини; ближнього; одновірця
  rationale: Грецький текст має іменник чоловічого роду в однині. Буквальне «брата» зберігає форму й образ міжособистісних стосунків у спільноті, не вносячи до тексту ширшого або вужчого тлумачення.
- issue: Зв'язок διαβλέψεις з інфінітивом ἐκβαλεῖν
  choice: ясно побачиш, як вийняти
  alternative: зможеш ясно побачити, щоб вийняти; ясно побачиш і виймешь
  rationale: Конструкція зберігає образ відновленого ясного зору як передумови належної допомоги братові, не перетворюючи майбутній час на окрему обіцянку здатності або результату.
translation_notes:
  register: Сучасна стандартна українська, гідний і водночас виразний повчальний регістр. Збережено навмисну гіперболу та паралелізм двох дій. Примітки не додано, оскільки обрані образи природні українською, а допустимі лексичні варіанти не створюють істотної смислової неоднозначності.
