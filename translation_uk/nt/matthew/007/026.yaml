  text: καὶ πᾶς ὁ ἀκούων μου τοὺς λόγους τούτους καὶ μὴ ποιῶν αὐτοὺς ὁμοιωθήσεται ἀνδρὶ μωρῷ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν ἄμμον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/026.yaml
  text: And everyone who hears these words of mine and does not do them will be like a foolish man[a], who built his house on the sand.
translation:
  language: uk
  text: А кожен, хто слухає ці Мої слова й не виконує їх, буде подібний до нерозумного чоловіка[a], який збудував свій дім на піску.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «нерозумної людини». У грецькому тексті буквально стоїть «нерозумного чоловіка»; у цьому порівнянні чоловік представляє будь-кого, хто слухає, але не виконує.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ ἀκούων
  choice: кожен, хто слухає
  rationale: Субстантивований дієприкметник теперішнього часу має загальне значення; цей вислів природно передає і всеохопність, і тривалу характеристику слухача.
- source_word: μου τοὺς λόγους τούτους
  choice: ці Мої слова
  rationale: Збережено вказівний наголос і належність слів Ісусові; «слова» є простим відповідником λόγους.
- source_word: μὴ ποιῶν αὐτούς
  choice: не виконує їх
  rationale: У цьому контексті ποιέω означає здійснювати почуте на практиці. «Виконує» природніше українською, ніж буквальне «робить їх», і не додає зайвого тлумачення.
- source_word: ὁμοιωθήσεται
  choice: буде подібний до
  rationale: Майбутній пасив виражає уподібнення; українська конструкція з «буде подібний» природна й зберігає форму порівняння.
- source_word: ἀνδρὶ μωρῷ
  choice: нерозумного чоловіка
  rationale: ἀνήρ прямо позначає чоловіка, а μωρός тут характеризує його як позбавленого розсудливості. «Нерозумний» звучить гідно й природно та не має надмірно образливого відтінку.
- source_word: ὅστις
  choice: який
  rationale: Займенник вводить пояснювальну частину порівняння; просте «який» достатньо передає його функцію.
- source_word: ᾠκοδόμησεν
  choice: збудував
  rationale: Аорист прямо описує завершену дію будівництва; «збудував» є звичним українським відповідником.
- source_word: αὐτοῦ τὴν οἰκίαν
  choice: свій дім
  rationale: Зворотний присвійний займенник природно співвідносить дім із підметом, а «дім» тут позначає споруду в образі.
- source_word: ἐπὶ τὴν ἄμμον
  choice: на піску
  rationale: Прийменникова конструкція вказує на місце й основу будівництва; українське «на піску» передає цей образ природно.
theological_decisions:
- issue: Чоловічий рід у репрезентативному порівнянні
  choice: нерозумного чоловіка
  alternative: нерозумної людини
  rationale: Грецьке ἀνδρί є іменником чоловічого роду й буквально позначає чоловіка в образі будівничого. Чоловіче позначення збережено, водночас примітка пояснює загальне застосування порівняння.
translation_notes:
  register: Сучасна літературна українська з гідним біблійним звучанням. «Виконує» обрано замість неприродного буквального «робить їх». Займенник «Мої» написано з великої літери відповідно до усталеної української практики шанобливого позначення слів Ісуса.
