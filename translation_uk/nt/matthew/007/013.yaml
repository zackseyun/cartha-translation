source:
  edition: SBLGNT
  text: Εἰσέλθατε διὰ τῆς στενῆς πύλης· ὅτι πλατεῖα ⸂ἡ πύλη⸃ καὶ εὐρύχωρος ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ἀπώλειαν, καὶ πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/013.yaml
  text: Enter through the narrow gate[a]. For wide is the gate and broad is the road that leads to destruction[c][b], and many are those who enter through it.
translation:
  language: uk
  text: Увійдіть через вузьку браму. Бо широка брама й простора дорога, що веде до загибелі[a], і багато тих, хто входять через неї[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «до знищення» чи «до руїни». Грецьке слово ἀπώλεια може означати загибель, знищення або руїну.'
    reason: lexical_alternative
  - marker: b
    text: Займенник «неї», ймовірно, стосується брами; однак у грецькій мові і «брама», і «дорога» — жіночого роду.
    reason: referential_ambiguity
lexical_decisions:
- source_word: Εἰσέλθατε
  choice: Увійдіть
  rationale: Аористовий наказовий спосіб, друга особа множини; «Увійдіть» природно й безпосередньо передає наказ.
- source_word: διὰ τῆς στενῆς πύλης
  choice: через вузьку браму
  rationale: διά з родовим відмінком позначає рух крізь або через щось; «брама» добре зберігає конкретний образ входу.
- source_word: ὅτι
  choice: Бо
  rationale: Сполучник вводить пояснення до попереднього наказу; «бо» стисло й природно передає цей зв’язок.
- source_word: πλατεῖα ἡ πύλη
  choice: широка брама
  rationale: Передає просторове значення πλατύς і зберігає контраст із вузькою брамою.
- source_word: εὐρύχωρος ἡ ὁδός
  choice: простора дорога
  rationale: εὐρύχωρος означає «просторий, широкий»; «простора» виразно передає легкість і місткість дороги та природно звучить українською.
- source_word: ἡ ἀπάγουσα
  choice: що веде
  rationale: Дієприкметник теперішнього часу характеризує дорогу за її напрямком; підрядна конструкція є природною українською.
- source_word: εἰς τὴν ἀπώλειαν
  choice: до загибелі
  rationale: ἀπώλεια може означати загибель, знищення або руїну; «загибель» зберігає серйозність попередження, не конкретизуючи понад текст.
- source_word: πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς
  choice: і багато тих, хто входить нею
  rationale: Конструкція зберігає наголос на численності. Займенник «нею» без доданого іменника формально відтворює грецьке αὐτῆς і не усуває його можливу співвіднесеність силоміць.
theological_decisions:
- issue: Значення ἀπώλεια в Ісусовому попередженні
  choice: загибель
  alternative: знищення; руїна; погибель
  rationale: Грецьке слово називає згубний кінець, але сам вірш не визначає докладно його богословської природи. «Загибель» передає вагу вислову без надмірного доктринального уточнення.
- issue: Референт αὐτῆς у завершальній фразі
  choice: нею
  alternative: через ту браму
  rationale: За змістом займенник найімовірніше стосується брами, крізь яку входять, однак у грецькій і «брама», і «дорога» жіночого роду. Українське «нею» зберігає формальну неоднозначність оригіналу.
translation_notes:
  register: Сучасна літературна українська з урочистою, але зрозумілою синтаксичною будовою. Конкретні образи брами й дороги збережено; архаїчних форм і конфесійно маркованої лексики уникнуто.
