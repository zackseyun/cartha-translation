  text: πολλοὶ ἐροῦσίν μοι ἐν ἐκείνῃ τῇ ἡμέρᾳ· Κύριε κύριε, οὐ τῷ σῷ ὀνόματι ἐπροφητεύσαμεν, καὶ τῷ σῷ ὀνόματι δαιμόνια ἐξεβάλομεν, καὶ τῷ σῷ ὀνόματι δυνάμεις πολλὰς ἐποιήσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/022.yaml
  text: Many will say to me on that day[a], ‘Lord, Lord, did we not prophesy in your name, and cast out demons in your name, and do many mighty works in your name?’
translation:
  language: uk
  text: 'Багато хто скаже Мені того дня: «Господи, Господи, хіба ми не Твоїм ім’ям пророкували, і Твоїм ім’ям виганяли демонів, і Твоїм ім’ям чинили багато могутніх діянь[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «звершили багато чудес» чи «вчинили багато діянь сили». Грецький вислів буквально означає «багато сил» і в Євангеліях часто позначає чудесні діяння.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: Багато хто
  rationale: Субстантивований прикметник чоловічого роду в множині природно передається українським «багато хто» без додавання слова «людей».
- source_word: ἐροῦσίν μοι
  choice: скаже Мені
  rationale: Майбутній час λέγω з давальним займенником прямо й природно передано як «скаже Мені»; однина після «багато хто» відповідає українській граматичній нормі.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: того дня
  rationale: Природний український часовий зворот, який зберігає есхатологічний натяк оригіналу без пояснювального розширення.
- source_word: Κύριε κύριε
  choice: Господи, Господи
  rationale: Кличний відмінок і повторення зберігають наполегливість звернення та вагу титулу κύριος.
- source_word: οὐ ... ἐπροφητεύσαμεν
  choice: хіба ми не ... пророкували
  rationale: Частка «хіба» природно передає заперечне запитання, що очікує ствердної відповіді; «пророкували» є прямим відповідником προφητεύω.
- source_word: τῷ σῷ ὀνόματι
  choice: Твоїм ім’ям
  rationale: Орудний відмінок природно передає дію чи посилання на авторитет імені; триразовий повтор збережено задля риторичної сили.
- source_word: δαιμόνια ἐξεβάλομεν
  choice: виганяли демонів
  rationale: «Виганяли демонів» — ясний і природний український відповідник усталеного в Євангеліях уживання ἐκβάλλω щодо демонів.
- source_word: δυνάμεις πολλὰς ἐποιήσαμεν
  choice: чинили багато могутніх діл
  rationale: Вислів зберігає зв’язок δύναμις із силою та не звужує його значення лише до терміна «чудеса».
theological_decisions:
- issue: Передача κύριος у прямому зверненні до Ісуса
  choice: Господи
  alternative: Учителю; Владико
  rationale: «Господи» зберігає як звичайне значення титулу, так і його христологічну вагу, не додаючи до тексту окремого тлумачення.
- issue: Есхатологічний зміст вислову «того дня»
  choice: того дня
  alternative: у день суду
  rationale: Контекст указує на остаточний суд, однак грецький текст прямо каже лише «того дня»; переклад не робить неявне пояснення частиною основного тексту.
- issue: Значення δυνάμεις у вислові про надприродні діяння
  choice: могутніх діл
  alternative: чудес; діл сили
  rationale: «Могутніх діл» зберігає буквальний зв’язок зі «силою» та євангельське значення чудесних діянь, не усуваючи лексичної широти слова.
translation_notes:
  register: Сучасна літературна українська мова з урочистим, але зрозумілим біблійним звучанням. Повтор «Твоїм ім’ям» навмисно збережено. Займенники у зверненні до Ісуса подано з великої літери відповідно до поширеної української біблійної видавничої традиції.
