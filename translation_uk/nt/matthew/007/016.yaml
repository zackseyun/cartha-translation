  source_fidelity: 'Текст точно передає грецький оригінал: майбутнє «ви розпізнаєте», метафору множинних «плодів», особовий референт займенників і риторичне запитання μήτι з очікуваною заперечною відповіддю. «Тернина» та «будяки» адекватно відтворюють паралельні образи ἀκάνθαι і τρίβολοι, не вносячи тлумачення.'
  naturalness: Фраза звучить природно сучасною нормативною українською та зберігає ясний біблійний регістр. Початкова конструкція «За їхніми плодами ви розпізнаєте їх» виразна й не є неприродною інверсією. Риторичне «Хіба збирають...?» добре функціонує українською.
  terminology: «Плоди» належно зберігає біблійну метафору без звуження до вчинків або наслідків. «Розпізнаєте» доречно передає ἐπιγνώσεσθε в контексті розрізнення людей. Назви рослин і плодів зрозумілі та стилістично узгоджені.
