id: MAT.7.16
reference: Matthew 7:16
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ἀπὸ τῶν καρπῶν αὐτῶν ἐπιγνώσεσθε αὐτούς. μήτι συλλέγουσιν ἀπὸ ἀκανθῶν ⸀σταφυλὰς ἢ ἀπὸ τριβόλων σῦκα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/016.yaml
  text: You will recognize them by their fruits[a]. Do people gather grapes from thorns[b], or figs from thistles?
translation:
  language: uk
  text: За їхніми плодами ви розпізнаєте їх.[a] Хіба збирають виноград із тернини або інжир із будяків?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «За їхніми плодами ви пізнаєте їх».'
    reason: lexical_alternative
  - marker: b
    text: 'Запитання передбачає заперечну відповідь: із тернини не збирають винограду, а з будяків — інжиру.'
    reason: rhetorical_force
lexical_decisions:
- source_word: καρπῶν
  choice: плодами
  rationale: Грецький текст має множину; конкретний образ плодів збережено без тлумачного звуження до вчинків чи результатів.
- source_word: ἐπιγνώσεσθε
  choice: розпізнаєте
  rationale: У цьому контексті дієслово означає впізнати або розпізнати людей за видимими ознаками; майбутній час збережено.
- source_word: μήτι
  choice: Хіба
  rationale: Частка вводить риторичне запитання, на яке очікується заперечна відповідь; українське «хіба» природно передає це очікування.
- source_word: συλλέγουσιν
  choice: збирають
  rationale: Природний український відповідник для збирання врожаю, який зберігає сільськогосподарський образ.
- source_word: ἀκανθῶν
  choice: тернини
  rationale: Назва колючої рослини або чагарнику; «тернина» природно узгоджується з образом збирання плодів і біблійним регістром.
- source_word: σταφυλάς
  choice: виноград
  rationale: Звичний український збірний іменник для виноградних ягід; у цьому контексті природніший за множинне «виноградини».
- source_word: τριβόλων
  choice: будяків
  rationale: Передає колючу бур’янисту рослину зрозумілою сучасною українською мовою.
- source_word: σῦκα
  choice: інжир
  rationale: Сучасна стандартна українська назва плодів смоківниці; форма може природно вживатися збірно після «збирають».
- source_word: αὐτῶν / αὐτούς
  choice: їхніми / їх
  rationale: 'Особовий референт займенників збережено: йдеться про людей, згаданих у контексті.'
theological_decisions:
- issue: Метафоричне значення «плодів» як підстави для розпізнавання людей
  choice: Збережено метафору «за їхніми плодами» без пояснювальної заміни.
  alternative: За їхніми вчинками; за наслідками їхньої діяльності.
  rationale: 'Грецький текст залишає образ містким: плоди можуть охоплювати вчинки, наслідки та інші видимі прояви. Конкретизація звузила б богословську напругу вислову.'
translation_notes:
  register: Сучасна нормативна українська з гідним, загальнозрозумілим біблійним регістром. Інверсію «За їхніми плодами» збережено для наголосу, відповідно до грецького порядку слів. «Хіба» природно позначає риторичне запитання.
