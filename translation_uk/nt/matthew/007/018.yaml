source:
  edition: SBLGNT
  text: οὐ δύναται δένδρον ἀγαθὸν καρποὺς πονηροὺς ⸀ποιεῖν, οὐδὲ δένδρον σαπρὸν καρποὺς καλοὺς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/018.yaml
  text: A good tree cannot produce bad fruit[c][b][a], nor can a rotten tree produce good fruit.
translation:
  language: uk
  text: Добре дерево не може приносити поганих плодів[a], ані гниле дерево — приносити добрих плодів.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «лихих плодів».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δένδρον ἀγαθόν
  choice: добре дерево
  rationale: «Добре» природно передає основне значення ἀγαθός і зберігає як буквальний образ дерева, так і оцінний зміст вислову.
- source_word: οὐ δύναται ... ποιεῖν
  choice: не може приносити
  rationale: Конструкція виражає неможливість, а ποιεῖν із καρπούς у контексті дерева природно передається українським «приносити плоди».
- source_word: καρποὺς πονηρούς
  choice: поганих плодів
  rationale: «Поганих» зберігає широкий негативний зміст πονηρός і природно звучить стосовно якості плодів, не звужуючи образ лише до морального зла.
- source_word: οὐδέ
  choice: ані
  rationale: «Ані» стисло й природно вводить паралельне заперечення та зберігає врівноважену будову грецького вислову.
- source_word: δένδρον σαπρόν
  choice: гниле дерево
  rationale: «Гниле» точно й виразно передає σαπρός — зіпсоване, трухляве або непридатне через гниття.
- source_word: καρποὺς καλούς
  choice: добрих плодів
  rationale: У цьому контексті καλός позначає добру якість плодів; «добрих» утворює ясний контраст із «поганих».
theological_decisions:
- issue: Характер неможливості в метафорі
  choice: Категоричне «не може»
  alternative: «Зазвичай не приносить» або «не повинно приносити»
  rationale: Грецьке οὐ δύναται прямо виражає неспроможність. Переклад зберігає силу твердження, не додаючи доктринальних висновків поза самою метафорою.
translation_notes:
  register: Сучасна нормативна українська мова; вислів стислий, урочистий і зрозумілий. Інверсію родового відмінка після заперечення використано природно для української біблійної прози. Тире в другій частині відновлює пропущене в паралельній конструкції «не може» без зайвого повтору.
