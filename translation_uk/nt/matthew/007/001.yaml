  text: Μὴ κρίνετε, ἵνα μὴ κριθῆτε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/001.yaml
  text: Do not judge[a], so that you may not be judged.
translation:
  language: uk
  text: Не судіть[a], щоб і вас не судили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Не засуджуйте, щоб і вас не засудили». Грецьке дієслово в деяких контекстах може означати «засуджувати», однак «судити» має ширше значення і зберігає повтор того самого слова в обох частинах вірша.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ κρίνετε
  choice: Не судіть
  rationale: Μή із теперішнім наказовим способом виражає заборону. «Не судіть» природно передає її українською та зберігає широкий зміст κρίνω.
- source_word: ἵνα μὴ
  choice: щоб … не
  rationale: Ця конструкція природно передає мету або наслідок, не звужуючи зв’язок між двома частинами вислову.
- source_word: κριθῆτε
  choice: вас не судили
  rationale: Пасивну форму κρίνω передано тим самим українським коренем, що й κρίνετε, аби зберегти лексичний повтор і риторичну симетрію оригіналу. Займенник «вас» природно передає значення другої особи множини в дієслівній формі.
theological_decisions:
- issue: Обсяг значення κρίνω в забороні Ісуса
  choice: Збережено ширше «судити», не звужуючи значення до «засуджувати».
  alternative: Не засуджуйте, щоб і вас не засудили.
  rationale: Сам вірш не визначає всіх меж забороненого судження; найближчий контекст уточнює її зміст. Ширший відповідник зберігає богословську напругу й не вносить до тексту завчасного тлумачення.
translation_notes:
  register: Сучасна, стисла й гідна українська мова. Конструкція «щоб і вас не судили» звучить природно та виразно відтворює взаємну риторичну відповідність двох частин.
