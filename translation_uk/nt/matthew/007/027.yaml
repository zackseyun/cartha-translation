lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: полив дощ
  rationale: Природний сучасний український вислів про сильний дощ; передає початок і спрямованість зливи без неприродного буквального «дощ зійшов».
- source_word: ἦλθον οἱ ποταμοί
  choice: нахлинули ріки
  rationale: «Ріки» зберігає основне значення ποταμοί, а «нахлинули» природно передає рух бурхливих вод у контексті зливи.
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: подули вітри
  rationale: Прямий і природний відповідник грецького вислову зі збереженням оповідного ритму.
- source_word: προσέκοψαν τῇ οἰκίᾳ ἐκείνῃ
  choice: вдарили в той дім
  rationale: Передає удар об будинок у контексті бурі, не вдаючись до неприродного буквального значення «спіткнулися».
- source_word: ἔπεσεν
  choice: він упав
  rationale: Зберігає просте значення πίπτω та не підмінює його тлумачним «зруйнувався».
- source_word: ἡ πτῶσις αὐτῆς μεγάλη
  choice: падіння його було великим
  rationale: Зберігає спорідненість ἔπεσεν і πτῶσις через «упав / падіння» та відтворює стриману силу заключної фрази.
theological_decisions:
- issue: Образ суворого наслідку наприкінці притчі
  choice: падіння його було великим
  alternative: його руйнування було катастрофічним
  rationale: Грецький текст говорить про велике падіння дому, не називаючи прямо есхатологічного суду. Переклад зберігає силу перестороги, не додаючи богословського пояснення.
translation_notes:
