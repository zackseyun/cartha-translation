id: MAT.7.15
reference: Matthew 7:15
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ⸀Προσέχετε ἀπὸ τῶν ψευδοπροφητῶν, οἵτινες ἔρχονται πρὸς ὑμᾶς ἐν ἐνδύμασι προβάτων ἔσωθεν δέ εἰσιν λύκοι ἅρπαγες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/015.yaml
  text: Beware of false prophets[a], who come to you in sheep’s clothing[c][b], but inwardly are ravenous wolves.
translation:
  language: uk
  text: Стережіться лжепророків, які приходять до вас в овечій шкурі,[a] а всередині вони — хижі вовки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в овечому вбранні».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε ἀπὸ
  choice: Стережіться
  rationale: Теперішній наказовий спосіб множини закликає до постійної пильності; українське «стережіться» природно передає і застереження, і керування з родовим відмінком.
- source_word: ψευδοπροφητῶν
  choice: лжепророків
  rationale: Усталений, стислий відповідник для тих, хто неправдиво претендує на пророчий авторитет або пророкує неправду.
- source_word: οἵτινες ἔρχονται πρὸς ὑμᾶς
  choice: які приходять до вас
  rationale: Природно передає відносний опис цих людей та їхнє наближення до слухачів без надмірного тлумачення відтінку οἵτινες.
- source_word: ἐν ἐνδύμασι προβάτων
  choice: в овечій шкурі
  rationale: Зрозумілий український образ удаваної невинності, близький до буквального «в овечому вбранні»; однина природна для української ідіоми.
- source_word: ἔσωθεν δέ εἰσιν
  choice: а всередині вони —
  rationale: «Всередині» зберігає просторово-метафоричний контраст між зовнішнім виглядом і справжньою сутністю; «а» природно виражає протиставлення.
- source_word: λύκοι ἅρπαγες
  choice: хижі вовки
  rationale: «Хижі» передає грабіжницький, згубний характер ἅρπαγες і природно поєднується з образом вовків, не звужуючи значення лише до голоду.
theological_decisions:
- issue: Характер застереження про оманливих релігійних діячів
  choice: Передати образ прямо як духовно-моральне застереження про лжепророків, чия зовнішність приховує згубну сутність.
  alternative: Конкретизувати їх як єретичних учителів у пізнішому церковно-доктринальному значенні.
  rationale: Грецький текст говорить саме про лжепророків і протиставляє зовнішній вигляд внутрішній сутності; переклад не повинен додавати пізніші конфесійні чи інституційні категорії.
translation_notes:
  register: Сучасна стандартна українська, стислий і гідний повчальний стиль. «Стережіться» зберігає силу наказу; «лжепророки» є усталеним біблійним терміном; образ «овечої шкури» зрозумілий пересічному читачеві. Маркер примітки поставлено безпосередньо після відповідної фрази.
