  text: Or if he asks for a fish—he will not give him a snake[b][a], will he?
translation:
  language: uk
  text: Або якщо попросить риби — хіба дасть йому змію?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «змій». Грецьке ὄφις може означати «змія» або «змій»; у тексті вжито звичайніший сучасний відповідник.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ καὶ
  choice: Або якщо
  rationale: Вводить другий приклад у парі риторичних запитань; українське «Або якщо» природно передає продовження альтернативи, не перевантажуючи переклад окремим відповідником καί.
- source_word: ἰχθὺν
  choice: риби
  rationale: Звичайне значення іменника в контексті їжі; родовий відмінок природно зумовлений українським керуванням дієслова «попросить».
- source_word: αἰτήσει
  choice: попросить
  rationale: Майбутній час збережено; дієслово природно виражає прохання про їжу в цьому узагальненому прикладі.
- source_word: μὴ
  choice: хіба ...?
  rationale: Частка μή у прямому запитанні передбачає заперечну відповідь; українська конструкція з «хіба» природно передає цю риторичну силу.
- source_word: ὄφιν
  choice: змію
  rationale: «Змія» — звичайний сучасний український відповідник назви тварини; «гадюка» була б надто конкретною, а «змій» тут менш природний і може мати додаткові традиційні асоціації.
- source_word: ἐπιδώσει
  choice: дасть
  rationale: У цьому контексті дієслово означає дати або вручити; «дасть» є найпростішим і природним відповідником.
- source_word: αὐτῷ
  choice: йому
  rationale: Давальний відмінок прямо й природно передає непрямий додаток.
theological_decisions:
- issue: Риторична сила запитання
  choice: «хіба дасть йому змію?» — запитання, що передбачає відповідь «ні»
  alternative: «не дасть йому змії» як просте твердження або «невже дасть йому змію?»
  rationale: μή у грецькому прямому запитанні вказує на очікувану заперечну відповідь. Конструкція з «хіба» зберігає риторичний характер аргументу, не перетворюючи його на звичайне твердження.
translation_notes:
  register: Сучасна, природна й гідна українська мова. Тире зберігає різкий перехід до риторичного запитання. Підмет, зрозумілий із попереднього вірша та дієслівних форм, не додається явно.
