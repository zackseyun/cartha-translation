  text: Ask[a], and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: uk
  text: Просіть[a] — і буде дано вам; шукайте — і знайдете; стукайте — і вам буде відчинено.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Грецькі наказові форми теперішнього часу можуть також мати тривалий відтінок: «Продовжуйте просити… продовжуйте шукати… продовжуйте стукати».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αἰτεῖτε
  choice: Просіть
  rationale: Теперішній активний наказовий спосіб, друга особа множини. «Просіть» природно передає наказ і не робить тривалий аспект надмірно явним у головному тексті.
- source_word: δοθήσεται
  choice: буде дано
  rationale: Майбутній пасив від δίδωμι. Безособова пасивна конструкція природна українською та, як і грецький текст, не називає того, хто дає.
- source_word: ὑμῖν
  choice: вам
  rationale: Давальний відмінок займенника прямо й природно передано формою «вам» при обох пасивних дієсловах.
- source_word: ζητεῖτε
  choice: шукайте
  rationale: Теперішній активний наказовий спосіб. «Шукайте» зберігає як пряме, так і переносне значення та відповідає гідному сучасному регістру.
- source_word: εὑρήσετε
  choice: знайдете
  rationale: Майбутній активний дійсний спосіб. «Знайдете» стисло й точно передає форму та узгоджується з множинним адресатом.
- source_word: κρούετε
  choice: стукайте
  rationale: Теперішній активний наказовий спосіб. «Стукайте» є природним українським відповідником у контексті стукання у двері; тривалість дії пояснено в примітці.
- source_word: ἀνοιγήσεται
  choice: буде відчинено
  rationale: Майбутній пасив від ἀνοίγω. «Буде відчинено» зберігає пасивну форму й не перетворює вислів на неперехідне «відчиниться».
- source_word: καὶ
  choice: і
  rationale: Повторюваний сурядний сполучник передано буквально; тире слугує природному українському ритму, не додаючи причинно-наслідкового значення.
theological_decisions:
- issue: Аспект трьох наказових форм теперішнього часу
  choice: Передати звичайними українськими наказовими формами «просіть», «шукайте», «стукайте», залишивши можливий тривалий відтінок неявним у головному тексті.
  alternative: 'Явно передати тривалість: «продовжуйте просити… продовжуйте шукати… продовжуйте стукати».'
  rationale: Грецькі форми допускають у цьому контексті відтінок тривалої або повторюваної дії, але самі по собі не вимагають розгорнутого додавання «продовжуйте». Примітка зберігає цю можливість без звуження значення основного тексту.
- issue: Неозначений виконавець у пасивних формах δοθήσεται та ἀνοιγήσεται
  choice: 'Зберегти пасив: «буде дано», «буде відчинено», не називаючи виконавця.'
  alternative: 'Уточнити виконавця як Бога: «Бог дасть вам… Бог відчинить вам».'
  rationale: У контексті виконавцем може розумітися Бог, однак грецький текст прямо його не називає. Збереження пасиву не вносить у переклад неявного уточнення.
translation_notes:
  register: Сучасна стандартна українська, стислий і гідний біблійний регістр. Паралельну тричленну будову оригіналу збережено; тире природно позначає межу між наказом і обіцянкою.
