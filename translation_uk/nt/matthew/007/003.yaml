  text: τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ ἐν τῷ σῷ ὀφθαλμῷ δοκὸν οὐ κατανοεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/003.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: uk
  text: Чому ж ти бачиш скалку[a] в оці свого брата[b], а колоди[c] у власному оці не помічаєш?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «порошинку», «соломинку» чи «дрібку полови».
    reason: lexical_alternative
  - marker: b
    text: Грецьке слово — «брат»; в оригіналі вжито чоловічий рід і однину.
    reason: lexical_alternative
  - marker: c
    text: Або «балку»; грецьке слово означає велику дерев’яну балку.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: чому
  rationale: У питальній конструкції з βλέπεις слово τί має ідіоматичне значення «чому» й передає докірливу силу риторичного запитання.
- source_word: δὲ
  choice: ж … а
  rationale: Частка δέ позначає перехід і легке протиставлення; українські «ж» та «а» природно передають рух і внутрішній контраст вислову.
- source_word: βλέπεις
  choice: бачиш
  rationale: Конкретне «бачиш» зберігає образ ока й відрізняється від сильнішого κατανοεῖς наприкінці речення.
- source_word: κάρφος
  choice: скалку
  rationale: Кάρφος означає малу суху частинку — скалку, соломинку або порошинку. «Скалка» природно вписується в образ чогось у оці та різко контрастує з колодою.
- source_word: ἀδελφοῦ
  choice: брата
  rationale: Збережено чоловічий рід і однину грецького тексту, не звужуючи при цьому загального застосування вислову.
- source_word: τῷ σῷ ὀφθαλμῷ
  choice: у власному оці
  rationale: «Власному» передає емфатичне σῷ і підкреслює протиставлення оку брата.
- source_word: δοκόν
  choice: колоди
  rationale: Δοκός — велика дерев’яна балка. «Колода» в сучасній українській виразно передає навмисну гіперболу й контраст зі скалкою.
- source_word: οὐ κατανοεῖς
  choice: не помічаєш
  rationale: Κατανοέω означає уважно зауважувати, розпізнавати або брати до уваги. «Не помічаєш» природно зберігає іронічний контраст із «бачиш».
theological_decisions:
- issue: Родова назва ἀδελφοῦ чоловічого роду
  choice: брата
  alternative: брата чи сестри; ближнього
  rationale: Грецький текст має іменник чоловічого роду в однині. Його збережено без гендерного розширення, хоча повчання за змістом стосується всіх.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Збережено риторичне запитання, перебільшення та лексичний контраст між «бачиш» і «не помічаєш».
