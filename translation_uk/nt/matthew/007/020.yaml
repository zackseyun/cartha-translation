  text: So then[a], you will recognize them by their fruits.
translation:
  language: uk
  text: Отже[a], за їхніми плодами ви розпізнаєте їх.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Тож справді, з їхніх плодів ви пізнаєте їх».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα γε
  choice: Отже
  rationale: Передає підсумковий висновок із легким підсиленням природною сучасною українською; додатковий відтінок γε відображено у примітці як можливе «тож справді».
- source_word: ἀπὸ
  choice: за
  rationale: У сполученні з дієсловом розпізнавання вказує на ознаку або підставу, за якою когось визначають; українське «за їхніми плодами» є природним і зберігає образність.
- source_word: καρπῶν
  choice: плодами
  rationale: Збережено виразну грецьку множину й метафору видимих наслідків або вчинків, не звужуючи її тлумачним відповідником.
- source_word: αὐτῶν
  choice: їхніми
  rationale: Присвійний зв’язок із «плодами» природно передано українським займенником.
- source_word: ἐπιγνώσεσθε
  choice: ви розпізнаєте
  rationale: Майбутній час, друга особа множини; у контексті йдеться про визначення того, ким є ці люди, на підставі помітних ознак. «Розпізнаєте» точніше за загальне «пізнаєте».
- source_word: αὐτούς
  choice: їх
  rationale: Займенник стосується згаданих у контексті людей і природно передається як «їх».
theological_decisions:
- issue: Метафоричне вживання «плодів» при оцінюванні людей
  choice: Зберегти метафору «плоди» без пояснювального розгортання в основному тексті.
  alternative: їхні вчинки; їхні наслідки
  rationale: Образ пов’язує вислів із безпосереднім контекстом і залишає відкритим повний діапазон видимих проявів, не нав’язуючи вужчого доктринального тлумачення.
translation_notes:
  register: Сучасна, загальнозрозуміла й гідна українська мова. Конструкція «за їхніми плодами» природно виражає критерій розпізнавання; метафору та множину оригіналу збережено.
