review_pass:
  verdict: approve
  source_fidelity: 'Основний текст точно передає висновкову силу ἄρα γε («Отже»), майбутній час і множину ἐπιγνώσεσθε («ви розпізнаєте»), а також образну множину καρπῶν («плодами»). Прийменниковий вислів «за їхніми плодами» природно відтворює критерій, на підставі якого відбувається розпізнання. Займенники коректно зберігають зв’язок: плоди належать їм, і саме їх буде розпізнано.'
  naturalness: «Отже, за їхніми плодами ви розпізнаєте їх» — природне, ясне й стилістично нейтральне формулювання сучасною стандартною українською. Повторення «їхніми ... їх» є доречним і відповідає смисловій структурі грецького вислову.
  terminology: «Плоди» зберігає біблійний образ і явну множину оригіналу, не підміняючи його інтерпретаційними «вчинками» чи «наслідками». «Розпізнаєте» вдало передає контекстуальне значення ἐπιγινώσκω як встановлення, ким є ці люди, за помітними ознаками.
