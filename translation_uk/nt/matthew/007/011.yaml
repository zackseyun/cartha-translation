id: MAT.7.11
reference: Matthew 7:11
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: εἰ οὖν ὑμεῖς πονηροὶ ὄντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς δώσει ἀγαθὰ τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/011.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will your Father in the heavens give good things to those who ask him.
translation:
  language: uk
  text: Отже, якщо ви, будучи злими, умієте давати добрі дари своїм дітям, то наскільки ж більше ваш Отець, Який на небесах[a], дасть те, що добре, тим, хто просить у Нього.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиційний варіант: «Який на небі». У грецькому тексті вжито множину: «на небесах».'
    reason: lexical_alternative
  - marker: b
    text: Деякі переклади мають тут «дасть добрі дари», однак у другій частині грецького тексту сказано лише «дасть добре» або «дасть те, що добре».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ οὖν ὑμεῖς πονηροὶ ὄντες
  choice: Отже, якщо ви, будучи злими
  rationale: Збережено умовну побудову, висновкове οὖν та прямий опис πονηροὶ ὄντες без пом’якшення чи доктринального розширення.
- source_word: οἴδατε ... διδόναι
  choice: умієте давати
  rationale: У поєднанні з інфінітивом οἴδατε виражає практичне вміння; «умієте давати» природно передає цей зміст українською.
- source_word: δόματα ἀγαθὰ
  choice: добрі дари
  rationale: δόματα прямо означає дари, а ἀγαθὰ характеризує їх як добрі.
- source_word: τοῖς τέκνοις ὑμῶν
  choice: своїм дітям
  rationale: τέκνα охоплює дітей незалежно від статі; зворотний займенник «своїм» природний українською при підметі «ви».
- source_word: πόσῳ μᾶλλον
  choice: наскільки ж більше
  rationale: Передає підсилений аргумент від меншого до більшого.
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: ваш Отець, Який на небесах
  rationale: Збережено назву «Отець» і окремий локативний вислів; множину τοῖς οὐρανοῖς передано як «на небесах».
- source_word: δώσει ἀγαθὰ
  choice: дасть те, що добре
  rationale: У другій частині δόματα не повторюється, а ἀγαθὰ вжито самостійно; переклад не додає слова «дари» й водночас звучить природно.
- source_word: τοῖς αἰτοῦσιν αὐτόν
  choice: тим, хто просить у Нього
  rationale: Субстантивований дієприкметник позначає загальну групу людей; українська конструкція передає це ясно й природно.
theological_decisions:
- issue: Антропологічна сила вислову πονηροὶ ὄντες
  choice: будучи злими
  alternative: хоч ви й грішні; попри вашу моральну недосконалість
  rationale: Прямий опис Ісуса збережено без пом’якшення та без розгортання його в ширшу доктринальну формулу.
- issue: Передача ὁ ἐν τοῖς οὐρανοῖς
  choice: Який на небесах
  alternative: небесний; Який на небі
  rationale: Такий варіант зберігає локативну форму та граматичну множину грецького тексту, не перетворюючи вислів на прикметниковий титул.
- issue: Розрізнення δόματα ἀγαθὰ і δώσει ἀγαθὰ
  choice: добрі дари ... дасть те, що добре
  alternative: добрі дари ... дасть добрі дари
  rationale: Не слід переносити іменник δόματα до другої частини, де грецький текст має лише субстантивований прикметник ἀγαθὰ.
translation_notes:
  register: Сучасна нормативна українська мова з гідним біблійним регістром. Синтаксис зберігає риторичне зіставлення, але лишається зрозумілим для широкого кола читачів. Великі літери в займенниках щодо Бога відповідають усталеному українському біблійному стилю.
