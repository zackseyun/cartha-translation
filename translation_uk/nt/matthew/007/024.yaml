source:
  edition: SBLGNT
  text: Πᾶς οὖν ὅστις ἀκούει μου τοὺς λόγους τούτους καὶ ποιεῖ αὐτούς, ⸀ὁμοιωθήσεται ἀνδρὶ φρονίμῳ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/024.yaml
  text: Therefore everyone who hears these words of mine and does them will be like a wise man who built his house on the rock[a][b].
translation:
  language: uk
  text: Тож кожен, хто чує ці Мої слова й виконує їх, буде уподібнений[a] до розсудливого чоловіка[b], який збудував свій дім на скелі.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «буде порівняний» чи «буде прирівняний».'
    reason: lexical_alternative
  - marker: b
    text: Грецькою — «розсудливого чоловіка»; порівняльний образ у тексті граматично чоловічого роду.
    reason: cultural_note
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: Тож кожен, хто
  rationale: Πᾶς у поєднанні з ὅστις має розподільне, узагальнене значення «кожен, хто», а οὖν позначає висновок із попереднього вчення; «тож» природно передає цей логічний зв’язок.
- source_word: ἀκούει μου τοὺς λόγους τούτους
  choice: чує ці Мої слова
  rationale: λόγους прямо передано як «слова», а присвійний родовий μου — природною українською конструкцією «Мої слова».
- source_word: καὶ ποιεῖ αὐτούς
  choice: й виконує їх
  rationale: У цьому контексті ποιέω означає чинити відповідно до почутого. «Виконує їх» зрозуміло передає практичне здійснення слів і зберігає займенникове αὐτούς.
- source_word: ὁμοιωθήσεται
  choice: буде уподібнений
  rationale: Форма майбутнього пасивного стану збережена без перетворення на просте «буде подібний», щоб не усунути можливий відтінок «буде порівняний».
- source_word: ἀνδρὶ φρονίμῳ
  choice: до розсудливого чоловіка
  rationale: ἀνήρ тут прямо означає чоловіка, а φρόνιμος — людину розсудливу, практично мудру. «Розсудливий» природно пасує до образу далекоглядного будівничого.
- source_word: ᾠκοδόμησεν αὐτοῦ τὴν οἰκίαν
  choice: який збудував свій дім
  rationale: Дієслово ᾠκοδόμησεν безпосередньо означає «збудував»; зворотний присвійний займенник «свій» природно передає належність дому підметові.
- source_word: ἐπὶ τὴν πέτραν
  choice: на скелі
  rationale: πέτρα означає скелю або тверду кам’яну основу. «На скелі» зберігає конкретний образ, не додаючи відсутнього в тексті уточнення про фундамент.
theological_decisions:
- issue: Граматично чоловічий образ у порівнянні
  choice: розсудливого чоловіка
  alternative: розсудливої людини
  rationale: Грецьке ἀνδρί має конкретно чоловічий граматичний і лексичний зміст. Його збережено в образі, тоді як загальність застосування вже виражено словами «кожен, хто».
translation_notes:
  register: Сучасна нормативна українська мова з гідним біблійним звучанням. Інверсій та архаїзмів уникнено; пасивну форму «буде уподібнений» свідомо збережено задля відповідності грецькому тексту та його можливій неоднозначності.
