  naturalness: Текст звучить нормативно й природно сучасною українською, водночас зберігаючи відповідний урочисто-судовий регістр. Конструкція «ті, хто чинить беззаконня» є зрозумілою та стилістично прийнятною.
  terminology: «Оголошу», «не знав», «Відійдіть» і «беззаконня» послідовно й доречно передають ключову лексику. Великі літери в прямій мові відповідають звичному українському біблійному оформленню і не змінюють змісту.
