id: MAT.7.23
reference: Matthew 7:23
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: καὶ τότε ὁμολογήσω αὐτοῖς ὅτι Οὐδέποτε ἔγνων ὑμᾶς· ἀποχωρεῖτε ἀπ’ ἐμοῦ οἱ ἐργαζόμενοι τὴν ἀνομίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/023.yaml
  text: And then I will declare to them[a], ‘I never knew you; depart from me[b], you who practice lawlessness.’
translation:
  language: uk
  text: 'І тоді Я оголошу їм: «Я ніколи не знав вас[a]. Відійдіть від Мене, ті, хто чинить беззаконня[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Я ніколи не визнавав вас». Грецьке слово «знав» може означати особисте, стосункове визнання, а не лише обізнаність.'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «ті, хто чинить неправедність» чи «ті, хто робить зло».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τότε
  choice: І тоді
  rationale: Зберігає і зв’язок із попереднім контекстом, і часову послідовність.
- source_word: ὁμολογήσω
  choice: Я оголошу
  rationale: У цьому урочистому судовому контексті дієслово означає відкрите, недвозначне проголошення, а не визнання провини.
- source_word: Οὐδέποτε
  choice: ніколи
  rationale: Природно й стисло передає абсолютне та підсилене заперечення.
- source_word: ἔγνων
  choice: не знав
  rationale: Зберігає прямий грецький вислів і його можливий відтінок особистого, стосункового знання, не звужуючи значення до схвалення чи інтелектуальної обізнаності.
- source_word: ἀποχωρεῖτε
  choice: Відійдіть
  rationale: Природний сучасний наказ із належною урочистістю; передає владне віддалення від мовця.
- source_word: ἐργαζόμενοι
  choice: ті, хто чинить
  rationale: Передає характерну або тривалу діяльність природною українською конструкцією.
- source_word: ἀνομίαν
  choice: беззаконня
  rationale: Зберігає морально-правовий зміст слова — нехтування законом і належним Божим порядком — точніше, ніж загальніше «зло».
theological_decisions:
- issue: Значення вислову «Я ніколи не знав вас»
  choice: Збережено пряме стосункове формулювання «Я ніколи не знав вас».
  alternative: «Я ніколи не визнавав вас» або «Я ніколи не схвалював вас».
  rationale: Грецький текст говорить про знання прямо. Доктринальне перефразування усунуло б навмисно не роз’яснену тут напругу між знанням, визнанням і стосунками.
- issue: Зміст слова ἀνομία
  choice: «беззаконня»
  alternative: «неправедність», «зло» або «лиходійство»
  rationale: Такий переклад зберігає морально-правову категорію оригіналу, не вводячи в текст вужчого конфесійного тлумачення.
translation_notes:
  register: Сучасна нормативна українська мова з урочистим, але не архаїчним звучанням. Велика літера у займенниках «Я», «Мене» відображає традиційне українське біблійне оформлення прямої мови Ісуса; змістових уточнень понад грецький текст не додано.
