reference: Matthew 7:4
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ἢ πῶς ἐρεῖς τῷ ἀδελφῷ σου· Ἄφες ἐκβάλω τὸ κάρφος ⸀ἐκ τοῦ ὀφθαλμοῦ σου, καὶ ἰδοὺ ἡ δοκὸς ἐν τῷ ὀφθαλμῷ σοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/004.yaml
  text: Or how will you say to your brother[a], ‘Let me take the speck out of your eye,’ and behold[c][b], the beam is in your own eye?
translation:
  language: uk
  text: 'Або як ти скажеш своєму братові[a]: «Дозволь мені вийняти скалку з твого ока», — а ось у твоєму власному оці — брус[c][b]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Грецьке слово стоїть у чоловічому роді однини; тут «брат» може мати представницьке значення — співучень або інший член спільноти.
    reason: cultural_note
  - marker: b
    text: 'Або: «і ось».'
    reason: translation_alternative
  - marker: c
    text: 'Або: «балка» чи «колода»; грецьке δοκός означає великий брус або балку, тобто значний дерев''яний конструкційний елемент.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Або
  rationale: Вводить наступне риторичне запитання як альтернативне формулювання в послідовності аргументу.
- source_word: πῶς ἐρεῖς
  choice: як скажеш
  rationale: Зберігає майбутній час ἐρεῖς і риторичне запитання про саму можливість так сказати.
- source_word: τῷ ἀδελφῷ σου
  choice: своєму братові
  rationale: Передає чоловічий рід і однину грецького вислову; «своєму» природно вказує на належність при тому самому суб’єкті.
- source_word: Ἄφες ἐκβάλω
  choice: Дозволь, я вийму
  rationale: Ἄφες тут є проханням про дозвіл, а ἐκβάλω в контексті ока природно передається дієсловом «вийму».
- source_word: τὸ κάρφος
  choice: скалку
  rationale: Кάρφος означає малий сухий уламок; «скалка» створює ясний і природний образ стороннього тіла в оці, не звужуючи його до порошинки.
- source_word: ἐκ τοῦ ὀφθαλμοῦ σου
  choice: з твого ока
  rationale: Природно передає рух назовні, виражений прийменником ἐκ.
- source_word: καὶ ἰδοὺ
  choice: коли ось
  rationale: У риторичному запитанні «коли ось» природно привертає увагу до разючої суперечності; «ось» зберігає вказівну силу ἰδού.
- source_word: ἡ δοκὸς
  choice: колода
  rationale: Δοκός — великий дерев’яний брус або балка. «Колода» виразно зберігає навмисну гіперболу й контраст зі скалкою.
- source_word: ἐν τῷ ὀφθαλμῷ σοῦ
  choice: у твоєму власному оці
  rationale: Передає місце буквально; «власному» природно підсилює контраст, наявний у контексті.
theological_decisions:
- issue: Родове значення ἀδελφῷ
  choice: братові
  alternative: братові чи сестрі; ближньому; одновірцеві
  rationale: Грецький текст має чоловічий рід в однині й змальовує конкретне гіпотетичне звернення. Ширше представницьке значення можливе, але його не слід вносити до основного тексту як явне розширення.
- issue: Гіперболічний контраст κάρφος / δοκός
  choice: скалка / колода
  alternative: скалка / балка; порошинка / колода
  rationale: Обрана пара природно й наочно передає навмисно величезну невідповідність між малим уламком і великим шматком дерева, не послаблюючи гостроти вислову.
- issue: Функція καὶ ἰδού
  choice: коли ось
  alternative: і ось; аж ось
  rationale: Цей зворот подає стан самого мовця як разючу обставину, що робить його слова до брата неспроможними; переклад не усуває риторичної напруги.
translation_notes:
  register: Сучасна стандартна українська, зрозуміла й гідна. Репліка звучить природно, тоді як «ось» і образ колоди зберігають риторичну виразність та навмисну гіперболу оригіналу.
