  source_fidelity: 'Вислів «коли ось» невиправдано надає καὶ ἰδού часово-підрядного значення («when»). У грецькому тексті це сурядний вислів із вказівно-екскламативною часткою: «а ось» / «і ось». «Дозволь мені вийняти» точно передає прохання-дозвіл Ἄφες ἐκβάλω. «Брус» точніше за «колода» передає δοκός як великий конструкційний дерев''яний елемент, зберігаючи гіперболічний контраст зі «скалкою».'
  naturalness: Виправлена фраза «а ось у твоєму власному оці — брус» природна для сучасної стандартної української, риторично виразна й не перевантажена архаїзмами.
  terminology: «Братові» зберігає чоловічий рід однини ἀδελφῷ без інтерпретаційного розширення. Пара «скалка / брус» чітко передає контраст κάρφος / δοκός. «Власному» є допустимим контекстуальним підсиленням контрасту, хоча окремого відповідника в цьому вірші не має.
