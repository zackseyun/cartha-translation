  to: 'Або як ти скажеш своєму братові[a]: «Дозволь мені вийняти скалку з твого ока», — а ось у твоєму власному оці — брус[c][b]?'
  rationale: Замінено часово забарвлене «коли ось» на «а ось», щоб точно передати καὶ ἰδού як вказівний риторичний зворот. «Дозволь мені вийняти» природніше оформлює прохання про дозвіл. «Брус» точніше відповідає δοκός, ніж «колода». Порядок приміток нормалізовано відповідно до місць їхніх маркерів без зміни їхнього змісту.
