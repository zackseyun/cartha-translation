review_pass:
  verdict: revise
  source_fidelity: Основне значення передано точно, однак грецьке ἀνοιγήσεται — майбутній пасив із не названим суб’єктом. Неозначено-особове «відчинять» дещо сильніше передбачає невисловленого діяча, тоді як «буде відчинено» ближче відтворює форму й невизначеність оригіналу.
  naturalness: «Адже» та паралельні конструкції звучать природно сучасною українською. Форма «тому, хто стукає, буде відчинено» також є нормативною й виразною в цьому образному контексті.
  terminology: «Просить», «отримує», «шукає», «знаходить» — точні, усталені й стилістично відповідні відповідники. Слово «двері» не слід додавати до основного тексту, бо його немає в грецькому реченні.
  issues:
  - severity: low
    issue: «відчинять» замість пасивної конструкції
    rationale: Неозначено-особова форма може природно передавати пасивний зміст, але вводить більш виразну імплікацію людського/невизначеного діяча. «Буде відчинено» точніше зберігає грецький майбутній пасив і не називає ані діяча, ані предмета, який відчиняють.
  - severity: low
    issue: Виноска називає альтернативний переклад «буквальним», хоча він не збігається з основним текстом
    rationale: Після приведення основного тексту до пасивної форми виноска стає зайвою; її інформацію про неназвані «двері» не потрібно дублювати, оскільки переклад уже не додає цього слова.
  revised_text: Адже кожен, хто просить, отримує, і хто шукає, знаходить, і тому, хто стукає, буде відчинено.
