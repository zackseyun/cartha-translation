  text: πᾶς γὰρ ὁ αἰτῶν λαμβάνει καὶ ὁ ζητῶν εὑρίσκει καὶ τῷ κρούοντι ⸀ἀνοιγήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/008.yaml
  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: uk
  text: Адже кожен, хто просить, отримує, і хто шукає, знаходить, і тому, хто стукає, буде відчинено.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς
  choice: кожен
  rationale: Субстантивовану конструкцію з дієприкметником природно передано як «кожен, хто…», зі збереженням загального охоплення.
- source_word: γὰρ
  choice: адже
  rationale: Передає пояснювальний зв’язок із попереднім закликом природною сучасною українською мовою.
- source_word: ὁ αἰτῶν
  choice: хто просить
  rationale: Передає субстантивований дієприкметник теперішнього часу та загальний, повторюваний характер дії.
- source_word: λαμβάνει
  choice: отримує
  rationale: Звичний відповідник у контексті прохання, який зберігає лаконічність вислову.
- source_word: ὁ ζητῶν
  choice: хто шукає
  rationale: Природно відтворює паралельну грецьку конструкцію без зайвої важкості.
- source_word: εὑρίσκει
  choice: знаходить
  rationale: Прямий і контекстуально точний відповідник, що підтримує ритмічний паралелізм.
- source_word: τῷ κρούοντι
  choice: тому, хто стукає
  rationale: Давальний відмінок збережено в конструкції, яка природно поєднується з неозначено-особовим «відчинять».
- source_word: ἀνοιγήσεται
  choice: відчинять
  rationale: Неозначено-особова форма природно передає грецький майбутній пасив і не додає прямо не названого слова «двері».
theological_decisions:
- issue: Обсяг і сила обітниці
  choice: Загальне запевнення, сформульоване універсально, без доданих у перекладі обмежень або уточнень.
  alternative: Розуміти вислів як безумовну гарантію точного виконання кожного прохання або, навпаки, обмежити його лише певним видом прохань.
  rationale: Грецький текст висловлюється широко. Переклад зберігає цю широту й богословську напругу, не розв’язуючи її шляхом додавання відсутніх умов.
translation_notes:
  register: Сучасна стандартна українська; лаконічний, гідний і легко запам’ятовуваний вислів. Крапки з комою увиразнюють три паралельні частини.
