id: MAT.7.14
reference: Matthew 7:14
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ⸀ὅτι στενὴ ἡ πύλη καὶ τεθλιμμένη ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ζωήν, καὶ ὀλίγοι εἰσὶν οἱ εὑρίσκοντες αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/014.yaml
  text: For the gate is narrow and the way that leads to life is hard, and few are those who find it.
translation:
  language: uk
  text: Бо вузька брама й тісна дорога, що веде до життя, і мало тих, хто її знаходить.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στενή
  choice: вузька
  rationale: Прямо передає просторову характеристику брами природною сучасною українською.
- source_word: τεθλιμμένη
  choice: тісна
  rationale: Дієприкметник від θλίβω буквально вказує на стиснутість, обмеженість простору; «тісна» зберігає образ дороги й не звужує значення лише до суб’єктивної важкості.
- source_word: ἀπάγουσα
  choice: що веде
  rationale: Природний український відповідник у контексті дороги та її напрямку.
- source_word: ζωήν
  choice: життя
  rationale: Зберігає широкий богословський зміст грецького ζωή без додаткового тлумачення.
- source_word: ὀλίγοι ... οἱ εὑρίσκοντες
  choice: мало тих, хто ... знаходить
  rationale: Ідіоматична українська конструкція, що точно передає малу кількість людей, які знаходять дорогу.
theological_decisions:
- issue: Характер дороги в τεθλιμμένη
  choice: тісна
  alternative: важка
  rationale: «Тісна» зберігає конкретну метафору стисненої дороги та лексичний зв’язок із θλίβω, не усуваючи можливого підтексту труднощів чи утисків. «Важка» ясніше висловлює наслідок, але послаблює просторовий образ.
- issue: Значення «життя»
  choice: життя
  alternative: вічне життя
  rationale: У цьому вірші грецький текст має лише ζωήν; уточнення «вічне» було б тлумачним додатком.
translation_notes:
  register: Сучасна стандартна українська, стислий і гідний стиль. Паралелізм «вузька брама й тісна дорога» збережено; порядок слів трохи природніший для української без втрати змісту.
