source:
  edition: SBLGNT
  text: ἐν ᾧ γὰρ κρίματι κρίνετε κριθήσεσθε, καὶ ἐν ᾧ μέτρῳ μετρεῖτε μετρηθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/002.yaml
  text: For with the judgment by which you judge[a], you will be judged, and with the measure by which you measure, it will be measured to you.
translation:
  language: uk
  text: Бо яким судом судите, таким і вас судитимуть; і якою мірою міряєте, такою відміряють вам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «такою ж мірою відміряють вам у відповідь». У грецькому тексті значення взаємності випливає з побудови вислову, але окремого слова «у відповідь» немає.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίματι
  choice: судом
  rationale: «Суд» природно передає κρίμα як судження або судову оцінку та зберігає спільний корінь із дієсловами «судите» і «судитимуть».
- source_word: κρίνετε
  choice: судите
  rationale: Загальне «судите» не звужує значення до «осуджуєте» й відтворює лексичний повтор грецького κρίνω.
- source_word: κριθήσεσθε
  choice: вас судитимуть
  rationale: Неозначено-особова конструкція природно передає майбутній пасив, не називаючи виконавця суду й не уточнюючи його як засудження.
- source_word: μέτρῳ
  choice: мірою
  rationale: «Міра» передає метафоричний стандарт ставлення та дає змогу зберегти словесну гру з дієсловом «міряти».
- source_word: μετρεῖτε
  choice: міряєте
  rationale: Дієслово «міряєте» безпосередньо відповідає іменнику «міра» та зберігає афористичний паралелізм.
- source_word: μετρηθήσεται ὑμῖν
  choice: відміряють вам
  rationale: Природна українська неозначено-особова форма передає пасив із давальним ὑμῖν, не називаючи діяча. Префікс «від-» тут виражає наділення певною мірою, але може також сприйматися як зворотність, що пояснено у примітці.
- source_word: ἐν ᾧ ... ἐν ᾧ
  choice: яким ... таким; якою ... такою
  rationale: Українська співвідносна конструкція природно виражає інструмент або стандарт і чітко відтворює паралельність двох частин.
- source_word: γὰρ
  choice: Бо
  rationale: «Бо» стисло й природно зберігає пояснювальний зв’язок із попереднім застереженням.
theological_decisions:
- issue: Характер взаємного суду
  choice: Не називати того, хто судитиме й відміряє
  alternative: Прямо вказати, що це зробить Бог або інші люди
  rationale: Грецькі пасивні форми не називають діяча. Українські неозначено-особові конструкції зберігають цю богословську та тлумачну відкритість.
translation_notes:
  register: Сучасна літературна українська з урочистою, але доступною афористичною побудовою. Кореневі повтори «суд — судити» та «міра — міряти — відміряти» збережено; діяч пасивних дій лишається невказаним.
