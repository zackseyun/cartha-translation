  yaml_path: translation/nt/matthew/007/017.yaml
  text: So[a], every good tree produces good fruit[c][b], but the rotten tree produces bad fruit.
translation:
  language: uk
  text: Так само[a] кожне добре дерево приносить добрі плоди, а гниле[b] дерево приносить погані плоди[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Отже» чи «Таким чином».'
    reason: lexical_alternative
  - marker: b
    text: Грецьке слово σαπρός може також означати «зіпсоване», «трухляве» або «непридатне».
    reason: lexical_alternative
  - marker: c
    text: 'Або: «лихі плоди». Слово πονηρός може означати як «поганий», так і «лихий» чи «злий»; «погані» природно відповідає образу плодів, не усуваючи морального відтінку контексту.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Так
  rationale: Передає як висновковий відтінок («отже»), так і можливе значення способу («таким чином»), зберігаючи природність української мови.
- source_word: πᾶν δένδρον
  choice: кожне ... дерево
  rationale: Сполука з іменником в однині має розподільне значення; «кожне дерево» природно передає узагальнений характер вислову.
- source_word: ἀγαθὸν
  choice: добре
  rationale: Зберігає широке значення позитивної якості дерева й простий паралелізм образу.
- source_word: καρποὺς καλοὺς
  choice: добрі плоди
  rationale: У контексті оцінки результату καλός природно передається як «добрий»; множина «плоди» відповідає грецькому тексту.
- source_word: ποιεῖ
  choice: приносить
  rationale: Хоча ποιέω буквально означає «робить», у сполученні з деревом і плодами українське «приносить плоди» є природним і точним.
- source_word: τὸ δὲ
  choice: а ...
  rationale: Частка δέ позначає контраст; українське «а» виразно й природно протиставляє два види дерев.
- source_word: σαπρὸν
  choice: гниле
  rationale: Передає конкретний образ зіпсутого, трухлявого або непридатного дерева точніше, ніж загальне «погане».
- source_word: καρποὺς πονηροὺς
  choice: погані плоди
  rationale: У сільськогосподарському образі «погані» звучить природно, водночас контекст допускає моральний відтінок πονηρός — «лихий, злий».
theological_decisions:
- issue: Моральний чи суто сільськогосподарський зміст образу
  choice: Збережено конкретний образ дерева та плодів без доданого пояснення морального сенсу.
  alternative: 'Перекласти більш тлумачно: «здорове дерево приносить корисні плоди, а зіпсуте — лихі».'
  rationale: У контексті це застереження про лжепророків, але сам грецький текст подає образ, а не розгорнуте тлумачення. Переклад залишає моральне застосування контекстові.
translation_notes:
  register: Сучасна нормативна українська мова; простий, гідний і зрозумілий прислівний стиль. Повтор дієслова «приносить» збережено для відповідності паралельній будові грецького речення.
