revisions:
- from: Отже, в усьому поводьтеся з людьми[a] так, як хочете, щоб вони поводилися з вами, бо це і є Закон і Пророки.
  to: Отже, усе, чого ви хочете, щоб люди робили вам, те й ви робіть їм, бо це і є Закон і Пророки.
  rationale: Replaced the narrowed reciprocal language of conduct with «робили… робіть», matching the repeated breadth of ποιεῖν and preserving the parallelism of the Greek. Removed the unnecessary lexical footnote. The logical «Отже», universal «усе», generic «люди», and traditional capitalization of «Закон і Пророки» are retained.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:43:59Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the comprehensive scope, reciprocal imperative, and the conventional formula «Закон і Пророки». However, «поводьтеся з людьми» / «поводилися з вами» narrows ποιεῖν (“do”) to interpersonal manner or behavior. The Greek uses the broader verb twice, covering whatever actions one desires others to do for oneself.
  naturalness: The revised wording is idiomatic, clear modern Ukrainian while retaining a suitably elevated scriptural register. The correlative construction «усе, чого… те й…» makes the scope and reciprocity explicit.
  terminology: «Люди» accurately renders the generic οἱ ἄνθρωποι. «Закон і Пророки» properly retains the established scriptural formula. No footnote is needed for «люди», since it is already the direct and natural Ukrainian rendering and no meaningful alternative is being supplied.
  issues:
  - severity: medium
    issue: «Поводьтеся» is too narrow for ποιεῖτε.
    rationale: «Поводитися з кимось» primarily concerns one’s manner of treatment, whereas ποιεῖν in both clauses has the broad sense “do.” The same broad Ukrainian verb should be used in both reciprocal clauses.
  - severity: low
    issue: Footnote a is redundant and imprecisely framed.
    rationale: The main text already says «люди», an accurate generic rendering. The note presents this as a literal alternative without providing an actual alternative relevant to the translation.
  revised_text: Отже, усе, чого ви хочете, щоб люди робили вам, те й ви робіть їм, бо це і є Закон і Пророки.
