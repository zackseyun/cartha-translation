id: MAT.7.12
reference: Matthew 7:12
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Πάντα οὖν ὅσα ⸀ἐὰν θέλητε ἵνα ποιῶσιν ὑμῖν οἱ ἄνθρωποι, οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς· οὗτος γάρ ἐστιν ὁ νόμος καὶ οἱ προφῆται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/012.yaml
  text: Therefore[a], in everything, whatever you want people to do for you, do the same for them; for this is the Law and the Prophets.
translation:
  language: uk
  text: Отже, усе, чого ви хочете, щоб люди робили вам, те й ви робіть їм, бо це і є Закон і Пророки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάντα οὖν ὅσα
  choice: Отже, в усьому
  rationale: Поєднання Πάντα з ὅσα має всеохопний зміст, а οὖν позначає висновок із попереднього повчання. «Отже, в усьому» природно передає і логічний зв’язок, і універсальну сферу настанови.
- source_word: ἵνα ποιῶσιν ὑμῖν οἱ ἄνθρωποι
  choice: як хочете, щоб вони поводилися з вами
  rationale: Після θέλητε конструкція ἵνα з кон’юнктивом виражає бажану дію. У взаємному етичному контексті українське «поводилися з вами» природніше за буквальне й двозначне «робили вам».
- source_word: οἱ ἄνθρωποι
  choice: людьми
  rationale: Грецьке ἄνθρωποι тут позначає людей загалом, а не лише осіб чоловічої статі.
- source_word: οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς
  choice: поводьтеся з людьми так
  rationale: Теперішній наказовий спосіб ποιεῖτε закликає до сталої практики. Перебудова речення робить взаємність ясною й природною українською, не змінюючи змісту.
- source_word: οὗτος γάρ ἐστιν
  choice: бо це і є
  rationale: «Бо» передає пояснювальне γάρ, а підсилена конструкція «це і є» зберігає ототожнення, виражене ἐστιν.
- source_word: ὁ νόμος καὶ οἱ προφῆται
  choice: Закон і Пророки
  rationale: Усталена юдейська формула на позначення частин Писання збережена без пояснювального перефразування; великі літери вказують на назви корпусів Писання.
theological_decisions:
- issue: Узагальнене значення οἱ ἄνθρωποι
  choice: люди
  alternative: чоловіки
  rationale: Контекст формулює загальнолюдський етичний принцип; чоловічий граматичний рід грецької форми не обмежує настанову чоловіками.
- issue: Зміст формули «Закон і Пророки»
  choice: Збережено як назву сукупного свідчення Писання
  alternative: уся етична наука Писання
  rationale: Буквальне збереження усталеної формули підтримує міжтекстові й богословські зв’язки, не звужуючи її до пояснювального переказу.
- issue: Характер ототожнення в οὗτος γάρ ἐστιν
  choice: бо це і є Закон і Пророки
  alternative: бо в цьому сутність Закону і Пророків
  rationale: Грецький текст містить пряму зв’язку «це є», але не має слова «сутність»; переклад не додає тлумачення про вичерпний зміст цілої формули.
translation_notes:
  register: Сучасна, загальнозрозуміла й гідна українська мова. Повтор «поводьтеся» виразно передає взаємність настанови; порядок компонентів природно перебудовано для української синтаксичної ясності.
