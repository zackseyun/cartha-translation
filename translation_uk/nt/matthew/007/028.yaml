  text: Καὶ ἐγένετο ὅτε ⸀ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, ἐξεπλήσσοντο οἱ ὄχλοι ἐπὶ τῇ διδαχῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/028.yaml
  text: And it happened that when Jesus had finished these words[b][a], the crowds were astonished at his teaching.
translation:
  language: uk
  text: І сталося[a], що коли Ісус закінчив ці слова[b], натовпи були вражені його вченням.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Оповідну формулу можна передати природніше: «І коли…»'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «ці вислови».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: І сталося
  rationale: Збережено грецьку оповідну формулу переходу й продовження розповіді; вислів зрозумілий сучасному українському читачеві та не має англійської архаїчності формули «it came to pass».
- source_word: ὅτε
  choice: що, коли
  rationale: Разом із ἐγένετο передає вкладену грецьку конструкцію «сталося, що, коли…», не зводячи її просто до часового сполучника.
- source_word: ἐτέλεσεν
  choice: закінчив
  rationale: Дієслово вказує, що Ісус довів промову до завершення; український доконаний вид природно передає завершеність дії.
- source_word: τοὺς λόγους τούτους
  choice: ці слова
  rationale: «Слова» безпосередньо й широко передає λόγους, а «ці» зберігає вказівку на щойно виголошене вчення; можливе значення «вислови» подано в примітці.
- source_word: ἐξεπλήσσοντο
  choice: були вражені
  rationale: Передає сильну колективну реакцію, виражену імперфектом, природною сучасною українською мовою.
- source_word: οἱ ὄχλοι
  choice: натовпи
  rationale: Збережено множину грецького іменника; «натовпи» є сучасним і звичним відповідником.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: його вченням
  rationale: Орудний відмінок природно виражає підставу або предмет враження; «вчення» відповідає διδαχή без додаткового богословського уточнення.
theological_decisions:
- issue: До чого належать «ці слова»
  choice: Вислів стосується безпосередньо попереднього Ісусового вчення, без додавання назви «проповідь».
  alternative: «ці вислови» або інтерпретаційне «цю проповідь»
  rationale: Грецький текст називає сказане λόγοι й не вживає окремої назви для всієї промови; переклад не додає пізнішого тематичного позначення.
- issue: Написання займенника αὐτοῦ
  choice: його
  alternative: Його
  rationale: Ужито нормативне написання з малої літери, оскільки грецький текст не кодує шанобливої капіталізації, а переклад не має вносити конфесійну графічну традицію.
translation_notes:
  register: Сучасна нормативна українська мова з гідним біблійним звучанням. Початкову оповідну формулу збережено досить формально, тоді як решту речення викладено природно; архаїзмів і конфесійно маркованої капіталізації уникнуто.
