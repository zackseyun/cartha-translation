  text: Μὴ δῶτε τὸ ἅγιον τοῖς κυσίν, μηδὲ βάλητε τοὺς μαργαρίτας ὑμῶν ἔμπροσθεν τῶν χοίρων, μήποτε ⸀καταπατήσουσιν αὐτοὺς ἐν τοῖς ποσὶν αὐτῶν καὶ στραφέντες ῥήξωσιν ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/006.yaml
  text: Do not give what is holy to dogs[a], and do not throw your pearls before pigs[d][c][b], lest they trample them under their feet and turn and tear you to pieces.
translation:
  language: uk
  text: Не давайте псам того, що святе[a], і не кидайте своїх перлин перед свинями, щоб вони не потоптали їх ногами й, обернувшись, не роздерли вас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «святиню». Грецький вислів має широкий зміст і не уточнює, про що саме йдеться.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἅγιον
  choice: святого
  rationale: 'Субстантивований прикметник середнього роду має широкий, неуточнений зміст: «те, що святе». Українське «святого» природно зберігає цю широту, не звужуючи образ до вчення, святині чи посвяченої речі.'
- source_word: τοῖς κυσίν
  choice: псам
  rationale: Прямий відповідник зберігає різкість і метафоричну силу образу; давальний відмінок природно відповідає конструкції з «давайте».
- source_word: βάλητε
  choice: кидайте
  rationale: Звичайний сучасний відповідник βάλλω, який передає конкретну дію без архаїчного забарвлення.
- source_word: τοὺς μαργαρίτας ὑμῶν
  choice: своїх перлин
  rationale: «Перлини» є стандартним відповідником μαργαρίτας; зворотний займенник «своїх» природно співвідносить належність із підметом наказу.
- source_word: ἔμπροσθεν τῶν χοίρων
  choice: перед свинями
  rationale: Точно й природно передає просторовий образ, не замінюючи метафору поясненням.
- source_word: μήποτε
  choice: щоб ... не
  rationale: У сучасній українській ця конструкція природно передає застереження про небажаний можливий наслідок.
- source_word: καταπατήσουσιν αὐτοὺς ἐν τοῖς ποσὶν αὐτῶν
  choice: вони не потоптали їх ногами
  rationale: «Потоптали» передає інтенсивність καταπατέω, а «ногами» відтворює явно виражене ἐν τοῖς ποσὶν αὐτῶν без неприродного дублювання присвійного займенника.
- source_word: στραφέντες
  choice: а тоді, обернувшись
  rationale: Дієприслівник зберігає форму й послідовність аористового дієприкметника; «а тоді» виразно відмежовує наступну ворожу дію від топтання перлин.
- source_word: ῥήξωσιν ὑμᾶς
  choice: не роздерли вас
  rationale: «Роздерли» зберігає буквальну жорстокість ῥήγνυμι й не послаблює її до загального «напали»; множинне «вас» відповідає ὑμᾶς.
theological_decisions:
- issue: Значення образів «святе», «пси», «перлини» і «свині»
  choice: Зберегти образи без тлумачного розгортання.
  alternative: Ототожнити святе або перлини з конкретним ученням чи звісткою, а псів і свиней — із певною категорією людей.
  rationale: Сам вірш не розшифровує образів однозначно. Їхнє збереження не звужує можливий зміст і не вносить конфесійного тлумачення.
- issue: Співвіднесення двох загроз у завершальній частині
  choice: 'Передати природну послідовність: свині топчуть перлини, а тоді, обернувшись, роздирають слухачів.'
  alternative: Граматично перебудувати вислів так, щоб неявно приписати різні дії різним образним тваринам або зробити зв’язок однозначнішим, ніж у грецькому тексті.
  rationale: Грецький текст поєднує καταπατήσουσιν і ῥήξωσιν в одному застереженні, причому στραφέντες позначає перехід до наступної дії. Переклад зберігає цю структуру без додаткового пояснення.
translation_notes:
  register: Сучасна стандартна українська з лаконічним, урочистим біблійним звучанням. «Псам» обрано замість нейтральнішого «собакам», щоб зберегти різкість образу; решта лексики є загальнозрозумілою й не архаїчною.
