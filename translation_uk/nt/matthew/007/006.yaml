  naturalness: «Не давайте святого псам» є впізнаваним біблійним зворотом, але для сучасної стандартної української природніше й прозоріше «Не давайте псам того, що святе». Завершення без доданого «а тоді» звучить лаконічніше та ближче до синтаксису оригіналу.
