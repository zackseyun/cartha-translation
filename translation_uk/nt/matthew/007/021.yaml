id: MAT.7.21
reference: Matthew 7:21
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Οὐ πᾶς ὁ λέγων μοι· Κύριε κύριε εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν, ἀλλ’ ὁ ποιῶν τὸ θέλημα τοῦ πατρός μου τοῦ ἐν ⸀τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/021.yaml
  text: Not everyone who says to me[a], ‘Lord, Lord,’ will enter into the kingdom of heaven[b], but the one who does the will of my Father who is in heaven will enter.
translation:
  language: uk
  text: 'Не кожен, хто каже мені: «Господи, Господи», увійде в Царство Небесне[a], а той, хто виконує волю мого Отця, який на небесах[b], — увійде.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «у Царство небес». Матвій часто вживає цей вислів там, де в інших контекстах сказано «Царство Боже».'
    reason: lexical_alternative
  - marker: b
    text: 'У грецькому тексті тут також стоїть множина: «на небесах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ πᾶς ὁ λέγων μοι
  choice: Не кожен, хто каже мені
  rationale: Οὐ з πᾶς виражає часткове заперечення — «не кожен», а не «ніхто». Дієприкметник теперішнього часу природно передано підрядним означальним реченням без звуження його загального значення.
- source_word: Κύριε κύριε
  choice: Господи, Господи
  rationale: Кличну форму й повтор збережено; повторення передає наполегливе, підсилене звертання.
- source_word: εἰσελεύσεται
  choice: увійде
  rationale: Майбутню форму εἰσέρχομαι природно й точно передано українським доконаним дієсловом майбутнього часу.
- source_word: εἰς τὴν βασιλείαν τῶν οὐρανῶν
  choice: в Царство Небесне
  rationale: Це усталений і зрозумілий український відповідник характерного для Матвія вислову; примітка зберігає інформацію про буквальну множину «небес».
- source_word: ἀλλ’ ὁ ποιῶν
  choice: а той, хто виконує
  rationale: Субстантивований дієприкметник передано особовою конструкцією в однині. «Виконує» природно передає діяльне здійснення волі, а протиставний «а» відповідає українській будові «не кожен … а той».
- source_word: τὸ θέλημα
  choice: волю
  rationale: «Воля» зберігає і богословське, і етичне значення наміру та вимоги Отця, не звужуючи його до самого бажання.
- source_word: τοῦ πατρός μου
  choice: мого Отця
  rationale: Присвійний родовий відмінок передано прямо; назву «Отець» написано з великої літери як позначення Бога, без додавання відсутнього в цій словосполуці прикметника «небесний».
- source_word: τοῦ ἐν τοῖς οὐρανοῖς
  choice: який на небесах
  rationale: Означальна конструкція прямо стосується Отця. Українське «на небесах» природно зберігає множину грецького οὐρανοῖς.
theological_decisions:
- issue: Вхід у Царство у зв’язку зі словесним визнанням і послухом
  choice: Збережено пряме протиставлення між звертанням до Ісуса «Господи» та виконанням волі Отця.
  alternative: Тлумачити цей вірш як повний виклад спасіння ділами або, навпаки, згладити вимогу послуху на користь самого словесного визнання.
  rationale: Грецький текст виразно протиставляє говоріння і виконання, але сам по собі не викладає повної системи вчення про виправдання чи спасіння. Переклад не розв’язує цю богословську напругу замість тексту.
- issue: Повторення присудка в другій частині
  choice: Додано «увійде» після тире як явно відновлений в українській мові присудок.
  alternative: 'Залишити другу частину без повтореного дієслова: «а той, хто виконує…».'
  rationale: У грецькому тексті присудок змістово поширюється на обидві протиставлені частини. Повтор робить українське речення завершеним і недвозначним, не додаючи нового твердження.
translation_notes:
  register: Сучасна літературна українська з гідним, загальнозрозумілим біблійним звучанням. Збережено емфатичний повтор «Господи, Господи» та чіткий контраст між словами і виконанням. Займенники щодо Ісуса подано зі звичайної малої літери; «Отець» — з великої як назву Бога.
