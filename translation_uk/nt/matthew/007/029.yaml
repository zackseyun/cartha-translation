  source_fidelity: Переклад точно передає пояснювальне γάρ («бо»), минулу тривалу дію перифрастичного імперфекта («навчав»), додаток «їх», порівняння ὡς ἐξουσίαν ἔχων та виразне протиставлення книжникам. «Як Той, Хто має владу» зберігає особову конструкцію й не конкретизує джерела цієї влади понад те, що сказано в тексті.
  naturalness: Текст звучить природно в сучасній стандартній українській і водночас має належний біблійний регістр. «Книжники» є зрозумілим усталеним історико-біблійним терміном. Написання «Той, Хто» узгоджується з обраним шанобливим стилем і не змінює змісту.
  terminology: «Влада» є прийнятним відповідником ἐξουσία в цьому контексті; вона передає не лише впевненість мовлення, а справжній авторитет. «Їхні книжники» обґрунтовано зберігає αὐτῶν. Виноска коректно подає ідіоматичну стилістичну альтернативу «владно».
