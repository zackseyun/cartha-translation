  text: ἦν γὰρ διδάσκων αὐτοὺς ὡς ἐξουσίαν ἔχων καὶ οὐχ ὡς οἱ γραμματεῖς ⸀αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/029.yaml
  text: for he was teaching them as one having authority[a], and not as their scribes.
translation:
  language: uk
  text: бо Він навчав їх як Той, Хто має владу[a], а не як їхні книжники.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або, природніше: «владно».'
    reason: Лексико-стилістична альтернатива до особової конструкції ὡς ἐξουσίαν ἔχων.
lexical_decisions:
- source_word: ἦν γὰρ διδάσκων
  choice: бо Він навчав
  rationale: Частка γάρ пояснює подив людей у попередньому вірші, а перифрастичний імперфект ἦν + διδάσκων передає тривалу дію в минулому; українське «навчав» природно виражає цей аспект у контексті.
- source_word: αὐτούς
  choice: їх
  rationale: Прямий додаток, що стосується слухачів Ісуса.
- source_word: ὡς ἐξουσίαν ἔχων
  choice: як Той, Хто має владу
  rationale: Передає особову порівняльну конструкцію та значення ἐξουσία як реальної влади й повноваження, не зводячи її лише до впевненого тону.
- source_word: καὶ οὐχ ὡς
  choice: а не як
  rationale: Українське протиставне «а не» природно й точно передає контраст грецької конструкції.
- source_word: οἱ γραμματεῖς αὐτῶν
  choice: їхні книжники
  rationale: «Книжники» — усталений і точний відповідник для знавців та вчителів Закону; присвійний займенник зберігає αὐτῶν.
theological_decisions:
- issue: Характер влади Ісуса в навчанні
  choice: 'Описово передати порівняння: «як Той, Хто має владу».'
  alternative: Прямо уточнити, що йдеться про божественну владу, або послабити значення до самої впевненості чи переконливості.
  rationale: Вірш стверджує справжню владу Ісуса й протиставляє Його книжникам, але тут не пояснює її остаточного богословського джерела; переклад зберігає цю напругу без доданого тлумачення.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Велика літера у займенниковому найменуванні «Той, Хто» допомагає природно оформити особову конструкцію щодо Ісуса; «книжники» зберігає біблійно-історичний термін.
