    text: Або «прийшли повені»; грецьке слово буквально означає «ріки».
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: полив дощ
  rationale: Природний український вислів передає початок і низхідний рух дощу без зайвої конкретизації його сили.
- source_word: οἱ ποταμοί
  choice: ріки
  rationale: Пряме значення ποταμοί — «ріки»; контекст допускає розуміння розлитих рік або повеней, що зазначено у примітці.
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: подули вітри
  rationale: Прямий і природний відповідник грецького вислову.
- source_word: προσέπεσαν τῇ οἰκίᾳ ἐκείνῃ
  choice: вдарили в той дім
  rationale: У контексті бурі προσπίπτω виражає сильний удар об будинок; переклад не нав’язує тривалості чи повторюваності дії.
- source_word: οὐκ ἔπεσεν
  choice: він не впав
  rationale: Прямо передає дієслово πίπτω й зберігає образ падіння, не посилюючи його до «зруйнувався».
- source_word: τεθεμελίωτο
  choice: був закладений
  rationale: Плюсквамперфект пасивного стану описує вже наявний результат попереднього закладання основи; український вислів природно передає стан будинку.
- source_word: ἐπὶ τὴν πέτραν
  choice: на скелі
  rationale: «Скеля» точно передає πέτρα та зберігає звичайний образ притчі без уточнення «корінна порода».
theological_decisions:
- issue: Образ основи в притчі
  choice: на скелі
  alternative: на кам’яній основі / на корінній породі
  rationale: Вірш сам не ототожнює скелю з певною богословською реальністю; простий образ збережено без доданого тлумачення.
translation_notes:
  register: Сучасна нормативна українська мова з гідним, доступним біблійним звучанням. Полісиндетон оригіналу переважно збережено повторенням «і», тоді як перед протиставленням ужито природне українське «але».
