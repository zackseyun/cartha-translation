base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/013.yaml
  text: And Jesus said to the centurion[a], “Go; as you have believed, let it be done for you.” And the servant was healed in that hour.
translation:
  language: uk
  text: 'Ісус сказав сотникові: «Іди. Нехай станеться тобі так, як ти повірив». І тієї години слуга[a] був зцілений.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «хлопець» чи «дитина»; грецьке слово παῖς може означати слугу або молоду людину. У цьому контексті найкраще пасує «слуга» — підлеглий сотника.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: сотникові
  rationale: Усталена й точна українська назва римського військового начальника, що командував приблизно сотнею воїнів.
- source_word: Ὕπαγε
  choice: Іди
  rationale: Прямо й природно передає наказовий спосіб дієслова зі значенням відходу.
- source_word: ὡς ἐπίστευσας
  choice: так, як ти повірив
  rationale: Зберігає особову дієслівну форму й співвіднесеність результату з виявленою вірою, не перетворюючи вислів на абстрактне «за твоєю вірою».
- source_word: γενηθήτω σοι
  choice: Нехай станеться тобі
  rationale: Передає наказово-побажальну силу пасивної форми γίνομαι та її широкий зміст без уточнення неназваного виконавця.
- source_word: παῖς
  choice: слуга
  rationale: У контексті сотникового підлеглого це найімовірніше значення; можливі значення «хлопець» і «дитина» збережено в примітці.
- source_word: ἰάθη
  choice: одужав
  rationale: Природний сучасний український відповідник у цьому контексті; передає досягнутий стан зцілення, хоча граматична форма грецького дієслова пасивна.
- source_word: ἐν τῇ ὥρᾳ ἐκείνῃ
  choice: тієї ж години
  rationale: Зберігає образ «години» та природно виражає часовий збіг, не звужуючи його неодмінно до миті.
theological_decisions:
- issue: Передача πιστεύω
  choice: повірив
  alternative: довірився; мав віру
  rationale: «Повірив» безпосередньо відтворює дієслівну форму й не нав'язує вужчого тлумачення характеру віри.
- issue: Наказово-побажальна форма γενηθήτω та неназвана дія
  choice: Нехай станеться тобі
  alternative: Нехай буде зроблено для тебе
  rationale: Обране формулювання зберігає богословську відкритість грецького пасиву й природно звучить українською, не називаючи виконавця дії.
translation_notes:
  register: Сучасна стандартна українська мова з гідним, ясним біблійним звучанням. Короткі репліки збережено; синтаксис природний для усного звернення. Маркер примітки поставлено безпосередньо після неоднозначного слова.
