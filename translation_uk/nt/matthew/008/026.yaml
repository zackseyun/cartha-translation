  text: καὶ λέγει αὐτοῖς· Τί δειλοί ἐστε, ὀλιγόπιστοι; τότε ἐγερθεὶς ἐπετίμησεν τοῖς ἀνέμοις καὶ τῇ θαλάσσῃ, καὶ ἐγένετο γαλήνη μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/026.yaml
  text: And he said to them, “Why are you fearful, you of little faith?” Then, having risen, he rebuked the winds and the sea, and there was a great calm.
translation:
  language: uk
  text: 'І каже їм: «Чого ви такі боязкі, маловірні?» Тоді він підвівся, загрозив вітрам і морю — і настала велика тиша.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δειλοί
  choice: боязкі
  rationale: Передає не просто відчуття страху, а боязкість і брак відваги, зберігаючи докір у запитанні Ісуса.
- source_word: ὀλιγόπιστοι
  choice: маловірні
  rationale: Стислий природний відповідник, що зберігає звертання та зв’язок між страхом і малою вірою.
- source_word: ἐπετίμησεν
  choice: наказав
  rationale: У цьому контексті означає владно звернутися із забороною чи наказом; «наказав» природно звучить щодо вітрів і моря, не послаблюючи владного характеру дії.
- source_word: γαλήνη μεγάλη
  choice: велика тиша
  rationale: Передає повний спокій моря після бурі; прикметник «велика» збережено для відповідності виразному семітському за відтінком формулюванню грецького тексту.
theological_decisions:
- issue: Характер докору учням
  choice: «Чого ви такі боязкі, маловірні?»
  alternative: «Чому ви боїтеся, маловіри?»
  rationale: Обраний варіант зберігає прикметникову форму δειλοί та пряме звертання ὀλιγόπιστοι, не пояснюючи додатково природу чи міру їхньої віри.
- issue: Владне приборкання стихії
  choice: «наказав вітрам і морю»
  alternative: «докорив вітрам і морю»
  rationale: «Наказав» ясніше передає дієву владу, закладену в ἐπιτιμάω у контексті припинення бурі, без додавання богословського пояснення особи Ісуса.
translation_notes:
  register: Сучасна стандартна українська, лаконічна й гідна. Історичний теперішній «каже» збережено з грецького тексту; далі вжито минулий час. Тире перед наслідком природно підкреслює раптовий перехід від наказу до повної тиші.
