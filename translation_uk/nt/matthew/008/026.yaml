  source_fidelity: The address «боязкі, маловірні» accurately represents δειλοί and ὀλιγόπιστοι, retaining both the rebuke and the direct plural address. «Наказав» weakens and somewhat shifts ἐπετίμησεν, whose ordinary sense here is a forceful rebuke/reprimand directed at the winds and sea. «Устав» is also not the appropriate modern-standard past form in this context.
  naturalness: The sentence is concise and generally natural. «Підвівся» is idiomatic modern standard Ukrainian. «Загрозив вітрам і морю» is a natural elevated narrative rendering for the forceful speech-act in this context. «Настала велика тиша» works idiomatically for the sudden stillness following a storm, though the Greek more literally denotes a great calm.
  terminology: «Маловірні» is an established, understandable Ukrainian rendering of ὀλιγόπιστοι and does not overinterpret the term. No theological terminology or doctrinal expansion is introduced.
