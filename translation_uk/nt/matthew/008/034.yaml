revisions:
- from: І ось, усе місто вийшло назустріч Ісусові, а коли вони побачили Його, то стали благати, щоб Він пішов з їхнього краю.[a]
  to: І ось, усе місто вийшло назустріч Ісусові, а коли вони побачили Його, то благали Його, щоб Він пішов з їхнього краю.[a]
  rationale: 'Внесено лише мінімальну правку: вилучено інгресивне «стали», щоб точніше передати грецький аорист без додаткового значення. Решту тексту та примітку збережено, оскільки вони точно й природно передають джерело та не розв’язують невиражений мотив прохання.'
