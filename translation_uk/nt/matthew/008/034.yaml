review_pass:
  verdict: revise
  source_fidelity: 'Зміст передано загалом точно: «усе місто» зберігає колективну метонімію, «вийшло назустріч» відповідає εἰς ὑπάντησιν, а прохання залишити їхню територію не пояснюється доданим мотивом. Проте «стали благати» має інгресивний відтінок («почали благати»), якого аорист παρεκάλεσαν сам по собі не вимагає.'
  naturalness: Текст звучить природно сучасною українською. Заміна «стали благати» на «благали» усуває непотрібний аспектуальний додаток і зберігає гідний оповідний регістр. «Ісусові» та велика літера займенника узгоджуються з поширеною біблійною українською практикою.
  terminology: «Край» є прийнятним контекстуальним відповідником τὰ ὅρια у значенні місцевої території; примітка належно зберігає альтернативи «територія» та буквальні «межі». Особове ім’я й географічний вислів передано усталено й без конфесійного тлумачення.
