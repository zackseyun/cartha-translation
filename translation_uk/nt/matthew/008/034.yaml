  text: καὶ ἰδοὺ πᾶσα ἡ πόλις ἐξῆλθεν εἰς ⸀ὑπάντησιν τῷ Ἰησοῦ, καὶ ἰδόντες αὐτὸν παρεκάλεσαν ὅπως μεταβῇ ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/034.yaml
  text: And behold[a], the whole city went out to meet Jesus, and when they saw him, they begged him to depart from their region.
translation:
  language: uk
  text: І ось, усе місто вийшло назустріч Ісусові, а коли вони побачили Його, то благали Його, щоб Він пішов з їхнього краю.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «з їхньої території»; буквальніше — «від їхніх меж».
    reason: Лексема ὅρια буквально пов’язана з межами, але в контексті означає територію, окреслену цими межами.
lexical_decisions:
- source_word: ἰδοὺ
  choice: ось
  rationale: Зберігає функцію оповідного маркера, який привертає увагу, і природно звучить у сучасній українській.
- source_word: πᾶσα ἡ πόλις
  choice: усе місто
  rationale: 'Передає грецьку метонімію: йдеться про мешканців міста як спільноту, без обов’язкового твердження, що вийшла буквально кожна людина.'
- source_word: ἐξῆλθεν
  choice: вийшло
  rationale: Прямо передає рух людей із міста; граматично узгоджується з метонімічним висловом «усе місто».
- source_word: εἰς ὑπάντησιν
  choice: назустріч
  rationale: Природний український відповідник усталеного грецького вислову про вихід для зустрічі з кимось.
- source_word: τῷ Ἰησοῦ
  choice: Ісусові
  rationale: Давальний відмінок природно поєднується з прислівником «назустріч»; ім’я передано за усталеною українською традицією.
- source_word: ἰδόντες αὐτὸν
  choice: коли вони побачили Його
  rationale: Часове підрядне речення ясно й природно передає аористовий дієприкметник та послідовність подій.
- source_word: παρεκάλεσαν
  choice: стали благати
  rationale: Передає наполегливість прохання, сильнішу за нейтральне «попросили», не додаючи мотиву мешканців.
- source_word: ὅπως μεταβῇ
  choice: щоб Він пішов
  rationale: Конструкція з «щоб» природно передає зміст прохання; «пішов» ясно виражає залишення місцевості без надмірно книжного відтінку.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: з їхнього краю
  rationale: У множині ὅρια тут позначає територію в її межах, а не лише лінії кордону. «Край» природно передає територіальне значення, тоді як буквальніший образ меж збережено у примітці.
theological_decisions:
- issue: Причина прохання мешканців
  choice: 'Мотив не названо: вони лише благають Ісуса піти з їхнього краю.'
  alternative: Страх перед силою Ісуса; обурення через загибель свиней; загальна тривога через подію.
  rationale: Грецький текст повідомляє про прохання, але не пояснює його причини, тому переклад не додає жодного з можливих мотивів.
translation_notes:
  register: Сучасна, зрозуміла й гідна оповідна українська. «І ось» зберігає жвавість грецького викладу; «стали благати» передає силу прохання. Займенники щодо Ісуса подано з великої літери згідно з поширеною українською біблійною практикою.
