source:
  edition: SBLGNT
  text: οἱ δὲ βόσκοντες ἔφυγον, καὶ ἀπελθόντες εἰς τὴν πόλιν ἀπήγγειλαν πάντα καὶ τὰ τῶν δαιμονιζομένων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/033.yaml
  text: Then the herdsmen fled[a], and going away into the city, they reported everything, including what had happened to the demon-possessed men.
translation:
  language: uk
  text: А ті, що пасли свиней, утекли, а пішовши до міста, розповіли про все, зокрема й про те, що сталося з одержимими демонами[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальніше: «і про те, що стосувалося одержимих демонами».'
    reason: Лаконічний грецький вислів τὰ τῶν δαιμονιζομένων допускає ширше значення, ніж лише те, що з ними сталося.
lexical_decisions:
- source_word: οἱ δὲ βόσκοντες
  choice: А ті, що пасли свиней
  rationale: Дієприкметник означає тих, хто пас або доглядав стадо. «Свиней» природно відновлено з безпосереднього контексту; δέ передано як «А», що позначає перехід до їхньої реакції.
- source_word: ἔφυγον
  choice: утекли
  rationale: Прямо й виразно передає аорист φεύγω — швидко залишити місце через страх або небезпеку.
- source_word: ἀπελθόντες εἰς τὴν πόλιν
  choice: прийшовши до міста
  rationale: Дієприкметниковий зворот зберігає послідовність дій і природно звучить українською; «до міста» передає напрямок εἰς τὴν πόλιν.
- source_word: ἀπήγγειλαν πάντα
  choice: розповіли про все
  rationale: ἀπαγγέλλω тут означає повідомити або переказати новину, а πάντα має всеохопний зміст.
- source_word: καὶ τὰ τῶν δαιμονιζομένων
  choice: зокрема й про те, що сталося з одержимими демонами
  rationale: Грецький еліптичний вислів буквально стосується «того, що про/щодо одержимих демонами». Контекстуальне формулювання природно передає події, пов’язані з ними, не приховуючи буквальнішої можливості, наведеної в примітці.
- source_word: δαιμονιζομένων
  choice: одержимими демонами
  rationale: Усталений і зрозумілий сучасному читачеві вислів, який передає реальну владу демонів над цими людьми, не додаючи докладнішої доктринальної класифікації.
theological_decisions:
- issue: Передача δαιμονιζομένων без додаткової доктринальної конкретизації
  choice: одержимими демонами
  alternative: тими, хто перебував під владою демонів
  rationale: Обране формулювання прямо відбиває євангельську розповідь про демонічне поневолення, але не визначає його механізму чи ступеня понад сказане в тексті.
- issue: Еліптичний вислів τὰ τῶν δαιμονιζομένων
  choice: про те, що сталося з одержимими демонами
  alternative: про те, що стосувалося одержимих демонами
  rationale: Контекст указує на події, пов’язані з цими людьми, однак грецький вислів ширший; тому буквальніший варіант збережено в примітці.
translation_notes:
  register: Сучасна, проста й гідна оповідна українська. Уникнуто архаїчного «біснуваті» та професійно-вузького «свинопаси»; зміст ролі передано описово.
