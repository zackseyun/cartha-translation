language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Ὀψίας δὲ γενομένης προσήνεγκαν αὐτῷ δαιμονιζομένους πολλούς· καὶ ἐξέβαλεν τὰ πνεύματα λόγῳ, καὶ πάντας τοὺς κακῶς ἔχοντας ἐθεράπευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/016.yaml
  text: When evening came[a], they brought to him many who were demon-possessed; and he cast out the spirits with a word, and healed all who were sick.
translation:
  language: uk
  text: Коли ж настав вечір, до нього привели багатьох одержимих демонами[a]. Він словом вигнав духів і зцілив усіх хворих.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «тих, кого мучили демони». Грецький дієприкметник позначає людей під демонічним впливом; «одержимих демонами» — стислий усталений переклад.'
    reason: Лексична альтернатива, що зберігає широту значення δαιμονιζομένους.
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Коли ж настав вечір
  rationale: Генітив абсолютний виражає час; цей варіант природний сучасною українською і зберігає сполучний відтінок δέ через «ж».
- source_word: προσήνεγκαν αὐτῷ
  choice: до нього привели
  rationale: У цьому контексті προσφέρω означає привести людей до Ісуса; український порядок слів звучить природно.
- source_word: δαιμονιζομένους πολλούς
  choice: багатьох одержимих демонами
  rationale: Дієприкметник позначає людей під демонічним впливом. «Одержимих демонами» — стислий усталений відповідник, а примітка подає менш категоричний лексичний варіант.
- source_word: ἐξέβαλεν τὰ πνεύματα
  choice: вигнав духів
  rationale: Дієслово ἐκβάλλω в контексті екзорцизму означає «виганяти», а «духів» прямо відтворює грецький додаток без пояснювального додавання «злих».
- source_word: λόγῳ
  choice: словом
  rationale: Орудний відмінок природно передає інструментальний давальний і підкреслює дієвість одного владного слова, не додаючи відсутнього в грецькому тексті присвійного займенника.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: усіх хворих
  rationale: Ідіома κακῶς ἔχειν у цьому контексті означає бути хворим; стислий український вислів ясний і природний.
- source_word: ἐθεράπευσεν
  choice: зцілив
  rationale: У євангельських розповідях про надприродне відновлення здоров’я θεραπεύω природно передається дієсловом «зцілити».
theological_decisions:
- issue: Характер стану δαιμονιζομένους і значення τὰ πνεύματα
  choice: 'Зберегти текстові категорії демонічної одержимості та духів: «одержимих демонами» і «духів».'
  alternative: «Тих, кого мучили демони»; або психологізоване тлумачення як душевної хвороби.
  rationale: Вірш розрізняє вигнання духів і зцілення хворих. Переклад не ототожнює демонічне ураження з психічною хворобою, але приміткою визнає широту значення дієприкметника.
- issue: Інструментальне значення λόγῳ
  choice: «словом»
  alternative: «своїм словом» або «наказом»
  rationale: Такий переклад зберігає стислу вказівку на владне слово Ісуса, не додаючи присвійності чи конкретного виду висловлювання, яких у грецькому тексті прямо немає.
translation_notes:
  register: Сучасна стандартна українська, зрозуміла широкому читачеві, зі стриманим і гідним біблійним регістром. Займенники щодо Ісуса подано з малої літери відповідно до звичайної сучасної орфографії та без додавання конфесійного маркування.
