id: MAT.8.12
reference: Matthew 8:12
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: οἱ δὲ υἱοὶ τῆς βασιλείας ἐκβληθήσονται εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/012.yaml
  text: But the sons of the kingdom will be cast out into the outer darkness[c][b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: uk
  text: А сини Царства будуть викинуті в зовнішню темряву. Там буде плач і скрегіт зубів.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ υἱοὶ τῆς βασιλείας
  choice: А сини Царства
  rationale: «А» природно передає контраст δέ з попереднім віршем. Буквальне «сини Царства» зберігає грецький ідіоматичний вислів та іронію щодо тих, кого вважали належними спадкоємцями Царства.
- source_word: ἐκβληθήσονται
  choice: будуть викинуті
  rationale: Майбутня пасивна форма ἐκβάλλω виражає примусове вигнання; «будуть викинуті» передає силу дієслова сучасною українською мовою.
- source_word: τὸ σκότος τὸ ἐξώτερον
  choice: зовнішню темряву
  rationale: Формально близький і зрозумілий відповідник сталого матеївського образу, без пояснювального перефразування.
- source_word: ἐκεῖ
  choice: Там
  rationale: Початкова позиція в українському реченні зберігає наголос грецького тексту на місці суду.
- source_word: ὁ κλαυθμὸς
  choice: плач
  rationale: Звичний і точний відповідник, що передає скорботу без невиправданого посилення.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: скрегіт зубів
  rationale: Природний український біблійний вислів, що точно відтворює грецьку конструкцію.
theological_decisions:
- issue: Образи виключення й суду
  choice: Збережено конкретні образи викинення в зовнішню темряву, плачу та скреготу зубів.
  alternative: Передати це тлумачними словами на кшталт «пекло» або «вічна кара».
  rationale: Грецький текст описує суворе есхатологічне виключення образною мовою, не вживаючи тут слова «пекло» й не формулюючи повної доктрини покарання.
- issue: Передача υἱοὶ
  choice: сини
  alternative: діти; спадкоємці
  rationale: 'Чоловічий іменник та ідіома оригіналу збережені, щоб не послаблювати парадокс: ті, кого вважали законними членами Царства, будуть виключені.'
translation_notes:
  register: Сучасна стандартна українська мова; стиль урочистий, але доступний. Збережено стислий синтаксис, силу образів і богословську напругу оригіналу.
