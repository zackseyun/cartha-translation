  text: І він доторкнувся до її руки, і гарячка залишила її, а вона підвелася й служила йому.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «почала служити йому». Грецький імперфект може описувати тривалу дію, а в цьому контексті також допускає відтінок її початку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥψατο
  choice: доторкнувся
  rationale: Середня форма ἅπτω з родовим відмінком тут означає фізично торкнутися; «доторкнувся до» природно передає грецьку конструкцію.
- source_word: τῆς χειρὸς αὐτῆς
  choice: до її руки
  rationale: χείρ у цьому контексті означає «рука»; родовий після ἅπτομαι українською природно передається конструкцією «доторкнутися до».
- source_word: ἀφῆκεν αὐτὴν ὁ πυρετός
  choice: гарячка залишила її
  rationale: Збережено виразну грецьку конструкцію, де гарячка є підметом і покидає жінку; «залишила її» точно й зрозуміло передає ἀφῆκεν αὐτήν.
- source_word: πυρετός
  choice: гарячка
  rationale: Прямий сучасний український відповідник назви симптому або хворобливого стану без невиправданого розширення.
- source_word: ἠγέρθη
  choice: підвелася
  rationale: У найближчому оповідному контексті форма описує те, що жінка встала після зцілення; «підвелася» природне й не нав'язує воскресенських асоціацій.
- source_word: διηκόνει αὐτῷ
  choice: служила йому
  rationale: διακονέω тут позначає практичне служіння в домашній обстановці. Імперфект передає тривалу або розгорнуту дію, але сам по собі не вимагає додавати «почала».
theological_decisions:
- issue: Можливе богословське переосмислення ἠγέρθη як «була воскрешена»
  choice: підвелася
  alternative: була піднята; встала
  rationale: Безпосередній контекст говорить про звичайне вставання після одужання; переклад не повинен без текстової потреби вносити сюди тему воскресіння.
- issue: Інцептивне тлумачення імперфекта διηκόνει
  choice: служила йому
  alternative: почала служити йому
  rationale: Імперфект допускає розуміння початку або тривалості дії, однак інцептивність не виражена однозначно. Основний текст зберігає формальну невизначеність, а можливий варіант подано у примітці.
translation_notes:
  register: Сучасна стандартна українська, проста й гідна оповідна мова. Повтор сполучників частково збережено для відтворення послідовного ритму грецького речення; перед останньою частиною вжито природне українське «а».
