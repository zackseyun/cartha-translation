reference: Matthew 8:17
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Αὐτὸς τὰς ἀσθενείας ἡμῶν ἔλαβεν καὶ τὰς νόσους ἐβάστασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/017.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[b][a], saying: “He himself took our sicknesses and carried our diseases.”'
translation:
  language: uk
  text: 'щоб збулося сказане через пророка Ісаю: «Він сам узяв наші немочі[a] й поніс наші хвороби[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «слабкості» чи «недуги». Грецьке слово може означати слабкість, неміч або хворобу.
    reason: lexical_alternative
  - marker: b
    text: Або «ніс наші хвороби». Дієслово може означати нести або переносити тягар і перегукується з Ісаєю 53:4.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως πληρωθῇ
  choice: щоб збулося
  rationale: Природна українська формула мети й результату, яка зберігає характерний для Матвія мотив здійснення пророчого слова.
- source_word: τὸ ῥηθὲν
  choice: сказане
  rationale: Стисло й природно передає субстантивований пасивний дієприкметник.
- source_word: διὰ Ἠσαΐου τοῦ προφήτου
  choice: через пророка Ісаю
  rationale: '«Через» передає διά з родовим як посередництво: пророк є тим, через кого прозвучало слово.'
- source_word: λέγοντος
  choice: двокрапка перед цитатою
  rationale: В українській конструкції зміст дієприкметника природно передано пунктуаційним введенням прямої цитати без незграбного «який казав».
- source_word: Αὐτὸς
  choice: Він сам
  rationale: Зберігає виразний наголос грецького займенника.
- source_word: ἀσθενείας
  choice: немочі
  rationale: «Немочі» охоплює слабкості та тілесні недуги, зберігаючи широту грецького слова й пасуючи до контексту зцілень.
- source_word: ἔλαβεν
  choice: узяв
  rationale: Безпосередньо передає λαμβάνω, не додаючи значення «усунув» і не ототожнюючи його з наступним дієсловом.
- source_word: νόσους
  choice: хвороби
  rationale: Точно й природно позначає конкретні захворювання.
- source_word: ἐβάστασεν
  choice: поніс
  rationale: Передає значення носіння тягаря та зберігає зв’язок із мовою Ісаї 53, не визначаючи тут точного богословського механізму.
theological_decisions:
- issue: Зміст цитати з Ісаї 53:4 у контексті зцілень
  choice: «немочі» та «хвороби» як назви тілесних страждань із збереженням ширшого відтінку першого слова
  alternative: «слабкості» та «недуги» або формулювання, сильніше забарвлене мовою замісного понесення
  rationale: Безпосередній контекст Матвія стосується зцілень, однак лексика цитати та дієслово «поніс» не повинні бути звужені так, щоб усунути її зв’язок з Ісаєю 53 чи наперед визначити весь богословський зміст.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. «Немочі» має помірно біблійний відтінок, але лишається загальнозрозумілим; «узяв» і «поніс» відтворюють розрізнення двох грецьких дієслів.
