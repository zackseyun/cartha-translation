  text: καὶ ἐκτείνας τὴν χεῖρα ἥψατο ⸀αὐτοῦ λέγων· Θέλω, καθαρίσθητι· καὶ εὐθέως ἐκαθαρίσθη αὐτοῦ ἡ λέπρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/003.yaml
  text: And stretching out his hand[a], he touched him, saying, “I am willing[c][b]; be cleansed.” And immediately his leprosy was cleansed.
translation:
  language: uk
  text: 'Простягнувши руку, він доторкнувся до нього й сказав: «Хочу — очисться!» І відразу він очистився від своєї прокази[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Грецьке слово λέπρα могло позначати ширше коло тяжких шкірних захворювань, а не лише хворобу Гансена, яку нині називають проказою.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκτείνας τὴν χεῖρα
  choice: простягнувши руку
  rationale: Дієприслівникова конструкція природно передає попередню супровідну дію аористового дієприкметника й зберігає конкретний фізичний жест.
- source_word: ἥψατο αὐτοῦ
  choice: доторкнувся до нього
  rationale: Середній стан ἅπτομαι з родовим відмінком у цьому контексті має звичайне значення фізичного дотику.
- source_word: Θέλω
  choice: Хочу
  rationale: Українське «Хочу» стисло й природно передає волевиявлення у відповідь на запитання про готовність Ісуса, не перетворюючи вислів на майбутній час.
- source_word: καθαρίσθητι
  choice: очисться
  rationale: Звичний український наказовий вислів зберігає мову очищення та її одночасний фізичний і ритуальний зміст; буквальне «будь очищений» звучало б неприродно.
- source_word: εὐθέως
  choice: відразу
  rationale: Передає наголошену в тексті негайність наслідку природною сучасною українською мовою.
- source_word: ἐκαθαρίσθη
  choice: очистилася
  rationale: Лексично узгоджується з наказом «очисться» і не звужує значення до самого лише фізичного зцілення.
- source_word: αὐτοῦ ἡ λέπρα
  choice: його проказа
  rationale: Збережено граматичний підмет грецького речення — «проказа» — та присвійне значення αὐτοῦ; традиційний термін пояснено в примітці.
theological_decisions:
- issue: Мова очищення в καθαρίζω
  choice: В обох випадках ужито корінь «очист-»
  alternative: Передати результат як «зцілився»
  rationale: Грецький текст підкреслює очищення, що поєднує фізичний і ритуальний виміри; «зцілився» звузило б смисл.
- issue: Значення Θέλω у відповіді Ісуса
  choice: «Хочу»
  alternative: «Я готовий» або «Я зроблю це»
  rationale: «Хочу» безпосередньо передає волю та зберігає лаконічність оригіналу, не додаючи майбутнього значення.
- issue: Граматичний підмет останньої частини
  choice: «очистилася його проказа»
  alternative: «він очистився від прокази»
  rationale: Збережено незвичну, але зрозумілу побудову оригіналу, де підметом є ἡ λέπρα, а не чоловік.
translation_notes:
  register: Сучасна стандартна українська мова, лаконічний і гідний біблійний стиль. Збережено дієприслівникову послідовність, повтор мови очищення та граматичний підмет завершальної частини; тире природно передає різкий перехід від згоди до наказу.
