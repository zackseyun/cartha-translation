  source_fidelity: Початкові дієприслівниковий зворот, дотик, «Хочу», наказ очищення та εὐθέως передано точно. Проте «очистилася його проказа» є неприродною українською персоніфікацією хвороби. Хоча в грецькому тексті ἡ λέπρα формально є підметом, український відповідник із людиною як підметом точніше передає результат вислову без зміни його змісту.
  naturalness: «Простягнувши руку, він доторкнувся до нього» та «І відразу» природні для сучасної стандартної української. «Він очистився від своєї прокази» є значно ідіоматичнішим і зберігає повтор лексики очищення.
  terminology: «Проказа» як традиційний відповідник λέπρα придатний за наявності примітки. «Очисться» доречно зберігає мову очищення; «своєї прокази» чітко відтворює належність, виражену αὐτοῦ.
