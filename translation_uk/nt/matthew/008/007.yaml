  text: 'І каже йому[a]: «Я прийду й зцілю його».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Мені прийти й зцілити його?» Деякі тлумачі з огляду на контекст розуміють слова Ісуса як запитання, однак саме грецьке формулювання природніше читається як твердження.'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: І
  rationale: Зберігає простий оповідний зв’язок без додавання часового чи причинно-наслідкового відтінку.
- source_word: λέγει
  choice: каже
  rationale: Історичний теперішній час передано теперішнім часом, що зберігає жвавість грецької оповіді й природно звучить українською.
- source_word: αὐτῷ
  choice: йому
  rationale: Прямий і природний відповідник давального відмінка при дієслові мовлення.
- source_word: Ἐγὼ
  choice: Я
  rationale: Окремо вжитий займенник має певний наголос; явне «Я» зберігає його без надмірного підсилення.
- source_word: ἐλθὼν
  choice: прийду й
  rationale: Аористовий дієприкметник у поєднанні з майбутнім дієсловом природно передає супровідну та послідовну дію; українське «прийду й» відтворює її без буквального й неприродного дієприслівника.
- source_word: θεραπεύσω
  choice: зцілю
  rationale: У контексті чудесного відновлення здоров’я «зцілю» є природним, точним і стилістично відповідним біблійній оповіді.
- source_word: αὐτόν
  choice: його
  rationale: Прямий займенниковий додаток, що стосується хворого слуги.
theological_decisions:
- issue: Чи передавати слова Ісуса як твердження, чи як запитання
  choice: 'твердження: «Я прийду й зцілю його»'
  alternative: 'запитання: «Мені прийти й зцілити його?» або «Чи прийти Мені й зцілити його?»'
  rationale: У грецькому тексті немає питальної частки, а саме формулювання природно читається як розповідне речення. Контекст допускає питальне тлумачення, тому його збережено в примітці, але не внесено до основного тексту.
translation_notes:
  register: Сучасна нормативна українська мова; виклад стислий, природний і гідний. Історичний теперішній «каже» та простий сполучник «І» зберігають оповідну форму оригіналу.
