  text: And when Jesus came into Peter’s house[b][a], he saw his mother-in-law lying down and having a fever.
translation:
  language: uk
  text: Коли Ісус увійшов до дому Петра, він побачив Петрову тещу, що лежала й мала гарячку.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν
  choice: коли Ісус прийшов
  rationale: Аористовий дієприкметник передає попередню щодо головної дії подію; підрядне речення часу природно відтворює це сучасною українською.
- source_word: οἰκίαν Πέτρου
  choice: до дому Петра
  rationale: Передає належність будинку Петрові; «дім» тут природне й достатньо близьке до οἰκία.
- source_word: πενθερὰν αὐτοῦ
  choice: Петрова теща
  rationale: πενθερά означає «теща», а αὐτοῦ у цьому контексті стосується Петра. Ім’я замість займенника усуває неприродну для української двозначність щодо Ісуса.
- source_word: βεβλημένην
  choice: лежить
  rationale: Перфектний пасивний дієприкметник βάλλω тут описує стан людини, яка лежить; згадки про ліжко в грецькому тексті немає.
- source_word: πυρέσσουσαν
  choice: у гарячці
  rationale: 'Природний український вислів для тривалого стану, позначеного дієприкметником πυρέσσουσαν: вона мала гарячку.'
theological_decisions:
- issue: До кого стосується αὐτοῦ у вислові «його тещу»
  choice: Жінка є тещею Петра.
  alternative: Через близькість імені Ісуса займенник у перекладі можна було б помилково віднести до Ісуса.
  rationale: І синтаксис, і контекст вказують на Петра. Формулювання «Петрова теща» ясно передає цей зв’язок, не додаючи подальших богословських висновків.
translation_notes:
  register: Сучасна стандартна українська, природний і гідний оповідний стиль. Конструкція «лежить у гарячці» стисло передає обидва грецькі дієприкметники, не додаючи неявної згадки про ліжко.
