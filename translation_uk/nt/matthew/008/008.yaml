  text: ⸂καὶ ἀποκριθεὶς⸃ ὁ ἑκατόνταρχος ἔφη· Κύριε, οὐκ εἰμὶ ἱκανὸς ἵνα μου ὑπὸ τὴν στέγην εἰσέλθῃς· ἀλλὰ μόνον εἰπὲ λόγῳ, καὶ ἰαθήσεται ὁ παῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/008.yaml
  text: And the centurion answered[a], “Lord, I am not worthy that you should come under my roof. But only speak a word[b], and my servant will be healed.”
translation:
  language: uk
  text: 'Сотник відповів: «Господи, я не гідний, щоб Ти ввійшов під мій дах. Але тільки скажи слово[a] — і мій слуга[b] буде зцілений».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «лише промов слово». Грецьке слово λόγῳ («словом») тут виражає засіб.
    reason: lexical_alternative
  - marker: b
    text: Або «хлопець» чи «дитина». Грецьке слово може означати дитину, юнака або слугу — залежно від контексту.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς … ἔφη
  choice: відповів
  rationale: Дієприкметник ἀποκριθείς разом із дієсловом мовлення ἔφη утворює звичну оповідну формулу. Одне дієслово «відповів» природно передає її українською без незграбного «відповів і сказав».
- source_word: ἑκατόνταρχος
  choice: сотник
  rationale: Усталена й точна українська назва римського військового командира приблизно сотні воїнів.
- source_word: Κύριε
  choice: Господи
  rationale: Клична форма «Господи» природно передає звертання κύριε та зберігає як шанобливий, так і можливий христологічний відтінок.
- source_word: ἱκανός
  choice: гідний
  rationale: У цьому контексті слово стосується належності або гідності прийняти Ісуса, а не просто спроможності.
- source_word: ὑπὸ τὴν στέγην
  choice: під мій дах
  rationale: Збережено виразний грецький образ дому, не зводячи його до нейтрального «до мого дому».
- source_word: ἀλλὰ μόνον εἰπὲ λόγῳ
  choice: Але лише промов слово
  rationale: Передано обмежувальну силу μόνον і близько відтворено образ мовленого слова; український вислів залишається природним і урочистим.
- source_word: ἰαθήσεται
  choice: буде зцілений
  rationale: Майбутній пасив дієслова ἰάομαι прямо й точно передано пасивною конструкцією, доречною в оповіді про зцілення.
- source_word: παῖς
  choice: слуга
  rationale: Контекст сотника та паралельна оповідь підтримують значення «слуга», але лексична неоднозначність слова збережена в примітці.
theological_decisions:
- issue: Передача κύριος у звертанні до Ісуса
  choice: Господи
  alternative: пане
  rationale: «Господи» зберігає можливу христологічну вагу звертання, не стверджуючи більше, ніж дозволяє сам контекст.
- issue: Значення παῖς
  choice: слуга
  alternative: хлопець або дитина
  rationale: «Слуга» найкраще відповідає оповідному контексту, однак грецьке слово саме по собі допускає також вікове або родинне значення, тому альтернативи зазначено в примітці.
translation_notes:
  register: Сучасна стандартна українська мова з гідним оповідним тоном. Збережено біблійний образ «під мій дах», але синтаксис зроблено природним для звичайного сучасного читача. Займенник «Ти» написано з великої літери як усталену шанобливу форму звертання до Ісуса.
