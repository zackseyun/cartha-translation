  source_fidelity: 'Текст точно передає всі суттєві елементи грецького оригіналу: καὶ — «І», προσελθών — «підійшов», εἷς γραμματεύς — «один книжник», εἶπεν αὐτῷ — «сказав Йому», Διδάσκαλε — «Учителю», а також майбутню заяву ἀκολουθήσω і необмежене ὅπου ἐὰν ἀπέρχῃ. Конструкція «куди б Ти не пішов» нормативно виражає значення «куди б Ти не пішов / куди б Ти не подався»; «не» тут не є смисловим запереченням.'
  naturalness: Формулювання природне для сучасної нормативної української та водночас зберігає стриманий біблійний регістр. «Підійшов один книжник та сказав» є плавним оповідним викладом. «Я піду за Тобою» ясно зберігає і буквальний, і учнівський вимір вислову.
  terminology: «Книжник» є усталеним точним відповідником γραμματεύς у євангельському контексті. «Учителю» правильно передає кличний відмінок Διδάσκαλε без невиправданого богословського посилення. Шанобливе написання займенника з великої літери допустиме як українська редакційна конвенція і не змінює значення.
