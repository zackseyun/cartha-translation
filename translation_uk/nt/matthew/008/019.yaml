  text: καὶ προσελθὼν εἷς γραμματεὺς εἶπεν αὐτῷ· Διδάσκαλε, ἀκολουθήσω σοι ὅπου ἐὰν ἀπέρχῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/019.yaml
  text: And one scribe came up and said to him[a], “Teacher, I will follow you wherever you go.”
translation:
  language: uk
  text: 'І підійшов один книжник та сказав Йому: «Учителю, я піду за Тобою, куди б Ти не пішов».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «куди б Ти не відійшов / не вирушив». Грецьке дієслово може конкретніше означати відхід або вирушання, хоча тут природно передається словом «пішов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: підійшов
  rationale: Дієприкметник аориста від προσέρχομαι позначає наближення до Ісуса перед зверненням; українське «підійшов» природно й точно передає цей рух.
- source_word: εἷς
  choice: один
  rationale: Числівник виокремлює одного представника групи; буквальне «один книжник» природне в українській оповіді й не додає невисловленої конкретизації.
- source_word: γραμματεὺς
  choice: книжник
  rationale: «Книжник» — усталений український біблійний відповідник, який позначає знавця й учителя Писання, не розгортаючи значення пояснювальним перифразом.
- source_word: Διδάσκαλε
  choice: Учителю
  rationale: Кличний відмінок природно відтворює пряме шанобливе звертання та передає основне значення διδάσκαλος без посилення титулу.
- source_word: ἀκολουθήσω
  choice: я піду за Тобою
  rationale: Майбутній час виражає заявлений намір. «Піду за Тобою» зберігає буквальний образ слідування та можливий учнівський відтінок.
- source_word: ὅπου ἐὰν
  choice: куди б
  rationale: Сполука передає невизначено-відносне, необмежене значення; українська конструкція «куди б ... не» природно виражає «будь-куди».
- source_word: ἀπέρχῃ
  choice: Ти не пішов
  rationale: У цій конструкції «пішов» природно передає рух до будь-якого місця; частка «не» є складником нормативної української моделі «куди б ... не» і не виражає заперечення.
theological_decisions:
- issue: Передача διδάσκαλος як звертання до Ісуса
  choice: Учителю
  alternative: Учителю-наставнику; Владико; Равві
  rationale: «Учителю» безпосередньо відповідає грецькому слову й зберігає шанобливе звертання, не надаючи йому сильнішої христологічної або конфесійної ваги.
- issue: Учнівський відтінок ἀκολουθήσω
  choice: піду за Тобою
  alternative: слідуватиму за Тобою; стану Твоїм послідовником
  rationale: Обране формулювання зберігає одночасно буквальне пересування слідом за Ісусом і ширший сенс учнівства, не змушуючи читача обрати лише один із них.
translation_notes:
  register: Сучасна нормативна українська з гідним біблійним звучанням. У прямій мові займенники щодо Ісуса написано з великої літери як усталену шанобливу графічну норму; це не змінює змісту грецького тексту. Маркер примітки поставлено після всієї цитати, якої стосується лексична альтернатива.
