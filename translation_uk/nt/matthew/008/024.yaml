  text: καὶ ἰδοὺ σεισμὸς μέγας ἐγένετο ἐν τῇ θαλάσσῃ, ὥστε τὸ πλοῖον καλύπτεσθαι ὑπὸ τῶν κυμάτων, αὐτὸς δὲ ἐκάθευδεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/024.yaml
  text: And behold[a], a great storm arose on the sea, so that the boat was being swamped by the waves[b]; but he was sleeping.
translation:
  language: uk
  text: І ось[a] на морі знялася велика буря, так що хвилі накривали човен[b], а Він спав.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Грецьке ἰδού — вказівний вигук, що привертає увагу й підкреслює раптовість події.
    reason: discourse_marker
  - marker: b
    text: 'Буквально: «човен був накриваний хвилями».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: ось
  rationale: Природний український вказівно-спонукальний маркер, що зберігає раптовість і привертає увагу читача.
- source_word: σεισμὸς μέγας
  choice: велика буря
  rationale: Хоча σεισμός часто означає «землетрус» або «струс», морський контекст із човном і хвилями вказує на сильне збурення моря; «велика буря» природно передає цей зміст.
- source_word: ἐγένετο
  choice: знялася
  rationale: У сполученні з «буря» це природне українське позначення початку стихійного явища.
- source_word: ἐν τῇ θαλάσσῃ
  choice: на морі
  rationale: Зберігає вихідний термін «море» й природно позначає місце події українською.
- source_word: ὥστε
  choice: так що
  rationale: Чітко вводить наслідок сили бурі.
- source_word: τὸ πλοῖον
  choice: човен
  rationale: Відповідає євангельському контексту плавання Галілейським морем краще, ніж «корабель».
- source_word: καλύπτεσθαι
  choice: накривало
  rationale: 'Передає тривалу пасивну за змістом дію: хвилі раз у раз покривали човен; українська активна конструкція звучить природніше.'
- source_word: ὑπὸ τῶν κυμάτων
  choice: хвилями
  rationale: Орудний відмінок природно передає засіб або чинник у грецькій пасивній конструкції.
- source_word: αὐτὸς δὲ
  choice: а Він
  rationale: Сполучник «а» виразно протиставляє Його сон небезпеці навколо, не додаючи надмірного наголосу.
- source_word: ἐκάθευδεν
  choice: спав
  rationale: Український недоконаний вид передає тривалу дію грецького імперфекта.
theological_decisions:
- issue: Характер події, названої σεισμός
  choice: Контекстуально перекладено як «буря».
  alternative: «землетрус», «сильний струс» або «велике збурення»
  rationale: Це лексико-контекстуальне, а не доктринальне рішення. Морська обстановка, човен і хвилі вказують на бурхливе збурення моря; буквальне «землетрус» могло б створити хибне уявлення про подію на суходолі.
translation_notes:
  register: Сучасна літературна українська з гідним біблійним звучанням. «І ось» зберігає живий наративний перехід; «накривало хвилями» передає тривалість і небезпеку без неприродної буквальності. Займенник «Він» написано з великої літери відповідно до поширеної української біблійної практики щодо Ісуса.
