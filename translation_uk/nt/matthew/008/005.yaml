  text: When he entered Capernaum[a], a centurion came to him, pleading with him[b],
translation:
  language: uk
  text: 'Коли ж він увійшов до Капернаума, до нього підійшов[a] сотник і благав його[b]:'
  philosophy: optimal-equivalence
