    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσελθόντος δὲ αὐτοῦ
  choice: Коли ж він увійшов
  rationale: Грецький родовий абсолют з аористовим дієприкметником природно передано часовим підрядним реченням. «Коли» не уточнює надмірно, чи події були цілком послідовними, чи частково одночасними; «ж» передає легкий оповідний перехід δέ.
- source_word: εἰς Καφαρναοὺμ
  choice: до Капернаума
  rationale: У сполученні з «увійшов» прийменник «до» природно передає рух усередину міста; назву подано за усталеною українською біблійною формою.
- source_word: προσῆλθεν αὐτῷ
  choice: до нього підійшов
  rationale: προσέρχομαι тут означає наблизитися або прийти до когось. «Підійшов» точно й природно відтворює дію в оповіді.
- source_word: ἑκατόνταρχος
  choice: сотник
  rationale: «Сотник» — усталений і стислий український відповідник назви військового командира ἑκατόνταρχος; він зберігає конкретність звання без пояснювального розширення «римський офіцер».
- source_word: παρακαλῶν αὐτὸν
  choice: і почав благати його
  rationale: У цьому контексті παρακαλέω вводить наполегливе прохання, зміст якого подано в наступному вірші. Сурядна конструкція природна українською, а «почав» відтворює супровідну дію дієприкметника, не змінюючи змісту прохання.
