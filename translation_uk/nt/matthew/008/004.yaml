reference: Matthew 8:4
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ὅρα μηδενὶ εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ, καὶ προσένεγκον τὸ δῶρον ὃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/004.yaml
  text: And Jesus said to him[a], “See that you tell no one, but go, show yourself to the priest, and offer the gift that Moses commanded[b], as a testimony to them.”
translation:
  language: uk
  text: 'Ісус сказав йому: «Гляди, нікому не кажи, а піди, покажи себе священникові й принеси дар, який звелів Мойсей[a], як свідчення для них[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ця настанова відповідає приписаній Мойсеєвим Законом процедурі для людини, очищеної від прокази; див. Левит 14.
    reason: cross_reference
  - marker: b
    text: 'Вислів можна також передати: «їм на свідчення». Він може означати доказ, представлений священникам; дехто розуміє його як непряме свідчення проти тих, хто не повірить.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅρα
  choice: Гляди
  rationale: Імператив ужито як застереження або наполегливу настанову; «Гляди» природно передає цю силу в сучасній українській мові.
- source_word: μηδενὶ εἴπῃς
  choice: нікому не кажи
  rationale: Заперечна конструкція виражає заборону; переклад стислий і зберігає особовий адресат дії.
- source_word: ὕπαγε
  choice: піди
  rationale: Простий наказ рухатися; «піди» природно пов’язує наказ із наступною дією.
- source_word: σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: покажи себе священникові
  rationale: Прямо відтворює зворотну конструкцію та зберігає відсилання до священницького огляду очищеної людини.
- source_word: ἱερεῖ
  choice: священникові
  rationale: Означений артикль указує на належного священника в установленій Мойсеєвим Законом процедурі; український контекст не потребує окремого означального слова.
- source_word: προσένεγκον
  choice: принеси
  rationale: Дієслово може означати принесення або представлення жертви. У сполученні з «дар» культове значення зрозуміле без додавання конкретнішого виду жертви.
- source_word: τὸ δῶρον
  choice: дар
  rationale: «Дар» є прямим відповідником і може позначати культове приношення; не звужує значення до конкретного різновиду жертви.
- source_word: ὃ προσέταξεν Μωϋσῆς
  choice: який звелів Мойсей
  rationale: Передає владний характер προστάσσω без додаткового тлумачення.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: як свідчення для них
  rationale: Зберігає значення мети або результату та не визначає, чи це свідчення на їхню користь, чи проти них.
- source_word: αὐτοῖς
  choice: для них
  rationale: Займенник не має явно названого референта; переклад не уточнює, чи йдеться про священників, народ або провідників.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Ісус сказав йому
  rationale: Грецький історичний теперішній час природно передано українським минулим часом у розповідному контексті.
theological_decisions:
- issue: Референт і сила вислову εἰς μαρτύριον αὐτοῖς
  choice: «як свідчення для них» — без уточнення адресатів і характеру свідчення
  alternative: «як доказ священникам» або «як свідчення проти них»
  rationale: Грецький займенник αὐτοῖς прямо не називає адресатів, а μαρτύριον може означати свідчення або доказ без обов’язково позитивного чи обвинувального відтінку. Неоднозначність оригіналу збережено.
translation_notes:
  register: Сучасна стандартна українська мова; виклад стислий, природний і гідний. «Гляди» зберігає урочисто-настановчий тон без архаїзації, а «священникові» відповідає чинному правопису.
