    reason: textual_variant
  - marker: b
    text: 'Або: «дуже небезпечні».'
    reason: lexical_alternative
  revision_rationale: The revision changes only the directional expression for χώρα and explicitly supplies the masculine referent already present in the Greek. It retains the draft’s natural result clause, terminology, capitalization/register, and both correctly placed footnote anchors.
