id: MAT.8.28
reference: Matthew 8:28
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ πέραν εἰς τὴν χώραν τῶν ⸀Γαδαρηνῶν ὑπήντησαν αὐτῷ δύο δαιμονιζόμενοι ἐκ τῶν μνημείων ἐξερχόμενοι, χαλεποὶ λίαν ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν διὰ τῆς ὁδοῦ ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/028.yaml
  text: And when he came to the other side[a], into the region of the Gadarenes, two demon-possessed men met him, coming out of the tombs[c][b], so extremely fierce that no one was able to pass along that road.
translation:
  language: uk
  text: Коли Він прибув на той бік, в край гадаринців[a], Йому назустріч із гробниць вийшли двоє чоловіків, одержимих демонами. Вони були такі люті[b], що ніхто не міг пройти тією дорогою.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'У деяких рукописах: «гергесинців» або «герасинців» замість «гадаринців».'
    reason: textual_variant
  - marker: b
    text: 'Або: «дуже небезпечні».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: Коли Він прибув
  rationale: Родовий абсолют природно передано підрядним реченням часу; «прибув» доречно виражає завершення переправи.
- source_word: τὸ πέραν
  choice: на той бік
  rationale: У контексті йдеться про протилежний бік водойми; це природний український відповідник.
- source_word: χώραν τῶν Γαδαρηνῶν
  choice: до краю гадаринців
  rationale: χώρα означає край, область або територію; «край» є стислим і природним, а назву мешканців передано згідно з читанням SBLGNT.
- source_word: ὑπήντησαν αὐτῷ
  choice: Йому назустріч … вийшли
  rationale: Конструкція природно передає зустріч і водночас узгоджується з наступним дієприкметником ἐξερχόμενοι.
- source_word: δύο δαιμονιζόμενοι
  choice: двоє одержимих демонами
  rationale: Передає стан під владою демонів зрозумілою сучасною українською, не вдаючись до незвичного технічного терміна.
- source_word: ἐκ τῶν μνημείων ἐξερχόμενοι
  choice: із гробниць вийшли
  rationale: μνημεῖον у цьому контексті позначає місце поховання; «гробниці» точніше й природніше за буквальне «пам’ятники».
- source_word: χαλεποὶ λίαν
  choice: такі люті
  rationale: χαλεπός тут описує небезпечну, грізну поведінку, а λίαν підсилює ознаку; конструкція «такі … що» природно поєднується з наслідковим ὥστε.
- source_word: ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν
  choice: що ніхто не міг пройти
  rationale: ὥστε виражає наслідок, а ἰσχύω в цьому контексті — спроможність; переклад не звужує значення до фізичної сили.
- source_word: διὰ τῆς ὁδοῦ ἐκείνης
  choice: тією дорогою
  rationale: Орудний відмінок природно передає маршрут руху, виражений διά з родовим.
theological_decisions:
- issue: Опис демонічного поневолення
  choice: одержимих демонами
  alternative: тих, хто був під владою демонів
  rationale: Обраний варіант ясно передає реальну демонічну дію, яку позначає δαιμονίζομαι, не додаючи докладнішої теорії про характер такого стану.
- issue: Текстовий варіант назви місцевості
  choice: гадаринців
  alternative: гергесинців або герасинців
  rationale: Основний текст наслідує читання Γαδαρηνῶν у SBLGNT, а значущі рукописні варіанти збережено в примітці.
- issue: Семантичний обсяг χαλεποί
  choice: люті
  alternative: небезпечні
  rationale: «Люті» зберігає характеристику вдачі та загрози, не конкретизуючи її як неодмінно фізичне насильство; можливий контекстуальний відтінок подано в примітці.
translation_notes:
  register: Сучасна стандартна українська; виклад природний, стислий і гідний. Перебудова порядку слів усуває перевантаження дієприкметниковими конструкціями, не змінюючи послідовності та змістових зв’язків грецького тексту.
