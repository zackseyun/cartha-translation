    issue: Неприродний початок «Бо і я».
    rationale: Українське «Бо і» в цій позиції звучить кальковано. «Адже й я» природно передає καὶ γάρ і зберігає його аргументативний зв’язок.
  - severity: low
    issue: Важка конструкція «маю підлеглих мені воїнів».
    rationale: Вона передає зміст, але «воїнів у своєму підпорядкуванні» нормативніше й плавніше в сучасній українській.
  - severity: low
    issue: «А» перед останнім членом переліку послаблює формальний паралелізм.
    rationale: У грецькому тексті перед τρίім прикладом стоїть καί, як і в попередніх переходах; «і» краще відтворює структуру без неприродності.
