revisions:
- from: 'Бо і я — людина під владою, і маю підлеглих мені воїнів. Кажу одному: «Іди», — і він іде; іншому: «Прийди», — і він приходить; а своєму слузі[a]: «Зроби це», — і він робить.'
  to: 'Адже й я — людина під владою і маю воїнів у своєму підпорядкуванні. Кажу одному: «Іди», — і він іде; іншому: «Прийди», — і він приходить; і своєму слузі[a]: «Зроби це», — і він робить.'
  rationale: Виправлено лише стилістично неприродні або менш точні щодо синтаксичного паралелізму місця. Збережено пояснювальний характер початку, неуточненість поняття «влада», військову ієрархію, наказовий стиль та примітку до δοῦλος.
  reviewer_model: gpt-5.6-terra
