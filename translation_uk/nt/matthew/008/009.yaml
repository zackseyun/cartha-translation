source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ⸀ἐξουσίαν, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/009.yaml
  text: For I also am a man under authority[a], having soldiers under me. And I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.
translation:
  language: uk
  text: 'Адже й я — людина під владою і маю воїнів у своєму підпорядкуванні. Кажу одному: «Іди», — і він іде; іншому: «Прийди», — і він приходить; і своєму слузі[a]: «Зроби це», — і він робить.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «раб» (грецьке δοῦλος).
    reason: 'Лексична альтернатива: δοῦλος може означати як слугу, так і раба; примітка зберігає можливе позначення правового й соціального статусу.'
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Бо і
  rationale: «Бо» зберігає пояснювальну силу γάρ, а «і» передає καί та підкреслює аналогію між становищем сотника і владою Ісуса.
- source_word: ἄνθρωπός εἰμι ὑπὸ ἐξουσίαν
  choice: я — людина під владою
  rationale: Формулювання прямо передає людський статус сотника та його підпорядкованість у ланцюгу командування, не уточнюючи того, чия саме це влада.
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: маю підлеглих мені воїнів
  rationale: Передає одночасно наявність воїнів і їхнє підпорядкування сотникові; «воїни» є природним сучасним відповідником στρατιώτας.
- source_word: λέγω τούτῳ … καὶ ἄλλῳ
  choice: кажу одному … іншому
  rationale: Природна українська парна конструкція зберігає розподільний характер прикладу, хоча буквально τούτῳ означає «цьому».
- source_word: Πορεύθητι / Ἔρχου / Ποίησον τοῦτο
  choice: Іди / Прийди / Зроби це
  rationale: Короткі наказові форми відтворюють безпосередність команд і паралелізм оригіналу.
- source_word: δοῦλος
  choice: слуга
  rationale: У цьому контексті головним є підпорядкування в межах владних відносин; «слуга» звучить природно, а точніший для можливого соціального статусу відповідник «раб» подано в примітці.
theological_decisions:
- issue: Значення δοῦλος у прикладі сотника
  choice: слуга
  alternative: раб
  rationale: Грецьке слово може позначати раба або слугу. Основний текст не робить рабський статус центральним для аргументу, але примітка зберігає соціально-історичну можливість значення «раб».
- issue: Характер влади сотника
  choice: під владою
  alternative: під чиєюсь владою; підвладний
  rationale: Буквальне й природне формулювання зберігає неуточненість оригіналу та військовий образ делегованої влади, не додаючи названого начальника.
translation_notes:
  register: Сучасна нормативна українська мова; стислий, гідний і легко зрозумілий виклад. Тире й пунктуація підкреслюють паралельну будову команд і негайних відповідей.
