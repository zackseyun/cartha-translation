  terminology: «Син Людський» є усталеним і точним відповідником ὁ υἱὸς τοῦ ἀνθρώπου; він зберігає титульний характер та смислову неоднозначність оригіналу. «Нори», «гнізда» й «прихилити голову» доречні в цьому контексті.
