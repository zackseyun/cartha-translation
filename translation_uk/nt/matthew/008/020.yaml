source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Αἱ ἀλώπεκες φωλεοὺς ἔχουσιν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις, ὁ δὲ υἱὸς τοῦ ἀνθρώπου οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/020.yaml
  text: And Jesus says to him[a], “Foxes have dens, and the birds of the sky have nests[d][c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: uk
  text: 'Ісус каже йому: «Лисиці мають нори, і птахи небесні — гнізда[a], а Син Людський не має де прихилити голову».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «місця для ночівлі».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: каже
  rationale: Теперішній час зберігає грецький історичний теперішній і природно звучить в українській оповіді.
- source_word: ἀλώπεκες
  choice: лисиці
  rationale: Прямий і звичний український відповідник множини.
- source_word: φωλεούς
  choice: нори
  rationale: У контексті лисиць «нори» природно позначає їхні сховища й точніше за загальніше «лігва» передає образ місця проживання.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: небесні птахи
  rationale: Природний український біблійний вислів, що зберігає зв’язок із οὐρανός без неприродної конструкції «птахи неба».
- source_word: κατασκηνώσεις
  choice: гнізда
  rationale: У контексті птахів це найприродніший відповідник для місць оселення чи прихистку; буквальніше слово може також означати місця відпочинку або оселення.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Син Людський
  rationale: Усталений український відповідник самоназви Ісуса, який зберігає її біблійний і богословський резонанс та не звужує значення парафразою.
- source_word: οὐκ ἔχει ποῦ
  choice: не має де
  rationale: Точно й природно передає грецьку заперечну конструкцію, не перетворюючи її на важкий буквалізм.
- source_word: τὴν κεφαλὴν κλίνῃ
  choice: прихилити голову
  rationale: Природний і гідний український вислів, що зберігає конкретний образ схиляння голови для спочинку.
theological_decisions:
- issue: Передача самоназви Ісуса ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Син Людський
  alternative: Людський Син; Людина
  rationale: «Син Людський» зберігає форму вислову, усталене біблійне звучання, можливий зв’язок із Даниїла 7 та властиву оригіналові смислову напругу. Парафраза «Людина» надмірно витлумачувала б титул.
translation_notes:
  register: Сучасна стандартна українська мова з гідним біблійним регістром. Синтаксис стислий і природний; історичний теперішній збережено. Тире в другій частині першого зіставлення усуває неприродне повторення дієслова без зміни змісту.
