source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ Ἰησοῦς ἐθαύμασεν καὶ εἶπεν τοῖς ἀκολουθοῦσιν· Ἀμὴν λέγω ὑμῖν, ⸂παρ’ οὐδενὶ τοσαύτην πίστιν ἐν τῷ Ἰσραὴλ⸃ εὗρον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/010.yaml
  text: When Jesus heard this[a], he marveled and said to those following him, “Truly I tell you[b], with no one in Israel have I found such faith.”
translation:
  language: uk
  text: 'Почувши це, Ісус здивувався й сказав тим, хто йшов за ним: «Істинно кажу вам: ні в кого в Ізраїлі я не знайшов такої віри[a]».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «настільки великої віри».'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «я не знайшов в Ізраїлі нікого з такою вірою».'
    reason: syntactical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: Почувши це
  rationale: Аористовий дієприкметник передає обставину, що передує головній дії. Займенник «це» природно відсилає до попередніх слів сотника, хоча в грецькому тексті окремого додатка немає.
- source_word: ἐθαύμασεν
  choice: здивувався
  rationale: Природне сучасне українське слово, яке передає сильне враження або подив Ісуса без зайвих богословських висновків.
- source_word: τοῖς ἀκολουθοῦσιν
  choice: тим, хто йшов за ним
  rationale: Теперішній дієприкметник позначає людей, які супроводжували Ісуса в той момент; переклад не звужує їх до формально визначеного кола учнів.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Істинно кажу вам
  rationale: Збережено урочисту й наголошену формулу Ісуса в природній для біблійного українського стилю формі.
- source_word: παρ’ οὐδενὶ
  choice: ні в кого
  rationale: παρά з давальним тут означає «у випадку когось / у когось»; українське «ні в кого» точно й природно передає заперечну конструкцію.
- source_word: τοσαύτην πίστιν
  choice: такої віри
  rationale: «Такої» передає вказівку на винятковий ступінь віри; можливий виразніший переклад ступеня наведено в примітці.
- source_word: ἐν τῷ Ἰσραήλ
  choice: в Ізраїлі
  rationale: Прямий переклад, який може охоплювати як країну, так і народ Ізраїлю в цьому контексті.
- source_word: εὗρον
  choice: я не знайшов
  rationale: Грецький аорист природно передано українським минулим часом; заперечення граматично пов’язане з «ні в кого».
theological_decisions:
- issue: Передача πίστις
  choice: віра
  alternative: довіра
  rationale: У контексті йдеться про впевненість сотника у владі Ісуса. «Віра» зберігає широкий новозавітний зміст терміна, тоді як «довіра» передала б лише один його відтінок.
- issue: Вислів про пошук віри в Ізраїлі
  choice: ні в кого в Ізраїлі я не знайшов такої віри
  alternative: я не знайшов в Ізраїлі нікого з такою вірою
  rationale: Основний текст ближче зберігає грецький синтаксис і ставить у центр те, чого Ісус не знайшов ні в кого; альтернативна побудова можлива, але трохи сильніше спрямовує вислів на пошук людини.
translation_notes:
  register: Сучасна стандартна українська мова з урочистим, але зрозумілим біблійним звучанням. Уникнуто інституційного відтінку слова «послідовники» та конфесійно маркованих формулювань.
