  source_fidelity: Переклад точно передає аористовий дієприкметник ἀκούσας як обставину («Почувши це»), реакцію ἐθαύμασεν, адресатів τοῖς ἀκολουθοῦσιν, урочисту формулу Ἀμὴν λέγω ὑμῖν і заперечну конструкцію παρ’ οὐδενὶ … ἐν τῷ Ἰσραήλ. «Ні в кого в Ізраїлі я не знайшов такої віри» зберігає зміст і наголос грецького вислову. Минулий час «не знайшов» є прямим і природним відповідником аориста εὗρον.
  naturalness: Текст звучить природно сучасною стандартною українською та водночас зберігає стриманий біблійний урочистий регістр. «Тим, хто йшов за ним» вдало передає людей, які супроводжували Ісуса, не перетворюючи їх на усталену групу «послідовників».
  terminology: «Віра» є належним відповідником πίστις у цьому контексті й не нав’язує звуженого богословського тлумачення. «В Ізраїлі» коректно відтворює ἐν τῷ Ἰσραήλ, що тут охоплює середовище/народ Ізраїлю. Примітка a доречно вказує на ступеневий відтінок τοσαύτην; примітка b подає допустиму синтаксичну перестановку без зміни змісту.
