base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/006.yaml
  text: and saying[a], “Lord, my servant is lying paralyzed at home[b], suffering terribly.”
translation:
  language: uk
  text: 'і каже: «Господи, мій слуга[a] лежить удома паралізований і страшенно мучиться[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «мій хлопчик» чи «моя дитина»; грецьке слово може означати і слугу, і дитину, хоча в контексті розповіді про сотника найкраще пасує «слуга».
    reason: lexical_alternative
  - marker: b
    text: Або «зазнає тяжких мук».
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγων
  choice: і каже
  rationale: Грецький дієприкметник продовжує попередню оповідну конструкцію; теперішня особова форма природно передає цей зв’язок сучасною українською.
- source_word: Κύριε
  choice: Господи
  rationale: Традиційна й природна українська форма звертання до Ісуса зберігає можливість як шанобливого, так і глибшого титульного значення.
- source_word: ὁ παῖς μου
  choice: мій слуга
  rationale: У контексті сотника найімовірніше йдеться про слугу; однак παῖς може також означати хлопчика або дитину, тому неоднозначність зазначено у примітці.
- source_word: βέβληται
  choice: лежить
  rationale: Перфект пасивного стану описує наявний результат — хворий лежить, прикутий недугою; буквальне «покладений» українською було б неприродним і могло б хибно натякати на дію іншої особи.
- source_word: ἐν τῇ οἰκίᾳ
  choice: удома
  rationale: Природний сучасний відповідник місцевого вислову зі значенням перебування у власному домі.
- source_word: παραλυτικός
  choice: паралізований
  rationale: Прикметниковий відповідник точно й зрозуміло описує фізичний стан людини без застарілого субстантивованого означення.
- source_word: δεινῶς βασανιζόμενος
  choice: страшенно мучиться
  rationale: Передає надзвичайну тяжкість страждання живою сучасною мовою, водночас не уточнюючи причину чи вид мук понад сказане в тексті.
theological_decisions:
- issue: Сила звертання Κύριε до Ісуса
  choice: Господи
  alternative: Пане
  rationale: «Господи» не зводить звертання лише до ввічливої форми, але й саме по собі не змушує розуміти слова сотника як повне богословське сповідання; так зберігається відкритість грецького вислову.
translation_notes:
  register: Сучасна стандартна українська, природна й гідна оповідна мова. Порядок слів трохи згладжено для українського звучання; лексичну неоднозначність παῖς та інтенсивність βασανιζόμενος збережено примітками.
