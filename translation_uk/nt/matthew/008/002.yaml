  text: καὶ ἰδοὺ λεπρὸς ⸀προσελθὼν προσεκύνει αὐτῷ λέγων· Κύριε, ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/002.yaml
  text: And behold[a], a leper came and bowed down before him, saying, “Lord, if you are willing, you are able to cleanse me.”
translation:
  language: uk
  text: 'І ось чоловік, хворий на проказу, підійшов, схилився перед Ним[a] і сказав: «Господи, якщо Ти хочеш, то можеш мене очистити».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «поклонився Йому»; грецьке дієслово може означати схилитися на знак глибокої пошани, віддати шану або поклонитися — залежно від контексту.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: ось
  rationale: Зберігає функцію частки, яка привертає увагу й надає розповіді виразності, водночас природно звучить сучасною українською.
- source_word: λεπρὸς
  choice: чоловік, хворий на проказу
  rationale: Субстантивований прикметник означає людину з хворобою шкіри, яку традиційно називають проказою. Особово орієнтоване формулювання точно передає зміст і не ототожнює людину з її недугою.
- source_word: προσελθὼν
  choice: підійшов
  rationale: Дієприкметник позначає наближення до Ісуса; «підійшов» стисло й природно передає цей рух.
- source_word: προσεκύνει
  choice: схилився перед Ним
  rationale: Дієслово може означати тілесний жест глибокої пошани, вшанування або поклоніння. Основний текст передає видиму дію, не звужуючи завчасно її богословського значення.
- source_word: Κύριε
  choice: Господи
  rationale: Клична форма «Господи» зберігає шанобливе звертання до Ісуса та можливу христологічну вагу слова κύριος.
- source_word: ἐὰν θέλῃς
  choice: якщо Ти хочеш
  rationale: Природно передає умову, пов’язану з волею Ісуса, без архаїчного відтінку.
- source_word: δύνασαί
  choice: можеш
  rationale: Передає здатність і силу Ісуса в природній сучасній українській формі.
- source_word: καθαρίσαι
  choice: очистити мене
  rationale: Зберігає фізичні та ритуальні конотації очищення від прокази, яких не повністю передає загальне «зцілити».
theological_decisions:
- issue: Значення προσκυνέω щодо Ісуса
  choice: схилився перед Ним
  alternative: поклонився Йому
  rationale: У цьому контексті слово безсумнівно виражає глибоку пошану через тілесний жест, але може також позначати поклоніння. Основний варіант зберігає семантичну відкритість, а примітка вказує на сильніше богословське прочитання.
translation_notes:
  register: Сучасна нормативна українська мова; виклад простий, гідний і придатний для публічного читання. Збережено вираз «І ось» як засіб привернення уваги. Займенники щодо Ісуса подано з великої літери відповідно до поширеної української біблійної традиції.
