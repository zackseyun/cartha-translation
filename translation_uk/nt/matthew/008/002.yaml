  verdict: approve
  source_fidelity: 'Текст точно передає всі основні компоненти грецького оригіналу: καὶ ἰδού — «І ось», λεπρός — особово орієнтованим «чоловік, хворий на проказу», προσελθών — «підійшов», προσκυνέω — «схилився перед Ним», а також прохання про можливе очищення. «Якщо Ти хочеш, то можеш мене очистити» вірно зберігає умовність щодо волі Ісуса та твердження про Його спроможність.'
  naturalness: Формулювання природне для сучасної літературної української й водночас має належний біблійно-урочистий регістр. «І ось» доречно відтворює привертальну силу ἰδού. Порядок дієслів «підійшов, схилився ... і сказав» читабельний та ясний.
  terminology: «Проказа» і «очистити» вдало зберігають традиційно-біблійну та ритуально-тілесну семантику καθαρίζω. «Господи» належно передає Κύριε, не звужуючи його значення до суто побутового звертання. «Схилився перед Ним» обґрунтовано не вирішує наперед діапазон προσκυνέω; примітка коректно подає «поклонився Йому» як альтернативу.
