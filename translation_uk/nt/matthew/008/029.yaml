  source_fidelity: 'Текст точно передає всі основні елементи грецького оригіналу: καὶ ἰδού («І ось»), гучний крик, ідіому Τί ἡμῖν καὶ σοί («Що нам до тебе»), кличне звертання «Сину Божий», локативне «сюди», часовий вислів πρὸ καιροῦ та мету βασανίσαι ἡμᾶς («щоб мучити нас»). «Перед визначеним часом» є виправданим передаванням можливого відтінку καιρός як належного/встановленого часу, без надмірної догматизації.'
  naturalness: Переклад звучить природно сучасною літературною українською. «Що нам до тебе?» — усталена, зрозуміла українська ідіома, яка належно відтворює відчужувально-конфронтаційний характер грецького вислову. Опущення формального відповідника λέγοντες є стилістично природним перед прямою мовою.
