id: MAT.8.29
reference: Matthew 8:29
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἔκραξαν λέγοντες· Τί ἡμῖν καὶ ⸀σοί, υἱὲ τοῦ θεοῦ; ἦλθες ὧδε πρὸ καιροῦ βασανίσαι ἡμᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/029.yaml
  text: And behold[a], they cried out, saying, “What have we to do with you[b], Son of God? Have you come here before the appointed time to torment us?”
translation:
  language: uk
  text: 'І ось вони закричали: «Що нам до тебе[a], Сину Божий? Ти прийшов сюди перед визначеним часом[b], щоб мучити нас?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальніше: «Що нам і тобі?» Це ідіоматичний вислів відчуження або протесту: «Яке нам діло одне до одного?»'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «перед часом». Грецьке слово може означати належний чи наперед визначений час.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: І ось
  rationale: Збережено яскравий дискурсивний маркер, який привертає увагу до раптової події; цей вислів природний у сучасній українській.
- source_word: ἔκραξαν λέγοντες
  choice: вони закричали
  rationale: Дієслово κράζω передає гучний, різкий крик. Окреме «кажучи» не відтворено, бо в українській пряма мова після двокрапки природно передає функцію λέγοντες.
- source_word: Τί ἡμῖν καὶ σοί
  choice: Що нам до тебе
  rationale: Природний український відповідник семітсько-грецького ідіоматичного вислову відчуження або протесту; буквальнішу форму подано в примітці.
- source_word: υἱὲ τοῦ θεοῦ
  choice: Сину Божий
  rationale: Пряме відтворення христологічного титулу у формі кличного відмінка.
- source_word: ἦλθες ὧδε
  choice: Ти прийшов сюди
  rationale: Аорист передано минулим часом у запитанні про прихід із теперішньою метою; ὧδε прямо означає «сюди».
- source_word: πρὸ καιροῦ
  choice: перед визначеним часом
  rationale: καιρός може позначати належний або призначений момент; «визначений час» зберігає цей відтінок, не уточнюючи, ким і як його визначено.
- source_word: βασανίσαι
  choice: щоб мучити
  rationale: Передає мету приходу та сильне страждання, пов’язане в контексті із судом, без звуження значення лише до фізичних катувань.
- source_word: ἡμᾶς
  choice: нас
  rationale: Пряме відтворення знахідного відмінка множини, що стосується тих, хто промовляє.
theological_decisions:
- issue: Визнання особи Ісуса демонами
  choice: Сину Божий
  alternative: Сину Бога
  rationale: Усталений і точний український відповідник титулу υἱὲ τοῦ θεοῦ зберігає його пряму христологічну силу без послаблення чи розширення.
- issue: Есхатологічний відтінок καιρός
  choice: перед визначеним часом
  alternative: перед часом
  rationale: Основний варіант передає можливий зміст наперед установленого моменту суду, але примітка зберігає формально ширше прочитання грецького вислову.
translation_notes:
  register: Сучасна літературна українська з гідним біблійним звучанням. Ужито природну українську ідіому «Що нам до тебе», а буквальну структуру збережено в примітці. Займенник «тебе» написано з малої літери відповідно до сучасної загальної практики й без внесення конфесійної орфографічної особливості.
