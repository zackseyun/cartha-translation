  source_fidelity: «Коли Ісус увійшов у човен, за ним пішли його учні» точно передає часову обставину аористового дієприкметника ἐμβάντι, рух εἰς πλοῖον і головну дію ἠκολούθησαν. Явне «Ісус» коректно розкриває референта займенника з найближчого контексту й не змінює змісту.
  naturalness: Фраза природна для сучасної стандартної української. Порядок слів «за ним пішли його учні» плавний для біблійної оповіді; «човен» є звичним і доречним відповідником.
  terminology: «Учні» належно передає μαθηταί, а «за ним пішли» зберігає як безпосередній просторовий зміст ἀκολουθέω, так і можливий учнівський відтінок без богословського розширення. Примітка коректно пояснює неозначеність грецького πλοῖον і не нав’язує один варіант.
