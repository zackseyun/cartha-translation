  text: And when he got into the boat[b][a], his disciples followed him.
translation:
  language: uk
  text: Коли Ісус увійшов у човен[a], за ним пішли його учні.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «в один човен». У грецькому тексті слово «човен» ужите без артикля; за контекстом може йтися і про конкретний човен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβάντι αὐτῷ
  choice: Коли Ісус увійшов
  rationale: Аористовий дієприкметник передає обставину часу, що передує головній дії. Підрядне речення з «коли» природне для сучасної української; ім’я «Ісус» прояснює референта займенника з контексту.
- source_word: πλοῖον
  choice: човен
  rationale: У контексті Галілейського моря природним сучасним відповідником є «човен», а не «корабель». Грецький іменник тут без артикля, тому збережено неозначену українську форму, яка за контекстом може стосуватися конкретного човна.
- source_word: ἠκολούθησαν αὐτῷ
  choice: за ним пішли
  rationale: Вислів природно описує фізичне слідування за Ісусом і водночас не усуває властивого дієслову ἀκολουθέω учнівського відтінку.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: його учні
  rationale: «Учні» — усталений і зрозумілий український відповідник μαθηταί, що зберігає як навчальні, так і особисті взаємини з Ісусом.
theological_decisions:
- issue: Можливий учнівський відтінок ἀκολουθέω
  choice: за ним пішли
  alternative: увійшли слідом за ним / супроводжували його
  rationale: Основний зміст тут просторовий, але формулювання «за ним пішли» також природно зберігає ширший мотив слідування за Ісусом, не перетворюючи оповідну дію на явне богословське твердження.
translation_notes:
  register: Сучасна стандартна українська, природний і гідний оповідний стиль. Порядок слів «за ним пішли» зберігає акцент на слідуванні та звучить природніше, ніж буквальне «слідували йому».
