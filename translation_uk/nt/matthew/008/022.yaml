  text: ὁ δὲ Ἰησοῦς ⸀λέγει αὐτῷ· Ἀκολούθει μοι, καὶ ἄφες τοὺς νεκροὺς θάψαι τοὺς ἑαυτῶν νεκρούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/022.yaml
  text: But Jesus says to him[a], “Follow me, and leave the dead to bury their own dead.”
translation:
  language: uk
  text: 'А Ісус каже йому: «Іди за мною й залиш мертвим ховати своїх мертвих».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Перше «мертвим» часто розуміють переносно: ті, хто духовно не відгукується, можуть ховати фізично померлих.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: А
  rationale: Передає м’який контраст із попереднім проханням і природно поєднує репліки в українській розповіді.
- source_word: λέγει
  choice: каже
  rationale: Зберігає історичний теперішній час грецького тексту та його оповідну жвавість.
- source_word: Ἀκολούθει μοι
  choice: Іди за Мною
  rationale: Природний український заклик, який передає як буквальне слідування, так і учнівство.
- source_word: ἄφες
  choice: залиш
  rationale: Передає наказ відмовитися від цієї турботи чи відповідальності, не зводячи вислів лише до дозволу.
- source_word: νεκρούς ... νεκρούς
  choice: мертвим ... мерців
  rationale: Зберігає повтор того самого грецького слова й гру його можливих переносного та буквального значень; відмінкові форми відповідають природній українській мові.
- source_word: θάψαι
  choice: ховати
  rationale: Природно передає інфінітив мети/дії після ἄφες; у цьому контексті «ховати» є ясним сучасним відповідником поховання.
- source_word: τοὺς ἑαυτῶν νεκρούς
  choice: своїх мерців
  rationale: Зворотний займенник «своїх» точно передає ἑαυτῶν і його наголос на належності.
theological_decisions:
- issue: Значення слова «мертві» в Ісусовому вислові
  choice: В основному тексті збережено формулювання «мертвим ... своїх мерців» без пояснювального додавання «духовно».
  alternative: Перше вживання прямо перекласти як «духовно мертвим», а друге — як фізично померлих.
  rationale: Грецький текст уживає те саме слово двічі й залишає навмисну смислову напругу. Ймовірне переносне значення першого вживання пояснено в примітці, а не внесено до перекладу.
translation_notes:
  register: Сучасна стандартна українська; стислий, гідний і природний вислів. Історичний теперішній час та провокативний повтор оригіналу збережено.
