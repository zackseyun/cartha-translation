  text: And the men marveled[a], saying, “What sort of man is this, that even the winds and the sea obey him?”
translation:
  language: uk
  text: 'А чоловіки здивувалися й казали: «Що це за чоловік[a], що навіть вітри й море слухаються його?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Грецький вислів запитує, що це за особа, тобто про її рід або якості.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄνθρωποι
  choice: А люди
  rationale: «Люди» природно передає ἄνθρωποι в українській оповіді; контекст указує на тих, хто був у човні, без потреби неприродно наголошувати на їхній статі словом «чоловіки». Частка δέ передана оповідним «а».
- source_word: ἐθαύμασαν λέγοντες
  choice: дивувалися й казали
  rationale: Таке формулювання природно передає подив і пов’язану з ним мову; сурядна конструкція українською звучить легше, ніж буквальне «дивувалися, кажучи».
- source_word: Ποταπός ἐστιν οὗτος
  choice: Що це за чоловік
  rationale: Зворот передає запитання про те, якою є ця особа, а не просто про її ім’я чи тотожність. «Чоловік» доречно конкретизує чоловічу особу, маючи на увазі Ісуса, хоча в грецькому вислові іменника немає.
- source_word: ὅτι
  choice: що
  rationale: «Що» природно вводить підставу для здивованого запитання й зберігає зв’язок між особою Ісуса та послухом стихій.
- source_word: καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα
  choice: навіть вітри й море
  rationale: «Навіть» передає підсилювальну силу першого καί, а сполучник «й» природно поєднує обидві природні стихії.
- source_word: αὐτῷ ὑπακούουσιν
  choice: слухаються його
  rationale: Українське «слухатися когось» природно виражає послух особистій владі та добре пасує до персоніфікованих вітрів і моря.
theological_decisions:
- issue: Христологічна сила запитання учнів
  choice: Зберегти здивоване запитання без доданого богословського пояснення, водночас ясно показавши, що стихії слухаються Ісуса.
  alternative: Розкрити висновок прямо, наприклад додавши, ким саме має бути Ісус, якщо Йому кориться творіння.
  rationale: Грецький текст створює христологічну напругу через запитання й надзвичайну владу Ісуса над природою, але сам у цьому вірші не формулює остаточної відповіді.
translation_notes:
  register: Сучасна, природна й водночас гідна українська оповідна мова. Займенник «його» подано з малої літери, відповідно до звичайної сучасної орфографії та без внесення відсутнього в грецькому тексті графічного богословського маркування.
