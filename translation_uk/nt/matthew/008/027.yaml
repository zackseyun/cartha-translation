  source_fidelity: 'Потрібне уточнення. Οἱ δὲ ἄνθρωποι в цьому контексті стосується чоловіків у човні; «люди» може ширше означати «народ/люди взагалі» й послаблює цю конкретність. Аорист ἐθαύμασαν природніше передати доконаним «здивувалися», ніж недоконаним «дивувалися». Інші ключові відповідники точно передають грецький текст: Ποταπός — запитання про характер/якість особи, а ὑπακούουσιν — послух Ісусові.'
  naturalness: «А чоловіки здивувалися й казали» є природною сучасною оповідною конструкцією. «Що це за чоловік» добре відтворює здивоване запитання; «слухаються його» — нормативний і природний відповідник.
  terminology: Не слід уживати великої літери в займеннику лише як богословського маркера. У примітці «Який же Він?» радше питає про тотожність або загальну характеристику й недостатньо виразно передає значення ποταπός; її варто замінити поясненням без такого хибного альтернативного перекладу.
