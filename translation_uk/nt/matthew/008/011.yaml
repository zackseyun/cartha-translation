id: MAT.8.11
reference: Matthew 8:11
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι πολλοὶ ἀπὸ ἀνατολῶν καὶ δυσμῶν ἥξουσιν καὶ ἀνακλιθήσονται μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/011.yaml
  text: But I tell you that many will come from east and west and will recline at table with Abraham and Isaac and Jacob in the kingdom of heaven[a][b].
translation:
  language: uk
  text: Кажу ж вам, що багато хто прийде зі сходу й заходу та сяде за столом з Авраамом, Ісааком і Яковом у Царстві Небесному[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ляже до столу»; за давнім звичаєм учасники бенкету напівлежали біля столу.'
    reason: cultural_note
  - marker: b
    text: Вислів «зі сходу й заходу» вказує на людей із далеких країв і, ймовірно, охоплює також тих, хто не належить до Ізраїлю.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Кажу ж вам
  rationale: Передає λέγω як теперішнє «кажу», а δέ — природною українською часткою «ж», що позначає легкий контраст або перехід без надмірного посилення.
- source_word: πολλοὶ
  choice: багато хто
  rationale: Субстантивований прикметник природно передається українським «багато хто» без додавання конкретної групи людей.
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: зі сходу й заходу
  rationale: Множинні форми в грецькій мають ідіоматичне значення напрямків або країв; український вислів зберігає широкий географічний образ.
- source_word: ἥξουσιν
  choice: прийде
  rationale: Дієслово означає «прийти, прибути»; форма однини узгоджується з нормативним українським займенниковим сполученням «багато хто».
- source_word: ἀνακλιθήσονται
  choice: сяде за столом
  rationale: Грецьке дієслово буквально описує напівлежаче положення учасників давньої трапези. Функціональний український відповідник природно передає участь у бенкеті, а примітка зберігає культурну деталь.
- source_word: μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ
  choice: з Авраамом, Ісааком і Яковом
  rationale: μετά з родовим відмінком виражає спільність; тут — спільну участь у трапезі. Імена подано в усталених українських біблійних формах.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: у Царстві Небесному
  rationale: Природний і усталений український відповідник характерного для Матвія вислову; він не відтворює механічно грецьку множину «небес».
theological_decisions:
- issue: Образ бенкету й есхатологічна спільність
  choice: Зберегти образ спільної трапези у вислові «сяде за столом» і пояснити буквальний культурний образ у примітці.
  alternative: «ляже до столу» або просто «буде разом»
  rationale: Йдеться не лише про присутність, а про участь у бенкетній спільності. Буквальне «ляже» в сучасній українській може викликати хибне враження, тоді як «сяде за столом» природно передає функцію образу.
- issue: Кого охоплює вислів «багато хто зі сходу й заходу»
  choice: Залишити географічне формулювання без прямого додавання «язичники».
  alternative: «багато язичників прийде зі сходу й заходу»
  rationale: Контекст може вказувати на людей поза Ізраїлем, однак грецький текст прямо їх не називає. Переклад зберігає імплікацію, не перетворюючи її на явне твердження.
translation_notes:
  register: Сучасна, зрозуміла й урочиста українська. «Сяде за столом» уникає неприродного буквального «ляже», але зберігає бенкетний зміст; культурну форму пояснено в примітці. Усі смислові припущення, яких немає прямо в грецькому тексті, залишено поза основним текстом.
