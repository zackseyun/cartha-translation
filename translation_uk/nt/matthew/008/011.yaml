  source_fidelity: Переклад точно передає вислів λέγω δὲ ὑμῖν як «Кажу ж вам», майбутній прихід «багато хто» зі сходу й заходу, спільну трапезу з Авраамом, Ісааком та Яковом і місце дії — Царство Небесне. Однина в «багато хто прийде ... сяде» нормативно узгоджується з українським займенниковим сполученням і не змінює змісту грецької множини.
  naturalness: Текст звучить природно в сучасній стандартній українській, з належною біблійною урочистістю. «Сяде за столом» зрозуміло передає участь у трапезі; примітка доречно уточнює історичний образ напівлежачого бенкетування.
  terminology: «Царство Небесне» є усталеним і природним українським відповідником ματвієвого вислову ἡ βασιλεία τῶν οὐρανῶν. Форми імен «Авраамом, Ісааком і Яковом» нормативні; «Яковом» є орудним відмінком від «Яків». Примітки мають коректні прив’язки [a][b] і не нав’язують доктринального висновку.
