  text: καὶ εἶπεν αὐτοῖς· Ὑπάγετε. οἱ δὲ ἐξελθόντες ἀπῆλθον εἰς ⸂τοὺς χοίρους⸃· καὶ ἰδοὺ ὥρμησεν πᾶσα ἡ ⸀ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν θάλασσαν, καὶ ἀπέθανον ἐν τοῖς ὕδασιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/032.yaml
  text: And he said to them[a], “Go.” Then they came out and went into the pigs; and behold[c][b], the whole herd rushed down the steep bank into the sea and died in the waters.
translation:
  language: uk
  text: 'І Він сказав їм: «Ідіть». Вони ж, вийшовши, увійшли у свиней. І ось усе стадо кинулося вниз стрімким схилом[a] у море й загинуло у водах[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «вниз урвищем». Грецьке слово може означати стрімкий схил, берег або урвище.'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «потонуло у водах». Буквально грецький текст каже: «померло у водах».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὑπάγετε
  choice: Ідіть
  rationale: Стислий наказ природно звучить сучасною українською й зберігає лаконічність грецького імператива.
- source_word: ἐξελθόντες
  choice: вийшовши
  rationale: Дієприслівник точно передає попередню щодо головної дії обставину виходу демонів.
- source_word: ἀπῆλθον εἰς τοὺς χοίρους
  choice: увійшли у свиней
  rationale: У контексті йдеться про переміщення демонів усередину тварин; «увійшли» передає це природніше українською, не відтворюючи надмірно буквально префіксальний відтінок ἀπέρχομαι.
- source_word: χοίρους
  choice: свиней
  rationale: Звичайний сучасний український відповідник без архаїчного забарвлення.
- source_word: ἰδοὺ
  choice: І ось
  rationale: Зберігає привернення уваги та оповідну виразність грецького маркера.
- source_word: πᾶσα ἡ ἀγέλη
  choice: усе стадо
  rationale: Природно й точно передає повноту, виражену πᾶσα.
- source_word: ὥρμησεν
  choice: кинулося
  rationale: Передає раптовий і стрімкий рух стада; узгодження в однині відповідає збірному іменнику «стадо».
- source_word: κατὰ τοῦ κρημνοῦ
  choice: зі стрімкого берега
  rationale: κρημνός може означати стрімкий схил, берег або урвище; це формулювання природне в контексті руху вниз до моря та не нав'язує образ цілком прямовисної скелі.
- source_word: θάλασσαν
  choice: море
  rationale: Безпосередньо передає θάλασσα й зберігає біблійне найменування водойми без географічного уточнення «озеро».
- source_word: ἀπέθανον ἐν τοῖς ὕδασιν
  choice: загинуло у воді
  rationale: Зберігає буквальний зміст «померло у водах», але природно звучить щодо тварин українською; не додає прямо не висловленого способу смерті «потонуло».
theological_decisions:
- issue: Ступінь конкретизації смерті стада
  choice: «загинуло у воді»
  alternative: «потонуло у воді»
  rationale: Контекст виразно передбачає утоплення, однак грецький текст буквально повідомляє, що стадо померло у водах. Основний текст не конкретизує причину понад сказане.
translation_notes:
  register: Сучасна нормативна українська мова з гідним оповідним тоном. Синтаксис зберігає послідовність і виразність оригіналу, але уникає неприродної кальки. Займенник «Він» подано з великої літери відповідно до поширеної української біблійної видавничої практики.
