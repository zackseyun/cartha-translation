  text: οἱ δὲ δαίμονες παρεκάλουν αὐτὸν λέγοντες· Εἰ ἐκβάλλεις ἡμᾶς, ⸂ἀπόστειλον ἡμᾶς⸃ εἰς τὴν ἀγέλην τῶν χοίρων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/031.yaml
  text: And the demons kept begging him[a], saying, “If you cast us out[b], send us into the herd of pigs.”
translation:
  language: uk
  text: 'А демони благали його, кажучи: «Якщо виганяєш нас, пошли нас у стадо свиней».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ δαίμονες
  choice: А демони
  rationale: Частка δέ продовжує розповідь із легким відтінком переходу чи протиставлення; «А» природно передає це українською. «Демони» прямо й загальнозрозуміло позначає особистих злих духів у цьому контексті.
- source_word: παρεκάλουν
  choice: благали
  rationale: Українське дієслово недоконаного виду природно передає тривалу або повторювану дію, виражену грецьким імперфектом, без потреби додавати підсилювальні слова.
- source_word: λέγοντες
  choice: кажучи
  rationale: Дієприслівник зберігає грецьку конструкцію, що вводить пряму мову, і звучить природно в оповідному стилі.
- source_word: Εἰ ἐκβάλλεις ἡμᾶς
  choice: Якщо виганяєш нас
  rationale: «Якщо» зберігає умовність вислову, не перетворюючи її на причинне «оскільки». «Виганяєш» точно й природно передає ἐκβάλλεις у контексті вигнання демонів.
- source_word: ἀπόστειλον ἡμᾶς
  choice: пошли нас
  rationale: Наказова форма передає пряме прохання про негайну дію; «пошли» є стислим і контекстуально точним відповідником.
- source_word: εἰς τὴν ἀγέλην τῶν χοίρων
  choice: у стадо свиней
  rationale: Прийменник «у» зберігає напрям усередину стада, виражений εἰς; «стадо свиней» є сучасним і звичним українським висловом.
theological_decisions:
- issue: Позначення злих духів
  choice: демони
  alternative: нечисті духи; демонські духи
  rationale: Грецький текст уживає δαίμονες, тому прямий відповідник «демони» зберігає твердження про особистих надприродних істот і не підмінює його іншим новозавітним означенням.
- issue: Умовний вислів Εἰ ἐκβάλλεις
  choice: Якщо виганяєш нас
  alternative: Оскільки виганяєш нас; якщо виженеш нас
  rationale: Теперішній час і умовна частка збережені без перетворення слів демонів на безумовне твердження чи майбутню завершену дію.
translation_notes:
  register: Сучасна стандартна українська мова; виклад стислий, природний і гідний. Займенник «його» подано з малої літери відповідно до звичайної сучасної орфографії та без внесення додаткового конфесійного маркування.
