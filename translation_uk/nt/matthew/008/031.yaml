  source_fidelity: '«А демони благали його, кажучи: “Якщо виганяєш нас, пошли нас у стадо свиней”» точно передає всі основні елементи грецького тексту: δέ як наративний перехід, δαίμονες, імперфект παρεκάλουν, умовне Εἰ з теперішнім ἐκβάλλεις, наказове ἀπόστειλον і напрямок εἰς до «стада свиней». «Благали» як минула форма недоконаного виду належно відображає тривалість/повторюваність імперфекта без зайвого підсилення.'
  naturalness: Текст звучить природно сучасною стандартною українською. «Кажучи» після «благали його» є нормативним оповідним способом увести пряму мову; «стадо свиней» — звичне й зрозуміле словосполучення. Регістр стриманий і відповідає біблійній оповіді.
  terminology: «Демони» є прямим, сучасним і богословськи ненавантаженим відповідником δαίμονες. «Виганяєш» доречно передає ἐκβάλλεις у контексті вигнання демонів, а «пошли» — ἀπόστειλον. Не додається конфесійного тлумачення і збережено умовність вислову.
