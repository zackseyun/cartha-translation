  text: Ἰδὼν δὲ ὁ Ἰησοῦς ⸂πολλοὺς ὄχλους⸃ περὶ αὐτὸν ἐκέλευσεν ἀπελθεῖν εἰς τὸ πέραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/018.yaml
  text: When Jesus saw many crowds around him, he gave orders to go to the other side.
translation:
  language: uk
  text: Побачивши довкола себе численні натовпи, Ісус наказав переправитися на той бік.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὺς ὄχλους
  choice: багато людей
  rationale: Буквально вислів означає «численні натовпи», але в сучасній українській множина «багато натовпів» тут звучить неприродно; переклад передає велику кількість людей, що оточували Ісуса.
- source_word: ἐκέλευσεν
  choice: наказав
  rationale: Дієслово позначає владне розпорядження, тому «наказав» точніше за слабше «сказав».
- source_word: ἀπελθεῖν εἰς τὸ πέραν
  choice: переправитися на той бік
  rationale: У контексті пересування через озеро природне українське «переправитися» передає рух до протилежного берега, не додаючи до самого вірша назви водойми.
- source_word: δὲ
  choice: не виражено окремим словом
  rationale: Цей сполучник тут має легку оповідну функцію; окреме «а» чи «тоді» могло б надмірно підкреслити протиставлення або часову послідовність.
theological_decisions:
- issue: Неозначений суб’єкт інфінітива ἀπελθεῖν
  choice: 'Збережено без прямого називання адресатів: «наказав переправитися»'
  alternative: «наказав учням переправитися» або «наказав їм переправитися»
  rationale: Грецький текст цього вірша прямо не називає тих, кому дано наказ; додавання «учням» усунуло б формальну неоднозначність за рахунок контексту.
translation_notes:
  register: Сучасна літературна українська, стислий і гідний оповідний стиль. Дієприслівникова конструкція природно відтворює Ἰδών і чітко співвідноситься з підметом «Ісус».
