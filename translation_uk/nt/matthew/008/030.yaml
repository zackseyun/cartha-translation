  yaml_path: translation/nt/matthew/008/030.yaml
  text: A large herd of pigs was feeding some distance away from them[a].
translation:
  language: uk
  text: А далеко від них паслося велике стадо свиней.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «на чималій відстані від них».'
    reason: 'Лексична альтернатива: μακράν ἀπ’ αὐτῶν позначає значну просторову віддаленість; описовий вислів передає той самий зміст.'
lexical_decisions:
- source_word: ἦν δὲ
  choice: А ... паслося
  rationale: δέ передано легким сполучником «А», який природно продовжує розповідь без додавання часового значення. Значення ἦν разом із дієприкметником природно виражене особовою формою «паслося».
- source_word: μακρὰν ἀπ’ αὐτῶν
  choice: від них на чималій відстані
  rationale: Вислів позначає просторову віддаленість. «На чималій відстані» природно передає помітну відстань, не перебільшуючи її точного ступеня.
- source_word: ἀγέλη
  choice: стадо
  rationale: «Стадо» — звичайна сучасна українська назва групи свиней у цьому контексті.
- source_word: χοίρων
  choice: свиней
  rationale: Прямий і загальнозрозумілий сучасний відповідник.
- source_word: πολλῶν
  choice: велике
  rationale: Грецьке «багатьох» природно передається при збірному іменнику як «велике стадо», тобто стадо з великої кількості тварин.
- source_word: βοσκομένη
  choice: паслося
  rationale: Середній стан дієприкметника описує тварин, які годуються на пасовищі; «паслося» стисло й природно передає цю дію, не вводячи невираженого пастуха.
theological_decisions: []
translation_notes:
  register: Сучасна, проста й гідна оповідна українська. Порядок слів зберігає спочатку просторове тло, а потім вводить стадо; узгодження «паслося велике стадо» відповідає українській нормі.
