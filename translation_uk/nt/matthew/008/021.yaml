  text: ἕτερος δὲ τῶν ⸀μαθητῶν εἶπεν αὐτῷ· Κύριε, ἐπίτρεψόν μοι πρῶτον ἀπελθεῖν καὶ θάψαι τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/021.yaml
  text: Then another of the disciples said to him[a], “Lord[b], permit me first to go away and bury my father.”
translation:
  language: uk
  text: 'А інший з учнів сказав Йому: «Господи, дозволь мені спершу піти й поховати мого батька»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Прохання може стосуватися як негайного поховання, так і, ширше, виконання синівського обов’язку до смерті батька; грецький текст цього не уточнює.
    reason: cultural_note
lexical_decisions:
- source_word: ἕτερος δὲ τῶν μαθητῶν
  choice: А інший з учнів
  rationale: Передає належність мовця до учнів і м’який перехід δέ без надмірно сильного протиставлення.
- source_word: Κύριε
  choice: Господи
  rationale: Природна українська клична форма, що зберігає шанобливе звертання та можливу богословську вагу титулу.
- source_word: ἐπίτρεψόν μοι
  choice: дозволь мені
  rationale: Точно й природно передає прохання про дозвіл.
- source_word: πρῶτον ἀπελθεῖν
  choice: спершу піти
  rationale: «Спершу» зберігає послідовність, виражену πρῶτον; «піти» природно передає віддалення з наявного місця без стилістично важкого «відійти».
- source_word: θάψαι τὸν πατέρα μου
  choice: поховати мого батька
  rationale: Прямий і природний відповідник, який не визначає, чи батько вже помер, а чи йдеться ширше про майбутнє виконання синівського обов’язку.
theological_decisions:
- issue: Час і характер прохання поховати батька
  choice: Залишити пряме прохання без уточнення обставин; неоднозначність пояснити в примітці.
  alternative: Уточнити, що батько щойно помер, або що учень хоче залишатися з ним до його смерті.
  rationale: Грецький текст не визначає, чи йдеться про негайний похорон, чи ширше про виконання синівського обов’язку до смерті батька; переклад не повинен обирати одну з цих інтерпретацій.
translation_notes:
  register: Сучасна нормативна українська мова; виклад природний, стислий і гідний. Кличне «Господи» та форма «Йому» відповідають усталеному біблійному регістру без архаїзації.
