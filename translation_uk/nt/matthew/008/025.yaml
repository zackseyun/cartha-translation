lexical_decisions:
- source_word: προσελθόντες
  choice: підійшовши
  rationale: Аористовий дієприкметник передає рух до Ісуса, що передував тому, як учні його розбудили. «Підійшовши» природно й точно зберігає цю послідовність.
- source_word: ἤγειραν
  choice: розбудили
  rationale: У цьому контексті ἐγείρω означає пробудити когось від сну; «розбудили» не вносить недоречного тут значення воскресіння чи піднесення.
- source_word: λέγοντες
  choice: й сказали
  rationale: Українська сурядна конструкція природно передає супровідний дієприкметник і вводить пряму мову без додавання емоційного забарвлення.
- source_word: Κύριε
  choice: Господи
  rationale: Клична форма «Господи» відповідає κύριε й зберігає можливий діапазон від шанобливого звертання до христологічного титулу.
- source_word: σῶσον
  choice: врятуй нас
  rationale: Аористовий наказовий спосіб виражає термінове прохання про порятунок від безпосередньої небезпеки. Додаток «нас» граматично не виражений окремим словом у грецькому тексті, але однозначно випливає з контексту та наступного «ми гинемо».
- source_word: ἀπολλύμεθα
  choice: ми гинемо
  rationale: Теперішня форма передає загрозу загибелі, яка вже розгортається. «Ми гинемо» природне українською та зберігає терміновість вислову.
theological_decisions:
- issue: Передача κύριος як звертання до Ісуса
  choice: Господи
  alternative: Учителю / Пане
  rationale: «Господи» зберігає як звичайне шанобливе звертання, так і можливу глибшу христологічну вагу титулу, не звужуючи його до суто функціонального значення.
- issue: Передача семантичного діапазону σῴζω в безпосередній небезпеці
  choice: врятуй нас
  alternative: спаси нас
  rationale: У сцені загрози на морі «врятуй» найприродніше виражає негайний порятунок, тоді як примітка зберігає ширший смисловий діапазон грецького дієслова й не усуває його богословських відтінків.
translation_notes:
  register: Сучасна нормативна українська мова з природним, гідним біблійним звучанням. Синтаксис дещо спрощено порівняно з грецьким ланцюжком дієприкметників, але послідовність дій збережено. Займенник «його» подано з малої літери відповідно до нейтральної сучасної редакційної норми.
