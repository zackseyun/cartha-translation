  language: uk
  text: Коли ж він зійшов з гори, за ним пішли великі натовпи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καταβάντος δὲ αὐτοῦ
  choice: Коли ж Ісус зійшов
  rationale: Родовий незалежний з аористовим дієприкметником природно передано підрядним реченням часу. Частку δέ відтворено як легке зв’язкове «ж». Ім’я «Ісус» ужито замість займенника для природності українського викладу й ясного зв’язку з попереднім контекстом.
- source_word: ἀπὸ τοῦ ὄρους
  choice: з гори
  rationale: ὄρος може означати гору або пагорб; означена форма вказує на вже відоме місце з попередньої оповіді. «З гори» є точним і природним українським відповідником.
- source_word: ἠκολούθησαν αὐτῷ
  choice: за ним пішли
  rationale: Дієслово ἀκολουθέω з давальним відмінком означає йти слідом за кимось. «За ним пішли» природно передає тут буквальний рух услід і зберігає звичну для української мови конструкцію.
- source_word: ὄχλοι πολλοί
  choice: великі натовпи
  rationale: Множина ὄχλοι з πολλοί позначає численні або великі скупчення людей. «Великі натовпи» звучить природно та зберігає граматичну множину оригіналу.
