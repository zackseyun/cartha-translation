lexical_decisions:
- source_word: Τότε
  choice: Тоді
  rationale: Природний український часовий сполучник, що передає послідовність подій у розповіді.
- source_word: Ἡρῴδης
  choice: Ірод
  rationale: Усталена українська форма біблійного особового імені.
- source_word: λάθρᾳ
  choice: таємно
  rationale: Точно передає прихований характер дії та природно звучить у сучасній українській мові.
- source_word: καλέσας
  choice: покликав
  rationale: Дієприслівникову конструкцію природно передано особовою формою в послідовності дій; у контексті влади Ірода це означає виклик до себе, але без зайвого посилення офіційного відтінку.
- source_word: τοὺς μάγους
  choice: магів
  rationale: Безпосередня й усталена передача μάγοι, яка не вносить пізнішого традиційного образу царів; зрозумілу альтернативу наведено в примітці.
- source_word: ἠκρίβωσεν
  choice: точно довідався
  rationale: Передає значення ретельного й точного встановлення відомостей, не змішуючи його з простим запитуванням.
- source_word: παρ’ αὐτῶν
  choice: від них
  rationale: παρά з родовим відмінком позначає джерело інформації; займенник має ясний антецедент.
- source_word: τὸν χρόνον τοῦ φαινομένου ἀστέρος
  choice: коли з’явилася зоря
  rationale: Природна українська часова конструкція для грецького родового словосполучення; попередність появи щодо розмови зрозуміла з контексту.
