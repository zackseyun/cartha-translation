    reason: alternative_reading
  - marker: b
    text: 'Або: «поклонитися йому». Грецьке дієслово може означати як вияв пошани цареві, так і поклоніння — залежно від контексту.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: кажучи
  rationale: Дієприкметник теперішнього часу вводить пряму мову; буквальне «кажучи» природно пов’язує її з попереднім контекстом.
- source_word: Ποῦ ἐστιν
  choice: Де
  rationale: Пряме відтворення питання про місцеперебування; зв’язка «є» в сучасній українській природно опускається.
- source_word: ὁ τεχθεὶς βασιλεὺς τῶν Ἰουδαίων
  choice: той, хто народився Царем юдеїв
  rationale: Субстантивований пасивний дієприкметник передано підрядною конструкцією без додавання значення «немовля». Орудний «Царем» природно виражає титул, який належить йому від народження.
- source_word: εἴδομεν γὰρ
  choice: Адже ми побачили
  rationale: γάρ пояснює причину запитання, а аорист передано доконаним минулим часом.
- source_word: αὐτοῦ τὸν ἀστέρα
  choice: його зорю
  rationale: Присвійний родовий відмінок природно передано займенником; «зоря» не уточнює природи небесного знаку.
- source_word: ἐν τῇ ἀνατολῇ
  choice: на сході
  rationale: Фраза може позначати схід як напрямок або схід зорі. Основний текст зберігає традиційне географічне прочитання, а інше подано в примітці.
- source_word: ἤλθομεν
  choice: прийшли
  rationale: Український доконаний минулий час природно передає завершене прибуття, актуальне в момент мовлення.
- source_word: προσκυνῆσαι αὐτῷ
  choice: вклонитися йому
  rationale: «Вклонитися» передає жест пошани цареві, не виключаючи ширшого релігійного значення грецького дієслова; явну альтернативу подано в примітці.
theological_decisions:
- issue: Значення προσκυνῆσαι стосовно Ісуса
  choice: вклонитися йому
  alternative: поклонитися йому
  rationale: У найближчому контексті мудреці шукають Царя юдеїв, тому царська шана є безпосереднім смисловим тлом. Водночас грецьке слово може означати поклоніння, тож цю богословськи важливу можливість не усунуто, а збережено в примітці.
translation_notes:
  register: Сучасна нормативна українська з гідним біблійним звучанням. Займенники щодо Ісуса подано з малої літери відповідно до звичайної сучасної орфографічної практики; титул «Цар» у прямій мові виділено великою літерою. Справжню двозначність висловів ἐν τῇ ἀνατολῇ та προσκυνῆσαι збережено за допомогою приміток.
