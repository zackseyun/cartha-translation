source:
  edition: SBLGNT
  text: καὶ πέμψας αὐτοὺς εἰς Βηθλέεμ εἶπεν· Πορευθέντες ⸂ἐξετάσατε ἀκριβῶς⸃ περὶ τοῦ παιδίου· ἐπὰν δὲ εὕρητε, ἀπαγγείλατέ μοι, ὅπως κἀγὼ ἐλθὼν προσκυνήσω αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/008.yaml
  text: And after sending them to Bethlehem[a], he said, “Go and search carefully for the child, and when you find him, report to me, so that I too may come and worship him.”
translation:
  language: uk
  text: 'Пославши їх до Вифлеєма, він сказав: «Ідіть і ретельно розшукайте дитину. А коли знайдете, повідомте мені, щоб і я прийшов та поклонився їй[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «вклонився їй» чи «віддав їй шану». Грецьке дієслово може означати як поклоніння, так і вияв пошани перед царською особою.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέμψας
  choice: пославши
  rationale: Аористовий дієприкметник перед εἶπεν передає дію, що передує словам Ірода; український дієприслівник природно зберігає цю послідовність.
- source_word: Πορευθέντες
  choice: Ідіть
  rationale: Дієприкметник має наказову силу разом з ἐξετάσατε; особова наказова форма звучить природно сучасною українською.
- source_word: ἐξετάσατε ἀκριβῶς
  choice: ретельно розшукайте
  rationale: Сполука означає старанне й точне розслідування або пошук. У цьому контексті метою є знайти дитину, тому «ретельно розшукайте» ясно передає практичний зміст наказу.
- source_word: περὶ τοῦ παιδίου
  choice: дитину
  rationale: При дієслові пошуку українська мова природно передає особу прямим додатком, а не буквальним «про дитину».
- source_word: παιδίου
  choice: дитину
  rationale: παιδίον позначає дитину без потреби додавати вікове уточнення «малу».
- source_word: ἐπὰν δὲ εὕρητε
  choice: А коли знайдете
  rationale: Конструкція виражає очікувану майбутню умову. «Коли» природно звучить у настанові й не перетворює її на твердження про гарантований результат.
- source_word: ἀπαγγείλατέ μοι
  choice: повідомте мені
  rationale: ἀπαγγέλλω означає передати звістку або доповісти; «повідомте» зберігає цей відтінок без канцелярського звучання.
- source_word: ὅπως
  choice: щоб
  rationale: Сполучник прямо й природно передає значення мети.
- source_word: κἀγὼ
  choice: і я
  rationale: 'Передає додатковість: Ірод удає, ніби має такий самий намір, як мудреці.'
- source_word: ἐλθὼν προσκυνήσω αὐτῷ
  choice: і я пішов та поклонився їй
  rationale: Дієприкметник і дієслово природно передано як послідовні дії. «Поклонитися» зберігає можливий діапазон від вияву пошани цареві до поклоніння; займенник «їй» граматично узгоджено з українським іменником «дитина».
theological_decisions:
- issue: Значення προσκυνήσω щодо дитини Ісуса
  choice: поклонився їй
  alternative: вклонився їй; віддав їй шану; поклонився їй як Богові
  rationale: Грецьке προσκυνέω може означати як поклоніння, так і низький уклін або вияв шани царській особі. Українське «поклонитися» достатньо широке, щоб не усунути цю напругу; примітка робить лексичну неоднозначність явною. Оманливість наміру Ірода випливає з оповіді, але не повинна змінювати переклад його слів.
translation_notes:
  register: Сучасна, зрозуміла й гідна оповідна українська. Пряму мову подано природними наказовими формами; уникнуто архаїзмів і конфесійно навантаженого уточнення значення προσκυνέω.
