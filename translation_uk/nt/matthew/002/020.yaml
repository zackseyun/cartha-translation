source:
  edition: SBLGNT
  text: λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ πορεύου εἰς γῆν Ἰσραήλ, τεθνήκασιν γὰρ οἱ ζητοῦντες τὴν ψυχὴν τοῦ παιδίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/020.yaml
  text: saying[a], “Get up, take the child and his mother, and go to the land of Israel, for those seeking the child’s life are dead.”
translation:
  language: uk
  text: 'кажучи: «Встань, візьми Дитину та Його матір і йди до землі Ізраїлю, бо ті, хто зазіхали на життя Дитини, померли[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «мертві».'
    reason: Перфект τεθνήκασιν може підкреслювати теперішній стан як наслідок смерті; основне «померли» природно передає подію з її чинним результатом.
lexical_decisions:
- source_word: λέγων
  choice: кажучи
  rationale: Дієприкметник теперішнього часу вводить слова ангела й зберігає синтаксичний зв’язок із попереднім віршем.
- source_word: Ἐγερθείς
  choice: Встань
  rationale: Аористовий пасивний дієприкметник перед наказовою формою має ідіоматичну спонукальну силу; українське «Встань» передає її природно.
- source_word: παράλαβε
  choice: візьми
  rationale: У контексті παραλαμβάνω означає взяти когось із собою; «візьми» є стислим і природним відповідником.
- source_word: τὸ παιδίον
  choice: Дитину
  rationale: παιδίον означає дитину без необхідності додавати уточнення «малу». Велику літеру вжито як шанобливе контекстуальне позначення Ісуса.
- source_word: τὴν μητέρα αὐτοῦ
  choice: Його матір
  rationale: Займенник αὐτοῦ безпосередньо вказує на Дитину; ця конструкція природна українською.
- source_word: πορεύου
  choice: йди
  rationale: Наказова форма πορεύομαι тут є простим велінням вирушити; «йди» точно й природно передає значення.
- source_word: εἰς γῆν Ἰσραήλ
  choice: в землю Ізраїлю
  rationale: Збережено територіальне значення γῆ та природне українське керування напрямку.
- source_word: τεθνήκασιν
  choice: померли
  rationale: Перфект указує на завершену смерть із чинним результатом; у природній українській у цьому реченні «померли» передає і подію, і її актуальний наслідок.
- source_word: οἱ ζητοῦντες
  choice: ті, хто шукав
  rationale: Субстантивований дієприкметник позначає людей, які домагалися життя Дитини; минулий час природно показує, що ця загроза вже припинилася, не уточнюючи способу пошуку.
- source_word: τὴν ψυχὴν τοῦ παιδίου
  choice: життя Дитини
  rationale: У сталому контексті смертельної загрози ψυχή означає життя, а не нематеріальну душу.
theological_decisions:
- issue: Передача ψυχή в контексті смертельної загрози
  choice: життя
  alternative: душу
  rationale: Вислів «шукати чиєїсь ψυχή» тут означає зазіхати на життя, тобто прагнути вбити; «душу» внесло б не передбачений контекстом антропологічний відтінок.
- issue: Число осіб у вислові οἱ ζητοῦντες
  choice: ті, хто шукав
  alternative: той, хто шукав
  rationale: Грецький текст має множину, яку слід зберегти, не намагаючись узгодити її лише з Іродом чи пояснити склад цієї групи.
translation_notes:
  register: Сучасна літературна українська з гідним біблійним звучанням. Накази сформульовано просто й природно; синтаксичний зв’язок λέγων із попереднім віршем збережено дієприслівником «кажучи».
