  text: Τοῦ δὲ Ἰησοῦ γεννηθέντος ἐν Βηθλέεμ τῆς Ἰουδαίας ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως, ἰδοὺ μάγοι ἀπὸ ἀνατολῶν παρεγένοντο εἰς Ἱεροσόλυμα
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/001.yaml
  text: After Jesus was born in Bethlehem of Judea in the days of Herod the king[a], behold, wise men from the east arrived in Jerusalem,
translation:
  language: uk
  text: Після того як Ісус народився у Вифлеємі Юдейському за днів царя Ірода, ось до Єрусалима прибули мудреці[a] зі сходу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «маги». Грецьке слово означає освічених людей зі Сходу, імовірно пов’язаних з астрологією або придворною мудрістю.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γεννηθέντος
  choice: Після того як Ісус народився
  rationale: Родовий абсолют задає фонову обставину, що передує головній дії. Такий переклад природно передає часовий зв’язок; слабкий оповідний перехід δέ окремим словом не відтворено.
- source_word: Βηθλέεμ τῆς Ἰουδαίας
  choice: у Вифлеємі Юдейському
  rationale: Усталена українська форма назви та природний прикметниковий зворот уточнюють, що йдеться про Вифлеєм у Юдеї.
- source_word: ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως
  choice: за днів царя Ірода
  rationale: Збережено історичний біблійний зворот і прикладку «цар», водночас вислів лишається зрозумілим сучасному читачеві.
- source_word: ἰδοὺ
  choice: ось
  rationale: Маркер привертає увагу до появи нових учасників оповіді; «ось» стисло зберігає цю функцію.
- source_word: μάγοι
  choice: мудреці
  rationale: Доступне українське позначення освічених східних знавців; воно не приписує їм ані царського статусу, ані певної кількості. Точнішу транслітерацію наведено у примітці.
- source_word: ἀπὸ ἀνατολῶν
  choice: зі сходу
  rationale: Природний український відповідник грецького множинного вислову про східні краї.
- source_word: παρεγένοντο εἰς Ἱεροσόλυμα
  choice: до Єрусалима прибули
  rationale: Дієслово позначає прибуття, а εἰς — напрямок руху; український порядок слів природно поєднує їх.
theological_decisions:
- issue: Передача μάγοι без внесення пізнішої традиції
  choice: мудреці
  alternative: маги
  rationale: Грецький термін означає освічених людей зі Сходу, імовірно пов’язаних з астрологією або придворною мудрістю. Основний текст не називає їх царями й не визначає їхньої кількості; технічніший відповідник збережено в примітці.
translation_notes:
  register: Сучасна літературна українська з помірно урочистим біблійним звучанням. Звороти «за днів» та «ось» зберігають оповідну виразність, не роблячи текст архаїчним.
