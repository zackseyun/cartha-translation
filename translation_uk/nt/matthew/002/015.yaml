source:
  edition: SBLGNT
  text: καὶ ἦν ἐκεῖ ἕως τῆς τελευτῆς Ἡρῴδου· ἵνα πληρωθῇ τὸ ῥηθὲν ⸀ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος· Ἐξ Αἰγύπτου ἐκάλεσα τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/015.yaml
  text: and was there until the death of Herod[a], so that what was spoken by the Lord through the prophet might be fulfilled, saying[c][b], “Out of Egypt I called my son.”
translation:
  language: uk
  text: 'І він був там до смерті Ірода, щоб сповнилося сказане Господом через пророка: «З Єгипту Я покликав Свого Сина».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Цитата з Осії 11:1. У первісному контексті «сином» названо Ізраїль; Матвій подає цей уривок як такий, що сповнюється в Ісусі.
    reason: cross_reference
lexical_decisions:
- source_word: ἦν ἐκεῖ
  choice: був там
  rationale: Простий відповідник імперфекта εἰμί з ἐκεῖ; не додає до грецького тексту виразнішого значення «залишався» чи «перебував».
- source_word: ἕως τῆς τελευτῆς Ἡρῴδου
  choice: аж до смерті Ірода
  rationale: τελευτή тут означає кінець життя, тобто смерть; «аж до» природно передає часову межу.
- source_word: ἵνα πληρωθῇ
  choice: щоб сповнилося
  rationale: Зберігає цільово-наслідкову силу ἵνα та пасивну форму усталеної в Матвія формули сповнення.
- source_word: τὸ ῥηθὲν ὑπὸ κυρίου
  choice: сказане Господом
  rationale: Субстантивований пасивний дієприкметник передано стисло й природно; κύριος перекладено як «Господь» без додавання слова «Бог».
- source_word: διὰ τοῦ προφήτου
  choice: через пророка
  rationale: 'διά з родовим відмінком позначає посередництво: Господь є джерелом слова, а пророк — його людським передавачем.'
- source_word: Ἐξ Αἰγύπτου
  choice: З Єгипту
  rationale: Природний сучасний український відповідник ἐξ, який зберігає напрямок руху з Єгипту.
- source_word: ἐκάλεσα
  choice: Я покликав
  rationale: καλέω у цитаті означає покликати, зокрема покликати звідкись; цей відповідник не звужує значення до наказового «викликав».
- source_word: τὸν υἱόν μου
  choice: Свого Сина
  rationale: «Сина» точно передає υἱόν і зберігає важливу синівську мову цитати; зворотний займенник «Свого» природний українською та однозначно стосується мовця.
theological_decisions:
- issue: Характер сповнення Осії 11:1
  choice: Збережено Матвієве твердження про сповнення без уточнення його механізму.
  alternative: Витлумачити цитату в самому перекладі лише як пряме передбачення або лише як типологічне повторення історії Ізраїлю.
  rationale: Формула ἵνα πληρωθῇ прямо говорить про сповнення, але не пояснює в цьому реченні, як саме первісне слово про Ізраїль співвідноситься з Ісусом; переклад не повинен усувати цю напругу.
- issue: Передача κυρίου
  choice: Господом
  alternative: ГОСПОДОМ або Господом Богом
  rationale: Грецький текст має κυρίου; «Господом» точно передає форму тексту, тоді як додавання «Богом» або типографічне відтворення тетраграми виходило б за її межі.
translation_notes:
  register: Сучасна нормативна українська мова з урочистим, але доступним біблійним звучанням. Двокрапка природно передає функцію λέγοντος перед прямою мовою без важкого буквального «кажучи».
