id: MAT.2.6
reference: Matthew 2:6
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Καὶ σύ, Βηθλέεμ γῆ Ἰούδα, οὐδαμῶς ἐλαχίστη εἶ ἐν τοῖς ἡγεμόσιν Ἰούδα· ἐκ σοῦ γὰρ ἐξελεύσεται ἡγούμενος, ὅστις ποιμανεῖ τὸν λαόν μου τὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/006.yaml
  text: And you[a], Bethlehem, land of Judah, are by no means least among the rulers of Judah[b]; for from you will come a ruler who will shepherd my people Israel.
translation:
  language: uk
  text: І ти, Вифлеєме, земле Юди, аж ніяк не найменша серед правителів Юди, бо з тебе вийде[a] правитель, який пастиме[b] мій народ, Ізраїль.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «виступить»; буквальніше — «вийде».
    reason: lexical_alternative
  - marker: b
    text: «Пастиме» може також мати значення «правитиме», поєднуючи образ пастирської опіки з царською владою.
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆ
  choice: земле
  rationale: У звертанні до Вифлеєма слово означає землю або край, пов’язаний з Юдою; форма кличного відмінка «земле» природно відтворює грецьку прикладку.
- source_word: οὐδαμῶς
  choice: аж ніяк не
  rationale: Передає посилене заперечення, а не просте «не».
- source_word: ἐλαχίστη
  choice: найменший
  rationale: Зберігає найвищий ступінь і можливий відтінок не лише розміру, а й значущості чи становища.
- source_word: ἡγεμόσιν
  choice: правителів
  rationale: Відтворює значення керівництва й влади без звуження до конкретної адміністративної посади; незвичне зіставлення міста з правителями збережено, як у грецькому тексті.
- source_word: ἐξελεύσεται
  choice: вийде
  rationale: Безпосередньо передає образ виходу або появи когось із Вифлеєма; альтернативний напрямковий відтінок зазначено у примітці.
- source_word: ἡγούμενος
  choice: правитель
  rationale: Субстантивований дієприкметник позначає того, хто веде й керує; «правитель» зберігає царський вимір уривка.
- source_word: ποιμανεῖ
  choice: пастиме
  rationale: Зберігає буквальний пастирський образ, який водночас може означати здійснення влади.
- source_word: λαόν μου τὸν Ἰσραήλ
  choice: мій народ Ізраїль
  rationale: Стисло й природно передає завітний вислів та прикладкове уточнення «Ізраїль» без доданих слів.
theological_decisions:
- issue: Царський і пастирський відтінки в описі майбутньої постаті
  choice: «правитель, який пастиме»
  alternative: «вождь, який правитиме» або послідовно пастирське формулювання
  rationale: Грецький текст поєднує владне найменування з образом пастиря. Збереження обох образів не зводить зміст лише до політичного правління або лише до пастирської турботи.
translation_notes:
  register: Сучасна нормативна українська мова з урочистим, але зрозумілим біблійним звучанням. Використано кличні форми «Вифлеєме, земле Юдина». Займенник «мій» подано з малої літери відповідно до нейтральної сучасної орфографічної практики та грецького тексту.
