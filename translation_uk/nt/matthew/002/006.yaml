- from: І ти, Вифлеєме, земле Юдина, аж ніяк не найменший серед правителів Юди, бо з тебе вийде[a] правитель, який пастиме[b] мій народ Ізраїль.
  to: І ти, Вифлеєме, земле Юди, аж ніяк не найменша серед правителів Юди, бо з тебе вийде[a] правитель, який пастиме[b] мій народ, Ізраїль.
  rationale: The revision corrects required grammatical agreement with «земле», uses the normative genitive «Юди», and marks «Ізраїль» as appositional. It otherwise preserves the draft’s close rendering, including the source text’s unusual «among the rulers of Judah» wording and the twofold ruler/shepherd imagery.
