  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Тоді
  rationale: Природно й стисло позначає послідовність подій у розповіді Матвія.
- source_word: ἐπληρώθη
  choice: збулося
  rationale: Зберігає характерну для Матвія мову здійснення пророцтва й природно сполучається українською із «сказане».
- source_word: τὸ ῥηθὲν
  choice: сказане
  rationale: Субстантивований дієприкметник передано стисло й природно, без додавання відсутнього в грецькому тексті іменника «слово».
- source_word: διὰ Ἰερεμίου
  choice: через ... Єремію
  rationale: 'Прийменник διά з родовим відмінком передає посередництво: пророча звістка була висловлена через Єремію.'
- source_word: τοῦ προφήτου
  choice: пророка
  rationale: Прикладкове означення ролі Єремії природно включене у словосполучення «через пророка Єремію».
- source_word: λέγοντος
  choice: ':'
  rationale: Родовий дієприкметник вводить наступну цитату й граматично узгоджується з Єремією; в сучасній українській цю функцію природно передає двокрапка, тоді як буквальне «який говорив» було б важким і двозначним.
theological_decisions:
- issue: Формула здійснення пророцтва в Матвія
  choice: збулося сказане
  alternative: сталося на виконання сказаного
  rationale: Збережено пряму заяву Матвія про здійснення пророчого слова без причинного розширення, якого немає в грецькому тексті.
- issue: Посередництво пророка
  choice: через пророка Єремію
  alternative: пророком Єремією
  rationale: «Через» виразніше зберігає значення διά з родовим відмінком і не уточнює понад текст джерело вислову.
translation_notes:
  register: Сучасна літературна українська, урочиста без архаїзації. Порядок «пророка Єремію» природніший українською за кальковане «Єремію-пророка». Позначку примітки поставлено безпосередньо перед двокрапкою.
