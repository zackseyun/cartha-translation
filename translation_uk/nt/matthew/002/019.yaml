  text: Τελευτήσαντος δὲ τοῦ Ἡρῴδου ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ ἐν Αἰγύπτῳ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/019.yaml
  text: But after Herod died[a], behold, an angel of the Lord appears in a dream to Joseph in Egypt.
translation:
  language: uk
  text: А після смерті Ірода — ось ангел Господній[a] з’являється Йосипові уві сні в Єгипті.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: У грецькому тексті перед словом «ангел» немає артикля. Українська мова не позначає означеність або неозначеність артиклем; тому цей вислів не обов’язково означає конкретного, раніше згаданого ангела.
    reason: Зберігає неоднозначність щодо означеності ἄγγελος без зміни значення родового вислову κυρίου.
lexical_decisions:
- source_word: Τελευτήσαντος ... τοῦ Ἡρῴδου
  choice: після смерті Ірода
  rationale: Аористовий дієприкметник у родовому абсолютному звороті має часове значення. Іменникова конструкція природно й точно передає попередність події українською.
- source_word: δὲ
  choice: А
  rationale: Позначає перехід у розповіді з легким відтінком протиставлення; «А» природно продовжує українську оповідь.
- source_word: ἰδοὺ
  choice: ось
  rationale: Зберігає функцію виразного маркера уваги без архаїчного звучання.
- source_word: ἄγγελος κυρίου
  choice: ангел Господній
  rationale: Усталений і природний український відповідник конструкції зі значенням належності або походження. Відсутність артикля перед ἄγγελος неможливо прямо відтворити українською, тому неоднозначність пояснено в примітці.
- source_word: φαίνεται
  choice: з’являється
  rationale: Теперішній час грецького дієслова є історичним теперішнім; український теперішній зберігає жвавість оповіді.
- source_word: κατ’ ὄναρ
  choice: уві сні
  rationale: Природний український відповідник матвіївського вислову про одкровення, отримане в сні.
- source_word: τῷ Ἰωσὴφ
  choice: Йосипові
  rationale: Давальний відмінок природно передає особу, якій з’явився ангел.
- source_word: ἐν Αἰγύπτῳ
  choice: в Єгипті
  rationale: Пряме відтворення обставини місця.
theological_decisions:
- issue: Передача κύριος у вислові ἄγγελος κυρίου
  choice: Господній
  alternative: від Господа
  rationale: Прикметникова форма природна для усталеного біблійного вислову й передає зв’язок ангела з Господом, не додаючи окремого богословського тлумачення.
- issue: Означеність слова ἄγγελος
  choice: ангел Господній із приміткою
  alternative: один з ангелів Господа / той ангел Господній
  rationale: У грецькому тексті перед ἄγγελος немає артикля, однак українська мова не має неозначеного артикля. Додавання «один» надмірно конкретизувало б неозначеність, а «той» безпідставно зробило б вислів означеним.
translation_notes:
  register: Сучасна літературна українська з гідним оповідним звучанням. «Ось» передає виразність ἰδού, а історичний теперішній «з’являється» зберігає жвавість грецької розповіді.
