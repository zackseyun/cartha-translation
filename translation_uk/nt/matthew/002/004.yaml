  source_fidelity: 'Текст точно передає грецьку синтаксичну й смислову структуру: дієприслівник «зібравши» відповідає συναγαγών і виражає попередню дію; «всіх» передає πάντας; «первосвященників та книжників народу» відтворює обидві групи та родовий зв’язок τοῦ λαοῦ. «Розпитував у них» доречно передає імперфект ἐπυνθάνετο й παρά + родовий. Формула «де має народитися Месія» природно виражає очікуване майбутнє народження в непрямому питанні, не вносячи додаткового богословського твердження.'
