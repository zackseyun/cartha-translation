  terminology: «Первосвященники» коректно позначає множинну групу старших священників, а не кількох одночасних носіїв однієї посади. «Книжники» є усталеним і зрозумілим відповідником γραμματεῖς. «Месія» належно передає титул ὁ χριστός у юдейському контексті; примітка коректно фіксує традиційний альтернативний відповідник «Христос» та значення титулу.
