id: MAT.2.4
reference: Matthew 2:4
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: καὶ συναγαγὼν πάντας τοὺς ἀρχιερεῖς καὶ γραμματεῖς τοῦ λαοῦ ἐπυνθάνετο παρ’ αὐτῶν ποῦ ὁ χριστὸς γεννᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/004.yaml
  text: And gathering together all the chief priests and scribes of the people[a], he was inquiring of them where the Messiah was to be born.
translation:
  language: uk
  text: І, зібравши всіх первосвященників та книжників народу, він розпитував у них, де має народитися Месія.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Христос». Грецький титул Χριστός означає «Помазанець»; тут його передано словом «Месія», щоб зберегти юдейський месіанський контекст.'
    reason: Альтернативна передача титулу Χριστός.
lexical_decisions:
- source_word: συναγαγὼν
  choice: зібравши
  rationale: Дієприслівник доконаного виду природно передає аористовий дієприкметник і дію, що передує розпитуванню.
- source_word: πάντας τοὺς ἀρχιερεῖς
  choice: всіх первосвященників
  rationale: «Усіх» зберігає повноту πάντας, а множина «первосвященники» позначає провідне священницьке коло, а не кількох одночасних носіїв єдиної посади первосвященника.
- source_word: γραμματεῖς τοῦ λαοῦ
  choice: книжників народу
  rationale: Традиційне й зрозуміле «книжники» прямо передає назву знавців і тлумачів Писання; родовий відмінок зберігає конструкцію «народу» без доданого етнічного уточнення.
- source_word: ἐπυνθάνετο παρ’ αὐτῶν
  choice: розпитував у них
  rationale: Недоконаний вид передає тривале або наполегливе з’ясування, властиве імперфекту; «у них» виражає значення παρά.
- source_word: ποῦ
  choice: де
  rationale: Прямий і природний відповідник питального прислівника.
- source_word: ὁ χριστὸς
  choice: Месія
  rationale: У контексті очікуваного юдейського володаря Χριστός є титулом; «Месія» природно зберігає цей месіанський контекст.
- source_word: γεννᾶται
  choice: має народитися
  rationale: У непрямому питанні про пророчо очікуване народження ця конструкція природно передає спрямованість теперішньої пасивної форми на очікувану подію, не стверджуючи примусу чи обов’язку.
theological_decisions:
- issue: Передача титулу Χριστός
  choice: Месія
  alternative: Христос; Помазанець
  rationale: Ірод питає про очікуваного з юдейських пророцтв помазаного володаря. «Месія» зберігає цей контекст і не перетворює титул на особове ім’я; примітка подає традиційний грецький відповідник.
translation_notes:
  register: Сучасна літературна українська з урочистим, але доступним біблійним звучанням. Збережено синтаксичну послідовність грецького речення та імперфективність головного дієслова; уникнуто конфесійних уточнень.
