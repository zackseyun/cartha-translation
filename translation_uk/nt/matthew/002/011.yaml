id: MAT.2.11
reference: Matthew 2:11
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: καὶ ἐλθόντες εἰς τὴν οἰκίαν εἶδον τὸ παιδίον μετὰ Μαρίας τῆς μητρὸς αὐτοῦ, καὶ πεσόντες προσεκύνησαν αὐτῷ, καὶ ἀνοίξαντες τοὺς θησαυροὺς αὐτῶν προσήνεγκαν αὐτῷ δῶρα, χρυσὸν καὶ λίβανον καὶ σμύρναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/011.yaml
  text: 'And when they came into the house[a], they saw the child with Mary his mother, and falling down they paid homage to him, and opening their treasures they offered him gifts: gold and frankincense and myrrh.'
translation:
  language: uk
  text: 'Увійшовши в дім, вони побачили дитину з Марією, його матір’ю, і, впавши ниць, віддали йому шану[a]. Відкривши свої скарби, вони піднесли йому дари: золото, ладан і смирну.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «поклонилися йому». Грецьке дієслово може означати як поклоніння, так і вияв глибокої шани — залежно від контексту.'
    reason: Зберігає семантичний діапазон προσκυνέω та богословську напругу, не нав’язуючи одного прочитання.
lexical_decisions:
- source_word: οἰκίαν
  choice: дім
  rationale: Прямо й природно позначає житловий будинок, не додаючи припущень про його характер чи власника.
- source_word: παιδίον
  choice: дитину
  rationale: Передає значення дитини без невиправданого уточнення віку; це природний відповідник у сучасній українській.
- source_word: μετὰ Μαρίας τῆς μητρὸς αὐτοῦ
  choice: з Марією, його матір’ю
  rationale: Зберігає значення μετά з родовим відмінком та прикладку, яка називає Марію матір’ю дитини.
- source_word: πεσόντες
  choice: впавши ниць
  rationale: Виразно передає попередню тілесну дію та позу глибокої пошани, не зводячи її лише до звичайного поклону.
- source_word: προσεκύνησαν
  choice: віддали йому шану
  rationale: Зберігає можливе значення шанобливого вшанування царської особи, не усуваючи сильнішого значення поклоніння; його подано у примітці.
- source_word: θησαυρούς
  choice: скарби
  rationale: Найближчий широкий відповідник, який не конкретизує грецьке слово як скрині чи інші певні вмістилища.
- source_word: προσήνεγκαν
  choice: піднесли
  rationale: Природно передає урочисте принесення або вручення дарів і відповідає контексту вшанування.
- source_word: δῶρα
  choice: дари
  rationale: Точний і стилістично гідний відповідник без додаткового культового значення слова «жертви».
- source_word: λίβανον
  choice: ладан
  rationale: Точна українська назва ароматичної смоли frankincense, про яку йдеться в цьому контексті.
- source_word: σμύρναν
  choice: смирну
  rationale: Усталений і точний український відповідник назви ароматичної речовини.
theological_decisions:
- issue: Значення προσκυνέω стосовно дитини Ісуса
  choice: віддали йому шану
  alternative: поклонилися йому
  rationale: У контексті дія може означати глибоку пошану царській дитині або поклоніння в сильнішому релігійному сенсі. Основний текст не звужує значення, а примітка зберігає богословськи сильнішу можливість.
- issue: Написання займенників щодо Ісуса
  choice: 'з малої літери: «йому», «його»'
  alternative: 'з великої літери: «Йому», «Його»'
  rationale: Грецький текст не кодує шанобливої великої літери; мала літера не додає до перекладу пізнішої графічної богословської інтерпретації.
translation_notes:
  register: Сучасна стандартна українська з гідним, але доступним синтаксисом. Дієприслівникові звороти відтворюють послідовність грецьких аористових дієприкметників. Маркер примітки поставлено після вислову, до якого вона фактично належить, тобто після передачі προσκυνέω.
