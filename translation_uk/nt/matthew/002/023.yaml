language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν κατῴκησεν εἰς πόλιν λεγομένην Ναζαρέτ, ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τῶν προφητῶν ὅτι Ναζωραῖος κληθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/023.yaml
  text: 'And he came and lived in a city called Nazareth[a], so that what was spoken through the prophets might be fulfilled: “He will be called a Nazarene.”'
translation:
  language: uk
  text: 'І він прийшов і оселився у місті, яке називається Назарет, щоб сповнилося сказане через пророків: «Його назвуть Назарянином».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або формальніше: «Назорей». Точне пророче підґрунтя слів «Його назвуть Назарянином» залишається дискусійним; Матвій, можливо, підсумовує теми кількох пророків, а не дослівно цитує один конкретний текст.'
    reason: Лексична альтернатива та збереження невизначеності щодо пророчого джерела.
lexical_decisions:
- source_word: ἐλθὼν
  choice: прийшовши
  rationale: Дієприслівник природно передає аористовий дієприкметник і послідовність дій, не обтяжуючи українського речення.
- source_word: κατῴκησεν
  choice: оселився
  rationale: Дієслово означає проживання або влаштування на проживання; «оселився» тут природніше й точніше за архаїчне «замешкав».
- source_word: εἰς πόλιν λεγομένην Ναζαρέτ
  choice: в місті, що зветься Назарет
  rationale: З дієсловом проживання грецьке εἰς природно передається місцевою конструкцією «в місті»; «що зветься» зберігає зміст λεγομένην у сучасній гідній мові.
- source_word: ὅπως
  choice: щоб
  rationale: Передає властивий формулі Матвія відтінок мети й наслідку, не усуваючи напруження між ними.
- source_word: πληρωθῇ
  choice: сповнилося
  rationale: Усталений і природний відповідник пасивної форми πληρόω у формулах про здійснення пророчого слова.
- source_word: τὸ ῥηθὲν
  choice: сказане
  rationale: 'Стисло й без доданого суб’єкта передає субстантивований пасивний дієприкметник: «те, що було сказане».'
- source_word: διὰ τῶν προφητῶν
  choice: через пророків
  rationale: Зберігає посередницьке значення διά з родовим відмінком та множину «пророків».
- source_word: Ναζωραῖος
  choice: Назарянин
  rationale: Природна українська назва людини, пов’язаної з Назаретом; вона не змішує цей вислів із назореєм, який дав окрему обітницю.
- source_word: κληθήσεται
  choice: Його назвуть
  rationale: Природна українська неозначено-особова конструкція точно передає майбутній пасив і пророчий стиль.
theological_decisions:
- issue: Характер формули здійснення пророцтва, для якої немає одного дослівного старозавітного джерела
  choice: Збережено пряму згадку про «пророків» у множині без ототожнення вислову з певним уривком.
  alternative: Пов’язати вислів безпосередньо з Ісаї 11:1, з темою зневаги до Месії або витлумачити його як згадку про назорейську обітницю.
  rationale: Грецький текст прямо вживає множину τῶν προφητῶν, що може вказувати на сукупне або тематичне свідчення. Переклад не повинен робити певним те, що джерело залишає дискусійним.
- issue: Передача Ναζωραῖος
  choice: Назарянин
  alternative: Назарей / Назорей
  rationale: У контексті назва стосується зв’язку з Назаретом. Варіант із «назорей» може помилково викликати уявлення про окрему назорейську обітницю; формальніший варіант та невизначене пророче тло пояснено в примітці.
translation_notes:
  register: Сучасна стандартна українська мова з гідним біблійним звучанням. Синтаксис близький до грецького, але природний для пересічного читача; уникнено архаїзмів і термінології, що могла б змішати мешканця Назарета з людиною під назорейською обітницею.
