base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/012.yaml
  text: And having been warned in a dream not to return to Herod[b][a], they departed for their own country by another route.
translation:
  language: uk
  text: І, одержавши уві сні застереження[a] не повертатися до Ірода, вони іншою дорогою[b] вирушили до своєї країни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «одержавши уві сні Боже застереження». Грецька пасивна форма передбачає застереження від Бога, хоча в цьому вірші Бог прямо не названий.'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «іншим шляхом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηματισθέντες
  choice: одержавши ... застереження
  rationale: Пасивний дієприкметник у цьому контексті означає одержання застереження або настанови, найімовірніше від Бога. Формулювання природне українською й не називає прямо того, кого грецький текст прямо не називає.
- source_word: κατ’ ὄναρ
  choice: уві сні
  rationale: Усталений і природний український відповідник матвіївського вислову про повідомлення, одержане під час сну.
- source_word: μὴ ἀνακάμψαι
  choice: не повертатися
  rationale: Інфінітив із μή передає зміст застереження; «не повертатися» точно відповідає ситуації подорожі.
- source_word: πρὸς Ἡρῴδην
  choice: до Ірода
  rationale: Прийменник πρός зі знахідним відмінком тут позначає рух до особи.
- source_word: δι’ ἄλλης ὁδοῦ
  choice: іншою дорогою
  rationale: ὁδός у контексті подорожі має конкретне значення дороги або шляху; орудний відмінок природно передає маршрут українською.
- source_word: ἀνεχώρησαν
  choice: вирушили
  rationale: У цьому оповідному контексті дієслово позначає відхід і подальшу подорож. «Вирушили» природно пов’язує дію з указаним місцем призначення, не додаючи мотиву втечі.
- source_word: εἰς τὴν χώραν αὐτῶν
  choice: до своєї країни
  rationale: χώρα може означати країну, землю або край. Тут ідеться про повернення мудреців на батьківщину; зворотний займенник природно передає αὐτῶν щодо підмета.
theological_decisions:
- issue: Неявно вказане божественне джерело застереження
  choice: У головному тексті вжито безособово-пасивний за змістом вислів «одержавши ... застереження», без додавання «від Бога».
  alternative: «одержавши Боже застереження» або «бувши застережені Богом»
  rationale: Контекст і вживання χρηματίζω дають підстави розуміти застереження як божественне, однак у цьому реченні Бог прямо не названий. Переклад зберігає цей натяк, не перетворюючи його на явне твердження.
translation_notes:
  register: Сучасна літературна українська з гідним оповідним тоном. Порядок слів зроблено природним для української; усі приміткові маркери подано в основному тексті.
