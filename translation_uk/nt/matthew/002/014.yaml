translation:
  language: uk
  text: Тож він встав, узяв дитину та її матір і вночі вирушив до Єгипту.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «відійшов до Єгипту».'
    reason: 'Лексична альтернатива: ἀναχωρέω може означати «відійти», «віддалитися»; εἰς позначає рух до місця призначення.'
lexical_decisions:
- source_word: δὲ
  choice: Тож
  rationale: М’який сполучник продовжує розповідь і тут передає наслідок попереднього ангельського наказу.
- source_word: ἐγερθεὶς
  choice: устав
  rationale: Дієприкметник аориста позначає дію, що передує наступним діям; особова форма природно передає послідовність українською.
- source_word: παρέλαβε
  choice: узяв
  rationale: У цьому контексті παραλαμβάνω означає взяти когось із собою; «узяв» є стислим і природним відповідником.
- source_word: τὸ παιδίον
  choice: Дитя
  rationale: Слово означає дитину; «Дитя» зберігає урочисту, але зрозумілу біблійну оповідну манеру без доданого вікового уточнення.
- source_word: τὴν μητέρα αὐτοῦ
  choice: Його матір
  rationale: Займенник стосується Дитяти, а не Йосипа; велика літера узгоджена з шанобливим оформленням згадки про Ісуса.
- source_word: νυκτὸς
  choice: ще вночі
  rationale: Родовий часу вказує, що дія відбулася вночі; «ще вночі» природно підкреслює негайність, яка випливає з оповідної послідовності, не змінюючи фактичного змісту.
- source_word: ἀνεχώρησεν
  choice: вирушив
  rationale: ἀναχωρέω тут означає залишити місце й попрямувати до іншого; «вирушив» природно поєднується з названим пунктом призначення, хоча дещо слабше передає відтінок відходу.
- source_word: εἰς Αἴγυπτον
  choice: до Єгипту
  rationale: εἰς позначає рух у напрямку пункту призначення; «до Єгипту» є нормативним і природним після «вирушив».
