  source_fidelity: 'Основний зміст передано точно: гнів Ірода, убивство всіх хлопчиків у Вифлеємі та його околицях, вікова межа й зв’язок її з часом, з’ясованим у магів, збережені. Проте «ошукали» може означати обман або шахрайство загалом і менш точно відтворює контекстуальне значення ἐνεπαίχθη — маги обійшли/перехитрили Ірода, не повернувшись до нього. «Перехитрили» передає це без зайвого припущення про конкретний спосіб обману.'
  naturalness: Текст загалом природний для сучасної стандартної української. «Усіх хлопчиків … — дворічних і молодших» зрозуміле, але «віком від двох років і молодших» стилістично незграбне; «віком до двох років включно» природніше й недвозначно охоплює дворічних. «Убив» є нейтральнішим за розмовно-експресивне «повбивав» у біблійному оповідному регістрі.
  terminology: «Ірод», «Вифлеєм» і «маги» прийнятні. Примітка до «маги» доречно пояснює традиційний відповідник і культурне тло. Лексична примітка до ἐνεπαίχθη має зберігати можливість буквальнішого «поглузували з нього».
