  to: Тоді Ірод, побачивши, що маги[a] його перехитрили[b], дуже розлютився. Він послав людей і вбив усіх хлопчиків у Вифлеємі та в усіх його околицях віком до двох років включно, згідно з часом, який він точно з’ясував від магів.
