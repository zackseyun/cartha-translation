    rationale: У цьому контексті дієслово виражає те, що маги зробили Ірода посміховиськом або перехитрили його. «Ошукали» може надто прямо наводити на значення шахрайського обману; «перехитрили» точніше передає контекст без втрати змісту.
  - severity: low
    issue: «повбивав»
    rationale: Форма можлива, але має виразніше розмовно-експресивне забарвлення. Нейтральне «убив усіх» достатньо передає ἀνεῖλεν і краще відповідає стриманому оповідному регістру.
  - severity: low
