source:
  edition: SBLGNT
  text: Τότε Ἡρῴδης ἰδὼν ὅτι ἐνεπαίχθη ὑπὸ τῶν μάγων ἐθυμώθη λίαν, καὶ ἀποστείλας ἀνεῖλεν πάντας τοὺς παῖδας τοὺς ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς ἀπὸ διετοῦς καὶ κατωτέρω, κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/016.yaml
  text: Then Herod[a], seeing that he had been tricked by the magi, became very angry, and sending men, he killed all the boys in Bethlehem and in all its surrounding districts, from two years old and under[b], according to the time that he had determined from the magi.
translation:
  language: uk
  text: Тоді Ірод, побачивши, що маги[a] його перехитрили[b], дуже розлютився. Він послав людей і вбив усіх хлопчиків у Вифлеємі та в усіх його околицях віком до двох років включно, згідно з часом, який він точно з’ясував від магів.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиційно: «мудреці». Грецьке слово означає магів — східних учених-астрологів.'
    reason: cultural_note
  - marker: b
    text: 'Або, буквальніше: «поглузували з нього».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Тоді
  rationale: Природний український часовий сполучник, що позначає наступну подію в оповіді.
- source_word: ἰδὼν ὅτι
  choice: побачивши, що
  rationale: Зберігає образ сприйняття факту й причинний зв’язок із подальшим гнівом Ірода.
- source_word: ἐνεπαίχθη
  choice: його ошукали
  rationale: У цьому контексті дієслово передає те, що маги не повернулися до Ірода й тим самим перехитрили його; буквальніше значення «поглузували» подано в примітці.
- source_word: μάγων
  choice: маги
  rationale: Безпосередньо відтворює історико-культурний термін для східних учених-астрологів, не зводячи його лише до загального «мудреці».
- source_word: ἐθυμώθη λίαν
  choice: дуже розлютився
  rationale: Передає настання сильного гніву та підсилення λίαν природною сучасною українською мовою.
- source_word: ἀποστείλας
  choice: Він послав людей
  rationale: Дієприкметник позначає відрядження виконавців убивства; «людей» є контекстуально необхідним уточненням українською.
- source_word: ἀνεῖλεν
  choice: повбивав
  rationale: Дієслово означає вбити; префіксальна форма природно узгоджується з множинним об’єктом і підкреслює сукупність жертв.
- source_word: πάντας τοὺς παῖδας
  choice: усіх хлопчиків
  rationale: У контексті пошуку хлопчика παῖδας стосується дітей чоловічої статі; «хлопчиків» передає це стисло й точно.
- source_word: ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς
  choice: у Вифлеємі та в усіх його околицях
  rationale: ὅρια тут означає прилеглу територію, тому «околиці» звучить природніше й точніше за буквальні «межі».
- source_word: ἀπὸ διετοῦς καὶ κατωτέρω
  choice: дворічних і молодших
  rationale: 'Природно передає включну верхню вікову межу: від дворічних до молодших дітей.'
- source_word: κατὰ τὸν χρόνον ὃν ἠκρίβωσεν
  choice: відповідно до часу, який точно з’ясував
  rationale: Зберігає значення відповідності часовим відомостям і нюанс точного встановлення, виражений ἀκριβόω.
theological_decisions:
- issue: Передача μάγοι
  choice: маги
  alternative: мудреці
  rationale: «Маги» точніше зберігає історико-культурну назву відвідувачів, тоді як традиційний відповідник «мудреці» подано для орієнтації читача в примітці.
- issue: Передача ἐνεπαίχθη
  choice: ошукали
  alternative: поглузували з нього
  rationale: Контекстуально йдеться про те, що маги не виконали очікування Ірода і виставили його обдуреним; буквальніше можливе значення збережено в примітці, щоб не приховувати лексичної напруги.
translation_notes:
  register: Сучасна стандартна українська мова; виклад прямий, гідний і зрозумілий. Синтаксис дещо розділено для природності, а зміст грецьких дієприкметникових конструкцій збережено.
