  to: '«У Рамі почувся голос — плач і велике голосіння: Рахіль плаче за своїми дітьми й не хотіла прийняти втіху[a], бо їх немає[b]».'
  rationale: 'Виправлено лише відтворення οὐκ ἤθελεν παρακληθῆναι та пов’язану з ним примітку: «не хотіла прийняти втіху» передає минулий час, небажання й отримання втіхи, не нав’язуючи сильнішого значення «відмовилася». Решту тексту збережено, оскільки він точний, природний і не звужує багатозначний образ Рахілі.'
