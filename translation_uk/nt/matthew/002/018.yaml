base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/018.yaml
  text: 'A voice was heard in Ramah[a], weeping and great mourning: Rachel weeping for her children, and she was not willing to be comforted[c][b], because they are no more.'
translation:
  language: uk
  text: '«У Рамі почувся голос — плач і велике голосіння: Рахіль плаче за своїми дітьми й не хотіла прийняти втіху[a], бо їх немає[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «не хотіла, щоб її втішили».'
    reason: Лексична й синтаксична альтернатива до οὐκ ἤθελεν παρακληθῆναι; зберігає минулий час небажання та пасивне значення «бути втішеною».
  - marker: b
    text: 'Буквально: «бо вони не є».'
    reason: Пояснює гранично стислу форму грецького вислову ὅτι οὐκ εἰσίν.
lexical_decisions:
- source_word: Φωνὴ ἐν Ῥαμὰ ἠκούσθη
  choice: У Рамі почувся голос
  rationale: Природний український відповідник, що зберігає місце дії, пасивний зміст ἠκούσθη і пророчий образ голосу.
- source_word: κλαυθμὸς καὶ ὀδυρμὸς πολύς
  choice: плач і велике голосіння
  rationale: «Плач» передає κλαυθμός, а «велике голосіння» — підсилене πολύς слово ὀδυρμός, не стираючи різниці між двома близькими поняттями.
- source_word: Ῥαχὴλ κλαίουσα τὰ τέκνα αὐτῆς
  choice: Рахіль плаче за своїми дітьми
  rationale: Теперішній час природно передає тривалу дію дієприкметника κλαίουσα; τέκνα є загальним словом «діти», без звуження до синів.
- source_word: οὐκ ἤθελεν παρακληθῆναι
  choice: не хоче втішитися
  rationale: Вислів зберігає значення небажання у θέλω та пасивно-результативний сенс παρακληθῆναι, не посилюючи його до категоричної відмови.
- source_word: ὅτι οὐκ εἰσίν
  choice: бо їх немає
  rationale: Близько відтворює стислий і різкий грецький вислів, не додаючи прямо слів «померли» чи «їх більше немає».
theological_decisions:
- issue: Образ Рахілі в цитаті з Єремії
  choice: Збережено Рахіль як материнську й пророчу постать без пояснення символіки в основному тексті.
  alternative: Прямо назвати Рахіль символом матерів Ізраїлю або подати її лише як буквальну історичну матір.
  rationale: Грецький текст просто відтворює персоніфікований образ; переклад не має усувати його типологічну багатозначність.
translation_notes:
  register: Сучасна літературна українська з урочистим, але зрозумілим регістром. Назву Рама й ім’я Рахіль подано за усталеною українською біблійною традицією; двокрапка зберігає структуру пророчої цитати.
