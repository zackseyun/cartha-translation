  text: Тоді він устав, узяв дитину та її матір і ввійшов до землі Ізраїлю.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Тож
  rationale: Сполучник позначає продовження розповіді з відтінком наслідку, а не сильне протиставлення.
- source_word: ἐγερθεὶς
  choice: устав
  rationale: 'Аористовий пасивний дієприкметник тут має неперехідне значення й передає дію, що передує наступній: «устав».'
- source_word: παρέλαβε
  choice: узяв
  rationale: У контексті παραλαμβάνω означає взяти когось із собою; стислий відповідник «узяв» природно звучить у розповіді.
- source_word: τὸ παιδίον
  choice: Дитину
  rationale: παιδίον прямо означає дитину; велика літера позначає конкретну Дитину в усталеному біблійному викладі, не додаючи окремого титулу.
- source_word: τὴν μητέρα αὐτοῦ
  choice: Його матір
  rationale: Займенник αὐτοῦ найприродніше стосується Дитини; український присвійний займенник зберігає цей зв’язок.
- source_word: εἰσῆλθεν
  choice: прибув до
  rationale: У поєднанні з назвою країни εἰσέρχομαι природно передається українською як прибуття до неї; буквальне «увійшов у землю» звучало б менш природно.
- source_word: εἰς γῆν Ἰσραήλ
  choice: до землі Ізраїлю
  rationale: Вислів зберігає географічно-національне значення грецької конструкції без ототожнення з конкретною адміністративною областю.
