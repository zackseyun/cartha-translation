    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ
  choice: Та почувши
  rationale: Аористовий дієприкметник передає попередню обставину, а δέ позначає поворот у розповіді. «Та почувши» природно пов’язує вірш із попереднім наміром Йосипа.
- source_word: βασιλεύει τῆς Ἰουδαίας
  choice: в Юдеї ... царює
  rationale: «Царює» зберігає царський відтінок βασιλεύω; українська конструкція «царює в Юдеї» звучить природніше за буквальне «царює над Юдеєю».
- source_word: ἀντὶ τοῦ πατρὸς αὐτοῦ Ἡρῴδου
  choice: замість свого батька Ірода
  rationale: ἀντί виражає заміну або наступництво. «Замість» стисло й точно передає це значення, не додаючи прямо не висловленого дієслова «успадкував».
- source_word: ἐφοβήθη ἐκεῖ ἀπελθεῖν
  choice: він побоявся йти туди
  rationale: Ідіоматична українська конструкція, яка точно передає страх перед тим, щоб вирушити до Юдеї.
- source_word: χρηματισθεὶς
  choice: отримавши ... застереження
  rationale: Дієслово в цьому контексті означає одержати застереження чи вказівку, зазвичай божественного походження. Формулювання зберігає невираженого діяча.
- source_word: κατ’ ὄναρ
  choice: уві сні
  rationale: Природний і усталений український відповідник Матвієвого вислову про одержане під час сну одкровення.
- source_word: ἀνεχώρησεν
  choice: відійшов
  rationale: Передає цілеспрямоване віддалення у відповідь на небезпеку, не посилюючи значення до «втік».
- source_word: εἰς τὰ μέρη τῆς Γαλιλαίας
  choice: у землі Галилеї
  rationale: Множина μέρη позначає територію або місцевості. «Землі Галилеї» природно передає просторовий зміст без надмірно адміністративного відтінку.
theological_decisions:
- issue: Чи називати Бога безпосереднім джерелом застереження в χρηματισθείς
  choice: 'У головному тексті діяча не названо: «отримавши уві сні застереження».'
  alternative: «отримавши уві сні застереження від Бога» або «бувши попереджений Богом уві сні»
  rationale: У контексті Матвія дієслово звичайно вказує на божественне повідомлення, однак грецький текст цього вірша залишає діяча невираженим. Переклад зберігає цю граматичну й богословську стриманість.
translation_notes:
  register: Сучасна літературна українська з гідним біблійним регістром. Синтаксис наближений до грецького, але лишається природним; збережено кінцеву кому, оскільки вірш синтаксично продовжується у Матвія 2:23.
