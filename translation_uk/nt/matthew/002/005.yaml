base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/005.yaml
  text: And they said to him[a], “In Bethlehem of Judea[b], for thus it has been written through the prophet:”
translation:
  language: uk
  text: 'А вони сказали йому: «У Вифлеємі Юдеї, бо так написано[a] через пророка:»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «було написано». У грецькому тексті стоїть перфект пасивного стану — звична формула цитування Писання.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: А вони
  rationale: Артикль ужито субстантивовано щодо первосвященників і книжників із попереднього вірша; δέ передано легким сполучником «а», без надмірного підкреслення протиставлення.
- source_word: εἶπαν αὐτῷ
  choice: сказали йому
  rationale: Прямо й природно передає просте дієслово мовлення λέγω з непрямим додатком αὐτῷ.
- source_word: Ἐν Βηθλέεμ τῆς Ἰουδαίας
  choice: У Вифлеємі Юдеї
  rationale: Прийменник ἐν позначає місце, а родовий відмінок τῆς Ἰουδαίας уточнює, про який Вифлеєм ідеться. Така форма природна українською і близька до грецької будови.
- source_word: οὕτως γὰρ
  choice: бо так
  rationale: γάρ подає підставу відповіді, а οὕτως спрямовує читача до цитати, що починається далі.
- source_word: γέγραπται
  choice: написано
  rationale: Безособова пасивна форма «написано» є природною українською формулою цитування Писання й передає чинність написаного, властиву грецькому перфекту.
- source_word: διὰ τοῦ προφήτου
  choice: через пророка
  rationale: 'διά з родовим відмінком виражає посередництво: пророк постає тим, через кого було передано написане.'
theological_decisions:
- issue: Формула пророчого посередництва
  choice: через пророка
  alternative: пророком
  rationale: Варіант «через пророка» точніше зберігає значення διά з родовим відмінком і не усуває розрізнення між джерелом звістки та людським посередником.
- issue: Формула цитування Писання
  choice: написано
  alternative: було написано
  rationale: «Написано» є усталеною і природною формулою, що зберігає теперішню чинність записаного; буквальніше «було написано» може надмірно висунути на передній план минулу подію.
translation_notes:
  register: Сучасна літературна українська мова з помірно урочистим біблійним звучанням. Збережено безперервність прямої мови та двокрапку, оскільки далі йде пророча цитата.
