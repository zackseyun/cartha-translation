reference: Matthew 2:9
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες τοῦ βασιλέως ἐπορεύθησαν, καὶ ἰδοὺ ὁ ἀστὴρ ὃν εἶδον ἐν τῇ ἀνατολῇ προῆγεν αὐτούς, ἕως ἐλθὼν ⸀ἐστάθη ἐπάνω οὗ ἦν τὸ παιδίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/009.yaml
  text: After hearing the king[a], they went on their way, and behold, the star that they had seen in the east went before them until it came and stood over where the child was.
translation:
  language: uk
  text: Вислухавши царя, вони вирушили в дорогу. І ось зоря, яку вони бачили на сході[a], ішла попереду них, аж поки не прийшла й не зупинилася над тим місцем, де було дитя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «під час її сходження»; грецький вислів може означати як схід — місцевість або напрямок, так і сходження зорі.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσαντες τοῦ βασιλέως
  choice: Вислухавши царя
  rationale: Дієприкметниковий зворот передає попередню щодо головної дії подію; родовий відмінок при ἀκούω позначає особу, яку слухали. «Вислухавши» природно передає завершеність аориста, не додаючи імені Ірода.
- source_word: ἐπορεύθησαν
  choice: вони вирушили в дорогу
  rationale: Передає рух і відхід після розмови з царем природною сучасною українською мовою.
- source_word: ἰδοὺ
  choice: І ось
  rationale: Зберігає дискурсивний маркер, який привертає увагу до несподіваної появи зорі.
- source_word: ἀστήρ
  choice: зоря
  rationale: Звичний український відповідник для небесного світила в біблійному оповідному стилі.
- source_word: ὃν εἶδον
  choice: яку вони бачили
  rationale: Природно передає попереднє спостереження зорі без потреби додатково маркувати давноминулий час.
- source_word: ἐν τῇ ἀνατολῇ
  choice: на сході
  rationale: Зберігає поширене географічне розуміння вислову; можливе астрономічне значення «під час її сходження» подано у примітці.
- source_word: προῆγεν αὐτούς
  choice: ішла попереду них
  rationale: Передає буквальний образ зорі, що рухається перед мандрівниками, не уточнюючи механізму її проводу.
- source_word: ἕως ἐλθὼν ἐστάθη
  choice: аж поки не прийшла й не зупинилася
  rationale: Відтворює послідовність прибуття та зупинки, виражену дієприкметником і особовою формою дієслова.
- source_word: ἐπάνω οὗ ἦν
  choice: над тим місцем, де було
  rationale: Ясно передає розташування над місцем, не приписуючи зорі більшої просторової точності, ніж у грецькому тексті.
- source_word: τὸ παιδίον
  choice: дитя
  rationale: Точно й стисло передає παιδίον у гідному оповідному регістрі без додаткового наголосу на віці.
theological_decisions:
- issue: Значення ἐν τῇ ἀνατολῇ в оповіді про зорю
  choice: на сході
  alternative: під час її сходження
  rationale: Грецький вислів може позначати як схід як напрямок або місцевість, так і сходження небесного світила. Основний текст подає традиційне й природне географічне прочитання, а справжню лексичну неоднозначність зберігає примітка.
translation_notes:
  register: Сучасна стандартна українська мова з гідним оповідним звучанням. «І ось» зберігає жвавість грецької розповіді; синтаксис залишається доступним для широкого кола читачів. Маркер примітки поставлено безпосередньо після неоднозначного вислову «на сході».
