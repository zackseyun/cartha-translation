  text: ἀκούσας δὲ ⸂ὁ βασιλεὺς Ἡρῴδης⸃ ἐταράχθη καὶ πᾶσα Ἱεροσόλυμα μετ’ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/003.yaml
  text: When King Herod heard this[a], he was troubled[b], and all Jerusalem with him.
translation:
  language: uk
  text: Почувши це, цар Ірод стривожився[a], а з ним і весь Єрусалим[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «занепокоївся» чи «був збентежений».'
    reason: lexical_alternative
  - marker: b
    text: Вислів «весь Єрусалим» уживає назву міста на позначення його мешканців; це може бути загальним або гіперболічним описом тривоги, що охопила місто.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: Почувши це
  rationale: Аористовий дієприкметник має часову функцію. Українське «почувши» природно передає попередню дію, а «це» відтворює зрозумілий із найближчого контексту зміст почутого — звістку мудреців.
- source_word: δὲ
  choice: а
  rationale: Частка δέ є м’яким сполучником, що продовжує розповідь. «А» природно позначає перехід до реакції Ірода, не надаючи тексту надмірно сильного протиставлення.
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: цар Ірод
  rationale: Звичний і природний український порядок слів, який зберігає титул βασιλεύς та усталену форму імені.
- source_word: ἐταράχθη
  choice: стривожився
  rationale: Аорист пасивної форми від ταράσσω позначає внутрішнє збентеження, тривогу або сильне занепокоєння. «Стривожився» природно передає цей стан українською без уточнення його причини чи міри.
- source_word: πᾶσα Ἱεροσόλυμα
  choice: весь Єрусалим
  rationale: Збережено грецьку метонімію, де назва міста представляє його мешканців, без доданого в основний текст пояснення «усі жителі».
- source_word: μετ’ αὐτοῦ
  choice: з ним
  rationale: Прямо й природно передає μετά з родовим відмінком та пов’язує тривогу Єрусалима з реакцією Ірода.
theological_decisions:
- issue: Обсяг значення πᾶσα Ἱεροσόλυμα
  choice: Корпоративне, метонімічне позначення Єрусалима та його мешканців, які стривожилися разом з Іродом
  alternative: Узагальнений або гіперболічний вислів про багатьох мешканців; можлива особлива увага до керівних кіл міста
  rationale: Грецький текст називає ціле місто і не звужує твердження до певної групи. Основний текст зберігає цю широту й риторичну напругу, а примітка вказує на можливий узагальнений або гіперболічний характер вислову.
translation_notes:
  register: Сучасна нормативна українська мова; виклад стислий, природний і гідний. Збережено метонімію оригіналу та не уточнено, які саме групи мешканців Єрусалима маються на увазі.
