lexical_decisions:
- source_word: ἰδόντες
  choice: Побачивши
  rationale: Аористовий дієприкметник виражає дію, що передує головній; український дієприслівник природно й стисло зберігає цей зв’язок.
- source_word: δὲ
  choice: не передано окремим словом
  rationale: Це слабкий оповідний сполучник; у сучасній українській зв’язність розповіді тут природно передається без окремого «і» чи «а».
- source_word: τὸν ἀστέρα
  choice: зорю
  rationale: Йдеться про конкретну зорю, вже відому з контексту. Українська мова не має артикля; означеність забезпечує контекст.
- source_word: ἐχάρησαν
  choice: зраділи
  rationale: Форма має активне за значенням значення «зраділи»; доконаний вид природно передає аористову подію.
- source_word: χαρὰν μεγάλην σφόδρα
  choice: надзвичайно зраділи
  rationale: Грецький споріднений додаток разом із μεγάλην і σφόδρα створює сильне нагромаджене підсилення. Природний український прислівниковий вислів передає його без неприродного «зраділи великою радістю».
