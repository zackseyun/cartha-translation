base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/013.yaml
  text: After they had departed[a], behold, an angel of the Lord appeared to Joseph in a dream, saying, “Get up, take the child and his mother, and flee to Egypt, and stay there until I tell you[c][b]; for Herod is about to seek the child in order to destroy him.”
translation:
  language: uk
  text: 'Після того як вони відійшли, ось ангел Господній з’явився Йосипові уві сні й сказав: «Встань, візьми дитину та її матір і тікай до Єгипту. Залишайся там, доки Я не скажу тобі, бо Ірод збирається шукати дитину, щоб погубити її[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «вбити». Грецьке слово буквально має значення «погубити, знищити», а тут ідеться про спричинення смерті.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναχωρησάντων δὲ αὐτῶν
  choice: Коли вони відійшли
  rationale: Генитив абсолютний позначає попередню щодо головної дії подію; вислів природно передає часову послідовність. Займенник стосується згаданих у контексті мудреців.
- source_word: ἰδοὺ
  choice: ось
  rationale: Зберігає виразний оповідний маркер Матвія й природно звучить сучасною українською.
- source_word: ἄγγελος κυρίου
  choice: ангел Господній
  rationale: Грецький іменник без артикля не вимагає означеності; українська конструкція без артиклів природно зберігає цю невизначеність, а прикметник «Господній» точно передає належність Господу.
- source_word: φαίνεται κατ’ ὄναρ τῷ Ἰωσὴφ
  choice: з’явився Йосипові уві сні
  rationale: Історичний теперішній час природно передано минулим часом; κατ’ ὄναρ є сталим висловом зі значенням «уві сні».
- source_word: λέγων
  choice: й сказав
  rationale: Дієприкметник, що вводить пряму мову, природно відтворено особовою формою дієслова.
- source_word: Ἐγερθεὶς
  choice: Встань
  rationale: У послідовності наказів дієприкметник має спонукальну силу; «Встань» стисло й гідно передає її.
- source_word: παράλαβε
  choice: візьми
  rationale: У контексті означає взяти із собою; додатки роблять цей зміст зрозумілим без розширення.
- source_word: τὸ παιδίον
  choice: Дитя
  rationale: Передає малу дитину й узгоджується з піднесеним, але зрозумілим біблійним регістром; велика літера вказує на конкретне Дитя в контексті, не додаючи нового титулу.
- source_word: τὴν μητέρα αὐτοῦ
  choice: Його матір
  rationale: Займенник природно стосується Дитяти; український вислів стислий і недвозначний.
- source_word: φεῦγε εἰς Αἴγυπτον
  choice: втікай до Єгипту
  rationale: Дієслово передає термінову втечу від небезпеки.
- source_word: ἴσθι ἐκεῖ
  choice: Залишайся там
  rationale: Буквально «будь там», але в контексті наказ стосується тривалого перебування.
- source_word: ἕως ἂν εἴπω σοι
  choice: доки Я не скажу тобі
  rationale: Конструкція задає невизначену майбутню межу перебування; український відповідник природний і точний.
- source_word: μέλλει ... ζητεῖν
  choice: ось-ось шукатиме
  rationale: Передає близький намір або неминучість майбутньої дії, не зводячи μέλλει до простого майбутнього часу.
- source_word: τοῦ ἀπολέσαι αὐτό
  choice: щоб Його погубити
  rationale: Інфінітив із τοῦ виражає мету; «погубити» зберігає ширше лексичне значення ἀπόλλυμι, яке тут у контексті означає спричинити смерть.
theological_decisions:
- issue: Передача κύριος у вислові ἄγγελος κυρίου
  choice: Господній
  alternative: пана / володаря
  rationale: У цій біблійній формулі κύριος стосується Бога; «ангел Господній» є природним українським відповідником і не визначає понад текст, чи йдеться про певного, раніше відомого ангела.
- issue: Ступінь означеності ἄγγελος κυρίου
  choice: ангел Господній без додаткового означального займенника
  alternative: той ангел Господній
  rationale: У грецькому тексті перед ἄγγελος немає артикля. Оскільки українська не має артиклів, нейтральна форма зберігає можливу невизначеність і не нав’язує тотожності з окремою постаттю.
- issue: Значення ἀπολέσαι щодо наміру Ірода
  choice: погубити
  alternative: вбити
  rationale: Контекст ясно вказує на намір убивства, однак «погубити» ближче зберігає формальну широту грецького дієслова; примітка подає ясніший контекстуальний відповідник.
translation_notes:
  register: Сучасна нормативна українська з гідним біблійним звучанням. Збережено Матвіїв оповідний маркер «ось» і терміновість наказів. Займенники щодо Дитяти та слова ангела написано з великої літери як шанобливу українську видавничу конвенцію; це не додає окремого богословського твердження.
