  text: Truly I tell you[b][a], you will certainly not get out of there until you have paid the last quadrans.
translation:
  language: uk
  text: 'Істинно кажу тобі: ти нізащо не вийдеш звідти, доки не сплатиш останній кодрант.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Кодрант — дрібна римська монета.
    reason: cultural_note
lexical_decisions:
- source_word: ἀμὴν
  choice: Істинно
  rationale: У синоптичній формулі це слово є урочистим підтвердженням правдивості й авторитетності наступних слів. «Істинно» природно передає цю функцію, не перетворюючи вислів на літургійне «амінь».
- source_word: λέγω σοι
  choice: кажу тобі
  rationale: Прямо й природно відтворює особове звернення та авторитетний тон вислову.
- source_word: οὐ μὴ ἐξέλθῃς
  choice: ти нізащо не вийдеш
  rationale: Сполука οὐ μή з аористом кон’юнктива виражає сильне заперечення. «Нізащо не вийдеш» зберігає його наголос у сучасній українській мові.
- source_word: ἐκεῖθεν
  choice: звідти
  rationale: Точно передає рух від зазначеного місця й природно поєднується з дієсловом «вийдеш».
- source_word: ἕως ἂν ἀποδῷς
  choice: доки не сплатиш
  rationale: Передає майбутню межу ув’язнення та завершеність виплати. «Сплатиш» природне в контексті боргу.
- source_word: τὸν ἔσχατον
  choice: останнього
  rationale: Передає повноту виплати — до останньої монети — без доданого підсилення, якого немає в грецькому тексті.
- source_word: κοδράντην
  choice: кодранта
  rationale: Збережено назву конкретної дрібної римської монети, а не підставлено сучасний чи історично чужий грошовий відповідник; значення пояснено в примітці.
theological_decisions:
- issue: Чи слід тлумачно конкретизувати ув’язнення й виплату як остаточний суд, очищення або лише земний правовий сценарій
  choice: Збережено безпосередній образ ув’язнення за борг без доктринального уточнення.
  alternative: Виразно витлумачити вислів як метафору Божого суду, есхатологічного покарання або посмертного очищення.
  rationale: Грецький текст говорить про неможливість вийти до повної сплати боргу, але сам не визначає ширшого доктринального застосування. Переклад зберігає цю богословську напругу.
translation_notes:
  register: Сучасна нормативна українська мова з урочистим, але зрозумілим біблійним регістром. Формула «Істинно кажу тобі» зберігає гідність вислову, а «нізащо не вийдеш» природно передає особливо сильне грецьке заперечення.
