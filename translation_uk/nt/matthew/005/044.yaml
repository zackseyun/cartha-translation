  text: ἐγὼ δὲ λέγω ὑμῖν, ἀγαπᾶτε τοὺς ἐχθροὺς ⸀ὑμῶν καὶ προσεύχεσθε ὑπὲρ ⸀τῶν διωκόντων ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/044.yaml
  text: But I say to you[a], love your enemies and pray for those who persecute you.
translation:
  language: uk
  text: 'А Я кажу вам: любіть своїх ворогів і моліться за тих, хто вас переслідує.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: А Я кажу вам
  rationale: «А» природно передає протиставний δέ у формулах Нагірної проповіді; окремий займенник «Я» зберігає наголос грецького ἐγώ, а «кажу вам» близько й природно відтворює λέγω ὑμῖν.
- source_word: ἀγαπᾶτε
  choice: любіть
  rationale: Звичний наказовий відповідник ἀγαπάω; передає саму заповідь без надмірного уточнення тривалості дії або характеру любові.
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: своїх ворогів
  rationale: Природна українська конструкція при зверненні до підмета «ви»; «ворогів» прямо зберігає значення ἐχθρούς.
- source_word: προσεύχεσθε
  choice: моліться
  rationale: Стандартний і природний український відповідник προσεύχομαι в наказовому способі.
- source_word: ὑπὲρ
  choice: за
  rationale: У сполученні «молитися за когось» природно передає ὑπέρ із родовим відмінком у значенні молитви на користь цієї особи або про неї.
- source_word: τῶν διωκόντων ὑμᾶς
  choice: тих, хто вас переслідує
  rationale: Відтворює субстантивований дієприкметник і його теперішній, незавершений характер без важкої конструкції.
theological_decisions:
- issue: Обсяг заповіді щодо ворогів
  choice: Обидва накази передано прямо, без пояснювальних доповнень.
  alternative: Уточнити любов як доброзичливі вчинки або конкретизувати молитву як прохання про благословення, покаяння чи навернення.
  rationale: Грецький текст наказує любити ворогів і молитися за переслідувачів, але в цьому вірші не визначає вичерпно форм такої любові чи змісту молитви; переклад зберігає цю змістову напругу.
translation_notes:
  register: Сучасна стандартна українська мова; стислий, гідний і загальнозрозумілий біблійний стиль. Великою літерою в «Я» графічно підтримано виразний наголос ἐγώ; двокрапка природно вводить два накази.
