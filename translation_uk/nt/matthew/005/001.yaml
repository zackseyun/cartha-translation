lexical_decisions:
- source_word: Ἰδὼν
  choice: Побачивши
  rationale: Аористовий дієприкметник від ὁράω задає обставину головної дії. Українське «побачивши» природно зберігає дієприкметниковий зв’язок, хоча може дещо виразніше натякати на попередність дії; ширший часовий варіант подано у примітці.
- source_word: δὲ
  choice: — / ж
  rationale: δέ є слабким сполучним або перехідним елементом. Після першого дієприкметникового звороту його не відтворено окремо, а природний зв’язок оповіді передано часткою «ж» у наступному реченні без значення протиставлення.
- source_word: τοὺς ὄχλους
  choice: натовпи
  rationale: Збережено множину ὄχλους. «Натовпи» — сучасний і зрозумілий відповідник без архаїчного відтінку слова «множество».
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: піднявся на гору
  rationale: Конструкція позначає рух угору до гори або на неї. «Піднявся на гору» природно звучить українською та не надає оповіді зайво урочистого стилю.
- source_word: τὸ ὄρος
  choice: гору
  rationale: ὄρος може означати гору або гірську місцевість. Основний текст зберігає традиційний і прямий відповідник «гора», не уточнюючи невідому топографію.
- source_word: καὶ καθίσαντος αὐτοῦ
  choice: Коли ж він сів
  rationale: Родовий абсолют передає часову або супровідну обставину. «Коли він сів» природно відтворює цей зв’язок, не наполягаючи на суворій послідовності «після того як».
- source_word: προσῆλθαν αὐτῷ
  choice: до нього підійшли
  rationale: προσέρχομαι означає наближатися або приходити до когось. «Підійшли» стисло й природно передає фізичне наближення учнів.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: його учні
  rationale: μαθηταί позначає учнів і послідовників учителя. «Його учні» є усталеним, точним і зрозумілим відповідником.
theological_decisions:
- issue: Означеність τὸ ὄρος
  choice: на гору
  alternative: на якусь гору; на схил
  rationale: Грецький текст уживає означений артикль. В українській означеність не має окремого артикля, тому природна форма «на гору» не ідентифікує конкретної названої гори, але й не вводить неозначеного «якусь».
- issue: Часове значення καθίσαντος αὐτοῦ
  choice: коли він сів
  alternative: після того як він сів
  rationale: Родовий абсолют установлює часовий або обставинний зв’язок, проте сам по собі не вимагає наголосу на суворій наступності. Обраний варіант також не додає богословського значення сидячій позі вчителя.
translation_notes:
  register: Сучасна літературна українська мова, проста й гідна оповідна манера. Збережено множину «натовпи», звичайний біблійний термін «учні» та часову неоднозначність грецької конструкції; уникнуто архаїзмів і конфесійно навантажених уточнень.
