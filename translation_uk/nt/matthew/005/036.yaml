  text: μήτε ἐν τῇ κεφαλῇ σου ὀμόσῃς, ὅτι οὐ δύνασαι μίαν τρίχα λευκὴν ⸂ποιῆσαι ἢ μέλαιναν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/036.yaml
  text: Nor shall you swear by your head[a], because you are not able to make one hair white or black.
translation:
  language: uk
  text: І не клянися своєю головою, бо ти не можеш зробити навіть одну волосину білою чи чорною.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μήτε
  choice: І ... не
  rationale: Продовжує узгоджений ряд заборон із попереднього контексту; ця конструкція природно передає зв’язок у сучасній українській.
- source_word: ἐν τῇ κεφαλῇ σου
  choice: головою своєю
  rationale: При ὀμόσῃς прийменникова конструкція позначає те, чим клянуться; українське «клястися головою» зберігає образ і зміст вислову.
- source_word: ὀμόσῃς
  choice: не клянися
  rationale: Аорист кон’юнктива з μήτε має заборонне значення; наказова форма природно й безпосередньо передає його українською.
- source_word: ὅτι
  choice: бо
  rationale: Вводить причину заборони; «бо» стисло й природно зберігає причинний зв’язок.
- source_word: οὐ δύνασαι
  choice: ти не можеш
  rationale: Точно передає людську неспроможність, виражену дієсловом δύναμαι.
- source_word: μίαν τρίχα
  choice: жодної волосини
  rationale: У сфері заперечення українське «жодної» природно виражає наголос на неможливості змінити навіть одну волосину.
- source_word: λευκὴν ... ἢ μέλαιναν
  choice: білою чи чорною
  rationale: Зберігає прямий контраст основних колірних позначень грецького тексту без тлумачного звуження до сивини.
- source_word: ποιῆσαι
  choice: зробити
  rationale: У цій конструкції означає спричинити певний стан; «зробити ... білою чи чорною» є точним і зрозумілим відповідником.
theological_decisions:
- issue: Характер заборони клятви
  choice: Передати безпосередню заборону клястися своєю головою, не розширюючи її до доктринального твердження про всі можливі клятви.
  alternative: Тлумачити вислів або як абсолютну заборону кожної клятви, або лише як осуд маніпулятивних та обхідних формул клятви.
  rationale: Сам вірш конкретно говорить про клятву головою та обґрунтовує заборону обмеженістю людської влади. Переклад зберігає формулювання й богословську напругу тексту.
translation_notes:
  register: Сучасна стандартна українська мова; вислів стислий, гідний і доступний. Збережено біблійний образ клятви головою та природний український порядок слів.
