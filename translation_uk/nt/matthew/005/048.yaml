id: MAT.5.48
reference: Matthew 5:48
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Ἔσεσθε οὖν ὑμεῖς τέλειοι ⸀ὡς ὁ πατὴρ ὑμῶν ὁ ⸀οὐράνιος τέλειός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/048.yaml
  text: You[a], therefore, shall be perfect, as your heavenly Father is perfect.
translation:
  language: uk
  text: Тож будьте досконалі[a], як досконалий ваш Небесний Отець.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «цілісні», «повні» чи «зрілі». Грецьке τέλειος може означати не лише досконалість, а й повноту, цілісність або зрілість.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔσεσθε
  choice: будьте
  rationale: Форма майбутнього часу в цьому контексті має наказово-закличну силу; український наказовий спосіб природно й виразно передає цю вимогу.
- source_word: οὖν
  choice: тож
  rationale: Передає висновок із попередньої настанови про любов до ворогів і природно звучить на початку українського речення.
- source_word: ὑμεῖς
  choice: ви (виражено формою «будьте»)
  rationale: Особовий зміст грецького займенника передано формою другої особи множини; окреме «ви» в українській зробило б вислів важчим без істотної смислової користі.
- source_word: τέλειοι / τέλειός
  choice: досконалі / досконалий
  rationale: Збережено повтор того самого грецького слова та силу порівняння. «Досконалий» є прямим відповідником, а ширший відтінок цілісності й зрілості зазначено у примітці.
- source_word: ὡς
  choice: як
  rationale: Стисло й природно вводить порівняння.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: ваш Небесний Отець
  rationale: Природний український порядок слів; велика літера позначає звернення до Бога як Отця, не додаючи нового змісту.
theological_decisions:
- issue: Значення τέλειος в етичній настанові
  choice: У головному тексті — «досконалий», із приміткою про значення «цілісний», «повний» і «зрілий».
  alternative: цілісний; повний; зрілий
  rationale: «Досконалий» зберігає пряму лексичну відповідність і гостроту заклику. Примітка не дозволяє звузити багатозначне τέλειος лише до абстрактної безгрішності й зберігає зв’язок із повнотою любові в безпосередньому контексті.
translation_notes:
  register: Сучасна літературна українська з урочистим, але зрозумілим звучанням. Лаконічну паралельність грецького вислову та повтор «досконалі / досконалий» збережено.
