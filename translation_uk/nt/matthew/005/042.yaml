  source_fidelity: 'Переклад точно передає обидва накази: τῷ αἰτοῦντί σε відповідає «тому, хто просить у тебе», δός — «дай», а заборона μὴ ἀποστραφῇς передана прямо як «не відвертайся». Конструкція «хто хоче позичити в тебе» правильно відтворює τὸν θέλοντα ἀπὸ σοῦ δανίσασθαι, не додаючи невказаного предмета позики.'
  naturalness: Текст звучить природно в сучасній стандартній українській. Порядок слів «Тому, хто просить у тебе, дай» є виразним і нормативним; «від того … не відвертайся» зберігає образ оригіналу та лишається зрозумілим.
  terminology: «Просить», «дай», «позичити в тебе» і «не відвертайся» є точними, нейтральними та стилістично відповідними відповідниками. «Позичити в тебе» однозначно означає взяти в позику, як цього вимагає контекст грецького δανίσασθαι.
