  text: τῷ αἰτοῦντί σε ⸀δός, καὶ τὸν θέλοντα ἀπὸ σοῦ δανίσασθαι μὴ ἀποστραφῇς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/042.yaml
  text: Give to the one who asks you[a], and do not turn away from the one who wants to borrow from you.
translation:
  language: uk
  text: Тому, хто просить у тебе, дай, і від того, хто хоче позичити в тебе, не відвертайся.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «не відмовляй тому, хто хоче позичити в тебе».'
    reason: 'Лексична альтернатива: ἀποστραφῇς буквально зберігає образ «відвертатися», але в контексті може означати «відмовляти».'
lexical_decisions:
- source_word: αἰτοῦντί
  choice: тому, хто просить
  rationale: Артикльований дієприкметник ужито субстантивовано й узагальнено; цей вислів природно передає особу, яка звертається з проханням.
- source_word: δός
  choice: дай
  rationale: Аористовий наказовий спосіб δίδωμι передає прямий наказ без доданого модального відтінку.
- source_word: θέλοντα
  choice: того, хто хоче
  rationale: Субстантивований дієприкметник теперішнього часу природно передано конструкцією з «хоче».
- source_word: ἀπὸ σοῦ
  choice: в тебе
  rationale: У сполученні з дієсловом «позичити» сучасна українська нормативно й природно позначає джерело конструкцією «позичити в когось».
- source_word: δανίσασθαι
  choice: позичити
  rationale: Інфінітив у цьому контексті означає взяти щось у позику; додавати «гроші» не слід, бо предмет у грецькому тексті не названо.
- source_word: μὴ ἀποστραφῇς
  choice: не відвертайся
  rationale: Заборонна конструкція передає прямий наказ і зберігає образ відвертання, не звужуючи його до самого лише словесного відмовляння.
theological_decisions:
- issue: Обсяг і сила етичного наказу Ісуса
  choice: Передати як прямі, загальні накази без пом’якшення чи додаткових обмежень.
  alternative: Звузити наказ до певних гідних прохачів або витлумачити «не відвертайся» лише як «не відмовляй».
  rationale: Грецький текст формулює два безпосередні накази й не встановлює тут додаткових умов; переклад не повинен їх привносити.
translation_notes:
  register: Сучасна стандартна українська; прямий, гідний і зрозумілий виклад. Перестановка «дай» після підрядної конструкції природна українською та зберігає наголос на адресатові наказу.
