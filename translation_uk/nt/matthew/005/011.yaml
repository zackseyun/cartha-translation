  text: μακάριοί ἐστε ὅταν ὀνειδίσωσιν ὑμᾶς καὶ διώξωσιν καὶ εἴπωσιν πᾶν ⸀πονηρὸν καθ’ ὑμῶν ψευδόμενοι ἕνεκεν ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/011.yaml
  text: Blessed are you when they insult you and persecute you and falsely say every kind of evil against you because of me[a][b][c].
translation:
  language: uk
  text: Блаженні ви, коли вас ображають[a] і переслідують та неправдиво говорять про вас усяке лихе[b] через Мене[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «ганьблять вас».'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «кажуть проти вас усе лихе».'
    reason: lexical_alternative
  - marker: c
    text: 'Або: «заради Мене».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοί ἐστε
  choice: Блаженні ви
  rationale: Зберігає впізнавану формулу блаженства та її богословську вагу; «щасливі» могло б надмірно звузити вислів до емоційного стану.
- source_word: ὅταν
  choice: коли
  rationale: Природно передає загальну майбутню обставину, виражену грецькою конструкцією із суб’юнктивом.
- source_word: ὀνειδίσωσιν ὑμᾶς
  choice: вас ображають
  rationale: Ясно й сучасно передає словесну наругу або ганьблення, не звужуючи її до офіційного звинувачення.
- source_word: διώξωσιν
  choice: переслідують
  rationale: Передає широку ворожу протидію через належність до Ісуса, не обмежуючи її фізичним насильством.
- source_word: εἴπωσιν πᾶν πονηρὸν καθ’ ὑμῶν
  choice: кажуть проти вас усяке зло
  rationale: Досить формально відтворює широту πᾶν πονηρόν і спрямованість κατά з родовим відмінком, не уточнюючи виду злого висловлювання.
- source_word: ψευδόμενοι
  choice: неправдиво
  rationale: Природне прислівникове відтворення обставинного дієприкметника; виразно вказує, що сказане зло є неправдою.
- source_word: ἕνεκεν ἐμοῦ
  choice: через Мене
  rationale: 'Безпосередньо передає причинний зв’язок: ворожість виникає через належність людей до Ісуса.'
theological_decisions:
- issue: Характер описаної ворожості
  choice: Вірш охоплює образи, переслідування та неправдиві злі висловлювання через Ісуса, не звужуючи переслідування до конкретної правової, фізичної чи суспільної форми.
  alternative: Обмежити переслідування лише фізичним насильством або лише наклепом.
  rationale: Три скоординовані дієслівні вислови описують різні прояви ворожості; переклад зберігає цю широту.
- issue: Підстава блаженства
  choice: Формулу «Блаженні ви» збережено без пояснення механізму або часу благословення.
  alternative: Перекласти як «Ви будете благословенні» або пояснити блаженство лише як майбутню нагороду.
  rationale: Грецький текст прямо проголошує теперішній статус адресатів і не додає такого часового чи доктринального уточнення.
translation_notes:
  register: Сучасна стандартна українська з гідним біблійним звучанням. Усталене «Блаженні ви» поєднано із загальнозрозумілими дієсловами; синтаксичний паралелізм трьох проявів ворожості збережено. Займенник «Мене» написано з великої літери відповідно до поширеної української біблійної видавничої практики.
