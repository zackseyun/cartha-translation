  terminology: «Блаженні», «переслідують» і «через Мене» доречні для біблійного регістру й не вносять додаткових доктринальних уточнень. «Усяке лихе» тут є природним відповідником субстантивованого πᾶν πονηρόν; воно не звужує значення лише до юридичного наклепу.
