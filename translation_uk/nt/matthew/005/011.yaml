  source_fidelity: 'Основний зміст передано точно: μακάριοί ἐστε — «Блаженні ви», три прояви ворожості збережено, ψευδόμενοι належно передано прислівником «неправдиво», а ἕνεκεν ἐμοῦ — «через Мене». Проте вислів «кажуть проти вас усяке зло» є надто калькованим для сучасної української і нечітко передає саме злі висловлювання про адресатів.'
