reference: Matthew 5:19
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ὃς ἐὰν οὖν λύσῃ μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων καὶ διδάξῃ οὕτως τοὺς ἀνθρώπους, ἐλάχιστος κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν· ὃς δ’ ἂν ποιήσῃ καὶ διδάξῃ, οὗτος μέγας κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/019.yaml
  text: Therefore[a], whoever relaxes one of the least of these commandments and teaches others to do so will be called least in the kingdom of heaven; but whoever does them and teaches them[b], this one will be called great in the kingdom of heaven.
translation:
  language: uk
  text: Отже, хто послабить[a] одну з найменших із цих заповідей і так навчатиме людей, той буде названий найменшим у Царстві Небесному; а хто виконає їх і навчатиме їх, той буде названий великим у Царстві Небесному.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «скасує», «відкине» чи «порушить». Грецьке дієслово буквально означає «розв’яже»; тут воно стосується послаблення або усунення обов’язкової сили заповіді.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Отже
  rationale: Передає висновковий зв’язок із попереднім твердженням про тривалу чинність Закону.
- source_word: λύσῃ
  choice: скасує
  rationale: У контексті заповідей λύω означає послабити їхню обов’язковість, усунути або визнати нечинними. «Скасує» природно передає юридичний відтінок, не зводячи значення лише до особистого порушення.
- source_word: μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων
  choice: одну з найменших цих заповідей
  rationale: Зберігає належність однієї заповіді до категорії найменших серед згаданих заповідей та природний український порядок слів.
- source_word: διδάξῃ οὕτως τοὺς ἀνθρώπους
  choice: так навчатиме людей
  rationale: οὕτως відсилає до попередньої дії — скасування заповіді; «людей» точно й природно передає загальне значення ἀνθρώπους без обмеження чоловічою статтю.
- source_word: ἐλάχιστος κληθήσεται
  choice: буде названий найменшим
  rationale: Прямо передає майбутній пасив κληθήσεται і найвищий ступінь ἐλάχιστος, не додаючи висновку про виключення з Царства.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: у Царстві Небесному
  rationale: Усталений і природний український відповідник характерного для Матвія вислову.
- source_word: ποιήσῃ καὶ διδάξῃ
  choice: виконає їх і навчатиме їх
  rationale: У контексті заповідей ποιέω природно означає виконувати їх; повторений займенник зберігає обидві координовані дії.
- source_word: οὗτος
  choice: той
  rationale: Українська корелятивна конструкція «хто… той» природно зберігає наголос демонстратива та контраст між двома особами.
- source_word: μέγας
  choice: великим
  rationale: Прямий відповідник μέγας, який зберігає протиставлення слову «найменшим» без перетворення його на технічний ранг.
theological_decisions:
- issue: Статус «найменшого/великого» в Царстві
  choice: Збережено порівняльний статус у Царстві без твердження про виключення чи про технічну систему нагород.
  alternative: Тлумачити «найменшим» як виключення з Царства або «великим» як визначений ранг небесної нагороди.
  rationale: Грецький текст каже «у Царстві Небесному» й не пояснює докладніше природу цього статусу; переклад не повинен усувати богословську напругу.
- issue: Обсяг значення τοὺς ἀνθρώπους
  choice: «людей» як загальне позначення осіб обох статей.
  alternative: «чоловіків» або «інших».
  rationale: У цьому контексті множина ἀνθρώπους має родове значення «люди»; сучасна українська форма точно передає референтний обсяг без непотрібної двозначності.
- issue: Значення λύσῃ щодо заповіді
  choice: «скасує», із приміткою про можливі відтінки послаблення чи порушення.
  alternative: Однозначно перекласти як «порушить» або «послабить».
  rationale: Дієслово допускає юридично-нормативний сенс усунення обов’язкової сили, але межа між скасуванням, послабленням і порушенням у цьому контексті не цілком механічна; примітка зберігає діапазон.
translation_notes:
  register: Сучасна нормативна українська мова з гідним біблійним регістром. Синтаксис «хто… той» природно відтворює грецьке οὗτος; ужито зрозуміле «людей» відповідно до загального значення ἀνθρώπους. Велика літера в назві «Царство Небесне» відповідає поширеній українській біблійній практиці.
