  source_fidelity: «Скасує» можливе в цьому нормативному контексті, але звужує діапазон λύσῃ до повного анулювання. «Послабить» точніше передає образне й контекстуальне значення дієслова — послабити чинність заповіді — не виключаючи інших відтінків у примітці. Уточнення «із цих заповідей» однозначно відтворює генітивну конструкцію «одну з найменших ... заповідей».
  naturalness: Виправлений порядок слів «одну з найменших із цих заповідей» є нормативним і природнішим за «одну з найменших цих заповідей». Решта тексту має природний сучасний біблійний регістр.
  terminology: «Царство Небесне», «заповіді», «найменшим» і «великим» вжито послідовно й доречно. «Людей» коректно передає родове τοὺς ἀνθρώπους. Формула «хто… той» належно передає наголошений οὗτος.
  issues:
  - severity: medium
    issue: Основний відповідник «скасує» для λύσῃ надто категорично означає анулювання.
    rationale: У цьому контексті λύω може означати послабити обов’язкову силу, відкинути або порушити заповідь. «Послабить» зберігає центральний образ і не розв’язує лексичну неоднозначність, тоді як альтернативи подано в примітці.
  - severity: low
    issue: Зворот «одну з найменших цих заповідей» стилістично менш ясний.
    rationale: «Одну з найменших із цих заповідей» чітко виражає, що йдеться про одну заповідь із групи найменших серед згаданих заповідей.
