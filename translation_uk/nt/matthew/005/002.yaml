lexical_decisions:
- source_word: καὶ
  choice: І
  rationale: Збережено простий сполучний характер καί без додавання виразнішого часового значення на кшталт «тоді».
- source_word: ἀνοίξας τὸ στόμα αὐτοῦ
  choice: відкривши уста
  rationale: Дієприкметникову конструкцію передано близько до форми оригіналу; вислів «відкрити уста» зберігає урочистий відтінок введення промови й природно звучить в українському біблійному стилі.
- source_word: ἐδίδασκεν
  choice: навчав
  rationale: Недоконаний вид передає тривалу або розгорнуту дію грецького імперфекта, не звужуючи її до значення «почав навчати».
- source_word: αὐτοὺς
  choice: їх
  rationale: Займенник залишено без уточнення його референта, оскільки сам вірш не називає прямо ані учнів, ані ширший натовп.
- source_word: λέγων
  choice: кажучи
  rationale: Збережено дієприкметниковий зв’язок, яким у грецькому тексті вводиться зміст навчання.
