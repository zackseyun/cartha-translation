  source_fidelity: '«І, відкривши уста, він навчав їх, кажучи:» точно передає всі складники грецького тексту: καί, аористовий дієприкметник ἀνοίξας, ідіому τὸ στόμα αὐτοῦ, імперфект ἐδίδασκεν, займенник αὐτούς і дієприкметник λέγων. «Навчав» належно зберігає імперфективний характер дії, не нав’язуючи значення початку дії.'
  naturalness: Фраза нормативна й зрозуміла в сучасній українській мові з помірно урочистим біблійним регістром. «Відкривши уста» є усталеним і природним у цьому регістрі відповідником формального вступу до промови. Явне «він» дещо підсилює ритм, але не є неприродним.
  terminology: «Уста» доречно зберігає біблійно-урочистий відтінок без втрати зрозумілості. «Навчав», «їх» і «кажучи» є точними та не вносять жодних конфесійних або контекстуально не засвідчених уточнень.
