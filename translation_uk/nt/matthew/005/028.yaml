id: MAT.5.28
reference: Matthew 5:28
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ βλέπων γυναῖκα πρὸς τὸ ἐπιθυμῆσαι αὐτὴν ἤδη ἐμοίχευσεν αὐτὴν ἐν τῇ καρδίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/028.yaml
  text: But I say to you that everyone who looks at a woman in order to desire her has already committed adultery with her in his heart[a][b][c].
translation:
  language: uk
  text: 'А Я кажу вам: кожен, хто дивиться на жінку, щоб пожадати її, уже вчинив із нею перелюб у своєму серці.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «хто дивиться на жінку, щоб забажати її».'
    reason: Лексичний варіант для ἐπιθυμέω, яке може мати ширше значення «бажати», хоча в цьому контексті йдеться про неправомірне статеве бажання.
  - marker: b
    text: Грецьке γυνή може означати як «жінка», так і «дружина» — залежно від контексту.
    reason: Збереження справжньої лексичної неоднозначності грецького іменника.
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: А Я кажу вам
  rationale: Наголошений займенник ἐγώ передано великим «Я», а δέ — природним українським протиставним «А»; «кажу вам» близько відтворює λέγω ὑμῖν.
- source_word: πᾶς ὁ βλέπων
  choice: кожен, хто дивиться
  rationale: Передає узагальнювальну силу πᾶς і тривалу або спрямовану дію дієприкметника βλέπων, не додаючи в основний текст явно слова «чоловік».
- source_word: γυναῖκα
  choice: на жінку
  rationale: γυνή залежно від контексту може означати «жінка» або «дружина». Основний текст зберігає ширше значення, не уточнюючи сімейного стану понад грецький текст.
- source_word: πρὸς τὸ ἐπιθυμῆσαι αὐτὴν
  choice: щоб пожадати її
  rationale: Конструкція πρὸς τό з інфінітивом виражає мету або намір. «Щоб» чітко передає цю спрямованість, а «пожадати» в цьому контексті позначає неправомірне статеве бажання.
- source_word: ἤδη ἐμοίχευσεν αὐτὴν
  choice: уже вчинив із нею перелюб
  rationale: «Уже» точно відтворює ἤδη; усталений український вислів «учинити перелюб із кимось» природно передає μοιχεύω з прямим додатком αὐτήν.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: у своєму серці
  rationale: Зберігає біблійну метафору καρδία як осередку думок, намірів і бажань; зворотний присвійний займенник природний українською та чітко відсилає до підмета.
theological_decisions:
- issue: Чи передавати γυνή як «жінка» чи «дружина» в контексті перелюбу
  choice: жінка
  alternative: дружина
  rationale: Грецька форма сама собою не визначає сімейного стану. «Жінка» зберігає широту вислову, тоді як контекст перелюбу передає його статево-етичну вагу; можливе значення «дружина» зазначено у примітці.
- issue: Чи передавати ἐπιθυμέω нейтральнішим «бажати» або контекстуальним «пожадати»
  choice: пожадати
  alternative: забажати
  rationale: Хоча дієслово має ширший семантичний діапазон, тут контекст прямо пов’язує бажання з перелюбом. «Пожадати» природно передає неправомірний сексуальний потяг, не усуваючи навмисності, вираженої конструкцією мети.
- issue: Чи описує вислів випадковий погляд або цілеспрямований погляд із наміром
  choice: цілеспрямований погляд із метою пожадати
  alternative: будь-який погляд, що викликає потяг
  rationale: πρὸς τὸ ἐπιθυμῆσαι виражає мету або спрямованість. Переклад не перетворює вислів на осуд самого мимовільного бачення, але й не послаблює засудження внутрішнього перелюбного наміру.
translation_notes:
  register: Сучасна нормативна українська з урочистою, але доступною біблійною тональністю. «Перелюб» зберігає точний етичний термін; «пожадати» виразніше за нейтральне «бажати», однак лишається зрозумілим широкому читачеві. Пунктуація робить вислів природним для читання вголос.
