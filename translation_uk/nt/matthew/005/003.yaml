source:
  edition: SBLGNT
  text: Μακάριοι οἱ πτωχοὶ τῷ πνεύματι, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/003.yaml
  text: Blessed are the poor in spirit[c][b][a], because the kingdom of heaven is theirs.
translation:
  language: uk
  text: Блаженні вбогі духом[b], бо їхнє Царство Небесне.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Царство небес» — характерний для Євангелія від Матвія вислів.'
    reason: lexical_alternative
  - marker: b
    text: Вислів «вбогі духом» можна також розуміти як «духовно вбогі» або «ті, хто усвідомлює свою духовну нужду». Основний текст зберігає відкритість грецького вислову.
    reason: alternative_reading
lexical_decisions:
- source_word: Μακάριοι
  choice: Блаженні
  rationale: У контексті блаженств це усталений і точний відповідник, що передає схвалений Богом, гідний заздрості стан, а не лише суб’єктивне відчуття щастя.
- source_word: οἱ πτωχοὶ
  choice: вбогі
  rationale: Передає реальну нужденність, закладену в πτωχός, і природно функціонує в українській як субстантивований прикметник; «жебраки» було б надто вузьким і конкретним.
- source_word: τῷ πνεύματι
  choice: духом
  rationale: Орудний відмінок природно передає грецький давальний відношення та зберігає стислу й відкриту до тлумачення конструкцію, не ототожнюючи πνεῦμα прямо зі Святим Духом.
- source_word: ὅτι
  choice: бо
  rationale: Природно й стисло вводить підставу проголошеного блаженства.
- source_word: αὐτῶν ἐστιν
  choice: їхнє
  rationale: 'Присвійна предикативна конструкція передає теперішнє володіння: Царство вже належить цій групі, а не лише належатиме в майбутньому.'
- source_word: ἡ βασιλεία
  choice: Царство
  rationale: Усталений і зрозумілий відповідник, здатний охоплювати як царське панування, так і сферу цього панування.
- source_word: τῶν οὐρανῶν
  choice: Небесне
  rationale: Природний український відповідник характерного для Матвія вислову; не відтворює механічно грецьку множину, але зберігає традиційне значення формули.
theological_decisions:
- issue: Значення вислову «вбогі духом»
  choice: Зберегти стислий вислів «вбогі духом» без пояснювального розгортання.
  alternative: «духовно вбогі»; «ті, хто усвідомлює свою духовну нужду»; «смиренні»
  rationale: Грецький вислів має богословську місткість і не уточнює, чи йдеться насамперед про внутрішню нужденність, її усвідомлення або смирення. Переклад не повинен звужувати цю відкритість.
- issue: Теперішній час володіння Царством
  choice: 'Передати ἐστιν теперішнім значенням: «їхнє».'
  alternative: «буде їхнім»; «належатиме їм»
  rationale: Оригінал уживає теперішній час, тому не слід перетворювати обітницю на суто майбутню.
translation_notes:
  register: Сучасна нормативна українська з гідним біблійним звучанням. «Блаженні» та «Царство Небесне» зберігають впізнавану форму блаженства; синтаксис короткий і природний. Маркер [b] стоїть безпосередньо після неоднозначного вислову, а [a] — після формули про Царство.
