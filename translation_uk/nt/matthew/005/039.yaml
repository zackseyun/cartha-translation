source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ἀντιστῆναι τῷ πονηρῷ· ἀλλ’ ὅστις σε ⸀ῥαπίζει ⸀εἰς τὴν δεξιὰν ⸀σιαγόνα, στρέψον αὐτῷ καὶ τὴν ἄλλην·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/039.yaml
  text: But I say to you[a], do not resist the evil person. Instead, if anyone slaps you on the right cheek[b], turn the other to him as well.
translation:
  language: uk
  text: 'А Я кажу вам: не противтеся злій людині.[a] А якщо хтось вдарить тебе по правій щоці, поверни до нього й другу щоку.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «не противтеся злу»; також можливе: «не противтеся лукавому».'
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ ἀντιστῆναι
  choice: не противтеся
  rationale: Зберігає пряме значення ἀνθίστημι — «ставати проти, чинити опір» — і не звужує вислів лише до помсти, хоча найближчий приклад указує саме на відмову від відплати.
- source_word: τῷ πονηρῷ
  choice: лихій людині
  rationale: Артикльований прикметник у давальному відмінку граматично допускає значення «злу», «лихій людині» або «лукавому». Подальший приклад із людиною, яка б’є по щоці, підтримує особове загальне значення.
- source_word: ῥαπίζει
  choice: ударить
  rationale: ῥαπίζω означає удар рукою, часто ляпас. Українське «ударить по щоці» природне й не визначає без потреби, яким саме боком долоні завдано удару.
- source_word: εἰς τὴν δεξιὰν σιαγόνα
  choice: по правій щоці
  rationale: σιαγών може означати щелепу або щоку; в контексті удару природним українським відповідником є «щока».
- source_word: στρέψον αὐτῷ καὶ τὴν ἄλλην
  choice: поверни до нього й другу
  rationale: Передає буквальне значення στρέφω — «повернути» — без додаткового тлумачення «підставити»; «другу щоку» легко відновити з контексту.
- source_word: ὅστις
  choice: якщо хтось
  rationale: Природно передає неозначену умовну силу конструкції.
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: А Я кажу вам
  rationale: «А» передає контраст δέ з попереднім ученням, а виразне «Я» відтворює наголошений займенник ἐγώ.
theological_decisions:
- issue: Значення τῷ πονηρῷ
  choice: 'особове загальне: «лихій людині»'
  alternative: 'абстрактне: «злу»; особове конкретне: «лукавому»'
  rationale: Фраза справді неоднозначна. Безпосередній приклад стосується людини-кривдника, тому в основному тексті обрано особове загальне значення, а інші можливості збережено в примітці.
translation_notes:
  register: Сучасна нормативна українська мова з гідним, але доступним біблійним регістром. Однина «тебе» після множини «вам» збережена відповідно до грецького тексту. Займенник «Я» написано з великої літери за усталеною українською біблійною практикою.
