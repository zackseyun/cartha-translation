  terminology: «Зла людина» передає особове загальне значення без демонологічної специфікації. Примітка належно зберігає можливі абстрактне та особове-конкретне прочитання τῷ πονηρῷ. «Лукавому» в примітці можливе, хоча «злому» було б ближчим до нейтральної сучасної лексики; змістовної помилки немає.
