base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/009.yaml
  text: Blessed are the peacemakers[a], because they will be called sons of God.
translation:
  language: uk
  text: Блаженні миротворці[a], бо вони будуть названі синами Божими.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «ті, хто творить мир». Вислів «синами Божими» передає грецьку чоловічу множину; залежно від контексту її також можна передати як «дітьми Божими».'
    reason: Лексична альтернатива для εἰρηνοποιοί та пояснення представницького вживання чоловічої множини у вислові υἱοὶ θεοῦ.
lexical_decisions:
- source_word: μακάριοι
  choice: Блаженні
  rationale: Усталений український відповідник у блаженствах; передає Божу прихильність і гідний заздрості стан, а не лише суб’єктивне щастя.
- source_word: εἰρηνοποιοί
  choice: миротворці
  rationale: Природний і стислий відповідник складного іменника на позначення тих, хто активно творить мир.
- source_word: ὅτι
  choice: бо
  rationale: Природно вводить підставу проголошеного блаженства й зберігає причинний зв’язок.
- source_word: αὐτοὶ
  choice: вони
  rationale: Окремий займенник передає наявний у грецькому тексті емфатичний займенник без неприродного посилення «саме вони».
- source_word: υἱοὶ θεοῦ
  choice: синами Бога
  rationale: Зберігає чоловічу множину та синівську образність оригіналу; представницький, інклюзивний зміст пояснено в примітці.
- source_word: κληθήσονται
  choice: будуть названі
  rationale: Безпосередньо передає майбутній пасив дієслова καλέω, не звужуючи значення до людського визнання.
theological_decisions:
- issue: Гендерно маркована синівська мова у вислові υἱοὶ θεοῦ
  choice: синами Бога
  alternative: дітьми Бога
  rationale: Основний текст зберігає буквальну чоловічу множину й можливі відтінки синівського статусу, тоді як примітка уточнює її представницький та інклюзивний характер.
translation_notes:
  register: Сучасна, гідна й загальнозрозуміла українська мова. Збережено традиційне «Блаженні» та стислий ритм блаженства; богословську напругу синівської мови не нейтралізовано.
