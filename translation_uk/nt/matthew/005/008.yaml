lexical_decisions:
- source_word: μακάριοι
  choice: Блаженні
  rationale: Усталений і природний для заповідей блаженства відповідник, який передає Боже схвалення та благословенний стан, а не лише почуття щастя.
- source_word: καθαροὶ
  choice: чисті
  rationale: Передає внутрішню моральну чистоту; водночас зберігає основний образ чистоти без зайвого тлумачення.
- source_word: τῇ καρδίᾳ
  choice: серцем
  rationale: Природний український орудний відношення, що означає чистоту внутрішньої людини, а не тільки емоцій.
- source_word: ὅτι
  choice: бо
  rationale: Стисло й природно вводить підставу проголошеного блаженства.
- source_word: αὐτοὶ
  choice: вони
  rationale: Зберігає виражений у грецькому тексті займенник і його наголос на тому, що саме ці люди отримають обітницю.
- source_word: τὸν θεὸν
  choice: Бога
  rationale: Прямий і природний відповідник прямого додатка.
- source_word: ὄψονται
  choice: побачать
  rationale: Прямо передає майбутню обітницю, не звужуючи значення до переживання Божої присутності чи лише до її остаточного здійснення в майбутньому.
theological_decisions:
- issue: Значення вислову «побачать Бога»
  choice: Збережено пряме формулювання «побачать Бога».
  alternative: «переживатимуть Божу присутність» або «споглядатимуть Бога в майбутньому віці»
  rationale: Грецький вислів стислий і богословськи місткий. Переклад не визначає наперед, чи йдеться про безпосередній доступ до Божої присутності, майбутнє остаточне здійснення обітниці, чи обидва аспекти.
