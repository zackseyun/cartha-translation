lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: Не думайте
  rationale: Природно й прямо передає заборону з μή та аористним кон’юнктивом, не посилюючи її до значення «не уявляйте».
- source_word: ἦλθον
  choice: Я прийшов
  rationale: Український минулий час природно передає грецький аорист у цьому вислові; конструкція також може мати актуальний відтінок «Я прийшов і тепер тут».
- source_word: καταλῦσαι
  choice: скасувати
  rationale: У сполученні із Законом і Пророками йдеться не про фізичне руйнування, а про усунення їхньої чинності чи значення.
- source_word: τὸν νόμον ἢ τοὺς προφήτας
  choice: Закон або Пророків
  rationale: Великі літери позначають усталену назву складових Писання Ізраїлю; «або» точно відтворює ἢ.
- source_word: ἀλλὰ πληρῶσαι
  choice: а сповнити їх
  rationale: «Сповнити» зберігає широкий біблійний зміст πληρόω — здійснити, довести до повноти або виявити повний зміст — без нав’язування одного богословського тлумачення. Займенник «їх» додано для природності й однозначно віднесено до Закону та Пророків.
theological_decisions:
- issue: Значення πληρῶσαι щодо Закону і Пророків
  choice: сповнити їх
  alternative: довести їх до повноти; здійснити їх; повністю розкрити їхній зміст
  rationale: Грецьке слово допускає взаємопов’язані відтінки здійснення, наповнення та доведення до повноти. Основний текст зберігає цю богословську багатозначність, а примітка подає можливі відтінки, не обираючи конфесійного пояснення.
translation_notes:
  register: Сучасна нормативна українська, урочиста без архаїзації. Збережено традиційні біблійні назви «Закон» і «Пророки» та богословську місткість дієслова «сповнити».
