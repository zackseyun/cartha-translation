base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/043.yaml
  text: You have heard that it was said[a], ‘You shall love your neighbor and hate your enemy.’
translation:
  language: uk
  text: 'Ви чули, що було сказано[a]: «Люби свого ближнього і ненавидь свого ворога».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Перша частина перегукується з Левит 19:18; друга — «і ненавидь свого ворога» — не є прямою цитатою зі Старого Завіту, а відображає поширене вчення, яке Ісус виправляє.
    reason: cross_reference
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Ви чули
  rationale: Аорист у цій усталеній вступній формулі природно передається українським минулим часом і вказує на раніше почуте вчення.
- source_word: ἐρρέθη
  choice: було сказано
  rationale: Безособова пасивна конструкція точно зберігає форму грецького тексту й не уточнює, хто саме це сказав.
- source_word: Ἀγαπήσεις
  choice: Люби
  rationale: Майбутній час у цитованій заповіді має наказову силу; український наказовий спосіб передає її природно й виразно.
- source_word: τὸν πλησίον σου
  choice: свого ближнього
  rationale: «Ближній» є усталеним і точним відповідником πλησίον в етичному контексті та в перегуку з Левит 19:18.
- source_word: μισήσεις
  choice: ненавидь
  rationale: Форма майбутнього часу тут, як і Ἀγαπήσεις, має наказову силу; паралельний наказовий спосіб природно відтворює структуру вислову.
- source_word: τὸν ἐχθρόν σου
  choice: свого ворога
  rationale: «Ворог» є прямим і звичним відповідником ἐχθρός у цьому етичному протиставленні.
theological_decisions:
- issue: Статус слів «і ненавидь свого ворога»
  choice: Передано як частину вислову, який, за словами Ісуса, слухачі чули, але без твердження, що весь вислів є прямою цитатою з Писання.
  alternative: Подати весь вислів як однаково пряму старозавітну цитату або вже в основному тексті назвати другу частину пізнішим тлумаченням.
  rationale: Грецький текст подає один повідомлений вислів після формули «Ви чули, що було сказано». Перша частина перегукується з Левит 19:18, тоді як друга не є прямою старозавітною заповіддю; примітка пояснює це, не змінюючи форми самого вислову.
translation_notes:
  register: Сучасна стандартна українська; звертання у множині «Ви» передає грецьку форму до групи слухачів. Мова природна й гідна, а наказові форми «Люби» та «ненавидь» відтворюють приписову силу грецьких форм майбутнього часу.
