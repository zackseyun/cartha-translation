  text: οὐδὲ καίουσιν λύχνον καὶ τιθέασιν αὐτὸν ὑπὸ τὸν μόδιον ἀλλ’ ἐπὶ τὴν λυχνίαν, καὶ λάμπει πᾶσιν τοῖς ἐν τῇ οἰκίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/015.yaml
  text: Nor do people light a lamp and put it under a basket[a], but on a lampstand[b], and it gives light to everyone in the house.
translation:
  language: uk
  text: Так само не запалюють світильника й не ставлять його під мірну посудину[a], а ставлять на підставку для світильника, і він світить усім у домі.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «під посудину для відмірювання зерна». Грецьке слово μόδιος означає міру сипких речовин, а також відповідну мірну посудину.'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «і він дає світло всім у домі».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: Так само не
  rationale: Сполучник продовжує попередній образ заперечним паралельним прикладом; цей відповідник природно передає зв’язок у сучасній українській.
- source_word: καίουσιν λύχνον
  choice: запалюють світильника
  rationale: У цьому контексті καίω означає запалити, а λύχνος — конкретний олійний світильник. Родовий відмінок після заперечення є природним для української.
- source_word: τιθέασιν αὐτόν
  choice: ставлять його
  rationale: Дієслово «ставлять» природно описує розміщення світильника й зберігає теперішній час узагальненого вислову.
- source_word: ὑπὸ τὸν μόδιον
  choice: під мірну посудину
  rationale: μόδιος позначає міру сипких речовин, а також посудину такої місткості. «Мірна посудина» зберігає цю конкретну рису образу без застарілого «бушеля».
- source_word: ἀλλ’ ἐπὶ τὴν λυχνίαν
  choice: а ставлять на підставку
  rationale: λυχνία — підставка для світильника. Повторення «ставлять» робить українське протиставлення ясним, хоча в грецькому другому члені дієслово мається на увазі.
- source_word: λάμπει
  choice: він світить
  rationale: Прямий відповідник зберігає образ світильника, що сяє або світить, не перетворюючи дію на пояснення її результату.
- source_word: πᾶσιν τοῖς ἐν τῇ οἰκίᾳ
  choice: усім у домі
  rationale: Стисло й природно передає всіх людей, які перебувають усередині будинку, та зберігає універсальність πᾶσιν.
theological_decisions:
- issue: Неозначений узагальнений суб’єкт дієслів у третій особі множини
  choice: не запалюють ... й не ставлять ... а ставлять
  alternative: люди не запалюють ...; ніхто не запалює ...
  rationale: Українська природно вживає безособово-узагальнену третю особу множини без доданого підмета. Це найближче відтворює грецьку форму й не звужує її до однієї особи.
- issue: Функція λάμπει щодо людей у домі
  choice: він світить усім у домі
  alternative: він дає світло всім у домі
  rationale: Дієслово буквально означає «світить/сяє». Обраний варіант зберігає образ і допускає природне розуміння користі світла для присутніх, не додаючи пояснення до основного тексту.
translation_notes:
  register: Сучасна, проста й гідна українська мова. Безпідметові форми третьої особи множини природно передають загальне правило. «Світильник» точніше за абстрактне «світло», а «підставка» зрозуміло передає λυχνία; виноска зберігає предметну специфіку μόδιος.
