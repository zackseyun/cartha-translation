  text: λέγω γὰρ ὑμῖν ὅτι ἐὰν μὴ περισσεύσῃ ⸂ὑμῶν ἡ δικαιοσύνη⸃ πλεῖον τῶν γραμματέων καὶ Φαρισαίων, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/020.yaml
  text: For I tell you that unless your righteousness exceeds that of the scribes and Pharisees[a], you will certainly not enter the kingdom of heaven.
translation:
  language: uk
  text: 'Бо кажу вам: якщо ваша праведність[a] не перевершить праведності книжників і фарисеїв, ви аж ніяк не ввійдете до Царства Небесного.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «ваша справедливість». Грецьке слово може означати і праведність, і справедливість; у контексті Матвія 5 найдоречніше «праведність».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Бо кажу вам
  rationale: «Бо» передає пояснювальну силу γάρ і пов’язує вислів із попереднім контекстом; «кажу вам» природно й прямо відтворює λέγω ὑμῖν.
- source_word: ἐὰν μὴ
  choice: якщо … не
  rationale: Конструкція вводить необхідну негативну умову. Українське «якщо … не» тут природніше за «якщо тільки не» і точно зберігає логіку вислову.
- source_word: περισσεύσῃ … πλεῖον
  choice: не перевершить
  rationale: У порівняльній конструкції дієслово означає бути більшою мірою, перевищувати; «перевершить» стисло й природно передає цей зміст.
- source_word: ὑμῶν ἡ δικαιοσύνη
  choice: ваша праведність
  rationale: У контексті Матвія 5 δικαιοσύνη охоплює правильне перед Богом життя та вчинки. «Праведність» зберігає широту поняття краще, ніж вужче «справедливість».
- source_word: τῶν γραμματέων καὶ Φαρισαίων
  choice: праведності книжників і фарисеїв
  rationale: Повторення слова «праведності» явно позначає предмет порівняння, який у грецькому тексті мається на увазі еліптично, і усуває можливе хибне прочитання, ніби треба перевершити самих людей.
- source_word: γραμματέων
  choice: книжників
  rationale: «Книжники» — усталена українська назва фахівців і тлумачів Закону в євангельському контексті.
- source_word: Φαρισαίων
  choice: фарисеїв
  rationale: Усталена українська форма назви цієї релігійної групи.
- source_word: οὐ μὴ εἰσέλθητε
  choice: ви аж ніяк не ввійдете
  rationale: Подвійне заперечення οὐ μή з аористом кон’юнктива має виразно підсилену силу; «аж ніяк не» передає категоричність без архаїзму.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: Царства Небесного
  rationale: Усталений і природний український відповідник характерного для Матвія вислову; великі літери відповідають традиційному оформленню назви Божого царювання.
theological_decisions:
- issue: Значення δικαιοσύνη в непавлівському контексті Євангелія від Матвія
  choice: праведність
  alternative: справедливість
  rationale: Безпосередній контекст стосується належного Богові життя й послуху, що перевершує взірець книжників і фарисеїв. «Праведність» зберігає як морально-релігійний, так і стосунковий вимір терміна, тоді як «справедливість» могла б невиправдано звузити його до суспільної або судової площини.
- issue: Предмет порівняння в πλεῖον τῶν γραμματέων καὶ Φαρισαίων
  choice: явно повторити «праведності»
  alternative: «більше, ніж книжників і фарисеїв»
  rationale: Грецька конструкція допускає еліпсис, але йдеться про перевищення їхньої праведності, а не самих осіб. Явне повторення українською уточнює граматичний зміст, не додаючи богословського тлумачення.
translation_notes:
  register: Сучасна літературна українська з гідним біблійним звучанням. Збережено пояснювальне «Бо», категоричність заперечення та традиційні, зрозумілі назви «книжники», «фарисеї», «Царство Небесне».
