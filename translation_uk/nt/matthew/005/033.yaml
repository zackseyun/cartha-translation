  text: Πάλιν ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐκ ἐπιορκήσεις, ἀποδώσεις δὲ τῷ κυρίῳ τοὺς ὅρκους σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/033.yaml
  text: Again[a], you have heard that it was said to those of old, ‘You shall not swear falsely[b], but you shall fulfill your oaths to the Lord.’
translation:
  language: uk
  text: 'Знову ви чули, що було сказано людям давнини: «Не присягай неправдиво[a], а Господу[b] виконуй свої присяги».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Не порушуй присяги»; дієслово може означати як неправдиво присягати, так і порушити присягу.'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «ГОСПОДУ» — з огляду на Боже завітне ім’я у старозавітному тлі цього вислову.'
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν
  choice: І ще
  rationale: Природно вводить наступний приклад у послідовності висловів і передає поступ дискурсу без надмірного наголосу на повторенні.
- source_word: ἠκούσατε
  choice: ви чули
  rationale: Український минулий час природно передає аорист у цій формулі та зберігає безпосереднє звернення до слухачів.
- source_word: ἐρρέθη
  choice: було сказано
  rationale: Зберігає безособову пасивну конструкцію грецького тексту, не уточнюючи того, хто говорив.
- source_word: τοῖς ἀρχαίοις
  choice: людям давнини
  rationale: Передає історико-часове значення вислову й не звужує його до буквальних предків або просто літніх людей.
- source_word: Οὐκ ἐπιορκήσεις
  choice: Не присягай неправдиво
  rationale: Передає основне значення неправдивої присяги, водночас примітка зберігає можливий відтінок порушення присяги.
- source_word: ἀποδώσεις
  choice: виконуй
  rationale: У контексті присяг дієслово означає виконати взяте на себе зобов’язання; цей відповідник ясний і природний сучасною українською.
- source_word: τῷ κυρίῳ
  choice: перед Господом
  rationale: Прийменникова конструкція природно передає спрямованість і відповідальність перед Богом у зв’язку з виконанням присяг.
- source_word: τοὺς ὅρκους σου
  choice: свої присяги
  rationale: Стисло й точно передає прямий додаток та особисту належність зобов’язань.
theological_decisions:
- issue: Передача κύριος в алюзії на Писання Ізраїлю
  choice: Господом
  alternative: ГОСПОДОМ
  rationale: Грецький текст містить κυρίῳ, тому основний текст передає його звичним відповідником «Господь». Варіант із великими літерами можливий з огляду на старозавітне тло та Боже завітне ім’я, але це не пряма єврейська цитата тетраграми.
- issue: Обсяг значення ἐπιορκέω
  choice: присягати неправдиво
  alternative: порушувати присягу
  rationale: Дієслово може стосуватися як неправдивого присягання, так і невиконання присяги. Основний варіант добре відповідає юридично-релігійному контексту, а примітка зберігає широту значення.
translation_notes:
  register: Сучасна стандартна українська мова; виклад гідний і зрозумілий, із помірно формальним біблійним звучанням. Конструкцію «людям давнини» обрано для ясності, а справжню лексичну неоднозначність щодо присяги та старозавітного Божого імені збережено у примітках.
