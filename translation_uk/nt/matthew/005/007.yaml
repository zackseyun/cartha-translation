  text: Blessed are the merciful[a], for they will be shown mercy.
translation:
  language: uk
  text: Блаженні милосердні, бо їм буде виявлено милість[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «бо вони зазнають милості». У грецькому тексті вжито дієслово майбутнього часу в пасивному стані; того, хто виявить милість, прямо не названо.'
    reason: Лексичний варіант і збереження неназваного діяча пасивної конструкції.
lexical_decisions:
- source_word: μακάριοι
  choice: Блаженні
  rationale: Усталений український відповідник у блаженствах; передає стан Божого благовоління й повноти добра, а не лише суб’єктивне відчуття щастя.
- source_word: οἱ ἐλεήμονες
  choice: милосердні
  rationale: Артикль із прикметником ужито субстантивовано. Стисле «милосердні» зберігає афористичну форму та кореневий смисловий зв’язок із дієсловом «будуть помилувані».
- source_word: ὅτι
  choice: бо
  rationale: Природно й стисло вводить підставу проголошеного блаженства.
- source_word: αὐτοὶ
  choice: вони
  rationale: Особовий займенник у грецькому тексті має наголос, однак у стислій українській формі «вони» достатньо позначає відповідність між милосердними та тими, хто зазнає милості; «саме вони» могло б надмірно підкреслити винятковість.
- source_word: ἐλεηθήσονται
  choice: будуть помилувані
  rationale: Майбутній час пасивного стану передано прямо й природно, без називання діяча; водночас збережено лексичний перегук із «милосердні».
theological_decisions:
- issue: Хто виявить обіцяну милість
  choice: 'Зберегти пасивну конструкцію без називання діяча: «будуть помилувані».'
  alternative: «Бог помилує їх» або «вони одержать милість».
  rationale: У контексті мається на увазі передусім Божа милість, але грецький текст прямо не називає діяча. Пасивна конструкція зберігає цю змістову відкритість.
translation_notes:
  register: Сучасна стандартна українська мова; стислий, урочистий і загальнозрозумілий стиль блаженств. Збережено традиційне «Блаженні» та паралелізм між милосердям людей і милістю, яку вони отримають.
