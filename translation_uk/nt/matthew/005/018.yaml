  source_fidelity: 'Зміст загалом точно передає грецький текст: збережено пояснювальне «бо», урочисте «істинно», часові межі «доки», образ йоти й малої письмової риски та широту «все не станеться». Проте «аж ніяк не мине із Закону» є менш природним українським сполученням: у цьому контексті те, що не «минає з» тексту Закону, природніше передати як те, що не «зникне із» нього.'
