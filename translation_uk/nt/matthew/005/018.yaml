language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν, ἕως ἂν παρέλθῃ ὁ οὐρανὸς καὶ ἡ γῆ, ἰῶτα ἓν ἢ μία κεραία οὐ μὴ παρέλθῃ ἀπὸ τοῦ νόμου, ἕως ἂν πάντα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/018.yaml
  text: For truly I say to you[a], until heaven and earth pass away[c][b], not one iota or one stroke will ever pass away from the law until all things happen.
translation:
  language: uk
  text: 'Бо істинно кажу вам: доки не минуть небо й земля, ні одна йота[a] чи ні одна риска[b] ніяк не зникне із Закону, доки все не станеться.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Йота — назва найменшої літери грецького алфавіту; тобто тут ідеться навіть про найменшу літеру.
    reason: lexical_alternative
  - marker: b
    text: Тобто найдрібніша риска або виступ у написанні літери, що може відрізняти її від іншої.
    reason: lexical_alternative
  - marker: c
    text: 'Або: «доки все не здійсниться»; «доки все не сповниться».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: істинно
  rationale: У висловах Ісуса це урочисте підтвердження, що вводить авторитетне твердження. «Істинно» природно й гідно передає його силу українською.
- source_word: γὰρ
  choice: бо
  rationale: Сполучник пояснює та обґрунтовує попереднє твердження, тому збережено його логічний зв’язок із контекстом.
- source_word: λέγω ὑμῖν
  choice: кажу вам
  rationale: Прямий і природний відповідник, який зберігає урочистий авторитетний тон.
- source_word: ἕως ἂν παρέλθῃ ὁ οὐρανὸς καὶ ἡ γῆ
  choice: доки не минуть небо й земля
  rationale: «Минути» природно передає παρέρχομαι щодо неба й землі, а конструкція з «доки не» позначає майбутню межу.
- source_word: ἰῶτα ἓν ἢ μία κεραία
  choice: ані одна йота, ані одна риска
  rationale: Парна конструкція «ані… ані…» природно передає заперечний зміст грецького «одна йота або одна риска», зберігаючи обидва образи найдрібніших елементів письма.
- source_word: οὐ μὴ παρέλθῃ
  choice: аж ніяк не мине
  rationale: «Аж ніяк» передає посилене грецьке заперечення οὐ μή без неприродного буквального дублювання заперечень.
- source_word: ἀπὸ τοῦ νόμου
  choice: із Закону
  rationale: Велика літера вказує на Закон як Писання в безпосередньому контексті Мт 5:17–19, а не на законодавство взагалі; прийменник «із» зберігає образ того, що жоден письмовий елемент не зникне із Закону.
- source_word: ἕως ἂν πάντα γένηται
  choice: доки все не станеться
  rationale: Широкий відповідник γίνομαι зберігає можливість розуміти вислів як настання, здійснення або сповнення всього, не звужуючи його до однієї богословської схеми.
theological_decisions:
- issue: Значення νόμος у вислові Ісуса
  choice: «Закон» як Боже Писання, згадане в контексті разом із Пророками
  alternative: Виключно Тора / П’ятикнижжя або, ширше, усе Старозавітне Писання
  rationale: Контекст Мт 5:17–19 має на увазі авторитетне Писання. Переклад «Закон» не визначає остаточно, чи йдеться лише про Тору, чи про ширше біблійне свідчення.
- issue: Сила вислову πάντα γένηται
  choice: «доки все не станеться»
  alternative: «доки все не здійсниться» або «доки все не сповниться»
  rationale: Грецький вислів допускає як значення настання подій, так і їх повного здійснення. Основний текст зберігає цю широту, а примітка подає природніші інтерпретаційні варіанти.
translation_notes:
  register: Сучасна нормативна українська мова з урочистим, але зрозумілим біблійним звучанням. Збережено повтор «доки», образи письма та посилене заперечення оригіналу; архаїзмів на кшталт «йота і титла» уникнуто.
