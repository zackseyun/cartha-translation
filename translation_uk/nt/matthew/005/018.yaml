  to: 'Бо істинно кажу вам: доки не минуть небо й земля, ні одна йота[a] чи ні одна риска[b] ніяк не зникне із Закону, доки все не станеться.[c]'
  rationale: Внесено лише стилістично-синтаксичні уточнення. «Зникне із Закону» природно передає думку, що жодна найменша письмова деталь не буде усунена з Закону; «чи» відтворює грецьке ἤ. Часові межі, емфатичне заперечення та навмисна широта фінального «все не станеться» збережені.
