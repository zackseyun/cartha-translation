  terminology: «Йота», «риска» та «Закон» доречні. Велика літера в «Законі» прийнятна в цьому біблійному контексті, не визначаючи точніше межі νόμος. Примітки належно пояснюють образи й зберігають альтернативу для πάντα γένηται.
