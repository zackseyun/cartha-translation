lexical_decisions:
- source_word: μακάριοι
  choice: Блаженні
  rationale: Зберігає усталену форму блаженства та його об’єктивну оцінну й богословську силу; «щасливі» могло б звучати переважно як опис суб’єктивного почуття.
- source_word: οἱ πενθοῦντες
  choice: ті, хто сумує
  rationale: Передає субстантивований дієприкметник теперішнього часу природною сучасною українською та не звужує причини скорботи до втрати, гріха чи утисків.
- source_word: ὅτι
  choice: бо
  rationale: Природно й стисло вводить підставу проголошеного блаженства, зберігаючи причинний зв’язок.
- source_word: αὐτοὶ
  choice: вони
  rationale: Передає займенник без неприродного для українського речення надмірного наголосу; виокремлювальна сила достатньо відчутна зі структури вислову.
- source_word: παρακληθήσονται
  choice: будуть утішені
  rationale: Точно передає майбутній пасив і значення отримання втіхи, не називаючи прямо того, хто втішить.
theological_decisions:
- issue: Обсяг значення скорботи в блаженстві
  choice: Широке «ті, хто сумує» без уточнення причини.
  alternative: Ті, хто оплакує власний гріх; ті, хто переживає особисту втрату; ті, хто оплакує стан Ізраїлю чи світу.
  rationale: Грецький текст не називає предмета або причини скорботи. Широке формулювання зберігає смислову й богословську відкритість вислову.
- issue: Неозначений виконавець у майбутньому пасиві
  choice: 'Зберегти пасив: «будуть утішені».'
  alternative: «Бог їх утішить».
  rationale: Контекст може дозволяти розуміти пасив як указівку на Божу дію, але в самому реченні виконавця не названо; переклад не робить неявне явним.
translation_notes:
  register: Сучасна стандартна українська, урочиста, але зрозуміла. Збережено традиційну формулу «Блаженні» та пасивну конструкцію оригіналу; причину скорботи не конкретизовано.
