source:
  edition: SBLGNT
  text: εἰ δὲ ὁ ὀφθαλμός σου ὁ δεξιὸς σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου βληθῇ εἰς γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/029.yaml
  text: But if your right eye causes you to stumble[a], tear it out and throw it away from you[b]. For it is better for you that one of your members should perish than that your whole body should be thrown into Gehenna.
translation:
  language: uk
  text: А якщо твоє праве око спокушає тебе[a], вирви його й кинь геть від себе. Бо краще для тебе, щоб загинула одна частина твого тіла, ніж щоб усе твоє тіло було вкинуте в геєну[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «призводить тебе до гріха».'
    reason: lexical_alternative
  - marker: b
    text: Геєна — грецька форма назви, пов’язаної з долиною Гіннома; традиційно перекладається як «пекло».
    reason: historical_term
lexical_decisions:
- source_word: σκανδαλίζει
  choice: змушує тебе спіткнутися
  rationale: Зберігає образ спотикання, наявний у грецькому дієслові, не звужуючи його в основному тексті до пояснювального «змушує грішити».
- source_word: ἔξελε
  choice: вирви
  rationale: Передає сильний наказ і навмисно різкий образ грецького тексту природною сучасною українською мовою.
- source_word: βάλε ἀπὸ σοῦ
  choice: кинь геть від себе
  rationale: Передає як силу наказу βάλε, так і виражене ἀπὸ σοῦ віддалення від себе.
- source_word: συμφέρει
  choice: краще для тебе
  rationale: Природно передає значення користі або переваги в порівняльній побудові речення.
- source_word: ἀπόληται
  choice: загинула
  rationale: Зберігає серйозність дієслова ἀπόλλυμι й не уточнює понад текст характер цієї втрати.
- source_word: ἓν τῶν μελῶν σου
  choice: одна частина твого тіла
  rationale: Передає значення тілесного члена зрозумілою сучасною українською; слово «частина» природно охоплює око й підтримує протиставлення всьому тілу.
- source_word: βληθῇ
  choice: було вкинуте
  rationale: Точно передає пасивну форму та силу βάλλω в цьому контексті.
- source_word: γέενναν
  choice: геєну
  rationale: Зберігає окремий історично навантажений термін γέεννα, не підміняючи його ширшим богословським поняттям «пекло».
- source_word: ὁ δεξιὸς
  choice: праве
  rationale: Зберігає явно зазначену в джерелі деталь.
- source_word: δὲ
  choice: А
  rationale: Передає продовження з легким протиставленням і природно пов’язує вислів із попереднім контекстом.
theological_decisions:
- issue: Передача γέεννα
  choice: геєна
  alternative: пекло
  rationale: Транслітерація зберігає конкретний термін Ісуса та його історичні асоціації, не привносячи автоматично всього спектра пізніших уявлень, пов’язаних зі словом «пекло».
- issue: Метафорична сила σκανδαλίζω
  choice: змушує тебе спіткнутися
  alternative: змушує тебе грішити
  rationale: Основний текст зберігає грецький образ спотикання та його смислову напругу; контекстуальне пояснення про гріх подано в примітці.
- issue: Різкий образ самоушкодження
  choice: вирви його й кинь геть від себе
  alternative: усунь його від себе
  rationale: Збережено навмисно сильну образність наказів без пом’якшення до абстрактного «усунь» і без доданого пояснення, чи слід розуміти вислів буквально або гіперболічно.
translation_notes:
  register: Сучасна літературна українська з гідним, безпосереднім звучанням. Збережено різкість наказів і метафору спотикання; книжне та потенційно двозначне «член тіла» замінено природнішим «частина тіла». Маркер примітки про геєну поставлено безпосередньо після відповідного слова.
