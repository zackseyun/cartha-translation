  text: ἔστω δὲ ὁ λόγος ὑμῶν ναὶ ναί, οὒ οὔ· τὸ δὲ περισσὸν τούτων ἐκ τοῦ πονηροῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/037.yaml
  text: But let your word be[a], ‘Yes, yes,’ or ‘No, no.’ Anything beyond these is from the evil one.
translation:
  language: uk
  text: 'А ваше слово нехай буде: «Так, так» або «Ні, ні». А все, що понад це, — від лукавого.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «від зла». Грецьке τοῦ πονηροῦ можна розуміти особово («від лукавого») або безособово («від зла»).'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστω
  choice: нехай буде
  rationale: Форма наказового способу третьої особи однини від εἰμί природно передається українською спонукальною конструкцією «нехай буде».
- source_word: λόγος
  choice: слово
  rationale: У цьому контексті йдеться про те, що людина говорить; «слово» зберігає стислий, афористичний характер вислову.
- source_word: ναὶ ναί, οὒ οὔ
  choice: «Так, так» або «Ні, ні»
  rationale: Подвоєння часток збережено відповідно до грецького тексту, а «або» природно виражає протиставлення двох відповідей.
- source_word: τὸ δὲ περισσὸν τούτων
  choice: А все, що понад це
  rationale: Субстантивований прикметник περισσόν позначає все, що виходить за межі щойно названих простих відповідей; однина «це» природно відсилає до всього вислову.
- source_word: ἐκ
  choice: від
  rationale: Прийменник позначає джерело або походження; у сполученні «від лукавого» це природна українська відповідність.
- source_word: τοῦ πονηροῦ
  choice: лукавого
  rationale: Артикльована форма може мати особове значення — «лукавий», тобто злий супротивник. У Матвія таке розуміння ймовірне, однак граматично можливе також безособове «зло», що зазначено у примітці.
theological_decisions:
- issue: Особове чи безособове значення τοῦ πονηροῦ
  choice: від лукавого
  alternative: від зла
  rationale: Грецький вислів граматично допускає обидва значення. Основний текст передає ймовірне для Матвія особове значення, не усуваючи альтернативи, яку наведено в примітці.
translation_notes:
  register: Сучасна нормативна українська мова; виклад стислий і гідний, із збереженням наказової конструкції, ритмічного подвоєння «так/ні» та богословської неоднозначності останньої фрази.
