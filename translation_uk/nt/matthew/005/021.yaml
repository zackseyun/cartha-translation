  text: Ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐ φονεύσεις· ὃς δ’ ἂν φονεύσῃ, ἔνοχος ἔσται τῇ κρίσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/021.yaml
  text: You have heard that it was said to the ancients[a], ‘You shall not murder[c][b]; and whoever murders will be liable to judgment.’
translation:
  language: uk
  text: 'Ви чули, що людям давніх часів[a] було сказано: «Не вбивай[b]; а хто вб’є, той підлягатиме суду».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «давнім».'
    reason: lexical_alternative
  - marker: b
    text: Грецьке слово означає саме протиправно позбавити людину життя, тобто вчинити вбивство, а не просто будь-яке позбавлення життя.
    reason: lexical_clarification
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Ви чули
  rationale: Український минулий час природно передає формулу про раніше почуте й досі відоме вчення.
- source_word: ἐρρέθη
  choice: було сказано
  rationale: Безособова пасивна конструкція зберігає невизначеним мовця й не додає тлумачення.
- source_word: τοῖς ἀρχαίοις
  choice: давнім
  rationale: 'Передає датив адресата: людям давніх часів. Лаконічність відповідає грецькому вислову, а примітка пояснює можливе розгортання.'
- source_word: Οὐ φονεύσεις
  choice: Не вбивай
  rationale: У контексті заповіді це усталене й природне українське формулювання; примітка уточнює, що φονεύω означає саме протиправне позбавлення життя, тобто вбивство, а не будь-яке умертвіння.
- source_word: ὃς δ’ ἂν φονεύσῃ
  choice: а хто вб’є
  rationale: Природно передає неозначену загальну умову з ἄν та аористом кон’юнктива.
- source_word: ἔνοχος ἔσται
  choice: підлягатиме
  rationale: Передає юридичну відповідальність або підсудність, а не лише абстрактну винуватість.
- source_word: τῇ κρίσει
  choice: суду
  rationale: Зберігає судово-правове значення κρίσις, не уточнюючи без достатніх підстав, чи йдеться про конкретну судову установу, вирок або осуд.
theological_decisions:
- issue: Зміст шостої заповіді
  choice: «Не вбивай» із приміткою про протиправне вбивство
  alternative: «Не чини вбивства»
  rationale: Грецьке φονεύω вужче за загальне «позбавляти життя» і стосується вбивства. Основний текст зберігає природну й упізнавану українську форму заповіді, а примітка запобігає хибному поширенню її формулювання на будь-яке умертвіння.
- issue: Адресат вислову ἐρρέθη
  choice: «було сказано давнім»
  alternative: «було сказано про давніх»
  rationale: Давальний відмінок τοῖς ἀρχαίοις найприродніше позначає одержувачів сказаного. Переклад не перетворює їх на предмет вислову.
- issue: Значення τῇ κρίσει
  choice: «суду»
  alternative: «судовому осуду» або «судовій раді»
  rationale: Грецьке слово допускає юридичний відтінок, але саме по собі тут не вимагає ні богословського «осуду», ні назви конкретного органу.
translation_notes:
  register: Сучасна нормативна українська мова з гідним, виразним ритмом. Займенник «Ви» вжито як множину для звернення до слухачів. Пунктуація подає заповідь і правовий наслідок як єдину цитовану традицію, водночас δέ передано сполучником «а».
