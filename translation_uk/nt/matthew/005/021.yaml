  naturalness: The sentence is generally fluent and suitably elevated. «Людям давніх часів було сказано» is clearer and more idiomatic in modern standard Ukrainian than «було сказано давнім».
  terminology: The legal rendering «підлягатиме суду» appropriately retains the non-specific judicial force of ἔνοχος ἔσται τῇ κρίσει. Retain «Не вбивай» in the text together with the lexical clarification, rather than introducing a less idiomatic legal paraphrase into the commandment itself.
