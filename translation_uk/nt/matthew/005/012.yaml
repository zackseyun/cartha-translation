  text: χαίρετε καὶ ἀγαλλιᾶσθε, ὅτι ὁ μισθὸς ὑμῶν πολὺς ἐν τοῖς οὐρανοῖς· οὕτως γὰρ ἐδίωξαν τοὺς προφήτας τοὺς πρὸ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/012.yaml
  text: Rejoice and be very glad[a], because your reward is great in the heavens; for in this way they persecuted the prophets who were before you.
translation:
  language: uk
  text: Радійте й веселіться, бо велика ваша нагорода на небесах[a]; адже так переслідували пророків, які були перед вами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «на небі». Грецький текст має форму множини — «на небесах».
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρετε
  choice: Радійте
  rationale: Теперішній наказовий спосіб у множині закликає до діяльної радості; «радійте» є природним і усталеним українським відповідником.
- source_word: ἀγαλλιᾶσθε
  choice: веселіться
  rationale: Дієслово підсилює попередній заклик і виражає бурхливу, явну радість. У парі «радійте й веселіться» це звучить природно, зрозуміло й гідно.
- source_word: μισθὸς
  choice: нагорода
  rationale: У контексті Божої відплати за переслідування «нагорода» передає значення краще за комерційно забарвлену «плату».
- source_word: πολὺς
  choice: велика
  rationale: Прикметник указує на величину нагороди; українська сполука «велика нагорода» є природною.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: на небесах
  rationale: Збережено множину грецького тексту. Українське «на небесах» водночас природне й традиційне.
- source_word: οὕτως
  choice: так
  rationale: Прислівник указує на подібний спосіб переслідування; лаконічне «так» природно передає цей порівняльний зв’язок.
- source_word: ἐδίωξαν
  choice: переслідували
  rationale: У контексті ворожого ставлення дієслово має чітке значення переслідування, а не нейтрального слідування.
- source_word: προφήτας
  choice: пророків
  rationale: Стандартний український відповідник для пророків Ізраїлю.
- source_word: τοὺς πρὸ ὑμῶν
  choice: які були перед вами
  rationale: Передає історичне передування пророків адресатам, не додаючи до тексту уточнення «жили» чи «прийшли».
theological_decisions:
- issue: Значення вислову «на небесах»
  choice: 'Збережено множину: «на небесах».'
  alternative: «На небі».
  rationale: Грецький текст має множину, яка в Матвія часто відбиває семітський спосіб вислову. Обидва варіанти можуть указувати на небесну сферу; переклад не уточнює понад текст, як саме там перебуває нагорода.
translation_notes:
  register: Сучасна нормативна українська з гідним, загальнозрозумілим біблійним звучанням. Координація «радійте й веселіться» зберігає наростання двох грецьких наказів; крапка з комою перед «адже» відтворює тісний пояснювальний зв’язок між частинами.
