  text: ἐὰν γὰρ ἀγαπήσητε τοὺς ἀγαπῶντας ὑμᾶς, τίνα μισθὸν ἔχετε; οὐχὶ καὶ οἱ τελῶναι ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/046.yaml
  text: For if you love those who love you[a], what reward do you have? Do not even the tax collectors do the same?
translation:
  language: uk
  text: Бо якщо ви любите тих, хто любить вас, яку нагороду[a] ви маєте? Хіба навіть збирачі податків не роблять того самого?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «плату». Грецьке слово може означати як плату, так і нагороду; тут ідеться про винагороду в контексті Ісусового повчання.'
    reason: lexical_alternative
  - marker: b
    text: У деяких рукописах немає слів «те саме»; зміст запитання істотно не змінюється.
    reason: textual_variant
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: Бо якщо
  rationale: «Бо» зберігає зв’язок із попереднім обґрунтуванням, а «якщо» природно передає умову.
- source_word: ἀγαπήσητε … τοὺς ἀγαπῶντας ὑμᾶς
  choice: ви любите тих, хто любить вас
  rationale: Теперішній час природно передає загальну умову; повтор дієслова «любити» зберігає грецьку лексичну відповідність.
- source_word: τίνα μισθὸν ἔχετε
  choice: яку нагороду ви маєте
  rationale: μισθός може означати плату або нагороду; у контексті етичного повчання «нагорода» звучить природно й не зводить вислів до трудової оплати.
- source_word: οὐχὶ καὶ
  choice: Хіба навіть … не
  rationale: Конструкція передає риторичне запитання, що передбачає ствердну відповідь, а «навіть» відтворює підсилювальну силу καί.
- source_word: οἱ τελῶναι
  choice: збирачі податків
  rationale: Зрозумілий сучасному читачеві відповідник для осіб, які збирали податки й мита; він точніший у цьому історичному контексті, ніж сучасне вузьке значення слова «митники».
- source_word: τὸ αὐτὸ ποιοῦσιν
  choice: роблять те саме
  rationale: Природний український відповідник, який прямо зберігає зміст грецького вислову.
theological_decisions:
- issue: Значення μισθός в етичному вченні Ісуса
  choice: нагорода
  alternative: плата; відплата
  rationale: «Нагорода» зберігає думку про належну винагороду в ширшому контексті Нагірної проповіді, не нав’язуючи механічного вчення про заслуги.
translation_notes:
  register: Сучасна стандартна українська мова; виклад природний, ясний і гідний. Риторичну силу запитання збережено без конфесійно забарвленої термінології.
