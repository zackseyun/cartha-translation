review_pass:
  verdict: revise
  source_fidelity: The clause structure and rhetorical questions are accurately represented. However, ἐθνικοί primarily denotes Gentiles/non-Jews in this Jewish-context contrast. «Язичники» is a possible traditional contextual rendering, but in current Ukrainian it more narrowly foregrounds pagan religion and can obscure the ethnic/group sense retained by the Greek and the English audit trail.
  naturalness: The Ukrainian is fluent, modern, and appropriately dignified. «Хіба й ... не роблять так само?» naturally conveys οὐχὶ ... ποιοῦσιν. «Що особливого ви робите?» is idiomatic and effectively renders τί περισσὸν ποιεῖτε.
  terminology: «Вітаєте», «лише», «братів», and «так само» are well chosen. Replacing «язичники» in the main text with «неєвреї» better preserves the contextual sense of ἐθνικοί without making a religious judgment intrinsic to the term; «язичники» may remain as a footnoted alternative.
  issues:
  - severity: medium
    issue: «Язичники» as the unqualified main-text rendering of ἐθνικοί
    rationale: Although traditional and possible in Matthew, «язичники» in modern Ukrainian usually means adherents of pagan religion. Here ἐθνικοί contrasts Jesus' hearers with non-Jews/Gentiles. «Неєвреї» conveys that contrast more directly and avoids narrowing the source term's reference.
  revised_text: І якщо ви вітаєте лише своїх братів[a], то що особливого ви робите?[b] Хіба й неєвреї[c] не роблять так само?
