- from: І якщо ви вітаєте лише своїх братів[a], то що особливого ви робите?[b] Хіба й язичники[c] не роблять так само?
  to: І якщо ви вітаєте лише своїх братів[a], то що особливого ви робите?[b] Хіба й неєвреї[c] не роблять так само?
  rationale: A single lexical revision changes the main rendering of ἐθνικοί from the religiously narrower «язичники» to «неєвреї», which best reflects its Gentile/non-Jewish sense in this context and aligns with the English audit trail. The alternative traditional rendering is retained in a footnote. No other change is needed.
  reviewer_model: gpt-5.6-terra
