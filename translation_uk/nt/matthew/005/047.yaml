source:
  edition: SBLGNT
  text: καὶ ἐὰν ἀσπάσησθε τοὺς ⸀ἀδελφοὺς ὑμῶν μόνον, τί περισσὸν ποιεῖτε; οὐχὶ καὶ οἱ ⸀ἐθνικοὶ ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/047.yaml
  text: And if you greet only your brothers[c][b][a], what are you doing that is extraordinary? Do not even the Gentiles do the same?
translation:
  language: uk
  text: І якщо ви вітаєте лише своїх братів[a], то що особливого ви робите?[b] Хіба й неєвреї[c] не роблять так само?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «братів і сестер»; грецьке слово буквально означає «братів», але тут може ширше стосуватися членів своєї спільноти.
    reason: lexical_alternative
  - marker: b
    text: 'Буквальніше: «що більше ви робите?»'
    reason: lexical_alternative
  - marker: c
    text: Або «язичники».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσησθε
  choice: вітаєте
  rationale: Дієслово означає звертатися до когось із привітанням; «вітаєте» природно передає цю звичайну соціальну дію без доданого значення гостинності.
- source_word: ἀδελφοὺς
  choice: братів
  rationale: Збережено граматично чоловічу форму грецького іменника; у контексті слово може ширше означати членів своєї спільноти, що зазначено у примітці.
- source_word: μόνον
  choice: лише
  rationale: Слово обмежує коло тих, кого вітають; «лише» є ясним і природним відповідником.
- source_word: τί περισσὸν ποιεῖτε
  choice: що особливого ви робите
  rationale: περισσόν позначає те, що виходить за межі звичайного або перевершує його. «Що особливого» природно передає риторичну силу вислову; буквальніше «що більше» подано в примітці.
- source_word: ἐθνικοὶ
  choice: язичники
  rationale: У цьому юдейському контексті слово позначає людей з інших народів, тобто неєвреїв. Традиційне українське «язичники» стисло передає протиставлення, а можливий етнічний відтінок уточнено в примітці.
- source_word: τὸ αὐτό
  choice: так само
  rationale: Це природний український відповідник вислову «робити те саме» у риторичному запитанні.
theological_decisions:
- issue: Обсяг значення ἀδελφοὺς в етичній настанові
  choice: У головному тексті — «братів».
  alternative: «братів і сестер» або «членів своєї спільноти».
  rationale: Чоловічу множину оригіналу збережено, але примітка не звужує можливий референт лише до рідних братів або чоловіків.
- issue: Значення ἐθνικοὶ
  choice: У головному тексті — «язичники».
  alternative: «люди з інших народів» або «неєвреї».
  rationale: Вислів передає погляд із юдейського контексту на тих, хто перебуває поза Ізраїлем; примітка зберігає етнічний зміст і не робить слово суто оцінкою особистої побожності.
translation_notes:
  register: Сучасна літературна українська мова з гідним, але доступним синтаксисом. Риторичну форму обох запитань збережено; частка «хіба» природно передає очікувану ствердну відповідь на οὐχί.
