id: MAT.5.22
reference: Matthew 5:22
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ ὀργιζόμενος τῷ ἀδελφῷ ⸀αὐτοῦ ἔνοχος ἔσται τῇ κρίσει· ὃς δ’ ἂν εἴπῃ τῷ ἀδελφῷ αὐτοῦ· Ῥακά, ἔνοχος ἔσται τῷ συνεδρίῳ· ὃς δ’ ἂν εἴπῃ· Μωρέ, ἔνοχος ἔσται εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/022.yaml
  text: But I say to you that everyone who is angry with his brother will be liable to the judgment[a]; and whoever says to his brother, ‘Raca,’ will be liable to the council; and whoever says[e][d][c][b], ‘Fool,’ will be liable to the Gehenna of fire.
translation:
  language: uk
  text: 'А Я кажу вам: кожен, хто гнівається на свого брата[a], підлягатиме суду; а хто скаже своєму братові: «Рака!»[b], підлягатиме раді[c]; а хто скаже: «Дурню!», підлягатиме вогняній геєні[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Деякі рукописи після слів «гнівається на свого брата» додають «безпідставно». Найдавніші й найкраще засвідчені рукописи цього слова не мають. Слово «брат» тут може вживатися представницьки, тому вислів стосується не лише рідних братів і не лише чоловіків.
    reason: textual_variant_and_lexical_note
  - marker: b
    text: '«Рака» — арамейське зневажливе слово, приблизно: «пустоголовий» або «нікчема».'
    reason: cultural_note
  - marker: c
    text: 'Або: «Синедріону» — юдейській верховній раді.'
    reason: alternative_reading
  - marker: d
    text: 'Або: «вогняному пеклу». «Геєна» — назва, пов’язана з долиною Гіннома та образом Божого суду.'
    reason: alternative_reading_and_cultural_note
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: А Я кажу вам
  rationale: Зберігає виразне протиставлення, передане ἐγώ та δέ, і природно звучить українською; займенник «Я» передає емфазу.
- source_word: πᾶς ὁ ὀργιζόμενος
  choice: кожен, хто гнівається
  rationale: Передає узагальнювальну силу субстантивованого дієприкметника теперішнього часу, не звужуючи вислів до одноразового спалаху гніву.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: на свого брата
  rationale: Керування «гніватися на кого» є природним у сучасній українській; «брата» зберігає граматично чоловічий одниновий іменник джерела, тоді як його ширший представницький сенс пояснено в примітці.
- source_word: ἔνοχος ἔσται
  choice: підлягатиме
  rationale: Передає юридичний сенс відповідальності й загрози покарання та підтримує паралелізм трьох застережень.
- source_word: τῇ κρίσει
  choice: суду
  rationale: Зберігає судове значення κρίσις, не вирішуючи надмірно конкретно, чи йдеться про певний місцевий суд, чи про судовий розгляд.
- source_word: Ῥακά
  choice: Рака
  rationale: Арамейську зневажливу назву збережено транслітерацією, як у грецькому тексті, а приблизне значення подано в примітці.
- source_word: τῷ συνεδρίῳ
  choice: раді
  rationale: Відтворює загальне значення συνέδριον і не нав'язує як безсумнівну конкретну ідентифікацію із Синедріоном; ця можливість зазначена в примітці.
- source_word: Μωρέ
  choice: Дурню!
  rationale: Клична форма прямо передає образливе звертання; «дурню» природніше українською за називне «дурень» і зберігає моральну вагу вислову.
- source_word: εἰς τὴν γέενναν τοῦ πυρός
  choice: вогняній геєні
  rationale: «Геєна» зберігає конкретний історико-образний термін Ісуса, а прикметник «вогняній» природно передає грецький родовий зворот τοῦ πυρός.
theological_decisions:
- issue: Передача γέεννα
  choice: геєна
  alternative: пекло
  rationale: Збереження терміна «геєна» утримує юдейське історичне тло й образ долини Гіннома, не ототожнюючи його без пояснення з усім спектром пізніших уявлень про пекло.
- issue: Обсяг значення ἀδελφός
  choice: брат
  alternative: брат або сестра; ближній; одновірець
  rationale: Основний текст зберігає чоловічий одниновий відповідник грецького слова, водночас примітка пояснює, що в такому вислові воно може мати представницьке, ширше застосування.
- issue: Текстовий варіант після ὀργιζόμενος
  choice: без додатку «безпідставно»
  alternative: хто безпідставно гнівається
  rationale: SBLGNT не включає εἰκῇ до основного тексту; його наявність у частині рукописів відзначено, але не внесено до перекладу.
- issue: Ідентифікація συνεδρίον
  choice: рада
  alternative: Синедріон
  rationale: Загальніший відповідник зберігає можливу неоднозначність між радою як судовим органом і конкретним юдейським Синедріоном.
translation_notes:
  register: Сучасна стандартна українська з урочистим, але загальнозрозумілим біблійним звучанням. Синтаксис зберігає триступеневий судовий паралелізм оригіналу. Архаїзмів уникнено; культурно навантажені «Рака» і «геєна» збережено та пояснено в примітках.
