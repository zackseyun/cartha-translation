  naturalness: Текст звучить сучасною нормативною українською, з доречним урочистим біблійним регістром. Форми «Дурню!» та «вогняній геєні» природні й зрозумілі в цьому контексті. Повтор «підлягатиме» вдало відтворює структурний паралелізм оригіналу.
  terminology: «Рака» належно збережено транслітерацією і пояснено. «Рада» обґрунтовано лишається загальним відповідником συνέδριον, а можливість «Синедріон» винесено до примітки. «Геєна» точно зберігає специфічний термін γέεννα без передчасного ототожнення з ширшим поняттям «пекло». Примітка до «брата» коректно пояснює представницьке вживання без зміни тексту.
