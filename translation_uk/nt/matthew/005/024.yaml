  text: ἄφες ἐκεῖ τὸ δῶρόν σου ἔμπροσθεν τοῦ θυσιαστηρίου καὶ ὕπαγε πρῶτον διαλλάγηθι τῷ ἀδελφῷ σου, καὶ τότε ἐλθὼν πρόσφερε τὸ δῶρόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/024.yaml
  text: leave your gift there before the altar[a], and go; first be reconciled to your brother[b], and then come and offer your gift.
translation:
  language: uk
  text: залиш свій дар там перед жертовником і піди; спершу примирися зі своїм братом[a], а тоді прийди й принеси свій дар.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Грецьке слово стоїть у чоловічому роді однини: «братом»; у цьому контексті принцип примирення може стосуватися й інших людей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφες
  choice: залиш
  rationale: У цьому конкретному контексті дієслово означає залишити предмет на місці, а не «простити» чи «дозволити».
- source_word: ἐκεῖ
  choice: там
  rationale: Збережено просторову вказівку на місце біля жертовника.
- source_word: τὸ δῶρόν σου
  choice: свій дар
  rationale: «Дар» прямо передає δῶρον; жертовний контекст уже зрозумілий зі згадки про жертовник і подальшого дієслова принесення.
- source_word: ἔμπροσθεν τοῦ θυσιαστηρίου
  choice: перед жертовником
  rationale: Природна українська конструкція, що точно зберігає просторове відношення.
- source_word: ὕπαγε
  choice: піди
  rationale: Стислий природний наказ руху, який послідовно веде до наступної дії.
- source_word: πρῶτον
  choice: спершу
  rationale: Виразно зберігає встановлену в тексті першість примирення перед принесенням дару.
- source_word: διαλλάγηθι τῷ ἀδελφῷ σου
  choice: примирися зі своїм братом
  rationale: «Примирися» природно передає входження у стан відновлених стосунків, а прийменникова конструкція «з братом» є нормативною сучасною українською відповідністю давальному відмінку при грецькому дієслові.
- source_word: τότε
  choice: а тоді
  rationale: Збережено часову послідовність і природний зв’язок між наказами.
- source_word: ἐλθὼν
  choice: прийди
  rationale: Грецький дієприкметник природно передано особовою формою в послідовності наказів; значення повернення не додано прямо, бо його лише підказує контекст.
- source_word: πρόσφερε
  choice: принеси
  rationale: У культовому контексті «принести дар» є природним українським висловом для представлення дару Богові.
theological_decisions:
- issue: Значення ἀδελφός у настанові про міжособистісне примирення
  choice: братом
  alternative: братом чи сестрою; ближнім
  rationale: Грецький текст має чоловічий рід в однині, тому основний текст зберігає «братом». Примітка зазначає можливе ширше застосування етичного принципу, не підмінюючи форму джерела.
- issue: Характер примирення у формі διαλλάγηθι
  choice: примирися
  alternative: будь примирений
  rationale: Українська зворотна форма природно передає наказ увійти у стан примирення, не уточнюючи понад текст, хто саме має започаткувати або завершити цей процес.
translation_notes:
  register: Сучасна нормативна українська мова з гідним, ясним і стислим синтаксисом. Збережено наказовий ритм оригіналу, культові терміни «дар» і «жертовник» та часову першість примирення.
