  text: You have heard that it was said[a], ‘You shall not commit adultery.’
translation:
  language: uk
  text: 'Ви чули, що було сказано[a]: «Не чини перелюбу».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або, буквальніше: «Ви почули, що було сказано».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Ви чули
  rationale: Аорист у цій вступній формулі природно передається українським минулим часом; вислів стосується того, що слухачі вже чули як відому заповідь.
- source_word: ὅτι
  choice: що
  rationale: Сполучник вводить зміст почутого й природно передається українським «що».
- source_word: ἐρρέθη
  choice: було сказано
  rationale: Безособова пасивна конструкція точно й природно відтворює аорист пасивного стану λέγω, не уточнюючи мовця.
- source_word: Οὐ μοιχεύσεις
  choice: Не чини перелюбу
  rationale: Майбутній індикатив із запереченням має силу заборони й цитує формулу Декалогу. Український наказовий вислів «Не чини перелюбу» є усталеним, точним і зберігає урочистий характер заповіді.
theological_decisions:
- issue: Зв’язок із заповіддю Декалогу
  choice: Не чини перелюбу
  alternative: Не перелюбствуй
  rationale: Обрано ясну сучасну форму, яка зберігає юридично-заповідний характер цитати й не додає тлумачення; альтернативне «не перелюбствуй» менш природне в сучасній загальновживаній українській.
translation_notes:
  register: Сучасна стандартна українська; виклад природний і гідний. Цитату заповіді передано стислою наказовою формою, а пасив «було сказано» залишено без уточнення діяча відповідно до грецького тексту.
