  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Ὑμεῖς ἐστε τὸ ἅλας τῆς γῆς· ἐὰν δὲ τὸ ἅλας μωρανθῇ, ἐν τίνι ἁλισθήσεται; εἰς οὐδὲν ἰσχύει ἔτι εἰ μὴ ⸂βληθὲν ἔξω⸃ καταπατεῖσθαι ὑπὸ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/013.yaml
  text: You are the salt of the earth. But if the salt becomes tasteless[a], with what will it be made salty? It is no longer good for anything except to be thrown out and trampled underfoot by men.
translation:
  language: uk
  text: Ви — сіль землі. Та якщо сіль утратить солоність, чим її знову зробити солоною? Вона вже ні на що не придатна, хіба що бути викинутою геть і потоптаною людьми.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς
  choice: Ви
  rationale: Окремо вжитий займенник у грецькому тексті має наголос; українська конструкція «Ви — сіль землі» природно передає цей акцент.
- source_word: τὸ ἅλας τῆς γῆς
  choice: сіль землі
  rationale: γῆ може означати «земля», «край» або «ґрунт»; у широкій метафорі цього контексту природним відповідником є «земля».
- source_word: μωρανθῇ
  choice: втратить смак
  rationale: Щодо солі дієслово означає стати несмачною, прісною; цей вислів природно передає образ, не підмінюючи його буквальним етимологічним значенням «стати нерозумною».
- source_word: ἐν τίνι ἁλισθήσεται;
  choice: чим її зробити солоною?
  rationale: Збережено питання про засіб, яким сіль могла б знову стати солоною, та пасивний зміст грецької форми передано природною українською конструкцією.
- source_word: εἰς οὐδὲν ἰσχύει ἔτι
  choice: Вона вже ні на що не придатна
  rationale: У цьому контексті ἰσχύω виражає практичну придатність або корисність.
- source_word: εἰ μὴ βληθὲν ἔξω
  choice: хіба що викинути її геть
  rationale: «Викинути» природно передає дію, а «геть» зберігає просторово-відсторонювальну силу ἔξω.
- source_word: καταπατεῖσθαι
  choice: топтали її ногами
  rationale: Відтворює виразний образ затоптування, зрозумілий сучасному читачеві.
- source_word: ὑπὸ τῶν ἀνθρώπων
  choice: люди
  rationale: ἄνθρωποι тут означає людей загалом, без обмеження за статтю; українське «люди» точно й природно передає цей загальнолюдський зміст.
theological_decisions:
- issue: Загальнолюдський зміст ὑπὸ τῶν ἀνθρώπων
  choice: щоб люди топтали її ногами
  alternative: щоб чоловіки топтали її ногами
  rationale: Іменник ἄνθρωποι в контексті стосується людей загалом, а не лише осіб чоловічої статі. Українське «люди» зберігає реальний обсяг значення без конфесійного чи доктринального уточнення.
- issue: Образ солі, що μωρανθῇ
  choice: якщо сіль втратить смак
  alternative: якщо сіль стане нерозумною
  rationale: У поєднанні із сіллю дієслово має переносне значення втрати смаку або солоності. Етимологічну гру з «нерозумністю» не слід нав’язувати основному тексту, однак образ неможливості відновити таку сіль збережено наступним питанням.
translation_notes:
  register: Сучасна нормативна українська мова; вислів урочистий, але доступний. Тире після «Ви» природно підсилює емфатичний займенник. Гендерної примітки не потрібно, бо українське «люди» прямо відповідає загальному значенню ἄνθρωποι.
