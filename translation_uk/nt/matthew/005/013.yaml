  source_fidelity: 'Початок вірно передає емфатичне «ви», метафору «сіль землі», запит про засіб відновлення солоності та загальнолюдський зміст ἀνθρώπων. Однак «втратить смак» менш точно називає втрату саме солоності, а конструкція «щоб люди топтали її ногами» перетворює другий інфінітив на мету викидання, тоді як грецький текст координує два наслідки: бути викинутою і бути потоптаною.'
