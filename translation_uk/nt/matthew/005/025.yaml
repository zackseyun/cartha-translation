revisions:
- from: Швидко виявляй доброзичливість до свого супротивника в суді[a], поки ти ще з ним у дорозі, щоб супротивник не віддав тебе судді, суддя — служителеві, а тебе не кинули до в’язниці.
  to: Якнайшвидше виявляй доброзичливість до свого супротивника, поки ти з ним у дорозі, аби твій супротивник не віддав тебе судді, а суддя — службовцеві, і тебе не кинули до в’язниці.
  rationale: Вилучено невиражене уточнення «у суді», збережено конкретний образ спільної дороги та юридичну послідовність, яку текст сам створює. «Якнайшвидше» природно передає ταχύ, а «службовцеві» уточнює функцію ὑπηρέτης як посадовця без надмірної історико-правової конкретизації. Ідіоматичний варіант із досягненням згоди залишено лише у примітці.
