source:
  edition: SBLGNT
  text: ἴσθι εὐνοῶν τῷ ἀντιδίκῳ σου ταχὺ ἕως ὅτου εἶ ⸂μετ’ αὐτοῦ ἐν τῇ ὁδῷ⸃, μήποτέ σε παραδῷ ὁ ἀντίδικος τῷ κριτῇ, καὶ ὁ ⸀κριτὴς τῷ ὑπηρέτῃ, καὶ εἰς φυλακὴν βληθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/025.yaml
  text: Be well-disposed toward your accuser quickly[a], while you are with him on the way, lest your accuser hand you over to the judge, and the judge to the officer, and you be thrown into prison.
translation:
  language: uk
  text: Якнайшвидше виявляй доброзичливість до свого супротивника, поки ти з ним у дорозі, аби твій супротивник не віддав тебе судді, а суддя — службовцеві, і тебе не кинули до в’язниці.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴσθι εὐνοῶν
  choice: виявляй доброзичливість
  rationale: Передає тривалу настанову, виражену конструкцією «будь» із дієприкметником, і зберігає основне значення εὐνοέω — бути прихильно налаштованим, не звужуючи його безпосередньо до укладення угоди.
- source_word: ἀντιδίκῳ / ἀντίδικος
  choice: супротивник у суді / супротивник
  rationale: ἀντίδικος означає процесуального опонента; уточнення «у суді» при першій згадці природно виявляє юридичний зміст, підтверджений подальшими словами про суддю, служителя і в’язницю.
- source_word: ταχὺ
  choice: швидко
  rationale: Безпосередньо передає нагальність наказу.
- source_word: ἕως ὅτου εἶ μετ’ αὐτοῦ ἐν τῇ ὁδῷ
  choice: поки ти ще з ним у дорозі
  rationale: Зберігає конкретний образ спільної дороги й не додає прямо не висловленого уточнення «до суду».
- source_word: μήποτέ
  choice: щоб ... не
  rationale: Природна сучасна українська конструкція для застереження про небажаний можливий наслідок.
- source_word: παραδῷ
  choice: віддав
  rationale: Передає судове передання особи під владу іншої посадової особи.
- source_word: κριτῇ / κριτής
  choice: судді / суддя
  rationale: Стандартний і точний відповідник у юридичному контексті.
- source_word: ὑπηρέτῃ
  choice: служителеві
  rationale: Зберігає ширше значення підлеглої посадової особи, яка виконує розпорядження судді, не нав’язуючи культурно специфічної посади на кшталт судового пристава.
- source_word: εἰς φυλακὴν
  choice: до в’язниці
  rationale: Природний український відповідник для місця ув’язнення.
- source_word: βληθήσῃ
  choice: тебе не кинули
  rationale: Зберігає виразну силу пасивної форми βάλλω та узгоджується з українською конструкцією застереження.
theological_decisions:
- issue: Чи передавати початковий наказ як юридичне примирення, чи як прихильне ставлення до процесуального опонента
  choice: 'У головному тексті збережено лексичне значення: «виявляй доброзичливість».'
  alternative: «Швидко домовся зі своїм супротивником у суді» або «швидко владнай справу».
  rationale: Юридичний контекст допускає значення досягнення згоди, однак εὐνοέω безпосередньо називає прихильне ставлення. Основний текст зберігає цю широту, а примітка подає контекстуально ймовірний ідіоматичний варіант.
translation_notes:
  register: Сучасна нормативна українська мова з гідним, доступним звучанням. Юридичний контекст окреслено без надмірної конкретизації давньої судової посади; образ дороги та напруження між буквальним значенням прихильності й можливим значенням домовленості збережено.
