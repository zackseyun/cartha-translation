  text: Ὑμεῖς ἐστε τὸ φῶς τοῦ κόσμου. οὐ δύναται πόλις κρυβῆναι ἐπάνω ὄρους κειμένη·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/014.yaml
  text: You are the light of the world[a]. A city set on a hill cannot be hidden.
translation:
  language: uk
  text: Ви — світло світу. Не може бути приховане місто, розташоване на горі.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або, буквальніше: «Місто, що лежить на горі, не може бути приховане».'
    reason: Буквальніше передає порядок слів та дієприкметник κειμένη («що лежить»); основний текст природно передає його як «розташоване».
lexical_decisions:
- source_word: Ὑμεῖς
  choice: Ви
  rationale: Особовий займенник у грецькому тексті виражений явно й має наголос. Українське «Ви» разом із тире природно передає пряме й виразне ототожнення без додавання «самі».
- source_word: τὸ φῶς
  choice: світло
  rationale: Означеність грецького вислову природно передається українською предикативною конструкцією «Ви — світло»; окремий відповідник артикля не потрібний.
- source_word: τοῦ κόσμου
  choice: світу
  rationale: Родовий відмінок безпосередньо зберігає грецьку конструкцію та широку семантику κόσμος, не перетворюючи її на більш тлумачне «для світу».
- source_word: οὐ δύναται
  choice: Не може
  rationale: Природний український відповідник, що зберігає значення неможливості.
- source_word: πόλις
  choice: місто
  rationale: Звичайний відповідник πόλις у цьому образі; «поселення» було б менш конкретним.
- source_word: κρυβῆναι
  choice: сховатися
  rationale: Українська зворотна форма природно передає пасивне значення «бути прихованим» у контексті видимого міста.
- source_word: ἐπάνω ὄρους
  choice: на горі
  rationale: ὄρος може означати гору або височину; «на горі» є прямим і природним відповідником без звуження до пагорба.
- source_word: κειμένη
  choice: розташоване
  rationale: Дієприкметник означає «те, що лежить/розташоване». «Розташоване» природно стосується міста й не припускає окремої дії того, хто його поставив.
theological_decisions:
- issue: Метафоричне ототожнення учнів зі світлом
  choice: «Ви — світло світу»
  alternative: «Ви — світло для світу»
  rationale: Збережено пряму метафору й родовий зв’язок грецького тексту, не додаючи тлумачення мети чи функції.
translation_notes:
  register: Сучасна нормативна українська, проста й урочиста. Тире увиразнює іменну частину присудка; порядок слів у другому реченні зберігає наголос грецького вислову на неможливості приховати таке місто.
