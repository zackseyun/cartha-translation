id: MAT.5.16
reference: Matthew 5:16
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: οὕτως λαμψάτω τὸ φῶς ὑμῶν ἔμπροσθεν τῶν ἀνθρώπων, ὅπως ἴδωσιν ὑμῶν τὰ καλὰ ἔργα καὶ δοξάσωσιν τὸν πατέρα ὑμῶν τὸν ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/016.yaml
  text: In the same way[a], let your light shine before men[b], so that they may see your good works and glorify your Father who is in the heavens.
translation:
  language: uk
  text: Так само нехай ваше світло сяє перед людьми, щоб вони бачили ваші добрі діла й прославляли вашого Отця, Який на небесах.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: Так само
  rationale: Передає зв’язок із попереднім образом світильника та вказує на спосіб дії.
- source_word: λαμψάτω τὸ φῶς ὑμῶν
  choice: нехай ваше світло сяє
  rationale: Природно передає наказовий спосіб третьої особи та зберігає однину «світло».
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: перед людьми
  rationale: ἄνθρωποι тут означає людей загалом; українське «людьми» точно й природно передає інклюзивний зміст без статевого звуження.
- source_word: ὅπως ἴδωσιν
  choice: щоб вони бачили
  rationale: Передає цільову конструкцію ὅπως із кон’юнктивом у природній сучасній українській формі.
- source_word: τὰ καλὰ ἔργα
  choice: добрі діла
  rationale: Усталений біблійний вислів, який передає морально прекрасний і гідний характер καλός, залишаючись зрозумілим.
- source_word: δοξάσωσιν
  choice: прославляли
  rationale: Точно передає δοξάζω щодо Бога; форма узгоджується з цільовою конструкцією «щоб».
- source_word: τὸν πατέρα ὑμῶν
  choice: вашого Отця
  rationale: Природна присвійна конструкція зі збереженням важливої для Матвія родинної назви Бога.
- source_word: τὸν ἐν τοῖς οὐρανοῖς
  choice: Який на небесах
  rationale: Зберігає грецьку множину οὐρανοῖς і водночас звучить природно та гідно українською.
theological_decisions:
- issue: Загальне значення ἀνθρώπων
  choice: перед людьми
  alternative: перед чоловіками
  rationale: У цьому контексті слово позначає людство або людей загалом, а не лише осіб чоловічої статі; українське «людьми» не усуває жодної справжньої неоднозначності.
- issue: Множина οὐρανοῖς
  choice: на небесах
  alternative: на небі
  rationale: Множину оригіналу збережено без нав’язування окремої космологічної чи доктринальної інтерпретації.
- issue: Видимість добрих діл і прославлення Бога
  choice: щоб вони бачили ваші добрі діла й прославляли вашого Отця
  alternative: щоб вони прославляли вас за ваші діла
  rationale: Синтаксис прямо спрямовує кінцеве прославлення до Отця, зберігаючи напруження між видимим свідченням учнів і славою, що належить Богові.
translation_notes:
  register: Сучасна стандартна українська з гідним біблійним звучанням. «Діла» обрано як зрозумілий усталений відповідник ἔργα; синтаксис простий і придатний для публічного читання.
