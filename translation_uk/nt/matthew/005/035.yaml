  text: ані землею, бо вона — підніжок для Його ніг[a]; ані Єрусалимом[b], бо він — місто Великого Царя[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Алюзія на Ісаї 66:1: «земля — підніжок для Моїх ніг».'
    reason: cross_reference
  - marker: b
    text: 'Буквально грецький вислів має напрямне значення «до Єрусалима» або «в напрямку Єрусалима», але тут може функціонувати як ідіоматичний вислів присягання: «Єрусалимом».'
    reason: lexical_alternative
  - marker: c
    text: Алюзія на Псалом 48:2, де Єрусалим названо «містом Великого Царя».
    reason: cross_reference
lexical_decisions:
- source_word: μήτε
  choice: ані
  rationale: Продовжує низку заборон із попереднього вірша; «ані» природно передає заперечне сурядне значення.
- source_word: ἐν τῇ γῇ
  choice: землею
  rationale: 'У контексті присягання прийменникову конструкцію природно передано українським орудним відмінком: «присягатися землею».'
- source_word: γῇ
  choice: землею
  rationale: У протиставленні небу та Єрусалиму йдеться про землю як світ, а не про окремий край.
- source_word: ὅτι
  choice: бо
  rationale: Стисло й природно передає причиновий зв’язок.
- source_word: ὑποπόδιόν
  choice: підніжок
  rationale: Точний і зрозумілий відповідник, який зберігає біблійну образність.
- source_word: τῶν ποδῶν αὐτοῦ
  choice: для його ніг
  rationale: Природна українська конструкція, яка передає функцію підніжка; займенник залишено з малої літери, оскільки грецький текст не має окремого маркування божественного референта.
- source_word: εἰς Ἱεροσόλυμα
  choice: Єрусалимом
  rationale: У формулі присяги εἰς функціонує ідіоматично; орудний відмінок природно передає значення «присягатися Єрусалимом», а буквальний напрямний відтінок зазначено у примітці.
- source_word: πόλις
  choice: місто
  rationale: Прямий і природний відповідник.
- source_word: τοῦ μεγάλου βασιλέως
  choice: великого царя
  rationale: Передає родовий відмінок і зберігає алюзію на Псалом 48:2, не додаючи відсутньої в оригіналі графічної конкретизації референта.
theological_decisions:
- issue: Референт займенника αὐτοῦ у вислові про підніжок
  choice: «його» з малої літери, при тому що контекст указує на Бога
  alternative: «Його» з великої літери, щоб прямо позначити Бога
  rationale: Грецький займенник сам по собі не позначає великої літери; мала літера не усуває очевидного з контексту божественного референта й не додає редакторського уточнення.
- issue: Референт вислову «великий цар»
  choice: «великий цар» з малої літери
  alternative: «великий Цар» або «Великий Цар»
  rationale: Контекст і алюзія вказують на Бога, але сам грецький текст не має графічного способу позначити це як титул; мала літера зберігає формальну неоднозначність.
translation_notes:
  register: Сучасна нормативна українська мова з гідним біблійним звучанням. Орудний відмінок у формулах «землею» та «Єрусалимом» робить вислів природним для українського читача. Малу літеру в «його» та «царя» обрано задля прозорості до грецького тексту; божественний референт залишається зрозумілим із контексту та алюзій.
