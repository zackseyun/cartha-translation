  text: καὶ εἰ ἡ δεξιά σου χεὶρ σκανδαλίζει σε, ἔκκοψον αὐτὴν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου ⸂εἰς γέενναν ἀπέλθῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/030.yaml
  text: And if your right hand causes you to stumble[a], cut it off and throw it away[c][b]. For it is better for you that one of your members should perish than that your whole body should go into Gehenna.
translation:
  language: uk
  text: І якщо твоя права рука змушує тебе спіткнутися[a], відсічи її та відкинь від себе. Бо краще для тебе, щоб загинув один із членів твого тіла, ніж щоб усе твоє тіло пішло до геєни[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «спонукає тебе до гріха». Грецьке дієслово буквально передає думку про те, що хтось або щось спричиняє спотикання.'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «пекла». Геєна — термін, що походить від назви долини Гінном і вживається як образ есхатологічного суду.'
    reason: alternative_reading
lexical_decisions:
- source_word: δεξιά ... χείρ
  choice: твоя права рука
  rationale: Природний український відповідник, що точно зберігає тілесну конкретність грецького вислову.
- source_word: σκανδαλίζει
  choice: змушує тебе спіткнутися
  rationale: Зберігає грецьку метафору спотикання, яка в контексті означає схиляння до гріха; це значення пояснено в примітці.
- source_word: ἔκκοψον
  choice: відрубай
  rationale: Передає рішучий наказ і природно вживається щодо відсікання руки.
- source_word: βάλε ἀπὸ σοῦ
  choice: відкинь від себе
  rationale: Відтворює як силу дієслова βάλε, так і просторове ἀπὸ σοῦ, передаючи рішуче віддалення.
- source_word: συμφέρει γάρ σοι
  choice: Бо краще для тебе
  rationale: Природно передає порівняльну користь у цьому застереженні, без недоречного відтінку матеріального зиску.
- source_word: ἵνα ἀπόληται
  choice: щоб загинув
  rationale: Зберігає серйозність дієслова ἀπόλλυμι та контраст між утратою одного члена і долею всього тіла.
- source_word: ἓν τῶν μελῶν σου
  choice: один із членів твого тіла
  rationale: «Член тіла» є точним і зрозумілим відповідником μέλος; додане «тіла» усуває можливу позатілесну двозначність українського слова «член».
- source_word: ὅλον τὸ σῶμά σου
  choice: усе твоє тіло
  rationale: Природно передає повноту й чітко протиставляє все тіло одному його членові.
- source_word: εἰς γέενναν ἀπέλθῃ
  choice: пішло до геєни
  rationale: Дієслово «пішло» близько передає ἀπέλθῃ, а «до геєни» зберігає напрямок εἰς і сам грецький термін без внесення додаткової дії на кшталт «було вкинуте».
theological_decisions:
- issue: Передача γέεννα
  choice: геєна
  alternative: пекло
  rationale: Транслітерований історично навантажений термін зберігає зв’язок із долиною Гінном і мовою есхатологічного суду, не ототожнюючи його без пояснення з усіма пізнішими уявленнями про пекло.
- issue: Значення σκανδαλίζει
  choice: змушує тебе спіткнутися
  alternative: спонукає тебе до гріха
  rationale: Основний текст зберігає метафору джерела, тоді як примітка подає її контекстуальний моральний зміст, не усуваючи образність оригіналу.
translation_notes:
  register: Сучасна літературна українська мова з урочистою, але доступною синтаксичною будовою. Збережено різку тілесну образність і метафору спотикання; архаїзмів та конфесійно маркованої термінології уникнено.
