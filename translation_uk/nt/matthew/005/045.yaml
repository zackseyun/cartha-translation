  text: ὅπως γένησθε υἱοὶ τοῦ πατρὸς ὑμῶν τοῦ ⸀ἐν οὐρανοῖς, ὅτι τὸν ἥλιον αὐτοῦ ἀνατέλλει ἐπὶ πονηροὺς καὶ ἀγαθοὺς καὶ βρέχει ἐπὶ δικαίους καὶ ἀδίκους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/045.yaml
  text: so that you may become sons of your Father in heaven[a], because he makes his sun rise on evil and good[c][b], and sends rain on righteous and unrighteous.
translation:
  language: uk
  text: щоб ви стали синами[a] вашого Отця, Який на небесах, адже він велить своєму сонцю сходити над злими й добрими та посилає дощ[b] на праведних і неправедних.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «дітьми». Грецький текст буквально має «синами»; це слово збережено в основному тексті задля образу синівства.
    reason: lexical_alternative
  - marker: b
    text: 'Буквальніше: «дощить на праведних і неправедних». Вислів «посилає дощ» природніше звучить українською і зберігає Божу дієву роль.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: щоб
  rationale: Природно вводить мету або очікуваний наслідок, не усуваючи властивого сполучникові відтінку між метою і результатом.
- source_word: γένησθε
  choice: ви стали
  rationale: Передає динамічне значення γίνομαι — «стати», а не статичне «бути»; форма з «щоб» природно відтворює грецький кон’юнктив.
- source_word: υἱοὶ
  choice: синами
  rationale: Зберігає виразно чоловічий родовий образ грецького υἱοί і мову синівства; можливе ширше за змістом «дітьми» подано в примітці.
- source_word: τοῦ πατρὸς ὑμῶν τοῦ ἐν οὐρανοῖς
  choice: вашого Отця, Який на небесах
  rationale: Відтворює окремо і належність («вашого Отця»), і місцеперебування («на небесах»), не згортаючи вислів до прикметника «Небесного».
- source_word: ὅτι
  choice: адже
  rationale: Вводить пояснювальну підставу попередньої думки природною сучасною українською мовою.
- source_word: τὸν ἥλιον αὐτοῦ ἀνατέλλει
  choice: велить своєму сонцю сходити
  rationale: Зберігає явну Божу належність сонця та каузативну силу вислову, водночас звучить природніше, ніж буквальне «піднімає своє сонце».
- source_word: ἐπὶ πονηροὺς καὶ ἀγαθοὺς
  choice: над злими й добрими
  rationale: Прикметники вжито субстантивовано, як у грецькому тексті; стислий паралелізм збережено без доданого іменника «людьми».
- source_word: βρέχει
  choice: посилає дощ
  rationale: Природно передає українською те, що Бог дає дощ, і зберігає його дієву роль; буквальнішу форму зазначено в примітці.
- source_word: ἐπὶ δικαίους καὶ ἀδίκους
  choice: на праведних і неправедних
  rationale: Зберігає усталену моральну пару та субстантивовані прикметники оригіналу.
theological_decisions:
- issue: Родова мова синівства
  choice: синами вашого Отця
  alternative: дітьми вашого Отця
  rationale: Оригінал має υἱοί («сини»), а не τέκνα («діти»). Основний текст зберігає образ синівства, не заперечуючи, що звернення в контексті стосується всіх учнів.
- issue: Значення γένησθε щодо синівства
  choice: щоб ви стали
  alternative: щоб ви були; щоб ви виявилися
  rationale: «Стали» зберігає динамічну силу дієслова, але саме по собі не визначає механізму набуття Божого синівства. Контекст пов’язує вислів із наслідуванням Отцевої доброти, тож переклад не додає окремого сотеріологічного пояснення.
translation_notes:
  register: Сучасна літературна українська мова з гідним біблійним звучанням. Збережено паралельні пари «злі й добрі» та «праведні й неправедні», а також матвіївський вислів «на небесах». Займенники щодо Бога подано з малої літери за загальними нормами сучасного українського правопису; назву «Отець» — з великої як титул.
