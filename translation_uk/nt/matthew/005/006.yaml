  yaml_path: translation/nt/matthew/005/006.yaml
  text: Blessed are those who hunger and thirst for righteousness[a], because they will be filled.
translation:
  language: uk
  text: Блаженні ті, хто голодний і спраглий праведності[a], бо вони наситяться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «справедливості». Грецьке слово може означати праведність, справедливість або те, що є правильним перед Богом.'
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: Блаженні
  rationale: Усталений відповідник у формулах блаженств; передає проголошення Божого благовоління, а не лише психологічне відчуття щастя.
- source_word: οἱ πεινῶντες καὶ διψῶντες
  choice: ті, хто голодний і спраглий
  rationale: Природна сучасна українська конструкція, що зберігає образ постійного сильного прагнення, виражений дієприкметниками теперішнього часу.
- source_word: τὴν δικαιοσύνην
  choice: праведності
  rationale: «Праведність» є містким біблійним відповідником δικαιοσύνη та може охоплювати правильність перед Богом і справедливий лад; можливість перекладу «справедливості» збережено у примітці.
- source_word: ὅτι
  choice: бо
  rationale: Стисло й природно вводить підставу проголошеного блаженства.
- source_word: αὐτοὶ
  choice: вони
  rationale: Окремий займенник передає наявний у грецькому тексті наголос без неприродно важкого «саме вони».
- source_word: χορτασθήσονται
  choice: наситяться
  rationale: Передає майбутній пасивний за значенням результат і прямо продовжує образ голоду та спраги; українська зворотна форма тут природна й не визначає названого діяча.
theological_decisions:
- issue: Значення δικαιοσύνη
  choice: праведність
  alternative: справедливість; те, що правильне перед Богом
  rationale: Грецьке слово може стосуватися як праведності, так і справедливості та належного перед Богом. Основний текст зберігає традиційний широкий термін, а примітка не дає звузити його лише до особистої моральності.
- issue: Неназваний діяч у χορτασθήσονται
  choice: наситяться
  alternative: Бог наситить їх
  rationale: Пасив у грецькому тексті не називає діяча, хоча в контексті блаженств природно мається на увазі Божа дія. Переклад не робить неявного діяча явним.
translation_notes:
  register: Сучасна стандартна українська мова; урочистий, але зрозумілий регістр. Збережено лаконічний паралелізм блаженства та образ голоду, спраги й насичення.
