  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι ⸂πᾶς ὁ ἀπολύων⸃ τὴν γυναῖκα αὐτοῦ παρεκτὸς λόγου πορνείας ποιεῖ αὐτὴν ⸀μοιχευθῆναι, καὶ ὃς ἐὰν ἀπολελυμένην γαμήσῃ μοιχᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/032.yaml
  text: But I say to you that everyone who divorces his wife[a], except on the ground of sexual immorality, makes her commit adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: uk
  text: 'А Я кажу вам: кожен, хто розлучається зі своєю дружиною — крім випадку статевої розпусти[a], — робить її перелюбницею[b]; і хто одружується з розлученою, чинить перелюб.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Грецьке porneia — широке позначення недозволеної статевої поведінки; можливі також переклади «блуд» або «статева аморальність».
    reason: lexical_alternative
  - marker: b
    text: 'Або: «спричиняє те, що вона чинить перелюб». Грецький інфінітив має пасивну форму; можливе також розуміння: «спричиняє перелюб щодо неї».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύων / ἀπολελυμένην
  choice: розлучається / з розлученою
  rationale: У шлюбному контексті ἀπολύω означає розірвати шлюб, тому природне українське «розлучатися» точніше за загальні «відпускати» чи «відсилати». Повторення споріднених форм зберігає зв’язок між двома грецькими формами.
- source_word: γυναῖκα
  choice: дружиною
  rationale: γυνή може означати «жінка» або «дружина»; присвійний займенник і контекст розлучення однозначно вказують тут на дружину.
- source_word: παρεκτὸς λόγου πορνείας
  choice: крім випадку статевої розпусти
  rationale: παρεκτός вводить виняток, λόγος тут має значення «випадок/підстава», а πορνεία є широким позначенням недозволеної статевої поведінки. «Статева розпуста» зберігає широту терміна, не звужуючи його до перелюбу.
- source_word: ποιεῖ αὐτὴν μοιχευθῆναι
  choice: штовхає її до перелюбу
  rationale: Конструкція ποιέω з інфінітивом виражає спричинення. Українське «штовхає її до перелюбу» природно передає причинний зміст, водночас не стверджуючи примусу й не приховуючи складності пасивної форми μοιχευθῆναι; буквальніша можливість наведена у примітці.
- source_word: ὃς ἐὰν ... γαμήσῃ
  choice: хто одружується
  rationale: Відносний зворот з ἐάν виражає загальну невизначену умову; «хто одружується» стисло й природно передає її українською.
- source_word: μοιχᾶται
  choice: чинить перелюб
  rationale: Це усталений і гідний український відповідник дієслова зі значенням вчинення перелюбу.
- source_word: πᾶς ὁ ἀπολύων
  choice: кожен, хто розлучається
  rationale: Чоловічий рід конструкції відповідає конкретній ситуації чоловіка та його дружини, а «кожен, хто» природно передає її узагальнювальну силу.
theological_decisions:
- issue: Значення виняткового звороту παρεκτὸς λόγου πορνείας
  choice: 'Передати як справжній виняток: «крім випадку статевої розпусти».'
  alternative: «крім випадку незаконного шлюбу» або тлумачення звороту не як підстави для винятку
  rationale: Грецький текст прямо містить винятковий зворот, але не уточнює тут точного обсягу πορνεία. Переклад зберігає і виняток, і семантичну широту слова, не вирішуючи богословської суперечки.
- issue: Сила пасивного інфінітива μοιχευθῆναι після ποιεῖ
  choice: 'У тексті: «штовхає її до перелюбу», з буквальнішою пасивно-результативною можливістю у примітці.'
  alternative: «робить її перелюбницею»; «спричиняє перелюб щодо неї»
  rationale: Форма інфінітива пасивна, однак точний смисловий відтінок у цій конструкції дискусійний. Основний текст має бути зрозумілим сучасному читачеві, а примітка зберігає граматичну неоднозначність і богословську напругу.
translation_notes:
  register: Сучасна нормативна українська мова з гідним біблійним звучанням. Початкове «А Я кажу вам» передає виразне ἐγὼ δὲ та контраст із попереднім висловом. Пунктуація виділяє винятковий зворот, не змінюючи його синтаксичної сили.
