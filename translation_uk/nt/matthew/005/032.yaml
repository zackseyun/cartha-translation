review_pass:
  verdict: revise
  source_fidelity: The exception clause and the two divorce-related participles are represented well. However, «штовхає її до перелюбу» weakens ποιεῖ («causes/makes») into mere inducement and does not adequately reflect the resultative/passive nuance of μοιχευθῆναι. «Робить її перелюбницею» is a safe, direct rendering, with the grammatical nuance retained in the note.
  naturalness: The wording is otherwise fluent modern standard Ukrainian. «Робить її перелюбницею» is idiomatic enough in a dignified biblical register and is more precise than «штовхає її до перелюбу».
  terminology: «Дружина», «розлучається», «статева розпуста», and «чинить перелюб» suit the marital and ethical context. The footnote correctly keeps πορνεία broader than «перелюб» and records the passive form of the infinitive.
  issues:
  - severity: medium
    issue: «Штовхає її до перелюбу» for ποιεῖ αὐτὴν μοιχευθῆναι
    rationale: «Штовхати до» commonly denotes urging or pressure and may leave the outcome unrealized. The Greek ποιεῖ plus infinitive expresses causation, while μοιχευθῆναι is passive in form. The draft thus understates the causal/resultative force.
  revised_text: 'А Я кажу вам: кожен, хто розлучається зі своєю дружиною — крім випадку статевої розпусти[a], — робить її перелюбницею[b]; і хто одружується з розлученою, чинить перелюб.'
