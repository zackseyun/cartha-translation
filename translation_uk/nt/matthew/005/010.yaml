  source_fidelity: 'Текст точно передає структуру й зміст грецького оригіналу: μακάριοι — «Блаженні»; субстантивований перфектний пасивний дієприкметник οἱ δεδιωγμένοι природно й стисло відтворено як «переслідувані»; ἕνεκεν δικαιοσύνης — «за праведність»; пояснювальне ὅτι — «бо». «Їхнє Царство Небесне» коректно зберігає теперішній час ἐστιν і присвійний наголос αὐτῶν.'
  naturalness: Формулювання лаконічне, зрозуміле й нормативне для сучасної української мови, водночас має доречне біблійне звучання. Субстантивоване «переслідувані» є природним у цьому афористичному жанрі й не потребує розгорнутого «ті, кого переслідували».
  terminology: «Блаженні», «праведність» і «Царство Небесне» є усталеними, семантично точними відповідниками. Примітка належно зберігає можливий лексичний відтінок «справедливість», не підміняючи основного значення та не нав’язуючи конфесійного тлумачення.
