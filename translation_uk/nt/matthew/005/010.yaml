id: MAT.5.10
reference: Matthew 5:10
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: μακάριοι οἱ δεδιωγμένοι ἕνεκεν δικαιοσύνης, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/010.yaml
  text: Blessed are those who have been persecuted because of righteousness[a], for theirs is the kingdom of heaven.
translation:
  language: uk
  text: Блаженні переслідувані за праведність[a], бо їхнє Царство Небесне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «за справедливість». Грецьке слово може означати як праведність — життя згідно з Божою волею, так і справедливість.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Блаженні
  rationale: Усталений український відповідник у блаженствах; передає проголошення Божого схвалення, а не лише суб’єктивне відчуття щастя.
- source_word: οἱ δεδιωγμένοι
  choice: переслідувані
  rationale: Субстантивований перфектний пасивний дієприкметник. Українська форма природно називає людей, які зазнали переслідування й перебувають у становищі переслідуваних.
- source_word: ἕνεκεν
  choice: за
  rationale: У сполученні «переслідувані за праведність» стисло й природно виражає причину переслідування.
- source_word: δικαιοσύνης
  choice: праведність
  rationale: Зберігає широкий моральний і богословський зміст узгодженості з Божою волею; можливий відтінок справедливості подано у примітці.
- source_word: ὅτι
  choice: бо
  rationale: Природно вводить підставу проголошеного блаженства.
- source_word: αὐτῶν ἐστιν
  choice: їхнє
  rationale: Лаконічно передає присвійний генітив із дієсловом «є»; теперішній час грецького тексту збережено через українське нульове дієслово-зв’язку.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Царство Небесне
  rationale: Природний і впізнаваний український відповідник характерного для Матвія вислову про Боже небесне царювання.
theological_decisions:
- issue: Передача δικαιοσύνη
  choice: праведність
  alternative: справедливість
  rationale: «Праведність» краще зберігає широкий зміст правильного життя відповідно до Божої волі, не звужуючи його лише до суспільної справедливості; справжню лексичну багатозначність зазначено у примітці.
- issue: Часова сила αὐτῶν ἐστιν
  choice: їхнє Царство Небесне
  alternative: їм належатиме Царство Небесне
  rationale: Грецький текст має теперішній час і проголошує нинішню належність Царства; майбутню форму не внесено.
translation_notes:
  register: Сучасна стандартна українська мова з гідним біблійним звучанням. Лаконічну будову блаженства збережено; уникнуто архаїзмів і конфесійно специфічних уточнень.
