lexical_decisions:
- source_word: μακάριοι
  choice: Блаженні
  rationale: Усталений і природний для заповідей блаженства відповідник, який передає Боже схвалення та дароване Ним благополуччя, а не лише суб’єктивне відчуття щастя.
- source_word: οἱ πραεῖς
  choice: лагідні
  rationale: Передає πραΰς як смиренну, стриману лагідність, а не боязкість чи слабкість; прикметник ужито субстантивовано.
- source_word: ὅτι
  choice: бо
  rationale: Природно й стисло вводить підставу проголошеного блаженства.
- source_word: αὐτοὶ
  choice: саме вони
  rationale: Відтворює виразний наголос грецького займенника αὐτοί без неприродної важкості.
- source_word: κληρονομήσουσι
  choice: успадкують
  rationale: Безпосередньо передає майбутню форму κληρονομέω та зберігає мову спадщини й обітниці.
- source_word: τὴν γῆν
  choice: землю
  rationale: 'Українське «землю» природно зберігає двозначність γῆ: усю землю/світ або конкретну обітовану землю, особливо з огляду на відлуння Псалма 37:11.'
theological_decisions:
- issue: Обсяг значення τὴν γῆν
  choice: землю
  alternative: край; обітовану землю
  rationale: Грецьке γῆ допускає як широкий есхатологічний сенс («земля»), так і завітний сенс конкретної землі. Основний текст не звужує цієї напруги, а примітка вказує на ймовірне відлуння Псалма 37:11.
- issue: Характер οἱ πραεῖς
  choice: лагідні
  alternative: сумирні; покірні
  rationale: «Лагідні» передає моральну поставу смиренної незлобивості та самовладання, не ототожнюючи її зі слабкістю або пасивністю.
translation_notes:
  register: Сучасна стандартна українська; стислий, урочистий і зрозумілий регістр заповідей блаженства. «Блаженні» зберігає біблійну гідність, а «бо саме вони» природно передає емфазу αὐτοί.
