  text: І коли хтось примусить тебе пройти одну милю[a], пройди з ним дві милі.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Дієслово може означати примусове залучення до виконання повинності за наказом влади; імовірно, воно відсилає до відомої за римських часів практики примусової служби.
