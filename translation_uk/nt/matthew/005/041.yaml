lexical_decisions:
- source_word: ὅστις
  choice: хто
  rationale: Неозначений відносний займенник описує будь-який загальний випадок; «хто» природно передає цей широкий зміст українською.
- source_word: ἀγγαρεύσει
  choice: примусить тебе пройти
  rationale: Дієслово означає примусове залучення до служби, зокрема на вимогу влади. «Примусить» зберігає значення примусу, а «пройти» природно поєднує його з указаною відстанню.
- source_word: μίλιον ἕν
  choice: одну милю
  rationale: Йдеться про одну римську милю; буквальний образ і конкретну одиницю відстані збережено.
- source_word: ὕπαγε
  choice: пройди
  rationale: Наказовий спосіб означає йти або вирушати; у контексті вимірюваної відстані «пройди» звучить природніше за ізольоване «іди».
- source_word: μετ’ αὐτοῦ
  choice: з ним
  rationale: Прийменник μετά з родовим відмінком виражає супровід; «з ним» є прямим і природним відповідником.
- source_word: δύο
  choice: дві милі
  rationale: У грецькому тексті стоїть лише числівник «дві», а назва одиниці відстані мається на увазі з попередньої частини. Українською іменник доречно повторити для ясності й природності.
theological_decisions:
- issue: Історично-соціальний зміст примусової служби
  choice: Передати примус, не називаючи в основному тексті римського воїна чи посадовця.
  alternative: Прямо уточнити, що йдеться про примусову службу на вимогу римського воїна.
  rationale: Дієслово ἀγγαρεύω та згадка про милю можуть викликати асоціацію з римською практикою примусової служби, однак сам грецький текст не називає ані воїна, ані Рим. Переклад зберігає історичний підтекст, не звужуючи сказаного.
- issue: Чи означають «дві милі» загальну відстань або ще дві додаткові милі
  choice: Передати як загальну відстань у дві милі.
  alternative: Передати як ще дві милі понад першу.
  rationale: Протиставлення μίλιον ἕν і δύο природно означає «одну милю ... дві», а не «одну ... ще дві».
translation_notes:
  register: Сучасна літературна українська, проста й гідна за тоном. Конструкція з «пройди» робить вислів природним у контексті відстані, а повторення «милі» усуває неприродну для української еліптичність без зміни змісту.
