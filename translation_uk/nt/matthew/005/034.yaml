id: MAT.5.34
reference: Matthew 5:34
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ὀμόσαι ὅλως· μήτε ἐν τῷ οὐρανῷ, ὅτι θρόνος ἐστὶν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/034.yaml
  text: 'But I say to you, do not swear at all: neither by heaven, because it is the throne of God;'
translation:
  language: uk
  text: 'А Я кажу вам: не присягайтеся зовсім — ні небом, бо воно є престолом Бога;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: А Я кажу вам
  rationale: Передає протиставний δέ та виразний, емфатичний займенник ἐγώ; український порядок слів звучить природно й урочисто.
- source_word: μὴ ὀμόσαι ὅλως
  choice: не присягайтеся зовсім
  rationale: 'ὀμόσαι означає давати присягу або клястися, а ὅλως підсилює заборону: «зовсім».'
- source_word: μήτε ἐν τῷ οὐρανῷ
  choice: ні небом
  rationale: У контексті присягання грецьке ἐν позначає те, чим присягаються; природний український відповідник вимагає орудного відмінка.
- source_word: ὅτι θρόνος ἐστὶν τοῦ θεοῦ
  choice: бо воно є престолом Бога
  rationale: ὅτι тут природно виражає підставу заборони; збережено образ престолу та явну зв’язку «є».
theological_decisions:
- issue: Обсяг заборони присягатися у вислові μὴ ὀμόσαι ὅλως
  choice: не присягайтеся зовсім
  alternative: не давайте неправдивих присяг
  rationale: Текст прямо містить загальне ὅλως і не уточнює «неправдивих»; переклад не звужує вислів богословським тлумаченням.
- issue: Значення ὅτι
  choice: бо
  alternative: що
  rationale: 'У цьому синтаксичному контексті ὅτι найімовірніше вводить причину: небом не слід присягатися, бо воно є Божим престолом.'
translation_notes:
  register: Сучасна стандартна українська; гідний, доступний біблійний стиль. Велика літера в «Я» графічно передає емфазу ἐγώ без додавання слів. Пунктуація з двокрапкою та тире ясно вводить перший приклад, а крапка з комою зберігає незавершений рух речення до наступного вірша.
