  text: ἐὰν οὖν προσφέρῃς τὸ δῶρόν σου ἐπὶ τὸ θυσιαστήριον κἀκεῖ μνησθῇς ὅτι ὁ ἀδελφός σου ἔχει τι κατὰ σοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/023.yaml
  text: Therefore, if you are offering your gift on the altar, and there remember that your brother has something against you,
translation:
  language: uk
  text: Отже, якщо ти приносиш свій дар на жертовник і там згадаєш, що твій брат має щось проти тебе,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «твій брат чи сестра»; у грецькому тексті стоїть «брат» — слово чоловічого роду в однині, яке в цьому контексті може вживатися як представницьке.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Отже, якщо
  rationale: «Отже» передає висновковий зв’язок οὖν із попереднім повчанням, а «якщо» — умовну силу ἐάν.
- source_word: προσφέρῃς τὸ δῶρόν σου
  choice: ти приносиш свій дар
  rationale: Дієслово προσφέρω в культовому контексті означає приносити або підносити дар; теперішній час українською природно змальовує дію в умовній ситуації. «Дар» точно передає широке значення δῶρον.
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: на жертовник
  rationale: ἐπί з акузативом спрямовує дар на жертовник; цей вислів зберігає просторовий образ оригіналу й природний у контексті жертвопринесення.
- source_word: κἀκεῖ μνησθῇς
  choice: і там згадаєш
  rationale: «Там» зберігає просторовий наголос κἀκεῖ, а «згадаєш» природно передає μνησθῇς без уточнення, чи спогад виник сам собою, чи був викликаний.
- source_word: ὁ ἀδελφός σου
  choice: твій брат
  rationale: Збережено граматично чоловічий одниновий іменник ἀδελφός; можливе представницьке вживання пояснено в примітці.
- source_word: ἔχει τι κατὰ σοῦ
  choice: має щось проти тебе
  rationale: Природний український відповідник ідіоми, який зберігає навмисну невизначеність τι — «щось».
theological_decisions:
- issue: Родова форма ἀδελφός
  choice: твій брат
  alternative: твій брат або сестра; інший віруючий
  rationale: Основний текст зберігає чоловічу форму однини з грецького оригіналу й не звужує її до конфесійно визначеного «віруючого». Представницька функція слова можлива й зазначена в примітці.
translation_notes:
  register: Сучасна нормативна українська мова з гідним, зрозумілим біблійним регістром. Звертання в другій особі однини відтворює грецьку форму. Кома перед маркером примітки збережена, бо вірш є незавершеною умовною частиною речення, продовженою в наступному вірші.
