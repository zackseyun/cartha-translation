base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/038.yaml
  text: You have heard that it was said[a], ‘An eye for an eye and a tooth for a tooth.’
translation:
  language: uk
  text: 'Ви чули, що було сказано: «Око за око і зуб за зуб».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або, буквальніше: «Око замість ока і зуб замість зуба».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Ви чули
  rationale: Аорист у вступній формулі передає те, що слухачі вже чули як відоме повчання; природний український відповідник — «ви чули».
- source_word: ὅτι
  choice: що
  rationale: Сполучник вводить зміст почутого.
- source_word: ἐρρέθη
  choice: було сказано
  rationale: Безособова пасивна конструкція зберігає форму грецького вислову, не уточнюючи мовця.
- source_word: Ὀφθαλμὸν ἀντὶ ὀφθαλμοῦ
  choice: око за око
  rationale: Усталена й природна українська форма юридичного принципу; «за» передає відповідність або заміну, виражену ἀντί.
- source_word: καὶ
  choice: і
  rationale: Простий єднальний сполучник між двома паралельними частинами.
- source_word: ὀδόντα ἀντὶ ὀδόντος
  choice: зуб за зуб
  rationale: Збережено паралелізм і впізнавану форму правового вислову.
theological_decisions:
- issue: Передача цитованого Ісусом принципу рівної відплати
  choice: «Око за око і зуб за зуб»
  alternative: «Око замість ока і зуб замість зуба»
  rationale: Усталена форма точно передає грецький вислів і залишає відкритим питання про буквальне чи пропорційне застосування принципу, не додаючи тлумачення.
translation_notes:
  register: Сучасна стандартна українська мова; лаконічний, гідний і загальнозрозумілий стиль. Усталений вислів збережено заради природності та впізнаваності.
