  text: And to the one who wants to sue you and take your tunic[b][a], let him have your cloak also.
translation:
  language: uk
  text: А тому, хто хоче подати на тебе до суду[a] й забрати твою сорочку[b], віддай йому й плащ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «судитися з тобою». Грецький вислів буквально стосується судового розгляду.'
