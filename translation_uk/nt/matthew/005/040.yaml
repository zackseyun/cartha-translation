    reason: cultural_note
lexical_decisions:
- source_word: τῷ θέλοντί
  choice: тому, хто хоче
  rationale: Субстантивований дієприкметник означає будь-яку особу з таким наміром; цей варіант природно передає волевиявлення θέλω.
- source_word: σοι κριθῆναι
  choice: судитися з тобою
  rationale: Форма κριθῆναι буквально пов’язана із судовим розглядом, а в цьому контексті позначає правову дію проти адресата. Формулювання зберігає юридичний зміст і природно звучить українською.
- source_word: χιτῶνά
  choice: сорочку
  rationale: χιτών — нижній предмет одягу, який носили під верхнім. «Сорочка» зрозуміла сучасному читачеві, а культурну відмінність уточнено в примітці.
- source_word: λαβεῖν
  choice: забрати
  rationale: У контексті судової вимоги дієслово означає отримати у володіння або взяти; «забрати» ясно передає спрямованість дії на чуже майно.
- source_word: ἄφες αὐτῷ
  choice: віддай йому
  rationale: Наказова форма ἀφίημι тут закликає поступитися річчю та дозволити іншому нею заволодіти. «Віддай йому» природно й виразно зберігає силу прямого наказу.
- source_word: ἱμάτιον
  choice: плащ
  rationale: ἱμάτιον позначає верхній одяг на відміну від χιτών; «плащ» стисло й зрозуміло відтворює це протиставлення.
- source_word: καὶ ... καὶ
  choice: А ... і
  rationale: Перше καί пов’язує вислів із попереднім контекстом, а друге додає ще й верхній одяг, зберігаючи наростання вимоги.
theological_decisions:
- issue: Етична сила Ісусового наказу в судовій суперечці
  choice: Збережено прямий наказ радикально поступитися майном без пом’якшення до абстрактного принципу.
  alternative: Передати вислів вільніше як загальний заклик поступатися своїми правами.
  rationale: Наказове ἄφες і конкретний образ двох предметів одягу надають вислову гострої, практичної сили. Переклад не звужує його до певної доктринальної схеми й не усуває напруженості наказу.
translation_notes:
  register: Сучасна, ясна й гідна українська мова. Юридичний контекст передано природним дієсловом «судитися», а історичне розрізнення видів одягу пояснено в примітці.
