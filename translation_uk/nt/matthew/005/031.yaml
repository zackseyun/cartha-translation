lexical_decisions:
- source_word: Ἐρρέθη
  choice: було сказано
  rationale: Безособова пасивна формула природно передає спосіб введення цитованого припису й узгоджується з формулою в сусідніх висловах.
- source_word: δέ
  choice: А ще
  rationale: δέ тут позначає перехід до наступного прикладу в низці висловів. «А ще» природно пов’язує цей вірш із попереднім контекстом, не додаючи сильнішого протиставлення, ніж вимагає частка.
- source_word: Ὃς ἂν
  choice: Хто
  rationale: Сполука відносного займенника з ἄν виражає загальну невизначену умову; українське «хто» в такій конструкції є стислим і природним відповідником.
- source_word: ἀπολύσῃ
  choice: розлучиться
  rationale: Хоча дієслово може означати «відпустити» або «відіслати», у шлюбно-правовому контексті разом з ἀποστάσιον воно означає розірвання шлюбу.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: зі своєю дружиною
  rationale: γυνή у контексті розлучення означає «дружина». Зворотний присвійний займенник «своєю» природно вказує на дружину суб’єкта дії.
- source_word: δότω
  choice: нехай дасть
  rationale: Форма третьої особи аористового наказового способу прямо й природно передається українською конструкцією «нехай дасть».
- source_word: αὐτῇ
  choice: їй
  rationale: Давальний відмінок адресата природно передається українським «їй».
- source_word: ἀποστάσιον
  choice: свідоцтво про розлучення
  rationale: Іменник позначає письмовий документ, що засвідчує розлучення; цей відповідник ясно зберігає його документально-правовий зміст.
theological_decisions:
- issue: Зв’язок слів Ісуса з Мойсеєвим приписом про розлучення
  choice: Передати вислів як цитування правового припису, не вкладаючи в цей вірш ані схвалення, ані осуду.
  alternative: Тлумачно подати його як схвалення порядку розлучення або лише як опис поширеного вчення.
  rationale: Вірш вводить усталене формулювання, на яке Ісус відповідає в наступному вірші. Переклад має зберегти форму цитованого припису й не розв’язувати наперед богословську напругу щодо етики розлучення.
translation_notes:
  register: Сучасна нормативна українська мова, ясний і гідний біблійний стиль. Формулювання зберігає лаконічну правову форму цитати; «А ще» передає перехід δέ без надмірно сильного протиставлення.
