  text: А одержавши плату, вони почали нарікати на господаря дому.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβόντες
  choice: одержавши плату
  rationale: Аористовий дієприкметник позначає дію, що передує головній. Додане «плату» природно відтворює невиражений у грецькому тексті додаток, зрозумілий із контексту.
- source_word: δὲ
  choice: А
  rationale: Частка м’яко продовжує розповідь; «А» природно передає цей перехід без надмірного протиставлення.
- source_word: ἐγόγγυζον
  choice: почали нарікати
  rationale: Імперфект може передавати початок і подальший перебіг дії. «Нарікати» зберігає відтінок невдоволеного ремствування й звучить природно сучасною українською.
- source_word: κατὰ
  choice: на
  rationale: З родовим відмінком прийменник виражає спрямованість невдоволення проти особи; українське «нарікати на» є природною відповідністю.
- source_word: τοῦ οἰκοδεσπότου
  choice: господаря дому
  rationale: Передає складене значення οἰκοδεσπότης — господар або голова дому та господарства — не звужуючи його лише до володіння землею.
