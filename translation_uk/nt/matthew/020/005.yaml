lexical_decisions:
- source_word: οἱ δὲ ἀπῆλθον
  choice: І вони пішли
  rationale: Займенник οἱ вказує на робітників із попереднього контексту; δέ тут є легким оповідним сполучником, а ἀπῆλθον природно передано як «пішли».
- source_word: πάλιν
  choice: знову
  rationale: Прямо виражає повторення дії.
- source_word: ἐξελθὼν
  choice: Вийшовши
  rationale: Дієприслівник зберігає грецьку дієприкметникову конструкцію та передає дію, що передує головній або супроводжує її в оповідній послідовності.
- source_word: περὶ ἕκτην καὶ ἐνάτην ὥραν
  choice: близько шостої та дев’ятої години
  rationale: «Близько» передає περὶ, а традиційний відлік годин збережено в тексті як культурно-історичну форму; сучасні відповідники подано в примітці.
- source_word: ἐποίησεν ὡσαύτως
  choice: він учинив так само
  rationale: Сполука природно передає семантично легке ἐποίησεν разом із порівняльним значенням ὡσαύτως, не додаючи невиражених подробиць.
