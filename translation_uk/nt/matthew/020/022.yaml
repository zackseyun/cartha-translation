source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Οὐκ οἴδατε τί αἰτεῖσθε· δύνασθε πιεῖν τὸ ποτήριον ὃ ἐγὼ μέλλω ⸀πίνειν; λέγουσιν αὐτῷ· Δυνάμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/022.yaml
  text: But Jesus answered and said[a], “You do not know what you are asking. Are you able to drink the cup that I am about to drink?” They said to him, “We are able.”
translation:
  language: uk
  text: 'Та Ісус у відповідь сказав: «Ви не знаєте, чого просите. Чи можете випити чашу[a], яку Я маю випити?» Вони сказали Йому: «Можемо».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Тобто, виразніше: «чашу страждань, яку Я маю випити». У грецькому тексті збережено метафору «чаші» — поширений у Біблії образ призначеної комусь долі, особливо страждання.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: Та Ісус у відповідь сказав
  rationale: «Та» передає легкий контраст δέ, а природна українська конструкція «у відповідь сказав» відтворює обидва дієслівні компоненти грецької оповідної формули без незграбного дублювання.
- source_word: Οὐκ οἴδατε
  choice: Ви не знаєте
  rationale: Прямо передає основне значення οἶδα, не замінюючи його тлумачним «не розумієте».
- source_word: τί αἰτεῖσθε
  choice: чого просите
  rationale: Природний український відповідник для прохання про щось; теперішній час зберігає актуальність висловленого прохання.
- source_word: δύνασθε
  choice: Чи можете
  rationale: Природно й ясно виражає здатність; буквальніше «чи спроможні ви» тут звучало б надмірно офіційно.
- source_word: πιεῖν τὸ ποτήριον
  choice: випити чашу
  rationale: Зберігає біблійну метафору ποτήριον, а доконаний вид «випити» природно передає інфінітив у питанні про майбутнє випробування.
- source_word: ὃ ἐγὼ μέλλω πίνειν
  choice: яку Я маю випити
  rationale: «Маю випити» передає спрямованість μέλλω до майбутньої, призначеної події, не звужуючи вислів лише до безпосередньої часової близькості.
- source_word: λέγουσιν αὐτῷ
  choice: Вони сказали Йому
  rationale: Грецький історичний теперішній передано звичним для сучасної української оповіді минулим часом.
- source_word: Δυνάμεθα
  choice: Можемо
  rationale: Лексично узгоджується з попереднім «Чи можете» та стисло зберігає впевнену відповідь учнів.
theological_decisions:
- issue: Метафоричне значення «чаші»
  choice: Зберегти слово «чаша» в основному тексті без пояснювальної заміни.
  alternative: «страждання, які Я маю перенести» або «чашу страждань, яку Я маю випити»
  rationale: Грецький текст залишає біблійну метафору відкритою. У контексті вона вказує на призначену Ісусові долю, особливо на Його прийдешні страждання, але її не слід зводити в основному тексті до одного пояснювального відповідника.
translation_notes:
  register: Сучасна нормативна українська мова з гідним біблійним звучанням. Займенники, що стосуються Ісуса, подано з великої літери відповідно до усталеної української видавничої практики; звертання до учнів — із малої. Синтаксис зроблено природним, водночас збережено образність і смислову напругу оригіналу.
