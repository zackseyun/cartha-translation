id: MAT.20.1
reference: Matthew 20:1
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Ὁμοία γάρ ἐστιν ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐξῆλθεν ἅμα πρωῒ μισθώσασθαι ἐργάτας εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/001.yaml
  text: For the kingdom of heaven is like a man, a master of a house, who went out early in the morning to hire workers for his vineyard.
translation:
  language: uk
  text: Бо Царство Небесне подібне до чоловіка, господаря дому, який вийшов рано-вранці найняти робітників до свого виноградника.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: до чоловіка, господаря дому
  rationale: 'Збережено обидва компоненти грецького вислову: загальне ἀνθρώπῳ («чоловіка») та уточнювальне οἰκοδεσπότῃ («господаря дому»), не зливаючи їх в одне слово.'
- source_word: ἅμα πρωῒ
  choice: рано-вранці
  rationale: Природний український відповідник зі значенням виходу дуже рано, на початку ранку.
- source_word: μισθώσασθαι ἐργάτας
  choice: найняти робітників
  rationale: Передає мету виходу господаря та звичайний зміст найму працівників за плату.
- source_word: εἰς τὸν ἀμπελῶνα αὐτοῦ
  choice: до свого виноградника
  rationale: В українській мові дієслово «найняти» природно поєднується з напрямком або місцем праці через «до»; αὐτοῦ передано зворотним присвійним займенником «свого».
theological_decisions:
- issue: Обсяг порівняння у вислові про Царство Небесне
  choice: Царство уподібнено до «чоловіка, господаря дому» без додаткового тлумачення образу
  alternative: Передати лише «господаря» або пояснити, що Царство подібне до всієї подальшої ситуації
  rationale: Грецька конструкція прямо вводить ἀνθρώπῳ οἰκοδεσπότῃ; переклад зберігає форму притчі й не нав’язує богословської ідентифікації господаря.
translation_notes:
  register: Сучасна стандартна українська; виклад природний і гідний. Формулу «Царство Небесне» збережено як усталений біблійний вислів, а прикладку «чоловіка, господаря дому» — для точного відтворення структури оригіналу.
