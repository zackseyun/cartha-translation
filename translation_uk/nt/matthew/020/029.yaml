  source_fidelity: Текст точно передає часовий родовий абсолют «ἐκπορευομένων αὐτῶν» через «Коли вони виходили», рух від Єрихона, аористове «пішов за» та важливий перехід від множини «вони» до однини «Ним». «Великий натовп» адекватно відтворює ὄχλος πολύς.
  naturalness: Фраза звучить природно й нормативно сучасною українською, зі стислим оповідним ритмом. Порядок слів «за Ним пішов великий натовп» виразно зберігає фокус грецького однинного займенника.
