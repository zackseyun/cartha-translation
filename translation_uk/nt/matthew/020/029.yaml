  text: Καὶ ἐκπορευομένων αὐτῶν ἀπὸ Ἰεριχὼ ἠκολούθησεν αὐτῷ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/029.yaml
  text: And as they were going out from Jericho[a], a large crowd followed him.
translation:
  language: uk
  text: Коли вони виходили з Єрихона, за Ним пішов великий натовп.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκπορευομένων αὐτῶν
  choice: Коли вони виходили
  rationale: Родовий абсолют із дієприкметником теперішнього часу має часове значення; недоконаний вид «виходили» природно передає перебіг дії.
- source_word: ἀπὸ Ἰεριχὼ
  choice: з Єрихона
  rationale: Прийменник ἀπό позначає рух від місця; українське «з Єрихона» природно передає вихід із міста.
- source_word: ἠκολούθησεν
  choice: пішов за
  rationale: Аорист ἀκολουθέω тут описує рух слідом за кимось; «пішов за» є природним у цьому оповідному контексті.
- source_word: αὐτῷ
  choice: за Ним
  rationale: Давальний займенник однини стосується Ісуса; переклад зберігає перехід від множини «вони» до однини «Ним».
- source_word: ὄχλος πολύς
  choice: великий натовп
  rationale: Сполука означає численний натовп; «великий натовп» є ясним і сучасним відповідником.
theological_decisions:
- issue: Референт займенника однини αὐτῷ після конструкції з множиною αὐτῶν
  choice: Натовп пішов за Ісусом («за Ним»).
  alternative: Натовп пішов за всією групою («за ними»).
  rationale: Грецький текст свідомо переходить від множини «вони виходили» до однини «пішов за ним», найприродніше виокремлюючи Ісуса. Цей перехід не згладжено.
translation_notes:
  register: Сучасна стандартна українська мова; природний, стислий і гідний оповідний стиль. Займенник щодо Ісуса написано з великої літери відповідно до поширеної української біблійної практики.
