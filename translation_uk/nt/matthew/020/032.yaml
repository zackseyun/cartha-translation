  text: καὶ στὰς ὁ Ἰησοῦς ἐφώνησεν αὐτοὺς καὶ εἶπεν· Τί θέλετε ποιήσω ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/032.yaml
  text: And Jesus stopped[a], called them, and said, “What do you want me to do for you?”
translation:
  language: uk
  text: 'Ісус зупинився, покликав їх і запитав: «Що ви хочете, щоб Я зробив для вас?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στὰς
  choice: зупинився
  rationale: Аористовий дієприкметник від ἵστημι перед головним дієсловом передає припинення руху; українське особове дієслово природно відтворює послідовність дій.
- source_word: ἐφώνησεν
  choice: покликав
  rationale: У контексті φωνέω означає покликати або гукнути до сліпих; «покликав» є стислим і природним відповідником.
- source_word: αὐτοὺς
  choice: їх
  rationale: Займенник у знахідному відмінку множини стосується двох сліпих із безпосереднього контексту.
- source_word: Τί θέλετε
  choice: Що ви хочете
  rationale: Прямо й природно передає питальний займенник τί та значення бажання у θέλω без зайвої формальності.
- source_word: ποιήσω ὑμῖν
  choice: щоб Я зробив для вас
  rationale: Підрядна конструкція з «щоб» природно передає аористовий кон’юнктив ποιήσω після θέλετε, а «для вас» відтворює бенефактивний давальний ὑμῖν.
- source_word: ὁ Ἰησοῦς
  choice: Ісус
  rationale: Особове ім’я передано усталеною українською формою; грецький артикль при імені окремо не відтворюється.
theological_decisions:
- issue: Тон і сила запитання Ісуса
  choice: 'Пряме особисте запитання: «Що ви хочете, щоб Я зробив для вас?»'
  alternative: 'Формальніше: «Чого ви бажаєте, щоб Я вчинив для вас?»'
  rationale: Грецький текст передає безпосереднє звернення без спеціального доктринального уточнення. Обране формулювання зберігає особисту залученість Ісуса та звучить сучасно й гідно.
translation_notes:
  register: Сучасна стандартна українська; природний оповідний порядок, пряма й шаноблива мова без архаїзмів. Велику літеру в займеннику «Я» в прямій мові вжито як усталену українську практику шанобливого біблійного письма, не змінюючи змісту грецького тексту.
