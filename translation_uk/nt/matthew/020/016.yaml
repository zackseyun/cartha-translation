  text: οὕτως ἔσονται οἱ ἔσχατοι πρῶτοι καὶ οἱ πρῶτοι ⸀ἔσχατοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/016.yaml
  text: So the last will be first[a], and the first last.
translation:
  language: uk
  text: Так останні стануть першими, а перші — останніми.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: Так
  rationale: Природно вводить підсумковий висновок із притчі та зберігає висновковий відтінок грецького прислівника.
- source_word: ἔσονται
  choice: стануть
  rationale: У цьому вислові українське «стануть» природно передає майбутню зміну або обернення становища, закладене в конструкції з εἰμί.
- source_word: οἱ ἔσχατοι
  choice: останні
  rationale: Субстантивований прикметник прямо й стисло передає тих, хто є останніми, не звужуючи значення до меншовартості.
- source_word: πρῶτοι
  choice: першими
  rationale: Орудний відмінок після «стануть» є нормативним і зберігає лаконічну антитезу.
- source_word: καὶ
  choice: а
  rationale: Українське «а» природно координує дві контрастно-паралельні частини вислову, не додаючи сильного заперечного протиставлення.
- source_word: οἱ πρῶτοι
  choice: перші
  rationale: Субстантивований прикметник зберігає точний паралелізм із «останні».
- source_word: ἔσχατοι
  choice: останніми
  rationale: Орудний відмінок після пропущеного в другій частині «стануть» завершує дзеркальне обернення вислову.
theological_decisions:
- issue: Характер обернення у вислові
  choice: Передати як стислий вислів про обернення, не уточнюючи, чи йдеться про черговість, суспільне становище, винагороду або спасіння.
  alternative: Витлумачити його конкретно як суспільне обернення, порядок винагороди в учнівстві або порядок спасіння.
  rationale: Грецький текст не звужує значення вислову до однієї сфери, тому переклад зберігає його богословську місткість і напруження.
translation_notes:
  register: Сучасна нормативна українська; стислий, урочисто-нейтральний афористичний вислів. Тире позначає пропуск дієслова «стануть» у другій паралельній частині.
