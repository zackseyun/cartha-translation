id: MAT.20.3
reference: Matthew 20:3
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: καὶ ἐξελθὼν περὶ τρίτην ὥραν εἶδεν ἄλλους ἑστῶτας ἐν τῇ ἀγορᾷ ἀργούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/003.yaml
  text: And going out about the third hour[b][a], he saw others standing idle in the marketplace.
translation:
  language: uk
  text: Вийшовши близько третьої години[a], він побачив інших, які без діла[b] стояли на ринку.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Тобто приблизно о дев’ятій ранку. «Третю годину» відлічували від сходу сонця.
    reason: cultural_note
  - marker: b
    text: 'Або: «без роботи». Грецьке слово означає, що вони тоді не працювали.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: Вийшовши
  rationale: Дієприслівник природно передає аористовий дієприкметник і послідовність дій без зайвого розгортання.
- source_word: περὶ τρίτην ὥραν
  choice: близько третьої години
  rationale: Збережено давній спосіб відліку денного часу та приблизність, виражену περὶ; сучасний часовий відповідник подано у примітці.
- source_word: εἶδεν
  choice: побачив
  rationale: Прямий і природний відповідник простого розповідного дієслова ὁράω.
- source_word: ἄλλους
  choice: інших
  rationale: Субстантивований прикметник передано без додавання слова «чоловіків», якого грецький текст прямо не містить.
- source_word: ἑστῶτας
  choice: які ... стояли
  rationale: Особову підрядну конструкцію вжито задля природного українського синтаксису; вона зберігає станове значення грецького перфектного дієприкметника.
- source_word: ἀγορᾷ
  choice: на ринку
  rationale: У контексті йдеться про публічне ринкове місце, де могли збиратися наймані робітники; «на ринку» є ясним сучасним відповідником.
- source_word: ἀργούς
  choice: без діла
  rationale: Передає те, що вони не працювали, не нав’язуючи сучасної соціально-економічної категорії «безробітні» і не приписуючи їм лінощів.
theological_decisions: []
translation_notes:
  register: Сучасна літературна українська з гідним, простим розповідним стилем. Історичний часовий вислів збережено в основному тексті, а його сучасний відповідник пояснено у примітці. Порядок слів дещо природніший для української, без втрати змісту оригіналу.
