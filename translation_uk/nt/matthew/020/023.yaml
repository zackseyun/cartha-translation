  text: ⸀λέγει αὐτοῖς· Τὸ μὲν ποτήριόν μου ⸀πίεσθε, τὸ δὲ καθίσαι ἐκ δεξιῶν μου καὶ ἐξ ⸀εὐωνύμων οὐκ ἔστιν ⸀ἐμὸν δοῦναι, ἀλλ’ οἷς ἡτοίμασται ὑπὸ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/023.yaml
  text: He said to them[a], “You will indeed drink my cup, but to sit at my right and at my left is not mine to grant[b], but it is for those for whom it has been prepared by my Father.”
translation:
  language: uk
  text: 'Він каже їм: «Мою чашу[a] ви справді питимете, але сидіти праворуч і ліворуч від Мене — не Мені давати, а тим, для кого це приготував Мій Отець».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Чаша тут образно означає призначені Ісусові страждання або долю, які розділять і Його учні.
    reason: cross_reference
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Він каже їм
  rationale: 'Історичний теперішній час збережено: така форма природна в українській оповіді й передає жвавість грецького викладу.'
- source_word: Τὸ μὲν ποτήριόν μου πίεσθε
  choice: Мою чашу ви справді питимете
  rationale: Образ чаші збережено без розтлумачення в основному тексті; «справді» передає стверджувальну силу μὲν перед наступним протиставленням.
- source_word: καθίσαι ἐκ δεξιῶν μου καὶ ἐξ εὐωνύμων
  choice: сісти праворуч і ліворуч від Мене
  rationale: Природний сучасний український вислів точно позначає почесні місця обабіч Ісуса.
- source_word: οὐκ ἔστιν ἐμὸν δοῦναι
  choice: не Мені давати
  rationale: Лаконічно збережено зміст «не Моє це давати» без додавання пояснень про межі чи джерело влади Ісуса.
- source_word: ἀλλ’ οἷς ἡτοίμασται
  choice: а тим, кому це приготовлено
  rationale: У грецькому вислові після ἀλλά пропущено те, що легко відновлюється з контексту; займенник «це» робить українське речення зрозумілим, а доконана пасивна форма передає результат попереднього приготування.
- source_word: ὑπὸ τοῦ πατρός μου
  choice: Моїм Отцем
  rationale: Прямо передано особового виконавця пасивної дії без доданого слова «лише», якого в грецькому тексті немає.
theological_decisions:
- issue: Христологічна напруга у вислові «не Мені давати»
  choice: Передати слова Ісуса прямо, не додаючи богословських уточнень.
  alternative: «Не Мені давати незалежно від Отця» або інший гармонізувальний переказ.
  rationale: Грецький текст сам розрізняє Ісусову роль і приготування Отцем. Переклад зберігає цю напругу й не нав’язує її конфесійного пояснення.
- issue: Значення образу чаші
  choice: Зберегти метафору «чаша» в основному тексті та стисло пояснити її в примітці.
  alternative: Замінити образ у тексті словом «страждання» або «доля».
  rationale: Метафора є змістовно важливою і пов’язує відповідь Ісуса з ширшим біблійним образом призначених страждань; її не слід передчасно звужувати парафразом.
translation_notes:
  register: Сучасна нормативна українська мова з гідним біблійним звучанням. Займенники, що стосуються Ісуса та Отця, подано з великої літери відповідно до поширеної української біблійної традиції; синтаксис лишено стислим, щоб зберегти силу й богословську напругу оригіналу.
