source:
  edition: SBLGNT
  text: καὶ ἰδοὺ δύο τυφλοὶ καθήμενοι παρὰ τὴν ὁδόν, ἀκούσαντες ὅτι Ἰησοῦς παράγει, ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/030.yaml
  text: And behold, two blind men sitting by the road, when they heard that Jesus was passing by, cried out, saying, “Lord, have mercy on us, Son of David.”
translation:
  language: uk
  text: 'І ось двоє сліпих, які сиділи при дорозі, почувши, що Ісус проходить повз, закричали: «Господи, змилуйся над нами, Сину Давидів!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: ось
  rationale: Природний український вказівний маркер, який зберігає функцію привернення уваги й оповідну виразність.
- source_word: δύο τυφλοὶ
  choice: двоє сліпих
  rationale: Збірний числівник природно позначає двох людей чоловічої статі; прикметник, ужитий як іменник, є стислим і зрозумілим у контексті.
- source_word: καθήμενοι παρὰ τὴν ὁδόν
  choice: які сиділи при дорозі
  rationale: Передає тривалу супровідну обставину та місце без неприродної для сучасної української дієприкметникової конструкції.
- source_word: ἀκούσαντες ὅτι Ἰησοῦς παράγει
  choice: почувши, що Ісус проходить повз
  rationale: Зберігає попередню щодо крику дію аористового дієприкметника, а «проходить повз» точно й природно передає παράγει.
- source_word: ἔκραξαν λέγοντες
  choice: закричали
  rationale: Дієслово передає гучність та наполегливість звернення; окреме «кажучи» в українській було б семантично надлишковим перед прямою мовою.
- source_word: Κύριε
  choice: Господи
  rationale: Клична форма «Господи» природно передає шанобливе звертання κύριε та зберігає його можливу христологічну вагу.
- source_word: ἐλέησον ἡμᾶς
  choice: змилуйся над нами
  rationale: Усталений, природний і точний відповідник прохання про милосердну допомогу.
- source_word: υἱὸς Δαυίδ
  choice: Сину Давидів
  rationale: Клична форма передає пряме звертання, а традиційна титульна конструкція зберігає давидівське та месіанське звучання.
theological_decisions:
- issue: Значення κύριος у звертанні до Ісуса
  choice: Господи
  alternative: Пане
  rationale: Поєднання зі звертанням «Сину Давидів» надає слову шанобливої й месіанської ваги. «Господи» зберігає цю силу, не визначаючи понад текст точний рівень усвідомлення мовців.
- issue: Месіанська сила υἱὸς Δαυίδ
  choice: Сину Давидів
  alternative: нащадку Давида
  rationale: Буквальне титульне формулювання зберігає характерне для Матвія месіанське позначення, тоді як «нащадку Давида» звузило б його до родоводу.
translation_notes:
  register: Сучасна стандартна українська з гідним біблійним звучанням. Синтаксис спрощено лише там, де буквальне відтворення грецьких дієприкметників було б неприродним; уваговий маркер «ось», інтенсивність крику та месіанський титул збережено.
