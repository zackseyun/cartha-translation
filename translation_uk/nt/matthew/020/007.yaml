lexical_decisions:
- source_word: λέγουσιν
  choice: Вони відповіли
  rationale: Історичний теперішній час передано минулим часом, природним для української оповіді; дієслово «відповіли» ясно виражає функцію репліки в діалозі.
- source_word: Ὅτι
  choice: Бо
  rationale: Сполучник вводить пояснення причини, чому вони стоять без роботи; «бо» стисло й природно передає цю функцію.
- source_word: οὐδεὶς
  choice: ніхто
  rationale: Прямий і звичний український відповідник заперечного займенника.
- source_word: ἐμισθώσατο
  choice: не найняв
  rationale: Дієслово означає наймання на роботу; український доконаний минулий природно охоплює час до моменту розмови.
- source_word: λέγει
  choice: Він каже
  rationale: Збережено грецький історичний теперішній для оповідної виразності й відповідності формі джерела.
- source_word: Ὑπάγετε
  choice: Ідіть
  rationale: Природний наказовий відповідник у контексті направлення працівників до місця роботи.
- source_word: καὶ ὑμεῖς
  choice: і ви
  rationale: Передає включення цієї групи разом із тими, кого вже було послано.
- source_word: ἀμπελῶνα
  choice: виноградника
  rationale: Стандартний український відповідник назви місця вирощування винограду.
