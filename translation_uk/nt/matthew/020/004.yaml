review_pass:
  verdict: approve
  source_fidelity: 'Український текст точно передає всі суттєві елементи грецького оригіналу: звернення до цих робітників, наказ «Ідіть», інклюзивний наголос «і ви», напрямок «у виноградник» і обіцянку дати те, що є δίκαιον. Формула «те, що буде справедливим» адекватно відтворює невизначено-умовний характер ὃ ἐὰν ᾖ, не замінюючи δώσω на більш конкретне «заплачу».'
  naturalness: Фраза відповідає сучасній літературній українській і придатна для стриманого біблійного регістру. «Ідіть і ви» природно зберігає наголос оригіналу. Конструкція «те, що буде справедливим» дещо формальніша, але ясна й доречна в цьому регістрі.
  terminology: «Виноградник» є усталеним точним відповідником ἀμπελών. «Справедливим» добре передає δίκαιον у контексті винагороди, а примітка належно подає можливі близькі відповідники «правильним» і «належним», не нав’язуючи одного вузького тлумачення.
