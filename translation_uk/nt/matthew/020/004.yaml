reference: Matthew 20:4
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: καὶ ἐκείνοις εἶπεν· Ὑπάγετε καὶ ὑμεῖς εἰς τὸν ἀμπελῶνα, καὶ ὃ ἐὰν ᾖ δίκαιον δώσω ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/004.yaml
  text: And he said to them[a], ‘You also go into the vineyard, and whatever is right I will give you.’
translation:
  language: uk
  text: 'І сказав їм: «Ідіть і ви у виноградник, і я дам вам те, що буде справедливим[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «правильним» чи «належним».'
    reason: Лексема δίκαιον може позначати те, що є справедливим, правильним або належним; у цьому контексті відтінки значення частково збігаються.
lexical_decisions:
- source_word: ἐκείνοις
  choice: їм
  rationale: Давальний відмінок множини вказівного займенника стосується щойно згаданих робітників; український займенник природно передає цей зв’язок у контексті.
- source_word: εἶπεν
  choice: сказав
  rationale: Звичний відповідник у розповідному тексті, який природно вводить пряму мову.
- source_word: Ὑπάγετε
  choice: Ідіть
  rationale: Наказовий спосіб множини тут виражає просту вказівку прямувати до виноградника.
- source_word: καὶ ὑμεῖς
  choice: і ви
  rationale: Зберігає наголос на тому, що ці робітники також мають іти, як і найняті раніше.
- source_word: ἀμπελῶνα
  choice: виноградник
  rationale: Звичайний і точний український відповідник назви місця, де вирощують виноград.
- source_word: ὃ ἐὰν ᾖ δίκαιον
  choice: те, що буде справедливим
  rationale: Передає невизначеність конструкції ὃ ἐὰν та морально-етичний зміст δίκαιον, не звужуючи його лише до юридичної справедливості або конкретно визначеної платні.
- source_word: δώσω ὑμῖν
  choice: я дам вам
  rationale: Відтворює загальне значення δίδωμι «давати»; контекст стосується винагороди, але грецький текст не вживає окремого дієслова «платити».
theological_decisions:
- issue: Передача δίκαιον у контексті винагороди за працю
  choice: справедливим
  alternative: правильним; належним
  rationale: «Справедливим» природно передає етичний зміст слова та обіцянку господаря вчинити відповідно до справедливості, не визначаючи наперед конкретного розміру винагороди.
translation_notes:
  register: Сучасна літературна українська мова з простою, гідною синтаксичною будовою. Формулювання зберігає повтор καί як «і», наголос «і ви» та загальне дієслово «дам», не підмінюючи його контекстуальним «заплачу».
