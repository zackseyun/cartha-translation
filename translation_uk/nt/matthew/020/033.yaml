  text: λέγουσιν αὐτῷ· Κύριε, ἵνα ⸂ἀνοιγῶσιν οἱ ὀφθαλμοὶ ἡμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/033.yaml
  text: They said to him[a], “Lord, let our eyes be opened.”
translation:
  language: uk
  text: 'Вони сказали йому: «Господи[a], нехай відкриються наші очі».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Пане, нехай відкриються наші очі».'
    reason: Лексема κύριος у прямому звертанні може означати як «Господи», так і шанобливе «Пане».
lexical_decisions:
- source_word: λέγουσιν
  choice: Вони сказали
  rationale: Історичний теперішній час у грецькій розповіді природно передано українським минулим часом, не змінюючи послідовності подій.
- source_word: αὐτῷ
  choice: йому
  rationale: Давальний відмінок займенника прямо позначає адресата висловлювання.
- source_word: Κύριε
  choice: Господи
  rationale: Кличний відмінок κύριος передано традиційним і природним звертанням до Ісуса; примітка зберігає можливе значення ввічливого «Пане».
- source_word: ἵνα ἀνοιγῶσιν
  choice: нехай відкриються
  rationale: У контексті відповіді на запитання про бажане це природно передає зміст прохання та грецький підрядний спосіб. Українська зворотна форма тут ідіоматично виражає настання бажаного стану, не називаючи виконавця дії.
- source_word: οἱ ὀφθαλμοὶ ἡμῶν
  choice: наші очі
  rationale: Присвійний займенник природно передає грецьку конструкцію з іменником та родовим відмінком ἡμῶν.
theological_decisions:
- issue: Значення κύριος у звертанні до Ісуса
  choice: Господи
  alternative: Пане
  rationale: «Господи» зберігає вагоміше значення звертання й узгоджується з матвіївським контекстом, але саме слово може також бути шанобливим звертанням «Пане»; цю неоднозначність зазначено в примітці.
translation_notes:
  register: Сучасна літературна українська мова; вислів стислий, гідний і природний. Форму прохання передано через «нехай», а лексичну неоднозначність звертання збережено в примітці.
