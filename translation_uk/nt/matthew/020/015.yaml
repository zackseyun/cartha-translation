source:
  edition: SBLGNT
  text: ⸀οὐκ ἔξεστίν μοι ⸂ὃ θέλω ποιῆσαι⸃ ἐν τοῖς ἐμοῖς; ⸀ἢ ὁ ὀφθαλμός σου πονηρός ἐστιν ὅτι ἐγὼ ἀγαθός εἰμι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/015.yaml
  text: Is it not lawful for me to do what I want with what is mine? Or is your eye evil because I am good?[a]
translation:
  language: uk
  text: Хіба мені не дозволено робити зі своїм те, що я хочу? Чи твоє око лихе через те, що я добрий?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Чи ти заздриш через те, що я добрий?» Вислів «твоє око лихе» — грецька ідіома, що означає заздрість або невдоволення чужою щедрістю.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξεστίν
  choice: не дозволено
  rationale: Передає значення дозволеності або законного права й природно звучить у риторичному запитанні.
- source_word: ὃ θέλω ποιῆσαι
  choice: робити … те, що я хочу
  rationale: Точно й сучасно передає особисте волевиявлення, виражене θέλω.
- source_word: ἐν τοῖς ἐμοῖς
  choice: зі своїм
  rationale: Стисло й природно передає розпорядження тим, що належить господареві.
- source_word: ὁ ὀφθαλμός σου πονηρός
  choice: твоє око лихе
  rationale: Зберігає образність грецького ідіоматичного вислову, не звужуючи його значення в основному тексті лише до заздрості.
- source_word: ἀγαθός
  choice: добрий
  rationale: Зберігає пряме значення прикметника та виразний контраст між лихим оком і добрим господарем; у контексті доброта також виявляється як щедрість.
theological_decisions:
- issue: Чи тлумачити ідіому ὁ ὀφθαλμός σου πονηρός безпосередньо в основному тексті
  choice: Зберегти образ «твоє око лихе»
  alternative: «ти заздриш» або «ти обурюєшся через мою щедрість»
  rationale: Буквальніший образ зберігає закладений у джерелі контраст між «лихим» оком працівника та «добрим» господарем і не усуває смислової напруги; ймовірне ідіоматичне значення пояснено у примітці.
translation_notes:
  register: Сучасна нормативна українська мова; тон природний і гідний. Зворот «зі своїм» передає право господаря розпоряджатися власним, а незвична для сучасного читача ідіома свідомо збережена й пояснена приміткою.
