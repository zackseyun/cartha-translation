  text: Τότε προσῆλθεν αὐτῷ ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου μετὰ τῶν υἱῶν αὐτῆς προσκυνοῦσα καὶ αἰτοῦσά τι ⸀παρ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/020.yaml
  text: Then the mother of the sons of Zebedee came to him with her sons[a], bowing down and asking something from him.
translation:
  language: uk
  text: Тоді мати синів Зеведея підійшла до Нього разом зі своїми синами, вклоняючись Йому[a] та просячи в Нього чогось.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «поклоняючись Йому»; грецьке дієслово може означати шанобливо вклонятися, віддавати пошану або поклонятися — залежно від контексту.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Тоді
  rationale: Природний часовий сполучник, що вводить наступну подію в оповіді.
- source_word: προσῆλθεν αὐτῷ
  choice: підійшла до Нього
  rationale: Дієслово означає наблизитися або підійти до когось; цей відповідник точно й природно передає спрямований рух.
- source_word: ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου
  choice: мати синів Зеведея
  rationale: Прямо відтворює грецьку родову конструкцію та ідентифікує жінку через її синів.
- source_word: μετὰ τῶν υἱῶν αὐτῆς
  choice: разом зі своїми синами
  rationale: μετά з родовим відмінком виражає супровід; займенник «своїми» природно вказує на підмет речення.
- source_word: προσκυνοῦσα
  choice: вклонилася Йому
  rationale: Передає тілесний жест шанобливого схиляння, не звужуючи багатозначне слово до однозначного твердження про поклоніння як Богові.
- source_word: καὶ αἰτοῦσά τι παρ’ αὐτοῦ
  choice: й почала про щось Його просити
  rationale: Передає значення прохання, невизначений додаток τι («щось») і спрямованість прохання до Ісуса; фазове «почала» природно відтворює супровідну дію дієприкметника в українській оповіді.
theological_decisions:
- issue: Значення προσκυνοῦσα стосовно Ісуса
  choice: вклонилася Йому
  alternative: поклонилася Йому
  rationale: προσκυνέω може позначати шанобливий уклін, віддання пошани або поклоніння. Основний текст зберігає ширше тілесно-шанобливе значення, а примітка вказує на сильніший можливий відтінок, не усуваючи богословської напруги.
translation_notes:
  register: Сучасна нормативна українська мова; виклад природний, ясний і гідний. Збережено послідовність подій та невизначеність грецького προσκυνέω.
