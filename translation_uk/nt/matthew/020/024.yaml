- source_word: περὶ τῶν δύο ἀδελφῶν
  choice: на двох братів
  rationale: У цьому контексті περί з родовим відмінком указує на осіб, проти яких спрямоване обурення; українське «обурилися на» передає це природно й не послаблює особистої спрямованості реакції.
