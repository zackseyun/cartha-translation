lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: змилосердившись
  rationale: Дієприкметник передає глибоке співчуття, яке спонукає до дії; «змилосердившись» природно й стисло зберігає цю силу.
- source_word: δὲ
  choice: і
  rationale: Тут δέ є слабким сполучником, що продовжує розповідь, а не виражає виразне протиставлення.
- source_word: ἥψατο
  choice: доторкнувся
  rationale: У контексті зцілення дієслово означає фізичний дотик; форма з прийменником «до» природно відповідає грецькій конструкції з родовим відмінком.
- source_word: τῶν ὀμμάτων αὐτῶν
  choice: до їхніх очей
  rationale: Природний український відповідник грецького родового відмінка після ἥψατο.
- source_word: εὐθέως
  choice: відразу
  rationale: Передає негайність наслідку без послаблення часової сили прислівника.
- source_word: ἀνέβλεψαν
  choice: прозріли
  rationale: У розповіді про сліпих це дієслово означає відновлення або отримання зору; «прозріли» ясно й природно передає конкретне зцілення.
- source_word: ἠκολούθησαν αὐτῷ
  choice: пішли за ним
  rationale: Зберігає буквальний рух услід за Ісусом і можливий відтінок учнівства, не стверджуючи більше, ніж сказано в тексті.
theological_decisions:
- issue: Характер наслідку, вираженого ἀνέβλεψαν
  choice: негайне справжнє відновлення зору
  alternative: вони лише почали бачити або підвели погляд
  rationale: Поєднання εὐθέως з ἀνέβλεψαν в контексті зцілення сліпих указує на негайне відновлення зору, однак лексичну широту дієслова зазначено у примітці.
- issue: Значення ἠκολούθησαν αὐτῷ
  choice: пішли за ним
  alternative: стали його учнями
  rationale: Вірш прямо повідомляє, що вони пішли за Ісусом; можливий підтекст учнівства збережено, але не перетворено на явне твердження про їхній статус.
translation_notes:
  register: Сучасна стандартна українська мова; виклад природний, стислий і гідний. «Змилосердившись» зберігає емоційну силу оригіналу, а «прозріли» ясно передає результат зцілення. Займенник «ним» подано з малої літери відповідно до звичайної сучасної практики й форми грецького тексту.
