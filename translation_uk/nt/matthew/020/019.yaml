    reason: alternative_reading
lexical_decisions:
- source_word: παραδώσουσιν
  choice: віддадуть
  rationale: Дієслово означає передати когось під владу інших; «віддадуть» природно передає це в контексті передання в руки ворожої влади, не звужуючи значення до зради.
- source_word: τοῖς ἔθνεσιν
  choice: язичникам
  rationale: У юдейському контексті провіщення страждань ідеться про неюдеїв, зокрема римську владу; «язичникам» є усталеним і контекстуально точним відповідником.
- source_word: εἰς τὸ ἐμπαῖξαι
  choice: щоб насміхалися з Нього
  rationale: Конструкція з εἰς та інфінітивом виражає мету або наслідок; підрядна конструкція природна українською й чітко зберігає спільний об’єкт.
- source_word: μαστιγῶσαι
  choice: бичували
  rationale: «Бичувати» точно позначає судове тілесне покарання ударами бича та зберігає урочистий, але зрозумілий біблійний регістр.
- source_word: σταυρῶσαι
  choice: розіп’яли
  rationale: Дієслово безпосередньо означає стратити через розп’яття; українське «розіп’яли» є точним і природним.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: третього дня
  rationale: Природний український часовий зворот, що точно передає давальний відмінок часу.
- source_word: ἐγερθήσεται
  choice: буде воскрешений
  rationale: Майбутня пасивна форма збережена явно; «воскрешений» у контексті воскресіння передає дію над Ісусом і допускає нюанс Божої дії.
theological_decisions:
- issue: Стан дієслова воскресіння
  choice: Він буде воскрешений
  alternative: Він воскресне
  rationale: Грецька форма є пасивною. Пасивний переклад зберігає граматичну форму й можливий натяк на Божу дію, не заперечуючи інших новозавітних висловів про власну дієвість Христа.
translation_notes:
  register: Сучасна нормативна українська з гідним біблійним звучанням. Займенники щодо Ісуса написано з великої літери відповідно до поширеної української релігійної практики; послідовність трьох дій збережено без зайвого повторення об’єкта.
