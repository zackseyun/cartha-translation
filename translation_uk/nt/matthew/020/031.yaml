reference: Matthew 20:31
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ὁ δὲ ὄχλος ἐπετίμησεν αὐτοῖς ἵνα σιωπήσωσιν· οἱ δὲ μεῖζον ⸀ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/031.yaml
  text: But the crowd rebuked them so that they would be silent[a]. Yet they cried out all the more, saying, “Lord, have mercy on us[b], Son of David.”
translation:
  language: uk
  text: 'Та натовп дорікнув їм, щоб вони замовкли. Вони ж іще дужче кричали: «Господи, змилуйся над нами, Сину Давидів!»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Син Давидів» — месіанський титул, а не лише вказівка на походження від Давида.
    reason: cultural_note
lexical_decisions:
- source_word: ὄχλος
  choice: натовп
  rationale: Звичний сучасний український відповідник для групи людей у цій оповідній сцені.
- source_word: ἐπετίμησεν
  choice: наказував
  rationale: У цьому контексті дієслово передає сувору вимогу припинити крик; «наказував» природно поєднується з інфінітивом «замовкнути» й не послаблює сили вислову.
- source_word: ἵνα σιωπήσωσιν
  choice: замовкнути
  rationale: Стисло й природно передає мету вимоги натовпу — щоб вони перестали говорити або кричати.
- source_word: μεῖζον
  choice: іще дужче
  rationale: Зберігає порівняльне посилення, не звужуючи його неодмінно лише до гучності.
- source_word: ἔκραξαν
  choice: кричали
  rationale: Передає гучний, наполегливий вигук, позначений κράζω.
- source_word: Κύριε
  choice: Господи
  rationale: Українська клична форма «Господи» зберігає і шанобливе звертання, і можливий христологічний відтінок κύριος.
- source_word: ἐλέησον ἡμᾶς
  choice: змилуйся над нами
  rationale: Усталений, зрозумілий і точний український відповідник прохання про милість.
- source_word: υἱὸς Δαυίδ
  choice: Сину Давидів
  rationale: Буквальне титульне звертання з кличною формою зберігає царсько-месіанське значення вислову.
theological_decisions:
- issue: Месіанський титул щодо Ісуса
  choice: Сину Давидів
  alternative: нащадку Давида
  rationale: Буквальна форма зберігає титульне, царське й месіанське навантаження, не зводячи вислів лише до походження.
- issue: κύριος у звертанні до Ісуса
  choice: Господи
  alternative: Учителю / Пане
  rationale: «Господи» зберігає семантичну напругу між шанобливим звертанням і можливим богословським значенням, не вирішуючи її однозначно.
translation_notes:
  register: Сучасна стандартна українська, гідний оповідний стиль. Порядок слів у прямій мові природний для української; звертання передано кличним відмінком. Неоднозначність μεῖζον збережено у вислові «іще дужче», тому окрема примітка про можливе значення «голосніше» не є необхідною.
