  text: Ἰδοὺ ἀναβαίνομεν εἰς Ἱεροσόλυμα, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδοθήσεται τοῖς ἀρχιερεῦσιν καὶ γραμματεῦσιν, καὶ κατακρινοῦσιν αὐτὸν θανάτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/018.yaml
  text: Look[a], we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and scribes, and they will condemn him to death[c][b],
translation:
  language: uk
  text: Ось, ми піднімаємося до Єрусалима, і Син Людський[a] буде переданий[b] первосвященникам та книжникам, і вони засудять Його на смерть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Син Людський» — характерне самонайменування Ісуса; воно може відсилати до Даниїла 7:13–14.
    reason: cross_reference
  - marker: b
    text: 'Або: «буде відданий»; у вужчому контексті це дієслово може також означати «буде зраджений».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Ось
  rationale: Природний сучасний український вказівно-спонукальний відповідник, який привертає увагу без архаїчного забарвлення.
- source_word: ἀναβαίνομεν
  choice: ми йдемо вгору
  rationale: Зберігає теперішній час руху та значення підйому до Єрусалима.
- source_word: Ἱεροσόλυμα
  choice: Єрусалима
  rationale: Усталена українська форма назви міста після прийменника «до».
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сина Людського
  rationale: Усталене українське відтворення Ісусового самонайменування, яке зберігає можливий зв’язок із Даниїла 7:13–14.
- source_word: παραδοθήσεται
  choice: віддадуть
  rationale: Природно передає пасивну конструкцію як передання під чужу владу, не звужуючи значення лише до зради Юди.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: первосвященникам
  rationale: Усталений відповідник для множини, що позначає провідну священницьку владу.
- source_word: γραμματεῦσιν
  choice: книжникам
  rationale: Прямий і традиційно зрозумілий український відповідник назви знавців та вчителів Закону.
- source_word: κατακρινοῦσιν αὐτὸν θανάτῳ
  choice: вони засудять Його на смерть
  rationale: Природна українська юридична конструкція, що точно передає винесення смертного вироку.
theological_decisions:
- issue: Передача христологічного найменування ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Син Людський
  alternative: Людський Син
  rationale: Зберігає усталене біблійне найменування та можливий відгомін Даниїла 7, не зводячи вислів до загального позначення людини.
- issue: Обсяг значення παραδοθήσεται
  choice: віддадуть
  alternative: зрадять
  rationale: Не вносить у цей вірш вужчого уточнення про зраду, якого саме дієслово тут не вимагає; передає перехід під владу ворожих сторін.
translation_notes:
  register: Сучасна, природна й гідна українська мова. «Ось» передає функцію Ἰδοὺ без архаїзації; «йдемо вгору» зберігає образ сходження до Єрусалима. Великі літери в займеннику «Його» відповідають поширеній українській біблійній практиці, не змінюючи змісту оригіналу.
