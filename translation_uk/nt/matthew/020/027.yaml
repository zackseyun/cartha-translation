  text: І хто з вас хоче бути першим, буде вашим рабом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «невільником». Грецьке слово δοῦλος сильніше за слово «слуга» в попередньому вірші й часто означає людину, яка належить господареві та не є вільною.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἂν θέλῃ
  choice: хто … хоче
  rationale: Сполука відносного займенника з ἄν і кон’юнктивом виражає загальну невизначену умову; українське «хто … хоче» природно передає і узагальнення, і вольове значення θέλω.
- source_word: ἐν ὑμῖν
  choice: з вас
  rationale: У контексті становища всередині спільноти природний український вислів «хто з вас» передає належність до кола учнів і прагнення посісти серед них перше місце.
- source_word: εἶναι πρῶτος
  choice: бути першим
  rationale: Прямо й природно передає прагнення до найвищого становища.
- source_word: ἔσται
  choice: буде
  rationale: Збережено форму майбутнього часу; нормативна сила вислову випливає з контексту без заміни на «мусить бути».
- source_word: ὑμῶν
  choice: вашим
  rationale: 'Присвійний займенник природно передає родовий відмінок відношення: ця людина має стати рабом для інших учнів.'
- source_word: δοῦλος
  choice: рабом
  rationale: «Раб» передає сильніше значення δοῦλος і зберігає посилення порівняно з διάκονος у попередньому вірші.
theological_decisions:
- issue: Передача δοῦλος у вислові про учнівство
  choice: рабом
  alternative: слугою; невільником
  rationale: «Рабом» зберігає різкість образу добровільного самоприниження та не згладжує посилення після іншого слова на позначення служителя в попередньому вірші. Водночас примітка пояснює ширший діапазон значення, не нав’язуючи окремого доктринального тлумачення.
translation_notes:
  register: Сучасна, проста й гідна українська. Порядок слів природний для української мови; «рабом» свідомо зберігає різкий риторичний контраст оригіналу.
