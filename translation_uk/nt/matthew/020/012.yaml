  text: ⸀λέγοντες· Οὗτοι οἱ ἔσχατοι μίαν ὥραν ἐποίησαν, καὶ ἴσους ⸂αὐτοὺς ἡμῖν⸃ ἐποίησας τοῖς βαστάσασι τὸ βάρος τῆς ἡμέρας καὶ τὸν καύσωνα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/012.yaml
  text: saying[a], ‘These last worked one hour, and you made them equal to us who bore the burden of the day and the scorching heat.’
translation:
  language: uk
  text: 'кажучи: «Ці останні працювали одну годину, а ти зрівняв їх із нами — тими, хто зніс тягар дня і палючу спеку».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες
  choice: кажучи
  rationale: Дієприкметник теперішнього часу продовжує синтаксичний рух попереднього оповідання; українське «кажучи» зберігає цю форму природно.
- source_word: Οὗτοι οἱ ἔσχατοι
  choice: ці останні
  rationale: Вислів вказує на робітників, найнятих останніми, і стисло зберігає контраст грецького тексту.
- source_word: μίαν ὥραν ἐποίησαν
  choice: працювали одну годину
  rationale: ποιέω з позначенням тривалості в цьому контексті означає працювати протягом зазначеного часу.
- source_word: ἴσους αὐτοὺς ἡμῖν ἐποίησας
  choice: ти зрівняв їх із нами
  rationale: Передає каузативну конструкцію «зробив їх рівними нам» природною сучасною українською мовою та зберігає силу нарікання.
- source_word: τοῖς βαστάσασι
  choice: тими, хто зніс
  rationale: βαστάζω тут поєднує значення несення тягаря і витримування тяжких умов; «зніс» передає обидва відтінки.
- source_word: τὸ βάρος τῆς ἡμέρας
  choice: тягар дня
  rationale: Зберігає образ ваги повного робочого дня без зайвого пояснення.
- source_word: τὸν καύσωνα
  choice: палючу спеку
  rationale: καύσων означає сильну, пекучу спеку; «палюча спека» природно передає її інтенсивність.
theological_decisions:
- issue: Нарікання в притчі щодо рівності та справедливості
  choice: Передати протест робітників прямо, не додаючи оцінки справедливості господаря.
  alternative: Інтерпретаційно підкреслити, що з ними нібито вчинили несправедливо.
  rationale: Текст повідомляє слова незадоволених робітників, але сам цей вірш не пояснює і не розв’язує ширшого богословського напруження притчі.
translation_notes:
  register: Сучасна нормативна українська мова; тон гідний і розмовно природний для прямої мови. Тире перед уточненням «тими, хто…» виразно показує, що ця характеристика стосується «нас», не змінюючи змісту.
