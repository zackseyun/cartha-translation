review_pass:
  verdict: approve
  source_fidelity: 'Текст точно передає грецький синтаксичний зв’язок і зміст: participium λέγοντες відтворено як «кажучи», Οὗτοι οἱ ἔσχατοι — як «Ці останні», а μίαν ὥραν ἐποίησαν — природно як «працювали одну годину». «Ти зрівняв їх із нами» адекватно передає ἴσους αὐτοὺς ἡμῖν ἐποίησας, не послаблюючи нарікання. «Тими, хто зніс тягар дня і палючу спеку» зберігає означення до «нами» та образи βάρος і καύσων.'
  naturalness: Вислів нормативний для сучасної української. Тире перед «тими, хто…» чітко вводить прикладкове уточнення до «нами» й не створює змістової двозначності. «Палюча спека» та «зніс тягар дня» є природними й стилістично доречними.
  terminology: 'Ключові образні слова передано послідовно й без конфесійної інтерпретації: «тягар», «зніс», «палюча спека». Додаткова примітка не потрібна: англійська альтернатива «treated them as equal» не відображає окремої текстологічної чи семантичної неоднозначності, яку слід обов’язково маркувати в українському тексті.'
