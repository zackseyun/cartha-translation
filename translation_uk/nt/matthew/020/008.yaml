  text: ὀψίας δὲ γενομένης λέγει ὁ κύριος τοῦ ἀμπελῶνος τῷ ἐπιτρόπῳ αὐτοῦ· Κάλεσον τοὺς ἐργάτας καὶ ἀπόδος ⸀αὐτοῖς τὸν μισθὸν ἀρξάμενος ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/008.yaml
  text: When evening came, the master of the vineyard says to his steward, ‘Call the workers and pay them their wages, beginning with the last and ending with the first.’
translation:
  language: uk
  text: 'Коли ж настав вечір, господар виноградника каже своєму управителеві: «Поклич робітників і виплати їм заробітну плату, починаючи з останніх аж до перших».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: господар виноградника
  rationale: У контексті притчі κύριος означає власника або господаря виноградника; природний український відповідник — «господар».
- source_word: τῷ ἐπιτρόπῳ αὐτοῦ
  choice: своєму управителеві
  rationale: ἐπίτροπος тут позначає особу, якій доручено нагляд і ведення справ; «управитель» точно й природно передає цю роль.
- source_word: ἀπόδος αὐτοῖς τὸν μισθόν
  choice: віддай їм плату
  rationale: ἀποδίδωμι має відтінок віддання належного, а μισθός у цьому трудовому контексті — заробітна плата.
- source_word: ἀρξάμενος ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων
  choice: почавши з останніх і аж до перших
  rationale: Збережено порядок виплати та просторово-послідовну конструкцію ἀπό…ἕως без додавання відсутнього в грецькому тексті дієслова «закінчуючи».
theological_decisions:
- issue: Історичний теперішній час λέγει
  choice: каже
  alternative: сказав
  rationale: Збережено грецький історичний теперішній час, який робить оповідь безпосереднішою; це також відповідає аудованому англійському консультаційному шару.
translation_notes:
  register: Сучасна стандартна українська мова; виклад природний, виразний і гідний. Пряму мову оформлено українськими лапками. Сполуку «Коли ж настав вечір» обрано для передачі ὀψίας δὲ γενομένης зі збереженням зв’язку з попередньою оповіддю.
