  source_fidelity: 'Зміст і синтаксичні зв’язки передано точно: ὀψίας δὲ γενομένης — «Коли ж настав вечір», ὁ κύριος τοῦ ἀμπελῶνος — «господар виноградника», τῷ ἐπιτρόπῳ αὐτοῦ — «своєму управителеві». Історичний теперішній λέγει належно збережено як «каже». Послідовність виплати від останніх до перших також не змінено.'
  naturalness: «Віддай їм плату» зрозуміле, але в сучасній нормативній українській у трудовому контексті природніше й точніше вжити «виплати їм заробітну плату». «Починаючи з останніх» плавніше передає супровідний дієприкметниковий зворот ἀρξάμενος, ніж «почавши».
  terminology: «Господар», «виноградник» і «управитель» є влучними та нейтральними відповідниками. «Заробітна плата» точно передає μισθός у контексті найманої праці, не вводячи богословських конотацій.
