    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ οὕτως ἔσται ἐν ὑμῖν
  choice: Та між вами так не буде
  rationale: Майбутню форму ἔσται збережено як «не буде», що передає нормативну спрямованість слів Ісуса; ἐν ὑμῖν природно передано як «між вами».
- source_word: ἀλλ’ ὃς ἂν θέλῃ
  choice: Натомість хто ... хоче
  rationale: Конструкція ὃς ἂν із кон’юнктивом має узагальнено-умовний зміст, природно переданий словом «хто»; θέλῃ передано сучасним «хоче».
- source_word: μέγας γενέσθαι
  choice: стати великим
  rationale: «Стати» зберігає значення переходу до певного стану у γενέσθαι, а не зводить вислів до статичного «бути великим».
- source_word: ἔσται ὑμῶν διάκονος
  choice: нехай буде вам слугою
  rationale: У цьому приписовому вислові українська конструкція «нехай буде» природно передає нормативну силу майбутнього часу. διάκονος означає того, хто служить, без обов’язкової вказівки на пізнішу церковну посаду; давальний «вам» природно передає відношення, виражене родовим ὑμῶν.
theological_decisions:
- issue: Характер величі у спільноті послідовників Ісуса
  choice: Передати нормативне перевертання світської ієрархії через конкретний образ служіння, не вводячи пізнішої церковної посади
  alternative: Перекласти διάκονος як «диякон» або узагальнити думку як заклик до смирення
  rationale: Контекст протиставляє панування правителів устрою взаємин між учнями. «Слуга» зберігає конкретність образу й не надає слову невиправдано інституційного значення.
translation_notes:
  register: Сучасна нормативна українська мова; виклад природний і гідний. «Нехай буде» обрано замість буквального другого «буде», щоб українською виразно й без штучності передати приписовий характер вислову. Кінцеву кому збережено відповідно до поданого фрагмента, який продовжується наступним віршем.
