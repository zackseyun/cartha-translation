  text: ⸂καὶ ἐλθόντες⸃ οἱ περὶ τὴν ἑνδεκάτην ὥραν ἔλαβον ἀνὰ δηνάριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/009.yaml
  text: And those who came about the eleventh hour received a denarius each[a].
translation:
  language: uk
  text: І ті, що прийшли близько одинадцятої години, отримали по денарію[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Денарій — стандартна римська срібна монета; його часто вважали типовою денною платнею робітника.
    reason: cultural_note
lexical_decisions:
- source_word: καὶ
  choice: І
  rationale: Зберігає простий сполучниковий зв’язок із попередньою розповіддю, не додаючи сильнішого часового відтінку.
- source_word: ἐλθόντες
  choice: ті, що прийшли
  rationale: Природно передає аористовий дієприкметник, пов’язаний із підметом; не додає слова «найняті», якого в цьому реченні немає.
- source_word: οἱ περὶ τὴν ἑνδεκάτην ὥραν
  choice: ті, що прийшли близько одинадцятої години
  rationale: Часове περὶ з акузативом передано словом «близько», а групу осіб визначено через контекстуально пов’язаний дієприкметник ἐλθόντες.
- source_word: ἔλαβον
  choice: отримали
  rationale: У контексті виплати заробітку це природно передає одержання того, що їм дали.
- source_word: ἀνὰ
  choice: по
  rationale: 'Прийменникова конструкція «по денарію» стисло й природно передає розподільне значення: один денарій кожному.'
- source_word: δηνάριον
  choice: денарію
  rationale: Збережено історичну назву монети, а не замінено її тлумачним еквівалентом «денний заробіток».
theological_decisions: []
translation_notes:
  register: Сучасна стандартна українська мова; виклад простий, природний і гідний. Конструкція «по денарію» зберігає розподільне значення грецького ἀνά.
