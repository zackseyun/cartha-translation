  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ⸂συμφωνήσας δὲ⸃ μετὰ τῶν ἐργατῶν ἐκ δηναρίου τὴν ἡμέραν ἀπέστειλεν αὐτοὺς εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/002.yaml
  text: After agreeing with the workers for one denarius for the day[a], he sent them into his vineyard.
translation:
  language: uk
  text: Домовившись із робітниками про один динарій за день[a], він послав їх у свій виноградник.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Динарій був звичайною денною платою найманого робітника.
    reason: cultural_note
lexical_decisions:
- source_word: συμφωνήσας
  choice: Домовившись
  rationale: Аористовий активний дієприкметник позначає дію, що передує головній; український дієприслівник природно передає цю часову послідовність.
- source_word: δὲ
  choice: —
  rationale: Тут δέ є слабким оповідним сполучником; окремий відповідник українською обтяжив би речення, тоді як зв’язок природно передано дієприслівниковим зворотом.
- source_word: ἐργατῶν
  choice: робітниками
  rationale: Сучасне й зрозуміле позначення найманих працівників у контексті роботи у винограднику.
- source_word: ἐκ δηναρίου
  choice: про один динарій
  rationale: Прийменниковий вислів указує на погоджений розмір платні; з дієсловом «домовитися» природне керування «про», а назву давньої монети збережено.
- source_word: τὴν ἡμέραν
  choice: за день
  rationale: Знахідний часу вказує, що динарій був платою за день роботи, без додаткового уточнення, якого немає в грецькому тексті.
- source_word: ἀπέστειλεν
  choice: послав
  rationale: Прямий і природний відповідник оповідного дієслова.
- source_word: ἀμπελῶνα
  choice: виноградник
  rationale: Усталений сучасний український відповідник.
- source_word: αὐτοῦ
  choice: свій
  rationale: Український зворотний присвійний займенник природно вказує, що виноградник належить підметові речення.
