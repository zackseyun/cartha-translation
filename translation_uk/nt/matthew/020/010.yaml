  verdict: approve
  source_fidelity: Текст точно передає часовий аористовий зворот «коли прийшли», референт οἱ πρῶτοι як тих, кого найняли першими в притчі, їхнє очікування більшої платні та фактичну виплату по денарію кожному. «Але й вони» доречно передає контраст, який випливає з контексту й підкреслюється καὶ αὐτοί.
  naturalness: Фраза звучить природно й зрозуміло сучасною літературною українською. «По денарію» є звичною розподільною конструкцією; порядок слів не створює двозначності.
  terminology: «Денарій» — усталений і точний відповідник δηνάριον. Контекстуальне уточнення «найняті першими» є виправданим у межах притчі й не додає нового змісту. Примітки коректні, їхні маркери відповідають місцям у тексті.
