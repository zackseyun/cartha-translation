id: MAT.20.10
reference: Matthew 20:10
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ⸂καὶ ἐλθόντες⸃ οἱ πρῶτοι ἐνόμισαν ὅτι ⸀πλεῖον λήμψονται· καὶ ἔλαβον ⸂τὸ ἀνὰ δηνάριον καὶ αὐτοί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/010.yaml
  text: When the first ones came[a], they thought they would receive more[b], but they too received a denarius each.
translation:
  language: uk
  text: Коли прийшли найняті першими[a], вони подумали, що отримають більше, але й вони отримали по денарію[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «перші»; йдеться про робітників, яких у притчі найняли першими.'
    reason: lexical_alternative
  - marker: b
    text: Денарій був звичайною платнею робітника за один день праці.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντες
  choice: коли прийшли
  rationale: Аористовий дієприкметник має тут часове значення; підрядна конструкція природно передає послідовність подій українською.
- source_word: οἱ πρῶτοι
  choice: найняті першими
  rationale: У контексті притчі йдеться про робітників, яких найняли першими; додане «найняті» чітко відтворює контекстуальний референт, не перетворюючи вислів на абстрактне звання.
- source_word: ἐνόμισαν
  choice: подумали
  rationale: Дієслово виражає припущення або очікування; «подумали» є природним і не надає їхній думці надмірної певності.
- source_word: πλεῖον
  choice: більше
  rationale: Порівняльна форма позначає більшу суму платні; стислий відповідник «більше» зберігає природність.
- source_word: λήμψονται
  choice: отримають
  rationale: Майбутній час у непрямій мові передає очікування робітників; українська природно зберігає тут форму майбутнього часу.
- source_word: τὸ ἀνὰ δηνάριον
  choice: по денарію
  rationale: ἀνά зі знахідним відмінком має розподільне значення — по одному денарію кожному; українська конструкція «по денарію» передає це без зайвої громіздкості.
- source_word: καὶ αὐτοί
  choice: але й вони
  rationale: Сполука наголошує, що перші робітники отримали стільки ж, як інші; «й вони» передає додатковий акцент, а «але» природно увиразнює контраст між очікуванням і результатом.
