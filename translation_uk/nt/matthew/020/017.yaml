  text: ⸂Καὶ ἀναβαίνων ὁ⸃ Ἰησοῦς εἰς Ἱεροσόλυμα παρέλαβεν τοὺς δώδεκα ⸀μαθητὰς κατ’ ἰδίαν, ⸂καὶ ἐν τῇ ὁδῷ⸃ εἶπεν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/017.yaml
  text: And as Jesus was going up to Jerusalem, he took the twelve disciples aside by themselves, and on the way he said to them,
translation:
  language: uk
  text: 'Коли Ісус підіймався до Єрусалима, Він відвів дванадцятьох учнів убік і дорогою сказав їм:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβαίνων
  choice: підіймався
  rationale: Дієприкметник теперішнього часу позначає дію, одночасну з παρέλαβεν. «Підіймався» природно передає рух угору до Єрусалима, зберігаючи географічний і усталений оповідний відтінок.
- source_word: εἰς Ἱεροσόλυμα
  choice: до Єрусалима
  rationale: Прийменник εἰς із назвою міста природно передається українським «до»; «Єрусалим» — усталена українська форма назви.
- source_word: παρέλαβεν
  choice: відвів
  rationale: У поєднанні з κατ’ ἰδίαν дієслово означає, що Ісус узяв учнів окремо від інших. «Відвів ... убік» природно передає цілісний зміст конструкції, не додаючи мети, якої прямо не названо.
- source_word: τοὺς δώδεκα μαθητὰς
  choice: дванадцятьох учнів
  rationale: Переклад відтворює і числівник, і наявний у грецькому тексті іменник μαθητάς. Означеність групи в українській зрозуміла з контексту та форми числівника.
- source_word: κατ’ ἰδίαν
  choice: убік
  rationale: У цьому сполученні вислів позначає відокремлення від інших для приватної розмови. «Відвів ... убік» стисло й природно передає просторовий та приватний відтінки без надлишкового «самих».
- source_word: ἐν τῇ ὁδῷ
  choice: дорогою
  rationale: Природний сучасний український відповідник, що зберігає значення дії під час подорожі.
- source_word: εἶπεν αὐτοῖς
  choice: сказав їм
  rationale: Прямий і природний відповідник звичайного дієслова мовлення λέγω; двокрапка готує до змісту слів у наступному вірші.
theological_decisions: []
translation_notes:
  register: Сучасна нормативна українська мова, гідний і доступний оповідний стиль. Збережено тривалість руху в ἀναβαίνων та приватність κατ’ ἰδίαν. Займенник «Він» подано з великої літери відповідно до поширеної української біблійної видавничої норми, без зміни змісту оригіналу.
