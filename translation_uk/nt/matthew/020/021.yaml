base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/021.yaml
  text: And he said to her[a], “What do you want?” She said to him, “Command that these two sons of mine may sit, one at your right and one at your left[c][b], in your kingdom.”
translation:
  language: uk
  text: 'А він сказав їй: «Чого ти хочеш?» Вона відповіла йому: «Скажи[a], щоб ці двоє моїх синів сіли — один праворуч від тебе, а другий ліворуч від тебе — у твоєму Царстві[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Грецьке слово буквально означає «скажи»; у цьому контексті його також можна передати як «звели» або «накажи», а більш тлумачно — «дозволь».
    reason: lexical_alternative
  - marker: b
    text: Або «за твого царювання» чи «під твоєю царською владою».
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί θέλεις
  choice: Чого ти хочеш?
  rationale: Прямо й природно передає запитання про бажання та прохання жінки, не надаючи вислову зайвої урочистості.
- source_word: Εἰπὲ
  choice: Скажи
  rationale: Зберігає основне значення грецького дієслова λέγω. У конструкції «скажи, щоб» українською природно відчувається прохання владно визначити належні місця, але без внесення сильнішого дієслова «накажи» в основний текст.
- source_word: ἵνα καθίσωσιν
  choice: щоб ... сіли
  rationale: Передає зміст прохання про те, щоб сини посіли визначені місця; доконаний вид природно відповідає аористу й контексту призначення місць.
- source_word: οὗτοι οἱ δύο υἱοί μου
  choice: ці двоє моїх синів
  rationale: Зберігає вказівний займенник οὗτοι, числівник і особисту належність, водночас звучачи природно сучасною українською.
- source_word: εἷς ἐκ δεξιῶν σου καὶ εἷς ἐξ εὐωνύμων σου
  choice: один праворуч від тебе, а другий ліворуч від тебе
  rationale: Чітко й симетрично передає просторові місця по правий і лівий бік; «а другий» природно виражає українською зіставлення двох синів.
- source_word: ἐν τῇ βασιλείᾳ σου
  choice: у твоєму Царстві
  rationale: «Царство» є природним і усталеним відповідником βασιλεία в цьому царському контексті, не виключаючи значення царювання або влади.
theological_decisions:
- issue: Характер місць праворуч і ліворуч від Ісуса в його Царстві
  choice: Передати прохання просторово як прохання про почесні місця в Царстві Ісуса, не уточнюючи його земної чи небесної фази.
  alternative: Тлумачити вислів винятково як земне месіанське царство або винятково як остаточне небесне Царство.
  rationale: Грецький текст говорить про сидіння праворуч і ліворуч у Царстві Ісуса, але сам не визначає есхатологічної схеми; переклад зберігає цю богословську відкритість.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Займенники щодо Ісуса подано з малої літери відповідно до нейтральної сучасної орфографічної практики; назву «Царство» вжито з великої літери як традиційне позначення Божого/Месіанського Царства. Тире увиразнюють парну конструкцію місць праворуч і ліворуч.
