lexical_decisions:
- source_word: περὶ δὲ τὴν ἑνδεκάτην
  choice: А близько одинадцятої години
  rationale: περί зі знахідним відмінком передає приблизність, а «одинадцята година» зберігає часовий образ притчі й не підмінює давній спосіб відліку сучасним.
- source_word: ἐξελθὼν
  choice: він вийшов
  rationale: Аористовий дієприкметник означає дію, що передує знахідці; особова форма природно й послідовно передає це українською.
- source_word: εὗρεν ἄλλους
  choice: знайшов інших
  rationale: Прямий відповідник; субстантивований прикметник ἄλλους не потребує додавання слова «чоловіків».
- source_word: ἑστῶτας
  choice: що стояли там
  rationale: Перфектний дієприкметник описує тривалий стан; підрядна конструкція звучить природно українською, а «там» увиразнює місце без зміни змісту.
- source_word: καὶ λέγει αὐτοῖς
  choice: та й каже їм
  rationale: Збережено історичний теперішній час грецького тексту та його оповідну жвавість.
- source_word: Τί ὧδε ἑστήκατε
  choice: Чому ви стоїте тут
  rationale: У цьому питальному звороті τί природно означає «чому»; форма «стоїте» передає наявний тривалий стан без неприродної української конструкції.
- source_word: ὅλην τὴν ἡμέραν ἀργοί
  choice: цілий день без діла
  rationale: Природний український відповідник обставини тривалості та прикметника ἀργοί — «бездіяльні, ті, що не працюють»; він не додає сучасного соціально-економічного значення «безробітні».
