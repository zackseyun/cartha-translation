  text: And about the eleventh hour he went out and found others standing there[a], and he says to them[b], ‘Why have you been standing here idle all day?’
translation:
  language: uk
  text: 'А близько одинадцятої години[a] він вийшов і знайшов інших, що стояли там, і каже їм[b]: «Чому ви стоїте тут цілий день без діла?»'
  philosophy: optimal-equivalence
  footnotes:
