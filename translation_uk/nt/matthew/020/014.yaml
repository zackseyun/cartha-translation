  yaml_path: translation/nt/matthew/020/014.yaml
  text: Take what is yours and go[a]. But I want to give to this last man the same as to you.
translation:
  language: uk
  text: Візьми своє та йди. А цьому останньому я хочу дати стільки ж, скільки й тобі.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἆρον
  choice: Візьми
  rationale: Аористовий наказовий спосіб αἴρω тут означає взяти те, що належить адресатові; «візьми» природно передає прямий наказ.
- source_word: τὸ σὸν
  choice: своє
  rationale: Субстантивований займенниковий вислів буквально означає «те, що твоє». Українське «своє» лаконічно зберігає широту вислову, не додаючи прямо не названого слова «заробіток».
- source_word: ὕπαγε
  choice: йди
  rationale: У цьому контексті ὕπαγε є наказом піти. «Йди» передає його стисло й без зайвого посилення ворожого тону.
- source_word: θέλω δὲ
  choice: А ... я хочу
  rationale: θέλω виражає волю або намір, а δέ — легке протиставлення; конструкція «А ... я хочу» природна в сучасній українській.
- source_word: τούτῳ τῷ ἐσχάτῳ
  choice: цьому останньому
  rationale: Чоловічі форми однини вказують на конкретного робітника-чоловіка; український субстантивований прикметник природно зберігає і особову, і родову вказівку без додавання іменника.
- source_word: δοῦναι
  choice: дати
  rationale: Інфінітив δίδωμι має загальне значення «дати». Воно зберігає формулювання грецького тексту, хоча з контексту йдеться про плату.
- source_word: ὡς καὶ σοί
  choice: стільки ж, скільки й тобі
  rationale: Порівняльна конструкція виражає однакову суму для двох робітників; такий відповідник природно й точно передає мається на увазі рівність виплати.
theological_decisions:
- issue: Передача чоловічого особового референта в τούτῳ τῷ ἐσχάτῳ
  choice: цьому останньому
  alternative: цій останній людині
  rationale: Грецькі форми чоловічого роду стосуються конкретного робітника в притчі. Українське «цьому останньому» зберігає граматичний рід і не вводить неприродного уточнення.
translation_notes:
  register: 'Сучасна стандартна українська; вислів прямий, природний і гідний. Частку «та» в «Візьми своє та йди» вжито для плавного поєднання двох наказів. Примітку англійського консультаційного шару не перенесено: її текст не відповідає позиції маркера та фактично дублює другу половину вірша, тоді як у грецькому тексті тут немає окремого текстологічного або суттєвого лексичного варіанта.'
