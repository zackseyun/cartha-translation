review_pass:
  verdict: approve
  source_fidelity: Переклад точно передає синтаксичне зіставлення ὥσπερ, титул «Син Людський», заперечену мету приходу, контраст διακονηθῆναι / διακονῆσαι, а також «віддати Своє життя як викуп за багатьох». «Життя» коректно передає ψυχή у цьому контексті. Примітка належно документує виразніше замісне значення ἀντί, не нав’язуючи тлумачення основному текстові.
  naturalness: Текст звучить природно сучасною літературною українською. Конструкція «не для того, щоб Йому служили, а щоб служити» ясна й зберігає навмисний словесний контраст. «Так само й» доречно пов’язує вислів із попередньою настановою.
  terminology: «Син Людський» є усталеним титульним відповідником; «викуп» точно й зрозуміло відтворює λύτρον. Написання займенників щодо Ісуса з великої літери відповідає поширеній українській біблійній редакційній нормі. Якір примітки [a] правильно стоїть після вислову, якого вона стосується.
