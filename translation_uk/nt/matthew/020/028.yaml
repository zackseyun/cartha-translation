id: MAT.20.28
reference: Matthew 20:28
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ὥσπερ ὁ υἱὸς τοῦ ἀνθρώπου οὐκ ἦλθεν διακονηθῆναι ἀλλὰ διακονῆσαι καὶ δοῦναι τὴν ψυχὴν αὐτοῦ λύτρον ἀντὶ πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/028.yaml
  text: just as the Son of Man did not come to be served[a], but to serve, and to give his life as a ransom for many.
translation:
  language: uk
  text: Так само й Син Людський прийшов не для того, щоб Йому служили, а щоб служити й віддати Своє життя як викуп за багатьох.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або, виразніше: «як викуп замість багатьох».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ
  choice: Так само й
  rationale: Природно вводить порівняння з попередньою настановою та зберігає силу грецького сполучника.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Син Людський
  rationale: Усталене українське передання самоназви Ісуса, яке зберігає її титульне значення та зв’язок із Даниїла 7.
- source_word: οὐκ ἦλθεν
  choice: прийшов не
  rationale: Простий минулий час точно й природно передає аорист, не додаючи відсутніх у тексті обставин.
- source_word: διακονηθῆναι
  choice: щоб Йому служили
  rationale: Передає пасивний інфінітив звичайною сучасною українською мовою та готує виразний словесний контраст.
- source_word: ἀλλὰ διακονῆσαι
  choice: а щоб служити
  rationale: Зберігає протиставлення форм того самого грецького дієслова без церковно-професійного звуження значення.
- source_word: καὶ δοῦναι
  choice: й віддати
  rationale: У контексті добровільного принесення життя «віддати» звучить природно й точно, не додаючи способу цієї дії.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: Своє життя
  rationale: Тут ψυχή означає життя, яке віддають до смерті, а не лише нематеріальну душу; зворотний займенник природний, оскільки дія стосується підмета.
- source_word: λύτρον
  choice: викуп
  rationale: Позначає плату за звільнення; українське «викуп» стисло передає образ і його визвольний зміст.
- source_word: ἀντὶ πολλῶν
  choice: за багатьох
  rationale: Природний український вислів, який у цьому контексті може передавати дію на користь інших; виразніше замісне значення ἀντί зафіксовано в примітці.
theological_decisions:
- issue: Сила прийменника ἀντί у вислові про викуп
  choice: 'У головному тексті: «викуп за багатьох»; у примітці уточнено можливе замісне значення.'
  alternative: «викуп замість багатьох»
  rationale: ἀντί часто виражає обмін або заміщення. Основний варіант є природним українською і не усуває цього змісту, а примітка зберігає виразніший лексичний відтінок, не перетворюючи переклад на богословське тлумачення.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Повтор «служили — служити» навмисно зберігає риторичний контраст оригіналу. Займенники щодо Ісуса подано з великої літери відповідно до поширеної української біблійної норми.
