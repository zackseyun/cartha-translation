  text: ὁ δὲ Ἰησοῦς προσκαλεσάμενος αὐτοὺς εἶπεν· Οἴδατε ὅτι οἱ ἄρχοντες τῶν ἐθνῶν κατακυριεύουσιν αὐτῶν καὶ οἱ μεγάλοι κατεξουσιάζουσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/025.yaml
  text: But Jesus[a], calling them to himself, said, “You know that the rulers of the Gentiles lord it over them[b], and their great men exercise authority over them.”
translation:
  language: uk
  text: 'Але Ісус, покликавши їх до себе, сказав: «Ви знаєте, що правителі народів[a] панують над ними, а вельможі[b] мають над ними владу».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «язичників».
    reason: alternative_reading
  - marker: b
    text: Або «великі люди» чи «високі урядовці».
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: покликавши їх до себе
  rationale: Аористовий дієприкметник середнього стану від προσκαλέομαι передає те, що Ісус спершу покликав учнів до себе; такий вислів природно відтворює цей відтінок українською.
- source_word: Οἴδατε
  choice: Ви знаєте
  rationale: Хоча οἶδα має форму перфекта, тут воно має теперішнє значення; «ви знаєте» є точним і природним відповідником.
- source_word: ἄρχοντες
  choice: правителі
  rationale: Слово позначає тих, хто править або керує; «правителі» зберігає широкий політичний зміст.
- source_word: τῶν ἐθνῶν
  choice: язичників
  rationale: У юдейському контексті ἔθνη означає неюдейські народи. «Язичники» передає усталене новозавітне значення, а примітка зберігає можливість перекладу «народи».
- source_word: κατακυριεύουσιν
  choice: панують над
  rationale: Дієслово означає владно панувати над кимось і в цьому контексті має негативний відтінок; українське «панують над» природно передає владне підкорення.
- source_word: οἱ μεγάλοι
  choice: вельможі
  rationale: Субстантивований прикметник позначає великих за становищем, впливових осіб. «Вельможі» стисло й природно передає соціально-політичну вагу цих людей.
- source_word: κατεξουσιάζουσιν
  choice: мають над ними владу
  rationale: Вислів прямо передає здійснення влади над іншими; негативний відтінок підтримується паралелізмом із «панують над ними».
- source_word: αὐτῶν
  choice: ними
  rationale: Займенник стосується людей із названих народів; український займенник у множині природно уникає непотрібного повтору.
theological_decisions:
- issue: Значення ἐθνῶν у вислові Ісуса в юдейському контексті
  choice: язичників
  alternative: народів
  rationale: Контекст протиставляє звичний спосіб панування серед неюдейських народів устрою, якого Ісус навчає учнів. Основний текст передає це словом «язичники», а примітка зберігає ширше лексичне значення.
- issue: Передача граматично чоловічого οἱ μεγάλοι
  choice: вельможі
  alternative: великі люди; високі урядовці
  rationale: Грецький вислів граматично чоловічого роду й позначає осіб високого суспільного або політичного становища. «Вельможі» не усуває цього історичного відтінку, а примітка подає можливі лексичні відповідники без нав’язування конкретної посади.
translation_notes:
  register: Сучасна стандартна українська мова з гідним, загальнозрозумілим біблійним регістром. Паралельні звороти «панують над ними» та «мають над ними владу» зберігають риторичну будову грецького речення; примітки стоять безпосередньо після слів, яких вони стосуються.
