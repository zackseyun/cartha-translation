  text: ὁ δὲ ἀποκριθεὶς ⸂ἑνὶ αὐτῶν εἶπεν⸃· Ἑταῖρε, οὐκ ἀδικῶ σε· οὐχὶ δηναρίου συνεφώνησάς μοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/013.yaml
  text: But answering[a], he said to one of them, ‘Friend, I am not wronging you[b]. Did you not agree with me for a denarius?’
translation:
  language: uk
  text: 'Та він відповів одному з них: «Друже, я не чиню тобі кривди. Хіба ти не домовився зі мною за денарій?[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Денарій — римська срібна монета; у цьому контексті він становить звичайну денну платню найманого робітника.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: відповів
  rationale: Природна українська передача грецької конструкції з дієприкметником і дієсловом мовлення без важкого буквального «відповівши, сказав».
- source_word: ἑνὶ αὐτῶν
  choice: одному з них
  rationale: 'Точно передає давальний однини з родовим частковим: господар звертається до одного представника групи.'
- source_word: Ἑταῖρε
  choice: Друже
  rationale: Природне звертання, яке зберігає можливий контекстуальний відтінок стриманості, не додаючи удаваної близькості.
- source_word: οὐκ ἀδικῶ σε
  choice: я не чиню тобі несправедливості
  rationale: Передає теперішній час і значення ἀδικέω — поводитися з кимось несправедливо, кривдити — у ясній сучасній українській формі.
- source_word: οὐχὶ
  choice: Хіба ... не
  rationale: Українська риторична конструкція природно показує, що мовець очікує ствердної відповіді.
- source_word: δηναρίου
  choice: за денарій
  rationale: Зберігає історичну назву монети й передає родовий ціни при συμφωνέω.
- source_word: συνεφώνησάς μοι
  choice: ти не домовився зі мною
  rationale: «Домовитися» природно позначає досягнення попередньої угоди та добре передає аорист.
theological_decisions: []
