  register: Сучасна стандартна українська; мова природна й гідна, діалогічна риторична сила збережена. Грецьку конструкцію ἀποκριθεὶς ... εἶπεν передано одним дієсловом «відповів», щоб уникнути неприродного українського дублювання.
