  rationale: 'Виправлено лише силу дієслова ἠνάγκασεν і трохи уточнено відповідник προάγειν αὐτόν. Примітку не додано: альтернативне «відіслати натовпи» не потрібне для розуміння українського основного тексту. Англійська примітка в аудитному матеріалі змістовно стосується ἀπολύσῃ, хоча її маркер поставлено після «other side»; цей помилковий якір не відтворюється.'
