  naturalness: Текст загалом природний сучасною українською. «Вирушити перед ним» є дещо прямішим і ясніше передає προάγειν αὐτόν, ніж «вирушити раніше за нього».
  terminology: «Учні», «човен», «на той бік» і «натовпи» відповідають грецькому текстові та придатні для сучасного нейтрального біблійного реєстру. «Відпустить натовпи» допустиме в цьому контексті.
