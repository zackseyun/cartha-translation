source:
  edition: SBLGNT
  text: Καὶ εὐθέως ⸀ἠνάγκασεν τοὺς μαθητὰς ἐμβῆναι ⸀εἰς πλοῖον καὶ προάγειν αὐτὸν εἰς τὸ πέραν, ἕως οὗ ἀπολύσῃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/022.yaml
  text: And immediately he compelled the disciples to get into the boat and go on ahead of him to the other side[a], until he should dismiss the crowds.
translation:
  language: uk
  text: І відразу ж він змусив учнів сісти в човен і вирушити перед ним на той бік, поки він відпустить натовпи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθέως
  choice: відразу ж
  rationale: Природно передає негайність дії та швидкий перехід у розповіді.
- source_word: ἠνάγκασεν
  choice: звелів
  rationale: У контексті передає наполегливе спонукання або владну вимогу, не додаючи не засвідченого текстом фізичного примусу.
- source_word: τοὺς μαθητάς
  choice: учням
  rationale: Означений артикль указує на вже відому групу; присвійне «своїм» у грецькому тексті прямо не виражене.
- source_word: ἐμβῆναι εἰς πλοῖον
  choice: сісти в човен
  rationale: Звичний сучасний український вислів для входження або посадки в човен.
- source_word: πλοῖον
  choice: човен
  rationale: Контекст визначає конкретний човен; в українській означеність тут зрозуміла без окремого артикля.
- source_word: προάγειν αὐτόν
  choice: вирушити раніше за нього
  rationale: Передає те, що учні мали відбути перед Ісусом; формулювання природне й не припускає, що вони просто рухалися попереду нього тим самим шляхом.
- source_word: εἰς τὸ πέραν
  choice: на той бік
  rationale: Усталено й природно позначає протилежний берег водойми.
- source_word: ἕως οὗ ἀπολύσῃ
  choice: поки він відпустить
  rationale: Сполука з аористом кон’юнктива позначає майбутню щодо головної дії межу; український доконаний вид природно зберігає цю перспективу.
- source_word: ἀπολύσῃ τοὺς ὄχλους
  choice: відпустить натовпи
  rationale: Передає значення «відпустити, розпустити, відіслати» в цьому контексті.
- source_word: τοὺς ὄχλους
  choice: натовпи
  rationale: Зберігає виразну множину грецького тексту й звучить сучасно.
theological_decisions: []
translation_notes:
  register: 'Сучасна стандартна українська мова; оповідний стиль природний і гідний. «Звелів» зберігає силу ἠνάγκασεν без надмірного відтінку насильства. В англійському консультаційному шарі примітка [a], імовірно, прикріплена помилково: її текст стосується ἀπολύσῃ τοὺς ὄχλους, а не εἰς τὸ πέραν. Оскільки український основний текст прямо передає це значення без суттєвої неоднозначності, примітку не додано.'
