  text: εὐθέως δὲ ὁ Ἰησοῦς ἐκτείνας τὴν χεῖρα ἐπελάβετο αὐτοῦ καὶ λέγει αὐτῷ· Ὀλιγόπιστε, εἰς τί ἐδίστασας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/031.yaml
  text: Immediately Jesus stretched out his hand[a], took hold of him, and said to him, “You of little faith, why did you doubt?”
translation:
  language: uk
  text: 'Ісус одразу простягнув руку, схопив його й сказав йому: «Маловіре, чому ти засумнівався[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «завагався». Грецьке дієслово може означати як сумнів, так і вагання чи нерішучість.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: одразу
  rationale: Природно передає негайність дії та зберігає напружений темп оповіді.
- source_word: δὲ
  choice: —
  rationale: Легкий перехідний або протиставний відтінок зрозумілий із контексту; окреме «же» чи «але» тут обтяжило б сучасну українську фразу.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: простягнув руку
  rationale: Зберігає конкретний образ і послідовність дій, природно звучачи українською.
- source_word: ἐπελάβετο αὐτοῦ
  choice: схопив його
  rationale: Передає рішучу дію — Ісус узяв Петра й утримав його — без додавання невиражених деталей.
- source_word: λέγει αὐτῷ
  choice: сказав йому
  rationale: Грецький історичний теперішній передано природним для української оповіді минулим часом; зміст і жвавість сцени не втрачаються.
- source_word: Ὀλιγόπιστε
  choice: Маловіре
  rationale: Стислий український кличний відповідник, що означає людину з малою, недостатньою вірою, а не цілковито невіруючу.
- source_word: εἰς τί
  choice: чому
  rationale: Природний український відповідник запитання про причину.
- source_word: ἐδίστασας
  choice: засумнівався
  rationale: Передає основний контекстуальний сенс дієслова, водночас його відтінок вагання збережено в примітці.
theological_decisions:
- issue: Передача Ὀλιγόπιστε у зв’язку з поняттям віри
  choice: Маловіре
  alternative: Ти, маловірний
  rationale: Звертання вказує на недостатність віри Петра, не перетворюючи докір на твердження про повну відсутність віри.
- issue: Смисловий діапазон ἐδίστασας
  choice: засумнівався
  alternative: завагався
  rationale: Основний текст передає сумнів, але примітка зберігає можливий відтінок внутрішнього вагання, не визначаючи його як усталене невірство.
translation_notes:
  register: Сучасна нормативна українська мова з гідним, виразним біблійним звучанням. Речення побудоване природно для оповідного минулого часу; кличний відмінок «Маловіре» зберігає прямоту докору.
