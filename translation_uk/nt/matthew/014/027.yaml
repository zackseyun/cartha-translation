  yaml_path: translation/nt/matthew/014/027.yaml
  text: But immediately Jesus spoke to them[a], saying, “Take courage; it is I. Do not be afraid.”
translation:
  language: uk
  text: 'Та Ісус відразу заговорив до них: «Будьте відважні! Це я[a]. Не бійтеся».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або дослівніше: «Я є». Грецький вислів тут може бути звичайним самопредставленням, хоча деякі читачі вбачають у ньому можливий відгомін божественного самонайменування.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθὺς
  choice: відразу
  rationale: Природно й точно передає негайність дії в сучасній українській мові.
- source_word: δὲ
  choice: Та
  rationale: Передає легке протиставлення між переляком учнів у попередньому вірші та негайною відповіддю Ісуса.
- source_word: ἐλάλησεν αὐτοῖς ὁ Ἰησοῦς λέγων
  choice: Ісус … заговорив до них
  rationale: Природна українська оповідна конструкція, що передає і дієслово мовлення, і адресатів без надлишкового «кажучи».
- source_word: Θαρσεῖτε
  choice: Будьте відважні
  rationale: Передає наказ набратися мужності; вислів зрозумілий, сучасний і зберігає підбадьорливий тон.
- source_word: ἐγώ εἰμι
  choice: Це Я
  rationale: У безпосередньому контексті Ісус називає себе наляканим учням. Це природне українське самопредставлення, а буквальнішу форму збережено в примітці.
- source_word: μὴ φοβεῖσθε
  choice: Не бійтеся
  rationale: Звичний і точний український відповідник заборонного наказу, який не перебільшує аспектуального значення.
theological_decisions:
- issue: Чи передавати ἐγώ εἰμι як просте самопредставлення, чи як виразний відгомін божественного самонайменування
  choice: 'В основному тексті: «Це Я»'
  alternative: «Я є»
  rationale: Безпосередній контекст вказує на те, що Ісус заспокоює учнів, називаючи себе. Примітка зберігає буквальну форму та можливий богословський відгомін, не нав’язуючи його як єдине тлумачення.
translation_notes:
  register: Сучасна нормативна українська мова; тон лаконічний, підбадьорливий і гідний. Синтаксис природний для оповідного тексту, без архаїзмів і конфесійно забарвлених уточнень.
