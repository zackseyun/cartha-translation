source:
  edition: SBLGNT
  text: καὶ θέλων αὐτὸν ἀποκτεῖναι ἐφοβήθη τὸν ὄχλον, ὅτι ὡς προφήτην αὐτὸν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/005.yaml
  text: And wanting to kill him[a], he feared the crowd[b], because they regarded him as a prophet.
translation:
  language: uk
  text: І хоча він хотів убити його[a], та боявся натовпу, бо люди вважали його пророком[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальніше: «бажаючи вбити його, він боявся натовпу». У цьому контексті дієприкметник можна розуміти допустово: «хоча він хотів убити його».'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «мали його за пророка».'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλων
  choice: хоча він хотів
  rationale: 'Дієприкметник θέλων буквально передає бажання, а в цьому контексті має допустовий зв’язок з основним дієсловом: попри бажання вбити, він боявся натовпу. Конструкція «хоча він хотів» природно виражає цей зв’язок українською.'
- source_word: ἀποκτεῖναι
  choice: убити
  rationale: Дієслово означає «вбити, позбавити життя». «Убити» є прямим сучасним відповідником; «стратити» конкретизувало б спосіб чи юридичний характер смерті, чого саме слово не вимагає.
- source_word: ἐφοβήθη
  choice: боявся
  rationale: Форма від φοβέομαι означає «боятися». Український недоконаний вид природно передає страх як причину, що стримувала його від дії.
- source_word: τὸν ὄχλον
  choice: натовпу
  rationale: ὄχλος позначає натовп або велику групу людей. «Натовп» є точним і загальнозрозумілим відповідником.
- source_word: ὅτι
  choice: бо
  rationale: Сполучник вводить причину страху. «Бо» стисло й природно передає причинний зв’язок у сучасній українській оповіді.
- source_word: ὡς προφήτην
  choice: пророком
  rationale: Конструкція з ὡς та знахідним відмінком виражає те, ким люди його вважали. Орудний відмінок після «вважали» природно відтворює цю предикативну функцію українською.
- source_word: αὐτὸν εἶχον
  choice: люди вважали його
  rationale: ἔχω з предикативним додатком тут має ідіоматичне значення «вважати кимось». Множина εἶχον узгоджується з людьми, які становлять натовп; слово «люди» робить це природним українською, не змінюючи референта.
theological_decisions:
- issue: Особи, позначені в грецькому тексті лише займенниками
  choice: Зберегти «він» і «його», не додаючи імен Ірода та Івана
  alternative: «Хоча Ірод хотів убити Івана…»
  rationale: Безпосередній контекст визначає осіб, але сам вірш уживає займенники. Їх збереження не робить переклад незрозумілим у контексті й не додає явної інформації до форми джерела.
- issue: Смисловий зв’язок дієприкметника θέλων з дієсловом ἐφοβήθη
  choice: 'Передати допустово: «хоча він хотів… та боявся»'
  alternative: 'Формально: «бажаючи вбити його, він боявся натовпу»'
  rationale: Грецький дієприкметник сам по собі не маркує допустовості однозначно, проте контекст протиставляє намір убити страхові перед натовпом. Основний текст передає найімовірніший зв’язок, а буквальнішу форму наведено в примітці, щоб зберегти формальну неоднозначність.
translation_notes:
  register: Сучасна літературна українська з гідним оповідним тоном. Синтаксис природний для широкого кола читачів; займенники збережено відповідно до грецького тексту, а допустове прочитання дієприкметника позначено без надмірного тлумачення.
