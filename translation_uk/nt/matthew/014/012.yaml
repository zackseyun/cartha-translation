id: MAT.14.12
reference: Matthew 14:12
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ἦραν τὸ ⸀πτῶμα καὶ ἔθαψαν ⸀αὐτόν, καὶ ἐλθόντες ἀπήγγειλαν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/012.yaml
  text: And his disciples came[a], took the body, and buried him; then they went and reported it to Jesus.
translation:
  language: uk
  text: Його учні прийшли, забрали тіло[a] й поховали його, а тоді пішли та повідомили Ісуса.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «труп». Грецьке слово означає мертве тіло.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: прийшли
  rationale: Дієприкметник аориста від προσέρχομαι вводить дію учнів після смерті Івана. «Прийшли» природно передає наближення в цьому контексті.
- source_word: μαθηταὶ αὐτοῦ
  choice: його учні
  rationale: У найближчому контексті йдеться про учнів Івана Хрестителя. «Учні» зберігає усталене значення μαθηταί і не уточнює референта понад формулювання грецького тексту.
- source_word: ἦραν
  choice: забрали
  rationale: У поховальному контексті αἴρω означає взяти й понести тіло. «Забрали» природніше українською, ніж буквальне «підняли», і не додає способу перенесення.
- source_word: πτῶμα
  choice: тіло
  rationale: Слово позначає мертве тіло. «Тіло» є природним і гідним для оповідного стилю; точніше й різкіше «труп» подано у примітці.
- source_word: ἔθαψαν αὐτόν
  choice: поховали його
  rationale: Прямо передає θάπτω («ховати»). Чоловічий займенник «його» відповідає αὐτόν і вказує на померлого Івана, не додаючи відсутніх у вірші подробиць про гробницю.
- source_word: ἐλθόντες
  choice: а тоді пішли
  rationale: Дієприкметник позначає наступний рух і дію. Фінітна конструкція з «тоді» природно передає послідовність подій українською.
- source_word: ἀπήγγειλαν
  choice: повідомили
  rationale: ἀπαγγέλλω означає донести звістку або повідомити. Українське «повідомили» допускає невиражений у грецькому тексті зміст повідомлення без додавання займенника «це».
- source_word: τῷ Ἰησοῦ
  choice: Ісуса
  rationale: Після «повідомили» українська нормативно вживає знахідний відмінок особи-адресата. «Ісус» є усталеною українською формою імені Ἰησοῦς.
theological_decisions:
- issue: Кого означає вислів «його учні»
  choice: У контексті маються на увазі учні Івана Хрестителя.
  alternative: Учні Ісуса.
  rationale: Найближчим референтом у розповіді є Іван Хреститель, чию смерть і поховання описано. Водночас переклад «його учні» зберігає займенникову форму оригіналу й не підмінює її явним ім’ям.
translation_notes:
  register: Сучасна стандартна українська мова; стислий, гідний оповідний стиль. Координація дій зроблена природною для українського синтаксису, а лексичну виразність πτῶμα збережено через примітку.
