  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐ χρείαν ἔχουσιν ἀπελθεῖν· δότε αὐτοῖς ὑμεῖς φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/016.yaml
  text: But Jesus said to them[a], “They have no need to go away; you yourselves give them something to eat.”
translation:
  language: uk
  text: 'А Ісус сказав їм: «Їм не треба йти. Ви самі дайте їм їсти».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: А
  rationale: Передає легке протиставлення до пропозиції учнів і водночас природно продовжує українську розповідь.
- source_word: εἶπεν αὐτοῖς
  choice: сказав їм
  rationale: Прямий і природний відповідник оповідної формули з непрямим додатком.
- source_word: Οὐ χρείαν ἔχουσιν
  choice: Їм не треба
  rationale: Природно передає грецьку ідіому «не мають потреби», не змінюючи її значення.
- source_word: ἀπελθεῖν
  choice: йти
  rationale: У контексті попередньої пропозиції відпустити людей означає залишити це місце; українське «йти» стисло й природно передає цей рух.
- source_word: δότε
  choice: дайте
  rationale: Передає аористовий наказовий спосіб другої особи множини без надмірного тлумачення виду.
- source_word: αὐτοῖς
  choice: їм
  rationale: Займенник стосується людей у натовпі та природно оформлюється давальним відмінком при «дайте».
- source_word: ὑμεῖς
  choice: ви самі
  rationale: 'Зберігає наголос, створений явним особовим займенником: саме учні мають виконати наказ.'
- source_word: φαγεῖν
  choice: їсти
  rationale: Конструкція «дайте їм їсти» є природною українською відповідністю δίδωμι з інфінітивом і не потребує додавання іменника «їжу».
theological_decisions:
- issue: Наголос на ролі учнів у наказі Ісуса
  choice: Передати ὑμεῖς наголошено як «ви самі»
  alternative: Передати просто як «ви»
  rationale: Явний займенник у грецькому тексті наголошує на учнях як виконавцях наказу; переклад зберігає цей акцент, не додаючи богословського тлумачення.
translation_notes:
  register: Сучасна стандартна українська; проста, гідна й придатна для усного читання. «Їм не треба йти» та «дайте їм їсти» природно передають грецькі конструкції, а «ви самі» зберігає оригінальний наголос.
