lexical_decisions:
- source_word: ἔλεγεν
  choice: раз у раз казав
  rationale: Імперфект передає тривалу або повторювану дію в минулому; цей природний український вислів виразно передає повторюваність.
- source_word: γὰρ
  choice: Бо
  rationale: Сполучник вводить пояснення попередньої розповіді й природно передається українським «бо».
- source_word: αὐτῷ
  choice: йому
  rationale: Давальний займенник при λέγω позначає адресата висловлювання.
- source_word: ὁ Ἰωάννης
  choice: Іван
  rationale: Джерело називає мовця просто Іваном; контекст уже встановлює, про кого йдеться.
- source_word: Οὐκ ἔξεστίν
  choice: Не дозволено
  rationale: Вислів означає відсутність дозволу або законного права; «не дозволено» зберігає цю юридично-моральну силу без неприродної для сучасної української конструкції.
- source_word: σοι
  choice: тобі
  rationale: Давальний при безособовому ἔξεστιν природно передається українським «тобі».
- source_word: ἔχειν
  choice: мати
  rationale: Дієслово буквально означає «мати»; у контексті йдеться про жінку як дружину або партнерку, але переклад не додає цього тлумачення до основного тексту.
- source_word: αὐτήν
  choice: її
  rationale: Займенник прямо відсилає до Іродіади; «її» найближче відтворює форму джерела.
theological_decisions:
- issue: Характер докору Івана
  choice: «Не дозволено тобі мати її» — твердження про морально-правову недозволеність.
  alternative: «Не годиться тобі мати її» або «Не законно тобі мати її».
  rationale: ἔξεστιν стосується дозволеності чи законності. Основний переклад зберігає категоричну заборону, не звужуючи її до суб’єктивної оцінки й не додаючи прямої згадки про конкретний припис Закону.
translation_notes:
  register: Сучасна стандартна українська, природна й гідна оповідна мова. Вислів «раз у раз казав» передає повторювану силу імперфекта; пряма мова зберігає стислість і гостроту грецького докору.
