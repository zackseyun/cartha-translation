  text: And he said[a], “Come.” So Peter got down from the boat, walked on the water, and came toward Jesus.
translation:
  language: uk
  text: 'А він сказав: «Іди!» І Петро зійшов із човна, пішов по воді й попрямував до Ісуса.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «і прийшов до Ісуса». Грецький вислів може означати рух у напрямку Ісуса або, за результативним розумінням, прибуття до нього.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐλθέ
  choice: Іди!
  rationale: Аористовий наказовий спосіб від ἔρχομαι передає прямий заклик. У цій ситуації природне українське «Іди!» зберігає стислість і силу наказу, не додаючи прямо не вираженого «сюди».
- source_word: καταβὰς ἀπὸ τοῦ πλοίου
  choice: зійшов із човна
  rationale: Дієприкметник καταβάς позначає попередню дію — сходження вниз. Особова форма в українській природно передає послідовність подій.
- source_word: πλοίου
  choice: човна
  rationale: У контексті плавання Галілейським озером πλοῖον найприродніше означає човен, а не великий корабель.
- source_word: περιεπάτησεν
  choice: пішов
  rationale: У цьому контексті περιπατέω означає пересування пішки. «Пішов» природно поєднує сам рух із наступним напрямком і не додає значення початку тривалої дії.
- source_word: ἐπὶ τὰ ὕδατα
  choice: по воді
  rationale: ἐπί з акузативом тут описує рух поверхнею води. Однина «вода» є звичною для сучасної української.
- source_word: καὶ ἦλθεν πρὸς τὸν Ἰησοῦν
  choice: й попрямував до Ісуса
  rationale: Сполука ἦλθεν із πρός указує на рух у напрямку Ісуса. «Попрямував до» зберігає напрямок, не стверджуючи однозначно, що Петро вже дістався до нього.
- source_word: δὲ
  choice: А
  rationale: δέ тут є легким оповідним сполучником. «А» природно пов’язує відповідь Ісуса з попередньою реплікою, не створюючи надмірного протиставлення.
theological_decisions:
- issue: Чи означає рух Петра, що він уже дістався до Ісуса
  choice: й попрямував до Ісуса
  alternative: і підійшов до Ісуса
  rationale: πρός виразно позначає напрямок, тоді як сам вислів не мусить наголошувати на завершеному прибутті. Основний текст зберігає цю оповідну напругу, а примітка подає можливе результативне розуміння.
translation_notes:
  register: Сучасна, проста й гідна оповідна українська. «Тоді» робить послідовність дій природною; короткий наказ «Іди!» зберігає рішучість оригіналу. Маркер примітки поставлено біля вислову, якого вона безпосередньо стосується.
