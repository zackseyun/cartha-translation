lexical_decisions:
- source_word: ἔφαγον
  choice: їли
  rationale: Аорист ἐσθίω у послідовному оповіданні природно передано формою минулого часу «їли».
- source_word: πάντες
  choice: всі
  rationale: Передає повний обсяг грецького πάντες й стосується всього натовпу.
- source_word: ἐχορτάσθησαν
  choice: наситилися
  rationale: Дієслово означає наїстися досхочу, бути цілком нагодованими; «наситилися» стисло й природно передає результат.
- source_word: ἦραν
  choice: зібрали
  rationale: У контексті решток після трапези αἴρω означає підібрати або зібрати; «зібрали» є природним українським відповідником.
- source_word: τὸ περισσεῦον τῶν κλασμάτων
  choice: шматків, що залишилися
  rationale: Конструкція позначає решту від поламаних шматків; така передача природно відтворює зміст без важкої буквальної побудови.
- source_word: δώδεκα κοφίνους πλήρεις
  choice: дванадцять повних кошиків
  rationale: Зберігає число, назву посудини та ознаку її наповненості в природному українському порядку слів.
theological_decisions:
- issue: Опис повноти чудесного насичення звичайною мовою
  choice: наситилися
  alternative: наїлися досхочу; були нагодовані
  rationale: «Наситилися» передає повноту забезпечення, виражену грецьким дієсловом, не додаючи богословського тлумачення й не применшуючи чуда.
translation_notes:
  register: Сучасна нормативна українська мова; виклад простий, гідний і придатний для публічного читання. Сполуку «а потім» ужито для природного переходу до наступної дії, не змінюючи оповідної послідовності.
