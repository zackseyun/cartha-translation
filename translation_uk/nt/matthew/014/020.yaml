  source_fidelity: 'Основний зміст передано точно: всі їли, наситилися, а потім було зібрано дванадцять повних кошиків решток. Проте в чинному порядку слів «зібрали дванадцять повних кошиків шматків» синтаксично можливо зрозуміти, ніби предметом збирання були кошики, а не залишені шматки. Перебудова чіткіше відтворює грецький додаток τὸ περισσεῦον τῶν κλασμάτων.'
