  text: And they all ate and were satisfied[a], and they picked up twelve full baskets of the leftover pieces.
translation:
  language: uk
  text: 'І всі їли й наситилися, а потім зібрали те, що залишилося від шматків: дванадцять повних кошиків.[a]'
