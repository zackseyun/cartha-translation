  text: But they said to him[a], “We have nothing here except five loaves and two fish.”
translation:
  language: uk
  text: 'А вони кажуть Йому: «У нас тут немає нічого, крім п’яти хлібин і двох рибин».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
