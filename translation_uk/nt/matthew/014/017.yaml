lexical_decisions:
- source_word: οἱ δὲ
  choice: А вони
  rationale: Артикль указує на вже згаданих учнів, а δέ позначає легке протиставлення попереднім словам Ісуса; українське «А вони» природно передає обидві функції.
- source_word: λέγουσιν αὐτῷ
  choice: кажуть Йому
  rationale: Збережено грецький історичний теперішній час, який природно звучить в українській біблійній оповіді й пожвавлює сцену.
- source_word: Οὐκ ἔχομεν ὧδε εἰ μὴ
  choice: У нас тут немає нічого, крім
  rationale: Заперечну конструкцію з εἰ μή передано природною українською конструкцією «немає нічого, крім», без перетворення її на умовне «якщо не».
- source_word: πέντε ἄρτους
  choice: п’яти хлібин
  rationale: «Хлібина» передає злічувані буханці або коржі, а не хліб як незлічувану їжу.
- source_word: δύο ἰχθύας
  choice: двох рибин
  rationale: «Рибина» є природною українською назвою окремої злічуваної риби.
