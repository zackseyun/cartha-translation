source:
  edition: SBLGNT
  text: ἡ δὲ προβιβασθεῖσα ὑπὸ τῆς μητρὸς αὐτῆς· Δός μοι, φησίν, ὧδε ἐπὶ πίνακι τὴν κεφαλὴν Ἰωάννου τοῦ βαπτιστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/008.yaml
  text: And she, having been prompted by her mother, says, “Give me here on a platter the head of John the Baptizer.”
translation:
  language: uk
  text: 'А вона, намовлена своєю матір’ю, каже: «Дай мені тут, на блюді, голову Івана Хрестителя».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προβιβασθεῖσα
  choice: намовлена
  rationale: Передає попередній вплив матері на дівчину та зберігає пасивну форму, не уточнюючи надмірно, чи це була вказівка, порада або підбурювання.
- source_word: ὑπὸ τῆς μητρὸς αὐτῆς
  choice: своєю матір’ю
  rationale: Ὑπό з родовим відмінком позначає діяча в пасивній конструкції; зворотний займенник природно вказує, що йдеться про її матір.
- source_word: Δός μοι
  choice: Дай мені
  rationale: Природний і прямий відповідник наказового способу аориста δίδωμι.
- source_word: φησίν
  choice: каже
  rationale: Збережено історичний теперішній час грецького тексту, який надає оповіді безпосередності.
- source_word: ὧδε
  choice: тут
  rationale: Стисло передає вказівку на місце й безпосередність вимоги.
- source_word: ἐπὶ πίνακι
  choice: на блюді
  rationale: У контексті бенкету πίναξ означає велике блюдо або тацю для подавання; «на блюді» звучить природно й точно.
- source_word: τὴν κεφαλὴν
  choice: голову
  rationale: Прямий відповідник, що зберігає навмисну моторошну конкретність оповіді.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: Івана Хрестителя
  rationale: «Хреститель» є природним українським віддієслівним титулом і передає описове значення грецького βαπτιστής — того, хто хрестить.
theological_decisions:
- issue: Передача титулу βαπτιστής
  choice: Іван Хреститель
  alternative: Іван, який хрестив
  rationale: Усталений український титул «Хреститель» водночас природний і зберігає діяльнісне значення грецького іменника; описовий варіант точний, але стилістично важчий.
translation_notes:
  register: Сучасна нормативна українська мова з гідним оповідним звучанням. Пасивний дієприкметник зберігає структуру джерела, а історичний теперішній час — його оповідну жвавість.
