base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/033.yaml
  text: Then those in the boat worshiped him[a], saying[b], “Truly you are the Son of God.”
translation:
  language: uk
  text: 'Ті ж, що були в човні, поклонилися Йому[a] й сказали: «Воістину Ти — Син Божий[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «вклонилися Йому» чи «віддали Йому шану». Грецьке дієслово може означати шанобливий уклін або падіння ниць; у цьому контексті воно має силу поклоніння.'
    reason: lexical_alternative
  - marker: b
    text: 'Також можна передати: «Божий Син». У грецькому вислові перед словом «Бог» немає артикля, але в цьому контексті «Син Божий» функціонує як титул, а не означає просто «один із Божих синів».'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: А ті, хто був
  rationale: δέ є м’яким сполучником, а субстантивоване οἱ позначає людей у човні; така конструкція природно передає перехід у розповіді без надмірного протиставлення.
- source_word: ἐν τῷ πλοίῳ
  choice: у човні
  rationale: Звичний і природний український відповідник місцевої конструкції з πλοῖον.
- source_word: προσεκύνησαν αὐτῷ
  choice: поклонилися Йому
  rationale: προσκυνέω охоплює поклоніння, вшанування і тілесний уклін. «Поклонилися» зберігає конкретну дію та її богослужбовий сенс у контексті, не усуваючи лексичної багатозначності.
- source_word: λέγοντες
  choice: й сказали
  rationale: Дієприкметник природно передано сурядним особовим дієсловом, що відповідає нормам сучасної української розповіді.
- source_word: Ἀληθῶς
  choice: Воістину
  rationale: Передає урочисту й сильну стверджувальну функцію прислівника, пасуючи до сповідального характеру вислову.
- source_word: θεοῦ υἱὸς
  choice: Син Божий
  rationale: Безартиклева грецька конструкція тут має якісно-визначений титульний зміст; усталена українська форма точно передає його, не вимагаючи неозначеного тлумачення.
- source_word: εἶ
  choice: Ти —
  rationale: Українська іменна конструкція в теперішньому часі природно опускає зв’язку «є»; тире виразно передає предикацію.
theological_decisions:
- issue: Смислова сила προσκυνέω щодо Ісуса
  choice: поклонилися Йому
  alternative: вклонилися Йому; вшанували Його; поклонилися Йому як Богові
  rationale: Контекст влади Ісуса над морем і наступне визнання підтримують значення поклоніння. Водночас українське «поклонилися» зберігає можливий образ земного поклону й не додає до тексту уточнення «як Богові».
- issue: Визначеність θεοῦ υἱὸς
  choice: Син Божий
  alternative: Божий Син; син Бога; один із Божих синів
  rationale: Відсутність артикля в цій предикативній конструкції не робить вислів неозначеним. У контексті Матвія це титульне сповідання, однак примітка чесно вказує на формальну особливість грецького вислову.
translation_notes:
  register: Сучасна літературна українська з гідним, помірно урочистим тоном. «Воістину» збережено як зрозуміле урочисте слово; синтаксис зроблено природним для української. Займенник «Йому» та «Ти» написано з великої літери відповідно до української традиції шанобливого біблійного письма.
