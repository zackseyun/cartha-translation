  text: τετάρτῃ δὲ φυλακῇ τῆς νυκτὸς ⸀ἦλθεν πρὸς ⸀αὐτοὺς περιπατῶν ἐπὶ ⸂τὴν θάλασσαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/025.yaml
  text: And in the fourth watch of the night he came to them[b][a], walking on the sea.
translation:
  language: uk
  text: А під час четвертої нічної сторожі[b] він прийшов до них, ідучи по морю.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «ідучи поверхнею моря». Дехто тлумачить цей вислів як «ідучи біля моря», однак контекст переконливо вказує на рух по самій воді.'
    reason: alternative_reading
  - marker: b
    text: «Четверта нічна сторожа» — остання частина ночі, приблизно від третьої до шостої години ранку за римським поділом часу.
    reason: cultural_note
lexical_decisions:
- source_word: τετάρτῃ ... φυλακῇ τῆς νυκτός
  choice: під час четвертої нічної сторожі
  rationale: Давальний відмінок має часове значення. «Нічна сторожа» зберігає історичний поділ ночі на періоди чергування, а примітка пояснює приблизний сучасний час.
- source_word: δὲ
  choice: А
  rationale: Легкий сполучник продовжує розповідь; «А» природно передає цей перехід українською без надмірного логічного наголосу.
- source_word: ἦλθεν πρὸς αὐτούς
  choice: Він прийшов до них
  rationale: Дієслово руху з πρός та знахідним відмінком позначає наближення до учнів; «прийшов до них» є прямим і природним відповідником.
- source_word: περιπατῶν
  choice: ідучи
  rationale: Дієприкметник теперішнього часу виражає дію, одночасну з основною. Дієприслівник «ідучи» природно передає це українською.
- source_word: ἐπὶ τὴν θάλασσαν
  choice: по морю
  rationale: У поєднанні з дієсловом ходіння та в цьому контексті вислів означає пересування поверхнею води. «По морю» природно й точно передає цей зміст, зберігаючи лексему θάλασσα як «море».
theological_decisions:
- issue: Чудесний характер пересування Ісуса по воді
  choice: ідучи по морю
  alternative: ідучи біля моря
  rationale: Синтаксис περιπατῶν ἐπὶ τὴν θάλασσαν і безпосередній контекст найкраще вказують на рух поверхнею води, а не вздовж берега. Переклад зберігає прямий зміст грецького тексту без послаблення чи додаткового прикрашання.
translation_notes:
  register: Сучасна літературна українська з гідним оповідним звучанням. Історичний термін «нічна сторожа» збережено й пояснено в примітці; конструкцію зроблено зрозумілою для широкого читача.
