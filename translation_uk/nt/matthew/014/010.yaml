translation:
  language: uk
  text: І, пославши, він відтяв Іванові голову у в’язниці.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Дослівніше: «І, пославши, він обезголовив Івана у в’язниці». У грецькому тексті вжито аористовий дієприкметник перед головним дієсловом; кого саме було послано, не уточнено.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: І
  rationale: Простий сполучник продовжує розповідь без додавання виразнішого часового чи причинного відтінку.
- source_word: πέμψας
  choice: пославши людей
  rationale: Аористовий дієприкметник передає попередню щодо головної дії подію. Додане «людей» природно виражає неозначений об’єкт дієслова «послати» й показує здійснення дії через посланців, не перетворюючи текст на пряме формулювання наказу.
- source_word: ἀπεκεφάλισεν
  choice: відтяв Іванові голову
  rationale: Дієслово ἀποκεφαλίζω конкретно означає обезголовити. Український вислів є природним і зберігає граматичне приписування вчинку суб’єктові, хоча дія була здійснена через посланців.
- source_word: τὸν Ἰωάννην
  choice: Іванові
  rationale: Вжито лише ім’я, як у грецькому тексті; найближчий контекст уже визначає, про якого Івана йдеться. Давальний відмінок зумовлений природною українською конструкцією «відтяти комусь голову».
- source_word: ἐν τῇ φυλακῇ
  choice: у в’язниці
  rationale: φυλακή тут позначає конкретне місце ув’язнення. Означеність грецького артикля природно передається контекстом, без неприродного додаткового означення.
theological_decisions:
- issue: Чи представити дію як особисте виконання або лише як наказ
  choice: Збережено граматичне приписування дії суб’єктові, але «пославши людей» вказує на виконавців.
  alternative: «Він наказав відтяти Іванові голову»
  rationale: 'Грецький текст не вживає дієслова «наказати»: головне дієслово прямо приписує обезголовлення суб’єктові, тоді як дієприкметник πέμψας передбачає посередництво посланих.'
translation_notes:
  register: Сучасна літературна українська з гідним оповідним звучанням. Форму «відтяв Іванові голову» обрано як природнішу для широкого читача, тоді як у примітці подано формальніше «обезголовив».
