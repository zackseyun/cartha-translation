source:
  edition: SBLGNT
  text: ⸂Ἀκούσας δὲ⸃ ὁ Ἰησοῦς ἀνεχώρησεν ἐκεῖθεν ἐν πλοίῳ εἰς ἔρημον τόπον κατ’ ἰδίαν· καὶ ἀκούσαντες οἱ ὄχλοι ἠκολούθησαν αὐτῷ πεζῇ ἀπὸ τῶν πόλεων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/013.yaml
  text: When Jesus heard this[a], he withdrew from there by boat to a desolate place by himself. But when the crowds heard[b], they followed him on foot from the towns.
translation:
  language: uk
  text: Почувши про це, Ісус відійшов звідти човном у безлюдне місце[a], на самоті. Та коли натовпи почули про це, вони пішли за Ним пішки з міст[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «у відлюдне місце» чи «в незаселену місцевість». Грецьке слово описує усамітнене або незаселене місце, не обов’язково піщану пустелю.
    reason: lexical_alternative
  - marker: b
    text: Або «з містечок». Грецьке слово залежно від контексту може означати міста або містечка.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας δὲ
  choice: Почувши про це
  rationale: Аористовий дієприкметник передає попередню щодо головної дії подію; δέ позначає розвиток розповіді й не потребує сильного протиставлення. «Про це» природно відсилає до звістки з попереднього контексту.
- source_word: ἀνεχώρησεν
  choice: відійшов
  rationale: Передає значення віддалення або усунення з певного місця, не приписуючи Ісусові не названої в тексті причини.
- source_word: ἐν πλοίῳ
  choice: човном
  rationale: Природне українське позначення способу пересування; не уточнює тип судна понад те, що сказано в грецькому тексті.
- source_word: εἰς ἔρημον τόπον
  choice: у безлюдне місце
  rationale: ἔρημος тут означає відлюдну, незаселену місцевість, а не обов’язково піщану пустелю.
- source_word: κατ’ ἰδίαν
  choice: щоб побути на самоті
  rationale: Природно передає перебування окремо від інших. Цільова конструкція робить українське речення плавним, не визначаючи конкретної причини усамітнення.
- source_word: οἱ ὄχλοι
  choice: натовпи
  rationale: Збережено множину грецького іменника та вжито сучасний загальнозрозумілий відповідник.
- source_word: ἠκολούθησαν αὐτῷ
  choice: вони пішли за Ним
  rationale: У цьому контексті йдеться про буквальне слідування за Ісусом, без додавання спеціального богословського змісту.
- source_word: πεζῇ
  choice: пішки
  rationale: Чітко передає пересування суходолом пішим ходом на противагу подорожі човном.
- source_word: ἀπὸ τῶν πόλεων
  choice: з міст
  rationale: πόλις позначає населений міський осередок і залежно від контексту може відповідати українському «місто» або «містечко».
theological_decisions:
- issue: Причина відходу Ісуса
  choice: Не уточнювати мотив; передати лише те, що Ісус, почувши звістку, відійшов у безлюдне місце на самоту.
  alternative: Пояснити відхід як втечу від небезпеки, скорботне усамітнення або відхід для молитви.
  rationale: Сам вірш не називає мотиву Ісуса, тому переклад не повинен усувати цю оповідну неоднозначність.
translation_notes:
  register: Сучасна нормативна українська мова, проста й гідна оповідна манера. Великі літери в займеннику «Ним» ужито за поширеною українською біблійною традицією; синтаксис лишається доступним для звичайного читача.
