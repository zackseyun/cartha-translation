source:
  edition: SBLGNT
  text: Ὁ γὰρ Ἡρῴδης κρατήσας τὸν Ἰωάννην ἔδησεν ⸀αὐτὸν καὶ ⸂ἐν φυλακῇ ἀπέθετο⸃ διὰ Ἡρῳδιάδα τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/003.yaml
  text: For Herod had arrested John[a], bound him, and put him in prison because of Herodias, the wife of Philip his brother,
translation:
  language: uk
  text: Бо Ірод заарештував Івана[a], зв’язав його й посадив до в’язниці через Іродіаду, дружину свого брата Філіпа,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «схопивши Івана… помістив його до в’язниці».'
    reason: Лексична альтернатива, що формальніше відтворює дієприкметникову конструкцію та буквальніші значення κρατήσας і ἀπέθετο.
lexical_decisions:
- source_word: γὰρ
  choice: Бо
  rationale: Передає пояснювальний зв’язок із попереднім контекстом природним для сучасної української сполучником.
- source_word: κρατήσας
  choice: заарештував
  rationale: У контексті подальшого зв’язування й ув’язнення дієслово означає владне затримання; особова форма природно передає попередню щодо головних дій подію.
- source_word: ἔδησεν
  choice: зв’язав
  rationale: Зберігає конкретне значення дієслова, не уточнюючи без текстових підстав, чи йдеться про мотузки або кайдани.
- source_word: ἐν φυλακῇ ἀπέθετο
  choice: посадив до в’язниці
  rationale: Природний сучасний український відповідник вислову про поміщення під варту.
- source_word: διὰ Ἡρῳδιάδα
  choice: через Іродіаду
  rationale: διά зі знахідним відмінком тут виражає причину; «через» стисло й природно передає цей зв’язок.
- source_word: γυναῖκα
  choice: дружину
  rationale: У родинній конструкції γυνή означає саме дружину, а не просто жінку.
- source_word: Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ
  choice: свого брата Филипа
  rationale: Однозначно показує, що Филип був братом Ірода, і водночас звучить природно українською.
theological_decisions:
- issue: Історико-моральна характеристика стосунків Іродіади з Филипом
  choice: Нейтрально назвати її «дружиною свого брата Филипа».
  alternative: «дружиною брата свого, Филипа» або випереджально назвати союз незаконним
  rationale: Цей вірш лише визначає Іродіаду через її шлюбний зв’язок із Филипом; пряма оцінка законності стосунків з’являється в наступному вірші, тому її не слід вносити наперед.
translation_notes:
  register: Сучасна стандартна українська, зрозуміла широкому читачеві, з гідним оповідним тоном. «Заарештував» і «посадив до в’язниці» обрано як природні контекстуальні відповідники; буквальніший варіант збережено в примітці.
