  text: οἱ δὲ ἐσθίοντες ἦσαν ἄνδρες ὡσεὶ πεντακισχίλιοι χωρὶς γυναικῶν καὶ παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/021.yaml
  text: Those who ate were about five thousand men[a], besides women and children.
translation:
  language: uk
  text: А тих, хто їв, було близько п’яти тисяч чоловіків, не рахуючи жінок і дітей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ ἐσθίοντες
  choice: А тих, хто їв
  rationale: Субстантивований дієприкметник позначає учасників трапези; конструкція «тих, хто їв» природна українською і не перебільшує аспектуального значення. Частку δέ передано легким сполучником «А», який позначає перехід у розповіді.
- source_word: ἦσαν
  choice: було
  rationale: Імперфект εἰμί тут утворює просте повідомлення про кількість; безособова числова конструкція з «було» природна в українській.
- source_word: ἄνδρες
  choice: чоловіків
  rationale: ἀνήρ тут означає осіб чоловічої статі, а не людей загалом; згадка жінок і дітей окремо підтверджує це розрізнення.
- source_word: ὡσεὶ
  choice: близько
  rationale: ὡσεί виражає приблизність; «близько» є природним відповідником перед числівником.
- source_word: πεντακισχίλιοι
  choice: п’яти тисяч
  rationale: Прямий відповідник числівника з потрібною в українській формою після слова «близько».
- source_word: χωρὶς
  choice: не рахуючи
  rationale: χωρίς із родовим відмінком вказує, що жінки й діти не входили до названого числа; «не рахуючи» ясно й природно передає сенс підрахунку.
- source_word: γυναικῶν
  choice: жінок
  rationale: У цьому контексті γυνή означає «жінка», оскільки шлюбні стосунки не маються на увазі.
- source_word: παιδίων
  choice: дітей
  rationale: Природний український відповідник множини παιδίον без невиправданого звуження віку.
theological_decisions:
- issue: Гендерно конкретний термін у підрахунку змішаного натовпу
  choice: Передати ἄνδρες як «чоловіків» і зберегти окрему згадку про жінок та дітей.
  alternative: Передати як «людей» або «осіб».
  rationale: Грецький текст конкретно називає чоловіків і вказує, що жінок та дітей не рахували в названих п’яти тисячах. Узагальнення до «людей» стерло б значущу деталь джерела.
translation_notes:
  register: Сучасна стандартна українська; лаконічний, гідний оповідний стиль. Формулювання «не рахуючи» робить значення χωρίς прозорим, тому примітка не потрібна.
