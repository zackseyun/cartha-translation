lexical_decisions:
- source_word: ὅθεν
  choice: Тому
  rationale: Передає висновково-причиновий зв’язок із попередньою розповіддю природною сучасною українською.
- source_word: μετὰ ὅρκου ὡμολόγησεν
  choice: присягнувся
  rationale: Стисло й природно передає урочисту обіцянку, скріплену клятвою; зміст обіцянки виражено наступним інфінітивом.
- source_word: αὐτῇ δοῦναι
  choice: дати їй
  rationale: Зберігає значення інфінітива та давального непрямого додатка в природному українському порядку слів.
- source_word: ὃ ἐὰν αἰτήσηται
  choice: усе, чого б вона не попросила
  rationale: Українська конструкція з «б» і «не» природно передає невизначений відносний зворот та відкритий характер майбутнього прохання.
