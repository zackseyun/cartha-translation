lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: Того часу
  rationale: Природний український часовий зворот, який точно передає ідіоматичне грецьке позначення часу.
- source_word: ἤκουσεν
  choice: почув
  rationale: Прямий відповідник аориста ἀκούω; не додає інтерпретаційного значення «дізнався».
- source_word: Ἡρῴδης
  choice: Ірод
  rationale: Усталена українська форма біблійного особового імені.
- source_word: ὁ τετραάρχης
  choice: тетрарх
  rationale: Історично точна й усталена назва правителя підвладної Риму області; зберігає конкретний титул без розлогого переказу.
- source_word: τὴν ἀκοὴν
  choice: звістку
  rationale: У цьому контексті ἀκοή означає те, що почули, тобто звістку або повідомлення, а не здатність чути.
- source_word: Ἰησοῦ
  choice: про Ісуса
  rationale: Родовий відмінок позначає зміст звістки; українська конструкція з «про» є природною і точною.
