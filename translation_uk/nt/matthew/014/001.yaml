  source_fidelity: «Того часу» точно передає часовий зворот Ἐν ἐκείνῳ τῷ καιρῷ. «Тетрарх Ірод почув звістку про Ісуса» зберігає зміст аориста ἤκουσεν, історичний титул ὁ τετραάρχης та значення τὴν ἀκοὴν як отриманої звістки/поголоски. Прийменниковий зворот «про Ісуса» природно передає родовий Ἰησοῦ як зміст звістки.
