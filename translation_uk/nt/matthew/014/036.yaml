  yaml_path: translation/nt/matthew/014/036.yaml
  text: And they begged him that they might only touch the fringe of his garment[b][a], and as many as touched it were healed.
translation:
  language: uk
  text: І благали Його, щоб їм лише доторкнутися до краю[a] Його одягу. І всі, хто доторкнувся, зцілилися[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або «облямівки», «бахроми» чи «китиці»: грецьке слово може позначати край, облямівку або бахрому одягу й також може стосуватися китиці.'
    reason: lexical_alternative
  - marker: b
    text: Або «одужали» чи «стали здоровими». Грецьке дієслово також може ширше означати «були врятовані», але тут ідеться про фізичне зцілення.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλουν
  choice: благали
  rationale: Імперфект передає тривалу або повторювану дію, а «благали» природно виражає наполегливе прохання.
- source_word: ἵνα μόνον ἅψωνται
  choice: щоб їм лише доторкнутися
  rationale: Конструкція ἵνα із кон’юнктивом передає зміст прохання; «лише» підкреслює, що вони просили тільки про дотик.
- source_word: τοῦ κρασπέδου
  choice: до краю
  rationale: κράσπεδον може означати край, облямівку, бахрому чи китицю одягу. «Край» не звужує значення надмірно, а примітка зберігає можливі конкретніші відповідники.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: Його одягу
  rationale: ἱμάτιον позначає предмет верхнього одягу; загальне «одяг» уникає невиправданого уточнення «плащ» або «одежа».
- source_word: ὅσοι
  choice: всі, хто
  rationale: Природний сучасний український відповідник кількісно-відносного звороту зі значенням «усі ті, хто».
- source_word: ἥψαντο
  choice: доторкнувся
  rationale: У цьому контексті середня форма ἅπτω означає фізично торкнутися; об’єкт зрозумілий із попередньої частини речення.
- source_word: διεσώθησαν
  choice: одужали
  rationale: У безпосередньому контексті тілесних недуг дієслово означає, що люди стали здоровими; «одужали» звучить природно, а примітка зберігає ширший діапазон значень.
theological_decisions:
- issue: Значення διεσώθησαν у контексті чудесного зцілення
  choice: фізичне відновлення («одужали»)
  alternative: «були врятовані», «стали здоровими», «були зцілені»
  rationale: Контекст насамперед говорить про тілесне зцілення, тому основний текст передає це значення без внесення окремого сотеріологічного твердження. Водночас примітка засвідчує ширший семантичний діапазон дієслова.
translation_notes:
  register: Сучасна нормативна українська мова, проста й гідна оповідна манера. Займенник щодо Ісуса написано з великої літери відповідно до поширеної української біблійної практики; синтаксис зберігає двочастинну будову грецького речення.
