  text: καὶ ⸀ἀναβάντων αὐτῶν εἰς τὸ πλοῖον ἐκόπασεν ὁ ἄνεμος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/032.yaml
  text: And when they got into the boat[a], the wind ceased.
translation:
  language: uk
  text: І коли вони ввійшли в човен[a], вітер ущух.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або, буквальніше: «після того, як вони піднялися в човен».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβάντων αὐτῶν
  choice: коли вони ввійшли
  rationale: Генітив абсолютний природно передано підрядним реченням часу. Дієслово ἀναβαίνω буквально означає «підніматися», але в сполученні з εἰς τὸ πλοῖον у цьому контексті українською природніше «ввійшли в човен».
- source_word: πλοῖον
  choice: човен
  rationale: У євангельському контексті йдеться про судно учнів на Галілейському морі; «човен» є природним сучасним відповідником, тоді як «корабель» означав би завелике судно.
- source_word: ἐκόπασεν
  choice: ущух
  rationale: κοπάζω щодо вітру означає припинитися або вщухнути. «Ущух» стисло й природно передає припинення вітру, не додаючи невираженої в грецькому тексті поступовості.
- source_word: ὁ ἄνεμος
  choice: вітер
  rationale: Прямий відповідник підмета; в українській означений артикль окремо не передається.
- source_word: καὶ
  choice: І
  rationale: Зберігає простий оповідний зв’язок без додаткового наголосу на часовій послідовності.
theological_decisions:
- issue: Оповідний натяк на владу Ісуса над природою
  choice: Подію передано прямо, без розгортання її богословського значення в основному тексті.
  alternative: Тлумачний переклад, який виразніше наголошує на чудесній владі Ісуса.
  rationale: Вірш повідомляє, що після входу Ісуса й Петра в човен вітер ущух. Богословське значення видно з контексту, однак переклад не повинен додавати пояснень, яких немає в грецькому тексті.
translation_notes:
  register: Сучасна, природна й гідна українська оповідна мова. Форму «ввійшли в човен» обрано як ідіоматичну, а буквальніше просторове значення ἀναβαίνω збережено в примітці.
