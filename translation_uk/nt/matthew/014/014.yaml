lexical_decisions:
- source_word: ἐξελθὼν
  choice: Вийшовши на берег
  rationale: Дієприкметник буквально означає «вийшовши», а в контексті прибуття човном природне українське формулювання «вийшовши на берег» точно передає мається на увазі дію.
- source_word: εἶδεν
  choice: побачив
  rationale: Звичайне й точне передання аориста від ὁράω сучасною українською.
- source_word: πολὺν ὄχλον
  choice: великий натовп
  rationale: Природний український відповідник, що зберігає кількісне значення πολύς і значення ὄχλος.
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτοῖς
  choice: змилосердився над людьми
  rationale: Дієслово передає глибоке співчуття і милосердя. Займенник розгорнуто як «людьми», щоб у сучасній українській уникнути двозначного накопичення займенників перед «їхніх хворих».
- source_word: ἐθεράπευσεν
  choice: зцілив
  rationale: У цьому контексті θεραπεύω означає фізичне зцілення; «зцілив» є точним, природним і стилістично гідним відповідником.
- source_word: τοὺς ἀρρώστους αὐτῶν
  choice: їхніх хворих
  rationale: Субстантивований прикметник ἀρρώστους з αὐτῶν стисло й природно передано як «їхніх хворих», зі збереженням грецької лаконічності.
theological_decisions:
- issue: Передання емоційної реакції Ісуса
  choice: змилосердився над людьми
  alternative: пройнявся співчуттям до них
  rationale: Формулювання зберігає глибину милосердної реакції, яка веде до зцілення, але не посилює і не пояснює її понад сказане в грецькому тексті.
