  verdict: approve
  source_fidelity: 'Текст точно передає послідовність дій у грецькому оригіналі: відпустивши натовпи, Ісус піднявся на гору з метою молитви; із настанням вечора він перебував там сам. «Натовпи» зберігає множину τοὺς ὄχλους, а «Коли ж настав вечір» належно передає часову конструкцію ὀψίας δὲ γενομένης.'
  naturalness: Переклад звучить природно сучасною нормативною українською. Дієприслівниковий зворот «відпустивши натовпи» є ясним і не створює двозначності щодо виконавця дії. «На самоті» та «він був там один» дещо повторюють семантику, але це відображає навмисне повторне підкреслення усамітнення в κατ’ ἰδίαν і μόνος.
  terminology: «Відпустивши», «натовпи», «піднявся на гору» та «помолитися» є точними, звичними для біблійного контексту й не вносять конфесійних тлумачень. Примітку правильно прив’язано до «на самоті»; вона належно подає можливі значення κατ’ ἰδίαν.
