  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: καὶ ἀπολύσας τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος κατ’ ἰδίαν προσεύξασθαι. ὀψίας δὲ γενομένης μόνος ἦν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/023.yaml
  text: And after dismissing the crowds[a], he went up on the mountain by himself to pray. When evening came, he was there alone.
translation:
  language: uk
  text: І, відпустивши натовпи, він піднявся на гору на самоті[a], щоб помолитися. Коли ж настав вечір, він був там один.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «усамітнено» чи «окремо від інших» (κατ’ ἰδίαν).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύσας
  choice: відпустивши
  rationale: Дієприкметник аориста перед головним дієсловом передає попередню дію; український дієприслівник природно й стисло зберігає цю послідовність.
- source_word: τοὺς ὄχλους
  choice: натовпи
  rationale: Збережено множину грецького ὄχλους і звичне євангельське значення зібраних груп людей.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: піднявся на гору
  rationale: Природний український відповідник руху вгору до гірської місцевості без надмірно урочистого відтінку.
- source_word: κατ’ ἰδίαν
  choice: на самоті
  rationale: Передає усамітнення або приватність дії, не ототожнюючи вислів повністю з наступним μόνος.
- source_word: προσεύξασθαι
  choice: щоб помолитися
  rationale: Підрядна конструкція мети природно передає інфінітив мети.
- source_word: ὀψίας δὲ γενομένης
  choice: Коли ж настав вечір
  rationale: Часове підрядне речення передає грецьку абсолютну родову конструкцію, а «ж» зберігає перехідний відтінок δέ.
- source_word: μόνος ἦν ἐκεῖ
  choice: він був там один
  rationale: Зберігає наголос на фактичній відсутності інших і природний український порядок слів.
theological_decisions: []
translation_notes:
  register: Сучасна нормативна українська мова з гідним, загальнозрозумілим біблійним звучанням. Розрізнено κατ’ ἰδίαν («на самоті», спосіб або обставина усамітнення) та μόνος («один», фактична самотність увечері).
