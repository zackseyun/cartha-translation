lexical_decisions:
- source_word: παισὶν
  choice: слугам
  rationale: У цьому контексті παῖς означає слугу або домашнього наближеного Ірода. «Слугам» природно передає суспільні відносини, не уточнюючи рангу.
- source_word: ὁ βαπτιστής
  choice: Хреститель
  rationale: «Іван Хреститель» — усталене й зрозуміле українське найменування, що точно передає грецький епітет.
- source_word: ἠγέρθη
  choice: його воскрешено
  rationale: Безособова пасивна конструкція зберігає пасивний стан грецького аориста та не називає того, хто воскресив Івана.
- source_word: ἀπὸ τῶν νεκρῶν
  choice: з мертвих
  rationale: Це усталений і природний український відповідник вислову про воскресіння з-поміж померлих.
- source_word: διὰ τοῦτο
  choice: і тому
  rationale: Передає причинно-наслідковий висновок Ірода природною сучасною українською мовою.
- source_word: αἱ δυνάμεις
  choice: ці сили
  rationale: «Сили» зберігає конкретний і водночас неоднозначний іменник δύναμεις, який у контексті стосується надприродної сили, виявленої в могутніх ділах. Вказівне «ці» природно відсилає до почутих Іродом діянь.
- source_word: ἐνεργοῦσιν
  choice: діють
  rationale: Передає активну, дієву роботу сил стисло й природно.
- source_word: ἐν αὐτῷ
  choice: у ньому
  rationale: Безпосередньо зберігає значення прийменника ἐν і не замінює його більш тлумачним «через нього».
theological_decisions:
- issue: Характер повернення Івана до життя
  choice: Його воскрешено з мертвих
  alternative: Він воскрес із мертвих
  rationale: Пасивне формулювання відповідає ἠγέρθη, не приписує Іванові самовоскресіння і водночас не уточнює діяча понад слова тексту.
- issue: Значення δυνάμεις у контексті
  choice: ці сили діють у ньому
  alternative: у ньому діють чудодійні сили / він творить чудеса
  rationale: Основний текст зберігає образ «сил» та їхню дію «у ньому», не зводячи неоднозначний вислів лише до чудес як видимих учинків.
translation_notes:
  register: Сучасна стандартна українська мова з гідним біблійним звучанням. Синтаксис простий і зрозумілий; пасивність ἠγέρθη та неоднозначність αἱ δυνάμεις навмисно збережено.
