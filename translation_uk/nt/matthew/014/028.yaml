base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/028.yaml
  text: And Peter answered him[a], “Lord, if it is you, command me to come to you on the waters.”
translation:
  language: uk
  text: 'А Петро озвався до нього: «Господи, якщо це ти, звели мені прийти до тебе по водах[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «по воді». У грецькому тексті вжито множину: «по водах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ αὐτῷ ὁ Πέτρος εἶπεν
  choice: А Петро озвався до нього
  rationale: Поширену грецьку оповідну формулу передано природною сучасною українською мовою. Сполучник «а» зберігає зв’язок із попередньою розповіддю, а «озвався до нього» природно передає відповідь Петра, не вимагаючи, щоб перед цим було поставлено пряме запитання.
- source_word: Κύριε
  choice: Господи
  rationale: Клична форма «Господи» є усталеним українським відповідником κύριε й зберігає як шанобливе звертання, так і можливу христологічну вагу слова.
- source_word: εἰ σὺ εἶ
  choice: якщо це ти
  rationale: 'Цей природний український зворот передає перевірку особи: Петро хоче впевнитися, що перед ним справді Ісус.'
- source_word: κέλευσόν με
  choice: звели мені
  rationale: «Звели» передає владний характер наказу, а конструкція «мені прийти» звучить природно й гідно в сучасній українській мові.
- source_word: ἐλθεῖν πρὸς σὲ
  choice: прийти до тебе
  rationale: Збережено напрям руху до Ісуса та перспективу мовця.
- source_word: ἐπὶ τὰ ὕδατα
  choice: по водах
  rationale: Таке формулювання зберігає грецьку множину τὰ ὕδατα та передає рух поверхнею води; звичніший український варіант у однині наведено в примітці.
theological_decisions:
- issue: Значення звертання κύριε до Ісуса
  choice: Господи
  alternative: Учителю; Пане
  rationale: Переклад не зводить звертання лише до ввічливої форми, але й не уточнює понад текст, наскільки повно Петро усвідомлює богословську вагу цього титулу.
translation_notes:
  register: Сучасна стандартна українська мова; оповідний стиль природний і стримано урочистий. Звертання «Господи» та дієслово «звели» зберігають біблійну гідність без архаїзації.
