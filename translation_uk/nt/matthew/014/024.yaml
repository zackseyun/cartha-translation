    reason: lexical_alternative
lexical_decisions:
- source_word: πλοῖον
  choice: човен
  rationale: У контексті переправи Галілейським озером природне сучасне українське слово «човен» точніше передає ймовірний розмір судна, ніж «корабель».
- source_word: ἤδη
  choice: уже
  rationale: Передає часовий відтінок ситуації, що склалася на цей момент оповіді.
- source_word: σταδίους πολλοὺς
  choice: за багато стадіїв
  rationale: Збережено давню одиницю відстані відповідно до грецького тексту; її значення пояснено в примітці [a].
- source_word: ἀπὸ τῆς γῆς ἀπεῖχεν
  choice: був ... від суходолу
  rationale: Природна українська перебудова вислову про просторову віддаленість; «суходіл» зберігає буквальне значення γῆ та його протиставлення воді.
- source_word: βασανιζόμενον ὑπὸ τῶν κυμάτων
  choice: хвилі кидали його з боку в бік
  rationale: Контекстуально передає сильну й тривалу дію хвиль на човен без недоречного для неживого предмета психологічного відтінку «мучили».
- source_word: ἐναντίος ὁ ἄνεμος
  choice: вітер був зустрічний
  rationale: Стисле й природне українське позначення вітру, що дув проти напрямку руху човна; об’єкт протидії лишається зрозумілим із контексту.
- source_word: δὲ
  choice: А
  rationale: Передає м’який перехід і контраст між Ісусом на суходолі та становищем човна.
- source_word: γάρ
  choice: бо
  rationale: Природно вводить пояснення того, чому хвилі так діяли на човен.
