base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/024.yaml
  text: But the boat was already many stadia from the land[a], being battered by the waves[c][b], for the wind was against it.
translation:
  language: uk
  text: А човен був уже на багато стадіїв від суходолу[a], його били хвилі[c], бо вітер був зустрічний.
  philosophy: optimal-equivalence
