  source_fidelity: 'Текст точно передає грецький вислів: «побачивши сильний вітер» адекватно відтворює βλέπων ... ἰσχυρόν; «злякався» передає настання страху в ἐφοβήθη; «почавши тонути» зберігає початкову фазу καταποντίζεσθαι, не перебільшуючи її до «потопав/втонув». «Закричав» природно передає ἔκραξεν, а пряма мова повністю відтворює Κύριε, σῶσόν με. Неоднозначність текстового варіанта щодо ἰσχυρόν не потребує окремого відображення в перекладі, оскільки наданий SBLGNT включає це слово.'
