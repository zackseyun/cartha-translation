  text: βλέπων δὲ τὸν ἄνεμον ⸀ἰσχυρὸν ἐφοβήθη, καὶ ἀρξάμενος καταποντίζεσθαι ἔκραξεν λέγων· Κύριε, σῶσόν με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/030.yaml
  text: But seeing the strong wind[a], he became afraid, and beginning to sink, he cried out, saying, “Lord[b], save me.”
translation:
  language: uk
  text: 'Але, побачивши сильний вітер[a], він злякався і, почавши тонути, закричав: «Господи, спаси мене[b]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «бурхливий вітер».'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «врятуй мене». Грецьке дієслово може означати як порятунок від безпосередньої небезпеки, так і спасіння в ширшому розумінні.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπων
  choice: побачивши
  rationale: Дієприкметникова форма передає сприйняття, одночасне з подальшою реакцією; доконаний український дієприслівник природно виражає цей момент у розповіді.
- source_word: δὲ
  choice: Але
  rationale: Сполучник позначає контрастний поворот після того, як Петро вже йшов по воді.
- source_word: τὸν ἄνεμον ἰσχυρόν
  choice: сильний вітер
  rationale: Прямий і природний відповідник, який передає силу вітру без перебільшення.
- source_word: ἐφοβήθη
  choice: злякався
  rationale: Форма вказує на настання страху, а не лише на тривалий стан.
- source_word: ἀρξάμενος καταποντίζεσθαι
  choice: почавши тонути
  rationale: Збережено початкову фазу дії; «тонути» природно описує занурення у воду й не стверджує, що Петро вже потонув.
- source_word: ἔκραξεν λέγων
  choice: закричав
  rationale: Одне природне українське дієслово передає гучний терміновий вигук; окреме «кажучи» було б важким і зайвим у сучасній українській.
- source_word: Κύριε
  choice: Господи
  rationale: Усталена українська клична форма звертання до Ісуса, що зберігає значення титулу κύριος.
- source_word: σῶσόν με
  choice: спаси мене
  rationale: Безпосередньо передає наказову форму σῴζω, відповідає терміновому проханню про порятунок і водночас зберігає ширший смисловий та богословський відтінок дієслова.
theological_decisions:
- issue: Передача κύριος у прямому звертанні до Ісуса
  choice: Господи
  alternative: Учителю / Пане
  rationale: «Господи» природно зберігає титульну й христологічну вагу звертання, не додаючи того, чого прямо не висловлено в тексті.
- issue: Передача σῴζω в контексті безпосередньої фізичної небезпеки
  choice: спаси мене
  alternative: врятуй мене
  rationale: Основний варіант зберігає як конкретне прохання про фізичний порятунок, так і ширший біблійний діапазон слова; вужчий контекстуальний відповідник подано в примітці.
translation_notes:
  register: 'Сучасна, зрозуміла й водночас гідна оповідна українська. Синтаксис дещо спрощено порівняно з грецьким: ἔκραξεν λέγων передано одним дієсловом «закричав», без втрати змісту чи сили вислову.'
