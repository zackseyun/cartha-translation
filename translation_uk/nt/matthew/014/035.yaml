lexical_decisions:
- source_word: ἐπιγνόντες
  choice: упізнавши
  rationale: Дієприкметник означає, що чоловіки впізнали Ісуса; «упізнавши» природно передає завершену супровідну дію.
- source_word: οἱ ἄνδρες τοῦ τόπου ἐκείνου
  choice: чоловіки тієї місцевості
  rationale: ἀνήρ конкретно означає чоловіків, а τόπος у контексті — місцевість, де вони перебували.
- source_word: ἀπέστειλαν εἰς ὅλην τὴν περίχωρον ἐκείνην
  choice: розіслали по всій околиці
  rationale: Грецький текст не називає об’єкта дієслова «послали». Українське «розіслали» зберігає цю невираженість і природно допускає посланців або звістку; περίχωρος передано як навколишню місцевість — «околицю».
- source_word: προσήνεγκαν αὐτῷ
  choice: привели до Нього
  rationale: Щодо людей προσφέρω тут означає доставити або привести їх до Ісуса, а не принести як речі чи жертву.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: всіх хворих
  rationale: Вислів κακῶς ἔχειν є усталеним ідіоматичним позначенням поганого фізичного стану, тобто хвороби.
theological_decisions: []
translation_notes:
