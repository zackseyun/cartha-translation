source:
  edition: SBLGNT
  text: ⸂οἱ δὲ μαθηταὶ ἰδόντες αὐτὸν⸃ ἐπὶ ⸂τῆς θαλάσσης⸃ περιπατοῦντα ἐταράχθησαν λέγοντες ὅτι Φάντασμά ἐστιν, καὶ ἀπὸ τοῦ φόβου ἔκραξαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/026.yaml
  text: But when the disciples saw him walking on the sea[a], they were terrified, saying, “It is a ghost!” And they cried out from fear.
translation:
  language: uk
  text: 'А учні, побачивши, що Він іде по морю, жахнулися й сказали: «Це привид![a]» І від страху закричали.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «примара» чи «фантом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: А
  rationale: Передає м’який перехід і контраст із попередньою сценою без надмірного протиставлення.
- source_word: οἱ μαθηταὶ ἰδόντες αὐτόν
  choice: учні, побачивши, що Він
  rationale: Дієприкметниковий зворот зберігає часову послідовність і природно звучить українською; займенник стосується Ісуса.
- source_word: ἐπὶ τῆς θαλάσσης περιπατοῦντα
  choice: іде по морю
  rationale: Відтворює рух по поверхні моря; «іде» природніше в цьому контексті, ніж буквальніше «ходить».
- source_word: ἐταράχθησαν
  choice: жахнулися
  rationale: Передає сильне потрясіння й переляк, підтверджені подальшим криком від страху.
- source_word: Φάντασμά ἐστιν
  choice: Це привид!
  rationale: «Привид» — зрозумілий сучасний відповідник назви примарної появи; вислів передає переляканий висновок учнів, а не авторське твердження про природу духів.
- source_word: ἀπὸ τοῦ φόβου ἔκραξαν
  choice: від страху закричали
  rationale: «Від страху» точно передає причину, а «закричали» — гучну раптову реакцію.
theological_decisions:
- issue: Природа φάντασμα у вигуку учнів
  choice: У головному тексті вжито «привид»
  alternative: «примара» або «видиво»
  rationale: Оповідь повідомляє про помилкове сприйняття наляканих учнів, не стверджуючи онтологічної реальності привидів.
translation_notes:
  register: Сучасна стандартна українська; виклад природний, стислий і гідний. Велика літера в займеннику «Він» ужита для ясного позначення Ісуса в межах традиційного українського біблійного регістру.
