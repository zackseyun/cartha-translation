lexical_decisions:
- source_word: δὲ
  choice: А
  rationale: М’який сполучник позначає перехід і водночас легке протиставлення попередній репліці учнів; українське «А» природно передає обидві функції без надмірного посилення контрасту.
- source_word: εἶπεν
  choice: сказав
  rationale: Простий аорист дієслова λέγω нейтрально повідомляє про мовлення; «сказав» не додає окремого відтінку наказування.
- source_word: Φέρετέ
  choice: Принесіть
  rationale: Форма наказового способу другої особи множини виражає веління доставити згадані предмети; доконаний відповідник «принесіть» природний у цьому конкретному наказі.
- source_word: μοι
  choice: до Мене
  rationale: Давальний займенник указує на особу, до якої треба принести предмети; у поєднанні з дієсловом руху природним українським відповідником є «до Мене».
- source_word: ὧδε
  choice: сюди
  rationale: Прислівник місця позначає спрямування до місця, де перебуває мовець; із «принесіть» українське «сюди» точніше й природніше за статичне «тут».
- source_word: αὐτούς
  choice: їх
  rationale: Займенник чоловічого роду множини контекстуально стосується хлібів і риб із попереднього вірша; «їх» зберігає займенникову форму й природно охоплює обидві названі групи.
theological_decisions: []
translation_notes:
  register: Сучасна, проста й гідна українська мова. Збережено стислий характер прямої мови; велика літера в займеннику «Мене» вжита як усталений шанобливий біблійний правописний вибір, не як тлумачення грецької граматики.
