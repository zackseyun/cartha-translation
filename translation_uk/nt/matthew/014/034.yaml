  - severity: low
    issue: Непослідовна форма топоніма та помилкова відмінкова форма в примітці.
    rationale: У тексті вжито «Геннісаретської», а у примітці — «Генісарет» і «до Генісарета». Для сучасної української передачі слід послідовно вживати «Генісарет», родовий — «Генісарету».
