  source_fidelity: '«Перепливши на той бік» загалом передає διαπεράσαντες, хоча «переправившись» точніше не нав’язує способу перетину. Основна проблема — «до землі Геннісаретської»: це архаїчна прикметникова конструкція й вона менш виразно відбиває рух «на землю» та зв’язок із Генісаретом у грецькому тексті.'
