  text: Переправившись, вони прибули до землі Генісарету.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «вони вийшли на сушу в Генісареті». У грецькому тексті поєднано вислови «на землю» і «до Генісарету», що виражають прибуття на сушу або берег у місцевості Генісарет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπεράσαντες
  choice: Перепливши на той бік
  rationale: Аористовий активний дієприкметник позначає дію, що передує головній; у контексті подорожі човном «перепливши» природно передає перетин водойми, а «на той бік» — спрямованість дієслова.
- source_word: ἦλθον
  choice: вони прибули
  rationale: «Прибули» природно передає завершене прибуття до названої місцевості й добре узгоджується з наступною конструкцією місця.
- source_word: ἐπὶ τὴν γῆν εἰς
  choice: до землі …
  rationale: Основний текст стисло й природно передає прибуття на сушу/до землі певної місцевості; незвичне поєднання двох грецьких прийменникових зворотів пояснено в примітці.
- source_word: Γεννησαρέτ
  choice: Генісаретської
  rationale: Усталена українська біблійна передача топоніма; прикметникова форма природно виражає зв’язок із «землею».
