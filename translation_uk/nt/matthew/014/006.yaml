lexical_decisions:
- source_word: γενεσίοις δὲ γενομένοις
  choice: А коли настав день народження Ірода
  rationale: Конструкція позначає настання або відзначення дня народження. «Настав день народження» природно передає часовий зворот, а примітка зберігає можливий акцент на святкуванні.
- source_word: δὲ
  choice: А
  rationale: Частка позначає перехід у розповіді з легким протиставним відтінком; українське «А» тут природніше за сильніше «Але».
- source_word: ὠρχήσατο
  choice: танцювала
  rationale: Дієслово прямо означає виконання танцю; простий український відповідник не додає зайвих подробиць.
- source_word: ἡ θυγάτηρ τῆς Ἡρῳδιάδος
  choice: дочка Іродіади
  rationale: Передає родовий зв’язок без внесення традиційного імені дочки, якого в тексті немає.
- source_word: ἐν τῷ μέσῳ
  choice: посеред гостей
  rationale: Буквально «посередині / посеред [них]». У контексті йдеться про присутніх на святкуванні; примітка подає буквальніший варіант і позначає контекстуальне уточнення.
- source_word: ἤρεσεν τῷ Ἡρῴδῃ
  choice: сподобалася Іродові
  rationale: Природний український відповідник конструкції «догодила / була приємна Іродові», без уточнення характеру його задоволення.
- source_word: Ἡρῴδου / Ἡρῴδῃ
  choice: Ірод / Іродові
  rationale: Усталена українська форма біблійного особового імені з нормативним відмінюванням.
