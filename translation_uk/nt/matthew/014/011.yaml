  text: καὶ ἠνέχθη ἡ κεφαλὴ αὐτοῦ ἐπὶ πίνακι καὶ ἐδόθη τῷ κορασίῳ, καὶ ἤνεγκεν τῇ μητρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/011.yaml
  text: And his head was brought on a platter and given to the girl[a], and she brought it to her mother.
translation:
  language: uk
  text: І принесли його голову на блюді та віддали дівчині, а вона віднесла її своїй матері.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠνέχθη
  choice: принесли
  rationale: Аорист пасивного стану від φέρω. Неозначено-особова форма природно передає грецький пасив у сучасній українській оповіді, не називаючи виконавців дії.
- source_word: ἡ κεφαλὴ αὐτοῦ
  choice: його голову
  rationale: Прямий відповідник грецького словосполучення; підстав для евфемізму немає.
- source_word: ἐπὶ πίνακι
  choice: на блюді
  rationale: πίναξ у цьому контексті означає велике блюдо або тацю для подавання їжі. «На блюді» природно й точно передає предмет та спосіб подання.
- source_word: ἐδόθη τῷ κορασίῳ
  choice: віддали дівчині
  rationale: Неозначено-особова форма зберігає неназваного виконавця пасивної дії; κοράσιον природно передано словом «дівчина» без архаїзації чи зайвого уточнення віку.
- source_word: ἤνεγκεν
  choice: вона віднесла
  rationale: Аорист активного стану від φέρω. «Віднесла» природно позначає перенесення предмета від дівчини до її матері; об’єкт виражено займенником «її».
- source_word: τῇ μητρὶ αὐτῆς
  choice: своїй матері
  rationale: Український зворотний присвійний займенник однозначно й природно вказує на матір підмета — дівчини.
theological_decisions: []
translation_notes:
  register: 'Сучасна стандартна українська, лаконічний і гідний оповідний стиль. Грецькі пасиви передано природними українськими неозначено-особовими формами. Лексична примітка не потрібна: «блюдо» достатньо точно передає πίναξ, а подані англійські варіанти стосуються вибору англійського відповідника.'
