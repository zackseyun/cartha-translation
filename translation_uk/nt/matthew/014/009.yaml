lexical_decisions:
- source_word: λυπηθεὶς
  choice: хоч і засмутився
  rationale: Аористовий пасивний дієприкметник передає стан смутку; допустове «хоч і» природно виражає напруження між смутком царя та його подальшим наказом.
- source_word: ὁ βασιλεὺς
  choice: цар
  rationale: Прямий і контекстуально доречний відповідник βασιλεύς, ужитий у звичному біблійному наративному регістрі.
- source_word: διὰ τοὺς ὅρκους
  choice: через свої клятви
  rationale: διά зі знахідним відмінком виражає причину. «Свої» природно уточнює, що йдеться про клятви самого царя, як випливає з контексту.
- source_word: τοὺς συνανακειμένους
  choice: тих, хто був із ним за столом
  rationale: Вислів означає людей, які разом із ним лежали за столом під час трапези. Переклад природно передає спільну учту, а історичну позу пояснено в примітці.
- source_word: ἐκέλευσεν
  choice: наказав
  rationale: Стисло й точно передає значення κελεύω та зберігає належний оповідний тон.
- source_word: δοθῆναι
  choice: дати
  rationale: Пасивний інфінітив буквально означає «бути даним», але українська безособова конструкція після «наказав» природно передає наказ, не називаючи прямо пропущеного в грецькому тексті об’єкта.
