  source_fidelity: 'Переклад точно передає послідовність дій і ключові елементи грецького тексту: розпорядження натовпам, розташування на траві, п’ять хлібів і дві риби, погляд до неба, благословення, ламання хлібів та передавання через учнів. «Розташуватися» дещо ширше за буквальне «возлягти», але в сучасній українській природно передає влаштування для споживання їжі й не додає невластивих деталей.'
