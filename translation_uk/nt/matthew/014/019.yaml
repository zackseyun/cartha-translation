id: MAT.14.19
reference: Matthew 14:19
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: καὶ κελεύσας τοὺς ὄχλους ἀνακλιθῆναι ἐπὶ ⸂τοῦ χόρτου⸃, λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας, ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κλάσας ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους οἱ δὲ μαθηταὶ τοῖς ὄχλοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/019.yaml
  text: And after ordering the crowds to recline on the grass[a], he took the five loaves and the two fish, looked up to heaven, blessed, and after breaking the loaves he gave them to the disciples, and the disciples to the crowds.
translation:
  language: uk
  text: І, звелівши натовпам розташуватися на траві, Він узяв п’ять хлібів і дві риби, звів очі до неба, благословив[a] і, розламавши хліби, дав їх учням, а учні — натовпам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «благословив Бога» чи «промовив благословення». У грецькому тексті сказано лише «благословив», без прямо названого об’єкта.'
    reason: Зберігає справжню неоднозначність грецького вислову.
lexical_decisions:
- source_word: κελεύσας
  choice: звелівши
  rationale: Передає силу чіткого розпорядження й зберігає дієприкметникову послідовність дій.
- source_word: τοὺς ὄχλους
  choice: натовпам / натовпів
  rationale: Природний сучасний відповідник множини ὄχλοι; множину збережено в обох випадках.
- source_word: ἀνακλιθῆναι
  choice: розташуватися
  rationale: Природно описує влаштування людей на землі для їжі й не змушує уявляти сучасне сидіння на стільцях; водночас уникає розмовного відтінку слова «розлягтися».
- source_word: ἐπὶ τοῦ χόρτου
  choice: на траві
  rationale: Точно передає місце без додавання ознаки «зелена», якої в Матвія тут немає.
- source_word: λαβὼν
  choice: узяв
  rationale: Дієприкметникову форму передано особовим дієсловом для природного українського оповідання.
- source_word: τοὺς πέντε ἄρτους
  choice: п’ять хлібів
  rationale: У цьому контексті ἄρτοι означає окремі хліби; така форма природна й усталена українською.
- source_word: τοὺς δύο ἰχθύας
  choice: дві риби
  rationale: Зберігає конкретну кількість і звичайну українську форму множини.
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: звів очі до неба
  rationale: Природний український вислів, який точно передає спрямований угору погляд.
- source_word: εὐλόγησεν
  choice: благословив
  rationale: Об’єкт у грецькому тексті не названо, тому й український текст не додає «їх», «хліби» або «Бога».
- source_word: κλάσας
  choice: розламавши хліби
  rationale: Додане з контексту «хліби» робить українську фразу ясною, не змінюючи референта дії.
- source_word: ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους
  choice: дав їх учням
  rationale: Займенник «їх» природно відсилає до щойно розламаних хлібів.
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: а учні — натовпам
  rationale: 'Тире природно відтворює грецький еліпсис: дієслово «дали» зрозуміле з попередньої частини.'
theological_decisions:
- issue: Не названий об’єкт дієслова εὐλόγησεν
  choice: Залишити «благословив» без прямого додатка.
  alternative: «благословив Бога», «промовив благословення» або «благословив їх».
  rationale: Грецький текст не вказує об’єкта. Безоб’єктна форма зберігає як можливість благословення Бога чи промовляння благословення перед їжею, так і традиційне розуміння благословення хлібів і риб, не вирішуючи неоднозначність за читача.
translation_notes:
  register: Сучасна літературна українська з гідним оповідним звучанням. Займенник «Він» ужито для ясності підмета; велика літера відповідає поширеній українській біблійній практиці, не додаючи окремого богословського твердження. Синтаксис переважно зберігає послідовність грецьких дій, але залишається природним для широкого кола читачів.
