id: MAT.14.15
reference: Matthew 14:15
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ὀψίας δὲ γενομένης προσῆλθον αὐτῷ οἱ ⸀μαθηταὶ λέγοντες· Ἔρημός ἐστιν ὁ τόπος καὶ ἡ ὥρα ἤδη παρῆλθεν· ἀπόλυσον τοὺς ὄχλους, ἵνα ἀπελθόντες εἰς τὰς κώμας ἀγοράσωσιν ἑαυτοῖς βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/015.yaml
  text: When evening came[a], the disciples came to him and said, “The place is deserted, and the hour is already late. Send the crowds away[b], so that they may go into the villages and buy food for themselves.”
translation:
  language: uk
  text: 'Коли настав вечір, учні підійшли до нього й сказали: «Місце тут безлюдне[a], і година вже пізня[b]. Відпусти натовпи, щоб вони пішли в села й купили собі їжі».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «Це безлюдне місце».
    reason: lexical_alternative
  - marker: b
    text: Буквально «година вже минула».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψίας δὲ γενομένης
  choice: Коли настав вечір
  rationale: Родовий абсолют позначає часовий перехід у розповіді. Такий вислів природно передає настання вечора; δέ тут має слабку сполучну функцію й не потребує окремого слова.
- source_word: προσῆλθον αὐτῷ
  choice: підійшли до нього
  rationale: προσέρχομαι означає наблизитися або підійти до когось; «підійшли до нього» природне в цьому контексті.
- source_word: οἱ μαθηταὶ
  choice: учні
  rationale: Означений артикль указує на вже відому групу учнів; український контекст не вимагає додавання присвійного займенника.
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: Місце тут безлюдне
  rationale: ἔρημος описує незаселену або віддалену місцевість. «Безлюдне» передає відсутність поселення поблизу, а «тут» природно відтворює ситуативне значення означеного ὁ τόπος без додавання географічного поняття пустелі.
- source_word: ἡ ὥρα ἤδη παρῆλθεν
  choice: година вже пізня
  rationale: Буквально вислів означає «година вже минула», але в контексті це ідіоматична вказівка на пізній час дня. Основний текст передає зміст природною українською, а буквальну форму збережено у примітці.
- source_word: ἀπόλυσον τοὺς ὄχλους
  choice: Відпусти натовпи
  rationale: ἀπολύω тут означає відпустити або розпустити зібрання. Множина «натовпи» зберігає граматичне число грецького тексту.
- source_word: ἵνα ἀπελθόντες
  choice: щоб вони пішли
  rationale: Сполука цільового речення з дієприкметником природно передається українським підрядним реченням мети.
- source_word: εἰς τὰς κώμας
  choice: в села
  rationale: κώμη означає невелике поселення, село. Близькість сіл випливає з контексту, але прямо не висловлена, тому слово «сусідні» не додано.
- source_word: ἀγοράσωσιν ἑαυτοῖς βρώματα
  choice: купили собі їжі
  rationale: βρώματα тут має загальне значення їжі; форма «собі» зберігає рефлексивне ἑαυτοῖς.
