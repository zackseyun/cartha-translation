  text: καὶ ἐπηρώτησαν αὐτὸν οἱ ⸀μαθηταὶ λέγοντες· Τί οὖν οἱ γραμματεῖς λέγουσιν ὅτι Ἠλίαν δεῖ ἐλθεῖν πρῶτον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/010.yaml
  text: And the disciples asked him, saying, “Why then do the scribes say that Elijah must come first?”
translation:
  language: uk
  text: 'І учні запитали Його: «Чому ж тоді книжники кажуть, що Ілля має прийти першим?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησαν
  choice: запитали
  rationale: Аорист позначає одноразову дію, що вводить пряме запитання; «запитали» природно й точно передає дієслово.
- source_word: οἱ μαθηταὶ
  choice: учні
  rationale: Означений артикль вказує на вже відому з контексту групу. Українська мова не потребує тут окремого показника означеності; додавати «Його» до «учні» немає потреби, бо цього слова в грецькому тексті немає.
- source_word: λέγοντες
  choice: двокрапка перед прямою мовою
  rationale: Дієприкметник вводить зміст запитання. В українській буквальне «кажучи» було б важкуватим; двокрапка природно виконує ту саму синтаксичну функцію.
- source_word: Τί οὖν
  choice: Чому ж тоді
  rationale: У сполученні з «кажуть, що» τί просить пояснити причину, тому «чому» передає зміст краще за формальне «що». Частки «ж тоді» відтворюють логічний зв’язок οὖν із попереднім контекстом.
- source_word: οἱ γραμματεῖς
  choice: книжники
  rationale: «Книжники» — усталений і прямий український відповідник для знавців та тлумачів Писання в євангельському контексті.
- source_word: λέγουσιν ὅτι
  choice: кажуть, що
  rationale: Прямо й природно передає теперішній час і сполучник, який вводить зміст твердження.
- source_word: Ἠλίαν
  choice: Ілля
  rationale: Усталена українська біблійна форма власного імені.
- source_word: δεῖ ἐλθεῖν
  choice: має прийти
  rationale: Конструкція виражає необхідність. «Має прийти» природно передає її силу без надмірного уточнення джерела цієї необхідності.
- source_word: πρῶτον
  choice: першим
  rationale: 'Передає часову й послідовну першість: Ілля повинен прийти раніше за наступну очікувану подію.'
theological_decisions:
- issue: Спрямованість запитання учнів про прихід Іллі
  choice: Запитання передано без уточнення, чи учні ставлять учення книжників під сумнів, визнають його або просять узгодити його з пережитою подією.
  alternative: Можна було б додати формулювання, яке виражає скепсис учнів, або прямо пояснити зв’язок із пророцтвом Малахії.
  rationale: Грецький текст цього вірша лише подає запитання; відповідь і богословське уточнення з’являються в наступних віршах. Переклад зберігає цю напругу.
- issue: Характер необхідності в δεῖ
  choice: Збережено загальне «має прийти», не називаючи прямо Божий задум, пророцтво чи есхатологічну вимогу.
  alternative: «За пророцтвом Ілля повинен прийти» або «Бог постановив, що Ілля прийде».
  rationale: Сам вірш не пояснює джерела необхідності, тому переклад не повинен вносити це пояснення до прямої мови учнів.
translation_notes:
  register: Сучасна стандартна українська, природний і гідний біблійний регістр. Збережено початкове «І» як зв’язок із попередньою розповіддю; уникнуто неприродного калькування дієприкметника λέγοντες.
