revisions:
- from: 'Коли вони сходили з гори, Ісус наказав їм: «Нікому не розповідайте про це видіння[a], доки Син Людський не буде піднятий із мертвих[b]».'
  to: 'Коли вони спускалися з гори, Ісус наказав їм: «Нікому не кажіть про видіння[a], доки Син Людський не буде воскрешений з мертвих[b]».'
  rationale: Виправлено лише формулювання воскресіння, щоб воно було природним сучасною українською та водночас зберігало пасивний стан грецького ἐγερθῇ. Уточнено основний відповідник τὸ ὅραμα й скорочено примітку до справжньої лексичної альтернативи. Зміст і неоднозначність щодо неназваного діяча воскресіння не змінено.
