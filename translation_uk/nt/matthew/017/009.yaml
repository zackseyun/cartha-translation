    issue: «Не буде піднятий із мертвих»
    rationale: Хоча ця конструкція формально намагається зберегти пасив, «піднятий» не є природним українським терміном для воскресіння й створює небажану двозначність. «Буде воскрешений з мертвих» зберігає і зміст, і пасивність.
  - severity: low
    issue: Примітка a повторює значення основного тексту
    rationale: Пояснення, що грецьке слово означає «видіння», не додає альтернативи, бо саме «видіння» вже стоїть у тексті. Достатньо подати перекладацьку альтернативу.
