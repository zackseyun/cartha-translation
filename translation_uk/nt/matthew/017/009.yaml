review_pass:
  verdict: revise
  source_fidelity: 'Основний зміст передано точно: одночасне сходження з гори, владний наказ, заборона повідомляти про видіння та часова межа, пов’язана з воскресінням Сина Людського. Проте «буде піднятий» у цьому контексті не є усталеним українським позначенням воскресіння і може сприйматися як фізичне підняття. «Буде воскрешений з мертвих» природніше передає пасивний стан ἐγερθῇ.'
  naturalness: «Спускалися з гори» та «не кажіть про видіння» є природними для сучасної стандартної української. Вилучення вказівного «це» точніше відтворює грецький означений вислів τὸ ὅραμα без додаткового дейктичного відтінку.
  terminology: «Син Людський» збережено як усталений відповідник. «Видіння» точно передає ὅραμα. «Буде воскрешений з мертвих» зберігає пасивну форму оригіналу, не називаючи діяча.
  issues:
