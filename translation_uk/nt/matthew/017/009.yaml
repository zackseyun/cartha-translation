  text: Καὶ καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους ἐνετείλατο αὐτοῖς ὁ Ἰησοῦς λέγων· Μηδενὶ εἴπητε τὸ ὅραμα ἕως οὗ ὁ υἱὸς τοῦ ἀνθρώπου ἐκ νεκρῶν ⸀ἐγερθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/009.yaml
  text: And as they were coming down from the mountain[a], Jesus commanded them, saying[b], “Tell the vision to no one until the Son of Man is raised from the dead.”
translation:
  language: uk
  text: 'Коли вони спускалися з гори, Ісус наказав їм: «Нікому не кажіть про видіння[a], доки Син Людський не буде воскрешений з мертвих[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «те, що ви бачили».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальніше: «з-поміж мертвих».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβαινόντων αὐτῶν
  choice: коли вони сходили
  rationale: Генитивний абсолют із дієприкметником теперішнього часу позначає одночасну тривалу дію; цей варіант природно передає її українською.
- source_word: ἐκ τοῦ ὄρους
  choice: з гори
  rationale: Прямий і природний просторовий відповідник, що вказує на вже відому з контексту гору.
- source_word: ἐνετείλατο αὐτοῖς
  choice: наказав їм
  rationale: Дієслово виражає владний наказ, а не просто пораду чи повідомлення.
- source_word: λέγων
  choice: ':'
  rationale: В українській двокрапка після дієслова мовлення природно вводить зміст наказу й передає функцію грецького дієприкметника без неприродного «кажучи».
- source_word: Μηδενὶ εἴπητε
  choice: Нікому не розповідайте
  rationale: Природна українська заборонна конструкція, яка зберігає наголос на тому, що повідомляти не можна жодній людині.
- source_word: τὸ ὅραμα
  choice: це видіння
  rationale: «Видіння» безпосередньо передає значення ὅραμα та зберігає його об’явлювальний відтінок; вказівне «це» природно пов’язує вислів із щойно описаною подією.
- source_word: ἕως οὗ
  choice: доки
  rationale: Точно й природно позначає часову межу заборони.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Син Людський
  rationale: Усталений український відповідник самоназви Ісуса, який зберігає її біблійні та богословські асоціації.
- source_word: ἐκ νεκρῶν
  choice: із мертвих
  rationale: Природний український біблійний вислів про воскресіння; буквальніше значення «з-поміж мертвих» подано в примітці.
- source_word: ἐγερθῇ
  choice: буде піднятий
  rationale: Передає пасивний стан аориста ἐγείρω та не робить виконавця дії явнішим, ніж це зроблено в грецькому тексті.
theological_decisions:
- issue: Формулювання та стан дієслова воскресіння
  choice: буде піднятий із мертвих
  alternative: воскресне з мертвих
  rationale: Грецька форма є пасивною. Переклад зберігає цей стан і можливий натяк на Божу дію, не називаючи діяча прямо.
- issue: Характер побаченого на горі
  choice: видіння
  alternative: те, що ви бачили
  rationale: Прямий відповідник ὅραμα зберігає об’явлювальний відтінок слова, не визначаючи цим нереальність самої події.
translation_notes:
  register: Сучасна, зрозуміла й водночас гідна українська мова. Дієприкметник λέγων передано пунктуаційно, щоб уникнути неприродного калькування. Традиційну назву «Син Людський» збережено.
