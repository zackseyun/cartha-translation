  text: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν τῷ Ἰησοῦ· Κύριε, καλόν ἐστιν ἡμᾶς ὧδε εἶναι· εἰ θέλεις, ⸀ποιήσω ὧδε τρεῖς σκηνάς, σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ ⸂Ἠλίᾳ μίαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/004.yaml
  text: 'Then Peter answered and said to Jesus[a], “Lord, it is good for us to be here. If you wish, I will make three shelters here: one for you, one for Moses, and one for Elijah.”'
translation:
  language: uk
  text: 'Тоді Петро озвався й сказав Ісусові: «Господи, добре нам тут бути. Якщо хочеш, я поставлю тут три намети[a]: один для Тебе, один для Мойсея і один для Іллі».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «курені», «шатра» чи «скинії»; грецьке σκηνάς означає намети або тимчасові житла.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: Тоді ... озвався й сказав
  rationale: Дієприкметник ἀποκριθείς разом з εἶπεν утворює звичну грецьку формулу введення прямої мови. «Озвався й сказав» природно передає її українською, а «тоді» відображає розповідний перехід, виражений δέ.
- source_word: Κύριε
  choice: Господи
  rationale: Клична форма «Господи» зберігає шанобливе звертання до Ісуса та можливу богословську вагу титулу κύριος, не звужуючи його до значення «Учителю».
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: добре нам тут бути
  rationale: Природна сучасна українська конструкція, що близько відтворює грецький зворот з інфінітивом і не додає пояснень.
- source_word: εἰ θέλεις
  choice: Якщо хочеш
  rationale: θέλω тут виражає бажання або волю адресата. «Якщо хочеш» є природним і шанобливим у цьому контексті.
- source_word: ποιήσω
  choice: я поставлю
  rationale: Щодо тимчасових споруд українське «поставлю» звучить природніше за буквальне «зроблю» і не передбачає капітального будівництва.
- source_word: σκηνάς
  choice: намети
  rationale: σκηνή означає намет або тимчасове житло. «Намети» — ясний сучасний відповідник, який зберігає конкретний образ, тоді як можливі культові чи святкові асоціації не нав’язуються в основному тексті.
- source_word: σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν
  choice: один для Тебе, один для Мойсея і один для Іллі
  rationale: Повторення «один» відтворює розподільний наголос триразового μίαν. Давальні форми передано природною українською конструкцією з «для».
- source_word: ὧδε
  choice: тут
  rationale: Обидва вживання ὧδε передано словом «тут», зберігаючи повтор оригіналу.
theological_decisions:
- issue: Передача κύριος у звертанні до Ісуса
  choice: Господи
  alternative: Учителю; Пане
  rationale: «Господи» зберігає широкий діапазон титулу — від шанобливого звертання до богословськи значущого найменування — і не усуває властивої контексту багатозначності.
- issue: Передача σκηνάς у розповіді про преображення
  choice: намети
  alternative: кущі; шатра; скинії
  rationale: Оригінал прямо не ототожнює ці споруди зі Святом Кущів. Тому в основному тексті вжито нейтральне й зрозуміле «намети», а інші відповідники, здатні викликати міжтекстові або культові асоціації, наведено у примітці.
translation_notes:
  register: Сучасна стандартна українська мова, природна й гідна для публічного читання. Збережено повтор «тут» і триразове «один», а також традиційні форми біблійних імен. Займенник «Тебе» у зверненні до Ісуса написано з великої літери як усталену українську шанобливу практику, без зміни змісту оригіналу.
