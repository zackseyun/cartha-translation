  yaml_path: translation/nt/matthew/017/016.yaml
  text: And I brought him to your disciples[a], and they were not able to heal him.
translation:
  language: uk
  text: І я привів його до твоїх учнів, і вони не змогли його зцілити.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσήνεγκα
  choice: привів
  rationale: У цій конструкції προσφέρω означає привести когось до іншої особи; «привів» природно передає дію щодо сина й узгоджується з давальним τοῖς μαθηταῖς σου.
- source_word: μαθηταῖς σου
  choice: Твоїх учнів
  rationale: У контексті Євангелія μαθητής означає учня й послідовника вчителя; «учні» є усталеним і зрозумілим відповідником.
- source_word: οὐκ ἠδυνήθησαν
  choice: не змогли
  rationale: Форма δύναμαι виражає неспроможність або відсутність можливості; «не змогли» точно й природно передає це українською.
- source_word: θεραπεῦσαι
  choice: зцілити
  rationale: У цьому контексті θεραπεύω означає відновити здоров’я стражденного хлопця; «зцілити» є природним євангельським відповідником.
- source_word: καὶ ... καὶ
  choice: І ... але
  rationale: Початкове καί передано як «І», а друге — природним українським «але», яке виражає очевидний у контексті наслідковий контраст без додавання нового змісту.
- source_word: αὐτόν
  choice: його
  rationale: Займенник стосується сина, згаданого в найближчому контексті; «його» прямо зберігає цей зв’язок.
theological_decisions:
- issue: Характер невдачі учнів
  choice: Передати лише їхню неспроможність зцілити хлопця, не пояснюючи її причини.
  alternative: Уточнити, що вони не змогли вигнати демона, або пояснити невдачу браком віри.
  rationale: Сам цей вірш повідомляє лише, що учні не змогли його зцілити. Причини та ширший контекст не слід вносити до перекладу цього речення.
translation_notes:
  register: Сучасна стандартна українська мова; виклад прямий, природний і гідний. Займенник «Твоїх» написано з великої літери як традиційне шанобливе звертання до Ісуса, без зміни змісту оригіналу.
