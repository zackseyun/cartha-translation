lexical_decisions:
- source_word: καὶ λέγων
  choice: і сказав
  rationale: Грецький дієприкметник продовжує попередню оповідну конструкцію; особова форма природно передає цей зв’язок сучасною українською.
- source_word: Κύριε
  choice: Господи
  rationale: Клична форма κύριος тут є шанобливим звертанням до Ісуса; «Господи» зберігає усталене й урочисте звучання.
- source_word: ἐλέησόν
  choice: змилуйся над
  rationale: Наказова форма виражає наполегливе прохання про співчутливу допомогу; українська конструкція «змилуйся над» природна й змістово точна.
- source_word: μου τὸν υἱόν
  choice: моїм сином
  rationale: υἱός конкретно означає сина, а не загальніше дитину; відмінок зумовлений українською конструкцією «змилуйся над».
- source_word: σεληνιάζεται
  choice: в нього бувають напади
  rationale: Передано спостережуваний стан без нав’язування сучасного медичного діагнозу чи давнього уявлення про вплив місяця; буквальний образ збережено в примітці.
- source_word: κακῶς πάσχει
  choice: тяжко страждає
  rationale: κακῶς підсилює πάσχει; вислів природно передає тяжкість страждання.
- source_word: πολλάκις
  choice: часто
  rationale: Стисло й точно передає повторюваність дії в обох паралельних частинах.
- source_word: πίπτει εἰς τὸ πῦρ
  choice: падає у вогонь
  rationale: Пряме й природне відтворення руху всередину вогню.
- source_word: εἰς τὸ ὕδωρ
  choice: у воду
  rationale: Збережено синтаксичний паралелізм із «у вогонь».
theological_decisions:
- issue: Передача σεληνιάζεται в контексті зцілення та вигнання демона
  choice: в нього бувають напади
  alternative: він епілептик; він уражений місяцем
  rationale: Слова батька описують стан хлопця, але цей вірш не подає технічного медичного діагнозу й не стверджує місячної причини. Феноменологічний переклад зберігає цю стриманість і не усуває напруження з ширшим контекстом оповіді.
translation_notes:
  register: Сучасна стандартна українська мова, природна для читання вголос і водночас гідна за тоном. Двокрапка перед «адже» виразно вводить пояснення, наявне в γάρ; повтор «часто» зберігає грецький паралелізм.
