reference: Matthew 17:5
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ἔτι αὐτοῦ λαλοῦντος ἰδοὺ νεφέλη φωτεινὴ ἐπεσκίασεν αὐτούς, καὶ ἰδοὺ φωνὴ ἐκ τῆς νεφέλης λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα· ⸂ἀκούετε αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/005.yaml
  text: While he was still speaking[a], behold, a bright cloud overshadowed them, and behold, a voice from the cloud said, “This is my beloved Son, with whom I am well pleased[c][b]; listen to him.”
translation:
  language: uk
  text: 'Коли він ще говорив, ось[a] світла хмара накрила їх своєю тінню[b], і ось голос із хмари промовив: «Це Мій улюблений Син, Якого Я вподобав. Слухайте Його![c]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Грецьке «ось» ужито в цьому вірші двічі як заклик звернути увагу; повтор підсилює драматичність події.
    reason: lexical_alternative
  - marker: b
    text: Грецьке слово буквально передає образ накриття тінню. Воно може відлунювати біблійну мову богоявлення, пов’язану з явною Божою присутністю.
    reason: cross_reference
  - marker: c
    text: 'Або: «Почуйте Його». Грецький наказ може означати не лише чути, а й уважно слухати та зважати на сказане.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: Коли він ще говорив
  rationale: Генітив абсолютний передає одночасну дію, а «ще» зберігає відчуття раптового переривання його слів.
- source_word: ἰδοὺ
  choice: ось
  rationale: Природний український вказівно-спонукальний маркер, який зберігає драматичність грецького ἰδού; повторення в оригіналі відтворено.
- source_word: νεφέλη φωτεινὴ
  choice: світла хмара
  rationale: Прямо передає незвичний образ яскравої або сяйливої хмари без додаткового богословського тлумачення.
- source_word: ἐπεσκίασεν
  choice: огорнула
  rationale: Природне сучасне слово передає, що хмара охопила присутніх; примітка зберігає буквальніший образ покриття тінню та можливий відгомін мови богоявлення.
- source_word: φωνὴ ἐκ τῆς νεφέλης λέγουσα
  choice: голос із хмари промовив
  rationale: Дієслівна конструкція природна українською, а «із хмари» точно передає джерело голосу.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: Мій улюблений Син
  rationale: Зберігає і синівську тотожність, і значення любові в ἀγαπητός, не додаючи пізнішої доктринальної термінології.
- source_word: ἐν ᾧ εὐδόκησα
  choice: Який Мені до вподоби
  rationale: Природний український відповідник формули Божого схвалення; не звужує вислів до задоволення лише вчинками чи поведінкою.
- source_word: ἀκούετε αὐτοῦ
  choice: Слухайте Його!
  rationale: Наказова форма «слухайте» охоплює не тільки фізичне сприйняття голосу, а й уважне прийняття сказаного, не розгортаючи це в тлумачне «коріться».
theological_decisions:
- issue: Боже проголошення тотожності Ісуса
  choice: Це Мій улюблений Син, Який Мені до вподоби
  alternative: Це Мій Син, Улюблений, у Якому Моє уподобання
  rationale: Обраний варіант безпосередньо зберігає назву «Син», любов і Боже схвалення, але звучить природно сучасною українською та не вводить відсутньої в тексті догматичної термінології.
- issue: Смислова сила ἀκούετε αὐτοῦ
  choice: Слухайте Його!
  alternative: Почуйте Його!
  rationale: «Слухайте» природно передає тривалу настанову уважно приймати слова Ісуса й допускає відтінок послуху, не роблячи його явним додатком до тексту.
- issue: Образ хмари в ἐπεσκίασεν
  choice: огорнула їх
  alternative: накрила їх своєю тінню
  rationale: Основний текст лишається ясним і природним, тоді як примітка повідомляє буквальніший образ і можливий біблійний відгомін, не проголошуючи цей відгомін єдиним тлумаченням.
translation_notes:
  register: Сучасна стандартна українська мова з урочистим, але загальнозрозумілим звучанням. Повтор «ось» навмисно збережено. Займенники у прямій Божій мові написано з великої літери відповідно до поширеної української біблійної практики.
