  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ἵνα δὲ μὴ σκανδαλίσωμεν αὐτούς, πορευθεὶς ⸀εἰς θάλασσαν βάλε ἄγκιστρον καὶ τὸν ⸀ἀναβάντα πρῶτον ἰχθὺν ἆρον, καὶ ἀνοίξας τὸ στόμα αὐτοῦ εὑρήσεις στατῆρα· ἐκεῖνον λαβὼν δὸς αὐτοῖς ἀντὶ ἐμοῦ καὶ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/027.yaml
  text: But so that we may not offend them[a], go to the sea, cast in a hook, and take the first fish that comes up. And when you open its mouth, you will find a stater[b]. Take that and give it to them for me and for yourself.
translation:
  language: uk
  text: Але щоб не образити їх[a], піди до моря, закинь гачок і витягни першу рибу, що спіймається. Відкрий їй рот — і знайдеш статер[b]. Візьми його й дай їм за мене й за себе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «щоб не стати для них причиною спотикання» чи «щоб не дати їм приводу спіткнутися».'
    reason: lexical_alternative
  - marker: b
    text: Статер — монета вартістю приблизно чотири драхми, якої вистачало, щоб сплатити храмовий податок за двох людей.
    reason: cultural_note
lexical_decisions:
- source_word: σκανδαλίσωμεν
  choice: не викликати в них обурення
  rationale: У цьому контексті дієслово передає думку про те, щоб не дати збирачам храмового податку зайвого приводу до обурення чи спотикання. Формулювання природне українською, а ширший образний зміст збережено у примітці.
- source_word: θάλασσαν
  choice: моря
  rationale: Збережено пряме значення грецького θάλασσα. Йдеться про Галілейське море, хоча географічно це озеро.
- source_word: ἄγκιστρον
  choice: гачок
  rationale: Звичний український відповідник рибальського гачка; контекст не потребує уточнення «рибальський».
- source_word: τὸν ἀναβάντα πρῶτον ἰχθὺν ἆρον
  choice: витягни першу рибу, що спіймається
  rationale: 'Природно передає послідовність: узяти першу рибу, яку буде піднято з води на гачку, без неприродного буквального повторення.'
- source_word: στατῆρα
  choice: статер
  rationale: Збережено назву конкретної монети; її вартість пояснено у примітці.
- source_word: ἀντὶ ἐμοῦ καὶ σοῦ
  choice: за мене й за себе
  rationale: Прийменник ἀντί тут указує на сплату за двох осіб. Українське «за» стисло й природно передає це значення.
- source_word: πορευθεὶς
  choice: піди
  rationale: Дієприкметник супровідної дії природно передано наказовою формою, яка вводить наступну послідовність велінь.
- source_word: δὸς αὐτοῖς
  choice: віддай їм
  rationale: Додаток зрозумілий із попередньої згадки про монету; «віддай» у контексті передає внесення належної суми.
theological_decisions:
- issue: Значення σκανδαλίζω у зв’язку зі сплатою храмового податку
  choice: Ісус велить сплатити, щоб не викликати в збирачів податку обурення чи не дати їм приводу спіткнутися, не скасовуючи попередньої тези про свободу синів.
  alternative: Ісус визнає безумовний обов’язок сплатити податок; або сплата має лише демонструвати чудо без етичного мотиву.
  rationale: Безпосередній контекст у Мт 17:24–26 стверджує, що сини вільні, тоді як цей вірш додає практичну поступку, введену словами ἵνα δὲ μὴ σκανδαλίσωμεν αὐτούς. Переклад зберігає цю напругу й не робить ширшого доктринального висновку.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Накази передано коротко та послідовно; специфічну назву монети збережено з поясненням у примітці. Займенники щодо Ісуса подано з малої літери відповідно до нейтральної сучасної орфографічної практики.
