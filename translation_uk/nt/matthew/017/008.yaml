  text: ἐπάραντες δὲ τοὺς ὀφθαλμοὺς αὐτῶν οὐδένα εἶδον εἰ μὴ ⸀αὐτὸν Ἰησοῦν μόνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/008.yaml
  text: And lifting up their eyes[a], they saw no one except Jesus alone.
translation:
  language: uk
  text: Підвівши очі, вони нікого не побачили, крім самого лише Ісуса.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: У грецькому тексті винятковість підсилено наголошеним займенником «самого» та словом «лише/тільки».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπάραντες
  choice: підвівши
  rationale: Аористовий дієприкметник передає дію, що передує головній; «підвівши очі» є природним українським відповідником конкретного грецького вислову.
- source_word: δὲ
  choice: не виражено окремим словом
  rationale: Тут δέ — слабкий оповідний сполучник. В українській послідовність розповіді природно передається без окремого «і» чи сильнішого «але».
- source_word: τοὺς ὀφθαλμοὺς αὐτῶν
  choice: очі
  rationale: Збережено конкретний тілесний образ; належність зрозуміла з підмета «вони», тому займенник «свої» не є необхідним.
- source_word: οὐδένα εἶδον
  choice: вони нікого не побачили
  rationale: Простий і природний відповідник заперечного додатка та аориста ὁράω в оповідному контексті.
- source_word: εἰ μὴ
  choice: крім
  rationale: Після заперечення ця конструкція вводить виняток, а не умову.
- source_word: αὐτὸν Ἰησοῦν μόνον
  choice: самого лише Ісуса
  rationale: «Самого» відтворює наголошений займенник αὐτόν, а «лише» — μόνον; разом вони природно передають накопичений у грецькому тексті наголос на винятковості.
theological_decisions:
- issue: Ісус як єдина видима постать після видіння
  choice: Зберегти подвійний наголос у вислові «самого лише Ісуса»
  alternative: «крім одного Ісуса» або «крім Ісуса»
  rationale: Грецьке εἰ μὴ + αὐτόν + μόνον посилено підкреслює, що учні більше нікого не бачили. Переклад зберігає цей оповідний наголос, не додаючи богословського тлумачення.
translation_notes:
  register: Сучасна нормативна українська мова; стислий, гідний оповідний стиль. Конструкція «підвівши очі» зберігає образність оригіналу, а «самого лише Ісуса» — його подвійний наголос.
