  text: and they will kill him[a], and on the third day he will be raised. And they were deeply grieved.
translation:
  language: uk
  text: І вб’ють Його[a], і третього дня Він буде воскрешений. І вони дуже засмутилися.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Він воскресне». Грецьке дієслово має пасивну форму: «Він буде воскрешений».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκτενοῦσιν αὐτόν
  choice: вб’ють Його
  rationale: Майбутній активний дієслівний вираз передано прямо й природно; «страчать» звузило б значення до офіційної кари, а «вб’ють» не додає відсутнього в грецькому дієслові правового чи морального відтінку.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: третього дня
  rationale: Давальний часу природно передається усталеним українським зворотом «третього дня», без зайвого уточнення «після цього».
- source_word: ἐγερθήσεται
  choice: Він буде воскрешений
  rationale: Майбутню пасивну форму збережено, щоб точно передати граматику джерела й не усунути можливого натяку на дію Бога.
- source_word: ἐλυπήθησαν σφόδρα
  choice: вони дуже засмутилися
  rationale: Поєднання дієслова смутку з підсилювальним прислівником передано природною сучасною українською; «дуже» зберігає силу σφόδρα без архаїзації.
- source_word: καὶ ... καὶ ... καὶ
  choice: і ... і ... І
  rationale: Повторення сполучника зберігає просту послідовність і паротактичний рух грецького тексту.
theological_decisions:
- issue: Пасивне чи активне формулювання передбачення воскресіння
  choice: Він буде воскрешений
  alternative: Він воскресне
  rationale: Грецьке ἐγερθήσεται є формою майбутнього пасивного стану. Пасивний переклад зберігає форму й богословську напругу щодо Божої дії, не заперечуючи можливого ідіоматичного розуміння «Він воскресне».
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Великі літери в займенниках «Його», «Він» ужито як шанобливе оформлення посилання на Ісуса; змістової неоднозначності це не усуває.
