reference: Matthew 17:25
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: λέγει· Ναί. καὶ ⸀ἐλθόντα εἰς τὴν οἰκίαν προέφθασεν αὐτὸν ὁ Ἰησοῦς λέγων· Τί σοι δοκεῖ, Σίμων; οἱ βασιλεῖς τῆς γῆς ἀπὸ τίνων λαμβάνουσιν τέλη ἢ κῆνσον; ἀπὸ τῶν υἱῶν αὐτῶν ἢ ἀπὸ τῶν ἀλλοτρίων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/025.yaml
  text: He said[a], “Yes.” And when he came into the house, Jesus spoke to him first, saying, “What do you think[b], Simon? From whom do the kings of the earth collect duties or poll tax—from their own sons or from others?”
translation:
  language: uk
  text: 'Він відповів: «Так». Коли ж він увійшов до дому, Ісус заговорив до нього першим: «Як ти гадаєш, Симоне? З кого земні царі беруть мито чи подушний податок[a]: зі своїх синів чи зі сторонніх[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «митні збори чи данину». Грецький текст розрізняє τέλη — мита або різні збори — і κῆνσον — подушний податок або данину.
    reason: lexical_alternative
  - marker: b
    text: Або «чужих». Грецьке ἀλλοτρίων означає тих, хто не належить до власної сім’ї, тобто людей з-поза неї.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ναί
  choice: Так
  rationale: Проста ствердна відповідь; «Так» є природним і точним відповідником.
- source_word: ἐλθόντα εἰς τὴν οἰκίαν
  choice: коли ж він увійшов до дому
  rationale: Знахідний дієприкметник стосується Петра; підрядне речення природно передає часовий зв’язок українською.
- source_word: προέφθασεν αὐτὸν
  choice: Ісус заговорив до нього першим
  rationale: У цьому контексті дієслово означає, що Ісус випередив Петра й першим почав говорити, а не просто прибув раніше.
- source_word: Τί σοι δοκεῖ
  choice: Як ти гадаєш
  rationale: Природний сучасний вислів, яким запитують думку або судження співрозмовника.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: земні царі
  rationale: Передає протиставлення царів цього світу небесному Царю, не звужуючи γῆ до певної країни.
- source_word: τέλη
  choice: мито
  rationale: Позначає непрямі збори, мита або податки; «мито» зберігає відмінність від наступного κῆνσον.
- source_word: κῆνσον
  choice: подушний податок
  rationale: Позначає особистий, подушний або данницький податок і чітко відрізняється від τέλη.
- source_word: υἱῶν αὐτῶν
  choice: своїх синів
  rationale: Зберігає конкретне значення «сини» та сімейне протиставлення, важливе для наступного висновку Ісуса.
- source_word: ἀλλοτρίων
  choice: сторонніх
  rationale: Йдеться про тих, хто не належить до царської сім’ї; «сторонні» природно зберігає це протиставлення без звуження до іноземців.
theological_decisions:
- issue: Богословський підтекст образу царських синів
  choice: Збережено буквальну сімейну мову «своїх синів» без пояснення христологічного висновку в самому вірші.
  alternative: своїх дітей; своїх підданих
  rationale: Безпосередній образ стосується звільнення царських синів від податку й готує богословський висновок наступного вірша. Переклад не повинен ані приховувати, ані передчасно розтлумачувати цей підтекст.
translation_notes:
  register: Сучасна стандартна українська мова; виклад природний і гідний. «До дому» вжито щодо входження в дім, а «заговорив до нього першим» ясно передає ініціативу Ісуса. Маркери приміток поставлено безпосередньо біля слів, яких вони стосуються.
