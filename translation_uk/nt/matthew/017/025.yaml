  terminology: Терміни «мито» та «подушний податок» слушно розрізняють τέλη і κῆνσον. «Своїх синів» не нівелює конкретного значення υἱῶν, а «сторонніх» коректно передає сімейно-соціальний контраст ἀλλοτρίων, не нав’язуючи значення етнічних чужинців. Примітки точно пояснюють можливі відповідники й належно прив’язані до відповідних слів.
