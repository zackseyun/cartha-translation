  source_fidelity: 'Переклад точно передає зміст грецького тексту: ствердну відповідь Петра, його прихід до дому, ініціативу Ісуса в розмові та податкову аналогію. «Заговорив до нього першим» вдало й природно передає προέφθασεν αὐτόν без зайвого тлумачення. «Земні царі», «мито», «подушний податок», «своїх синів» і «сторонніх» зберігають суттєві лексичні та образні розрізнення оригіналу.'
