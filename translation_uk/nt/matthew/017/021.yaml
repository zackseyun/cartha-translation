  text: Τοῦτο δὲ τὸ γένος οὐκ ἐκπορεύεται εἰ μὴ ἐν προσευχῇ καὶ νηστείᾳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/021.yaml
  text: But[a] this kind does not come out except by prayer and fasting.
translation:
  language: uk
  text: А цей рід[a] не виходить інакше, як через молитву й піст.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Цього вірша немає в найдавніших грецьких рукописах, зокрема в Синайському й Ватиканському кодексах IV століття, а також у ранніх сирійських і коптських перекладах. Проте він є у візантійській традиції більшості рукописів, у латинській традиції та в більшості сирійських рукописів. Імовірно, пізніші переписувачі додали його для узгодження з Марка 9:29.
    reason: textual_critical
lexical_decisions:
- source_word: γένος
  choice: рід
  rationale: У цьому контексті слово означає певну категорію або різновид демонів; «рід» природно й стисло передає це значення українською.
- source_word: ἐκπορεύεται
  choice: не виходить
  rationale: Дієслово описує вихід демона з ураженої людини; «виходить» зберігає образ і напрямок дії оригіналу.
- source_word: εἰ μὴ
  choice: інакше, як
  rationale: У заперечній конструкції вислів установлює виняткову умову; українська конструкція «не… інакше, як…» точно й природно передає цей зміст.
- source_word: ἐν προσευχῇ καὶ νηστείᾳ
  choice: через молитву й піст
  rationale: Прийменник ἐν тут указує на засіб або необхідну духовну практику; «через» природно передає інструментальний відтінок без надмірного уточнення.
theological_decisions:
- issue: До чого належить вислів «цей рід»
  choice: Залишено загальне «цей рід» без прямого додавання слова «демонів».
  alternative: «цей рід демонів»
  rationale: Контекст указує на демонів, однак у грецькому тексті слово «демонів» відсутнє; недомовленість оригіналу збережено.
translation_notes:
  register: Сучасна літературна українська мова з гідним, загальнозрозумілим біблійним звучанням. Сполучник «А» передає δὲ як легкий контраст із попередньою думкою; «й» ужито для природної милозвучності.
