source:
  edition: SBLGNT
  text: ⸀Συστρεφομένων δὲ αὐτῶν ἐν τῇ Γαλιλαίᾳ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μέλλει ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοσθαι εἰς χεῖρας ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/022.yaml
  text: While they were gathering together in Galilee[a], Jesus said to them[c][b], “The Son of Man is about to be delivered into the hands of men,”
translation:
  language: uk
  text: 'Коли ж вони збиралися разом у Галілеї[a], Ісус сказав їм: «Син Людський незабаром буде відданий у руки людей».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Коли ж вони зібралися разом у Галілеї».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Συστρεφομένων
  choice: зібралися разом
  rationale: Передає спільну дію групи й не уточнює понад текст, чи йдеться про пересування, скликання або тривале перебування разом. Варіант із тривалою дією подано в примітці.
- source_word: δὲ
  choice: ж
  rationale: Природно позначає перехід і зв’язок із попередньою розповіддю, не надаючи сполучникові надмірно сильного протиставного значення.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: у Галілеї
  rationale: Прямий і природний відповідник місцевого звороту.
- source_word: εἶπεν αὐτοῖς
  choice: сказав їм
  rationale: Точно й природно відтворює дієслово мовлення з непрямим додатком.
- source_word: Μέλλει
  choice: невдовзі буде
  rationale: Передає очікуваність і близькість майбутньої події, не додаючи значення обов’язку чи наперед визначеної долі, яке могло б виникнути у формі «має бути».
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Син Людський
  rationale: Усталений український відповідник, який зберігає форму самоназви Ісуса та її біблійні й богословські відлуння.
- source_word: παραδίδοσθαι
  choice: буде відданий
  rationale: 'Зберігає пасивний стан і широту значення: текст не уточнює тут, чи наголос лежить на зраді, арешті або передачі під владу інших.'
- source_word: εἰς χεῖρας ἀνθρώπων
  choice: у руки людей
  rationale: Зберігає виразний грецький образ і природно передає ἀνθρώπων як людей загалом, водночас підтримуючи словесне зіставлення із титулом «Син Людський».
theological_decisions:
- issue: Передача титулу ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Син Людський
  alternative: Людський Син; Людина
  rationale: Традиційна буквальна форма зрозуміла сучасному читачеві та найкраще зберігає міжтекстові й богословські зв’язки вислову, не витлумачуючи їх наперед.
- issue: Значення παραδίδοσθαι у провіщенні страждань
  choice: буде відданий
  alternative: буде переданий; буде зраджений
  rationale: Обрана форма зберігає пасивність і невказаного діяча. «Буде зраджений» надто рано звужує значення до зради Юди, а «буде переданий» може звучати переважно як офіційна передача.
- issue: Модальність μέλλει
  choice: невдовзі буде
  alternative: має бути; ось-ось буде
  rationale: «Невдовзі буде» передає наближення події, але не перетворює вислів на твердження про обов’язок чи фатальну необхідність; «ось-ось» було б сильнішим і розмовнішим.
translation_notes:
  register: Сучасна нормативна українська мова з гідним оповідним тоном. Порядок слів і традиційний титул збережено там, де вони підтримують біблійний образ; неприродних кальок та конфесійно навантажених уточнень уникнено.
