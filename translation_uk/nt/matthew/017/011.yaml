  text: He answered[a], “Elijah indeed is coming and will restore all things.”
translation:
  language: uk
  text: 'Він же відповів: «Ілля справді прийде[a] й відновить усе».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «приходить». Грецьке дієслово у формі теперішнього часу має тут значення майбутнього часу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: відповів
  rationale: Сполука дієприкметника з особовою формою дієслова буквально означає «відповівши, сказав», але в сучасній українській природно й повно передається одним дієсловом «відповів».
- source_word: Ἠλίας
  choice: Ілля
  rationale: Ужито усталену українську біблійну форму особового імені.
- source_word: μέν
  choice: справді
  rationale: Частка підсилює твердження та готує контраст у наступному вірші; «справді» передає цю функцію без неприродної конструкції «з одного боку».
- source_word: ἔρχεται
  choice: прийде
  rationale: Хоча грецьке дієслово має форму теперішнього часу, у цьому контексті воно спрямоване в майбутнє. Український майбутній час природно виражає цей сенс; примітка зберігає можливість формальнішого відтворення.
- source_word: ἀποκαταστήσει
  choice: відновить
  rationale: Майбутній активний індикатив прямо вказує на майбутню дію; «відновить» зберігає значення повернення до належного стану, не конкретизуючи характер відновлення.
- source_word: πάντα
  choice: усе
  rationale: Субстантивований середній рід множини має широкий, всеохопний зміст. «Усе» природно передає його українською, не додаючи неназваних об’єктів.
theological_decisions:
- issue: Характер і обсяг відновлювальної праці Іллі
  choice: відновить усе
  alternative: приведе все до належного стану; відновить усі речі
  rationale: Грецький текст говорить про відновлення всеохопно, але в цьому вірші не визначає його точного обсягу чи характеру. Широке формулювання зберігає богословську напругу й не нав’язує конкретної схеми тлумачення.
translation_notes:
  register: Сучасна, природна й гідна українська мова. Частку δὲ передано словом «же», щоб зберегти зв’язок із попереднім запитанням; порядок слів зроблено природним для української. Примітка подана після завершальної лапки та позначена в основному тексті.
