translation:
  language: uk
  text: Тоді учні зрозуміли, що він сказав їм про Івана Хрестителя[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Букв. «Івана, який хрестить».
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Тоді
  rationale: Природний і стислий часовий сполучник, що позначає момент усвідомлення.
- source_word: συνῆκαν
  choice: зрозуміли
  rationale: Аорист συνίημι передає осягнення змісту сказаного; «зрозуміли» є точним і природним відповідником.
- source_word: οἱ μαθηταὶ
  choice: учні
  rationale: Усталене українське позначення послідовників Ісуса в євангельській оповіді.
- source_word: ὅτι
  choice: що
  rationale: Сполучник вводить зміст того, що зрозуміли учні, а не причинове речення.
- source_word: περὶ
  choice: про
  rationale: З родовим відмінком περί позначає тему висловлювання; «про» є природним сучасним відповідником.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: Івана Хрестителя
  rationale: Усталене й загальнозрозуміле українське найменування Івана; можливий буквальніший варіант подано в примітці.
- source_word: εἶπεν αὐτοῖς
  choice: Він говорив їм
  rationale: Передає попередню щодо усвідомлення мовленнєву дію без додавання змісту; український минулий час природно виражає часову послідовність без окремого давноминулого.
theological_decisions:
- issue: Ототожнення постаті Іллі в безпосередньому контексті
  choice: Вірш прямо повідомляє, що учні зрозуміли Ісусові слова як сказані про Івана Хрестителя.
  alternative: Розгорнути пояснення зв’язку Івана з Іллею.
  rationale: Сам текст чітко називає референта, але не розгортає богословського пояснення; переклад не повинен додавати його.
translation_notes:
  register: Сучасна стандартна українська, природний і гідний оповідний стиль. Займенник «Він» ужито для ясності суб’єкта, який у грецькому дієслові виражений неявно. У примітці пояснено дієве значення титулу βαπτιστής без створення неприродного українського найменування.
