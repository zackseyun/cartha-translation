source:
  edition: SBLGNT
  text: Καὶ ⸀ἐλθόντων πρὸς τὸν ὄχλον προσῆλθεν αὐτῷ ἄνθρωπος γονυπετῶν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/014.yaml
  text: And when they came to the crowd[a], a man came up to him, kneeling before him[b],
translation:
  language: uk
  text: Коли вони прийшли до натовпу, до Ісуса підійшов чоловік і став перед Ним навколішки[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «впав перед Ним на коліна».'
    reason: 'Лексична альтернатива: γονυπετῶν може змальовувати не лише позу, а й рух припадання на коліна.'
lexical_decisions:
- source_word: Καὶ
  choice: Коли
  rationale: Сполучник Καὶ разом із родовим абсолютним зворотом природно передано українською підрядною часовою конструкцією без окремого «і».
- source_word: ἐλθόντων
  choice: вони прийшли
  rationale: Аористовий дієприкметник у родовому абсолютному звороті виражає попередню або супровідну часову обставину; множинний суб’єкт зрозумілий із контексту.
- source_word: πρὸς τὸν ὄχλον
  choice: до натовпу
  rationale: ὄχλος тут означає зібрання людей; «натовп» є звичним і точним сучасним відповідником.
- source_word: προσῆλθεν αὐτῷ
  choice: до Ісуса підійшов
  rationale: προσέρχομαι означає наблизитися або підійти до когось. Ім’я «Ісус» ужито замість двозначного в українському реченні займенника, оскільки обидва грецькі займенники стосуються Ісуса.
- source_word: ἄνθρωπος
  choice: чоловік
  rationale: У цьому конкретному оповідному контексті іменник позначає дорослого чоловіка, а не людину взагалі.
- source_word: γονυπετῶν αὐτόν
  choice: став перед Ним навколішки
  rationale: Дієприкметник описує шанобливе припадання або ставання на коліна перед Ісусом; цей вислів природно передає дію українською, не визначаючи її богословського значення.
theological_decisions:
- issue: Чи передає γονυπετῶν поклоніння в богословському сенсі
  choice: став перед Ним навколішки
  alternative: уклонився Йому, ставши навколішки
  rationale: Грецьке слово безпосередньо описує тілесну позу або рух. Нейтральне формулювання зберігає шанобливий характер дії, але не вирішує понад текст, чи це було саме культове поклоніння.
- issue: Передача ἄνθρωπος щодо конкретної особи
  choice: чоловік
  alternative: людина
  rationale: Форма й контекст указують на конкретного чоловіка; такий переклад не вносить ширших антропологічних тверджень.
translation_notes:
  register: Сучасна нормативна українська мова; оповідний стиль простий і гідний. Порядок слів усуває займенникову неясність. Велика літера в «Ним» відповідає поширеній українській біблійній традиції, не додаючи окремого змістового твердження.
