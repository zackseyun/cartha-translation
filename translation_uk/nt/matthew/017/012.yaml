id: MAT.17.12
reference: Matthew 17:12
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι Ἠλίας ἤδη ἦλθεν, καὶ οὐκ ἐπέγνωσαν αὐτὸν ἀλλὰ ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν· οὕτως καὶ ὁ υἱὸς τοῦ ἀνθρώπου μέλλει πάσχειν ὑπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/012.yaml
  text: But I tell you that Elijah has already come[a], and they did not recognize him, but did to him whatever they wanted[c][b]. So also the Son of Man is about to suffer at their hands.
translation:
  language: uk
  text: 'Але кажу вам: Ілля вже прийшов, та вони не впізнали його[a], а зробили з ним усе, що хотіли[b]. Так само й Син Людський невдовзі постраждає від них[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «не пізнали його» чи «не визнали його». Грецьке слово може означати, що вони не розпізнали належним чином, ким він був або яку роль виконував.'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «вчинили з ним, як хотіли». Грецький вислів означає, що вони поводилися з ним на власний розсуд.'
    reason: lexical_alternative
  - marker: c
    text: 'Або: «має постраждати від них». Грецький вислів підкреслює, що страждання наближається.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Але кажу вам
  rationale: Природний український вступ до прямої мови; «але» передає протиставний відтінок δέ у зв’язку з попереднім очікуванням.
- source_word: Ἠλίας ἤδη ἦλθεν
  choice: Ілля вже прийшов
  rationale: Усталена українська форма імені; аорист із ἤδη позначає вже здійснений прихід, значущий для теперішньої ситуації.
- source_word: οὐκ ἐπέγνωσαν αὐτόν
  choice: вони не впізнали його
  rationale: У контексті йдеться про нездатність правильно розпізнати його особу або роль, а не лише про відсутність знайомства.
- source_word: ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν
  choice: зробили з ним усе, що хотіли
  rationale: Природний український відповідник ідіоматичного звороту, який передає необмежені дії щодо нього без надмірного уточнення їхнього характеру.
- source_word: οὕτως καὶ
  choice: Так само й
  rationale: Чітко передає аналогію між поводженням з Іллею та майбутнім стражданням Сина Людського.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Син Людський
  rationale: Усталений український відповідник титульного вислову, що зберігає його біблійні асоціації.
- source_word: μέλλει πάσχειν
  choice: невдовзі постраждає
  rationale: Передає майбутню, близьку в часі подію без внесення сильнішого значення приреченості або необхідності, якого ця конструкція сама по собі не вимагає.
- source_word: ὑπ’ αὐτῶν
  choice: від них
  rationale: Природно передає агентне значення ὑπό з родовим відмінком у контексті заподіяного страждання.
theological_decisions:
- issue: Ототожнення приходу Іллі
  choice: Збережено ім’я «Ілля» без доданого в самому вірші пояснення, що йдеться про Івана Хрестителя.
  alternative: Прямо назвати Івана Хрестителя як Іллю-предтечу.
  rationale: Безпосередній контекст пояснює ототожнення, однак цей вірш називає Іллю. Переклад не вставляє контекстуальне тлумачення в слова самого вірша.
- issue: Сила μέλλει щодо страждання Сина Людського
  choice: «невдовзі постраждає» — майбутнє страждання подано як близьке й очікуване.
  alternative: «має постраждати» або «приречений постраждати».
  rationale: Конструкція вказує на те, що має невдовзі статися, але в цій фразі прямо не виражає богословської необхідності; тому сильнішого детерміністичного відтінку не додано.
translation_notes:
  register: Сучасна стандартна українська, природна й гідна біблійного тексту. Синтаксис доступний широкому колу читачів; усталені біблійні найменування «Ілля» та «Син Людський» збережено. Маркери приміток розміщено безпосередньо після відповідних висловів.
