base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/026.yaml
  text: When he said[a], “From strangers,” Jesus said to him[c][b], “Then the sons are free.”
translation:
  language: uk
  text: 'Коли ж він сказав: «Від чужих»,[a] Ісус сказав йому: «Отже, сини[c] вільні».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «Від сторонніх» чи «Від інших». Грецький вислів протиставляє тих, хто не належить до дому правителя, його власним синам.
    reason: lexical_alternative
  - marker: b
    text: Або «сини звільнені від сплати». Грецький текст буквально каже «сини вільні», що в цьому контексті означає звільнення від податку.
    reason: lexical_alternative
  - marker: c
    text: Або «діти», хоча в грецькому тексті конкретно сказано «сини».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰπόντος δέ
  choice: Коли ж він сказав
  rationale: Родовий абсолют передає часову обставину, а δέ позначає перехід у розповіді. «Коли ж він сказав» природно зберігає обидві риси.
- source_word: ἀπὸ τῶν ἀλλοτρίων
  choice: Від чужих
  rationale: ἀλλότριοι тут означає тих, хто не належить до родини правителя, на противагу його синам. «Чужі» зберігає цей родинно-правовий контраст і не вносить зайвого етнічного значення.
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Ісус промовив до нього
  rationale: Природна українська оповідна формула, яка точно передає звернене до співрозмовника висловлювання.
- source_word: Ἄρα γε
  choice: Отже
  rationale: Сполука часток вводить висновок із попередньої відповіді; «отже» ясно й стисло передає логічний наслідок.
- source_word: ἐλεύθεροί
  choice: вільні
  rationale: Буквально зберігає ширше значення прикметника; у контексті воно передбачає звільнення від податку, але не обмежується словом «звільнені».
- source_word: οἱ υἱοί
  choice: сини
  rationale: Грецький текст прямо називає синів і протиставляє їх чужим щодо царського дому; «сини» зберігає родинний, правовий і богословський відтінки.
theological_decisions:
- issue: Передача οἱ υἱοί у вислові, який може мати ширше представницьке значення
  choice: сини
  alternative: діти
  rationale: Безпосередня аналогія стосується синів правителя та їхнього становища щодо податку. Чоловічу форму джерела збережено, не розширюючи й не нейтралізуючи вислів; можливий ширший сенс не заперечується.
