lexical_decisions:
- source_word: ἀκούσαντες
  choice: Почувши це
  rationale: Аористовий дієприкметник передає дію, що супроводжує або передує головній; природне українське «почувши» зберігає цю синтаксичну стислість. «Це» відсилає до голосу з попереднього вірша, не називаючи його прямо.
- source_word: οἱ μαθηταὶ
  choice: учні
  rationale: Усталений і природний український відповідник для μαθηταί у Євангеліях; у цьому контексті йдеться про учнів Ісуса.
- source_word: ἔπεσαν
  choice: впали
  rationale: Прямий відповідник простого аориста πίπτω, без додавання навмисності чи посиленої емоційності.
- source_word: ἐπὶ πρόσωπον αὐτῶν
  choice: долілиць
  rationale: Природний український вислів для положення обличчям до землі; передає тілесну позу, не визначаючи її богословського значення.
- source_word: ἐφοβήθησαν
  choice: злякалися
  rationale: Природний сучасний відповідник для аориста φοβέομαι, який виражає настання сильного страху.
- source_word: σφόδρα
  choice: дуже
  rationale: Ясно й природно передає високий ступінь страху, виражений прислівником σφόδρα.
theological_decisions:
- issue: Характер реакції учнів на божественний голос
  choice: Передано тілесне падіння долілиць і сильний страх без уточнення, чи це поклоніння, жах або благоговійний трепет.
  alternative: Витлумачити реакцію переважно як поклоніння або переважно як жах перед божественним явленням.
  rationale: Грецький текст називає позу учнів і їхній страх, але прямо не визначає богословського характеру цієї реакції; переклад зберігає цю напругу.
translation_notes:
  register: Сучасна стандартна українська мова; виклад стислий, природний і гідний. «Долілиць» точно передає позу без надмірного пояснення, а «дуже злякалися» звучить зрозуміло для широкого кола читачів.
