source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς, καὶ ἐξῆλθεν ἀπ’ αὐτοῦ τὸ δαιμόνιον· καὶ ἐθεραπεύθη ὁ παῖς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/018.yaml
  text: And Jesus rebuked it[a], and the demon came out of him; and the boy was healed from that hour.
translation:
  language: uk
  text: Ісус докорив йому[a], і демон вийшов із хлопця; і від тієї миті хлопець був зцілений.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Займенник «йому» найімовірніше стосується демона; граматично він може стосуватися і хлопця.
    reason: Збереження неоднозначності референта грецького αὐτῷ.
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: докорив
  rationale: Передає значення різкої владної догани, не звужуючи вислів до самого лише наказу.
- source_word: αὐτῷ
  choice: йому
  rationale: Зберігає особовий займенник грецького тексту та його формальну неоднозначність; найближчий контекст указує передусім на демона.
- source_word: τὸ δαιμόνιον
  choice: демон
  rationale: Прямий і загальнозрозумілий відповідник, без додавання відсутнього в тексті означення «нечистий».
- source_word: ἐξῆλθεν ἀπ’ αὐτοῦ
  choice: вийшов із хлопця
  rationale: Природно передає вислів про вигнання демона. Повторне «з нього» українською могло б створити зайву неясність після займенника «йому», тому контекстуального учасника названо прямо.
- source_word: ἐθεραπεύθη
  choice: був зцілений
  rationale: Зберігає пасивну форму та значення зцілення, не обмежуючи його суто медичним одужанням.
- source_word: ὁ παῖς
  choice: хлопець
  rationale: У контексті йдеться про сина чоловіка; «хлопець» точніше за широке «дитина» і виключає невідповідне тут значення «слуга».
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: від тієї миті
  rationale: Природний сучасний український відповідник часового звороту, який означає, що зцілення настало тоді й тривало надалі.
theological_decisions:
- issue: До кого стосується αὐτῷ у словах про Ісусову догану
  choice: У тексті залишено займенник «йому»; контекст найбільше вказує на демона
  alternative: Ісус докорив хлопцеві
  rationale: Наступне речення про вихід демона робить демона найімовірнішим адресатом, однак сама граматична форма не називає референта прямо, тому неоднозначність зазначено у примітці.
translation_notes:
  register: Сучасна нормативна українська з урочистим, але доступним біблійним звучанням. Уникнуто архаїчного буквального звороту «від тієї години»; «від тієї миті» природно передає негайність і подальший стан.
