  text: καὶ μετεμορφώθη ἔμπροσθεν αὐτῶν, καὶ ἔλαμψεν τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος, τὰ δὲ ἱμάτια αὐτοῦ ⸀ἐγένετο λευκὰ ὡς τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/002.yaml
  text: And he was transfigured before them[a], and his face shone like the sun, and his clothes became white as the light.
translation:
  language: uk
  text: 'І Він переобразився перед ними[a]: Його обличчя засяяло, як сонце, а одяг став білим, як світло.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «перемінився».'
    reason: Лексичний варіант для μετεμορφώθη, який передає ширше значення дієслова без усталеного терміна «переобразився».
lexical_decisions:
- source_word: μετεμορφώθη
  choice: преобразився
  rationale: Аорист пасивного стану від μεταμορφόω позначає зміну вигляду чи форми. «Преобразився» точно передає видиму славну зміну та зберігає усталену назву цієї події, не пояснюючи її природу понад сказане в тексті.
- source_word: ἔμπροσθεν αὐτῶν
  choice: перед ними
  rationale: Прямо передає просторовий вислів і вказує, що учні були присутні та бачили цю подію.
- source_word: ἔλαμψεν
  choice: засяяло
  rationale: Природно передає дієслово λάμπω — випромінювати світло, сяяти.
- source_word: τὸ πρόσωπον αὐτοῦ
  choice: Його обличчя
  rationale: У цьому контексті πρόσωπον означає фізичне обличчя Ісуса; займенник передано природним українським порядком слів.
- source_word: ὡς ὁ ἥλιος
  choice: як сонце
  rationale: Зберігає виразне порівняння, введене ὡς.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: одяг
  rationale: Іменник у множині позначає одяг загалом; український збірний іменник «одяг» тут звучить природно й точно.
- source_word: ἐγένετο λευκὰ
  choice: став білим
  rationale: Передає зміну стану без додавання невираженої в грецькому тексті інтенсивності.
- source_word: ὡς τὸ φῶς
  choice: як світло
  rationale: Зберігає порівняння з φῶς і не зводить образ до прикметника «яскравий».
theological_decisions:
- issue: Передача події преображення
  choice: преобразився
  alternative: змінився
  rationale: «Преобразився» передає видиму зміну Ісусового вигляду й усталену назву події, не додаючи тверджень про сутність або механізм цієї зміни. Ширший лексичний варіант наведено у примітці.
translation_notes:
  register: Сучасна, зрозуміла й водночас гідна українська мова. Початкове «І» зберігає зв’язок із попереднім викладом; двокрапка природно вводить опис видимих ознак преображення. Сполучник δέ передано як «а», щоб відтворити перехід від обличчя до одягу.
