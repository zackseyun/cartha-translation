    rationale: Вони перетворюють грецьку майбутню, реально відкриту умову (ἐὰν + теперішній суб’юнктив; майбутні індикативи) на українську контрфактичну або віддалено-гіпотетичну конструкцію. Слід ужити «якщо матимете ... скажете ... перейде ... не буде».
  - severity: low
