  source_fidelity: Потрібно виправити спосіб у головній умовній конструкції. Грецьке ἐὰν ἔχητε ... ἐρεῖτε ... μεταβήσεται є відкритою умовою з перспективою майбутнього («якщо матимете ... скажете ... вона перейде»), а не гіпотетичною умовою «якби ... сказали б ... перейшла б».
  naturalness: Початкове «А Він каже їм» і «Через ваше маловір’я» природні для сучасного біблійного українського стилю. Формулювання «віру з гірчичне зерно» можливе як розмовно-еліптичне позначення міри, але «віру завбільшки з гірчичне зерно» ясніше й нормативно прозоріше.
  terminology: «Маловір’я», «віра», «істинно» та «неможливого» належно передають ὀλιγοπιστία, πίστις, ἀμήν і ἀδυνατήσει, не вносячи конфесійних пояснень. «Перейди» / «перейде» коректно відтворює μεταβαίνω стосовно гори.
