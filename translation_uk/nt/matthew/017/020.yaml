source:
  edition: SBLGNT
  text: ὁ δὲ ⸀λέγει αὐτοῖς· Διὰ τὴν ⸀ὀλιγοπιστίαν ὑμῶν· ἀμὴν γὰρ λέγω ὑμῖν, ἐὰν ἔχητε πίστιν ὡς κόκκον σινάπεως, ἐρεῖτε τῷ ὄρει τούτῳ· ⸂Μετάβα ἔνθεν⸃ ἐκεῖ, καὶ μεταβήσεται, καὶ οὐδὲν ἀδυνατήσει ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/020.yaml
  text: But he says to them[a], “Because of your little faith. For truly I say to you, if you have faith like a mustard seed, you will say to this mountain, ‘Move from here to there,’ and it will move[c][b], and nothing will be impossible for you.”
translation:
  language: uk
  text: 'А Він каже їм: «Через ваше маловір’я.[a] Бо істинно кажу вам: якщо матимете віру завбільшки з гірчичне зерно,[b] то скажете цій горі: “Перейди звідси туди”, — і вона перейде, і не буде для вас нічого неможливого».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «через вашу малу віру» чи «через брак у вас віри». Грецьке слово вказує радше на недостатню віру, ніж на цілковите невірство.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «віру, як гірчичне зерно». Порівняння підкреслює щось дуже мале.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: каже
  rationale: Історичний теперішній час збережено, щоб передати жвавий наративний стиль Матвія.
- source_word: Διὰ τὴν ὀλιγοπιστίαν ὑμῶν
  choice: Через ваше маловір’я
  rationale: ὀλιγοπιστία означає недостатню, малу віру, а не обов’язково повну відсутність віри; «маловір’я» стисло й природно передає цю думку.
- source_word: ἀμὴν
  choice: істинно
  rationale: У вступі до урочистого вислову слово має підсилювальну функцію; «істинно» зберігає біблійну гідність і зрозуміле сучасному читачеві.
- source_word: πίστιν
  choice: віру
  rationale: У контексті йдеться про довіру до Божої сили; «віра» зберігає основне значення слова без конфесійного уточнення.
- source_word: ὡς κόκκον σινάπεως
  choice: з гірчичне зерно
  rationale: Порівняння вказує на надзвичайно малий розмір; українська конструкція природно зберігає образ оригіналу.
- source_word: Μετάβα ἔνθεν ἐκεῖ
  choice: Перейди звідси туди
  rationale: «Перейди» природно передає наказ переміститися з одного місця в інше й узгоджується з наступним дієсловом.
- source_word: μεταβήσεται
  choice: вона перейшла б
  rationale: 'Дієслово вжито неперехідно: гора сама переміститься; умовний спосіб природно зумовлений українською конструкцією «якби… то».'
- source_word: οὐδὲν ἀδυνατήσει ὑμῖν
  choice: не було б для вас нічого неможливого
  rationale: Це природний український відповідник грецького ідіоматичного вислову, який не розширює його богословського змісту.
theological_decisions:
- issue: Значення πίστις у контексті чуда
  choice: віра
  alternative: довіра
  rationale: Контекст стосується недостатньої довіри учнів до Божої сили, однак основний текст зберігає ширше слово «віра», не зводячи його до окремого доктринального тлумачення.
- issue: Обсяг твердження «нічого неможливого»
  choice: збережено без пояснювального обмеження
  alternative: явно обмежити здійсненням Божої волі або чудотворенням
  rationale: Грецький текст формулює твердження широко; переклад не повинен додавати відсутнє в цьому вірші богословське уточнення, хоча контекст пов’язує слова з вірою учнів.
translation_notes:
  register: Сучасна нормативна українська з урочистим, але доступним біблійним звучанням. Початкове δέ передано слабким зв’язком «А», без надмірно різкого протиставлення. Займенник «Він» написано з великої літери відповідно до поширеної української біблійної видавничої практики; це не додає змісту до грецького тексту.
