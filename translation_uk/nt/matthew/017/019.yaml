source:
  edition: SBLGNT
  text: Τότε προσελθόντες οἱ μαθηταὶ τῷ Ἰησοῦ κατ’ ἰδίαν εἶπον· Διὰ τί ἡμεῖς οὐκ ἠδυνήθημεν ἐκβαλεῖν αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/019.yaml
  text: Then the disciples came to Jesus privately and said[a], “Why were we not able to cast it out?”
translation:
  language: uk
  text: 'Тоді учні підійшли до Ісуса наодинці й сказали: «Чому ми не змогли його[a] вигнати?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Займенник, найімовірніше, стосується демона; можливе також розуміння, що він стосується хлопця.
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  choice: Тоді
  rationale: Природний часовий сполучник, що вводить наступну подію в розповіді.
- source_word: προσελθόντες
  choice: підійшли
  rationale: Дієприкметникову конструкцію природно передано особовою формою; «підійшли» точно виражає наближення до Ісуса.
- source_word: οἱ μαθηταὶ
  choice: учні
  rationale: Усталений і зрозумілий відповідник для μαθηταί у євангельському контексті.
- source_word: τῷ Ἰησοῦ
  choice: до Ісуса
  rationale: Давальний відмінок після προσέρχομαι передано нормативною українською конструкцією «підійшли до».
- source_word: κατ’ ἰδίαν
  choice: наодинці
  rationale: Природно передає розмову без сторонніх, тобто приватно.
- source_word: εἶπον
  choice: сказали
  rationale: Збережено звичайне значення λέγω, не замінюючи його тлумачним «запитали», хоча далі стоїть запитання.
- source_word: Διὰ τί
  choice: Чому
  rationale: Прямий і природний відповідник запитання про причину.
- source_word: ἡμεῖς
  choice: ми
  rationale: Збережено виражений у грецькому тексті особовий займенник і властивий йому легкий наголос.
- source_word: οὐκ ἠδυνήθημεν
  choice: не змогли
  rationale: Природна сучасна українська форма, що точно передає минулу нездатність здійснити дію.
- source_word: ἐκβαλεῖν
  choice: вигнати
  rationale: Усталене й зрозуміле дієслово для примусового видалення демона в контексті вигнання нечистої сили.
- source_word: αὐτό
  choice: його
  rationale: Український займенник природно відсилає до об’єкта вигнання; неоднозначність щодо того, чи йдеться про демона, чи про хлопця, пояснено у примітці.
theological_decisions:
- issue: До кого стосується займенник αὐτό у контексті вигнання
  choice: Основний текст залишає займенник «його», а примітка вказує, що найімовірніше йдеться про демона.
  alternative: Займенник може стосуватися хлопця.
  rationale: Грецький займенник середнього роду найприродніше узгоджується з δαιμόνιον («демон») у попередньому вірші, а ἐκβάλλω часто має демона за об’єкт. Водночас контекст допускає співвіднесення із хлопцем, тому неоднозначність не усунуто мовчки.
translation_notes:
  register: Сучасна стандартна українська мова; виклад природний, стислий і гідний. Конструкція «підійшли… наодинці й сказали» зберігає послідовність та форму грецького вислову, а порядок слів у запитанні передає легкий наголос на «ми».
