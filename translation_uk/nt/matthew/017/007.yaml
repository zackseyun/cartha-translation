  text: καὶ ⸂προσῆλθεν ὁ Ἰησοῦς καὶ ἁψάμενος αὐτῶν⸃ εἶπεν· Ἐγέρθητε καὶ μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/007.yaml
  text: And Jesus came near and touched them and said[a], “Get up[c][b], and do not be afraid.”
translation:
  language: uk
  text: 'Ісус підійшов, доторкнувся до них і сказав: «Встаньте й не бійтеся».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσῆλθεν
  choice: підійшов
  rationale: Дієслово προσέρχομαι означає наблизитися або підійти до когось; «підійшов» природно передає спрямований рух Ісуса до учнів.
- source_word: ἁψάμενος αὐτῶν
  choice: доторкнувся до них
  rationale: Дієприкметник від ἅπτω з родовим відмінком означає фізичний дотик. Особова форма природна українською і не додає конкретизації на зразок «поклав руку».
- source_word: εἶπεν
  choice: сказав
  rationale: Прямий і нейтральний відповідник стандартного дієслова мовлення λέγω.
- source_word: Ἐγέρθητε
  choice: Встаньте
  rationale: У контексті учні лежать долілиць, тому наказ закликає їх підвестися. «Встаньте» є природним сучасним відповідником і не надає вислову додаткового богословського значення.
- source_word: μὴ φοβεῖσθε
  choice: не бійтеся
  rationale: Звичний український відповідник φοβέομαι, який природно передає заспокійливий наказ без надмірного уточнення аспекту як «перестаньте боятися».
- source_word: καὶ
  choice: і / й
  rationale: Сполучники зберігають просту послідовність дій; на початку речення перше καί природно не відтворене, оскільки ізольований український вірш не потребує початкового «і».
theological_decisions:
- issue: Передача заспокійливого наказу Ісуса без доданої пастирської або доктринальної конкретизації
  choice: «Встаньте й не бійтеся»
  alternative: «Підведіться й не лякайтеся»; «Встаньте й перестаньте боятися»
  rationale: Обраний варіант прямо передає фізичний заклик підвестися та наказ не боятися, не посилюючи видової семантики теперішнього імператива і не додаючи богословського тлумачення.
translation_notes:
  register: 'Сучасна стандартна українська, природний і гідний оповідний стиль. Грецьку дієприкметникову конструкцію передано послідовними особовими дієсловами, що відповідає українському синтаксису. Лексичних або текстологічних приміток не потрібно: можливі варіанти не створюють суттєвої неоднозначності для читача.'
