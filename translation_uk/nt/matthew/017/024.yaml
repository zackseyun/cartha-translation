base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/024.yaml
  text: When they came to Capernaum[a], those who collected the two-drachma tax came to Peter and said[b], “Does your teacher not pay the two-drachma tax?”
translation:
  language: uk
  text: 'Коли вони прийшли до Капернаума, до Петра підійшли збирачі податку у дві драхми[a] й запитали: «Ваш учитель не сплачує податку у дві драхми?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дві драхми»; мається на увазі храмовий податок розміром у дві драхми.'
    reason: cultural_note
lexical_decisions:
- source_word: Ἐλθόντων δὲ αὐτῶν
  choice: Коли вони прийшли
  rationale: Родовий абсолют передає часову обставину. Такий вислів природний сучасною українською; слабке δέ відтворене переходом до нової події без окремого сполучника.
- source_word: Καφαρναοὺμ
  choice: Капернаума
  rationale: Ужито нормативну українську форму біблійної географічної назви у родовому відмінку після прийменника «до».
- source_word: προσῆλθον
  choice: підійшли
  rationale: Дієслово означає наближення до когось; «підійшли до Петра» точно й природно передає рух.
- source_word: οἱ τὰ δίδραχμα λαμβάνοντες
  choice: збирачі податку у дві драхми
  rationale: Субстантивований дієприкметниковий зворот називає людей за їхньою функцією. Контекстуальне «податок» пояснює, що йдеться про стягнення встановленого платежу, а не просто отримання монет.
- source_word: δίδραχμα
  choice: податок у дві драхми
  rationale: Грецький термін позначає платіж розміром у дві драхми. Описовий переклад зрозуміліший за технічне «дидрахма» й зберігає суму.
- source_word: Ὁ διδάσκαλος ὑμῶν
  choice: Ваш Учитель
  rationale: «Учитель» є точним і усталеним відповідником διδάσκαλος. Множинне ὑμῶν передано ввічливим зверненням до Петра від імені групи; велика літера відповідає українській біблійній традиції щодо титулу Ісуса.
- source_word: οὐ τελεῖ
  choice: не сплачує
  rationale: У контексті обов’язкового платежу τελέω означає «сплачувати». Негативну форму питання збережено, не нав’язуючи очікуваної відповіді.
theological_decisions:
- issue: Чи називати δίδραχμα податком, а не просто монетами
  choice: У головному тексті вжито «податок у дві драхми»
  alternative: «дві драхми» або «дидрахма» без пояснення характеру платежу
  rationale: Контекст стосується сплати встановленого храмового збору. Слово «податок» виражає контекстуальний зміст, тоді як примітка уточнює культурне тло без внесення конфесійного тлумачення.
- issue: Прагматична сила заперечного питання οὐ τελεῖ
  choice: 'Збережено заперечне питання: «не сплачує?»'
  alternative: Ствердно зорієнтоване «сплачує ж, чи не так?»
  rationale: Грецьке питання, ймовірно, передбачає позитивну відповідь, але буквальна заперечна форма лишає цю прагматичну тонкість відкритою й не посилює її тлумаченням.
translation_notes:
  register: Сучасна стандартна українська мова; виклад природний, ясний і гідний. Технічний грошовий термін передано описово, а культурне уточнення винесено в примітку. Форму заперечного питання оригіналу збережено.
