    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: ось
  rationale: Природний сучасний український вказівний вигук, який привертає увагу й передає раптовість побаченого.
- source_word: ὤφθη
  choice: з’явилися
  rationale: Форма аориста пасивного стану від ὁράω тут ідіоматично позначає видиму появу. Українське «з’явилися» звучить природніше за буквальне «були побачені», а формальну альтернативу збережено в примітці.
- source_word: αὐτοῖς
  choice: їм
  rationale: Давальний відмінок позначає тих, кому явилися Мойсей та Ілля; «їм» прямо відтворює грецьку форму без додаткового тлумачення.
- source_word: Μωϋσῆς
  choice: Мойсей
  rationale: Усталена українська форма особового імені.
- source_word: Ἠλίας
  choice: Ілля
  rationale: Усталена українська біблійна форма особового імені.
- source_word: συλλαλοῦντες
  choice: які розмовляли
  rationale: Дієслово передає взаємну розмову; підрядна конструкція природно відтворює грецький дієприкметник сучасною українською.
- source_word: μετ’ αὐτοῦ
  choice: з ним
  rationale: μετά з родовим відмінком виражає спільність дії. Займенник збережено; з контексту він стосується Ісуса.
theological_decisions:
- issue: Кого позначає αὐτοῦ
  choice: «ним» стосується Ісуса
  alternative: Замінити займенник власним ім’ям «Ісусом»
  rationale: Контекст преображення ясно вказує на Ісуса, однак збереження займенника точніше відповідає грецькому тексту й не робить неявне явним.
- issue: Характер появи Мойсея та Іллі
  choice: Передати як їхню видиму появу
  alternative: «Були побачені ними»
  rationale: Текст стверджує, що учні побачили Мойсея та Іллю, але не пояснює способу або природи їхньої присутності. Переклад не додає такого пояснення.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. «Ось» зберігає виразний заклик звернути увагу без архаїчного забарвлення. Займенник «ним» подано з малої літери відповідно до звичайної сучасної орфографії та без конфесійного стилістичного маркування.
