base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/017.yaml
  text: But Jesus answered[a], “O unbelieving and perverse generation[c][b], how long will I be with you? How long will I bear with you? Bring him here to me.”
translation:
  language: uk
  text: 'А Ісус у відповідь сказав: «О невірне й викривлене покоління![a] Доки Я буду з вами? Доки терпітиму вас? Приведіть його сюди до Мене».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «невіруюче й розбещене (чи зіпсуте) покоління».'
    reason: Грецькі слова ἄπιστος і διεστραμμένη допускають відповідно відтінки невіри/невірності та моральної викривленості/зіпсуття.
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: А Ісус у відповідь сказав
  rationale: Природно передає поширений зворот «відповів і сказав»; δέ тут має перехідний відтінок, для якого українське «А» не створює надмірно сильного протиставлення.
- source_word: Ὦ
  choice: О
  rationale: Зберігає урочистий, докірливий і водночас скорботний тон звертання.
- source_word: γενεὰ
  choice: покоління
  rationale: Передає звичайне значення γενεά та зберігає біблійно-пророче звучання вислову.
- source_word: ἄπιστος
  choice: невірне
  rationale: Українське «невірне» може передавати як брак віри, так і невірність, не усуваючи властивої грецькому слову смислової широти.
- source_word: διεστραμμένη
  choice: розбещене
  rationale: Передає стан морального викривлення; можливі відтінки «викривлене» та «зіпсуте» зазначено у примітці.
- source_word: ἕως πότε μεθ’ ὑμῶν ἔσομαι
  choice: Доки Я буду з вами?
  rationale: Безпосередньо й природно відтворює часовий риторичний запит.
- source_word: ἕως πότε ἀνέξομαι ὑμῶν
  choice: Доки терпітиму вас?
  rationale: «Терпіти когось» стисло й природно передає значення ἀνέχομαι — зносити, витримувати, терпіти.
- source_word: φέρετέ μοι αὐτὸν ὧδε
  choice: Приведіть його сюди до Мене
  rationale: Оскільки йдеться про хлопця, «приведіть» природніше за буквальне «принесіть» і точно передає наказ допровадити його до Ісуса.
theological_decisions:
- issue: Значення ἄπιστος у докорі Ісуса
  choice: невірне
  alternative: безвірне; маловірне; невірне Богові
  rationale: «Невірне» зберігає двозначність між невірою та невірністю й не звужує докір до лише одного богословського тлумачення.
- issue: Коло адресатів вислову «покоління»
  choice: Не уточнювати в тексті
  alternative: учні; присутній натовп; сучасники Ісуса загалом
  rationale: Грецький текст прямо не визначає, кого саме охоплює звертання, тому переклад не повинен вирішувати цю неоднозначність.
translation_notes:
  register: Сучасна нормативна українська з гідним біблійним звучанням. Збережено риторичну силу двох запитань; уникнуто як надто розмовного «скільки Я ще вас терпітиму», так і неприродно буквального синтаксису.
