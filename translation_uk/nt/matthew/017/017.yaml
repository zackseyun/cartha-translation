  source_fidelity: 'Основний зміст передано точно: риторичні запитання, майбутній час, неозначене коло адресатів і наказ привести хлопця збережено. Однак «розбещене» звужує διεστραμμένη до моральної розпусти, тоді як слово означає «викривлене, спотворене, збочене»; нейтральніше «викривлене» точніше відтворює образ і не додає конкретного виду моральної провини.'
  naturalness: «А Ісус у відповідь сказав», «Доки Я буду з вами? Доки терпітиму вас?» і «Приведіть його сюди до Мене» є природними для сучасної нормативної української та зберігають піднесений біблійний регістр. «Викривлене покоління» також нормативне й зрозуміле в цьому пророчому докорі.
  terminology: «Невірне» доречно зберігає можливу двозначність ἄπιστος («невіруюче» / «невірне»). «Покоління» точно передає γενεά. Заміна «розбещене» на «викривлене» краще відповідає διεστραμμένη без невиправданого звуження значення.
