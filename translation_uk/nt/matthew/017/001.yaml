source:
  edition: SBLGNT
  text: Καὶ μεθ’ ἡμέρας ἓξ παραλαμβάνει ὁ Ἰησοῦς τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, καὶ ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν κατ’ ἰδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/001.yaml
  text: And after six days Jesus takes Peter[a], James, and John his brother[c][b], and leads them up onto a high mountain by themselves.
translation:
  language: uk
  text: А через шість днів Ісус бере з собою Петра, Якова та його брата Івана й веде їх окремо на високу гору.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθ’ ἡμέρας ἓξ
  choice: через шість днів
  rationale: Прийменник μετά зі знахідним відмінком виражає часову наступність. «Через шість днів» природно передає грецький вислів і зберігає його зв’язок із попередньою розповіддю.
- source_word: παραλαμβάνει
  choice: бере з собою
  rationale: Дієслово означає взяти когось із собою; цей відповідник точніше за просте «бере» передає супровід і природно звучить українською.
- source_word: Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην
  choice: Петра, Якова та Івана
  rationale: Ужито усталені українські біблійні форми особових імен.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: його брата
  rationale: У контексті зворот найприродніше визначає Івана як брата Якова. Розташування «Якова та його брата Івана» робить цей зв’язок зрозумілим українською.
- source_word: ἀναφέρει
  choice: веде ... на
  rationale: Тут дієслово позначає рух угору або приведення на височину. «Веде їх ... на високу гору» природно передає напрямок без зайвого повторення дієслова «бере».
- source_word: εἰς ὄρος ὑψηλὸν
  choice: на високу гору
  rationale: У контексті руху εἰς позначає місце призначення; український прийменниковий зворот «на високу гору» ідіоматично передає сходження.
- source_word: κατ’ ἰδίαν
  choice: їх самих
  rationale: Вислів означає окремо від інших, на самоті. У сполученні «веде їх самих» стисло й природно передано, що Ісус відвів лише цих трьох учнів.
theological_decisions:
- issue: Історичний теперішній час у євангельській оповіді
  choice: 'Збережено теперішній час: «Ісус бере ... й веде»'
  alternative: 'Минулий час: «Ісус узяв ... і повів»'
  rationale: Грецькі παραλαμβάνει та ἀναφέρει стоять у теперішньому часі й надають оповіді жвавості. Такий історичний теперішній природно можливий і в сучасній українській, тому його збережено.
translation_notes:
  register: Сучасна стандартна українська; виклад природний, зрозумілий і гідний. Сполука «бере з собою» точно передає супровід, а «їх самих» — відокремлення від інших. Пунктуація й порядок слів пристосовані до української норми без додавання тлумачних деталей.
