  yaml_path: translation/nt/matthew/013/045.yaml
  text: Again[a], the kingdom of heaven is like a merchant seeking fine pearls.
translation:
  language: uk
  text: Знову Царство Небесне подібне до купця, який шукає добірних перлин.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάλιν
  choice: Іще
  rationale: Вводить наступне порівняння в низці притч; «іще» природно передає продовження викладу.
- source_word: ὁμοία ἐστὶν
  choice: подібне до
  rationale: Природна українська формула порівняння, що точно передає грецьку конструкцію.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Царство Небесне
  rationale: Усталений і природний український відповідник характерного для Матвія вислову; прикметникова форма уникає неприродного «царство небес».
- source_word: ἀνθρώπῳ ἐμπόρῳ
  choice: до купця
  rationale: ἔμπορος уже позначає людину, тому окреме відтворення ἀνθρώπῳ як «чоловіка» було б надлишковим; давальний відмінок є безпосереднім членом порівняння.
- source_word: ζητοῦντι
  choice: який шукає
  rationale: Підрядне означальне речення природно передає теперішній активний дієприкметник і тривалу діяльність купця.
- source_word: καλοὺς μαργαρίτας
  choice: добрих перлин
  rationale: καλός у торговельному контексті вказує на високу якість; «добрі перлини» зберігає широту значення, не звужуючи його лише до краси чи ціни.
theological_decisions:
- issue: Обсяг порівняння у формулі притчі
  choice: Царство безпосередньо порівнюється з купцем.
  alternative: Царство подібне до всієї ситуації, у якій купець шукає добрі перлини.
  rationale: Грецька конструкція ὁμοία ἐστὶν ... ἀνθρώπῳ ἐμπόρῳ граматично подає купця як безпосередній член порівняння. Переклад не звужує ширшого сенсу образної ситуації, яка розгортається далі.
translation_notes:
  register: Сучасна стандартна українська, проста й гідна оповідна мова. Збережено традиційне біблійне найменування «Царство Небесне», але синтаксис зроблено природним для сучасного читача.
