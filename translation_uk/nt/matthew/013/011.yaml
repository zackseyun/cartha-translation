  text: ὁ δὲ ἀποκριθεὶς εἶπεν ⸀αὐτοῖς· Ὅτι ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τῶν οὐρανῶν, ἐκείνοις δὲ οὐ δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/011.yaml
  text: He answered them[a], “To you it has been given to know the mysteries of the kingdom of heaven[b], but to them it has not been given.”
translation:
  language: uk
  text: 'Він відповів їм: «Вам дано пізнати таємниці[a] Царства Небесного, а їм не дано[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «секрети».
    reason: lexical_alternative
  - marker: b
    text: Пасивна форма «дано» не називає того, хто дає; за змістом це знання дарує Бог.
    reason: implicit_divine_agent
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: відповів
  rationale: У цій поширеній грецькій конструкції дієприкметник із особовою формою дієслова природно передається одним українським дієсловом «відповів», без буквального й неприродного «відповів і сказав».
- source_word: Ὅτι
  choice: двокрапка перед прямою мовою, без окремого відповідника
  rationale: Тут ὅτι вводить зміст відповіді. В українській мові цей зв’язок природно виражається двокрапкою і прямою мовою; додавання «бо» могло б надмірно наголосити причинне значення.
- source_word: δέδοται
  choice: дано
  rationale: Безособова пасивна форма зберігає неназваного діяча та передає наявний результат того, що було даровано.
- source_word: γνῶναι
  choice: пізнати
  rationale: «Пізнати» передає значення набуття знання про відкриті Божі реалії й водночас залишається природним у біблійному контексті.
- source_word: τὰ μυστήρια
  choice: таємниці
  rationale: «Таємниці» зберігає значення прихованих раніше істин, які тепер відкриваються, не зводячи їх до загадок.
- source_word: τῆς βασιλείας τῶν οὐρανῶν
  choice: Небесного Царства
  rationale: Це природний і усталений український відповідник характерного для Матвія вислову; він передає небесну належність і походження царювання, не вимагаючи неприродної буквальності.
- source_word: ἐκείνοις
  choice: їм
  rationale: У контексті протиставлення «вам — їм» займенник чіткий, стислий і природніший за розгорнуте «тим людям».
- source_word: οὐ δέδοται
  choice: не дано
  rationale: Повторює пасивну конструкцію першої частини та зберігає риторичний паралелізм грецького тексту.
theological_decisions:
- issue: Неназваний діяч у пасиві δέδοται
  choice: Збережено пасив «дано», не називаючи Бога прямо
  alternative: «Бог дав вам» або «вам даровано Богом»
  rationale: Грецький текст залишає того, хто дає, неназваним. Хоча контекст указує на Бога, явне додавання Його імені усунуло б навмисну невираженість оригіналу.
- issue: Значення μυστήρια в контексті Царства
  choice: «таємниці»
  alternative: «секрети» або «приховані істини»
  rationale: «Таємниці» зберігає широту біблійного поняття про Божі реалії, раніше приховані, а тепер відкриті, без звужувального тлумачення.
translation_notes:
  register: Сучасна літературна українська мова з гідним, доступним звучанням. Збережено стислий паралелізм «вам дано — їм не дано» та богословськи значущий неназваний діяч пасивної конструкції.
