  text: І Він не вчинив там багатьох могутніх діянь[a] через їхнє невірство.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «багатьох чудес» чи «багатьох діянь сили». Грецьке слово означає вияви сили й у цьому контексті вказує на чудесні діяння.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὐκ ἐποίησεν
  choice: І не вчинив Він
  rationale: καί продовжує розповідь, а οὐκ заперечує аорист ἐποίησεν. «Не вчинив» передає здійснену дію, не додаючи значення нездатності.
- source_word: ἐκεῖ
  choice: там
  rationale: Природний український відповідник прислівника місця, що вказує на місце подій у рідному краї Ісуса.
- source_word: δυνάμεις πολλὰς
  choice: багатьох могутніх діл
  rationale: У євангельському контексті δύναμις означає вияв сили, зокрема чудесне діяння. «Могутні діла» зберігає зв’язок із поняттям сили й не звужує вислів до інтерпретаційного «чудеса»; πολλὰς передано як «багатьох».
- source_word: διὰ τὴν ἀπιστίαν αὐτῶν
  choice: через їхнє невірство
  rationale: διά зі знахідним відмінком виражає причину. ἀπιστία прямо означає невірство або відсутність віри; «невірство» доречно передає негативну силу слова в контексті неприйняття.
theological_decisions:
- issue: Чи йдеться про нездатність Ісуса чинити могутні діла, чи про те, що Він їх не вчинив
  choice: «не вчинив Він там багатьох могутніх діл»
  alternative: «не міг учинити там багатьох чудес»
  rationale: У Матвія стоїть οὐκ ἐποίησεν — «не вчинив», а не вислів про нездатність. Переклад не посилює твердження і зберігає богословську напругу тексту.
translation_notes:
  register: Сучасна літературна українська мова з гідним біблійним звучанням. Інверсія «не вчинив Він» природно зберігає наративний акцент; займенник із великої літери відповідає поширеній українській біблійній традиції.
