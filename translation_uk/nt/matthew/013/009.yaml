  text: Хто має вуха, нехай слухає.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Хто має
  rationale: 'Артикль із дієприкметником ужито субстантивовано й узагальнено: йдеться про будь-яку людину, яка має вуха. Українське «хто має» природно передає цей зміст без недоречного родового уточнення.'
- source_word: ὦτα
  choice: вуха
  rationale: Грецьке слово стоїть у множині; «вуха» прямо зберігає число й усталений образ вислову.
- source_word: ἀκουέτω
  choice: нехай слухає
  rationale: Конструкція з «нехай» передає наказовий спосіб третьої особи однини. Недоконаний вид «слухає» узгоджується з теперішнім імперативом і в цьому контексті виражає не лише фізичне сприйняття звуку, а й уважне прийняття сказаного.
theological_decisions:
- issue: Узагальнений граматично чоловічий вираз
  choice: Хто має вуха, нехай слухає
  alternative: Той, хто має вуха, нехай слухає
  rationale: Грецька форма має чоловічий рід і однину, але функціонує узагальнено. Український займенник «хто» природно охоплює будь-яку людину, водночас зберігаючи однину й не додаючи гендерного уточнення, якого немає у значенні джерела.
translation_notes:
  register: Сучасна, загальнозрозуміла й водночас гідна біблійна мова. Лаконічність та афористичний ритм грецького вислову збережено.
