  source_fidelity: Точний переклад грецького тексту. «Посіяний на кам’янистому ґрунті» адекватно передає субстантивований пасивний дієприкметник, не усуваючи стислої метафоричної напруги оригіналу. «Відразу», «з радістю» і «приймає його» передають εὐθύς, μετὰ χαρᾶς і λαμβάνων αὐτόν без невиправданого тлумачення.
