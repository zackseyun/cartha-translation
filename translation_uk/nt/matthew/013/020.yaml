source:
  edition: SBLGNT
  text: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ εὐθὺς μετὰ χαρᾶς λαμβάνων αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/020.yaml
  text: As for the one sown on the rocky ground[a], this is the one who hears the word and immediately receives it with joy,
translation:
  language: uk
  text: А посіяний на кам’янистому ґрунті[a] — це той, хто чує слово й відразу з радістю приймає його,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або, формальніше: «посіяний на кам’янистих місцях».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς
  choice: А посіяний на кам’янистому ґрунті
  rationale: Субстантивований дієприкметниковий зворот зберігає стислий образ посіяного, водночас «а» природно передає м’який перехід δέ.
- source_word: πετρώδη
  choice: кам’янистому ґрунті
  rationale: Передає кам’янисту місцевість природною сучасною українською та підтримує землеробський образ притчі.
- source_word: σπαρείς
  choice: посіяний
  rationale: Пасивний дієприкметник зберігає форму й метафору грецького аориста без розгортання в підрядну конструкцію.
- source_word: οὗτός ἐστιν
  choice: це той
  rationale: Прямо відтворює ототожнення та природно вводить в українській пояснення особи, яку уособлює образ.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: хто чує слово
  rationale: Відносне речення природно передає грецький дієприкметник; «слово» зберігає лексику й тематичний зв’язок уривка.
- source_word: εὐθὺς
  choice: відразу
  rationale: Звичний сучасний відповідник, який точно передає негайність реакції.
- source_word: μετὰ χαρᾶς
  choice: з радістю
  rationale: Природно передає прийменниковий зворот і зберігає іменник χαρά.
- source_word: λαμβάνων αὐτόν
  choice: приймає його
  rationale: У цьому контексті λαμβάνω означає прийняття почутого слова; займенник «його» однозначно узгоджується зі словом «слово».
theological_decisions:
- issue: Референт «посіяного» в поясненні притчі
  choice: 'Зберегти стислу метафору: «посіяний на кам’янистому ґрунті», а далі ототожнити його з тим, хто чує слово.'
  alternative: 'Розгорнути тлумачення: «насіння, посіяне на кам’янистому ґрунті, означає людину, яка…»'
  rationale: Грецький текст навмисно стискає образ, називаючи «посіяним» того, кого наступна частина визначає як слухача. Переклад не усуває цієї образної напруги пояснювальним перефразуванням.
translation_notes:
  register: Сучасна стандартна українська, природна й гідна. Збережено стислість грецької конструкції та кінцеву кому, оскільки вірш синтаксично продовжується далі.
