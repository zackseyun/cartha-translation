id: MAT.13.13
reference: Matthew 13:13
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἐν παραβολαῖς αὐτοῖς λαλῶ, ὅτι βλέποντες οὐ βλέπουσιν καὶ ἀκούοντες οὐκ ἀκούουσιν οὐδὲ συνίουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/013.yaml
  text: For this reason I speak to them in parables[a], because seeing they do not see, and hearing they do not hear, nor do they understand.
translation:
  language: uk
  text: Тому Я говорю до них притчами, бо, дивлячись, вони не бачать і, слухаючи, не чують та не розуміють.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Тому
  rationale: Природно й стисло передає причинно-висновковий зв’язок із попереднім контекстом, не посилюючи його понад грецький вислів.
- source_word: ἐν παραβολαῖς
  choice: притчами
  rationale: Український орудний відмінок природно виражає спосіб мовлення, відповідний грецькому ἐν із давальним.
- source_word: αὐτοῖς
  choice: до них
  rationale: Безпосередньо й природно позначає адресатів мовлення.
- source_word: λαλῶ
  choice: говорю
  rationale: Передає теперішній час і нейтральний зміст дієслова в сучасній літературній українській.
- source_word: ὅτι
  choice: бо
  rationale: Передає причинне значення сполучника в цьому контексті.
- source_word: βλέποντες οὐ βλέπουσιν
  choice: дивлячись, вони не бачать
  rationale: Зберігає формальну парадоксальність дієприкметникової конструкції, не додаючи явно вираженого допустового «хоч».
- source_word: ἀκούοντες οὐκ ἀκούουσιν
  choice: слухаючи, не чують
  rationale: Зберігає синтаксичний і риторичний паралелізм із попередньою частиною.
- source_word: οὐδὲ
  choice: та не
  rationale: Природно продовжує заперечний ряд українською без зміни його змісту.
- source_word: συνίουσιν
  choice: розуміють
  rationale: Чітко передає нездатність осягнути значення побаченого й почутого без додаткового доктринального уточнення.
theological_decisions:
- issue: Сила дієприкметників βλέποντες та ἀκούοντες
  choice: Формально передано як «дивлячись» і «слухаючи»
  alternative: «хоч дивляться» і «хоч слухають»
  rationale: Грецькі форми в контексті допускають допустове розуміння, однак воно не позначене окремим сполучником. Формальніша передача зберігає справжню неоднозначність і парадокс зовнішнього сприйняття без розуміння.
- issue: Значення συνίουσιν
  choice: «розуміють»
  alternative: «осягають» або «усвідомлюють»
  rationale: «Розуміють» охоплює інтелектуальне та внутрішнє схоплення сенсу, не додаючи твердження про причину чи міру їхньої несприйнятливості.
translation_notes:
  register: Сучасна стандартна українська; природний, гідний і доступний біблійний стиль. Збережено повтори «дивлячись — не бачать» та «слухаючи — не чують», важливі для риторики оригіналу.
