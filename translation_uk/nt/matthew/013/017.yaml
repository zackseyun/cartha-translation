  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν ὅτι πολλοὶ προφῆται καὶ δίκαιοι ἐπεθύμησαν ἰδεῖν ἃ βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/017.yaml
  text: For truly I say to you that many prophets and righteous people longed to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: uk
  text: 'Бо істинно кажу вам: багато пророків і праведників[a] прагнули побачити те, що бачите ви, та не побачили, і почути те, що чуєте ви, та не почули.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «праведних». Грецькою тут ужито прикметник у значенні іменника — тобто праведні люди.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: істинно
  rationale: У формулі ἀμὴν λέγω ὑμῖν це слово вводить урочисте й авторитетне запевнення. «Істинно» природно передає його силу українською, не вдаючись до транслітерації.
- source_word: γὰρ
  choice: бо
  rationale: Сполучник пояснює й обґрунтовує попередню думку; «бо» стисло й природно зберігає цей зв’язок.
- source_word: λέγω ὑμῖν
  choice: кажу вам
  rationale: Прямо відтворює усталену грецьку формулу й звучить природно в сучасній українській мові.
- source_word: πολλοὶ προφῆται καὶ δίκαιοι
  choice: багато пророків і праведників
  rationale: «Праведників» передає вжитий як іменник прикметник δίκαιοι та позначає ширше коло праведних людей поряд із пророками.
- source_word: ἐπεθύμησαν
  choice: прагнули
  rationale: Дієслово виражає сильне бажання; «прагнули» передає його інтенсивність без небажаних конотацій.
- source_word: ἃ βλέπετε
  choice: те, що бачите ви
  rationale: Зберігає невизначений у самому вірші об’єкт бачення, а кінцева позиція займенника природно підкреслює контраст між учнями та попередніми поколіннями.
- source_word: οὐκ εἶδαν
  choice: не побачили
  rationale: 'Негований аорист констатує історичний факт: вони не отримали бажаного бачення. Українською додатковий займенниковий об’єкт не потрібний.'
- source_word: ἃ ἀκούετε
  choice: те, що чуєте ви
  rationale: Відтворює паралель із баченням і не уточнює понад текст, що саме чують адресати.
- source_word: οὐκ ἤκουσαν
  choice: не почули
  rationale: Стисло передає негований аорист і зберігає синтаксичний паралелізм із «не побачили».
theological_decisions:
- issue: Обсяг значення δίκαιοι
  choice: «праведників» як окрема широка група поряд із пророками
  alternative: «праведних»
  rationale: Грецький прикметник ужито субстантивовано в множині. Український іменник «праведники» ясно передає людей, названих праведними, не звужуючи їх до самих пророків.
- issue: Що саме бачили й чули учні
  choice: 'Залишено неуточненим: «те, що бачите ви» і «те, що чуєте ви»'
  alternative: Уточнити як Месію, Царство або здійснення месіанських обітниць
  rationale: Контекст пов’язує слова з об’явленням Царства в служінні Ісуса, однак сам вірш називає об’єкти лише відносними конструкціями. Переклад не усуває цієї змістової відкритості.
translation_notes:
  register: Сучасна стандартна українська мова з урочистим, але доступним біблійним звучанням. Збережено паралелізм «побачити… і почути…» та контрастне наголошення займенника «ви» без штучного архаїзування.
