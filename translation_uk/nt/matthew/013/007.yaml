  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὰς ἀκάνθας, καὶ ἀνέβησαν αἱ ἄκανθαι καὶ ⸀ἔπνιξαν αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/007.yaml
  text: Other seeds fell among the thorns[a], and the thorns came up and choked them.
translation:
  language: uk
  text: А інше насіння впало серед тернини[a]. Тернина виросла й заглушила його.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально грецькою: «на тернину»; у цьому землеробському контексті природніше: «серед тернини».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: інше насіння
  rationale: Субстантивований прикметник середнього роду множини в контексті притчі стосується насіння. Українське збірне «насіння» природно передає цей неявний референт, а узгодження в однині відповідає нормам української мови.
- source_word: δὲ
  choice: А
  rationale: Тут δέ м’яко приєднує наступний епізод притчі; «А» природно продовжує перелік без надмірного протиставлення.
- source_word: ἔπεσεν
  choice: впало
  rationale: Безпосередньо передає аорист πίπτω — «падати», не замінюючи його більш тлумачним «було посіяне».
- source_word: ἐπὶ τὰς ἀκάνθας
  choice: серед тернини
  rationale: Хоча ἐπί з акузативом буквально може означати «на», в землеробському контексті йдеться про потрапляння насіння туди, де росла тернина; «серед» звучить природно українською.
- source_word: ἀκάνθας / ἄκανθαι
  choice: тернина
  rationale: «Тернина» природно позначає колючі бур’янисті рослини як сукупність і дозволяє зберегти повтор того самого грецького слова.
- source_word: ἀνέβησαν
  choice: виросла
  rationale: У контексті рослин ἀναβαίνω означає, що вони зійшли або піднялися в рості. «Виросла» природно передає розвиток тернини до стану, коли вона заглушила насіння.
- source_word: ἔπνιξαν
  choice: заглушила
  rationale: «Заглушити» є усталеним українським дієсловом про рослини, які, розростаючись, позбавляють інші рослини простору, світла й поживи; воно зберігає образ πνίγω без неприродного буквального «задушила».
- source_word: αὐτά
  choice: його
  rationale: Грецький займенник середнього роду множини стосується неявно названих зерен; українське збірне «насіння» граматично вимагає займенника однини «його».
theological_decisions: []
translation_notes:
  register: Сучасна нормативна українська мова, природна й гідна за стилем. Збережено повтор «тернина», відповідний повтору ἄκανθαι, та конкретне «впало» замість тлумачного «було посіяне».
