source:
  edition: SBLGNT
  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/050.yaml
  text: and they will throw them into the furnace of fire[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: uk
  text: І вкинуть їх у вогняну піч.[a] Там буде плач і скрегіт зубів.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «у піч вогню».'
    reason: lexical_alternative
lexical_decisions:
- source_word: βαλοῦσιν
  choice: вкинуть
  rationale: Майбутній час дієслова βάλλω передає силову дію «кинути / вкинути»; «вкинуть» природно сполучається з напрямком «у піч» і зберігає образ примусового відкинення.
- source_word: αὐτοὺς
  choice: їх
  rationale: Знахідний відмінок займенника чоловічого роду множини стосується лихих із попереднього контексту; українське «їх» точно й природно передає цей додаток.
- source_word: κάμινον τοῦ πυρός
  choice: вогняну піч
  rationale: Грецька конструкція буквально означає «піч вогню», однак українське «вогняна піч» природніше й без втрати передає конкретний образ печі, наповненої вогнем.
- source_word: ἐκεῖ
  choice: там
  rationale: Прислівник прямо вказує на місце покарання; «там» лаконічно зберігає його локальне й наголошене значення.
- source_word: ἔσται
  choice: буде
  rationale: Форма майбутнього часу εἰμί природно передається українським «буде» перед однорідними іменниками.
- source_word: ὁ κλαυθμὸς
  choice: плач
  rationale: κλαυθμός означає плач або ридання; «плач» точно передає значення, не посилюючи його понад грецький текст.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: скрегіт зубів
  rationale: «Скрегіт зубів» — точний, усталений і зрозумілий український відповідник матвіївського вислову, що зберігає образ страждання та суду.
theological_decisions:
- issue: Передача образів есхатологічного суду
  choice: Зберегти конкретні образи «вогняна піч», «плач» і «скрегіт зубів» без пом’якшення чи пояснювального розгортання.
  alternative: Перефразувати як «місце вогняної кари, де люди плакатимуть і скреготатимуть зубами від муки».
  rationale: Грецький текст подає образи суду без пояснення їхньої точної природи. Прямий переклад зберігає їхню силу, неоднозначність і богословську напругу, не додаючи доктринального тлумачення.
translation_notes:
  register: Сучасна нормативна українська мова з урочистим, але доступним біблійним звучанням. «Вкинуть» і «там буде» природні в контексті, а усталений вислів «скрегіт зубів» зберігає матвіївську образність.
