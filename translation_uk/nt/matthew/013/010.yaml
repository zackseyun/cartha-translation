  text: Then the disciples came up and said to him[a], “Why do you speak to them in parables?”
translation:
  language: uk
  text: 'Тоді учні підійшли й сказали Йому[a]: «Чому Ти говориш до них притчами?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «наблизилися й сказали Йому»; грецький дієприкметник підкреслює, що учні спочатку наблизилися до Ісуса, а тоді заговорили.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Тоді
  rationale: У цьому контексті καί просуває розповідь до наступної події; «тоді» природно передає послідовність, не додаючи нового змісту.
- source_word: προσελθόντες
  choice: підійшли
  rationale: Аористовий дієприкметник προσέρχομαι позначає наближення учнів до Ісуса перед тим, як вони заговорили; українське «підійшли» природно зберігає цей рух.
- source_word: οἱ μαθηταὶ
  choice: учні
  rationale: Означений артикль указує на вже відому з контексту групу; присвійне «Його» не додано, бо його немає в грецькому тексті.
- source_word: εἶπαν αὐτῷ
  choice: сказали Йому
  rationale: Формально передає дієслово λέγω та давальний займенник, водночас природно вводячи пряму питальну мову.
- source_word: Διὰ τί
  choice: Чому
  rationale: Звичайний і стислий український відповідник питального вислову зі значенням причини.
- source_word: ἐν παραβολαῖς
  choice: притчами
  rationale: Природний український орудний способу передає ἐν із давальним у значенні засобу або форми мовлення.
- source_word: λαλεῖς
  choice: Ти говориш
  rationale: Теперішній час і друга особа однини збережені; «говориш» є природним і точним відповідником у прямому запитанні.
- source_word: αὐτοῖς
  choice: до них
  rationale: Передає адресатів Ісусового мовлення; конструкція «говорити до когось» є нормативною й виразно позначає спрямованість слів.
