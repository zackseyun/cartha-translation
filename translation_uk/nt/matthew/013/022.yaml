  text: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων, καὶ ἡ μέριμνα τοῦ αἰῶνος ⸀τούτου καὶ ἡ ἀπάτη τοῦ πλούτου συμπνίγει τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/022.yaml
  text: And the one sown among the thorns—this is the one who hears the word[a], but the चिंता of this age and the deceitfulness of wealth choke the word[b], and he becomes unfruitful.
translation:
  language: uk
  text: А посіяний серед терну — це той, хто чує слово, і турботи цього віку[a] й оманливість багатства[b] заглушують слово, і він не приносить плоду.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «турботи цього світу». Буквально грецькою: «турбота цього віку».'
    reason: alternative_reading
  - marker: b
    text: 'Або: «омана багатства».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς
  choice: А посіяний серед терну
  rationale: Субстантивований дієприкметник чоловічого роду вказує на людину, представлену посіяним зерном. «Серед терну» природно передає образ насіння, що потрапило між колючі рослини.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: той, хто чує слово
  rationale: Відносне речення природно передає грецький дієприкметник теперішнього часу; «слово» зберігає усталене й контекстуально точне значення λόγος як звіщеної вістки.
- source_word: ἡ μέριμνα τοῦ αἰῶνος τούτου
  choice: турботи цього віку
  rationale: μέριμνα тут має негативний відтінок обтяжливих клопотів і тривог. Множина «турботи» природна українською для збірного змісту, а «цього віку» зберігає часовий і моральний відтінок αἰών.
- source_word: ἡ ἀπάτη τοῦ πλούτου
  choice: оманливість багатства
  rationale: Вислів передає не лише окрему оману, а властивість багатства вводити людину в оману. «Багатство» є сучасним і точним відповідником πλοῦτος.
- source_word: συμπνίγει
  choice: заглушують
  rationale: Дієслово описує, як терен стискає рослину й не дає їй рости. «Заглушують» природно зберігає сільськогосподарську метафору; множина узгоджується з двома однорідними підметами в українському реченні.
- source_word: ἄκαρπος γίνεται
  choice: він стає безплідним
  rationale: Особовий займенник відповідає поясненню про того, хто чує слово, і не створює враження, ніби безплідним стає саме слово.
theological_decisions:
- issue: Передача αἰών
  choice: цього віку
  alternative: цього світу
  rationale: «Вік» точніше зберігає значення епохи або ладу часу та властиву Новому Завіту напругу між теперішнім і прийдешнім віком. Звичніший контекстуальний варіант «світ» подано в примітці.
- issue: Особовий чи безособовий референт у завершальній частині
  choice: він стає безплідним
  alternative: воно стає безплідним; слово стає безплідним
  rationale: Хоч образ починається з посіяного зерна, пояснення прямо ототожнює його з людиною, яка чує слово. Особова форма зберігає цей перехід і не приписує безплідності самому слову.
translation_notes:
  register: Сучасна літературна українська з гідним, виразним біблійним звучанням. Синтаксис лишається доступним для усного читання; образи сіяння, заглушення та безплідності збережено без конфесійного уточнення.
