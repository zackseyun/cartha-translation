source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Διὰ τοῦτο πᾶς γραμματεὺς μαθητευθεὶς ⸂τῇ βασιλείᾳ⸃ τῶν οὐρανῶν ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐκβάλλει ἐκ τοῦ θησαυροῦ αὐτοῦ καινὰ καὶ παλαιά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/052.yaml
  text: Then he said to them[c][b][a], “Therefore every scribe who has been trained for the kingdom of heaven is like a master of a house who brings out of his treasure new things and old.”
translation:
  language: uk
  text: 'Тоді він сказав їм: «Тому кожен книжник, навчений для Царства Небесного[a], подібний до господаря дому[b], який виносить зі своєї скарбниці[c] нове й старе».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «який став учнем Царства Небесного». Грецький дієприкметник може означати як те, що особу було навчено, так і те, що її зроблено учнем.'
    reason: alternative_reading
  - marker: b
    text: 'Або: «голова домогосподарства». Йдеться про людину, яка очолює дім і розпоряджається його майном.'
    reason: lexical_alternative
  - marker: c
    text: Грецьке слово може означати і скарб, і місце його зберігання — сховище або скарбницю.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Тому
  rationale: Природний український висновковий сполучник, що зберігає логічний зв’язок із попередньою розмовою.
- source_word: πᾶς γραμματεὺς
  choice: кожен книжник
  rationale: «Книжник» прямо передає назву знавця й учителя Писання та є усталеним і зрозумілим біблійним терміном в українській мові.
- source_word: μαθητευθεὶς
  choice: навчений
  rationale: Пасивний дієприкметник передає формування через навчання, не звужуючи значення лише до набуття статусу учня; можливий учнівський відтінок зазначено у примітці.
- source_word: τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: для Небесного Царства
  rationale: Передає незвичний давальний відмінок як спрямованість або призначення, не визначаючи точніше неоднозначний зв’язок між навчанням і Царством.
- source_word: ὅμοιός ἐστιν
  choice: подібний до
  rationale: Природна українська формула порівняння, що точно передає мову уподібнення.
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: господаря дому
  rationale: Передає людину, яка очолює дім і розпоряджається його запасами, без анахронічного звуження до юридичного власника нерухомості.
- source_word: ἐκβάλλει
  choice: виносить
  rationale: У контексті скарбниці дієслово означає винесення назовні; цей відповідник природний і не створює недоречного відтінку насильного викидання.
- source_word: ἐκ τοῦ θησαυροῦ αὐτοῦ
  choice: зі своєї скарбниці
  rationale: '«Скарбниця» зберігає обидва відтінки θησαυρός: цінний скарб і місце його зберігання.'
- source_word: καινὰ καὶ παλαιά
  choice: нове й старе
  rationale: Субстантивовані прикметники природно передано українськими формами середнього роду зі збереженням грецького порядку.
theological_decisions:
- issue: Значення μαθητευθεὶς стосовно книжника й Небесного Царства
  choice: Книжник, навчений і сформований для Небесного Царства
  alternative: Книжник, який став учнем Небесного Царства
  rationale: Основний текст передає пасивне навчання та спрямованість до Царства, а примітка зберігає можливий виразніший сенс учнівства. Переклад не звужує вислів до навернення чи професійної богословської освіти.
- issue: Образ οἰκοδεσπότης
  choice: господар дому
  alternative: голова домогосподарства
  rationale: Обраний вислів зберігає роль особи, яка керує домом і його майном, не додаючи до метафори пізніших доктринальних або соціальних висновків.
translation_notes:
  register: Сучасна стандартна українська мова з гідним, виразним біблійним регістром. Синтаксис простий і придатний для читання вголос; усталене «книжник» збережено, а неоднозначність вислову про учнівство та Небесне Царство винесено в примітку.
