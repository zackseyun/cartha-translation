  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τοῦ προφήτου λέγοντος· Ἀνοίξω ἐν παραβολαῖς τὸ στόμα μου, ἐρεύξομαι κεκρυμμένα ἀπὸ ⸀καταβολῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/035.yaml
  text: 'so that what was spoken through the prophet might be fulfilled[a], saying: “I will open my mouth in parables; I will utter things hidden from the foundation of the world.”'
translation:
  language: uk
  text: 'щоб здійснилося сказане через пророка, який говорить: «Відкрию уста Мої в притчах, виповім приховане від заснування[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'У деяких рукописах: «від заснування світу».'
    reason: textual_variant
lexical_decisions:
- source_word: ὅπως πληρωθῇ
  choice: щоб здійснилося
  rationale: Передає цільово-наслідковий зв’язок і усталену в Матвія формулу здійснення пророчого слова, не перевантажуючи український текст нюансами грецького кон’юнктива.
- source_word: τὸ ῥηθὲν διὰ τοῦ προφήτου
  choice: сказане через пророка
  rationale: Дієприкметникова конструкція природно передана субстантивованим «сказане», а διά з родовим відмінком — прийменником «через», що зберігає думку про пророка як посередника.
- source_word: λέγοντος
  choice: який говорить
  rationale: Збережено явний вступ до цитати в теперішньому часі, природний для формули цитування Писання.
- source_word: Ἀνοίξω ἐν παραβολαῖς τὸ στόμα μου
  choice: Відкрию уста Мої в притчах
  rationale: Збережено поетичний образ і ключовий для розділу термін «притчі»; «уста» відповідає піднесеному регістру цитати.
- source_word: ἐρεύξομαι
  choice: виповім
  rationale: Дієслово позначає винесення назовні, висловлення прихованого; «виповім» зберігає поетичну силу без грубого буквального відтінку.
- source_word: κεκρυμμένα
  choice: приховане
  rationale: Субстантивований перфектний пасивний дієприкметник передано без додавання іменника «таємниці», зберігаючи результативний стан прихованості.
- source_word: ἀπὸ καταβολῆς
  choice: від заснування
  rationale: У поданому тексті SBLGNT немає слова κόσμου («світу»), тому основний текст не додає його, попри дещо незвичну для української еліптичність вислову.
theological_decisions:
- issue: Ідентифікація пророка в формулі цитування
  choice: через пророка
  alternative: через Асафа-пророка
  rationale: Поданий грецький текст не називає пророка на ім’я, тому переклад не розширює формулу, хоча цитата походить із Псалма 78:2.
- issue: Обсяг вислову ἀπὸ καταβολῆς
  choice: від заснування
  alternative: від заснування світу
  rationale: Основний текст відтворює коротше читання поданого грецького джерела, а повніше рукописне читання подано в примітці, не усуваючи текстологічної неоднозначності.
translation_notes:
  register: Сучасна нормативна українська мова з помірно піднесеним поетичним регістром біблійної цитати. Інверсію «уста Мої» збережено для ритму й урочистості; архаїчних граматичних форм уникнуто.
