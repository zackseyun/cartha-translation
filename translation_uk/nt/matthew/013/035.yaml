  source_fidelity: Текст точно передає ὅπως πληρωθῇ як «щоб здійснилося», зберігає посередницьке «через пророка», форму цитування та майбутні форми в цитаті. «Виповім приховане» адекватно передає образне ἐρεύξομαι й субстантивований κεκρυμμένα. Коротке «від заснування» в основному тексті правильно відтворює SBLGNT без додавання κόσμου.
  naturalness: Український текст нормативний і читабельний. «Уста Мої» та «виповім» доречно підтримують піднесений поетичний регістр біблійної цитати. «Який говорить» є прийнятним теперішнім часом формули введення цитати.
  terminology: «Притчі» послідовно передає παραβολαῖς. «Здійснилося сказане» природно передає матеївську формулу сповнення, не вносячи зайвого тлумачення. Текстологічна примітка коректно відділяє повніше читання «від заснування світу» від коротшого основного тексту.
