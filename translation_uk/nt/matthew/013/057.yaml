base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/057.yaml
  text: And they took offense at him[a]. But Jesus said to them[c][b], “A prophet is not without honor except in his hometown and in his own household.”
translation:
  language: uk
  text: 'І вони ображалися на Нього[a]. Та Ісус сказав їм: «Пророк не буває без пошани, крім свого рідного краю[b] та свого дому[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «вони обурювалися через Нього»; буквально: «вони спотикалися через Нього».'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «своєї батьківщини» чи «своєї рідної місцевості».'
    reason: lexical_alternative
  - marker: c
    text: 'Або: «своєї родини». Грецьке слово може означати як дім, так і домашнє чи сімейне коло.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: ображалися на Нього
  rationale: Природно передає в цьому контексті неприйняття й негативну реакцію на Ісуса, тоді як буквальне «спотикалися через Нього» в сучасній українській може помилково сприйматися фізично. Образний складник збережено у примітці.
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Та Ісус сказав їм
  rationale: «Та» природно передає легке протиставлення, виражене δέ, і поворот від реакції людей до відповіді Ісуса.
- source_word: προφήτης
  choice: пророк
  rationale: Усталений прямий відповідник, який зберігає впізнавану форму прислів’я.
- source_word: ἄτιμος
  choice: без пошани
  rationale: Зберігає тему честі й безчестя та заперечну риторичну форму грецького вислову.
- source_word: εἰ μὴ
  choice: крім
  rationale: Природний український відповідник у конструкції винятку.
- source_word: πατρίδι
  choice: свого рідного краю
  rationale: Передає рідну місцевість людини, не звужуючи значення неодмінно до міста й не розширюючи його неодмінно до держави.
- source_word: οἰκίᾳ αὐτοῦ
  choice: свого дому
  rationale: «Дім» в українській, як і οἰκία в грецькій, може означати і житло, і домашнє чи сімейне коло, тому доречно зберігає неоднозначність.
theological_decisions:
- issue: Обсяг Ісусового прислів’я про неприйняття пророка
  choice: Передати його як загальне прислів’я про брак пошани до пророка в його рідному середовищі.
  alternative: Витлумачити вислів конкретно як твердження про невіру родичів Ісуса.
  rationale: Грецький текст формулює загальний вислів і не пояснює тут докладніше характер неприйняття; переклад не повинен додавати вужчого богословського тлумачення.
translation_notes:
  register: Сучасна літературна українська, природна й гідна за тоном. Синтаксис прислів’я дещо впорядковано для ясності українською, водночас збережено заперечну форму «не буває без пошани» та неоднозначність слова «дім».
