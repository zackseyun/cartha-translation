id: MAT.13.31
reference: Matthew 13:31
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν κόκκῳ σινάπεως, ὃν λαβὼν ἄνθρωπος ἔσπειρεν ἐν τῷ ἀγρῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/031.yaml
  text: He set another parable before them, saying, “The kingdom of heaven is like a mustard seed, which a man took and sowed in his field.”
translation:
  language: uk
  text: 'Іншу притчу Він подав їм, кажучи: «Царство Небесне подібне до гірчичного зерна, яке чоловік узяв і посіяв на своєму полі».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέθηκεν
  choice: подав
  rationale: У цьому контексті дієслово означає викласти або представити притчу слухачам; «подав їм» природно передає образ поставленого перед аудиторією повчання.
- source_word: παραβολὴν
  choice: притчу
  rationale: «Притча» — усталений і точний український жанровий відповідник у синоптичному контексті.
- source_word: Ὁμοία ἐστὶν
  choice: подібне до
  rationale: Природна українська формула порівняння, що точно передає грецький вислів.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Царство Небесне
  rationale: Усталений український відповідник характерного для Матвія вислову; зберігає широту значення царювання і царства, не звужуючи його лише до абстрактного правління.
- source_word: κόκκῳ σινάπεως
  choice: гірчичного зерна
  rationale: Природний і традиційний український відповідник назви малого зерна, використаного в порівнянні.
- source_word: ὃν λαβὼν ἄνθρωπος
  choice: яке чоловік узяв
  rationale: Збережено окремого діяча чоловічого роду, а грецький дієприкметник природно передано особовою формою дієслова.
- source_word: ἔσπειρεν
  choice: посіяв
  rationale: Точно передає дію висівання насіння й є доречнішим за ширше «посадив».
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: на своєму полі
  rationale: Українською сіють «на полі»; зворотний присвійний займенник «своєму» природно й однозначно відносить поле до діяча.
theological_decisions:
- issue: Передача Матвієвого вислову βασιλεία τῶν οὐρανῶν
  choice: Царство Небесне
  alternative: небесне царювання; Царство небес
  rationale: Усталена форма зберігає ключовий богословський термін Матвія і не вирішує штучно, чи наголос тут падає на сферу царства, чи на саме царювання Бога.
translation_notes:
  register: Сучасна літературна українська з гідним біблійним регістром. Синтаксис лишається близьким до грецького, але природним для українського читача; великими літерами в «Царство Небесне» позначено усталений сакральний термін.
