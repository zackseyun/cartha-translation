  text: 'І Він багато говорив їм притчами, кажучи: «Ось вийшов сіяч сіяти».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλάλησεν
  choice: говорив
  rationale: Природний український відповідник у контексті тривалішого повчання; форма «багато говорив» передає аорист із додатком πολλὰ без штучної буквальності.
- source_word: παραβολαῖς
  choice: притчами
  rationale: Усталений і точний український відповідник для образних повчальних оповідей Ісуса.
- source_word: Ἰδοὺ
  choice: Ось
  rationale: Передає заклик звернути увагу природною сучасною українською мовою, без архаїчного «се».
- source_word: ὁ σπείρων
  choice: сіяч
  rationale: Субстантивований дієприкметник природно передано назвою особи, яка сіє.
- source_word: τοῦ σπείρειν
  choice: сіяти
  rationale: Інфінітив мети передано природною українською конструкцією «вийшов ... сіяти».
