base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/029.yaml
  text: But he said[a], ‘No, lest while gathering the weeds you uproot the wheat along with them.’
translation:
  language: uk
  text: 'А він сказав: «Ні, щоб ви, збираючи бур’ян[a], не вирвали разом із ними й пшеницю з корінням».'
  philosophy: optimal-equivalence
  footnotes:
