    reason: lexical_alternative
lexical_decisions:
- source_word: φησιν
  choice: сказав
  rationale: Грецький історичний теперішній час у природній українській оповіді доречно передати минулим часом.
- source_word: Οὔ
  choice: Ні
  rationale: Пряма й природна передача заперечної відповіді.
- source_word: μήποτε
  choice: щоб ... не
  rationale: Передає застереження щодо небажаного можливого наслідку.
- source_word: συλλέγοντες
  choice: збираючи
  rationale: Дієприслівник природно відтворює одночасність дії з можливим вириванням.
- source_word: ζιζάνια
  choice: бур’ян
  rationale: Зрозумілий сучасний відповідник; конкретніша можлива ідентифікація рослини подана у примітці.
- source_word: ἐκριζώσητε
  choice: вирвали
  rationale: У контексті рослин дієслово природно означає вирвати з корінням; українське «вирвати» передає це без важкого формулювання.
- source_word: ἅμα αὐτοῖς
  choice: разом із ним
  rationale: Займенник узгоджено з українським збірним іменником «бур’ян», зберігаючи значення спільного видалення.
- source_word: σῖτον
  choice: пшеницю
  rationale: У цьому землеробському контексті й у протиставленні бур’яну йдеться саме про пшеницю.
theological_decisions:
- issue: Передача ζιζάνια у відомій притчі
  choice: бур’ян
  alternative: кукіль; райграс п’янкий
  rationale: Основний текст має бути зрозумілим сучасному читачеві й не стверджувати точну ботанічну ідентифікацію, якої грецьке слово не встановлює беззаперечно. Традиційний і конкретніший варіанти збережено у примітці.
translation_notes:
  register: Сучасна стандартна українська, природна оповідна синтаксична будова й гідний, загальнозрозумілий стиль. Зворот «щоб ... не» зберігає попереджувальну силу μήποτε, не усуваючи можливісного характеру наслідку.
