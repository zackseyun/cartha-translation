  source_fidelity: 'Основний зміст передано точно: заперечна відповідь, застереження про можливе виривання пшениці під час збирання ζιζάνια, а також спільність дії збережено. Проте «разом із ним» граматично відсилає до однини «бур’ян», тоді як αὐτοῖς має множину й стосується зібраних бур’янів; «разом із ними» точніше відтворює оригінал. Також «вирвати з корінням» виразніше передає ἐκριζόω.'
