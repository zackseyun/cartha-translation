source:
  edition: SBLGNT
  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/042.yaml
  text: and they will throw them into the furnace of fire[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: uk
  text: і вкинуть їх у вогненну піч. Там буде плач і скрегіт зубів.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: і
  rationale: Збережено простий сполучник, що пов’язує цей вислів із попереднім контекстом.
- source_word: βαλοῦσιν
  choice: вкинуть
  rationale: Дієслово передає сильну, примусову дію кидання всередину; «вкинуть» природно сполучається з напрямком «у піч».
- source_word: αὐτοὺς
  choice: їх
  rationale: Прямий відповідник займенника в знахідному відмінку множини без уточнення його антецедента.
- source_word: κάμινον τοῦ πυρός
  choice: вогненну піч
  rationale: Природний український атрибутивний відповідник грецької родової конструкції, який зберігає конкретний образ печі й вогню.
- source_word: ἐκεῖ
  choice: Там
  rationale: Стислий і точний локативний відповідник, що вказує на щойно назване місце.
- source_word: κλαυθμὸς
  choice: плач
  rationale: Звичний і точний відповідник, який не звужує значення до тихого плачу чи лише голосіння.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: скрегіт зубів
  rationale: Усталений природний український відповідник біблійного вислову, що зберігає його образність без тлумачного звуження.
theological_decisions:
- issue: Образ есхатологічного суду у вислові κάμινον τοῦ πυρός
  choice: Збережено конкретну метафору «вогненна піч».
  alternative: Тлумачно передати як «пекельний вогонь» або посилити як «піч із палаючим вогнем».
  rationale: Грецький текст дає образ печі та вогню, але не вживає пізнішого доктринального терміна; переклад не пом’якшує і не конкретизує образ понад джерело.
- issue: Значення формули «плач і скрегіт зубів»
  choice: Формулу збережено без пояснення причини або характеру страждання.
  alternative: Передати скрегіт винятково як лють або весь вислів винятково як скорботу.
  rationale: Вислів передає тяжке страждання в контексті суду, але сам по собі не вимагає звужувати його до однієї емоції.
translation_notes:
  register: Сучасна стандартна українська мова; виклад стислий, гідний і природний. Початкове «і» збережене для зв’язку з попереднім реченням. Архаїчних форм і конфесійно навантажених уточнень немає.
