review_pass:
  verdict: approve
  source_fidelity: '«І вкинуть їх у вогненну піч» точно передає καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός: майбутню дію, займенниковий додаток, напрямок і конкретний образ печі з вогнем. «Там буде плач і скрегіт зубів» зберігає ἐκεῖ та усталену Матвієву формулу без тлумачного звуження.'
  naturalness: Текст стислий, природний для сучасної стандартної української та має належний біблійно-урочистий, але не архаїчний регістр. «Вогненна піч», «плач» і «скрегіт зубів» є ясними й ідіоматичними відповідниками.
  terminology: Ключова образність суду збережена без внесення доктринального терміна «пекло». «Скрегіт зубів» точно передає βρυγμὸς τῶν ὀδόντων і не визначає наперед, чи йдеться лише про горе або лише про гнів. Український текст не потребує перенесення англійських приміток, оскільки вони відображають англійські стилістичні варіанти, а не неоднозначність, яку слід позначати тут.
