  yaml_path: translation/nt/matthew/013/002.yaml
  text: And large crowds gathered to him[a], so that he got into a boat and sat down[b], and the whole crowd stood on the shore.
translation:
  language: uk
  text: І зібралося до Нього багато людей, тож Він увійшов у човен і сів, а весь натовп стояв на березі.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήχθησαν πρὸς αὐτὸν ὄχλοι πολλοί
  choice: зібралося до Нього багато людей
  rationale: Пасивна форма συνήχθησαν природно передається українським зворотним дієсловом «зібралося»; πρὸς αὐτόν зберігає напрямок руху «до Нього». Замість неприродного «численні натовпи» вжито звичне «багато людей», тоді як наступне речення називає їх сукупно натовпом.
- source_word: ὥστε
  choice: тож
  rationale: Передає наслідок скупчення людей стисло й природно; не надає вислову навмисної мети.
- source_word: εἰς πλοῖον ἐμβάντα καθῆσθαι
  choice: увійшов у човен і сів
  rationale: Дієприкметниково-інфінітивну конструкцію передано послідовними особовими дієсловами, природними для української оповіді. «Увійшов у човен» точно виражає посадку без розмовного відтінку.
- source_word: πᾶς ὁ ὄχλος
  choice: весь натовп
  rationale: Збережено перехід грецького тексту від множинної згадки про людей до колективного однинового позначення.
- source_word: ἐπὶ τὸν αἰγιαλὸν εἱστήκει
  choice: стояв на березі
  rationale: «Берег» є нейтральним відповідником αἰγιαλός, а «стояв» природно передає тривалий стан, виражений формою εἱστήκει.
theological_decisions: []
