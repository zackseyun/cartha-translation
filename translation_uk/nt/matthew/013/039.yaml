  source_fidelity: 'Текст точно передає всі складники грецького оригіналу: «ворог» відповідає ἐχθρός, означальне «який посіяв їх» — ὁ σπείρας αὐτά, «диявол» — ὁ διάβολος, а «женці — ангели» правильно відтворює θερισταὶ ἄγγελοί εἰσιν. «Кінець віку» адекватно передає συντέλεια αἰῶνος, не звужуючи αἰών до матеріального «світу».'
