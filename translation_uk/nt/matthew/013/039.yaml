  text: ὁ δὲ ἐχθρὸς ὁ σπείρας αὐτά ἐστιν ὁ διάβολος· ὁ δὲ θερισμὸς συντέλεια ⸀αἰῶνός ἐστιν, οἱ δὲ θερισταὶ ἄγγελοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/039.yaml
  text: And the enemy who sowed them is the devil; the harvest is the end of the age[a], and the harvesters are angels.
translation:
  language: uk
  text: А ворог, який посіяв їх, — диявол; жнива — кінець віку[a], а женці — ангели.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «завершення віку»; традиційно — «кінець світу».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχθρὸς
  choice: ворог
  rationale: Природний і точний відповідник, що зберігає особистий характер протистояння в поясненні притчі.
- source_word: ὁ σπείρας
  choice: який посіяв
  rationale: Передає означальний дієприкметник і завершену дію, зберігаючи сільськогосподарський образ сіяння.
- source_word: αὐτά
  choice: їх
  rationale: Займенник природно відсилає до раніше згаданого бур’яну; граматична форма узгоджена з українським відповідником у контексті притчі.
- source_word: διάβολος
  choice: диявол
  rationale: У цьому контексті слово є усталеним особовим найменуванням, а не загальним означенням наклепника.
- source_word: θερισμός
  choice: жнива
  rationale: Звичний сучасний відповідник, який точно зберігає аграрний образ притчі.
- source_word: συντέλεια αἰῶνος
  choice: кінець віку
  rationale: «Вік» передає часово-есхатологічний зміст αἰών точніше, ніж «світ», а «кінець» природно виражає завершення або доведення періоду до його межі.
- source_word: θερισταί
  choice: женці
  rationale: Точний, зрозумілий і стилістично відповідний називник осіб, які жнуть.
- source_word: ἄγγελοι
  choice: ангели
  rationale: Есхатологічний контекст указує на небесних істот, тому «ангели» точніше за загальне «посланці».
- source_word: δέ
  choice: а / пунктуаційний перехід
  rationale: Повторюване δέ структурує послідовні частини пояснення; українське «а» природно позначає зіставлення й перехід між ними.
theological_decisions:
- issue: Передача αἰών у вислові συντέλεια αἰῶνος
  choice: кінець віку
  alternative: завершення віку; кінець світу
  rationale: «Кінець віку» зберігає часовий есхатологічний сенс грецького вислову й не нав’язує думки про матеріальне знищення світу. «Завершення віку» точніше відбиває відтінок συντέλεια, але менш природне в основному тексті; традиційне «кінець світу» ширше за значенням.
translation_notes:
  register: Сучасна стандартна українська мова; виклад стислий, гідний і природний. Іменні присудки оформлено тире, а повторюване δέ передано сполучником «а» та пунктуацією.
