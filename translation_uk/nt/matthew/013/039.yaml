  terminology: «Диявол» та «ангели» є усталеними й контекстуально точними термінами. «Вік» слушно зберігає часовий, а не космологічний зміст αἰών. Примітка належно подає «завершення віку» як можливий ближчий лексичний відповідник і позначає традиційне «кінець світу» без ототожнення його з основним перекладом.
