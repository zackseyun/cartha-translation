  source_fidelity: Грецьке τοῦ σπείραντος — артикльований аористовий дієприкметник, буквально «того, хто посіяв / сіяв», однак у контексті це звичне позначення діяча притчі, тобто сіяча. Зв’язок із παραβολήν природно передається українським «притча про».
