  text: Тож ви послухайте притчу про сіяча.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або, дослівніше: «притчу про того, хто сіяв».'
    reason: Буквальніше передання артикльованого аористового дієприкметника τοῦ σπείραντος; основний текст уживає природний український відповідник «сіяч».
lexical_decisions:
- source_word: Ὑμεῖς
  choice: ви
  rationale: Особовий займенник у грецькому тексті вжито явно й наголошено; українське «ви» зберігає цей акцент.
- source_word: οὖν
  choice: тож
  rationale: «Тож» природно передає висновковий або перехідний зв’язок із попередніми словами.
- source_word: ἀκούσατε
  choice: послухайте
  rationale: Форма є наказовим способом другої особи множини. «Послухайте» зберігає заклик уважно слухати, не додаючи значення «зрозумійте».
- source_word: παραβολὴν
  choice: притчу
  rationale: «Притча» — усталений і точний відповідник παραβολή в контексті синоптичного вчення.
- source_word: τοῦ σπείραντος
  choice: про того, хто сіяв
  rationale: Артикльований аористовий дієприкметник буквально позначає «того, хто сіяв». Прийменник «про» природно передає українською зв’язок із «притчею», не перетворюючи вислів неодмінно на усталену назву «сіяч».
