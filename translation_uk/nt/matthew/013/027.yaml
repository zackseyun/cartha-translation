id: MAT.13.27
reference: Matthew 13:27
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: προσελθόντες δὲ οἱ δοῦλοι τοῦ οἰκοδεσπότου εἶπον αὐτῷ· Κύριε, οὐχὶ καλὸν σπέρμα ⸀ἔσπειρας ἐν τῷ σῷ ἀγρῷ; πόθεν οὖν ἔχει ζιζάνια;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/027.yaml
  text: So the slaves of the master of the house came to him and said[a], ‘Lord, did you not sow good seed in your field? Where then do the weeds come from?’
translation:
  language: uk
  text: 'Тоді раби господаря дому підійшли до нього й сказали: «Господарю, хіба не добре насіння ти посіяв на своєму полі? Звідки ж на ньому взялися бур’яни[a]?».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «кукіль»; грецьке слово, ймовірно, означає пажитницю п’янку — бур’ян, який на ранніх стадіях росту схожий на пшеницю.
    reason: Лексична альтернатива й уточнення ймовірного виду рослини.
lexical_decisions:
- source_word: προσελθόντες
  choice: підійшли до нього
  rationale: Дієприкметник аориста передає дію, що передує словам рабів; українське «підійшли до нього й сказали» природно зберігає рух у напрямку до господаря.
- source_word: δοῦλοι
  choice: раби
  rationale: У контексті господарського дому слово позначає залежних людей під владою господаря; «раби» прозоро передає їхній соціальний статус, не пом’якшуючи значення до загального «слуги».
- source_word: οἰκοδεσπότου
  choice: господаря дому
  rationale: Зберігає складене значення «господар дому» та зв’язок влади господаря з рабами; звучить природніше за кальковані варіанти.
- source_word: Κύριε
  choice: Господарю
  rationale: У цій притчевій розмові це шанобливе звертання рабів до власника дому й поля. «Господарю» природно передає контекстуальне значення, не створюючи тут зайвої прямої христологічної конотації.
- source_word: οὐχὶ
  choice: хіба не
  rationale: Питальна конструкція очікує ствердної відповіді; «хіба не» точно й природно передає цю силу українською.
- source_word: καλὸν σπέρμα
  choice: добре насіння
  rationale: Прямий і звичний український відповідник у сільськогосподарському контексті.
- source_word: ἔσπειρας
  choice: посіяв
  rationale: Точно передає спеціальне сільськогосподарське значення σπείρω та форму минулого часу.
- source_word: ἐν τῷ σῷ ἀγρῷ
  choice: на своєму полі
  rationale: Українською насіння природно сіють «на полі»; зворотний займенник «своєму» однозначно відносить поле до підмета «ти».
- source_word: πόθεν οὖν
  choice: Звідки ж
  rationale: «Звідки» зберігає питання про походження, а частка «ж» природно передає висновковий зв’язок οὖν.
- source_word: ἔχει
  choice: на ньому
  rationale: Грецьке речення буквально приписує полю наявність бур’яну. Українська бездієслівна конструкція «звідки ж на ньому бур’ян?» природно зберігає поле як місце його появи, не приписуючи тексту окремого дієслова руху.
- source_word: ζιζάνια
  choice: бур’ян
  rationale: Зрозумілий сучасний збірний відповідник для шкідливих рослин серед посіву; ймовірну конкретну рослину зазначено у примітці.
theological_decisions:
- issue: Передача δοῦλοι у притчевому домашньо-господарському контексті
  choice: раби
  alternative: слуги
  rationale: Текст не формулює вчення про рабство, однак називає осіб, залежних від господаря. «Раби» зберігає соціальну реалію грецького слова, тоді як «слуги» може її послабити.
- issue: Передача κύριε як звертання до господаря в притчі
  choice: Господарю
  alternative: Господи
  rationale: Тут слово функціонує як звертання рабів до земного господаря. «Господарю» зберігає цю роль і не усуває ширшої двозначності κύριος в інших контекстах, де доречне «Господь».
translation_notes:
  register: Сучасна літературна українська, природна й гідна за тоном. Порядок дій та риторичне питання збережено; буквальність останньої грецької конструкції передано без неприродного українського вислову.
