  source_fidelity: «Відпадає» в контексті притчі добре передає наслідок σκανδαλίζεται, а примітка слушно зберігає буквальніші можливості. «Через слово» точно відтворює διὰ τὸν λόγον. Проте πρόσκαιρός означає «лише на деякий час / нетривалий», і характеристика «сам — нетривкий» щодо людини звучить неприродно та дещо неясно.
