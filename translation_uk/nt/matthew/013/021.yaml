  text: οὐκ ἔχει δὲ ῥίζαν ἐν ἑαυτῷ ἀλλὰ πρόσκαιρός ἐστιν, γενομένης δὲ θλίψεως ἢ διωγμοῦ διὰ τὸν λόγον εὐθὺς σκανδαλίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/021.yaml
  text: Yet he has no root in himself[a], but is temporary. When affliction or persecution arises because of the word[b], he immediately falls away.
translation:
  language: uk
  text: Та він не має в собі кореня, а тримається лише деякий час. Коли ж через слово настає утиск або переслідування, він відразу відпадає[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «спотикається» чи «обурюється»; грецьке дієслово може означати бути спонуканим до спотикання або зазнати образи.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζαν ἐν ἑαυτῷ
  choice: кореня в собі
  rationale: Збережено сільськогосподарський образ кореня та зворотне значення вислову без додаткового тлумачення.
- source_word: πρόσκαιρός
  choice: нетривкий
  rationale: Природно характеризує людину, яка тримається лише певний час; уникає неприродного щодо особи слова «тимчасовий».
- source_word: γενομένης ... θλίψεως ἢ διωγμοῦ
  choice: коли ... настає утиск або переслідування
  rationale: Родовий абсолют передано часовою конструкцією; «утиск» зберігає значення тиску й тяжких обставин, а «переслідування» точно передає цілеспрямовану ворожість.
- source_word: διὰ τὸν λόγον
  choice: через слово
  rationale: Збережено лексичний зв’язок із λόγος та євангельський образ проголошеного слова; контекст притчі пояснює, що йдеться про звістку.
- source_word: εὐθὺς
  choice: відразу
  rationale: Природний сучасний відповідник, який передає наголошену негайність реакції.
- source_word: σκανδαλίζεται
  choice: відпадає
  rationale: У контексті початкового прийняття слова та подальшої неспроможності вистояти це природно передає наслідок, не визначаючи докладної доктрини відступництва; ширше значення дієслова зазначено у примітці.
theological_decisions:
- issue: Значення σκανδαλίζεται в контексті учнівства
  choice: відпадає
  alternative: спотикається; дає себе збити зі шляху; обурюється
  rationale: Контекст указує на зрив вірності під тиском, тому «відпадає» ясно передає результат. Примітка зберігає ширший образ спотикання та можливий відтінок образи, не нав’язуючи певної системи щодо відступництва.
translation_notes:
  register: Сучасна, гідна й доступна українська мова. Образ кореня та повторюваний у притчі вислів «слово» збережено; синтаксис поділено на два речення задля природного читання.
