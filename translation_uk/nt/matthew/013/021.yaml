  terminology: «Корінь», «слово», «утиск», «переслідування» та «відпадає» відповідають регістрові й лексиці притчі. У примітці «зазнає спокуси» не додається, оскільки це вже інтерпретаційне звуження; «спотикається» та «обурюється» достатньо представляють лексичний діапазон.
