  text: He answered[a], “The one who sows the good seed is the Son of Man.”
translation:
  language: uk
  text: 'Він же відповів: «Той, хто сіє добре насіння, — це Син Людський[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або, дослівніше, «Син людини». Грецький титул «Син Людський» перегукується із сьомим розділом книги Даниїла; тут збережено його усталену євангельську форму та богословське звучання.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: Він же відповів
  rationale: Дієприкметник ἀποκριθείς і особова форма εἶπεν разом утворюють звичну грецьку формулу введення відповіді. Українське «відповів» природно передає її без неприродного дублювання «відповівши, сказав», а «же» відбиває зв’язок, виражений δέ.
- source_word: Ὁ σπείρων
  choice: Той, хто сіє
  rationale: Субстантивований дієприкметник теперішнього часу називає особу за її дією. Такий переклад зберігає дієслівний характер вислову й звучить природно сучасною українською.
- source_word: τὸ καλὸν σπέρμα
  choice: добре насіння
  rationale: У цьому контексті καλός означає якісно добре або належне, а не лише гарне на вигляд. «Насіння» природно передає грецьку збірну однину.
- source_word: ἐστὶν
  choice: — це
  rationale: Зв’язка «— це» ясно й природно передає ототожнення сіяча із Сином Людським у поясненні притчі.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Син Людський
  rationale: Це усталений український відповідник євангельського титулу Ісуса, який зберігає його зв’язок із образом у Даниїла 7 та не зводить вислів до загального позначення людини.
theological_decisions:
- issue: Передача христологічного титулу ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Син Людський
  alternative: Людський Син; Людина
  rationale: «Син Людський» є усталеним і зрозумілим біблійним титулом українською та зберігає канонічний і апокаліптичний відгомін вислову. Буквальніше «Людський Син» неприродне українською, а «Людина» надто однозначно перетлумачує титул.
translation_notes:
  register: Сучасна стандартна українська мова; виклад природний і гідний, без архаїзмів. Формулу введення прямої мови стисло передано як «Він же відповів», а традиційний титул «Син Людський» збережено через його міжтекстове значення.
