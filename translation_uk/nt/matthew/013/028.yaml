base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/028.yaml
  text: He said to them[a], “An enemy did this.” Then the slaves said to him, “Do you want us to go and gather them up?”
translation:
  language: uk
  text: 'Він же сказав їм: «Це зробив ворог». Тоді раби[a] сказали йому: «То хочеш, щоб ми пішли й позбирали їх?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «слуги». Грецьке слово δοῦλοι може означати «раби» або «слуги» залежно від контексту.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη
  choice: сказав
  rationale: Звичайне дієслово мовлення; у розповідному діалозі природно передається доконаним минулим часом.
- source_word: Ἐχθρὸς ἄνθρωπος
  choice: ворог
  rationale: Буквально «ворожа людина»; ἄνθρωπος індивідуалізує супротивника, але українське «ворог» природно й повно передає зміст без неприродної надмірної буквальності.
- source_word: τοῦτο ἐποίησεν
  choice: Це зробив
  rationale: Збережено вказівне τοῦτο та одноразову минулу дію аориста; такий порядок слів природно виділяє виконавця — ворога.
- source_word: δοῦλοι
  choice: раби
  rationale: У господарському середовищі притчі йдеться про залежних людей, підлеглих господареві; «раби» прозоро зберігає суспільно-правовий відтінок слова δοῦλοι. Варіант «слуги» подано в примітці.
- source_word: Θέλεις
  choice: хочеш
  rationale: Сучасний і природний відповідник зі значенням волі або бажання.
- source_word: οὖν
  choice: То
  rationale: У запитанні позначає наступний практичний крок, що випливає з відповіді господаря; розмовне, але гідне «то» природно передає зв’язок реплік.
- source_word: ἀπελθόντες
  choice: щоб ми пішли
  rationale: Дієприкметник позначає дію, яка передує збиранню, і природно входить в українську підрядну конструкцію після «хочеш».
- source_word: συλλέξωμεν
  choice: позбирали
  rationale: Передає спільне збирання бур’яну з різних місць та добре відповідає сільськогосподарському контексту.
- source_word: αὐτά
  choice: їх
  rationale: Займенник середнього роду множини стосується бур’янів, згаданих у попередньому контексті; українською природно вжити «їх».
theological_decisions:
- issue: Передача δοῦλοι в контексті притчі
  choice: раби
  alternative: слуги
  rationale: «Раби» зберігає реальну залежність і владну ієрархію між господарем та його людьми, не пом’якшуючи історичного соціального змісту. Оскільки в українській біблійній традиції можливе «слуги» й головна думка притчі не залежить від точного суспільно-правового статусу, цей варіант наведено в примітці.
translation_notes:
  register: Сучасна стандартна українська мова, природний розповідний діалог із гідним, загальнозрозумілим звучанням. Частку δέ на початку передано як «же», а в другій репліці — через «тоді», щоб зберегти рух оповіді без перевантаження сполучниками.
