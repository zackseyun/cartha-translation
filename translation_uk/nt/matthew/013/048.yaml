id: MAT.13.48
reference: Matthew 13:48
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ἣν ὅτε ἐπληρώθη ἀναβιβάσαντες ἐπὶ τὸν αἰγιαλὸν καὶ καθίσαντες συνέλεξαν τὰ καλὰ εἰς ⸀ἄγγη, τὰ δὲ σαπρὰ ἔξω ἔβαλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/048.yaml
  text: When it was filled[a], they pulled it up onto the shore, sat down, and gathered the good fish into containers[b], but threw the rotten ones out.
translation:
  language: uk
  text: Коли вона наповнилася, її витягли на берег, сіли й зібрали добру рибу в посудини[a], а зіпсовану[b] викинули геть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «у вмістилища». Грецьке слово має загальне значення й не обов’язково означає кошики.
    reason: lexical_alternative
  - marker: b
    text: Або «непридатну» чи «погану». Грецьке слово може означати гнилу, зіпсовану або загалом непридатну рибу.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν
  choice: вона / її
  rationale: Займенник стосується невода з попереднього вірша; в українському реченні природно відновити його займенником жіночого роду відповідно до слова «сітка», маючи на увазі згаданий там невід.
- source_word: ἐπληρώθη
  choice: наповнилася
  rationale: Аорист пасивного за формою дієслова πληρόω передає момент, коли сітка наповнилася рибою; українська зворотна форма звучить природно.
- source_word: ἀναβιβάσαντες
  choice: витягли
  rationale: Дієприкметник описує витягування наповненої сітки з води; особова форма відтворює послідовність дій природною українською.
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: на берег
  rationale: αἰγιαλός означає берег або прибережну смугу; «берег» не уточнює безпідставно, що він був піщаним.
- source_word: καθίσαντες
  choice: сіли
  rationale: Передає наступну завершену дію в оповіді без обтяжливої дієприслівникової конструкції.
- source_word: συνέλεξαν
  choice: зібрали
  rationale: Дієслово означає зібрати докупи; вибір зберігає образ сортування улову.
- source_word: τὰ καλά
  choice: добру рибу
  rationale: Іменник «риба» мається на увазі з контексту й доданий для ясності; прикметник καλός передано як «добру» без внесення алегоричного тлумачення.
- source_word: εἰς ἄγγη
  choice: в посудини
  rationale: ἄγγος — загальна назва вмістилища; «посудини» природно й достатньо широко, тоді як «кошики» було б надмірним уточненням.
- source_word: τὰ δὲ σαπρά
  choice: а зіпсовану
  rationale: σαπρός може означати гнилий, зіпсований або непридатний; «зіпсовану» зберігає конкретний образ непридатної риби та звучить природно.
- source_word: ἔξω ἔβαλον
  choice: викинули геть
  rationale: Сполука означає викинути назовні; «геть» виразно передає усунення та відкинення.
theological_decisions:
- issue: Тлумачення сортування в образі притчі
  choice: Передати конкретну сцену рибальства, не вводячи в цей вірш пояснення про остаточний суд.
  alternative: Ужити тлумачні вислови, які наперед пояснюють образ як остаточний суд.
  rationale: У цьому вірші подано сам образ притчі, а його пояснення йде далі. Конкретний переклад зберігає структуру тексту й не підмінює образ його богословським поясненням.
translation_notes:
  register: Сучасна, ясна й гідна оповідна українська. Особові форми «витягли, сіли, зібрали» природно передають низку грецьких дієприкметників та головне дієслово. Збірне «рибу» уникає неприродного повторення «рибини», а примітки зберігають лексичну широту ἄγγη та σαπρά.
