  source_fidelity: 'Переклад точно передає послідовність грецького тексту: наповнення невода, витягування на берег, сідання, відбір доброї риби до ємностей і викидання зіпсованої. «Вона / її» належно відсилає до сітки (σαγήνη) з попереднього вірша. Збірні форми «добру рибу» та «зіпсовану» природно передають субстантивовані множинні τὰ καλά і τὰ σαπρά без додавання алегоричного змісту. «Викинули геть» адекватно відтворює ἔξω ἔβαλον.'
