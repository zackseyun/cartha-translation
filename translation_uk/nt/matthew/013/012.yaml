id: MAT.13.12
reference: Matthew 13:12
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ὅστις γὰρ ἔχει, δοθήσεται αὐτῷ καὶ περισσευθήσεται· ὅστις δὲ οὐκ ἔχει, καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/012.yaml
  text: For whoever has[a], more will be given to him, and he will have an abundance; but whoever does not have[b], even what he has will be taken from him.
translation:
  language: uk
  text: Бо хто має[a], тому буде дано, і він матиме з надлишком; а хто не має, у того буде забрано навіть те, що він має.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: У грецькому тексті не уточнено, що саме людина «має» і що їй «буде дано».
    reason: Збереження лексичної та богословської неоднозначності оригіналу.
lexical_decisions:
- source_word: ὅστις
  choice: хто
  rationale: Неозначений відносний займенник формулює загальний принцип; українське «хто» природно передає значення «кожен, хто».
- source_word: γὰρ
  choice: бо
  rationale: Сполучник пояснює попередню думку й природно передається українським «бо».
- source_word: ἔχει
  choice: має
  rationale: Прямий відповідник дієслова володіння; додаток, як і в грецькому тексті, не названо.
- source_word: δοθήσεται αὐτῷ
  choice: тому буде дано
  rationale: Збережено майбутній пасив і непрямий додаток, не додаючи слова «більше», якого в грецькому тексті немає.
- source_word: περισσευθήσεται
  choice: він матиме з надлишком
  rationale: Передає результат — достаток або надлишок — природною сучасною українською мовою.
- source_word: δὲ
  choice: а
  rationale: Позначає виразне протиставлення двох частин вислову; «а» тут звучить природніше за важче «але».
- source_word: οὐκ ἔχει
  choice: не має
  rationale: Прямо передає заперечену форму володіння, залишаючи її об’єкт неуточненим.
- source_word: καὶ
  choice: навіть
  rationale: 'Καί має підсилювальне значення й наголошує на парадоксі: буде забрано навіть наявне.'
- source_word: ὃ ἔχει
  choice: те, що він має
  rationale: Природний український відповідник відносної конструкції без конкретизації того, чим людина володіє.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: у того буде забрано
  rationale: Передає майбутній пасив і значення позбавлення; українська конструкція «у того буде забрано» є зрозумілою та близькою до структури джерела.
theological_decisions:
- issue: Неявний об’єкт дієслова «має»
  choice: Об’єкт залишено неназваним.
  alternative: Уточнити як розуміння, сприйнятливість або пізнання таємниць Царства.
  rationale: Контекст пов’язує вислів зі сприйняттям Ісусового вчення, але грецький текст не називає об’єкта. Переклад зберігає цю навмисну широту.
- issue: Граматично чоловічі форми в узагальненому вислові
  choice: 'Збережено однину: «тому», «він», «у того».'
  alternative: Перебудувати речення в множині або повторювати слово «людина».
  rationale: Грецький текст уживає чоловічий рід однини як узагальнену представницьку форму; аналогічна українська конструкція є природною й не обмежує зміст лише чоловіками.
translation_notes:
  register: Сучасна літературна українська мова, стисла й афористична. Збережено пояснювальне «бо», контраст двох частин і неявний об’єкт володіння; уникнуто конфесійно специфічного тлумачення.
