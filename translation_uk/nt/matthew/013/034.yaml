  source_fidelity: Перший дієслівний присудок «говорив» невиразно передає аорист ἐλάλησεν і, будучи тотожним формі в другій частині, стирає контраст із імперфектом ἐλάλει. «Сказав» природно передає підсумковий аорист, тоді як «не говорив» зберігає відкритий/звичний характер імперфекта. «Притчами», «натовпам», «без притчі» та «їм» точно передають відповідні грецькі елементи.
  naturalness: Виправлений текст є природним для сучасної стандартної української. Порядок слів «Ісус сказав натовпам усе це» не обтяжений, а сполучник «а» ясно позначає обмежувальний контраст другої частини.
  terminology: «Притча» є усталеним українським біблійним відповідником παραβολή. Однину в «без притчі» збережено відповідно до грецького тексту; це не потребує примітки, оскільки вислів природний українською.
