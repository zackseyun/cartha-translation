  text: Ταῦτα πάντα ἐλάλησεν ὁ Ἰησοῦς ἐν παραβολαῖς τοῖς ὄχλοις, καὶ χωρὶς παραβολῆς ⸀οὐδὲν ἐλάλει αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/034.yaml
  text: Jesus spoke all these things to the crowds in parables[a], and apart from a parable he said nothing to them.
translation:
  language: uk
  text: Ісус сказав натовпам усе це притчами, а без притчі нічого їм не говорив.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα πάντα
  choice: Усе це
  rationale: Природний український відповідник, що зберігає вказівне значення Ταῦτα та всеохопність πάντα.
- source_word: ἐλάλησεν
  choice: говорив
  rationale: Аорист підсумовує викладене Ісусом; недоконаний вид українського дієслова природно передає мовленнєву дію без надмірного акценту на її завершеності.
- source_word: ἐν παραβολαῖς
  choice: притчами
  rationale: Орудний відмінок природно передає значення способу або засобу, виражене ἐν із давальним.
- source_word: τοῖς ὄχλοις
  choice: натовпам
  rationale: Збережено множину грецького іменника та його адресатне значення.
- source_word: χωρὶς παραβολῆς
  choice: без притчі
  rationale: Прямий і природний відповідник χωρίς із родовим; збережено однину παραβολῆς.
- source_word: οὐδὲν ἐλάλει
  choice: нічого … не говорив
  rationale: Українська заперечна конструкція природно передає οὐδὲν, а форма недоконаного виду «говорив» відображає тривале або звичне значення імперфекта.
- source_word: αὐτοῖς
  choice: їм
  rationale: Займенник стисло й однозначно відсилає до натовпів.
theological_decisions:
- issue: Видове значення імперфекта ἐλάλει в другій частині
  choice: «нічого їм не говорив» — недоконаний вид, який допускає звичне або тривале прочитання
  alternative: «нічого їм не сказав» — доконаний простий минулий
  rationale: Український недоконаний вид природно зберігає аспектуальну відкритість грецького імперфекта й не зводить твердження лише до одноразової завершеної дії.
translation_notes:
  register: Сучасна стандартна українська; стислий, гідний оповідний стиль. Порядок слів наближений до природної української мови, а повтор «говорив» зберігає лексичний зв’язок між ἐλάλησεν та ἐλάλει.
