  source_fidelity: «А коли люди спали» точно передає ἐν δὲ τῷ καθεύδειν τοὺς ἀνθρώπους як часову обставину тривалої дії; «люди» не звужує загального ἄνθρωποι до чоловіків. «Його ворог», «посіяв кукіль поміж пшеницею» та «та й пішов» зберігають суб’єкта, послідовність дій і просторовий зміст оригіналу. Колективний іменник «кукіль» природно відтворює ζιζάνια в українській біблійній традиції.
