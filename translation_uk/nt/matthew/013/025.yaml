source:
  edition: SBLGNT
  text: ἐν δὲ τῷ καθεύδειν τοὺς ἀνθρώπους ἦλθεν αὐτοῦ ὁ ἐχθρὸς καὶ ⸀ἐπέσπειρεν ζιζάνια ἀνὰ μέσον τοῦ σίτου καὶ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/025.yaml
  text: But while the men were sleeping, his enemy came and sowed weeds among the wheat and went away.
translation:
  language: uk
  text: А коли люди спали, прийшов його ворог, посіяв кукіль[a] поміж пшеницею та й пішов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Кукіль — бур’ян, імовірно п’янкий пажитник, який на ранніх стадіях росту схожий на пшеницю.
    reason: Сучасним читачам назва рослини може бути незрозумілою; уточнення допомагає побачити важливу для притчі подібність до пшениці.
lexical_decisions:
- source_word: τοὺς ἀνθρώπους
  choice: люди
  rationale: У цьому контексті позначає людей, які спали; природне українське узагальнення без невиправданого звуження лише до осіб чоловічої статі.
- source_word: ἐπέσπειρεν
  choice: посіяв
  rationale: Передає навмисну дію ворога; українське «посіяв ... поміж» природно відтворює дієслово з контекстуальним значенням засівання поверх або серед уже засіяного.
- source_word: ζιζάνια
  choice: кукіль
  rationale: Традиційна й точніша назва бур’яну, ймовірно п’янкого пажитника (Lolium temulentum), який на ранній стадії схожий на пшеницю; значення пояснено у примітці.
- source_word: ἀνὰ μέσον τοῦ σίτου
  choice: поміж пшеницею
  rationale: Природно й точно передає просторове значення «серед пшениці».
- source_word: ἀπῆλθεν
  choice: та й пішов
  rationale: Стисло та природно передає завершальну послідовну дію.
