  text: ὥσπερ οὖν συλλέγεται τὰ ζιζάνια καὶ πυρὶ ⸀καίεται, οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ ⸀αἰῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/040.yaml
  text: Therefore[a], just as the weeds are gathered and burned with fire[b], so it will be at the end of the age.
translation:
  language: uk
  text: Отже, як бур’яни[a] збирають і спалюють у вогні, так буде наприкінці віку[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або, традиційно, «кукіль». Грецьке слово означає шкідливі бур’яни, імовірно пажитницю п’янку, схожу на пшеницю.
    reason: lexical_alternative
  - marker: b
    text: Традиційно також перекладають «наприкінці світу»; буквально грецькою — «при завершенні віку».
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ οὖν
  choice: Отже, як
  rationale: «Як» вводить порівняння, а «отже» передає висновковий або продовжувальний відтінок οὖν і зберігає зв’язок із попереднім поясненням притчі.
- source_word: συλλέγεται
  choice: збирають
  rationale: Форма має пасивне значення; українська неозначено-особова конструкція природно передає дію над бур’яном у сільськогосподарському контексті.
- source_word: τὰ ζιζάνια
  choice: бур’ян
  rationale: Йдеться про шкідливу бур’янисту рослину, імовірно кукіль. «Бур’ян» зрозумілий сучасному читачеві й не створює хибної ботанічної точності; традиційніший варіант подано в примітці.
- source_word: πυρὶ καίεται
  choice: спалюють у вогні
  rationale: Переклад зберігає просте значення καίω та виразну згадку про вогонь; українська конструкція звучить природно в цьому образі.
- source_word: οὕτως ἔσται
  choice: так буде
  rationale: Стисло й природно передає відповідність між образом і його майбутнім здійсненням.
- source_word: ἐν τῇ συντελείᾳ
  choice: при завершенні
  rationale: «Завершення» передає значення кульмінації або доведення до кінця, не вдаючись до менш доступного «звершення» чи надто спрощеного «кінець».
- source_word: τοῦ αἰῶνος
  choice: віку
  rationale: «Вік» зберігає часовий сенс αἰών і не ототожнює його безпосередньо з фізичним світом.
theological_decisions:
- issue: Есхатологічний вислів συντελείᾳ τοῦ αἰῶνος
  choice: при завершенні віку
  alternative: наприкінці світу
  rationale: Основний варіант зберігає часовий і есхатологічний зміст αἰών та ідею завершення в συντέλεια, не нав’язуючи конкретної схеми останніх подій і не звужуючи вислів до знищення фізичного космосу.
translation_notes:
  register: Сучасна літературна українська, проста й гідна за тоном. Неозначено-особові дієслова природно передають грецькі пасивні форми. Примітки стоять безпосередньо після слів, яких вони стосуються, виправляючи зміщення маркерів у консультаційному англійському шарі.
