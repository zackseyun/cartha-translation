lexical_decisions:
- source_word: καὶ ἐγένετο ὅτε
  choice: І сталося, коли
  rationale: Збережено виразну грецьку оповідну формулу та її часовий зв’язок із наступною дією; українською вона звучить природно й урочисто.
- source_word: ἐτέλεσεν
  choice: закінчив
  rationale: Дієслово означає довести щось до кінця; доконаний вид природно передає завершеність попередньої дії.
- source_word: τὰς παραβολὰς ταύτας
  choice: ці притчі
  rationale: «Притчі» є усталеним жанровим відповідником παραβολαί, а «ці» вказує на щойно наведений цикл притч.
- source_word: μετῆρεν
  choice: пішов
  rationale: У контексті йдеться про залишення місця й переміщення далі; «пішов» природніше для сучасної української, ніж книжне «відійшов», і не уточнює спосіб пересування.
- source_word: ἐκεῖθεν
  choice: звідти
  rationale: Стислий і точний відповідник прислівника місця зі значенням руху від названого місця.
