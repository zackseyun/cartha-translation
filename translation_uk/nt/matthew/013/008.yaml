  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὴν γῆν τὴν καλὴν καὶ ἐδίδου καρπόν, ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/008.yaml
  text: But other seed fell on the good soil and was producing fruit—one a hundredfold, another sixty, and another thirty.
translation:
  language: uk
  text: 'А інше впало на добру землю й давало плід: одне — у сто разів, інше — у шістдесят, ще інше — у тридцять.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλα
  choice: інше
  rationale: Субстантивований середній рід множини в контексті означає інше посіяне насіння. Українське «інше» природно відсилає до збірного іменника «насіння», не додаючи його там, де грецький текст залишає його невираженим.
- source_word: δὲ
  choice: А
  rationale: Частка позначає перехід із контрастом до успішного результату; українське «А» передає це природніше й менш різко, ніж «Але».
- source_word: ἔπεσεν
  choice: впало
  rationale: Збережено буквальний образ падіння насіння, а не введено пояснювальне «було посіяне».
- source_word: ἐπὶ τὴν γῆν τὴν καλὴν
  choice: на добру землю
  rationale: У сільськогосподарському контексті «добра земля» природно означає родючий, придатний ґрунт і водночас зберігає звичний біблійний образ.
- source_word: ἐδίδου καρπόν
  choice: давало плід
  rationale: Недоконаний вид «давало» відображає імперфект ἐδίδου як тривалу або повторювану результативність; «плід» зберігає грецький землеробський образ.
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: одне — у сто разів більше, друге — у шістдесят, а третє — у тридцять
  rationale: Конструкція «одне… друге… третє» відтворює грецький розподільний зворот, а «у … разів більше» ясно виражає мається на увазі кратність урожаю.
