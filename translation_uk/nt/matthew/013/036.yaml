  text: Then[a], after leaving the crowds, he went into the house. And his disciples came to him, saying, “Explain to us the parable of the weeds of the field.”
translation:
  language: uk
  text: 'Тоді, залишивши натовпи, Він увійшов у дім. Його учні підійшли до Нього й сказали: «Поясни нам притчу про бур’яни[a] на полі».'
  philosophy: optimal-equivalence
  footnotes:
