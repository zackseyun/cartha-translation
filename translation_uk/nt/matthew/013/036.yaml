    text: Або «про кукіль на полі». Грецьке слово може конкретніше означати кукіль — бур’ян, зовні подібний до пшениці.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Тоді
  rationale: Природний український часовий маркер, що вводить наступну подію в розповіді.
- source_word: ἀφεὶς τοὺς ὄχλους
  choice: залишивши натовпи
  rationale: Зберігає попередність дії аористового дієприкметника та множину ὄχλους у природній українській конструкції.
- source_word: ἦλθεν εἰς τὴν οἰκίαν
  choice: Він увійшов у дім
  rationale: У цьому контексті руху до приміщення «увійшов» природно передає ἦλθεν εἰς; означений артикль відтворено контекстуально означеним «дім», без неприродного в українській вказівного уточнення.
- source_word: προσῆλθον αὐτῷ οἱ μαθηταὶ αὐτοῦ
  choice: Його учні підійшли до Нього
  rationale: «Підійшли» точно й природно передає наближення, виражене προσέρχομαι; присвійний зв’язок відтворено звичайною українською конструкцією.
- source_word: λέγοντες
  choice: й сказали
  rationale: Сурядна особова форма є природнішою в сучасній українській оповіді та передає супровідне мовлення без зміни змісту.
- source_word: Διασάφησον ἡμῖν
  choice: Поясни нам
  rationale: Точно передає наказове прохання зробити зміст ясним; «нам» природно відтворює давальний ἡμῖν.
- source_word: τὴν παραβολὴν
  choice: притчу
  rationale: Усталений і зрозумілий український відповідник παραβολή в євангельському контексті.
- source_word: τῶν ζιζανίων τοῦ ἀγροῦ
  choice: про бур’ян на полі
  rationale: Змістовно й природно передає назву притчі; ζιζάνια може позначати конкретно кукіль, але загальне «бур’ян» зрозуміліше в основному тексті, а точнішу назву збережено в примітці.
