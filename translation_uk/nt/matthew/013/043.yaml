  text: Then the righteous will shine like the sun in the kingdom of their Father. The one who has ears, let him hear.
translation:
  language: uk
  text: Тоді праведні засяють[a], немов сонце, у Царстві свого Отця. Хто має вуха, нехай слухає[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «засяють яскраво». Грецьке дієслово може підкреслювати вияв або поширення сяйва.'
    reason: lexical_alternative
  - marker: b
    text: 'Грецький заклик має форму однини: «Хто має вуха, нехай слухає»; він звернений до кожного, хто чує.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Тоді
  rationale: Природно передає часовий прислівник і вказує на послідовність подій у поясненні притчі.
- source_word: οἱ δίκαιοι
  choice: праведні
  rationale: Субстантивований прикметник; усталений український відповідник, який не звужує значення лише до моральної бездоганності чи юридичного статусу.
- source_word: ἐκλάμψουσιν
  choice: засяють
  rationale: Передає майбутню дію та відтінок початку або явного вияву сяйва; природно поєднується з образом сонця.
- source_word: ὡς ὁ ἥλιος
  choice: немов сонце
  rationale: Ясно й природно передає порівняння, не ототожнюючи праведних із сонцем.
- source_word: ἐν τῇ βασιλείᾳ
  choice: у Царстві
  rationale: У цьому місцевому звороті βασιλεία природно означає царство як сферу, не виключаючи значення царювання.
- source_word: τοῦ πατρὸς αὐτῶν
  choice: свого Отця
  rationale: Український зворотний присвійний займенник природно співвідносить Отця з підметом «праведні» та точно передає αὐτῶν у контексті.
- source_word: ὁ ἔχων ὦτα
  choice: Хто має вуха
  rationale: Природна українська узагальнено-особова конструкція, що зберігає однину й представницький характер грецького вислову.
- source_word: ἀκουέτω
  choice: нехай слухає
  rationale: Передає наказовий зміст третьої особи; «слухає» в цьому заклику природно включає уважне сприйняття й послух.
theological_decisions:
- issue: Представницька однина в завершальному заклику
  choice: «Хто має вуха, нехай слухає»
  alternative: «Той, хто має вуха, нехай слухає»; «Хто має вуха, нехай почує»
  rationale: Збережено однину та загальний заклик до кожної людини; українське «хто» не вносить статевого обмеження, якого немає в референтному значенні грецької граматичної форми.
- issue: Значення βασιλεία
  choice: «Царство»
  alternative: «царювання»
  rationale: 'Прийменниковий зворот ἐν τῇ βασιλείᾳ тут має виразний просторово-сферичний характер: праведні сяють у Царстві Отця. Переклад не заперечує динамічного значення Божого царювання.'
- issue: Образ сяйва праведних
  choice: Зберегти пряме порівняння «немов сонце»
  alternative: Тлумачний переклад на кшталт «сяятимуть у славі»
  rationale: Оригінал подає образ без пояснення його природи; переклад не додає окремого вчення про спосіб або сутність майбутнього прославлення.
translation_notes:
  register: Сучасна, гідна й загальнозрозуміла українська мова. «Царство» й «Отець» написано з великої літери як усталені в біблійному контексті позначення Божого Царства та Бога Отця. Ритм вислову збережено стислим і урочистим.
