source:
  edition: SBLGNT
  text: ὃ μικρότερον μέν ἐστιν πάντων τῶν σπερμάτων, ὅταν δὲ αὐξηθῇ μεῖζον τῶν λαχάνων ἐστὶν καὶ γίνεται δένδρον, ὥστε ἐλθεῖν τὰ πετεινὰ τοῦ οὐρανοῦ καὶ κατασκηνοῦν ἐν τοῖς κλάδοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/032.yaml
  text: It is indeed smaller than all the seeds[a], but when it has grown, it is larger than the garden plants and becomes a tree[b], so that the birds of the sky come and nest in its branches.
translation:
  language: uk
  text: Воно й справді менше за все насіння, але, коли виросте, є більшим за городні рослини й стає деревом, тож прилітають небесні птахи[a] та гніздяться на його гілках.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «птахи повітря».
    reason: lexical_alternative
  - marker: b
    text: Образ птахів, що оселяються на гілках, може перегукуватися зі старозавітними картинами великого царственного дерева (наприклад, Єзекіїля 17:23; Даниїла 4:12), але сам вірш прямо не пояснює цієї символіки.
    reason: cross_reference
lexical_decisions:
- source_word: μικρότερον ... πάντων τῶν σπερμάτων
  choice: менше за все насіння
  rationale: Збережено грецьку форму порівняльного ступеня та явне порівняння з усім насінням, не звужуючи значення до певної сільськогосподарської категорії.
- source_word: μέν ... δέ
  choice: й справді ... але
  rationale: Передає виразне протиставлення між малим початком і великим результатом природною сучасною українською мовою.
- source_word: ὅταν ... αὐξηθῇ
  choice: коли виросте
  rationale: Аорист кон’юнктива з ὅταν представляє майбутнє зростання як завершену подію перед описом результату.
- source_word: μεῖζον τῶν λαχάνων
  choice: більшим за городні рослини
  rationale: λάχανα позначає вирощувані на городі рослини; цей широкий відповідник не звужує значення до овочів або трав.
- source_word: γίνεται δένδρον
  choice: стає деревом
  rationale: Без пом’якшення збережено прямий і яскравий образ грецького тексту.
- source_word: ὥστε ἐλθεῖν
  choice: тож прилітають
  rationale: Передає наслідкове значення конструкції ὥστε з інфінітивом; дієслово «прилітають» природно конкретизує рух птахів у цьому контексті.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: небесні птахи
  rationale: Близько відтворює грецький зворот і природно звучить у піднесеній, але зрозумілій українській мові.
- source_word: κατασκηνοῦν
  choice: гніздяться
  rationale: У контексті птахів і гілок дієслово природно означає влаштовуватися або гніздитися.
- source_word: ἐν τοῖς κλάδοις αὐτοῦ
  choice: на його гілках
  rationale: Українська мова звичайно описує птахів як таких, що гніздяться «на гілках»; займенник зберігає зв’язок із деревом.
theological_decisions:
- issue: Можливий відгомін старозавітного образу птахів, що оселяються на великому дереві
  choice: Образ дослівно збережено без явного тлумачення в основному тексті.
  alternative: Витлумачити птахів як народи або людей, що знаходять прихисток у Божому Царстві.
  rationale: Образ може перегукуватися з картинами царственного дерева в Єзекіїля 17:23 та Даниїла 4:12, однак сам вірш прямо не пояснює його символіки. Тому переклад зберігає можливий богословський відгомін, не нав’язуючи висновку.
translation_notes:
  register: Сучасна стандартна українська мова; виклад природний, зрозумілий і гідний. Порівняльні форми та повтор «стає» збережено для прозорого відтворення структури й контрасту грецького тексту.
