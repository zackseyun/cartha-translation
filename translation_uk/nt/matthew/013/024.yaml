base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/024.yaml
  text: He set another parable before them[a], saying, “The kingdom of heaven is like a man who sowed good seed in his field.”
translation:
  language: uk
  text: 'Він розповів їм іншу притчу, кажучи: «Царство Небесне подібне[a] до чоловіка, який посіяв добре насіння на своєму полі».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Царство Небесне уподібнилося чоловікові, який посіяв добре насіння на своєму полі». У вступній формулі притчі грецьке дієслово можна передати як стан порівняння.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν
  choice: іншу притчу
  rationale: Передає введення ще однієї притчі в послідовності оповіді; український порядок слів природно ставить означення перед іменником.
- source_word: παρέθηκεν αὐτοῖς
  choice: подав їм
  rationale: Дієслово означає викласти або представити щось слухачам. «Подав їм» зберігає образ представлення навчального матеріалу й звучить стисло та гідно.
- source_word: λέγων
  choice: кажучи
  rationale: Дієприслівник зберігає граматичний зв’язок між вступною фразою та прямою мовою.
- source_word: Ὡμοιώθη
  choice: уподібнилося
  rationale: Форма минулого часу середнього стану природно передає аорист пасивного ὡμοιώθη та не зводить його без пояснення до простого «подібне».
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Царство Небесне
  rationale: Усталений і природний український відповідник характерного для Матвія вислову; прикметникова форма передає грецький родовий зворот без неприродного «царство небес».
- source_word: ἀνθρώπῳ
  choice: чоловікові
  rationale: У цій притчі йдеться про конкретного чоловіка; давальний відмінок зумовлений дієсловом «уподібнилося».
- source_word: σπείραντι
  choice: який посіяв
  rationale: Відносне речення природно передає аористовий активний дієприкметник і завершену дію.
- source_word: καλὸν σπέρμα
  choice: добре насіння
  rationale: Передає якісне значення καλός і готує контраст із бур’янами в наступному контексті.
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: на своєму полі
  rationale: Українською сіють «на полі»; зворотний присвійний займенник «своєму» однозначно відносить поле до чоловіка, який сіяв.
theological_decisions:
- issue: Передача формули про Небесне Царство
  choice: Царство Небесне
  alternative: царство небес
  rationale: Усталений український вислів зберігає характерне для Матвія позначення Божого царювання, не додаючи окремого доктринального тлумачення множини οὐρανῶν.
- issue: Значення Ὡμοιώθη у вступі до притчі
  choice: уподібнилося
  alternative: подібне
  rationale: Основний текст зберігає часову й пасивну форму грецького дієслова, тоді як примітка подає природнішу формулу стану; це не вирішує приховано, чи слід наголошувати на події уподібнення або лише на самому порівнянні.
translation_notes:
  register: Сучасна літературна українська з гідним оповідним звучанням. Речення зберігає структуру грецького вступу, але використовує природні українські відмінки та прийменники. Маркер примітки поставлено безпосередньо після слова, до якого стосується лексична альтернатива.
