  text: ὁ δὲ ἀγρός ἐστιν ὁ κόσμος· τὸ δὲ καλὸν σπέρμα, οὗτοί εἰσιν οἱ υἱοὶ τῆς βασιλείας· τὰ δὲ ζιζάνιά εἰσιν οἱ υἱοὶ τοῦ πονηροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/038.yaml
  text: The field is the world[a], and the good seed—these are the sons of the kingdom. And the weeds are the sons of the evil one[c][b],
translation:
  language: uk
  text: Поле — це світ, а добре насіння — це сини Царства. Бур’яни[a] ж — сини[b] Лукавого.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або точніше: «кукіль» — бур’ян, зовні подібний до пшениці.'
    reason: lexical_alternative
  - marker: b
    text: «Сини» тут — образний вислів про людей, які належать відповідно до Царства або до Лукавого.
    reason: cultural_note
lexical_decisions:
- source_word: ἀγρός
  choice: поле
  rationale: Звичний і природний відповідник у контексті землеробської притчі; зберігає її образність.
- source_word: κόσμος
  choice: світ
  rationale: Передає широкий простір, у якому відбувається сівба, без невиправданого звуження значення.
- source_word: καλὸν σπέρμα
  choice: добре насіння
  rationale: Природно зберігає буквальний землеробський образ і протиставлення бур’янам.
- source_word: οὗτοί εἰσιν
  choice: це сини
  rationale: Грецький займенник має чоловічий рід і множину та переводить увагу від збірного образу насіння до людей, яких воно представляє.
- source_word: υἱοὶ τῆς βασιλείας
  choice: сини Царства
  rationale: Зберігає виразний родинно-реляційний семітизм і граматичний чоловічий рід оригіналу; «Царство» є усталеним відповідником βασιλεία в Матвія.
- source_word: ζιζάνια
  choice: бур’яни
  rationale: Зрозумілий сучасний загальний відповідник; точнішу ботанічну назву подано в примітці.
- source_word: τοῦ πονηροῦ
  choice: лукавого
  rationale: Субстантивований прикметник з артиклем природно вказує на особового носія зла; українське «лукавий» є усталеним біблійним найменуванням особи.
theological_decisions:
- issue: Особове чи абстрактне розуміння τοῦ πονηροῦ
  choice: лукавого
  alternative: зла / злого
  rationale: Артикльований прикметник у чоловічому роді однини після «сини» найприродніше позначає особу. Переклад не конкретизує її далі як диявола чи сатану, бо цього прямо немає у вірші.
- issue: Передача υἱοὶ як родового чоловічого вислову
  choice: сини
  alternative: діти
  rationale: Основний текст зберігає чоловічий рід грецького υἱοί та родинний характер вислову; примітка пояснює його представницьке охоплення.
translation_notes:
  register: Сучасна нормативна українська з гідним біблійним звучанням. Тире увиразнює три паралельні пояснення образів. Частку «ж» ужито для чіткого контрасту між добрим насінням і бур’янами.
