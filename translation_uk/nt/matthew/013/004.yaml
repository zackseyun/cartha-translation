lexical_decisions:
- source_word: ἐν τῷ σπείρειν αὐτὸν
  choice: коли він сіяв
  rationale: Прийменник ἐν з артикльованим інфінітивом виражає одночасність; цей природний український зворот точно передає часовий зв’язок.
- source_word: ἃ μὲν
  choice: деякі зерна
  rationale: Займенник середнього роду множини буквально означає «деякі речі», але з контексту йдеться про посіяне зерно; іменник додано для ясності.
- source_word: ἔπεσεν
  choice: впали
  rationale: Аорист у розповіді природно передано доконаним дієсловом минулого часу; множина узгоджена з явним українським «зерна».
- source_word: παρὰ τὴν ὁδόν
  choice: край дороги
  rationale: παρά з родовим тут указує на місце поруч із дорогою; «край дороги» природно й стисло передає це значення.
- source_word: ἐλθόντα τὰ πετεινὰ
  choice: прилетіли птахи
  rationale: Дієприкметниковий зворот природно передано особовим дієсловом у послідовності подій. «Прилетіли» відповідає птахам і не додає відсутнього в тексті означення «небесні».
- source_word: κατέφαγεν
  choice: поклювали
  rationale: Щодо птахів українське «поклювали» природно передає повне поїдання зерен і силу дієслова κατεσθίω без неприродного «пожерли».
- source_word: αὐτά
  choice: їх
  rationale: Займенник відсилає до зерен; українське «їх» однозначне в цьому контексті.
theological_decisions: []
