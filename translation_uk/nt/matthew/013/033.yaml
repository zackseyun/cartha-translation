base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/033.yaml
  text: 'He told them another parable: “The kingdom of heaven is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.”'
translation:
  language: uk
  text: 'Іншу притчу Він розповів їм: «Царство Небесне подібне до закваски[a], яку жінка взяла й сховала[b] в три сати борошна[c], аж поки все не заквасилося».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «дріжджів». Грецьке слово означає засіб, яким заквашують тісто.
    reason: lexical_alternative
  - marker: b
    text: Або «вмішала». Грецькою буквально «сховала».
    reason: lexical_alternative
  - marker: c
    text: Сата — давня міра об’єму. Три сати становили дуже велику кількість борошна.
    reason: cultural_note
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς
  choice: Іншу притчу Він розповів їм
  rationale: Природно передає введення додаткової притчі; «розповів» тут доречніше за буквальне «говорив».
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Царство Небесне
  rationale: Усталений і природний український відповідник Матвієвого вислову; не відтворює механічно грецьку множину οὐρανῶν.
- source_word: ζύμῃ
  choice: закваски
  rationale: «Закваска» точно позначає засіб для заквашування тіста й зберігає нейтральність образу без нав'язування позитивного чи негативного значення.
- source_word: ἣν λαβοῦσα γυνὴ
  choice: яку жінка взяла
  rationale: Природно відтворює дієприкметникову конструкцію та послідовність дій.
- source_word: ἐνέκρυψεν εἰς
  choice: сховала у
  rationale: Зберігає буквальну й образну силу дієслова ἐγκρύπτω; практичний зміст «вмішала» подано у примітці.
- source_word: ἀλεύρου σάτα τρία
  choice: у трьох сатах борошна
  rationale: Зберігає назву давньої міри об'єму, а примітка пояснює її сучасному читачеві.
- source_word: ἕως οὗ ἐζυμώθη ὅλον
  choice: аж поки заквасилося все
  rationale: Передає пасивну форму та наголос ὅλον на всій масі, не додаючи відсутнього в оригіналі слова «тісто».
theological_decisions:
- issue: Смислове забарвлення ζύμη в притчі про Царство
  choice: Нейтральне «закваска» без позитивної чи негативної оцінки
  alternative: Тлумачити закваску негативно на підставі інших біблійних контекстів або позитивно як образ поширення Царства
  rationale: Сам текст порівняння наголошує на прихованій дії та проникненні в усю масу, але не пояснює морального забарвлення образу; переклад не повинен усувати цю богословську напругу.
translation_notes:
  register: Сучасна стандартна українська мова, проста й гідна оповідна форма. Займенник «Він» ужито з великої літери відповідно до поширеної української біблійної традиції. Буквальне «сховала» збережено в основному тексті, а природніше кулінарне пояснення винесено в примітку.
