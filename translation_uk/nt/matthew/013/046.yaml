lexical_decisions:
- source_word: εὑρὼν δὲ
  choice: А знайшовши
  rationale: Аористовий дієприкметник передає дію, що передує головним дієсловам; δέ має тут легке сполучне значення, природно передане часткою «а».
- source_word: ἕνα
  choice: одну
  rationale: Збережено виразний грецький числівник, який підкреслює єдину перлину виняткової цінності.
- source_word: πολύτιμον
  choice: дорогоцінну
  rationale: Природний сучасний відповідник зі значенням великої вартості; можливий описовий варіант подано в примітці.
- source_word: μαργαρίτην
  choice: перлину
  rationale: Звичайний український відповідник, узгоджений із жіночим родом іменника.
- source_word: ἀπελθὼν
  choice: він пішов
  rationale: Дієприкметник природно передано особовою формою, зберігаючи послідовність дій.
- source_word: πέπρακεν
  choice: продав
  rationale: Перфект у цій розповідній послідовності природно передається доконаним минулим часом; завершеність дії збережено.
- source_word: πάντα ὅσα εἶχεν
  choice: усе, що мав
  rationale: Природний український зворот, що точно зберігає значення повноти.
- source_word: ἠγόρασεν
  choice: купив
  rationale: Прямий, загальнозрозумілий відповідник доконаного виду.
- source_word: αὐτόν
  choice: її
  rationale: Займенник стосується «перлини»; українське узгодження за жіночим родом природно передає референта.
