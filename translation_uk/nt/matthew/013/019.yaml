  text: παντὸς ἀκούοντος τὸν λόγον τῆς βασιλείας καὶ μὴ συνιέντος, ἔρχεται ὁ πονηρὸς καὶ ἁρπάζει τὸ ἐσπαρμένον ἐν τῇ καρδίᾳ αὐτοῦ· οὗτός ἐστιν ὁ παρὰ τὴν ὁδὸν σπαρείς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/019.yaml
  text: When anyone hears the word of the kingdom and does not understand it[a], the evil one comes and snatches away what has been sown in his heart[b]. This is the one sown beside the road.
translation:
  language: uk
  text: Коли хтось чує слово Царства й не розуміє його, приходить лукавий[a] і вихоплює посіяне в його серці. Це і є той, кого посіяно край дороги[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «злий».'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «той, кого посіяно при дорозі» чи «той, кого посіяно обабіч дороги».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παντὸς ἀκούοντος
  choice: коли хтось чує
  rationale: Родовий з дієприкметником природно передано загальною часово-умовною конструкцією; «хтось» зберігає розподільне значення πᾶς.
- source_word: λόγον τῆς βασιλείας
  choice: слово про Царство
  rationale: λόγος тут означає звістку або слово, а родовий τῆς βασιλείας указує на його зміст. «Слово» зберігає зв’язок з образом насіння, а «про Царство» ясно передає зміст звістки.
- source_word: μὴ συνιέντος
  choice: не розуміє його
  rationale: συνίημι означає розуміти, осягати. Займенник «його» природно відсилає до слова про Царство.
- source_word: ὁ πονηρὸς
  choice: лукавий
  rationale: Означення з артиклем у цьому контексті позначає особистого носія зла. «Лукавий» природно функціонує в українській як субстантивована назва, не уточнюючи особу понад текст.
- source_word: ἁρπάζει
  choice: вириває
  rationale: Дієслово передає раптове й силове заволодіння; «вириває» зберігає цю виразність і природно сполучається з посіяним.
- source_word: τὸ ἐσπαρμένον
  choice: посіяне
  rationale: Субстантивований пасивний дієприкметник передано без доданого іменника, зі збереженням пасивності й образу сівби.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: в його серці
  rationale: Прямий відповідник зберігає біблійний антропологічний образ «серця» та граматичну однину чоловічого роду.
- source_word: οὗτός ἐστιν
  choice: це і є
  rationale: Конструкція виразно вводить ототожнення слухача з образом у притчі.
- source_word: ὁ παρὰ τὴν ὁδὸν σπαρείς
  choice: той, кого посіяно край дороги
  rationale: Передача зберігає чоловічий референт і навмисне метонімічне ототожнення людини з посіяним, не виправляючи образ на «насіння» чи «ґрунт».
theological_decisions:
- issue: Кого позначає ὁ πονηρός
  choice: особистого злого діяча — «лукавого»
  alternative: безособове зло або «злий»
  rationale: Дія приходу й виривання в найближчому контексті вказує на особистого діяча, проте переклад не називає його точніше, ніж грецький текст.
- issue: Рід і число в αὐτοῦ
  choice: «в його серці»
  alternative: «у їхньому серці» або «в серці»
  rationale: Грецький текст має однину чоловічого роду, вжиту узагальнено; початкове «хтось» уже робить загальний сенс зрозумілим.
- issue: Ототожнення слухача з посіяним
  choice: «той, кого посіяно»
  alternative: «посіяне» або пояснювальне «це зерно означає людину»
  rationale: Чоловічий дієприкметник σπαρείς ототожнює людину з елементом образу. Переклад зберігає цю напругу й не додає пояснення, якого немає в тексті.
translation_notes:
  register: Сучасна нормативна українська з гідним біблійним звучанням. Речення лишається простим і доступним; «Царство» написано з великої літери як усталене позначення Божого Царства в контексті. Метонімію останньої фрази свідомо не згладжено.
