reference: Matthew 13:44
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ⸀Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν θησαυρῷ κεκρυμμένῳ ἐν τῷ ἀγρῷ, ὃν εὑρὼν ἄνθρωπος ἔκρυψεν, καὶ ἀπὸ τῆς χαρᾶς αὐτοῦ ὑπάγει καὶ ⸂πωλεῖ πάντα ὅσα ἔχει⸃ καὶ ἀγοράζει τὸν ἀγρὸν ἐκεῖνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/044.yaml
  text: The kingdom of heaven is like a treasure hidden in a field[a], which a man found and hid[b]; and in his joy he goes and sells all that he has and buys that field.
translation:
  language: uk
  text: Царство Небесне подібне до скарбу, схованого в полі[a]. Знайшовши його, чоловік сховав його і з радості[b] йде, продає все, що має, та купує те поле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Царство Небесне подібне до схованого в полі скарбу».'
    reason: Можливий інший природний порядок слів, що точніше наслідує грецьку будову.
  - marker: b
    text: 'Або: «через свою радість».'
    reason: Прийменниковий вислів ἀπὸ τῆς χαρᾶς αὐτοῦ виражає причину дії, а не лише емоційний стан.
lexical_decisions:
- source_word: Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν
  choice: Царство Небесне подібне до
  rationale: Природна українська формула порівняння зберігає традиційний матвіївський вислів і не звужує βασιλεία лише до території або лише до правління.
- source_word: θησαυρῷ κεκρυμμένῳ ἐν τῷ ἀγρῷ
  choice: скарбу, схованого в полі
  rationale: Давальний після формули порівняння передано природною українською конструкцією; дієприкметник перфекта позначає стан скарбу як схованого.
- source_word: ὃν εὑρὼν ἄνθρωπος ἔκρυψεν
  choice: Знайшовши його, чоловік знову сховав його
  rationale: Дієприслівникова конструкція відтворює послідовність дій. «Чоловік» відповідає граматично чоловічому ἄνθρωπος. «Знову» природно передає повторне приховування вже знайденого скарбу, хоча це значення випливає з контексту, а не з окремого грецького слова.
- source_word: ἀπὸ τῆς χαρᾶς αὐτοῦ
  choice: з радості
  rationale: 'Стисло й природно передає причинну силу прийменникового звороту: радість спонукає чоловіка діяти.'
- source_word: ὑπάγει καὶ πωλεῖ πάντα ὅσα ἔχει
  choice: йде, продає все, що має
  rationale: Теперішній час збережено як жвавий оповідний теперішній; вислів передає повноту продажу майна.
- source_word: ἀγοράζει τὸν ἀγρὸν ἐκεῖνον
  choice: купує те поле
  rationale: Вказівний займенник «те» зберігає наголос на конкретному полі, де сховано скарб.
theological_decisions:
- issue: Передача βασιλεία τῶν οὐρανῶν
  choice: Царство Небесне
  alternative: небесне правління / Царство небес
  rationale: Усталений і природний український відповідник зберігає матвіївський вислів та залишає відкритими взаємопов’язані значення Божого царювання і царства.
- issue: Передача ἄνθρωπος
  choice: чоловік
  alternative: людина
  rationale: У цій короткій розповіді іменник має граматично чоловічу форму й позначає окремого чоловічого персонажа; переклад не перетворює його на суто абстрактну особу.
- issue: Оцінка вчинку з повторним приховуванням скарбу
  choice: не додавати моральної оцінки
  alternative: пояснити в тексті законність або незаконність учинку
  rationale: Грецький текст лише розповідає про дії чоловіка. Переклад не має мовчки виправдовувати чи засуджувати їх і зберігає притчеву напругу.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Короткі дієслова та оповідний теперішній зберігають жвавість притчі; традиційний вислів «Царство Небесне» не обтяжено архаїзмами.
