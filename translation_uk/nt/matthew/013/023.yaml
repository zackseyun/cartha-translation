  text: ὁ δὲ ἐπὶ τὴν ⸂καλὴν γῆν⸃ σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ ⸀συνιείς, ὃς δὴ καρποφορεῖ καὶ ποιεῖ ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/023.yaml
  text: But the one sown on the good soil—this is the one who hears the word and understands it[a], who indeed bears fruit and produces, in one case a hundred, in another sixty[b], and in another thirty.
translation:
  language: uk
  text: 'А посіяний на доброму ґрунті[a] — це той, хто слухає слово й розуміє його. Він справді приносить плід і дає врожай: один — сто, інший — шістдесят, а ще інший — тридцять[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «на добрій землі».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «один — сто, інший — шістдесят, а інший — тридцять»; тобто йдеться про різну врожайність. Багато перекладів передають це як «стократний ... шістдесятикратний ... тридцятикратний урожай».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τὴν καλὴν γῆν
  choice: на доброму ґрунті
  rationale: В аграрному контексті «ґрунт» природно передає землю як середовище, у яке падає насіння; καλὴν тут означає придатний, родючий ґрунт.
- source_word: σπαρείς
  choice: посіяний
  rationale: Дієприкметник зберігає образ сівби та формально узгоджується з особою, яку уособлює посіяне насіння.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: той, хто слухає слово
  rationale: Теперішній дієприкметник описує характерну дію. «Слово» зберігає усталену євангельську лексику без зайвого тлумачення як конкретного різновиду звістки.
- source_word: συνιείς
  choice: розуміє його
  rationale: Дієслово означає розуміння почутого; займенник «його» природно відсилає до слова.
- source_word: δὴ
  choice: справді
  rationale: Передає легке підсилення, внесене часткою δή, не перевантажуючи речення.
- source_word: καρποφορεῖ
  choice: приносить плід
  rationale: Зберігає центральний для притчі землеробський образ і його переносне значення.
- source_word: ποιεῖ
  choice: дає врожай
  rationale: У контексті йдеться про результат плодоношення; окреме дієслівне словосполучення зберігає наявність у грецькому тексті двох дієслів.
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: хтось — у сто разів, хтось — у шістдесят, а хтось — у тридцять
  rationale: Природно передає розподільну конструкцію та різну врожайність. Слово «разів» робить зрозумілим мається на увазі кратний урожай, хоча в грецькому тексті воно не виражене окремо.
theological_decisions:
- issue: Характер відгуку на слово в притчі
  choice: Добрий ґрунт описано через слухання, розуміння та плодоношення в різній мірі.
  alternative: Можна було б прямо додати поняття витривалості, істинного навернення або духовного відродження.
  rationale: Грецький текст називає слухання, розуміння та принесення плоду, але не формулює тут пізніших доктринальних категорій. Переклад не додає конфесійного висновку.
translation_notes:
  register: Сучасна літературна українська мова з гідним біблійним звучанням. Землеробський образ збережено, а еліптичний вислів про врожайність помірно прояснено для звичайного читача.
