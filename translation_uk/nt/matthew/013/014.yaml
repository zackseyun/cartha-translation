base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/014.yaml
  text: 'And in them the prophecy of Isaiah is fulfilled[a], which says: ‘You will indeed hear, but never understand, and seeing you will see, but never perceive.’'
translation:
  language: uk
  text: 'І на них справджується пророцтво Ісаї, у якому сказано: «Ви справді будете слухати, але так і не зрозумієте; ви справді будете дивитися, але так і не побачите».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Слухом слухатимете… і, дивлячись, дивитиметеся» — переданий грецькою семітський спосіб підсилення вислову.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναπληροῦται
  choice: справджується
  rationale: Теперішній пасив передано природним українським дієсловом для здійснення пророцтва. Форма не нав’язує ані значення одноразового завершення, ані сильнішого відтінку «цілковито сповнюється».
- source_word: αὐτοῖς
  choice: на них
  rationale: Давальний відмінок указує, що пророцтво справджується у випадку саме цих людей. «На них» природно поєднується українською з формулою справдження пророцтва.
- source_word: προφητεία Ἠσαΐου
  choice: пророцтво Ісаї
  rationale: Прямо й природно відтворює грецьку родову конструкцію.
- source_word: ἡ λέγουσα
  choice: у якому сказано
  rationale: Атрибутивний дієприкметник вводить цитату; безособова українська конструкція звучить природніше за буквальне «яке говорить».
- source_word: Ἀκοῇ ἀκούσετε
  choice: ви справді будете слухати
  rationale: Відтворює підсилення семітської зворотної конструкції зрозумілою сучасною українською, тоді як буквальну форму подано в примітці.
- source_word: οὐ μὴ συνῆτε
  choice: але так і не зрозумієте
  rationale: «Так і не» передає категоричну силу οὐ μή, а «але» природно виражає протиставлення, закладене контекстом.
- source_word: βλέποντες βλέψετε
  choice: будете дивитися й дивитися
  rationale: Повтор дієслова зберігає риторичну наполегливість грецької конструкції та водночас звучить природно українською.
- source_word: οὐ μὴ ἴδητε
  choice: але так і не побачите
  rationale: «Побачите» тут означає не лише фізичний зір, а досягнення сприйняття; контраст із «дивитися» передає цю різницю без додавання тлумачення. «Так і не» зберігає емфатичне заперечення.
theological_decisions:
- issue: Характер справдження пророцтва
  choice: Пророцтво справджується на цих людях у їхній описаній реакції.
  alternative: Пророцтво лише ілюструється ними або, навпаки, тут остаточно й вичерпно завершується.
  rationale: Формула «справджується» зберігає твердження тексту, не додаючи певного механізму зачерствіння, приречення чи лише типологічної подібності.
translation_notes:
  register: Сучасна стандартна українська з гідним біблійним звучанням. У головному тексті семітські підсилювальні конструкції передано природно, а їхню буквальну форму збережено в примітці.
