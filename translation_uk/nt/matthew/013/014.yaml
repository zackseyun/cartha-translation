  verdict: revise
  source_fidelity: «Справджується на них» добре передає ἀναπληροῦται αὐτοῖς як теперішнє здійснення пророцтва стосовно названих людей, без надмірного богословського уточнення. Перша підсилювальна конструкція передана вдало. У другій конструкції «будете дивитися й дивитися» передає повтор, але дещо зміщує акцент до тривалого або неодноразового поглядання; грецьке βλέποντες βλέψετε, як і попередня конструкція, є семітським підсиленням. Симетричне «справді будете дивитися» точніше передає цю функцію та зберігає контраст із «не побачите».
