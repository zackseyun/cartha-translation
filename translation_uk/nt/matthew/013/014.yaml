  terminology: «Пророцтво Ісаї» та «справджується» є усталеними й нейтральними. «Зрозумієте» / «побачите» належно зберігають контекстуальний контраст між слуханням або баченням і справжнім розумінням чи сприйняттям, не перетворюючи його на конфесійне тлумачення.
