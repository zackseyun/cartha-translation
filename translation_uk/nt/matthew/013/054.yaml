id: MAT.13.54
reference: Matthew 13:54
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν εἰς τὴν πατρίδα αὐτοῦ ἐδίδασκεν αὐτοὺς ἐν τῇ συναγωγῇ αὐτῶν, ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν· Πόθεν τούτῳ ἡ σοφία αὕτη καὶ αἱ δυνάμεις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/054.yaml
  text: And coming to his hometown[a], he was teaching them in their synagogue, so that they were astonished and said, “Where did this man get this wisdom and these powers?”
translation:
  language: uk
  text: 'І, прийшовши до свого рідного міста, він навчав їх у їхній синагозі, так що вони дивувалися й казали: «Звідки в цього чоловіка ця мудрість і ці прояви сили[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «могутні діла»; тобто діяння сили, які часто розуміють як чудеса.
    reason: lexical_alternative
lexical_decisions:
- source_word: πατρίδα
  choice: рідного міста
  rationale: У цьому оповідному контексті йдеться про місце, де Ісус виріс і де його знали місцеві жителі. «Рідне місто» природно передає місцевий, а не загальнонаціональний зміст слова.
- source_word: ἐδίδασκεν
  choice: навчав
  rationale: Недоконаний вид українського дієслова природно передає тривалу або незавершену дію грецького імперфекта.
- source_word: συναγωγῇ
  choice: синагозі
  rationale: У цьому юдейському контексті слово позначає синагогу як усталене місце зібрання й навчання.
- source_word: ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν
  choice: так що вони дивувалися й казали
  rationale: Конструкція ὥστε з інфінітивами виражає наслідок. Особові дієслівні форми звучать природно українською, а «дивувалися» передає сильну реакцію слухачів без зайвого стилістичного перебільшення.
- source_word: Πόθεν
  choice: Звідки в
  rationale: Питальне слово стосується джерела або походження мудрості та проявів сили; конструкція «Звідки в…» є природною сучасною українською.
- source_word: τούτῳ
  choice: цього чоловіка
  rationale: Вказівний займенник у репліці має дещо відсторонений відтінок. «Цього чоловіка» передає його природніше, ніж буквальне «цього».
- source_word: σοφία
  choice: мудрість
  rationale: Усталений і точний відповідник, що тут стосується надзвичайної проникливості та змісту навчання Ісуса.
- source_word: δυνάμεις
  choice: прояви сили
  rationale: Вислів зберігає основне значення δύναμις — «сила», але в множині природно вказує на здійснені могутні діяння. Він не звужує значення одразу до технічного поняття «чудеса».
theological_decisions:
- issue: Передача δυνάμεις щодо надзвичайних діянь Ісуса
  choice: прояви сили
  alternative: могутні діла; чудеса; сили
  rationale: «Прояви сили» зберігає зв’язок із буквальним значенням грецького слова та водночас природно позначає діяння, у яких виявляється сила. «Чудеса» було б яснішим, але більш тлумачним; просто «сили» українською могло б помилково означати лише здібності або запас енергії.
translation_notes:
  register: Сучасна стандартна українська мова з гідним, зрозумілим оповідним стилем. Займенники на позначення Ісуса подано з малої літери за загальними нормами сучасного правопису; це не має богословського значення. Маркер примітки поставлено саме після вислову, якого вона стосується.
