  text: But when the plants had sprouted and produced grain[a], then the weeds also appeared.
translation:
  language: uk
  text: Коли ж посів зійшов і дав зерно, тоді показалися й бур’яни.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «кукіль»; можливо, йдеться про конкретний бур’ян, наприклад пажитницю п’янку.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Коли ж
  rationale: ὅτε вводить підрядне речення часу, а δέ тут є м’яким сполучним елементом із легким відтінком переходу чи протиставлення; природний український відповідник — «коли ж».
- source_word: ἐβλάστησεν ὁ χόρτος
  choice: посів зійшов
  rationale: βλαστάνω означає проростати або сходити, а χόρτος у контексті засіяного поля позначає рослини посіву. «Посів зійшов» природно передає землеробську ситуацію, не створюючи хибного образу звичайної трави.
- source_word: καρπὸν ἐποίησεν
  choice: дав зерно
  rationale: Буквально «утворив плід»; у контексті пшеничного поля йдеться про появу зерна. Українське «дав зерно» стисло й природно передає цей зміст.
- source_word: τότε
  choice: тоді
  rationale: Прямо передає часову послідовність оповіді.
- source_word: ἐφάνη
  choice: показався
  rationale: Дієслово означає стати видимим або виявитися. «Показався» природно вказує, що бур’ян стало можливо розпізнати після появи зерна.
- source_word: καὶ τὰ ζιζάνια
  choice: й бур’ян
  rationale: καί має додаткове значення «також», природно передане часткою «й». Множинне грецьке збірне позначення ζιζάνια природно відтворено українським збірним іменником «бур’ян»; ботанічна конкретизація лишається непевною.
theological_decisions:
- issue: Точне визначення ζιζάνια
  choice: У головному тексті вжито загальне «бур’ян»
  alternative: «кукіль» або конкретніше «пажитниця п’янка»
  rationale: Грецьке слово позначає шкідливі рослини серед посіву й може стосуватися конкретного виду, ймовірно пажитниці, однак сам текст не вимагає ботанічно точного ототожнення. Загальний відповідник зберігає доступність і не усуває невизначеності.
translation_notes:
  register: Сучасна, природна й гідна українська мова. Землеробські вислови «посів зійшов» і «дав зерно» зрозумілі широкому колу читачів; примітка зберігає традиційний і можливий ботанічно конкретний відповідники.
