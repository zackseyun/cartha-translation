  text: οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ αἰῶνος· ἐξελεύσονται οἱ ἄγγελοι καὶ ἀφοριοῦσιν τοὺς πονηροὺς ἐκ μέσου τῶν δικαίων
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/049.yaml
  text: 'So it will be at the end of the age: the angels will go out and separate the wicked from among the righteous,[a]'
translation:
  language: uk
  text: 'Так буде при завершенні віку[a]: ангели вийдуть і відділять злих з-поміж праведних.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «при сповненні віку». Традиційно цей вислів іноді перекладають «при кінці світу», проте грецьке αἰών означає «вік», а не «світ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως ἔσται
  choice: Так буде
  rationale: Стисло й природно передає висновок із образу притчі та майбутній час грецького вислову.
- source_word: ἐν τῇ συντελείᾳ τοῦ αἰῶνος
  choice: при завершенні віку
  rationale: «Завершення» передає значення доведення до кінця, закладене в συντέλεια, а «вік» точно відтворює αἰών, не підмінюючи його словом «світ».
- source_word: ἐξελεύσονται οἱ ἄγγελοι
  choice: ангели вийдуть
  rationale: Прямий і природний переклад; у контексті остаточного суду ἄγγελοι означає небесних ангелів.
- source_word: ἀφοριοῦσιν
  choice: відділять
  rationale: Передає відокремлення однієї групи від іншої та природно сполучається з «з-поміж».
- source_word: τοὺς πονηροὺς
  choice: злих
  rationale: Субстантивований прикметник позначає злих людей; українська форма зберігає стислість оригіналу без доданого іменника.
- source_word: ἐκ μέσου τῶν δικαίων
  choice: з-поміж праведних
  rationale: Точно виражає вилучення злих із середовища змішаної групи; «праведних» є звичним відповідником δικαίων.
theological_decisions:
- issue: Значення αἰών в есхатологічному вислові
  choice: вік
  alternative: світ
  rationale: Грецьке αἰών позначає вік або епоху; переклад «світ» міг би безпідставно спрямувати вислів до думки про фізичний космос.
- issue: Кого позначає οἱ ἄγγελοι
  choice: небесних ангелів
  alternative: посланців
  rationale: У поясненні притчі про остаточне розділення контекст указує на надприродних ангелів, а не на людських посланців.
translation_notes:
  register: Сучасна літературна українська мова з лаконічним, гідним біблійним звучанням. Збережено паралельне протиставлення «злих» і «праведних» та есхатологічну неоднозначність слова «вік».
