  text: ἄφετε συναυξάνεσθαι ἀμφότερα ⸀μέχρι τοῦ θερισμοῦ· καὶ ἐν καιρῷ τοῦ θερισμοῦ ἐρῶ τοῖς θερισταῖς· Συλλέξατε πρῶτον τὰ ζιζάνια καὶ δήσατε αὐτὰ εἰς δέσμας πρὸς τὸ κατακαῦσαι αὐτά, τὸν δὲ σῖτον ⸀συναγάγετε εἰς τὴν ἀποθήκην μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/030.yaml
  text: Let both grow together until the harvest[a], and at the time of harvest I will tell the reapers, ‘First collect the weeds and tie them into bundles to burn them, but gather the wheat into my storehouse.’
translation:
  language: uk
  text: 'Нехай і те, й інше ростуть разом до жнив. А під час жнив я скажу женцям: «Спершу зберіть бур’яни[a] і зв’яжіть їх у в’язки, щоб спалити їх, а пшеницю зберіть до моєї комори».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «кукіль» — бур’ян, зовні схожий на пшеницю.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφετε
  choice: Нехай
  rationale: 'Передає дозвільний наказ: господар велить не втручатися, а дозволити обом рослинам рости.'
- source_word: συναυξάνεσθαι ἀμφότερα
  choice: і те, й інше росте разом
  rationale: Природно передає як значення «обидва», так і виразний компонент спільного росту в дієслові.
- source_word: μέχρι τοῦ θερισμοῦ
  choice: до жнив
  rationale: «Жнива» — природний сучасний український відповідник визначеного моменту збирання врожаю.
- source_word: ἐν καιρῷ τοῦ θερισμοῦ
  choice: під час жнив
  rationale: Передає часовий зміст і не обтяжує речення буквальним «у пору жнив».
- source_word: θερισταῖς
  choice: женцям
  rationale: Точний і усталений український термін для працівників, які жнуть.
- source_word: Συλλέξατε πρῶτον
  choice: Спершу зберіть
  rationale: Зберігає послідовність дій, позначену πρῶτον, у природній українській формі.
- source_word: τὰ ζιζάνια
  choice: бур’ян
  rationale: Зрозумілий широкому читачеві відповідник; імовірнішу конкретну ботанічну назву подано у примітці.
- source_word: δήσατε αὐτὰ εἰς δέσμας
  choice: зв’яжіть його у в’язки
  rationale: Передає конкретну дію зв’язування зібраного бур’яну в окремі в’язки.
- source_word: πρὸς τὸ κατακαῦσαι αὐτά
  choice: щоб спалити
  rationale: Чітко передає конструкцію мети, не додаючи до образу явного богословського тлумачення.
- source_word: τὸν δὲ σῖτον συναγάγετε εἰς τὴν ἀποθήκην μου
  choice: а пшеницю зберіть до моєї комори
  rationale: Зберігає протиставлення бур’яну й пшениці; «комора» природно позначає місце зберігання зерна.
theological_decisions:
- issue: Притчевий образ остаточного розділення
  choice: Збережено сільськогосподарський образ без прямого пояснення його есхатологічного значення.
  alternative: Уточнити в тексті, що спалення означає остаточний суд або знищення.
  rationale: Сам Ісус пояснює образ далі в розділі; у цьому вірші переклад має відтворювати притчу, не випереджаючи її тлумачення.
translation_notes:
  register: Сучасна, ясна й гідна українська мова. Форми «жнива» та «женці» зберігають природний сільськогосподарський колорит; синтаксис прямої мови залишається простим і доступним.
