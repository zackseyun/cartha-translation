  yaml_path: translation/nt/matthew/013/006.yaml
  text: But when the sun rose[a], it was scorched, and because it had no root, it withered away.
translation:
  language: uk
  text: Та коли зійшло сонце, посіяне було обпалене й, оскільки не мало кореня, зів’яло.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «засохло».'
    reason: Лексична альтернатива для ἐξηράνθη, яке в контексті рослини може означати в’янення або висихання.
lexical_decisions:
- source_word: ἡλίου δὲ ἀνατείλαντος
  choice: Та коли зійшло сонце
  rationale: Родовий абсолют передає часову обставину; «та» природно зберігає легкий перехід або протиставлення, виражене δέ.
- source_word: ἐκαυματίσθη
  choice: воно було обпалене
  rationale: Пасивна форма καυματίζω означає ушкодження сильною спекою; «було обпалене» зберігає пасивність і добре відповідає образу рослини.
- source_word: διὰ τὸ μὴ ἔχειν
  choice: оскільки не мало
  rationale: Конструкція διά з артикльованим інфінітивом виражає причину; підрядне речення природно передає її сучасною українською.
- source_word: ῥίζαν
  choice: кореня
  rationale: Збережено однину грецького іменника; заперечна конструкція українською природно вимагає родового відмінка.
- source_word: ἐξηράνθη
  choice: зів’яло
  rationale: У контексті рослини ξηραίνω означає всихання або в’янення; «зів’яло» природно передає видимий наслідок, а буквальніше «засохло» подано у примітці.
