translation:
  language: uk
  text: А ваші очі блаженні, бо бачать, і ваші вуха блаженні, бо чують.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «А ваші очі блаженні, що бачать, і ваші вуха блаженні, що чують». Грецький сполучник тут можна передати також як «що».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: А
  rationale: У контексті позначає протиставлення тим, хто дивиться й слухає, але не сприймає; українське «А» природно й без надмірного підсилення передає цей перехід.
- source_word: μακάριοι
  choice: блаженні
  rationale: Зберігає характерну для євангельських висловів мову Божого благовоління, а не лише суб’єктивного щастя.
- source_word: οἱ ὀφθαλμοὶ ὑμῶν
  choice: ваші очі
  rationale: Природний український порядок слів, що зберігає наголос на очах учнів.
- source_word: ὅτι βλέπουσιν
  choice: бо бачать
  rationale: ὅτι тут найприродніше розуміти причинно; «бо» стисло й гідно передає підставу названого блаженства.
- source_word: τὰ ὦτα ὑμῶν
  choice: ваші вуха
  rationale: Природний український відповідник із паралелізмом до «ваші очі».
- source_word: ὅτι ἀκούουσιν
  choice: бо чують
  rationale: Причинне «бо» зберігає синтаксичний паралелізм і простоту грецького вислову.
- source_word: βλέπουσιν / ἀκούουσιν
  choice: бачать / чують
  rationale: Буквальні чуттєві дієслова дають контекстові розкрити духовний вимір, не додаючи до самого вірша «розуміють» чи «сприймають».
theological_decisions:
- issue: Чи робити бачення і слухання явно духовними
  choice: Залишити буквальні слова «бачать» і «чують».
  alternative: Передати як «сприймають» і «розуміють».
  rationale: Хоча контекст пов’язує бачення та слухання з розумінням, сам вірш уживає прості дієслова зору й слуху. Буквальний переклад зберігає богословську напругу та не пояснює текст замість автора.
- issue: Значення ὅτι в обох частинах
  choice: 'Передати причинно: «бо».'
  alternative: 'Передати з’ясувально: «що бачать… що чують».'
  rationale: 'Причинне прочитання найкраще відповідає контекстові: очі й вуха названі блаженними з огляду на те, що вони бачать і чують. Водночас примітка зберігає можливий інший синтаксичний відтінок.'
translation_notes:
  register: Сучасна стандартна українська мова; стислий, урочистий, але зрозумілий виклад. Еліптичне тире в другій частині природно відтворює паралелізм без зайвого повтору присудка.
