  text: οὐχ οὗτός ἐστιν ὁ τοῦ τέκτονος υἱός; ⸀οὐχ ἡ μήτηρ αὐτοῦ λέγεται Μαριὰμ καὶ οἱ ἀδελφοὶ αὐτοῦ Ἰάκωβος καὶ ⸀Ἰωσὴφ καὶ Σίμων καὶ Ἰούδας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/055.yaml
  text: Is this not the carpenter’s son? Is not his mother called Mary[b][a], and his brothers James and Joseph and Simon and Judas?
translation:
  language: uk
  text: Хіба він не син теслі? Хіба його матір не звуть Марією, і його брати[a] — Яків, Йосип[b], Симон та Юда?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «родичі». Грецьке слово зазвичай означає «брати», але дехто розуміє його тут у ширшому значенні.
    reason: lexical_alternative
  - marker: b
    text: 'У деяких рукописах: «Йосій» замість «Йосип».'
    reason: textual_variant
lexical_decisions:
- source_word: τέκτονος
  choice: теслі
  rationale: Грецьке τέκτων означає ремісника, який працює передусім із деревом або в будівництві. «Тесля» — природний і традиційний український відповідник у цьому контексті.
- source_word: υἱός
  choice: син
  rationale: Безпосередній родинний контекст однозначно вказує на звичайне значення «син».
- source_word: λέγεται
  choice: звати
  rationale: У вислові про ім’я пасивне λέγεται природно передається українською безособовою конструкцією «звати».
- source_word: Μαριὰμ
  choice: Марія
  rationale: Ужито усталену українську форму новозавітного імені.
- source_word: ἀδελφοὶ
  choice: брати
  rationale: Звичайне значення слова — «брати». Переклад не розв’язує богословську суперечку про точний характер спорідненості; ширшу можливість зазначено у примітці.
- source_word: Ἰάκωβος
  choice: Яків
  rationale: Усталена українська біблійна форма імені Ἰάκωβος.
- source_word: Ἰωσὴφ
  choice: Йосип
  rationale: Відповідає читанню SBLGNT Ἰωσήφ; інше рукописне читання подано у примітці.
- source_word: Σίμων
  choice: Симон
  rationale: Усталена українська форма цього грецького імені.
- source_word: Ἰούδας
  choice: Юда
  rationale: Усталена українська новозавітна форма імені, яка без додаткового тлумачення відтворює грецьке Ἰούδας.
- source_word: οὐχ ... ;
  choice: Хіба ... не ...? Хіба ... не ...?
  rationale: Частка вводить риторичні запитання, що очікують ствердної відповіді; конструкція з «хіба» природно передає це українською.
theological_decisions:
- issue: Значення ἀδελφοὶ αὐτοῦ щодо родини Ісуса
  choice: У головному тексті перекладено «його брати»
  alternative: «його родичі» або «його близькі родичі»
  rationale: Основне лексичне значення ἀδελφοί — «брати». Такий переклад зберігає формулювання джерела й не вирішує за читача питання про точний характер спорідненості; ширше можливе розуміння наведено у примітці.
translation_notes:
  register: Сучасна літературна українська мова з природними риторичними запитаннями. Займенники щодо Ісуса подано з малої літери, без додавання конфесійно зумовленої почесної графіки. Еліптична конструкція «а його брати — ...» зберігає перелік грецького тексту й звучить природно українською.
