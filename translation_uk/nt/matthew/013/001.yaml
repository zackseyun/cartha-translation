  text: ⸀Ἐν τῇ ἡμέρᾳ ἐκείνῃ ἐξελθὼν ὁ Ἰησοῦς ⸀τῆς οἰκίας ἐκάθητο παρὰ τὴν θάλασσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/001.yaml
  text: On that day Jesus went out of the house and sat beside the sea[a][b].
translation:
  language: uk
  text: Того дня Ісус вийшов із дому й сидів біля моря.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «Того самого дня», якщо цей вислів розуміти як наголос на безпосередньому зв’язку з попередніми подіями, а не лише як позначення часу.
    reason: alternative_reading
  - marker: b
    text: Або «при морі». Грецький вислів означає місце поблизу моря, не уточнюючи відстані від берегової лінії.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: Того дня
  rationale: Природний український часовий зворот, який точно передає вказівку на день без додавання окремого наголосу на тотожності дня.
- source_word: ἐξελθὼν
  choice: вийшов
  rationale: Аористовий дієприкметник позначає дію, що передує головній; сурядна конструкція природно передає це українською.
- source_word: τῆς οἰκίας
  choice: із дому
  rationale: Родовий відмінок при ἐξέρχομαι позначає місце, з якого вийшли; «із дому» є природним і точним відповідником.
- source_word: ἐκάθητο
  choice: сидів
  rationale: Імперфект змальовує тривалу або фонову дію; недоконаний вид «сидів» зберігає цю аспектуальність без зайвої описовості.
- source_word: παρὰ τὴν θάλασσαν
  choice: біля моря
  rationale: παρά з акузативом тут означає розташування поблизу моря, не уточнюючи відстані до берега.
- source_word: ὁ Ἰησοῦς
  choice: Ісус
  rationale: Особове ім’я передано усталеною українською біблійною формою.
theological_decisions: []
translation_notes:
  register: Сучасна стандартна українська; виклад природний, стислий і гідний. Сполука «й сидів» уникає збігу голосних. Назву водойми не конкретизовано як озеро, щоб зберегти лексему θάλασσα та звичну для євангельського тексту назву «море».
