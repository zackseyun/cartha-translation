  text: Have you understood all these things? They said to him[a], “Yes.”
translation:
  language: uk
  text: '«Чи зрозуміли[a] ви все це?» Вони сказали Йому: «Так».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Чи ви розумієте все це?»'
    reason: 'Лексико-аспектуальна альтернатива: український теперішній час природно передає актуальний стан розуміння, тоді як основний текст точніше зберігає завершальний відтінок грецького аориста.'
lexical_decisions:
- source_word: Συνήκατε
  choice: Чи ви зрозуміли
  rationale: Аорист дійсного способу, друга особа множини, у цьому запитанні природно вказує на досягнуте до цієї миті розуміння. Український доконаний вид «зрозуміли» зберігає цей відтінок.
- source_word: ταῦτα πάντα
  choice: все це
  rationale: Природний сучасний український відповідник середнього роду множини з πᾶς; він охоплює всі щойно викладені притчі та настанови без зайвої конкретизації.
- source_word: λέγουσιν αὐτῷ
  choice: Вони відповіли Йому
  rationale: Історичний теперішній передано минулим часом, природним для української оповіді. Дієслово «відповіли» контекстуально точно передає репліку у відповідь на запитання; αὐτῷ відтворено займенником «Йому».
- source_word: Ναί
  choice: Так
  rationale: Прямий відповідник стверджувальної частки; жодного титулу, як-от «Господи», грецький текст не містить.
theological_decisions:
- issue: Чи додавати до відповіді учнів шанобливий титул
  choice: Залишити просту відповідь «Так».
  alternative: «Так, Господи».
  rationale: У SBLGNT наявна лише частка Ναί. Додавання титулу внесло б у текст відсутній у джерелі побожний або богословський елемент.
translation_notes:
  register: Сучасна стандартна українська, ясний і гідний оповідний стиль. Порядок слів у запитанні природний для живої української мови; велика літера в займеннику «Йому» вжита як усталена шаноблива біблійна норма, не додаючи окремого титулу.
