lexical_decisions:
- source_word: ἄλλα δὲ
  choice: Інше зерно
  rationale: Форма середнього роду множини еліптично відсилає до посіяного зерна з попереднього вірша; українською для ясності природно додати «зерно».
- source_word: ἔπεσεν
  choice: впало
  rationale: Передає просте значення дієслова в образі притчі без пояснювального розширення «було посіяне».
- source_word: ἐπὶ τὰ πετρώδη
  choice: на кам’янисті місця
  rationale: Зберігає множину й буквальний образ кам’янистих ділянок; примітка пояснює, що йдеться про тонкий шар ґрунту над скелею.
- source_word: ὅπου οὐκ εἶχεν γῆν πολλήν
  choice: де було небагато ґрунту
  rationale: Безособова українська конструкція природно передає нестачу ґрунту, не нав’язуючи неявного підмета грецького речення.
- source_word: καὶ εὐθέως ἐξανέτειλεν
  choice: і відразу зійшло
  rationale: «Відразу» зберігає часову силу εὐθέως, а «зійшло» є звичним українським словом про проростання насіння.
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: бо ґрунт був неглибокий
  rationale: Природно передає причинну конструкцію та образ недостатньої глибини ґрунту, не змінюючи причинного зв’язку.
