  yaml_path: translation/nt/matthew/013/056.yaml
  text: And are not all his sisters with us? Where then did this man get all these things?[a]
translation:
  language: uk
  text: І хіба не всі Його сестри серед нас? Звідки ж у цього все це?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або, за ширшим тлумаченням, «родички». Грецьке слово тут зазвичай означає «сестри», хоча дехто розуміє його ширше з огляду на пізніші богословські дискусії.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφαὶ
  choice: сестри
  rationale: Звичайне родинне значення слова природно відповідає контексту, де мешканці згадують членів родини Ісуса.
- source_word: οὐχὶ πᾶσαι
  choice: хіба не всі
  rationale: Передає риторичне запитання, що очікує ствердної відповіді, та зберігає наголос на всіх сестрах.
- source_word: πρὸς ἡμᾶς
  choice: живуть серед нас
  rationale: У контексті рідного поселення вислів позначає присутність і належність до місцевої громади; дієслово «живуть» природно робить цей зміст явним українською.
- source_word: πόθεν οὖν
  choice: Звідки ж
  rationale: «Звідки» прямо передає питання про джерело, а частка «ж» природно виражає висновковий перехід οὖν.
- source_word: τούτῳ
  choice: у Нього
  rationale: Українська конструкція «звідки у Нього» природно передає давальний займенник у питанні про джерело того, чим Ісус володіє; контекст чітко визначає особу.
- source_word: ταῦτα πάντα
  choice: все це
  rationale: Природний український відповідник збірного посилання на щойно згадані мудрість і могутні діла.
theological_decisions:
- issue: Кого названо сестрами Ісуса
  choice: Передати ἀδελφαὶ у звичайному значенні як «сестри».
  alternative: «Родички» або «двоюрідні сестри».
  rationale: Безпосередній лексичний і контекстуальний сенс — «сестри»; переклад не повинен вирішувати пізніші богословські суперечки шляхом розширення значення слова.
translation_notes:
  register: Сучасна, природна й гідна українська мова. Риторичний характер першого запитання збережено конструкцією «хіба не»; друге сформульовано стисло, без додавання пояснення про мудрість і могутні діла з попереднього контексту.
