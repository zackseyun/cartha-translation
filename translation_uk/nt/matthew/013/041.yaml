  text: ἀποστελεῖ ὁ υἱὸς τοῦ ἀνθρώπου τοὺς ἀγγέλους αὐτοῦ, καὶ συλλέξουσιν ἐκ τῆς βασιλείας αὐτοῦ πάντα τὰ σκάνδαλα καὶ τοὺς ποιοῦντας τὴν ἀνομίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/041.yaml
  text: The Son of Man will send out his angels[a], and they will gather out of his kingdom all causes of stumbling and those who practice lawlessness[b],
translation:
  language: uk
  text: Син Людський пошле своїх ангелів, і вони зберуть із його Царства все, що веде до гріха[a], і тих, хто чинить беззаконня[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «усі камені спотикання». Грецьке σκάνδαλα може означати людей, речі чи впливи, через які інші грішать або відпадають.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «тих, хто робить беззаконня». Вислів може позначати беззаконня як характерну, постійну поведінку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: пошле
  rationale: Майбутній час дієслова ἀποστέλλω передає посилання уповноважених виконавців; українське «пошле» природне й точне в цьому контексті.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Син Людський
  rationale: Усталений український відповідник титулу, який зберігає його формулювання та зв’язок з образом із книги Даниїла.
- source_word: τοὺς ἀγγέλους αὐτοῦ
  choice: своїх ангелів
  rationale: У контексті есхатологічного суду ἄγγελοι означає небесних ангелів, а не людських посланців. Зворотний займенник «своїх» природно вказує на належність підметові.
- source_word: συλλέξουσιν
  choice: зберуть
  rationale: Відповідає образові збирання під час жнив у поясненні притчі та природно звучить українською.
- source_word: ἐκ τῆς βασιλείας αὐτοῦ
  choice: із його Царства
  rationale: Прийменник ἐκ виражає вилучення зсередини сфери його Царства; «із» точно передає цей просторовий відтінок.
- source_word: πάντα τὰ σκάνδαλα
  choice: все, що веде до гріха
  rationale: Передає активне значення σκάνδαλα як усього, що стає причиною гріха або відпадіння, не звужуючи вислів лише до суб’єктивної образи.
- source_word: τοὺς ποιοῦντας τὴν ἀνομίαν
  choice: тих, хто чинить беззаконня
  rationale: Зберігає предметне значення ἀνομία — зневагу до Божого закону — та характерну дію, виражену субстантивованим дієприкметником теперішнього часу.
theological_decisions:
- issue: Передача титулу ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Син Людський
  alternative: Людський Син; Людина
  rationale: Традиційний відповідник зберігає титульне й апокаліптичне звучання та можливий зв’язок із Даниїла 7, не перетворюючи титул на пояснювальний парафраз.
- issue: Обсяг значення σκάνδαλα в контексті суду
  choice: все, що веде до гріха
  alternative: усі камені спотикання; усі причини падіння
  rationale: Грецький вислів може охоплювати людей, впливи або речі, які спричиняють гріх чи відпадіння. Обране формулювання зберігає цей широкий причинний зміст.
- issue: Характер дії в τοὺς ποιοῦντας τὴν ἀνομίαν
  choice: тих, хто чинить беззаконня
  alternative: тих, хто живе в беззаконні
  rationale: Обраний варіант ближчий до грецької форми й не перебільшує аспектуального значення теперішнього дієприкметника, водночас допускаючи характерну, повторювану поведінку.
translation_notes:
  register: Сучасна літературна українська з урочистим, але зрозумілим біблійним звучанням. Титул «Син Людський» і слово «Царство» подано з великої літери як усталені значущі назви; займенники щодо Сина Людського не капіталізовано, щоб не додавати відсутньої в грецькому тексті конфесійної графічної ознаки. Маркери приміток поставлено біля відповідних висловів σκάνδαλα та ἀνομία; розташування маркера [a] після «ангелів» в англійському консультаційному тексті не відповідає змісту його примітки.
