  text: ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου, καὶ τοῖς ὠσὶν βαρέως ἤκουσαν, καὶ τοὺς ὀφθαλμοὺς αὐτῶν ἐκάμμυσαν· μήποτε ἴδωσιν τοῖς ὀφθαλμοῖς καὶ τοῖς ὠσὶν ἀκούσωσιν καὶ τῇ καρδίᾳ συνῶσιν καὶ ἐπιστρέψωσιν, καὶ ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/015.yaml
  text: For this people's heart has grown dull[a], and with their ears they hear heavily, and they have closed their eyes, lest they should see with their eyes and hear with their ears and understand with their heart and turn back[c][b], and I will heal them.
translation:
  language: uk
  text: Бо серце цього народу огрубіло, вони ледве чують вухами й очі свої заплющили, щоб вони не побачили очима, не почули вухами, не зрозуміли серцем і не навернулися[a], і Я зцілю їх[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «повернулися».'
    reason: lexical_alternative
  - marker: b
    text: 'Цитата з Ісаї 6:9–10. Усе закінчення можна також перекласти: «інакше вони побачили б очима, почули б вухами, зрозуміли б серцем, повернулися б — і Я зцілив би їх».'
    reason: cross_reference_and_translation_alternative
lexical_decisions:
- source_word: ἐπαχύνθη
  choice: огрубіло
  rationale: Дієслово буквально означає «стало товстим», а в сполученні із «серцем» передає нечутливість і нездатність сприймати; «огрубіло» зберігає образ та природно звучить українською.
- source_word: καρδία
  choice: серце
  rationale: Збережено звичний біблійний образ внутрішньої людини як осередку розуміння й налаштованості.
- source_word: βαρέως ἤκουσαν
  choice: ледве чують
  rationale: Буквально «тяжко почули»; українське «ледве чують» природно передає утруднене або ослаблене слухання без неприродної кальки.
- source_word: ἐκάμμυσαν
  choice: заплющили
  rationale: Передає свідому активну дію людей щодо власних очей.
- source_word: μήποτε
  choice: щоб не
  rationale: Природний український відповідник, який зберігає негативну цільово-наслідкову силу вислову та не усуває його богословської напруги.
- source_word: ἐπιστρέψωσιν
  choice: навернутися
  rationale: Передає поворот або повернення до Бога без спеціалізованого церковного формулювання; можливий ширший відповідник зазначено у примітці.
- source_word: ἰάσομαι
  choice: Я зцілив
  rationale: У залежності від μήποτε грецький майбутній час природно передано українською як потенційний наслідок, що не настав у заперечній конструкції.
theological_decisions:
- issue: Напруга між судовим зачерствінням і людською відповідальністю
  choice: щоб не побачити… не навернутися — і Я не зцілив їх
  alternative: інакше вони побачили б… навернулися б, і Я зцілив би їх
  rationale: Основний текст зберігає поверхневу силу μήποτε та активну роль людей, які самі заплющили очі. Примітка подає умовно-наслідкове прочитання, не вирішуючи богословської напруги.
translation_notes:
  register: Сучасна літературна українська з гідним біблійним звучанням. Збережено паралелізм «очима — вухами — серцем» і людську дію в «очі свої заплющили». Уникнуто буквальної, але неприродної кальки «тяжко почули».
