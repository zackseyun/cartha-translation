lexical_decisions:
- source_word: Πάλιν
  choice: І ще
  rationale: Позначає наступну притчу в послідовності; природно пов’язує її з попередніми словами.
- source_word: ὁμοία ἐστὶν
  choice: подібне до
  rationale: Природна українська формула порівняння, що зберігає образний характер вислову.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Царство Небесне
  rationale: Усталений і зрозумілий український відповідник характерного для Матвія вислову без заміни на «Царство Боже».
- source_word: σαγήνῃ
  choice: невода
  rationale: Грецьке слово означає великий рибальський невід, а не просто будь-яку сітку.
- source_word: βληθείσῃ εἰς τὴν θάλασσαν
  choice: закинутого в море
  rationale: Зберігає пасивний дієприкметниковий образ і буквально передає θάλασσα як «море».
- source_word: ἐκ παντὸς γένους συναγαγούσῃ
  choice: що зібрав усяку всячину
  rationale: Український вислів природно передає різнорідність улову, не вставляючи прямо відсутнього в грецькому тексті слова «риба»; конкретний зміст визначає рибальський образ.
theological_decisions:
- issue: Значення вислову «ἡ βασιλεία τῶν οὐρανῶν»
  choice: Збережено «Царство Небесне».
  alternative: Царство Боже; небесне царювання
  rationale: Збережено характерне Матвієве формулювання, не ототожнюючи його в самому перекладі з альтернативним висловом і не звужуючи до самої дії царювання.
- issue: Неявний об’єкт дієслова συναγαγούσῃ
  choice: Не додавати до основного тексту слово «риба», а передати різнорідний улов висловом «усяку всячину».
  alternative: що зібрав рибу всякого виду
  rationale: Грецький текст не називає об’єкта прямо. Рибальський контекст безсумнівно має на увазі улов, але основний текст зберігає граматичну неявність, а примітка пояснює образ.
translation_notes:
  register: Сучасна, гідна й загальнозрозуміла українська. «Невід» є точним традиційним рибальським терміном; примітка допомагає читачам, яким він може бути менш знайомий. Вислів «усяку всячину» природний, але не розмовно-знижений у цьому контексті та добре передає змішаний улов.
