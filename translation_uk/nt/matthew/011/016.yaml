lexical_decisions:
- source_word: Τίνι δὲ ὁμοιώσω
  choice: А з чим Мені порівняти
  rationale: Давальний питального займенника позначає предмет порівняння; «з чим ... порівняти» природно передає українською риторичне майбутнє ὁμοιώσω. «А» відтворює м’який перехід δέ без надмірного протиставлення.
- source_word: τὴν γενεὰν ταύτην
  choice: це покоління
  rationale: Усталений і точний відповідник для сучасників, узятих як характерна спільнота.
- source_word: ὁμοία ἐστὶν
  choice: Воно подібне до
  rationale: Прямо передає предикативне значення подібності та узгоджується з українським середнім родом слова «покоління».
- source_word: παιδίοις καθημένοις
  choice: дітей, що сидять
  rationale: Природна українська конструкція, яка зберігає загальне значення «діти» та тривалу сцену, виражену дієприкметником.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: на ринкових площах
  rationale: ἀγορά означає публічний простір для торгівлі й громадського зібрання; «ринкові площі» точніше відтворює місце, ніж сучасне «ринки», яке може означати торговельні заклади.
- source_word: ἃ προσφωνοῦντα
  choice: і гукають
  rationale: Особова форма природна українською й передає голосне звертання в публічному місці; сполучник «і» зв’язує одночасні характеристики дітей.
- source_word: τοῖς ἑτέροις
  choice: до інших
  rationale: 'Збережено невизначеність грецького субстантивованого прикметника: контекст указує на інших дітей, але текст прямо цього не повторює.'
