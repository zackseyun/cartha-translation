  register: Сучасна нормативна українська мова з гідним, але доступним синтаксисом. Займенник «Мені» написано з великої літери відповідно до поширеної української біблійної видавничої практики щодо слів Ісуса. Кінцева двокрапка показує, що вислів дітей продовжується в наступному вірші.
