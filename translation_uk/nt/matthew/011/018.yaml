  text: ἦλθεν γὰρ Ἰωάννης μήτε ἐσθίων μήτε πίνων, καὶ λέγουσιν· Δαιμόνιον ἔχει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/018.yaml
  text: For John came neither eating nor drinking[a], and they say, ‘He has a demon.’
translation:
  language: uk
  text: 'Бо прийшов Іван: він не їв і не пив, а вони кажуть: «Він має демона».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Він має демона»; також можна перекласти: «Він одержимий демоном».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: прийшов
  rationale: Аорист ἔρχομαι позначає появу Івана серед людей; «прийшов» прямо й природно передає звичайне значення дієслова.
- source_word: γὰρ
  choice: бо
  rationale: Сполучник вводить пояснення до попередньої думки; «бо» природно зберігає цей пояснювальний зв’язок.
- source_word: Ἰωάννης
  choice: Іван
  rationale: Ужито усталену українську біблійну форму імені; з контексту йдеться про Івана Хрестителя.
- source_word: μήτε ἐσθίων μήτε πίνων
  choice: він не їв і не пив
  rationale: Фраза передає аскетичний спосіб життя Івана, не додаючи відсутніх у цьому вірші згадок про хліб чи вино. Особовий займенник і минулий час роблять стиснену грецьку конструкцію природною українською.
- source_word: καὶ λέγουσιν
  choice: а вони кажуть
  rationale: Теперішній час збережено як живе узагальнене «кажуть». Протиставний відтінок українського «а» природно показує реакцію людей на описаний спосіб життя, не змінюючи логічного зв’язку.
- source_word: Δαιμόνιον ἔχει
  choice: У ньому демон
  rationale: Це природний український відповідник буквального «має демона», який зберігає образ звинувачення й не перетворює його на твердження оповідача.
theological_decisions:
- issue: Передача звинувачення Δαιμόνιον ἔχει
  choice: У ньому демон
  alternative: Він одержимий демоном
  rationale: Текст наводить чуже звинувачення проти Івана, а не підтверджує його від імені оповідача. Вибраний варіант ближчий до грецького вислову й не додає інтерпретаційної визначеності слова «одержимий».
translation_notes:
  register: Сучасна, проста й гідна українська мова. Двокрапка після імені допомагає природно розгорнути грецьку дієприкметникову конструкцію; пряму мову оформлено за українською пунктуаційною нормою.
