  text: Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ἐγένοντο αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ μετενόησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/021.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works done among you had taken place in Tyre and Sidon, they would have repented long ago in sackcloth and ashes.
translation:
  language: uk
  text: Горе тобі, Хоразине! Горе тобі, Витсаїдо! Бо якби могутні діла[a], що сталися серед вас, сталися в Тирі та Сидоні, то вони давно покаялися б у мішковині та попелі.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «чудеса»; грецьке слово означає могутні діла, вияви сили.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαί σοι
  choice: Горе тобі
  rationale: Зберігає властиві пророчому вигуку водночас осуд і скорботу та природно звучить українською.
- source_word: Χοραζίν
  choice: Хоразине
  rationale: Усталене українське передавання назви Хоразин; кличний відмінок відповідає прямому звертанню.
- source_word: Βηθσαϊδά
  choice: Витсаїдо
  rationale: Усталене українське передавання назви Витсаїда; вжито природний кличний відмінок.
- source_word: ὅτι
  choice: Бо
  rationale: Вводить пояснення причини проголошеного горя.
- source_word: αἱ δυνάμεις
  choice: могутні діла
  rationale: Передає зв’язок слова δύναμις із силою, не звужуючи значення лише до сучасного поняття чуда; лексичну альтернативу подано у примітці.
- source_word: ἐγένοντο ... αἱ γενόμεναι
  choice: сталися ... що сталися
  rationale: Повторення дієслова γίνομαι збережено, оскільки українською воно звучить природно й чітко поєднує гіпотетичні події з подіями серед адресатів.
- source_word: ἐν ὑμῖν
  choice: серед вас
  rationale: Множина вказує на діла, здійснені серед мешканців цих міст, а не всередині них.
- source_word: πάλαι ἂν ... μετενόησαν
  choice: вони давно покаялися б
  rationale: Умовний спосіб передає контрфактичний характер вислову з ἄν, а «покаялися» природно й точно передає μετενόησαν у цьому контексті.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: у мішковині та попелі
  rationale: Зберігає конкретний біблійний образ зовнішніх ознак жалоби й покаяння зрозумілою сучасною мовою.
theological_decisions:
- issue: Характер порівняння з Тиром і Сидоном
  choice: Збережено як справжнє контрфактичне твердження, що підкреслює більшу відповідальність міст, які бачили могутні діла, але не покаялися.
  alternative: Сприймати вислів лише як риторичне перебільшення без реального порівняльного суду.
  rationale: Грецька умовна конструкція прямо формулює нереалізовану можливість і посилює осуд Хоразина та Витсаїди; переклад не додає подальших доктринальних висновків.
translation_notes:
  register: Сучасна стандартна українська мова з гідним біблійним звучанням. Кличні форми назв міст зберігають безпосередність звертання; образ мішковини й попелу залишено без культурного згладжування.
