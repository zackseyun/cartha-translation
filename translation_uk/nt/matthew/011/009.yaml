  text: ἀλλὰ τί ἐξήλθατε⸂; προφήτην ἰδεῖν⸃; ναί, λέγω ὑμῖν, καὶ περισσότερον προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/009.yaml
  text: But what did you go out to see? A prophet? Yes[a], I tell you, and more than a prophet.
translation:
  language: uk
  text: Але що ви вийшли побачити? Пророка? Так, кажу вам, і більше, ніж пророка.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «того, хто більший за пророка». Грецький вислів буквально: «більше, ніж пророка».'
    reason: Лексична альтернатива та пояснення еліптичної порівняльної конструкції.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Але
  rationale: Передає протиставний перехід від попереднього риторичного запитання й природно звучить сучасною українською.
- source_word: τί ἐξήλθατε
  choice: що ви вийшли
  rationale: τί тут означає «що», а не «чому»; запитання стосується того, кого або що люди вийшли побачити.
- source_word: ἰδεῖν
  choice: побачити
  rationale: Інфінітив мети після ἐξήλθατε; доконаний вид природно передає мету виходу.
- source_word: προφήτην
  choice: пророка
  rationale: Знахідний відмінок збережено як додаток до «побачити»; неозначеність у цьому риторичному запитанні українською не потребує окремого показника.
- source_word: ναί
  choice: Так
  rationale: Пряма й природна ствердна відповідь на риторичне запитання.
- source_word: λέγω ὑμῖν
  choice: кажу вам
  rationale: Зберігає звичну формулу мовлення без зайвої урочистості.
- source_word: καὶ περισσότερον προφήτου
  choice: і навіть більше, ніж пророка
  rationale: Порівняльна конструкція з родовим відмінком буквально виражає «більше від пророка». «Навіть» природно передає підсилювальну силу καὶ, а еліптична форма не додає відсутнього в грецькому тексті пояснення.
theological_decisions:
- issue: Статус Івана Хрестителя щодо пророків
  choice: Збережено вислів «більше, ніж пророка» без пояснення, у чому саме полягає ця вищість.
  alternative: «того, хто більший за пророка» або «більше, ніж звичайного пророка»
  rationale: Грецький текст підносить Івана понад категорію пророка, але в цій фразі не пояснює, як саме; стриманий переклад зберігає богословську напругу.
translation_notes:
  register: Сучасна стандартна українська; ясний, гідний і розмовно-природний риторичний стиль. Збережено послідовність коротких запитань і відповідь Ісуса.
