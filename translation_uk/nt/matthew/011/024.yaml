source:
  edition: SBLGNT
  text: πλὴν λέγω ὑμῖν ὅτι γῇ Σοδόμων ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ σοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/024.yaml
  text: But I tell you that it will be more tolerable for the land of Sodom on the day of judgment than for you[a].
translation:
  language: uk
  text: 'Та кажу вам: землі Содому буде легше в день суду, ніж тобі.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «буде стерпніше».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Та
  rationale: У цьому контексті слово вводить сильне протиставлення й урочистий висновок; «Та» природно передає цей перехід сучасною українською.
- source_word: λέγω ὑμῖν
  choice: кажу тобі
  rationale: Грецьке ὑμῖν формально є множиною, але адресат у контексті — персоніфіковане місто; українське «тобі» узгоджує формулу з явним одниною σοί наприкінці речення та передає пряму адресу без пояснювального розширення.
- source_word: γῇ Σοδόμων
  choice: землі Содомській
  rationale: Збережено явно названу γῇ («земля») та природно передано належність прикметниковою формою.
- source_word: ἀνεκτότερον
  choice: легше
  rationale: У безособовій українській конструкції «буде легше» природно виражає порівняльне значення «буде більш стерпно/зносно» у контексті суду.
- source_word: ἔσται
  choice: буде
  rationale: Простий майбутній час дієслова-зв’язки природно передано формою «буде».
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: в день суду
  rationale: Точно й природно позначає час майбутнього суду, не перетворюючи словосполучення на спеціальний термін.
- source_word: ἢ σοί
  choice: ніж тобі
  rationale: Збережено однину σοί та безпосереднє звертання до персоніфікованого міста.
theological_decisions:
- issue: Референт однини σοί та неузгодженість із формально множинним ὑμῖν
  choice: Передати звертання послідовною одниною «тобі», маючи на увазі персоніфіковане місто в найближчому контексті.
  alternative: «Кажу вам … ніж тобі», формально відтворивши зміну числа в межах речення; або «ніж вам», узгодивши все в множині.
  rationale: Найближчий контекст містить пророче звернення до міста, а завершальне σοί безсумнівно стоїть в однині. Послідовна українська однина зберігає риторичну силу звернення й не додає окремої групи адресатів.
- issue: Характер порівняння на суді
  choice: Зберегти порівняльне «буде легше», не уточнюючи міру, вид або тривалість покарання.
  alternative: Розгорнути як «покарання буде легшим».
  rationale: Оригінал не називає прямо покарання, тому переклад не повинен усувати закладену в ньому смислову відкритість.
translation_notes:
  register: Сучасна нормативна українська з урочистим, але зрозумілим біблійним звучанням. Конструкція «землі Содомській буде легше» природно зберігає експліцитне «земля» та порівняння оригіналу.
