base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/008.yaml
  text: But what did you go out to see? A man dressed in soft clothes? Look[b][a], those who wear soft clothes are in the houses of kings.
translation:
  language: uk
  text: Але що ви вийшли побачити? Чоловіка, одягненого в м’який одяг?[a] Ось ті, хто носить м’який одяг, перебувають у домах царів.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «одягненого в м’яке вбрання» чи «одягненого у вишуканий одяг». Грецький вислів буквально означає «у м’якому» й передбачає ніжний, розкішний одяг.'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «у царських палацах». Грецький текст буквально говорить про «доми царів».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Та
  rationale: Передає протиставний перехід у низці риторичних запитань природною сучасною українською мовою.
- source_word: τί ἐξήλθατε ἰδεῖν
  choice: що ви вийшли побачити
  rationale: Зберігає пряме значення τί та мету виходу, виражену інфінітивом ἰδεῖν.
- source_word: ἄνθρωπον
  choice: чоловіка
  rationale: Контекст прямо стосується Івана; чоловічий рід грецького іменника тут семантично доречний.
- source_word: ἐν μαλακοῖς ἠμφιεσμένον
  choice: одягненого в м’який одяг
  rationale: Формально відтворює образ «м’якого» вбрання, не звужуючи його одразу до розкішного чи дорогого.
- source_word: ἰδοὺ
  choice: Ось
  rationale: Природний сучасний засіб привернення уваги, що зберігає риторичну силу частки.
- source_word: οἱ τὰ μαλακὰ φοροῦντες
  choice: ті, хто носить м’який одяг
  rationale: Дієслово φορέω вказує на носіння одягу; повторення «м’який одяг» зберігає лексичний зв’язок з попередньою фразою.
- source_word: ἐν τοῖς οἴκοις τῶν βασιλέων εἰσίν
  choice: перебувають у царських домах
  rationale: Зберігає конкретний образ домів царів і водночас звучить природніше, ніж буквальне «у домах царів».
