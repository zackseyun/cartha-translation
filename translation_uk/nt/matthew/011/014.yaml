  yaml_path: translation/nt/matthew/011/014.yaml
  text: And if you are willing to accept it[b][a], he is Elijah who is to come.
translation:
  language: uk
  text: І якщо ви хочете це прийняти[a], він — Ілля, який має прийти.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «якщо ви готові це прийняти».'
    reason: lexical_alternative
  - marker: b
    text: Йдеться про Івана Хрестителя; пор. Малахії 4:5 і Матвія 17:10–13.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: І
  rationale: Зберігає простий грецький сполучник і зв’язок із попереднім висловом.
- source_word: εἰ θέλετε δέξασθαι
  choice: якщо ви готові це прийняти
  rationale: Конструкція θέλετε з інфінітивом виражає готовність або волю прийняти сказане. Займенник «це» природно передає невиражений у грецькому тексті об’єкт — твердження Ісуса про Івана.
- source_word: αὐτός
  choice: він
  rationale: Займенник указує на Івана Хрестителя; просте «він» природне українською, тоді як можливий наголос «саме він» контекстуально не обов’язковий.
- source_word: ἐστιν Ἠλίας
  choice: він — Ілля
  rationale: Прямо зберігає силу ототожнення в грецькому тексті, не послаблюючи його до «подібний до Іллі» чи «виконує роль Іллі».
- source_word: ὁ μέλλων ἔρχεσθαι
  choice: який має прийти
  rationale: Передає очікувану, пророчо спрямовану в майбутнє появу Іллі та зберігає формулювання без надмірного уточнення часу.
theological_decisions:
- issue: Ототожнення Івана Хрестителя з Іллею
  choice: 'Передати прямо: «він — Ілля, який має прийти»'
  alternative: «він виконує роль Іллі» або «він подібний до Іллі»
  rationale: Грецький текст прямо каже αὐτός ἐστιν Ἠλίας, але вводить твердження умовним закликом до сприйняття. Переклад зберігає і силу ототожнення, і богословську напругу, не пояснюючи її замість тексту.
translation_notes:
  register: Сучасна нормативна українська мова; виклад природний і гідний. Тире в конструкції «він — Ілля» виразно й без додаткового тлумачення передає іменну частину присудка.
