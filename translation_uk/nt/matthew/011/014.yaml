- from: І якщо ви готові це прийняти[a], він — Ілля, який має прийти.[b]
  to: І якщо ви хочете це прийняти[a], він — Ілля, який має прийти.[b]
  rationale: Змінено основний відповідник θέλετε на пряміше «хочете», а варіант «готові» перенесено до лексичної примітки. Примітку b переформульовано так, щоб вона лише вказувала на референта займенника та паралельні місця, не послаблюючи прямого вислову «він — Ілля».
