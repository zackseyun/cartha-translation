id: MAT.11.23
reference: Matthew 11:23
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ᾅδου ⸀καταβήσῃ· ὅτι εἰ ἐν Σοδόμοις ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν σοί, ⸀ἔμεινεν ἂν μέχρι τῆς σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/023.yaml
  text: And you[a], Capernaum, will you be exalted to heaven? You will go down to Hades. For if the mighty works done in you had happened in Sodom, it would have remained until today.
translation:
  language: uk
  text: І ти, Капернауме, хіба до неба будеш піднесений? До Аїду[a] зійдеш. Бо якби в Содомі сталися ті могутні діла, що сталися в тобі, він залишився б до сьогодні.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «до царства мертвих». Грецькою — «Аїд», не геєна.
    reason: Лексична альтернатива та розрізнення грецьких термінів для потойбіччя і суду.
lexical_decisions:
- source_word: Καφαρναούμ
  choice: Капернаум
  rationale: Ужито усталену українську форму біблійної географічної назви; у звертанні — кличний відмінок «Капернауме».
- source_word: μὴ ἕως οὐρανοῦ ὑψωθήσῃ;
  choice: хіба до неба будеш піднесений?
  rationale: μή із майбутнім пасивним дієсловом передано як риторичне запитання, що очікує заперечної відповіді. «Піднесений» зберігає пасивний стан і образ висоти та звеличення.
- source_word: ἕως ᾅδου καταβήσῃ
  choice: До Аїду зійдеш
  rationale: «Зійдеш» природно передає καταβήσῃ як рух униз. «Аїд» відтворює грецький термін без ототожнення його з геєною чи остаточним місцем покарання.
- source_word: δυνάμεις
  choice: могутні діла
  rationale: Вислів охоплює конкретні надзвичайні вчинки та виявлену в них силу, не звужуючи значення лише до сучасного розуміння слова «чудеса».
- source_word: γενόμεναι ἐν σοί
  choice: що сталися в тобі
  rationale: Збережено образ міста як особи, до якої звертаються, а γίνομαι передано нейтральним «статися».
- source_word: ἐγενήθησαν
  choice: якби … сталися
  rationale: Форма в умові передає нереальну ситуацію в минулому; українська конструкція з «якби» природно виражає цю контрфактичність.
- source_word: ἔμεινεν ἂν
  choice: він залишився б
  rationale: Чоловічий займенник узгоджено з українською назвою «Содом»; умовний спосіб відтворює нереальний наслідок із ἄν.
- source_word: μέχρι τῆς σήμερον
  choice: до сьогодні
  rationale: Сучасний і прямий відповідник часового вислову.
theological_decisions:
- issue: Передача ᾅδης
  choice: Аїд
  alternative: царство мертвих; пекло
  rationale: «Аїд» зберігає окремий грецький термін і не вносить пізніших доктринальних асоціацій слова «пекло»; пояснювальний відповідник подано у примітці.
- issue: Синтаксис μὴ ἕως οὐρανοῦ ὑψωθήσῃ
  choice: 'риторичне запитання: «хіба до неба будеш піднесений?»'
  alternative: 'стверджувальне заперечення: «не будеш піднесений до неба»'
  rationale: μή у цій конструкції природно вводить риторичне запитання з очікуваною заперечною відповіддю, зберігаючи виразність і певну синтаксичну напругу оригіналу.
translation_notes:
  register: Сучасна нормативна українська мова з гідним біблійним звучанням. Збережено персоніфіковане звертання до міста, просторові образи піднесення і сходження та контрфактичну умовну конструкцію.
