  text: Τότε ⸀ἤρξατο ὀνειδίζειν τὰς πόλεις ἐν αἷς ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ, ὅτι οὐ μετενόησαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/020.yaml
  text: Then he began to reproach the cities in which most of his mighty works had been done[a], because they did not repent.
translation:
  language: uk
  text: Тоді Він почав докоряти містам, у яких сталося найбільше Його могутніх діянь[a], за те, що вони не покаялися.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «чудес» чи «діл сили» (грец. δυνάμεις).
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Тоді
  rationale: Природний часовий маркер, що вводить наступний етап розповіді.
- source_word: ἤρξατο ὀνειδίζειν
  choice: почав докоряти
  rationale: Збережено початковий характер дії ἤρξατο; «докоряти» природно передає ὀνειδίζω, не посилюючи його до формального осуду.
- source_word: τὰς πόλεις ἐν αἷς
  choice: містам, у яких
  rationale: Точно й природно передає іменник πόλεις та відносну конструкцію ἐν αἷς.
- source_word: ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ
  choice: сталося найбільше Його могутніх діянь
  rationale: «Сталося» без доданого виконавця передає ἐγένοντο; «найбільше» тут означає найбільшу кількість, а «могутні діяння» зберігає зв’язок δυνάμεις із силою.
- source_word: ὅτι οὐ μετενόησαν
  choice: за те, що вони не покаялися
  rationale: Конструкція ясно виражає причину докору; «не покаялися» зберігає морально-духовну вагу μετανοέω без додаткового доктринального уточнення.
theological_decisions:
- issue: Передача δυνάμεις у контексті надприродних діл Ісуса
  choice: могутні діяння
  alternative: чудеса; діла сили
  rationale: «Могутні діяння» передає наголос грецького слова на силі й не звужує його до пізнішої категорії «чудес».
- issue: Передача μετενόησαν
  choice: не покаялися
  alternative: не змінили думок; не навернулися
  rationale: «Покаялися» є точним і природним відповідником у контексті належної морально-духовної відповіді на Ісусові діяння, без конфесійного уточнення змісту покаяння.
translation_notes:
  register: Сучасна нормативна українська мова, гідний і загальнозрозумілий біблійний стиль. Займенник «Він» та присвійний займенник «Його» написано з великої літери як усталену українську форму пошани; це не змінює змісту оригіналу.
