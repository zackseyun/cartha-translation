  text: and said to him, “Are you the Coming One, or should we expect another?”
translation:
  language: uk
  text: 'і сказав Йому: «Ти — Той, Хто має прийти,[a] чи нам чекати іншого?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «Той, Хто приходить» чи «Прийдешній». Грецький вислів може вживатися як месіанський титул.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: і сказав Йому
  rationale: Аорист εἶπεν природно передано минулим часом «сказав», αὐτῷ — давальним «Йому». Сполучник «і» відтворює зв’язок із попереднім контекстом, хоча в наведеному грецькому фрагменті окремого καί немає.
- source_word: Σὺ εἶ
  choice: Ти —
  rationale: Явний займенник σύ зберігає наголос на адресаті; українська питальна інтонація не потребує зміни порядку слів. Тире природно поєднує підмет з іменною частиною присудка.
- source_word: ὁ ἐρχόμενος
  choice: Той, Хто має прийти
  rationale: Субстантивований дієприкметник із артиклем може позначати очікувану постать і мати титульне, месіанське звучання. Формулювання природне українською та не підміняє грецький вислів прямим словом «Месія».
- source_word: ἢ
  choice: чи
  rationale: У прямому альтернативному запитанні українське «чи» природно передає розділовий сполучник ἢ.
- source_word: ἕτερον
  choice: іншого
  rationale: Знахідний відмінок субстантивованого прикметника передає «іншого / когось іншого» без додавання відсутнього в оригіналі іменника.
- source_word: προσδοκῶμεν
  choice: нам чекати
  rationale: Форма теперішнього часу в дорадчому запитанні природно передається українською конструкцією «нам чекати?». Дієслово охоплює і чекання, і сподіване очікування.
theological_decisions:
- issue: Месіанське або титульне значення ὁ ἐρχόμενος
  choice: Той, Хто має прийти
  alternative: той, хто приходить; Прийдешній; очікуваний
  rationale: Контекст підтримує розуміння вислову як позначення очікуваної месіанської постаті, але грецький текст буквально не називає Ісуса «Месією». Переклад зберігає водночас титульне звучання й лексичну відкритість вислову.
translation_notes:
  register: Сучасна літературна українська з гідним біблійним звучанням. Велика літера в «Той, Хто» позначає контекстуально титульне вживання, а не додає окремого лексичного значення.
