  yaml_path: translation/nt/matthew/011/004.yaml
  text: And Jesus answered them[a], “Go and report to John what you hear and see:”
translation:
  language: uk
  text: 'Ісус відповів їм[a]: «Підіть і розкажіть Іванові, що ви чуєте й бачите:»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або, буквальніше: «Ісус у відповідь сказав їм».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν αὐτοῖς
  choice: відповів їм
  rationale: Грецька оповідна формула буквально поєднує дієприкметник «відповівши» з дієсловом «сказав». Українською природно передати її одним дієсловом «відповів», а адресата — займенником «їм».
- source_word: Πορευθέντες
  choice: Підіть
  rationale: Дієприкметник перед наказовим способом має супровідну наказову силу; «Підіть» природно передає і рух, і послідовність доручення.
- source_word: ἀπαγγείλατε
  choice: розкажіть
  rationale: Дієслово означає повідомити або переказати звістку. У цьому контексті учні мають повернутися до Івана й розповісти про почуте та побачене; «розкажіть» звучить природно й точно.
- source_word: Ἰωάννῃ
  choice: Іванові
  rationale: Давальний відмінок позначає адресата повідомлення; форма «Іванові» відповідає сучасній українській нормі.
- source_word: ἃ ἀκούετε καὶ βλέπετε
  choice: що ви чуєте й бачите
  rationale: Збережено теперішній час і паралель двох дієслів сприйняття. «Що» природно передає субстантивований відносний займенник, а «й» милозвучно відтворює καί.
- source_word: καὶ … ὁ Ἰησοῦς
  choice: Ісус
  rationale: Початкове καί є простим оповідним сполучником, який в українському окремому вірші можна не виражати без зміни змісту. Артикль перед власним ім’ям не перекладається.
theological_decisions:
- issue: Передача формули ἀποκριθεὶς … εἶπεν
  choice: Ісус відповів їм
  alternative: Ісус у відповідь сказав їм
  rationale: Стислий варіант природний для сучасної української й не втрачає змісту. Буквальнішу синтаксичну форму наведено в примітці; богословської різниці між варіантами немає.
translation_notes:
  register: Сучасна стандартна українська, ясний і гідний біблійний стиль. Наказ «Підіть і розкажіть» передає грецьку послідовність без неприродної дієприкметникової конструкції; двокрапку наприкінці збережено, оскільки наступний вірш продовжує перелік.
