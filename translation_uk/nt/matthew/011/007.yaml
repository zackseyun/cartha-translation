  text: Τούτων δὲ πορευομένων ἤρξατο ὁ Ἰησοῦς λέγειν τοῖς ὄχλοις περὶ Ἰωάννου· Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι; κάλαμον ὑπὸ ἀνέμου σαλευόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/007.yaml
  text: 'As these men were going away[b][a], Jesus began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed being shaken by the wind?”'
translation:
  language: uk
  text: 'Коли вони відходили, Ісус почав говорити натовпам про Івана: «Що ви вийшли в пустелю подивитися? Очеретину, що хитається від вітру?[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Образ очеретини, що хитається від вітру, може вказувати на несталість або вагання; риторичне запитання передбачає заперечну відповідь щодо Івана.
    reason: cultural_note
lexical_decisions:
- source_word: Τούτων δὲ πορευομένων
  choice: Коли вони відходили
  rationale: Родовий абсолют передає одночасну, тривалу дію. Займенник «вони» природно відсилає до учнів Івана з попереднього контексту, не додаючи до тексту явного означення, якого немає в грецькому оригіналі.
- source_word: ἤρξατο ... λέγειν
  choice: почав говорити
  rationale: Конструкція ἄρχομαι з інфінітивом означає початок дії; «почав говорити» природно звучить у контексті звернення до натовпів.
- source_word: τοῖς ὄχλοις
  choice: натовпам
  rationale: Збережено множину грецького іменника та давальний напрямок мовлення.
- source_word: περὶ Ἰωάννου
  choice: про Івана
  rationale: Прийменник περί з родовим відмінком позначає тему мовлення; «про Івана» є природним сучасним відповідником.
- source_word: Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι;
  choice: На що ви ходили дивитися в пустелю?
  rationale: Τί витлумачено як питання «що?», а не «чому?». Зворот «на що ... дивитися» природно передає цілеспрямоване споглядання, виражене θεάομαι; «ходили» ідіоматично передає вихід із метою в минулому контексті.
- source_word: κάλαμον
  choice: очерет
  rationale: Звичайний український відповідник для κάλαμος у цій образній сцені; форма однини збережена.
- source_word: ὑπὸ ἀνέμου σαλευόμενον
  choice: що хитається від вітру
  rationale: Відносний зворот природно передає пасивний дієприкметник і тривалий рух; «від вітру» зберігає позначення рушійної сили через ὑπό.
theological_decisions:
- issue: Референт Τούτων у родовому абсолюті
  choice: Передано займенником «вони», з контексту — учні Івана
  alternative: «Коли ці чоловіки відходили» або «Коли учні Івана відходили»
  rationale: Грецький текст має вказівний займенник без іменника; українське «вони» читається природно й не вносить явного уточнення до основного тексту, хоча контекст чітко визначає референта.
- issue: Образ очерету, який хитає вітер
  choice: Образ залишено у формі риторичного запитання без пояснювального тлумачення в основному тексті
  alternative: Явно пояснити його як символ несталості або вагання
  rationale: Текст натякає на несталість, але не формулює цього прямо; переклад зберігає образ і богословсько-риторичну напругу, а пояснення подає в примітці.
translation_notes:
  register: Сучасна стандартна українська, природна й гідна оповідна мова. Збережено риторичну форму запитання, множину «натовпам» та образність оригіналу; уникнуто архаїзмів і конфесійно забарвлених уточнень.
