  source_fidelity: 'Текст точно передає всі наявні в грецькому фрагменті складники: оповідну частку δέ («А»), Івана як суб’єкта, попередню дію ἀκούσας («почувши»), місце («у в’язниці»), «діла Месії», а також відрядження учнів як посередників. Незавершеність речення коректно збережено, оскільки вислів продовжується в наступному вірші.'
