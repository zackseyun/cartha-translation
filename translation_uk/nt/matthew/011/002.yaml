id: MAT.11.2
reference: Matthew 11:2
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰωάννης ἀκούσας ἐν τῷ δεσμωτηρίῳ τὰ ἔργα τοῦ χριστοῦ πέμψας ⸀διὰ τῶν μαθητῶν αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/002.yaml
  text: When John heard in prison about the works of the Messiah[a], he sent word through his disciples
translation:
  language: uk
  text: А Іван, почувши у в’язниці про діла Месії[a], послав через своїх учнів
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «діла Христа».'
    reason: Альтернативна традиційна передача грецького титулу Χριστός.
lexical_decisions:
- source_word: δὲ
  choice: А
  rationale: Передає легкий оповідний перехід і протиставний відтінок частки δέ без додавання явного часового значення.
- source_word: ἀκούσας
  choice: почувши
  rationale: Дієприслівник природно передає попередню щодо головної дії подію, виражену аористовим дієприкметником.
- source_word: ἐν τῷ δεσμωτηρίῳ
  choice: у в’язниці
  rationale: Природний сучасний український відповідник із точним збереженням місця перебування.
- source_word: τὰ ἔργα
  choice: діла
  rationale: Широке значення охоплює могутні вчинки й служіння Ісуса та зберігає традиційний біблійний лексичний зв’язок із ἔργα.
- source_word: τοῦ χριστοῦ
  choice: Месії
  rationale: Χριστός тут функціонує як титул Помазанця, тому переклад «Месія» передає його зміст і єврейський контекст.
- source_word: πέμψας
  choice: послав
  rationale: Зберігає просте значення відрядження посланців; зміст переданого ними запитання розкривається в наступному вірші, тож додавати «звістку» не потрібно.
- source_word: διὰ τῶν μαθητῶν αὐτοῦ
  choice: через своїх учнів
  rationale: διά з родовим відмінком позначає посередництво; «своїх» природно й недвозначно відносить учнів до Івана.
theological_decisions:
- issue: Передача Χριστός
  choice: Месія
  alternative: Христос
  rationale: У цьому контексті слово є титулом і характеризує діла очікуваного Помазанця. Варіант «Христос» збережено у примітці як традиційну передачу.
translation_notes:
  register: Сучасна літературна українська з природним оповідним синтаксисом і стримано піднесеним біблійним регістром. Речення навмисно лишається синтаксично відкритим, оскільки думка продовжується в наступному вірші.
