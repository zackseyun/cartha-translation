  terminology: «Месія» є вдалим змістовим перекладом титулу τοῦ χριστοῦ в цьому контексті. «Діла» точно відповідає τὰ ἔργα й зберігає широкий зміст слова. Примітка належно фіксує традиційний варіант «Христос».
