  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ἄρατε τὸν ζυγόν μου ἐφ’ ὑμᾶς καὶ μάθετε ἀπ’ ἐμοῦ, ὅτι πραΰς εἰμι καὶ ταπεινὸς τῇ καρδίᾳ, καὶ εὑρήσετε ἀνάπαυσιν ταῖς ψυχαῖς ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/029.yaml
  text: Take my yoke upon you and learn from me[a], because I am gentle and humble in heart, and you will find rest for your souls.
translation:
  language: uk
  text: Візьміть Моє ярмо на себе й навчіться від Мене, бо Я лагідний і смиренний серцем, і ви знайдете спокій для своїх душ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄρατε τὸν ζυγόν μου ἐφ’ ὑμᾶς
  choice: Візьміть Моє ярмо на себе
  rationale: Передає наказ прийняти на себе ярмо, зберігаючи конкретний і центральний образ оригіналу; український вислів природний і не зводить дію до простого піднімання.
- source_word: μάθετε ἀπ’ ἐμοῦ
  choice: навчіться від Мене
  rationale: Прямо й природно передає наказ та ἀπό, охоплюючи навчання від Ісуса й учнівське наслідування без доданого тлумачення.
- source_word: ὅτι
  choice: бо
  rationale: Природно вводить пояснення, чому Ісус є Учителем, від якого слід навчатися.
- source_word: πραΰς
  choice: лагідний
  rationale: Передає незлобиву м’якість і відсутність суворої владності, не створюючи враження слабкості, яке може мати слово «покірний».
- source_word: ταπεινὸς τῇ καρδίᾳ
  choice: смиренний серцем
  rationale: Зберігає характеристику внутрішньої постави та природно відтворює давальний τῇ καρδίᾳ українським орудним.
- source_word: εὑρήσετε ἀνάπαυσιν
  choice: ви знайдете спокій
  rationale: Точно передає майбутню обітницю та зміст ἀνάπαυσις як спочинку, полегшення і внутрішнього спокою; у цьому реченні «знайти спокій» звучить природно.
- source_word: ταῖς ψυχαῖς ὑμῶν
  choice: для своїх душ
  rationale: Ідіоматично передає давальний відмінок і зберігає біблійний образ ψυχή, не звужуючи його лише до емоцій чи фізичного відпочинку.
theological_decisions:
- issue: Самоопис Ісуса у вислові πραΰς ... καὶ ταπεινὸς τῇ καρδίᾳ
  choice: Я лагідний і смиренний серцем
  alternative: Я лагідний і покірний серцем
  rationale: «Лагідний» і «смиренний серцем» передають характер Ісуса як незлобивий і позбавлений самозвеличення, не перетворюючи вислів на твердження про слабкість або підлеглість іншій людині.
- issue: Значення ἀνάπαυσις для ψυχαί
  choice: спокій для своїх душ
  alternative: відпочинок для своїх душ
  rationale: «Спокій» природніше позначає обіцяне внутрішнє полегшення, водночас не заперечуючи ширшого біблійного мотиву спочинку; метафізичних уточнень щодо «душі» не додано.
translation_notes:
  register: Сучасна стандартна українська мова, гідний і доступний біблійний стиль. Збережено метафору ярма та традиційний вислів про душі. Займенники, що стосуються Ісуса як мовця, подано з великої літери відповідно до поширеної української біблійної практики; це редакційна шаноблива конвенція, а не особливість грецького тексту.
