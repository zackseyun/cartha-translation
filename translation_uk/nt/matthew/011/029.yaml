  source_fidelity: 'Текст точно передає всі основні елементи грецького оригіналу: два накази («Візьміть», «навчіться»), образ ярма, пояснювальне «бо», самоопис Ісуса, майбутню обітницю та вислів про душі. «На себе» природно відтворює ἐφ’ ὑμᾶς у сполуці з «ярмо», а «для своїх душ» є нормативним ідіоматичним переданням давального ταῖς ψυχαῖς ὑμῶν.'
  naturalness: Фраза звучить природно в сучасній стандартній українській і водночас зберігає стриманий біблійний регістр. «Візьміть Моє ярмо на себе», «навчіться від Мене», «лагідний і смиренний серцем» та «знайдете спокій» є ясними й стилістично узгодженими.
  terminology: «Ярмо» належно зберігає центральну метафору. «Лагідний» добре передає πραΰς без небажаного відтінку слабкості. «Смиренний серцем» адекватно передає ταπεινὸς τῇ καρδίᾳ; «спокій для своїх душ» зберігає біблійно значущий образ ψυχαί, не додаючи конфесійного тлумачення.
