base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/017.yaml
  text: They say[a], ‘We played the flute for you, and you did not dance; we sang a lament[c][b], and you did not mourn.’
translation:
  language: uk
  text: 'Вони кажуть: «Ми грали вам на флейті, а ви не танцювали; ми співали жалобну пісню, а ви не били себе в груди[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Тобто не виявляли жалоби. Биття себе в груди було звичним жестом скорботи.
    reason: cultural_note
lexical_decisions:
- source_word: λέγουσιν
  choice: Вони кажуть
  rationale: Теперішній час зберігає жвавість прямої мови в межах порівняння.
- source_word: Ηὐλήσαμεν
  choice: Ми грали вам на сопілці
  rationale: Дієслово αὐλέω означає гру на духовому інструменті — флейті або сопілці. «Сопілка» природно звучить українською в сцені дитячої гри, не втрачаючи інструментального значення.
- source_word: ὑμῖν
  choice: вам
  rationale: Давальний відмінок природно передає спрямованість гри до інших учасників.
- source_word: ὠρχήσασθε
  choice: ви не танцювали
  rationale: Природний відповідник дієслова ὀρχέομαι; окремої зворотної семантики тут передавати не потрібно.
- source_word: ἐθρηνήσαμεν
  choice: ми співали жалобної пісні
  rationale: Передає ритуально-пісенний характер θρηνέω та зберігає паралель із грою на сопілці.
- source_word: ἐκόψασθε
  choice: ви не били себе в груди
  rationale: Середній стан κόπτω в контексті жалоби позначає тілесний жест скорботи. Буквальніший образ зберігає культурну конкретність оригіналу; значення пояснено у примітці.
