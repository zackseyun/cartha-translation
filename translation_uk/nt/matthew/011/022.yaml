id: MAT.11.22
reference: Matthew 11:22
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: πλὴν λέγω ὑμῖν, Τύρῳ καὶ Σιδῶνι ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/022.yaml
  text: But I tell you[a], it will be more tolerable for Tyre and Sidon on the day of judgment than for you.
translation:
  language: uk
  text: 'Але кажу вам: Тиру й Сидону в день суду буде легше[a], ніж вам.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «буде стерпніше».'
    reason: Лексичний варіант, який буквальніше передає значення ἀνεκτότερον — те, що легше витримати.
lexical_decisions:
- source_word: πλὴν
  choice: Але
  rationale: Передає сильний протиставний перехід до урочистого висновку й природно звучить сучасною українською.
- source_word: λέγω ὑμῖν
  choice: кажу вам
  rationale: Зберігає пряму особисту адресу та урочисту силу звичної для Євангелія від Матвія формули.
- source_word: Τύρῳ καὶ Σιδῶνι
  choice: Тиру й Сидону
  rationale: Давальний відмінок природно передає осіб, для яких суд буде легшим; назви міст ужито в нормативній українській формі.
- source_word: ἀνεκτότερον
  choice: легше
  rationale: Природний український відповідник у порівняльній конструкції, що передає думку про меншу тяжкість переживання суду. Буквальніший відтінок «стерпніше» наведено у примітці.
- source_word: ἔσται
  choice: буде
  rationale: Точно передає майбутній час і природно поєднується з предикативним прислівником «легше».
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: в день суду
  rationale: Чітко позначає час майбутнього суду та зберігає стислу форму грецького вислову.
- source_word: κρίσεως
  choice: суду
  rationale: Зберігає широкий судовий зміст κρίσις і не звужує його до самого лише засудження.
- source_word: ἢ ὑμῖν
  choice: ніж вам
  rationale: Стисло й природно завершує порівняння, зберігаючи множинне звертання, виражене контекстом.
theological_decisions:
- issue: Характер майбутнього суду
  choice: в день суду
  alternative: в день засудження
  rationale: Грецьке κρίσις означає судову подію ширше, ніж лише негативний вирок. Переклад не додає подробиць про природу чи перебіг цього суду.
translation_notes:
  register: Сучасна, стисла й гідна українська мова. Конструкція «буде легше» є природнішою для широкого кола читачів, а примітка зберігає буквальніший відтінок грецького прикметника.
