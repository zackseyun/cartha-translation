lexical_decisions:
- source_word: Δεῦτε
  choice: Прийдіть
  rationale: Природний український наказовий спосіб у значенні прямого запрошення; передає множину адресатів.
- source_word: πρός με
  choice: до мене
  rationale: Після дієслова руху πρός із знахідним відмінком природно позначає спрямування до особи.
- source_word: πάντες
  choice: всі
  rationale: Зберігає всеохопний характер запрошення без додаткового підсилення.
- source_word: οἱ κοπιῶντες
  choice: хто трудиться
  rationale: 'Передає активну й тривалу дію теперішнього дієприкметника: наполегливо працювати, докладати виснажливих зусиль.'
- source_word: πεφορτισμένοι
  choice: обтяжений
  rationale: Перфектний пасивний дієприкметник позначає тих, кого обтяжили і хто далі перебуває в такому стані. Форма однини узгоджується з українським відносним займенником «хто».
- source_word: κἀγὼ
  choice: і я
  rationale: Зберігає сполучення та виразний особовий підмет, не перебільшуючи наголосу.
- source_word: ἀναπαύσω
  choice: дам вам відпочинок
  rationale: Природно передає каузативний зміст — дати комусь спочити, полегшити його стан — і не звужує обіцянку лише до емоційного чи фізичного відновлення.
- source_word: ὑμᾶς
  choice: вам
  rationale: Українська конструкція «дати вам відпочинок» природно передає множинний об’єкт грецького дієслова.
theological_decisions:
- issue: Характер обіцяного відпочинку в ἀναπαύσω
  choice: «дам вам відпочинок» без уточнення його виду
  alternative: «освіжу вас»; «дам відпочинок вашим душам»
  rationale: Сам цей вірш не визначає відпочинок як винятково духовний, есхатологічний, емоційний або фізичний. Широке формулювання зберігає змістову й богословську багатозначність та не переносить у цей рядок уточнення з наступного контексту.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Збережено форму прямого запрошення, активний зміст κοπιῶντες і результуючий стан πεφορτισμένοι. Займенники на позначення Ісуса подано з малої літери відповідно до загальних норм сучасної української орфографії.
