base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/010.yaml
  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face, who will prepare your way before you.’'
translation:
  language: uk
  text: 'Це той, про кого написано: «Ось, Я посилаю Мого посланця перед Твоїм обличчям[a], і він приготує Твою дорогу перед Тобою».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або природніше: «перед Тобою» чи «попереду Тебе». Грецький текст буквально має «перед Твоїм обличчям», зберігаючи конкретний образ біблійної цитати.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός
  choice: Це той
  rationale: Природна українська ототожнювальна конструкція, що зберігає вказівний та емфатичний характер вислову.
- source_word: περὶ οὗ
  choice: про кого
  rationale: Звичний сучасний відповідник περί з родовим відмінком у значенні «про, щодо».
- source_word: γέγραπται
  choice: написано
  rationale: Усталена формула введення цитати зі Святого Письма; передає результативність грецького перфекта без неприродної громіздкості.
- source_word: Ἰδοὺ
  choice: Ось
  rationale: Природний і водночас гідний український відповідник, який привертає увагу та пасує до пророчої цитати.
- source_word: ἀποστέλλω
  choice: посилаю
  rationale: Теперішній час збережено буквально; в пророчому вислові він природно може мати близьке майбутнє значення.
- source_word: ἄγγελόν
  choice: посланця
  rationale: Контекст указує на людського посланця — Івана Хрестителя; «посланець» точно передає відповідне значення ἄγγελος.
- source_word: πρὸ προσώπου σου
  choice: перед Твоїм обличчям
  rationale: Зберігає конкретний образ грецького тексту та формальну текстуру біблійної цитати.
- source_word: κατασκευάσει
  choice: приготує
  rationale: Стислий природний відповідник дієслова зі значенням підготувати або зробити готовим.
- source_word: τὴν ὁδόν σου
  choice: Тобі дорогу
  rationale: Українська конструкція «приготувати комусь дорогу» природніша за буквальне «приготувати твою дорогу», водночас точно передає належність і ціль.
- source_word: ἔμπροσθέν σου
  choice: перед Тобою
  rationale: Прямий і стилістично відповідний переклад просторового вислову; зберігає його окремо від попереднього πρὸ προσώπου σου.
theological_decisions:
- issue: Подвійний просторовий вислів у цитаті
  choice: Збережено і «перед Твоїм обличчям», і «перед Тобою»
  alternative: 'Згладити обидва вислови до одного: «попереду Тебе»'
  rationale: Грецький текст містить дві окремі фрази — πρὸ προσώπου σου та ἔμπροσθέν σου. Їх збереження передає формальну структуру й наголос цитати, не усуваючи її повторності.
- issue: Займенники другої особи в божественній прямій мові
  choice: 'Великі літери: «Твоїм», «Тобі», «Тобою»'
  alternative: 'Малі літери: «твоїм», «тобі», «тобою»'
  rationale: У контексті цитати Бог звертається до Месії; великі літери відповідають поширеній українській біблійній видавничій традиції, не змінюючи змісту оригіналу.
translation_notes:
  register: Сучасна літературна українська з урочистим, але зрозумілим регістром пророчої цитати. Повторність просторових висловів навмисно збережено; поза цитатою використано природну конструкцію «Це той, про кого написано».
