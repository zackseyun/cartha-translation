  yaml_path: translation/nt/matthew/011/012.yaml
  text: But from the days of John the Baptist until now[a], the kingdom of heaven suffers violence, and violent men seize it.
translation:
  language: uk
  text: А від днів Івана Хрестителя й дотепер Царство Небесне зазнає насильства, і насильники захоплюють його.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Царство Небесне силоміць прокладає собі шлях, і ті, хто вживає силу, захоплюють його». Грецьке дієслово, перекладене як «зазнає насильства», можна також розуміти в середньому значенні.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπὸ δὲ
  choice: А від
  rationale: ἀπό позначає початкову точку, а δέ — м’який перехід у розповіді; «А від» природно передає обидва елементи без надмірного протиставлення.
- source_word: τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ
  choice: днів Івана Хрестителя
  rationale: Збережено грецький часовий зворот «дні» та усталене сучасне українське найменування Івана Хрестителя.
- source_word: ἕως ἄρτι
  choice: й дотепер
  rationale: Природний стислий відповідник, що виражає тривалість від часу Івана до моменту мовлення.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Небесне Царство
  rationale: Природний і усталений український відповідник характерного для Матвія вислову; передає царювання або царство, пов’язане з небесами, без дерев’яного відтворення множини.
- source_word: βιάζεται
  choice: зазнає насильства
  rationale: Дієслово допускає пасивне та середнє значення. У головному тексті обрано пасивне прочитання, яке природно узгоджується з наступною згадкою про насильників; інше прочитання подано у примітці.
- source_word: βιασταὶ
  choice: насильники
  rationale: Іменник позначає людей, які вдаються до сили або насильства. Українське «насильники» стисло зберігає негативний і силовий відтінок грецького слова.
- source_word: ἁρπάζουσιν αὐτήν
  choice: силою захоплюють його
  rationale: ἁρπάζω означає хапати або заволодівати силою. Додавання «силою» виразно передає закладений у дієслові примусовий характер, а займенник «його» узгоджено з родом слова «Царство».
theological_decisions:
- issue: Значення βιάζεται стосовно Небесного Царства
  choice: 'Пасивне прочитання в основному тексті: «Небесне Царство зазнає насильства»'
  alternative: 'Середнє або неперехідне прочитання: «Небесне Царство могутньо просувається вперед»'
  rationale: Грецька форма справді неоднозначна. Пасивне значення добре пов’язується з наступними словами про насильників, але середнє значення також має вагому лексичну й тлумачну підтримку. Примітка зберігає цю напругу, не видаючи спірне питання за однозначне.
translation_notes:
  register: Сучасна нормативна українська мова з гідним біблійним регістром. Синтаксис стислий і близький до грецького, але природний для пересічного читача. Неоднозначність ключового дієслова збережено через примітку.
