review_pass:
  verdict: revise
  source_fidelity: Основний текст загалом точно передає часові межі, пасивне прочитання βιάζεται та насильницький характер βιασταὶ / ἁρπάζουσιν. Однак примітка послаблює силу βιασταὶ, перекладаючи його як «рішучі люди», і «оволодівають» не цілком передає різке ἁρπάζουσιν («захоплюють, хапають»).
  naturalness: «Царство Небесне» є природнішим і усталенішим українським біблійним порядком слів, ніж «Небесне Царство». Вилучення додаткового «силою» після «насильники» робить фразу менш тавтологічною, не втрачаючи значення ἁρπάζουσιν.
  terminology: Ім’я «Іван Хреститель» і термін «Царство Небесне» відповідають сучасному українському біблійному вжитку. Неоднозначність βιάζεται належно збережено приміткою; її альтернативний переклад уточнено так, щоб не перетворювати «сильних/насильницьких» осіб на просто «рішучих».
  issues:
  - severity: medium
    issue: У примітці βιασταὶ передано як «рішучі люди».
    rationale: «Рішучі» описує внутрішню рису характеру, тоді як βιασταὶ має виразний відтінок сили, примусу або насильства. Це послаблює лексичний зв’язок із βιάζεται та ἁρπάζουσιν.
  - severity: low
    issue: «Небесне Царство» менш природне за «Царство Небесне».
    rationale: Обидва варіанти зрозумілі, але «Царство Небесне» — усталеніший нормативний український біблійний вислів.
  - severity: low
    issue: «Насильники силою захоплюють» стилістично дублює значення.
    rationale: Насильницький спосіб уже випливає з «насильники» та дієслова «захоплюють» у цьому контексті; додаток «силою» не потрібний для точності.
