  text: τυφλοὶ ἀναβλέπουσιν καὶ χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται καὶ κωφοὶ ἀκούουσιν, ⸀καὶ νεκροὶ ἐγείρονται καὶ πτωχοὶ εὐαγγελίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/005.yaml
  text: The blind receive sight and the lame walk[a], lepers are cleansed and the deaf hear[b], and the dead are raised and the poor have good news proclaimed to them.
translation:
  language: uk
  text: Сліпі прозрівають, кульгаві ходять, уражені проказою очищуються, глухі чують, мертві воскресають, а бідним звіщається добра звістка[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «бідним проповідується Євангеліє». Грецьке дієслово має пасивну форму: бідні є одержувачами доброї звістки.'
    reason: lexical_alternative
  - marker: b
    text: Цей перелік перегукується з Ісаї 35:5–6 та 61:1 і вказує на ознаки діяльності Месії.
    reason: cross_reference
lexical_decisions:
- source_word: τυφλοὶ ἀναβλέπουσιν
  choice: сліпі прозрівають
  rationale: «Прозрівають» природно передає відновлення або набуття зору в контексті зцілення, а не буквальне «дивляться вгору».
- source_word: χωλοὶ περιπατοῦσιν
  choice: кульгаві ходять
  rationale: Стисло відтворює субстантивований прикметник і теперішній час дієслова, зберігаючи ритм переліку.
- source_word: λεπροὶ καθαρίζονται
  choice: уражені проказою очищуються
  rationale: Описова назва людей уникає зведення особи до хвороби, а «очищуються» зберігає ширше фізичне й обрядове значення καθαρίζονται, якого не передало б саме «зцілюються».
- source_word: κωφοὶ ἀκούουσιν
  choice: глухі чують
  rationale: У сполученні з «чують» κωφοί однозначно означає глухих, а не німих.
- source_word: νεκροὶ ἐγείρονται
  choice: мертві воскресають
  rationale: Природний український біблійний вислів передає повернення мертвих до життя; форма не уточнює названого в реченні виконавця дії.
- source_word: πτωχοὶ εὐαγγελίζονται
  choice: бідним звіщається Добра Звістка
  rationale: Конструкція з давальним відмінком природно українською зберігає бідних як одержувачів звістки та передає пасивний зміст дієслова без пізнішого вузькотехнічного церковного терміна.
theological_decisions:
- issue: Передача εὐαγγελίζονται та зв’язок із поняттям Євангелія
  choice: бідним звіщається Добра Звістка
  alternative: бідним проповідується Євангеліє; бідні чують Добру Звістку
  rationale: Обраний варіант зберігає дієслівний зміст проголошення доброї звістки й пасивну перспективу адресатів, не звужуючи вислів до пізнішої церковної термінології.
- issue: Месіанське значення переліку чудес
  choice: залишити прямий перелік діянь без доданого твердження про сповнення пророцтва
  alternative: додати в основний текст пояснення, що цим сповнюється Ісая
  rationale: Грецький текст виразно перегукується з Ісаєю, але не містить у цьому вірші прямої формули сповнення; зв’язок належить зазначити в примітці, а не додавати до перекладу.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова зі стислим паралельним ритмом оригіналу. «Добра Звістка» написана з великих літер як усталене позначення проголошуваної спасительної звістки, однак примітка зберігає можливість традиційного терміна «Євангеліє».
