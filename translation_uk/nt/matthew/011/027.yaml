id: MAT.11.27
reference: Matthew 11:27
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς ἐπιγινώσκει τὸν υἱὸν εἰ μὴ ὁ πατήρ, οὐδὲ τὸν πατέρα τις ἐπιγινώσκει εἰ μὴ ὁ υἱὸς καὶ ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/027.yaml
  text: All things have been handed over to me by my Father[a], and no one knows the Son except the Father[b], nor does anyone know the Father except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: uk
  text: Усе передав Мені Мій Отець. Ніхто не знає[a] Сина, крім Отця; і Отця ніхто не знає[a], крім Сина й того, кому Син захоче[b] Його відкрити.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «повністю знає» чи «глибоко знає»; грецьке дієслово може вказувати на повне або близьке особисте знання.'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «вирішить» чи «воліє».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα
  choice: Усе
  rationale: Неозначений середній рід множини має всеохопний зміст; «усе» природно передає його без звуження сфери.
- source_word: μοι παρεδόθη ὑπὸ τοῦ πατρός μου
  choice: передав Мені Мій Отець
  rationale: Грецьку пасивну конструкцію природно передано українською активною зі збереженням одержувача, діяча та завершеного передання.
- source_word: ἐπιγινώσκει
  choice: знає
  rationale: У цьому контексті дієслово означає особисте й справжнє знання, але саме по собі не вимагає доданого прислівника «повністю»; можливий сильніший відтінок зазначено у примітці.
- source_word: εἰ μὴ
  choice: крім
  rationale: Після заперечення природно виражає виняток і зберігає категоричність твердження.
- source_word: ᾧ ἐὰν βούληται ὁ υἱὸς
  choice: тому, кому Син захоче
  rationale: Неозначена відносна конструкція передана одниною «тому, кому», а «захоче» природно зберігає вольову ініціативу Сина.
- source_word: ἀποκαλύψαι
  choice: відкрити
  rationale: «Відкрити» є природним українським відповідником для особистого об’явлення Отця; займенник «Його» відновлює зрозумілий із контексту грецький додаток.
theological_decisions:
- issue: Сила дієслова ἐπιγινώσκω у взаємному знанні Отця і Сина
  choice: «знає» в обох паралельних частинах
  alternative: «повністю знає» або «досконало знає»
  rationale: Переклад не перетворює можливий контекстуальний відтінок повного чи глибокого знання на обов’язкове лексичне значення, водночас зберігаючи винятковість взаємного знання через конструкцію «ніхто… крім».
- issue: Вольовий зміст βούληται
  choice: «захоче»
  alternative: «вирішить» або «воліє»
  rationale: «Захоче» ясно приписує Синові ініціативу в об’явленні, не зводячи вислів ані до миттєвої примхи, ані до спеціалізованої богословської формули.
- issue: Референт невираженого додатка при ἀποκαλύψαι
  choice: додано «Його» з великої літери, тобто Отця
  alternative: 'залишити додаток невираженим: «відкрити»'
  rationale: Без додатка український вислів звучить неповно; найближчим і граматично очевидним референтом є Отець. Велика літера відповідає шанобливому біблійному регістру.
translation_notes:
  register: 'Сучасна, зрозуміла й урочиста українська мова. Активна конструкція в першому реченні усуває неприродну українську пасивність, не змінюючи змісту. Повтор маркера [a] навмисний: одна примітка стосується обох паралельних уживань ἐπιγινώσκει. Назви «Отець» і «Син» та займенники, що безпосередньо стосуються Бога, подано з великої літери.'
