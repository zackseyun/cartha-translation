  text: πάντες γὰρ οἱ προφῆται καὶ ὁ νόμος ἕως Ἰωάννου ἐπροφήτευσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/013.yaml
  text: For all the prophets and the Law prophesied until John[a].
translation:
  language: uk
  text: Бо всі пророки й Закон пророкували аж до Івана[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «до Івана» чи «до часу Івана». Цей вислів може подавати Івана як кульмінацію пророчого свідчення або як межу, що позначає його перехід у новий етап.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: всі
  rationale: Означає всю сукупність пророків; «всі» є природним сучасним українським відповідником.
- source_word: γὰρ
  choice: бо
  rationale: Передає пояснювальний зв’язок із попереднім висловом без надмірного тлумачення.
- source_word: οἱ προφῆται
  choice: пророки
  rationale: Звичний відповідник для тих, хто пророчо промовляє від Божого імені.
- source_word: ὁ νόμος
  choice: Закон
  rationale: Велика літера вказує на Закон як визнану частину Писання, а не на закон у загальному значенні.
- source_word: ἕως Ἰωάννου
  choice: аж до Івана
  rationale: Передає часову межу природною українською мовою, не вирішуючи, чи Іван включений у попередню пророчу добу, чи позначає її межу.
- source_word: ἐπροφήτευσαν
  choice: пророкували
  rationale: Прямо передає дієслово προφητεύω та зберігає твердження, що пророче свідчення давав також Закон.
theological_decisions:
- issue: Чи слід розуміти ὁ νόμος як загальне поняття або як назву частини Писання
  choice: Закон
  alternative: закон
  rationale: У поєднанні з пророками йдеться про визнане письмове свідчення Ізраїлю; написання з великої літери це прояснює, не додаючи нового змісту.
- issue: Чи включає вислів ἕως Ἰωάννου Івана в пророчу добу, чи лише позначає її кінцеву межу
  choice: аж до Івана
  alternative: до часу Івана
  rationale: Грецький вислів не усуває цієї неоднозначності, тому переклад зберігає часову межу й не нав’язує богословського висновку.
translation_notes:
  register: Сучасна стандартна українська мова; стислий, гідний біблійний стиль. Сполучник «бо» природно передає пояснення, а «аж до» виразно позначає часову межу, зберігаючи неоднозначність оригіналу.
