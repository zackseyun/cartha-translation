  text: Хто має вуха[a], нехай слухає.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Той, хто має вуха, нехай слухає». У грецькому тексті вжито узагальнений вислів в однині.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Хто має
  rationale: Субстантивований артикль із дієприкметником має узагальнене значення й стосується кожного, хто відповідає цій ознаці. Українське «хто має» природно передає цей зміст без архаїчного або громіздкого формулювання.
- source_word: ὦτα
  choice: вуха
  rationale: У грецькому тексті вжито знахідний відмінок множини. «Вуха» точно зберігає число та входить до усталеного образного заклику уважно сприймати сказане.
- source_word: ἀκουέτω
  choice: нехай слухає
  rationale: Форма третьої особи однини теперішнього часу наказового способу природно передається конструкцією «нехай слухає». У цьому контексті «слухає» виразніше за «чує» передає заклик до уважного й дієвого сприйняття, не усуваючи буквального образу слуху.
theological_decisions:
- issue: Узагальнений чоловічий рід в однині
  choice: Хто має вуха, нехай слухає.
  alternative: Той, хто має вуха, нехай слухає.
  rationale: Грецька конструкція формально має чоловічий рід однини, але функціонує узагальнено. Український займенник «хто» також граматично узгоджується з формою однини й охоплює будь-яку людину, тож зберігає узагальнений зміст і число без неприродного гендерного уточнення.
translation_notes:
  register: Сучасна, зрозуміла й водночас гідна українська мова. Формула «нехай слухає» звучить природно як заклик не лише почути, а й уважно прийняти сказане.
