  yaml_path: translation/nt/matthew/011/001.yaml
  text: And when Jesus had finished instructing his twelve disciples[b][a], he went on from there to teach and preach in their cities.
translation:
  language: uk
  text: І коли Ісус закінчив давати настанови своїм дванадцятьом учням[a], він пішов звідти навчати й проповідувати в їхніх містах[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «наказувати своїм дванадцятьом учням».'
    reason: lexical_alternative
  - marker: b
    text: 'Грецький вислів «їхніх містах» неоднозначний: він може стосуватися міст учнів або, ширше, міст людей цієї місцевості.'
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: Коли
  rationale: Матвіївська оповідна формула вводить часову обставину й перехід до наступної дії. Природне українське «Коли» передає цю функцію без важкого буквального «І сталося, коли».
- source_word: ἐτέλεσεν
  choice: закінчив
  rationale: Дієслово позначає завершення настанов перед наступною дією Ісуса; український доконаний вид природно передає цю послідовність.
- source_word: διατάσσων
  choice: давати настанови
  rationale: Дієприкметник означає авторитетно наказувати, розпоряджатися або давати вказівки. «Давати настанови» природно відповідає контексту доручення учням, а сильніше «наказувати» збережено у примітці.
- source_word: τοῖς δώδεκα μαθηταῖς αὐτοῦ
  choice: Своїм дванадцятьом учням
  rationale: «Учні» є усталеним і точним відповідником μαθηταί у контексті Євангелія; зворотний займенник природно вказує на належність підметові речення.
- source_word: μετέβη ἐκεῖθεν
  choice: Він пішов звідти
  rationale: Передає переміщення Ісуса з попереднього місця та природний розвиток оповіді.
- source_word: τοῦ διδάσκειν καὶ κηρύσσειν
  choice: навчати й проповідувати
  rationale: Родовий артикльований інфінітив виражає мету. Переклад зберігає відмінність між навчанням і публічним проголошенням.
- source_word: ἐν ταῖς πόλεσιν αὐτῶν
  choice: в їхніх містах
  rationale: Буквально зберігає займенник αὐτῶν і не визначає його неявного референта. «Міста» є прямим відповідником πόλεις, хоча залежно від масштабу поселень можливе «містечка».
theological_decisions:
- issue: Референт αὐτῶν у вислові ἐν ταῖς πόλεσιν αὐτῶν
  choice: Збережено неоднозначне «в їхніх містах».
  alternative: «У містах учнів», «у юдейських містах» або «у містах тієї місцевості».
  rationale: Грецький займенник прямо не називає, кому належать міста. Переклад не усуває неоднозначності, якої не усуває джерельний текст.
translation_notes:
  register: Сучасна нормативна українська мова з гідним оповідним звучанням. Ужито природний синтаксис без надмірного калькування, водночас збережено авторитетний характер настанов і неоднозначність присвійного займенника.
