  text: καὶ μακάριός ἐστιν ὃς ⸀ἐὰν μὴ σκανδαλισθῇ ἐν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/006.yaml
  text: And blessed is the one who is not offended by me[a].
translation:
  language: uk
  text: І блаженний той, хто не спіткнеться через мене[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «не образиться на мене» чи «не спокуситься через мене».'
    reason: 'Лексична альтернатива: σκανδαλισθῇ може означати спіткнутися, спокуситися або відсахнутися через образу.'
lexical_decisions:
- source_word: καί
  choice: І
  rationale: Зберігає зв’язок вислову з попереднім контекстом.
- source_word: μακάριος
  choice: блаженний
  rationale: Передає урочисту релігійну вагу слова та відповідає усталеній мові євангельських блаженств; «щасливий» могло б звучати надто суб’єктивно.
- source_word: ὃς ἐὰν μὴ
  choice: той, хто не
  rationale: Природно передає неозначену загальну умову й зберігає однину грецької конструкції.
- source_word: σκανδαλισθῇ
  choice: не спіткнеться
  rationale: Зберігає метафору перешкоди й падіння, не звужуючи значення до емоційної образи. Українська зворотна форма природно передає зміст грецького пасиву в цьому контексті.
- source_word: ἐν ἐμοί
  choice: через мене
  rationale: Передає Ісуса як причину або нагоду для спотикання; буквальне «в мені» тут було б неприродним і неясним українською.
theological_decisions:
- issue: Сила σκανδαλισθῇ стосовно Ісуса
  choice: 'Зберегти в основному тексті образ спотикання: «не спіткнеться через мене».'
  alternative: «не образиться на мене»; «не спокуситься через мене»
  rationale: 'Образ охоплює більше, ніж емоційну образу: йдеться про реакцію на Ісуса, яка може стати перешкодою для віри. Водночас примітка зберігає можливі контекстуальні відтінки.'
translation_notes:
  register: Сучасна, лаконічна й урочиста українська мова. «Блаженний» зберігає стиль проголошення блаженства, а «спіткнеться» — виразний образ оригіналу без надмірного тлумачення.
