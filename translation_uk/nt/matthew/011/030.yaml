review_pass:
  verdict: revise
  source_fidelity: «Ярмо» точно передає ζυγός, а «тягар ... легкий» добре відтворює φορτίον ... ἐλαφρόν. Для χρηστός у цьому образному контексті потрібен прикметник із відтінком приємності, доброзичливості або доброї придатності; «добре» можливе буквально, але в сучасній українській колокація «ярмо добре» звучить неприродно й послаблює цей відтінок.
  naturalness: Порядок «Моє ярмо ... Мій тягар» є природнішим для сучасної української та водночас зберігає грецький паралелізм. «Приємне» природно сполучається з «ярмо» в метафоричному контексті й не зливає його значення з наступним «легкий».
  terminology: «Ярмо» і «тягар» — усталені та точні біблійні образи. «Приємне» для χρηστός передає позитивну, не гнітючу властивість ярма, не нав’язуючи вузького тлумачення «легке». Написання займенників із великої літери відповідає поширеному українському біблійному регістру.
  issues:
  - severity: medium
    issue: «Добре» щодо «ярмо» недостатньо природне в сучасній українській.
    rationale: Хоча «добре» формально може передавати χρηστός, сучасний читач частіше сприймає його як загальну оцінку, а не як властивість ярма, що є приємним або добрим для носіння. «Приємне» ясніше передає контекстуальне значення без дублювання «легкий».
  revised_text: Бо Моє ярмо приємне, а Мій тягар легкий.
