  yaml_path: translation/nt/matthew/011/030.yaml
  text: For my yoke is kind, and my burden is light.
translation:
  language: uk
  text: Бо Моє ярмо приємне, а Мій тягар легкий.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζυγός
  choice: ярмо
  rationale: Прямий і усталений український відповідник, який зберігає образ упряжі та переносне значення підкорення настанові чи владі.
- source_word: χρηστός
  choice: добре
  rationale: Прикметник може означати «добрий, благий, лагідний у поводженні», а щодо ярма також «зручний, неважкий». «Добре» природно узгоджується з «ярмо» й зберігає морально-позитивний відтінок, не звужуючи значення лише до «легкого».
- source_word: φορτίον
  choice: тягар
  rationale: Передає вантаж або ношу та природно підтримує метафоричний контраст із легкістю.
- source_word: ἐλαφρόν
  choice: легкий
  rationale: Точний відповідник, що зберігає і буквальне значення малої ваги, і переносне значення необтяжливості.
theological_decisions:
- issue: Значення χρηστός у вислові про ярмо Ісуса
  choice: добре
  alternative: зручне / легке / лагідне
  rationale: Обрано ширший позитивний відповідник, який не ототожнює χρηστός із наступним ἐλαφρόν і не усуває напруження між самим образом ярма та його доброю природою.
translation_notes:
  register: Сучасна, проста й гідна українська мова; збережено стислий паралелізм грецького речення. Займенники «Моє», «Мій» подано з великої літери за поширеною українською біблійною традицією.
