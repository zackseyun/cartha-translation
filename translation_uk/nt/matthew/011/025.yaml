  text: Ἐν ἐκείνῳ τῷ καιρῷ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ⸀ἔκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/025.yaml
  text: At that time Jesus answered and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding[b], and revealed them to little children.”
translation:
  language: uk
  text: 'Того часу Ісус промовив у відповідь: «Віддаю Тобі хвалу[a], Отче, Господи неба й землі, бо Ти приховав це від мудрих і розумних, а відкрив немовлятам[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «дякую Тобі». Грецьке дієслово може виражати подяку, а також хвалу чи відкрите визнання.
    reason: lexical_alternative
  - marker: b
    text: Або «малим дітям». Грецьке слово буквально означає немовлят або зовсім малих дітей; тут воно, ймовірно, вжите образно.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: Того часу
  rationale: Природний український часовий зворот, який зберігає оповідне тло без надмірного уточнення моменту.
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: промовив у відповідь
  rationale: Передає обидва компоненти грецької формули природною сучасною українською, не створюючи враження, ніби перед цим було поставлено пряме запитання.
- source_word: Ἐξομολογοῦμαί σοι
  choice: Прославляю Тебе
  rationale: У зверненні до Отця дієслово означає відкрите визнання з хвалінням або подякою. «Прославляю» природно передає доксологічний тон; можливість значення «дякую» зазначено у примітці.
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: Отче, Господи неба й землі
  rationale: Збережено ланцюг кличних форм і пряме твердження про верховну владу Отця.
- source_word: ὅτι
  choice: бо
  rationale: Стисло й природно передає причинний зв’язок у цьому контексті.
- source_word: ἔκρυψας
  choice: Ти приховав
  rationale: Прямо передає активну форму дієслова й не послаблює означену в тексті Божу дію.
- source_word: ταῦτα ... αὐτά
  choice: це
  rationale: Українське збірне «це» природно відсилає до згаданих у контексті істин або реалій і зберігає відкритість референції.
- source_word: ἀπὸ σοφῶν καὶ συνετῶν
  choice: від мудрих і розумних
  rationale: Збережено субстантивовані прикметники та паралельну пару якостей без додавання слова «людей».
- source_word: ἀπεκάλυψας
  choice: відкрив
  rationale: У контексті пізнання істини «відкрив» є усталеним і природним відповідником дієслова ἀποκαλύπτω.
- source_word: νηπίοις
  choice: немовлятам
  rationale: Буквальний відповідник зберігає виразний контраст оригіналу й не підмінює образ тлумачним поняттям на зразок «смиренних»; метафоричне вживання пояснено у примітці.
theological_decisions:
- issue: Божа дія у приховуванні та відкритті
  choice: 'Збережено пряме приписування дії Отцеві: «Ти приховав ... а відкрив».'
  alternative: 'Пом’якшити до дозвільного формулювання: «Ти дозволив цьому залишитися прихованим».'
  rationale: Грецький текст уживає активні дієслова, підметом яких є Отець. Переклад зберігає богословську напругу й не додає пояснення про передвизначення, судове закам’яніння чи лише пасивний дозвіл.
- issue: Значення νηπίοις
  choice: Збережено конкретний образ «немовлятам», із поясненням можливого метафоричного сенсу в примітці.
  alternative: Перекласти тлумачно як «смиренним» або менш буквально як «малим дітям».
  rationale: Лексема буквально позначає немовлят або зовсім малих дітей, а тут, імовірно, вжита метафорично. Конкретний образ не зводить його сенс до однієї абстрактної риси.
translation_notes:
  register: Сучасна нормативна українська мова з урочистим, але зрозумілим біблійним звучанням. Кличні форми «Отче, Господи» збережено. Займенник «Ти» написано з великої літери як шанобливу українську видавничу конвенцію. Апострофічна формула передана природно, без архаїзмів. Для Ἐξομολογοῦμαί обрано «Прославляю», однак його семантична широта охоплює також подяку й відкрите визнання.
