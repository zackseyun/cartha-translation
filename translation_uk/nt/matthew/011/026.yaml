lexical_decisions:
- source_word: ναί
  choice: Так
  rationale: Прямо й природно передає ствердження та згоду в контексті молитви.
- source_word: ὁ πατήρ
  choice: Отче
  rationale: Грецький називний із артиклем виконує функцію звертання; український кличний відмінок природно передає цю функцію.
- source_word: ὅτι
  choice: бо
  rationale: 'Передає причинне значення: Ісус погоджується з описаною дією Отця, оскільки вона була йому до вподоби.'
- source_word: οὕτως
  choice: так
  rationale: Вказує на щойно згаданий спосіб дії — приховування від одних і відкриття іншим — без надмірного уточнення.
- source_word: εὐδοκία ἐγένετο
  choice: було до вподоби
  rationale: Природний український ідіом передає значення схвалення або задоволення, не звужуючи його до формального задуму чи постанови.
- source_word: ἔμπροσθέν σου
  choice: тобі
  rationale: В українському вислові «бути до вподоби комусь» давальний відмінок природно передає грецьке «перед тобою / у твоїх очах».
theological_decisions:
- issue: Чи передавати εὐδοκία як Божу постанову або задум чи як Боже вподобання і схвалення
  choice: «було до вподоби тобі»
  alternative: «таким було твоє благовоління» або «це було приємне у твоїх очах»
  rationale: Основний текст природно виражає вподобання Отця, не додаючи сильнішого значення наперед визначеної постанови; примітка зберігає можливість іменникового прочитання «благовоління».
translation_notes:
  register: Сучасна, проста й гідна українська мова. Кличний «Отче» природно передає звертання; вислів «було до вподоби тобі» є зрозумілим і не архаїчним. Займенник щодо Бога подано з малої літери відповідно до сучасної загальної орфографічної практики.
