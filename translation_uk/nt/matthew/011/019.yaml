  text: ἦλθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγουσιν· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, τελωνῶν φίλος καὶ ἁμαρτωλῶν. καὶ ἐδικαιώθη ἡ σοφία ἀπὸ τῶν ⸀ἔργων αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/019.yaml
  text: The Son of Man came eating and drinking[a], and they say, ‘Look, a glutton and a drunkard[b], a friend of tax collectors and sinners!’ And wisdom was justified by her works.
translation:
  language: uk
  text: 'Прийшов Син Людський, який їсть і п’є, і вони кажуть: «Ось ненажера й п’яниця, друг митників і грішників!» І мудрість виправдана своїми ділами.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «І правоту мудрості підтвердили її вчинки».'
    reason: lexical_alternative
  - marker: b
    text: 'У деяких рукописах замість «ділами» — «дітьми»: «І мудрість виправдана своїми дітьми».'
    reason: textual_variant
lexical_decisions:
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Син Людський
  rationale: Усталений український відповідник самоназви, який зберігає семітське тло та месіансько-богословське звучання без тлумачного розгортання.
- source_word: ἐσθίων καὶ πίνων
  choice: який їсть і п’є
  rationale: Природно передає грецькі дієприкметники як характерну поведінку та зберігає контекстуальний контраст з аскетичним способом життя Івана, не перебільшуючи значення словом «бенкетує».
- source_word: Ἰδοὺ
  choice: Ось
  rationale: Сучасний і природний український вигук, що зберігає вказівну та звинувачувальну силу вислову.
- source_word: φάγος
  choice: ненажера
  rationale: Передає зневажливе звинувачення в надмірності їжі стисло й природно.
- source_word: οἰνοπότης
  choice: п’яниця
  rationale: Передає не нейтральне вживання вина, а образливе звинувачення в надмірному питті.
- source_word: τελωνῶν φίλος καὶ ἁμαρτωλῶν
  choice: друг митників і грішників
  rationale: Зберігає грецьку конструкцію та соціально-релігійну силу обох означень.
- source_word: ἐδικαιώθη
  choice: виправдана
  rationale: Формально близько передає думку про те, що мудрість виявилася правою, і водночас зберігає біблійний словесний зв’язок із ширшим уживанням дієслова δικαιόω; природніший смисловий варіант подано в примітці.
- source_word: ἡ σοφία
  choice: мудрість
  rationale: Зберігає персоніфікований вислів без доданого ототожнення з Ісусом, Божим задумом чи іншою конкретною реальністю.
- source_word: ἀπὸ τῶν ἔργων αὐτῆς
  choice: своїми ділами
  rationale: Український орудний відмінок природно передає засіб або свідчення, через яке мудрість визнається правою; «ділами» зберігає зв’язок з ἔργων і біблійний регістр.
theological_decisions:
- issue: Значення «мудрості» в заключній частині
  choice: Збережено персоніфіковане слово «мудрість» без прямого ототожнення.
  alternative: Ототожнити мудрість з Ісусом, Божою спасительною мудрістю або Божим задумом.
  rationale: Сам текст не уточнює референта, тому переклад зберігає літературну образність і богословську напругу.
- issue: Текстова форма заключної частини
  choice: В основному тексті вжито «ділами» відповідно до ἔργων у SBLGNT.
  alternative: «дітьми» відповідно до варіанта τέκνων у частині рукописів і паралелі в Луки 7:35.
  rationale: Основний текст має наслідувати надане грецьке джерело, а відомий текстовий варіант слід засвідчити в примітці.
translation_notes:
  register: Сучасна літературна українська з гідним біблійним звучанням. «Ось», «ненажера» і «п’яниця» природно передають живу силу публічного звинувачення; «митники», «грішники», «виправдана» та «діла» зберігають упізнаваний біблійний регістр без архаїзації.
