  source_fidelity: 'Переклад точно передає ключові елементи SBLGNT: титул «Син Людський», характеристику «їсть і п’є», образливі звинувачення, а також персоніфіковану мудрість, виправдану її ділами. Однак «а вони кажуть» надає сполучникові дещо протиставного відтінку, якого просте καί не вимагає; «і вони кажуть» ближче до джерела без втрати природності.'
