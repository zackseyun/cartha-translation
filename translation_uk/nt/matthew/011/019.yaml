  terminology: «Син Людський» є усталеним відповідником. «Виправдана» зберігає формальний і біблійний зв’язок із δικαιόω; примітка слушно подає природніший пояснювальний відповідник. Варіант «дітьми» належно засвідчено без внесення його до основного тексту.
