  source_fidelity: 'Основний зміст передано точно: урочиста формула, семітський вислів, заперечне порівняння та парадокс щодо найменшого в Царстві збережені. Проте примітка a неточно подає можливе значення ἐγήγερται як «не був поставлений»: «поставлений» не є тут належним українським відповідником ані активного «постав/з’явився», ані можливого «був піднятий».'
