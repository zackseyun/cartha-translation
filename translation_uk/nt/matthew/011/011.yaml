source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, οὐκ ἐγήγερται ἐν γεννητοῖς γυναικῶν μείζων Ἰωάννου τοῦ βαπτιστοῦ· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τῶν οὐρανῶν μείζων αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/011.yaml
  text: Truly I say to you[a], among those born of women no one greater than John the Baptist has arisen[c][b]; yet the least in the kingdom of heaven is greater than he.
translation:
  language: uk
  text: 'Істинно кажу вам: серед народжених від жінок[b] не постав[a] ніхто, більший за Івана Хрестителя; але найменший у Царстві Небесному більший за нього[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «не був піднятий». Грецьке дієслово може означати «поставати, з’являтися» або «бути піднятим»; тут найімовірніше йдеться про появу в історії, а не про воскресіння.'
    reason: lexical_alternative
  - marker: b
    text: Вислів «народжені від жінок» — семітський спосіб сказати «люди».
    reason: cultural_note
  - marker: c
    text: 'Буквально: «менший». Грецьке слово має порівняльну форму, але в цьому вислові може означати того, хто має найнижчий статус у Царстві Небесному.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Істинно кажу вам
  rationale: Природно й урочисто передає формулу, якою Ісус вводить авторитетне твердження; «істинно» зрозуміліше в сучасному зв’язному тексті, ніж транслітероване «амінь».
- source_word: οὐκ ἐγήγερται
  choice: не поставав
  rationale: Передає появу людини на історичній сцені та не створює небажаного враження, ніби тут ідеться про воскресіння. Український доконаний перфектний зміст у заперечній конструкції природно виражено минулим часом.
- source_word: ἐν γεννητοῖς γυναικῶν
  choice: серед народжених жінками
  rationale: Зберігає семітський образний вислів про людей, не замінюючи його пояснювальним «серед смертних».
- source_word: μείζων Ἰωάννου τοῦ βαπτιστοῦ
  choice: ніхто більший за Івана Хрестителя
  rationale: Ясно й природно передає заперечну порівняльну конструкцію грецького тексту.
- source_word: τοῦ βαπτιστοῦ
  choice: Хрестителя
  rationale: Усталене й загальнозрозуміле українське найменування Івана, яке відповідає функції βαπτιστής.
- source_word: ὁ δὲ μικρότερος
  choice: але найменший
  rationale: Хоча грецька форма граматично порівняльна, у контексті вона природно позначає того, хто має найнижчий статус; «найменший» передає цей ідіоматичний зміст.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: у Царстві Небесному
  rationale: Усталений український відповідник характерного для Матвія вислову; він природний і зберігає біблійний регістр.
- source_word: μείζων αὐτοῦ ἐστιν
  choice: більший за нього
  rationale: Безпосередньо передає порівняння, не пояснюючи, у якому саме сенсі член Царства більший за Івана.
theological_decisions:
- issue: Співвідношення величі Івана та найменшого в Царстві Небесному
  choice: Залишити парадоксальне порівняння без богословського пояснення.
  alternative: Пояснити його як відмінність між епохами завітів, місцем в історії спасіння або особистою святістю.
  rationale: Сам вірш не уточнює підстави порівняння. Переклад має зберегти напруження вислову, а не обирати одну з можливих доктринальних інтерпретацій.
translation_notes:
  register: Сучасна літературна українська з урочистим, але доступним біблійним звучанням. Збережено семітський вислів «народжені жінками» та нез’ясовану в самому вірші богословську напругу. Власні назви й назву Царства подано за усталеною українською біблійною традицією.
