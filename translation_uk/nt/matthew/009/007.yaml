  text: І, вставши, він пішов до свого дому.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: І
  rationale: Зберігає простий сурядний зв’язок із попередньою розповіддю, не додаючи виразнішого часового значення на кшталт «тоді».
- source_word: ἐγερθεὶς
  choice: вставши
  rationale: Природно передає аористовий пасивний дієприкметник ἐγείρω, ужитий тут у неперехідному значенні, і зберігає послідовність дій.
- source_word: ἀπῆλθεν
  choice: пішов
  rationale: У контексті передає відхід із місця події; українське «пішов» звучить природно й не потребує важчого «відійшов» або книжного «відбув».
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: до свого дому
  rationale: Передає рух у напрямку власного помешкання. Зворотне «свого» природне українською, оскільки дім належить підметові речення.
