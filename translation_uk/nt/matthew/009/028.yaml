  text: ἐλθόντι δὲ εἰς τὴν οἰκίαν προσῆλθον αὐτῷ οἱ τυφλοί, καὶ λέγει αὐτοῖς ὁ Ἰησοῦς· Πιστεύετε ὅτι δύναμαι τοῦτο ποιῆσαι; λέγουσιν αὐτῷ· Ναί, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/028.yaml
  text: When he entered the house[a], the blind men approached him, and Jesus said to them, “Do you believe that I am able to do this?” They said to him, “Yes[b], Lord.”
translation:
  language: uk
  text: 'Коли ж він увійшов у дім, сліпі підійшли до нього. Ісус каже їм: «Чи вірите ви, що я можу це зробити?» Вони кажуть йому: «Так, Господи»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Так, пане». Грецьке κύριε може бути шанобливим звертанням, але «Господи» також зберігає можливе визнання влади Ісуса.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλθόντι δὲ εἰς τὴν οἰκίαν
  choice: Коли ж він увійшов у дім
  rationale: Часова конструкція передає аористовий дієприкметник, а «ж» відтворює перехідне δέ. «Увійшов у дім» природно виражає рух усередину.
- source_word: προσῆλθον αὐτῷ οἱ τυφλοί
  choice: сліпі підійшли до нього
  rationale: Субстантивований прикметник природно передано словом «сліпі»; προσέρχομαι тут означає наблизитися або підійти до когось.
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: Ісус каже їм
  rationale: Теперішній час збережено як історичний теперішній, що передає жвавість грецької оповіді.
- source_word: Πιστεύετε ὅτι δύναμαι τοῦτο ποιῆσαι
  choice: Чи вірите ви, що я можу це зробити?
  rationale: «Вірите» прямо передає πιστεύετε, а «можу» природно й точно виражає здатність, позначену δύναμαι.
- source_word: λέγουσιν αὐτῷ
  choice: Вони кажуть йому
  rationale: Збережено історичний теперішній оригіналу паралельно до λέγει.
- source_word: Ναί, κύριε
  choice: Так, Господи
  rationale: Ναί — звичайна ствердна відповідь; κύριε передано українським кличним відмінком «Господи», зберігаючи як шанобливе звертання, так і можливе визнання влади Ісуса.
theological_decisions:
- issue: Значення κύριε у звертанні до Ісуса
  choice: Господи
  alternative: пане
  rationale: У цьому контексті слово може бути як шанобливим звертанням, так і вираженням визнання влади Ісуса. «Господи» зберігає цю богословську можливість, а примітка не приховує ширшого значеннєвого діапазону.
- issue: Історичний теперішній λέγει / λέγουσιν
  choice: каже / кажуть
  alternative: сказав / сказали
  rationale: Теперішній час відтворює дискурсивну форму грецького тексту та його оповідну жвавість, не змінюючи часової послідовності подій.
translation_notes:
  register: Сучасна літературна українська з гідним, доступним оповідним стилем. Збережено історичний теперішній оригіналу; займенник «я» не капіталізовано, оскільки в грецькому тексті немає відповідного графічного розрізнення.
