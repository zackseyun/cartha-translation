  yaml_path: translation/nt/matthew/009/011.yaml
  text: And when the Pharisees saw it[a], they were saying to his disciples, “Why does your teacher eat with tax collectors and sinners?”
translation:
  language: uk
  text: 'І, побачивши це[a], фарисеї казали його учням: «Чому ваш учитель їсть зі збирачами податків і грішниками?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Побачивши, фарисеї казали…» У грецькому тексті не сказано прямо, що саме вони побачили; з контексту йдеться про сцену трапези.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Побачивши це
  rationale: Аористовий дієприкметник передає дію, що передує словам фарисеїв. Займенник «це» природний в українській і вказує на побачену ними сцену трапези, хоча в грецькому тексті додаток прямо не названо.
- source_word: ἔλεγον
  choice: казали
  rationale: Українська форма недоконаного виду зберігає тривалий або повторюваний характер грецького імперфекта, не змушуючи тлумачити його як одноразове «сказали».
- source_word: μαθηταῖς
  choice: учням
  rationale: «Учні» — природний і усталений відповідник, який зберігає зв’язок між учителем та його послідовниками.
- source_word: Διὰ τί
  choice: Чому
  rationale: Стислий і природний український відповідник запитання про причину.
- source_word: τελωνῶν
  choice: збирачами податків
  rationale: Прозоро передає функцію τελῶναι для сучасного читача й не створює властивої слову «митник» асоціації лише із сучасною митною службою.
- source_word: ἁμαρτωλῶν
  choice: грішниками
  rationale: Прямий відповідник, який зберігає моральне й суспільне означення цієї групи без додаткового тлумачення.
- source_word: ἐσθίει
  choice: їсть
  rationale: Передає основне значення дієслова та теперішній час у прямому запитанні без додавання значення урочистої трапези.
- source_word: διδάσκαλος
  choice: учитель
  rationale: Звичайний український відповідник назви ролі; він зберігає зв’язок із «учнями» й не підмінює грецьке слово титулом «рабин».
theological_decisions:
- issue: Чи робити явним додаток при «побачивши»
  choice: Додано «це» з приміткою
  alternative: «Побачивши, фарисеї казали…»
  rationale: У грецькому тексті додаток не виражений, але мається на увазі сцена спільної трапези з попереднього контексту. «Це» забезпечує природність української фрази, а примітка зберігає формальну особливість оригіналу.
translation_notes:
  register: Сучасна літературна українська, проста й гідна за тоном. «Збирачі податків» обрано замість традиційного «митники» задля ясності для сучасного читача; недоконане «казали» зберігає аспект грецького імперфекта.
