id: MAT.9.20
reference: Matthew 9:20
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ γυνὴ αἱμορροοῦσα δώδεκα ἔτη προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/020.yaml
  text: And behold[b][a], a woman who had been suffering from bleeding for twelve years came up behind him and touched the fringe of his garment.
translation:
  language: uk
  text: І ось жінка, яка дванадцять років страждала на кровотечу, підійшла до нього ззаду й торкнулася краю[a][b] його одягу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «китиці», «бахроми» чи «облямівки». Грецьке слово може означати край одягу або розміщену на ньому китицю чи бахрому.
    reason: lexical_alternative
  - marker: b
    text: Про китиці на одязі, приписані Ізраїлеві Законом, див. Числа 15:38; Повторення Закону 22:12.
    reason: cross_reference
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: І ось
  rationale: Зберігає сполучний і водночас привертаючий увагу характер вислову, природно передаючи раптову появу жінки в оповіді.
- source_word: γυνὴ
  choice: жінка
  rationale: Прямий і природний відповідник неозначеної згадки про жінку.
- source_word: αἱμορροοῦσα
  choice: яка … страждала на кровотечу
  rationale: Передає тривалий стан кровотечі та його тяжкість без враження, ніби йдеться лише про гострий короткочасний крововилив.
- source_word: δώδεκα ἔτη
  choice: дванадцять років
  rationale: Природно передає знахідний відмінок тривалості часу.
- source_word: προσελθοῦσα ὄπισθεν
  choice: підійшла до нього ззаду
  rationale: Передає наближення до Ісуса та напрямок іззаду; займенник, зрозумілий із контексту, додано для природності українського вислову.
- source_word: ἥψατο
  choice: торкнулася
  rationale: У цьому контексті середній стан дієслова означає дотик; переклад не перебільшує силу контакту.
- source_word: τοῦ κρασπέδου
  choice: краю
  rationale: κράσπεδον може означати край, облямівку, бахрому або китицю одягу. «Край» зберігає широту значення, тоді як можливий конкретніший зміст пояснено у примітці.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: його одягу
  rationale: ἱμάτιον позначає предмет одягу, часто верхній; загальне «одяг» не звужує значення до певного виду вбрання.
theological_decisions:
- issue: Можливий зв’язок κράσπεδον із китицями на ізраїльському одязі
  choice: У основному тексті вжито загальне «краю»
  alternative: «китиці», «бахроми» або «облямівки»
  rationale: Грецьке слово допускає конкретне розуміння як китиці чи бахроми, пов’язаної з приписами Закону, але сам вірш не уточнює форми краю одягу. Загальний переклад не перетворює ймовірне культурне тло на безсумнівне твердження; альтернативу й посилання подано в примітках.
translation_notes:
  register: Сучасна літературна українська мова з гідним оповідним звучанням. «І ось» зберігає виразний дискурсивний сигнал оригіналу, а «страждала на кровотечу» зрозуміло передає хронічний стан без архаїчної або надмірно медичної лексики.
