  text: καὶ ⸀εἰδὼς ὁ Ἰησοῦς τὰς ἐνθυμήσεις αὐτῶν εἶπεν· ⸀Ἱνατί ἐνθυμεῖσθε πονηρὰ ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/004.yaml
  text: And Jesus[a], knowing their thoughts, said, “Why are you thinking evil in your hearts?”
translation:
  language: uk
  text: 'І Ісус, знаючи їхні думки, сказав: «Чому ви думаєте лихе у своїх серцях?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰδὼς
  choice: знаючи
  rationale: Дієприкметник передає усвідомлення Ісусом їхніх невисловлених міркувань; «знаючи» природно й точно зберігає це значення без додаткового тлумачення.
- source_word: ἐνθυμήσεις
  choice: думки
  rationale: Іменник позначає внутрішні роздуми або міркування; «думки» є природним сучасним відповідником.
- source_word: Ἱνατί
  choice: навіщо
  rationale: У цьому докірливому запитанні слово стосується підстави або наміру; «навіщо» природно передає запитання про мотив.
- source_word: ἐνθυμεῖσθε
  choice: думаєте
  rationale: Форма теперішнього часу позначає внутрішній процес мислення; «думаєте» також зберігає лексичний зв’язок із «думки».
- source_word: πονηρὰ
  choice: лихе
  rationale: Субстантивований прикметник середнього роду множини означає лихі речі, думки чи наміри; збірне «лихе» зберігає стислість і не звужує значення.
- source_word: καρδίαις
  choice: серцях
  rationale: «Серця» зберігає біблійну метафору внутрішньої людини, що охоплює думки та наміри.
theological_decisions:
- issue: Знання Ісусом невисловлених думок
  choice: Ісус, знаючи їхні думки
  alternative: Ісус, розпізнавши їхні думки
  rationale: Основний текст прямо передає обізнаність Ісуса з їхніми внутрішніми міркуваннями, не пояснюючи її природи й не розгортаючи додаткового доктринального твердження.
translation_notes:
  register: Сучасна стандартна українська мова; виклад природний, стислий і гідний. Збережено біблійну метафору серця та внутрішню лексичну єдність між «думки» і «думаєте».
