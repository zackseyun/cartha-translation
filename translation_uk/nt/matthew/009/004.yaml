  verdict: revise
  source_fidelity: 'Потрібно відтворити початкове καί («І»), яке в чернетці пропущено. Для Ἱνατί точніше «Чому», оскільки це запитання про причину, а не «Навіщо», що в сучасній українській частіше запитує про мету. Решта передає грецький текст точно: «знаючи» відповідає εἰδώς, «думки» — ἐνθυμήσεις, а «лихе» природно передає субстантивований множинний прикметник πονηρά без зайвого уточнення.'
  naturalness: «І Ісус, знаючи їхні думки, сказав» є природною, стриманою біблійною українською. «Чому ви думаєте лихе у своїх серцях?» зберігає образність оригіналу й зрозуміле в сучасному стандартному вжитку.
  terminology: «Серцях» належно зберігає καρδίαις як біблійний образ внутрішньої людини. «Лихе» не нав’язує конкретизації («лихі думки» або «злі наміри»), якої грецький текст прямо не робить.
