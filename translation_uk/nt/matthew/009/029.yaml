  text: τότε ἥψατο τῶν ὀφθαλμῶν αὐτῶν λέγων· Κατὰ τὴν πίστιν ὑμῶν γενηθήτω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/029.yaml
  text: Then he touched their eyes[a], saying, “According to your faith, let it be done for you.”
translation:
  language: uk
  text: 'Тоді Він доторкнувся до їхніх очей і сказав: «Нехай станеться вам згідно з вашою вірою[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Нехай станеться вам згідно з вашою довірою». Грецьке слово πίστις може також означати «довіра», а в деяких контекстах — «вірність».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Тоді
  rationale: Передає часовий прислівник, який позначає наступну подію в оповіді.
- source_word: ἥψατο
  choice: доторкнувся
  rationale: Середня форма ἅπτω тут означає фізичний дотик; українське «доторкнувся до» природно сполучається з родовим відмінком.
- source_word: τῶν ὀφθαλμῶν αὐτῶν
  choice: до їхніх очей
  rationale: Родовий відмінок після ἅπτομαι позначає те, чого торкнулися; конструкція природно відтворена українською.
- source_word: λέγων
  choice: і сказав
  rationale: Дієприкметник позначає мовлення, супровідне головній дії. Особова форма з «і» звучить природніше сучасною українською, не змінюючи послідовності дій.
- source_word: Κατὰ
  choice: згідно з
  rationale: κατά зі знахідним відмінком виражає відповідність або міру; «згідно з» не додає сильнішого причинного значення на кшталт «через».
- source_word: τὴν πίστιν ὑμῶν
  choice: вашою вірою
  rationale: У цьому контексті πίστις означає віру або довіру сліпих до Ісуса; «віра» є усталеним і точним основним відповідником, а варіант «довіра» збережено в примітці.
- source_word: γενηθήτω
  choice: Нехай станеться
  rationale: Аористовий пасивний імператив γίνομαι має силу дієвого проголошення; ця форма зберігає наказово-побажальну силу без перетворення вислову на просте передбачення.
- source_word: ὑμῖν
  choice: вам
  rationale: Давальний відмінок передає спрямованість результату на цих людей; українське «вам» природно зберігає цю відкритість значення.
theological_decisions:
- issue: Передача πίστις у вислові про зцілення
  choice: віра
  alternative: довіра; в інших контекстах — вірність
  rationale: Безпосередній контекст стосується переконання сліпих у спроможності Ісуса зцілити їх. «Віра» зберігає звичну богословську лексику, тоді як примітка показує доречний тут відтінок довіри та ширший лексичний діапазон слова.
- issue: Зв’язок віри зі зціленням
  choice: згідно з вашою вірою
  alternative: на підставі вашої віри
  rationale: Грецьке κατά виражає відповідність або міру, але саме по собі не вимагає тлумачити віру як заслугу чи самостійну причину зцілення. Тому причинно сильніший варіант не використано.
translation_notes:
  register: Сучасна стандартна українська, зрозуміла й гідна за тоном. Особову форму «і сказав» обрано замість буквального дієприкметника «кажучи» заради природного оповідного синтаксису. Займенник «Він» написано з великої літери відповідно до поширеної української біблійної видавничої практики.
