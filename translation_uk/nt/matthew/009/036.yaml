  yaml_path: translation/nt/matthew/009/036.yaml
  text: And when he saw the crowds[a], he had compassion on them, because they were harassed and cast down, like sheep without a shepherd.
translation:
  language: uk
  text: Побачивши натовпи, Він пройнявся співчуттям до них, бо вони були змучені й повалені[a], немов вівці без пастуха.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «виснажені й безпорадні». Грецькі слова також можуть описувати людей як знесилених тяжким поводженням і неспроможних подбати про себе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: Побачивши
  rationale: Аористовий дієприкметник природно передано українським дієприслівником; δέ тут є слабким оповідним сполучником, який не потребує окремого відтворення.
- source_word: τοὺς ὄχλους
  choice: натовпи
  rationale: Сучасний і природний відповідник множини ὄχλοι, що позначає великі групи людей.
- source_word: ἐσπλαγχνίσθη περὶ αὐτῶν
  choice: Він змилосердився над ними
  rationale: Передає глибоке співчуття Ісуса природною, гідною українською мовою без надмірного пояснення грецької образності.
- source_word: ὅτι
  choice: бо
  rationale: Ясно вводить причину співчуття та природно звучить у цьому реченні.
- source_word: ἐσκυλμένοι
  choice: виснажені
  rationale: Передає стан людей, змучених і знесилених тяжким поводженням; це природніше українською, ніж буквальніші варіанти на кшталт «переслідувані».
- source_word: ἐρριμμένοι
  choice: повалені
  rationale: Зберігає пасивний образ тих, кого кинуто або збито додолу, не звужуючи значення до тлумачного «безпорадні».
- source_word: ὡσεὶ πρόβατα μὴ ἔχοντα ποιμένα
  choice: немов вівці без пастуха
  rationale: Природно відтворює порівняння та пастирський образ без зайвої експлікації.
theological_decisions:
- issue: Мова про співчуття Ісуса
  choice: Він змилосердився над ними
  alternative: Він сповнився співчуття до них
  rationale: Обраний вислів передає глибину милосердної реакції Ісуса й водночас залишається стислим та природним.
- issue: Стан натовпів
  choice: виснажені й повалені
  alternative: змучені й безпорадні
  rationale: Обраний варіант зберігає напруження між значенням виснаження або тяжкого поводження та буквальним образом поваленості; не підмінює другий образ більш тлумачним поняттям безпорадності.
translation_notes:
  register: Сучасна стандартна українська; виклад стислий, гідний і зрозумілий. Займенник «Він» ужито для ясного позначення Ісуса в окремо поданому вірші. Образ овець без пастуха збережено.
