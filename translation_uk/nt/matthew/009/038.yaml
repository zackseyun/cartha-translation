base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/038.yaml
  text: Therefore pray earnestly to the Lord of the harvest that he would send out workers into his harvest[a].
translation:
  language: uk
  text: Тож благайте Господа жнив, щоб Він послав робітників на Свої жнива[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «вигнав» робітників. Грецьке дієслово сильніше за звичайне «послав», хоча тут ідеться про спрямування робітників на жнива.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεήθητε
  choice: ревно благайте
  rationale: Дієслово δέομαι в наказовій формі передає наполегливе прохання або благання. «Ревно благайте» природно зберігає молитовний контекст і силу прохання.
- source_word: οὖν
  choice: Тож
  rationale: Сполучник позначає висновок із попередніх слів про великі жнива й малу кількість робітників; «тож» стисло й природно передає цей логічний зв’язок.
- source_word: κυρίου
  choice: Господа
  rationale: Κύριος означає того, кому належать жнива і хто має над ними владу; «Господь» зберігає усталене біблійне звучання, не звужуючи референта.
- source_word: θερισμοῦ
  choice: жнив
  rationale: Збережено образ жнив без пояснювального перефразування.
- source_word: ὅπως
  choice: щоб
  rationale: Природно вводить зміст і мету прохання в сучасній українській мові.
- source_word: ἐκβάλῃ
  choice: вислав
  rationale: У цьому контексті дієслово означає спрямувати робітників на працю. «Вислав» звучить природно, а сильніший відтінок грецького дієслова зазначено у примітці.
- source_word: ἐργάτας
  choice: робітників
  rationale: Пряме й загальнозрозуміле позначення тих, хто працює на жнивах.
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: на Свої жнива
  rationale: Український прийменник «на» природно передає спрямування до праці на жнивах; присвійність αὐτοῦ збережено без додавання відсутнього в оригіналі слова «поле».
theological_decisions:
- issue: Кого означає «Господь жнив»
  choice: Залишити титул «Господь жнив» без уточнення особи.
  alternative: Прямо ототожнити Господа жнив з Отцем, Ісусом або Богом загалом.
  rationale: Сам вірш не уточнює референта, тому переклад зберігає богословську відкритість оригіналу.
translation_notes:
  register: Сучасна літературна українська, гідний і зрозумілий біблійний стиль. Образ жнив збережено; синтаксис стислий і природний.
