id: MAT.9.17
reference: Matthew 9:17
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: οὐδὲ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή γε, ῥήγνυνται οἱ ἀσκοί, καὶ ὁ οἶνος ἐκχεῖται καὶ οἱ ἀσκοὶ ⸀ἀπόλλυνται· ἀλλὰ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς καινούς, καὶ ἀμφότεροι συντηροῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/017.yaml
  text: Nor do they put new wine into old wineskins. Otherwise[a], the wineskins burst, and the wine is spilled, and the wineskins are ruined. Rather, they put new wine into fresh wineskins, and both are preserved.
translation:
  language: uk
  text: 'Так само не наливають молодого вина в старі бурдюки. Інакше бурдюки розриваються, вино виливається, а бурдюки псуються. Натомість молоде вино наливають у нові бурдюки[a], і те й інше зберігається.


    [a] Грецький текст розрізняє молоде вино (νέος) і нові, тобто ще не зношені, бурдюки (καινός).'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Грецький текст розрізняє молоде вино (νέος) і нові, тобто ще не зношені, бурдюки (καινός).
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: Так само не
  rationale: Передає приєднання ще одного заперечного прикладу до попереднього вислову природною сучасною українською мовою.
- source_word: βάλλουσιν
  choice: наливають
  rationale: Щодо вина українське «наливають» природніше за буквальне «кладуть» і точно описує поміщення рідини в посудину.
- source_word: οἶνον νέον
  choice: молоде вино
  rationale: Усталений український відповідник для щойно виготовленого вина; водночас дає змогу відрізнити νέος від καινός у цьому самому реченні.
- source_word: ἀσκούς
  choice: бурдюки
  rationale: Називає шкіряні посудини для рідин і стисло передає історичну реалію.
- source_word: παλαιούς
  choice: старі
  rationale: Прямо передає протиставлення старих, уже зношених бурдюків новим.
- source_word: εἰ δὲ μή γε
  choice: Інакше
  rationale: Природно передає умовне застереження та перехід до наслідків.
- source_word: ῥήγνυνται
  choice: розриваються
  rationale: Точно описує розрив шкіряних посудин під тиском.
- source_word: ἐκχεῖται
  choice: виливається
  rationale: Передає мимовільну втрату вина після розриву бурдюків.
- source_word: ἀπόλλυνται
  choice: псуються
  rationale: У цьому предметному контексті означає, що бурдюки стають непридатними; «псуються» природно передає практичну втрату без надмірного посилення.
- source_word: ἀλλά
  choice: Натомість
  rationale: Виразно передає виправний контраст із щойно описаною неправильною практикою.
- source_word: καινούς
  choice: нові
  rationale: Передає новизну за станом; у поєднанні з «молоде вино» зберігає лексичну відмінність між νέος і καινός.
- source_word: ἀμφότεροι
  choice: і те й інше
  rationale: Однозначно охоплює обидва різнорідні складники — вино та бурдюки — і звучить природніше, ніж просто «обоє».
- source_word: συντηροῦνται
  choice: зберігається
  rationale: Передає збереження і вина, і бурдюків від втрати чи псування.
theological_decisions:
- issue: Розрізнення νέος і καινός у тому самому вірші
  choice: νέος передано як «молоде», а καινός як «нові»
  alternative: Обидва прикметники передати словом «нові»
  rationale: 'Грецький текст уживає різні прикметники: вино є молодим за часом виготовлення, а бурдюки — новими, не зношеними за станом. Переклад зберігає цю відмінність, не перетворюючи її на богословське тлумачення.'
translation_notes:
  register: Сучасна стандартна українська, природний і гідний виклад. «Бурдюки» зберігає історичну предметність образу; синтаксис зроблено прозорим для пересічного читача. Маркер примітки поставлено безпосередньо біля вислову, якого вона стосується.
