  text: Καὶ παράγων ὁ Ἰησοῦς ἐκεῖθεν εἶδεν ἄνθρωπον καθήμενον ἐπὶ τὸ τελώνιον, Μαθθαῖον λεγόμενον, καὶ λέγει αὐτῷ· Ἀκολούθει μοι· καὶ ἀναστὰς ἠκολούθησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/009.yaml
  text: And as Jesus was passing on from there[a], he saw a man called Matthew sitting at the tax booth, and he says to him[c][b], “Follow me.” And he rose and followed him.
translation:
  language: uk
  text: 'Ісус, проходячи звідти, побачив чоловіка на ім’я Матвій[a], який сидів на місці збору податків, і каже йому[b]: «Іди за мною». Той встав[c] і пішов за ним.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «якого звали Матвієм».'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «сказав йому»; у грецькому тексті вжито історичний теперішній час — «каже».'
    reason: lexical_alternative
  - marker: c
    text: 'Або: «підвівся»; буквально грецька конструкція має значення «вставши, пішов за ним».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παράγων … ἐκεῖθεν
  choice: йдучи звідти
  rationale: Дієприкметник теперішнього часу передає супровідну, тривалу дію, а ἐκεῖθεν — рух від попереднього місця. Формулювання природне для сучасної української оповіді.
- source_word: ἄνθρωπον
  choice: чоловіка
  rationale: У цьому контексті йдеться про конкретну особу чоловічої статі.
- source_word: καθήμενον ἐπὶ τὸ τελώνιον
  choice: який сидів на місці збору податків
  rationale: τελώνιον означає місце, де збирали податки або мито. Описовий відповідник зрозуміліший сучасному читачеві й не створює хибної асоціації з нинішньою державною митницею.
- source_word: Μαθθαῖον λεγόμενον
  choice: на ім’я Матвій
  rationale: Природний український спосіб повідомити, як звали людину; не додає відомостей понад грецький текст.
- source_word: λέγει αὐτῷ
  choice: каже йому
  rationale: Збережено грецький історичний теперішній час, який надає оповіді жвавості.
- source_word: Ἀκολούθει μοι
  choice: Іди за мною
  rationale: Передає прямий заклик слідувати за Ісусом, не розгортаючи його в пояснювальний вислів про учнівство.
- source_word: ἀναστὰς
  choice: устав
  rationale: Аористовий дієприкметник позначає дію, що передує слідуванню. Сурядна конструкція природно передає послідовність дій українською.
- source_word: ἠκολούθησεν αὐτῷ
  choice: пішов за ним
  rationale: Зберігає конкретний образ слідування, у якому контекстуально присутній і сенс учнівства, без пояснювального розширення.
theological_decisions:
- issue: Характер заклику Ісуса до Матвія
  choice: «Іди за мною» без пояснювального додавання про учнівство
  alternative: «Стань моїм учнем» або «Приєднуйся до мене»
  rationale: Контекст указує на покликання до учнівства, однак грецький текст висловлює його простим наказом слідувати. Переклад зберігає цей образ і не звужує його до богословського пояснення.
translation_notes:
  register: Сучасна літературна українська з гідним, але не архаїчним звучанням. Займенники щодо Ісуса подано з малої літери відповідно до звичайної сучасної орфографічної практики; це не применшує богословського змісту. Історичний теперішній час у «каже» свідомо збережено.
