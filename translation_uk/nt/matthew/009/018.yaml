id: MAT.9.18
reference: Matthew 9:18
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Ταῦτα αὐτοῦ λαλοῦντος αὐτοῖς ἰδοὺ ἄρχων εἷς ⸀ἐλθὼν προσεκύνει αὐτῷ λέγων ὅτι Ἡ θυγάτηρ μου ἄρτι ἐτελεύτησεν· ἀλλὰ ἐλθὼν ἐπίθες τὴν χεῖρά σου ἐπ’ αὐτήν, καὶ ζήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/018.yaml
  text: While he was saying these things to them, look, a ruler came and bowed down before him, saying, “My daughter has just died. But come and lay your hand on her, and she will live.”
translation:
  language: uk
  text: 'Коли Він говорив їм це, ось прийшов один начальник і вклонився Йому, кажучи: «Моя дочка щойно померла. Але прийди, поклади на неї Свою руку — і вона оживе».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: ось
  rationale: Природний український засіб привернення уваги, який зберігає оповідний наголос грецького ἰδοὺ.
- source_word: ἄρχων εἷς
  choice: один із начальників
  rationale: Ἄρχων означає керівника або впливову посадову особу; вислів не уточнює посади. Такий переклад природний українською і не додає конкретного титулу.
- source_word: προσεκύνει
  choice: вклонившись
  rationale: У цьому контексті слово описує жест глибокої пошани; переклад не вирішує наперед, чи йдеться саме про поклоніння як богослужбову дію.
- source_word: ἄρτι ἐτελεύτησεν
  choice: щойно померла
  rationale: Точно передає недавність події та звичайне значення дієслова ἐτελεύτησεν.
- source_word: ζήσεται
  choice: оживе
  rationale: У контексті вже померлої дочки природно означає повернення до життя, а не лише подальше життя.
theological_decisions:
- issue: Значення προσεκύνει щодо ставлення начальника до Ісуса
  choice: вклонившись Йому
  alternative: поклонився Йому
  rationale: Збережено видимий жест глибокої пошани без нав'язування однозначного висновку про культове поклоніння.
- issue: Упевненість у поверненні дочки до життя
  choice: вона оживе
  alternative: вона житиме
  rationale: Майбутній час καὶ ζήσεται передає впевнене очікування наслідку; контекст смерті робить «оживе» точнішим.
translation_notes:
  register: Сучасна стандартна українська з гідним, зрозумілим оповідним стилем. Займенники щодо Ісуса подано з великої літери відповідно до поширеної української біблійної традиції; богословського уточнення понад грецький текст не додано.
