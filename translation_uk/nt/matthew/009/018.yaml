revisions:
- from: 'Коли Він ще говорив їм це, ось прийшов один із начальників і, вклонившись Йому, сказав: «Моя дочка щойно померла. Але прийди, поклади на неї Свою руку — і вона оживе».'
  to: 'Коли Він говорив їм це, ось прийшов один начальник і вклонився Йому, кажучи: «Моя дочка щойно померла. Але прийди, поклади на неї Свою руку — і вона оживе».'
  rationale: The revision removes the unsupported partitive implication in the description of the ruler and more closely follows the Greek verbal sequence. No footnote is needed, since the wording preserves the source's broad designation and the ambiguity of the gesture.
  reviewer_model: gpt-5.6-terra
