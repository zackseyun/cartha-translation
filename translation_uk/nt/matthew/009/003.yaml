lexical_decisions:
- source_word: καὶ
  choice: І
  rationale: Простий сурядний сполучник природно продовжує розповідь і відповідає грецькому καὶ.
- source_word: ἰδού
  choice: ось
  rationale: Зберігає функцію привернення уваги та оповідну виразність, водночас природно звучить сучасною українською.
- source_word: τινες τῶν γραμματέων
  choice: деякі книжники
  rationale: Передає невизначену частину групи; «книжники» є усталеним українським відповідником для знавців і тлумачів Закону в євангельському контексті.
- source_word: εἶπαν ἐν ἑαυτοῖς
  choice: сказали між собою
  rationale: Зберігає дієслово мовлення і множинність учасників, не звужуючи вислів лише до мовчазної внутрішньої думки.
- source_word: Οὗτος
  choice: Він
  rationale: У прямій мові український займенник природно вказує на Ісуса; зневажливий відтінок грецького вказівного займенника залежить від контексту й не потребує штучного посилення.
- source_word: βλασφημεῖ
  choice: зневажає Бога
  rationale: У цьому контексті дієслово позначає богозневажливе мовлення. Такий вислів зрозумілий пересічному сучасному читачеві й передає спрямованість звинувачення, не пояснюючи наперед, чи воно справедливе.
theological_decisions:
- issue: Звинувачення книжників проти Ісуса
  choice: «Він зневажає Бога!»
  alternative: «Він богохульствує!»
  rationale: Основний текст прямо й зрозуміло передає звинувачення, але не підтверджує його істинності й не розв’язує наперед богословської напруги оповіді.
translation_notes:
  register: Сучасна, гідна й доступна українська мова. «Ось» зберігає оповідний сигнал уваги; «книжники» лишено як усталений біблійний термін. Знак оклику природно передає різкість звинувачення, не додаючи доктринального висновку.
