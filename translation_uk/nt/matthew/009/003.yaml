  source_fidelity: Потрібне уточнення двох місць. Τινες τῶν γραμματέων має партитивний відтінок («деякі з книжників»). Вислів εἶπαν ἐν ἑαυτοῖς у цьому контексті найприродніше передає внутрішнє мовлення, що підтверджує наступна згадка про їхні думки (в. 4); «між собою» надто виразно означає взаємну розмову. Βλασφημεῖ слід передати прямим відповідником «богохульствує», а не ширшим «зневажає Бога».
  naturalness: «І ось» і «книжники» природні для сучасного біблійного українського регістру. «Сказали самі собі» є зрозумілим і зберігає дієслово мовлення; примітка подає можливість приватної розмови. «Цей богохульствує» передає зневажливий вказівний займенник без непотрібного додавання «чоловік».
  terminology: «Книжники» — усталений точний відповідник γραμματεῖς у євангельському контексті. «Богохульствує» — прямий сучасний нормативний відповідник βλασφημεῖ та не зводить звинувачення до загальної неповаги до Бога.
