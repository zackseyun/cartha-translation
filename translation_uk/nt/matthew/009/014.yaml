base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/014.yaml
  text: Then John's disciples came to him[a], saying, “Why do we and the Pharisees fast often, but your disciples do not fast?”
translation:
  language: uk
  text: 'Тоді до нього підійшли учні Івана й запитали: «Чому ми та фарисеї часто[a] постимо, а твої учні не постять?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «багато постимо» чи «постимо багато разів»; грецьке πολλά при дієслові «постити» виражає часту практику.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Тоді
  rationale: Природний часовий сполучник, що вводить наступну подію в розповіді.
- source_word: προσέρχονται αὐτῷ
  choice: до нього підійшли
  rationale: Передає рух у напрямку до Ісуса; історичний теперішній час природно відтворено українським минулим.
- source_word: οἱ μαθηταὶ Ἰωάννου
  choice: учні Івана
  rationale: Природна українська конструкція з родовим відмінком; ужито усталену українську форму імені.
- source_word: λέγοντες
  choice: й запитали
  rationale: У цьому контексті дієприкметник вводить пряме запитання; особова форма звучить природніше й точно передає мовленнєву дію.
- source_word: Διὰ τί
  choice: Чому
  rationale: Звичайний сучасний відповідник запитання про причину.
- source_word: ἡμεῖς καὶ οἱ Φαρισαῖοι
  choice: ми та фарисеї
  rationale: Зберігає наголошене «ми» та поєднання двох груп без додаткового тлумачення.
- source_word: νηστεύομεν
  choice: постимо
  rationale: Стандартне українське дієслово для релігійного утримання від їжі.
- source_word: πολλά
  choice: часто
  rationale: Середній рід множини вжито прислівниково з νηστεύομεν; у контексті найприродніше виражає повторюваність посту.
- source_word: οἱ δὲ μαθηταί σου
  choice: а твої учні
  rationale: «А» природно передає протиставлення між звичаями двох груп.
- source_word: οὐ νηστεύουσιν
  choice: не постять
  rationale: Теперішній час передає звичайну практику, а не обов’язково лише одну конкретну нагоду.
theological_decisions:
- issue: Характер нарікання щодо посту
  choice: Питання подано як зіставлення звичної релігійної практики.
  alternative: Розуміти слова як пряме звинувачення учнів Ісуса в порушенні обов’язку або як згадку лише про один конкретний піст.
  rationale: Форми теперішнього часу та прислівникове πολλά вказують на повторювану практику. Переклад не посилює запитання до доктринального осуду й не звужує його до одного випадку.
translation_notes:
  register: Сучасна, природна й гідна українська оповідна мова. Пряму мову передано без архаїзмів; збережено контраст і загальний характер запитання.
