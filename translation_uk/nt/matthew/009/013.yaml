id: MAT.9.13
reference: Matthew 9:13
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: πορευθέντες δὲ μάθετε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν· οὐ γὰρ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/013.yaml
  text: 'But go and learn what this means: ‘I desire mercy and not sacrifice.’ For I did not come to call the righteous[c][b][a], but sinners.'
translation:
  language: uk
  text: 'А ви підіть і навчіться, що означає: «Милосердя Я хочу, а не жертви».[a] Бо Я прийшов покликати не праведних, а грішників.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Цитата з Осії 6:6. Буквальніше: «що це є».'
    reason: cross_reference; lexical_alternative
  - marker: b
    text: Можливо, «тих, хто вважає себе праведним»; грецький текст буквально каже «праведних».
    reason: alternative_reading
lexical_decisions:
- source_word: πορευθέντες δὲ μάθετε
  choice: А ви підіть і навчіться
  rationale: Дієприкметник аориста разом із наказовим μάθετε утворює ідіоматичний заклик «підіть і навчіться»; «а ви» природно передає δὲ та докірливе протиставлення в контексті.
- source_word: τί ἐστιν
  choice: що означає
  rationale: Природний український вислів для запрошення збагнути значення наведеної цитати; буквальніше можливе «що це є».
- source_word: Ἔλεος
  choice: Милосердя
  rationale: Передає як співчутливе ставлення, так і ширший біблійний відтінок милості, не звужуючи зміст до почуття жалю.
- source_word: θέλω
  choice: Я хочу
  rationale: Прямий і природний відповідник волевиявлення; у біблійній цитаті зберігає належну гідність без архаїчного звучання.
- source_word: θυσίαν
  choice: жертви
  rationale: Звичний відповідник культової жертви; родовий відмінок після заперечення природний українською і не змінює грецького одниничного узагальнення.
- source_word: οὐ γὰρ ἦλθον καλέσαι
  choice: Бо Я прийшов покликати не
  rationale: Зберігає місійний зміст ἦλθον і широкий сенс καλέσαι як заклику чи покликання.
- source_word: δικαίους
  choice: праведних
  rationale: Відтворює субстантивований прикметник без уточнення, чи йдеться про справді праведних, чи про тих, хто вважає себе такими.
- source_word: ἁμαρτωλούς
  choice: грішників
  rationale: Стандартний і чіткий відповідник, який зберігає різке протиставлення категорії «праведних».
theological_decisions:
- issue: Сила цитати з Осії 6:6
  choice: «Милосердя Я хочу, а не жертви»
  alternative: Парафраза, ніби Бог цілковито відкидає будь-які жертви, або послаблення до ситуативної переваги
  rationale: Пророче протиставлення збережено без перетворення його на розгорнуте твердження про скасування жертвоприношень і без послаблення докору.
- issue: Кого означають «праведні»
  choice: Залишити «праведних» без пояснювальної вставки
  alternative: «Тих, хто вважає себе праведним» або «самоправедних»
  rationale: Контекст допускає іронічне розуміння, однак грецький текст прямо його не позначає; переклад зберігає справжню неоднозначність.
translation_notes:
  register: Сучасна нормативна українська з гідним, але не архаїчним біблійним звучанням. Займенник «Я» написано з великої літери відповідно до поширеної української біблійної традиції; порядок слів у цитаті трохи підкреслює «милосердя».
