  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἔλεγον· Ἐν τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/034.yaml
  text: But the Pharisees were saying[a], “By the ruler of the demons he casts out the demons.”
translation:
  language: uk
  text: 'А фарисеї говорили: «Силою володаря[a] демонів Він виганяє демонів».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «правителя» чи традиційніше «князя».
    reason: Лексема ἄρχων означає особу, наділену владою; українською її можна передати як «володар», «правитель» або, в традиційному біблійному стилі, «князь».
lexical_decisions:
- source_word: δὲ
  choice: А
  rationale: Сполучник передає протиставлення схвальній реакції натовпу в попередньому вірші; українське «А» природно вводить контрастну думку фарисеїв.
- source_word: Φαρισαῖοι
  choice: фарисеї
  rationale: Усталена сучасна українська назва цієї юдейської релігійної групи; означеність передається контекстом, оскільки українська не має артикля.
- source_word: ἔλεγον
  choice: говорили
  rationale: Форма минулого часу недоконаного виду природно передає імперфект грецького дієслова — тривалу або повторювану дію.
- source_word: Ἐν τῷ ἄρχοντι
  choice: Силою володаря
  rationale: Прийменник ἐν із давальним тут має інструментальне значення. «Силою» чітко й природно передає звинувачення, ніби джерелом Ісусової влади є демонічний володар.
- source_word: ἄρχοντι
  choice: володаря
  rationale: «Володар» передає владне становище ἄρχων і звучить природно та гідно; «князь» можливий як традиційніший відповідник, але може викликати зайві станові асоціації.
- source_word: ἐκβάλλει
  choice: виганяє
  rationale: «Виганяє» є точним і зрозумілим відповідником ἐκβάλλω в контексті вигнання демонів.
- source_word: τὰ δαιμόνια / τῶν δαιμονίων
  choice: демонів
  rationale: «Демони» безпосередньо відповідає δαιμόνια й не послаблює надприродного змісту твердження; означеність грецького артикля в українській тут природно визначається контекстом.
theological_decisions:
- issue: Джерело сили, приписане Ісусові фарисеями
  choice: «Силою володаря демонів»
  alternative: «У володарі демонів»
  rationale: 'Інструментальне розуміння ἐν найкраще відповідає синтаксису та контексту: фарисеї звинувачують Ісуса в тому, що Він виганяє демонів владою або силою їхнього правителя. Переклад не підтверджує звинувачення, а зберігає його як пряму мову.'
- issue: Позначення надприродних істот словом δαιμόνια
  choice: «демони»
  alternative: «злі духи»
  rationale: Грецький текст уживає саме δαιμόνια, а не πνεύματα; «демони» є точнішим відповідником і зберігає богословську вагу вислову.
translation_notes:
  register: Сучасна стандартна українська мова з гідним біблійним звучанням. Порядок слів зберігає винесене наперед звинувачення про джерело сили. Велика літера у займеннику «Він» відповідає поширеній українській біблійній практиці щодо Ісуса, не додаючи нового змісту.
