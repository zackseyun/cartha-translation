source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀στραφεὶς καὶ ἰδὼν αὐτὴν εἶπεν· Θάρσει, θύγατερ· ἡ πίστις σου σέσωκέν σε. καὶ ἐσώθη ἡ γυνὴ ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/022.yaml
  text: But Jesus[a], turning and seeing her, said, “Take courage, daughter[d][c][b]; your faith has saved you.” And the woman was healed from that hour.
translation:
  language: uk
  text: 'А Ісус, обернувшись і побачивши її, сказав: «Підбадьорся, дочко[a]: твоя віра[b] спасла тебе[c]». І від тієї години жінка зцілилася.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Будь відважна, дочко» чи «Не бійся, дочко».'
    reason: lexical_alternative
  - marker: b
    text: Грецьке слово πίστις тут можна також передати як «довіра».
    reason: alternative_reading
  - marker: c
    text: 'Або: «зцілила тебе» чи «оздоровила тебе». Грецьке дієслово може означати спасіння, порятунок або зцілення; основний текст зберігає ширший зміст слів Ісуса.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς καὶ ἰδὼν αὐτήν
  choice: обернувшись і побачивши її
  rationale: Дієприслівникова конструкція природно передає два грецькі аористові дієприкметники та послідовність дій, не уточнюючи напрямку повороту.
- source_word: Θάρσει
  choice: Не бійся
  rationale: У цьому звертанні імператив означає підбадьорення й заклик до впевненості. «Не бійся» — природний український відповідник у біблійному контексті; буквальніший відтінок наведено в примітці.
- source_word: θύγατερ
  choice: дочко
  rationale: Кличний відмінок зберігає родинну теплоту звертання без доданого означення на зразок «люба».
- source_word: ἡ πίστις σου
  choice: твоя віра
  rationale: «Віра» є усталеним і семантично містким відповідником πίστις; у цьому контексті слово також має відтінок довіри.
- source_word: σέσωκέν σε
  choice: спасла тебе
  rationale: Дококонаний вид передає результативність грецького перфекта, а «спасла» зберігає ширший діапазон σῴζω — спасіння, порятунок і зцілення.
- source_word: ἐσώθη ἡ γυνή
  choice: жінка зцілилася
  rationale: У підсумку оповіді контекст прямо вказує на фізичне одужання; зворотна форма природно передає стан, що настав із жінкою.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: від тієї години
  rationale: Формально близький і зрозумілий вислів, який зберігає часовий образ оригіналу.
theological_decisions:
- issue: Значення πίστις
  choice: віра
  alternative: довіра
  rationale: «Віра» зберігає усталене богословське й загальномовне значення, тоді як «довіра» пояснює доречний тут особистісний відтінок.
- issue: Передача σῴζω у прямій мові та оповідному висновку
  choice: «спасла тебе» у словах Ісуса; «зцілилася» в оповідному висновку
  alternative: «зцілила тебе» або «оздоровила тебе» в обох випадках
  rationale: Різна передача того самого грецького дієслова зберігає його ширший спасительно-зцілювальний зміст у словах Ісуса, а в останньому реченні виразно називає безпосередній фізичний результат.
translation_notes:
  register: Сучасна нормативна українська з гідним біблійним звучанням. Дієприслівникова конструкція зберігає рух грецького речення; кличний «дочко» звучить природно й тепло. Формулу «від тієї години» залишено як виразний часовий семітизм, зрозумілий сучасному читачеві.
