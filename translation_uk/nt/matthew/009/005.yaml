  source_fidelity: '«Бо що легше: сказати… чи сказати…?» точно передає питальну риторичну конструкцію τί γὰρ ἐστιν εὐκοπώτερον, зберігаючи пояснювальне «бо», паралельні інфінітиви та дві наведені альтернативи. «Твої гріхи прощені» є природною українською станово-результативною передачею Ἀφίενταί σου αἱ ἁμαρτίαι і не нав’язує часової чи доктринальної інтерпретації. «Встань і ходи» належно передає Ἔγειρε καὶ περιπάτει.'
