    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ ἐστιν εὐκοπώτερον
  choice: Бо що легше
  rationale: τί з порівняльним εὐκοπώτερον ставить питання про дві альтернативи; природне українське «що легше» зберігає цю структуру. γάρ передано як «бо», щоб відтворити пояснювальний зв’язок із попереднім висловом.
- source_word: εἰπεῖν
  choice: сказати
  rationale: Звичайний інфінітив мовлення; однаковий переклад в обох частинах зберігає паралелізм.
- source_word: Ἀφίενταί σου αἱ ἁμαρτίαι
  choice: Твої гріхи прощені
  rationale: Теперішній пасивний індикатив із «гріхи» як підметом природно передається українською результативно-становою конструкцією «прощені», без нав’язування тривалого процесу.
- source_word: ἁμαρτίαι
  choice: гріхи
  rationale: Стандартний і контекстуально точний відповідник, без додавання метафори боргу.
- source_word: Ἔγειρε
  choice: Встань
  rationale: Аористовий наказовий спосіб ἐγείρω в оповіді про зцілення означає безпосередню фізичну дію; «встань» є природним сучасним відповідником.
- source_word: καὶ περιπάτει
  choice: і ходи
  rationale: Теперішній наказовий спосіб περιπατέω передає продовжену дію після вставання; українське «ходи» стисло й природно це виражає.
- source_word: σου
  choice: твої
  rationale: Займенник другої особи однини передано особовою формою «твої» відповідно до узгодження з множиною «гріхи».
theological_decisions:
- issue: Передача Ісусового проголошення прощення
  choice: Твої гріхи прощені
  alternative: Твої гріхи було прощено
  rationale: Грецький теперішній пасив допускає станово-результативне розуміння. Основний варіант зберігає безпосередність проголошення й не визначає точніше за текст часовий аспект прощення.
translation_notes:
  register: Сучасна стандартна українська мова; виклад природний, стислий і гідний. Звертання в однині збережено. Паралель «сказати… чи сказати» відтворює риторичну будову оригіналу.
