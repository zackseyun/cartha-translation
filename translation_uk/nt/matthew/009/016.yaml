  yaml_path: translation/nt/matthew/009/016.yaml
  text: But no one puts a patch of unshrunk cloth on an old garment, for the patch pulls away from the garment, and a worse tear results.
translation:
  language: uk
  text: Але ніхто не накладає на стару одежину латки з неваляної тканини[a], бо латка відривається від одежини, і розрив стає гіршим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «з незсілої тканини»; грецьке слово означає тканину, яку ще не обробили валянням. Така тканина може сісти й відірватися від старої одежини.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: ніхто
  rationale: Природний український відповідник неозначеного заперечного підмета, що зберігає загальність вислову.
- source_word: δὲ
  choice: Але
  rationale: Передає легке протиставлення й перехід від попереднього контексту.
- source_word: ἐπιβάλλει
  choice: накладає
  rationale: Зберігає загальне значення «класти/накладати на», не уточнюючи прямо спосіб прикріплення латки дієсловом «пришивати».
- source_word: ἐπίβλημα
  choice: латки
  rationale: У контексті лагодження одягу це найбільш природний і точний сучасний український відповідник.
- source_word: ῥάκους ἀγνάφου
  choice: з невибіленого полотна
  rationale: ἀγνάφου означає тканину, яка ще не пройшла валяння чи остаточної обробки; традиційно зрозуміле «невибілене» наближено передає необроблений стан, а примітка уточнює технічний зміст.
- source_word: ἐπὶ ἱματίῳ παλαιῷ
  choice: на старий одяг
  rationale: ἱμάτιον тут позначає предмет одягу загалом; «одяг» звучить природно й не звужує значення до плаща.
- source_word: αἴρει
  choice: потягне за собою
  rationale: У цьому контексті дієслово описує, як нова латка тягне тканину старого одягу; формулювання ясно передає механіку подальшого розриву.
- source_word: τὸ πλήρωμα αὐτοῦ
  choice: латка
  rationale: Буквально «його заповнення» — те, чим заповнено пошкоджене місце; повтор «латка» природно й однозначно називає референт.
- source_word: ἀπὸ τοῦ ἱματίου
  choice: тканину одягу
  rationale: Вислів передає відрив від одягу; в українській конструкція «потягне за собою тканину одягу» природно виражає відокремлення та його наслідок.
- source_word: χεῖρον σχίσμα γίνεται
  choice: розрив стане ще більшим
  rationale: Передає порівняльний χεῖρον і результативне γίνεται природною українською мовою; «ще більшим» у цьому образі означає гірше пошкодження.
