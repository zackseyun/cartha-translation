id: MAT.9.32
reference: Matthew 9:32
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Αὐτῶν δὲ ἐξερχομένων ἰδοὺ προσήνεγκαν αὐτῷ ⸀ἄνθρωπον κωφὸν δαιμονιζόμενον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/032.yaml
  text: As they were going out[a], behold, they brought to him a mute[c][b], demon-possessed man.
translation:
  language: uk
  text: Коли ж вони виходили, аж ось до нього привели німого[a] чоловіка, одержимого демоном[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «глухого». Грецьке слово залежно від контексту може означати людину, яка не чує або не говорить. Те, що в наступному вірші цей чоловік заговорив, підтримує переклад «німого».
    reason: lexical_alternative
  - marker: b
    text: Або «того, хто був під владою демона»; дослівніше — «демонізованого».
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτῶν δὲ ἐξερχομένων
  choice: Коли ж вони виходили
  rationale: Генітивний абсолют передано природною українською часовою конструкцією; «ж» відбиває перехід δέ до наступної сцени.
- source_word: ἰδοὺ
  choice: аж ось
  rationale: Зберігає функцію привернення уваги й оповідну виразність, водночас звучить природно сучасною українською.
- source_word: προσήνεγκαν αὐτῷ
  choice: до нього привели
  rationale: У цьому контексті προσφέρω означає привести або доставити людину до Ісуса; давальний αὐτῷ явно передано словами «до нього».
- source_word: ἄνθρωπον
  choice: чоловіка
  rationale: У розповіді йдеться про конкретного чоловіка; цей відповідник точний і природний.
- source_word: κωφὸν
  choice: німого
  rationale: κωφός може означати нездатність чути або говорити, але наступний вірш наголошує, що чоловік заговорив, тому в цьому контексті найімовірніше значення — «німий».
- source_word: δαιμονιζόμενον
  choice: одержимого демоном
  rationale: Зрозуміло передає стан, позначений дієприкметником δαιμονιζόμενον, не додаючи подробиць про точний характер демонічного впливу.
theological_decisions:
- issue: Передача мови про демонічне ураження
  choice: одержимого демоном
  alternative: під владою демона; демонізованого
  rationale: Текст прямо пов’язує стан чоловіка з демоном, але не пояснює механізму чи ступеня цього впливу. Основний варіант є природним українською, а примітка зберігає ширше можливе розуміння грецького слова.
translation_notes:
  register: Сучасна стандартна українська, природна й гідна оповідна мова. «Аж ось» зберігає виразність ἰδού без архаїчності. Займенник щодо Ісуса подано з малої літери за загальними нормами сучасної української.
