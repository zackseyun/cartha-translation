review_pass:
  verdict: approve
  source_fidelity: Текст точно передає генітивний абсолют («Коли ж вони виходили»), вказівне ἰδού («аж ось»), дію προσήνεγκαν αὐτῷ («до нього привели») та два означення чоловіка. «Німого» обґрунтовано найближчим контекстом наступного вірша, не приховуючи іншого можливого значення κωφός у примітці. «Одержимого демоном» є усталеним і зрозумілим відповідником δαιμονιζόμενον без додаткових пояснень поза текстом.
  naturalness: Вислів звучить природно сучасною стандартною українською. «Коли ж вони виходили, аж ось» зберігає оповідний перехід і видільну функцію ἰδού без неприродної архаїзації. Порядок слів і сполучення «німого чоловіка, одержимого демоном» ясні та плавні.
  terminology: «Чоловіка», «німого» та «одержимого демоном» ужито послідовно й у відповідному біблійному оповідному регістрі. Примітки належно подають лексичну неоднозначність κωφός та альтернативний спосіб передати δαιμονιζόμενον. Якорі приміток розміщені при відповідних словах і коректні.
