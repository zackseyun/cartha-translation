lexical_decisions:
- source_word: ἔλεγεν
  choice: Він казав
  rationale: Український недоконаний вид природно передає імперфект, який змальовує тривалу або повторювану мову в цій сцені.
- source_word: Ἀναχωρεῖτε
  choice: Відійдіть
  rationale: Наказовий спосіб множини велить присутнім відійти; цей відповідник природний у сучасній українській і не звучить надмірно формально.
- source_word: οὐ γὰρ
  choice: бо ... не
  rationale: «Бо» стисло й природно вводить причину наказу, виражену часткою γάρ.
- source_word: ἀπέθανεν
  choice: не померла
  rationale: Док доконаного виду передає смерть як подію, відповідно до грецького аориста, і зберігає пряме протиставлення зі словом «спить».
- source_word: τὸ κοράσιον
  choice: дівчинка
  rationale: κοράσιον позначає дівчинку або юну дівчину; у цьому контексті «дівчинка» є природним українським відповідником без архаїчного забарвлення.
- source_word: ἀλλὰ καθεύδει
  choice: а спить
  rationale: Теперішній час і буквальний образ сну передано стисло та природно, без доданого тлумачення.
- source_word: κατεγέλων αὐτοῦ
  choice: вони сміялися з нього
  rationale: Вислів зберігає буквальний образ сміху, спрямованого проти Ісуса, а недоконаний вид передає грецький імперфект; значення насмішки уточнено у примітці.
theological_decisions:
- issue: Слова Ісуса, що дівчинка «не померла, а спить»
  choice: Збережено буквальний образ «спить» без пояснення в основному тексті.
  alternative: Додати «лише спить» або прямо пояснити сон як метафору смерті.
  rationale: Грецький текст залишає вислів навмисно напруженим у межах оповіді. Буквальний переклад не вирішує наперед, чи це метафоричне, перспективне або інше вживання.
translation_notes:
  register: Сучасна стандартна українська; проста, гідна оповідна мова. Займенник «нього» написано з малої літери відповідно до звичайної сучасної практики перекладу, без внесення конфесійної стилістики.
