  text: ὁ ⸀δὲ ἀκούσας ⸀εἶπεν· Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/012.yaml
  text: But when he heard it[a], he said, “Those who are well have no need of a physician, but those who are sick do.”
translation:
  language: uk
  text: 'А Ісус, почувши це, сказав: «Не здорові потребують лікаря, а хворі».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: почувши це
  rationale: Аористовий дієприкметник передає попередню щодо головного дієслова дію; займенник «це» природно відтворює невиражений у грецькому тексті об’єкт, зрозумілий із контексту.
- source_word: δὲ
  choice: А
  rationale: Частка позначає легке протиставлення або перехід; українське «А» природно вводить відповідь Ісуса без надмірно різкого контрасту.
- source_word: εἶπεν
  choice: сказав
  rationale: Нейтрально й точно передає звичайне дієслово мовлення, не додаючи прямо не вираженого значення «відповів».
- source_word: Οὐ χρείαν ἔχουσιν
  choice: не ... потребують
  rationale: Природний сучасний український відповідник звороту χρείαν ἔχειν; зміст номінальної грецької конструкції збережено без буквалізму.
- source_word: οἱ ἰσχύοντες
  choice: здорові
  rationale: Хоча дієслово буквально пов’язане із силою, у медичному протиставленні до οἱ κακῶς ἔχοντες воно ідіоматично означає тих, хто добре почувається, тобто здорових.
- source_word: ἰατροῦ
  choice: лікаря
  rationale: Звичайний, точний і стилістично гідний сучасний відповідник ἰατρός.
- source_word: οἱ κακῶς ἔχοντες
  choice: хворі
  rationale: Грецький ідіоматичний вислів у цьому медичному контексті означає людей, які хворіють; субстантивований прикметник робить вислів стислим і природним.
theological_decisions:
- issue: Метафоричний чи суто фізичний сенс прислів’я
  choice: Зберегти вислів у прямій медичній образності, не пояснюючи духовного застосування в самому вірші.
  alternative: Перекласти тлумачно, прямо назвавши грішників або їхню духовну потребу.
  rationale: Грецький текст формулює прислів’я медично, тоді як його застосування до грішників випливає з контексту. Прямий переклад не усуває богословської напруги.
translation_notes:
  register: Сучасна стандартна українська, стислий і гідний афористичний стиль. Підмет «Ісус» подано явно, оскільки українське «він» без ширшого контексту було б менш прозорим; це контекстуальне уточнення, а не зміна змісту.
