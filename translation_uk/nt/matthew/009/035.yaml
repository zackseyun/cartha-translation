  text: Καὶ περιῆγεν ὁ Ἰησοῦς τὰς πόλεις πάσας καὶ τὰς κώμας, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν ⸀μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/035.yaml
  text: And Jesus went throughout all the cities and villages[b][a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness.
translation:
  language: uk
  text: Ісус обходив усі міста й села, навчаючи в їхніх синагогах, звіщаючи Добру Звістку Царства[a] та зцілюючи кожну хворобу й кожну недугу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Євангеліє Царства»; можливий зміст: «Добру Звістку про Царство».'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «кожну хворобу й кожну неміч».'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιῆγεν
  choice: обходив
  rationale: Недоконаний вид передає тривалу й повторювану мандрівну діяльність Ісуса; «обходив» природно виражає рух по різних поселеннях.
- source_word: πόλεις πάσας καὶ τὰς κώμας
  choice: усі міста й села
  rationale: Збережено розрізнення між більшими міськими осередками та меншими поселеннями, а πάσας передано словом «усі».
- source_word: διδάσκων
  choice: навчаючи
  rationale: Дієприслівник зберігає супровідну тривалу дію й природно узгоджується з іншими дієприкметниковими конструкціями грецького тексту.
- source_word: συναγωγαῖς αὐτῶν
  choice: в їхніх синагогах
  rationale: Збережено історичний термін «синагоги» та займенник αὐτῶν, який стосується громад названих міст і сіл.
- source_word: κηρύσσων
  choice: звіщаючи
  rationale: «Звіщаючи» передає публічне оголошення, закладене в κηρύσσω, без надмірно вузького церковного відтінку.
- source_word: τὸ εὐαγγέλιον τῆς βασιλείας
  choice: Добру Звістку Царства
  rationale: «Добра Звістка» прозоро передає значення εὐαγγέλιον, а родовий відмінок «Царства» зберігає стислу й потенційно багатозначну грецьку конструкцію.
- source_word: θεραπεύων
  choice: зцілюючи
  rationale: У контексті євангельських розповідей про чудесні зцілення це природний і точний відповідник θεραπεύω.
- source_word: πᾶσαν νόσον
  choice: кожну хворобу
  rationale: «Хвороба» є звичайним сучасним відповідником νόσος; «кожну» зберігає повторений у грецькому тексті всеохопний вислів.
- source_word: πᾶσαν μαλακίαν
  choice: кожну неміч
  rationale: «Неміч» передає відтінок слабкості або недуги в μαλακία та зберігає лексичне розрізнення з νόσος.
theological_decisions:
- issue: Передача εὐαγγέλιον
  choice: Добра Звістка
  alternative: Євангеліє
  rationale: Основний варіант безпосередньо розкриває значення грецького слова сучасному читачеві, тоді як традиційний термін подано в примітці.
- issue: Значення родового відмінка в τῆς βασιλείας
  choice: Царства
  alternative: про Царство
  rationale: Родовий відмінок залишено без розгортання, щоб не звужувати його лише до значення теми звістки; природніший пояснювальний варіант наведено в примітці.
- issue: Всеохопність πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: кожну хворобу й кожну неміч
  alternative: усяку хворобу й усяку недугу
  rationale: Повторення «кожну» відтворює повторене πᾶσαν і не послаблює всеохопного характеру вислову.
translation_notes:
  register: Сучасна літературна українська мова з гідним біблійним звучанням. Дієприслівникові форми зберігають ритм і паралелізм оригіналу. Великі літери в «Добра Звістка» та «Царство» позначають усталені богословсько-смислові поняття, не додаючи конфесійного тлумачення.
