  source_fidelity: 'Основний зміст передано точно: риторичне запитання з очікуваною заперечною відповіддю, часовий контраст, пасивне «заберуть» і майбутній піст відповідають грецькому текстові. Однак «весільні дружби» є регіонально забарвленим і не всюди прозорим позначенням; воно може неясно вказувати на роль, яку має на увазі ідіома υἱοὶ τοῦ νυμφῶνος.'
