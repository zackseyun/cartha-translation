reference: Matthew 9:15
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος πενθεῖν ἐφ’ ὅσον μετ’ αὐτῶν ἐστιν ὁ νυμφίος; ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/015.yaml
  text: And Jesus said to them[a], “The wedding attendants cannot mourn as long as the bridegroom is with them, can they? But days will come when the bridegroom is taken away from them[b], and then they will fast.”
translation:
  language: uk
  text: 'Ісус сказав їм: «Хіба друзі нареченого[a] можуть сумувати, поки наречений із ними? Але настануть дні, коли нареченого заберуть від них[b], і тоді вони поститимуть».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сини весільного покою» — ідіоматичний вислів про друзів нареченого або учасників весільного почту.'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «коли нареченого усунуть від них». Пасивне формулювання вказує на щось більше, ніж звичайний відхід.'
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱοὶ τοῦ νυμφῶνος
  choice: весільні дружби
  rationale: Буквально «сини весільного покою» — семітський ідіоматичний вислів про товаришів молодого, які брали участь у весільному святкуванні. Українське «весільні дружби» природно передає їхню роль, а примітка зберігає буквальний образ.
- source_word: πενθεῖν
  choice: сумувати
  rationale: Дієслово означає тяжко сумувати, оплакувати. «Сумувати» природно звучить у риторичному запитанні та зберігає протиставлення весільній радості й посту.
- source_word: ἐφ’ ὅσον
  choice: поки
  rationale: Стисло й природно передає часовий зміст «доти, доки / увесь той час, коли».
- source_word: νυμφίος
  choice: молодий
  rationale: У сучасній стандартній українській «молодий» є звичним позначенням нареченого в контексті весілля та зберігає весільний образ.
- source_word: ἀπαρθῇ
  choice: заберуть
  rationale: Пасивна форма вказує не просто на відхід, а на усунення або відібрання. Неозначено-особове «заберуть» природно відтворює цей пасивний і потенційно насильницький відтінок, не називаючи виконавця.
- source_word: νηστεύσουσιν
  choice: поститимуть
  rationale: Точно й лаконічно передає майбутню форму дієслова «постити».
- source_word: Μὴ δύνανται ... ;
  choice: Хіба ... можуть ...?
  rationale: Питання з μή очікує заперечної відповіді. Українська конструкція з «хіба» передає цю риторичну силу.
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: Але настануть дні
  rationale: Природний український відповідник усталеного грецького вислову; «але» передає контраст δέ.
theological_decisions:
- issue: Можливе христологічне значення образу молодого
  choice: Зберегти образ молодого без пояснювального ототожнення в самому перекладі
  alternative: Розгорнути образ і прямо назвати Ісуса месіанським молодим
  rationale: Сам вірш подає весільний образ і дає читачеві змогу побачити його значення, але не формулює такого ототожнення пояснювально. Переклад не повинен додавати доктринального тлумачення.
- issue: Відтінок насильницького усунення в ἀπαρθῇ
  choice: «коли молодого заберуть від них»
  alternative: «коли молодий піде від них» або «буде усунений від них»
  rationale: «Заберуть» зберігає натяк на дію над молодим і можливе передвіщення смерті Ісуса, не роблячи цього підтексту явним твердженням.
translation_notes:
  register: Сучасна, зрозуміла й водночас гідна українська мова. Риторичне «Хіба…?» відтворює очікувану заперечну відповідь. «Весільні дружби» передає конкретну соціальну роль; буквальний семітський ідіом пояснено в примітці. Усі маркери приміток наявні в основному тексті.
