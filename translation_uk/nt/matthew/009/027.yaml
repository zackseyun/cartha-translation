  text: Καὶ παράγοντι ἐκεῖθεν τῷ Ἰησοῦ ἠκολούθησαν ⸀αὐτῷ δύο τυφλοὶ κράζοντες καὶ λέγοντες· Ἐλέησον ἡμᾶς, ⸀υἱὲ Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/027.yaml
  text: And as Jesus was passing on from there[a], two blind men followed him, crying out and saying, “Have mercy on us, Son of David.”
translation:
  language: uk
  text: 'Коли Ісус ішов звідти далі, за Ним пішли двоє сліпих чоловіків, вигукуючи: «Змилуйся над нами, Сину Давидів!»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Син Давидів» — царсько-месіанський титул, який указує на Ісуса як на обіцяного спадкоємця з роду Давида.
    reason: cross_reference
lexical_decisions:
- source_word: παράγοντι ἐκεῖθεν τῷ Ἰησοῦ
  choice: Коли Ісус ішов звідти далі
  rationale: 'Конструкція з дієприкметником теперішнього часу передає супровідну в часі дію: подія сталася, коли Ісус залишав те місце й ішов далі. Такий переклад природний українською та зберігає рух оповіді.'
- source_word: ἠκολούθησαν αὐτῷ
  choice: за Ним пішли
  rationale: У цьому контексті ἀκολουθέω означає фізично йти слідом. «За Ним пішли» природно передає початок їхнього слідування за Ісусом.
- source_word: δύο τυφλοὶ
  choice: двоє сліпих чоловіків
  rationale: Прикметник чоловічого роду вжито субстантивовано; додане «чоловіків» робить зміст ясним і природним сучасною українською.
- source_word: κράζοντες καὶ λέγοντες
  choice: вигукуючи
  rationale: κράζω виражає гучний, наполегливий заклик. Одне природне українське дієслово передає мовленнєвий зміст обох грецьких дієприкметників без неприродного дублювання «вигукуючи й кажучи».
- source_word: Ἐλέησον ἡμᾶς
  choice: Змилуйся над нами
  rationale: Пряме прохання про милосердну дію. «Змилуйся над нами» є усталеним, точним і гідним українським відповідником.
- source_word: υἱὲ Δαυίδ
  choice: Сину Давидів
  rationale: Збережено традиційну форму царсько-месіанського титулу, а не замінено її пояснювальним «нащадку Давида».
theological_decisions:
- issue: Месіанське значення вислову υἱὲ Δαυίδ
  choice: У головному тексті передано титулом «Сину Давидів»
  alternative: Пояснювальний переклад «нащадку Давида» або розширення «Месіє, Сину Давидів»
  rationale: Грецький текст подає традиційний титул без додаткового пояснення. Його буквальне збереження передає царсько-месіанський відтінок і не вносить у текст слів, яких у джерелі немає.
translation_notes:
  register: Сучасна стандартна українська, природна й гідна оповідна мова. Займенник «Ним» написано з великої літери як нормативну форму пошанного написання щодо Ісуса; синтаксис не архаїзовано. Маркер примітки поставлено безпосередньо після титулу, якого вона стосується.
