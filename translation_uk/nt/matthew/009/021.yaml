lexical_decisions:
- source_word: ἔλεγεν
  choice: казала
  rationale: Імперфект передає тривалу або повторювану внутрішню мову; український недоконаний вид «казала» природно зберігає цей аспект.
- source_word: γὰρ
  choice: Бо
  rationale: Сполучник пояснює попередню розповідь; «бо» природно передає пояснювальний зв’язок.
- source_word: ἐν ἑαυτῇ
  choice: сама собі
  rationale: Природний український відповідник вислову про внутрішнє мовлення; жіночий рід узгоджено з особою в контексті.
- source_word: Ἐὰν μόνον
  choice: Якщо лише
  rationale: Передає умовність і наголос на єдиній мінімальній дії, не додаючи значення бажальності.
- source_word: ἅψωμαι
  choice: доторкнуся
  rationale: Умовна конструкція з аористом кон’юнктива стосується майбутньої одноразової дії; доконаний вид «доторкнуся» природний українською.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: Його одягу
  rationale: ἱμάτιον позначає одяг, часто верхній; загальне «одяг» не звужує значення до конкретного виду вбрання.
- source_word: σωθήσομαι
  choice: буду спасенна
  rationale: Форма майбутнього пасиву від σῴζω зберігає широке значення спасіння, хоча в безпосередньому контексті йдеться про тілесне зцілення; контекстуальну альтернативу подано в примітці.
theological_decisions:
- issue: Передача σωθήσομαι в контексті зцілення
  choice: буду спасенна
  alternative: одужаю; буду зцілена
  rationale: Грецьке σῴζω може означати як спасіння чи порятунок, так і зцілення. Основний текст зберігає широту слова й можливий богословський відгомін, а примітка пояснює безпосередній тілесний сенс.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Зворот «сама собі» природно передає внутрішнє мовлення; формулювання «буду спасенна» навмисно зберігає лексичну широту оригіналу.
