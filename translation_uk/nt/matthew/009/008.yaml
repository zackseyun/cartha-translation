id: MAT.9.8
reference: Matthew 9:8
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ὄχλοι ⸀ἐφοβήθησαν καὶ ἐδόξασαν τὸν θεὸν τὸν δόντα ἐξουσίαν τοιαύτην τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/008.yaml
  text: But when the crowds saw it[a], they were afraid and glorified God[b], who had given such authority to men.
translation:
  language: uk
  text: Коли ж натовпи побачили це, вони злякалися[a] і прославили Бога, який дав людям таку владу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «сповнилися благоговійного трепету». Грецьке дієслово буквально передає страх, який у цьому контексті може включати благоговійний подив.'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «дав таку владу людському роду». Грецький вислів стоїть у множині — «людям» — і може мати узагальнювальне значення.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: коли … побачили це
  rationale: Аористовий дієприкметник природно передано підрядним реченням часу; «це» відсилає до щойно описаної події.
- source_word: δὲ
  choice: ж
  rationale: Частка позначає перехід до реакції натовпів; українське «ж» природно передає цей легкий контраст без надмірного протиставлення.
- source_word: οἱ ὄχλοι
  choice: натовпи
  rationale: Збережено множину грецького іменника; слово є природним у сучасній українській.
- source_word: ἐφοβήθησαν
  choice: злякалися
  rationale: Передає пряме значення φοβέομαι — відчути страх; можливий відтінок благоговійного трепету не внесено безпосередньо в текст.
- source_word: ἐδόξασαν
  choice: прославили
  rationale: Усталений і точний відповідник богословськи вагомого дієслова δοξάζω.
- source_word: τὸν θεὸν
  choice: Бога
  rationale: Прямий додаток при «прославили»; стандартний український відповідник.
- source_word: τὸν δόντα
  choice: який дав
  rationale: Означальний аористовий дієприкметник природно передано відносним реченням; український доконаний вид уже виражає завершеність дії.
- source_word: ἐξουσίαν
  choice: владу
  rationale: У контексті йдеться про право й повноваження діяти, а не лише про силу; «влада» стисло зберігає цей зміст.
- source_word: τοιαύτην
  choice: таку
  rationale: Безпосередній природний відповідник, що характеризує згадану владу за її видом або значущістю.
- source_word: τοῖς ἀνθρώποις
  choice: людям
  rationale: ἄνθρωποι тут може позначати людей загалом. Українське «людям» точно передає форму множини та не звужує її до осіб чоловічої статі.
theological_decisions:
- issue: Чи пом’якшувати реакцію натовпів від страху до благоговійного подиву
  choice: вони злякалися
  alternative: вони сповнилися благоговійного трепету
  rationale: φοβέομαι безпосередньо означає страх, хоча контекст допускає також благоговіння. Основний текст зберігає сильніше лексичне значення, а примітка — можливий відтінок.
- issue: Кому Бог дав таку владу
  choice: людям
  alternative: людському роду
  rationale: Множина τοῖς ἀνθρώποις може мати узагальнювальне значення. Переклад не вирішує, чи натовпи мають на увазі Ісуса як людину, людей як ширшу категорію або людство загалом.
translation_notes:
  register: Сучасна літературна українська з гідним, але доступним біблійним звучанням. Порядок слів природний для української; множину «натовпи» та богословськи значущі «прославили» і «влада» збережено.
