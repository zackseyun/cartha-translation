  to: 'Коли демона було вигнано, німий[a] заговорив. Натовпи здивувалися, кажучи: «Ніколи ще в Ізраїлі не було нічого подібного».'
  rationale: Замінено ширше «люди» на «натовпи», щоб передати οἱ ὄχλοι, і «дивувалися» на «здивувалися», щоб природніше відобразити аорист ἐθαύμασαν. Решту формулювання збережено за змістом; «не було нічого подібного» є природним українським передаванням безпрецедентності ἐφάνη οὕτως, не нав’язуючи вузького тлумачення дієслова.
