  text: καὶ ἐκβληθέντος τοῦ δαιμονίου ἐλάλησεν ὁ κωφός. καὶ ἐθαύμασαν οἱ ὄχλοι λέγοντες· Οὐδέποτε ἐφάνη οὕτως ἐν τῷ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/033.yaml
  text: And when the demon had been cast out[a], the mute man spoke. And the crowds were amazed, saying, “Never has anything like this appeared in Israel.”
translation:
  language: uk
  text: 'Коли демона було вигнано, німий[a] заговорив. Натовпи здивувалися, кажучи: «Ніколи ще в Ізраїлі не було нічого подібного».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «глухий». Грецьке слово може означати як «глухий», так і «німий»; тут контекст підтримує значення «німий», бо наголошено, що він заговорив.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβληθέντος
  choice: коли ж ... було вигнано
  rationale: Аористовий пасивний дієприкметник у конструкції genitivus absolutus позначає дію, що передує головній; ця українська конструкція природно передає часовий зв’язок.
- source_word: τοῦ δαιμονίου
  choice: демона
  rationale: У євангельському контексті вигнання δαιμόνιον точно й усталено передається словом «демон».
- source_word: ἐλάλησεν
  choice: заговорив
  rationale: У контексті попередньої нездатності говорити українське «заговорив» природно передає здійснення мовлення, хоча сама аористова форма не вимагає окремо наголошувати тривалість дії.
- source_word: ὁ κωφός
  choice: німий
  rationale: κωφός може означати глухого або німого; безпосередній результат «заговорив» указує, що тут наголошено на нездатності говорити.
- source_word: ἐθαύμασαν
  choice: дивувалися
  rationale: Дієслово означає сильне здивування; «дивувалися» є природним і гідним сучасним українським відповідником.
- source_word: οἱ ὄχλοι
  choice: люди
  rationale: Буквально це «натовпи», однак у цьому короткому повідомленні «люди» природно позначає присутній загал без непритаманної українській множини «натовпи».
- source_word: Οὐδέποτε
  choice: ніколи ще
  rationale: «Ніколи ще» природно виражає твердження про безпрецедентність побаченого до цього моменту.
- source_word: ἐφάνη οὕτως
  choice: нічого подібного не було
  rationale: Буквально вислів може передаватися як «такого не було видно / не з’являлося»; українська ідіома «нічого подібного не було» природно зберігає зміст безпрецедентності, не уточнюючи понад текст, що саме є граматичним підметом.
- source_word: ἐν τῷ Ἰσραήλ
  choice: в Ізраїлі
  rationale: Стислий стандартний відповідник, який може стосуватися і народу, і сфери Ізраїлю, як у грецькому вислові.
theological_decisions:
- issue: Семантичний діапазон κωφός у контексті зцілення та вигнання демона
  choice: Передати як «німий»
  alternative: «глухий»
  rationale: Слово допускає обидва значення, але наступне «заговорив» показує, що оповідь наголошує на нездатності говорити. Примітка зберігає справжню лексичну неоднозначність.
- issue: Зміст ἐφάνη οὕτως
  choice: «нічого подібного не було»
  alternative: «такого ще не бачили» або «нічого подібного не з’являлося»
  rationale: Форма ἐφάνη допускає значення «з’явилося» та контекстуальне «було видно». Обраний український вислів передає безпрецедентність події, не нав’язуючи одного вузького тлумачення.
translation_notes:
  register: Сучасна стандартна українська, зрозуміла широкому читачеві, зі стриманим і гідним біблійним регістром. Сполучники «Коли ж» та «А» відтворюють послідовність оповіді без надмірної архаїзації.
