  to: І, увійшовши в човен, він переправився на той бік і прибув до свого міста.[a]
  rationale: The revision replaces two potentially misleading Ukrainian verbs while retaining the participial sequence, the boat setting, the directional force of διεπέρασεν, and the source text’s ambiguity concerning «his own city».
