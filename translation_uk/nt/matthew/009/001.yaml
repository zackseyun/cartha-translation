source:
  edition: SBLGNT
  text: Καὶ ⸀ἐμβὰς ⸀εἰς πλοῖον διεπέρασεν καὶ ἦλθεν εἰς τὴν ἰδίαν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/001.yaml
  text: And after getting into a boat[a], he crossed over and came to his own city.
translation:
  language: uk
  text: І, увійшовши в човен, він переправився на той бік і прибув до свого міста.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «рідного міста». Грецький текст буквально каже «свого міста»; тут, імовірно, мається на увазі Капернаум — місто, з яким Ісус був пов’язаний на цьому етапі розповіді.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβὰς
  choice: сівши
  rationale: Аористовий дієприкметник позначає дію, що передує основним дієсловам. «Сівши в човен» природно передає посадку в плавзасіб і зберігає послідовність дій.
- source_word: πλοῖον
  choice: човен
  rationale: Загальна назва плавзасобу; в контексті Галілейського моря українське «човен» природніше й точніше за «корабель». Відсутність артикля не потребує окремого відтворення українською.
- source_word: διεπέρασεν
  choice: переплив на той бік
  rationale: Дієслово передає перетин водойми з одного боку на інший. Вислів «переплив на той бік» зберігає напрямний відтінок і природно описує пересування човном.
- source_word: ἦλθεν
  choice: прибув
  rationale: У цьому контексті йдеться про досягнення місця призначення; «прибув» природніше українською, ніж буквальне «прийшов», оскільки подорож відбувалася човном.
- source_word: ἰδίαν πόλιν
  choice: свого міста
  rationale: Буквально зберігає значення належності або особливого зв’язку, не звужуючи його до місця народження чи конкретно названого міста.
- source_word: Καὶ ... καὶ
  choice: І ... і
  rationale: Повторений καί поєднує дії у простій оповідній послідовності. Початкове «І» зберігає зв’язок із попередньою розповіддю.
theological_decisions:
- issue: До якого міста стосується вислів «своє місто»
  choice: У головному тексті залишено нейтральне «своє місто» без називання міста.
  alternative: Передати як «рідне місто» або прямо ототожнити його з Капернаумом.
  rationale: Грецький текст не називає міста. Контекст, імовірно, вказує на Капернаум як місце діяльності Ісуса на цьому етапі, але переклад не повинен вносити це ототожнення до основного тексту.
translation_notes:
  register: Сучасна нормативна українська мова, проста й гідна оповідна манера. Дієприслівникова конструкція зберігає синтаксичну послідовність оригіналу, а «прибув» усуває неприродне в цьому контексті враження пересування пішки.
