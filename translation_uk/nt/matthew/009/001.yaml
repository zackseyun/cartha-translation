review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the narrative sequence and leaves ἰδίαν πόλιν unspecified. However, «сівши в човен» can mean merely sitting down after already being aboard rather than entering/boarding, and «переплив» normally suggests swimming in Ukrainian, which conflicts with the stated boat journey.
  naturalness: «Увійшовши в човен, він переправився на той бік і прибув до свого міста» is natural modern standard Ukrainian and clearly expresses travel by boat. The explicit «він» is stylistically acceptable.
  terminology: «Човен» is appropriate for πλοῖον in context. «Свого міста» directly reflects ἰδίαν πόλιν without deciding whether this means a hometown or a narrative base such as Capernaum. The footnote properly retains the tentative historical identification outside the main text.
  issues:
  - severity: medium
    issue: «Сівши в човен» for ἐμβὰς
    rationale: The Greek participle means entering or boarding the boat. Ukrainian «сівши в човен» may describe taking a seat and does not reliably convey boarding.
  - severity: medium
    issue: «переплив на той бік» for διεπέρασεν
    rationale: In ordinary Ukrainian, «переплив» commonly denotes swimming across. Since the text has Jesus in a boat, «переправився на той бік» better conveys crossing by watercraft without adding details.
  revised_text: І, увійшовши в човен, він переправився на той бік і прибув до свого міста.[a]
  revised_footnotes:
  - marker: a
    text: Або «рідного міста». Грецький текст буквально каже «свого міста»; тут, імовірно, мається на увазі Капернаум — місто, з яким Ісус був пов’язаний на цьому етапі розповіді.
    reason: lexical_alternative
  revision_rationale: The revision replaces two potentially misleading Ukrainian verbs while retaining the participial sequence, the boat setting, the directional force of διεπέρασεν, and the source text’s ambiguity concerning «his own city».
