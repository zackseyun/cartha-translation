  source_fidelity: 'Основний зміст передано правильно: ἐγερθεὶς — «підвівся», ἠκολούθει αὐτῷ — «пішов за ним», де займенник стосується начальника з попереднього вірша. Друга координована група правильно розуміється як учні Ісуса, що пішли за Ісусом. Однак явне дієслово в другій частині робить цей зв’язок безпосереднім і не покладає його на дещо стилізовану еліптичну конструкцію.'
