  text: Ісус підвівся й пішов за ним, і його учні пішли за Ісусом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγερθεὶς
  choice: підвівся
  rationale: Аористовий пасивний дієприкметник від ἐγείρω тут ужито неперехідно; «підвівся» природно передає перехід від попередньої розмови до руху.
- source_word: ἠκολούθει
  choice: пішов за ним
  rationale: Імперфект ἀκολουθέω описує слідування за попереднім співрозмовником. Українське «пішов за ним» природно передає і початок руху, і подальше прямування слідом.
- source_word: αὐτῷ
  choice: за ним
  rationale: Давальний займенник залежить від ἀκολουθέω; в українській нормативною конструкцією є «йти за ким». Займенник стосується начальника з попереднього вірша.
- source_word: μαθηταὶ
  choice: учні
  rationale: «Учні» — усталений і точний відповідник μαθηταί у Євангеліях, який зберігає зв’язок учителя та його послідовників.
- source_word: καὶ οἱ μαθηταὶ αὐτοῦ
  choice: а за Ісусом — і Його учні
  rationale: 'У грецькому тексті присудок при другій групі не повторено. Українська еліптична конструкція з тире зберігає цю стислість, а повторення імені «Ісус» усуває можливу займенникову двозначність: учні йдуть за Ісусом, тоді як Ісус іде за начальником.'
