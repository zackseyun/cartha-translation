id: MAT.9.37
reference: Matthew 9:37
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: τότε λέγει τοῖς μαθηταῖς αὐτοῦ· Ὁ μὲν θερισμὸς πολύς, οἱ δὲ ἐργάται ὀλίγοι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/037.yaml
  text: Then he says to his disciples[a], “The harvest indeed is plentiful[b], but the workers are few.”
translation:
  language: uk
  text: 'Тоді Він каже[a] Своїм учням: «Жниво велике[b], а робітників мало».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'У грецькому тексті вжито історичний теперішній час: «каже». Можна також передати минулим часом: «сказав».'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «Жниво рясне».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Тоді
  rationale: Стислий і природний часовий прислівник, який передає послідовність подій.
- source_word: λέγει
  choice: каже
  rationale: Теперішній час збережено як історичний теперішній, що передає оповідну жвавість грецького тексту.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: Своїм учням
  rationale: Зворот природно передає і давальний відмінок, і виразну присвійність αὐτοῦ.
- source_word: Ὁ μὲν ... οἱ δὲ
  choice: … а …
  rationale: Сполучник «а» природно й стисло передає зіставлення конструкції μέν…δέ без штучного «з одного боку… з іншого боку».
- source_word: θερισμός
  choice: жниво
  rationale: Зберігає сільськогосподарську метафору оригіналу та граматичне число грецького іменника.
- source_word: πολύς
  choice: велике
  rationale: У сполученні «жниво велике» передає значний обсяг урожаю; варіант «рясне» можливий, але дещо сильніше наголошує на достатку.
- source_word: ἐργάται
  choice: робітників
  rationale: Сучасне й зрозуміле позначення людей, які працюють; у контексті образу жнив їхня роль залишається очевидною.
- source_word: ὀλίγοι
  choice: мало
  rationale: Природна українська предикативна конструкція, яка прямо передає контраст із великим жнивом.
theological_decisions:
- issue: Метафоричний зміст вислову про жниво
  choice: Зберегти сільськогосподарську метафору без пояснення її місійного значення в основному тексті.
  alternative: Уточнити в перекладі, що жниво означає людей, готових прийняти служіння Ісуса.
  rationale: Сам вірш подає образ, не розкриваючи його референт прямо; пояснення в основному тексті звузило б закладену образність.
translation_notes:
  register: Сучасна стандартна українська мова з гідним біблійним звучанням. Синтаксис простий і виразний; метафору та історичний теперішній час збережено. Великі літери у займенниках щодо Ісуса відповідають усталеному шанобливому українському біблійному регістру.
