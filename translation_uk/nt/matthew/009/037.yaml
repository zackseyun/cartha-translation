  source_fidelity: Текст точно передає τότε, історичний теперішній час λέγει, явну присвійність у «Своїм учням» і контраст μέν...δέ. «Жниво велике, а робітників мало» зберігає образ і зміст грецького вислову без доданого тлумачення.
