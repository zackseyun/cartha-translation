  source_fidelity: Текст точно передає οἱ δὲ як наративний контраст («А вони»), часову переддію ἐξελθόντες («вийшовши»), поширення звістки в διεφήμισαν та локальний всеохопний обсяг ἐν ὅλῃ τῇ γῇ ἐκείνῃ («по всьому тому краю»). «Про Нього» є природним українським розгортанням грецького прямого додатка при дієслові поширення звістки.
  naturalness: Фраза звучить природно в сучасній стандартній українській, стисло й у належному біблійному наративному регістрі. Дієприслівниковий зворот «вийшовши» ясно позначає попередню дію.
  terminology: «Край» доречно передає локальне значення γῆ без невиправданого уточнення адміністративних меж. Примітка коректно зберігає можливі значення слова. Написання «Нього» з великої літери відповідає усталеній українській біблійній редакційній традиції й не змінює змісту.
