  text: οἱ δὲ ἐξελθόντες διεφήμισαν αὐτὸν ἐν ὅλῃ τῇ γῇ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/031.yaml
  text: But after they went out[a], they spread the news about him throughout that whole region.
translation:
  language: uk
  text: А вони, вийшовши, рознесли звістку про Нього по всьому тому краю.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «по всій тій землі». Грецьке γῆ може означати «земля», «край» або «місцевість».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: А вони
  rationale: Частка δέ позначає легке протиставлення попередній забороні Ісуса; українське «А» природно передає цей поворот оповіді без надмірно різкого контрасту.
- source_word: ἐξελθόντες
  choice: вийшовши
  rationale: Аористовий дієприкметник позначає дію, що передує головній; дієприслівник «вийшовши» стисло й природно зберігає цю часову послідовність.
- source_word: διεφήμισαν
  choice: рознесли звістку
  rationale: Дієслово означає широко розголошувати або поширювати відомості; «рознесли звістку» є зрозумілим сучасним відповідником і передає широке поширення повідомлення.
- source_word: αὐτὸν
  choice: про Нього
  rationale: За української конструкції «рознести звістку» грецький прямий додаток природно передається як зміст звістки — «про Нього».
- source_word: ἐν ὅλῃ τῇ γῇ ἐκείνῃ
  choice: по всьому тому краю
  rationale: γῆ тут найімовірніше означає місцеву територію або край; «по всьому» передає поширення в межах усієї цієї території.
theological_decisions:
- issue: Географічний обсяг γῆ
  choice: край
  alternative: земля; місцевість
  rationale: Контекст описує місцеве поширення звістки, а не всесвітній чи обов’язково національний масштаб. «Край» зберігає локальне географічне значення, не звужуючи його до точно визначеної адміністративної області.
translation_notes:
  register: Сучасна стандартна українська; виклад стислий, природний і гідний. Займенник «Нього» подано з великої літери відповідно до поширеної української біблійної традиції, без додавання змісту до грецького тексту.
