lexical_decisions:
- source_word: ἐλθὼν
  choice: Коли Ісус прийшов
  rationale: Аористовий дієприкметник передає часову послідовність; підрядне речення природно звучить сучасною українською.
- source_word: οἰκίαν
  choice: дому
  rationale: Пряме й природне позначення житла в цьому оповідному контексті.
- source_word: ἄρχοντος
  choice: правителя
  rationale: Зберігає загальне значення грецького слова й не вносить конкретнішого ототожнення з керівником синагоги з паралельних оповідей.
- source_word: ἰδὼν
  choice: побачив
  rationale: Простий природний відповідник у послідовній оповіді.
- source_word: αὐλητὰς
  choice: флейтистів
  rationale: Стисло й зрозуміло називає музикантів, які грали на духових інструментах типу флейти.
- source_word: ὄχλον
  choice: натовп
  rationale: Звичайний сучасний відповідник для ὄχλος в оповідному контексті.
- source_word: θορυβούμενον
  choice: що галасував
  rationale: Передає тривалий гучний неспокій без надмірного уточнення його емоційного характеру.
theological_decisions:
- issue: Ким був господар дому
  choice: правителя
  alternative: урядовця; керівника синагоги
  rationale: Матвій уживає лише загальне ἄρχων. Основний текст не конкретизує посаду на підставі паралельних оповідей.
