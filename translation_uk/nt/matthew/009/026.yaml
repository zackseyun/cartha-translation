  text: καὶ ἐξῆλθεν ἡ φήμη αὕτη εἰς ὅλην τὴν γῆν ἐκείνην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/026.yaml
  text: And this report went out into all that region[a].
translation:
  language: uk
  text: І ця звістка розійшлася по всьому тому краю[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «по всій тій землі» чи «по всій тій місцевості». Грецьке γῆ може означати землю, територію або край; тут воно, найімовірніше, стосується навколишньої місцевості, а не всієї землі.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: І
  rationale: Прямий і природний український відповідник, що зберігає послідовний плин розповіді.
- source_word: ἐξῆλθεν
  choice: розійшлася
  rationale: Буквально дієслово означає «вийшла», але щодо звістки сучасне українське «розійшлася» природно передає її поширення, не змінюючи змісту.
- source_word: ἡ φήμη αὕτη
  choice: ця звістка
  rationale: «Звістка» позначає повідомлення, яке стало відомим, і, на відміну від «чутки», не натякає на недостовірність; «ця» зберігає вказівний займенник.
- source_word: εἰς ὅλην τὴν γῆν ἐκείνην
  choice: по всьому тому краю
  rationale: У цьому місцевому контексті γῆ означає навколишню землю, край або місцевість, а не всю землю як світ; вислів природно передає повноту охоплення.
theological_decisions: []
translation_notes:
  register: Сучасна стандартна українська мова; стислий, гідний наративний стиль. «Розійшлася» обрано замість неприродного буквального «вийшла», а «край» зберігає локальний географічний масштаб і допускає властиву γῆ семантичну широту.
