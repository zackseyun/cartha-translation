  source_fidelity: «І ця звістка розійшлася по всьому тому краю» точно передає καὶ ἐξῆλθεν ἡ φήμη αὕτη εἰς ὅλην τὴν γῆν ἐκείνην. «Розійшлася» є природним контекстуальним відповідником для поширення звістки, а «край» належно відбиває локальне значення γῆ без необґрунтованого розширення до всього світу.
