  source_fidelity: 'Переклад точно передає ключові елементи грецького тексту: маркер ἰδού («І ось»), принесення паралізованого, його положення на ліжку, множинне «їхню віру», тепле звертання τέκνον і пасивне, без зазначення діяча, проголошення прощення. Недоконаний імперфект προσέφερον у цьому оповідному контексті допустимо передано минулим доконаним «принесли».'
  naturalness: Текст звучить природно сучасною стандартною українською, з доречним стримано-біблійним регістром. «Підбадьорся, дитино» є зрозумілим і теплим звертанням; «Твої гріхи прощаються» дещо формальніше, але коректно відтворює теперішній пасив оригіналу.
  terminology: «Паралізований», «віра» і «гріхи» — точні та усталені відповідники. «Дитино» належно передає лагідне τέκνον без невиправданого уточнення статі. Примітки належно зберігають невизначеність щодо складу групи, позначеної αὐτῶν, і подають природний альтернативний варіант пасивного вислову.
