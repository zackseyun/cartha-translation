source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ προσέφερον αὐτῷ παραλυτικὸν ἐπὶ κλίνης βεβλημένον. καὶ ἰδὼν ὁ Ἰησοῦς τὴν πίστιν αὐτῶν εἶπεν τῷ παραλυτικῷ· Θάρσει, τέκνον· ⸀ἀφίενταί ⸂σου αἱ ἁμαρτίαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/002.yaml
  text: And behold[a], they brought to him a paralytic lying on a bed. And when Jesus saw their faith, he said to the paralytic, “Take courage, child[c][b]; your sins are forgiven.”
translation:
  language: uk
  text: 'І ось, до Нього принесли паралізованого, який лежав на ліжку. Побачивши їхню віру[a], Ісус сказав паралізованому: «Підбадьорся, дитино! Твої гріхи прощаються[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Грецьке «їхню віру» може стосуватися тих, хто приніс паралізованого, або включати також самого паралізованого.
    reason: alternative_reading
  - marker: b
    text: 'Або: «Твої гріхи прощено».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: і ось
  rationale: Зберігає живу, спрямовану на привернення уваги силу грецького дискурсивного маркера й природно звучить у сучасній українській оповіді.
- source_word: προσέφερον
  choice: принесли
  rationale: У цьому контексті дієслово означає, що людину доправили до Ісуса. Український доконаний минулий природно передає завершену подію в послідовній оповіді, не заперечуючи недоконаного виду грецького імперфекта.
- source_word: παραλυτικὸν
  choice: паралізованого
  rationale: Субстантивований прикметник передано природним українським означенням особи без додавання відсутнього в грецькому тексті слова «чоловіка».
- source_word: ἐπὶ κλίνης βεβλημένον
  choice: який лежав на ліжку
  rationale: Природно описує положення паралізованого; «ліжко» надійніше передає κλίνη, ніж конкретніше «ноші» чи «килимок».
- source_word: πίστιν
  choice: віру
  rationale: Звичний і точний відповідник πίστις; у контексті йдеться про довіру, виявлену дією.
- source_word: Θάρσει
  choice: Підбадьорся
  rationale: Передає наказове підбадьорення без неприродного калькування; можливий зміст «не занепадай духом» міститься в цьому стислому зверненні.
- source_word: τέκνον
  choice: дитино
  rationale: Зберігає лагідну форму звертання й не конкретизує стать понад саме грецьке слово.
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: Твої гріхи прощаються
  rationale: Зберігає теперішню пасивну форму та не називає виконавця прощення, як і грецький текст.
- source_word: ἁμαρτίαι
  choice: гріхи
  rationale: Стандартний відповідник, який зберігає конкретну множину грецького іменника.
theological_decisions:
- issue: До кого належить вислів τὴν πίστιν αὐτῶν
  choice: Збережено множину «їхню віру» без уточнення складу групи.
  alternative: Розуміти це лише як віру тих, хто приніс паралізованого, або прямо включити до групи і самого паралізованого.
  rationale: Займенник у множині явно стосується кількох осіб, але текст не встановлює однозначно, чи входить до них паралізований. Переклад і примітка зберігають цю невизначеність.
- issue: Характер проголошення прощення
  choice: «Твої гріхи прощаються» — пасивне проголошення без названого виконавця.
  alternative: «Твої гріхи прощено» або формулювання з прямо названим Богом як виконавцем.
  rationale: Грецька пасивна форма не називає виконавця. Основний текст не додає богословського пояснення, водночас зберігаючи безпосередність Ісусового проголошення.
translation_notes:
  register: Сучасна стандартна українська мова з гідним, але доступним біблійно-оповідним звучанням. Звертання «дитино» зберігає теплоту оригіналу; синтаксис уникáє як архаїзмів, так і надмірно розмовних форм.
