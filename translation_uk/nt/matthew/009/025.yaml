  naturalness: «Коли ж натовп випровадили» є природною неозначено-особовою передачею грецького пасива. «Дівчинка встала» звучить сучасно, ясно й оповідно; воно краще відповідає віковому значенню іменника, ніж «дівчина підвелася».
  terminology: «Взя́в її за руку» є точним і сталим відповідником ἐκράτησεν τῆς χειρὸς αὐτῆς. Для ἠγέρθη основний варіант «встала» не нав’язує тлумачення щодо агента; примітка зберігає можливість пасивного перекладу. У примітці пасив слід сформулювати по-українському як «дівчинку було піднято», а не ізольованим «була піднята», яке може означати фізичне підняття.
