  text: ὅτε δὲ ἐξεβλήθη ὁ ὄχλος, εἰσελθὼν ἐκράτησεν τῆς χειρὸς αὐτῆς, καὶ ἠγέρθη τὸ κοράσιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/025.yaml
  text: But when the crowd had been put outside[a], he went in and took her by the hand, and the girl rose.
translation:
  language: uk
  text: Коли ж натовп випровадили, він увійшов, узяв її за руку — і дівчинка встала.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «дівчинку було піднято». Грецьке дієслово допускає обидва способи передачі.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Коли ж
  rationale: ὅτε вводить часову підрядну частину, а δέ передано природною українською часткою «ж», яка позначає перехід у розповіді без надмірного протиставлення.
- source_word: ἐξεβλήθη ὁ ὄχλος
  choice: натовп випровадили
  rationale: Аорист пасивного стану ἐκβάλλω тут означає усунення людей із приміщення. Неозначено-особова конструкція природно передає пасивний зміст, а «випровадили» не створює недоречної асоціації з вигнанням демона.
- source_word: εἰσελθὼν
  choice: він увійшов
  rationale: Аористовий дієприкметник позначає дію, що передує головній; особова форма звучить природно в сучасній українській розповіді.
- source_word: ἐκράτησεν τῆς χειρὸς αὐτῆς
  choice: узяв її за руку
  rationale: κρατέω з родовим відмінком означає взятися або вхопитися за щось; обрано звичний український відповідник без зайвого наголосу на силі руху.
- source_word: ἠγέρθη
  choice: підвелася
  rationale: Форма є аористом пасивного стану від ἐγείρω, але в контексті може природно описувати результат як «підвелася». Варіант «була піднята» зберігається у примітці, щоб не усунути граматичну й богословську неоднозначність.
- source_word: τὸ κοράσιον
  choice: дівчина
  rationale: κοράσιον означає дівчинку або молоду дівчину; «дівчина» є ясним і природним відповідником у цьому контексті.
theological_decisions:
- issue: Передача ἠγέρθη в контексті повернення дівчини до життя
  choice: підвелася
  alternative: була піднята
  rationale: «Підвелася» природно передає видимий результат дії, не заперечуючи чудесного відновлення життя. Примітка з пасивним варіантом зберігає можливий наголос на зовнішньому діячеві й не вирішує богословську напругу замість читача.
translation_notes:
  register: Сучасна літературна українська мова з гідним, але доступним оповідним стилем. Займенник «він» не капіталізовано, оскільки такої графічної ознаки немає в грецькому тексті. Тире перед завершальною дією увиразнює наслідок, не додаючи нового змісту.
