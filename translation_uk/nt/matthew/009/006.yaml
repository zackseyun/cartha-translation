  text: ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας— τότε λέγει τῷ παραλυτικῷ· ⸀Ἐγερθεὶς ἆρόν σου τὴν κλίνην καὶ ὕπαγε εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/006.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins”—then he says to the paralytic[a], “Get up, pick up your bed[b], and go to your house.”
translation:
  language: uk
  text: 'А щоб ви знали, що Син Людський має владу на землі прощати гріхи — тоді Він каже паралізованому[a]: «Встань, візьми своє ліжко й неси його, і йди до свого дому».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «розслабленому» — традиційний відповідник. Грецьке слово позначає людину, уражену паралічем.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ εἰδῆτε
  choice: А щоб ви знали
  rationale: Передає мету, виражену ἵνα, і м’який перехід або протиставлення, позначене δέ, природною сучасною українською.
- source_word: ἐξουσίαν ἔχει
  choice: має владу
  rationale: ἐξουσία тут означає законну владу або право, а не лише спроможність.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Син Людський
  rationale: Усталений український відповідник самоназви Ісуса, який зберігає титульне значення та ймовірний відгомін Даниїла 7.
- source_word: ἐπὶ τῆς γῆς
  choice: на землі
  rationale: Прямо й природно передає сферу, у якій Син Людський має владу прощати гріхи.
- source_word: ἀφιέναι ἁμαρτίας
  choice: прощати гріхи
  rationale: У цьому контексті ἀφίημι означає прощати або відпускати гріхи; обрано найясніший сучасний відповідник.
- source_word: τότε λέγει
  choice: тоді Він каже
  rationale: Теперішній час зберігає оповідну жвавість грецького історичного теперішнього λέγει.
- source_word: τῷ παραλυτικῷ
  choice: паралізованому
  rationale: Субстантивований прикметник природно передано українським субстантивованим прикметником без доданого слова «чоловік».
- source_word: Ἐγερθεὶς
  choice: Встань
  rationale: Аористовий дієприкметник у послідовності наказів має наказову силу; «Встань» стисло й природно її передає.
- source_word: ἆρόν
  choice: візьми
  rationale: αἴρω тут означає підняти й забрати із собою; «візьми» природно охоплює цей зміст у контексті.
- source_word: κλίνην
  choice: ліжко
  rationale: κλίνη може означати ліжко, лежанку або підстилку; «ліжко» є широким і природним відповідником, а альтернативу подано в примітці.
- source_word: ὕπαγε
  choice: йди
  rationale: Простий наказ рухатися звідси природно передається дієсловом «йди».
- source_word: εἰς τὸν οἶκόν σου
  choice: до свого дому
  rationale: οἶκος тут може означати будинок або домівку; «до свого дому» природне й зберігає особовий зв’язок, виражений σου.
theological_decisions:
- issue: Христологічний титул ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Син Людський
  alternative: Людський Син / Людина
  rationale: Традиційна титульна форма зберігає самоназву Ісуса, міжтекстовий зв’язок із Даниїла 7 та властиву вислову богословську напругу, не зводячи його до пояснювального парафразу.
- issue: Характер ἐξουσία щодо прощення гріхів
  choice: влада
  alternative: сила / право
  rationale: У контексті йдеться про належну Ісусові владу прощати гріхи, а не тільки про чудотворну спроможність; «влада» не уточнює понад сказане, звідки або в який спосіб вона походить.
translation_notes:
  register: Сучасна нормативна українська з гідним біблійним звучанням. Титул «Син Людський» збережено в усталеній формі; історичний теперішній передано як «каже». Займенник «Він» написано з великої літери відповідно до поширеної української біблійної практики, без додавання богословського змісту.
