  yaml_path: translation/nt/matthew/009/030.yaml
  text: And their eyes were opened[a]. And Jesus sternly warned them, saying[b], “See that no one knows.”
translation:
  language: uk
  text: 'І їхні очі відкрилися. Ісус суворо застеріг їх[a], кажучи: «Глядіть, щоб ніхто не дізнався»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «суворо наказав їм» чи «грізно напоумив їх». Грецьке дієслово передає сильне почуття і владну наполегливість застереження.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Глядіть, нехай ніхто не знає». Про що саме не повинен ніхто знати, зрозуміло з контексту зцілення, але в грецькому тексті це прямо не названо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνεῴχθησαν
  choice: відкрилися
  rationale: Аорист пасивного стану від ἀνοίγω. Українська зворотна форма природно передає грецький пасив і усталений біблійний образ відновлення зору, не називаючи прямо того, хто вчинив дію.
- source_word: οἱ ὀφθαλμοί
  choice: їхні очі
  rationale: Природна українська передача грецької конструкції з присвійним займенником αὐτῶν.
- source_word: ἐνεβριμήθη
  choice: суворо застеріг
  rationale: Дієслово виражає сильне почуття та владну, наполегливу пересторогу. У цьому контексті воно вводить заборону, тому «суворо застеріг» передає і силу, і характер вислову, не приписуючи Ісусові конкретної емоції понад текст.
- source_word: λέγων
  choice: кажучи
  rationale: Дієприкметник позначає одночасну дію й безпосередньо вводить зміст застереження; формальний відповідник природний у цьому урочистому наративному регістрі.
- source_word: Ὁρᾶτε
  choice: Глядіть
  rationale: Імператив тут є формулою пильного застереження. «Глядіть» стисло й природно зберігає наказову силу.
- source_word: μηδεὶς γινωσκέτω
  choice: щоб ніхто не дізнався
  rationale: Заперечний імператив третьої особи забороняє поширювати звістку. «Не дізнався» природно передає це українською, залишаючи неназваним об’єкт знання, як і в грецькому тексті.
theological_decisions:
- issue: Сила наказу Ісуса після зцілення
  choice: Ісус висловлює сувору заборону розголошувати подію, але її мотив не пояснюється.
  alternative: Передати дієслово як «докорив їм» або розтлумачити причину вимоги мовчати.
  rationale: Грецький текст підкреслює силу застереження, однак не пояснює, чому Ісус наказав мовчати. Переклад зберігає цю богословську напругу без доданого пояснення.
translation_notes:
  register: Сучасна літературна українська з гідним, помірно біблійним звучанням. Форму «Глядіть» обрано як зрозумілу наказову пересторогу; синтаксис лишається близьким до грецького, але не звучить неприродно.
