reference: Matthew 9:10
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο αὐτοῦ ἀνακειμένου ἐν τῇ οἰκίᾳ, ⸀καὶ ἰδοὺ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ ἐλθόντες συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/010.yaml
  text: And as he was reclining at table in the house[a], behold[b], many tax collectors and sinners came and were reclining at table with Jesus and his disciples.
translation:
  language: uk
  text: І коли Ісус лежав за столом у домі,[a] аж ось багато збирачів податків і грішників прийшли та лежали за столом разом з Ісусом і Його учнями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або природніше: «коли Ісус їв у домі». Грецький текст точніше описує звичну на той час позу під час трапези — лежання за столом. У цьому вірші не сказано прямо, чий це був дім.'
    reason: lexical_alternative_and_ambiguity
lexical_decisions:
- source_word: ἐγένετο αὐτοῦ ἀνακειμένου
  choice: І коли Ісус лежав за столом
  rationale: Конструкцію καὶ ἐγένετο з родовим абсолютним зворотом природно передано як перехід до супровідної події. Ім’я «Ісус» ужито замість займенника для ясності українського речення; ἀνάκειμαι у контексті трапези означає лежати за столом.
- source_word: ἐν τῇ οἰκίᾳ
  choice: у домі
  rationale: Збережено означене, але не уточнене позначення місця; переклад не визначає власника дому.
- source_word: ἰδοὺ
  choice: аж ось
  rationale: Природний український оповідний маркер, який зберігає привернення уваги й жвавість грецького ἰδού.
- source_word: τελῶναι
  choice: збирачів податків
  rationale: Зрозумілий сучасному читачеві відповідник назви осіб, які збирали податки й мита; він не вносить анахронічного значення сучасної державної посади.
- source_word: ἁμαρτωλοὶ
  choice: грішників
  rationale: Субстантивований прикметник передано усталеним і точним українським іменником.
- source_word: ἐλθόντες
  choice: прийшли
  rationale: Аористовий дієприкметник природно розгорнуто в особову форму, що передає послідовність дій.
- source_word: συνανέκειντο
  choice: лежали за столом разом з
  rationale: Передано і звичну для того часу позу під час трапези, і значення спільної участі в ній.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: Його учнями
  rationale: «Учні» — усталений точний відповідник μαθηταί у євангельському контексті; займенник позначає належність учнів Ісусові.
theological_decisions:
- issue: Поза під час трапези та образ спільності за столом
  choice: Збережено формулювання «лежав/лежали за столом».
  alternative: «Їв/їли», «обідав/обідали»
  rationale: Такий переклад відбиває конкретне значення дієслів ἀνάκειμαι і συνανάκειμαι та залишає видимим мотив спільної трапези, не додаючи богословських висновків.
- issue: Чий це був дім
  choice: У тексті сказано лише «у домі».
  alternative: «у його домі», «у домі Матвія»
  rationale: У цьому вірші грецький текст не називає власника дому, тому переклад не розв’язує контекстуальну неоднозначність.
translation_notes:
  register: Сучасна нормативна українська мова з гідним оповідним звучанням. Вислів «лежати за столом» навмисно збережено як історично конкретний, а його значення пояснено у примітці. «Аж ось» природно відтворює виразний оповідний сигнал ἰδού.
