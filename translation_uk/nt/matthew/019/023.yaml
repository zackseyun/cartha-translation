base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/023.yaml
  text: Then Jesus said to his disciples[a], “Truly I say to you[b], a rich man will enter the kingdom of heaven with difficulty.”
translation:
  language: uk
  text: 'Тоді Ісус сказав Своїм учням: «Воістину[a] кажу вам: багатий нелегко[b] ввійде в Царство Небесне».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Амінь».'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «із труднощами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Тоді
  rationale: Передає перехід і поступ оповіді природною сучасною українською мовою.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: Своїм учням
  rationale: Зберігає виражену в грецькому тексті належність учнів Ісусові; зворотний займенник природний при підметі «Ісус».
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Воістину кажу вам
  rationale: Передає урочисту засвідчувальну формулу Ісуса зрозумілою і гідною українською мовою.
- source_word: πλούσιος
  choice: багатий
  rationale: Субстантивований прикметник чоловічого роду в однині; українське «багатий» прямо передає форму й значення.
- source_word: δυσκόλως
  choice: нелегко
  rationale: Природно передає прислівникове значення «із труднощами», не посилюючи його до прямої неможливості.
- source_word: εἰσελεύσεται
  choice: ввійде
  rationale: Точно й природно передає майбутній час дієслова εἰσέρχομαι.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: Царство Небесне
  rationale: Усталений український відповідник характерного для Матвія вислову; прикметникова форма природно передає грецький родовий зворот.
theological_decisions:
- issue: Рід субстантивованого прикметника πλούσιος
  choice: багатий
  alternative: багата людина
  rationale: Грецька форма є чоловічого роду в однині й змальовує типового окремого чоловіка; переклад не нейтралізує цю граматичну форму.
- issue: Передача Ἀμὴν у формулі Ісуса
  choice: Воістину
  alternative: Амінь
  rationale: «Воістину» зрозуміло передає стверджувальну й урочисту силу формули, тоді як «Амінь» можна зберегти як ближчу формальну альтернативу.
- issue: Ступінь труднощів у δυσκόλως
  choice: нелегко
  alternative: із труднощами; навряд чи
  rationale: «Нелегко» зберігає справжню напругу вислову, але не перетворює цей вірш сам по собі на категоричне твердження про неможливість; подальший контекст розвиває цю тему.
translation_notes:
  register: Сучасна нормативна українська мова з урочистим, але доступним біблійним регістром. Ужито «Воістину» для ваги формули та «нелегко» для природної передачі δυσκόλως без надмірного тлумачення.
