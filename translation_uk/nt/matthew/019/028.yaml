reference: Matthew 19:28
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι ὑμεῖς οἱ ἀκολουθήσαντές μοι ἐν τῇ παλιγγενεσίᾳ, ὅταν καθίσῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ θρόνου δόξης αὐτοῦ, ⸀καθήσεσθε καὶ ⸀ὑμεῖς ἐπὶ δώδεκα θρόνους κρίνοντες τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/028.yaml
  text: And Jesus said to them[a], “Truly I say to you, you who have followed me will also sit on twelve thrones in the renewal, when the Son of Man sits on the throne of his glory[b], judging the twelve tribes of Israel.”
translation:
  language: uk
  text: 'Ісус же сказав їм: «Істинно кажу вам: у відновленні[a], коли Син Людський сяде на престолі слави Своєї, ви, що пішли за Мною, також сядете на дванадцяти престолах і судитимете[b] дванадцять племен Ізраїлю».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «у відродженні», «в оновленні» чи «в новому світі». Тут це слово найімовірніше означає майбутнє відновлення, пов’язане з царюванням Сина Людського, а не особисте духовне відродження.'
    reason: lexical_alternative
  - marker: b
    text: «Судитимете» може також мати відтінок значення «правитимете» або «здійснюватимете владу».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: Істинно
  rationale: Передає урочисту й авторитетну формулу, якою Ісус вводить вислів; це природний і усталений відповідник у сучасній українській біблійній мові.
- source_word: ἀκολουθήσαντές μοι
  choice: ви, що пішли за Мною
  rationale: Аористовий дієприкметник означує адресатів через їхній вчинок — вони пішли за Ісусом; особовий додаток збережено прямо.
- source_word: παλιγγενεσίᾳ
  choice: у відновленні
  rationale: Грецьке слово може означати відродження, оновлення чи відновлення. Контекст указує на майбутнє есхатологічне відновлення, але сам текст не містить додатка «усього», тому його не внесено до основного тексту.
- source_word: ὅταν καθίσῃ
  choice: коли ... сяде
  rationale: Конструкція ὅταν з аористом кон’юнктива позначає майбутню подію; український доконаний майбутній вид природно передає це значення.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Син Людський
  rationale: Усталений український відповідник титулу, що зберігає його біблійні й месіанські відлуння.
- source_word: ἐπὶ θρόνου δόξης αὐτοῦ
  choice: на престолі слави Своєї
  rationale: Формальне відтворення родового звороту зберігає піднесений стиль і не зводить його лише до прикметника «славному».
- source_word: καθήσεσθε καὶ ὑμεῖς
  choice: ви ... також сядете
  rationale: «Також» передає καί, а виразний займенник «ви» зберігає наголос грецького ὑμεῖς.
- source_word: ἐπὶ δώδεκα θρόνους
  choice: на дванадцятьох престолах
  rationale: Природна українська місцева конструкція; форма «дванадцятьох» узгоджується з назвою предметів, пов’язаних тут із особами, які на них сидять.
- source_word: κρίνοντες
  choice: судитимете
  rationale: Дієслівна форма природніше за дієприкметниковий зворот передає супровідну майбутню дію українською; основне лексичне значення «судити» збережене.
- source_word: φυλὰς τοῦ Ἰσραήλ
  choice: дванадцять племен Ізраїлю
  rationale: Точний та усталений відповідник назви племінного устрою Ізраїлю.
theological_decisions:
- issue: Значення παλιγγενεσία в цьому контексті
  choice: майбутнє есхатологічне відновлення, пов’язане з воцарінням Сина Людського
  alternative: особисте духовне відродження; новий вік; новий світ
  rationale: Найближчий контекст говорить про майбутній престол Сина Людського та суд над племенами Ізраїлю, а не про навернення окремої людини. Водночас переклад не уточнює певної конфесійної схеми останніх часів.
- issue: Обсяг значення κρίνοντες
  choice: судитимете
  alternative: правитимете; управлятимете
  rationale: Основне значення дієслова — «судити», хоча в біблійному контексті суд може включати здійснення влади. Основний текст зберігає пряме значення, а ширший відтінок зазначено у примітці.
translation_notes:
  register: Сучасна нормативна українська з гідним, помірно піднесеним біблійним регістром. Синтаксис наближено до грецького, але впорядковано природно для української. Займенники щодо Ісуса подано з великої літери як традиційну стилістичну ознаку, без зміни змісту.
