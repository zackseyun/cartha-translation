base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/022.yaml
  text: But when the young man heard this word[a], he went away grieving[c][b], for he had many possessions.
translation:
  language: uk
  text: Та коли юнак почув ці слова[a], то відійшов засмучений[b], бо мав багато майна[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «це слово» чи «цей вислів». Ідеться про попередні слова Ісуса.'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «сумуючи». Грецька форма описує смуток, який супроводжував його відхід.'
    reason: lexical_alternative
  - marker: c
    text: 'Або: «численні володіння». Грецький вислів наголошує на великій кількості майна або власності.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: коли … почув
  rationale: Аористовий дієприкметник природно передано часовим підрядним реченням, що зберігає послідовність подій.
- source_word: δὲ
  choice: Та
  rationale: Передає легке протиставлення й поворот розповіді після слів Ісуса.
- source_word: ὁ νεανίσκος
  choice: юнак
  rationale: Точно передає значення «молодий чоловік», не додаючи з паралельної розповіді означення «начальник».
- source_word: τὸν λόγον
  choice: ці слова
  rationale: У контексті йдеться про щойно сказане Ісусом; український множинний вислів природно позначає висловлювання як ціле.
- source_word: ἀπῆλθεν
  choice: відійшов
  rationale: Природне українське позначення того, що юнак залишив Ісуса після почутого.
- source_word: λυπούμενος
  choice: засмучений
  rationale: Передає супровідний емоційний стан під час відходу, не посилюючи його до відчаю чи жалоби.
- source_word: ἦν γὰρ ἔχων
  choice: бо мав
  rationale: Природно стисло передає тривалий стан володіння, виражений перифрастичною конструкцією.
- source_word: κτήματα πολλά
  choice: багато маєтків
  rationale: κτήματα означає власність або майно, нерідко земельні володіння; «багато» зберігає наголос πολλά на кількості.
theological_decisions:
- issue: Чи додавати ототожнення юнака з начальником із паралельної розповіді
  choice: Передати νεανίσκος лише як «юнак»
  alternative: молодий начальник
  rationale: Грецький текст Матвія в цьому вірші називає його тільки юнаком; додавання «начальник» було б гармонізацією з Лукою.
- issue: Характер його смутку
  choice: Передати λυπούμενος нейтрально як «засмучений»
  alternative: пішов, каючись; пішов у розпачі
  rationale: Текст описує емоційний стан, але не визначає його як покаяння чи відчай; богословську оцінку не слід додавати.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська оповідна мова. «Та» природно позначає контраст; «юнак» не архаїчне й не вносить відомостей із паралельних місць. Усі примітки мають відповідні маркери в основному тексті.
