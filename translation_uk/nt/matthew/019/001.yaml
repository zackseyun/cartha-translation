  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, μετῆρεν ἀπὸ τῆς Γαλιλαίας καὶ ἦλθεν εἰς τὰ ὅρια τῆς Ἰουδαίας πέραν τοῦ Ἰορδάνου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/001.yaml
  text: And it happened that when Jesus had finished these words[a], he departed from Galilee and came into the region of Judea beyond the Jordan.
translation:
  language: uk
  text: І сталося, коли Ісус закінчив ці слова, він залишив Галілею й прийшов до околиць Юдеї за Йорданом[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «по той бік Йордану».'
    reason: Лексична альтернатива для πέραν τοῦ Ἰορδάνου; виразніше передає значення протилежного берега.
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: І сталося
  rationale: Збережено характерний для Матвія оповідний перехід без архаїчного «і було»; двокрапка природно вводить наступну часову конструкцію.
- source_word: ὅτε ἐτέλεσεν
  choice: коли … закінчив
  rationale: Дококонаний вид «закінчив» передає завершеність попередньої промови перед подальшою дією.
- source_word: τοὺς λόγους τούτους
  choice: ці слова
  rationale: Вислів стосується щойно завершеної промови Ісуса; «слова» природніше в цьому контексті, ніж афористичне «вислови».
- source_word: μετῆρεν ἀπὸ τῆς Γαλιλαίας
  choice: залишив Галілею
  rationale: Передає відбуття з певного місця сучасною, гідною українською мовою; окреме «з/із» тут не потрібне через керування дієслова.
- source_word: ἦλθεν εἰς
  choice: прийшов у
  rationale: Збережено дієслово руху «прийшов» і напрямок усередину місцевості, виражений εἰς.
- source_word: τὰ ὅρια τῆς Ἰουδαίας
  choice: землі Юдеї
  rationale: У контексті подорожі ὅρια означає територію або область, а не лише точну лінію кордону; «землі» природно передає це географічне значення.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: за Йорданом
  rationale: Стисло й природно позначає місцевість на протилежному боці річки, не уточнюючи перспективу понад те, що сказано в грецькому тексті.
theological_decisions: []
translation_notes:
  register: Сучасна літературна українська з гідним оповідним тоном. Формулу «І сталося» збережено як помітний композиційний перехід у Матвія; займенник «він» подано з малої літери відповідно до сучасної загальної орфографічної норми. Маркер примітки поставлено біля географічного вислову, якого вона стосується.
