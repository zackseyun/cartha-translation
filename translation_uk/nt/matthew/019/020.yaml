base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/020.yaml
  text: The young man says to him[a], “All these I have kept[b]. What do I still lack?”
translation:
  language: uk
  text: 'Юнак каже йому: «Я всього цього дотримався.[a] Чого мені ще бракує?[b]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Я все це виконав».'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «Чого мені ще не вистачає?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: каже
  rationale: Збережено грецький історичний теперішній час, який природно звучить і в українській оповіді.
- source_word: αὐτῷ
  choice: йому
  rationale: Давальний займенник природно передає адресата мовлення після «каже».
- source_word: ὁ νεανίσκος
  choice: юнак
  rationale: νεανίσκος означає молодого чоловіка; «юнак» стисло передає це значення, не додаючи відомостей про становище чи владу.
- source_word: Πάντα ταῦτα
  choice: усе це
  rationale: Природний український відповідник середнього роду множини, що вказує на щойно згадані заповіді.
- source_word: ἐφύλαξα
  choice: я виконав
  rationale: У контексті заповідей φυλάσσω означає дотримуватися або виконувати їх. Доконаний вид природно передає аорист і заяву про попередню поведінку з актуальним наслідком.
- source_word: τί
  choice: чого
  rationale: З огляду на керування дієслова «бракує» грецьке τί природно передано родовим питального займенника.
- source_word: ἔτι
  choice: ще
  rationale: Передає значення того, що й досі залишається або чого додатково не вистачає.
- source_word: ὑστερῶ
  choice: мені бракує
  rationale: ὑστερέω може означати «мати нестачу» або «не досягати належного»; ця конструкція природна українською і не усуває смислової широти повністю.
theological_decisions:
- issue: Самооцінка послуху
  choice: Слова юнака передано як пряму заяву про виконання заповідей без схвалення чи іронічного забарвлення з боку перекладача.
  alternative: Подати заяву як щиру, але помилкову, або як риторичне перебільшення.
  rationale: Грецький текст викладає твердження юнака прямо й не визначає в цьому реченні його істинності; богословську напругу слід залишити контекстові.
- issue: Характер того, чого бракує
  choice: «Чого мені ще бракує?»
  alternative: «У чому я ще не досягаю належного?»
  rationale: 'Питання зберігає невизначеність: може йтися про відсутній учинок, якість або недостатність, не уточнену самим реченням.'
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Історичний теперішній збережено; репліка звучить природно, не додаючи оцінки щирості чи правильності заяви юнака.
