id: MAT.19.6
reference: Matthew 19:6
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ὥστε οὐκέτι εἰσὶν δύο ἀλλὰ σὰρξ μία. ὃ οὖν ὁ θεὸς συνέζευξεν ἄνθρωπος μὴ χωριζέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/006.yaml
  text: So they are no longer two[a], but one flesh. Therefore, what God has joined together, man must not separate.
translation:
  language: uk
  text: Тож вони вже не двоє, а одна плоть. Отже, що Бог з’єднав, людина хай не роз’єднує.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: Тож
  rationale: Передає наслідок попереднього твердження про те, що двоє стають однією плоттю, природною сучасною українською мовою.
- source_word: οὐκέτι εἰσὶν δύο
  choice: вони вже не двоє
  rationale: Зберігає часову зміну стану, виражену οὐκέτι, і пряме протиставлення числівника «двоє» подальшій єдності.
- source_word: σὰρξ μία
  choice: одна плоть
  rationale: Буквально й упізнавано відтворює шлюбну формулу з Буття та зберігає її міжтекстове й богословське значення; «тіло» було б природнішим у деяких контекстах, але тут послабило б усталений біблійний зв’язок.
- source_word: ὃ οὖν
  choice: Отже, що
  rationale: «Що» передає середній відносний займенник, який стосується створеної Богом єдності, а «отже» зберігає висновкову силу οὖν.
- source_word: συνέζευξεν
  choice: з’єднав
  rationale: Природно передає дію зведення або сполучення в одне; образ ярма, присутній в етимології дієслова, не нав’язується українському тексту там, де він звучав би неприродно.
- source_word: ἄνθρωπος
  choice: людина
  rationale: Точно передає загальнолюдське значення грецького однини без звуження за статтю.
- source_word: μὴ χωριζέτω
  choice: хай не роз’єднує
  rationale: Конструкція «хай не» природно передає заборонний наказ третьої особи, а «роз’єднує» виразно протиставлене Божому «з’єднав».
theological_decisions:
- issue: Загальне значення ἄνθρωπος у забороні щодо шлюбу
  choice: «людина» в родовому, загальнолюдському значенні
  alternative: «ніхто» або «чоловік»
  rationale: Грецьке ἄνθρωπος тут означає будь-яку людину. Українське «людина» зберігає однину й не створює хибного враження, ніби заборона стосується лише чоловіків.
- issue: Відлуння шлюбної мови Буття у σὰρξ μία
  choice: «одна плоть»
  alternative: «одне тіло»
  rationale: «Одна плоть» зберігає характерну біблійну формулу та зв’язок із Буттям, не додаючи конкретного конфесійного тлумачення природи шлюбного союзу.
translation_notes:
  register: Сучасна, ясна й гідна українська мова. Формулювання зберігає біблійну ідіому «одна плоть», а пара «з’єднав — не роз’єднує» робить логічний зв’язок виразним без надмірної архаїзації.
