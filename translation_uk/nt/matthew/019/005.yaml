  yaml_path: translation/nt/matthew/019/005.yaml
  text: and said[a], ‘For this reason a man will leave his father and mother and be joined to his wife, and the two will become one flesh.’
translation:
  language: uk
  text: 'і сказав: «Тому залишить чоловік свого батька й матір, поєднається зі своєю дружиною[a], і двоє стануть одним тілом?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «пристaне до своєї дружини» чи «тісно з’єднається зі своєю дружиною». Грецьке дієслово означає тісно приєднатися, бути міцно пов’язаним.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕνεκα τούτου
  choice: Тому
  rationale: Природно й стисло передає причинно-висновковий зв’язок у сучасній українській мові.
- source_word: καταλείψει
  choice: залишить
  rationale: Майбутній час збережено; дієслово природно передає відокремлення від батька й матері без архаїчного відтінку.
- source_word: ἄνθρωπος
  choice: чоловік
  rationale: У шлюбному контексті цитати й у парі зі «своєю дружиною» слово позначає саме чоловіка, а не людину загалом.
- source_word: κολληθήσεται
  choice: приєднається до
  rationale: Передає тісне й тривале єднання; українська зворотна форма природно відтворює значення грецького пасива без штучної конструкції.
- source_word: γυναικὶ αὐτοῦ
  choice: своєї дружини
  rationale: У цьому шлюбному контексті γυνή означає «дружина»; зворотний займенник «своєї» нормативний, бо власник збігається з підметом.
- source_word: οἱ δύο
  choice: двоє
  rationale: Зберігає виразну згадку про обох учасників союзу та природно звучить українською.
- source_word: εἰς σάρκα μίαν
  choice: одним тілом
  rationale: У сполученні зі «стануть» орудний відмінок природно передає результат єднання; «тіло» зберігає буквальну й богословськи вагому образність σάρξ.
theological_decisions:
- issue: Гендерно конкретна мова в цитаті про шлюб
  choice: чоловік … своєї дружини
  alternative: людина … свого подружжя
  rationale: Грецький текст у цьому контексті конкретно описує чоловіка та його дружину, тому гендерну конкретність збережено.
- issue: Передача образу шлюбної єдності
  choice: двоє стануть одним тілом
  alternative: двоє будуть одним тілом
  rationale: «Стануть» виражає результативний напрям конструкції ἔσονται … εἰς і водночас не пояснює понад те, що сказано в тексті.
translation_notes:
  register: Сучасна стандартна українська, гідний і загальнозрозумілий біблійний стиль. Збережено структуру цитати з Буття та образ «одного тіла»; уникнуто архаїзмів і конфесійно забарвлених уточнень.
