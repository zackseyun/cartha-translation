    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Ісус сказав йому
  rationale: Природний український відповідник звичайної формули введення прямої мови без уточнення способу мовлення.
- source_word: τέλειος
  choice: досконалим
  rationale: «Досконалий» є прямим і традиційним відповідником τέλειος та в цьому контексті може позначати цілісність або повноту відданості; ширший семантичний діапазон збережено в примітці.
- source_word: ὕπαγε
  choice: піди
  rationale: Точно передає наказ відійти й виконати наступну дію; у сучасній українській звучить природно.
- source_word: πώλησόν σου τὰ ὑπάρχοντα
  choice: продай своє майно
  rationale: τὰ ὑπάρχοντα означає те, що людина має, тобто її власність або майно; стислий природний відповідник.
- source_word: δὸς πτωχοῖς
  choice: роздай бідним
  rationale: У контексті продажу майна «роздай» природно виражає передачу отриманого нужденним, не додаючи конкретного способу розподілу.
- source_word: ἕξεις θησαυρὸν ἐν οὐρανοῖς
  choice: матимеш скарб на небі
  rationale: Прямо передає майбутній час і сталий біблійний образ; однина «на небі» природна для сучасної української, хоча грецьке οὐρανοῖς формально має множину.
- source_word: δεῦρο
  choice: тоді приходь
  rationale: «Приходь» передає заклик δεῦρο, а «тоді» природно показує послідовність після попередніх наказів.
- source_word: ἀκολούθει μοι
  choice: йди за Мною
  rationale: Природний український вислів учнівства, який точно передає тривале слідування за Ісусом.
theological_decisions:
- issue: Значення τέλειος у зв’язку з учнівством
  choice: досконалим
  alternative: цілісним; зрілим; довершеним
  rationale: Основний текст зберігає сильне й традиційне значення слова, не визначаючи його як безгрішність. Примітка вказує, що грецьке слово може наголошувати також на цілісності, довершеності або зрілості, зберігаючи лексичну й богословську напругу.
- issue: Образ «скарбу на небі»
  choice: збережено без пояснювального перефразування
  alternative: небесна нагорода
  rationale: Метафору оригіналу залишено відкритою; переклад не ототожнює скарб із певною доктринально визначеною нагородою.
translation_notes:
  register: Сучасна стандартна українська, природна й гідна усна пряма мова. Наказові форми збережено виразними; синтаксис полегшено тире й поділом на речення без втрати послідовності оригіналу.
