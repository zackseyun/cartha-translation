    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: багато
  rationale: Прикметник ужито субстантивовано; «багато» природно передає широку, не уточнену групу, не додаючи слова «людей».
- source_word: δὲ
  choice: Та
  rationale: Частка позначає м’яке протиставлення або перехід від попередньої розмови про нагороду й становище. «Та» зберігає цей відтінок без надмірного посилення.
- source_word: ἔσονται
  choice: будуть
  rationale: Форма майбутнього часу дієслова εἰμί прямо й природно передається сучасним українським «будуть».
- source_word: πρῶτοι
  choice: перші / першими
  rationale: У цьому контексті слово стосується місця, рангу або становища; «перші» зберігає широту й афористичність вислову.
- source_word: ἔσχατοι
  choice: останні / останніми
  rationale: «Останні» прямо протиставляється «першим» і не звужує значення до соціального статусу, спасіння чи нагороди.
- source_word: καὶ ἔσχατοι πρῶτοι
  choice: а останні — першими
  rationale: Сполучник у симетричному протиставленні природно передано як «а»; тире позначає пропущене, але зрозуміле дієслово й зберігає стислість прислів’я.
theological_decisions:
- issue: Характер вислову про зміну становища
  choice: Збережено загальне твердження про зміну місць або становища без уточнення її точної сфери.
  alternative: Тлумачити вислів винятково як твердження про вхід у Царство, нагороди учнів або суспільний статус.
  rationale: Сам вірш не визначає точного обсягу цієї зміни. Широке й афористичне формулювання не нав’язує вужчого богословського висновку.
translation_notes:
  register: Сучасна нормативна українська мова; лаконічний, урочисто-афористичний стиль. Паралелізм і протиставлення оригіналу збережено без доданого пояснення сфери зміни становища.
