    reason: alternative_reading
lexical_decisions:
- source_word: πάλιν δὲ λέγω ὑμῖν
  choice: І знову кажу вам
  rationale: πάλιν передає повторення («знову»), δέ — м’який зв’язок із попереднім висловом, природно відтворений сполучником «і»; «кажу вам» зберігає пряму форму звернення.
- source_word: εὐκοπώτερόν ἐστιν
  choice: легше
  rationale: Природний український відповідник порівняльної конструкції з інфінітивами.
- source_word: κάμηλον
  choice: верблюдові
  rationale: Грецький текст має κάμηλον — «верблюд»; давальний відмінок природно оформлює українську конструкцію «легше кому пройти».
- source_word: διὰ τρυπήματος ῥαφίδος
  choice: крізь вушко голки
  rationale: Йдеться про отвір швейної голки; «вушко голки» — точний і усталений український вислів, а «крізь» виразно передає рух через отвір.
- source_word: εἰσελθεῖν
  choice: пройти / ввійти
  rationale: 'Той самий грецький інфінітив у двох частинах порівняння природно передається відповідно до контексту: пройти крізь отвір і ввійти в царство.'
- source_word: ἢ πλούσιον
  choice: ніж багатому
  rationale: Чоловічий рід однини збережено без додавання іменника «чоловік»; форма «багатому» природна й точна в українській порівняльній конструкції.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: ввійти в Царство Боже
  rationale: «Ввійти в» передає εἰς разом із дієсловом руху; «Царство Боже» є природним українським відповідником центрального біблійного вислову.
theological_decisions:
- issue: Тлумачення образу верблюда й голчаного вушка
  choice: Збережено різку гіперболу про крайню неможливість без алегоризації образу.
  alternative: Розуміти «вушко голки» як назву нібито вузької єрусалимської брами або читати «канат» замість «верблюд».
  rationale: Грецький текст прямо говорить про верблюда та отвір голки. Контекст не дає підстав послаблювати навмисно разючий образ; його богословську напругу слід зберегти.
translation_notes:
  register: Сучасна стандартна українська; виклад ясний, гідний і придатний для публічного читання. Образ навмисно не пом’якшено. Маркери приміток розміщено біля відповідних місць у тексті.
