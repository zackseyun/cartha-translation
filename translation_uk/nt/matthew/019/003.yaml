  text: Καὶ προσῆλθον ⸀αὐτῷ Φαρισαῖοι πειράζοντες αὐτὸν καὶ ⸀λέγοντες· Εἰ ἔξεστιν ⸀ἀνθρώπῳ ἀπολῦσαι τὴν γυναῖκα αὐτοῦ κατὰ πᾶσαν αἰτίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/003.yaml
  text: And Pharisees came up to him[a], testing him and saying, “Is it lawful for a man to divorce his wife for any cause?”
translation:
  language: uk
  text: 'І підійшли до нього фарисеї та, випробовуючи його, сказали: «Чи дозволено чоловікові розлучитися зі своєю дружиною з будь-якої причини?[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «на будь-якій підставі» чи «з кожної причини». Грецький вислів передає широке правове питання про допустимі підстави для розлучення.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον
  choice: підійшли
  rationale: Дієслово передає наближення до когось; «підійшли» природно й точно зберігає цей напрямний відтінок.
- source_word: πειράζοντες
  choice: випробовуючи
  rationale: Слово може означати випробування, спокушання або перевірку. «Випробовуючи» зберігає широту значення, тоді як ворожий намір виявляється з контексту.
- source_word: λέγοντες
  choice: сказали
  rationale: Дієприкметникову конструкцію природно передано особовою формою перед прямою мовою без зміни змісту.
- source_word: ἔξεστιν
  choice: чи дозволено
  rationale: У правовому запитанні слово стосується того, що допускається законом; цей відповідник ясний у сучасній українській мові.
- source_word: ἀνθρώπῳ
  choice: чоловікові
  rationale: У безпосередньому контексті йдеться саме про чоловіка щодо його дружини, а не про людину взагалі.
- source_word: ἀπολῦσαι
  choice: розлучитися
  rationale: У шлюбному контексті ἀπολύω є усталеним позначенням розірвання шлюбу; українська зворотна форма природно описує дію чоловіка щодо дружини.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: зі своєю дружиною
  rationale: γυνή тут однозначно означає дружину, а зворотний присвійний займенник природно передає належність до підмета.
- source_word: κατὰ πᾶσαν αἰτίαν
  choice: з будь-якої причини
  rationale: Фраза формулює широке правове питання про допустимі причини розлучення й не звужує його до певної підстави.
theological_decisions:
- issue: Передача питання про допустимі підстави для розлучення без нав’язування пізнішої конфесійної позиції
  choice: Чи дозволено чоловікові розлучитися зі своєю дружиною з будь-якої причини?
  alternative: Чи законно чоловікові розлучитися зі своєю дружиною на будь-якій підставі?
  rationale: Обраний варіант зберігає правовий характер і широту запитання в тогочасній дискусії, не випереджаючи відповіді Ісуса та не визначаючи наперед богословського висновку.
translation_notes:
  register: Сучасна літературна українська мова, природний і гідний оповідний стиль. Займенники щодо Ісуса подано з малої літери за загальними нормами сучасної української орфографії; це стилістичне, а не богословське рішення.
