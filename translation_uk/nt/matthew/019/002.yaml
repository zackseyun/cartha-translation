  source_fidelity: 'Текст точно передає послідовність і зміст грецького оригіналу: численні натовпи пішли за Ісусом, а Він зцілив їх у тому місці. «Пішли за Ним» природно відтворює ἠκολούθησαν αὐτῷ без невиправданого посилення значення учнівства; «зцілив» відповідає ἐθεράπευσεν; «там» зберігає ἐκεῖ.'
  naturalness: Фраза звучить природно в сучасній стандартній українській і має відповідний простий оповідний біблійний регістр. Порядок слів «І за Ним пішли великі натовпи» є плавним та стилістично прийнятним.
  terminology: «Великі натовпи» є природним відповідником ὄχλοι πολλοί у цьому контексті й узгоджується з англійським аудитним рішенням «large crowds». Написання займенників щодо Ісуса з великої літери є усталеною українською біблійною графічною традицією та не змінює змісту.
