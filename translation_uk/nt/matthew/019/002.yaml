  text: І за Ним пішли великі натовпи, і Він зцілив їх там.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠκολούθησαν
  choice: пішли за
  rationale: Аорист активного стану від ἀκολουθέω тут описує буквальне слідування за Ісусом у розповіді. «Пішли за» природно передає рух і не додає понад контекст виразного значення учнівства.
- source_word: αὐτῷ
  choice: Ним
  rationale: Давальний займенник при ἀκολουθέω в українській природно передано орудним відмінком у конструкції «пішли за Ним».
- source_word: ὄχλοι πολλοί
  choice: великі натовпи
  rationale: Буквально словосполучення означає «численні/багато натовпів». «Великі натовпи» є природним українським відповідником і передає значну кількість людей.
- source_word: ἐθεράπευσεν
  choice: зцілив
  rationale: У євангельському контексті θεραπεύω означає відновлення здоров’я; «зцілив» є ясним, усталеним і не звужує значення до конкретного медичного лікування.
- source_word: αὐτοὺς
  choice: їх
  rationale: Знахідний займенник множини стосується натовпів і прямо передається українським «їх».
- source_word: ἐκεῖ
  choice: там
  rationale: Прислівник місця природно й точно передано словом «там».
- source_word: καὶ ... καὶ
  choice: І ... і
  rationale: Повтор сполучника зберігає простий сурядний, оповідний плин грецького тексту без уточнення часових чи причинних відношень.
