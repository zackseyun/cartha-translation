  text: ὁ δὲ εἶπεν αὐτοῖς· Οὐ πάντες χωροῦσι τὸν λόγον ⸀τοῦτον ἀλλ’ οἷς δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/011.yaml
  text: But he said to them[a], “Not everyone can accept this word[b], but only those to whom it has been given.”
translation:
  language: uk
  text: 'А Він сказав їм: «Не всі можуть прийняти це слово[a], а лише ті, кому це дано[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «цей вислів» чи «це вчення».'
    reason: lexical_alternative
  - marker: b
    text: Пасивна форма «дано», ймовірно, передбачає Бога як Того, Хто дає, але в грецькому тексті суб’єкта прямо не названо.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: сказав
  rationale: Звичайний і природний відповідник аориста λέγω у вступі до прямої мови.
- source_word: Οὐ πάντες
  choice: Не всі
  rationale: Природна українська передача заперечення загальності без уточнення, якого немає в грецькому тексті.
- source_word: χωροῦσι
  choice: можуть прийняти
  rationale: У сполученні з λόγος дієслово означає бути спроможним умістити, сприйняти або прийняти сказане; цей варіант ясно передає зміст і зберігає модальний відтінок.
- source_word: τὸν λόγον τοῦτον
  choice: ці слова
  rationale: Йдеться про щойно висловлене твердження. Українське «ці слова» природно відсилає до попередньої репліки, не звужуючи λόγος винятково до вчення.
- source_word: ἀλλ’ οἷς
  choice: а лише ті, кому
  rationale: «Лише» природно виражає обмежувальну силу протиставлення з відносним зворотом.
- source_word: δέδοται
  choice: це дано
  rationale: Безособово-пасивна конструкція зберігає перфектний результат і не називає того, хто дає, як і грецький текст.
theological_decisions:
- issue: Хто є неназваним діячем у пасивній формі δέδοται
  choice: 'Зберегти неназваного діяча: «кому це дано».'
  alternative: «кому Бог дав це»
  rationale: Контекст може вказувати на божественний пасив, однак грецький текст прямо не називає Бога; явне додавання суб’єкта усунуло б справжню неоднозначність.
translation_notes:
  register: Сучасна нормативна українська мова, зрозуміла широкому колу читачів; тон лаконічний і гідний. Займенник «Він» ужито як природне контекстне позначення Ісуса. Формулювання зберігає образну семантику χωρέω через значення спроможності прийняти, уникаючи неприродного буквалізму «вмістити слово».
