  text: Λέγουσιν αὐτῷ οἱ ⸀μαθηταί· Εἰ οὕτως ἐστὶν ἡ αἰτία τοῦ ἀνθρώπου μετὰ τῆς γυναικός, οὐ συμφέρει γαμῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/010.yaml
  text: His disciples said to him[a], “If that is the case of a man with his wife, it is not beneficial to marry.”
translation:
  language: uk
  text: 'Учні сказали Йому: «Якщо такою є справа чоловіка з дружиною, то не варто одружуватися».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Якщо таким є становище чоловіка з дружиною». Грецький вислів стислий; слово, перекладене як «справа», може також означати «випадок», «становище» або «ситуація».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγουσιν αὐτῷ
  choice: Учні сказали Йому
  rationale: Теперішній час у грецькій є історичним теперішнім; український минулий час природно передає розповідь.
- source_word: μαθηταί
  choice: учні
  rationale: Усталений і природний євангельський відповідник, що зберігає значення учнівства.
- source_word: Εἰ οὕτως ἐστὶν ἡ αἰτία
  choice: Якщо такі стосунки
  rationale: Стисла грецька конструкція описує стан справ або ситуацію; у шлюбному контексті «такі стосунки» звучить природно, не зводячи αἰτία до буквальної «причини».
- source_word: τοῦ ἀνθρώπου μετὰ τῆς γυναικός
  choice: чоловіка з дружиною
  rationale: Контекст виразно шлюбний; ἀνήρ/ἄνθρωπος тут стосується чоловіка, а γυνή — дружини. Присвійний займенник у грецькому тексті не виражений.
- source_word: οὐ συμφέρει
  choice: не варто
  rationale: 'Безособова українська конструкція природно передає прагматичний зміст: це невигідно, недоцільно або не на користь.'
- source_word: γαμῆσαι
  choice: одружуватися
  rationale: Природний український відповідник у вислові, сформульованому з погляду чоловіка.
theological_decisions:
- issue: Гендерно визначене формулювання τοῦ ἀνθρώπου ... τῆς γυναικός
  choice: чоловіка з дружиною
  alternative: людини з подружнім партнером
  rationale: Безпосередній контекст і форма вислову представляють шлюб із погляду чоловіка щодо дружини; гендерно нейтральне формулювання послабило б цю особливість джерела.
- issue: Характер висновку οὐ συμφέρει γαμῆσαι
  choice: не варто одружуватися
  alternative: одружуватися невигідно / недоцільно
  rationale: Фраза передає оцінку учнів, а не загальну богословську заборону шлюбу. «Не варто» зберігає практичний, оцінний характер репліки.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Репліка звучить природно, водночас примітка зберігає неоднозначність компактного вислову ἡ αἰτία ... μετὰ τῆς γυναικός.
