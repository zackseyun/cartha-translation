  text: ὁ δὲ ἀποκριθεὶς ⸀εἶπεν· Οὐκ ἀνέγνωτε ὅτι ὁ ⸀κτίσας ἀπ’ ἀρχῆς ἄρσεν καὶ θῆλυ ἐποίησεν αὐτοὺς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/004.yaml
  text: He answered, “Have you not read that from the beginning the one who created them made them male and female?”
translation:
  language: uk
  text: 'Він відповів: «Хіба ви не читали, що Той, Хто від початку створив, зробив їх чоловічої та жіночої статі?[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чоловіче й жіноче».'
    reason: Пояснює компактну грецьку пару ἄρσεν καὶ θῆλυ, яку основний текст природно передає як «чоловічої та жіночої статі».
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Він відповів
  rationale: Дієприкметник із особовою формою дієслова природно передається українським «відповів» без зайвого дублювання «відповів і сказав».
- source_word: Οὐκ ἀνέγνωτε
  choice: Хіба ви не читали
  rationale: Заперечне риторичне запитання докоряє співрозмовникам за незнання Писання; «хіба» природно передає цю силу українською.
- source_word: ὁ κτίσας
  choice: Той, Хто створив
  rationale: Зберігає форму субстантивованого дієприкметника, не перетворюючи її на титул «Творець».
- source_word: ἀπ’ ἀρχῆς
  choice: від початку
  rationale: Близько відтворює грецький вислів і відсилання до розповіді про створення.
- source_word: ἄρσεν καὶ θῆλυ
  choice: чоловічої та жіночої статі
  rationale: Передає статеву пару в мові Буття природною сучасною українською, не замінюючи її соціально-віковими словами «чоловік і жінка».
- source_word: ἐποίησεν αὐτούς
  choice: створив їх
  rationale: Українське «зробив їх чоловічої та жіночої статі» звучить неприродно; повтор «створив» ясно передає дію, хоча не відтворює різниці між κτίζω та ποιέω.
theological_decisions:
- issue: Формулювання посилання на Буття 1:27
  choice: створив їх чоловічої та жіночої статі
  alternative: створив їх чоловіком і жінкою
  rationale: Обране формулювання зберігає саме статеву пару ἄρσεν καὶ θῆλυ та не додає висновків, яких цей вірш прямо не формулює.
- issue: До чого належить вислів ἀπ’ ἀρχῆς
  choice: Той, Хто створив їх від початку
  alternative: від початку Той, Хто створив їх
  rationale: Порядок слів пов’язує «від початку» з дією творення, як у грецькому тексті, водночас не усуваючи можливої ширшої часової сили вислову.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська. Великі літери в «Той, Хто» вказують на Бога в контексті, але не вводять окремого титулу. Риторичне «Хіба ви не читали» природно передає докір.
