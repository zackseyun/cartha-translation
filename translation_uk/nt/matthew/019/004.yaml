revisions:
- from: 'Він відповів: «Хіба ви не читали, що Той, Хто створив їх від початку, створив їх чоловічої та жіночої статі?[a]»'
  to: 'Він відповів: «Хіба ви не читали, що Той, Хто від початку створив, зробив їх чоловічої та жіночої статі?[a]»'
  rationale: Правка точніше пов’язує «від початку» з дією δημιουργення/створення та зберігає різницю між κτίσας («створив») і ἐποίησεν («зробив»). Вона не додає богословських висновків і не усуває властивої вислову стислості.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:09:16Z'
review_pass:
  verdict: revise
  source_fidelity: Потрібна невелика правка. У чернетці «створив їх від початку» передає зміст прийнятно, але розташування «від початку» після «їх» дещо послаблює його зв’язок із κτίσας. Крім того, повтор «створив» не відбиває різниці між κτίσας і ἐποίησεν. Виправлений текст ставить часовий вислів поряд із першим дієсловом і передає друге як «зробив».
  naturalness: «Чоловічої та жіночої статі» є зрозумілим сучасним відповідником для ἄρσεν καὶ θῆλυ щодо людей. Конструкція «Той, Хто від початку створив, зробив їх…» трохи урочиста, але природна для біблійного регістру та відтворює синтаксичний рух грецького вислову.
  terminology: Збережено нетитульний опис Бога («Той, Хто…») і статеву пару «чоловічої та жіночої статі», не підміняючи її «чоловіком і жінкою». Примітку змінено, оскільки «самцем і самицею» не є доречним буквальним відповідником щодо людей у цьому контексті; нейтральніше пояснення передає форму грецьких слів.
  issues:
  - severity: low
    issue: Повтор «створив» для κτίσας і ἐποίησεν.
    rationale: Хоча повтор не спотворює змісту, оригінал уживає два різні дієслова; «створив … зробив» зберігає це розрізнення без неприродного формулювання.
  - severity: low
    issue: Формулювання наявної примітки «самцем і самицею».
    rationale: Для людей це невдалий стилістично й семантично варіант, а позначення його як буквальнішого є неточним. Краще подати нейтральний буквальний глосарій.
