source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἄφετε τὰ παιδία καὶ μὴ κωλύετε αὐτὰ ἐλθεῖν πρός με, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/014.yaml
  text: But Jesus said[a], “Let the children come, and do not hinder them from coming to me[b], for the kingdom of heaven belongs to such as these.”
translation:
  language: uk
  text: 'Але Ісус сказав: «Дозвольте дітям приходити до мене й не перешкоджайте їм, бо таким, як вони,[a] належить Царство Небесне».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Такі, як вони» може стосуватися не лише присутніх дітей, а й людей такого роду; у чому саме полягає ця подібність, текст не уточнює.
    reason: alternative_reading
  - marker: b
    text: 'Буквальніше: «бо таких є Царство Небесне».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄφετε
  choice: Дозвольте
  rationale: У цьому контексті форма ἀφίημι виражає дозвіл, а не залишення чи відпускання. «Дозвольте» природно поєднується з інфінітивом «приходити».
- source_word: τὰ παιδία
  choice: дітям
  rationale: παιδία означає дітей, нерідко малих, але в самому вірші немає потреби звужувати значення додаванням «малим».
- source_word: μὴ κωλύετε
  choice: не перешкоджайте
  rationale: Передає загальне значення κωλύω — чинити перешкоду, заважати або не допускати — без уточнення, чи ця дія вже триває.
- source_word: αὐτὰ ἐλθεῖν πρός με
  choice: їм … приходити до мене
  rationale: Українська конструкція «перешкоджати комусь робити щось» природно й точно передає κωλύω з інфінітивом та напрямок πρός με.
- source_word: τῶν … τοιούτων
  choice: таким, як вони
  rationale: Вислів вказує не лише на присутніх дітей, а й на людей такого роду, водночас не називаючи прямо, яка саме риса мається на увазі.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Небесне Царство
  rationale: Природний сучасний український відповідник характерного для Матвія вислову; передає його як назву Божого царювання, не вдаючись до неприродного буквального «Царство небес».
- source_word: ἐστὶν
  choice: належить
  rationale: У поєднанні з родовим τῶν τοιούτων дієслово-зв’язка утворює зміст приналежності. «Належить» ясно передає цей зміст сучасною українською.
theological_decisions:
- issue: Чи йдеться винятково про буквальних дітей, чи також про людей такого самого типу
  choice: «таким, як вони»
  alternative: «цим дітям» або тлумачне «тим, хто подібний до дітей»
  rationale: τοιοῦτος має представницьку силу й виходить за межі лише конкретних дітей, але текст не пояснює, у чому полягає подібність. Обране формулювання зберігає цю богословську відкритість.
- issue: Як передати конструкцію τῶν τοιούτων ἐστὶν ἡ βασιλεία
  choice: «таким, як вони, належить Небесне Царство»
  alternative: 'Буквальніше: «таких є Небесне Царство»'
  rationale: Українське «належить» передає приналежність, виражену родовим відмінком, не визначаючи докладніше характер участі в Царстві.
translation_notes:
  register: Сучасна нормативна українська, природна й гідна усна форма прямої мови. Займенник «мене» подано з малої літери відповідно до звичайної сучасної практики та без додавання графічної шанобливості, якої грецький текст не позначає.
