  text: Καὶ ἰδοὺ εἷς προσελθὼν ⸂αὐτῷ εἶπεν⸃· ⸀Διδάσκαλε, τί ἀγαθὸν ποιήσω ἵνα ⸀σχῶ ζωὴν αἰώνιον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/016.yaml
  text: And behold[a], one who had come up to him said, “Teacher, what good thing must I do so that I may have eternal life?”
translation:
  language: uk
  text: 'І ось, один підійшов до Нього й сказав: «Учителю, що доброго[a] мені зробити, щоб мати вічне життя?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «який добрий вчинок мені зробити…?» Грецьке τί ἀγαθὸν може означати «що добре» або, у поєднанні зі «зробити», — «який добрий вчинок».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: І ось
  rationale: Зберігає єднальне καί та функцію ἰδού як засобу привернення уваги; вислів природний у сучасній українській біблійній оповіді.
- source_word: εἷς
  choice: один
  rationale: Відтворює буквальне значення без передчасного уточнення, що це був чоловік або багатий юнак.
- source_word: προσελθὼν αὐτῷ εἶπεν
  choice: підійшов до Нього й сказав
  rationale: Природно передає дію аористового дієприкметника, яка передує мовленню, не обтяжуючи український текст неприродною підрядною конструкцією.
- source_word: Διδάσκαλε
  choice: Учителю
  rationale: Пряме й усталене звертання до вчителя або наставника.
- source_word: τί ἀγαθὸν ποιήσω
  choice: що доброго мені зробити
  rationale: Зберігає відкриту субстантивовану форму ἀγαθόν — «добре/щось добре», не звужуючи її без потреби до окремого «доброго вчинку»; інфінітивна українська конструкція природно передає дорадче запитання.
- source_word: ἵνα σχῶ
  choice: щоб мати
  rationale: Передає цільове значення ἵνα та прямий зміст ἔχω без більш інтерпретаційного «здобути».
- source_word: ζωὴν αἰώνιον
  choice: вічне життя
  rationale: Точний, природний і усталений український відповідник.
theological_decisions:
- issue: Чи уточнювати особу мовця
  choice: один
  alternative: чоловік; багатий юнак
  rationale: У цьому вірші стоїть лише εἷς. Подальші подробиці контексту й паралельних оповідей не слід вносити завчасно.
- issue: Характер зв’язку між доброю дією та вічним життям у запитанні
  choice: що доброго мені зробити, щоб мати вічне життя?
  alternative: який добрий вчинок мені зробити, аби заслужити вічне життя?
  rationale: Переклад зберігає спрямоване на дію запитання мовця, але не додає понять заслуги чи доктринального висновку, яких грецький текст прямо не висловлює.
translation_notes:
  register: Сучасна стандартна українська мова з гідним оповідним тоном. «І ось» зберігає виразність оригіналу, а «що доброго мені зробити» звучить природно й водночас не усуває лексичної неоднозначності.
