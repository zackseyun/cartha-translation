  source_fidelity: «Шануй» точно передає Τίμα як заповідний заклик віддавати належну шану, а не лише відчувати повагу. «Свого батька й матір» природно відтворює зміст артиклевих форм у цитаті заповіді. «Люби свого ближнього, як самого себе» вірно передає Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν без зайвого тлумачення. Передача майбутньої форми Ἀγαπήσεις наказовим способом у головному тексті адекватно відображає її заповідну функцію.
  naturalness: Текст звучить природно сучасною літературною українською та зберігає впізнаваний біблійний регістр. Сполучник «та» тут милозвучний і не послаблює зв’язку між двома приписами. Формула «як самого себе» є усталеною й зрозумілою.
  terminology: «Шануй», «батька й матір» і «ближнього» є точними, усталеними та ненадмірно архаїчними відповідниками. Примітка коректно фіксує формальнішу майбутньочасову альтернативу «любитимеш» і належно пояснює її граматичну підставу.
