base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/019.yaml
  text: Honor your father and mother[a], and love your neighbor as yourself.
translation:
  language: uk
  text: Шануй свого батька й матір та люби свого ближнього, як самого себе.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або, формальніше: «Шануй свого батька й матір, і любитимеш свого ближнього, як самого себе».'
    reason: 'Лексико-граматична альтернатива: Ἀγαπήσεις формально є майбутнім часом, ужитим із силою заповіді.'
lexical_decisions:
- source_word: Τίμα
  choice: Шануй
  rationale: Передає наказ віддавати батькам належну шану й природно відтворює усталене формулювання заповіді українською; «поважай» могло б звузити зміст до внутрішньої поваги.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: свого батька й матір
  rationale: Хоч у грецькому тексті стоять означені артиклі без присвійного займенника, у прямому звертанні та в контексті Декалогу українською природно вжити «свого». Неповторення займенника перед «матір» є звичним і не змінює змісту.
- source_word: Ἀγαπήσεις
  choice: люби
  rationale: Грецька форма майбутнього часу в цитаті з Тори має наказову силу. Український наказовий спосіб узгоджує обидві заповіді в переліку й ясно передає їхню силу.
- source_word: τὸν πλησίον σου
  choice: свого ближнього
  rationale: «Ближній» є точним і усталеним біблійним відповідником у цьому етичному контексті та означає людину, щодо якої належить виявляти любов, а не лише того, хто перебуває поруч фізично.
- source_word: ὡς σεαυτόν
  choice: як самого себе
  rationale: Стисло й природно передає порівняння, не додаючи відсутнього в грецькому тексті дієслова.
theological_decisions:
- issue: Передача форм наказу в цитаті із заповідей
  choice: 'Обидві частини передано наказовим способом: «Шануй… та люби…»'
  alternative: «Шануй свого батька й матір, і любитимеш свого ближнього, як самого себе»
  rationale: Оригінал поєднує імператив Τίμα з майбутнім індикативом Ἀγαπήσεις, що відбиває мову біблійної заповіді. У сучасній українській обидві форми як прямі накази природніше передають функцію вислову; формальнішу відповідність граматичній формі збережено в примітці.
translation_notes:
  register: Сучасна літературна українська з гідним, загальнозрозумілим біблійним звучанням. Сполучник «та» плавно поєднує дві заповіді; «шануй» і «ближній» зберігають усталену біблійну лексику без архаїзації.
