  terminology: «Заповіді» та «дотримуйся» точно й природно передають τὰς ἐντολάς і τήρησον. Написання займенника «Мене» з великої літери відповідає поширеній біблійній редакційній традиції. У головному тексті не слід писати «Добрий» з великої літери, оскільки грецький текст не називає Бога на ім’я і така графіка звужує його формулювання.
  issues:
