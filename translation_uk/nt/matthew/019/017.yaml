base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/017.yaml
  text: And he said to him[a], “Why do you ask me about what is good? One is good. But if you want to enter into life[b], keep the commandments.”
translation:
  language: uk
  text: 'А Він сказав йому[a]: «Чому ти питаєш Мене про те, що добре? Лише один є добрим[b]. А якщо хочеш увійти в життя, дотримуйся заповідей».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'У деяких рукописах і в паралельних розповідях: «Чому ти називаєш Мене добрим? Ніхто не добрий, крім одного — Бога». Натомість текст Матвія в SBLGNT має: «Чому ти питаєш Мене про те, що добре? Один є добрий».'
    reason: textual_variant
  - marker: b
    text: 'Буквально: «Один є Добрий».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί με ἐρωτᾷς περὶ τοῦ ἀγαθοῦ
  choice: Чому ти питаєш Мене про те, що добре?
  rationale: Середній рід τοῦ ἀγαθοῦ тут природно передає предмет запитання — «те, що добре», а не особу. Це зберігає саме текст Матвія й не гармонізує його з паралельними місцями в Марка та Луки.
- source_word: εἷς ἐστιν ὁ ἀγαθός
  choice: Один є Добрий
  rationale: 'Формулювання зберігає виразну структуру грецького речення: εἷς («один») та субстантивований прикметник ὁ ἀγαθός («Добрий»). Велика літера природно вказує на Бога, не додаючи Його імені до основного тексту.'
- source_word: εἰ δὲ θέλεις
  choice: Та якщо хочеш
  rationale: θέλεις природно означає «хочеш», а δέ передано легким протиставним сполучником «та».
- source_word: εἰς τὴν ζωὴν εἰσελθεῖν
  choice: увійти в життя
  rationale: Зворот передає есхатологічне життя, але слово «вічне» в цьому реченні відсутнє, тому його не додано.
- source_word: τήρησον τὰς ἐντολάς
  choice: дотримуйся заповідей
  rationale: Щодо заповідей τηρέω в сучасній українській найприродніше передається як «дотримуватися»; «заповіді» зберігає вагу ἐντολάς у цьому контексті.
theological_decisions:
- issue: Зв’язок вислову Ісуса з Божою добротою та христологією
  choice: Передати Матвієве формулювання як запитання про те, що добре, і відповідь «Один є Добрий», не вкладаючи в нього заперечення доброти Ісуса й не узгоджуючи штучно з паралельними розповідями.
  alternative: «Чому ти називаєш Мене добрим? Ніхто не добрий, крім одного Бога».
  rationale: Текст SBLGNT у Матвія відрізняється від форми в Марка та Луки. Переклад зберігає цю відмінність і не робить понадтекстового христологічного висновку в жоден бік.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Звертання передано на «ти» відповідно до однини в грецькому тексті; займенники щодо Ісуса написано з великої літери за усталеною українською біблійною традицією. Позначки обох приміток наявні в основному тексті.
