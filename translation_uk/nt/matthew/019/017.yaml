  source_fidelity: 'Основний зміст передано вірно: запитання стосується того, «що добре», а не того, чому чоловік назвав Ісуса добрим; також збережено «увійти в життя» без додавання слова «вічне». Проте «Один є Добрий» із великими літерами надто буквально калькує грецьку конструкцію і в українській необов’язково персоніфікує та догматично конкретизує вислів.'
