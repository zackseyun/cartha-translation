    rationale: Вислів неприродний для сучасної стандартної української, а велика літера в «Добрий» подає інтерпретаційне ототожнення, якого сам текст Матвія тут прямо не формулює. «Лише один є добрим» зберігає ексклюзивність εἷς та присудковий характер ὁ ἀγαθός без надмірної інтерпретації.
