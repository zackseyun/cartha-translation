id: MAT.19.12
reference: Matthew 19:12
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: εἰσὶν γὰρ εὐνοῦχοι οἵτινες ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνούχισαν ἑαυτοὺς διὰ τὴν βασιλείαν τῶν οὐρανῶν. ὁ δυνάμενος χωρεῖν χωρείτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/012.yaml
  text: For there are eunuchs who were born that way from their mother’s womb[a], and there are eunuchs who were made eunuchs by men, and there are eunuchs who made themselves eunuchs for the sake of the kingdom of heaven[b]. The one able to accept this should accept it.
translation:
  language: uk
  text: Бо є євнухи, які такими народилися з материнського лона; є євнухи, яких люди зробили євнухами; і є євнухи, які самі зробили себе євнухами заради Царства Небесного.[a] Хто може це прийняти, нехай прийме.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «оскопили самих себе»; багато тлумачів розуміють це образно — як добровільний вибір безшлюбності заради Божого Царства.'
    reason: alternative_reading
  - marker: b
    text: 'Або: «Хто може це вмістити, нехай умістить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐνοῦχοι
  choice: євнухи
  rationale: Передає звичайне значення грецького іменника й зберігає його триразове повторення, не підмінюючи його тлумачним словом «безшлюбні».
- source_word: ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως
  choice: такими народилися з материнського лона
  rationale: Зберігає виразний грецький образ походження від материнського лона, водночас звучить зрозуміло сучасною українською.
- source_word: εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων
  choice: яких люди зробили євнухами
  rationale: Зберігає лексичний зв’язок із повторюваним іменником «євнухи» та пасивне значення грецької форми, не звужуючи вислів лише до анатомічної дії.
- source_word: εὐνούχισαν ἑαυτοὺς
  choice: самі зробили себе євнухами
  rationale: Прямо відтворює провокативне формулювання джерела, не вирішуючи в основному тексті, чи слід розуміти його буквально, гіперболічно або як образ добровільної безшлюбності.
- source_word: διὰ τὴν βασιλείαν τῶν οὐρανῶν
  choice: заради Царства Небесного
  rationale: «Заради» природно передає мотив або мету, виражені διά зі знахідним відмінком.
- source_word: ὁ δυνάμενος χωρεῖν χωρείτω
  choice: Хто може це прийняти, нехай прийме
  rationale: «Прийняти» природно передає тут ідіоматичне значення χωρέω — умістити, сприйняти або прийняти складну настанову — та зберігає спонукальну силу наказового способу.
theological_decisions:
- issue: Чи εὐνούχισαν ἑαυτοὺς слід розуміти буквально чи образно
  choice: В основному тексті збережено буквальну лексичну форму «самі зробили себе євнухами».
  alternative: «Оскопили самих себе» або «добровільно відмовилися від шлюбу».
  rationale: Сам вірш не пояснює однозначно, чи йдеться про буквальну дію, гіперболу або образ добровільної безшлюбності заради Божого царювання; переклад не повинен усувати цю напругу.
- issue: Значення фінального вислову ὁ δυνάμενος χωρεῖν χωρείτω
  choice: «Хто може це прийняти, нехай прийме».
  alternative: «Хто може це вмістити, нехай умістить».
  rationale: Основний варіант передає ідіоматичний сенс зрозумілою сучасною українською, а примітка зберігає формальнішу образність грецького дієслова.
translation_notes:
  register: Сучасна літературна українська з урочистим, але доступним біблійним регістром. «Євнухи» обрано замість архаїчнішого «скопці»; повторення ключового слова та богословська неоднозначність третьої категорії збережені.
