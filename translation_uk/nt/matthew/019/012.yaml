review_pass:
  verdict: approve
  source_fidelity: Переклад точно передає триразове εὐνοῦχοι («євнухи»), три відповідні категорії, пасивне «яких люди зробили євнухами», рефлексивне «самі зробили себе євнухами» та мотив «заради Царства Небесного». Фінальне «Хто може це прийняти, нехай прийме» адекватно передає ідіоматичне χωρεῖν без штучної буквальності.
  naturalness: Текст звучить природно сучасною літературною українською і водночас зберігає доступний біблійний регістр. Вислів «з материнського лона» дещо урочистий, але зрозумілий і доречний для відтворення грецького образу.
  terminology: «Євнухи» є точним, сучасним і послідовним відповідником εὐνοῦχοι. «Царство Небесне» коректно відтворює βασιλεία τῶν οὐρανῶν. Примітка а належно зберігає як буквальніший варіант «оскопили самих себе», так і поширене образне розуміння, не нав’язуючи його основному текстові.
