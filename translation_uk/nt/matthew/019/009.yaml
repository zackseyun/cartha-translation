source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ⸀ὅτι ὃς ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ μὴ ἐπὶ πορνείᾳ καὶ γαμήσῃ ἄλλην μοιχᾶται ⸂καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/009.yaml
  text: But I tell you that whoever divorces his wife[a], except for sexual immorality, and marries another, commits adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: uk
  text: 'А я кажу вам: хто розірве шлюб зі своєю дружиною не через статеву розпусту[a] й одружиться з іншою, той чинить перелюб; і хто одружиться з розлученою жінкою, той чинить перелюб[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «не на підставі статевої розпусти». Грецьке слово πορνεία також можна передати традиційним словом «блуд»; дехто розуміє його тут як «статеву невірність».'
    reason: lexical_alternative
  - marker: b
    text: 'У деяких рукописах немає слів: «і хто одружиться з розлученою жінкою, той чинить перелюб».'
    reason: textual_variant
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: А Я кажу вам
  rationale: «Кажу вам» прямо й природно передає λέγω ὑμῖν, а початкове «А» відтворює м’який протиставний або продовжувальний відтінок δέ у зв’язку з попередньою розмовою.
- source_word: ὃς ἂν
  choice: хто
  rationale: Сполука відносного займенника з ἄν виражає загальну невизначену умову; українське «хто» природно передає значення «кожен, хто».
- source_word: ἀπολύσῃ
  choice: розлучиться
  rationale: У шлюбному контексті ἀπολύω означає розірвати шлюб, а не просто «відпустити»; зворотна форма «розлучиться з дружиною» є нормативною сучасною українською.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: зі своєю дружиною
  rationale: γυνή тут однозначно означає дружину через контекст шлюбу й розлучення; «своєю» природно співвідносить її з підметом.
- source_word: μὴ ἐπὶ πορνείᾳ
  choice: не через статеву розпусту
  rationale: ἐπί з давальним у цьому звороті позначає підставу, а πορνεία охоплює ширшу сферу за перелюб. «Статева розпуста» зберігає широту терміна та є зрозумілим, гідним висловом.
- source_word: γαμήσῃ ἄλλην
  choice: й одружиться з іншою
  rationale: Форма ἄλλην жіночого роду означає іншу жінку; український еліптичний вислів «з іншою» природний і не потребує додавання слова «жінкою».
- source_word: μοιχᾶται
  choice: чинить перелюб
  rationale: Усталений і ясний український вислів точно передає дію, названу дієсловом μοιχάομαι, не перетворюючи її на характеристику особи.
- source_word: καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται
  choice: і хто одружиться з розлученою жінкою, той чинить перелюб
  rationale: Артикльована дієприкметникова конструкція має узагальнювальне значення. Доконаний пасивний дієприкметник ἀπολελυμένην позначає жінку, з якою розлучилися; «розлучена жінка» стисло й природно це передає.
theological_decisions:
- issue: Значення πορνεία у винятковому застереженні
  choice: Передати широким висловом «статева розпуста».
  alternative: «блуд», «статева невірність» або вужче тлумачення як «перелюб»
  rationale: πορνεία має ширше значеннєве поле, ніж μοιχεία («перелюб»). Широкий відповідник не звужує застереження відповідно до певного конфесійного тлумачення; можливі нюанси зазначено у примітці.
- issue: Наявність заключного речення καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται
  choice: Включити в основний текст із текстологічною приміткою.
  alternative: Не включати, оскільки в частині рукописів речення відсутнє.
  rationale: Наданий текст SBLGNT містить це речення, але позначає його як текстуально варіантне. Тому його перекладено в основному тексті, а рукописну розбіжність відкрито зафіксовано.
translation_notes:
  register: Сучасна стандартна українська мова, ясна й гідна за тоном. Синтаксис зберігає загальність настанови й виразне протиставлення, не нав’язуючи вузького тлумачення виняткового застереження. Усі маркери приміток подано в основному тексті.
