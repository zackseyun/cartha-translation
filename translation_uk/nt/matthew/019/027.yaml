  source_fidelity: «Петро озвався до нього» природно передає репліку, але послаблює виразну відповідну дію ἀποκριθεὶς … εἶπεν. У фінальному питанні «за це» є допустимим контекстуальним висновком, однак його немає в грецькому тексті; нейтральніше формулювання точніше зберігає відкритий зміст τί ἄρα ἔσται ἡμῖν.
  naturalness: Запропонована правка лишається сучасною, природною та гідною для прямої мови. «То що ж буде нам?» є зрозумілим українським запитанням і не вимагає стилізованого калькування.
  terminology: «Ось», «залишили все» та «пішли за тобою» вдало відтворюють ἰδού, ἀφήκαμεν πάντα та ἠκολουθήσαμέν σοι. Богословськи забарвлених або конфесійно звужувальних термінів не додано.
