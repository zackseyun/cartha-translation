  text: Τότε ἀποκριθεὶς ὁ Πέτρος εἶπεν αὐτῷ· Ἰδοὺ ἡμεῖς ἀφήκαμεν πάντα καὶ ἠκολουθήσαμέν σοι· τί ἄρα ἔσται ἡμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/027.yaml
  text: Then Peter answered him, “Look, we have left everything and followed you. What then will there be for us?”
translation:
  language: uk
  text: 'Тоді Петро відповів йому: «Ось ми залишили все й пішли за тобою. То що ж буде нам?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: озвався
  rationale: Природний український відповідник семітського за формою вислову «відповів і сказав» у контексті репліки Петра; передає реакцію на попередні слова Ісуса без важкого калькування.
- source_word: Ἰδοὺ
  choice: Ось
  rationale: Зберігає вказівно-наголошувальну силу грецького слова й природно звучить у сучасній українській.
- source_word: ἀφήκαμεν πάντα
  choice: ми залишили все
  rationale: Прямо передає факт відмови від усього чи полишення всього без додаткового уточнення змісту.
- source_word: ἠκολουθήσαμέν σοι
  choice: пішли за тобою
  rationale: Усталений і природний український вислів, що зберігає як буквальний образ слідування, так і значення учнівства.
- source_word: τί ἄρα ἔσται ἡμῖν
  choice: Що ж нам за це буде?
  rationale: Передає висновковий відтінок ἄρα та природно виражає запитання про те, що дістанеться учням; «за це» випливає з попереднього твердження, не конкретизуючи характер винагороди.
theological_decisions:
- issue: Чи уточнювати, що саме матимуть учні
  choice: 'Залишити предмет відповіді невизначеним: «Що ж нам за це буде?»'
  alternative: «Яка ж буде нам нагорода?» або «Що ж ми отримаємо?»
  rationale: Грецький текст не вживає слова «нагорода» й формулює питання буквально через «що буде нам»; обране формулювання зберігає цю відкритість і не нав'язує конкретної богословської категорії.
translation_notes:
  register: Сучасна стандартна українська, розмовно-природна, але гідна пряма мова. Займенники щодо Ісуса подано з малої літери за звичайною сучасною нормою; «й» ужито для милозвучності.
