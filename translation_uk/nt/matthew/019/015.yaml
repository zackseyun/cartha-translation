  text: καὶ ἐπιθεὶς ⸂τὰς χεῖρας αὐτοῖς⸃ ἐπορεύθη ἐκεῖθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/015.yaml
  text: And after laying his hands on them[a], he went on from there.
translation:
  language: uk
  text: І, поклавши на них руки, Він пішов звідти.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: І
  rationale: Простий сполучник зберігає послідовний зв’язок із попередньою розповіддю, не додаючи причинного чи часового відтінку.
- source_word: ἐπιθεὶς
  choice: поклавши
  rationale: Аористовий дієприкметник позначає дію, що передує головному дієслову; український дієприслівник природно й стисло передає цю послідовність.
- source_word: τὰς χεῖρας αὐτοῖς
  choice: на них руки
  rationale: Зворот ἐπιτίθημι τὰς χεῖρας з давальним означає покласти руки на когось. Українська конструкція без присвійного займенника природна, а належність рук суб’єктові зрозуміла з контексту.
- source_word: ἐπορεύθη
  choice: пішов
  rationale: У цьому оповідному контексті дієслово означає, що Ісус залишив місце й рушив далі; «пішов» є ясним сучасним відповідником без надмірно урочистого забарвлення.
- source_word: ἐκεῖθεν
  choice: звідти
  rationale: Прислівник місця буквально й природно передається як «звідти».
theological_decisions:
- issue: Характер покладання рук Ісусом
  choice: 'Збережено конкретну фізичну дію: «поклавши на них руки».'
  alternative: 'Передати наслідок тлумачно: «поблагословивши їх».'
  rationale: Грецький текст прямо називає покладання рук, тоді як благословення випливає з ширшого контексту. Основний текст не підміняє явну дію богословським поясненням.
translation_notes:
  register: Сучасна стандартна українська мова; стислий, гідний оповідний стиль. Займенник «Він» ужито для прозорості зміни речень у біблійному контексті, без додавання нового змісту.
