  text: λέγει αὐτῷ· Ποίας; ὁ δὲ Ἰησοῦς ⸀εἶπεν· Τὸ Οὐ φονεύσεις, Οὐ μοιχεύσεις, Οὐ κλέψεις, Οὐ ψευδομαρτυρήσεις,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/018.yaml
  text: 'He says to him, “Which ones?” And Jesus said, “The: You shall not murder, you shall not commit adultery, you shall not steal, you shall not bear false witness,”'
translation:
  language: uk
  text: 'Він каже Йому: «Які?» Ісус же сказав: «Ось які: Не вбивай, не чини перелюбу, не кради, не свідчи неправдиво»,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ποίας
  choice: Які?
  rationale: Природний український відповідник питального займенника у значенні «які саме заповіді?»; еліпсис оригіналу збережено.
- source_word: Τὸ
  choice: 'Ось які:'
  rationale: Грецький артикль субстантивує подальший перелік; дослівне «Те:» українською неприродне, тому вступ до переліку передано ідіоматично без додавання конкретного іменника.
- source_word: Οὐ φονεύσεις
  choice: Не вбивай
  rationale: φονεύω означає протиправно позбавляти людину життя; традиційна й зрозуміла українська форма заповіді.
- source_word: Οὐ μοιχεύσεις
  choice: не чини перелюбу
  rationale: Точно передає μοιχεύω як подружню невірність, зберігаючи біблійний регістр.
- source_word: Οὐ κλέψεις
  choice: не кради
  rationale: Прямий і природний відповідник заборони крадіжки.
- source_word: Οὐ ψευδομαρτυρήσεις
  choice: не свідчи неправдиво
  rationale: Передає складене дієслово ψευδομαρτυρέω як давання неправдивого свідчення, не звужуючи його лише до побутової брехні.
theological_decisions:
- issue: Обсяг заборони φονεύω
  choice: Не вбивай
  alternative: Не чини вбивства
  rationale: Українська традиційна формула є стислою та впізнаваною; лексичний контекст заповіді вказує на вбивство людини, а не на будь-яке позбавлення життя.
- issue: Незвична конструкція Τὸ перед переліком
  choice: 'Ось які:'
  alternative: 'А саме:'
  rationale: Збережено функцію грецького артикля як введення конкретного переліку, але уникнуто неприродного калькування «Те:».
translation_notes:
  register: Сучасна стандартна українська мова; урочистий, але доступний біблійний регістр. Теперішній час λέγει передано як «каже», тоді як аорист εἶπεν — як «сказав», зберігаючи часову зміну оповіді. Займенник «Йому» написано з великої літери відповідно до поширеної української біблійної традиції.
