  text: They said to him[a], “Why then did Moses command to give a certificate of divorce and to send her away?”
translation:
  language: uk
  text: 'Вони кажуть йому: «Чому ж тоді Мойсей наказав дати свідоцтво про розлучення й відпустити її[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «і розлучитися з нею». Грецьке дієслово може означати «відпустити», а в цьому контексті вживається щодо розлучення.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: Вони кажуть йому
  rationale: Збережено грецький історичний теперішній час, природний і зрозумілий також у сучасній українській біблійній оповіді.
- source_word: Τί οὖν
  choice: Чому ж тоді
  rationale: У контексті вислів вводить заперечення щодо попередніх слів Ісуса; «чому ж тоді» природно передає аргументативну силу.
- source_word: ἐνετείλατο
  choice: наказав
  rationale: Дієслово прямо означає наказ; формулювання співрозмовників не виправлено наперед відповідно до уточнення Ісуса в наступному вірші.
- source_word: δοῦναι
  choice: дати
  rationale: Прямий відповідник інфінітива, залежного від «наказав».
- source_word: βιβλίον ἀποστασίου
  choice: свідоцтво про розлучення
  rationale: Вислів означає письмовий юридичний документ про розлучення; цей відповідник ясний у сучасній українській мові.
- source_word: καὶ ἀπολῦσαι αὐτήν
  choice: й відпустити її
  rationale: «Відпустити» зберігає образне значення ἀπολύω, тоді як контекст і згадка про свідоцтво ясно вказують на юридичне розлучення.
theological_decisions:
- issue: Чи узгоджувати слова співрозмовників з Ісусовим уточненням у наступному вірші
  choice: Зберегти «наказав»
  alternative: «дозволив»
  rationale: Грецький текст цього вірша прямо має ἐνετείλατο — «наказав». Переклад має зберегти формулювання запитання, не вносячи наперед відповіді Ісуса.
translation_notes:
  register: Сучасна стандартна українська мова; виклад природний, стислий і гідний. Історичний теперішній збережено як стилістичну рису грецької оповіді. Формулу «свідоцтво про розлучення» обрано заради ясності юридичного змісту.
