id: MAT.19.29
reference: Matthew 19:29
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: καὶ πᾶς ⸀ὅστις ἀφῆκεν ⸂οἰκίας ἢ⸃ ἀδελφοὺς ἢ ἀδελφὰς ἢ πατέρα ἢ μητέρα ἢ ⸂γυναῖκα ἢ⸃ τέκνα ἢ ⸀ἀγροὺς ἕνεκεν τοῦ ⸂ὀνόματός μου⸃, ⸀ἑκατονταπλασίονα λήμψεται καὶ ζωὴν αἰώνιον κληρονομήσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/029.yaml
  text: And everyone who has left houses or brothers or sisters or father or mother or wife or children or fields for the sake of my name will receive a hundredfold and will inherit eternal life[a].
translation:
  language: uk
  text: І кожен, хто залишив доми, братів чи сестер, батька чи матір, дружину чи дітей, або поля заради Мого імені, одержить у сто разів більше[a] й успадкує вічне життя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «стократно».'
    reason: Лексична альтернатива, що зберігає традиційний стислий відповідник грецького ἑκατονταπλασίονα.
lexical_decisions:
- source_word: πᾶς ὅστις
  choice: кожен, хто
  rationale: 'Природно передає розподільне й загальне значення: кожна людина, яка відповідає названій умові.'
- source_word: ἀφῆκεν
  choice: залишив
  rationale: Нейтрально передає завершену дію, не додаючи сильнішого відтінку «покинув назавжди» чи «зрікся».
- source_word: οἰκίας
  choice: доми
  rationale: Зберігає множину та конкретне значення житла або майна; у цьому переліку природніше й ширше за суто емоційне «домівки».
- source_word: ἀδελφοὺς ἢ ἀδελφὰς
  choice: братів чи сестер
  rationale: Зберігає окремо названі в грецькому тексті родинні групи.
- source_word: πατέρα ἢ μητέρα
  choice: батька чи матір
  rationale: Прямо й природно передає однину обох термінів спорідненості.
- source_word: γυναῖκα
  choice: дружину
  rationale: У переліку членів родини γυνή означає дружину, а не жінку взагалі.
- source_word: τέκνα
  choice: дітей
  rationale: Звичайний сучасний відповідник для нащадків у родинному переліку.
- source_word: ἀγρούς
  choice: поля
  rationale: Конкретно передає землеробські угіддя й майново-економічний бік переліку, не звужуючи значення до господарств.
- source_word: ἕνεκεν τοῦ ὀνόματός μου
  choice: заради Мого імені
  rationale: Зберігає біблійний образ «імені» та передає мотив відданості Ісусові, Його особі й авторитету.
- source_word: ἑκατονταπλασίονα
  choice: у сто разів більше
  rationale: Природний для сучасної української спосіб виразити стократну міру винагороди; традиційний стислий відповідник подано в примітці.
- source_word: ζωὴν αἰώνιον κληρονομήσει
  choice: успадкує вічне життя
  rationale: Зберігає метафору спадкування та усталений, зрозумілий вислів «вічне життя».
theological_decisions:
- issue: Значення γυνή у переліку того, що залишають заради учнівства
  choice: дружину
  alternative: жінку
  rationale: Родинний контекст указує на подружній зв’язок; переклад «жінку» міг би хибно означати відмову від жінок узагалі.
- issue: Передача ἕνεκεν τοῦ ὀνόματός μου
  choice: заради Мого імені
  alternative: заради Мене
  rationale: Збереження слова «ім’я» не усуває богословської ваги оригінального вислову й не зводить його до пояснювального переказу.
- issue: Характер обіцянки в ἑκατονταπλασίονα
  choice: у сто разів більше
  alternative: стократно
  rationale: Передано кількісну силу вислову без додаткового тлумачення того, в якій саме формі здійснюється обіцяне відшкодування.
translation_notes:
  register: Сучасна літературна українська з гідним біблійним звучанням. Перелік оформлено природними для української мови сполучниками «чи» та «або», без зміни його охоплення. Займенник «Мого» написано з великої літери відповідно до поширеної української біблійної видавничої традиції.
