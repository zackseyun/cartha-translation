  text: ἀκούσαντες δὲ οἱ ⸀μαθηταὶ ἐξεπλήσσοντο σφόδρα λέγοντες· Τίς ἄρα δύναται σωθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/025.yaml
  text: When the disciples heard this, they were greatly astonished and said, “Who then can be saved?”
translation:
  language: uk
  text: 'Почувши це, учні надзвичайно здивувалися й запитали: «Хто ж тоді може спастися?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Почувши це
  rationale: Аористовий дієприкметник передає обставину, що передує головній дії; «це» природно відсилає до попередніх слів Ісуса.
- source_word: δὲ
  choice: '[окремо не передано]'
  rationale: Частка позначає продовження або легке протиставлення; у сучасній українській перехід уже природно виражений зворотом «Почувши це».
- source_word: οἱ μαθηταὶ
  choice: учні
  rationale: Усталений і природний євангельський відповідник для учнів Ісуса.
- source_word: ἐξεπλήσσοντο σφόδρα
  choice: надзвичайно здивувалися
  rationale: Передає сильний ступінь приголомшення; доконаний український відповідник природний у цій оповідній послідовності, хоча грецький імперфект змальовує їхню реакцію в перебігу.
- source_word: λέγοντες
  choice: й запитали
  rationale: Дієприкметник супровідного мовлення природно передано особовим дієсловом; форма репліки є прямим запитанням.
- source_word: Τίς ἄρα
  choice: Хто ж тоді
  rationale: «Хто» точно передає особовий займенник, а «ж тоді» зберігає висновковий відтінок ἄρα та здивування учнів.
- source_word: δύναται σωθῆναι
  choice: може спастися
  rationale: «Може» передає здатність, а «спастися» є природним українським відповідником пасивного значення «бути спасенним», не уточнюючи способу спасіння.
theological_decisions:
- issue: Значення σωθῆναι у контексті
  choice: спастися
  alternative: бути врятованим; бути спасенним
  rationale: Контекст входження до Божого Царства вказує на спасіння в повному богословському значенні, а не лише на визволення з тимчасової небезпеки. Зворот «спастися» зберігає пасивний зміст грецької форми без пояснення механізму спасіння.
translation_notes:
  register: Сучасна стандартна українська; виклад природний, стислий і гідний. «Надзвичайно здивувалися» передає силу σφόδρα без архаїчності, а «Хто ж тоді» зберігає висновок і подив у запитанні.
