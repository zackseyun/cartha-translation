  source_fidelity: Переклад точно передає часову обставину ἀκούσαντες («Почувши це»), суб’єкт («учні»), інтенсивність реакції (ἐξεπλήσσοντο σφόδρα), висновкову частку ἄρα («ж тоді») та питання про спасіння (σωθῆναι). «Запитали» у поєднанні з прямим питальним висловом адекватно передає λέγοντες, не змінюючи змісту.
