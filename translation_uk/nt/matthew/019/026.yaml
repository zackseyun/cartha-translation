  text: ἐμβλέψας δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Παρὰ ἀνθρώποις τοῦτο ἀδύνατόν ἐστιν, παρὰ δὲ θεῷ πάντα δυνατά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/026.yaml
  text: But Jesus looked at them and said to them[a], “With men this is impossible, but with God all things are possible.”
translation:
  language: uk
  text: 'А Ісус, поглянувши на них, сказав їм: «Для людей це неможливо, але для Бога все можливо».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας
  choice: поглянувши на них
  rationale: Дієприкметник передає спрямований на співрозмовників погляд. «Поглянувши» природно звучить українською і не додає надмірної інтенсивності на кшталт «пильно вдивившись».
- source_word: δὲ
  choice: А
  rationale: Частка δέ тут позначає м’який перехід із відтінком протиставлення до попередньої реакції учнів; українське «А» природно передає цю функцію.
- source_word: εἶπεν αὐτοῖς
  choice: сказав їм
  rationale: Збережено явно виражений у грецькому тексті давальний займенник αὐτοῖς.
- source_word: παρὰ ἀνθρώποις
  choice: для людей
  rationale: Παρά з давальним виражає сферу або те, що можливе з людського боку. «Для людей» є природним сучасним відповідником, а «людей» точно передає загальне значення ἀνθρώποις без гендерного звуження.
- source_word: τοῦτο
  choice: це
  rationale: Вказівний займенник відсилає до щойно обговорюваного спасіння; лаконічне «це» зберігає референцію без пояснювального додавання.
- source_word: ἀδύνατόν ἐστιν
  choice: неможливо
  rationale: Безособова українська конструкція прямо й природно передає грецький присудковий прикметник із дієсловом-зв’язкою.
- source_word: παρὰ δὲ θεῷ
  choice: але для Бога
  rationale: Повтор конструкції παρά з давальним збережено через паралельне «для», а δέ у виразному протиставленні передано сполучником «але».
- source_word: πάντα δυνατά
  choice: все можливо
  rationale: Українське «все» природно передає субстантивовану множину πάντα у всеохопному значенні, а «можливо» зберігає паралель із попереднім «неможливо».
theological_decisions:
- issue: Загальне значення ἀνθρώποις у протиставленні Богові
  choice: для людей
  alternative: людям / у людей
  rationale: Іменник позначає людство загалом, а не лише чоловіків. «Для людей» зберігає універсальність вислову та симетрію з «для Бога», не вводячи конфесійного тлумачення.
- issue: Обсяг вислову πάντα δυνατά
  choice: все можливо
  alternative: усе є можливим
  rationale: Збережено всеохопну й напружену форму вислову без доданого уточнення, що звужувало б її до конкретної людської дії; контекст сам визначає її стосунок до спасіння.
translation_notes:
  register: Сучасна нормативна українська мова з лаконічним, гідним біблійним звучанням. Паралель «для людей… для Бога» відтворює риторичний баланс оригіналу; порядок слів залишається природним для широкого кола читачів.
