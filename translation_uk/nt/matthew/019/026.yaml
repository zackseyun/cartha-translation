  source_fidelity: 'Текст точно передає всі суттєві елементи SBLGNT: аористний дієприкметник ἐμβλέψας («поглянувши на них»), перехідне δέ («А»), явне αὐτοῖς («їм»), паралельні вислови παρὰ ἀνθρώποις / παρὰ θεῷ («для людей» / «для Бога»), τοῦτο («це»), ἀδύνατον («неможливо») та πάντα δυνατά («все можливо»). Українська конструкція з «для» природно передає тут сферу чи можливість з певного боку; паралелізм збережено.'
