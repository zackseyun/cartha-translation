  text: Τότε ⸀προσηνέχθησαν αὐτῷ παιδία ἵνα τὰς χεῖρας ἐπιθῇ αὐτοῖς καὶ προσεύξηται· οἱ δὲ μαθηταὶ ἐπετίμησαν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/013.yaml
  text: Then children were brought to him so that he might lay his hands on them and pray[a]; but the disciples rebuked them.
translation:
  language: uk
  text: Тоді до нього привели дітей, щоб він поклав на них руки й помолився; та учні дорікнули їм.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Останнє «їм» може стосуватися або дітей, або тих, хто їх привів.
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  choice: Тоді
  rationale: Природно й стисло позначає наступний момент у розповіді.
- source_word: προσηνέχθησαν αὐτῷ παιδία
  choice: до нього привели дітей
  rationale: Передає аорист пасивного стану προσφέρω природною українською конструкцією без надмірно формального «представили».
- source_word: ἵνα
  choice: щоб
  rationale: Зберігає значення мети й природно звучить у сучасній українській.
- source_word: τὰς χεῖρας ἐπιθῇ αὐτοῖς
  choice: він поклав на них руки
  rationale: Точно передає усталений вислів про покладання рук і зберігає множину «руки».
- source_word: προσεύξηται
  choice: помолився
  rationale: Передає дієслово без додавання не вираженого прямо в грецькому тексті додатка «за них».
- source_word: οἱ δὲ μαθηταὶ
  choice: та учні
  rationale: «Та» виражає легке протиставлення δέ без надмірного посилення контрасту.
- source_word: ἐπετίμησαν αὐτοῖς
  choice: докоряли їм
  rationale: «Докоряли» передає осудливу, стримувальну силу ἐπιτιμάω, а займенник «їм» зберігає неоднозначність референта αὐτοῖς.
theological_decisions:
- issue: Референт останнього αὐτοῖς
  choice: їм
  alternative: дітям; тим, хто привів дітей
  rationale: Грецький займенник граматично може стосуватися як дітей, так і тих, хто їх привів. Українське «їм» не усуває цієї справжньої неоднозначності.
translation_notes:
  register: Сучасна стандартна українська, природний і гідний оповідний стиль. Займенники на позначення Ісуса подано з малої літери відповідно до звичайної сучасної орфографічної практики; змістової зневаги це не виражає.
