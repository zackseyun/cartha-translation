base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/008.yaml
  text: He said to them[a], “Because of your hardness of heart Moses permitted you to divorce your wives[c][b], but from the beginning it has not been so.”
translation:
  language: uk
  text: 'Він сказав їм: «Через закам''янілість ваших сердець Мойсей дозволив вам розлучатися зі своїми дружинами»[a], але від початку так не було.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «відпускати своїх дружин»; у цьому контексті йдеться про розлучення.'
    reason: lexical_alternative
  - marker: b
    text: Тобто цей дозвіл не відображав початкового порядку творіння.
    reason: cross_reference
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Він сказав їм
  rationale: Грецький історичний теперішній час природно передано минулим часом у сучасній українській оповіді.
- source_word: πρὸς τὴν σκληροκαρδίαν ὑμῶν
  choice: через вашу жорстокість серця
  rationale: «Через» передає причинне значення πρός із знахідним відмінком, а «жорстокість серця» зберігає конкретний біблійний образ.
- source_word: ἐπέτρεψεν
  choice: дозволив
  rationale: Дієслово означає надання дозволу, а не наказ чи схвалення.
- source_word: ἀπολῦσαι τὰς γυναῖκας ὑμῶν
  choice: розлучатися зі своїми дружинами
  rationale: У контексті шлюбу ἀπολύω означає розірвання шлюбу; γυνή тут означає «дружина».
- source_word: ἀπ’ ἀρχῆς
  choice: від початку
  rationale: Стислий природний відповідник, що зберігає відсилання до початку творіння в найближчому контексті.
- source_word: οὐ γέγονεν οὕτως
  choice: так не було
  rationale: Український вислів природно передає заперечення усталеного стану речей, позначеного перфектом γέγονεν, без недоречного значення окремої події.
theological_decisions:
- issue: Чи подати дію Мойсея як наказ, поступку або дозвіл
  choice: Мойсей дозволив вам
  alternative: Мойсей наказав вам
  rationale: Грецьке ἐπέτρεψεν означає дозвіл або поступку, а не позитивний наказ; це зберігає протиставлення між Мойсеєвим дозволом і початковим порядком.
- issue: Чи пояснювати в основному тексті відсилання до творіння
  choice: але від початку так не було
  alternative: але від початку це не було Божим задумом
  rationale: Обраний варіант зберігає формулювання та певну стислість грецького тексту, не вводячи пояснювальної богословської парафрази.
translation_notes:
  register: Сучасна нормативна українська мова; виклад природний і гідний. Збережено біблійний образ «жорстокість серця», а юридичне значення ἀπολύω ясно передано словом «розлучатися».
