base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/007.yaml
  text: So after taking counsel[b][a], they bought the Potter’s Field with them as a burial place for foreigners.
translation:
  language: uk
  text: Порадившись, вони купили за ті гроші[a] Гончареве поле, щоб ховати там чужинців[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «з них», тобто зі срібняків, згаданих у попередньому контексті.'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «чужоземців»; грецьке слово може означати також прибулих чи немісцевих людей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συμβούλιον δὲ λαβόντες
  choice: Порадившись
  rationale: Дієприслівникова форма природно передає попередню спільну нараду, виражену грецьким зворотом «узявши раду»; δέ тут служить переходом у розповіді й не потребує окремого сполучника.
- source_word: ἠγόρασαν
  choice: купили
  rationale: Прямий і природний відповідник аориста ἀγοράζω.
- source_word: ἐξ αὐτῶν
  choice: за ті гроші
  rationale: Буквально «з них»; займенник середнього роду множини в найближчому контексті вказує на срібняки. Українське «за ті гроші» ясно й природно передає засіб оплати.
- source_word: τὸν Ἀγρὸν τοῦ Κεραμέως
  choice: Гончареве поле
  rationale: Стислий природний відповідник родового словосполучення; написання з великої літери відбиває вживання як назви конкретного місця.
- source_word: εἰς ταφὴν
  choice: щоб ховати там
  rationale: Передає мету придбання поля й природно поєднується в українській мові з позначенням осіб, для поховання яких його призначили.
- source_word: τοῖς ξένοις
  choice: чужинців
  rationale: У цьому контексті ξένοι означає прибулих, немісцевих або чужоземців; «чужинці» зберігає широту вислову, не обмежуючи його лише юридичним громадянством.
theological_decisions:
- issue: Референт αὐτῶν
  choice: Займенник стосується срібняків із попереднього контексту й переданий як «за ті гроші».
  alternative: 'Буквальніше: «за них».'
  rationale: Контекст однозначно вказує на повернені срібняки, тоді як буквальне українське «за них» може бути помилково сприйняте як посилання на людей. Виноска зберігає формальну особливість грецького тексту.
- issue: Значення τοῖς ξένοις
  choice: «чужинців» — прибулих або немісцевих людей.
  alternative: «чужоземців» або «незнайомців».
  rationale: Грецьке слово допускає ширший зміст, ніж лише іноземне громадянство, тому переклад не звужує його без потреби.
translation_notes:
  register: Сучасна стандартна українська мова; виклад стислий, природний і гідний. Дієприслівник зберігає послідовність дій, а пояснювальні виноски фіксують буквальну форму та семантичну широту оригіналу.
