  source_fidelity: Український текст точно передає часовий генітив абсолютний («Коли настав ранок»), повноту групи («усі»), склад учасників, ворожу спрямованість κατὰ τοῦ Ἰησοῦ («проти Ісуса») та мету, виражену ὥστε з інфінітивом («щоб убити Його»). «Радилися» адекватно відтворює συμβούλιον ἔλαβον без невиправданого посилення до змови.
  naturalness: Фраза є природною для сучасної нормативної української та має доречний стримано-урочистий біблійний регістр. Синтаксис прозорий, а «первосвященники» і «старійшини народу» звучать усталено в цьому історико-релігійному контексті.
  terminology: 'Ключові терміни відтворено послідовно й зрозуміло: «первосвященники» для οἱ ἀρχιερεῖς, «старійшини народу» для οἱ πρεσβύτεροι τοῦ λαοῦ. Формула «убити Його» не додає конкретизації щодо способу чи юридичного механізму смерті, якої немає в грецькому тексті.'
