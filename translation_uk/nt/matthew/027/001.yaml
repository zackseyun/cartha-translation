id: MAT.27.1
reference: Matthew 27:1
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Πρωΐας δὲ γενομένης συμβούλιον ἔλαβον πάντες οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ κατὰ τοῦ Ἰησοῦ ὥστε θανατῶσαι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/001.yaml
  text: When morning came[b][a], all the chief priests and the elders of the people took counsel against Jesus so as to put him to death.
translation:
  language: uk
  text: Коли настав ранок[a], усі первосвященники та старійшини народу радилися[b] проти Ісуса, щоб убити Його.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Коли розвиднілося».'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «провели нараду».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρωΐας δὲ γενομένης
  choice: Коли настав ранок
  rationale: Генітив абсолютний позначає часовий перехід. Формулювання природно передає настання ранку; δέ відтворено самим переходом у розповіді без окремого сполучника.
- source_word: συμβούλιον ἔλαβον
  choice: радилися
  rationale: Грецький ідіоматичний вислів означає спільне обговорення або нараду. «Радилися» передає дорадчий характер дії, не додаючи сильнішого відтінку змови чи вже ухваленого рішення.
- source_word: πάντες
  choice: усі
  rationale: Збережено явний наголос на повноті названої групи керівників.
- source_word: οἱ ἀρχιερεῖς
  choice: первосвященники
  rationale: Усталене українське позначення представників вищого єрусалимського священницького керівництва; множина тут не означає одночасної наявності кількох чинних первосвященників.
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: старійшини народу
  rationale: Природне й усталене відтворення офіційного найменування народних провідників.
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: проти Ісуса
  rationale: У цьому ворожому контексті κατά з родовим відмінком має значення спрямованості проти когось, а не просто обговорення когось.
- source_word: ὥστε
  choice: щоб
  rationale: Сполучник з інфінітивом тут передає задуманий наслідок або мету; українське «щоб» природно зберігає цю можливу смислову напругу.
- source_word: θανατῶσαι αὐτόν
  choice: убити Його
  rationale: Прямо й зрозуміло передає спричинення смерті, не додаючи відсутньої в грецькому тексті конкретизації про вирок, страту або передачу іншій владі.
theological_decisions:
- issue: Характер дії керівників щодо Ісуса
  choice: 'Передати вороже дорадче обговорення, метою якого була смерть Ісуса: «радилися проти Ісуса, щоб убити Його».'
  alternative: «Змовилися проти Ісуса» або слабше «радилися про Ісуса».
  rationale: κατά виразно вказує на ворожу спрямованість, а ὥστε θανατῶσαι — на намір спричинити смерть. Водночас «радилися» не вносить сильнішого відтінку таємної змови, якого сам вислів не вимагає.
translation_notes:
  register: Сучасна нормативна українська мова з гідним оповідним тоном. Синтаксис простий і зрозумілий; збережено судово-дорадчий контекст без конфесійного уточнення чи гармонізації з наступними подіями.
