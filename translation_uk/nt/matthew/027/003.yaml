  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Τότε ἰδὼν Ἰούδας ὁ ⸀παραδιδοὺς αὐτὸν ὅτι κατεκρίθη μεταμεληθεὶς ⸀ἔστρεψεν τὰ τριάκοντα ἀργύρια τοῖς ἀρχιερεῦσιν ⸀καὶ πρεσβυτέροις
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/003.yaml
  text: Then Judas[a], who had betrayed him, seeing that he had been condemned[b], regretted it and returned the thirty pieces of silver to the chief priests and elders.
translation:
  language: uk
  text: Тоді Юда, який зрадив Його, побачивши, що Його засудили, пожалкував про це й повернув тридцять срібняків первосвященникам і старійшинам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Тоді
  rationale: Природний український часовий маркер, що вводить наступну подію в оповіді.
- source_word: ἰδὼν
  choice: побачивши
  rationale: Дієприслівник стисло зберігає часовий і супровідний зв’язок аористового дієприкметника з головною дією.
- source_word: Ἰούδας
  choice: Юда
  rationale: Усталена українська форма цього особового імені в біблійному контексті.
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: який зрадив Його
  rationale: Означальний зворот називає Юду за його роллю; «зрадив» природно передає контекстуальне значення παραδίδωμι, хоча буквально дієслово може означати «передав» або «видав».
- source_word: ὅτι κατεκρίθη
  choice: що Його засудили
  rationale: Безособово-активна українська конструкція природно передає грецький аорист пасивного стану, не називаючи виконавців дії.
- source_word: μεταμεληθεὶς
  choice: пожалкував про це
  rationale: Передає жаль через учинене, не приписуючи слову сильнішого богословського значення повного покаяння.
- source_word: ἔστρεψεν
  choice: повернув
  rationale: У контексті грошей та адресатів дієслово означає повернення того, що було отримано.
- source_word: τὰ τριάκοντα ἀργύρια
  choice: тридцять срібняків
  rationale: Зрозумілий і усталений український вислів для тридцяти одиниць срібних грошей; не уточнює номіналу, якого грецький текст не називає.
- source_word: τοῖς ἀρχιερεῦσιν καὶ πρεσβυτέροις
  choice: первосвященникам і старійшинам
  rationale: Усталені українські назви відповідних груп юдейського керівництва в цьому контексті.
theological_decisions:
- issue: Значення μεταμεληθεὶς у ставленні Юди до свого вчинку
  choice: пожалкував про це
  alternative: покаявся; розкаявся; змінив думку
  rationale: μεταμέλομαι позначає жаль або докори через учинене й не є тим самим дієсловом, що μετανοέω. Обране формулювання не вирішує ширшого питання про духовний стан Юди.
translation_notes:
  register: Сучасна нормативна українська мова, гідний оповідний стиль. Синтаксис збережено близьким до грецького, але без неприродного нагромадження конструкцій. Великі літери в займеннику «Його» вжито за поширеною українською біблійною практикою для позначення Ісуса.
