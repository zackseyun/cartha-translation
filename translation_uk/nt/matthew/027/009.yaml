source:
  edition: SBLGNT
  text: τότε ἐπληρώθη τὸ ῥηθὲν διὰ Ἰερεμίου τοῦ προφήτου λέγοντος· Καὶ ἔλαβον τὰ τριάκοντα ἀργύρια, τὴν τιμὴν τοῦ τετιμημένου ὃν ἐτιμήσαντο ἀπὸ υἱῶν Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/009.yaml
  text: Then what was spoken through Jeremiah the prophet was fulfilled[a], saying, ‘And they took the thirty pieces of silver, the price of the one who had been valued[b], whom they valued from among the sons of Israel,’
translation:
  language: uk
  text: 'Тоді справдилося сказане через пророка Єремію[a]: «І взяли вони тридцять срібняків — ціну оціненого[b], якого оцінили з-поміж синів Ізраїлю, —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Матвій приписує це пророче слово Єремії. Формулювання найближче до Захарії 11:12–13. Це пояснюють по-різному: як складену цитату, як посилання на збірку пророчих книг або як текстову проблему, що виникла під час передавання тексту.'
    reason: textual_variant
  - marker: b
    text: 'Або: «того, кому визначили ціну». Грецький вислів повторює різні форми одного дієслова: «оціненого, якого оцінили». Завершальний зворот також можна розуміти: «якого оцінили сини Ізраїлю»; грецька конструкція неоднозначна.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Тоді
  rationale: Природно й стисло передає часову послідовність у розповіді.
- source_word: ἐπληρώθη
  choice: справдилося
  rationale: Усталений і природний український відповідник формули здійснення пророцтва; зберігає пасивно-результативний зміст без доданого суб’єкта.
- source_word: τὸ ῥηθὲν
  choice: сказане
  rationale: Лаконічно передає субстантивований пасивний дієприкметник і вказує на раніше висловлене пророче слово.
- source_word: διὰ Ἰερεμίου τοῦ προφήτου
  choice: через пророка Єремію
  rationale: Передає διά з родовим відмінком як посередництво пророка й звучить природно українською.
- source_word: λέγοντος
  choice: двокрапка перед цитатою
  rationale: В українській конструкція «сказане…:» природно вводить зміст вислову без окремого калькованого «який говорив».
- source_word: ἔλαβον
  choice: взяли вони
  rationale: Зберігає невизначений множинний суб’єкт і базове значення λαμβάνω в цьому контексті.
- source_word: τὰ τριάκοντα ἀργύρια
  choice: тридцять срібняків
  rationale: Зрозумілий традиційний український вислів для срібних грошових одиниць, конкретніший за просто «срібло».
- source_word: τὴν τιμὴν
  choice: ціну
  rationale: У грошовому контексті τιμή означає встановлену ціну або вартість.
- source_word: τοῦ τετιμημένου
  choice: Оціненого
  rationale: Зберігає пасивний перфектний зміст і словесний зв’язок із наступним ἐτιμήσαντο; велика літера не нав’язує окремого титулу, а позначає субстантивоване означення особи в цитаті.
- source_word: ὃν ἐτιμήσαντο
  choice: якого оцінили
  rationale: Повторює корінь «оцін-», відбиваючи повтор τιμάω та його гірку комерційну конотацію.
- source_word: ἀπὸ υἱῶν Ἰσραήλ
  choice: з-поміж синів Ізраїлю
  rationale: Передає складне ἀπό як походження/партитивний зв’язок, не додаючи до основного тексту слова «деякі».
theological_decisions:
- issue: Приписування пророчого слова Єремії, хоча формулювання найближче до Захарії 11:12–13
  choice: Залишити в основному тексті «через пророка Єремію» без гармонізації.
  alternative: Замінити ім’я на Захарію або пояснити цитату безпосередньо в основному тексті.
  rationale: SBLGNT прямо називає Єремію; переклад має зберігати текстове й інтерпретаційне напруження, а не усувати його.
- issue: Референт τοῦ τετιμημένου
  choice: Передати як особове субстантивоване означення «Оціненого».
  alternative: «того, кого оцінили» або «оціненого» з малої літери.
  rationale: Грецька форма вказує на особу, якій визначили ціну, але сама по собі не розв’язує всіх христологічних та цитатних зв’язків; формулювання зберігає цю стислість.
translation_notes:
  register: Сучасна літературна українська з урочистим, але доступним біблійним звучанням. Синтаксис зберігає незавершеність цитати, що продовжується в наступному вірші. Усі приміткові маркери подано в основному тексті.
