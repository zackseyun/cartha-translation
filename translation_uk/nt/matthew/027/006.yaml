source:
  edition: SBLGNT
  text: οἱ δὲ ἀρχιερεῖς λαβόντες τὰ ἀργύρια εἶπαν· Οὐκ ἔξεστιν βαλεῖν αὐτὰ εἰς τὸν κορβανᾶν, ἐπεὶ τιμὴ αἵματός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/006.yaml
  text: But the chief priests[a], taking the silver pieces, said, “It is not lawful to put them into the temple treasury[b], since they are the price of blood.”
translation:
  language: uk
  text: 'А первосвященники, взявши срібняки, сказали: «Не дозволено класти їх до храмової скарбниці[a], бо це ціна крові[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Грецьке κορβανᾶν (корван) — храмова скарбниця або священні кошти.
    reason: lexical_alternative
  - marker: b
    text: Або «криваві гроші».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερεῖς
  choice: первосвященники
  rationale: У множині слово позначає старших представників священницької влади; це усталений і зрозумілий український відповідник у євангельському контексті.
- source_word: λαβόντες
  choice: взявши
  rationale: Дієприслівник природно передає аористовий дієприкметник і послідовність супровідної дії без надмірного уточнення часу.
- source_word: τὰ ἀργύρια
  choice: срібняки
  rationale: Контекст указує на отримані Юдою срібні гроші; «срібняки» стисло передає конкретний грошовий зміст, не визначаючи тип монети.
- source_word: Οὐκ ἔξεστιν
  choice: Не дозволено
  rationale: Передає заборону з погляду закону або релігійної правомірності природною сучасною українською мовою.
- source_word: βαλεῖν
  choice: класти
  rationale: У контексті внесення грошей до скарбниці нейтральне «класти» природніше за буквальне «кидати».
- source_word: κορβανᾶν
  choice: храмової скарбниці
  rationale: Термін стосується скарбниці або священних коштів храму; переклад розкриває значення для сучасного читача, а грецьку назву збережено в примітці.
- source_word: ἐπεὶ
  choice: бо
  rationale: Стисло й природно вводить причину названої заборони.
- source_word: τιμὴ αἵματός
  choice: ціна крові
  rationale: Формально зберігає стислий і напружений грецький вислів, не звужуючи його до пояснювального перифразу.
theological_decisions:
- issue: Як передати κορβανᾶν, зберігши храмовий і сакрально-правовий контекст
  choice: храмової скарбниці
  alternative: корвану; скарбниці
  rationale: Переклад значення робить вислів зрозумілим без привнесення доктринального тлумачення; транслітеровану форму подано в примітці.
- issue: Як передати τιμὴ αἵματός без усунення образної неоднозначності
  choice: ціна крові
  alternative: криваві гроші; плата за пролиту кров
  rationale: «Ціна крові» близька до форми оригіналу й зберігає моральну та юридичну напругу вислову; альтернативний ідіоматичний варіант наведено в примітці.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська біблійна мова. Синтаксис зберігає стислу аргументацію оригіналу; спеціальний термін пояснено, а не залишено без перекладу.
