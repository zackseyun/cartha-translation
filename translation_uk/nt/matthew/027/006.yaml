  source_fidelity: 'Текст точно передає грецький оригінал: «первосвященники» відповідає οἱ ἀρχιερεῖς, дієприслівник «взявши» коректно відтворює λαβόντες, «срібняки» зберігає конкретний грошовий референт τὰ ἀργύρια, а «ціна крові» близько передає τιμὴ αἵματός без зайвого тлумачення.'
  naturalness: Вислів звучить природно сучасною літературною українською та зберігає стриманий біблійний регістр. «Не дозволено» адекватно передає нормативно-релігійний відтінок Οὐκ ἔξεστιν; «класти ... до храмової скарбниці» є ясним ідіоматичним формулюванням.
  terminology: «Первосвященники», «храмова скарбниця» і «ціна крові» є послідовними та зрозумілими відповідниками. Примітка до κορβανᾶν належно зберігає грецький термін і пояснює його значення; примітка до «ціни крові» подає доречний ідіоматичний варіант без заміни основного, ближчого до оригіналу перекладу.
