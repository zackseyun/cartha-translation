    rationale: καὶ не містить сам по собі протиставного значення. Нейтральне «І» краще зберігає зв’язок, не додаючи інтерпретаційного контрасту.
  - severity: low
    issue: «тож» для ὥστε
    rationale: «Тож» можливе, але «так що» безпосередніше виражає наслідок, який позначає ὥστε з інфінітивом.
