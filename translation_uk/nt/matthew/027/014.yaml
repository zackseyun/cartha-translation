base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/014.yaml
  text: And he did not answer him with even one word[b][a], so that the governor was greatly amazed.
translation:
  language: uk
  text: І Він не відповів йому ані словом, так що правитель дуже здивувався.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: не відповів
  rationale: Аорист депонентного ἀποκρίνομαι природно й точно передано доконаним дієсловом «не відповів».
- source_word: αὐτῷ
  choice: йому
  rationale: Давальний займенник позначає особу, якій Ісус не відповів; у контексті це Пилат.
- source_word: πρὸς οὐδὲ ἓν ῥῆμα
  choice: ані словом
  rationale: Стисла природна українська ідіома передає підсилене заперечення οὐδὲ ἕν і значення ῥῆμα як «слово, висловлювання», не звужуючи його до «звинувачення».
- source_word: ὥστε
  choice: тож
  rationale: Сполучник природно виражає наслідок мовчання Ісуса.
- source_word: θαυμάζειν
  choice: здивувався
  rationale: Інфінітив у конструкції наслідку перебудовано як особову форму; «здивувався» передає сильну реакцію без архаїчного відтінку.
- source_word: τὸν ἡγεμόνα
  choice: правитель
  rationale: У цьому контексті ἡγεμών позначає римського правителя провінції, Пилата; «правитель» є усталеним і зрозумілим відповідником.
- source_word: λίαν
  choice: дуже
  rationale: Природний сучасний прислівник зберігає високий ступінь здивування.
theological_decisions: []
translation_notes:
  register: Сучасна, dignified біблійна українська без архаїзмів. Початкове καί передано як «Але», оскільки тут воно пов’язує речення з попереднім контекстом і підкреслює контраст між обвинуваченнями та мовчанням Ісуса. Займенник «Він» написано з великої літери відповідно до поширеної української біблійної традиції.
