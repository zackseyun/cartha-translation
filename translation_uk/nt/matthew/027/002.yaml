  text: καὶ δήσαντες αὐτὸν ἀπήγαγον καὶ ⸀παρέδωκαν Πιλάτῳ τῷ ἡγεμόνι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/002.yaml
  text: And after binding him[b][a], they led him away and handed him over to Pilate the governor.
translation:
  language: uk
  text: І, зв’язавши Його[a], вони відвели Його та передали Пилатові, намісникові[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «після того як зв’язали Його».'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «правителеві».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δήσαντες
  choice: зв’язавши
  rationale: Аористовий активний дієприкметник від δέω позначає дію, що передує головним дієсловам; український дієприслівник природно й стисло передає цю послідовність та конкретне значення зв’язування.
- source_word: ἀπήγαγον
  choice: повели
  rationale: ἀπάγω означає вести або відводити; «повели» зберігає фізичний супровід особи під вартою без зайвого уточнення напрямку, уже зрозумілого з передачі Пилатові.
- source_word: παρέδωκαν
  choice: передали
  rationale: У цьому судово-владному контексті παραδίδωμι означає передати особу під чужу владу чи варту. «Передали» є сучасним і зберігає також ширший резонанс дієслова в оповіді про страждання.
- source_word: Πιλάτῳ
  choice: Пилату
  rationale: Особове ім’я передано усталеною українською біблійною формою у давальному відмінку відповідно до грецького тексту.
- source_word: τῷ ἡγεμόνι
  choice: правителеві
  rationale: ἡγεμών — широкий термін для урядовця або правителя. «Правитель» доступно відтворює грецький титул і не звужує його до історично точнішого, але не вираженого самим словом «префект».
theological_decisions:
- issue: Передача παραδίδωμι в оповіді про страждання
  choice: передали
  alternative: видали
  rationale: «Передали» насамперед виражає безпосередній юридично-владний зміст і не усуває ширшого богословського відлуння. «Видали» можливе, але може сильніше наголошувати на зраді, ніж цього вимагає саме речення.
- issue: Титул Пилата
  choice: правитель
  alternative: намісник
  rationale: Грецьке ἡγεμών має ширше значення, ніж конкретна назва римської посади. «Правитель» зберігає широту джерела; «намісник» є традиційним, але дещо конкретизує характер урядування.
translation_notes:
  register: Сучасна стандартна українська, природний і гідний оповідний стиль. Початкове «І» зберігає зв’язок із попередньою розповіддю; повтор займенника «Його» забезпечує ясність. Титул поставлено перед ім’ям у природному українському порядку, хоча грецький текст буквально має «Пилатові, правителеві».
