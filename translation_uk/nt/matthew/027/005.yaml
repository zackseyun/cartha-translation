  text: καὶ ῥίψας τὰ ἀργύρια ⸂εἰς τὸν ναὸν⸃ ἀνεχώρησεν, καὶ ἀπελθὼν ἀπήγξατο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/005.yaml
  text: And throwing the silver into the temple[a], he departed[b], and went and hanged himself.
translation:
  language: uk
  text: І, кинувши срібняки у храм[a], він відійшов, а потім пішов і повісився.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «у святилище». Грецьке слово ναός часто означає власне внутрішню храмову будівлю, а не весь храмовий комплекс.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίψας
  choice: кинувши
  rationale: Дієприкметник аориста передає дію, що передує головному дієслову; український дієприслівник природно й стисло зберігає послідовність подій.
- source_word: τὰ ἀργύρια
  choice: срібняки
  rationale: Вислів буквально означає «срібло», але в цьому контексті йдеться про срібні грошові одиниці; «срібняки» природно відсилає до раніше названої плати.
- source_word: εἰς τὸν ναόν
  choice: у храм
  rationale: Прийменникова конструкція позначає рух усередину. «Храм» є зрозумілим основним відповідником, а точніше значення ναός — внутрішнє святилище — зазначено у примітці.
- source_word: ἀνεχώρησεν
  choice: відійшов
  rationale: Передає значення відходу або залишення місця та зберігає відмінність від наступного дієслова руху.
- source_word: ἀπελθών
  choice: а потім пішов
  rationale: Окремий дієприкметник руху не згорнуто повністю; «а потім» природно передає подальшу послідовність дій українською.
- source_word: ἀπήγξατο
  choice: повісився
  rationale: Середній стан указує на дію щодо самого себе; у цьому контексті дієслово звичайно означає самогубство через повішення.
theological_decisions:
- issue: Точне значення ναός на відміну від ширшого позначення храмового комплексу
  choice: У головному тексті вжито «храм», а в примітці збережено точніший варіант «святилище».
  alternative: У святилище / у храмове святилище
  rationale: ναός часто позначає власне внутрішню храмову будівлю, а не весь храмовий комплекс. Основний текст лишається природним для широкого читача, не приховуючи точнішого архітектурного значення.
translation_notes:
  register: Сучасна, проста й гідна оповідна мова. Два послідовні вирази руху збережено без неприродного дослівного дублювання.
