  text: Ὁ δὲ Ἰησοῦς ⸀ἐστάθη ἔμπροσθεν τοῦ ἡγεμόνος· καὶ ἐπηρώτησεν αὐτὸν ὁ ἡγεμὼν λέγων· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ Ἰησοῦς ⸀ἔφη· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/011.yaml
  text: Jesus stood before the governor[a], and the governor questioned him, saying, “Are you the King of the Jews?” And Jesus said[b], “You say so.”
translation:
  language: uk
  text: 'Ісус став перед намісником, а намісник запитав Його: «Ти Цар юдеїв?» Ісус же сказав: «Ти кажеш».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Це ти сказав» чи «Так, як ти сказав». Грецька відповідь стисла й дещо еліптична.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐστάθη
  choice: стояв
  rationale: Аорист пасивної за формою, але неперехідної тут лексеми природно передається як «стояв»; «Його поставили» додало б невиражену в тексті причинність.
- source_word: ἔμπροσθεν
  choice: перед
  rationale: Стисло й природно передає як просторовий, так і офіційно-судовий контекст.
- source_word: ἡγεμών / ἡγεμόνος
  choice: правитель
  rationale: Загальне значення грецького слова збережено без технічного звуження до конкретного римського урядування; у контексті йдеться про Пилата.
- source_word: ἐπηρώτησεν
  choice: запитав
  rationale: Природний сучасний відповідник у сцені офіційного допиту; «допитував» могло б надмірно посилити тривалість або примус.
- source_word: λέγων
  choice: 'запитав …:'
  rationale: Дієприкметник природно інтегровано в українську конструкцію прямої мови без буквального й важкого «кажучи».
- source_word: βασιλεὺς
  choice: Цар
  rationale: «Цар» природно передає давній монархічний титул; велика літера позначає титульне вживання щодо Ісуса.
- source_word: τῶν Ἰουδαίων
  choice: юдеїв
  rationale: Усталений біблійний український відповідник, що в цьому політико-етнічному формулюванні охоплює юдейський народ; контекст не вимагає звуження лише до мешканців Юдеї.
- source_word: ἔφη
  choice: сказав
  rationale: Прямий нейтральний відповідник; «відповів» було б контекстуально правильним, але дещо більш пояснювальним.
- source_word: Σὺ λέγεις
  choice: Ти кажеш
  rationale: Зберігає стислість, еліптичність і стриману неоднозначність грецької відповіді, не перетворюючи її ані на беззастережне ствердження, ані на заперечення.
theological_decisions:
- issue: Відтінок відповіді Ісуса Σὺ λέγεις
  choice: Стримане й еліптичне «Ти кажеш».
  alternative: «Так, як ти сказав» або «Це ти сказав».
  rationale: Грецька фраза не є простим «так» і водночас не заперечує титулу; буквальна, природна українська форма зберігає напруження між визнанням і дистанціюванням від політичного формулювання правителя.
translation_notes:
  register: Сучасна літературна українська з гідним, але доступним судово-оповідним регістром. Сполучник δέ передано контекстуальним «же» лише у другій згадці про Ісуса; на початку вірша окремого «тепер» не додано. Займенник «Його» вжито з традиційної пошани, без зміни змісту.
