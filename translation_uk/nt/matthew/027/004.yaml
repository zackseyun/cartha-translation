translation:
  language: uk
  text: 'кажучи: «Я згрішив, видавши невинну кров». А вони сказали: «Що нам до того? Сам про це подбай».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Сам із цим розбирайся». Грецьке «сам побачиш» у цьому контексті є різкою відмовою брати на себе відповідальність.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἥμαρτον
  choice: Я згрішив
  rationale: Грецький аорист природно передається українським минулим доконаного виду; у прямому визнанні це чітко виражає скоєний гріх і теперішнє усвідомлення вини.
- source_word: παραδοὺς
  choice: видавши
  rationale: Дієприслівник зберігає форму й часову співвіднесеність грецького аористового дієприкметника та передає дію Юди як зрадницьке віддання Ісуса владі, не додаючи окремого слова «зрадив».
- source_word: αἷμα ἀθῷον
  choice: невинну кров
  rationale: Це стислий і зрозумілий біблійний вислів, який зберігає юридично-моральний зміст грецького тексту та не робить неявного референта явним.
- source_word: Τί πρὸς ἡμᾶς;
  choice: Що нам до того?
  rationale: Природний український відповідник грецького ідіоматичного запитання, яким співрозмовники відкидають свою причетність і відповідальність.
- source_word: σὺ ὄψῃ
  choice: Сам побачиш
  rationale: Зберігає майбутню форму ὄψῃ і наголос на σὺ, водночас передаючи різку ідіоматичну відмову брати відповідальність; значення «сам із цим розбирайся» пояснено у примітці.
theological_decisions:
- issue: Чи називати прямо Ісуса або невинну людину як того, чию кров було видано
  choice: Залишити біблійний вислів «невинну кров» без доданого референта
  alternative: «видавши на смерть невинну людину» або «видавши Ісуса»
  rationale: Грецький текст залишає референта невираженим. Додавання імені чи слова «людину» звузило б і витлумачило формулювання замість його перекладу.
- issue: Ідіоматичний характер σὺ ὄψῃ
  choice: 'У головному тексті зберегти майбутню форму: «Сам побачиш»'
  alternative: «Сам із цим розбирайся»
  rationale: Форма граматично є майбутнім часом, але в контексті має наказово-зневажливу силу. Основний текст зберігає напруження між формою та функцією, а примітка розкриває ідіоматичний зміст.
translation_notes:
  register: Сучасна нормативна українська мова з гідним біблійним звучанням. «Видавши» природніше за буквальне «передавши» в цьому сюжетному контексті; «невинна кров» збережено як прозорий біблійний вислів. Усі маркери приміток подано в основному тексті.
