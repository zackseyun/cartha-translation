lexical_decisions:
- source_word: Κατὰ δὲ ἑορτὴν
  choice: Під час свята
  rationale: Κατά з акузативом тут має часове значення «під час / на свято». Частку δέ не передано окремим словом, оскільки вона лише легко продовжує розповідь, а штучне «тепер» додало б відсутній у грецькому тексті часовий відтінок.
- source_word: εἰώθει
  choice: мав звичай
  rationale: Імперфект передає звичну, повторювану в минулому дію; «мав звичай» природно й виразно зберігає цей відтінок.
- source_word: ὁ ἡγεμὼν
  choice: намісник
  rationale: У контексті йдеться про римського провінційного правителя. «Намісник» є зрозумілим історико-адміністративним відповідником, не звужуючи назву до технічного титулу.
- source_word: ἀπολύειν
  choice: відпускати
  rationale: Дієслово означає звільняти людину з-під варти; у контексті в’язня українське «відпускати» передає це природно.
- source_word: ἕνα τῷ ὄχλῳ δέσμιον
  choice: відпускати натовпу одного в’язня
  rationale: ἕνα точно позначає одного в’язня, δέσμιον — особу під вартою, а давальний τῷ ὄχλῳ збережено як «натовпу», тобто на його прохання або вибір.
- source_word: ὃν ἤθελον
  choice: того, кого вони хотіли
  rationale: Відносний зворот стосується одного в’язня, якого обирав натовп. Формулювання зберігає множинне «вони» та не додає прямо не висловленого дієслова «звільнити».
