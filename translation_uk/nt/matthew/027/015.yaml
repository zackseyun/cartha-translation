  yaml_path: translation/nt/matthew/027/015.yaml
  text: At the feast the governor was accustomed to release to the crowd one prisoner[a], whom they wanted.
translation:
  language: uk
  text: Під час свята[a] намісник мав звичай відпускати натовпу одного в’язня, якого вони хотіли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «На свято».'
