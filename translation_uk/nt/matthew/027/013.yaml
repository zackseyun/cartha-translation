  source_fidelity: Текст точно передає послідовний часовий маркер τότε («Тоді»), історичний теперішній час λέγει («каже»), займенник αὐτῷ («йому») та заперечне запитання. «Скільки всього вони свідчать проти тебе» належно відтворює πόσα σου καταμαρτυροῦσιν, не звужуючи зміст до формально названих «звинувачень».
  naturalness: Фраза звучить природно для сучасної нормативної української біблійної оповіді. «Хіба ти не чуєш» доречно передає риторичну силу запитання; історичний теперішній «каже» узгоджений із грецьким наративним стилем.
