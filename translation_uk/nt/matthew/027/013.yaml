  yaml_path: translation/nt/matthew/027/013.yaml
  text: Then Pilate says to him[a], “Do you not hear how many things they are testifying against you?”
translation:
  language: uk
  text: 'Тоді Пилат каже йому: «Хіба ти не чуєш, скільки всього вони свідчать проти тебе[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «дають свідчення проти тебе». Грецьке дієслово має юридично-судовий відтінок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Тоді
  rationale: Природний часовий сполучник, що позначає наступну подію в розповіді.
- source_word: λέγει
  choice: каже
  rationale: Збережено грецький історичний теперішній час, який надає розповіді жвавості.
- source_word: αὐτῷ
  choice: йому
  rationale: Збережено займенник оригіналу без пояснювальної заміни на ім’я Ісуса.
- source_word: Οὐκ ἀκούεις
  choice: Хіба ти не чуєш
  rationale: «Хіба… не» природно передає заперечне запитання, що очікує ствердної відповіді.
- source_word: πόσα
  choice: скільки всього
  rationale: Передає невизначену множинність висловленого проти Ісуса, не звужуючи значення до самих «звинувачень».
- source_word: καταμαρτυροῦσιν
  choice: свідчать проти
  rationale: Зберігає юридично-судовий відтінок дієслова та не зводить його до більш тлумачного «звинувачують».
