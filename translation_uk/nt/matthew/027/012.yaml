base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/012.yaml
  text: And while he was being accused by the chief priests and elders[a], he answered nothing.
translation:
  language: uk
  text: І коли первосвященники та старійшини звинувачували його, він нічого не відповів.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «він не дав жодної відповіді».'
    reason: Лексично можливий природний варіант передачі οὐδὲν ἀπεκρίνατο.
lexical_decisions:
- source_word: ἐν τῷ κατηγορεῖσθαι
  choice: коли … звинувачували його
  rationale: Конструкція ἐν з артикльованим інфінітивом виражає одночасність; недоконаний вид «звинувачували» природно передає тривалу дію та пасивний зміст грецької форми.
- source_word: κατηγορεῖσθαι
  choice: звинувачували його
  rationale: У контексті судового розгляду дієслово означає висувати проти когось звинувачення; активна українська конструкція з названими діячами звучить природніше за громіздку пасивну.
- source_word: ὑπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων
  choice: первосвященники та старійшини
  rationale: «Первосвященники» — усталена назва провідників священницької верхівки, а «старійшини» точно й природно передає πρεσβύτεροι.
- source_word: οὐδὲν
  choice: нічого
  rationale: Збережено пряме значення грецького займенника як додатка до «відповів», без розширювального тлумачення.
- source_word: ἀπεκρίνατο
  choice: він … не відповів
  rationale: Аорист передано доконаним минулим часом; у поєднанні з οὐδέν українською природно сказати «нічого не відповів».
- source_word: καὶ
  choice: І
  rationale: Сполучник прямо продовжує розповідь і не додає невираженого в оригіналі протиставлення.
theological_decisions:
- issue: Мовчання Ісуса перед обвинувачами
  choice: 'Передати як простий факт розповіді: «він нічого не відповів»'
  alternative: 'Додати виразний натяк на виконання Ісаї 53 або перекласти тлумачно: «він не став виправдовуватися»'
  rationale: Вірш повідомляє про мовчання Ісуса, але прямо не називає його виконанням пророцтва й не пояснює мотивів, тому переклад не повинен додавати такого тлумачення.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська оповідна мова. Займенники щодо Ісуса подано з малої літери відповідно до загальних норм сучасної української орфографії; це не применшує поваги. Маркер примітки поставлено після вислову, якого вона стосується.
