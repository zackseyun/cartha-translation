  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὸ
  choice: Тому
  rationale: Передає висновковий зв’язок із попередньою розповіддю про купівлю та назву поля; природне й чітке в сучасній українській.
- source_word: ἐκλήθη
  choice: назвали … і так воно зветься
  rationale: Аорист пасивного стану означає, що поле отримало назву; у поєднанні з ἕως τῆς σήμερον розгорнута українська конструкція природно виражає як минуле надання назви, так і її подальше вживання.
- source_word: ὁ ἀγρὸς ἐκεῖνος
  choice: те поле
  rationale: Зберігає звичайне значення ἀγρός і вказівний зміст ἐκεῖνος, а також повтор слова в назві.
- source_word: Ἀγρὸς Αἵματος
  choice: Поле Крові
  rationale: Прозоро передає назву з родовим відмінком αἵματος і зберігає її зв’язок зі словом «поле» в першій частині речення.
- source_word: αἵματος
  choice: Крові
  rationale: Родовий відмінок однини від αἷμα; у складі власної назви передано з великої літери.
- source_word: ἕως τῆς σήμερον
  choice: донині
  rationale: 'Стислий і природний сучасний відповідник сталого часового вислову: назва залишалася в ужитку до часу оповідача.'
