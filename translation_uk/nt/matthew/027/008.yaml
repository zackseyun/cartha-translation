  source_fidelity: Текст точно передає висновкове διό («Тому»), вказівне «те поле», надання назви та її чинність до часу автора («донині»). Українська безособово-активна конструкція «назвали» є природним відповідником грецького аориста пасивного ἐκλήθη. Розгортання часової думки через «і так воно зветься донині» не змінює змісту, а ясно передає, що назва лишається в ужитку.
  naturalness: Фраза природна для сучасної стандартної української, лаконічна й відповідає оповідному регістру. «Полем Крові» граматично коректно узгоджено з дієсловом «назвали».
  terminology: «Поле Крові» прозоро відтворює Ἀγρὸς Αἵματος як власну назву й зберігає лексичний повтор зі словом «поле». Богословськи навантажених або спірних термінів немає.
