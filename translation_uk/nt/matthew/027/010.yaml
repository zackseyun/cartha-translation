lexical_decisions:
- source_word: ἔδωκαν
  choice: віддали
  rationale: Аорист активного стану від δίδωμι передано звичайним дієсловом «віддали»; у контексті йдеться про використання срібняків, але конкретніше «заплатили» було б тлумачним уточненням.
- source_word: αὐτὰ
  choice: їх
  rationale: Збережено множину займенника, що в контексті стосується срібняків.
- source_word: εἰς τὸν ἀγρὸν
  choice: за поле
  rationale: У контексті придбання εἰς природно передається українською конструкцією «віддати за поле», а не просторовим «у поле».
- source_word: τοῦ κεραμέως
  choice: гончаря
  rationale: Родовий відмінок природно утворює словосполучення «поле гончаря» без надмірного уточнення характеру належності.
- source_word: καθὰ
  choice: як
  rationale: Стисло й природно передає відповідність; «саме як» тут звучало б менш природно українською.
- source_word: συνέταξέν
  choice: звелів
  rationale: συντάσσω виражає владне розпорядження. «Звелів» є сучасним, гідним і природним відповідником, що не послаблює сили дієслова.
- source_word: μοι
  choice: мені
  rationale: Давальний відмінок грецького займенника прямо й природно збережено українським «мені».
- source_word: κύριος
  choice: Господь
  rationale: У цьому пророчому посиланні κύριος передано усталеним біблійним найменуванням «Господь».
theological_decisions:
- issue: Перша особа в пророчій цитаті/алюзії
  choice: Збережено «мені» відповідно до μοι.
  alternative: Узгодити особу з безпосередньою розповіддю або перефразувати без першої особи.
  rationale: Грецький текст виразно має μοι («мені»). Збереження першої особи не згладжує напруження між формою цитати та її оповідним контекстом.
translation_notes:
  register: Сучасна літературна українська мова з лаконічним, гідним біблійним звучанням. Порядок слів наближений до грецького, але конструкція «віддали їх за поле» природна для української. Маркер [b] поставлено біля фрагмента, якого стосується пояснення про цитату загалом, а [a] — безпосередньо після дієслівної фрази «звелів мені Господь».
