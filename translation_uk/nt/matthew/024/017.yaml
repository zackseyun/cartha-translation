lexical_decisions:
- source_word: ὁ ἐπὶ τοῦ δώματος
  choice: Хто буде на даху
  rationale: Артикльована конструкція вжита субстантивовано й означає особу, яка перебуває на даху. Українське «хто буде» природно передає узагальнений одиничний референт у контексті майбутнього застереження.
- source_word: δώματος
  choice: даху
  rationale: δώμα означає верхню частину будинку, зокрема плаский придатний до використання дах у давньому середземноморському житлі. Загальнозрозуміле «дах» потребує культурного уточнення в примітці.
- source_word: μὴ καταβάτω
  choice: нехай не спускається
  rationale: Заперечний імператив передано прямою й природною українською наказовою конструкцією; «спускається» зберігає рух униз із даху.
- source_word: ἆραι
  choice: взяти
  rationale: Інфінітив виражає мету спуску; «взяти» прямо передає αἴρω без додаткового припущення про винесення чи рятування майна.
- source_word: τὰ ἐκ τῆς οἰκίας αὐτοῦ
  choice: те, що в його домі
  rationale: Субстантивоване τὰ з ἐκ τῆς οἰκίας еліптично позначає речі з дому. Українська конструкція природна й зберігає невизначеність щодо того, які саме це речі.
- source_word: οἰκίας
  choice: домі
  rationale: У контексті йдеться про фізичне житло під дахом; «дім» є природним сучасним відповідником, не усуваючи конкретного просторового значення.
- source_word: αὐτοῦ
  choice: його
  rationale: Збережено чоловічий займенник однини, що відповідає граматичній формі грецького узагальненого вислову.
theological_decisions:
- issue: Узагальнене чоловіче позначення особи
  choice: Зберегти займенник однини чоловічого роду «його»
  alternative: Ужити гендерно нейтральну перебудову без присвійного займенника
  rationale: Грецький текст має узагальнений одиничний референт і чоловічий займенник, але не висуває богословського твердження про стать. Переклад зберігає форму джерела без надання їй додаткової доктринальної ваги.
translation_notes:
  register: Сучасна, проста й гідна українська мова. Наказова конструкція «нехай не спускається» передає терміновість вислову, а примітка пояснює давню архітектурну реалію.
