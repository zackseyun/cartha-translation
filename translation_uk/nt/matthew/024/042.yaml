id: MAT.24.42
reference: Matthew 24:42
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: γρηγορεῖτε οὖν, ὅτι οὐκ οἴδατε ποίᾳ ⸀ἡμέρᾳ ὁ κύριος ὑμῶν ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/042.yaml
  text: Therefore stay awake[c][b][a], because you do not know on what day your Lord is coming.
translation:
  language: uk
  text: Тож пильнуйте[a], бо ви не знаєте, якого дня прийде[b] ваш Господь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «не спіть» чи «будьте пильні».
    reason: lexical_alternative
  - marker: b
    text: Або «приходить». У грецькому тексті вжито форму теперішнього часу.
    reason: alternative_reading
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: пильнуйте
  rationale: Теперішній наказовий спосіб у множині закликає до постійної пильності. «Пильнуйте» природно передає і образ неспання, і значення уважного очікування.
- source_word: οὖν
  choice: тож
  rationale: Позначає висновок із попереднього повчання; «тож» стисло й природно виражає цей логічний зв’язок.
- source_word: ὅτι
  choice: бо
  rationale: Вводить причину наказу й звучить природно в сучасній українській мові.
- source_word: οὐκ οἴδατε
  choice: ви не знаєте
  rationale: Прямо передає заперечену форму дієслова «знати» без невиправданого уточнення.
- source_word: ποίᾳ ἡμέρᾳ
  choice: якого дня
  rationale: Природна українська часова конструкція, що зберігає невизначеність конкретного дня.
- source_word: ὁ κύριος ὑμῶν
  choice: ваш Господь
  rationale: Ідіоматично передає артикльоване κύριος із присвійним займенником і зберігає усталений новозавітний титул.
- source_word: ἔρχεται
  choice: прийде
  rationale: Український доконаний майбутній час природно передає есхатологічне наближення події; примітка фіксує теперішню часову форму грецького дієслова та можливість ближчого формального відтворення.
theological_decisions:
- issue: Есхатологічна сила теперішнього часу ἔρχεται
  choice: «прийде» в основному тексті
  alternative: «приходить»
  rationale: У цьому контексті українське «прийде» ясно й природно вказує на майбутню подію, не визначаючи її точного часу. Примітка зберігає напруження грецької теперішньої форми та її відтінок живого очікування.
translation_notes:
  register: Сучасна, стисла й гідна українська мова. «Пильнуйте» зберігає ключову метафору та заклик до тривалої готовності; порядок слів «прийде ваш Господь» природний і водночас близький до грецької структури.
