base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/002.yaml
  text: But he answered and said to them[a], “Do you not see all these things? Truly I tell you, not one stone here will be left upon another that will not be thrown down.”
translation:
  language: uk
  text: 'А Він відповів їм: «Хіба ви не бачите всього цього? Істинно кажу вам: не залишиться тут жодного каменя на іншому камені — кожен буде зруйнований».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «кожен буде розібраний». Грецьке дієслово може означати руйнування або розбирання споруди.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: А Він відповів їм
  rationale: Дієприкметник із особовою формою дієслова є звичним семітизованим зворотом. Українське «відповів» природно передає всю формулу без неприродного дублювання «відповів і сказав».
- source_word: Οὐ βλέπετε ταῦτα πάντα
  choice: Хіба ви не бачите всього цього?
  rationale: Питальна частка «хіба» природно передає риторичне запитання з οὐ, яке очікує ствердної відповіді; «всього цього» стосується щойно згаданих храмових споруд.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Істинно кажу вам
  rationale: «Істинно» зберігає урочисту й авторитетну силу формули Ісуса та є зрозумілим у сучасній українській біблійній мові.
- source_word: οὐ μὴ ἀφεθῇ ὧδε λίθος ἐπὶ λίθον
  choice: не залишиться тут каменя на камені
  rationale: Звичний український вислів точно відтворює образ повного розбирання; конструкція «не залишиться» разом із запереченням передає сильне οὐ μή.
- source_word: ὃς οὐ καταλυθήσεται
  choice: усе буде зруйноване
  rationale: Відносна конструкція буквально уточнює кожен камінь, який буде скинуто або розібрано. Українське узагальнення «усе» природно передає повноту руйнування, а «зруйноване» відповідає архітектурному контексту καταλύω.
theological_decisions:
- issue: Обсяг і сила Ісусового передречення про храм
  choice: Передано конкретне передречення повного фізичного руйнування споруд.
  alternative: Розуміти вислів насамперед символічно або прив’язати його до певної есхатологічної системи.
  rationale: Мова про каміння має конкретний архітектурний характер. Переклад зберігає цю силу, не додаючи доктринального тлумачення, якого сам вірш не висловлює.
translation_notes:
  register: Сучасна нормативна українська мова з гідним біблійним звучанням. Зайве семітське дублювання усунуто заради природності, а риторичність, урочиста формула та категоричність передречення збережені.
