  text: And let the one in the field not turn back to take his cloak[a].
translation:
  language: uk
  text: А хто в полі, нехай не повертається назад, щоб узяти свій плащ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «свій одяг» чи «свій верхній одяг».
