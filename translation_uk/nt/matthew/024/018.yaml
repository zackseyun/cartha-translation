lexical_decisions:
- source_word: ὁ ἐν τῷ ἀγρῷ
  choice: хто буде в полі
  rationale: Субстантивована конструкція позначає особу, яка перебуває в полі. Українське «хто буде в полі» природно передає узагальнений зміст без невиправданого звуження до чоловіків.
- source_word: μὴ ἐπιστρεψάτω ὀπίσω
  choice: нехай не повертається назад
  rationale: Аористовий імператив із μή виражає заборону, а ὀπίσω разом з ἐπιστρεψάτω має значення повернення назад. Конструкція «нехай не» зберігає наказовий характер.
- source_word: ἆραι
  choice: щоб узяти
  rationale: Інфінітив виражає мету повернення; «щоб узяти» природно й точно передає цей зв’язок.
- source_word: τὸ ἱμάτιον αὐτοῦ
  choice: свій плащ
  rationale: ἱμάτιον тут найімовірніше означає верхній одяг, накидку або плащ. Зворотний займенник «свій» природний українською, бо власник збігається з підметом.
theological_decisions:
- issue: Родове значення субстантивованого артикля чоловічого роду
  choice: хто буде в полі
  alternative: чоловік, який буде в полі
  rationale: Граматичний чоловічий рід у цьому застереженні має узагальнене значення. Переклад не обмежує адресатів лише чоловіками й водночас зберігає індивідуальну спрямованість вислову.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Формула «А хто буде в полі» природно продовжує низку застережень; «плащ» конкретизує найімовірніше значення ἱμάτιον, а примітка зберігає ширший лексичний діапазон.
