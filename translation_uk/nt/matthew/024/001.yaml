  text: Καὶ ἐξελθὼν ὁ Ἰησοῦς ⸂ἀπὸ τοῦ ἱεροῦ ἐπορεύετο⸃, καὶ προσῆλθον οἱ μαθηταὶ αὐτοῦ ἐπιδεῖξαι αὐτῷ τὰς οἰκοδομὰς τοῦ ἱεροῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/001.yaml
  text: And Jesus went out from the temple and was going away[a], and his disciples came to show him the buildings of the temple.
translation:
  language: uk
  text: Ісус вийшов із храму й відходив[a]. Тоді до Нього підійшли учні, щоб показати Йому храмові будівлі.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Грецьке ἱερόν означає весь храмовий комплекс або храмову територію, а не лише внутрішнє святилище.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: вийшов
  rationale: 'Аористовий дієприкметник передає дію, що передує основній: Ісус спочатку вийшов, а потім відходив. «Вийшов» природно зберігає значення спрямованого руху.'
- source_word: ἱεροῦ
  choice: храму
  rationale: Ἱερόν означає весь храмовий комплекс або храмову територію, а не лише внутрішнє святилище. У тексті вжито звичне «храм», а точніше значення пояснено в примітці.
- source_word: ἐπορεύετο
  choice: відходив
  rationale: Імперфект передає тривалий рух у процесі. «Відходив» зберігає цей вид і природно звучить українською.
- source_word: προσῆλθον
  choice: підійшли
  rationale: Дієслово означає наближення до когось; «підійшли» точніше й природніше за просте «прийшли» в цьому контексті.
- source_word: ἐπιδεῖξαι
  choice: щоб показати
  rationale: Інфінітив виражає мету приходу учнів. Конструкція «щоб показати» є природною сучасною українською.
- source_word: οἰκοδομὰς τοῦ ἱεροῦ
  choice: храмові будівлі
  rationale: Οἰκοδομαί тут означає споруди храмового комплексу. Прикметникова конструкція «храмові будівлі» стисло й ясно передає грецький родовий зворот.
theological_decisions:
- issue: Передача ἱερόν на відміну від ναός
  choice: храм
  alternative: храмовий комплекс; храмова територія
  rationale: У вірші стоїть ἱερόν, що охоплює весь храмовий комплекс, а не тільки внутрішнє святилище. Для читабельності в основному тексті залишено традиційне «храм», а ширше значення зафіксовано в примітці без нав’язування конфесійного тлумачення.
translation_notes:
  register: Сучасна стандартна українська; виклад природний і гідний. Імперфект ἐπορεύετο передано формою «відходив», а конструкцію οἰκοδομὰς τοῦ ἱεροῦ — природним словосполученням «храмові будівлі».
