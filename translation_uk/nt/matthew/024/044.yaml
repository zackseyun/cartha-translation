  text: διὰ τοῦτο καὶ ὑμεῖς γίνεσθε ἕτοιμοι, ὅτι ᾗ ⸂οὐ δοκεῖτε ὥρᾳ⸃ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/044.yaml
  text: For this reason[a], you also must be ready, because the Son of Man is coming at an hour you do not expect.
translation:
  language: uk
  text: Тому й ви будьте готові, бо Син Людський прийде в годину, коли ви не сподіваєтеся.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «в годину, коли ви не думаєте». Грецьке дієслово може означати «думати», «вважати», а в цьому контексті — «сподіватися» або «очікувати».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Тому
  rationale: Передає висновково-причиновий зв’язок із попереднім застереженням природною сучасною українською мовою.
- source_word: καὶ ὑμεῖς
  choice: й ви
  rationale: Зберігає включальний наголос καί та виразність окремого займенника ὑμεῖς без надмірного підсилення.
- source_word: γίνεσθε ἕτοιμοι
  choice: будьте готові
  rationale: Природно передає наказ бути в стані готовності; буквальне «ставайте готовими» тут могло б невиправдано наголосити лише на початку дії.
- source_word: ὅτι
  choice: бо
  rationale: У цьому контексті сполучник указує на причину наказу й стисло та природно передається як «бо».
- source_word: ᾗ οὐ δοκεῖτε ὥρᾳ
  choice: тієї години, якої ви не очікуєте
  rationale: Передає часовий зворот і контекстуальне значення δοκεῖτε як очікування, водночас у примітці збережено пряміше значення «думаєте».
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Син Людський
  rationale: Усталений буквальний український відповідник зберігає форму титулу, його семітське тло та можливий зв’язок із книгою Даниїла.
- source_word: ἔρχεται
  choice: прийде
  rationale: Грецький теперішній час тут має майбутню спрямованість; український доконаний майбутній природно передає майбутню подію, не створюючи враження звичайної повторюваної дії.
theological_decisions:
- issue: Передача христологічного титулу ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Син Людський
  alternative: Людський Син; Син Людини
  rationale: Усталена форма «Син Людський» зберігає титульність вислову та його біблійні перегуки, не зводячи його значення до пояснювального парафразу.
- issue: Часова форма ἔρχεται у вислові про прихід Сина Людського
  choice: прийде
  alternative: приходить; іде
  rationale: Контекст указує на майбутній прихід у невідому годину. Майбутня форма є природною українською передачею футурального теперішнього, не уточнюючи понад текст характер цього приходу.
translation_notes:
  register: Сучасна стандартна українська мова; стислий, гідний і зрозумілий біблійний стиль. Збережено традиційний титул «Син Людський», а синтаксис зроблено природним для широкого кола читачів.
