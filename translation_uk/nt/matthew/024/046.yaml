  text: μακάριος ὁ δοῦλος ἐκεῖνος ὃν ἐλθὼν ὁ κύριος αὐτοῦ εὑρήσει ⸂οὕτως ποιοῦντα⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/046.yaml
  text: Blessed is that servant whom his lord, when he comes, will find doing so.
translation:
  language: uk
  text: Блаженний той раб, якого його пан, прийшовши, застане, що він так чинить.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριος
  choice: Блаженний
  rationale: Усталений і гідний відповідник для проголошення схваленого, щасливого становища людини перед Богом.
- source_word: δοῦλος
  choice: раб
  rationale: Зберігає соціальну реалію та силу грецького слова; «слуга» могло б послабити значення залежності від пана.
- source_word: κύριος
  choice: пан
  rationale: У межах образу господарства природно позначає власника або господаря раба, не усуваючи можливого переносного значення притчі.
- source_word: οὕτως ποιοῦντα
  choice: за цим заняттям
  rationale: Природною українською передає «того, хто так чинить», відсилаючи до дорученої в попередньому контексті справи.
theological_decisions:
- issue: Переносне значення слова κύριος
  choice: пан
  alternative: Господь
  rationale: Безпосередньо це персонаж образу — пан раба. Переклад «пан» зберігає сюжетний рівень і не нав'язує прямого титулу, хоча читач може розпізнати богословське застосування.
translation_notes:
  register: Сучасна стандартна українська; лаконічний, гідний і природний синтаксис. Дієприкметникову конструкцію ἐλθών передано дієприслівником «прийшовши».
