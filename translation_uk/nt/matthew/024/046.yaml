    issue: «за цим заняттям» for οὕτως ποιοῦντα
    rationale: 'The phrase is less precise than the Greek: οὕτως means “thus/in this way” and ποιοῦντα denotes acting or doing, with contextual reference to the assigned conduct. «Заняття» can suggest a hobby or generic task and does not directly preserve the adverbial “thus.”'
