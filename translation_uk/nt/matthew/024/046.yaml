  verdict: revise
  source_fidelity: The draft correctly renders μακάριος, δοῦλος, κύριος in the household setting, and the temporal sense of ἐλθών (“прийшовши”). However, «за цим заняттям» narrows and recasts οὕτως ποιοῦντα (“doing/acting thus”) as an unspecified occupation. The Greek points back to the manner of conduct described in the preceding context, not merely to being occupied with an activity.
  naturalness: «Його пан, прийшовши, застане» is natural modern Ukrainian. Replacing «за цим заняттям» with a finite clause gives a more idiomatic and clear expression without adding interpretation.
  terminology: «Блаженний», «раб», and «пан» are appropriate. «Пан» properly retains the narrative-level sense of κύριος and does not prematurely turn it into the theological title «Господь».
