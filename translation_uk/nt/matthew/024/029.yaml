source:
  edition: SBLGNT
  text: Εὐθέως δὲ μετὰ τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων ὁ ἥλιος σκοτισθήσεται, καὶ ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς, καὶ οἱ ἀστέρες πεσοῦνται ἀπὸ τοῦ οὐρανοῦ, καὶ αἱ δυνάμεις τῶν οὐρανῶν σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/029.yaml
  text: But immediately after the tribulation of those days[a], the sun will be darkened, and the moon will not give its light, and the stars will fall from heaven[b], and the powers of the heavens will be shaken.
translation:
  language: uk
  text: А відразу після скорботи тих днів сонце потемніє, місяць не дасть свого світла, зорі впадуть із неба[a], і сили небес[b] захитаються.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «з небосхилу». Грецьке слово може означати як небо, так і видимий небосхил.'
    reason: lexical_alternative
  - marker: b
    text: Вислів «сили небес» може означати космічні сили, небесні тіла або небесні могутності; грецький вислів залишається широким.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐθέως δὲ
  choice: А відразу
  rationale: «Відразу» передає сильне часове значення Εὐθέως, а «А» природно позначає перехід із легким протиставленням, властивим δὲ.
- source_word: μετὰ τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων
  choice: після скорботи тих днів
  rationale: «Скорбота» передає тяжке лихо й страждання, позначені θλῖψις, а родовий зворот «тих днів» зберігає зв’язок із іменником у грецькому тексті.
- source_word: ὁ ἥλιος σκοτισθήσεται
  choice: сонце потемніє
  rationale: Природне українське майбутнє передає настання темряви; буквальніше пасивне «буде затемнене» звучало б менш природно та могло б надмірно акцентувати названого діяча.
- source_word: ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς
  choice: місяць не дасть свого світла
  rationale: 'Збережено образ і структуру вислову: місяць не дає належного йому світла.'
- source_word: οἱ ἀστέρες πεσοῦνται ἀπὸ τοῦ οὐρανοῦ
  choice: зорі впадуть із неба
  rationale: «Зорі» — природний сучасний відповідник ἀστέρες; «небо» зберігає широкий діапазон οὐρανός, який у цьому контексті може означати видиме небо або небесну сферу.
- source_word: αἱ δυνάμεις τῶν οὐρανῶν
  choice: сили небес
  rationale: Відносно буквальний вислів зберігає множину «небес» і не звужує δυνάμεις до ангельських істот, небесних тіл чи безособових космічних сил.
- source_word: σαλευθήσονται
  choice: захитаються
  rationale: «Захитаються» природно передає сильне приведення в рух або потрясіння, не визначаючи точного характеру цього космічного явища.
theological_decisions:
- issue: Характер космічних знамень в апокаліптичній мові
  choice: Передати образи прямо, не визначаючи, чи йдеться про буквальні астрономічні події, пророчо-символічну мову або їх поєднання.
  alternative: Витлумачити образи лише як буквальне руйнування космосу або лише як символ політичного й судового потрясіння.
  rationale: Грецький текст використовує пророчо-апокаліптичні образи, але сам у цьому вірші не пояснює спосіб їх здійснення; переклад має зберегти цю напругу.
- issue: Значення «сил небес»
  choice: Залишити широкий вислів «сили небес».
  alternative: Конкретизувати як ангельські сили, небесні тіла або космічні сили.
  rationale: Вислів αἱ δυνάμεις τῶν οὐρανῶν допускає кілька референтів, тому конкретизація в основному тексті була б тлумачним звуженням.
translation_notes:
  register: Сучасна, зрозуміла й урочиста українська мова. Збережено ритмічний ряд пророчих образів і повтор сполучника «і». «Сили небес» навмисно звучить ширше, ніж «небесні сили», яке могло б сильніше натякати на особових духовних істот.
