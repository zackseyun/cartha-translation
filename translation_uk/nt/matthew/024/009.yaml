id: MAT.24.9
reference: Matthew 24:9
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Τότε παραδώσουσιν ὑμᾶς εἰς θλῖψιν καὶ ἀποκτενοῦσιν ὑμᾶς, καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων τῶν ἐθνῶν διὰ τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/009.yaml
  text: Then they will hand you over to affliction and kill you[c][b][a], and you will be hated by all the nations because of my name.
translation:
  language: uk
  text: Тоді видадуть вас на муки[a] й уб’ють вас, і всі народи[b] ненавидітимуть вас через моє ім’я[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «на страждання», «на утиски» чи «на скорботу». Грецьке слово може означати тяжке страждання, гноблення або лихо й у цьому контексті може мати есхатологічний відтінок.
    reason: lexical_alternative
  - marker: b
    text: Або «усі племена»; менш імовірно в цьому контексті — «усі язичники» чи «всі неюдеї».
    reason: lexical_alternative
  - marker: c
    text: Буквально «через моє ім’я», тобто через відданість Ісусові й тому, що представляє його ім’я.
    reason: lexical_explanation
lexical_decisions:
- source_word: Τότε
  choice: Тоді
  rationale: Природний часовий прислівник, який зберігає послідовність подій у промові Ісуса.
- source_word: παραδώσουσιν ὑμᾶς
  choice: видадуть вас
  rationale: Передає віддання людей під чужу ворожу владу, не звужуючи значення до особистої зради.
- source_word: εἰς θλῖψιν
  choice: на муки
  rationale: Природне українське сполучення після «видадуть», яке передає тяжке страждання й утиски; ширший діапазон грецького слова зазначено у примітці.
- source_word: ἀποκτενοῦσιν ὑμᾶς
  choice: уб’ють вас
  rationale: Прямо й без додаткового морального відтінку передає майбутню дію та зберігає повтор займенника.
- source_word: ἔσεσθε μισούμενοι
  choice: ненавидітимуть вас
  rationale: Природний український відповідник грецької перифрастичної конструкції майбутнього пасивного значення.
- source_word: ὑπὸ πάντων τῶν ἐθνῶν
  choice: всі народи
  rationale: Передає всесвітній масштаб ворожості; контекст не вимагає звуження значення до неюдеїв.
- source_word: διὰ τὸ ὄνομά μου
  choice: через моє ім’я
  rationale: Зберігає причинне значення διά та біблійний образ імені, не замінюючи його пояснювальним переказом.
theological_decisions:
- issue: Значення θλῖψις в есхатологічній промові
  choice: муки
  alternative: страждання; утиски; скорбота; переслідування
  rationale: Основний текст природно передає тяжке випробування, а примітка зберігає широту слова та його можливий есхатологічний відтінок без нав’язування певної системи тлумачення.
- issue: Значення ἔθνη
  choice: народи
  alternative: язичники; неюдеї
  rationale: У цьому контексті вислів найприродніше вказує на загальний масштаб ненависті, а не обов’язково на етнічне протиставлення юдеїв і неюдеїв.
- issue: Значення вислову «через моє ім’я»
  choice: збережено образ імені
  alternative: через відданість мені
  rationale: Буквальний образ богословськи місткий і зрозумілий; його значення пояснено в примітці, а не підмінено в тексті.
translation_notes:
  register: Сучасна нормативна українська мова, зрозуміла широкому читачеві, зі стримано урочистим біблійним звучанням. Порядок слів природний для української; займенник «моє» подано з малої літери відповідно до сучасної нейтральної орфографічної практики.
