review_pass:
  verdict: approve
  source_fidelity: «Тоді видадуть вас на муки й уб’ють вас» точно передає послідовні майбутні дії παραδώσουσιν ... εἰς θλῖψιν καὶ ἀποκτενοῦσιν. «На муки» є прийнятним у цьому контексті відповідником θλῖψις, а примітка належно зберігає ширший спектр значень. «Всі народи ненавидітимуть вас» передає ὑπὸ πάντων τῶν ἐθνῶν без невиправданого звуження до неюдеїв. Причинове «через моє ім’я» точно відповідає διὰ τὸ ὄνομά μου.
  naturalness: Текст звучить природно сучасною нормативною українською, з доречним стримано-біблійним регістром. Повтор «вас» відтворює наголос і структуру оригіналу та не є стилістично обтяжливим.
  terminology: «Видадуть», «муки», «народи» й «ім’я» узгоджені з оригіналом та не нав’язують конфесійного тлумачення. Примітки коректно пояснюють лексичні можливості й есхатологічний відтінок без догматичного уточнення.
