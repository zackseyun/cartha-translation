  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου λέγοντες· Ἐγώ εἰμι ὁ χριστός, καὶ πολλοὺς πλανήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/005.yaml
  text: For many will come in my name[a], saying, ‘I am the Messiah,’ and they will lead many astray.
translation:
  language: uk
  text: 'Бо багато хто прийде під моїм ім’ям, кажучи: «Я — Месія»[a], — і багатьох введе в оману.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Я — Христос». Грецьке ὁ χριστός означає «Помазаник» і є титулом Месії.'
    reason: alternative_rendering
lexical_decisions:
- source_word: πολλοὶ
  choice: багато хто
  rationale: Природний український відповідник субстантивованого прикметника чоловічого роду, що означає багатьох людей.
- source_word: γὰρ
  choice: бо
  rationale: Зберігає пояснювальний зв’язок із попередньою пересторогою та природно звучить українською.
- source_word: ἐλεύσονται
  choice: прийде
  rationale: Форма однини граматично узгоджується з українським неозначено-кількісним підметом «багато хто», передаючи грецький майбутній час.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: під моїм ім’ям
  rationale: Передає появу з посиланням на ім’я та заявлену тотожність Ісусові; у цьому контексті точніше й природніше за двозначне «в моє ім’я».
- source_word: λέγοντες
  choice: кажучи
  rationale: Прямо відтворює дієприкметникову конструкцію без додавання оцінного відтінку слова «стверджуючи».
- source_word: Ἐγώ εἰμι ὁ χριστός
  choice: Я — Месія
  rationale: Χριστός ужито як титул особи, яка заявляє про свою месіанську тотожність; «Месія» ясно передає титулярне значення.
- source_word: πλανήσουσιν
  choice: введе в оману
  rationale: Природний сучасний український вислів, що передає спричинення помилки або обману.
- source_word: πολλοὺς
  choice: багатьох
  rationale: Лаконічно й точно відтворює субстантивований знахідний відмінок без зайвого додавання слова «людей».
theological_decisions:
- issue: Передача титулу Χριστός у заяві лжемесій
  choice: Месія
  alternative: Христос
  rationale: У вислові ὁ χριστός це титул — «Помазаник», а не власне ім’я; «Месія» природно показує зміст претензії. Варіант «Христос» подано в примітці для збереження традиційної відповідності грецькому титулу.
- issue: Значення ἐπὶ τῷ ὀνόματί μου
  choice: під моїм ім’ям
  alternative: в моє ім’я
  rationale: Контекст допускає відтінки посилання на авторитет Ісуса та привласнення його імені чи тотожності. «Під моїм ім’ям» не перетворює прихід ошуканців на позитивно санкціоновану Ісусом дію.
translation_notes:
  register: Сучасна нормативна українська, зрозуміла широкому колу читачів. Збережено пояснювальне «бо», пряму мову та урочисту, але не архаїчну тональність.
