  text: ἔσται γὰρ τότε θλῖψις μεγάλη οἵα οὐ γέγονεν ἀπ’ ἀρχῆς κόσμου ἕως τοῦ νῦν οὐδ’ οὐ μὴ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/021.yaml
  text: For then there will be great tribulation[a], such as has not happened from the beginning of the world until now, and never will happen again.
translation:
  language: uk
  text: Бо тоді буде велика скорбота[a], якої не було від початку світу аж дотепер і вже ніколи не буде.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «велике лихо», «велике страждання» чи «великий утиск». Грецьке слово може означати тяжкі обставини, страждання, тиск або пригноблення.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ τότε
  choice: Бо тоді
  rationale: «Бо» зберігає пояснювальний зв’язок γάρ із попереднім застереженням, а «тоді» прямо передає τότε.
- source_word: ἔσται
  choice: буде
  rationale: Природна українська конструкція з підметом «велика скорбота» точно передає майбутній час.
- source_word: θλῖψις μεγάλη
  choice: велика скорбота
  rationale: «Скорбота» передає тяжке лихо, утиск і страждання та зберігає есхатологічну вагу вислову без додавання вузького доктринального змісту; μεγάλη прямо передано словом «велика».
- source_word: οἵα
  choice: якої
  rationale: 'У сполученні «скорбота, якої не було» природно передає якісне порівняння: настільки тяжкої скорботи досі не було.'
- source_word: οὐ γέγονεν
  choice: не було
  rationale: Перфект γίνομαι тут описує безпрецедентність становища до теперішнього моменту; українське «не було» природно стосується названої «скорботи» й не послаблює подієвого змісту.
- source_word: ἀπ’ ἀρχῆς κόσμου
  choice: від початку світу
  rationale: Буквально й природно передає часовий вислів, не розгортаючи κόσμος у неявне «створення світу».
- source_word: ἕως τοῦ νῦν
  choice: аж дотепер
  rationale: Передає часову межу та підсилювальну силу контексту природною сучасною українською.
- source_word: οὐδ’ οὐ μὴ γένηται
  choice: і вже ніколи не буде
  rationale: «Ніколи не буде» передає емфатичне майбутнє заперечення οὐ μή; «вже» природно вказує, що така скорбота не повториться, не додаючи окремої події поза змістом порівняння.
theological_decisions:
- issue: Передача есхатологічно вагомого θλῖψις
  choice: скорбота
  alternative: лихо; страждання; утиск
  rationale: «Скорбота» є зрозумілим і усталеним біблійним відповідником, який охоплює тяжке страждання й утиск та зберігає богословську напругу контексту без уточнення конкретної есхатологічної схеми.
- issue: Абсолютність завершального заперечення
  choice: вже ніколи не буде
  alternative: і не станеться повік
  rationale: Формулювання зберігає сильне οὐ μή як категоричне заперечення майбутнього повторення, не визначаючи додатково природу чи тривалість описаної події.
translation_notes:
  register: Сучасна, dignified і доступна українська. Синтаксис стислий та природний; збережено пояснювальне «Бо», часову послідовність і сильне фінальне заперечення оригіналу.
