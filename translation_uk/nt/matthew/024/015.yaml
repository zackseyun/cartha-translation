base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/015.yaml
  text: So when you see the abomination of desolation spoken of through Daniel the prophet standing in a holy place—let the reader understand—[a][b]
translation:
  language: uk
  text: Отже, коли побачите гидоту спустошення[b], про яку було сказано через пророка Даниїла, що стоїть на святому місці[a], — нехай читач зрозуміє.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «у святому місці»; вислів може стосуватися конкретного святого місця.'
    reason: alternative_reading
  - marker: b
    text: Вислів «гидота спустошення» можна також передати як «гидота, що спустошує» або «гидота, яка спричиняє спустошення»; це відлуння книги Даниїла.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: Отже, коли
  rationale: Передає часову майбутню умову та зв’язок-висновок із попередньою промовою природною сучасною українською.
- source_word: ἴδητε
  choice: побачите
  rationale: Прямо передає аорист кон’юнктива ὁράω у часовому реченні.
- source_word: τὸ βδέλυγμα τῆς ἐρημώσεως
  choice: гидоту спустошення
  rationale: Зберігає грецьку родову конструкцію та впізнаваний зв’язок із книгою Даниїла, не визначаючи наперед, чи йдеться про те, що спричиняє спустошення, чи пов’язане з ним інакше.
- source_word: τὸ ῥηθὲν διὰ Δανιὴλ τοῦ προφήτου
  choice: про яку було сказано через пророка Даниїла
  rationale: Відносна конструкція природна українською; «через» зберігає посередницьке значення διά з родовим відмінком.
- source_word: ἑστὸς
  choice: що стоїть
  rationale: Безпосередньо передає перфектний дієприкметник ἵστημι та не додає тлумачення на зразок «встановлена».
- source_word: ἐν τόπῳ ἁγίῳ
  choice: на святому місці
  rationale: Українське «на місці» є природним відповідником просторового виразу; відсутність артикля передано без вказівного уточнення, не звужуючи вислів однозначно до конкретної частини храму.
- source_word: ὁ ἀναγινώσκων νοείτω
  choice: нехай читач зрозуміє
  rationale: Стисло й природно передає субстантивований дієприкметник та імператив третьої особи.
theological_decisions:
- issue: Визначеність τόπῳ ἁγίῳ та можливе вузько храмове значення
  choice: на святому місці
  alternative: на тому святому місці; у Святому місці
  rationale: Грецький вислів без артикля не вимагає ототожнення з конкретною храмовою зоною, хоча контекст може її мати на увазі. Основний текст зберігає ширшу форму, а примітка подає традиційніше вузьке прочитання.
- issue: Значення родового звороту βδέλυγμα τῆς ἐρημώσεως
  choice: гидота спустошення
  alternative: гидота, що спустошує; гидота, яка спричиняє спустошення
  rationale: Формальне відтворення зберігає відлуння Даниїла та справжню неоднозначність родового зв’язку, не перетворюючи можливе тлумачення на основний текст.
translation_notes:
  register: Сучасна стандартна українська, урочиста, але зрозуміла. Збережено пророчий тон, вставний заклик до читача та інтертекстуальну неоднозначність вислову з книги Даниїла.
