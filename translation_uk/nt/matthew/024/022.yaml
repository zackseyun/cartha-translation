  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: καὶ εἰ μὴ ἐκολοβώθησαν αἱ ἡμέραι ἐκεῖναι, οὐκ ἂν ἐσώθη πᾶσα σάρξ· διὰ δὲ τοὺς ἐκλεκτοὺς κολοβωθήσονται αἱ ἡμέραι ἐκεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/022.yaml
  text: And if those days had not been cut short[a], no flesh would have been saved; but for the sake of the elect[b], those days will be cut short.
translation:
  language: uk
  text: І якби ті дні не були скорочені[a], не врятувалася б жодна людина[b]; але заради обраних ті дні будуть скорочені.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «не були вкорочені… будуть вкорочені». Грецьке дієслово означає скоротити або урізати тривалість.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не врятувалася б усяка плоть». У заперечній конструкції цей біблійний вислів означає, що не врятувалася б жодна людина.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκολοβώθησαν / κολοβωθήσονται
  choice: не були скорочені / будуть скорочені
  rationale: Дієслово κολοβόω означає скорочувати або урізати. «Скорочені» природно передає зменшення тривалості днів і зберігає пасивну форму грецького тексту.
- source_word: οὐκ ἂν ἐσώθη
  choice: не врятувалася б
  rationale: Конструкція виражає нереальний наслідок у минулому. «Врятувалася б» зберігає значення σῴζω та в цьому контексті допускає безпосередній смисл збереження життя, не звужуючи його до простого «вижила б».
- source_word: πᾶσα σάρξ
  choice: жодна людина
  rationale: У заперечному реченні біблійний вислів «усяка плоть» означає всіх людей; сучасне українське «жодна людина» ясно й природно передає цей зміст. Буквальний образ зазначено у примітці.
- source_word: διὰ δὲ τοὺς ἐκλεκτούς
  choice: але заради обраних
  rationale: διά зі знахідним відмінком тут указує на підставу або дію на чиєсь благо. «Заради» передає цей відтінок, а «обрані» точно відтворює ἐκλεκτοί без додаткового тлумачення їхньої тотожності.
- source_word: αἱ ἡμέραι ἐκεῖναι
  choice: ті дні
  rationale: Прямий і природний відповідник, що зберігає вказівне значення ἐκεῖναι.
- source_word: καὶ εἰ μὴ
  choice: І якби ... не
  rationale: Так збережено виразну умовну побудову оригіналу та її зв’язок із попереднім контекстом.
theological_decisions:
- issue: Значення «обраних» в есхатологічній промові
  choice: Залишити назву «обрані» без пояснювального розширення.
  alternative: Божий обраний народ; віруючі; вірний останок.
  rationale: Сам вірш називає групу οἱ ἐκλεκτοί, але тут не визначає її повного богословського обсягу. Формулювання «обрані» не вирішує за текст дискусію про те, кого саме мають на увазі.
- issue: Значення σῴζω в контексті
  choice: Передати як «врятуватися», залишивши контекстові вказувати на фізичне збереження життя.
  alternative: Вижити; залишитися живим; спастися.
  rationale: Контекст безпосередньо стосується пережиття лихоліття, проте «вижити» надмірно звузило б семантичний діапазон σῴζω. «Врятуватися» природне в сучасній українській та не нав’язує суто духовного прочитання.
translation_notes:
  register: Сучасна літературна українська, урочиста, але зрозуміла. Пасивні форми збережено відповідно до грецького тексту; «обрані» залишено без конфесійного уточнення.
