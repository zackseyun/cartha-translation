    reason: textual_variant
lexical_decisions:
- source_word: Περὶ δὲ
  choice: А про
  rationale: Прийменник περί з родовим відмінком вводить тему, а δέ позначає перехід із легким протиставленням. «А про» природно передає обидві функції сучасною українською.
- source_word: τῆς ἡμέρας ἐκείνης καὶ ὥρας
  choice: той день і годину
  rationale: Обидва іменники залежать від περί; один вказівний займенник стосується координованої словосполуки загалом. Українська конструкція не потребує повторення «ту» перед «годину».
- source_word: οὐδεὶς οἶδεν
  choice: ніхто не знає
  rationale: οὐδείς виражає загальне заперечення, а οἶδα тут має теперішнє значення «знати». Це точний і природний український відповідник.
- source_word: οὐδὲ οἱ ἄγγελοι τῶν οὐρανῶν
  choice: ні ангели небесні
  rationale: У низці після «ніхто не знає» повторюване «ні» природно передає додатковий заперечний елемент. «Ангели небесні» ідіоматично відтворює родовий τῶν οὐρανῶν.
- source_word: οὐδὲ ὁ υἱός
  choice: ні Син
  rationale: Фраза координована з попереднім заперечним елементом. «Ні Син» зберігає пряме твердження джерельного тексту; велика літера передає вживання слова як усталеного титулу.
- source_word: εἰ μὴ
  choice: а тільки
  rationale: Після заперечного твердження εἰ μή вводить виняток. «А тільки» природно українською передає значення «крім / за винятком» і готує наголос на єдиному суб’єкті.
- source_word: ὁ πατὴρ μόνος
  choice: Отець
  rationale: У конструкції «а тільки Отець» обмежувальне μόνος уже передане словом «тільки». «Отець» ужито як божественний титул і написано з великої літери.
theological_decisions:
- issue: Христологічний зміст вислову «ні Син»
  choice: Зберегти «ні Син» в основному тексті без пом’якшення чи пояснювального доповнення.
  alternative: Оминути цей вислів відповідно до частини рукописної традиції або перефразувати його, щоб послабити богословську напругу.
  rationale: SBLGNT містить οὐδὲ ὁ υἱός. Переклад прямо відтворює свідчення обраного грецького тексту й не розв’язує закладеної в ньому богословської напруги.
translation_notes:
  register: Сучасна стандартна українська; виклад стислий, гідний і зрозумілий. Тире допомагають виразно оформити перелік та виняток, не додаючи тлумачення.
