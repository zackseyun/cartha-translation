  text: But concerning that day and hour[a], no one knows—not even the angels of heaven, nor the Son—except the Father alone.
translation:
  language: uk
  text: А про той день і годину[a] ніхто не знає — ні ангели небесні, ні Син, — а тільки Отець.
  philosophy: optimal-equivalence
  footnotes:
