  text: καὶ ἀποστελεῖ τοὺς ἀγγέλους αὐτοῦ μετὰ ⸀σάλπιγγος μεγάλης, καὶ ἐπισυνάξουσιν τοὺς ἐκλεκτοὺς αὐτοῦ ἐκ τῶν τεσσάρων ἀνέμων ἀπ’ ἄκρων οὐρανῶν ἕως ⸀τῶν ἄκρων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/031.yaml
  text: And he will send out his angels with a loud trumpet[a], and they will gather his chosen ones from the four winds[d][c][b], from one end of the heavens to the other.
translation:
  language: uk
  text: І Він пошле Своїх ангелів із гучним звуком сурми[a], і вони зберуть Його обраних[b] від чотирьох вітрів[c] — від одного краю небес до другого[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «з великою сурмою» чи «під гучний звук сурми».'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «Його вибраних».'
    reason: lexical_alternative
  - marker: c
    text: Вислів «чотири вітри» означає всі напрямки, тобто найвіддаленіші місця звідусіль.
    reason: cultural_note
  - marker: d
    text: 'Буквально грецькою: «від країв небес до їхніх країв»; ідеться про простір від одного крайнього краю до іншого.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: пошле
  rationale: Майбутній час дієслова ἀποστέλλω передає посилання з дорученням; природне українське «пошле» не перевантажує вислів канцелярським відтінком.
- source_word: ἀγγέλους
  choice: ангелів
  rationale: В есхатологічному контексті йдеться про небесних істот, тому «ангелів» точніше за загальне «посланців».
- source_word: μετὰ σάλπιγγος μεγάλης
  choice: із гучним звуком сурми
  rationale: μετά з родовим відмінком виражає супровід; σάλπιγξ означає сурму, а μεγάλη тут природно передає силу її звучання. Додавання «звуком» робить український вислів ясним, не усуваючи образу сурми.
- source_word: ἐπισυνάξουσιν
  choice: зберуть
  rationale: Майбутній час множини, підметом є ангели. Українське «зберуть» достатньо передає значення зібрання докупи.
- source_word: ἐκλεκτούς
  choice: обраних
  rationale: «Обраних» є зрозумілим сучасним відповідником і зберігає пасивний зміст тих, кого обрано, не нав’язуючи докладної богословської системи.
- source_word: ἐκ τῶν τεσσάρων ἀνέμων
  choice: від чотирьох вітрів
  rationale: Збережено біблійний образ чотирьох вітрів, який охоплює всі напрямки, замість його заміни тлумачним висловом.
- source_word: ἀπ’ ἄκρων οὐρανῶν ἕως τῶν ἄκρων αὐτῶν
  choice: від одного краю небес до другого
  rationale: Природний український меризм передає повний просторовий обсяг; множину οὐρανῶν збережено словом «небес».
theological_decisions:
- issue: Передача ἐκλεκτούς в есхатологічному контексті
  choice: обраних
  alternative: вибраних
  rationale: Текст називає тих, кого зберуть ангели, але не розгортає систематичного вчення про обрання. «Обраних» зберігає лексичний зміст без додаткового доктринального уточнення.
- issue: Просторовий обсяг зібрання
  choice: від чотирьох вітрів — від одного краю небес до другого
  alternative: з усіх чотирьох сторін світу
  rationale: Основний текст зберігає космічну образність і паралельні просторові вислови грецького джерела, не звужуючи їх до суто земної географії.
translation_notes:
  register: Сучасна літературна українська, урочиста, але загальнозрозуміла. Збережено біблійні образи «сурми», «чотирьох вітрів» і «небес». Велика літера в займенниках щодо Ісуса є редакційним виявом пошани, а не зміною змісту.
