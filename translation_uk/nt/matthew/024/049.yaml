lexical_decisions:
- source_word: ἄρξηται τύπτειν
  choice: почне бити
  rationale: Конструкція з ἄρξηται та інфінітивом передає початок дії; «почне бити» природно зберігає також можливий повторюваний характер насильства.
- source_word: τοὺς συνδούλους αὐτοῦ
  choice: інших рабів свого пана
  rationale: Сύνδουλος означає раба, який належить тому самому панові. Українське «інших рабів свого пана» природніше за буквальне «співрабів» і виразно передає їхній спільний підлеглий статус. Займенник αὐτοῦ граматично може стосуватися самого злого раба, однак зміст відношення σύνδουλος передбачає спільного пана.
- source_word: ἐσθίῃ δὲ καὶ πίνῃ
  choice: а сам їстиме й питиме
  rationale: Теперішні форми змальовують тривалу або характерну поведінку. «А сам» природно передає легкий контраст δέ між жорстокістю до інших і його власним гулянням.
- source_word: μετὰ τῶν μεθυόντων
  choice: з п’яницями
  rationale: Теперішній дієприкметник позначає людей, для яких характерне пияцтво або які напиваються; «п’яниці» стисло й природно передає це значення.
theological_decisions:
- issue: Передача соціального статусу в σύνδουλος
  choice: інших рабів свого пана
  alternative: своїх співслуг; інших слуг того самого пана
  rationale: «Рабів» зберігає реальність повної підлеглості одному панові, важливу для образу притчі, але не додає конфесійного тлумачення. Розгорнута конструкція передає компонент σύν- («разом, спільно») без неприродного слова «співраби».
- issue: Характер μεθυόντων
  choice: п’яницями
  alternative: з тими, хто напивається; з п’яними
  rationale: Вислів може вказувати не лише на стан сп’яніння в певну мить, а й на характерну поведінку. «П’яницями» передає це, тоді як примітка зберігає дієслівну альтернативу.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Майбутній час узгоджено з умовно-майбутньою розповіддю контексту; «а сам» робить природним слабкий контраст δέ. Апостроф і милозвучне «й» відповідають сучасному правопису.
