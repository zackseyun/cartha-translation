  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: καὶ πολλοὶ ψευδοπροφῆται ἐγερθήσονται καὶ πλανήσουσιν πολλούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/011.yaml
  text: And many false prophets will arise and will lead many astray[a][b].
translation:
  language: uk
  text: І постане багато лжепророків, і вони зведуть багатьох[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «введуть багатьох в оману».'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «буде піднято багато лжепророків».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: багато
  rationale: Природний український відповідник кількісного прикметника; у сполученні з родовим відмінком передає значення «many» без перебільшення.
- source_word: ψευδοπροφῆται
  choice: лжепророків
  rationale: Усталений біблійний відповідник складного іменника на позначення несправжніх або оманливих пророків.
- source_word: ἐγερθήσονται
  choice: постане
  rationale: У цьому контексті дієслово означає появу або виступ таких осіб; «постане» природно передає подієвий зміст, не нав’язуючи значення воскресіння.
- source_word: πλανήσουσιν
  choice: зведуть
  rationale: «Звести» в українській біблійній мові означає ввести в оману й водночас зберігає образ відхилення від правильного шляху.
- source_word: πολλούς
  choice: багатьох
  rationale: Прямий додаток із субстантивованим значенням «багатьох людей»; українською природно залишити іменник невираженим.
- source_word: καὶ ... καὶ
  choice: І ... і
  rationale: Повторений сполучник прямо відтворює координацію та послідовне нагромадження двох майбутніх дій.
theological_decisions:
- issue: Характер омани, вираженої πλανήσουσιν
  choice: Лжепророки зведуть багатьох, без уточнення способу чи повноти цієї омани.
  alternative: Омана є передусім доктринальною, моральною або есхатологічною.
  rationale: Грецьке πλανάω має широкий зміст і може стосуватися різних форм духовного введення в оману; переклад не звужує його до однієї богословської категорії.
- issue: Значення пасивної форми ἐγερθήσονται
  choice: Передано контекстуально як «постане», тобто з’явиться або виступить.
  alternative: «буде піднято» — формальніше відтворення пасивної форми, яке може припускати зовнішнього діяча.
  rationale: Контекст підтримує ідіоматичне значення появи, але пасивну можливість збережено у примітці, щоб не усувати справжню граматичну неоднозначність.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська біблійна мова. «Лжепророки» та «зведуть» зберігають біблійний резонанс, не звужуючи зміст. Обидва маркери приміток розміщено в основному тексті.
