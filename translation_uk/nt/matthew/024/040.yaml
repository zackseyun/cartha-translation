  verdict: approve
  source_fidelity: Текст точно передає τότε, майбутнє ἔσονται, місцевий зворот ἐν τῷ ἀγρῷ і протиставлення εἷς ... εἷς. Неозначено-особові форми «візьмуть / залишать» є природним українським відповідником грецьких пасивів і не додають названого діяча. «Двоє чоловіків» обґрунтовано відбиває чоловічі форми εἷς та контраст із жіночою сценою наступного вірша, хоча саме δύο лексично не містить слова «чоловіки».
  naturalness: 'Фраза «Тоді двоє чоловіків будуть у полі: одного візьмуть, а другого залишать» нормативна, ясна й природна для сучасної стандартної української. Двокрапка доречно вводить пояснювально-паралельний наслідковий опис.'
  terminology: «Візьмуть» слушно залишає семантику παραλαμβάνεται нейтральною щодо порятунку чи суду; «залишать» точно передає ἀφίεται без зайвих конотацій «залишити позаду» або «покинути». Примітка коректно подає можливе «візьмуть із собою» і належно зберігає богословську неоднозначність.
