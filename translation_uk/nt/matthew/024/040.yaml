  text: τότε ⸂δύο ἔσονται⸃ ἐν τῷ ἀγρῷ, ⸀εἷς παραλαμβάνεται καὶ ⸁εἷς ἀφίεται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/040.yaml
  text: Then two men will be in the field; one is taken and one is left.
translation:
  language: uk
  text: 'Тоді двоє чоловіків будуть у полі: одного візьмуть[a], а другого залишать.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «одного візьмуть із собою». Саме дієслово не уточнює, чи це взяття для порятунку, чи для суду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Тоді
  rationale: Природний часовий прислівник, що пов’язує вислів із попереднім есхатологічним контекстом.
- source_word: δύο ἔσονται
  choice: двоє чоловіків будуть
  rationale: Числівник має чоловічу особову форму в цьому контексті, а подальше εἷς ... εἷς також чоловічого роду; «двоє чоловіків» природно й точно передає чоловічих учасників сцени, особливо з огляду на жіночу паралель у наступному вірші.
- source_word: ἐν τῷ ἀγρῷ
  choice: у полі
  rationale: Пряме й природне відтворення місцевого звороту без доданої образності.
- source_word: εἷς ... εἷς
  choice: одного ... другого
  rationale: Українська протиставна конструкція природно розрізняє двох учасників і зберігає чоловічий рід грецьких форм.
- source_word: παραλαμβάνεται
  choice: візьмуть
  rationale: Неозначено-особова форма природно передає грецький пасив і зберігає невизначеним діяча. Дієслово не уточнює саме по собі, чи йдеться про порятунок, чи про суд.
- source_word: ἀφίεται
  choice: залишать
  rationale: Природне неозначено-особове відтворення пасива; «залишать позаду» могло б внести небажані сучасні есхатологічні асоціації, а «покинуть» надмірно посилило б значення.
theological_decisions:
- issue: Чи означає παραλαμβάνεται взяття для порятунку або для суду
  choice: Зберегти нейтральне «візьмуть» у головному тексті
  alternative: «заберуть на суд» або «візьмуть із собою для порятунку»
  rationale: Саме дієслово та найближчий контекст допускають дискусію; переклад не повинен вирішувати цю богословську напругу на користь певної есхатологічної системи.
- issue: Чи слід явно позначити чоловічих учасників
  choice: «двоє чоловіків»
  alternative: «двоє»
  rationale: Хоча δύο лексично означає «двоє/два», подальші форми εἷς ... εἷς чоловічого роду й жіноча паралель у наступному вірші підтримують явне позначення чоловіків.
translation_notes:
  register: Сучасна стандартна українська; стислий, гідний і загальнозрозумілий виклад. Паралельні неозначено-особові форми «візьмуть / залишать» природно передають грецькі пасиви та не називають діяча.
