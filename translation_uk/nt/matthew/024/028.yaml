  text: ⸀ὅπου ἐὰν ᾖ τὸ πτῶμα, ἐκεῖ συναχθήσονται οἱ ἀετοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/028.yaml
  text: Wherever the corpse is[a], there the vultures will gather.
translation:
  language: uk
  text: Де б не було мертвого тіла, там зберуться стерв’ятники.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «орли». Грецьке слово може означати орлів, але в образі птахів, що збираються біля мертвого тіла, «стерв’ятники» є контекстуально природнішим відповідником.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν ᾖ
  choice: Де буде
  rationale: Сполука ὅπου з ἐάν і кон’юнктивом виражає невизначене місце. Українське «де буде» природно передає цей узагальнений зміст у формі прислів’я.
- source_word: πτῶμα
  choice: мертве тіло
  rationale: πτῶμα означає тіло померлого. «Мертве тіло» — точний, зрозумілий і стилістично природний відповідник; «труп» тут звучав би різкіше, а «падло» звузило б образ до тварини.
- source_word: συναχθήσονται
  choice: зберуться
  rationale: 'Форма є майбутнім пасивом, але в цьому контексті природно має неперехідний зміст: птахи зберуться в одному місці. Буквальне «будуть зібрані» могло б невиправдано натякати на зовнішнього діяча.'
- source_word: ἀετοί
  choice: стерв’ятники
  rationale: ἀετός часто означає орла, однак образ птахів, що збираються біля мертвого тіла, найприродніше вказує на стерв’ятників. Лексичну можливість «орли» збережено в примітці.
theological_decisions:
- issue: Тлумачення образу прислів’я
  choice: Передати образ без пояснення його есхатологічного відповідника.
  alternative: Витлумачити його як неминучість суду, явність приходу Сина Людського або як натяк на зруйнування Єрусалима чи римські знамена.
  rationale: Грецький текст не пояснює, що саме символізують мертве тіло й птахи. Тому переклад має зберігати образ і його богословську напругу, не нав’язуючи одного тлумачення.
translation_notes:
  register: Сучасна стандартна українська; лаконічна, гідна форма прислів’я. «Стерв’ятники» є звичним нейтральним найменуванням падальників, а «мертве тіло» не визначає, йдеться про людину чи тварину.
