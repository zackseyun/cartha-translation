lexical_decisions:
- source_word: δὲ
  choice: А
  rationale: У цьому контексті δέ позначає м’яке протиставлення попереднім застереженням; українське «А» природно передає цей перехід.
- source_word: ὁ ... ὑπομείνας
  choice: хто витримає
  rationale: Артикль із субстантивованим аористовим дієприкметником означає особу, яка виявить витривалість. Конструкція «хто витримає» природна українською, не уточнює статі й передає цілісне витримування випробування.
- source_word: εἰς τέλος
  choice: до кінця
  rationale: Прийменниковий вислів указує на тривання аж до кінцевої межі; «до кінця» стисло й точно це передає.
- source_word: οὗτος
  choice: той
  rationale: Вказівний займенник підхоплює попередню конструкцію та надає їй наголосу; українська співвідносна конструкція «хто..., той...» зберігає цю функцію природно.
- source_word: σωθήσεται
  choice: буде спасенний
  rationale: Майбутня пасивна форма σῴζω може означати як спасіння, так і визволення. «Буде спасенний» зберігає ширший есхатологічний зміст, не звужуючи його до тимчасового порятунку.
theological_decisions:
- issue: Значення σωθήσεται в контексті витривалості до кінця
  choice: Збережено широке формулювання «буде спасенний».
  alternative: «Буде визволений» або конкретизація як остаточного вічного спасіння.
  rationale: Сам вірш не визначає однозначно, чи йдеться про остаточне есхатологічне спасіння, визволення під час лиха, чи обидва аспекти; переклад не усуває цієї напруги.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Співвідносна конструкція «хто..., той...» природно відтворює субстантивований дієприкметник та емфатичне οὗτος. «Спасенний» ужито в усталеному біблійному значенні без конфесійного уточнення.
