  text: ἀμὴν λέγω ὑμῖν ⸀ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη ἕως ἂν πάντα ταῦτα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/034.yaml
  text: Truly I tell you that this generation will certainly not pass away until all these things happen[a].
translation:
  language: uk
  text: 'Істинно кажу вам: це покоління в жодному разі не мине, доки все це не станеться.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «цей народ» чи «цей рід». Грецьке слово може мати ширше значення, однак «покоління» тут є найпрямішим відповідником.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: Істинно
  rationale: У формулі ἀμὴν λέγω ὑμῖν слово виражає урочисте запевнення; «істинно» природно й гідно передає його силу українською.
- source_word: λέγω ὑμῖν
  choice: кажу вам
  rationale: Прямий і природний відповідник формули звернення, який зберігає теперішній час і адресатів у множині.
- source_word: ὅτι
  choice: двокрапка
  rationale: Українська двокрапка природно вводить зміст урочистої заяви; окреме «що» тут не потрібне.
- source_word: οὐ μὴ παρέλθῃ
  choice: точно не мине
  rationale: Подвійне заперечення з аористом кон’юнктива має підсилену силу. «Точно не мине» передає категоричність сучасною зрозумілою українською, не додаючи значення абсолютного «ніколи».
- source_word: ἡ γενεὰ αὕτη
  choice: це покоління
  rationale: Найпряміший і звичайний у цьому контексті відповідник γενεά; він зберігає дискусійну есхатологічну напругу без тлумачного уточнення.
- source_word: ἕως ἂν
  choice: доки
  rationale: Природно передає часову межу з відтінком майбутньої обставини.
- source_word: πάντα ταῦτα
  choice: все це
  rationale: Природний український відповідник середнього роду множини, що сукупно вказує на названі події.
- source_word: γένηται
  choice: станеться
  rationale: У контексті подій γίνομαι означає їх настання; «станеться» є стислим і сучасним відповідником.
theological_decisions:
- issue: Значення вислову ἡ γενεὰ αὕτη в есхатологічній промові
  choice: це покоління
  alternative: цей народ; цей рід
  rationale: Основний текст передає найпряміше лексичне значення і не визначає наперед, кого саме охоплює вислів у межах есхатологічної схеми. Ширші можливі значення зазначено у примітці, щоб не усувати справжню неоднозначність.
translation_notes:
  register: Сучасна стандартна українська; урочистий, але зрозумілий регістр. Формулу запевнення передано традиційним «Істинно кажу вам», тоді як решту речення сформульовано природно, без архаїзмів і без нав’язування певної есхатологічної системи.
