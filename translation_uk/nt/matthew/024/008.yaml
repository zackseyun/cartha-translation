lexical_decisions:
- source_word: πάντα … ταῦτα
  choice: все це
  rationale: Природний український відповідник цілісного грецького звороту, який охоплює всі щойно згадані події.
- source_word: δὲ
  choice: Але
  rationale: 'Передає легке протиставлення: названі події ще не є кінцем, а лише початком.'
- source_word: ἀρχὴ
  choice: початок
  rationale: Точно передає значення першої стадії або початкової фази подальших подій.
- source_word: ὠδίνων
  choice: родових мук
  rationale: Зберігає виразний образ болю під час пологів і природно звучить сучасною українською.
theological_decisions:
- issue: Метафоричне значення ὠδίνων
  choice: Збережено метафору пологів у вислові «родових мук».
  alternative: «страждань», «лиха», «болю пологів»
  rationale: Грецький текст описує попередні потрясіння як початкову стадію болісного процесу, не ототожнюючи їх із самим кінцем і не уточнюючи певної есхатологічної схеми.
