id: MAT.24.23
reference: Matthew 24:23
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: τότε ἐάν τις ὑμῖν εἴπῃ· Ἰδοὺ ὧδε ὁ χριστός, ἤ· Ὧδε, μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/023.yaml
  text: Then if anyone says to you[a], ‘Look, here is the Messiah!’ or[b], ‘There he is!’ do not believe it.
translation:
  language: uk
  text: 'Тоді, якщо хтось скаже вам: «Ось тут Месія!» — або: «Ось він тут!» — не вірте.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Тоді
  rationale: Стислий часовий прислівник, що пов’язує застереження з попереднім есхатологічним викладом.
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: якщо хтось скаже вам
  rationale: Природно передає умовну конструкцію з неозначеним суб’єктом, не звужуючи кола можливих мовців.
- source_word: Ἰδοὺ
  choice: Ось
  rationale: Сучасний природний український вказівно-спонукальний відповідник, доречний у вигуку про місцеперебування.
- source_word: ὧδε
  choice: тут
  rationale: Безпосередньо передає прислівник місця в обох висловах.
- source_word: ὁ χριστός
  choice: Месія
  rationale: У контексті заяв про тотожність очікуваного Помазаника слово функціонує як титул; «Месія» ясно передає це значення сучасною українською.
- source_word: ἤ· Ὧδε
  choice: 'або: «Ось він тут!»'
  rationale: Грецький вислів еліптичний; займенник і зв’язка, природно відновлені українською, роблять репліку зрозумілою, а «тут» зберігає просторове значення ὧδε без заміни його на «там».
- source_word: μὴ πιστεύσητε
  choice: не вірте
  rationale: Природна українська заборона; об’єкт віри зрозумілий із наведених тверджень, тому його не потрібно додавати.
theological_decisions:
- issue: Передача Χριστός
  choice: Месія
  alternative: Христос / Помазаник
  rationale: Артикль і контекст хибних заяв про особу та місцеперебування очікуваного визволителя вказують на титульне значення. «Месія» зберігає його, не перетворюючи титул на власне ім’я.
- issue: Еліпсис у другій заяві Ὧδε
  choice: Ось він тут!
  alternative: Ось тут!
  rationale: Українською доречно відновити мається на увазі суб’єкт, не усуваючи властивої оригіналу стислості й не додаючи нового богословського змісту.
translation_notes:
  register: Сучасна стандартна українська; виклад природний, стислий і гідний. Пунктуація виразно розмежовує дві цитовані заяви та підсумкову заборону.
