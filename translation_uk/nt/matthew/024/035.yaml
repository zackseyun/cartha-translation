  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσεται, οἱ δὲ λόγοι μου οὐ μὴ παρέλθωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/035.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: uk
  text: Небо і земля минуть, але Мої слова ніколи не минуть.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οὐρανὸς
  choice: небо
  rationale: У парі з γῆ слово позначає не просто видиме небо, а небо як частину створеного порядку; природна українська усталена пара — «небо і земля».
- source_word: ἡ γῆ
  choice: земля
  rationale: У вислові «небо і земля» йдеться про землю у всесвітньому, а не локальному значенні.
- source_word: παρελεύσεται
  choice: минуть
  rationale: Дієслово передає припинення або відхід теперішнього створеного порядку. «Минуть» природно й стисло відтворює майбутній час та есхатологічну вагу вислову.
- source_word: δὲ
  choice: але
  rationale: Сполучник виражає чіткий контраст між минущістю неба й землі та незмінною тривалістю слів Ісуса.
- source_word: οἱ λόγοι μου
  choice: Мої слова
  rationale: λόγοι тут означає висловлені Ісусом слова й учення; «слова» є прямим і достатньо широким відповідником.
- source_word: οὐ μὴ παρέλθωσιν
  choice: ніколи не минуть
  rationale: Подвійне οὐ μή з аористом кон’юнктива виражає посилене заперечення. «Ніколи не минуть» природно передає категоричність у сучасній українській.
theological_decisions:
- issue: Сила твердження Ісуса про тривалість Його слів
  choice: Передати οὐ μή категоричним висловом «ніколи не минуть».
  alternative: «аж ніяк не минуть» або «безперечно не минуть»
  rationale: Переклад зберігає виразний контраст між минущим створеним порядком і непорушністю слів Ісуса, не додаючи окремого доктринального пояснення.
translation_notes:
  register: Сучасна, урочиста й доступна українська. Симетричне повторення «минуть / не минуть» відтворює риторичний контраст оригіналу. Займенник «Мої» подано з великої літери відповідно до поширеної української біблійної видавничої норми, без зміни змісту.
