  text: μελλήσετε δὲ ἀκούειν πολέμους καὶ ἀκοὰς πολέμων· ὁρᾶτε, μὴ θροεῖσθε· δεῖ ⸀γὰρ γενέσθαι, ἀλλ’ οὔπω ἐστὶν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/006.yaml
  text: And you are going to hear of wars and reports of wars. See that you are not alarmed[a], for it must happen, but the end is not yet.
translation:
  language: uk
  text: Ви почуєте про війни та звістки про війни.[a] Глядіть, не жахайтеся, бо це має статися, але це ще не кінець.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «чутки про війни». Грецький вислів може означати звістки, повідомлення або чутки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μελλήσετε
  choice: почуєте
  rationale: Майбутня форма з інфінітивом виражає очікувану майбутню подію; в сучасній українській простий майбутній час природно передає цей зміст без надмірного наголосу на безпосередній близькості.
- source_word: ἀκούειν πολέμους
  choice: почу́єте про війни
  rationale: Прийменникова конструкція «почути про» природно означає одержати відомості, а не безпосередньо чути звуки війни.
- source_word: ἀκοὰς πολέμων
  choice: звістки про війни
  rationale: ἀκοή може означати почуте, звістку, повідомлення або чутку. «Звістки» зберігає широту значення й не припускає, що повідомлення неправдиві.
- source_word: ὁρᾶτε
  choice: глядіть
  rationale: У цьому контексті імператив запроваджує застереження; «глядіть» є стислим і природним українським відповідником у конструкції «глядіть, не…».
- source_word: μὴ θροεῖσθε
  choice: не жахайтеся
  rationale: θροέομαι позначає сильну тривогу, переляк або сум’яття. «Не жахайтеся» природно передає заборону піддаватися паніці.
- source_word: δεῖ γὰρ γενέσθαι
  choice: бо це має статися
  rationale: δεῖ передає необхідність, а γενέσθαι — настання подій. Займенник «це» природно відсилає до щойно названих воєн і звісток, не додаючи окремого переліку.
- source_word: ἀλλ’ οὔπω ἐστὶν τὸ τέλος
  choice: але це ще не кінець
  rationale: Формулювання близько передає грецьке речення, зберігаючи узагальнене значення τὸ τέλος.
theological_decisions:
- issue: Есхатологічне значення τὸ τέλος
  choice: кінець
  alternative: завершення; остаточний кінець
  rationale: Переклад залишає вислів таким само широким, як у грецькому тексті, й не прив’язує його до певної конфесійної есхатологічної схеми.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Ритм речення збережено стислим; традиційне «чутки» подано в примітці, оскільки грецьке слово не обов’язково вказує на неперевірені чи неправдиві відомості.
