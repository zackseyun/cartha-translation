  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «мусять тікати в гори».'
    reason: Лексико-граматична альтернатива, що виразніше передає обов’язковість і терміновість наказу.
lexical_decisions:
- source_word: τότε
  choice: тоді
  rationale: Природний український часовий прислівник, що зберігає послідовність подій у промові.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: ті, хто в Юдеї
  rationale: Субстантивований прийменниковий зворот позначає людей, які перебувають у Юдеї; цей відповідник природний і не додає зайвого уточнення.
- source_word: Ἰουδαίᾳ
  choice: Юдеї
  rationale: Усталена українська форма географічної назви в місцевому відмінку.
- source_word: φευγέτωσαν
  choice: нехай тікають
  rationale: Третя особа множини наказового способу; конструкція з «нехай» безпосередньо й природно передає наказовий характер грецької форми.
- source_word: ἐπὶ τὰ ὄρη
  choice: у гори
  rationale: З дієсловом руху ἐπί з акузативом позначає напрямок; «у гори» є природним українським відповідником і зберігає ὄρη як «гори», а не послаблене «пагорби».
theological_decisions:
- issue: Сила наказового способу в есхатологічному застереженні
  choice: 'Прямий наказ: «нехай тікають»'
  alternative: «мусять тікати»
  rationale: Форма «нехай тікають» точно передає граматичний наказовий спосіб і терміновість настанови, не додаючи окремого доктринального тлумачення.
translation_notes:
  register: Сучасна, загальнозрозуміла й гідна українська мова. Порядок слів близький до грецького, але синтаксис природний для української; наказову форму передано без конфесійного або есхатологічного уточнення.
