    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς γὰρ
  choice: Бо як
  rationale: «Бо» передає пояснювальну силу γάρ, а «як» — порівняльне значення ὡς і природно пов’язує речення з попереднім контекстом.
- source_word: ἦσαν … τρώγοντες καὶ πίνοντες
  choice: вони їли й пили
  rationale: Допоміжне ἦσαν із дієприкметниками описує тривалі звичні дії. Український недоконаний вид природно передає цю тривалість без громіздкої конструкції.
- source_word: ἐν ταῖς ἡμέραις ταῖς πρὸ τοῦ κατακλυσμοῦ
  choice: у дні перед потопом
  rationale: Стислий і природний часовий вислів; «потоп» є усталеним відповідником κατακλυσμός у розповіді про Ноя.
- source_word: τρώγοντες καὶ πίνοντες
  choice: їли й пили
  rationale: Нейтрально передає звичайні повсякденні дії, не додаючи відсутнього в грецькому тексті натяку на ненажерливість чи пияцтво.
- source_word: γαμοῦντες
  choice: одружувалися
  rationale: Передає звичайне значення «брати шлюб» і зберігає паралельний перелік тривалих дій.
- source_word: γαμίζοντες
  choice: видавали заміж
  rationale: Активна форма найприродніше означає віддавати когось у шлюб; цей переклад зберігає відмінність від γαμοῦντες. Можливий інший спосіб розуміння зазначено у примітці.
- source_word: ἄχρι ἧς ἡμέρας
  choice: аж до того дня, коли
  rationale: Природно позначає часову межу тривалих дій і вводить подію, що сталася того дня.
- source_word: εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν
  choice: Ной увійшов у ковчег
  rationale: Точно й природно передає завершену подію; «ковчег» зберігає усталений зв’язок із розповіддю Буття.
theological_decisions:
- issue: Чи слід подавати перелічені дії як гріховні надмірності або як звичайне життя перед несподіваним судом
  choice: Дії передано нейтрально як звичайні заняття людей
  alternative: Надати словам відтінку обжерливості, пияцтва або моральної безтурботності
  rationale: Самі грецькі дієприкметники називають звичайні дії без моральних означень. У контексті наголос стоїть на буденності життя до раптового суду, тому переклад не додає прямого осуду цих дій.
translation_notes:
  register: Сучасна літературна українська з традиційними біблійними словами «потоп», «Ной» і «ковчег». Синтаксис зберігає незавершеність вірша, який продовжується в наступному реченні; кінцеву кому залишено відповідно до структури уривка.
