id: MAT.24.39
reference: Matthew 24:39
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔγνωσαν ἕως ἦλθεν ὁ κατακλυσμὸς καὶ ἦρεν ἅπαντας, οὕτως ἔσται ⸀καὶ ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/039.yaml
  text: And they did not know until the flood came and swept them all away; so also will be the coming of the Son of Man.
translation:
  language: uk
  text: І не розуміли, аж поки не прийшов потоп і не забрав усіх; так само буде й прихід Сина Людського.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: не розуміли
  rationale: У цьому контексті йдеться не просто про відсутність відомостей, а про неусвідомлення того, що відбувалося й наближалося; українське «не розуміли» природно передає цей зміст, не додаючи пояснення.
- source_word: ἦρεν ἅπαντας
  choice: забрав усіх
  rationale: Дієслово αἴρω буквально має значення «брати, забирати, усувати». «Забрав усіх» зберігає образ потопу, який поніс людей, і не нав’язує додаткового тлумачення.
- source_word: οὕτως ... καὶ
  choice: так само ... й
  rationale: 'Передає зіставну конструкцію: як сталося за днів Ноя, так само буде при приході Сина Людського.'
- source_word: παρουσία
  choice: прихід
  rationale: У цьому есхатологічному контексті παρουσία означає прибуття або явний прихід; «прихід» є точним, усталеним і зрозумілим відповідником.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Сина Людського
  rationale: Збережено традиційний і впізнаваний український відповідник цього титулу Ісуса.
theological_decisions:
- issue: Смисл οὐκ ἔγνωσαν
  choice: не розуміли
  alternative: не знали
  rationale: Обидва варіанти можливі, але контекст раптового суду підтримує значення «не усвідомлювали / не розуміли». Формулювання не уточнює, чи причина полягала в незнанні, невірі або байдужості.
- issue: Образ ἦρεν ἅπαντας
  choice: забрав усіх
  alternative: змив усіх
  rationale: «Забрав» ближче до широкого значення αἴρω й зберігає метафоричну відкритість; «змив» виразніше називає дію води, але є конкретизацією.
translation_notes:
  register: Сучасна стандартна українська; лаконічний, гідний біблійний стиль. Синтаксис зберігає послідовність грецького тексту, але звучить природно українською.
