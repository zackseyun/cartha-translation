  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Βλέπετε μή τις ὑμᾶς πλανήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/004.yaml
  text: And Jesus answered them[a], “See that no one leads you astray.”
translation:
  language: uk
  text: 'Ісус сказав їм у відповідь: «Стережіться, щоб ніхто не ввів вас в оману[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «не обманув вас».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν αὐτοῖς
  choice: сказав їм у відповідь
  rationale: Передає і значення відповіді, і дієслово мовлення без неприродного для сучасної української повтору «відповів і сказав».
- source_word: Βλέπετε
  choice: Стережіться
  rationale: У цьому застережному контексті імператив має значення «будьте обережні, пильнуйте»; «стережіться» природно вводить наступне речення з «щоб».
- source_word: μή τις
  choice: щоб ніхто не
  rationale: Природно передає запобіжну конструкцію μή із кон’юнктивом після наказу.
- source_word: πλανήσῃ
  choice: ввів вас в оману
  rationale: Вислів охоплює як обман, так і спрямування хибним шляхом, не звужуючи попередження лише до інтелектуальної помилки.
theological_decisions:
- issue: Характер попередження у πλανήσῃ
  choice: загальне застереження проти введення в оману
  alternative: вужче застереження лише проти обману
  rationale: Грецьке πλανάω може означати обманювати, вводити в оману або збивати з правильного шляху. Основний переклад зберігає цей ширший діапазон, а примітка подає стислу лексичну альтернативу.
translation_notes:
  register: Сучасна нормативна українська мова; вислів урочистий, але доступний. Конструкція «сказав їм у відповідь» природно передає семітизований грецький зворот, а «стережіться» виражає силу наказового способу.
