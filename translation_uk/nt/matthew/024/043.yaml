lexical_decisions:
- source_word: ἐκεῖνο δὲ γινώσκετε
  choice: Але знайте ось що
  rationale: Передає перехід, позначений δέ, та прямий заклик γινώσκετε природною сучасною українською мовою.
- source_word: οἰκοδεσπότης
  choice: господар дому
  rationale: Точно й зрозуміло передає голову домашнього господарства, не звужуючи значення до сучасного юридичного поняття власника житла.
- source_word: ποίᾳ φυλακῇ
  choice: у яку сторожу ночі
  rationale: φυλακή тут означає одну з частин, на які в давнину ділили ніч; додане «ночі» робить культурно специфічний вислів зрозумілим у головному тексті.
- source_word: ὁ κλέπτης ἔρχεται
  choice: прийде злодій
  rationale: Грецький теперішній час у цій умовній конструкції природно передається українським майбутнім щодо очікуваного приходу злодія.
- source_word: ἐγρηγόρησεν ἂν
  choice: не спав би
  rationale: У нічному контексті γρηγορέω означає не спати, пильнувати; цей варіант простий, образний і природний.
- source_word: οὐκ ἂν εἴασεν
  choice: не дозволив би
  rationale: Безпосередньо передає значення дозволу або допущення в контрфактичній умові.
- source_word: διορυχθῆναι τὴν οἰκίαν αὐτοῦ
  choice: проламати свій дім
  rationale: Зберігає конкретний образ пророблення пролому в будинку, властивий διορύσσω, не замінюючи його загальнішим «обікрасти».
theological_decisions:
- issue: Образ господаря дому
  choice: господар дому
  alternative: домовласник
  rationale: Йдеться про ілюстративний образ, а не доктринальний титул; обраний вислів зберігає соціальну роль без сучасного наголосу на юридичному праві власності.
- issue: Образ проникнення до будинку
  choice: проламати свій дім
  alternative: вдертися до свого дому
  rationale: Обраний варіант зберігає матеріальну конкретність грецького дієслова й давнього способу проникнення крізь стіну або дах, не змінюючи богословського змісту.
