  naturalness: «Але знайте ось що» і умовна конструкція природні для сучасної літературної української. «У яку нічну сторожу» звучить дещо природніше й точніше за «у яку сторожу ночі». «Не дозволив би вдертися до свого дому» є ясним ідіоматичним відповідником у головному тексті; буквальний образ прокопування належно збережено в примітці.
  terminology: «Господар дому» доречно передає οἰκοδεσπότης без модернізації до юридичного «власника». «Нічна сторожа» зберігає культурно-часову специфіку φυλακή. Примітка до проникнення коректно пояснює буквальне διορύσσω, але її формулювання уточнено для плавності.
