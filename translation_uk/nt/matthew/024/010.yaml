  source_fidelity: 'Основний зміст передано точно: τότε — «тоді», σκανδαλισθήσονται у контексті тиску — «відступиться», παραδώσουσιν — «видаватиме», а взаємність ἀλλήλους і ворожість μισήσουσιν збережено. Однак після нормативно однинного «багато хто» форми «вони видаватимуть / ненавидітимуть» створюють непотрібне порушення узгодження. У грецькому тексті займенника «вони» немає.'
