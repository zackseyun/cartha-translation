lexical_decisions:
- source_word: τότε
  choice: тоді
  rationale: Природний часовий прислівник, що позначає наступний етап у послідовності подій Ісусової промови.
- source_word: σκανδαλισθήσονται
  choice: відступиться
  rationale: У контексті переслідування дієслово вказує на серйозний відступ під тиском; примітка зберігає ширший образ спотикання та можливе значення обурення.
- source_word: πολλοὶ
  choice: багато хто
  rationale: Субстантивований прикметник природно передано українським особовим зворотом.
- source_word: ἀλλήλους
  choice: одне одного
  rationale: Зберігає взаємний характер обох дій і природно звучить у сучасній українській.
- source_word: παραδώσουσιν
  choice: видаватимуть
  rationale: Передає як буквальне віддання когось до рук переслідувачів, так і зрадницький характер дії, не звужуючи значення лише до особистої зради.
- source_word: μισήσουσιν
  choice: ненавидітимуть
  rationale: Прямий відповідник майбутньої форми μισέω, що виражає активну ворожість.
- source_word: καὶ τότε ... καὶ ... καὶ ...
  choice: І тоді ... і ... та ...
  rationale: Початкове «І» зберігає зв’язок із попереднім контекстом, а сурядність — накопичувальний рух вислову; «та» природно уникає стилістично важкого повтору без втрати структури.
theological_decisions:
- issue: Значення σκανδαλισθήσονται в контексті есхатологічного переслідування
  choice: відступиться
  alternative: спіткнеться; зневіриться; обуриться
  rationale: «Відступиться» передає серйозність розриву або відходу під тиском, але не визначає докладно його догматичний статус. У примітці збережено образну й семантичну неоднозначність грецького дієслова.
- issue: Значення παραδώσουσιν у взаємній ворожнечі
  choice: видаватимуть
  alternative: зраджуватимуть
  rationale: «Видаватимуть» ближче до основного значення παραδίδωμι — передавати когось у чужі руки — і добре відповідає контексту переслідування; водночас дія очевидно має зрадницький характер.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Однина «багато хто відступиться» відповідає нормативному узгодженню з конструкцією «багато хто»; наступне «вони» природно поновлює множинний смисл. Майбутні недоконані форми передають перебіг взаємних дій у змальованій ситуації.
