  text: Ἀπὸ δὲ τῆς συκῆς μάθετε τὴν παραβολήν· ὅταν ἤδη ὁ κλάδος αὐτῆς γένηται ἁπαλὸς καὶ τὰ φύλλα ἐκφύῃ, γινώσκετε ὅτι ἐγγὺς τὸ θέρος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/032.yaml
  text: 'Learn the parable from the fig tree: as soon as its branch becomes tender and puts out leaves[c][b][a], you know that summer is near.'
translation:
  language: uk
  text: 'Навчіться притчі від смоківниці[a]: коли її гілка вже стане м’якою й на ній з’явиться листя[b], ви знаєте, що літо[c] близько.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «уроку» чи «порівняння».
    reason: lexical_alternative
  - marker: b
    text: Або «випускає листя».
    reason: lexical_alternative
  - marker: c
    text: Грецьке θέρος може означати «літо», а в деяких контекстах — пору жнив; тут образ смоківниці найкраще узгоджується із сезонним значенням.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς συκῆς
  choice: Від смоківниці
  rationale: Прийменник ἀπό з родовим відмінком позначає джерело навчання. Початкове δέ має легку перехідну силу, яку українською тут природно не виражати окремим словом.
- source_word: μάθετε
  choice: навчіться
  rationale: Аористовий наказовий спосіб μανθάνω передано прямим закликом; зворотна форма «навчіться» природно поєднується з «від смоківниці».
- source_word: τὴν παραβολήν
  choice: притчі
  rationale: «Притча» зберігає звичний євангельський термін і передає ілюстративне порівняння, яке далі пояснюється.
- source_word: ὅταν ἤδη
  choice: щойно
  rationale: ὅταν вводить загальну часову умову, а ἤδη підкреслює настання помітної зміни; «щойно» стисло й природно передає цю сукупну силу.
- source_word: ὁ κλάδος αὐτῆς γένηται ἁπαλὸς
  choice: її гілка стає м’якою
  rationale: γένηται виражає зміну стану, а ἁπαλός — м’якість або ніжність молодого пагона. «Стає м’якою» зрозуміло передає ботанічну ознаку.
- source_word: καὶ τὰ φύλλα ἐκφύῃ
  choice: і пускає листя
  rationale: ἐκφύῃ означає проростати або випускати; український вислів «пускає листя» природно описує цей процес.
- source_word: γινώσκετε
  choice: ви знаєте
  rationale: Форма теперішнього часу другої особи множини найприродніше читається як дійсний спосіб із загальним значенням, а не як наказ.
- source_word: ἐγγὺς τὸ θέρος
  choice: літо близько
  rationale: У контексті сезонних ознак смоківниці θέρος передусім означає «літо»; бездієслівну грецьку конструкцію природно збережено українським іменним присудком.
theological_decisions:
- issue: Значення образу смоківниці
  choice: Передати його як сезонну ілюстрацію, не ототожнюючи смоківницю прямо з Ізраїлем.
  alternative: Витлумачити смоківницю як символ Ізраїлю або, навпаки, прямо назвати її лише звичайним прикладом із природи.
  rationale: Сам вірш подає спостережувану аналогію про розпізнавання близькості за ознаками, але не пояснює символічної тотожності смоківниці. Переклад не повинен вирішувати ширшу есхатологічну суперечку.
translation_notes:
  register: Сучасна літературна українська з урочистою, але доступною біблійною тональністю. Збережено традиційний термін «притча», а синтаксис зроблено природним для широкого кола читачів.
