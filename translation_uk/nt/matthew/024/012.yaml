  text: καὶ διὰ τὸ πληθυνθῆναι τὴν ἀνομίαν ψυγήσεται ἡ ἀγάπη τῶν πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/012.yaml
  text: And because lawlessness will be multiplied[b][a], the love of many will grow cold.
translation:
  language: uk
  text: І через те, що беззаконня примножиться[a], любов багатьох охолоне[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «через зростання беззаконня».'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «у багатьох любов охолоне».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ πληθυνθῆναι
  choice: через те, що ... примножиться
  rationale: διά з артикльованим інфінітивом виражає причину, а пасивний інфінітив πληθυνθῆναι в цьому есхатологічному контексті природно передається майбутнім часом. «Примножиться» зберігає дієслівність і пасивно-неперехідний відтінок вислову.
- source_word: ἀνομίαν
  choice: беззаконня
  rationale: ἀνομία означає нехтування законом або його порушення, особливо Божого закону. «Беззаконня» є точним, усталеним і зрозумілим відповідником.
- source_word: ψυγήσεται
  choice: охолоне
  rationale: Форма ψυγήσεται тут метафорично описує згасання любові. «Охолоне» природно передає цю метафору сучасною українською мовою.
- source_word: ἀγάπη
  choice: любов
  rationale: «Любов» є прямим і стандартним відповідником ἀγάπη та не звужує її можливого змісту в цьому контексті.
- source_word: τῶν πολλῶν
  choice: багатьох
  rationale: Українське «багатьох» природно передає широкий, але невизначений обсяг грецького вислову, не перетворюючи його на статистичне «більшості».
theological_decisions:
- issue: Коло осіб у вислові «любов багатьох»
  choice: Збережено невизначене «любов багатьох», без уточнення, про яку саме групу йдеться.
  alternative: любов серед віруючих охолоне; людська любов у суспільстві охолоне
  rationale: Грецьке τῶν πολλῶν не визначає прямо, чи йдеться про учнів, людей загалом або змішану групу. Переклад зберігає цю богословську невизначеність.
- issue: Граматична визначеність τῶν πολλῶν
  choice: багатьох
  alternative: тих багатьох
  rationale: Артикль допускає формальніше «тих багатьох», однак у цьому вислові українське «багатьох» звучить природніше й не надає групі зайвої визначеності.
translation_notes:
  register: Сучасна стандартна українська мова; виклад стислий, гідний і зрозумілий. Збережено причинну конструкцію, метафору охолодження любові та невизначеність щодо кола «багатьох».
