source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπῃ ὁ κακὸς δοῦλος ἐκεῖνος ἐν τῇ καρδίᾳ αὐτοῦ· Χρονίζει ⸂μου ὁ κύριος⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/048.yaml
  text: But if that wicked servant says in his heart[b][a], ‘My master is delaying,’
translation:
  language: uk
  text: 'Але якщо той лихий слуга[a] скаже у своєму серці: «Мій господар[b] затримується»,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «той лихий раб». Грецьке слово δοῦλος може означати і слугу, і раба — залежно від контексту.'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «мій пан». Грецьке слово κύριος в цьому контексті позначає господаря слуги.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ εἴπῃ
  choice: Але якщо ... скаже
  rationale: ἐὰν з аористом кон’юнктива вводить умовну ситуацію, а δέ позначає легке протиставлення; український майбутній доконаного виду природно передає таку умову.
- source_word: ὁ κακὸς δοῦλος ἐκεῖνος
  choice: той лихий слуга
  rationale: κακός дає моральну характеристику, природно передану словом «лихий»; δοῦλος у контексті домашнього управління передано як «слуга», а ἐκεῖνος — вказівним «той».
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: у своєму серці
  rationale: Збережено грецьку метафору внутрішньої думки; зворотний займенник «своєму» є природним українським відповідником αὐτοῦ при тому самому суб’єкті.
- source_word: Χρονίζει
  choice: затримується
  rationale: Дієслово передає тривале зволікання або запізнення; форма теперішнього часу зберігає сприйняття затримки як поточного стану.
- source_word: μου ὁ κύριος
  choice: мій господар
  rationale: У безпосередньому контексті домашньої притчі κύριος позначає того, кому підлеглий слуга; «господар» природно виражає цей зв’язок, не усуваючи ширшого параболічного підтексту.
theological_decisions:
- issue: Передача κύριος в домашньому образі притчі
  choice: господар
  alternative: пан; Господь
  rationale: Безпосередній сюжетний рівень описує взаємини слуги та господаря. «Господар» зберігає цей сенс і не нав’язує прямого титулу, хоча контекст промови дозволяє читачеві побачити ширше богословське співвіднесення.
- issue: Передача δοῦλος
  choice: слуга
  alternative: раб
  rationale: У цьому вірші на передньому плані доручена роль у домі, тому «слуга» є природним відповідником. Більш буквальне «раб» залишається лексично можливим і зазначене у примітці.
translation_notes:
  register: Сучасна нормативна українська мова з гідним біблійним звучанням. Збережено метафору «у своєму серці» та умовну будову оригіналу; лексичні альтернативи для δοῦλος і κύριος подано в примітках.
