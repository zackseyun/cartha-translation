  text: ἀμὴν λέγω ὑμῖν ὅτι ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ καταστήσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/047.yaml
  text: Truly I say to you that he will appoint him over all his possessions[a].
translation:
  language: uk
  text: 'Істинно кажу вам: він поставить його над усім своїм майном[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «над усім, що йому належить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Істинно
  rationale: Передає урочисту й авторитетну формулу введення до вислову Ісуса; одинарне ἀμὴν не слід відтворювати подвоєнням.
- source_word: λέγω ὑμῖν
  choice: кажу вам
  rationale: Прямо й природно зберігає формульний характер вислову та теперішній час дієслова.
- source_word: ὅτι
  choice: ':'
  rationale: В українській після формули «Істинно кажу вам» двокрапка природно вводить зміст вислову, не вимагаючи окремого відповідника «що».
- source_word: ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: над усім своїм майном
  rationale: ἐπί з давальним після καθίστημι позначає сферу дорученої відповідальності, а τὰ ὑπάρχοντα — те, що комусь належить, тобто майно чи володіння.
- source_word: καταστήσει
  choice: поставить
  rationale: У цьому контексті означає призначення на становище з ширшими повноваженнями; «поставить над» є природним українським відповідником.
- source_word: αὐτόν
  choice: його
  rationale: Зберігає чоловічий рід і однину грецького займенника, що стосується раба з попереднього контексту.
theological_decisions:
- issue: Характер винагороди або доручення від пана
  choice: Передати вислів як поставлення над усім майном пана в межах образної розповіді.
  alternative: Уточнити це як церковну владу або небесну есхатологічну нагороду.
  rationale: Сам вірш говорить про розширене управительське доручення, але не визначає прямо його позапритчевого богословського відповідника.
translation_notes:
  register: Сучасна нормативна українська мова з урочистим, але зрозумілим біблійним регістром. Конструкція «поставить його над» зберігає образ управительського призначення; «своїм» природно вказує на майно того, хто призначає.
