  source_fidelity: Текст точно передає οὕτως καὶ ὑμεῖς, часову конструкцію ὅταν ἴδητε, наказове γινώσκετε, нейтральне πάντα ταῦτα та образ ἐπὶ θύραις. «Це близько» доречно не конкретизує невиражений підмет ἐγγύς ἐστιν.
  naturalness: Формулювання природне для сучасної стандартної української й зберігає стриманий біблійний регістр. Двокрапка після «ви» та тире перед «при дверях» стилістично прийнятні й не спотворюють синтаксису чи змісту.
