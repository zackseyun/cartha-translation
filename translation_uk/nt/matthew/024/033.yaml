  text: οὕτως καὶ ὑμεῖς, ὅταν ἴδητε ⸂πάντα ταῦτα⸃, γινώσκετε ὅτι ἐγγύς ἐστιν ἐπὶ θύραις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/033.yaml
  text: So also you[a], when you see all these things, know that it is near, at the doors.
translation:
  language: uk
  text: 'Так само й ви: коли побачите все це, знайте, що це близько — при дверях.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Він близько». У грецькому тексті підмет прямо не названо.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Так само й ви
  rationale: Передає порівняння з попереднім образом смоківниці та наголос на учнях без зайвого розгортання.
- source_word: ὅταν ἴδητε
  choice: коли побачите
  rationale: Природно передає майбутню часову конструкцію ὅταν з аористом кон’юнктива; «щоразу, коли» невиправдано надавало б повторюваного значення.
- source_word: πάντα ταῦτα
  choice: все це
  rationale: Природний сучасний український відповідник грецького середнього множинного; не додає тлумачного слова «події».
- source_word: γινώσκετε
  choice: знайте
  rationale: Зберігає наказову силу форми та пряме значення дієслова.
- source_word: ἐγγύς ἐστιν
  choice: це близько
  rationale: Грецький текст не називає підмета. Вказівне «це» дає природне українське формулювання й не визначає однозначно, чи йдеться про подію, звершення або особу.
- source_word: ἐπὶ θύραις
  choice: при дверях
  rationale: Зберігає множину θύραις і образ крайньої близькості; «при дверях» є зрозумілим та гідним українським висловом.
theological_decisions:
- issue: Неявний підмет у ἐγγύς ἐστιν
  choice: «це близько» з приміткою про можливе «Він близько»
  alternative: «Він близько»
  rationale: У грецькому реченні підмет прямо не виражений, тому основний текст не ототожнює його однозначно із Сином Людським чи з наближенням згаданого звершення. Примітка зберігає особове прочитання як справжню можливість.
translation_notes:
  register: Сучасна стандартна українська, природна й урочисто-стримана. Двокрапка чітко вводить настанову, а тире перед «при дверях» передає підсилювальний характер завершального образу.
