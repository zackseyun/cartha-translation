language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: καὶ τότε φανήσεται τὸ σημεῖον τοῦ υἱοῦ τοῦ ἀνθρώπου ἐν ⸀τῷ οὐρανῷ, καὶ τότε κόψονται πᾶσαι αἱ φυλαὶ τῆς γῆς καὶ ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ μετὰ δυνάμεως καὶ δόξης πολλῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/030.yaml
  text: And then the sign of the Son of Man will appear in heaven[a], and then all the tribes of the earth will mourn[c][b], and they will see the Son of Man coming on the clouds of heaven with power and great glory.
translation:
  language: uk
  text: І тоді на небі[a] з’явиться знак Сина Людського, і тоді всі племена землі[b] заголосять, і вони побачать Сина Людського, який іде на хмарах небесних[c] із силою та великою славою.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Грецьке οὐρανός може означати «небеса» або видиме небо.
    reason: lexical_alternative
  - marker: b
    text: Або «всі племена краю». Грецьке γῆ може означати «земля» або «край».
    reason: alternative_reading
  - marker: c
    text: Вислів «іде на хмарах небесних» перегукується з Даниїла 7:13.
    reason: cross_reference
lexical_decisions:
- source_word: φανήσεται
  choice: з’явиться
  rationale: 'Природно передає тут неперехідне значення майбутньої форми: знак стане видимим.'
- source_word: σημεῖον
  choice: знак
  rationale: Прямий і усталений відповідник, який не додає тлумачення на кшталт «знамення» чи «провісник».
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Сина Людського
  rationale: Родовий відмінок збережено без уточнення, чи це знак, пов’язаний із Сином Людським, чи сам Син Людський як знак.
- source_word: ἐν τῷ οὐρανῷ
  choice: на небі
  rationale: Природний український вислів, що зберігає небесний та апокаліптичний регістр; можливе значення «у небі» подано в примітці як просторовий варіант.
- source_word: κόψονται
  choice: заголосять
  rationale: Передає публічний плач і скорботне голосіння, властиві цьому контексту, не нав’язуючи конкретного жесту биття себе в груди.
- source_word: φυλαὶ
  choice: племена
  rationale: Найпряміше передає φυλαί та зберігає біблійно-апокаліптичне звучання.
- source_word: τῆς γῆς
  choice: землі
  rationale: У космічному контексті природно розуміється як уся земля; локальне значення «краю» лишається можливим і зазначене в примітці.
- source_word: ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: Який іде на хмарах небесних
  rationale: Зберігає образ руху та виразну алюзію на Даниїла 7:13 без архаїчного «гряде».
- source_word: μετὰ δυνάμεως καὶ δόξης πολλῆς
  choice: із силою та великою славою
  rationale: Відтворює граматичний зв’язок πολλῆς безпосередньо зі «славою» та звучить природно українською.
theological_decisions:
- issue: Значення вислову «знак Сина Людського»
  choice: Збережено неоднозначну родову конструкцію «знак Сина Людського».
  alternative: «знак, що належить Синові Людському» або «знак — сам Син Людський»
  rationale: Грецький текст не визначає однозначно зв’язок між знаком і Сином Людським, тому переклад не розв’язує спірної есхатологічної деталі.
- issue: Обсяг значення γῆ у вислові «всі племена землі»
  choice: У головному тексті вжито універсальне «землі».
  alternative: «краю»
  rationale: Космічний та апокаліптичний контекст підтримує універсальне прочитання, але можливу алюзію на племена конкретного краю збережено в примітці.
translation_notes:
  register: Сучасна, зрозуміла й урочиста українська мова. «Син Людський» збережено як усталений біблійний титул; уникнуто архаїзмів на кшталт «гряде». Усі примітки позначені в основному тексті.
