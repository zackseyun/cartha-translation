    reason: alternative_reading
lexical_decisions:
- source_word: δύο ἀλήθουσαι
  choice: Дві жінки молотимуть
  rationale: Субстантивований дієприкметник ἀλήθουσαι має форму жіночого роду множини, тому йдеться саме про двох жінок. Майбутній час природно передає часову перспективу контексту, зберігаючи картину одночасної праці.
- source_word: ἐν τῷ μύλῳ
  choice: на жорнах
  rationale: μύλος може означати млин, жорно або пристрій для молоття. У сцені домашньої праці українське «на жорнах» звучить природно й не вимагає уявляти окрему млинову будівлю.
- source_word: μία παραλαμβάνεται
  choice: одну буде взято
  rationale: Пасивна конструкція з παραλαμβάνω передана без називання того, хто бере, і без уточнення мети чи наслідку цієї дії.
- source_word: καὶ μία ἀφίεται
  choice: а одну залишено
  rationale: ἀφίημι тут прямо протиставляє долю другої жінки долі першої. Українське «а» природно виражає цей контраст, не додаючи богословського тлумачення до дієслова.
theological_decisions:
- issue: Чи означає «взято» спасіння або суд
  choice: Зберегти нейтральні формулювання «взято» і «залишено»
  alternative: Уточнити, що одну взято для спасіння або на суд, а іншу залишено для протилежної долі
  rationale: Сам цей вислів не пояснює, яка з двох дій означає спасіння, а яка — суд. Переклад не повинен усувати цю справжню неоднозначність.
- issue: Чи називати осіб жінками
  choice: Прямо сказати «дві жінки»
  alternative: Передати лише «двоє молотимуть»
  rationale: Жіночий рід форми ἀλήθουσαι граматично визначає обох осіб як жінок; це частина значення грецького тексту, а не додане тлумачення.
translation_notes:
  register: Сучасна, гідна й загальнозрозуміла українська мова. Безособові форми «буде взято» та «залишено» природно відтворюють грецький пасив і не називають виконавця дії. «На жорнах» передає звичну домашню працю без зайвого технічного уточнення.
