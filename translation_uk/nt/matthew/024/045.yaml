id: MAT.24.45
reference: Matthew 24:45
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Τίς ἄρα ἐστὶν ὁ πιστὸς δοῦλος καὶ φρόνιμος ὃν κατέστησεν ὁ ⸀κύριος ἐπὶ τῆς ⸀οἰκετείας αὐτοῦ τοῦ ⸀δοῦναι αὐτοῖς τὴν τροφὴν ἐν καιρῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/045.yaml
  text: Who then is the faithful and wise servant[b][a], whom the master has appointed over his household to give them their food at the proper time?
translation:
  language: uk
  text: Хто ж той вірний і розсудливий раб[a], якого пан[b] поставив над своїми домочадцями, щоб давати їм їжу в належний час?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «слуга». Грецьке слово δοῦλος може залежно від контексту означати раба або слугу; тут «раб» виразніше передає становище людини під владою пана.
    reason: lexical_alternative
  - marker: b
    text: Або «Господь». У цьому образі домашнього господарства грецьке κύριος перекладено як «пан», відповідно до взаємин пана і раба.
    reason: alternative_reading
lexical_decisions:
- source_word: Τίς ἄρα
  choice: Хто ж
  rationale: Передає риторичне запитання та висновковий/продовжувальний відтінок частки ἄρα природною сучасною українською мовою.
- source_word: πιστὸς
  choice: вірний
  rationale: У цьому контексті означає надійного у виконанні доручення; «вірний» зберігає і практичний, і моральний відтінок.
- source_word: δοῦλος
  choice: раб
  rationale: Передає виразний статус людини під владою пана в соціальному образі притчі; м’якший відповідник «слуга» подано у примітці.
- source_word: φρόνιμος
  choice: розсудливий
  rationale: Передає практичну мудрість, обачність і здатність правильно діяти, властиві φρόνιμος у цьому контексті.
- source_word: κατέστησεν
  choice: поставив
  rationale: Природно передає призначення на відповідальне становище й делегування повноважень.
- source_word: κύριος
  choice: пан
  rationale: У безпосередньому контексті домашнього господарства означає пана раба; можливість титульного «Господь» збережено у примітці.
- source_word: οἰκετείας
  choice: домочадцями
  rationale: Позначає людей домашнього господарства, над якими поставлено раба; цей відповідник узгоджується з наступним множинним займенником αὐτοῖς.
- source_word: τοῦ δοῦναι
  choice: щоб давати
  rationale: 'Передає значення мети артиклевого інфінітива: раб поставлений саме для своєчасного забезпечення інших їжею.'
- source_word: τροφὴν
  choice: їжу
  rationale: Прямо й без надмірного уточнення передає їжу або поживу; контекст допускає думку про належну частку харчів, але не вимагає її в основному тексті.
- source_word: ἐν καιρῷ
  choice: в належний час
  rationale: Зберігає значення слушного, відповідного часу, а не просто хронологічного моменту.
theological_decisions:
- issue: Передача κύριος в образі домашнього господарства
  choice: пан
  alternative: Господь
  rationale: «Пан» зберігає безпосередній соціальний образ взаємин господаря і раба, не заперечуючи ширшого співвіднесення пана притчі з Господом. Варіант «Господь» подано в примітці, щоб не усувати титульної можливості.
- issue: Передача статусу δοῦλος
  choice: раб
  alternative: слуга
  rationale: «Раб» точніше відбиває підлеглий правовий і соціальний статус у грецькому слові, тоді як «слуга» є природнішим, але слабшим за значенням відповідником; неоднозначність засвідчено приміткою.
translation_notes:
  register: Сучасна нормативна українська мова з гідним, доступним регістром. Синтаксис риторичного запитання збережено природно; «домочадці» передає колектив людей дому без надмірно адміністративного звучання.
