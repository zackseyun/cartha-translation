source:
  edition: SBLGNT
  text: καὶ κηρυχθήσεται τοῦτο τὸ εὐαγγέλιον τῆς βασιλείας ἐν ὅλῃ τῇ οἰκουμένῃ εἰς μαρτύριον πᾶσιν τοῖς ἔθνεσιν, καὶ τότε ἥξει τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/014.yaml
  text: And this good news of the kingdom will be proclaimed throughout the whole world as a testimony to all the nations[c][b][a], and then the end will come.
translation:
  language: uk
  text: І ця добра звістка про Царство[a] буде проголошена по всьому світу[b] як свідчення для всіх народів[c], і тоді прийде кінець.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «це Євангеліє Царства».'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «по всій населеній землі».'
    reason: lexical_alternative
  - marker: c
    text: 'Або: «для всіх людей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρυχθήσεται
  choice: буде проголошена
  rationale: Майбутня пасивна форма передає публічне сповіщення. «Буде проголошена» природно звучить українською і не звужує значення до церковної проповіді.
- source_word: εὐαγγέλιον
  choice: Добра Звістка
  rationale: Передає основне значення слова як доброї новини, залишаючись зрозумілим сучасному читачеві; традиційний відповідник «Євангеліє» подано у примітці.
- source_word: τῆς βασιλείας
  choice: про Царство
  rationale: Родовий відмінок позначає зміст звістки — Боже Царство. Українське «про Царство» природніше за буквальне «Царства» і не додає уточнень, яких немає в грецькому тексті.
- source_word: ἐν ὅλῃ τῇ οἰκουμένῃ
  choice: по всьому світу
  rationale: οἰκουμένη означає населений світ. Вибраний вислів природно передає всеохопний простір, а точніший формальний варіант наведено у примітці.
- source_word: εἰς μαρτύριον
  choice: як свідчення
  rationale: Зберігає цільовий або результативний відтінок конструкції та не вирішує, чи це свідчення на користь слухачів, чи проти них.
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: для всіх народів
  rationale: ἔθνη тут широко охоплює народи світу, а не лише язичників на противагу юдеям. Давальний відмінок природно передано прийменниковою конструкцією «для всіх народів».
- source_word: ἥξει
  choice: прийде
  rationale: Звичайний і природний відповідник ἥκω в цьому есхатологічному контексті.
- source_word: τὸ τέλος
  choice: кінець
  rationale: Прямий відповідник, який зберігає лаконічність і не привносить спеціальної схеми кінцевих подій.
theological_decisions:
- issue: Обсяг значення οἰκουμένη та ἔθνη в есхатологічному вислові
  choice: «по всьому світу» та «для всіх народів»
  alternative: «по всій населеній землі» та «для всіх племен/людей»
  rationale: Переклад зберігає універсальний масштаб проголошення перед «кінцем», не обмежуючи його Римською імперією і не прив'язуючи до конкретної місіологічної чи есхатологічної системи.
- issue: Спрямованість свідчення в εἰς μαρτύριον
  choice: «як свідчення» без уточнення сприятливого чи обвинувального характеру
  alternative: «на свідчення проти них»
  rationale: У грецькому тексті немає додатка «проти них», тому переклад зберігає відкритість щодо характеру свідчення.
translation_notes:
  register: Сучасна стандартна українська, ясний і гідний біблійний стиль. Великі літери в «Добра Звістка» та «Царство» підкреслюють усталені в контексті позначення звістки й Божого царювання, не додаючи конфесійної термінології.
