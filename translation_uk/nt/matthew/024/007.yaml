id: MAT.24.7
reference: Matthew 24:7
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ἐγερθήσεται γὰρ ἔθνος ἐπὶ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν, καὶ ἔσονται ⸀λιμοὶ καὶ σεισμοὶ κατὰ τόπους·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/007.yaml
  text: For nation will rise against nation[a], and kingdom against kingdom[b], and there will be famines and earthquakes in various places.
translation:
  language: uk
  text: Бо постане народ проти народу[a] й царство проти царства, і будуть голоди та землетруси в різних місцях.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «підніметься народ проти народу». Грецький вислів означає початок ворожого протистояння між народами.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «місцями»; також можливо: «від місця до місця».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσεται
  choice: постане
  rationale: Майбутня форма ἐγείρω в цій конструкції описує початок ворожого протистояння. «Постане» природно передає цей зміст, не вводячи думки про прямо названого діяча, який когось «підніме».
- source_word: γὰρ
  choice: бо
  rationale: Сполучник пояснює попереднє висловлювання; українське «бо» стисло й природно зберігає цей логічний зв’язок.
- source_word: ἔθνος
  choice: народ
  rationale: ἔθνος тут означає велику етнополітичну спільноту. «Народ» природніше для сучасної української мови, ніж повторне «нація», і не звужує значення до язичників.
- source_word: ἐπὶ ἔθνος
  choice: проти народу
  rationale: ἐπί зі знахідним відмінком у цій ворожій конструкції означає спрямованість проти когось.
- source_word: βασιλεία
  choice: царство
  rationale: У паралелі з «народом» слово позначає політичне царство або державне володіння; «царство» зберігає історичний та есхатологічний регістр.
- source_word: ἔσονται
  choice: будуть
  rationale: Екзистенційне вживання εἰμί природно передається формою «будуть».
- source_word: λιμοὶ
  choice: голоди
  rationale: Множина грецького іменника вказує на неодноразові або розподілені випадки тяжкого голоду. Українська множина дещо менш уживана, але зрозуміла й точно зберігає число оригіналу.
- source_word: σεισμοὶ
  choice: землетруси
  rationale: У цьому контексті σεισμός прямо означає землетрус; множину оригіналу збережено.
- source_word: κατὰ τόπους
  choice: в різних місцях
  rationale: 'Конструкція має розподільне значення: події відбуватимуться в багатьох місцях, а не в одному визначеному місці.'
theological_decisions:
- issue: Обсяг значення ἔθνος в есхатологічному вислові про конфлікт
  choice: народ
  alternative: нація; язичницький народ
  rationale: Паралелізм із «царство проти царства» вказує на масштабні конфлікти між народами. «Народ» зберігає етнополітичну широту й не додає спеціального значення «язичники».
- issue: Сила майбутньої форми ἐγερθήσεται
  choice: постане проти
  alternative: буде піднятий проти; підніметься проти
  rationale: Вислів повідомляє про виникнення ворожнечі, але не називає того, хто її спричиняє. Переклад не подає форму як явний богословський пасив і не приписує причинність Богові.
translation_notes:
  register: Сучасна літературна українська мова з урочистим, але доступним біблійним звучанням. Паралельну будову двох пар збережено. Рідше вживану множину «голоди» обрано свідомо, щоб передати множину λιμοί і не додавати поняття навмисно організованого голоду.
