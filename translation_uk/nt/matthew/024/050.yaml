  text: ἥξει ὁ κύριος τοῦ δούλου ἐκείνου ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ καὶ ἐν ὥρᾳ ᾗ οὐ γινώσκει,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/050.yaml
  text: the master of that servant will come on a day he does not expect and at an hour he does not know[b][a],
translation:
  language: uk
  text: Господар[a] того раба[b] прийде в день, коли він цього не чекає, і в годину, якої не знає.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «пан». Грецьке κύριος може означати «Господь», «пан» або «господар»; тут у сюжеті притчі це людський господар.
    reason: lexical_alternative
  - marker: b
    text: Або «слуга». Грецьке δοῦλος означає людину в підлеглому, невільницькому становищі; тут образ господаря і раба робить цей статус виразним.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥξει
  choice: прийде
  rationale: Майбутня форма ἥκω означає прихід або прибуття; «прийде» природно передає несподіване повернення господаря.
- source_word: ὁ κύριος
  choice: господар
  rationale: У межах притчі йдеться про людського очільника дому та власника раба; «господар» природно передає цей зв’язок без автоматичного внесення божественного титулу.
- source_word: τοῦ δούλου
  choice: раба
  rationale: δοῦλος позначає людину в невільницькому, підлеглому становищі. У виразному протиставленні господаря і раба слово «раб» зберігає соціальну силу образу.
- source_word: ἐκείνου
  choice: того
  rationale: Вказівний займенник відсилає до конкретного раба, про якого йшлося раніше.
- source_word: ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ
  choice: в день, коли той не сподівається
  rationale: Зворот зберігає невизначеність дня та передає προσδοκάω як очікування. «Той» природно вказує на раба як невиражений підмет грецького дієслова.
- source_word: ἐν ὥρᾳ ᾗ οὐ γινώσκει
  choice: в годину, якої не знає
  rationale: Буквальне «в годину» зберігає паралель «день — година», а «якої не знає» передає простий зміст γινώσκω.
theological_decisions:
- issue: Значення κύριος у побутовому контексті притчі
  choice: господар
  alternative: пан; Господь
  rationale: Безпосередньо слово називає людського господаря раба в сюжеті притчі. Есхатологічне застосування притчі не вимагає перетворювати це слово в самій оповіді на явний божественний титул.
- issue: Передача δοῦλος
  choice: раб
  alternative: слуга; невільник
  rationale: Домашня владна структура «господар — раб» робить невільний статус контекстуально значущим; «слуга» міг би надмірно пом’якшити цей образ.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Збережено риторичну паралель «в день… і в годину…». Займенник «той» усуває можливу українську двозначність і вказує, що не очікує та не знає саме раб.
