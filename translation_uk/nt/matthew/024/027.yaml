  source_fidelity: Основний вислів «поява» звужує παρουσία до явлення й додатково стилістично підлаштовує його під образ блискавки. У цьому контексті точнішим і нейтральнішим відповідником є «прихід», із збереженням лексичної альтернативи в примітці. Порівняльний висновок природніше передати конструкцією «так буде і з приходом…».
  naturalness: «Такою буде й поява Сина Людського» граматично можливо, але звучить дещо штучно й семантично зсуває акцент на «появу». «Так буде і з приходом Сина Людського» є природним сучасним українським оформленням порівняння. «Її видно аж до заходу» дещо плавніше за предикативне «видна».
  terminology: Усталений титул «Син Людський» слід зберегти. «Прихід» адекватно передає παρουσία в цьому есхатологічному вживанні, не усуваючи ширшого значення «присутність», яке належить подати у примітці.
