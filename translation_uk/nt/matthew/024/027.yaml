  text: ὥσπερ γὰρ ἡ ἀστραπὴ ἐξέρχεται ἀπὸ ἀνατολῶν καὶ φαίνεται ἕως δυσμῶν, οὕτως ⸀ἔσται ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/027.yaml
  text: For just as the lightning comes from the east and is seen as far as the west[a], so will the coming of the Son of Man be.
translation:
  language: uk
  text: Адже як блискавка з’являється зі сходу й її видно аж до заходу, так буде і з приходом[a] Сина Людського.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «присутністю». Грецьке слово παρουσία може означати «присутність» або «прибуття»; тут у контексті воно стосується майбутнього приходу Сина Людського.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Адже як
  rationale: «Адже» природно передає пояснювальне γάρ, а «як» вводить порівняння ὥσπερ без зайвої буквальності.
- source_word: ἀστραπή
  choice: блискавка
  rationale: Звичайне й точне позначення блискавки як природного явища в цьому порівнянні.
- source_word: ἐξέρχεται
  choice: з’являється
  rationale: Дієслово буквально означає «виходить», але щодо блискавки природне українське «з’являється» передає її раптовий вихід у видимість.
- source_word: ἀπὸ ἀνατολῶν
  choice: зі сходу
  rationale: У протиставленні з δυσμῶν множинна форма ἀνατολῶν має чітке просторове значення «схід».
- source_word: φαίνεται
  choice: видна
  rationale: Передає пасивно-стативний зміст «її видно» та підкреслює відкриту видимість явища, не додаючи значення «сяє».
- source_word: ἕως δυσμῶν
  choice: аж до заходу
  rationale: «Аж до» зберігає значення просторової межі ἕως, а «захід» природно передає δυσμαί у парі зі сходом.
- source_word: οὕτως ἔσται
  choice: такою буде
  rationale: Узгодження з іменником жіночого роду «поява» природно оформлює порівняльний висновок і зберігає майбутній час.
- source_word: παρουσία
  choice: поява
  rationale: У цьому есхатологічному контексті слово позначає майбутню явну появу/прибуття Сина Людського. «Поява» вдало пов’язує подію з образом видимої блискавки, а ширше значення «присутність» збережено в примітці.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Сина Людського
  rationale: Усталений український відповідник титульного вислову, який зберігає його біблійні та інтертекстуальні зв’язки.
theological_decisions:
- issue: Передача παρουσία в есхатологічному вислові
  choice: поява
  alternative: прихід; присутність
  rationale: Порівняння з блискавкою наголошує на явній і безпомилково видимій майбутній події. «Поява» передає цю подієвість, не нав’язуючи вузької есхатологічної схеми; лексичну можливість «присутність» зазначено в примітці.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Конструкція «видна аж до заходу» стисло передає загальнодоступний, широкий характер видимості; титул «Син Людський» збережено в усталеній біблійній формі.
