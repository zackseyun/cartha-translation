  to: Адже як блискавка з’являється зі сходу й її видно аж до заходу, так буде і з приходом[a] Сина Людського.
  rationale: Змінено «поява» на «прихід», щоб точніше передати παρουσία без інтерпретативного звуження. Перебудовано другу частину речення відповідно до природної української моделі порівняння. У примітці збережено релевантну лексичну альтернативу «присутність» і зазначено значення «прибуття».
