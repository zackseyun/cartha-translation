source:
  edition: SBLGNT
  text: ἐὰν οὖν εἴπωσιν ὑμῖν· Ἰδοὺ ἐν τῇ ἐρήμῳ ἐστίν, μὴ ἐξέλθητε· Ἰδοὺ ἐν τοῖς ταμείοις, μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/026.yaml
  text: Therefore[a], if they say to you, ‘Look, he is in the wilderness,’ do not go out; ‘Look[c][b], he is in the inner rooms,’ do not believe it.
translation:
  language: uk
  text: 'Отже, якщо вам скажуть: «Ось він у пустелі», — не виходьте; «Ось він у внутрішніх кімнатах», — не вірте.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Отже, якщо
  rationale: οὖν пов’язує вислів із попереднім застереженням як висновок, а ἐὰν вводить умовну ситуацію; цей порядок природний для сучасної української.
- source_word: εἴπωσιν ὑμῖν
  choice: вам скажуть
  rationale: Третя особа множини має неозначений характер і не вказує на конкретну групу; українська безособово-неозначена конструкція точно передає це.
- source_word: Ἰδοὺ
  choice: Ось
  rationale: ἰδού привертає увагу й указує на нібито місцеперебування; «ось» природно та не має архаїчного відтінку.
- source_word: ἐν τῇ ἐρήμῳ
  choice: у пустелі
  rationale: ἔρημος означає пустельну, безлюдну місцевість; «пустеля» є звичним біблійним відповідником, не обов’язково позначаючи лише піщану пустелю.
- source_word: ἐστίν
  choice: Він
  rationale: У грецькому тексті підмет мається на увазі з контексту. Українською його доречно виразити займенником, не додаючи титулу чи імені.
- source_word: μὴ ἐξέλθητε
  choice: не виходьте
  rationale: Аористовий кон’юнктив із μή виражає заборону, а ἐξέρχομαι — рух назовні; «не виходьте» передає обидва значення прямо.
- source_word: ἐν τοῖς ταμείοις
  choice: у внутрішніх кімнатах
  rationale: ταμεῖον може означати внутрішню, приватну кімнату, комору або потаємне приміщення. «Внутрішні кімнати» зберігає просторовий образ без надмірного наголосу на таємності.
- source_word: μὴ πιστεύσητε
  choice: не вірте
  rationale: πιστεύω тут означає прийняти повідомлене твердження за правду. В українській мові об’єкт легко відновлюється з контексту, тому додавати «цьому» не обов’язково.
theological_decisions:
- issue: Неявний підмет при ἐστίν
  choice: Передано займенником «Він» без доданого титулу.
  alternative: «Месія там» або «Він там».
  rationale: Контекст указує на заявлену присутність Ісуса/Месії, однак у самій фразі титул відсутній. Займенник робить українське речення граматично природним, не усуваючи властивої оригіналу неявності референта.
- issue: Співвідношення двох повідомлень
  choice: Збережено два паралельні вислови під одним умовним вступом, розділені крапкою з комою без доданого «або».
  alternative: Додати «або» перед другим повідомленням.
  rationale: Грецький текст повторює Ἰδοὺ, але не містить явного розділового сполучника; пунктуація показує паралельність, не додаючи логічного зв’язку, якого прямо немає.
translation_notes:
  register: Сучасна стандартна українська, урочиста, але доступна. Великою літерою в займеннику «Він» позначено контекстуального референта відповідно до усталеного українського біблійного оформлення; жодного титулу до тексту не додано.
