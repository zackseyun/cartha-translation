  text: ἰδοὺ προείρηκα ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/025.yaml
  text: Look, I have told you beforehand.
translation:
  language: uk
  text: Ось, Я сказав вам про це наперед.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: Ось
  rationale: Природний і гідний український покажчик, що привертає увагу; тут він краще відповідає контексту за буквальне «погляньте».
- source_word: προείρηκα
  choice: сказав … наперед
  rationale: 'Передає доконаний перфектний зміст: Ісус уже заздалегідь повідомив учнів, і сказане залишається для них застереженням.'
- source_word: ὑμῖν
  choice: вам
  rationale: Прямий відповідник давального відмінка множини.
theological_decisions:
- issue: Неявний додаток при дієслові προείρηκα
  choice: «про це» додано для природності української мови
  alternative: «Ось, Я сказав вам наперед»
  rationale: У грецькому тексті об’єкт визначається попереднім застереженням; «про це» робить зв’язок природним, не додаючи нового богословського змісту.
translation_notes:
  register: Сучасна стандартна українська; стисло, урочисто без архаїзації. Займенник «Я» пишеться з великої літери як усталена видавнича шана до Христа, без зміни змісту оригіналу.
