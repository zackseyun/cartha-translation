lexical_decisions:
- source_word: οὐαὶ
  choice: Горе
  rationale: Зберігає сильний пророчий вигук, що передає і скорботу, і наближення тяжкого лиха.
- source_word: δὲ
  choice: ж
  rationale: Природно позначає м’який перехід у контексті, не створюючи надмірно різкого протиставлення.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: вагітним
  rationale: Стисло й природно передає грецьку ідіому «мати в утробі» та жіночий референт форми.
- source_word: ταῖς θηλαζούσαις
  choice: тим, хто годуватиме грудьми
  rationale: Природно передає дію θηλάζω; майбутній вид українського дієслова в підрядній конструкції узгоджується з майбутньою часовою перспективою вислову, не змінюючи його референта.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: в ті дні
  rationale: Прямий, природний і стилістично відповідний часовий вислів.
theological_decisions:
- issue: Референт жіночих давальних форм і дієприкметників
  choice: Передати як «вагітним і тим, хто годуватиме грудьми», не додаючи іменника «жінки».
  alternative: «вагітним жінкам і жінкам, які годуватимуть грудьми»
  rationale: Грецькі форми однозначно жіночого роду, але українська дозволяє природно передати їх субстантивованим прикметником і займенниковою конструкцією без додавання відсутнього в оригіналі іменника. Увага залишається на особливо вразливому стані цих людей у час лиха.
translation_notes:
  register: Сучасна стандартна українська; стислий, урочистий і зрозумілий біблійний виклад. Окличний знак передає силу οὐαί. Виноска не потрібна, оскільки українське «вагітним» уже граматично й семантично чітко вказує на жінок, а розгорнута альтернатива не додає змістової неоднозначності.
