lexical_decisions:
- source_word: ὥσπερ ... οὕτως
  choice: як ... так
  rationale: Природно й точно передає співвідносну конструкцію порівняння; «як було» відтворює еліптичний грецький зворот зрозуміло для сучасного читача.
- source_word: γὰρ
  choice: Бо
  rationale: Зберігає пояснювальний зв’язок із попереднім контекстом.
- source_word: αἱ ἡμέραι τοῦ Νῶε
  choice: за днів Ноя
  rationale: Усталений природний український вислів для позначення часу Ноя; разом із доданим «було» передає грецьку еліптичну конструкцію без уточнення того, що саме відбувалося.
- source_word: Νῶε
  choice: Ноя
  rationale: Нормативна українська форма біблійного імені в родовому відмінку.
- source_word: ἔσται
  choice: буде
  rationale: Прямо передає майбутню форму дієслова εἰμί, не додаючи зайвого тлумачення.
- source_word: παρουσία
  choice: прихід
  rationale: У цьому есхатологічному контексті слово означає майбутнє прибуття/явлення Сина Людського; «прихід» є ясним і звичним відповідником, а ширшу можливість «присутність» зазначено у примітці.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Сина Людського
  rationale: Зберігає усталений титул і його зв’язок із біблійною традицією, не замінюючи його тлумачним відповідником.
theological_decisions:
- issue: Передача παρουσία в есхатологічному вислові
  choice: прихід
  alternative: присутність; прибуття
  rationale: Контекст указує на майбутню есхатологічну подію, тому «прихід» природно передає подієвий зміст. Водночас лексичну можливість значення «присутність» збережено в примітці, щоб не приховувати широту грецького слова.
translation_notes:
  register: Сучасна стандартна українська, стислий і гідний біблійний стиль. Конструкція «як було за днів Ноя, так буде» природно відтворює грецьку еліптичність; частка «й» підсилює співвіднесення двох частин порівняння.
