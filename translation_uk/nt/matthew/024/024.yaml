  text: ἐγερθήσονται γὰρ ψευδόχριστοι καὶ ψευδοπροφῆται, καὶ δώσουσιν σημεῖα μεγάλα καὶ τέρατα ὥστε ⸀πλανῆσαι εἰ δυνατὸν καὶ τοὺς ἐκλεκτούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/024.yaml
  text: For false messiahs and false prophets will arise[a], and they will perform great signs and wonders so as to lead astray, if possible[c][b], even the elect.
translation:
  language: uk
  text: Бо постануть лжемесії[a] та лжепророки й чинитимуть великі знамення та чудеса, щоб, якщо можливо[c], ввести в оману[b] навіть обраних.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «лжехристи». У грецькому тексті вжито титул «Христос»; тут його передано словом «месії», оскільки йдеться про титул, а не ім’я.'
    reason: alternative_reading
  - marker: b
    text: 'Або: «звести зі шляху». Дієслово може означати змусити когось заблукати чи збитися з правильного шляху, а звідси — ввести в оману.'
    reason: lexical_alternative
  - marker: c
    text: 'Або: «якби це було можливо». Грецький текст буквально каже «якщо можливо», не уточнюючи богословського висновку.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγερθήσονται
  choice: постануть
  rationale: У цьому контексті пасивна форма ἐγείρω ідіоматично означає появу або виступ певних осіб; «постануть» природно передає це, не натякаючи на воскресіння.
- source_word: ψευδόχριστοι
  choice: лжемесії
  rationale: Χριστός тут ужито як титул, тому «месії» зберігає титулярний і юдейський контекст; префікс ψευδο- передано як «лже-».
- source_word: ψευδοπροφῆται
  choice: лжепророки
  rationale: Прямий і усталений український відповідник складного іменника.
- source_word: δώσουσιν
  choice: чинитимуть
  rationale: Буквально дієслово означає «дадуть», але в сполученні зі знаменнями та чудесами йдеться про їх здійснення; «чинитимуть» природно передає цю ідіому.
- source_word: σημεῖα μεγάλα
  choice: великі знамення
  rationale: «Знамення» зберігає значення знака чи доказового явища, не звужуючи його просто до дива; μεγάλα передано як «великі».
- source_word: τέρατα
  choice: чудеса
  rationale: «Чудеса» природно передає разючі, надзвичайні явища й добре поєднується зі «знаменнями».
- source_word: ὥστε πλανῆσαι
  choice: щоб ... ввести в оману
  rationale: Конструкція ὥστε з інфінітивом допускає відтінок мети або наслідку; українське «щоб» тут природне, не усуваючи повністю цієї смислової широти.
- source_word: πλανῆσαι
  choice: ввести в оману
  rationale: Передає спричинення хибного шляху чи помилки; примітка фіксує близький варіант «звести зі шляху».
- source_word: εἰ δυνατὸν
  choice: якщо можливо
  rationale: Дослівно зберігає стислу умовну фразу, не додаючи контрфактичного відтінку.
- source_word: καὶ τοὺς ἐκλεκτούς
  choice: навіть обраних
  rationale: καί має підсилювальне значення «навіть», а ἐκλεκτούς природно й прозоро передається як «обраних».
theological_decisions:
- issue: Передача ψευδόχριστοι як титулу
  choice: лжемесії
  alternative: лжехристи
  rationale: У цьому контексті Χριστός позначає претендента на месіанський титул, а не функціонує як ім’я; «лжемесії» ясніше зберігає цей сенс.
- issue: Умовна сила εἰ δυνατὸν стосовно обраних
  choice: якщо можливо
  alternative: якби це було можливо
  rationale: Грецький текст не уточнює, чи умова мислиться як нездійсненна. Пряме формулювання зберігає богословську напругу й не вирішує її на користь певної системи.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. «Лжемесії» та «лжепророки» компактно відтворюють грецькі складні слова; «обрані» прозоріше для широкого читача, ніж субстантивоване «вибрані». Порядок приміток у тексті узгоджено з місцями, яких вони стосуються.
