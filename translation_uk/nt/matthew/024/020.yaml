id: MAT.24.20
reference: Matthew 24:20
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: προσεύχεσθε δὲ ἵνα μὴ γένηται ἡ φυγὴ ὑμῶν χειμῶνος μηδὲ σαββάτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/020.yaml
  text: But pray that your flight may not happen in winter or on a Sabbath[a].
translation:
  language: uk
  text: Але моліться, щоб ваша втеча не сталася взимку чи в суботу[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «у день суботній».'
    reason: Альтернативний спосіб передати σαββάτῳ; українська мова не відтворює протиставлення англійських «a Sabbath / the Sabbath» за допомогою артикля.
lexical_decisions:
- source_word: προσεύχεσθε
  choice: моліться
  rationale: Теперішній наказовий спосіб, друга особа множини; «моліться» природно передає наказ, не нав’язуючи окремо тривалого значення.
- source_word: δὲ
  choice: Але
  rationale: Передає легке протиставлення або перехід від попереднього застереження.
- source_word: ἵνα μὴ γένηται
  choice: щоб ... не сталася
  rationale: ἵνα з аористом кон’юнктива виражає зміст молитви; українське «щоб не сталася» природно передає подієве значення γίνομαι.
- source_word: ἡ φυγὴ ὑμῶν
  choice: ваша втеча
  rationale: «Втеча» точно й стисло передає φυγή, не додаючи значення успішного порятунку.
- source_word: χειμῶνος
  choice: взимку
  rationale: Родовий відмінок часу природно передається українським прислівником «взимку».
- source_word: μηδὲ σαββάτῳ
  choice: чи в суботу
  rationale: μηδέ приєднує другу небажану обставину, а давальний σαββάτῳ позначає день; українська назва дня «в суботу» природно вживається без артиклевого розрізнення.
theological_decisions:
- issue: Означеність σαββάτῳ
  choice: в суботу
  alternative: у день суботній
  rationale: Грецька форма не має артикля, але українська не виражає означеність артиклем. «В суботу» природно зберігає посилання на суботній день, не вирішуючи штучно питання означеності; стилістичну альтернативу подано в примітці.
translation_notes:
  register: Сучасна стандартна українська, стислий і гідний біблійний стиль. «Втеча» зберігає предметність грецького іменника, а «не сталася» звучить природніше, ніж буквальне «не була».
