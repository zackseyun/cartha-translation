reference: Matthew 24:3
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Καθημένου δὲ αὐτοῦ ἐπὶ τοῦ Ὄρους τῶν Ἐλαιῶν προσῆλθον αὐτῷ οἱ μαθηταὶ κατ’ ἰδίαν λέγοντες· Εἰπὸν ἡμῖν πότε ταῦτα ἔσται, καὶ τί τὸ σημεῖον τῆς σῆς παρουσίας ⸀καὶ συντελείας τοῦ αἰῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/003.yaml
  text: As he was sitting on the Mount of Olives[a], the disciples came to him privately, saying, “Tell us, when will these things be[b], and what will be the sign of your coming and of the end of the age?”
translation:
  language: uk
  text: 'Коли Він сидів на Оливній горі, учні підійшли до Нього наодинці й запитали: «Скажи нам, коли все це станеться і яка буде ознака Твого приходу[a] та кінця віку[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «Твоєї присутності» чи «Твого прибуття».
    reason: lexical_alternative
  - marker: b
    text: Або «завершення віку»; традиційно — «кінця світу».
    reason: alternative_reading
lexical_decisions:
- source_word: Καθημένου δὲ αὐτοῦ
  choice: Коли Він сидів
  rationale: Родовий абсолют природно передано підрядним реченням часу; недоконаний вид дієслова зберігає тривалість дії.
- source_word: ἐπὶ τοῦ Ὄρους τῶν Ἐλαιῶν
  choice: на Оливній горі
  rationale: Усталена й природна українська назва місцевості, що точно передає грецький топонім.
- source_word: προσῆλθον αὐτῷ
  choice: підійшли до Нього
  rationale: Передає спрямований рух до Ісуса й природно звучить у сучасній українській оповіді.
- source_word: κατ’ ἰδίαν
  choice: наодинці
  rationale: Стисло передає значення розмови окремо від інших.
- source_word: λέγοντες
  choice: й запитали
  rationale: У цьому контексті дієприкметник вводить пряме запитання; функціональний відповідник усуває неприродне українське «кажучи» без зміни змісту.
- source_word: Εἰπὸν ἡμῖν
  choice: Скажи нам
  rationale: Природний відповідник наказової форми в проханні учнів.
- source_word: πότε ταῦτα ἔσται
  choice: коли це станеться
  rationale: Ідіоматично передає майбутню подію; українське «це» природно узагальнює множинне ταῦτα в цьому контексті.
- source_word: σημεῖον
  choice: ознака
  rationale: Звичний український відповідник для вказівної події або явища в есхатологічному контексті.
- source_word: παρουσίας
  choice: приходу
  rationale: У запитанні про майбутнє найприродніше передає появу або прибуття Ісуса, не визначаючи подробиць події; інші лексичні можливості подано у примітці.
- source_word: συντελείας τοῦ αἰῶνος
  choice: кінця віку
  rationale: Передає завершення певної епохи, не підмінюючи αἰών словом «світ» і не додаючи твердження про знищення фізичного світу.
theological_decisions:
- issue: Значення παρουσία в есхатологічному запитанні
  choice: приходу
  alternative: присутності; прибуття
  rationale: «Прихід» природно виражає спрямованість запитання в майбутнє, водночас примітка зберігає ширший лексичний діапазон грецького слова й не уточнює спосіб або час події.
- issue: Значення συντελείας τοῦ αἰῶνος
  choice: кінця віку
  alternative: завершення віку; традиційно — кінця світу
  rationale: Грецький вислів означає завершення епохи. Такий переклад не вносить сильнішого космологічного твердження, якого сам вислів прямо не містить.
translation_notes:
  register: Сучасна літературна українська з гідним, але не архаїчним звучанням. Займенники щодо Ісуса написано з великої літери відповідно до поширеної української біблійної практики. Маркери приміток поставлено безпосередньо після слів, яких вони стосуються.
