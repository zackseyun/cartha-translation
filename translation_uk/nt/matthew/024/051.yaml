  text: and will cut him in two and assign his place with the hypocrites[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: uk
  text: і розітне його надвоє, і призначить йому частку разом із лицемірами.[a][b] Там буде плач і скрегіт зубів.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або, передаючи можливий переносний зміст: «суворо покарає його». Грецьке дієслово буквально означає «розітне надвоє».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «призначить його частку разом із лицемірами». «Частка» також може означати призначену долю або уділ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διχοτομήσει
  choice: розітне його надвоє
  rationale: Збережено пряме й разюче значення дієслова — «розітнути надвоє», не замінюючи образ загальним формулюванням про суворе покарання.
- source_word: τὸ μέρος αὐτοῦ ... θήσει
  choice: визначить йому частку
  rationale: «Частка» безпосередньо передає μέρος і водночас природно виражає призначену долю, не звужуючи її лише до місця.
- source_word: ὑποκριτῶν
  choice: лицемірами
  rationale: Усталений український відповідник зберігає характерну для Матвія назву людей, чия зовнішня праведність є удаваною.
- source_word: ἐκεῖ
  choice: там
  rationale: Стислий природний прислівник точно вказує на щойно згадану долю або сферу суду.
- source_word: κλαυθμὸς
  choice: плач
  rationale: Точний і усталений відповідник у повторюваній формулі Євангелія від Матвія.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: скрегіт зубів
  rationale: Природний і традиційний український відповідник яскравого грецького вислову.
theological_decisions:
- issue: Чи пом’якшувати διχοτομήσει до загального вислову про суворе покарання
  choice: Зберегти конкретне «розітне його надвоє» в основному тексті
  alternative: «суворо покарає його»
  rationale: Грецьке дієслово має виразне буквальне значення. Його збереження передає силу перестороги, не нав’язуючи пояснення, чи слід образ розуміти буквально або переносно.
- issue: Як передати τὸ μέρος αὐτοῦ ... θήσει
  choice: «визначить йому частку з лицемірами»
  alternative: «визначить йому місце серед лицемірів»
  rationale: «Частка» ближча до μέρος і зберігає неоднозначність між часткою, долею та місцем, тоді як дієслово «визначить» передає акт призначення.
translation_notes:
  register: Сучасна, зрозуміла й урочиста українська мова. Конкретність суворого образу збережено; неприродну українською буквальну конструкцію з θήσει передано дієсловом «визначить». Маркери приміток поставлено після відповідних висловів.
