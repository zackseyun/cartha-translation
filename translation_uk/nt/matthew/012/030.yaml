  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/030.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: uk
  text: Хто не зі Мною, той проти Мене, і хто не збирає зі Мною, той розсіює.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὴ ὢν
  choice: хто не …, той
  rationale: Субстантивований артикль із дієприкметником позначає будь-яку людину з названою ознакою. Українська співвідносна конструкція «хто …, той» природно й виразно передає узагальнене значення однини.
- source_word: μετ’ ἐμοῦ
  choice: зі Мною
  rationale: μετά з родовим відмінком виражає належність, єдність або спільну дію. «Зі Мною» прямо передає цей зв’язок, не звужуючи його до пояснювального «на Моєму боці».
- source_word: κατ’ ἐμοῦ
  choice: проти Мене
  rationale: κατά з родовим відмінком тут означає протистояння; «проти Мене» є точним і природним українським відповідником.
- source_word: συνάγων
  choice: збирає
  rationale: Дієприкметник означає збирання докупи. «Збирає» зберігає лаконічність і можливу образність, не уточнюючи без потреби, що або кого збирають.
- source_word: σκορπίζει
  choice: розсіює
  rationale: Дієслово означає розкидати або змушувати розійтися. «Розсіює» утворює природну антитезу до «збирає» й не додає невираженого додатка.
- source_word: καὶ
  choice: і
  rationale: Сполучник поєднує два паралельні твердження додавально; «і» точно відтворює цю координацію.
theological_decisions:
- issue: Безкомпромісність протиставлення щодо ставлення до Ісуса
  choice: 'Збережено категоричне протиставлення: хто не з Ісусом, той проти Нього; хто не збирає з Ним, той розсіює.'
  alternative: Передати вислів вільніше, пом’якшивши абсолютність протиставлення.
  rationale: Грецький текст містить дві різкі паралельні тези без будь-якого пом’якшення. Переклад зберігає цю богословську напругу, не додаючи подальших доктринальних висновків.
translation_notes:
  register: Сучасна стандартна українська мова; вислів лаконічний, урочистий і зрозумілий. Конструкція «хто …, той» звучить природніше за буквальне «той, хто» у двох симетричних частинах. Великі літери в займенниках щодо Ісуса відповідають поширеній українській біблійній видавничій традиції та не змінюють змісту.
