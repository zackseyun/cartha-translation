id: MAT.12.23
reference: Matthew 12:23
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: καὶ ἐξίσταντο πάντες οἱ ὄχλοι καὶ ἔλεγον· Μήτι οὗτός ἐστιν ὁ υἱὸς Δαυίδ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/023.yaml
  text: And all the crowds were astonished and said[b][a], “Can this be the Son of David?”
translation:
  language: uk
  text: 'І всі натовпи дивувалися й казали: «Невже[b] це Син Давида[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Син Давида» — месіанський титул, що вказує на обіцяного царя-визволителя з роду Давида.
    reason: cross_reference
  - marker: b
    text: 'Або, з виразнішим відтворенням очікуваної заперечної відповіді: «Хіба це Син Давида?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: дивувалися
  rationale: Недоконаний вид передає тривалу або спільну реакцію подиву; «дивувалися» природно звучить у сучасній українській і не послаблює сили дієслова.
- source_word: πάντες οἱ ὄχλοι
  choice: всі натовпи
  rationale: Збережено виразний у грецькому тексті множинний іменник ὄχλοι, хоча українською можливе й узагальнене «весь народ».
- source_word: ἔλεγον
  choice: казали
  rationale: Форма недоконаного виду природно передає тривалу чи повторювану мову людей без надмірного уточнення «продовжували казати».
- source_word: Μήτι
  choice: Невже
  rationale: Частка вводить запитання з відтінком сумніву й очікуванням заперечної відповіді; «невже» природно передає здивоване, нерішуче припущення, не перетворюючи його на категоричне заперечення.
- source_word: ὁ υἱὸς Δαυίδ
  choice: Син Давида
  rationale: Збережено усталений месіанський титул і його буквальну форму, не замінюючи тлумачним словом «Месія».
theological_decisions:
- issue: Месіанське значення вислову «Син Давида»
  choice: Зберегти в основному тексті титул «Син Давида».
  alternative: Месія; обіцяний нащадок Давида
  rationale: Грецький текст уживає сам титул, тому переклад зберігає його історичне й богословське напруження, а значення пояснює примітка.
- issue: Спрямованість запитання з Μήτι
  choice: Передати як здивоване й нерішуче «Невже це…?»
  alternative: «Хіба це Син Давида?» або «Напевно, це не Син Давида?»
  rationale: Μήτι зазвичай передбачає заперечну відповідь, але в цьому контексті натовпи висловлюють приголомшене припущення. Обраний варіант зберігає сумнів, не роблячи заперечення категоричним.
translation_notes:
  register: Сучасна стандартна українська; виклад природний, стислий і гідний. Множину «натовпи» збережено відповідно до грецького тексту, а месіанський титул не замінено пояснювальним перефразуванням.
