  text: τότε λέγει τῷ ἀνθρώπῳ· Ἔκτεινόν ⸂σου τὴν χεῖρα⸃· καὶ ἐξέτεινεν, καὶ ἀπεκατεστάθη ὑγιὴς ὡς ἡ ἄλλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/013.yaml
  text: Then he says to the man[a], “Stretch out your hand.” And he stretched it out, and it was restored[b], healthy like the other one.
translation:
  language: uk
  text: 'Тоді Він каже чоловікові: «Простягни руку». Той простягнув її, і вона відновилася[a], здорова, як друга[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «була зцілена»; грецьке дієслово наголошує на відновленні до належного стану.
    reason: lexical_alternative
  - marker: b
    text: Буквально «здоровою, як друга»; під «другою» мається на увазі друга рука чоловіка.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Тоді
  rationale: Природно передає часову послідовність розповіді.
- source_word: λέγει
  choice: Він каже
  rationale: Збережено грецький історичний теперішній час, який надає оповіді виразності.
- source_word: τῷ ἀνθρώπῳ
  choice: чоловікові
  rationale: У контексті йдеться про конкретного чоловіка.
- source_word: Ἔκτεινόν
  choice: Простягни
  rationale: Прямий наказ природно описує потрібну фізичну дію.
- source_word: σου τὴν χεῖρα
  choice: руку
  rationale: Українська форма наказу вже виражає належність до адресата, тому займенник «свою» не обов’язковий; χείρ тут означає руку.
- source_word: ἐξέτεινεν
  choice: простягнув її
  rationale: Збережено повтор дієслова між наказом і виконанням, а займенник уточнює об’єкт.
- source_word: ἀπεκατεστάθη
  choice: відновилася
  rationale: Дієслово наголошує на поверненні руки до належного стану, а не лише загально на зціленні.
- source_word: ὑγιὴς
  choice: ставши здоровою
  rationale: Передає стан здоров’я руки й природно поєднується українською з попереднім дієсловом.
- source_word: ὡς ἡ ἄλλη
  choice: як і друга
  rationale: Форма жіночого роду вказує на іншу руку; «друга» стисло й природно зберігає цей неявний референт.
theological_decisions:
- issue: Характер опису зцілення
  choice: Рука відновилася і стала здоровою.
  alternative: Рука була зцілена / стала цілою.
  rationale: Переклад передає чудесне повернення руки до належного здорового стану, не додаючи доктринального тлумачення понад формулювання тексту.
translation_notes:
  register: Сучасна стандартна українська; оповідь має ясний, гідний і природний стиль. Історичний теперішній час збережено. Займенник «Він» написано з великої літери відповідно до поширеної української біблійної традиції, без додавання імені, якого немає в цьому реченні.
