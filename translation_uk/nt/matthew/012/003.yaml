base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/003.yaml
  text: But he said to them[a], “Have you not read what David did when he was hungry, and those with him were hungry?”
translation:
  language: uk
  text: 'А Він сказав їм: «Хіба ви не читали, що зробив Давид, коли він зголоднів, а ті, хто був із ним?[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «коли він і ті, хто був із ним, зголодніли». У грецькому тексті дієслово «зголоднів» стоїть в однині й прямо стосується Давида, хоча його можна розуміти як таке, що за змістом стосується також тих, хто був із ним.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: А Він
  rationale: Частка δέ тут м’яко позначає перехід до відповіді Ісуса; українське «А» природно передає цей зв’язок без надмірного протиставлення.
- source_word: εἶπεν αὐτοῖς
  choice: сказав їм
  rationale: Прямий і природний відповідник λέγω з давальним αὐτοῖς.
- source_word: Οὐκ ἀνέγνωτε
  choice: Хіба ви не читали
  rationale: Риторичне запитання апелює до знання Писання; конструкція «Хіба ви не читали» природно передає цей докір у сучасній українській.
- source_word: τί ἐποίησεν
  choice: що зробив
  rationale: Передає просте історичне значення ποιέω без зайвого уточнення.
- source_word: Δαυὶδ
  choice: Давид
  rationale: Усталена українська форма біблійного імені.
- source_word: ὅτε ἐπείνασεν
  choice: коли … зголодніли
  rationale: πεινάω означає відчувати голод; «зголодніли» тут звучить природно й у контексті охоплює Давида та його супутників, тоді як формальну особливість однини в грецькому тексті збережено в примітці.
- source_word: καὶ οἱ μετ’ αὐτοῦ
  choice: і ті, хто був із ним
  rationale: Близько відтворює артикльовану конструкцію «ті, хто з ним», не вводячи конкретнішого тлумачення на кшталт «його товариші».
theological_decisions:
- issue: Чи стосується голод лише Давида, чи також тих, хто був із ним
  choice: Основний текст природно відносить голод до Давида і тих, хто був із ним.
  alternative: Грецьке дієслово ἐπείνασεν стоїть в однині й прямо називає Давида тим, хто зголоднів; подальшу фразу можна лишити синтаксично еліптичною.
  rationale: Контекст і координована фраза допускають застосування стану голоду до всієї групи, однак однина дієслова створює справжню граматичну неоднозначність, яку не слід приховувати.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Риторичне «Хіба ви не читали» передає полемічний тон, а примітка зберігає граматичну неоднозначність оригіналу.
