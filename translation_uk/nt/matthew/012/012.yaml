source:
  edition: SBLGNT
  text: πόσῳ οὖν διαφέρει ἄνθρωπος προβάτου. ὥστε ἔξεστιν τοῖς σάββασιν καλῶς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/012.yaml
  text: How much more valuable[a], then, is a man than a sheep! So it is lawful to do good on the Sabbaths.
translation:
  language: uk
  text: Наскільки ж цінніша людина за вівцю! Отже, у суботу[a] дозволено робити добро.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'У грецькому тексті — множина: «по суботах»; ця форма часто вживається як усталений вислів зі значенням «у суботу».'
    reason: Пояснення граматичної форми та ідіоматичного значення оригіналу.
lexical_decisions:
- source_word: πόσῳ οὖν
  choice: Наскільки ж
  rationale: Передає риторичне порівняння від меншого до більшого та висновковий зв’язок із попереднім прикладом; частка «ж» природно відтворює οὖν у цьому вигуку.
- source_word: διαφέρει
  choice: цінніша
  rationale: У контексті йдеться не просто про відмінність, а про вищу цінність людини порівняно з вівцею.
- source_word: ἄνθρωπος
  choice: людина
  rationale: Звичайне українське позначення людської істоти; однина зберігає узагальнювальний характер вислову без невиправданого звуження до чоловічої статі.
- source_word: προβάτου
  choice: за вівцю
  rationale: Природна українська конструкція порівняння, що передає грецький родовий відмінок після διαφέρει.
- source_word: ὥστε
  choice: Отже
  rationale: Чітко передає висновок, який випливає з порівняння людини з вівцею.
- source_word: ἔξεστιν
  choice: дозволено
  rationale: Зберігає правовий відтінок суперечки про суботу й звучить природніше українською, ніж буквальне «є законним».
- source_word: τοῖς σάββασιν
  choice: в суботу
  rationale: Грецька форма множини є звичним ідіоматичним позначенням суботи або її дотримання; українська однина природно передає цей зміст, а форму оригіналу зазначено у примітці.
- source_word: καλῶς ποιεῖν
  choice: робити добро
  rationale: Природний український вислів, який близько передає доброчинну дію, виражену грецьким словосполученням.
theological_decisions:
- issue: Узагальнювальне значення ἄνθρωπος
  choice: людина
  alternative: чоловік
  rationale: У протиставленні вівці й людської істоти слово має родове значення; «людина» точно зберігає його без внесення твердження, що йдеться лише про чоловіка.
- issue: Множина у вислові τοῖς σάββασιν
  choice: в суботу
  alternative: по суботах
  rationale: Множина в грецькій може бути усталеним семітсько-грецьким зворотом для суботи як дня її дотримання. Однина природніша в сучасній українській і не створює зайвого наголосу на повторюваності; формальну особливість збережено в примітці.
- issue: Правовий відтінок ἔξεστιν
  choice: дозволено
  alternative: законно
  rationale: «Дозволено» передає питання допустимості згідно із суботнім приписом, не уточнюючи понад текст, ким саме це дозволено і в якому формальному правовому сенсі.
translation_notes:
  register: Сучасна нормативна українська мова, урочиста без архаїзації. Риторичну силу першого речення передано знаком оклику; висновковий зв’язок — словом «Отже».
