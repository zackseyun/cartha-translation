  source_fidelity: Переклад точно передає протиставний δέ («А»), часово-обставинний аористовий дієприкметник ἀκούσαντες («почувши це»), зневажливий вказівний займенник Οὗτος («Цей»), заперечну виняткову конструкцію οὐκ ... εἰ μὴ («не інакше як») та означення «володаря демонів». «Силою Вельзевула» є природним українським відтворенням ἐν у значенні засобу/дії через когось і не виходить за межі звинувачення фарисеїв.
