source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἀκούσαντες εἶπον· Οὗτος οὐκ ἐκβάλλει τὰ δαιμόνια εἰ μὴ ἐν τῷ Βεελζεβοὺλ ἄρχοντι τῶν δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/024.yaml
  text: But when the Pharisees heard it[a], they said, “This man does not cast out demons except by Beelzebul, the ruler of the demons.”
translation:
  language: uk
  text: 'А фарисеї, почувши це, сказали: «Цей виганяє демонів не інакше як силою Вельзевула[a], володаря демонів».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиційна форма імені: «Вельзевуб».'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: А
  rationale: Передає протиставлення між попередньою реакцією людей і ворожою відповіддю фарисеїв природним українським сполучником.
- source_word: ἀκούσαντες
  choice: почувши це
  rationale: Дієприслівникова форма природно передає аористовий дієприкметник; «це» відновлює зрозумілий із контексту об’єкт слухання.
- source_word: Οὗτος
  choice: Цей
  rationale: Зберігає вказівний і дещо зневажливий тон вислову фарисеїв, не додаючи до тексту окремого іменника.
- source_word: ἐκβάλλει τὰ δαιμόνια
  choice: виганяє демонів
  rationale: Прямий і зрозумілий відповідник усталеного вислову про вигнання демонів.
- source_word: εἰ μὴ
  choice: не інакше як
  rationale: У цій конструкції вислів обмежує дію одним нібито можливим засобом; українська конструкція природно передає цю винятковість.
- source_word: ἐν τῷ Βεελζεβοὺλ
  choice: силою Вельзевула
  rationale: Прийменник ἐν тут виражає засіб або дію через чиюсь владу; «силою» ясно передає звинувачення, не ототожнюючи Ісуса з Вельзевулом.
- source_word: Βεελζεβοὺλ
  choice: Вельзевул
  rationale: Ужито сучасну українську форму імені, що відповідає грецькій формі Βεελζεβούλ; традиційний варіант подано у примітці.
- source_word: ἄρχοντι τῶν δαιμονίων
  choice: володаря демонів
  rationale: «Володар» передає значення ἄρχων як того, хто має владу, і природно узгоджується з прикладкою в орудно-засобовій конструкції.
theological_decisions:
- issue: Ворожий відтінок вказівного займенника Οὗτος
  choice: Цей
  alternative: Він; цей чоловік
  rationale: «Цей» дає відчути зневажливу дистанцію в словах фарисеїв, не посилюючи її пояснювальними словами.
- issue: Характер зв’язку, вираженого ἐν τῷ Βεελζεβοὺλ
  choice: силою Вельзевула
  alternative: Вельзевулом; за допомогою Вельзевула
  rationale: Контекст допускає значення засобу або уповноважувальної сили. Обраний вислів ясно передає суть звинувачення, але не додає твердження про точний механізм цієї нібито залежності.
- issue: Форма імені Βεελζεβούλ
  choice: Вельзевул
  alternative: Вельзевуб
  rationale: Основний текст іде за засвідченою в SBLGNT грецькою формою на -λ; знайому традиційну форму на -б збережено в примітці.
translation_notes:
  register: Сучасна нормативна українська мова з гідним біблійним звучанням. Синтаксис стислий і природний; збережено контраст, ворожий тон фарисеїв і прикладку «володаря демонів».
