source:
  edition: SBLGNT
  text: ἄνδρες Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/041.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the preaching of Jonah, and behold[b], something greater than Jonah is here.
translation:
  language: uk
  text: Чоловіки з Ніневії постануть на суді разом із цим поколінням і засудять його, бо вони покаялися у відповідь на проповідь Йони[a]; і ось, тут — щось більше за Йону[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «покаялися завдяки проповіді Йони». Грецький вислів указує на їхню реакцію на Йонине проголошення.'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «тут Той, хто більший за Йону». У грецькому тексті вжито форму середнього роду, буквально «щось більше за Йону».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄνδρες Νινευῖται
  choice: Чоловіки з Ніневії
  rationale: Передає явно чоловічий іменник ἄνδρες і водночас природно українською називає їх ніневітянами за походженням.
- source_word: ἀναστήσονται
  choice: постануть
  rationale: Дієслово природно звучить у судовому контексті й зберігає відтінок вставання, не усуваючи можливої алюзії на воскресіння.
- source_word: ἐν τῇ κρίσει
  choice: на суді
  rationale: Природний український відповідник для есхатологічної судової події.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: разом із цим поколінням
  rationale: Зберігає звичайне значення μετά з родовим відмінком — «разом із»; протиставлення виражене наступним дієсловом «засудять».
- source_word: κατακρινοῦσιν αὐτήν
  choice: засудять його
  rationale: Прямо передає κατακρίνω; займенник граматично узгоджено відсилає до українського іменника середнього роду «покоління».
- source_word: μετενόησαν
  choice: покаялися
  rationale: У контексті відповіді на пророчу звістку це точний і усталений відповідник μετανοέω.
- source_word: εἰς τὸ κήρυγμα Ἰωνᾶ
  choice: у відповідь на проповідь Йони
  rationale: Передає спрямовану реакцію, яку виражає εἰς після μετανοέω, а κήρυγμα відтворює як публічну пророчу проповідь.
- source_word: ἰδοὺ
  choice: І ось
  rationale: Зберігає емфатичний вказівний характер дискурсивного маркера ἰδού у природній сучасній українській формі.
- source_word: πλεῖον Ἰωνᾶ ὧδε
  choice: тут є щось більше за Йону
  rationale: Зберігає середній рід πλεῖον і не звужує вислів до простого порівняння двох осіб, залишаючи відкритою вказівку на більшу реальність, присутню в Ісусі та його служінні.
theological_decisions:
- issue: Як передати πλεῖον Ἰωνᾶ як непряме самовіднесення Ісуса
  choice: тут є щось більше за Йону
  alternative: тут Той, хто більший за Йону
  rationale: Грецьке πλεῖον має середній рід, тому основний текст зберігає формальну неоднозначність і може вказувати не лише на більшу особу, а й на більшу присутню реальність. Особове розуміння подано в примітці, а не нав’язано текстові.
- issue: Передавання явно чоловічого ἄνδρες
  choice: Чоловіки з Ніневії
  alternative: Ніневітяни; мешканці Ніневії
  rationale: Оригінал прямо вживає ἄνδρες, тому узагальнення до всіх мешканців без позначення статі було б менш точним.
translation_notes:
  register: Сучасна нормативна українська мова з урочистим, але доступним біблійним звучанням. Уникнуто архаїчного «мужі» та збережено явне «чоловіки». Ім’я Ἰωνᾶ передано усталеною українською біблійною формою «Йона».
