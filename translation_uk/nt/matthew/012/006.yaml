id: MAT.12.6
reference: Matthew 12:6
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι τοῦ ἱεροῦ μεῖζόν ἐστιν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/006.yaml
  text: But I tell you that something greater than the temple is here[a][b].
translation:
  language: uk
  text: 'Але кажу вам: тут є щось більше за храм[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «тут є хтось більший за храм» чи «тут є той, хто більший за храм». У грецькому тексті слово «більше» стоїть у середньому роді, тому референт формально не названий.'
    reason: alternative_reading
  - marker: b
    text: 'Або: «у цьому місці».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Але кажу вам
  rationale: Стандартна формула прямого звернення. Частка δέ тут має легкий протиставний відтінок щодо попереднього міркування, тому природно передана словом «але».
- source_word: ὅτι
  choice: ':'
  rationale: У сучасній українській після формули «кажу вам» зміст вислову природно вводиться двокрапкою; окреме «що» тут не потрібне.
- source_word: τοῦ ἱεροῦ
  choice: за храм
  rationale: Ἱερόν зазвичай позначає храм або весь храмовий комплекс, на відміну від точнішого ναός для внутрішньої святині. Після вищого ступеня в українській природна конструкція «більше за храм».
- source_word: μεῖζόν
  choice: щось більше
  rationale: Субстантивований прикметник стоїть у середньому роді однини, а його референт формально не названий. «Щось більше» зберігає цю граматичну невизначеність.
- source_word: ἐστιν
  choice: є
  rationale: Проста зв’язка теперішнього часу; збережена без розгортання.
- source_word: ὧδε
  choice: тут
  rationale: Природна й точна передача локативного прислівника зі значенням «тут, у цьому місці».
theological_decisions:
- issue: Особа чи сутність неназваного референта в середньому роді μεῖζόν
  choice: щось більше за храм
  alternative: хтось більший за храм; той, хто більший за храм
  rationale: Грецький текст уживає форму середнього, а не чоловічого роду. Контекст може вказувати на Ісуса та його владу, однак основний текст не повинен усувати формальну неоднозначність оригіналу.
translation_notes:
  register: Сучасна стандартна українська; вислів стислий, урочистий і зрозумілий. Порядок слів «тут є» природний для української та не змінює локативного значення ὧδε.
