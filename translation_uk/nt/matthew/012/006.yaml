  verdict: approve
  source_fidelity: '«Але кажу вам: тут є щось більше за храм» точно передає λέγω δὲ ὑμῖν ὅτι τοῦ ἱεροῦ μεῖζόν ἐστιν ὧδε. Протиставне «але» є обґрунтованим для δέ; двокрапка природно вводить зміст вислову. «Храм» належно передає ἱερόν у цьому контексті, а «щось більше» зберігає субстантивований середній рід μεῖζόν і не конкретизує референта. «Тут» точно відповідає ὧδε.'
