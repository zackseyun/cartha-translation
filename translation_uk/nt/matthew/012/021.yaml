  text: and in his name the nations will hope[a].
translation:
  language: uk
  text: і на Його ім’я покладатимуть надію народи[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «і язичники покладатимуть надію на Його ім’я».'
    reason: Альтернативна передача ἔθνη як позначення неєврейських народів; також показано природний український порядок слів.
lexical_decisions:
- source_word: καὶ
  choice: і
  rationale: Збережено звичайний сурядний сполучник, який пов’язує цей рядок із попередньою частиною цитати.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: на Його ім’я
  rationale: Давальний відмінок при ἐλπίζω природно передається українською конструкцією «покладати надію на». Слово «ім’я» зберігає біблійний відтінок особи, влади й авторитету, не звужуючи значення до самої репутації.
- source_word: ἔθνη
  choice: народи
  rationale: У цитаті з Ісаї йдеться про ширше коло народів поза Ізраїлем. «Народи» зберігає старозавітний горизонт вислову, тоді як «язичники» є можливим контекстуальним відповідником.
- source_word: ἐλπιοῦσιν
  choice: покладатимуть надію
  rationale: Майбутній активний індикатив передано майбутнім часом. Ідіоматичне українське «покладатимуть надію» точно виражає значення ἐλπίζω та зберігає спрямованість на об’єкт надії.
theological_decisions:
- issue: Передача ἔθνη в месіанській цитаті
  choice: народи
  alternative: язичники
  rationale: «Народи» найкраще зберігає широкий горизонт цитати з Ісаї та водночас охоплює неєврейські народи. Варіант «язичники» можливий, але може звучати вужче й мати додатковий релігійний відтінок.
translation_notes:
  register: Сучасна, зрозуміла й урочиста українська мова. Інверсію «на Його ім’я … народи» збережено для близькості до грецького порядку слів і наголосу на об’єкті надії; дієслівний вислів зроблено природним для української.
