  text: λέγω δὲ ὑμῖν ὅτι πᾶν ῥῆμα ἀργὸν ὃ ⸀λαλήσουσιν οἱ ἄνθρωποι, ἀποδώσουσιν περὶ αὐτοῦ λόγον ἐν ἡμέρᾳ κρίσεως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/036.yaml
  text: But I tell you that for every careless word that people speak[b][a], they will give an account on the day of judgment.
translation:
  language: uk
  text: А я кажу вам, що за кожне необачне слово[a], яке скажуть люди, вони дадуть звіт у день суду.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «марне слово». Грецький прикметник може означати «бездіяльне», «непродуктивне», «марне» або «необачне».
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: А я кажу вам
  rationale: Теперішній час і пряме звертання передано природно; δέ тут має легкий протиставний або продовжувальний відтінок, який у контексті добре виражає «а».
- source_word: πᾶν ῥῆμα
  choice: кожне ... слово
  rationale: πᾶν з іменником в однині має розподільне значення «кожне», а ῥῆμα тут означає вимовлене слово або вислів.
- source_word: ἀργὸν
  choice: необачне
  rationale: У контексті відповідальності за мовлення «необачне» природно передає безвідповідальний характер слова, не звужуючи значення до відверто злого чи неправдивого.
- source_word: ὃ λαλήσουσιν οἱ ἄνθρωποι
  choice: яке скажуть люди
  rationale: Майбутній час λαλήσουσιν збережено, а οἱ ἄνθρωποι передано гендерно точно як загальне «люди».
- source_word: ἀποδώσουσιν περὶ αὐτοῦ λόγον
  choice: вони дадуть звіт
  rationale: Сполука ἀποδίδωμι з λόγος є усталеним висловом про складання звіту або відповіді. Зворот «за кожне ... слово» вже природно виражає περὶ αὐτοῦ, тому повторний займенник не потрібен.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: у день суду
  rationale: Прийменниковий зворот позначає час, а κρίσις у цьому контексті має судове значення.
theological_decisions:
- issue: Моральний відтінок ἀργόν
  choice: необачне
  alternative: марне; пусте; бездіяльне
  rationale: Попередження про звіт у день суду вказує на етичну вагу мовлення. «Необачне» передає безвідповідальність, але не додає конкретного виду провини, якого грецький текст не називає.
- issue: Загальне значення οἱ ἄνθρωποι
  choice: люди
  alternative: чоловіки; людські істоти
  rationale: Іменник стосується людей загалом, а не лише осіб чоловічої статі.
translation_notes:
  register: Сучасна нормативна українська мова; виклад простий і гідний. Збережено майбутній час відносного речення та судову образність оригіналу, а лексичну неоднозначність ἀργόν винесено в примітку.
