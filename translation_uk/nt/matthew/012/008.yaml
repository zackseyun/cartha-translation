  yaml_path: translation/nt/matthew/012/008.yaml
  text: For the Son of Man is Lord of the Sabbath[a][b].
translation:
  language: uk
  text: Бо Син Людський — Господь суботи.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Син Людський — володар над суботою».'
    reason: lexical_alternative
  - marker: b
    text: «Син Людський» — характерне самоозначення Ісуса в Євангеліях; вислів можна зрозуміти й загальніше як «людина», однак таке прочитання послаблює його ймовірне титульне звучання.
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: Бо
  rationale: Передає пояснювально-причиновий зв’язок із попереднім аргументом природною сучасною українською мовою.
- source_word: κύριος
  choice: Господь
  rationale: Зберігає сильне означення влади та христологічну вагу слова; варіант «володар» можливий, але менш виразно відтворює титульне звучання.
- source_word: τοῦ σαββάτου
  choice: суботи
  rationale: Родовий відмінок після «Господь» безпосередньо відтворює грецьку конструкцію та позначає юдейський священний день і установу.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Син Людський
  rationale: Усталений український відповідник характерного Ісусового самоозначення, який зберігає його титульне та можливе міжтекстове звучання.
- source_word: ἐστιν
  choice: —
  rationale: У теперішньому часі українська природно вживає нульову зв’язку; тире ясно передає предикативну конструкцію без доданого змісту.
theological_decisions:
- issue: Христологічна сила κύριος ... τοῦ σαββάτου
  choice: «Син Людський — Господь суботи» як сильне твердження про владу.
  alternative: «Син Людський — володар над суботою».
  rationale: «Господь» не послаблює твердження про владу Ісуса щодо суботи й водночас не додає до нього того, чого прямо немає в тексті.
- issue: Значення ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Передати як титульне самоозначення «Син Людський».
  alternative: «людська істота» або «людина».
  rationale: Титульний переклад зберігає євангельське й можливе апокаліптичне відлуння, не зводячи вислів до загального позначення людини.
translation_notes:
  register: Сучасна, природна й урочисто-стримана українська. Традиційні біблійні титули збережено; нульову зв’язку оформлено тире. Маркери приміток подано в основному тексті.
