id: MAT.12.29
reference: Matthew 12:29
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ἢ πῶς δύναταί τις εἰσελθεῖν εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ καὶ τὰ σκεύη αὐτοῦ ⸀ἁρπάσαι, ἐὰν μὴ πρῶτον δήσῃ τὸν ἰσχυρόν; καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/029.yaml
  text: Or how can someone enter the strong man's house and seize his goods[b][a], unless he first binds the strong man? And then he will plunder his house.
translation:
  language: uk
  text: Або як хтось може увійти в дім сильного чоловіка й захопити його речі[a], якщо спершу не зв’яже[b] сильного чоловіка? І тоді він розграбує його дім.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «майно». Грецьке слово може означати посуд, знаряддя або, ширше, належні комусь речі.
    reason: lexical_alternative
  - marker: b
    text: Або «не скрутить».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Або
  rationale: Зберігає зв’язок із попереднім міркуванням і природно вводить наступне риторичне запитання.
- source_word: πῶς δύναταί τις
  choice: як хтось може
  rationale: Природна українська конструкція, що зберігає риторичне запитання та неозначеність τις.
- source_word: εἰσελθεῖν εἰς τὴν οἰκίαν
  choice: увійти в дім
  rationale: Прямо й природно передає образ проникнення до будинку.
- source_word: τοῦ ἰσχυροῦ / τὸν ἰσχυρόν
  choice: сильного чоловіка / сильного
  rationale: Субстантивований прикметник позначає чоловіка в конкретному образі; при повторі слово «чоловіка» природно не дублюється.
- source_word: τὰ σκεύη αὐτοῦ
  choice: його речі
  rationale: У цьому контексті σκεύη означає не лише посуд чи знаряддя, а домашні речі або майно; «речі» зберігає конкретність образу.
- source_word: ἁρπάσαι
  choice: захопити
  rationale: Передає силове заволодіння, не стираючи відмінності від інтенсивнішого διαρπάσει наприкінці речення.
- source_word: ἐὰν μὴ πρῶτον δήσῃ
  choice: якщо спершу не зв’яже
  rationale: Природно передає умову та часову першість дії, зберігаючи буквальний образ зв’язування.
- source_word: καὶ τότε
  choice: І тоді
  rationale: Зберігає сполучник і послідовність подій.
- source_word: διαρπάσει
  choice: пограбує
  rationale: Передає посилене значення дієслова — обібрати дім після того, як господаря знешкоджено.
- source_word: τὴν οἰκίαν αὐτοῦ
  choice: його дім
  rationale: Зберігає буквальний образ пограбування дому, не вводячи в текст його алегоричного пояснення.
theological_decisions:
- issue: Чоловічий образ у порівнянні
  choice: сильного чоловіка
  alternative: сильного / сильну людину
  rationale: Грецький текст уживає форму чоловічого роду в конкретному образі. Переклад зберігає цей образ, не перетворюючи його на богословське означення.
- issue: Метафоричний обсяг слів «дім» і «речі»
  choice: Зберегти конкретний образ проникнення до дому й пограбування
  alternative: Передати тлумачно як «володіння» та «підвладні йому»
  rationale: Контекст допускає ширше богословське застосування, але сам вірш подає порівняння; переклад не повинен вбудовувати в нього повне алегоричне тлумачення.
translation_notes:
  register: Сучасна нормативна українська мова з гідним, але доступним синтаксисом. Збережено риторичне запитання, конкретний чоловічий образ і різницю між «захопити» та сильнішим за змістом «пограбує».
