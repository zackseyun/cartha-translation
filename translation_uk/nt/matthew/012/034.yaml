  text: γεννήματα ἐχιδνῶν, πῶς δύνασθε ἀγαθὰ λαλεῖν πονηροὶ ὄντες; ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας τὸ στόμα λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/034.yaml
  text: Offspring of vipers[b][a], how can you speak good things when you are evil? For out of the overflow of the heart the mouth speaks.
translation:
  language: uk
  text: Поріддя гадюк[a], як ви можете говорити те, що добре, будучи злими? Бо уста говорять з того, чим переповнене серце[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Виплодки гадюк».'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «Бо з достатку серця говорять уста».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γεννήματα ἐχιδνῶν
  choice: Поріддя гадюк
  rationale: «Поріддя» передає те, що народжене або походить від когось, а множина «гадюк» зберігає різку метафору походження й характеру. Вислів природний у сучасній українській та не послаблює докору.
- source_word: πῶς δύνασθε
  choice: як ви можете
  rationale: Природно передає риторичне запитання про моральну неспроможність.
- source_word: ἀγαθὰ λαλεῖν
  choice: говорити добре
  rationale: Передає субстантивоване ἀγαθά без звуження до правдивості чи доброзичливості; у контексті йдеться про добре за моральною якістю мовлення.
- source_word: πονηροὶ ὄντες
  choice: коли самі злі
  rationale: «Злі» зберігає виразну моральну оцінку, а «коли самі» природно передає супровідну обставину й підсилює протиставлення без зміни змісту.
- source_word: ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας
  choice: Бо чим переповнене серце
  rationale: Українська конструкція природно відтворює образ внутрішньої повноти, з якої назовні виходить мовлення. «Бо» передає γάρ, а «серце» зберігає біблійне позначення внутрішньої людини.
- source_word: τὸ στόμα λαλεῖ
  choice: те говорять уста
  rationale: Збережено образ уст як органа мовлення; додане співвідносне «те» потрібне для природної української конструкції «чим… те…» і не додає нового змісту.
theological_decisions:
- issue: Метафоричне значення καρδία
  choice: серце
  alternative: внутрішня людина; внутрішнє єство; розум
  rationale: «Серце» зберігає широту біблійного образу як осередку думок, волі й морального стану та не звужує його лише до почуттів або інтелекту.
- issue: Моральна характеристика πονηροί
  choice: злі
  alternative: погані; лукаві
  rationale: «Злі» прямо передає моральний осуд. «Погані» було б слабшим, а «лукаві» могло б невиправдано звузити значення до підступності.
- issue: Причиновий зв’язок між внутрішнім станом і мовленням
  choice: Збережено образ того, що мовлення виходить із переповненого серця
  alternative: Пояснити як думки або почуття, що визначають слова
  rationale: Текст стверджує зв’язок між внутрішньою моральною повнотою та зовнішнім мовленням, але не розкладає «серце» на окремі психологічні складники.
translation_notes:
  register: Сучасна стандартна українська, виразний і гідний тон прямого докору. Збережено біблійні образи гадюк, серця та уст; останню фразу перебудовано за природною українською моделлю без усунення образу переповнення.
