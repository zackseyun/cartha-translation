revisions:
- from: Поріддя гадюк[a], як ви можете говорити добре, коли самі злі? Бо чим переповнене серце, те говорять уста[b].
  to: Поріддя гадюк[a], як ви можете говорити те, що добре, будучи злими? Бо уста говорять з того, чим переповнене серце[b].
  rationale: The revision resolves the Ukrainian ambiguity of «говорити добре» by representing the substantival object ἀγαθά as «те, що добре». It also restores the explicit source relation of ἐκ by stating that the mouth speaks from that with which the heart is filled. No theological interpretation is added, and the alternatives retain the principal lexical options for γεννήματα and περίσσευμα.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:46:21Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the force of γεννήματα ἐχιδνῶν, the rhetorical question, the moral force of πονηροί, and the heart-to-speech image. However, «говорити добре» can naturally be understood as speaking well (eloquently or correctly), rather than speaking things that are good. The final Ukrainian correlative construction also obscures the Greek source relation expressed by ἐκ.
  naturalness: «Поріддя гадюк» and «уста» are acceptable in a dignified modern biblical register. «Говорити те, що добре» is clearer modern Ukrainian than «говорити добре» in this context. Recasting the final sentence makes the causal image idiomatic while retaining the metaphor.
  terminology: «Поріддя гадюк» suitably conveys the sharp collective/lineage metaphor, with «Виплодки гадюк» as a viable alternative. «Злі» correctly preserves the ethical force of πονηροί. «Серце» should remain, since it preserves the biblical anthropological term without interpretive narrowing.
  issues:
  - severity: medium
    issue: «говорити добре» is semantically ambiguous in Ukrainian.
    rationale: 'It may mean to speak skillfully, correctly, or eloquently, whereas ἀγαθὰ is a substantival plural: to speak good things / what is good. «Говорити те, що добре» makes the object explicit without adding interpretation.'
  - severity: medium
    issue: The final sentence does not clearly express speech as proceeding from the heart's abundance.
    rationale: «Бо чим переповнене серце, те говорять уста» is strained and makes the relation sound like a simple object correlation. «Бо уста говорять з того, чим переповнене серце» naturally preserves ἐκ ... τὸ στόμα λαλεῖ.
  - severity: low
    issue: Footnote b's proposed literal rendering is not idiomatic and does not adequately explain the revised wording.
    rationale: «З надміру серця» is archaic and can suggest an excessive amount rather than the abundance/overflow intended by περίσσευμα. A lexical alternative should state «з достатку серця».
  revised_text: Поріддя гадюк[a], як ви можете говорити те, що добре, будучи злими? Бо уста говорять з того, чим переповнене серце[b].
