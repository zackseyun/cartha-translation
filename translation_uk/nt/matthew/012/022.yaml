id: MAT.12.22
reference: Matthew 12:22
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Τότε ⸂προσηνέχθη αὐτῷ δαιμονιζόμενος τυφλὸς καὶ κωφός⸃· καὶ ἐθεράπευσεν αὐτόν, ὥστε τὸν ⸀κωφὸν λαλεῖν καὶ βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/022.yaml
  text: Then a demon-possessed man[a], blind and mute, was brought to him; and he healed him, so that the mute man spoke and saw.
translation:
  language: uk
  text: Тоді до Нього привели сліпого й німого[a] чоловіка, одержимого демоном. І Він зцілив його, так що німий заговорив і став бачити.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «глухого». Грецьке слово може означати людину, яка не чує або не може говорити; тут контекст указує на нездатність говорити, адже після зцілення чоловік заговорив і став бачити.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Тоді
  rationale: Природний український часовий маркер, що вводить наступну подію.
- source_word: προσηνέχθη αὐτῷ
  choice: до Нього привели
  rationale: Неозначено-особова конструкція природна українською та зберігає те, що виконавця дії в грецькому тексті не названо.
- source_word: δαιμονιζόμενος
  choice: одержимого демоном
  rationale: Безпосередньо передає явне посилання грецького тексту на демонічне поневолення, не замінюючи його клінічною чи узагальненою категорією.
- source_word: τυφλὸς
  choice: сліпого
  rationale: Прямий і природний відповідник.
- source_word: κωφός
  choice: німого
  rationale: Слово може означати глухого або німого; згадка про відновлення мовлення в результативній частині вказує тут на нездатність говорити.
- source_word: ἐθεράπευσεν αὐτόν
  choice: Він зцілив його
  rationale: Звичний і прозорий відповідник у контексті євангельського зцілення.
- source_word: ὥστε
  choice: так що
  rationale: Природно вводить фактичний результат зцілення, а не мету.
- source_word: τὸν κωφὸν λαλεῖν καὶ βλέπειν
  choice: німий заговорив і став бачити
  rationale: Передає обидва результати зцілення; «заговорив» і «став бачити» природно позначають відновлення відповідних здібностей без надмірного розгортання.
theological_decisions:
- issue: Характер демонічного поневолення
  choice: Зберегти пряме формулювання «одержимого демоном»
  alternative: «стражденного» або сучасна клінічна категорія
  rationale: Грецький текст прямо називає демонічний чинник; нейтралізація цього твердження була б тлумачним звуженням.
- issue: Значення κωφός у цьому контексті
  choice: «німий»
  alternative: «глухий»
  rationale: Лексема допускає обидва значення, однак подальше «заговорив» контекстуально підтримує нездатність говорити. Примітка зберігає справжню лексичну неоднозначність.
translation_notes:
  register: Сучасна стандартна українська, зрозуміла й гідна. Порядок означень дещо перебудовано задля природності українського речення; займенник «Нього» написано з великої літери відповідно до поширеної української біблійної традиції.
