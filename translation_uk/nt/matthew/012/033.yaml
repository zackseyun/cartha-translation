  text: Ἢ ποιήσατε τὸ δένδρον καλὸν καὶ τὸν καρπὸν αὐτοῦ καλόν, ἢ ποιήσατε τὸ δένδρον σαπρὸν καὶ τὸν καρπὸν αὐτοῦ σαπρόν· ἐκ γὰρ τοῦ καρποῦ τὸ δένδρον γινώσκεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/033.yaml
  text: Either make the tree good and its fruit good[a], or make the tree rotten and its fruit rotten[b]; for the tree is known by its fruit.
translation:
  language: uk
  text: Або зробіть дерево добрим і його плід добрим, або зробіть дерево гнилим[a] і його плід гнилим, адже дерево пізнають за його плодом.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або «зіпсутим» чи «поганим»: грецьке σαπρός може означати щось гниле, зіпсуте, непридатне або нікчемне.'
    reason: lexical_alternative
  - marker: b
    text: Повторене «зробіть» може риторично означати «вважайте» або «визнайте таким», однак у грецькому тексті стоїть наказова форма.
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσατε
  choice: зробіть
  rationale: Аористовий наказовий спосіб передано прямим наказом, щоб зберегти паралелізм і риторичну гостроту; можливий відтінок «вважайте» чи «визнайте» не внесено до основного тексту.
- source_word: δένδρον
  choice: дерево
  rationale: Прямий і природний відповідник, що зберігає центральний образ метафори.
- source_word: καλός
  choice: добрий
  rationale: Передає як якісне, так і моральне забарвлення слова, не звужуючи значення до фізичного здоров’я.
- source_word: καρπός
  choice: плід
  rationale: Прямий усталений відповідник, природний у біблійній метафориці.
- source_word: σαπρός
  choice: гнилий
  rationale: Зберігає виразний образ зіпсуття та природно сполучається українською і з деревом, і з плодом.
- source_word: ἐκ γὰρ τοῦ καρποῦ
  choice: адже ... за його плодом
  rationale: γάρ передано пояснювальним «адже», а ἐκ — природною українською конструкцією «за плодом».
- source_word: γινώσκεται
  choice: пізнають
  rationale: 'Неозначено-особова конструкція природно передає грецький пасив теперішнього часу: дерево розпізнають або визначають за плодом.'
- source_word: αὐτοῦ
  choice: його
  rationale: Займенник явно пов’язує плід із деревом і природно звучить у сучасній українській.
theological_decisions:
- issue: Сила наказових форм у метафорі Ісуса
  choice: Збережено прямі наказові форми «зробіть»
  alternative: «вважайте дерево добрим» або умовна перебудова «якщо зробите дерево добрим»
  rationale: Грецький текст двічі вживає аористовий імператив. Хоча він може мати риторичну силу «визнайте/вважайте», прямий наказ зберігає напруження й не закріплює одного тлумачення.
translation_notes:
  register: Сучасна стандартна українська, лаконічний і гідний біблійний стиль. Симетрію двох частин та повтори оригіналу збережено; «адже» природно вводить пояснення.
