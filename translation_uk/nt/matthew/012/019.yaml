  source_fidelity: 'Переклад точно передає три майбутні дієслівні заперечення: οὐκ ἐρίσει — «не буде сперечатися», οὐδὲ κραυγάσει — «не кричатиме», οὐδὲ ἀκούσει τις — «ніхто не почує». «На вулицях» є природним і достатньо точним відповідником ἐν ταῖς πλατείαις, що позначає широкі міські вулиці/публічні простори. Родовий «Його голосу» граматично природний після запереченого «не почує».'
