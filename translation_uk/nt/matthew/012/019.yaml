  text: οὐκ ἐρίσει οὐδὲ κραυγάσει, οὐδὲ ἀκούσει τις ἐν ταῖς πλατείαις τὴν φωνὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/019.yaml
  text: He will not quarrel or cry out[a], and no one will hear his voice in the streets.
translation:
  language: uk
  text: Він не буде сперечатися й не кричатиме, і ніхто не почує Його голосу на вулицях.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Він не буде змагатися й не здійматиме крику, і ніхто не почує Його голосу на широких вулицях».'
    reason: Лексичні альтернативи для ἐρίσει, κραυγάσει та πλατείαις.
lexical_decisions:
- source_word: ἐρίσει
  choice: не буде сперечатися
  rationale: Майбутня форма ἐρίζω означає вступати в суперечку або чвари. «Не буде сперечатися» природно передає неконфліктну поведінку Слуги, не нав’язуючи думки про цілковиту пасивність.
- source_word: κραυγάσει
  choice: не кричатиме
  rationale: κραυγάζω означає голосно кричати або вигукувати. «Не кричатиме» стисло й природно передає публічну гучність дії.
- source_word: ἀκούσει τις
  choice: ніхто не почує
  rationale: Заперечна конструкція з неозначеним τις природно передається українською як «ніхто не почує».
- source_word: ἐν ταῖς πλατείαις
  choice: на вулицях
  rationale: πλατεῖα позначає широку вулицю або публічний міський простір. «На вулицях» є природним відповідником і зберігає публічний характер місця.
- source_word: φωνὴν αὐτοῦ
  choice: Його голосу
  rationale: φωνή у цьому контексті прямо означає голос; родовий відмінок зумовлений українським керуванням після запереченого «не почує».
- source_word: οὐκ…οὐδὲ…οὐδὲ
  choice: не… й не… і ніхто не…
  rationale: Така побудова зберігає накопичувальну силу трьох грецьких заперечень і водночас звучить природно сучасною українською.
theological_decisions:
- issue: Зв’язок із цитатою про Слугу в Ісаї та змалювання поведінки Месії
  choice: Вірш описує Месію як неконфліктного й такого, хто не привертає до себе уваги гучною публічною демонстрацією.
  alternative: Формальніше можна перекласти «не буде змагатися й не здійматиме крику», ближче до традиційної лексики цитати.
  rationale: Грецький текст характеризує лагідну, неагресивну поведінку Ісуса у виконанні Ісаї 42:2, але не стверджує, що Він узагалі не говоритиме прилюдно.
translation_notes:
  register: Сучасна стандартна українська; виклад природний, гідний і зрозумілий. Займенник «Його» написано з великої літери як усталену біблійну графічну практику, без зміни змісту оригіналу.
