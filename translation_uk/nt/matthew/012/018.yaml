  text: Ἰδοὺ ὁ παῖς μου ὃν ᾑρέτισα, ὁ ἀγαπητός μου ⸂εἰς ὃν⸃ εὐδόκησεν ἡ ψυχή μου· θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν, καὶ κρίσιν τοῖς ἔθνεσιν ἀπαγγελεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/018.yaml
  text: Behold[a], my servant whom I have chosen, my beloved in whom my soul has delighted. I will put my Spirit upon him[c][b], and he will proclaim justice to the nations.
translation:
  language: uk
  text: 'Ось мій слуга[a], якого я обрав, мій улюблений, якого вподобала моя душа: Я покладу на нього свого Духа, і він звістить народам[b] справедливість[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «дитя». У цій цитаті з Ісаї контекст указує на Божого Слугу.
    reason: lexical_alternative
  - marker: b
    text: Або «язичникам».
    reason: lexical_alternative
  - marker: c
    text: Або «суд».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Ось
  rationale: Природно передає заклик звернути увагу й водночас зберігає урочистий тон пророчої цитати.
- source_word: παῖς
  choice: слуга
  rationale: У контексті цитати з Ісаї слово позначає Божого слугу; цей відповідник зберігає зв’язок із піснею про Слугу, не вносячи сюди значення «син», якого саме це слово не вимагає.
- source_word: ᾑρέτισα
  choice: обрав
  rationale: Доконавчий вид природно передає завершений Божий вибір, виражений грецьким аористом.
- source_word: ἀγαπητός
  choice: улюблений
  rationale: Передає і любов, і особливу прихильність у прямій Божій мові, зберігаючи гідний регістр.
- source_word: εἰς ὃν εὐδόκησεν ἡ ψυχή μου
  choice: якого вподобала моя душа
  rationale: Збережено виразний підмет «моя душа» та значення глибокої прихильності; українська конструкція природно передає грецький ідіоматичний зворот.
- source_word: θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν
  choice: Я покладу на нього свого Духа
  rationale: Відтворює образ покладення Божого Духа на обраного слугу та природно звучить українською. Написання «Духа» з великої літери вказує на Божого Духа.
- source_word: κρίσιν
  choice: справедливість
  rationale: У місійному контексті Ісаї йдеться про принесення народам Божого справедливого ладу, а не лише про винесення карального вироку; можливість перекладу «суд» збережено в примітці.
- source_word: τοῖς ἔθνεσιν
  choice: народам
  rationale: Передає широкий всесвітній обсяг пророчої обітниці; у цьому контексті слово також може означати язичників, що зазначено в примітці.
- source_word: ἀπαγγελεῖ
  choice: звістить
  rationale: Лаконічно й гідно передає публічне повідомлення або проголошення.
theological_decisions:
- issue: Месіанська тотожність слуги у слові παῖς
  choice: Перекласти як «слуга» відповідно до контексту цитати про Господнього Слугу в Ісаї.
  alternative: «дитя»; «син»
  rationale: «Слуга» зберігає старозавітний інтертекст і показує Ісуса в ролі обраного Божого Слуги, не додаючи до цього конкретного слова синівської термінології, хоча вона наявна в інших текстах.
- issue: Значення κρίσις у пророчій місії
  choice: У головному тексті вжити «справедливість».
  alternative: «суд»
  rationale: Контекст наголошує на Божому справедливому ладі, який Слуга звістить народам. Водночас грецьке слово може означати «суд», тому цей справжній лексичний варіант подано в примітці.
translation_notes:
  register: Сучасна нормативна українська мова з помірно урочистим звучанням пророчої цитати. Зворот «вподобала моя душа» навмисно зберігає образність оригіналу, але лишається зрозумілим. Займенники щодо Бога й Слуги подано з малої літери за загальними нормами сучасного видання; «Духа» — з великої як позначення Божого Духа.
