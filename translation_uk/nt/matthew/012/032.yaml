id: MAT.12.32
reference: Matthew 12:32
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: καὶ ὃς ἐὰν εἴπῃ λόγον κατὰ τοῦ υἱοῦ τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ· ὃς δ’ ἂν εἴπῃ κατὰ τοῦ πνεύματος τοῦ ἁγίου, οὐκ ἀφεθήσεται αὐτῷ οὔτε ἐν ⸂τούτῳ τῷ⸃ αἰῶνι οὔτε ἐν τῷ μέλλοντι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/032.yaml
  text: And whoever speaks a word against the Son of Man[a], it will be forgiven him; but whoever speaks against the Holy Spirit, it will not be forgiven him[c][b], neither in this age nor in the coming one.
translation:
  language: uk
  text: І хто скаже слово проти Сина Людського, тому буде прощено; а хто скаже проти Святого Духа, тому не буде прощено — ні в цьому віці, ні в прийдешньому.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або виразніше: «ні в цьому віці, ні у віці, що прийде». У грецькому тексті буквально: «ні в цьому віці, ні в прийдешньому», причому слово «віці» у другій частині мається на увазі.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς ἐὰν / ὃς δ’ ἂν
  choice: хто ... а хто
  rationale: Неозначена загальна умова природно передається українською конструкцією «хто...», а протиставний δέ — сполучником «а».
- source_word: εἴπῃ λόγον
  choice: скаже слово
  rationale: Передає і дієслово λέγω, і іменник λόγος без зайвого перефразування; це природний і водночас урочистий український вислів.
- source_word: κατὰ
  choice: проти
  rationale: У цьому контексті κατά з родовим відмінком означає ворожо спрямоване мовлення; «проти» точно й однаково передає його в обох частинах.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Сина Людського
  rationale: Усталена українська передача титулу, яка зберігає його формулювання та месіансько-апокаліптичні асоціації.
- source_word: ἀφεθήσεται αὐτῷ / οὐκ ἀφεθήσεται αὐτῷ
  choice: тому буде прощено / тому не буде прощено
  rationale: Безособова пасивна конструкція природна українською і зберігає паралелізм та контраст грецького тексту.
- source_word: τοῦ πνεύματος τοῦ ἁγίου
  choice: Святого Духа
  rationale: Стандартна сучасна українська назва; родовий відмінок зумовлений прийменником «проти».
- source_word: οὔτε ἐν τούτῳ τῷ αἰῶνι
  choice: ні в цьому віці
  rationale: αἰών тут позначає часовий «вік», а не просторовий «світ», що видно з протиставлення майбутньому вікові.
- source_word: οὔτε ἐν τῷ μέλλοντι
  choice: ні в прийдешньому
  rationale: 'Зберігає грецький еліпсис: іменник «віці» зрозумілий із попередньої фрази. «Прийдешньому» має гідний біблійний регістр і залишається зрозумілим сучасному читачеві.'
theological_decisions:
- issue: Часове протиставлення αἰών / μέλλων
  choice: ні в цьому віці, ні в прийдешньому
  alternative: ні в цьому світі, ні в майбутньому світі; ні в цьому віці, ні у віці, що прийде
  rationale: Оригінал протиставляє теперішній і майбутній віки, а не два просторові світи. Еліптична форма другої частини збережена, а розгорнуту передачу наведено в примітці.
- issue: Характер непрощенного проступку
  choice: Зберегти попередження про слова проти Святого Духа без доданого доктринального визначення
  alternative: Визначити це як конкретне історичне звинувачення щодо Ісусових вигнань демонів або як остаточну нерозкаяність
  rationale: Сам вірш проголошує наслідок, але не дає вичерпного богословського визначення цього проступку; переклад не повинен мовчки вносити пізніше тлумачення.
translation_notes:
  register: Сучасна нормативна українська з гідним біблійним звучанням. Конструкції «скаже слово», «тому буде прощено» та «прийдешньому» зберігають формальну близькість до грецького тексту, не стаючи неприродними. Єдиний маркер примітки [a] поставлено безпосередньо після вислову, якого вона стосується.
