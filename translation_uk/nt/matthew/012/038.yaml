  text: Τότε ἀπεκρίθησαν ⸀αὐτῷ τινες τῶν γραμματέων καὶ Φαρισαίων λέγοντες· Διδάσκαλε, θέλομεν ἀπὸ σοῦ σημεῖον ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/038.yaml
  text: Then some of the scribes and Pharisees answered him[a], saying, “Teacher, we want to see a sign from you.”
translation:
  language: uk
  text: 'Тоді деякі з книжників і фарисеїв відповіли йому: «Учителю, ми хочемо побачити від тебе знак[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «чудесний знак». Грецьке слово може означати знак, що має чудесний характер, але в основному тексті збережено ширше слово «знак».
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Тоді
  rationale: Природний український часовий прислівник, що позначає наступну подію в розповіді.
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: відповіли йому
  rationale: Зберігає звичний для євангельської оповіді зміст дієслова ἀποκρίνομαι та чітко передає адресата.
- source_word: τινες τῶν γραμματέων καὶ Φαρισαίων
  choice: деякі книжники та фарисеї
  rationale: «Деякі» вказує на частину групи, а не на всіх; «книжники» є усталеним і стислим відповідником γραμματεῖς.
- source_word: λέγοντες
  choice: ':'
  rationale: В українській мові пряму мову після дієслова відповіді природно вводити двокрапкою; зміст грецького дієприкметника повністю збережено.
- source_word: Διδάσκαλε
  choice: Учителю
  rationale: Точно передає кличну форму та значення звертання без посилення до «Владико» чи «Пане».
- source_word: θέλομεν
  choice: ми хочемо
  rationale: Прямий і природний сучасний відповідник волевиявлення.
- source_word: ἀπὸ σοῦ
  choice: від тебе
  rationale: Передає джерело або походження знаку, виражене прийменником ἀπό з родовим відмінком.
- source_word: σημεῖον
  choice: знак
  rationale: Зберігає широкий зміст грецького слова, не додаючи до основного тексту явно не виражене означення «чудесний».
- source_word: ἰδεῖν
  choice: побачити
  rationale: Безпосередній і природний відповідник інфінітива ὁράω.
theological_decisions:
- issue: Характер σημεῖον у цьому контексті
  choice: знак
  alternative: чудесний знак
  rationale: У контексті йдеться про знак, який мав би засвідчити повноваження Ісуса і, ймовірно, мав чудесний характер. Однак саме грецьке слово означає ширше «знак», тому основний текст не звужує його значення.
translation_notes:
  register: Сучасна стандартна українська мова; виклад природний і водночас гідний. Усталені біблійні назви «книжники» та «фарисеї» збережено, а грецьку дієприкметникову конструкцію природно оформлено двокрапкою перед прямою мовою.
