  text: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ ⸀λέγοντι αὐτῷ· Τίς ἐστιν ἡ μήτηρ μου, καὶ τίνες εἰσὶν οἱ ἀδελφοί μου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/048.yaml
  text: But he answered the one speaking to him[a], “Who is my mother, and who are my brothers?”
translation:
  language: uk
  text: 'А він відповів тому, хто говорив до нього[a]: «Хто моя мати і хто мої брати?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Формальніше: «А він у відповідь сказав тому, хто говорив до нього».'
    reason: Лексична альтернатива, що відтворює обидві дієслівні форми ἀποκριθεὶς εἶπεν.
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: А він відповів
  rationale: Дієприкметник ἀποκριθεὶς у сполученні з εἶπεν утворює звичний семітизований грецький зворот «відповів і сказав». У природній сучасній українській дієслово «відповів» повно передає зміст без зайвого дублювання; δέ передано як «А», що позначає поворот у розмові.
- source_word: τῷ λέγοντι αὐτῷ
  choice: тому, хто говорив до нього
  rationale: Субстантивований дієприкметник теперішнього часу λέγοντι позначає особу, яка зверталася до Ісуса. «Говорив до нього» природно передає адресоване мовлення, не звужуючи значення до «повідомив».
- source_word: Τίς ἐστιν ἡ μήτηρ μου
  choice: Хто моя мати
  rationale: Питальний займенник Τίς запитує про особу; українське «Хто» є точним і природним. Зв’язку «є» у теперішньому часі закономірно опущено.
- source_word: καὶ τίνες εἰσὶν οἱ ἀδελφοί μου
  choice: і хто мої брати
  rationale: Множинне τίνες паралельне до першого питання, а українське «хто» не змінюється за числом. ἀδελφοί — граматично чоловічий множинний іменник, що в безпосередньому контексті стосується братів Ісуса, тому перекладено «брати».
theological_decisions:
- issue: Можливе пояснювальне пом’якшення риторичного питання Ісуса про родинну належність
  choice: Збережено прямі риторичні питання без пояснювального розширення
  alternative: «Хто вважається моєю матір’ю і хто вважається моїми братами?»
  rationale: Наступний контекст розкриває переосмислення спорідненості, але цей вірш сам по собі його ще не пояснює. Пряме формулювання зберігає оповідну й богословську напругу.
- issue: Передача ἀδελφοί за родом
  choice: брати
  alternative: «брати й сестри» або «рідні»
  rationale: Безпосередній референт у сцені — члени земної родини Ісуса, а грецький текст уживає чоловічий термін спорідненості. Розширення до змішаної групи було б інтерпретаційним.
translation_notes:
  register: Сучасна нормативна українська мова, природний і водночас гідний біблійний стиль. Уникнуто архаїчного «рік» і неприродного дублювання «відповів і сказав» в основному тексті; формальнішу структуру збережено у примітці.
