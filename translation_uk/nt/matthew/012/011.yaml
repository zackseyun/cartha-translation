  source_fidelity: 'Основний зміст передано точно: умовна ситуація, одна вівця, субота, яма та очікувана ствердна відповідь риторичного запитання збережені. Однак «Хто з вас» не відтворює прямо ἄνθρωπος («чоловік») у формулюванні Τίς … ἄνθρωπος; природний український вислів «Який чоловік із вас» зберігає цей елемент без істотної неприродності.'
