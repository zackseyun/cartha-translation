source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Τίς ⸀ἔσται ἐξ ὑμῶν ἄνθρωπος ὃς ἕξει πρόβατον ἕν, καὶ ἐὰν ἐμπέσῃ τοῦτο τοῖς σάββασιν εἰς βόθυνον, οὐχὶ κρατήσει αὐτὸ καὶ ἐγερεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/011.yaml
  text: But he said to them[a], “Which man among you, if he has one sheep and it falls into a pit on the Sabbath[b], will not take hold of it and lift it out?”
translation:
  language: uk
  text: 'А Він сказав їм: «Який чоловік із вас, маючи одну вівцю, якщо вона в суботу[a] впаде в яму, не візьме її та не витягне звідти[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Грецькою буквально «у суботи»; множина тут ідіоматично означає «у суботу».
    reason: lexical_alternative
  - marker: b
    text: 'Або: «не візьме її та не підніме?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς ἔσται ἐξ ὑμῶν ἄνθρωπος
  choice: Хто з вас
  rationale: Природно передає українською риторичне запитання про будь-кого з присутніх. Окреме відтворення ἄνθρωπος словом «чоловік» тут зробило б вислів неприродним, тоді як форма «хто» не усуває представницького характеру прикладу.
- source_word: ἕξει πρόβατον ἕν
  choice: матиме одну вівцю
  rationale: Майбутня форма ἕξει збережена природним українським майбутнім «матиме», а числівник «одну» передає наголос на єдиній вівці.
- source_word: ἐὰν ἐμπέσῃ τοῦτο
  choice: і вона … впаде
  rationale: Займенник τοῦτο стосується вівці; українською його природно передано особовим займенником жіночого роду. Умовний аорист кон’юнктива адекватно виражено формою «впаде» в умовній конструкції.
- source_word: τοῖς σάββασιν
  choice: у суботу
  rationale: Грецька множина є усталеним ідіоматичним позначенням суботнього дня; українська однина точно й природно передає зміст.
- source_word: εἰς βόθυνον
  choice: в яму
  rationale: βόθυνος означає яму або заглибину; «яма» є широким і природним відповідником без зайвого уточнення.
- source_word: οὐχὶ κρατήσει αὐτό
  choice: не схопить її
  rationale: οὐχί позначає запитання, що передбачає ствердну відповідь, а κρατέω тут означає міцно взяти або вхопити. «Схопить» стисло передає необхідну фізичну дію.
- source_word: καὶ ἐγερεῖ
  choice: та не витягне звідти
  rationale: Буквальне значення — «підніме», але в контексті вівці, яка впала в яму, українське «витягне звідти» природно виражає спрямований назовні рух, не змінюючи змісту.
theological_decisions:
- issue: Представницьке значення ἄνθρωπος у чоловічому роді
  choice: Хто з вас
  alternative: Який із вас чоловік
  rationale: Українська конструкція «хто з вас» природно охоплює кожного адресата в риторичному прикладі й не вводить гендерно нейтрального іменника замість грецького; буквальніша альтернатива звучить неприродно.
- issue: Число у вислові τοῖς σάββασιν
  choice: у суботу
  alternative: по суботах / у суботи
  rationale: Множина в грецькому тексті ідіоматична й позначає суботній день у межах суперечки про суботній закон; однина українською не створює хибного уявлення про кілька субот.
- issue: Контекстуальне уточнення ἐγερεῖ
  choice: витягне звідти
  alternative: підніме її
  rationale: Контекст ями визначає напрямок дії. Основний текст передає очевидний у ситуації зміст, а примітка зберігає прозорість буквальнішого варіанта без богословського переосмислення.
translation_notes:
  register: Сучасна літературна українська з гідним, розмовно-природним синтаксисом риторичного запитання. Займенник «Він» написано з великої літери відповідно до поширеної української біблійної традиції; формулювання не додає конфесійно специфічного тлумачення.
