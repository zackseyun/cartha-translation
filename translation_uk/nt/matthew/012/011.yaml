  terminology: «Субота», «вівця» і «яма» вжито коректно. Ідіоматичну грецьку множину τοῖς σάββασιν слушно передано українською одниною «в суботу». Примітки прив’язані до відповідних місць українського тексту, незалежно від неузгодженого розміщення позначок в англійському audit trail.
