  text: Ὁ δὲ Ἰησοῦς γνοὺς ἀνεχώρησεν ἐκεῖθεν. καὶ ἠκολούθησαν ⸀αὐτῷ πολλοί, καὶ ἐθεράπευσεν αὐτοὺς πάντας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/015.yaml
  text: But Jesus[a], knowing this, withdrew from there. And many followed him, and he healed them all,
translation:
  language: uk
  text: А Ісус, дізнавшись про це,[a] відійшов звідти. За ним пішло багато людей, і він зцілив їх усіх.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'У грецькому тексті прямо не сказано, про що Ісус дізнався; це зрозуміло з попереднього вірша. Можна також перекласти: «Ісус, знаючи це, відійшов звідти».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: дізнавшись про це
  rationale: Аористовий дієприкметник передає усвідомлення, що передувало відходу Ісуса й спонукало до нього. Додаток у грецькому тексті не висловлений, тому «про це» стисло відсилає до задуму фарисеїв у попередньому вірші.
- source_word: ἀνεχώρησεν
  choice: відійшов
  rationale: Дієслово в цьому контексті означає цілеспрямовано залишити місце через виниклу протидію. «Відійшов» природно передає цей відтінок, не приписуючи Ісусові страху.
- source_word: ἐκεῖθεν
  choice: звідти
  rationale: Природний і стислий український відповідник прислівника руху від певного місця.
- source_word: ἠκολούθησαν αὐτῷ πολλοί
  choice: За ним пішло багато людей
  rationale: πολλοί означає «багато», не називаючи їх прямо натовпом. Додавання «людей» потрібне для природності українського вислову й не розширює змісту.
- source_word: ἐθεράπευσεν
  choice: зцілив
  rationale: У євангельському контексті θεραπεύω позначає повернення здоров’я; «зцілив» є усталеним, зрозумілим і гідним українським відповідником.
- source_word: αὐτοὺς πάντας
  choice: їх усіх
  rationale: Зберігає всеохопний зміст πάντας і природний український порядок слів.
theological_decisions:
- issue: Неявний додаток при γνοὺς
  choice: Контекстуальний зв’язок передано як «дізнавшись про це».
  alternative: «знаючи це» або буквальніше «дізнавшись» без названого додатка
  rationale: Грецький текст не називає об’єкта знання, але попередній вірш природно вказує на задум фарисеїв. Переклад прояснює зв’язок, а примітка зберігає відомість про граматичну неявність.
- issue: Характер відходу Ісуса
  choice: «відійшов»
  alternative: «пішов» або «віддалився»
  rationale: Цей вибір зберігає мотив цілеспрямованого відходу у відповідь на протидію, не пояснюючи його як страх чи боягузтво.
translation_notes:
  register: Сучасна стандартна українська мова; виклад простий, природний і водночас гідний. Синтаксис не перевантажений церковнослов’янізмами, а неявність грецького додатка позначено приміткою.
