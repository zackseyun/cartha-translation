  text: ὁ ἀγαθὸς ἄνθρωπος ἐκ τοῦ ἀγαθοῦ θησαυροῦ ἐκβάλλει ἀγαθά, καὶ ὁ πονηρὸς ἄνθρωπος ἐκ τοῦ πονηροῦ θησαυροῦ ἐκβάλλει πονηρά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/035.yaml
  text: The good man brings out good things from his good treasure[b][a], and the evil man brings out evil things from his evil treasure.
translation:
  language: uk
  text: Добра людина з доброго скарбу виносить добре[b], а зла людина зі злого скарбу виносить зле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Безпосередній контекст стосується мовлення, тому «добре» і «зле» тут можуть передусім означати добрі та злі слова.
    reason: cross_reference
lexical_decisions:
- source_word: ἀγαθὸς
  choice: добра
  rationale: Зберігає звичайний моральний зміст і повтор кореня в парі «добра — добре».
- source_word: ἄνθρωπος
  choice: людина
  rationale: Природний український відповідник родового ἄνθρωπος; граматичний чоловічий рід грецького слова тут не обмежує вислів чоловіками.
- source_word: θησαυροῦ
  choice: скарбу
  rationale: Зберігає метафору внутрішнього запасу, з якого назовні виходить добре або зле.
- source_word: ἐκβάλλει
  choice: виносить
  rationale: Передає рух назовні, закладений у дієслові, і природно поєднується зі «скарбом».
- source_word: ἀγαθά
  choice: добре
  rationale: Субстантивований середній рід множини передано широким узагальненим висловом без додавання не названого в грецькому тексті іменника.
- source_word: πονηρὸς
  choice: зла
  rationale: Передає виразний моральний контраст із ἀγαθός без послаблення до «погана».
- source_word: πονηρά
  choice: зле
  rationale: Зберігає симетрію з «добре» та широкий обсяг грецького субстантивованого прикметника.
- source_word: ἐκ
  choice: з / зі
  rationale: Природно передає джерело походження; милозвучний варіант «зі» вжито перед збігом приголосних.
theological_decisions:
- issue: Чи йдеться лише про слова, чи ширше про все добре і зле, що походить від людини
  choice: У головному тексті залишено широкі «добре» і «зле».
  alternative: Уточнити як «добрі слова» і «злі слова».
  rationale: 'Безпосередній контекст стосується мовлення, однак у грецькому тексті немає іменника «слова»: вжито субстантивовані прикметники множини. Тому текст не звужує значення, а примітка вказує на контекстуальний акцент.'
translation_notes:
  register: Сучасна стандартна українська; лаконічний, урочисто-природний паралелізм. Англійську примітку [a] не перенесено, бо українське «людина» вже природно передає родове значення ἄνθρωπος і не потребує гендерної лексичної альтернативи.
