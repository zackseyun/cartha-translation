  text: καὶ εἰ ὁ Σατανᾶς τὸν Σατανᾶν ἐκβάλλει, ἐφ’ ἑαυτὸν ἐμερίσθη· πῶς οὖν σταθήσεται ἡ βασιλεία αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/026.yaml
  text: And if Satan casts out Satan[a], he is divided against himself[c][b]. How then will his kingdom stand?
translation:
  language: uk
  text: І якщо Сатана виганяє Сатану[a], то він розділився сам проти себе[b]. Як же тоді встоїть його царство?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «проганяє Сатану».'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «то він поділений сам проти себе»; або: «то він був розділений сам проти себе».'
    reason: lexical_alternative
  - marker: c
    text: 'Або: «Як же тоді може встояти його царство?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἰ
  choice: І якщо
  rationale: Зберігає і сполучник καί, що пов’язує вислів із попереднім міркуванням, і умовне εἰ.
- source_word: ὁ Σατανᾶς / τὸν Σατανᾶν
  choice: сатана
  rationale: Усталена українська форма особового імені-титулу; в цьому реченні природно пишеться з малої літери за сучасною українською правописною практикою.
- source_word: ἐκβάλλει
  choice: виганяє
  rationale: Природний сучасний відповідник зі значенням примусового усунення; доречний у контексті вигнання демонів.
- source_word: ἐφ’ ἑαυτὸν
  choice: сам проти себе
  rationale: Передає внутрішнє протистояння, виражене конструкцією ἐπί з поворотним займенником, і звучить природно українською.
- source_word: ἐμερίσθη
  choice: розділився
  rationale: 'Аорист пасивної форми має тут внутрішньо-рефлексивний зміст: у наведеній умові сатана опинився в стані поділу проти самого себе. Минула форма ближче відтворює грецький аорист, не усуваючи результативного відтінку.'
- source_word: πῶς οὖν
  choice: Як же тоді
  rationale: «Як» передає πῶς, а «же тоді» природно виражає висновкову силу οὖν у риторичному запитанні.
- source_word: σταθήσεται
  choice: встоїть
  rationale: Зберігає метафору стояння та водночас передає значення тривкості й здатності не впасти.
- source_word: ἡ βασιλεία αὐτοῦ
  choice: його царство
  rationale: «Царство» є точним і звичним відповідником βασιλεία та пасує до образу внутрішньо розділеного володіння.
theological_decisions:
- issue: Сила аргументу про самоподіл сатани
  choice: 'Передано як умовний аргумент: якщо сатана виганяє сатану, він розділився проти самого себе, тому постає питання, як може встояти його царство.'
  alternative: Розгорнути думку за допомогою образу «дому, поділеного в собі» з ширшого контексту.
  rationale: Грецький текст безпосередньо говорить про внутрішній поділ і нестійкість царства сатани. Додатковий образ дому тут не внесено, щоб не розширювати формулювання вірша.
translation_notes:
  register: Сучасна літературна українська з гідним біблійним звучанням. Синтаксис зберігає послідовність грецького умовиводу; «встоїть» утримує вихідну метафору без архаїчності.
