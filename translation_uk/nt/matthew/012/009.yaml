  text: Καὶ μεταβὰς ἐκεῖθεν ἦλθεν εἰς τὴν συναγωγὴν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/009.yaml
  text: And departing from there, he went into their synagogue.
translation:
  language: uk
  text: І, відійшовши звідти, він увійшов до їхньої синагоги.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: І
  rationale: Зберігає простий сурядний зв’язок із попередньою розповіддю, не додаючи виразнішого часового відтінку.
- source_word: μεταβὰς
  choice: відійшовши
  rationale: Дієприслівник природно передає аористний активний дієприкметник і рух від попереднього місця.
- source_word: ἐκεῖθεν
  choice: звідти
  rationale: Прямий і природний відповідник прислівника місця, що вказує на вихід із раніше згаданого місця.
- source_word: ἦλθεν
  choice: увійшов
  rationale: У сполученні з εἰς τὴν συναγωγήν українське «увійшов до» природно передає рух усередину, хоча саме дієслово має ширше значення «прийшов/пішов».
- source_word: εἰς τὴν συναγωγὴν
  choice: до ... синагоги
  rationale: Українська конструкція «увійти до» природно виражає спрямований рух усередину, закладений у εἰς з акузативом.
- source_word: συναγωγὴν
  choice: синагоги
  rationale: «Синагога» — усталена й точна назва юдейського місця зібрання та богослужіння в цьому контексті.
- source_word: αὐτῶν
  choice: їхньої
  rationale: Природно передає родовий займенник множини, не конкретизуючи його референта понад те, що подає контекст.
theological_decisions:
- issue: Референт вислову «їхньої синагоги»
  choice: Збережено нейтральне «їхньої синагоги» без уточнення групи.
  alternative: їхнього місця зібрання; синагоги, що належала їм
  rationale: Грецький текст має лише αὐτῶν при συναγωγή й не визначає референта точніше; переклад не додає полемічного чи конфесійного забарвлення.
translation_notes:
  register: Сучасна нормативна українська мова; виклад стислий, природний і гідний. Дієприслівникова конструкція зберігає структуру оригіналу без неприродної буквальності.
