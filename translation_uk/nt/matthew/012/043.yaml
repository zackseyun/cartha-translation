base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/043.yaml
  text: When the unclean spirit goes out from the man[a], it passes through waterless places seeking rest, and does not find it.
translation:
  language: uk
  text: Коли ж нечистий дух виходить із людини, він проходить безводними місцями[a], шукаючи спокою, і не знаходить його.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «сухими місцями». Грецьке слово буквально означає місця без води.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Коли ж
  rationale: «Коли» природно передає загальну часову умову, а «ж» — м’який перехідний відтінок δέ без надмірного протиставлення.
- source_word: τὸ ἀκάθαρτον πνεῦμα
  choice: нечистий дух
  rationale: Усталений і прозорий відповідник, який зберігає лексику грецького тексту та її зв’язок із категоріями ритуальної чистоти.
- source_word: ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου
  choice: виходить із людини
  rationale: Теперішній час природно передає аористний кон’юнктив у загальній умові; «людина» точно й природно відтворює ἄνθρωπος без невиправданого звуження до чоловічої статі.
- source_word: διέρχεται δι’ ἀνύδρων τόπων
  choice: він проходить безводними місцями
  rationale: «Проходить» передає рух через певний простір, а «безводними» зберігає конкретний буквальний образ ἄνυδρος — місць без води.
- source_word: ζητοῦν ἀνάπαυσιν
  choice: шукаючи спокою
  rationale: Дієприслівникова конструкція передає одночасність дії, а «спокій» прямо відтворює значення ἀνάπαυσις без уточнення «місце відпочинку», якого немає в тексті.
- source_word: καὶ οὐχ εὑρίσκει
  choice: і не знаходить його
  rationale: Займенник «його» природний в українській мові й недвозначно відсилає до «спокою», хоча об’єкт у грецькому реченні мається на увазі.
theological_decisions:
- issue: Передача πνεῦμα в контексті вигнання злих духів
  choice: дух
  alternative: демон
  rationale: Хоча йдеться про особистого злого духа, джерельний текст уживає πνεῦμα, а не δαιμόνιον; «дух» зберігає формулювання оригіналу й не усуває його богословського змісту.
translation_notes:
  register: Сучасна стандартна українська мова; виклад природний і гідний, без архаїзмів. Частку «ж» збережено як легкий дискурсивний перехід. Маркер примітки поставлено безпосередньо після вислову, якого вона стосується.
