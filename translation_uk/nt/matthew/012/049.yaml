  text: καὶ ἐκτείνας τὴν χεῖρα αὐτοῦ ἐπὶ τοὺς μαθητὰς αὐτοῦ εἶπεν· Ἰδοὺ ἡ μήτηρ μου καὶ οἱ ἀδελφοί μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/049.yaml
  text: And stretching out his hand toward his disciples[a], he said, “Behold[b], my mother and my brothers.”
translation:
  language: uk
  text: 'І, простягнувши руку до Своїх учнів, Він сказав: «Ось[a] Моя мати й Мої брати[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «Дивіться» чи «Погляньте».'
    reason: lexical_alternative
  - marker: b
    text: Грецькою буквально «брати»; тут збережено форму чоловічого роду множини, а не розширено до «брати й сестри».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκτείνας
  choice: простягнувши
  rationale: Аористовий дієприкметник передає дію, що супроводжує головне дієслово; «простягнувши» природно й точно описує жест.
- source_word: χεῖρα
  choice: руку
  rationale: У цьому контексті звичайне значення — «рука» як конкретний жест Ісуса.
- source_word: ἐπὶ
  choice: до
  rationale: Зі знахідним відмінком у контексті жесту прийменник виражає спрямованість до учнів; українське «до» звучить природно.
- source_word: μαθητὰς
  choice: учнів
  rationale: «Учні» — усталений і точний відповідник, що зберігає стосунок учителя й учнів.
- source_word: Ἰδοὺ
  choice: Ось
  rationale: «Ось» природно передає вказівну й привертальну силу ἰδού без архаїчного забарвлення.
- source_word: μήτηρ
  choice: мати
  rationale: Прямий відповідник звичайного родинного терміна.
- source_word: ἀδελφοί
  choice: брати
  rationale: Грецьке слово має форму чоловічого роду множини, а безпосередній контекст використовує буквальну родинну лексику; тому збережено «брати», не розширюючи його до «брати й сестри».
theological_decisions:
- issue: Передача родинної мови в Ісусовому переосмисленні спорідненості
  choice: Збережено конкретні родинні назви «мати» і «брати»
  alternative: Передати ширше як «рідні», «сім’я» або «брати й сестри»
  rationale: Вислів навмисно вживає конкретні назви родичів, ототожнюючи учнів Ісуса з Його справжньою родиною. Узагальнення послабило б риторичну силу й додало б тлумачення, якого грецький текст прямо не висловлює.
translation_notes:
  register: Сучасна стандартна українська, природна й гідна оповідна мова. Займенники щодо Ісуса подано з великої літери відповідно до поширеної української біблійної традиції; синтаксис зберігає послідовність жесту й вислову без надмірної буквальності.
