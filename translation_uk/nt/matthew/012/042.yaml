reference: Matthew 12:42
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτήν· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/042.yaml
  text: The queen of the South will rise up in the judgment with this generation and will condemn it[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: uk
  text: Цариця півдня[b] підніметься на суді разом із цим поколінням і засудить його, бо вона прийшла з країв землі послухати мудрість Соломона. І ось, тут є щось більше за Соломона.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «тут є хтось більший за Соломона». У грецькому тексті вжито форму середнього роду — буквально «щось більше»; вона може наголошувати на незрівнянній величі, явленій в Ісусі та його служінні.'
    reason: alternative_reading
  - marker: b
    text: «Цариця півдня» — це вказівка на царицю Савську (1 Царів 10:1–13; 2 Хронік 9:1–12), хоча грецький текст прямо не називає Саву.
    reason: cross_reference
lexical_decisions:
- source_word: βασίλισσα νότου
  choice: Цариця Півдня
  rationale: Зберігає грецьку конструкцію «цариця Півдня» і не вводить у головний текст уточнення «Савська», якого в грецькому тексті немає.
- source_word: ἐγερθήσεται
  choice: підніметься
  rationale: Природно передає майбутню форму та зберігає можливий відтінок воскресіння і постання на суді, не уточнюючи механізму.
- source_word: ἐν τῇ κρίσει
  choice: на суді
  rationale: Природний український відповідник означеного есхатологічного суду.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: разом із цим поколінням
  rationale: Передає звичайне значення μετά з родовим відмінком — «разом із»; протиставлення виражене наступним дієсловом «засудить».
- source_word: κατακρινεῖ αὐτήν
  choice: і засудить його
  rationale: Дієслово означає «засудити», а займенник стосується іменника «покоління», який в українській мові середнього роду.
- source_word: ἐκ τῶν περάτων τῆς γῆς
  choice: з країв землі
  rationale: Зберігає усталений біблійний образ надзвичайно далекої відстані.
- source_word: ἀκοῦσαι τὴν σοφίαν Σολομῶνος
  choice: послухати мудрість Соломона
  rationale: Інфінітив передає мету приходу; «послухати» природно виражає свідоме слухання мудрих слів Соломона.
- source_word: ἰδοὺ
  choice: І ось
  rationale: Зберігає емфатичний вказівний характер дискурсивного маркера в сучасній, гідній українській мові.
- source_word: πλεῖον Σολομῶνος
  choice: щось більше за Соломона
  rationale: Передає середній рід πλεῖον і не звужує вислів до суто особового «хтось більший», зберігаючи широту твердження про Ісуса та його служіння.
- source_word: ὧδε
  choice: тут є
  rationale: Природно передає місцеве значення «тут»; дієслово додано відповідно до норм українського синтаксису.
theological_decisions:
- issue: Передача середнього роду πλεῖον стосовно Ісуса
  choice: щось більше за Соломона
  alternative: хтось більший за Соломона
  rationale: Грецьке πλεῖον має середній рід. Основний текст зберігає цю граматичну особливість і богословську широту вислову, не заперечуючи, що в контексті йдеться про велич самого Ісуса та його служіння.
translation_notes:
  register: Сучасна стандартна українська мова, зрозуміла широкому колу читачів, із гідним біблійним регістром. Збережено образність «країв землі», судовий контекст і граматичну неоднозначність πλεῖον.
