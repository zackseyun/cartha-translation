  text: εἰ δὲ ἐν πνεύματι θεοῦ ἐγὼ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/028.yaml
  text: But if I cast out the demons by the Spirit of God[b][a], then the kingdom of God has come upon you.
translation:
  language: uk
  text: Але якщо я виганяю демонів Духом Божим[a], то Царство Боже прийшло[b] до вас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «у Дусі Божому». Грецький вислів може передавати дію через Божого Духа або, залежно від тлумачення, дію у Дусі Божому.'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «досягло вас» або «прийшло на вас». Грецьке дієслово наголошує, що Боже Царство сягнуло слухачів у діяннях Ісуса.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Але якщо
  rationale: Передає умовність εἰ та легке протиставлення, виражене δέ, природною сучасною українською мовою.
- source_word: ἐν πνεύματι θεοῦ
  choice: Духом Божим
  rationale: Орудний відмінок природно передає засіб або дію через Божого Духа; особове найменування збережено.
- source_word: ἐγὼ
  choice: я
  rationale: Окремий займенник збережено, бо в грецькому тексті він виражений явно й має смисловий наголос.
- source_word: ἐκβάλλω
  choice: виганяю
  rationale: Природний і зрозумілий український відповідник у контексті звільнення людей від демонів.
- source_word: τὰ δαιμόνια
  choice: демонів
  rationale: Сучасний точний відповідник назви злих духовних істот; означеність у цьому контексті не потребує окремого вираження українською.
- source_word: ἄρα
  choice: то
  rationale: Позначає логічний висновок з умови в природній українській конструкції «якщо… то…».
- source_word: ἔφθασεν
  choice: вже прийшло
  rationale: Передає досягнення або прибуття Царства та його теперішню реальність у змальованих діях; «вже» робить результативний зміст природним українською, не зводячи вислів лише до наближення.
- source_word: ἐφ’ ὑμᾶς
  choice: до вас
  rationale: Природно передає спрямованість і те, що Царство сягнуло адресатів, без надмірно буквального й неприродного «на вас».
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Царство Боже
  rationale: Усталений, точний і місткий український відповідник, який допускає значення як Божого царювання, так і Його царства.
theological_decisions:
- issue: Значення приходу Божого Царства у зв’язку з вигнанням демонів
  choice: Вигнання демонів Божим Духом свідчить, що Боже Царство вже реально сягнуло слухачів у діяннях Ісуса.
  alternative: Царство лише наблизилося або йдеться виключно про його майбутнє здійснення.
  rationale: ἔφθασεν означає, що щось прибуло або досягло когось. Формулювання зберігає теперішню реальність приходу Царства, не заперечуючи його майбутньої повноти.
- issue: Кого позначає вислів «Дух Божий»
  choice: Божого Духа як особового божественного діяча.
  alternative: Безособову Божу силу.
  rationale: πνεύματι θεοῦ у цьому контексті називає Духа, через якого Ісус виганяє демонів; велика літера відбиває цей референт, не додаючи окремого пояснення до тексту.
translation_notes:
  register: Сучасна стандартна українська мова; виклад природний, ясний і гідний. Збережено явний займенник «я», логічну будову «якщо… то…» та напруження між теперішнім приходом Царства і його повнотою, якої цей вірш окремо не визначає.
