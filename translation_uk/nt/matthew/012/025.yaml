id: MAT.12.25
reference: Matthew 12:25
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: εἰδὼς ⸀δὲ τὰς ἐνθυμήσεις αὐτῶν εἶπεν αὐτοῖς· Πᾶσα βασιλεία μερισθεῖσα καθ’ ἑαυτῆς ἐρημοῦται, καὶ πᾶσα πόλις ἢ οἰκία μερισθεῖσα καθ’ ἑαυτῆς οὐ σταθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/025.yaml
  text: But knowing their thoughts[a], he said to them, “Every kingdom divided against itself is laid waste[c][b], and every city or house divided against itself will not stand.”
translation:
  language: uk
  text: 'Але Він, знаючи їхні думки[a], сказав їм: «Кожне царство, розділене проти самого себе, спустошується[b], і кожне місто чи кожен дім[c], розділені проти самих себе, не встоять».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «міркування» чи «наміри».
    reason: lexical_alternative
  - marker: b
    text: Або «стає пусткою» чи «зазнає руїни».
    reason: lexical_alternative
  - marker: c
    text: Слово «дім» тут може також означати родину або домашню спільноту.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: знаючи
  rationale: Дієприкметник передає факт знання або внутрішнього розпізнання й не уточнює, яким чином Ісус це знав.
- source_word: δὲ
  choice: але
  rationale: Частка позначає легкий перехід із відтінком протиставлення; «але» природно пов’язує відповідь Ісуса з попереднім контекстом.
- source_word: ἐνθυμήσεις
  choice: думки
  rationale: Слово може означати думки, міркування або наміри; «думки» є найприроднішим широким відповідником і не звужує змісту до одного виду внутрішнього наміру.
- source_word: Πᾶσα βασιλεία
  choice: кожне царство
  rationale: Збережено універсальний характер прислівного твердження.
- source_word: μερισθεῖσα καθ’ ἑαυτῆς
  choice: розділене проти самого себе
  rationale: Формулювання передає і внутрішній поділ, і спрямованість частин одна проти одної.
- source_word: ἐρημοῦται
  choice: спустошується
  rationale: Дієслово описує доведення до спустошення або руїни; українська недоконана форма природно виражає загальний наслідок у прислівному вислові.
- source_word: πόλις ἢ οἰκία
  choice: місто чи дім
  rationale: «Місто» точно передає πόλις, а «дім» зберігає широту οἰκία, яке залежно від контексту може стосуватися і будинку, і родини чи домашньої спільноти.
- source_word: οὐ σταθήσεται
  choice: не встоять
  rationale: Ідіоматичне «не встоять» стисло передає нездатність залишитися міцними або зберегтися.
theological_decisions:
- issue: Природа знання Ісуса про їхні внутрішні думки
  choice: Сказано лише, що Він знав їхні думки, без пояснення способу цього знання.
  alternative: Прямо вказати на надприродне всезнання, пророче знання або проникливий висновок із обставин.
  rationale: Грецький текст стверджує факт знання, але не пояснює його механізму; переклад зберігає цю невизначеність.
translation_notes:
  register: Сучасна, зрозуміла й водночас гідна українська мова. Збережено прислівну будову вислову, паралелізм царства, міста й дому та образ внутрішнього поділу без конфесійного уточнення.
