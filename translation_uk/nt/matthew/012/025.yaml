review_pass:
  verdict: approve
  source_fidelity: Переклад точно передає εἰδὼς як «знаючи», не уточнюючи характер цього знання; ἐνθυμήσεις як «думки»; прислівний універсальний вислів «кожне царство»; внутрішній, спрямований проти себе поділ; ἐρημοῦται як процес спустошення; а також майбутній наслідок οὐ σταθήσεται — «не встоять». «Місто чи ... дім» зберігає альтернативність πόλις ἢ οἰκία.
  naturalness: Текст звучить природно для сучасної літературної української та зберігає піднесений, але зрозумілий біблійний регістр. Множина «розділені ... не встоять» після координованого «кожне місто чи кожен дім» є допустимою семантичною узгодженістю в українській і виразно передає узагальнений принцип.
  terminology: «Царство», «спустошується», «місто», «дім» і «не встоять» є точними та усталеними відповідниками без зайвого конфесійного забарвлення. Примітка до «дому» слушно зберігає можливе значення οἰκία як родини або домашньої спільноти.
