  text: Ἐν ἐκείνῳ τῷ καιρῷ ἐπορεύθη ὁ Ἰησοῦς τοῖς σάββασιν διὰ τῶν σπορίμων· οἱ δὲ μαθηταὶ αὐτοῦ ἐπείνασαν καὶ ἤρξαντο τίλλειν στάχυας καὶ ἐσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/001.yaml
  text: At that time Jesus went through the grainfields on the Sabbath[a], and his disciples became hungry and began to pluck heads of grain and eat.
translation:
  language: uk
  text: Того часу Ісус пішов у суботу[a] через засіяні поля. Його учні зголодніли й почали зривати колоски та їсти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Грецькою буквально «у суботи»; це ідіоматична множина зі значенням «у суботу».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: Того часу
  rationale: Природний український часовий маркер, що передає καιρός як певний час або нагоду, а не точний момент за годинником.
- source_word: ἐπορεύθη
  choice: ішов
  rationale: У контексті руху через поля недоконаний український вид природно змальовує перебіг пересування, не додаючи значення тривалої подорожі.
- source_word: τοῖς σάββασιν
  choice: у суботу
  rationale: Грецька форма множини тут ужита ідіоматично на позначення суботнього дня; український одниновий вислів точно й природно передає зміст.
- source_word: διὰ τῶν σπορίμων
  choice: через засіяні поля
  rationale: σπόριμα означає засіяні, зокрема зерновими, поля. Варіант зберігає образ полів і не звужує назву культури понад те, що сказано в тексті.
- source_word: οἱ δὲ μαθηταὶ αὐτοῦ
  choice: Його учні
  rationale: δέ має слабку оповідну функцію; початок нового українського речення без окремого сполучника природно передає перехід до учнів.
- source_word: ἐπείνασαν
  choice: зголодніли
  rationale: Дококонаний дієслівний відповідник передає настання голоду, закладене в аористі, а не лише сталий стан.
- source_word: ἤρξαντο τίλλειν
  choice: почали зривати
  rationale: Точно передає початок повторюваної дії та ручне відривання колосків.
- source_word: στάχυας
  choice: колоски
  rationale: Звичне й зрозуміле українське позначення колосів зернової рослини; форма відповідає природному описові того, що зривали для їжі.
- source_word: καὶ ἐσθίειν
  choice: та їсти
  rationale: Другий інфінітив координується з τίλλειν після ἤρξαντο; українською не потрібно повторювати «почали».
theological_decisions:
- issue: Передача τοῖς σάββασιν
  choice: у суботу
  alternative: у суботи / по суботах
  rationale: Морфологічна множина в койне тут є усталеним ідіоматичним позначенням суботнього дня. Однина не вирішує богословської суперечки, а запобігає хибному враженню, ніби йдеться про кілька субот.
translation_notes:
  register: Сучасна літературна українська з гідним, простим оповідним звучанням. «Засіяні поля» точніше відбиває σπόριμα, тоді як згадка про колоски ясно показує, що йдеться про зернові. Маркер [a] розміщено безпосередньо після вислову, якого стосується примітка.
