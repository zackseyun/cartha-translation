source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ⸀ἄνθρωπος χεῖρα ἔχων ξηράν. καὶ ἐπηρώτησαν αὐτὸν λέγοντες· Εἰ ἔξεστι τοῖς σάββασιν ⸀θεραπεύειν; ἵνα κατηγορήσωσιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/010.yaml
  text: And behold[a], there was a man with a withered hand. And they asked him, saying, “Is it lawful to heal on the Sabbaths?” so that they might accuse him.
translation:
  language: uk
  text: 'І ось: чоловік із всохлою рукою. Вони запитали Ісуса: «Чи дозволено зцілювати по суботах[a]?» — щоб звинуватити Його.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «у суботу». У грецькому тексті стоїть множина — «по суботах», звичний спосіб говорити про суботні дні.'
    reason: лексична альтернатива та пояснення граматичного числа
lexical_decisions:
- source_word: ἰδοὺ
  choice: ось
  rationale: «Ось» природно передає вказівну й дискурсивну силу ἰδού, привертаючи увагу до чоловіка в сцені.
- source_word: ἄνθρωπος
  choice: чоловік
  rationale: У цьому контексті йдеться про конкретного дорослого чоловіка, тому «чоловік» точніше за загальне «людина».
- source_word: χεῖρα ἔχων ξηράν
  choice: з усохлою рукою
  rationale: Ідіоматична українська конструкція; «усохла» передає виснажену, атрофовану або паралізовану руку, не встановлюючи точного медичного діагнозу.
- source_word: ἐπηρώτησαν αὐτόν
  choice: вони запитали Ісуса
  rationale: Дієслово передано нейтрально як «запитали»; ворожий намір прямо висловлено наприкінці вірша. Ім’я «Ісуса» вжито замість займенника для природної української ясності в окремо наведеному вірші.
- source_word: ἔξεστι
  choice: чи дозволено
  rationale: «Дозволено» природно передає питання про припустимість дії за Законом у контексті суперечки про суботу.
- source_word: τοῖς σάββασιν
  choice: по суботах
  rationale: Ця форма зберігає грецьке число в природній українській мові й означає повторювані суботні дні.
- source_word: θεραπεύειν
  choice: зцілювати
  rationale: «Зцілювати» є природним для євангельських розповідей про відновлення здоров’я та не звужує значення до конкретної лікувальної процедури.
- source_word: ἵνα κατηγορήσωσιν αὐτοῦ
  choice: щоб звинуватити Його
  rationale: Зберігає значення мети в ἵνα та юридично-ворожий відтінок κατηγορέω, не додаючи подробиць про формальне обвинувачення.
theological_decisions:
- issue: Передача множини τοῖς σάββασιν у суперечці про суботу
  choice: по суботах
  alternative: у суботу
  rationale: Основний текст зберігає граматичну множину грецького вислову природним українським зворотом. Однина «у суботу» також правильно передає звичайний ідіоматичний зміст і подана в примітці.
- issue: Характер питання про зцілення
  choice: чи дозволено
  alternative: чи законно
  rationale: «Дозволено» ясно виражає питання про те, що припускає Закон, і не вирішує наперед самої суперечки; «законно» можливе, але українською може надмірно нагадувати сучасне цивільне право.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. Збережено оповідне «ось», множину «по суботах» та вираз мети обвинувачів; точний медичний стан руки не конкретизовано.
