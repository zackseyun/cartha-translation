source:
  edition: SBLGNT
  text: τότε πορεύεται καὶ παραλαμβάνει μεθ’ ἑαυτοῦ ἑπτὰ ἕτερα πνεύματα πονηρότερα ἑαυτοῦ, καὶ εἰσελθόντα κατοικεῖ ἐκεῖ· καὶ γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων. οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/045.yaml
  text: Then it goes and brings with itself seven other spirits more evil than itself[a], and they enter and live there; and the last state of that man becomes worse than the first[b]. So it will be also with this evil generation.
translation:
  language: uk
  text: Тоді він іде й бере із собою сім інших духів, зліших за себе[a]. Вони входять і оселяються там, і кінець тієї людини стає гіршим за початок[b]. Так буде й із цим злим поколінням.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «сім інших духів, лихіших за себе».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «останні речі тієї людини стають гіршими за перші»; тобто її остаточний стан стає гіршим за початковий.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε πορεύεται
  choice: Тоді він іде
  rationale: Передає часову послідовність і жвавий історичний теперішній час; займенник «він» природно вказує на нечистого духа з контексту.
- source_word: παραλαμβάνει μεθ’ ἑαυτοῦ
  choice: бере із собою
  rationale: Природний сучасний український відповідник зі значенням узяти когось разом із собою.
- source_word: ἑπτὰ ἕτερα πνεύματα
  choice: сім інших духів
  rationale: ἕτερα тут означає додаткових духів, а не обов’язково духів іншого виду; «духів» зберігає лексику оригіналу.
- source_word: πονηρότερα ἑαυτοῦ
  choice: зліших за себе
  rationale: Точно передає порівняльний ступінь моральної злості та природно звучить українською.
- source_word: εἰσελθόντα κατοικεῖ ἐκεῖ
  choice: Вони входять і оселяються там
  rationale: Дієприкметник передано особовою формою для природності; «оселяються» виражає тривале перебування. Попри формально однинне κατοικεῖ, за змістом суб’єктом є духи.
- source_word: γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων
  choice: кінець тієї людини стає гіршим за початок
  rationale: Зберігає образне протиставлення «останніх» і «перших» та передає ідіоматичний зміст — остаточний стан людини гірший від початкового.
- source_word: οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ
  choice: Так буде й із цим злим поколінням
  rationale: Природно передає застосування наведеного прикладу до сучасного Ісусові покоління, не послаблюючи πονηρᾷ.
theological_decisions:
- issue: Позначення демонічних істот словом πνεύματα
  choice: духів
  alternative: демонів
  rationale: Грецький текст має «духи», а демонічний характер уже зрозумілий із контексту про нечистого духа; конкретизація «демони» тут не потрібна.
- issue: Передача τοῦ ἀνθρώπου ἐκείνου
  choice: тієї людини
  alternative: того чоловіка
  rationale: ἄνθρωπος у цьому узагальненому прикладі означає людську особу, а не наголошує на чоловічій статі; українське «людина» точно й природно зберігає референцію.
- issue: Ідіома τὰ ἔσχατα… τῶν πρώτων
  choice: кінець… гіршим за початок
  alternative: остаточний стан… гіршим за попередній
  rationale: Обраний варіант зберігає образну форму грецького протиставлення, а примітка пояснює його ідіоматичний сенс.
translation_notes:
  register: Сучасна, зрозуміла й водночас гідна українська мова. Збережено образність оригіналу та її богословську напругу; синтаксис помірно спрощено задля природного читання.
