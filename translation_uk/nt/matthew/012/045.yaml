review_pass:
  verdict: revise
  source_fidelity: Потрібне уточнення синтаксису в другій частині. У поданому тексті SBLGNT εἰσελθόντα є множиною («вони, увійшовши»), тоді як κατοικεῖ має форму однини й природно повертається до первісного нечистого духа. Чернетка робить обидві дії множинними, тим самим нівелюючи цю особливість вихідного тексту. Також «кінець ... гіршим за початок» може означати кінець життя, тоді як грецька ідіома говорить про остаточний стан у зіставленні з попереднім.
  naturalness: «Тоді він іде й бере із собою» та «Так буде й із цим злим поколінням» природні для сучасної української. «Останній стан тієї людини» точніше передає ідіому і не створює небажаного значення фізичного кінця. «За нього» однозначніше, ніж «за себе», позначає, з ким порівнюються інші духи.
  terminology: «Духи» належно відтворює πνεύματα без невмотивованої конкретизації як «демони». «Злим поколінням» точно передає τῇ γενεᾷ ... τῇ πονηρᾷ. «Лихіших» у примітці є прийнятною лексичною альтернативою.
  issues:
  - severity: medium
    issue: Форму κατοικεῖ передано як множину «оселяються».
    rationale: 'У наданому SBLGNT κατοικεῖ — однина, на відміну від множинного εἰσελθόντα. Переклад має зберегти цю синтаксичну зміну: інші духи входять, а первісний дух оселяється там.'
  - severity: medium
    issue: «Кінець тієї людини ... за початок» неточно й потенційно двозначно передає τὰ ἔσχατα ... τῶν πρώτων.
    rationale: Вислів є ідіомою про останній/остаточний стан, а не про смерть чи завершення життя людини. Ясне «останній стан ... за перший» зберігає структуру й зміст.
  - severity: low
    issue: «Зліших за себе» має нечітке рефлексивне співвіднесення.
    rationale: Грецьке ἑαυτοῦ стосується первісного духа; «зліших за нього» однозначно передає це порівняння.
  revised_text: Тоді він іде й бере із собою сім інших духів, зліших за нього[a]. Вони входять, а він оселяється там; і останній стан тієї людини стає гіршим за перший[b]. Так буде й із цим злим поколінням.
  revised_footnotes:
