  text: πῶς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ καὶ τοὺς ἄρτους τῆς προθέσεως ⸂ἔφαγον, ὃ⸃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν οὐδὲ τοῖς μετ’ αὐτοῦ, εἰ μὴ τοῖς ἱερεῦσιν μόνοις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/004.yaml
  text: how he entered into the house of God and ate the bread of the Presence[a], which it was not lawful for him to eat, nor for those with him[b], but only for the priests?
translation:
  language: uk
  text: як він увійшов у дім Божий і вони їли[a] хліби покладення, яких не дозволено було їсти ні йому, ні тим, хто був із ним, а тільки священникам?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'У деяких рукописах: «він їв».'
    reason: textual_variant
lexical_decisions:
- source_word: πῶς
  choice: як
  rationale: Природно вводить зміст згадки про вчинок Давида й точно передає грецьке питальне слово.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: увійшов у дім Божий
  rationale: Зберігає рух усередину та буквальний образ «дому Божого», не підмінюючи його контекстуальним уточненням «скинія».
- source_word: τοὺς ἄρτους τῆς προθέσεως
  choice: хліби покладення
  rationale: Усталений біблійний термін для освячених хлібів, покладених перед Богом; множина відтворює грецьке ἄρτους.
- source_word: ἔφαγον
  choice: вони їли
  rationale: Основний текст SBLGNT має форму третьої особи множини; явний займенник потрібен українською для збереження цього текстового читання.
- source_word: ὃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν
  choice: яких не дозволялося їсти йому
  rationale: Безособова конструкція природно передає заборону; форма «яких» узгоджується з українським множинним «хліби».
- source_word: οὐδὲ τοῖς μετ’ αὐτοῦ
  choice: ні тим, хто був із ним
  rationale: Точно й природно позначає Давидових супутників без додаткової конкретизації.
- source_word: εἰ μὴ τοῖς ἱερεῦσιν μόνοις
  choice: а тільки священникам
  rationale: Передає виняток εἰ μή та винятковість μόνοις сучасною українською мовою.
theological_decisions:
- issue: Культово-правова сила οὐκ ἐξὸν ἦν
  choice: не дозволялося
  alternative: не було законно
  rationale: Українське «не дозволялося» природно виражає нормативну заборону в контексті Закону, тоді як кальковане «не було законно» звучить неприродно; додаткових богословських висновків не внесено.
- issue: Текстовий суб’єкт ἔφαγον
  choice: вони їли
  alternative: він їв
  rationale: Основний текст SBLGNT подає множину ἔφαγον, тому її збережено в тексті; відоме однинове читання зазначено у примітці.
translation_notes:
  register: Сучасна нормативна українська мова з гідним біблійним регістром. Збережено назву «дім Божий» і традиційний, але зрозумілий термін «хліби покладення». Розділове оформлення «ні… ні…, а тільки…» робить правову протилежність прозорою.
