  text: καὶ εἰ ἐγὼ ἐν Βεελζεβοὺλ ἐκβάλλω τὰ δαιμόνια, οἱ υἱοὶ ὑμῶν ἐν τίνι ἐκβάλλουσιν; διὰ τοῦτο αὐτοὶ ⸂κριταὶ ἔσονται ὑμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/027.yaml
  text: And if I cast out demons by Beelzebul[a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: uk
  text: І якщо Я виганяю демонів силою Вельзевула[a], то чиєю силою виганяють їх ваші сини? Тому вони й будуть вашими суддями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Грецькою: «Вельзевул»; в інших традиціях трапляється форма «Вельзевуб».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν Βεελζεβοὺλ
  choice: силою Вельзевула
  rationale: 'Прийменник ἐν тут має інструментальне значення: йдеться про силу або посередництво, яким нібито здійснюється вигнання. «Силою Вельзевула» природно передає цей зміст українською.'
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: виганяю демонів
  rationale: У контексті екзорцизму ἐκβάλλω означає примушувати вийти, виганяти; «виганяти демонів» є точним і сучасним українським відповідником.
- source_word: οἱ υἱοὶ ὑμῶν
  choice: ваші сини
  rationale: Збережено буквальний родинний вислів грецького тексту. У контексті він може позначати людей або учнів із середовища співрозмовників, але переклад не звужує цієї неоднозначності.
- source_word: ἐν τίνι
  choice: чиєю силою
  rationale: Паралельно до першого ἐν запитання має інструментальний зміст. Оскільки українське «ким?» могло б означати безпосереднього виконавця, «чиєю силою?» ясніше передає питання про джерело сили, не визначаючи його наперед.
- source_word: διὰ τοῦτο
  choice: тому
  rationale: Стисло й природно передає висновок із попереднього риторичного запитання.
- source_word: κριταὶ ἔσονται ὑμῶν
  choice: вони й будуть вашими суддями
  rationale: Збережено іменну конструкцію, майбутній час і риторичний наголос на αὐτοί за допомогою частки «й».
theological_decisions:
- issue: Форма та ідентифікація Βεελζεβούλ
  choice: Вельзевул
  alternative: Вельзевуб
  rationale: Основний текст відтворює форму Βεελζεβούλ у наданому грецькому джерелі; традиційнішу альтернативну форму подано в примітці, не гармонізуючи основний текст із пізнішою звичною формою.
- issue: Значення вислову «ваші сини»
  choice: Зберегти «ваші сини» без уточнення
  alternative: ваші люди / ваші учні
  rationale: Грецький текст допускає контекстуальне розуміння як представників або учнів співрозмовників, однак прямо вживає υἱοί. Переклад зберігає образ і не нав'язує конкретної ідентифікації.
translation_notes:
  register: Сучасна стандартна українська мова з гідним біблійним звучанням. Займенник «Я» написано з великої літери відповідно до поширеної української біблійної практики. Риторичну симетрію двох згадок про силу збережено природними українськими конструкціями.
