  text: While he was still speaking to the crowds[a], behold, his mother and his brothers were standing outside, seeking to speak to him.
translation:
  language: uk
  text: Коли Він ще говорив до натовпів, ось Його мати й брати[a] стояли зовні, прагнучи поговорити з Ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «близькі родичі», якщо ἀδελφοί розуміти ширше; грецьке слово тут має форму чоловічого роду множини, тому в основному тексті перекладено «брати».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι δὲ αὐτοῦ λαλοῦντος
  choice: Коли Він ще говорив
  rationale: Природно передає одночасність дії в родовому абсолютному з ἔτι; δέ тут є слабким оповідним переходом і не потребує окремого сполучника.
- source_word: τοῖς ὄχλοις
  choice: до натовпів
  rationale: Зберігає множину грецького ὄχλοις і природно звучить сучасною українською.
- source_word: ἰδοὺ
  choice: ось
  rationale: Передає вказівний оповідний маркер, який привертає увагу до нового розвитку подій, без архаїчності слова «ось».
- source_word: ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: Його мати й брати
  rationale: Присвійність природно поширено на обидва однорідні члени; ἀδελφοί передано формально точним чоловічим множинним «брати».
- source_word: εἱστήκεισαν ἔξω
  choice: стояли надворі
  rationale: Передає тривалий становий результат форми ἵστημι та не додає прямо не названого місця, як-от «біля будинку».
- source_word: ζητοῦντες αὐτῷ λαλῆσαι
  choice: бажаючи поговорити з Ним
  rationale: У цьому контексті ζητέω виражає намір або бажання домогтися розмови; українське «поговорити з Ним» природно передає мету, не уточнюючи змісту розмови.
theological_decisions:
- issue: Значення ἀδελφοί щодо родини Ісуса
  choice: брати
  alternative: близькі родичі; брати й сестри
  rationale: Грецька форма є чоловічим родом множини й на поверхневому рівні найприродніше означає «брати». Переклад не визначає точного ступеня їхньої спорідненості з Ісусом і залишає відповідну богословську дискусію відкритою.
translation_notes:
  register: Сучасна стандартна українська, природний і гідний оповідний стиль. Займенники щодо Ісуса подано з великої літери відповідно до поширеної української біблійної традиції; «ось» зберігає виразність ἰδού без надмірної архаїзації.
