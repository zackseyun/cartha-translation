language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἦν Ἰωνᾶς ἐν τῇ κοιλίᾳ τοῦ κήτους τρεῖς ἡμέρας καὶ τρεῖς νύκτας, οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ καρδίᾳ τῆς γῆς τρεῖς ἡμέρας καὶ τρεῖς νύκτας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/040.yaml
  text: For just as Jonah was in the belly of the sea creature three days and three nights[c][b][a], so the Son of Man will be in the heart of the earth three days and three nights.
translation:
  language: uk
  text: Бо як Йона був у череві великої морської істоти[a] три дні й три ночі[b], так і Син Людський буде в серці землі[c] три дні й три ночі.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «великої риби». Грецьке слово означає велику морську істоту й не є назвою конкретного біологічного виду.'
    reason: lexical_alternative
  - marker: b
    text: Вислів «три дні й три ночі» іноді розуміють ідіоматично — як такий, що охоплює частини трьох днів; інші тлумачать його суворіше.
    reason: alternative_reading
  - marker: c
    text: Вислів «у серці землі» може стосуватися поховання, могили, глибин землі або царини мертвих; в основному тексті збережено грецьку метафору.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Бо як
  rationale: «Бо» передає пояснювальну силу γάρ, а «як» природно вводить порівняння ὥσπερ, яке далі співвідноситься з «так і».
- source_word: Ἰωνᾶς
  choice: Йона
  rationale: Усталена сучасна українська біблійна форма імені.
- source_word: ἐν τῇ κοιλίᾳ
  choice: у череві
  rationale: Прямий і природний відповідник κοιλία в цьому контексті, який зберігає образ оповіді про Йону.
- source_word: τοῦ κήτους
  choice: морської потвори
  rationale: κῆτος позначає велику морську істоту й не вимагає вузького зоологічного визначення; «потвора» тут ужито в давнішому широкому значенні великої незвичайної істоти, а примітка запобігає хибному прочитанню.
- source_word: τρεῖς ἡμέρας καὶ τρεῖς νύκτας
  choice: три дні й три ночі
  rationale: Безпосередньо відтворює повторену часову формулу, не вирішуючи в перекладі питання про її ідіоматичне чи суворо буквальне розуміння.
- source_word: οὕτως
  choice: так і
  rationale: Природно завершує українську порівняльну конструкцію «як … так і».
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Син Людський
  rationale: Усталений український відповідник біблійного титулу, що зберігає його міжтекстові зв’язки.
- source_word: ἔσται
  choice: буде
  rationale: Точно передає майбутній час дієслова εἰμί без додавання значення тривалості на зразок «перебуватиме».
- source_word: ἐν τῇ καρδίᾳ τῆς γῆς
  choice: в серці землі
  rationale: Зберігає метафору καρδία та не звужує її до одного тлумачення — поховання, могили, глибин землі чи царини мертвих.
theological_decisions:
- issue: Значення вислову «в серці землі»
  choice: Метафору збережено буквально, без уточнення її предметного значення.
  alternative: «у могилі», «у глибинах землі» або «в царині мертвих»
  rationale: Грецький вислів допускає кілька пов’язаних тлумачень і сам не вимагає одного конкретного пояснення.
- issue: Сила вислову «три дні й три ночі»
  choice: Часову формулу збережено дослівно.
  alternative: Ідіоматичне позначення частин трьох днів або суворий проміжок у сімдесят дві години
  rationale: Переклад має відтворити явне формулювання вірша, не розв’язуючи в основному тексті дискусію про хронологію.
translation_notes:
  register: Сучасна нормативна українська мова з гідним біблійним звучанням. Синтаксис «Бо як … так і» природно передає грецьке порівняння. Лексему «морська потвора» супроводжено приміткою, оскільки в сучасній мові «потвора» може мати сильніше оцінне забарвлення, ніж грецьке κῆτος.
