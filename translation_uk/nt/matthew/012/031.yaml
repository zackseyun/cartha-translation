id: MAT.12.31
reference: Matthew 12:31
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: διὰ τοῦτο λέγω ὑμῖν, πᾶσα ἁμαρτία καὶ βλασφημία ἀφεθήσεται τοῖς ἀνθρώποις, ἡ δὲ τοῦ πνεύματος βλασφημία οὐκ ⸀ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/031.yaml
  text: Therefore I tell you[a], every sin and blasphemy will be forgiven people[b], but blasphemy against the Spirit will not be forgiven.
translation:
  language: uk
  text: 'Тому кажу вам: людям буде прощено кожен гріх і кожне богохульство, але богохульство проти Духа[a] не буде прощено.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «проти Святого Духа». Із найближчого контексту зрозуміло, що йдеться про Святого Духа, хоча в самому цьому вірші грецький текст має лише «Духа».'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Тому
  rationale: Природно передає висновок із попереднього контексту й зберігає логічний зв’язок.
- source_word: λέγω ὑμῖν
  choice: кажу вам
  rationale: Прямий і природний відповідник усталеної формули звернення, що зберігає її урочисту силу.
- source_word: πᾶσα ἁμαρτία καὶ βλασφημία
  choice: кожен гріх і кожне богохульство
  rationale: Повторення «кожен/кожне» природно передає розподільне значення πᾶσα при двох іменниках однини.
- source_word: βλασφημία
  choice: богохульство
  rationale: У контексті йдеться про зневажливе, богозневажне висловлювання; «богохульство» точніше за ширше «лихослів’я» чи «наклеп».
- source_word: ἀφεθήσεται
  choice: буде прощено
  rationale: Майбутній пасив ἀφίημι тут має значення прощення. Безособова українська конструкція природно передає пасив і дозволяє зберегти людей як одержувачів прощення.
- source_word: τοῖς ἀνθρώποις
  choice: людям
  rationale: Давальний відмінок позначає тих, кому дарується прощення; «людям» точно й гендерно нейтрально передає загальне значення.
- source_word: ἡ δὲ τοῦ πνεύματος βλασφημία
  choice: але богохульство проти Духа
  rationale: Родовий τοῦ πνεύματος у цьому контексті найприродніше розуміти як об’єкт богохульства. «Проти Духа» усуває хибне прочитання, ніби богохульство належить Духові.
theological_decisions:
- issue: Чи додавати «Святого» до πνεύματος в основному тексті
  choice: Духа
  alternative: Святого Духа
  rationale: У цьому вірші грецький текст містить лише τοῦ πνεύματος — «Духа», без ἁγίου. Найближчий контекст вказує на Святого Духа, але основний текст не додає відсутнього означення; уточнення подано у примітці.
translation_notes:
  register: Сучасна нормативна українська мова з гідним, виразним біблійним регістром. Безособове «буде прощено» звучить природніше, ніж буквальне пасивне узгодження, і водночас зберігає смислову паралель між двома частинами вірша.
