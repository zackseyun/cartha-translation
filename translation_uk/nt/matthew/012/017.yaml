    text: 'Або: «сказане пророком Ісаєю». Грецький текст буквально має «через», підкреслюючи посередницьку роль пророка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: щоб
  rationale: Природно вводить підрядне мети або наслідку й не звужує грецьку конструкцію до одного з цих відтінків.
- source_word: πληρωθῇ
  choice: сповнилося
  rationale: Усталений і зрозумілий відповідник у формулі здійснення пророцтва; форма передає аористний пасивний кон’юнктив після ἵνα.
- source_word: τὸ ῥηθὲν
  choice: сказане
  rationale: Субстантивований пасивний дієприкметник природно й стисло передано українським субстантивованим дієприкметником.
- source_word: διὰ
  choice: через
  rationale: 'Прийменник із родовим відмінком позначає посередництво: пророк передає звістку, не обов’язково постаючи її первинним джерелом.'
- source_word: Ἠσαΐου
  choice: Ісаю
  rationale: Ужито нормативну українську біблійну форму імені у знахідному відмінку відповідно до синтаксису перекладу.
- source_word: τοῦ προφήτου
  choice: пророка
  rationale: Збережено прикладкове означення Ісаї, наявне в грецькому тексті.
- source_word: λέγοντος
  choice: який говорить
  rationale: Особова підрядна конструкція природніше за буквальне «говорячи» приєднує цитату й зберігає теперішній час грецького дієприкметника.
theological_decisions:
- issue: Посередницька роль пророка у формулі цитування
  choice: через пророка Ісаю
  alternative: пророком Ісаєю
  rationale: «Через» точно зберігає διά з родовим відмінком і не робить пророка однозначно кінцевим джерелом вислову.
translation_notes:
