  source_fidelity: 'Текст точно передає всі основні елементи SBLGNT: протиставне δέ («Та»), часово-попередню дію ἰδόντες («побачивши це»), звернення Ἰδού («Поглянь»), повтор ποιοῦσιν … ποιεῖν («роблять … робити»), а також юридично-дозвільний зміст οὐκ ἔξεστιν («не дозволено»). «В суботу» природно передає ἐν σαββάτῳ. Додане «це» коректно відсилає до дії учнів у найближчому контексті й не вносить нового змісту.'
  naturalness: Формулювання сучасне, нормативне й стилістично придатне для біблійного наративу. «Та фарисеї, побачивши це, сказали йому» звучить природно; пряма мова ясна та неархаїчна.
  terminology: «Фарисеї», «учні» та «субота» є усталеними й точними відповідниками. «Не дозволено» обережно зберігає значення дозволеності/правомірності, не нав’язуючи конкретного розуміння підстави заперечення. Виноска подає справжню лексичну альтернативу без зміни змісту.
