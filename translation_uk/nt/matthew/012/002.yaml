id: MAT.12.2
reference: Matthew 12:2
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἰδόντες εἶπαν αὐτῷ· Ἰδοὺ οἱ μαθηταί σου ποιοῦσιν ὃ οὐκ ἔξεστιν ποιεῖν ἐν σαββάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/002.yaml
  text: But when the Pharisees saw it[a], they said to him, “Look, your disciples are doing what is not lawful to do on the Sabbath.”
translation:
  language: uk
  text: 'Та фарисеї, побачивши це, сказали йому: «Поглянь, твої учні роблять те, чого не дозволено[a] робити в суботу».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «чого не можна робити».'
    reason: Лексична альтернатива для οὐκ ἔξεστιν; цей варіант природніший у розмовній українській, але слабше передає юридично-дозвільний відтінок.
lexical_decisions:
- source_word: δὲ
  choice: Та
  rationale: Передає протиставний перехід до реакції фарисеїв природним сучасним українським сполучником.
- source_word: ἰδόντες
  choice: побачивши це
  rationale: Аористовий дієприкметник передано попередньою щодо головної дії обставиною; «це» відсилає до вчинку учнів із попереднього вірша, не уточнюючи його понад контекст.
- source_word: εἶπαν αὐτῷ
  choice: сказали йому
  rationale: Прямий і нейтральний відповідник усталеної грецької формули мовлення.
- source_word: Ἰδοὺ
  choice: Поглянь
  rationale: Зберігає спонукальну силу вигуку, яким привертають увагу до звинувачення, без архаїчного забарвлення.
- source_word: μαθηταί
  choice: учні
  rationale: Усталений український відповідник у євангельському контексті, що зберігає стосунок учителя й учнів.
- source_word: ποιοῦσιν ... ποιεῖν
  choice: роблять ... робити
  rationale: Повтор дієслова ποιέω збережено, як у грецькому тексті.
- source_word: ὃ οὐκ ἔξεστιν
  choice: те, чого не дозволено
  rationale: Передає значення дозволеності чи правомірності, не визначаючи, чи йдеться про писаний Закон, його тлумачення або традицію.
- source_word: ἐν σαββάτῳ
  choice: в суботу
  rationale: Природний український часовий вислів; контекст стосується суботнього дня та його дотримання.
theological_decisions:
- issue: Підстава заперечення фарисеїв
  choice: «не дозволено» — юридично-дозвільне формулювання без уточнення джерела заборони
  alternative: «проти Закону» або «заборонено Законом»
  rationale: Грецький текст наводить звинувачення, але не називає конкретного джерела норми й у цьому вірші не оцінює слушності звинувачення.
translation_notes:
  register: Сучасна стандартна українська, природна й гідна. Займенники щодо Ісуса подано з малої літери відповідно до нейтральної сучасної редакційної практики; пряму мову сформульовано виразно, без архаїзмів.
