  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: κάλαμον συντετριμμένον οὐ κατεάξει καὶ λίνον τυφόμενον οὐ σβέσει, ἕως ἂν ἐκβάλῃ εἰς νῖκος τὴν κρίσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/020.yaml
  text: He will not break a bruised reed[a], and he will not extinguish a smoldering wick[b], until he brings justice to victory.
translation:
  language: uk
  text: Він не зламає надломлену очеретину й не погасить тліючий ґніт[a], доки не доведе справедливість до перемоги[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «льон, що димиться»; йдеться про лляний ґніт світильника.'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «доки не доведе суд до перемоги».'
    reason: alternative_reading
lexical_decisions:
- source_word: κάλαμον
  choice: очеретину
  rationale: κάλαμος у цьому пророчому образі означає очерет або очеретяне стебло; «очеретина» природно позначає окреме стебло.
- source_word: συντετριμμένον
  choice: надломлену
  rationale: Дієприкметник описує сильно пошкоджену, але ще не остаточно переламану очеретину; «надломлену» зберігає цю відмінність перед дієсловом «зламає».
- source_word: κατεάξει
  choice: не зламає
  rationale: κατάγνυμι означає ламати або переламувати; «не зламає» є ясним і природним відповідником.
- source_word: λίνον
  choice: ґніт
  rationale: Буквально слово позначає льон, але в цьому образі йдеться про зроблений із льону ґніт світильника. Предмет названо прямо, а буквальний образ подано у примітці.
- source_word: τυφόμενον
  choice: тліючий
  rationale: Форма описує ґніт, який димить і ледь горить, наближаючись до згасання; «тліючий» природно передає цей стан.
- source_word: σβέσει
  choice: не погасить
  rationale: σβέννυμι означає гасити; «не погасить» точно й звично сполучається з ґнотом.
- source_word: ἕως ἂν
  choice: доки не
  rationale: Конструкція вказує на майбутню межу, до якої чинні попередні заперечення; українське «доки не» стисло передає цей зв’язок.
- source_word: ἐκβάλῃ
  choice: приведе
  rationale: 'У сполученні з εἰς νῖκος дієслово має результативний зміст: довести або привести щось до певного підсумку.'
- source_word: εἰς νῖκος
  choice: до перемоги
  rationale: Вислів позначає успішний, переможний підсумок і природно передається як «до перемоги».
- source_word: τὴν κρίσιν
  choice: справедливість
  rationale: У контексті цитати про Слугу κρίσις стосується встановлення справедливого Божого порядку, а не лише винесення судового рішення; можливість перекладу «суд» збережено в примітці.
theological_decisions:
- issue: Значення κρίσις у цитаті про Слугу
  choice: справедливість
  alternative: суд
  rationale: «Справедливість» передає ширший пророчий сенс установлення праведного порядку, тоді як «суд» є формальнішим і також лексично можливим; неоднозначність відкрито збережено у примітці.
- issue: Ступінь буквальності образу λίνον
  choice: тліючий ґніт ... не погасить
  alternative: льон, що димиться ... не загасить
  rationale: У головному тексті названо реальний предмет образу — лляний ґніт світильника, щоб сучасний читач відразу його зрозумів; буквальне позначення льону наведено у примітці.
translation_notes:
  register: Сучасна стандартна українська мова з гідним, але доступним біблійним звучанням. Синтаксис зберігає паралелізм двох образів і фінальну часову конструкцію; займенник «Він» ужито для ясності відповідно до контексту цитати.
