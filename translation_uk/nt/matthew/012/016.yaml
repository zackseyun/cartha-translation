lexical_decisions:
- source_word: καὶ
  choice: І
  rationale: Простий сполучник продовжує розповідь без додавання причинового чи часового відтінку.
- source_word: ἐπετίμησεν
  choice: суворо наказав
  rationale: У цьому контексті дієслово передає сильну заборону або настійний припис. Вислів «суворо наказав» природно передає силу слова, не натякаючи неодмінно на моральну провину адресатів.
- source_word: αὐτοῖς
  choice: їм
  rationale: Давальний відмінок множини прямо позначає людей, до яких звернений припис.
- source_word: ἵνα μὴ
  choice: не
  rationale: Після дієслова наказу конструкція вводить зміст заборони; український інфінітив із «не» передає це природно й стисло.
- source_word: φανερὸν αὐτὸν ποιήσωσιν
  choice: розголошувати про нього
  rationale: Грецький зворот означає зробити когось відомим, публічно виявити або поширити відомості про нього. «Розголошувати про нього» ясно передає заборону публічного поширення, не уточнюючи понад текст, що саме не слід повідомляти.
theological_decisions:
- issue: Характер припису Ісуса щодо розголосу
  choice: Сильна заборона публічно розголошувати про нього
  alternative: Докір адресатам або нейтральне попередження
  rationale: ἐπιτιμάω допускає значення докору, суворого попередження чи наказу. Залежна конструкція з ἵνα μή показує, що тут ідеться про настійний припис; причину заборони сам вірш не пояснює, тому переклад її не додає.
translation_notes:
  register: Сучасна літературна українська, природна й гідна за тоном. Формулювання зберігає стислість грецького речення та силу наказу; займенник «нього» написано з малої літери відповідно до звичайної сучасної практики перекладу.
