base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/050.yaml
  text: For whoever does the will of my Father in heaven[a], he is my brother and sister and mother.
translation:
  language: uk
  text: Бо хто виконує волю мого Отця, Який на небесах, той є Мені братом, сестрою й матір’ю.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Грецький текст уживає граматично чоловічі форми однини в загальному значенні: йдеться про кожного, хто виконує волю Отця.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις ... ἂν
  choice: хто ... той
  rationale: Неозначена відносна конструкція з ἄν виражає загальну відкриту умову. Українська співвідносна конструкція «хто ... той» природно передає значення «кожен, хто», зберігаючи однину.
- source_word: γὰρ
  choice: Бо
  rationale: Передає пояснювальний зв’язок із попереднім висловом і природно звучить на початку українського речення.
- source_word: ποιήσῃ
  choice: виконує
  rationale: У сполученні з θέλημα дієслово означає здійснювати або виконувати волю. «Виконує» є сучасним і точним, тоді як «слухається» звужувало б значення до послуху.
- source_word: τὸ θέλημα
  choice: волю
  rationale: Зберігає пряме богословське й особове значення іменника без пояснювального перефразування.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: мого Отця, Який на небесах
  rationale: Відтворює присвійний зв’язок і означальну прийменникову конструкцію. Множина «небесах» відповідає οὐρανοῖς; підрядна форма природна українською.
- source_word: αὐτός
  choice: той
  rationale: 'Співвідносне «той» має виразну вказівну силу й підкреслює: саме людина, яка виконує волю Отця, належить до Ісусової родини.'
- source_word: ἀδελφὸς καὶ ἀδελφὴ καὶ μήτηρ
  choice: брат, і сестра, і мати
  rationale: Окремо зберігає всі три назви родинних стосунків. Повторення «і» відтворює грецьке καὶ ... καὶ та надає кожній назві належної ваги.
- source_word: ἐστίν
  choice: —
  rationale: У теперішньому часі українська природно опускає дієслово-зв’язку «є»; тире прозоро позначає іменний присудок без зміни змісту.
theological_decisions:
- issue: Граматично чоловіча форма в загальному твердженні
  choice: хто ... той — мій брат, і сестра, і мати
  alternative: кожна людина, яка ... є мені братом, сестрою і матір’ю
  rationale: Грецькі ὅστις, αὐτός та ἀδελφός стоять у чоловічому роді однини, але конструкція має загальне значення. Українське «хто ... той» зберігає представницьку чоловічу форму, а подальші «сестра» і «мати» недвозначно показують, що вислів охоплює і чоловіків, і жінок.
translation_notes:
  register: Сучасна стандартна українська з гідним, доступним біблійним звучанням. «Виконує волю» обрано замість архаїчнішого «чинить волю». Велика літера в «Отець» і відносному займеннику «Який» позначає звернення до Бога, без надмірної архаїзації.
