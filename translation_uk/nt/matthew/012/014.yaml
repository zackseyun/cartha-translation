id: MAT.12.14
reference: Matthew 12:14
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ⸂ἐξελθόντες δὲ οἱ Φαρισαῖοι συμβούλιον ἔλαβον κατ’ αὐτοῦ⸃ ὅπως αὐτὸν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/014.yaml
  text: But the Pharisees went out and conspired against him, how they might destroy him.
translation:
  language: uk
  text: А фарисеї, вийшовши, змовилися проти нього, як би його погубити.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «вбити його» чи «заподіяти йому смерть». Грецьке слово буквально має ширше значення «погубити, знищити», але в цьому контексті може означати смертельний намір.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: вийшовши
  rationale: Аористовий дієприкметник передає попередню щодо змови дію та природно зберігає послідовність подій.
- source_word: δὲ
  choice: А
  rationale: Частка позначає перехід із легким протиставленням між вчинком Ісуса та ворожою реакцією фарисеїв.
- source_word: οἱ Φαρισαῖοι
  choice: фарисеї
  rationale: Усталена українська назва цієї юдейської релігійної групи.
- source_word: συμβούλιον ἔλαβον
  choice: змовилися
  rationale: Грецький зворот буквально означає «взяли раду», але в поєднанні з κατ’ αὐτοῦ та наступною цільовою конструкцією природно позначає спільне вороже замишляння.
- source_word: κατ’ αὐτοῦ
  choice: проти нього
  rationale: κατά з родовим відмінком у цьому контексті має виразне значення спрямованості проти когось.
- source_word: ὅπως
  choice: як би
  rationale: Передає зміст їхньої змови та зберігає відтінок обмірковування способу здійснення наміру.
- source_word: ἀπολέσωσιν
  choice: погубити
  rationale: «Погубити» зберігає ширший зміст ἀπόλλυμι — знищити або спричинити загибель — і водночас у цьому контексті допускає очевидний смертельний намір.
theological_decisions:
- issue: Ступінь конкретизації значення ἀπολέσωσιν
  choice: погубити
  alternative: вбити; заподіяти йому смерть
  rationale: Контекст указує на смертельний намір, однак саме грецьке дієслово ширше за недвозначне «вбити». Основний текст не звужує його значення, а примітка подає конкретніші контекстуальні відповідники.
translation_notes:
  register: Сучасна літературна українська мова з гідним біблійним звучанням. Зворот «як би його погубити» навмисно зберігає обмірковувальний відтінок грецької конструкції; займенники щодо Ісуса подано з малої літери відповідно до загальних норм сучасного правопису.
