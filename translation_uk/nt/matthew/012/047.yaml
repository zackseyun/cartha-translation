  text: Then someone said to him[a], “Look, your mother and your brothers are standing outside, seeking to speak to you.”
translation:
  language: uk
  text: 'Тоді хтось сказав Йому[a]: «Ось Твоя мати й Твої брати стоять надворі й прагнуть поговорити з Тобою».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: У деяких рукописах цього вірша немає.
    reason: textual_variant
lexical_decisions:
- source_word: εἶπεν δέ τις αὐτῷ
  choice: Тоді хтось сказав Йому
  rationale: δέ має слабку сполучну функцію, яку природно передає «тоді» в послідовному викладі; τις є неозначеним займенником, тому «хтось» точно й природно.
- source_word: Ἰδοὺ
  choice: Ось
  rationale: «Ось» є природним сучасним українським засобом привернення уваги та зберігає вказівну силу ἰδού без архаїчності.
- source_word: ἡ μήτηρ σου
  choice: Твоя мати
  rationale: Прямо передає іменник і присвійний займенник у природному українському порядку слів.
- source_word: οἱ ἀδελφοί σου
  choice: Твої брати
  rationale: У цьому контексті ἀδελφοί позначає чоловіків із родинного кола; «брати» точніше за нейтральне «рідні» чи «брати й сестри».
- source_word: ἔξω ἑστήκασιν
  choice: стоять надворі
  rationale: Перфект ἵστημι виражає наявний стан — вони стали й тепер стоять; «надворі» явно передає ἔξω.
- source_word: ζητοῦντές σοι λαλῆσαι
  choice: хочуть поговорити з Тобою
  rationale: У цьому контексті ζητέω з інфінітивом природно виражає намір або бажання. «Поговорити з Тобою» є сучасним ідіоматичним відповідником λαλῆσαι σοι та не припускає змісту розмови.
theological_decisions:
- issue: Текстологічний статус Матвія 12:47
  choice: Вірш включено до основного тексту відповідно до наданого тексту SBLGNT, а варіант засвідчено приміткою.
  alternative: Не включати вірш, оскільки в деяких рукописах його немає.
  rationale: Надане джерело містить цей вірш, хоча й позначає текстологічну непевність. Включення з приміткою зберігає прозорість і не приховує важливого варіанта.
