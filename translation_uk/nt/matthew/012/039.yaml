source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/039.yaml
  text: But he answered and said to them[a], “An evil and adulterous generation seeks a sign[b], and no sign will be given to it except the sign of Jonah the prophet.”
translation:
  language: uk
  text: 'А він у відповідь сказав їм: «Лукаве й перелюбне покоління[a] шукає знамення, та жодного знамення йому не буде дано, крім знамення пророка Йони[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Перелюбне» може вказувати не лише на статеву аморальність, а й на невірність Богові; у пророків перелюб є образом порушення вірності завіту.
    reason: cross_reference
  - marker: b
    text: 'Буквально: «знамення Йони-пророка».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: у відповідь сказав
  rationale: Природно передає обидва елементи поширеної оповідної конструкції — дієприкметник «відповівши» та особову форму «сказав» — без неприродного для сучасної української повтору.
- source_word: Γενεὰ
  choice: покоління
  rationale: Передає сучасну Ісусові сукупність людей, яку охарактеризовано з морального погляду, і зберігає збірне значення іменника в однині.
- source_word: πονηρὰ
  choice: лукаве
  rationale: У біблійному контексті «лукаве» природно й вагомо виражає моральне зло; воно не звужує вислів до одного конкретного різновиду нечестя.
- source_word: μοιχαλὶς
  choice: перелюбне
  rationale: Зберігає гострий образ перелюбу, який може стосуватися як моральної розбещеності, так і пророчої метафори невірності Богові, не зводячи його лише до пояснювального «невірне».
- source_word: σημεῖον
  choice: знамення
  rationale: Прямий і традиційно зрозумілий відповідник, який охоплює підтверджувальний знак, не додаючи відсутнього в грецькому тексті означення «чудесне».
- source_word: ἐπιζητεῖ
  choice: шукає
  rationale: Передає основне значення дієслова без надмірного посилення до «вимагає»; негативну оцінку цього шукання вже виражає контекст.
- source_word: δοθήσεται
  choice: буде дано
  rationale: Природно й точно передає майбутній час пасивного стану.
- source_word: αὐτῇ
  choice: йому
  rationale: Займенник відсилає до українського іменника середнього роду «покоління»; форма «йому» зберігає цей зв’язок і не персоніфікує колектив.
- source_word: εἰ μὴ
  choice: крім
  rationale: У заперечній конструкції чітко виражає виняток.
- source_word: τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου
  choice: знамення Йони-пророка
  rationale: Передає прикладкове означення τοῦ προφήτου та досить близько відтворює грецьку послідовність, не пояснюючи наперед природу знамення.
theological_decisions:
- issue: Значення означення «перелюбне» в Ісусовому осуді
  choice: У головному тексті збережено образне й пророчо насичене слово «перелюбне».
  alternative: невірне
  rationale: Грецьке слово може викликати асоціацію із завітною невірністю, а водночас лишається гострим моральним звинуваченням. Переклад не повинен усувати цю багатозначність пояснювальною заміною.
- issue: Природа «знамення Йони»
  choice: Вислів залишено без тлумачення в головному тексті.
  alternative: знамення, подібне до пережитого Йоною; знамення, яким є сам Йона
  rationale: Цей вірш лише вводить вислів, який далі розкриває найближчий контекст; конкретизація тут передчасно вирішила б тлумачне питання.
translation_notes:
  register: Сучасна нормативна українська мова з урочистим, але доступним біблійним звучанням. Сполука «у відповідь сказав» природно відтворює грецьку оповідну формулу; «знамення» та «перелюбне» зберігають біблійну образність і богословську напругу.
