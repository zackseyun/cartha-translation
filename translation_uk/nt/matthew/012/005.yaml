reference: Matthew 12:5
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ἢ οὐκ ἀνέγνωτε ἐν τῷ νόμῳ ὅτι τοῖς σάββασιν οἱ ἱερεῖς ἐν τῷ ἱερῷ τὸ σάββατον βεβηλοῦσιν καὶ ἀναίτιοί εἰσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/005.yaml
  text: Or have you not read in the Law that on the Sabbaths the priests in the temple profane the Sabbath and are guiltless?[a][b][c]
translation:
  language: uk
  text: Або хіба ви не читали в Законі[c], що по суботах[b] священники в храмі порушують святість суботи[a] і не винні?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «оскверняють суботу» чи «порушують суботу». Грецьке дієслово означає поводитися зі святим як зі звичайним, тобто профанувати його.
    reason: lexical_alternative
  - marker: b
    text: Грецькою «по суботах» (множина); імовірно, маються на увазі повторювані випадки суботнього служіння, а не одна субота.
    reason: lexical_alternative
  - marker: c
    text: Закон тут означає Мойсеїв Закон як частину Писання; імовірно, йдеться про приписи щодо священницького служіння в суботу (пор. Чис. 28:9–10).
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: Або
  rationale: Вводить наступний біблійний аргумент у відповіді Ісуса й природно зберігає риторичний зв’язок.
- source_word: οὐκ ἀνέγνωτε
  choice: хіба ви не читали
  rationale: Природна українська формула риторичного запитання, що передає грецький аорист без неприродного уточнення часу.
- source_word: ἐν τῷ νόμῳ
  choice: в Законі
  rationale: Велика літера вказує на Мойсеїв Закон як корпус Писання, а не на закон узагалі.
- source_word: τοῖς σάββασιν
  choice: по суботах
  rationale: Передає форму множини та повторюваність суботніх випадків природною сучасною українською.
- source_word: οἱ ἱερεῖς
  choice: священники
  rationale: Пряме позначення храмових служителів; нормативне сучасне українське написання.
- source_word: ἐν τῷ ἱερῷ
  choice: в храмі
  rationale: Природно передає ἱερόν як храмовий комплекс без перевантаження основного тексту.
- source_word: τὸ σάββατον βεβηλοῦσιν
  choice: порушують святість суботи
  rationale: Передає значення βεβηλόω — поводитися зі святим як зі звичайним, профанувати — зрозумілою українською мовою та зберігає сильну риторичну напругу.
- source_word: ἀναίτιοί εἰσιν
  choice: не винні
  rationale: Стисло й природно передає відсутність провини або юридичної відповідальності.
theological_decisions:
- issue: Чи слід пом’якшувати твердження про порушення святості суботи священниками
  choice: Збережено сильне формулювання «порушують святість суботи» разом із «не винні».
  alternative: «порушують суботу, але залишаються невинними» або пом’якшене «працюють у суботу».
  rationale: Грецький текст навмисно поєднує сильне βεβηλοῦσιν із твердженням про відсутність вини. Переклад не усуває цієї богословської та риторичної напруги.
translation_notes:
  register: Сучасна стандартна українська, природний і водночас гідний біблійний стиль. Форму множини τοῖς σάββασιν передано прислівниковим зворотом «по суботах». Вираз «порушують святість» обрано замість менш зрозумілого широкому читачеві «профанують».
