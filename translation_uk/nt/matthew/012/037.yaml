reference: Matthew 12:37
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ἐκ γὰρ τῶν λόγων σου δικαιωθήσῃ, καὶ ἐκ τῶν λόγων σου καταδικασθήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/037.yaml
  text: For by your words you will be justified[a], and by your words you will be condemned.
translation:
  language: uk
  text: Бо за своїми словами ти будеш виправданий[a], і за своїми словами будеш засуджений.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «визнаний правим». Грецьке дієслово тут може мати судове значення — бути визнаним правим.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: за
  rationale: У сполученні з родовим відмінком ἐκ тут указує на підставу або свідчення, на основі якого відбувається суд. Українське «за своїми словами» природно передає цю судову підставу.
- source_word: γάρ
  choice: бо
  rationale: γάρ пояснює та обґрунтовує попереднє застереження про людську мову; «бо» стисло й природно зберігає цей зв’язок.
- source_word: λόγων σου
  choice: своїми словами
  rationale: λόγοι в множині означає висловлені слова. Зворотний займенник «своїми» природний українською, оскільки слова належать підметові «ти», і повторення зберігає грецький паралелізм.
- source_word: δικαιωθήσῃ
  choice: ти будеш виправданий
  rationale: 'Майбутній пасив від δικαιόω у протиставленні до καταδικάζω має судовий зміст: визнання правим або виправдання. «Будеш виправданий» зберігає юридичний і ширший біблійний регістр слова.'
- source_word: καταδικασθήσῃ
  choice: будеш засуджений
  rationale: Майбутній пасив від καταδικάζω має виразний судовий зміст і становить навмисну антитезу до δικαιωθήσῃ. «Будеш засуджений» точно й природно передає цей контраст.
theological_decisions:
- issue: Судовий зміст δικαιόω у зв’язку зі словами людини та судом
  choice: «будеш виправданий» — у судовому значенні, тобто визнаний правим
  alternative: «будеш визнаний правим» або «будеш виправданий судом»
  rationale: Безпосередня антитеза до «будеш засуджений» задає судовий контекст. Формулювання «будеш виправданий» зберігає богословську напругу вислову й не уточнює понад текст, яким саме чином слова є підставою чи свідченням на суді.
translation_notes:
  register: Сучасна літературна українська з гідним біблійним звучанням. Збережено двочленний паралелізм оригіналу та повтор «за своїми словами»; у другій частині займенник «ти» природно не повторено, хоча особа однозначно виражена формою дієслова.
