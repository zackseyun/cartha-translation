source:
  edition: SBLGNT
  text: εἰ δὲ ἐγνώκειτε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν, οὐκ ἂν κατεδικάσατε τοὺς ἀναιτίους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/007.yaml
  text: But if you had known what this means[b][a], ‘I desire mercy and not sacrifice,’ you would not have condemned the guiltless.
translation:
  language: uk
  text: 'А якби ви знали, що означає: «Милосердя Я хочу, а не жертви»[a], то не засудили б невинних[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ісус цитує Осії 6:6.
    reason: cross_reference
  - marker: b
    text: 'Або: «тих, хто не має вини».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκειτε
  choice: якби ви знали
  rationale: Умовна конструкція з подальшим οὐκ ἂν κατεδικάσατε виражає нереальну умову щодо минулого; українська форма «якби ви знали ... то не засудили б» природно передає докір за попереднє нерозуміння.
- source_word: τί ἐστιν
  choice: що означає
  rationale: У вступі до цитати це природний український відповідник, що стосується розуміння сенсу Писання, а не просто ототожнення.
- source_word: ἔλεος
  choice: милосердя
  rationale: «Милосердя» точно передає співчутливе й милостиве ставлення в цій цитаті з Осії, не звужуючи його до самої емоції.
- source_word: θέλω
  choice: Я хочу
  rationale: «Хочу» є прямим і природним відповідником θέλω; порядок «Милосердя Я хочу» зберігає наголос грецького тексту на милосерді та пасує до урочистої цитати.
- source_word: θυσίαν
  choice: жертви
  rationale: Родовий відмінок після заперечення природно передає грецький знахідний однини в протиставленні «а не жертви».
- source_word: κατεδικάσατε
  choice: не засудили б
  rationale: Передає судово-правовий зміст καταδικάζω та нереальний наслідок у минулому.
- source_word: ἀναιτίους
  choice: невинних
  rationale: «Невинних» природно й точно виражає відсутність вини та узгоджується із судовим дієсловом «засудили»; можливий буквальніший варіант подано в примітці.
theological_decisions:
- issue: Пророче протиставлення милосердя і жертви в цитаті з Осії 6:6
  choice: «Милосердя Я хочу, а не жертви»
  alternative: «Милосердя Я хочу більше, ніж жертви»
  rationale: Грецький текст має різке καὶ οὐ без слова «більше». Переклад зберігає цю напругу й пріоритет милосердя, не додаючи пояснення, яке могло б послабити формулювання або перетворити його на твердження про повне скасування жертв.
translation_notes:
  register: Сучасна стандартна українська мова, природна й гідна. Цитата має дещо урочистий порядок слів, який водночас зберігає початковий наголос на милосерді. Маркери приміток розміщено безпосередньо після відповідних місць.
