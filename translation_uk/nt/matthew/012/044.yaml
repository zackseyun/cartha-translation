  text: τότε λέγει· ⸂Εἰς τὸν οἶκόν μου ἐπιστρέψω⸃ ὅθεν ἐξῆλθον· καὶ ἐλθὸν ⸀εὑρίσκει ⸀σχολάζοντα σεσαρωμένον καὶ κεκοσμημένον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/044.yaml
  text: Then it says[a], ‘I will return to my house from which I came out,’ and when it comes, it finds it unoccupied, swept[b], and put in order.
translation:
  language: uk
  text: 'Тоді він каже: «Повернуся до свого дому, з якого я вийшов». І, прийшовши, знаходить його порожнім[a], виметеним і впорядкованим[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «незайнятим».'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «оздобленим» чи «прикрашеним».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Тоді
  rationale: Стислий і природний часовий прислівник, що вводить наступну дію в розповіді.
- source_word: λέγει
  choice: він каже
  rationale: Теперішній час зберігає жвавість оповіді; займенник «він» природно вказує на нечистого духа з попереднього контексту, не називаючи його повторно.
- source_word: Εἰς τὸν οἶκόν μου ἐπιστρέψω
  choice: Повернуся до свого дому
  rationale: «Повернуся» точно передає ἐπιστρέψω, а «до свого дому» природно відтворює напрямок і присвійний зміст вислову.
- source_word: ὅθεν ἐξῆλθον
  choice: з якого я вийшов
  rationale: Зберігає конкретний образ виходу з дому та природно узгоджується з його назвою.
- source_word: ἐλθὸν
  choice: прийшовши
  rationale: Дієприслівник передає попередню щодо головної дії подію без додавання до тексту значення повернення, яке тут прямо не повторене.
- source_word: εὑρίσκει
  choice: знаходить
  rationale: Збережено простий теперішній час жвавого оповідання і звичайне значення дієслова.
- source_word: σχολάζοντα
  choice: незайнятим
  rationale: Передає стан дому без мешканця та його доступність; можливе значення «порожнім» подано у примітці.
- source_word: σεσαρωμένον
  choice: виметеним
  rationale: 'Передає завершений результат дії, виражений перфектним пасивним дієприкметником: дім уже вимели.'
- source_word: κεκοσμημένον
  choice: впорядкованим
  rationale: Передає значення приведеного до ладу стану, не звужуючи κοσμέω лише до декоративного оздоблення; іншу можливість наведено у примітці.
theological_decisions:
- issue: Метафоричний зміст «дому» в словах про повернення нечистого духа
  choice: Збережено буквальний образ «дому» без пояснювальної заміни на «людину» чи «життя».
  alternative: «Повернуся до людини, з якої я вийшов».
  rationale: У самому грецькому тексті вжито οἶκος, а образне значення розкривається контекстом. Збереження образу не нав’язує читачеві додаткового тлумачення.
translation_notes:
  register: Сучасна літературна українська мова з природним, але гідним біблійним звучанням. Теперішній час збережено для жвавості оповіді; три прикметникові форми узгоджено зі словом «дім» і передано як наявний результат попередніх дій.
