base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/005.yaml
  text: Jesus sent out these twelve, instructing them, saying, “Do not go on the road to the Gentiles, and do not enter a town of the Samaritans.”
translation:
  language: uk
  text: 'Цих дванадцятьох Ісус послав, давши їм такі настанови: «Не йдіть дорогою до язичників[a] і не заходьте до самарянського міста[b].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на дорогу язичників»; вислів, імовірно, означає вирушати в напрямку язичницької території.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «у місто самарян».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτους τοὺς δώδεκα
  choice: Цих дванадцятьох
  rationale: Зберігає вказівний займенник і числівник без додавання слова «учнів», якого в грецькому тексті немає.
- source_word: ἀπέστειλεν
  choice: послав
  rationale: Природно передає відправлення з дорученням; місійний контекст випливає з наступної настанови.
- source_word: παραγγείλας αὐτοῖς λέγων
  choice: давши їм такі настанови
  rationale: Природна українська конструкція передає директивну силу παραγγέλλω та вводить пряму мову без стилістично важкого буквального «наказавши їм, кажучи».
- source_word: Εἰς ὁδὸν ἐθνῶν μὴ ἀπέλθητε
  choice: Не йдіть дорогою до язичників
  rationale: Зберігає образ дороги та контекстуальне значення ἔθνη як неюдеїв; прийменникова конструкція допускає розуміння руху в напрямку язичницької території.
- source_word: ἐθνῶν
  choice: язичників
  rationale: У цьому юдейському місійному контексті слово позначає неюдейські народи; «язичники» є усталеним і зрозумілим біблійним відповідником, хоча «народи» можливе буквально.
- source_word: εἰς πόλιν Σαμαριτῶν μὴ εἰσέλθητε
  choice: не заходьте до самарянського міста
  rationale: Природно передає заборону входити до будь-якого міста самарян; «місто» є прямим відповідником πόλις, а прикметникова форма природна українською.
theological_decisions:
- issue: Обсяг і тривалість заборони щодо язичників та самарян
  choice: Передати як пряму настанову саме цим дванадцятьом у межах цього послання, не додаючи часових або богословських уточнень.
  alternative: Формулювання, яке тлумачило б заборону як постійне виключення язичників і самарян або, навпаки, прямо обмежувало б її словами «цього разу».
  rationale: Грецький текст містить сильну конкретну заборону, але сам у цьому вірші не визначає її подальшої тривалості; переклад має зберегти цю напругу.
translation_notes:
  register: Сучасна, гідна й загальнозрозуміла українська. Уникнуто додавання «учнів» та важкого калькування «наказавши їм, кажучи». Усі маркери приміток подано в основному тексті.
