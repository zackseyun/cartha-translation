  text: παραδώσει δὲ ἀδελφὸς ἀδελφὸν εἰς θάνατον καὶ πατὴρ τέκνον, καὶ ἐπαναστήσονται τέκνα ἐπὶ γονεῖς καὶ θανατώσουσιν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/021.yaml
  text: And brother will hand over brother to death[a], and a father his child, and children will rise up against parents and put them to death.
translation:
  language: uk
  text: Брат видасть брата на смерть[a], і батько — свою дитину; діти повстануть проти батьків і вб’ють їх.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «віддасть»; у контекстах віроломства це дієслово також може означати «зрадить».
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδώσει
  choice: віддасть
  rationale: Дієслово означає передати людину в чужі руки, тут — на смерть. «Віддасть» природно звучить українською, зберігає конкретний образ і не звужує значення до прямої зради.
- source_word: ἀδελφὸς ... ἀδελφὸν
  choice: брат ... брата
  rationale: Збережено чоловічі родинні назви та виразний повтор грецького тексту.
- source_word: εἰς θάνατον
  choice: на смерть
  rationale: Прийменниковий зворот указує на наслідок або мету передачі; «на смерть» є стислим і природним відповідником.
- source_word: πατὴρ τέκνον
  choice: батько — свою дитину
  rationale: τέκνον не уточнює статі й означає дитину; «свою» природно виражає родинний зв’язок, а тире відновлює пропущене в грецькому присудкове дієслово.
- source_word: ἐπαναστήσονται
  choice: повстануть проти
  rationale: Відтворює образ активного ворожого виступу, не звужуючи його до політичного повстання.
- source_word: τέκνα
  choice: діти
  rationale: Термін охоплює дітей обох статей і природно передається українським «діти».
- source_word: ἐπὶ γονεῖς
  choice: проти батьків
  rationale: ἐπί зі знахідним після дієслова ворожої дії має значення «проти»; γονεῖς означає обох батьків.
- source_word: θανατώσουσιν αὐτούς
  choice: заподіють їм смерть
  rationale: θανατόω означає спричинити смерть, часто з відтінком навмисної або формальної страти. Формулювання зберігає відмінність від попереднього «віддасть ... на смерть» і чітке посилання займенника на батьків.
theological_decisions:
- issue: Родові й узагальнено-представницькі назви членів родини
  choice: Зберегти «брат» для ἀδελφός, а τέκνα і γονεῖς передати як «діти» та «батьки»
  alternative: Передати ἀδελφός ширшим словом «рідний/рідна» або «брати й сестри»
  rationale: У цьому реченні ἀδελφός має чоловічу форму й конкретно змальовує брата, тоді як τέκνα та γονεῖς за своїм лексичним обсягом не обмежені однією статтю. Такий переклад зберігає точні родинні протиставлення без доктринального розширення.
translation_notes:
  register: Сучасна нормативна українська з урочистою, але доступною синтаксичною будовою. Повтор «брат ... брата» збережено задля риторичної сили; еліпсис у другій частині позначено тире. Маркер [a] стоїть безпосередньо після відповідного вислову.
