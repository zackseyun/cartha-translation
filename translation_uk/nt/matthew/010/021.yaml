- from: Брат віддасть брата на смерть[a], і батько — свою дитину; діти повстануть проти батьків і заподіють їм смерть.
  to: Брат видасть брата на смерть[a], і батько — свою дитину; діти повстануть проти батьків і вб’ють їх.
  rationale: 'Виправлено два стилістично-лексичні місця: «видасть» точніше передає передання людини на смерть, а «вб’ють їх» є нормативним сучасним відповідником дієслова «спричинять смерть». Решту структури, термінології та прив’язку примітки збережено.'
