review_pass:
  verdict: revise
  source_fidelity: Зміст родинних протиставлень, майбутній час і зв’язок займенника з «батьками» передано точно. «Видасть ... на смерть» точніше відтворює παραδώσει як передання особи ворогам/владі, тоді як «уб’ють їх» є прямим і природним відповідником θανατώσουσιν без невластивого уточнення способу смерті.
  naturalness: «Заподіють їм смерть» граматично можливе, але неприродне для сучасної нормативної української й стилістично канцелярське. «Уб’ють їх» ясне, природне та зберігає силу вислову. «Видасть» у цьому контексті природніше за «віддасть».
  terminology: «Брат», «дитина», «діти» та «батьки» коректно передають обсяг відповідних грецьких родинних термінів. «Повстануть проти» адекватно зберігає образ ἐπαναστήσονται. Примітка належно подає «віддасть» як альтернативу та «зрадить» як контекстуально можливе значення.
  issues:
  - severity: medium
    issue: Неприродне формулювання «заподіють їм смерть».
    rationale: В українській сучасній літературній нормі це звучить штучно; «уб’ють їх» точніше й природніше передає θανατώσουσιν.
  - severity: low
    issue: «Віддасть» дещо слабше передає ворожо-каузативний відтінок παραδώσει.
    rationale: У контексті передання члена родини на смерть «видасть» виразніше означає віддання іншій, ворожій стороні, не нав’язуючи значення «зрадить».
