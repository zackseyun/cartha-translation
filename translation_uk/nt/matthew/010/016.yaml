source:
  edition: SBLGNT
  text: Ἰδοὺ ἐγὼ ἀποστέλλω ὑμᾶς ὡς πρόβατα ἐν μέσῳ λύκων· γίνεσθε οὖν φρόνιμοι ὡς οἱ ὄφεις καὶ ἀκέραιοι ὡς αἱ περιστεραί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/016.yaml
  text: Look, I am sending you out as sheep in the midst of wolves; therefore be wise as the snakes and innocent as the doves.
translation:
  language: uk
  text: Ось, я посилаю вас, як овець серед вовків; тож будьте мудрі, як змії, і невинні, як голуби.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Ось
  rationale: Природний український засіб привернення уваги, який зберігає виразність грецького ἰδού без архаїчного відтінку.
- source_word: ἀποστέλλω
  choice: посилаю
  rationale: Точно передає дію доручення й відправлення; окремий відповідник для англійського out в грецькому тексті відсутній.
- source_word: ὡς πρόβατα ἐν μέσῳ λύκων
  choice: як овець поміж вовків
  rationale: Зберігає образ уразливості учнів у ворожому середовищі; «поміж» природно передає ἐν μέσῳ.
- source_word: φρόνιμοι
  choice: мудрі
  rationale: У контексті означає розсудливі, обачні й практично мудрі; «мудрі» стисло зберігає широту значення.
- source_word: οἱ ὄφεις
  choice: змії
  rationale: Звичайний сучасний відповідник, що не додає негативної моральної оцінки понад сам образ.
- source_word: ἀκέραιοι
  choice: невинні
  rationale: Передає моральну незаплямованість і відсутність злого наміру; можливий відтінок «щирі/непідступні» не розгортається в основному тексті.
- source_word: αἱ περιστεραί
  choice: голуби
  rationale: Усталений і природний український відповідник образу περιστεραί.
theological_decisions:
- issue: Поєднання мудрості змій і невинності голубів
  choice: Збережено парадокс без пояснювального перефразування
  alternative: «будьте обачні, але не чиніть зла»
  rationale: Грецький текст навмисно поєднує два образи; розгортання їх у настанову звузило б образність і могло б нав’язати тлумачення.
- issue: Значення ἀκέραιοι
  choice: невинні
  alternative: щирі / простодушні / непідступні
  rationale: «Невинні» відповідає контексту протиставлення мудрості та моральної чистоти, не перетворюючи чесноту на наївність.
translation_notes:
  register: Сучасна стандартна українська, стислий і гідний повчальний стиль. Займенник «Я» написано з великої літери як шанобливу українську традицію; граматичного наголосу ἐγώ також достатньо передає явне «Я». Артиклі перед назвами тварин окремо не відтворено, оскільки українська їх не має.
