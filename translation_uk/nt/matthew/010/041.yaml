id: MAT.10.41
reference: Matthew 10:41
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ὁ δεχόμενος προφήτην εἰς ὄνομα προφήτου μισθὸν προφήτου λήμψεται, καὶ ὁ δεχόμενος δίκαιον εἰς ὄνομα δικαίου μισθὸν δικαίου λήμψεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/041.yaml
  text: The one who receives a prophet in the name of a prophet will receive a prophet’s reward[b][a], and the one who receives a righteous man in the name of a righteous man will receive a righteous man’s reward.
translation:
  language: uk
  text: Хто приймає пророка в ім’я пророка[a], той одержить нагороду пророка; і хто приймає праведника в ім’я праведника[b], той одержить нагороду праведника.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «тому, що він пророк» чи «як пророка». Грецький текст буквально каже: «в ім’я пророка».'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «тому, що він праведник» чи «як праведника». Грецький текст буквально каже: «в ім’я праведника».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δεχόμενος
  choice: хто приймає
  rationale: Субстантивований дієприкметник теперішнього часу виражає загальну характеристику людини. Українська конструкція «хто приймає» природно передає цей узагальнений зміст.
- source_word: προφήτην
  choice: пророка
  rationale: Звичний і точний відповідник назви служіння, ужитої як прямий додаток.
- source_word: εἰς ὄνομα προφήτου
  choice: в ім’я пророка
  rationale: Буквально відтворює грецький вислів і зберігає його повтор та богословське звучання; можливий значеннєвий відтінок «тому, що він пророк» або «як пророка» подано в примітці.
- source_word: μισθὸν προφήτου
  choice: нагороду пророка
  rationale: 'Родовий відмінок зберігає неоднозначність: це може бути нагорода, яку одержує пророк, або нагорода, пов’язана з прийняттям пророка.'
- source_word: λήμψεται
  choice: одержить
  rationale: Простий майбутній час точно передає форму й має належний урочистий, але сучасний регістр.
- source_word: δίκαιον
  choice: праведника
  rationale: Субстантивований прикметник чоловічого роду природно й стисло передається українським іменником «праведник».
- source_word: εἰς ὄνομα δικαίου
  choice: в ім’я праведника
  rationale: Зберігає формальну паралель із першою частиною та буквальний образ оригіналу; ідіоматичний зміст пояснено в примітці.
- source_word: μισθὸν δικαίου
  choice: нагороду праведника
  rationale: Відтворює паралелізм речення і не визначає надмірно точного характеру зв’язку між праведником та нагородою.
theological_decisions:
- issue: Значення звороту εἰς ὄνομα з родовим відмінком
  choice: У головному тексті залишено буквальне «в ім’я», а значення «тому, що він є…» / «як…» наведено в примітках.
  alternative: 'Перекласти безпосередньо: «тому, що він пророк / праведник» або «як пророка / праведника».'
  rationale: Буквальна форма зберігає повтор, зв’язок з іншими новозавітними висловами про ім’я та певну смислову напругу; примітки водночас роблять ідіоматичний зміст зрозумілим.
- issue: Значення родового відмінка в μισθὸν προφήτου / μισθὸν δικαίου
  choice: Збережено конструкції «нагороду пророка» і «нагороду праведника».
  alternative: Уточнити як «таку саму нагороду, як пророк / праведник» або «нагороду за прийняття пророка / праведника».
  rationale: Грецький текст не уточнює однозначно, чи йдеться про нагороду, призначену пророкові або праведникові, чи про нагороду, пов’язану з їх прийняттям; переклад не усуває цієї неоднозначності.
- issue: Чоловічий рід δίκαιον / δικαίου
  choice: «праведника»
  alternative: «праведну людину»
  rationale: Іменник «праведник» природно передає субстантивований прикметник чоловічого роду, не додаючи твердження про виключність чоловіків.
translation_notes:
  register: Сучасна стандартна українська з гідним біблійним регістром. Синтаксис природний для широкого кола читачів, а повтори оригіналу та паралелізм двох частин свідомо збережено.
