lexical_decisions:
- source_word: μὴ κτήσησθε
  choice: Не придбавайте собі
  rationale: κτάομαι означає «придбавати, здобувати, набувати». Цей варіант передає заборону не лише нести гроші, а й заготовляти чи набувати їх для себе перед дорогою.
- source_word: χρυσὸν
  choice: золота
  rationale: Пряма назва металу; у цьому переліку йдеться про золото як гроші.
- source_word: ἄργυρον
  choice: срібла
  rationale: Пряма назва металу; у контексті маються на увазі срібні гроші.
- source_word: χαλκὸν
  choice: міді
  rationale: χαλκός може означати мідь або бронзу. У переліку грошових металів «мідь» природно позначає монети малої вартості; можливість перекладу «бронза» збережено у примітці.
- source_word: εἰς τὰς ζώνας ὑμῶν
  choice: у свої пояси
  rationale: ζώνη — пояс або поясна пов’язка, у якій могли носити гроші. Буквальний образ збережено в тексті, а культурне пояснення подано у примітці.
