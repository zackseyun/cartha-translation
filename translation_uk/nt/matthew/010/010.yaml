  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: μὴ πήραν εἰς ὁδὸν μηδὲ δύο χιτῶνας μηδὲ ὑποδήματα μηδὲ ⸀ῥάβδον· ἄξιος γὰρ ὁ ἐργάτης τῆς τροφῆς ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/010.yaml
  text: do not take a traveler's bag for the road[a], or two tunics, or sandals, or a staff; for the worker is worthy of his food.
translation:
  language: uk
  text: не беріть у дорогу ні дорожньої торби, ні двох хітонів, ні сандалій, ні палиці[a], бо працівник гідний своєї їжі.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Дехто розуміє ці слова як заборону брати запасну палицю, особливо з огляду на Марка 6:8, де дозволено взяти палицю.
    reason: alternative_reading
lexical_decisions:
- source_word: πήραν
  choice: дорожньої торби
  rationale: πήρα — торба, яку брали в дорогу, зокрема для припасів; «дорожня торба» природно й точно передає призначення речі.
- source_word: εἰς ὁδὸν
  choice: у дорогу
  rationale: Ідіоматично передає мету приготування до подорожі, не розширюючи зміст оригіналу.
- source_word: δύο χιτῶνας
  choice: двох хітонів
  rationale: χιτών означає основний натільний одяг античної доби; «хітон» історично точніше за «сорочку» і конкретніше за загальне «одяг».
- source_word: ὑποδήματα
  choice: сандалій
  rationale: У контексті подорожі в I столітті йдеться про взуття, яке прив’язували до стопи; «сандалі» є природним історичним відповідником.
- source_word: ῥάβδον
  choice: палиці
  rationale: У цьому контексті ῥάβδος — дорожня палиця. Буквальний відповідник зберігає відмінність від Марка 6:8 без прихованого узгодження.
- source_word: ἄξιος
  choice: гідний
  rationale: Зберігає оцінне значення «той, хто має належне право на щось» і природне біблійне формулювання.
- source_word: ὁ ἐργάτης
  choice: працівник
  rationale: Сучасне й загальнозрозуміле позначення того, хто працює, без внесення церковного терміна.
- source_word: τῆς τροφῆς αὐτοῦ
  choice: своєї їжі
  rationale: τροφή безпосередньо означає їжу або поживу; конкретний відповідник не розширює значення до загального «утримання». Зворотний займенник природно вказує на їжу, належну самому працівникові.
theological_decisions:
- issue: Можливе узгодження з паралельною розповіддю щодо дозволеного дорожнього спорядження
  choice: У головному тексті збережено Матвієву заборону брати палицю.
  alternative: Розуміти вислів як заборону брати додаткову палицю або вільніше перекласти його задля узгодження з Марка 6:8.
  rationale: Грецький текст прямо називає ῥάβδον серед того, чого не слід брати. Переклад зберігає напруження між паралельними розповідями, а не усуває його тлумачним узгодженням.
translation_notes:
  register: Сучасна літературна українська мова з гідним, лаконічним звучанням. Історично конкретні назви «хітон» і «сандалі» збережено; синтаксис побудовано природно для українського переліку за допомогою конструкції «ні… ні…».
