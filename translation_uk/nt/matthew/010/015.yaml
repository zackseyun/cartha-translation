id: MAT.10.15
reference: Matthew 10:15
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ἀνεκτότερον ἔσται γῇ Σοδόμων καὶ Γομόρρων ἐν ἡμέρᾳ κρίσεως ἢ τῇ πόλει ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/015.yaml
  text: Truly I say to you[c][b][a], it will be more bearable for the land of Sodom and Gomorrah on the day of judgment than for that town.
translation:
  language: uk
  text: 'Істинно кажу вам: землі Содома й Гоморри буде легше[a] в день суду, ніж тому місту[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «буде стерпніше».'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «тому поселенню». Грецьке слово може означати місто або невелике міське поселення.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Істинно кажу вам
  rationale: Природна й урочиста українська передача формули запевнення; зберігає прямий характер вислову без менш прозорої транслітерації «амінь».
- source_word: ἀνεκτότερον
  choice: буде легше
  rationale: Передає порівняльне значення «більш стерпно / легше витримати» природною сучасною українською мовою.
- source_word: γῇ Σοδόμων καὶ Γομόρρων
  choice: землі Содома й Гоморри
  rationale: Зберігає буквальне географічне формулювання грецького тексту, не зводячи його лише до назв міст або їхніх мешканців.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: в день суду
  rationale: Точно й природно передає вказівку на майбутній день суду, не додаючи доктринальних подробиць.
- source_word: τῇ πόλει ἐκείνῃ
  choice: тому місту
  rationale: πόλις охоплює і місто, і невелике міське поселення; українське «місто» є природним нейтральним відповідником у цьому контексті.
theological_decisions:
- issue: Характер «дня суду»
  choice: Передано як майбутній «день суду» без подальшого уточнення.
  alternative: Загальніший час або період суду.
  rationale: Формулювання природно має есхатологічну спрямованість, однак переклад не розгортає доктринальної схеми, якої сам вірш не висловлює.
- issue: Порівняльна міра відповідальності на суді
  choice: 'Збережено пряме порівняння: землі Содома й Гоморри буде легше, ніж місту, що відкинуло посланців.'
  alternative: Перефразувати як твердження про суворіше покарання мешканців того міста.
  rationale: Пряме формулювання зберігає риторичну силу та богословську напругу тексту, не пояснюючи механізму чи ступенів суду.
translation_notes:
  register: Сучасна стандартна українська з урочистим, але зрозумілим біблійним регістром. Порядок слів дещо підкреслює контраст між землею Содома й Гоморри та тим містом.
