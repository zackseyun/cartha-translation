  text: καὶ μὴ ⸀φοβεῖσθε ἀπὸ τῶν ἀποκτεννόντων τὸ σῶμα τὴν δὲ ψυχὴν μὴ δυναμένων ἀποκτεῖναι· ⸁φοβεῖσθε δὲ μᾶλλον τὸν δυνάμενον ⸀καὶ ψυχὴν ⸁καὶ σῶμα ἀπολέσαι ἐν γεέννῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/028.yaml
  text: And do not fear those who kill the body but are not able to kill the soul. Rather[a], fear the one who is able to destroy both soul and body in Gehenna.
translation:
  language: uk
  text: І не бійтеся тих, хто вбиває тіло, але не можуть убити душу. А радше бійтеся того, хто може і душу, і тіло погубити в геєні.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «у пеклі». Грецьке слово «геєна» походить від назви долини Гінном і вживалося на позначення місця остаточного суду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβεῖσθε
  choice: не бійтеся / бійтеся
  rationale: Повторено той самий дієслівний корінь у протиставленні; однакове українське дієслово зберігає і структуру, і силу застереження.
- source_word: ἀπὸ τῶν ἀποκτεννόντων
  choice: тих, хто вбиває
  rationale: Субстантивований дієприкметник позначає узагальнену групу; підрядна конструкція природна в сучасній українській.
- source_word: σῶμα
  choice: тіло
  rationale: Прямий і загальновживаний відповідник, який зберігає протиставлення душі.
- source_word: ψυχήν
  choice: душу
  rationale: У виразному протиставленні до тіла йдеться не просто про земне життя; «душа» зберігає закладене в тексті розрізнення.
- source_word: μὴ δυναμένων ἀποκτεῖναι
  choice: не може вбити
  rationale: Українською присудок узгоджено з відносним «хто», яке граматично має форму однини, хоча його антецедент «тих» позначає множину; значення нездатності збережено.
- source_word: μᾶλλον
  choice: а радше
  rationale: 'Передає виправне протиставлення: боятися не перших, а радше іншого; сполучник «а» природно відтворює грецьке δέ.'
- source_word: τὸν δυνάμενον
  choice: того, хто може
  rationale: Природно передає субстантивований дієприкметник і не називає прямо особу, яку сам грецький текст тут не називає.
- source_word: ἀπολέσαι
  choice: погубити
  rationale: Передає остаточну згубу або загибель у суді та відрізняє це дієслово від попереднього «вбити», не уточнюючи механіки покарання.
- source_word: ἐν γεέννῃ
  choice: в геєні
  rationale: Транслітерація зберігає конкретний грецький термін і його юдейське історичне тло; звичний тлумачний відповідник подано у примітці.
theological_decisions:
- issue: Кого означає «того, хто може»
  choice: У головному тексті залишено «того, хто» без прямого ототожнення.
  alternative: Бог; сатана
  rationale: Контекст найприродніше вказує на Бога як Того, Хто має остаточну судову владу, однак сам вислів у цьому вірші не називає референта. Переклад зберігає цю формальну невизначеність.
- issue: Передача γέεννα
  choice: геєна
  alternative: пекло
  rationale: «Геєна» ближче до форми й історичного тла оригіналу, тоді як «пекло» є поширеним тлумачним відповідником і тому винесене в примітку.
- issue: Значення ἀπολέσαι щодо душі й тіла
  choice: погубити
  alternative: знищити; приректи на загибель
  rationale: «Погубити» зберігає силу остаточного суду, але не розв’язує в самому перекладі питання про точну природу чи тривалість цієї згуби.
translation_notes:
  register: Сучасна стандартна українська з гідним, доступним синтаксисом. Збережено повтор «бійтеся», контраст «тіло / душа» та подвійне «і … і». Займенник «того» написано з малої літери, щоб графічно не вводити прямого ототожнення, якого немає в грецькому вислові.
