reference: Matthew 10:23
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ὅταν δὲ διώκωσιν ὑμᾶς ἐν τῇ πόλει ταύτῃ, φεύγετε εἰς τὴν ⸀ἑτέραν· ἀμὴν γὰρ λέγω ὑμῖν, οὐ μὴ τελέσητε τὰς πόλεις ⸀τοῦ Ἰσραὴλ ἕως ⸀ἂν ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/023.yaml
  text: But whenever they persecute you in this city[a], flee to the next one. For truly I say to you[c][b], you will certainly not finish going through the cities of Israel until the Son of Man comes.
translation:
  language: uk
  text: 'Коли ж вас переслідуватимуть у цьому місті, тікайте до іншого[a]. Бо істинно кажу вам: ви аж ніяк не завершите обходу міст Ізраїлю[b], поки не прийде Син Людський[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «тікайте до наступного міста». Грецький текст буквально має «до іншого», причому слово «міста» мається на увазі з попередньої частини речення.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «аж ніяк не завершите міста Ізраїлю». Слово «обходу» пояснює маючуся на увазі місійну подорож містами.'
    reason: lexical_alternative
  - marker: c
    text: Вислів «поки не прийде Син Людський» навмисно залишено відкритим. Його можуть розуміти як прихід Ісуса в Його утвердженні, прихід у суді або Його остаточне повернення.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν
  choice: коли
  rationale: У цьому контексті сполучник позначає можливу або повторювану ситуацію. Українське «коли» природно передає таку відкриту часову умову без надмірного уточнення.
- source_word: διώκωσιν
  choice: переслідуватимуть
  rationale: У місійному контексті дієслово означає вороже переслідування, а не просто погоню.
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: у цьому місті
  rationale: Збережено пряме значення вказівного займенника та безпосередність настанови.
- source_word: φεύγετε
  choice: тікайте
  rationale: Наказова форма виражає термінове залишення місця через переслідування; «тікайте» є природним і виразним відповідником.
- source_word: εἰς τὴν ἑτέραν
  choice: до іншого
  rationale: Іменник «місто» мається на увазі з попередньої частини речення. «До іншого» стисло відтворює еліптичну грецьку конструкцію.
- source_word: ἀμὴν
  choice: істинно
  rationale: Це урочиста формула, якою Ісус вводить авторитетне твердження; «істинно» зберігає її піднесеність і зрозумілість.
- source_word: οὐ μὴ τελέσητε
  choice: ви аж ніяк не закінчите
  rationale: Сполука οὐ μή з аористом кон’юнктива передає посилене заперечення, відтворене словами «аж ніяк не»; τελέω означає завершити або довести до кінця.
- source_word: τὰς πόλεις τοῦ Ἰσραήλ
  choice: обходити міста Ізраїлю
  rationale: «Міста Ізраїлю» прямо передає родовий зворот, а «обходити» робить явною діяльність, яку має на увазі контекст мандрівної місії.
- source_word: ἕως ἂν ἔλθῃ
  choice: поки не прийде
  rationale: Природна українська часова конструкція позначає майбутню межу, до якої дія не буде завершена.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Син Людський
  rationale: Усталений український біблійний відповідник зберігає буквальну форму самоназви та її зв’язок із біблійною традицією.
theological_decisions:
- issue: Значення приходу Сина Людського в цьому контексті
  choice: Збережено формулювання «поки не прийде Син Людський» без уточнення характеру чи часу приходу.
  alternative: Прихід у воскресінні та виправданні Ісуса; прихід у суді над Єрусалимом; остаточне повернення наприкінці віку.
  rationale: Грецький текст сам не визначає однозначно, яку саме подію позначає цей прихід. Переклад зберігає справжню есхатологічну неоднозначність і не нав’язує окремої богословської схеми.
translation_notes:
  register: Сучасна нормативна українська мова з гідним біблійним звучанням. Синтаксис простий і придатний для читання вголос; урочисте «істинно кажу вам» збережено як характерну формулу висловів Ісуса.
