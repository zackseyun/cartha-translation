id: MAT.10.20
reference: Matthew 10:20
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: οὐ γὰρ ὑμεῖς ἐστε οἱ λαλοῦντες ἀλλὰ τὸ πνεῦμα τοῦ πατρὸς ὑμῶν τὸ λαλοῦν ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/020.yaml
  text: For it is not you who are speaking[b][a], but the Spirit of your Father speaking in you.
translation:
  language: uk
  text: Бо не ви говорите, а Дух вашого Отця говорить у вас.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «через вас». Грецький текст буквально каже «у вас», що в цьому контексті може також передавати думку про мовлення через учнів.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Бо не
  rationale: «Бо» природно передає пояснювальну силу γάρ і пов’язує вислів із попередньою обітницею.
- source_word: ὑμεῖς ἐστε οἱ λαλοῦντες
  choice: ви говоритимете
  rationale: Особовий займенник «ви» зберігає грецький наголос на тому, хто саме говорить; майбутній час природний в українському контексті настанови про майбутній допит, хоча грецька форма граматично теперішня.
- source_word: ἀλλὰ
  choice: а
  rationale: «А» виразно й природно передає протиставлення після заперечення «не ви».
- source_word: τὸ πνεῦμα τοῦ πατρὸς ὑμῶν
  choice: Дух вашого Отця
  rationale: Передано без додавання означення «небесного»; велика літера вказує на Божого Духа і Бога Отця відповідно до контексту.
- source_word: τὸ λαλοῦν
  choice: говоритиме
  rationale: Повтор дієслова зберігає паралелізм двох форм λαλέω та ясно відносить дію до Духа.
- source_word: ἐν ὑμῖν
  choice: у вас
  rationale: Це пряме відтворення ἐν ὑμῖν, яке не звужує зміст лише до інструментального «через вас».
theological_decisions:
- issue: Чи означає ἐν ὑμῖν перебування Духа «у вас» або Його дію «через вас»
  choice: у вас
  alternative: через вас
  rationale: Основний текст зберігає пряме просторове формулювання грецького ἐν і властиву йому богословську напругу; контекст допускає також інструментальний відтінок, наведений у примітці.
translation_notes:
  register: Сучасна нормативна українська, проста й гідна. Симетричне «говоритимете / говоритиме» природно передає контраст і повтор кореня λαλέω; порядок слів наголошує на протиставленні між учнями та Духом.
