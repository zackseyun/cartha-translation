    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: І
  rationale: Зберігає простий єднальний зв’язок із попереднім контекстом, не додаючи причинового чи підсилювального відтінку.
- source_word: ἐχθροὶ
  choice: ворогами
  rationale: Природно передає субстантивоване множинне позначення тих, хто вороже налаштований; орудний відмінок зумовлений українською конструкцією зі «стануть».
- source_word: τοῦ ἀνθρώπου
  choice: людині
  rationale: Ἄνθρωπος тут має узагальнювальне значення. Українське «людині» природно й точно передає стосунок, виражений грецьким родовим відмінком, без зайвого звуження лише до чоловіка.
- source_word: οἱ οἰκιακοὶ αὐτοῦ
  choice: її домашні
  rationale: Οἰκιακοί означає людей, які належать до чийогось дому чи домогосподарства, а не сам будинок. «Домашні» стисло зберігає особовий і родинно-побутовий зміст, а «її» передає αὐτοῦ відповідно до граматичного роду українського слова «людина».
theological_decisions:
- issue: Узагальнювальне значення τοῦ ἀνθρώπου
  choice: людині
  alternative: чоловікові
  rationale: Грецьке ἄνθρωπος граматично чоловічого роду, але в цій сентенції позначає людину загалом. В українській «людині» зберігає узагальнювальний зміст джерела й не усуває жодної богословської напруги.
- issue: Зміст οἱ οἰκιακοὶ αὐτοῦ
  choice: її домашні
  alternative: члени її родини / члени її дому
  rationale: Вислів може охоплювати членів дому або домогосподарства, не лише родичів у вузькому сучасному сенсі. «Домашні» залишає цей обсяг значення відкритим.
translation_notes:
  register: Сучасна, стисла й гідна українська мова. Інверсію грецького речення передано природною українською конструкцією; «стануть» ураховує майбутнє значення, задане цитованим контекстом Михея 7:6, хоча в самому грецькому реченні дієслово пропущене.
