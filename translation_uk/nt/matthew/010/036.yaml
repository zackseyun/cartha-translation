  verdict: revise
  source_fidelity: The draft correctly identifies οἰκιακοί as people belonging to the household and appropriately renders ἄνθρωπος generically as «людина». However, «стануть» means ‘will become’ and introduces a change-of-state nuance absent from the verbless Greek clause. The connective «І» is retained appropriately.
  naturalness: «Ворогами людині стануть її домашні» is understandable, but the dative construction is less natural here than the possessive «ворогами людини»; «стануть» also sounds stronger and more interpretive than needed. «Будуть» gives a clear, idiomatic Ukrainian sentence while supplying only the copula required by Ukrainian usage.
  terminology: «Домашні» is a viable concise rendering of οἰκιακοί and preserves the broader household sense rather than restricting it to blood relatives. The footnote appropriately clarifies that the referent is household members.
  issues:
  - severity: medium
    issue: «стануть» adds a change-of-state nuance.
    rationale: The Greek has no verb and does not lexically say that household members ‘become’ enemies. In Ukrainian, «будуть» is the safer supplied copula in this contextual saying.
  - severity: low
    issue: «ворогами людині» is less idiomatic than «ворогами людини».
    rationale: The Greek genitive τοῦ ἀνθρώπου is naturally and directly represented by Ukrainian possessive/genitival «людини», avoiding a marked dative construction.
