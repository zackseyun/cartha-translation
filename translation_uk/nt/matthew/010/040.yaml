  text: The one who receives you receives me[a], and the one who receives me receives the one who sent me.
translation:
  language: uk
  text: Хто приймає вас, той приймає Мене[a], а хто приймає Мене, той приймає Того, Хто послав Мене.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «вітає» чи «приймає до себе»; грецьке дієслово може означати прийняти, визнати або гостинно зустріти, особливо коли йдеться про посланця.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ δεχόμενος
  choice: Хто приймає …, той приймає
  rationale: Артикльований дієприкметник ужито субстантивовано й узагальнено. Українська співвідносна конструкція «хто …, той …» природно передає цей загальний зміст.
- source_word: δέχομαι / δέχεται
  choice: приймає
  rationale: Повторено те саме дієслово, що утворює навмисний ланцюг ототожнення. «Приймає» охоплює як гостинний прийом, так і визнання або прийняття посланця.
- source_word: ὑμᾶς
  choice: вас
  rationale: Займенник другої особи множини стосується Ісусових учнів; українська форма однозначно передає множину.
- source_word: ἐμέ / με
  choice: Мене
  rationale: Займенник першої особи однини стосується Ісуса. Велику літеру вжито відповідно до усталеної української біблійної видавничої норми.
- source_word: τὸν ἀποστείλαντά με
  choice: Того, Хто послав Мене
  rationale: Артикльований аористовий дієприкметник функціонує субстантивовано. Переклад зберігає особовий, але не названий прямо референт джерельного тексту.
theological_decisions:
- issue: Хто є Тим, Хто послав Ісуса
  choice: «Того, Хто послав Мене» без додавання «Отця»
  alternative: «Отця, Який послав Мене»
  rationale: Контекст і богослов'я Євангелія від Матвія вказують на Отця, однак грецький текст тут прямо Його не називає. Тому переклад не конкретизує більше, ніж оригінал.
translation_notes:
  register: Сучасна літературна українська з гідним біблійним звучанням. Повтор «приймає» навмисно збережено в усіх трьох ланках вислову; конструкція «хто …, той …» забезпечує природність і загальність формулювання.
