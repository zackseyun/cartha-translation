  text: προσέχετε δὲ ἀπὸ τῶν ἀνθρώπων· παραδώσουσιν γὰρ ὑμᾶς εἰς συνέδρια, καὶ ἐν ταῖς συναγωγαῖς αὐτῶν μαστιγώσουσιν ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/017.yaml
  text: But beware of people[a], for they will hand you over to councils, and in their synagogues they will flog you.
translation:
  language: uk
  text: Але стережіться людей[a], бо вони передадуть вас радам і бичуватимуть вас у їхніх синагогах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «чоловіків»; грецьке слово має граматично чоловічий рід у множині, але тут ужите в узагальненому значенні — «людей».
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέχετε
  choice: стережіться
  rationale: Форма наказового способу в множині застерігає від небезпеки; «стережіться» природно й стисло передає цю силу.
- source_word: δὲ
  choice: Але
  rationale: Частка позначає легке протиставлення або перехід до застереження в контексті.
- source_word: ἀπὸ τῶν ἀνθρώπων
  choice: людей
  rationale: Після προσέχω прийменник ἀπό указує на джерело небезпеки. Іменник тут має узагальнене значення й не обмежує переслідувачів чоловіками.
- source_word: παραδώσουσιν
  choice: віддаватимуть
  rationale: Дієслово означає передання людей органам влади; цей відповідник зберігає юридичний відтінок, не додаючи значення особистої зради.
- source_word: συνέδρια
  choice: ради
  rationale: Множина позначає місцеві керівні або судові ради, а не обов’язково єрусалимський Синедріон.
- source_word: συναγωγαῖς
  choice: синагогах
  rationale: Йдеться про конкретні юдейські синагоги; це усталений і зрозумілий український відповідник.
- source_word: αὐτῶν
  choice: своїх
  rationale: Український зворотний присвійний займенник природно співвідносить синагоги з підметом «вони» та передає грецьке αὐτῶν.
- source_word: μαστιγώσουσιν
  choice: бичуватимуть
  rationale: Дієслово позначає тілесне покарання ударами батога; «бичувати» є точним, гідним і зрозумілим відповідником у біблійно-судовому контексті.
theological_decisions:
- issue: Родове значення ἀνθρώπων
  choice: людей
  alternative: чоловіків
  rationale: Граматично форма чоловічого роду в множині, але семантично тут узагальнено означає людей як переслідувачів, а не лише осіб чоловічої статі.
translation_notes:
  register: Сучасна літературна українська з гідним біблійним регістром. «Ради» не ототожнюються винятково із Синедріоном; повтор «вас» збережено відповідно до грецького тексту й для ясності.
