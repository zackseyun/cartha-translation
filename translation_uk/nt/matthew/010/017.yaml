  terminology: «Ради» слушно передає συνέδρια без невиправданого ототожнення з єрусалимським Синедріоном. «Синагоги» та «бичувати» є точними усталеними відповідниками. Примітка коректно пояснює узагальнене значення ἀνθρώπων.
