review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the indefinite future circumstance, the judicial sense of παραδίδωμι, the prohibition of anxious concern, the distinction between manner and content, and the implicit-agent future passive. The repeated «говорити» appropriately reflects the repetition of λαλέω. A small adjustment to the temporal phrase better expresses Greek ἐν ἐκείνῃ τῇ ὥρᾳ in idiomatic Ukrainian.
  naturalness: «Тієї години» is the standard, natural Ukrainian temporal expression here and is more fluent than «в ту годину», while retaining the biblical register without archaism. «Як або що вам говорити» clearly preserves the Greek disjunction and is natural modern Ukrainian.
  terminology: «Видадуть» suitably conveys handing persons over to authorities without adding the narrower idea of betrayal. «Не турбуйтеся» and the passive «вам буде дано» are appropriate. The footnote correctly preserves the unnamed agent in the verse and identifies only the clarification supplied by the following verse.
