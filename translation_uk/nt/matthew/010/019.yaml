    issue: Temporal expression «в ту годину»
    rationale: Although understandable, «тієї години» is the more idiomatic Ukrainian rendering of a temporal phrase such as ἐν ἐκείνῃ τῇ ὥρᾳ and maintains the intended immediacy.
  - severity: low
    issue: Connector in «як чи що»
    rationale: «Як або що» more directly represents the source’s ἤ (‘or’) and avoids any possible colloquial ambiguity of «чи» in this paired indirect-question construction.
