  text: ὅταν δὲ ⸀παραδῶσιν ὑμᾶς, μὴ μεριμνήσητε πῶς ἢ τί λαλήσητε· δοθήσεται γὰρ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τί ⸀λαλήσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/019.yaml
  text: But when they hand you over[a], do not worry about how or what you should speak[b], for what you should speak will be given to you in that hour.
translation:
  language: uk
  text: Коли ж вас видадуть, не турбуйтеся про те, як або що вам говорити[a], бо тієї години вам буде дано[b], що говорити.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «не тривожтеся про те, як вам говорити або що сказати».'
    reason: lexical_alternative
  - marker: b
    text: Пасивна форма «буде дано» не називає того, хто дає; у наступному вірші сказано, що через учнів говоритиме Дух їхнього Отця.
    reason: cross_reference
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Коли ж
  rationale: ὅταν указує на майбутню можливу подію, а δέ м’яко продовжує думку з відтінком переходу; «Коли ж» природно передає обидва елементи.
- source_word: παραδῶσιν
  choice: вас видадуть
  rationale: У цьому контексті παραδίδωμι означає віддати когось у чужі руки, зокрема владі для суду. «Видадуть» стисло зберігає ворожий судовий контекст, не звужуючи значення до особистої зради.
- source_word: μὴ μεριμνήσητε
  choice: не турбуйтеся
  rationale: μεριμνάω тут означає тривожно непокоїтися наперед. «Не турбуйтеся» — ясний і природний сучасний відповідник.
- source_word: πῶς ἢ τί
  choice: як чи що
  rationale: Збережено розрізнення між способом мовлення та його змістом, а «чи» природно передає грецьке ἤ.
- source_word: λαλήσητε
  choice: вам говорити / що говорити
  rationale: Неозначена форма після непрямого питання природно передає задуману майбутню промову; повтор дієслова зберігає повтор λαλέω в оригіналі.
- source_word: δοθήσεται
  choice: вам буде дано
  rationale: Збережено майбутній пасив грецького тексту та не названо того, хто дає.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: в ту годину
  rationale: Близько відтворює грецький вислів і наголошує, що потрібні слова будуть дані саме тоді, коли виникне потреба.
theological_decisions:
- issue: Неявний діяч у пасивній формі δοθήσεται
  choice: 'Збережено пасив: «вам буде дано»'
  alternative: «Бог дасть вам» або «Дух дасть вам»
  rationale: У цьому вірші грецький текст прямо не називає того, хто дає. Наступний вірш пояснює дію Духа, тому тут не слід випереджати авторське уточнення.
translation_notes:
  register: Сучасна нормативна українська мова з гідним, але не архаїчним біблійним звучанням. Повтор «говорити» збережено відповідно до грецького тексту; формулювання не додає прямо не названого діяча.
