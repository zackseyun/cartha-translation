  source_fidelity: 'Загалом переклад точно передає синтаксис, образність і публічний характер κηρύξατε. «У темряві / при світлі», «на вухо» та «з дахів» зберігають риторичні образи оригіналу без зайвого тлумачення в основному тексті. Проте аористовий наказовий спосіб εἴπατε доцільніше передати доконаним «скажіть», а не недоконаним «кажіть»: це точніше відтворює заклик озвучити те, що було сказане учням.'
