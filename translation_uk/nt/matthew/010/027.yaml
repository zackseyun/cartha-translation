base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/027.yaml
  text: What I tell you in the darkness[a], say in the light; and what you hear in the ear[b], proclaim on the housetops.
translation:
  language: uk
  text: Те, що Я кажу вам у темряві[a], скажіть при світлі; і те, що чуєте на вухо[b], проголошуйте з дахів.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «потай… відкрито»; грецький текст зберігає образи «у темряві… при світлі».'
    reason: lexical_alternative
  - marker: b
    text: Тобто почуте приватно слід оголосити публічно. Ідеться про пласкі дахи давніх будинків, з яких можна було звертатися до людей.
    reason: cultural_note
lexical_decisions:
- source_word: ὃ λέγω ὑμῖν
  choice: Те, що Я кажу вам
  rationale: Природна українська конструкція, яка точно передає субстантивований відносний займенник ὃ, дієслово λέγω та непрямий додаток ὑμῖν.
- source_word: ἐν τῇ σκοτίᾳ
  choice: у темряві
  rationale: Зберігає грецький образ і виразне протиставлення світлу, не звужуючи значення до пояснювального «потай».
- source_word: εἴπατε
  choice: кажіть
  rationale: Наказова форма природно відповідає грецькому імперативу; недоконаний вид в українській доречно виражає загальне доручення учням, не нав’язуючи одноразовості.
- source_word: ἐν τῷ φωτί
  choice: при світлі
  rationale: Природний український відповідник, що зберігає образний контраст із «у темряві» та водночас передає відкритість мовлення.
- source_word: εἰς τὸ οὖς
  choice: на вухо
  rationale: Усталений український вислів для приватно сказаного, близький до грецького образу буквально спрямованої до вуха мови.
- source_word: ἀκούετε
  choice: чуєте
  rationale: Теперішній час і пряме лексичне значення дієслова збережено природною українською формою.
- source_word: κηρύξατε
  choice: проголошуйте
  rationale: Передає публічне, відкрите сповіщення, властиве κηρύσσω, без звуження до формальної проповіді.
- source_word: ἐπὶ τῶν δωμάτων
  choice: з дахів
  rationale: Українською це природно виражає проголошення з підвищеного місця; образ пласких дахів давніх будинків збережено.
theological_decisions:
- issue: Чи передавати образи темряви, світла, вуха й дахів буквально, чи замінити їх поясненням про приватне та публічне
  choice: 'Зберегти образи в основному тексті: «у темряві ... при світлі ... на вухо ... з дахів».'
  alternative: «потай ... відкрито ... почуєте приватно ... оголошуйте прилюдно»
  rationale: Грецький текст навмисно використовує яскраві протиставлені образи. Їх збереження не усуває смислової напруги між прихованим навчанням і відкритим звіщенням та не підмінює текст тлумаченням.
translation_notes:
  register: Сучасна стандартна українська, гідний і загальнозрозумілий стиль. Займенник «Я» щодо Ісуса подано з великої літери за усталеною українською біблійною практикою. Образність оригіналу збережено, а культурне пояснення винесено в примітку.
