  terminology: «Проголошуйте» вдало передає κηρύξατε без конфесійного звуження до проповіді. Образні відповідники «темрява», «світло», «вухо», «дахи» збережено. Примітки коректно пояснюють можливе смислове значення й культурне тло, не підмінюючи текст тлумаченням.
