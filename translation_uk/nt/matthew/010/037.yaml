id: MAT.10.37
reference: Matthew 10:37
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ὁ φιλῶν πατέρα ἢ μητέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος· καὶ ὁ φιλῶν υἱὸν ἢ θυγατέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/037.yaml
  text: The one who loves father or mother more than me is not worthy of me[a], and the one who loves son or daughter more than me is not worthy of me.
translation:
  language: uk
  text: Хто любить батька чи матір більше, ніж Мене, той Мене недостойний[a]; і хто любить сина чи дочку більше, ніж Мене, той Мене недостойний.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «понад Мене». Грецький вислів означає віддавати комусь перевагу в любові перед Ісусом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ φιλῶν
  choice: хто любить
  rationale: Субстантивований дієприкметник теперішнього часу позначає будь-яку людину, для якої характерна ця дія. Українська конструкція «хто любить» природно передає узагальнене значення без гендерного звуження.
- source_word: πατέρα ἢ μητέρα
  choice: батька чи матір
  rationale: Назви родинних зв’язків передано прямо, без додавання присвійного займенника, якого немає в грецькому тексті. «Чи» природно виражає альтернативу в цьому українському контексті.
- source_word: ὑπὲρ ἐμέ
  choice: більше, ніж Мене
  rationale: У порівняльній конструкції ὑπέρ виражає більшу любов або перевагу. Цей відповідник є ясним і природним та зберігає спрямованість любові на особу Ісуса.
- source_word: οὐκ ἔστιν μου ἄξιος
  choice: той Мене недостойний
  rationale: «Недостойний Мене» стисло й природно передає ἄξιος із родовим μου, не додаючи тлумачень на зразок «не гідний належати Мені».
- source_word: καὶ
  choice: і
  rationale: Простий сурядний сполучник зберігає паралельну будову двох частин вислову.
- source_word: υἱὸν ἢ θυγατέρα
  choice: сина чи дочку
  rationale: Родинні назви передано без доданого присвійного займенника, відповідно до форми грецького тексту.
theological_decisions:
- issue: Співвідношення любові до Ісуса та любові до найближчих родичів
  choice: Збережено вимогу любити Ісуса понад навіть найближчих членів родини.
  alternative: Послабити вислів до «не любить Мене так само сильно» або посилити його до вимоги ненавидіти родину.
  rationale: Грецьке ὑπὲρ ἐμέ встановлює порівняльну першість Ісуса, а висновок про недостойність зберігає гостроту вимоги. Текст не заперечує цінності родинної любові й не вживає тут мови ненависті.
translation_notes:
  register: Сучасна, ясна й гідна українська мова. Повтор «той Мене недостойний» зберігає виразний паралелізм оригіналу; велика літера в «Мене» відповідає усталеній українській біблійній практиці щодо прямої мови Ісуса.
