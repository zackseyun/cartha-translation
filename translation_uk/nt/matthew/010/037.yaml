  terminology: «Недостойний Мене» коректно передає ἄξιος з родовим μου без розширення на кшталт «негідний бути Моїм». Написання «Мене» з великої літери є прийнятною біблійною редакційною конвенцією. Примітка з маркером [a] належно прив’язана до «більше, ніж Мене» й точно пояснює альтернативне «понад Мене».
