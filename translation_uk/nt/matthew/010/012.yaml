- source_word: εἰσερχόμενοι
  choice: входячи
  rationale: Дієприкметник теперішнього часу в множині має обставинне значення й передає дію, одночасну з наказом; український дієприслівник природно зберігає цю структуру.
- source_word: δὲ
  choice: А
  rationale: Частка δέ є м’яким сполучником; «А» природно пов’язує настанову з попереднім контекстом, не надаючи їй сильного протиставного значення.
- source_word: οἰκίαν
  choice: дім
  rationale: У цьому контексті слово насамперед позначає будинок, до якого входять, водночас допускаючи метонімічне значення людей, що в ньому живуть.
- source_word: ἀσπάσασθε
  choice: привітайте
  rationale: Аористовий наказовий спосіб другої особи множини передає пряму настанову; «привітайте» є ясним і сучасним відповідником.
- source_word: αὐτήν
  choice: його
  rationale: Займенник жіночого роду в грецькій узгоджується з οἰκίαν. В українській «дім» чоловічого роду, тому граматично узгоджений займенник — «його»; метонімічне звернення до дому збережено.
theological_decisions:
- issue: Метонімічне привітання дому чи пряме позначення його мешканців
  choice: У головному тексті збережено «привітайте його», тобто дім
  alternative: «привітайте домашніх» або «привітайте тих, хто в ньому»
  rationale: Грецький займенник прямо відсилає до οἰκίαν, хоча за змістом, імовірно, маються на увазі мешканці. Основний текст зберігає образність оригіналу, а примітка пояснює ймовірний соціальний референт.
