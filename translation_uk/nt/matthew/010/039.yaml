  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ὁ εὑρὼν τὴν ψυχὴν αὐτοῦ ἀπολέσει αὐτήν, καὶ ὁ ἀπολέσας τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/039.yaml
  text: The one who finds his life will lose it[a], and the one who loses his life for my sake will find it.
translation:
  language: uk
  text: Хто знаходить своє життя, той втратить його[a], а хто втратить своє життя заради Мене, той знайде його.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «душу» в обох частинах; грецьке ψυχή може означати «життя» або «душу», але в цьому контексті втрати й знаходження в учнівстві найдоречніше «життя».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εὑρὼν
  choice: Хто знаходить
  rationale: Субстантивований дієприкметник позначає будь-яку людину; конструкція «хто…, той…» природно передає узагальнений одниновий зміст українською.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: своє життя
  rationale: У контексті учнівства ψυχή означає передусім життя людини, яке вона прагне зберегти або готова втратити. Зворотний займенник «своє» природний при тому самому суб’єкті.
- source_word: ἀπολέσει αὐτήν
  choice: втратить його
  rationale: ἀπόλλυμι тут означає втрату, а не обов’язково знищення; «втратить» зберігає протиставлення дієслову «знайде».
- source_word: ὁ ἀπολέσας
  choice: хто втратить
  rationale: Аористовий дієприкметник у цій афористичній конструкції передано природною українською умовно-узагальненою формою; майбутній вид також виразно подає завершеність втрати перед знаходженням.
- source_word: ἕνεκεν ἐμοῦ
  choice: заради Мене
  rationale: Вислів передає причину або мотив — відданість Ісусові. «Заради Мене» є стислим і природним відповідником.
- source_word: εὑρήσει αὐτήν
  choice: знайде його
  rationale: Буквальне «знайде» зберігає навмисну словесну симетрію з першим «знаходить».
theological_decisions:
- issue: Значення ψυχή в парадоксі учнівства
  choice: життя
  alternative: душа
  rationale: Йдеться про намагання зберегти або готовність віддати власне життя через вірність Ісусові, а не передусім про протиставлення душі й тіла. Водночас примітка зберігає ширший традиційний відповідник «душа».
- issue: Парадокс знаходження та втрати
  choice: Збережено однакові дієслова «знаходити/знайти» і «втратити» в обох частинах
  alternative: Передати як «зберегти/здобути»
  rationale: Лексичне повторення відтворює напруження оригінального вислову, не пояснюючи наперед, у якому остаточному сенсі життя втрачають або знаходять.
translation_notes:
  register: Сучасна літературна українська з гідним афористичним звучанням. Конструкція «хто…, той…» природно передає грецькі субстантивовані дієприкметники. Займенник «Мене» написано з великої літери відповідно до усталеної української біблійної практики.
