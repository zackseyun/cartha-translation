  text: Μὴ νομίσητε ὅτι ἦλθον βαλεῖν εἰρήνην ἐπὶ τὴν γῆν· οὐκ ἦλθον βαλεῖν εἰρήνην ἀλλὰ μάχαιραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/034.yaml
  text: Do not think that I came to bring peace on the earth[a]; I did not come to bring peace[b], but a sword.
translation:
  language: uk
  text: Не думайте, що Я прийшов принести мир на землю. Я прийшов принести не мир, а меч[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Грецький текст буквально каже «меч». У цьому контексті образ указує на розділення, яке спричинить прихід Ісуса, а не схвалює насильство.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: Не думайте
  rationale: Природно й прямо передає заборону з μή та аористним кон’юнктивом, не додаючи відтінків «уявляти» чи «припускати».
- source_word: ἦλθον
  choice: Я прийшов
  rationale: Аорист природно передається минулим часом у вислові про мету приходу Ісуса; повтор у другому реченні збережено.
- source_word: βαλεῖν
  choice: принести
  rationale: Хоча буквальне значення βάλλω — «кидати», у цій конструкції «принести» природно передає спричинений результат і однаково поєднується з «миром» та «мечем».
- source_word: εἰρήνην
  choice: мир
  rationale: Звичайний і контекстуально точний відповідник εἰρήνη.
- source_word: ἐπὶ τὴν γῆν
  choice: на землю
  rationale: Передає широкий просторовий сенс вислову; «землю» тут природніше для української біблійної прози, ніж «на Землю».
- source_word: ἀλλὰ μάχαιραν
  choice: а меч
  rationale: Конструкція «не …, а …» природно передає сильне протиставлення; конкретний образ μάχαιρα збережено як «меч».
theological_decisions:
- issue: Чи замінювати образ меча пояснювальним словом «розділення»
  choice: Зберегти в основному тексті конкретний образ «меч»
  alternative: розділення
  rationale: Грецький текст прямо містить μάχαιραν. Подальший контекст вказує на розділення, але переклад не повинен усувати образ або передчасно розв’язувати його богословську напругу.
translation_notes:
  register: Сучасна нормативна українська мова з гідним, виразним біблійним звучанням. Синтаксис «не мир, а меч» зберігає лаконічність і силу грецького протиставлення; займенник «Я» подано з великої літери за усталеною українською біблійною практикою.
