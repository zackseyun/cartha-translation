source:
  edition: SBLGNT
  text: ὅστις ⸂δ’ ἂν⸃ ἀρνήσηταί με ἔμπροσθεν τῶν ἀνθρώπων, ἀρνήσομαι ⸂κἀγὼ αὐτὸν⸃ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/033.yaml
  text: But whoever denies me before men[b][a], I also will deny him before my Father who is in heaven.
translation:
  language: uk
  text: А хто зречеться Мене перед людьми, того і Я зречуся перед Моїм Отцем, Який на небесах.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅστις δ’ ἂν
  choice: А хто
  rationale: Неозначений відносний зворот із ἄν виражає загальну умову, а δέ протиставляє цей вислів попередньому віршу. Українське «А хто» природно передає обидві функції.
- source_word: ἀρνήσηταί με
  choice: зречеться Мене
  rationale: У цьому контексті ἀρνέομαι означає публічно відмовитися визнавати зв’язок або належність. «Зректися» природніше й точніше за просте «заперечити» та допускає потрібний додаток у родовому відмінку.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: перед людьми
  rationale: ἔμπροσθεν означає «перед, у присутності», а множина ἀνθρώπων тут має загальнолюдське значення. Українське «людьми» точно й природно передає цей зміст без звуження лише до чоловіків.
- source_word: ἀρνήσομαι κἀγὼ αὐτόν
  choice: того і Я зречуся
  rationale: Повторення «зречуся» зберігає словесну й смислову взаємність. Співвідносне «того» природно повертає до загального «хто», а «і Я» передає наголос κἀγώ.
- source_word: ἔμπροσθεν τοῦ πατρός μου
  choice: перед Моїм Отцем
  rationale: Збережено образ безпосередньої присутності перед Отцем і синівське означення «Моїм».
- source_word: τοῦ ἐν οὐρανοῖς
  choice: Який на небесах
  rationale: Грецька множина οὐρανοῖς безпосередньо й водночас природно передається усталеним українським висловом «на небесах».
theological_decisions:
- issue: Взаємність зречення
  choice: зречеться Мене ... і Я зречуся
  alternative: відмовиться від Мене ... і Я відмовлюся від нього
  rationale: Один і той самий український корінь у двох частинах зберігає урочисту взаємність грецького ἀρνέομαι, не уточнюючи понад текст характер або остаточність цього зречення.
- issue: Загальне значення ἀνθρώπων та αὐτόν
  choice: перед людьми ... того
  alternative: перед чоловіками ... його
  rationale: У контексті множина ἀνθρώπων охоплює людей загалом, а αὐτόν співвідноситься з невизначеним «хто». Українські форми «людьми» і «того» точно передають референцію, не створюючи хибного обмеження за статтю.
translation_notes:
  register: Сучасна нормативна українська мова з урочистим, але зрозумілим біблійним звучанням. Паралель «зречеться — зречуся» та наголос «і Я» зберігають риторичну будову оригіналу. Усталене «на небесах» природно зберігає грецьку множину.
