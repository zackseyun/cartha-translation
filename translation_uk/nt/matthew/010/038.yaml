  verdict: revise
  source_fidelity: The clause structure and the concrete image of taking one's cross are retained. The coordinated negative sense of οὐ λαμβάνει ... καὶ ἀκολουθεῖ ὀπίσω μου is adequately conveyed by «не бере ... й не йде слідом».
  naturalness: «Мене недостойний» is understandable, but it is marked and less idiomatic in modern standard Ukrainian. «Не гідний Мене» is the natural, dignified predicative equivalent.
  terminology: «Хрест», «бере свого хреста», and «йде слідом за Мною» preserve the Gospel’s concrete discipleship imagery and the explicit ὀπίσω nuance without interpretive expansion. «Не гідний Мене» accurately conveys οὐκ ἔστιν μου ἄξιος.
  issues:
  - severity: low
    issue: Marked predicate order and construction in «той Мене недостойний».
    rationale: Although comprehensible, modern Ukrainian normally expresses this as «той не гідний Мене» (or, more literally but less naturally, «не достойний Мене»). The revision improves idiomatic usage without altering the relational force of the genitive μου.
