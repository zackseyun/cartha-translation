- from: І хто не бере свого хреста й не йде слідом за Мною, той Мене недостойний.[a]
  to: І хто не бере свого хреста й не йде слідом за Мною, той не гідний Мене.[a]
  rationale: Replaced the less natural «Мене недостойний» with the idiomatic modern Ukrainian «не гідний Мене». The wording otherwise retains the draft’s faithful rendering of the cross image, generic reflexive possession, and the more explicit sense of following behind Jesus.
