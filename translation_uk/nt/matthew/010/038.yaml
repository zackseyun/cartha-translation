source:
  edition: SBLGNT
  text: καὶ ὃς οὐ λαμβάνει τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθεῖ ὀπίσω μου, οὐκ ἔστιν μου ἄξιος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/038.yaml
  text: And whoever does not take up his cross and follow after me is not worthy of me[a][b].
translation:
  language: uk
  text: І хто не бере свого хреста й не йде слідом за Мною, той не гідний Мене.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або простіше: «не йде за Мною». Грецький вислів виразніше передає значення «йти слідом за Мною».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: хто
  rationale: Узагальнене відносне «хто» природно передає невизначено-узагальнювальний зміст грецької форми.
- source_word: λαμβάνει
  choice: бере
  rationale: У сполученні з «хрестом» дієслово означає прийняття на себе хреста; українське «бере свого хреста» стисло й природно зберігає конкретний образ.
- source_word: τὸν σταυρὸν αὐτοῦ
  choice: свого хреста
  rationale: Зворотний присвійний займенник «свого» нормативно співвідноситься з підметом «хто», зберігає однину та узагальнений характер вислову без неприродного родового маркування.
- source_word: ἀκολουθεῖ ὀπίσω μου
  choice: йде слідом за Мною
  rationale: Вислів передає як учнівське слідування, так і виразний просторовий відтінок ὀπίσω — «позаду, слідом за».
- source_word: οὐκ ἔστιν μου ἄξιος
  choice: той Мене недостойний
  rationale: Присудкове «недостойний» безпосередньо передає οὐκ … ἄξιος, а знахідний «Мене» є природним українським керуванням при «достойний/недостойний».
theological_decisions:
- issue: Образ узяття власного хреста
  choice: Збережено конкретний вислів «бере свого хреста» як вимогу учнівства, пов’язаного з готовністю до страждання, ганьби й смерті.
  alternative: 'Передати тлумачно: «приймає страждання» або «зрікається себе».'
  rationale: Грецький текст навмисно вживає конкретний образ римського знаряддя страти; абстрактний переказ звузив би його історичну й богословську напругу.
- issue: Зміст ἀκολουθεῖ ὀπίσω μου
  choice: «йде слідом за Мною»
  alternative: «іде за Мною» або «слідує за Мною».
  rationale: Обраний варіант зберігає додатковий відтінок ὀπίσω, не перетворюючи його на окрему богословську тезу.
translation_notes:
  register: Сучасна нормативна українська мова, урочиста без архаїзації. «Мною/Мене» написано з великої літери відповідно до поширеної української біблійної традиції. Конструкція «хто …, той …» забезпечує ясність і природний синтаксис.
