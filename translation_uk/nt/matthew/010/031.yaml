  naturalness: Фраза коротка, нормативна й природна для сучасної української. «Тож» доречно зберігає зв’язок із попереднім міркуванням, а «не бійтеся» відповідає звичному біблійному, але не архаїчному регістру.
  terminology: «Горобці» відповідає στρουθία в безпосередньому контексті (10:29). «Цінніші» є вдалим контекстуальним відповідником διαφέρετε й не вносить додаткового богословського пояснення.
