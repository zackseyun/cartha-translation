  text: μὴ οὖν ⸀φοβεῖσθε· πολλῶν στρουθίων διαφέρετε ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/031.yaml
  text: Therefore[a], do not be afraid; you are worth more than many sparrows.
translation:
  language: uk
  text: 'Тож не бійтеся: ви цінніші[a] за багатьох горобців.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «ви варті більше, ніж багато горобців».'
    reason: Лексична альтернатива для διαφέρετε, що в цьому контексті виражає перевагу в цінності.
lexical_decisions:
- source_word: μὴ οὖν φοβεῖσθε
  choice: Тож не бійтеся
  rationale: Частка οὖν позначає висновок із попередніх слів про турботу Отця, а μὴ з наказовою формою теперішнього часу передає заборону. «Тож не бійтеся» природно й стисло зберігає обидва значення.
- source_word: πολλῶν στρουθίων
  choice: за багатьох горобців
  rationale: У безпосередньому контексті στρουθία — горобці; родовий відмінок після διαφέρετε має порівняльне значення, яке українською передано конструкцією «цінніші за».
- source_word: διαφέρετε
  choice: цінніші
  rationale: У цьому контексті дієслово означає перевагу в цінності або значущості, а не просто відмінність. «Цінніші» ясно передає порівняння та природно звучить сучасною українською.
- source_word: ὑμεῖς
  choice: ви
  rationale: Явно вжитий займенник наголошує на учнях у зіставленні з горобцями; українське «ви» зберігає цей акцент без неприродного підсилення.
theological_decisions:
- issue: Порівняльна цінність учнів і горобців у словах Ісуса
  choice: ви цінніші за багатьох горобців
  alternative: ви варті більше, ніж багато горобців
  rationale: Переклад зберігає твердження про більшу цінність учнів у межах аргументу про Божу турботу, не заперечуючи Божої турботи про тварин і не уточнюючи підстав цієї цінності понад те, що сказано в тексті.
translation_notes:
  register: Сучасна нормативна українська мова; вислів стислий, природний і гідний за тоном. «Тож» виразно пов’язує настанову з попереднім обґрунтуванням, а «не бійтеся» є звичним і зрозумілим формулюванням заборони.
