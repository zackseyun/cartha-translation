id: MAT.10.35
reference: Matthew 10:35
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ἦλθον γὰρ διχάσαι ἄνθρωπον κατὰ τοῦ πατρὸς αὐτοῦ καὶ θυγατέρα κατὰ τῆς μητρὸς αὐτῆς καὶ νύμφην κατὰ τῆς πενθερᾶς αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/035.yaml
  text: For I came to set a man against his father[a], and a daughter against her mother, and a daughter-in-law against her mother-in-law[b],
translation:
  language: uk
  text: Бо Я прийшов поставити чоловіка проти його батька[a], дочку — проти її матері, а невістку — проти її свекрухи[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «розділити». Грецький інфінітив можна перекласти буквальніше саме так, однак повторене далі «проти» показує, що йдеться про протистояння у стосунках.
    reason: lexical_alternative
  - marker: b
    text: Грецьке νύμφη в деяких контекстах може означати «наречена»; тут воно означає «невістка», оскільки стоїть у парі зі словом «свекруха».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: Я прийшов
  rationale: Аорист ἔρχομαι в цьому вислові стосується приходу й місії Ісуса; український минулий час передає це природно.
- source_word: γὰρ
  choice: Бо
  rationale: Сполучник вводить пояснення попереднього твердження й природно передається українським «бо».
- source_word: διχάσαι
  choice: поставити ... проти
  rationale: Дієслово означає розділити або спричинити поділ; повторювана конструкція κατά з родовим відмінком конкретизує цей поділ як протистояння між людьми.
- source_word: ἄνθρωπον
  choice: чоловіка
  rationale: Хоча ἄνθρωπος може мати загальне значення «людина», тут він входить до родинної тріади поряд із дочкою та невісткою, тому доречне конкретне «чоловіка».
- source_word: κατὰ τοῦ πατρὸς αὐτοῦ
  choice: проти його батька
  rationale: κατά з родовим відмінком виражає протистояння; українське «проти» точно й природно його передає.
- source_word: θυγατέρα
  choice: дочку
  rationale: Прямий сучасний відповідник іменника θυγάτηρ у знахідному відмінку.
- source_word: κατὰ τῆς μητρὸς αὐτῆς
  choice: проти її матері
  rationale: Збережено ту саму конструкцію протистояння та явну належність, виражену αὐτῆς.
- source_word: νύμφην
  choice: невістку
  rationale: νύμφη може означати «наречена», але поєднання з πενθερά в цьому родинному переліку вимагає значення «невістка».
- source_word: κατὰ τῆς πενθερᾶς αὐτῆς
  choice: проти її свекрухи
  rationale: πενθερά тут означає матір чоловіка щодо невістки; «свекруха» є точним сучасним українським терміном спорідненості.
theological_decisions:
- issue: Характер заявленої мети приходу Ісуса
  choice: Зберегти різке формулювання про спричинене приходом Ісуса родинне протистояння, не додаючи пояснення про його остаточну мету.
  alternative: Перекласти буквальніше «розділити» або розгорнути думку як переслідування через вірність Ісусові.
  rationale: Грецький текст прямо говорить про поділ і протистояння членів родини. Переклад «поставити ... проти» зберігає богословську напругу, не подаючи в основному тексті додаткового тлумачення.
translation_notes:
  register: Сучасна стандартна українська, природний і водночас гідний біблійний регістр. Тире в другій і третій парах усуває неприродне повторення дієслова, зберігаючи паралелізм грецького речення. Займенник «Я» написано з великої літери згідно з усталеною українською біблійною практикою.
