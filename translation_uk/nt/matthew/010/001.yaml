source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενος τοὺς δώδεκα μαθητὰς αὐτοῦ ἔδωκεν αὐτοῖς ἐξουσίαν πνευμάτων ἀκαθάρτων ὥστε ἐκβάλλειν αὐτὰ καὶ θεραπεύειν πᾶσαν νόσον καὶ πᾶσαν μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/001.yaml
  text: And calling his twelve disciples to himself[a], he gave them authority over unclean spirits[c][b], to cast them out and to heal every disease and every sickness.
translation:
  language: uk
  text: І, покликавши до себе дванадцятьох Своїх учнів, Він дав їм владу[a] над нечистими духами, щоб виганяти їх і зцілювати всяку хворобу й усяку недугу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «силу». Грецьке слово ἐξουσία часто означає владу чи надане повноваження, але в певних контекстах може мати відтінок дієвої сили.'
    reason: lexical_alternative
  - marker: b
    text: Слова «хвороба» і «недуга» передають два близькі грецькі поняття (νόσος і μαλακία); друге можна також перекласти як «неміч».
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: покликавши до себе
  rationale: Аористовий середній дієприкметник передає поклик або скликання до себе; українська конструкція природно зберігає і попередню щодо головної дії обставину, і зворотний відтінок.
- source_word: τοὺς δώδεκα μαθητὰς αὐτοῦ
  choice: дванадцятьох Своїх учнів
  rationale: «Учні» є природним відповідником μαθηταί у євангельському контексті; форма «дванадцятьох» узгоджується з назвою осіб у знахідному відмінку.
- source_word: ἔδωκεν
  choice: дав
  rationale: Зберігає просте й пряме значення δίδωμι без додаткового тлумачення.
- source_word: ἐξουσίαν
  choice: владу
  rationale: Передає право й повноваження діяти, а не лише безособову силу; можливий відтінок «сили» зазначено у примітці.
- source_word: πνευμάτων ἀκαθάρτων
  choice: над нечистими духами
  rationale: Прийменникова конструкція природно передає родовий відмінок залежно від ἐξουσίαν як владу, здійснювану над духами; «нечисті духи» є точним і усталеним біблійним висловом.
- source_word: ὥστε ἐκβάλλειν αὐτὰ
  choice: щоб виганяти їх
  rationale: Конструкція ὥστε з інфінітивом допускає цільово-наслідковий відтінок. Українське «щоб» природно виражає надану спроможність і призначення, не обтяжуючи речення.
- source_word: θεραπεύειν
  choice: зцілювати
  rationale: У цьому контексті йдеться про повернення здоров’я; «зцілювати» є зрозумілим і гідним відповідником, точнішим тут за процесуальне «лікувати».
- source_word: πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: всяку хворобу й усяку недугу
  rationale: Збережено повтор πᾶσαν і два споріднені, але окремі грецькі іменники. «Хвороба» та «недуга» природно відтворюють цю пару без штучного загострення різниці.
theological_decisions:
- issue: Характер влади, даної учням
  choice: Ісус дав дванадцятьом владу над нечистими духами, що виявлялася у їх вигнанні та зціленні недуг.
  alternative: Ісус дав їм силу над нечистими духами.
  rationale: ἐξουσία передусім позначає владу або повноваження, хоча може включати дієву силу. Основний текст не додає систематичного богословського пояснення, а примітка зберігає лексичний діапазон.
- issue: Відношення ὥστε до наступних інфінітивів
  choice: Передано через «щоб», із природним для контексту цільово-наслідковим відтінком.
  alternative: «так що вони могли» або «аби»
  rationale: Грецька конструкція може поєднувати мету й результат. «Щоб» не змушує обирати лише одну з цих категорій і ясно пов’язує дану владу з вигнанням духів та зціленням.
translation_notes:
  register: Сучасна літературна українська мова з гідним біблійним звучанням. Синтаксис з дієприслівником зберігає компактність грецького речення. Займенники «Своїх» і «Він» написано з великої літери як традиційний шанобливий графічний засіб; це не додає окремого тлумачення до змісту.
