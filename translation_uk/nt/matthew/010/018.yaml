  text: καὶ ἐπὶ ἡγεμόνας δὲ καὶ βασιλεῖς ἀχθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς καὶ τοῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/018.yaml
  text: And you will be brought before governors and kings because of me[b][a], as a testimony to them and to the Gentiles.
translation:
  language: uk
  text: І вас приведуть перед правителів і царів через Мене — на свідчення їм[b] і народам[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «язичникам».'
    reason: lexical_alternative
  - marker: b
    text: У цьому контексті «їм» можна також розуміти як «проти них», хоча сам грецький давальний відмінок цього прямо не виражає.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ ἡγεμόνας ... καὶ βασιλεῖς
  choice: до правителів та царів
  rationale: Після дієслова приведення ἐπί з акузативом указує на постання перед владою. Українське «поведуть до правителів та царів» природно передає рух до владних осіб і судовий контекст, не додаючи невираженого насильства.
- source_word: ἀχθήσεσθε
  choice: поведуть вас
  rationale: Майбутній пасив від ἄγω. Неозначено-особова конструкція природна українською і зберігає значення «вас приведуть/поведуть», не посилюючи примусу до «потягнуть».
- source_word: ἕνεκεν ἐμοῦ
  choice: через Мене
  rationale: ἕνεκεν із родовим позначає причину. «Через Мене» стисло й природно передає, що причиною переслідування є зв’язок учнів з Ісусом.
- source_word: εἰς μαρτύριον
  choice: на свідчення
  rationale: 'Вислів може позначати мету або результат: поява учнів перед владою стане свідченням. Іменникова форма зберігає структуру й місткість грецького вислову.'
- source_word: αὐτοῖς
  choice: їм
  rationale: Давальний займенник найприродніше стосується правителів і царів. Нейтральне «їм» не вирішує наперед, чи свідчення буде для них, чи в контексті набуде обвинувальної сили.
- source_word: τοῖς ἔθνεσιν
  choice: народам
  rationale: ἔθνη може означати як народи, так і язичників. «Народам» безпосередньо зберігає ширше лексичне значення; можливий контекстуальний варіант подано у примітці.
theological_decisions:
- issue: Спрямування вислову μαρτύριον αὐτοῖς
  choice: нейтральне «на свідчення їм»
  alternative: «на свідчення проти них»
  rationale: Сам давальний αὐτοῖς не виражає протиставлення. Нейтральний переклад зберігає напруження між свідченням як звіщенням адресатам і свідченням, яке через їхню реакцію може стати обвинувальним.
- issue: Значення τοῖς ἔθνεσιν
  choice: «народам»
  alternative: «язичникам»
  rationale: У Матвія ἔθνη нерідко означає неюдейські народи, однак лексично можливе ширше «народи». Основний текст не звужує референт без необхідності, а контекстуальне розуміння зазначене в примітці.
translation_notes:
  register: Сучасна, зрозуміла й урочиста українська мова. Збережено лаконічність грецького речення, іменник «свідчення» та неоднозначність адресного давального; великою літерою в «Мене» позначено особу Ісуса за звичною українською біблійною практикою.
