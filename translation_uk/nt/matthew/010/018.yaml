  naturalness: The wording is generally modern and clear. «Вас приведуть перед правителів і царів» is more idiomatic for a compelled judicial appearance and makes the relation to the authorities explicit.
  terminology: «Правителів», «царів», «свідчення», and «народи» are suitable. The footnotes appropriately preserve the possible contextual sense «язичникам» and the non-explicit adversative interpretation of «їм».
