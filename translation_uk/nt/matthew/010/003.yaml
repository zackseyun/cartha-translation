lexical_decisions:
- source_word: Φίλιππος
  choice: Филип
  rationale: Усталена українська біблійна форма особового імені.
- source_word: Βαρθολομαῖος
  choice: Варфоломій
  rationale: Усталена українська біблійна форма особового імені.
- source_word: Θωμᾶς
  choice: Тома
  rationale: Усталена сучасна українська біблійна форма імені; природно відмінюється українською.
- source_word: Μαθθαῖος
  choice: Матвій
  rationale: Усталена українська біблійна форма особового імені.
- source_word: ὁ τελώνης
  choice: збирач податків
  rationale: Ясно й сучасно передає людину, яка збирала податки або мита; слово «митар» тут не вжито через його архаїчність і можливі сторонні асоціації.
- source_word: Ἰάκωβος
  choice: Яків
  rationale: Усталена українська біблійна форма грецького імені Ἰάκωβος.
- source_word: ὁ τοῦ Ἁλφαίου
  choice: син Алфея
  rationale: Грецька родова конструкція ідентифікує Якова за батьком; явне «син» природне й недвозначне українською.
- source_word: Ἁλφαίου
  choice: Алфея
  rationale: Родовий відмінок усталеної української форми імені Алфей.
- source_word: Θαδδαῖος
  choice: Тадей
  rationale: Основний текст SBLGNT має Θαδδαῖος; «Тадей» є усталеною українською формою цього імені.
- source_word: καὶ
  choice: і / й
  rationale: Координацію грецького переліку збережено, а чергування «і/й» відповідає українській милозвучності.
theological_decisions:
- issue: Ідентифікація останнього апостола в цьому фрагменті переліку
  choice: Тадей
  alternative: Леввей; Юда, син Якова
  rationale: Основний грецький текст читає Θαδδαῖος, тому в основному тексті подано «Тадей». Інші рукописні читання та відповідне місце в переліках Луки зазначено у примітці, без гармонізації.
translation_notes:
  register: Сучасна стандартна українська, природна й гідна. Збережено просту будову переліку; прикладку «збирач податків» відокремлено комами для ясності. Маркер примітки поставлено після імені, якого вона стосується.
