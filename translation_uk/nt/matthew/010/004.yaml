  yaml_path: translation/nt/matthew/010/004.yaml
  text: Simon the Cananaean[a], and Judas Iscariot[b], who also betrayed him.
translation:
  language: uk
  text: Симон Кананіт[a] та Юда Іскаріот, який і зрадив Його[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «Симон Зилот». У грецькому тексті — «Кананіт», імовірно позначення арамейського або єврейського походження, яке традиційно розуміють як «Зилот».
    reason: lexical_alternative
  - marker: b
    text: Або «який і видав Його». Грецьке дієслово може означати «передати, видати», хоча стосовно Юди контекстуально доречне «зрадив».
    reason: alternative_reading
lexical_decisions:
- source_word: Καναναῖος
  choice: Кананіт
  rationale: Передано традиційною українською транслітераційною формою, а не тлумаченням «Зилот», оскільки в грецькому тексті стоїть Καναναῖος — позначення семітського походження, а не звичайне грецьке ζηλωτής.
- source_word: Ἰσκαριώτης
  choice: Іскаріот
  rationale: Усталена українська передача особового прізвиська.
- source_word: παραδοὺς
  choice: зрадив
  rationale: Дієслово παραδίδωμι буквально має ширше значення «передавати, видавати», але щодо Юди контекстуально означає зрадницьку видачу Ісуса; ширше буквальне значення збережено у примітці.
- source_word: ὁ καὶ παραδοὺς αὐτόν
  choice: який і зрадив Його
  rationale: Артикльований дієприкметник природно передано означальним підрядним реченням; καί відтворено часткою «і».
theological_decisions:
- issue: Чи передавати παραδοὺς нейтральніше як «видав», чи контекстуально як «зрадив»
  choice: зрадив
  alternative: видав
  rationale: У переліку апостолів Юду ідентифіковано за відомим із подальшої оповіді вчинком. «Зрадив» природно передає його моральний і стосунковий характер, тоді як примітка зберігає ширше значення грецького дієслова.
translation_notes:
  register: Сучасна нормативна українська мова з гідним біблійним регістром. Імена передано в усталених українських формах; займенник «Його» щодо Ісуса написано з великої літери за поширеною українською біблійною практикою.
