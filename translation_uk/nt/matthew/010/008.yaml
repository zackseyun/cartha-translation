  text: ἀσθενοῦντας θεραπεύετε, ⸂νεκροὺς ἐγείρετε⸃, λεπροὺς καθαρίζετε, δαιμόνια ἐκβάλλετε· δωρεὰν ἐλάβετε, δωρεὰν δότε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/008.yaml
  text: Heal the sick[a], raise the dead, cleanse lepers, cast out demons. Freely you received; freely give.
translation:
  language: uk
  text: Хворих зцілюйте, мертвих воскрешайте[a], прокажених очищайте[b], демонів виганяйте. Даром одержали — даром давайте.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: У деяких рукописах слів «мертвих воскрешайте» немає.
    reason: textual_variant
  - marker: b
    text: 'Буквально: «прокажених». У біблійному вжитку цей термін міг охоплювати різні тяжкі шкірні хвороби, а не лише сучасну хворобу Гансена (лепру).'
    reason: cultural_note
lexical_decisions:
- source_word: ἀσθενοῦντας
  choice: хворих
  rationale: У контексті зцілення субстантивований дієприкметник означає людей, які хворіють; «хворих» природно й стисло передає цей зміст.
- source_word: θεραπεύετε
  choice: зцілюйте
  rationale: У переліку чудесних дій дієслово означає повертати здоров’я; «зцілюйте» природніше й ширше за клінічне «лікуйте».
- source_word: νεκροὺς ἐγείρετε
  choice: мертвих воскрешайте
  rationale: У цьому сполученні ἐγείρω означає піднімати з мертвих. «Воскрешайте» ясно передає це значення без зайвого розгортання.
- source_word: λεπροὺς
  choice: прокажених
  rationale: Традиційний біблійний відповідник є стислим і впізнаваним, а примітка пояснює, що давній термін охоплював ширше коло тяжких шкірних хвороб, ніж сучасна хвороба Гансена.
- source_word: καθαρίζετε
  choice: очищайте
  rationale: Дієслово зберігає як тілесний, так і ритуальний відтінок очищення, тому точніше за просте «зцілюйте».
- source_word: δαιμόνια ἐκβάλλετε
  choice: демонів виганяйте
  rationale: «Виганяйте» природно передає примусове видалення в контексті екзорцизму.
- source_word: δωρεὰν
  choice: даром
  rationale: Прислівник означає без плати, як дар. Повтор «даром… даром» зберігає виразний паралелізм грецького тексту.
- source_word: ἐλάβετε
  choice: одержали
  rationale: 'Аорист передано минулим часом: учні вже одержали доручені їм дари й повноваження.'
- source_word: δότε
  choice: давайте
  rationale: Форма наказового способу множини передає тривалу практичну настанову; спосіб давання визначений прислівником «даром».
theological_decisions:
- issue: Обсяг наказів про чудесні дії
  choice: Передати всі дієслова як прямі накази Дванадцятьом у межах цієї місії.
  alternative: Тлумачити перелічені дії метафорично або обмежити їх пізнішими церковними практиками.
  rationale: Грецький текст містить конкретну послідовність наказових форм множини. Переклад не повинен ані послаблювати історичне доручення, ані самостійно розширювати його застосування.
- issue: Текстова наявність слів νεκροὺς ἐγείρετε
  choice: Залишити «мертвих воскрешайте» в основному тексті та позначити текстову варіантність приміткою.
  alternative: Вилучити ці слова з основного тексту за рукописами, у яких їх немає.
  rationale: SBLGNT друкує фразу в тексті, але спеціальними знаками відзначає варіантність; примітка зберігає важливе свідчення рукописної традиції без мовчазного розв’язання питання.
translation_notes:
  register: Сучасна стандартна українська, гідний і зрозумілий стиль. Повторювані наказові форми збережено для ритму переліку; «даром одержали — даром давайте» відтворює лаконічний паралелізм оригіналу.
