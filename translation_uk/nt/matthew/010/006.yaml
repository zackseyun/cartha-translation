  text: а краще йдіть до загублених овець дому Ізраїлю[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «до овець, що загубилися з дому Ізраїлю».'
    reason: 'Лексико-синтаксична альтернатива: родовий зворот «дому Ізраїлю» можна пов’язати не лише з «вівцями», а й зі станом їхньої втраченості.'
lexical_decisions:
- source_word: πορεύεσθε
  choice: йдіть
  rationale: Форма наказового способу другої особи множини. «Йдіть» природно передає пряме доручення в контексті послання учнів.
- source_word: δὲ μᾶλλον
  choice: а краще
  rationale: Поєднання позначає протиставлення попередній забороні та спрямовує учнів до іншої групи. «А краще» зберігає і контраст, і значення переваги/заміни, не роблячи вислів надмірно категоричним.
- source_word: πρὸς
  choice: до
  rationale: З дієсловом руху прийменник указує на напрямок до адресатів місії; українське «до» є природним відповідником.
- source_word: τὰ πρόβατα
  choice: овець
  rationale: Збережено виразний біблійний образ овець, а не замінено його тлумачним «людей» чи збірним «отари».
- source_word: τὰ ἀπολωλότα
  choice: загублених
  rationale: Дієприкметник перфекта ἀπόλλυμι в пастирській метафорі означає тих, хто перебуває в стані втраченості. «Загублених» передає цей стан без звуження до фізичної загибелі.
- source_word: οἴκου Ἰσραήλ
  choice: дому Ізраїля
  rationale: Збережено усталений біблійний корпоративний вислів «дім Ізраїля», а не розгорнуто його як «народ Ізраїля».
theological_decisions:
- issue: Метафоричний опис Ізраїля
  choice: Збережено вислів «загублені вівці дому Ізраїля» як метафору.
  alternative: «Ізраїльтяни, які збилися з дороги»
  rationale: Грецький текст прямо використовує образ овець, що має зв’язок із пастирською образністю Писання. Його збереження не підмінює текст поясненням.
- issue: Зв’язок родового відмінка οἴκου Ἰσραήλ
  choice: Основний текст читається як «загублені вівці дому Ізраїля».
  alternative: «вівці, що загубилися з дому Ізраїля»
  rationale: Грецька конструкція допускає розуміння дому Ізраїля як спільноти, до якої належать вівці, або як спільноти, з якої вони загубилися. Основний текст зберігає традиційне й природне прочитання, а примітка фіксує синтаксичну альтернативу.
translation_notes:
  register: Сучасна, зрозуміла й водночас гідна українська мова. Наказ «йдіть» звучить природно; біблійні образи «овець» і «дому Ізраїля» збережено без конфесійного тлумачення.
