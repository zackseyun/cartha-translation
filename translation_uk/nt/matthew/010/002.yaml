id: MAT.10.2
reference: Matthew 10:2
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: τῶν δὲ δώδεκα ἀποστόλων τὰ ὀνόματά ἐστιν ταῦτα· πρῶτος Σίμων ὁ λεγόμενος Πέτρος καὶ Ἀνδρέας ὁ ἀδελφὸς ⸀αὐτοῦ, Ἰάκωβος ὁ τοῦ Ζεβεδαίου καὶ Ἰωάννης ὁ ἀδελφὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/002.yaml
  text: 'These are the names of the twelve apostles: first[a], Simon who is called Peter, and Andrew his brother; James the son of Zebedee, and John his brother,'
translation:
  language: uk
  text: 'Ось імена дванадцятьох апостолів: перший[a] — Симон, якого називають Петром, та Андрій, його брат; Яків, син Зеведея, та Іван, його брат.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або це слово може вказувати на визначне становище серед дванадцятьох, а не лише на перше місце в переліку.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Ось
  rationale: Частка δέ позначає м’який перехід до переліку. Українське «ось» природно вводить названі далі імена, не додаючи часового значення.
- source_word: δώδεκα ἀποστόλων
  choice: дванадцятьох апостолів
  rationale: «Апостоли» — усталений і точний відповідник ἀπόστολοι для визнаної групи посланих Ісусом учнів; форма «дванадцятьох» природна при означенні осіб у родовому відмінку.
- source_word: τὰ ὀνόματά ἐστιν ταῦτα
  choice: Ось імена
  rationale: Стисла сучасна українська конструкція природно передає вказівну формулу «імена є ці».
- source_word: πρῶτος
  choice: перший
  rationale: Зберігає пряме значення слова й природно вводить першого учасника переліку, не визначаючи, чи йдеться також про першість за становищем.
- source_word: ὁ λεγόμενος
  choice: якого називають
  rationale: Прозоро передає теперішній пасивний дієприкметниковий зворот і вказує на інше ім’я Симона.
- source_word: Πέτρος
  choice: Петром
  rationale: Ужито традиційну українську форму особового імені; орудний відмінок зумовлений конструкцією «називають».
- source_word: ὁ ἀδελφὸς αὐτοῦ
  choice: його брат
  rationale: Природна українська присвійна конструкція для буквальної спорідненості; у першому випадку займенник стосується Симона, у другому — Якова.
- source_word: ὁ τοῦ Ζεβεδαίου
  choice: син Зеведея
  rationale: Родовий ідентифікатор у цьому контексті виражає походження; українською його природно й точно передано як «син Зеведея».
- source_word: Ἰάκωβος / Ἰωάννης
  choice: Яків / Іван
  rationale: Ужито усталені українські біблійні форми цих особових імен.
theological_decisions:
- issue: Значення πρῶτος щодо Симона-Петра
  choice: У головному тексті — «перший», без пояснення як першості влади.
  alternative: Слово може натякати на визначне становище або провідну роль серед дванадцятьох.
  rationale: У контексті починається перелік, тому послідовне значення є безпосереднім. Водночас можливий відтінок визначного становища збережено у примітці без конфесійного висновку.
translation_notes:
  register: Сучасна стандартна українська мова; виклад ясний, природний і гідний. Тире після «перший» виразно оформлює початок переліку, а крапка з комою відділяє дві пари братів. Сполучник καί передано як «та» для плавності.
