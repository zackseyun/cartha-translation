  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου· ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/022.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: uk
  text: І всі ненавидітимуть вас через Моє ім’я[a]. А хто витерпить до кінця[b], той буде спасений[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «заради Мого імені».'
    reason: lexical_alternative
  - marker: b
    text: 'Або: «хто залишиться стійким до кінця».'
    reason: lexical_alternative
  - marker: c
    text: «Буде спасений» можна також зрозуміти як «буде врятований» або «буде визволений» — залежно від розуміння контексту.
    reason: alternative_reading
lexical_decisions:
- source_word: μισούμενοι ὑπὸ πάντων
  choice: всі ненавидітимуть вас
  rationale: Природна українська активна конструкція точно передає майбутній пасивний стан і всеохопність πάντων; агент «всі» виражений явно.
- source_word: διὰ τὸ ὄνομά μου
  choice: через Моє ім’я
  rationale: 'διά з акузативом указує на причину. «Ім’я» зберігає біблійну місткість: особу Ісуса, Його владу та належність до Нього.'
- source_word: ὁ δὲ ὑπομείνας
  choice: А хто витерпить
  rationale: «Витерпить» природно передає ὑπομένω в контексті переслідування, не вводячи пізнішої богословської термінології.
- source_word: εἰς τέλος
  choice: до кінця
  rationale: Стисло й точно позначає тривання аж до кінцевої межі.
- source_word: οὗτος
  choice: той
  rationale: Корелятивна українська конструкція «хто… той» природно зберігає підсумковий та наголошувальний характер οὗτος.
- source_word: σωθήσεται
  choice: буде спасенний
  rationale: Зберігає широкий діапазон σῴζω та не звужує вислів лише до фізичного порятунку.
theological_decisions:
- issue: Значення спасіння у зв’язку з витривалістю до кінця
  choice: Залишити широке формулювання «буде спасенний».
  alternative: «буде врятований» або конкретизація як фізичного визволення чи остаточного есхатологічного спасіння
  rationale: Текст пов’язує витривалість під час переслідувань зі спасінням, але сам переклад не має вирішувати пізніші доктринальні суперечки чи штучно звужувати значення.
translation_notes:
  register: Сучасна, ясна й гідна українська. Конструкція «хто… той» природно відтворює грецьке підсилення; збережено богословську широту σωθήσεται. Займенник «Моє» подано з великої літери відповідно до поширеної української біблійної практики.
