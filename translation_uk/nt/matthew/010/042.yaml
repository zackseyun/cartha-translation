  text: καὶ ὃς ⸀ἂν ποτίσῃ ἕνα τῶν μικρῶν τούτων ποτήριον ψυχροῦ μόνον εἰς ὄνομα μαθητοῦ, ἀμὴν λέγω ὑμῖν, οὐ μὴ ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/042.yaml
  text: And whoever gives one of these little ones even a cup of cold water in the name of a disciple[a], truly I say to you[b], he will certainly not lose his reward.
translation:
  language: uk
  text: 'І хто напоїть одного з цих малих[a] хоча б чашею холодної води через те, що той — учень[b], — істинно кажу вам: він аж ніяк не втратить своєї нагороди.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Малі» тут, імовірно, означає людей непримітних або низького становища серед послідовників Ісуса, а не обов’язково лише дітей.
    reason: cross_reference
  - marker: b
    text: 'Буквальніше: «в ім’я учня». Грецький вислів указує, що це роблять з огляду на те, що одержувач є учнем.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς ἂν
  choice: хто
  rationale: Поєднання відносного займенника з ἄν має узагальнено-неозначене значення; українське «хто» природно передає відкриту загальну умову.
- source_word: ποτίσῃ
  choice: напоїть
  rationale: Дієслово означає «дасть пити, напоїть». Українське «напоїть ... чашею холодної води» точно й природно передає саму дію.
- source_word: ἕνα τῶν μικρῶν τούτων
  choice: одного з цих малих
  rationale: «Малих» зберігає образну відкритість вислову й не звужує його лише до дітей; контекст допускає значення невпливових або малозначущих в очах інших учнів.
- source_word: ποτήριον ψυχροῦ
  choice: чашею холодної води
  rationale: У грецькому вислові після «холодного» мається на увазі вода. Орудний відмінок природно поєднується з українським «напоїть».
- source_word: μόνον
  choice: хоча б
  rationale: 'У контексті μόνον підкреслює мінімальність дару. «Хоча б» природно передає думку: навіть така мала послуга, як одна чаша холодної води.'
- source_word: εἰς ὄνομα μαθητοῦ
  choice: через те, що той — учень
  rationale: Вислів указує на підставу вчинку — особу приймають і напувають з огляду на її належність до учнів. «Той» чітко відносить означення до одержувача води, а формальніший варіант наведено в примітці.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: істинно кажу вам
  rationale: Це усталена урочиста формула, яка вводить авторитетне запевнення; «істинно» передає функцію ἀμήν у зрозумілій сучасній українській мові.
- source_word: οὐ μὴ ἀπολέσῃ
  choice: аж ніяк не втратить
  rationale: Подвійна заперечна конструкція οὐ μή виражає сильне й категоричне запевнення. «Аж ніяк не втратить» зберігає цю емфазу без архаїзму.
- source_word: τὸν μισθὸν αὐτοῦ
  choice: своєї нагороди
  rationale: У контексті учнівства μισθός означає відплату або нагороду; зворотний займенник «своєї» природно співвідносить її з виконавцем дії.
theological_decisions:
- issue: Кого названо «цими малими»
  choice: Збережено широкий вислів «ці малі» без ототожнення лише з дітьми.
  alternative: «Ці діти» або виключно нові чи слабкі віруючі.
  rationale: Безпосередній контекст говорить про прийняття посланців та учнів Ісуса. Текст може позначати людей низького становища чи малозначущих в очах світу, тому переклад не звужує референта.
- issue: Значення εἰς ὄνομα μαθητοῦ
  choice: 'Передано як причину вчинку: «через те, що той — учень».'
  alternative: 'Буквальніше: «в ім’я учня»; також можливе «як учня».'
  rationale: Грецький вислів пов’язує вчинок зі статусом одержувача як учня. Ідіоматичний переклад уникає необов’язкових формульних або сакраментальних відтінків, а буквальну форму збережено в примітці.
- issue: Характер нагороди
  choice: Збережено загальне «нагорода» без уточнення її виду, часу або способу отримання.
  alternative: Конкретизація як земної, небесної чи есхатологічної відплати.
  rationale: Вірш категорично обіцяє, що нагорода не буде втрачена, але тут не визначає докладно її характеру; переклад не додає доктринального уточнення.
translation_notes:
  register: Сучасна нормативна українська мова з урочистим, але зрозумілим біблійним звучанням. Синтаксис зберігає послідовність грецького вислову, водночас уникаючи неприродного калькування. Тире виділяють урочисте запевнення Ісуса.
