lexical_decisions:
- source_word: ὑμῶν
  choice: у вас … на голові
  rationale: Родовий займенник другої особи множини природно передано українською конструкцією належності «у вас … на голові».
- source_word: δὲ
  choice: А
  rationale: Передає м’який контраст і перехід у контексті, не надаючи вислову надмірно різкого протиставлення.
- source_word: καὶ
  choice: навіть
  rationale: 'Зберігає підсилювальне значення: Божому знанню не уникає навіть окреме волосся.'
- source_word: αἱ τρίχες τῆς κεφαλῆς
  choice: волосся на голові
  rationale: Природний сучасний український відповідник грецької конструкції; збірний іменник «волосся» не усуває ідеї сукупності окремих волосин.
- source_word: πᾶσαι
  choice: усе
  rationale: Узгоджується зі збірним іменником «волосся» та зберігає наголос на повноті.
- source_word: ἠριθμημέναι εἰσίν
  choice: пораховане
  rationale: Передає перифрастичний перфект пасивного стану як наявний результат завершеної дії; український короткий присудковий дієприкметник звучить природно.
theological_decisions:
- issue: Обсяг Божого знання й піклування, який випливає з вислову
  choice: Збережено конкретний образ повністю порахованого волосся без доктринального розгортання.
  alternative: Додати пояснення про Божу опіку, всезнання або провидіння.
  rationale: Грецький текст прямо говорить про волосся, що перебуває в порахованому стані; богословський висновок має випливати з контексту, а не вводитися до перекладу.
translation_notes:
  register: Сучасна стандартна українська; проста, гідна й природна синтаксична будова. Форму множини адресатів передано конструкцією «у вас».
