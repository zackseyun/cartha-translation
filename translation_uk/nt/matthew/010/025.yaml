id: MAT.10.25
reference: Matthew 10:25
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: ἀρκετὸν τῷ μαθητῇ ἵνα γένηται ὡς ὁ διδάσκαλος αὐτοῦ, καὶ ὁ δοῦλος ὡς ὁ κύριος αὐτοῦ. εἰ τὸν οἰκοδεσπότην Βεελζεβοὺλ ⸀ἐπεκάλεσαν, πόσῳ μᾶλλον τοὺς οἰκιακοὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/025.yaml
  text: It is enough for the disciple that he become like his teacher[a], and the slave like his master. If they called the master of the house Beelzebul, how much more those of his household.
translation:
  language: uk
  text: Учневі досить стати таким, як його вчитель, а рабові — таким, як його пан. Якщо господаря дому назвали Вельзевулом[a], то наскільки ж більше — його домочадців!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «Вельзевув» — традиційна варіантна форма цього імені.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀρκετὸν
  choice: досить
  rationale: Природно передає предикативний прикметник зі значенням достатності без зайвого розгортання.
- source_word: μαθητῇ
  choice: учневі
  rationale: Зберігає значення послідовника, який навчається у вчителя, та природно утворює пару з «вчитель».
- source_word: ἵνα γένηται
  choice: стати таким
  rationale: Український інфінітив природно передає залежну конструкцію після «досить», а «таким» увиразнює порівняння з ὡς.
- source_word: διδάσκαλος
  choice: вчитель
  rationale: Найточніше відповідає контексту пари «учень — вчитель» і не змішується з κύριος.
- source_word: δοῦλος
  choice: раб
  rationale: У прямому зіставленні з κύριος йдеться про підлеглий соціальний статус, тому «раб» точніше за м’якше «слуга».
- source_word: κύριος
  choice: пан
  rationale: У побутовій аналогії раба та його власника слово має соціальне, а не виразно титулярне значення.
- source_word: οἰκοδεσπότην
  choice: господаря дому
  rationale: Передає і керівну роль, і образ дому, який продовжується словом οἰκιακούς.
- source_word: Βεελζεβοὺλ
  choice: Вельзевул
  rationale: Відтворює грецьку форму Βεελζεβούλ у звичній українській біблійній транслітерації.
- source_word: ἐπεκάλεσαν
  choice: назвали
  rationale: У цьому контексті дієслово означає дати комусь образливе найменування.
- source_word: πόσῳ μᾶλλον
  choice: наскільки ж більше
  rationale: Зберігає посилювальний висновок a fortiori та природно звучить у риторичному реченні.
- source_word: οἰκιακοὺς
  choice: домочадців
  rationale: Охоплює людей, що належать до домашнього кола, не звужуючи значення лише до слуг або рабів.
theological_decisions:
- issue: Значення κύριος у домашній аналогії
  choice: пан
  alternative: Господь
  rationale: Безпосередня пара з δοῦλος описує суспільно-домашні відносини; переклад «Господь» тут передчасно перетворив би аналогію на виразний христологічний титул.
- issue: Передача δοῦλος
  choice: раб
  alternative: слуга
  rationale: Контраст із κύριος наголошує на статусній залежності, яку «раб» передає точніше, не пом’якшуючи історичної реалії.
- issue: Еліпсис у заключній частині
  choice: 'збережено: «то наскільки ж більше — його домочадців!»'
  alternative: то наскільки ж гірше називатимуть його домочадців
  rationale: Грецький текст не повторює дієслова, тому переклад зберігає стислу риторичну недомовленість і не додає невираженого «гірше».
translation_notes:
  register: Сучасна літературна українська з гідним, але доступним синтаксисом. Паралелізм «учень — вчитель / раб — пан» збережено; тире в останній частині передає грецький еліпсис. Маркер примітки поставлено біля імені, якого вона стосується.
