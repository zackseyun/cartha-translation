  text: Πᾶς οὖν ὅστις ὁμολογήσει ἐν ἐμοὶ ἔμπροσθεν τῶν ἀνθρώπων, ὁμολογήσω κἀγὼ ἐν αὐτῷ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/032.yaml
  text: Therefore everyone who confesses me before men[b][a], I also will confess before my Father who is in heaven.
translation:
  language: uk
  text: Отже, кожен, хто визнає Мене перед людьми[a], — того і Я визнаю[b] перед Моїм Отцем, Який на небесах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Грецьке слово означає людей загалом; граматична форма — чоловічий рід множини.
    reason: lexical_alternative
  - marker: b
    text: 'Грецькою буквальніше: «і Я визнаю в ньому» або «щодо нього». Подібна конструкція стоїть і в першій частині: буквально «визнає в Мені». У тексті її передано природним українським висловом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: Отже, кожен, хто
  rationale: Передає узагальнювальне значення Πᾶς ὅστις природною українською конструкцією, а «Отже» зберігає висновковий зв’язок οὖν із попереднім контекстом.
- source_word: ὁμολογήσει ἐν ἐμοὶ
  choice: визнає Мене
  rationale: У цьому контексті ὁμολογέω означає відкрите визнання Ісуса перед іншими. Буквальне «визнає в Мені» українською звучить неприродно й затемнює ідіоматичний зміст конструкції з ἐν.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: перед людьми
  rationale: «Перед» точно передає присутність або публічність, виражену ἔμπροσθεν. ἄνθρωποι тут позначає людей загалом, тому українське «людьми» і точне, і природне.
- source_word: ὁμολογήσω κἀγὼ ἐν αὐτῷ
  choice: того і Я визнаю
  rationale: Повторення «визнаю» зберігає виразну взаємність із першим ὁμολογήσει, а «і Я» передає наголос κἀγώ. Займенникове «того» природно оформлює об’єкт українською; незвичну конструкцію ἐν αὐτῷ подано в примітці.
- source_word: ἔμπροσθεν τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: перед Моїм Отцем, Який на небесах
  rationale: Зберігає особовий вислів «Мій Отець» і множину οὐρανοῖς природним для української біблійної мови висловом «на небесах».
theological_decisions:
- issue: Публічне визнання Ісуса та відповідне визнання людини Ісусом
  choice: Передати вислів як пряму обітницю взаємного визнання перед Отцем.
  alternative: Уточнити, що йдеться саме про остаточний суд, або, навпаки, лише про теперішнє учнівство.
  rationale: Сам вірш не встановлює часової рамки й не пояснює механізму спасіння чи суду. Переклад зберігає вагу обітниці, не додаючи систематичного тлумачення.
- issue: Значення конструкцій ὁμολογέω ἐν ἐμοί / ἐν αὐτῷ
  choice: У тексті вжити природне українське «визнає Мене / того ... визнаю», а формальну незвичність грецького вислову засвідчити в примітці.
  alternative: Буквально перекласти «визнає в Мені / визнаю в ньому».
  rationale: Буквальний варіант допускається формою грецького тексту, але українською не передає ясно усталеного контекстуального значення. Примітка не приховує формальної неоднозначності.
translation_notes:
  register: Сучасна, зрозуміла й водночас гідна українська мова. Тире підкреслює відповідність між двома частинами вислову. Займенники, що стосуються Ісуса й Отця, написано з великої літери відповідно до поширеної української біблійної традиції.
