  text: καὶ ὃς ⸀ἂν μὴ δέξηται ὑμᾶς μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν, ἐξερχόμενοι ⸀ἔξω τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης ἐκτινάξατε τὸν κονιορτὸν τῶν ποδῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/014.yaml
  text: And whoever does not receive you or listen to your words[a], as you go out of that house or that town[c][b], shake off the dust from your feet.
translation:
  language: uk
  text: А якщо хтось не прийме вас і не послухає ваших слів[a], то, виходячи з того дому чи того міста[c], струсіть порох зі своїх ніг[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «і не почує ваших слів».'
    reason: lexical_alternative
  - marker: b
    text: Струшування пороху з ніг було символічним знаком відмежування та суду над тими, хто відкинув звістку.
    reason: cultural_note
  - marker: c
    text: Грецьке слово πόλις може означати як місто, так і невелике містечко.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἂν μὴ
  choice: якщо хтось не
  rationale: Неозначена відносна конструкція з ἄν має узагальнено-умовний зміст. «Якщо хтось не» природно передає цей зміст українською, а початкове καί відтворено як «А».
- source_word: δέξηται ὑμᾶς
  choice: не прийме вас
  rationale: Дієслово δέχομαι охоплює як гостинне прийняття посланців, так і прихильне ставлення до їхньої місії; «прийме» зберігає цю широту.
- source_word: μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν
  choice: і не послухає ваших слів
  rationale: У цьому контексті ἀκούω означає не лише фізично почути, а й вислухати звістку. «Послухає» природно передає уважне слухання, не додаючи виразної ідеї покори.
- source_word: ἐξερχόμενοι ἔξω
  choice: виходячи з
  rationale: Дієприкметникова конструкція описує супровідну дію перед наказом; українське «виходячи з» близько відтворює і форму, і просторовий зміст вислову.
- source_word: τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης
  choice: того дому чи того міста
  rationale: Повторення «того» природно й недвозначно передає вказівний зміст щодо обох можливих місць. πόλις тут передано широким українським словом «місто».
- source_word: ἐκτινάξατε
  choice: струсіть
  rationale: Наказовий аорист позначає рішучу дію видалення пороху; «струсіть» точно й природно передає цей образ.
- source_word: τὸν κονιορτὸν τῶν ποδῶν ὑμῶν
  choice: порох зі своїх ніг
  rationale: κονιορτός означає саме порох або пил. «Порох» зберігає конкретний образ, а «зі своїх ніг» природно виражає віддалення від ніг тих, кому дано наказ.
theological_decisions:
- issue: Символічна дія суду щодо тих, хто відкидає посланців і їхню звістку
  choice: Зберегти конкретний наказ «струсіть порох зі своїх ніг», не розтлумачуючи його в основному тексті.
  alternative: Додати в основний текст пояснення на зразок «на свідчення проти них» або динамічно передати дію як оголошення суду.
  rationale: Сам цей вірш називає символічну дію, але прямо не пояснює її. Конкретний образ зберігає богословську напругу й не переносить сюди формулювання з паралельних місць; стислий культурний коментар подано у примітці.
translation_notes:
  register: Сучасна літературна українська з легкою урочистістю, властивою біблійному викладу. Речення зберігає умовний характер грецької конструкції, конкретність просторової дії та символічний образ без конфесійного розтлумачення.
