lexical_decisions:
- source_word: πορευόμενοι
  choice: Ідіть
  rationale: Дієприкметник теперішнього часу супроводжує наказове κηρύσσετε. Українське «ідіть» природно передає супровідну наказову дію в цьому посланні учнів, не перевантажуючи речення буквальним «ідучи».
- source_word: δὲ
  choice: і
  rationale: Слабкий сполучний елемент продовжує попередні настанови; «і» зберігає зв’язок без надмірного протиставлення.
- source_word: κηρύσσετε
  choice: звіщайте
  rationale: Передає публічне й авторитетне проголошення, але не звужує його до церковного проповідування.
- source_word: λέγοντες
  choice: двокрапка перед прямою мовою
  rationale: Дієприкметник вводить зміст звістки. В українській це природно виражається двокрапкою та прямою мовою без зайвого «кажучи».
- source_word: ὅτι
  choice: пряма мова без окремого відповідника
  rationale: Сполучник вводить зміст проголошення; українська пряма мова передає цю функцію синтаксично.
- source_word: Ἤγγικεν
  choice: наблизилося
  rationale: Дококонаний вид передає досягнуту близькість із чинним тепер результатом, не зводячи значення лише до статичного «близько».
- source_word: ἡ βασιλεία
  choice: Царство
  rationale: Усталений широкий відповідник, здатний охопити і царювання, і царську сферу; велика літера відбиває назву Божого есхатологічного Царства в цьому контексті.
- source_word: τῶν οὐρανῶν
  choice: Небесне
  rationale: Природний український відповідник Матвієвого вислову; він зберігає його відмінність і не гармонізує текст із формулою «Царство Боже».
theological_decisions:
- issue: Значення вислову ἡ βασιλεία τῶν οὐρανῶν
  choice: Небесне Царство
  alternative: Боже Царство; царювання небес
  rationale: Збережено характерне для Матвія формулювання та широту βασιλεία, не підмінюючи його гармонізацією чи вузьким тлумаченням.
- issue: Аспект Ἤγγικεν
  choice: наблизилося
  alternative: близько; прийшло близько
  rationale: Дококонана форма зберігає думку про близькість, яка настала й залишається актуальною, не визначаючи докладніше богословську схему Царства.
translation_notes:
  register: Сучасна нормативна українська, урочиста, але зрозуміла. Відтворено наказовий характер і публічність звіщення; грецьке λέγοντες природно передано оформленням прямої мови.
