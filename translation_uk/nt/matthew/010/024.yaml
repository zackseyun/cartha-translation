  text: Οὐκ ἔστιν μαθητὴς ὑπὲρ τὸν διδάσκαλον οὐδὲ δοῦλος ὑπὲρ τὸν κύριον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/024.yaml
  text: A disciple is not above the teacher[b][a], nor a slave above his master.
translation:
  language: uk
  text: Учень не вищий за вчителя, і раб[a] не вищий за свого пана[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «слуга»; грецьке слово δοῦλος залежно від контексту може передаватися як «раб» або «слуга».
    reason: alternative_reading
  - marker: b
    text: Або «господар»; грецьке κύριος також може означати «Господь», але тут у складі аналогії воно називає людського пана.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητής
  choice: учень
  rationale: «Учень» природно передає не лише навчання, а й особистий зв’язок із учителем, властивий євангельському контексту.
- source_word: ὑπέρ
  choice: вищий за
  rationale: Зі знахідним відмінком слово виражає вищість у становищі; українська порівняльна конструкція «вищий за» точно й природно передає цей зміст.
- source_word: διδάσκαλος
  choice: вчитель
  rationale: Це прямий і загальнозрозумілий відповідник, який також зберігає відмінність від наступної пари «раб — пан».
- source_word: δοῦλος
  choice: раб
  rationale: У зіставленні з κύριος наголошено на підлеглому становищі, тому «раб» точніше за «слугу» зберігає соціальну силу образу.
- source_word: κύριος
  choice: пан
  rationale: Тут слово позначає людського пана щодо раба, а не є божественним титулом; «пан» стисло й природно передає цей зв’язок.
- source_word: αὐτοῦ
  choice: свого
  rationale: Зворотний присвійний займенник природно показує, що йдеться про пана саме цього раба.
- source_word: οὐδέ
  choice: і ... не
  rationale: У сучасній українській ця конструкція природно приєднує друге заперечне порівняння; зміст грецького «ані/і не» збережено.
theological_decisions:
- issue: Передача δοῦλος у соціальній аналогії
  choice: раб
  alternative: слуга
  rationale: Пара δοῦλος—κύριος описує нерівність статусу й підлеглість. «Раб» не послаблює цей образ, а можливий ширший відповідник зазначено у примітці.
- issue: Передача κύριος у небожественному контексті
  choice: пан
  alternative: господар; Господь
  rationale: У безпосередній парі з «рабом» це людський зверхник. Переклад «Господь» міг би безпідставно перетворити складник аналогії на прямий божественний титул.
translation_notes:
  register: Сучасна стандартна українська; вислів лаконічний і гідний за тоном. Паралельну будову двох порівнянь збережено, без додавання богословського тлумачення.
