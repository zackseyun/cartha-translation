  source_fidelity: Український текст точно передає невизначену конструкцію εἰς ἣν δ’ ἂν, протиставлення «місто чи село», наказ ἐξετάσατε, оцінне ἄξιος, а також часову межу ἕως ἂν ἐξέλθητε. «До якого б … ви не ввійшли» природно виражає значення «до якого б не», а «доки не вийдете» не звужує неуточнений у грецькому тексті напрям виходу.
