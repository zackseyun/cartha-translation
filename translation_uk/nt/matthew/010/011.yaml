id: MAT.10.11
reference: Matthew 10:11
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην εἰσέλθητε, ἐξετάσατε τίς ἐν αὐτῇ ἄξιός ἐστιν· κἀκεῖ μείνατε ἕως ἂν ἐξέλθητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/011.yaml
  text: Into whatever city or village you enter[a], find out who in it is worthy[b], and stay there until you leave.
translation:
  language: uk
  text: До якого б міста чи села ви не ввійшли, з’ясуйте[a], хто в ньому гідний[b], і там залишайтеся, доки не вийдете.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «розпитайтеся» чи «дослідіть».
    reason: lexical_alternative
  - marker: b
    text: «Гідний» тут, імовірно, означає того, хто належно прийме посланців або готовий їх прийняти, а не того, хто заслужив Божу прихильність.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην
  choice: До якого б міста чи села
  rationale: Конструкція з εἰς, відносним займенником і ἄν позначає будь-яке поселення, до якого учні можуть увійти. Українська конструкція «до якого б ... не» природно передає напрямок і невизначеність.
- source_word: εἰσέλθητε
  choice: ви не ввійшли
  rationale: Аорист кон’юнктива в невизначеному відносному реченні природно передається українською формою доконаного виду в конструкції «до якого б ... не ввійшли».
- source_word: ἐξετάσατε
  choice: з’ясуйте
  rationale: Дієслово означає цілеспрямовано довідатися через розпитування або перевірку. «З’ясуйте» є зрозумілим сучасним відповідником і не звужує спосіб пошуку.
- source_word: τίς ἐν αὐτῇ
  choice: хто в ньому
  rationale: Займенник «ньому» узгоджується з найближчим узагальненим поняттям поселення, представленим словами «місто чи село», і зберігає прив’язку до названого місця.
- source_word: ἄξιός ἐστιν
  choice: гідний
  rationale: «Гідний» зберігає оцінне значення ἄξιος та властиву контексту неоднозначність, не підмінюючи її пояснювальним словом на кшталт «гостинний» чи «придатний».
- source_word: κἀκεῖ μείνατε
  choice: і там залишайтеся
  rationale: Передано як сполучне καί, так і місцеве ἐκεῖ. «Залишайтеся» природно виражає тривале перебування у вибраному місці.
- source_word: ἕως ἂν ἐξέλθητε
  choice: доки не вийдете
  rationale: Формула позначає майбутню межу перебування. Без називання місця виходу переклад зберігає стислість та референційну відкритість грецького тексту.
theological_decisions:
- issue: Значення слова ἄξιος у настанові посланцям
  choice: У головному тексті збережено «гідний».
  alternative: «Придатний», «надійний» або «готовий прийняти вас».
  rationale: Контекст допускає розуміння людини як належного чи прихильного господаря, але сам текст використовує ширше оцінне слово. Тому переклад не зводить його до конкретної якості й не пов’язує з заслуженням Божої прихильності.
translation_notes:
  register: Сучасна літературна українська мова з гідним, але загальнозрозумілим звучанням. Синтаксис зберігає послідовність грецької настанови; примітки пояснюють лексичні відтінки, не усуваючи неоднозначності головного тексту.
