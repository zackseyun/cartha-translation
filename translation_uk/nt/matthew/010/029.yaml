id: MAT.10.29
reference: Matthew 10:29
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: οὐχὶ δύο στρουθία ἀσσαρίου πωλεῖται; καὶ ἓν ἐξ αὐτῶν οὐ πεσεῖται ἐπὶ τὴν γῆν ἄνευ τοῦ πατρὸς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/029.yaml
  text: Are not two sparrows sold for an assarion? Yet not one of them will fall to the ground apart from your Father[a][b].
translation:
  language: uk
  text: Хіба не продають двох горобців за один асарій?[b] Та жоден із них не впаде на землю без вашого Отця.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Або: «окремо від вашого Отця»; ці слова можуть означати, що це не стається без Його відома, турботи чи волі, але грецький текст не уточнює, що саме мається на увазі.'
    reason: alternative_reading
  - marker: b
    text: Асарій — дрібна римська мідна монета дуже малої вартості.
    reason: cultural_note
lexical_decisions:
- source_word: στρουθία
  choice: горобців
  rationale: У цьому вислові слово природно й традиційно означає горобців; загальніше «малих пташок» можливе, але менш конкретне.
- source_word: ἀσσαρίου
  choice: за один асарій
  rationale: Збережено назву конкретної дрібної римської монети, а її малу вартість пояснено в примітці.
- source_word: πωλεῖται
  choice: не продають
  rationale: Українська неозначено-особова конструкція природно передає грецький пасив теперішнього часу.
- source_word: ἓν ἐξ αὐτῶν
  choice: жоден із них
  rationale: У заперечному реченні це природний український відповідник вислову «один із них» без зміни значення.
- source_word: πεσεῖται ἐπὶ τὴν γῆν
  choice: не впаде на землю
  rationale: Природний і точний український відповідник руху до землі.
- source_word: ἄνευ τοῦ πατρὸς ὑμῶν
  choice: без вашого Отця
  rationale: Близько передає ἄνευ та не уточнює, чи йдеться про знання, турботу, волю або дозвіл Отця.
- source_word: οὐχὶ ... ;
  choice: Хіба не ...?
  rationale: Передає риторичне запитання, що передбачає ствердну відповідь.
- source_word: καὶ
  choice: Та
  rationale: 'У контексті природно виражає контраст: попри мізерну ціну горобців, жоден не падає без Отця.'
theological_decisions:
- issue: Значення вислову «без вашого Отця» щодо Божого провидіння
  choice: Збережено неоднозначний вислів «без вашого Отця».
  alternative: «без відома вашого Отця» або «без волі вашого Отця»
  rationale: Грецький текст стверджує причетність Отця, але не визначає її спосіб; конкретизація як знання чи волі звузила б зміст.
translation_notes:
  register: Сучасна, зрозуміла й гідна українська мова. «Хіба не продають» природно передає риторичність, а історичну назву монети збережено з короткою культурною приміткою. Маркери поставлено безпосередньо після відповідних висловів.
