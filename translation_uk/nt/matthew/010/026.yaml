id: MAT.10.26
reference: Matthew 10:26
language:
  code: uk
  name: Ukrainian
  native_name: Українська
  variant: modern standard Ukrainian
source:
  edition: SBLGNT
  text: Μὴ οὖν φοβηθῆτε αὐτούς· οὐδὲν γάρ ἐστιν κεκαλυμμένον ὃ οὐκ ἀποκαλυφθήσεται, καὶ κρυπτὸν ὃ οὐ γνωσθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/026.yaml
  text: Therefore, do not fear them, for nothing is covered that will not be revealed, and hidden that will not be made known.
translation:
  language: uk
  text: Тож не бійтеся їх, бо немає нічого прихованого, що не буде виявлене, і нічого таємного, що не стане відомим.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ οὖν φοβηθῆτε αὐτούς
  choice: Тож не бійтеся їх
  rationale: «Тож» природно передає висновкове οὖν, а «не бійтеся їх» точно відтворює заперечний наказ і займенник αὐτούς.
- source_word: κεκαλυμμένον
  choice: покритого
  rationale: Збережено конкретний образ дієприкметника від καλύπτω — того, що покрите, а згодом буде відкрито.
- source_word: ἀποκαλυφθήσεται
  choice: буде відкрито
  rationale: Пасивна форма та образ зняття покриву передані без уточнення виконавця дії.
- source_word: κρυπτὸν
  choice: таємного
  rationale: У цьому протиставленні слово означає те, що приховане від знання; «таємного» звучить природно й узгоджується з наступним «стане відомим».
- source_word: γνωσθήσεται
  choice: стане відомим
  rationale: Природний український відповідник пасивного значення «буде пізнане / зробиться знаним», без додавання суб’єкта пізнання.
theological_decisions:
- issue: Хто відкриває покрите і робить таємне відомим
  choice: Пасивні конструкції без називання виконавця
  alternative: Явно назвати Бога виконавцем дії
  rationale: Грецький текст не називає виконавця; переклад зберігає цю граматичну й богословську недомовленість.
translation_notes:
  register: Сучасна стандартна українська; стислий, гідний і зрозумілий виклад. Паралелізм двох частин збережено, а жодних приміток не потрібно.
