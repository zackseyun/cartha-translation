  text: καὶ ἐὰν μὲν ᾖ ἡ οἰκία ἀξία, ἐλθάτω ἡ εἰρήνη ὑμῶν ἐπ’ αὐτήν· ἐὰν δὲ μὴ ᾖ ἀξία, ἡ εἰρήνη ὑμῶν ⸀πρὸς ὑμᾶς ἐπιστραφήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/013.yaml
  text: And if the house is worthy[a], let your peace come upon it; but if it is not worthy[c][b], let your peace return to you.
translation:
  language: uk
  text: І якщо той дім[a] гідний, нехай ваш мир зійде на нього; а якщо він не гідний[b], нехай ваш мир повернеться до вас[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Або «оселя»; грецьке слово означає «дім» і в цьому контексті може також стосуватися людей, які в ньому живуть.
    reason: lexical_alternative
  - marker: b
    text: «Гідний» тут означає придатний прийняти посланців і їхній мир, а не морально безгрішний.
    reason: cultural_note
  - marker: c
    text: Або «нехай ваш мир обернеться назад до вас».
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκία
  choice: дім
  rationale: Прямий і природний відповідник; у цьому контексті слово може охоплювати також домашніх, які живуть у домі.
- source_word: ἀξία
  choice: гідний
  rationale: Зберігає оцінне значення грецького слова, не звужуючи його до самої привітності чи сприйнятливості.
- source_word: ἐλθάτω
  choice: нехай ... зійде
  rationale: Передає наказовий спосіб і разом із «на нього» природно відтворює образ миру, що приходить на дім.
- source_word: εἰρήνη
  choice: мир
  rationale: Звичайний біблійний відповідник, який у контексті може включати добробут і благословення, не зводячись лише до привітання.
- source_word: ἐπ’ αὐτήν
  choice: на нього
  rationale: Відтворює спрямованість ἐπί з акузативом; займенник стосується дому.
- source_word: πρὸς ὑμᾶς
  choice: до вас
  rationale: Передає напрямок, тоді як значення повернення вже виражене дієсловом.
- source_word: ἐπιστραφήτω
  choice: нехай ... повернеться
  rationale: Природно передає наказову форму й образ миру, який не залишається в негідному домі.
- source_word: μὲν ... δὲ
  choice: якщо ...; а якщо ...
  rationale: Природно відтворює зіставну будову грецького речення.
theological_decisions:
- issue: Природа вислову «ваш мир»
  choice: Збережено вислів «ваш мир» як проголошений учнями мир, що може зійти на дім або повернутися до них.
  alternative: «ваше привітання миру»; «мир, який ви проголошуєте»; «благословення миру»
  rationale: Текст конкретно й образно говорить про мир у контексті місії учнів, але не пояснює механізму його дії. Переклад не зводить його ані до простої ввічливої формули, ані до докладно визначеної духовної сили.
translation_notes:
  register: Сучасна нормативна українська мова з гідним біблійним звучанням. Формулювання зберігає паралелізм умовних частин та персоніфікований образ миру; «зійде на нього» звучить природніше за буквальне «прийде на нього».
