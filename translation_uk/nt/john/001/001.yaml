  text: In the beginning was the Word[a], and the Word was with God[b], and the Word was God.
translation:
  language: uk
  text: На початку[a] було Слово, і Слово було з Богом, і Слово було Богом[b].
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: Вислів перегукується з Буття 1:1 і пов’язує Слово з початком творіння.
    reason: cross_reference
  - marker: b
    text: 'Або, з передаванням якісного відтінку грецького вислову: «Слово було божественним» чи «яким був Бог, таким було й Слово». В останній частині «Бог» може підкреслювати природу Слова; водночас граматичне оформлення відрізняє Слово від Бога, згаданого в попередній частині.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν ἀρχῇ
  choice: На початку
  rationale: Природний український відповідник, який зберігає виразний перегук із Буття 1:1 та вказує на початок творіння.
- source_word: ἦν
  choice: було
  rationale: Імперфект дієслова εἰμί найприродніше передається формою «було»; повтор цієї форми зберігає ритм і підкреслює буття Слова вже на початку.
- source_word: ὁ λόγος
  choice: Слово
  rationale: «Слово» зберігає широкий зміст λόγος — мовлення, самовираження й одкровення — та його особове христологічне вживання в цьому уривку, не звужуючи значення до «Послання», «Розуму» чи запозиченого «Логосу».
- source_word: πρὸς τὸν θεόν
  choice: з Богом
  rationale: У цьому контексті πρός виражає особову близькість і спрямованість у взаєминах. «З Богом» передає це природною українською мовою, водночас зберігаючи розрізнення між Словом і Богом.
- source_word: τὸν θεόν
  choice: Богом
  rationale: Означений грецький вислів указує на Бога як конкретну особу; після українського прийменника «з» нормативно вжито орудний відмінок.
- source_word: θεὸς ἦν ὁ λόγος
  choice: Слово було Богом
  rationale: 'Присудкове θεός без артикля, поставлене перед дієсловом, має якісну силу: воно говорить про природу Слова, не ототожнюючи його особово з Богом із попередньої частини. «Слово було Богом» природно й виразно стверджує це українською.'
theological_decisions:
- issue: Передача безартиклевого присудкового θεός в останній частині вірша
  choice: Слово було Богом
  alternative: Слово було божественним; яким був Бог, таким було й Слово
  rationale: Основний текст зберігає сильне твердження грецького оригіналу про природу Слова та водночас не стирає особового розрізнення, вираженого попередньою частиною. «Божественним» українською може звучати слабше, ніби йдеться лише про богоподібну властивість, а розгорнутий варіант є радше поясненням, ніж перекладом.
translation_notes:
  register: Сучасна нормативна українська мова, урочиста, але проста й зрозуміла. Повтор «було Слово / Слово було» відтворює лаконічність і ритм грецького речення. Великі літери в «Слово» та «Бог» відбивають особове й богословське вживання цих назв у контексті.
