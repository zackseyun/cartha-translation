  text: In the beginning, when God created the heavens and the earth[a]—
translation:
  language: uk
  text: На початку, коли Бог створив небеса й землю[a] —
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 'Традиційний переклад подає цей вислів як завершене речення: «На початку Бог створив небеса й землю». Однак єврейська конструкція — בְּרֵאשִׁית без артикля, після якого стоїть особова форма дієслова בָּרָא, — природніше читається як залежне часове речення, подібно до Бут. 2:4б. Головне речення з’являється у вірші 3: «І сказав Бог: “Нехай буде світло”».'
    reason: Уточнено опис єврейської форми та нормалізовано розділові знаки навколо вставної конструкції.
lexical_decisions:
- source_word: בְּרֵאשִׁית
  choice: На початку, коли … створив
  rationale: Форма без означеного артикля, після якої стоїть особова форма дієслова בָּרָא, найприродніше читається як залежна часова конструкція. Такий переклад зберігає значення слова רֵאשִׁית («початок») і водночас показує синтаксичний зв’язок із наступним викладом.
- source_word: בָּרָא
  choice: створив
  rationale: Дієслово בָּרָא є усталеним позначенням Божої творчої дії в Єврейській Біблії. «Створив» прямо передає його значення, не уточнюючи способу створення.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Попри морфологічно множинну форму іменника, однина дієслова בָּרָא вказує тут на єдиного Бога.
- source_word: אֵת
  choice: не перекладається окремим словом
  rationale: אֵת є показником означеного прямого додатка; в українській його функцію передає синтаксис речення.
- source_word: הַשָּׁמַיִם
  choice: небеса
  rationale: Множина «небеса» відтворює форму єврейського слова. Разом із «землею» це словосполучення позначає всю сукупність створеного світу.
- source_word: הָאָרֶץ
  choice: землю
  rationale: У парі з «небесами» слово אָרֶץ має космічне значення «земля», а не локальне «країна» чи «суходіл».
theological_decisions:
- issue: Синтаксис початкової конструкції
  choice: 'Залежна часова конструкція: «На початку, коли Бог створив небеса й землю,—»'
  alternative: 'Самостійне завершене речення: «На початку Бог створив небеса й землю».'
  rationale: Відсутність артикля при בְּרֵאשִׁית, безпосередня особова форма בָּרָא та подібні часові початки в Бут. 2:4б і Ос. 1:2 підтримують залежне прочитання, за якого виклад веде до головної дії у вірші 3. Традиційне самостійне прочитання збережено в примітці, щоб не усувати справжню синтаксичну неоднозначність.
translation_notes:
  register: Сучасна стандартна українська мова; виклад лаконічний і урочистий без архаїзмів. Сполука «небеса й землю» природно звучить українською та зберігає єврейський меризм. Кома й тире позначають незавершеність залежної конструкції, яка продовжується в наступних віршах.
