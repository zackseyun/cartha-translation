  yaml_path: translation/ot/ecclesiastes/001/002.yaml
  text: Breath of breaths[a], says Qoheleth[b]; breath of breaths, all is mere breath.
translation:
  language: uk
  text: Подих подихів[a], — каже Когелет[b], — подих подихів; усе — лише подих.
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: Єврейське הֶבֶל (гевел) буквально означає «подих» або «пару». У Книзі Еклезіаста це слово водночас передає нетривкість, невловимість і разючу невідповідність між очікуваним та дійсним. Жодне українське слово не охоплює всіх цих відтінків, тому в перекладі збережено конкретний образ «подих». Вислів «подих подихів» — єврейська конструкція найвищого ступеня, подібна до «Пісня пісень» або «Святеє святих».
    reason: lexical_choice
  - marker: b
    text: Когелет — транслітерований єврейський титул або ім’я; його традиційно перекладають як «Учитель» чи «Проповідник», але кожен із цих варіантів звужує можливе значення.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶבֶל
  choice: марнота
  rationale: Українське «марнота» зберігає образно-оцінний характер наскрізного слова книги й може охоплювати нетривкість, невловимість та невідповідність між сподіванням і результатом. Буквальні «подих» або «пара» виразніше передають конкретний образ, але в цій формулі українською можуть звучати як твердження про матеріальну сутність усього.
- source_word: הֲבֵל הֲבָלִים
  choice: марнота марнот
  rationale: Збережено єврейську конструкцію найвищого ступеня «X із-поміж X-ів», відому також із висловів на кшталт «Пісня пісень» і «Святе святих».
- source_word: אָמַר
  choice: каже
  rationale: Теперішній час природно передає літературну формулу проголошення та надає вислову безпосередності.
- source_word: קֹהֶלֶת
  choice: Когелет
  rationale: Транслітерація зберігає відкритість незвичного єврейського титулу або імені й не звужує його значення до «Учителя» чи «Проповідника».
- source_word: הַכֹּל
  choice: усе
  rationale: Природний сучасний український відповідник із всеохопним значенням.
theological_decisions:
- issue: Передача наскрізного мотиву הֶבֶל
  choice: У головному тексті «марнота», а в примітці пояснено буквальний образ подиху або пари та ширший спектр значень.
  alternative: «подих», «пара», «тлінність», «безглуздя», «марність»
  rationale: «Безглуздя» надмірно наближає вислів до нігілізму, а «тлінність» звужує його до минущості. «Марнота» є природною й усталеною українською формою, однак примітка потрібна, щоб не втратити конкретний образ і справжню багатозначність єврейського слова.
- issue: Значення קֹהֶלֶת
  choice: Когелет
  alternative: Учитель; Проповідник; Збирач
  rationale: Точне значення назви дискусійне; транслітерація не нав'язує одного тлумачення.
translation_notes:
  register: Сучасна нормативна українська з урочистою лаконічністю афористичного вислову. Пунктуація виразно відділяє вставну формулу «каже Когелет», а повтор і єврейську суперлативну конструкцію збережено.
