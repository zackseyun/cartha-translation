  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐκ τοῦ καπνοῦ ἐξῆλθον ἀκρίδες εἰς τὴν γῆν, καὶ ἐδόθη αὐταῖς ἐξουσία ὡς ἔχουσιν ἐξουσίαν οἱ σκορπίοι τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/003.yaml
  text: And out of the smoke came locusts onto the earth[a], and authority was given to them, as the scorpions of the earth have authority.
translation:
  language: id
  text: Dari asap itu keluarlah belalang ke bumi, dan kepada mereka diberikan wewenang[a], seperti wewenang yang dimiliki kalajengking di bumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kuasa”. Kata Yunani ini dapat berarti wewenang, hak, atau kuasa. “Wewenang” dipilih karena bentuk pasifnya menunjukkan kapasitas atau izin yang diberikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ καπνοῦ
  choice: dari asap itu
  rationale: ἐκ menyatakan gerak keluar dari dalam asap. Dalam bahasa Indonesia, gabungan “dari asap itu keluarlah” menyampaikan kemunculan tersebut secara jelas dan alami.
- source_word: ἐξῆλθον
  choice: keluarlah
  rationale: Bentuk aoris ἐξέρχομαι menyatakan tindakan keluar. Partikel -lah memberi susunan naratif yang wajar tanpa menambah makna teologis.
- source_word: ἀκρίδες
  choice: belalang-belalang
  rationale: ἀκρίς menunjuk pada belalang, khususnya belalang perusak dalam konteks Alkitab. Bentuk ulang menyatakan jumlah jamak.
- source_word: εἰς τὴν γῆν
  choice: ke bumi
  rationale: εἰς menyatakan arah gerak, sedangkan γῆ dalam konteks Wahyu paling wajar dipahami sebagai bumi, bukan sekadar suatu wilayah tanah.
- source_word: ἐδόθη αὐταῖς ἐξουσία
  choice: kepada mereka diberikan wewenang
  rationale: Susunan pasif mempertahankan bentuk Yunani dan tidak menyebutkan siapa pemberinya. “Wewenang” menonjolkan kapasitas atau izin yang diberikan, dengan “kuasa” dicatat sebagai alternatif.
- source_word: ὡς ἔχουσιν ἐξουσίαν
  choice: sama seperti ... memiliki wewenang
  rationale: ὡς memperkenalkan perbandingan. Pengulangan “wewenang” mempertahankan pengulangan ἐξουσία dalam teks Yunani.
- source_word: οἱ σκορπίοι τῆς γῆς
  choice: kalajengking-kalajengking di bumi
  rationale: Ungkapan ini menyampaikan genitif Yunani secara alami dalam bahasa Indonesia dan membedakan kalajengking di bumi dari belalang yang muncul dari asap.
theological_decisions:
- issue: Sifat kapasitas yang diberikan kepada belalang-belalang
  choice: Menerjemahkan ἐξουσία sebagai “wewenang” dan mempertahankan bentuk pasif “diberikan” tanpa menyebutkan pemberinya.
  alternative: Menerjemahkan ἐξουσία sebagai “kuasa” atau menyebutkan secara eksplisit siapa yang memberikannya.
  rationale: Teks menggambarkan kapasitas yang diterima atau diizinkan, bukan daya yang berdiri sendiri. Bentuk pasif menjaga keterbatasan pernyataan teks dan tidak memasukkan penafsiran mengenai pemberinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif-apokaliptik. Susunan kalimat mempertahankan gerak keluar dari asap, bentuk pasif, serta pengulangan istilah kunci tanpa terasa kaku.
