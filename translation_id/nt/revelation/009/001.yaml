    reason: alternative_reading
  - marker: b
    text: 'Secara harfiah: “kunci lubang jurang raya”; φρέαρ dapat berarti lubang, sumur, atau poros yang menjadi jalan masuk ke jurang raya.'
    reason: lexical_alternative
