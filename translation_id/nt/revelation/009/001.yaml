id: REV.9.1
reference: Revelation 9:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ὁ πέμπτος ἄγγελος ἐσάλπισεν· καὶ εἶδον ἀστέρα ἐκ τοῦ οὐρανοῦ πεπτωκότα εἰς τὴν γῆν, καὶ ἐδόθη αὐτῷ ἡ κλεὶς τοῦ φρέατος τῆς ἀβύσσου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/001.yaml
  text: And the fifth angel sounded the trumpet[a], and I saw a star that had fallen from heaven to the earth[c][b], and the key to the shaft of the abyss was given to him.
translation:
  language: id
  text: Lalu malaikat yang kelima meniup sangkakala, dan aku melihat sebuah bintang yang telah jatuh dari surga ke bumi.[a] Kepadanya diberikan kunci lubang menuju jurang raya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bintang itu mungkin melambangkan makhluk berpribadi, sebab selanjutnya teks mengatakan bahwa kunci diberikan “kepadanya”.
    reason: alternative_reading
  - marker: b
    text: 'Secara harfiah: “kunci lubang jurang raya”; φρέαρ dapat berarti lubang, sumur, atau poros yang menjadi jalan masuk ke jurang raya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: meniup sangkakalanya
  rationale: Verba ini berarti membunyikan atau meniup sangkakala. Ungkapan Indonesia ini alami dan mempertahankan gambaran sangkakala; akhiran -nya merujuk pada sangkakala malaikat tersebut.
- source_word: ἀστέρα
  choice: sebuah bintang
  rationale: Makna langsungnya ialah 'bintang'. Walaupun dalam penglihatan apokaliptik ini bintang tersebut mungkin melambangkan makhluk berpribadi, gambaran teks dipertahankan tanpa memasukkan identifikasi tertentu.
- source_word: πεπτωκότα
  choice: yang telah jatuh
  rationale: Partisipel perfek menyatakan kejatuhan yang sudah terjadi dengan keadaan yang masih berlangsung ketika Yohanes melihatnya.
- source_word: ἐκ τοῦ οὐρανοῦ ... εἰς τὴν γῆν
  choice: dari surga ke bumi
  rationale: Dalam latar penglihatan kitab Wahyu, 'surga' lebih sesuai daripada sekadar 'langit', dan frasa ini mempertahankan kontras kosmis dengan bumi.
- source_word: ἐδόθη αὐτῷ
  choice: Kepadanya diberikan
  rationale: Bentuk pasif dipertahankan agar tidak menyebutkan pemberi yang tidak dinyatakan dalam bahasa Yunani.
- source_word: ἡ κλεὶς
  choice: kunci
  rationale: Nomina tertentu ini menunjuk pada kunci yang memberi akses; bahasa Indonesia tidak memerlukan kata sandang tersendiri untuk menyampaikan hal tersebut.
- source_word: τοῦ φρέατος τῆς ἀβύσσου
  choice: lubang menuju jurang maut
  rationale: φρέαρ menunjuk pada lubang atau poros akses, sedangkan ἄβυσσος menunjuk pada jurang/dunia bawah yang dalam. 'Lubang menuju jurang maut' membedakan jalan masuk dari jurang itu sendiri dan lebih alami daripada susunan genitif harfiah.
theological_decisions:
- issue: Apakah 'bintang' perlu diidentifikasi sebagai malaikat atau Iblis
  choice: Mempertahankan 'bintang' tanpa identifikasi interpretatif
  alternative: makhluk malaikat; tokoh yang bersifat satanis
  rationale: Ayat ini memakai citra bintang lalu merujuk kepadanya sebagai sosok yang menerima kunci, tetapi tidak menyatakan identitasnya secara eksplisit.
- issue: Apakah pelaku yang memberikan kunci perlu disebut sebagai Allah
  choice: Mempertahankan bentuk pasif tanpa menyebut pemberi
  alternative: Allah memberikan kepadanya kunci
  rationale: Bahasa Yunani tidak menyebut pelakunya. Bentuk pasif mempertahankan ketidaktersuratan itu serta nuansa izin atau kedaulatan ilahi tanpa menjadikannya eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat dibuat alami bagi pembaca umum sambil mempertahankan urutan penglihatan, aspek perfek pada 'telah jatuh', citra 'bintang', serta bentuk pasif teologis.
