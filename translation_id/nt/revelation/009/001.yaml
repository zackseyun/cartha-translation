- from: Lalu malaikat yang kelima meniup sangkakalanya, dan aku melihat sebuah bintang yang telah jatuh dari surga ke bumi.[a] Kepadanya diberikan kunci lubang menuju jurang maut.[b]
  to: Lalu malaikat yang kelima meniup sangkakala, dan aku melihat sebuah bintang yang telah jatuh dari surga ke bumi.[a] Kepadanya diberikan kunci lubang menuju jurang raya.[b]
  rationale: The revision removes an unstated possessive and uses a more source-neutral equivalent for ἄβυσσος. It otherwise preserves the draft's accurate tense, imagery, passive construction, register, and footnote anchors.
