revisions:
- from: Dan kepada mereka diberikan kuasa untuk tidak membunuh orang-orang itu, melainkan supaya orang-orang itu disiksa selama lima bulan. Siksaan yang mereka timbulkan seperti siksaan akibat sengatan kalajengking ketika menyengat seseorang.
  to: Dan kepada mereka diberikan bahwa mereka tidak membunuh orang-orang itu, melainkan bahwa orang-orang itu disiksa selama lima bulan. Siksaan yang mereka timbulkan itu seperti siksaan kalajengking ketika kalajengking itu menyerang seseorang.
  rationale: Revisi menghilangkan nomina tambahan “kuasa” agar pasif ἐδόθη dan ketidakjelasan mengenai pemberi tetap terpelihara. Rujukan jamak tetap diperjelas sebagai “mereka” (para agen) dan “orang-orang itu” (sasaran). Pada kalimat kedua, pengulangan “siksaan” dipulihkan dan “menyerang” dipakai sebagai padanan utama untuk παίω; “menyengat” tetap tersedia sebagai alternatif kontekstual dalam catatan kaki.
