id: REV.9.5
reference: Revelation 9:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐδόθη ⸀αὐτοῖς ἵνα μὴ ἀποκτείνωσιν αὐτούς, ἀλλ’ ἵνα ⸀βασανισθήσονται μῆνας πέντε· καὶ ὁ βασανισμὸς αὐτῶν ὡς βασανισμὸς σκορπίου, ὅταν παίσῃ ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/005.yaml
  text: And it was given to them that they should not kill them[a], but that they should be tormented for five months[b]; and their torment was like the torment of a scorpion when it strikes a man.
translation:
  language: id
  text: Dan kepada mereka diberikan bahwa mereka tidak membunuh orang-orang itu, melainkan bahwa orang-orang itu disiksa selama lima bulan. Siksaan yang mereka timbulkan itu seperti siksaan kalajengking ketika kalajengking itu menyerang seseorang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδόθη αὐτοῖς
  choice: kepada mereka diberikan kuasa
  rationale: Mempertahankan bentuk pasif yang tidak menyebutkan pemberi, sedangkan 'kuasa' melengkapi idiom bahasa Indonesia dan menyatakan izin atau wewenang yang tersirat dalam konteks.
- source_word: ἵνα μὴ ἀποκτείνωσιν αὐτούς
  choice: untuk tidak membunuh orang-orang itu
  rationale: Menyampaikan isi atau tujuan dari kuasa yang diberikan dan membedakan dua kelompok yang sama-sama dirujuk dengan pronomina jamak dalam bahasa Yunani.
- source_word: ἀλλ’ ἵνα βασανισθήσονται μῆνας πέντε
  choice: melainkan supaya orang-orang itu disiksa selama lima bulan
  rationale: Bentuk pasif dan arah tujuan/hasil dipertahankan; 'selama' menyatakan akusatif durasi secara alami.
- source_word: ὁ βασανισμὸς αὐτῶν
  choice: siksaan yang mereka timbulkan
  rationale: Dalam konteks, genitif tersebut menunjuk pada siksaan yang berkaitan dengan para agen, yakni yang mereka timbulkan; ungkapan ini mencegah salah pengertian bahwa merekalah yang disiksa.
- source_word: ὡς βασανισμὸς σκορπίου
  choice: seperti siksaan akibat sengatan kalajengking
  rationale: Menyampaikan perbandingan dan rasa sakit yang dimaksud secara alami dalam bahasa Indonesia, sesuai tindakan khas kalajengking.
- source_word: ὅταν παίσῃ ἄνθρωπον
  choice: ketika menyengat seseorang
  rationale: παίω secara dasar berarti memukul atau menyerang, tetapi dengan subjek kalajengking tindakan kontekstualnya ialah menyengat; ἄνθρωπον bersifat generik sehingga 'seseorang' tepat dan alami.
theological_decisions:
- issue: Pasif ilahi dalam penghakiman apokaliptik
  choice: Mempertahankan bentuk pasif 'kepada mereka diberikan kuasa' tanpa menyebut Allah sebagai pemberi.
  alternative: Allah memberi mereka kuasa; mereka diizinkan
  rationale: Teks Yunani tidak menyebut pelakunya. Bentuk pasif mempertahankan ketegangan antara kedaulatan ilahi dan penghakiman melalui perantara tanpa menambahkan penafsiran.
- issue: Relasi genitif dalam ὁ βασανισμὸς αὐτῶν
  choice: siksaan yang mereka timbulkan
  alternative: siksaan mereka
  rationale: Konteks menunjukkan bahwa para agen menimbulkan siksaan atas manusia; bentuk eksplisit ini menghindari ambiguitas pronominal Indonesia yang dapat menyiratkan bahwa para agen mengalami siksaan.
- issue: Arti generik ἄνθρωπον
  choice: seseorang
  alternative: seorang manusia; seorang laki-laki
  rationale: ἄνθρωπον di sini merujuk secara umum kepada manusia yang disengat, bukan khusus kepada laki-laki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur pasif serta tujuan/hasil teks Yunani dipertahankan, tetapi rujukan pronomina diperjelas agar mudah dipahami. Tidak diperlukan catatan kaki karena pilihan kontekstual 'menyengat' dan arti generik 'seseorang' dapat dinyatakan langsung dengan wajar.
