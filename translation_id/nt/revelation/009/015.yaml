id: REV.9.15
reference: Revelation 9:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐλύθησαν οἱ τέσσαρες ἄγγελοι οἱ ἡτοιμασμένοι εἰς τὴν ὥραν ⸀καὶ ἡμέραν καὶ μῆνα καὶ ἐνιαυτόν, ἵνα ἀποκτείνωσιν τὸ τρίτον τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/015.yaml
  text: And the four angels who had been prepared for the hour and day and month and year were released[b][a], so that they might kill a third of humanity.
translation:
  language: id
  text: Keempat malaikat yang telah dipersiapkan untuk jam, hari, bulan, dan tahun itu pun dilepaskan supaya mereka membunuh sepertiga umat manusia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλύθησαν
  choice: dilepaskan
  rationale: Bentuk aoristus pasif dari λύω. Karena para malaikat itu sebelumnya terikat (ayat 14), “dilepaskan” wajar dalam bahasa Indonesia modern dan mempertahankan makna pasifnya.
- source_word: ἄγγελοι
  choice: malaikat
  rationale: Dalam konteks apokaliptik Wahyu, yang dimaksud ialah makhluk adikodrati, bukan utusan manusia.
- source_word: ἡτοιμασμένοι
  choice: yang telah dipersiapkan
  rationale: Partisipel perfek pasif menyatakan bahwa persiapan telah dilakukan sebelumnya dan mereka berada dalam keadaan siap.
- source_word: εἰς τὴν ὥραν καὶ ἡμέραν καὶ μῆνα καὶ ἐνιαυτόν
  choice: untuk jam, hari, bulan, dan tahun itu
  rationale: Urutan satuan waktu dipertahankan untuk menyampaikan ketepatan waktu yang kumulatif. Kata “itu” secara alami mencerminkan artikel Yunani yang menaungi rangkaian tersebut tanpa menentukan apakah frasa ini menunjuk saat tertentu atau rentang waktu.
- source_word: ἵνα
  choice: supaya
  rationale: Mengungkapkan tujuan tindakan secara alami dan jelas dalam bahasa Indonesia.
- source_word: ἀποκτείνωσιν
  choice: mereka membunuh
  rationale: Bentuk subjunktif di bawah ἵνα menyatakan tindakan yang dituju; “membunuh” merupakan padanan kontemporer yang langsung.
- source_word: τὸ τρίτον τῶν ἀνθρώπων
  choice: sepertiga umat manusia
  rationale: τὸ τρίτον merupakan ungkapan partitif, sedangkan ἀνθρώπων merujuk kepada manusia secara umum, bukan khusus laki-laki. “Umat manusia” menyampaikan cakupan kolektif dengan jelas.
theological_decisions:
- issue: Rujukan dan daya ungkap frasa “jam, hari, bulan, dan tahun”
  choice: Terjemahan mempertahankan rangkaian satuan waktu sebagai waktu yang telah ditentukan secara tepat.
  alternative: Frasa itu dapat dipahami sebagai rentang sepanjang satu tahun, satu bulan, satu hari, dan satu jam.
  rationale: Susunan Yunani paling alami menekankan penetapan waktu secara saksama, tetapi terjemahan tidak menambahkan kata seperti “tepat” atau “yang ditetapkan Allah,” sehingga kemungkinan penafsiran apokaliptik tidak diselesaikan secara berlebihan.
- issue: Cakupan ἀνθρώπων
  choice: umat manusia
  alternative: orang-orang; manusia
  rationale: Kata tersebut bersifat generik dan mencakup manusia secara umum, bukan hanya laki-laki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya yang lugas dan bermartabat. Susunan dibuka dengan subjek agar alami, sementara kata “pun” mempertahankan daya naratif καί. Istilah apokaliptik dan ketegangan dalam frasa waktunya dipertahankan tanpa memasukkan skema kronologis tertentu.
