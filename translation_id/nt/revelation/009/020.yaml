  to: Sisa umat manusia, yaitu mereka yang tidak terbunuh oleh tulah-tulah ini, bahkan tidak bertobat dari perbuatan tangan mereka[a], agar mereka tidak menyembah[b] roh-roh jahat dan berhala-berhala dari emas, perak, perunggu, batu, dan kayu—berhala-berhala yang tidak dapat melihat, mendengar, ataupun berjalan.
