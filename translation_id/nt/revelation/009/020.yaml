id: REV.9.20
reference: Revelation 9:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ οἱ λοιποὶ τῶν ἀνθρώπων, οἳ οὐκ ἀπεκτάνθησαν ἐν ταῖς πληγαῖς ταύταις, ⸀οὐδὲ μετενόησαν ἐκ τῶν ἔργων τῶν χειρῶν αὐτῶν, ἵνα μὴ ⸀προσκυνήσουσιν τὰ δαιμόνια καὶ τὰ εἴδωλα τὰ χρυσᾶ καὶ τὰ ἀργυρᾶ καὶ τὰ χαλκᾶ καὶ τὰ λίθινα καὶ τὰ ξύλινα, ἃ οὔτε βλέπειν ⸀δύνανται οὔτε ἀκούειν οὔτε περιπατεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/020.yaml
  text: And the rest of humanity[a], who were not killed by these plagues, did not even repent of the works of their hands, so as not to worship demons and the idols of gold and silver and bronze and stone and wood[c][b], which can neither see nor hear nor walk.
translation:
  language: id
  text: Sisa umat manusia, yaitu mereka yang tidak terbunuh oleh tulah-tulah ini, bahkan tidak bertobat dari perbuatan tangan mereka[a], agar mereka tidak menyembah[b] roh-roh jahat dan berhala-berhala dari emas, perak, perunggu, batu, dan kayu—berhala-berhala yang tidak dapat melihat, mendengar, ataupun berjalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “perbuatan tangan mereka”; dalam konteks ini terutama menunjuk kepada apa yang mereka buat lalu sembah.
    reason: lexical_alternative
  - marker: b
    text: Atau, “sehingga mereka tidak menyembah.” Klausa Yunani dapat menyatakan tujuan atau hasil yang dimaksudkan.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ λοιποὶ τῶν ἀνθρώπων
  choice: umat manusia selebihnya
  rationale: Frasa ini menunjuk secara kolektif kepada manusia lain yang masih hidup; ἀνθρώπων bersifat generik dan tidak khusus menunjuk laki-laki.
- source_word: ἀπεκτάνθησαν
  choice: tidak terbunuh
  rationale: Bentuk pasif aoris dari ἀποκτείνω secara langsung menyatakan bahwa mereka tidak dibunuh atau terbunuh.
- source_word: πληγαῖς
  choice: tulah-tulah
  rationale: Dalam konteks Wahyu, πληγή menunjuk kepada rangkaian hukuman dahsyat; 'tulah' mempertahankan nuansa tersebut tanpa membatasinya pada wabah penyakit.
- source_word: οὐδὲ μετενόησαν
  choice: bahkan tidak bertobat
  rationale: 'οὐδέ menambahkan penegasan: walaupun tidak terbunuh oleh tulah-tulah itu, mereka tetap tidak bertobat.'
- source_word: ἐκ τῶν ἔργων τῶν χειρῶν αὐτῶν
  choice: dari hasil pekerjaan tangan mereka
  rationale: '''Bertobat dari'' mencerminkan ἐκ, sedangkan ''hasil pekerjaan tangan'' mempertahankan gambaran konkret tentang apa yang mereka buat, khususnya berhala dalam konteks ini.'
- source_word: ἵνα μὴ προσκυνήσουσιν
  choice: agar tidak lagi menyembah
  rationale: 'Ungkapan ini mempertahankan hubungan tujuan atau hasil yang dimaksudkan: pertobatan akan berarti berhenti dari penyembahan tersebut. ''Tidak lagi'' membuat implikasi penghentian praktik yang sedang berlangsung menjadi wajar dalam bahasa Indonesia.'
- source_word: τὰ δαιμόνια
  choice: roh-roh jahat
  rationale: δαιμόνια menunjuk kepada makhluk-makhluk rohani yang jahat. 'Roh-roh jahat' merupakan padanan Indonesia yang jelas dan alami.
- source_word: τὰ εἴδωλα
  choice: berhala-berhala
  rationale: Dalam konteks ibadah, εἴδωλα adalah benda-benda yang disembah, bukan sekadar gambar atau patung netral.
- source_word: τὰ χρυσᾶ καὶ τὰ ἀργυρᾶ καὶ τὰ χαλκᾶ καὶ τὰ λίθινα καὶ τὰ ξύλινα
  choice: dari emas, perak, perunggu, batu, dan kayu
  rationale: Daftar bahan ini mempertahankan susunan kumulatif teks Yunani. χαλκᾶ paling sesuai diterjemahkan 'perunggu' dalam daftar bahan berhala.
- source_word: ἃ οὔτε βλέπειν δύνανται οὔτε ἀκούειν οὔτε περιπατεῖν
  choice: yang tidak dapat melihat, mendengar, ataupun berjalan
  rationale: Terjemahan ini mempertahankan tiga kemampuan yang disangkal oleh teks dan sindiran terhadap ketidakberdayaan berhala.
theological_decisions:
- issue: Hubungan pertobatan dengan penghentian penyembahan berhala dalam ἵνα μὴ προσκυνήσουσιν
  choice: agar tidak lagi menyembah
  alternative: sehingga mereka tidak lagi menyembah
  rationale: ἵνα μή dapat menyatakan tujuan atau hasil yang dimaksudkan. Terjemahan utama mempertahankan nuansa tujuan tanpa menetapkan teori teologis tertentu mengenai pertobatan; catatan kaki mencatat kemungkinan nuansa hasil.
- issue: Identitas τὰ δαιμόνια
  choice: roh-roh jahat
  alternative: setan-setan
  rationale: Pilihan ini menyatakan sifat jahat makhluk rohani yang dimaksud tanpa memasukkan rincian hierarki atau demonologi yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Tulah-tulah' dipertahankan sebagai istilah yang lazim bagi hukuman apokaliptis, sementara pengulangan 'berhala-berhala' sesudah tanda pisah memperjelas anteseden klausa relatif dalam bahasa Indonesia.
