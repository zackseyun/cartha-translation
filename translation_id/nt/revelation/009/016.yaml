  text: καὶ ὁ ἀριθμὸς τῶν στρατευμάτων τοῦ ⸀ἱππικοῦ ⸀δισμυριάδες μυριάδων· ἤκουσα τὸν ἀριθμὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/016.yaml
  text: And the number of the troops of the cavalry was two hundred million; I heard their number.
translation:
  language: id
  text: Jumlah pasukan berkuda itu dua ratus juta[a]; aku mendengar jumlah mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Yunani, “dua kali sepuluh ribu kali sepuluh ribu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀριθμὸς
  choice: jumlah
  rationale: Kata ini menyatakan jumlah atau total; pengulangannya dipertahankan sesuai dengan teks Yunani.
- source_word: στρατευμάτων
  choice: pasukan
  rationale: Bentuk jamak ini menunjuk pada satuan atau kekuatan militer; 'pasukan' alami dalam bahasa Indonesia dan cocok dengan frasa berikutnya.
- source_word: ἱππικοῦ
  choice: berkuda
  rationale: Bentuk substantival ini menunjuk pada angkatan berkuda atau kavaleri; dalam gabungan 'pasukan berkuda', maknanya jelas dan alami bagi pembaca modern.
- source_word: δισμυριάδες μυριάδων
  choice: dua ratus juta
  rationale: Ungkapan tersebut secara matematis menyatakan dua kali sepuluh ribu kali sepuluh ribu, yakni 200.000.000; angka hasilnya disampaikan dengan jelas, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: ἤκουσα
  choice: aku mendengar
  rationale: Aoristus naratif sederhana diterjemahkan langsung; 'aku' sesuai dengan suara narator Yohanes.
- source_word: αὐτῶν
  choice: mereka
  rationale: Pronomina ini merujuk kembali kepada pasukan berkuda; 'jumlah mereka' alami dan mempertahankan pengulangan teks sumber.
theological_decisions: []
