id: REV.9.4
reference: Revelation 9:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐρρέθη αὐταῖς ἵνα μὴ ⸀ἀδικήσουσιν τὸν χόρτον τῆς γῆς οὐδὲ πᾶν χλωρὸν οὐδὲ πᾶν δένδρον, εἰ μὴ τοὺς ἀνθρώπους οἵτινες οὐκ ἔχουσι τὴν σφραγῖδα τοῦ θεοῦ ἐπὶ τῶν ⸀μετώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/004.yaml
  text: And they were told not to harm the grass of the earth[a], or any green thing, or any tree, but only the people who do not have the seal of God on their foreheads.
translation:
  language: id
  text: Mereka diberi tahu agar tidak merusak rumput di bumi, apa pun yang hijau, atau pohon apa pun, melainkan hanya manusia yang tidak memiliki meterai Allah pada dahi mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρρέθη αὐταῖς
  choice: Mereka diberi tahu
  rationale: Bentuk pasif λέγω dengan pronomina datif diterjemahkan secara alami tanpa menyebut pihak yang berbicara atau melebihkannya menjadi perintah eksplisit.
- source_word: ἵνα μὴ ἀδικήσουσιν
  choice: agar tidak merusak
  rationale: Dalam konteks penghukuman yang membedakan vegetasi dan manusia sebagai sasaran, ἀδικέω menyatakan tindakan mencelakakan atau merusak; 'merusak' sesuai bagi seluruh rangkaian objek.
- source_word: τὸν χόρτον τῆς γῆς
  choice: rumput di bumi
  rationale: χόρτος di sini menunjuk pada rumput atau vegetasi rendah, sedangkan genitif τῆς γῆς dinyatakan secara alami dengan 'di bumi'.
- source_word: οὐδὲ πᾶν χλωρόν
  choice: tumbuhan hijau apa pun
  rationale: χλωρόν adalah adjektiva yang digunakan secara substantif, secara harfiah 'apa pun yang hijau'; dalam rangkaian rumput dan pohon, 'tumbuhan hijau' menyampaikan rujukan vegetasinya dengan jelas tanpa membatasinya pada jenis tertentu.
- source_word: οὐδὲ πᾶν δένδρον
  choice: ataupun pohon apa pun
  rationale: Padanan langsung dan alami bagi δένδρον, dengan πᾶν diterjemahkan 'apa pun'.
- source_word: εἰ μὴ
  choice: tetapi hanya
  rationale: Frasa ini memperkenalkan satu-satunya sasaran yang diizinkan untuk dicelakakan, bukan syarat hipotetis.
- source_word: τοὺς ἀνθρώπους
  choice: manusia
  rationale: ἄνθρωποι merujuk kepada manusia secara umum dan tidak terbatas pada laki-laki.
- source_word: οἵτινες οὐκ ἔχουσι
  choice: yang tidak memiliki
  rationale: Klausa relatif ini diterjemahkan secara lugas dan alami.
- source_word: τὴν σφραγῖδα τοῦ θεοῦ
  choice: meterai Allah
  rationale: σφραγίς berarti meterai dan mempertahankan citra penting tentang tanda kepemilikan atau perlindungan ilahi tanpa menafsirkannya lebih lanjut.
- source_word: ἐπὶ τῶν μετώπων
  choice: pada dahi mereka
  rationale: ἐπί dengan bentuk genitif di sini menyatakan letak; 'mereka' memperjelas bahwa dahi itu milik manusia yang disebut sebelumnya.
theological_decisions:
- issue: Cakupan ἀνθρώπους
  choice: manusia secara umum
  alternative: laki-laki saja
  rationale: Konteks mempertentangkan vegetasi dengan umat manusia yang memiliki atau tidak memiliki meterai Allah; tidak ada pembatasan jenis kelamin dalam teks.
- issue: Pelaku dalam bentuk pasif ἐρρέθη
  choice: pelaku tidak disebutkan
  alternative: menyatakan secara eksplisit bahwa Allah memerintah mereka
  rationale: Teks Yunani membiarkan pihak yang berbicara tetap tersirat. Terjemahan mempertahankan hal itu meskipun konteks menunjukkan otoritas ilahi.
- issue: Makna meterai Allah
  choice: mempertahankan ungkapan simbolis tanpa penjelasan doktrinal tambahan
  alternative: menguraikannya secara eksplisit sebagai keselamatan, kepemilikan, atau perlindungan Allah
  rationale: Ayat ini menyebut tanda tersebut tetapi tidak menjabarkan seluruh makna teologisnya; ketegangan simbolis dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan bentuk pasif dan rangkaian larangan sumber, sambil memakai koordinasi yang alami. Tidak diperlukan catatan kaki karena 'tumbuhan hijau apa pun' cukup dekat dengan ungkapan substantif πᾶν χλωρόν dan jelas dalam konteks.
