  text: καὶ εἶχον θώρακας ὡς θώρακας σιδηροῦς, καὶ ἡ φωνὴ τῶν πτερύγων αὐτῶν ὡς φωνὴ ἁρμάτων ἵππων πολλῶν τρεχόντων εἰς πόλεμον·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/009.yaml
  text: And they had breastplates like iron breastplates[a], and the sound of their wings was like the sound of many chariots with horses rushing into battle.
translation:
  language: id
  text: Mereka memakai pelindung dada seperti pelindung dada dari besi, dan bunyi sayap mereka seperti bunyi kereta-kereta yang ditarik oleh banyak kuda yang berlari menuju perang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “seperti bunyi kereta-kereta dari banyak kuda yang berlari menuju perang.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: θώρακας
  choice: pelindung dada
  rationale: Istilah ini menunjuk pada zirah yang melindungi dada atau tubuh bagian atas; “pelindung dada” tepat dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: ὡς θώρακας σιδηροῦς
  choice: seperti pelindung dada dari besi
  rationale: “Seperti” mempertahankan perbandingan yang ditandai ὡς, sedangkan “dari besi” menyampaikan bahan pelindung dada secara alami.
- source_word: φωνὴ
  choice: bunyi
  rationale: Dalam konteks sayap dan kereta, φωνή merujuk pada kesan yang terdengar, bukan suara manusia.
- source_word: πτερύγων
  choice: sayap
  rationale: Padanan langsung dan wajar bagi πτέρυξ.
- source_word: ἁρμάτων ἵππων πολλῶν
  choice: kereta-kereta yang ditarik banyak kuda
  rationale: Ungkapan ini mempertahankan kereta dan banyak kuda secara eksplisit serta mencerminkan hubungan genitif Yunani tanpa menghilangkan ketaksaan jumlah kereta.
- source_word: τρεχόντων
  choice: melaju
  rationale: Dalam gambaran kereta, “melaju” menyampaikan gerak cepat secara idiomatis tanpa menambahkan gagasan serbuan yang tidak dinyatakan langsung.
- source_word: εἰς πόλεμον
  choice: ke medan perang
  rationale: Padanan ini alami untuk gerakan menuju pertempuran dan mempertahankan nuansa militer πόλεμος.
theological_decisions:
- issue: Sifat gambaran dalam penglihatan Yohanes
  choice: Mempertahankan rangkaian perumpamaan penglihatan secara langsung tanpa mengidentifikasi makhluk atau kereta dengan entitas tertentu.
  alternative: Menafsirkannya dalam teks sebagai mesin perang harfiah, roh jahat, atau pasukan simbolis tertentu.
  rationale: ὡς secara eksplisit menandai perbandingan. Terjemahan perlu mempertahankan gambaran apokaliptik dan ketegangan penafsirannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Memakai” menyampaikan εἶχον secara alami dalam konteks perlengkapan tubuh. Catatan kaki mempertahankan susunan genitif dan verba Yunani yang lebih harfiah.
