  - severity: low
    issue: “Ke medan perang” sedikit mempersempit πόλεμον.
    rationale: πόλεμον berarti “perang”; “medan perang” dapat dipahami sebagai lokasi pertempuran. “Menuju perang” mempertahankan cakupan istilah Yunani dengan lebih dekat.
