    issue: Simile dibuat terlalu spesifik
    rationale: Frasa “seperti ekor kalajengking” menambahkan nomina “ekor” pada sisi pembanding. Yunani hanya menyatakan “ekor seperti kalajengking”; konteks memang dapat mengarahkan pembaca kepada ekor kalajengking, tetapi terjemahan tidak perlu menetapkan hal itu secara eksplisit.
  - severity: low
    issue: Pilihan “penyengat” kurang tepat secara leksikal dan idiomatis
    rationale: κέντρα dalam konteks ini adalah sengat/ujung tajam. “Sengat” lebih langsung dan alami dalam bahasa Indonesia.
  revised_text: Mereka mempunyai ekor seperti kalajengking dan sengat; di dalam ekor mereka terdapat kuasa untuk mencelakakan manusia selama lima bulan.
