  text: καὶ ἔχουσιν οὐρὰς ὁμοίας σκορπίοις καὶ κέντρα, καὶ ἐν ταῖς οὐραῖς αὐτῶν ⸂ἡ ἐξουσία αὐτῶν⸃ ἀδικῆσαι τοὺς ἀνθρώπους μῆνας πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/010.yaml
  text: And they have tails like scorpions[a], and stingers; and in their tails is their power to harm people for five months.
translation:
  language: id
  text: Mereka mempunyai ekor seperti kalajengking dan sengat; di dalam ekor mereka terdapat kuasa untuk mencelakakan manusia selama lima bulan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐρὰς ὁμοίας σκορπίοις
  choice: ekor seperti ekor kalajengking
  rationale: ὅμοιος dengan datif menyatakan kemiripan. Pengulangan 'ekor' memperjelas bahwa yang dibandingkan ialah ekor mereka dengan ekor kalajengking, sesuai konteks, tanpa mengubah citra penglihatan.
- source_word: κέντρα
  choice: penyengat
  rationale: Dalam citra kalajengking, κέντρον menunjuk pada alat atau ujung tajam untuk menyengat; 'penyengat' merupakan istilah konkret dan alami dalam bahasa Indonesia.
- source_word: ἐξουσία
  choice: kuasa
  rationale: Istilah ini dapat menyatakan wewenang maupun kemampuan efektif. 'Kuasa' mempertahankan keluasan makna itu dalam konteks kemampuan mereka mencelakakan manusia.
- source_word: ἀδικῆσαι
  choice: untuk mencelakakan
  rationale: Dalam konteks tulah apokaliptik ini, verba tersebut berarti mendatangkan celaka atau bahaya, bukan terutama berbuat tidak adil secara abstrak.
- source_word: τοὺς ἀνθρώπους
  choice: manusia
  rationale: ἄνθρωποι di sini bersifat generik dan merujuk kepada manusia secara umum; 'manusia' alami, tepat, dan tidak membatasi rujukan pada laki-laki.
- source_word: μῆνας πέντε
  choice: selama lima bulan
  rationale: Akusatif ini menyatakan rentang waktu; 'selama' membuat fungsi duratifnya jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna ἐξουσία dalam gambaran tulah apokaliptik
  choice: kuasa
  alternative: wewenang
  rationale: '''Kuasa'' menyampaikan kemampuan efektif untuk mencelakakan tanpa meniadakan kemungkinan bahwa kuasa itu diberikan atau diizinkan dalam kerangka penglihatan.'
- issue: Cakupan τοὺς ἀνθρώπους
  choice: manusia
  alternative: orang-orang
  rationale: Bentuk Yunani merujuk secara generik kepada umat manusia, sehingga terjemahan tidak dibuat khusus laki-laki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya yang lugas dan bermartabat. Struktur kalimat dipecah menjadi dua agar alami dan jelas, sementara seluruh unsur sumber tetap dipertahankan.
