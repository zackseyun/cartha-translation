review_pass:
  verdict: revise
  source_fidelity: Draf dengan tepat menerjemahkan ἐξουσία sebagai “kuasa,” ἀδικῆσαι sebagai “mencelakakan,” τοὺς ἀνθρώπους secara generik sebagai “manusia,” serta durasi “selama lima bulan.” Namun, “ekor seperti ekor kalajengking” mempersempit simile Yunani ὁμοίας σκορπίοις (“seperti kalajengking”) menjadi perbandingan khusus dengan ekor kalajengking. Sumber tidak menyatakan kata kedua “ekor,” dan audit bahasa Inggris secara tepat mempertahankan ketidakspesifikan itu.
  naturalness: Bahasa draf umumnya baku dan jelas. “Sengat” lebih idiomatis daripada “penyengat” untuk κέντρα dalam gambaran anatomis ini; “penyengat” lebih lazim berarti alat atau makhluk yang menyengat. Kalimat majemuk dengan titik koma mempertahankan alur sumber secara alami.
  terminology: “Kuasa,” “mencelakakan,” dan “manusia” sesuai konteks apokaliptik serta pemakaian modern baku. “Sengat” menyampaikan ujung/alat sengat tanpa mengubah gambaran menjadi pelaku.
  issues:
