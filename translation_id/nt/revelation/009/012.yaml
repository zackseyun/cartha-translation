  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἡ οὐαὶ ἡ μία ἀπῆλθεν· ἰδοὺ ἔρχεται ἔτι δύο οὐαὶ μετὰ ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/012.yaml
  text: The first woe has passed[a]. Behold[b], two woes are still coming after these things.
translation:
  language: id
  text: Celaka yang pertama sudah berlalu.[a] Lihatlah, masih ada dua celaka lagi yang akan datang sesudah semuanya ini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Celaka yang satu sudah berlalu”; dalam konteks, yang dimaksud ialah celaka pertama dalam suatu rangkaian.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Lihatlah, dua celaka lagi akan datang sesudah semuanya ini.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαί
  choice: celaka
  rationale: Dalam konteks apokaliptik, kata ini menandai seruan sekaligus malapetaka penghukuman. “Celaka” mempertahankan gema formula penghukuman tanpa mereduksinya menjadi sekadar peristiwa buruk.
- source_word: ἡ μία
  choice: yang pertama
  rationale: Secara harfiah berarti “yang satu,” tetapi dalam konteks rangkaian tiga celaka ungkapan ini berfungsi secara ordinal; “yang pertama” paling alami dan jelas dalam bahasa Indonesia.
- source_word: ἀπῆλθεν
  choice: sudah berlalu
  rationale: Bentuk aoristus menyatakan bahwa celaka pertama telah selesai. “Sudah berlalu” merupakan ungkapan Indonesia yang alami untuk berakhirnya suatu masa atau peristiwa.
- source_word: ἰδού
  choice: Lihatlah
  rationale: Mempertahankan fungsi penanda wacana yang menarik perhatian secara mendesak, dengan ragam yang sesuai bagi nubuat apokaliptik.
- source_word: ἔρχεται
  choice: akan datang
  rationale: Walaupun verba Yunani berbentuk tunggal dengan subjek jamak, maknanya menunjuk pada kedatangan dua celaka. Bentuk “akan datang” alami dalam bahasa Indonesia dan menyampaikan orientasi ke depan.
- source_word: ἔτι
  choice: masih ada ... lagi
  rationale: Konstruksi Indonesia ini menyampaikan bahwa dua celaka tambahan tetap tersisa dan akan datang.
- source_word: μετὰ ταῦτα
  choice: sesudah semuanya ini
  rationale: Mempertahankan bentuk demonstratif jamak dan urutan temporal dalam teks; “semuanya ini” merujuk secara alami pada rangkaian kejadian yang baru digambarkan.
theological_decisions:
- issue: Urutan apokaliptik tiga celaka
  choice: Ayat ini menandai selesainya celaka pertama dan akan datangnya dua celaka tambahan.
  alternative: Menerjemahkan οὐαί secara longgar hanya sebagai “bencana” atau “penghukuman.”
  rationale: Pengulangan “celaka” dan penggunaan “yang pertama” mempertahankan struktur sastra dan ketegangan rangkaian penghukuman dalam penglihatan Yohanes tanpa menambahkan rincian tafsiran.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mendesak yang sesuai dengan sastra apokaliptik. “Lihatlah” mempertahankan daya retoris ἰδού, sedangkan “celaka” mempertahankan formula penghukuman yang berulang.
