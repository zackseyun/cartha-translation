source:
  edition: SBLGNT
  text: Καὶ τὰ ὁμοιώματα τῶν ἀκρίδων ὅμοια ἵπποις ἡτοιμασμένοις εἰς πόλεμον, καὶ ἐπὶ τὰς κεφαλὰς αὐτῶν ὡς στέφανοι ⸂ὅμοιοι χρυσῷ⸃, καὶ τὰ πρόσωπα αὐτῶν ὡς πρόσωπα ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/007.yaml
  text: And the appearance of the locusts was like horses prepared for battle[a], and on their heads were what seemed to be crowns like gold, and their faces were like human faces[b],
translation:
  language: id
  text: Rupa belalang itu seperti kuda-kuda yang disiapkan untuk berperang. Di atas kepala mereka tampak sesuatu seperti mahkota-mahkota yang menyerupai emas[a], dan wajah mereka seperti wajah manusia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani untuk “mahkota” juga dapat berarti karangan atau mahkota kemenangan yang berkaitan dengan kehormatan atau kemenangan. Ungkapan “menyerupai emas” menyatakan kemiripan, bukan bahwa mahkota itu pasti terbuat dari emas.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “wajah manusia-manusia”; kata Yunani yang dipakai bersifat umum dan tidak secara khusus berarti laki-laki.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ὁμοιώματα τῶν ἀκρίδων
  choice: rupa belalang-belalang itu
  rationale: ὁμοιώματα menunjuk pada rupa atau penampilan dalam penglihatan, bukan identitas harfiah. Bentuk ulang 'belalang-belalang' wajar untuk kawanan yang anggotanya kemudian digambarkan dengan kata ganti jamak.
- source_word: ὅμοια ἵπποις ἡτοιμασμένοις εἰς πόλεμον
  choice: seperti kuda-kuda yang disiapkan untuk berperang
  rationale: Mempertahankan perbandingan ὅμοια dan keadaan siap yang dinyatakan oleh partisip perfek pasif ἡτοιμασμένοις. 'Berperang' menyampaikan konteks militer πόλεμον secara alami.
- source_word: ἐπὶ τὰς κεφαλὰς αὐτῶν
  choice: di atas kepala mereka
  rationale: Terjemahan spasial langsung dan alami dari ἐπί dengan akusatif dalam deskripsi penglihatan ini.
- source_word: ὡς στέφανοι ὅμοιοι χρυσῷ
  choice: tampak sesuatu seperti mahkota-mahkota yang menyerupai emas
  rationale: 'Mengungkapkan kedua penanda perbandingan: benda itu hanya tampak seperti mahkota, dan mahkota tersebut menyerupai emas; teks tidak menegaskan bahwa benda itu benar-benar mahkota atau terbuat dari emas.'
- source_word: τὰ πρόσωπα αὐτῶν ὡς πρόσωπα ἀνθρώπων
  choice: wajah mereka seperti wajah manusia
  rationale: πρόσωπα berarti wajah, sedangkan ἀνθρώπων bersifat generik dan paling tepat diterjemahkan 'manusia', bukan khusus laki-laki.
theological_decisions:
- issue: Bahasa perbandingan dalam gambaran apokaliptik
  choice: Mempertahankan berulangnya unsur kemiripan melalui 'seperti', 'tampak sesuatu seperti', dan 'menyerupai'
  alternative: Menjadikan gambaran lebih harfiah, misalnya 'di atas kepala mereka ada mahkota emas'
  rationale: ὅμοια dan ὡς berulang kali menyatakan kemiripan. Terjemahan tidak boleh menetapkan bahwa unsur-unsur penglihatan itu secara ontologis adalah kuda, mahkota, atau emas.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kalimat Yunani yang panjang dibagi menjadi dua kalimat agar mudah dipahami tanpa menghilangkan hubungan deskriptifnya. Bentuk jamak dipertahankan pada belalang, kuda, dan mahkota untuk mencerminkan banyaknya makhluk dalam penglihatan.
