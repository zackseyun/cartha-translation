id: REV.9.6
reference: Revelation 9:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐν ταῖς ἡμέραις ἐκείναις ζητήσουσιν οἱ ἄνθρωποι τὸν θάνατον καὶ οὐ μὴ εὑρήσουσιν αὐτόν, καὶ ἐπιθυμήσουσιν ἀποθανεῖν καὶ ⸀φεύγει ⸂ὁ θάνατος ἀπ’ αὐτῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/006.yaml
  text: And in those days people will seek death and will certainly not find it[a], and they will long to die, but death flees from them.
translation:
  language: id
  text: Dan pada hari-hari itu, orang-orang akan mencari maut, tetapi sama sekali tidak akan menemukannya. Mereka akan ingin sekali mati, tetapi maut lari dari mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: pada hari-hari itu
  rationale: Ungkapan waktu ini diterjemahkan secara langsung dan alami, dengan tetap mempertahankan penunjukan kepada masa tertentu dalam penglihatan tersebut.
- source_word: οἱ ἄνθρωποι
  choice: orang-orang
  rationale: Dalam konteks ini ἄνθρωποι mengacu secara umum kepada manusia, bukan hanya laki-laki. 'Orang-orang' merupakan padanan Indonesia modern yang tepat dan wajar.
- source_word: ζητήσουσιν
  choice: akan mencari
  rationale: Kata ini menyatakan usaha yang disengaja untuk memperoleh atau menemukan sesuatu; 'mencari' mempertahankan kesungguhan tindakan itu.
- source_word: τὸν θάνατον
  choice: maut
  rationale: '''Maut'' menyampaikan kematian dengan nada khidmat dan memungkinkan personifikasi pada akhir ayat dipertahankan secara alami.'
- source_word: οὐ μὴ εὑρήσουσιν αὐτόν
  choice: sama sekali tidak akan menemukannya
  rationale: Gabungan οὐ μή dengan bentuk mendatang merupakan penyangkalan yang kuat. 'Sama sekali tidak akan' mempertahankan penekanan itu tanpa memperluas maknanya.
- source_word: ἐπιθυμήσουσιν ἀποθανεῖν
  choice: akan ingin sekali mati
  rationale: ἐπιθυμέω menyatakan keinginan yang kuat. Susunan ini alami dalam bahasa Indonesia dan mempertahankan intensitasnya.
- source_word: φεύγει ὁ θάνατος ἀπ’ αὐτῶν
  choice: maut lari dari mereka
  rationale: Bentuk kini φεύγει memberi gambaran dramatis dan menjadikan maut sebagai pelaku. Terjemahan ini mempertahankan personifikasi tersebut secara langsung.
theological_decisions:
- issue: Personifikasi maut dalam penghakiman apokaliptis
  choice: 'Mempertahankan gambaran langsung: ''maut lari dari mereka.'''
  alternative: Menafsirkannya sebagai 'mereka tidak dapat mati.'
  rationale: Teks Yunani secara eksplisit menjadikan maut sebagai subjek kata kerja φεύγει. Personifikasi dipertahankan agar citra apokaliptis dan ketegangan teks tidak diratakan menjadi penjelasan.
- issue: Cakupan οἱ ἄνθρωποι
  choice: orang-orang
  alternative: laki-laki
  rationale: Walaupun bentuknya gramatikal maskulin, ἄνθρωποι lazim dipakai secara generik bagi manusia. Konteks tidak membatasi kelompok tersebut pada laki-laki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Maut' dipakai secara konsisten untuk menjaga personifikasi, sedangkan 'sama sekali tidak akan' menyampaikan penyangkalan Yunani yang sangat tegas.
