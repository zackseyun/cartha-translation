id: REV.9.19
reference: Revelation 9:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἡ γὰρ ἐξουσία τῶν ἵππων ἐν τῷ στόματι αὐτῶν ἐστιν καὶ ἐν ταῖς οὐραῖς αὐτῶν· αἱ γὰρ οὐραὶ αὐτῶν ὅμοιαι ⸀ὄφεσιν, ἔχουσαι κεφαλάς, καὶ ἐν αὐταῖς ἀδικοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/019.yaml
  text: For the power of the horses is in their mouths and in their tails[a]; for their tails are like serpents, having heads[b], and with them they do harm.
translation:
  language: id
  text: Sebab kuasa kuda-kuda itu terdapat pada mulut dan ekor mereka, sebab ekor-ekor mereka seperti ular dan masing-masing mempunyai kepala; dengan ekor-ekor itu mereka mendatangkan celaka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξουσία
  choice: kuasa
  rationale: Dalam penglihatan apokaliptik ini, kata tersebut menunjuk pada kemampuan efektif kuda-kuda itu untuk mencelakakan, sementara padanan “kuasa” tetap mempertahankan cakupan makna otoritas atau daya yang ada pada kata Yunani.
- source_word: στόματι
  choice: mulut
  rationale: Bahasa Yunani memakai bentuk tunggal secara distributif bersama pemilik jamak; bahasa Indonesia secara alami dapat memakai “mulut mereka” tanpa harus mengubahnya menjadi bentuk ulang.
- source_word: οὐραῖς / οὐραὶ
  choice: ekor / ekor-ekor
  rationale: “Ekor” adalah padanan langsung dan mempertahankan unsur penting dalam gambaran penglihatan. Bentuk ulang pada penyebutan terakhir memperjelas sarana yang dipakai untuk mencelakakan.
- source_word: ὅμοιαι ὄφεσιν
  choice: seperti ular
  rationale: “Ular” merupakan padanan modern dan wajar bagi ὄφις serta mempertahankan gambaran reptil tanpa menambahkan tafsiran simbolis.
- source_word: ἔχουσαι κεφαλάς
  choice: mempunyai kepala
  rationale: Frasa ini dipertahankan sebagai keterangan langsung tentang ekor-ekor tersebut, sesuai urutan gambaran Yunani.
- source_word: ἀδικοῦσιν
  choice: mendatangkan celaka
  rationale: Dalam konteks Wahyu, verba ini berarti menyebabkan kerugian atau cedera. “Mendatangkan celaka” dapat berdiri tanpa objek yang tidak disebutkan dalam teks Yunani.
- source_word: ἐν αὐταῖς
  choice: dengan ekor-ekor itu
  rationale: ἐν di sini paling wajar dipahami secara instrumental. Rujukan pronomina feminin jamaknya adalah ekor-ekor, sehingga rujukan itu dibuat jelas dalam bahasa Indonesia.
- source_word: γὰρ
  choice: sebab
  rationale: Kedua pemakaiannya bersifat menjelaskan. Pada kalimat kedua, hubungan penjelas tetap jelas dalam bahasa Indonesia meskipun “sebab” tidak diulang agar alurnya lebih alami.
theological_decisions:
- issue: Gambaran apokaliptik tentang ekor dan kepala kuda-kuda
  choice: Mengalihbahasakan gambaran itu secara langsung tanpa menafsirkannya sebagai lambang tertentu
  alternative: Menjelaskan ekor sebagai ajaran sesat atau kuasa roh jahat
  rationale: Teks hanya menyajikan gambaran dalam penglihatan; terjemahan tidak seharusnya memasukkan identifikasi teologis yang tidak dinyatakan oleh bahasa Yunani.
- issue: Pelaku dalam ἀδικοῦσιν
  choice: Mempertahankan “mereka” sebagai subjek dan menyebut ekor-ekor sebagai sarana
  alternative: Mengubah ekor-ekor menjadi pelaku eksplisit yang mencelakakan
  rationale: Bentuk verba Yunani tidak menandai gender, sehingga secara tata bahasa pelakunya tidak dinyatakan sejelas sarananya. Terjemahan mempertahankan pronomina jamak dan tidak memaksakan identifikasi tambahan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan “ekor-ekor” dipakai hanya pada bagian akhir untuk memperjelas rujukan, sedangkan gambaran visioner dan ketegangan gramatikal teks sumber dipertahankan tanpa alegorisasi.
