  terminology: “Kuasa,” “mulut,” “ekor,” “ular,” dan “mendatangkan celaka” sesuai konteks penglihatan apokaliptik. “Dengan ekor-ekor itu” secara tepat mengungkapkan fungsi instrumental ἐν αὐταῖς tanpa menambahkan penafsiran.
