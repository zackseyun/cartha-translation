id: REV.9.11
reference: Revelation 9:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂ἔχουσιν ἐπ’ αὐτῶν βασιλέα τὸν⸃ ἄγγελον τῆς ἀβύσσου· ὄνομα αὐτῷ Ἑβραϊστὶ Ἀβαδδών ⸂καὶ ἐν⸃ τῇ Ἑλληνικῇ ὄνομα ἔχει Ἀπολλύων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/011.yaml
  text: They have over them as king the angel of the abyss[a]. His name in Hebrew is Abaddon[c][b], and in Greek he has the name Apollyon.
translation:
  language: id
  text: Mereka mempunyai seorang raja yang berkuasa atas mereka, yaitu malaikat jurang maut[c]. Namanya dalam bahasa Ibrani ialah Abadon[a], dan dalam bahasa Yunani ia bernama Apolion[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Abadon adalah nama Ibrani yang berarti “Kebinasaan”.
    reason: lexical_alternative
  - marker: b
    text: Apolion adalah nama Yunani yang berarti “Pembinasa”.
    reason: lexical_alternative
  - marker: c
    text: 'Atau: jurang tanpa dasar.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχουσιν ἐπ’ αὐτῶν βασιλέα
  choice: Mereka mempunyai ... sebagai raja atas mereka
  rationale: Mempertahankan verba ‘mempunyai’ dan hubungan ‘atas mereka’ dari konstruksi Yunani, sambil menata unsur kalimat secara wajar dalam bahasa Indonesia.
- source_word: τὸν ἄγγελον τῆς ἀβύσσου
  choice: malaikat jurang maut
  rationale: ἄγγελος dalam konteks Wahyu paling wajar diterjemahkan ‘malaikat’. ‘Jurang maut’ merupakan ungkapan Indonesia yang mudah dipahami untuk ἄβυσσος, sedangkan alternatif yang lebih harfiah menurut gambaran tradisional dicatat dalam catatan kaki.
- source_word: ὄνομα αὐτῷ Ἑβραϊστὶ
  choice: Namanya dalam bahasa Ibrani ialah
  rationale: Menyampaikan idiom datif kepunyaan secara alami dan menerjemahkan adverbia Ἑβραϊστί dengan jelas.
- source_word: Ἀβαδδών
  choice: Abadon
  rationale: Nama diri ditransliterasikan sesuai ejaan Indonesia; makna Ibraninya dipertahankan dalam catatan kaki.
- source_word: καὶ ἐν τῇ Ἑλληνικῇ ὄνομα ἔχει
  choice: dan dalam bahasa Yunani ia bernama
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan kontras antara nama Ibrani dan nama Yunani.
- source_word: Ἀπολλύων
  choice: Apolion
  rationale: Nama diri Yunani ditransliterasikan sesuai ejaan Indonesia; arti leksikalnya, ‘Pembinasa’, diberikan dalam catatan kaki.
theological_decisions:
- issue: Menerjemahkan atau mentransliterasikan nama Ἀβαδδών dan Ἀπολλύων
  choice: 'Mentransliterasikan keduanya sebagai nama diri: ‘Abadon’ dan ‘Apolion’.'
  alternative: Menerjemahkannya sebagai ‘Kebinasaan’ dan ‘Pembinasa’.
  rationale: Dalam ayat ini kedua bentuk tersebut berfungsi sebagai nama malaikat. Transliterasi menjaga fungsi itu, sedangkan maknanya tetap tersedia dalam catatan kaki tanpa memaksakan identifikasi teologis tambahan.
- issue: Penerjemahan ἀβύσσου
  choice: jurang maut
  alternative: jurang tanpa dasar
  rationale: ‘Jurang maut’ adalah ungkapan Indonesia yang wajar dan dikenal untuk tempat kedalaman dalam gambaran apokaliptis. Alternatif ‘jurang tanpa dasar’ dicatat karena mencerminkan ungkapan tradisional, meskipun unsur ‘tanpa dasar’ tidak dinyatakan secara eksplisit oleh kata Yunani itu sendiri.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan gagasan bahwa mereka mempunyai seorang raja yang berkuasa atas mereka. Semua nama ditulis menurut pola transliterasi yang mudah dibaca penutur Indonesia.
