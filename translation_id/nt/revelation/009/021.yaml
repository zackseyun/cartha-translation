  text: καὶ οὐ μετενόησαν ἐκ τῶν φόνων αὐτῶν οὔτε ἐκ τῶν ⸀φαρμάκων αὐτῶν οὔτε ἐκ τῆς πορνείας αὐτῶν οὔτε ἐκ τῶν κλεμμάτων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/021.yaml
  text: And they did not repent of their murders[a], or of their sorceries, or of their sexual immorality, or of their thefts.
translation:
  language: id
  text: Mereka juga tidak bertobat dari pembunuhan mereka, praktik sihir mereka[a], percabulan mereka, ataupun pencurian mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Yunani ini juga dapat berkaitan dengan ramuan atau peracunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετενόησαν ἐκ
  choice: bertobat dari
  rationale: Dalam konteks daftar dosa, μετανοέω menyatakan pertobatan, sedangkan ἐκ menunjukkan perbuatan-perbuatan yang tidak mereka tinggalkan. Ungkapan “bertobat dari” alami dan jelas dalam bahasa Indonesia.
- source_word: φόνων
  choice: pembunuhan
  rationale: φόνος menunjuk pada pembunuhan atau tindakan membunuh dengan bobot moral; “pembunuhan” mempertahankan daya tersebut tanpa menambahkan unsur yang tidak dinyatakan.
- source_word: φαρμάκων
  choice: praktik sihir
  rationale: Dalam konteks apokaliptik Wahyu, bentuk jamak ini paling mungkin menunjuk pada praktik magis atau okultis. “Praktik sihir” lebih alami dalam bahasa Indonesia modern daripada bentuk abstrak saja, sementara cakupan yang berkaitan dengan ramuan atau racun dicatat dalam catatan kaki.
- source_word: πορνείας
  choice: percabulan
  rationale: πορνεία merupakan istilah umum bagi perilaku seksual yang tidak bermoral. “Percabulan” ringkas, bermuatan moral, dan lazim dalam ragam Alkitab Indonesia tanpa membatasinya pada satu tindakan tertentu.
- source_word: κλεμμάτων
  choice: pencurian
  rationale: κλέμμα dapat menunjuk pada barang curian atau tindakan mencuri; dalam daftar keburukan ini, “pencurian” paling alami dan tepat.
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: '..., ..., ataupun ...'
  rationale: Rangkaian negatif Yunani dinyatakan secara alami dalam bahasa Indonesia dengan daftar yang ditutup oleh “ataupun”; cakupan penyangkalan tetap berlaku pada setiap unsur.
theological_decisions:
- issue: Cakupan makna φαρμάκων dalam daftar keburukan apokaliptik
  choice: praktik sihir
  alternative: ramuan, peracunan, atau praktik magis
  rationale: Pemakaian istilah serumpun dalam Wahyu dan konteks daftar dosa mendukung arti praktik sihir. Namun, kaitan leksikalnya dengan ramuan dan racun tidak dihapus, melainkan dipertahankan dalam catatan kaki agar ambiguitas historisnya tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti kepunyaan “mereka” pada akhir kalimat mencakup seluruh rangkaian perbuatan, sesuai pengulangan αὐτῶν dalam teks Yunani, tanpa menghasilkan pengulangan yang kaku dalam bahasa Indonesia.
