id: REV.9.14
reference: Revelation 9:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀λέγοντα τῷ ἕκτῳ ἀγγέλῳ, ὁ ἔχων τὴν σάλπιγγα· Λῦσον τοὺς τέσσαρας ἀγγέλους τοὺς δεδεμένους ἐπὶ τῷ ποταμῷ τῷ μεγάλῳ Εὐφράτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/014.yaml
  text: saying to the sixth angel[a], the one who had the trumpet, “Release the four angels who are bound at the great river Euphrates.”
translation:
  language: id
  text: berkata kepada malaikat keenam yang memegang sangkakala itu, “Lepaskanlah keempat malaikat yang terikat[a] di sungai besar Efrat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang telah diikat”. Bentuk partisipel perfek dalam bahasa Yunani menekankan keadaan mereka yang masih terikat sebagai akibat dari pengikatan sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντα
  choice: berkata
  rationale: Partisipel kini ini melanjutkan tindakan suara dari mezbah pada ayat sebelumnya. Bentuk “berkata” mempertahankan kesinambungan itu secara wajar dalam bahasa Indonesia.
- source_word: τῷ ἕκτῳ ἀγγέλῳ
  choice: kepada malaikat keenam
  rationale: Datif berfungsi sebagai objek tak langsung; susunan ini langsung dan alami dalam bahasa Indonesia.
- source_word: ὁ ἔχων τὴν σάλπιγγα
  choice: yaitu malaikat yang memegang sangkakala itu
  rationale: Frasa partisipial berartikel menjelaskan malaikat keenam yang dimaksud. “Memegang” mencerminkan ἔχων dan “yaitu malaikat” mempertahankan daya aposisional frasa tersebut.
- source_word: Λῦσον
  choice: Lepaskanlah
  rationale: Imperatif aoris dari λύω memerintahkan pelepasan dari keadaan terikat; bentuk ini jelas, tegas, dan alami.
- source_word: τοὺς τέσσαρας ἀγγέλους
  choice: keempat malaikat
  rationale: Objek langsung dengan bilangan diterjemahkan secara lugas; “keempat” menunjuk pada kelompok tertentu yang berjumlah empat.
- source_word: τοὺς δεδεμένους
  choice: yang terikat
  rationale: Partisipel perfek pasif menyoroti keadaan terikat yang sedang berlangsung sebagai hasil tindakan sebelumnya. Ungkapan ini alami tanpa menghilangkan keadaan hasil tersebut; nuansanya dijelaskan dalam catatan kaki.
- source_word: ἐπὶ τῷ ποταμῷ
  choice: di Sungai
  rationale: ἐπί dengan datif dipakai secara lokatif. “Di” mempertahankan hubungan lokasi tanpa menentukan secara berlebihan apakah tepatnya di tepi, pada, atau di kawasan sungai.
- source_word: τῷ μεγάλῳ Εὐφράτῃ
  choice: Efrat yang besar itu
  rationale: Terjemahan ini mempertahankan nama diri, julukan “besar”, dan sifat definit frasa Yunani dalam susunan Indonesia yang wajar.
theological_decisions:
- issue: Identitas dan status moral keempat malaikat
  choice: keempat malaikat
  alternative: keempat malaikat yang jatuh; keempat malaikat yang ditetapkan untuk penghukuman
  rationale: Ayat ini hanya menyebut mereka sebagai malaikat yang terikat di Sungai Efrat. Terjemahan tidak menambahkan penilaian moral atau fungsi teologis yang tidak dinyatakan oleh teks.
- issue: Lokasi tepat para malaikat dalam kaitannya dengan Sungai Efrat
  choice: di Sungai Efrat
  alternative: di tepi Sungai Efrat; pada Sungai Efrat
  rationale: Preposisi Yunani menyatakan hubungan lokatif, tetapi ayat ini tidak menentukan secara pasti apakah mereka berada di tepi, pada, atau di kawasan sungai. “Di” menjaga keluasan makna tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat dan mudah dipahami. “Sangkakala” dipertahankan sebagai istilah Alkitab yang sudah dikenal, sedangkan struktur aposisional dibuat eksplisit dengan “yaitu malaikat” agar rujukannya jelas.
