  text: ἀπὸ τῶν τριῶν πληγῶν τούτων ἀπεκτάνθησαν τὸ τρίτον τῶν ἀνθρώπων, ⸀ἐκ τοῦ πυρὸς καὶ τοῦ καπνοῦ καὶ τοῦ θείου τοῦ ἐκπορευομένου ἐκ τῶν στομάτων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/018.yaml
  text: By these three plagues a third of mankind was killed—by the fire and the smoke and the sulfur coming out of their mouths[a][b].
translation:
  language: id
  text: Oleh ketiga malapetaka ini, sepertiga umat manusia terbunuh—oleh api, asap, dan belerang yang keluar dari mulut mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ τῶν τριῶν πληγῶν τούτων
  choice: Oleh ketiga malapetaka ini
  rationale: ἀπό di sini menyatakan sebab atau sarana, sehingga diterjemahkan 'oleh'. Demonstratif τούτων dipertahankan dengan 'ini'. Dalam konteks penghakiman di Wahyu, 'malapetaka' menyampaikan πληγή secara alami dan bermartabat.
- source_word: ἀπεκτάνθησαν
  choice: terbunuh
  rationale: Bentuk pasif aoris dipertahankan tanpa menentukan pelaku yang tidak disebutkan dalam klausa.
- source_word: τὸ τρίτον τῶν ἀνθρώπων
  choice: sepertiga umat manusia
  rationale: Ungkapan partitif ini berarti satu dari tiga bagian. ἄνθρωποι menunjuk manusia secara umum, bukan khusus laki-laki; 'umat manusia' jelas dan sesuai dengan register penglihatan penghakiman.
- source_word: ἐκ τοῦ πυρὸς καὶ τοῦ καπνοῦ καὶ τοῦ θείου
  choice: oleh api, asap, dan belerang
  rationale: ἐκ menyatakan sumber sekaligus sarana mematikan. Pengulangan kedua 'oleh' memperjelas bahwa tiga unsur inilah ketiga malapetaka tersebut. 'Belerang' adalah padanan Indonesia modern untuk θεῖον.
- source_word: τοῦ ἐκπορευομένου ἐκ τῶν στομάτων αὐτῶν
  choice: yang keluar dari mulut mereka
  rationale: Partisipel kini menggambarkan unsur-unsur itu keluar dari mulut makhluk-makhluk tersebut. Bentuk tunggal kolektif 'mulut' alami dalam bahasa Indonesia, sedangkan 'mereka' tetap mengacu pada makhluk jamak dalam penglihatan.
theological_decisions:
- issue: Cakupan ἀνθρώπων dalam adegan penghakiman apokaliptik
  choice: umat manusia
  alternative: orang-orang
  rationale: Kata Yunani tersebut mencakup manusia secara umum dan tidak khusus laki-laki. 'Umat manusia' mempertahankan cakupan kolektif serta nada khidmat tanpa menambahkan penafsiran doktrinal.
- issue: Hubungan ketiga unsur dengan ketiga malapetaka
  choice: mengulang 'oleh' sebelum api, asap, dan belerang
  alternative: menggunakan 'yaitu' atau 'dari'
  rationale: Teks menyajikan api, asap, dan belerang sebagai sumber atau sarana kematian. Pengulangan 'oleh' menjaga konstruksi kausal-instrumental tanpa memaksakan penjelasan yang lebih tegas daripada bahasa Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan gambaran apokaliptik yang lugas. Struktur sebab dipertahankan, sedangkan daftar dibuat alami dalam bahasa Indonesia. Penanda catatan kaki [a] ditempatkan langsung sesudah 'belerang'.
