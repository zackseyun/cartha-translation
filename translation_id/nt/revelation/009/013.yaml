id: REV.9.13
reference: Revelation 9:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕκτος ἄγγελος ἐσάλπισεν· καὶ ἤκουσα φωνὴν μίαν ἐκ ⸀τῶν κεράτων τοῦ θυσιαστηρίου τοῦ χρυσοῦ τοῦ ἐνώπιον τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/013.yaml
  text: And the sixth angel blew his trumpet[a], and I heard one voice from the horns of the golden altar that is before God,
translation:
  language: id
  text: Lalu malaikat keenam meniup sangkakalanya, dan aku mendengar satu suara[a] dari tanduk-tanduk mezbah emas yang berada di hadapan Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebuah suara tunggal.” Bahasa Yunani menekankan bahwa suara itu satu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: meniup sangkakalanya
  rationale: Kata kerja σαλπίζω berarti meniup atau membunyikan sangkakala. Objek tersirat dinyatakan agar idiomatis dalam bahasa Indonesia dan jelas dalam rangkaian penglihatan ini.
- source_word: φωνὴν μίαν
  choice: satu suara
  rationale: Terjemahan ini mempertahankan penekanan pada jumlah satu tanpa menentukan siapa pemilik suara tersebut.
- source_word: ἐκ τῶν κεράτων
  choice: dari tanduk-tanduk
  rationale: ἐκ menyatakan sumber atau asal, sedangkan bentuk jamak κέρατα menunjuk pada tonjolan-tonjolan berbentuk tanduk pada mezbah.
- source_word: θυσιαστηρίου τοῦ χρυσοῦ
  choice: mezbah emas
  rationale: Ungkapan ini secara alami merujuk pada mezbah yang terbuat dari atau bercirikan emas dan mempertahankan gambaran tempat kudus.
- source_word: τοῦ ἐνώπιον τοῦ θεοῦ
  choice: yang berada di hadapan Allah
  rationale: ἐνώπιον menunjukkan kedudukan di hadapan atau dalam hadirat Allah; pilihan ini dekat dengan struktur sumber sekaligus wajar dalam bahasa Indonesia.
- source_word: ἄγγελος
  choice: malaikat
  rationale: Dalam konteks penglihatan kitab Wahyu, kata ini merujuk pada makhluk surgawi, bukan utusan manusia.
theological_decisions:
- issue: Identitas suara
  choice: Diterjemahkan secara netral sebagai “satu suara” tanpa menentukan pemiliknya.
  alternative: Suara Allah; suara seorang malaikat; atau suara yang dikaitkan dengan mezbah.
  rationale: Teks Yunani hanya menyatakan bahwa Yohanes mendengar satu suara dari tanduk-tanduk mezbah emas. Identitas suara tidak dijelaskan, sehingga ambiguitas itu dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah “sangkakala” dan “mezbah” dipertahankan karena lazim dalam konteks biblis, sedangkan susunan kalimat dibuat alami bagi pembaca masa kini.
