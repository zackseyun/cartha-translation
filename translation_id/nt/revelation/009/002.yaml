id: REV.9.2
reference: Revelation 9:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἤνοιξεν τὸ φρέαρ τῆς ἀβύσσου, καὶ ἀνέβη καπνὸς ἐκ τοῦ φρέατος ὡς καπνὸς καμίνου ⸀μεγάλης, καὶ ⸀ἐσκοτώθη ὁ ἥλιος καὶ ὁ ἀὴρ ἐκ τοῦ καπνοῦ τοῦ φρέατος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/002.yaml
  text: And he opened the shaft of the abyss[a], and smoke went up from the shaft like the smoke of a great furnace, and the sun and the air were darkened by the smoke from the shaft.
translation:
  language: id
  text: Ia membuka lubang yang menuju ke jurang yang dalam[a]. Lalu naiklah asap dari lubang itu seperti asap dari tungku besar, dan matahari serta udara menjadi gelap oleh asap dari lubang itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “lubang jurang yang dalam”; secara tradisional, “lubang jurang maut.”
    reason: Menunjukkan alternatif untuk hubungan genitif antara φρέαρ dan ἀβύσσου serta istilah tradisional, tanpa memasukkan “maut” ke dalam teks utama.
lexical_decisions:
- source_word: ἤνοιξεν
  choice: membuka
  rationale: Padanan langsung bagi verba aoris ἀνοίγω; tidak menambahkan gagasan bahwa lubang itu dibuka dengan kunci.
- source_word: τὸ φρέαρ τῆς ἀβύσσου
  choice: lubang menuju jurang maut
  rationale: φρέαρ menunjuk pada lubang atau jalur masuk, sedangkan ἄβυσσος menunjuk pada kedalaman/jurang itu sendiri. Kata 'menuju' menyatakan hubungan akses secara alami dalam bahasa Indonesia tanpa menyamakan keduanya.
- source_word: ἀνέβη καπνὸς
  choice: naiklah asap
  rationale: Mempertahankan gerak ke atas dan menghasilkan susunan naratif yang wajar serta khidmat dalam bahasa Indonesia.
- source_word: ὡς καπνὸς καμίνου μεγάλης
  choice: seperti asap dari tungku besar
  rationale: ὡς menyatakan perbandingan, κάμινος berarti tungku, dan μεγάλης menerangkan ukurannya.
- source_word: ἐσκοτώθη
  choice: menjadi gelap
  rationale: Menyampaikan hasil dari bentuk pasif Yunani secara alami; penyebabnya tetap dinyatakan dengan frasa 'oleh asap'.
- source_word: ὁ ἀὴρ
  choice: udara
  rationale: Padanan langsung bagi ἀήρ sebagai udara atau atmosfer, bukan 'langit'.
- source_word: ἐκ τοῦ καπνοῦ τοῦ φρέατος
  choice: oleh asap dari lubang itu
  rationale: Menyampaikan daya kausal ἐκ dan sekaligus asal asap tersebut secara idiomatis.
theological_decisions:
- issue: Istilah tempat apokaliptik φρέαρ dan ἄβυσσος
  choice: lubang menuju jurang maut
  alternative: lubang jurang yang tak berdasar; sumur jurang maut; lubang menuju samudra raya
  rationale: Pilihan ini menjaga perbedaan antara lubang akses dan ἄβυσσος, serta menghindari ungkapan tradisional 'yang tak berdasar' yang lebih interpretatif. 'Jurang maut' adalah istilah Indonesia yang dapat dipahami untuk kedalaman dunia bawah dalam konteks apokaliptik, tanpa menyamakannya begitu saja dengan neraka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Inversi 'naiklah asap' mempertahankan gerak narasi dengan tetap mudah dipahami. Pengulangan 'lubang itu' mengikuti pengulangan sumber dan menjaga kesinambungan gambaran.
