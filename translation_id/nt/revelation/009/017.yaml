id: REV.9.17
reference: Revelation 9:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ οὕτως εἶδον τοὺς ἵππους ἐν τῇ ὁράσει καὶ τοὺς καθημένους ἐπ’ αὐτῶν, ἔχοντας θώρακας πυρίνους καὶ ὑακινθίνους καὶ θειώδεις· καὶ αἱ κεφαλαὶ τῶν ἵππων ὡς κεφαλαὶ λεόντων, καὶ ἐκ τῶν στομάτων αὐτῶν ἐκπορεύεται πῦρ καὶ καπνὸς καὶ θεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/017.yaml
  text: And this is how I saw the horses in the vision, and those sitting on them[a]—they had breastplates fiery red and hyacinth-blue and sulfur-yellow; and the heads of the horses were like lions’ heads[b], and out of their mouths come fire and smoke and sulfur.
translation:
  language: id
  text: 'Dan beginilah aku melihat dalam penglihatan itu kuda-kuda dan orang-orang yang duduk di atas kuda-kuda itu: mereka mengenakan baju zirah berwarna merah menyala, biru hyasint[a], dan kuning belerang. Kepala kuda-kuda itu seperti kepala singa, dan dari mulut mereka keluar api, asap, dan belerang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: biru tua atau biru keunguan. Kata Yunani ini menunjuk pada warna hyasint; identifikasi warna tepatnya tidak pasti.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: beginilah
  rationale: Menyatakan cara atau rupa yang dilihat Yohanes, dengan tetap mempertahankan daya demonstratif kata Yunani dalam bahasa Indonesia yang alami.
- source_word: ἐν τῇ ὁράσει
  choice: dalam penglihatan tersebut
  rationale: ὅρασις di sini menunjuk pada pengalaman penglihatan profetis, bukan sekadar penampakan kasatmata.
- source_word: τοὺς καθημένους ἐπ’ αὐτῶν
  choice: orang-orang yang duduk di atasnya
  rationale: Mempertahankan bentuk partisipial Yunani dan tidak memadatkannya menjadi 'para penunggang', meskipun rujukannya jelas kepada mereka yang menunggang kuda.
- source_word: θώρακας
  choice: baju zirah
  rationale: Istilah Indonesia yang konkret dan lazim untuk pelindung bagian dada atau tubuh dalam gambaran perlengkapan perang.
- source_word: πυρίνους καὶ ὑακινθίνους καὶ θειώδεις
  choice: yang tampak seperti api, batu yakut, dan belerang
  rationale: Ketiga adjektiva menggambarkan rupa baju zirah melalui kaitannya dengan api, hyakinthos, dan belerang. Rumusan ini mempertahankan citra sumber tanpa menetapkan warna merah, biru, dan kuning secara lebih tegas daripada bahasa Yunani.
- source_word: ὡς κεφαλαὶ λεόντων
  choice: seperti kepala singa
  rationale: Menyampaikan perbandingan ὡς secara langsung dan alami; bentuk tunggal generik 'singa' wajar dalam bahasa Indonesia.
- source_word: ἐκπορεύεται
  choice: keluar
  rationale: Mempertahankan aspek kini yang hidup dalam adegan penglihatan tanpa perlu menandainya secara eksplisit dalam bahasa Indonesia.
- source_word: θεῖον
  choice: belerang
  rationale: Padanan modern dan tepat bagi zat sulfur yang dimaksud; lebih alami daripada istilah kimia 'sulfur' dalam register naratif Alkitab Indonesia.
theological_decisions:
- issue: Makna tiga adjektiva yang menerangkan baju zirah
  choice: Mengungkapkan kemiripan rupa dengan api, batu yakut, dan belerang tanpa menetapkan tiga nama warna tertentu.
  alternative: Menerjemahkan secara eksplisit sebagai 'merah menyala, biru yakut, dan kuning belerang'.
  rationale: Konteksnya jelas bersifat visual, tetapi bentuk Yunani tetap dapat menunjuk pada sifat atau rupa yang berhubungan dengan ketiga benda tersebut, bukan semata-mata warna. Pilihan ini menjaga gambaran apokaliptik dan ambiguitas leksikalnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan 'kuda-kuda', 'kepala', serta 'api, asap, dan belerang' dipertahankan untuk menjaga irama dan citra teks sumber.
