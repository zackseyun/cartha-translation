  text: καὶ εἶχον τρίχας ὡς τρίχας γυναικῶν, καὶ οἱ ὀδόντες αὐτῶν ὡς λεόντων ἦσαν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/008.yaml
  text: And they had hair like women’s hair[a], and their teeth were like lions’ teeth,
translation:
  language: id
  text: Mereka memiliki rambut seperti rambut perempuan, dan gigi mereka seperti gigi singa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶχον
  choice: mereka memiliki
  rationale: Bentuk imperfek ini menggambarkan ciri makhluk-makhluk dalam penglihatan. Bahasa Indonesia secara alami menyatakannya dengan verba sederhana tanpa penandaan aspek yang berlebihan.
- source_word: τρίχας
  choice: rambut
  rationale: Walaupun bentuk Yunaninya jamak, “rambut” merupakan bentuk kolektif yang alami dalam bahasa Indonesia; “rambut-rambut” akan terdengar janggal dalam deskripsi ini.
- source_word: ὡς τρίχας γυναικῶν
  choice: seperti rambut perempuan
  rationale: ὡς menyatakan perbandingan. Ungkapan ini mempertahankan gambaran sumber tanpa menafsirkan panjang, gaya, atau makna simbolis rambut tersebut.
- source_word: οἱ ὀδόντες αὐτῶν
  choice: gigi mereka
  rationale: Susunan posesif ini adalah padanan bahasa Indonesia yang langsung dan alami.
- source_word: ὡς λεόντων ἦσαν
  choice: seperti gigi singa
  rationale: Kata “gigi” diulang agar unsur yang dibandingkan jelas. Bentuk imperfek ἦσαν tidak memerlukan penandaan kala tersendiri dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat gambaran dalam penglihatan apokaliptik
  choice: Mempertahankan kedua perumpamaan sebagaimana dinyatakan dalam teks tanpa menjelaskan simbolismenya.
  alternative: Menambahkan bahasa interpretatif tentang arti rambut perempuan atau gigi singa.
  rationale: Teks Yunani hanya menyajikan perbandingan visual dan tidak menerangkan makna simbolisnya. Terjemahan tidak seharusnya menyelesaikan ketegangan atau ambiguitas tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. “Perempuan” dipilih sebagai istilah netral dan bermartabat. Kesejajaran dua klausa dipertahankan untuk mencerminkan irama deskripsi Yunani.
