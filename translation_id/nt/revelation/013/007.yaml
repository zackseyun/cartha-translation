revisions:
- from: Ia diberi izin untuk berperang melawan[a] orang-orang kudus dan mengalahkan mereka.[b] Ia juga diberi wewenang atas setiap suku, kaum, bahasa,[c] dan bangsa.
  to: Kepadanya diberikan kuasa untuk berperang melawan[a] orang-orang kudus dan menaklukkan mereka.[b] Kepadanya juga diberikan wewenang atas setiap suku, kaum, bahasa,[c] dan bangsa.
  rationale: Revisi mengganti “diberi izin” dengan “diberikan kuasa” agar bentuk pasif ἐδόθη tetap jelas tanpa mempersempitnya menjadi izin semata, sambil menjaga pemberi tetap tidak disebut. “Menaklukkan” dipakai sebagai padanan utama νικῆσαι; alternatif “mengalahkan” dipindahkan ke catatan kaki. Penanda catatan kaki tetap menempel pada unsur yang dijelaskannya.
  reviewer_model: gpt-5.6-terra
