id: REV.13.7
reference: Revelation 13:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐδόθη αὐτῷ ποιῆσαι πόλεμον μετὰ τῶν ἁγίων καὶ νικῆσαι αὐτούς, καὶ ἐδόθη αὐτῷ ἐξουσία ἐπὶ πᾶσαν φυλὴν καὶ λαὸν καὶ γλῶσσαν καὶ ἔθνος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/007.yaml
  text: And it was given to him to make war against the saints and to conquer them[c][b][a], and authority was given to him over every tribe and people and language and nation.
translation:
  language: id
  text: Kepadanya diberikan kuasa untuk berperang melawan[a] orang-orang kudus dan menaklukkan mereka.[b] Kepadanya juga diberikan wewenang atas setiap suku, kaum, bahasa,[c] dan bangsa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berperang dengan orang-orang kudus”; dalam konteks ini, maksudnya adalah berperang melawan mereka.
    reason: lexical_alternative
  - marker: b
    text: Atau “mengalahkan mereka.”
    reason: lexical_alternative
  - marker: c
    text: 'Terjemahan tradisional: “lidah,” dengan arti “bahasa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτῷ
  choice: ia diberi izin / ia diberi wewenang
  rationale: Bentuk pasif dipertahankan pada kedua kemunculan tanpa menyebut pihak yang memberi. Pada kemunculan pertama, “izin” melengkapi ungkapan secara wajar dalam bahasa Indonesia; pada kemunculan kedua, “wewenang” menerjemahkan objek eksplisit ἐξουσία.
- source_word: ποιῆσαι πόλεμον
  choice: untuk berperang
  rationale: Ungkapan Indonesia yang alami dan langsung untuk idiom Yunani “melakukan perang”.
- source_word: μετὰ τῶν ἁγίων
  choice: melawan orang-orang kudus
  rationale: Dalam gabungan dengan ungkapan berperang, μετά menyatakan keterlibatan yang bermusuhan. “Orang-orang kudus” mempertahankan istilah baku bagi umat milik Allah tanpa mempersempit acuannya.
- source_word: νικῆσαι
  choice: mengalahkan
  rationale: Menyampaikan kemenangan atas lawan secara alami sambil tetap membuka alternatif “menaklukkan,” yang dapat menonjolkan motif kemenangan dalam kitab Wahyu.
- source_word: ἐξουσία
  choice: wewenang
  rationale: Menunjukkan otoritas atau yurisdiksi yang diberikan, bukan semata-mata kekuatan fisik.
- source_word: φυλὴν καὶ λαὸν καὶ γλῶσσαν καὶ ἔθνος
  choice: suku, kaum, bahasa, dan bangsa
  rationale: Padanan yang jelas dan wajar bagi rangkaian empat kelompok tersebut; “bahasa” menyampaikan makna γλῶσσα dalam bahasa Indonesia modern.
theological_decisions:
- issue: Bentuk pasif ilahi yang tidak menyebut pemberi dalam ἐδόθη
  choice: Mempertahankan bentuk pasif “diberi” tanpa menyebut siapa pemberinya.
  alternative: Menyebut secara eksplisit bahwa Allah mengizinkannya atau memakai bentuk aktif dengan Allah sebagai subjek.
  rationale: Teks Yunani tidak menyebut pihak yang memberi. Bentuk pasif menjaga ketegangan antara kedaulatan ilahi dan kejahatan yang diizinkan tanpa menambahkan penjelasan teologis ke dalam teks.
- issue: Cakupan kemenangan binatang atas orang-orang kudus
  choice: “Mengalahkan mereka” tanpa menjelaskan apakah kemenangan itu sementara, jasmani, atau mutlak.
  alternative: Menambahkan pembatas seperti “secara lahiriah” atau “untuk sementara.”
  rationale: Ayat ini menyatakan kemenangan binatang dengan tegas, sedangkan batas dan makna akhirnya dikembangkan oleh konteks kitab. Terjemahan tidak boleh menyelesaikan ketegangan tersebut di dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan “Ia diberi” mempertahankan kesejajaran kedua bentuk pasif Yunani. “Kaum” dipilih untuk λαός agar rangkaian suku–kaum–bahasa–bangsa terdengar alami dan tidak membingungkan “bangsa” dengan ἔθνος.
