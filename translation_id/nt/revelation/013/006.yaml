id: REV.13.6
reference: Revelation 13:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἤνοιξε τὸ στόμα αὐτοῦ εἰς ⸀βλασφημίας πρὸς τὸν θεόν, βλασφημῆσαι τὸ ὄνομα αὐτοῦ καὶ τὴν σκηνὴν αὐτοῦ, τοὺς ἐν τῷ οὐρανῷ σκηνοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/006.yaml
  text: And it opened its mouth in blasphemies against God[a], to blaspheme his name and his dwelling[b], those dwelling in heaven.
translation:
  language: id
  text: Lalu binatang itu membuka mulutnya untuk mengucapkan hujatan-hujatan terhadap Allah[a], untuk menghujat nama-Nya dan kediaman-Nya[b], yaitu mereka yang tinggal di surga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “serta mereka yang tinggal di surga,” jika frasa terakhir dipahami sebagai objek ketiga dari “menghujat”, bukan sebagai penjelasan tentang “kediaman-Nya”.'
    reason: alternative_reading
  - marker: b
    text: “Kediaman” juga dapat diterjemahkan “tabernakel” atau “kemah”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνοιξε τὸ στόμα αὐτοῦ
  choice: binatang itu membuka mulutnya
  rationale: Ungkapan ini dipertahankan secara konkret dan idiomatis; nomina rujukan dihadirkan agar pronomina Yunani tidak terasa janggal dalam bahasa Indonesia.
- source_word: εἰς βλασφημίας
  choice: untuk melontarkan hujatan
  rationale: Menyampaikan arah tindakan dan bentuk jamak βλασφημίας secara alami, sebagai ucapan-ucapan menghina yang dilontarkan.
- source_word: πρὸς τὸν θεόν
  choice: terhadap Allah
  rationale: Dalam konteks ujaran bermusuhan, πρός menyatakan sasaran atau arah permusuhan.
- source_word: βλασφημῆσαι
  choice: menghujat
  rationale: Padanan langsung dan wajar bagi infinitif tujuan/hasil ini.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: nama-Nya
  rationale: Mempertahankan ungkapan harfiah serta makna alkitabiahnya mengenai identitas dan kehormatan Allah.
- source_word: τὴν σκηνὴν αὐτοῦ
  choice: tempat kediaman-Nya
  rationale: σκηνή dapat berarti kemah, tabernakel, atau kediaman; pilihan ini jelas bagi pembaca modern tanpa secara tidak perlu mempersempitnya ke bangunan ibadah.
- source_word: τοὺς ἐν τῷ οὐρανῷ σκηνοῦντας
  choice: yaitu mereka yang tinggal di surga
  rationale: Mencerminkan pembacaan aposisional yang menjelaskan 'tempat kediaman-Nya' dan menerjemahkan σκηνοῦντας secara alami.
theological_decisions:
- issue: Hubungan antara 'tempat kediaman-Nya' dan 'mereka yang tinggal di surga'
  choice: 'Frasa terakhir diperlakukan sebagai aposisi penjelas: ''yaitu mereka yang tinggal di surga.'''
  alternative: 'Frasa terakhir dapat menjadi objek ketiga yang sejajar dari ''menghujat'': ''dan mereka yang tinggal di surga.'''
  rationale: Bentuk akusatif dan kaitan leksikal antara σκηνή dan σκηνοῦντας mendukung aposisi, tetapi koordinasi tetap mungkin; karena itu alternatifnya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Kapitalisasi pronomina untuk Allah mengikuti kelaziman penerbitan Alkitab bahasa Indonesia; 'binatang' dipakai untuk memperjelas rujukan pronomina tanpa mengubah acuannya.
