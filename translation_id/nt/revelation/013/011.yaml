id: REV.13.11
reference: Revelation 13:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἄλλο θηρίον ἀναβαῖνον ἐκ τῆς γῆς, καὶ εἶχεν κέρατα δύο ὅμοια ἀρνίῳ, καὶ ἐλάλει ὡς δράκων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/011.yaml
  text: And I saw another beast coming up out of the earth[a], and it had two horns like a lamb, and it was speaking like a dragon.
translation:
  language: id
  text: Lalu aku melihat seekor binatang lain muncul dari bumi[a]. Binatang itu bertanduk dua seperti anak domba dan berbicara seperti naga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “muncul dari daratan.” Kata Yunani γῆ dapat berarti “bumi” atau “daratan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο θηρίον
  choice: seekor binatang lain
  rationale: Dalam kitab Wahyu, θηρίον merupakan istilah apokaliptik yang sudah mapan bagi sosok atau kuasa yang buas dan memusuhi Allah. 'Binatang' mempertahankan daya simbolisnya, sedangkan 'seekor ... lain' menyampaikan ἄλλο secara alami dalam bahasa Indonesia.
- source_word: ἀναβαῖνον ἐκ τῆς γῆς
  choice: muncul dari bumi
  rationale: Partisipel kini ἀναβαῖνον menggambarkan binatang itu sedang naik atau muncul. 'Muncul dari bumi' alami dalam bahasa Indonesia dan mempertahankan gambaran kemunculan dari bawah. γῆ dapat berarti 'bumi' atau 'daratan'; pilihan utama 'bumi' mempertahankan cakupan kosmis dan kontras dengan laut dalam konteks dekat.
- source_word: εἶχεν κέρατα δύο
  choice: bertanduk dua
  rationale: Ungkapan ini menyampaikan secara ringkas bahwa binatang tersebut memiliki dua tanduk. Bentuk berimbuhan 'bertanduk' lebih alami daripada 'memiliki dua tanduk' tanpa mengurangi unsur gambarnya.
- source_word: ὅμοια ἀρνίῳ
  choice: seperti anak domba
  rationale: ἀρνίον lazim berarti 'anak domba' dan menjadi sebutan penting dalam Wahyu. Pilihan ini mempertahankan kemungkinan gema kepada sosok Anak Domba tanpa menyamakan binatang tersebut dengannya.
- source_word: ἐλάλει ὡς δράκων
  choice: berbicara seperti naga
  rationale: Imperfek ἐλάλει menggambarkan cara berbicara yang berlangsung atau menjadi cirinya. 'Berbicara seperti naga' mempertahankan perbandingan ὡς dan tidak mengubahnya menjadi pernyataan identitas.
theological_decisions:
- issue: Kemiripan dengan ἀρνίον dan kemungkinan gema kepada Anak Domba dalam kitab Wahyu
  choice: seperti anak domba
  alternative: seperti seekor domba kecil
  rationale: '''Anak domba'' merupakan padanan Indonesia yang alami serta mempertahankan gema teologis yang mungkin disengaja. Teks hanya menyatakan kemiripan tanduknya, bukan identitas binatang itu dengan Anak Domba.'
- issue: Makna γῆ dalam hubungan dengan binatang yang keluar dari laut
  choice: bumi
  alternative: daratan
  rationale: Kedua arti dimungkinkan secara leksikal. 'Bumi' menjaga keluasan gambaran apokaliptik dan kontras dengan laut, sementara catatan kaki mempertahankan kemungkinan arti 'daratan'.
- issue: Hubungan antara penampilan seperti anak domba dan suara seperti naga
  choice: tetapi berbicara seperti naga
  alternative: dan berbicara seperti naga
  rationale: καί secara formal berarti 'dan', tetapi di sini terdapat kontras semantis yang kuat antara rupa yang menyerupai anak domba dan cara berbicara yang menyerupai naga. 'Tetapi' membuat hubungan itu wajar dalam bahasa Indonesia tanpa menyelesaikan identitas simbolisnya secara doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Susunan dua kalimat menghindari rangkaian klausa yang kaku, sementara pengulangan 'Binatang itu' menjaga rujukan tetap jelas. Istilah simbolis utama—binatang, tanduk, anak domba, dan naga—dipertahankan.
