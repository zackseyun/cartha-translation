review_pass:
  verdict: revise
  source_fidelity: Klausa pembatasan dan pasangan kegiatan niaga diterjemahkan dengan tepat. Namun, kata “yaitu” menafsirkan daftar Yunani sebagai penjelasan aposisional atas “tanda,” padahal susunan teks paling aman diterjemahkan sebagai deretan penanda tanpa mempertegas hubungan tersebut.
  naturalness: Bahasa draf pada umumnya baku dan jelas. “Kecuali orang yang memiliki” lebih langsung dan idiomatis untuk εἰ μὴ ὁ ἔχων daripada “selain orang yang memiliki” dalam konstruksi ini.
  terminology: “Tanda,” “binatang,” dan “bilangan” adalah padanan yang baik dan mapan. “Bilangan namanya” sudah alami; catatan yang menyebutnya sebagai bentuk harfiah genitif tidak diperlukan dan justru tidak menandai suatu alternatif terjemahan yang bermakna.
  issues:
  - severity: medium
    issue: “yaitu” memperkuat hubungan antara tanda, nama, dan bilangan.
    rationale: Teks Yunani menyajikan “tanda, nama binatang itu, atau bilangan namanya” dalam deretan. Walaupun hubungan aposisional mungkin, “yaitu” mengurangi ambiguitas struktural yang sebaiknya dipertahankan.
  - severity: low
    issue: Catatan kaki a tidak memberikan alternatif tekstual atau leksikal yang perlu dipertahankan.
    rationale: “Bilangan namanya” sudah menyampaikan genitif Yunani secara wajar dalam bahasa Indonesia. Parafrasa “bilangan dari namanya” bukan koreksi atau varian yang memerlukan catatan.
  revised_text: sehingga tidak seorang pun dapat membeli atau menjual, kecuali orang yang memiliki tanda itu, nama binatang itu, atau bilangan namanya.
