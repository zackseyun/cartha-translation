id: REV.13.17
reference: Revelation 13:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἵνα μή τις ⸀δύνηται ἀγοράσαι ἢ πωλῆσαι εἰ μὴ ὁ ἔχων τὸ χάραγμα, τὸ ὄνομα τοῦ θηρίου ἢ τὸν ἀριθμὸν τοῦ ὀνόματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/017.yaml
  text: so that no one can buy or sell unless he has the mark[b][a], the name of the beast or the number of its name.
translation:
  language: id
  text: sehingga tidak seorang pun dapat membeli atau menjual, kecuali orang yang memiliki tanda itu, nama binatang itu, atau bilangan namanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα μή τις δύνηται
  choice: sehingga tidak seorang pun dapat
  rationale: ἵνα di sini menyatakan tujuan atau hasil, μή τις membentuk subjek negatif tak tentu, dan δύνηται menyatakan kemampuan. Ungkapan ini alami dalam bahasa Indonesia serta mempertahankan daya klausa Yunani.
- source_word: ἀγοράσαι ἢ πωλῆσαι
  choice: membeli atau menjual
  rationale: Kedua infinitif ini menunjuk pada kegiatan niaga biasa; padanan Indonesia ini langsung dan wajar.
- source_word: εἰ μὴ ὁ ἔχων
  choice: selain orang yang memiliki
  rationale: εἰ μή menyatakan satu-satunya pengecualian, sedangkan partisipel berartikel ὁ ἔχων berfungsi substantival, 'orang yang memiliki'. Bahasa Indonesia tidak perlu menandai gender gramatikal maskulin yang bersifat generik.
- source_word: τὸ χάραγμα
  choice: tanda itu
  rationale: χάραγμα dapat berarti tanda, cap, atau bekas cetakan. 'Tanda' merupakan padanan yang jelas dan mapan dalam konteks apokaliptik ini; 'itu' menandai unsur tertentu yang telah dibicarakan.
- source_word: τὸ ὄνομα τοῦ θηρίου
  choice: nama binatang itu
  rationale: Genitif diterjemahkan secara langsung. Dalam bahasa Indonesia, 'binatang itu' merupakan padanan alami bagi θηρίον sebagai tokoh simbolis dalam konteks Wahyu.
- source_word: ἢ τὸν ἀριθμὸν τοῦ ὀνόματος αὐτοῦ
  choice: atau bilangan namanya
  rationale: ἀριθμός dipadankan dengan 'bilangan' untuk menyatakan nilai numerik nama, sedangkan sufiks -nya mempertahankan rujukan αὐτοῦ tanpa memaksakan gender.
theological_decisions:
- issue: Hubungan antara tanda, nama binatang, dan bilangan namanya
  choice: memakai 'yaitu' sesudah 'tanda itu'
  alternative: memakai koma saja tanpa penjelas hubungan
  rationale: 'Susunan kasus Yunani mendukung pembacaan bahwa ''nama binatang itu atau bilangan namanya'' menjelaskan isi atau bentuk tanda tersebut, bukan tiga syarat terpisah. ''Yaitu'' membuat hubungan itu terbaca alami dalam bahasa Indonesia, tetapi tetap mempertahankan dua kemungkinan bentuk tanda: nama atau bilangan nama.'
- issue: Rujukan αὐτοῦ setelah θηρίου
  choice: namanya
  alternative: nama binatang itu
  rationale: Bahasa Indonesia tidak membedakan 'his' dan 'its' dalam sufiks -nya. Karena itu, ambiguitas mengenai tingkat personalisasi binatang dipertahankan secara alami.
- issue: Gender generik pada ὁ ἔχων
  choice: orang yang memiliki
  alternative: dia yang memiliki
  rationale: Bentuk maskulin tunggal Yunani bersifat generik. Bahasa Indonesia secara alami memakai 'orang' tanpa gender, sehingga cakupan universal teks tidak dipersempit.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan lugas. 'Tidak seorang pun' menjaga nada larangan yang menyeluruh; 'membeli atau menjual' mudah dipahami; 'bilangan' dipilih daripada 'nomor' karena yang dimaksud ialah nilai numerik suatu nama.
