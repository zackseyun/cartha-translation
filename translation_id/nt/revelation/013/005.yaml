source:
  edition: SBLGNT
  text: Καὶ ἐδόθη αὐτῷ στόμα λαλοῦν μεγάλα καὶ ⸀βλασφημίας, καὶ ἐδόθη αὐτῷ ⸀ἐξουσία ποιῆσαι μῆνας ⸀τεσσεράκοντα δύο.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/005.yaml
  text: And a mouth was given to him[a], speaking great things and blasphemies[b], and authority was given to him to act for forty-two months.
translation:
  language: id
  text: Kepadanya diberikan mulut yang mengucapkan hal-hal besar[a] dan hujatan, dan kepadanya diberikan wewenang untuk bertindak selama empat puluh dua bulan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hal-hal besar” dalam konteks ini kemungkinan berarti perkataan yang congkak atau membual.
    reason: lexical_alternative
  - marker: b
    text: 'Atau, dalam sebagian naskah dan terjemahan: “kepadanya diberikan wewenang untuk terus bertindak selama empat puluh dua bulan.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἐδόθη
  choice: diberikan
  rationale: Bentuk pasif menunjukkan bahwa binatang itu menerima, bukan memiliki dengan sendirinya. Pengulangan “diberikan” dipertahankan untuk mencerminkan susunan Yunani dan motif kewenangan yang diizinkan dalam Wahyu.
- source_word: στόμα
  choice: mulut
  rationale: Terjemahan harfiah ini tetap wajar dalam bahasa Indonesia dan mempertahankan gambaran apokaliptis yang hidup, bukan mereduksinya menjadi sekadar “kemampuan berbicara”.
- source_word: λαλοῦν
  choice: yang mengucapkan
  rationale: Partisip ini menerangkan “mulut”. Bentuk “yang mengucapkan” alami dalam bahasa Indonesia dan cocok dengan objek berupa perkataan serta hujatan.
- source_word: μεγάλα
  choice: hal-hal besar
  rationale: Ungkapan ini mempertahankan keluasan makna harfiah Yunani. Konteks memberi nuansa kesombongan atau keangkuhan, tetapi unsur itu tidak dimasukkan secara diam-diam ke dalam teks utama.
- source_word: βλασφημίας
  choice: hujatan
  rationale: “Hujatan” menyampaikan ucapan yang menghina atau menista Allah, sesuai konteks dekat. Bentuk Indonesia ini dapat berfungsi secara kolektif meskipun kata Yunani berbentuk jamak.
- source_word: ἐξουσία
  choice: wewenang
  rationale: “Wewenang” menekankan hak atau ruang bertindak yang diberikan, bukan semata-mata kekuatan fisik.
- source_word: ποιῆσαι
  choice: untuk bertindak
  rationale: Infinitif ποιῆσαι sangat luas, secara dasar berarti “melakukan/membuat”. Dengan keterangan durasi, “untuk bertindak” tetap luas dan lebih alami daripada terjemahan harfiah yang kaku.
- source_word: μῆνας τεσσεράκοντα δύο
  choice: selama empat puluh dua bulan
  rationale: Akusatif durasi diterjemahkan secara alami dengan “selama”, dan bilangan ditulis dengan kata-kata demi keterbacaan.
theological_decisions:
- issue: Sifat perkataan binatang dalam μεγάλα
  choice: hal-hal besar
  alternative: bualan-bualan besar; kata-kata angkuh
  rationale: Konteks menunjukkan perkataan yang sombong dan menentang Allah, tetapi μεγάλα sendiri lebih luas. Terjemahan utama mempertahankan ungkapan itu, sedangkan nuansa kontekstual dijelaskan dalam catatan kaki.
- issue: Makna ποιῆσαι bersama keterangan durasi
  choice: untuk bertindak selama empat puluh dua bulan
  alternative: untuk terus berbuat selama empat puluh dua bulan; untuk berkuasa selama empat puluh dua bulan
  rationale: Teks SBLGNT memakai ποιῆσαι. “Bertindak” mempertahankan keluasan verba itu tanpa memasukkan objek atau jenis tindakan yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan ganda “kepadanya diberikan” sengaja dipertahankan untuk menjaga paralelisme dan penekanan teks Yunani. Gambaran konkret “mulut” juga dipertahankan.
