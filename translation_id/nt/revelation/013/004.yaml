id: REV.13.4
reference: Revelation 13:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ προσεκύνησαν τῷ δράκοντι ⸂ὅτι ἔδωκεν⸃ τὴν ἐξουσίαν τῷ θηρίῳ, καὶ προσεκύνησαν τῷ θηρίῳ λέγοντες· Τίς ὅμοιος τῷ θηρίῳ, καὶ τίς ⸀δύναται πολεμῆσαι μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/004.yaml
  text: And they worshiped the dragon because he had given authority to the beast[a], and they worshiped the beast, saying, “Who is like the beast[c][b], and who is able to make war with it?”
translation:
  language: id
  text: Mereka menyembah naga itu karena ia telah memberikan wewenang kepada binatang itu. Mereka juga menyembah binatang itu dan berkata, “Siapakah yang seperti binatang itu?[a] Dan siapakah yang sanggup berperang melawannya?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Seruan ini tampaknya menggemakan bahasa Perjanjian Lama tentang ketakterbandingan Allah (misalnya Kel. 15:11; Mzm. 35:10), tetapi di sini diterapkan secara menghujat kepada binatang itu. Dapat juga diterjemahkan, “Siapakah yang sebanding dengan binatang itu?”
    reason: cross_reference_and_lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “Siapakah yang dapat melancarkan perang terhadapnya?”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεκύνησαν
  choice: menyembah
  rationale: Dalam kitab Wahyu, kata ini secara tetap menunjuk pada pemujaan religius, bukan sekadar tindakan bersujud atau memberi hormat.
- source_word: δράκοντι
  choice: naga itu
  rationale: Padanan langsung dan lazim bagi gambaran apokaliptis δράκων; unsur simbolisnya tidak ditafsirkan di dalam terjemahan.
- source_word: ὅτι ἔδωκεν
  choice: karena ia telah memberikan
  rationale: ὅτι dipahami secara kausal, sedangkan bentuk perfektif ἔδωκεν menyatakan pemberian wewenang yang mendahului penyembahan tersebut.
- source_word: ἐξουσίαν
  choice: wewenang
  rationale: Menunjukkan otoritas atau kuasa memerintah yang diberikan; 'wewenang' lebih tepat daripada 'kekuatan' yang terutama menyiratkan kemampuan.
- source_word: θηρίῳ
  choice: binatang itu
  rationale: Padanan langsung yang wajar bagi θηρίον dan mempertahankan gambaran apokaliptis tanpa penafsiran tambahan.
- source_word: Τίς ὅμοιος τῷ θηρίῳ
  choice: Siapakah yang seperti binatang itu?
  rationale: Mempertahankan bentuk pertanyaan retoris serta kemungkinan gema rumusan Perjanjian Lama mengenai ketakterbandingan Allah.
- source_word: δύναται πολεμῆσαι μετ’ αὐτοῦ
  choice: sanggup berperang melawannya
  rationale: δύναται menyatakan kesanggupan, sementara πολεμῆσαι mengandung arti peperangan, dan μετά dengan genitif dalam konteks ini menunjukkan perlawanan.
theological_decisions:
- issue: Acuan pronomina bagi binatang
  choice: Gunakan bentuk netral kontekstual 'binatang itu' dan klitik '-nya'
  alternative: Memakai pronomina personal laki-laki 'dia' atau '-nya' dengan pemaknaan tokoh laki-laki
  rationale: Bahasa Indonesia tidak menandai gender pada '-nya'. Bentuk ini secara alami merujuk kembali kepada 'binatang itu' tanpa memaksakan personalisasi yang tidak dinyatakan oleh nomina netral Yunani θηρίον.
- issue: Gema bahasa tentang ketakterbandingan Allah
  choice: Pertahankan ungkapan 'Siapakah yang seperti binatang itu?' dan jelaskan gemanya dalam catatan
  alternative: Jelaskan parodi yang menghujat itu secara langsung di dalam teks utama
  rationale: Rumusan Yunani kemungkinan menggemakan bahasa Perjanjian Lama tentang keunikan Allah, tetapi teks tidak menjelaskannya secara eksplisit. Terjemahan mempertahankan ketegangan dan alusi itu tanpa menambah tafsiran ke dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Pengulangan 'menyembah' dan 'binatang itu' dipertahankan untuk mengikuti penekanan teks Yunani. Kalimat Yunani yang panjang dibagi menjadi dua kalimat agar alami dalam bahasa Indonesia tanpa mengubah hubungan sebab-akibat atau urutan gagasan.
