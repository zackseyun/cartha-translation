id: REV.13.12
reference: Revelation 13:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ τὴν ἐξουσίαν τοῦ πρώτου θηρίου πᾶσαν ποιεῖ ἐνώπιον αὐτοῦ. καὶ ⸀ποιεῖ τὴν γῆν καὶ τοὺς ἐν αὐτῇ κατοικοῦντας ἵνα ⸀προσκυνήσουσιν τὸ θηρίον τὸ πρῶτον, οὗ ἐθεραπεύθη ἡ πληγὴ τοῦ θανάτου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/012.yaml
  text: And it exercises all the authority of the first beast in its presence[a]. And it causes the earth and those who dwell on it to worship the first beast[b], whose mortal wound was healed.
translation:
  language: id
  text: Binatang itu menjalankan seluruh kuasa binatang yang pertama di hadapannya[a]. Ia membuat bumi dan mereka yang tinggal di bumi menyembah binatang yang pertama, yang luka mematikannya telah sembuh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam kehadirannya.” Ungkapan ini dapat menekankan bahwa binatang kedua bertindak di depan atau di bawah tatapan binatang pertama.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “luka kematiannya”; maksudnya, luka yang mematikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: kuasa
  rationale: Dalam konteks ini, ἐξουσία menunjuk pada kuasa atau wewenang yang dijalankan. “Kuasa” alami dalam bahasa Indonesia dan tetap mencakup unsur otoritas operasional.
- source_word: πᾶσαν
  choice: seluruh
  rationale: Menegaskan cakupan lengkap kuasa binatang pertama dan berpasangan secara alami dengan “kuasa”.
- source_word: ποιεῖ (pertama)
  choice: menjalankan
  rationale: Ungkapan ποιεῖ τὴν ἐξουσίαν berarti menggunakan atau melaksanakan kuasa; “menjalankan” lebih alami daripada terjemahan harfiah “melakukan kuasa”.
- source_word: ἐνώπιον αὐτοῦ
  choice: di hadapannya
  rationale: 'Mempertahankan kemungkinan makna spasial maupun relasional: binatang kedua bertindak di depan atau dalam kehadiran binatang pertama.'
- source_word: ποιεῖ (kedua)
  choice: membuat
  rationale: Dengan objek dan klausa ἵνα, kata ini berfungsi kausatif. “Membuat ... menyembah” menyatakan bahwa tindakan itu ditimbulkan tanpa menentukan secara eksplisit tingkat pemaksaannya.
- source_word: τὴν γῆν
  choice: bumi
  rationale: Dalam konteks Wahyu, γῆ lazim menunjuk pada bumi sebagai ranah yang dikontraskan dengan langit atau laut.
- source_word: τοὺς ἐν αὐτῇ κατοικοῦντας
  choice: orang-orang yang tinggal di dalamnya
  rationale: Mempertahankan bentuk verbal κατοικέω serta gema tematis tentang para penghuni bumi dalam kitab Wahyu.
- source_word: ἵνα προσκυνήσουσιν
  choice: menyembah
  rationale: 'Sesudah konstruksi kausatif “membuat,” bentuk ini paling alami diterjemahkan dengan verba langsung: “membuat ... menyembah.”'
- source_word: θηρίον
  choice: binatang
  rationale: “Binatang” adalah padanan langsung dan mapan dalam terjemahan apokaliptik bahasa Indonesia.
- source_word: πρῶτον
  choice: yang pertama
  rationale: Membedakan binatang ini dari binatang kedua dalam konteks langsung.
- source_word: ἐθεραπεύθη
  choice: telah sembuh
  rationale: Bentuk pasif ini menyatakan bahwa luka tersebut disembuhkan atau menjadi sembuh; susunan “telah sembuh” alami dan menjaga motif pemulihan.
- source_word: ἡ πληγὴ τοῦ θανάτου αὐτοῦ
  choice: luka mematikannya
  rationale: Genitif τοῦ θανάτου mencirikan luka itu sebagai luka yang mendatangkan kematian. “Luka mematikan” idiomatis tanpa menghilangkan kekuatan ungkapan sumber.
theological_decisions:
- issue: Daya tindakan binatang kedua terhadap para penghuni bumi
  choice: membuat ... menyembah
  alternative: memaksa ... menyembah
  rationale: Konstruksi kausatif menyatakan bahwa binatang kedua menyebabkan penyembahan itu terjadi, tetapi ayat ini sendiri tidak merinci kadar pemaksaannya. Pilihan ini mempertahankan ketegangan tersebut.
- issue: Relasi tindakan binatang kedua dengan binatang pertama
  choice: di hadapannya
  alternative: dalam kehadirannya
  rationale: Frasa Yunani dapat menekankan lokasi di depan binatang pertama atau tindakan dalam kehadiran dan pengawasannya. “Di hadapannya” mempertahankan ambiguitas itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Rujukan pronominal mengikuti tradisi gramatikal bahasa Indonesia untuk makhluk nonmanusia (“-nya”), tanpa menentukan jenis kelamin. Struktur dua kalimat dipertahankan untuk mengikuti alur Yunani.
