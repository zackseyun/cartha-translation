id: REV.13.16
reference: Revelation 13:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ποιεῖ πάντας, τοὺς μικροὺς καὶ τοὺς μεγάλους, καὶ τοὺς πλουσίους καὶ τοὺς πτωχούς, καὶ τοὺς ἐλευθέρους καὶ τοὺς δούλους, ἵνα ⸀δῶσιν αὐτοῖς ⸀χάραγμα ἐπὶ τῆς χειρὸς αὐτῶν τῆς δεξιᾶς ἢ ἐπὶ τὸ μέτωπον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/016.yaml
  text: And it causes everyone—the small and the great[a], and the rich and the poor, and the free and the servants—to be given a mark on their right hand or on their forehead,
translation:
  language: id
  text: Ia menyebabkan semua orang—orang kecil dan orang besar, orang kaya dan orang miskin, orang merdeka dan budak—diberi sebuah tanda[a] pada tangan kanan mereka atau pada dahi mereka,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “supaya mereka memberikan kepada mereka sebuah tanda.” Susunan bahasa Yunani tidak menjelaskan dengan jelas siapa yang memberikan tanda itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖ
  choice: membuat
  rationale: Dengan ἵνα dan bentuk subjungtif, kata ini menyatakan bahwa sosok tersebut menyebabkan peristiwa itu terjadi. “Membuat” alami dalam bahasa Indonesia dan tidak menambahkan gagasan pemaksaan yang tidak dinyatakan secara eksplisit oleh verba ini.
- source_word: πάντας
  choice: semua orang
  rationale: Rangkaian pasangan kategori yang mengikutinya menunjukkan cakupan menyeluruh atas semua orang yang dimaksud.
- source_word: τοὺς μικροὺς καὶ τοὺς μεγάλους
  choice: orang kecil dan orang besar
  rationale: Ungkapan ini mempertahankan citra dan irama pasangan Yunani sekaligus dipahami sebagai cakupan berbagai tingkat kedudukan sosial.
- source_word: τοὺς πλουσίους καὶ τοὺς πτωχούς
  choice: orang kaya dan orang miskin
  rationale: Ini adalah pasangan kontras ekonomi yang langsung dan lazim dalam bahasa Indonesia.
- source_word: τοὺς ἐλευθέρους καὶ τοὺς δούλους
  choice: orang merdeka dan budak
  rationale: Kontras langsung dengan “orang merdeka” menonjolkan status perbudakan, sehingga “budak” lebih tepat daripada “hamba” atau “pelayan”.
- source_word: ἵνα δῶσιν αὐτοῖς χάραγμα
  choice: diberi sebuah tanda
  rationale: Susunan Yunani secara harfiah berbunyi kira-kira “supaya mereka memberikan kepada mereka sebuah tanda,” dengan subjek jamak yang tidak dinyatakan dengan jelas. Bentuk pasif Indonesia menyampaikan peristiwa dalam konteks secara wajar tanpa menentukan pelaku pemberian tanda.
- source_word: χάραγμα
  choice: tanda
  rationale: “Tanda” mencakup cap, guratan, atau lambang pengenal dan merupakan padanan yang jelas serta sesuai dalam konteks Wahyu.
- source_word: ἐπὶ τῆς χειρὸς αὐτῶν τῆς δεξιᾶς
  choice: pada tangan kanan
  rationale: Bentuk tunggal dipakai secara distributif bagi setiap orang dan terdengar alami dalam bahasa Indonesia.
- source_word: ἢ ἐπὶ τὸ μέτωπον αὐτῶν
  choice: atau dahi mereka
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan alternatif lokasi yang dinyatakan teks Yunani.
theological_decisions:
- issue: Penerjemahan δοῦλος dalam pasangan status sosial
  choice: budak
  alternative: hamba; pelayan
  rationale: Karena δοῦλος dipertentangkan dengan “orang merdeka,” yang ditonjolkan ialah ketidakmerdekaan sebagai status sosial, bukan sekadar tindakan melayani.
- issue: Cara menyampaikan frasa sulit ἵνα δῶσιν αὐτοῖς χάραγμα
  choice: diberi sebuah tanda
  alternative: supaya mereka memberikan kepada mereka sebuah tanda; menerima sebuah tanda
  rationale: Bentuk pasif menjaga keterbacaan dan menyampaikan hasil tindakan tanpa menetapkan siapa subjek jamak tersirat dalam bentuk Yunani. Bentuk yang lebih harfiah dipertahankan dalam catatan kaki agar kejanggalan dan ambiguitas sumber tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pasangan-pasangan sosial dipertahankan untuk menjaga irama retoris teks. Kata ganti “Ia” mengikuti pelaku yang sudah hadir dalam konteks, sedangkan tanda pisah membantu pembaca mengikuti daftar panjang. Ayat dibiarkan berakhir dengan koma karena merupakan bagian dari kalimat yang berlanjut ke ayat berikutnya.
