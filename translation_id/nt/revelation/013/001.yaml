id: REV.13.1
reference: Revelation 13:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἐκ τῆς θαλάσσης θηρίον ἀναβαῖνον, ἔχον κέρατα δέκα καὶ κεφαλὰς ἑπτά, καὶ ἐπὶ τῶν κεράτων αὐτοῦ δέκα διαδήματα, καὶ ἐπὶ τὰς κεφαλὰς αὐτοῦ ⸀ὀνόματα βλασφημίας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/001.yaml
  text: And I saw a beast coming up out of the sea[a], having ten horns and seven heads, and on its horns ten crowns[b], and on its heads names of blasphemy.
translation:
  language: id
  text: Lalu aku melihat seekor binatang buas muncul dari dalam laut. Binatang itu memiliki sepuluh tanduk dan tujuh kepala. Pada tanduk-tanduknya terdapat sepuluh mahkota kerajaan[a], dan pada kepala-kepalanya terdapat nama-nama penghujatan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sepuluh diadem.” Diadem adalah mahkota atau ikat kepala yang menandakan kekuasaan kerajaan.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “nama-nama yang menghujat.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: aku melihat
  rationale: Bentuk aoristus indikatif ὁράω menyatakan tindakan melihat dalam alur penglihatan; terjemahan sederhana tidak menambahkan unsur yang tidak dinyatakan, seperti 'dalam penglihatan'.
- source_word: ἐκ τῆς θαλάσσης
  choice: dari dalam laut
  rationale: ἐκ menonjolkan kemunculan dari bagian dalam laut, bukan sekadar asal; ungkapan ini mempertahankan gambaran apokaliptik secara jelas dalam bahasa Indonesia.
- source_word: θηρίον
  choice: binatang buas
  rationale: θηρίον menunjuk pada binatang liar atau buas. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan citra simbolis tanpa menafsirkannya sebagai tokoh atau kerajaan tertentu.
- source_word: ἀναβαῖνον
  choice: muncul
  rationale: Partisipel kini menggambarkan binatang itu sedang naik dari laut. 'Muncul' menyampaikan adegan secara alami, sementara sumber kemunculannya tetap dinyatakan oleh 'dari dalam laut'.
- source_word: ἔχον
  choice: memiliki
  rationale: Partisipel ini memperkenalkan ciri-ciri binatang tersebut. Kalimat baru dengan 'memiliki' lebih wajar dalam bahasa Indonesia tanpa menghilangkan hubungan deskriptifnya.
- source_word: κέρατα δέκα
  choice: sepuluh tanduk
  rationale: Citra simbolis diterjemahkan secara langsung dan tidak dijelaskan secara interpretatif di dalam teks.
- source_word: κεφαλὰς ἑπτά
  choice: tujuh kepala
  rationale: Terjemahan langsung mempertahankan gambaran apokaliptik sumber.
- source_word: διαδήματα
  choice: mahkota kerajaan
  rationale: διάδημα adalah mahkota atau ikat kepala kerajaan, berbeda dari istilah στέφανος. 'Mahkota kerajaan' mudah dipahami dan menjaga kekhususan maknanya; 'diadem' dicatat sebagai alternatif.
- source_word: ἐπὶ τῶν κεράτων αὐτοῦ
  choice: pada tanduk-tanduknya
  rationale: ἐπί dengan genitif di sini bersifat lokatif. Pengulangan nomina dalam bentuk reduplikasi merupakan bentuk jamak Indonesia yang jelas.
- source_word: ἐπὶ τὰς κεφαλὰς αὐτοῦ
  choice: pada kepala-kepalanya
  rationale: ἐπί dengan akusatif dalam konteks ini menunjukkan letak pada permukaan kepala-kepala tersebut.
- source_word: ὀνόματα βλασφημίας
  choice: nama-nama yang menghujat Allah
  rationale: Genitif βλασφημίας berfungsi secara atributif dan dapat diungkapkan secara alami sebagai nama-nama yang bersifat menghujat. 'Allah' membuat sasaran penghujatan yang tersirat oleh pemakaian religius βλασφημία jelas bagi pembaca Indonesia, sementara bentuk yang lebih formal dipertahankan dalam catatan.
theological_decisions:
- issue: Gambaran simbolis apokaliptik
  choice: Mempertahankan secara harfiah gambaran binatang buas, tanduk, kepala, dan mahkota tanpa mengidentifikasi lambang-lambang itu di dalam terjemahan.
  alternative: Menafsirkan binatang itu sebagai kerajaan, kekaisaran, penguasa, atau agen Iblis.
  rationale: Ayat ini menyajikan lambang dalam sebuah penglihatan. Terjemahan tidak boleh menggantikan lambang dengan salah satu penafsiran eskatologis.
- issue: Makna religius ὀνόματα βλασφημίας
  choice: nama-nama yang menghujat Allah
  alternative: nama-nama penghujatan; nama-nama yang menghujat
  rationale: Dalam konteks Wahyu, βλασφημία menunjuk pada penghujatan terhadap Allah. Penyebutan objek membuat frasa idiomatis dan mudah dipahami dalam bahasa Indonesia, sedangkan catatan mempertahankan struktur sumber yang lebih ambigu.
- issue: Nuansa kerajaan pada διαδήματα
  choice: mahkota kerajaan
  alternative: diadem; mahkota
  rationale: Pilihan ini mempertahankan kaitan khusus διάδημα dengan tanda kekuasaan kerajaan tanpa memasukkan identifikasi teologis tambahan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kalimat Yunani yang panjang dibagi menjadi tiga kalimat agar mudah dibaca. Pengulangan 'Binatang itu' menjaga rujukan tetap jelas. Citra apokaliptik tidak ditafsirkan di dalam teks.
