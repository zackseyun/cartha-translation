id: REV.13.13
reference: Revelation 13:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ποιεῖ σημεῖα μεγάλα, ⸂ἵνα καὶ πῦρ ποιῇ⸃ ἐκ τοῦ οὐρανοῦ ⸂καταβαίνειν εἰς⸃ τὴν γῆν ἐνώπιον τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/013.yaml
  text: And it performs great signs[b][a], even causing fire to come down from heaven to the earth before people.
translation:
  language: id
  text: Ia mengadakan tanda-tanda besar[a], bahkan membuat api turun dari langit ke bumi di hadapan orang-orang[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mukjizat-mukjizat besar” atau “keajaiban-keajaiban besar”; secara harfiah, “tanda-tanda besar.”
    reason: lexical_alternative
  - marker: b
    text: Atau “di depan mata orang-orang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖ
  choice: mengadakan
  rationale: Dalam konstruksi dengan σημεῖα, “mengadakan” menyatakan pelaksanaan tindakan-tindakan luar biasa secara alami dalam bahasa Indonesia tanpa menentukan mekanismenya.
- source_word: σημεῖα μεγάλα
  choice: tanda-tanda besar
  rationale: “Tanda-tanda” mempertahankan nuansa apokaliptis bahwa perbuatan tersebut memiliki makna dan fungsi tertentu, sedangkan “besar” menerjemahkan μεγάλα secara langsung.
- source_word: ἵνα καὶ πῦρ ποιῇ
  choice: bahkan membuat api
  rationale: “Bahkan” menangkap καί yang menonjolkan api sebagai contoh yang mencolok, sementara “membuat” bersama infinitif “turun” mengungkapkan konstruksi kausatif secara wajar.
- source_word: πῦρ
  choice: api
  rationale: Padanan harfiah ini sesuai dengan konteks dan mempertahankan gema gambaran profetis tentang api dari langit.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: dari langit
  rationale: “Langit” sesuai dengan ragam apokaliptis dan tetap memungkinkan pengertian tempat surgawi maupun cakrawala sebagaimana konteksnya.
- source_word: καταβαίνειν εἰς τὴν γῆν
  choice: turun ... ke bumi
  rationale: Ungkapan ini mempertahankan arah gerak yang dinyatakan oleh καταβαίνειν dan εἰς serta terdengar alami dalam bahasa Indonesia modern.
- source_word: ἐνώπιον τῶν ἀνθρώπων
  choice: di hadapan orang-orang
  rationale: Padanan ini mempertahankan gagasan bahwa tindakan tersebut terjadi secara terbuka di depan manusia; “orang-orang” bersifat umum dan tidak membatasi makna pada laki-laki.
theological_decisions:
- issue: Hakikat tanda-tanda yang dilakukan
  choice: Menggambarkan tanda-tanda sebagai kejadian yang dilakukan dan disaksikan tanpa menentukan apakah sumber atau mekanismenya sungguh adikodrati atau berupa tipuan.
  alternative: Menerjemahkan σημεῖα sebagai “mukjizat-mukjizat” sehingga lebih kuat menyiratkan kuasa adikodrati, atau memakai bahasa yang menyatakannya sebagai ilusi belaka.
  rationale: Ayat ini menyebut tanda-tanda besar dan api yang turun di hadapan orang-orang, tetapi tidak menjelaskan mekanismenya. Terjemahan karena itu mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat ringkas serta dekat dengan urutan Yunani. Kata ganti “Ia” mempertahankan subjek tunggal dari konteks tanpa mengulang sebutan tokohnya.
