  text: Εἴ τις ἔχει οὖς ἀκουσάτω.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/009.yaml
  text: If anyone has an ear[a], let him hear.
translation:
  language: id
  text: Jika seseorang mempunyai telinga, hendaklah ia mendengar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἴ τις
  choice: Jika seseorang
  rationale: Mempertahankan bentuk syarat dan acuan generik dari partikel kondisional serta pronomina tak tentu Yunani; ungkapan ini alami dalam bahasa Indonesia modern.
- source_word: ἔχει
  choice: mempunyai
  rationale: Menyatakan kepemilikan secara lugas dan sesuai dengan bentuk kini indikatif Yunani.
- source_word: οὖς
  choice: telinga
  rationale: Mempertahankan bentuk tunggal dalam rumusan peribahasa ini tanpa menambahkan kata sandang yang tidak diperlukan dalam bahasa Indonesia.
- source_word: ἀκουσάτω
  choice: hendaklah ia mendengar
  rationale: Menyampaikan imperatif orang ketiga tunggal dan mempertahankan idiom profetis 'mendengar', yang mencakup perhatian serta tanggapan.
theological_decisions:
- issue: Acuan generik tunggal dalam seruan
  choice: hendaklah ia mendengar
  alternative: hendaklah orang itu mendengar
  rationale: Kata 'ia' mempertahankan acuan tunggal dan bersifat netral gender secara alami dalam bahasa Indonesia, sehingga tidak perlu memasukkan pembedaan gender yang tidak diwajibkan oleh makna referensial Yunani.
- issue: Daya idiomatis rumusan tentang mendengar
  choice: mempertahankan kata 'mendengar'
  alternative: hendaklah ia memperhatikan; hendaklah ia memahami
  rationale: Kata 'mendengar' menjaga gema seruan profetis dan tidak mempersempit maknanya menjadi perhatian atau pemahaman saja.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, khidmat, dan mudah dipahami. Susunan kalimat mempertahankan bentuk kondisional serta seruan tunggal dari teks Yunani.
