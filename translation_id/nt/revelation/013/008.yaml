  naturalness: Teks draft dapat dipahami, tetapi rangkaian “akan menyembahnya, yaitu setiap orang ...” agak janggal karena keterangan “yaitu” muncul setelah predikat. Susunan dengan tanda pisah menghasilkan bahasa Indonesia baku yang lebih lancar sambil mempertahankan penegasan aposisionalnya.
  terminology: “Menyembah,” “bumi,” “kitab kehidupan,” “Anak Domba,” dan “disembelih” tepat untuk ragam Wahyu. “Kitab kehidupan Anak Domba” merupakan konstruksi yang lebih alami, khidmat, dan lazim daripada “kitab kehidupan milik Anak Domba.”
