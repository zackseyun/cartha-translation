id: REV.13.8
reference: Revelation 13:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ προσκυνήσουσιν ⸀αὐτὸν πάντες οἱ κατοικοῦντες ἐπὶ τῆς γῆς, ⸀οὗ οὐ γέγραπται τὸ ὄνομα ⸀αὐτοῦ ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου τοῦ ἐσφαγμένου ἀπὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/008.yaml
  text: And all who dwell on the earth will worship him—everyone whose name has not been written in the book of life of the Lamb who was slain from the foundation of the world[a].
translation:
  language: id
  text: Semua orang yang tinggal di bumi—yaitu setiap orang yang namanya tidak tertulis dalam kitab kehidupan Anak Domba yang telah disembelih sejak dunia dijadikan—akan menyembahnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Semua orang yang tinggal di bumi—yaitu setiap orang yang sejak dunia dijadikan namanya tidak tertulis dalam kitab kehidupan Anak Domba yang telah disembelih—akan menyembahnya.” Dalam bahasa Yunani, frasa “sejak dunia dijadikan” dapat dihubungkan dengan “yang telah disembelih” atau dengan “tidak tertulis”.
    reason: alternative_reading
lexical_decisions:
- source_word: προσκυνήσουσιν
  choice: akan menyembah
  rationale: Dalam Kitab Wahyu, kata ini biasanya menyatakan penghormatan yang bersifat ibadah, khususnya dalam pertentangan antara penyembahan kepada Allah dan Anak Domba dengan penyembahan kepada binatang itu.
- source_word: κατοικοῦντες ἐπὶ τῆς γῆς
  choice: orang yang tinggal di bumi
  rationale: Mempertahankan bentuk verbal ungkapan berulang dalam Kitab Wahyu dengan bahasa Indonesia yang alami.
- source_word: οὗ οὐ γέγραπται τὸ ὄνομα αὐτοῦ
  choice: setiap orang yang namanya tidak tertulis
  rationale: Mengungkapkan konstruksi relatif Yunani secara alami dan mempertahankan bentuk tunggal yang menunjuk pada identitas masing-masing orang; bentuk 'tidak tertulis' menyatakan keadaan hasil dari pencatatan yang tidak terjadi.
- source_word: βιβλίῳ τῆς ζωῆς
  choice: kitab kehidupan
  rationale: Padanan baku dan jelas untuk gambaran apokaliptik ini; 'kitab' sesuai dengan ragam Alkitab Indonesia yang tetap mudah dipahami.
- source_word: τοῦ ἀρνίου
  choice: milik Anak Domba
  rationale: Genitif dipahami sebagai kepemilikan atau keterkaitan; 'Anak Domba' mempertahankan gelar kristologis serta citra korban dan Mesias.
- source_word: τοῦ ἐσφαγμένου
  choice: yang telah disembelih
  rationale: Kata kerja σφάζω mengandung nuansa kematian dengan kekerasan dan korban; 'disembelih' mempertahankan kekuatan citra itu lebih baik daripada sekadar 'dibunuh'.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: sejak dunia dijadikan
  rationale: Padanan Indonesia yang alami bagi ungkapan temporal tersebut dan mempertahankan gagasan sejak awal penciptaan dunia.
theological_decisions:
- issue: Keterkaitan sintaksis frasa ἀπὸ καταβολῆς κόσμου ('sejak dunia dijadikan')
  choice: Dalam teks utama dihubungkan dengan Anak Domba yang telah disembelih
  alternative: 'Dihubungkan dengan penulisan nama: ''setiap orang yang sejak dunia dijadikan namanya tidak tertulis dalam kitab kehidupan milik Anak Domba yang telah disembelih'''
  rationale: Urutan kata Yunani paling langsung menghubungkan frasa temporal itu dengan partisip yang tepat mendahuluinya, yakni 'yang telah disembelih'. Namun, Wahyu 17:8 mendukung kemungkinan menghubungkannya dengan penulisan nama. Karena sintaksisnya sungguh ambigu dan memiliki bobot teologis, alternatif tersebut dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Semua orang yang tinggal di bumi' menjaga konsistensi ungkapan khas Kitab Wahyu; 'kitab kehidupan' dan 'Anak Domba' mempertahankan citra serta istilah alkitabiah yang telah dikenal. Penanda catatan kaki [a] dicantumkan dalam teks utama.
