id: REV.13.2
reference: Revelation 13:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ τὸ θηρίον ὃ εἶδον ἦν ὅμοιον παρδάλει, καὶ οἱ πόδες αὐτοῦ ὡς ἄρκου, καὶ τὸ στόμα αὐτοῦ ὡς στόμα λέοντος. καὶ ἔδωκεν αὐτῷ ὁ δράκων τὴν δύναμιν αὐτοῦ καὶ τὸν θρόνον αὐτοῦ καὶ ἐξουσίαν μεγάλην.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/002.yaml
  text: And the beast that I saw was like a leopard[a], and its feet were like a bear's, and its mouth was like a lion's mouth. And the dragon gave it his power and his throne and great authority.
translation:
  language: id
  text: Dan binatang yang kulihat itu menyerupai macan tutul[a], kakinya seperti kaki beruang, dan mulutnya seperti mulut singa. Dan naga itu memberikan kepadanya kekuatannya, takhtanya, dan wewenang yang besar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gambaran macan tutul, beruang, dan singa menggemakan penglihatan tentang binatang-binatang dalam Daniel 7.
    reason: cross_reference
lexical_decisions:
- source_word: θηρίον
  choice: binatang
  rationale: Dalam konteks apokaliptik Wahyu, kata ini menunjuk pada makhluk buas simbolis. “Binatang” merupakan padanan Indonesia yang langsung dan lazim dalam tradisi penerjemahan, sedangkan sifat mengerikannya muncul dari gambaran ayat ini dan konteksnya.
- source_word: ὅμοιον παρδάλει
  choice: menyerupai macan tutul
  rationale: ὅμοιος dengan datif menyatakan kemiripan. “Menyerupai macan tutul” alami dalam bahasa Indonesia dan tidak menambahkan penafsiran.
- source_word: πόδες ... ὡς ἄρκου
  choice: kaki-kakinya seperti kaki beruang
  rationale: πούς berarti kaki; pengulangan “kaki” melengkapi perbandingan eliptis Yunani dengan jelas tanpa mempersempitnya menjadi “cakar” atau “telapak”.
- source_word: στόμα ... ὡς στόμα λέοντος
  choice: mulutnya seperti mulut singa
  rationale: Pengulangan στόμα dipertahankan untuk menjaga kesejajaran dan gambaran hidup dalam teks sumber.
- source_word: δράκων
  choice: naga
  rationale: Padanan langsung dan baku bagi tokoh apokaliptik δράκων dalam Wahyu.
- source_word: ἔδωκεν
  choice: memberikan
  rationale: Menerjemahkan tindakan memberi secara langsung; bentuk aktif mempertahankan naga sebagai pelaku.
- source_word: δύναμιν
  choice: kekuatan
  rationale: Menunjuk pada daya atau kemampuan yang bekerja. “Kekuatan” membedakannya dari ἐξουσία, yaitu wewenang atau hak memerintah.
- source_word: θρόνον
  choice: takhta
  rationale: Padanan langsung yang mempertahankan konotasi kerajaan dan pemerintahan.
- source_word: ἐξουσίαν μεγάλην
  choice: wewenang yang besar
  rationale: ἐξουσία menyatakan otoritas atau hak untuk bertindak dan memerintah; “wewenang” mempertahankan perbedaannya dari δύναμις.
- source_word: αὐτοῦ
  choice: -nya
  rationale: 'Bahasa Indonesia memakai bentuk posesif -nya secara alami bagi binatang maupun naga. Acuan diperjelas oleh struktur kalimat: “kepadanya” menunjuk binatang, sedangkan “kekuatannya” dan “takhtanya” menunjuk naga sebagai subjek pemberi.'
theological_decisions:
- issue: Hubungan naga dan binatang dalam rujukan pronominal
  choice: Mempertahankan pronomina -nya dan membiarkan sintaksis menunjukkan bahwa naga memberikan milik naga kepada binatang.
  alternative: Mengulang “naga itu” pada setiap unsur, misalnya “kekuatan naga itu dan takhta naga itu”.
  rationale: Bahasa Yunani memakai pronomina yang sama, dan bahasa Indonesia tidak membedakan gender pada pronomina. Pengulangan nomina akan memperjelas tetapi juga memperberat teks melebihi bentuk sumber.
- issue: Gambaran gabungan macan tutul, beruang, dan singa
  choice: Menerjemahkan semua perbandingan secara langsung tanpa memasukkan tafsiran Daniel 7 ke dalam teks utama.
  alternative: Menambahkan dalam teks bahwa gambaran ini mengacu pada penglihatan Daniel.
  rationale: Teks Yunani menyajikan gambaran tersebut tanpa penjelasan. Gema Daniel 7 layak dicatat dalam catatan kaki, bukan dijadikan bagian dari terjemahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan pengulangan penting dalam teks Yunani. “Macan tutul” dipilih sebagai nama hewan yang umum dipahami; “wewenang” menjaga perbedaan makna dari “kekuatan”.
