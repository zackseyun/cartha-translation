id: REV.13.18
reference: Revelation 13:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὧδε ἡ σοφία ἐστίν· ὁ ἔχων νοῦν ψηφισάτω τὸν ἀριθμὸν τοῦ θηρίου, ἀριθμὸς γὰρ ἀνθρώπου ἐστίν· καὶ ὁ ἀριθμὸς ⸀αὐτοῦ ⸂ἑξακόσιοι ἑξήκοντα ἕξ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/018.yaml
  text: 'Here is wisdom: let the one who has understanding calculate the number of the beast[a], for it is the number of a man[b], and its number is six hundred sixty-six.'
translation:
  language: id
  text: 'Di sinilah letak hikmat: orang yang memiliki pengertian hendaklah menghitung bilangan binatang itu, sebab bilangan itu adalah bilangan seorang manusia[a], dan bilangannya ialah enam ratus enam puluh enam.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebab bilangan itu adalah bilangan manusia” atau “suatu bilangan manusiawi.”
    reason: alternative_reading
  - marker: b
    text: Beberapa naskah memuat 616, bukan 666.
    reason: textual_variant
lexical_decisions:
- source_word: ὧδε ἡ σοφία ἐστίν
  choice: Di sinilah letak hikmat
  rationale: Ungkapan ini mempertahankan daya tunjuk ὧδε dan menyampaikan konstruksi Yunani secara alami dalam bahasa Indonesia tanpa menambahkan penafsiran tentang jenis hikmat yang dimaksud.
- source_word: ὁ ἔχων νοῦν
  choice: orang yang memiliki pengertian
  rationale: νοῦς dalam konteks ini menunjuk pada kemampuan memahami atau membedakan, bukan sekadar pikiran sebagai organ mental; bentuk tunggal substantival tetap dipertahankan.
- source_word: ψηφισάτω
  choice: hendaklah menghitung
  rationale: Bentuk imperatif ini memerintahkan tindakan menghitung atau memperhitungkan suatu bilangan. 'Menghitung' alami dalam bahasa Indonesia dan sesuai dengan konteks numerik.
- source_word: τὸν ἀριθμὸν τοῦ θηρίου
  choice: bilangan binatang itu
  rationale: Bilangan dipilih untuk ἀριθμός, sedangkan 'binatang itu' mempertahankan rujukan tertentu kepada θηρίον dalam penglihatan Wahyu.
- source_word: ἀριθμὸς γὰρ ἀνθρώπου ἐστίν
  choice: sebab bilangan itu adalah bilangan seorang manusia
  rationale: Konstruksi genitif ἀνθρώπου dapat menunjuk kepada seorang manusia tertentu atau memiliki nuansa yang lebih umum. Terjemahan utama mempertahankan bentuk tunggal tanpa menetapkan identitas orang tersebut; kemungkinan nuansa umum dicatat dalam catatan kaki.
- source_word: καὶ ὁ ἀριθμὸς αὐτοῦ
  choice: dan bilangannya ialah
  rationale: Akhiran posesif '-nya' secara alami merujuk kembali kepada binatang itu dan tidak memaksakan gender yang tidak ditandai dalam bahasa Indonesia.
- source_word: ἑξακόσιοι ἑξήκοντα ἕξ
  choice: enam ratus enam puluh enam
  rationale: Padanan langsung dan baku bagi angka 666 dalam bahasa Indonesia modern.
theological_decisions:
- issue: Makna ἀνθρώπου dalam ἀριθμὸς γὰρ ἀνθρώπου ἐστίν
  choice: bilangan seorang manusia
  alternative: bilangan manusia; suatu bilangan manusiawi
  rationale: Genitif tunggal ini tidak dengan sendirinya memastikan apakah yang dimaksud adalah seorang manusia tertentu, umat manusia secara umum, atau sifat manusiawi. Teks utama mempertahankan bentuk tunggal, sedangkan catatan kaki menjaga kemungkinan makna umum agar ketegangan penafsirannya tidak dihapus.
- issue: Varian tekstual pada angka binatang
  choice: enam ratus enam puluh enam (666) dalam teks utama
  alternative: enam ratus enam belas (616)
  rationale: Bacaan 666 didukung oleh teks utama SBLGNT dan tradisi manuskrip yang dominan; varian 616 cukup penting untuk dicatat tanpa menggantikan bacaan utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan imperatif dengan 'hendaklah' mempertahankan nada seruan, sementara istilah 'bilangan' dipakai secara konsisten untuk ἀριθμός. Setiap catatan kaki ditempatkan tepat sesudah unsur yang dijelaskannya.
