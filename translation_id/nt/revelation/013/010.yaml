id: REV.13.10
reference: Revelation 13:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἴ τις ⸂εἰς αἰχμαλωσίαν, εἰς αἰχμαλωσίαν⸃ ὑπάγει· εἴ τις ἐν μαχαίρῃ ⸀ἀποκτανθῆναι αὐτὸν ἐν μαχαίρῃ ἀποκτανθῆναι. ὧδέ ἐστιν ἡ ὑπομονὴ καὶ ἡ πίστις τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/010.yaml
  text: If anyone is for captivity[a], into captivity he goes; if anyone is to be killed with the sword, with the sword he must be killed[c][b]. Here is the endurance and the faith of the saints.
translation:
  language: id
  text: Jika seseorang ditentukan untuk penawanan, ke dalam penawanan ia pergi[a]; jika seseorang harus dibunuh dengan pedang, dengan pedang ia harus dibunuh[b]. Di sinilah ketekunan dan iman[c] orang-orang kudus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jika seseorang pergi ke dalam penawanan, ke dalam penawanan ia pergi.” Baris ini juga dapat dipahami sebagai pernyataan tentang nasib yang telah ditetapkan, bukan sebagai perintah.
    reason: alternative_reading
  - marker: b
    text: Sejumlah naskah atau bentuk teks berbeda pada klausa ini, termasuk yang berbunyi, “Jika seseorang membunuh dengan pedang, ia harus dibunuh dengan pedang.” Terjemahan utama mengikuti teks yang dipakai di sini, tetapi varian tersebut penting bagi penafsiran.
    reason: textual_variant
  - marker: c
    text: Atau, “kesetiaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τις
  choice: jika seseorang
  rationale: Ungkapan syarat tak tentu yang menyatakan prinsip umum; pilihan ini alami dalam bahasa Indonesia dan mempertahankan cakupan generiknya.
- source_word: εἰς αἰχμαλωσίαν ... ὑπάγει
  choice: ditetapkan untuk menjadi tawanan, sebagai tawanan ia pergi
  rationale: Mempertahankan nuansa tujuan atau nasib yang ditetapkan serta pengulangan retoris tentang penawanan, sambil mengungkapkan konstruksi Yunani yang eliptis dalam bahasa Indonesia yang wajar.
- source_word: αἰχμαλωσία
  choice: menjadi tawanan / sebagai tawanan
  rationale: Menunjukkan keadaan dibawa ke dalam penawanan; lebih alami daripada kata benda abstrak 'penawanan' dalam susunan kalimat ini.
- source_word: ἐν μαχαίρῃ
  choice: dengan pedang
  rationale: Menyampaikan makna instrumental dan mempertahankan gema bahasa penghukuman alkitabiah.
- source_word: ἀποκτανθῆναι
  choice: harus dibunuh
  rationale: Infinitif pasif diterjemahkan secara jelas, dengan 'harus' menyampaikan keniscayaan dalam konstruksi eliptis tersebut tanpa mengubahnya menjadi perintah kepada pembaca.
- source_word: αὐτόν
  choice: ia
  rationale: Pronomina objek dalam susunan Yunani yang janggal dialihkan menjadi subjek kalimat pasif Indonesia agar jelas dan tetap setia pada maknanya.
- source_word: ὧδέ ἐστιν
  choice: Di sinilah
  rationale: Ungkapan penunjuk yang alami dan tegas dalam bahasa Indonesia, yang mengarahkan perhatian kepada tuntutan ketekunan dan iman.
- source_word: ὑπομονή
  choice: ketekunan
  rationale: Menyatakan ketabahan yang terus bertahan di bawah penderitaan; istilah ini alami dan lazim dalam konteks Wahyu.
- source_word: πίστις
  choice: iman
  rationale: Mempertahankan arti utama istilah tersebut tanpa menutup kemungkinan nuansa 'kesetiaan', yang dicatat dalam catatan kaki.
- source_word: τῶν ἁγίων
  choice: orang-orang kudus
  rationale: Sebutan ringkas dan dikenal bagi umat Allah yang dikuduskan, sesuai pemakaian istilah ini dalam kitab Wahyu.
theological_decisions:
- issue: 'Makna dua klausa pertama: keniscayaan atau nasib penghakiman versus perintah'
  choice: Pernyataan deskriptif tentang nasib yang ditetapkan
  alternative: Perintah agar orang percaya tidak melawan dengan kekerasan, atau prinsip pembalasan bahwa penawan dan pembunuh akan mengalami nasib serupa
  rationale: Teks Yunani yang dipakai bersifat ringkas dan paling wajar dibaca sebagai pernyataan pepatah tentang apa yang harus terjadi. Terjemahan tidak memasukkan ajaran lengkap tentang pasifisme atau pembalasan yang tidak dinyatakan secara eksplisit oleh bentuk teks ini.
- issue: Nuansa πίστις dalam klausa penutup
  choice: iman
  alternative: kesetiaan
  rationale: Kata 'iman' mempertahankan arti leksikal utama, sedangkan konteks ketekunan dalam penindasan memungkinkan nuansa 'kesetiaan'; alternatif itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Pengulangan 'sebagai tawanan' serta 'dengan pedang' dipertahankan untuk mencerminkan pola retoris teks Yunani. Konstruksi eliptis dijernihkan secukupnya tanpa menghapus ambiguitas tekstual dan teologis, yang dijelaskan melalui catatan kaki.
