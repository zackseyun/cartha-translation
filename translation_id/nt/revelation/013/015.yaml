id: REV.13.15
reference: Revelation 13:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐδόθη ⸀αὐτῷ ⸂δοῦναι πνεῦμα⸃ τῇ εἰκόνι τοῦ θηρίου, ἵνα καὶ λαλήσῃ ἡ εἰκὼν τοῦ θηρίου καὶ ποιήσῃ ⸀ἵνα ὅσοι ἐὰν μὴ προσκυνήσωσιν τῇ εἰκόνι τοῦ θηρίου ἀποκτανθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/015.yaml
  text: And it was given to him to give breath to the image of the beast[b][a], so that the image of the beast might even speak and cause those who would not worship the image of the beast to be killed.
translation:
  language: id
  text: Kepadanya diberi kuasa untuk memberi napas kepada gambaran binatang itu[a], sehingga gambaran binatang itu bahkan dapat berbicara dan menyebabkan setiap orang yang tidak menyembah gambaran binatang itu dibunuh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “memberi roh kepada gambaran binatang itu” atau “memberi kehidupan kepada gambaran binatang itu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “dan membuat agar setiap orang yang tidak menyembah gambaran binatang itu dibunuh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτῷ
  choice: Kepadanya diberikan kemampuan
  rationale: Mempertahankan bentuk pasif dan tidak menyebut siapa pemberinya, sambil mengungkapkan secara wajar bahwa yang diberikan adalah kemampuan atau izin untuk melakukan tindakan berikutnya.
- source_word: δοῦναι πνεῦμα
  choice: memberi napas
  rationale: πνεῦμα dapat berarti napas, roh, atau daya hidup. Dalam konteks patung yang dibuat dapat berbicara, 'napas' mempertahankan gambaran penghidupan tanpa memastikan bahwa patung itu menerima roh pribadi atau kehidupan sejati.
- source_word: εἰκών
  choice: patung
  rationale: Dalam konteks objek pemujaan yang diberi napas dan berbicara, 'patung' lebih alami dan konkret dalam bahasa Indonesia daripada 'gambar', tanpa menentukan bahan atau bentuknya secara lebih sempit.
- source_word: θηρίον
  choice: binatang
  rationale: Istilah apokaliptik yang mapan dan cukup netral; 'monster' akan lebih interpretatif.
- source_word: ἵνα καὶ λαλήσῃ
  choice: sehingga ... bahkan dapat berbicara
  rationale: 'Menyampaikan tujuan atau hasil konstruksi ἵνα dan daya kejut καί: patung itu sampai dapat berbicara.'
- source_word: ποιήσῃ ἵνα
  choice: menyebabkan
  rationale: Mengungkapkan daya kausatif konstruksi Yunani secara alami dalam bahasa Indonesia.
- source_word: ὅσοι ἐὰν μὴ προσκυνήσωσιν
  choice: semua orang yang tidak mau menyembah
  rationale: Menyampaikan cakupan umum ὅσοι ἐάν dan, dalam konteks tuntutan pemujaan, ketidakpatuhan atau penolakan yang tersirat.
- source_word: ἀποκτανθῶσιν
  choice: dibunuh
  rationale: Mempertahankan bentuk pasif secara ringkas dan jelas tanpa menambahkan pelaku pembunuhan.
theological_decisions:
- issue: Makna πνεῦμα dalam penghidupan patung binatang
  choice: napas
  alternative: roh; hidup; daya hidup
  rationale: '''Napas'' menjaga hubungan dengan patung yang dibuat berbicara serta gema penghidupan, tetapi tidak menyatakan secara tegas bahwa patung itu menerima roh pribadi atau kehidupan ilahi.'
- issue: Pelaku pada bentuk pasif ἐδόθη
  choice: dibiarkan tidak disebutkan
  alternative: menyebut Allah, naga, atau Iblis sebagai pemberi
  rationale: Teks Yunani tidak menyebut pelakunya; terjemahan mempertahankan ambiguitas mengenai sumber izin atau kemampuan itu.
- issue: Hakikat εἰκών
  choice: patung
  alternative: gambar; rupa; citra
  rationale: Konteks pemujaan dan animasi mendukung objek kultis konkret, tetapi terjemahan tidak menjelaskan apakah ini berhala, patung tertentu, atau jenis representasi lainnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan jelas. Struktur pasif dipertahankan untuk menjaga pelaku yang tidak disebutkan. 'Patung' dipilih agar εἰκών tidak disalahpahami sebagai gambar dua dimensi dalam konteks ini; catatan kaki mempertahankan keluasan makna πνεῦμα dan alternatif konstruksi kausatif.
