id: REV.13.3
reference: Revelation 13:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ μίαν ἐκ τῶν κεφαλῶν αὐτοῦ ⸀ὡς ἐσφαγμένην εἰς θάνατον, καὶ ἡ πληγὴ τοῦ θανάτου αὐτοῦ ἐθεραπεύθη. καὶ ⸀ἐθαυμάσθη ⸂ὅλη ἡ γῆ⸃ ὀπίσω τοῦ θηρίου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/003.yaml
  text: And one of its heads was as if slaughtered to death[a], and its deadly wound was healed. And the whole earth marveled and followed after the beast[b],
translation:
  language: id
  text: Dan salah satu kepalanya tampak seperti telah disembelih sampai mati[a], tetapi luka yang mematikannya itu disembuhkan. Seluruh bumi pun takjub lalu mengikuti binatang itu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seolah-olah telah disembelih sampai mati.” Kata Yunani yang diterjemahkan “seperti” dapat menunjukkan penampakan atau kemiripan, bukan pernyataan langsung bahwa hal itu benar-benar terjadi.
    reason: lexical_alternative
  - marker: b
    text: Atau, “seluruh negeri,” meskipun dalam konteks apokaliptik ini “seluruh bumi” lebih mungkin.
    reason: lexical_alternative
lexical_decisions:
- source_word: μίαν ἐκ τῶν κεφαλῶν αὐτοῦ
  choice: salah satu kepalanya
  rationale: Konstruksi partitif μίαν ἐκ dengan bentuk jamak secara alami berarti satu dari antara kepala-kepalanya.
- source_word: ὡς ἐσφαγμένην εἰς θάνατον
  choice: tampak seperti telah disembelih sampai mati
  rationale: Ungkapan ini mempertahankan unsur kemiripan atau penampakan dalam ὡς, kekuatan kata σφάζω, dan penegasan kematian dalam εἰς θάνατον.
- source_word: ἡ πληγὴ τοῦ θανάτου αὐτοῦ
  choice: luka mautnya itu
  rationale: Ungkapan Indonesia yang ringkas dan wajar untuk luka yang bersifat mematikan, tanpa memastikan bahwa kematiannya sungguh-sungguh terjadi.
- source_word: ἐθεραπεύθη
  choice: disembuhkan
  rationale: Bentuk pasif θεραπεύω menyatakan pemulihan luka; 'disembuhkan' adalah padanan langsung dan jelas.
- source_word: ἐθαυμάσθη
  choice: takjub
  rationale: Menyampaikan rasa heran atau kagum yang kuat tanpa menentukan apakah tanggapan tersebut positif atau negatif.
- source_word: ὅλη ἡ γῆ
  choice: seluruh bumi
  rationale: γῆ dapat berarti bumi atau negeri, tetapi cakupan apokaliptik ayat ini lebih mendukung 'seluruh bumi'.
- source_word: ὀπίσω τοῦ θηρίου
  choice: mengikuti binatang itu
  rationale: Dalam konteks ini, ungkapan tersebut menyiratkan gerak mengikuti sekaligus keberpihakan; 'mengikuti' menyampaikan keduanya secara alami dalam bahasa Indonesia.
- source_word: θηρίου
  choice: binatang itu
  rationale: Padanan baku dan transparan bagi θηρίον dalam gambaran apokaliptik Wahyu.
theological_decisions:
- issue: Hakikat kematian dan pemulihan binatang itu
  choice: Menggambarkan satu kepala yang tampak telah disembelih sampai mati dan luka maut yang disembuhkan, tanpa menjelaskan hakikat peristiwanya.
  alternative: Menafsirkannya secara khusus sebagai kebangkitan harfiah, pemulihan kekuasaan politik, atau tipu daya yang direkayasa.
  rationale: Bahasa Yunani memakai ὡς untuk kemiripan atau penampakan, lalu menyatakan bahwa luka mautnya disembuhkan. Teks tidak menuntaskan apakah peristiwa itu harfiah, simbolis, atau menipu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan jelas. 'Disembelih' mempertahankan kekuatan gambaran σφάζω; 'tampak seperti' menjaga ambiguitas ὡς. Tanda koma akhir dipertahankan karena ayat ini berlanjut secara sintaksis ke ayat berikutnya.
