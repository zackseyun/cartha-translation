  naturalness: Bahasa draft pada umumnya baku dan alami. Penggantian “luka mautnya itu” dengan “luka yang mematikannya” meningkatkan kejelasan tanpa mengurangi gaya khidmat. “Takjub lalu mengikuti” dapat dipertahankan sebagai susunan Indonesia yang wajar untuk respons takjub yang diikuti oleh tindakan mengikut.
  terminology: “Disembelih” adalah padanan yang tepat dan kuat untuk ἐσφαγμένην; “binatang” tepat untuk θηρίον dalam citra apokaliptik; “seluruh bumi” sesuai konteks. “Luka yang mematikannya” adalah istilah yang lebih transparan daripada “luka mautnya.”
