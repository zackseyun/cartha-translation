revisions:
- from: Ia menyesatkan orang-orang yang tinggal di bumi[a] melalui tanda-tanda yang diberikan kepadanya untuk dilakukannya di hadapan binatang itu. Ia menyuruh orang-orang yang tinggal di bumi membuat sebuah patung bagi binatang itu[b], yaitu binatang yang mempunyai luka karena pedang, tetapi tetap hidup[c].
  to: Ia menyesatkan orang-orang yang tinggal di bumi[a] melalui tanda-tanda yang diizinkan untuk dilakukannya di hadapan binatang itu. Ia menyuruh orang-orang yang tinggal di bumi membuat sebuah gambar bagi binatang itu[b], binatang yang mempunyai luka oleh pedang dan hidup[c].
  rationale: Revisi mempertahankan pasif yang tidak menyebut pemberi dalam ἐδόθη, sambil memperjelas bahwa izin untuk melakukan tanda-tanda diberikan kepada pelaku. “Gambar” menggantikan “patung” agar cakupan εἰκών tidak dipersempit; kemungkinan pembacaan sebagai patung dipertahankan dalam catatan kaki. Klausa akhir tetap memakai kala kini untuk ἔχει dan tidak memaksakan makna kebangkitan pada ἔζησεν.
