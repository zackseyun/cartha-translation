    issue: εἰκόνα diterjemahkan “patung.”
    rationale: “Patung” mungkin sesuai konteks kultis, tetapi lebih sempit daripada εἰκών, yang dapat menunjuk kepada gambar, rupa, atau representasi. Teks sumber tidak secara eksplisit menetapkan medium tiga dimensi.
  - severity: medium
    issue: “tanda-tanda yang diberikan kepadanya untuk dilakukannya” kurang tepat menangkap ἐδόθη αὐτῷ ποιῆσαι.
    rationale: Pasif Yunani menyatakan bahwa kepada subjek diberikan kemampuan atau izin untuk melakukan tanda-tanda. Susunan draf dapat dipahami sebagai pemberian tanda-tanda itu sendiri. “Yang diizinkan untuk dilakukannya” mempertahankan pasif tanpa menyebut pemberi.
  - severity: low
    issue: Catatan kaki b memakai “patung” baik dalam teks maupun alternatif.
    rationale: Setelah teks utama memakai “gambar,” alternatif yang menjelaskan kemungkinan “patung” dan bentuk literal “gambar bagi binatang itu” akan lebih berguna dan konsisten.
