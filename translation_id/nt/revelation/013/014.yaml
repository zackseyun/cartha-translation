id: REV.13.14
reference: Revelation 13:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ πλανᾷ ⸀τοὺς κατοικοῦντας ἐπὶ τῆς γῆς διὰ τὰ σημεῖα ἃ ἐδόθη αὐτῷ ποιῆσαι ἐνώπιον τοῦ θηρίου, λέγων τοῖς κατοικοῦσιν ἐπὶ τῆς γῆς ποιῆσαι εἰκόνα τῷ θηρίῳ, ⸂ὃς ἔχει⸃ τὴν πληγὴν ⸂τῆς μαχαίρης καὶ ἔζησεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/014.yaml
  text: And it deceives those who dwell on the earth because of the signs that it was given to perform in the presence of the beast[c][b][a], telling those who dwell on the earth to make an image for the beast that had the wound of the sword and yet lived.
translation:
  language: id
  text: Ia menyesatkan orang-orang yang tinggal di bumi[a] melalui tanda-tanda yang diizinkan untuk dilakukannya di hadapan binatang itu. Ia menyuruh orang-orang yang tinggal di bumi membuat sebuah gambar bagi binatang itu[b], binatang yang mempunyai luka oleh pedang dan hidup[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menipu orang-orang yang tinggal di bumi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “membuat sebuah gambar binatang itu.” Bahasa Yunani secara lebih harfiah berbunyi “sebuah gambar bagi binatang itu”; “gambar” juga dapat dipahami sebagai patung atau representasi.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “yang mempunyai luka oleh pedang dan hidup kembali.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλανᾷ
  choice: menyesatkan
  rationale: Kata ini dapat berarti menipu atau menyebabkan orang menyimpang. “Menyesatkan” alami dalam bahasa Indonesia dan mempertahankan daya tematis ungkapan ini dalam kitab Wahyu.
- source_word: κατοικοῦντας / κατοικοῦσιν ἐπὶ τῆς γῆς
  choice: orang-orang yang tinggal di bumi
  rationale: Mempertahankan bentuk verbal dan pengulangan ungkapan khas kitab Wahyu, tanpa mengubahnya menjadi sebutan abstrak.
- source_word: διὰ τὰ σημεῖα
  choice: melalui tanda-tanda
  rationale: διά dengan akusatif di sini dapat menyatakan sarana sekaligus dasar penyebab. “Melalui” mempertahankan fungsi tanda-tanda sebagai sarana penyesatan.
- source_word: σημεῖα
  choice: tanda-tanda
  rationale: Tidak menambahkan kata “ajaib”, sebab unsur itu tersirat oleh konteks tetapi tidak terdapat dalam nomina Yunani itu sendiri.
- source_word: ἐδόθη αὐτῷ ποιῆσαι
  choice: yang diberikan kepadanya untuk dilakukannya
  rationale: Mempertahankan bentuk pasif dan tidak menyebut siapa pemberinya. Bentuk ini juga menunjukkan bahwa binatang itu menerima kesempatan atau wewenang untuk melakukan tanda-tanda tersebut.
- source_word: ἐνώπιον τοῦ θηρίου
  choice: di hadapan binatang itu
  rationale: Ungkapan Indonesia yang ringkas dan alami untuk hubungan ruang yang dinyatakan oleh ἐνώπιον.
- source_word: λέγων
  choice: Ia menyuruh
  rationale: Dalam konstruksi ini, ucapan tersebut mengarahkan para penghuni bumi untuk bertindak. “Menyuruh” lebih alami daripada “berkata kepada ... untuk”, tetapi tidak sekuat “memerintahkan”.
- source_word: ποιῆσαι εἰκόνα τῷ θηρίῳ
  choice: membuat sebuah patung bagi binatang itu
  rationale: Dativus τῷ θηρίῳ paling langsung dipertahankan dengan “bagi”, yang dapat menunjukkan peruntukan atau penghormatan. “Patung” menyampaikan gambaran benda kultis secara alami dalam konteks ini.
- source_word: εἰκόνα
  choice: patung
  rationale: Dalam konteks pembuatan dan pemujaan representasi binatang, “patung” paling mudah dipahami pembaca Indonesia, meskipun kata Yunani memiliki cakupan lebih luas, termasuk gambar atau rupa.
- source_word: ὃς ἔχει τὴν πληγὴν τῆς μαχαίρης
  choice: yaitu binatang yang mempunyai luka karena pedang
  rationale: Anteseden maskulin ὃς adalah binatang, bukan patung yang berjenis feminin dalam bahasa Yunani. Pengulangan “binatang” menghilangkan ambiguitas gramatikal yang tidak ada dalam teks sumber. Bentuk “mempunyai” mempertahankan kala kini ἔχει.
- source_word: καὶ ἔζησεν
  choice: tetapi tetap hidup
  rationale: Konteks memberikan hubungan kontras antara luka oleh pedang dan kehidupan binatang itu. “Tetapi tetap hidup” menyatakan kontras tersebut tanpa memaksakan arti kebangkitan.
theological_decisions:
- issue: Implikasi bentuk pasif ἐδόθη
  choice: Mempertahankan “diberikan kepadanya” tanpa menyebut pemberi.
  alternative: “Allah memberinya kuasa” atau “ia diizinkan”
  rationale: Bentuk pasif apokaliptis dapat menyiratkan izin di bawah kedaulatan ilahi, tetapi teks tidak menyebut Allah secara eksplisit. Terjemahan tidak boleh menyelesaikan ketegangan itu.
- issue: Arti ἔζησεν setelah luka oleh pedang
  choice: “tetapi tetap hidup”
  alternative: “hidup kembali”
  rationale: Ayat ini menggambarkan kehidupan sesudah luka, tetapi tidak dengan sendirinya menuntut rumusan kebangkitan. Pilihan utama mempertahankan efek naratif tanpa memperkuat klaim teologis.
- issue: Anteseden klausa relatif ὃς ἔχει
  choice: Menjelaskan bahwa yang terluka adalah binatang itu.
  alternative: Membiarkan bentuk “patung ... yang mempunyai luka”
  rationale: Gender maskulin kata ganti relatif Yunani menunjuk kepada θηρίον menurut acuannya, bukan kepada εἰκών yang feminin. Bahasa Indonesia tidak menandai gender gramatikal, sehingga pengulangan nomina diperlukan untuk mencegah salah pengertian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat dan mudah dipahami. Pengulangan “orang-orang yang tinggal di bumi” dipertahankan karena merupakan ungkapan tematis dalam kitab Wahyu. Struktur kalimat dibagi menjadi dua agar jelas, dan “yaitu binatang” ditambahkan sebagai penjelas gramatikal, bukan informasi baru.
