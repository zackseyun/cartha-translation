id: REV.21.26
reference: Revelation 21:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ οἴσουσιν τὴν δόξαν καὶ τὴν τιμὴν τῶν ἐθνῶν εἰς αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/026.yaml
  text: and they will bring the glory and the honor of the nations into it[a].
translation:
  language: id
  text: Dan mereka akan membawa kemuliaan dan kehormatan bangsa-bangsa ke dalam kota itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Dan
  rationale: Menghubungkan ayat ini dengan uraian sebelumnya secara wajar dalam bahasa Indonesia.
- source_word: οἴσουσιν
  choice: mereka akan membawa
  rationale: Bentuk futur aktif dari φέρω menyatakan tindakan membawa sesuatu dari luar ke dalam kota.
- source_word: τὴν δόξαν
  choice: kemuliaan
  rationale: Mempertahankan makna kehormatan dan kecemerlangan yang melekat pada δόξα serta gaung teologisnya dalam kitab Wahyu.
- source_word: τὴν τιμὴν
  choice: kehormatan
  rationale: Dalam pasangan dengan δόξα, kata ini paling alami menyatakan kehormatan atau penghargaan, tanpa mempersempitnya menjadi kekayaan materi.
- source_word: τῶν ἐθνῶν
  choice: bangsa-bangsa
  rationale: ἔθνη menunjuk kepada bangsa-bangsa atau kelompok-kelompok manusia secara luas; terjemahan ini tidak memaksakan kontras Yahudi dan non-Yahudi.
- source_word: εἰς αὐτήν
  choice: ke dalam kota itu
  rationale: Pronomina feminin Yunani merujuk kepada kota Yerusalem Baru. Bahasa Indonesia tidak memiliki pronomina bergender, sehingga penyebutan ulang 'kota itu' memperjelas acuannya dan tetap alami.
theological_decisions:
- issue: Cakupan makna 'kemuliaan dan kehormatan bangsa-bangsa'
  choice: Ungkapan dipertahankan secara luas tanpa menentukan apakah yang dimaksud ialah upeti, kekayaan, kecemerlangan budaya, atau keistimewaan bangsa-bangsa yang telah dipulihkan.
  alternative: kekayaan bangsa-bangsa; kecemerlangan bangsa-bangsa; penghormatan yang diberikan bangsa-bangsa
  rationale: Teks Yunani tidak mempersempit gambaran tersebut kepada satu penafsiran eskatologis tertentu.
- issue: Acuan dan personifikasi αὐτήν
  choice: Diterjemahkan 'kota itu' sebagai acuan kepada Yerusalem Baru.
  alternative: ke dalamnya
  rationale: Bahasa Indonesia tidak menandai gender pada pronomina. Penyebutan 'kota itu' menjernihkan acuan tanpa menghilangkan atau menambahkan personifikasi feminin.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dipertahankan ringkas serta dekat dengan teks Yunani. Tidak diperlukan catatan kaki karena perbedaan gender gramatikal pada αὐτήν tidak dapat direproduksi secara alami dalam pronomina bahasa Indonesia.
