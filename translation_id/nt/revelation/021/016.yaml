reference: Revelation 21:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἡ πόλις τετράγωνος κεῖται, καὶ τὸ μῆκος αὐτῆς ⸀ὅσον τὸ πλάτος. καὶ ἐμέτρησεν τὴν πόλιν τῷ καλάμῳ ἐπὶ ⸀σταδίους δώδεκα ⸀χιλιάδων· τὸ μῆκος καὶ τὸ πλάτος καὶ τὸ ὕψος αὐτῆς ἴσα ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/016.yaml
  text: 'And the city lies foursquare[a], and its length is as great as its width. And he measured the city with the measuring rod: twelve thousand stadia[c][b]. Its length and width and height are equal.'
translation:
  language: id
  text: 'Kota itu berbentuk persegi, dan panjangnya sama dengan lebarnya. Ia mengukur kota itu dengan tongkat pengukur[a]: dua belas ribu stadia[b]. Panjang, lebar, dan tingginya sama[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dengan buluh itu.” Kata Yunani yang dipakai dapat berarti buluh, tetapi di sini buluh tersebut digunakan sebagai alat ukur.'
    reason: lexical_alternative
  - marker: b
    text: Stadia adalah satuan jarak kuno. Dua belas ribu stadia kira-kira 2.220 kilometer, bergantung pada panjang stadion yang dijadikan patokan.
    reason: cultural_note
  - marker: c
    text: Secara geometris, kesamaan ketiga dimensi ini menggambarkan sebuah kubus. Namun, teks Yunani menyatakannya langsung sebagai panjang, lebar, dan tinggi yang sama.
    reason: alternative_reading
lexical_decisions:
- source_word: τετράγωνος κεῖται
  choice: berbentuk persegi
  rationale: Ungkapan ini menggambarkan tata letak kota sebagai persegi. Pilihan ini alami dalam bahasa Indonesia modern dan tetap mempertahankan gambaran dua dimensi yang dinyatakan teks.
- source_word: τὸ μῆκος αὐτῆς ὅσον τὸ πλάτος
  choice: panjangnya sama dengan lebarnya
  rationale: ὅσον menyatakan kesetaraan ukuran; terjemahan ini lugas dan wajar dalam bahasa Indonesia.
- source_word: ἐμέτρησεν
  choice: Ia mengukur
  rationale: Bentuk aoris ini menyatakan tindakan naratif sederhana. Kata ganti 'Ia' merujuk kepada malaikat dalam konteks terdekat tanpa menambahkan sebutan yang tidak diulang dalam ayat ini.
- source_word: τῷ καλάμῳ
  choice: dengan tongkat pengukur
  rationale: κάλαμος secara harfiah dapat berarti buluh, tetapi di sini benda itu berfungsi sebagai alat ukur. 'Tongkat pengukur' menyampaikan fungsi tersebut dengan jelas.
- source_word: ἐπὶ σταδίους δώδεκα χιλιάδων
  choice: hasilnya dua belas ribu stadia
  rationale: Frasa ini memberikan hasil pengukuran. Susunan Indonesia ini tidak memaksakan apakah angka tersebut secara khusus menunjuk panjang, lebar, atau dimensi lain sebelum kalimat berikutnya menyatakan bahwa ketiganya sama.
- source_word: τὸ μῆκος καὶ τὸ πλάτος καὶ τὸ ὕψος αὐτῆς ἴσα ἐστίν
  choice: Panjang, lebar, dan tingginya sama
  rationale: Terjemahan ini secara langsung mempertahankan pernyataan Yunani bahwa ketiga dimensi itu setara, tanpa menggantinya dengan kesimpulan geometris.
theological_decisions:
- issue: Apakah satuan kuno dipertahankan atau dikonversi dalam teks utama
  choice: Mempertahankan 'dua belas ribu stadia'
  alternative: Sekitar 2.220 kilometer
  rationale: Teks Yunani memakai satuan kuno, sedangkan konversi modern bersifat perkiraan dan bergantung pada panjang stadion yang diasumsikan.
- issue: Apakah bentuk kota disebut secara eksplisit sebagai kubus
  choice: Menyatakan bahwa panjang, lebar, dan tingginya sama
  alternative: Kota itu berbentuk kubus sempurna
  rationale: Bentuk kubus merupakan kesimpulan wajar, tetapi teks Yunani sendiri menyebut kesetaraan ketiga dimensi dan tidak memakai istilah geometris 'kubus'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat jelas bagi pembaca umum, satuan kuno dipertahankan dalam teks utama, dan implikasi bentuk kubus ditempatkan dalam catatan agar tidak menggantikan rumusan sumber.
