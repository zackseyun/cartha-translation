id: REV.21.19
reference: Revelation 21:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀οἱ θεμέλιοι τοῦ τείχους τῆς πόλεως παντὶ λίθῳ τιμίῳ κεκοσμημένοι· ὁ θεμέλιος ὁ πρῶτος ἴασπις, ὁ δεύτερος σάπφιρος, ὁ τρίτος χαλκηδών, ὁ τέταρτος σμάραγδος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/019.yaml
  text: 'The foundations of the wall of the city were adorned with every kind of precious stone: the first foundation was jasper[a], the second sapphire, the third chalcedony, the fourth emerald[b],'
translation:
  language: id
  text: 'Dasar-dasar tembok kota itu dihiasi dengan segala jenis batu berharga[a]: dasar yang pertama, yaspis; yang kedua, safir; yang ketiga, kalsedon[b]; dan yang keempat, zamrud.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan setiap batu berharga.” Frasa Yunani ini dapat dipahami secara distributif, sehingga diterjemahkan “dengan segala jenis batu berharga.”
    reason: lexical_alternative
  - marker: b
    text: Kalsedon adalah sebutan tradisional untuk istilah Yunani ini; jenis tepat beberapa batu permata kuno tidak dapat dipastikan.
    reason: cultural_note
lexical_decisions:
- source_word: θεμέλιοι
  choice: dasar-dasar
  rationale: Bentuk jamak ini menunjuk pada dasar-dasar atau lapisan batu fondasi tembok kota; 'dasar-dasar' alami dalam bahasa Indonesia dan tidak menambahkan kata 'batu' secara interpretatif.
- source_word: τείχους
  choice: tembok
  rationale: Dalam konteks kota, 'tembok' menyampaikan dinding pertahanan kota dengan lebih tepat daripada 'dinding'.
- source_word: πόλεως
  choice: kota
  rationale: Padanan baku dan sesuai dengan gambaran kota eskatologis dalam konteks Wahyu.
- source_word: παντὶ λίθῳ τιμίῳ
  choice: dengan segala jenis batu berharga
  rationale: Ungkapan ini secara alami menyampaikan kemungkinan daya distributif παντί dalam bahasa Indonesia, yakni berbagai jenis batu berharga.
- source_word: κεκοσμημένοι
  choice: dihiasi
  rationale: Menyampaikan makna pasif serta keadaan hasil dari partisipel perfek tanpa membuat susunan Indonesia menjadi kaku.
- source_word: ὁ θεμέλιος ὁ πρῶτος
  choice: dasar pertama
  rationale: Mempertahankan nomina tunggal dan urutan dalam teks Yunani; konstruksi 'dari yaspis' membuat hubungan bahannya jelas secara alami.
- source_word: ἴασπις
  choice: yaspis
  rationale: Nama batu yang mapan dalam tradisi Alkitab bahasa Indonesia dan merupakan padanan langsung istilah Yunani.
- source_word: σάπφιρος
  choice: safir
  rationale: Padanan Indonesia yang lazim untuk nama batu tersebut.
- source_word: χαλκηδών
  choice: kalsedon
  rationale: Bentuk Indonesia yang lazim untuk transliterasi nama batu kuno ini; identifikasi mineralnya tidak sepenuhnya pasti.
- source_word: σμάραγδος
  choice: zamrud
  rationale: Padanan Indonesia yang mapan dan paling mungkin untuk istilah batu permata ini.
theological_decisions:
- issue: Daftar batu permata dalam gambaran apokaliptik
  choice: Nama-nama batu diterjemahkan secara langsung tanpa penafsiran simbolis dalam teks utama.
  alternative: Menghubungkan setiap batu secara eksplisit dengan suku-suku Israel, para rasul, atau perlengkapan imam.
  rationale: Ayat ini menyebut hiasan batu-batu tersebut tetapi tidak menjelaskan makna simbolis masing-masing; terjemahan mempertahankan citranya tanpa memasukkan skema teologis dari luar teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan daftar dibuat lancar bagi pembaca umum, sementara pengulangan urutan dan citra arsitektural teks Yunani dipertahankan.
