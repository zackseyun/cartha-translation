id: REV.21.1
reference: Revelation 21:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ εἶδον οὐρανὸν καινὸν καὶ γῆν καινήν· ὁ γὰρ πρῶτος οὐρανὸς καὶ ἡ πρώτη γῆ ἀπῆλθαν, καὶ ἡ θάλασσα οὐκ ἔστιν ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/001.yaml
  text: And I saw a new heaven and a new earth[a], for the first heaven and the first earth had passed away[b], and the sea is no more.
translation:
  language: id
  text: Lalu aku melihat langit yang baru dan bumi yang baru, sebab langit yang pertama[a] dan bumi yang pertama telah berlalu, dan laut pun tidak ada lagi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “langit yang terdahulu dan bumi yang terdahulu.” Ungkapan Yunani memakai “yang pertama” dan di sini dapat menunjuk pada tatanan sebelumnya, yang dikontraskan dengan tatanan baru.
    reason: lexical_alternative
  - marker: b
    text: “Laut” dapat dipahami secara harfiah, tetapi dalam kitab Wahyu laut juga dapat mengandung kaitan dengan kekacauan, bahaya, atau pemisahan.
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ εἶδον
  choice: Lalu aku melihat
  rationale: Konjungsi Καί menghubungkan penglihatan ini dengan rangkaian sebelumnya dan dalam narasi wajar diterjemahkan “Lalu”; bentuk aoris εἶδον dinyatakan dengan verba sederhana “aku melihat”.
- source_word: οὐρανὸν καινὸν καὶ γῆν καινήν
  choice: langit yang baru dan bumi yang baru
  rationale: Dalam konteks kosmis ini, οὐρανός dan γῆ menunjuk pada tatanan ciptaan. “Baru” mempertahankan arti καινός tanpa menentukan apakah yang dimaksud penggantian atau pembaruan.
- source_word: ὁ πρῶτος οὐρανὸς καὶ ἡ πρώτη γῆ
  choice: langit yang pertama dan bumi yang pertama
  rationale: “Pertama” menerjemahkan πρῶτος secara langsung dan mempertahankan kontras dengan yang baru; kemungkinan makna “terdahulu” dicatat dalam catatan kaki.
- source_word: ἀπῆλθαν
  choice: telah berlalu
  rationale: Dalam konteks ini ἀπέρχομαι menyatakan lenyapnya tatanan sebelumnya. “Telah berlalu” alami dalam bahasa Indonesia dan menunjukkan bahwa hal itu sudah terjadi dalam kaitannya dengan penglihatan Yohanes.
- source_word: ἡ θάλασσα
  choice: laut
  rationale: θάλασσα secara langsung berarti “laut”. Istilah konkret dipertahankan agar makna simbolis yang mungkin tidak dimasukkan ke dalam teks utama.
- source_word: οὐκ ἔστιν ἔτι
  choice: pun tidak ada lagi
  rationale: Ungkapan ini menyampaikan penyangkalan keberadaan yang berlanjut; partikel “pun” secara alami menandai unsur terakhir dalam rangkaian, sedangkan “tidak ada lagi” menerjemahkan οὐκ ἔστιν ἔτι dengan jelas.
theological_decisions:
- issue: Hakikat langit baru dan bumi baru
  choice: Diterjemahkan dengan “baru” tanpa menentukan apakah ciptaan lama diganti sepenuhnya atau diperbarui.
  alternative: Menafsirkannya secara eksplisit sebagai penggantian total atau sebagai pembaruan ciptaan yang sama.
  rationale: καινός menyatakan kebaruan, tetapi ayat ini sendiri tidak menyelesaikan pertanyaan tentang penggantian versus transformasi; ketegangan itu dipertahankan.
- issue: Makna tidak adanya laut
  choice: Teks utama tetap menyatakan secara konkret bahwa “laut pun tidak ada lagi”.
  alternative: Menjelaskannya dalam teks sebagai hilangnya kekacauan, bahaya, kejahatan, atau pemisahan.
  rationale: Gambaran laut dapat dibaca secara harfiah dan juga memiliki gaung simbolis dalam Wahyu. Terjemahan tidak memilih salah satunya secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti gerak narasi Yunani, tetapi tetap alami bagi pembaca umum. Pengulangan “yang baru” dan “yang pertama” dipertahankan untuk menjaga penekanan dan kesejajaran teks sumber.
