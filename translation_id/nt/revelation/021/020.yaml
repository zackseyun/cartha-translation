id: REV.21.20
reference: Revelation 21:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ πέμπτος σαρδόνυξ, ὁ ἕκτος σάρδιον, ὁ ἕβδομος χρυσόλιθος, ὁ ὄγδοος βήρυλλος, ὁ ἔνατος τοπάζιον, ὁ δέκατος χρυσόπρασος, ὁ ἑνδέκατος ὑάκινθος, ὁ δωδέκατος ἀμέθυστος·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/020.yaml
  text: the fifth[a], sardonyx; the sixth, sardius; the seventh, chrysolite; the eighth, beryl; the ninth, topaz; the tenth[b], chrysoprase; the eleventh, jacinth; the twelfth, amethyst.
translation:
  language: id
  text: yang kelima, batu sardoniks; yang keenam, batu sardis[a]; yang ketujuh, batu krisolit; yang kedelapan, batu beril; yang kesembilan, batu topas; yang kesepuluh, batu krisopras; yang kesebelas, batu yakintus[b]; dan yang kedua belas, batu kecubung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “batu karnelian”; identifikasi tepat batu permata kuno ini tidak pasti.
    reason: lexical_alternative
  - marker: b
    text: Istilah Yunani ini menunjuk pada batu permata, bukan bunga; identifikasi tepatnya tidak pasti dan namanya juga dapat ditransliterasikan “hiasintus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: σαρδόνυξ
  choice: batu sard oniks
  rationale: Menggunakan nama batu permata tradisional yang dekat dengan transliterasi Yunani dan membedakannya dari σάρδιον.
- source_word: σάρδιον
  choice: batu sardis
  rationale: Mempertahankan nama tradisional karena identifikasi tepat batu permata kuno ini tidak pasti; 'karnelian' dicatat sebagai kemungkinan.
- source_word: χρυσόλιθος
  choice: batu krisolit
  rationale: Nama batu permata konvensional lebih jelas daripada terjemahan etimologis harfiah 'batu emas'.
- source_word: βήρυλλος
  choice: batu beril
  rationale: Padanan baku dalam bahasa Indonesia untuk nama batu permata tersebut.
- source_word: τοπάζιον
  choice: batu topas
  rationale: Padanan baku dan mudah dikenali dalam bahasa Indonesia.
- source_word: χρυσόπρασος
  choice: batu krisopras
  rationale: Memakai nama mineral yang lazim, bukan penjelasan etimologis yang akan terdengar janggal.
- source_word: ὑάκινθος
  choice: batu yakintus
  rationale: Transliterasi nama batu permata kuno dipilih untuk menghindari kesan bahwa yang dimaksud adalah bunga; identifikasi mineralnya tidak sepenuhnya pasti.
- source_word: ἀμέθυστος
  choice: batu kecubung
  rationale: Padanan Indonesia yang alami dan umum untuk amethyst.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat. Pola berulang 'yang kelima ... yang kedua belas' mempertahankan irama daftar Yunani. Kata 'batu' ditambahkan sebelum setiap nama mineral agar daftar jelas bagi pembaca umum. Perlu koreksi tipografis pada 'sard oniks' menjadi 'sardoniks' dalam teks final.
