  text: καὶ περιπατήσουσιν τὰ ἔθνη διὰ τοῦ φωτὸς αὐτῆς· καὶ οἱ βασιλεῖς τῆς γῆς φέρουσιν ⸂τὴν δόξαν αὐτῶν⸃ εἰς αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/024.yaml
  text: And the nations will walk by its light[c][b][a], and the kings of the earth will bring their glory into it.
translation:
  language: id
  text: Bangsa-bangsa akan berjalan dalam cahaya kota itu[a], dan raja-raja bumi akan membawa kemuliaan mereka[b] ke dalamnya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melalui cahaya kota itu.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “semarak mereka” atau “kehormatan mereka.”
    reason: lexical_alternative
  - marker: c
    text: Maksudnya, ke dalam kota itu. Dalam bahasa Yunani, pronomina yang dipakai berbentuk feminin karena kata “kota” berjenis gramatikal feminin.
    reason: referent_clarification
lexical_decisions:
- source_word: περιπατήσουσιν
  choice: akan berjalan
  rationale: Mempertahankan gambaran konkret tentang bangsa-bangsa yang berjalan, bukan mengubahnya menjadi ungkapan abstrak seperti ‘akan hidup’.
- source_word: τὰ ἔθνη
  choice: bangsa-bangsa
  rationale: Menyampaikan arti kolektif politis-etnis dan mempertahankan gema nubuat Perjanjian Lama dalam penglihatan ini.
- source_word: διὰ τοῦ φωτὸς αὐτῆς
  choice: oleh cahaya kota itu
  rationale: διά dengan genitif menyatakan sarana; ‘oleh’ mempertahankan bahwa cahaya kota menjadi sarana bagi bangsa-bangsa untuk berjalan. Referen pronomina dibuat jelas sebagai kota agar alami dalam bahasa Indonesia.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: raja-raja bumi
  rationale: Merupakan padanan langsung dan wajar bagi ungkapan apokaliptik yang berulang dalam kitab Wahyu.
- source_word: φέρουσιν
  choice: akan membawa
  rationale: Walaupun bentuk Yunani adalah kala kini, dalam rangkaian penglihatan ini tindakan tersebut dipahami sejalan dengan verba futur sebelumnya; ‘akan’ membuat hubungan itu jelas dan alami dalam bahasa Indonesia.
- source_word: τὴν δόξαν αὐτῶν
  choice: kemuliaan mereka
  rationale: ‘Kemuliaan’ mempertahankan keluasan makna δόξα serta gema teologis dan profetisnya; ‘semarak’ dan ‘kehormatan’ tetap dicatat sebagai kemungkinan.
- source_word: εἰς αὐτήν
  choice: ke dalamnya
  rationale: Mempertahankan arah masuk yang dinyatakan εἰς dan merujuk kepada kota tanpa menambahkan personifikasi berjenis kelamin yang tidak dimiliki pronomina bahasa Indonesia.
theological_decisions:
- issue: Referen dan personifikasi pronomina feminin bagi Yerusalem Baru
  choice: Memakai ‘kota itu’ dan pronomina netral ‘-nya’, dengan kota sebagai referennya.
  alternative: Memakai bentuk yang lebih mempersonifikasikan kota sebagai perempuan atau pengantin.
  rationale: Konteks luas memang menggambarkan Yerusalem Baru sebagai pengantin, tetapi klausa ini terutama memakai gambaran kota dan ruang. Bahasa Indonesia tidak menandai gender pada pronomina, sehingga bentuk netral mempertahankan referen tanpa memperkuat personifikasi secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mempertahankan citra prosesi dan kesejajaran kedua klausa, sambil memperjelas bahwa cahaya tersebut adalah cahaya kota.
