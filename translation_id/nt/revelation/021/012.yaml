  terminology: “Tembok,” “pintu gerbang,” “malaikat,” “terukir,” dan “suku” merupakan padanan yang tepat. “Putra-putra Israel” mempertahankan istilah familial maskulin dari υἱῶν tanpa mengubahnya menjadi kategori “keturunan.”
