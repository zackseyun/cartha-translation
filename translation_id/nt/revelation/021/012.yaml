  text: ἔχουσα τεῖχος μέγα καὶ ὑψηλόν, ἔχουσα πυλῶνας δώδεκα, καὶ ἐπὶ ⸂τοῖς πυλῶσιν⸃ ἀγγέλους δώδεκα, καὶ ὀνόματα ἐπιγεγραμμένα ἅ ⸀ἐστιν τῶν δώδεκα ⸀φυλῶν υἱῶν Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/012.yaml
  text: having a great and high wall, having twelve gates, and at the gates twelve angels, and names inscribed, which are those of the twelve tribes of the sons of Israel.
translation:
  language: id
  text: Kota itu memiliki tembok yang besar dan tinggi, serta dua belas pintu gerbang. Pada pintu-pintu gerbang itu ada dua belas malaikat dan nama-nama yang terukir, yakni nama-nama kedua belas suku putra-putra Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara tradisional: “kedua belas suku bani Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχουσα
  choice: memiliki
  rationale: Partisip feminin tunggal ini menerangkan kota pada ayat sebelumnya. Dalam bahasa Indonesia, verba finit “memiliki” menghasilkan deskripsi yang alami sambil mempertahankan hubungan sintaksisnya.
- source_word: τεῖχος μέγα καὶ ὑψηλόν
  choice: tembok yang besar dan tinggi
  rationale: Mempertahankan kedua sifat tembok secara tersendiri dan dekat dengan susunan Yunani.
- source_word: πυλῶνας δώδεκα
  choice: dua belas pintu gerbang
  rationale: “Pintu gerbang” merupakan padanan Indonesia yang alami untuk pintu masuk monumental sebuah kota.
- source_word: ἐπὶ τοῖς πυλῶσιν
  choice: pada pintu-pintu gerbang itu
  rationale: ἐπί dengan datif bersifat lokatif di sini; “pada” tidak mengharuskan pengertian bahwa para malaikat berdiri di atas gerbang.
- source_word: ἀγγέλους δώδεκα
  choice: dua belas malaikat
  rationale: Padanan langsung dan lazim tanpa alasan kontekstual untuk memparafrasakannya.
- source_word: ὀνόματα ἐπιγεγραμμένα
  choice: nama-nama yang terukir
  rationale: ἐπιγεγραμμένα menyatakan sesuatu yang dituliskan pada suatu permukaan; “terukir” cocok dengan konteks arsitektur monumental.
- source_word: ἅ ἐστιν τῶν δώδεκα φυλῶν
  choice: yaitu nama kedua belas suku
  rationale: Klausa relatif mengidentifikasi nama-nama tersebut. Pengulangan “nama” membuat hubungan itu jelas dan alami dalam bahasa Indonesia tanpa menambah rujukan baru.
- source_word: υἱῶν Ἰσραήλ
  choice: keturunan Israel
  rationale: Dalam sebutan kolektif ini, “keturunan Israel” menyampaikan hubungan genealogis υἱῶν secara wajar dalam bahasa Indonesia; padanan lebih harfiah dicatat dalam catatan kaki.
theological_decisions:
- issue: Pemadanan υἱῶν Ἰσραήλ sebagai sebutan kolektif perjanjian
  choice: keturunan Israel
  alternative: anak-anak lelaki Israel
  rationale: Bahasa Yunani secara harfiah memakai “anak-anak lelaki”, tetapi dalam ungkapan kolektif ini istilah tersebut menunjuk kepada keturunan Israel. Teks utama memakai bentuk Indonesia yang alami, sedangkan bentuk harfiah dipertahankan dalam catatan agar nuansa sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kalimat panjang Yunani dibagi menjadi dua agar jelas bagi pembaca umum, sementara pengulangan angka dua belas dan gambaran arsitekturnya tetap dipertahankan.
