id: REV.21.5
reference: Revelation 21:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ εἶπεν ὁ καθήμενος ἐπὶ τῷ θρόνῳ· Ἰδοὺ ⸂καινὰ ποιῶ πάντα⸃. καὶ ⸀λέγει· Γράψον, ὅτι οὗτοι οἱ λόγοι ⸂πιστοὶ καὶ ἀληθινοί⸃ εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/005.yaml
  text: And the one seated on the throne said[a], “Behold, I am making all things new.” And he said, “Write[b], because these words are trustworthy and true.”
translation:
  language: id
  text: Dia yang duduk di atas takhta itu berkata, “Lihatlah, Aku menjadikan[a] segala sesuatu baru.” Lalu Dia berkata, “Tuliskanlah, sebab kata-kata ini dapat dipercaya[b] dan benar.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “sedang menjadikan.” Bentuk kini Yunani dapat menyoroti tindakan yang sedang berlangsung, tetapi dalam konteks ini juga dapat berfungsi sebagai pernyataan yang tegas tanpa penekanan khusus pada prosesnya.
    reason: verbal_aspect_alternative
  - marker: b
    text: Atau “setia.” Dalam hubungan dengan “kata-kata,” kata Yunani ini menyatakan bahwa kata-kata tersebut andal dan layak dipercayai.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καθήμενος ἐπὶ τῷ θρόνῳ
  choice: Dia yang duduk di atas takhta itu
  rationale: Mempertahankan gambaran partisipel kini tentang Sang Pembicara yang bertakhta, dengan susunan yang wajar dan khidmat dalam bahasa Indonesia.
- source_word: Ἰδοὺ
  choice: Lihatlah
  rationale: Menyampaikan seruan yang mengarahkan perhatian sekaligus mempertahankan kekuatan dan kekhidmatan ujaran apokaliptis.
- source_word: καινὰ
  choice: baru
  rationale: Menyatakan kebaruan tanpa menentukan apakah yang dimaksud ialah penggantian mutlak atau pembaruan secara menyeluruh.
- source_word: ποιῶ
  choice: Aku menjadikan
  rationale: Menerjemahkan ποιέω secara langsung tanpa menambahkan nuansa khusus 'menciptakan'; bentuk kini Yunani tetap dapat dipahami sebagai tindakan yang sedang berlangsung atau pernyataan umum.
- source_word: πάντα
  choice: segala sesuatu
  rationale: Ungkapan Indonesia yang alami dan menyeluruh untuk bentuk netral jamak, tanpa mempersempit cakupannya.
- source_word: Γράψον
  choice: Tuliskanlah
  rationale: Mempertahankan perintah langsung; bentuk ini alami dalam konteks perintah untuk mencatat suatu penyataan tanpa harus menambahkan objek yang tidak dinyatakan.
- source_word: ὅτι
  choice: sebab
  rationale: Menampilkan hubungan alasan antara perintah untuk menulis dan sifat perkataan-perkataan tersebut, dengan gaya yang ringkas dan khidmat.
- source_word: οὗτοι οἱ λόγοι
  choice: perkataan-perkataan ini
  rationale: Merujuk pada ucapan atau penyataan yang diberikan, sekaligus mempertahankan bentuk jamak yang eksplisit.
- source_word: πιστοὶ
  choice: dapat dipercaya
  rationale: Dalam hubungannya dengan 'perkataan-perkataan', ungkapan ini secara alami menyatakan bahwa perkataan tersebut andal dan layak dipercayai.
- source_word: ἀληθινοί
  choice: benar
  rationale: Padanan langsung yang mempertahankan penegasan bahwa perkataan-perkataan itu sesuai dengan kebenaran.
theological_decisions:
- issue: Cakupan dan sifat pembaruan akhir zaman dalam καινὰ ποιῶ πάντα
  choice: Aku menjadikan segala sesuatu baru
  alternative: Aku sedang menjadikan segala sesuatu baru; Aku membuat semuanya baru
  rationale: Pilihan ini mempertahankan cakupan menyeluruh πάντα dan tidak memutuskan apakah pembaruan tersebut berarti penggantian atau transformasi. Bentuk yang dipilih juga tidak memaksakan aspek progresif secara berlebihan, sementara catatan kaki menjaga kemungkinan itu.
- issue: Penyebutan Sang Pembicara ilahi melalui gambaran takhta
  choice: Dia yang duduk di atas takhta itu
  alternative: Dia yang bertakhta
  rationale: Terjemahan ini mempertahankan citra konkret teks Yunani dan tidak menambahkan identifikasi doktrinal yang tidak disebutkan secara eksplisit dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Kapitalisasi kata ganti untuk Sang Pembicara dipakai sebagai konvensi hormat bahasa Indonesia, tanpa menambahkan identifikasi yang tidak tersurat. Pengulangan 'perkataan-perkataan' mempertahankan bentuk jamak sumber meskipun 'perkataan ini' juga mungkin secara idiomatis.
