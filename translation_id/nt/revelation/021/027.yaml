  terminology: “Najis,” “kekejian,” “kepalsuan,” “kitab kehidupan,” dan “Anak Domba” mempertahankan register apokaliptik serta nuansa kemurnian dan moral-kultis teks sumber. “Kepalsuan” tetap cukup luas untuk ψεῦδος.
