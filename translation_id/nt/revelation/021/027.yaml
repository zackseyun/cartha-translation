id: REV.21.27
reference: Revelation 21:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ οὐ μὴ εἰσέλθῃ εἰς αὐτὴν πᾶν κοινὸν καὶ ⸀ποιῶν βδέλυγμα καὶ ψεῦδος, εἰ μὴ οἱ γεγραμμένοι ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/027.yaml
  text: And nothing unclean will ever enter it[a], nor anyone who does what is detestable or false[b], but only those written in the Lamb’s book of life.
translation:
  language: id
  text: Dan tidak akan pernah masuk ke dalamnya sesuatu pun yang najis[a], juga tidak seorang pun yang melakukan kekejian dan kepalsuan[b], melainkan hanya mereka yang tertulis dalam kitab kehidupan Anak Domba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sesuatu pun yang cemar” atau “sesuatu pun yang tidak kudus.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “melakukan kekejian dan kepalsuan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ εἰσέλθῃ
  choice: sama sekali tidak akan masuk
  rationale: Konstruksi οὐ μή dengan subjungtif aoris menyatakan penyangkalan yang sangat tegas; frasa ini menyampaikan kepastian bahwa hal tersebut tidak akan terjadi.
- source_word: αὐτὴν
  choice: ke dalamnya
  rationale: Pronomina ini merujuk kepada kota, yakni Yerusalem Baru. Bentuk -nya wajar dalam bahasa Indonesia dan tidak menambahkan personifikasi.
- source_word: πᾶν κοινὸν
  choice: sesuatu pun yang najis
  rationale: Bentuk netral tunggal dengan πᾶν bersifat menyeluruh. Dalam konteks kemurnian Yahudi, κοινός dapat berarti najis, cemar, atau tidak kudus; 'najis' jelas dan tetap mempertahankan nuansa kemurnian.
- source_word: ποιῶν βδέλυγμα καὶ ψεῦδος
  choice: siapa pun yang melakukan kekejian atau kepalsuan
  rationale: Partisipel ini dipakai secara substantival untuk menunjuk orang yang melakukan hal-hal tersebut. 'Kekejian' mempertahankan bobot moral-kultis βδέλυγμα, sedangkan 'kepalsuan' mencakup ψεῦδος tanpa membatasinya hanya pada satu ucapan bohong. 'Atau' secara alami menyatakan bahwa masing-masing praktik termasuk dalam larangan, meskipun bahasa Yunani mengoordinasikannya dengan καί.
- source_word: εἰ μὴ
  choice: melainkan hanya
  rationale: Dalam konteks ini εἰ μή memperkenalkan satu-satunya pengecualian dan membentuk kontras tegas dengan kelompok yang tidak boleh masuk.
- source_word: οἱ γεγραμμένοι
  choice: mereka yang tertulis
  rationale: Partisipel pasif perfek menyatakan keadaan yang dihasilkan oleh tindakan pencatatan yang telah selesai. Terjemahan ini tidak menambahkan kata 'nama', yang tersirat oleh gambaran kitab tetapi tidak dinyatakan dalam teks Yunani.
- source_word: ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου
  choice: dalam kitab kehidupan milik Anak Domba
  rationale: '''Kitab kehidupan'' adalah ungkapan Indonesia yang mapan untuk βιβλίον τῆς ζωῆς. ''Milik Anak Domba'' mempertahankan kemungkinan genitif kepemilikan dan membuat hubungan genitif jelas tanpa mengaburkan judul kristologis tersebut.'
theological_decisions:
- issue: Cakupan hal dan orang yang dilarang masuk ke Yerusalem Baru
  choice: Mempertahankan pembedaan antara sesuatu pun yang najis dan siapa pun yang melakukan kekejian atau kepalsuan.
  alternative: Memahami seluruh klausa hanya sebagai rujukan kepada orang-orang najis.
  rationale: Teks Yunani beralih dari bentuk netral πᾶν κοινόν kepada partisipel substantival ποιῶν, sehingga baik dimensi hal yang najis maupun pelaku perbuatan terlarang patut dipertahankan.
- issue: Isi yang tercatat dalam kitab kehidupan
  choice: mereka yang tertulis
  alternative: mereka yang namanya tertulis
  rationale: Konteks kitab memang menyiratkan nama, tetapi ayat ini tidak menyebut ὀνόματα. Terjemahan tidak memasukkan unsur yang hanya tersirat atau meminjam rumusan dari ayat paralel.
- issue: Hubungan genitif τοῦ ἀρνίου
  choice: kitab kehidupan milik Anak Domba
  alternative: kitab kehidupan Anak Domba
  rationale: Rumusan eksplisit 'milik' menyampaikan pembacaan genitif posesif yang paling wajar. Terjemahan ini tidak menentukan apakah frasa tersebut juga dapat dipahami memiliki hubungan identifikasi atau asal yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat menjaga penegasan larangan, pembedaan antara hal dan pelaku, serta gambaran apokaliptik 'Anak Domba'. Semua penanda catatan kaki dicantumkan langsung dalam teks.
