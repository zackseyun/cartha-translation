id: REV.21.14
reference: Revelation 21:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ τὸ τεῖχος τῆς πόλεως ⸀ἔχων θεμελίους δώδεκα, καὶ ἐπ’ αὐτῶν δώδεκα ὀνόματα τῶν δώδεκα ἀποστόλων τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/014.yaml
  text: And the wall of the city had twelve foundations[a], and on them were the twelve names of the twelve apostles of the Lamb.
translation:
  language: id
  text: Tembok kota itu mempunyai dua belas fondasi[a], dan pada fondasi-fondasi itu terdapat dua belas nama kedua belas rasul Anak Domba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "dua belas batu fondasi." Kata Yunani θεμελίους dapat menunjuk pada fondasi atau batu fondasi dalam konteks bangunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: τεῖχος
  choice: tembok
  rationale: Dalam konteks kota, τεῖχος menunjuk pada tembok kota, khususnya tembok pertahanan; 'tembok' adalah padanan Indonesia yang alami dan tepat.
- source_word: πόλεως
  choice: kota itu
  rationale: Genitif menunjukkan bahwa tembok tersebut adalah tembok kota yang sedang digambarkan; bentuk definit 'kota itu' wajar dalam bahasa Indonesia.
- source_word: ἔχων
  choice: mempunyai
  rationale: Partisipel Yunani secara harfiah berarti 'mempunyai'. Bentuk verba finit ini menghasilkan kalimat Indonesia yang alami sambil mempertahankan hubungan deskriptifnya.
- source_word: θεμελίους δώδεκα
  choice: dua belas dasar
  rationale: θεμέλιος dapat berarti dasar/fondasi ataupun batu dasar. 'Dasar' mempertahankan gambaran arsitektural dengan bahasa yang ringkas, sedangkan kemungkinan 'batu dasar' dicatat dalam catatan kaki.
- source_word: ἐπ’ αὐτῶν
  choice: pada dasar-dasar itu
  rationale: ἐπί dengan genitif menyatakan posisi pada atau di atas dasar-dasar tersebut. Pengulangan nomina memperjelas anteseden tanpa mengubah makna.
- source_word: ὀνόματα
  choice: nama
  rationale: Teks menyebut 'nama', bukan secara eksplisit tulisan atau ukiran nama, sehingga detail tambahan tidak dimasukkan.
- source_word: ἀποστόλων
  choice: rasul
  rationale: '''Rasul'' adalah istilah Indonesia yang baku untuk jabatan atau peran khusus ἀπόστολος dalam Perjanjian Baru.'
- source_word: τοῦ ἀρνίου
  choice: Anak Domba
  rationale: Dalam Wahyu, ἀρνίον berfungsi sebagai gelar kristologis. 'Anak Domba' mempertahankan metafora dan pemakaian gelarnya yang mapan dalam bahasa Indonesia.
theological_decisions:
- issue: Gelar kristologis ἀρνίον
  choice: Anak Domba
  alternative: anak domba
  rationale: Dalam kitab Wahyu, istilah ini secara konsisten merujuk kepada Yesus sebagai suatu gelar. Huruf kapital menandai fungsi gelar itu tanpa menambahkan identitas yang tidak tersirat dalam teks.
- issue: Hubungan genitif τῶν δώδεκα ἀποστόλων τοῦ ἀρνίου
  choice: kedua belas rasul Anak Domba
  alternative: kedua belas rasul yang menjadi milik Anak Domba
  rationale: Genitif dipertahankan secara ringkas dan tidak diperluas menjadi penjelasan tentang jenis hubungan tertentu, sehingga ambiguitas hubungan/asosiasi tetap terjaga.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum; pengulangan 'dasar-dasar itu' dipakai demi kejelasan. Gelar 'Anak Domba' dikapitalisasi sesuai fungsi kristologisnya dalam Wahyu.
