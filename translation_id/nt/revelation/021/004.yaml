id: REV.21.4
reference: Revelation 21:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐξαλείψει πᾶν δάκρυον ⸀ἐκ τῶν ὀφθαλμῶν αὐτῶν, καὶ ὁ θάνατος οὐκ ἔσται ἔτι· οὔτε πένθος οὔτε κραυγὴ οὔτε πόνος οὐκ ἔσται ⸀ἔτι. τὰ πρῶτα ἀπῆλθαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/004.yaml
  text: And he will wipe away every tear from their eyes[a], and death will be no more; neither mourning nor crying nor pain will be any more[c][b]. The former things have passed away.
translation:
  language: id
  text: Dan Ia akan menghapus setiap air mata dari mata mereka[a]. Maut tidak akan ada lagi; perkabungan, jeritan[b], ataupun rasa sakit tidak akan ada lagi. Hal-hal yang dahulu sudah berlalu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “semua air mata.” Bentuk tunggal bahasa Yunani bersifat distributif dan menekankan tiap-tiap air mata.
    reason: lexical_alternative
  - marker: b
    text: Atau, “seruan” atau “teriakan keras.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “Hal-hal yang pertama sudah berlalu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαλείψει
  choice: akan menghapus
  rationale: Dalam konteks air mata, ἐξαλείφω menyatakan tindakan menyingkirkan air mata. "Menghapus" alami dalam bahasa Indonesia dan tetap mempertahankan gambaran tindakan yang personal.
- source_word: πᾶν δάκρυον
  choice: setiap air mata
  rationale: Bentuk tunggal dengan πᾶν bersifat distributif, sehingga "setiap air mata" mempertahankan penekanan pada tiap-tiap air mata.
- source_word: ἐκ τῶν ὀφθαλμῶν αὐτῶν
  choice: dari mata mereka
  rationale: Ungkapan ini secara langsung dan alami menyatakan tempat asal air mata yang disingkirkan.
- source_word: ὁ θάνατος
  choice: maut
  rationale: '"Maut" merupakan padanan Indonesia yang ringkas, khidmat, dan cocok dengan register penglihatan eskatologis ini.'
- source_word: οὐκ ἔσται ἔτι
  choice: tidak akan ada lagi
  rationale: Ungkapan ini menyatakan peniadaan secara mutlak dan mengalihkan finalitas bahasa Yunani dengan alami.
- source_word: πένθος
  choice: perkabungan
  rationale: Kata ini menunjuk pada dukacita atau perkabungan, khususnya yang berhubungan dengan kehilangan; "perkabungan" cocok dalam rangkaian bersama maut, jeritan, dan rasa sakit.
- source_word: κραυγή
  choice: jeritan
  rationale: κραυγή dapat berarti seruan atau teriakan keras. "Jeritan" mempertahankan unsur suara yang kuat tanpa menentukan apakah itu ratapan, protes, atau seruan lainnya.
- source_word: πόνος
  choice: rasa sakit
  rationale: Dalam daftar penderitaan yang ditiadakan, "rasa sakit" merupakan padanan yang jelas dan alami serta dapat mencakup penderitaan jasmani maupun batin.
- source_word: τὰ πρῶτα
  choice: segala yang dahulu
  rationale: Frasa substantival netral jamak ini merujuk pada hal-hal dari tatanan sebelumnya. "Segala yang dahulu" alami dan tidak memaksakan penafsiran yang lebih sempit.
- source_word: ἀπῆλθαν
  choice: sudah berlalu
  rationale: Aoristus menyajikan kepergian itu sebagai tuntas; "sudah berlalu" menyampaikan hasil yang telah tercapai dalam konteks penglihatan.
theological_decisions:
- issue: Subjek tersirat dari ἐξαλείψει berasal dari konteks sebelumnya.
  choice: Ia akan menghapus
  alternative: Allah akan menghapus
  rationale: Bahasa Yunani tidak mengulang nomina "Allah" dalam ayat ini. Pronomina mempertahankan kesinambungan dengan konteks tanpa menambahkan subjek eksplisit ke dalam teks.
- issue: Cakupan peniadaan maut dan penderitaan dalam ciptaan baru.
  choice: tidak akan ada lagi
  alternative: tidak akan ada lagi di sana
  rationale: Bahasa Yunani menyatakan peniadaan kategoris tanpa pembatas tambahan; terjemahan mempertahankan finalitas tersebut.
- issue: Hubungan kalimat terakhir dengan daftar sebelumnya.
  choice: Segala yang dahulu sudah berlalu.
  alternative: Hal-hal yang pertama sudah berlalu.
  rationale: τὰ πρῶτα dapat berarti hal-hal terdahulu atau pertama. Pilihan utama menunjuk pada tatanan lama tanpa menjabarkan secara teologis apa saja yang termasuk di dalamnya; alternatif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. "Ia" dipakai untuk subjek ilahi yang tersirat dari konteks, sedangkan "maut" menjaga nada sastra yang sesuai. Tanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
