source:
  edition: SBLGNT
  text: καὶ ἡ πόλις οὐ χρείαν ἔχει τοῦ ἡλίου οὐδὲ τῆς σελήνης, ἵνα φαίνωσιν αὐτῇ, ἡ γὰρ δόξα τοῦ θεοῦ ἐφώτισεν αὐτήν, καὶ ὁ λύχνος αὐτῆς τὸ ἀρνίον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/023.yaml
  text: And the city has no need of the sun or of the moon to shine on it[a], for the glory of God gave it light, and its lamp is the Lamb.
translation:
  language: id
  text: Kota itu tidak memerlukan matahari ataupun bulan untuk menyinarinya[a], sebab kemuliaan Allah meneranginya, dan Anak Domba adalah pelitanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “untuk memberinya terang.” Secara harfiah, bahasa Yunani berbunyi “untuk bersinar baginya”; dalam konteks ini dapat berarti “untuk bersinar atasnya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πόλις
  choice: kota
  rationale: Makna langsung dan wajar dalam konteks Yerusalem Baru.
- source_word: οὐ χρείαν ἔχει
  choice: tidak memerlukan
  rationale: Mengungkapkan idiom Yunani secara alami dalam bahasa Indonesia modern tanpa mengubah maknanya.
- source_word: τοῦ ἡλίου οὐδὲ τῆς σελήνης
  choice: matahari ataupun bulan
  rationale: Mempertahankan pasangan benda langit dan daya penyangkalan οὐδέ; 'ataupun' terdengar alami sesudah 'tidak memerlukan'.
- source_word: ἵνα φαίνωσιν αὐτῇ
  choice: untuk menyinarinya
  rationale: Dengan matahari dan bulan sebagai subjek, φαίνω berarti 'bersinar/menyinari'; bentuk ini juga mempertahankan perbedaan dengan ἐφώτισεν pada klausa berikutnya.
- source_word: δόξα
  choice: kemuliaan
  rationale: Padanan baku yang mempertahankan bobot teologis dan nuansa apokaliptik istilah tersebut.
- source_word: ἐφώτισεν
  choice: meneranginya
  rationale: Menyampaikan tindakan memberi terang secara konkret dan alami, serta menghindari arti abstrak 'mencerahkan'.
- source_word: λύχνος
  choice: pelita
  rationale: λύχνος menunjuk pada alat penerang, bukan terang secara umum atau kaki pelita; 'pelita' mempertahankan citra kuno dan terdengar luhur dalam konteks ini.
- source_word: ἀρνίον
  choice: Anak Domba
  rationale: Gelar kristologis yang mapan dalam kitab Wahyu; kapitalisasi menandai pemakaian sebagai gelar.
theological_decisions:
- issue: Hubungan metaforis dalam καὶ ὁ λύχνος αὐτῆς τὸ ἀρνίον
  choice: dan Anak Domba adalah pelitanya
  alternative: dan Anak Domba adalah terangnya
  rationale: Mempertahankan metafora eksplisit λύχνος ('pelita'), sekaligus menjaga pembedaan antara kemuliaan Allah yang menerangi kota dan Anak Domba sebagai pelitanya.
- issue: Gambaran penerangan ilahi
  choice: Menerjemahkan pernyataan sebagaimana adanya tanpa penjelasan eskatologis tambahan.
  alternative: Menambahkan bahwa Allah menggantikan seluruh sumber cahaya ciptaan.
  rationale: Teks hanya menyatakan bahwa kota tidak memerlukan matahari atau bulan karena kemuliaan Allah meneranginya dan Anak Domba adalah pelitanya; terjemahan tidak menambahkan sistem penafsiran tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan metafora 'pelita' dan pembedaan leksikal antara φαίνω dan φωτίζω.
