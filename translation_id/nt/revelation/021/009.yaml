id: REV.21.9
reference: Revelation 21:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἦλθεν εἷς ἐκ τῶν ἑπτὰ ἀγγέλων τῶν ἐχόντων τὰς ἑπτὰ φιάλας, ⸂τῶν γεμόντων⸃ τῶν ἑπτὰ πληγῶν τῶν ἐσχάτων, καὶ ἐλάλησεν μετ’ ἐμοῦ λέγων· Δεῦρο, δείξω σοι τὴν ⸂νύμφην τὴν γυναῖκα⸃ τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/009.yaml
  text: Then one of the seven angels who had the seven bowls full of the seven last plagues came and spoke with me[a], saying, “Come, I will show you the bride[b], the wife of the Lamb.”
translation:
  language: id
  text: Lalu datanglah salah satu dari ketujuh malaikat yang memegang ketujuh cawan yang penuh dengan ketujuh malapetaka terakhir itu. Ia berbicara denganku[a] dan berkata, “Kemarilah! Aku akan menunjukkan kepadamu pengantin perempuan, yaitu istri Anak Domba.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dapat juga diterjemahkan: “berbicara kepadaku.” Teks Yunani secara harfiah memakai ungkapan “berbicara denganku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Lalu
  rationale: Menandai kelanjutan dan perkembangan narasi secara alami dalam bahasa Indonesia.
- source_word: ἦλθεν εἷς ἐκ τῶν ἑπτὰ ἀγγέλων
  choice: datanglah salah satu dari ketujuh malaikat
  rationale: Menyampaikan verba naratif dan konstruksi partitif Yunani secara jelas serta wajar.
- source_word: τῶν ἐχόντων τὰς ἑπτὰ φιάλας
  choice: yang memegang ketujuh cawan
  rationale: Partisipel ini mengidentifikasi para malaikat melalui cawan yang mereka pegang; 'cawan' lebih tepat daripada wadah kecil seperti botol.
- source_word: τῶν γεμόντων τῶν ἑπτὰ πληγῶν τῶν ἐσχάτων
  choice: yang penuh dengan ketujuh malapetaka terakhir itu
  rationale: γεμόντων menyatakan keadaan penuh, πληγῶν dalam konteks penghukuman Wahyu diterjemahkan 'malapetaka', dan ἐσχάτων dipertahankan sebagai 'terakhir'.
- source_word: ἐλάλησεν μετ’ ἐμοῦ
  choice: berbicara denganku
  rationale: Mempertahankan nilai dasar μετά dengan genitif ('dengan') sambil memakai bentuk Indonesia yang alami.
- source_word: λέγων
  choice: dan berkata
  rationale: Mengungkapkan hubungan partisipial secara alami dalam narasi Indonesia tanpa mengubah isi ujaran.
- source_word: Δεῦρο
  choice: Kemarilah!
  rationale: Imperatif ini merupakan panggilan untuk mendekat; tanda seru menyampaikan daya perintahnya secara wajar.
- source_word: δείξω σοι
  choice: Aku akan menunjukkan kepadamu
  rationale: Menerjemahkan bentuk futur secara langsung dan mempertahankan objek tidak langsung.
- source_word: τὴν νύμφην
  choice: pengantin perempuan
  rationale: Padanan Indonesia yang jelas bagi νύμφη dalam citra perkawinan.
- source_word: τὴν γυναῖκα τοῦ ἀρνίου
  choice: yaitu istri Anak Domba
  rationale: γυναῖκα berarti 'istri' dalam aposisi perkawinan ini; 'yaitu' memperjelas hubungan aposisional tanpa meleburkan kedua sebutan. 'Anak Domba' dipertahankan sebagai gelar kristologis dalam Wahyu.
theological_decisions:
- issue: Hubungan antara νύμφην dan γυναῖκα
  choice: pengantin perempuan, yaitu istri Anak Domba
  alternative: pengantin perempuan, istri Anak Domba
  rationale: Kedua nomina Yunani dipertahankan secara eksplisit. 'Yaitu' menandai bahwa keduanya merujuk kepada sosok yang sama tanpa menghapus ketegangan citra antara pengantin dan istri.
- issue: ἀρνίον sebagai gelar kristologis
  choice: Anak Domba
  alternative: anak domba
  rationale: Huruf kapital menandai pemakaiannya sebagai gelar bagi Yesus dalam Wahyu tanpa menambahkan penjelasan doktrinal ke dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang khidmat tetapi mudah dipahami. Susunan kalimat dipecah menjadi dua agar rangkaian atribut yang panjang tetap jelas. Semua unsur citra perkawinan dan gelar 'Anak Domba' dipertahankan.
