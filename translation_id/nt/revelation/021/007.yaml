  text: ὁ νικῶν κληρονομήσει ταῦτα, καὶ ἔσομαι αὐτῷ θεὸς καὶ αὐτὸς ἔσται μοι υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/007.yaml
  text: The one who overcomes will inherit these things[a], and I will be his God[b], and he will be my son.
translation:
  language: id
  text: Orang yang menang akan mewarisi hal-hal ini,[a] dan Aku akan menjadi Allahnya, dan ia akan menjadi putra-Ku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "Orang yang menaklukkan." Kata kerja Yunani νικάω berulang kali dipakai dalam kitab Wahyu untuk orang yang menang dengan tetap setia.
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani untuk "putra" berbentuk maskulin. Dalam janji ini, bentuk tersebut kemungkinan merujuk secara umum kepada setiap orang yang menang, tetapi teks utama mempertahankan citra putra dan warisan dari bahasa sumber.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: Orang yang menang
  rationale: Partisipel kini dengan artikel berfungsi sebagai nomina dan menunjuk kepada orang yang dicirikan oleh kemenangan. Ungkapan ini alami dalam bahasa Indonesia serta mempertahankan istilah berulang dalam kitab Wahyu untuk ketekunan iman yang berjaya.
- source_word: κληρονομήσει
  choice: akan mewarisi
  rationale: Mempertahankan makna menerima sebagai warisan serta nuansa perjanjian dan kekeluargaan yang selaras dengan hubungan Allah dan anak pada klausa berikutnya.
- source_word: ταῦτα
  choice: semuanya ini
  rationale: Merujuk secara wajar kepada berbagai hal dalam penglihatan sebelumnya. Kata 'semuanya' membuat bentuk jamak demonstratif jelas dalam bahasa Indonesia tanpa mengubah cakupan acuannya.
- source_word: ἔσομαι αὐτῷ θεὸς
  choice: Aku akan menjadi Allahnya
  rationale: Merupakan padanan Indonesia yang alami bagi datif relasional dan mempertahankan gema rumusan perjanjian.
- source_word: αὐτὸς ἔσται μοι υἱός
  choice: ia akan menjadi anak-Ku
  rationale: Mempertahankan hubungan filial secara alami. Dalam bahasa Indonesia, 'anak' tidak menandai gender, tetapi merupakan padanan biasa bagi υἱός ketika fokusnya ialah relasi sebagai anak; rincian bentuk maskulin sumber dijelaskan dalam catatan.
theological_decisions:
- issue: Bahasa filial maskulin dalam janji yang ditujukan secara umum kepada orang yang menang
  choice: Gunakan 'anak-Ku' dalam teks utama dan jelaskan bentuk maskulin Yunani dalam catatan
  alternative: putra-Ku
  rationale: υἱός berbentuk maskulin tunggal dan membawa citra warisan serta hubungan filial. Namun 'anak-Ku' adalah ungkapan Indonesia yang paling alami untuk relasi ini dan tidak membatasi janji hanya kepada laki-laki; catatan menjaga transparansi terhadap bentuk sumber.
- issue: Gema rumusan perjanjian
  choice: Aku akan menjadi Allahnya, dan ia akan menjadi anak-Ku
  alternative: Aku akan menjadi Allah baginya, dan ia akan menjadi seorang putra bagi-Ku
  rationale: Pilihan utama mempertahankan hubungan perjanjian dan pengangkatan sebagai anak tanpa menjadi kaku atau menambahkan penafsiran doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan khidmat. Kapitalisasi 'Aku' dan '-Ku' menandai Allah sebagai pembicara. 'Ia' dipilih untuk register Alkitabiah yang tetap mudah dipahami.
