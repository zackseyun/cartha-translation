id: REV.21.11
reference: Revelation 21:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἔχουσαν τὴν δόξαν τοῦ θεοῦ· ὁ φωστὴρ αὐτῆς ὅμοιος λίθῳ τιμιωτάτῳ, ὡς λίθῳ ἰάσπιδι κρυσταλλίζοντι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/011.yaml
  text: having the glory of God[a]; its radiance was like a most precious stone, like a jasper stone[b], clear as crystal.
translation:
  language: id
  text: Kota itu memiliki kemuliaan Allah. Cahayanya seperti batu yang paling berharga, seperti batu yaspis yang jernih seperti kristal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berkilau seperti kristal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχουσαν
  choice: memiliki
  rationale: Partisip aktif kini feminin akusatif tunggal ini menerangkan kota pada ayat sebelumnya. “Memiliki” mempertahankan hubungan partisipial tanpa mengubahnya menjadi sekadar keterangan penyerta.
- source_word: τὴν δόξαν τοῦ θεοῦ
  choice: kemuliaan Allah
  rationale: “Kemuliaan” merupakan padanan baku bagi δόξα dan mempertahankan bobot teologis dari kehadiran serta keagungan ilahi.
- source_word: ὁ φωστὴρ αὐτῆς
  choice: cahayanya
  rationale: φωστήρ dapat menunjuk pada benda penerang atau pancaran cahaya. “Cahayanya” alami dalam bahasa Indonesia dan tetap cukup luas untuk konteks penampakan kota.
- source_word: ὅμοιος
  choice: seperti
  rationale: Menyatakan perbandingan; kopula tidak diperlukan dalam susunan bahasa Indonesia.
- source_word: λίθῳ τιμιωτάτῳ
  choice: batu yang sangat berharga
  rationale: Ungkapan ini mempertahankan λίθος sebagai “batu” dan menyampaikan bentuk superlatif τιμιωτάτῳ secara alami dalam bahasa Indonesia.
- source_word: ὡς λίθῳ ἰάσπιδι
  choice: seperti batu yaspis
  rationale: Mempertahankan pengulangan λίθῳ dan nama batu ἴασπις tanpa mempersempit identifikasi mineral kunonya.
- source_word: κρυσταλλίζοντι
  choice: berkilau seperti kristal
  rationale: Partisip ini menggambarkan sifat menyerupai kristal, yang dapat mencakup kilauan atau kejernihan. Pilihan ini alami dan tidak memastikan transparansi secara berlebihan.
theological_decisions:
- issue: Makna δόξα τοῦ θεοῦ dalam gambaran apokaliptis
  choice: kemuliaan Allah
  alternative: keindahan gemilang Allah
  rationale: “Kemuliaan Allah” mempertahankan makna teologis tentang keagungan dan kehadiran ilahi, bukan hanya kesan visual.
- issue: Nuansa κρυσταλλίζοντι
  choice: berkilau seperti kristal
  alternative: jernih seperti kristal
  rationale: Kata Yunani menyatakan kemiripan dengan kristal dan dapat menonjolkan kilauan atau kejernihan; catatan kaki mempertahankan alternatif yang sungguh mungkin.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Struktur tetap terhubung dengan gambaran kota dari ayat sebelumnya. Istilah “yaspis” dipertahankan sebagai nama batu dalam tradisi Alkitab Indonesia, sedangkan ambiguitas sifat κρυσταλλίζοντι dijaga melalui catatan kaki.
