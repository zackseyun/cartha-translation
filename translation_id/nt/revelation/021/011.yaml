- from: memiliki kemuliaan Allah. Cahayanya seperti batu yang sangat berharga, seperti batu yaspis yang berkilau seperti kristal.[a]
  to: Kota itu memiliki kemuliaan Allah. Cahayanya seperti batu yang paling berharga, seperti batu yaspis yang jernih seperti kristal.[a]
  rationale: Revisi memperjelas subjek yang sudah tersirat dari ayat sebelumnya, menyampaikan superlatif τιμιωτάτῳ dengan “paling berharga,” dan menjadikan kejernihan kristalin sebagai makna utama κρυσταλλίζοντι. Alternatif “berkilau seperti kristal” dipertahankan dalam catatan kaki agar nuansa leksikal yang mungkin tetap tersedia tanpa menggantikan penekanan utama sumber.
