source:
  edition: SBLGNT
  text: Καὶ ὁ λαλῶν μετ’ ἐμοῦ εἶχεν μέτρον κάλαμον χρυσοῦν, ἵνα μετρήσῃ τὴν πόλιν καὶ τοὺς πυλῶνας αὐτῆς καὶ τὸ τεῖχος αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/015.yaml
  text: And the one speaking with me had a golden measuring rod[a], so that he might measure the city and its gates and its wall.
translation:
  language: id
  text: Orang yang berbicara denganku itu mempunyai sebatang tongkat pengukur dari emas[a] untuk mengukur kota itu, pintu-pintu gerbangnya, dan temboknya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebatang buluh pengukur dari emas.” Kata Yunani κάλαμος secara harfiah berarti “buluh”, yang di sini digunakan sebagai alat pengukur.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαλῶν μετ’ ἐμοῦ
  choice: Orang yang berbicara denganku itu
  rationale: Partisipel kini substantival diterjemahkan secara alami dengan tetap mempertahankan gambaran orang yang sedang berbicara dan tanpa menambahkan identitas 'malaikat', yang tidak disebutkan secara eksplisit dalam ayat ini.
- source_word: εἶχεν
  choice: memegang
  rationale: Walaupun arti dasarnya 'mempunyai', dalam konteks alat ukur yang akan dipakai, 'memegang' menyampaikan kepemilikan konkret secara wajar tanpa mengubah maksud.
- source_word: μέτρον κάλαμον χρυσοῦν
  choice: sebatang tongkat pengukur dari emas
  rationale: Frasa ini menunjuk alat untuk mengukur. 'Tongkat pengukur' jelas bagi pembaca modern, sedangkan 'dari emas' mempertahankan bahan alat tersebut. Arti harfiah κάλαμος sebagai 'buluh' dicatat dalam catatan kaki.
- source_word: ἵνα μετρήσῃ
  choice: untuk mengukur
  rationale: ἵνα dengan subjungtif menyatakan tujuan; konstruksi infinitival bahasa Indonesia ini mengungkapkan tujuan secara ringkas dan alami.
- source_word: τὴν πόλιν
  choice: kota itu
  rationale: Terjemahan standar yang mempertahankan acuan tentu kepada kota yang telah disebut dalam konteks, tanpa menambahkan nama Yerusalem Baru di dalam ayat.
- source_word: τοὺς πυλῶνας αὐτῆς
  choice: pintu-pintu gerbangnya
  rationale: πυλών menunjuk pintu gerbang atau gerbang monumental. 'Pintu-pintu gerbang' alami dalam bahasa Indonesia dan mempertahankan bentuk jamak serta pronomina posesif.
- source_word: τὸ τεῖχος αὐτῆς
  choice: temboknya
  rationale: τεῖχος adalah tembok kota; 'tembok' tepat dan tidak menambahkan rincian penafsiran.
theological_decisions:
- issue: Apakah pembicara harus disebut secara eksplisit sebagai malaikat
  choice: Mempertahankan ungkapan 'Orang yang berbicara denganku itu' tanpa menambahkan 'malaikat'.
  alternative: Malaikat yang berbicara denganku itu
  rationale: Konteks yang lebih luas menunjukkan bahwa tokoh tersebut adalah salah satu malaikat, tetapi ayat ini sendiri memakai deskripsi partisipial dan bukan kata 'malaikat'. Terjemahan mengikuti bentuk teks Yunani dan tidak memasukkan identifikasi kontekstual ke dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum; pengulangan pronomina Yunani diringkas secara idiomatis menjadi 'pintu-pintu gerbangnya, dan temboknya'. Marker catatan kaki [a] ditempatkan langsung setelah frasa yang dijelaskan.
