  text: καὶ οἱ δώδεκα πυλῶνες δώδεκα μαργαρῖται, ἀνὰ εἷς ἕκαστος τῶν πυλώνων ἦν ἐξ ἑνὸς μαργαρίτου· καὶ ἡ πλατεῖα τῆς πόλεως χρυσίον καθαρὸν ὡς ὕαλος διαυγής.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/021.yaml
  text: And the twelve gates were twelve pearls; each one of the gates was from a single pearl. And the street of the city was pure gold[a], like transparent glass.
translation:
  language: id
  text: Kedua belas pintu gerbang itu adalah dua belas mutiara; setiap pintu gerbang terbuat dari satu mutiara. Jalan kota itu terbuat dari emas murni[a], seperti kaca bening.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jalan lebar kota” atau “lapangan kota”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πυλῶνες
  choice: pintu gerbang
  rationale: Dalam gambaran arsitektur Yerusalem Baru, πυλών menunjuk pada gerbang atau bangunan gerbang. “Pintu gerbang” merupakan padanan Indonesia yang alami dan jelas.
- source_word: μαργαρῖται / μαργαρίτου
  choice: mutiara
  rationale: 'μαργαρίτης berarti “mutiara”. Bentuk jamak lalu tunggal dipertahankan: dua belas pintu gerbang adalah dua belas mutiara, dan setiap gerbang berasal dari satu mutiara.'
- source_word: ἀνὰ εἷς ἕκαστος
  choice: setiap
  rationale: Ungkapan ini menekankan pembagian satu demi satu. “Setiap” menyampaikan daya distributifnya secara wajar dalam bahasa Indonesia.
- source_word: ἐξ ἑνὸς μαργαρίτου
  choice: berasal dari satu mutiara
  rationale: ἐξ dapat menyatakan asal atau bahan. “Berasal dari” mengikuti bentuk Yunani tanpa secara eksplisit menambahkan gagasan proses pembuatan.
- source_word: πλατεῖα
  choice: jalan
  rationale: πλατεῖα dapat menunjuk pada jalan lebar atau ruang terbuka umum. “Jalan” paling alami dalam konteks ini, sedangkan kemungkinan “jalan lebar” atau “lapangan” dicatat dalam catatan kaki.
- source_word: χρυσίον καθαρὸν
  choice: emas murni
  rationale: Padanan langsung dan alami bagi emas yang kemurniannya ditekankan oleh καθαρόν.
- source_word: ὡς ὕαλος διαυγής
  choice: seperti kaca bening
  rationale: ὕαλος berarti “kaca”, sedangkan διαυγής menyatakan kejernihan atau sifat tembus pandang. “Kaca bening” mempertahankan citra tersebut secara alami.
theological_decisions:
- issue: Gambaran πλατεῖα dalam tata kota Yerusalem Baru
  choice: jalan kota
  alternative: jalan lebar kota; lapangan kota
  rationale: Ini terutama merupakan ketidakpastian leksikal, bukan penetapan tata kota atau doktrin tertentu. Teks utama memakai ungkapan yang alami, sementara cakupan makna lainnya tetap dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel ayat dipertahankan, dengan pengulangan “dua belas” dan kontras antara mutiara, emas murni, serta kaca bening.
