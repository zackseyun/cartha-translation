id: REV.21.6
reference: Revelation 21:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἶπέν μοι· ⸂Γέγοναν. ἐγὼ⸃ τὸ Ἄλφα καὶ τὸ Ὦ, ἡ ἀρχὴ καὶ τὸ τέλος. ἐγὼ τῷ διψῶντι δώσω ἐκ τῆς πηγῆς τοῦ ὕδατος τῆς ζωῆς δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/006.yaml
  text: And he said to me[a], “It is done. I am the Alpha and the Omega, the beginning and the end[b]. To the one who is thirsty I will give from the spring of the water of life freely.”
translation:
  language: id
  text: Lalu Dia berkata kepadaku, “Semuanya telah menjadi kenyataan.[a] Akulah Alfa dan Omega, yang awal dan yang akhir. Kepada orang yang haus akan Kuberikan air dari mata air kehidupan dengan cuma-cuma.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, bentuk Yunaninya jamak: “Hal-hal itu telah terjadi” atau “semuanya telah terwujud.” Secara tradisional diterjemahkan, “Sudah selesai.”'
    reason: alternative_reading
  - marker: b
    text: Dapat juga diterjemahkan “tanpa bayaran” atau “sebagai pemberian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Γέγοναν
  choice: Semuanya telah menjadi kenyataan
  rationale: Bentuk verba Yunani ini adalah perfektum aktif indikatif orang ketiga jamak. Terjemahan ini mempertahankan makna jamaknya secara wajar dalam bahasa Indonesia dan menyatakan bahwa berbagai kenyataan yang telah diumumkan kini sudah terwujud.
- source_word: τὸ Ἄλφα καὶ τὸ Ὦ
  choice: Alfa dan Omega
  rationale: Nama huruf Yunani dipertahankan sebagai gelar simbolis yang sudah dikenal dalam kitab Wahyu; frasa berikutnya langsung menerangkan daya maknanya.
- source_word: ἡ ἀρχὴ καὶ τὸ τέλος
  choice: yang awal dan yang akhir
  rationale: Terjemahan ini mempertahankan kesejajaran kedua gelar dan tidak membatasi maknanya hanya pada urutan waktu atau menafsirkannya secara berlebihan.
- source_word: τῷ διψῶντι
  choice: kepada orang yang haus
  rationale: Partisipel kini dipakai sebagai nomina untuk menyebut seseorang yang dicirikan oleh rasa haus. Bentuk tunggal dan sifat personal ungkapan sumber tetap terpelihara.
- source_word: δώσω
  choice: akan Kuberikan
  rationale: Menyampaikan janji dalam bentuk mendatang secara langsung, dengan pronomina orang pertama yang menyatu secara alami dengan verba Indonesia.
- source_word: ἐκ τῆς πηγῆς
  choice: dari mata air
  rationale: πηγή lazim menunjuk pada mata air atau pancuran. 'Mata air' jelas, alami, dan sesuai dengan gambaran sumber kehidupan.
- source_word: τοῦ ὕδατος τῆς ζωῆς
  choice: air kehidupan
  rationale: Mempertahankan gambaran alkitabiah yang mapan sekaligus menghindari susunan harfiah 'mata air dari air kehidupan' yang kaku dalam bahasa Indonesia.
- source_word: δωρεάν
  choice: dengan cuma-cuma
  rationale: Menunjukkan bahwa pemberian itu gratis atau tanpa bayaran. Ungkapan ini alami dan mempertahankan tekanan adverbial sumber.
theological_decisions:
- issue: Pernyataan ilahi Γέγοναν berbentuk jamak
  choice: Semuanya telah menjadi kenyataan
  alternative: Sudah selesai
  rationale: Bentuk jamak Yunani menunjuk pada berbagai hal atau kenyataan yang kini telah terwujud. Terjemahan utama mempertahankan ciri itu dan tidak meratakannya menjadi rumusan tunggal tradisional.
- issue: Gambaran Alfa dan Omega sebagai gelar ilahi
  choice: Alfa dan Omega
  alternative: A dan Z
  rationale: Nama huruf Yunani mempertahankan simbolisme khas kitab Wahyu dan kaitan antarteksnya, sedangkan gelar berikutnya menjelaskan maknanya tanpa perlu mengganti abjad.
- issue: Nuansa pemberian δωρεάν
  choice: dengan cuma-cuma
  alternative: sebagai pemberian
  rationale: Pilihan utama menegaskan bahwa air kehidupan diberikan tanpa bayaran, tanpa menyisipkan syarat teologis yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat mudah dipahami pembaca umum, sementara bentuk jamak Γέγοναν, gelar simbolis Alfa dan Omega, serta gambaran air kehidupan tetap dipertahankan. Huruf kapital pada 'Dia', 'Aku', dan klitik 'Ku-' menandai rujukan kepada pembicara ilahi sesuai kebiasaan ejaan Alkitab Indonesia, tanpa menambahkan tafsir denominasi.
