revisions:
- from: Namun, orang-orang pengecut, orang-orang yang tidak percaya[a], orang-orang yang menjijikkan, para pembunuh, orang-orang yang melakukan percabulan, para pelaku sihir, para penyembah berhala, dan semua pendusta akan mendapat bagian mereka di dalam danau yang menyala dengan api dan belerang. Inilah kematian yang kedua.
  to: Namun, bagian orang-orang pengecut, orang-orang yang tidak percaya[a], orang-orang yang keji, para pembunuh, orang-orang yang melakukan percabulan, para pelaku sihir, para penyembah berhala, dan semua pendusta ada di dalam danau yang menyala dengan api dan belerang, yaitu kematian kedua.
  rationale: Revisi mengganti padanan yang dapat bergeser ke makna “membuat jijik” dengan “orang-orang yang keji,” yang lebih setia pada kecaman moral dalam teks sumber. Susunan “bagian ... ada di dalam” menyatakan μέρος sebagai nasib atau bagian yang ditetapkan, sedangkan “yaitu kematian kedua” menghubungkan identifikasi penutup langsung dengan danau tanpa mengubah makna.
