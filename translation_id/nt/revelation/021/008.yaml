id: REV.21.8
reference: Revelation 21:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τοῖς δὲ δειλοῖς καὶ ⸀ἀπίστοις καὶ ἐβδελυγμένοις καὶ φονεῦσι καὶ πόρνοις καὶ φαρμάκοις καὶ εἰδωλολάτραις καὶ πᾶσι τοῖς ψευδέσιν τὸ μέρος αὐτῶν ἐν τῇ λίμνῃ τῇ καιομένῃ πυρὶ καὶ θείῳ, ὅ ἐστιν ὁ θάνατος ὁ δεύτερος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/008.yaml
  text: But for the cowardly and unbelieving and detestable and murderers and sexually immoral and sorcerers and idolaters and all liars[a], their portion will be in the lake burning with fire and sulfur[c][b], which is the second death.
translation:
  language: id
  text: Namun, bagian orang-orang pengecut, orang-orang yang tidak percaya[a], orang-orang yang keji, para pembunuh, orang-orang yang melakukan percabulan, para pelaku sihir, para penyembah berhala, dan semua pendusta ada di dalam danau yang menyala dengan api dan belerang, yaitu kematian kedua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “orang-orang yang tidak setia.”'
    reason: alternative_reading
lexical_decisions:
- source_word: δειλοῖς
  choice: orang-orang pengecut
  rationale: Istilah ini menyatakan ketakutan yang tercela secara moral, bukan rasa takut biasa; 'pengecut' mempertahankan daya kecam tersebut.
- source_word: ἀπίστοις
  choice: orang-orang yang tidak percaya
  rationale: Dalam daftar penghakiman ini, makna paling langsung ialah mereka yang tidak percaya; kemungkinan makna 'tidak setia' dipertahankan dalam catatan kaki.
- source_word: ἐβδελυγμένοις
  choice: orang-orang yang menjijikkan
  rationale: Partisipel perfek ini menggambarkan orang yang bercirikan sesuatu yang keji atau cemar; ungkapan ini mempertahankan penilaian moral yang kuat tanpa memakai bahasa arkais.
- source_word: φονεῦσι
  choice: para pembunuh
  rationale: Kata ini secara lazim berarti orang yang melakukan pembunuhan, bukan semua orang yang pernah menyebabkan kematian.
- source_word: πόρνοις
  choice: orang-orang yang melakukan percabulan
  rationale: Kata ini menunjuk pada pelaku perbuatan seksual yang tidak bermoral. 'Melakukan percabulan' merupakan ungkapan ringkas dan dikenal luas dalam register Alkitab Indonesia.
- source_word: φαρμάκοις
  choice: para pelaku sihir
  rationale: Dalam konteks Wahyu, kata ini menunjuk pada praktisi ilmu gaib atau sihir, bukan apoteker atau sekadar peramu obat/racun.
- source_word: εἰδωλολάτραις
  choice: para penyembah berhala
  rationale: Terjemahan ini menyatakan secara langsung orang yang menyembah berhala dan lebih mudah dipahami daripada bentuk nominal yang lebih teknis.
- source_word: πᾶσι τοῖς ψευδέσιν
  choice: semua pendusta
  rationale: Adjektiva yang dipakai secara substantival ini paling alami dipahami sebagai semua orang yang berdusta atau bercirikan kepalsuan.
- source_word: τὸ μέρος αὐτῶν
  choice: akan mendapat bagian mereka
  rationale: μέρος menyatakan bagian atau nasib yang diperuntukkan bagi mereka; penambahan verba menghasilkan kalimat Indonesia yang alami.
- source_word: ἐν τῇ λίμνῃ τῇ καιομένῃ πυρὶ καὶ θείῳ
  choice: di dalam danau yang menyala dengan api dan belerang
  rationale: Terjemahan ini mempertahankan hubungan atributif partisipel dengan 'danau' serta menerjemahkan θεῖον dengan istilah modern yang tepat, 'belerang'.
- source_word: ὅ ἐστιν ὁ θάνατος ὁ δεύτερος
  choice: Inilah kematian yang kedua
  rationale: Pronomina relatif netral merujuk kembali pada gambaran danau tersebut. Kalimat mandiri dengan 'Inilah' menyampaikan fungsi penjelasnya secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna ἄπιστος dalam daftar penghakiman
  choice: orang-orang yang tidak percaya
  alternative: orang-orang yang tidak setia
  rationale: Konteks paling langsung mendukung ketidakpercayaan, tetapi kata Yunani ini juga dapat menyatakan ketidaksetiaan. Alternatif tersebut dicatat agar ketegangan semantis dan teologis tidak dihapus.
- issue: Cakupan πόρνοις
  choice: orang-orang yang melakukan percabulan
  alternative: orang-orang yang melakukan perbuatan seksual yang tidak bermoral
  rationale: Pilihan utama ringkas dan berterima dalam bahasa gerejawi modern, sedangkan alternatif memperlihatkan bahwa kata sumber dapat mencakup kategori amoralitas seksual yang lebih umum.
- issue: Acuan ὅ dalam klausa penutup
  choice: Inilah kematian yang kedua
  alternative: yang merupakan kematian yang kedua
  rationale: Bentuk netral tunggal merujuk pada keseluruhan gambaran danau api dan belerang, bukan hanya pada salah satu unsurnya; 'Inilah' menjaga fungsi identifikasinya tanpa mempersempit acuan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'orang-orang/para' dipertahankan secukupnya untuk memperjelas bahwa semua unsur adalah golongan manusia, sambil tetap menjaga irama daftar. 'Belerang' sudah merupakan padanan Indonesia yang lazim dan tidak memerlukan catatan mengenai istilah Inggris tradisional.
