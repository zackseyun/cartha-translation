review_pass:
  verdict: revise
  source_fidelity: Draf pada umumnya mengikuti daftar delapan golongan dalam teks Yunani dan mempertahankan makna penghakiman, danau yang menyala dengan api dan belerang, serta identifikasi “kematian kedua.” Namun, “orang-orang yang menjijikkan” terutama menyatakan orang yang menimbulkan rasa jijik, sedangkan ἐβδελυγμένοις dalam daftar ini menunjuk pada orang-orang yang bersifat keji/menjijikkan dalam penilaian moral. Klausa terakhir juga lebih baik dihubungkan langsung dengan danau, sebagaimana ὅ merujuk pada gambaran danau itu.
  naturalness: Pengulangan “orang-orang” dan “para” dapat diterima dalam register Alkitab Indonesia modern. Susunan yang direvisi menempatkan “bagian” sebagai nasib yang ditetapkan, bukan sesuatu yang seolah-olah mereka terima di dalam danau, dan memakai “yaitu” untuk penjelasan penutup yang mengalir.
  terminology: “Pengecut,” “tidak percaya,” “pembunuh,” “pelaku sihir,” “penyembah berhala,” “pendusta,” “api dan belerang,” dan “kematian kedua” tepat. “Melakukan percabulan” merupakan padanan yang berterima untuk πόρνοις dalam register ini. Catatan kaki untuk ἀπίστοις secara tepat mempertahankan alternatif “tidak setia.”
  issues:
  - severity: medium
    issue: “orang-orang yang menjijikkan” untuk ἐβδελυγμένοις
    rationale: Dalam bahasa Indonesia, frasa ini paling lazim berarti orang yang membuat orang lain jijik. “Orang-orang yang keji” lebih baik menyampaikan karakterisasi moral yang sangat tercela dalam βδελύσσομαι tanpa menambahkan tindakan tertentu.
  - severity: low
    issue: Hubungan klausa “Inilah kematian yang kedua” dengan danau kurang langsung
    rationale: Kata relatif ὅ menjelaskan danau yang menyala dengan api dan belerang. “yaitu kematian kedua” mempertahankan hubungan penjelas itu secara langsung dan alami.
  revised_text: Namun, bagian orang-orang pengecut, orang-orang yang tidak percaya[a], orang-orang yang keji, para pembunuh, orang-orang yang melakukan percabulan, para pelaku sihir, para penyembah berhala, dan semua pendusta ada di dalam danau yang menyala dengan api dan belerang, yaitu kematian kedua.
  revised_footnotes:
  - marker: a
    text: 'Atau: “orang-orang yang tidak setia.”'
    reason: alternative_reading
  revision_rationale: Revisi mengganti padanan yang dapat bergeser ke makna “membuat jijik” dengan “orang-orang yang keji,” yang lebih setia pada kecaman moral dalam teks sumber. Susunan “bagian ... ada di dalam” menyatakan μέρος sebagai nasib atau bagian yang ditetapkan, sedangkan “yaitu kematian kedua” menghubungkan identifikasi penutup langsung dengan danau tanpa mengubah makna.
