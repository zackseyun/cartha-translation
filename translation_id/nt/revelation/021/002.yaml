id: REV.21.2
reference: Revelation 21:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ τὴν πόλιν τὴν ἁγίαν Ἰερουσαλὴμ καινὴν εἶδον καταβαίνουσαν ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ, ἡτοιμασμένην ὡς νύμφην κεκοσμημένην τῷ ἀνδρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/002.yaml
  text: And I saw the holy city[a], new Jerusalem, coming down out of heaven from God[c][b], prepared like a bride adorned for her husband.
translation:
  language: id
  text: Lalu aku melihat kota suci itu, Yerusalem yang baru, turun dari surga, dari Allah, yang telah dipersiapkan seperti seorang pengantin perempuan yang telah didandani bagi suaminya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dapat juga diterjemahkan: “... yang sudah siap seperti seorang pengantin perempuan yang berhias bagi suaminya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πόλιν
  choice: kota
  rationale: Padanan langsung yang mempertahankan gambaran konkret tentang sebuah kota.
- source_word: ἁγίαν
  choice: yang suci
  rationale: Menyampaikan keadaan dikhususkan bagi Allah; frasa ini alami dalam bahasa Indonesia dan selaras dengan bentuk atributif Yunani.
- source_word: Ἰερουσαλὴμ καινὴν
  choice: Yerusalem yang baru
  rationale: Nama Yerusalem dipertahankan, sedangkan καινήν diterjemahkan secara deskriptif tanpa menjadikannya gelar formal melalui kapitalisasi tambahan.
- source_word: εἶδον
  choice: aku melihat
  rationale: Menerjemahkan bentuk aoristus secara langsung tanpa menambahkan tindakan lain.
- source_word: καταβαίνουσαν
  choice: turun
  rationale: Ungkapan Indonesia yang ringkas dan alami untuk gerakan dari tempat tinggi ke bawah.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: dari surga
  rationale: Dalam bahasa Indonesia, 'dari surga' secara alami menyatakan gerakan keluar dari surga; 'keluar dari surga' dapat memberi penekanan lebih kuat tetapi terasa kurang luwes di sini.
- source_word: ἀπὸ τοῦ θεοῦ
  choice: dari Allah
  rationale: Mempertahankan sumber atau asal kota tanpa menambahkan gagasan 'hadirat' yang tidak dinyatakan.
- source_word: ἡτοιμασμένην
  choice: dalam keadaan siap
  rationale: 'Mencerminkan hasil yang masih berlangsung dari partisipel perfektif pasif: kota itu telah dipersiapkan dan kini siap.'
- source_word: ὡς
  choice: seperti
  rationale: Menandai perbandingan atau simile secara jelas.
- source_word: νύμφην
  choice: seorang pengantin perempuan
  rationale: Menyatakan citra mempelai perempuan secara alami tanpa mengubahnya menjadi gelar teknis.
- source_word: κεκοσμημένην
  choice: yang telah berdandan
  rationale: Dalam konteks pernikahan, 'berdandan' secara alami mencakup berpakaian dan berhias serta mencerminkan keadaan hasil dari bentuk perfektif.
- source_word: τῷ ἀνδρὶ αὐτῆς
  choice: bagi suaminya
  rationale: Dalam konteks pengantin perempuan, ἀνήρ paling tepat berarti 'suami'; 'bagi' menyatakan orientasi persiapannya.
theological_decisions:
- issue: Apakah 'Yerusalem yang baru' harus diperlakukan sebagai gelar eskatologis formal
  choice: Yerusalem yang baru
  alternative: Yerusalem Baru
  rationale: Susunan Yunani dapat dibaca secara deskriptif, yakni Yerusalem yang baru. Kapitalisasi 'Baru' akan menjadikannya gelar formal melalui keputusan editorial yang tidak dituntut teks.
- issue: Apakah gambaran pengantin harus dijelaskan sebagai simbol umat atau gereja
  choice: Mempertahankan perbandingan dengan seorang pengantin perempuan tanpa penjelasan tambahan
  alternative: Menjelaskannya sebagai gereja atau umat Allah, pengantin Anak Domba
  rationale: Ayat ini sendiri menyajikan simile dan tidak secara eksplisit mengidentifikasi kota itu dengan kelompok tertentu; penjelasan tersebut akan melampaui terjemahan.
- issue: Hubungan sintaksis persiapan dan dandanan pengantin
  choice: dalam keadaan siap seperti seorang pengantin perempuan yang telah berdandan bagi suaminya
  alternative: disiapkan sebagai seorang pengantin perempuan yang didandani bagi suaminya
  rationale: Pilihan utama mempertahankan keadaan siap dari ἡτοιμασμένην dan perbandingan yang diperkenalkan ὡς. Alternatif yang lebih harfiah dapat memberi kesan identifikasi ('sebagai') atau tindakan pasif yang kurang alami dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Lalu' menghubungkan penglihatan ini dengan konteks tanpa kekakuan 'dan' di awal kalimat. Koma mempertahankan dua keterangan sumber berurutan, 'dari surga, dari Allah'. Penanda catatan kaki [a] ditempatkan setelah klausa yang dijelaskannya.
