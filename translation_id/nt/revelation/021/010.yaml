  source_fidelity: 'Teks Indonesia menerjemahkan seluruh unsur Yunani secara cermat: pemindahan Yohanes, rumusan visioner ἐν πνεύματι, gerak ke atas gunung yang sekaligus besar dan tinggi, tindakan memperlihatkan, serta kota kudus Yerusalem yang sedang turun dari surga dan berasal dari Allah. Pengulangan “dari” dengan tepat mempertahankan dua preposisi sumber yang berbeda (ἐκ ... ἀπό), tanpa menambahkan makna.'
