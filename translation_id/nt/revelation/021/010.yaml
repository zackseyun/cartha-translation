id: REV.21.10
reference: Revelation 21:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἀπήνεγκέν με ἐν πνεύματι ἐπὶ ὄρος μέγα καὶ ὑψηλόν, καὶ ἔδειξέν μοι τὴν ⸀πόλιν τὴν ἁγίαν Ἰερουσαλὴμ καταβαίνουσαν ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/010.yaml
  text: And he carried me away in the Spirit onto a great and high mountain[a], and showed me the holy city, Jerusalem, coming down out of heaven from God,
translation:
  language: id
  text: Lalu ia membawa aku dalam Roh[a] ke atas sebuah gunung yang besar dan tinggi, dan memperlihatkan kepadaku kota yang kudus itu, Yerusalem, yang sedang turun dari surga, dari Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dalam roh.” Ungkapan Yunani ini dapat menunjuk pada keadaan saat menerima penglihatan; dalam kitab Wahyu ungkapan ini lazim mengantar penglihatan kenabian.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήνεγκέν
  choice: membawa aku
  rationale: Bentuk aoris ἀποφέρω menggambarkan pemindahan Yohanes ke tempat pengamatan lain dalam konteks penglihatan. “Membawa aku” alami dalam bahasa Indonesia dan tetap menyatakan tindakan membawa dari satu tempat ke tempat lain.
- source_word: ἐν πνεύματι
  choice: dalam Roh[a]
  rationale: Ungkapan ini berulang kali menandai keadaan penglihatan kenabian dalam Wahyu. Huruf kapital mencerminkan kemungkinan kuat bahwa Roh Kuduslah yang berkarya, sedangkan catatan kaki mempertahankan kemungkinan arti yang lebih umum.
- source_word: ἐπὶ ὄρος μέγα καὶ ὑψηλόν
  choice: ke atas sebuah gunung yang besar dan tinggi
  rationale: ἐπί dengan akusatif menyatakan gerak menuju atau naik ke atas gunung. Kedua sifat, μέγα dan ὑψηλόν, dipertahankan sebagai “besar” dan “tinggi” karena menyampaikan ciri yang berbeda.
- source_word: ἔδειξέν μοι
  choice: memperlihatkan kepadaku
  rationale: Terjemahan langsung dan alami dari δείκνυμι tanpa menambahkan gagasan teologis yang tidak dinyatakan oleh verba itu sendiri.
- source_word: τὴν πόλιν τὴν ἁγίαν
  choice: kota yang kudus itu
  rationale: Susunan ini mempertahankan makna πόλις dan ἅγιος serta artikel Yunani yang menunjuk kepada kota tertentu.
- source_word: Ἰερουσαλήμ
  choice: Yerusalem
  rationale: Mengikuti bentuk nama tempat yang baku dalam bahasa Indonesia.
- source_word: καταβαίνουσαν
  choice: yang sedang turun
  rationale: Partisipel kini menggambarkan kota itu dalam proses turun; “sedang turun” membuat aspek tersebut jelas dan tetap alami.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: dari surga
  rationale: Dalam hubungan dengan verba gerak turun, “dari surga” secara alami menyatakan asal yang ditandai oleh ἐκ.
- source_word: ἀπὸ τοῦ θεοῦ
  choice: dari Allah
  rationale: ἀπό menandai sumber. Terjemahan ini tepat dan tidak menambahkan unsur seperti “hadirat” yang tidak tersurat.
theological_decisions:
- issue: Acuan πνεῦμα dalam rumusan penglihatan ἐν πνεύματι
  choice: “dalam Roh,” dengan huruf kapital
  alternative: “dalam roh,” yang dapat menunjuk pada keadaan rohani atau roh Yohanes
  rationale: Dalam kitab Wahyu, ungkapan ini menjadi rumusan berulang yang mengantar penglihatan kenabian dan kemungkinan besar menunjuk pada karya Roh Kudus. Namun, karena bentuk Yunani sendiri tidak sepenuhnya meniadakan pengertian keadaan rohani, alternatif itu dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mempertahankan rangkaian tindakan serta gambaran gerak dalam teks Yunani, tetapi memakai ungkapan yang mudah dipahami pembaca umum.
