  source_fidelity: 'Terjemahan secara akurat menyampaikan struktur dan makna Yunani: ἐνδώμησις sebagai “bahan,” τεῖχος sebagai “tembok kota,” ἴασπις sebagai “batu yaspis,” serta kota yang berupa emas murni dan dibandingkan dengan kaca murni. “Terbuat dari” merupakan pelengkapan idiomatis bahasa Indonesia yang tidak menambah makna asing.'
