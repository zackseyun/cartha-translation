id: REV.21.18
reference: Revelation 21:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀καὶ ἡ ἐνδώμησις τοῦ τείχους αὐτῆς ἴασπις, καὶ ἡ πόλις χρυσίον καθαρὸν ὅμοιον ὑάλῳ καθαρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/018.yaml
  text: And the material of its wall was jasper[a], and the city was pure gold[b], like pure glass.
translation:
  language: id
  text: Bahan tembok kota itu adalah batu yaspis[a], dan kota itu terbuat dari emas murni, seperti kaca murni[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “susunan tembok kota itu adalah batu yaspis.” Kata Yunani yang dipakai dapat menunjuk pada bahan, susunan, atau hasil pekerjaan bangunan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “seperti kaca bening.” Perbandingan ini menekankan kejernihan dan cahaya kota itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδώμησις
  choice: bahan
  rationale: Nomina ini dapat menunjuk pada bahan atau susunan bangunan. Dalam konteks ini, predikat ἴασπις dan uraian berikutnya tentang emas menonjolkan bahan penyusunnya; 'bahan' alami dan tidak mengesankan tindakan membangun.
- source_word: τεῖχος
  choice: tembok kota
  rationale: Kata ini menunjuk pada tembok pertahanan yang mengelilingi kota. 'Tembok kota' lebih tepat daripada sekadar 'dinding' dalam konteks Yerusalem Baru.
- source_word: ἴασπις
  choice: batu yaspis
  rationale: Nama batu permata ini secara tradisional ditransliterasikan. Penambahan 'batu' membantu pembaca umum mengenalinya sebagai bahan mineral, tanpa menyamakan batu kuno itu secara pasti dengan yaspis modern.
- source_word: χρυσίον καθαρόν
  choice: emas murni
  rationale: χρυσίον menyatakan emas sebagai bahan, sedangkan καθαρόν di sini menyatakan kemurnian atau pemurnian, bukan kebersihan ritual.
- source_word: ὅμοιον
  choice: seperti
  rationale: Bentuk ini memperkenalkan perbandingan dan paling alami diterjemahkan 'seperti'.
- source_word: ὕαλῳ καθαρῷ
  choice: kaca murni
  rationale: Terjemahan ini mempertahankan pengulangan καθαρός dalam bahasa Yunani. Dalam perbandingan dengan kaca, ungkapan itu juga menyiratkan kejernihan yang bercahaya, meskipun dapat dipahami sebagai 'kaca bening'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada agung tetapi mudah dipahami. 'Tembok kota' dipilih agar konteks pertahanan kota jelas; 'terbuat dari' ditambahkan secara wajar untuk mengungkapkan hubungan predikatif bahasa Yunani dalam bahasa Indonesia.
