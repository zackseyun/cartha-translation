source:
  edition: SBLGNT
  text: καὶ ἐμέτρησεν τὸ τεῖχος αὐτῆς ἑκατὸν τεσσεράκοντα τεσσάρων πηχῶν, μέτρον ἀνθρώπου, ὅ ἐστιν ἀγγέλου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/017.yaml
  text: And he measured its wall[a], 144 cubits by human measure, which is also an angel’s measure.
translation:
  language: id
  text: Lalu ia mengukur tembok kota itu, 144 hasta menurut ukuran manusia, yang merupakan ukuran malaikat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menurut ukuran manusia, yaitu ukuran malaikat.” Bahasa Yunani dapat menekankan bahwa malaikat memakai satuan ukuran manusia, atau bahwa ukuran manusia dan malaikat bersesuaian di sini.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμέτρησεν
  choice: mengukur
  rationale: Bentuk aoristus aktif indikatif dari μετρέω menyatakan tindakan mengukur secara langsung; “mengukur” adalah padanan Indonesia yang alami dan tepat.
- source_word: τὸ τεῖχος αὐτῆς
  choice: tembok kota itu
  rationale: τεῖχος menunjuk pada tembok pertahanan kota, sedangkan αὐτῆς merujuk kepada kota. Menyebut “kota itu” membuat acuannya jelas dan lebih alami daripada bentuk posesif yang berpotensi kabur.
- source_word: ἑκατὸν τεσσεράκοντα τεσσάρων πηχῶν
  choice: 144 hasta
  rationale: Angka dipertahankan tanpa konversi karena teks menonjolkan satuan kuno. “Hasta” merupakan istilah Indonesia yang lazim untuk πῆχυς.
- source_word: μέτρον ἀνθρώπου
  choice: menurut ukuran manusia
  rationale: μέτρον dapat berarti ukuran atau standar pengukuran, dan ἀνθρώπου bersifat generik. Ungkapan ini menyampaikan bahwa pengukuran dinyatakan menurut ukuran manusia.
- source_word: ὅ ἐστιν ἀγγέλου
  choice: yang juga merupakan ukuran malaikat
  rationale: Klausa Yunani bersifat eliptis. Pengulangan kata “ukuran” menjadikannya jelas dalam bahasa Indonesia, sementara “juga” menampilkan hubungan kesepadanan tanpa meniadakan kepadatan dan ambiguitas ungkapan sumber.
theological_decisions:
- issue: Makna μέτρον ἀνθρώπου, ὅ ἐστιν ἀγγέλου
  choice: Ukuran tersebut dinyatakan sebagai ukuran manusia yang sekaligus merupakan ukuran malaikat.
  alternative: Menurut ukuran seorang manusia, yaitu malaikat itu; atau penekanan bahwa ukuran manusia dan malaikat bersesuaian dalam konteks ini.
  rationale: Bahasa Yunani padat dan dapat dipahami dengan lebih dari satu penekanan. Teks utama mempertahankan hubungan penjelas antara ukuran manusia dan ukuran malaikat, sedangkan catatan kaki mencatat kemungkinan bahwa yang dimaksud ialah standar manusia yang dipakai oleh malaikat itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. “Hasta” mempertahankan satuan kuno, dan angka ditulis sebagai 144 demi keterbacaan.
