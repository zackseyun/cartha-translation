  yaml_path: translation/nt/revelation/021/025.yaml
  text: And its gates will never be shut by day—for there will be no night there—[a][b]
translation:
  language: id
  text: Dan gerbang-gerbangnya tidak akan pernah ditutup pada siang hari, sebab di sana tidak akan ada malam.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “gerbang-gerbangnya pasti tidak akan ditutup pada siang hari.” Bahasa Yunani memakai bentuk penyangkalan yang sangat tegas.
    reason: lexical_alternative
  - marker: b
    text: Alasan yang diberikan ialah bahwa “di sana tidak akan ada malam.”
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: Dan
  rationale: Kata penghubung sederhana yang mengaitkan ayat ini dengan gambaran kota pada ayat sebelumnya.
- source_word: οἱ πυλῶνες αὐτῆς
  choice: pintu-pintu gerbangnya
  rationale: Dalam konteks kota, πυλῶνες menunjuk pada pintu-pintu gerbang atau kompleks gerbang kota; bentuk ini alami dalam bahasa Indonesia dan akhiran -nya mengacu pada kota tanpa menambahkan personifikasi.
- source_word: οὐ μὴ κλεισθῶσιν
  choice: tidak akan pernah ditutup
  rationale: Konstruksi οὐ μή dengan subjungtif aoris menyatakan penyangkalan masa depan yang sangat tegas; 'tidak akan pernah' mempertahankan daya penegasannya.
- source_word: ἡμέρας
  choice: pada siang hari
  rationale: Genitif ini berfungsi secara temporal dan membentuk kontras langsung dengan 'malam' dalam klausa berikutnya.
- source_word: νὺξ γὰρ οὐκ ἔσται ἐκεῖ
  choice: sebab di sana tidak akan ada malam
  rationale: Kata γάρ menyatakan alasan, sedangkan οὐκ ἔσται mempertahankan makna eksistensial 'tidak akan ada'.
theological_decisions:
- issue: Tingkat personifikasi Yerusalem Baru
  choice: Menggunakan akhiran '-nya' yang mengacu pada kota
  alternative: Menggunakan bentuk yang secara eksplisit mempersonifikasikan kota sebagai perempuan
  rationale: αὐτῆς berbentuk feminin karena kesesuaian gramatikal dengan kata Yunani untuk kota. Bahasa Indonesia tidak memiliki keharusan gender gramatikal tersebut, dan personifikasi tidak perlu ditonjolkan dalam klausa ini.
- issue: Hubungan logis antara gerbang yang terbuka dan tidak adanya malam
  choice: Menerjemahkan γάρ sebagai 'sebab'
  alternative: Menghubungkan kedua klausa hanya dengan tanda pisah atau 'dan'
  rationale: Terjemahan 'sebab' mempertahankan hubungan penjelasan yang dinyatakan secara eksplisit oleh γάρ tanpa menentukan lebih jauh makna teologis dari keadaan kota itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. 'Pintu-pintu gerbang' mempertahankan citra gerbang kota, sedangkan 'tidak akan pernah ditutup' menyampaikan penyangkalan Yunani yang tegas secara alami.
