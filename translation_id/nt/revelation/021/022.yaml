  text: Καὶ ναὸν οὐκ εἶδον ἐν αὐτῇ, ὁ γὰρ κύριος, ὁ θεός, ὁ παντοκράτωρ, ναὸς αὐτῆς ἐστιν, καὶ τὸ ἀρνίον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/022.yaml
  text: And I saw no temple in it[a], for the Lord God, the Almighty[b], is its temple, and the Lamb.
translation:
  language: id
  text: Aku tidak melihat Bait Suci di kota itu[a], sebab Tuhan Allah, Yang Mahakuasa, adalah Bait Sucinya, demikian juga Anak Domba itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tempat kudus.” Kata Yunani ναός dapat secara khusus menunjuk pada ruang kudus di dalam kompleks Bait Allah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὸν / ναὸς
  choice: Bait Allah
  rationale: Ναός menunjuk pada bait atau ruang kudus, bukan sekadar bangunan keagamaan secara umum. “Bait Allah” adalah padanan Indonesia yang alami dan mempertahankan kontras antara tidak adanya bangunan bait dengan Allah dan Anak Domba sendiri sebagai Bait Allah kota itu.
- source_word: οὐκ εἶδον
  choice: Aku tidak melihat
  rationale: Mencerminkan bentuk aoristus ὁράω yang dinegasikan secara langsung dan wajar dalam bahasa Indonesia.
- source_word: ἐν αὐτῇ
  choice: di kota itu
  rationale: Pronomina Yunani merujuk kepada kota. Mengulangi “kota itu” memperjelas acuan dan terdengar lebih alami daripada memakai bentuk yang meniru gender gramatikal Yunani.
- source_word: ὁ κύριος, ὁ θεός, ὁ παντοκράτωρ
  choice: Tuhan, Allah Yang Mahakuasa
  rationale: Mempertahankan rangkaian gelar ilahi dan hubungan aposisionalnya tanpa menambahkan penjelasan teologis yang tidak dinyatakan teks.
- source_word: ναὸς αὐτῆς ἐστιν
  choice: adalah Bait Allahnya
  rationale: Mempertahankan predikat tunggal dan pronomina posesif yang mengacu kepada kota tersebut.
- source_word: καὶ τὸ ἀρνίον
  choice: dan Anak Domba juga
  rationale: Menjaga Anak Domba sebagai unsur koordinatif yang ditambahkan sesudah predikat, sebagaimana susunan Yunani, sambil menghasilkan kalimat Indonesia yang dapat dipahami.
theological_decisions:
- issue: Hubungan “Tuhan, Allah Yang Mahakuasa” dan “Anak Domba” dengan predikat “Bait Allahnya”
  choice: Mempertahankan predikat tunggal lebih dahulu, lalu menambahkan “dan Anak Domba juga.”
  alternative: “Tuhan, Allah Yang Mahakuasa, dan Anak Domba adalah Bait Allahnya.”
  rationale: Susunan ini mempertahankan ἐστιν dalam bentuk tunggal dan posisi καὶ τὸ ἀρνίον yang muncul sesudah predikat. Kata “juga” menjelaskan elipsis yang alami dalam bahasa Indonesia tanpa melemahkan bahwa Anak Domba pun menjadi Bait Allah kota itu atau memaksakan rumusan teologis di luar teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Aku” mengikuti tuturan penglihatan orang pertama; “kota itu” dipakai untuk acuan yang jelas. Kapitalisasi “Bait Allah,” “Yang Mahakuasa,” dan “Anak Domba” mencerminkan gelar serta rujukan khusus dalam konteks Wahyu.
