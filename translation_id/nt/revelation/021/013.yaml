  text: ἀπὸ ⸀ἀνατολῆς πυλῶνες τρεῖς, καὶ ἀπὸ βορρᾶ πυλῶνες τρεῖς, καὶ ἀπὸ νότου πυλῶνες τρεῖς, καὶ ἀπὸ δυσμῶν πυλῶνες τρεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/013.yaml
  text: On the east[a], three gates; and on the north, three gates; and on the south, three gates; and on the west, three gates.
translation:
  language: id
  text: Di sebelah timur[a] ada tiga pintu gerbang, dan di sebelah utara ada tiga pintu gerbang, dan di sebelah selatan ada tiga pintu gerbang, dan di sebelah barat ada tiga pintu gerbang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Dari timur ... dari utara ... dari selatan ... dari barat”; di sini ungkapan itu diterjemahkan secara idiomatis untuk menunjukkan sisi tempat pintu-pintu gerbang tersebut berada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ ἀνατολῆς
  choice: di sebelah timur
  rationale: Dalam uraian denah kota ini, frasa tersebut menunjukkan letak pada sisi timur. Pilihan ini lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “dari timur”, yang dapat menyiratkan asal atau gerakan.
- source_word: πυλῶνες
  choice: pintu gerbang
  rationale: πυλών dapat menunjuk pada gerbang atau bangunan jalan masuk yang besar. “Pintu gerbang” jelas, wajar, dan sesuai dengan konteks tembok Yerusalem Baru tanpa menambahkan rincian arsitektural yang tidak dinyatakan.
- source_word: τρεῖς
  choice: tiga
  rationale: Bilangan pokok ini diterjemahkan langsung dan diulang pada setiap sisi untuk mempertahankan pola simetris sumber.
- source_word: ἀπὸ βορρᾶ
  choice: di sebelah utara
  rationale: Menunjukkan sisi tempat gerbang-gerbang itu berada dan diterjemahkan sejajar dengan ketiga arah lainnya.
- source_word: ἀπὸ νότου
  choice: di sebelah selatan
  rationale: Menunjukkan sisi tempat gerbang-gerbang itu berada dan mempertahankan kesejajaran struktur ayat.
- source_word: ἀπὸ δυσμῶν
  choice: di sebelah barat
  rationale: Bentuk ini secara idiomatis menunjuk arah matahari terbenam, yaitu barat; dalam konteks ini frasa tersebut menunjukkan sisi barat kota.
- source_word: καὶ ... καὶ ... καὶ ...
  choice: '[deretan klausa sejajar, dengan “dan” sebelum klausa terakhir]'
  rationale: Bahasa Indonesia baku lazim memakai koma dalam perincian dan “dan” sebelum unsur terakhir. Pengulangan lengkap kata sambung Yunani tidak dipaksakan, tetapi irama terukur dan simetrinya dipertahankan melalui pengulangan susunan klausa.
theological_decisions:
- issue: Gambaran ruang tentang pintu-pintu gerbang Yerusalem Baru
  choice: 'Daftar arsitektural langsung: tiga pintu gerbang pada masing-masing dari empat sisi kota.'
  alternative: Ayat ini mungkin memiliki gema simbolis dari susunan suku-suku Israel atau penglihatan kota dalam Yehezkiel.
  rationale: Ayat itu sendiri hanya menyebut jumlah dan letak pintu-pintu gerbang. Terjemahan tidak memasukkan tafsiran simbolis ke dalam teks, sehingga kemungkinan gema kanonis tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku yang modern, lugas, dan khidmat. Pengulangan “ada tiga pintu gerbang” mempertahankan irama enumeratif dan simetri teks Yunani, sedangkan “di sebelah” secara alami menyatakan lokasi pada setiap sisi kota.
