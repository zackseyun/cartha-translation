  source_fidelity: 'Teks Indonesia dengan setia mencerminkan unsur-unsur utama SBLGNT: suara nyaring, asal suara dari takhta, seruan perhatian, σκηνή sebagai “kemah,” kehadiran Allah di tengah manusia, σκηνώσει sebagai “akan tinggal,” λαοὶ dalam bentuk jamak melalui “umat-umat-Nya,” serta penegasan “Allah sendiri.” “Di tengah-tengah manusia” menyampaikan secara wajar maksud kehadiran Allah dengan manusia dalam konteks ini, tanpa mengubah cakupan manusia secara umum.'
  naturalness: Bahasanya modern, jelas, dan tetap khidmat. “Umat-umat-Nya” memang kurang lazim dalam pemakaian sehari-hari, tetapi merupakan pilihan yang dapat dibenarkan untuk mempertahankan bentuk jamak λαοὶ dan masih dapat dipahami. Pengulangan “bersama mereka” sesuai dengan penekanan dan struktur sumber.
  terminology: “Takhta,” “kemah Allah,” “Allah sendiri,” dan “umat-umat-Nya” konsisten dengan register Alkitab bahasa Indonesia dan dengan istilah penting sumber. Catatan kaki secara memadai menerangkan citra kemah dan bentuk jamak “umat-umat,” tanpa memaksakan penafsiran teologis.
