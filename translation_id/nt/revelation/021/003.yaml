id: REV.21.3
reference: Revelation 21:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἤκουσα φωνῆς μεγάλης ἐκ τοῦ ⸀θρόνου λεγούσης· Ἰδοὺ ἡ σκηνὴ τοῦ θεοῦ μετὰ τῶν ἀνθρώπων, καὶ σκηνώσει μετ’ αὐτῶν, καὶ αὐτοὶ ⸀λαοὶ αὐτοῦ ἔσονται, καὶ αὐτὸς ὁ θεὸς ⸂μετ’ αὐτῶν ἔσται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/003.yaml
  text: And I heard a loud voice from the throne saying[a], “Behold, the dwelling place of God is with humanity, and he will dwell with them, and they will be his peoples[d][c][b], and God himself will be with them.”
translation:
  language: id
  text: Lalu aku mendengar suara nyaring dari takhta itu berkata, “Lihatlah, kemah Allah[a] ada di tengah-tengah manusia[b]. Ia akan tinggal[c] bersama mereka, dan mereka akan menjadi umat-umat-Nya[d], dan Allah sendiri akan bersama mereka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tempat kediaman Allah”. Kata Yunani σκηνή secara harfiah berarti “kemah” dan membangkitkan gambaran Kemah Suci.
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani yang diterjemahkan “manusia” merujuk kepada manusia pada umumnya.
    reason: lexical_clarification
  - marker: c
    text: Kata kerja Yunani ini berkerabat dengan kata “kemah”; secara lebih harfiah, “Ia akan berkemah bersama mereka”.
    reason: lexical_alternative
  - marker: d
    text: Teks Yunani memakai bentuk jamak, “umat-umat”, bukan bentuk tunggal “umat”.
    reason: alternative_reading
lexical_decisions:
- source_word: φωνῆς μεγάλης
  choice: suara nyaring
  rationale: Dalam ungkapan ini μέγας menunjukkan keras atau kuatnya suara; “suara nyaring” alami dalam bahasa Indonesia dan cocok dengan suasana maklumat yang khidmat.
- source_word: ἐκ τοῦ θρόνου
  choice: dari takhta itu
  rationale: ἐκ menunjukkan asal suara. Kata penunjuk “itu” membuat frasa tersebut alami dalam bahasa Indonesia, dengan takhta yang sudah hadir dalam konteks penglihatan.
- source_word: Ἰδοὺ
  choice: Lihatlah
  rationale: “Lihatlah” mempertahankan fungsi ἰδού sebagai seruan yang meminta perhatian, tanpa memakai bentuk yang usang.
- source_word: ἡ σκηνὴ τοῦ θεοῦ
  choice: kemah Allah
  rationale: “Kemah” mempertahankan gambaran konkret σκηνή dan kaitannya dengan tempat kediaman Allah, sekaligus tetap mudah dipahami pembaca modern.
- source_word: μετὰ τῶν ἀνθρώπων
  choice: di tengah-tengah manusia
  rationale: ἄνθρωποι mengacu kepada umat manusia secara umum, bukan hanya laki-laki. Dalam konteks kediaman Allah, “di tengah-tengah manusia” mengungkapkan kehadiran bersama mereka secara alami.
- source_word: σκηνώσει
  choice: Ia akan tinggal
  rationale: σκηνόω berarti tinggal atau berkemah. “Tinggal” merupakan ungkapan utama yang wajar, sedangkan hubungan katanya dengan “kemah” dijelaskan dalam catatan kaki.
- source_word: λαοὶ αὐτοῦ
  choice: umat-umat-Nya
  rationale: Bentuk Yunani λαοί adalah jamak. “Umat-umat-Nya” mempertahankan kejamakan yang tidak boleh diratakan menjadi bentuk tunggal tradisional.
- source_word: αὐτὸς ὁ θεός
  choice: Allah sendiri
  rationale: “Sendiri” menyampaikan penekanan αὐτός pada kehadiran Allah secara langsung.
- source_word: μετ’ αὐτῶν ἔσται
  choice: akan bersama mereka
  rationale: Terjemahan ini mempertahankan pernyataan sederhana mengenai kehadiran Allah bersama mereka tanpa menambahkan penafsiran.
theological_decisions:
- issue: Bentuk jamak λαοὶ dibandingkan bentuk tunggal tradisional “umat”
  choice: mereka akan menjadi umat-umat-Nya
  alternative: mereka akan menjadi umat-Nya
  rationale: Teks kritis Yunani memakai λαοί dalam bentuk jamak. Bentuk “umat-umat” mempertahankan ciri teks yang mungkin menunjuk kepada banyak bangsa yang menjadi milik Allah, tanpa memaksakan penjelasan teologis tertentu.
- issue: Gambaran kemah dalam σκηνή dan σκηνόω
  choice: kemah Allah ... Ia akan tinggal bersama mereka
  alternative: tempat kediaman Allah ... Ia akan berkemah bersama mereka
  rationale: “Kemah Allah” mempertahankan gambaran utama dan gema tempat kediaman ilahi, sedangkan “tinggal” menjaga kelancaran bahasa Indonesia. Catatan kaki menerangkan hubungan kata yang terdapat dalam bahasa Yunani.
- issue: Cakupan τῶν ἀνθρώπων
  choice: manusia
  alternative: orang-orang
  rationale: “Manusia” menyatakan umat manusia secara umum dan tidak membatasi rujukannya berdasarkan jenis kelamin.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. “Lalu” dipakai untuk καί pada awal ayat sebagai penghubung naratif. Pronomina yang merujuk kepada Allah ditulis dengan huruf kapital sesuai kebiasaan umum penerbitan Alkitab bahasa Indonesia. Kejamakan “umat-umat” sengaja dipertahankan meskipun kurang lazim karena mencerminkan bentuk sumber.
