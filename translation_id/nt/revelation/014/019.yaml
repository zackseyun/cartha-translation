id: REV.14.19
reference: Revelation 14:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν ὁ ἄγγελος τὸ δρέπανον αὐτοῦ εἰς τὴν γῆν, καὶ ἐτρύγησεν τὴν ἄμπελον τῆς γῆς, καὶ ἔβαλεν εἰς τὴν ληνὸν τοῦ θυμοῦ τοῦ θεοῦ τὸν μέγαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/019.yaml
  text: And the angel swung his sickle over the earth, and harvested the vine of the earth, and threw it into the great winepress of the wrath of God.
translation:
  language: id
  text: Lalu malaikat itu mengayunkan sabitnya ke bumi, memanen tanaman anggur di bumi, dan melemparkannya ke dalam tempat pemerasan anggur besar milik murka Allah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔβαλεν ... τὸ δρέπανον ... εἰς τὴν γῆν
  choice: mengayunkan sabitnya ke bumi
  rationale: Dalam konteks tindakan menuai, ungkapan ini menggambarkan sabit yang diarahkan dan diayunkan untuk bekerja pada bumi; pilihan ini alami dalam bahasa Indonesia tanpa menyiratkan bahwa sabit ditinggalkan atau dilemparkan begitu saja.
- source_word: ἐτρύγησεν
  choice: memanen
  rationale: Kata ini secara khusus dipakai untuk mengumpulkan panen, terutama buah anggur; “memanen” mempertahankan tindakan panen dan cocok dengan objek berikutnya.
- source_word: τὴν ἄμπελον τῆς γῆς
  choice: tanaman anggur bumi
  rationale: Terjemahan ini mempertahankan metafora tunggal “tanaman anggur” serta hubungan genitif “bumi,” tanpa mengubahnya menjadi “kebun anggur” atau secara eksplisit membatasi objek pada buahnya.
- source_word: ληνὸν
  choice: tempat pemerasan anggur
  rationale: Ungkapan deskriptif ini lebih mudah dipahami pembaca modern daripada istilah teknis atau arkais seperti “kilangan,” dan tetap menunjuk pada tempat anggur diperas.
- source_word: θυμοῦ
  choice: murka
  rationale: Dalam konteks penghakiman ilahi, “murka” menyampaikan kemarahan yang kuat dan serius dengan register yang sesuai.
theological_decisions:
- issue: Hubungan antara tempat pemerasan anggur dan murka Allah
  choice: tempat pemerasan anggur yang besar dari murka Allah
  alternative: tempat pemerasan anggur yang besar, yaitu murka Allah
  rationale: Genitif Yunani menghubungkan tempat pemerasan itu dengan murka Allah, tetapi tidak secara eksplisit menyamakannya dengan murka Allah. Terjemahan mempertahankan hubungan metaforis tersebut tanpa menambahkan penjelasan identifikatif.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Citra panen serta tempat pemerasan anggur dipertahankan, sementara istilah yang berpotensi arkais dihindari.
