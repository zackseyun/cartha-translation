  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ἄγγελος ἐξῆλθεν ἐκ τοῦ ναοῦ τοῦ ἐν τῷ οὐρανῷ, ἔχων καὶ αὐτὸς δρέπανον ὀξύ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/017.yaml
  text: And another angel came out from the temple in heaven[a], also having a sharp sickle.
translation:
  language: id
  text: Lalu seorang malaikat lain keluar dari Bait Suci yang ada di surga[a]. Ia juga mempunyai sebilah sabit tajam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tempat kudus yang ada di surga.” Kata Yunani naos dapat secara lebih khusus merujuk kepada tempat kudus, bukan seluruh kompleks Bait Suci.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: seorang malaikat lain
  rationale: ἄλλος menunjuk kepada malaikat lain dalam rangkaian penglihatan; susunan ini alami dalam bahasa Indonesia dan tidak menyiratkan perbedaan jenis.
- source_word: ἐξῆλθεν
  choice: keluar
  rationale: Bentuk aoris ἐξέρχομαι menyatakan gerakan dari dalam ke luar; 'keluar' ringkas dan tepat.
- source_word: ναοῦ
  choice: Bait Suci
  rationale: ναός dapat menunjuk secara khusus kepada tempat suci atau bangunan inti Bait Allah. 'Bait Suci' merupakan padanan Indonesia yang lazim dan bermartabat, sementara arti yang lebih khusus dicatat dalam catatan kaki.
- source_word: τοῦ ἐν τῷ οὐρανῷ
  choice: yang ada di surga
  rationale: Frasa atributif ini menerangkan bahwa Bait Suci tersebut berada di surga; bentuk eksplisit ini jelas dan alami.
- source_word: ἔχων καὶ αὐτὸς
  choice: Ia juga memegang
  rationale: καὶ αὐτός menekankan bahwa malaikat ini pun mempunyai sabit, seperti tokoh sebelumnya. Kalimat mandiri lebih alami dalam bahasa Indonesia tanpa kehilangan hubungan itu.
- source_word: δρέπανον
  choice: sebilah sabit
  rationale: δρέπανον adalah alat panen berupa sabit. Penggolong 'sebilah' sesuai untuk benda bermata tajam dan menghasilkan ungkapan Indonesia yang alami.
- source_word: ὀξύ
  choice: tajam
  rationale: ὀξύ menerangkan ketajaman sabit secara langsung dan mempertahankan gambaran yang hidup.
theological_decisions:
- issue: Hakikat gambaran Bait Suci surgawi
  choice: Menerjemahkan ναός secara langsung sebagai 'Bait Suci' tanpa uraian interpretatif.
  alternative: Menerjemahkannya sebagai 'tempat kudus' atau memparafrasakannya sebagai kediaman surgawi yang simbolis.
  rationale: Ayat ini menyajikan gambaran apokaliptik tanpa menjelaskan apakah bangunan tersebut dipahami secara arsitektural, simbolis, atau liturgis. Terjemahan mempertahankan gambaran dan ketegangan itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak naratif yang jelas dan bermartabat. 'Lalu' menghubungkan ayat ini dengan urutan penglihatan sebelumnya; kalimat partisipial Yunani dibagi menjadi dua kalimat agar alami dan mudah dipahami.
