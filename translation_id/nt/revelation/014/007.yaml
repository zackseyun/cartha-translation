id: REV.14.7
reference: Revelation 14:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγων ἐν φωνῇ μεγάλῃ· Φοβήθητε τὸν ⸀θεὸν καὶ δότε αὐτῷ δόξαν, ὅτι ἦλθεν ἡ ὥρα τῆς κρίσεως αὐτοῦ, καὶ προσκυνήσατε ⸂τῷ ποιήσαντι⸃ τὸν οὐρανὸν καὶ τὴν γῆν ⸀καὶ θάλασσαν καὶ πηγὰς ὑδάτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/007.yaml
  text: saying with a loud voice[a], “Fear God and give him glory, because the hour of his judgment has come[b], and worship the one who made heaven and earth and sea and springs of waters.”
translation:
  language: id
  text: Ia berkata dengan suara nyaring, “Takutlah akan Allah[a] dan muliakanlah Dia, sebab saat penghakiman-Nya telah tiba, dan sembahlah Dia yang telah menjadikan langit, bumi, laut, dan mata-mata air[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Hormatilah Allah dengan penuh rasa gentar.” Kata Yunani ini dapat mencakup rasa takut maupun hormat mendalam di hadapan Allah.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “sumber-sumber air.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων ἐν φωνῇ μεγάλῃ
  choice: katanya dengan suara nyaring
  rationale: Mempertahankan hubungan partisipial dengan ayat sebelumnya melalui 'katanya' dan menerjemahkan ungkapan instrumental secara alami serta bermartabat.
- source_word: Φοβήθητε τὸν θεὸν
  choice: Takutlah akan Allah
  rationale: '''Takutlah'' mempertahankan cakupan antara rasa gentar dan hormat mendalam dalam konteks ibadah serta penghakiman; konstruksi ''takut akan Allah'' alami dalam ragam Indonesia alkitabiah-modern.'
- source_word: δότε αὐτῷ δόξαν
  choice: muliakanlah Dia
  rationale: Ungkapan ini menyampaikan tindakan memberi kemuliaan kepada Allah dengan bahasa Indonesia yang ringkas dan wajar, tanpa melemahkannya menjadi sekadar menghormati.
- source_word: ὅτι ἦλθεν ἡ ὥρα τῆς κρίσεως αὐτοῦ
  choice: sebab saat penghakiman-Nya telah tiba
  rationale: '''Sebab'' menyatakan alasan bagi perintah; ''saat'' mempertahankan ketajaman temporal ὥρα, dan ''penghakiman-Nya'' membiarkan genitif mencakup penghakiman yang berasal dari atau menjadi milik Allah.'
- source_word: προσκυνήσατε τῷ ποιήσαντι
  choice: Sembahlah Dia yang telah menjadikan
  rationale: Dalam konteks Wahyu, προσκυνέω menunjuk pada penyembahan religius. Bentuk 'Dia yang telah menjadikan' mempertahankan daya verbal partisipel dan identitas Sang Pencipta.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν καὶ θάλασσαν
  choice: langit, bumi, laut
  rationale: Merupakan susunan penciptaan yang jelas dan alami dalam bahasa Indonesia; deretan dengan koma mengungkapkan koordinasi Yunani tanpa terasa kaku.
- source_word: πηγὰς ὑδάτων
  choice: mata-mata air
  rationale: Padanan idiomatis Indonesia untuk sumber-sumber air alami; bentuk ulang menandai jamak πηγὰς, sedangkan unsur air sudah terkandung secara leksikal.
theological_decisions:
- issue: Cakupan perintah Φοβήθητε τὸν θεόν
  choice: Takutlah akan Allah
  alternative: Hormatilah Allah dengan penuh rasa gentar
  rationale: Pilihan utama tidak menghapus ketegangan antara rasa takut menghadapi penghakiman dan rasa hormat mendalam kepada Sang Pencipta.
- issue: Makna τῆς κρίσεως αὐτοῦ
  choice: penghakiman-Nya
  alternative: penghakiman oleh-Nya
  rationale: Bentuk posesif mempertahankan keluasan genitif Yunani dan tidak memaksakan analisis sempit mengenai relasi Allah dengan penghakiman itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Diksi 'suara nyaring', 'Takutlah akan Allah', dan 'penghakiman-Nya' mempertahankan nada apokaliptik tanpa menjadi usang. Semua penanda catatan kaki dicantumkan dalam teks utama.
