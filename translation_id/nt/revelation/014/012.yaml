id: REV.14.12
reference: Revelation 14:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ὧδε ἡ ὑπομονὴ τῶν ἁγίων ἐστίν, οἱ τηροῦντες τὰς ἐντολὰς τοῦ θεοῦ καὶ τὴν πίστιν Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/012.yaml
  text: Here is the endurance of the saints[a], those who keep the commandments of God and the faith of Jesus.
translation:
  language: id
  text: Di sinilah ketekunan orang-orang kudus, yaitu mereka yang menaati perintah-perintah Allah dan berpegang pada iman Yesus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “iman kepada Yesus”; kemungkinan lain, “kesetiaan Yesus.” Frasa Yunani ini dapat dipahami dengan lebih dari satu cara.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὧδε
  choice: Di sinilah
  rationale: Ungkapan penunjuk ini mengarahkan perhatian pada keadaan yang baru saja digambarkan dan mempertahankan daya retoris teks Yunani.
- source_word: ὑπομονὴ
  choice: ketekunan
  rationale: Kata ini menunjuk pada keteguhan untuk terus bertahan di bawah tekanan atau pencobaan; “ketekunan” alami dan bermartabat dalam bahasa Indonesia.
- source_word: ἁγίων
  choice: orang-orang kudus
  rationale: Sebutan Perjanjian Baru bagi umat yang dikhususkan bagi Allah; bentuk ini jelas dan tidak membatasi maknanya pada tokoh tertentu yang secara resmi diberi gelar santo atau santa.
- source_word: τηροῦντες
  choice: menaati
  rationale: Dalam kaitannya dengan perintah Allah, partisip ini menyatakan pelaksanaan dan pemeliharaan yang setia; “menaati” menyampaikan maksud tersebut secara alami.
- source_word: ἐντολὰς
  choice: perintah-perintah
  rationale: Bentuk jamak dipertahankan dan istilah ini dengan jelas menyatakan perintah yang berasal dari Allah.
- source_word: πίστιν
  choice: iman
  rationale: “Iman” mempertahankan istilah teologis utama tanpa terlebih dahulu menentukan apakah konstruksi genitif berikutnya bersifat objektif atau subjektif.
- source_word: Ἰησοῦ
  choice: Yesus
  rationale: Rangkaian “iman Yesus” mengikuti bentuk genitif Yunani sedekat mungkin dan membiarkan ambiguitas aslinya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Makna τὴν πίστιν Ἰησοῦ
  choice: iman Yesus
  alternative: iman kepada Yesus; kesetiaan Yesus
  rationale: 'Frasa Yunani ini sungguh ambigu: dapat menunjuk pada iman yang diarahkan kepada Yesus, atau pada iman/kesetiaan yang dikaitkan dengan Yesus. Teks utama mempertahankan bentuk yang dekat dengan bahasa sumber, sedangkan kemungkinan penafsirannya dicatat tanpa memutuskan ketegangan teologis tersebut.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Yaitu mereka” memperjelas hubungan aposisional antara “orang-orang kudus” dan kelompok yang menaati perintah Allah tanpa mengubah isinya. “Berpegang pada” dipakai bersama “iman” agar ungkapannya alami, sedangkan ambiguitas genitif tetap dipertahankan pada “iman Yesus” dan dijelaskan dalam catatan kaki.
