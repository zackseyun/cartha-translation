  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ αὐτὸς πίεται ἐκ τοῦ οἴνου τοῦ θυμοῦ τοῦ θεοῦ τοῦ κεκερασμένου ἀκράτου ἐν τῷ ποτηρίῳ τῆς ὀργῆς αὐτοῦ, καὶ βασανισθήσεται ἐν πυρὶ καὶ θείῳ ἐνώπιον ⸂ἀγγέλων ἁγίων⸃ καὶ ἐνώπιον τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/010.yaml
  text: he also will drink from the wine of God's wrath[a], mixed undiluted in the cup of his anger[b], and he will be tormented with fire and sulfur before the holy angels and before the Lamb.
translation:
  language: id
  text: Ia pun akan minum dari anggur kemurkaan Allah, yang telah diramu tanpa diencerkan di dalam cawan amarah-Nya,[a] dan ia akan disiksa dengan api dan belerang[b] di hadapan para malaikat kudus dan di hadapan Anak Domba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, frasa Yunani menggabungkan gagasan anggur yang telah disiapkan atau diramu dengan anggur yang tidak diencerkan. Maksudnya menekankan hukuman dalam kekuatannya yang penuh.
    reason: lexical_alternative
  - marker: b
    text: Dalam bahasa Inggris tradisional, ungkapan ini sering diterjemahkan “fire and brimstone.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτὸς
  choice: Ia pun
  rationale: Kata ganti ini menegaskan orang yang disebut pada ayat sebelumnya, sedangkan καί memberi arti tambahan. “Ia pun” menyampaikan keduanya secara wajar dalam bahasa Indonesia.
- source_word: πίεται ἐκ τοῦ οἴνου
  choice: akan minum dari anggur
  rationale: Bentuk mendatang πίεται diterjemahkan secara langsung, dan ἐκ dipertahankan sebagai “dari” untuk menjaga gambaran minum dari persediaan anggur itu.
- source_word: τοῦ θυμοῦ τοῦ θεοῦ
  choice: kemurkaan Allah
  rationale: Dalam konteks penghakiman di Wahyu, θυμός menunjuk pada murka ilahi yang hebat. “Kemurkaan” tetap jelas, kuat, dan bermartabat.
- source_word: τοῦ κεκερασμένου ἀκράτου
  choice: yang telah diramu tanpa diencerkan
  rationale: κεκερασμένου menyatakan anggur yang telah disiapkan atau diramu, sedangkan ἀκράτου menegaskan bahwa anggur itu tidak diencerkan. Ungkapan ini mempertahankan ketegangan leksikal Yunani sekaligus dapat dipahami pembaca modern.
- source_word: ἐν τῷ ποτηρίῳ τῆς ὀργῆς αὐτοῦ
  choice: di dalam cawan amarah-Nya
  rationale: ἐν diterjemahkan menurut arti lazimnya, “di dalam”, dan ὀργή dibedakan dari θυμός dengan “amarah” agar dua istilah Yunani yang berdekatan tidak dilebur.
- source_word: βασανισθήσεται
  choice: akan disiksa
  rationale: Bentuk pasif mendatang ini menyatakan penderitaan hukuman yang berat; “akan disiksa” merupakan padanan langsung dan jelas.
- source_word: ἐν πυρὶ καὶ θείῳ
  choice: dengan api dan belerang
  rationale: θείον berarti belerang. Bentuk modern ini lebih mudah dipahami daripada istilah tradisional yang arkais, dan “dengan” sesuai untuk sarana siksaan dalam konteks ini.
- source_word: ἐνώπιον ἀγγέλων ἁγίων καὶ ἐνώπιον τοῦ ἀρνίου
  choice: di hadapan para malaikat kudus dan di hadapan Anak Domba
  rationale: Pengulangan “di hadapan” mempertahankan struktur dan penekanan teks Yunani; “para malaikat kudus” menyatakan kelompok jamak secara alami.
theological_decisions:
- issue: Pembedaan θυμός dan ὀργή dalam ayat yang sama
  choice: θυμός diterjemahkan “kemurkaan” dan ὀργή diterjemahkan “amarah”
  alternative: Menerjemahkan keduanya dengan “murka”, atau θυμός dengan “kegeraman” dan ὀργή dengan “murka”
  rationale: Dua kata Yunani yang berkaitan tetapi berbeda dipakai berdekatan. Memakai dua padanan menjaga variasi retoris sumber tanpa mengajarkan perbedaan teknis yang melampaui teks.
- issue: Ketegangan dalam τοῦ κεκερασμένου ἀκράτου
  choice: “yang telah diramu tanpa diencerkan”
  alternative: “yang dituangkan dengan kekuatan penuh” atau secara harfiah “yang dicampur tanpa campuran”
  rationale: Teks menggabungkan gagasan anggur yang telah disiapkan atau diramu dengan penegasan bahwa anggur itu tidak diencerkan. Terjemahan utama mempertahankan ketegangan tersebut dan menonjolkan penghakiman yang tidak diringankan.
- issue: Makna ἐνώπιον dalam gambaran penghakiman
  choice: “di hadapan” tanpa menjelaskan lebih lanjut sifat kehadiran atau peran para malaikat dan Anak Domba
  alternative: “dalam pengawasan” atau “disaksikan oleh”
  rationale: ἐνώπιον menyatakan lokasi relasional, yaitu di hadapan atau dalam kehadiran mereka. Teks tidak secara eksplisit menentukan peran mereka, sehingga terjemahan tidak menambah tafsiran.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan lugas. “Ia pun” mempertahankan penegasan serta hubungan dengan ayat sebelumnya. Istilah “kemurkaan” dan “amarah” sengaja dibedakan, sedangkan pengulangan “di hadapan” dipertahankan untuk mencerminkan susunan retoris sumber.
