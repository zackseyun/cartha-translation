id: REV.14.13
reference: Revelation 14:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα φωνῆς ἐκ τοῦ οὐρανοῦ λεγούσης· Γράψον· Μακάριοι οἱ νεκροὶ οἱ ἐν κυρίῳ ἀποθνῄσκοντες ἀπ’ ἄρτι. ⸂ναί, λέγει⸃ τὸ πνεῦμα, ἵνα ⸀ἀναπαήσονται ἐκ τῶν κόπων αὐτῶν, τὰ ⸀γὰρ ἔργα αὐτῶν ἀκολουθεῖ μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/013.yaml
  text: 'And I heard a voice from heaven saying[a], “Write: Blessed are the dead who die in the Lord from now on.” “Yes,” says the Spirit, “so that they may rest from their labors[b], for their deeds follow with them.”'
translation:
  language: id
  text: 'Lalu aku mendengar suatu suara dari surga yang berkata, “Tuliskanlah: Berbahagialah orang-orang yang mati dalam Tuhan mulai sekarang.” “Ya,” kata Roh, “supaya mereka beristirahat[a] dari jerih lelah mereka, sebab perbuatan mereka menyertai mereka[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sehingga mereka akan beristirahat.” Klausa Yunani ini dapat dipahami bernuansa tujuan atau hasil.'
    reason: alternative_reading
  - marker: b
    text: 'Atau: “sebab perbuatan mereka mengikuti mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνῆς ἐκ τοῦ οὐρανοῦ λεγούσης
  choice: suatu suara dari surga berkata
  rationale: Menerjemahkan φωνή secara alami sebagai ‘suara’, ἐκ τοῦ οὐρανοῦ sebagai asal suara, dan partisip λεγούσης sebagai pengantar ujaran langsung.
- source_word: Γράψον
  choice: Tuliskanlah
  rationale: Imperatif aoris tunggal ini merupakan perintah langsung. Bentuk ‘tuliskanlah’ terdengar wajar dan khidmat tanpa menambahkan objek yang tidak terdapat dalam teks Yunani.
- source_word: Μακάριοι
  choice: Berbahagialah
  rationale: Ungkapan baku untuk makarios dalam ucapan bahagia; menyatakan keadaan yang diperkenan dan diberkati tanpa membatasinya pada perasaan senang.
- source_word: οἱ νεκροὶ οἱ ἐν κυρίῳ ἀποθνῄσκοντες
  choice: orang-orang yang mati dalam Tuhan
  rationale: Susunan Yunani harfiah ‘orang-orang mati yang mati’ tidak wajar dalam bahasa Indonesia. Klausa substantival ini diterjemahkan secara alami sambil mempertahankan kematian mereka dan frasa teologis ‘dalam Tuhan’.
- source_word: ἀπ’ ἄρτι
  choice: mulai sekarang
  rationale: Ungkapan waktu ini menunjukkan titik awal berlakunya pernyataan dan diterjemahkan dengan ungkapan Indonesia yang jelas.
- source_word: ναί, λέγει τὸ πνεῦμα
  choice: “Ya,” kata Roh
  rationale: ναί dipertahankan sebagai penegasan tersendiri, sedangkan τὸ πνεῦμα diterjemahkan ‘Roh’ sebagai subjek yang berbicara.
- source_word: ἵνα ἀναπαήσονται
  choice: supaya mereka beristirahat
  rationale: ‘Supaya’ mempertahankan nuansa tujuan/hasil dari ἵνα. Bentuk Indonesia tidak memaksakan pembedaan modal yang tidak dapat diungkapkan secara langsung dan alami.
- source_word: ἐκ τῶν κόπων αὐτῶν
  choice: dari segala jerih lelah mereka
  rationale: κόπος menunjuk pada kerja keras, susah payah, atau kepenatan yang ditimbulkannya. ‘Segala jerih lelah’ alami dalam bahasa Indonesia dan mempertahankan cakupan bentuk jamak.
- source_word: τὰ γὰρ ἔργα αὐτῶν
  choice: sebab perbuatan mereka
  rationale: ἔργα di sini diterjemahkan ‘perbuatan’, istilah Indonesia yang alami dan cukup luas untuk tindakan atau karya tanpa memasukkan penilaian tentang jasa.
- source_word: ἀκολουθεῖ μετ’ αὐτῶν
  choice: menyertai mereka
  rationale: ‘Menyertai’ menyampaikan bahwa perbuatan itu mengikuti serta berada bersama mereka, sehingga unsur μετά tidak hilang dalam ungkapan Indonesia yang kaku.
theological_decisions:
- issue: Makna ‘dalam Tuhan’ bagi mereka yang mati
  choice: Mempertahankan ungkapan ‘mati dalam Tuhan’ tanpa uraian tambahan.
  alternative: mati dengan setia kepada Tuhan; mati sebagai milik Tuhan
  rationale: ἐν κυρίῳ dapat mencakup persatuan, kepemilikan, dan hubungan setia dengan Tuhan. Terjemahan tidak mempersempit keluasan teologis itu.
- issue: Daya ἵνα ἀναπαήσονται
  choice: supaya mereka beristirahat
  alternative: sehingga mereka akan beristirahat
  rationale: Konstruksi ini dapat bernuansa tujuan atau hasil. Teks utama memakai bentuk tujuan yang alami, sedangkan catatan kaki mempertahankan kemungkinan hasil dan daya bentuk verba masa depan.
- issue: Hubungan perbuatan dengan orang-orang yang mati
  choice: perbuatan mereka menyertai mereka
  alternative: perbuatan mereka mengikuti mereka
  rationale: Ayat menyatakan bahwa perbuatan mereka menyertai mereka, tetapi tidak menjelaskan apakah hal itu merupakan jasa, kesaksian, atau mekanisme lainnya. Terjemahan tidak menambahkan kesimpulan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. ‘Tuliskanlah’, ‘Berbahagialah’, dan ‘Roh’ mempertahankan corak pewahyuan, sedangkan susunan kalimat diusahakan tetap mudah dipahami pembaca umum. Semua penanda catatan kaki ditempatkan pada bagian teks yang diterangkannya.
