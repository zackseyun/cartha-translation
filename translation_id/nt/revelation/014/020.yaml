  text: καὶ ἐπατήθη ἡ ληνὸς ἔξωθεν τῆς πόλεως, καὶ ἐξῆλθεν αἷμα ἐκ τῆς ληνοῦ ἄχρι τῶν χαλινῶν τῶν ἵππων ἀπὸ σταδίων χιλίων ἑξακοσίων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/020.yaml
  text: And the winepress was trodden outside the city[b][a], and blood came out from the winepress up to the horses’ bridles for one thousand six hundred stadia.
translation:
  language: id
  text: Tempat pemerasan anggur itu diinjak-injak di luar kota, dan darah keluar dari tempat pemerasan itu[b] sampai setinggi kekang kuda, sejauh seribu enam ratus stadia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Satu stadion adalah satuan jarak kuno; 1.600 stadia kira-kira 296 kilometer.
    reason: cultural_note
  - marker: b
    text: Atau, “darah mengalir keluar dari tempat pemerasan itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπατήθη
  choice: diinjak-injak
  rationale: Bentuk pasif dari πατέω menyatakan tindakan menginjak atau mengirik dengan kaki. Pilihan ini mempertahankan gambaran konkret proses pemerasan anggur dan terdengar alami dalam bahasa Indonesia.
- source_word: ληνός / ληνοῦ
  choice: tempat pemerasan anggur
  rationale: Istilah ini menunjuk tempat atau bak untuk memeras anggur. Ungkapan tersebut jelas bagi pembaca modern dan mempertahankan citra panen serta penghakiman.
- source_word: ἔξωθεν τῆς πόλεως
  choice: di luar kota
  rationale: Padanan ruang yang langsung, alami, dan dekat dengan susunan sumber.
- source_word: ἐξῆλθεν αἷμα
  choice: darah keluar
  rationale: Menerjemahkan ἐξέρχομαι secara langsung sebagai 'keluar' tanpa menambahkan gagasan mengalir, meskipun gagasan itu masuk akal dalam konteks.
- source_word: ἄχρι τῶν χαλινῶν τῶν ἵππων
  choice: sampai setinggi kekang kuda
  rationale: ἄχρι menyatakan batas atau jangkauan. 'Sampai setinggi' menyampaikan gambaran vertikal yang dimaksud secara wajar dalam bahasa Indonesia.
- source_word: ἀπὸ σταδίων χιλίων ἑξακοσίων
  choice: sepanjang seribu enam ratus stadia
  rationale: Dalam konteks ini ἀπό bersama ukuran jarak menyatakan bentangan atau jarak. 'Sepanjang' alami dalam bahasa Indonesia, sedangkan satuan asli dipertahankan dan dijelaskan dalam catatan.
theological_decisions:
- issue: Apakah gambaran apokaliptik yang hiperbolis perlu diperhalus atau dijelaskan di dalam teks
  choice: Mempertahankan gambaran konkret tentang darah, kekang kuda, dan jarak seribu enam ratus stadia
  alternative: Memparafrasakannya sebagai gambaran simbolis tentang penghakiman yang dahsyat
  rationale: Teks sumber sengaja memakai citra penghakiman yang grafis. Terjemahan tidak menentukan kadar literal atau simbolisnya, melainkan membiarkan ketegangan apokaliptik itu tetap terbuka.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. 'Tempat pemerasan anggur' dipilih agar langsung dipahami tanpa kehilangan citra sumber. Penanda catatan ditempatkan setelah keseluruhan klausa yang diterangkannya.
