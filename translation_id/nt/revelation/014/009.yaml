id: REV.14.9
reference: Revelation 14:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ἄγγελος τρίτος ἠκολούθησεν αὐτοῖς λέγων ἐν φωνῇ μεγάλῃ· Εἴ τις προσκυνεῖ τὸ θηρίον καὶ τὴν εἰκόνα αὐτοῦ, καὶ λαμβάνει χάραγμα ἐπὶ τοῦ μετώπου αὐτοῦ ἢ ἐπὶ τὴν χεῖρα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/009.yaml
  text: And another angel[a], a third, followed them, saying with a loud voice, “If anyone worships the beast and its image[b], and receives a mark on his forehead or on his hand,”
translation:
  language: id
  text: Dan seorang malaikat lain, yaitu malaikat yang ketiga, mengikuti mereka dan berkata dengan suara nyaring, “Jika seseorang menyembah[a] binatang buas itu dan patungnya, serta menerima suatu tanda pada dahinya atau pada tangannya,[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sujud kepada.” Kata kerja Yunani ini dapat menunjuk pada tindakan bersujud, tetapi di sini mengandung makna kesetiaan yang bersifat penyembahan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “pada dahinya atau pada tangannya.” Dalam bahasa Yunani, kata ganti tunggal maskulin dipakai secara umum untuk merujuk kepada “seseorang”; akhiran -nya dalam bahasa Indonesia tidak membedakan gender.
    reason: cultural_note
lexical_decisions:
- source_word: ἄλλος ἄγγελος τρίτος
  choice: seorang malaikat lain, yaitu malaikat yang ketiga
  rationale: Ungkapan ini mempertahankan baik ἄλλος (‘lain’) maupun τρίτος (‘ketiga’) serta memperjelas hubungan aposisionalnya secara alami dalam bahasa Indonesia.
- source_word: ἠκολούθησεν αὐτοῖς
  choice: mengikuti mereka
  rationale: Terjemahan langsung yang tetap membiarkan rujukan jamak αὐτοῖς ditentukan oleh konteks penglihatan.
- source_word: λέγων ἐν φωνῇ μεγάλῃ
  choice: berkata dengan suara nyaring
  rationale: Ungkapan Indonesia yang alami untuk seruan keras dan terbuka, tanpa menambahkan unsur yang tidak dinyatakan dalam teks.
- source_word: Εἴ τις
  choice: Jika seseorang
  rationale: Menyampaikan syarat yang berlaku umum dengan bentuk tunggal yang wajar dalam bahasa Indonesia.
- source_word: προσκυνεῖ
  choice: menyembah
  rationale: Dalam konteks Wahyu, kata ini menyatakan penghormatan religius dan kesetiaan kepada binatang buas, bukan semata-mata gerak tubuh bersujud.
- source_word: τὸ θηρίον
  choice: binatang buas itu
  rationale: ‘Binatang buas’ membedakan θηρίον dari istilah umum untuk makhluk hidup dan mempertahankan sifat figur apokaliptis tersebut; ‘itu’ mencerminkan artikel tertentu.
- source_word: τὴν εἰκόνα αὐτοῦ
  choice: patungnya
  rationale: Dalam konteks penyembahan, ‘patung’ menyampaikan representasi kultis dari binatang buas secara lebih alami daripada ‘gambar’, tanpa menentukan bahan atau bentuknya.
- source_word: λαμβάνει χάραγμα
  choice: menerima suatu tanda
  rationale: λαμβάνει menunjukkan penerimaan, sedangkan χάραγμα menunjuk tanda atau cap pengenal; ‘suatu’ mencerminkan bentuk tanpa artikel.
- source_word: ἐπὶ τοῦ μετώπου αὐτοῦ ἢ ἐπὶ τὴν χεῖρα αὐτοῦ
  choice: pada dahinya atau pada tangannya
  rationale: Mempertahankan bentuk tunggal dan lokasi pada dahi atau tangan. Akhiran -nya bersifat netral gender dalam bahasa Indonesia dan secara alami merujuk kepada ‘seseorang’.
theological_decisions:
- issue: Daya religius προσκυνέω terhadap binatang buas
  choice: menyembah
  alternative: sujud kepada
  rationale: Konteksnya adalah pengabdian dan kesetiaan yang bersifat penyembahan berhala. ‘Menyembah’ menyatakan bobot teologis itu, sementara catatan kaki mempertahankan kemungkinan nuansa tindakan bersujud.
- issue: Kata ganti tunggal maskulin yang merujuk kepada τις
  choice: pada dahinya atau pada tangannya
  alternative: pada dahi atau tangannya
  rationale: Bentuk tunggal sumber dipertahankan. Bahasa Indonesia tidak menandai gender pada akhiran -nya, sehingga makna umum dapat disampaikan tanpa mengubahnya menjadi bentuk jamak atau memasukkan gender yang tidak dapat diungkapkan secara alami.
- issue: Makna εἰκών dalam konteks kultis
  choice: patungnya
  alternative: gambarnya
  rationale: ‘Patung’ paling alami untuk objek representatif yang disembah dalam konteks ini, tetapi terjemahan tidak menambahkan klaim mengenai bahan, ukuran, atau bentuk objek tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Struktur ayat dibiarkan terbuka sebagai anak kalimat bersyarat karena kalimatnya berlanjut ke ayat 10. Pengulangan ‘pada’ dipertahankan untuk mencerminkan kedua frasa lokasi dalam teks Yunani.
