id: REV.14.14
reference: Revelation 14:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἰδοὺ νεφέλη λευκή, καὶ ἐπὶ τὴν νεφέλην καθήμενον ὅμοιον ⸀υἱὸν ἀνθρώπου, ἔχων ἐπὶ τῆς κεφαλῆς αὐτοῦ στέφανον χρυσοῦν καὶ ἐν τῇ χειρὶ αὐτοῦ δρέπανον ὀξύ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/014.yaml
  text: And I looked[a], and behold, a white cloud, and seated on the cloud was one like a son of man[b], having on his head a golden crown and in his hand a sharp sickle.
translation:
  language: id
  text: Lalu aku melihat, dan tampaklah suatu awan putih. Di atas awan itu duduk seorang yang seperti anak manusia[a]. Di kepalanya ada mahkota emas[b], dan di tangannya ada sabit tajam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seorang yang seperti Anak Manusia.” Ungkapan ini menggemakan Daniel 7:13 dan lazim dipahami sebagai gelar mesianis, meskipun bahasa Yunani di sini secara harfiah berbunyi “seperti anak manusia” tanpa kata sandang.
    reason: alternative_reading
  - marker: b
    text: Kata Yunani yang diterjemahkan “mahkota” di sini ialah stephanos, yang sering menunjuk pada mahkota atau karangan kemenangan, bukan mahkota kerajaan (diadem).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: tampaklah
  rationale: Mempertahankan daya penunjuk yang hidup dalam kisah penglihatan Yohanes dan secara alami mengarahkan perhatian pembaca kepada pemandangan yang tiba-tiba muncul.
- source_word: νεφέλη λευκή
  choice: suatu awan putih
  rationale: Menerjemahkan nilai leksikal frasa itu secara langsung tanpa memperluas λευκή menjadi 'bercahaya'.
- source_word: ἐπὶ τὴν νεφέλην καθήμενον
  choice: Di atas awan itu duduk
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran tokoh yang berada dalam posisi duduk di atas awan.
- source_word: ὅμοιον υἱὸν ἀνθρώπου
  choice: seorang yang seperti anak manusia
  rationale: Mempertahankan unsur perbandingan ὅμοιον serta bentuk Yunani tanpa kata sandang pada υἱὸν ἀνθρώπου, sambil tetap membiarkan gema Daniel 7:13 terdengar.
- source_word: στέφανον χρυσοῦν
  choice: mahkota emas
  rationale: Merupakan padanan yang jelas dan alami; nuansa στέφανος sebagai mahkota atau karangan kemenangan dijelaskan dalam catatan kaki.
- source_word: δρέπανον ὀξύ
  choice: sabit tajam
  rationale: Padanan baku dan mudah dipahami untuk alat menuai dalam gambaran panen pada konteks langsung ayat ini.
theological_decisions:
- issue: Apakah υἱὸν ἀνθρώπου harus diterjemahkan sebagai gelar kristologis yang eksplisit
  choice: seorang yang seperti anak manusia
  alternative: seorang yang seperti Anak Manusia
  rationale: Bahasa Yunani di sini tidak memakai kata sandang sebelum υἱὸν ἀνθρώπου, sehingga teks utama tidak mempertegasnya menjadi gelar tertentu. Namun, gema Daniel 7:13 dan pemahaman mesianis yang umum dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat dan hidup. Susunan kalimat dipecah secara wajar agar mudah dibaca tanpa menghilangkan urutan penglihatan dalam teks Yunani.
