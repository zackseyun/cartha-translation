id: REV.14.8
reference: Revelation 14:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ⸂δεύτερος ἄγγελος⸃ ἠκολούθησεν λέγων· Ἔπεσεν, ⸀ἔπεσεν Βαβυλὼν ἡ μεγάλη, ⸀ἣ ἐκ τοῦ οἴνου τοῦ θυμοῦ τῆς πορνείας αὐτῆς πεπότικεν πάντα τὰ ἔθνη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/008.yaml
  text: And another[a], a second angel, followed, saying, “Fallen, fallen is Babylon the great[c][b], she who has made all the nations drink from the wine of the passion of her sexual immorality.”
translation:
  language: id
  text: Lalu menyusul seorang malaikat lain, yaitu malaikat kedua, yang berkata, “Sudah jatuh, sudah jatuh Babel yang besar itu! Dialah yang telah membuat semua bangsa minum dari anggur hawa nafsu percabulannya.[a]”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “anggur murka percabulannya.” Kata Yunani θυμός dapat berarti murka, amarah yang membara, atau gairah yang sangat kuat.
    reason: lexical_alternative
  - marker: b
    text: “Percabulan” Babel kemungkinan merupakan gambaran tentang pengaruhnya yang merusak, penyembahan berhala, dan ketidaksetiaan. Namun, ayat ini tidak membatasi gambaran tersebut hanya pada salah satu makna itu.
    reason: cultural_note
lexical_decisions:
- source_word: ἄλλος … δεύτερος ἄγγελος
  choice: seorang malaikat lain, yaitu malaikat kedua
  rationale: Mempertahankan baik ἄλλος (‘lain’) maupun δεύτερος (‘kedua’), sambil memakai konstruksi penjelas yang alami dalam bahasa Indonesia.
- source_word: ἠκολούθησεν
  choice: menyusul
  rationale: Dalam rangkaian penglihatan ini kata tersebut menunjukkan urutan kemunculan; ‘menyusul’ lebih alami daripada ‘mengikuti’ tanpa objek.
- source_word: λέγων
  choice: yang berkata
  rationale: Mengungkapkan hubungan partisipial dengan malaikat yang menyusul secara jelas dan wajar dalam bahasa Indonesia.
- source_word: Ἔπεσεν, ἔπεσεν
  choice: Sudah jatuh, sudah jatuh
  rationale: Menghadirkan aoristus sebagai proklamasi profetis tentang kejatuhan yang dipastikan, sekaligus mempertahankan pengulangan dan daya retorisnya.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: Babel yang besar itu
  rationale: ‘Babel’ adalah bentuk nama yang mapan dalam Alkitab bahasa Indonesia; frasa ‘yang besar itu’ mempertahankan sifat seperti gelar dan penunjukan tertentu dari teks Yunani.
- source_word: ἣ
  choice: Dialah yang
  rationale: Mempertahankan personifikasi Babel dan menghubungkan klausa relatif dengan jelas, tanpa memakai pronomina gender yang tidak alami bagi nama kota dalam bahasa Indonesia.
- source_word: ἐκ τοῦ οἴνου
  choice: dari anggur
  rationale: Mempertahankan nuansa ἐκ sebagai sumber dari mana bangsa-bangsa dibuat minum.
- source_word: τοῦ θυμοῦ
  choice: hawa nafsu
  rationale: Dalam kaitannya dengan πορνεία, θυμός dapat menyatakan dorongan atau gairah yang menyala-nyala. ‘Hawa nafsu’ mempertahankan intensitas dalam konteks ini, sementara kemungkinan ‘murka’ dicatat dalam catatan kaki.
- source_word: τῆς πορνείας αὐτῆς
  choice: percabulannya
  rationale: ‘Percabulan’ merupakan istilah Indonesia yang ringkas dan bermartabat serta cukup luas untuk citra seksual literal maupun metaforis, tanpa langsung menafsirkannya sebagai penyembahan berhala atau ketidaksetiaan politik.
- source_word: πεπότικεν
  choice: telah membuat … minum
  rationale: 'Mempertahankan bentuk kausatif dan aspek perfektum: tindakan telah terjadi dengan akibat yang berlanjut.'
- source_word: πάντα τὰ ἔθνη
  choice: semua bangsa
  rationale: Mengacu luas pada bangsa-bangsa, bukan secara khusus orang bukan Yahudi.
theological_decisions:
- issue: Daya metaforis πορνεία Babel
  choice: Percabulan dalam teks utama
  alternative: Penyembahan berhala, pelacuran, atau ketidaksetiaan
  rationale: Citra seksual dipertahankan agar pembaca dapat menangkap pengaruh Babel yang merusak tanpa terjemahan menetapkannya hanya sebagai satu rujukan teologis atau politis.
- issue: Makna θυμός dalam frasa anggur θυμός percabulannya
  choice: Hawa nafsu
  alternative: Murka atau amarah yang membara
  rationale: Hubungan gramatikal dengan percabulan Babel mendukung makna gairah yang menyala-nyala, tetapi kata Yunani tetap dapat memuat nuansa murka atau keganasan; alternatif tersebut dipertahankan dalam catatan kaki.
- issue: Personifikasi Babel
  choice: Dialah yang
  alternative: yang
  rationale: Pilihan ini menjaga Babel sebagai pelaku yang dipersonifikasikan, tetapi tidak memaksakan pronomina feminin yang kurang alami dalam bahasa Indonesia.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Susunan ‘malaikat lain, yaitu malaikat kedua’ sengaja mempertahankan kedua unsur Yunani. ‘Sudah jatuh’ dipilih sebagai seruan profetis yang alami. Catatan kaki ditempatkan setelah kalimat kutipan: [a] menjelaskan gabungan frasa yang ambigu, dan [b] menjelaskan daya metaforis percabulan.'
