id: REV.14.15
reference: Revelation 14:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἄλλος ἄγγελος ἐξῆλθεν ἐκ τοῦ ναοῦ κράζων ἐν φωνῇ μεγάλῃ τῷ καθημένῳ ἐπὶ τῆς νεφέλης· Πέμψον τὸ δρέπανόν σου καὶ θέρισον, ὅτι ἦλθεν ἡ ὥρα θερίσαι, ὅτι ἐξηράνθη ὁ θερισμὸς τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/015.yaml
  text: And another angel came out from the sanctuary, crying out with a loud voice to the one seated on the cloud, “Send your sickle and reap, because the hour to reap has come, because the harvest of the earth is ripe.”
translation:
  language: id
  text: Lalu seorang malaikat lain keluar dari tempat kudus dan berseru dengan suara nyaring kepada Dia yang duduk di atas awan itu, “Ayunkanlah sabit-Mu dan tuailah, karena sudah tiba waktunya untuk menuai, karena tuaian bumi sudah mengering[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: sudah masak atau siap dituai. Secara harfiah, “telah mengering.”'
    reason: Menjaga makna dasar ἐξηράνθη sambil menjelaskan bahwa dalam gambaran panen, keadaan mengering dapat menunjukkan kesiapan untuk dituai.
lexical_decisions:
- source_word: ναός
  choice: tempat kudus
  rationale: Dalam konteks Wahyu, kata ini menunjuk pada ruang kudus atau tempat suci, bukan keseluruhan kompleks Bait Allah; pilihan ini mempertahankan pembedaan leksikal tersebut.
- source_word: Πέμψον τὸ δρέπανόν σου
  choice: Ayunkanlah sabit-Mu
  rationale: Secara harfiah berarti ‘kirimkan/ulurkan sabit-Mu’; dalam bahasa Indonesia, ‘ayunkanlah’ menyampaikan tindakan mulai menyabit secara alami tanpa mengubah gambaran panen.
- source_word: θέρισον
  choice: tuailah
  rationale: Bentuk imperatif aoristus diterjemahkan sebagai perintah langsung untuk melakukan penuaian.
- source_word: ἐξηράνθη
  choice: sudah masak
  rationale: Secara dasar berarti ‘telah menjadi kering’; mengenai tanaman siap dituai, ungkapan idiomatisnya ialah ‘sudah masak’. Ini mempertahankan makna kesiapan panen tanpa memasukkan gagasan ‘terlalu masak’ yang tidak wajib dari bentuk Yunani.
- source_word: ὁ θερισμὸς τῆς γῆς
  choice: tuaian di bumi
  rationale: Genitif dapat dipahami sebagai tuaian yang berasal dari atau berada di bumi; ‘di bumi’ terdengar alami dan tidak mempersempit rujukannya.
theological_decisions:
- issue: Identitas tokoh yang duduk di atas awan
  choice: Dia yang duduk di atas awan itu
  alternative: orang yang duduk di atas awan itu
  rationale: Huruf kapital mengikuti rujukan kontekstual kepada sosok seperti Anak Manusia dalam ayat 14, tetapi tidak menambahkan gelar yang tidak diulang dalam ayat ini.
- issue: Makna kematangan tuaian sebagai penghakiman
  choice: tuaian di bumi sudah masak
  alternative: tuaian di bumi sudah terlalu masak
  rationale: Terjemahan tidak menentukan lebih jauh apakah kekeringan tanaman menandakan kematangan biasa atau keadaan yang sudah sangat lanjut; konteks penghakiman tetap hadir melalui metafora penuaian.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Struktur pengulangan dua klausa ὅτι dibuat alami dengan ‘karena ... sebab ...’. Sapaan kepada tokoh ilahi ditulis dengan kapital penghormatan secara konsisten.
