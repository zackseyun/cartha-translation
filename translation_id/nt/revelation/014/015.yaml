  to: Lalu seorang malaikat lain keluar dari tempat kudus dan berseru dengan suara nyaring kepada Dia yang duduk di atas awan itu, “Ayunkanlah sabit-Mu dan tuailah, karena sudah tiba waktunya untuk menuai, karena tuaian bumi sudah mengering[a].”
