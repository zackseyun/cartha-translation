  text: καὶ ἔβαλεν ὁ καθήμενος ἐπὶ ⸂τῆς νεφέλης⸃ τὸ δρέπανον αὐτοῦ ἐπὶ τὴν γῆν, καὶ ἐθερίσθη ἡ γῆ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/016.yaml
  text: And the one seated on the cloud cast his sickle upon the earth[c][b][a], and the earth was harvested.
translation:
  language: id
  text: Lalu ia yang duduk di atas awan itu[c] mengayunkan sabitnya ke bumi,[a] dan bumi pun dituai.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “melemparkan sabitnya ke bumi.” Kata kerja Yunani secara harfiah berarti “melemparkan”, tetapi dalam konteks panen ungkapan ini menunjuk pada tindakan menggunakan sabit untuk menuai.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “bumi pun dipanen.”'
    reason: lexical_alternative
  - marker: c
    text: Berdasarkan konteks sebelumnya, sosok yang duduk di atas awan itu sering dipahami sebagai Anak Manusia. Namun, ayat ini sendiri hanya menyebutnya “ia yang duduk di atas awan itu”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔβαλεν
  choice: mengayunkan
  rationale: Secara leksikal berarti ‘melemparkan/mengarahkan’, tetapi bersama ‘sabit’ dalam konteks panen, kata ini menggambarkan tindakan mulai menyabit. ‘Mengayunkan’ menyampaikan tindakan itu secara alami sambil mempertahankan gambaran konkretnya.
- source_word: ὁ καθήμενος ἐπὶ τῆς νεφέλης
  choice: ia yang duduk di atas awan itu
  rationale: Partisipel substantival diterjemahkan secara deskriptif tanpa menetapkan identitas sosok tersebut melebihi bunyi ayat ini. ‘Awan itu’ mempertahankan bentuk definit dan kaitannya dengan awan yang disebut sebelumnya.
- source_word: δρέπανον αὐτοῦ
  choice: sabitnya
  rationale: ‘Sabit’ adalah padanan Indonesia yang baku dan jelas bagi alat menuai ini. Akhiran posesif mempertahankan αὐτοῦ tanpa memakai kapitalisasi yang akan lebih dahulu menentukan identitas sosok tersebut.
- source_word: ἐπὶ τὴν γῆν
  choice: ke bumi
  rationale: Dengan akusatif, frasa ini menyatakan arah gerakan sabit menuju bumi. ‘Ke bumi’ alami dalam bahasa Indonesia dan tidak menambahkan gagasan bahwa sabit hanya berada di atas bumi.
- source_word: ἐθερίσθη
  choice: dituai
  rationale: Bentuk pasif aoristus dipertahankan. ‘Dituai’ merupakan padanan langsung dan alami dalam gambaran panen.
- source_word: ἡ γῆ
  choice: bumi
  rationale: Dalam konteks apokaliptis-kosmis Wahyu, ‘bumi’ lebih tepat daripada ‘negeri’ atau ‘tanah’. Pengulangan kata ini tetap dipertahankan.
theological_decisions:
- issue: Identitas sosok yang duduk di atas awan
  choice: Menyebutnya secara deskriptif sebagai ‘ia yang duduk di atas awan itu’.
  alternative: Menyebut sosok itu secara eksplisit sebagai Anak Manusia/Mesias atau sebagai malaikat.
  rationale: Ayat ini sendiri hanya memakai ungkapan deskriptif. Terjemahan tidak menambahkan identifikasi teologis yang berasal dari penafsiran konteks.
- issue: Kapitalisasi kata ganti dan bentuk posesif
  choice: Memakai ‘ia’ dan ‘sabitnya’ tanpa kapitalisasi khusus.
  alternative: Memakai ‘Ia’ dan ‘sabit-Nya’ untuk menandai sosok ilahi.
  rationale: Teks Yunani tidak menyelesaikan identitas sosok itu melalui bentuk kata ganti. Kapitalisasi khusus dalam bahasa Indonesia dapat menutup ambiguitas tersebut secara tidak semestinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan dua tindakan berurutan serta pengulangan ‘bumi’. Partikel ‘pun’ menandai hasil yang langsung terjadi tanpa menambahkan pelaku pada bentuk pasif.
