id: REV.14.1
reference: Revelation 14:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἰδοὺ τὸ ἀρνίον ⸀ἑστὸς ἐπὶ τὸ ὄρος Σιών, καὶ μετ’ ⸀αὐτοῦ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες ἔχουσαι τὸ ὄνομα αὐτοῦ καὶ τὸ ὄνομα τοῦ πατρὸς αὐτοῦ γεγραμμένον ἐπὶ τῶν μετώπων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/001.yaml
  text: Then I looked[a], and behold, the Lamb was standing on Mount Zion, and with him were one hundred forty-four thousand who had his name and his Father's name written on their foreheads.
translation:
  language: id
  text: Lalu aku melihat, dan tampaklah Anak Domba berdiri di Gunung Sion. Bersama-Nya ada seratus empat puluh empat ribu orang yang nama-Nya dan nama Bapa-Nya tertulis pada dahi mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah hanya berbunyi, “nama Bapa-Nya tertulis pada dahi mereka.”
    reason: textual_variant
lexical_decisions:
- source_word: Καὶ εἶδον
  choice: Lalu aku melihat
  rationale: Καί bersama εἶδον melanjutkan urutan penglihatan. 'Lalu aku melihat' alami dalam narasi bahasa Indonesia dan tetap mempertahankan sudut pandang Yohanes.
- source_word: ἰδοὺ
  choice: tampaklah
  rationale: Menandai sesuatu yang mendadak hadir bagi perhatian dalam penglihatan. 'Tampaklah' mempertahankan daya penunjuk dan gaya luhur apokaliptik tanpa terdengar sekaku 'lihatlah' setelah 'aku melihat'.
- source_word: τὸ ἀρνίον
  choice: Anak Domba
  rationale: Padanan baku dan bermartabat bagi gelar kristologis ἀρνίον dalam Wahyu; kapitalisasi menandai penggunaannya sebagai gelar tanpa menambahkan tafsiran.
- source_word: ἑστὸς
  choice: berdiri
  rationale: Partisipel perfek menyatakan keadaan berdiri sebagai hasil yang berlangsung. Dalam konstruksi Indonesia, 'tampaklah ... berdiri' menyampaikan keadaan itu secara alami.
- source_word: ἐπὶ τὸ ὄρος Σιών
  choice: di Gunung Sion
  rationale: '''Di'' merupakan preposisi lokasi yang paling alami dalam bahasa Indonesia untuk keberadaan di sebuah gunung; nama Σιών ditransliterasikan sebagai ''Sion''.'
- source_word: μετ’ αὐτοῦ
  choice: Bersama-Nya ada
  rationale: Mengungkapkan predikat yang tersirat sebelum frasa bilangan dan menghasilkan susunan Indonesia yang jelas.
- source_word: ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: seratus empat puluh empat ribu orang
  rationale: Mempertahankan jumlah tepat. 'Orang' ditambahkan secara wajar karena konteks menunjuk kepada sekelompok pribadi dan klausa berikut menyebut dahi mereka.
- source_word: ἔχουσαι
  choice: yang pada dahi mereka tertulis
  rationale: Secara harfiah berarti 'yang mempunyai', tetapi isi yang dipunyai dijelaskan sebagai nama yang tertulis pada dahi. Restrukturisasi ini alami dalam bahasa Indonesia dan tetap menjaga hubungan partisipel dengan kelompok 144.000.
- source_word: τὸ ὄνομα αὐτοῦ καὶ τὸ ὄνομα τοῦ πατρὸς αὐτοῦ
  choice: nama-Nya dan nama Bapa-Nya
  rationale: Mempertahankan dua objek yang dikoordinasikan serta membedakan nama Anak Domba dari nama Bapa-Nya. Bentuk hormat '-Nya' sesuai dengan rujukan ilahi.
- source_word: γεγραμμένον ἐπὶ τῶν μετώπων αὐτῶν
  choice: pada dahi mereka tertulis
  rationale: Partisipel perfek pasif menyatakan nama-nama yang telah dituliskan dan tetap berada di sana. Susunan ini idiomatis serta mempertahankan citra lokasi yang penting dalam Wahyu.
theological_decisions:
- issue: Identitas τὸ ἀρνίον
  choice: Diterjemahkan sebagai gelar kristologis 'Anak Domba' tanpa perluasan.
  alternative: '''Anak Domba kurban'''
  rationale: Konteks Wahyu mengidentifikasikan gelar ini dengan Kristus, tetapi ayat ini tidak secara eksplisit menambahkan keterangan 'kurban'; terjemahan tidak memasukkan penafsiran tambahan.
- issue: Hubungan antara kedua nama
  choice: Diterjemahkan 'nama-Nya dan nama Bapa-Nya' sebagai dua unsur yang dikoordinasikan.
  alternative: '''nama-Nya, yaitu nama Bapa-Nya'''
  rationale: Bahasa Yunani memakai καί untuk menghubungkan dua objek dan tidak menyatakan bahwa keduanya beraposisi. Terjemahan mempertahankan pembedaan sekaligus keterkaitan erat tanpa menyelesaikan ketegangan teologis secara berlebihan.
- issue: Varian teks mengenai tulisan pada dahi
  choice: Teks utama mengikuti SBLGNT yang memuat nama Anak Domba dan nama Bapa-Nya.
  alternative: Hanya 'nama Bapa-Nya'
  rationale: Sejumlah naskah tidak memuat τὸ ὄνομα αὐτοῦ καὶ ('nama-Nya dan'), sehingga varian yang berdampak nyata pada isi tulisan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif-apokaliptik yang luhur tetapi mudah dipahami. 'Tampaklah' mempertahankan penanda perhatian ἰδού, sedangkan susunan kalimat dipecah menjadi dua agar jelas dan alami. Semua penanda catatan kaki dalam teks cocok dengan catatan yang tersedia.
