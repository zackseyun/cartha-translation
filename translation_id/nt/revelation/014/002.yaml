id: REV.14.2
reference: Revelation 14:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἤκουσα φωνὴν ἐκ τοῦ οὐρανοῦ ὡς φωνὴν ὑδάτων πολλῶν καὶ ὡς φωνὴν βροντῆς μεγάλης, καὶ ἡ φωνὴ ἣν ἤκουσα ὡς κιθαρῳδῶν κιθαριζόντων ἐν ταῖς κιθάραις αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/002.yaml
  text: And I heard a sound from heaven like the sound of many waters and like the sound of loud thunder[c][b][a], and the sound that I heard was like harpists playing on their harps.
translation:
  language: id
  text: Lalu aku mendengar suara[a] dari surga, seperti gemuruh air yang banyak[b] dan seperti guruh yang dahsyat. Suara yang kudengar itu seperti bunyi para pemain kecapi yang memainkan kecapi[c] mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “suara” juga dapat berarti “bunyi”; konteks tidak secara tegas menyebut adanya ucapan.
    reason: lexical_alternative
  - marker: b
    text: “Air yang banyak” merupakan gambaran Alkitab tentang gemuruh yang luas dan menggentarkan; bandingkan Yehezkiel 43:2.
    reason: cross_reference
  - marker: c
    text: Kata Yunani κιθάρα menunjuk pada alat musik petik kuno yang lebih menyerupai lira daripada harpa modern; di sini diterjemahkan “kecapi” mengikuti istilah yang sudah dikenal.
    reason: cultural_note
lexical_decisions:
- source_word: φωνή
  choice: suara
  rationale: Kata Indonesia “suara” dapat menunjuk baik pada suara makhluk maupun bunyi secara umum. Karena itu, pilihan ini alami dalam konteks air, guruh, dan musik sekaligus mempertahankan keluasan makna kata Yunani.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: dari surga
  rationale: Dalam konteks Wahyu, οὐρανός menunjuk pada ranah surgawi, bukan sekadar langit fisik; “dari surga” merupakan ungkapan Indonesia yang alami.
- source_word: ὡς
  choice: seperti
  rationale: Kata ini memperkenalkan rangkaian perbandingan dan diterjemahkan secara langsung serta alami dengan “seperti”.
- source_word: ὑδάτων πολλῶν
  choice: air yang melimpah
  rationale: Ungkapan ini mempertahankan gambaran sejumlah besar air, sedangkan “gemuruh” menyampaikan sifat akustiknya dalam bahasa Indonesia yang wajar tanpa menentukan jenis perairannya.
- source_word: βροντῆς μεγάλης
  choice: gelegar guruh yang dahsyat
  rationale: μέγας menyatakan besarnya atau kuatnya guruh. “Dahsyat” menyampaikan intensitas tersebut, sementara “gelegar guruh” terdengar alami dan hidup.
- source_word: κιθαρῳδῶν
  choice: para pemain kecapi
  rationale: Dalam konteks ini, partisip berikutnya secara khusus menggambarkan mereka sedang memainkan κιθάρα. “Para pemain kecapi” jelas, ringkas, dan tidak menambahkan unsur nyanyian yang tidak dinyatakan secara eksplisit di sini.
- source_word: κιθαριζόντων
  choice: yang memainkan
  rationale: Partisip ini secara langsung menyatakan kegiatan memainkan alat musik; padanan tersebut jelas dan alami.
- source_word: ἐν ταῖς κιθάραις αὐτῶν
  choice: kecapi mereka
  rationale: Bahasa Indonesia lazim memakai verba “memainkan” langsung dengan nama alat musik. “Kecapi” mempertahankan istilah tradisional yang mudah dikenali, dengan keterangan budaya dalam catatan kaki.
theological_decisions:
- issue: Sifat fenomena pendengaran dari surga
  choice: Menggunakan “suara” untuk setiap kemunculan φωνή.
  alternative: Menggunakan “bunyi” sepanjang ayat atau mencampurkan “suara” dan “bunyi”.
  rationale: “Suara” dalam bahasa Indonesia cukup luas untuk peristiwa akustik yang dibandingkan dengan air, guruh, dan musik, tetapi juga tidak menutup kemungkinan nuansa “suara” pribadi. Dengan demikian, terjemahan tidak memaksakan apakah sumbernya merupakan pribadi yang berbicara atau semata-mata bunyi surgawi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada agung dan gambaran bunyi yang kuat. Repetisi “suara” dipertahankan untuk mencerminkan pengulangan φωνή, sementara struktur kalimat dibuat alami bagi pembaca umum.
