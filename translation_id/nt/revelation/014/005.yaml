id: REV.14.5
reference: Revelation 14:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ⸂ἐν τῷ στόματι αὐτῶν οὐχ εὑρέθη⸃ ψεῦδος· ⸀ἄμωμοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/005.yaml
  text: And in their mouth no lie was found[a]; they are blameless.
translation:
  language: id
  text: Dan dalam mulut mereka tidak ditemukan dusta; mereka tidak bercela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanpa cacat” atau “tanpa noda”; istilah Yunani ini dapat membangkitkan gambaran korban yang tanpa cacat, selain menyatakan ketidakbercelaan secara moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Dan
  rationale: Mempertahankan kata penghubung yang meneruskan uraian dari ayat sebelumnya.
- source_word: ἐν τῷ στόματι αὐτῶν
  choice: di dalam mulut mereka
  rationale: Terjemahan dekat ini mempertahankan bentuk tunggal kolektif στόματι dan ungkapan sumber tentang isi perkataan mereka; dalam bahasa Indonesia ungkapan ini tetap dapat dipahami secara alami dan bermartabat.
- source_word: οὐχ εὑρέθη
  choice: tidak ditemukan
  rationale: Mempertahankan bentuk pasif aoris dan penekanan teks pada tidak adanya dusta, tanpa mengubahnya menjadi pernyataan aktif tentang tindakan mereka.
- source_word: ψεῦδος
  choice: dusta
  rationale: Kata ini secara langsung dan ringkas menyatakan ketidakbenaran dalam perkataan; 'dusta' sesuai dengan ragam Alkitab Indonesia yang tetap lazim dipahami.
- source_word: ἄμωμοί
  choice: tidak bercela
  rationale: Menyampaikan integritas moral dalam bahasa Indonesia yang alami tanpa harus menyatakan kesempurnaan mutlak; kemungkinan nuansa korban yang tanpa cacat dicatat dalam catatan kaki.
theological_decisions:
- issue: Menerjemahkan ἄμωμοί dengan tetap membuka nuansa moral dan kemurnian korban tanpa melebih-lebihkan ketidakberdosaan mutlak
  choice: tidak bercela
  alternative: tanpa cacat; tanpa kesalahan
  rationale: '''Tidak bercela'' menyampaikan keadaan yang tidak dapat dipersalahkan secara moral, sedangkan istilah Yunani juga dapat membangkitkan gambaran korban yang tanpa cacat. Nuansa itu dipertahankan dalam catatan kaki, bukan diselesaikan secara sepihak dalam teks utama.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang ringkas dan bermartabat. Susunan pasif sumber dipertahankan. Ungkapan 'di dalam mulut mereka' sengaja dekat dengan bahasa Yunani, sedangkan 'tidak bercela' dipilih sebagai padanan utama yang alami dan tidak terlalu menafsirkan.
