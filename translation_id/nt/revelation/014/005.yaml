  naturalness: “Dan dalam mulut mereka tidak ditemukan dusta; mereka tidak bercela” ringkas, baku, dan mudah dipahami. Kata “dusta” sesuai dengan register tinggi namun masih lazim. Catatan kaki diperjelas agar gambaran korban tidak terdengar sebagai pernyataan bahwa orang-orang itu sendiri adalah korban.
  terminology: “Tidak bercela” merupakan padanan yang baik untuk ἄμωμοι, dengan ruang bagi makna integritas moral dan gema “tanpa cacat” dalam konteks korban. Alternatif “tanpa kesalahan” kurang tepat sebagai catatan leksikal karena dapat menyiratkan kesempurnaan mutlak; “tanpa noda” lebih dekat sebagai alternatif yang mempertahankan citra kemurnian/korban.
