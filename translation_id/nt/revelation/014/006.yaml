id: REV.14.6
reference: Revelation 14:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ἄλλον ἄγγελον πετόμενον ἐν μεσουρανήματι, ἔχοντα εὐαγγέλιον αἰώνιον εὐαγγελίσαι ⸀ἐπὶ τοὺς καθημένους ἐπὶ τῆς γῆς καὶ ἐπὶ πᾶν ἔθνος καὶ φυλὴν καὶ γλῶσσαν καὶ λαόν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/006.yaml
  text: And I saw another angel flying in midheaven[a], having an eternal gospel to proclaim to those who dwell on the earth, and to every nation and tribe and language and people[b],
translation:
  language: id
  text: Lalu aku melihat seorang malaikat lain terbang di tengah langit[a], membawa Injil yang kekal untuk diberitakannya kepada mereka yang tinggal di bumi[b] dan kepada setiap bangsa, suku, bahasa, dan kaum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di angkasa” atau “di titik tertinggi langit”; istilah Yunani ini merupakan ungkapan khas dalam gambaran apokaliptik.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mereka yang duduk di bumi”; dalam kitab Wahyu ungkapan ini dipakai secara idiomatis untuk para penghuni bumi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλον ἄγγελον
  choice: seorang malaikat lain
  rationale: Dalam konteks apokaliptik Wahyu, ἄγγελος menunjuk pada makhluk surgawi, sedangkan ἄλλον meneruskan urutan penglihatan dengan arti 'lain'.
- source_word: πετόμενον
  choice: terbang
  rationale: Partisipel kini menggambarkan malaikat yang sedang bergerak; 'terbang' alami dan tepat dalam bahasa Indonesia.
- source_word: ἐν μεσουρανήματι
  choice: di tengah langit
  rationale: Ungkapan ini menunjuk pada bentangan atau titik tinggi di langit dalam gambaran apokaliptik. 'Di tengah langit' mempertahankan citranya dan lebih mudah dipahami daripada istilah teknis yang tidak lazim.
- source_word: ἔχοντα
  choice: membawa
  rationale: Secara dasar berarti 'mempunyai/memiliki'. Dalam konteks seorang malaikat yang membawa pesan untuk diumumkan, 'membawa' alami tanpa menyiratkan bahwa Injil adalah benda yang dipegang.
- source_word: εὐαγγέλιον αἰώνιον
  choice: Injil yang kekal
  rationale: '''Injil'' mempertahankan resonansi kanonis εὐαγγέλιον, sedangkan ''yang kekal'' menyampaikan sifatnya yang terus berlaku. Bentuk Yunani tanpa artikel tidak dipaksa menjadi lebih definit daripada yang diperlukan; bahasa Indonesia tidak memiliki artikel tak tentu.'
- source_word: εὐαγγελίσαι
  choice: untuk diberitakan
  rationale: Infinitif aoris menyatakan tujuan. Bentuk pasif Indonesia menghindari pengulangan janggal 'mengin­jilkan Injil' dan tetap menunjukkan bahwa pesan itu hendak diumumkan.
- source_word: ἐπὶ τοὺς καθημένους ἐπὶ τῆς γῆς
  choice: kepada mereka yang tinggal di bumi
  rationale: καθημένους secara harfiah berarti 'duduk', tetapi dalam Wahyu ungkapan ini berfungsi idiomatis bagi para penghuni bumi. 'Tinggal' menyampaikan maksud kontekstual tanpa gambaran postur yang menyesatkan.
- source_word: πᾶν ἔθνος καὶ φυλὴν καὶ γλῶσσαν καὶ λαόν
  choice: setiap bangsa, suku, bahasa, dan kaum
  rationale: Rangkaian empat unsur ini menegaskan cakupan universal. Pilihan tersebut jelas dalam bahasa Indonesia serta mempertahankan ritme kumulatif teks.
theological_decisions:
- issue: Apakah εὐαγγέλιον αἰώνιον diterjemahkan dengan istilah gerejawi tradisional atau ungkapan umum
  choice: Injil yang kekal
  alternative: kabar baik yang kekal
  rationale: '''Injil'' mempertahankan kaitan kanonis dan teologis istilah Yunani tanpa menambahkan isi doktrinal yang tidak dinyatakan ayat ini.'
- issue: Cara memahami τοὺς καθημένους ἐπὶ τῆς γῆς
  choice: mereka yang tinggal di bumi
  alternative: mereka yang duduk di bumi
  rationale: Pilihan ini mempertahankan kategori para penghuni bumi yang berulang dalam Wahyu, tetapi tidak membuat pembaca mengira bahwa teks terutama membicarakan posisi tubuh.
- issue: Hubungan penerima setelah frasa penghuni bumi
  choice: kepada mereka yang tinggal di bumi, kepada setiap bangsa, suku, bahasa, dan kaum
  alternative: kepada mereka yang tinggal di bumi, yaitu setiap bangsa, suku, bahasa, dan kaum
  rationale: Pengulangan 'kepada' mengikuti koordinasi Yunani dan tidak secara eksplisit mengubah deretan kedua menjadi aposisi penjelas, sehingga hubungan sintaktis yang agak longgar tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat dibuat alami bagi pembaca umum sambil mempertahankan urutan penglihatan, gambaran apokaliptik, cakupan universal, serta tanda koma akhir yang menunjukkan bahwa kalimat berlanjut ke ayat berikutnya.
