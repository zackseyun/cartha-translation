id: REV.14.11
reference: Revelation 14:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ὁ καπνὸς τοῦ βασανισμοῦ αὐτῶν εἰς αἰῶνας αἰώνων ἀναβαίνει, καὶ οὐκ ἔχουσιν ἀνάπαυσιν ἡμέρας καὶ νυκτός, οἱ προσκυνοῦντες τὸ θηρίον καὶ τὴν εἰκόνα αὐτοῦ, καὶ εἴ τις λαμβάνει τὸ χάραγμα τοῦ ὀνόματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/011.yaml
  text: And the smoke of their torment goes up forever and ever[a], and they have no rest day and night, those who worship the beast and its image[b], and whoever receives the mark of its name.
translation:
  language: id
  text: Dan asap siksaan mereka naik selama-lamanya[a], dan mereka tidak mendapat istirahat siang dan malam—mereka yang menyembah binatang itu dan patungnya, dan jika seseorang menerima tanda namanya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “sepanjang zaman segala zaman.”'
    reason: lexical_alternative
  - marker: b
    text: Teks Yunani berakhir secara agak mendadak dengan “dan jika seseorang menerima tanda namanya,” yang tampaknya melanjutkan gambaran tentang orang-orang yang berada di bawah penghukuman. Ungkapan ini juga dapat dilancarkan menjadi “dan siapa pun yang menerima tanda namanya.”
    reason: alternative_reading
lexical_decisions:
- source_word: καπνὸς τοῦ βασανισμοῦ αὐτῶν
  choice: asap siksaan mereka
  rationale: Mempertahankan gambaran konkret dan hubungan genitif Yunani secara alami dalam bahasa Indonesia.
- source_word: εἰς αἰῶνας αἰώνων
  choice: selama-lamanya
  rationale: Ungkapan Indonesia yang wajar untuk formula apokaliptik yang menyatakan kelangsungan tanpa akhir; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: ἀναβαίνει
  choice: naik
  rationale: Bentuk kini mempertahankan gambaran asap yang terus naik tanpa menambahkan penafsiran.
- source_word: οὐκ ἔχουσιν ἀνάπαυσιν
  choice: mereka tidak mendapat istirahat
  rationale: Ungkapan Indonesia yang alami dan tetap dekat dengan arti langsung 'tidak memiliki istirahat'.
- source_word: ἡμέρας καὶ νυκτός
  choice: siang dan malam
  rationale: Padanan idiomatis untuk keterangan waktu yang menyatakan keadaan terus-menerus.
- source_word: προσκυνοῦντες
  choice: menyembah
  rationale: Dalam konteks Wahyu, kata ini menunjukkan penghormatan yang bersifat ibadah dan kesetiaan religius.
- source_word: θηρίον
  choice: binatang
  rationale: Padanan mapan yang mempertahankan citra apokaliptik tanpa menambahkan ciri yang tidak dinyatakan teks.
- source_word: εἰκόνα
  choice: patung
  rationale: Dalam konteks objek yang dibuat dan disembah, 'patung' lebih konkret dan alami daripada 'gambar', sementara tetap berada dalam cakupan makna εἰκών.
- source_word: εἴ τις λαμβάνει
  choice: jika seseorang menerima
  rationale: Mempertahankan peralihan mendadak dari partisipel jamak ke syarat tak tentu tunggal dalam teks Yunani.
- source_word: χάραγμα τοῦ ὀνόματος αὐτοῦ
  choice: tanda namanya
  rationale: Menjaga susunan genitif yang ringkas dan istilah 'tanda' yang telah menjadi padanan standar dalam Wahyu.
theological_decisions:
- issue: Durasi penghukuman dalam εἰς αἰῶνας αἰώνων
  choice: selama-lamanya
  alternative: sepanjang zaman segala zaman
  rationale: Formula ini dalam Wahyu menyampaikan ungkapan terkuat mengenai kelangsungan. Terjemahan utama memberikan daya idiomatisnya, sedangkan bentuk yang lebih harfiah dicatat tanpa menjadikan catatan itu pembatas teologis.
- issue: Sintaksis klausa terakhir
  choice: mempertahankan 'dan jika seseorang menerima'
  alternative: melancarkan menjadi 'dan mereka yang menerima' atau 'dan siapa pun yang menerima'
  rationale: Teks Yunani beralih dari uraian partisipial jamak ke konstruksi bersyarat tunggal yang agak mendadak. Terjemahan mempertahankan ketegangan sintaksis itu dan tidak memutuskan secara berlebihan bagaimana tepatnya klausa terakhir melekat pada uraian sebelumnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Tanda pisah membantu pembaca mengenali bahwa kelompok yang disebut sesudahnya menjelaskan siapa yang tidak mendapat istirahat, tetapi klausa bersyarat terakhir sengaja tidak sepenuhnya dilancarkan.
