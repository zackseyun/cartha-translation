id: REV.14.4
reference: Revelation 14:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν οἳ μετὰ γυναικῶν οὐκ ἐμολύνθησαν, παρθένοι γάρ εἰσιν· ⸀οὗτοι οἱ ἀκολουθοῦντες τῷ ἀρνίῳ ὅπου ἂν ⸀ὑπάγῃ· ⸁οὗτοι ἠγοράσθησαν ἀπὸ τῶν ἀνθρώπων ἀπαρχὴ τῷ θεῷ καὶ τῷ ἀρνίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/004.yaml
  text: These are the ones who have not defiled themselves with women[a], for they are virgins. These are the ones who follow the Lamb wherever he goes. These were purchased from among mankind as firstfruits to God and to the Lamb[b],
translation:
  language: id
  text: Mereka inilah yang tidak menajiskan diri dengan perempuan[a], sebab mereka adalah perjaka. Mereka inilah yang mengikuti Anak Domba ke mana pun Ia pergi. Mereka telah dibeli dari antara umat manusia sebagai buah sulung bagi Allah dan bagi Anak Domba[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, gambaran ini melambangkan kemurnian rohani atau kebebasan dari kenajisan penyembahan berhala, bukan hanya menyatakan secara harfiah bahwa mereka tidak melakukan hubungan seksual.
    reason: alternative_reading
  - marker: b
    text: Ungkapan Yunani merujuk kepada manusia secara umum, bukan khusus kepada laki-laki.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἐμολύνθησαν
  choice: tidak menajiskan diri
  rationale: Bentuk Yunani secara gramatikal pasif, tetapi dalam konteks ini ungkapan bahasa Indonesia yang refleksif menyampaikan keadaan serta keterlibatan subjek secara alami. Kata 'menajiskan' mempertahankan nuansa moral dan kultis μολύνω.
- source_word: μετὰ γυναικῶν
  choice: dengan perempuan
  rationale: μετά dengan genitif berarti 'dengan'; bentuk jamak γυναικῶν di sini paling langsung merujuk kepada perempuan, tanpa membatasi makna pada istri.
- source_word: παρθένοι
  choice: perawan
  rationale: παρθένος secara langsung berarti orang yang belum pernah melakukan hubungan seksual. Istilah konkret dipertahankan agar gambaran teks tidak diubah menjadi tafsiran abstrak seperti 'suci'.
- source_word: ἀκολουθοῦντες
  choice: yang mengikuti
  rationale: Partisipel kini menggambarkan tindakan yang menjadi ciri mereka; bentuk 'yang mengikuti' menyatakannya secara wajar dalam bahasa Indonesia.
- source_word: ἀρνίῳ
  choice: Anak Domba
  rationale: Dalam Wahyu, ἀρνίον merupakan gelar dan gambaran kristologis. Kapitalisasi menandai pemakaiannya sebagai sebutan khusus tanpa menghilangkan citra anak domba.
- source_word: ὅπου ἂν ὑπάγῃ
  choice: ke mana pun Ia pergi
  rationale: ὅπου ἄν dengan bentuk subjungtif menyatakan tempat yang tidak tertentu, yakni 'ke mana pun'. 'Pergi' merupakan padanan alami bagi ὑπάγῃ dalam konteks ini.
- source_word: ἠγοράσθησαν
  choice: telah dibeli
  rationale: ἀγοράζω berarti membeli. Padanan ini mempertahankan metafora transaksi yang bersifat penebusan tanpa langsung menggantinya dengan istilah teologis interpretatif 'ditebus'.
- source_word: ἀπὸ τῶν ἀνθρώπων
  choice: dari antara umat manusia
  rationale: ἄνθρωποι merujuk kepada manusia secara umum, bukan khusus laki-laki. Ungkapan ini akurat, inklusif, dan sesuai dengan ragam bahasa yang luhur.
- source_word: ἀπαρχὴ
  choice: buah sulung
  rationale: ἀπαρχή adalah bagian pertama hasil panen yang dipersembahkan kepada Allah. 'Buah sulung' mempertahankan citra panen, persembahan, dan resonansi kultisnya.
theological_decisions:
- issue: Apakah ungkapan tidak menajiskan diri dengan perempuan dan menjadi perawan harus diterjemahkan secara harfiah atau ditafsirkan secara simbolis dalam teks utama
  choice: 'Teks utama mempertahankan gambaran konkret: ''tidak menajiskan diri dengan perempuan, sebab mereka adalah perawan.'''
  alternative: Ungkapan itu dapat dipahami sebagai gambaran kemurnian rohani atau kebebasan dari kenajisan penyembahan berhala.
  rationale: Bahasa Yunani bersifat konkret, sedangkan sifat simbolisnya tetap menjadi persoalan penafsiran. Terjemahan utama tidak seharusnya menyelesaikan ketegangan tersebut; kemungkinan simbolis dicatat dalam catatan kaki.
- issue: Makna pembelian kelompok itu
  choice: Menggunakan 'telah dibeli' dan tidak menggantinya dengan 'telah ditebus'.
  alternative: Menerjemahkannya secara teologis sebagai 'telah ditebus'.
  rationale: Kata Yunani mempertahankan metafora pembelian. Konotasi penebusan mungkin hadir, tetapi tidak perlu dijadikan satu-satunya tafsiran dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada luhur dan mudah dipahami. Pengulangan 'Mereka inilah' mempertahankan penekanan οὗτοι. 'Ia' dikapitalisasi sesuai kebiasaan penerbitan Alkitab Indonesia untuk rujukan kepada Kristus. Tanda koma penutup dipertahankan karena ayat ini berlanjut secara sintaksis ke ayat berikutnya.
