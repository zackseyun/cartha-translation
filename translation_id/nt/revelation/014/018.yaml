id: REV.14.18
reference: Revelation 14:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἄλλος ⸀ἄγγελος ἐκ τοῦ θυσιαστηρίου, ⸀ὁ ἔχων ἐξουσίαν ἐπὶ τοῦ πυρός, καὶ ἐφώνησεν ⸀φωνῇ μεγάλῃ τῷ ἔχοντι τὸ δρέπανον τὸ ὀξὺ λέγων· Πέμψον σου τὸ δρέπανον τὸ ὀξὺ καὶ τρύγησον τοὺς βότρυας τῆς ἀμπέλου τῆς γῆς, ὅτι ἤκμασαν αἱ σταφυλαὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/018.yaml
  text: And another angel came out from the altar[a], the one who has authority over the fire, and he called out with a loud voice to the one who had the sharp sickle, saying, “Send out your sharp sickle and gather the clusters of the vine of the earth[b], because its grapes are ripe.”
translation:
  language: id
  text: Lalu seorang malaikat lain keluar dari mezbah—malaikat yang berkuasa atas api itu—dan ia berseru dengan suara nyaring kepada dia yang memegang sabit tajam itu, “Ayunkanlah sabit tajammu[a] dan tuailah tandan-tandan anggur dari pohon anggur bumi[b], karena buah anggurnya sudah matang.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Kirimkanlah sabit tajammu.” Dalam gambaran panen, ungkapan ini dapat diterjemahkan secara idiomatis sebagai “ayunkanlah sabitmu.”'
    reason: lexical_alternative
  - marker: b
    text: “Pohon anggur bumi” adalah gambaran apokaliptik. Ayat ini tidak menyebutkan secara langsung apa yang dilambangkannya, meskipun konteks sekitarnya menggambarkan penghakiman.
    reason: theological_ambiguity
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: seorang malaikat lain
  rationale: Dalam adegan penglihatan di Wahyu, ἄγγελος menunjuk kepada makhluk surgawi; susunan ini juga mempertahankan urutan narasi yang ditandai ἄλλος.
- source_word: ἐκ τοῦ θυσιαστηρίου
  choice: keluar dari mezbah
  rationale: θυσιαστήριον berarti mezbah, dan frasa ini secara alami menyatakan bahwa malaikat muncul dari arah atau tempat mezbah.
- source_word: ὁ ἔχων ἐξουσίαν ἐπὶ τοῦ πυρός
  choice: Malaikat itu berkuasa atas api
  rationale: Frasa partisipial ini menerangkan malaikat tersebut. 'Berkuasa atas api' menyampaikan ἐξουσία ἐπί secara alami tanpa menentukan lebih jauh sifat kuasanya.
- source_word: ἐφώνησεν φωνῇ μεγάλῃ
  choice: berseru dengan suara nyaring
  rationale: Ungkapan ini mempertahankan verba seruan dan nomina φωνή, sekaligus terdengar wajar dan bermartabat dalam bahasa Indonesia.
- source_word: τῷ ἔχοντι τὸ δρέπανον τὸ ὀξὺ
  choice: kepada dia yang memegang sabit tajam itu
  rationale: ἔχοντι secara harfiah berarti mempunyai atau memegang; dalam adegan ini 'memegang' paling jelas. Kata 'tajam' dipertahankan karena diulangi dalam ayat.
- source_word: Πέμψον σου τὸ δρέπανον τὸ ὀξὺ
  choice: Ayunkanlah sabit tajammu
  rationale: πέμπω secara dasar berarti 'mengirim', tetapi dengan alat panen ungkapan harfiah 'kirimkan sabitmu' tidak alami dalam bahasa Indonesia. 'Ayunkanlah' menyampaikan tindakan menggunakan sabit, sementara alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: τρύγησον
  choice: tuailah
  rationale: τρυγάω secara khusus merujuk pada pemetikan atau panen buah anggur. 'Tuailah' jelas dalam konteks gugusan buah dan mempertahankan citra panen.
- source_word: τοὺς βότρυας
  choice: gugusan-gugusan buah
  rationale: βότρυς adalah gugusan atau tandan buah anggur. Bentuk ulang menyatakan objek jamak, sedangkan 'buah' membuat ungkapan Indonesia lebih alami sebelum penyebutan pokok anggur.
- source_word: τῆς ἀμπέλου τῆς γῆς
  choice: dari pokok anggur bumi
  rationale: Susunan ini mempertahankan metafora apokaliptik dan hubungan genitifnya tanpa menafsirkan pokok anggur itu sebagai kelompok tertentu.
- source_word: ἤκμασαν αἱ σταφυλαὶ αὐτῆς
  choice: buah-buah anggurnya sudah matang
  rationale: ἀκμάζω menunjukkan tercapainya kematangan. 'Sudah matang' menyampaikan hasil keadaan perfektif aoris secara alami tanpa menambahkan penegasan 'sepenuhnya'.
theological_decisions:
- issue: Makna metaforis τῆς ἀμπέλου τῆς γῆς
  choice: pokok anggur bumi
  alternative: menafsirkannya dalam teks utama sebagai orang-orang fasik atau umat manusia yang akan dihakimi
  rationale: Konteks berikutnya menunjukkan penghakiman, tetapi ayat ini sendiri tetap memakai citra apokaliptik. Terjemahan mempertahankan metafora dan tidak menetapkan rujukannya secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat Yunani yang panjang dibagi untuk kejelasan. Metafora apokaliptik dipertahankan, sementara perintah dengan πέμπω diterjemahkan secara idiomatis dan alternatif harfiahnya diberikan dalam catatan kaki.
