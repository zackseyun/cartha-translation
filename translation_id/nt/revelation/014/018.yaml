revisions:
- from: Lalu seorang malaikat lain keluar dari mezbah. Malaikat itu berkuasa atas api. Ia berseru dengan suara nyaring kepada dia yang memegang sabit tajam itu, “Ayunkanlah sabit tajammu[a] dan tuailah gugusan-gugusan buah dari pokok anggur bumi[b], karena buah-buah anggurnya sudah matang.”
  to: Lalu seorang malaikat lain keluar dari mezbah—malaikat yang berkuasa atas api itu—dan ia berseru dengan suara nyaring kepada dia yang memegang sabit tajam itu, “Ayunkanlah sabit tajammu[a] dan tuailah tandan-tandan anggur dari pohon anggur bumi[b], karena buah anggurnya sudah matang.”
  rationale: Revisi diperlukan untuk memulihkan kekhususan leksikal βότρυας sebagai tandan anggur dan untuk mengaitkan secara lebih langsung keterangan “yang berkuasa atas api” dengan malaikat tersebut. Metafora “pohon anggur bumi” dan ketidakjelasan rujukannya dipertahankan; tidak ada penafsiran doktrinal yang ditambahkan.
