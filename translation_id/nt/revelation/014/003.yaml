id: REV.14.3
reference: Revelation 14:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν ⸀ὡς ᾠδὴν καινὴν ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τῶν τεσσάρων ζῴων καὶ τῶν πρεσβυτέρων· καὶ οὐδεὶς ἐδύνατο μαθεῖν τὴν ᾠδὴν εἰ μὴ αἱ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες, οἱ ἠγορασμένοι ἀπὸ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/003.yaml
  text: And they are singing what seemed to be a new song before the throne and before the four living creatures and the elders[a]. And no one was able to learn the song except the one hundred forty-four thousand[b], those who had been purchased from the earth.
translation:
  language: id
  text: Mereka menyanyikan seperti sebuah nyanyian baru di hadapan takhta dan di hadapan keempat makhluk hidup serta para tua-tua.[a] Tidak seorang pun dapat mempelajari nyanyian itu selain seratus empat puluh empat ribu orang itu, yaitu mereka yang telah dibeli dari bumi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sebagai nyanyian baru” atau “seperti nyanyian baru.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “yang telah ditebus dari bumi.” Kata Yunaninya secara harfiah berarti “dibeli.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ᾄδουσιν
  choice: Mereka menyanyikan
  rationale: Bentuk kini indikatif jamak dipertahankan sebagai kini naratif yang hidup; bentuk Indonesia ini alami tanpa harus menambahkan penanda aspek progresif.
- source_word: ὡς ᾠδὴν καινὴν
  choice: sesuatu yang terdengar seperti nyanyian baru
  rationale: ὡς menandai kesan dalam pengalaman penglihatan. Karena objeknya nyanyian, 'terdengar seperti' lebih alami dalam bahasa Indonesia dan tidak menyangkal bahwa nyanyian itu sungguh baru.
- source_word: ἐνώπιον
  choice: di hadapan
  rationale: Padanan yang ringkas dan bermartabat untuk keberadaan di depan atau dalam hadirat takhta dan para penghuni sidang surgawi.
- source_word: τῶν τεσσάρων ζῴων
  choice: keempat makhluk hidup
  rationale: Menghindari 'binatang' dan mempertahankan sebutan kontekstual bagi makhluk-makhluk surgawi di sekitar takhta.
- source_word: τῶν πρεσβυτέρων
  choice: para tua-tua
  rationale: Sebutan kelompok yang lazim dan jelas dalam konteks kitab Wahyu.
- source_word: οὐδεὶς ἐδύνατο μαθεῖν
  choice: Tidak seorang pun dapat mempelajari
  rationale: Menyatakan ketidakmampuan yang digambarkan oleh bentuk imperfek ἐδύνατο dan mempertahankan arti dasar μαθεῖν, 'mempelajari'.
- source_word: αἱ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: seratus empat puluh empat ribu orang itu
  rationale: Bilangan ditulis dengan kata-kata demi kelancaran sastra; 'orang itu' menyatakan artikel tertentu sekaligus memperjelas bahwa yang dimaksud adalah sekelompok orang.
- source_word: οἱ ἠγορασμένοι ἀπὸ τῆς γῆς
  choice: mereka yang telah dibeli dari bumi
  rationale: Mempertahankan metafora pasar dari ἀγοράζω dan konstruksi perfektif, tanpa menggantinya dengan istilah teologis yang lebih interpretatif.
theological_decisions:
- issue: Daya ὡς dalam gambaran penglihatan
  choice: sesuatu yang terdengar seperti nyanyian baru
  alternative: sebagai nyanyian baru / seperti nyanyian baru
  rationale: Ungkapan ini mempertahankan bahasa persepsi khas penglihatan dalam Wahyu tanpa menyimpulkan bahwa nyanyian tersebut sebenarnya bukan nyanyian baru.
- issue: Terjemahan οἱ ἠγορασμένοι
  choice: mereka yang telah dibeli
  alternative: mereka yang telah ditebus
  rationale: Teks Yunani memakai metafora jual-beli secara langsung. 'Ditebus' berkaitan secara teologis, tetapi lebih interpretatif, sehingga dicantumkan sebagai alternatif dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat mudah dipahami pembaca umum, sambil mempertahankan bahasa persepsi penglihatan, sebutan khas kitab Wahyu, dan metafora pembelian dalam teks Yunani.
