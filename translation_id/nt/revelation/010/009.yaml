id: REV.10.9
reference: Revelation 10:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ⸀ἀπῆλθα πρὸς τὸν ἄγγελον λέγων αὐτῷ δοῦναί μοι τὸ ⸀βιβλαρίδιον. καὶ λέγει μοι· Λάβε καὶ κατάφαγε αὐτό, καὶ πικρανεῖ σου τὴν κοιλίαν, ἀλλ’ ἐν τῷ στόματί σου ἔσται γλυκὺ ὡς μέλι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/009.yaml
  text: So I went to the angel[a], telling him to give me the little scroll. And he says to me, “Take and eat it, and it will make your stomach bitter[c][b], but in your mouth it will be sweet like honey.”
translation:
  language: id
  text: Lalu aku pergi kepada malaikat itu dan berkata kepadanya agar ia memberikan gulungan kecil itu kepadaku. Ia berkata kepadaku, “Ambillah dan makanlah gulungan itu sampai habis. Gulungan itu akan membuat perutmu menjadi pahit, tetapi di dalam mulutmu gulungan itu akan manis seperti madu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθα πρὸς τὸν ἄγγελον
  choice: aku pergi kepada malaikat itu
  rationale: ἀπῆλθα menyatakan gerak Yohanes menuju malaikat. 'Pergi kepada' alami dalam bahasa Indonesia dan tidak menggeser sudut pandang menjadi 'datang'.
- source_word: λέγων αὐτῷ δοῦναί μοι
  choice: berkata kepadanya agar ia memberikan ... kepadaku
  rationale: Ungkapan ini mempertahankan tindakan berkata beserta isi permintaannya tanpa menambahkan tingkat kesopanan yang tidak dinyatakan secara eksplisit oleh bahasa Yunani.
- source_word: βιβλαρίδιον
  choice: gulungan kecil
  rationale: Bentuk diminutif menunjuk pada gulungan atau buku kecil; 'gulungan kecil' sesuai dengan bentuk media tulis dunia kuno dan mempertahankan nuansa ukurannya.
- source_word: λέγει μοι
  choice: Ia berkata kepadaku
  rationale: Bahasa Yunani memakai present historis untuk menghidupkan narasi. Dalam narasi Indonesia, bentuk lampau kontekstual 'berkata' lebih alami tanpa kehilangan urutan peristiwa.
- source_word: Λάβε
  choice: Ambillah
  rationale: Imperatif ini secara langsung memerintahkan Yohanes mengambil gulungan tersebut; partikel -lah memberi bentuk perintah yang wajar dan bermartabat.
- source_word: κατάφαγε αὐτό
  choice: makanlah sampai habis
  rationale: Kata kerja majemuk κατεσθίω lebih kuat daripada sekadar 'makan'; 'sampai habis' menyampaikan ketuntasan tindakan secara alami tanpa memperkerasnya menjadi 'lahaplah'.
- source_word: πικρανεῖ σου τὴν κοιλίαν
  choice: akan membuat perutmu pahit
  rationale: πικραίνω bersifat kausatif, sedangkan κοιλία dalam konteks makan menunjuk bagian dalam tubuh atau perut. Terjemahan ini mempertahankan citra jasmaninya.
- source_word: ἐν τῷ στόματί σου ἔσται γλυκὺ ὡς μέλι
  choice: di dalam mulutmu akan terasa manis seperti madu
  rationale: '''Terasa'' merupakan pelengkap idiomatis dalam bahasa Indonesia untuk pengalaman rasa, sementara perbandingan dengan madu dipertahankan.'
theological_decisions:
- issue: Tindakan simbolis memakan gulungan
  choice: Mempertahankan perintah konkret untuk mengambil dan memakan gulungan sampai habis tanpa menjelaskan makna simbolisnya.
  alternative: Menafsirkan tindakan itu di dalam teks sebagai menerima atau meresapi firman Allah.
  rationale: Ayat ini sendiri menyajikan tindakan kenabian simbolis tanpa penjelasan langsung. Terjemahan tidak boleh memasukkan penafsiran teologis ke dalam teks utama.
- issue: Kepahitan pada κοιλία
  choice: Mempertahankan gambaran konkret bahwa gulungan membuat perut pahit.
  alternative: Mengalihkannya menjadi kesedihan batin atau penderitaan rohani.
  rationale: Makna simbolisnya tidak dijabarkan dalam ayat ini; citra tubuh dan ketegangan antara manis di mulut dan pahit di perut perlu dibiarkan tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Narasi dibuat alami dengan 'berkata' alih-alih meniru present historis Yunani secara kaku. Tidak diperlukan catatan kaki karena pilihan utama dapat menyampaikan teks secara jelas tanpa menutup ambiguitas teologis yang penting.
