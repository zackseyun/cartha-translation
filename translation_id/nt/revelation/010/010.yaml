id: REV.10.10
reference: Revelation 10:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἔλαβον τὸ ⸀βιβλαρίδιον ἐκ τῆς χειρὸς τοῦ ἀγγέλου καὶ κατέφαγον αὐτό, καὶ ἦν ἐν τῷ στόματί μου ὡς μέλι γλυκύ· καὶ ὅτε ἔφαγον αὐτό, ἐπικράνθη ἡ κοιλία μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/010.yaml
  text: And I took the little scroll from the hand of the angel and ate it, and in my mouth it was sweet like honey; and when I had eaten it, my stomach was made bitter.
translation:
  language: id
  text: Lalu aku mengambil gulungan kecil itu[a] dari tangan malaikat dan memakannya. Di dalam mulutku, rasanya manis seperti madu, tetapi setelah aku memakannya, perutku menjadi pahit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “buku kecil.” Istilah Yunani berbentuk diminutif dan dapat menunjuk pada dokumen tertulis kecil; “gulungan kecil” paling sesuai dengan bentuk dokumen yang mungkin digunakan pada zaman itu.
    reason: lexical_alternative
  - marker: b
    text: Atau “isi perutku menjadi pahit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βιβλαρίδιον
  choice: gulungan kecil
  rationale: Bentuk diminutif menunjuk pada dokumen tertulis berukuran kecil; “gulungan kecil” mempertahankan nuansa ukuran serta paling sesuai dengan bentuk naskah pada dunia kuno.
- source_word: ἐκ τῆς χειρὸς τοῦ ἀγγέλου
  choice: dari tangan malaikat
  rationale: Ungkapan ini secara langsung mempertahankan gambaran bahwa gulungan tersebut diterima dari tangan malaikat.
- source_word: κατέφαγον
  choice: memakannya
  rationale: “Memakan” menyampaikan tindakan simbolis dengan wajar tanpa melebihkan intensitas verba menjadi “melahap”.
- source_word: ὡς μέλι γλυκύ
  choice: terasa manis seperti madu
  rationale: Susunan ini alami dalam bahasa Indonesia dan mempertahankan perbandingan eksplisit dengan madu.
- source_word: ὅτε ἔφαγον αὐτό
  choice: setelah aku memakannya
  rationale: '“Setelah” memperjelas urutan naratif: kepahitan dialami sesudah tindakan memakan, tanpa mengubah makna dasar aoristus.'
- source_word: ἐπικράνθη
  choice: menjadi pahit
  rationale: Verba pasif ini dalam konteks menyatakan perubahan keadaan; “menjadi pahit” lebih alami dalam bahasa Indonesia daripada bentuk pasif harfiah “dibuat pahit” dan tetap mempertahankan hasil perubahan itu.
- source_word: κοιλία
  choice: perutku
  rationale: “Perut” adalah padanan modern yang jelas untuk bagian dalam tubuh yang dimaksud dan tidak terdengar terlalu teknis.
theological_decisions:
- issue: Tindakan simbolis memakan gulungan
  choice: Gambaran rasa manis dan perut yang menjadi pahit diterjemahkan apa adanya tanpa penjelasan simbolis tambahan.
  alternative: Menafsirkan rasa manis dan pahit secara eksplisit sebagai sukacita dan penghakiman.
  rationale: Ayat ini sendiri tidak menjabarkan seluruh makna simbol tersebut; mempertahankan gambarnya menjaga ambiguitas dan ketegangan teologis teks.
- issue: Daya kausatif atau perubahan keadaan dalam ἐπικράνθη
  choice: menjadi pahit
  alternative: dibuat pahit
  rationale: Dalam konteks ini bentuk tersebut dapat dipahami sebagai perubahan keadaan. Bahasa Indonesia yang alami memakai “menjadi pahit,” tanpa menentukan pelaku yang membuatnya pahit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat panjang Yunani dibagi menjadi dua kalimat agar mudah dipahami, sementara rangkaian tindakan dan kontras antara manis dan pahit tetap dipertahankan. Penanda catatan kaki [a] dan [b] ditempatkan pada unsur yang diterangkan.
