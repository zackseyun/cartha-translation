id: REV.10.2
reference: Revelation 10:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἔχων ἐν τῇ χειρὶ αὐτοῦ ⸀βιβλαρίδιον ἠνεῳγμένον. καὶ ἔθηκεν τὸν πόδα αὐτοῦ τὸν δεξιὸν ἐπὶ τῆς θαλάσσης, τὸν δὲ εὐώνυμον ἐπὶ τῆς γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/002.yaml
  text: and having in his hand a little scroll that had been opened[a]. And he placed his right foot on the sea, and his left on the land[b],
translation:
  language: id
  text: Ia memegang sebuah gulungan kecil[a] yang sudah dibuka. Ia meletakkan kaki kanannya di atas laut dan kaki kirinya di atas daratan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebuah buku kecil.” Kata Yunani βιβλαρίδιον adalah bentuk diminutif yang dapat menunjuk pada gulungan atau buku berukuran kecil.
    reason: lexical_alternative
  - marker: b
    text: Atau “bumi.” Kata Yunani γῆ dapat berarti “daratan” atau “bumi”; di sini “daratan” dipilih karena dikontraskan dengan “laut.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχων
  choice: memegang
  rationale: Partisipel ini menerangkan malaikat perkasa dalam ayat sebelumnya. Dalam bahasa Indonesia, bentuk verba utama menghasilkan kalimat yang alami, sedangkan makna memiliki sesuatu di tangan tetap dinyatakan oleh “memegang”.
- source_word: ἐν τῇ χειρὶ αὐτοῦ
  choice: di tangannya (tersirat dalam “memegang”)
  rationale: Kata “memegang” secara alami sudah menyatakan bahwa benda berada di tangan; menerjemahkannya lagi secara eksplisit akan terasa berlebihan dalam bahasa Indonesia.
- source_word: βιβλαρίδιον
  choice: sebuah gulungan kecil
  rationale: Bentuk diminutif ini menunjuk pada gulungan atau buku berukuran kecil. “Gulungan kecil” mempertahankan gambaran benda tulis pada dunia kuno tanpa menutup kemungkinan alternatif “buku kecil” yang dicatat dalam catatan kaki.
- source_word: ἠνεῳγμένον
  choice: yang sudah dibuka
  rationale: Partisipel perfek pasif menyatakan tindakan yang telah terjadi dengan keadaan yang masih berlangsung. “Sudah dibuka” mempertahankan unsur pasif dan hasil yang berlanjut.
- source_word: ἔθηκεν
  choice: meletakkan
  rationale: Pilihan ini menyampaikan tindakan yang disengaja dan khidmat serta tetap dekat dengan arti dasar τίθημι.
- source_word: τὸν πόδα αὐτοῦ τὸν δεξιόν
  choice: kaki kanannya
  rationale: Terjemahan langsung dan alami untuk konstruksi posesif beserta penanda sisi kanan.
- source_word: ἐπὶ τῆς θαλάσσης
  choice: di atas laut
  rationale: ἐπί dengan genitif di sini menunjukkan posisi di atas permukaan atau wilayah laut; “di atas laut” mempertahankan gambaran apokaliptiknya.
- source_word: τὸν δὲ εὐώνυμον
  choice: dan kaki kirinya
  rationale: εὐώνυμος dalam konteks ini berarti “kiri”; nomina “kaki” diulangi dalam bahasa Indonesia demi kejelasan dan keseimbangan.
- source_word: ἐπὶ τῆς γῆς
  choice: di atas daratan
  rationale: γῆ dapat berarti bumi, tanah, atau daratan. Karena dipertentangkan langsung dengan laut, “daratan” paling jelas menyatakan kontras ruang tersebut.
theological_decisions:
- issue: Makna γῆ dalam kontras dengan θάλασσα
  choice: daratan
  alternative: bumi
  rationale: Adegan ini menggambarkan satu kaki berada di atas laut dan kaki lainnya di atas daratan. Pilihan “daratan” mempertahankan kontras langsung itu tanpa secara tidak perlu menetapkan bahwa yang dimaksud ialah seluruh bumi sebagai kosmos.
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan susunan yang lugas dan khidmat. Hubungan partisipial dengan ayat sebelumnya disampaikan sebagai kalimat mandiri agar alami dalam bahasa Indonesia. Penanda catatan kaki ditempatkan pada istilah yang benar: [a] sesudah “gulungan kecil” dan [b] sesudah “daratan”.'
