id: REV.10.1
reference: Revelation 10:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ἄλλον ἄγγελον ἰσχυρὸν καταβαίνοντα ἐκ τοῦ οὐρανοῦ, περιβεβλημένον νεφέλην, καὶ ἡ ἶρις ἐπὶ ⸂τὴν κεφαλὴν⸃ αὐτοῦ, καὶ τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος, καὶ οἱ πόδες αὐτοῦ ὡς στῦλοι πυρός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/001.yaml
  text: And I saw another mighty angel coming down from heaven[a], clothed with a cloud, with the rainbow over his head, and his face was like the sun[b], and his feet like pillars of fire.
translation:
  language: id
  text: Lalu aku melihat seorang malaikat lain yang perkasa[a] turun dari surga, diselubungi awan. Di atas kepalanya ada pelangi[b], wajahnya seperti matahari, dan kakinya seperti tiang-tiang api.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “yang kuat.”'
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani ini dapat dipahami sebagai lingkaran cahaya, tetapi arti yang lazim ialah “pelangi” dan pengertian itu sesuai dengan gambaran dalam kitab Wahyu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ εἶδον
  choice: Lalu aku melihat
  rationale: Καί menghubungkan penglihatan ini dengan rangkaian sebelumnya; “lalu” menyampaikan perkembangan narasi secara alami, sedangkan bentuk orang pertama εἶδον dipertahankan.
- source_word: ἄλλον ἄγγελον
  choice: seorang malaikat lain
  rationale: Dalam konteks penglihatan Wahyu dan turunnya tokoh ini dari surga, ἄγγελος secara paling wajar merujuk kepada malaikat. Kata ἄλλον menunjukkan bahwa tokoh ini adalah malaikat lain, tanpa menetapkan identitasnya lebih jauh.
- source_word: ἰσχυρὸν
  choice: yang perkasa
  rationale: Ἰσχυρός menyatakan kekuatan atau kuasa yang besar. “Perkasa” alami dalam gambaran apokaliptik dan lebih bermartabat daripada sekadar “kuat”; alternatif itu dicatat dalam catatan kaki.
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: turun dari surga
  rationale: Frasa ini menggambarkan gerak ke bawah yang sedang terlihat dari surga; bentuk ringkas “turun dari surga” jelas dan alami dalam bahasa Indonesia.
- source_word: περιβεβλημένον νεφέλην
  choice: diselubungi awan
  rationale: Partisipel perfektum περιβεβλημένον menggambarkan sosok yang terbungkus atau berpakaian awan. “Diselubungi awan” mempertahankan citra tersebut tanpa memberi kesan bahwa awan adalah pakaian harfiah biasa.
- source_word: ἡ ἶρις
  choice: pelangi
  rationale: Ἶρις lazimnya berarti “pelangi” dan sesuai dengan citra Wahyu 4:3. Kemungkinan nuansa lingkaran cahaya tetap dicatat sebagai alternatif.
- source_word: ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: di atas kepalanya
  rationale: Ἐπί dengan akusatif di sini menggambarkan posisi pelangi di atas atau pada kepala; “di atas kepalanya” mempertahankan citra dengan wajar.
- source_word: τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος
  choice: wajahnya seperti matahari
  rationale: Πρόσωπον berarti wajah atau tampak muka, dan perbandingan ὡς dipertahankan tanpa menambahkan penafsiran tentang sifat sinarnya.
- source_word: οἱ πόδες αὐτοῦ ὡς στῦλοι πυρός
  choice: kakinya seperti tiang-tiang api
  rationale: Πόδες secara langsung berarti kaki, sedangkan στῦλοι πυρός mempertahankan gambaran jamak berupa tiang-tiang yang terdiri dari atau bercirikan api.
theological_decisions:
- issue: Identitas malaikat yang perkasa
  choice: Menerjemahkan secara netral sebagai “seorang malaikat lain yang perkasa”
  alternative: Menafsirkannya secara tegas sebagai malaikat ciptaan atau sebagai penampakan Kristus
  rationale: Teks Yunani hanya menyebut ἄλλον ἄγγελον ἰσχυρόν. Terjemahan tidak menentukan apakah sosok ini malaikat ciptaan atau figur kristofani, sehingga ketegangan penafsirannya tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada luhur tetapi mudah dipahami. Struktur kalimat dibuat mengalir dan citra apokaliptik sumber dipertahankan; pemenggalan setelah “awan” membantu keterbacaan tanpa mengubah hubungan antargambaran.
