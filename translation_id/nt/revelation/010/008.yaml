  terminology: “Malaikat,” “gulungan kitab,” “terbuka,” dan “daratan” dapat dipertahankan. Catatan a dengan tepat membedakan βιβλίον dalam ayat ini dari bentuk diminutif pada konteks sekitar. Catatan b secara memadai mempertahankan kemungkinan “bumi.”
