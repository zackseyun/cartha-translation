id: REV.10.8
reference: Revelation 10:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἡ φωνὴ ἣν ἤκουσα ἐκ τοῦ οὐρανοῦ, πάλιν ⸀λαλοῦσαν μετ’ ἐμοῦ καὶ ⸀λέγουσαν· Ὕπαγε λάβε τὸ ⸀βιβλίον τὸ ἠνεῳγμένον ἐν τῇ χειρὶ τοῦ ἀγγέλου τοῦ ἑστῶτος ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/008.yaml
  text: And the voice that I heard from heaven spoke to me again and said[a], “Go[b], take the scroll that is opened in the hand of the angel who is standing on the sea and on the land.”
translation:
  language: id
  text: Lalu suara yang telah kudengar dari surga itu berbicara lagi denganku dan berkata, “Pergilah, ambillah gulungan kitab[a] yang terbuka di tangan malaikat yang berdiri di atas laut dan di atas daratan[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gulungan kitab kecil”. Ayat-ayat di sekitarnya memakai bentuk diminutif, tetapi ayat ini memakai βιβλίον, “gulungan kitab”.
    reason: alternative_reading
  - marker: b
    text: Atau “bumi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: suara
  rationale: Dalam konteks ini φωνή adalah suara dari surga yang berbicara, bukan sekadar bunyi.
- source_word: πάλιν λαλοῦσαν μετ’ ἐμοῦ καὶ λέγουσαν
  choice: berbicara lagi kepadaku, katanya
  rationale: Ungkapan ini menyampaikan tindakan berulang dan sapaan langsung secara alami dalam bahasa Indonesia, tanpa menghilangkan dua unsur verbal Yunani.
- source_word: Ὕπαγε λάβε
  choice: Pergilah, ambillah
  rationale: Dua bentuk imperatif dipertahankan sebagai dua perintah yang berurutan; akhiran -lah memberi nada perintah yang wajar dan bermartabat.
- source_word: βιβλίον
  choice: gulungan kitab
  rationale: Bentuk benda tulis dalam latar kuno ini adalah gulungan; ayat ini memakai βιβλίον, bukan bentuk diminutif yang terdapat di ayat-ayat sekitar.
- source_word: ἠνεῳγμένον
  choice: yang terbuka
  rationale: Partisipel perfekt pasif menunjuk pada keadaan sebagai hasil pembukaan sebelumnya; 'terbuka' mengungkapkan keadaan tersebut secara alami.
- source_word: ἐν τῇ χειρὶ
  choice: di tangan
  rationale: Mencerminkan ἐν dan menyatakan letak gulungan; gagasan mengambilnya dari tangan malaikat sudah tersirat oleh perintah.
- source_word: ἄγγελος
  choice: malaikat
  rationale: Konteks penglihatan Wahyu jelas menunjuk kepada makhluk surgawi.
- source_word: ἑστῶτος
  choice: yang berdiri
  rationale: Mengungkapkan keadaan berdiri yang sedang berlangsung.
- source_word: ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς
  choice: di atas laut dan di atas daratan
  rationale: Pengulangan 'di atas' mempertahankan struktur dan gambaran Yunani; 'daratan' paling jelas membentuk pasangan spasial dengan laut.
theological_decisions:
- issue: Makna γῆ dalam gambaran apokaliptik
  choice: daratan
  alternative: bumi
  rationale: Gambaran langsungnya adalah malaikat berdiri di atas laut dan bagian kering sebagai pasangannya. 'Daratan' mempertahankan kontras spasial tanpa menetapkan cakupan kosmologis yang tidak diwajibkan konteks.
- issue: Hubungan βιβλίον dengan bentuk diminutif dalam konteks sekitar
  choice: gulungan kitab
  alternative: gulungan kitab kecil
  rationale: Ayat ini memakai βιβλίον, bukan bentuk diminutif βιβλαρίδιον. Karena itu teks utama tidak diselaraskan secara diam-diam dengan ayat sekitar, sedangkan kemungkinan berdasarkan konteks dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat dan mudah dipahami. Bentuk orang pertama 'kudengar' mempertahankan sudut pandang Yohanes secara ringkas; 'Pergilah, ambillah' menjaga dua imperatif sumber. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
