revisions:
- from: Namun, pada masa suara malaikat ketujuh terdengar, ketika ia akan meniup sangkakala, tergenaplah rahasia Allah, sesuai dengan kabar baik yang telah Dia sampaikan kepada hamba-hamba-Nya[a], yaitu para nabi.
  to: Namun, pada hari-hari ketika suara malaikat ketujuh akan terdengar, ketika ia akan meniup sangkakala, rahasia Allah tergenapi, seperti yang telah Dia beritakan sebagai kabar baik kepada hamba-hamba-Nya[a], yaitu para nabi.
  rationale: Revisi mempertahankan struktur temporal dan makna φωνή tanpa meleburkannya ke dalam tindakan meniup sangkakala. Klausa terakhir dikembalikan menjadi tindakan pemberitaan kabar baik oleh Allah kepada para nabi, sebagaimana εὐηγγέλισεν. "Tergenapi" menyatakan realisasi rahasia Allah dalam konteks yang berorientasi ke depan tanpa memaksakan pembacaan teologis tertentu.
