id: REV.10.7
reference: Revelation 10:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλ’ ἐν ταῖς ἡμέραις τῆς φωνῆς τοῦ ἑβδόμου ἀγγέλου, ὅταν μέλλῃ σαλπίζειν, καὶ ἐτελέσθη τὸ μυστήριον τοῦ θεοῦ, ὡς εὐηγγέλισεν τοὺς ⸂ἑαυτοῦ δούλους⸃ τοὺς προφήτας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/007.yaml
  text: but in the days of the voice of the seventh angel[a], when he is about to sound the trumpet, then the mystery of God is fulfilled, just as he proclaimed the good news to his own servants, the prophets.
translation:
  language: id
  text: Namun, pada hari-hari ketika suara malaikat ketujuh akan terdengar, ketika ia akan meniup sangkakala, rahasia Allah tergenapi, seperti yang telah Dia beritakan sebagai kabar baik kepada hamba-hamba-Nya[a], yaitu para nabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “budak-budak-Nya.” Kata Yunani ini dapat berarti “hamba” atau “budak”; di sini, ungkapan tersebut menekankan bahwa mereka adalah milik Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Namun
  rationale: Menandai pertentangan dengan pernyataan sebelumnya secara ringkas dan wajar dalam bahasa Indonesia.
- source_word: ἐν ταῖς ἡμέραις τῆς φωνῆς τοῦ ἑβδόμου ἀγγέλου
  choice: pada masa suara malaikat ketujuh terdengar
  rationale: Ungkapan temporal Yunani dipertahankan, sedangkan 'terdengar' ditambahkan secara idiomatis agar 'masa suara' tidak terasa janggal tanpa menyamakan suara itu sepenuhnya dengan tindakan meniup sangkakala.
- source_word: ὅταν μέλλῃ σαλπίζειν
  choice: ketika ia akan meniup sangkakala
  rationale: Menyampaikan imminensi μέλλῃ dan membuat objek yang tersirat dalam σαλπίζειν eksplisit secara alami.
- source_word: καὶ ἐτελέσθη
  choice: tergenaplah
  rationale: Aoristus dipahami dalam kerangka klausa temporal yang berorientasi ke masa depan; bentuk Indonesia ini menyampaikan tercapainya atau terlaksananya maksud Allah tanpa memaksakan sistem eskatologis tertentu.
- source_word: τὸ μυστήριον τοῦ θεοῦ
  choice: rahasia Allah
  rationale: '''Rahasia'' adalah padanan Indonesia yang alami untuk μυστήριον sebagai maksud ilahi yang sebelumnya tersembunyi, tanpa mengartikannya secara berlebihan.'
- source_word: ὡς εὐηγγέλισεν
  choice: sesuai dengan kabar baik yang telah Dia sampaikan
  rationale: Mempertahankan unsur 'kabar baik' dalam εὐαγγελίζω dan mengungkapkan tindakan lampau secara alami.
- source_word: τοὺς ἑαυτοῦ δούλους
  choice: hamba-hamba-Nya
  rationale: Dalam bahasa Indonesia, 'hamba' mempertahankan relasi kepemilikan, ketundukan, dan pelayanan kepada Allah dengan register Alkitab yang wajar; alternatif literal 'budak-budak-Nya' dicatat dalam catatan kaki.
- source_word: τοὺς προφήτας
  choice: yaitu para nabi
  rationale: Kata 'yaitu' memperjelas bahwa 'para nabi' merupakan aposisi yang mengidentifikasi hamba-hamba tersebut.
theological_decisions:
- issue: Makna ἐτελέσθη dalam klausa temporal yang berorientasi ke masa depan
  choice: tergenaplah
  alternative: diselesaikanlah / telah selesai
  rationale: Pilihan ini menyatakan realisasi rahasia atau rencana Allah sambil mempertahankan ketegangan antara bentuk aoristus Yunani dan konteks waktu yang akan datang.
- issue: Padanan δοῦλος bagi para nabi milik Allah
  choice: hamba-hamba-Nya
  alternative: budak-budak-Nya
  rationale: '''Hamba'' lebih alami dan bermartabat dalam bahasa Indonesia modern, tetapi tetap mengandung ketundukan dan kepunyaan karena sufiks ''-Nya''; catatan kaki mempertahankan kemungkinan padanan yang lebih keras dan literal.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada khidmat. Susunan kalimat mempertahankan corak apokaliptik, tetapi menghindari ungkapan harfiah yang janggal. Kapitalisasi kata ganti ilahi dipakai secara konsisten.
