  text: καὶ ἔκραξεν φωνῇ μεγάλῃ ὥσπερ λέων μυκᾶται. καὶ ὅτε ἔκραξεν, ἐλάλησαν αἱ ἑπτὰ βρονταὶ τὰς ἑαυτῶν φωνάς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/003.yaml
  text: And he cried out with a loud voice[a], just as a lion roars. And when he cried out, the seven thunders spoke with their own voices.
translation:
  language: id
  text: Ia berseru dengan suara nyaring, seperti singa mengaum. Ketika ia berseru, ketujuh guruh itu berbicara dengan suara mereka sendiri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ketujuh guruh itu mengucapkan suara mereka sendiri.” Bahasa Yunani secara mencolok mempersonifikasikan guruh-guruh itu sebagai berbicara.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκραξεν
  choice: berseru
  rationale: Kata ini menyatakan seruan kuat. 'Berseru' alami dan bermartabat dalam bahasa Indonesia serta tidak membatasi seruan itu sebagai teriakan karena kesusahan.
- source_word: φωνῇ μεγάλῃ
  choice: dengan suara nyaring
  rationale: Mempertahankan nomina konkret φωνή dan menyampaikan kekuatan suara secara alami dalam bahasa Indonesia.
- source_word: ὥσπερ λέων μυκᾶται
  choice: seperti singa mengaum
  rationale: Menyampaikan perbandingan secara langsung; 'mengaum' merupakan padanan alami bagi suara singa.
- source_word: ὅτε
  choice: ketika
  rationale: Mempertahankan hubungan waktu tanpa mempersempitnya menjadi 'setelah'.
- source_word: αἱ ἑπτὰ βρονταὶ
  choice: ketujuh guruh itu
  rationale: Bentuk ini mempertahankan artikel, bilangan, dan gambaran apokaliptik yang memperlakukan guruh sebagai pelaku.
- source_word: ἐλάλησαν ... τὰς ἑαυτῶν φωνάς
  choice: memperdengarkan suara mereka sendiri
  rationale: Ungkapan ini menjaga personifikasi dan penekanan refleksif ἑαυτῶν, tetapi lebih wajar dalam bahasa Indonesia daripada bentuk harfiah 'berbicara dengan suara mereka sendiri'.
theological_decisions:
- issue: Personifikasi ketujuh guruh
  choice: Ketujuh guruh dipertahankan sebagai pelaku yang memperdengarkan suara mereka sendiri.
  alternative: Ketujuh guruh itu bergemuruh.
  rationale: Teks Yunani secara eksplisit memakai verba berbicara (ἐλάλησαν) dan nomina 'suara-suara' (φωνάς). Terjemahan tidak mereduksi gambaran tersebut menjadi bunyi alam biasa.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan 'berseru' dipertahankan karena terdapat dalam teks sumber. 'Ketujuh guruh itu' dipilih untuk referen visioner tertentu, sedangkan 'memperdengarkan suara mereka sendiri' menyeimbangkan kealamian bahasa sasaran dengan personifikasi Yunani.
