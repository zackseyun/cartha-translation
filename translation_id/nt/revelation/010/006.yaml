id: REV.10.6
reference: Revelation 10:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ⸀ὤμοσεν τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων, ὃς ἔκτισεν τὸν οὐρανὸν καὶ τὰ ἐν αὐτῷ καὶ τὴν γῆν καὶ τὰ ἐν αὐτῇ καὶ τὴν θάλασσαν καὶ τὰ ἐν αὐτῇ, ὅτι χρόνος οὐκέτι ἔσται·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/006.yaml
  text: and swore by the one who lives forever and ever[a], who created heaven and the things in it, and the earth and the things on it, and the sea and the things in it, that there will no longer be any delay.
translation:
  language: id
  text: Lalu ia bersumpah demi Dia yang hidup selama-lamanya, yang menciptakan langit dan segala yang ada di dalamnya, bumi dan segala yang ada di dalamnya, serta laut dan segala yang ada di dalamnya, bahwa tidak akan ada penundaan lagi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “waktu tidak akan ada lagi.” Dalam konteks ini, χρόνος dapat dipahami sebagai “penundaan,” yakni masa penantian sebelum Allah bertindak pada akhirnya.
    reason: alternative_reading
lexical_decisions:
- source_word: ὤμοσεν
  choice: bersumpah
  rationale: Bentuk aoris dari ὀμνύω menyatakan tindakan mengucapkan sumpah; 'bersumpah' alami, ringkas, dan tetap khidmat dalam bahasa Indonesia.
- source_word: τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: demi Dia yang hidup selama-lamanya
  rationale: Dativus sesudah ὀμνύω menunjukkan pribadi yang menjadi dasar sumpah. Partisip ζῶντι bersifat substantival, sedangkan ungkapan εἰς τοὺς αἰῶνας τῶν αἰώνων menyatakan keberlangsungan tanpa akhir.
- source_word: ἔκτισεν
  choice: menciptakan
  rationale: κτίζω dalam rumusan kosmis ini menunjuk pada tindakan penciptaan dan mempertahankan penggambaran Allah sebagai Pencipta.
- source_word: τὸν οὐρανὸν
  choice: langit
  rationale: Dalam rangkaian penciptaan langit-bumi-laut, οὐρανός menunjuk pada ranah langit secara kosmis.
- source_word: τὰ ἐν αὐτῷ / τὰ ἐν αὐτῇ
  choice: segala yang ada di dalamnya / di atasnya
  rationale: Ungkapan nominal ini berarti apa yang terdapat pada tiap ranah. Untuk bumi, 'di atasnya' lebih alami dan sesuai dengan relasi spasial yang dimaksud; pengulangan tetap menjaga struktur tiga bagian.
- source_word: γῆν
  choice: bumi
  rationale: Dalam rangkaian kosmis langit-bumi-laut, γῆ berarti bumi, bukan suatu wilayah daratan tertentu.
- source_word: θάλασσαν
  choice: laut
  rationale: Padanan langsung yang mempertahankan bentuk tunggal dan rumusan penciptaan.
- source_word: ὅτι
  choice: bahwa
  rationale: Sesudah verba bersumpah, ὅτι memperkenalkan isi sumpah, bukan alasan kausal.
- source_word: χρόνος οὐκέτι ἔσται
  choice: tidak akan ada penundaan lagi
  rationale: Dalam konteks langsung, χρόνος paling mungkin menunjuk pada masa penantian atau penundaan sebelum penggenapan tindakan Allah, bukan berakhirnya waktu sebagai realitas.
theological_decisions:
- issue: Makna χρόνος dalam isi sumpah
  choice: penundaan tidak akan ada lagi
  alternative: waktu tidak akan ada lagi
  rationale: Ayat berikutnya mengarahkan pembaca kepada segera tergenapinya rahasia Allah. Terjemahan 'penundaan' menyampaikan makna kontekstual yang paling mungkin tanpa menyatakan bahwa urutan waktu sendiri berhenti, sementara arti harfiahnya tetap dicatat agar ambiguitas sumber tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Sapaan 'Dia' memakai huruf kapital untuk memperjelas rujukan kepada Allah tanpa menambahkan gelar yang tidak terdapat dalam teks. Struktur langit-bumi-laut dan isinya dipertahankan, tetapi konektor terakhir dibuat 'serta' agar alami.
