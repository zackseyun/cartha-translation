  text: καὶ ὁ ἄγγελος, ὃν εἶδον ἑστῶτα ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς, ἦρεν τὴν χεῖρα αὐτοῦ τὴν δεξιὰν εἰς τὸν οὐρανόν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/005.yaml
  text: And the angel whom I saw standing on the sea and on the land raised his right hand to heaven[b][a],
translation:
  language: id
  text: Lalu malaikat yang kulihat berdiri di atas laut dan di atas daratan[a] itu mengangkat tangan kanannya ke surga.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di atas bumi” untuk “di atas daratan”.
    reason: lexical_alternative
  - marker: b
    text: Atau “ke arah surga”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος
  choice: malaikat
  rationale: Dalam konteks Wahyu, yang dimaksud adalah makhluk surgawi; 'malaikat' lebih tepat dan alami daripada istilah umum 'utusan'.
- source_word: ἑστῶτα
  choice: berdiri
  rationale: Partisipel perfek ini menggambarkan keadaan atau posisi malaikat yang sedang berdiri; bentuk Indonesia yang alami ialah 'berdiri'.
- source_word: ἐπὶ τῆς θαλάσσης
  choice: di atas laut
  rationale: '''Di atas laut'' mempertahankan gambaran mencolok dari bahasa Yunani dan selaras dengan konteks sebelumnya.'
- source_word: ἐπὶ τῆς γῆς
  choice: di atas daratan
  rationale: Dalam pertentangan langsung dengan laut, 'daratan' menyampaikan kontras ruang secara alami, sambil mengakui bahwa γῆ juga dapat berarti 'bumi'.
- source_word: ἦρεν
  choice: mengangkat
  rationale: '''Mengangkat'' merupakan padanan Indonesia yang ringkas dan wajar untuk gerakan tangan dalam konteks sumpah.'
- source_word: τὴν χεῖρα αὐτοῦ τὴν δεξιὰν
  choice: tangan kanannya
  rationale: Ungkapan ini secara idiomatis mempertahankan penyebutan eksplisit tangan kanan.
- source_word: εἰς τὸν οὐρανόν
  choice: ke arah surga
  rationale: εἰς menyatakan arah gerakan; 'ke arah surga' mempertahankan nuansa arah sekaligus bobot teologis οὐρανός tanpa memberi kesan bahwa tangan itu mencapai atau memasuki surga.
theological_decisions:
- issue: Makna γῆ dalam kontras dengan θάλασσα
  choice: daratan
  alternative: bumi
  rationale: Adegan ini menampilkan posisi malaikat atas dua ranah, laut dan daratan. 'Daratan' mempertahankan kontras visual langsung tanpa menutup kemungkinan leksikal 'bumi'.
- issue: Makna οὐρανός
  choice: surga
  alternative: langit
  rationale: Gerakan ini mengantar kepada sumpah demi Sang Pencipta pada ayat berikutnya; 'surga' mempertahankan bobot ranah ilahi, sedangkan 'langit' dapat dipahami hanya sebagai bentangan fisik.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Lalu' menghubungkan tindakan ini dengan penglihatan sebelumnya; bentuk 'kulihat' alami dalam narasi orang pertama. Urutan penanda catatan kaki mengikuti letak ungkapan yang dijelaskan dalam teks.
