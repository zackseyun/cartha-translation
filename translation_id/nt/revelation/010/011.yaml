  source_fidelity: 'Perlu revisi kecil: πολλοῖς secara langsung menerangkan βασιλεῦσιν, sehingga ''banyak'' sebaiknya melekat pada ''raja'', bukan dibaca sebagai penentu seluruh rangkaian. Selebihnya, ''tentang'' merupakan pilihan yang aman untuk ἐπί dalam konteks ini, dan empat kelompok dalam daftar sumber tetap terwakili.'
