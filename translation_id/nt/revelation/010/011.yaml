id: REV.10.11
reference: Revelation 10:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ λέγουσίν μοι· Δεῖ σε πάλιν προφητεῦσαι ἐπὶ λαοῖς ⸀καὶ ἔθνεσιν καὶ γλώσσαις καὶ βασιλεῦσιν πολλοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/011.yaml
  text: And they say to me, “You must prophesy again about many peoples and nations and languages and kings.”
translation:
  language: id
  text: Lalu mereka berkata kepadaku, “Engkau harus bernubuat lagi tentang bangsa-bangsa, suku-suku bangsa, bahasa-bahasa, dan banyak raja.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγουσίν
  choice: berkata
  rationale: Bentuk kini historis Yunani diterjemahkan dengan bentuk naratif Indonesia yang alami tanpa kehilangan isi ujaran.
- source_word: Δεῖ σε
  choice: Engkau harus
  rationale: Menyampaikan keharusan yang dinyatakan oleh δεῖ secara langsung dan wajar.
- source_word: πάλιν προφητεῦσαι
  choice: bernubuat lagi
  rationale: Mempertahankan arti tindakan profetik yang harus dilakukan kembali.
- source_word: ἐπὶ
  choice: tentang
  rationale: Dalam konteks ini menandai pihak-pihak yang menjadi pokok atau cakupan nubuat; 'tentang' mempertahankan keluasan makna tanpa memaksakan arti 'melawan' atau 'kepada'.
- source_word: λαοῖς
  choice: bangsa
  rationale: Mewakili kelompok-kelompok manusia atau peoples dalam rangkaian universal ini.
- source_word: ἔθνεσιν
  choice: suku bangsa
  rationale: Membedakannya dari λαοῖς dan menyampaikan kelompok etnis/bangsa-bangsa tanpa memakai istilah yang terlalu teknis.
- source_word: γλώσσαις
  choice: bahasa
  rationale: Dalam daftar kelompok manusia, γλῶσσα merujuk pada komunitas yang dibedakan menurut bahasa, dengan metonimia yang tetap dapat dipahami dalam bahasa Indonesia.
- source_word: βασιλεῦσιν πολλοῖς
  choice: banyak ... raja
  rationale: Urutan Indonesia menempatkan 'banyak' sebagai penentu seluruh rangkaian, sejalan dengan kemungkinan cakupan πολλοῖς dalam konteks daftar.
theological_decisions:
- issue: Arah atau sasaran nubuat dalam ἐπὶ
  choice: tentang
  alternative: kepada / terhadap / melawan
  rationale: '''Tentang'' menjaga ambiguitas bahwa bangsa-bangsa dan raja-raja merupakan pokok atau lingkup nubuat, tanpa menambahkan nuansa permusuhan maupun membatasi mereka sebagai pendengar langsung.'
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti 'engkau' dipakai untuk ujaran langsung yang bersifat khidmat; susunan daftar dibuat alami sambil mempertahankan empat kategori dalam teks Yunani.
