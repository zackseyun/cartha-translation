  naturalness: Sebagian besar ungkapannya baku dan alami. “Dan ketika ...; aku mendengar ...” mempertahankan alur naratif sambil tetap wajar dalam bahasa Indonesia modern. “Ketujuh guruh itu” dan “meteraikanlah” sesuai register apokaliptis yang khidmat.
  terminology: “Guruh,” “surga,” dan “meteraikanlah” mempertahankan citra dan register teks. “Suara dari surga” tepat karena tidak mengidentifikasi pembicara. Akhiran “-nya” secara idiomatis mencakup isi jamak yang dirujuk αὐτά tanpa perlu catatan kaki.
