source:
  edition: SBLGNT
  text: καὶ ὅτε ἐλάλησαν αἱ ἑπτὰ βρονταί, ἤμελλον γράφειν· καὶ ἤκουσα φωνὴν ἐκ τοῦ οὐρανοῦ λέγουσαν· Σφράγισον ἃ ἐλάλησαν αἱ ἑπτὰ βρονταί, καὶ μὴ αὐτὰ γράψῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/004.yaml
  text: And when the seven thunders spoke[a], I was about to write; and I heard a voice from heaven saying, “Seal up what the seven thunders spoke, and do not write them.”
translation:
  language: id
  text: Dan ketika ketujuh guruh itu berbicara, aku hendak menulis; dan aku mendengar suara dari surga berkata, “Meteraikanlah apa yang dikatakan oleh ketujuh guruh itu dan jangan menuliskannya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλάλησαν
  choice: berbicara
  rationale: Kata ini secara umum berarti ‘berbicara’ atau ‘mengucapkan’. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan penggambaran ketujuh guruh sebagai pelaku yang berbicara.
- source_word: αἱ ἑπτὰ βρονταί
  choice: ketujuh guruh itu
  rationale: ‘Guruh’ mempertahankan citra apokaliptis dan personifikasi dalam teks Yunani; bentuk ‘ketujuh ... itu’ menandai kelompok yang sudah tertentu.
- source_word: ἤμελλον γράφειν
  choice: aku hendak menulis
  rationale: Konstruksi μέλλω dengan infinitif menunjukkan tindakan yang segera atau akan dilakukan. ‘Hendak menulis’ menyampaikan bahwa Yohanes sudah bersiap untuk menulis sebelum dicegah.
- source_word: φωνὴν ἐκ τοῦ οὐρανοῦ
  choice: suara dari surga
  rationale: Terjemahan ini alami dan mempertahankan asal suara tersebut tanpa menentukan identitas pembicaranya.
- source_word: Σφράγισον
  choice: Meteraikanlah
  rationale: Imperatif ini memerintahkan tindakan tegas untuk menyegel dan dengan demikian menahan isi dari pengungkapan. ‘Meteraikanlah’ mempertahankan metafora segel dalam konteks pewahyuan.
- source_word: ἃ ἐλάλησαν αἱ ἑπτὰ βρονταί
  choice: apa yang dikatakan oleh ketujuh guruh itu
  rationale: Pronomina relatif netral jamak menunjuk pada isi perkataan mereka. Susunan ini alami dalam bahasa Indonesia dan tidak menambahkan rincian tentang isi tersebut.
- source_word: μὴ αὐτὰ γράψῃς
  choice: jangan menuliskannya
  rationale: Akhiran ‘-nya’ secara alami merujuk kembali pada apa yang dikatakan oleh ketujuh guruh. Bahasa Indonesia tidak perlu menandai jumlah pada pronomina ini, sehingga larangan tetap jelas tanpa ungkapan yang kaku.
theological_decisions:
- issue: Identitas suara dari surga
  choice: suara dari surga
  alternative: suara Allah dari surga
  rationale: Teks hanya menyebut asal suara itu dan tidak secara eksplisit mengidentifikasi pembicaranya. Terjemahan tidak menentukan identitas yang dibiarkan terbuka oleh teks.
- issue: Makna tindakan memeteraikan
  choice: mempertahankan metafora ‘meteraikanlah’
  alternative: rahasiakanlah
  rationale: ‘Rahasiakanlah’ langsung menafsirkan fungsi segel sebagai penyembunyian, sedangkan teks memakai citra pemeteraian. Metafora dipertahankan agar hubungan dan ketegangan simbolisnya tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. ‘Guruh’ serta ‘meteraikanlah’ dipilih untuk mempertahankan citra apokaliptis, sementara susunan kalimat dibuat jelas bagi pembaca umum. Tidak diperlukan catatan kaki karena bentuk ‘-nya’ secara wajar dapat merujuk pada keseluruhan isi yang diucapkan tanpa memaksakan pembedaan jumlah yang tidak ditandai dalam bahasa Indonesia.
