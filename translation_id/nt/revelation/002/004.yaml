  yaml_path: translation/nt/revelation/002/004.yaml
  text: 'But I have this against you: you have abandoned your first love[a].'
translation:
  language: id
  text: 'Namun, Aku mempunyai keberatan terhadapmu: engkau telah meninggalkan kasihmu yang mula-mula.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kasihmu yang semula.” Frasa ini dapat merujuk pada kasih yang engkau miliki pada awalnya—baik kepada Tuhan, kepada satu sama lain, maupun kepada keduanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Namun
  rationale: Menandai pertentangan tegas dengan pujian sebelumnya, sekaligus terdengar alami dan bermartabat dalam bahasa Indonesia modern.
- source_word: ἔχω κατὰ σοῦ
  choice: Aku menentangmu dalam hal ini
  rationale: Ungkapan ἔχω κατά menyatakan keberatan atau dakwaan terhadap seseorang. Pilihan ini mempertahankan daya teguran tanpa menghasilkan susunan Indonesia yang kaku.
- source_word: ὅτι
  choice: ':'
  rationale: Memperkenalkan isi keberatan. Tanda titik dua menyampaikan fungsi penjelasnya secara alami tanpa menafsirkannya secara berlebihan sebagai hubungan sebab-akibat.
- source_word: ἀγάπην
  choice: kasih
  rationale: Padanan baku dan wajar bagi ἀγάπη dalam konteks Perjanjian Baru.
- source_word: τὴν πρώτην
  choice: yang semula
  rationale: Menyatakan kasih pada tahap awal atau mula-mula dengan bahasa Indonesia yang alami, tanpa menentukan objek kasih tersebut.
- source_word: ἀφῆκες
  choice: telah meninggalkan
  rationale: Dalam konteks ini ἀφίημι berarti meninggalkan atau melepaskan. 'Telah meninggalkan' mempertahankan keseriusan tindakan sekaligus menghindari penajaman berlebih yang dapat muncul dari 'menelantarkan' atau 'mencampakkan'.
theological_decisions:
- issue: Makna 'kasihmu yang semula'
  choice: Dipertahankan sebagai 'kasihmu yang semula' tanpa menyebut objek kasih.
  alternative: kasihmu kepada-Ku yang semula; kasih yang dahulu ada padamu; kasihmu yang mula-mula
  rationale: Frasa Yunani tidak menentukan apakah yang dimaksud terutama kasih kepada Kristus, kasih kepada sesama orang percaya, atau keduanya. Terjemahan ini mempertahankan keterbukaan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bernada teguran yang berwibawa. Pronomina ilahi ditulis dengan huruf kapital sesuai konvensi umum penerbitan Alkitab Indonesia.
