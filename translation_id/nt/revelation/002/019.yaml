id: REV.2.19
reference: Revelation 2:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οἶδά σου τὰ ἔργα, καὶ τὴν ⸂ἀγάπην καὶ τὴν πίστιν⸃ καὶ τὴν διακονίαν καὶ τὴν ὑπομονήν σου, καὶ τὰ ἔργα σου τὰ ἔσχατα πλείονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/019.yaml
  text: I know your works[a], your love and faith and service and endurance, and that your last works are more than the first.
translation:
  language: id
  text: Aku tahu perbuatanmu, kasihmu, imanmu[a], pelayananmu, dan ketekunanmu, serta bahwa perbuatanmu yang belakangan lebih banyak daripada perbuatanmu yang semula.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kesetiaan.” Kata Yunani yang dipakai di sini dapat berarti iman ataupun kesetiaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδά
  choice: Aku tahu
  rationale: οἶδα berfungsi dengan daya statif kini, sehingga 'Aku tahu' merupakan padanan Indonesia yang alami dan sesuai dengan rumusan berulang dalam pesan kepada jemaat-jemaat.
- source_word: ἔργα
  choice: perbuatan
  rationale: ἔργα menunjuk pada tindakan nyata. 'Perbuatan' alami dalam bahasa Indonesia dan mempertahankan pengulangan istilah tersebut pada akhir ayat.
- source_word: ἀγάπην
  choice: kasih
  rationale: ἀγάπη di sini menunjuk pada kasih aktif sebagai kebajikan umat percaya; 'kasih' merupakan padanan Alkitabiah Indonesia yang jelas dan lazim.
- source_word: πίστιν
  choice: iman
  rationale: πίστις dapat berarti iman atau kesetiaan dalam konteks ini. 'Iman' dipakai dalam teks utama, sementara kemungkinan 'kesetiaan' dipertahankan dalam catatan kaki.
- source_word: διακονίαν
  choice: pelayanan
  rationale: διακονία menunjuk pada tindakan melayani. 'Pelayanan' mudah dipahami dan tidak harus menyiratkan jabatan resmi.
- source_word: ὑπομονήν
  choice: ketekunan
  rationale: ὑπομονή menyatakan keteguhan untuk terus bertahan di bawah tekanan. 'Ketekunan' ringkas, alami, dan sesuai dengan konteks Wahyu.
- source_word: τὰ ἔργα σου τὰ ἔσχατα
  choice: perbuatanmu yang belakangan
  rationale: ἔσχατα dipahami secara temporal dalam pertentangan dengan τῶν πρώτων. 'Yang belakangan' lebih alami daripada 'yang terakhir' dan tidak menyiratkan bahwa sama sekali tidak akan ada perbuatan berikutnya.
- source_word: πλείονα τῶν πρώτων
  choice: lebih banyak daripada yang semula
  rationale: πλείονα terutama menyatakan jumlah atau keluasan yang lebih besar. Terjemahan ini mempertahankan bentuk perbandingan tanpa mengubahnya menjadi penilaian bahwa perbuatan itu secara moral 'lebih baik'.
theological_decisions:
- issue: Makna πίστις dalam daftar kebajikan
  choice: iman
  alternative: kesetiaan
  rationale: Dalam daftar ini πίστις dapat menunjuk pada kepercayaan kepada Allah atau pada kesetiaan yang tampak dalam perilaku. Teks utama memakai 'iman', sedangkan catatan kaki menjaga kemungkinan makna 'kesetiaan' tanpa menutup ambiguitas.
- issue: Sifat perbandingan πλείονα
  choice: lebih banyak
  alternative: lebih besar / melampaui
  rationale: Bentuk komparatif dapat berkaitan dengan jumlah atau keluasan. 'Lebih banyak' mempertahankan arti yang paling langsung dan menghindari kesan bahwa teks secara eksplisit mengatakan 'lebih baik'.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Daftar kebajikan dibagi secara alami, pengulangan 'perbuatan' dipertahankan, dan penanda catatan kaki [a] ditempatkan langsung sesudah 'iman' sebagai istilah yang ambigu.
