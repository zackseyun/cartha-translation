id: REV.2.17
reference: Revelation 2:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. τῷ νικῶντι δώσω ⸀αὐτῷ τοῦ μάννα τοῦ κεκρυμμένου, καὶ δώσω αὐτῷ ψῆφον λευκήν, καὶ ἐπὶ τὴν ψῆφον ὄνομα καινὸν γεγραμμένον ὃ οὐδεὶς οἶδεν εἰ μὴ ὁ λαμβάνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/017.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches. To the one who conquers I will give some of the hidden manna, and I will give him a white stone, and a new name written on it[c][b], which no one knows except the one who receives it.
translation:
  language: id
  text: Siapa yang mempunyai telinga, hendaklah ia mendengarkan apa yang dikatakan Roh kepada jemaat-jemaat. Kepada orang yang menang[a], Aku akan memberikan sebagian dari manna yang tersembunyi. Aku juga akan memberikan kepadanya sebuah batu putih[b]; pada batu itu tertulis sebuah nama baru[c] yang tidak diketahui siapa pun selain orang yang menerimanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang yang mengalahkan.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “batu putih” mungkin mengingatkan pada batu pemungutan suara, tanda pembebasan, atau tanda masuk. Teks tidak menjelaskan latar mana yang dimaksud.
    reason: cultural_note
  - marker: c
    text: Secara lebih harfiah, “dan pada batu itu sebuah nama baru yang tertulis.”
    reason: source_syntax
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: Siapa yang mempunyai telinga
  rationale: Mempertahankan idiom tunggal Yunani dalam bentuk Indonesia yang alami dan mencakup siapa saja yang mendengar seruan ini.
- source_word: ἀκουσάτω
  choice: hendaklah ia mendengarkan
  rationale: Bentuk ini menyampaikan daya perintah aoristus tanpa mengubahnya menjadi sekadar saran.
- source_word: τὸ πνεῦμα
  choice: Roh
  rationale: Konteks menunjuk kepada Roh ilahi, tetapi teks hanya mengatakan 'Roh', bukan secara eksplisit 'Roh Kudus'.
- source_word: ταῖς ἐκκλησίαις
  choice: kepada jemaat-jemaat
  rationale: Dalam konteks surat-surat Wahyu, ἐκκλησίαις menunjuk kepada komunitas-komunitas umat yang disapa; 'jemaat-jemaat' merupakan padanan Indonesia yang lazim.
- source_word: τῷ νικῶντι
  choice: Kepada orang yang menang
  rationale: Menjaga citra kemenangan dari νικάω dan bentuk tunggal yang bersifat umum.
- source_word: τοῦ μάννα τοῦ κεκρυμμένου
  choice: sebagian dari manna yang tersembunyi
  rationale: Genitif sesudah δίδωμι secara wajar menyatakan pemberian sebagian atau bagian dari suatu bahan; bentuk perfek menunjukkan manna yang telah dan tetap tersembunyi.
- source_word: ψῆφον λευκήν
  choice: sebuah batu putih
  rationale: ψῆφος dapat menunjuk batu kecil dengan beberapa fungsi budaya. Terjemahan utama tidak menentukan fungsi simbolis yang tidak dijelaskan teks.
- source_word: ἐπὶ τὴν ψῆφον
  choice: pada batu itu
  rationale: ἐπί dengan akusatif di sini secara alami menunjukkan tempat nama itu dituliskan.
- source_word: ὄνομα καινὸν γεγραμμένον
  choice: tertulis sebuah nama baru
  rationale: Menyampaikan nama yang telah dituliskan dan tetap tertera, dengan susunan yang alami dalam bahasa Indonesia.
- source_word: ὃ οὐδεὶς οἶδεν εἰ μὴ ὁ λαμβάνων
  choice: yang tidak diketahui siapa pun selain orang yang menerimanya
  rationale: Klausa relatif menerangkan 'nama baru'. Akhiran '-nya' secara alami menunjuk kepada apa yang diterima dalam gambaran tersebut tanpa menjelaskan lebih jauh hubungan antara batu dan nama.
theological_decisions:
- issue: Bentuk tunggal bergender dalam nasihat dan janji
  choice: Menggunakan bentuk tunggal umum 'ia', 'orang', dan '-nya'.
  alternative: Mengulang 'siapa yang' atau memakai bentuk jamak netral.
  rationale: Bentuk Yunani adalah maskulin tunggal dengan cakupan representatif. Bahasa Indonesia tidak perlu menandai gender pada pronomina, sehingga bentuk tunggal dan cakupan umumnya sama-sama terpelihara.
- issue: Makna simbolis ψῆφος λευκή
  choice: Menerjemahkan secara minimal sebagai 'sebuah batu putih' dan menaruh kemungkinan latar budaya dalam catatan kaki.
  alternative: Menafsirkannya secara khusus sebagai tanda pembebasan, batu pemungutan suara, atau tanda masuk.
  rationale: Ayat ini tidak menentukan fungsi batu tersebut; terjemahan tidak seharusnya menyelesaikan lambang yang dibiarkan terbuka oleh teks.
- issue: Hubungan sintaksis nama baru dengan batu putih
  choice: Menyatakan bahwa pada batu itu tertulis nama baru, tanpa menjadikan nama secara tegas sebagai benda kedua yang diberikan.
  alternative: Menerjemahkan 'dan Aku akan memberinya ... sebuah nama baru yang tertulis di atasnya'.
  rationale: Susunan Yunani secara langsung menempatkan nama pada batu, sedangkan verba 'memberikan' tidak diulang sebelum 'nama'. Pilihan ini menjaga hubungan yang jelas sekaligus tidak memaksakan analisis sintaksis tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. 'Hendaklah' mempertahankan kekuatan seruan, sedangkan 'jemaat-jemaat' mengikuti konteks komunitas-komunitas penerima dalam Wahyu. Kapitalisasi 'Aku' mencerminkan pembicara ilahi tanpa menambahkan gelar yang tidak ada dalam teks.
