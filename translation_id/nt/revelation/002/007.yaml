  naturalness: '"Siapa yang bertelinga" dapat dipahami, tetapi kurang idiomatis dalam bahasa Indonesia modern. "Siapa pun yang mempunyai telinga" lebih alami sambil tetap mempertahankan bentuk tunggal generik. Susunan aktif "apa yang Roh katakan kepada jemaat-jemaat" juga lebih langsung daripada bentuk pasif "apa yang dikatakan Roh".'
  terminology: '"Roh," "jemaat-jemaat," "pohon kehidupan," dan "Firdaus Allah" tepat untuk register baku-khidmat serta konteks Wahyu. "Menang" merupakan padanan yang baik untuk νικῶν; catatan kaki dapat menyebut "mengalahkan" atau "beroleh kemenangan" sebagai alternatif tanpa mempersempit objek kemenangan.'
