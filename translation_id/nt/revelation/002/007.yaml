id: REV.2.7
reference: Revelation 2:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. τῷ νικῶντι δώσω αὐτῷ φαγεῖν ἐκ τοῦ ξύλου τῆς ζωῆς, ὅ ἐστιν ἐν τῷ παραδείσῳ τοῦ ⸀θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/007.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches. To the one who conquers I will give to eat from the tree of life, which is in the paradise of God.
translation:
  language: id
  text: Siapa pun yang mempunyai telinga, hendaklah ia mendengarkan apa yang Roh katakan kepada jemaat-jemaat. Kepada orang yang menang[a], Aku akan mengizinkannya makan dari pohon kehidupan yang ada di Firdaus Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: mengalahkan; atau: beroleh kemenangan.'
    reason: νικάω mencakup gagasan menang atau mengatasi dalam konflik; bahasa Indonesia memungkinkan beberapa padanan yang menonjolkan segi berbeda dari citra kemenangan itu.
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: Siapa yang bertelinga
  rationale: Ungkapan partisipial tunggal ini bersifat idiomatis dan mengundang setiap orang yang mampu mendengar untuk memperhatikan. Bentuk tunggal οὖς tercermin secara alami dalam kata Indonesia 'bertelinga'.
- source_word: ἀκουσάτω
  choice: hendaklah dia mendengarkan
  rationale: Imperatif aoris orang ketiga tunggal menyampaikan seruan tegas. 'Hendaklah ... mendengarkan' mempertahankan daya imbauannya dan terdengar wajar dalam bahasa Indonesia baku.
- source_word: τὸ πνεῦμα
  choice: Roh
  rationale: Dalam rumusan berulang di Wahyu 2–3, konteks menunjuk kepada Roh Kudus; huruf kapital menandai rujukan tersebut tanpa menambahkan sebutan yang tidak tertulis.
- source_word: λέγει ταῖς ἐκκλησίαις
  choice: dikatakan Roh kepada jemaat-jemaat
  rationale: Susunan ini alami dalam bahasa Indonesia dan tetap menyatakan bahwa Roh sedang menyampaikan firman kepada lebih dari satu jemaat. 'Jemaat-jemaat' sesuai dengan konteks komunitas-komunitas Kristen dalam Wahyu 2–3.
- source_word: τῷ νικῶντι
  choice: Kepada orang yang menang
  rationale: Partisipel kini νικάω menggambarkan orang yang menang atau mengalahkan dalam konflik iman. 'Menang' ringkas, alami, dan mempertahankan citra kemenangan kitab Wahyu.
- source_word: δώσω αὐτῷ φαγεῖν
  choice: Aku akan memberi dia makan
  rationale: Ungkapan ini mempertahankan verba 'memberi', penerima tunggal αὐτῷ, dan infinitif 'makan'. Dalam konteks, artinya adalah memberi hak atau kesempatan kepadanya untuk makan, bukan menyuapinya.
- source_word: ἐκ τοῦ ξύλου τῆς ζωῆς
  choice: dari pohon kehidupan
  rationale: ἐκ menyatakan sumber dan diterjemahkan 'dari'; ξύλον dalam konteks ini berarti pohon dan menggemakan gambaran pohon kehidupan dalam Kejadian serta Wahyu.
- source_word: παραδείσῳ
  choice: Firdaus
  rationale: Dalam konteks eskatologis ini, 'Firdaus' mempertahankan bobot intertekstual dan teologis παράδεισος dengan lebih baik daripada sekadar 'taman'.
- source_word: τοῦ θεοῦ
  choice: Allah
  rationale: Genitif ini secara alami membentuk frasa 'Firdaus Allah', yang mempertahankan hubungan posesif atau asosiatif secara ringkas.
theological_decisions:
- issue: Rujukan τὸ πνεῦμα
  choice: Roh, dengan huruf kapital
  alternative: roh dalam arti umum
  rationale: Rumusan berulang 'apa yang dikatakan Roh kepada jemaat-jemaat' dalam Wahyu 2–3 berfungsi sebagai sabda ilahi dan secara kontekstual menunjuk kepada Roh Kudus.
- issue: Makna νικάω dalam rumusan janji
  choice: menang
  alternative: mengalahkan / beroleh kemenangan
  rationale: '''Menang'' mempertahankan gambaran kemenangan yang penting dalam kitab Wahyu tanpa menentukan secara berlebihan sifat atau sasaran kemenangan tersebut. Alternatif ''mengalahkan'' dicatat karena juga mungkin secara leksikal.'
- issue: Bentuk tunggal yang mewakili semua pendengar
  choice: hendaklah dia mendengarkan
  alternative: hendaklah mereka mendengarkan
  rationale: Bahasa sumber memakai bentuk tunggal yang bersifat representatif. Bentuk 'dia' mempertahankan ketunggalan itu, tetapi dalam bahasa Indonesia tidak menetapkan jenis kelamin.
- issue: Nuansa δώσω αὐτῷ φαγεῖν
  choice: Aku akan memberi dia makan
  alternative: Aku akan memberinya hak untuk makan
  rationale: Terjemahan utama mempertahankan bentuk ringkas bahasa Yunani dan tidak menjelaskan secara berlebihan apakah pemberian itu berupa izin, hak, atau kesempatan; makna kausatif 'menyuapi' tidak dimaksudkan oleh konteks.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. 'Siapa yang bertelinga' dipilih sebagai ungkapan ringkas yang mudah dipahami; 'jemaat-jemaat' mempertahankan bentuk jamak; 'Firdaus' memakai huruf kapital sebagai sebutan tempat eskatologis. Penanda catatan kaki [a] hadir tepat setelah frasa yang dijelaskan.
