- from: Siapa yang bertelinga, hendaklah dia mendengarkan apa yang dikatakan Roh kepada jemaat-jemaat. Kepada orang yang menang[a], Aku akan memberi dia makan dari pohon kehidupan yang ada di Firdaus Allah.
  to: Siapa pun yang mempunyai telinga, hendaklah ia mendengarkan apa yang Roh katakan kepada jemaat-jemaat. Kepada orang yang menang[a], Aku akan mengizinkannya makan dari pohon kehidupan yang ada di Firdaus Allah.
