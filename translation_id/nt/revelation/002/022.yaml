  verdict: approve
  source_fidelity: 'Teks Indonesia dengan setia mencerminkan unsur-unsur utama Yunani: interjeksi ἰδοὺ, tindakan penghukuman yang segera/profetis, κλίνη yang tetap harfiah sebagai “tempat tidur,” συμμετοχή dalam μοιχεύω, θλῖψις μεγάλη, serta syarat negatif ἐὰν μὴ μετανοήσωσιν ἐκ τῶν ἔργων αὐτῆς. “Jika mereka tidak bertobat” merupakan padanan yang sah untuk konstruksi “kecuali/jika mereka tidak bertobat.”'
  naturalness: Bahasanya baku, jelas, dan bernada serius sesuai dengan wacana penghukuman dalam Wahyu. “Kesengsaraan besar” dan “orang-orang yang berzina dengannya” terdengar alami dalam register Alkitab Indonesia modern.
  terminology: “Berzina” mempertahankan makna leksikal μοιχεύω tanpa memaksakan pembacaan metaforis. “Tempat tidur” secara tepat tidak menambahkan “sakit” ke dalam teks utama; kemungkinan kontekstual itu ditempatkan dalam catatan kaki. “Perbuatan-perbuatan perempuan itu” secara eksplisit menjaga bahwa perbuatan yang harus ditinggalkan adalah miliknya, bukan perbuatan para pelaku itu sendiri.
