id: REV.2.22
reference: Revelation 2:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἰδοὺ βάλλω αὐτὴν εἰς κλίνην, καὶ τοὺς μοιχεύοντας μετ’ αὐτῆς εἰς θλῖψιν μεγάλην, ἐὰν μὴ ⸀μετανοήσωσιν ἐκ τῶν ἔργων αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/022.yaml
  text: Look[a], I am throwing her onto a bed, and those who commit adultery with her into great affliction[b], unless they repent of her works.
translation:
  language: id
  text: Lihatlah, Aku akan melemparkan dia ke tempat tidur[a], dan orang-orang yang berzina dengannya ke dalam kesengsaraan besar[b], jika mereka tidak bertobat dari perbuatan-perbuatan perempuan itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke pembaringan sakit.” Teks Yunani secara harfiah berbunyi “ke tempat tidur”; dalam konteks ini banyak orang memahaminya sebagai tempat penderitaan atau penyakit dalam penghukuman.
    reason: lexical_alternative
  - marker: b
    text: Atau “ke dalam penderitaan besar” atau “kesusahan besar.” Ungkapan ini menunjuk pada tekanan dan penderitaan yang berat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Lihatlah
  rationale: Interjeksi penarik perhatian ini diterjemahkan dengan bentuk yang jelas dan bermartabat dalam bahasa Indonesia modern.
- source_word: βάλλω
  choice: Aku akan melemparkan
  rationale: Bentuk kini Yunani memiliki daya profetis dan menunjuk pada tindakan penghukuman yang segera; bentuk futur bahasa Indonesia menyampaikan maksud itu secara alami.
- source_word: αὐτὴν εἰς κλίνην
  choice: dia ke tempat tidur
  rationale: κλίνη secara harfiah berarti tempat tidur atau pembaringan. Teks utama mempertahankan makna leksikal tanpa langsung menafsirkannya sebagai ranjang orang sakit.
- source_word: τοὺς μοιχεύοντας μετ’ αὐτῆς
  choice: orang-orang yang berzina dengannya
  rationale: Terjemahan ini mempertahankan tindakan perzinaan yang dinyatakan secara eksplisit oleh μοιχεύω dan tidak menutup kemungkinan adanya daya simbolis dalam konteks Wahyu.
- source_word: εἰς θλῖψιν μεγάλην
  choice: ke dalam kesengsaraan besar
  rationale: θλῖψις menunjuk pada tekanan, penderitaan, atau kesusahan berat. 'Kesengsaraan' menyampaikan bobot tersebut tanpa harus menetapkan suatu skema eskatologis tertentu.
- source_word: ἐὰν μὴ μετανοήσωσιν
  choice: jika mereka tidak bertobat
  rationale: Bentuk ini secara langsung mempertahankan susunan syarat negatif Yunani dan terdengar alami dalam bahasa Indonesia.
- source_word: ἐκ τῶν ἔργων αὐτῆς
  choice: dari perbuatan-perbuatan perempuan itu
  rationale: ἐκ menonjolkan tindakan berbalik meninggalkan perbuatan tersebut. 'Perempuan itu' memperjelas rujukan αὐτῆς tanpa menimbulkan kesan bahwa perbuatan itu milik para pelaku yang disebut sebagai subjek.
theological_decisions:
- issue: Apakah κλίνη harus ditafsirkan secara eksplisit sebagai tempat tidur orang sakit dalam penghukuman
  choice: Mempertahankan 'tempat tidur' dalam teks utama
  alternative: tempat tidur orang sakit; pembaringan sakit
  rationale: Konteksnya memang menyatakan penghukuman dan dapat menyiratkan penyakit atau penderitaan, tetapi κλίνη sendiri tidak mengharuskan arti itu. Kemungkinan tersebut dijaga dalam catatan kaki.
- issue: Apakah μοιχεύοντας merujuk pada perzinaan harfiah, ketidaksetiaan rohani secara metaforis, atau keduanya
  choice: Menerjemahkan dengan arti leksikal 'berzina' dan membiarkan dimensi simbolis tetap tersirat
  alternative: melakukan percabulan dengannya; tidak setia bersama dia
  rationale: μοιχεύω secara langsung berarti berzina. Terjemahan konkret mempertahankan gambaran teks dan tidak meniadakan kemungkinan makna rohani dalam konteks simbolis Wahyu.
- issue: Rujukan subjek dalam syarat pertobatan
  choice: Mempertahankan bentuk jamak 'mereka' sebagai orang-orang yang berzina dengannya
  alternative: Menganggap syarat itu mencakup perempuan tersebut juga
  rationale: Bentuk μετανοήσωσιν adalah jamak dan secara tata bahasa paling dekat merujuk kepada kelompok τοὺς μοιχεύοντας, sedangkan 'perbuatan-perbuatan perempuan itu' tetap menjadi hal yang harus mereka tinggalkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Huruf kapital pada 'Aku' mengikuti rujukan kepada Kristus. Pengulangan 'perbuatan-perbuatan' mempertahankan bentuk jamak sumber, sedangkan 'perempuan itu' dipakai untuk memperjelas anteseden tanpa mengubah hubungan gramatikal.
