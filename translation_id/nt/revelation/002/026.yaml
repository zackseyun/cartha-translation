  text: καὶ ὁ νικῶν καὶ ὁ τηρῶν ἄχρι τέλους τὰ ἔργα μου, δώσω αὐτῷ ἐξουσίαν ἐπὶ τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/026.yaml
  text: And to the one who conquers and keeps my works until the end[a], I will give authority over the nations[c][b],
translation:
  language: id
  text: Dan orang yang menang dan yang tetap melakukan pekerjaan-pekerjaan-Ku[b] sampai akhir[a], kepadanya akan Kuberikan wewenang atas bangsa-bangsa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menjaga pekerjaan-pekerjaan-Ku sampai akhir.” Kata Yunani yang diterjemahkan “tetap melakukan” juga dapat berarti “memegang teguh” atau “menaati.”
    reason: lexical_alternative
  - marker: b
    text: “Pekerjaan-pekerjaan-Ku” dapat berarti pekerjaan yang menjadi milik Yesus atau yang sesuai dengan perbuatan, tujuan, maupun kehendak-Nya; bahasa Yunani tidak memperinci hubungan itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: orang yang menang
  rationale: Partisipel kini berartikel berfungsi sebagai nomina dan menggambarkan orang yang terus dicirikan oleh kemenangan. Pilihan ini mempertahankan citra pergumulan yang kuat dalam kitab Wahyu.
- source_word: ὁ τηρῶν
  choice: tetap melakukan
  rationale: Dalam konteks perbuatan, τηρέω menunjuk pada memegang teguh atau menaati secara berkelanjutan. 'Tetap melakukan' terdengar alami dalam bahasa Indonesia dan menyampaikan ketekunan tanpa mengubahnya menjadi sekadar tindakan menjaga.
- source_word: ἄχρι τέλους
  choice: sampai akhir
  rationale: Ungkapan temporal ini menandakan ketekunan hingga titik akhir dan diterjemahkan secara langsung serta alami.
- source_word: τὰ ἔργα μου
  choice: pekerjaan-pekerjaan-Ku
  rationale: Bentuk jamak dan hubungan posesif dipertahankan agar relasi yang tidak diperinci dalam bahasa Yunani—pekerjaan milik, selaras dengan, atau dituntut oleh Yesus—tidak dipersempit.
- source_word: δώσω αὐτῷ
  choice: kepadanya akan Kuberikan
  rationale: Susunan ini mempertahankan penerima tunggal yang disebut secara eksplisit oleh αὐτῷ dan terdengar wajar serta khidmat dalam bahasa Indonesia.
- source_word: ἐξουσίαν
  choice: wewenang
  rationale: ἐξουσία di sini terutama menunjuk pada hak atau otoritas yang diberikan untuk memerintah, bukan sekadar kemampuan atau kekuatan.
- source_word: ἐπὶ τῶν ἐθνῶν
  choice: atas bangsa-bangsa
  rationale: Dengan genitif, ἐπί menyatakan lingkup pemerintahan. ἔθνη dalam konteks ini paling wajar berarti bangsa-bangsa dunia, bukan khusus orang bukan Yahudi.
theological_decisions:
- issue: Bahasa maskulin tunggal yang representatif
  choice: orang yang ... kepadanya
  alternative: barangsiapa ... kepadanya / mereka yang ... kepada mereka
  rationale: Bahasa Indonesia tidak menandai gender pada bentuk ini. Bentuk tunggal Yunani tetap dipertahankan melalui 'orang' dan '-nya', tanpa memberi kesan bahwa janji ini hanya untuk laki-laki.
- issue: Makna τὰ ἔργα μου
  choice: pekerjaan-pekerjaan-Ku
  alternative: perintah-perintah-Ku / pekerjaan yang Kukehendaki
  rationale: Genitif Yunani tidak menentukan apakah yang dimaksud ialah pekerjaan yang dilakukan Yesus, yang selaras dengan-Nya, atau yang Ia tuntut. Terjemahan harfiah mempertahankan ambiguitas dan ketegangan teologis itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Kapital pada enklitik ilahi dalam 'pekerjaan-pekerjaan-Ku' dan 'Kuberikan' mengikuti kebiasaan penulisan Alkitab Indonesia. Bentuk tunggal dipertahankan secara alami tanpa penandaan gender.
