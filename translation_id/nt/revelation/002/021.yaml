id: REV.2.21
reference: Revelation 2:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἔδωκα αὐτῇ χρόνον ἵνα μετανοήσῃ, καὶ οὐ θέλει μετανοῆσαι ἐκ τῆς πορνείας αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/021.yaml
  text: And I gave her time to repent[a], but she is not willing to repent of her sexual immorality.
translation:
  language: id
  text: Aku telah memberi dia waktu untuk bertobat, tetapi dia tidak mau bertobat dari percabulannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδωκα
  choice: Aku telah memberi
  rationale: Aoristus menyatakan tindakan pemberian yang telah dilakukan; bentuk perfektif bahasa Indonesia terdengar alami dalam konteks kesempatan yang sudah diberikan dan masih relevan bagi teguran ini.
- source_word: αὐτῇ
  choice: dia
  rationale: Pronomina datif feminin merujuk kepada perempuan yang secara simbolis disebut Izebel dalam konteks sebelumnya; bahasa Indonesia tidak membedakan gender pada pronomina orang ketiga.
- source_word: χρόνον
  choice: waktu
  rationale: χρόνος berarti waktu atau suatu rentang waktu; 'waktu' alami dan mempertahankan gagasan kesempatan yang diberikan tanpa mengubah nomina menjadi tafsiran eksplisit.
- source_word: ἵνα μετανοήσῃ
  choice: untuk bertobat
  rationale: Konstruksi ἵνα dengan subjungtif menyatakan tujuan; 'memberi ... waktu untuk bertobat' merupakan ungkapan Indonesia yang alami dan tepat.
- source_word: οὐ θέλει
  choice: tidak mau
  rationale: θέλω di sini menyatakan kehendak atau kemauan. 'Tidak mau' mempertahankan unsur ketidakbersediaan tanpa memperkuatnya menjadi penolakan mutlak.
- source_word: μετανοῆσαι
  choice: bertobat
  rationale: Infinitif melengkapi θέλει; pengulangan 'bertobat' mempertahankan penekanan dalam teks Yunani.
- source_word: ἐκ τῆς πορνείας αὐτῆς
  choice: dari percabulannya
  rationale: ἐκ secara harfiah berarti 'dari/keluar dari', sehingga cocok dengan gambaran berbalik meninggalkan dosa. πορνεία menunjuk pada perilaku seksual yang tidak bermoral; 'percabulan' merupakan padanan Indonesia yang ringkas, konkret, dan lazim dalam ragam Alkitab yang tetap dapat dipahami pembaca modern.
theological_decisions:
- issue: Makna πορνεία dalam teguran apokaliptik
  choice: percabulannya
  alternative: perbuatan seksualnya yang tidak bermoral; perzinaan rohaninya
  rationale: Padanan konkret mempertahankan makna leksikal utama tanpa memutuskan apakah konteks juga mengandung kiasan tentang penyembahan berhala. Nuansa simbolis tetap dapat muncul dari konteks Kitab Wahyu.
- issue: Hubungan pertobatan dengan ἐκ
  choice: bertobat dari percabulannya
  alternative: menyesali percabulannya
  rationale: Terjemahan dengan 'dari' mempertahankan metafora gerak menjauh yang dinyatakan ἐκ dan tidak menyempitkan pertobatan menjadi sekadar rasa sesal.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. 'Aku' mengikuti suara langsung Kristus dalam konteks. Pengulangan 'bertobat' dipertahankan demi penekanan, sedangkan 'tidak mau' menyampaikan volisi dengan jelas kepada pembaca umum.
