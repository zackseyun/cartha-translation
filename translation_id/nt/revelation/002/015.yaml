  text: οὕτως ἔχεις καὶ σὺ κρατοῦντας τὴν ⸀διδαχὴν Νικολαϊτῶν ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/015.yaml
  text: So you also have those who hold to the teaching of the Nicolaitans likewise[a].
translation:
  language: id
  text: Demikian juga, kamu pun mempunyai orang-orang yang berpegang pada ajaran kaum Nikolaus dengan cara yang sama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “secara serupa.” Frasa Yunani “dengan cara yang sama” dapat menunjuk pada cara mereka berpegang pada ajaran itu atau, lebih luas, membandingkan keadaan ini dengan orang-orang yang disebut dalam ayat sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Demikian juga
  rationale: Menghubungkan teguran ini dengan ayat sebelumnya dan mempertahankan daya perbandingan οὕτως secara alami dalam bahasa Indonesia.
- source_word: ἔχεις καὶ σὺ
  choice: di antaramu ada
  rationale: Secara kontekstual menyatakan bahwa jemaat di Pergamus mempunyai orang-orang semacam itu di tengah mereka; ungkapan ini alami dan tetap mempertahankan sapaan langsung tersirat kepada jemaat.
- source_word: κρατοῦντας
  choice: orang-orang yang berpegang pada
  rationale: Menunjukkan tindakan mempertahankan atau menganut suatu ajaran tanpa menambahkan intensitas yang tidak pasti.
- source_word: τὴν διδαχὴν
  choice: ajaran
  rationale: Padanan modern dan wajar untuk διδαχή, tanpa nuansa teknis berlebihan.
- source_word: Νικολαϊτῶν
  choice: kaum Nikolaus
  rationale: Mentransliterasikan nama kelompok dalam bentuk yang mudah dipahami pembaca Indonesia; 'kaum' menandai kelompok penganut.
- source_word: ὁμοίως
  choice: dengan cara yang sama
  rationale: Mempertahankan daya komparatif adverbia dan kaitannya dengan keadaan yang disebut dalam ayat sebelumnya, tanpa menentukan secara mutlak lingkup modifikasinya.
theological_decisions:
- issue: Lingkup ὁμοίως dalam kalimat
  choice: Menempatkan 'dengan cara yang sama' pada akhir kalimat.
  alternative: '''Demikian pula, di antaramu ada orang-orang yang berpegang pada ajaran kaum Nikolaus.'''
  rationale: Posisi akhir mengikuti susunan Yunani dan membiarkan frasa itu dapat menunjuk pada cara mereka berpegang maupun pada perbandingan yang lebih luas dengan ayat 14.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Pilihan 'di antaramu ada' menghindari kekakuan terjemahan harfiah 'engkau mempunyai', sedangkan 'dengan cara yang sama' mempertahankan ambiguitas hubungan ὁμοίως.
