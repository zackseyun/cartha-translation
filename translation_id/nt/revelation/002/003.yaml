base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/003.yaml
  text: And you have endurance[a], and have borne up for my name[b], and have not grown weary.
translation:
  language: id
  text: Engkau memiliki ketekunan dan telah bertahan demi nama-Ku, serta tidak menjadi lelah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “menjadi lelah” juga dapat berarti “berjerih lelah”; klausa ini dapat pula dipahami, “engkau tidak menjadi lelah dalam jerih lelahmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονὴν
  choice: ketekunan
  rationale: Dalam konteks ujian, ὑπομονή menunjuk pada ketabahan yang terus bertahan. “Ketekunan” alami dalam bahasa Indonesia dan tidak membatasi nuansanya pada kesabaran pasif.
- source_word: ἔχεις
  choice: engkau memiliki
  rationale: Menerjemahkan bentuk kini secara langsung dan mempertahankan pujian bahwa jemaat itu sekarang memiliki ketekunan.
- source_word: ἐβάστασας
  choice: telah bertahan
  rationale: βαστάζω dapat berarti membawa, menanggung, atau bertahan. Dalam konteks ini, “telah bertahan” menyampaikan tindakan menanggung kesukaran tanpa mengulang kata “ketekunan”.
- source_word: διὰ τὸ ὄνομά μου
  choice: demi nama-Ku
  rationale: διά dengan akusatif di sini dapat menyatakan alasan atau kepentingan. “Demi nama-Ku” mempertahankan ungkapan alkitabiah tentang kesetiaan kepada nama Yesus, sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: οὐ κεκοπίακες
  choice: tidak menjadi lelah
  rationale: κοπιάω dapat berarti berjerih lelah atau menjadi lelah. Dengan negasi dan paralelisme tentang ketekunan, frasa ini paling alami dipahami sebagai tidak menyerah karena kelelahan; bentuk perfektum menyiratkan keadaan yang berlanjut.
theological_decisions:
- issue: Makna bahasa ketekunan dan penderitaan dalam pujian ini
  choice: Ayat ini memuji ketekunan yang terus berlangsung dan kesediaan menanggung kesukaran demi nama Yesus, tanpa menentukan bentuk penganiayaan atau pekerjaan tertentu.
  alternative: 'Klausa terakhir dapat dikaitkan lebih khusus dengan jerih lelah: “engkau tidak menjadi lelah karena bekerja keras.”'
  rationale: Terjemahan mempertahankan pujian dalam teks dan tidak memasukkan gagasan khusus tentang penganiayaan, pelayanan, atau upah yang tidak dinyatakan oleh bahasa Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal “engkau”, sesuai penerima tunggal gramatikal dalam amanat kepada malaikat jemaat. Susunan kalimat dibuat alami dan bermartabat, sementara tiga unsur pujian dalam bahasa Yunani tetap dipertahankan.
