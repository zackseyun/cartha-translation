id: REV.2.14
reference: Revelation 2:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλὰ ἔχω κατὰ σοῦ ὀλίγα, ὅτι ἔχεις ἐκεῖ κρατοῦντας τὴν διδαχὴν Βαλαάμ, ὃς ⸂ἐδίδασκεν τῷ⸃ Βαλὰκ βαλεῖν σκάνδαλον ἐνώπιον τῶν υἱῶν Ἰσραήλ, ⸀φαγεῖν εἰδωλόθυτα καὶ πορνεῦσαι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/014.yaml
  text: 'But I have a few things against you: you have there some who hold to the teaching of Balaam[a], who taught Balak to put a stumbling block before the sons of Israel, to eat food sacrificed to idols and to commit sexual immorality.'
translation:
  language: id
  text: 'Namun, Aku mempunyai beberapa keberatan terhadapmu: di situ ada beberapa orang yang berpegang pada ajaran Bileam, yang mengajarkan kepada Balak untuk menaruh batu sandungan di hadapan anak-anak Israel[a], supaya mereka makan makanan yang dipersembahkan kepada berhala dan melakukan percabulan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang Israel” atau “umat Israel.” Secara harfiah, bahasa Yunani berbunyi “putra-putra Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλίγα
  choice: beberapa hal
  rationale: Adjektiva netral jamak ini dipakai secara substantival. “Beberapa hal” menyatakan objek tersirat secara alami tanpa memperluas maknanya.
- source_word: κρατοῦντας τὴν διδαχὴν
  choice: berpegang pada ajaran
  rationale: Dalam konteks ini κρατέω menyatakan kesetiaan atau keterikatan pada suatu ajaran, bukan tindakan memegang secara fisik.
- source_word: Βαλαάμ / Βαλὰκ
  choice: Bileam / Balak
  rationale: Mengikuti bentuk nama Alkitab yang sudah lazim dalam bahasa Indonesia.
- source_word: ἐδίδασκεν τῷ Βαλὰκ
  choice: mengajar Balak
  rationale: Bentuk imperfek dipahami sebagai tindakan Bileam dalam kisah lampau; bahasa Indonesia tidak wajib menandai aspek berlangsung, dan bentuk sederhana lebih alami di sini.
- source_word: βαλεῖν σκάνδαλον
  choice: menaruh batu sandungan
  rationale: Mempertahankan metafora sumber mengenai sesuatu yang menyebabkan kejatuhan moral atau rohani; ungkapan ini juga dapat dipahami dalam bahasa Indonesia.
- source_word: ἐνώπιον
  choice: di hadapan
  rationale: Padanan ringkas dan bermartabat yang sesuai dengan metafora “menaruh batu sandungan”.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: anak-anak Israel
  rationale: Mempertahankan sebutan komunal tradisional yang dekat dengan bentuk Yunani, sementara catatan kaki menjelaskan bentuk harfiah dan alternatif idiomatisnya.
- source_word: φαγεῖν εἰδωλόθυτα
  choice: supaya mereka makan makanan yang dipersembahkan kepada berhala
  rationale: εἰδωλόθυτα menunjuk pada makanan yang telah dipersembahkan dalam ibadah berhala. “Supaya mereka” mengungkapkan hubungan tujuan yang tersirat secara alami dalam bahasa Indonesia.
- source_word: πορνεῦσαι
  choice: melakukan percabulan
  rationale: Menyampaikan perilaku seksual terlarang dengan istilah Indonesia yang jelas, bermartabat, dan memiliki daya moral yang sepadan.
theological_decisions:
- issue: Cara menerjemahkan τῶν υἱῶν Ἰσραήλ
  choice: anak-anak Israel
  alternative: orang Israel; umat Israel; secara harfiah, putra-putra Israel
  rationale: Ungkapan utama mempertahankan bentuk komunal Alkitabiah yang dekat dengan sumber tanpa memaksakan bahwa hanya laki-laki yang dimaksud. Catatan kaki menjaga bentuk harfiah dan pilihan idiomatis.
- issue: Apakah σκάνδαλον diterjemahkan sebagai metafora atau ditafsirkan secara dinamis
  choice: batu sandungan
  alternative: jerat; sesuatu yang menyebabkan mereka berdosa
  rationale: Metafora sumber dapat dipahami dalam bahasa Indonesia dan mempertahankan ketegangan antara godaan, perangkap, dan penyebab kejatuhan tanpa membatasinya pada satu tafsiran.
- issue: Hubungan dua infinitif φαγεῖν dan πορνεῦσαι dengan batu sandungan
  choice: supaya mereka makan ... dan melakukan ...
  alternative: yaitu makan ... dan melakukan ...
  rationale: Bacaan utama menyatakan tujuan atau akibat yang dimaksud dalam nasihat Bileam kepada Balak, sambil mempertahankan kedua tindakan sebagai isi konkret batu sandungan tersebut.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada bermartabat dan langsung. Pronomina ilahi ditulis dengan huruf kapital sesuai konvensi Indonesia. Nama Bileam dan Balak mengikuti bentuk yang telah mapan dalam tradisi Alkitab bahasa Indonesia.
