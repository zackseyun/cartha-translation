    rationale: Elipsis Yunani dapat dipahami dari konteks, tetapi dalam bahasa Indonesia frasa itu berpotensi tidak lengkap atau kurang jelas. “Padahal mereka bukan rasul” menyatakan predikat yang dimaksud tanpa tambahan makna.
  - severity: low
    issue: Catatan a menerangkan “tidak dapat” sebagai “tidak mau.”
    rationale: Penjelasan kontekstual tentang penolakan/tidak menoleransi memang tepat, tetapi “tidak mau” menambahkan unsur kehendak yang tidak dinyatakan oleh οὐ δύνῃ.
