  verdict: revise
  source_fidelity: Draf secara umum mencerminkan seluruh unsur teks Yunani, termasuk kerja keras, ketekunan, penolakan terhadap orang jahat, pengujian pengaku rasul, dan hasil bahwa mereka ψευδεῖς. Namun, pengulangan eksplisit “Aku tahu” membagi satu konstruksi Οἶδα yang semula menguasai semua objek dan klausa menjadi dua pernyataan pengetahuan. Ini tidak perlu dan sedikit mengubah pengemasan retoris sumber. Frasa “padahal bukan” juga perlu melengkapi predikatnya menjadi “bukan rasul” agar rujukan eliptis Yunani jelas dalam bahasa Indonesia.
  naturalness: Bahasa draf umumnya baku dan jelas. Kalimat tunggal dengan daftar yang terkoordinasi tetap alami dalam bahasa Indonesia dan lebih dekat dengan struktur sumber. “Orang-orang jahat” dan “tidak dapat menoleransi” wajar dalam register ini. “Mereka palsu” dapat dipertahankan sebagai predikat penilaian, tetapi “ternyata palsu” membuat hasil pengujian lebih idiomatis tanpa mengubah cakupan adjektiva Yunani.
  terminology: “Jerih payah,” “ketekunan,” “rasul,” dan “menguji” merupakan pilihan yang tepat. “Rasul” mempertahankan kemungkinan besar fungsi teknis ἀποστόλους dalam konteks jemaat tanpa memaksakan pemahaman kelembagaan kemudian. Catatan a harus tidak menggeser “tidak dapat” menjadi semata-mata “tidak mau.”
