  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οἶδα τὰ ἔργα σου, καὶ τὸν ⸀κόπον καὶ τὴν ὑπομονήν σου, καὶ ὅτι οὐ δύνῃ βαστάσαι κακούς, καὶ ἐπείρασας τοὺς λέγοντας ἑαυτοὺς ⸀ἀποστόλους, καὶ οὐκ εἰσίν, καὶ εὗρες αὐτοὺς ψευδεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/002.yaml
  text: I know your works[a], your labor, and your endurance, and that you cannot tolerate evil people. You tested those who call themselves apostles and are not[b], and you found them to be false.
translation:
  language: id
  text: Aku tahu perbuatan-perbuatanmu, jerih payahmu, ketekunanmu, dan bahwa engkau tidak dapat menoleransi orang-orang jahat[a]. Engkau telah menguji orang-orang yang menyebut diri mereka rasul, padahal mereka bukan rasul[b], dan mendapati bahwa mereka ternyata palsu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “tidak dapat menanggung orang-orang jahat”; dalam konteks ini maksudnya ialah tidak menoleransi mereka.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “orang-orang yang mengaku sebagai rasul.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδα
  choice: Aku tahu
  rationale: Padanan langsung dan alami bagi verba keadaan kini yang menyatakan pengetahuan Kristus serta penilaian-Nya terhadap jemaat.
- source_word: τὰ ἔργα σου
  choice: perbuatan-perbuatanmu
  rationale: Mencakup tindakan dan kegiatan secara luas; bentuk ulang alami dalam bahasa Indonesia untuk nomina jamak ini.
- source_word: τὸν κόπον
  choice: jerih payahmu
  rationale: Mengungkapkan kerja keras yang melelahkan, bukan sekadar pekerjaan biasa.
- source_word: τὴν ὑπομονήν σου
  choice: ketekunanmu
  rationale: Menyampaikan kegigihan yang tetap bertahan di bawah tekanan dalam ungkapan Indonesia yang ringkas dan wajar.
- source_word: οὐ δύνῃ βαστάσαι
  choice: tidak dapat menoleransi
  rationale: Dalam konteks penilaian moral dan jemaat, βαστάσαι bermakna menanggung atau membiarkan keberadaan pihak jahat; 'menoleransi' menyampaikan maksud kontekstual tanpa memberi kesan sekadar tidak tahan secara emosional.
- source_word: κακούς
  choice: orang-orang jahat
  rationale: Adjektiva maskulin jamak dipakai secara substantival untuk orang; padanan ini menyatakan rujukan personal tanpa membatasi jenis kelamin.
- source_word: ἐπείρασας
  choice: telah menguji
  rationale: Menunjukkan pemeriksaan terhadap kebenaran pengakuan mereka, selaras dengan makna πειράζω dalam konteks ini.
- source_word: λέγοντας ἑαυτοὺς ἀποστόλους
  choice: orang-orang yang menyebut diri rasul
  rationale: Mempertahankan unsur refleksif ἑαυτούς dan sifat pengakuan status oleh diri sendiri.
- source_word: ἀποστόλους
  choice: rasul
  rationale: Dalam konteks jemaat, kemungkinan besar merupakan sebutan bagi utusan berotoritas, bukan sekadar pembawa pesan biasa.
- source_word: ψευδεῖς
  choice: palsu
  rationale: Mempertahankan bentuk adjektival yang menilai diri atau pengakuan mereka tidak sejati; 'pendusta' akan lebih langsung menekankan tindakan berbohong.
theological_decisions:
- issue: Status pihak yang mengaku sebagai ἀποστόλους
  choice: rasul
  alternative: utusan
  rationale: Konteks pengujian di dalam jemaat mendukung pengertian gelar atau peran kerasulan. Pilihan ini mempertahankan bobot klaim mereka tanpa memasukkan struktur kelembagaan yang lebih kemudian.
- issue: Cakupan gender κακούς
  choice: orang-orang jahat
  alternative: laki-laki jahat
  rationale: Bentuk maskulin Yunani berfungsi substantival dan tidak mengharuskan pembatasan rujukan hanya kepada laki-laki.
- issue: Sifat kepalsuan para pengaku rasul
  choice: mereka palsu
  alternative: mereka pendusta
  rationale: ψευδεῖς secara langsung adalah adjektiva 'palsu/tidak benar'. Terjemahan utama tidak mempersempitnya hanya pada tindakan berdusta, sehingga kepalsuan status dan perkataan tetap tercakup.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal 'engkau' yang sesuai dengan alamat kepada malaikat jemaat. Kalimat pertama Yunani dibagi agar rangkaian panjang tetap jelas bagi pembaca umum; pengulangan 'Aku tahu' membuat hubungan sintaksis eksplisit tanpa mengubah isi. Nada dipertahankan tegas, bermartabat, dan tidak terikat pada istilah denominasi tertentu.
