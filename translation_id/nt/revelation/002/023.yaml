id: REV.2.23
reference: Revelation 2:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ τὰ τέκνα αὐτῆς ἀποκτενῶ ἐν θανάτῳ· καὶ γνώσονται πᾶσαι αἱ ἐκκλησίαι ὅτι ἐγώ εἰμι ὁ ἐραυνῶν νεφροὺς καὶ καρδίας, καὶ δώσω ὑμῖν ἑκάστῳ κατὰ τὰ ἔργα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/023.yaml
  text: And I will kill her children with death[a], and all the churches will know that I am the one who searches hearts and minds[b], and I will give to each of you according to your works.
translation:
  language: id
  text: Dan anak-anaknya akan Kubunuh dengan kematian[a], dan semua jemaat akan tahu bahwa Akulah yang menyelidiki batin dan hati[b], dan Aku akan membalas setiap orang di antara kalian sesuai dengan perbuatan masing-masing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan wabah”. Secara harfiah bahasa Yunani berbunyi “dengan kematian”, suatu ungkapan yang mungkin menegaskan kerasnya hukuman atau menggemakan bahasa penghakiman dalam Perjanjian Lama.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ginjal dan hati”, sebuah ungkapan Alkitab tentang diri manusia yang terdalam, termasuk dorongan, pikiran, dan keinginannya.
    reason: cultural_note
lexical_decisions:
- source_word: τέκνα
  choice: anak-anak
  rationale: Padanan langsung yang tetap membuka kemungkinan bahwa yang dimaksud adalah anak biologis ataupun para pengikutnya secara kiasan.
- source_word: ἀποκτενῶ
  choice: akan Kubunuh
  rationale: Menyampaikan secara langsung tindakan membunuh dalam bentuk orang pertama tunggal dan bernada penghakiman.
- source_word: ἐν θανάτῳ
  choice: dengan kematian
  rationale: Mempertahankan ungkapan Yunani yang tidak lazim serta gema bahasa penghakiman dalam Kitab Suci; tafsiran 'wabah' dicatat sebagai alternatif.
- source_word: γνώσονται
  choice: akan tahu
  rationale: Secara alami menyatakan pengetahuan atau pengakuan yang timbul sebagai akibat penghakiman tersebut.
- source_word: ἐκκλησίαι
  choice: jemaat
  rationale: Dalam konteks Wahyu, istilah ini menunjuk pada persekutuan-persekutuan Kristen; 'jemaat' merupakan padanan Indonesia yang lazim.
- source_word: ὁ ἐραυνῶν
  choice: yang menyelidiki
  rationale: Mempertahankan gagasan pemeriksaan mendalam yang berlangsung sebagai ciri Sang Pembicara.
- source_word: νεφροὺς
  choice: batin
  rationale: Secara harfiah berarti 'ginjal', tetapi dalam idiom Alkitab menunjuk pada bagian terdalam manusia, termasuk dorongan dan perasaan tersembunyi. 'Batin' menyampaikan makna itu tanpa menimbulkan salah paham anatomis.
- source_word: καρδίας
  choice: hati
  rationale: Mempertahankan metafora Alkitab yang lazim untuk pusat pikiran, kehendak, dan keinginan.
- source_word: δώσω
  choice: Aku akan membalas
  rationale: Walaupun secara dasar berarti 'memberikan', dalam rumus penghakiman bersama frasa 'sesuai dengan perbuatan' kata ini bermakna memberi ganjaran atau balasan; 'membalas' terdengar alami dalam bahasa Indonesia.
- source_word: ὑμῖν ἑκάστῳ
  choice: setiap orang di antara kalian
  rationale: Menyampaikan daya distributif ἑκάστῳ sekaligus bentuk jamak orang kedua ὑμῖν secara jelas dan alami.
- source_word: κατὰ τὰ ἔργα ὑμῶν
  choice: sesuai dengan perbuatannya
  rationale: Menyampaikan tolok ukur pembalasan berdasarkan tindakan masing-masing; akhiran tunggal selaras dengan 'setiap orang'.
theological_decisions:
- issue: Identitas Sang Pembicara sebagai penyelidik manusia batiniah
  choice: Mempertahankan pernyataan tegas 'Akulah yang menyelidiki batin dan hati'.
  alternative: Melunakkannya menjadi sekadar mengetahui atau mengamati manusia.
  rationale: Bahasa Yunani menampilkan pengenalan diri yang kuat dan kewenangan menghakimi berdasarkan pengetahuan atas diri manusia yang terdalam.
- issue: Makna 'anak-anaknya'
  choice: Membiarkan ungkapan tersebut terbuka bagi makna harfiah atau kiasan.
  alternative: Menentukannya secara eksplisit sebagai anak biologis atau sebagai para pengikut.
  rationale: τέκνα sendiri tidak memaksa salah satu penafsiran, meskipun konteks dapat mengarah pada para pengikut tokoh yang disebut Izebel.
- issue: Makna ἐν θανάτῳ
  choice: Mempertahankan 'dengan kematian' dalam teks utama.
  alternative: Menafsirkan langsung sebagai 'dengan wabah'.
  rationale: Ungkapan Yunani sengaja keras dan mungkin menggemakan bahasa penghakiman Perjanjian Lama; terjemahan utama tidak seharusnya menutup kemungkinan maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'Kubunuh' dan 'Akulah' mempertahankan tekanan orang pertama. 'Kalian' dipakai agar bentuk jamak ὑμῖν jelas; 'jemaat' dipilih daripada 'gereja-gereja' karena konteks menunjuk pada komunitas orang percaya.
