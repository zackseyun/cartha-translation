  verdict: revise
  source_fidelity: Teks ini pada umumnya setia kepada Yunani. Ungkapan ἐν θανάτῳ dipertahankan secara harfiah dan catatan kaki dengan tepat menyebutkan kemungkinan “wabah.” Namun, “Dengan demikian” menambahkan hubungan inferensial yang tidak dinyatakan oleh καί, dan “perbuatannya” dapat mengaburkan bentuk jamak ἔργα ὑμῶν serta hubungan distributifnya.
  naturalness: Bahasa Indonesia baku, jelas, dan bernada khidmat. “Anak-anaknya akan Kubunuh dengan kematian” mempertahankan kekerasan dan ketidaklaziman yang disengaja dari ungkapan sumber. “Batin dan hati” dapat dipahami secara alami sebagai ungkapan untuk manusia batiniah.
  terminology: “Jemaat,” “hati,” dan “perbuatan” sesuai dengan register Alkitab bahasa Indonesia. “Batin” merupakan padanan idiomatis yang memadai untuk νεφρούς, dengan arti harfiahnya dijelaskan dalam catatan kaki. Bentuk “Aku akan membalas” tepat dalam konteks penghakiman, meskipun δώσω secara leksikal berarti “akan memberi.”
  issues:
  - severity: low
    issue: Tambahan “Dengan demikian”
    rationale: Konjungsi καί hanya menghubungkan klausa; “Dengan demikian” secara eksplisit menambahkan nuansa akibat/inferensi. Hubungan hasil memang tersirat dalam konteks, tetapi tidak perlu ditambahkan ke teks utama.
  - severity: medium
    issue: “sesuai dengan perbuatannya”
    rationale: Yunani berbunyi κατὰ τὰ ἔργα ὑμῶν, dengan “perbuatan” dan “kalian” berbentuk jamak, sementara ἑκάστῳ menyatakan pembalasan secara distributif. “Sesuai dengan perbuatan masing-masing” menyampaikan kedua unsur itu lebih jelas dan alami.
