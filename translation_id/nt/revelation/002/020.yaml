    issue: Padanan ἔχω κατὰ σοῦ
    rationale: '''Aku menentangmu dalam hal ini'' mengubah idiom keluhan/tuduhan menjadi tindakan menentang. ''Aku keberatan terhadapmu karena ...'' menyampaikan force sumber dengan lebih tepat.'
  - severity: low
    issue: Nuansa 'supaya'
    rationale: Infinitif πορνεῦσαι dan φαγεῖν bergantung pada πλανᾷ dan menyatakan apa yang mereka disesatkan untuk lakukan. 'Sehingga' menghindari pembacaan tujuan yang terlalu kuat.
  - severity: low
    issue: Padanan πορνεῦσαι
    rationale: '''Melakukan percabulan'' lebih jelas dalam penggunaan Indonesia modern daripada ''berbuat cabul'', sambil tetap memakai register yang pantas.'
  - severity: low
    issue: Kejelasan catatan c
    rationale: Alternatif 'membuat ... menyimpang' tidak lengkap secara sintaksis. 'Menyesatkan' atau 'membawa ke jalan yang sesat' menyediakan alternatif yang utuh.
