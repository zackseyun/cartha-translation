id: REV.2.20
reference: Revelation 2:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλὰ ἔχω κατὰ σοῦ ὅτι ἀφεῖς τὴν ⸀γυναῖκα Ἰεζάβελ, ἡ ⸀λέγουσα ἑαυτὴν προφῆτιν, καὶ διδάσκει καὶ πλανᾷ τοὺς ἐμοὺς δούλους πορνεῦσαι καὶ φαγεῖν εἰδωλόθυτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/020.yaml
  text: 'But I have this against you: you tolerate the woman Jezebel[c][b][a], who calls herself a prophetess and teaches and deceives my servants to commit sexual immorality and to eat food sacrificed to idols.'
translation:
  language: id
  text: Namun, Aku keberatan terhadapmu karena engkau membiarkan perempuan Izebel[a], yang menyebut dirinya nabiah[b], mengajar dan menyesatkan[c] hamba-hamba-Ku sehingga melakukan percabulan dan memakan makanan yang dipersembahkan kepada berhala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah berbunyi “istrimu Izebel”, bukan “perempuan Izebel”.
    reason: textual_variant
  - marker: b
    text: 'Atau: “yang mengaku sebagai nabiah”.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “membawa ke jalan yang sesat”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Namun
  rationale: Menandai pertentangan tajam dengan pujian sebelumnya secara alami dalam bahasa Indonesia.
- source_word: ἔχω κατὰ σοῦ
  choice: Aku menentangmu dalam hal ini
  rationale: Mengungkapkan idiom tuduhan atau keberatan dengan jelas dan wajar.
- source_word: ἀφεῖς
  choice: engkau membiarkan
  rationale: Dalam konteks ini berarti mengizinkan keadaan yang salah terus berlangsung; bentuk ini lebih alami daripada 'menoleransi' dalam register Alkitab yang bermartabat.
- source_word: τὴν γυναῖκα Ἰεζάβελ
  choice: perempuan Izebel
  rationale: Mempertahankan bacaan teks utama tanpa memasukkan varian 'istrimu Izebel'.
- source_word: ἡ λέγουσα ἑαυτὴν προφῆτιν
  choice: yang menyebut dirinya nabiah
  rationale: Menjaga unsur pengakuan diri dan bentuk feminin eksplisit προφῆτιν.
- source_word: διδάσκει καὶ πλανᾷ
  choice: mengajar dan menyesatkan
  rationale: Mencerminkan dua verba kini yang menggambarkan kegiatannya yang berlanjut.
- source_word: τοὺς ἐμοὺς δούλους
  choice: hamba-hamba-Ku
  rationale: Dalam bahasa Indonesia, 'hamba' secara alami menyatakan pengabdian sekaligus kepunyaan kepada Kristus tanpa konotasi utama perdagangan manusia yang melekat pada 'budak'.
- source_word: πορνεῦσαι
  choice: supaya berbuat cabul
  rationale: Menyampaikan perilaku seksual terlarang secara ringkas, jelas, dan bermartabat.
- source_word: φαγεῖν εἰδωλόθυτα
  choice: memakan makanan yang dipersembahkan kepada berhala
  rationale: Ungkapan Indonesia yang jelas untuk makanan yang terkait dengan persembahan kurban kepada berhala.
theological_decisions:
- issue: Identitas Izebel
  choice: Mempertahankan 'Izebel' tanpa menentukan apakah itu nama pribadi atau sebutan simbolis.
  alternative: Perempuan yang secara harfiah bernama Izebel; atau sebutan simbolis yang merujuk kepada Izebel dalam Perjanjian Lama.
  rationale: Ayat ini sendiri tidak menyelesaikan pertanyaan tersebut, sehingga ambiguitasnya dipertahankan.
- issue: Arti δοῦλος
  choice: hamba-hamba-Ku
  alternative: budak-budak-Ku
  rationale: '''Hamba'' dalam register Alkitab Indonesia tetap menunjukkan kepunyaan dan ketundukan kepada Kristus, serta lebih wajar dan tidak keliru mengutamakan konotasi sosial modern dari ''budak''.'
- issue: Hubungan infinitif πορνεῦσαι dan φαγεῖν dengan πλανᾷ
  choice: supaya berbuat cabul dan memakan makanan yang dipersembahkan kepada berhala
  alternative: sehingga berbuat cabul dan memakan makanan yang dipersembahkan kepada berhala
  rationale: Terjemahan tujuan/hasil dengan 'supaya' secara alami menunjukkan arah tindakan penyesatan tanpa memastikan secara berlebihan apakah setiap orang telah melakukannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal 'engkau' dan kapitalisasi pronomina ilahi menurut kebiasaan penerbitan Alkitab Indonesia. Susunan kalimat dibuat alami tetapi tetap dekat dengan struktur dan ketegangan teks Yunani.
