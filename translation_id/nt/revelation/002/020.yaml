  to: Namun, Aku keberatan terhadapmu karena engkau membiarkan perempuan Izebel[a], yang menyebut dirinya nabiah[b], mengajar dan menyesatkan[c] hamba-hamba-Ku sehingga melakukan percabulan dan memakan makanan yang dipersembahkan kepada berhala.
  rationale: Revisi memperbaiki idiom tuduhan ἔχω κατὰ σοῦ menjadi 'Aku keberatan terhadapmu karena', tanpa menambahkan isi teologis. Hubungan πλανᾷ dengan kedua infinitif dinyatakan dengan 'sehingga' agar tidak memaksakan nuansa tujuan. Istilah nama, jabatan feminin, kepunyaan Kristus, dan makanan persembahan berhala tetap dipertahankan, begitu pula ambiguitas mengenai identitas Izebel.
