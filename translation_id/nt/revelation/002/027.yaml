  text: καὶ ποιμανεῖ αὐτοὺς ἐν ῥάβδῳ σιδηρᾷ ὡς τὰ σκεύη τὰ κεραμικὰ ⸀συντρίβεται,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/027.yaml
  text: and he will shepherd them with an iron rod[a], as clay vessels are shattered[b],
translation:
  language: id
  text: dan ia akan menggembalakan mereka dengan tongkat besi[a], seperti bejana-bejana tembikar diremukkan[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan memerintah mereka dengan tongkat besi.” Kata kerjanya secara harfiah berarti “menggembalakan,” tetapi dalam gema Mazmur 2 ini juga mengandung arti memerintah sebagai raja.
    reason: alternative_reading
  - marker: b
    text: Ini merujuk pada Mazmur 2:9, di sana bangsa-bangsa dipecahkan seperti barang tembikar.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: dan
  rationale: Kata penghubung dipertahankan untuk mengaitkan klausa ini dengan janji pada ayat sebelumnya.
- source_word: ποιμανεῖ
  choice: akan menggembalakan
  rationale: Pilihan ini mempertahankan makna dasar ποιμαίνω dan citra gembala, sekaligus membiarkan konteks tongkat besi dan gema Mazmur 2 menyampaikan dimensi pemerintahan kerajaan.
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: dengan tongkat besi
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan citra tongkat sebagai alat otoritas serta penghukuman dalam latar Mazmur 2.
- source_word: ὡς
  choice: seperti
  rationale: Menyatakan perbandingan secara jelas dan wajar dalam bahasa Indonesia modern.
- source_word: τὰ σκεύη τὰ κεραμικὰ
  choice: bejana-bejana tanah liat
  rationale: σκεύη berarti wadah atau bejana, sedangkan κεραμικὰ menunjukkan bahan tembikar; pilihan ini jelas, alami, dan menonjolkan kerapuhannya.
- source_word: συντρίβεται
  choice: diremukkan
  rationale: Kata ini menyampaikan tindakan memecahkan secara keras hingga berkeping-keping. Bentuk jamak Indonesia mengikuti subjek jamak, sebagaimana lazim ketika struktur Yunani memakai verba tunggal bersama subjek netral jamak.
theological_decisions:
- issue: Gema kerajaan-mesianis Mazmur 2:9 dalam ποιμανεῖ dan citra tongkat besi
  choice: Mempertahankan metafora penggembalaan dalam teks utama
  alternative: Menerjemahkan ποιμανεῖ sebagai “akan memerintah” untuk menonjolkan kekuasaan kerajaan
  rationale: Teks Yunani memakai ποιμαίνω, bukan kata umum untuk memerintah. “Menggembalakan” menjaga ketegangan antara pemeliharaan pastoral dan pelaksanaan otoritas kerajaan, sementara konteks tongkat besi tetap menghadirkan unsur penghakiman.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Ia” dipakai sesuai bentuk orang ketiga dalam klausa yang berlanjut dari konteks sebelumnya; huruf kecil dipertahankan karena ayat ini merupakan lanjutan kalimat. Citra gembala, tongkat besi, dan bejana tanah liat dipertahankan tanpa melunakkan ketegangan pastoral-yudisial.
