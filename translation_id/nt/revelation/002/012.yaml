id: REV.2.12
reference: Revelation 2:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Περγάμῳ ἐκκλησίας γράψον· Τάδε λέγει ὁ ἔχων τὴν ῥομφαίαν τὴν δίστομον τὴν ὀξεῖαν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/012.yaml
  text: 'And to the angel of the church in Pergamum write: These things says the one who has the sharp, double-edged sword:[a]'
translation:
  language: id
  text: 'Dan tulislah kepada malaikat jemaat di Pergamus: Inilah yang dikatakan oleh Dia yang memegang pedang tajam bermata dua:[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “utusan” untuk “malaikat”. Para penafsir berbeda pendapat apakah yang dimaksud adalah makhluk surgawi atau wakil manusia dari jemaat.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: malaikat
  rationale: Kata ini dapat menunjuk kepada malaikat surgawi atau utusan manusia. 'Malaikat' mempertahankan istilah yang lazim dalam formula sapaan kepada ketujuh jemaat dan tidak menentukan identitas rujukannya.
- source_word: ἐκκλησίας
  choice: jemaat
  rationale: Dalam konteks Kristen di Wahyu, kata ini menunjuk kepada komunitas orang percaya; 'jemaat' merupakan padanan Indonesia yang alami dan tidak mengisyaratkan gedung.
- source_word: γράψον
  choice: tulislah
  rationale: Bentuk imperatif aoris diterjemahkan sebagai perintah langsung; akhiran '-lah' memberi nada perintah yang wajar dan bermartabat.
- source_word: Τάδε λέγει
  choice: Inilah firman
  rationale: Formula deklaratif ini memperkenalkan perkataan berwibawa. 'Inilah firman' alami dalam bahasa Indonesia dan mempertahankan nuansa resmi, walaupun tidak meniru susunan Yunani secara kaku.
- source_word: ὁ ἔχων
  choice: Dia yang memegang
  rationale: Partisipel berartikel berfungsi sebagai gelar deskriptif. 'Memegang' lebih konkret dan sesuai dengan gambaran pedang daripada sekadar 'mempunyai'.
- source_word: ῥομφαίαν
  choice: pedang
  rationale: Kata ini dapat menyebut pedang besar, tetapi 'pedang' cukup tepat tanpa menambahkan ukuran yang tidak menjadi fokus ayat.
- source_word: δίστομον
  choice: bermata dua
  rationale: Secara harfiah berarti 'bermulut dua' dan secara idiomatis menggambarkan pedang dengan dua sisi tajam. 'Bermata dua' adalah ungkapan Indonesia yang lazim.
- source_word: ὀξεῖαν
  choice: tajam
  rationale: Padanan langsung dan alami bagi sifat pedang dalam konteks ini.
- source_word: Περγάμῳ
  choice: Pergamus
  rationale: Pergamus adalah bentuk nama tempat yang mapan dalam tradisi Alkitab bahasa Indonesia dan tetap jelas bagi pembaca modern.
theological_decisions:
- issue: Identitas 'malaikat' jemaat
  choice: Memakai 'malaikat' dalam teks utama tanpa menentukan apakah sosok itu surgawi atau manusia.
  alternative: utusan; pemimpin atau wakil manusia dari jemaat; wakil surgawi jemaat
  rationale: Kata Yunani ἄγγελος memungkinkan beberapa rujukan, dan ayat ini sendiri tidak menyelesaikan persoalan tersebut. Catatan kaki mempertahankan alternatif leksikal dan ketegangan penafsirannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami sambil mempertahankan formula perintah dan deklarasi yang resmi. Kapitalisasi 'Dia' menandai rujukan gelar kepada Kristus tanpa memperluas isi teks.
