  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μετανόησον οὖν· εἰ δὲ μή, ἔρχομαί σοι ταχύ, καὶ πολεμήσω μετ’ αὐτῶν ἐν τῇ ῥομφαίᾳ τοῦ στόματός μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/016.yaml
  text: Therefore repent[a]. But if not, I am coming to you quickly[b], and I will make war against them with the sword of my mouth.
translation:
  language: id
  text: Karena itu, bertobatlah. Tetapi jika tidak, Aku segera datang kepadamu dan akan berperang melawan mereka[a] dengan pedang dari mulut-Ku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Yunani memakai kata depan yang biasanya berarti “dengan”, tetapi sesudah kata “berperang” maknanya di sini adalah “melawan mereka”.
    reason: lexical_alternative
  - marker: b
    text: “Pedang dari mulut-Ku” adalah gambaran apokaliptik tentang perkataan Kristus yang menghakimi atau pernyataan hukuman-Nya.
    reason: cross_reference
lexical_decisions:
- source_word: μετανόησον
  choice: bertobatlah
  rationale: Bentuk perintah aoris menyerukan pertobatan yang tegas. “Bertobatlah” merupakan padanan Indonesia yang ringkas dan mempertahankan bobot moral-rohaninya.
- source_word: οὖν
  choice: karena itu
  rationale: Menandai kesimpulan dari teguran sebelumnya dan mempertahankan hubungan logis antarayat.
- source_word: εἰ δὲ μή
  choice: namun, jika tidak
  rationale: Mempertahankan bentuk peringatan bersyarat sekaligus pertentangan yang ditandai oleh δέ.
- source_word: ἔρχομαί σοι
  choice: Aku akan datang kepadamu
  rationale: Bentuk kini Yunani memiliki daya futur yang dekat. Ungkapan ini mempertahankan sasaran tunggal “kepadamu” tanpa terlebih dahulu memasukkan nuansa permusuhan.
- source_word: ταχύ
  choice: segera
  rationale: Dalam bahasa Indonesia, “segera” secara alami dapat menyampaikan kedekatan waktu dan tindakan yang cepat tanpa memutuskan secara berlebihan di antara kedua nuansa itu.
- source_word: πολεμήσω μετ’ αὐτῶν
  choice: berperang melawan mereka
  rationale: Kata kerja πολεμέω dan konteks ancaman menuntut makna permusuhan; “berperang” mempertahankan kerasnya citra militer.
- source_word: ἐν τῇ ῥομφαίᾳ
  choice: dengan pedang
  rationale: ἐν berfungsi instrumental, sedangkan “dengan” merupakan bentuk Indonesia yang wajar untuk menyatakan sarana.
- source_word: ῥομφαίᾳ
  choice: pedang
  rationale: Walaupun dapat menunjuk pada pedang besar, “pedang” akurat, lazim, dan tidak menambahkan rincian visual yang tidak diperlukan.
- source_word: τοῦ στόματός μου
  choice: dari mulut-Ku
  rationale: Padanan ini menghasilkan gambaran yang jelas dan alami dalam bahasa Indonesia sambil mempertahankan hubungan langsung antara pedang dan mulut Kristus.
theological_decisions:
- issue: Sasaran kedatangan Kristus dan tindakan perang-Nya
  choice: Membedakan kedatangan kepada jemaat (“kepadamu”) dari tindakan berperang melawan kelompok tertentu (“mereka”).
  alternative: Menyatakan bahwa Kristus datang melawan seluruh jemaat tanpa pembedaan, atau bahwa kedatangan itu hanya ditujukan kepada para pengajar sesat.
  rationale: Bahasa Yunani memakai bentuk tunggal dalam “kepadamu”, tetapi bentuk jamak dalam “melawan mereka”. Terjemahan mempertahankan ketegangan antara tanggung jawab jemaat secara keseluruhan dan penghukuman yang diarahkan kepada pihak tertentu.
- issue: Pedang dari mulut Kristus sebagai sarana penghakiman
  choice: Mempertahankan gambaran apokaliptik “pedang dari mulut-Ku”.
  alternative: Memparafrasekannya sebagai “firman-Ku” atau “kuasa perkataan-Ku”.
  rationale: Teks sumber sengaja memakai citra pedang. Mempertahankannya menjaga daya sastra dan teologis tanpa membatasi maknanya pada satu penafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Tanda seru sesudah perintah menegaskan seruan pertobatan tanpa menambah isi. Huruf kapital pada kata ganti yang merujuk kepada Kristus mengikuti kebiasaan hormat yang umum dalam penerbitan Alkitab bahasa Indonesia.
