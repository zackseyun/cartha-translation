reference: Revelation 2:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὡς κἀγὼ εἴληφα παρὰ τοῦ πατρός μου, καὶ δώσω αὐτῷ τὸν ἀστέρα τὸν πρωϊνόν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/028.yaml
  text: just as I also have received from my Father[a], and I will give him the morning star.
translation:
  language: id
  text: sebagaimana Aku juga telah menerima dari Bapa-Ku, dan Aku akan memberikan kepadanya bintang fajar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bintang pagi.” Ungkapan ini mungkin mengacu pada gambaran kerajaan-mesianis dan juga dapat mengantisipasi Wahyu 22:16, tempat Yesus menyebut diri-Nya “bintang fajar yang terang.”
    reason: Alternatif leksikal dan kemungkinan kaitan intratekstual tanpa menetapkan makna lambang secara mutlak.
lexical_decisions:
- source_word: ὡς
  choice: sebagaimana
  rationale: Menandai perbandingan atau kesesuaian dengan janji dalam konteks sebelumnya secara jelas dan wajar dalam bahasa Indonesia.
- source_word: κἀγὼ
  choice: Aku juga
  rationale: Mempertahankan kata ganti yang ditekankan serta daya aditif καί tanpa memberi penekanan berlebihan.
- source_word: εἴληφα
  choice: telah menerimanya
  rationale: Bentuk perfektum menunjukkan penerimaan yang sudah terjadi dan tetap berlaku. Akhiran -nya memasok objek tersirat dari konteks sebelumnya, yakni kewenangan, sehingga kalimat Indonesia tidak terasa menggantung.
- source_word: παρὰ τοῦ πατρός μου
  choice: dari Bapa-Ku
  rationale: παρά dengan genitif menyatakan sumber. Bentuk ini mempertahankan relasi filial secara langsung tanpa tambahan tafsiran.
- source_word: καὶ δώσω αὐτῷ
  choice: dan Aku akan memberikan kepadanya
  rationale: Mencerminkan bentuk futurum dan mempertahankan rujukan pronominal kepada orang yang menang dalam konteks sebelumnya.
- source_word: τὸν ἀστέρα τὸν πρωϊνόν
  choice: bintang fajar
  rationale: Ungkapan idiomatis Indonesia yang alami dan bermartabat, sekaligus mempertahankan metafora sumber tanpa menjelaskan identitas atau maknanya di dalam teks utama.
theological_decisions:
- issue: Identitas dan makna “bintang fajar”
  choice: Mempertahankan ungkapan “bintang fajar” tanpa menjelaskannya dalam teks utama.
  alternative: Menafsirkannya secara eksplisit sebagai Kristus, kemenangan rajani-Mesianis, atau kemuliaan eskatologis.
  rationale: Ayat ini tidak mendefinisikan lambang tersebut. Mempertahankan metaforanya menjaga ambiguitas dan ketegangan teologis yang asli, sedangkan catatan kaki dapat menunjukkan kemungkinan kaitan intratekstual.
- issue: Relasi Kristologis dalam “dari Bapa-Ku”
  choice: Menerjemahkan langsung sebagai “dari Bapa-Ku”.
  alternative: Menambahkan penjelasan bahwa yang diterima ialah kewenangan yang didelegasikan atau menguraikan relasi kekal antara Bapa dan Anak.
  rationale: Teks menyatakan relasi filial dan tindakan menerima, tetapi tidak menguraikan implikasi doktrinalnya dalam ayat ini; karena itu terjemahan tidak menambahkan penjelasan teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Kapitalisasi pada kata ganti yang merujuk kepada Kristus dan bentuk “Bapa-Ku” mengikuti kebiasaan luas penerbitan Alkitab Indonesia. Penempatan penanda catatan kaki sesudah “bintang fajar” mengaitkannya langsung dengan istilah yang dijelaskan.
