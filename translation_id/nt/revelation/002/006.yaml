revisions:
- from: 'Namun, ada hal ini padamu: engkau membenci perbuatan-perbuatan para pengikut Nikolaus[a], yang juga Kubenci.'
  to: 'Tetapi, inilah yang ada padamu: engkau membenci perbuatan-perbuatan kaum Nikolaitan[a], yang juga Aku benci.'
  rationale: Revisi mengganti parafrasa interpretatif “para pengikut Nikolaus” dengan transliterasi nama kelompok “kaum Nikolaitan,” memperbaiki idiom Indonesia pada τοῦτο ἔχεις, dan membetulkan catatan kaki. Terjemahan tetap membatasi objek kebencian pada perbuatan-perbuatan mereka serta mempertahankan pengulangan verba “membenci.”
