id: REV.2.6
reference: Revelation 2:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλὰ τοῦτο ἔχεις ὅτι μισεῖς τὰ ἔργα τῶν Νικολαϊτῶν, ἃ κἀγὼ μισῶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/006.yaml
  text: 'But this you have: you hate the works of the Nicolaitans[a], which I also hate.'
translation:
  language: id
  text: 'Tetapi, inilah yang ada padamu: engkau membenci perbuatan-perbuatan kaum Nikolaitan[a], yang juga Aku benci.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kaum Nicolaitan.” Nama kelompok ini ditransliterasikan dari bahasa Yunani.
    reason: transliteration_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Namun
  rationale: Menandai pertentangan dengan konteks sebelumnya secara alami dan ringkas.
- source_word: τοῦτο ἔχεις
  choice: ada hal ini padamu
  rationale: Mempertahankan gambaran harfiah 'engkau memiliki ini' serta penekanan pada τοῦτο, tetapi dalam susunan bahasa Indonesia yang wajar.
- source_word: ὅτι
  choice: ':'
  rationale: ὅτι memperkenalkan isi dari hal yang mereka miliki; tanda titik dua menyampaikannya dengan jelas tanpa menambah unsur tafsiran.
- source_word: μισεῖς
  choice: engkau membenci
  rationale: Mempertahankan arti kuat dan langsung dari μισέω tanpa memperhalusnya.
- source_word: τὰ ἔργα
  choice: perbuatan-perbuatan
  rationale: Dalam konteks ini ἔργα menunjuk pada tindakan atau praktik; 'perbuatan-perbuatan' alami dalam bahasa Indonesia dan menjaga objek kebencian tetap berupa tindakan.
- source_word: τῶν Νικολαϊτῶν
  choice: para pengikut Nikolaus
  rationale: Nama kelompok Yunani Νικολαΐτης secara etimologis dan konvensional menunjuk pada orang-orang yang terkait dengan Nikolaus; bentuk ini lebih mudah dipahami pembaca Indonesia daripada transliterasi yang kurang dikenal.
- source_word: ἃ
  choice: yang
  rationale: Kata penghubung relatif ini merujuk kembali kepada perbuatan-perbuatan tersebut.
- source_word: κἀγὼ
  choice: juga Ku-
  rationale: Mempertahankan unsur καί, 'juga', dan penekanan pada pembicara dalam bentuk Indonesia yang ringkas.
- source_word: μισῶ
  choice: Kubenci
  rationale: Mengulang akar kata 'benci' seperti dalam bahasa Yunani dan mempertahankan kesejajaran sikap pembicara dengan jemaat.
theological_decisions:
- issue: Objek kebencian
  choice: Yang dibenci adalah perbuatan-perbuatan para pengikut Nikolaus.
  alternative: Terjemahan yang lebih longgar dapat menyiratkan bahwa orang-orangnya sendiri yang dibenci.
  rationale: τὰ ἔργα merupakan objek langsung μισεῖς dan anteseden ἃ; terjemahan harus menjaga pembedaan ini tanpa memperluas klaim teks.
- issue: Keselarasan sikap pembicara dengan jemaat
  choice: yang juga Kubenci
  alternative: yang Aku pun benci
  rationale: κἀγὼ menyatakan bahwa sang pembicara turut membenci perbuatan-perbuatan itu; rumusan ini mempertahankan daya teologis langsung dan pengulangan μισέω.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti tunggal 'engkau' sesuai dengan sapaan kepada malaikat jemaat dalam konteks, sedangkan 'Ku-' memakai kapitalisasi penghormatan karena pembicaranya adalah Kristus. Pengulangan 'membenci/Kubenci' sengaja dipertahankan.
