id: REV.2.1
reference: Revelation 2:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Τῷ ἀγγέλῳ ⸀τῆς ἐν Ἐφέσῳ ἐκκλησίας γράψον· Τάδε λέγει ὁ κρατῶν τοὺς ἑπτὰ ἀστέρας ἐν τῇ δεξιᾷ αὐτοῦ, ὁ περιπατῶν ἐν μέσῳ τῶν ἑπτὰ λυχνιῶν τῶν χρυσῶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/001.yaml
  text: 'To the angel of the church in Ephesus write: These things says the one who holds the seven stars in his right hand[a], who walks among the seven golden lampstands:'
translation:
  language: id
  text: '“Tuliskanlah kepada malaikat[a] jemaat di Efesus: Inilah yang dikatakan oleh Dia yang memegang ketujuh bintang di tangan kanan-Nya dan yang berjalan di antara ketujuh kaki pelita emas:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “utusan” jemaat di Efesus.
    reason: ἀγγέλῳ dapat berarti malaikat atau utusan; rujukannya dalam rumusan ini tidak pasti.
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: malaikat
  rationale: Kata ini dapat menunjuk kepada malaikat surgawi atau utusan manusia. Dalam suasana apokaliptis kitab Wahyu, “malaikat” merupakan pilihan utama yang wajar, sementara kemungkinan “utusan” dipertahankan dalam catatan kaki.
- source_word: ἐκκλησίας
  choice: jemaat
  rationale: Dalam konteks komunitas Kristen setempat, “jemaat” merupakan padanan Indonesia yang alami dan tepat.
- source_word: γράψον
  choice: Tuliskanlah
  rationale: Imperatif aoristus ini menyampaikan perintah langsung kepada Yohanes; bentuk “Tuliskanlah” alami dan sesuai dengan konteks penulisan pesan.
- source_word: Τάδε λέγει
  choice: Inilah yang dikatakan
  rationale: Ungkapan ini mempertahankan nada khidmat dari rumusan pernyataan kenabian sekaligus terdengar alami dalam bahasa Indonesia modern.
- source_word: κρατῶν
  choice: memegang
  rationale: Kata ini menyiratkan penguasaan atau pegangan yang teguh; “memegang” mempertahankan gambaran konkret tanpa menambahkan tafsiran.
- source_word: δεξιᾷ
  choice: tangan kanan
  rationale: Padanan langsung yang mempertahankan gambaran simbolis tentang kewenangan dan perlindungan.
- source_word: περιπατῶν
  choice: berjalan
  rationale: Padanan ini mempertahankan gambaran gerak aktif di tengah kaki-kaki pelita.
- source_word: ἐν μέσῳ
  choice: di antara
  rationale: Ungkapan yang alami dalam bahasa Indonesia dan tepat untuk posisi serta gerak di tengah sejumlah benda.
- source_word: λυχνιῶν
  choice: kaki pelita
  rationale: λυχνία menunjuk pada penyangga atau kaki pelita, bukan pelitanya sendiri; pilihan ini juga menjaga konsistensi gambaran dalam Wahyu 1.
- source_word: χρυσῶν
  choice: emas
  rationale: Dalam konstruksi Indonesia, “kaki pelita emas” secara alami menyatakan bahan atau sifat keemasan dari kaki-kaki pelita itu.
theological_decisions:
- issue: Rujukan frasa “malaikat jemaat”
  choice: Memakai “malaikat” dalam teks utama
  alternative: utusan
  rationale: ἄγγελος dapat berarti malaikat surgawi ataupun utusan manusia. Corak apokaliptis Wahyu mendukung “malaikat”, tetapi identitas yang dimaksud tetap diperdebatkan; karena itu alternatifnya dicantumkan dalam catatan kaki tanpa menutup ketegangan penafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi “Dia” dan sufiks “-Nya” menandai rujukan kepada Kristus sesuai kebiasaan penerbitan Alkitab Indonesia, tanpa menambah isi sumber. Tanda titik dua mempertahankan struktur pengantar pesan.
