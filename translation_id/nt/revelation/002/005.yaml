  to: Karena itu, ingatlah dari mana engkau telah jatuh, bertobatlah, dan lakukanlah perbuatan-perbuatan yang mula-mula. Tetapi jika tidak, Aku datang kepadamu dan akan memindahkan kaki dianmu dari tempatnya, kecuali engkau bertobat.[a]
