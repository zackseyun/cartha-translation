id: REV.2.5
reference: Revelation 2:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μνημόνευε οὖν πόθεν ⸀πέπτωκας, καὶ μετανόησον καὶ τὰ πρῶτα ἔργα ποίησον· εἰ δὲ μή, ἔρχομαί ⸀σοι, καὶ κινήσω τὴν λυχνίαν σου ἐκ τοῦ τόπου αὐτῆς, ἐὰν μὴ μετανοήσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/005.yaml
  text: Therefore remember from where you have fallen[a], and repent, and do the works you did at first. But if not, I am coming to you, and I will remove your lampstand from its place[b], unless you repent.
translation:
  language: id
  text: Karena itu, ingatlah dari mana engkau telah jatuh, bertobatlah, dan lakukanlah perbuatan-perbuatan yang mula-mula. Tetapi jika tidak, Aku datang kepadamu dan akan memindahkan kaki dianmu dari tempatnya, kecuali engkau bertobat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ingatlah dari ketinggian mana engkau telah jatuh.” Secara harfiah, bahasa Yunani berbunyi “dari mana engkau telah jatuh”; sebagian orang memahaminya sebagai metafora tentang ketinggian.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημόνευε
  choice: ingatlah
  rationale: Imperatif kini menyerukan ingatan yang terus dipelihara; “ingatlah” merupakan bentuk perintah yang alami dalam bahasa Indonesia.
- source_word: οὖν
  choice: Karena itu
  rationale: Menandai kesimpulan dari teguran sebelumnya dan mempertahankan hubungan logisnya.
- source_word: πόθεν πέπτωκας
  choice: dari mana engkau telah jatuh
  rationale: Mempertahankan ungkapan metaforis dan kala perfektum Yunani tanpa menambahkan gagasan “ketinggian” atau kemurtadan yang tidak dinyatakan secara eksplisit.
- source_word: μετανόησον / μετανοήσῃς
  choice: Bertobatlah / engkau bertobat
  rationale: “Bertobat” adalah padanan baku dan wajar bagi perubahan arah moral-rohani yang dituntut dalam konteks ini.
- source_word: τὰ πρῶτα ἔργα ποίησον
  choice: lakukanlah kembali perbuatan-perbuatan yang kaulakukan pada mulanya
  rationale: Mengungkapkan acuan temporal πρῶτα secara alami; “kembali” menyampaikan tuntutan untuk mengulang pola perbuatan semula yang tersirat oleh konteks.
- source_word: εἰ δὲ μή
  choice: Jika tidak
  rationale: Mempertahankan peralihan singkat dan tegas menuju peringatan bersyarat.
- source_word: ἔρχομαί σοι
  choice: Aku akan datang kepadamu
  rationale: Bentuk kini Yunani memiliki daya futuristik dan mendesak. Bahasa Indonesia lebih alami memakai “akan datang”; “kepadamu” tidak ditafsirkan menjadi “melawanmu”.
- source_word: κινήσω
  choice: memindahkan
  rationale: Makna dasarnya ialah menggerakkan atau memindahkan. Bersama frasa “dari tempatnya,” pilihan ini mempertahankan citra konkret tanpa memperlunaknya menjadi penjelasan teologis.
- source_word: τὴν λυχνίαν σου
  choice: kaki pelitamu
  rationale: λυχνία menunjuk penyangga atau kaki pelita, bukan pelitanya sendiri. Istilah ini mempertahankan citra Wahyu yang mengacu kepada jemaat.
- source_word: ἐκ τοῦ τόπου αὐτῆς
  choice: dari tempatnya
  rationale: Padanan langsung dan alami yang mempertahankan tindakan pemindahan dari posisi semula.
theological_decisions:
- issue: Makna jatuh
  choice: Mempertahankan metafora “dari mana engkau telah jatuh.”
  alternative: “Dari ketinggian mana engkau telah jatuh” atau “betapa jauh engkau telah jatuh.”
  rationale: Teks Yunani tidak menyebut “ketinggian” secara eksplisit. Terjemahan utama menjaga ambiguitas, sedangkan kemungkinan metafora ketinggian dicatat dalam catatan kaki.
- issue: Makna pemindahan kaki pelita
  choice: Mempertahankan citra simbolis pemindahan kaki pelita jemaat.
  alternative: Menjelaskannya sebagai hilangnya kesaksian, status atau keberadaan jemaat, ataupun keselamatan.
  rationale: Wahyu 1:20 mengidentifikasi kaki pelita dengan jemaat, tetapi ayat ini tidak merumuskan seluruh konsekuensi teologisnya. Citra dan ketegangannya tidak diselesaikan secara denominatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti tunggal “engkau” mempertahankan sapaan kepada malaikat/jemaat sebagai satu pihak; “Aku” dikapitalisasi karena pembicaranya adalah Kristus. Struktur perintah dibuat alami tanpa menghilangkan ketegasan dan urgensi teks Yunani.
