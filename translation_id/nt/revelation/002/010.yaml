id: REV.2.10
reference: Revelation 2:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀μηδὲν φοβοῦ ἃ μέλλεις ⸀πάσχειν. ⸀ἰδοὺ μέλλει ⸀βάλλειν ὁ διάβολος ἐξ ὑμῶν εἰς φυλακὴν ἵνα πειρασθῆτε, καὶ ⸀ἕξετε θλῖψιν ἡμερῶν δέκα. γίνου πιστὸς ἄχρι θανάτου, καὶ δώσω σοι τὸν στέφανον τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/010.yaml
  text: Do not fear what you are about to suffer[a]. Look, the devil is about to throw some of you into prison so that you may be tested, and you will have tribulation for ten days. Be faithful until death[c][b], and I will give you the crown of life.
translation:
  language: id
  text: Jangan takut terhadap apa yang sebentar lagi akan kamu derita. Lihatlah, Iblis sebentar lagi akan menjebloskan beberapa orang di antara kamu ke dalam penjara supaya kamu diuji[a], dan kamu akan mengalami penderitaan selama sepuluh hari. Tetaplah setia sampai mati[b], dan Aku akan memberikan kepadamu mahkota kehidupan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “diuji” juga dapat berarti “dicobai” atau “dicoba,” bergantung pada konteks.
    reason: lexical_alternative
  - marker: b
    text: “Sampai mati” juga dapat berarti “bahkan sampai harus menghadapi kematian,” yaitu tetap setia sekalipun kemartiran dituntut.
    reason: alternative_reading
  - marker: c
    text: Kata Yunani untuk “mahkota” (stephanos) menunjuk pada karangan atau mahkota yang diberikan kepada pemenang sebagai penghargaan, bukan pada mahkota kebesaran seorang raja.
    reason: cultural_note
lexical_decisions:
- source_word: μηδὲν φοβοῦ
  choice: Jangan takut
  rationale: Larangan ini disampaikan secara alami dan langsung dalam bahasa Indonesia modern.
- source_word: ἃ μέλλεις πάσχειν
  choice: apa yang sebentar lagi akan kamu derita
  rationale: Ungkapan ini mempertahankan objek penderitaan serta nuansa kedekatan waktu dari μέλλω dengan infinitif.
- source_word: ἰδοὺ
  choice: Lihatlah
  rationale: Kata seru ini menarik perhatian kepada pernyataan berikutnya tanpa memakai bentuk yang arkais.
- source_word: μέλλει βάλλειν
  choice: sebentar lagi akan melemparkan
  rationale: Pilihan ini mempertahankan nuansa tindakan yang akan segera terjadi dan gambaran kuat dari βάλλω.
- source_word: ὁ διάβολος
  choice: Iblis
  rationale: Dalam konteks ini διάβολος menunjuk kepada lawan adikodrati sebagai gelar diri yang sudah lazim dalam bahasa Indonesia.
- source_word: ἐξ ὑμῶν
  choice: beberapa orang di antara kalian
  rationale: Frasa ini menunjukkan bahwa yang dipenjarakan adalah sebagian dari kelompok penerima.
- source_word: εἰς φυλακήν
  choice: ke dalam penjara
  rationale: φυλακή di sini menunjuk pada pemenjaraan atau penahanan.
- source_word: ἵνα πειρασθῆτε
  choice: supaya kalian diuji
  rationale: Dalam konteks pemenjaraan dan penderitaan, 'diuji' secara alami menyampaikan pencobaan yang menguji kesetiaan, sementara kemungkinan arti lain dipertahankan dalam catatan kaki.
- source_word: ἕξετε θλῖψιν
  choice: kalian akan mengalami penderitaan
  rationale: θλῖψις menyatakan tekanan atau kesengsaraan berat; 'mengalami penderitaan' jelas dan wajar bagi pembaca modern.
- source_word: ἡμερῶν δέκα
  choice: selama sepuluh hari
  rationale: Genitif durasi diterjemahkan secara alami dengan 'selama'.
- source_word: γίνου πιστός
  choice: Tetaplah setia
  rationale: Imperatif kini dalam konteks ini menyerukan keadaan setia yang terus dipertahankan.
- source_word: ἄχρι θανάτου
  choice: sampai mati
  rationale: Ungkapan ini dekat dengan bahasa sumber dan tetap dapat mencakup kesetiaan hingga akhir hidup maupun hingga harus menghadapi kematian.
- source_word: τὸν στέφανον τῆς ζωῆς
  choice: mahkota kehidupan
  rationale: Ungkapan genitif dipertahankan agar metafora dan kemungkinan hubungan maknanya tidak dipersempit; catatan menjelaskan jenis mahkota yang dimaksud.
theological_decisions:
- issue: Makna πειρασθῆτε dalam konteks tindakan Iblis dan penganiayaan
  choice: diuji
  alternative: dicobai; diuji melalui pencobaan
  rationale: Pemenjaraan dan penderitaan menjadi ujian atas kesetiaan orang percaya. Namun, karena verba Yunani dapat pula menunjuk pada pencobaan, kemungkinan itu tidak dihapus dan dicatat dalam catatan kaki.
- issue: Cakupan makna ἄχρι θανάτου
  choice: sampai mati
  alternative: sampai menghadapi kematian; sekalipun harus mati
  rationale: 'Terjemahan utama mempertahankan keluasan frasa Yunani: kesetiaan hingga akhir dan, dalam konteks penganiayaan, kemungkinan kesetiaan yang menuntut kemartiran.'
- issue: Metafora στέφανος
  choice: mahkota
  alternative: karangan kemenangan
  rationale: '''Mahkota'' mempertahankan metafora Alkitab yang dikenal, sedangkan catatan kaki mencegah pembaca mengartikannya khusus sebagai mahkota kerajaan.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada langsung, khidmat, dan mudah dipahami. Pergantian dari pronomina tunggal “kamu” kepada bentuk jamak “kalian” mengikuti pergantian αριθμός dalam teks Yunani; “Aku” memakai huruf kapital karena penutur dalam konteks adalah Kristus. Istilah “Iblis” dipakai sebagai gelar yang lazim.
