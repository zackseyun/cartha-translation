revisions:
- from: Jangan takut terhadap apa yang sebentar lagi akan kamu derita. Lihatlah, Iblis sebentar lagi akan melemparkan beberapa orang di antara kalian ke dalam penjara supaya kalian diuji[a], dan kalian akan mengalami penderitaan selama sepuluh hari. Tetaplah setia sampai mati[b], dan Aku akan memberikan kepadamu mahkota kehidupan[c].
  to: Jangan takut terhadap apa yang sebentar lagi akan kamu derita. Lihatlah, Iblis sebentar lagi akan menjebloskan beberapa orang di antara kamu ke dalam penjara supaya kamu diuji[a], dan kamu akan mengalami penderitaan selama sepuluh hari. Tetaplah setia sampai mati[b], dan Aku akan memberikan kepadamu mahkota kehidupan[c].
  rationale: Revisi menyelaraskan pronomina utama dengan pengalamatan tunggal dalam bahasa Yunani, sambil membiarkan “beberapa orang di antara kamu” dan akibatnya bagi komunitas tetap terbaca secara kolektif. “Menjebloskan” menggantikan “melemparkan” untuk kelancaran idiomatik tanpa mengubah makna. Catatan kaki a dirapikan agar alternatif leksikal ditampilkan sebagai alternatif, bukan sebagai penjelasan yang tumpang tindih.
  reviewer_model: gpt-5.6-terra
