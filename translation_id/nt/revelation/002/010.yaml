    text: Kata Yunani yang diterjemahkan “diuji” juga dapat berarti “dicobai” atau “dicoba,” bergantung pada konteks.
    reason: lexical_alternative
  - marker: b
    text: “Sampai mati” juga dapat berarti “bahkan sampai harus menghadapi kematian,” yaitu tetap setia sekalipun kemartiran dituntut.
    reason: alternative_reading
  - marker: c
    text: Kata Yunani untuk “mahkota” (stephanos) menunjuk pada karangan atau mahkota yang diberikan kepada pemenang sebagai penghargaan, bukan pada mahkota kebesaran seorang raja.
    reason: cultural_note
  revision_rationale: Revisi menyelaraskan pronomina utama dengan pengalamatan tunggal dalam bahasa Yunani, sambil membiarkan “beberapa orang di antara kamu” dan akibatnya bagi komunitas tetap terbaca secara kolektif. “Menjebloskan” menggantikan “melemparkan” untuk kelancaran idiomatik tanpa mengubah makna. Catatan kaki a dirapikan agar alternatif leksikal ditampilkan sebagai alternatif, bukan sebagai penjelasan yang tumpang tindih.
