review_pass:
  verdict: revise
  source_fidelity: 'Terjemahan pada umumnya setia pada teks Yunani. Namun, subjek tunggal pada μέλλεις dan γίνου tidak dipertahankan secara konsisten: teks utama memakai “kamu” pada klausa pertama, tetapi beralih ke “kalian” pada klausa kedua dan kemudian kembali kepada bentuk imperatif tunggal. Dalam bahasa Indonesia, bentuk “kamu” dapat berfungsi kolektif, sehingga mempertahankannya di seluruh ayat lebih mencerminkan bentuk tunggal Yunani tanpa menghilangkan fakta bahwa “beberapa orang” berasal dari kelompok penerima.'
  naturalness: Bahasanya baku, jelas, dan bernada khidmat. “Melemparkan ... ke dalam penjara” cukup harfiah, tetapi “menjebloskan ... ke dalam penjara” lebih alami dalam bahasa Indonesia sambil tetap menyampaikan daya paksa βάλλειν dalam konteks ini. “Penderitaan selama sepuluh hari” juga alami.
  terminology: “Iblis,” “diuji,” “penderitaan,” dan “mahkota kehidupan” tepat serta konsisten dengan register Alkitab bahasa Indonesia modern. Catatan pada πειρασθῆτε perlu membedakan lebih jelas alternatif “dicobai” dari penjelasan parafrastis “diuji melalui pencobaan.” Catatan mengenai στέφανος sudah tepat.
  issues:
  - severity: medium
    issue: Peralihan pronomina tunggal dan jamak tidak mencerminkan bentuk sumber secara konsisten.
    rationale: Teks Yunani memakai bentuk tunggal dalam “apa yang engkau akan derita” dan “jadilah setia,” sedangkan “kalian” muncul pada bagian yang secara eksplisit jamak (“supaya kalian diuji” dan “kalian akan mengalami”). Draf beralih dari “kamu” ke “kalian” lalu kembali ke imperatif tunggal. Karena “kamu” dapat dipakai secara kolektif dalam bahasa Indonesia, penggunaan konsisten “kamu” mempertahankan pengalamatan tunggal sumber dan tetap wajar.
  - severity: low
    issue: “Melemparkan ... ke dalam penjara” terdengar agak kurang idiomatis.
    rationale: βάλλειν secara harfiah berarti “melemparkan,” tetapi dalam konteks pemenjaraan “menjebloskan” merupakan padanan Indonesia modern yang alami dan mempertahankan nuansa tindakan paksa.
  revised_text: Jangan takut terhadap apa yang sebentar lagi akan kamu derita. Lihatlah, Iblis sebentar lagi akan menjebloskan beberapa orang di antara kamu ke dalam penjara supaya kamu diuji[a], dan kamu akan mengalami penderitaan selama sepuluh hari. Tetaplah setia sampai mati[b], dan Aku akan memberikan kepadamu mahkota kehidupan[c].
  revised_footnotes:
