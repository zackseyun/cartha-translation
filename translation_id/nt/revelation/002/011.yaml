id: REV.2.11
reference: Revelation 2:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. ὁ νικῶν οὐ μὴ ἀδικηθῇ ἐκ τοῦ θανάτου τοῦ δευτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/011.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches[b]. The one who conquers will certainly not be harmed by the second death.
translation:
  language: id
  text: Siapa yang mempunyai telinga, hendaklah ia mendengarkan apa yang Roh katakan kepada jemaat-jemaat. Siapa yang menang tidak akan dirugikan sedikit pun oleh kematian yang kedua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “tidak akan disakiti sedikit pun oleh kematian yang kedua.” Secara lebih harfiah: “sama sekali tidak akan dirugikan dari/oleh kematian yang kedua.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: Siapa yang mempunyai telinga
  rationale: Konstruksi partisipel berartikel ini menyatakan siapa pun yang termasuk dalam golongan tersebut. Bentuk tunggal 'telinga' dipertahankan sesuai teks Yunani dan tetap alami dalam rumusan seruan ini.
- source_word: ἀκουσάτω
  choice: hendaklah ia mendengarkan
  rationale: Imperatif aoris orang ketiga tunggal menyampaikan seruan yang tegas. 'Mendengarkan' mencakup perhatian dan penerimaan, bukan sekadar mendengar bunyi.
- source_word: τὸ πνεῦμα
  choice: Roh
  rationale: Dalam rumusan berulang Wahyu 2–3, Roh tampil sebagai pembicara ilahi kepada jemaat-jemaat; huruf kapital menandai rujukan personal yang paling mungkin tanpa menambahkan penjelasan ke dalam teks.
- source_word: ταῖς ἐκκλησίαις
  choice: kepada jemaat-jemaat
  rationale: Dalam konteks ini ἐκκλησίαις menunjuk pada persekutuan-persekutuan orang percaya yang disapa. 'Jemaat-jemaat' adalah padanan Indonesia yang jelas dan lazim.
- source_word: ὁ νικῶν
  choice: Siapa yang menang
  rationale: Partisipel kini berartikel menggambarkan orang yang dicirikan oleh kemenangan atau ketekunan mengatasi. 'Siapa yang menang' mempertahankan citra kemenangan dan terdengar alami.
- source_word: οὐ μὴ
  choice: tidak akan ... sedikit pun
  rationale: Gabungan οὐ μή dengan subjungtif merupakan penyangkalan yang sangat tegas. Unsur 'sedikit pun' menyampaikan penegasan itu secara wajar dalam bahasa Indonesia.
- source_word: ἀδικηθῇ
  choice: mengalami bahaya
  rationale: Bentuk pasif ἀδικέω di sini berarti terkena kerugian, cedera, atau akibat buruk. Ungkapan 'mengalami bahaya' menjaga cakupan maknanya dalam kaitan dengan kematian kedua.
- source_word: ἐκ τοῦ θανάτου τοῦ δευτέρου
  choice: dari kematian yang kedua
  rationale: ἐκ dapat menandai sumber bahaya. 'Dari' mempertahankan hubungan sumber itu dan menghindari penentuan terlalu sempit sebagai pelaku langsung.
- source_word: τοῦ θανάτου τοῦ δευτέρου
  choice: kematian yang kedua
  rationale: Ungkapan apokaliptik ini dipertahankan tanpa uraian doktrinal karena maknanya dikembangkan lebih lanjut di dalam kitab Wahyu sendiri.
theological_decisions:
- issue: Rujukan 'Roh'
  choice: Roh sebagai pembicara ilahi kepada jemaat-jemaat
  alternative: roh kenabian secara lebih umum
  rationale: Rumusan berulang dalam Wahyu 2–3 paling wajar menunjuk kepada Roh Kudus, tetapi terjemahan tidak menambahkan kata 'Kudus' yang tidak hadir dalam frasa Yunani ini.
- issue: Cakupan bentuk tunggal maskulin representatif
  choice: memakai 'siapa yang' dan 'ia' dengan cakupan umum
  alternative: mengulang kata benda seperti 'orang itu' atau memakai bentuk jamak netral
  rationale: Bahasa Indonesia tidak memiliki pembedaan gender pada 'ia'. Susunan ini mempertahankan bentuk tunggal dan sekaligus menyatakan cakupan representatifnya secara alami.
- issue: Makna 'kematian yang kedua'
  choice: mempertahankan ungkapan tanpa penjelasan interpretatif
  alternative: menjelaskannya sebagai penghukuman kekal atau penghakiman terakhir
  rationale: Teks ayat ini tidak menguraikan istilah tersebut, dan kitab Wahyu sendiri kemudian memberinya konteks lebih lanjut. Terjemahan tidak seharusnya menutup ketegangan teologis dengan parafrasa.
- issue: Daya penyangkalan οὐ μή
  choice: tidak akan mengalami bahaya sedikit pun
  alternative: sama sekali tidak akan dirugikan atau tidak akan pernah disakiti
  rationale: Pilihan ini mempertahankan kepastian janji tanpa menentukan apakah akibat yang dimaksud terutama bersifat yuridis, fisik, atau lebih luas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Rumusan 'hendaklah ia mendengarkan' mempertahankan nada seruan apokaliptik, sedangkan 'siapa yang menang' mudah dipahami dan tetap dekat dengan citra νικάω. Penanda catatan kaki [a] ditempatkan setelah klausa yang diterangkannya.
