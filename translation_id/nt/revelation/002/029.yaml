  text: The one who has an ear, let him hear what the Spirit says to the churches.
translation:
  language: id
  text: Siapa yang mempunyai telinga, hendaklah ia mendengar apa yang Roh katakan kepada jemaat-jemaat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Siapa yang
  rationale: Gabungan artikel dan partisipel berfungsi sebagai nomina dan menunjuk secara umum kepada setiap orang yang memenuhi syarat tersebut. 'Siapa yang' alami dalam bahasa Indonesia serta mempertahankan daya ungkapan yang bersifat umum.
- source_word: οὖς
  choice: bertelinga
  rationale: Nomina Yunani berbentuk tunggal. Ungkapan 'siapa yang bertelinga' mempertahankan citra telinga sekaligus terdengar wajar dalam formula seruan ini.
- source_word: ἀκουσάτω
  choice: hendaklah dia mendengarkan
  rationale: Imperatif aoris orang ketiga tunggal diterjemahkan dengan 'hendaklah' untuk mempertahankan daya perintah yang khidmat. 'Mendengarkan' menyampaikan bukan sekadar menerima bunyi, melainkan memberi perhatian pada pesan.
- source_word: τί
  choice: apa yang
  rationale: Memperkenalkan isi perkataan Roh secara alami dan tepat dalam bahasa Indonesia.
- source_word: τὸ πνεῦμα
  choice: Roh
  rationale: Dalam formula berulang Wahyu 2–3, istilah ini merujuk kepada Roh Kudus. Huruf kapital menandai referennya tanpa menambahkan kata penjelas ke dalam teks.
- source_word: λέγει
  choice: dikatakan
  rationale: Bentuk kini Yunani menyatakan perkataan Roh yang berlaku atau sedang disampaikan. Konstruksi Indonesia 'apa yang dikatakan Roh' alami dan mempertahankan Roh sebagai pelaku.
- source_word: ταῖς ἐκκλησίαις
  choice: kepada jemaat-jemaat
  rationale: Dalam Wahyu 2–3, ἐκκλησίαι menunjuk kepada komunitas-komunitas orang percaya yang disapa. 'Jemaat-jemaat' tepat secara kontekstual dan mempertahankan bentuk jamak.
theological_decisions:
- issue: Referen 'Roh'
  choice: Roh Kudus yang berbicara kepada jemaat-jemaat
  alternative: roh manusia atau roh/pesan Yesus
  rationale: Refrein berulang dalam Wahyu 2–3 menghadirkan Roh sebagai pembicara ilahi kepada semua jemaat. Penulisan 'Roh' dengan huruf kapital mempertahankan identifikasi ini tanpa memperluas teks.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Formula 'Siapa yang bertelinga, hendaklah dia mendengarkan' mempertahankan bentuk seruan yang berulang dalam Wahyu, sedangkan 'jemaat-jemaat' menjaga penekanan bentuk jamak pada seluruh komunitas yang disapa.
