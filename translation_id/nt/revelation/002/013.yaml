- from: Aku tahu di mana engkau tinggal—di tempat takhta Satan berada. Namun, engkau tetap berpegang teguh pada nama-Ku dan tidak menyangkal iman kepada-Ku,[a] bahkan pada zaman Antipas, saksi-Ku,[b] orang yang setia kepada-Ku, yang dibunuh di tengah-tengah kamu, di tempat Satan tinggal.
  to: Aku tahu di mana engkau tinggal—tempat takhta Satan berada. Namun, engkau tetap berpegang teguh pada nama-Ku dan tidak menyangkal iman-Ku,[a] bahkan pada zaman Antipas, saksi-Ku,[b] orang yang setia kepada-Ku, yang dibunuh di tengah-tengah kamu, tempat Satan tinggal.
