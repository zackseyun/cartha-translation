  naturalness: Bahasa Indonesia baku dan umumnya alami. “Di tempat takhta Satan berada” kurang langsung dibandingkan “tempat takhta Satan berada”; penghilangan “di” menghasilkan alur yang lebih idiomatis tanpa mengubah makna. Selebihnya, konstruksi apposisi mengenai Antipas jelas dan wajar.
  terminology: “Satan” sesuai dengan bentuk nama yang dipakai draf dan lazim dalam terjemahan Indonesia modern; “takhta”, “nama-Ku”, “saksi-Ku”, dan “dibunuh” tepat. “Iman-Ku” paling dekat dengan bentuk Yunani dan menjaga ketegangan antara pembacaan objektif (“iman kepada-Ku”) dan kemungkinan “kesetiaan-Ku”. Catatan untuk μάρτυς tepat.
