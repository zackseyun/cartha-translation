  - severity: low
    issue: Frasa “di tempat takhta Satan berada” agak berlebih secara idiomatis.
    rationale: Dalam klausa relatif aposisional ini, “tempat takhta Satan berada” lebih langsung dan alami dalam bahasa Indonesia, sambil mempertahankan ὅπου.
