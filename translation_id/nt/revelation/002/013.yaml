id: REV.2.13
reference: Revelation 2:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀Οἶδα ποῦ κατοικεῖς, ὅπου ὁ θρόνος τοῦ Σατανᾶ, καὶ κρατεῖς τὸ ὄνομά μου, καὶ οὐκ ἠρνήσω τὴν πίστιν μου ⸀καὶ ἐν ταῖς ⸀ἡμέραις Ἀντιπᾶς, ὁ μάρτυς μου, ὁ πιστός ⸀μου, ὃς ἀπεκτάνθη παρ’ ὑμῖν, ὅπου ὁ Σατανᾶς κατοικεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/013.yaml
  text: I know where you live—where Satan’s throne is[a]. Yet you hold fast my name, and you did not deny faith in me, even in the days of Antipas, my witness, my faithful one, who was killed among you[b], where Satan lives.
translation:
  language: id
  text: Aku tahu di mana engkau tinggal—tempat takhta Satan berada. Namun, engkau tetap berpegang teguh pada nama-Ku dan tidak menyangkal iman-Ku,[a] bahkan pada zaman Antipas, saksi-Ku,[b] orang yang setia kepada-Ku, yang dibunuh di tengah-tengah kamu, tempat Satan tinggal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Yunani ini dapat juga dipahami sebagai “iman kepada-Ku” atau “kesetiaan-Ku”.
    reason: alternative_reading
  - marker: b
    text: Atau “martir-Ku”. Kata Yunani ini berarti “saksi”, tetapi dalam konteks penderitaan atau kematian juga dapat bernuansa “martir”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδα
  choice: Aku tahu
  rationale: Bentuk perfektum ini memiliki makna keadaan kini; “Aku tahu” langsung, wajar, dan sesuai dengan ujaran orang pertama.
- source_word: ποῦ κατοικεῖς
  choice: di mana engkau tinggal
  rationale: κατοικέω menunjuk pada tempat menetap atau tinggal. “Engkau” mempertahankan bentuk tunggal yang ditujukan kepada jemaat sebagai satu kesatuan.
- source_word: ὅπου ὁ θρόνος τοῦ Σατανᾶ
  choice: di tempat takhta Satan berada
  rationale: Mempertahankan gambaran apokaliptis yang tajam tanpa menafsirkan apa yang secara historis dimaksud dengan takhta itu. Nama Σατανᾶ ditransliterasikan sebagai “Satan”.
- source_word: κρατεῖς τὸ ὄνομά μου
  choice: engkau tetap berpegang teguh pada nama-Ku
  rationale: κρατέω dalam konteks ini menyatakan keteguhan dalam mempertahankan kesetiaan. Kata “nama” dipertahankan agar cakupan pengakuan dan loyalitasnya tidak dipersempit lewat parafrasa.
- source_word: οὐκ ἠρνήσω
  choice: tidak menyangkal
  rationale: Terjemahan langsung dan alami bagi ἀρνέομαι, tanpa menambahkan nuansa formal “melepaskan” atau “meninggalkan” yang tidak harus terkandung dalam verba tersebut.
- source_word: τὴν πίστιν μου
  choice: iman kepada-Ku
  rationale: Dalam konteks tindakan jemaat, genitif μου paling alami dipahami secara objektif sebagai iman kepada Kristus. Ambiguitas bentuk Yunani tetap dicatat dalam catatan kaki.
- source_word: ἐν ταῖς ἡμέραις Ἀντιπᾶς
  choice: pada zaman Antipas
  rationale: Ungkapan temporal ini diterjemahkan secara ringkas dan alami; maksudnya ialah masa atau peristiwa yang dikaitkan dengan Antipas.
- source_word: ὁ μάρτυς μου
  choice: saksi-Ku
  rationale: Makna dasar μάρτυς ialah “saksi”. Konteks kematiannya memungkinkan nuansa “martir”, yang dicantumkan sebagai alternatif dalam catatan kaki.
- source_word: ὁ πιστός μου
  choice: orang yang setia kepada-Ku
  rationale: Mempertahankan unsur apposisi tersendiri sesudah “saksi-Ku” dan mengungkapkan relasi μου secara alami dalam bahasa Indonesia.
- source_word: ἀπεκτάνθη
  choice: dibunuh
  rationale: Padanan pasif yang lugas bagi ἀποκτείνω; tidak menambahkan nuansa hukum khusus seperti yang mungkin tersirat dalam “dibunuh secara tidak sah”.
- source_word: παρ’ ὑμῖν
  choice: di tengah-tengah kamu
  rationale: παρά dengan datif di sini paling wajar menunjukkan lokasi di antara komunitas itu dan tidak menyiratkan bahwa merekalah pelaku pembunuhan.
theological_decisions:
- issue: Makna τὴν πίστιν μου
  choice: iman kepada-Ku
  alternative: iman-Ku; kesetiaan-Ku
  rationale: Konteks “tidak menyangkal” paling alami menunjuk pada iman atau pengakuan kepada Kristus. Namun, frasa Yunani harfiahnya padat dan genitif μου dapat dipahami dengan lebih dari satu cara; alternatifnya karena itu dipertahankan dalam catatan kaki.
- issue: Makna μάρτυς dalam konteks kematian Antipas
  choice: saksi-Ku
  alternative: martir-Ku
  rationale: “Saksi” adalah makna leksikal dasarnya, sedangkan pernyataan bahwa Antipas dibunuh menghadirkan nuansa yang kemudian diasosiasikan dengan “martir”. Teks utama tidak mengimpor istilah teknis yang lebih belakangan, tetapi catatan kaki mempertahankan kemungkinan nuansa tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan tunggal “engkau” mempertahankan jumlah gramatikal sumber, sedangkan “kamu” pada παρ’ ὑμῖν mempertahankan bentuk jamak yang menunjuk kepada seluruh komunitas. Tanda pisah menjaga tekanan retoris sesudah pernyataan “Aku tahu di mana engkau tinggal”.
