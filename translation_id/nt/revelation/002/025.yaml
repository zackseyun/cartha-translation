  text: πλὴν ὃ ἔχετε κρατήσατε ἄχρι οὗ ἂν ἥξω.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/025.yaml
  text: Nevertheless[a], hold fast what you have until I come.
translation:
  language: id
  text: Namun demikian[a], peganglah teguh apa yang kalian miliki sampai Aku datang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Hanya saja, peganglah teguh apa yang kalian miliki sampai Aku datang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Namun demikian
  rationale: Ungkapan ini menyatakan pembatasan atau pengecualian terhadap uraian sebelumnya. “Namun demikian” menyampaikan daya adversatif sekaligus membatasi secara wajar dalam bahasa Indonesia, sementara kemungkinan arti “hanya saja” dipertahankan dalam catatan kaki.
- source_word: ὃ ἔχετε
  choice: apa yang kalian miliki
  rationale: Klausa relatif netral ini merujuk secara umum pada apa yang saat ini dimiliki atau dipegang oleh para penerima. “Kalian” mencerminkan bentuk jamak ἔχετε, dan “apa yang ... miliki” merupakan ungkapan Indonesia yang jelas dan alami.
- source_word: κρατήσατε
  choice: peganglah teguh
  rationale: Imperatif aoris jamak dari κρατέω menyerukan agar mereka mempertahankan dengan kokoh apa yang sudah mereka miliki. “Peganglah teguh” mempertahankan daya desakan tanpa menambahkan objek atau penafsiran yang tidak dinyatakan.
- source_word: ἄχρι οὗ ἂν
  choice: sampai
  rationale: Konstruksi ini menandai batas waktu pada masa mendatang. “Sampai” menyatakannya dengan ringkas dan alami.
- source_word: ἥξω
  choice: Aku datang
  rationale: Kata kerja ἥκω menunjuk pada datang atau tiba. Terjemahan ini mempertahankan gema kedatangan Yesus tanpa menentukan apakah yang dimaksud ialah kedatangan terakhir atau suatu kedatangan dalam penghakiman.
theological_decisions:
- issue: Apakah kedatangan Yesus di sini secara khusus berarti kedatangan eskatologis terakhir atau kedatangan dalam penghakiman/kunjungan kepada jemaat ini
  choice: sampai Aku datang
  alternative: sampai Aku datang untuk menghakimi; sampai kedatangan-Ku yang terakhir
  rationale: Teks Yunani tidak menjelaskan sifat atau waktu kedatangan itu. Rumusan sederhana ini mempertahankan ketegangan teologis dan tidak memilih salah satu penafsiran.
translation_notes:
  register: Bahasa Indonesia baku yang modern, lugas, dan bermartabat. Kata ganti “kalian” dipakai untuk mencerminkan bentuk orang kedua jamak dalam bahasa Yunani; “Aku” memakai kapital karena merupakan ucapan langsung Yesus. Penanda catatan kaki ditempatkan tepat setelah padanan πλὴν.
