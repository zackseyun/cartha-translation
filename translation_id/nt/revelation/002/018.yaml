id: REV.2.18
reference: Revelation 2:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ ⸀τῆς ἐν Θυατείροις ἐκκλησίας γράψον· Τάδε λέγει ὁ υἱὸς τοῦ θεοῦ, ὁ ἔχων τοὺς ὀφθαλμοὺς αὐτοῦ ὡς φλόγα πυρός, καὶ οἱ πόδες αὐτοῦ ὅμοιοι χαλκολιβάνῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/018.yaml
  text: 'And to the angel of the church in Thyatira write: These things says the Son of God[a], the one who has his eyes like a flame of fire[b], and his feet like burnished bronze:'
translation:
  language: id
  text: 'Dan tuliskanlah kepada malaikat[a] jemaat di Tiatira: Inilah yang dikatakan Anak Allah, Dia yang mata-Nya seperti nyala api dan kaki-Nya seperti perunggu yang berkilau[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “utusan”.
    reason: alternative_reading
  - marker: b
    text: Istilah Yunani yang diterjemahkan “perunggu yang berkilau” sangat langka dan mungkin secara lebih umum menunjuk pada logam atau paduan logam yang dimurnikan dan berpijar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: malaikat
  rationale: Dipilih sebagai makna utama dalam rumusan sapaan berulang kepada ketujuh jemaat di kitab Wahyu; makna leksikal lain, yaitu 'utusan', tetap mungkin dan dicatat dalam catatan kaki.
- source_word: ἐκκλησίας
  choice: jemaat
  rationale: Dalam konteks ini menunjuk kepada persekutuan orang Kristen setempat; 'jemaat' merupakan padanan baku dan alami dalam bahasa Indonesia.
- source_word: Τάδε λέγει
  choice: Inilah yang dikatakan
  rationale: Mempertahankan nuansa rumusan pemberitaan yang khidmat sekaligus terdengar wajar dalam bahasa Indonesia modern.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Anak Allah
  rationale: Menerjemahkan gelar kristologis tersebut secara langsung tanpa mengurangi hubungan filial dan rujukan ilahinya.
- source_word: ὁ ἔχων
  choice: Dia yang
  rationale: Menyampaikan fungsi partisipel bersubstantiva yang menguraikan identitas Sang Pembicara secara alami.
- source_word: ὀφθαλμοὺς αὐτοῦ ὡς φλόγα πυρός
  choice: mata-Nya seperti nyala api
  rationale: Mempertahankan perumpamaan dan citra apokaliptik Yunani secara ringkas dan jelas.
- source_word: πόδες αὐτοῦ ὅμοιοι χαλκολιβάνῳ
  choice: kaki-Nya seperti perunggu yang berkilau
  rationale: Istilah χαλκολίβανον sangat langka dan rujukan tepatnya tidak pasti; pilihan ini menyampaikan citra logam atau paduan logam yang cemerlang tanpa mengklaim kepastian berlebihan.
theological_decisions:
- issue: Gelar kristologis dalam pengenalan diri langsung
  choice: Anak Allah
  alternative: Tidak ada padanan alternatif yang diperlukan
  rationale: Teks Yunani secara eksplisit memakai gelar 'Anak Allah'; terjemahan mempertahankannya tanpa melemahkan atau memparafrasakannya.
- issue: Rujukan ἀγγέλῳ dalam sapaan kepada jemaat di Tiatira
  choice: malaikat
  alternative: utusan
  rationale: Konteks apokaliptik dan pola sapaan dalam Wahyu mendukung 'malaikat', tetapi kemungkinan bahwa kata ini berarti utusan tidak diselesaikan secara dogmatis dan dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Sapaan memakai bentuk imperatif 'tuliskanlah'; kapitalisasi pronomina untuk Anak Allah mengikuti kelaziman penerbitan Alkitab Indonesia. Penanda catatan kaki ditempatkan langsung setelah frasa yang diterangkannya.
