id: REV.2.9
reference: Revelation 2:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οἶδά ⸀σου τὴν θλῖψιν καὶ τὴν πτωχείαν, ἀλλὰ πλούσιος εἶ, καὶ τὴν βλασφημίαν ἐκ τῶν λεγόντων Ἰουδαίους εἶναι ἑαυτούς, καὶ οὐκ εἰσίν, ἀλλὰ συναγωγὴ τοῦ Σατανᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/009.yaml
  text: I know your affliction and your poverty—but you are rich—and the slander of those who say that they are Jews and are not[b][a], but are a synagogue of Satan.
translation:
  language: id
  text: Aku tahu kesusahanmu dan kemiskinanmu—tetapi engkau kaya—dan fitnah dari mereka yang mengatakan bahwa mereka adalah orang Yahudi, padahal bukan[a], melainkan sinagoge Satan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hujatan”. Di sini kata Yunaninya menunjuk pada perkataan bermusuhan yang mencemarkan nama orang-orang percaya, sehingga “fitnah” dipakai dalam teks utama.
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani yang diterjemahkan “sinagoge” juga dapat berarti “jemaah”, “perkumpulan”, atau “perhimpunan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: θλῖψιν
  choice: kesusahan
  rationale: Kata ini menunjuk pada tekanan, penderitaan, atau kesukaran. “Kesusahan” alami dalam bahasa Indonesia dan tidak memasukkan nuansa eskatologis teknis yang dapat melekat pada “kesengsaraan”.
- source_word: πτωχείαν
  choice: kemiskinan
  rationale: Padanan langsung dan wajar yang mempertahankan kontras dengan keadaan “kaya”.
- source_word: πλούσιος
  choice: kaya
  rationale: Mempertahankan paradoks tajam dengan kemiskinan tanpa menambahkan penjelasan bahwa kekayaan itu bersifat rohani.
- source_word: βλασφημίαν
  choice: fitnah
  rationale: Dalam konteks ini kata tersebut menunjuk pada perkataan bermusuhan yang mencemarkan nama orang percaya. “Fitnah” menyampaikan makna itu dengan lebih jelas daripada “hujat”, yang dalam pemakaian modern biasanya dipahami sebagai perkataan melawan Allah.
- source_word: ἐκ τῶν λεγόντων
  choice: dari mereka yang mengatakan
  rationale: ἐκ menyatakan sumber perkataan tersebut, sedangkan bentuk partisipelnya bersifat substantival. Susunan ini dekat dengan bahasa sumber sekaligus wajar dalam bahasa Indonesia.
- source_word: Ἰουδαίους εἶναι ἑαυτούς
  choice: bahwa mereka adalah orang Yahudi
  rationale: Menerjemahkan Ἰουδαίους secara langsung dan mengungkapkan konstruksi refleksifnya secara idiomatis tanpa menambah kata “sejati” yang tidak terdapat dalam teks.
- source_word: συναγωγὴ
  choice: jemaah
  rationale: συναγωγή dapat berarti perkumpulan atau jemaah. “Jemaah” mempertahankan gagasan komunitas yang berkumpul, sedangkan alternatif “sinagoge” dicatat agar kekhususan historis dan permainan polemisnya tetap terlihat.
- source_word: τοῦ Σατανᾶ
  choice: Satan
  rationale: Konstruksi “jemaah Satan” mempertahankan hubungan genitif dan daya polemis ungkapan itu tanpa memperlunak atau menguraikannya.
theological_decisions:
- issue: Ungkapan tentang mereka yang mengatakan bahwa mereka adalah orang Yahudi, padahal bukan
  choice: Mempertahankan “orang Yahudi” secara harfiah dan membiarkan kontrasnya sebagaimana dinyatakan teks.
  alternative: Mereka yang mengaku umat Allah tetapi bukan; mereka yang mengaku orang Yahudi sejati tetapi bukan.
  rationale: Ἰουδαίους disebut secara eksplisit. Terjemahan tidak boleh mengaburkan istilah itu ataupun menambahkan penyangkalan etnis atau kata “sejati” yang tidak ada dalam bahasa Yunani. Ketegangan mengenai keaslian identitas perjanjian tetap dibiarkan terbuka.
- issue: Sifat kekayaan yang dimaksud
  choice: 'Menerjemahkan tanpa kualifikasi: “tetapi engkau kaya”.'
  alternative: Tetapi engkau kaya secara rohani.
  rationale: Konteks menyiratkan kekayaan nonmaterial, tetapi bahasa Yunani tidak memberi kualifikasi. Penambahan “secara rohani” akan mengubah implikasi menjadi pernyataan eksplisit.
- issue: Identitas dan fungsi συναγωγὴ τοῦ Σατανᾶ
  choice: Mempertahankan ungkapan polemis sebagai “jemaah Satan”.
  alternative: Sinagoge Satan; perkumpulan milik Satan.
  rationale: Terjemahan mempertahankan metafora kepemilikan atau keterkaitan tanpa menjelaskan secara denominatif siapa yang dimaksud atau memperluas tuduhan melampaui kelompok tertentu dalam konteks ayat.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Kata ganti tunggal “engkau” mempertahankan sapaan orang kedua tunggal kepada jemaat sebagai satu kesatuan. Tanda pisah menjaga sisipan kontras yang tajam. Semua penjelasan interpretatif yang tidak eksplisit dalam bahasa Yunani ditempatkan dalam catatan, bukan dimasukkan ke teks utama.
