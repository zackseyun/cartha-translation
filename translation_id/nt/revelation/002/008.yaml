  naturalness: “Kepada malaikat jemaat di Smirna, tuliskanlah” dan “Yang Pertama dan Yang Terakhir” alami dalam bahasa Indonesia baku serta sesuai register khidmat. “Inilah yang dikatakan oleh” merupakan formula yang jelas, alami, dan dekat dengan struktur sumber. “Yang mati lalu hidup kembali” menyatakan urutan peristiwa dengan lancar tanpa memakai ungkapan kurang idiomatis “menjadi mati.”
  terminology: “Malaikat,” “jemaat,” dan kapitalisasi “Yang Pertama dan Yang Terakhir” tepat. Alternatif “utusan” tetap layak dicatat. Istilah “hidup kembali” menyampaikan kontras kebangkitan yang dituntut konteks tanpa menambahkan penjelasan doktrinal.
