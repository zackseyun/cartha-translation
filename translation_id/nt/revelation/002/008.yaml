  text: Καὶ τῷ ἀγγέλῳ ⸀τῆς ἐν Σμύρνῃ ἐκκλησίας γράψον· Τάδε λέγει ὁ πρῶτος καὶ ὁ ἔσχατος, ὃς ἐγένετο νεκρὸς καὶ ἔζησεν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/008.yaml
  text: 'And to the angel of the church in Smyrna write: These things says the First and the Last[b][a], who became dead and lived again:'
translation:
  language: id
  text: '“Kepada malaikat[a] jemaat di Smirna, tuliskanlah: Inilah yang dikatakan oleh Yang Pertama dan Yang Terakhir, yang mati lalu hidup kembali[b]:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “utusan jemaat di Smirna”.
    reason: alternative_reading
  - marker: b
    text: Atau “yang pernah mati dan hidup kembali”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: malaikat
  rationale: Dalam konteks apokaliptik Kitab Wahyu, ‘malaikat’ merupakan makna yang paling wajar, meskipun ‘utusan’ tetap mungkin secara leksikal dan dicatat dalam catatan kaki.
- source_word: ἐκκλησίας
  choice: jemaat
  rationale: Di sini kata ini menunjuk kepada komunitas orang percaya setempat. ‘Jemaat’ alami dalam bahasa Indonesia dan mempertahankan makna komunal-keagamaannya.
- source_word: Τάδε λέγει
  choice: Inilah firman
  rationale: Ungkapan ini menyampaikan formula pewartaan yang khidmat dan berulang dalam pasal ini. ‘Firman’ digunakan dalam arti perkataan atau pesan resmi, tanpa menambahkan penjelasan teologis.
- source_word: ὁ πρῶτος καὶ ὁ ἔσχατος
  choice: Yang Pertama dan Yang Terakhir
  rationale: Frasa ini berfungsi sebagai gelar Kristologis. Huruf kapital menandai fungsi gelar tersebut dan mempertahankan gema bahasa gelar ilahi.
- source_word: ἐγένετο νεκρὸς
  choice: pernah mati
  rationale: Pilihan ini alami dalam bahasa Indonesia dan menyatakan bahwa Ia sungguh memasuki kematian, bukan sekadar berada dalam keadaan tidak bernyawa. Nuansa yang lebih harfiah dicatat dalam catatan kaki.
- source_word: ἔζησεν
  choice: hidup kembali
  rationale: Dalam pertentangannya dengan kematian, bentuk ini secara alami menyampaikan bahwa Ia kembali hidup; terjemahan ‘hidup’ saja terlalu lemah dalam bahasa Indonesia.
theological_decisions:
- issue: Gelar Kristologis dan ungkapan kematian serta kebangkitan
  choice: Yang Pertama dan Yang Terakhir, yang pernah mati dan hidup kembali
  alternative: yang pertama dan yang terakhir, yang menjadi mati dan hidup
  rationale: Terjemahan mempertahankan frasa sebagai gelar dan menyatakan kematian serta kembalinya Yesus kepada kehidupan tanpa menambahkan uraian doktrinal. Bentuk ‘pernah mati’ menjaga realitas peristiwa kematian, sedangkan ‘hidup kembali’ mengungkapkan kontras yang jelas dalam konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mempertahankan bentuk perintah serta formula pewartaan teks Yunani, sambil memakai ungkapan yang alami bagi pembaca umum.
