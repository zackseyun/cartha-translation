    rationale: ὡς λέγουσιν secara eliptis mengacu pada ungkapan sebelumnya. "Sebagaimana mereka menyebutnya" menyatakan hubungan itu secara idiomatis, sambil tetap membiarkan identitas pembicara terbuka.
  - severity: low
    issue: '"Menanggungkan beban lain kepada kalian" kurang alami dalam bahasa Indonesia baku.'
    rationale: Untuk βάλλω ἐπί + akusatif, "meletakkan beban lain atas kalian" mempertahankan metafora tindakan mengenakan beban dan menghasilkan kolokasi Indonesia yang lebih wajar.
  - severity: low
    issue: Pilihan alternatif "kedalaman-kedalaman Iblis" dalam catatan kaki tidak lazim.
    rationale: Bentuk jamak reduplikatif tersebut terdengar janggal. "Kedalaman Iblis" merupakan alternatif idiomatis yang memadai untuk menjelaskan kemungkinan terjemahan βαθέα.
