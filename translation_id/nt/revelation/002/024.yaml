id: REV.2.24
reference: Revelation 2:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὑμῖν δὲ λέγω τοῖς λοιποῖς τοῖς ἐν Θυατείροις, ὅσοι οὐκ ἔχουσιν τὴν διδαχὴν ταύτην, οἵτινες οὐκ ἔγνωσαν τὰ βαθέα τοῦ Σατανᾶ, ὡς λέγουσιν, οὐ βάλλω ἐφ’ ὑμᾶς ἄλλο βάρος·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/024.yaml
  text: 'But to the rest of you in Thyatira I say: all who do not hold this teaching[a], who have not known the deep things of Satan, as they call them—I am not laying any other burden on you.'
translation:
  language: id
  text: 'Namun, kepada kalian yang lain di Tiatira Aku berkata: kepada semua yang tidak menganut ajaran ini dan yang tidak mengenal hal-hal mendalam dari Iblis, sebagaimana mereka menyebutnya[a], Aku tidak meletakkan beban lain atas kalian.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kedalaman Iblis.” Ungkapan Yunani ini mungkin menggemakan klaim tentang pengetahuan rohani yang “mendalam,” tetapi teks tidak menjelaskan secara pasti siapa yang memakai sebutan tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς λοιποῖς τοῖς ἐν Θυατείροις
  choice: kepada kalian yang lain di Tiatira
  rationale: Ungkapan ini menunjuk kepada anggota jemaat lainnya di Tiatira, dibedakan dari mereka yang menerima ajaran yang dikecam. “Kalian yang lain” alami dalam bahasa Indonesia dan mempertahankan kontras tersebut.
- source_word: ἔχουσιν τὴν διδαχὴν ταύτην
  choice: menganut ajaran ini
  rationale: Dalam konteks ini, ἔχω bersama διδαχή menyatakan penerimaan atau keterikatan pada suatu ajaran, bukan sekadar memilikinya. “Menganut” menyampaikan makna itu tanpa menambahkan gagasan yang tidak terdapat dalam teks.
- source_word: οἵτινες οὐκ ἔγνωσαν
  choice: yang tidak mengenal
  rationale: Kata ἔγνωσαν dapat mencakup pengetahuan atau pengalaman. “Tidak mengenal” mempertahankan keluasan makna tersebut dan tidak menentukan apakah yang dimaksud hanya pemahaman intelektual atau keterlibatan langsung.
- source_word: τὰ βαθέα τοῦ Σατανᾶ
  choice: hal-hal mendalam dari Iblis
  rationale: Terjemahan ini mempertahankan gambaran harfiah tentang hal-hal yang “dalam” serta kemungkinan nada ironis terhadap klaim mengenai wawasan rohani yang mendalam. “Iblis” adalah padanan Indonesia yang lazim untuk Σατανᾶ dalam konteks ini.
- source_word: ὡς λέγουσιν
  choice: seperti kata mereka
  rationale: Rumusan ini mempertahankan ketidakjelasan teks mengenai siapa tepatnya yang mengucapkan sebutan tersebut dan bagaimana ungkapan itu dimaksudkan, alih-alih menjelaskannya secara berlebihan sebagai sebuah nama resmi.
- source_word: οὐ βάλλω ἐφ’ ὑμᾶς ἄλλο βάρος
  choice: Aku tidak menanggungkan beban lain kepada kalian
  rationale: “Menanggungkan ... kepada” menyampaikan idiom βάλλω ἐπί sebagai tindakan mengenakan suatu kewajiban, sedangkan “beban” mempertahankan metafora βάρος.
theological_decisions:
- issue: Maksud ungkapan “hal-hal mendalam dari Iblis, seperti kata mereka”
  choice: Menyajikannya sebagai sebutan yang dilaporkan dengan nada polemis tanpa menentukan secara pasti apakah itu kutipan dari para pengajar palsu atau penilaian ironis terhadap ajaran mereka.
  alternative: Menjelaskan bahwa para pengajar itu hanya mengaku memiliki pengetahuan yang mendalam, sedangkan Yohanes secara eksplisit menamai sumbernya sebagai Iblis.
  rationale: Susunan Yunani ringkas dan memungkinkan lebih dari satu pemahaman tentang suara yang sedang dikutip. Terjemahan mempertahankan ketegangan retoris dan tidak menetapkan maksud yang lebih khusus daripada teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti jamak “kalian” memperjelas bahwa sapaan ditujukan kepada anggota jemaat. “Aku” dipertahankan sebagai bentuk langsung dalam ucapan Kristus, sedangkan struktur kalimat dibuat alami tanpa menghapus kepadatan dan ambiguitas ungkapan Yunani.
