id: REV.15.8
reference: Revelation 15:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐγεμίσθη ὁ ναὸς καπνοῦ ἐκ τῆς δόξης τοῦ θεοῦ καὶ ἐκ τῆς δυνάμεως αὐτοῦ, καὶ οὐδεὶς ἐδύνατο εἰσελθεῖν εἰς τὸν ναὸν ἄχρι τελεσθῶσιν αἱ ἑπτὰ πληγαὶ τῶν ἑπτὰ ἀγγέλων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/008.yaml
  text: And the sanctuary was filled with smoke from the glory of God and from his power[a], and no one was able to enter the sanctuary until the seven plagues of the seven angels were finished.
translation:
  language: id
  text: Dan tempat kudus[a] itu dipenuhi asap dari kemuliaan Allah dan dari kuasa-Nya, dan tidak seorang pun dapat masuk ke dalam tempat kudus itu sampai ketujuh malapetaka dari ketujuh malaikat itu selesai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Bait Allah” untuk “tempat kudus” (Yunani ναός); istilah ini sering menunjuk lebih khusus kepada tempat kediaman ilahi yang kudus daripada seluruh kompleks Bait Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὸς
  choice: tempat kudus
  rationale: Dalam konteks Wahyu, ναός menunjuk secara khusus pada ruang kediaman ilahi yang kudus, bukan seluruh kompleks Bait Allah; “tempat kudus” menyampaikan kekhususan itu secara alami dalam bahasa Indonesia.
- source_word: ἐγεμίσθη
  choice: dipenuhi
  rationale: Bentuk pasif aoris ini diterjemahkan dengan bentuk pasif Indonesia yang langsung dan wajar.
- source_word: καπνοῦ
  choice: asap
  rationale: “Asap” merupakan padanan lazim dan sesuai dengan gambaran penampakan ilahi dalam konteks ini.
- source_word: ἐκ τῆς δόξης τοῦ θεοῦ
  choice: yang berasal dari kemuliaan Allah
  rationale: ἐκ menyatakan sumber atau asal; penambahan “yang berasal” memperjelas bahwa asap itu bersumber dari kemuliaan Allah.
- source_word: ἐκ τῆς δυνάμεως αὐτοῦ
  choice: dan dari kuasa-Nya
  rationale: Padanan ini mempertahankan konstruksi sumber yang sejajar serta menerjemahkan δύναμις secara langsung sebagai kuasa.
- source_word: οὐδεὶς ἐδύνατο
  choice: tidak seorang pun dapat
  rationale: Ungkapan ini menyampaikan ketidakmampuan secara alami dan tetap sesuai dengan nuansa imperfek Yunani.
- source_word: ἄχρι τελεσθῶσιν
  choice: sampai ... selesai
  rationale: Padanan ini menyatakan batas waktu dan hasil akhir dari bentuk pasif subjungtif tanpa bahasa yang kaku.
- source_word: πληγαὶ
  choice: malapetaka
  rationale: Dalam Wahyu, πληγή menunjuk pada pukulan penghukuman ilahi. “Malapetaka” alami dalam bahasa Indonesia dan tidak membatasi maknanya pada wabah penyakit.
- source_word: τῶν ἑπτὰ ἀγγέλων
  choice: yang dibawa ketujuh malaikat itu
  rationale: Genitif menyatakan hubungan malapetaka dengan para malaikat. “Dibawa” membuat hubungan kontekstual itu jelas tanpa menyatakan bahwa para malaikat adalah sumber utama malapetaka tersebut.
theological_decisions:
- issue: Makna ναός dalam konteks ibadah surgawi apokaliptis
  choice: tempat kudus
  alternative: Bait Allah
  rationale: “Tempat kudus” lebih tepat menunjuk pada kediaman ilahi yang paling suci dan menghindari kesan bahwa seluruh kompleks Bait Allah dimaksudkan, tanpa menambahkan klaim doktrinal.
- issue: Hubungan ketujuh malapetaka dengan ketujuh malaikat
  choice: malapetaka yang dibawa ketujuh malaikat
  alternative: malapetaka milik ketujuh malaikat
  rationale: Konteks sebelumnya menggambarkan para malaikat membawa malapetaka. Rumusan ini menjelaskan hubungan genitif dengan bahasa Indonesia yang wajar, tetapi tidak menjadikan malaikat sebagai sumber ilahi dari penghukuman.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat mempertahankan dua klausa utama Yunani dan pengulangan “tempat kudus” demi kejelasan serta penekanan. Tidak diperlukan catatan kaki karena “tempat kudus” merupakan padanan yang tepat dan alami; alternatif “Bait Allah” didokumentasikan dalam keputusan penerjemahan.
