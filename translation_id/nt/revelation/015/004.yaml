  to: Siapakah yang tidak akan takut kepada-Mu, ya Tuhan, dan memuliakan nama-Mu? Sebab hanya Engkaulah yang kudus. Sebab semua bangsa akan datang dan menyembah di hadapan-Mu, sebab tindakan-Mu yang adil[a] telah dinyatakan.
