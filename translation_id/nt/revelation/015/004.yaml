id: REV.15.4
reference: Revelation 15:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τίς οὐ μὴ ⸀φοβηθῇ, κύριε, καὶ ⸀δοξάσει τὸ ὄνομά σου, ὅτι μόνος ⸀ὅσιος; ὅτι πάντα τὰ ἔθνη ἥξουσιν καὶ προσκυνήσουσιν ἐνώπιόν σου, ὅτι τὰ δικαιώματά σου ἐφανερώθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/004.yaml
  text: Who will not fear[a], Lord, and glorify your name? For you alone are holy. For all the nations will come and worship before you, because your righteous acts have been revealed.
translation:
  language: id
  text: Siapakah yang tidak akan takut kepada-Mu, ya Tuhan, dan memuliakan nama-Mu? Sebab hanya Engkaulah yang kudus. Sebab semua bangsa akan datang dan menyembah di hadapan-Mu, sebab tindakan-Mu yang adil[a] telah dinyatakan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penghakiman-penghakiman-Mu yang adil”; istilah Yunani ini juga dapat menunjuk pada putusan hukum atau ketetapan, tetapi di sini kemungkinan besar menunjuk pada tindakan adil Allah yang telah dinyatakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς οὐ μὴ φοβηθῇ
  choice: Siapakah yang tidak akan takut kepada-Mu
  rationale: Pertanyaan retoris dengan οὐ μή sangat kuat dan mengharapkan jawaban ‘tidak seorang pun’. ‘Tidak akan takut’ mempertahankan orientasi ke depan, sedangkan ‘kepada-Mu’ menyatakan objek yang tersirat dari sapaan κύριε secara alami dalam bahasa Indonesia.
- source_word: κύριε
  choice: ya Tuhan
  rationale: Bentuk vokatif κύριος diterjemahkan sebagai sapaan langsung yang wajar dan khidmat dalam bahasa Indonesia.
- source_word: δοξάσει τὸ ὄνομά σου
  choice: memuliakan nama-Mu
  rationale: Mempertahankan ungkapan alkitabiah tentang memberi kemuliaan kepada nama Allah, yakni pribadi dan reputasi-Nya yang dinyatakan.
- source_word: μόνος ὅσιος
  choice: hanya Engkaulah yang kudus
  rationale: Dalam doksologi ini, ὅσιος menyatakan kesucian dan kelurusan moral Allah. Susunan ini menegaskan bahwa sifat tersebut secara unik melekat pada-Nya.
- source_word: πάντα τὰ ἔθνη
  choice: semua bangsa
  rationale: ἔθνη di sini bersifat menyeluruh dan menunjuk berbagai bangsa yang datang menyembah, bukan hanya kategori ‘orang bukan Yahudi’.
- source_word: ἥξουσιν
  choice: akan datang
  rationale: Bentuk mendatang diterjemahkan langsung dan alami dalam konteks nubuat.
- source_word: προσκυνήσουσιν ἐνώπιόν σου
  choice: menyembah di hadapan-Mu
  rationale: Dalam konteks liturgis kitab Wahyu, προσκυνέω menunjuk penyembahan, sementara ἐνώπιόν σου dipertahankan sebagai ‘di hadapan-Mu’.
- source_word: τὰ δικαιώματά σου
  choice: perbuatan-perbuatan-Mu yang benar
  rationale: δικαίωμα dapat menunjuk tindakan benar, keputusan hukum, atau ketetapan. Konteks menekankan keadilan Allah yang telah tampak dalam tindakan-Nya; bentuk jamak dipertahankan.
- source_word: ἐφανερώθησαν
  choice: telah dinyatakan
  rationale: Aoristus pasif menyatakan bahwa hal-hal itu telah dibuat nyata; ‘telah dinyatakan’ menyampaikan tindakan yang selesai dengan relevansi kini.
theological_decisions:
- issue: Makna ὅσιος dalam doksologi kepada Allah
  choice: kudus
  alternative: setia; saleh
  rationale: ‘Kudus’ paling sesuai dengan pujian kepada sifat Allah yang unik dan dengan konteks penyembahan, tanpa mempersempit maknanya hanya menjadi kesetiaan perjanjian.
- issue: Makna δικαιώματα dalam konteks penghakiman apokaliptik
  choice: perbuatan-perbuatan-Mu yang benar
  alternative: penghakiman-penghakiman-Mu yang adil; ketetapan-ketetapan-Mu
  rationale: Pilihan ini mempertahankan keluasan istilah Yunani dan menyoroti keadilan Allah yang tampak melalui tindakan-Nya, tanpa membatasinya pada putusan pengadilan atau peraturan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Pronomina ilahi ditulis dengan huruf kapital sesuai kelaziman penerbitan Alkitab Indonesia. Penanda catatan kaki ditempatkan sesudah frasa yang diterangkannya, yaitu ‘perbuatan-perbuatan-Mu yang benar’.
