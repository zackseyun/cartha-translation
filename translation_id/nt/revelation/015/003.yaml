id: REV.15.3
reference: Revelation 15:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν τὴν ᾠδὴν Μωϋσέως τοῦ δούλου τοῦ θεοῦ καὶ τὴν ᾠδὴν τοῦ ἀρνίου λέγοντες· Μεγάλα καὶ θαυμαστὰ τὰ ἔργα σου, κύριε, ὁ θεός, ὁ παντοκράτωρ· δίκαιαι καὶ ἀληθιναὶ αἱ ὁδοί σου, ὁ βασιλεὺς τῶν ⸀αἰώνων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/003.yaml
  text: 'And they sing the song of Moses[a], the servant of God, and the song of the Lamb, saying: “Great and marvelous are your works, Lord God, the Almighty; righteous and true are your ways, O King of the ages.”'
translation:
  language: id
  text: 'Dan mereka menyanyikan nyanyian Musa, hamba Allah, dan nyanyian Anak Domba, demikian: “Besar dan menakjubkan segala karya-Mu, ya Tuhan, Allah Yang Mahakuasa; adil dan benar jalan-jalan-Mu, ya Raja segala zaman.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah berbunyi “ya Raja segala bangsa” sebagai ganti “ya Raja segala zaman.”
    reason: textual_variant
lexical_decisions:
- source_word: ᾄδουσιν
  choice: mereka menyanyikan
  rationale: Bentuk kini indikatif dalam laporan penglihatan diterjemahkan secara alami sebagai tindakan yang sedang ditampilkan dalam narasi.
- source_word: τὴν ᾠδὴν Μωϋσέως
  choice: nyanyian Musa
  rationale: Nyanyian merupakan padanan langsung dan alami bagi ᾠδή tanpa menambahkan nuansa liturgis khusus.
- source_word: τοῦ δούλου τοῦ θεοῦ
  choice: hamba Allah
  rationale: Dalam gelar Alkitabiah bagi Musa, hamba menyatakan kepunyaan, ketundukan, dan tugas yang dipercayakan Allah; padanan ini lebih alami dan bermartabat dalam bahasa Indonesia daripada budak, tanpa menghilangkan relasi pengabdian.
- source_word: τοῦ ἀρνίου
  choice: Anak Domba
  rationale: Dalam Wahyu, istilah ini merupakan gelar kristologis; kapitalisasi mempertahankan fungsi gelarnya dan citra korban serta Mesias.
- source_word: λέγοντες
  choice: demikian
  rationale: Kata ini secara alami memperkenalkan isi nyanyian dalam bahasa Indonesia; terjemahan harfiah dengan berkata akan terasa kaku setelah verba menyanyikan.
- source_word: Μεγάλα καὶ θαυμαστὰ τὰ ἔργα σου
  choice: Besar dan menakjubkan segala karya-Mu
  rationale: Susunan predikatif Yunani dipertahankan dalam bentuk Indonesia yang puitis dan jelas; segala menyampaikan bentuk jamak kolektif tanpa menambah gagasan asing.
- source_word: κύριε, ὁ θεός, ὁ παντοκράτωρ
  choice: ya Tuhan, Allah Yang Mahakuasa
  rationale: Semua unsur sapaan dan gelar dipertahankan dalam susunan Indonesia yang alami dan khidmat.
- source_word: δίκαιαι καὶ ἀληθιναὶ αἱ ὁδοί σου
  choice: adil dan benar jalan-jalan-Mu
  rationale: Adil menyatakan kelurusan moral dan keadilan ilahi, sedangkan benar mencakup kebenaran serta keterandalan; bentuk jamak jalan-jalan mempertahankan αἱ ὁδοί.
- source_word: ὁ βασιλεὺς τῶν αἰώνων
  choice: ya Raja segala zaman
  rationale: Mengikuti teks SBLGNT αἰώνων dan menyampaikan pemerintahan Allah melintasi seluruh zaman secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Padanan δοῦλος sebagai gelar Musa
  choice: hamba Allah
  alternative: budak Allah
  rationale: Konteksnya adalah gelar kehormatan bagi Musa yang menekankan bahwa ia milik Allah dan menjalankan amanat-Nya. Hamba mempertahankan ketundukan dan pengabdian itu dalam ragam Indonesia yang wajar, sedangkan budak berisiko terutama membangkitkan gambaran sosial modern yang tidak menjadi fokus gelar ini.
- issue: Bentuk tekstual gelar ilahi pada akhir ayat
  choice: Raja segala zaman
  alternative: Raja segala bangsa
  rationale: Teks utama mengikuti SBLGNT, yaitu αἰώνων, 'zaman-zaman'. Varian ἐθνῶν, 'bangsa-bangsa', penting secara tekstual dan dicatat tanpa menggantikan bacaan sumber yang diberikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk sapaan “ya” menandai vokatif Yunani secara alami. Kapitalisasi pada Anak Domba dan pronomina ilahi mengikuti fungsi gelar serta kebiasaan penerbitan Alkitab Indonesia.
