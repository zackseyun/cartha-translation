id: REV.15.6
reference: Revelation 15:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐξῆλθον οἱ ἑπτὰ ἄγγελοι οἱ ἔχοντες τὰς ἑπτὰ πληγὰς ἐκ τοῦ ναοῦ, ⸀ἐνδεδυμένοι ⸀λίνον καθαρὸν λαμπρὸν καὶ περιεζωσμένοι περὶ τὰ στήθη ζώνας χρυσᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/006.yaml
  text: And the seven angels who had the seven plagues came out from the sanctuary[a], clothed in clean, bright linen[c][b], and wrapped around the chest with golden sashes.
translation:
  language: id
  text: Lalu ketujuh malaikat yang membawa ketujuh malapetaka itu keluar dari tempat kudus[a]. Mereka berpakaian linen yang bersih dan berkilau[b], dan dada mereka dililit selempang emas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Bait Allah”; kata Yunani ναός biasanya menunjuk secara khusus pada tempat kudus, bukan seluruh kompleks Bait Allah.
    reason: lexical_alternative
  - marker: b
    text: Atau “linen yang murni dan bercahaya.”
    reason: lexical_alternative
  - marker: c
    text: Atau “mereka mengenakan sabuk emas di sekeliling dada.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: keluar
  rationale: Kata kerja aoris ἐξέρχομαι menyatakan gerakan dari dalam ke luar; “keluar” merupakan padanan Indonesia yang langsung dan alami.
- source_word: ἄγγελοι
  choice: malaikat
  rationale: Dalam konteks penglihatan surgawi Wahyu, yang dimaksud ialah makhluk surgawi, bukan utusan manusia.
- source_word: οἱ ἔχοντες
  choice: yang membawa
  rationale: ἔχω secara harfiah berarti “mempunyai/memegang”, tetapi dalam konteks para malaikat yang ditugaskan mencurahkan malapetaka, “membawa” mengungkapkan hubungan itu secara alami tanpa menentukan lebih jauh cara mereka memilikinya.
- source_word: πληγάς
  choice: malapetaka
  rationale: Dalam Wahyu, πληγή menunjuk pada pukulan atau bencana penghukuman ilahi; “malapetaka” jelas dan sesuai dengan konteks rangkaian hukuman ini.
- source_word: ναοῦ
  choice: tempat kudus
  rationale: ναός biasanya menunjuk secara khusus pada ruang suci atau bagian dalam Bait Allah, bukan seluruh kompleksnya. “Tempat kudus” mempertahankan kekhususan tersebut.
- source_word: ἐνδεδυμένοι
  choice: berpakaian
  rationale: Partisipel perfektum ini menggambarkan keadaan para malaikat yang telah mengenakan pakaian; “berpakaian” alami sekaligus bermartabat dalam bahasa Indonesia.
- source_word: λίνον
  choice: linen
  rationale: Kata ini menunjuk pada kain linen. Bentuk “linen” sudah lazim dalam bahasa Indonesia dan tidak menambahkan gagasan “halus” yang tidak dinyatakan oleh kata tersendiri dalam teks.
- source_word: καθαρὸν λαμπρὸν
  choice: yang bersih dan berkilau
  rationale: καθαρός menyatakan kebersihan atau kemurnian, sedangkan λαμπρός menyatakan kilau atau kecemerlangan. Pasangan ini mempertahankan kedua unsur deskripsi.
- source_word: περιεζωσμένοι περὶ τὰ στήθη
  choice: dada mereka dililit
  rationale: Ungkapan ini menyatakan bahwa sesuatu diikatkan atau dililitkan mengelilingi bagian dada. Susunan pasif ini jelas dan alami dalam bahasa Indonesia.
- source_word: ζώνας χρυσᾶς
  choice: selempang emas
  rationale: ζώνη dapat berarti ikat pinggang, sabuk, atau selempang. Karena benda itu dikenakan pada dada, “selempang” lebih sesuai dengan gambaran daripada “ikat pinggang”.
theological_decisions:
- issue: Makna ναός dalam gambaran Bait Allah surgawi
  choice: tempat kudus
  alternative: Bait Allah
  rationale: “Tempat kudus” menjaga arti lebih khusus dari ναός sebagai ruang suci bagian dalam, sedangkan “Bait Allah” dapat dipahami sebagai seluruh kompleks. Alternatif dicatat agar cakupan istilah Yunani tetap transparan.
translation_notes:
  register: Bahasa Indonesia modern yang jelas dan bermartabat. Kalimat dibagi menjadi dua agar rangkaian partisipel Yunani tidak terasa berat. Istilah “tempat kudus” mempertahankan kekhususan ναός, sedangkan “selempang emas” menghadirkan secara alami benda yang dikenakan pada bagian dada.
