id: REV.15.7
reference: Revelation 15:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἓν ἐκ τῶν τεσσάρων ζῴων ἔδωκεν τοῖς ἑπτὰ ἀγγέλοις ἑπτὰ φιάλας χρυσᾶς γεμούσας τοῦ θυμοῦ τοῦ θεοῦ τοῦ ζῶντος εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/007.yaml
  text: And one of the four living creatures gave to the seven angels seven golden bowls full of the wrath of God[b][a], who lives forever and ever.
translation:
  language: id
  text: Lalu salah satu dari keempat makhluk hidup itu memberikan kepada ketujuh malaikat tujuh cawan emas yang penuh dengan murka Allah, yang hidup selama-lamanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἓν ἐκ τῶν τεσσάρων ζῴων
  choice: salah satu dari keempat makhluk hidup itu
  rationale: ζῷον menunjuk pada makhluk ruang takhta, bukan binatang biasa; “makhluk hidup” juga membedakannya dari θηρίον, “binatang,” dalam Wahyu.
- source_word: ἔδωκεν τοῖς ἑπτὰ ἀγγέλοις
  choice: memberikan kepada ketujuh malaikat
  rationale: Menerjemahkan bentuk aoristus δίδωμι dan datif penerima secara langsung dan alami dalam bahasa Indonesia.
- source_word: ἑπτὰ φιάλας χρυσᾶς
  choice: tujuh cawan emas
  rationale: φιάλη adalah wadah berbentuk mangkuk atau cawan yang relatif lebar dan dangkal; “cawan” merupakan padanan Indonesia yang jelas dalam konteks ini, sedangkan “emas” mempertahankan keterangan bahannya.
- source_word: γεμούσας τοῦ θυμοῦ τοῦ θεοῦ
  choice: yang penuh dengan murka Allah
  rationale: Partisip γέμω dengan genitif menyatakan isi atau kepenuhan. “Murka” mempertahankan bobot penghakiman ilahi dari θυμός tanpa mereduksinya menjadi emosi sesaat.
- source_word: τοῦ ζῶντος εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: yang hidup selama-lamanya
  rationale: Partisip tersebut menerangkan Allah, sedangkan ungkapan idiomatis εἰς τοὺς αἰῶνας τῶν αἰώνων menyatakan keberlangsungan tanpa akhir; “selama-lamanya” alami dan bermartabat dalam bahasa Indonesia.
theological_decisions:
- issue: Istilah untuk θυμός ilahi
  choice: murka Allah
  alternative: amarah Allah; kemurkaan Allah
  rationale: “Murka” menjaga nuansa penghakiman eskatologis yang kuat dan khidmat, tanpa menambahkan gagasan teologis yang tidak dinyatakan teks.
- issue: Hubungan sebutan Allah yang hidup dengan kekekalan
  choice: Allah, yang hidup selama-lamanya
  alternative: Allah yang hidup, sampai selama-lamanya; Allah, Sang Hidup, dari zaman ke zaman
  rationale: Klausa relatif menunjukkan dengan jelas bahwa τοῦ ζῶντος menerangkan Allah dan bahwa frasa berikutnya menyatakan kekekalan hidup-Nya, tanpa mengubahnya menjadi gelar tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan struktur yang tetap dekat pada susunan Yunani. “Lalu” mengalirkan narasi καί secara alami; artikel pada makhluk dan malaikat dicerminkan melalui “itu” dan bentuk ke-.
