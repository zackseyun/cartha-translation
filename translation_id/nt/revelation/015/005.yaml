  text: Καὶ μετὰ ταῦτα εἶδον, καὶ ἠνοίγη ὁ ναὸς τῆς σκηνῆς τοῦ μαρτυρίου ἐν τῷ οὐρανῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/005.yaml
  text: And after these things I saw[a], and the temple of the tabernacle of the testimony in heaven was opened[b],
translation:
  language: id
  text: 'Dan sesudah semuanya itu aku melihat: Bait Suci[a] Kemah Kesaksian[b] di surga dibuka.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “Bait Suci” (ναός) dapat secara khusus menunjuk pada tempat suci bagian dalam, bukan seluruh kompleks Bait Allah.
    reason: lexical_alternative
  - marker: b
    text: “Kemah Kesaksian” menggemakan bahasa Perjanjian Lama tentang tempat suci, khususnya Kemah Suci di padang gurun yang berkaitan dengan kesaksian perjanjian Allah.
    reason: cross_reference
lexical_decisions:
- source_word: Καὶ μετὰ ταῦτα
  choice: Dan sesudah semuanya itu
  rationale: Mempertahankan penghubung naratif Καί serta bentuk jamak ταῦτα, sekaligus tetap alami dalam bahasa Indonesia.
- source_word: εἶδον
  choice: aku melihat
  rationale: Bentuk aoris ὁράω melaporkan persepsi dalam penglihatan; “melihat” merupakan padanan langsung tanpa menggeser tekanan kepada tindakan memandang.
- source_word: ἠνοίγη
  choice: dibuka
  rationale: Bentuk aoris pasif menyatakan bahwa bait suci itu dibuat terbuka; “dibuka” mempertahankan bentuk pasif dan tidak menambahkan pelaku yang tidak disebutkan.
- source_word: ὁ ναὸς
  choice: bait suci
  rationale: ναός menunjuk pada tempat suci atau bangunan bait itu sendiri, sering kali dengan nuansa ruang suci bagian dalam, bukan seluruh kompleks Bait Allah.
- source_word: τῆς σκηνῆς
  choice: dari Kemah
  rationale: Dalam konteks ibadah alkitabiah, σκηνή merujuk pada Kemah Suci; bentuk “dari” mempertahankan hubungan genitif yang bertumpuk dalam bahasa Yunani.
- source_word: τοῦ μαρτυρίου
  choice: Kesaksian
  rationale: μαρτύριον dalam ungkapan kultis ini menggemakan sebutan Perjanjian Lama bagi kemah yang berkaitan dengan kesaksian perjanjian Allah.
- source_word: ἐν τῷ οὐρανῷ
  choice: di surga
  rationale: Ungkapan ini menempatkan bait suci tersebut dalam ranah surgawi dan diterjemahkan secara idiomatis dalam bahasa Indonesia.
theological_decisions:
- issue: Gambaran ibadah tentang tempat suci surgawi
  choice: bait suci dari Kemah Kesaksian di surga
  alternative: tempat suci surgawi; bait suci di surga, yaitu Kemah Kesaksian
  rationale: Susunan genitif Yunani dipertahankan agar hubungan antara bait suci, Kemah Kesaksian, dan lokasi surgawi tidak disederhanakan atau ditafsirkan secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan “dan” mempertahankan gaya naratif parataktis Yohanes, sedangkan kapitalisasi “Kemah Kesaksian” menandai sebutan kultis yang khas.
