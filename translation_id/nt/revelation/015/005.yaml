  naturalness: Kalimat revisi memakai titik dua untuk menandai isi yang dilihat Yohanes, sehingga tetap mempertahankan gaya ringkas dan parataktis tanpa rangkaian “aku melihat, dan ... dibuka” yang kaku dalam bahasa Indonesia. “Bait suci Kemah Kesaksian” mempertahankan kepadatan ungkapan kultis tanpa menambahkan penafsiran seperti “yaitu.”
  terminology: “Bait suci” tepat untuk ναός, dengan catatan alternatif “tempat suci.” “Kemah Kesaksian” mempertahankan gema istilah Perjanjian Lama dan lebih baik dipertahankan sebagai sebutan kultis. “Surga” tepat untuk οὐρανός dalam konteks ini.
