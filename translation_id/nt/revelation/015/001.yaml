review_pass:
  verdict: revise
  source_fidelity: Draf secara umum setia pada susunan dan istilah utama teks Yunani. Namun, “dengan semua itu” menggeser ἐν αὐταῖς (“di dalamnya/di dalam malapetaka-malapetaka itu”) ke gagasan sarana yang lebih longgar, dan “mencapai akhirnya” terutama menyatakan berakhirnya murka, sedangkan ἐτελέσθη menyatakan bahwa murka itu dituntaskan atau mencapai penyelesaiannya dalam malapetaka tersebut.
  naturalness: Bahasa draf baku dan mudah dipahami. “Di dalam malapetaka-malapetaka itu” lebih eksplisit dan tetap alami dalam register khidmat Wahyu. “Telah dituntaskan” mengungkapkan hasil aoris pasif secara idiomatis.
  terminology: “Tanda,” “surga,” “malaikat,” “malapetaka,” dan “murka Allah” tepat dan konsisten dengan penggunaan Indonesia modern dalam konteks apokaliptis. “Malapetaka” mempertahankan cakupan πληγαί tanpa membatasinya pada penyakit.
  issues:
  - severity: medium
    issue: Padanan “dengan semua itu” untuk ἐν αὐταῖς
    rationale: Preposisi ἐν dan pronomina feminin jamak merujuk pada ketujuh malapetaka sebagai lingkup tempat murka Allah dituntaskan. “Dengan” dapat menyiratkan sarana dan “semua itu” kurang langsung menandai rujukan tersebut.
  - severity: medium
    issue: Padanan “mencapai akhirnya” untuk ἐτελέσθη
    rationale: Ungkapan ini dapat dipahami sebagai murka Allah berhenti, sedangkan verba pasif τελέω menekankan bahwa murka itu telah dibawa kepada penyelesaian atau penuntasannya. Terjemahan perlu mempertahankan nuansa penyelesaian tanpa memperluas maknanya.
  revised_text: 'Lalu aku melihat suatu tanda lain di surga, yang besar dan menakjubkan: tujuh malaikat membawa tujuh malapetaka terakhir, sebab di dalam malapetaka-malapetaka itu murka Allah telah dituntaskan.[a]'
  revised_footnotes:
