- from: 'Lalu aku melihat suatu tanda lain di surga, yang besar dan menakjubkan: tujuh malaikat membawa tujuh malapetaka terakhir, sebab dengan semua itu murka Allah mencapai akhirnya.[a]'
  to: 'Lalu aku melihat suatu tanda lain di surga, yang besar dan menakjubkan: tujuh malaikat membawa tujuh malapetaka terakhir, sebab di dalam malapetaka-malapetaka itu murka Allah telah dituntaskan.[a]'
  rationale: Revisi memulihkan rujukan langsung ἐν αὐταῖς kepada ketujuh malapetaka dan menerjemahkan ἐτελέσθη dengan ungkapan yang menandai penuntasan. Catatan kaki dipertahankan pada klausa yang bersangkutan untuk mencatat alternatif yang menonjolkan nuansa tercapainya akhir.
