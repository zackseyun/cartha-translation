id: REV.15.1
reference: Revelation 15:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἄλλο σημεῖον ἐν τῷ οὐρανῷ μέγα καὶ θαυμαστόν, ἀγγέλους ἑπτὰ ἔχοντας πληγὰς ἑπτὰ τὰς ἐσχάτας, ὅτι ἐν αὐταῖς ἐτελέσθη ὁ θυμὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/001.yaml
  text: 'And I saw another sign in heaven[a], great and marvelous: seven angels having seven last plagues[b], because in them the wrath of God was finished.'
translation:
  language: id
  text: 'Lalu aku melihat suatu tanda lain di surga, yang besar dan menakjubkan: tujuh malaikat membawa tujuh malapetaka terakhir, sebab di dalam malapetaka-malapetaka itu murka Allah telah dituntaskan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebab di dalam semuanya itu murka Allah mencapai akhirnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: tanda
  rationale: “Tanda” adalah padanan baku dan transparan bagi fenomena simbolis yang dilihat Yohanes dalam Wahyu.
- source_word: ἐν τῷ οὐρανῷ
  choice: di surga
  rationale: Dalam latar apokaliptis Wahyu, frasa ini menunjuk pada ranah surgawi, bukan sekadar langit yang kelihatan.
- source_word: μέγα καὶ θαυμαστόν
  choice: yang besar dan menakjubkan
  rationale: Ungkapan ini mempertahankan kebesaran serta rasa takjub dari kedua adjektiva dengan bahasa Indonesia modern.
- source_word: ἀγγέλους ἑπτὰ ἔχοντας πληγὰς ἑπτὰ τὰς ἐσχάτας
  choice: tujuh malaikat membawa tujuh malapetaka terakhir
  rationale: “Membawa” menyatakan bahwa para malaikat memiliki atau memegang malapetaka itu secara alami dalam bahasa Indonesia; “malapetaka” menyampaikan bencana hukuman ilahi tanpa menyempitkannya pada wabah penyakit.
- source_word: ὅτι
  choice: sebab
  rationale: 'Kata ini mempertahankan hubungan kausal: ketujuh malapetaka itu adalah yang terakhir karena di dalam atau melalui semuanya murka Allah mencapai akhir.'
- source_word: ἐν αὐταῖς
  choice: dengan semua itu
  rationale: Padanan ini alami dalam bahasa Indonesia dan menyampaikan sarana atau lingkup penyelesaian, sambil merujuk kembali kepada ketujuh malapetaka.
- source_word: ἐτελέσθη
  choice: mencapai akhirnya
  rationale: Bentuk ini mempertahankan gagasan bahwa murka Allah sampai pada penyelesaian atau titik akhirnya, tanpa menyiratkan bahwa murka merupakan pekerjaan yang secara harfiah ‘diselesaikan’.
- source_word: ὁ θυμὸς τοῦ θεοῦ
  choice: murka Allah
  rationale: “Murka Allah” mempertahankan bobot khidmat bahasa penghakiman ilahi dan merupakan ungkapan Indonesia yang mapan.
theological_decisions:
- issue: Bahasa penghakiman ilahi dalam konteks apokaliptis
  choice: murka Allah
  alternative: amarah Allah; kegusaran Allah
  rationale: “Murka” mempertahankan daya teologis dan yudisial θυμός tanpa melunakkan atau melebih-lebihkan teks.
- issue: Makna ἐτελέσθη sehubungan dengan murka Allah
  choice: mencapai akhirnya
  alternative: diselesaikan; digenapi
  rationale: Pilihan ini menjaga gagasan tercapainya titik akhir dalam ketujuh malapetaka tanpa menentukan apakah nuansanya terutama penyelesaian, penggenapan, atau berakhirnya murka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan penglihatan Yohanes dipertahankan, sementara partisipel Yunani diungkapkan secara alami dengan “membawa”. Penanda catatan kaki ditempatkan sesudah klausa yang diterangkannya.
