    text: Atau, “sebab di dalam semuanya itu murka Allah mencapai akhirnya.”
    reason: lexical_alternative
  revision_rationale: Revisi memulihkan rujukan langsung ἐν αὐταῖς kepada ketujuh malapetaka dan menerjemahkan ἐτελέσθη dengan ungkapan yang menandai penuntasan. Catatan kaki dipertahankan pada klausa yang bersangkutan untuk mencatat alternatif yang menonjolkan nuansa tercapainya akhir.
