  to: Lalu aku melihat sesuatu seperti lautan kaca yang bercampur dengan api, dan orang-orang yang menang atas binatang itu, atas patungnya, dan atas bilangan namanya[a]. Mereka berdiri di atas lautan kaca itu sambil memegang kecapi Allah[b].
