id: REV.15.2
reference: Revelation 15:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ εἶδον ὡς θάλασσαν ὑαλίνην μεμιγμένην πυρί, καὶ τοὺς νικῶντας ἐκ τοῦ θηρίου καὶ ἐκ τῆς εἰκόνος αὐτοῦ καὶ ἐκ τοῦ ἀριθμοῦ τοῦ ὀνόματος αὐτοῦ ἑστῶτας ἐπὶ τὴν θάλασσαν τὴν ὑαλίνην, ἔχοντας κιθάρας τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/002.yaml
  text: And I saw what appeared to be a sea of glass mixed with fire[a], and those who were victorious over the beast and over its image and over the number of its name, standing on the sea of glass[b], holding harps of God.
translation:
  language: id
  text: Lalu aku melihat sesuatu seperti lautan kaca yang bercampur dengan api, dan orang-orang yang menang atas binatang itu, atas patungnya, dan atas bilangan namanya[a]. Mereka berdiri di atas lautan kaca itu sambil memegang kecapi Allah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “orang-orang yang menang dari binatang itu ...” Susunan bahasa Yunani dapat menekankan kemenangan atas binatang itu atau keluarnya mereka dari kuasanya.
    reason: alternative_reading
  - marker: b
    text: Ungkapan “kecapi Allah” dapat berarti kecapi milik Allah, berasal dari Allah, atau diperuntukkan bagi Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς θάλασσαν ὑαλίνην
  choice: sesuatu seperti lautan kaca
  rationale: ὡς menandai perbandingan dalam penglihatan, bukan identifikasi harfiah; frasa ini mempertahankan citra apokaliptik secara alami dalam bahasa Indonesia.
- source_word: μεμιγμένην πυρί
  choice: yang bercampur dengan api
  rationale: Mempertahankan gambaran majemuk yang tidak biasa tanpa menjelaskan apakah api berada di dalam, pada, atau tampak menyatu dengan lautan itu.
- source_word: τοὺς νικῶντας
  choice: orang-orang yang menang
  rationale: νικάω dalam Wahyu menyatakan tindakan mengalahkan atau mengatasi; 'menang' alami, jelas, dan tidak membatasi gambaran pada kemenangan militer.
- source_word: ἐκ τοῦ θηρίου ... ἐκ τῆς εἰκόνος ... ἐκ τοῦ ἀριθμοῦ
  choice: atas binatang itu, atas patungnya, dan atas bilangan namanya
  rationale: Walaupun ἐκ secara dasar berarti 'dari/keluar dari', sesudah gagasan kemenangan konstruksi ini dapat menyatakan kemenangan atas. Pengulangan 'atas' mempertahankan susunan tiga serangkai.
- source_word: ἑστῶτας ἐπὶ τὴν θάλασσαν τὴν ὑαλίνην
  choice: Mereka berdiri di atas lautan kaca itu
  rationale: ἐπί dengan akusatif di sini paling langsung menggambarkan posisi di atas; pemecahan menjadi kalimat baru membuat hubungan partisipialnya jelas dalam bahasa Indonesia tanpa mengubah isi.
- source_word: κιθάρας τοῦ θεοῦ
  choice: kecapi-kecapi Allah
  rationale: κιθάρα adalah alat musik petik sejenis kecapi/lira, bukan harpa modern; genitif 'Allah' dipertahankan agar kemungkinan milik, asal, atau peruntukannya tidak dipersempit.
theological_decisions:
- issue: Hubungan para pemenang dengan binatang yang dinyatakan oleh ἐκ setelah νικῶντας
  choice: Mereka menang atas binatang, patungnya, dan bilangan namanya.
  alternative: Mereka keluar atau terbebas dari lingkup kuasa binatang itu.
  rationale: Ungkapan Indonesia 'menang atas' paling alami dan sesuai dengan motif νικάω dalam Wahyu, sementara catatan kaki mempertahankan kemungkinan nuansa keluar dari atau terlepas dari kuasanya.
- issue: Makna genitif dalam κιθάρας τοῦ θεοῦ
  choice: kecapi-kecapi Allah
  alternative: kecapi-kecapi yang diberikan oleh Allah atau dipersembahkan bagi Allah
  rationale: Bentuk literal ini menjaga ambiguitas apakah kecapi itu milik Allah, berasal dari Allah, atau diperuntukkan bagi-Nya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. 'Binatang' dipilih untuk θηρίον, 'patung' untuk εἰκών dalam konteks objek pemujaan, dan 'bilangan namanya' mempertahankan susunan Yunani. Semua penanda catatan kaki ditempatkan pada bagian teks yang dijelaskan.
