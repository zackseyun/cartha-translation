id: REV.11.19
reference: Revelation 11:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἠνοίγη ὁ ναὸς τοῦ θεοῦ ⸀ὁ ἐν τῷ οὐρανῷ, καὶ ὤφθη ἡ κιβωτὸς τῆς διαθήκης ⸀αὐτοῦ ἐν τῷ ναῷ αὐτοῦ· καὶ ἐγένοντο ἀστραπαὶ καὶ φωναὶ καὶ βρονταὶ ⸂καὶ σεισμὸς⸃ καὶ χάλαζα μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/019.yaml
  text: And the temple of God in heaven was opened[a], and the ark of his covenant was seen in his temple[c][b]; and there were flashes of lightning and voices and peals of thunder and an earthquake and great hail.
translation:
  language: id
  text: Lalu terbukalah bait Allah yang di surga[a], dan tabut perjanjian-Nya terlihat di dalam bait-Nya[b]. Maka terjadilah kilat, suara-suara[c], guruh, gempa bumi, dan hujan es yang hebat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tempat kudus Allah yang di surga”; kata Yunani ναός dapat menekankan ruang kudus, bukan seluruh kompleks bait.
    reason: lexical_alternative
  - marker: b
    text: Teks Yunani secara eksplisit menyebut “perjanjian-Nya.”
    reason: lexical_clarification
  - marker: c
    text: Atau “bunyi-bunyi” atau “gemuruh”; Wahyu kerap memakai ungkapan ini dalam adegan penampakan keagungan dan penghakiman Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὸς
  choice: bait
  rationale: Dalam konteks keagamaan, 'bait' secara wajar menunjuk pada tempat kediaman kudus Allah dan dapat mewakili ναός, yakni bangunan suci atau ruang kudus, tanpa memakai istilah teknis yang sukar.
- source_word: ὁ ἐν τῷ οὐρανῷ
  choice: yang di surga
  rationale: Menerangkan letak bait Allah secara alami dalam bahasa Indonesia dan mempertahankan konstruksi penjelas dalam teks Yunani.
- source_word: ἠνοίγη
  choice: terbukalah
  rationale: Mempertahankan peristiwa pasif tanpa menyebut pelaku yang tidak dinyatakan; partikel '-lah' mendukung register naratif yang luhur tanpa mengubah makna.
- source_word: ὤφθη
  choice: terlihat
  rationale: Mencerminkan bentuk pasif Yunani dan tidak memutuskan apakah tabut itu tampil secara aktif atau menjadi tampak karena bait dibuka.
- source_word: κιβωτὸς τῆς διαθήκης αὐτοῦ
  choice: tabut perjanjian-Nya
  rationale: Mempertahankan αὐτοῦ sebagai '-Nya' dan memakai istilah Indonesia yang mapan untuk tabut serta perjanjian Allah.
- source_word: ἐν τῷ ναῷ αὐτοῦ
  choice: di dalam bait-Nya
  rationale: Mengulang padanan yang sama bagi ναός dan mempertahankan kata ganti milik αὐτοῦ.
- source_word: ἐγένοντο
  choice: terjadilah
  rationale: Menyampaikan munculnya rangkaian gejala secara idiomatis sambil mempertahankan sifat peristiwa.
- source_word: ἀστραπαὶ
  choice: kilat
  rationale: Padanan Indonesia alami; nomina kolektif 'kilat' cukup menyampaikan gejala yang berulang tanpa ungkapan kaku.
- source_word: φωναὶ
  choice: suara-suara
  rationale: Mempertahankan arti dasar dan bentuk jamak φωναί serta ungkapan teofanik khas Wahyu, tanpa membatasinya pada ucapan manusia.
- source_word: βρονταὶ
  choice: guruh
  rationale: Padanan yang alami dan bermartabat untuk bunyi guntur yang menggelegar; bentuk Indonesia dapat berfungsi secara kolektif bagi jamak Yunani.
- source_word: σεισμὸς
  choice: gempa bumi
  rationale: Padanan baku dan jelas bagi σεισμός dalam konteks penghakiman apokaliptik.
- source_word: χάλαζα μεγάλη
  choice: hujan es yang hebat
  rationale: Mengungkapkan χάλαζα secara jelas bagi pembaca Indonesia dan mempertahankan intensitas μεγάλη tanpa menentukan ukuran butir atau menambahkan detail.
theological_decisions:
- issue: Cakupan makna ναός surgawi
  choice: bait
  alternative: tempat kudus
  rationale: '''Bait'' adalah padanan utama yang alami dan tidak memaksakan rincian arsitektur surgawi; catatan mempertahankan kemungkinan nuansa ruang kudus bagian dalam.'
- issue: Makna φωναὶ dalam rangkaian teofanik
  choice: suara-suara
  alternative: bunyi-bunyi atau gemuruh
  rationale: Padanan literal mempertahankan diksi khas Wahyu dan ambiguitas apakah yang dimaksud ialah suara yang berbicara atau bunyi dahsyat; alternatif diberikan dalam catatan.
- issue: Kepemilikan perjanjian
  choice: perjanjian-Nya
  alternative: perjanjian
  rationale: Kata ganti αὐτοῦ dinyatakan secara eksplisit agar perjanjian tetap diidentifikasi sebagai milik Allah, tanpa mereduksinya menjadi nama benda yang membeku.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan gerak naratif apokaliptik dan pengulangan 'bait', sementara istilah yang berpotensi ambigu dijelaskan lewat catatan kaki. Semua penanda catatan muncul dalam teks utama.
