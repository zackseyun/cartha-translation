id: REV.11.11
reference: Revelation 11:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ μετὰ τὰς τρεῖς ἡμέρας καὶ ἥμισυ πνεῦμα ζωῆς ἐκ τοῦ θεοῦ εἰσῆλθεν ⸂ἐν αὐτοῖς⸃, καὶ ἔστησαν ἐπὶ τοὺς πόδας αὐτῶν, καὶ φόβος μέγας ⸀ἐπέπεσεν ἐπὶ τοὺς θεωροῦντας αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/011.yaml
  text: And after the three and a half days[a], a breath of life from God entered into them, and they stood on their feet, and great fear fell on those watching them.
translation:
  language: id
  text: Sesudah tiga setengah hari, napas kehidupan[a] dari Allah masuk ke dalam mereka. Mereka pun berdiri tegak, dan ketakutan besar meliputi orang-orang yang sedang menyaksikan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “roh kehidupan dari Allah”; mungkin juga “Roh kehidupan dari Allah”. Kata Yunani πνεῦμα dapat berarti napas, roh, atau Roh.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ τὰς τρεῖς ἡμέρας καὶ ἥμισυ
  choice: Sesudah tiga setengah hari itu
  rationale: μετά dengan akusatif menyatakan urutan waktu, sedangkan artikel pada frasa Yunani menunjukkan rentang waktu tertentu. Bentuk “hari itu” mempertahankan kekhususan tersebut secara wajar dalam bahasa Indonesia.
- source_word: πνεῦμα ζωῆς
  choice: napas kehidupan
  rationale: πνεῦμα dapat berarti napas, roh, atau Roh. Dalam adegan dihidupkannya kembali para saksi, “napas kehidupan” cocok dengan gema Yehezkiel 37 tanpa menutup kemungkinan makna lain, yang dicatat dalam catatan kaki.
- source_word: ἐκ τοῦ θεοῦ
  choice: dari Allah
  rationale: Ungkapan ini menyatakan asal atau sumber; “dari Allah” merupakan padanan Indonesia yang alami dan tepat.
- source_word: εἰσῆλθεν ἐν αὐτοῖς
  choice: masuk ke dalam mereka
  rationale: Padanan ini menyampaikan gerakan masuk ke tubuh mereka secara jelas dan alami, tanpa mengikuti preposisi Yunani secara kaku.
- source_word: ἔστησαν ἐπὶ τοὺς πόδας αὐτῶν
  choice: Mereka pun berdiri di atas kaki mereka
  rationale: Bentuk aoristus ἵστημι di sini bersifat intransitif. “Berdiri di atas kaki mereka” mempertahankan gambaran pemulihan hidup dan gema bahasa kenabian.
- source_word: φόβος μέγας
  choice: ketakutan besar
  rationale: Padanan langsung ini mempertahankan kekuatan frasa tanpa mempersempitnya menjadi kepanikan atau kengerian.
- source_word: ἐπέπεσεν ἐπὶ
  choice: meliputi
  rationale: Dalam konteks emosi yang mendatangi orang-orang, “meliputi” merupakan ungkapan Indonesia yang alami untuk sesuatu yang menimpa atau menguasai mereka.
- source_word: τοὺς θεωροῦντας αὐτούς
  choice: orang-orang yang sedang memandangi mereka
  rationale: θεωρέω menunjukkan pengamatan yang berlangsung dan penuh perhatian. “Sedang memandangi” mempertahankan aspek partisipel kini dan sesuai dengan adegan tersebut.
theological_decisions:
- issue: Apakah πνεῦμα ζωῆς harus dipahami sebagai napas pemberi hidup atau secara eksplisit sebagai Roh Kudus
  choice: napas kehidupan dari Allah
  alternative: roh kehidupan dari Allah; Roh kehidupan dari Allah
  rationale: Teks menyatakan bahwa πνεῦμα itu berasal dari Allah, tetapi tidak secara eksplisit menyamakannya dengan Roh Kudus. Teks utama memakai “napas kehidupan” karena sesuai dengan gambaran penghidupan kembali, sementara catatan kaki mempertahankan ambiguitas leksikal dan teologis Yunani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan jelas. Susunan kalimat mempertahankan rangkaian naratif Yunani, tetapi memakai ungkapan Indonesia yang alami. Penanda catatan kaki ditempatkan tepat sesudah frasa yang ambigu.
