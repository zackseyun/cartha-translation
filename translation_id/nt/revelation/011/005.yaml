id: REV.11.5
reference: Revelation 11:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἴ τις αὐτοὺς θέλει ἀδικῆσαι, πῦρ ἐκπορεύεται ἐκ τοῦ στόματος αὐτῶν καὶ κατεσθίει τοὺς ἐχθροὺς αὐτῶν· καὶ εἴ τις ⸂θελήσῃ αὐτοὺς⸃ ἀδικῆσαι, οὕτως δεῖ αὐτὸν ἀποκτανθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/005.yaml
  text: And if anyone wants to harm them[a], fire comes out of their mouth and devours their enemies; and if anyone should want to harm them, in this way he must be killed.
translation:
  language: id
  text: Jika ada orang yang hendak mencelakakan mereka, api keluar dari mulut mereka[a] dan melalap musuh-musuh mereka. Jika ada orang yang hendak mencelakakan mereka, demikianlah ia harus dibunuh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, teks Yunani memakai kata “mulut” dalam bentuk tunggal dengan pemilik jamak.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικῆσαι
  choice: mencelakakan
  rationale: Dalam konteks tindakan bermusuhan terhadap kedua saksi, kata ini menyatakan upaya untuk mendatangkan celaka atau bahaya. “Mencelakakan” alami dalam bahasa Indonesia dan tidak menentukan bentuk serangannya.
- source_word: πῦρ
  choice: api
  rationale: Mempertahankan gambaran konkret dan kuat dalam teks apokaliptik tanpa menafsirkannya sebagai kiasan di dalam terjemahan.
- source_word: ἐκπορεύεται ἐκ τοῦ στόματος αὐτῶν
  choice: keluar dari mulut mereka
  rationale: Mencerminkan secara dekat nomina Yunani tunggal “mulut” dengan pemilik jamak. Susunan ini dapat dipahami sebagai ungkapan kolektif; catatan kaki menjelaskan kemungkinan bentuk jamak yang lebih lazim.
- source_word: κατεσθίει
  choice: melalap
  rationale: Mengungkapkan daya penghancur verba tersebut dengan bahasa Indonesia yang hidup dan lazim, khususnya ketika subjeknya adalah api.
- source_word: ἐχθροὺς
  choice: musuh-musuh
  rationale: Padanan baku dan jelas bagi orang-orang yang memusuhi kedua saksi.
- source_word: θέλει / θελήσῃ
  choice: hendak
  rationale: “Hendak” dapat dipakai secara alami pada kedua klausa bersyarat dan mempertahankan unsur kemauan tanpa membebani kalimat. Perbedaan aspek dan modus Yunani tidak dapat direproduksi secara wajar di sini tanpa memberi kesan makna tambahan.
- source_word: οὕτως
  choice: dengan cara demikian
  rationale: Menunjuk kembali kepada cara kematian yang baru digambarkan, tanpa menentukan lebih jauh bagaimana gambaran itu harus ditafsirkan.
- source_word: δεῖ
  choice: harus
  rationale: Menjaga kekuatan makna keharusan atau keniscayaan secara ringkas tanpa menambahkan sumber keharusan itu.
- source_word: ἀποκτανθῆναι
  choice: dibunuh
  rationale: Padanan pasif yang langsung, jelas, dan tidak arkais.
theological_decisions:
- issue: Apakah gambaran api yang keluar dari mulut harus diliteralkan atau ditafsirkan
  choice: 'Mempertahankan gambaran sebagaimana dinyatakan: “api keluar dari mulut mereka.”'
  alternative: Menafsirkannya sebagai perkataan penghukuman atau secara dinamis sebagai penghukuman yang membinasakan dari mereka.
  rationale: Teks Yunani menyajikan gambaran itu secara langsung. Terjemahan tidak menentukan apakah gambaran tersebut harfiah atau simbolis, sehingga ketegangan penafsirannya tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Melalap” mempertahankan daya gambar api; “dengan cara demikian” sengaja menggemakan cara kematian yang disebut sebelumnya. Tanda [a] ditempatkan langsung sesudah frasa yang dijelaskan.
