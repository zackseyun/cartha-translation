  terminology: “Mencelakakan,” “api,” “melalap,” “musuh-musuh,” dan “dibunuh” sesuai register modern-baku dan daya ungkap teks apokaliptik. Catatan kaki perlu diperbaiki karena “masing-masing” menambahkan distribusi individual yang tidak secara eksplisit dinyatakan oleh bentuk tunggal Yunani.
