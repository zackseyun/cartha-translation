  source_fidelity: 'Teks utama setia pada Yunani: kedua pemakaian ἀδικῆσαι diterjemahkan konsisten sebagai “mencelakakan”; πῦρ, ἐκπορεύεται, κατεσθίει, ἐχθρούς, οὕτως, δεῖ, dan infinitif pasif ἀποκτανθῆναι semuanya terwakili. “Mulut mereka” mempertahankan bentuk yang tidak menandai jumlah dalam bahasa Indonesia dan tidak memaksakan penafsiran atas nomina Yunani tunggal dengan pemilik jamak.'
