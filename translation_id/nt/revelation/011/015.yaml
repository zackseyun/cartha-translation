id: REV.11.15
reference: Revelation 11:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕβδομος ἄγγελος ἐσάλπισεν· καὶ ἐγένοντο φωναὶ μεγάλαι ἐν τῷ οὐρανῷ ⸀λέγοντες· Ἐγένετο ἡ βασιλεία τοῦ κόσμου τοῦ κυρίου ἡμῶν καὶ τοῦ χριστοῦ αὐτοῦ, καὶ βασιλεύσει εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/015.yaml
  text: And the seventh angel sounded his trumpet[a], and there were loud voices in heaven, saying, “The kingdom of the world has become that of our Lord and of his Messiah[c][b], and he will reign forever and ever.”
translation:
  language: id
  text: Lalu malaikat ketujuh membunyikan sangkakala. Terdengarlah suara-suara nyaring di surga yang berkata, “Kerajaan dunia[a] telah menjadi milik Tuhan kita dan Mesias-Nya[b], dan Dia akan memerintah selama-lamanya[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah berbunyi “kerajaan-kerajaan dunia” atau “kerajaan dunia ini”. Teks SBLGNT memakai bentuk tunggal, “kerajaan dunia”.
    reason: textual_variant
  - marker: b
    text: Atau “Kristus-Nya”. Kata Yunani Χριστός merupakan gelar yang berarti “Yang Diurapi”.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “hingga zaman-zaman segala zaman”, sebuah ungkapan yang berarti waktu tanpa akhir.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: membunyikan sangkakala
  rationale: Kata kerja σαλπίζω berarti membunyikan sangkakala. Ungkapan ini alami dalam bahasa Indonesia dan menyatakan alat musik yang sudah tersirat dalam kata kerja Yunani tanpa menambahkan gagasan asing.
- source_word: φωναὶ μεγάλαι
  choice: suara-suara nyaring
  rationale: Karena diikuti λέγοντες (‘yang berkata’), φωναί di sini menunjuk pada suara yang mengucapkan kata-kata. ‘Nyaring’ menyampaikan kekuatan μεγάλαι secara alami.
- source_word: ἐν τῷ οὐρανῷ
  choice: di surga
  rationale: Dalam konteks penglihatan Wahyu ini, οὐρανός menunjuk pada ranah surgawi, bukan sekadar langit fisik.
- source_word: Ἐγένετο ἡ βασιλεία τοῦ κόσμου
  choice: Kerajaan dunia telah menjadi milik
  rationale: Teks SBLGNT memakai bentuk tunggal βασιλεία. Frasa ‘telah menjadi milik’ menyampaikan perubahan kepemilikan atau kekuasaan yang dinyatakan oleh konstruksi Yunani secara jelas dan wajar dalam bahasa Indonesia.
- source_word: τοῦ κυρίου ἡμῶν
  choice: Tuhan kita
  rationale: κύριος diterjemahkan ‘Tuhan’; bentuk genitifnya berkaitan dengan ‘telah menjadi milik’ dan menyatakan bahwa kerajaan itu kini menjadi milik Tuhan kita.
- source_word: τοῦ χριστοῦ αὐτοῦ
  choice: Mesias-Nya
  rationale: Χριστός berfungsi sebagai gelar di sini, terutama dalam konstruksi ‘Mesias-Nya’, sehingga ‘Mesias’ mempertahankan makna gelarnya. Akhiran ‘-Nya’ menyampaikan αὐτοῦ.
- source_word: καὶ βασιλεύσει
  choice: dan Dia akan memerintah
  rationale: Kata kerja βασιλεύσει berbentuk tunggal. Terjemahan ini mempertahankan subjek tunggal tanpa memperjelas rujukannya melebihi ungkapan Yunani yang ringkas.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: selama-lamanya
  rationale: Ungkapan harfiah ‘hingga zaman-zaman segala zaman’ merupakan idiom untuk jangka waktu yang tidak berkesudahan; ‘selama-lamanya’ adalah padanan Indonesia yang alami.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Dalam frasa ‘Mesias-Nya’, istilah ini jelas berfungsi sebagai gelar bagi pribadi yang diurapi Allah. ‘Mesias’ mempertahankan fungsi gelar tersebut.
- issue: Subjek βασιλεύσει
  choice: Dia akan memerintah
  alternative: mereka akan memerintah; Tuhan dan Mesias-Nya akan memerintah
  rationale: Kata kerja Yunani berbentuk tunggal, meskipun sebelumnya disebut ‘Tuhan kita dan Mesias-Nya’. Pronina tunggal mempertahankan bentuk gramatikal dan ketegangan mengenai rujukannya, tanpa menggantinya dengan subjek jamak atau menjelaskan antecedennya secara paksa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat tanpa bentuk yang berlebihan atau arkais. Susunan ‘Terdengarlah’ mempertahankan nuansa proklamasi penglihatan, sedangkan ‘Dia akan memerintah’ menjaga subjek tunggal dan tidak menyelesaikan secara paksa ketegangan rujukan dalam teks Yunani.
