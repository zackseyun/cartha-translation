source:
  edition: SBLGNT
  text: καὶ δώσω τοῖς δυσὶν μάρτυσίν μου, καὶ προφητεύσουσιν ἡμέρας χιλίας διακοσίας ἑξήκοντα, ⸀περιβεβλημένοι σάκκους.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/003.yaml
  text: And I will grant to my two witnesses[a], and they will prophesy for one thousand two hundred sixty days[b], clothed in sackcloth.
translation:
  language: id
  text: “Aku akan memberikan kepada kedua saksi-Ku[a], dan mereka akan bernubuat selama 1.260 hari dengan mengenakan kain kabung.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Aku akan memberikan kepada kedua saksi-Ku.” Bahasa Yunani tidak menyatakan apa yang diberikan; dalam konteks ini, kemungkinan yang dimaksud ialah kuasa atau penugasan untuk bernubuat.'
    reason: lexical_alternative
  - marker: b
    text: Kain kabung adalah kain kasar yang dikenakan sebagai tanda perkabungan, pertobatan, atau ratapan kenabian.
    reason: cultural_note
lexical_decisions:
- source_word: δώσω
  choice: Aku akan memberikan kuasa
  rationale: Secara harfiah berarti ‘Aku akan memberikan’, tetapi objek yang diberikan tidak dinyatakan. Konteks langsung, yaitu tugas kedua saksi untuk bernubuat, mendukung pemahaman bahwa yang diberikan ialah kuasa atau kewenangan untuk menjalankan tugas itu. Catatan kaki mempertahankan bentuk harfiah dan ketidaktersuratan objeknya.
- source_word: τοῖς δυσὶν μάρτυσίν μου
  choice: kepada kedua saksi-Ku
  rationale: ‘Kedua’ menyatakan jumlah dua yang tertentu, sedangkan ‘saksi-Ku’ mempertahankan hubungan kepunyaan serta makna kesaksian dari μάρτυς.
- source_word: προφητεύσουσιν
  choice: mereka akan bernubuat
  rationale: ‘Bernubuat’ merupakan padanan langsung dan lazim bagi προφητεύω serta tidak menentukan lebih jauh isi nubuat mereka.
- source_word: ἡμέρας χιλίας διακοσίας ἑξήκοντα
  choice: selama 1.260 hari
  rationale: Bentuk akusatif menyatakan rentang waktu; ‘selama’ menyampaikannya secara alami dalam bahasa Indonesia. Penulisan angka mengikuti kebiasaan Indonesia.
- source_word: περιβεβλημένοι
  choice: dengan berpakaian
  rationale: Partisip perfek menggambarkan keadaan mereka dalam kondisi telah mengenakan pakaian tersebut; ungkapan ini mempertahankan gambaran pakaian dan keterkaitannya dengan tindakan bernubuat.
- source_word: σάκκους
  choice: kain kabung
  rationale: ‘Kain kabung’ adalah padanan Indonesia yang mapan bagi pakaian kasar yang berkaitan dengan perkabungan, pertobatan, dan ratapan kenabian.
theological_decisions:
- issue: Objek tersirat dari δώσω
  choice: Teks utama memakai ‘memberikan kuasa’ untuk menghasilkan kalimat Indonesia yang utuh, sambil mengaitkannya dengan tugas bernubuat dalam klausa berikutnya.
  alternative: Aku akan memberikan kepada kedua saksi-Ku
  rationale: Bahasa Yunani tidak menyatakan apa yang diberikan. Bentuk harfiah itu dipertahankan dalam catatan kaki karena dapat menunjuk pada kuasa, kemampuan, atau penugasan, sehingga penjelasan utama tidak boleh dijadikan dasar bagi tafsiran sektarian tertentu.
- issue: Makna simbolis kain kabung
  choice: Teks utama mempertahankan gambaran konkret ‘berpakaian kain kabung’.
  alternative: mengenakan pakaian perkabungan
  rationale: Teks menyebut bendanya, bukan menafsirkan lambangnya. Mempertahankan ‘kain kabung’ menjaga hubungan terbuka dengan perkabungan, pertobatan, dan ratapan kenabian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti ilahi ditulis ‘Aku’ dan akhiran kepunyaan ‘-Ku’. ‘Kedua saksi-Ku’ dipilih daripada bentuk yang lebih kaku. Penanda catatan kaki ditempatkan tepat sesudah unsur yang dijelaskan; karena itu [b] mengikuti ‘kain kabung’, bukan jumlah hari.
