  text: Οὗτοί εἰσιν αἱ δύο ἐλαῖαι καὶ αἱ δύο λυχνίαι αἱ ἐνώπιον τοῦ κυρίου τῆς γῆς ⸀ἑστῶτες.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/004.yaml
  text: These are the two olive trees and the two lampstands standing before the Lord of the earth[a][b].
translation:
  language: id
  text: Mereka inilah kedua pohon zaitun dan kedua kaki pelita yang berdiri di hadapan Tuhan seluruh bumi.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gambaran ini mengacu kepada Zakharia 4. Di sana pohon-pohon zaitun dan kaki pelita melambangkan para pelayan yang ditetapkan dan diberdayakan oleh Roh Allah.
    reason: cross_reference
  - marker: b
    text: 'Atau: “Mereka inilah kedua pohon zaitun dan kedua kaki pelita; merekalah yang berdiri di hadapan Tuhan seluruh bumi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτοί
  choice: Mereka
  rationale: Kata ganti penunjuk maskulin jamak ini merujuk kembali kepada kedua saksi. “Mereka” alami dalam bahasa Indonesia dan tidak menambahkan sebutan “saksi” ke dalam ayat ini.
- source_word: ἐλαῖαι
  choice: pohon zaitun
  rationale: Dalam gambaran apokaliptis yang menggemakan Zakharia 4, kata ini menunjuk kepada pohon zaitun, bukan sekadar buah zaitun.
- source_word: λυχνίαι
  choice: kaki pelita
  rationale: Kata ini berarti penyangga atau tempat pelita, bukan pelita itu sendiri. “Kaki pelita” mempertahankan istilah yang tepat dan citra penting dalam kitab Wahyu.
- source_word: ἐνώπιον
  choice: di hadapan
  rationale: Ungkapan ini menyatakan kedudukan dalam kehadiran seseorang; “di hadapan” ringkas, wajar, dan bernada hormat.
- source_word: κυρίου τῆς γῆς
  choice: Tuhan seluruh bumi
  rationale: Genitif γῆς paling mungkin berarti bumi dalam cakupan kosmis kitab Wahyu. “Tuhan seluruh bumi” merupakan ungkapan Indonesia yang alami dan menyatakan kedaulatan-Nya atas bumi.
- source_word: ἑστῶτες
  choice: yang berdiri
  rationale: Partisipel perfek ini menggambarkan keadaan tetap setelah mengambil tempat. Klausa “yang berdiri” alami dan mempertahankan kemungkinan kaitannya dengan tokoh-tokoh yang dilambangkan.
theological_decisions:
- issue: Hubungan gambaran ini dengan Zakharia 4 dan identitas kedua saksi
  choice: 'Metafora dipertahankan secara langsung: “kedua pohon zaitun dan kedua kaki pelita,” tanpa menjelaskan lambangnya dalam teks utama.'
  alternative: Parafrasa interpretatif seperti “Kedua saksi ini bagaikan kedua pohon zaitun dan kedua kaki pelita.”
  rationale: Teks Yunani mengidentifikasi mereka melalui gambaran apokaliptis, bukan sekadar membuat perbandingan. Bentuk langsung mempertahankan ketegangan teologis dan gema antarteks.
- issue: Cakupan frasa “Tuhan ... bumi”
  choice: Tuhan seluruh bumi
  alternative: Tuhan negeri itu
  rationale: Dalam lingkup kosmis kitab Wahyu dan gema bahasa kenabian, γῆς lebih wajar dipahami sebagai “bumi.” Penambahan “seluruh” mengungkapkan idiom kedaulatan universal tanpa mengubah rujukannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan jelas. Metafora asli dipertahankan, sedangkan catatan kaki menjelaskan gema Zakharia 4 serta ambiguitas hubungan partisipel maskulin ἑστῶτες dengan subjek manusiawi.
