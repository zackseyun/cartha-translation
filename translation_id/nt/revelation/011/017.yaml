id: REV.11.17
reference: Revelation 11:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λέγοντες· Εὐχαριστοῦμέν σοι, κύριε, ὁ θεός, ὁ παντοκράτωρ, ὁ ὢν καὶ ὁ ἦν, ὅτι εἴληφας τὴν δύναμίν σου τὴν μεγάλην καὶ ἐβασίλευσας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/017.yaml
  text: saying[a], “We give thanks to you, Lord God Almighty, who is and who was[b], because you have taken your great power and begun to reign.”
translation:
  language: id
  text: sambil berkata, “Kami bersyukur kepada-Mu, ya Tuhan, Allah Yang Mahakuasa, yang ada dan yang dahulu ada,[a] karena Engkau telah mengambil kuasa-Mu yang besar dan mulai memerintah sebagai Raja.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebagian naskah dan sejumlah terjemahan menambahkan “dan yang akan datang,” seperti dalam rumusan di bagian lain kitab Wahyu. Namun, teks Yunani yang dipakai di sini tidak memuat frasa itu.
    reason: textual_variant
  - marker: b
    text: Dapat juga diterjemahkan “telah memerintah sebagai Raja” atau “telah menjadi Raja.” Kata kerja Yunani ini dapat menyoroti dimulainya ataupun pelaksanaan pemerintahan kerajaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: dengan berkata
  rationale: Partisipel kini aktif ini menghubungkan ucapan tersebut dengan tindakan para tua-tua dalam ayat sebelumnya. 'Dengan berkata' alami sebagai pengantar kutipan dalam bahasa Indonesia.
- source_word: Εὐχαριστοῦμέν σοι
  choice: Kami bersyukur kepada-Mu
  rationale: Ungkapan ini menyampaikan tindakan mengucap syukur dengan nada khidmat dan alami dalam konteks penyembahan.
- source_word: κύριε, ὁ θεός, ὁ παντοκράτωρ
  choice: ya Tuhan, Allah Yang Mahakuasa
  rationale: Rangkaian sapaan dan gelar ilahi dipertahankan secara langsung; 'ya' menandai bentuk sapaan dengan wajar dalam bahasa Indonesia.
- source_word: ὁ ὢν καὶ ὁ ἦν
  choice: yang ada dan yang dahulu ada
  rationale: Mempertahankan kedua unsur temporal dalam teks Yunani tanpa menambahkan 'yang akan datang'. Kata 'dahulu' membantu membedakan ἦν dari ὢν secara alami.
- source_word: ὅτι
  choice: karena
  rationale: Menunjukkan alasan bagi ucapan syukur secara jelas.
- source_word: εἴληφας τὴν δύναμίν σου τὴν μεγάλην
  choice: Engkau telah mengambil kuasa-Mu yang besar
  rationale: Bentuk perfektum diterjemahkan dengan 'telah mengambil', mempertahankan tindakan yang selesai dan tetap relevan; susunan 'kuasa-Mu yang besar' alami dan dekat dengan teks.
- source_word: ἐβασίλευσας
  choice: mulai memerintah sebagai Raja
  rationale: Aoristus dapat menyoroti dimulainya atau tampilnya pelaksanaan pemerintahan kerajaan. Rumusan ini mempertahankan kemungkinan nuansa ingresif sekaligus menjelaskan arti βασιλεύω secara alami.
theological_decisions:
- issue: Rangkaian gelar ilahi dan tidak adanya frasa 'yang akan datang'
  choice: yang ada dan yang dahulu ada
  alternative: yang ada, yang dahulu ada, dan yang akan datang
  rationale: SBLGNT pada ayat ini hanya memuat ὁ ὢν καὶ ὁ ἦν. Terjemahan tidak menyelaraskannya dengan rumusan yang lebih panjang di bagian lain kitab Wahyu.
- issue: Aspek ἐβασίλευσας dan hubungan tindakan ini dengan pemerintahan Allah
  choice: mulai memerintah sebagai Raja
  alternative: telah memerintah sebagai Raja; telah menjadi Raja
  rationale: Konteks merayakan pelaksanaan atau penampakan menentukan dari pemerintahan Allah. 'Mulai memerintah sebagai Raja' menyampaikan kemungkinan nuansa ingresif tanpa secara otomatis menyatakan bahwa sebelumnya Allah sama sekali bukan Raja.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat yang sesuai bagi pujian surgawi. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Frasa 'memerintah sebagai Raja' dipilih agar makna kerajaan βασιλεύω terdengar jelas bagi pembaca umum.
