  naturalness: Teks revisi memakai susunan Indonesia modern yang lancar dan mempertahankan register yang bermartabat. “Mayat” dipakai konsisten sebagai padanan langsung πτῶμα; perubahan jumlah Yunani tidak dapat ditampilkan secara alami melalui nomina Indonesia tanpa penambahan yang tidak perlu.
