id: REV.11.9
reference: Revelation 11:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ βλέπουσιν ἐκ τῶν λαῶν καὶ φυλῶν καὶ γλωσσῶν καὶ ἐθνῶν τὸ πτῶμα αὐτῶν ἡμέρας τρεῖς ⸀καὶ ἥμισυ, καὶ τὰ πτώματα αὐτῶν οὐκ ⸀ἀφίουσιν τεθῆναι εἰς μνῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/009.yaml
  text: And some from the peoples and tribes and languages and nations look at their dead bodies for three and a half days[a], and they do not allow them to be laid in a tomb.
translation:
  language: id
  text: Orang-orang dari antara berbagai kaum, suku, bahasa, dan bangsa melihat mayat mereka[a] selama tiga setengah hari, dan mereka tidak mengizinkan mayat mereka diletakkan di dalam makam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Yunani, kata “mayat” pada bagian pertama berbentuk tunggal, sedangkan pada bagian berikutnya berbentuk jamak. Bentuk tunggal itu mungkin menampilkan kedua saksi sebagai satu kesaksian bersama, sebelum teks beralih kepada tubuh mereka secara individual.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπουσιν
  choice: melihat
  rationale: Bentuk kini menggambarkan tindakan yang sedang berlangsung dalam penglihatan; 'melihat' merupakan padanan Indonesia yang alami tanpa menambahkan nuansa menatap yang tidak wajib.
- source_word: ἐκ τῶν λαῶν καὶ φυλῶν καὶ γλωσσῶν καὶ ἐθνῶν
  choice: orang-orang dari berbagai bangsa, suku, bahasa, dan negara
  rationale: ἐκ menyatakan orang-orang yang berasal dari kelompok-kelompok tersebut, bukan setiap anggotanya. 'Berbagai' membuat cakupan majemuknya alami dalam bahasa Indonesia.
- source_word: λαῶν
  choice: bangsa
  rationale: Dalam rangkaian etnografis Wahyu, 'bangsa' menyampaikan kelompok-kelompok manusia secara wajar; kemajemukannya tampak melalui 'berbagai'.
- source_word: φυλῶν
  choice: suku
  rationale: Padanan baku dan kontekstual untuk kelompok keturunan atau etnis.
- source_word: γλωσσῶν
  choice: bahasa
  rationale: Yang dimaksud adalah kelompok-kelompok berdasarkan bahasa; 'bahasa' jelas dalam bahasa Indonesia modern.
- source_word: ἐθνῶν
  choice: negara
  rationale: Dipilih untuk membedakannya dari λαῶν yang diterjemahkan 'bangsa', sambil mempertahankan unsur kelompok-kelompok dunia dalam formula Wahyu. 'Bangsa-bangsa' tetap merupakan alternatif yang mungkin.
- source_word: τὸ πτῶμα αὐτῶν
  choice: mayat mereka
  rationale: Bentuk 'mayat' dalam bahasa Indonesia tidak menandai tunggal atau jamak. Karena itu, ketegangan gramatikal Yunani antara bentuk tunggal di sini dan bentuk jamak kemudian dijelaskan dalam catatan kaki, tanpa menghasilkan ungkapan Indonesia yang tidak alami.
- source_word: ἡμέρας τρεῖς καὶ ἥμισυ
  choice: selama tiga setengah hari
  rationale: Menyampaikan akusatif durasi dengan idiom Indonesia yang alami.
- source_word: τὰ πτώματα αὐτῶν
  choice: jenazah mereka
  rationale: Mengacu pada tubuh kedua saksi yang telah mati. Bahasa Indonesia tidak memiliki penandaan jumlah wajib pada nomina ini; peralihan jumlah dalam bahasa Yunani dicatat di kaki halaman.
- source_word: οὐκ ἀφίουσιν
  choice: tidak mengizinkan
  rationale: Dalam konstruksi ini ἀφίημι berarti membolehkan atau mengizinkan, bukan meninggalkan atau mengampuni.
- source_word: τεθῆναι εἰς μνῆμα
  choice: diletakkan di dalam makam
  rationale: Mempertahankan tindakan meletakkan ke tempat pemakaman secara lebih spesifik daripada sekadar 'dikuburkan'.
theological_decisions:
- issue: Bentuk tunggal πτῶμα pada klausa pertama dan bentuk jamak πτώματα pada klausa kedua
  choice: Mempertahankan rujukan yang sama secara alami dalam teks Indonesia dan menjelaskan perubahan jumlah Yunani dalam catatan kaki
  alternative: Memaksakan pembedaan tunggal-jamak dalam teks, misalnya 'satu mayat mereka' lalu 'mayat-mayat mereka'
  rationale: Bahasa Indonesia tidak menandai jumlah pada 'mayat/jenazah' tanpa penentu atau pengulangan. Menambahkan 'satu' akan menyatakan sesuatu yang tidak dikatakan teks, sedangkan reduplikasi terasa menafsirkan. Catatan kaki menjaga kemungkinan bahwa bentuk tunggal menampilkan kedua saksi sebagai satu kesaksian bersama sebelum beralih ke bentuk jamak.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan empat kelompok dipertahankan, tetapi 'berbagai' dipakai agar makna partitif ἐκ tersampaikan secara alami. Penanda catatan kaki [a] ditempatkan tepat setelah keterangan waktu yang menutup klausa pertama.
