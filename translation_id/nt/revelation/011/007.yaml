id: REV.11.7
reference: Revelation 11:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ὅταν τελέσωσιν τὴν μαρτυρίαν αὐτῶν, τὸ θηρίον τὸ ἀναβαῖνον ἐκ τῆς ἀβύσσου ποιήσει μετ’ αὐτῶν πόλεμον καὶ νικήσει αὐτοὺς καὶ ἀποκτενεῖ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/007.yaml
  text: And when they finish their testimony[a], the beast that comes up out of the abyss will make war with them and conquer them and kill them.
translation:
  language: id
  text: Ketika kedua saksi itu telah menyelesaikan kesaksian mereka, binatang yang naik dari jurang maut akan berperang melawan mereka[a], mengalahkan mereka, dan membunuh mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, "akan mengadakan perang dengan mereka."
    reason: alternatif_leksikal; catatan ditambatkan pada ποιήσει μετ’ αὐτῶν πόλεμον, frasa yang dirujuknya.
lexical_decisions:
- source_word: τελέσωσιν
  choice: telah menyelesaikan
  rationale: Aoris subjungtif sesudah ὅταν menunjuk pada peristiwa mendatang yang akan terjadi setelah kesaksian mereka selesai; bentuk ini alami dalam konstruksi waktu bahasa Indonesia.
- source_word: μαρτυρίαν
  choice: kesaksian
  rationale: Kesaksian mempertahankan arti tindakan atau isi bersaksi dan berpadu secara alami dengan 'menyelesaikan'.
- source_word: θηρίον
  choice: binatang
  rationale: Dalam konteks apokaliptik Wahyu, 'binatang' merupakan padanan yang jelas dan lazim tanpa menambahkan sifat 'liar' yang tidak dinyatakan tersendiri.
- source_word: ἀναβαῖνον
  choice: yang naik
  rationale: Klausa relatif ini alami dalam bahasa Indonesia dan mempertahankan gambaran gerak naik dari jurang.
- source_word: ἀβύσσου
  choice: jurang maut
  rationale: Istilah ini merupakan padanan Indonesia yang lazim untuk ἄβυσσος dalam konteks apokaliptik dan menyampaikan jurang dunia bawah tanpa memakai ungkapan tafsiran 'lubang tanpa dasar'.
- source_word: ποιήσει μετ’ αὐτῶν πόλεμον
  choice: akan berperang melawan mereka
  rationale: Ungkapan idiomatis Indonesia perlu menyatakan relasi bermusuhan secara eksplisit; μετά dengan genitif dalam idiom perang tidak sewajarnya diterjemahkan secara harfiah sebagai 'dengan mereka'.
- source_word: νικήσει
  choice: mengalahkan
  rationale: Dalam konteks serangan militer, 'mengalahkan' menyatakan kemenangan atas kedua saksi dengan jelas, sambil mempertahankan kaitan dengan tema kemenangan dalam Wahyu.
- source_word: ἀποκτενεῖ
  choice: membunuh
  rationale: Padanan langsung, alami, dan tidak arkais untuk tindakan menghilangkan nyawa.
theological_decisions:
- issue: Rujukan kata ganti jamak αὐτῶν / αὐτούς
  choice: kedua saksi itu / mereka
  alternative: mereka saja
  rationale: Konteks langsung Wahyu 11:3–6 mengidentifikasi pelakunya sebagai dua saksi. Menyebut 'kedua saksi itu' membuat ayat mandiri lebih jelas tanpa menentukan identitas simbolis mereka.
- issue: Relasi bermusuhan dalam ποιήσει μετ’ αὐτῶν πόλεμον
  choice: akan berperang melawan mereka
  alternative: akan mengadakan perang dengan mereka
  rationale: Meskipun μετά secara bentuk berarti 'dengan', keseluruhan idiom dan verba berikutnya menyatakan permusuhan. Bahasa Indonesia alami memakai 'melawan' dan tidak kehilangan ambiguitas teologis yang bermakna.
- issue: Makna νικήσει dalam konflik apokaliptik
  choice: mengalahkan mereka
  alternative: menaklukkan mereka
  rationale: '''Mengalahkan'' menyatakan kemenangan sementara binatang dalam adegan ini tanpa menyiratkan bahwa kemenangan tersebut bersifat mutlak atau terakhir.'
translation_notes:
  register: 'Bahasa Indonesia baku modern, lugas, dan khidmat. Susunan tiga tindakan terakhir dipertahankan untuk menjaga peningkatan retoris: berperang, mengalahkan, lalu membunuh. Tidak ada penanda catatan kaki karena alternatif bahasa Inggris pada data masukan tampaknya salah ditempatkan setelah ''testimony'' dan tidak diperlukan dalam teks Indonesia.'
