  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ τὸ πτῶμα αὐτῶν ἐπὶ τῆς πλατείας τῆς πόλεως τῆς μεγάλης, ἥτις καλεῖται πνευματικῶς Σόδομα καὶ Αἴγυπτος, ὅπου καὶ ὁ κύριος αὐτῶν ἐσταυρώθη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/008.yaml
  text: And their dead bodies lie in the street of the great city[a], which is spiritually called Sodom and Egypt[c][b], where also their Lord was crucified.
translation:
  language: id
  text: Mayat mereka[b] tergeletak di jalan raya kota besar itu, yang secara rohani[a] disebut Sodom dan Mesir, tempat Tuhan mereka juga disalibkan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “secara kiasan” atau “secara simbolis”.
    reason: lexical_alternative
  - marker: b
    text: Teks Yunani memakai bentuk tunggal “mayat”, yang tampaknya menggambarkan kedua saksi sebagai satu kesatuan. Terjemahan lain memakai bentuk jamak “mayat-mayat mereka”.
    reason: alternative_reading
  - marker: c
    text: Ungkapan “tempat Tuhan mereka juga disalibkan” menunjuk kepada Yerusalem, meskipun teks mempertahankan sebutan simbolis “kota besar”.
    reason: cross_reference
lexical_decisions:
- source_word: τὸ πτῶμα αὐτῶν
  choice: mayat mereka
  rationale: πτῶμα menunjuk pada tubuh yang telah mati. Bentuk tunggal Yunani dipertahankan sebagai “mayat”, sedangkan αὐτῶν tetap diterjemahkan “mereka” karena merujuk kepada kedua saksi.
- source_word: ἐπὶ τῆς πλατείας
  choice: di jalan
  rationale: πλατεία dapat berarti jalan yang lebar atau lapangan umum. “Di jalan” merupakan padanan alami yang tidak mempersempit maknanya menjadi lokasi tertentu.
- source_word: τῆς πόλεως τῆς μεγάλης
  choice: kota besar itu
  rationale: Mempertahankan sebutan apokaliptis “kota besar” dan memakai “itu” agar frasa definit Yunani terdengar alami dalam bahasa Indonesia.
- source_word: πνευματικῶς
  choice: secara rohani
  rationale: Ini padanan langsung bagi adverbia Yunani dan mempertahankan kemungkinan nuansa rohani/simbolis tanpa membatasinya hanya sebagai gaya bahasa.
- source_word: Σόδομα καὶ Αἴγυπτος
  choice: Sodom dan Mesir
  rationale: Nama-nama simbolis dipertahankan sebagaimana dalam teks, tanpa menjabarkan makna kebobrokan atau penindasannya di dalam ayat.
- source_word: ὅπου καὶ
  choice: tempat ... juga
  rationale: “Tempat” menyampaikan makna lokatif ὅπου, sedangkan “juga” mempertahankan daya tambah καί secara alami.
- source_word: ὁ κύριος αὐτῶν
  choice: Tuhan mereka
  rationale: κύριος diterjemahkan “Tuhan” sebagai gelar yang sarat makna teologis, dan αὐτῶν tetap merujuk kepada kedua saksi.
- source_word: ἐσταυρώθη
  choice: disalibkan
  rationale: Padanan pasif historis yang baku bagi bentuk aoristus pasif σταυρόω.
theological_decisions:
- issue: Bentuk tunggal πτῶμα dengan pemilik jamak
  choice: Memakai bentuk tunggal “mayat mereka”.
  alternative: “mayat-mayat mereka” atau “kedua mayat mereka”
  rationale: Teks Yunani memakai nomina tunggal meskipun yang dibicarakan adalah dua saksi. Bentuk tunggal dipertahankan agar gambaran korporatif dan ketegangan gramatikal teks tidak dihilangkan.
- issue: Makna πνευματικῶς dalam penamaan kota
  choice: Menerjemahkan “secara rohani”.
  alternative: “secara kiasan” atau “secara simbolis”
  rationale: Padanan langsung ini mempertahankan bahasa sumber dan tidak mereduksi ungkapan tersebut menjadi kategori sastra semata; alternatif yang lebih interpretatif dicatat dalam catatan kaki.
- issue: Identitas “kota besar”
  choice: Tidak menyebut Yerusalem secara eksplisit dalam teks utama.
  alternative: Mengganti atau menjelaskan “kota besar” sebagai Yerusalem.
  rationale: Keterangan bahwa Tuhan disalibkan di sana menunjuk kepada Yerusalem, tetapi teks tetap memakai gelar simbolis “kota besar”. Terjemahan mempertahankan retorika apokaliptis itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan jelas. “Tergeletak” melengkapi klausa nominal Yunani secara alami sekaligus mempertahankan gambaran tubuh yang dibiarkan di tempat umum. Penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
