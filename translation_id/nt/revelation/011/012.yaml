id: REV.11.12
reference: Revelation 11:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ⸀ἤκουσαν ⸂φωνῆς μεγάλης⸃ ἐκ τοῦ οὐρανοῦ ⸀λεγούσης αὐτοῖς· ⸀Ἀνάβατε ὧδε, καὶ ἀνέβησαν εἰς τὸν οὐρανὸν ἐν τῇ νεφέλῃ, καὶ ἐθεώρησαν αὐτοὺς οἱ ἐχθροὶ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/012.yaml
  text: And they heard a loud voice from heaven saying to them, “Come up here,” and they went up to heaven in the cloud, and their enemies watched them.
translation:
  language: id
  text: Lalu mereka mendengar suara lantang dari surga yang berkata kepada mereka, “Naiklah kemari!” Mereka pun naik ke surga dalam awan itu[a], dan musuh-musuh mereka menyaksikan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam sebuah awan.” Teks Yunani memakai bentuk tertentu, yang secara harfiah dapat diterjemahkan “dalam awan itu,” dan mungkin juga menggemakan gambaran alkitabiah tentang kehadiran dan pembenaran ilahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: mereka mendengar
  rationale: Bentuk aoris ἀκούω menyatakan peristiwa mendengar suara surgawi, bukan tindakan menyimak yang berlangsung lama.
- source_word: φωνῆς μεγάλης
  choice: suara lantang
  rationale: Ungkapan ini menunjuk pada suara yang kuat atau keras; “suara lantang” alami dan bermartabat dalam bahasa Indonesia.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: dari surga
  rationale: Dalam konteks penglihatan dan suara ilahi di Wahyu, οὐρανός merujuk pada surga, bukan sekadar langit.
- source_word: λεγούσης αὐτοῖς
  choice: berkata kepada mereka
  rationale: Partisipel ini menerangkan suara tersebut, dan αὐτοῖς dipertahankan secara eksplisit sebagai “kepada mereka”.
- source_word: Ἀνάβατε ὧδε
  choice: Naiklah kemari!
  rationale: Imperatif jamak ini merupakan panggilan untuk bergerak naik menuju tempat pembicara; “kemari” mempertahankan daya deiktis ὧδε.
- source_word: ἀνέβησαν εἰς τὸν οὐρανὸν
  choice: mereka pun naik ke surga
  rationale: “Naik ke surga” menyampaikan arah gerak εἰς secara alami tanpa memakai istilah yang terlalu teknis; “pun” menandai tanggapan langsung terhadap perintah.
- source_word: ἐν τῇ νεφέλῃ
  choice: dalam awan itu
  rationale: Artikel tertentu dipertahankan melalui “itu,” sehingga kemungkinan gema awan kehadiran ilahi tetap terbuka.
- source_word: ἐθεώρησαν
  choice: menyaksikan
  rationale: θεωρέω menyiratkan pengamatan nyata atau penuh perhatian, lebih kuat daripada sekadar melihat sepintas.
- source_word: οἱ ἐχθροὶ αὐτῶν
  choice: musuh-musuh mereka
  rationale: Bentuk ulang menyatakan nomina jamak dan konstruksi posesifnya alami dalam bahasa Indonesia.
theological_decisions:
- issue: Kemungkinan acuan alkitabiah dalam frasa “awan itu”
  choice: Mempertahankan ketertentuan awan dalam teks utama sebagai “awan itu”
  alternative: “sebuah awan” atau “awan”
  rationale: Artikel Yunani dapat menunjuk pada awan tertentu dan mungkin menggema motif alkitabiah tentang kehadiran serta pembenaran ilahi. Terjemahan tidak memastikan acuan itu, tetapi tidak menghapus kemungkinannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat tetapi mudah dipahami. “Suara lantang” dipilih daripada “suara keras” untuk menghindari kesan kasar; “Naiklah kemari!” mempertahankan perintah langsung dan arah geraknya.
