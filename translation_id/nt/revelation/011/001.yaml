id: REV.11.1
reference: Revelation 11:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἐδόθη μοι κάλαμος ὅμοιος ῥάβδῳ, λέγων· ⸀Ἔγειρε καὶ μέτρησον τὸν ναὸν τοῦ θεοῦ καὶ τὸ θυσιαστήριον καὶ τοὺς προσκυνοῦντας ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/001.yaml
  text: And I was given a reed like a rod[a], saying, “Rise and measure the temple of God and the altar and those who worship in it.”
translation:
  language: id
  text: 'Lalu kepadaku diberikan sebatang buluh seperti tongkat, dengan kata-kata: “Bangkitlah dan ukurlah Bait Allah[a], mazbah, serta mereka yang beribadah di dalamnya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tempat suci Allah”; kata Yunani ναός dapat merujuk secara lebih khusus kepada ruang suci bagian dalam, bukan seluruh kompleks Bait Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη μοι
  choice: kepadaku diberikan
  rationale: Bentuk pasif dipertahankan agar fokus Yunani pada benda yang diberikan tetap terasa tanpa menyebut siapa pemberinya.
- source_word: κάλαμος
  choice: sebatang buluh
  rationale: Makna dasarnya ialah buluh; frasa pembanding berikutnya tetap membedakannya dari tongkat dan perintah mengukur memberi konteks fungsinya.
- source_word: ὅμοιος ῥάβδῳ
  choice: seperti tongkat
  rationale: Menyampaikan perbandingan ὅμοιος dengan datif secara langsung tanpa menambahkan tafsiran tentang fungsi atau kewibawaan tongkat itu.
- source_word: λέγων
  choice: dengan perkataan
  rationale: Ungkapan ini mempertahankan kaitan partisipial sekaligus tidak menentukan siapa pembicaranya; bentuk maskulin tunggal Yunani bersifat sintaksis agak mendadak.
- source_word: Ἔγειρε
  choice: Bangkitlah
  rationale: Padanan imperatif yang ringkas, wajar, dan sesuai dengan ragam penglihatan apokaliptik.
- source_word: μέτρησον
  choice: ukurlah
  rationale: Padanan langsung bagi perintah mengukur.
- source_word: ναὸν τοῦ θεοῦ
  choice: Bait Allah
  rationale: Ungkapan Indonesia yang alami dan bermartabat untuk tempat suci Allah; kemungkinan arti lebih khusus sebagai bangunan suci bagian dalam dijelaskan dalam catatan kaki.
- source_word: θυσιαστήριον
  choice: mazbah
  rationale: Istilah Alkitab Indonesia yang tepat untuk altar dan tidak menentukan apakah yang dimaksud ialah mazbah dupa atau mazbah persembahan.
- source_word: τοὺς προσκυνοῦντας
  choice: mereka yang beribadah
  rationale: Mempertahankan daya verbal partisip substantival dan terdengar alami dalam bahasa Indonesia.
- source_word: ἐν αὐτῷ
  choice: di dalamnya
  rationale: Kata ganti paling wajar merujuk pada Bait Allah dan menyatakan lokasi, bukan kepada Allah sebagai pribadi.
theological_decisions:
- issue: Rujukan ναός dalam konteks apokaliptik
  choice: Bait Allah
  alternative: tempat suci Allah
  rationale: Ayat ini tidak memastikan apakah yang dilihat ialah bait duniawi, tempat suci surgawi, atau lambang umat Allah. Terjemahan tidak menetapkan salah satu penafsiran eskatologis itu.
- issue: Identitas pembicara yang tersirat dalam λέγων
  choice: dibiarkan tidak disebut melalui frasa “dengan perkataan”
  alternative: seorang malaikat berkata / suatu suara berkata
  rationale: Teks Yunani tidak menyebut pembicara secara eksplisit; menambahkan malaikat atau suara akan melampaui teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Susunan pasif dan ketidakjelasan identitas pembicara dipertahankan sejauh masih alami. “Mazbah” dipilih sebagai istilah yang sudah dikenal luas dalam bahasa Alkitab Indonesia.
