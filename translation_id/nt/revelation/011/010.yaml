id: REV.11.10
reference: Revelation 11:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ οἱ κατοικοῦντες ἐπὶ τῆς γῆς χαίρουσιν ἐπ’ αὐτοῖς καὶ ⸀εὐφραίνονται, καὶ δῶρα ⸀πέμψουσιν ἀλλήλοις, ὅτι οὗτοι οἱ δύο προφῆται ἐβασάνισαν τοὺς κατοικοῦντας ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/010.yaml
  text: And those who dwell on the earth rejoice over them and celebrate[a], and they will send gifts to one another[b], because these two prophets tormented those who dwell on the earth.
translation:
  language: id
  text: Orang-orang yang tinggal di bumi bersukacita atas mereka dan berpesta[a]. Mereka akan saling mengirim hadiah, sebab kedua nabi ini telah menyiksa orang-orang yang tinggal di bumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bersenang-senang.” Kata Yunani ini menekankan kegembiraan yang dirayakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κατοικοῦντες ἐπὶ τῆς γῆς
  choice: orang-orang yang tinggal di bumi
  rationale: Mempertahankan daya verbal partisip Yunani serta ungkapan khas yang berulang dalam kitab Wahyu, dengan bahasa Indonesia yang alami.
- source_word: χαίρουσιν ἐπ’ αὐτοῖς
  choice: bersukacita atas kematian mereka
  rationale: Konteks ayat sebelumnya menunjukkan bahwa sukacita itu timbul karena kedua saksi telah mati. Penambahan 'kematian' membuat acuan ἐπ’ αὐτοῖς alami dan jelas dalam bahasa Indonesia tanpa mengubah maksud konteks.
- source_word: εὐφραίνονται
  choice: berpesta
  rationale: Membedakannya dari χαίρουσιν dan menyampaikan nuansa kegembiraan yang dirayakan bersama.
- source_word: δῶρα πέμψουσιν ἀλλήλοις
  choice: mereka akan saling mengirim hadiah
  rationale: Mempertahankan bentuk waktu mendatang dan gambaran konkret berupa pengiriman hadiah satu sama lain.
- source_word: οὗτοι οἱ δύο προφῆται
  choice: kedua nabi ini
  rationale: Susunan ini merupakan padanan Indonesia yang alami bagi demonstratif dan frasa nomina Yunani.
- source_word: ἐβασάνισαν
  choice: telah menyiksa
  rationale: Menjaga intensitas βασανίζω dan aspek lampau aoristus tanpa melunakkannya menjadi sekadar 'menyusahkan'.
theological_decisions:
- issue: Ungkapan khas kitab Wahyu bagi komunitas manusia yang berpihak pada dunia dan menentang Allah
  choice: orang-orang yang tinggal di bumi
  alternative: penduduk bumi
  rationale: Terjemahan utama mempertahankan bentuk verbal ungkapan Yunani dan pengulangannya dalam ayat ini, tanpa memasukkan penafsiran teologis secara eksplisit.
- issue: Kerasnya dampak pelayanan kedua nabi terhadap orang-orang di bumi
  choice: telah menyiksa
  alternative: telah mendatangkan penderitaan kepada
  rationale: Kata Yunani menyatakan siksaan atau penderitaan berat. Terjemahan tidak melunakkan ketegangan bahwa para nabi disebut telah menyiksa mereka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'orang-orang yang tinggal di bumi' dipertahankan karena merupakan ungkapan penting dan sengaja diulang dalam teks Yunani. Penanda catatan kaki [a] ditempatkan langsung sesudah kata yang dijelaskan.
