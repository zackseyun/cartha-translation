revisions:
- from: Pada saat itu terjadilah gempa bumi yang dahsyat. Sepersepuluh bagian kota itu runtuh, dan tujuh ribu orang[a] tewas dalam gempa itu. Orang-orang lainnya menjadi sangat ketakutan dan memuliakan Allah yang di surga.
  to: Pada saat itu terjadilah gempa bumi yang dahsyat. Sepersepuluh kota itu runtuh, dan tujuh ribu orang[a] terbunuh dalam gempa itu. Orang-orang lainnya menjadi sangat ketakutan dan memuliakan Allah di surga.
  rationale: Revisi kecil ini memperjelas bahwa ἀπεκτάνθησαν adalah verba pasif yang menyatakan orang-orang itu terbunuh, menyederhanakan ungkapan partitif agar lebih alami, dan merapikan padanan gelar "Allah di surga." Makna, angka, nada apokaliptik, dan ambiguitas mengenai sifat respons orang-orang selebihnya tetap dipertahankan.
