id: REV.11.13
reference: Revelation 11:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐν ἐκείνῃ τῇ ⸀ὥρᾳ ἐγένετο σεισμὸς μέγας, καὶ τὸ δέκατον τῆς πόλεως ἔπεσεν, καὶ ἀπεκτάνθησαν ἐν τῷ σεισμῷ ὀνόματα ἀνθρώπων χιλιάδες ἑπτά, καὶ οἱ λοιποὶ ἔμφοβοι ἐγένοντο καὶ ἔδωκαν δόξαν τῷ θεῷ τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/013.yaml
  text: And in that hour there was a great earthquake[a], and a tenth of the city fell, and seven thousand people were killed in the earthquake, and the rest became terrified and gave glory to the God of heaven.
translation:
  language: id
  text: Pada saat itu terjadilah gempa bumi yang dahsyat. Sepersepuluh kota itu runtuh, dan tujuh ribu orang[a] terbunuh dalam gempa itu. Orang-orang lainnya menjadi sangat ketakutan dan memuliakan Allah di surga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “nama-nama manusia, tujuh ribu”—ungkapan yang berarti tujuh ribu orang terhitung di antara mereka yang terbunuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: Pada saat itu
  rationale: Secara harfiah berarti 'pada jam itu'; dalam bahasa Indonesia modern, 'pada saat itu' mempertahankan penanda waktu yang langsung tanpa terdengar kaku.
- source_word: ἐγένετο σεισμὸς μέγας
  choice: terjadilah gempa bumi yang dahsyat
  rationale: '''Terjadilah'' menyampaikan munculnya peristiwa, sedangkan ''dahsyat'' secara alami mengungkapkan besarnya gempa.'
- source_word: τὸ δέκατον τῆς πόλεως ἔπεσεν
  choice: Sepersepuluh bagian kota itu runtuh
  rationale: '''Sepersepuluh bagian'' mempertahankan angka secara jelas; dalam konteks bagian kota akibat gempa, ''runtuh'' lebih alami daripada terjemahan harfiah ''jatuh''.'
- source_word: ἀπεκτάνθησαν
  choice: tewas
  rationale: '''Tewas'' merupakan ungkapan Indonesia yang ringkas dan wajar untuk kematian akibat bencana, tanpa nuansa arkais dari ''terbunuh'' atau ''dibunuh''.'
- source_word: ὀνόματα ἀνθρώπων χιλιάδες ἑπτά
  choice: tujuh ribu orang[a]
  rationale: Frasa harfiahnya, 'nama-nama manusia, tujuh ribu', adalah ungkapan untuk orang-orang yang terhitung. Teks utama menyampaikan maknanya secara alami, sementara bentuk khasnya dicatat dalam catatan kaki.
- source_word: οἱ λοιποὶ
  choice: Orang-orang lainnya
  rationale: Pilihan ini lebih langsung daripada 'orang-orang yang selamat', yang akan memasukkan kesimpulan kontekstual yang tidak dinyatakan secara eksplisit.
- source_word: ἔμφοβοι ἐγένοντο
  choice: menjadi sangat ketakutan
  rationale: Mempertahankan aspek perubahan keadaan dari ἐγένοντο dan intensitas rasa takut dalam ἔμφοβοι.
- source_word: ἔδωκαν δόξαν
  choice: memuliakan
  rationale: Dalam bahasa Indonesia, 'memuliakan' menyampaikan idiom memberi kemuliaan secara alami dan bermartabat.
- source_word: τῷ θεῷ τοῦ οὐρανοῦ
  choice: Allah yang di surga
  rationale: Menyampaikan gelar genitif Yunani secara alami tanpa mengubahnya menjadi sekadar keterangan lokasi bagi tindakan memuliakan.
theological_decisions:
- issue: Apakah tanggapan orang-orang lainnya harus dipahami sebagai pertobatan atau iman yang menyelamatkan
  choice: Teks hanya menyatakan bahwa mereka sangat ketakutan dan memuliakan Allah yang di surga.
  alternative: Menyatakan bahwa mereka sungguh-sungguh bertobat, atau sebaliknya hanya mengakui kuasa Allah secara lahiriah.
  rationale: Bahasa Yunani menyebut rasa takut dan tindakan memberi kemuliaan kepada Allah, tetapi tidak menjelaskan mutu batiniah atau hasil rohaninya. Terjemahan mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif-apokaliptik yang lugas dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sedangkan ungkapan Yunani yang khas dijelaskan melalui catatan kaki.
