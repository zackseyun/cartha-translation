id: REV.11.6
reference: Revelation 11:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οὗτοι ἔχουσιν ⸂τὴν ἐξουσίαν κλεῖσαι τὸν οὐρανόν⸃, ἵνα μὴ ὑετὸς βρέχῃ τὰς ἡμέρας τῆς προφητείας αὐτῶν, καὶ ἐξουσίαν ἔχουσιν ἐπὶ τῶν ὑδάτων στρέφειν αὐτὰ εἰς αἷμα καὶ πατάξαι τὴν γῆν ⸂ἐν πάσῃ πληγῇ ὁσάκις ἐὰν θελήσωσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/006.yaml
  text: These have the authority to shut the sky so that no rain may fall during the days of their prophecy[a], and they have authority over the waters to turn them into blood and to strike the earth with every plague as often as they wish.
translation:
  language: id
  text: Mereka ini memiliki wewenang untuk menutup langit[a] supaya hujan tidak turun selama masa mereka bernubuat.[b] Mereka juga memiliki wewenang atas segala air untuk mengubahnya menjadi darah dan untuk memukul bumi dengan segala macam tulah sesering yang mereka kehendaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “surga.” Kata Yunani yang diterjemahkan “langit” juga dapat berarti “surga”; “langit” dipilih karena konteksnya mengenai hujan.'
    reason: alternatif_leksikal
  - marker: b
    text: 'Atau: “selama hari-hari nubuat mereka.”'
    reason: alternatif_terjemahan
lexical_decisions:
- source_word: οὗτοι
  choice: Mereka ini
  rationale: Demonstratif menunjuk kembali kepada kedua saksi tanpa menambahkan kata 'dua', yang tidak diulang dalam ayat ini.
- source_word: ἐξουσίαν
  choice: wewenang
  rationale: Menekankan hak atau kewenangan yang diberikan, bukan sekadar kemampuan atau daya.
- source_word: κλεῖσαι τὸν οὐρανόν
  choice: menutup langit
  rationale: Dalam konteks hujan, οὐρανός paling alami berarti langit; makna 'surga' tetap dicatat sebagai alternatif.
- source_word: ἵνα μὴ ὑετὸς βρέχῃ
  choice: supaya hujan tidak turun
  rationale: Ungkapan Indonesia yang alami dan tetap mempertahankan hubungan tujuan/hasil.
- source_word: τὰς ἡμέρας τῆς προφητείας αὐτῶν
  choice: selama masa mereka bernubuat
  rationale: Menyampaikan makna temporal konstruksi Yunani secara wajar; προφητεία dalam konteks ini menunjuk pada kegiatan atau masa pelayanan kenabian mereka.
- source_word: ἐπὶ τῶν ὑδάτων
  choice: atas segala air
  rationale: ἐπί dengan genitif setelah 'memiliki wewenang' menyatakan ranah kekuasaan; bentuk jamak umum diterjemahkan secara idiomatis sebagai 'segala air'.
- source_word: στρέφειν αὐτὰ εἰς αἷμα
  choice: untuk mengubahnya menjadi darah
  rationale: Mempertahankan gambaran perubahan air menjadi darah dengan ungkapan Indonesia yang langsung.
- source_word: πατάξαι τὴν γῆν
  choice: untuk memukul bumi
  rationale: '''Memukul'' mempertahankan citra tindakan πατάσσω secara langsung dan modern, sedangkan γῆ diterjemahkan ''bumi'' sesuai cakupan kosmis kitab Wahyu.'
- source_word: ἐν πάσῃ πληγῇ
  choice: dengan segala macam tulah
  rationale: ἐν bersifat instrumental; 'segala macam tulah' mengungkapkan cakupan distributif πάσῃ secara alami tanpa menentukan daftar tulah tertentu.
- source_word: ὁσάκις ἐὰν θελήσωσιν
  choice: sesering yang mereka kehendaki
  rationale: Mempertahankan makna berulang dan bersyarat dari konstruksi tersebut dalam register yang bermartabat.
theological_decisions:
- issue: Bahasa kiasan yang menggemakan tindakan Elia dan Musa
  choice: Tindakan ajaib dipertahankan dalam bahasa langsung tanpa ditafsirkan di dalam terjemahan.
  alternative: Menjelaskan tindakan itu sebagai simbolis dalam terjemahan.
  rationale: Teks menyajikan tindakan tersebut sebagai bagian dari wewenang yang diberikan kepada para saksi dan tidak menetapkan apakah penggenapannya harfiah, simbolis, atau keduanya.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Istilah 'wewenang', 'bernubuat', dan 'tulah' mempertahankan warna kenabian-apokaliptik tanpa menjadi arkais. Penanda catatan kaki [a] hadir dalam teks; catatan [b] tidak digunakan karena aturan mengharuskan setiap penanda catatan muncul dalam teks utama.
