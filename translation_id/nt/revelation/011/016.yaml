id: REV.11.16
reference: Revelation 11:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ οἱ εἴκοσι τέσσαρες πρεσβύτεροι οἱ ἐνώπιον τοῦ ⸂θεοῦ καθήμενοι⸃ ἐπὶ τοὺς θρόνους αὐτῶν ἔπεσαν ἐπὶ τὰ πρόσωπα αὐτῶν καὶ προσεκύνησαν τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/016.yaml
  text: And the twenty-four elders, who were seated before God on their thrones, fell on their faces and worshiped God,
translation:
  language: id
  text: Lalu kedua puluh empat tua-tua yang duduk di atas takhta mereka di hadapan Allah itu tersungkur dengan muka ke tanah dan menyembah Allah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρεσβύτεροι
  choice: tua-tua
  rationale: Dalam Kitab Wahyu, istilah ini menunjuk kepada tokoh-tokoh dalam sidang surgawi, bukan sekadar orang yang lanjut usia. “Tua-tua” merupakan padanan Alkitabiah yang dikenal luas dan tetap dapat dipahami dalam bahasa Indonesia.
- source_word: ἐνώπιον
  choice: di hadapan
  rationale: Ungkapan ini menyatakan keberadaan secara ruang dan relasional di depan Allah serta mempertahankan suasana resmi dalam penglihatan tersebut.
- source_word: καθήμενοι
  choice: yang duduk
  rationale: Partisipel ini menggambarkan posisi mereka yang sedang atau tetap duduk; klausa relatif ini alami dalam narasi bahasa Indonesia.
- source_word: ἐπὶ τοὺς θρόνους αὐτῶν
  choice: di atas takhta mereka
  rationale: Frasa ini menyatakan posisi pada takhta masing-masing. “Di atas takhta mereka” jelas dan alami dalam bahasa Indonesia modern.
- source_word: ἔπεσαν ἐπὶ τὰ πρόσωπα αὐτῶν
  choice: tersungkur dengan muka ke tanah
  rationale: Ungkapan ini mempertahankan gambaran jasmani tentang sujud penuh. “Tersungkur dengan muka ke tanah” lebih alami daripada terjemahan harfiah “jatuh pada muka mereka” dan tidak menghilangkan postur penyembahan.
- source_word: προσεκύνησαν
  choice: menyembah
  rationale: Karena tindakan ini diarahkan kepada Allah dalam suasana ruang takhta surgawi, makna religius “menyembah” paling sesuai.
- source_word: θεῷ / θεοῦ
  choice: Allah
  rationale: “Allah” adalah padanan baku bahasa Indonesia untuk θεός dalam konteks ini.
- source_word: οἱ εἴκοσι τέσσαρες
  choice: kedua puluh empat
  rationale: Bentuk “kedua puluh empat” secara alami menandai kelompok tertentu yang telah dikenal dalam penglihatan, selaras dengan artikel Yunani.
theological_decisions:
- issue: Makna προσκυνέω dalam adegan liturgi surgawi
  choice: menyembah
  alternative: bersujud; memberi hormat
  rationale: Objeknya secara eksplisit adalah Allah dan latarnya adalah ruang takhta surgawi, sehingga makna penyembahan bersifat utama. Pilihan ini tidak memperlemah tindakan tersebut dan juga tidak menambahkan muatan doktrinal di luar teks.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami tanpa menghilangkan urutan utama adegan: identitas tua-tua, posisi mereka, tindakan tersungkur, lalu penyembahan.'
