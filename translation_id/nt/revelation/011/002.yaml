id: REV.11.2
reference: Revelation 11:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ τὴν αὐλὴν τὴν ἔξωθεν τοῦ ναοῦ ἔκβαλε ⸀ἔξωθεν, καὶ μὴ αὐτὴν μετρήσῃς, ὅτι ἐδόθη τοῖς ἔθνεσιν, καὶ τὴν πόλιν τὴν ἁγίαν πατήσουσιν μῆνας ⸀τεσσεράκοντα δύο.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/002.yaml
  text: But leave out the court outside the temple[a], and do not measure it, because it has been given to the nations[b], and they will trample the holy city for forty-two months.
translation:
  language: id
  text: Tetapi, kecualikanlah pelataran di luar Bait Allah[a] itu dan jangan mengukurnya, sebab pelataran itu telah diberikan kepada bangsa-bangsa[b], dan mereka akan menginjak-injak kota suci itu selama empat puluh dua bulan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ruang kudus.” Kata Yunani ναός dapat secara khusus menunjuk pada ruang kudus, bukan seluruh kompleks Bait Allah.
    reason: lexical_alternative
  - marker: b
    text: Atau, “orang-orang bukan Yahudi.” Kata Yunani ἔθνεσιν dapat berarti “bangsa-bangsa” atau “orang-orang bukan Yahudi,” bergantung pada konteks.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐλή
  choice: pelataran
  rationale: Dalam konteks kompleks Bait Allah, kata ini menunjuk pada area terbuka atau halaman Bait Allah; “pelataran” alami dan cukup khusus dalam bahasa Indonesia.
- source_word: ἔξωθεν τοῦ ναοῦ
  choice: yang di luar Bait Allah
  rationale: Frasa ini menerangkan letak pelataran di luar ναός dan mempertahankan kontras ruang dalam penglihatan tersebut.
- source_word: ναός
  choice: Bait Allah
  rationale: “Bait Allah” merupakan istilah Indonesia yang lazim dalam konteks tempat ibadah di Yerusalem. Karena ναός dapat secara lebih khusus berarti ruang kudus, alternatif itu dipertahankan dalam catatan kaki.
- source_word: ἔκβαλε ἔξωθεν
  choice: biarkanlah ... tetap di luar
  rationale: Ungkapan ini menyatakan pengecualian pelataran dari tindakan pengukuran. Terjemahan ini mempertahankan pengulangan gagasan “di luar” tanpa memberi kesan bahwa pelataran secara harfiah dilemparkan.
- source_word: μὴ αὐτὴν μετρήσῃς
  choice: jangan mengukurnya
  rationale: Menyampaikan larangan orang kedua tunggal secara langsung dan wajar.
- source_word: ἐδόθη
  choice: telah diberikan
  rationale: Bentuk pasif dipertahankan tanpa menyebutkan pelaku yang tidak dinyatakan dalam bahasa Yunani.
- source_word: τοῖς ἔθνεσιν
  choice: kepada bangsa-bangsa
  rationale: ἔθνη dapat berarti bangsa-bangsa atau orang-orang bukan Yahudi. Pilihan utama ini mempertahankan cakupan kolektif dan gema profetis yang luas.
- source_word: πόλιν τὴν ἁγίαν
  choice: kota suci itu
  rationale: Merupakan padanan alami yang mempertahankan sifat kudus kota tersebut tanpa secara eksplisit menambahkan identitas yang tidak disebut dalam ayat.
- source_word: πατήσουσιν
  choice: akan menginjak-injak
  rationale: Mengungkapkan tindakan menajiskan, menindas, atau menguasai dengan keras serta mempertahankan daya gambarnya.
- source_word: μῆνας τεσσεράκοντα δύο
  choice: selama empat puluh dua bulan
  rationale: Akusatif menyatakan jangka waktu; “selama” membuat fungsi duratifnya jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Kekhususan arti ναός dalam gambaran Bait Allah apokaliptik
  choice: Bait Allah dalam teks utama, dengan “ruang kudus” sebagai alternatif dalam catatan kaki
  alternative: ruang kudus
  rationale: Ayat ini membedakan pelataran luar dari ναός. “Bait Allah” lebih lazim bagi pembaca Indonesia, sedangkan “ruang kudus” mempertahankan kemungkinan arti yang lebih sempit dan penting secara interpretatif.
- issue: Makna ἔθνεσιν
  choice: bangsa-bangsa dalam teks utama, dengan “orang-orang bukan Yahudi” sebagai alternatif dalam catatan kaki
  alternative: orang-orang bukan Yahudi
  rationale: Istilah Yunani dapat menunjuk pada bangsa-bangsa secara umum atau pada orang-orang bukan Yahudi sebagai kelompok. Pilihan utama tidak mempersempit arti, sedangkan nuansa etnis-keagamaan dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan jelas. Bentuk imperatif tunggal dipertahankan secara alami. Pengulangan “di luar” mencerminkan ἔξωθεν dalam frasa lokasi dan perintah, sedangkan catatan kaki menjaga ambiguitas leksikal yang relevan.
