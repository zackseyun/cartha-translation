  text: Ἡ οὐαὶ ἡ δευτέρα ἀπῆλθεν· ⸂ἰδοὺ ἡ οὐαὶ ἡ τρίτη⸃ ἔρχεται ταχύ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/014.yaml
  text: The second woe has passed; behold[a], the third woe is coming quickly.
translation:
  language: id
  text: Celaka yang kedua sudah berlalu. Lihatlah, celaka yang ketiga akan segera[a] datang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: celaka yang ketiga akan datang dengan cepat. Kata Yunani ταχύ dapat menekankan kedekatan waktunya atau cepatnya kejadian itu.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐαί
  choice: celaka
  rationale: Dalam konteks rangkaian hukuman sangkakala di Wahyu, οὐαί berfungsi sebagai sebutan bagi malapetaka yang dinomori sekaligus seruan tentang bencana yang akan menimpa. “Celaka” mempertahankan nada ratapan dan ancaman tanpa mempersempit maknanya menjadi sekadar “bencana” atau “penghakiman”.
- source_word: δευτέρα
  choice: yang kedua
  rationale: Kata bilangan bertingkat ini langsung menerangkan “celaka” dan diterjemahkan secara lugas.
- source_word: ἀπῆλθεν
  choice: sudah berlalu
  rationale: Bentuk aoris ἀπέρχομαι secara harfiah berarti “telah pergi”, tetapi dalam urutan peristiwa ini “sudah berlalu” secara alami menyatakan bahwa celaka kedua telah berakhir.
- source_word: ἰδού
  choice: Lihatlah
  rationale: Penanda wacana ini mengarahkan perhatian pembaca dengan mendesak. “Lihatlah” mempertahankan nada kenabian yang khidmat dan tetap wajar dalam bahasa Indonesia modern.
- source_word: τρίτη
  choice: yang ketiga
  rationale: Kata bilangan bertingkat ini langsung menerangkan “celaka” dan diterjemahkan secara lugas.
- source_word: ἔρχεται
  choice: akan ... datang
  rationale: Bentuk kini Yunani menggambarkan kedatangan yang sedang menuju atau dekat. Susunan futur “akan datang” lebih alami dalam bahasa Indonesia tanpa menambahkan kepastian “sebentar lagi” yang tidak dinyatakan secara tersendiri.
- source_word: ταχύ
  choice: segera
  rationale: ταχύ dapat menekankan kedekatan waktu (“segera”) atau cepatnya suatu kejadian (“dengan cepat”). Dalam frasa Indonesia “akan segera datang”, makna urgensi tersampaikan secara alami; kemungkinan nuansa kecepatan dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Makna ταχύ dalam konteks eskatologis
  choice: segera
  alternative: dengan cepat
  rationale: Kata Yunani ini dapat menunjuk pada kedatangan dalam waktu dekat atau pada kedatangan yang berlangsung cepat. Teks utama memakai ungkapan Indonesia yang paling alami, sedangkan catatan kaki mempertahankan kemungkinan kedua agar perdebatan tentang nuansa waktunya tidak diselesaikan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan kenabian. “Lihatlah” dipilih daripada bentuk yang lebih arkais, dan susunan kalimat dibuat ringkas mengikuti ketegasan teks Yunani.
