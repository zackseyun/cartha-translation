review_pass:
  verdict: revise
  source_fidelity: 'Draf pada umumnya setia kepada teks Yunani, termasuk kontras leksikal antara kemarahan bangsa-bangsa dan murka Allah, bentuk pasif penghakiman atas orang mati, daftar penerima upah, serta pengulangan διαφθεῖραι/διαφθείροντας. Namun, “tetapi” menerjemahkan καί secara kontras yang tidak ada dalam sumber. Pengulangan “saatnya” juga memecah satu ὁ καιρός yang dalam bahasa Yunani menaungi tiga infinitif: penghakiman, pemberian upah, dan pembinasaan.'
  naturalness: Revisi menghilangkan konjungsi kontras yang tidak perlu dan menyusun klausa waktu secara lebih koheren dalam bahasa Indonesia baku. Bentuk “telah tiba waktunya bagi orang-orang mati untuk dihakimi, untuk memberikan ..., dan untuk membinasakan ...” mempertahankan paralelisme sumber serta tetap dapat dibaca dengan lancar.
  terminology: “Bangsa-bangsa,” “murka-Mu,” “hamba-hamba-Mu,” “orang-orang kudus,” “takut akan nama-Mu,” dan “bumi” sesuai dengan register Alkitab bahasa Indonesia modern dan dengan pilihan leksikal sumber. Catatan kaki mempertahankan alternatif yang relevan bagi doulos, gē, dan διαφθείρω tanpa memaksakan penafsiran.
  issues:
  - severity: medium
    issue: Kata “tetapi” ditambahkan setelah klausa pertama.
    rationale: Teks Yunani memakai καί (“dan”), bukan konjungsi adversatif. Walaupun konteks dapat memperlihatkan kontras, “tetapi” menjadikannya lebih eksplisit daripada sumber.
  - severity: medium
    issue: “Saatnya” diulang sehingga pembinasaan tidak lagi secara jelas berada dalam lingkup satu waktu yang sama.
    rationale: 'ὁ καιρός muncul sekali dan diikuti tiga infinitif terkoordinasi: κριθῆναι, δοῦναι, dan διαφθεῖραι. Revisi mempertahankan struktur tersebut.'
