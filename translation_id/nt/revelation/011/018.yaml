revisions:
- from: Bangsa-bangsa menjadi marah, tetapi murka-Mu telah datang. Telah tiba saatnya orang-orang mati dihakimi, dan saatnya Engkau memberikan upah kepada hamba-hamba-Mu[a]—para nabi, orang-orang kudus, dan mereka yang takut akan nama-Mu, baik orang kecil maupun orang besar—serta membinasakan orang-orang yang membinasakan bumi[b].
  to: Bangsa-bangsa menjadi marah, dan murka-Mu datang. Telah tiba waktunya bagi orang-orang mati untuk dihakimi, untuk memberikan upah kepada hamba-hamba-Mu[a]—para nabi, orang-orang kudus, dan mereka yang takut akan nama-Mu, baik orang kecil maupun orang besar—dan untuk membinasakan orang-orang yang membinasakan bumi[b].
  rationale: Perbaikan terbatas dilakukan untuk mengganti konjungsi yang mengubah hubungan antar klausa dan untuk memulihkan cakupan tunggal “waktu” atas ketiga tindakan infinitival dalam teks Yunani. Makna, istilah utama, serta semua jangkar dan isi catatan kaki dipertahankan.
