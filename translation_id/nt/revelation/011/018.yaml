id: REV.11.18
reference: Revelation 11:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ τὰ ἔθνη ὠργίσθησαν, καὶ ἦλθεν ἡ ὀργή σου καὶ ὁ καιρὸς τῶν νεκρῶν κριθῆναι καὶ δοῦναι τὸν μισθὸν τοῖς δούλοις σου τοῖς προφήταις καὶ τοῖς ἁγίοις καὶ τοῖς φοβουμένοις τὸ ὄνομά σου, ⸂τοὺς μικροὺς καὶ τοὺς μεγάλους⸃, καὶ διαφθεῖραι τοὺς διαφθείροντας τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/018.yaml
  text: And the nations became angry[a], and your wrath came, and the time for the dead to be judged, and to give the reward to your servants—the prophets, the saints, and those who fear your name[b], the small and the great—and to destroy those who destroy the earth.
translation:
  language: id
  text: Bangsa-bangsa menjadi marah, dan murka-Mu datang. Telah tiba waktunya bagi orang-orang mati untuk dihakimi, untuk memberikan upah kepada hamba-hamba-Mu[a]—para nabi, orang-orang kudus, dan mereka yang takut akan nama-Mu, baik orang kecil maupun orang besar—dan untuk membinasakan orang-orang yang membinasakan bumi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani doulos dapat berarti “hamba” atau “budak”, bergantung pada konteks.
    reason: alternative_reading
  - marker: b
    text: Kata Yunani gē juga dapat berarti “negeri” atau “tanah”. Kata yang diterjemahkan “membinasakan” juga dapat berarti “merusak” atau “mencemarkan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: bangsa-bangsa
  rationale: Menunjuk secara kolektif kepada bangsa-bangsa di dunia; padanan ini lebih sesuai daripada membatasinya pada orang bukan Yahudi.
- source_word: ὠργίσθησαν / ἡ ὀργή σου
  choice: menjadi marah / murka-Mu
  rationale: Pembedaan antara 'marah' bagi bangsa-bangsa dan 'murka' bagi Allah mempertahankan kaitan leksikal sekaligus nuansa penghakiman eskatologis pada murka Allah.
- source_word: ὁ καιρός
  choice: saatnya
  rationale: Menunjuk kepada waktu penentuan yang telah tiba; 'saatnya' alami dalam bahasa Indonesia dan menyampaikan momen yang ditetapkan oleh konteks.
- source_word: τῶν νεκρῶν κριθῆναι
  choice: orang-orang mati dihakimi
  rationale: Mempertahankan bentuk pasif dan makna yudisial tanpa memperjelas hasil penghakiman yang tidak dinyatakan dalam frasa ini.
- source_word: τὸν μισθόν
  choice: upah
  rationale: '''Upah'' merupakan padanan langsung yang tetap dapat berarti imbalan atau ganjaran dari Allah dalam konteks ini.'
- source_word: τοῖς δούλοις σου
  choice: kepada hamba-hamba-Mu
  rationale: '''Hamba'' adalah sebutan alami dan terhormat bagi mereka yang mengabdi dan menjadi milik Allah, sambil tetap dekat dengan cakupan makna doulos.'
- source_word: τοῖς ἁγίοις
  choice: orang-orang kudus
  rationale: Padanan baku dan mudah dipahami bagi umat yang dikhususkan bagi Allah.
- source_word: τοῖς φοβουμένοις τὸ ὄνομά σου
  choice: mereka yang takut akan nama-Mu
  rationale: Mempertahankan ungkapan alkitabiah tentang rasa takut yang penuh hormat kepada Allah tanpa menggantinya dengan penafsiran 'menghormati'.
- source_word: τοὺς μικροὺς καὶ τοὺς μεγάλους
  choice: baik orang kecil maupun orang besar
  rationale: Menyampaikan cakupan semua tingkat kedudukan secara alami sambil mempertahankan pasangan kontras sumber.
- source_word: διαφθεῖραι τοὺς διαφθείροντας
  choice: membinasakan orang-orang yang membinasakan
  rationale: Mempertahankan pengulangan akar kata dan ironi pembalasan dalam teks Yunani.
- source_word: τὴν γῆν
  choice: bumi
  rationale: Konteks penghakiman apokaliptik mendukung cakupan dunia; kemungkinan arti 'negeri/tanah' tetap dicatat.
theological_decisions:
- issue: Arti δοῦλος sebagai sebutan bagi umat Allah
  choice: hamba
  alternative: budak
  rationale: Konteks menonjolkan umat milik Allah yang menerima upah, bukan terutama status perbudakan. Namun, kemungkinan nuansa kepemilikan yang lebih kuat tidak dihapus dan dicatat dalam catatan kaki.
- issue: Cakupan γῆ
  choice: bumi
  alternative: negeri atau tanah
  rationale: Lingkup kosmis dari penghakiman dalam bagian ini mendukung 'bumi', tetapi kata Yunani tersebut juga dapat memiliki cakupan lokal.
- issue: Hubungan daftar penerima upah
  choice: hamba-hamba-Mu—para nabi, orang-orang kudus, dan mereka yang takut akan nama-Mu
  alternative: hamba-hamba-Mu, yaitu para nabi; serta orang-orang kudus dan mereka yang takut akan nama-Mu
  rationale: Struktur datif memungkinkan daftar kelompok yang berada di bawah cakupan pemberian upah. Tanda pisah mempertahankan hubungan yang cukup terbuka tanpa memaksakan bahwa semua kelompok sepenuhnya identik atau sepenuhnya terpisah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Paralel antara kemarahan bangsa-bangsa dan murka Allah dipertahankan, demikian pula pengulangan 'membinasakan'. 'Engkau' ditambahkan pada klausa pemberian upah agar struktur eliptis Yunani terbaca alami; pelakunya jelas dari 'murka-Mu'.
