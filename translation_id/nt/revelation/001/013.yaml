    issue: “kaki-kaki pelita”
    rationale: Bentuk ulang ini tidak dibutuhkan untuk menerjemahkan λυχνιῶν yang jamak; dalam bahasa Indonesia, “kaki pelita” sudah dapat merujuk kepada beberapa kaki pelita. Pengulangan juga berpotensi dipahami sebagai beberapa kaki pada satu pelita, bukan beberapa penyangga pelita.
  - severity: low
    issue: “berpakaian jubah” dan “berlilitkan selempang”
    rationale: “Berpakaian jubah” redundan, sedangkan “berlilitkan” tidak alami untuk menggambarkan sosok yang mengenakan selempang. Perumusan yang lebih idiomatis dapat tetap mencerminkan ἐνδεδυμένον dan περιεζωσμένον.
