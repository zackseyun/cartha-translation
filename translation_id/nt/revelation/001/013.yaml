  text: καὶ ἐν μέσῳ ⸀τῶν λυχνιῶν ὅμοιον ⸀υἱὸν ἀνθρώπου, ἐνδεδυμένον ποδήρη καὶ περιεζωσμένον πρὸς τοῖς μαστοῖς ζώνην χρυσᾶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/013.yaml
  text: and in the midst of the lampstands[a], one like a son of man, clothed in a robe reaching to the feet and girded across the chest with a golden sash.
translation:
  language: id
  text: dan di tengah-tengah kaki pelita itu ada seseorang seperti anak manusia,[a] mengenakan jubah yang panjang hingga ke kaki dan selempang emas yang melingkari dadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seseorang seperti Anak Manusia.” Ungkapan Yunani ini menggemakan Daniel 7:13 dan di sini diterapkan kepada Yesus yang dimuliakan.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν μέσῳ τῶν λυχνιῶν
  choice: di tengah-tengah kaki-kaki pelita itu
  rationale: Mempertahankan gambaran ruang serta membedakan λυχνία, yaitu penyangga pelita, dari pelitanya sendiri. Bentuk ulang 'kaki-kaki pelita' mengikuti kemajemukan sumber dan terdengar wajar dalam bahasa Indonesia.
- source_word: ὅμοιον υἱὸν ἀνθρώπου
  choice: seseorang yang menyerupai anak manusia
  rationale: Menyampaikan sosok yang tampak serupa dengan 'anak manusia' tanpa menjadikan frasa tanpa artikel itu secara eksplisit sebagai gelar. 'Seseorang' melengkapi ungkapan eliptis Yunani secara alami.
- source_word: ἐνδεδυμένον ποδήρη
  choice: berpakaian jubah yang panjangnya sampai ke kaki
  rationale: Mengungkapkan keadaan sosok yang mengenakan pakaian panjang; ποδήρης secara khusus menunjukkan pakaian yang mencapai kaki.
- source_word: περιεζωσμένον πρὸς τοῖς μαστοῖς
  choice: berlilitkan ... pada dada
  rationale: Menggambarkan selempang yang dikenakan tinggi pada batang tubuh. 'Pada dada' alami dalam bahasa Indonesia dan tetap mempertahankan acuan anatomis sumber.
- source_word: ζώνην χρυσᾶν
  choice: selempang emas
  rationale: ζώνη dapat berarti ikat pinggang atau selempang; letaknya pada dada mendukung 'selempang', sedangkan 'emas' secara ringkas menyatakan bahan atau sifat keemasannya.
theological_decisions:
- issue: Daya kristologis ungkapan ὅμοιον υἱὸν ἀνθρώπου
  choice: seseorang yang menyerupai anak manusia
  alternative: seseorang yang menyerupai Sang Anak Manusia
  rationale: Teks utama mempertahankan bentuk Yunani tanpa artikel dan gaung Daniel 7:13 tanpa diam-diam menetapkannya sebagai gelar definit. Catatan kaki menjaga pembacaan kristologis tradisional, sebab dalam konteks Wahyu sosok itu dikenali sebagai Yesus yang dimuliakan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat yang sesuai bagi penglihatan apokaliptik. Pilihan 'berpakaian' dan 'berlilitkan selempang' tetap mudah dipahami tanpa menjadi terlalu sehari-hari; urutan gambaran sumber dipertahankan.
