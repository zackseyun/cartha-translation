id: REV.1.5
reference: Revelation 1:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἀπὸ Ἰησοῦ Χριστοῦ, ὁ μάρτυς ὁ πιστός, ὁ πρωτότοκος τῶν νεκρῶν καὶ ὁ ἄρχων τῶν βασιλέων τῆς γῆς. Τῷ ἀγαπῶντι ἡμᾶς καὶ ⸀λύσαντι ἡμᾶς ⸀ἐκ τῶν ἁμαρτιῶν ἡμῶν ἐν τῷ αἵματι αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/005.yaml
  text: and from Jesus the Messiah[a], the faithful witness, the firstborn of the dead, and the ruler of the kings of the earth[b]. To him who loves us and freed us from our sins by his blood—
translation:
  language: id
  text: dan dari Yesus Sang Mesias[a], Saksi yang setia, Yang Sulung dari antara orang mati, dan Penguasa atas raja-raja di bumi. Bagi Dia yang mengasihi kita dan telah membebaskan kita dari dosa-dosa kita dengan darah-Nya[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Yesus Kristus.” Kata Yunani Christos berarti “Mesias.”
    reason: lexical_alternative
  - marker: b
    text: Sejumlah naskah membaca “telah membasuh kita dari dosa-dosa kita dengan darah-Nya” sebagai ganti “telah membebaskan kita dari dosa-dosa kita dengan darah-Nya.”
    reason: textual_variant
lexical_decisions:
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  rationale: Χριστός berfungsi sebagai gelar. 'Sang Mesias' menerjemahkan gelar itu secara alami dan penuh hormat dalam bahasa Indonesia, bukan memperlakukannya seperti nama keluarga.
- source_word: ὁ μάρτυς ὁ πιστός
  choice: Saksi yang setia
  rationale: μάρτυς berarti orang yang memberi kesaksian, sedangkan πιστός menyatakan kesetiaan sekaligus keandalan; frasa ini mempertahankan keduanya tanpa menggeser makna menjadi 'martir'.
- source_word: ὁ πρωτότοκος τῶν νεκρῶν
  choice: Yang Sulung dari antara orang mati
  rationale: '''Yang Sulung'' mempertahankan metafora πρωτότοκος dan nuansa keutamaan, sementara ''dari antara orang mati'' menyampaikan hubungannya dengan kebangkitan secara wajar tanpa menambahkan penjelasan teologis.'
- source_word: ὁ ἄρχων τῶν βασιλέων τῆς γῆς
  choice: Penguasa atas raja-raja di bumi
  rationale: ἄρχων menyatakan otoritas; 'atas' memperjelas hubungan kekuasaan terhadap para raja, dan γῆ dalam cakupan kitab ini paling tepat diterjemahkan 'bumi'.
- source_word: Τῷ ἀγαπῶντι ἡμᾶς
  choice: Bagi Dia yang mengasihi kita
  rationale: Partisipel kini ἀγαπῶντι menyatakan kasih yang berlangsung; bentuk 'yang mengasihi' alami dalam bahasa Indonesia dan mempertahankan konstruksi pujian yang berlanjut ke ayat berikutnya.
- source_word: λύσαντι ἡμᾶς ἐκ τῶν ἁμαρτιῶν ἡμῶν
  choice: telah membebaskan kita dari dosa-dosa kita
  rationale: λύω berarti melepaskan atau membebaskan, dan ἐκ menyatakan pemisahan. 'Telah membebaskan ... dari' mempertahankan citra pembebasan dan aspek tindakan yang sudah dilakukan.
- source_word: ἐν τῷ αἵματι αὐτοῦ
  choice: dengan darah-Nya
  rationale: ἐν di sini paling wajar dipahami secara instrumental. 'Dengan darah-Nya' menyampaikan sarana pembebasan sambil mempertahankan ungkapan darah yang penting dalam teks.
theological_decisions:
- issue: Varian teks pada partisipel sesudah 'mengasihi kita'
  choice: λύσαντι, 'telah membebaskan kita'
  alternative: λούσαντι, 'telah membasuh kita'
  rationale: Teks utama mengikuti SBLGNT yang membaca λύσαντι. Bacaan λούσαντι dikenal luas dan bermakna penting, sehingga dicatat dalam catatan kaki tanpa menggantikan teks sumber yang diberikan.
- issue: Penerjemahan gelar Χριστός
  choice: Sang Mesias
  alternative: Kristus
  rationale: Dalam konteks ini Χριστός merupakan gelar. Menerjemahkannya sebagai 'Sang Mesias' membuat fungsi gelar itu jelas dalam bahasa Indonesia tanpa menyangkal bentuk tradisional 'Kristus'.
- issue: Makna πρωτότοκος dalam kaitannya dengan orang mati
  choice: Yang Sulung dari antara orang mati
  alternative: yang pertama bangkit dari antara orang mati
  rationale: Pilihan utama mempertahankan metafora dan kemungkinan nuansa keutamaan, sedangkan alternatif akan mempersempit ungkapan menjadi urutan waktu saja.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada luhur namun mudah dipahami. Huruf kapital pada gelar utama dipakai secara wajar dalam konteks kristologis. Tanda pisah akhir dipertahankan karena kalimat doksologis berlanjut ke ayat berikutnya.
