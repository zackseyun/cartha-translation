id: REV.1.4
reference: Revelation 1:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἰωάννης ταῖς ἑπτὰ ἐκκλησίαις ταῖς ἐν τῇ Ἀσίᾳ· χάρις ὑμῖν καὶ εἰρήνη ⸀ἀπὸ ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος, καὶ ἀπὸ τῶν ἑπτὰ πνευμάτων ἃ ἐνώπιον τοῦ θρόνου αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/004.yaml
  text: 'John, to the seven churches in Asia: Grace to you and peace from him who is, and who was, and who is coming, and from the seven spirits who are before his throne,'
translation:
  language: id
  text: 'Yohanes, kepada ketujuh jemaat di Asia: Anugerah dan damai sejahtera bagi kalian dari Dia yang ada, yang telah ada, dan yang sedang datang,[a] serta dari ketujuh roh yang berada di hadapan takhta-Nya,[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, menurut ungkapan yang lebih tradisional, “Dia yang ada, yang telah ada, dan yang akan datang.”
    reason: lexical_alternative
  - marker: b
    text: “Ketujuh roh” mungkin secara simbolis menunjuk kepada kepenuhan Roh Kudus, atau kepada tujuh roh surgawi; teks Yunani sendiri berbunyi “ketujuh roh”.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰωάννης
  choice: Yohanes
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia Alkitabiah.
- source_word: ταῖς ἑπτὰ ἐκκλησίαις
  choice: kepada ketujuh jemaat
  rationale: Dalam konteks surat kepada komunitas-komunitas Kristen, 'jemaat' menyampaikan arti ἐκκλησία secara alami dan tepat.
- source_word: ἐν τῇ Ἀσίᾳ
  choice: di Asia
  rationale: Mengikuti ungkapan Yunani secara ringkas; yang dimaksud ialah provinsi Romawi bernama Asia, bukan seluruh benua modern.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: Anugerah dan damai sejahtera bagi kalian
  rationale: '''Anugerah'' menyampaikan χάρις dengan wajar; ''bagi kalian'' membuat datif jamak ὑμῖν jelas dan sesuai dengan para jemaat sebagai penerima.'
- source_word: ἀπὸ ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος
  choice: dari Dia yang ada, yang sudah ada, dan yang sedang datang
  rationale: Mempertahankan gelar ilahi dan pola tiga bagiannya. 'Sedang datang' mencerminkan daya verbal partisipel kini ὁ ἐρχόμενος tanpa mengubahnya menjadi sekadar keberadaan pada masa depan.
- source_word: τῶν ἑπτὰ πνευμάτων
  choice: ketujuh roh
  rationale: Mempertahankan bentuk jamak eksplisit dalam bahasa Yunani dan tidak menetapkan salah satu penafsiran teologis yang diperdebatkan.
- source_word: ἃ ἐνώπιον τοῦ θρόνου αὐτοῦ
  choice: yang berada di hadapan takhta-Nya
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan tidak memaksakan penentuan lebih lanjut mengenai hakikat ketujuh roh tersebut.
theological_decisions:
- issue: Identitas 'Dia yang ada, yang sudah ada, dan yang sedang datang'
  choice: Memperlakukan frasa itu sebagai gelar ilahi dan mempertahankan aspek kedatangan yang aktif.
  alternative: Dia yang ada, yang telah ada, dan yang akan datang
  rationale: Bahasa Yunani sengaja tidak biasa sesudah ἀπό dan tampaknya mempertahankan gelar ilahi. Terjemahan utama menjaga ketegangan gramatikal dan nuansa partisipel kini ὁ ἐρχόμενος; bentuk tradisional dicatat sebagai alternatif.
- issue: Identitas 'ketujuh roh'
  choice: Mempertahankan frasa harfiah 'ketujuh roh' dalam teks utama.
  alternative: Kepenuhan Roh Kudus; atau tujuh roh surgawi
  rationale: Teks Yunani memakai bentuk jamak, sedangkan identitas referennya diperdebatkan. Terjemahan tidak boleh menyelesaikan ambiguitas itu secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi 'Dia' dan akhiran '-Nya' menandai rujukan kepada Allah secara wajar dalam tradisi tulis Indonesia. 'Kalian' dipilih untuk memperjelas bahwa ὑμῖν berbentuk jamak. Penanda catatan kaki [a] dan [b] dicantumkan dalam teks utama.
