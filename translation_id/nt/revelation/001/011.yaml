id: REV.1.11
reference: Revelation 1:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: λεγούσης· Ὃ βλέπεις γράψον εἰς βιβλίον καὶ πέμψον ταῖς ἑπτὰ ἐκκλησίαις, εἰς Ἔφεσον καὶ εἰς Σμύρναν καὶ εἰς Πέργαμον καὶ εἰς Θυάτειρα καὶ εἰς Σάρδεις καὶ εἰς Φιλαδέλφειαν καὶ εἰς Λαοδίκειαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/011.yaml
  text: 'saying[a], “What you see[b], write in a book and send it to the seven churches: to Ephesus and to Smyrna and to Pergamum and to Thyatira and to Sardis and to Philadelphia and to Laodicea.”'
translation:
  language: id
  text: 'yang berkata, “Apa yang kaulihat, tulislah dalam sebuah kitab[a] dan kirimkanlah itu kepada ketujuh jemaat: kepada Efesus, kepada Smirna, kepada Pergamum, kepada Tiatira, kepada Sardis, kepada Filadelfia, dan kepada Laodikia.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gulungan” atau “dokumen tertulis”; kata Yunani βιβλίον dapat merujuk pada kitab, gulungan, atau dokumen.
    reason: lexical_alternative
lexical_decisions:
- source_word: λεγούσης
  choice: yang berkata
  rationale: Partisipel kini aktif feminin genitif ini melanjutkan gambaran tentang suara pada ayat sebelumnya. Bentuk relatif ini alami dalam bahasa Indonesia dan tidak menentukan lebih jauh siapa pembicaranya.
- source_word: Ὃ βλέπεις
  choice: Apa yang kaulihat
  rationale: Ungkapan ini menyampaikan cakupan umum dari isi penglihatan secara alami, tanpa mempersempitnya menjadi satu objek tertentu.
- source_word: γράψον
  choice: tulislah
  rationale: Imperatif aoris γράφω diterjemahkan langsung sebagai perintah untuk menulis; partikel -lah memberi bentuk perintah yang wajar dan bermartabat.
- source_word: εἰς βιβλίον
  choice: dalam sebuah kitab
  rationale: βιβλίον dapat menunjuk pada kitab, gulungan, atau dokumen tertulis. 'Kitab' sesuai dengan konteks karya tertulis, sementara kemungkinan bentuk fisiknya dipertahankan dalam catatan kaki.
- source_word: πέμψον
  choice: kirimkanlah itu
  rationale: Kata ganti 'itu' secara alami merujuk pada apa yang ditulis, yang tersirat dalam konteks Yunani.
- source_word: ταῖς ἑπτὰ ἐκκλησίαις
  choice: kepada ketujuh jemaat
  rationale: ἐκκλησίαις di sini menunjuk pada komunitas-komunitas Kristen tertentu. 'Jemaat' merupakan padanan Indonesia yang alami dan tidak menyiratkan denominasi tertentu.
- source_word: εἰς Ἔφεσον ... εἰς Λαοδίκειαν
  choice: kepada Efesus ... kepada Laodikia
  rationale: Pengulangan εἰς dipertahankan dengan 'kepada' untuk menampilkan setiap kota sebagai tujuan tersendiri dan menjaga daya retoris daftar tersebut.
theological_decisions:
- issue: Makna ἐκκλησίαις dalam Wahyu 1:11
  choice: jemaat
  alternative: perkumpulan
  rationale: Istilah ini merujuk pada komunitas-komunitas Kristen konkret yang menerima pesan melalui Yohanes. 'Jemaat' menyatakan acuan eklesialnya dengan jelas tanpa memasukkan kekhasan denominasi.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Nama kota memakai bentuk yang lazim dalam tradisi Alkitab Indonesia: Efesus, Smirna, Pergamum, Tiatira, Sardis, Filadelfia, dan Laodikia. Pengulangan ''kepada'' sengaja dipertahankan agar mencerminkan struktur distributif teks Yunani.'
