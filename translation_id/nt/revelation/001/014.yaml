id: REV.1.14
reference: Revelation 1:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἡ δὲ κεφαλὴ αὐτοῦ καὶ αἱ τρίχες λευκαὶ ὡς ἔριον λευκόν, ὡς χιών, καὶ οἱ ὀφθαλμοὶ αὐτοῦ ὡς φλὸξ πυρός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/014.yaml
  text: His head and hair were white[a], like white wool, like snow, and his eyes were like a flame of fire[b],
translation:
  language: id
  text: Kepala dan rambut-Nya putih[a], seperti bulu domba yang putih, seperti salju, dan mata-Nya seperti nyala api[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kepala-Nya dan rambut-Nya putih seperti bulu domba yang putih, seperti salju.”
    reason: lexical_alternative
  - marker: b
    text: Gambaran ini menggemakan Daniel 7:9 dan menegaskan sifat penglihatan dari uraian tersebut.
    reason: cross_reference
lexical_decisions:
- source_word: δὲ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel penghubung ringan ini tidak perlu dinyatakan dengan kata tersendiri dalam bahasa Indonesia; kesinambungan uraian sudah jelas dari konteks.
- source_word: ἡ κεφαλὴ αὐτοῦ καὶ αἱ τρίχες
  choice: kepala dan rambut-Nya
  rationale: Terjemahan langsung dan alami; bentuk jamak τρίχες lazim dinyatakan dengan nomina kolektif 'rambut' dalam bahasa Indonesia.
- source_word: λευκαὶ
  choice: putih
  rationale: Mempertahankan istilah warna dasar dan penekanan visual tanpa menambahkan tafsiran seperti kemurnian atau kemilau.
- source_word: ὡς ἔριον λευκόν
  choice: seperti bulu domba yang putih
  rationale: ἔριον berarti wol; ungkapan 'bulu domba' lebih mudah dipahami pembaca umum Indonesia, sedangkan 'yang putih' mempertahankan λευκόν secara eksplisit.
- source_word: ὡς χιών
  choice: seperti salju
  rationale: Mempertahankan perumpamaan kedua dan susunan kumulatif gambaran putih.
- source_word: οἱ ὀφθαλμοὶ αὐτοῦ
  choice: mata-Nya
  rationale: Terjemahan anatomis yang langsung; sufiks hormat pada '-Nya' sesuai acuan kepada Kristus dalam konteks.
- source_word: ὡς φλὸξ πυρός
  choice: seperti nyala api
  rationale: Ungkapan Indonesia yang alami dan tetap dekat dengan konstruksi Yunani serta citra apokaliptiknya.
theological_decisions:
- issue: Gambaran simbolis tentang sosok seperti Anak Manusia yang dimuliakan
  choice: Mempertahankan semua perumpamaan sebagai gambaran penglihatan tanpa menjelaskan maknanya dalam teks utama.
  alternative: Menambahkan gagasan kemurnian, kekekalan, hikmat, atau penghakiman.
  rationale: Ayat ini menyajikan citra, bukan penafsiran eksplisit atas simbol-simbol tersebut; penerjemahan tidak boleh menutup keluasan maknanya.
- issue: Cakupan kata sifat λευκαὶ pada kepala dan rambut
  choice: Menerjemahkan 'Kepala dan rambut-Nya putih' dan mencatat kemungkinan konstruksi yang lebih harfiah dalam catatan kaki.
  alternative: Menghubungkan perbandingan 'seperti bulu domba yang putih' secara eksplisit hanya dengan rambut.
  rationale: Susunan Yunani agak padat dan dapat dipahami sebagai kepala serta rambut yang putih, lalu dibandingkan dengan wol putih dan salju. Teks utama mengikuti bacaan alami itu tanpa menyembunyikan bentuk alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi pronomina ilahi mengikuti kelaziman penerbitan Alkitab Indonesia. Tanda koma mempertahankan rangkaian citra yang bertumpuk dalam penglihatan.
