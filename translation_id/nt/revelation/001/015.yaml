  text: καὶ οἱ πόδες αὐτοῦ ὅμοιοι χαλκολιβάνῳ, ὡς ἐν καμίνῳ ⸀πεπυρωμένης, καὶ ἡ φωνὴ αὐτοῦ ὡς φωνὴ ὑδάτων πολλῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/015.yaml
  text: and his feet were like burnished bronze[a], as if refined in a furnace, and his voice was like the sound of many waters[b],
translation:
  language: id
  text: dan kaki-Nya seperti perunggu berkilau[a], seolah-olah dimurnikan dalam tungku, dan suara-Nya seperti gemuruh air yang melimpah[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Istilah langka yang diterjemahkan “perunggu berkilau” mungkin menunjuk kepada logam campuran yang sangat murni atau berpijar; terjemahan lain: “kuningan murni” atau “perunggu mengilap”.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “seperti suara banyak air”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πόδες
  choice: kaki
  rationale: πούς secara langsung berarti ‘kaki’; padanan ini mempertahankan gambaran penglihatan tanpa memperluasnya menjadi seluruh tungkai.
- source_word: ὅμοιοι
  choice: seperti
  rationale: ὅμοιος menyatakan kemiripan; ‘seperti’ merupakan bentuk perbandingan yang alami dan jelas dalam bahasa Indonesia.
- source_word: χαλκολιβάνῳ
  choice: perunggu berkilau
  rationale: χαλκολίβανον adalah istilah langka dengan jenis logam yang tidak pasti, kemungkinan suatu logam campuran atau perunggu yang sangat halus dan bercahaya. ‘Perunggu berkilau’ menyampaikan kecemerlangan logam tanpa memastikan komposisinya secara berlebihan.
- source_word: ὡς ἐν καμίνῳ πεπυρωμένης
  choice: seolah-olah dimurnikan dalam tungku
  rationale: κάμινος berarti tungku, khususnya tungku peleburan, sedangkan πεπυρωμένης menggambarkan sesuatu yang dipanaskan, dibakar, atau dimurnikan dengan api. ‘Seolah-olah’ mempertahankan daya perbandingan ὡς.
- source_word: φωνή
  choice: suara
  rationale: Pada kemunculan pertama, φωνή menunjuk kepada suara pribadi tokoh tersebut, sehingga ‘suara’ merupakan padanan yang tepat.
- source_word: ὡς φωνὴ ὑδάτων πολλῶν
  choice: seperti gemuruh air bah
  rationale: Ungkapan ini menggambarkan bunyi dahsyat dari banyak air. ‘Gemuruh air bah’ menghasilkan gambaran auditif yang kuat dan wajar dalam bahasa Indonesia, sementara terjemahan yang lebih harfiah dicatat dalam catatan kaki agar pengulangan φωνή dan bentuk jamak ‘air-air’ tidak hilang.
theological_decisions:
- issue: Penerjemahan φωνή yang diulang dalam perbandingan terakhir
  choice: suara-Nya seperti gemuruh air bah
  alternative: suara-Nya seperti suara banyak air
  rationale: Pilihan utama menyampaikan kedahsyatan suara dalam bahasa Indonesia yang alami tanpa mengidentifikasikannya dengan fenomena tertentu seperti ombak laut. Catatan kaki mempertahankan bentuk yang lebih harfiah dan pengulangan ‘suara’, sehingga bobot gambaran tentang keagungan Sang Anak Manusia tetap terjaga.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mengikuti rangkaian gambaran Yunani, sedangkan ungkapan metaforis dibuat cukup alami bagi pembaca umum. Penanda catatan kaki telah ditempatkan sesuai isi catatannya; urutan yang keliru pada lapisan konsultasi Inggris tidak diikuti.
