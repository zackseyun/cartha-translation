id: REV.1.18
reference: Revelation 1:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ὁ ζῶν— καὶ ἐγενόμην νεκρὸς καὶ ἰδοὺ ζῶν εἰμι εἰς τοὺς αἰῶνας τῶν ⸀αἰώνων— καὶ ἔχω τὰς κλεῖς τοῦ θανάτου καὶ τοῦ ᾅδου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/018.yaml
  text: and the Living One—I became dead[a], and behold[c][b], I am alive forever and ever—and I have the keys of death and of Hades.
translation:
  language: id
  text: dan Yang Hidup—Aku pernah mati[a], dan lihatlah, Aku hidup selama-lamanya[b]—dan Aku memegang kunci-kunci maut dan Hades[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Aku menjadi mati”; bahasa Yunani menekankan peralihan menuju kematian.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “sampai zaman-zaman segala zaman,” sebuah ungkapan yang berarti durasi tanpa akhir.
    reason: lexical_alternative
  - marker: c
    text: “Hades” mengacu pada alam orang mati, bukan secara khusus pada tempat hukuman akhir.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ζῶν
  choice: Yang Hidup
  rationale: Partisipel kini dengan artikel berfungsi sebagai gelar substantival. “Yang Hidup” mempertahankan bentuk gelar dan gema penyebutan ilahi tanpa mengubahnya menjadi sekadar klausa verbal.
- source_word: ἐγενόμην νεκρός
  choice: Aku pernah mati
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan menyatakan keadaan kematian yang sungguh dialami. Nuansa harfiah γίνομαι, yaitu peralihan menjadi mati, dipertahankan dalam catatan kaki.
- source_word: ἰδοὺ
  choice: lihatlah
  rationale: Mempertahankan daya seru dan penunjukan yang hidup dalam ragam bahasa yang bermartabat serta mudah dipahami.
- source_word: ζῶν εἰμι
  choice: Aku hidup
  rationale: Padanan Indonesia yang alami bagi partisipel dengan εἰμί dan tetap menonjolkan pertentangan dengan kematian sebelumnya.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: selama-lamanya
  rationale: Padanan idiomatis baku untuk rumusan durasi tanpa akhir; bentuk harfiahnya dijelaskan dalam catatan kaki.
- source_word: κλεῖς
  choice: kunci-kunci
  rationale: Bentuk jamak sumber dipertahankan dan dalam konteks melambangkan kewenangan atau kendali.
- source_word: τοῦ θανάτου
  choice: maut
  rationale: “Maut” merupakan padanan yang ringkas, bermartabat, dan sesuai bagi θάνατος dalam konteks apokaliptik tanpa mewajibkan personifikasi.
- source_word: τοῦ ᾅδου
  choice: Hades
  rationale: Transliterasi ini menjaga kekhususan istilah Yunani dan tidak menyamakannya dengan kubur fisik ataupun hukuman akhir.
- source_word: ἔχω
  choice: Aku memegang
  rationale: Dalam gambaran kunci, “memegang” secara alami menyampaikan kepemilikan sekaligus kewenangan yang tersirat oleh ἔχω.
theological_decisions:
- issue: Pemaknaan ᾅδης dalam konteks eskatologis
  choice: Hades
  alternative: alam orang mati; kubur; neraka
  rationale: “Hades” mempertahankan pembedaan antara maut dan ᾅδης sebagai kenyataan yang berkaitan tetapi tidak identik. Pilihan ini tidak membatasinya pada kubur jasmani dan tidak menyamakannya dengan tempat hukuman akhir.
- issue: Nuansa kematian dalam ἐγενόμην νεκρός
  choice: Aku pernah mati, dengan penjelasan harfiah dalam catatan kaki
  alternative: Aku menjadi mati
  rationale: Terjemahan utama memakai ungkapan Indonesia yang wajar, sementara catatan kaki mempertahankan penekanan Yunani pada peralihan menuju kematian, tanpa mengurangi kenyataan kematian dan kehidupan kembali.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam agung namun tetap mudah dipahami. Tanda pisah mempertahankan struktur retoris dan kontras dramatis teks Yunani. Huruf kapital pada “Yang Hidup” menandai pemakaiannya sebagai gelar; “Aku” dikapitalisasi sesuai konvensi penghormatan dalam penerbitan Alkitab bahasa Indonesia.
