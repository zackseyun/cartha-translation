  terminology: “Tempat pelita” secara tepat mempertahankan pembedaan λυχνία dari λύχνος/pelita dan dapat dipakai secara konsisten dalam konteks simbolis Wahyu 1:20. “Dari emas” dengan jelas menyatakan bahan yang dimaksud χρυσᾶς.
