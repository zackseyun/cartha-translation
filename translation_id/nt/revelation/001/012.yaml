  text: ⸀Καὶ ἐπέστρεψα βλέπειν τὴν φωνὴν ἥτις ἐλάλει μετ’ ἐμοῦ· καὶ ἐπιστρέψας εἶδον ἑπτὰ λυχνίας χρυσᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/012.yaml
  text: And I turned to see the voice that was speaking with me[a], and when I turned, I saw seven golden lampstands,
translation:
  language: id
  text: Lalu aku berpaling untuk melihat suara yang sedang berbicara denganku[a]. Setelah berpaling, aku melihat tujuh tempat pelita dari emas,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sedang berbicara kepadaku.” Secara harfiah, bahasa Yunani berbunyi “sedang berbicara denganku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέστρεψα
  choice: aku berpaling
  rationale: Bentuk aoristus aktif ini menunjuk pada tindakan fisik membalikkan arah. 'Berpaling' alami dalam konteks dan tidak menambahkan gagasan yang tidak dinyatakan.
- source_word: βλέπειν
  choice: untuk melihat
  rationale: Infinitif ini menyatakan tujuan tindakan berpaling. Ungkapan 'melihat suara' dipertahankan karena merupakan citraan khas teks Yunani, yakni berusaha melihat sumber atau sosok yang bersuara.
- source_word: φωνὴν
  choice: suara
  rationale: Dalam konteks ujaran, φωνή berarti suara, bukan sekadar bunyi.
- source_word: ἐλάλει μετ’ ἐμοῦ
  choice: sedang berbicara denganku
  rationale: Bentuk imperfek menyatakan tindakan yang sedang berlangsung. 'Denganku' mempertahankan μετά dengan genitif, sementara 'kepadaku' tetap mungkin secara idiomatis.
- source_word: ἐπιστρέψας
  choice: setelah berpaling
  rationale: Partisip aoristus mendahului tindakan melihat dan paling alami dinyatakan sebagai urutan waktu.
- source_word: εἶδον
  choice: aku melihat
  rationale: Padanan langsung bagi aoristus ὁράω tanpa perluasan.
- source_word: ἑπτὰ λυχνίας χρυσᾶς
  choice: tujuh kaki pelita emas
  rationale: λυχνία menunjuk pada penyangga pelita, bukan pelitanya sendiri. 'Kaki pelita' merupakan ungkapan Indonesia yang konkret dan menjaga pembedaan itu; χρυσᾶς diterjemahkan secara ringkas sebagai 'emas'.
theological_decisions:
- issue: Penerjemahan λυχνίας sebagai objek simbolis dalam Wahyu
  choice: kaki pelita
  alternative: pelita
  rationale: Istilah ini harus tetap menunjuk pada penyangga pelita karena Wahyu 1:20 kemudian menafsirkan ketujuh objek tersebut secara simbolis. 'Pelita' akan mengaburkan citraan dan keterkaitan antarbagian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Citraan 'melihat suara' sengaja dipertahankan, dan pengulangan kata 'berpaling' mengikuti struktur retoris teks Yunani.
