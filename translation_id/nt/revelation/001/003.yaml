id: REV.1.3
reference: Revelation 1:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μακάριος ὁ ἀναγινώσκων καὶ οἱ ἀκούοντες τοὺς λόγους τῆς προφητείας καὶ τηροῦντες τὰ ἐν αὐτῇ γεγραμμένα, ὁ γὰρ καιρὸς ἐγγύς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/003.yaml
  text: Blessed is the one who reads aloud[a], and those who hear the words of this prophecy and keep what is written in it[b], for the time is near.
translation:
  language: id
  text: Berbahagialah orang yang membacakan[a], dan mereka yang mendengar perkataan nubuat ini serta menuruti apa yang tertulis di dalamnya, sebab waktunya sudah dekat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang yang membaca”; bahasa Yunani kemungkinan menunjuk kepada orang yang membacakan nubuat ini di hadapan jemaat.
    reason: lexical_alternative
  - marker: b
    text: Atau “sebab waktu yang ditetapkan itu sudah dekat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: Berbahagialah
  rationale: Ungkapan baku untuk ucapan bahagia dalam Perjanjian Baru; menyatakan keadaan orang yang menerima perkenanan dan berkat Allah, bukan sekadar perasaan senang.
- source_word: ὁ ἀναγινώσκων
  choice: orang yang membacakan
  rationale: Bentuk tunggal yang dipasangkan dengan para pendengar dalam bentuk jamak sangat mungkin menunjuk kepada pembaca di hadapan jemaat. 'Membacakan' menyampaikan konteks lisan itu secara alami.
- source_word: οἱ ἀκούοντες
  choice: mereka yang mendengar
  rationale: '''Mendengar'' mempertahankan gambaran penerimaan perkataan yang dibacakan dan tidak mendahului unsur ketaatan yang dinyatakan oleh participel berikutnya.'
- source_word: τοὺς λόγους τῆς προφητείας
  choice: perkataan-perkataan nubuat ini
  rationale: Bentuk jamak λόγους dipertahankan, sedangkan 'ini' secara alami menunjuk kepada nubuat yang terkandung dalam kitab yang sedang dibacakan.
- source_word: τηροῦντες
  choice: menuruti
  rationale: Dalam konteks ini τηρέω menyatakan pemeliharaan yang diwujudkan dalam ketaatan. 'Menuruti' lebih alami dalam bahasa Indonesia daripada 'memelihara apa yang tertulis' tanpa mempersempitnya menjadi sekadar kepatuhan pada peraturan.
- source_word: τὰ ἐν αὐτῇ γεγραμμένα
  choice: apa yang tertulis di dalamnya
  rationale: Ungkapan idiomatis ini mewakili participel perfek pasif netral jamak dan mempertahankan acuan αὐτῇ kepada nubuat tersebut.
- source_word: ὁ γὰρ καιρὸς
  choice: sebab waktunya
  rationale: καιρός dapat berarti waktu yang menentukan atau ditetapkan. 'Waktunya' alami dan tetap membiarkan nuansa waktu tertentu yang dimaksud tanpa menafsirkannya secara berlebihan.
- source_word: ἐγγύς
  choice: sudah dekat
  rationale: Ungkapan Indonesia yang jelas untuk kedekatan temporal. Kata 'sudah' menyampaikan keadaan kini yang ditegaskan teks, tanpa menentukan skema penggenapannya.
theological_decisions:
- issue: Latar pembacaan umum yang tersirat oleh seorang pembaca dan banyak pendengar
  choice: Menerjemahkan ἀναγινώσκων sebagai 'orang yang membacakan'.
  alternative: '''orang yang membaca'' tanpa menyatakan nuansa lisan secara eksplisit'
  rationale: Kontras antara satu pembaca dan sejumlah pendengar kuat mengisyaratkan pembacaan di hadapan jemaat. Pilihan ini menjelaskan latar yang mungkin dimaksud tanpa memasukkan ajaran denominasi.
- issue: Daya eskatologis καιρός ἐγγύς
  choice: Menerjemahkannya sebagai 'waktunya sudah dekat'.
  alternative: '''waktu yang ditetapkan itu sudah dekat'''
  rationale: Teks menegaskan kedekatan waktu, tetapi tidak menjabarkan kronologi atau pola penggenapannya. Terjemahan mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur seorang pembaca dan banyak pendengar dipertahankan. 'Perkataan-perkataan' dipilih untuk mencerminkan bentuk jamak λόγους, sedangkan 'menuruti' menyampaikan kesetiaan yang taat secara wajar bagi pembaca umum.
