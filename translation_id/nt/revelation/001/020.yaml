id: REV.1.20
reference: Revelation 1:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: τὸ μυστήριον τῶν ἑπτὰ ἀστέρων ⸀οὓς εἶδες ἐπὶ τῆς δεξιᾶς μου, καὶ τὰς ἑπτὰ λυχνίας τὰς χρυσᾶς· οἱ ἑπτὰ ἀστέρες ἄγγελοι τῶν ἑπτὰ ἐκκλησιῶν εἰσίν, καὶ αἱ λυχνίαι αἱ ἑπτὰ ἑπτὰ ἐκκλησίαι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/020.yaml
  text: 'As for the mystery of the seven stars that you saw in my right hand[a], and the seven golden lampstands: the seven stars are the angels of the seven churches, and the seven lampstands are the seven churches.'
translation:
  language: id
  text: 'Adapun rahasia tujuh bintang yang kaulihat di tangan kanan-Ku dan tujuh kaki pelita emas itu: tujuh bintang itu adalah malaikat-malaikat dari tujuh jemaat[a], dan tujuh kaki pelita itu adalah tujuh jemaat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “utusan-utusan dari tujuh jemaat.” Kata Yunani yang dipakai dapat berarti malaikat ataupun utusan manusia.
    reason: alternative_reading
lexical_decisions:
- source_word: μυστήριον
  choice: rahasia
  rationale: Dalam konteks apokaliptik, kata ini menunjuk pada makna ilahi yang sebelumnya tersembunyi tetapi kini disingkapkan. “Rahasia” mempertahankan resonansi alkitabiah dan lebih alami dalam bahasa Indonesia daripada “misteri,” yang dapat menyiratkan teka-teki yang belum terpecahkan.
- source_word: ἀστέρων / ἀστέρες
  choice: bintang / bintang-bintang
  rationale: Padanan langsung yang mempertahankan gambaran penglihatan; bentuk “ketujuh bintang” alami sesudah kata bilangan dan dijelaskan dalam klausa berikutnya.
- source_word: οὓς εἶδες
  choice: yang kaulihat
  rationale: Mempertahankan klausa relatif yang menerangkan ketujuh bintang dengan bentuk pronominal yang ringkas, alami, dan bermartabat.
- source_word: ἐπὶ τῆς δεξιᾶς μου
  choice: di tangan kanan-Ku
  rationale: Sesuai dengan gambaran dalam konteks dekat bahwa bintang-bintang berada dalam tangan kanan Sang Pembicara; “di tangan” merupakan idiom Indonesia yang alami.
- source_word: λυχνίας
  choice: kaki pelita
  rationale: Kata Yunani menunjuk pada penyangga atau tempat pelita, bukan pada pelita itu sendiri. “Kaki pelita” mempertahankan benda konkret dalam penglihatan dan merupakan istilah Indonesia yang mudah dipahami.
- source_word: χρυσᾶς
  choice: emas
  rationale: Dalam frasa “kaki pelita emas,” bentuk ini singkat dan alami serta menyampaikan bahwa kaki-kaki pelita itu terbuat dari atau bercirikan emas.
- source_word: ἄγγελοι
  choice: malaikat-malaikat
  rationale: Kata Yunani dapat menunjuk kepada malaikat atau utusan manusia. Karena Wahyu lazim memakainya bagi makhluk surgawi, “malaikat-malaikat” dipakai dalam teks utama, sedangkan kemungkinan “utusan-utusan” dipertahankan dalam catatan kaki.
- source_word: ἐκκλησιῶν / ἐκκλησίαι
  choice: jemaat
  rationale: “Jemaat” adalah padanan Indonesia yang baku dan kontekstual untuk komunitas-komunitas lokal yang disapa dalam Wahyu, tanpa menggeser fokus kepada gedung atau lembaga.
- source_word: τὸ μυστήριον ... καὶ ...
  choice: 'Adapun rahasia ... dan ... itu:'
  rationale: Susunan bertopik ini mencerminkan bentuk Yunani yang terlebih dahulu menyebut unsur-unsur penglihatan lalu memberikan penjelasannya. Tanda titik dua memperjelas hubungan itu tanpa menambahkan kata kerja yang tidak tersurat.
theological_decisions:
- issue: Rujukan ἄγγελοι τῶν ἑπτὰ ἐκκλησιῶν
  choice: malaikat-malaikat ketujuh jemaat
  alternative: utusan-utusan ketujuh jemaat
  rationale: ἄγγελος secara leksikal dapat berarti makhluk surgawi atau utusan manusia. Teks tidak secara tegas menyelesaikan identitas mereka. Makna “malaikat” dipertahankan dalam teks utama karena dominan dalam kitab Wahyu, sementara kemungkinan manusiawi dicatat agar ketegangan penafsiran tetap terbuka.
translation_notes:
  register: Bahasa Indonesia standar modern dengan ragam yang alami dan bermartabat. Bentuk “kaulihat” dan “kanan-Ku” menjaga kelancaran tuturan langsung. Pengulangan “ketujuh” dipertahankan mengikuti penekanan dan struktur sumber Yunani.
