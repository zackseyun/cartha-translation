  text: ἐγενόμην ἐν πνεύματι ἐν τῇ κυριακῇ ἡμέρᾳ, καὶ ἤκουσα ⸂ὀπίσω μου φωνὴν⸃ μεγάλην ὡς σάλπιγγος
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/010.yaml
  text: I came to be in the Spirit on the Lord’s day[a], and I heard behind me a loud voice like a trumpet[b],
translation:
  language: id
  text: Pada hari Tuhan[a] aku berada dalam Roh[b], lalu aku mendengar dari belakangku suara nyaring seperti bunyi sangkakala,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, meski kemungkinannya lebih kecil, frasa ini dapat dipahami dalam arti eskatologis, yaitu hari Tuhan yang akan datang. Bahasa Yunani di sini memakai κυριακῇ ἡμέρᾳ, secara harfiah “hari milik Tuhan,” bukan ungkapan yang lebih lazim untuk “hari Tuhan” yang eskatologis.
    reason: alternative_reading
  - marker: b
    text: Atau “dalam roh.” Frasa ini dapat berarti berada di bawah pengaruh kenabian Roh Kudus; teks tidak secara eksplisit mengatakan bahwa Yohanes berada dalam keadaan kesurupan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενόμην
  choice: aku berada
  rationale: Dalam ungkapan ἐγενόμην ἐν πνεύματι, bahasa Indonesia alami memakai 'aku berada dalam Roh'. Ini menyatakan masuk atau hadir dalam suatu keadaan tanpa menambahkan gagasan 'kesurupan' yang tidak disebutkan teks.
- source_word: ἐν πνεύματι
  choice: dalam Roh
  rationale: Dalam rumusan penglihatan kitab Wahyu, frasa ini kemungkinan besar menunjuk pada pengaruh kenabian Roh Kudus. Huruf kapital mencerminkan kemungkinan itu, sementara catatan kaki mempertahankan alternatif 'dalam roh'.
- source_word: ἐν τῇ κυριακῇ ἡμέρᾳ
  choice: pada hari Tuhan
  rationale: Kata sifat κυριακῇ berarti 'milik Tuhan' atau 'yang berkaitan dengan Tuhan'. Dalam bahasa Indonesia, 'hari Tuhan' merupakan padanan ringkas dan alami; catatan kaki membedakannya dari ungkapan eskatologis Yunani yang lebih lazim.
- source_word: ἤκουσα
  choice: aku mendengar
  rationale: Bentuk aoris ἀκούω di sini melaporkan persepsi pendengaran, bukan tindakan menyimak dengan sengaja.
- source_word: ὀπίσω μου
  choice: dari belakangku
  rationale: 'Makna tempat paling sesuai dengan konteks: suara itu terdengar berasal dari belakang Yohanes.'
- source_word: φωνὴν μεγάλην
  choice: suara nyaring
  rationale: Dengan φωνή, μέγας menyatakan keras atau kuatnya suara. 'Suara nyaring' idiomatis dan mempertahankan penekanan auditori.
- source_word: ὡς σάλπιγγος
  choice: seperti bunyi sangkakala
  rationale: Tambahan 'bunyi' membuat perbandingan antara suara dan kualitas suara sangkakala jelas dalam bahasa Indonesia, tanpa mengubah citra dasarnya.
theological_decisions:
- issue: Apakah ἐν πνεύματι harus dipahami sebagai keadaan penglihatan seperti kesurupan atau diterjemahkan lebih harfiah
  choice: dalam Roh
  alternative: dalam roh; dalam keadaan kesurupan
  rationale: Frasa itu kemungkinan menandakan ilham kenabian oleh Roh Kudus, tetapi bahasa Yunani tidak secara eksplisit mengatakan 'kesurupan'. Terjemahan utama mempertahankan ungkapan harfiah dan ketegangan penafsirannya.
- issue: Apakah κυριακῇ ἡμέρᾳ menunjuk pada hari ibadah mingguan umat Kristen atau hari Tuhan yang eskatologis
  choice: hari Tuhan
  alternative: hari kedatangan Tuhan; hari penghakiman Tuhan
  rationale: Bentuk Yunani memakai kata sifat κυριακός, 'milik Tuhan', bukan konstruksi yang lebih lazim bagi 'hari Tuhan' eskatologis. Terjemahan tidak menetapkan lebih jauh hari apa yang dimaksud, sedangkan catatan menjelaskan kemungkinan yang lebih kecil.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Susunan keterangan waktu di awal ayat memperjelas alur. 'Sangkakala' dipilih daripada 'terompet' untuk mempertahankan warna sastra dan dunia kuno, tetapi 'bunyi' ditambahkan agar perbandingan auditori alami. Semua penanda catatan kaki muncul dalam teks utama.
