id: REV.1.8
reference: Revelation 1:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἐγώ εἰμι τὸ Ἄλφα καὶ τὸ Ὦ, λέγει κύριος, ὁ θεός, ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος, ὁ παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/008.yaml
  text: “I am the Alpha and the Omega,” says the Lord God[a], “the one who is and who was and who is coming, the Almighty.”
translation:
  language: id
  text: “Akulah Alfa dan Omega,” kata Tuhan Allah, Yang Ada, Yang Dahulu Ada, dan Yang Sedang Datang[a], Yang Mahakuasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yang Akan Datang.”
    reason: Alternatif leksikal yang lebih tradisional dan idiomatis bagi ὁ ἐρχόμενος.
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Akulah
  rationale: Bentuk “Akulah” menyampaikan kopula sekaligus penekanan dari pronomina ἐγώ secara alami dalam bahasa Indonesia.
- source_word: τὸ Ἄλφα καὶ τὸ Ὦ
  choice: Alfa dan Omega
  rationale: Nama huruf Yunani dipertahankan untuk menjaga daya simbolis dan ungkapan apokaliptik yang sudah dikenal, bukan diganti dengan nama huruf Latin.
- source_word: λέγει
  choice: kata
  rationale: Menerjemahkan verba kala kini secara langsung dan alami dalam formula ujaran bahasa Indonesia tanpa menambahkan nuansa yang tidak tersurat.
- source_word: κύριος ὁ θεός
  choice: Tuhan Allah
  rationale: Mencerminkan kedua gelar ilahi yang berdampingan; “Tuhan” merupakan padanan baku bagi κύριος dan “Allah” bagi θεός.
- source_word: ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος
  choice: Dia yang ada, yang dahulu ada, dan yang sedang datang
  rationale: Susunan tiga bagian dipertahankan. “Sedang datang” mencerminkan partisipel kini ἐρχόμενος dan menampilkan gerak kedatangan secara aktif, sedangkan “dahulu ada” mengungkapkan bentuk lampau secara alami.
- source_word: ὁ παντοκράτωρ
  choice: Yang Mahakuasa
  rationale: Padanan Indonesia yang mapan dan wajar bagi gelar ilahi παντοκράτωρ, yang menyatakan kuasa dan kedaulatan menyeluruh.
theological_decisions:
- issue: Sebutan diri ilahi yang menghubungkan keberadaan Allah dengan kedatangan-Nya
  choice: Dia yang ada, yang dahulu ada, dan yang sedang datang
  alternative: Dia yang ada, yang dahulu ada, dan yang akan datang
  rationale: Partisipel kini ὁ ἐρχόμενος lebih langsung tercermin dalam “yang sedang datang,” sehingga gerak eskatologisnya tidak diubah diam-diam menjadi pernyataan masa depan semata. “Yang akan datang” tetap merupakan pembacaan idiomatis dan tradisional yang sah, sehingga dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan khidmat. “Akulah” mempertahankan penekanan tanpa terasa kaku; “kata Tuhan Allah” tetap dekat dengan bentuk ujaran Yunani. Penanda catatan kaki ditempatkan tepat setelah frasa yang diterangkan.
