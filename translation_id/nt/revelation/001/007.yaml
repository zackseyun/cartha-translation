id: REV.1.7
reference: Revelation 1:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἰδοὺ ἔρχεται μετὰ τῶν νεφελῶν, καὶ ὄψεται αὐτὸν πᾶς ὀφθαλμὸς καὶ οἵτινες αὐτὸν ἐξεκέντησαν, καὶ κόψονται ἐπ’ αὐτὸν πᾶσαι αἱ φυλαὶ τῆς γῆς. ναί, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/007.yaml
  text: Look[a], he is coming with the clouds, and every eye will see him, even those who pierced him, and all the tribes of the earth will mourn over him. Yes, amen.
translation:
  language: id
  text: Lihatlah, Dia datang dengan awan-awan, dan setiap mata akan melihat Dia, bahkan mereka yang telah menusuk Dia, dan semua suku di bumi[a] akan meratapi Dia. Ya, amin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “semua suku di negeri itu akan meratapi Dia.” Frasa ini mungkin menggemakan Zakharia 12:10–12, yang memungkinkan arti “negeri”.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Lihatlah
  rationale: Seruan ini menarik perhatian secara hidup. “Lihatlah” alami dalam bahasa Indonesia masa kini sekaligus mempertahankan daya retoris teks Yunani.
- source_word: ἔρχεται
  choice: Dia datang
  rationale: Bentuk kini Yunani memberi kesan kedatangan yang nyata dan segera. Bentuk “datang” dalam bahasa Indonesia dapat mempertahankan daya kini-futural itu tanpa tambahan yang tidak perlu.
- source_word: μετὰ τῶν νεφελῶν
  choice: dengan awan-awan
  rationale: Mempertahankan gambaran awan dalam gema Daniel 7:13. Pengulangan “awan-awan” menyatakan bentuk jamak secara wajar dalam bahasa Indonesia.
- source_word: ὄψεται
  choice: akan melihat
  rationale: Bentuk futur diterjemahkan secara langsung dan alami.
- source_word: πᾶς ὀφθαλμὸς
  choice: setiap mata
  rationale: Mempertahankan ungkapan konkret dan distributif teks Yunani, bukan meratakannya menjadi “semua orang”.
- source_word: οἵτινες
  choice: termasuk mereka yang
  rationale: Menandai kelompok tertentu di dalam cakupan “setiap mata” dengan ungkapan Indonesia yang jelas dan alami.
- source_word: ἐξεκέντησαν
  choice: menikam
  rationale: “Menikam” mempertahankan gagasan penembusan oleh benda tajam serta kaitan verbal dengan Zakharia 12:10 dan Yohanes 19:37.
- source_word: κόψονται
  choice: akan meratapi
  rationale: Kata kerja ini menyatakan ratapan atau perkabungan. “Meratapi” menyampaikan suasana dukacita dengan khidmat tanpa menentukan gerak tubuh tertentu.
- source_word: ἐπ’ αὐτὸν
  choice: Dia
  rationale: Sebagai objek langsung dari “meratapi”, bentuk ini secara idiomatis menyampaikan ratapan atas Dia. Kemungkinan nuansa “karena Dia” tidak dipaksakan ke dalam teks utama.
- source_word: πᾶσαι αἱ φυλαὶ τῆς γῆς
  choice: semua suku di bumi
  rationale: φυλαί secara khusus berarti “suku-suku”, sedangkan γῆ dapat berarti “bumi” atau “negeri/tanah”. Cakupan universal “setiap mata” mendukung “bumi” dalam teks utama; alternatif “negeri itu” dicatat karena gema Zakharia 12.
- source_word: ναί, ἀμήν
  choice: Ya, amin
  rationale: Mempertahankan penegasan ganda serta bobot liturgis “amin”, yang sudah lazim dipahami dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan τῆς γῆς dalam frasa πᾶσαι αἱ φυλαὶ τῆς γῆς
  choice: semua suku di bumi
  alternative: semua suku di negeri itu
  rationale: Gambaran kedatangan yang dilihat oleh “setiap mata” mendukung cakupan seluruh bumi. Namun, gema Zakharia 12:10–12 memungkinkan acuan kepada suatu negeri; karena itu, ketegangan tersebut dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan konkret seperti “setiap mata” dan “semua suku” dipertahankan, sementara hubungan antarklausa dibuat alami bagi pembaca umum. Huruf kapital pada “Dia” dipakai sebagai bentuk rujukan hormat yang lazim kepada Kristus, tanpa menambahkan penafsiran doktrinal.
