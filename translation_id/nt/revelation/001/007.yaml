  to: Lihatlah, Dia datang dengan awan-awan, dan setiap mata akan melihat Dia, bahkan mereka yang telah menusuk Dia, dan semua suku di bumi[a] akan meratapi Dia. Ya, amin.
  rationale: Revisi terbatas pada penggantian “menikam” dengan “telah menusuk” dan pemulihan hubungan antarklausa. Pilihan “bumi” di teks utama serta alternatif “negeri itu” dalam catatan kaki dipertahankan karena keduanya memungkinkan dalam konteks dan sumber.
