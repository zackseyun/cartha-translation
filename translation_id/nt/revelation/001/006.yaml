id: REV.1.6
reference: Revelation 1:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐποίησεν ἡμᾶς βασιλείαν, ἱερεῖς τῷ θεῷ καὶ πατρὶ αὐτοῦ— αὐτῷ ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας ⸂τῶν αἰώνων⸃· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/006.yaml
  text: and made us a kingdom[a], priests to his God and Father—to him be the glory and the dominion forever and ever[b]. Amen.
translation:
  language: id
  text: dan telah menjadikan kita suatu kerajaan[a], imam-imam bagi Allah dan Bapa-Nya—bagi Dia kemuliaan dan kekuasaan selama-lamanya[b]. Amin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah yang lebih kemudian berbunyi “raja-raja dan imam-imam”, bukan “suatu kerajaan, imam-imam”. Teks utama mengikuti bacaan Yunani yang diberikan.
    reason: textual_variant
  - marker: b
    text: Secara lebih harfiah, “ke zaman-zaman dari segala zaman”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: telah menjadikan
  rationale: Bentuk aoristus menyatakan tindakan yang telah dilakukan. Dalam bahasa Indonesia, “telah menjadikan” mengalir alami dalam rangkaian pujian ayat 5–6 dan tetap menonjolkan tindakan Kristus tanpa menambahkan penafsiran tentang waktunya.
- source_word: βασιλείαν
  choice: suatu kerajaan
  rationale: Nomina tunggal ini berarti kerajaan atau pemerintahan, bukan “raja-raja”. Pilihan ini mempertahankan identitas bersama umat sebagai satu kerajaan dan mengikuti teks Yunani yang diberikan.
- source_word: ἱερεῖς
  choice: imam-imam
  rationale: Padanan langsung yang mempertahankan gambaran kultis dan perjanjian dalam teks.
- source_word: τῷ θεῷ καὶ πατρὶ αὐτοῦ
  choice: bagi Allah-Nya dan Bapa-Nya
  rationale: “Bagi” mengungkapkan arah pelayanan para imam. Akhiran “-Nya” pada kedua sebutan membuat hubungan dengan Yesus jelas dalam bahasa Indonesia serta menyampaikan bahwa frasa itu berbicara tentang Dia yang adalah Allah dan Bapa dari Yesus, bukan dua pribadi yang berbeda.
- source_word: αὐτῷ
  choice: bagi Dialah
  rationale: Bentuk ini wajar untuk pengakuan pujian dalam bahasa Indonesia dan menyampaikan penekanan bahwa kemuliaan serta kekuasaan diperuntukkan bagi Dia.
- source_word: δόξα
  choice: kemuliaan
  rationale: Padanan baku dan alami dalam ungkapan pujian.
- source_word: κράτος
  choice: kekuasaan
  rationale: Dalam konteks doksologi, kata ini menunjuk pada kuasa berdaulat atau kekuasaan memerintah; “kekuasaan” mempertahankan cakupan tersebut tanpa mempersempitnya.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: selama-lamanya
  rationale: Ungkapan Indonesia yang alami untuk durasi tanpa akhir; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: ἀμήν
  choice: Amin
  rationale: Bentuk liturgis yang sudah mapan dalam bahasa Indonesia dan mempertahankan fungsi penegasannya.
theological_decisions:
- issue: Rujukan frasa “Allah-Nya dan Bapa-Nya”
  choice: Frasa itu merujuk kepada Allah yang adalah Allah dan Bapa dari Yesus Kristus.
  alternative: Melunakkan frasa menjadi “bagi Allah, Bapa-Nya” atau menghilangkan unsur “Allah-Nya”.
  rationale: Konteks terdekat menunjuk kepada Yesus Kristus. Terjemahan ini mempertahankan secara terbuka bahasa relasional dan kristologis teks tanpa meratakan ketegangannya.
- issue: Status umat sebagai komunitas
  choice: Teks utama memakai “suatu kerajaan, imam-imam”.
  alternative: “raja-raja dan imam-imam”.
  rationale: SBLGNT yang disediakan membaca βασιλείαν, ἱερεῖς. Karena itu terjemahan mempertahankan identitas korporat umat sebagai kerajaan sekaligus para imam, bukan memasukkan bacaan naskah yang lebih kemudian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada khidmat. Struktur doksologi dipertahankan dengan tanda pisah; “bagi Dialah” memberi penekanan alami. Bentuk “imam-imam” dipilih agar jamak terlihat jelas, sedangkan “suatu kerajaan” mempertahankan bentuk tunggal kolektif.
