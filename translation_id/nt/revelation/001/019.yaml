base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/019.yaml
  text: Therefore write what you have seen[a], and what is, and what is about to happen after these things.
translation:
  language: id
  text: Karena itu, tuliskanlah apa yang telah kaulihat, apa yang ada, dan apa yang akan segera terjadi[a] sesudah hal-hal ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “akan terjadi”. Dalam konteks tertentu, kata kerja Yunani ini dapat berfungsi hampir seperti bentuk masa depan biasa, meskipun sering mengandung arti bahwa sesuatu akan segera terjadi.
    reason: alternative_reading
lexical_decisions:
- source_word: γράψον
  choice: tuliskanlah
  rationale: Imperatif aoris aktif orang kedua tunggal. “Tuliskanlah” menyampaikan perintah langsung dengan wajar dan menunjukkan tindakan mencatat tanpa menambahkan penafsiran lain.
- source_word: οὖν
  choice: karena itu
  rationale: Kata penghubung ini menandai kesimpulan atau kelanjutan yang bertolak dari penglihatan dan penugasan sebelumnya. “Karena itu” mempertahankan daya inferensialnya.
- source_word: ἃ εἶδες
  choice: apa yang telah kaulihat
  rationale: Frasa relatif dengan verba aoris menunjuk kepada isi penglihatan yang sudah dilihat Yohanes. Bentuk ini alami dalam bahasa Indonesia dan tetap menghubungkan pengalaman itu dengan perintah sekarang.
- source_word: ἃ εἰσὶν
  choice: apa yang ada
  rationale: Ungkapan ini mempertahankan bentuk kini dan keluasan makna teks Yunani tanpa mempersempitnya menjadi peristiwa, keadaan, atau benda tertentu.
- source_word: μέλλει γίνεσθαι
  choice: akan segera terjadi
  rationale: μέλλω dengan infinitif sering menyatakan sesuatu yang akan atau segera berlangsung. “Akan segera terjadi” mempertahankan unsur keakanan sekaligus nuansa kedekatan waktunya.
- source_word: μετὰ ταῦτα
  choice: sesudah semua ini
  rationale: Frasa temporal ini secara harfiah menunjuk kepada waktu sesudah “hal-hal ini”. “Sesudah semua ini” alami dalam bahasa Indonesia dan tetap mencerminkan bentuk demonstratif jamaknya.
theological_decisions:
- issue: Daya temporal μέλλει dalam konteks apokaliptis
  choice: 'Diterjemahkan dengan nuansa kedekatan waktu: “akan segera terjadi”'
  alternative: 'Diterjemahkan sebagai masa depan biasa: “akan terjadi”'
  rationale: Konstruksi Yunani ini secara wajar dapat menyatakan sesuatu yang segera atau sudah di ambang terjadi. Mempertahankan nuansa itu menjaga ketegangan temporal teks tanpa menetapkan suatu sistem eskatologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “kaulihat” serta “tuliskanlah” menjaga kelancaran dan kesungguhan perintah. Penanda catatan kaki ditempatkan tepat pada frasa yang diterangkannya.
