id: REV.1.17
reference: Revelation 1:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ὅτε εἶδον αὐτόν, ἔπεσα πρὸς τοὺς πόδας αὐτοῦ ὡς νεκρός· καὶ ἔθηκεν τὴν δεξιὰν αὐτοῦ ἐπ’ ἐμὲ λέγων· Μὴ φοβοῦ· ἐγώ εἰμι ὁ πρῶτος καὶ ὁ ἔσχατος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/017.yaml
  text: And when I saw him[a], I fell at his feet like a dead man. And he placed his right hand on me, saying, “Do not fear[b]. I am the First and the Last,”
translation:
  language: id
  text: Ketika aku melihat Dia, aku jatuh di depan kaki-Nya seperti orang mati.[a] Lalu Dia meletakkan tangan kanan-Nya padaku dan berkata, “Jangan takut.[b] Akulah Yang Pertama dan Yang Terakhir,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seolah-olah mati.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “Jangan merasa takut.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ὅτε
  choice: Ketika
  rationale: ὅτε dinyatakan secara temporal dengan alami. καί meneruskan alur narasi, tetapi tidak perlu diterjemahkan tersendiri pada awal kalimat karena hubungan itu sudah jelas dalam bahasa Indonesia.
- source_word: εἶδον αὐτόν
  choice: aku melihat Dia
  rationale: Bentuk aoris dari ὁράω di sini menyatakan persepsi langsung. “Melihat” merupakan padanan Indonesia yang paling lugas.
- source_word: ἔπεσα πρὸς τοὺς πόδας αὐτοῦ
  choice: aku jatuh di depan kaki-Nya
  rationale: Ungkapan ini menggambarkan Yohanes roboh di hadapan tokoh tersebut. “Jatuh di depan kaki-Nya” alami dan tidak menambahkan bahwa tindakan itu semata-mata merupakan sujud yang disengaja.
- source_word: ὡς νεκρός
  choice: seperti orang mati
  rationale: ὡς menandai perbandingan, bukan kematian harfiah. Ungkapan ini mempertahankan gambaran yang jelas dan kuat.
- source_word: ἔθηκεν τὴν δεξιὰν αὐτοῦ ἐπ’ ἐμέ
  choice: Dia meletakkan tangan kanan-Nya padaku
  rationale: τίθημι berarti meletakkan atau menaruh, sedangkan ἐπ’ ἐμέ menunjukkan sentuhan pada Yohanes. “Tangan kanan” dipertahankan karena disebut secara eksplisit dan memiliki bobot simbolis.
- source_word: λέγων
  choice: dan berkata
  rationale: Partisipel ini menyertai tindakan meletakkan tangan. Bentuk verba beruntun lebih wajar dalam bahasa Indonesia daripada terjemahan partisipel yang kaku.
- source_word: Μὴ φοβοῦ
  choice: Jangan takut
  rationale: Larangan present ini secara alami dan ringkas diterjemahkan “Jangan takut,” dengan nada yang tetap khidmat.
- source_word: ἐγώ εἰμι
  choice: Akulah
  rationale: Akhiran -lah mengungkapkan penekanan pada subjek yang terdapat dalam pemakaian eksplisit ἐγώ bersama εἰμι, sekaligus memperkenalkan identitas pembicara secara alami.
- source_word: ὁ πρῶτος καὶ ὁ ἔσχατος
  choice: Yang Pertama dan Yang Terakhir
  rationale: Kedua adjektiva berartikel berfungsi sebagai gelar atau sebutan substantival. “Yang” menyatakan fungsi itu secara alami dalam bahasa Indonesia, dan huruf kapital menandai pemakaian sebagai gelar.
theological_decisions:
- issue: ὁ πρῶτος καὶ ὁ ἔσχατος sebagai gelar
  choice: Yang Pertama dan Yang Terakhir
  alternative: yang pertama dan yang terakhir
  rationale: Dalam konteks ini frasa tersebut merupakan sebutan diri dari Yesus yang dimuliakan dan menggemakan bahasa gelar ilahi dalam Yesaya. Kapitalisasi menandai fungsi gelar tanpa menambahkan isi pada teks Yunani.
- issue: Daya tekan ἐγώ εἰμι
  choice: Akulah
  alternative: Aku adalah
  rationale: Konstruksi ini memperkenalkan identitas pembicara dan diikuti dua gelar. “Akulah” mempertahankan penekanan pada ἐγώ dengan bahasa Indonesia yang lebih alami, tanpa menjadikannya klaim teologis yang lebih eksplisit daripada teks.
- issue: Sifat keadaan Yohanes dalam ὡς νεκρός
  choice: seperti orang mati
  alternative: seolah-olah mati
  rationale: 'ὡς mempertahankan perbandingan: Yohanes tampak atau tergeletak seperti orang mati, bukan dinyatakan benar-benar mati. Kedua pilihan mungkin; teks utama mempertahankan gambaran nominal secara dekat.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Pronomina yang merujuk kepada tokoh ilahi ditulis dengan huruf kapital sesuai kebiasaan ejaan religius Indonesia. Struktur naratif dibuat alami tanpa menghilangkan perbandingan atau kekuatan gelar dalam teks sumber.
