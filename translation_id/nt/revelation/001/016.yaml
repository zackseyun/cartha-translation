id: REV.1.16
reference: Revelation 1:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἔχων ἐν τῇ δεξιᾷ ⸂χειρὶ αὐτοῦ⸃ ἀστέρας ἑπτά, καὶ ἐκ τοῦ στόματος αὐτοῦ ῥομφαία δίστομος ὀξεῖα ἐκπορευομένη, καὶ ἡ ὄψις αὐτοῦ ὡς ὁ ἥλιος φαίνει ἐν τῇ δυνάμει αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/016.yaml
  text: And he had seven stars in his right hand[a], and from his mouth came a sharp two-edged sword[b], and his appearance was like the sun shining in its strength.
translation:
  language: id
  text: Di tangan kanan-Nya Ia memegang tujuh bintang. Dari mulut-Nya keluar sebilah pedang tajam bermata dua[a], dan rupa-Nya seperti matahari yang bersinar dengan kekuatannya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pedang bermata dua yang tajam.”
    reason: lexical_alternative
  - marker: b
    text: Atau “yang bersinar dengan kekuatan penuh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχων
  choice: Ia memegang
  rationale: Partisipel ini merupakan bagian dari uraian penglihatan yang berkelanjutan. Bentuk verba finit lebih alami dalam bahasa Indonesia tanpa menghilangkan gambaran bahwa ketujuh bintang itu berada dalam genggaman-Nya.
- source_word: ἐν τῇ δεξιᾷ χειρὶ αὐτοῦ
  choice: di tangan kanan-Nya
  rationale: χείρ disebut secara eksplisit, sehingga 'tangan' dipertahankan; susunan ini alami dalam bahasa Indonesia.
- source_word: ἀστέρας ἑπτά
  choice: tujuh bintang
  rationale: Padanan langsung dengan urutan kata yang wajar dalam bahasa Indonesia.
- source_word: ῥομφαία
  choice: pedang
  rationale: Kata ini dapat menunjuk pada pedang besar, tetapi 'pedang' menyampaikan gambaran dengan jelas tanpa menentukan jenis senjata secara berlebihan.
- source_word: δίστομος ὀξεῖα
  choice: tajam bermata dua
  rationale: δίστομος secara harfiah berarti 'bermulut dua', tetapi dalam konteks pedang bermakna 'bermata dua'; ὀξεῖα tetap diterjemahkan sebagai 'tajam' agar kedua unsur Yunani dipertahankan.
- source_word: ἐκπορευομένη
  choice: keluar
  rationale: Partisipel ini menggambarkan pedang yang bergerak keluar dari mulut-Nya. Verba 'keluar' alami dan mempertahankan citra penglihatan tersebut.
- source_word: ἡ ὄψις αὐτοῦ
  choice: rupa-Nya
  rationale: ὄψις menunjuk pada apa yang tampak atau keseluruhan penampilan, bukan hanya wajah. 'Rupa-Nya' ringkas, bermartabat, dan tidak mempersempit makna menjadi wajah saja.
- source_word: ὡς ὁ ἥλιος φαίνει
  choice: seperti matahari yang bersinar
  rationale: Bentuk ini mempertahankan perbandingan dan daya deskriptif verba kala kini φαίνει dalam bahasa Indonesia yang alami.
- source_word: ἐν τῇ δυνάμει αὐτοῦ
  choice: dengan kekuatannya
  rationale: Ungkapan ini dekat dengan bentuk Yunani dan dalam konteks menunjuk pada kuatnya pancaran matahari; tafsiran 'dengan kekuatan penuh' dipertahankan sebagai alternatif dalam catatan kaki.
theological_decisions:
- issue: Makna simbolis pedang yang keluar dari mulut
  choice: Mempertahankan metafora penglihatan tanpa menjelaskan simbolnya di dalam terjemahan.
  alternative: Menafsirkannya secara eksplisit sebagai firman atau penghukuman Kristus.
  rationale: Ayat ini menyajikan citra apokaliptik tanpa langsung memberikan penafsirannya. Terjemahan tidak sepatutnya memasukkan penjelasan teologis yang berasal dari konteks lain ke dalam teks ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan klausa dibuat alami tanpa mengurangi unsur-unsur citra Yunani. Penanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskannya; data konsultasi bahasa Inggris tampaknya menempatkan penandanya satu frasa terlalu awal.
source_grounding:
  english_pob_role: consult_only
