id: REV.1.1
reference: Revelation 1:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἀποκάλυψις Ἰησοῦ Χριστοῦ, ἣν ἔδωκεν αὐτῷ ὁ θεὸς δεῖξαι τοῖς δούλοις αὐτοῦ, ἃ δεῖ γενέσθαι ἐν τάχει, καὶ ἐσήμανεν ἀποστείλας διὰ τοῦ ἀγγέλου αὐτοῦ τῷ δούλῳ αὐτοῦ Ἰωάννῃ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/001.yaml
  text: The revelation of Jesus the Messiah[a], which God gave him to show his servants what must happen soon, and he made it known by sending it through his angel to his servant John[d][c][b],
translation:
  language: id
  text: Wahyu Yesus Sang Mesias[a], yang Allah berikan kepadanya untuk menunjukkan kepada hamba-hambanya[d] apa yang harus segera terjadi[b]; dan ia memberitahukannya[c] dengan mengutusnya melalui malaikatnya kepada hambanya, Yohanes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Wahyu dari Yesus Sang Mesias” atau “wahyu tentang Yesus Sang Mesias”. Bentuk genitif Yunani memungkinkan lebih dari satu hubungan makna.
    reason: alternative_reading
  - marker: b
    text: Atau “terjadi dengan cepat”. Ungkapan Yunani dapat menunjuk pada sesuatu yang akan segera terjadi atau berlangsung dengan cepat ketika mulai terjadi.
    reason: lexical_alternative
  - marker: c
    text: Kata Yunani ini juga dapat mengandung nuansa “menyatakannya melalui tanda-tanda”, sesuai dengan sifat simbolis kitab ini.
    reason: lexical_alternative
  - marker: d
    text: Kata Yunani yang diterjemahkan “hamba” juga dapat berarti “budak” dan menekankan bahwa orang tersebut berada di bawah kuasa serta menjadi milik tuannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκάλυψις
  choice: wahyu
  rationale: “Wahyu” merupakan padanan Indonesia yang baku dan wajar untuk suatu penyingkapan atau penyataan ilahi, tanpa memerlukan tambahan seperti “inilah” yang tidak terdapat dalam teks Yunani.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  rationale: Χριστός berfungsi sebagai gelar dan diterjemahkan “Sang Mesias”. Susunan “Wahyu Yesus Sang Mesias” mempertahankan keluasan makna bentuk genitif Yunani.
- source_word: ἣν ἔδωκεν αὐτῷ ὁ θεὸς
  choice: yang Allah berikan kepadanya
  rationale: Klausa relatif diterjemahkan langsung; “kepadanya” merujuk kepada Yesus Sang Mesias dan tetap membedakan Allah dari Yesus sebagaimana struktur sumber.
- source_word: δεῖξαι
  choice: untuk menunjukkan
  rationale: Menjaga fungsi infinitif tujuan dan cocok dengan konteks penglihatan kitab ini.
- source_word: τοῖς δούλοις αὐτοῦ / τῷ δούλῳ αὐτοῦ
  choice: kepada hamba-hambanya / kepada hambanya
  rationale: “Hamba” adalah padanan Indonesia yang alami dan bermartabat bagi δοῦλος dalam hubungan kepemilikan dan pengabdian, sedangkan catatan kaki mempertahankan nuansa harfiahnya yang lebih keras.
- source_word: ἃ δεῖ γενέσθαι
  choice: apa yang harus terjadi
  rationale: Ungkapan Indonesia yang ringkas dan alami ini mempertahankan unsur keharusan dalam δεῖ.
- source_word: ἐν τάχει
  choice: segera
  rationale: “Segera” secara wajar menyatakan kedekatan waktu, sementara kemungkinan makna “dengan cepat” dipertahankan dalam catatan kaki.
- source_word: ἐσήμανεν
  choice: memberitahukannya
  rationale: Padanan ini menyampaikan arti dasar ‘membuat diketahui’. Kemungkinan nuansa pemberitahuan melalui tanda-tanda dijelaskan dalam catatan kaki.
- source_word: ἀποστείλας διὰ τοῦ ἀγγέλου αὐτοῦ
  choice: dengan mengutus malaikatnya
  rationale: Partisip aoristus dipahami sebagai cara atau sarana pemberitahuan, dan διά dengan genitif menyatakan perantaraan malaikat.
- source_word: τῷ δούλῳ αὐτοῦ Ἰωάννῃ
  choice: kepada hambanya, Yohanes
  rationale: Datif menandai Yohanes sebagai penerima; aposisi diberi koma agar jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna genitif dalam Ἀποκάλυψις Ἰησοῦ Χριστοῦ
  choice: “Wahyu Yesus Sang Mesias” tanpa menentukan satu hubungan genitif
  alternative: “Wahyu dari Yesus Sang Mesias” atau “wahyu tentang Yesus Sang Mesias”
  rationale: Genitif Yunani dapat menunjuk sumber, isi, atau hubungan yang lebih luas. Teks utama mempertahankan ketegangan itu, sedangkan alternatif dijelaskan dalam catatan kaki.
- issue: Pembedaan antara Allah dan Yesus dalam klausa pemberian
  choice: “yang Allah berikan kepadanya”
  alternative: Mengganti pronomina dengan nama Yesus demi kejelasan
  rationale: Pronomina dipertahankan karena sumber menyatakan bahwa Allah memberikan wahyu itu kepada Yesus, tanpa menambahkan uraian doktrinal.
- issue: Nuansa δοῦλος
  choice: “hamba” dalam teks utama
  alternative: “budak”
  rationale: “Hamba” lebih alami dan bermartabat dalam register Indonesia modern, tetapi catatan kaki menyatakan bahwa kata Yunani juga dapat berarti budak dan menekankan kepemilikan serta ketundukan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina ilahi tidak dikapitalisasi agar kapitalisasi tafsiran tidak menentukan lebih dahulu rujukan beberapa bentuk αὐτός; tanda koma sebelum “Yohanes” memperjelas aposisi. Struktur ayat dipertahankan sebagai satu kalimat, dengan titik koma untuk keterbacaan.
