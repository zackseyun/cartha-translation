id: REV.1.9
reference: Revelation 1:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἐγὼ Ἰωάννης, ὁ ἀδελφὸς ὑμῶν καὶ ⸀συγκοινωνὸς ἐν τῇ θλίψει καὶ βασιλείᾳ καὶ ὑπομονῇ ⸀ἐν Ἰησοῦ, ἐγενόμην ἐν τῇ νήσῳ τῇ καλουμένῃ Πάτμῳ διὰ τὸν λόγον τοῦ θεοῦ ⸀καὶ τὴν μαρτυρίαν ⸀Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/009.yaml
  text: I[a], John, your brother and fellow participant in the tribulation and kingdom and endurance in Jesus, was on the island called Patmos because of the word of God and the testimony of Jesus.
translation:
  language: id
  text: Aku, Yohanes, saudara kalian dan rekan yang turut mengambil bagian dalam kesusahan, kerajaan, dan ketekunan di dalam Yesus, berada di pulau yang disebut Patmos karena firman Allah dan kesaksian Yesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kesaksian tentang Yesus.” Bentuk genitif dalam bahasa Yunani dapat berarti kesaksian yang diberikan oleh Yesus atau kesaksian mengenai Yesus.
    reason: alternative_reading
lexical_decisions:
- source_word: συγκοινωνός
  choice: rekan yang turut mengambil bagian
  rationale: Ungkapan ini menyampaikan gagasan partisipasi bersama tanpa memberi kesan hubungan dagang yang dapat melekat pada kata 'mitra'. Bentuknya alami dan jelas dalam bahasa Indonesia modern.
- source_word: ἐν τῇ θλίψει καὶ βασιλείᾳ καὶ ὑπομονῇ
  choice: dalam kesusahan, kerajaan, dan ketekunan
  rationale: Ketiga nomina dipertahankan sebagai rangkaian yang sama-sama menjadi lingkup partisipasi Yohanes dan para pembacanya. 'Kesusahan' menjaga bobot θλῖψις dalam konteks apokaliptik, sedangkan 'ketekunan' tepat dan ringkas untuk ὑπομονή.
- source_word: ἐν Ἰησοῦ
  choice: di dalam Yesus
  rationale: Frasa ini paling wajar menerangkan rangkaian kesusahan, kerajaan, dan ketekunan. Bentuk ringkas 'di dalam Yesus' mempertahankan ungkapan teologis sumber tanpa menambahkan gelar yang tidak terdapat dalam teks.
- source_word: ἐγενόμην ἐν τῇ νήσῳ
  choice: berada di pulau
  rationale: Dalam konteks ini γίνομαι secara idiomatis menyatakan keberadaan di suatu tempat. Terjemahan ini tidak menyiratkan cara kedatangan Yohanes yang tidak dijelaskan oleh teks.
- source_word: τῇ καλουμένῃ Πάτμῳ
  choice: yang disebut Patmos
  rationale: Ini merupakan padanan lazim dan transparan bagi partisipel καλουμένῃ yang menerangkan pulau tersebut.
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: karena firman Allah
  rationale: διά dengan akusatif menunjukkan sebab atau alasan. 'Karena' mempertahankan keterbukaan mengenai apakah penyebabnya adalah pemberitaan, kesetiaan, atau penganiayaan yang berkaitan dengan firman Allah.
- source_word: τὴν μαρτυρίαν Ἰησοῦ
  choice: kesaksian Yesus
  rationale: 'Genitif Ἰησοῦ sungguh ambigu: dapat menunjuk pada kesaksian yang diberikan oleh Yesus atau kesaksian tentang Yesus. Frasa Indonesia ini mempertahankan ambiguitas tersebut, sementara alternatifnya dijelaskan dalam catatan kaki.'
- source_word: ἀδελφὸς ὑμῶν
  choice: saudara kalian
  rationale: Ungkapan ini menyatakan solidaritas kekeluargaan Yohanes dengan para pembacanya. 'Kalian' jelas, alami, dan sesuai untuk audiens jamak.
theological_decisions:
- issue: Ambiguitas genitif dalam μαρτυρίαν Ἰησοῦ
  choice: Mempertahankan bentuk 'kesaksian Yesus' dalam teks utama
  alternative: kesaksian tentang Yesus
  rationale: Frasa Yunani dapat dipahami sebagai kesaksian yang diberikan oleh Yesus atau kesaksian mengenai Yesus. Teks utama tidak memutuskan ketegangan eksegetis ini, dan catatan kaki menyajikan kemungkinan lainnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada yang lugas dan bermartabat. Rangkaian 'kesusahan, kerajaan, dan ketekunan' serta ungkapan 'di dalam Yesus' dipertahankan agar struktur dan ketegangan teologis teks sumber tetap terlihat.
