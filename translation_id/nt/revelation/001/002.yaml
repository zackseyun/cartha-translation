id: REV.1.2
reference: Revelation 1:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὃς ἐμαρτύρησεν τὸν λόγον τοῦ θεοῦ καὶ τὴν μαρτυρίαν Ἰησοῦ Χριστοῦ, ὅσα εἶδεν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/002.yaml
  text: who testified to the word of God and to the testimony of Jesus the Messiah[a], all that he saw.
translation:
  language: id
  text: yang telah bersaksi tentang firman Allah dan tentang kesaksian Yesus Sang Mesias[a], yaitu segala sesuatu yang telah dilihatnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kesaksian dari Yesus Sang Mesias” atau “kesaksian tentang Yesus Sang Mesias.” Bahasa Yunaninya dapat dipahami dengan kedua cara tersebut.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμαρτύρησεν
  choice: telah bersaksi
  rationale: Bentuk aoristus μαρτυρέω menyatakan tindakan memberi kesaksian; 'telah bersaksi' alami dalam bahasa Indonesia dan mempertahankan nuansa kesaksian.
- source_word: λόγον
  choice: firman
  rationale: '''Firman Allah'' merupakan ungkapan Indonesia yang mapan untuk λόγος τοῦ θεοῦ dalam konteks pewahyuan ilahi; lebih sesuai dengan ragam Alkitab yang bermartabat daripada ''kata''.'
- source_word: μαρτυρίαν
  choice: kesaksian
  rationale: Mempertahankan hubungan leksikal dengan verba 'bersaksi' serta terdengar alami sebagai objek yang disaksikan.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesus Sang Mesias
  rationale: Χριστός masih berfungsi sebagai gelar; 'Sang Mesias' menyampaikan fungsi gelar itu secara idiomatis dan bermartabat dalam bahasa Indonesia.
- source_word: ὅσα εἶδεν
  choice: segala sesuatu yang telah dilihatnya
  rationale: ὅσα bersifat menyeluruh; frasa ini mempertahankan cakupan 'semua yang' dan merujuk secara jelas kepada hal-hal yang Yohanes lihat.
- source_word: τὸν λόγον τοῦ θεοῦ καὶ τὴν μαρτυρίαν Ἰησοῦ Χριστοῦ
  choice: firman Allah dan kesaksian Yesus Sang Mesias
  rationale: Kedua frasa dipertahankan sebagai objek sejajar dari 'bersaksi tentang', tanpa menyamakan keduanya atau menentukan arah genitif pada 'kesaksian Yesus'.
theological_decisions:
- issue: Ambiguitas genitif dalam μαρτυρίαν Ἰησοῦ Χριστοῦ
  choice: kesaksian Yesus Sang Mesias
  alternative: kesaksian dari Yesus Sang Mesias; kesaksian tentang Yesus Sang Mesias
  rationale: Genitif Yunani dapat dipahami secara subjektif atau objektif. Bentuk 'kesaksian Yesus Sang Mesias' mempertahankan ambiguitas asli, sedangkan kedua kemungkinan dijelaskan dalam catatan kaki.
- issue: Χριστοῦ sebagai gelar
  choice: Sang Mesias
  alternative: Kristus
  rationale: Dalam konteks ini Χριστός tetap memiliki daya sebagai gelar, sehingga 'Sang Mesias' menyampaikan maknanya dan tetap wajar dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Telah bersaksi' serta 'firman Allah' mempertahankan corak kesaksian dan pewahyuan. 'Yaitu' membuat ὅσα εἶδεν terbaca alami sebagai penjelasan yang merangkum kedua objek sebelumnya tanpa menghapus hubungan sintaksisnya.
