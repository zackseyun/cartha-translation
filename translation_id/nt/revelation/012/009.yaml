id: REV.12.9
reference: Revelation 12:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐβλήθη ὁ δράκων ὁ μέγας, ὁ ὄφις ὁ ἀρχαῖος, ὁ καλούμενος Διάβολος καὶ ⸀ὁ Σατανᾶς, ὁ πλανῶν τὴν οἰκουμένην ὅλην— ἐβλήθη εἰς τὴν γῆν, καὶ οἱ ἄγγελοι αὐτοῦ μετ’ αὐτοῦ ἐβλήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/009.yaml
  text: And the great dragon was thrown down—the ancient serpent[a], the one called the Devil and Satan, who deceives the whole world. He was thrown down to the earth[b], and his angels were thrown down with him.
translation:
  language: id
  text: Dan naga besar itu dilemparkan ke bawah—ular purba[a], yang disebut Iblis dan Satan, yang menyesatkan seluruh dunia[b]. Ia dilemparkan ke bumi, dan malaikat-malaikatnya dilemparkan ke bawah bersama dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gambaran “ular purba” menggemakan ular dalam Kejadian 3.
    reason: cross_reference
  - marker: b
    text: Atau “seluruh dunia yang dihuni.” Kata Yunaninya dapat menunjuk pada dunia yang dihuni.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβλήθη / ἐβλήθησαν
  choice: dilemparkan ke bawah
  rationale: Bentuk pasif βάλλω menyatakan tindakan mengusir dengan paksa; konteks pembuangan dari surga ke bumi memberi arah ke bawah. Pengulangan padanan mempertahankan penekanan verba Yunani.
- source_word: δράκων ὁ μέγας
  choice: naga besar
  rationale: Padanan langsung yang mempertahankan citra apokaliptik khas kitab Wahyu.
- source_word: ὁ ὄφις ὁ ἀρχαῖος
  choice: ular purba
  rationale: “Ular” alami dalam bahasa Indonesia, sedangkan “purba” menyampaikan usia atau asal yang sangat lampau tanpa menjelaskan identitasnya melampaui teks.
- source_word: ὁ καλούμενος
  choice: yang disebut
  rationale: Menyatakan bahwa sebutan-sebutan berikut mengidentifikasi naga tersebut.
- source_word: Διάβολος
  choice: Iblis
  rationale: Dalam konteks ini Διάβολος berfungsi sebagai nama atau gelar yang dikenal; “Iblis” merupakan padanan baku bahasa Indonesia.
- source_word: Σατανᾶς
  choice: Satan
  rationale: Nama atau gelar ini ditransliterasikan menurut bentuk baku bahasa Indonesia dan dibedakan dari “Iblis” sebagaimana kedua sebutan itu dibedakan dalam bahasa Yunani.
- source_word: ὁ πλανῶν
  choice: yang menyesatkan
  rationale: πλανάω berarti membawa ke jalan yang salah atau menipu; “menyesatkan” mempertahankan unsur pengarahan yang keliru dan cocok dengan cakupan universal klausa.
- source_word: τὴν οἰκουμένην ὅλην
  choice: seluruh dunia yang dihuni
  rationale: Padanan ini mempertahankan nuansa οἰκουμένη sebagai dunia berpenghuni, bukan sekadar memakai istilah umum bagi bumi.
- source_word: εἰς τὴν γῆν
  choice: ke bumi
  rationale: Konteks membedakan ranah surgawi dari bumi, sehingga “bumi” lebih tepat daripada “tanah” atau “negeri”.
- source_word: οἱ ἄγγελοι αὐτοῦ
  choice: malaikat-malaikatnya
  rationale: Dalam konteks apokaliptik, ἄγγελοι menunjuk pada makhluk surgawi yang berpihak kepada naga, bukan utusan manusia.
- source_word: μετ’ αὐτοῦ
  choice: bersama dia
  rationale: Padanan alami yang menyampaikan penyertaan mereka dalam pembuangan naga.
theological_decisions:
- issue: Hubungan Διάβολος dan Σατανᾶς sebagai sebutan bagi naga
  choice: yang disebut Iblis dan Satan
  alternative: yang disebut si Pemfitnah dan Lawan
  rationale: Teks Yunani menempatkan kedua sebutan sebagai identifikasi sejajar. Bentuk baku “Iblis” dan “Satan” mempertahankan pengenalan tokoh tersebut tanpa menambahkan uraian doktrinal.
- issue: Cakupan οἰκουμένη
  choice: seluruh dunia yang dihuni
  alternative: seluruh dunia
  rationale: Pilihan utama mempertahankan nuansa leksikal dunia berpenghuni sekaligus cakupan universal dalam konteks apokaliptik.
- issue: Arah pembuangan naga
  choice: dilemparkan ke bawah ... ke bumi
  alternative: dilemparkan ... ke bumi
  rationale: Arah ke bawah tersirat oleh konteks pembuangan dari surga dan dibuat jelas dalam bahasa Indonesia, sementara tujuan yang dinyatakan teks tetap “ke bumi”.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur deretan sebutan dipertahankan dengan tanda pisah agar hubungan semua keterangan dengan “naga besar” tetap jelas; pengulangan “dilemparkan ke bawah” menjaga tekanan retoris teks sumber.
