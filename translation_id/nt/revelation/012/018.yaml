  text: καὶ ⸀ἐστάθη ἐπὶ τὴν ἄμμον τῆς θαλάσσης.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/018.yaml
  text: And he stood on the sand of the sea[a].
translation:
  language: id
  text: Lalu naga itu berdiri di atas pasir di tepi laut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebagian naskah berbunyi, “Lalu aku berdiri di atas pasir di tepi laut.”
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: Lalu
  rationale: Kata penghubung ini melanjutkan alur narasi dari ayat sebelumnya; “lalu” terdengar alami dalam narasi bahasa Indonesia.
- source_word: ἐστάθη
  choice: naga itu berdiri
  rationale: Bentuk aoris ἵστημι dipakai secara intransitif, “berdiri.” Subjek orang ketiga tunggal dipertegas sebagai “naga itu” berdasarkan rujukan langsung dalam konteks sebelumnya, tanpa mengubah identitas tokohnya.
- source_word: ἐπὶ
  choice: di atas
  rationale: Dengan bentuk akusatif dalam konstruksi ini, kata tersebut menyatakan tempat naga itu berdiri; “di atas” mempertahankan gambaran fisiknya.
- source_word: τὴν ἄμμον
  choice: pasir
  rationale: ἄμμος secara harfiah berarti “pasir,” sehingga unsur konkret dari gambaran Yunani dipertahankan.
- source_word: τῆς θαλάσσης
  choice: di tepi laut
  rationale: Genitif ini menerangkan pasir yang berada di kawasan laut. Ungkapan “pasir di tepi laut” lebih wajar dalam bahasa Indonesia daripada “pasir laut,” sambil tetap mempertahankan lokasi yang dimaksud.
theological_decisions:
- issue: Identitas subjek dan varian tekstual kata kerja
  choice: Teks utama mengikuti bacaan orang ketiga, ἐστάθη, dan menyebut subjek kontekstualnya sebagai “naga itu.”
  alternative: 'Sebagian naskah memakai bentuk orang pertama, ἐστάθην: “Lalu aku berdiri di atas pasir di tepi laut.”'
  rationale: SBLGNT mencetak bentuk orang ketiga, yang dalam konteks paling wajar merujuk kepada naga pada ayat sebelumnya. Bacaan orang pertama memiliki arti naratif yang berbeda dan karena itu dipertahankan dalam catatan kaki, bukan diselesaikan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif. “Naga itu” dipakai agar subjek tersirat dalam bahasa Yunani jelas bagi pembaca Indonesia; catatan kaki mempertahankan bacaan alternatif orang pertama.
