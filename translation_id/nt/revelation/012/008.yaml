id: REV.12.8
reference: Revelation 12:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ οὐκ ⸀ἴσχυσεν, οὐδὲ τόπος εὑρέθη ⸀αὐτῶν ἔτι ἐν τῷ οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/008.yaml
  text: But he was not strong enough[a], nor was any place found for them any longer in heaven.
translation:
  language: id
  text: Namun, ia tidak cukup kuat[a], dan tidak ditemukan lagi tempat bagi mereka di surga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ia tidak menang.” Kata kerja Yunani ini dapat berarti kuat, mampu, atau menang.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Namun
  rationale: Dalam konteks pertempuran pada ayat sebelumnya, καί berfungsi secara adversatif; “Namun” menyampaikan kontras itu secara alami dalam bahasa Indonesia.
- source_word: οὐκ ἴσχυσεν
  choice: ia tidak cukup kuat
  rationale: ἰσχύω dapat berarti kuat, mampu, atau menang. Bentuk tunggalnya menunjuk kembali kepada naga pada ayat sebelumnya; ungkapan ini mempertahankan nuansa kekuatan dalam konteks pertempuran.
- source_word: οὐδὲ
  choice: dan tidak
  rationale: Sesudah klausa negatif pertama, “dan tidak” mengoordinasikan klausa kedua dengan alami sekaligus mempertahankan daya negatif οὐδέ.
- source_word: τόπος
  choice: tempat
  rationale: τόπος menunjuk kepada tempat atau lokasi; “tempat” merupakan padanan langsung dan wajar dalam konteks ranah surgawi.
- source_word: εὑρέθη
  choice: ditemukan
  rationale: Bentuk pasif aoris dari εὑρίσκω dipertahankan secara formal sebagai “ditemukan,” tanpa mengubahnya menjadi sekadar pernyataan bahwa tempat itu tidak ada.
- source_word: αὐτῶν
  choice: bagi mereka
  rationale: Dalam konstruksi ini, genitif tersebut secara idiomatis menyatakan tempat yang tersedia bagi naga dan para malaikatnya.
- source_word: ἔτι
  choice: lagi
  rationale: Dalam konteks negatif, ἔτι berarti “tidak lagi,” yang menunjukkan bahwa sesudah pertempuran mereka tidak mempunyai tempat di sana.
- source_word: ἐν τῷ οὐρανῷ
  choice: di surga
  rationale: οὐρανός di sini menunjuk kepada ranah surgawi, bukan langit yang kelihatan; “di surga” adalah ungkapan Indonesia yang alami.
theological_decisions:
- issue: Rujukan kata kerja tunggal ἴσχυσεν
  choice: Subjeknya tunggal, “ia,” dan menunjuk kepada naga dari ayat sebelumnya; “mereka” mencakup naga dan para malaikatnya.
  alternative: 'Meratakan kedua klausa menjadi bentuk jamak: “mereka tidak cukup kuat.”'
  rationale: Teks Yunani memakai kata kerja tunggal untuk naga, lalu pronomina jamak untuk kelompoknya. Terjemahan mempertahankan peralihan gramatikal dan alur wacana tersebut.
- issue: Nuansa ἰσχύω dalam konteks pertempuran
  choice: “tidak cukup kuat”
  alternative: “tidak menang” atau “tidak mampu”
  rationale: Pilihan utama mempertahankan unsur kekuatan atau kuasa tanpa menutup kemungkinan nuansa ‘tidak berhasil menang,’ yang dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat. “Ia” dipakai untuk rujukan tunggal kepada naga, sedangkan susunan pasif “tidak ditemukan lagi tempat” mempertahankan bentuk dan ketegangan teks Yunani.
