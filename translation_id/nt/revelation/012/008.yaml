  source_fidelity: Terjemahan secara tepat mempertahankan subjek tunggal tersirat dari ἴσχυσεν melalui “ia”, lalu rujukan jamak αὐτῶν melalui “mereka”. “Tidak cukup kuat” merupakan padanan yang sah untuk οὐκ ἴσχυσεν dalam konteks konflik, dan “tidak ditemukan lagi tempat” mempertahankan bentuk pasif εὑρέθη serta daya negatif ἔτι. “Di surga” tepat untuk ἐν τῷ οὐρανῷ dalam konteks ini.
  naturalness: Bahasa Indonesia baku, jelas, dan mengalir baik. Kontras “Namun” dan koordinasi “dan tidak” dapat diterima dalam gaya naratif-wahyu yang ringkas.
  terminology: Istilah “surga,” “tempat,” serta pronomina “ia/mereka” digunakan secara konsisten dan tepat. Catatan kaki secara memadai mencatat alternatif leksikal “tidak menang” tanpa memaksakan penafsiran.
