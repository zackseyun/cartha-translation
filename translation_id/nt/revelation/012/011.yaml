  to: Dan mereka mengalahkannya[a] melalui darah Anak Domba dan melalui perkataan kesaksian mereka. Mereka tidak mengasihi nyawa mereka[b], bahkan sampai mati.
  rationale: Revisi menambahkan penghubung “Dan” untuk καὶ, mengganti “oleh” dengan “melalui” agar hubungan sarana lebih alami dalam bahasa Indonesia, dan menyesuaikan “dia” menjadi enklitik “-nya” setelah verba agar lebih lancar. Makna ayat, ambiguitas yang wajar pada διά, serta pilihan istilah teologis tidak diperluas atau diubah.
