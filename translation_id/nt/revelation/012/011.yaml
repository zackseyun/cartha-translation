  terminology: “Anak Domba” tepat sebagai gelar yang mapan dalam Wahyu. “Mengalahkan,” “perkataan kesaksian mereka,” dan “nyawa mereka” mempertahankan cakupan istilah Yunani tanpa menambahkan penafsiran doktrinal. Catatan untuk ψυχή tepat mempertahankan alternatif leksikal yang relevan.
