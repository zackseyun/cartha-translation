id: REV.12.11
reference: Revelation 12:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ἐνίκησαν αὐτὸν διὰ τὸ αἷμα τοῦ ἀρνίου καὶ διὰ τὸν λόγον τῆς μαρτυρίας αὐτῶν, καὶ οὐκ ἠγάπησαν τὴν ψυχὴν αὐτῶν ἄχρι θανάτου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/011.yaml
  text: And they conquered him by the blood of the Lamb and by the word of their testimony[b][a], and they did not love their life even unto death.
translation:
  language: id
  text: Dan mereka mengalahkannya[a] melalui darah Anak Domba dan melalui perkataan kesaksian mereka. Mereka tidak mengasihi nyawa mereka[b], bahkan sampai mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menang atasnya.”
    reason: lexical_alternative
  - marker: b
    text: Atau “hidup mereka” atau “jiwa mereka.” Kata Yunani psychē dapat berarti “nyawa,” “hidup,” “diri,” atau “jiwa.” Di sini konteksnya adalah kesediaan menghadapi kematian.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνίκησαν
  choice: mengalahkan
  rationale: Bentuk aoristus aktif ini menyatakan kemenangan atas lawan. “Mengalahkan” mempertahankan gambaran konflik dalam kitab Wahyu dan terdengar alami dalam bahasa Indonesia.
- source_word: διὰ τὸ αἷμα
  choice: oleh darah
  rationale: διά dengan akusatif dapat menyatakan sebab atau sarana. “Oleh darah” mempertahankan kemungkinan nuansa sarana tanpa menambahkan penjelasan doktrinal yang tidak dinyatakan langsung dalam ayat.
- source_word: ἀρνίου
  choice: Anak Domba
  rationale: Dalam kitab Wahyu, ἀρνίον merupakan gelar kristologis. “Anak Domba” mempertahankan citra apokaliptis dan pengorbanan yang sudah dikenal.
- source_word: λόγον τῆς μαρτυρίας αὐτῶν
  choice: perkataan kesaksian mereka
  rationale: Ungkapan ini mempertahankan kedua unsur Yunani, λόγος dan μαρτυρία, serta dapat dipahami sebagai perkataan atau pesan yang mereka sampaikan sebagai kesaksian.
- source_word: οὐκ ἠγάπησαν
  choice: tidak mengasihi
  rationale: Terjemahan ini mempertahankan arti dasar ἀγαπάω dan hubungan leksikalnya dengan gagasan mengasihi, tanpa mengubahnya menjadi parafrasa seperti “tidak mempertahankan” atau “tidak menyayangkan”.
- source_word: τὴν ψυχὴν αὐτῶν
  choice: nyawa mereka
  rationale: Dalam konteks kemartiran dan kematian, ψυχή menunjuk pada hidup yang dapat diserahkan. “Nyawa” menyampaikan makna tersebut tanpa menyiratkan pertentangan tubuh dan jiwa.
- source_word: ἄχρι θανάτου
  choice: bahkan sampai mati
  rationale: Ungkapan ini menyatakan batas tertinggi kesetiaan mereka, yaitu kesediaan menghadapi kematian. “Bahkan sampai mati” alami, khidmat, dan mempertahankan daya tekan frasa Yunani.
theological_decisions:
- issue: Makna kemenangan oleh darah Anak Domba
  choice: Diterjemahkan “oleh darah Anak Domba” sebagai dasar atau sarana kemenangan tanpa memperluasnya menjadi rumusan ajaran penebusan.
  alternative: “karena darah Anak Domba” atau “melalui darah Anak Domba”
  rationale: Konstruksi Yunani memungkinkan nuansa sebab maupun sarana. Pilihan ini mempertahankan hubungan langsung antara kemenangan mereka dan darah Anak Domba tanpa memaksakan uraian teologis tambahan.
- issue: Makna ψυχή dalam konteks kemartiran
  choice: Diterjemahkan “nyawa” dan bukan “jiwa”.
  alternative: “jiwa” atau “hidup”
  rationale: Konteksnya adalah kesediaan untuk mati. “Nyawa” paling langsung menunjuk pada kehidupan jasmani yang mereka tidak utamakan, serta menghindari kesan bahwa ayat ini sedang mengajarkan pemisahan tubuh dan jiwa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Susunan kalimat tetap dekat dengan teks Yunani, tetapi dibagi menjadi dua kalimat agar jelas dan alami. Istilah “Anak Domba” dipertahankan sebagai gelar, sedangkan “nyawa” dipilih karena paling wajar dalam konteks kematian.
