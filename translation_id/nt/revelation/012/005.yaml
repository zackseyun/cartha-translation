revisions:
- from: Ia melahirkan seorang anak laki-laki, seorang anak jantan, yang akan menggembalakan semua bangsa dengan tongkat besi; lalu anaknya direnggut dan dibawa kepada Allah dan kepada takhta-Nya.[a]
  to: Ia melahirkan seorang putra, seorang anak laki-laki, yang akan menggembalakan semua bangsa dengan tongkat besi[a]; lalu anaknya direnggut kepada Allah dan kepada takhta-Nya.
  rationale: Revisi mengganti 'anak jantan' dengan aposisi manusiawi yang tetap menyampaikan penekanan ganda υἱόν, ἄρσεν. Revisi juga membatasi terjemahan ἡρπάσθη pada satu tindakan pasif, tanpa menambahkan verba 'dibawa', dan memindahkan jangkar catatan kaki ke klausa yang dijelaskannya. 'Akan menggembalakan' dipertahankan sebagai pilihan Indonesia yang alami bagi μέλλει ποιμαίνειν tanpa memaksakan nuansa kedekatan waktu atau ketetapan.
  reviewer_model: gpt-5.6-terra
