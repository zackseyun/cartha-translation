  - severity: low
    issue: '''Direnggut dan dibawa'' menguraikan satu verba pasif menjadi dua tindakan.'
    rationale: ἡρπάσθη menyatakan perenggutan/pengangkatan yang mendadak dan kuat; arah menuju Allah dan takhta-Nya sudah dinyatakan oleh frasa berikutnya.
  - severity: low
    issue: Penanda catatan kaki ditempatkan di akhir kalimat, bukan pada klausa yang diberi alternatif.
    rationale: Catatan menjelaskan ποιμαίνειν ... ἐν ῥάβδῳ σιδηρᾷ dan sebaiknya ditambatkan langsung setelah frasa tersebut.
