id: REV.12.5
reference: Revelation 12:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἔτεκεν υἱόν, ⸀ἄρσεν, ὃς μέλλει ποιμαίνειν πάντα τὰ ἔθνη ἐν ῥάβδῳ σιδηρᾷ· καὶ ἡρπάσθη τὸ τέκνον αὐτῆς πρὸς τὸν θεὸν καὶ πρὸς τὸν θρόνον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/005.yaml
  text: And she gave birth to a son, a male child, who is about to shepherd all the nations with an iron rod; and her child was snatched up to God and to his throne.
translation:
  language: id
  text: Ia melahirkan seorang putra, seorang anak laki-laki, yang akan menggembalakan semua bangsa dengan tongkat besi[a]; lalu anaknya direnggut kepada Allah dan kepada takhta-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang akan memerintah semua bangsa dengan tongkat besi.” Kata Yunani yang dipakai secara harfiah berarti “menggembalakan”, tetapi dalam konteks ini menggemakan Mazmur 2 dan mengandung makna kekuasaan rajawi.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτεκεν
  choice: melahirkan
  rationale: Padanan alami dan konkret bagi tindakan melahirkan dalam bahasa Indonesia modern.
- source_word: υἱόν, ἄρσεν
  choice: seorang anak laki-laki, seorang anak jantan
  rationale: Mempertahankan kedua unsur Yunani dan penekanannya. 'Anak jantan' memang terasa lebih bertanda, tetapi mencerminkan ἄρσεν sebagai aposisi yang menegaskan jenis kelamin anak itu.
- source_word: μέλλει ποιμαίνειν
  choice: akan menggembalakan
  rationale: Dalam konteks apokaliptik ini μέλλει menyatakan tindakan yang akan atau ditetapkan terjadi; 'akan' lebih alami daripada ungkapan keakanan yang menyiratkan bahwa tindakan itu segera dimulai.
- source_word: ποιμαίνειν
  choice: menggembalakan
  rationale: Mempertahankan metafora ποιμαίνω, sambil membiarkan makna kekuasaan rajawi yang menggemakan Mazmur 2 dijelaskan dalam catatan kaki.
- source_word: πάντα τὰ ἔθνη
  choice: semua bangsa
  rationale: Mengacu luas kepada bangsa-bangsa dunia dalam gema Mazmur 2; bukan khusus orang non-Yahudi.
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: dengan tongkat besi
  rationale: Mempertahankan makna instrumental dan citra ungkapan Yunani secara ringkas serta alami.
- source_word: ἡρπάσθη
  choice: direnggut dan dibawa
  rationale: Mengungkapkan tindakan pasif yang mendadak dan kuat dari ἁρπάζω, sekaligus arah gerak menuju Allah yang dinyatakan oleh konteks.
- source_word: τὸ τέκνον αὐτῆς
  choice: anaknya
  rationale: Mencerminkan peralihan dari υἱός kepada istilah umum τέκνον tanpa membuat bahasa Indonesia kaku.
- source_word: πρὸς τὸν θεὸν καὶ πρὸς τὸν θρόνον αὐτοῦ
  choice: kepada Allah dan kepada takhta-Nya
  rationale: Pengulangan 'kepada' mempertahankan pengulangan πρὸς dan gerak menuju Allah serta takhta-Nya.
theological_decisions:
- issue: Gema mesianik Mazmur 2 dalam ποιμαίνειν ... ἐν ῥάβδῳ σιδηρᾷ
  choice: Mempertahankan metafora 'menggembalakan' dalam teks utama.
  alternative: memerintah semua bangsa dengan tongkat besi
  rationale: Konteksnya jelas menyiratkan kekuasaan rajawi Mesias, tetapi verba Yunani secara harfiah berarti 'menggembalakan'; catatan kaki menyajikan makna kontekstual tanpa menggantikan metafora sumber.
- issue: Daya μέλλει
  choice: akan menggembalakan
  alternative: segera akan menggembalakan; ditetapkan untuk menggembalakan
  rationale: Bentuk ini mempertahankan orientasi ke masa depan secara alami. Dalam konteks ini μέλλει dapat pula mengandung nuansa ketetapan, tetapi terjemahan utama tidak memaksakan salah satu nuansa tersebut.
- issue: Pelaku tersirat dalam bentuk pasif ἡρπάσθη
  choice: Mempertahankan bentuk pasif tanpa menyebut pelaku.
  alternative: Allah merenggut dan membawa anaknya
  rationale: Teks Yunani tidak menyatakan pelakunya; menyebut Allah sebagai pelaku akan memperjelas sesuatu yang tetap tersirat dalam sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Repetisi 'seorang anak laki-laki, seorang anak jantan' sengaja dipertahankan karena sumber memakai υἱόν dan ἄρσεν untuk penekanan. Penanda catatan kaki ditempatkan setelah seluruh kalimat karena catatan menjelaskan frasa di bagian tengah ayat.
