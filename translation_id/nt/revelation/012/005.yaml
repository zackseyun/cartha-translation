  source_fidelity: Teks utama dengan tepat mempertahankan tindakan melahirkan, pengulangan yang menegaskan jenis kelamin anak, metafora ποιμαίνειν, cakupan 'semua bangsa', citra tongkat besi, dan bentuk pasif tanpa pelaku yang disebutkan. Namun, 'direnggut dan dibawa' menambahkan tindakan kedua yang tidak dinyatakan secara tersendiri oleh ἡρπάσθη.
  naturalness: '''Seorang anak jantan'' tidak lazim untuk manusia dalam bahasa Indonesia baku dan mudah menyiratkan hewan. ''Seorang putra, seorang anak laki-laki'' mempertahankan penegasan aposisional sumber dengan ungkapan yang lebih wajar. Pemindahan penanda catatan kaki juga menautkannya langsung pada klausa yang dijelaskan.'
  terminology: Allah dan takhta-Nya sudah tepat. 'Menggembalakan' dengan catatan alternatif 'memerintah' secara setia mempertahankan metafora Yunani sekaligus menyampaikan nuansa rajawi dari gema Mazmur 2.
  issues:
