id: REV.12.17
reference: Revelation 12:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ὠργίσθη ὁ δράκων ἐπὶ τῇ γυναικί, καὶ ἀπῆλθεν ποιῆσαι πόλεμον μετὰ τῶν λοιπῶν τοῦ σπέρματος αὐτῆς, τῶν τηρούντων τὰς ἐντολὰς τοῦ θεοῦ καὶ ἐχόντων τὴν μαρτυρίαν Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/017.yaml
  text: And the dragon became enraged with the woman[a], and went away to make war with the rest of her offspring, those who keep the commandments of God and hold to the testimony of Jesus.
translation:
  language: id
  text: Naga itu pun menjadi murka terhadap perempuan itu, lalu pergi untuk berperang melawan sisa keturunannya, yaitu mereka yang menaati perintah-perintah Allah dan berpegang pada kesaksian Yesus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “kesaksian tentang Yesus”; atau, “kesaksian yang diberikan Yesus.” Bentuk genitif dalam bahasa Yunani dapat dipahami dengan lebih dari satu cara.
    reason: alternative_reading
lexical_decisions:
- source_word: ὠργίσθη
  choice: menjadi murka
  rationale: Bentuk aoristus dari ὀργίζομαι menyatakan timbulnya kemarahan. “Menjadi murka” mempertahankan gerak naratif dan intensitas reaksi naga dalam konteks apokaliptik.
- source_word: δράκων
  choice: naga
  rationale: Padanan baku yang mempertahankan gambaran simbolis-apokaliptik dan merujuk pada tokoh yang sudah diperkenalkan dalam pasal ini.
- source_word: ἐπὶ τῇ γυναικί
  choice: terhadap perempuan itu
  rationale: Dalam konstruksi ini ἐπί menyatakan sasaran kemarahan, sedangkan artikel pada γυνή menunjuk kepada perempuan tertentu yang sudah disebutkan.
- source_word: ἀπῆλθεν
  choice: pergi
  rationale: ἀπέρχομαι berarti pergi atau beranjak. “Pergi” alami dalam bahasa Indonesia dan cukup mempertahankan perpindahan dalam narasi.
- source_word: ποιῆσαι πόλεμον μετὰ
  choice: untuk berperang melawan
  rationale: Secara harfiah ungkapan ini berarti membuat perang dengan, tetapi “berperang melawan” merupakan ungkapan Indonesia yang alami dan menyatakan hubungan permusuhan yang tersirat.
- source_word: τῶν λοιπῶν τοῦ σπέρματος αὐτῆς
  choice: keturunannya yang lain
  rationale: σπέρμα di sini berarti keturunan, bukan benih secara harfiah. λοιπῶν menunjukkan bagian lain atau selebihnya dari keturunan perempuan itu.
- source_word: τηρούντων τὰς ἐντολὰς τοῦ θεοῦ
  choice: yang menaati perintah-perintah Allah
  rationale: τηρέω dalam kaitan dengan perintah berarti memelihara atau menaati. “Menaati” menyampaikan pelaksanaan setia secara jelas dalam bahasa Indonesia modern.
- source_word: ἐχόντων τὴν μαρτυρίαν Ἰησοῦ
  choice: berpegang pada kesaksian Yesus
  rationale: Walaupun ἔχω secara dasar berarti memiliki, “berpegang pada” menyampaikan kepemilikan yang disertai kesetiaan dalam konteks ini. Frasa “kesaksian Yesus” mempertahankan kemungkinan genitif objektif maupun subjektif.
theological_decisions:
- issue: Makna genitif dalam τὴν μαρτυρίαν Ἰησοῦ
  choice: kesaksian Yesus
  alternative: kesaksian tentang Yesus; kesaksian yang diberikan Yesus
  rationale: Bentuk genitif Ἰησοῦ dapat dipahami secara objektif sebagai kesaksian tentang Yesus atau secara subjektif sebagai kesaksian yang diberikan Yesus. Teks utama mempertahankan ambiguitas yang asli, dan catatan kaki menjelaskan kedua kemungkinan utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Partikel “pun” membantu menandai perkembangan reaksi naga secara alami. “Yaitu mereka” memperjelas bahwa frasa partisipial Yunani menerangkan keturunan yang lain tanpa menambahkan identitas baru. Penanda catatan kaki ditempatkan langsung setelah frasa yang dijelaskannya.
