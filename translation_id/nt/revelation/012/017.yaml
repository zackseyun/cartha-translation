revisions:
- from: Naga itu pun menjadi murka terhadap perempuan itu, lalu pergi untuk berperang melawan keturunannya yang lain, yaitu mereka yang menaati perintah-perintah Allah dan berpegang pada kesaksian Yesus.[a]
  to: Naga itu pun menjadi murka terhadap perempuan itu, lalu pergi untuk berperang melawan sisa keturunannya, yaitu mereka yang menaati perintah-perintah Allah dan berpegang pada kesaksian Yesus[a].
  rationale: Revisi mengganti “keturunannya yang lain” dengan “sisa keturunannya” agar τῶν λοιπῶν diterjemahkan secara lebih tepat sebagai bagian keturunan yang selebihnya. Penanda catatan kaki dipindahkan agar melekat pada “kesaksian Yesus,” frasa yang dijelaskannya. Unsur lain dipertahankan karena sudah setia, alami, dan menjaga ambiguitas genitif Ἰησοῦ.
