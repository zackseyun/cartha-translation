id: REV.12.10
reference: Revelation 12:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα φωνὴν μεγάλην ἐν τῷ οὐρανῷ λέγουσαν· Ἄρτι ἐγένετο ἡ σωτηρία καὶ ἡ δύναμις καὶ ἡ βασιλεία τοῦ θεοῦ ἡμῶν καὶ ἡ ἐξουσία τοῦ χριστοῦ αὐτοῦ, ὅτι ἐβλήθη ὁ ⸀κατήγωρ τῶν ἀδελφῶν ἡμῶν, ὁ κατηγορῶν ⸀αὐτοὺς ἐνώπιον τοῦ θεοῦ ἡμῶν ἡμέρας καὶ νυκτός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/010.yaml
  text: And I heard a loud voice in heaven saying[a], “Now have come the salvation and the power and the kingdom of our God, and the authority of his Messiah, because the accuser of our brothers has been thrown down[b], the one who accuses them before our God day and night.”
translation:
  language: id
  text: Lalu aku mendengar suara nyaring di surga berkata, “Sekarang telah tiba keselamatan, kuasa, dan kerajaan Allah kita, serta wewenang Mesias-Nya,[a] sebab pendakwa saudara-saudara kita[b] telah dilemparkan ke bawah—dia yang mendakwa mereka di hadapan Allah kita siang dan malam.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kristus-Nya.” Kata Yunani Χριστός (Christos) adalah gelar yang berarti Yang Diurapi.
    reason: alternative_reading
  - marker: b
    text: “Saudara-saudara” di sini dapat merujuk secara kolektif kepada sesama orang percaya, termasuk perempuan dan laki-laki.
    reason: cultural_note
lexical_decisions:
- source_word: φωνὴν μεγάλην
  choice: suara nyaring
  rationale: Dalam kolokasi dengan φωνή, μεγάλην menunjuk pada keras atau nyaringnya suara, bukan kebesarannya sebagai sifat abstrak.
- source_word: Ἄρτι ἐγένετο
  choice: Sekarang telah tiba
  rationale: Ἄρτι menandai saat penentu dalam proklamasi, sedangkan ἐγένετο menyatakan terjadinya atau hadirnya realitas yang diumumkan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nuansa resultatif.
- source_word: ἡ σωτηρία καὶ ἡ δύναμις καὶ ἡ βασιλεία
  choice: keselamatan, kuasa, dan kerajaan
  rationale: Mempertahankan rangkaian retoris tiga unsur; 'kerajaan' tetap membuka kemungkinan makna ranah kerajaan maupun pemerintahan raja.
- source_word: ἡ ἐξουσία
  choice: wewenang
  rationale: Membedakannya dari δύναμις, 'kuasa'; ἐξουσία menekankan otoritas atau hak yang sah untuk memerintah.
- source_word: τοῦ χριστοῦ αὐτοῦ
  choice: Mesias-Nya
  rationale: Χριστός berfungsi sebagai gelar yang berarti Yang Diurapi milik Allah; 'Mesias' merupakan bentuk gelar yang lazim dan alami dalam bahasa Indonesia.
- source_word: ἐβλήθη
  choice: telah dilemparkan ke bawah
  rationale: Bentuk pasif menggambarkan tindakan paksa, dan konteks pasal ini menunjukkan gerak turun dari surga.
- source_word: ὁ κατήγωρ ... ὁ κατηγορῶν
  choice: pendakwa ... dia yang mendakwa
  rationale: Pilihan ini mempertahankan permainan akar kata Yunani antara nomina dan verba serta nuansa pengajuan tuduhan di hadapan Allah.
- source_word: ἡμέρας καὶ νυκτός
  choice: siang dan malam
  rationale: Padanan idiomatis Indonesia yang menyampaikan tindakan terus-menerus.
theological_decisions:
- issue: Makna βασιλεία
  choice: kerajaan Allah kita
  alternative: pemerintahan Allah kita
  rationale: '''Kerajaan'' mempertahankan istilah apokaliptik yang mapan tanpa menutup nuansa pemerintahan atau kekuasaan rajawi.'
- issue: Penerjemahan Χριστός
  choice: Mesias-Nya
  alternative: Kristus-Nya
  rationale: Dalam konstruksi kepunyaan ini kata tersebut jelas berfungsi sebagai gelar penguasa yang diurapi Allah; 'Mesias' menyatakan makna gelar itu secara alami.
- issue: Cakupan ἀδελφῶν
  choice: saudara-saudara kita
  alternative: saudara-saudari kita
  rationale: Bentuk utama mengikuti nomina maskulin jamak Yunani, sementara catatan menjelaskan bahwa dalam konteks komunitas orang percaya rujukannya dapat mencakup laki-laki dan perempuan.
- issue: Waktu dan aspek ἐγένετο dan ἐβλήθη
  choice: telah tiba ... telah dilemparkan
  alternative: terjadilah ... dilemparkanlah
  rationale: Bentuk 'telah' menyampaikan keadaan kini sebagai hasil tindakan penentu tanpa menetapkan kronologi teologis lebih jauh daripada teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur proklamasi dipertahankan, tetapi artikel Yunani tidak diterjemahkan secara mekanis karena bahasa Indonesia tidak memiliki artikel definit. Tanda pisah memperjelas bahwa frasa partisipial terakhir menjelaskan 'pendakwa' tanpa menghilangkan pengulangannya.
