id: REV.12.1
reference: Revelation 12:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ σημεῖον μέγα ὤφθη ἐν τῷ οὐρανῷ, γυνὴ περιβεβλημένη τὸν ἥλιον, καὶ ἡ σελήνη ὑποκάτω τῶν ποδῶν αὐτῆς, καὶ ἐπὶ τῆς κεφαλῆς αὐτῆς στέφανος ἀστέρων δώδεκα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/001.yaml
  text: 'And a great sign appeared in heaven: a woman clothed with the sun[a], and the moon under her feet, and on her head a crown of twelve stars,'
translation:
  language: id
  text: 'Lalu tampaklah suatu tanda besar di surga: seorang perempuan berselubungkan matahari, dengan bulan di bawah kakinya dan sebuah mahkota[a] dari dua belas bintang di atas kepalanya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “karangan mahkota” atau “mahkota kemenangan”; kata Yunani στέφανος berbeda dari diadem kerajaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον μέγα
  choice: suatu tanda besar
  rationale: “Tanda” mempertahankan fungsi simbolis dalam penglihatan apokaliptik, sedangkan “besar” mencakup kebesaran maupun pentingnya tanda itu.
- source_word: ὤφθη ἐν τῷ οὐρανῷ
  choice: tampaklah ... di surga
  rationale: Bentuk pasif secara harfiah berarti “terlihat”, tetapi “tampaklah” merupakan ungkapan laporan penglihatan yang alami dalam bahasa Indonesia. “Surga” paling sesuai dengan latar penglihatan kitab ini, meskipun οὐρανός juga dapat berarti langit.
- source_word: γυνή
  choice: seorang perempuan
  rationale: Konteks memperkenalkan sosok perempuan simbolis tanpa menyatakannya sebagai istri.
- source_word: περιβεβλημένη τὸν ἥλιον
  choice: berselubungkan matahari
  rationale: Pilihan ini mempertahankan gambaran bahwa matahari menyelubungi atau menjadi pakaian perempuan itu, tanpa menjelaskan simbolnya.
- source_word: ἡ σελήνη ὑποκάτω τῶν ποδῶν αὐτῆς
  choice: dengan bulan di bawah kakinya
  rationale: Terjemahan ini mempertahankan hubungan ruang dalam gambaran Yunani dan menghubungkannya secara alami dengan sosok perempuan.
- source_word: στέφανος
  choice: mahkota
  rationale: “Mahkota” paling mudah dipahami dalam teks utama; catatan menjelaskan bahwa kata Yunani menunjuk mahkota berbentuk karangan, bukan diadem kerajaan.
- source_word: ἀστέρων δώδεκα
  choice: dari dua belas bintang
  rationale: Ungkapan ini mencerminkan konstruksi genitif Yunani tanpa menambahkan cara bintang-bintang itu tersusun.
theological_decisions:
- issue: Identitas simbolis perempuan itu
  choice: Tidak mengidentifikasi sosok tersebut; teks tetap berupa gambaran penglihatan.
  alternative: Israel, Maria, umat Allah, atau jemaat.
  rationale: Ayat ini belum secara eksplisit menyebut identitas perempuan itu. Terjemahan deskriptif mempertahankan ketegangan teologis dan tidak memasukkan tafsiran denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Inversi “tampaklah” mempertahankan nada penglihatan yang khidmat tanpa terasa usang. Penanda catatan [a] ditempatkan langsung sesudah kata yang dijelaskan.
