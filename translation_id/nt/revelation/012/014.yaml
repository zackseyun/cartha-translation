id: REV.12.14
reference: Revelation 12:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐδόθησαν τῇ γυναικὶ ⸀αἱ δύο πτέρυγες τοῦ ἀετοῦ τοῦ μεγάλου, ἵνα πέτηται εἰς τὴν ἔρημον εἰς τὸν τόπον αὐτῆς, ⸂ὅπου τρέφεται⸃ ἐκεῖ καιρὸν καὶ καιροὺς καὶ ἥμισυ καιροῦ ἀπὸ προσώπου τοῦ ὄφεως.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/014.yaml
  text: And the woman was given the two wings of the great eagle, so that she might fly into the wilderness to her place, where she is nourished there for a time and times and half a time, away from the presence of the serpent.
translation:
  language: id
  text: Kepada perempuan itu diberikan kedua sayap rajawali besar, supaya ia terbang ke padang gurun, ke tempatnya. Di sana ia dipelihara selama satu masa, dua masa, dan setengah masa, jauh dari hadapan ular itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἱ δύο πτέρυγες τοῦ ἀετοῦ τοῦ μεγάλου
  choice: kedua sayap rajawali besar
  rationale: Mempertahankan citra apokaliptik dan penandaan definit dalam konteks tanpa frasa Indonesia yang kaku seperti 'dua sayap dari rajawali yang besar'.
- source_word: ἔρημον
  choice: padang gurun
  rationale: Istilah Indonesia yang alami untuk tempat tandus dan terpencil dalam citra alkitabiah.
- source_word: τρέφεται
  choice: dipelihara
  rationale: Bentuk pasif kini dapat mencakup pemberian makan maupun pemeliharaan berkelanjutan tanpa menetapkan pelakunya yang tidak disebutkan.
- source_word: καιρὸν καὶ καιροὺς καὶ ἥμισυ καιροῦ
  choice: satu masa, dua masa, dan setengah masa
  rationale: Menyampaikan idiom Yunani secara transparan; bentuk jamak 'masa-masa' akan kurang alami dalam bahasa Indonesia, sedangkan 'dua masa' mempertahankan pola simboliknya.
- source_word: ἀπὸ προσώπου τοῦ ὄφεως
  choice: jauh dari hadapan ular itu
  rationale: Mempertahankan ungkapan sumber tentang keterpisahan dari hadapan atau jangkauan ular, tanpa mempersempitnya menjadi sekadar pelarian fisik.
theological_decisions:
- issue: Identitas rajawali, perempuan, dan jangka waktu simbolik
  choice: Citra dan ungkapan waktunya dibiarkan tanpa penafsiran tambahan.
  alternative: Menjelaskan rajawali sebagai Allah atau menafsirkan masa itu langsung sebagai tiga setengah tahun.
  rationale: Ayat menggunakan simbol apokaliptik dan tidak secara eksplisit memberikan identifikasi atau konversi tersebut.
- issue: Pelaku yang memelihara perempuan
  choice: Menggunakan bentuk pasif 'ia dipelihara'.
  alternative: Menambahkan 'Allah memeliharanya'.
  rationale: Teks Yunani memakai bentuk pasif dan tidak menyebut pelaku; terjemahan tidak boleh menambahkan identifikasi teologis yang tersirat saja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dipecah setelah 'tempatnya' agar alami, sementara 'Di sana' mempertahankan penekanan lokatif ἐκεῖ. Istilah simbolik tidak dijelaskan atau diselaraskan secara denominatif.
source_grounding:
  english_pob_role: consult_only
