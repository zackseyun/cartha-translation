  to: Lalu perempuan itu melarikan diri ke padang belantara, di sana ia mempunyai tempat yang telah disiapkan oleh Allah, supaya di sana mereka memeliharanya[a] selama seribu dua ratus enam puluh hari.
  rationale: Revisi hanya memperbaiki kelancaran sintaksis Indonesia dan penempatan jangkar catatan kaki. Terjemahan tetap mempertahankan penanda lokasi “di sana,” keadaan tempat yang telah disiapkan oleh Allah, serta subjek tak tentu dalam bentuk aktif “mereka memeliharanya.”
