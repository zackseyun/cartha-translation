id: REV.12.6
reference: Revelation 12:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἡ γυνὴ ἔφυγεν εἰς τὴν ἔρημον, ὅπου ἔχει ἐκεῖ τόπον ἡτοιμασμένον ⸀ἀπὸ τοῦ θεοῦ, ἵνα ἐκεῖ ⸀τρέφωσιν αὐτὴν ἡμέρας χιλίας διακοσίας ἑξήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/006.yaml
  text: And the woman fled into the wilderness[a], where she has there a place prepared by God, so that there they might nourish her for one thousand two hundred sixty days.
translation:
  language: id
  text: Lalu perempuan itu melarikan diri ke padang belantara, di sana ia mempunyai tempat yang telah disiapkan oleh Allah, supaya di sana mereka memeliharanya[a] selama seribu dua ratus enam puluh hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “supaya ia dipelihara di sana selama seribu dua ratus enam puluh hari.” Dalam bahasa Yunani, kata kerjanya berbentuk orang ketiga jamak tanpa subjek yang disebutkan; secara harfiah, “supaya mereka memeliharanya di sana.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφυγεν
  choice: melarikan diri
  rationale: Bentuk aoris dari φεύγω menyatakan tindakan pergi untuk menyelamatkan diri; pilihan ini alami dalam bahasa Indonesia dan tidak menambahkan rincian yang tidak ada dalam teks.
- source_word: ἔρημον
  choice: padang belantara
  rationale: ἔρημος menunjuk tempat sunyi atau terpencil, tidak harus gurun berpasir. 'Padang belantara' mempertahankan cakupan dan gema alkitabiahnya.
- source_word: τόπον
  choice: suatu tempat
  rationale: τόπος secara langsung berarti 'tempat'; 'suatu' mempertahankan sifat tak tentu frasa Yunani.
- source_word: ἡτοιμασμένον ἀπὸ τοῦ θεοῦ
  choice: yang telah disiapkan oleh Allah
  rationale: Partisip perfek pasif menunjukkan bahwa tempat itu sudah berada dalam keadaan siap, sedangkan ἀπό menandai Allah sebagai pelakunya.
- source_word: ἵνα
  choice: supaya
  rationale: ἵνα memperkenalkan tujuan atau hasil; 'supaya' alami dan tetap mempertahankan daya purposifnya.
- source_word: τρέφωσιν αὐτὴν
  choice: mereka memeliharanya
  rationale: τρέφω dapat berarti memberi makan atau memelihara. Dalam konteks perlindungan berkelanjutan, 'memelihara' mencakup penyediaan kebutuhan. 'Mereka' mempertahankan verba aktif orang ketiga jamak dengan subjek yang tidak disebutkan.
- source_word: ἡμέρας χιλίας διακοσίας ἑξήκοντα
  choice: selama seribu dua ratus enam puluh hari
  rationale: Akusatif durasi diterjemahkan secara alami dengan 'selama', dan bilangan ditulis dengan kata agar sesuai dengan prosa Alkitab.
- source_word: ὅπου ἔχει ἐκεῖ
  choice: tempat ia mempunyai
  rationale: ὅπου dan ἐκεῖ sama-sama menunjuk lokasi. Dalam bahasa Indonesia, menerjemahkan keduanya secara harfiah akan terasa berlebihan; 'tempat' menyampaikan lokasi dengan alami tanpa kehilangan makna.
theological_decisions:
- issue: Subjek τρέφωσιν tidak disebutkan
  choice: 'Mempertahankan bentuk aktif tak tentu: ''mereka memeliharanya''.'
  alternative: '''ia dipelihara di sana'''
  rationale: Teks Yunani memakai verba aktif orang ketiga jamak tanpa subjek eksplisit. Menyebut Allah sebagai pelaku akan melampaui teks, sedangkan bentuk pasif menghilangkan konstruksi aktif dan ketidakjelasan pelakunya.
translation_notes:
  register: Bahasa Indonesia baku modern, wajar, dan bermartabat. Susunan kalimat dibuat alami tanpa menghapus ketidakjelasan asli mengenai siapa yang memelihara perempuan itu.
