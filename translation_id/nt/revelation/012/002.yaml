  text: καὶ ἐν γαστρὶ ἔχουσα· ⸂καὶ κράζει⸃ ὠδίνουσα καὶ βασανιζομένη τεκεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/002.yaml
  text: And she was pregnant[a], and she cries out[c][b], suffering birth pains and being tormented to give birth.
translation:
  language: id
  text: Ia sedang mengandung[a] dan berteriak karena mengalami sakit bersalin[b] dan tersiksa[c] saat akan melahirkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mempunyai di dalam rahim”; dapat juga diterjemahkan “hamil.”
    reason: lexical_alternative
  - marker: b
    text: Atau “merasakan nyeri persalinan.”
    reason: lexical_alternative
  - marker: c
    text: Atau “berada dalam penderitaan yang hebat.” Frasa Yunani mengaitkan penderitaan ini dengan kelahiran yang akan terjadi.
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: ἐν γαστρὶ ἔχουσα
  choice: Ia sedang mengandung
  rationale: Ungkapan ini secara harfiah berarti 'mempunyai di dalam rahim' dan merupakan idiom untuk keadaan hamil. 'Sedang mengandung' alami dan bermartabat dalam bahasa Indonesia modern.
- source_word: κράζει
  choice: berteriak
  rationale: Bentuk kini Yunani memberi kesan hidup dan langsung dalam penglihatan; 'berteriak' mempertahankan intensitas seruan tanpa menetapkan isi seruannya.
- source_word: ὠδίνουσα
  choice: mengalami sakit bersalin
  rationale: Partisip ini menunjuk pada rasa sakit persalinan. Ungkapan tersebut jelas dan mempertahankan unsur nyeri yang kurang eksplisit dalam pilihan seperti 'sedang bersalin'.
- source_word: βασανιζομένη
  choice: tersiksa
  rationale: Partisip pasif ini menyatakan penderitaan atau siksaan berat. 'Tersiksa' mempertahankan kekuatan istilah Yunani dan tetap sesuai dengan konteks persalinan.
- source_word: τεκεῖν
  choice: hendak melahirkan
  rationale: Infinitif ini terkait dengan penderitaan yang mengarah kepada kelahiran. 'Hendak melahirkan' alami dalam konteks ini dan tidak menyiratkan bahwa kelahiran sudah terjadi.
- source_word: καὶ ... καὶ
  choice: dan ... dan
  rationale: Pengulangan penghubung dipertahankan secukupnya untuk membawa rangkaian kumulatif teks Yunani tanpa menghasilkan susunan Indonesia yang kaku.
theological_decisions:
- issue: Intensitas penderitaan perempuan dan identitas simbolisnya
  choice: Menerjemahkan βασανιζομένη secara kuat sebagai 'tersiksa' tanpa menjelaskan identitas perempuan itu.
  alternative: Memakai ungkapan yang lebih lunak seperti 'sangat kesakitan' atau menafsirkan siapa yang dilambangkan oleh perempuan itu.
  rationale: Teks menggambarkan penderitaannya dengan kuat, tetapi ayat ini sendiri tidak mengidentifikasi perempuan tersebut atau menerangkan makna teologis rasa sakitnya. Terjemahan mempertahankan intensitas dan ambiguitas itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang hidup dan bermartabat. Struktur dibuat alami bagi pembaca umum sambil mempertahankan intensitas, urutan tindakan, dan ketegangan gambaran Yunani.
