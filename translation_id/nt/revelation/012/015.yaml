  source_fidelity: 'Draf mempertahankan unsur-unsur utama teks Yunani: ular, air yang keluar dari mulutnya seperti sungai, sasaran perempuan itu, dan tujuan agar ia dihanyutkan. Namun, "untuk mengejar perempuan itu" mengubah frasa arah ὀπίσω menjadi tindakan eksplisit "mengejar," dan "supaya ia membuat" tidak alami serta dapat menimbulkan ambiguitas rujukan subjek. Revisi memakai "ke arah perempuan itu" dan menyatakan kausatifnya dengan lebih jelas.'
  naturalness: '"Lalu" dan "ular itu" sesuai dengan bahasa Indonesia baku modern. "Menyemburkan" wajar untuk air dari mulut. Revisi menghilangkan konstruksi tidak idiomatis "supaya ia membuat" sambil mempertahankan hubungan tujuan.'
