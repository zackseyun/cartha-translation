id: REV.12.15
reference: Revelation 12:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν ὁ ὄφις ἐκ τοῦ στόματος αὐτοῦ ὀπίσω τῆς γυναικὸς ὕδωρ ὡς ποταμόν, ἵνα αὐτὴν ποταμοφόρητον ποιήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/015.yaml
  text: And the serpent hurled water like a river out of his mouth after the woman[b][a], so that he might cause her to be swept away by the river.
translation:
  language: id
  text: Lalu ular itu menyemburkan air seperti sungai dari mulutnya ke arah perempuan itu[a], agar ia dapat membuat perempuan itu hanyut terbawa arus sungai[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di belakang perempuan itu.” Ungkapan Yunani ini dapat menunjuk pada posisi di belakang atau gerakan ke arah perempuan itu dalam pengejaran.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “membuatnya terbawa sungai.” Maksudnya ialah membuat perempuan itu hanyut oleh arus sungai.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλεν
  choice: menyemburkan
  rationale: Secara dasar berarti 'melemparkan/mencampakkan', tetapi dengan air yang keluar dari mulut, 'menyemburkan' alami dalam bahasa Indonesia dan tetap menyampaikan tindakan yang kuat.
- source_word: ὁ ὄφις
  choice: ular itu
  rationale: Menerjemahkan ὄφις secara langsung dan mempertahankan gema simbolis alkitabiahnya.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: dari mulutnya
  rationale: Ungkapan Indonesia yang lugas dan alami untuk asal keluarnya air.
- source_word: ὀπίσω τῆς γυναικός
  choice: untuk mengejar perempuan itu
  rationale: Dalam konteks serangan dan pengejaran, frasa ini paling wajar dipahami secara terarah sebagai tindakan mengejar; kemungkinan arti spasial tetap dicatat.
- source_word: ὕδωρ ὡς ποταμόν
  choice: air seperti sungai
  rationale: Mempertahankan perbandingan dengan ὡς serta citra sungai, tanpa menafsirkannya langsung sebagai banjir atau lambang tertentu.
- source_word: ἵνα
  choice: supaya
  rationale: Menyatakan tujuan tindakan ular secara ringkas dan alami.
- source_word: ποταμοφόρητον ποιήσῃ
  choice: membuat perempuan itu hanyut terbawa sungai
  rationale: Menyampaikan konstruksi kausatif dan arti harfiah kata langka ποταμοφόρητος, yakni 'terbawa oleh sungai', tanpa menambahkan bahwa perempuan itu tenggelam atau mati.
theological_decisions:
- issue: Citra simbolis serangan ular dalam penglihatan apokaliptis
  choice: Mempertahankan citra 'air seperti sungai' dan perempuan yang hanyut terbawa sungai tanpa menjelaskan lambangnya dalam teks utama.
  alternative: Menafsirkan air sebagai pasukan, penganiayaan, kebohongan, atau kekacauan.
  rationale: Teks sumber menyajikan citra simbolis tanpa memberikan penafsirannya dalam ayat ini; terjemahan tidak boleh menetapkan satu skema tafsir.
- issue: Daya tujuan pada ἵνα
  choice: supaya
  alternative: sehingga
  rationale: Konteks serangan mendukung maksud atau tujuan ular, sambil tidak meniadakan nuansa hasil yang kadang dapat melekat pada ἵνα.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang hidup dan bermartabat. 'Menyemburkan' dipilih agar tindakan dari mulut terdengar alami, sedangkan 'hanyut terbawa sungai' mempertahankan citra sumber dan menghindari penambahan makna 'tenggelam'.
