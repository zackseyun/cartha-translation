id: REV.12.12
reference: Revelation 12:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: διὰ τοῦτο εὐφραίνεσθε, ⸀οἱ οὐρανοὶ καὶ οἱ ἐν αὐτοῖς σκηνοῦντες. οὐαὶ ⸂τὴν γῆν καὶ τὴν θάλασσαν⸃, ὅτι κατέβη ὁ διάβολος πρὸς ὑμᾶς, ἔχων θυμὸν μέγαν, εἰδὼς ὅτι ὀλίγον καιρὸν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/012.yaml
  text: Therefore rejoice[a], O heavens, and you who dwell in them. Woe to the earth and the sea, because the devil has come down to you with great fury[c][b], knowing that he has only a little time.
translation:
  language: id
  text: Karena itu, bersukacitalah, hai segala langit, dan kalian yang tinggal di dalamnya! Celakalah bumi[a] dan laut, karena Iblis telah turun kepada kalian dengan murka yang besar[b], sebab ia tahu bahwa waktunya tinggal sedikit[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “daratan.” Kata Yunani γῆ dapat berarti “bumi” atau “daratan”; “bumi” dipilih karena konteksnya bercakupan kosmis.
    reason: lexical_alternative
  - marker: b
    text: Atau “dengan amarah yang hebat.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “ia mempunyai sedikit waktu.”
    reason: literal_rendering
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Karena itu
  rationale: Menandai kesimpulan dari kemenangan di surga yang disebut sebelumnya, dengan ungkapan Indonesia yang ringkas dan alami.
- source_word: εὐφραίνεσθε
  choice: bersukacitalah
  rationale: Mempertahankan bentuk perintah dan nuansa sukacita dalam ragam bahasa yang wajar serta bermartabat.
- source_word: οἱ οὐρανοὶ
  choice: hai segala langit
  rationale: Bentuk jamak Yunani dipertahankan tanpa memakai bentuk ulang Indonesia yang terasa janggal; kata 'hai' menandai sapaan langsung.
- source_word: οἱ ἐν αὐτοῖς σκηνοῦντες
  choice: kalian yang tinggal di dalamnya
  rationale: Menyampaikan makna idiomatis σκηνόω sebagai menetap atau berdiam, sambil mempertahankan daya sapaan langsung.
- source_word: οὐαὶ
  choice: Celakalah
  rationale: Padanan Indonesia yang lazim untuk seruan nubuat tentang malapetaka atau penghakiman.
- source_word: τὴν γῆν καὶ τὴν θάλασσαν
  choice: bumi dan laut
  rationale: γῆ dapat berarti bumi atau daratan; cakupan kosmis konteks dan pasangannya dengan laut mendukung 'bumi'.
- source_word: κατέβη
  choice: telah turun
  rationale: Menyatakan tindakan yang sudah terjadi dan akibatnya masih terasa dalam adegan ini.
- source_word: ὁ διάβολος
  choice: Iblis
  rationale: Dalam konteks ini διάβολος berfungsi sebagai gelar yang sudah dikenal bagi lawan ilahi; 'Iblis' merupakan padanan Indonesia yang jelas dan mapan.
- source_word: πρὸς ὑμᾶς
  choice: kepada kalian
  rationale: Mempertahankan arah gerak menuju pihak yang disapa tanpa menambahkan makna 'melawan' yang tidak harus terkandung dalam preposisi itu sendiri.
- source_word: ἔχων θυμὸν μέγαν
  choice: dengan murka yang besar
  rationale: Menyampaikan amarah yang sangat kuat dengan diksi yang dekat pada bentuk Yunani dan sesuai dengan ragam kitab nubuat.
- source_word: εἰδὼς
  choice: sebab ia tahu
  rationale: Partisip ini dipahami sebagai pemberi alasan bagi murka Iblis; bentuk klausa membuat hubungan tersebut jelas dan alami dalam bahasa Indonesia.
- source_word: ὀλίγον καιρὸν ἔχει
  choice: waktunya tinggal sedikit
  rationale: Mengungkapkan singkatnya masa yang tersisa secara alami, tanpa menentukan lebih lanjut jenis atau lamanya masa tersebut.
theological_decisions:
- issue: Rujukan 'kalian' dalam 'Iblis telah turun kepada kalian'
  choice: Sapaan beralih kepada bumi dan laut sebagai ranah yang baru saja dikenai seruan celaka.
  alternative: '''Kalian'' tetap merujuk secara retoris kepada segala langit dan para penghuninya.'
  rationale: Hubungan langsung antara seruan 'Celakalah bumi dan laut' dan alasan sesudahnya paling alami menunjukkan ranah bumi, tetapi terjemahan tidak menambahkan kata 'para penghuni' sehingga bentuk dan ketegangan teks tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nubuat yang bermartabat. 'Hai segala langit' mempertahankan sapaan dan bentuk jamak Yunani, sedangkan 'kalian' menjaga kejelasan sapaan jamak tanpa terasa kuno.
