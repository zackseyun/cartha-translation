id: REV.12.4
reference: Revelation 12:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἡ οὐρὰ αὐτοῦ σύρει τὸ τρίτον τῶν ἀστέρων τοῦ οὐρανοῦ, καὶ ἔβαλεν αὐτοὺς εἰς τὴν γῆν. καὶ ὁ δράκων ἕστηκεν ἐνώπιον τῆς γυναικὸς τῆς μελλούσης τεκεῖν, ἵνα ὅταν τέκῃ τὸ τέκνον αὐτῆς καταφάγῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/004.yaml
  text: And his tail sweeps away a third of the stars of heaven and threw them to the earth. And the dragon stood before the woman who was about to give birth, so that when she gave birth, he might devour her child.
translation:
  language: id
  text: Ekornya menyeret sepertiga dari bintang-bintang di langit dan telah melemparkan bintang-bintang itu ke bumi.[a] Naga itu berdiri di hadapan perempuan yang hendak melahirkan, supaya ketika perempuan itu melahirkan, naga itu dapat melahap anaknya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Yunani beralih dari bentuk kini, “menyeret,” ke bentuk aoristus, “telah melemparkan.”
    reason: Menandai peralihan kala/aspek yang nyata dan tidak biasa dalam teks sumber tanpa menghaluskannya atau menetapkan urutan kronologis lebih lanjut.
lexical_decisions:
- source_word: σύρει
  choice: menyeret
  rationale: Bentuk kini historis ini secara harfiah menggambarkan ekor naga sedang menyeret bintang-bintang; pilihan ini mempertahankan peralihan aspek dengan ἔβαλεν.
- source_word: τὸ τρίτον
  choice: sepertiga
  rationale: Ungkapan idiomatis Yunani untuk bagian yang berjumlah satu dari tiga bagian.
- source_word: ἔβαλεν
  choice: melemparkannya
  rationale: Aoristus diterjemahkan sebagai tindakan lampau dalam alur penglihatan, sambil mempertahankan ketegangan peralihan dari bentuk kini σύρει.
- source_word: ἕστηκεν
  choice: berdiri
  rationale: Perfek Yunani menyatakan posisi yang telah diambil dan tetap berlangsung; 'berdiri' alami dalam bahasa Indonesia dan konteksnya menyampaikan keadaan menetap itu.
- source_word: καταφάγῃ
  choice: melahap
  rationale: Kata ini menyatakan memakan habis atau menelan dengan rakus; 'melahap' mempertahankan kekerasan gambaran tersebut.
- source_word: τὸ τέκνον αὐτῆς
  choice: anaknya
  rationale: Padanan alami dan tepat bagi 'anaknya'; konteks kelahiran membuat relasinya jelas tanpa menambah jenis kelamin yang tidak dinyatakan dalam ayat ini.
theological_decisions:
- issue: Identitas bintang-bintang
  choice: Tetap diterjemahkan secara harfiah sebagai 'bintang-bintang'
  alternative: Menafsirkannya langsung sebagai malaikat atau makhluk rohani
  rationale: Ayat ini memakai citra apokaliptik tanpa menjelaskan identitas referennya; terjemahan tidak boleh menyelesaikan ambiguitas simbolis tersebut.
- issue: Peralihan kala/aspek σύρει ... ἔβαλεν
  choice: Diterjemahkan 'menyeret ... dan melemparkannya' dengan catatan kaki
  alternative: Menyeragamkan keduanya sebagai tindakan kini atau lampau
  rationale: Teks Yunani beralih dari present ke aoristus. Peralihan yang mencolok ini dipertahankan sejauh dimungkinkan dalam bahasa Indonesia dan dijelaskan tanpa mengoreksi teks.
- issue: Maksud naga dalam ἵνα dengan subjungtif
  choice: Diterjemahkan 'supaya ... dapat melahap'
  alternative: '''untuk melahap'' atau ''agar pasti melahap'''
  rationale: Pilihan ini menyatakan tujuan naga tanpa menyiratkan bahwa upayanya pasti berhasil.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif-apokaliptik yang lugas dan bermartabat. Pengulangan 'perempuan itu' dan 'naga itu' dipakai untuk memperjelas pelaku dalam klausa akhir, sedangkan citra simbolis dibiarkan tanpa penafsiran tambahan.
