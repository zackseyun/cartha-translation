revisions:
- from: Ekornya menyeret sepertiga bintang-bintang di langit dan melemparkannya ke bumi.[a] Naga itu berdiri di hadapan perempuan yang hendak melahirkan, supaya ketika perempuan itu melahirkan, naga itu dapat melahap anaknya.
  to: Ekornya menyeret sepertiga dari bintang-bintang di langit dan telah melemparkan bintang-bintang itu ke bumi.[a] Naga itu berdiri di hadapan perempuan yang hendak melahirkan, supaya ketika perempuan itu melahirkan, naga itu dapat melahap anaknya.
  rationale: Revisi yang diperlukan hanya memperbaiki keselarasan jumlah objek bagi αὐτούς dan memperjelas peralihan bentuk kini ke aoristus yang dipertahankan oleh draf. “Telah melemparkan” adalah cara Indonesia yang wajar untuk membedakan tindakan aoristus dari bentuk kini sebelumnya; catatan kaki tetap membatasi penjelasan pada bentuk Yunani. Makna simbolis bintang-bintang dan hasil dari maksud naga tidak ditafsirkan lebih jauh.
