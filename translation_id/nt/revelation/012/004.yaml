    text: Teks Yunani beralih dari bentuk kini, “menyeret,” ke bentuk aoristus, “telah melemparkan.”
    reason: Menandai peralihan kala/aspek yang nyata dan tidak biasa dalam teks sumber tanpa menghaluskannya atau menetapkan urutan kronologis lebih lanjut.
