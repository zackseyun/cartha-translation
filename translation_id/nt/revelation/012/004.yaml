review_pass:
  verdict: revise
  source_fidelity: Terjemahan secara umum setia pada citra dan hubungan tujuan dalam teks Yunani. Namun, “melemparkannya” memakai enklitik objek tunggal, padahal αὐτούς merujuk pada “bintang-bintang” yang jamak. Revisi juga menandai kontras bentuk kini σύρει dan aoristus ἔβαλεν secara lebih jelas dan tetap alami dalam bahasa Indonesia.
  naturalness: Bahasa Indonesia baku dan gaya apokaliptiknya sudah baik. Pengulangan “perempuan itu” dan “naga itu” membantu kejelasan rujukan. Mengganti pronomina objek yang tidak selaras jumlahnya dengan “bintang-bintang itu” menghilangkan ambiguitas dan memperbaiki kelancaran.
  terminology: “Naga,” “perempuan,” “melahirkan,” dan “melahap” merupakan padanan yang tepat. “Melahap” menyampaikan daya kekerasan καταφάγῃ tanpa menambahkan penafsiran. “Bintang-bintang” dipertahankan sebagai citra yang ambigu, sebagaimana sumber.
  issues:
  - severity: medium
    issue: Objek “melemparkannya” berbentuk tunggal.
    rationale: αὐτούς adalah pronomina jamak yang merujuk kepada τῶν ἀστέρων (“bintang-bintang”). Dalam bahasa Indonesia, “-nya” lazimnya terbaca tunggal dan tidak secara jelas mengacu kepada bintang-bintang.
  - severity: low
    issue: Peralihan σύρει (kini) ke ἔβαλεν (aoristus) belum tampak dalam bentuk verbal terjemahan tanpa bantuan catatan kaki.
    rationale: “Menyeret ... melemparkannya” dapat dibaca sebagai dua tindakan tanpa penandaan waktu/aspek. Penambahan “telah” pada tindakan kedua mempertahankan kontras sumber secara lebih transparan, sambil catatan kaki menjelaskan bahwa ini adalah peralihan bentuk Yunani, bukan penafsiran kronologi yang terperinci.
  revised_text: Ekornya menyeret sepertiga dari bintang-bintang di langit dan telah melemparkan bintang-bintang itu ke bumi.[a] Naga itu berdiri di hadapan perempuan yang hendak melahirkan, supaya ketika perempuan itu melahirkan, naga itu dapat melahap anaknya.
