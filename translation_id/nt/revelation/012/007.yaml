  naturalness: “Lalu pecahlah perang di surga” dan “Mikhael dan malaikat-malaikatnya berperang melawan naga itu” alami dalam bahasa Indonesia baku. “Naga itu pun berperang, dan malaikat-malaikatnya juga” tetap alami sekaligus lebih dekat pada struktur paralel sumber.
