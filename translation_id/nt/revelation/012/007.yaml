  text: Καὶ ἐγένετο πόλεμος ἐν τῷ οὐρανῷ, ὁ Μιχαὴλ καὶ οἱ ἄγγελοι αὐτοῦ ⸀τοῦ πολεμῆσαι μετὰ τοῦ δράκοντος. καὶ ὁ δράκων ἐπολέμησεν καὶ οἱ ἄγγελοι αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/007.yaml
  text: 'And war broke out in heaven: Michael and his angels fought against the dragon[a]. And the dragon and his angels fought back[c][b],'
translation:
  language: id
  text: 'Lalu pecahlah perang di surga: Mikhael dan malaikat-malaikatnya berperang melawan naga itu.[a] Naga itu pun berperang, dan malaikat-malaikatnya juga berperang,[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Mikhael dan malaikat-malaikatnya untuk berperang melawan naga itu.” Bahasa Yunani memakai infinitif berartikel untuk menyatakan tindakan atau tujuan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Naga itu berperang, dan malaikat-malaikatnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο πόλεμος
  choice: pecahlah perang
  rationale: Ungkapan γίνομαι dengan nomina menyatakan terjadinya suatu peristiwa. 'Pecahlah perang' alami dalam bahasa Indonesia dan mempertahankan nuansa bahwa perang mulai terjadi.
- source_word: ἐν τῷ οὐρανῷ
  choice: di surga
  rationale: Dalam konteks ini οὐρανός menunjuk pada alam surgawi, bukan langit yang kelihatan.
- source_word: Μιχαὴλ
  choice: Mikhael
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang dekat dengan bahasa sumber dan mudah dikenali dalam bahasa Indonesia.
- source_word: οἱ ἄγγελοι αὐτοῦ
  choice: malaikat-malaikatnya
  rationale: Bentuk posesif ini secara langsung mempertahankan hubungan para malaikat tersebut dengan Mikhael, lalu secara paralel dengan naga.
- source_word: τοῦ πολεμῆσαι μετὰ τοῦ δράκοντος
  choice: berperang melawan naga itu
  rationale: Infinitif berartikel membentuk konstruksi padat yang mengungkapkan tindakan atau tujuan. Klausa verbal eksplisit terasa alami dalam bahasa Indonesia, sedangkan 'melawan' menyatakan pertentangan dalam konteks ini.
- source_word: δράκοντος / δράκων
  choice: naga itu
  rationale: δράκων berarti 'naga' dalam gambaran apokaliptik ini; kata penunjuk 'itu' menandai tokoh tertentu yang sudah hadir dalam konteks.
- source_word: ἐπολέμησεν
  choice: berperang
  rationale: Terjemahan ini mempertahankan verba Yunani tanpa menambahkan secara eksplisit gagasan 'membalas', meskipun urutan narasi memungkinkan tindakan responsif.
- source_word: καὶ οἱ ἄγγελοι αὐτοῦ
  choice: bersama malaikat-malaikatnya
  rationale: Secara idiomatis memasukkan para malaikat naga sebagai pihak yang turut berperang, sambil mencatat bentuk Yunani yang lebih harfiah dalam catatan kaki.
theological_decisions:
- issue: Identitas dan kedudukan Mikhael
  choice: Nama 'Mikhael' dibiarkan tanpa tambahan gelar atau identifikasi.
  alternative: Menambahkan 'penghulu malaikat' atau mengidentifikasikannya sebagai figur kristologis.
  rationale: Ayat ini hanya menyebut nama Mikhael dan tidak menyatakan pangkatnya ataupun menyamakannya dengan Kristus; terjemahan tidak memasukkan penafsiran tradisional tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami tanpa menghilangkan konstruksi Yunani yang penting; bentuk yang lebih harfiah dicatat. Koma akhir dipertahankan karena ayat berlanjut ke ayat berikutnya.
