source:
  edition: SBLGNT
  text: καὶ ἐβοήθησεν ἡ γῆ τῇ γυναικί, καὶ ἤνοιξεν ἡ γῆ τὸ στόμα αὐτῆς καὶ κατέπιεν τὸν ποταμὸν ὃν ἔβαλεν ὁ δράκων ἐκ τοῦ στόματος αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/016.yaml
  text: And the earth helped the woman[b][a], and the earth opened its mouth and swallowed the river that the dragon had thrown from his mouth.
translation:
  language: id
  text: Bumi menolong perempuan itu[a]; bumi membuka mulutnya dan menelan sungai yang dilemparkan oleh naga itu dari mulutnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanah menolong perempuan itu” atau “daratan menolong perempuan itu.” Kata Yunani γῆ dapat berarti “bumi,” “tanah,” atau “daratan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “sungai yang dilontarkan naga itu dari mulutnya” atau “sungai yang naga itu lemparkan dari mulutnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβοήθησεν
  choice: menolong
  rationale: Padanan langsung dan alami untuk tindakan membantu atau datang memberi pertolongan; bentuk lampau Yunani dinyatakan melalui urutan narasi bahasa Indonesia tanpa penanda kala khusus.
- source_word: ἡ γῆ
  choice: bumi
  rationale: γῆ dapat berarti bumi, tanah, atau daratan. Dalam gambaran apokaliptik yang luas ini, “bumi” paling wajar dan mempertahankan personifikasinya.
- source_word: τῇ γυναικί
  choice: perempuan itu
  rationale: Menerjemahkan nomina tertentu tersebut secara langsung dan mempertahankan tokoh simbolisnya tanpa menambahkan tafsiran.
- source_word: ἤνοιξεν ἡ γῆ τὸ στόμα αὐτῆς
  choice: bumi membuka mulutnya
  rationale: Mempertahankan personifikasi yang hidup dalam teks Yunani. Akhiran “-nya” alami untuk benda yang dipersonifikasikan dalam bahasa Indonesia.
- source_word: κατέπιεν
  choice: menelan
  rationale: Padanan langsung untuk καταπίνω dan sesuai dengan gambaran bumi yang membuka mulut.
- source_word: τὸν ποταμόν
  choice: sungai
  rationale: ποταμός pada dasarnya berarti sungai. Pilihan ini tidak mempersempit atau memperluas gambaran menjadi sekadar aliran atau banjir.
- source_word: ὃν ἔβαλεν
  choice: yang disemburkan
  rationale: βάλλω secara leksikal berarti melemparkan atau melontarkan, tetapi dalam konteks sesuatu yang keluar dari mulut, “disemburkan” menyampaikan gerak kuat itu secara alami. Alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: ὁ δράκων
  choice: naga itu
  rationale: Padanan baku untuk δράκων; kata penunjuk “itu” menyatakan ketertentuan artikel Yunani dan merujuk pada naga yang telah disebut.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: dari mulutnya
  rationale: Padanan alami dan tepat bagi frasa preposisional Yunani, tanpa mengubah sumber aliran tersebut.
theological_decisions:
- issue: Personifikasi bumi dalam gambaran apokaliptik
  choice: Mempertahankan bumi sebagai pelaku yang menolong, membuka mulut, dan menelan.
  alternative: Menafsirkan bumi sebagai penduduk, wilayah tertentu, atau sarana pemeliharaan ilahi.
  rationale: Teks menyajikan gambaran simbolis tanpa menjelaskan acuannya. Terjemahan tidak seharusnya menetapkan satu penafsiran alegoris.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Tanda titik koma mempertahankan hubungan koordinatif kedua klausa sekaligus memperlihatkan bahwa tindakan berikutnya menjelaskan cara bumi menolong perempuan itu. Pengulangan “bumi” dipertahankan karena terdapat dalam teks Yunani dan menegaskan personifikasi.
