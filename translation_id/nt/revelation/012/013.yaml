  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ὅτε εἶδεν ὁ δράκων ὅτι ἐβλήθη εἰς τὴν γῆν, ἐδίωξεν τὴν γυναῖκα ἥτις ἔτεκεν τὸν ἄρσενα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/013.yaml
  text: And when the dragon saw that he had been thrown down to the earth[b][a], he pursued the woman who had given birth to the male child.
translation:
  language: id
  text: Dan ketika naga itu melihat bahwa ia telah dilemparkan ke bumi, ia mengejar[a] perempuan yang telah melahirkan anak laki-laki itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menganiaya perempuan itu.” Kata Yunani yang digunakan dapat berarti “mengejar” ataupun “menganiaya”; dalam konteks ini, maknanya mungkin mencakup pengejaran yang bermusuhan sekaligus penganiayaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: δράκων
  choice: naga
  rationale: Mempertahankan gambaran apokaliptik yang dinyatakan oleh nomina Yunani ini, tanpa menyelaraskannya dengan sebutan 'ular' di bagian lain.
- source_word: ἐβλήθη
  choice: telah dilemparkan
  rationale: Bentuk pasif ini menyatakan tindakan paksa; 'telah' memperjelas bahwa pelemparan terjadi sebelum naga melihat keadaannya.
- source_word: εἰς τὴν γῆν
  choice: ke bumi
  rationale: Dalam latar kosmis Wahyu, γῆ paling wajar berarti 'bumi', berlawanan dengan surga dalam konteks sekitar.
- source_word: ἐδίωξεν
  choice: mengejar
  rationale: διώκω dapat berarti mengejar atau menganiaya. Dalam alur naratif ini tindakan pengejaran konkret menonjol, sementara sifat penganiayaannya tetap tersirat dan dicatat dalam catatan kaki.
- source_word: τὴν γυναῖκα
  choice: perempuan
  rationale: Padanan alami dan langsung yang mempertahankan figur simbolis tanpa menentukan identitasnya.
- source_word: ἥτις ἔτεκεν
  choice: yang telah melahirkan
  rationale: Menyampaikan tindakan melahirkan yang sudah terjadi sebelum pengejaran dengan bahasa Indonesia yang alami.
- source_word: τὸν ἄρσενα
  choice: anak laki-laki itu
  rationale: Secara harfiah berarti 'yang laki-laki'; nomina 'anak' dilengkapi berdasarkan konteks agar alami dalam bahasa Indonesia, sementara penekanan pada jenis kelamin tetap dipertahankan.
theological_decisions:
- issue: Identitas simbolis perempuan dan anak laki-laki
  choice: Mempertahankan sebutan 'perempuan' dan 'anak laki-laki' tanpa penjelasan identitas dalam teks utama.
  alternative: Menafsirkan perempuan sebagai Maria, Israel, atau umat Allah/jemaat.
  rationale: Ayat ini menggunakan simbolisme apokaliptik dan tidak secara eksplisit menetapkan referen perempuan dalam ayat tersebut; terjemahan tidak seharusnya menutup keragaman penafsiran yang mungkin.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan urutan peristiwa, bentuk pasif, atau ambiguitas penting pada kata ἐδίωξεν.
