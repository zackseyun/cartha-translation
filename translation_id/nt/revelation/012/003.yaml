id: REV.12.3
reference: Revelation 12:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ὤφθη ἄλλο σημεῖον ἐν τῷ οὐρανῷ, καὶ ἰδοὺ δράκων ⸂μέγας πυρρός⸃, ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα καὶ ἐπὶ τὰς κεφαλὰς αὐτοῦ ἑπτὰ διαδήματα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/003.yaml
  text: And another sign appeared in heaven[a], and behold, a great red dragon, having seven heads and ten horns, and on his heads seven diadems[b],
translation:
  language: id
  text: 'Lalu tampaklah suatu tanda lain di surga: lihatlah, seekor naga besar berwarna merah menyala, yang mempunyai tujuh kepala dan sepuluh tanduk, dan di atas kepala-kepalanya ada tujuh mahkota kerajaan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “diadem-diadem”, yaitu ikat kepala kerajaan sebagai lambang kekuasaan, berbeda dari mahkota kemenangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤφθη
  choice: tampaklah
  rationale: Bentuk pasif aoristus ὁράω dalam kisah penglihatan berfungsi idiomatis dengan arti 'tampak'; partikel -lah membantu mempertahankan gaya naratif yang khidmat.
- source_word: ἄλλο σημεῖον
  choice: suatu tanda lain
  rationale: σημεῖον menunjuk pada tanda simbolis dalam penglihatan; 'tanda' merupakan padanan alami dan tidak menafsirkan simbol itu lebih jauh.
- source_word: ἐν τῷ οὐρανῷ
  choice: di surga
  rationale: Dalam konteks penglihatan apokaliptis ini, 'surga' lebih tepat daripada 'langit' untuk mempertahankan latar kosmis, meskipun kata Yunani dapat memuat kedua arti.
- source_word: ἰδοὺ
  choice: lihatlah
  rationale: Penanda wacana ini mengarahkan perhatian pembaca secara mendadak; 'lihatlah' alami dalam bahasa Indonesia yang bermartabat.
- source_word: δράκων μέγας πυρρός
  choice: seekor naga besar berwarna merah menyala
  rationale: δράκων diterjemahkan langsung sebagai 'naga'; μέγας menyatakan kebesaran atau ukuran; πυρρός menggambarkan warna merah seperti api, yang disampaikan secara alami dengan 'merah menyala'.
- source_word: ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα
  choice: yang mempunyai tujuh kepala dan sepuluh tanduk
  rationale: Klausa relatif lebih alami daripada mempertahankan partisipel secara kaku, tanpa mengubah hubungan deskriptifnya.
- source_word: ἐπὶ τὰς κεφαλὰς αὐτοῦ ἑπτὰ διαδήματα
  choice: di atas kepala-kepalanya ada tujuh mahkota kerajaan
  rationale: διάδημα adalah ikat kepala atau mahkota lambang kedaulatan, berbeda dari στέφανος; 'mahkota kerajaan' menjaga pembedaan itu dalam bahasa Indonesia yang mudah dipahami.
theological_decisions:
- issue: Nuansa warna πυρρός
  choice: merah menyala
  alternative: merah; merah seperti api
  rationale: Pilihan ini mempertahankan gambaran warna merah berapi tanpa menjadikannya pernyataan bahwa naga itu secara harfiah terbakar.
- issue: Makna διάδημα
  choice: mahkota kerajaan
  alternative: diadem; mahkota
  rationale: Terjemahan ini mempertahankan nuansa lambang kekuasaan kerajaan dan membedakannya dari mahkota kemenangan, tanpa menafsirkan legitimasi kekuasaan tersebut.
- issue: Referen αὐτοῦ
  choice: kepala-kepalanya
  alternative: kepala-kepala naga itu
  rationale: Akhiran posesif -nya mempertahankan rujukan kepada naga tanpa perlu memaksakan kategori gender yang tidak ditandai dalam pronomina bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur penglihatan dipertahankan dengan 'tampaklah' dan 'lihatlah', sedangkan partisipel Yunani disampaikan sebagai klausa relatif agar alami. Tanda baca titik dua memperjelas bahwa seruan berikut memperkenalkan isi tanda yang tampak.
