  source_fidelity: 'Teks Indonesia menyampaikan seluruh unsur Yunani dengan setia: tanda lain tampak di surga, penanda perhatian ἰδού, naga besar yang merah menyala, tujuh kepala, sepuluh tanduk, serta tujuh diadem pada kepala-kepalanya. “Merah menyala” secara wajar mempertahankan nuansa πυρρός yang merah seperti api tanpa menambahkan bahwa naga itu terbakar.'
