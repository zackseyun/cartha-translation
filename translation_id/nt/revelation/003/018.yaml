id: REV.3.18
reference: Revelation 3:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: συμβουλεύω σοι ἀγοράσαι ⸂παρ’ ἐμοῦ χρυσίον⸃ πεπυρωμένον ἐκ πυρὸς ἵνα πλουτήσῃς, καὶ ἱμάτια λευκὰ ἵνα περιβάλῃ καὶ μὴ φανερωθῇ ἡ αἰσχύνη τῆς γυμνότητός σου, καὶ κολλούριον ⸀ἐγχρῖσαι τοὺς ὀφθαλμούς σου ἵνα βλέπῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/018.yaml
  text: I counsel you to buy from me gold refined by fire so that you may become rich[a], and white garments so that you may clothe yourself and the shame of your nakedness may not be exposed[c][b], and eye salve to anoint your eyes so that you may see.
translation:
  language: id
  text: Aku menasihatimu untuk membeli dari-Ku emas yang dimurnikan dengan api[a], agar engkau menjadi kaya; pakaian putih[b], supaya engkau mengenakannya dan aib ketelanjanganmu tidak tersingkap; serta salep mata[c] untuk kauoleskan pada matamu, agar engkau dapat melihat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “yang dimurnikan melalui api” atau “yang diuji dalam api.”'
    reason: lexical_alternative
  - marker: b
    text: Istilah Yunaninya berarti pakaian secara umum; dalam konteks tertentu dapat merujuk pada jubah.
    reason: lexical_alternative
  - marker: c
    text: Yang dimaksud ialah sediaan obat yang dioleskan pada mata.
    reason: cultural_note
lexical_decisions:
- source_word: συμβουλεύω σοι
  choice: Aku menasihatimu
  rationale: Bentuk kini orang pertama tunggal dengan datif penerima menyatakan nasihat yang langsung dan berwibawa; bentuk ini alami dalam bahasa Indonesia tanpa mengubahnya menjadi perintah eksplisit.
- source_word: ἀγοράσαι παρ’ ἐμοῦ
  choice: supaya membeli dari-Ku
  rationale: Infinitif aoris melengkapi verba menasihati, sedangkan παρά dengan genitif menunjukkan sumber. Metafora transaksi tetap dipertahankan.
- source_word: χρυσίον πεπυρωμένον ἐκ πυρός
  choice: emas yang dimurnikan dengan api
  rationale: Partisipel perfektif pasif menggambarkan emas dalam keadaan sesudah mengalami proses api. 'Dimurnikan dengan api' mempertahankan gambaran metalurgis; alternatif yang mungkin ialah 'diuji dalam api'.
- source_word: ἵνα πλουτήσῃς
  choice: agar engkau menjadi kaya
  rationale: Subjungtif aoris dapat menonjolkan masuknya seseorang ke dalam keadaan kaya; 'menjadi kaya' mencerminkan nuansa ingresif itu.
- source_word: ἱμάτια λευκά
  choice: pakaian putih
  rationale: ἱμάτια merupakan istilah umum bagi pakaian dan tidak harus dipersempit menjadi jubah.
- source_word: ἵνα περιβάλῃ
  choice: supaya engkau mengenakannya
  rationale: Bentuk medial menyatakan tindakan subjek mengenakan pakaian itu pada dirinya sendiri. Pronomina '-nya' membuat hubungan dengan pakaian putih jelas dan alami.
- source_word: μὴ φανερωθῇ ἡ αἰσχύνη τῆς γυμνότητός σου
  choice: aib ketelanjanganmu tidak terlihat
  rationale: φανερόω pasif berarti menjadi tampak atau tersingkap. 'Tidak terlihat' sesuai dengan konteks ketelanjangan, sedangkan 'aib' menyampaikan αἰσχύνη secara ringkas dan wajar.
- source_word: κολλούριον
  choice: salep mata
  rationale: Istilah ini menunjuk pada sediaan obat yang dioleskan pada mata. 'Salep mata' jelas bagi pembaca modern tanpa memakai istilah teknis.
- source_word: ἐγχρῖσαι τοὺς ὀφθαλμούς σου
  choice: untuk kauoleskan pada matamu
  rationale: Verba ini berarti mengoleskan atau menggosokkan suatu bahan. 'Kauoleskan' mempertahankan tindakan medis konkret dan menghindari kesan bahwa teks secara eksplisit menyebut ritus pengurapan.
- source_word: ἵνα βλέπῃς
  choice: agar engkau dapat melihat
  rationale: Klausa tujuan dipertahankan. 'Dapat melihat' mengungkapkan hasil berupa pulihnya kemampuan melihat tanpa menjelaskan secara berlebihan makna simbolisnya.
theological_decisions:
- issue: Makna simbolis emas, pakaian putih, dan salep mata
  choice: Mempertahankan ketiga benda sebagai gambaran konkret tanpa menjelaskan padanan rohaninya di dalam teks utama.
  alternative: Menafsirkan langsung emas sebagai kekayaan rohani, pakaian sebagai kebenaran atau kemurnian, dan salep sebagai penglihatan rohani.
  rationale: Ayat ini tidak menguraikan sendiri setiap lambang. Mempertahankan citranya memungkinkan konteks menentukan penafsiran dan tidak memasukkan rumusan doktrinal ke dalam terjemahan.
- issue: Kemungkinan nuansa religius pada ἐγχρῖσαι
  choice: Menerjemahkan tindakan konkretnya sebagai 'kauoleskan'.
  alternative: Memakai 'mengurapi' untuk mempertahankan kemungkinan resonansi simbolis verba tersebut.
  rationale: Dalam konstruksi dengan salep mata dan mata sebagai objek, tindakan pengolesan paling langsung terlihat. Pilihan ini tidak menyangkal simbolisme keseluruhan ayat, tetapi tidak menyiratkan ritus sakramental yang tidak dinyatakan teks.
- issue: Daya nasihat Kristus kepada jemaat Laodikia
  choice: Memakai 'Aku menasihatimu' dan mempertahankan bentuk nasihat, bukan mengubahnya menjadi perintah telanjang.
  alternative: Memakai 'Aku menyuruhmu' atau langsung 'Belilah'.
  rationale: συμβουλεύω menyatakan pemberian nasihat, meskipun nasihat itu memiliki bobot karena identitas pembicaranya. Terjemahan menjaga bentuk retoris serta kewibawaannya tanpa memperkerasnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal 'engkau' yang sesuai dengan alamat personal kepada jemaat sebagai satu kesatuan. Kapital pada '-Ku' mengikuti konvensi Indonesia untuk rujukan ilahi. Struktur tiga komoditas dipertahankan, tetapi tanda baca dan penghubung disesuaikan agar kalimat panjang tetap mudah dibaca. Semua penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskan.
