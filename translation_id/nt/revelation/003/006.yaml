id: REV.3.6
reference: Revelation 3:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/006.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches.
translation:
  language: id
  text: Siapa yang mempunyai telinga, hendaklah ia mendengarkan apa yang dikatakan Roh kepada jemaat-jemaat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Siapa yang mempunyai
  rationale: Partisipel kini berartikel berfungsi substantival, secara harfiah ‘orang yang mempunyai’. Bentuk ‘Siapa yang mempunyai’ mengungkapkan seruan umum secara alami dalam bahasa Indonesia tanpa membatasi rujukannya pada laki-laki.
- source_word: οὖς
  choice: telinga
  rationale: Mempertahankan bentuk tunggal dan ungkapan peribahasa Yunani. Penambahan ‘untuk mendengar’ tidak diperlukan karena gagasan mendengarkan sudah dinyatakan oleh verba berikutnya.
- source_word: ἀκουσάτω
  choice: hendaklah ia mendengarkan
  rationale: Imperatif aoris orang ketiga tunggal diungkapkan dengan ‘hendaklah’, yang mempertahankan daya seruan. ‘Mendengarkan’ lebih tepat daripada sekadar ‘mendengar’ karena konteks menuntut perhatian dan tanggapan terhadap pesan.
- source_word: τί
  choice: apa yang
  rationale: Memperkenalkan isi perkataan Roh dengan bentuk Indonesia yang wajar dan tepat.
- source_word: τὸ πνεῦμα
  choice: Roh
  rationale: Dalam rumusan berulang di Wahyu 2–3, sebutan ini paling mungkin merujuk kepada Roh Kudus; huruf kapital menandai rujukan tersebut tanpa menambahkan kata ‘Kudus’ yang tidak tertulis.
- source_word: λέγει
  choice: dikatakan
  rationale: Konstruksi ‘apa yang dikatakan Roh’ merupakan ungkapan Indonesia yang alami untuk present indikatif Yunani dan tetap menyatakan bahwa Roh adalah pelaku yang berbicara.
- source_word: ταῖς ἐκκλησίαις
  choice: kepada jemaat-jemaat
  rationale: ‘Jemaat’ merupakan padanan baku dan alami bagi ἐκκλησία dalam konteks komunitas-komunitas Kristen di Wahyu; bentuk ulang mempertahankan jamaknya.
theological_decisions:
- issue: Rujukan ‘Roh’
  choice: Roh Kudus, ditandai dengan huruf kapital ‘Roh’
  alternative: suatu roh atau roh dalam arti umum
  rationale: Rumusan yang berulang dalam Wahyu 2–3 menggambarkan Roh yang menyampaikan pesan ilahi kepada jemaat-jemaat. Huruf kapital mengikuti rujukan yang paling kuat secara kontekstual, sedangkan terjemahan tidak menambahkan ‘Kudus’ ke dalam teks utama.
- issue: Bentuk tunggal generik dalam seruan
  choice: Siapa yang mempunyai telinga, hendaklah ia mendengarkan
  alternative: Siapa yang mempunyai telinga, hendaklah mereka mendengarkan; Orang yang mempunyai telinga, hendaklah orang itu mendengarkan
  rationale: Bahasa Yunani memakai partisipel dan imperatif tunggal dalam arti generik. Bentuk Indonesia ini mempertahankan ketunggalan sekaligus secara alami mencakup siapa saja, bukan hanya laki-laki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur seruan dipertahankan tanpa kekakuan harfiah. Tidak diperlukan catatan kaki karena bentuk ‘Siapa yang’ sudah menyampaikan sifat generik dari bentuk tunggal Yunani dengan jelas.
