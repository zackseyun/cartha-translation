  to: 'Tulislah kepada malaikat[a] jemaat di Sardis: “Inilah yang dikatakan oleh Dia yang memiliki tujuh roh Allah[b] dan tujuh bintang: Aku tahu perbuatanmu. Engkau mempunyai reputasi sebagai orang yang hidup[c], tetapi engkau mati.”'
