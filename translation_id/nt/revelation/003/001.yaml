id: REV.3.1
reference: Revelation 3:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Σάρδεσιν ἐκκλησίας γράψον· Τάδε λέγει ὁ ἔχων τὰ ἑπτὰ πνεύματα τοῦ θεοῦ καὶ τοὺς ἑπτὰ ἀστέρας· Οἶδά σου τὰ ἔργα, ὅτι ὄνομα ἔχεις ὅτι ζῇς, καὶ νεκρὸς εἶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/001.yaml
  text: 'And write to the angel of the church in Sardis: These things says the one who has the seven spirits of God and the seven stars: I know your works[a]; you have a name that you are alive[d][c][b], but you are dead.'
translation:
  language: id
  text: 'Tulislah kepada malaikat[a] jemaat di Sardis: “Inilah yang dikatakan oleh Dia yang memiliki tujuh roh Allah[b] dan tujuh bintang: Aku tahu perbuatanmu. Engkau mempunyai reputasi sebagai orang yang hidup[c], tetapi engkau mati.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “utusan.” Kata Yunani angelos dapat berarti “malaikat” atau “utusan”; dalam latar apokaliptik Wahyu, “malaikat” merupakan terjemahan yang paling wajar.
    reason: alternative_reading
  - marker: b
    text: Frasa “tujuh roh Allah” diterjemahkan secara harfiah. Frasa ini dapat dipahami sebagai lambang kepenuhan Roh Allah atau sebagai tujuh roh surgawi.
    reason: alternative_reading
  - marker: c
    text: Secara lebih harfiah, “engkau mempunyai nama bahwa engkau hidup.” Ungkapan ini berarti bahwa engkau memiliki reputasi sebagai orang yang hidup.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: malaikat
  rationale: Makna leksikal yang paling wajar dalam latar apokaliptik Wahyu; kemungkinan arti 'utusan' tetap dicatat.
- source_word: ἐκκλησίας
  choice: jemaat
  rationale: Istilah Indonesia yang lazim dan tepat untuk komunitas orang percaya setempat di Sardis.
- source_word: Τάδε λέγει
  choice: Inilah yang dikatakan oleh
  rationale: Mengungkapkan formula nubuat Yunani secara alami dan bermartabat dalam bahasa Indonesia modern.
- source_word: ὁ ἔχων
  choice: Dia yang memiliki
  rationale: Mempertahankan konstruksi partisip substantival dan kepemilikan yang dinyatakan teks.
- source_word: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: ketujuh roh Allah
  rationale: Mempertahankan bentuk jamak dan tidak menetapkan identitas simbolisnya.
- source_word: τοὺς ἑπτὰ ἀστέρας
  choice: ketujuh bintang itu
  rationale: Padanan langsung yang mempertahankan gambaran simbolis teks.
- source_word: Οἶδά σου τὰ ἔργα
  choice: Aku tahu segala perbuatanmu
  rationale: Ungkapan Indonesia yang alami; 'perbuatan' mempertahankan arti tindakan atau karya, sedangkan 'segala' menyampaikan cakupan artikel jamak dalam konteks.
- source_word: ὄνομα ἔχεις ὅτι ζῇς
  choice: Engkau dikenal sebagai orang yang hidup
  rationale: Mengungkapkan idiom 'memiliki nama bahwa engkau hidup' sebagai reputasi yang dikenal orang, sambil mempertahankan kontras hidup-mati.
- source_word: νεκρὸς εἶ
  choice: engkau mati
  rationale: Padanan langsung dan tegas yang tidak melunakkan vonis metaforis teks.
theological_decisions:
- issue: Identitas 'ketujuh roh Allah'
  choice: Mempertahankan frasa harfiah 'ketujuh roh Allah'.
  alternative: Menafsirkannya sebagai Roh Allah dalam kepenuhan-Nya atau sebagai tujuh roh surgawi.
  rationale: Bentuk jamak Yunani dan ketegangan penafsirannya harus dipertahankan, bukan diselesaikan dalam terjemahan utama.
- issue: Rujukan ἀγγέλῳ
  choice: malaikat
  alternative: utusan atau wakil manusia dari jemaat
  rationale: Latar apokaliptik Wahyu mendukung 'malaikat', tetapi istilah Yunani juga dapat berarti 'utusan', sehingga alternatif dicatat tanpa menentukan identitas tokohnya.
- issue: Sifat hidup dan mati
  choice: 'Mempertahankan pernyataan metaforis yang mutlak: dikenal hidup, tetapi sebenarnya mati.'
  alternative: Menjelaskannya secara eksplisit sebagai keadaan rohani.
  rationale: Teks tidak menambahkan kata 'secara rohani'; penjelasan semacam itu akan mempersempit daya dan ambiguitas metaforanya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Formula pembuka dibuat alami tanpa kehilangan nada pernyataan kenabian. Sapaan tunggal 'engkau' dipertahankan karena bentuk Yunani mengalamatkan malaikat atau wakil jemaat sebagai satu pihak.
