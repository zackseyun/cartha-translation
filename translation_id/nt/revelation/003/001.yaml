  naturalness: Bahasanya umumnya modern dan bermartabat. “Engkau mempunyai reputasi sebagai orang yang hidup” lebih langsung dan alami daripada “Engkau dikenal sebagai orang yang hidup,” sambil tetap menyampaikan idiom ὄνομα ἔχεις.
  terminology: “Malaikat,” “jemaat,” “tujuh roh Allah,” “tujuh bintang,” dan “perbuatan” merupakan padanan yang tepat. Bentuk “tujuh” dipakai sebagai bilangan pokok yang lebih langsung daripada “ketujuh” dalam konteks ini.
