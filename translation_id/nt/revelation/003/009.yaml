  to: Lihatlah, Aku menyerahkan beberapa orang dari sinagoge Setan[a]—yaitu mereka yang menyebut diri orang Yahudi, padahal bukan, melainkan berdusta. Lihatlah, Aku akan membuat mereka datang dan bersujud di depan kakimu[b], dan mereka akan tahu bahwa Aku telah mengasihimu.
