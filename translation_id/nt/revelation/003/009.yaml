id: REV.3.9
reference: Revelation 3:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἰδοὺ ⸀διδῶ ἐκ τῆς συναγωγῆς τοῦ Σατανᾶ, τῶν λεγόντων ἑαυτοὺς Ἰουδαίους εἶναι, καὶ οὐκ εἰσὶν ἀλλὰ ψεύδονται— ἰδοὺ ποιήσω αὐτοὺς ἵνα ⸂ἥξουσιν καὶ προσκυνήσουσιν⸃ ἐνώπιον τῶν ποδῶν σου, καὶ γνῶσιν ὅτι ⸀ἐγὼ ἠγάπησά σε.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/009.yaml
  text: Look[a], I am giving some from the synagogue of Satan—those who call themselves Jews and are not, but are lying—look, I will make them come and bow down before your feet[b], and they will know that I have loved you.
translation:
  language: id
  text: Lihatlah, Aku menyerahkan beberapa orang dari sinagoge Setan[a]—yaitu mereka yang menyebut diri orang Yahudi, padahal bukan, melainkan berdusta. Lihatlah, Aku akan membuat mereka datang dan bersujud di depan kakimu[b], dan mereka akan tahu bahwa Aku telah mengasihimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Aku memberikan dari sinagoge Setan.” Maksudnya mungkin beberapa orang dari kelompok itu akan dibuat datang.
    reason: lexical_alternative
  - marker: b
    text: Atau “datang dan menyembah di depan kakimu.” Kata Yunani yang dipakai dapat berarti bersujud atau menyembah; “bersujud” dipilih di sini agar tidak menyiratkan bahwa orang percaya menerima penyembahan ilahi.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Lihatlah
  rationale: Dipakai sebagai seruan penarik perhatian yang wajar dan bermartabat; pengulangan dalam teks Yunani dipertahankan.
- source_word: διδῶ ἐκ τῆς συναγωγῆς τοῦ Σατανᾶ
  choice: Aku memberikan beberapa orang dari sinagoge Setan
  rationale: Bentuk kini διδῶ dipertahankan dengan 'memberikan'. Frasa 'beberapa orang' melengkapi objek yang tersirat sekaligus mempertahankan daya partitif ἐκ, sehingga tidak menyatakan seluruh kelompok.
- source_word: συναγωγῆς
  choice: sinagoge
  rationale: Istilah ini tepat bagi perhimpunan atau lingkungan komunal Yahudi dalam konteks tersebut dan lebih spesifik daripada 'perkumpulan'.
- source_word: τῶν λεγόντων ἑαυτοὺς Ἰουδαίους εἶναι
  choice: mereka yang menyebut diri orang Yahudi
  rationale: Ungkapan ini secara alami mempertahankan konstruksi refleksif dan klaim identitas dalam bahasa sumber.
- source_word: καὶ οὐκ εἰσὶν ἀλλὰ ψεύδονται
  choice: padahal bukan, melainkan berdusta
  rationale: Mempertahankan pertentangan tajam teks tanpa menambahkan penjelasan tentang dasar penilaiannya.
- source_word: ποιήσω αὐτοὺς ἵνα ἥξουσιν καὶ προσκυνήσουσιν
  choice: Aku akan membuat mereka datang dan sujud
  rationale: '''Membuat'' menyampaikan daya kausatif ποιήσω. ''Sujud'' mempertahankan tindakan merendahkan diri dari προσκυνέω tanpa dengan sendirinya menyatakan penyembahan ilahi kepada orang percaya.'
- source_word: ἐνώπιον τῶν ποδῶν σου
  choice: di depan kakimu
  rationale: Terjemahan ini dekat dengan ungkapan Yunani dan tetap alami dalam bahasa Indonesia.
- source_word: γνῶσιν ὅτι ἐγὼ ἠγάπησά σε
  choice: mereka akan tahu bahwa Aku telah mengasihimu
  rationale: Hasil yang dimaksud dinyatakan dengan bentuk masa depan yang alami; aoristus ἠγάπησα diterjemahkan 'telah mengasihi' tanpa mengurangi keberlanjutan makna kasih dalam konteks.
theological_decisions:
- issue: Makna orang yang menyebut diri Yahudi tetapi bukan
  choice: Pernyataan polemis teks dipertahankan tanpa menjelaskan bahwa identitas etnis mereka disangkal.
  alternative: Menafsirkannya secara eksplisit sebagai definisi rohani tentang orang Yahudi atau sebagai penyangkalan etnis.
  rationale: Teks menyampaikan penilaian teologis yang tajam, tetapi terjemahan tidak boleh memperluasnya menjadi klaim anti-Yahudi atau menetapkan dengan pasti dasar penyangkalan yang tidak dijelaskan di ayat ini.
- issue: Daya προσκυνήσουσιν di depan kaki orang percaya
  choice: sujud
  alternative: menyembah
  rationale: '''Sujud'' dapat menyatakan penghormatan, ketundukan, atau tindakan merendahkan diri dan tidak secara otomatis menyiratkan bahwa jemaat menerima penyembahan ilahi. Catatan kaki mempertahankan kemungkinan leksikal ''menyembah''.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada langsung dan khidmat. Huruf kapital pada 'Aku' mengikuti kebiasaan penerjemahan Alkitab Indonesia untuk ucapan Kristus. Tanda pisah mempertahankan sisipan penjelas, sementara semua penanda catatan kaki ditempatkan dalam teks utama.
