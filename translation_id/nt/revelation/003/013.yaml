  text: The one who has an ear[b][a], let him hear what the Spirit says to the churches.
translation:
  language: id
  text: Siapa yang mempunyai telinga, hendaklah ia mendengarkan apa yang dikatakan Roh kepada jemaat-jemaat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “perhimpunan-perhimpunan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Siapa yang mempunyai
  rationale: Partisipel kini berartikel berfungsi sebagai nomina dan menunjuk secara umum kepada setiap orang yang memenuhi syarat tersebut. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan daya pepatah dari bentuk Yunani tunggal.
- source_word: οὖς
  choice: telinga
  rationale: Nomina Yunani berbentuk tunggal. Bahasa Indonesia dapat mempertahankan bentuk tunggal secara alami dalam ungkapan ini tanpa menambahkan kata yang tidak ada dalam sumber.
- source_word: ἀκουσάτω
  choice: hendaklah ia mendengarkan
  rationale: Imperatif aoris aktif orang ketiga tunggal menyatakan seruan tegas. 'Mendengarkan' menyampaikan bukan hanya mendengar bunyi, melainkan memperhatikan dan mengindahkan pesan.
- source_word: τί
  choice: apa yang
  rationale: Memperkenalkan isi perkataan Roh secara alami dan tepat dalam bahasa Indonesia.
- source_word: τὸ πνεῦμα
  choice: Roh
  rationale: Dalam rumusan berulang di Wahyu, sebutan ini paling mungkin merujuk kepada Roh Kudus. Huruf kapital menandai referen tersebut tanpa menambahkan kata 'Kudus' yang tidak muncul dalam ayat.
- source_word: λέγει
  choice: dikatakan
  rationale: Konstruksi Indonesia 'apa yang dikatakan Roh' alami dan tetap menyatakan tindakan berbicara dalam kala kini; bentuk pasif relatif ini tidak mengubah Roh sebagai pelaku.
- source_word: ταῖς ἐκκλησίαις
  choice: kepada jemaat-jemaat
  rationale: Datif menandai para penerima pesan. 'Jemaat' merupakan padanan Indonesia yang lazim bagi ἐκκλησία dalam konteks komunitas Kristen setempat, sedangkan bentuk ulang mempertahankan jamaknya.
theological_decisions:
- issue: Referen 'Roh'
  choice: Roh Kudus yang berbicara kepada jemaat-jemaat
  alternative: roh manusia atau roh nubuat dalam arti tidak personal
  rationale: Dalam rumusan nasihat yang berulang dalam Wahyu 2–3, 'Roh' paling wajar dipahami sebagai Roh Kudus yang menyampaikan pesan kenabian kepada jemaat-jemaat. Terjemahan memakai 'Roh' tanpa menambahkan 'Kudus', sehingga identifikasi kontekstual tetap dibedakan dari kata-kata eksplisit teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Rumusan 'hendaklah ia mendengarkan' mempertahankan bentuk imperatif orang ketiga dan corak seruan yang berulang dalam Wahyu. 'Jemaat-jemaat' dipilih daripada 'gereja-gereja' agar jelas menunjuk komunitas orang percaya, bukan bangunan atau lembaga.
