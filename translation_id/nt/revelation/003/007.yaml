id: REV.3.7
reference: Revelation 3:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Φιλαδελφείᾳ ἐκκλησίας γράψον· Τάδε λέγει ὁ ἅγιος, ὁ ἀληθινός, ὁ ἔχων τὴν κλεῖν ⸀Δαυίδ, ὁ ἀνοίγων καὶ οὐδεὶς κλείσει, ⸂καὶ κλείων⸃ καὶ οὐδεὶς ⸀ἀνοίγει·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/007.yaml
  text: 'And write to the angel of the church in Philadelphia: These things says the Holy One[a], the True One, the one who has the key of David, who opens and no one will shut[b], and who shuts and no one opens:'
translation:
  language: id
  text: '“Tulislah kepada malaikat[b] jemaat di Filadelfia: Inilah yang dikatakan oleh Yang Kudus, Yang Sejati, Dia yang memegang kunci Daud[a], yang membuka dan tidak seorang pun akan menutup, yang menutup dan tidak seorang pun membuka:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kunci Daud” kemungkinan mengacu kepada Yesaya 22:22, suatu gambaran tentang wewenang kerajaan untuk membuka dan menutup.
    reason: cross_reference
  - marker: b
    text: Atau “utusan” untuk “malaikat” (ἀγγέλῳ).
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: malaikat
  rationale: Kata ini dapat berarti ‘malaikat’ atau ‘utusan’. Dalam rumusan berulang kepada ketujuh jemaat di Wahyu, ‘malaikat’ merupakan padanan yang alami dan mapan tanpa meniadakan kemungkinan makna ‘utusan’, yang dicatat dalam catatan kaki.
- source_word: ἐκκλησίας
  choice: jemaat
  rationale: Dalam konteks ini kata tersebut menunjuk kepada komunitas orang percaya setempat; ‘jemaat’ adalah padanan Indonesia yang jelas dan alami.
- source_word: Τάδε λέγει
  choice: Inilah firman dari
  rationale: Ungkapan ini mempertahankan nada khidmat rumusan pewartaan kenabian, sekaligus terdengar wajar dalam bahasa Indonesia modern.
- source_word: ὁ ἅγιος
  choice: Yang Kudus
  rationale: Konstruksi adjektiva substantival dengan artikel berfungsi sebagai gelar bagi sang pembicara.
- source_word: ὁ ἀληθινός
  choice: Yang Sejati
  rationale: Pilihan ini mempertahankan nuansa ‘benar, autentik, sungguh-sungguh’ dan bentuknya sebagai gelar, tanpa mempersempit makna hanya menjadi ‘jujur’.
- source_word: τὴν κλεῖν Δαυίδ
  choice: kunci Daud
  rationale: Padanan langsung ini mempertahankan citra dan gema Yesaya 22:22 mengenai wewenang kerajaan keturunan Daud.
- source_word: ὁ ἀνοίγων
  choice: yang membuka
  rationale: Partisipel kini diterjemahkan sebagai klausa relatif yang alami dan melanjutkan rangkaian sebutan bagi sang pembicara.
- source_word: κλείσει
  choice: akan menutup
  rationale: Bentuk futur Yunani dipertahankan, termasuk pergeseran kala yang terdapat dalam teks sumber.
- source_word: κλείων
  choice: yang menutup
  rationale: Partisipel kini diterjemahkan dengan klausa relatif yang alami dan sejajar dengan ‘yang membuka’.
- source_word: ἀνοίγει
  choice: membuka
  rationale: 'Bentuk kini dipertahankan, menghasilkan pasangan: ia membuka dan tidak seorang pun akan menutup; ia menutup dan tidak seorang pun membuka.'
theological_decisions:
- issue: Gelar kristologis ὁ ἅγιος dan ὁ ἀληθινός
  choice: 'Diterjemahkan sebagai gelar langsung bagi Kristus yang bangkit: ‘Yang Kudus, Yang Sejati’.'
  alternative: Diterjemahkan secara lebih umum sebagai ‘dia yang kudus dan benar’.
  rationale: Konstruksi artikel dan adjektiva substantival dalam konteks ini berfungsi sebagai gelar khidmat. Pilihan tersebut mempertahankan bobot kristologis teks tanpa menambahkan klaim di luar teks.
- issue: Kiasan ‘kunci Daud’
  choice: Citra ‘kunci Daud’ dipertahankan dalam teks utama.
  alternative: Dijabarkan sebagai ‘wewenang atas kerajaan Daud’.
  rationale: Ungkapan ini kemungkinan besar menggemakan Yesaya 22:22, tetapi terjemahan sebaiknya mempertahankan citra Alkitab dan menaruh penjelasannya dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Rumusan pembuka dibuat alami bagi pembaca umum sambil mempertahankan gema kenabian. Catatan [b] ditempatkan sesudah ‘malaikat’ dalam teks utama agar setiap penanda catatan kaki muncul pada lokasi yang relevan.
