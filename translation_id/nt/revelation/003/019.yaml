id: REV.3.19
reference: Revelation 3:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐγὼ ὅσους ἐὰν φιλῶ ἐλέγχω καὶ παιδεύω· ⸀ζήλευε οὖν καὶ μετανόησον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/019.yaml
  text: Those whom I love[a], I rebuke and discipline[c][b]. Therefore be zealous and repent.
translation:
  language: id
  text: Aku menegur dan mendidik setiap orang yang Kukasihi[a]. Karena itu, bersungguh-sungguhlah[b] dan bertobatlah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: siapa pun yang Kukasihi.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: bersemangatlah; kata Yunaninya menyatakan kesungguhan atau semangat yang berkobar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: Aku
  rationale: Pronomina eksplisit ini mempertahankan penegasan pembicara dalam bahasa Yunani tanpa menambahkan ungkapan yang terasa kaku dalam bahasa Indonesia.
- source_word: ὅσους ἐὰν
  choice: setiap orang yang
  rationale: Konstruksi relatif tak tentu ini berarti ‘sebanyak siapa pun’ atau ‘siapa pun yang’. ‘Setiap orang yang’ menyampaikan cakupan tak tentu tersebut secara alami.
- source_word: φιλῶ
  choice: Kukasihi
  rationale: Kata ini menyatakan kasih atau afeksi yang nyata. ‘Kukasihi’ mempertahankan bobot relasionalnya tanpa memaksakan pembedaan teknis dari kata Yunani lain untuk kasih.
- source_word: ἐλέγχω
  choice: menegur
  rationale: Dalam konteks ini kata tersebut menunjuk pada koreksi yang menyingkapkan kesalahan dan mengarahkan orang kepada perubahan; ‘menegur’ adalah padanan Indonesia yang alami.
- source_word: παιδεύω
  choice: mendidik
  rationale: Kata ini mencakup pembinaan melalui koreksi, bukan hukuman semata. ‘Mendidik’ menonjolkan tujuan pembentukan sambil tetap dipasangkan dengan ‘menegur’ sebagai tindakan korektif.
- source_word: ζήλευε
  choice: bersungguh-sungguhlah
  rationale: Imperatif ini menyerukan kesungguhan yang berkobar atau penuh semangat. Pilihan ini alami dalam bahasa Indonesia dan tidak membatasi maknanya pada perasaan sesaat.
- source_word: οὖν
  choice: Karena itu
  rationale: 'Ungkapan ini memperlihatkan hubungan kesimpulan: kasih yang menegur dan mendidik menuntut tanggapan berupa kesungguhan dan pertobatan.'
- source_word: μετανόησον
  choice: bertobatlah
  rationale: ‘Bertobatlah’ merupakan padanan yang mapan dan tepat bagi seruan untuk perubahan moral dan rohani dalam konteks ini.
theological_decisions:
- issue: Hubungan kasih (φιλῶ) dengan teguran dan pendidikan ilahi
  choice: Kasih diterjemahkan secara penuh sebagai ‘Kukasihi’ dan menjadi dasar bagi teguran serta pendidikan.
  alternative: Kusayangi atau orang yang kepadanya Aku menaruh kasih sayang
  rationale: Teks menyajikan koreksi sebagai tindakan yang berakar pada kasih sejati. Terjemahan ini tidak melemahkan kasih menjadi kesukaan belaka dan tidak memasukkan pembedaan teologis teknis antara φιλέω dan ἀγαπάω.
- issue: Cakupan παιδεύω
  choice: mendidik
  alternative: mendisiplinkan; menghajar; melatih
  rationale: ‘Mendidik’ mempertahankan arah pembentukan dan koreksi dalam kata Yunani tanpa menjadikannya hukuman semata. Catatan kaki menjelaskan unsur korektif yang mungkin tidak langsung tampak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk ‘Aku’ serta klitik berhuruf kapital mengikuti rujukan kepada pembicara ilahi. Susunan kalimat dibuat langsung dan alami; nuansa pembentukan korektif pada παιδεύω dipertahankan melalui ‘mendidik’ dalam pasangan ‘menegur dan mendidik’.
