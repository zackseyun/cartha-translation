  source_fidelity: Teks Indonesia dengan tepat menerjemahkan ἐγὼ sebagai “Aku,” ὅσους ἐὰν sebagai “setiap orang yang,” φιλῶ sebagai “Kukasihi,” serta dua tindakan korektif ἐλέγχω dan παιδεύω sebagai “menegur dan mendidik.” “Karena itu” menyampaikan inferensi οὖν, sedangkan “bersungguh-sungguhlah dan bertobatlah” mempertahankan kedua imperatif dan daya seruannya. “Mendidik” secara wajar mencakup pembinaan korektif παιδεύω, bukan hukuman belaka.
