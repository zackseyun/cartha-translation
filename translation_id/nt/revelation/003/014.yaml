id: REV.3.14
reference: Revelation 3:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Λαοδικείᾳ ἐκκλησίας γράψον· Τάδε λέγει ὁ Ἀμήν, ὁ μάρτυς ὁ πιστὸς ⸀καὶ ἀληθινός, ἡ ἀρχὴ τῆς κτίσεως τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/014.yaml
  text: 'And write to the angel of the church in Laodicea: These things says the Amen[a], the faithful and true witness[b], the beginning of the creation of God.'
translation:
  language: id
  text: “Dan tuliskanlah kepada malaikat jemaat di Laodikia:[a] Inilah yang dikatakan oleh Sang Amin, Saksi yang setia dan benar, Awal dari ciptaan Allah.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “utusan” jemaat di Laodikia.
    reason: lexical_alternative
  - marker: b
    text: Atau “Sumber/asal ciptaan Allah” atau “Penguasa atas ciptaan Allah.” Kata Yunani archē dapat berarti “awal,” “asal/sumber,” atau “penguasa.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: malaikat
  rationale: Kata ini dapat berarti malaikat atau utusan. Dalam rumusan berulang kepada ketujuh jemaat di Kitab Wahyu, “malaikat” merupakan padanan yang paling wajar, sementara kemungkinan “utusan” dicatat dalam catatan kaki.
- source_word: Τάδε λέγει
  choice: Inilah firman
  rationale: Ungkapan ini menyampaikan formula pewartaan profetis secara alami dan bermartabat dalam bahasa Indonesia, tanpa mengubah fungsi ujarannya.
- source_word: ὁ Ἀμήν
  choice: Sang Amin
  rationale: “Amin” dipertahankan sebagai gelar khas yang membawa daya liturgis dan makna kepastian/kebenaran; “Sang” menandai pemakaiannya sebagai gelar pribadi.
- source_word: ὁ μάρτυς ὁ πιστὸς καὶ ἀληθινός
  choice: Saksi yang setia dan benar
  rationale: Padanan ini mempertahankan makna kesaksian serta mutu kesetiaan dan kebenaran dalam susunan Indonesia yang alami.
- source_word: ἡ ἀρχὴ
  choice: Awal
  rationale: ἀρχή memiliki cakupan makna “awal”, “asal/sumber”, atau “penguasa”. “Awal” adalah padanan paling langsung dan mempertahankan ketegangan tafsir dalam teks utama.
- source_word: τῆς κτίσεως τοῦ θεοῦ
  choice: dari ciptaan Allah
  rationale: Padanan ini mempertahankan konstruksi genitif Yunani secara ringkas tanpa menentukan lebih jauh hubungan yang dimaksud.
theological_decisions:
- issue: Makna ἡ ἀρχὴ τῆς κτίσεως τοῦ θεοῦ sebagai gelar kristologis
  choice: Awal dari ciptaan Allah
  alternative: Sumber/asal ciptaan Allah; Penguasa atas ciptaan Allah
  rationale: Teks utama memakai arti leksikal paling langsung, “Awal”, agar ambiguitas dan ketegangan teologis ἀρχή tidak diselesaikan diam-diam. Arti lain yang sah secara leksikal dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Formula “Inilah firman” mempertahankan nuansa pewartaan profetis. Gelar-gelar ditulis dengan huruf kapital untuk memperjelas bahwa semuanya menunjuk kepada pembicara yang sama.
