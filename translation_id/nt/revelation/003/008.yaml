id: REV.3.8
reference: Revelation 3:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οἶδά σου τὰ ἔργα— ἰδοὺ δέδωκα ἐνώπιόν σου θύραν ἠνεῳγμένην, ἣν οὐδεὶς δύναται κλεῖσαι αὐτήν— ὅτι μικρὰν ἔχεις δύναμιν, καὶ ἐτήρησάς μου τὸν λόγον, καὶ οὐκ ἠρνήσω τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/008.yaml
  text: I know your works. Look[a], I have set before you an open door, which no one is able to shut, because you have little strength, and you have kept my word, and have not denied my name.
translation:
  language: id
  text: Aku tahu perbuatan-perbuatanmu. Lihatlah, Aku telah menempatkan di hadapanmu sebuah pintu yang telah dibuka[a], dan tidak seorang pun dapat menutupnya. Sebab engkau memiliki sedikit kekuatan, engkau telah memegang firman-Ku, dan engkau tidak menyangkal nama-Ku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "sebuah pintu terbuka" atau "sebuah pintu yang tetap terbuka." Partisip Yunani menunjukkan bahwa pintu itu telah dibuka dan kini berada dalam keadaan terbuka.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδά σου τὰ ἔργα
  choice: Aku tahu perbuatan-perbuatanmu
  rationale: οἶδα berbentuk perfek tetapi bermakna kini; 'Aku tahu' alami dalam bahasa Indonesia. Bentuk jamak konkret 'perbuatan-perbuatanmu' mempertahankan rumusan yang berulang dalam Wahyu.
- source_word: ἰδοὺ
  choice: Lihatlah
  rationale: Mempertahankan seruan yang mengarahkan perhatian dengan ungkapan Indonesia yang modern dan bermartabat.
- source_word: δέδωκα ἐνώπιόν σου
  choice: Aku telah menempatkan di hadapanmu
  rationale: Dalam konstruksi dengan 'pintu', verba yang secara harfiah berarti 'telah memberikan' secara idiomatis menyatakan penempatan; 'telah' mempertahankan relevansi kini dari bentuk perfek.
- source_word: θύραν ἠνεῳγμένην
  choice: sebuah pintu yang telah terbuka
  rationale: 'Klausa ini alami dalam bahasa Indonesia dan tetap mencerminkan partisip perfek pasif: pintu itu sudah dibuka dan berada dalam keadaan terbuka, tanpa menentukan makna metaforanya.'
- source_word: ἣν οὐδεὶς δύναται κλεῖσαι αὐτήν
  choice: dan tidak seorang pun dapat menutupnya
  rationale: Bahasa Indonesia lebih alami memakai klausa koordinatif dan pronomina '-nya'; 'dapat' menyampaikan kemampuan yang dinyatakan δύναται.
- source_word: ὅτι μικρὰν ἔχεις δύναμιν
  choice: Sebab kekuatanmu kecil
  rationale: ὅτι dipahami secara kausal, sedangkan δύναμις diterjemahkan 'kekuatan' untuk menyatakan kapasitas terbatas tanpa nuansa politis yang tidak perlu.
- source_word: ἐτήρησάς μου τὸν λόγον
  choice: engkau telah menuruti firman-Ku
  rationale: Dalam konteks kesetiaan, τηρέω mencakup memegang dan menaati. 'Menuruti' terdengar alami dan menyatakan ketaatan tanpa memperluas λόγος menjadi tafsiran tertentu; 'firman' sesuai register alkitabiah Indonesia.
- source_word: οὐκ ἠρνήσω τὸ ὄνομά μου
  choice: tidak menyangkal nama-Ku
  rationale: Mempertahankan ungkapan konkret Yunani dan makna penolakan terhadap kesetiaan yang diwakili oleh 'nama'.
theological_decisions:
- issue: Makna kiasan 'pintu yang telah terbuka'
  choice: Gambar pintu dipertahankan tanpa penjelasan interpretatif.
  alternative: Kesempatan bermisi; jalan masuk ke keselamatan atau kerajaan; kesempatan providensial secara umum.
  rationale: Ayat ini tidak secara eksplisit menentukan referennya; terjemahan harus mempertahankan ambiguitas dan ketegangan teologis tersebut.
- issue: Hubungan ὅτι dengan kekuatan kecil dan kesetiaan jemaat
  choice: '''Sebab ... tetapi ...'' menyajikan kekuatan yang kecil sebagai latar kausal sambil menandai kontras dengan kesetiaan mereka.'
  alternative: Menerjemahkan rangkaian seluruhnya dengan 'karena ... dan ... dan ...' tanpa penanda kontras.
  rationale: Bahasa sumber mengoordinasikan klausa-klausa dengan καί, tetapi secara semantis kesetiaan di tengah kekuatan kecil mengandung kontras. 'Tetapi' membuat alur Indonesia jelas tanpa mengubah isi proposisional.
- issue: Daya aspek bentuk perfek
  choice: Dipakai bentuk 'telah' pada tindakan membuka/menempatkan dan menuruti firman.
  alternative: Bentuk lampau tanpa penanda aspek, seperti 'menempatkan' dan 'menuruti'.
  rationale: Pilihan ini mempertahankan tindakan lampau yang hasil atau relevansinya masih berlangsung, sejauh dapat diungkapkan secara alami dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal 'engkau' dan kapitalisasi pronomina ilahi sesuai konvensi penerbitan Alkitab Indonesia. Gaya dijaga lugas dan bermartabat; metafora pintu tidak ditafsirkan di dalam teks.
