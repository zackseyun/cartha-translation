id: REV.3.17
reference: Revelation 3:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι λέγεις ⸀ὅτι Πλούσιός εἰμι καὶ πεπλούτηκα καὶ ⸀οὐδὲν χρείαν ἔχω, καὶ οὐκ οἶδας ὅτι σὺ εἶ ὁ ταλαίπωρος ⸀καὶ ἐλεεινὸς καὶ πτωχὸς καὶ τυφλὸς καὶ γυμνός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/017.yaml
  text: because you say[a], ‘I am rich, and I have become wealthy[b], and I have need of nothing,’ and you do not know that you are wretched and pitiable and poor and blind and naked.
translation:
  language: id
  text: Sebab engkau berkata, “Aku kaya dan telah menjadi kaya, dan aku tidak memerlukan apa pun,” dan engkau tidak tahu bahwa engkaulah yang malang dan patut dikasihani, miskin, buta, dan telanjang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι λέγεις ὅτι
  choice: Sebab engkau berkata, “…”
  rationale: ὅτι pertama menyatakan alasan, sedangkan ὅτι kedua memperkenalkan isi perkataan. Kutipan langsung terdengar alami dalam bahasa Indonesia.
- source_word: Πλούσιός εἰμι
  choice: Aku kaya
  rationale: Padanan langsung yang mempertahankan pengakuan tentang kekayaan tanpa menambahkan penafsiran rohani.
- source_word: πεπλούτηκα
  choice: sudah menjadi kaya
  rationale: Bentuk perfek menyiratkan proses memperoleh kekayaan yang menghasilkan keadaan kaya pada masa kini; “sudah menjadi kaya” mempertahankan kedua unsur itu.
- source_word: οὐδὲν χρείαν ἔχω
  choice: aku tidak memerlukan apa pun
  rationale: Ungkapan Indonesia yang alami dan tetap mempertahankan cakupan mutlak οὐδέν.
- source_word: οὐκ οἶδας
  choice: engkau tidak tahu
  rationale: Mempertahankan verba kognitif secara langsung tanpa menggantinya dengan penafsiran seperti “tidak menyadari”.
- source_word: σὺ εἶ ὁ ταλαίπωρος
  choice: engkaulah yang malang
  rationale: Partikel -lah menyampaikan penekanan pada σὺ, sedangkan “yang malang” mencerminkan artikel Yunani yang membuat gambaran itu lebih tajam tanpa menghasilkan susunan Indonesia yang kaku.
- source_word: ἐλεεινός
  choice: patut dikasihani
  rationale: Menyatakan bahwa orang tersebut layak menerima belas kasihan serta membedakannya dari ταλαίπωρος, “malang”.
- source_word: πτωχὸς καὶ τυφλὸς καὶ γυμνός
  choice: miskin, buta, dan telanjang
  rationale: Padanan harfiah dan jelas yang mempertahankan rangkaian gambaran retoris dalam teks sumber.
theological_decisions:
- issue: Apakah pertentangan antara kekayaan yang diakui dan kemiskinan yang sebenarnya perlu dijelaskan sebagai keadaan rohani
  choice: Bahasa kekayaan, kemiskinan, kebutaan, dan ketelanjangan dipertahankan tanpa penjelas seperti “secara rohani”.
  alternative: Aku kaya secara materi … engkau miskin secara rohani.
  rationale: Teks itu sendiri membangun ironi dan daya metaforisnya. Menambahkan penjelas akan mempersempit makna serta menyelesaikan ketegangan yang dibiarkan oleh teks sumber.
- issue: Ketajaman ungkapan ὁ ταλαίπωρος
  choice: engkaulah yang malang
  alternative: engkau malang
  rationale: “Engkaulah yang malang” mempertahankan penekanan σὺ dan nuansa tajam dari artikel ὁ, tetapi tetap wajar dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Engkau” dipakai karena tuturan ini berupa sapaan langsung tunggal kepada jemaat yang dipersonifikasikan. Tanda titik menutup kutipan sebelum “Namun” agar kontras retoris terbaca jelas tanpa mengubah hubungan antarklausa.
