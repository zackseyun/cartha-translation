revisions:
- from: Sebab engkau berkata, “Aku kaya dan sudah menjadi kaya; aku tidak memerlukan apa pun.” Namun, engkau tidak tahu bahwa engkaulah yang malang dan patut dikasihani, miskin, buta, dan telanjang.
  to: Sebab engkau berkata, “Aku kaya dan telah menjadi kaya, dan aku tidak memerlukan apa pun,” dan engkau tidak tahu bahwa engkaulah yang malang dan patut dikasihani, miskin, buta, dan telanjang.
  rationale: Revisi hanya mengganti penghubung adversatif dengan koordinasi yang sesuai dengan καί dan memperhalus padanan perfek πεπλούτηκα. Penekanan σὺ tetap diungkapkan oleh “engkaulah,” sedangkan semua gambaran kekayaan, kemiskinan, kebutaan, dan ketelanjangan dipertahankan tanpa penafsiran tambahan.
