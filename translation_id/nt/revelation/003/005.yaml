id: REV.3.5
reference: Revelation 3:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ νικῶν ⸀οὕτως περιβαλεῖται ἐν ἱματίοις λευκοῖς, καὶ οὐ μὴ ἐξαλείψω τὸ ὄνομα αὐτοῦ ἐκ τῆς βίβλου τῆς ζωῆς, καὶ ὁμολογήσω τὸ ὄνομα αὐτοῦ ἐνώπιον τοῦ πατρός μου καὶ ἐνώπιον τῶν ἀγγέλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/005.yaml
  text: The one who conquers will thus be clothed in white garments[a], and I will certainly not erase his name from the book of life[d][c][b], and I will confess his name before my Father and before his angels.
translation:
  language: id
  text: Orang yang menang akan mengenakan pakaian putih seperti itu[a]. Aku sekali-kali tidak akan menghapus namanya dari kitab kehidupan[b][c], dan Aku akan mengakui namanya di hadapan Bapa-Ku dan di hadapan para malaikat-Nya[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Orang yang mengalahkan.” Kata Yunani yang diterjemahkan “menang” juga dapat berarti “mengalahkan”; kata “seperti itu” menerjemahkan kata yang menghubungkan janji ini dengan gambaran sebelumnya.
    reason: lexical_alternative
  - marker: b
    text: 'Ungkapan Yunani memakai penyangkalan yang sangat tegas: “Aku pasti tidak akan menghapus” atau “Aku tidak akan pernah menghapus.”'
    reason: lexical_alternative
  - marker: c
    text: “Kitab kehidupan” adalah gambaran tentang daftar surgawi orang-orang yang menjadi milik Allah dan menerima kehidupan.
    reason: cultural_note
  - marker: d
    text: Atau “menyatakan namanya.” Bandingkan Matius 10:32.
    reason: cross_reference
lexical_decisions:
- source_word: ὁ νικῶν
  choice: Orang yang menang
  rationale: Partisipel kini substantival ini menggambarkan orang yang dicirikan oleh kemenangan. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan motif kemenangan dalam Wahyu.
- source_word: οὕτως περιβαλεῖται
  choice: akan mengenakan
  rationale: οὕτως mengacu pada keadaan berpakaian putih yang baru disebut dalam konteks dekat; dalam bahasa Indonesia maknanya dapat tersampaikan secara alami melalui janji mengenakan pakaian putih tanpa kata penunjuk yang kaku. Bentuk verba dapat dipahami secara medial atau pasif; 'akan mengenakan' mempertahankan hasil yang dijanjikan tanpa menentukan pelakunya secara eksplisit.
- source_word: ἱματίοις λευκοῖς
  choice: pakaian putih
  rationale: ἱμάτια menunjuk pada pakaian secara umum. 'Pakaian' lebih tepat daripada 'jubah', yang akan mempersempit gambaran sumber.
- source_word: οὐ μὴ ἐξαλείψω
  choice: Aku sekali-kali tidak akan menghapus
  rationale: Gabungan οὐ μή dengan bentuk mendatang merupakan penyangkalan yang sangat tegas. 'Sekali-kali tidak akan' menyampaikan penekanan itu dengan jelas dan bermartabat.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: namanya
  rationale: Mempertahankan bentuk tunggal dan rujukan maskulin representatif dari konstruksi Yunani; dalam bahasa Indonesia 'namanya' tidak menandai gender.
- source_word: ἐκ τῆς βίβλου τῆς ζωῆς
  choice: dari kitab kehidupan
  rationale: '''Kitab kehidupan'' merupakan ungkapan Alkitab yang mapan dan dapat dipahami sebagai daftar surgawi, tanpa harus mempersempit βίβλος menjadi gulungan.'
- source_word: ὁμολογήσω τὸ ὄνομα αὐτοῦ
  choice: Aku akan mengakui namanya
  rationale: ὁμολογέω di sini berarti mengakui secara terbuka. 'Mengakui' lebih alami daripada 'mengaku' ketika objeknya adalah nama seseorang dan tetap mempertahankan nuansa pernyataan di hadapan pihak lain.
- source_word: ἐνώπιον τοῦ πατρός μου
  choice: di hadapan Bapa-Ku
  rationale: Terjemahan langsung dan alami yang mempertahankan hubungan filial pembicara.
- source_word: ἐνώπιον τῶν ἀγγέλων αὐτοῦ
  choice: di hadapan para malaikat-Nya
  rationale: Pronomina αὐτοῦ paling wajar merujuk kepada Bapa dalam sintaksis terdekat. Bentuk '-Nya' mempertahankan rujukan itu tanpa parafrasa.
theological_decisions:
- issue: Implikasi penghapusan nama dari kitab kehidupan bagi perdebatan tentang ketekunan atau kemurtadan
  choice: Menerjemahkannya sebagai janji tegas kepada orang yang menang, tanpa menarik kesimpulan tambahan tentang kemungkinan atau ketidakmungkinan kehilangan keselamatan.
  alternative: Menjadikannya secara eksplisit jaminan ketekunan orang percaya, atau peringatan eksplisit bahwa keselamatan dapat hilang.
  rationale: Ayat ini sendiri menyampaikan janji melalui gambaran daftar surgawi, tetapi tidak menyelesaikan seluruh perdebatan teologis yang lebih luas.
- issue: Nilai bentuk medial/pasif περιβαλεῖται
  choice: akan mengenakan
  alternative: akan dikenakan pakaian / akan dipakaikan
  rationale: Bentuk Yunani memungkinkan nuansa medial atau pasif. Ungkapan Indonesia yang dipilih menyatakan keadaan atau hasil yang dijanjikan tanpa menambahkan siapa yang mengenakannya.
- issue: Rujukan αὐτοῦ pada frasa 'para malaikat-Nya'
  choice: Mempertahankan pronomina yang paling dekat merujuk kepada Bapa.
  alternative: Mengharmonisasikannya menjadi 'para malaikat Allah' atau 'malaikat-malaikat-Ku'.
  rationale: Sintaksis sumber paling alami menghubungkan pronomina itu dengan 'Bapa-Ku'; terjemahan tidak boleh mengubah rujukannya demi harmonisasi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada luhur tetapi mudah dipahami. Kapitalisasi pada kata ganti ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Susunan klausa mempertahankan tiga janji dan pengulangan 'di hadapan' dari teks Yunani.
