  to: Karena itu, ingatlah bagaimana engkau telah menerima dan mendengar[a]; peliharalah itu, dan bertobatlah. Jadi, jika engkau tidak berjaga-jaga[b], Aku akan datang seperti pencuri[c], dan engkau sama sekali tidak akan tahu pada jam berapa Aku akan datang menimpamu.
