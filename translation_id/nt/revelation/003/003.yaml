id: REV.3.3
reference: Revelation 3:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μνημόνευε οὖν πῶς εἴληφας καὶ ἤκουσας καὶ τήρει, καὶ μετανόησον· ἐὰν οὖν μὴ γρηγορήσῃς, ⸀ἥξω ὡς κλέπτης, καὶ οὐ μὴ ⸀γνῷς ποίαν ὥραν ἥξω ἐπὶ σέ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/003.yaml
  text: Therefore remember how you have received and heard[a]; keep it, and repent. So if you do not stay awake, I will come like a thief[c][b], and you will certainly not know at what hour I will come upon you.
translation:
  language: id
  text: Karena itu, ingatlah bagaimana engkau telah menerima dan mendengar[a]; peliharalah itu, dan bertobatlah. Jadi, jika engkau tidak berjaga-jaga[b], Aku akan datang seperti pencuri[c], dan engkau sama sekali tidak akan tahu pada jam berapa Aku akan datang menimpamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ingatlah apa yang telah engkau terima dan dengar.” Teks Yunani berbunyi “bagaimana,” yang mungkin menekankan cara engkau dahulu menerima dan mendengar, meskipun ada yang memahaminya sebagai rujukan kepada berita itu sendiri.
    reason: alternative_reading
  - marker: b
    text: “Berjaga-jaga” juga dapat diterjemahkan “tetap waspada” atau “tetap terjaga.”
    reason: lexical_alternative
  - marker: c
    text: Peringatan “Aku akan datang seperti pencuri” menggemakan ungkapan di bagian lain tentang kedatangan yang mendadak dan tak terduga. Ayat ini sendiri tidak menentukan apakah yang dimaksud ialah penghakiman terakhir atau tindakan disiplin yang lebih segera.
    reason: cross_reference
lexical_decisions:
- source_word: μνημόνευε
  choice: ingatlah
  rationale: Imperatif kini menyerukan tindakan mengingat yang terus dipelihara; “ingatlah” alami, jelas, dan cukup kuat dalam bahasa Indonesia.
- source_word: οὖν
  choice: karena itu
  rationale: Menandai kesimpulan atau konsekuensi dari teguran sebelumnya dan mempertahankan hubungan logis ayat ini dengan konteksnya.
- source_word: πῶς
  choice: bagaimana
  rationale: Mempertahankan kata keterangan Yunani yang terutama menunjuk pada cara atau keadaan penerimaan, tanpa mengubahnya diam-diam menjadi “apa”.
- source_word: εἴληφας
  choice: engkau telah menerima
  rationale: Bentuk perfektum menunjuk pada penerimaan pada masa lampau yang tetap relevan; “telah menerima” mencerminkan nuansa tersebut.
- source_word: ἤκουσας
  choice: mendengar
  rationale: Padanan langsung dan alami bagi tindakan mendengar yang telah terjadi; dipadukan dengan “telah” pada verba sebelumnya.
- source_word: τήρει
  choice: peliharalah itu
  rationale: τηρέω dapat mencakup menjaga, menaati, dan tetap berpegang. “Peliharalah” mempertahankan keluasan makna itu, sedangkan “itu” ditambahkan demi kejelasan sebagai rujukan kepada hal yang diterima dan didengar.
- source_word: μετανόησον
  choice: bertobatlah
  rationale: Istilah Perjanjian Baru yang lazim untuk berbalik dari dosa; ringkas, jelas, dan sesuai dengan nada seruan.
- source_word: γρηγορήσῃς
  choice: berjaga-jaga
  rationale: Mempertahankan gambaran kewaspadaan atau keadaan tetap terjaga dan sesuai dengan perumpamaan tentang pencuri.
- source_word: ἥξω ὡς κλέπτης
  choice: Aku akan datang seperti pencuri
  rationale: Perumpamaan ini diterjemahkan secara langsung dan alami, dengan tetap menonjolkan sifat kedatangan yang mendadak dan tak terduga.
- source_word: οὐ μὴ γνῷς
  choice: engkau sama sekali tidak akan tahu
  rationale: Gabungan οὐ μή dengan subjunktif menyatakan penyangkalan yang tegas; “sama sekali tidak” menyampaikan tekanan itu secara alami.
- source_word: ποίαν ὥραν
  choice: pada jam berapa
  rationale: Mempertahankan kekhususan kata ὥρα dan ungkapan apokaliptik sumber, bukan memperluasnya menjadi sekadar “kapan”.
- source_word: ἐπὶ σέ
  choice: kepadamu
  rationale: Menyatakan arah kedatangan kepada pihak yang disapa secara alami dalam bahasa Indonesia, tanpa memastikan apakah kedatangan itu merupakan penghukuman terakhir atau tindakan disiplin yang lebih dekat.
theological_decisions:
- issue: Makna πῶς dalam seruan untuk mengingat
  choice: “ingatlah bagaimana engkau telah menerima dan mendengar”
  alternative: “ingatlah apa yang telah engkau terima dan dengar”
  rationale: Teks Yunani memakai πῶς, “bagaimana”, yang paling langsung menunjuk pada cara penerimaan atau pendengaran. Terjemahan mempertahankan bentuk itu sekaligus mencatat bahwa ungkapan tersebut dapat dipahami sebagai rujukan kepada isi berita.
- issue: Sifat kedatangan “seperti pencuri”
  choice: Dibiarkan sebagai peringatan tentang kedatangan yang tak terduga
  alternative: Menentukannya secara eksplisit sebagai kedatangan akhir Kristus atau sebagai penghukuman/disiplin setempat
  rationale: Ayat ini sendiri tidak menetapkan cakupan kedatangan tersebut. Rumusan yang terbuka mempertahankan ketegangan teologis teks dan tidak memasukkan penafsiran denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan langsung. Kata ganti “engkau” mempertahankan sapaan tunggal kepada jemaat sebagai satu kesatuan, dan “Aku” memakai huruf kapital karena penuturnya adalah Kristus. Susunan “bagaimana engkau telah menerima dan mendengar” sengaja mempertahankan ambiguitas sumber meskipun sedikit lebih formal daripada percakapan sehari-hari.
