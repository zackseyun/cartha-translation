id: REV.3.15
reference: Revelation 3:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Οἶδά σου τὰ ἔργα, ὅτι οὔτε ψυχρὸς εἶ οὔτε ζεστός. ὄφελον ψυχρὸς ἦς ἢ ζεστός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/015.yaml
  text: 'I know your works: you are neither cold nor hot[a]. I wish that you were cold or hot.'
translation:
  language: id
  text: 'Aku tahu perbuatanmu: engkau tidak dingin maupun panas. Alangkah baiknya jika engkau dingin atau panas!'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἶδά
  choice: Aku tahu
  rationale: οἶδα berfungsi dengan makna kini yang statif. “Aku tahu” alami dalam bahasa Indonesia dan mempertahankan nada penilaian yang langsung.
- source_word: σου τὰ ἔργα
  choice: segala perbuatanmu
  rationale: “Perbuatan” mempertahankan bobot moral ἔργα dalam rumusan penilaian di kitab Wahyu; “segala” menyampaikan nilai kolektif artikel dan bentuk jamak secara wajar.
- source_word: ψυχρὸς
  choice: dingin
  rationale: Terjemahan harfiah mempertahankan metafora suhu dan kontrasnya dengan ζεστός tanpa menafsirkannya.
- source_word: ζεστός
  choice: panas
  rationale: “Panas” merupakan padanan alami dalam kontras suhu dengan “dingin” dan tidak memasukkan tafsiran seperti “bersemangat”.
- source_word: ὄφελον
  choice: Sekiranya ...!
  rationale: ὄφελον menyatakan keinginan yang tidak sesuai dengan keadaan sekarang. Bentuk seruan “Sekiranya ...!” menyampaikan hasrat kuat secara ringkas dan bermartabat.
- source_word: ἢ
  choice: atau
  rationale: Kata ini menyatakan pilihan antara dua keadaan; “atau” adalah padanan Indonesia yang langsung dan alami.
theological_decisions:
- issue: Makna metafora suhu “dingin” dan “panas”
  choice: Mempertahankan metafora harfiah tanpa menjelaskan makna rohaninya dalam teks.
  alternative: Menafsirkan “dingin” sebagai tidak percaya atau tidak peduli dan “panas” sebagai bersemangat secara rohani; atau menafsirkan keduanya sebagai suhu yang sama-sama bermanfaat.
  rationale: Ayat ini tidak menguraikan sendiri arti kedua suhu itu. Terjemahan literal menjaga ambiguitas dan ketegangan teologis sumber tanpa mengimpor skema tafsir tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Pronomina “Aku/engkau” mempertahankan ujaran langsung tunggal. Seruan pada kalimat kedua mencerminkan daya desideratif ὄφελον.
