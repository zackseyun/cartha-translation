- from: 'Aku tahu segala perbuatanmu: engkau tidak dingin dan tidak panas. Sekiranya engkau dingin atau panas!'
  to: 'Aku tahu perbuatanmu: engkau tidak dingin maupun panas. Alangkah baiknya jika engkau dingin atau panas!'
  rationale: The revision removes the potentially exhaustive addition 'segala,' makes the double negation more natural in modern standard Indonesian, and uses an idiomatic exclamatory construction for the desiderative ὄφελον. It retains the literal cold/hot metaphor and does not resolve its disputed significance.
