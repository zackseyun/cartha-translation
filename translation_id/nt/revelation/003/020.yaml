id: REV.3.20
reference: Revelation 3:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἰδοὺ ἕστηκα ἐπὶ τὴν θύραν καὶ κρούω· ἐάν τις ἀκούσῃ τῆς φωνῆς μου καὶ ἀνοίξῃ τὴν θύραν, ⸀καὶ εἰσελεύσομαι πρὸς αὐτὸν καὶ δειπνήσω μετ’ αὐτοῦ καὶ αὐτὸς μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/020.yaml
  text: Look[a], I stand at the door and knock. If anyone hears my voice and opens the door, I will come in to him and dine with him[c][b], and he with me.
translation:
  language: id
  text: Lihatlah[a], Aku berdiri di depan pintu dan mengetuk. Jika seseorang mendengar suara-Ku dan membuka pintu, Aku akan masuk menemuinya[b] dan makan bersamanya[c], dan dia akan makan bersama-Ku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sesungguhnya, Aku telah berdiri di depan pintu dan sedang mengetuk.” Kata kerja Yunani pertama berbentuk perfektum dengan daya kini, sedangkan kata kerja kedua berbentuk kini; keduanya menekankan posisi dan tindakan yang terus berlangsung.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “Aku akan masuk kepadanya.” Susunan Yunani menekankan arah personal, bukan sekadar masuk ke suatu tempat.
    reason: lexical_alternative
  - marker: c
    text: Gambaran makan bersama menyatakan persekutuan yang akrab dan timbal balik. Ada yang memahaminya sebagai kiasan khusus tentang Perjamuan Tuhan, pertobatan, atau pemulihan persekutuan; teks ini sendiri tidak menentukannya secara eksplisit.
    reason: theological_ambiguity
lexical_decisions:
- source_word: ἰδοὺ
  choice: Lihatlah
  rationale: Partikel penarik perhatian ini diterjemahkan dengan seruan Indonesia yang alami dan bermartabat, serta mempertahankan kesegeraan pernyataan.
- source_word: ἕστηκα
  choice: Aku berdiri
  rationale: 'Bentuk perfektum ἵστημι memiliki daya statif kini: pembicara berada dalam posisi berdiri, bukan sekadar pernah berdiri pada masa lalu.'
- source_word: ἐπὶ τὴν θύραν
  choice: di depan pintu
  rationale: Ungkapan ini secara idiomatis menunjukkan posisi pada sisi luar sebuah pintu; 'di depan pintu' lebih alami dalam bahasa Indonesia daripada terjemahan harfiah 'di atas pintu'.
- source_word: κρούω
  choice: mengetuk
  rationale: Bentuk kini menggambarkan tindakan yang sedang berlangsung; dalam koordinasi dengan 'Aku berdiri', bentuk Indonesia ini menyampaikan adegan tersebut secara alami.
- source_word: ἐάν τις
  choice: Jika seseorang
  rationale: τις bersifat tak tentu dan inklusif. 'Seseorang' mempertahankan undangan terbuka tanpa memasukkan pembatasan gender.
- source_word: ἀκούσῃ τῆς φωνῆς μου
  choice: mendengar suara-Ku
  rationale: φωνή di sini berarti suara. Terjemahan langsung ini tidak menambahkan gagasan ketaatan yang mungkin tersirat, tetapi tidak dinyatakan secara eksplisit oleh verba tersebut.
- source_word: ἀνοίξῃ τὴν θύραν
  choice: membuka pintu
  rationale: Terjemahan langsung dan alami dari tindakan dalam klausa bersyarat.
- source_word: καὶ εἰσελεύσομαι πρὸς αὐτόν
  choice: Aku akan masuk menemuinya
  rationale: εἰσελεύσομαι menyatakan masuk, sedangkan πρὸς αὐτόν memberi arah personal. 'Menemuinya' mempertahankan unsur relasional dan menghindari kesan bahwa frasa Yunani hanya menunjuk masuk ke suatu bangunan.
- source_word: δειπνήσω
  choice: makan
  rationale: δειπνέω menunjuk makan hidangan utama, sering kali pada petang hari. 'Makan' paling alami dalam bahasa Indonesia; unsur persekutuan meja dipertahankan oleh 'bersamanya' dan dijelaskan dalam catatan.
- source_word: μετ’ αὐτοῦ καὶ αὐτὸς μετ’ ἐμοῦ
  choice: bersamanya, dan dia bersama-Ku
  rationale: Klausa kedua bersifat eliptis dan menekankan timbal balik. Mempertahankan elipsis menghindari penambahan yang tidak diperlukan sekaligus menjaga penekanan pada kebersamaan dua arah.
theological_decisions:
- issue: Makna metaforis perjamuan bersama
  choice: Gambaran makan bersama dipertahankan sebagai persekutuan pribadi yang timbal balik tanpa menentukan rujukan doktrinal tertentu.
  alternative: Menafsirkannya secara khusus sebagai Perjamuan Tuhan, pertobatan awal, atau pemulihan persekutuan dengan orang percaya maupun jemaat.
  rationale: Ayat ini jelas menggambarkan kedekatan dan persekutuan timbal balik, tetapi teks tidak secara eksplisit membatasi gambaran itu pada salah satu penafsiran tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan ilahi yang mengikuti konvensi kapitalisasi Indonesia. Diksi dibuat alami dan bermartabat. 'Lihatlah' mempertahankan seruan pembuka; 'di depan pintu' merupakan idiom lokasi yang wajar; dan elipsis pada penutup dipertahankan untuk menjaga penekanan timbal balik teks Yunani.
