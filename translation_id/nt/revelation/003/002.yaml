id: REV.3.2
reference: Revelation 3:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: γίνου γρηγορῶν, καὶ στήρισον τὰ λοιπὰ ἃ ⸂ἔμελλον ἀποθανεῖν⸃, οὐ γὰρ εὕρηκά σου ⸀τὰ ἔργα πεπληρωμένα ἐνώπιον τοῦ θεοῦ μου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/002.yaml
  text: Wake up, and strengthen what remains, which was about to die, for I have not found your works completed in the sight of my God.
translation:
  language: id
  text: Bangunlah dan kuatkanlah apa yang masih tersisa, yang hampir mati, sebab Aku mendapati bahwa perbuatan-perbuatanmu belum selesai di hadapan Allah-Ku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γίνου γρηγορῶν
  choice: Bangunlah
  rationale: Secara harfiah ungkapan ini berarti terus menjadi waspada atau berjaga. Dalam konteks teguran kepada jemaat yang disebut hidup tetapi sebenarnya mati (ayat 1), 'Bangunlah' menyampaikan seruan metaforis itu secara alami dan kuat dalam bahasa Indonesia.
- source_word: στήρισον
  choice: kuatkanlah
  rationale: Menyampaikan makna meneguhkan atau membuat kokoh apa yang masih bertahan.
- source_word: τὰ λοιπὰ
  choice: apa yang masih tersisa
  rationale: Bentuk netral jamak dapat menunjuk secara umum kepada hal-hal yang tersisa; terjemahan ini tidak mempersempit rujukannya.
- source_word: ἔμελλον ἀποθανεῖν
  choice: yang hampir mati
  rationale: Ungkapan μέλλω dengan infinitif menunjukkan keadaan yang berada di ambang kematian; 'hampir mati' alami dalam bahasa Indonesia tanpa menghapus nuansa ancaman yang segera.
- source_word: οὐ ... εὕρηκά ... πεπληρωμένα
  choice: Aku mendapati ... belum selesai
  rationale: Perfect εὕρηκα menyatakan penilaian yang telah dicapai, sedangkan bentuk negatif bersama πεπληρωμένα menunjukkan bahwa pekerjaan mereka tidak didapati telah dituntaskan atau dipenuhi.
- source_word: τὰ ἔργα
  choice: perbuatan-perbuatanmu
  rationale: '''Perbuatan'' merupakan padanan umum bagi ἔργα dalam konteks penilaian moral dan rohani; bentuk ulang mempertahankan nuansa jamak.'
- source_word: ἐνώπιον τοῦ θεοῦ μου
  choice: di hadapan Allah-Ku
  rationale: Mempertahankan gambaran evaluasi di hadapan Allah serta bentuk posesif 'Allah-Ku' dari teks sumber.
theological_decisions:
- issue: Apakah πεπληρωμένα berarti 'sempurna', 'lengkap', atau 'selesai'
  choice: belum selesai
  alternative: tidak sempurna / belum lengkap
  rationale: Partisipel perfect pasif dari πληρόω secara dasar berarti telah dipenuhi atau diselesaikan. 'Belum selesai' mempertahankan gagasan bahwa perbuatan mereka belum mencapai kepenuhan yang dituntut tanpa memasukkan konsep kesempurnaan tanpa dosa.
- issue: Rujukan 'apa yang masih tersisa'
  choice: Dibiarkan umum
  alternative: orang-orang yang tersisa / perbuatan yang tersisa
  rationale: τὰ λοιπὰ berbentuk netral dan teks tidak secara tegas menentukan apakah yang dimaksud ialah unsur kehidupan jemaat, perbuatan, atau orang. Terjemahan tidak menutup ambiguitas itu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Imperatif dibuat tegas sesuai nada teguran. Kapitalisasi pada 'Aku' dan 'Allah-Ku' mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia untuk perkataan Kristus dan rujukan ilahi.
