  source_fidelity: 'Terjemahan mempertahankan semua unsur utama teks Yunani: seruan untuk terjaga, perintah untuk menguatkan yang tersisa, keadaan yang nyaris mati, penilaian negatif atas perbuatan, dan frasa relasional “di hadapan Allah-Ku.” “Bangunlah” merupakan pengungkapan metaforis yang wajar untuk γίνου γρηγορῶν dalam konteks ini, tanpa mengubah daya imperatifnya. “Yang hampir mati” secara memadai menyampaikan ἔμελλον ἀποθανεῖν, yakni keadaan yang berada di ambang kematian.'
  naturalness: Bahasa Indonesia modern, jelas, dan bernada teguran yang bermartabat. Susunan kalimat mengalir dengan baik. “Apa yang masih tersisa” mempertahankan keluasan rujukan netral τὰ λοιπά, dan “perbuatan-perbuatanmu belum selesai” dapat dipahami secara alami sebagai pekerjaan yang belum mencapai penyelesaiannya.
