revisions:
- from: Karena kamu telah menaati firman tentang ketekunan-Ku[a], Aku pun akan menjaga kamu dari masa pengujian[b] yang akan segera datang ke atas seluruh dunia yang berpenghuni untuk menguji mereka yang tinggal di bumi.
  to: Karena kamu telah memegang teguh firman-Ku tentang ketekunan[a], Aku juga akan menjaga kamu dari masa pengujian[b] yang akan datang atas seluruh dunia untuk menguji mereka yang tinggal di bumi.
  rationale: Revisi memakai “firman-Ku tentang ketekunan” sebagai ungkapan Indonesia yang wajar, kemudian mencatat pembacaan yang mengaitkan ketekunan itu langsung dengan Kristus serta pembacaan yang memahami firman itu sebagai panggilan untuk bertekun. “Memegang teguh” mencerminkan τηρέω dengan baik dalam hubungan dengan λόγος. “Yang akan datang” menghindari penajaman waktu yang tidak diperlukan, dan susunan untuk οἰκουμένη dibuat lebih idiomatis tanpa mengubah cakupan universal yang dimaksud.
