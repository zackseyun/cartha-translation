  verdict: revise
  source_fidelity: Revisi diperlukan. Draf utama menafsirkan τῆς ὑπομονῆς μου secara terlalu khusus sebagai ketekunan Kristus melalui “firman tentang ketekunan-Ku”, padahal genitif Yunani itu terbuka bagi beberapa hubungan makna. “Segera” juga memberi tekanan imminensi yang tidak perlu dipastikan oleh μέλλω dalam konteks ini.
  naturalness: Bahasa draf pada umumnya baku, tetapi “datang ke atas seluruh dunia yang berpenghuni” terasa kurang idiomatis. “Datang atas seluruh dunia” lebih lancar dalam bahasa Indonesia modern.
  terminology: “Pengujian,” “menjaga ... dari,” dan “mereka yang tinggal di bumi” setia pada istilah dan gaya Wahyu. “Memegang teguh firman” lebih dekat dengan τηρέω dalam konteks ini daripada “menaati firman,” sambil tetap alami.
  issues:
  - severity: medium
    issue: Frasa “firman tentang ketekunan-Ku” memilih salah satu pembacaan genitif.
    rationale: Frasa itu secara khusus menyatakan bahwa firman tersebut mengenai ketekunan Yesus. τὸν λόγον τῆς ὑπομονῆς μου juga dapat berarti firman Kristus yang menyerukan ketekunan atau firman yang berciri ketekunan. Teks utama dan catatan perlu menahan ketegangan ini sejauh mungkin dalam bahasa Indonesia.
  - severity: low
    issue: Kata “segera” terlalu menajamkan τῆς μελλούσης ἔρχεσθαι.
    rationale: μέλλω menyatakan futuritas yang akan datang dan dapat bernuansa dekat, tetapi “segera” dapat terdengar sebagai klaim kronologis yang lebih kuat. “Yang akan datang” memadai dan tidak mengurangi makna pokok.
  - severity: low
    issue: “Ke atas seluruh dunia yang berpenghuni” kurang alami.
    rationale: Susunan tersebut terasa kaku. “Atas seluruh dunia” adalah padanan idiomatis bagi ἐπὶ τῆς οἰκουμένης ὅλης; nuansa οἰκουμένη dapat dijelaskan dalam catatan tanpa membebani teks utama.
