id: REV.3.10
reference: Revelation 3:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι ἐτήρησας τὸν λόγον τῆς ὑπομονῆς μου, κἀγώ σε τηρήσω ἐκ τῆς ὥρας τοῦ πειρασμοῦ τῆς μελλούσης ἔρχεσθαι ἐπὶ τῆς οἰκουμένης ὅλης, πειράσαι τοὺς κατοικοῦντας ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/010.yaml
  text: Because you have kept my word of endurance[a], I also will keep you from the hour of testing that is about to come upon the whole inhabited world[b], to test those who dwell on the earth.
translation:
  language: id
  text: Karena kamu telah memegang teguh firman-Ku tentang ketekunan[a], Aku juga akan menjaga kamu dari masa pengujian[b] yang akan datang atas seluruh dunia untuk menguji mereka yang tinggal di bumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “firman tentang ketekunan-Ku” atau “firman-Ku yang menyerukan ketekunan.” Frasa Yunani ini dapat dipahami dalam beberapa cara yang berkaitan erat.
    reason: lexical_alternative
  - marker: b
    text: Atau “Aku akan memelihara kamu sepanjang masa pengujian” atau “Aku akan menjaga kamu tetap di luar masa pengujian.” Bahasa Yunani memakai ungkapan “menjaga ... dari” dan tidak dengan sendirinya menentukan bagaimana perlindungan itu berlangsung.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐτήρησας
  choice: telah menaati
  rationale: Dalam kaitannya dengan λόγον, 'menaati firman' merupakan ungkapan Indonesia yang alami untuk memelihara atau menuruti pesan; aspek aoristus dinyatakan dengan 'telah'. Hubungan dengan τηρήσω tetap tampak secara makna, meski bahasa Indonesia memerlukan verba yang berbeda menurut objeknya.
- source_word: τὸν λόγον τῆς ὑπομονῆς μου
  choice: firman tentang ketekunan-Ku
  rationale: Ungkapan ini dapat menunjuk pada firman mengenai ketekunan Yesus, firman yang bercirikan ketekunan, atau pesan-Nya yang menyerukan ketekunan. Pilihan utama cukup alami dalam bahasa Indonesia, sementara alternatif dicatat untuk mempertahankan keluasan genitif Yunani.
- source_word: κἀγώ
  choice: Aku pun
  rationale: '''Pun'' menyampaikan hubungan timbal balik yang ditekankan: karena jemaat menaati, Yesus pun akan menjaga.'
- source_word: τηρήσω ἐκ
  choice: akan menjaga kamu dari
  rationale: Ini merupakan padanan langsung dan wajar yang tidak menetapkan apakah perlindungan itu berupa pengecualian, pengeluaran, atau pemeliharaan selama masa tersebut.
- source_word: ὥρας
  choice: masa
  rationale: ὥρα secara harfiah berarti 'jam', tetapi di sini menunjuk pada suatu kurun atau waktu yang ditetapkan. 'Masa' lebih alami dalam bahasa Indonesia dan tidak menyiratkan durasi enam puluh menit.
- source_word: πειρασμοῦ
  choice: pengujian
  rationale: Konteks global dan infinitif πειράσαι mendukung arti pengujian; pilihan ini lebih luas dan kurang menyesatkan daripada 'pencobaan', yang dapat menyiratkan godaan moral.
- source_word: τῆς μελλούσης ἔρχεσθαι
  choice: yang akan segera datang
  rationale: Menyampaikan daya prospektif μέλλω dan kemungkinan nuansa kedekatan waktunya tanpa menambahkan kepastian kronologis yang lebih terperinci.
- source_word: ἐπὶ τῆς οἰκουμένης ὅλης
  choice: ke atas seluruh dunia yang berpenghuni
  rationale: οἰκουμένη menunjuk pada dunia atau bumi yang dihuni. Ungkapan ini mempertahankan nuansa tersebut, bukan memperluasnya menjadi seluruh kosmos.
- source_word: πειράσαι
  choice: untuk menguji
  rationale: Infinitif menyatakan tujuan atau hasil dari datangnya masa pengujian dan menjaga kaitan leksikal dengan πειρασμοῦ.
- source_word: τοὺς κατοικοῦντας ἐπὶ τῆς γῆς
  choice: mereka yang tinggal di bumi
  rationale: Mempertahankan bentuk verbal ungkapan khas yang berulang dalam kitab Wahyu, alih-alih memadatkannya menjadi 'penduduk bumi'.
theological_decisions:
- issue: Makna τηρήσω ἐκ dalam konteks eskatologis
  choice: akan menjaga kamu dari
  alternative: akan memelihara kamu sepanjang masa pengujian; akan menjaga kamu agar tetap di luar masa pengujian
  rationale: Padanan utama mengikuti susunan Yunani tanpa memutuskan apakah janji itu berarti dikeluarkan sebelum pengujian, dilindungi selama pengujian, atau dibebaskan dari dampaknya.
- issue: Makna genitif dalam τὸν λόγον τῆς ὑπομονῆς μου
  choice: firman tentang ketekunan-Ku
  alternative: firman-Ku yang menyerukan ketekunan; firman ketekunan-Ku
  rationale: Genitif Yunani memungkinkan beberapa hubungan makna yang berdekatan. Catatan kaki mempertahankan kemungkinan lain dan menghindari penetapan satu tafsiran teologis secara mutlak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan jelas. Huruf kapital pada kata ganti yang merujuk kepada Yesus mengikuti kebiasaan luas penerbitan Alkitab Indonesia. 'Masa' dipilih daripada 'jam' demi makna idiomatis, sedangkan 'dunia yang berpenghuni' mempertahankan nuansa οἰκουμένη.
