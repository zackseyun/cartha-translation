  yaml_path: translation/nt/revelation/003/022.yaml
  text: The one who has an ear[b][a], let him hear what the Spirit says to the churches.
translation:
  language: id
  text: Siapa yang mempunyai telinga, hendaklah ia mendengarkan apa yang Roh katakan kepada jemaat-jemaat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Yunani: πνεῦμα (“roh”); dalam konteks ini, yang dimaksud dipahami sebagai Roh Kudus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Siapa yang mempunyai
  rationale: Artikel dengan partisipel kini berfungsi sebagai nomina dan menunjuk secara umum kepada siapa pun yang memenuhi syarat itu. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan bentuk tunggal representatif.
- source_word: οὖς
  choice: telinga
  rationale: Nomina Yunani berbentuk tunggal. Bentuk tunggal dipertahankan karena merupakan bagian dari seruan idiomatis untuk menyimak dengan sungguh-sungguh.
- source_word: ἀκουσάτω
  choice: hendaklah ia mendengarkan
  rationale: Imperatif aoris aktif orang ketiga tunggal menyatakan seruan atau perintah. 'Hendaklah' mempertahankan daya imperatif, sedangkan 'mendengarkan' lebih tepat daripada sekadar 'mendengar' karena konteksnya menuntut perhatian dan tanggapan.
- source_word: τί
  choice: apa yang
  rationale: Memperkenalkan isi perkataan yang harus didengarkan dan merupakan padanan Indonesia yang alami.
- source_word: τὸ πνεῦμα
  choice: Roh
  rationale: Dalam rumusan berulang Wahyu 2–3, rujukannya dipahami sebagai Roh Kudus. Huruf kapital menandai rujukan tersebut tanpa menambahkan kata 'Kudus' yang tidak tertulis dalam ayat ini.
- source_word: λέγει
  choice: dikatakan
  rationale: Bentuk kini menyatakan perkataan Roh. Konstruksi pasif Indonesia 'apa yang dikatakan Roh' alami dan tetap menjadikan Roh sebagai pelaku.
- source_word: ταῖς ἐκκλησίαις
  choice: kepada jemaat-jemaat
  rationale: Dativus menandai para penerima pesan. 'Jemaat-jemaat' sesuai dengan komunitas-komunitas lokal yang disapa dalam Wahyu 2–3 dan mempertahankan bentuk jamak.
theological_decisions:
- issue: Ungkapan tunggal representatif dalam seruan
  choice: Siapa yang mempunyai telinga, hendaklah ia mendengarkan
  alternative: Barang siapa bertelinga, hendaklah ia mendengar
  rationale: Bahasa Yunani memakai bentuk tunggal representatif, tetapi tidak perlu dibuat maskulin dalam bahasa Indonesia karena pronomina 'ia' tidak menandai gender. Terjemahan ini mencakup setiap pendengar tanpa mengubah jumlah gramatikal.
- issue: Rujukan πνεῦμα
  choice: Roh
  alternative: roh
  rationale: Konteks rumusan berulang kepada jemaat-jemaat mengidentifikasi pembicara sebagai Roh Kudus. Kapitalisasi menyatakan rujukan kontekstual itu, sementara catatan kaki mempertahankan informasi bahwa teks Yunani sendiri tidak membedakan huruf kapital.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Mempunyai telinga' mempertahankan citra konkret teks sumber; 'hendaklah ia mendengarkan' menyampaikan daya imperatif secara jelas. Bentuk 'jemaat-jemaat' dipakai untuk menandai sejumlah komunitas lokal.
