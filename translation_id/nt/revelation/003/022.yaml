  - severity: low
    issue: 'Catatan kaki menyatakan “Yunani: ‘roh’” tanpa menyebut bentuk kata sumber.'
    rationale: Penyebutan πνεῦμα dan gloss “roh” lebih presisi secara filologis, sekaligus menjelaskan bahwa kapitalisasi “Roh” adalah keputusan berdasarkan konteks, bukan ciri ortografis naskah Yunani kuno.
