id: REV.3.12
reference: Revelation 3:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ νικῶν ποιήσω αὐτὸν στῦλον ἐν τῷ ναῷ τοῦ θεοῦ μου, καὶ ἔξω οὐ μὴ ἐξέλθῃ ἔτι, καὶ γράψω ἐπ’ αὐτὸν τὸ ὄνομα τοῦ θεοῦ μου καὶ τὸ ὄνομα τῆς πόλεως τοῦ θεοῦ μου, τῆς καινῆς Ἰερουσαλήμ, ἡ ⸀καταβαίνουσα ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ μου, καὶ τὸ ὄνομά μου τὸ καινόν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/012.yaml
  text: The one who conquers—I will make him a pillar in the temple of my God[a], and he will never go out from it anymore. And I will write on him the name of my God, and the name of the city of my God, the new Jerusalem, which comes down out of heaven from my God[c][b], and my own new name.
translation:
  language: id
  text: Orang yang menang[a] akan Kujadikan tiang di dalam bait Allah-Ku, dan ia tidak akan pernah keluar lagi[b]. Pada dirinya akan Kutuliskan nama Allah-Ku, nama kota Allah-Ku, yaitu Yerusalem yang baru, yang turun dari surga, dari Allah-Ku, dan nama-Ku sendiri yang baru[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Orang yang memperoleh kemenangan.” Kata kerja Yunani ini berulang kali dipakai dalam kitab Wahyu untuk kemenangan melalui kesetiaan.
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Yunaninya memakai penyangkalan yang sangat tegas: ia tidak akan pernah keluar lagi.'
    reason: lexical_alternative
  - marker: c
    text: Atau “nama-Ku yang baru.” Susunan bahasa Yunani memberi penekanan pada nama itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: Orang yang menang
  rationale: Partisipel kini substantival ini menunjuk secara representatif kepada orang yang terus menang; pilihan ini juga mempertahankan motif νικάω yang berulang dalam Wahyu.
- source_word: ποιήσω αὐτὸν στῦλον
  choice: akan Kujadikan tiang
  rationale: Mempertahankan gambaran arsitektural tentang ketetapan dan kehormatan, dengan susunan Indonesia yang alami bagi konstruksi 'menjadikan seseorang sesuatu'.
- source_word: ἐν τῷ ναῷ τοῦ θεοῦ μου
  choice: di dalam bait Allah-Ku
  rationale: ναός menunjuk pada bait atau tempat kudus, bukan seluruh kompleks pelatarannya; 'bait Allah-Ku' jelas, ringkas, dan mempertahankan ungkapan sumber.
- source_word: ἔξω οὐ μὴ ἐξέλθῃ ἔτι
  choice: ia tidak akan pernah keluar lagi
  rationale: Ungkapan 'tidak akan pernah ... lagi' menyampaikan negasi Yunani yang sangat tegas serta sifat akhirnya; objek asal keluarnya dibiarkan tersirat sebagaimana dalam teks Yunani.
- source_word: γράψω ἐπ’ αὐτὸν
  choice: Pada dirinya akan Kutuliskan
  rationale: Menyampaikan tindakan menulis atau menorehkan pada orang tersebut tanpa mempersempit gambaran menjadi satu teknik penandaan tertentu.
- source_word: τὸ ὄνομα τῆς πόλεως τοῦ θεοῦ μου, τῆς καινῆς Ἰερουσαλήμ
  choice: nama kota Allah-Ku, yaitu Yerusalem yang baru
  rationale: Aposisi dibuat jelas dengan 'yaitu', sedangkan 'yang baru' mempertahankan fungsi adjektival καινῆς.
- source_word: ἡ καταβαίνουσα ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ μου
  choice: yang turun dari surga, dari Allah-Ku
  rationale: 'Kedua frasa sumber dipertahankan secara terpisah: kota itu turun dari surga dan berasal dari Allah-Ku.'
- source_word: τὸ ὄνομά μου τὸ καινόν
  choice: nama-Ku sendiri yang baru
  rationale: '''Sendiri'' mencerminkan penekanan struktur Yunani tanpa berspekulasi tentang isi nama tersebut.'
theological_decisions:
- issue: Bentuk tunggal maskulin dalam rumus janji
  choice: Gunakan 'orang' dan kata ganti tunggal 'ia'
  alternative: Gunakan bentuk jamak 'mereka' atau ulangi 'orang itu'
  rationale: Bahasa Indonesia tidak menandai gender pada 'orang' atau 'ia'; bentuk tunggal representatif Yunani tetap dipertahankan tanpa menambahkan gender yang tidak perlu bagi tata bahasa sasaran.
- issue: Pengulangan ungkapan 'Allah-Ku' dalam ucapan Yesus yang dimuliakan
  choice: Pertahankan keempat kemunculan 'Allah-Ku'
  alternative: Kurangi pengulangan demi kelancaran gaya
  rationale: Pengulangan itu eksplisit dan bermakna secara teologis; terjemahan tidak boleh meredakan ketegangan kristologis teks.
- issue: Frasa nama terakhir
  choice: nama-Ku sendiri yang baru
  alternative: nama-Ku yang baru
  rationale: Pilihan utama mencerminkan penekanan τὸ ὄνομά μου τὸ καινόν sambil membiarkan identitas nama itu tetap menjadi misteri teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Repetisi 'Allah-Ku' dan citra 'tiang' dipertahankan; susunan kalimat disesuaikan secukupnya agar alami.
