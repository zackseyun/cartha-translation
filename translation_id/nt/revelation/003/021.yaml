source:
  edition: SBLGNT
  text: ὁ νικῶν δώσω αὐτῷ καθίσαι μετ’ ἐμοῦ ἐν τῷ θρόνῳ μου, ὡς κἀγὼ ἐνίκησα καὶ ἐκάθισα μετὰ τοῦ πατρός μου ἐν τῷ θρόνῳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/021.yaml
  text: The one who conquers—I will grant him to sit with me on my throne[b][a], just as I also conquered and sat down with my Father on his throne.
translation:
  language: id
  text: Orang yang menang[a] akan Kuberikan kepadanya[b] hak untuk duduk bersama-Ku di takhta-Ku, sama seperti Aku pun telah menang dan telah duduk bersama Bapa-Ku di takhta-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Orang yang mengatasi.” Kata kerja Yunani yang sama dipakai dua kali dalam ayat ini; “menang” dipilih untuk mempertahankan motif kemenangan secara konsisten.
    reason: lexical_alternative
  - marker: b
    text: 'Bentuk Yunani di sini adalah maskulin tunggal, tetapi dipakai secara representatif: janji ini berlaku bagi setiap orang yang menang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: Orang yang menang
  rationale: Partisipel kini yang berfungsi sebagai nomina menunjuk secara representatif kepada setiap orang yang menang. Pilihan “menang” mempertahankan motif kemenangan dan kaitan leksikal dengan ἐνίκησα dalam ayat yang sama.
- source_word: δώσω αὐτῷ καθίσαι
  choice: akan Kuberikan kepadanya hak untuk duduk
  rationale: Konstruksi δίδωμι dengan infinitif menyatakan pemberian hak atau kehormatan untuk melakukan sesuatu. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan penerima tunggal yang dinyatakan oleh αὐτῷ.
- source_word: μετ’ ἐμοῦ
  choice: bersama-Ku
  rationale: Menyatakan kebersamaan atau persekutuan dengan pembicara secara langsung.
- source_word: ἐν τῷ θρόνῳ μου
  choice: di takhta-Ku
  rationale: Preposisi ἐν dalam konteks penobatan dinyatakan dengan idiom Indonesia “di takhta”, tanpa mempertahankan bentuk harfiah yang kaku.
- source_word: ὡς κἀγὼ
  choice: sama seperti Aku pun
  rationale: Mempertahankan daya perbandingan ὡς serta unsur penambahan καί dalam κἀγώ.
- source_word: ἐνίκησα
  choice: telah menang
  rationale: Menggunakan akar terjemahan yang sama dengan νικῶν untuk menjaga pengulangan dan motif kemenangan.
- source_word: ἐκάθισα
  choice: duduk
  rationale: Menyatakan tindakan naik dan mengambil tempat di takhta dalam rangkaian peristiwa lampau; unsur penyelesaian sudah didukung oleh “telah” pada predikat sebelumnya.
- source_word: μετὰ τοῦ πατρός μου
  choice: bersama Bapa-Ku
  rationale: Terjemahan langsung yang mempertahankan hubungan kebersamaan dan relasi Sang Anak dengan Bapa.
- source_word: ἐν τῷ θρόνῳ αὐτοῦ
  choice: di takhta-Nya
  rationale: Mengikuti idiom penobatan dalam bahasa Indonesia dan mempertahankan kesejajaran dengan “di takhta-Ku”.
theological_decisions:
- issue: Bentuk tunggal maskulin yang mewakili semua orang yang menang
  choice: Memakai bentuk tunggal “orang” dan “kepadanya” dalam teks utama
  alternative: Menggunakan bentuk jamak atau mengulang “orang itu”
  rationale: Bahasa Yunani memakai partisipel dan kata ganti maskulin tunggal dengan daya representatif. Bahasa Indonesia dapat mempertahankan ketunggalannya tanpa mengesankan bahwa janji ini hanya berlaku bagi laki-laki.
- issue: Hubungan orang yang menang dengan takhta Kristus dan hubungan Kristus dengan takhta Bapa
  choice: Menerjemahkan kesejajaran itu secara langsung tanpa penjelasan tambahan
  alternative: Melunakkan gambaran duduk bersama sebagai sekadar simbol atau memasukkan uraian tentang perbedaan pribadi ke dalam teks
  rationale: Teks menyatakan kesejajaran yang kuat dalam partisipasi pada kemenangan dan pemerintahan, tetapi tetap membedakan Kristus, Bapa-Nya, dan orang yang menang. Terjemahan tidak seharusnya mempersempit atau memperluas pernyataan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi pada pronomina yang merujuk kepada Kristus dan Bapa mengikuti kebiasaan penulisan teks Alkitab berbahasa Indonesia. Susunan kalimat mempertahankan kesejajaran retoris antara kemenangan orang percaya dan kemenangan Kristus.
