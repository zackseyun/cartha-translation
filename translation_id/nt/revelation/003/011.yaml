id: REV.3.11
reference: Revelation 3:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἔρχομαι ταχύ· κράτει ὃ ἔχεις, ἵνα μηδεὶς λάβῃ τὸν στέφανόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/011.yaml
  text: I am coming soon[a]; hold fast what you have[b], so that no one may take your crown.
translation:
  language: id
  text: Aku akan segera datang.[a] Peganglah teguh apa yang ada padamu, supaya tidak seorang pun mengambil mahkotamu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Aku akan datang dengan cepat.” Kata keterangan Yunani dapat menekankan kedekatan waktu atau cepatnya tindakan.
    reason: alternative_reading
  - marker: b
    text: Kata Yunani ini menunjuk pada karangan atau mahkota kehormatan bagi pemenang, bukan secara khusus diadem kerajaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχομαι
  choice: Aku akan datang
  rationale: Bentuk kini ini memiliki daya futuristik dalam konteks dan menunjuk pada kedatangan yang akan terjadi; bentuk dengan “akan” paling alami dalam bahasa Indonesia modern.
- source_word: ταχύ
  choice: segera
  rationale: Adverbia ini dapat menekankan kedekatan waktu atau cepatnya tindakan. “Segera” secara alami menyampaikan kedekatan waktu, sementara kemungkinan “dengan cepat” dipertahankan dalam catatan kaki.
- source_word: κράτει
  choice: Peganglah teguh
  rationale: Imperatif κρατέω menuntut tindakan tetap berpegang atau mempertahankan dengan kukuh; ungkapan ini menjaga daya desakan nasihat tersebut.
- source_word: ὃ ἔχεις
  choice: apa yang ada padamu
  rationale: Terjemahan ini membiarkan objeknya tetap tidak disebutkan secara khusus sebagaimana dalam teks Yunani dan terdengar alami dalam konteks nasihat.
- source_word: ἵνα μηδεὶς λάβῃ
  choice: supaya tidak seorang pun mengambil
  rationale: “Supaya” mempertahankan hubungan tujuan/hasil yang hendak dicegah, sedangkan “tidak seorang pun mengambil” menyampaikan konstruksi negatif dengan subjunktif tanpa melebihkan kekuatan verba.
- source_word: στέφανόν
  choice: mahkotamu
  rationale: στέφανος adalah mahkota atau karangan kehormatan bagi pemenang, bukan khusus diadem kerajaan. “Mahkota” paling mudah dipahami, dengan nuansa khusus dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Nuansa ταχύ dalam janji kedatangan Kristus
  choice: segera
  alternative: dengan cepat
  rationale: Teks dapat menekankan kedekatan waktu ataupun cepatnya kedatangan ketika terjadi. Teks utama memakai “segera” sesuai konteks peringatan dan janji, tetapi ambiguitas aslinya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal “Aku” dan “-mu”, selaras dengan ujaran langsung Kristus kepada jemaat. Gaya ringkas, mendesak, dan bermartabat; ambiguitas ταχύ serta kekhususan στέφανος dijaga melalui catatan kaki.
