id: REV.3.4
reference: Revelation 3:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀλλὰ ⸂ἔχεις ὀλίγα⸃ ὀνόματα ἐν Σάρδεσιν ἃ οὐκ ἐμόλυναν τὰ ἱμάτια αὐτῶν, καὶ περιπατήσουσιν μετ’ ἐμοῦ ἐν λευκοῖς, ὅτι ἄξιοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/004.yaml
  text: But you have a few names in Sardis who have not soiled their garments[a], and they will walk with me in white[c][b], because they are worthy.
translation:
  language: id
  text: Tetapi, engkau mempunyai beberapa nama di Sardis[a] yang tidak menajiskan pakaian mereka[b]. Mereka akan berjalan bersama-Ku dengan pakaian putih[c], karena mereka layak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “beberapa orang.” Secara harfiah, bahasa Yunani mengatakan “beberapa nama.”
    reason: lexical_alternative
  - marker: b
    text: Atau “tidak mengotori pakaian mereka.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “dalam putih”; yang dimaksud kemungkinan besar ialah pakaian putih.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Namun
  rationale: Menandai pertentangan kuat dengan teguran sebelumnya, dengan ungkapan yang alami dalam bahasa Indonesia modern.
- source_word: ἔχεις ὀλίγα ὀνόματα
  choice: engkau mempunyai beberapa nama
  rationale: Mempertahankan metonimia Yunani yang mencolok, yaitu ‘nama’ untuk orang-orang tertentu, sambil memakai susunan yang tetap dapat dipahami.
- source_word: ἐν Σάρδεσιν
  choice: di Sardis
  rationale: Padanan lokatif yang wajar untuk nama kota tersebut.
- source_word: ἃ οὐκ ἐμόλυναν
  choice: yang tidak mengotori
  rationale: Mengungkapkan tindakan menodai atau mencemari dengan kata yang mudah dipahami dan selaras dengan gambaran pakaian.
- source_word: τὰ ἱμάτια αὐτῶν
  choice: pakaian mereka
  rationale: ἱμάτια menunjuk pada pakaian secara umum; ‘pakaian’ alami dan tidak mempersempit maknanya menjadi jubah.
- source_word: περιπατήσουσιν μετ’ ἐμοῦ
  choice: Mereka akan berjalan bersama-Ku
  rationale: Mempertahankan gambaran harfiah ‘berjalan’ sekaligus kemungkinan nuansa persekutuan dan pembenaran.
- source_word: ἐν λευκοῖς
  choice: dengan pakaian putih
  rationale: Bahasa Yunani secara ringkas berbunyi ‘dalam putih’; pakaian tersirat oleh konteks. Padanan ini membuat elipsis tersebut wajar dalam bahasa Indonesia tanpa mengubah gambarnya.
- source_word: ὅτι ἄξιοί εἰσιν
  choice: karena mereka layak
  rationale: Menyatakan alasan yang diberikan teks secara langsung tanpa melunakkan atau memperluas implikasi teologisnya.
theological_decisions:
- issue: Apakah ὀνόματα diterjemahkan secara idiomatis sebagai ‘orang’ atau dipertahankan sebagai ‘nama’
  choice: Mempertahankan ‘beberapa nama’ dalam teks utama
  alternative: beberapa orang
  rationale: Ungkapan harfiah ini kemungkinan disengaja dan menyoroti pribadi-pribadi yang dikenal secara tertentu di tengah jemaat Sardis; catatan kaki menjelaskan metonimianya.
- issue: Nuansa moral atau ritual dari μολύνω dalam gambaran pakaian
  choice: tidak mengotori pakaian mereka
  alternative: tidak menajiskan pakaian mereka
  rationale: ‘Mengotori’ mempertahankan metafora pakaian dengan bahasa yang jelas, sedangkan ‘menajiskan’ membawa nuansa ritual yang lebih kuat dan dicatat sebagai alternatif.
- issue: Apakah ἄξιοί εἰσιν perlu diperlunak untuk menghindari kesan jasa keselamatan
  choice: karena mereka layak
  alternative: karena mereka pantas
  rationale: Teks menyatakan kelayakan mereka secara langsung dalam konteks kesetiaan. Terjemahan tidak boleh memasukkan sistem soteriologis atau mengurangi ketegangan teologis yang ada.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Sapaan tunggal ‘engkau’ dipertahankan karena ditujukan langsung kepada jemaat di Sardis, dan kapitalisasi ‘-Ku’ mengikuti kebiasaan penulisan rujukan ilahi dalam Alkitab bahasa Indonesia.
