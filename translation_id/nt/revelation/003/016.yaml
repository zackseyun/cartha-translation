  text: οὕτως, ὅτι χλιαρὸς εἶ καὶ ⸀οὔτε ζεστὸς οὔτε ψυχρός, μέλλω σε ἐμέσαι ἐκ τοῦ στόματός μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/016.yaml
  text: So[a], because you are lukewarm, and neither hot nor cold, I am about to vomit you out of my mouth.
translation:
  language: id
  text: Jadi, karena kamu suam-suam kuku, tidak panas dan tidak juga dingin, Aku akan segera memuntahkanmu dari mulut-Ku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: Jadi
  rationale: Menandai akibat yang ditarik dari pernyataan sebelumnya dengan ungkapan Indonesia yang alami.
- source_word: ὅτι
  choice: karena
  rationale: Menyatakan alasan bagi penghakiman yang diumumkan.
- source_word: χλιαρός
  choice: suam-suam kuku
  rationale: Padanan Indonesia yang lazim untuk keadaan tidak panas dan tidak dingin serta mempertahankan gambaran suhu.
- source_word: οὔτε ζεστὸς οὔτε ψυχρός
  choice: tidak panas dan tidak juga dingin
  rationale: Mempertahankan kedua sisi kontras secara jelas dan alami tanpa menafsirkan metaforanya lebih jauh.
- source_word: μέλλω
  choice: Aku akan segera
  rationale: Mengungkapkan tindakan yang sudah dekat atau segera terjadi dalam bahasa Indonesia yang alami.
- source_word: ἐμέσαι
  choice: memuntahkan
  rationale: Menerjemahkan secara langsung verba yang berarti memuntahkan, tanpa melemahkan gambaran tajamnya menjadi sekadar meludahkan.
- source_word: ἐκ τοῦ στόματός μου
  choice: dari mulut-Ku
  rationale: Mempertahankan gambaran jasmani tentang pengeluaran dari mulut dengan susunan Indonesia yang wajar.
theological_decisions:
- issue: Kekuatan gambaran penghakiman dalam ἐμέσαι
  choice: Mempertahankan gambaran keras dengan “memuntahkan”.
  alternative: memuntahkan keluar; meludahkan
  rationale: Teks Yunani memakai gambaran penolakan yang sengaja mengejutkan; “meludahkan” akan melemahkan daya retoris dan teologisnya.
- issue: Daya temporal μέλλω
  choice: 'Menerjemahkannya sebagai tindakan yang segera terjadi: “Aku akan segera”.'
  alternative: Aku akan; Aku hendak
  rationale: Bentuk Yunani menyampaikan penghakiman yang mengancam dalam waktu dekat, bukan sekadar pernyataan umum atau niat tanpa unsur kedekatan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kapital pada kata ganti ilahi mengikuti konvensi ejaan Alkitab Indonesia. Ungkapan idiomatis “suam-suam kuku” dipertahankan karena paling mudah dipahami dan tepat bagi gambaran suhu.
