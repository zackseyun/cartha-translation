  text: ἐκ φυλῆς Ἰούδα δώδεκα χιλιάδες ⸀ἐσφραγισμένοι, ἐκ φυλῆς Ῥουβὴν δώδεκα χιλιάδες, ἐκ φυλῆς Γὰδ δώδεκα χιλιάδες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/005.yaml
  text: from the tribe of Judah[a], twelve thousand were sealed; from the tribe of Reuben, twelve thousand; from the tribe of Gad, twelve thousand.
translation:
  language: id
  text: dari suku Yehuda, dua belas ribu yang dimeteraikan; dari suku Ruben, dua belas ribu; dari suku Gad, dua belas ribu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ
  choice: dari
  rationale: Menandai asal atau sumber dan mempertahankan rumusan berulang dalam daftar.
- source_word: φυλῆς
  choice: suku
  rationale: Dalam konteks silsilah dan pembagian Israel, 'suku' adalah padanan baku dan alami.
- source_word: Ἰούδα
  choice: Yehuda
  rationale: Bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: δώδεκα χιλιάδες
  choice: dua belas ribu orang
  rationale: Bilangan diterjemahkan langsung; 'orang' ditambahkan secara wajar untuk memperjelas bahwa yang dihitung adalah manusia, tanpa mengubah jumlah.
- source_word: ἐσφραγισμένοι
  choice: telah dimeteraikan
  rationale: Partisip pasif ini menyatakan bahwa kelompok tersebut menerima tindakan pemeteraian; bentuk verbal eksplisit alami dalam bahasa Indonesia dan aspek perfektifnya sesuai dengan keadaan hasil.
- source_word: Ῥουβὴν
  choice: Ruben
  rationale: Bentuk nama suku yang lazim dalam Alkitab bahasa Indonesia.
- source_word: Γὰδ
  choice: Gad
  rationale: Bentuk nama suku yang lazim dalam Alkitab bahasa Indonesia.
theological_decisions:
- issue: Daya dan cakupan ἐσφραγισμένοι dalam daftar suku
  choice: Menerjemahkannya secara eksplisit sebagai 'telah dimeteraikan' pada unsur pertama dan mempertahankan elipsis pada unsur-unsur berikutnya.
  alternative: '''dua belas ribu orang yang dimeteraikan'', atau mengulangi ''telah dimeteraikan'' sesudah setiap suku.'
  rationale: Teks Yunani menempatkan partisip pasif sesudah jumlah pertama, tetapi konteks dan kesejajaran daftar membuatnya berlaku bagi kelompok-kelompok selanjutnya. Terjemahan tidak mengulangi unsur yang tidak diulangi oleh teks.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Struktur daftar serta pengulangan 'dari suku' dipertahankan; tanda titik koma memperjelas tiap unsur.
