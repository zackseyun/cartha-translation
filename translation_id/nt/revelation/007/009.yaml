id: REV.7.9
reference: Revelation 7:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον, καὶ ἰδοὺ ὄχλος πολύς, ὃν ἀριθμῆσαι ⸀αὐτὸν οὐδεὶς ἐδύνατο, ἐκ παντὸς ἔθνους καὶ φυλῶν καὶ λαῶν καὶ γλωσσῶν, ⸀ἑστῶτες ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τοῦ ἀρνίου, περιβεβλημένους στολὰς λευκάς, καὶ ⸀φοίνικες ἐν ταῖς χερσὶν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/009.yaml
  text: After these things I looked[a], and behold, a great multitude that no one was able to count, from every nation and tribe and people and language, standing before the throne and before the Lamb, clothed in white robes, with palm branches in their hands.
translation:
  language: id
  text: Sesudah itu aku melihat, dan lihatlah, sekumpulan besar orang yang tidak dapat dihitung oleh siapa pun, dari setiap bangsa, suku, kaum, dan bahasa,[a] berdiri di hadapan takhta dan di hadapan Anak Domba. Mereka mengenakan jubah putih dan memegang pelepah-pelepah palem di tangan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “dari setiap bangsa dan suku-suku dan kaum-kaum dan bahasa-bahasa.” Teks Yunani beralih dari bentuk tunggal “bangsa” ke bentuk jamak pada tiga istilah berikutnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Sesudah itu
  rationale: Ungkapan ini mempertahankan urutan penglihatan dan menyampaikan bentuk jamak Yunani secara wajar dalam bahasa Indonesia; 'sesudah hal-hal ini' terlalu kaku.
- source_word: εἶδον, καὶ ἰδοὺ
  choice: aku melihat, dan lihatlah
  rationale: '''Melihat'' adalah padanan langsung εἶδον, sedangkan ''lihatlah'' mempertahankan fungsi ἰδού sebagai penanda perhatian dalam gaya penglihatan apokaliptik.'
- source_word: ὄχλος πολύς
  choice: suatu kumpulan besar
  rationale: '''Kumpulan besar'' menyatakan himpunan manusia yang amat banyak dengan ragam bahasa yang bermartabat dan lebih luas daripada ''kerumunan''.'
- source_word: ὃν ἀριθμῆσαι αὐτὸν οὐδεὶς ἐδύνατο
  choice: yang tidak dapat dihitung oleh siapa pun
  rationale: Bentuk pasif Indonesia ini alami dan tetap mempertahankan penegasan bahwa tidak seorang pun sanggup menghitung kumpulan tersebut.
- source_word: ἐκ παντὸς ἔθνους καὶ φυλῶν καὶ λαῶν καὶ γλωσσῶν
  choice: berasal dari setiap bangsa, serta berbagai suku, kaum, dan bahasa
  rationale: '''Berasal dari'' menjelaskan hubungan ἐκ secara alami. ''Setiap bangsa'' mempertahankan bentuk tunggal distributif ἔθνους, sedangkan ''berbagai'' menandai bentuk jamak pada tiga kategori berikutnya tanpa menghasilkan susunan Indonesia yang janggal.'
- source_word: ἑστῶτες
  choice: berdiri
  rationale: Partisip ini diterjemahkan secara ringkas sebagai keterangan keadaan dan mempertahankan kehadiran langsung adegan tersebut.
- source_word: ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τοῦ ἀρνίου
  choice: di hadapan takhta dan di hadapan Anak Domba
  rationale: Pengulangan 'di hadapan' mengikuti pengulangan ἐνώπιον dan menjaga irama khidmat. Artikel Yunani pada 'takhta' tidak perlu selalu dinyatakan dengan 'itu' dalam bahasa Indonesia.
- source_word: περιβεβλημένους στολὰς λευκάς
  choice: Mereka mengenakan jubah putih
  rationale: Klausa baru memperjelas bahwa deskripsi ini merujuk kepada kumpulan tersebut. 'Jubah' sesuai dengan στολή, yaitu pakaian panjang, dan 'mengenakan' alami untuk περιβάλλω dalam konteks ini.
- source_word: φοίνικες ἐν ταῖς χερσὶν αὐτῶν
  choice: memegang daun-daun palem di tangan mereka
  rationale: φοίνικες dalam adegan ini menunjuk pada daun atau pelepah palem. 'Memegang' mengungkapkan secara alami keadaan benda-benda itu di tangan mereka tanpa menambahkan makna simbolis.
theological_decisions:
- issue: Penerjemahan ἀρνίον sebagai gelar kristologis
  choice: Anak Domba
  alternative: anak domba kecil
  rationale: Dalam kitab Wahyu, ἀρνίον berfungsi sebagai gelar kristologis yang tetap. 'Anak Domba' mempertahankan pengenalan dan bobot gelar itu tanpa memaksakan nuansa diminutif secara harfiah.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Susunan kalimat dipecah setelah 'Anak Domba' untuk menghindari rangkaian partisip yang berat, tetapi kesinambungan adegan tetap terjaga. Penanda catatan kaki [a] ditempatkan tepat setelah frasa yang dijelaskannya.
