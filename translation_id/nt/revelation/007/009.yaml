  to: Sesudah itu aku melihat, dan lihatlah, sekumpulan besar orang yang tidak dapat dihitung oleh siapa pun, dari setiap bangsa, suku, kaum, dan bahasa,[a] berdiri di hadapan takhta dan di hadapan Anak Domba. Mereka mengenakan jubah putih dan memegang pelepah-pelepah palem di tangan mereka.
