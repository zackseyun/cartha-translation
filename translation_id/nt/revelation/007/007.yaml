  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐκ φυλῆς Συμεὼν δώδεκα χιλιάδες, ἐκ φυλῆς Λευὶ δώδεκα χιλιάδες, ἐκ φυλῆς Ἰσσαχὰρ δώδεκα χιλιάδες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/007.yaml
  text: from the tribe of Simeon[a], twelve thousand; from the tribe of Levi, twelve thousand; from the tribe of Issachar, twelve thousand.
translation:
  language: id
  text: dari suku Simeon, dua belas ribu; dari suku Lewi, dua belas ribu; dari suku Isakhar, dua belas ribu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ
  choice: dari
  rationale: Menandai sumber atau asal dan secara alami mempertahankan rumusan berulang dalam daftar ini.
- source_word: φυλῆς
  choice: suku
  rationale: Dalam konteks pembagian genealogis Israel, kata ini menunjuk pada suku Israel; “suku” merupakan padanan baku dan tepat dalam bahasa Indonesia.
- source_word: Συμεὼν
  choice: Simeon
  rationale: Mengikuti bentuk nama yang baku dalam bahasa Indonesia.
- source_word: δώδεκα χιλιάδες
  choice: dua belas ribu
  rationale: Menerjemahkan ungkapan bilangan Yunani secara langsung dengan kata-kata agar selaras dengan gaya sastra teks.
- source_word: Λευὶ
  choice: Lewi
  rationale: Mengikuti bentuk nama yang baku dalam bahasa Indonesia dan mempertahankan penyebutan Lewi secara langsung sebagaimana dalam teks Yunani.
- source_word: Ἰσσαχὰρ
  choice: Isakhar
  rationale: Mengikuti bentuk nama yang lazim dan mudah dikenali dalam bahasa Indonesia.
theological_decisions:
- issue: Sintaksis daftar suku yang berulang
  choice: Mempertahankan pola “dari suku ..., dua belas ribu” untuk setiap suku.
  alternative: Meringkasnya menjadi “dari suku Simeon, Lewi, dan Isakhar, masing-masing dua belas ribu.”
  rationale: Teks Yunani mengulang rumusan itu bagi setiap suku. Pengulangan tersebut mempertahankan irama enumeratif dan struktur formal penglihatan apokaliptis.
- issue: Pencantuman Lewi dalam daftar suku
  choice: Menyebut Lewi tanpa penjelasan tambahan dalam teks utama.
  alternative: Menambahkan penjelasan tentang pencantuman Lewi yang tidak lazim dalam susunan suku tertentu.
  rationale: Ayat ini hanya mencantumkan Lewi. Penjelasan tambahan akan memasukkan penafsiran yang tidak dinyatakan oleh teks.
translation_notes:
  register: Bahasa Indonesia modern, baku, ringkas, dan bermartabat. Pengulangan sumber dipertahankan dengan sengaja. Tidak digunakan catatan kaki karena alternatif Inggris “from/out of” tidak memiliki perbedaan padanan yang berarti dalam konteks bahasa Indonesia.
