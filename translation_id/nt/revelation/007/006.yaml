id: REV.7.6
reference: Revelation 7:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐκ φυλῆς Ἀσὴρ δώδεκα χιλιάδες, ἐκ φυλῆς Νεφθαλὶμ δώδεκα χιλιάδες, ἐκ φυλῆς Μανασσῆ δώδεκα χιλιάδες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/006.yaml
  text: from the tribe of Asher[a], twelve thousand; from the tribe of Naphtali, twelve thousand; from the tribe of Manasseh, twelve thousand;
translation:
  language: id
  text: dari suku Asyer, dua belas ribu; dari suku Naftali, dua belas ribu; dari suku Manasye, dua belas ribu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, dengan menyatakan lebih jelas apa yang tersirat dari konteks: “dari suku Asyer, dua belas ribu orang dimeteraikan” (demikian juga untuk suku-suku berikutnya). Teks Yunani ayat ini sendiri tidak mengulangi kata kerjanya.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ
  choice: dari
  rationale: Preposisi ini menyatakan asal atau sumber; dalam daftar ini, “dari” paling alami dan tepat.
- source_word: φυλῆς
  choice: suku
  rationale: Dalam konteks silsilah Israel, φυλή menunjuk pada pembagian kesukuan Israel; “suku” adalah padanan baku dalam bahasa Indonesia.
- source_word: Ἀσὴρ
  choice: Asyer
  rationale: Nama suku ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: δώδεκα χιλιάδες
  choice: dua belas ribu
  rationale: Ungkapan bilangan ini menyatakan jumlah secara langsung. Kata kerja seperti “dimeteraikan” tidak ditambahkan ke teks utama karena tidak muncul dalam bahasa Yunani ayat ini.
- source_word: Νεφθαλὶμ
  choice: Naftali
  rationale: Nama suku ditransliterasikan dengan bentuk yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: Μανασσῆ
  choice: Manasye
  rationale: Nama suku ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
theological_decisions:
- issue: Apakah kata kerja tersirat seperti “dimeteraikan” perlu ditambahkan dari konteks sekitarnya
  choice: Tidak menambahkan kata kerja dalam teks utama; mempertahankan bentuk daftar tanpa kata kerja seperti dalam bahasa Yunani.
  alternative: “dari suku Asyer, dua belas ribu orang dimeteraikan; dari suku Naftali, dua belas ribu; dari suku Manasye, dua belas ribu”
  rationale: Gagasan pemeteraian sudah ditetapkan dalam konteks sebelumnya, tetapi ayat ini sendiri hanya memuat rangkaian frasa asal dan jumlah tanpa kata kerja eksplisit. Bentuk ringkas dipertahankan agar tidak menambahkan unsur yang tidak dinyatakan oleh teks sumber.
translation_notes:
  register: Bahasa Indonesia modern, baku, ringkas, dan bermartabat. Struktur daftar Yunani dipertahankan, sedangkan tanda baca membantu keterbacaan. Penanda catatan kaki ditempatkan sesudah seluruh deret karena catatan menjelaskan pola elipsis yang berlaku pada seluruh ayat.
