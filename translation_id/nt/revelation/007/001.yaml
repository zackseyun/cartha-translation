id: REV.7.1
reference: Revelation 7:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀Μετὰ τοῦτο εἶδον τέσσαρας ἀγγέλους ἑστῶτας ἐπὶ τὰς τέσσαρας γωνίας τῆς γῆς, κρατοῦντας τοὺς τέσσαρας ἀνέμους τῆς γῆς, ἵνα μὴ πνέῃ ἄνεμος ἐπὶ τῆς γῆς μήτε ἐπὶ τῆς θαλάσσης μήτε ἐπὶ ⸀πᾶν δένδρον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/001.yaml
  text: After this I saw four angels standing at the four corners of the earth[b][a], holding back the four winds of the earth so that no wind might blow on the earth or on the sea or on any tree.
translation:
  language: id
  text: Sesudah itu[a] aku melihat empat malaikat berdiri di keempat penjuru bumi[b]. Mereka menahan keempat angin bumi agar tidak ada angin yang bertiup di bumi, di laut, ataupun pada pohon mana pun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Setelah ini.”
    reason: lexical_alternative
  - marker: b
    text: “Keempat penjuru bumi” adalah ungkapan konvensional yang menunjuk pada ujung-ujung bumi atau keempat arah.
    reason: cultural_note
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: Sesudah itu
  rationale: Ungkapan ini berfungsi sebagai penanda urutan dalam penglihatan. “Sesudah itu” alami dalam bahasa Indonesia modern dan tetap mempertahankan hubungan waktunya.
- source_word: εἶδον
  choice: aku melihat
  rationale: Bentuk ini secara langsung menyatakan persepsi dalam penglihatan; tidak perlu diperluas menjadi “aku memandang dan melihat”.
- source_word: τέσσαρας ἀγγέλους
  choice: empat malaikat
  rationale: Padanan langsung bagi bilangan dan kata bendanya.
- source_word: ἑστῶτας
  choice: berdiri
  rationale: Partisip ini menggambarkan keadaan atau posisi berdiri. Padanan seperti “ditempatkan” akan menambahkan gagasan yang tidak dinyatakan secara eksplisit.
- source_word: ἐπὶ τὰς τέσσαρας γωνίας τῆς γῆς
  choice: di keempat penjuru bumi
  rationale: “Keempat penjuru bumi” merupakan ungkapan Indonesia yang alami bagi gambaran tentang empat ujung atau arah bumi, tanpa menghilangkan citra apokaliptiknya.
- source_word: κρατοῦντας
  choice: menahan
  rationale: Dalam konteks ini para malaikat mencegah angin bertiup, sehingga “menahan” menyampaikan daya pembatasan yang tersirat oleh konteks.
- source_word: τοὺς τέσσαρας ἀνέμους τῆς γῆς
  choice: keempat angin bumi
  rationale: Terjemahan ini mempertahankan ungkapan apokaliptik tentang angin dari empat arah dan cakupan kosmis γῆ.
- source_word: ἵνα μὴ πνέῃ ἄνεμος
  choice: agar tidak ada angin yang bertiup
  rationale: ἵνα dengan subjungtif menyatakan tujuan atau hasil yang dimaksud. Bentuk ini secara alami mengungkapkan berhentinya segala tiupan angin.
- source_word: ἐπὶ τῆς γῆς μήτε ἐπὶ τῆς θαλάσσης μήτε ἐπὶ πᾶν δένδρον
  choice: di bumi, di laut, ataupun pada pohon mana pun
  rationale: Susunan ini mempertahankan tiga ranah yang dikoordinasikan di bawah penyangkalan sebelumnya. “Pohon mana pun” menyampaikan arti distributif πᾶν δένδρον.
theological_decisions:
- issue: Cakupan γῆ dalam penglihatan apokaliptik
  choice: γῆ diterjemahkan sebagai “bumi” di seluruh ayat.
  alternative: tanah; daratan
  rationale: Gambaran keempat penjuru, keempat angin, bumi, laut, dan setiap pohon menunjukkan cakupan kosmis. “Tanah” atau “daratan” dapat mempersempit cakupan secara tidak semestinya.
- issue: Sifat ungkapan kosmologis “keempat penjuru bumi”
  choice: Citra empat penjuru dipertahankan dalam ungkapan Indonesia yang lazim.
  alternative: keempat ujung bumi; keempat arah mata angin
  rationale: Teks memakai bahasa penglihatan yang konvensional. “Keempat penjuru bumi” mempertahankan citranya tanpa mengubahnya menjadi penjelasan ilmiah atau parafrasa interpretatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Kalimat Yunani yang panjang dibagi menjadi dua kalimat agar alami dalam bahasa Indonesia; pengulangan subjek “Mereka” memperjelas bahwa para malaikatlah yang menahan angin. Citra apokaliptik dan cakupan kosmis dipertahankan.
