  text: λέγων· Μὴ ἀδικήσητε τὴν γῆν μήτε τὴν θάλασσαν μήτε τὰ δένδρα, ⸀ἄχρι σφραγίσωμεν τοὺς δούλους τοῦ θεοῦ ἡμῶν ἐπὶ τῶν μετώπων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/003.yaml
  text: saying[a], “Do not harm the earth or the sea or the trees until we have sealed the servants of our God on their foreheads.”
translation:
  language: id
  text: yang berkata, “Jangan merusak bumi, laut, ataupun pohon-pohon sampai kami selesai memeteraikan budak-budak[a] Allah kita di dahi mereka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hamba-hamba” atau “para pelayan.” Kata Yunani doulous dapat menunjuk kepada orang-orang yang menjadi milik seorang tuan; terjemahan “budak-budak” mempertahankan penekanan itu di sini.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: katanya
  rationale: Partisipel ini memperkenalkan ucapan tokoh yang disebut sebelumnya; “katanya” ringkas dan alami dalam narasi Indonesia.
- source_word: ἀδικήσητε
  choice: merusak
  rationale: Karena objeknya bumi, laut, dan pohon-pohon, kata ini menunjuk pada tindakan yang menimbulkan kerusakan, bukan ketidakadilan moral terhadap orang.
- source_word: τὴν γῆν
  choice: bumi
  rationale: Dalam rangkaian kosmis bersama laut dan pohon-pohon, “bumi” lebih sesuai daripada “tanah”.
- source_word: τὴν θάλασσαν
  choice: laut
  rationale: Padanan langsung dan alami dalam bahasa Indonesia.
- source_word: τὰ δένδρα
  choice: pohon-pohon
  rationale: Bentuk ulang menyatakan jamak secara jelas dan wajar.
- source_word: ἄχρι σφραγίσωμεν
  choice: sampai kami selesai memeteraikan
  rationale: “Sampai” menyatakan batas waktu larangan, sedangkan “selesai” memperjelas bahwa tindakan pemeteraian harus tuntas sebelum perusakan berlangsung.
- source_word: τοὺς δούλους
  choice: budak-budak
  rationale: Kata δοῦλος dapat menyatakan orang yang menjadi milik seorang tuan. Dalam konteks pemeteraian sebagai tanda kepemilikan dan kesetiaan, “budak-budak” mempertahankan unsur status tersebut; alternatif yang lebih lunak dicatat dalam catatan kaki.
- source_word: τοῦ θεοῦ ἡμῶν
  choice: Allah kita
  rationale: Menerjemahkan konstruksi genitif kepemilikan dan tetap mempertahankan kata ganti “kita” yang mencakup penutur dan pihak yang disapa.
- source_word: ἐπὶ τῶν μετώπων αὐτῶν
  choice: pada dahi mereka
  rationale: Menyatakan dengan alami dan tepat lokasi meterai itu dikenakan.
theological_decisions:
- issue: Makna δοῦλος dalam konteks kepemilikan dan kesetiaan kepada Allah
  choice: budak-budak
  alternative: hamba-hamba; para pelayan
  rationale: Gambaran meterai menonjolkan bahwa mereka adalah milik Allah. “Budak-budak” menjaga daya makna status terikat tanpa mengubahnya menjadi sekadar fungsi pelayanan, sementara padanan tradisional yang lebih lunak disediakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Memeteraikan” dipertahankan sebagai istilah apokaliptik yang lazim; “selesai” membantu menyampaikan batas temporal dan ketuntasan tindakan tanpa menentukan hakikat meterai tersebut.
