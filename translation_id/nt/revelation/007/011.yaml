id: REV.7.11
reference: Revelation 7:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ πάντες οἱ ἄγγελοι εἱστήκεισαν κύκλῳ τοῦ θρόνου καὶ τῶν πρεσβυτέρων καὶ τῶν τεσσάρων ζῴων, καὶ ἔπεσαν ἐνώπιον τοῦ θρόνου ἐπὶ τὰ πρόσωπα αὐτῶν καὶ προσεκύνησαν τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/011.yaml
  text: And all the angels were standing around the throne and the elders and the four living creatures[a], and they fell before the throne on their faces and worshiped God,
translation:
  language: id
  text: Semua malaikat berdiri mengelilingi takhta, para tua-tua, dan keempat makhluk hidup[a] itu. Lalu mereka sujud dengan muka sampai ke tanah di hadapan takhta dan menyembah Allah,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “keempat makhluk bernyawa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες οἱ ἄγγελοι
  choice: semua malaikat
  rationale: Padanan langsung dan alami bagi bentuk jamak berartikel yang didahului πάντες.
- source_word: εἱστήκεισαν
  choice: berdiri
  rationale: Bentuk ini menyatakan keadaan atau posisi berdiri; dalam bahasa Indonesia, 'berdiri' secara alami menyampaikan keadaan yang sedang berlangsung.
- source_word: κύκλῳ τοῦ θρόνου καὶ τῶν πρεσβυτέρων καὶ τῶν τεσσάρων ζῴων
  choice: mengelilingi takhta, para tua-tua, dan keempat makhluk hidup itu
  rationale: κύκλῳ dengan genetif menunjukkan posisi di sekeliling seluruh kelompok yang disebutkan. 'Mengelilingi' ringkas dan alamiah tanpa mengubah hubungan spasial.
- source_word: τῶν πρεσβυτέρων
  choice: para tua-tua
  rationale: Istilah baku dalam konteks kelompok surgawi di kitab Wahyu dan mempertahankan identitas kelompok tersebut.
- source_word: τῶν τεσσάρων ζῴων
  choice: keempat makhluk hidup itu
  rationale: ζῷα menunjuk pada sosok hidup di ruang takhta, bukan sekadar hewan. 'Makhluk hidup' mempertahankan citra apokaliptik tanpa menambahkan identifikasi tafsiran.
- source_word: ἔπεσαν ... ἐπὶ τὰ πρόσωπα αὐτῶν
  choice: sujud dengan muka sampai ke tanah
  rationale: Gabungan kata kerja 'jatuh' dan ungkapan 'pada muka mereka' menyatakan tindakan merendahkan diri sepenuhnya. Ungkapan Indonesia ini menyampaikan gerak dan postur tersebut dengan alami.
- source_word: ἐνώπιον τοῦ θρόνου
  choice: di hadapan takhta
  rationale: Menyampaikan makna spasial ἐνώπιον dengan ragam yang wajar dan khidmat.
- source_word: προσεκύνησαν τῷ θεῷ
  choice: menyembah Allah
  rationale: Karena objeknya Allah dan tindakan sujud sudah dinyatakan sebelumnya, προσκυνέω di sini secara tepat menyatakan penyembahan.
theological_decisions:
- issue: Penyebutan sosok-sosok ruang takhta (ζῷα)
  choice: makhluk hidup
  alternative: makhluk bernyawa
  rationale: Pilihan ini menjaga gambaran apokaliptik dan tidak mereduksinya menjadi hewan atau memasukkan identifikasi teologis tambahan.
- issue: Makna προσκυνέω ketika objeknya Allah
  choice: menyembah Allah
  alternative: bersujud kepada Allah
  rationale: Konteks sudah menggambarkan sujud jasmani, sehingga 'menyembah' menyampaikan dimensi penghormatan religius dari kata kerja tersebut tanpa pengulangan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. Struktur kalimat dibagi setelah daftar lokasi untuk menghindari kalimat yang terlalu padat, sambil mempertahankan urutan tindakan teks Yunani. Kata penunjuk 'itu' menandai kelompok yang sudah dikenal dalam konteks kitab Wahyu.
source_grounding:
  english_pob_role: consult_only
