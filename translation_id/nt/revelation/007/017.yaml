id: REV.7.17
reference: Revelation 7:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι τὸ ἀρνίον τὸ ἀνὰ μέσον τοῦ θρόνου ⸀ποιμανεῖ αὐτούς, καὶ ⸀ὁδηγήσει αὐτοὺς ἐπὶ ζωῆς πηγὰς ὑδάτων· καὶ ἐξαλείψει ὁ θεὸς πᾶν δάκρυον ἐκ τῶν ὀφθαλμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/017.yaml
  text: because the Lamb in the midst of the throne will shepherd them[a], and he will guide them to springs of the water of life[c][b], and God will wipe away every tear from their eyes.
translation:
  language: id
  text: sebab Anak Domba yang berada di tengah-tengah takhta[a] akan menggembalakan mereka dan menuntun[b] mereka ke sumber-sumber air kehidupan,[c] dan Allah akan menghapus setiap air mata dari mata mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di pusat takhta.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “membimbing.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “ke mata air yang airnya memberi hidup.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρνίον
  choice: Anak Domba
  rationale: Mempertahankan gelar kristologis yang lazim dalam Wahyu serta gema pengorbanan dan Mesias, tanpa membuat bentuk diminutif Yunani terdengar remeh.
- source_word: ἀνὰ μέσον τοῦ θρόνου
  choice: yang berada di tengah-tengah takhta
  rationale: Mempertahankan gambaran posisi sentral dalam kaitannya dengan takhta, sekalipun hubungan ruangnya tetap agak tidak biasa sebagaimana dalam bahasa Yunani.
- source_word: ποιμανεῖ
  choice: akan menggembalakan
  rationale: Menyampaikan arti dasar bertindak sebagai gembala dan mempertahankan paradoks yang disengaja bahwa Anak Domba menjadi gembala.
- source_word: ὁδηγήσει
  choice: menuntun
  rationale: Padanan alami bagi tindakan membimbing atau memimpin menuju suatu tujuan; kata ini sesuai dengan gambaran seorang gembala.
- source_word: ἐπὶ ζωῆς πηγὰς ὑδάτων
  choice: ke mata air kehidupan
  rationale: Ungkapan ringkas dan alami dalam bahasa Indonesia yang mempertahankan gambaran sumber air serta kaitannya dengan kehidupan. Bentuk tunggal kolektif 'mata air' tidak meniadakan jamak Yunani dalam pemakaian Indonesia.
- source_word: ἐξαλείψει
  choice: akan menghapus
  rationale: Dalam konteks penghiburan, 'menghapus air mata' merupakan ungkapan Indonesia yang alami dan tetap menyampaikan tindakan meniadakan seluruh dukacita.
- source_word: πᾶν δάκρυον
  choice: setiap air mata
  rationale: Mempertahankan bentuk distributif dan penekanan Yunani pada ketiadaan satu pun air mata yang tersisa.
- source_word: ἐκ τῶν ὀφθαλμῶν αὐτῶν
  choice: dari mata mereka
  rationale: Padanan Indonesia yang langsung dan idiomatis bagi gambaran Yunani.
theological_decisions:
- issue: Paradoks kristologis Anak Domba sebagai gembala
  choice: Mempertahankan 'Anak Domba ... akan menggembalakan mereka'
  alternative: Anak Domba ... akan memelihara atau memerintah mereka
  rationale: Teks sengaja menempatkan Anak Domba dalam peran gembala. Terjemahan literal yang alami mempertahankan kekuatan citra dan ketegangan teologis ini.
- issue: Hubungan Allah dengan Anak Domba pada klausa terakhir
  choice: Mempertahankan Allah sebagai subjek eksplisit klausa terakhir
  alternative: Meneruskan Anak Domba sebagai subjek tersirat
  rationale: Bahasa Yunani secara eksplisit menyebut ὁ θεός sebagai subjek ἐξαλείψει; pembedaan klausa ini tidak boleh dilebur.
- issue: Hubungan genitif ζωῆς dengan πηγὰς ὑδάτων
  choice: mata air kehidupan
  alternative: mata air yang hidup atau mata air dari air kehidupan
  rationale: Susunan Yunani memungkinkan nuansa 'air kehidupan' maupun 'air yang hidup'. Teks utama memakai ungkapan Indonesia yang alami, sedangkan alternatif dicatat tanpa memaksakan penafsiran yang terlalu sempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat mengikuti alur Yunani, sedangkan pilihan kata dibuat mudah dipahami. Pengulangan 'mereka' dipertahankan demi kejelasan, dan kontras Anak Domba–gembala dibiarkan tetap menonjol.
