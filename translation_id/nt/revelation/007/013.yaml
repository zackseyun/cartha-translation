    rationale: Walaupun ἀποκρίνομαι dapat mengawali ujaran tanpa pertanyaan yang langsung mendahului, makna responsnya tetap hadir dalam teks Yunani dan sebaiknya dipertahankan, sejalan dengan audit trail Inggris.
  - severity: low
    issue: Demonstratif “ini” berpotensi dimodifikasi sebagai penunjuk “jubah putih,” bukan kelompok orang.
    rationale: Οὗτοι menunjuk kepada orang-orang yang berpakaian jubah putih. Memindahkan “ini” ke dekat “orang-orang” menghilangkan ambiguitas sintaktis yang tidak ada dalam sumber.
