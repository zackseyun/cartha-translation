  verdict: revise
  source_fidelity: Revisi diperlukan karena ἀπεκρίθη secara eksplisit berarti “menjawab”; draf menghilangkan unsur ini dengan hanya memakai “berkata.” Selain itu, penempatan “ini” dalam “jubah putih ini” secara alami dapat melekat pada jubah, sedangkan demonstratif Yunani Οὗτοι menunjuk kepada orang-orang tersebut.
  naturalness: Teks revisi tetap baku, modern, dan lancar. Struktur “Orang-orang ini, yang mengenakan jubah putih” dengan jelas mempertahankan penunjukan kepada kelompok yang terlihat tanpa menjadi kaku.
  terminology: “Tua-tua” sesuai dengan istilah yang lazim bagi πρεσβύτεροι dalam Wahyu. “Jubah putih” secara tepat menyampaikan στολὰς ... λευκάς, dan tidak perlu diberi catatan kaki.
