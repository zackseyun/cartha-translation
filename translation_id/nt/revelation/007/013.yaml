  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἀπεκρίθη εἷς ἐκ τῶν πρεσβυτέρων λέγων μοι· Οὗτοι οἱ περιβεβλημένοι τὰς στολὰς τὰς λευκὰς τίνες εἰσὶν καὶ πόθεν ἦλθον;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/013.yaml
  text: Then one of the elders answered[a], saying to me, “These who are clothed in the white robes—who are they, and where have they come from?”
translation:
  language: id
  text: Lalu salah seorang dari tua-tua itu menjawab dan berkata kepadaku, “Orang-orang ini, yang mengenakan jubah putih, siapakah mereka dan dari manakah mereka datang?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Lalu
  rationale: Berfungsi sebagai penghubung yang memajukan urutan penglihatan; “Lalu” alami dalam narasi Indonesia dan tetap mempertahankan kesinambungannya.
- source_word: ἀπεκρίθη ... λέγων μοι
  choice: berkata kepadaku
  rationale: Secara harfiah dapat berarti “menjawab dengan berkata kepadaku,” tetapi dalam konteks tanpa pertanyaan langsung sebelumnya, gabungan idiom Yunani ini paling alami diterjemahkan “berkata kepadaku” dalam bahasa Indonesia.
- source_word: εἷς ἐκ τῶν πρεσβυτέρων
  choice: salah seorang dari tua-tua itu
  rationale: Mempertahankan konstruksi partitif dan istilah kelompok πρεσβύτεροι yang sudah mapan dalam konteks kitab Wahyu.
- source_word: Οὗτοι οἱ περιβεβλημένοι
  choice: Orang-orang yang mengenakan ... ini
  rationale: Bentuk partisipel perfek menyatakan keadaan yang sedang berlangsung sebagai hasil tindakan sebelumnya; “mengenakan” menyampaikan keadaan berpakaian secara alami tanpa menentukan pelakunya.
- source_word: τὰς στολὰς τὰς λευκάς
  choice: jubah putih
  rationale: στολή menunjuk pada pakaian panjang atau jubah; pilihan ini mempertahankan citra berulang dalam kitab Wahyu.
- source_word: τίνες εἰσὶν
  choice: siapakah mereka
  rationale: Bentuk tanya ini alami, jelas, dan bermartabat dalam bahasa Indonesia modern.
- source_word: πόθεν ἦλθον
  choice: dari manakah mereka datang
  rationale: πόθεν menanyakan asal atau sumber. Bentuk ini mempertahankan makna aoristus tanpa memaksakan pembedaan aspek yang tidak sejajar langsung dalam bahasa Indonesia.
theological_decisions:
- issue: Nuansa respons pada ἀπεκρίθη
  choice: berkata kepadaku
  alternative: menjawab dan berkata kepadaku
  rationale: Bahasa Yunani dapat memakai ἀποκρίνομαι untuk memulai ucapan meskipun tidak ada pertanyaan langsung sebelumnya. Terjemahan yang dipilih menghindari kesan bahwa Yohanes baru saja bertanya, tanpa mengubah isi teologis.
- issue: Aspek ἦλθον
  choice: datang
  alternative: telah datang
  rationale: Aoristus Yunani memandang peristiwa kedatangan secara utuh. Bahasa Indonesia tidak wajib menandai aspek ini; “datang” menjaga pertanyaan tentang asal mereka tanpa menambahkan penekanan temporal.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Susunan pertanyaan mempertahankan penunjukan dramatis kepada kelompok berjubah putih serta dua pertanyaan tentang identitas dan asal mereka.
