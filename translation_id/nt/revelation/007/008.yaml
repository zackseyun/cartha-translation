  text: ἐκ φυλῆς Ζαβουλὼν δώδεκα χιλιάδες, ἐκ φυλῆς Ἰωσὴφ δώδεκα χιλιάδες, ἐκ φυλῆς Βενιαμὶν δώδεκα χιλιάδες ⸀ἐσφραγισμένοι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/008.yaml
  text: from the tribe of Zebulun[a], twelve thousand; from the tribe of Joseph, twelve thousand; from the tribe of Benjamin, twelve thousand, having been sealed.
translation:
  language: id
  text: dari suku Zebulon, dua belas ribu; dari suku Yusuf, dua belas ribu; dari suku Benyamin, dua belas ribu—mereka telah dimeteraikan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “yang telah dimeteraikan” atau “telah dimeteraikan.” Partisip Yunani pada akhir kalimat merangkum kelompok-kelompok yang disebutkan dalam daftar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ φυλῆς
  choice: dari suku
  rationale: Menunjukkan asal atau kelompok sumber dan mempertahankan rumus berulang dalam daftar dengan bahasa Indonesia yang alami.
- source_word: Ζαβουλών
  choice: Zebulon
  rationale: Menggunakan bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: δώδεκα χιλιάδες
  choice: dua belas ribu
  rationale: Menerjemahkan jumlah secara langsung dan mempertahankan pola formal teks Yunani.
- source_word: Ἰωσήφ
  choice: Yusuf
  rationale: Memakai bentuk nama Indonesia yang mapan dan mempertahankan penyebutan Yusuf sebagaimana terdapat dalam teks, tanpa menggantinya dengan Efraim atau Manasye.
- source_word: Βενιαμίν
  choice: Benyamin
  rationale: Menggunakan bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: ἐσφραγισμένοι
  choice: mereka telah dimeteraikan
  rationale: Menyatakan aspek perfektif dan bentuk pasif partisip Yunani secara jelas serta merangkum semua kelompok yang baru disebutkan.
theological_decisions:
- issue: Cakupan dan daya ἐσφραγισμένοι pada akhir ayat
  choice: 'Ditempatkan sebagai klausa rangkuman di akhir: “mereka telah dimeteraikan.”'
  alternative: “yang telah dimeteraikan” atau memindahkan keterangan ini ke awal daftar
  rationale: Posisi akhir mempertahankan efek rangkuman teks Yunani. Pronomina “mereka” membuat hubungannya dengan semua kelompok dalam daftar jelas tanpa menjelaskan lebih jauh hakikat pemeteraian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Tanda pisah sebelum klausa terakhir menandai bahwa partisip penutup merangkum ketiga kelompok, sedangkan pengulangan dan urutan daftar dipertahankan.
