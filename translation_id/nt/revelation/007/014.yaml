id: REV.7.14
reference: Revelation 7:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ⸀εἴρηκα αὐτῷ· Κύριέ μου, σὺ οἶδας. καὶ εἶπέν μοι· Οὗτοί εἰσιν οἱ ἐρχόμενοι ἐκ τῆς θλίψεως τῆς μεγάλης, καὶ ἔπλυναν τὰς στολὰς αὐτῶν καὶ ἐλεύκαναν ⸀αὐτὰς ἐν τῷ αἵματι τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/014.yaml
  text: And I said to him[a], “My lord, you know.” And he said to me, “These are the ones coming out of the great tribulation[b]. They washed their robes and made them white in the blood of the Lamb.”
translation:
  language: id
  text: Lalu aku berkata kepadanya, “Tuanku, engkaulah yang tahu.” Ia berkata kepadaku, “Mereka inilah orang-orang yang sedang keluar dari kesusahan besar itu.[a] Mereka telah mencuci jubah mereka dan menjadikan jubah-jubah itu putih di dalam darah Anak Domba.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “kesengsaraan besar itu” atau “penderitaan berat itu.” Kata Yunani yang digunakan dapat berarti tekanan, kesusahan, penderitaan, atau kesengsaraan.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “di dalam darah Anak Domba” sengaja dipertahankan. Kata depan Yunani ini juga dapat dipahami secara instrumental, yaitu “oleh darah Anak Domba,” tetapi terjemahan utama mempertahankan gambaran paradoks dalam Wahyu tentang penyucian di dalam darah.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκα
  choice: aku berkata
  rationale: Bentuk perfektum ini berfungsi sebagai pengantar dialog dalam narasi Yohanes; bahasa Indonesia alami cukup menyatakannya dengan bentuk naratif tanpa menambahkan penanda aspek.
- source_word: Κύριέ μου
  choice: Tuanku
  rationale: Sapaan hormat ini ditujukan kepada seorang tua-tua surgawi, bukan secara eksplisit kepada Allah atau Mesias. “Tuanku” mempertahankan rasa hormat tanpa menyamakan tokoh itu dengan Tuhan.
- source_word: σὺ οἶδας
  choice: engkaulah yang tahu
  rationale: Bentuk ini mempertahankan penekanan dari pronomina eksplisit σὺ sekaligus menyampaikan pengakuan hormat bahwa sang tua-tua mengetahui jawabannya.
- source_word: οἱ ἐρχόμενοι
  choice: orang-orang yang sedang keluar
  rationale: Partisipel kala kini dipertahankan sebagai tindakan yang sedang berlangsung, bukan diubah menjadi peristiwa lampau yang sudah selesai.
- source_word: ἐκ τῆς θλίψεως τῆς μεγάλης
  choice: dari kesusahan besar itu
  rationale: “Kesusahan” merupakan padanan Indonesia yang luas dan wajar bagi θλῖψις, sedangkan “itu” mencerminkan frasa Yunani yang definit dan tidak menentukan satu skema eskatologis tertentu.
- source_word: ἔπλυναν
  choice: telah mencuci
  rationale: Penanda “telah” menyatakan tindakan yang dipandang sebagai satu keseluruhan yang selesai.
- source_word: στολάς
  choice: jubah
  rationale: στολή menunjuk pada pakaian panjang atau pakaian kebesaran; “jubah” lebih khusus dan sesuai dengan gambaran dalam Wahyu daripada “pakaian”.
- source_word: ἐλεύκαναν
  choice: membuatnya menjadi putih
  rationale: Ungkapan ini mempertahankan makna kausatif verba tersebut dan terdengar alami dalam bahasa Indonesia modern.
- source_word: ἐν τῷ αἵματι
  choice: di dalam darah
  rationale: Preposisi ἐν diterjemahkan secara dekat untuk mempertahankan gambaran paradoks tentang jubah yang menjadi putih di dalam darah; kemungkinan makna instrumental dicatat dalam catatan kaki.
- source_word: τοῦ ἀρνίου
  choice: Anak Domba
  rationale: Dalam Wahyu, sebutan ini berfungsi sebagai gelar kristologis; kapitalisasi menandai pemakaian titular tersebut.
theological_decisions:
- issue: Sapaan κύριος kepada tua-tua surgawi
  choice: Tuanku
  alternative: Tuhan; Tuan
  rationale: Konteks menunjukkan bahwa Yohanes menyapa seorang tua-tua. “Tuanku” menjaga penghormatan dalam adegan surgawi tanpa menyatakan bahwa tokoh itu adalah Allah atau Mesias.
- issue: Cakupan frasa ἡ θλῖψις ἡ μεγάλη
  choice: kesusahan besar itu
  alternative: kesengsaraan besar itu; penderitaan berat itu
  rationale: Terjemahan ini mempertahankan istilah secara leksikal dan definit tanpa memutuskan apakah frasa tersebut menunjuk pada satu masa akhir zaman tertentu, penderitaan umat Allah secara umum, atau keduanya.
- issue: Daya preposisi ἐν dalam gambaran darah Anak Domba
  choice: di dalam darah Anak Domba
  alternative: oleh darah Anak Domba; dengan darah Anak Domba
  rationale: Pilihan utama mempertahankan gambaran paradoks teks Yunani, sementara catatan kaki mengakui kemungkinan pemahaman instrumental.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Tuanku” dipakai sebagai sapaan hormat kepada tua-tua; “engkaulah” menjaga penekanan pronomina tanpa terasa kaku. Struktur kalimat dibuat jelas bagi pembaca umum sambil mempertahankan aspek partisipel kini dan gambaran simbolis teks.
