  text: οὐ πεινάσουσιν ἔτι ⸀οὐδὲ διψήσουσιν ἔτι, οὐδὲ μὴ πέσῃ ἐπ’ αὐτοὺς ὁ ἥλιος οὐδὲ πᾶν καῦμα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/016.yaml
  text: They will hunger no more[a], nor thirst anymore; the sun will not strike them, nor any scorching heat.
translation:
  language: id
  text: Mereka tidak akan lapar lagi ataupun haus lagi. Matahari sama sekali tidak akan menyengat mereka, dan panas terik apa pun juga tidak akan menyengat mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεινάσουσιν
  choice: akan lapar
  rationale: Bentuk verba ini diterjemahkan secara langsung dan alami, serta dipertahankan sejajar dengan 'akan haus'.
- source_word: ἔτι
  choice: lagi
  rationale: Dalam rangkaian negatif ini, ἔτι menyatakan bahwa keadaan tersebut tidak akan dialami lagi sejak saat itu.
- source_word: διψήσουσιν
  choice: akan haus
  rationale: Terjemahan verbal ini mencerminkan bentuk Yunani dan menjaga kesejajaran dengan 'akan lapar'.
- source_word: οὐδὲ
  choice: dan tidak / begitu pula
  rationale: Pilihan ini menghubungkan klausa-klausa negatif secara wajar dalam bahasa Indonesia tanpa menghilangkan sifat kumulatifnya.
- source_word: οὐδὲ μὴ πέσῃ ἐπ’ αὐτοὺς ὁ ἥλιος
  choice: Matahari tidak akan menyengat mereka
  rationale: Ungkapan ini menyampaikan penyangkalan kuat yang berorientasi ke masa depan. 'Menyengat' secara alami mengungkapkan dampak matahari yang jatuh atau menimpa mereka dalam konteks panas terik.
- source_word: πᾶν καῦμα
  choice: panas terik apa pun
  rationale: καῦμα menunjuk pada panas yang membakar atau menyengat, sedangkan 'apa pun' mempertahankan cakupan menyeluruh πᾶν di bawah penyangkalan.
theological_decisions:
- issue: Gema Yesaya 49:10 dan bahasa pemulihan eskatologis
  choice: Mempertahankan gambaran konkret tentang lapar, haus, matahari, dan panas terik.
  alternative: Menafsirkan lapar dan haus terutama sebagai kerinduan rohani.
  rationale: Konteksnya memberi penghiburan apokaliptis dan menggemakan janji pemulihan dalam Yesaya. Terjemahan membiarkan gambaran konkret itu tetap terbuka bagi resonansi teologisnya tanpa membatasinya pada tafsir metaforis.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Pengulangan 'lagi' dipertahankan untuk mencerminkan kesejajaran sumber. 'Begitu pula' menghindari susunan eliptis yang kaku dan mengaitkan 'panas terik apa pun' dengan penyangkalan sebelumnya.
