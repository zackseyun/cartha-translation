id: REV.7.2
reference: Revelation 7:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἶδον ἄλλον ἄγγελον ἀναβαίνοντα ἀπὸ ἀνατολῆς ἡλίου, ἔχοντα σφραγῖδα θεοῦ ζῶντος, καὶ ἔκραξεν φωνῇ μεγάλῃ τοῖς τέσσαρσιν ἀγγέλοις οἷς ἐδόθη αὐτοῖς ἀδικῆσαι τὴν γῆν καὶ τὴν θάλασσαν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/002.yaml
  text: And I saw another angel coming up from the east[a], having the seal of the living God, and he cried out with a loud voice to the four angels to whom it had been given to harm the earth and the sea,
translation:
  language: id
  text: Lalu aku melihat seorang malaikat lain naik dari sebelah timur[a]. Ia membawa meterai Allah yang hidup dan berseru dengan suara lantang kepada keempat malaikat yang telah diberi wewenang untuk merusak bumi dan laut,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari tempat matahari terbit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλον ἄγγελον
  choice: seorang malaikat lain
  rationale: Menandai malaikat tambahan yang berbeda dari para malaikat yang telah disebutkan, dengan susunan yang alami dalam bahasa Indonesia.
- source_word: ἀναβαίνοντα
  choice: naik
  rationale: Mempertahankan arah gerak ke atas dalam penglihatan tanpa memperberat kalimat.
- source_word: ἀπὸ ἀνατολῆς ἡλίου
  choice: dari sebelah timur
  rationale: Ungkapan Yunani secara harfiah menunjuk tempat terbitnya matahari dan secara idiomatis berarti arah timur; gambaran harfiahnya dipertahankan dalam catatan kaki.
- source_word: ἔχοντα σφραγῖδα
  choice: membawa meterai
  rationale: ἔχω berarti memiliki atau memegang; 'membawa' terdengar alami untuk malaikat yang datang dengan meterai tanpa menentukan apakah meterai itu dipegang atau dikenakan.
- source_word: θεοῦ ζῶντος
  choice: Allah yang hidup
  rationale: Mempertahankan ungkapan teologis standar dan daya atributif frasa Yunani.
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: berseru dengan suara lantang
  rationale: Menyampaikan kuatnya seruan dan mencerminkan frasa instrumental φωνῇ μεγάλῃ secara alami.
- source_word: τοῖς τέσσαρσιν ἀγγέλοις
  choice: kepada keempat malaikat
  rationale: Padanan langsung dan alami bagi objek tak langsung dengan artikel serta bilangan.
- source_word: οἷς ἐδόθη αὐτοῖς ἀδικῆσαι
  choice: yang telah diberi wewenang untuk merusak
  rationale: Bentuk pasif menunjukkan pemberian izin atau otoritas tanpa menyebut pemberinya; 'wewenang' membuat konstruksi Indonesia jelas, sedangkan 'merusak' sesuai dengan tindakan terhadap bumi dan laut.
- source_word: τὴν γῆν καὶ τὴν θάλασσαν
  choice: bumi dan laut
  rationale: Dalam cakupan kosmis penglihatan Wahyu, 'bumi' paling sesuai bagi γῆ ketika dipasangkan dengan laut.
theological_decisions:
- issue: Sifat pemberian dalam ἐδόθη
  choice: telah diberi wewenang
  alternative: telah diizinkan; telah diberikan kepada mereka untuk merusak
  rationale: Bentuk pasif mempertahankan gagasan otoritas yang didelegasikan tanpa menyatakan secara eksplisit siapa pemberinya. 'Wewenang' menjadikan kalimat Indonesia wajar, tetapi tidak memperinci lebih jauh sifat kuasa tersebut.
- issue: Ungkapan arah ἀπὸ ἀνατολῆς ἡλίου
  choice: dari sebelah timur
  alternative: dari tempat matahari terbit
  rationale: Teks utama memakai arah yang langsung dipahami pembaca modern, sementara citra asli tentang terbitnya matahari tetap dicatat agar unsur sastranya tidak hilang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Lalu aku melihat' mengalir alami dalam rangkaian penglihatan; 'keempat' mengikuti kaidah penulisan bilangan kolektif; koma penutup dipertahankan karena ayat berlanjut ke ucapan pada ayat berikutnya.
source_grounding:
  english_pob_role: consult_only
