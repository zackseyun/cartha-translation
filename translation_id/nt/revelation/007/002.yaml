  source_fidelity: 'Teks Indonesia secara setia mencerminkan unsur utama Yunani: malaikat lain yang naik dari arah timur, meterai Allah yang hidup, seruan keras kepada empat malaikat, serta kewenangan yang telah diberikan kepada mereka untuk mendatangkan kerusakan pada bumi dan laut. Frasa "telah diberi wewenang" secara wajar mengungkapkan pasif ἐδόθη tanpa menyebut pemberi wewenang.'
