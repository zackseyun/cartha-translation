source:
  edition: SBLGNT
  text: Καὶ ἤκουσα τὸν ἀριθμὸν τῶν ἐσφραγισμένων, ⸀ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες, ⸀ἐσφραγισμένοι ἐκ πάσης φυλῆς υἱῶν Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/004.yaml
  text: 'And I heard the number of those who had been sealed: one hundred forty-four thousand[a], sealed from every tribe of the sons of Israel.'
translation:
  language: id
  text: 'Lalu aku mendengar jumlah mereka yang telah dimeteraikan: seratus empat puluh empat ribu orang, yang dimeteraikan dari setiap suku keturunan Israel[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki Israel”; ungkapan ini menunjuk pada keturunan Israel dan mempertahankan bahasa genealogis maskulin dalam teks Yunani.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσα
  choice: aku mendengar
  rationale: Bentuk aoristus indikatif ἀκούω dalam konteks laporan penglihatan paling alami diterjemahkan sebagai tindakan mendengar yang sederhana.
- source_word: τὸν ἀριθμὸν
  choice: jumlah
  rationale: ἀριθμός menunjuk pada jumlah keseluruhan kelompok yang dihitung; 'jumlah' merupakan padanan Indonesia yang langsung dan alami.
- source_word: τῶν ἐσφραγισμένων / ἐσφραγισμένοι
  choice: mereka yang telah dimeteraikan / yang dimeteraikan
  rationale: Partisipel perfek pasif σφραγίζω menyatakan tindakan yang telah selesai dengan keadaan yang tetap berlaku. 'Telah dimeteraikan' menangkap aspek tersebut, sedangkan pengulangan berikutnya dipertahankan dalam bentuk yang lebih lancar.
- source_word: ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: seratus empat puluh empat ribu orang
  rationale: Bilangan diterjemahkan secara langsung; 'orang' ditambahkan secara idiomatis untuk memperjelas bahwa angka itu menghitung manusia tanpa mengubah makna.
- source_word: ἐκ
  choice: dari
  rationale: ἐκ menandai sumber atau asal dan secara alami diterjemahkan 'dari' dalam konstruksi ini.
- source_word: πάσης φυλῆς
  choice: setiap suku
  rationale: Bentuk tunggal dengan πᾶς sesudah ἐκ bersifat distributif, sehingga 'dari setiap suku' mempertahankan gagasan bahwa mereka berasal dari masing-masing suku.
- source_word: υἱῶν Ἰσραήλ
  choice: keturunan Israel
  rationale: Dalam konteks daftar suku, ungkapan ini adalah sebutan genealogis kolektif. 'Keturunan Israel' terdengar alami dalam bahasa Indonesia dan mempertahankan hubungan asal-usul tanpa menyiratkan bahwa kelompok itu hanya terdiri atas anak laki-laki secara harfiah; bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Pemaknaan υἱῶν Ἰσραήλ dalam konteks suku-suku
  choice: keturunan Israel
  alternative: anak-anak lelaki Israel; bani Israel
  rationale: Bahasa Yunani secara harfiah berbunyi 'anak-anak lelaki Israel', tetapi ungkapan tersebut berfungsi sebagai sebutan genealogis bagi komunitas yang berasal dari Israel. 'Keturunan Israel' mempertahankan corak genealogis sekaligus menghindari pemasukan sistem eskatologis tertentu. Catatan kaki menjaga bentuk maskulin teks sumber.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. 'Dimeteraikan' dipilih untuk mempertahankan citra meterai yang penting dalam konteks kitab Wahyu. Pengulangan partisipel Yunani dipertahankan tanpa membuat susunan kalimat terasa kaku.
