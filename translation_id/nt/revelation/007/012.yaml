  text: λέγοντες· Ἀμήν· ἡ εὐλογία καὶ ἡ δόξα καὶ ἡ σοφία καὶ ἡ εὐχαριστία καὶ ἡ τιμὴ καὶ ἡ δύναμις καὶ ἡ ἰσχὺς τῷ θεῷ ἡμῶν εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/012.yaml
  text: saying[a], “Amen! The blessing and the glory and the wisdom and the thanksgiving and the honor and the power and the might be to our God forever and ever. Amen.”
translation:
  language: id
  text: Mereka berkata, “Amin! Pujian, kemuliaan, hikmat, ucapan syukur, hormat, kuasa, dan kekuatan bagi Allah kita selama-lamanya.[a] Amin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “untuk zaman-zaman dari segala zaman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: kata mereka
  rationale: Partisipel kini aktif nominatif jamak ini memperkenalkan isi seruan. Dalam bahasa Indonesia, klausa “kata mereka” lebih alami daripada bentuk partisipial yang kaku dan tetap menyatakan pelaku jamak.
- source_word: Ἀμήν / ἀμήν
  choice: Amin
  rationale: Dalam konteks liturgis dan doksologis, bentuk serapan baku bahasa Indonesia “Amin” mempertahankan fungsi aklamasinya; pengulangan itu membingkai doksologi.
- source_word: ἡ εὐλογία
  choice: pujian
  rationale: Dalam doksologi yang diarahkan kepada Allah, εὐλογία menyatakan berkat atau pujian yang diucapkan kepada-Nya. “Pujian” terdengar alami dalam bahasa Indonesia dan menghindari kesan bahwa Allah menerima berkat sebagai kebutuhan.
- source_word: ἡ δόξα
  choice: kemuliaan
  rationale: Padanan baku dan alami bagi δόξα dalam konteks penyembahan.
- source_word: ἡ σοφία
  choice: hikmat
  rationale: “Hikmat” adalah padanan Alkitabiah Indonesia yang tetap umum dipahami dan cocok untuk σοφία sebagai unsur dalam doksologi.
- source_word: ἡ εὐχαριστία
  choice: ucapan syukur
  rationale: Padanan nominal ini mempertahankan gagasan thanksgiving dan lebih alami daripada “kesyukuran” dalam rangkaian pujian.
- source_word: ἡ τιμή
  choice: hormat
  rationale: Dalam bahasa penyembahan, τιμή menunjuk pada penghormatan yang diberikan kepada Allah, bukan nilai ekonomis.
- source_word: ἡ δύναμις
  choice: kuasa
  rationale: “Kuasa” menyatakan daya atau kemampuan dan merupakan padanan yang lazim bagi δύναμις.
- source_word: ἡ ἰσχύς
  choice: kekuatan
  rationale: “Kekuatan” membedakan ἰσχύς dari δύναμις sambil mempertahankan penumpukan dua istilah yang maknanya berdekatan.
- source_word: τῷ θεῷ ἡμῶν
  choice: bagi Allah kita
  rationale: Datif ini menyatakan penerima atau tujuan pengakuan dalam doksologi tanpa verba. “Bagi Allah kita” mempertahankan sifat askriptifnya secara alami tanpa menjadikannya pernyataan kepemilikan yang terlalu tegas.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: selama-lamanya
  rationale: Ini adalah padanan Indonesia yang idiomatis untuk ungkapan Yunani tentang durasi tanpa akhir. Bentuk yang lebih harfiah dicatat dalam catatan kaki.
theological_decisions:
- issue: Melengkapi maksud doksologi Yunani yang tidak memakai verba
  choice: bagi Allah kita
  alternative: semuanya milik Allah kita
  rationale: Teks Yunani tidak memiliki verba setelah daftar nomina. “Bagi Allah kita” mempertahankan ambiguitas antara pengakuan, pemberian hormat, dan kepunyaan, sedangkan “semuanya milik” akan mempersempitnya menjadi kepemilikan.
- issue: Membedakan δύναμις dan ἰσχύς
  choice: kuasa ... kekuatan
  alternative: kekuatan ... keperkasaan
  rationale: Dua istilah Yunani ini saling berdekatan tetapi tidak identik. Dua padanan Indonesia yang berbeda menjaga kepenuhan retoris daftar tersebut tanpa memaksakan perbedaan teologis yang tajam.
- issue: Makna εὐλογία ketika diarahkan kepada Allah
  choice: pujian
  alternative: berkat
  rationale: “Pujian” menyampaikan tindakan memberkati atau memuji Allah dalam doksologi. “Berkat” mungkin secara leksikal, tetapi dalam bahasa Indonesia dapat terdengar seolah-olah Allah menerima suatu manfaat; pilihan ini tidak meniadakan nuansa pengucapan berkat.
translation_notes:
  register: Bahasa Indonesia baku, modern, khidmat, dan mudah dipahami. Artikel Yunani yang berulang tidak diterjemahkan satu per satu karena pengulangannya akan terasa janggal dalam bahasa Indonesia; struktur tujuh unsur tetap dipertahankan. Tanda baca menonjolkan seruan pembuka dan penutup “Amin”.
