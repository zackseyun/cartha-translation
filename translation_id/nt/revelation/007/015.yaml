id: REV.7.15
reference: Revelation 7:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: διὰ τοῦτό εἰσιν ἐνώπιον τοῦ θρόνου τοῦ θεοῦ, καὶ λατρεύουσιν αὐτῷ ἡμέρας καὶ νυκτὸς ἐν τῷ ναῷ αὐτοῦ, καὶ ὁ καθήμενος ἐπὶ ⸂τοῦ θρόνου⸃ σκηνώσει ἐπ’ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/015.yaml
  text: For this reason they are before the throne of God[a], and they serve him day and night in his temple, and the one seated on the throne will spread his tent over them.
translation:
  language: id
  text: Karena itulah mereka berada di hadapan takhta Allah[a] dan melayani Dia siang dan malam di dalam Bait-Nya. Dia yang duduk di atas takhta itu akan membentangkan kemah-Nya menaungi mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “akan berdiam di atas mereka” atau “akan melindungi mereka.” Kata kerja Yunani yang dipakai berkaitan dengan gambaran kemah atau Kemah Suci.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτό
  choice: Karena itulah
  rationale: Menunjukkan hubungan sebab-akibat dengan penjelasan dalam ayat sebelumnya secara jelas dan alami.
- source_word: ἐνώπιον
  choice: di hadapan
  rationale: Mempertahankan makna kehadiran atau kedekatan di depan takhta Allah dalam ungkapan Indonesia yang lazim.
- source_word: λατρεύουσιν
  choice: melayani
  rationale: Mencakup pelayanan sakral kepada Allah; konteks Bait Allah menyatakan sifat ibadahnya tanpa mempersempit makna menjadi pujian lisan.
- source_word: ἡμέρας καὶ νυκτός
  choice: siang dan malam
  rationale: Mempertahankan idiom sumber yang jelas dan menggambarkan pelayanan tanpa henti.
- source_word: ναῷ
  choice: Bait-Nya
  rationale: ναός menunjuk pada bait atau tempat kudus; 'Bait' alami dalam konteks alkitabiah dan konteksnya menunjukkan bahwa itu milik Allah.
- source_word: ὁ καθήμενος ἐπὶ τοῦ θρόνου
  choice: Dia yang duduk di atas takhta itu
  rationale: Mempertahankan gelar partisipial dan gambaran posisi pada takhta dalam bahasa Indonesia yang wajar.
- source_word: σκηνώσει ἐπ’ αὐτούς
  choice: akan membentangkan kemah-Nya menaungi mereka
  rationale: Mempertahankan citra kemah dari σκηνόω sekaligus menyampaikan nuansa kehadiran dan perlindungan yang tersirat oleh ἐπί.
theological_decisions:
- issue: Penggambaran σκηνώσει sebagai kehadiran ilahi
  choice: akan membentangkan kemah-Nya menaungi mereka
  alternative: akan berdiam di atas mereka; akan melindungi mereka
  rationale: Pilihan ini mempertahankan citra kemah atau Kemah Suci dan nuansa kehadiran Allah yang melindungi, tanpa mereduksinya menjadi gagasan abstrak tentang kehadiran atau sekadar fungsi perlindungan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang wajar, khidmat, dan mudah dipahami. Kapitalisasi pronomina ilahi mengikuti gaya naskah ini; 'Bait' dipakai sebagai istilah alkitabiah yang ringkas.
