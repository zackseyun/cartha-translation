id: REV.7.10
reference: Revelation 7:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ κράζουσι φωνῇ μεγάλῃ λέγοντες· Ἡ σωτηρία τῷ θεῷ ἡμῶν τῷ καθημένῳ ἐπὶ τῷ θρόνῳ καὶ τῷ ἀρνίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/010.yaml
  text: And they cry out with a loud voice[a], saying, “Salvation belongs to our God, who sits on the throne, and to the Lamb!”
translation:
  language: id
  text: Lalu mereka berseru dengan suara nyaring, “Keselamatan adalah milik Allah kita yang duduk di atas takhta, dan milik Anak Domba!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κράζουσι
  choice: mereka berseru
  rationale: Bentuk kini indikatif jamak menggambarkan tindakan yang hidup dalam adegan. “Berseru” mempertahankan daya κράζω dan lebih wajar serta bermartabat daripada “berteriak” dalam konteks pujian.
- source_word: φωνῇ μεγάλῃ
  choice: dengan suara nyaring
  rationale: Frasa datif ini menyatakan cara atau sarana. “Dengan suara nyaring” alami dalam bahasa Indonesia dan tetap mempertahankan gambaran suara.
- source_word: λέγοντες
  choice: diungkapkan langsung melalui kutipan
  rationale: Partisip ini memperkenalkan isi seruan. Dalam bahasa Indonesia, tanda koma yang diikuti kutipan langsung sudah secara alami menjalankan fungsi “dengan berkata” tanpa pengulangan yang kaku.
- source_word: Ἡ σωτηρία
  choice: Keselamatan adalah milik
  rationale: Akklamasi Yunani ini tidak memiliki verba dan memakai datif pengatribusian. “Adalah milik” menyampaikan bahwa keselamatan diatribusikan kepada Allah dan Anak Domba, sambil tetap terdengar alami dalam bahasa Indonesia modern.
- source_word: τῷ θεῷ ἡμῶν
  choice: Allah kita
  rationale: Datif menandai pihak yang kepadanya keselamatan diatribusikan. Dalam konstruksi lengkap, hal itu dinyatakan dengan “milik Allah kita”.
- source_word: τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: yang duduk di atas takhta
  rationale: Frasa partisipial ini menerangkan “Allah kita”. Pilihan ini jelas, langsung, dan mempertahankan gambaran pemerintahan ilahi.
- source_word: τῷ ἀρνίῳ
  choice: Anak Domba
  rationale: ἀρνίον merupakan gelar khas bagi Yesus dalam Wahyu. Terjemahan “Anak Domba” mempertahankan citra kurban dan mesianik; huruf kapital menandai pemakaiannya sebagai gelar.
theological_decisions:
- issue: Hubungan keselamatan dengan Allah dan Anak Domba
  choice: 'Menerjemahkannya sebagai akklamasi bersama: “Keselamatan adalah milik Allah kita ... dan milik Anak Domba!”'
  alternative: “Keselamatan bagi Allah kita ... dan bagi Anak Domba!”
  rationale: Konstruksi datif Yunani mengatribusikan keselamatan kepada Allah dan Anak Domba secara sejajar tanpa menjelaskan lebih jauh sifat hubungan tersebut. Terjemahan ini mempertahankan ketegangan teologis dan daya liturgis teks tanpa menambahkan rumusan doktrinal.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Bersuara nyaring” dihindari karena “dengan suara nyaring” lebih alami; “berseru” mempertahankan kekuatan adegan tanpa nuansa kasar. Struktur kutipan langsung dibuat ringkas sesuai idiom Indonesia.
