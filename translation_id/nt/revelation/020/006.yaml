id: REV.20.6
reference: Revelation 20:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: μακάριος καὶ ἅγιος ὁ ἔχων μέρος ἐν τῇ ἀναστάσει τῇ πρώτῃ· ἐπὶ τούτων ὁ δεύτερος θάνατος οὐκ ἔχει ἐξουσίαν, ἀλλ’ ἔσονται ἱερεῖς τοῦ θεοῦ καὶ τοῦ χριστοῦ, καὶ βασιλεύσουσιν μετ’ αὐτοῦ ⸀χίλια ἔτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/006.yaml
  text: Blessed and holy is the one who has a share in the first resurrection. Over these the second death has no authority[a], but they will be priests of God and of Messiah, and they will reign with him for a thousand years.
translation:
  language: id
  text: Berbahagia dan kuduslah orang yang mendapat bagian dalam kebangkitan pertama. Kematian yang kedua tidak berkuasa atas mereka, tetapi mereka akan menjadi imam-imam Allah dan Mesias, dan mereka akan memerintah bersama Dia selama seribu tahun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριος
  choice: Berbahagia
  rationale: Ungkapan baku untuk ucapan bahagia dalam bahasa Alkitab Indonesia; menyatakan keadaan yang diperkenan dan diberkati, bukan sekadar perasaan senang.
- source_word: ἅγιος
  choice: kudus
  rationale: Padanan langsung yang mencakup status dikhususkan bagi Allah tanpa membatasinya pada kualitas moral saja.
- source_word: ὁ ἔχων μέρος
  choice: orang yang mendapat bagian
  rationale: Secara alami menyatakan keikutsertaan dalam kebangkitan; 'orang' mempertahankan bentuk tunggal representatif tanpa penandaan gender.
- source_word: ἐν τῇ ἀναστάσει τῇ πρώτῃ
  choice: dalam kebangkitan pertama
  rationale: Padanan lugas yang mempertahankan istilah eskatologis teks.
- source_word: ἐπὶ τούτων ... οὐκ ἔχει ἐξουσίαν
  choice: tidak berkuasa atas mereka
  rationale: Susunan Indonesia yang alami dan tetap mempertahankan nuansa kewenangan atau yurisdiksi ἐξουσία atas orang-orang tersebut.
- source_word: ὁ δεύτερος θάνατος
  choice: kematian yang kedua
  rationale: Mempertahankan sebutan apokaliptis secara formal dan jelas.
- source_word: ἱερεῖς
  choice: imam-imam
  rationale: Menyampaikan langsung gambaran kultis dan peran keimaman dalam bentuk jamak.
- source_word: τοῦ θεοῦ καὶ τοῦ χριστοῦ
  choice: Allah dan Mesias
  rationale: Χριστός berfungsi sebagai gelar dalam konstruksi ini; 'Mesias' mempertahankan makna gelarnya, sedangkan relasi genitif dinyatakan secara alami melalui 'imam-imam Allah dan Mesias'.
- source_word: βασιλεύσουσιν μετ’ αὐτοῦ
  choice: mereka akan memerintah bersama Dia
  rationale: Menyampaikan pemerintahan rajawi bersama tokoh yang baru disebut tanpa menambahkan penafsiran tentang bentuk pemerintahannya.
- source_word: χίλια ἔτη
  choice: selama seribu tahun
  rationale: Kata 'selama' membuat fungsi duratif frasa itu alami dalam bahasa Indonesia tanpa menentukan apakah angka tersebut harus ditafsirkan harfiah atau simbolis.
theological_decisions:
- issue: Penerjemahan Χριστός
  choice: Mesias
  alternative: Kristus
  rationale: Dalam frasa 'Allah dan Mesias', Χριστός tampil sebagai gelar. 'Mesias' mempertahankan daya titularnya tanpa menyangkal bahwa 'Kristus' merupakan padanan tradisional.
- issue: Jangka waktu χίλια ἔτη
  choice: selama seribu tahun
  alternative: seribu tahun
  rationale: Terjemahan mempertahankan pernyataan durasi secara eksplisit, tetapi tidak memasukkan sistem penafsiran milenial tertentu.
- issue: Rujukan tunggal dan jamak
  choice: orang yang ... mereka
  alternative: siapa yang ... orang-orang itu
  rationale: Bahasa Yunani beralih dari partisipel tunggal representatif ὁ ἔχων kepada bentuk jamak τούτων dan βασιλεύσουσιν. Terjemahan mempertahankan peralihan makna itu secara wajar dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur disusun alami bagi pembaca umum sambil mempertahankan istilah penting seperti 'kudus', 'kebangkitan pertama', 'kematian yang kedua', 'imam-imam', dan 'Mesias'. Tidak diperlukan catatan kaki karena pilihan utama dapat menyampaikan teks sumber tanpa menutupi ambiguitas teologisnya.
