id: REV.20.13
reference: Revelation 20:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἔδωκεν ἡ θάλασσα τοὺς νεκροὺς τοὺς ἐν αὐτῇ, καὶ ὁ θάνατος καὶ ὁ ᾅδης ἔδωκαν τοὺς νεκροὺς τοὺς ἐν αὐτοῖς, καὶ ἐκρίθησαν ἕκαστος κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/013.yaml
  text: And the sea gave up the dead who were in it[a], and Death and Hades gave up the dead who were in them, and each one was judged according to their deeds.
translation:
  language: id
  text: Lalu laut menyerahkan orang-orang mati yang ada di dalamnya, dan Maut serta Hades[a] menyerahkan orang-orang mati yang ada di dalam keduanya. Masing-masing dihakimi menurut perbuatan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “alam orang mati”. Istilah Yunaninya adalah ᾅδης (Hades), berbeda dari istilah yang sering diterjemahkan “neraka”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν / ἔδωκαν
  choice: menyerahkan
  rationale: Dalam konteks laut, Maut, dan Hades melepaskan orang mati untuk penghakiman, 'menyerahkan' mengungkapkan fungsi δίδωμι secara wajar tanpa menambahkan gagasan yang tidak ada dalam teks.
- source_word: ἡ θάλασσα
  choice: laut
  rationale: Padanan baku dan alami untuk θάλασσα; ketakrifan cukup jelas dari konteks bahasa Indonesia.
- source_word: τοὺς νεκρούς
  choice: orang-orang mati
  rationale: Substantivisasi νεκρούς menunjuk kepada manusia yang telah mati; bentuk ini jelas dan alami dalam bahasa Indonesia.
- source_word: ὁ θάνατος
  choice: Maut
  rationale: '''Maut'' mempertahankan personifikasi apokaliptik θάνατος dan membedakannya dari penyebutan kematian sebagai peristiwa biasa.'
- source_word: ὁ ᾅδης
  choice: Hades
  rationale: Transliterasi mempertahankan identitas istilah Yunani dan menghindari penyamaannya dengan istilah untuk hukuman akhir.
- source_word: ἐν αὐτοῖς
  choice: yang ada di dalam keduanya
  rationale: Kata ganti jamak merujuk kepada Maut dan Hades; 'keduanya' membuat rujukan itu jelas dan tetap mempertahankan bentuk jamaknya.
- source_word: ἐκρίθησαν ἕκαστος
  choice: Masing-masing dihakimi
  rationale: Mengungkapkan verba pasif jamak bersama daya distributif ἕκαστος secara alami dalam bahasa Indonesia.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: menurut perbuatan mereka
  rationale: '''Perbuatan'' merupakan padanan kontekstual yang alami bagi ἔργα dan mempertahankan ukuran penghakiman yang dinyatakan teks tanpa memperluas maknanya.'
theological_decisions:
- issue: Penerjemahan ᾅδης dalam konteks penghakiman akhir
  choice: Hades
  alternative: alam orang mati; neraka
  rationale: '''Hades'' menjaga perbedaan leksikal antara ᾅδης dan gambaran hukuman akhir seperti lautan api dalam konteks terdekat. ''Neraka'' akan memasukkan asosiasi teologis yang tidak dituntut oleh istilah Yunani.'
- issue: Personifikasi θάνατος
  choice: Maut
  alternative: kematian
  rationale: '''Maut'' secara alami menandai kuasa yang dipersonifikasikan bersama Hades dalam gambaran apokaliptik, tanpa membuat klaim doktrinal tambahan.'
- issue: Dasar penghakiman κατὰ τὰ ἔργα αὐτῶν
  choice: menurut perbuatan mereka
  alternative: berdasarkan apa yang telah mereka lakukan; menurut pekerjaan mereka
  rationale: Pilihan ini mempertahankan hubungan yang dinyatakan teks antara penghakiman dan perbuatan, tanpa menjelaskan mekanisme atau implikasi soteriologisnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang lugas dan khidmat. Pengulangan struktur sumber dipertahankan sejauh tetap alami; 'keduanya' dipakai untuk memperjelas rujukan jamak kepada Maut dan Hades.
