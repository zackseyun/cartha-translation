id: REV.20.3
reference: Revelation 20:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν αὐτὸν εἰς τὴν ἄβυσσον, καὶ ἔκλεισεν καὶ ἐσφράγισεν ἐπάνω αὐτοῦ, ἵνα μὴ ⸀πλανήσῃ ἔτι τὰ ἔθνη, ἄχρι τελεσθῇ τὰ χίλια ἔτη· ⸀μετὰ ταῦτα δεῖ ⸂λυθῆναι αὐτὸν⸃ μικρὸν χρόνον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/003.yaml
  text: And he threw him into the abyss[a], and shut it and sealed it over him, so that he might no longer deceive the nations until the thousand years were finished[c][b]. After these things he must be released for a short time.
translation:
  language: id
  text: Lalu ia melemparkan dia ke dalam jurang maut[a], menutup dan memeteraikan jurang itu di atasnya, supaya dia tidak lagi menyesatkan bangsa-bangsa sampai masa seribu tahun itu berakhir. Sesudah itu, dia harus dilepaskan untuk waktu yang singkat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lubang yang tak berdasar” untuk “jurang maut”.
    reason: lexical_alternative
  - marker: b
    text: Atau “untuk sementara waktu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλεν
  choice: melemparkan
  rationale: Bentuk aoris βάλλω menyatakan tindakan kuat memasukkan sasaran ke suatu tempat; “melemparkan” alami dan mempertahankan daya ungkapnya.
- source_word: ἄβυσσον
  choice: jurang maut
  rationale: Dalam Wahyu, ἄβυσσος merupakan istilah tempat apokaliptis. “Jurang maut” dikenal dalam bahasa Alkitab Indonesia dan tidak menyamakannya begitu saja dengan neraka.
- source_word: ἔκλεισεν καὶ ἐσφράγισεν ἐπάνω αὐτοῦ
  choice: menutupnya, dan memeteraikannya di atas dia
  rationale: Terjemahan ini mempertahankan kedua tindakan yang berbeda, yaitu menutup dan memeteraikan, serta hubungan ruang yang dinyatakan oleh ἐπάνω αὐτοῦ. Akhiran “-nya” merujuk pada jurang maut sebagai objek tersirat.
- source_word: ἵνα μὴ πλανήσῃ ἔτι τὰ ἔθνη
  choice: supaya dia tidak lagi menyesatkan bangsa-bangsa
  rationale: πλανάω berarti menyesatkan atau memperdaya; “menyesatkan” cocok dengan gambaran membawa bangsa-bangsa menyimpang, sedangkan ἔτι diterjemahkan “lagi”.
- source_word: ἄχρι τελεσθῇ τὰ χίλια ἔτη
  choice: sampai masa seribu tahun itu berakhir
  rationale: τελεσθῇ menunjukkan tercapainya akhir atau penyelesaian. Penambahan “masa” menghasilkan ungkapan Indonesia yang alami tanpa menentukan apakah seribu tahun itu harfiah atau simbolis.
- source_word: μετὰ ταῦτα
  choice: Sesudah itu
  rationale: Ungkapan ini menjadi peralihan waktu yang jelas dan alami dalam bahasa Indonesia.
- source_word: δεῖ λυθῆναι αὐτὸν
  choice: dia harus dilepaskan
  rationale: δεῖ mempertahankan unsur keharusan, sementara bentuk pasif λυθῆναι diterjemahkan “dilepaskan” tanpa menyebut pelaku yang tidak dinyatakan.
- source_word: μικρὸν χρόνον
  choice: untuk waktu yang singkat
  rationale: Frasa akusatif ini menyatakan durasi yang terbatas; terjemahan tersebut jelas dan wajar dalam bahasa Indonesia modern.
theological_decisions:
- issue: Sifat masa seribu tahun
  choice: Menerjemahkan τὰ χίλια ἔτη secara langsung sebagai “masa seribu tahun itu” tanpa penjelasan interpretatif.
  alternative: Menandainya secara eksplisit sebagai milenium harfiah atau sebagai masa panjang simbolis.
  rationale: Ayat ini tidak menjelaskan apakah angka tersebut harus dipahami secara harfiah atau simbolis, sehingga terjemahan membiarkan perdebatan eskatologis tetap terbuka.
- issue: Daya δεῖ dalam konteks apokaliptis
  choice: Menerjemahkannya dengan “harus”.
  alternative: Menjelaskannya sebagai ketetapan ilahi secara eksplisit atau sekadar keniscayaan alur.
  rationale: Bahasa Yunani menyatakan keharusan, tetapi ayat ini tidak merinci dasar atau mekanismenya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan tindakan dipertahankan dengan jelas, istilah apokaliptis tidak dijelaskan secara denominatif, dan semua penanda catatan kaki muncul dalam teks utama.
