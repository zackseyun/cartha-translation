id: REV.20.10
reference: Revelation 20:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ὁ διάβολος ὁ πλανῶν αὐτοὺς ἐβλήθη εἰς τὴν λίμνην τοῦ πυρὸς καὶ θείου, ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης, καὶ βασανισθήσονται ἡμέρας καὶ νυκτὸς εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/010.yaml
  text: And the devil[a], who was deceiving them, was thrown into the lake of fire and sulfur, where also the beast and the false prophet are[b], and they will be tormented day and night forever and ever.
translation:
  language: id
  text: Dan Iblis, yang menyesatkan mereka, dilemparkan ke dalam danau api dan belerang, tempat binatang buas dan nabi palsu itu juga berada.[a] Mereka akan disiksa siang dan malam selama-lamanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Yunani klausa ini tidak memiliki kata kerja; kata “berada” ditambahkan karena tersirat oleh konteks.
    reason: grammatical_clarification
  - marker: b
    text: Secara lebih harfiah, “untuk zaman-zaman dari zaman-zaman,” suatu ungkapan yang menegaskan durasi tanpa akhir.
    reason: lexical_alternative
lexical_decisions:
- source_word: διάβολος
  choice: Iblis
  rationale: Dalam kitab Wahyu kata ini berfungsi sebagai sebutan pribadi yang sudah dikenal bagi Satan, bukan sekadar kata umum yang berarti pemfitnah.
- source_word: ὁ πλανῶν αὐτοὺς
  choice: yang menyesatkan mereka
  rationale: Partisipel kini dengan kata sandang menggambarkan Iblis melalui kegiatannya yang terus berlangsung; bentuk ini alami dalam bahasa Indonesia dan tidak membatasi tindakan itu hanya pada satu saat.
- source_word: ἐβλήθη
  choice: dilemparkan
  rationale: Bentuk pasif ini menyatakan tindakan paksa dalam konteks penghukuman; 'dilemparkan' merupakan padanan Indonesia yang langsung dan wajar.
- source_word: λίμνην τοῦ πυρὸς καὶ θείου
  choice: danau api dan belerang
  rationale: '''Danau'' menerjemahkan λίμνη secara langsung, sedangkan ''belerang'' adalah istilah Indonesia modern bagi θεῖον dan mempertahankan gambaran sumber.'
- source_word: ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης
  choice: tempat binatang buas dan nabi palsu itu juga berada
  rationale: Bahasa Yunani tidak mencantumkan verba dalam klausa ini. 'Berada' melengkapinya secara alami dan menyatakan keberadaan yang tersirat tanpa mengubahnya menjadi peristiwa lampau.
- source_word: θηρίον
  choice: binatang buas
  rationale: Padanan ini mempertahankan unsur kebuasan dalam θηρίον dan cocok sebagai sebutan bagi tokoh apokaliptis tersebut.
- source_word: ψευδοπροφήτης
  choice: nabi palsu
  rationale: Ini adalah padanan langsung, jelas, dan lazim bagi gelar apokaliptis tersebut.
- source_word: βασανισθήσονται
  choice: mereka akan disiksa
  rationale: Bentuk pasif mendatang menyatakan penderitaan berat sebagai hukuman; 'disiksa' adalah ungkapan Indonesia yang ringkas dan kuat tanpa menentukan alat atau cara penyiksaan.
- source_word: ἡμέρας καὶ νυκτός
  choice: siang dan malam
  rationale: Ungkapan berpasangan ini menyatakan kesinambungan tanpa henti dan diterjemahkan dengan idiom Indonesia yang sama alaminya.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: selama-lamanya
  rationale: Ini merupakan padanan idiomatis Indonesia bagi ungkapan Yunani yang sangat menegaskan durasi tanpa akhir; bentuk harfiahnya dijelaskan dalam catatan.
theological_decisions:
- issue: Durasi penghukuman akhir dalam εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: selama-lamanya
  alternative: sepanjang zaman dari segala zaman
  rationale: Padanan utama menyampaikan daya idiom Yunani yang menegaskan durasi tanpa akhir, sedangkan catatan mempertahankan bentuk harfiahnya tanpa memasukkan kesimpulan doktrinal di luar ayat.
- issue: Verba tersirat dalam klausa ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης
  choice: berada
  alternative: pernah berada
  rationale: Teks Yunani tidak memiliki verba eksplisit. Bentuk kini 'berada' paling sesuai dengan konteks sebelumnya, ketika binatang buas dan nabi palsu telah dilemparkan ke sana, serta tidak mengubah keberadaan mereka menjadi masa lampau saja.
- issue: Rujukan jamak dalam βασανισθήσονται
  choice: mereka akan disiksa
  alternative: ia akan disiksa
  rationale: Verba Yunani berbentuk orang ketiga jamak dan secara gramatikal mencakup Iblis bersama binatang buas dan nabi palsu; terjemahan mempertahankan bentuk jamak itu tanpa memperluas pembahasan teologisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur dibuat alami bagi pembaca umum sambil mempertahankan urutan tindakan, citra apokaliptis, bentuk jamak, dan ketegasan durasi dalam teks Yunani.
