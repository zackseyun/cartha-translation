source:
  edition: SBLGNT
  text: καὶ ὁ θάνατος καὶ ὁ ᾅδης ἐβλήθησαν εἰς τὴν λίμνην τοῦ πυρός. οὗτος ὁ ⸂θάνατος ὁ δεύτερός⸃ ἐστιν, ἡ λίμνη τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/014.yaml
  text: And Death and Hades were thrown into the lake of fire. This is the second death[a], the lake of fire.
translation:
  language: id
  text: Dan Maut dan Hades[a] dilemparkan ke dalam danau api. Inilah kematian yang kedua, yaitu danau api.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kubur.” Istilah Yunaninya adalah “Hades,” yang dalam ayat ini dibedakan dari “danau api”; karena itu, “neraka,” meskipun dipakai oleh beberapa terjemahan, dapat menyesatkan dalam konteks ini.
    reason: alternatif_leksikal
lexical_decisions:
- source_word: θάνατος
  choice: Maut / kematian
  rationale: Dalam klausa pertama dipilih “Maut” untuk menyampaikan personifikasi apokaliptik ketika dipasangkan dengan Hades sebagai sesuatu yang dilemparkan. Dalam ungkapan “kematian yang kedua,” dipakai nomina umum karena frasa itu menamai suatu keadaan atau penghukuman.
- source_word: ᾅδης
  choice: Hades
  rationale: Transliterasi mempertahankan istilah Yunani dan membedakannya dari lautan api. Pilihan ini juga menghindari penyamaan langsung dengan “neraka” atau pembatasan makna menjadi sekadar “kubur.”
- source_word: ἐβλήθησαν
  choice: dilemparkan
  rationale: Bentuk pasif aoris βάλλω diterjemahkan secara alami dan tetap menyampaikan tindakan memasukkan secara kuat.
- source_word: λίμνη τοῦ πυρός
  choice: lautan api
  rationale: Ungkapan Indonesia yang lazim dan jelas untuk gambaran apokaliptik ini; diulang dalam klausa kedua sesuai pengulangan teks Yunani.
- source_word: οὗτος
  choice: Inilah
  rationale: Mempertahankan fungsi demonstratif dan pernyataan identifikasi secara ringkas serta alami dalam bahasa Indonesia.
- source_word: θάνατος ὁ δεύτερος
  choice: kematian yang kedua
  rationale: Menyampaikan konstruksi nomina berartikel dan adjektiva secara alami sambil mempertahankan istilah khas kitab Wahyu.
theological_decisions:
- issue: Penerjemahan ᾅδης dalam konteks penghakiman akhir
  choice: Hades
  alternative: alam maut; kubur; neraka
  rationale: Ayat ini membedakan Hades dari lautan api. Memakai “neraka” dapat melebur dua gambaran yang dibedakan teks, sedangkan “kubur” dapat terlalu mempersempit maknanya. Transliterasi menjaga ambiguitas dan pembedaan konseptual.
- issue: Personifikasi θάνατος
  choice: “Maut” dalam klausa pertama, “kematian” dalam ungkapan “kematian yang kedua”
  alternative: “kematian” pada kedua tempat; “Maut” pada kedua tempat
  rationale: Klausa pertama memperlakukan Maut dan Hades sebagai entitas yang dikenai tindakan, sedangkan klausa kedua menamai realitas eskatologis. Pembedaan kosakata menyampaikan daya sastra tanpa menambahkan klaim doktrinal.
- issue: Hubungan antara “kematian yang kedua” dan “lautan api”
  choice: yaitu lautan api
  alternative: tanda koma tanpa penghubung; titik dua
  rationale: Kata “yaitu” mengungkapkan hubungan aposisional-identifikatif yang tersirat dalam susunan Yunani dan membuat kalimat Indonesia dapat dipahami tanpa mengubah isi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Lautan api” dipertahankan sebagai ungkapan yang dikenal luas; “Hades” dipakai sebagai transliterasi teknis agar tidak disamakan dengan lautan api.
