id: REV.20.5
reference: Revelation 20:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀οἱ λοιποὶ τῶν νεκρῶν οὐκ ἔζησαν ἄχρι τελεσθῇ τὰ χίλια ἔτη. αὕτη ἡ ἀνάστασις ἡ πρώτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/005.yaml
  text: The rest of the dead did not come to life until the thousand years were finished[a]. This is the first resurrection.
translation:
  language: id
  text: Orang-orang mati lainnya tidak hidup kembali sampai masa seribu tahun itu berakhir.[a] Inilah kebangkitan pertama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak hidup sampai masa seribu tahun itu berakhir.”
    reason: Alternatif leksikal yang mempertahankan arti lebih harfiah dari ἔζησαν tanpa unsur 'kembali'.
lexical_decisions:
- source_word: οἱ λοιποὶ τῶν νεκρῶν
  choice: Orang-orang mati lainnya
  rationale: Ungkapan ini secara alami menyatakan mereka yang tersisa dari kelompok orang mati dan mempertahankan kontras dengan kelompok dalam ayat sebelumnya.
- source_word: οὐκ ἔζησαν
  choice: tidak hidup kembali
  rationale: Dalam konteks kebangkitan, bentuk aoris ἔζησαν paling wajar dipahami secara ingresif, yaitu mulai hidup atau hidup kembali. Pilihan ini tetap dekat dengan verba ζάω dan tidak memperinci cara kebangkitan.
- source_word: ἄχρι τελεσθῇ
  choice: sampai ... berakhir
  rationale: ἄχρι menandai batas waktu, sedangkan τελεσθῇ menyatakan bahwa masa tersebut mencapai penyelesaiannya. 'Berakhir' alami dalam bahasa Indonesia untuk suatu kurun waktu.
- source_word: τὰ χίλια ἔτη
  choice: masa seribu tahun itu
  rationale: Artikel Yunani menunjuk kepada periode seribu tahun yang sudah disebutkan. Penambahan 'masa' membuat ungkapan waktu ini alami, dan 'itu' menyampaikan sifat definitnya.
- source_word: αὕτη ἡ ἀνάστασις ἡ πρώτη
  choice: Inilah kebangkitan pertama
  rationale: Terjemahan langsung dan alami yang mempertahankan demonstratif serta istilah baku ἀνάστασις tanpa menentukan lebih jauh cakupan acuannya.
theological_decisions:
- issue: Acuan 'Inilah kebangkitan pertama'
  choice: Demonstratif dibiarkan menunjuk secara luas kepada kenyataan kebangkitan yang baru dibicarakan dalam konteks.
  alternative: Menentukannya secara sempit hanya bagi para martir dalam ayat 4, secara luas bagi semua orang benar yang mati, atau sebagai kebangkitan rohani.
  rationale: Bahasa Yunani tidak menjabarkan suatu skema milenial tertentu; terjemahan mempertahankan ketegangan penafsirannya.
- issue: Daya makna ἔζησαν dalam konteks ini
  choice: Diterjemahkan 'hidup kembali' sesuai konteks kebangkitan.
  alternative: Diterjemahkan hanya 'hidup' atau ditafsirkan secara eksplisit sebagai hidup secara rohani.
  rationale: Konteks terdekat mendukung makna mulai hidup kembali, tetapi teks tidak boleh diperluas menjadi pernyataan doktrinal yang lebih khusus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Orang-orang mati lainnya' jelas bagi pembaca umum; 'masa seribu tahun itu' mengacu secara alami pada periode yang telah disebutkan. Penanda catatan kaki [a] ditempatkan tepat setelah klausa yang diterangkannya.
