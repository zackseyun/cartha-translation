id: REV.20.11
reference: Revelation 20:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ εἶδον θρόνον μέγαν λευκὸν καὶ τὸν καθήμενον ⸂ἐπ’ αὐτοῦ⸃, οὗ ἀπὸ ⸀τοῦ προσώπου ἔφυγεν ἡ γῆ καὶ ὁ οὐρανός, καὶ τόπος οὐχ εὑρέθη αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/011.yaml
  text: And I saw a great white throne and the one seated on it[a], from whose presence the earth and heaven fled, and no place was found for them.
translation:
  language: id
  text: Lalu aku melihat sebuah takhta besar berwarna putih dan orang yang duduk di atasnya. Dari hadapannya[a] bumi dan langit melarikan diri, dan tidak ditemukan tempat bagi keduanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “dari wajahnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θρόνον μέγαν λευκὸν
  choice: sebuah takhta putih yang besar
  rationale: Mempertahankan warna dan kebesaran takhta dalam susunan bahasa Indonesia yang alami; 'besar' dapat menyiratkan ukuran sekaligus keagungan.
- source_word: τὸν καθήμενον ἐπ’ αὐτοῦ
  choice: Dia yang duduk di atasnya
  rationale: Menerjemahkan ungkapan partisipial secara langsung tanpa menyebutkan identitas sosok yang bertakhta; huruf kapital menandai rujukan ilahi yang tersirat dalam konteks tanpa menambahkan nama atau gelar.
- source_word: ἀπὸ τοῦ προσώπου
  choice: dari hadapan-Nya
  rationale: Ungkapan idiomatis Indonesia ini mempertahankan gambaran berada di depan wajah seseorang sekaligus menyampaikan makna 'dari hadirat-Nya' secara alami.
- source_word: ἔφυγεν
  choice: melarikan diri
  rationale: Mempertahankan citra aktif dan dramatis dari φεύγω, bukan menafsirkannya sebagai sekadar lenyap.
- source_word: ἡ γῆ καὶ ὁ οὐρανός
  choice: bumi dan langit
  rationale: Padanan baku dan alami dalam bahasa Indonesia untuk pasangan kosmis ini; 'langit' sesuai dengan konteks apokaliptik tanpa harus dijamakkan.
- source_word: τόπος οὐχ εὑρέθη αὐτοῖς
  choice: tidak ditemukan lagi tempat bagi keduanya
  rationale: Mempertahankan konstruksi pasif Yunani dan memperjelas bahwa αὐτοῖς merujuk kepada bumi dan langit; 'lagi' menyampaikan bahwa keduanya tidak lagi mempunyai tempat dalam penglihatan tersebut.
theological_decisions:
- issue: Identitas Dia yang duduk di atas takhta
  choice: Dibiarkan tidak disebutkan secara eksplisit sebagai 'Dia yang duduk di atasnya'.
  alternative: Menyebut-Nya secara khusus sebagai Allah, Bapa, Kristus, atau Hakim ilahi.
  rationale: Ayat Yunani hanya menggambarkan sosok tersebut dan tidak menyebutkan nama atau gelar-Nya, sehingga terjemahan tidak menyelesaikan identitas yang dibiarkan tersirat oleh teks.
- issue: Cara bumi dan langit tersingkir
  choice: Diterjemahkan secara personifikatif sebagai 'melarikan diri'.
  alternative: Menafsirkan peristiwa itu sebagai 'lenyap' atau 'musnah'.
  rationale: Kata ἔφυγεν secara harfiah menggambarkan tindakan melarikan diri; pilihan ini menjaga citra apokaliptik dan tidak menetapkan mekanisme atau hakikat akhir bumi dan langit.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Susunan kalimat dibagi menjadi dua agar gambaran penglihatan tetap jelas. Penulisan 'Dia' dan '-Nya' mengikuti kebiasaan ejaan Indonesia untuk rujukan ilahi, sedangkan identitas sosok itu sendiri tetap tidak dinyatakan secara eksplisit.
