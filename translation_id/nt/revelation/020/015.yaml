source:
  edition: SBLGNT
  text: καὶ εἴ τις οὐχ εὑρέθη ἐν ⸂τῇ βίβλῳ⸃ τῆς ζωῆς γεγραμμένος, ἐβλήθη εἰς τὴν λίμνην τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/015.yaml
  text: And if anyone was not found written in the book of life[b][a], he was thrown into the lake of fire.
translation:
  language: id
  text: Dan jika seseorang tidak didapati tertulis dalam kitab kehidupan[a], orang itu dilemparkan ke dalam danau api.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “gulungan kehidupan.” Kata Yunani yang digunakan dapat berarti kitab atau gulungan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τις
  choice: jika seseorang
  rationale: Ungkapan bersyarat tak tentu ini menunjuk kepada siapa saja yang memenuhi keadaan tersebut. “Jika seseorang” alami dalam bahasa Indonesia dan mempertahankan bentuk bersyarat teks Yunani.
- source_word: οὐχ εὑρέθη
  choice: tidak didapati
  rationale: Bentuk pasif aoris dari εὑρίσκω menyatakan bahwa orang tersebut tidak ditemukan atau tidak didapati dalam hasil pemeriksaan penghakiman. “Tidak didapati” mempertahankan nuansa pasif dan yudisial tanpa penjelasan tambahan.
- source_word: ἐν τῇ βίβλῳ τῆς ζωῆς
  choice: dalam kitab kehidupan
  rationale: βίβλος dapat berarti kitab atau gulungan. “Kitab kehidupan” merupakan ungkapan yang jelas, bermartabat, dan lazim dalam bahasa Indonesia, sedangkan kemungkinan “gulungan” dicatat dalam catatan kaki.
- source_word: γεγραμμένος
  choice: tertulis
  rationale: Partisipel pasif perfek dari γράφω menggambarkan keadaan yang telah tercatat dan tetap berlaku. “Tertulis” adalah padanan langsung dan mempertahankan gambaran teks sumber.
- source_word: ἐβλήθη
  choice: dilemparkan
  rationale: Bentuk pasif aoris dari βάλλω menyatakan tindakan memasukkan dengan paksa. “Dilemparkan” jelas dan tidak menambah intensitas yang tidak dinyatakan.
- source_word: εἰς τὴν λίμνην τοῦ πυρός
  choice: ke dalam lautan api
  rationale: “Lautan api” adalah ungkapan apokaliptik yang mapan dan mudah dipahami dalam bahasa Indonesia untuk λίμνη τοῦ πυρός, tanpa menafsirkan hakikat hukuman tersebut.
- source_word: τις ... γεγραμμένος / ἐβλήθη
  choice: seseorang ... orang itu
  rationale: Bahasa Yunani memakai bentuk tunggal maskulin secara representatif. Bahasa Indonesia tidak menandai gender pada “seseorang” atau “orang itu”; pengulangan “orang itu” memperjelas rujukan tunggal secara alami tanpa menambahkan jenis kelamin.
theological_decisions:
- issue: Bentuk tunggal representatif dan gender
  choice: seseorang ... orang itu
  alternative: ia
  rationale: Teks Yunani berbentuk tunggal maskulin secara gramatikal, tetapi pronomina dan nomina rujukan dalam bahasa Indonesia tidak bergender. “Orang itu” mempertahankan rujukan individual tunggal serta menghindari ambiguitas tanpa menetralkan atau menambahkan gender.
- issue: Gambaran penghakiman terakhir
  choice: lautan api
  alternative: danau api
  rationale: Terjemahan mempertahankan gambaran apokaliptik sebagai gambaran, tanpa menjelaskan sifat, lama, atau mekanisme hukuman akhir menurut tafsiran denominasi tertentu.
- issue: Orang yang didapati tertulis
  choice: seseorang tidak didapati tertulis
  alternative: nama seseorang tidak didapati tertulis
  rationale: Teks Yunani secara langsung menyatakan bahwa seseorang tidak didapati dalam keadaan tertulis, bukan secara eksplisit menyebut “nama”. Susunan utama mempertahankan bentuk sumber dan membiarkan metonimia itu tetap tersirat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan “didapati tertulis” sengaja dipertahankan karena cukup alami dalam ragam formal sekaligus dekat dengan struktur dan gambaran teks Yunani. “Orang itu” dipakai sebagai rujukan tunggal yang jelas dan tidak bergender.
