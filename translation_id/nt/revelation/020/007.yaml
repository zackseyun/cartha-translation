id: REV.20.7
reference: Revelation 20:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ὅταν τελεσθῇ τὰ χίλια ἔτη, λυθήσεται ὁ Σατανᾶς ἐκ τῆς φυλακῆς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/007.yaml
  text: And when the thousand years are completed, Satan will be released from his prison,
translation:
  language: id
  text: Ketika masa seribu tahun itu berakhir, Iblis akan dilepaskan dari penjaranya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: ketika
  rationale: Menandai anak kalimat waktu dengan acuan masa depan yang diharapkan; “ketika” menyampaikan urutan waktu tanpa menambahkan tafsiran.
- source_word: τελεσθῇ
  choice: berakhir
  rationale: Bentuk pasif τελέω menyatakan selesainya suatu kurun yang telah ditentukan. Dalam bahasa Indonesia, “masa ... berakhir” merupakan ungkapan alami yang tetap menyampaikan tercapainya batas akhir periode itu.
- source_word: τὰ χίλια ἔτη
  choice: masa seribu tahun itu
  rationale: Artikel Yunani menunjuk pada periode seribu tahun yang telah disebut sebelumnya. Kata “masa” membuat frasa Indonesia alami, sedangkan “itu” mempertahankan sifat definitnya tanpa menentukan apakah angka tersebut harfiah atau simbolis.
- source_word: λυθήσεται
  choice: akan dilepaskan
  rationale: Mempertahankan bentuk pasif futurum dan secara wajar menggambarkan pembebasan dari kurungan, tanpa konotasi positif yang tidak dinyatakan teks.
- source_word: ὁ Σατανᾶς
  choice: Iblis
  rationale: “Iblis” adalah sebutan baku dan luas dipahami dalam bahasa Indonesia bagi Σατανᾶς; konteks dan artikel menunjukkan tokoh tertentu.
- source_word: ἐκ τῆς φυλακῆς αὐτοῦ
  choice: dari penjaranya
  rationale: Dalam konteks pengurungan, φυλακή berarti “penjara”. Bentuk “penjaranya” mempertahankan unsur posesif αὐτοῦ secara ringkas dan alami.
theological_decisions:
- issue: Sifat masa seribu tahun
  choice: Menerjemahkannya secara langsung sebagai “masa seribu tahun itu” tanpa menetapkan apakah periode tersebut harfiah atau simbolis.
  alternative: Menjelaskannya sebagai pemerintahan seribu tahun secara harfiah atau sebagai masa panjang yang simbolis.
  rationale: Ayat ini menyebut periode tertentu, tetapi tidak dengan sendirinya memutuskan di antara berbagai pandangan tentang milenium. Terjemahan mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan urutan temporal dan bentuk pasif teks Yunani.
