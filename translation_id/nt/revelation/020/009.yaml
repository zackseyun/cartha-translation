id: REV.20.9
reference: Revelation 20:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἀνέβησαν ἐπὶ τὸ πλάτος τῆς γῆς, καὶ ⸀ἐκύκλευσαν τὴν παρεμβολὴν τῶν ἁγίων καὶ τὴν πόλιν τὴν ἠγαπημένην. καὶ κατέβη πῦρ ⸂ἐκ τοῦ οὐρανοῦ⸃ καὶ κατέφαγεν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/009.yaml
  text: And they came up over the breadth of the earth and surrounded the camp of the saints and the beloved city[c][b][a]. And fire came down from heaven and consumed them.
translation:
  language: id
  text: Mereka maju melintasi luasnya bumi dan mengepung perkemahan orang-orang kudus serta kota yang dikasihi.[a] Lalu turunlah api dari langit dan menghanguskan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks tidak menyebutkan secara eksplisit kota mana yang dimaksud dengan “kota yang dikasihi”. Kota ini sering dipahami sebagai Yerusalem atau, secara lebih luas, kota Allah.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέβησαν
  choice: maju
  rationale: Secara harfiah dapat berarti 'naik', tetapi dalam konteks gerakan pasukan menuju sasaran, 'maju' menyampaikan gerakan tersebut secara alami tanpa menetapkan geografi tertentu.
- source_word: ἐπὶ τὸ πλάτος τῆς γῆς
  choice: melintasi luasnya bumi
  rationale: Mempertahankan gagasan πλάτος sebagai keluasan atau bentangan yang lebar tanpa menambahkan unsur 'dataran' yang tidak dinyatakan dalam bahasa Yunani.
- source_word: ἐκύκλευσαν
  choice: mengepung
  rationale: Kata ini berarti mengelilingi; dalam konteks pasukan yang mengitari perkemahan dan kota, 'mengepung' merupakan padanan Indonesia yang wajar dan tepat.
- source_word: παρεμβολὴν
  choice: perkemahan
  rationale: Menunjuk pada kamp atau tempat berkemah, sering dalam konteks militer. 'Perkemahan' mempertahankan citra itu tanpa menambahkan kata 'tentara'.
- source_word: τῶν ἁγίων
  choice: orang-orang kudus
  rationale: Padanan baku dan mudah dipahami bagi bentuk jamak substantival ἅγιοι, sekaligus menjaga kesinambungan istilah dalam Perjanjian Baru.
- source_word: τὴν πόλιν τὴν ἠγαπημένην
  choice: kota yang dikasihi
  rationale: Mempertahankan bentuk pasif ἠγαπημένην tanpa menyebut secara eksplisit siapa yang mengasihi kota itu.
- source_word: κατέβη πῦρ ἐκ τοῦ οὐρανοῦ
  choice: turunlah api dari langit
  rationale: Susunan yang alami dan bermartabat dalam bahasa Indonesia serta dekat dengan gambaran teks sumber.
- source_word: κατέφαγεν αὐτούς
  choice: menghanguskan mereka
  rationale: Dengan api sebagai subjek, 'menghanguskan' secara alami menyampaikan arti idiomatis 'melahap habis' atau 'membinasakan' tanpa memakai metafora makan yang janggal.
theological_decisions:
- issue: Identitas 'kota yang dikasihi'
  choice: Tidak mengidentifikasi kota tersebut dalam teks utama.
  alternative: Yerusalem; atau kota/umat Allah dalam penggenapan eskatologis.
  rationale: Teks Yunani tidak menamai kota itu. Terjemahan generik mempertahankan ambiguitas dan ketegangan teologis teks.
- issue: Pelaku yang mengasihi kota
  choice: Menggunakan bentuk pasif 'yang dikasihi' tanpa menambahkan 'Allah'.
  alternative: kota yang dikasihi Allah
  rationale: Walaupun Allah dapat dipahami sebagai pelaku tersirat, teks tidak menyatakannya secara eksplisit; pelaku tidak perlu ditambahkan ke dalam terjemahan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Maju melintasi luasnya bumi' menjaga gambaran bentangan luas sambil menghindari tambahan 'dataran'. Penanda catatan kaki ditempatkan segera setelah frasa yang diterangkan.
