  to: Lalu aku melihat seorang malaikat turun dari surga, membawa kunci jurang tak berdasar[a] dan sebuah rantai besar di tangannya.
  rationale: Revisi mengganti "jurang maut" dengan "jurang tak berdasar" agar ἄβυσσος diterjemahkan tanpa menambahkan unsur maut. Susunan kalimat disatukan dan "Ia memegang" diganti dengan "membawa" untuk mencerminkan dua partisip yang sama-sama menerangkan malaikat itu, sambil tetap alami dalam bahasa Indonesia.
