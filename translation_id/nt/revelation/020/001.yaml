  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἄγγελον καταβαίνοντα ἐκ τοῦ οὐρανοῦ, ἔχοντα τὴν κλεῖν τῆς ἀβύσσου καὶ ἅλυσιν μεγάλην ἐπὶ τὴν χεῖρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/001.yaml
  text: And I saw an angel coming down from heaven[a], holding the key to the abyss and a great chain in his hand.
translation:
  language: id
  text: Lalu aku melihat seorang malaikat turun dari surga, membawa kunci jurang tak berdasar[a] dan sebuah rantai besar di tangannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Yunani: abussos, “abis”. Istilah ini juga sering diterjemahkan “jurang maut”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Lalu
  rationale: Dalam rangkaian penglihatan Yohanes, kata penghubung ini secara alami menandai kelanjutan adegan. “Lalu” mempertahankan alur naratif tanpa menambahkan hubungan sebab-akibat.
- source_word: εἶδον
  choice: aku melihat
  rationale: Bentuk aoris ὁράω dalam narasi penglihatan diterjemahkan langsung dan wajar sebagai “aku melihat”.
- source_word: ἄγγελον
  choice: seorang malaikat
  rationale: Dalam konteks Wahyu, yang dimaksud adalah makhluk surgawi, bukan sekadar utusan manusia.
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: turun dari surga
  rationale: Ungkapan ini menyampaikan gerak dari surga secara ringkas dan alami dalam bahasa Indonesia.
- source_word: ἔχοντα
  choice: Ia memegang
  rationale: Partisip Yunani menunjukkan bahwa malaikat itu membawa atau menguasai kunci dan rantai. Kalimat baru dengan “Ia memegang” menghindari susunan bertumpuk dan tetap mempertahankan hubungan dengan subjek.
- source_word: τὴν κλεῖν τῆς ἀβύσσου
  choice: kunci jurang maut
  rationale: Genitif menyatakan kunci yang berkaitan dengan atau membuka ἄβυσσος. “Kunci jurang maut” merupakan ungkapan Indonesia yang ringkas dan lazim.
- source_word: ἅλυσιν μεγάλην
  choice: sebuah rantai besar
  rationale: ἅλυσις berarti rantai, sedangkan μεγάλην menunjukkan ukuran atau kebesarannya tanpa perlu menambahkan kesan seperti “sangat berat”.
- source_word: ἐπὶ τὴν χεῖρα αὐτοῦ
  choice: di tangannya
  rationale: Walaupun secara harfiah dapat berarti “pada tangannya”, konteksnya menunjukkan benda yang dibawa atau dipegang; “di tangannya” adalah padanan Indonesia yang idiomatis.
theological_decisions:
- issue: Pemaknaan ἄβυσσος dalam gambaran apokaliptik
  choice: jurang maut
  alternative: jurang yang tak berdasar; abis
  rationale: “Jurang maut” mempertahankan gagasan tempat kedalaman dunia bawah yang mengerikan dan sudah dapat dipahami pembaca Indonesia, tanpa memastikan secara harfiah bahwa jurang itu tidak memiliki dasar. Catatan kaki menyebut bentuk Yunani agar gambaran sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Parataksis Yunani dibagi menjadi dua kalimat agar alami, sedangkan urutan unsur penglihatan dan citra konkret dipertahankan.
