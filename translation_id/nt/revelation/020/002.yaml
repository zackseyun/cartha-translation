id: REV.20.2
reference: Revelation 20:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐκράτησεν τὸν δράκοντα, ⸂ὁ ὄφις ὁ ἀρχαῖος⸃, ὅς ἐστιν Διάβολος καὶ ὁ ⸀Σατανᾶς, καὶ ἔδησεν αὐτὸν χίλια ἔτη,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/002.yaml
  text: And he seized the dragon—that ancient serpent[a], who is the Devil and Satan—and bound him for a thousand years,
translation:
  language: id
  text: Lalu ia menangkap naga itu—ular purba itu[a], yang adalah Iblis dan Satan—dan mengikatnya selama seribu tahun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ular zaman dahulu itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκράτησεν
  choice: menangkap
  rationale: Dalam konteks ini, κρατέω menyatakan tindakan memegang atau menguasai dengan kuat. “Menangkap” singkat, tegas, dan alami dalam bahasa Indonesia serta menampilkan tindakan yang menentukan.
- source_word: δράκοντα
  choice: naga
  rationale: Padanan baku bagi δράκων dalam konteks apokaliptik dan mempertahankan kesinambungan gambaran dalam Kitab Wahyu.
- source_word: ὁ ὄφις ὁ ἀρχαῖος
  choice: ular purba itu
  rationale: Frasa ini merupakan aposisi yang mengidentifikasi naga. “Purba” menyampaikan makna ἀρχαῖος secara ringkas, sedangkan “itu” menandai identifikasi tertentu secara alami.
- source_word: Διάβολος
  choice: Iblis
  rationale: Padanan gelar yang lazim dan mudah dipahami dalam bahasa Indonesia; bentuk tanpa artikel sesuai dengan tata bahasa Indonesia.
- source_word: Σατανᾶς
  choice: Satan
  rationale: Transliterasi baku nama atau gelar tersebut dalam bahasa Indonesia.
- source_word: ἔδησεν
  choice: mengikatnya
  rationale: Menerjemahkan makna konkret δέω dan mempertahankan gambaran pengikatan tanpa menafsirkan lebih jauh bentuk pengekangannya.
- source_word: χίλια ἔτη
  choice: selama seribu tahun
  rationale: “Selama” menyatakan akusatif durasi secara alami, sementara “seribu tahun” mempertahankan ungkapan sumber tanpa melemahkan atau menafsirkannya.
theological_decisions:
- issue: Hakikat seribu tahun
  choice: Menerjemahkan χίλια ἔτη secara langsung sebagai “seribu tahun”.
  alternative: Menafsirkannya secara eksplisit sebagai masa harfiah atau sebagai masa simbolis.
  rationale: Teks menyebut durasinya tanpa menjelaskan apakah harus dipahami secara harfiah atau simbolis; terjemahan mempertahankan ketegangan itu.
- issue: Identitas naga
  choice: 'Mempertahankan seluruh rangkaian identifikasi: naga, ular purba, Iblis, dan Satan.'
  alternative: Menyederhanakan rangkaian tersebut menjadi satu sebutan saja.
  rationale: Ayat itu sendiri menyatakan semua identifikasi tersebut, sehingga masing-masing perlu dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Tanda pisah mempertahankan aposisi penjelas dalam teks Yunani. Kata ganti “ia” dibiarkan mengikuti konteks ayat sebelumnya tanpa menambahkan identitas pelaku.
