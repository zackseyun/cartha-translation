id: REV.20.12
reference: Revelation 20:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἶδον τοὺς νεκρούς, τοὺς μεγάλους καὶ τοὺς μικρούς, ἑστῶτας ἐνώπιον τοῦ θρόνου, καὶ βιβλία ἠνοίχθησαν· καὶ ἄλλο βιβλίον ἠνοίχθη, ὅ ἐστιν τῆς ζωῆς· καὶ ἐκρίθησαν οἱ νεκροὶ ἐκ τῶν γεγραμμένων ἐν τοῖς βιβλίοις κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/012.yaml
  text: And I saw the dead[a], the great and the small, standing before the throne, and books were opened. And another book was opened, which is the book of life. And the dead were judged from what had been written in the books[b], according to their works.
translation:
  language: id
  text: Dan aku melihat orang-orang mati, yang besar maupun yang kecil, berdiri di hadapan takhta itu. Buku-buku[a] dibuka. Sebuah buku lain juga dibuka, yaitu buku kehidupan. Orang-orang mati itu dihakimi berdasarkan apa yang telah tertulis di dalam buku-buku itu, menurut perbuatan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '"Buku-buku" juga dapat diterjemahkan "gulungan", sesuai dengan media tulis pada zaman itu.'
    reason: cultural_note
lexical_decisions:
- source_word: νεκρούς / νεκροὶ
  choice: orang-orang mati
  rationale: Adjektiva yang dipakai sebagai nomina ini menunjuk secara kolektif kepada orang yang telah mati. Bentuk ini jelas dan alami dalam bahasa Indonesia serta mempertahankan nuansa khidmat.
- source_word: μεγάλους καὶ τοὺς μικρούς
  choice: yang besar maupun yang kecil
  rationale: Ungkapan merismatis ini mencakup semua orang tanpa membedakan kedudukan. Terjemahan harfiah yang wajar ini tidak mempersempit maknanya menjadi kategori sosial tertentu.
- source_word: ἑστῶτας
  choice: berdiri
  rationale: Partisipel perfek ἵστημι menyatakan keadaan yang sedang berlangsung sebagai hasil dari tindakan sebelumnya; 'berdiri' menyampaikan postur mereka secara alami.
- source_word: ἐνώπιον τοῦ θρόνου
  choice: di hadapan takhta itu
  rationale: ἐνώπιον berarti berada di hadapan atau dalam kehadiran. 'Takhta' dipertahankan tanpa mengubahnya menjadi 'kursi pengadilan', yang akan menambahkan tafsiran.
- source_word: βιβλία
  choice: buku-buku
  rationale: '''Buku-buku'' merupakan padanan umum dan mudah dipahami, sementara catatan kaki menjelaskan kemungkinan bentuk fisiknya dalam dunia kuno.'
- source_word: ἠνοίχθησαν / ἠνοίχθη
  choice: dibuka
  rationale: Bentuk pasif aoris dari ἀνοίγω diterjemahkan langsung sebagai 'dibuka'; 'dibuka meterainya' akan terlalu spesifik.
- source_word: ἄλλο βιβλίον
  choice: sebuah buku lain
  rationale: ἄλλο memperkenalkan satu buku tambahan yang berbeda dari buku-buku sebelumnya.
- source_word: ὅ ἐστιν τῆς ζωῆς
  choice: yaitu buku kehidupan
  rationale: Frasa Yunani bersifat eliptis, dengan βιβλίον dipahami. Pengulangan 'buku' diperlukan agar ungkapannya jelas dan alami dalam bahasa Indonesia.
- source_word: ἐκρίθησαν
  choice: dihakimi
  rationale: κρίνω di sini menyatakan tindakan pengadilan. 'Dihakimi' mempertahankan arti yudisial tanpa mengandaikan terlebih dahulu bahwa hasilnya selalu penghukuman.
- source_word: ἐκ τῶν γεγραμμένων ἐν τοῖς βιβλίοις
  choice: berdasarkan apa yang telah tertulis di dalam buku-buku itu
  rationale: ἐκ menunjukkan dasar atau sumber penghakiman, sedangkan partisipel perfek γεγραμμένων menyatakan catatan yang sudah tertulis. 'Telah tertulis' mempertahankan aspek tersebut secara wajar.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: menurut perbuatan mereka
  rationale: ἔργα di sini menunjuk pada tindakan yang dilakukan. 'Perbuatan' lebih alami dan tepat daripada 'pekerjaan' dalam konteks penghakiman, sedangkan 'menurut' mempertahankan gagasan kesesuaian dalam κατά.
theological_decisions:
- issue: Penghakiman menurut perbuatan
  choice: menurut perbuatan mereka
  alternative: menurut apa yang telah mereka lakukan
  rationale: Ayat ini secara eksplisit menyatakan bahwa penghakiman berlangsung menurut perbuatan mereka. Terjemahan mempertahankan pernyataan tersebut tanpa melunakkannya atau menyelaraskannya secara tersirat dengan rumusan doktrinal lain.
- issue: Arti tindakan menghakimi
  choice: dihakimi
  alternative: dihukum
  rationale: ἐκρίθησαν menyatakan penghakiman yudisial, tetapi tidak dengan sendirinya menentukan putusannya. Karena itu, 'dihakimi' mempertahankan keterbukaan makna yang ada dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat dibuat alami tanpa menghilangkan pengulangan penting dalam teks Yunani. Artikel pada τοῦ θρόνου dan τοῖς βιβλίοις ditampilkan dengan 'itu' ketika rujukannya tertentu. Catatan kaki alternatif pada lapisan konsultasi Inggris yang ditempatkan sesudah 'the dead' tidak diadopsi karena isinya sebenarnya berkaitan dengan ἔργα dan tidak sesuai dengan lokasi penandanya.
