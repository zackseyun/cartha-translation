id: REV.20.4
reference: Revelation 20:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ εἶδον θρόνους, καὶ ἐκάθισαν ἐπ’ αὐτούς, καὶ κρίμα ἐδόθη αὐτοῖς, καὶ τὰς ψυχὰς τῶν πεπελεκισμένων διὰ τὴν μαρτυρίαν Ἰησοῦ καὶ διὰ τὸν λόγον τοῦ θεοῦ, καὶ οἵτινες οὐ προσεκύνησαν τὸ θηρίον οὐδὲ τὴν εἰκόνα αὐτοῦ καὶ οὐκ ἔλαβον τὸ χάραγμα ἐπὶ τὸ μέτωπον καὶ ἐπὶ τὴν χεῖρα αὐτῶν· καὶ ἔζησαν καὶ ἐβασίλευσαν μετὰ τοῦ χριστοῦ ⸀χίλια ἔτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/004.yaml
  text: And I saw thrones[a], and they sat on them, and judgment was given to them, and the souls of those who had been beheaded because of the testimony of Jesus and because of the word of God, and those who had not worshiped the beast or its image and had not received the mark on their forehead and on their hand[b]; and they came to life and reigned with the Messiah for a thousand years.
translation:
  language: id
  text: Lalu aku melihat takhta-takhta, dan mereka duduk di atasnya. Penghakiman diberikan kepada mereka. Aku juga melihat jiwa-jiwa orang yang telah dipenggal kepalanya karena kesaksian Yesus[a] dan karena firman Allah, serta mereka yang tidak menyembah binatang itu ataupun gambarnya dan tidak menerima tanda pada dahi dan pada tangan mereka. Mereka hidup kembali dan memerintah bersama Mesias[b] selama seribu tahun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Yunani “kesaksian Yesus” dapat berarti kesaksian yang diberikan oleh Yesus atau kesaksian tentang Yesus.
    reason: alternative_reading
  - marker: b
    text: Atau, “bersama Kristus.” Gelar Yunani Χριστός diterjemahkan “Mesias” di sini karena berfungsi sebagai gelar.
    reason: lexical_alternative
lexical_decisions:
- source_word: θρόνους
  choice: takhta-takhta
  rationale: Bentuk jamak dipertahankan secara eksplisit, dengan makna konkret yang langsung.
- source_word: ἐκάθισαν ἐπ’ αὐτούς
  choice: mereka duduk di atasnya
  rationale: Subjek jamak tetap tidak disebutkan identitasnya, sebagaimana dalam bahasa Yunani; bentuk aktif juga dipertahankan.
- source_word: κρίμα ἐδόθη αὐτοῖς
  choice: penghakiman diberikan kepada mereka
  rationale: Ungkapan ini mempertahankan keluasan makna κρίμα, yang dapat menunjuk pada penghakiman, putusan, atau kewenangan untuk menghakimi, tanpa mempersempitnya secara tafsir.
- source_word: ψυχὰς
  choice: jiwa-jiwa
  rationale: Pilihan ini mempertahankan gambaran penglihatan apokaliptis dan kaitannya dengan kematian mereka sebelum menjadi hidup.
- source_word: πεπελεκισμένων
  choice: telah dipenggal kepalanya
  rationale: Mengungkapkan secara alami dan tepat jenis eksekusi yang dimaksud tanpa menambahkan alat pelaksanaannya.
- source_word: διὰ τὴν μαρτυρίαν Ἰησοῦ
  choice: karena kesaksian Yesus
  rationale: 'διά dengan akusatif menyatakan sebab. Bentuk ''kesaksian Yesus'' mempertahankan ambiguitas genitif: kesaksian yang diberikan oleh Yesus atau kesaksian tentang Yesus.'
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: karena firman Allah
  rationale: Menyampaikan hubungan sebab dan memakai padanan baku yang wajar untuk λόγος τοῦ θεοῦ.
- source_word: οἵτινες
  choice: mereka yang
  rationale: Mempertahankan fungsi pengenal kelompok tanpa memaksakan apakah kelompok ini sama persis dengan para martir yang baru disebut atau kelompok tambahan.
- source_word: προσεκύνησαν
  choice: menyembah
  rationale: Mengungkapkan makna religius kata kerja tersebut, bukan sekadar gerakan fisik bersujud.
- source_word: θηρίον
  choice: binatang itu
  rationale: Padanan langsung bagi istilah apokaliptis θηρίον; kata penunjuk membuat rujukan definitnya alami dalam bahasa Indonesia.
- source_word: εἰκόνα
  choice: patungnya
  rationale: Dalam konteks objek penyembahan, 'patung' terdengar alami dan konkret, sambil tetap menunjuk representasi binatang itu tanpa memakai istilah tafsiran 'berhala'.
- source_word: χάραγμα
  choice: tanda
  rationale: Padanan yang jelas dan mapan dalam konteks Wahyu, tanpa menentukan apakah bentuknya cap, merek, atau ukiran.
- source_word: ἔζησαν
  choice: hidup kembali
  rationale: Mengungkapkan daya eventif kata kerja dalam konteks jiwa orang-orang yang telah dibunuh, tanpa menjelaskan lebih jauh sifat kebangkitan tersebut.
- source_word: ἐβασίλευσαν
  choice: memerintah
  rationale: Padanan verbal yang langsung dan alami untuk tindakan memerintah sebagai raja.
- source_word: τοῦ χριστοῦ
  choice: Mesias
  rationale: Χριστός berfungsi sebagai gelar di sini, sehingga diterjemahkan 'Mesias' dan bukan diperlakukan hanya sebagai nama diri.
- source_word: χίλια ἔτη
  choice: seribu tahun
  rationale: Terjemahan langsung yang tidak menambahkan penafsiran mengenai sifat atau kronologi masa tersebut.
theological_decisions:
- issue: Identitas subjek ἐκάθισαν dan penerima penghakiman
  choice: Dibiarkan tidak tertentu sebagai 'mereka' tanpa identifikasi tambahan.
  alternative: Para martir, semua orang kudus, para rasul, atau tokoh-tokoh sidang surgawi.
  rationale: Bahasa Yunani tidak menyebutkan subjeknya secara eksplisit; memberi identitas tertentu akan menyelesaikan ambiguitas yang dipertahankan teks.
- issue: Makna διὰ τὴν μαρτυρίαν Ἰησοῦ
  choice: '''karena kesaksian Yesus'' dalam teks utama, dengan alternatif dijelaskan dalam catatan kaki.'
  alternative: '''karena kesaksian mereka tentang Yesus'' atau ''karena kesaksian yang diberikan Yesus''.'
  rationale: Genitif Ἰησοῦ dapat dipahami secara subjektif atau objektif, dan teks utama tidak memaksakan salah satunya.
- issue: Hubungan para martir dengan mereka yang tidak menyembah binatang
  choice: Dihubungkan dengan 'serta mereka yang', tanpa menyatakan tegas apakah ini kelompok yang sama atau kelompok tambahan.
  alternative: Mengidentifikasi semua yang tidak menyembah binatang sebagai para martir yang telah dipenggal, atau sebagai kelompok kedua yang terpisah.
  rationale: Struktur Yunani memungkinkan perdebatan mengenai cakupan kelompok; terjemahan menjaga susunan koordinatifnya.
- issue: Makna ἔζησαν
  choice: '''mereka hidup kembali''.'
  alternative: '''mereka hidup'', ''mereka menjadi hidup'', atau penjelasan eksplisit tentang jenis kebangkitan.'
  rationale: Konteks kematian mendukung makna eventif, tetapi terjemahan tidak menambahkan uraian doktrinal tentang sifat kebangkitan.
- issue: Fungsi Χριστός
  choice: '''Mesias'' sebagai gelar.'
  alternative: '''Kristus''.'
  rationale: Dalam frasa 'bersama sang Χριστός', istilah tersebut berfungsi jelas sebagai gelar dan dapat diterjemahkan secara transparan.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat digunakan dengan susunan kalimat yang tetap mudah dibaca. Pengulangan 'pada' dalam 'pada dahi dan pada tangan mereka' mempertahankan bentuk sumber dan menghindari penghalusan menjadi 'atau'. Penanda catatan kaki ditempatkan tepat setelah frasa yang dijelaskan.
