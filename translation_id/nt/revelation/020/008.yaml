id: REV.20.8
reference: Revelation 20:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐξελεύσεται πλανῆσαι τὰ ἔθνη τὰ ἐν ταῖς τέσσαρσι γωνίαις τῆς γῆς, τὸν Γὼγ ⸀καὶ Μαγώγ, συναγαγεῖν αὐτοὺς εἰς τὸν πόλεμον, ὧν ὁ ἀριθμὸς ⸀αὐτῶν ὡς ἡ ἄμμος τῆς θαλάσσης.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/008.yaml
  text: and he will go out to deceive the nations at the four corners of the earth—Gog and Magog—and to gather them for war[c][b][a], whose number is like the sand of the sea.
translation:
  language: id
  text: Ia akan keluar untuk menyesatkan[a] bangsa-bangsa yang berada di keempat penjuru bumi—Gog dan Magog[b]—dan mengumpulkan mereka untuk berperang.[c] Jumlah mereka seperti pasir di tepi laut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memperdaya.”
    reason: lexical_alternative
  - marker: b
    text: “Gog dan Magog” menggemakan Yehezkiel 38–39 dan dapat berfungsi sebagai sebutan tipologis bagi bangsa-bangsa yang dihimpun dalam pemberontakan terakhir.
    reason: cross_reference
  - marker: c
    text: Atau “untuk perang” atau “untuk pertempuran itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελεύσεται
  choice: ia akan keluar
  rationale: Bentuk futur ἐξέρχομαι menggambarkan keluarnya Satan setelah dilepaskan dalam ayat sebelumnya. Subjek tersirat dipertahankan dengan pronomina tanpa mengulang namanya.
- source_word: πλανῆσαι
  choice: untuk menyesatkan
  rationale: πλανάω dapat berarti menyesatkan atau memperdaya. 'Menyesatkan' alami dalam konteks Wahyu dan mempertahankan gagasan membawa pihak lain menyimpang.
- source_word: τὰ ἔθνη
  choice: bangsa-bangsa
  rationale: ἔθνη di sini menunjuk kelompok-kelompok bangsa secara luas, bukan secara khusus orang bukan Yahudi.
- source_word: τὰ ἐν ταῖς τέσσαρσι γωνίαις τῆς γῆς
  choice: yang berada di keempat penjuru bumi
  rationale: Ungkapan idiomatis ini menunjuk seluruh pelosok dunia. 'Keempat penjuru bumi' mempertahankan citra sumber sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: τὸν Γὼγ καὶ Μαγώγ
  choice: Gog dan Magog
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia dan dipahami sebagai keterangan aposisional bagi bangsa-bangsa tersebut.
- source_word: συναγαγεῖν
  choice: dan mengumpulkan mereka
  rationale: Infinitif ini menyatakan tujuan lanjutan yang dikoordinasikan dalam kalimat. Penambahan 'mereka' membuat objeknya jelas dan alami dalam bahasa Indonesia.
- source_word: εἰς τὸν πόλεμον
  choice: untuk berperang
  rationale: Ungkapan ini secara idiomatis menyatakan tujuan pengumpulan. Pilihan verbal 'untuk berperang' alami dan tidak menentukan apakah πόλεμος berarti perang secara luas atau suatu pertempuran tertentu.
- source_word: ὧν ὁ ἀριθμὸς αὐτῶν
  choice: Jumlah mereka
  rationale: Konstruksi relatif Yunani merujuk kembali kepada bangsa-bangsa yang dikumpulkan. Kalimat baru menghasilkan bahasa Indonesia yang jelas tanpa mengubah rujukannya.
- source_word: ὡς ἡ ἄμμος τῆς θαλάσσης
  choice: seperti pasir di laut
  rationale: Terjemahan ini mempertahankan perumpamaan alkitabiah tentang jumlah yang sangat besar dan memakai ungkapan Indonesia yang alami.
theological_decisions:
- issue: Rujukan subjek tersirat pada ἐξελεύσεται
  choice: Menggunakan 'ia', dengan rujukan kepada Satan dari ayat 7.
  alternative: Mengulang nama 'Satan' dalam ayat ini.
  rationale: Teks Yunani tidak menyebut subjek secara eksplisit; kesinambungan gramatikal dengan ayat sebelumnya cukup ditandai oleh pronomina.
- issue: Hubungan 'Gog dan Magog' dengan bangsa-bangsa
  choice: Mempertahankannya sebagai keterangan aposisional bagi bangsa-bangsa di keempat penjuru bumi.
  alternative: Menafsirkannya secara khusus sebagai dua individu, dua wilayah, atau identifikasi etnogeografis yang ketat.
  rationale: Susunan Yunani mendukung hubungan aposisional, tetapi tidak memaksa penentuan apakah nama-nama itu simbolis, tipologis, atau etnogeografis. Terjemahan tidak menyelesaikan ketegangan tersebut.
- issue: Cakupan πόλεμος
  choice: Menerjemahkan secara idiomatis sebagai 'untuk berperang'.
  alternative: Untuk pertempuran itu; untuk perang.
  rationale: πόλεμος dapat menunjuk perang atau pertempuran. Pilihan utama mempertahankan maksud berkumpul untuk konflik tanpa menetapkan kekhususan yang tidak pasti.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada luhur tetapi mudah dipahami. Struktur dua kalimat dipakai agar konstruksi jumlah mereka terbaca alami; tanda pisah mempertahankan fungsi aposisional 'Gog dan Magog'. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
