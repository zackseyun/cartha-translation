  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἤκουσα τοῦ θυσιαστηρίου λέγοντος· Ναί, κύριε, ὁ θεός, ὁ παντοκράτωρ, ἀληθιναὶ καὶ δίκαιαι αἱ κρίσεις σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/007.yaml
  text: And I heard the altar saying[a], “Yes, Lord God, the Almighty, true and just are your judgments.”
translation:
  language: id
  text: Lalu aku mendengar mezbah itu berkata[a], “Ya, Tuhan Allah, Yang Mahakuasa, benar dan adillah keputusan-keputusan penghakiman-Mu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “aku mendengar dari mezbah itu ada yang berkata.” Bentuk Yunani dapat menunjukkan sumber dari apa yang didengar Yohanes, meskipun susunannya paling wajar mempersonifikasikan mezbah itu sebagai pembicara.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσα
  choice: aku mendengar
  rationale: Bentuk aoristus ἀκούω menyatakan peristiwa lampau secara sederhana; ‘mendengar’ tidak menambahkan unsur kesengajaan seperti ‘menyimak’.
- source_word: τοῦ θυσιαστηρίου λέγοντος
  choice: mezbah itu berkata
  rationale: Genitif bersama ἤκουσα dapat menandai sumber suara, tetapi partisip λέγοντος paling wajar menggambarkan mezbah itu sendiri sebagai pembicara dan mempertahankan personifikasi apokaliptis.
- source_word: Ναί
  choice: Ya
  rationale: Partikel afirmatif yang kuat ini paling jelas dan alami diterjemahkan ‘Ya’, sekaligus mempertahankan nuansa tanggapan.
- source_word: κύριε, ὁ θεός, ὁ παντοκράτωρ
  choice: Tuhan Allah, Yang Mahakuasa
  rationale: Terjemahan ini mempertahankan ketiga unsur sapaan ilahi dalam susunan yang wajar dan bermartabat dalam bahasa Indonesia.
- source_word: ἀληθιναὶ καὶ δίκαιαι
  choice: benar dan adil
  rationale: Kedua adjektiva predikatif ini menyatakan bahwa penghakiman Allah selaras dengan kebenaran dan keadilan; pasangan ‘benar dan adil’ alami dalam bahasa Indonesia.
- source_word: αἱ κρίσεις σου
  choice: penghakiman-penghakiman-Mu
  rationale: Bentuk jamak dipertahankan untuk menunjuk berbagai keputusan atau tindakan penghakiman Allah dalam konteks pencurahan cawan.
theological_decisions:
- issue: Personifikasi mezbah sebagai pembicara
  choice: mezbah itu berkata
  alternative: dari mezbah itu ada yang berkata
  rationale: Teks Yunani menyebut mezbah sebagai sumber gramatikal dan memakai partisip ‘berkata’. Personifikasi mempertahankan gambaran apokaliptis tanpa menambahkan kata ‘suara’ yang tidak terdapat dalam teks.
- issue: Susunan gelar ilahi dalam sapaan langsung
  choice: Tuhan Allah, Yang Mahakuasa
  alternative: Tuhan, Allah Yang Mahakuasa
  rationale: Pilihan ini mempertahankan κύριε, ὁ θεός, dan ὁ παντοκράτωρ sebagai tiga unsur yang beraposisi, termasuk daya substantival artikel pada gelar terakhir, sambil tetap alami dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada agung tetapi mudah dipahami. Kata ganti orang pertama ‘aku’ sesuai dengan narasi penglihatan Yohanes; kapitalisasi ‘-Mu’ dan gelar ilahi mengikuti kebiasaan umum penerbitan Alkitab berbahasa Indonesia.
