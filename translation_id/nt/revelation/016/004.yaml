source:
  edition: SBLGNT
  text: Καὶ ὁ τρίτος ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τοὺς ποταμοὺς ⸀καὶ τὰς πηγὰς τῶν ὑδάτων· καὶ ἐγένετο αἷμα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/004.yaml
  text: And the third poured out his bowl into the rivers and the springs of water[a], and it became blood.
translation:
  language: id
  text: Lalu yang ketiga menumpahkan mangkuknya ke sungai-sungai dan mata-mata air, dan airnya menjadi darah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “semuanya menjadi darah.” Dalam bahasa Yunani, verba yang diterjemahkan “menjadi” berbentuk tunggal dan subjeknya tidak disebutkan secara eksplisit.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ὁ τρίτος
  choice: yang ketiga
  rationale: Bahasa Yunani hanya memakai kata bilangan bertingkat dengan artikel; nomina yang tersirat dari konteks tidak perlu ditambahkan.
- source_word: ἐξέχεεν
  choice: menumpahkan
  rationale: Padanan alami untuk tindakan menuangkan habis isi mangkuk dalam rangkaian penghukuman ini.
- source_word: φιάλην
  choice: mangkuk
  rationale: φιάλη menunjuk pada wadah lebar dan dangkal; 'mangkuk' lebih tepat daripada istilah yang menyiratkan botol kecil.
- source_word: εἰς τοὺς ποταμούς
  choice: ke sungai-sungai
  rationale: εἰς menyatakan arah gerak menuju atau ke dalam; dalam bahasa Indonesia, 'ke sungai-sungai' alami dan cukup jelas.
- source_word: πηγὰς τῶν ὑδάτων
  choice: mata-mata air
  rationale: Ungkapan Indonesia yang alami untuk sumber-sumber air dan sepadan dengan bentuk jamak Yunani.
- source_word: ἐγένετο αἷμα
  choice: semuanya menjadi darah
  rationale: Klausa Yunani memakai verba tunggal dan tidak menyatakan subjek secara eksplisit. 'Semuanya' merangkum sungai-sungai dan mata-mata air secara kolektif sambil mempertahankan makna perubahan menjadi darah.
theological_decisions:
- issue: Subjek tersirat dalam ἐγένετο αἷμα
  choice: semuanya menjadi darah
  alternative: airnya menjadi darah
  rationale: Teks dapat dipahami sebagai hasil kolektif yang menimpa sungai-sungai serta mata-mata air, atau secara implisit air di dalamnya. Terjemahan utama tidak membatasi rujukan hanya pada air, sedangkan catatan menjaga alternatif yang lebih harfiah secara semantis.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan khidmat. Elipsis 'yang ketiga' dipertahankan tanpa menambahkan 'malaikat'. Pengulangan jamak dalam 'mata-mata air' dipakai sebagai bentuk baku.
