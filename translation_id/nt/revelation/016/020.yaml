id: REV.16.20
reference: Revelation 16:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ πᾶσα νῆσος ἔφυγεν, καὶ ὄρη οὐχ εὑρέθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/020.yaml
  text: And every island fled[a], and mountains were not found.
translation:
  language: id
  text: Dan setiap pulau melarikan diri[a], dan gunung-gunung tidak ditemukan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lenyap.” Kata kerja Yunani ini secara harfiah berarti “melarikan diri,” sehingga mempertahankan personifikasi yang hidup dalam ayat ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα
  choice: setiap
  rationale: 'Dengan νῆσος berbentuk tunggal, πᾶσα bersifat distributif: setiap pulau satu demi satu.'
- source_word: νῆσος
  choice: pulau
  rationale: Kata ini secara langsung berarti 'pulau'; bentuk tunggalnya wajar sesudah 'setiap' dalam bahasa Indonesia.
- source_word: ἔφυγεν
  choice: melarikan diri
  rationale: Mempertahankan arti harfiah φεύγω dan personifikasi apokaliptik yang hidup; akibat kontekstualnya ialah pulau-pulau itu lenyap.
- source_word: ὄρη
  choice: gunung-gunung
  rationale: Bentuk jamak diterjemahkan dengan pengulangan nomina yang alami dalam bahasa Indonesia.
- source_word: οὐχ εὑρέθησαν
  choice: tidak ditemukan
  rationale: Mencerminkan secara langsung bentuk pasif yang dinegasikan tanpa memperjelasnya secara berlebihan menjadi 'tidak ada lagi'.
- source_word: καὶ ... καὶ
  choice: Dan ... dan
  rationale: Mempertahankan koordinasi serta gaya parataktis dan kumulatif khas Wahyu.
theological_decisions:
- issue: Apakah gambaran kosmis apokaliptik harus ditafsirkan sebagai lenyap secara harfiah atau diperhalus menjadi bahasa kiasan
  choice: Mempertahankan gambaran konkret dan personifikasi dalam terjemahan
  alternative: Menerjemahkan secara lebih interpretatif sebagai 'lenyap' atau 'menghilang'
  rationale: Teks Yunani menyajikan gambaran apokaliptik yang konkret dan hidup. Terjemahan tidak seharusnya memutuskan apakah acuannya harfiah atau simbolis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan koordinatif dipertahankan untuk mengikuti irama teks Yunani; 'melarikan diri' sengaja mempertahankan personifikasi meskipun 'lenyap' lebih lancar secara kontekstual.
