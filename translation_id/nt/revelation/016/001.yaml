id: REV.16.1
reference: Revelation 16:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα ⸂μεγάλης φωνῆς⸃ ἐκ τοῦ ναοῦ λεγούσης τοῖς ἑπτὰ ἀγγέλοις· Ὑπάγετε καὶ ⸀ἐκχέετε τὰς ἑπτὰ φιάλας τοῦ θυμοῦ τοῦ θεοῦ εἰς τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/001.yaml
  text: And I heard a loud voice from the sanctuary saying to the seven angels[b][a], “Go and pour out the seven bowls of the wrath of God onto the earth.”
translation:
  language: id
  text: Lalu aku mendengar suara keras dari tempat kudus[a] berkata kepada ketujuh malaikat itu, “Pergilah dan tumpahkanlah ketujuh cawan murka Allah ke atas bumi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bait”; kata Yunani ναός sering menunjuk secara lebih khusus pada tempat kudus atau ruang suci bagian dalam, bukan seluruh kompleks bait.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλης φωνῆς
  choice: suara keras
  rationale: Dalam ungkapan ini, μέγας menerangkan kuatnya volume suara; “suara keras” merupakan padanan Indonesia yang alami dan tepat.
- source_word: ναοῦ
  choice: tempat kudus
  rationale: ναός lazimnya menunjuk pada ruang suci atau bagian inti bait, bukan seluruh kompleksnya; “tempat kudus” mempertahankan kekhususan itu dalam latar surgawi kitab Wahyu.
- source_word: λεγούσης
  choice: berkata
  rationale: Partisip ini menerangkan “suara”; susunan “mendengar suara ... berkata” alami dalam bahasa Indonesia dan mempertahankan gambaran bahwa suara itulah yang menyampaikan perintah.
- source_word: Ὑπάγετε
  choice: Pergilah
  rationale: Bentuk imperatif ini memerintahkan para malaikat untuk berangkat dan bertindak; “Pergilah” menyampaikan perintah tersebut secara jelas.
- source_word: ἐκχέετε
  choice: tumpahkanlah
  rationale: Kata ini menggambarkan isi wadah yang dicurahkan keluar; “tumpahkanlah” mempertahankan daya perintah dan citra pengosongan cawan.
- source_word: φιάλας
  choice: cawan
  rationale: φιάλη adalah wadah lebar dan dangkal. “Cawan” merupakan istilah Indonesia yang mapan dalam konteks ini dan tidak menyiratkan botol kecil.
- source_word: θυμοῦ
  choice: murka
  rationale: Dalam konteks penghakiman apokaliptik, θυμός menyatakan kemarahan ilahi yang hebat; “murka” mempertahankan bobot khidmatnya.
- source_word: εἰς τὴν γῆν
  choice: ke atas bumi
  rationale: Dengan ἐκχέω, εἰς menyatakan arah curahan menuju atau mengenai permukaan bumi; konteks penghakiman kosmis mendukung “bumi,” bukan “tanah” dalam arti wilayah lokal.
theological_decisions:
- issue: Pemaknaan ναός dalam adegan surgawi kitab Wahyu
  choice: tempat kudus
  alternative: bait
  rationale: “Tempat kudus” menjaga nuansa ruang suci bagian dalam yang dapat dikandung oleh ναός, tanpa memperluasnya secara otomatis menjadi seluruh kompleks bait.
- issue: Pemaknaan θυμός τοῦ θεοῦ
  choice: murka Allah
  alternative: kemarahan Allah
  rationale: Frasa ini mengacu pada kemarahan ilahi dalam penghakiman. “Murka Allah” menjaga keseriusan ungkapan tersebut tanpa menambahkan rumusan doktrinal di luar teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan lugas. Bentuk imperatif berakhiran -lah mempertahankan wibawa perintah, sedangkan istilah “cawan” dan “murka” menjaga citra apokaliptik yang telah mapan tanpa menjadi usang.
