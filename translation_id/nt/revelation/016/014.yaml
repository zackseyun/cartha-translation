id: REV.16.14
reference: Revelation 16:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: εἰσὶν γὰρ πνεύματα δαιμονίων ποιοῦντα σημεῖα, ἃ ἐκπορεύεται ἐπὶ τοὺς βασιλεῖς τῆς οἰκουμένης ὅλης, συναγαγεῖν αὐτοὺς εἰς τὸν πόλεμον τῆς ⸀ἡμέρας τῆς μεγάλης τοῦ θεοῦ τοῦ παντοκράτορος—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/014.yaml
  text: For they are spirits of demons[a], performing signs, which go out to the kings of the whole world[b], to gather them for the battle of the great day of God the Almighty—
translation:
  language: id
  text: Sebab mereka adalah roh-roh setan[a] yang mengadakan tanda-tanda. Mereka pergi kepada raja-raja di seluruh dunia[b] untuk mengumpulkan mereka bagi pertempuran pada hari besar Allah Yang Mahakuasa—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “roh-roh jahat.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “raja-raja seluruh dunia yang dihuni manusia.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεύματα δαιμονίων
  choice: roh-roh setan
  rationale: Bentuk ini mempertahankan hubungan genitif secara dekat dan tetap wajar dalam bahasa Indonesia; catatan kaki mencantumkan kemungkinan deskriptif 'roh-roh jahat'.
- source_word: ποιοῦντα σημεῖα
  choice: yang mengadakan tanda-tanda
  rationale: Ungkapan ini menyampaikan tindakan menghasilkan atau melakukan tanda luar biasa tanpa menentukan apakah tanda itu mukjizat sejati atau tipu daya belaka.
- source_word: ἃ ἐκπορεύεται
  choice: Mereka pergi
  rationale: Walaupun verba Yunani berbentuk tunggal secara tidak lazim, antesedennya jamak. Bahasa Indonesia mengikuti rujukan jamak dan memecah kalimat agar jelas.
- source_word: ἐπὶ τοὺς βασιλεῖς
  choice: kepada raja-raja
  rationale: Dengan verba gerak, ἐπί di sini menyatakan arah menuju para raja, selaras dengan tujuan mengumpulkan mereka.
- source_word: τῆς οἰκουμένης ὅλης
  choice: di seluruh dunia
  rationale: Ungkapan ini alami bagi cakupan dunia manusia secara menyeluruh; alternatif yang lebih harfiah diberikan dalam catatan kaki.
- source_word: συναγαγεῖν
  choice: untuk mengumpulkan
  rationale: Infinitif menyatakan tujuan kepergian roh-roh tersebut.
- source_word: εἰς τὸν πόλεμον
  choice: bagi pertempuran
  rationale: Menyatakan tujuan pengumpulan untuk konflik tertentu, bukan perang secara umum.
- source_word: τῆς ἡμέρας τῆς μεγάλης
  choice: pada hari besar
  rationale: Genitif ini paling alami dipahami sebagai pertempuran yang berlangsung pada hari besar tersebut; rumusan Indonesia menghindari rangkaian genitif yang kaku.
- source_word: τοῦ θεοῦ τοῦ παντοκράτορος
  choice: Allah Yang Mahakuasa
  rationale: Mempertahankan παντοκράτωρ sebagai gelar ilahi yang mapan, agung, dan mudah dipahami.
theological_decisions:
- issue: Sifat tanda-tanda yang diadakan roh-roh itu
  choice: Menerjemahkan σημεῖα secara langsung sebagai 'tanda-tanda' tanpa menjelaskan mekanismenya.
  alternative: Menyebutnya 'mukjizat palsu', 'tipu daya', atau 'mukjizat'.
  rationale: Teks mengaitkan tanda-tanda itu dengan roh-roh setan, tetapi tidak menetapkan apakah tanda tersebut semata-mata tipuan, tindakan adikodrati yang nyata, atau keduanya.
- issue: Hubungan pertempuran dengan hari besar Allah
  choice: bagi pertempuran pada hari besar Allah
  alternative: bagi pertempuran dari hari besar Allah
  rationale: Pilihan ini menyampaikan hubungan temporal yang paling wajar dalam bahasa Indonesia tanpa menambahkan rincian eskatologis yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada apokaliptik yang khidmat. Kalimat Yunani yang panjang dibagi menjadi dua demi kejernihan, sedangkan tanda pisah penutup dipertahankan karena ayat berlanjut ke ayat berikutnya.
