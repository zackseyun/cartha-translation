review_pass:
  verdict: revise
  source_fidelity: Terjemahan «disengat oleh panas» kurang tepat untuk ἐκαυματίσθησαν karena «disengat» lazimnya mengacu pada sengatan serangga/binatang. «Tersengat panas» adalah idiom Indonesia yang tepat untuk terkena panas yang membakar, sambil tidak melebih-lebihkan menjadi hangus. Klausa akhir sebaiknya mempertahankan infinitif δοῦναι, yakni penolakan bertobat untuk memberi kemuliaan kepada Allah.
  naturalness: Teks umumnya baku dan jelas. «Panas yang sangat hebat» dapat dipahami, tetapi «panas yang sangat menyengat» lebih idiomatis dan secara langsung terkait dengan tindakan tersengat. Bentuk «untuk memberi kemuliaan kepada-Nya» lebih dekat pada struktur serta hubungan makna dalam bahasa sumber daripada «dan tidak memuliakan Dia».
  terminology: «Menghujat nama Allah», «berkuasa atas malapetaka-malapetaka ini», dan «bertobat» merupakan padanan yang akurat dan sesuai register. «Malapetaka» dapat dipertahankan untuk πληγαί dalam konteks ini.
  issues:
  - severity: medium
    issue: «disengat oleh panas» untuk ἐκαυματίσθησαν
    rationale: Dalam pemakaian Indonesia modern, «disengat» terutama berarti terkena sengatan binatang atau serangga. «Tersengat panas» merupakan ungkapan yang alami bagi penderitaan akibat panas terik/membakar dan lebih setia pada καυματίζω.
  - severity: low
    issue: Klausa akhir tidak mempertahankan δοῦναι sebagai infinitif
    rationale: «Tidak bertobat dan tidak memuliakan Dia» menyatakan dua tindakan koordinatif, sedangkan Yunani memakai «tidak bertobat untuk memberi Dia kemuliaan». Bentuk infinitif Indonesia dapat dipertahankan tanpa mengurangi kelancaran.
  revised_text: Orang-orang itu tersengat panas yang sangat menyengat, lalu mereka menghujat nama Allah, yang berkuasa atas malapetaka-malapetaka ini. Namun, mereka tidak bertobat untuk memberi kemuliaan kepada-Nya.
