  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐκαυματίσθησαν οἱ ἄνθρωποι καῦμα μέγα· καὶ ⸀ἐβλασφήμησαν τὸ ὄνομα τοῦ θεοῦ τοῦ ἔχοντος ⸀τὴν ἐξουσίαν ἐπὶ τὰς πληγὰς ταύτας, καὶ οὐ μετενόησαν δοῦναι αὐτῷ δόξαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/009.yaml
  text: And the people were scorched with great heat[a], and they blasphemed the name of God, who has authority over these plagues[b], and they did not repent to give him glory.
translation:
  language: id
  text: Orang-orang itu tersengat panas yang sangat menyengat, lalu mereka menghujat nama Allah, yang berkuasa atas malapetaka-malapetaka ini. Namun, mereka tidak bertobat untuk memberi kemuliaan kepada-Nya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκαυματίσθησαν
  choice: disengat oleh panas
  rationale: Bentuk pasif ini menyatakan bahwa orang-orang terkena dampak panas yang membakar. Ungkapan ini alami dalam bahasa Indonesia dan tidak menyiratkan bahwa tubuh mereka hangus seluruhnya.
- source_word: οἱ ἄνθρωποι
  choice: orang-orang itu
  rationale: Dalam konteks ini bentuk jamak maskulin tersebut merujuk kepada manusia secara umum, bukan khusus laki-laki.
- source_word: καῦμα μέγα
  choice: panas yang sangat hebat
  rationale: Ungkapan ini menyatakan kedahsyatan panas yang menyebabkan sengatan; 'sangat hebat' menyampaikan intensitas μέγα secara alami.
- source_word: ἐβλασφήμησαν
  choice: menghujat
  rationale: Ketika objeknya adalah nama Allah, kata ini menunjuk pada perkataan yang mencela atau menghina Allah; 'menghujat' mempertahankan bobot religiusnya.
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: nama Allah
  rationale: Terjemahan ini mempertahankan ungkapan alkitabiah yang menunjuk pada identitas dan kehormatan Allah.
- source_word: τοῦ ἔχοντος τὴν ἐξουσίαν ἐπὶ τὰς πληγὰς ταύτας
  choice: yang berkuasa atas malapetaka-malapetaka ini
  rationale: Partisipel kini menggambarkan Allah sebagai pihak yang mempunyai wewenang atau kuasa atas malapetaka tersebut.
- source_word: πληγὰς
  choice: malapetaka-malapetaka
  rationale: Dalam konteks Wahyu, kata ini merujuk pada bencana hukuman ilahi dan beresonansi dengan tulah-tulah dalam Keluaran. 'Malapetaka' lebih alami daripada 'tulah' bagi pembaca modern, tanpa menghilangkan sifat bencananya.
- source_word: οὐ μετενόησαν
  choice: mereka tidak bertobat
  rationale: Dalam konteks penghakiman, kata kerja ini menyatakan pertobatan moral dan rohani, bukan sekadar perubahan pikiran.
- source_word: δοῦναι αὐτῷ δόξαν
  choice: dan tidak memuliakan Dia
  rationale: Infinitif ini menyatakan tindakan yang seharusnya menyertai atau dihasilkan oleh pertobatan. Dalam bahasa Indonesia, pengulangan 'tidak' memperjelas hubungan erat antara tidak bertobat dan tidak memberi kemuliaan kepada Allah.
theological_decisions:
- issue: Cakupan οἱ ἄνθρωποι
  choice: Rujukan kepada manusia secara umum ('orang-orang itu')
  alternative: Kaum laki-laki
  rationale: Konteks membicarakan orang-orang yang terkena penghakiman tanpa membatasi jenis kelamin; terjemahan tidak boleh memberi kesan pembatasan yang tidak ada dalam konteks.
- issue: Kuasa Allah dalam τοῦ ἔχοντος τὴν ἐξουσίαν ἐπὶ τὰς πληγὰς ταύτας
  choice: Allah dinyatakan berkuasa atas malapetaka-malapetaka itu
  alternative: Allah hanya dikaitkan dengan malapetaka-malapetaka itu
  rationale: Teks secara langsung menyatakan bahwa Allah memiliki ἐξουσία atas semua malapetaka tersebut; pernyataan ini dipertahankan tanpa diperluas menjadi rumusan doktrinal di luar ayat.
- issue: Hubungan δοῦναι αὐτῷ δόξαν dengan pertobatan
  choice: Tidak bertobat dan, sebagai akibat atau wujudnya, tidak memuliakan Allah
  alternative: Tidak bertobat dengan tujuan memberikan kemuliaan kepada Allah
  rationale: Infinitif dapat menyatakan hasil atau isi pertobatan. Susunan Indonesia dipilih agar alami sambil mempertahankan hubungan tersebut tanpa menentukan secara sempit apakah nuansanya tujuan atau hasil.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Allah' dipakai sebagai padanan lazim θεός. Kalimat dipecah dengan titik agar rangkaian klausa mudah dipahami, sedangkan 'Namun' mempertahankan pertentangan antara penghakiman yang dialami dan penolakan untuk bertobat.
