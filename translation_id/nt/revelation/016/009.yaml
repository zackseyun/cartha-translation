revisions:
- from: Orang-orang itu disengat oleh panas yang sangat hebat, lalu mereka menghujat nama Allah, yang berkuasa atas malapetaka-malapetaka ini. Namun, mereka tidak bertobat dan tidak memuliakan Dia.
  to: Orang-orang itu tersengat panas yang sangat menyengat, lalu mereka menghujat nama Allah, yang berkuasa atas malapetaka-malapetaka ini. Namun, mereka tidak bertobat untuk memberi kemuliaan kepada-Nya.
  rationale: Revisi mengganti ungkapan yang berpotensi keliru secara leksikal dengan idiom Indonesia yang wajar untuk panas yang membakar. Revisi juga memulihkan hubungan antara «bertobat» dan «memberi kemuliaan» yang ditandai oleh infinitif δοῦναι, tanpa memaksakan nuansa tujuan, hasil, atau isi secara lebih spesifik daripada teks sumber.
