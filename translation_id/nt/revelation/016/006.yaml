  naturalness: Bahasa Indonesia baku dan alami. «Sebab», «orang-orang kudus», «para nabi», dan «darah untuk diminum» sesuai dengan register kitab Wahyu. «Mereka layak» tetap dapat dipahami secara yudisial melalui konteks langsung dan dapat dijelaskan dalam catatan kaki.
  terminology: «Orang-orang kudus» tepat untuk ἁγίων dalam arti umat Allah, tanpa memasukkan pengertian kanonisasi. «Para nabi» dan «Engkau» juga sesuai. Pengulangan «darah» dipertahankan sebagaimana dalam teks Yunani.
