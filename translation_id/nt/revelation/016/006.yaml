id: REV.16.6
reference: Revelation 16:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι αἷμα ἁγίων καὶ προφητῶν ἐξέχεαν, καὶ αἷμα αὐτοῖς ⸀δέδωκας πιεῖν· ἄξιοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/006.yaml
  text: because they poured out the blood of saints and prophets[a], and you have given them blood to drink[b]; they are worthy.
translation:
  language: id
  text: sebab mereka telah menumpahkan darah orang-orang kudus dan para nabi[a], dan Engkau telah memberi mereka darah untuk diminum; mereka layak[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “telah mencurahkan darah orang-orang kudus dan para nabi.” Kata Yunani itu juga menggemakan pencurahan cawan-cawan penghakiman dalam konteks sekitar.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, mereka pantas menerima penghakiman ini.
    reason: lexical_clarification
lexical_decisions:
- source_word: ὅτι
  choice: sebab
  rationale: Memperkenalkan alasan bagi pernyataan malaikat pada ayat sebelumnya dan mempertahankan nada khidmat.
- source_word: αἷμα
  choice: darah
  rationale: Terjemahan harfiah pada kedua kemunculan mempertahankan pengulangan yang menegaskan keadilan setimpal.
- source_word: ἁγίων
  choice: orang-orang kudus
  rationale: Dalam Wahyu, istilah ini menunjuk kepada umat Allah yang dikuduskan, bukan hanya golongan yang kemudian secara resmi disebut santo atau santa.
- source_word: προφητῶν
  choice: para nabi
  rationale: Padanan langsung dan alami dalam bahasa Indonesia; artikel jamak 'para' sesuai bagi kelompok orang.
- source_word: ἐξέχεαν
  choice: telah menumpahkan
  rationale: Ungkapan Indonesia yang wajar untuk pembunuhan dengan pertumpahan darah, sambil tetap mempertahankan citra dasar 'menuangkan/menumpahkan' yang menggema dengan pencurahan cawan-cawan dalam konteks.
- source_word: αὐτοῖς
  choice: mereka
  rationale: Merujuk kepada para pelaku dan menjadi penerima dari tindakan 'memberi'.
- source_word: δέδωκας
  choice: Engkau telah memberi
  rationale: Bentuk perfek Yunani diterjemahkan dengan 'telah' untuk menyatakan tindakan yang sudah terlaksana dan tetap relevan; 'Engkau' menandai sapaan kepada Allah.
- source_word: πιεῖν
  choice: untuk diminum
  rationale: Bentuk pasif idiomatis ini alami dalam bahasa Indonesia setelah 'memberi mereka darah' dan menyampaikan tujuan yang sama dengan infinitif Yunani.
- source_word: ἄξιοί εἰσιν
  choice: mereka memang layak menerimanya
  rationale: '''Layak'' mempertahankan penilaian yudisial ἄξιοι, sedangkan ''memang'' menegaskan deklarasi dan ''menerimanya'' membuat objek tersirat dapat dipahami secara alami tanpa mengubah maksud.'
theological_decisions:
- issue: Bahasa keadilan setimpal
  choice: Mempertahankan pernyataan keras bahwa Allah memberi para pelaku darah untuk diminum dan bahwa mereka layak menerimanya.
  alternative: Allah membalas mereka; mereka pantas dihukum.
  rationale: Teks Yunani menggambarkan penghakiman secara langsung dan proporsional melalui pengulangan 'darah'; citra tersebut tidak boleh diperhalus menjadi gagasan hukuman yang umum.
- issue: Rujukan 'orang-orang kudus'
  choice: Memakai 'orang-orang kudus' dalam arti luas sebagai umat Allah yang dikuduskan.
  alternative: umat-Mu yang kudus
  rationale: Pilihan ini mengikuti bentuk nominal Yunani tanpa menambahkan kata ganti kepunyaan dan tidak memasukkan kategori gerejawi yang berkembang kemudian.
- issue: Makna ἄξιοί εἰσιν
  choice: Memahami 'layak' sebagai pantas menerima penghakiman tersebut.
  alternative: mereka layak
  rationale: Terjemahan tanpa pelengkap lebih formal tetapi dalam bahasa Indonesia dapat terdengar seperti pujian moral; pelengkap tersirat diperjelas agar makna yudisial tidak disalahpahami.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur sebab-akibat serta pengulangan 'darah' dipertahankan. Huruf kapital pada 'Engkau' mengikuti kebiasaan hormat dalam teks keagamaan Indonesia. Semua penanda catatan kaki muncul dalam teks utama.
