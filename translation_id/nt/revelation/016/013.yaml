id: REV.16.13
reference: Revelation 16:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ εἶδον ἐκ τοῦ στόματος τοῦ δράκοντος καὶ ἐκ τοῦ στόματος τοῦ θηρίου καὶ ἐκ τοῦ στόματος τοῦ ψευδοπροφήτου πνεύματα ⸂τρία ἀκάθαρτα⸃ ὡς βάτραχοι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/013.yaml
  text: And I saw three unclean spirits like frogs coming out of the mouth of the dragon[a], out of the mouth of the beast, and out of the mouth of the false prophet.
translation:
  language: id
  text: Lalu aku melihat tiga roh najis yang seperti katak keluar dari mulut naga itu, dari mulut binatang itu, dan dari mulut nabi palsu itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dari mulut naga itu, dari mulut binatang itu, dan dari mulut nabi palsu itu aku melihat tiga roh najis yang seperti katak.” Dalam bahasa Yunani, ketiga frasa yang menyatakan sumber ditempatkan sebelum “tiga roh najis.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: aku melihat
  rationale: Bentuk aoris ὁράω berfungsi sebagai verba naratif sederhana dalam laporan penglihatan Yohanes; “aku melihat” alami dan langsung dalam bahasa Indonesia.
- source_word: ἐκ ... τοῦ στόματος
  choice: keluar dari mulut
  rationale: ἐκ menyatakan asal atau gerak dari dalam. Penambahan “keluar” membuat hubungan antara roh-roh dan ketiga sumbernya jelas serta alami dalam bahasa Indonesia tanpa menambah gagasan baru.
- source_word: δράκοντος
  choice: naga itu
  rationale: “Naga” mempertahankan citra apokaliptik δράκων; “itu” menandai tokoh tertentu yang telah dikenal dari konteks.
- source_word: θηρίου
  choice: binatang itu
  rationale: “Binatang” adalah padanan Indonesia yang jelas bagi θηρίον dan mempertahankan lambang apokaliptiknya; “itu” menunjukkan tokoh tertentu dalam konteks.
- source_word: ψευδοπροφήτου
  choice: nabi palsu itu
  rationale: ψευδοπροφήτης berarti nabi yang palsu; bentuk ini alami dalam bahasa Indonesia dan mempertahankan sebutan tokoh tersebut.
- source_word: πνεύματα
  choice: roh
  rationale: Dalam konteks ini πνεύματα menunjuk kepada entitas rohani. Bahasa Indonesia lazim membiarkan nomina “roh” tidak berubah bentuk untuk jamak, dengan jumlah dinyatakan oleh “tiga”.
- source_word: τρία ἀκάθαρτα
  choice: tiga roh najis
  rationale: ἀκάθαρτα membawa nuansa kenajisan religius dan moral-rohani; “najis” mempertahankan gema biblis itu lebih baik daripada sekadar “tidak murni”.
- source_word: ὡς βάτραχοι
  choice: yang seperti katak
  rationale: ὡς menyatakan perbandingan, bukan identitas. “Seperti katak” mempertahankan simile, dan “yang” menghubungkannya secara alami dengan roh-roh tersebut.
theological_decisions:
- issue: Hakikat πνεύματα ἀκάθαρτα dalam gambaran apokaliptik
  choice: “tiga roh najis yang seperti katak” tanpa penjelasan alegoris
  alternative: “tiga roh jahat yang menyerupai katak” atau “tiga roh setan seperti katak”
  rationale: Ayat ini sendiri menyebut mereka roh-roh najis dan membandingkan mereka dengan katak. Identifikasi yang lebih tegas sebagai roh-roh setan muncul pada ayat berikutnya, sehingga tidak dimasukkan lebih awal ke dalam teks ini.
- issue: Hubungan frasa sumber dengan roh-roh
  choice: Menempatkan objek “tiga roh najis” sebelum rangkaian “keluar dari mulut ...”
  alternative: 'Mengikuti urutan Yunani secara lebih ketat: “dari mulut naga itu, dari mulut binatang itu, dan dari mulut nabi palsu itu aku melihat tiga roh najis seperti katak”'
  rationale: Susunan yang dipilih lebih alami dan tidak ambigu dalam bahasa Indonesia, sedangkan catatan kaki mempertahankan informasi tentang susunan asli yang menonjolkan ketiga sumber sebelum menyebut roh-roh.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Diksi “roh najis,” “naga,” “binatang,” dan “nabi palsu” mempertahankan citra serta gema biblis tanpa memperluas tafsir. Pengulangan “dari mulut” dipertahankan untuk mencerminkan tekanan retoris teks Yunani.
