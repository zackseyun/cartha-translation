id: REV.16.18
reference: Revelation 16:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐγένοντο ἀστραπαὶ καὶ ⸂φωναὶ καὶ βρονταί⸃, καὶ σεισμὸς ⸀ἐγένετο μέγας, οἷος οὐκ ἐγένετο ἀφ’ οὗ ⸂ἄνθρωποι ἐγένοντο⸃ ἐπὶ τῆς γῆς τηλικοῦτος σεισμὸς οὕτω μέγας,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/018.yaml
  text: And there were flashes of lightning and sounds and peals of thunder, and there was a great earthquake, such as had not happened since men came to be on the earth—so great was that earthquake.
translation:
  language: id
  text: Lalu terjadilah kilat-kilat, suara-suara[a], dan gelegar-gelegar guruh. Terjadilah gempa bumi yang dahsyat, yang belum pernah terjadi sejak manusia mulai ada di bumi—begitu dahsyatnya gempa bumi itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: bunyi-bunyi.'
    reason: φωναὶ dapat menunjuk kepada suara-suara ataupun bunyi-bunyi; konteks tidak sepenuhnya menentukan apakah unsur ini bersifat personal.
lexical_decisions:
- source_word: ἀστραπαὶ
  choice: kilat-kilat
  rationale: Bentuk ulang menyampaikan nomina jamak dan menggambarkan kilatan yang terjadi berulang kali secara alami dalam bahasa Indonesia.
- source_word: φωναὶ
  choice: suara-suara
  rationale: Kata ini dapat berarti suara manusia ataupun bunyi secara umum. 'Suara-suara' mempertahankan keluasan maknanya tanpa memastikan bahwa yang terdengar adalah perkataan.
- source_word: βρονταί
  choice: gelegar-gelegar guruh
  rationale: Ungkapan ini alami dan jelas untuk bunyi guruh yang berulang, serta mempertahankan daya gambarnya.
- source_word: σεισμὸς μέγας
  choice: gempa bumi yang dahsyat
  rationale: '''Gempa bumi'' adalah padanan baku dalam konteks ini, sedangkan ''dahsyat'' menyampaikan besarnya peristiwa dengan laras apokaliptik yang wajar.'
- source_word: οἷος οὐκ ἐγένετο
  choice: yang belum pernah terjadi
  rationale: Menyampaikan bahwa gempa tersebut tidak tertandingi oleh gempa mana pun dalam rentang waktu yang disebutkan.
- source_word: ἀφ’ οὗ ἄνθρωποι ἐγένοντο ἐπὶ τῆς γῆς
  choice: sejak manusia mulai ada di bumi
  rationale: '''Manusia'' secara alami mencakup umat manusia tanpa pembatasan jenis kelamin, sedangkan ''mulai ada'' mencerminkan ἐγένοντο dan titik awal perbandingan temporal.'
- source_word: τηλικοῦτος σεισμὸς οὕτω μέγας
  choice: begitu dahsyatnya gempa bumi itu
  rationale: Susunan ini mempertahankan penegasan ulang atas luar biasanya skala gempa sekaligus terdengar wajar dan kuat dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan ἄνθρωποι dalam perbandingan sejarah apokaliptik
  choice: manusia
  alternative: orang-orang; umat manusia
  rationale: Dalam konteks ini ἄνθρωποι menunjuk kepada manusia secara umum, bukan khusus laki-laki. 'Manusia' menyampaikan cakupan generik itu secara tepat dan bermartabat.
- issue: Kemungkinan φωναὶ berarti suara atau bunyi nonpersonal
  choice: suara-suara dalam teks utama, dengan alternatif 'bunyi-bunyi' dalam catatan kaki
  alternative: bunyi-bunyi
  rationale: Konteks badai mendukung bunyi-bunyi, tetapi istilah Yunani juga dapat berarti suara-suara. Pilihan utama dan catatan kaki mempertahankan ketaksaan tersebut tanpa menegaskan adanya ucapan.
translation_notes:
  register: Bahasa Indonesia modern yang jelas dan bermartabat, dengan pengulangan serta intensitas yang mempertahankan corak apokaliptik ayat. Tanda pisah menonjolkan penegasan penutup tanpa mengubah hubungan sintaksis.
