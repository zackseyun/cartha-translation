  source_fidelity: Revisi diperlukan untuk mempertahankan rangkaian koordinatif Yunani (καί) dan gerak eksplisit ἐξῆλθεν, yaitu suara itu ‘keluar’ dari tempat kudus. Terjemahan ‘Sudah terjadi’ dengan baik menyampaikan perfektum Γέγονεν tanpa menyempitkannya menjadi semata-mata ‘selesai’.
  naturalness: Teks revisi tetap baku dan alami dalam bahasa Indonesia modern. Susunan ‘keluar dari tempat kudus, dari takhta’ jelas mempertahankan dua keterangan sumber tanpa pengulangan yang berat.
  terminology: ‘Cawan,’ ‘udara,’ ‘tempat kudus,’ dan ‘takhta’ tepat untuk φιάλη, ἀήρ, ναός, dan θρόνος. ‘Takhta itu’ tidak diperlukan dalam bahasa Indonesia karena rujukan definit sudah tersirat dalam konteks penglihatan; ‘takhta’ lebih langsung dan tidak menambahkan penegasan demonstratif.
