source:
  edition: SBLGNT
  text: Καὶ ὁ ἕβδομος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ἀέρα— καὶ ἐξῆλθεν φωνὴ μεγάλη ⸀ἐκ τοῦ ⸀ναοῦ ἀπὸ τοῦ θρόνου λέγουσα· Γέγονεν—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/017.yaml
  text: And the seventh poured out his bowl into the air[a], and a loud voice came out from the sanctuary, from the throne, saying[b], “It has come to pass.”
translation:
  language: id
  text: Lalu yang ketujuh menumpahkan cawannya ke udara, dan terdengarlah suara nyaring keluar dari tempat kudus, dari takhta, yang berkata, “Sudah terjadi.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sudah selesai.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἕβδομος
  choice: yang ketujuh
  rationale: Yunani hanya memakai kata bilangan bertingkat dengan artikel. Konteks menunjuk kepada malaikat ketujuh, tetapi kata ‘malaikat’ tidak dinyatakan, sehingga elipsis dipertahankan.
- source_word: ἐξέχεεν
  choice: menumpahkan
  rationale: Padanan alami untuk tindakan mencurahkan isi cawan dan konsisten dengan rangkaian cawan dalam pasal ini.
- source_word: φιάλην
  choice: cawan
  rationale: ‘Cawan’ merupakan padanan baku dan wajar bagi wadah lebar yang dimaksud, tanpa kesan botol kecil.
- source_word: ἐπὶ τὸν ἀέρα
  choice: ke udara
  rationale: Dengan verba gerak ‘menumpahkan’, frasa ini secara alami menyatakan arah atau sasaran pencurahan.
- source_word: ἐξῆλθεν φωνὴ μεγάλη
  choice: terdengarlah suara nyaring
  rationale: Mengungkapkan kemunculan suara secara alami dalam bahasa Indonesia; ‘nyaring’ menyampaikan μεγάλη sebagai kuat atau keras.
- source_word: ἐκ τοῦ ναοῦ
  choice: dari tempat kudus
  rationale: ναός menunjuk secara khusus kepada ruang suci atau tempat kudus, bukan keseluruhan kompleks Bait Allah.
- source_word: ἀπὸ τοῦ θρόνου
  choice: dari takhta itu
  rationale: Mempertahankan keterangan sumber kedua; artikel Yunani diwujudkan dengan ‘itu’ karena takhta tersebut sudah tertentu dalam penglihatan.
- source_word: λέγουσα
  choice: berkata
  rationale: Partisip feminin ini menerangkan suara dan dapat diterjemahkan secara ringkas serta alami sebagai ‘berkata’.
- source_word: Γέγονεν
  choice: Sudah terjadi
  rationale: Bentuk perfektum γίνομαι menyatakan sesuatu yang telah terjadi dengan hasil yang kini berlaku; ungkapan ini tetap singkat dan khidmat.
theological_decisions:
- issue: Makna ναός dalam gambaran tempat ibadah surgawi
  choice: tempat kudus
  alternative: Bait Allah
  rationale: Pilihan ini mempertahankan kekhususan leksikal ναός dan tidak memperluasnya menjadi seluruh kompleks Bait Allah.
- issue: Rumusan klimaks Γέγονεν
  choice: Sudah terjadi
  alternative: Sudah selesai
  rationale: ‘Sudah terjadi’ mempertahankan arti dasar dan daya perfektum tanpa menetapkan secara sepihak bahwa fokusnya hanya pada penyelesaian; alternatif tradisional dicatat karena rumusan Yunani juga dapat dipahami sebagai pengumuman bahwa sesuatu telah tuntas.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, khidmat, dan mudah dipahami. Struktur dua sumber suara—dari tempat kudus, dari takhta—dipertahankan. Tidak ditambahkan kata ‘malaikat’ karena tidak hadir dalam klausa Yunani.
