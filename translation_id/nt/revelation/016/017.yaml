revisions:
- from: Lalu yang ketujuh menumpahkan cawannya ke udara. Terdengarlah suara nyaring dari tempat kudus, dari takhta itu, berkata, “Sudah terjadi.”[a]
  to: Lalu yang ketujuh menumpahkan cawannya ke udara, dan terdengarlah suara nyaring keluar dari tempat kudus, dari takhta, yang berkata, “Sudah terjadi.”[a]
  rationale: Revisi memulihkan koordinasi καί dan unsur gerak ἐξῆλθεν tanpa menambahkan ‘malaikat,’ yang memang tidak dinyatakan dalam ayat ini. Pilihan ‘tempat kudus’ mempertahankan kekhususan ναός, sedangkan ‘Sudah terjadi’ secara wajar menyampaikan nilai perfektum Γέγονεν. Catatan alternatif dipertahankan dan tetap ditambatkan pada rumusan akhir.
