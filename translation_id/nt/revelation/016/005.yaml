  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἤκουσα τοῦ ἀγγέλου τῶν ὑδάτων λέγοντος· Δίκαιος εἶ, ὁ ὢν καὶ ὁ ἦν, ⸀ὁ ὅσιος, ὅτι ταῦτα ἔκρινας,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/005.yaml
  text: And I heard the angel of the waters saying[a], “Righteous are you, the one who is and who was, the Holy One[c][b], because you have judged these things.”
translation:
  language: id
  text: Lalu aku mendengar malaikat air[c] berkata, “Engkau adil[b], Yang Ada dan Yang Dahulu Ada, Yang Kudus[a], karena Engkau telah menghakimi hal-hal ini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah manuskrip memuat gelar yang lebih panjang, seperti “Yang Ada dan Yang Dahulu Ada dan Yang Akan Datang”, mungkin karena diselaraskan dengan rumusan serupa di bagian lain kitab Wahyu. Teks yang dipakai di sini berbunyi “Yang Ada dan Yang Dahulu Ada, Yang Kudus”.
    reason: textual_variant
  - marker: b
    text: Atau “Engkau benar”.
    reason: lexical_alternative
  - marker: c
    text: Atau “malaikat yang berkuasa atas air”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ ἀγγέλου τῶν ὑδάτων
  choice: malaikat air
  rationale: Genitif Yunani dipertahankan secara ringkas sebagai hubungan dengan air. Dalam konteks, frasa ini mungkin menunjuk pada malaikat yang bertanggung jawab atas air, tetapi teks Yunani tidak menyatakan fungsi itu secara eksplisit.
- source_word: Δίκαιος
  choice: adil
  rationale: Dalam konteks penghakiman, δίκαιος menegaskan bahwa tindakan Allah benar dan adil. Pilihan 'adil' alami dalam bahasa Indonesia dan mempertahankan nuansa yuridis konteks tanpa meniadakan makna moralnya.
- source_word: ὁ ὢν καὶ ὁ ἦν
  choice: Yang Ada dan Yang Dahulu Ada
  rationale: Ungkapan ilahi khas Wahyu diterjemahkan dekat dengan bentuk Yunaninya. 'Dahulu Ada' menyatakan keberadaan pada masa lampau tanpa mengubahnya menjadi unsur masa depan yang tidak terdapat dalam teks cetak.
- source_word: ὁ ὅσιος
  choice: Yang Kudus
  rationale: ὅσιος di sini berfungsi sebagai gelar yang menyatakan kekudusan moral dan kesetiaan Allah. 'Yang Kudus' merupakan padanan Indonesia yang jelas, luhur, dan sesuai dengan konteks pujian.
- source_word: ὅτι
  choice: karena
  rationale: Kata ini memperkenalkan alasan Allah dinyatakan adil; 'karena' menyampaikan hubungan kausal dengan jelas dalam bahasa Indonesia modern.
- source_word: ταῦτα
  choice: semuanya ini
  rationale: Demonstratif Yunani secara harfiah menunjuk kepada 'hal-hal ini'. Ungkapan 'semuanya ini' alami dalam bahasa Indonesia dan tidak mengganti kata tersebut secara eksplisit dengan 'hukuman-hukuman' atau 'penghakiman-penghakiman'.
- source_word: ἔκρινας
  choice: telah menghakimi
  rationale: Bentuk aoris menyatakan tindakan penghakiman yang dipandang telah terlaksana. Bentuk 'telah menghakimi' cocok dengan relevansi hasil tindakan itu dalam seruan surgawi.
theological_decisions:
- issue: Gelar ilahi tanpa unsur masa depan yang lazim terdapat di bagian lain kitab Wahyu
  choice: Yang Ada dan Yang Dahulu Ada, Yang Kudus
  alternative: Yang Ada dan Yang Dahulu Ada dan Yang Akan Datang
  rationale: SBLGNT memuat ὁ ὢν καὶ ὁ ἦν, ὁ ὅσιος, bukan rumusan lebih panjang yang mencantumkan unsur masa depan. Terjemahan mengikuti teks cetak dan tidak menyelaraskannya dengan rumusan serupa di ayat lain.
- issue: Hubungan sintaksis ὁ ὅσιος dengan sapaan kepada Allah
  choice: Yang Kudus sebagai gelar sejajar sesudah Yang Ada dan Yang Dahulu Ada
  alternative: Ya Yang Kudus, Engkau yang ada dan yang dahulu ada
  rationale: Susunan utama mempertahankan rangkaian gelar sebagaimana teks Yunani tanpa memaksakan tanda baca yang mengubah substansi. Alternatif tersebut mungkin secara sintaksis, tetapi makna dasarnya tetap sapaan kepada Allah sebagai Yang Kudus.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bernada luhur. Susunan gelar ilahi dibuat ringkas agar tetap terdengar sebagai seruan ibadah. Kapitalisasi pada gelar-gelar ilahi membantu pembaca mengenalinya sebagai sebutan khusus tanpa menambahkan isi teologis yang tidak dinyatakan teks.
