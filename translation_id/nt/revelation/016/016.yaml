id: REV.16.16
reference: Revelation 16:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ συνήγαγεν αὐτοὺς εἰς τὸν τόπον τὸν καλούμενον Ἑβραϊστὶ Ἁρμαγεδών.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/016.yaml
  text: And he gathered them to the place that in Hebrew is called Armageddon[a][b].
translation:
  language: id
  text: Lalu ia mengumpulkan mereka ke tempat yang dalam bahasa Ibrani disebut Harmagedon.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Yunani memakai verba tunggal, “ia mengumpulkan,” tetapi tidak menyebutkan subjeknya secara eksplisit. Dalam konteks ayat 13–14, tindakan ini dapat pula dikaitkan dengan roh-roh najis yang pergi untuk mengumpulkan para raja.
    reason: alternative_reading
  - marker: b
    text: Atau “dalam bahasa Ibrani/Aram.” Dalam kitab Wahyu, ungkapan “dalam bahasa Ibrani” dapat menunjuk pada bentuk nama dalam bahasa Semit tanpa harus membedakan secara ketat antara bahasa Ibrani dan Aram.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγαγεν
  choice: ia mengumpulkan
  rationale: Bentuk verba Yunani ini tunggal dan subjeknya tidak dinyatakan secara eksplisit. Kata ganti “ia” mempertahankan subjek tunggal tanpa menentukan identitasnya secara tegas.
- source_word: αὐτοὺς
  choice: mereka
  rationale: Pronomina akusatif jamak ini merujuk kepada pihak-pihak yang dikumpulkan, yakni para raja dalam konteks ayat 14.
- source_word: εἰς τὸν τόπον
  choice: ke tempat
  rationale: Terjemahan langsung dan alami yang mempertahankan gerak menuju lokasi tersebut.
- source_word: τὸν καλούμενον
  choice: yang ... disebut
  rationale: Klausa relatif pasif ini menyampaikan fungsi partisipel Yunani secara alami dalam bahasa Indonesia.
- source_word: Ἑβραϊστὶ
  choice: dalam bahasa Ibrani
  rationale: Ini padanan transparan bagi istilah Yunani, dengan kemungkinan cakupan bahasa Semit setempat dijelaskan dalam catatan kaki.
- source_word: Ἁρμαγεδών
  choice: Harmagedon
  rationale: Transliterasi yang lazim dalam bahasa Indonesia dan tetap dekat dengan bentuk Yunani yang memakai bunyi awal beraspirasi.
theological_decisions:
- issue: Pelaku yang mengumpulkan
  choice: ia mengumpulkan mereka
  alternative: mereka mengumpulkan mereka
  rationale: Verba Yunani berbentuk tunggal, sehingga teks utama mempertahankan pelaku tunggal yang tersirat. Namun, identitas pelaku tidak ditentukan secara eksplisit; konteks ayat 13–14 juga memungkinkan pembaca mengaitkan tindakan ini dengan roh-roh najis. Catatan kaki menjaga ketegangan tersebut tanpa menetapkan pelakunya.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. “Lalu” mengalir alami dalam narasi; “ia” mempertahankan ketunggalan dan ketidakjelasan identitas subjek dalam teks Yunani.
