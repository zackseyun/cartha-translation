id: REV.16.12
reference: Revelation 16:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕκτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ποταμὸν τὸν μέγαν ⸀τὸν Εὐφράτην· καὶ ἐξηράνθη τὸ ὕδωρ αὐτοῦ, ἵνα ἑτοιμασθῇ ἡ ὁδὸς τῶν βασιλέων τῶν ἀπὸ ἀνατολῆς ἡλίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/012.yaml
  text: And the sixth poured out his bowl on the great river Euphrates[a], and its water was dried up, so that the way of the kings from the rising of the sun might be prepared.
translation:
  language: id
  text: Lalu yang keenam menumpahkan cawannya ke atas sungai besar itu, yaitu Sungai Efrat. Air sungai itu pun mengering, supaya jalan bagi raja-raja dari tempat matahari terbit[a] dapat dipersiapkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih sederhana, “dari timur.” Secara harfiah, “dari terbitnya matahari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἕκτος
  choice: yang keenam
  rationale: Mempertahankan elipsis dalam teks Yunani tanpa menambahkan kata “malaikat”, yang hanya dapat dipahami dari konteks sebelumnya.
- source_word: ἐξέχεεν
  choice: menumpahkan
  rationale: Padanan alami bagi tindakan mencurahkan isi wadah dan mempertahankan gambaran pencurahan penghukuman dalam konteks Wahyu.
- source_word: φιάλην
  choice: cawan
  rationale: “Cawan” merupakan istilah yang wajar dan bermartabat dalam konteks Alkitab untuk wadah lebar yang isinya ditumpahkan; kata ini tidak menimbulkan kesan botol kecil.
- source_word: ἐπὶ τὸν ποταμὸν τὸν μέγαν τὸν Εὐφράτην
  choice: ke atas sungai besar itu, yaitu Sungai Efrat
  rationale: Menyampaikan sasaran pencurahan dan mempertahankan hubungan aposisional antara “sungai besar” dan “Efrat” dalam bahasa Indonesia yang jelas.
- source_word: ἐξηράνθη τὸ ὕδωρ αὐτοῦ
  choice: Air sungai itu pun mengering
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan menyampaikan terjadinya pengeringan tanpa menentukan pelaku yang tidak dinyatakan dalam klausa Yunani.
- source_word: ἵνα ἑτοιμασθῇ
  choice: supaya ... dapat dipersiapkan
  rationale: Mempertahankan makna tujuan dari ἵνα serta bentuk pasif kata kerja Yunani.
- source_word: ἡ ὁδὸς τῶν βασιλέων
  choice: jalan bagi raja-raja
  rationale: Mengungkapkan hubungan genitif secara alami tanpa menentukan apakah “jalan” itu harus dipahami secara harfiah atau simbolis.
- source_word: τῶν ἀπὸ ἀνατολῆς ἡλίου
  choice: dari tempat matahari terbit
  rationale: Mempertahankan citra ungkapan Yunani secara lebih alami daripada terjemahan harfiah yang kaku; alternatif ringkas “dari timur” dicatat dalam catatan kaki.
theological_decisions:
- issue: Apakah “yang keenam” perlu diperjelas menjadi “malaikat keenam”
  choice: Tetap memakai “yang keenam” tanpa menambahkan “malaikat”.
  alternative: malaikat yang keenam
  rationale: Konteks memang menunjukkan bahwa pelakunya adalah malaikat, tetapi nomina itu tidak diulangi dalam ayat ini. Elipsis dipertahankan agar terjemahan tidak menambahkan penjelasan ke dalam teks utama.
- issue: Apakah pengeringan Sungai Efrat dan kedatangan para raja perlu ditafsirkan secara simbolis
  choice: Gambaran diterjemahkan secara langsung tanpa penjelasan simbolis.
  alternative: Parafrasa yang menerangkan gambaran itu sebagai penyerbuan atau penghimpunan pada akhir zaman.
  rationale: Ayat ini tidak menjelaskan sendiri seluruh arti simboliknya. Terjemahan mempertahankan gambaran dan ketegangan teologis teks tanpa memaksakan satu penafsiran.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur Yunani dipertahankan sejauh tetap alami, termasuk elipsis “yang keenam” dan citra “tempat matahari terbit”.
