  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ χάλαζα μεγάλη ὡς ταλαντιαία καταβαίνει ἐκ τοῦ οὐρανοῦ ἐπὶ τοὺς ἀνθρώπους· καὶ ἐβλασφήμησαν οἱ ἄνθρωποι τὸν θεὸν ἐκ τῆς πληγῆς τῆς χαλάζης, ὅτι μεγάλη ἐστὶν ἡ πληγὴ αὐτῆς σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/021.yaml
  text: And great hail[a], about a talent in weight, comes down from heaven upon the people; and the people blasphemed God because of the plague of the hail[b], because its plague is exceedingly severe.
translation:
  language: id
  text: Dan hujan es yang sangat besar, kira-kira seberat satu talenta[a], turun dari surga menimpa manusia. Manusia menghujat Allah karena malapetaka hujan es itu, sebab malapetaka yang ditimbulkannya sangat dahsyat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seperti seberat satu talenta”; ungkapan Yunani menyatakan perbandingan, bukan ukuran yang tepat. Nilai berat satu talenta berbeda-beda, tetapi biasanya diperkirakan puluhan kilogram.
    reason: lexical_alternative
  - marker: b
    text: Atau, “sebab tulah yang ditimbulkannya sangat dahsyat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χάλαζα μεγάλη
  choice: hujan es yang dahsyat
  rationale: χάλαζα adalah nomina kolektif untuk hujan es, sedangkan μεγάλη menekankan kedahsyatan atau besarnya. Ungkapan ini alami dalam bahasa Indonesia dan tidak mengubah bentuk kolektif itu menjadi jamak secara tidak perlu.
- source_word: ὡς ταλαντιαία
  choice: dengan berat kira-kira satu talenta untuk setiap butirnya
  rationale: ταλαντιαία menunjuk pada berat sebesar satu talenta dan ὡς menyatakan perbandingan, bukan ukuran yang tepat. Keterangan 'untuk setiap butirnya' memperjelas bahwa berat tersebut berlaku pada butiran hujan es yang tersirat dalam nomina kolektif.
- source_word: καταβαίνει
  choice: turun
  rationale: Bentuk kini Yunani memberi daya hidup pada penglihatan apokaliptik. Bahasa Indonesia tidak menandai kala secara morfologis, sehingga 'turun' mempertahankan kehadiran adegan tanpa memaksakan penanda waktu.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: dari surga
  rationale: οὐρανός dapat berarti langit atau surga. Dalam adegan penghakiman kitab Wahyu, 'surga' mempertahankan dimensi spasial sekaligus bingkai apokaliptik-teologisnya.
- source_word: ἐπὶ τοὺς ἀνθρώπους
  choice: menimpa manusia
  rationale: ἄνθρωποι bersifat generik dan merujuk pada manusia, bukan khusus laki-laki. 'Menimpa' menyampaikan gerak ke atas sasaran secara alami dalam konteks hujan es.
- source_word: ἐβλασφήμησαν
  choice: menghujat
  rationale: Ketika objeknya Allah, βλασφημέω secara tepat berarti berkata dengan sikap menghina atau tidak hormat terhadap-Nya. 'Menghujat' mempertahankan bobot teologis istilah itu.
- source_word: τὸν θεόν
  choice: Allah
  rationale: Padanan baku bahasa Indonesia untuk θεός dalam konteks ini.
- source_word: ἐκ τῆς πληγῆς τῆς χαλάζης
  choice: karena malapetaka hujan es itu
  rationale: ἐκ dipahami secara kausal. πληγή dalam rangkaian penghakiman Wahyu menunjuk pada malapetaka atau tulah yang ditimpakan; 'malapetaka' alami di sini dan menghindari kesan bahwa hujan es itu penyakit.
- source_word: ὅτι μεγάλη ἐστὶν ἡ πληγὴ αὐτῆς σφόδρα
  choice: sebab malapetaka itu luar biasa hebatnya
  rationale: μεγάλη dan σφόδρα bersama-sama memberi penegasan kuat. Frasa Indonesia ini mempertahankan intensitas tersebut, dan 'itu' merujuk pada malapetaka yang disebabkan hujan es.
theological_decisions:
- issue: Makna οὐρανός dalam konteks penghakiman apokaliptik
  choice: dari surga
  alternative: dari langit
  rationale: Secara atmosferis hujan es turun dari langit, tetapi pola kitab Wahyu juga menggambarkan penghakiman sebagai berasal dari surga. 'Surga' mempertahankan lapisan teologis itu tanpa menyangkal arah literal dari atas.
- issue: Rujukan generik ἄνθρωποι
  choice: manusia
  alternative: orang-orang
  rationale: Nomina ini mencakup manusia secara umum dan tidak secara khusus menunjuk laki-laki. 'Manusia' tepat, ringkas, dan bermartabat.
- issue: Arti πληγή dalam adegan penghakiman
  choice: malapetaka
  alternative: tulah
  rationale: '''Tulah'' merupakan padanan penting dalam kitab Wahyu, tetapi untuk hujan es dapat terdengar seperti penyakit dalam bahasa Indonesia modern. ''Malapetaka'' mempertahankan gagasan bencana penghakiman, sementara catatan kaki menjaga alternatif leksikalnya.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada agung yang sesuai bagi sastra apokaliptik. Struktur kalimat dibuat jelas bagi pembaca umum; istilah teknis kuno 'talenta' dipertahankan dengan penjelasan dalam catatan kaki. Semua penanda catatan kaki muncul dalam teks utama.
