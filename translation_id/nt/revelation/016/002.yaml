id: REV.16.2
reference: Revelation 16:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἀπῆλθεν ὁ πρῶτος καὶ ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τὴν γῆν· καὶ ἐγένετο ἕλκος κακὸν καὶ πονηρὸν ἐπὶ τοὺς ἀνθρώπους τοὺς ἔχοντας τὸ χάραγμα τοῦ θηρίου καὶ τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/002.yaml
  text: And the first went and poured out his bowl onto the earth[a], and a harmful and grievous sore came upon the people who had the mark of the beast and who worshiped its image.
translation:
  language: id
  text: Lalu yang pertama pergi dan menumpahkan cawannya ke atas bumi. Maka timbullah luka yang parah dan menyakitkan[a] pada orang-orang yang memiliki tanda binatang itu dan yang menyembah patungnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “luka yang buruk dan ganas.” Bahasa Yunani memakai dua kata sifat negatif yang kuat, κακόν dan πονηρόν, untuk menegaskan kedahsyatan tulah ini.
    reason: Alternatif leksikal yang mempertahankan dua adjektiva Yunani dan kemungkinan nuansa maknanya.
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: pergi
  rationale: Bentuk aoris ini melanjutkan urutan narasi dan secara alami diterjemahkan 'pergi', tanpa menambahkan penekanan bahwa ia menjauh.
- source_word: ὁ πρῶτος
  choice: yang pertama
  rationale: Adjektiva berartikel ini dipakai secara substantival dan merujuk kepada malaikat pertama dalam konteks. Terjemahan ini tidak menambahkan kata 'malaikat' yang tidak dinyatakan dalam ayat.
- source_word: ἐξέχεεν
  choice: menumpahkan
  rationale: ἐκχέω berarti menuangkan atau menumpahkan keluar; 'menumpahkan' sesuai dengan formula pencurahan cawan dalam Wahyu.
- source_word: φιάλην
  choice: cawan
  rationale: φιάλη menunjuk pada wadah seperti mangkuk atau cawan yang relatif dangkal. 'Cawan' mudah dipahami dan mempertahankan istilah yang lazim dalam konteks penghakiman di Wahyu.
- source_word: εἰς τὴν γῆν
  choice: ke atas bumi
  rationale: εἰς menandai arah atau sasaran pencurahan, sedangkan γῆ dalam konteks apokaliptik ini paling wajar dipahami sebagai bumi. 'Ke atas bumi' mempertahankan gerak menuju sasaran.
- source_word: ἐγένετο
  choice: timbullah
  rationale: γίνομαι di sini menyatakan munculnya akibat pencurahan cawan. 'Timbullah' merupakan bentuk naratif Indonesia yang alami.
- source_word: ἕλκος
  choice: luka
  rationale: ἕλκος adalah luka terbuka, borok, atau lesi bernanah. 'Luka' paling mudah dipahami, sedangkan kekuatan ungkapannya dijelaskan oleh dua adjektiva yang mengikutinya.
- source_word: κακὸν καὶ πονηρὸν
  choice: parah dan menyakitkan
  rationale: Kedua adjektiva negatif ini menegaskan kedahsyatan luka. 'Parah dan menyakitkan' menyampaikan sifat buruk serta penderitaan yang ditimbulkannya tanpa memberi kesan bahwa luka itu sendiri jahat secara moral.
- source_word: ἐπὶ τοὺς ἀνθρώπους
  choice: pada orang-orang
  rationale: ἄνθρωποι merujuk kepada manusia secara umum, khususnya mereka yang berpihak kepada binatang; 'orang-orang' alami dan tidak bergender.
- source_word: τοὺς ἔχοντας τὸ χάραγμα τοῦ θηρίου
  choice: yang memiliki tanda binatang itu
  rationale: Klausa relatif mempertahankan pembatasan jelas bahwa tulah menimpa mereka yang memiliki tanda milik binatang tersebut.
- source_word: τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ
  choice: yang menyembah patungnya
  rationale: προσκυνέω dalam konteks ini berarti menyembah, dan εἰκών adalah representasi atau patung binatang. Pronomina '-nya' mempertahankan rujukan kepada binatang itu.
theological_decisions:
- issue: Dua adjektiva κακὸν καὶ πονηρὸν yang menerangkan ἕλκος
  choice: luka yang parah dan menyakitkan
  alternative: luka yang buruk dan jahat; borok yang ganas dan menyakitkan
  rationale: Teks menumpuk dua adjektiva negatif yang berdekatan maknanya untuk memperkuat kedahsyatan tulah. Pilihan ini mempertahankan intensifikasi dan dampak penderitaannya tanpa secara tidak perlu memberi sifat kejahatan moral kepada luka tersebut.
- issue: Cakupan orang yang terkena tulah
  choice: orang-orang yang memiliki tanda binatang itu dan yang menyembah patungnya
  alternative: manusia yang memiliki tanda itu; mereka yang memiliki dan menyembah
  rationale: Teks secara khusus membatasi penerima tulah kepada orang-orang yang ditandai oleh kesetiaan kepada binatang, baik melalui tanda maupun penyembahan patungnya. Terjemahan tidak memperluas cakupan penghakiman melampaui teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat dan mudah dipahami. Struktur 'yang pertama' sengaja dipertahankan agar tidak menambahkan 'malaikat' dari konteks. Istilah 'binatang' dan 'patung' dipakai secara konsisten dengan citra khas kitab Wahyu.
