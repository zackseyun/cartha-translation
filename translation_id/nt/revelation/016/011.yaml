id: REV.16.11
reference: Revelation 16:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐβλασφήμησαν τὸν θεὸν τοῦ οὐρανοῦ ἐκ τῶν πόνων αὐτῶν καὶ ἐκ τῶν ἑλκῶν αὐτῶν, καὶ οὐ μετενόησαν ἐκ τῶν ἔργων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/011.yaml
  text: And they blasphemed the God of heaven because of their pains and their sores[c][b][a], and they did not repent of their deeds.
translation:
  language: id
  text: Mereka menghujat Allah yang di surga karena rasa sakit dan borok mereka,[a][b] dan mereka tidak bertobat dari perbuatan-perbuatan mereka.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mencerca” atau “berkata jahat tentang” Allah yang di surga.
    reason: lexical_alternative
  - marker: b
    text: Atau “tukak-tukak mereka.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “tidak bertobat dari perbuatan-perbuatan mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβλασφήμησαν
  choice: menghujat
  rationale: Kata ini menyatakan ucapan yang mencela atau tidak hormat terhadap Allah; “menghujat” mempertahankan daya religiusnya secara alami dalam bahasa Indonesia.
- source_word: τὸν θεὸν τοῦ οὐρανοῦ
  choice: Allah yang di surga
  rationale: Ungkapan ini mempertahankan acuan kepada Allah sebagai Dia yang berada di surga, sekaligus terdengar wajar dalam bahasa Indonesia modern.
- source_word: ἐκ τῶν πόνων αὐτῶν
  choice: karena rasa sakit ... mereka
  rationale: Dalam konteks ini ἐκ berfungsi kausal, sedangkan πόνοι menunjuk pada rasa sakit atau penderitaan jasmani yang berat.
- source_word: ἑλκῶν
  choice: borok
  rationale: Ἕλκος berarti luka terbuka, borok, atau tukak. “Borok” jelas bagi pembaca umum dan sesuai dengan konteks tulah tanpa menambahkan rincian medis.
- source_word: μετενόησαν
  choice: tidak bertobat
  rationale: Dalam Wahyu, μετανοέω memiliki makna moral dan religius, bukan sekadar berubah pikiran.
- source_word: ἐκ τῶν ἔργων αὐτῶν
  choice: bertobat dan meninggalkan perbuatan-perbuatan mereka
  rationale: Preposisi ἐκ menyatakan berpaling atau menjauh dari perbuatan sebelumnya. Penambahan “meninggalkan” membuat relasi itu eksplisit dan alami dalam bahasa Indonesia tanpa menentukan jenis perbuatannya.
theological_decisions:
- issue: Daya kausal dan separatif dari frasa-frasa ἐκ
  choice: Penderitaan mereka menjadi alasan mereka menghujat Allah, sedangkan pertobatan yang tidak terjadi dipahami sebagai tidak berpaling dari perbuatan mereka.
  alternative: Menerjemahkan ketiga frasa secara lebih harfiah dengan “dari”, meskipun hasilnya kurang alami dan dapat mengaburkan hubungan logisnya.
  rationale: Pemakaian pertama dan kedua paling wajar bersifat kausal dalam konteks reaksi terhadap penghakiman; pemakaian terakhir bersama μετανοέω menyatakan pemisahan atau tindakan meninggalkan perbuatan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. “Menghujat” mempertahankan nuansa religius; “borok” mudah dipahami; struktur kontras dengan “tetapi” menonjolkan bahwa penderitaan tidak menghasilkan pertobatan.
