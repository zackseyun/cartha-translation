id: REV.16.3
reference: Revelation 16:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ὁ ⸀δεύτερος ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τὴν θάλασσαν· καὶ ἐγένετο αἷμα ὡς νεκροῦ, καὶ πᾶσα ψυχὴ ⸀ζωῆς ἀπέθανεν ⸀τὰ ἐν τῇ θαλάσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/003.yaml
  text: And the second poured out his bowl into the sea[a], and it became blood like that of a dead man, and every living creature in the sea died.
translation:
  language: id
  text: Lalu, yang kedua menumpahkan mangkuknya ke dalam laut, dan laut itu menjadi darah, seperti darah seorang yang mati. Setiap makhluk hidup di dalam laut mati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “darah seperti [darah] seorang mati.” Atau: “seperti darah dari mayat.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: yang kedua
  rationale: Adjektiva substantival ini merujuk kepada malaikat kedua dalam konteks dekat, tetapi kata 'malaikat' tidak dinyatakan dalam ayat ini; bentuk eliptis Yunani dipertahankan secara wajar.
- source_word: ἐξέχεεν
  choice: menumpahkan
  rationale: Padanan alami untuk tindakan mencurahkan isi mangkuk dan sesuai dengan gambaran rangkaian penghukuman ini.
- source_word: φιάλην
  choice: mangkuk
  rationale: φιάλη menunjuk pada wadah lebar dan dangkal; 'mangkuk' lebih tepat daripada istilah tradisional yang dapat memberi kesan botol kecil.
- source_word: εἰς τὴν θάλασσαν
  choice: ke dalam laut
  rationale: Mempertahankan arah gerak yang dinyatakan oleh εἰς dan terdengar alami dalam bahasa Indonesia.
- source_word: ἐγένετο αἷμα
  choice: Laut itu menjadi darah
  rationale: Subjek tersirat diperjelas sebagai laut demi kealamian bahasa Indonesia, tanpa mengubah pernyataan bahwa laut benar-benar menjadi darah dalam penglihatan.
- source_word: ὡς νεκροῦ
  choice: seperti darah orang mati
  rationale: Kata 'darah' yang tersirat dalam perbandingan dibuat eksplisit. Ungkapan ini mempertahankan bentuk tunggal dan tidak menentukan apakah yang dimaksud mayat atau darah milik orang yang mati.
- source_word: πᾶσα ψυχὴ ζωῆς
  choice: setiap makhluk hidup
  rationale: Dalam konteks laut, ungkapan ini berarti setiap makhluk yang bernyawa; 'makhluk hidup' alami dan menghindari pengertian antropologis yang keliru dari terjemahan harfiah 'jiwa'.
- source_word: ἀπέθανεν
  choice: mati
  rationale: Padanan langsung dan lugas yang mempertahankan kerasnya pernyataan.
- source_word: τὰ ἐν τῇ θαλάσσῃ
  choice: yang ada di dalam laut
  rationale: Frasa ini secara alami dikaitkan dengan 'setiap makhluk hidup' serta mempertahankan cakupan lokasi yang dinyatakan teks.
theological_decisions:
- issue: Sifat gambaran tulah
  choice: Menerjemahkan laut menjadi darah dalam penglihatan tanpa melunakkan bahasa penghukuman.
  alternative: Menerjemahkan secara fenomenologis bahwa laut hanya tampak seperti darah.
  rationale: Teks Yunani menyatakan bahwa laut 'menjadi darah', lalu menerangkan sifat darah itu melalui perbandingan dengan darah orang mati. Terjemahan mempertahankan daya dan ketegangan gambaran penghakiman tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan khidmat. Struktur kalimat dipecah agar rujukan subjek jelas dan alami, sementara pengulangan 'laut' mempertahankan kejelasan tanpa menambah isi teologis.
