  rationale: Revisi ini mempertahankan seluruh unsur sumber, terutama perbandingan eliptis dan bentuk tunggal νεκροῦ, sambil memakai bahasa Indonesia baku yang lebih jelas. Penanda catatan kaki dipindahkan ke akhir pernyataan agar menjangkau perbandingan yang dijelaskan tanpa mengganggu kelancaran kalimat.
