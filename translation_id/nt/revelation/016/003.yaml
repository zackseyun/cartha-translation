  - severity: medium
    issue: Catatan kaki tidak tepat menyebut “darah seperti darah milik orang mati” sebagai terjemahan harfiah.
    rationale: Kata “milik” bukan unsur leksikal Yunani; hubungan dengan “darah” dipahami dari elipsis. Catatan kaki perlu menyatakan elipsis itu secara transparan dan mempertahankan alternatif “mayat.”
