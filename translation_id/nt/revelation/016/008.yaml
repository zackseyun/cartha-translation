source:
  edition: SBLGNT
  text: Καὶ ὁ ⸀τέταρτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ἥλιον· καὶ ἐδόθη αὐτῷ καυματίσαι ⸂τοὺς ἀνθρώπους ἐν πυρί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/008.yaml
  text: And the fourth poured out his bowl on the sun[a], and it was given to it to scorch the people with fire.
translation:
  language: id
  text: Malaikat yang keempat menumpahkan mangkuknya ke atas matahari. Lalu kepada matahari itu diberikan kuasa untuk menghanguskan manusia dengan api.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Lalu kepadanya diberikan untuk menghanguskan manusia dalam api.” Kata “kepadanya” kemungkinan besar mengacu kepada matahari.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τέταρτος
  choice: malaikat yang keempat
  rationale: Bentuk adjektiva substantival secara harfiah berarti 'yang keempat', tetapi dalam rangkaian ini acuannya jelas malaikat keempat. Penambahan 'malaikat' membuat bahasa Indonesia alami tanpa mengubah acuan.
- source_word: ἐξέχεεν
  choice: menumpahkan
  rationale: Padanan baku dan alami bagi tindakan mencurahkan isi mangkuk dalam rangkaian penghukuman ini.
- source_word: φιάλην
  choice: mangkuk
  rationale: φιάλη menunjuk wadah lebar dan dangkal; 'mangkuk' merupakan padanan modern yang tepat dan menghindari istilah kuno.
- source_word: ἐπὶ τὸν ἥλιον
  choice: ke atas matahari
  rationale: ἐπί dengan akusatif menandai sasaran pencurahan; ungkapan ini mempertahankan gambaran spasial teks sumber.
- source_word: ἐδόθη αὐτῷ
  choice: kepada matahari itu diberikan kuasa
  rationale: Susunan pasif mempertahankan pelaku ilahi yang tidak disebutkan. 'Kuasa' tersirat oleh konstruksi pemberian kemampuan dan diperlukan agar kalimat Indonesia jelas; acuan pronomina dinyatakan sebagai matahari untuk menghindari ketidakjelasan pronomina Indonesia.
- source_word: καυματίσαι
  choice: untuk menghanguskan
  rationale: Kata ini menyatakan menyebabkan panas menyengat atau membakar; 'menghanguskan' kuat, alami, dan sesuai dengan api.
- source_word: τοὺς ἀνθρώπους
  choice: manusia
  rationale: Istilah ini bersifat generik dan mencakup manusia tanpa membatasi jenis kelamin.
- source_word: ἐν πυρί
  choice: dengan api
  rationale: ἐν di sini paling wajar dipahami sebagai sarana atau cara; 'dengan api' alami dalam bahasa Indonesia sambil mempertahankan citra teks.
theological_decisions:
- issue: Pelaku tersirat dalam bentuk pasif ἐδόθη
  choice: Mempertahankan bentuk pasif tanpa menyebut Allah sebagai pemberi.
  alternative: Allah memberikan kuasa kepada matahari itu.
  rationale: Bentuk pasif ilahi menyiratkan kedaulatan atau izin Allah, tetapi teks tidak menyebut pelakunya secara eksplisit.
- issue: Acuan αὐτῷ
  choice: Memahami pronomina sebagai mengacu kepada matahari.
  alternative: Pronomina mengacu kepada malaikat keempat atau pelaku lain yang tidak disebutkan.
  rationale: Matahari adalah anteseden terdekat, dan tindakan menghanguskan manusia sesuai dengan perannya sebagai sarana penghukuman. Catatan kaki mempertahankan kesadaran bahwa bahasa sumber memakai pronomina.
- issue: Makna generik τοὺς ἀνθρώπους
  choice: manusia
  alternative: orang-orang atau kaum laki-laki
  rationale: ἄνθρωπος di sini mengacu kepada manusia secara umum, bukan khusus kepada laki-laki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Malaikat' dinyatakan demi kelancaran dan kejelasan acuan dalam bahasa Indonesia, meskipun teks Yunani hanya berbunyi 'yang keempat'. Bentuk pasif dipertahankan agar pelaku pemberian kuasa tidak ditambahkan secara eksplisit.
