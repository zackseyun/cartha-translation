id: REV.16.10
reference: Revelation 16:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ὁ πέμπτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν θρόνον τοῦ θηρίου· καὶ ἐγένετο ἡ βασιλεία αὐτοῦ ἐσκοτωμένη, καὶ ἐμασῶντο τὰς γλώσσας αὐτῶν ἐκ τοῦ πόνου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/010.yaml
  text: And the fifth poured out his bowl on the throne of the beast[a], and its kingdom became darkened, and they were gnawing their tongues because of the pain[b],
translation:
  language: id
  text: Lalu yang kelima menumpahkan mangkuknya ke atas takhta binatang itu. Kerajaannya pun menjadi gelap[a], dan orang-orang menggigit-gigit lidah mereka karena kesakitan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “diliputi kegelapan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πέμπτος
  choice: yang kelima
  rationale: Teks Yunani hanya memakai kata bilangan bertingkat dengan artikel. Kata 'malaikat' tersirat dari konteks, tetapi tidak ditambahkan ke teks utama.
- source_word: ἐξέχεεν τὴν φιάλην αὐτοῦ
  choice: menumpahkan mangkuknya
  rationale: Kata 'menumpahkan' merupakan padanan alami untuk tindakan menuangkan seluruh isi, sedangkan 'mangkuk' mempertahankan gambaran wadah lebar dalam rangkaian penghukuman ini.
- source_word: ἐπὶ τὸν θρόνον τοῦ θηρίου
  choice: ke atas takhta binatang itu
  rationale: Frasa ini menyatakan sasaran pencurahan. 'Binatang' mempertahankan citra apokaliptik yang mapan dalam Wahyu.
- source_word: ἡ βασιλεία αὐτοῦ
  choice: kerajaannya
  rationale: Bentuk '-nya' secara alami merujuk kepada binatang itu tanpa memaksakan pembedaan gender yang tidak dimiliki bahasa Indonesia, sekaligus mempertahankan arti βασιλεία sebagai kerajaan atau wilayah kekuasaan.
- source_word: ἐγένετο ... ἐσκοτωμένη
  choice: pun menjadi gelap
  rationale: Ungkapan ini mempertahankan perubahan menuju keadaan gelap yang dinyatakan oleh konstruksi Yunani. Kata 'pun' menandai akibat berikutnya secara wajar dalam bahasa Indonesia.
- source_word: ἐμασῶντο τὰς γλώσσας αὐτῶν
  choice: menggigit-gigit lidah mereka
  rationale: Bentuk berulang 'menggigit-gigit' menyampaikan tindakan yang berlangsung terus sebagaimana aspek imperfek Yunani dan terdengar alami untuk reaksi terhadap rasa sakit hebat.
- source_word: ἐκ τοῦ πόνου
  choice: karena kesakitan
  rationale: ἐκ menyatakan sebab atau sumber tindakan. 'Karena kesakitan' merupakan ungkapan Indonesia yang jelas dan idiomatis.
theological_decisions:
- issue: Rujukan kata ganti pada kerajaan binatang itu
  choice: kerajaannya
  alternative: kerajaan binatang itu
  rationale: Bentuk '-nya' mempertahankan rujukan langsung kepada binatang itu tanpa menambahkan penafsiran mengenai personifikasi atau gender.
- issue: Kadar ketegasan gambaran penghukuman berupa kegelapan
  choice: menjadi gelap
  alternative: diliputi kegelapan
  rationale: Pilihan utama mengikuti pernyataan hasil dalam bahasa Yunani secara langsung, sedangkan alternatif yang lebih hidup dicatat tanpa dimasukkan ke teks utama.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur ayat dibuat alami tanpa menambahkan 'malaikat' yang hanya tersirat. Pengulangan 'menggigit-gigit' mempertahankan nuansa tindakan yang terus berlangsung.
