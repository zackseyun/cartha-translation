review_pass:
  verdict: revise
  source_fidelity: Teks utama pada umumnya setia kepada Yunani. Namun, dalam susunan "supaya ia tidak berjalan ke mana-mana dengan telanjang dan orang-orang melihat aibnya," negasi "tidak" secara alami hanya menguasai klausa pertama dalam bahasa Indonesia, sedangkan ἵνα μὴ mencakup hasil yang hendak dihindari dalam kedua unsur koordinat. Frasa "ke mana-mana" juga menambahkan nuansa distributif yang tidak diperlukan oleh περιπατῇ.
  naturalness: Ragamnya baku dan sesuai untuk Wahyu. "Berjalan telanjang" lebih langsung dan idiomatis daripada "berjalan ke mana-mana dengan telanjang." Pengulangan "tidak" pada klausa kedua diperlukan demi kejelasan cakupan negasi.
  terminology: '"Lihatlah," "Aku datang," "Berbahagialah," "berjaga-jaga," "pakaian," dan "aibnya" sesuai dengan register dan makna leksikal. Catatan kaki b dalam draf terlalu mempersempit ἀσχημοσύνη menjadi "bagian tubuhnya yang memalukan"; istilah itu lebih luas, yakni sesuatu/keadaan yang memalukan atau paparan yang mendatangkan malu.'
  issues:
  - severity: medium
    issue: Cakupan negasi dalam klausa tujuan tidak jelas dan cenderung salah arah.
    rationale: Dalam bahasa Indonesia, "supaya ia tidak ... dan orang-orang melihat ..." dapat menyatakan bahwa orang-orang benar-benar melihat aibnya. Yunani menyatakan tujuan untuk mencegah ia berjalan telanjang dan aibnya terlihat.
  - severity: low
    issue: '"Ke mana-mana" menambahkan nuansa.'
    rationale: περιπατῇ berarti berjalan atau berjalan-jalan; frasa Indonesia tersebut dapat menyiratkan perjalanan ke berbagai tempat, yang tidak dinyatakan sumber.
  - severity: medium
    issue: Catatan kaki b terlalu spesifik secara leksikal.
    rationale: ἀσχημοσύνη dapat menunjuk pada kehinaan, ketidaksopanan, atau paparan memalukan; "bagian tubuh" merupakan pembatasan interpretatif yang tidak perlu.
  revised_text: “Lihatlah, Aku datang seperti pencuri. Berbahagialah orang yang tetap berjaga-jaga[a] dan menjaga pakaiannya, supaya ia tidak berjalan telanjang dan aibnya tidak terlihat oleh orang-orang[b]—”
