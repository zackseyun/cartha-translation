id: REV.16.15
reference: Revelation 16:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἰδοὺ ἔρχομαι ὡς κλέπτης. μακάριος ὁ γρηγορῶν καὶ τηρῶν τὰ ἱμάτια αὐτοῦ, ἵνα μὴ γυμνὸς περιπατῇ καὶ βλέπωσιν τὴν ἀσχημοσύνην αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/015.yaml
  text: Behold[a], I am coming like a thief. Blessed is the one who stays awake and keeps his garments[b], so that he may not walk about naked and they see his shame—
translation:
  language: id
  text: “Lihatlah, Aku datang seperti pencuri. Berbahagialah orang yang tetap berjaga-jaga[a] dan menjaga pakaiannya, supaya ia tidak berjalan telanjang dan aibnya tidak terlihat oleh orang-orang[b]—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “orang yang tetap terjaga” atau “orang yang tetap waspada.”
    reason: lexical_alternative
  - marker: b
    text: Atau “ketidaksopanannya” atau “hal yang memalukannya”; kata Yunani ini dapat menunjuk pada paparan yang mendatangkan malu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Lihatlah
  rationale: Kata seru ini mengarahkan perhatian pendengar. “Lihatlah” alami dalam bahasa Indonesia modern, tetapi tetap mempertahankan nada khidmat dan mendesak.
- source_word: ἔρχομαι
  choice: Aku datang
  rationale: Bentuk kini Yunani memiliki daya yang hidup dan dapat menunjuk pada kedatangan yang segera; “Aku datang” mempertahankan kesegeraan itu tanpa menambahkan keterangan waktu.
- source_word: ὡς κλέπτης
  choice: seperti pencuri
  rationale: Mempertahankan perbandingan tentang kedatangan yang tak terduga, bukan menyamakan sifat moral sang pembicara dengan pencuri.
- source_word: μακάριος
  choice: Berbahagialah
  rationale: Ungkapan baku dalam ucapan bahagia yang menyatakan keadaan diperkenan dan diberkati, bukan sekadar perasaan senang.
- source_word: ὁ γρηγορῶν
  choice: orang yang tetap berjaga-jaga
  rationale: γρηγορέω mencakup tetap terjaga dan waspada. “Tetap berjaga-jaga” alami dalam konteks peringatan dan mempertahankan makna kiasan kewaspadaan.
- source_word: τηρῶν
  choice: menjaga
  rationale: Dengan objek pakaian, “menjaga” mempertahankan cakupan makna memelihara, mengamankan, atau tidak membiarkannya hilang tanpa menentukan salah satu secara berlebihan.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: pakaiannya
  rationale: “Pakaian” jelas dan bermartabat dalam bahasa Indonesia modern serta tetap membuka kemungkinan resonansi simbolis dalam Wahyu.
- source_word: ἵνα μὴ
  choice: supaya ... tidak
  rationale: Menyampaikan hubungan tujuan negatif secara alami dalam bahasa Indonesia.
- source_word: γυμνὸς περιπατῇ
  choice: ia tidak berjalan ke mana-mana dengan telanjang
  rationale: Meneruskan gambaran konkret περιπατέω dan γυμνός. Frasa ini menyatakan keadaan telanjang ketika berjalan tanpa mengalihkan gambaran menjadi penafsiran simbolis.
- source_word: βλέπωσιν
  choice: orang-orang melihat
  rationale: Subjek verba orang ketiga jamak tidak disebutkan. Bahasa Indonesia memerlukan subjek yang lebih jelas; “orang-orang” mempertahankan sifat tak tentu tanpa menunjuk kelompok tertentu.
- source_word: τὴν ἀσχημοσύνην αὐτοῦ
  choice: aibnya
  rationale: ἀσχημοσύνη dapat menunjuk pada bagian tubuh yang memalukan atau keadaan tersingkap yang mendatangkan malu. “Aibnya” mempertahankan hubungan antara ketelanjangan dan kehinaan tanpa mengulang “ketelanjangan” secara datar.
theological_decisions:
- issue: Daya metaforis pakaian, ketelanjangan, dan aib dalam konteks apokaliptik
  choice: Mempertahankan gambaran konkretnya dalam teks utama tanpa menjelaskan simbolnya.
  alternative: Menafsirkan pakaian sebagai kesiapan moral atau perbuatan benar, dan ketelanjangan sebagai kehinaan eskatologis.
  rationale: Bahasa Yunani menyajikan gambaran konkret yang kemungkinan mempunyai resonansi simbolis, tetapi tidak menerangkan simbol itu di dalam ayat. Terjemahan tidak seharusnya menutup ketegangan tersebut.
- issue: Rujukan maskulin tunggal yang bersifat representatif
  choice: Menggunakan bentuk tunggal “orang ... ia ... -nya”.
  alternative: Mengubahnya menjadi bentuk jamak seperti “orang-orang ... mereka”.
  rationale: Konstruksi partisip Yunani berbentuk maskulin tunggal dan berfungsi secara representatif. Struktur tunggal dapat dipertahankan secara alami dalam bahasa Indonesia tanpa membatasi penerapannya hanya kepada laki-laki.
- issue: Identitas pembicara dan kapitalisasi pronomina
  choice: Menggunakan “Aku” untuk perkataan Kristus.
  alternative: Menggunakan “aku” sesuai kapitalisasi umum pronomina.
  rationale: Kapitalisasi membantu pembaca Indonesia mengenali rujukan ilahi dalam tradisi penerbitan Alkitab tanpa menambahkan gelar atau penafsiran ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kalimat langsung dipertahankan, demikian pula tanda pisah pada akhir ayat yang menandakan sisipan berlanjut kembali ke alur penglihatan. Semua penanda catatan kaki muncul dalam teks utama.
