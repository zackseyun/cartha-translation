    reason: Menjelaskan idiom sumber yang dapat disalahpahami seolah-olah Babel sebelumnya dilupakan oleh Allah.
  revision_rationale: Revisi memulihkan daya aktif infinitif Yunani dan menghasilkan rangkaian metafora penghakiman yang wajar dalam bahasa Indonesia. Terjemahan tetap mempertahankan idiom “diingat di hadapan Allah” serta tidak menentukan secara berlebihan apakah infinitif itu terutama menyatakan tujuan atau hasil.
