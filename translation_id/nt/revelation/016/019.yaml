  to: Kota besar itu terbelah menjadi tiga bagian, dan kota-kota bangsa-bangsa runtuh. Dan Babel yang besar itu diingat di hadapan Allah[a], untuk memberikan kepadanya cawan berisi anggur kegeraman murka-Nya.
