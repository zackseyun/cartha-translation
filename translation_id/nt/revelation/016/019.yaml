id: REV.16.19
reference: Revelation 16:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἡ πόλις ἡ μεγάλη εἰς τρία μέρη, καὶ αἱ πόλεις τῶν ἐθνῶν ἔπεσαν· καὶ Βαβυλὼν ἡ μεγάλη ἐμνήσθη ἐνώπιον τοῦ θεοῦ δοῦναι αὐτῇ τὸ ποτήριον τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/019.yaml
  text: And the great city was split into three parts[a], and the cities of the nations fell. And Babylon the great was remembered before God, to give her the cup of the wine of the fury of his wrath.
translation:
  language: id
  text: Kota besar itu terbelah menjadi tiga bagian, dan kota-kota bangsa-bangsa runtuh. Dan Babel yang besar itu diingat di hadapan Allah[a], untuk memberikan kepadanya cawan berisi anggur kegeraman murka-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “diingat di hadapan Allah.” Ungkapan alkitabiah ini berarti bahwa Babel mendapat perhatian Allah untuk dihakimi.
    reason: Menjelaskan idiom sumber yang dapat disalahpahami seolah-olah Babel sebelumnya dilupakan oleh Allah.
lexical_decisions:
- source_word: ἐγένετο ... εἰς τρία μέρη
  choice: terbelah menjadi tiga bagian
  rationale: 'Konstruksi ini menyatakan keadaan yang dihasilkan: kota itu menjadi tiga bagian. ''Terbelah'' menyampaikan hasil tersebut secara alami tanpa mengubah gambar apokaliptis.'
- source_word: ἡ πόλις ἡ μεγάλη
  choice: kota besar itu
  rationale: Bentuk ini wajar dalam bahasa Indonesia dan mempertahankan rujukan tertentu dari artikel Yunani.
- source_word: αἱ πόλεις τῶν ἐθνῶν
  choice: kota-kota bangsa-bangsa
  rationale: ἔθνη dalam konteks penghakiman sedunia paling netral diterjemahkan 'bangsa-bangsa', bukan secara khusus 'orang-orang bukan Yahudi'.
- source_word: ἔπεσαν
  choice: runtuh
  rationale: Secara harfiah berarti 'jatuh'; untuk kota-kota, 'runtuh' menyampaikan akibat kehancuran secara alami dalam bahasa Indonesia.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: Babel yang besar
  rationale: Mempertahankan nama tradisional Indonesia untuk Babylon serta gelar apokaliptisnya.
- source_word: ἐμνήσθη ἐνώπιον τοῦ θεοῦ
  choice: diingat di hadapan Allah
  rationale: Terjemahan ini dekat dengan idiom sumber dan membiarkan konteks menjelaskan bahwa ingatan tersebut berkaitan dengan penghakiman.
- source_word: δοῦναι αὐτῇ
  choice: sehingga kepadanya diberikan
  rationale: Infinitif dapat menyatakan tujuan atau hasil. Bentuk ini terbaca alami dan mempertahankan keterkaitan dengan tindakan penghakiman Allah tanpa harus mengulang subjek secara kaku.
- source_word: τὸ ποτήριον τοῦ οἴνου
  choice: cawan berisi anggur
  rationale: Bahasa Indonesia lebih alami memakai 'berisi' daripada rantai genitif 'cawan dari anggur', sambil mempertahankan gambarnya.
- source_word: τοῦ θυμοῦ τῆς ὀργῆς αὐτοῦ
  choice: kemurkaan dari murka-Nya
  rationale: Dua istilah terkait, θυμός dan ὀργή, tetap dibedakan sebagai 'kemurkaan' dan 'murka', sehingga intensifikasi dalam bahasa Yunani tidak dilebur menjadi satu istilah.
theological_decisions:
- issue: Idiom penghakiman ἐμνήσθη ἐνώπιον τοῦ θεοῦ
  choice: diingat di hadapan Allah
  alternative: mendapat perhatian Allah untuk dihukum
  rationale: Pilihan utama mempertahankan idiom alkitabiah dan ketegangan teologisnya; konteks pemberian cawan menunjukkan bahwa ingatan itu menuju penghakiman.
- issue: Hubungan δοῦναι dengan klausa sebelumnya
  choice: sehingga kepadanya diberikan
  alternative: untuk memberikan kepadanya
  rationale: Infinitif Yunani dapat bernuansa tujuan atau hasil. 'Sehingga' cocok dengan alur akibat dalam bahasa Indonesia, tetapi catatan tidak memaksakan pembedaan yang terlalu tajam.
- issue: Pembedaan θυμός dan ὀργή
  choice: kemurkaan dari murka-Nya
  alternative: murka-Nya yang menyala-nyala
  rationale: Dua kata Yunani dipertahankan secara leksikal alih-alih dilebur, sehingga penumpukan retoris tentang penghakiman ilahi tetap terdengar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Diksi apokaliptis seperti 'cawan', 'anggur', 'kemurkaan', dan 'murka' dipertahankan; struktur kalimat dilancarkan secukupnya agar mudah dipahami pembaca umum.
