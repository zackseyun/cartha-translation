  to: Lalu mereka berseru dengan suara nyaring, “Sampai kapan, ya Penguasa[a] yang kudus dan benar, Engkau tidak menghakimi dan membalaskan darah kami atas orang-orang yang tinggal di bumi[b]?”
  rationale: Revisi terbatas pada preposisi yang menghubungkan pembalasan dengan “orang-orang yang tinggal di bumi” dan pada penyesuaian catatan kaki terkait. “Atas” adalah pilihan modern yang idiomatis untuk pembalasan yang dikenakan terhadap suatu pihak, tanpa menghilangkan ambiguitas gramatikal yang dicatat melalui “dari” dalam catatan kaki.
