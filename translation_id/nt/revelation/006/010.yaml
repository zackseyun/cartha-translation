  source_fidelity: 'Terjemahan secara umum mengikuti teks Yunani dengan baik: seruan keras, keluhan “Sampai kapan,” sapaan kepada Allah, serta permohonan akan penghakiman dan pembalasan semuanya dipertahankan. Namun, “membalaskan darah kami kepada orang-orang” tidak menyatakan relasi ἐκ secara idiomatis dalam bahasa Indonesia. Dalam konteks ini, orang-orang yang tinggal di bumi adalah pihak terhadap/atas siapa pembalasan itu dijalankan; “atas” menyampaikan sasaran tersebut dengan lebih tepat dan alami.'
