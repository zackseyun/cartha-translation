id: REV.6.10
reference: Revelation 6:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἔκραξαν φωνῇ μεγάλῃ λέγοντες· Ἕως πότε, ὁ δεσπότης ὁ ἅγιος καὶ ἀληθινός, οὐ κρίνεις καὶ ἐκδικεῖς τὸ αἷμα ἡμῶν ἐκ τῶν κατοικούντων ἐπὶ τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/010.yaml
  text: And they cried out with a loud voice[a], saying, “How long, Master, holy and true[b], will you refrain from judging and avenging our blood on those who dwell on the earth?”
translation:
  language: id
  text: Lalu mereka berseru dengan suara nyaring, “Sampai kapan, ya Penguasa[a] yang kudus dan benar, Engkau tidak menghakimi dan membalaskan darah kami atas orang-orang yang tinggal di bumi[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tuan Yang Berdaulat.” Kata Yunani despotes menekankan kewenangan mutlak dan berbeda dari kyrios (“Tuhan”).
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “dari orang-orang yang tinggal di bumi.” Dalam konteks ini, frasa tersebut dapat menyatakan pihak yang menjadi sasaran pembalasan. Wahyu berulang kali memakai “orang-orang yang tinggal di bumi” sebagai sebutan tematis.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔκραξαν
  choice: berseru
  rationale: Kata ini menyatakan seruan yang kuat dan mendesak; intensitasnya juga ditegaskan oleh frasa ‘dengan suara nyaring’.
- source_word: φωνῇ μεγάλῃ
  choice: dengan suara nyaring
  rationale: Ungkapan datif ini menyatakan cara berseru dan dipertahankan secara konkret dalam bahasa Indonesia yang alami.
- source_word: Ἕως πότε
  choice: Sampai kapan
  rationale: Ini adalah ungkapan Indonesia yang wajar untuk keluhan atau permohonan mengenai tindakan yang tertunda.
- source_word: δεσπότης
  choice: Penguasa
  rationale: Pilihan ini menonjolkan kewenangan penuh dan menjaga perbedaannya dari κύριος, yang lazim diterjemahkan ‘Tuhan’.
- source_word: ἅγιος
  choice: kudus
  rationale: Padanan langsung yang mempertahankan makna keterpisahan dan kemurnian ilahi.
- source_word: ἀληθινός
  choice: benar
  rationale: Dalam sapaan kepada Allah, ‘benar’ secara alami dapat mencakup sifat sejati, dapat dipercaya, dan setia pada kebenaran.
- source_word: οὐ κρίνεις καὶ ἐκδικεῖς
  choice: Engkau tidak menghakimi dan membalaskan
  rationale: Bentuk kini dengan negasi dipertahankan dalam pola pertanyaan ‘Sampai kapan ... tidak’, yang secara alami menyampaikan keluhan tentang tertundanya tindakan tanpa menghapus ketegangan bentuk Yunani.
- source_word: τὸ αἷμα ἡμῶν
  choice: darah kami
  rationale: Terjemahan harfiah mempertahankan idiom Alkitab tentang kematian karena kekerasan tanpa menjelaskannya secara berlebihan.
- source_word: ἐκ τῶν κατοικούντων ἐπὶ τῆς γῆς
  choice: kepada orang-orang yang tinggal di bumi
  rationale: ‘Kepada’ menyatakan sasaran pembalasan secara alami, sedangkan frasa berulang ‘orang-orang yang tinggal di bumi’ dipertahankan sebagai sebutan tematis dalam Wahyu.
theological_decisions:
- issue: Sapaan ilahi δεσπότης
  choice: Penguasa
  alternative: Tuan Yang Berdaulat; Tuhan
  rationale: ‘Penguasa’ menyampaikan kewenangan mutlak tanpa meratakan δεσπότης menjadi κύριος (‘Tuhan’). Catatan kaki memberi alternatif yang lebih eksplisit.
- issue: Permohonan para martir agar keadilan dijalankan
  choice: menghakimi dan membalaskan darah kami
  alternative: menghakimi dan membela kami
  rationale: Teks secara eksplisit memohon penghakiman dan pembalasan ilahi atas penumpahan darah. Bahasa yudisial-retributif ini dipertahankan dan tidak diperhalus menjadi sekadar pembelaan.
- issue: Bentuk pertanyaan negatif οὐ κρίνεις καὶ ἐκδικεῖς
  choice: Sampai kapan ... Engkau tidak menghakimi dan membalaskan
  alternative: Berapa lama lagi sebelum Engkau menghakimi dan membalaskan
  rationale: Pilihan utama mempertahankan negasi dan ketegangan retoris teks Yunani, sementara alternatif lebih idiomatis tetapi menambahkan hubungan ‘sebelum’ yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan ‘ya Penguasa’ menjaga nada doa yang mendesak; ‘orang-orang yang tinggal di bumi’ mempertahankan frasa tematis kitab Wahyu. Semua penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskannya.
