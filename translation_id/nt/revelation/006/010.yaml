  terminology: “Penguasa” merupakan padanan yang dapat dipertahankan untuk δεσπότης dan cukup membedakannya dari κύριος (“Tuhan”). “Kudus,” “benar,” “menghakimi,” “darah kami,” dan “orang-orang yang tinggal di bumi” juga sesuai. Catatan tentang δεσπότης tetap membantu, sedangkan catatan kedua perlu diselaraskan dengan terjemahan yang direvisi.
