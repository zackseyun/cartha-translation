id: REV.6.5
reference: Revelation 6:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξε τὴν σφραγῖδα τὴν τρίτην, ἤκουσα τοῦ τρίτου ζῴου λέγοντος· Ἔρχου. καὶ ⸀εἶδον, καὶ ἰδοὺ ἵππος μέλας, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ἔχων ζυγὸν ἐν τῇ χειρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/005.yaml
  text: And when he opened the third seal[a], I heard the third living creature saying, “Come.” And I looked, and behold, a black horse[b], and the one sitting on it had a pair of scales in his hand.
translation:
  language: id
  text: Ketika Anak Domba membuka meterai yang ketiga, aku mendengar makhluk hidup yang ketiga berkata, “Datanglah!”[a] Lalu aku melihat, dan tampaklah seekor kuda hitam, dan orang yang duduk di atasnya memegang sebuah neraca[b] di tangannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kemarilah!” Perintah ini dapat dipahami sebagai ditujukan kepada Yohanes atau sebagai panggilan agar kuda dan penunggangnya tampil.
    reason: alternative_reading
  - marker: b
    text: Kata Yunani yang dipakai juga dapat berarti alat timbang atau timbangan. Dalam konteks ini, kemungkinan besar yang dimaksud adalah neraca untuk menakar bahan makanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνοιξε
  choice: membuka
  rationale: Padanan langsung dan wajar bagi tindakan membuka meterai; subjek dijelaskan sebagai Anak Domba dari konteks terdekat tanpa mengubah rujukannya.
- source_word: σφραγῖδα τὴν τρίτην
  choice: meterai yang ketiga
  rationale: Mempertahankan urutan meterai dan memakai istilah Indonesia yang lazim dalam konteks Wahyu.
- source_word: τοῦ τρίτου ζῴου
  choice: makhluk hidup yang ketiga
  rationale: Membedakan sosok ruang takhta ini dari hewan biasa serta mengikuti makna ζῷον dalam konteks Wahyu.
- source_word: Ἔρχου
  choice: Mari!
  rationale: Imperatif tunggal yang singkat dan kuat; bentuk ini tidak menetapkan apakah seruan ditujukan kepada Yohanes atau memanggil kuda beserta penunggangnya.
- source_word: εἶδον, καὶ ἰδοὺ
  choice: aku melihat, dan tampaklah
  rationale: Mengungkapkan gerak penglihatan dan daya penunjuk ἰδού secara alami serta hidup dalam bahasa Indonesia.
- source_word: ἵππος μέλας
  choice: seekor kuda hitam
  rationale: Terjemahan langsung yang mempertahankan warna simbolis dalam penglihatan.
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: orang yang duduk di atasnya
  rationale: Mencerminkan ungkapan partisipial Yunani dan tidak memadatkannya menjadi istilah interpretatif 'penunggang'.
- source_word: ζυγὸν
  choice: sebuah neraca
  rationale: Dalam konteks penakaran bahan makanan pada ayat berikutnya, kata ini menunjuk alat timbang, bukan kuk.
- source_word: ἐν τῇ χειρὶ αὐτοῦ
  choice: di tangannya
  rationale: Padanan langsung dan idiomatis; bersama kata 'memegang' menyatakan bahwa neraca berada dalam penguasaannya.
theological_decisions:
- issue: Rujukan perintah Ἔρχου
  choice: Diterjemahkan hanya sebagai “Mari!” tanpa menyebut pihak yang disapa.
  alternative: Seruan kepada Yohanes agar mendekat; atau panggilan agar kuda dan penunggangnya tampil.
  rationale: Bahasa Yunani tidak menyatakan pihak yang disapa, sehingga terjemahan utama mempertahankan ketaksaan itu.
- issue: Subjek tersirat pada ἤνοιξε
  choice: “Anak Domba” dinyatakan berdasarkan konteks wacana.
  alternative: Mempertahankan pronomina tersirat sebagai “ia”.
  rationale: Subjek dalam bahasa Yunani tersirat dan merujuk kepada Anak Domba dalam rangkaian pembukaan meterai; penyebutan nomina membuat bahasa Indonesia jelas tanpa mengubah identitas tokoh.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan hidup. “Tampaklah” mempertahankan daya dramatik ἰδού, sedangkan susunan kalimat dibuat alami bagi pembaca umum. Semua penanda catatan kaki ditempatkan dalam teks utama.
