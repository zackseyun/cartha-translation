revisions:
- from: Ketika Anak Domba membuka meterai yang ketiga, aku mendengar makhluk hidup yang ketiga berkata, “Mari!”[a] Lalu aku melihat, dan tampaklah seekor kuda hitam. Orang yang duduk di atasnya memegang sebuah neraca[b] di tangannya.
  to: Ketika Anak Domba membuka meterai yang ketiga, aku mendengar makhluk hidup yang ketiga berkata, “Datanglah!”[a] Lalu aku melihat, dan tampaklah seekor kuda hitam, dan orang yang duduk di atasnya memegang sebuah neraca[b] di tangannya.
  rationale: Hanya seruan Ἔρχου diubah, dari “Mari!” menjadi “Datanglah!”, untuk menghindari nuansa ajakan inklusif yang tidak ada dalam bahasa sumber. Catatan kaki a tetap diperlukan karena penerima perintah tidak dinyatakan dalam teks Yunani. Tanda baca sesudah “kuda hitam” disesuaikan agar deretan penglihatan Yunani tetap terhubung.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:02:58Z'
review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan karena “Mari!” biasanya merupakan ajakan inklusif (‘mari kita ...’) dalam bahasa Indonesia dan kurang tepat untuk imperatif tunggal Ἔρχου. “Datanglah!” mempertahankan bentuk perintah yang singkat dan tidak menentukan siapa penerimanya. Unsur-unsur lain—Anak Domba sebagai subjek kontekstual, meterai ketiga, makhluk hidup ketiga, kuda hitam, dan orang yang duduk di atasnya dengan neraca di tangan—setia pada teks Yunani.
  naturalness: 'Teks pada dasarnya baku dan alami. “Datanglah!” lebih langsung, kuat, dan lazim sebagai seruan mandiri daripada “Mari!”. Susunan penglihatan dipertahankan dalam satu kalimat setelah seruan agar hubungan ‘lihatlah: seekor kuda hitam ... dan orang yang duduk di atasnya’ tetap jelas.'
  terminology: “Anak Domba,” “meterai,” “makhluk hidup,” dan “neraca” sesuai dengan register Wahyu dan makna istilah sumber. “Neraca” merupakan padanan yang baik untuk ζυγός dalam konteks penimbangan; catatan kaki mempertahankan kemungkinan padanan leksikal tanpa memasukkan penafsiran dogmatis.
