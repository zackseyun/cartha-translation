  to: Ketika Anak Domba membuka meterai keempat, aku mendengar suara makhluk hidup keempat itu berkata, “Datanglah!”[a]
  rationale: Revisi mengganti “Mari!” dengan “Datanglah!” agar imperatif Yunani ἔρχου diterjemahkan secara langsung dan tidak memperoleh nuansa ajakan bersama yang tidak ada dalam teks. Catatan kaki mempertahankan kemungkinan pembacaan kontekstual “Keluarlah!” serta ambiguitas mengenai pihak yang disapa.
