    issue: “Mari!” tidak secara memadai menerjemahkan Ἔρχου.
    rationale: “Mari!” biasanya berarti ajakan inklusif (‘let us’), sedangkan ἔρχου adalah perintah kepada satu pihak. “Datanglah!” mempertahankan bentuk imperatif tanpa menentukan siapa pihak yang diperintah.
  - severity: low
    issue: Catatan kaki menyebut “para penafsir” secara lebih eksplisit.
    rationale: Ini mencerminkan audit trail bahasa Inggris dan menjelaskan bahwa ketidakpastian terletak pada pihak yang disapa, bukan pada arti dasar kata Yunani.
  revised_text: Ketika Anak Domba membuka meterai keempat, aku mendengar suara makhluk hidup keempat itu berkata, “Datanglah!”[a]
