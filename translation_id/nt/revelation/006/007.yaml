  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξεν τὴν σφραγῖδα τὴν τετάρτην, ἤκουσα ⸀φωνὴν τοῦ τετάρτου ζῴου λέγοντος· ⸀Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/007.yaml
  text: And when he opened the fourth seal[a], I heard the voice of the fourth living creature saying, “Come.”
translation:
  language: id
  text: Ketika Anak Domba membuka meterai keempat, aku mendengar suara makhluk hidup keempat itu berkata, “Datanglah!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “Keluarlah!” Kata Yunani itu secara lebih harfiah berarti “Datanglah!”, tetapi para penafsir berbeda pendapat tentang apakah perintah ini ditujukan kepada Yohanes atau kepada penunggang kuda.
    reason: alternative_reading
lexical_decisions:
- source_word: ἤνοιξεν
  choice: membuka
  rationale: Bentuk aoris dari ἀνοίγω secara wajar diterjemahkan “membuka”; dalam konteks ini subjeknya adalah Anak Domba dari ayat-ayat sebelumnya.
- source_word: σφραγῖδα
  choice: meterai
  rationale: Dalam Wahyu 6, σφραγίς menunjuk pada meterai-meterai gulungan; “meterai” merupakan padanan baku dan tepat dalam bahasa Indonesia.
- source_word: τετάρτην / τετάρτου
  choice: yang keempat
  rationale: Kedua bentuk ini adalah bilangan tingkat dan diterjemahkan secara konsisten.
- source_word: φωνὴν
  choice: suara
  rationale: Kata ini menunjuk pada suara makhluk hidup keempat; konstruksi bahasa Indonesia tidak memerlukan kata sandang tersendiri.
- source_word: ζῴου
  choice: makhluk hidup
  rationale: Dalam Wahyu, ζῷον menunjuk pada makhluk-makhluk di sekitar takhta, bukan hewan biasa; pilihan ini juga membedakannya dari θηρίον, “binatang”.
- source_word: λέγοντος
  choice: berkata
  rationale: Partisipel ini paling alami dinyatakan dengan “berkata” sesudah “aku mendengar suara ...”.
- source_word: Ἔρχου
  choice: Mari!
  rationale: Imperatif ἔρχου secara langsung berarti “datanglah/marilah.” “Mari!” mempertahankan seruan langsung tanpa menentukan secara eksplisit siapa yang disapa, meskipun bentuk Indonesia ini dapat terdengar sebagai ajakan.
theological_decisions:
- issue: Subjek ἤνοιξεν yang tersirat
  choice: Anak Domba
  alternative: dia
  rationale: Bahasa Yunani mengandalkan subjek dari konteks sebelumnya, yakni Anak Domba. Penyebutan kembali subjek menghasilkan bahasa Indonesia yang jelas tanpa mengubah identitas naratifnya.
- issue: Pihak yang disapa oleh Ἔρχου
  choice: Diterjemahkan hanya sebagai “Mari!” tanpa menyebut pihak yang disapa.
  alternative: 'Perintah kepada Yohanes atau kepada penunggang kuda: “Keluarlah!”'
  rationale: Teks Yunani tidak menyatakan pihak yang disapa. Terjemahan utama mempertahankan ketidakjelasan naratif dan teologis itu; kemungkinan kontekstual lain dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Anak Domba” mengikuti rujukan kontekstual yang jelas, “meterai” mempertahankan istilah apokaliptik yang lazim, dan catatan kaki menjaga ambiguitas pihak yang disapa.
