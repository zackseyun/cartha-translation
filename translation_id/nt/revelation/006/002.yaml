id: REV.6.2
reference: Revelation 6:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ⸂εἶδον, καὶ⸃ ἰδοὺ ἵππος λευκός, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ἔχων τόξον, καὶ ἐδόθη αὐτῷ στέφανος, καὶ ἐξῆλθεν νικῶν καὶ ἵνα νικήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/002.yaml
  text: And I looked[a], and behold, a white horse, and the one sitting on it had a bow, and a crown was given to him[b], and he went out conquering and to conquer.
translation:
  language: id
  text: 'Lalu aku melihat: tampaklah seekor kuda putih. Orang yang menungganginya memegang sebuah busur. Kepadanya diberikan sebuah mahkota[a], lalu ia maju sambil menaklukkan dan untuk menaklukkan.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mahkota kemenangan” atau “karangan kemenangan”; kata Yunani στέφανος sering menunjuk mahkota atau karangan yang diberikan sebagai tanda kemenangan, bukan khusus mahkota kerajaan.
    reason: lexical_alternative
  - marker: b
    text: Teks ini tidak menyatakan identitas penunggang tersebut. Berbagai penafsiran telah diajukan.
    reason: interpretive_ambiguity
lexical_decisions:
- source_word: εἶδον ... ἰδοὺ
  choice: 'aku melihat: tampaklah'
  rationale: Menyampaikan tindakan melihat dan seruan pengarah perhatian secara alami dalam bahasa Indonesia, sekaligus mempertahankan daya hidup penglihatan apokaliptik.
- source_word: ἵππος λευκός
  choice: seekor kuda putih
  rationale: Penggolong 'seekor' alami untuk memperkenalkan kuda yang baru muncul dalam penglihatan.
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: orang yang menungganginya
  rationale: Ungkapan ini alami dan jelas dalam bahasa Indonesia serta tetap mengacu kepada sosok yang duduk di atas kuda.
- source_word: ἔχων τόξον
  choice: memegang sebuah busur
  rationale: Menyatakan bahwa busur berada dalam kepemilikannya atau tangannya tanpa menambahkan rincian yang tidak ada dalam teks.
- source_word: ἐδόθη αὐτῷ στέφανος
  choice: kepadanya diberikan sebuah mahkota
  rationale: Bentuk pasif dipertahankan, termasuk tidak disebutkannya pihak yang memberi. 'Mahkota' merupakan padanan umum, sedangkan nuansa karangan kemenangan dijelaskan dalam catatan.
- source_word: ἐξῆλθεν
  choice: ia maju
  rationale: Dalam konteks penunggang yang berangkat untuk menaklukkan, 'maju' menyampaikan gerakan keluar secara alami tanpa menentukan titik asal yang tidak dijelaskan.
- source_word: νικῶν καὶ ἵνα νικήσῃ
  choice: sebagai pemenang dan untuk menaklukkan
  rationale: '''Sebagai pemenang'' mencerminkan keadaan atau tindakan kemenangan yang menyertai keberangkatannya, sedangkan ''untuk menaklukkan'' mempertahankan daya tujuan dari ἵνα dengan subjungtif.'
theological_decisions:
- issue: Identitas penunggang kuda putih
  choice: Identitasnya tidak dinyatakan dalam terjemahan.
  alternative: Kristus atau sosok menyerupai Kristus; penguasa atau kekaisaran penakluk; antikristus atau penakluk yang menipu.
  rationale: Teks Yunani hanya menggambarkan penampilan, perlengkapan, dan tindakan penunggang itu. Terjemahan tidak boleh memasukkan salah satu identifikasi yang diperdebatkan.
- issue: Makna στέφανος
  choice: mahkota, dengan catatan mengenai nuansa kemenangan
  alternative: mahkota kemenangan atau karangan kemenangan
  rationale: στέφανος sering menunjuk mahkota atau karangan yang diberikan kepada pemenang, bukan διάδημα sebagai mahkota kerajaan. Teks utama memakai istilah Indonesia yang luas dan catatan mempertahankan nuansanya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur beruntun ayat diperlancar dengan kalimat-kalimat pendek, sementara suasana penglihatan, bentuk pasif ilahi yang tidak menyebut pemberi, tujuan penaklukan, dan ketidakjelasan identitas penunggang tetap dipertahankan.
