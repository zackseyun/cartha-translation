id: REV.6.9
reference: Revelation 6:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξεν τὴν πέμπτην σφραγῖδα, εἶδον ὑποκάτω τοῦ θυσιαστηρίου τὰς ψυχὰς τῶν ἐσφαγμένων διὰ τὸν λόγον τοῦ θεοῦ καὶ διὰ τὴν ⸀μαρτυρίαν ἣν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/009.yaml
  text: And when he opened the fifth seal[b][a], I saw under the altar the souls of those who had been slaughtered because of the word of God and because of the testimony they had.
translation:
  language: id
  text: Dan ketika ia membuka meterai yang kelima, aku melihat di bawah mezbah jiwa-jiwa mereka yang telah disembelih[a] karena firman Allah dan karena kesaksian[b] yang mereka miliki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dibantai” atau “dibunuh.” Kata Yunani yang dipakai lebih kuat daripada kata umum untuk membunuh dan dapat mengandung gema penyembelihan kurban.
    reason: lexical_alternative
  - marker: b
    text: Atau “kesaksian yang diberikan.” Istilah Yunani dapat menunjuk pada kesaksian atau testimoni yang disampaikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνοιξεν
  choice: membuka
  rationale: Padanan langsung dan alami bagi ἀνοίγω dalam rangkaian pembukaan meterai di Kitab Wahyu.
- source_word: σφραγῖδα
  choice: meterai
  rationale: Istilah baku dalam bahasa Indonesia untuk σφραγίς dan tepat bagi gambaran apokaliptik ini.
- source_word: ὑποκάτω
  choice: di bawah
  rationale: Menyatakan hubungan ruang secara jelas dan langsung.
- source_word: θυσιαστηρίου
  choice: mezbah
  rationale: Padanan baku bagi θυσιαστήριον yang mempertahankan gambaran ibadah dan kurban tanpa menentukan lebih jauh apakah acuannya surgawi atau duniawi.
- source_word: ψυχὰς
  choice: jiwa-jiwa
  rationale: Mempertahankan kekhasan penglihatan tentang orang-orang mati di bawah mezbah tanpa meratakannya menjadi sekadar 'orang-orang' atau 'nyawa'.
- source_word: ἐσφαγμένων
  choice: telah disembelih
  rationale: σφάζω menyatakan pembunuhan keras dan dapat mengandung gema pengurbanan; 'disembelih' mempertahankan daya itu, terutama dalam kaitannya dengan mezbah.
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: karena firman Allah
  rationale: διά dengan akusatif menyatakan sebab; 'karena' jelas dan alami, sedangkan 'firman Allah' merupakan padanan Indonesia yang tepat dalam konteks pewahyuan ilahi.
- source_word: μαρτυρίαν
  choice: kesaksian
  rationale: μαρτυρία dapat berarti kesaksian atau tindakan bersaksi; 'kesaksian' cocok sebagai objek yang mereka miliki dan tetap mempertahankan keluasan maknanya.
- source_word: ἣν εἶχον
  choice: yang mereka miliki
  rationale: Menerjemahkan ἔχω secara langsung tanpa menambahkan gagasan bahwa mereka memberikan atau mempertahankan kesaksian itu.
theological_decisions:
- issue: Hakikat ψυχὰς dalam penglihatan
  choice: jiwa-jiwa
  alternative: nyawa; orang-orang
  rationale: Pilihan ini mempertahankan gambaran khusus dalam penglihatan Yohanes, tetapi tidak dimaksudkan untuk menetapkan suatu antropologi lengkap di luar adegan tersebut.
- issue: Daya dan gema pengurbanan dalam ἐσφαγμένων
  choice: telah disembelih
  alternative: telah dibantai; telah dibunuh
  rationale: Kata Yunani tersebut lebih kuat daripada kata umum untuk membunuh dan selaras dengan gambaran mezbah; terjemahan utama menjaga kemungkinan gema pengurbanan tanpa menjadikannya penafsiran eksplisit.
- issue: Cakupan makna μαρτυρία
  choice: kesaksian
  alternative: tindakan bersaksi
  rationale: Teks tidak menjelaskan lebih lanjut apakah tekanannya terletak pada isi kesaksian atau tindakan memberikan kesaksian, sehingga kata yang lebih terbuka dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur ayat dipertahankan dekat dengan bahasa Yunani, tetapi tetap mudah dibaca. Kata ganti 'ia' tidak diperluas menjadi nama atau gelar subjek agar tidak menambahkan unsur yang tidak dinyatakan dalam ayat ini.
