id: REV.6.16
reference: Revelation 6:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ λέγουσιν τοῖς ὄρεσιν καὶ ταῖς πέτραις· Πέσετε ἐφ’ ἡμᾶς καὶ κρύψατε ἡμᾶς ἀπὸ προσώπου τοῦ καθημένου ἐπὶ τοῦ θρόνου καὶ ἀπὸ τῆς ὀργῆς τοῦ ἀρνίου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/016.yaml
  text: and they say to the mountains and to the rocks[a], “Fall on us and hide us from the face of the One seated on the throne and from the wrath of the Lamb,”
translation:
  language: id
  text: dan mereka berkata kepada gunung-gunung dan batu-batu karang, “Runtuhlah menimpa kami dan sembunyikanlah kami dari wajah[a] Dia yang duduk di atas takhta dan dari murka Anak Domba,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dari hadirat Dia yang duduk di atas takhta.”'
    reason: Alternatif leksikal bagi ἀπὸ προσώπου; “wajah” lebih harfiah, sedangkan “hadirat” menyampaikan fungsi idiomatis frasa tersebut.
lexical_decisions:
- source_word: λέγουσιν
  choice: mereka berkata
  rationale: Bentuk kini indikatif dipertahankan dengan ungkapan naratif Indonesia yang wajar; dalam konteks penglihatan apokaliptik, ini menyampaikan adegan secara langsung tanpa harus memakai bentuk progresif.
- source_word: ὄρεσιν
  choice: gunung-gunung
  rationale: ὄρος lazimnya berarti gunung; bentuk ulang menyatakan jamak secara jelas dan mempertahankan besarnya gambaran.
- source_word: πέτραις
  choice: batu-batu karang
  rationale: πέτρα menunjuk pada massa batu atau singkapan berbatu. 'Batu-batu karang' lebih menggambarkan formasi batu besar daripada batu-batu kecil dan tetap alami dalam bahasa Indonesia.
- source_word: Πέσετε ἐφ’ ἡμᾶς
  choice: Runtuhlah menimpa kami
  rationale: Imperatif aoris jamak menyatakan seruan mendesak. 'Runtuhlah menimpa kami' cocok ketika gunung dan batu karang disapa serta mempertahankan arah gerak ἐπί dengan akusatif.
- source_word: κρύψατε ἡμᾶς
  choice: sembunyikanlah kami
  rationale: Pilihan ini langsung, alami, dan mempertahankan daya imperatif.
- source_word: ἀπὸ προσώπου
  choice: dari wajah
  rationale: πρόσωπον secara harfiah berarti 'wajah'. Terjemahan ini mempertahankan gambaran kuat tentang perjumpaan pribadi; makna idiomatis 'hadirat' dicatat sebagai alternatif.
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: Dia yang duduk di atas takhta
  rationale: Partisip substantival ini diterjemahkan secara alami dan bermartabat, sambil mempertahankan keadaan-Nya sebagai sosok yang bertakhta.
- source_word: ὀργῆς
  choice: murka
  rationale: Dalam konteks penghakiman, ὀργή lebih kuat daripada kemarahan biasa; 'murka' mempertahankan bobot eskatologis dan yudisial.
- source_word: τοῦ ἀρνίου
  choice: Anak Domba
  rationale: ἀρνίον merupakan gelar kristologis yang mapan dalam Wahyu. Kapitalisasi menandai pemakaiannya sebagai gelar dan mempertahankan paradoks antara korban dan hakim.
theological_decisions:
- issue: Pelaku ilahi-manusia dalam gambaran penghakiman apokaliptik
  choice: Mempertahankan 'Dia yang duduk di atas takhta' dan 'Anak Domba' sebagai dua rujukan yang berbeda tetapi dikoordinasikan sebagai sumber ketakutan dalam penghakiman.
  alternative: Melebur keduanya menjadi rujukan umum kepada Allah saja, atau melunakkan ungkapan 'murka Anak Domba'.
  rationale: 'Teks Yunani mengoordinasikan dua frasa dengan ἀπό: wajah Dia yang duduk di atas takhta dan murka Anak Domba. Terjemahan mempertahankan ketegangan teologis bahwa Anak Domba yang terkait dengan pengorbanan juga menyatakan murka dalam penghakiman.'
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. Bentuk imperatif dengan -lah mempertahankan desakan seruan. Istilah 'batu-batu karang' dipakai untuk menghindari kesan batu kecil, sedangkan 'takhta', 'murka', dan 'Anak Domba' menjaga register apokaliptik yang khidmat.
