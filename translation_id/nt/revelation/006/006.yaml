- from: Lalu aku mendengar sesuatu seperti suara dari tengah-tengah keempat makhluk hidup itu berkata, “Satu liter[a] gandum seharga satu dinar[b], dan tiga liter jelai seharga satu dinar. Tetapi jangan merusak[c] minyak zaitun dan anggur itu.”
  to: Lalu aku mendengar seperti suara dari tengah-tengah keempat makhluk hidup itu berkata, “Satu liter[a] gandum seharga satu dinar[b], dan tiga liter jelai seharga satu dinar; janganlah merusak[c] minyak zaitun dan anggur.”
  rationale: Revisi menghilangkan tambahan “sesuatu” agar ὡς φωνήν diterjemahkan lebih langsung dan idiomatis, serta mengganti “Tetapi” dengan kelanjutan tanpa konjungsi kontras untuk mencerminkan καί. Tanda titik koma membantu memisahkan pengumuman harga dari larangan berikutnya tanpa menambahkan penafsiran.
