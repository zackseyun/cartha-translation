id: REV.6.6
reference: Revelation 6:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἤκουσα ⸀ὡς φωνὴν ἐν μέσῳ τῶν τεσσάρων ζῴων λέγουσαν· Χοῖνιξ σίτου δηναρίου, καὶ τρεῖς χοίνικες ⸀κριθῶν δηναρίου· καὶ τὸ ἔλαιον καὶ τὸν οἶνον μὴ ἀδικήσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/006.yaml
  text: And I heard what seemed to be a voice in the midst of the four living creatures[a], saying, “A quart of wheat for a denarius, and three quarts of barley for a denarius[c][b]; and do not harm the oil and the wine.”
translation:
  language: id
  text: Lalu aku mendengar seperti suara dari tengah-tengah keempat makhluk hidup itu berkata, “Satu liter[a] gandum seharga satu dinar[b], dan tiga liter jelai seharga satu dinar; janganlah merusak[c] minyak zaitun dan anggur.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Yunani: satu khoiniks, takaran kering sekitar satu liter dan sering dipahami sebagai kurang lebih jatah biji-bijian harian untuk satu orang.'
    reason: cultural_note
  - marker: b
    text: Satu dinar biasanya merupakan upah seorang pekerja untuk satu hari; harga-harga di sini menggambarkan kelangkaan yang parah.
    reason: cultural_note
  - marker: c
    text: 'Atau: mencelakakan; kata Yunaninya juga dapat berarti merugikan atau menyakiti.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς φωνὴν
  choice: sesuatu seperti suara
  rationale: ὡς menyatakan kemiripan atau kesan. Ungkapan ini mempertahankan kehati-hatian Yohanes mengenai apa yang didengarnya tanpa memastikan identitas pembicara.
- source_word: ἐν μέσῳ τῶν τεσσάρων ζῴων
  choice: dari tengah-tengah keempat makhluk hidup itu
  rationale: ἐν μέσῳ menunjukkan lokasi di tengah atau di antara mereka. 'Makhluk hidup' membedakan sosok-sosok takhta ini dari binatang-binatang buas yang tampil kemudian dalam Wahyu.
- source_word: λέγουσαν
  choice: berkata
  rationale: Partisip ini menerangkan 'suara' dan secara alami memperkenalkan ucapan langsung dalam bahasa Indonesia.
- source_word: Χοῖνιξ
  choice: satu liter
  rationale: χοῖνιξ ialah takaran kering kuno yang kira-kira setara dengan satu liter. Padanan ini mudah dipahami, sementara sifat perkiraannya dijelaskan dalam catatan kaki.
- source_word: σίτου
  choice: gandum
  rationale: σίτου di sini menunjuk pada gandum, yang sengaja dibedakan dari jelai.
- source_word: δηναρίου
  choice: seharga satu dinar
  rationale: Bentuk genitif menyatakan harga. 'Seharga' mengungkapkan fungsi ekonominya secara wajar dalam bahasa Indonesia, sedangkan nama uang kuno dipertahankan.
- source_word: τρεῖς χοίνικες κριθῶν
  choice: tiga liter jelai
  rationale: Takaran diulang secara konsisten dan κριθῶν diterjemahkan 'jelai', tanaman pangan yang berbeda dari gandum.
- source_word: μὴ ἀδικήσῃς
  choice: jangan merusak
  rationale: Dalam konteks hasil pertanian, ἀδικέω dapat berarti mencelakakan, merugikan, atau merusak. 'Merusak' paling alami bagi minyak zaitun dan anggur, sementara keluasan maknanya dicatat.
- source_word: τὸ ἔλαιον
  choice: minyak zaitun
  rationale: ἔλαιον dalam konteks dunia Mediterania lazimnya berarti minyak zaitun. Penyebutan lengkap menghindari ketaksaan kata 'minyak' dalam bahasa Indonesia modern.
- source_word: τὸν οἶνον
  choice: anggur
  rationale: οἶνος menunjuk pada minuman anggur; dalam pasangan hasil pertanian ini, 'anggur' merupakan padanan Indonesia yang alami.
theological_decisions:
- issue: Sebutan bagi ζῴων dalam gambaran ruang takhta
  choice: makhluk hidup
  alternative: binatang; hewan
  rationale: '''Makhluk hidup'' mencerminkan sosok-sosok penglihatan di sekitar takhta dan menghindari penyamaan yang menyesatkan dengan binatang-binatang buas yang kemudian tampil sebagai musuh.'
- issue: Tingkat kekhususan takaran dan mata uang kuno
  choice: Menggunakan padanan volume modern bagi χοῖνιξ, tetapi mempertahankan dinar sebagai mata uang kuno
  alternative: Mentransliterasikan kedua istilah; mengubah keduanya menjadi satuan dan nilai uang modern
  rationale: Padanan sekitar satu liter membuat jumlahnya segera dapat dipahami. Dinar dipertahankan karena nilai modern yang tepat tidak dapat disetarakan; arti ekonominya dijelaskan melalui upah harian dalam catatan kaki.
- issue: Sasaran larangan terhadap minyak zaitun dan anggur
  choice: Mempertahankan larangan langsung tanpa menjelaskan alasan atau cakupannya
  alternative: Menafsirkannya sebagai perlindungan barang mewah atau pembatasan hukuman
  rationale: Teks hanya melarang perusakan minyak zaitun dan anggur. Terjemahan tidak memasukkan penafsiran mengenai golongan sosial, tahapan musim, atau batas penghakiman yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat digunakan tanpa konstruksi yang terlalu arkais. 'Lalu aku mendengar' mempertahankan alur naratif penglihatan. 'Sesuatu seperti suara' menjaga ketidakpastian ὡς, sedangkan bentuk harga yang ringkas mempertahankan nada pengumuman. Istilah 'jelai' dipilih sebagai nama baku barley, dan 'minyak zaitun' memperjelas rujukan Mediterania dari ἔλαιον.
