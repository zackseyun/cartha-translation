id: REV.6.17
reference: Revelation 6:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι ἦλθεν ἡ ἡμέρα ἡ μεγάλη τῆς ὀργῆς ⸀αὐτῶν, καὶ τίς δύναται σταθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/017.yaml
  text: because the great day of their wrath has come[a], and who is able to stand?
translation:
  language: id
  text: sebab hari besar kemurkaan mereka telah tiba[a], dan siapakah yang dapat tetap berdiri?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebagian terjemahan interpretatif memakai “kemurkaan-Nya”; teks Yunani berbunyi “kemurkaan mereka,” yang merujuk bersama-sama kepada Dia yang duduk di atas takhta dan Anak Domba.
    reason: Menjelaskan bentuk jamak yang mencolok dan mencatat alternatif interpretatif tanpa mengganti bacaan sumber.
lexical_decisions:
- source_word: ὅτι
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi ketakutan yang digambarkan dalam ayat sebelumnya; “sebab” alami dan sesuai dengan nada khidmat.
- source_word: ἦλθεν
  choice: telah tiba
  rationale: Bentuk aoris menyatakan tibanya peristiwa yang kini menjadi kenyataan dan membawa akibat langsung.
- source_word: ἡ ἡμέρα ἡ μεγάλη
  choice: hari besar
  rationale: Ungkapan ini mempertahankan penekanan eskatologis sumber dengan susunan yang alami dalam bahasa Indonesia.
- source_word: τῆς ὀργῆς
  choice: kemurkaan
  rationale: Dalam konteks penghakiman ilahi, “kemurkaan” menyampaikan daya yudisial dan eskatologis yang lebih kuat daripada sekadar “kemarahan”.
- source_word: αὐτῶν
  choice: mereka
  rationale: Pronomina Yunani berbentuk jamak dan merujuk kembali kepada Dia yang duduk di atas takhta serta Anak Domba; bentuk jamak dipertahankan meskipun secara teologis mencolok.
- source_word: τίς
  choice: siapakah
  rationale: Bentuk tanya ini membuka pertanyaan retoris; “siapakah” sesuai dengan nada khidmat teks.
- source_word: δύναται
  choice: dapat
  rationale: Pilihan ini secara alami menyatakan kemampuan dalam bahasa Indonesia modern.
- source_word: σταθῆναι
  choice: tetap berdiri
  rationale: Dalam konteks penghakiman, infinitif ini bukan hanya menunjuk posisi tubuh, melainkan kemampuan untuk bertahan di hadapan kemurkaan; “tetap berdiri” menyampaikan implikasi itu tanpa penjelasan berlebihan.
theological_decisions:
- issue: Pronomina jamak yang mengaitkan kemurkaan dengan Dia yang duduk di atas takhta dan Anak Domba
  choice: Mempertahankan ungkapan jamak “kemurkaan mereka”
  alternative: Mengalihbahasakan secara interpretatif sebagai “kemurkaan-Nya” atau melebur kedua pelaku menjadi rujukan tunggal
  rationale: Teks Yunani secara eksplisit memakai αὐτῶν, “mereka,” yang merujuk kepada dua sosok dalam ayat sebelumnya. Terjemahan mempertahankan ketegangan gramatikal dan teologis ini serta tidak menyelaraskannya secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Kemurkaan” mempertahankan bobot penghakiman ilahi, sedangkan “tetap berdiri” membuat daya retoris pertanyaan penutup jelas bagi pembaca umum.
