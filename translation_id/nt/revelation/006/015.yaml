id: REV.6.15
reference: Revelation 6:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ οἱ βασιλεῖς τῆς γῆς καὶ οἱ μεγιστᾶνες καὶ οἱ χιλίαρχοι καὶ οἱ πλούσιοι καὶ οἱ ἰσχυροὶ καὶ πᾶς δοῦλος καὶ ἐλεύθερος ἔκρυψαν ἑαυτοὺς εἰς τὰ σπήλαια καὶ εἰς τὰς πέτρας τῶν ὀρέων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/015.yaml
  text: And the kings of the earth[a], and the great men, and the commanders, and the rich, and the strong, and every servant and free person[b], hid themselves in the caves and among the rocks of the mountains.
translation:
  language: id
  text: Lalu raja-raja di bumi, para pembesar[a], para panglima, orang-orang kaya, orang-orang kuat, dan setiap orang, baik budak maupun orang merdeka[b], menyembunyikan diri di dalam gua-gua dan di antara batu-batu pegunungan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para bangsawan.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “setiap budak dan orang merdeka”; bahasa Yunani memakai pasangan maskulin tunggal dengan makna yang mewakili semua orang.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεῖς τῆς γῆς
  choice: raja-raja di bumi
  rationale: γῆ dapat berarti 'bumi' atau 'negeri/tanah', tetapi dalam konteks penghakiman kosmis di Wahyu, 'bumi' paling sesuai dan selaras dengan ungkapan berulang dalam kitab ini.
- source_word: μεγιστᾶνες
  choice: para pembesar
  rationale: Istilah ini menunjuk kepada orang-orang berpangkat tinggi atau terkemuka. 'Para pembesar' menyampaikan kedudukan sosial tanpa mempersempitnya pada kaum bangsawan turun-temurun.
- source_word: χιλίαρχοι
  choice: para panglima
  rationale: Secara harfiah menunjuk kepada komandan seribu pasukan; 'para panglima' secara alami menyatakan jabatan komando militer tingkat tinggi dalam bahasa Indonesia.
- source_word: πλούσιοι
  choice: orang-orang kaya
  rationale: Bentuk adjektiva yang berfungsi sebagai nomina ini paling alami diterjemahkan sebagai kelompok sosial 'orang-orang kaya'.
- source_word: ἰσχυροὶ
  choice: orang-orang kuat
  rationale: Pilihan ini mempertahankan makna dasar kekuatan dari ἰσχυρός serta membedakannya dari status sosial para pembesar, meskipun 'orang-orang berkuasa' juga mungkin.
- source_word: πᾶς δοῦλος καὶ ἐλεύθερος
  choice: setiap orang, baik budak maupun orang merdeka
  rationale: Kontras budak–merdeka menonjolkan status sosial. Susunan 'setiap orang, baik ... maupun ...' mengungkapkan daya representatif pasangan maskulin tunggal Yunani secara wajar tanpa membatasinya hanya pada laki-laki.
- source_word: ἔκρυψαν ἑαυτοὺς
  choice: menyembunyikan diri
  rationale: Ini adalah padanan refleksif yang langsung, alami, dan tepat bagi κρύπτω dengan ἑαυτούς.
- source_word: εἰς τὰ σπήλαια
  choice: di dalam gua-gua
  rationale: Walaupun εἰς dapat menandai gerak masuk, sesudah 'menyembunyikan diri' bahasa Indonesia secara alami memakai keterangan tempat; 'di dalam' tetap menyiratkan perlindungan di bagian dalam gua.
- source_word: εἰς τὰς πέτρας τῶν ὀρέων
  choice: di antara batu-batu pegunungan
  rationale: Ungkapan ini menggambarkan persembunyian di antara batu, cadas, atau celah bebatuan gunung. 'Di antara batu-batu pegunungan' lebih alami daripada terjemahan kaku 'ke dalam batu-batu'.
theological_decisions:
- issue: Penerjemahan δοῦλος dalam pasangan budak–merdeka
  choice: budak
  alternative: hamba
  rationale: Kontras langsung dengan ἐλεύθερος ('orang merdeka') secara jelas menonjolkan status terikat, sehingga 'budak' mempertahankan daya sosial dan historis teks dengan lebih tepat daripada 'hamba'.
- issue: Cakupan gender dalam pasangan status sosial
  choice: setiap orang, baik budak maupun orang merdeka
  alternative: setiap budak dan laki-laki merdeka
  rationale: Walaupun bentuk Yunani adalah maskulin tunggal, pasangan baku 'budak dan merdeka' memiliki daya representatif yang mencakup semua orang. Terjemahan ini mempertahankan cakupan tersebut tanpa menambahkan pembatasan gender.
- issue: Makna ἰσχυροί dalam daftar kelompok manusia
  choice: orang-orang kuat
  alternative: orang-orang berkuasa
  rationale: Bahasa sumber memungkinkan nuansa kekuatan maupun kuasa. 'Kuat' mempertahankan korespondensi leksikal dan tidak melebur kelompok ini dengan para pembesar, sambil membiarkan ketegangan maknanya tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada luhur namun mudah dipahami. Pengulangan 'para' dan 'orang-orang' mempertahankan irama daftar kelompok sosial. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
