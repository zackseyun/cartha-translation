  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ὁ οὐρανὸς ἀπεχωρίσθη ὡς βιβλίον ἑλισσόμενον, καὶ πᾶν ὄρος καὶ νῆσος ἐκ τῶν τόπων αὐτῶν ἐκινήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/014.yaml
  text: And the sky vanished like a scroll being rolled up[c][b][a], and every mountain and island was moved from its place.
translation:
  language: id
  text: Langit pun terbelah seperti gulungan kitab yang digulung,[a] dan setiap gunung serta pulau bergeser dari tempatnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “langit menyingkir” atau “langit terpisah.” Kata Yunani dapat menyatakan pemisahan atau penarikan diri. “Gulungan kitab” ialah lembaran panjang bertulis yang digulung, bukan buku berjilid modern.
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: οὐρανὸς
  choice: langit
  rationale: Dalam gambaran kosmis-apokaliptis ini, kata tersebut menunjuk pada bentangan yang tampak di atas bumi; 'langit' alami dalam bahasa Indonesia dan tidak mengharuskan pengertian tempat kediaman Allah.
- source_word: ἀπεχωρίσθη
  choice: terbelah
  rationale: Bentuk pasif ini menyatakan pemisahan atau penarikan diri. 'Terbelah' mempertahankan gambaran langit yang terpisah tanpa memastikan bahwa langit musnah atau lenyap; kemungkinan makna 'beranjak/menyingkir' dicatat dalam catatan kaki.
- source_word: βιβλίον
  choice: gulungan kitab
  rationale: Dalam konteks abad pertama dan dengan tindakan menggulung, yang dimaksud ialah gulungan bertulis, bukan buku berjilid modern.
- source_word: ἑλισσόμενον
  choice: yang digulung
  rationale: Partisipel ini menggambarkan gulungan yang sedang atau dalam proses digulung; bentuk Indonesia ini ringkas dan jelas.
- source_word: πᾶν ὄρος καὶ νῆσος
  choice: setiap gunung serta pulau
  rationale: '''Setiap'' mempertahankan daya distributif πᾶν pada kedua nomina tunggal; ''serta'' membuat cakupannya jelas dan alami.'
- source_word: ἐκ τῶν τόπων αὐτῶν ἐκινήθησαν
  choice: bergeser dari tempatnya
  rationale: Konteks menyatakan perpindahan dari lokasi masing-masing, bukan sekadar guncangan. Bentuk tunggal distributif 'tempatnya' wajar setelah 'setiap' dalam bahasa Indonesia.
theological_decisions:
- issue: Istilah kosmis dalam penglihatan apokaliptis
  choice: Menerjemahkan οὐρανός sebagai 'langit'
  alternative: '''surga'''
  rationale: '''Langit'' sesuai dengan fenomena kosmis yang tampak dan tidak memasukkan kesimpulan bahwa tempat kediaman Allah berubah.'
- issue: Sifat peristiwa yang dialami langit
  choice: Menerjemahkan ἀπεχωρίσθη sebagai 'terbelah'
  alternative: '''lenyap'', ''menyingkir'', atau ''terpisah'''
  rationale: Makna dasar pemisahan dipertahankan, sementara cara kerja gambaran kosmis itu tidak dijelaskan melampaui teks. Alternatif leksikal yang sah dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan gambaran yang konkret. Susunan kalimat dibuat alami tanpa menghilangkan sifat distributif 'setiap' atau ketegangan leksikal pada tindakan langit.
