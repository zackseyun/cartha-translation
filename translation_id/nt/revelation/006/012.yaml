id: REV.6.12
reference: Revelation 6:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ εἶδον ὅτε ἤνοιξεν τὴν σφραγῖδα τὴν ἕκτην, καὶ σεισμὸς μέγας ἐγένετο, καὶ ὁ ἥλιος ⸂ἐγένετο μέλας⸃ ὡς σάκκος τρίχινος, καὶ ἡ σελήνη ὅλη ἐγένετο ὡς αἷμα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/012.yaml
  text: And I saw when he opened the sixth seal[a], and there was a great earthquake, and the sun became black like sackcloth made of hair, and the whole moon became like blood,
translation:
  language: id
  text: Lalu aku melihat ketika Dia membuka meterai yang keenam. Terjadilah gempa bumi yang dahsyat. Matahari menjadi hitam seperti kain kabung dari bulu[a], dan bulan seluruhnya menjadi seperti darah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seperti kain kabung berbulu”; yang dimaksud ialah kain kabung yang dibuat dari bulu, biasanya berupa kain kasar yang dikaitkan dengan perkabungan.
    reason: Menjelaskan τρίχινος dan menawarkan bentuk yang lebih harfiah tanpa menentukan jenis bulu yang tidak disebutkan teks.
lexical_decisions:
- source_word: εἶδον
  choice: aku melihat
  rationale: Bentuk aoris ὁράω memperkenalkan persepsi penglihatan Yohanes; “aku melihat” merupakan ungkapan Indonesia yang alami dan langsung.
- source_word: ὅτε ἤνοιξεν
  choice: ketika Dia membuka
  rationale: ὅτε menyatakan waktu, sedangkan ἤνοιξεν berarti “membuka.” Pronomina “Dia” mempertahankan subjek tersirat dari konteks tanpa menambahkan identitas dalam ayat ini.
- source_word: τὴν σφραγῖδα τὴν ἕκτην
  choice: meterai yang keenam
  rationale: “Meterai” merupakan padanan baku dan sesuai dengan gambaran dokumen tergulung yang dimeteraikan; susunan ini alami dalam bahasa Indonesia.
- source_word: σεισμὸς μέγας ἐγένετο
  choice: Terjadilah gempa bumi yang dahsyat
  rationale: σεισμός dalam konteks ini paling jelas berarti gempa bumi. “Dahsyat” menyampaikan μέγας secara alami, dan bentuk inversi “Terjadilah” mempertahankan daya naratif ἐγένετο.
- source_word: ὁ ἥλιος ἐγένετο μέλας
  choice: Matahari menjadi hitam
  rationale: μέλας secara khusus berarti “hitam,” bukan sekadar gelap; “menjadi” juga mempertahankan pola γίνομαι.
- source_word: ὡς σάκκος τρίχινος
  choice: seperti kain kabung dari bulu kasar
  rationale: σάκκος menunjuk kain kabung, sedangkan τρίχινος berarti terbuat dari bulu. Penambahan “kasar” menjelaskan sifat bahan dalam ungkapan Indonesia yang mudah dipahami tanpa menentukan secara pasti jenis hewannya.
- source_word: ἡ σελήνη ὅλη
  choice: seluruh bulan
  rationale: ὅλη diberi ungkapan eksplisit melalui “seluruh,” sehingga penekanan bahwa segenap bulan tampak demikian tetap terpelihara.
- source_word: ἐγένετο ὡς αἷμα
  choice: menjadi seperti darah
  rationale: ὡς menyatakan perbandingan, jadi terjemahan mempertahankan simile dan tidak menyatakan bahwa bulan secara harfiah berubah menjadi darah.
theological_decisions:
- issue: Sifat tanda-tanda kosmis
  choice: Gambaran diterjemahkan apa adanya sebagai fenomena dalam penglihatan apokaliptik.
  alternative: Menafsirkannya secara eksplisit sebagai bencana astronomis harfiah atau sebagai lambang pergolakan politik dan penghakiman.
  rationale: Teks menggambarkan tanda-tanda itu dengan simile, tetapi tidak menyelesaikan perdebatan mengenai kadar literal atau simbolisnya. Terjemahan mempertahankan ketegangan tersebut.
- issue: Identitas subjek tersirat pada ἤνοιξεν
  choice: Menggunakan “Dia” tanpa menyebut nama atau gelar.
  alternative: Menambahkan “Anak Domba” dari konteks sebelumnya atau memakai “ia” tanpa kapitalisasi.
  rationale: Bahasa Yunani hanya menyiratkan subjek melalui bentuk verba. “Dia” mengikuti rujukan kontekstual sambil tidak memasukkan sebutan yang tidak muncul dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kalimat Yunani yang panjang dibagi menjadi beberapa kalimat agar jelas dan alami, sedangkan urutan gambaran serta pengulangan “menjadi” dipertahankan. Penanda catatan kaki [a] muncul tepat setelah frasa yang dijelaskan.
