  text: καὶ οἱ ἀστέρες τοῦ οὐρανοῦ ἔπεσαν εἰς τὴν γῆν, ὡς συκῆ ⸀βάλλει τοὺς ὀλύνθους αὐτῆς ὑπὸ ἀνέμου μεγάλου σειομένη,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/013.yaml
  text: and the stars of heaven fell to the earth[a], as a fig tree drops its unripe figs when shaken by a strong wind,
translation:
  language: id
  text: dan bintang-bintang di langit jatuh ke bumi, seperti pohon ara menggugurkan buah aranya yang belum matang[a] ketika diguncang oleh angin kencang,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "buah ara musim dingin", "buah ara hijau", atau "buah ara akhir musim"; istilah Yunani ini menunjuk pada buah ara yang belum matang dan terguncang jatuh sebelum masak.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀστέρες τοῦ οὐρανοῦ
  choice: bintang-bintang di langit
  rationale: Ungkapan ini mempertahankan gambaran kosmis tentang bintang tanpa menafsirkannya secara simbolis. Dalam bahasa Indonesia, 'di langit' lebih alami daripada 'dari langit' atau 'milik langit' untuk menyatakan letaknya.
- source_word: ἔπεσαν εἰς τὴν γῆν
  choice: berjatuhan ke bumi
  rationale: Bentuk jamak 'berjatuhan' menyampaikan gerak turun banyak bintang secara hidup, sedangkan 'ke bumi' mempertahankan arah gerak yang ditandai εἰς.
- source_word: ὡς συκῆ
  choice: seperti pohon ara
  rationale: ὡς memperkenalkan perbandingan, dan 'pohon ara' merupakan padanan baku serta mudah dipahami untuk συκῆ.
- source_word: βάλλει
  choice: menggugurkan
  rationale: Dalam konteks pohon dan buah, 'menggugurkan' merupakan ungkapan Indonesia yang alami dan tetap menyampaikan bahwa buah terlepas dari pohon akibat guncangan.
- source_word: τοὺς ὀλύνθους αὐτῆς
  choice: buah-buahnya yang belum matang
  rationale: ὄλυνθος menunjuk pada buah ara yang belum atau tidak sempat matang. Penyebutan 'buah-buahnya' menghindari pengulangan 'buah ara' segera setelah 'pohon ara', sementara maknanya tetap jelas.
- source_word: ὑπὸ ἀνέμου μεγάλου
  choice: angin kencang
  rationale: μέγας dalam hubungannya dengan angin menyatakan kekuatan; 'angin kencang' adalah padanan modern dan idiomatis.
- source_word: σειομένη
  choice: ketika diguncang
  rationale: Partisipel pasif ini menerangkan keadaan pohon ara. 'Ketika diguncang' secara alami mengungkapkan daya sirkumstansialnya dan mempertahankan bentuk pasif.
theological_decisions:
- issue: Gambaran apokaliptik bintang-bintang yang jatuh
  choice: Mempertahankan gambaran leksikal bahwa bintang-bintang di langit berjatuhan ke bumi tanpa penjelasan interpretatif.
  alternative: Menafsirkan bintang-bintang sebagai makhluk malaikat, para penguasa, atau benda-benda langit secara umum.
  rationale: Teks itu sendiri menyajikan gambaran apokaliptik tanpa menjelaskan acuan simbolisnya. Terjemahan tidak seharusnya menghapus ketegangan tersebut dengan menetapkan tafsiran tertentu.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur perbandingan serta citra kosmis dipertahankan, dengan pilihan verba yang alami dalam konteks pohon dan buah.
