id: REV.6.3
reference: Revelation 6:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξεν τὴν ⸂σφραγῖδα τὴν δευτέραν⸃, ἤκουσα τοῦ δευτέρου ζῴου λέγοντος· Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/003.yaml
  text: And when he opened the second seal[a], I heard the second living creature saying, “Come.”
translation:
  language: id
  text: Ketika Dia membuka meterai yang kedua, aku mendengar makhluk hidup yang kedua berkata, “Datanglah.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Pergilah.” Sebagian orang memahami perintah ini ditujukan kepada penunggang kuda agar maju, bukan sebagai panggilan untuk datang.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: Ketika
  rationale: Dalam bahasa Indonesia, penghubung καί tidak perlu diterjemahkan tersendiri sebelum anak kalimat temporal; alur narasi tetap terpelihara secara alami melalui “Ketika”.
- source_word: ὅτε
  choice: Ketika
  rationale: Konjungsi temporal ini memperkenalkan peristiwa berikutnya dalam rangkaian dan paling wajar diterjemahkan “ketika”.
- source_word: ἤνοιξεν
  choice: Dia membuka
  rationale: ἀνοίγω berarti “membuka”; “membuka” dipertahankan agar tidak menggantikannya dengan ungkapan interpretatif seperti “memecahkan” meterai. Huruf kapital pada “Dia” menunjukkan bahwa subjek tersiratnya adalah Anak Domba dari konteks sebelumnya.
- source_word: σφραγῖδα τὴν δευτέραν
  choice: meterai yang kedua
  rationale: Susunan ini alami dalam bahasa Indonesia dan mempertahankan penekanan ordinal dari frasa Yunani.
- source_word: ἤκουσα
  choice: aku mendengar
  rationale: Bentuk naratif ἀκούω diterjemahkan langsung; “aku” sesuai dengan suara narator orang pertama dalam kitab ini.
- source_word: τοῦ δευτέρου ζῴου
  choice: makhluk hidup yang kedua
  rationale: ζῷον di Wahyu menunjuk kepada makhluk takhta dalam pasal 4–6, bukan hewan biasa; “makhluk hidup” menghindari kesan keliru tersebut.
- source_word: λέγοντος
  choice: berkata
  rationale: Partisipel ini bergantung pada “aku mendengar”; konstruksi “mendengar ... berkata” merupakan padanan Indonesia yang alami.
- source_word: Ἔρχου
  choice: Datanglah
  rationale: Imperatif ἔρχομαι secara leksikal paling langsung berarti “datanglah”. Kemungkinan kontekstual “pergilah” dicatat dalam catatan kaki tanpa menutup ambiguitas tentang pihak yang disapa.
theological_decisions:
- issue: Makna Ἔρχου dalam formula pembukaan meterai
  choice: Datanglah
  alternative: Pergilah
  rationale: Makna leksikal yang paling langsung ialah “Datanglah”. Karena konteks tidak menyebut secara eksplisit pihak yang disapa dan sebagian orang memahaminya sebagai perintah kepada penunggang kuda untuk maju, alternatif “Pergilah” dipertahankan dalam catatan kaki tanpa menyelesaikan ketegangan tafsir secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku yang modern, ringkas, dan bermartabat. “Meterai” mempertahankan istilah tradisional yang masih mudah dipahami; susunan kalimat dibuat alami tanpa menghilangkan urutan naratif atau ambiguitas sumber.
