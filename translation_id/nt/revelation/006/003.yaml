  source_fidelity: 'Teks secara akurat menerjemahkan unsur utama Yunani: urutan temporal, subjek tersirat yang membuka meterai, “meterai yang kedua,” narator orang pertama, “makhluk hidup yang kedua,” dan imperatif Ἔρχου sebagai “Datanglah.” Penghilangan padanan eksplisit untuk Καὶ wajar dalam sintaks bahasa Indonesia dan tidak mengubah alur naratif.'
