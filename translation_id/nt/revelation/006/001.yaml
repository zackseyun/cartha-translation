id: REV.6.1
reference: Revelation 6:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ὅτε ἤνοιξεν τὸ ἀρνίον μίαν ἐκ τῶν ἑπτὰ σφραγίδων, καὶ ἤκουσα ἑνὸς ἐκ τῶν τεσσάρων ζῴων λέγοντος ὡς φωνῇ βροντῆς· ⸀Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/001.yaml
  text: And I saw when the Lamb opened one of the seven seals[a], and I heard one of the four living creatures saying with a voice like thunder, “Come.”
translation:
  language: id
  text: Lalu aku melihat ketika Anak Domba membuka salah satu dari tujuh meterai itu, dan aku mendengar salah satu dari keempat makhluk hidup itu berkata dengan suara seperti guruh, “Datanglah!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Majulah!” jika perintah ini dipahami ditujukan kepada penunggang, bukan kepada Yohanes.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀρνίον
  choice: Anak Domba
  rationale: Dalam kitab Wahyu, bentuk ini berfungsi sebagai gelar kristologis bagi Yesus. “Anak Domba” adalah padanan Indonesia yang mapan dan tidak perlu diberi nuansa diminutif tambahan.
- source_word: μίαν ἐκ τῶν ἑπτὰ σφραγίδων
  choice: satu dari ketujuh meterai itu
  rationale: Ungkapan partitif ini menunjuk pada satu meterai dalam kelompok tujuh meterai; bentuk Indonesia ini alami dan mempertahankan acuannya.
- source_word: ζῴων
  choice: makhluk hidup
  rationale: Dalam konteks ruang takhta kitab Wahyu, kata ini menunjuk pada makhluk surgawi, bukan hewan biasa.
- source_word: ὡς φωνῇ βροντῆς
  choice: dengan suara seperti guruh
  rationale: Terjemahan ini mempertahankan perbandingan eksplisit antara suara makhluk itu dan guruh dalam bentuk Indonesia yang wajar.
- source_word: Ἔρχου
  choice: Datanglah!
  rationale: Imperatif ini paling langsung berarti “datanglah”; teks Yunani tidak menyebutkan secara eksplisit siapa yang disapa, sehingga penerima perintah tidak ditentukan dalam teks utama.
- source_word: ὅτε
  choice: ketika
  rationale: Konjungsi ini menyatakan waktu dan paling lugas diterjemahkan “ketika”.
- source_word: εἶδον
  choice: aku melihat
  rationale: Bentuk aoris naratif diterjemahkan secara sederhana tanpa menambahkan tindakan lain yang tidak terdapat dalam bahasa Yunani.
- source_word: ἤκουσα
  choice: aku mendengar
  rationale: Padanan langsung dan alami bagi verba aoris ἀκούω dalam rangkaian narasi.
- source_word: λέγοντος
  choice: berkata
  rationale: Padanan ini menyampaikan tindakan berbicara tanpa melebih-lebihkan cara pengucapannya.
theological_decisions:
- issue: Acuan dan daya perintah Ἔρχου
  choice: Menerjemahkannya “Datanglah!” tanpa menentukan pihak yang disapa dalam teks utama.
  alternative: “Majulah!” bila perintah dipahami ditujukan kepada penunggang, bukan kepada Yohanes.
  rationale: Bahasa Yunani hanya memuat perintah “datanglah” dan tidak mengidentifikasi penerimanya. Terjemahan utama mempertahankan keterbukaan itu, sedangkan kemungkinan tafsiran lain dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Lalu” menjaga alur naratif tanpa kekakuan, sedangkan “guruh” dipilih untuk citra bunyi yang kuat dan bermartabat. Penanda catatan kaki [a] ditempatkan langsung setelah kutipan yang diterangkannya.
