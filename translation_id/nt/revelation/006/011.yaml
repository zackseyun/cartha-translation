revisions:
- from: Lalu kepada mereka masing-masing diberikan sehelai jubah putih, dan kepada mereka dikatakan agar mereka beristirahat sedikit waktu lagi, sampai genap juga sesama budak dan saudara-saudara mereka[a] yang akan dibunuh sama seperti mereka sendiri.[b]
  to: Lalu masing-masing dari mereka diberi sehelai jubah putih, dan kepada mereka dikatakan supaya mereka beristirahat sedikit lebih lama, hingga sesama budak dan saudara-saudara mereka[a], yang akan dibunuh sama seperti mereka sendiri, juga menjadi genap.[b]
  rationale: Revisi memperjelas bahwa kelompok “sesama budak dan saudara-saudara” adalah subjek dari πληρωθῶσιν. “Menjadi genap” dipilih sebagai ungkapan Indonesia yang lebih dapat dipahami daripada penerapan pasif “digenapi” langsung kepada orang-orang, sementara catatan kaki mempertahankan bentuk pasif dan rentang makna sumber. Perubahan “sedikit lebih lama” menyampaikan ἔτι χρόνον μικρόν secara idiomatis.
