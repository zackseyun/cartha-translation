  terminology: “Jubah putih,” “sesama budak,” dan “saudara-saudara” merupakan padanan yang baik dan konsisten dengan sumber. “Yang akan dibunuh sama seperti mereka” secara wajar menyampaikan μέλλοντες ἀποκτέννεσθαι ὡς καὶ αὐτοί, tanpa mengimpor gagasan takdir. Catatan tentang kemungkinan cakupan “saudara-saudara” tepat. Catatan kedua perlu diselaraskan dengan teks yang direvisi.
