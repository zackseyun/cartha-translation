id: REV.6.11
reference: Revelation 6:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐδόθη αὐτοῖς ἑκάστῳ στολὴ λευκή, καὶ ἐρρέθη αὐτοῖς ἵνα ⸀ἀναπαύσονται ἔτι χρόνον ⸀μικρόν, ἕως ⸀πληρωθῶσιν καὶ οἱ σύνδουλοι αὐτῶν καὶ οἱ ἀδελφοὶ ⸀αὐτῶν οἱ μέλλοντες ⸀ἀποκτέννεσθαι ὡς καὶ αὐτοί.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/011.yaml
  text: And a white robe was given to each of them[a], and they were told that they should rest a little longer, until their fellow servants and their brothers, who are about to be killed just as they were[c][b], should also be completed.
translation:
  language: id
  text: Lalu masing-masing dari mereka diberi sehelai jubah putih, dan kepada mereka dikatakan supaya mereka beristirahat sedikit lebih lama, hingga sesama budak dan saudara-saudara mereka[a], yang akan dibunuh sama seperti mereka sendiri, juga menjadi genap.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “saudara-saudara” dapat merujuk lebih luas kepada sesama orang percaya, termasuk perempuan, meskipun bahasa Yunani memakai bentuk jamak maskulin.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, bagian ini dapat diterjemahkan, “hingga sesama budak dan saudara-saudara mereka juga digenapi” atau “dibuat lengkap.” Maksudnya mungkin sampai jumlah mereka menjadi genap, tetapi kata “jumlah” tidak tertulis dalam bahasa Yunani.
    reason: alternative_reading
lexical_decisions:
- source_word: στολὴ λευκή
  choice: sehelai jubah putih
  rationale: στολή menunjuk pada jubah atau pakaian panjang; “jubah putih” merupakan padanan Indonesia yang alami dan tetap mempertahankan gambaran sumber.
- source_word: ἑκάστῳ
  choice: kepada mereka masing-masing
  rationale: Bentuk tunggal datif ini bersifat distributif; frasa tersebut menyatakan bahwa setiap orang menerima satu jubah.
- source_word: ἐρρέθη αὐτοῖς
  choice: kepada mereka dikatakan
  rationale: Mempertahankan bentuk pasif teks Yunani dan tidak menyebutkan pelaku yang tidak dinyatakan.
- source_word: ἀναπαύσονται ἔτι χρόνον μικρόν
  choice: agar mereka beristirahat sedikit waktu lagi
  rationale: Mempertahankan arti dasar ἀναπαύω, yaitu beristirahat, serta unsur waktu dalam ἔτι χρόνον μικρόν tanpa mengubahnya menjadi sekadar “menunggu.”
- source_word: πληρωθῶσιν
  choice: sampai genap
  rationale: “Genap” mempertahankan gagasan menjadi penuh atau lengkap tanpa secara eksplisit menambahkan kata “jumlah,” yang tidak terdapat dalam bahasa Yunani.
- source_word: σύνδουλοι
  choice: sesama budak
  rationale: σύνδουλοι menyatakan orang-orang yang berstatus budak di bawah tuan yang sama; “sesama budak” mempertahankan relasi keterikatan itu.
- source_word: ἀδελφοί
  choice: saudara-saudara
  rationale: Padanan ini mempertahankan bentuk jamak maskulin Yunani sekaligus tetap wajar dalam bahasa Indonesia; cakupan referennya dijelaskan dalam catatan kaki.
- source_word: μέλλοντες ἀποκτέννεσθαι
  choice: yang akan dibunuh
  rationale: Ungkapan ini menyatakan peristiwa pembunuhan yang masih akan terjadi tanpa harus menambahkan nuansa deterministik seperti “ditakdirkan.”
- source_word: ὡς καὶ αὐτοί
  choice: sama seperti mereka sendiri
  rationale: Frasa ini membandingkan kematian kelompok tersebut dengan kematian para jiwa yang telah disebutkan, sedangkan “sendiri” mencerminkan penegasan αὐτοί.
theological_decisions:
- issue: Makna πληρωθῶσιν ketika subjeknya adalah sesama budak dan saudara-saudara para martir
  choice: Diterjemahkan secara ringkas sebagai “sampai genap” tanpa menambahkan “jumlah.”
  alternative: “sampai jumlah ... menjadi genap” atau “sampai ... digenapi”
  rationale: Bahasa Yunani menyatakan bahwa mereka dibuat penuh, lengkap, atau genap, tetapi tidak secara eksplisit memakai kata “jumlah.” Terjemahan utama mempertahankan keluasan itu, sedangkan kemungkinan pengertian jumlah dijelaskan dalam catatan.
- issue: Cakupan ἀδελφοί
  choice: Menggunakan “saudara-saudara” dalam teks utama.
  alternative: “saudara-saudari” atau “sesama orang percaya”
  rationale: Bentuk sumber adalah jamak maskulin, tetapi dalam pemakaian komunitas Kristen dapat mencakup orang percaya laki-laki dan perempuan. Bentuk sumber dipertahankan dalam teks dan cakupan yang mungkin lebih luas dicatat.
- issue: Gambaran perbudakan dalam σύνδουλοι
  choice: Menggunakan “sesama budak.”
  alternative: “sesama hamba” atau “rekan-rekan pelayan”
  rationale: Istilah sumber menunjuk pada orang-orang yang sama-sama terikat kepada seorang tuan. “Budak” mempertahankan kekuatan metafora kepemilikan dan ketundukan tanpa melunakkannya menjadi pelayanan sukarela.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Susunan pasif dipertahankan ketika penting untuk tidak menyebut pelaku yang tidak dinyatakan. Ungkapan “sampai genap” sengaja agak padat untuk menjaga ambiguitas πληρωθῶσιν; catatan kaki menyediakan penjelasan tanpa memaksakan tafsiran numerik ke dalam teks utama.
