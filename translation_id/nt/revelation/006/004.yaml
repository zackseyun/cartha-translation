id: REV.6.4
reference: Revelation 6:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐξῆλθεν ἄλλος ἵππος πυρρός, καὶ τῷ καθημένῳ ἐπ’ αὐτὸν ἐδόθη αὐτῷ λαβεῖν τὴν εἰρήνην ἐκ τῆς γῆς ⸀καὶ ἵνα ἀλλήλους ⸀σφάξουσιν, καὶ ἐδόθη αὐτῷ μάχαιρα μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/004.yaml
  text: And another horse came out[a], fiery red; and to the one sitting on it, it was given to take peace from the earth, so that they would slaughter one another[c][b], and a great sword was given to him.
translation:
  language: id
  text: Lalu keluarlah seekor kuda lain, merah menyala[a]. Kepada orang yang duduk di atasnya diberikan kuasa[b] untuk mengambil damai dari bumi[c], sehingga mereka saling membantai[d]. Kepadanya diberikan sebilah pedang besar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “merah seperti api.” Kata Yunani πυρρός menunjuk pada warna merah yang menyerupai api.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “kepadanya diberikan untuk mengambil”; kata “kuasa” tersirat dalam ungkapan ini, tetapi tidak dinyatakan sebagai kata tersendiri dalam teks Yunani.
    reason: translation_clarity
  - marker: c
    text: Atau “negeri” atau “daratan”; kata Yunani γῆ dapat memiliki arti-arti tersebut, tetapi “bumi” paling sesuai dengan cakupan penglihatan ini.
    reason: lexical_alternative
  - marker: d
    text: Kata Yunani yang diterjemahkan “membantai” lebih kuat daripada kata umum untuk “membunuh” dan menggambarkan pembunuhan dengan kekerasan. Kata penghubungnya dapat dipahami sebagai menyatakan tujuan atau akibat.
    reason: ambiguity_and_lexical_alternative
lexical_decisions:
- source_word: ἄλλος ἵππος πυρρός
  choice: seekor kuda lain, merah menyala
  rationale: ἄλλος menandai kuda berikutnya yang berbeda, sedangkan πυρρός menggambarkan warna merah seperti api. 'Merah menyala' mempertahankan citra tersebut secara alami dalam bahasa Indonesia.
- source_word: τῷ καθημένῳ ἐπ’ αὐτὸν
  choice: orang yang duduk di atasnya
  rationale: Mempertahankan bentuk partisipial Yunani dan tidak menggantinya dengan sebutan yang lebih interpretatif seperti 'penunggangnya'.
- source_word: ἐδόθη αὐτῷ λαβεῖν
  choice: kepadanya diberikan kuasa untuk mengambil
  rationale: Bentuk pasif dipertahankan tanpa menyebut pemberinya. Kata 'kuasa' ditambahkan sebagai pelengkap idiomatis dalam bahasa Indonesia dan ditandai dengan catatan karena tidak dinyatakan sebagai nomina dalam bahasa Yunani.
- source_word: τὴν εἰρήνην ἐκ τῆς γῆς
  choice: damai dari bumi
  rationale: '''Damai'' menangkap keadaan tanpa permusuhan, dan ''bumi'' sesuai dengan cakupan luas γῆ dalam konteks apokaliptik, sambil mencatat kemungkinan arti ''negeri/daratan''.'
- source_word: ἵνα ἀλλήλους σφάξουσιν
  choice: sehingga orang-orang saling membantai
  rationale: ἵνα menyatakan tujuan atau akibat yang tidak perlu dipersempit; 'sehingga' wajar dan tetap cukup terbuka. σφάζω lebih keras daripada kata umum 'membunuh' dan menyiratkan pertumpahan darah.
- source_word: μάχαιρα μεγάλη
  choice: sebilah pedang besar
  rationale: μάχαιρα dapat menunjuk pedang atau pisau besar; dalam gambaran apokaliptik ini 'pedang' paling jelas, sedangkan μεγάλη diterjemahkan langsung sebagai 'besar'.
theological_decisions:
- issue: Bentuk pasif ilahi dalam dua klausa ἐδόθη
  choice: Mempertahankan bentuk pasif 'diberikan' tanpa menyebut pemberinya
  alternative: Allah memberinya kuasa
  rationale: Teks tidak menyatakan pelaku secara eksplisit. Bentuk pasif mempertahankan kesan izin atau kedaulatan ilahi tanpa menjadikannya lebih tegas daripada sumber.
- issue: Hubungan ἵνα dengan pengambilan damai
  choice: '''sehingga'''
  alternative: '''supaya'''
  rationale: ἵνα dapat menyatakan tujuan maupun akibat. 'Sehingga' cocok dengan alur penglihatan dan tidak terlalu menegaskan maksud pelaku, sementara alternatif dicatat untuk menjaga ambiguitas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan gambaran yang hidup. Susunan kalimat dibuat alami bagi pembaca umum, sambil mempertahankan pengulangan bentuk pasif dan kekerasan citra teks sumber.
