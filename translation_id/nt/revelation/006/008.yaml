id: REV.6.8
reference: Revelation 6:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ⸂εἶδον, καὶ⸃ ἰδοὺ ἵππος χλωρός, καὶ ὁ καθήμενος ἐπάνω αὐτοῦ ὄνομα αὐτῷ ὁ Θάνατος, καὶ ὁ ᾅδης ἠκολούθει ⸂μετ’ αὐτοῦ⸃, καὶ ἐδόθη ⸀αὐτοῖς ἐξουσία ἐπὶ τὸ τέταρτον τῆς γῆς, ἀποκτεῖναι ἐν ῥομφαίᾳ καὶ ἐν λιμῷ καὶ ἐν θανάτῳ καὶ ὑπὸ τῶν θηρίων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/008.yaml
  text: And I looked, and behold, a pale green horse, and the name of the one seated on it was Death, and Hades was following with him. And authority was given to them over a fourth of the earth, to kill with sword and with famine and with pestilence and by the wild beasts of the earth.
translation:
  language: id
  text: Lalu aku melihat, dan tampaklah seekor kuda hijau pucat[a]. Orang yang duduk di atasnya bernama Maut, dan Hades mengikutinya. Kepada keduanya diberikan wewenang atas seperempat bumi untuk membunuh dengan pedang, kelaparan, dan wabah penyakit[b], serta oleh binatang-binatang buas di bumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kuda pucat.” Kata Yunani yang dipakai secara harfiah dapat menunjuk pada warna hijau atau hijau pucat, yang di sini memberi kesan pucat seperti orang sakit atau mayat.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “maut.” Dalam daftar penghukuman seperti yang terdapat dalam Yehezkiel 14, kata ini dapat digunakan dengan arti wabah penyakit atau sampar.'
    reason: alternative_reading
lexical_decisions:
- source_word: χλωρός
  choice: hijau pucat
  rationale: Kata ini menunjuk pada warna hijau atau kehijau-hijauan yang dalam konteks ini bernuansa pucat dan menyeramkan. 'Hijau pucat' mempertahankan unsur warna yang nyata dalam bahasa Yunani.
- source_word: ὁ καθήμενος ἐπάνω αὐτοῦ
  choice: orang yang duduk di atasnya
  rationale: Ungkapan partisipial Yunani diterjemahkan secara transparan dan alami tanpa menggantinya dengan istilah yang lebih interpretatif seperti 'penunggangnya'.
- source_word: ὄνομα αὐτῷ ὁ Θάνατος
  choice: bernama Maut
  rationale: Bentuk penamaan Yunani disampaikan secara idiomatis; 'Maut' menandai bahwa kematian dipersonifikasikan sebagai nama tokoh.
- source_word: ᾅδης
  choice: Hades
  rationale: Transliterasi ini mempertahankan istilah bagi alam orang mati dan menghindari penyamaannya dengan neraka sebagai hukuman terakhir.
- source_word: ἠκολούθει μετ’ αὐτοῦ
  choice: mengikutinya
  rationale: Kata kerja berarti 'mengikuti', sedangkan frasa μετά menyatakan penyertaan. Dalam bahasa Indonesia, 'mengikutinya' secara alami mencakup gerak mengikuti bersama tokoh tersebut.
- source_word: ἐδόθη αὐτοῖς ἐξουσία
  choice: kepada keduanya diberikan wewenang
  rationale: Bentuk pasif dipertahankan, dan 'keduanya' menjelaskan rujukan jamak kepada Maut dan Hades. 'Wewenang' menyampaikan kuasa yang diberikan atau didelegasikan.
- source_word: ἐπὶ τὸ τέταρτον τῆς γῆς
  choice: atas seperempat bumi
  rationale: Terjemahan ini mempertahankan cakupan wilayah dan nilai pecahan dalam teks sumber.
- source_word: ἀποκτεῖναι ἐν ῥομφαίᾳ καὶ ἐν λιμῷ
  choice: untuk membunuh dengan pedang, kelaparan
  rationale: '''Membunuh'' menerjemahkan infinitif secara langsung; ''pedang'' dan ''kelaparan'' menyatakan sarana-sarana penghukuman dalam daftar.'
- source_word: ἐν θανάτῳ
  choice: wabah penyakit
  rationale: Dalam daftar penghukuman yang menggemakan Yehezkiel 14, θάνατος dapat berfungsi secara idiomatis untuk wabah sampar atau penyakit. Arti harfiahnya dicatat dalam catatan kaki.
- source_word: ὑπὸ τῶν θηρίων τῆς γῆς
  choice: dan binatang-binatang buas di bumi
  rationale: Frasa ini menunjuk pada hewan liar sebagai pelaku pembunuhan; susunan Indonesia mengikuti rangkaian sarana sesudah kata 'dengan'.
theological_decisions:
- issue: Makna ᾅδης
  choice: Hades
  alternative: alam orang mati; kubur; neraka
  rationale: '''Hades'' menjaga perbedaan antara Maut yang dipersonifikasikan dan alam orang mati yang mengikutinya, tanpa memasukkan gagasan tentang hukuman akhir yang tidak dinyatakan di sini.'
- issue: Makna ἐν θανάτῳ dalam daftar penghukuman
  choice: wabah penyakit
  alternative: dengan maut
  rationale: Konteks formula penghukuman yang menggemakan Yehezkiel mendukung makna idiomatis 'wabah penyakit', tetapi arti harfiah 'maut' tetap disediakan agar ambiguitas sumber tidak hilang.
- issue: Rujukan kata ganti jamak αὐτοῖς
  choice: keduanya
  alternative: mereka
  rationale: Bentuk jamak paling wajar merujuk kepada Maut dan Hades. 'Keduanya' memperjelas rujukan gramatikal tanpa menentukan lebih jauh hubungan teologis antara keduanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. 'Tampaklah' mempertahankan daya seru ἰδού secara alami. Istilah 'Maut' dipakai sebagai nama personifikasi, sedangkan 'Hades' dipertahankan sebagai istilah khusus. Semua penanda catatan kaki dicantumkan dalam teks utama.
