  naturalness: Bahasa baku, jelas, dan bernada khidmat. Rangkaian “dengan pedang, kelaparan, wabah penyakit, dan binatang-binatang buas” dapat terbaca seolah-olah semua unsur, termasuk binatang buas, diperkenalkan oleh “dengan.” Menambahkan “oleh” sebelum unsur terakhir membuat struktur lebih alami dan tepat.
