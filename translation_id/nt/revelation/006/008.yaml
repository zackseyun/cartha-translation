  to: Lalu aku melihat, dan tampaklah seekor kuda hijau pucat[a]. Orang yang duduk di atasnya bernama Maut, dan Hades mengikutinya. Kepada keduanya diberikan wewenang atas seperempat bumi untuk membunuh dengan pedang, kelaparan, dan wabah penyakit[b], serta oleh binatang-binatang buas di bumi.
