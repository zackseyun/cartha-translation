- from: Lalu ia berseru dengan suara yang kuat, katanya, “Sudah jatuh, sudah jatuh Babel yang besar itu! Ia telah menjadi tempat tinggal roh-roh jahat dan tempat berkurungnya setiap roh najis, tempat berkurungnya setiap burung najis, serta tempat berkurungnya setiap binatang yang najis dan dibenci.”[a]
  to: Ia berseru dengan suara yang kuat, katanya, “Sudah jatuh, sudah jatuh Babel yang besar! Ia telah menjadi tempat kediaman setan-setan dan penjara[a] bagi setiap roh najis, penjara bagi setiap burung najis, serta penjara bagi setiap binatang yang najis dan dibenci.”[b]
  rationale: Revisi membedakan secara eksplisit δαιμόνια (“setan-setan”) dari πνεύματα ἀκάθαρτα (“roh najis”), mengganti padanan φυλακή dengan bentuk yang baku dan jelas, serta memisahkan catatan alternatif leksikal dari catatan varian tekstual. Tidak ada perubahan pada cakupan, pengulangan, atau ketidakpastian tekstual sumber.
