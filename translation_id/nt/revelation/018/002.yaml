id: REV.18.2
reference: Revelation 18:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἔκραξεν ⸀ἐν ἰσχυρᾷ φωνῇ λέγων· Ἔπεσεν, ⸀ἔπεσεν Βαβυλὼν ἡ μεγάλη, καὶ ἐγένετο κατοικητήριον ⸀δαιμονίων καὶ φυλακὴ παντὸς πνεύματος ἀκαθάρτου καὶ φυλακὴ παντὸς ὀρνέου ἀκαθάρτου ⸂καὶ φυλακὴ παντὸς θηρίου ἀκαθάρτου⸃ καὶ μεμισημένου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/002.yaml
  text: And he cried out with a mighty voice[a], saying, “Fallen, fallen is Babylon the great! She has become a dwelling place of demons, a prison of every unclean spirit, a prison of every unclean bird[b], and a prison of every unclean and hated beast.”
translation:
  language: id
  text: Ia berseru dengan suara yang kuat, katanya, “Sudah jatuh, sudah jatuh Babel yang besar! Ia telah menjadi tempat kediaman setan-setan dan penjara[a] bagi setiap roh najis, penjara bagi setiap burung najis, serta penjara bagi setiap binatang yang najis dan dibenci.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Yunani yang diterjemahkan “penjara” juga dapat berarti tempat yang dihuni atau sering didatangi. Karena itu, rangkaian ini dapat diterjemahkan “tempat kediaman setiap roh najis ... setiap burung najis ... serta setiap binatang yang najis dan dibenci.”
    reason: Alternatif leksikal untuk φυλακή.
  - marker: b
    text: Sejumlah naskah tidak memuat kata-kata “serta penjara bagi setiap binatang yang najis dan dibenci.”
    reason: Varian tekstual.
lexical_decisions:
- source_word: ἔκραξεν
  choice: berseru
  rationale: Menyampaikan seruan lantang dengan ragam bahasa yang wajar dan bermartabat.
- source_word: ἐν ἰσχυρᾷ φωνῇ
  choice: dengan suara yang kuat
  rationale: Mempertahankan arti ἰσχυρός secara lebih langsung daripada sekadar 'nyaring' dan menunjukkan cara seruan itu disampaikan.
- source_word: Ἔπεσεν, ἔπεσεν
  choice: Sudah jatuh, sudah jatuh
  rationale: Pengulangan dan daya proklamasi profetis dipertahankan; 'sudah' menyatakan hasil yang kini berlaku.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: Babel yang besar itu
  rationale: Mempertahankan susunan sebutan Yunani dan memakai bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: ἐγένετο
  choice: telah menjadi
  rationale: Menunjukkan perubahan keadaan beserta hasilnya yang kini tampak.
- source_word: κατοικητήριον δαιμονίων
  choice: tempat tinggal roh-roh jahat
  rationale: κατοικητήριον berarti tempat tinggal; δαιμόνια merujuk pada makhluk roh jahat. Ungkapan ini alami bagi pembaca Indonesia tanpa mengaburkan acuannya.
- source_word: φυλακή
  choice: tempat berkurungnya
  rationale: Menjaga kemungkinan makna tempat penahanan atau tempat makhluk-makhluk itu terkurung, sambil menghindari kesan bahwa yang dimaksud mesti sebuah penjara harfiah. Kemungkinan makna 'sarang/tempat yang dihuni' dicatat dalam catatan kaki.
- source_word: παντὸς πνεύματος ἀκαθάρτου
  choice: setiap roh najis
  rationale: '''Najis'' mempertahankan gema religius dan apokaliptis ἀκάθαρτος.'
- source_word: παντὸς ὀρνέου ἀκαθάρτου
  choice: setiap burung najis
  rationale: Menerjemahkan ὄρνεον secara umum sebagai burung tanpa mempersempitnya menjadi jenis pemakan bangkai.
- source_word: παντὸς θηρίου ἀκαθάρτου καὶ μεμισημένου
  choice: setiap binatang yang najis dan dibenci
  rationale: θηρίον digunakan sebagai nomina umum dalam rangkaian ini, sedangkan 'dibenci' mempertahankan bentuk pasif/resultatif μεμισημένου.
theological_decisions:
- issue: Apakah θηρίου merupakan gelar apokaliptis 'Binatang' atau nomina umum
  choice: nomina umum 'binatang'
  alternative: gelar 'Binatang'
  rationale: Kata ini didahului παντός dan disejajarkan dengan setiap roh dan setiap burung, sehingga konteks mendukung arti umum, bukan tokoh simbolis tertentu.
- issue: Makna φυλακή dalam gambaran penghakiman ini
  choice: tempat berkurungnya
  alternative: sarang atau tempat yang dihuni/didatangi
  rationale: φυλακή dapat menunjuk tempat penjagaan atau penahanan, tetapi dalam konteks ini juga dapat dipahami sebagai tempat makhluk-makhluk tersebut menetap. Teks utama menjaga citra pengurungan, sementara alternatif leksikal disajikan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan irama proklamasi apokaliptis. Pengulangan 'sudah jatuh' dipertahankan. 'Roh-roh jahat' dipilih untuk δαιμόνια agar alami dan jelas, sedangkan 'roh najis' dipertahankan untuk πνεῦμα ἀκάθαρτον guna menjaga perbedaan leksikal. Penanda catatan [a] ditempatkan dalam teks utama.
