id: REV.18.23
reference: Revelation 18:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ φῶς λύχνου οὐ μὴ φάνῃ ἐν σοὶ ἔτι, καὶ φωνὴ νυμφίου καὶ νύμφης οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι· ὅτι οἱ ἔμποροί σου ἦσαν οἱ μεγιστᾶνες τῆς γῆς, ὅτι ἐν τῇ φαρμακείᾳ σου ἐπλανήθησαν πάντα τὰ ἔθνη,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/023.yaml
  text: And the light of a lamp will never shine in you again[a], and the voice of bridegroom and bride will never be heard in you again; for your merchants were the great ones of the earth[b], because by your sorcery all the nations were led astray.
translation:
  language: id
  text: Cahaya pelita tidak akan pernah bersinar lagi di dalammu, dan suara pengantin laki-laki serta pengantin perempuan tidak akan pernah terdengar lagi di dalammu. Sebab para pedagangmu adalah orang-orang besar di bumi,[a] dan karena sihirmu semua bangsa disesatkan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para pembesar di bumi.” Istilah Yunani ini menunjuk kepada orang-orang yang sangat terkemuka atau berkuasa.
    reason: lexical_alternative
  - marker: b
    text: Atau “oleh ilmu gaibmu” atau “oleh praktik-praktik sihirmu.” Kata Yunani φαρμακεία menunjuk kepada sihir atau praktik magis yang menipu.
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς λύχνου
  choice: cahaya pelita
  rationale: Ungkapan ini mempertahankan konstruksi Yunani secara alami; 'pelita' sesuai dengan benda penerang dalam konteks dunia Alkitab.
- source_word: οὐ μὴ φάνῃ ... ἔτι
  choice: tidak akan pernah bersinar lagi
  rationale: Gabungan οὐ μή dan bentuk subjungtif menyatakan penyangkalan yang sangat tegas, sedangkan ἔτι dalam konteks ini menyatakan bahwa keadaan tersebut tidak akan terulang.
- source_word: ἐν σοὶ
  choice: di dalammu
  rationale: Mempertahankan sapaan langsung kepada Babel yang dipersonifikasikan sebagai kota.
- source_word: φωνὴ νυμφίου καὶ νύμφης
  choice: suara pengantin laki-laki serta pengantin perempuan
  rationale: φωνή dapat berarti suara atau bunyi; 'suara' mempertahankan gema ungkapan penghukuman profetis dan kedua nomina diterjemahkan secara jelas bagi pembaca modern.
- source_word: οὐ μὴ ἀκουσθῇ ... ἔτι
  choice: tidak akan pernah terdengar lagi
  rationale: Bentuk pasif dan penyangkalan tegas dalam bahasa Yunani terwakili secara alami dan kuat.
- source_word: οἱ ἔμποροί σου
  choice: para pedagangmu
  rationale: ἔμπορος menunjuk kepada orang yang menjalankan perdagangan dan sesuai dengan gambaran komersial dalam Wahyu 18.
- source_word: οἱ μεγιστᾶνες τῆς γῆς
  choice: orang-orang besar di bumi
  rationale: μεγιστᾶνες menunjuk kepada orang-orang yang sangat terkemuka atau berkuasa. Pilihan ini mempertahankan keluasan makna tanpa membatasinya pada bangsawan atau pengusaha besar.
- source_word: ἐν τῇ φαρμακείᾳ σου
  choice: oleh sihirmu
  rationale: φαρμακεία dalam konteks ini menunjuk kepada praktik sihir atau ilmu gaib yang menipu; 'sihir' merupakan padanan Indonesia yang jelas tanpa mereduksinya menjadi penggunaan obat-obatan.
- source_word: ἐπλανήθησαν
  choice: disesatkan
  rationale: Pilihan ini mencerminkan bentuk pasif Yunani dan mempertahankan cakupan makna yang dapat meliputi penipuan maupun pembujukan menuju jalan yang salah.
- source_word: πάντα τὰ ἔθνη
  choice: semua bangsa
  rationale: ἔθνη di sini menunjuk secara kolektif kepada bangsa-bangsa di dunia.
theological_decisions:
- issue: Makna φαρμακεία dalam konteks penghukuman apokaliptis
  choice: sihir
  alternative: ilmu gaib; praktik-praktik sihir
  rationale: Istilah ini dapat berkaitan dengan mantra, ramuan, dan praktik magis, tetapi konteks menekankan pengaruh menyesatkan Babel atas bangsa-bangsa. 'Sihir' mempertahankan makna religius-moral yang luas tanpa memasukkan pengertian farmasi modern.
- issue: Kekuatan dua klausa οὐ μή
  choice: tidak akan pernah ... lagi
  alternative: tidak akan ... lagi; sama sekali tidak akan ...
  rationale: Bentuk Yunani mengumumkan penghukuman yang tegas dan tidak dapat dibatalkan. Rumusan yang dipilih menyampaikan finalitas itu secara wajar dalam bahasa Indonesia.
- issue: Identitas οἱ μεγιστᾶνες τῆς γῆς
  choice: orang-orang besar di bumi
  alternative: para pembesar di bumi; orang-orang berkuasa di bumi
  rationale: Teks menyatakan kedudukan dan pengaruh besar tanpa secara eksplisit membatasi kelompok itu pada pejabat politik, bangsawan, atau saudagar kaya; terjemahan mempertahankan keluasan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'tidak akan pernah ... lagi' dipertahankan untuk mencerminkan penegasan dan irama penghukuman dalam teks Yunani. 'Di dalammu' mempertahankan personifikasi Babel, sedangkan 'orang-orang besar' sengaja tidak dipersempit secara sosial atau politik.
