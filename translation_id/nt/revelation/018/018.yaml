  text: καὶ ⸀ἔκραξαν βλέποντες τὸν καπνὸν τῆς πυρώσεως αὐτῆς λέγοντες· Τίς ὁμοία τῇ πόλει τῇ μεγάλῃ;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/018.yaml
  text: And they cried out as they saw the smoke of her burning[a], saying, “What city is like the great city?”
translation:
  language: id
  text: Ketika melihat asap dari pembakaran kota itu, mereka berseru, “Kota manakah yang seperti kota besar itu?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apakah yang seperti kota besar itu?” Bahasa Yunani memakai pertanyaan eliptis; kata “kota” dalam terjemahan dipasok dari konteks untuk memperjelas hal yang dibandingkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκραξαν
  choice: mereka berseru
  rationale: Kata kerja κράζω menyatakan seruan yang keras. “Berseru” menyampaikan kekuatan itu dengan bahasa Indonesia yang wajar dan bermartabat.
- source_word: βλέποντες
  choice: ketika melihat
  rationale: Partisipel kini ini berlangsung bersamaan dengan kata kerja utama; “ketika melihat” mempertahankan hubungan waktunya secara alami.
- source_word: τὸν καπνὸν τῆς πυρώσεως αὐτῆς
  choice: asap dari pembakarannya
  rationale: Ungkapan ini mempertahankan hubungan antara asap dan proses kota itu dibakar. Akhiran “-nya” merujuk kembali kepada kota/Babel tanpa memaksakan gender yang tidak dimiliki bahasa Indonesia.
- source_word: λέγοντες
  choice: diungkapkan melalui kutipan langsung setelah “berseru”
  rationale: Dalam bahasa Indonesia, verba “berseru” yang langsung diikuti kutipan sudah secara alami memuat fungsi “seraya berkata”, sehingga pengulangan verba ujar tidak diperlukan.
- source_word: Τίς ὁμοία τῇ πόλει τῇ μεγάλῃ;
  choice: Kota manakah yang seperti kota besar itu?
  rationale: Bahasa Yunani bersifat eliptis dan tidak menyatakan kopula bertenses. “Kota manakah” memasok unsur pembanding yang tersirat dari konteks, sedangkan “yang seperti” mempertahankan ketidakbertandaan waktu dan bentuk pertanyaan retoris.
- source_word: τῇ πόλει τῇ μεγάλῃ
  choice: kota besar itu
  rationale: Frasa ini menunjuk kepada kota tertentu yang sudah dikenal dalam konteks. “Itu” menyampaikan sifat definit artikel Yunani secara alami.
theological_decisions:
- issue: Personifikasi Babel sebagai perempuan sekaligus kota
  choice: Memakai “-nya” untuk merujuk kepada kota/Babel
  alternative: Menggunakan “dia” atau mengulangi “kota itu”
  rationale: Bahasa Indonesia tidak menandai gender pada pronomina. “-nya” mempertahankan rujukan personal dalam wacana tanpa menambahkan gender secara tidak alami atau menghapus gambaran personifikasi dalam konteks.
- issue: Waktu dalam pertanyaan perbandingan
  choice: Tidak menambahkan “dulu”, “pernah”, atau penanda waktu lain
  alternative: “Kota manakah yang pernah seperti kota besar itu?”
  rationale: Bahasa Yunani tidak memiliki kopula eksplisit dalam pertanyaan ini, sehingga waktunya tidak dinyatakan. Terjemahan mempertahankan ambiguitas tersebut dan tidak memaksakan pembacaan lampau atau kini.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan kalimat mendahulukan anak kalimat waktu agar alurnya lancar. Pertanyaan retoris dibuat alami tanpa menambahkan kopula atau penanda waktu yang tidak terdapat dalam teks Yunani.
