id: REV.18.20
reference: Revelation 18:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Εὐφραίνου ἐπ’ αὐτῇ, οὐρανέ, καὶ οἱ ἅγιοι καὶ οἱ ἀπόστολοι καὶ οἱ προφῆται, ὅτι ἔκρινεν ὁ θεὸς τὸ κρίμα ὑμῶν ἐξ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/020.yaml
  text: Rejoice over her[a], O heaven, and you saints and apostles and prophets, because God has judged your judgment from her.
translation:
  language: id
  text: Bersukacitalah atas dia, hai surga, juga kalian, orang-orang kudus, rasul-rasul, dan nabi-nabi, sebab Allah telah menjatuhkan penghakiman atas dia dalam perkara kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Yunaninya padat; secara harfiah, “Allah telah menghakimi penghakiman kalian dari dia.” Dapat pula dipahami secara lebih interpretatif: “Allah telah menghakimi dia demi kalian” atau “Allah telah membalaskan penderitaan kalian atas dia.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐφραίνου
  choice: Bersukacitalah
  rationale: Imperatif ini menyerukan sukacita; bentuk ini alami, tegas, dan tetap bernada luhur dalam bahasa Indonesia.
- source_word: ἐπ’ αὐτῇ
  choice: atas dia
  rationale: Dengan verba bersukacita, ἐπί + datif menyatakan objek atau alasan sukacita; 'atas dia' mempertahankan hubungan langsung dengan figur perempuan yang melambangkan Babel.
- source_word: οὐρανέ
  choice: hai surga
  rationale: Vokatif tunggal yang mempersonifikasikan surga dipertahankan dengan partikel sapaan 'hai'.
- source_word: οἱ ἅγιοι
  choice: orang-orang kudus
  rationale: Ungkapan baku dan mudah dipahami untuk umat Allah yang dikuduskan, tanpa membatasinya pada kelompok tertentu.
- source_word: οἱ ἀπόστολοι
  choice: rasul-rasul
  rationale: Makna teknis 'rasul' paling sesuai dalam rangkaian bersama orang-orang kudus dan nabi-nabi.
- source_word: οἱ προφῆται
  choice: nabi-nabi
  rationale: Padanan langsung dan baku bagi προφῆται.
- source_word: ὅτι
  choice: sebab
  rationale: Memperkenalkan alasan bagi perintah untuk bersukacita dan sesuai dengan register luhur modern.
- source_word: ἔκρινεν ὁ θεὸς τὸ κρίμα ὑμῶν
  choice: Allah telah menjatuhkan ... penghakiman yang menjadi hak kalian
  rationale: Menyampaikan tindakan yudisial Allah dan relasi κρίμα dengan para pihak yang disapa secara alami, sambil tidak memakai verba eksplisit 'membalaskan' yang tidak terdapat dalam Yunani.
- source_word: ἐξ αὐτῆς
  choice: kepada dia
  rationale: Dalam konstruksi Yunani yang padat ini, frasa menunjuk pada penghakiman yang dituntut atau dikenakan terhadap Babel; 'kepada dia' menyampaikan arah tindakan tanpa menambahkan istilah pembalasan.
theological_decisions:
- issue: Seberapa eksplisit tindakan pengadilan Allah terhadap Babel demi umat-Nya harus ditafsirkan
  choice: Menerjemahkan idiom padat itu sebagai 'menjatuhkan kepada dia penghakiman yang menjadi hak kalian'
  alternative: '''telah membalaskan kalian terhadap dia'' atau terjemahan sangat harfiah ''telah menghakimi penghakiman kalian dari dia'''
  rationale: Pilihan utama menjaga bahasa pengadilan κρίνω/κρίμα, menyatakan bahwa keputusan itu berpihak pada atau merupakan hak para pihak yang disapa, dan tetap menghindari penambahan konsep pembalasan secara eksplisit. Catatan kaki mempertahankan kepadatan serta alternatif penafsirannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada luhur. 'Hai surga' mempertahankan sapaan puitis; 'juga kalian' memperjelas peralihan dari vokatif tunggal kepada kelompok-kelompok yang disapa. Penanda catatan kaki [a] ditempatkan sesudah klausa yang dijelaskannya.
