revisions:
- from: Bersukacitalah atas dia, hai surga, juga kalian, orang-orang kudus, rasul-rasul, dan nabi-nabi, sebab Allah telah menjatuhkan kepada dia penghakiman yang menjadi hak kalian.[a]
  to: Bersukacitalah atas dia, hai surga, juga kalian, orang-orang kudus, rasul-rasul, dan nabi-nabi, sebab Allah telah menjatuhkan penghakiman atas dia dalam perkara kalian.[a]
  rationale: Revisi mempertahankan imperatif, vokatif, daftar kelompok, dan bahasa pengadilan dalam teks Yunani, tetapi mengganti konstruksi Indonesia yang kurang idiomatis. “Dalam perkara kalian” menyampaikan τὸ κρίμα ὑμῶν secara natural tanpa menetapkan secara dogmatis apakah yang ditekankan ialah pembelaan, putusan bagi mereka, atau pembalasan. “Atas dia” menyampaikan sasaran yudisial secara jelas, sedangkan catatan kaki tetap memelihara kepadatan dan ketidakpastian idiom Yunani.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:04:27Z'
review_pass:
  verdict: revise
  source_fidelity: Makna utama sudah dekat, tetapi “kepada dia” kurang tepat untuk ἐξ αὐτῆς, yang dalam idiom ini menunjuk tindakan penghakiman terhadap Babel sebagai pihak yang dimintai pertanggungjawaban. Terjemahan “atas dia” lebih wajar dan menyampaikan arah tindakan yudisial tanpa memaksakan verba “membalaskan.”
  naturalness: Kalimat draft pada dasarnya alami dan bernada baku. Namun, “penghakiman yang menjadi hak kalian” terdengar agak kaku dan dapat mengesankan hak abstrak atas suatu putusan. “Perkara kalian” adalah idiom hukum Indonesia yang lebih alami untuk τὸ κρίμα ὑμῶν sambil mempertahankan ambiguitas genitifnya.
  terminology: “Bersukacitalah,” “hai surga,” “orang-orang kudus,” “rasul-rasul,” “nabi-nabi,” dan “Allah” sesuai register serta terminologi. “Perkara kalian” mempertahankan ranah peradilan dari κρίνω/κρίμα; catatan kaki menjelaskan pembacaan yang lebih idiomatis tanpa menjadikannya teks utama.
  issues:
  - severity: medium
    issue: Padanan ἐξ αὐτῆς sebagai “kepada dia”
    rationale: ἐξ secara leksikal berarti “dari,” dan dalam konstruksi yang sukar ini kemungkinan menyatakan penghakiman yang Allah laksanakan terhadap/dari Babel. “Kepada dia” tidak idiomatis sebagai sasaran “menjatuhkan penghakiman” dan terlalu jauh dari hubungan yang dimaksud. “Atas dia” lebih jelas dan alami dalam bahasa hukum Indonesia.
  - severity: low
    issue: “Penghakiman yang menjadi hak kalian”
    rationale: Ungkapan ini dapat dipahami, tetapi kurang luwes dan cenderung mengonkretkan τὸ κρίμα ὑμῶν sebagai suatu hak milik. “Perkara kalian” mempertahankan bahasa peradilan dan hubungan dengan pihak-pihak yang disapa tanpa menguraikan secara berlebihan menjadi pembalasan.
  - severity: low
    issue: Alternatif catatan kaki “membalaskan kalian terhadap dia”
    rationale: Dalam bahasa Indonesia modern, “membalaskan kalian” tidak lazim. “Membalaskan penderitaan kalian atas dia” menyatakan alternatif interpretatif secara idiomatis, sambil tetap ditandai sebagai penjelasan, bukan terjemahan utama.
  revised_text: Bersukacitalah atas dia, hai surga, juga kalian, orang-orang kudus, rasul-rasul, dan nabi-nabi, sebab Allah telah menjatuhkan penghakiman atas dia dalam perkara kalian.[a]
