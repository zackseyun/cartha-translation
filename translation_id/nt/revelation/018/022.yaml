id: REV.18.22
reference: Revelation 18:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ φωνὴ κιθαρῳδῶν καὶ μουσικῶν καὶ αὐλητῶν καὶ σαλπιστῶν οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι, καὶ πᾶς τεχνίτης πάσης τέχνης οὐ μὴ εὑρεθῇ ἐν σοὶ ἔτι, καὶ φωνὴ μύλου οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/022.yaml
  text: And the sound of harpists and musicians and flute players and trumpeters will never be heard in you again[a], and no craftsman of any craft will ever be found in you again, and the sound of a mill will never be heard in you again[b],
translation:
  language: id
  text: Bunyi para pemain kecapi, para pemusik, para peniup seruling, dan para peniup sangkakala tidak akan pernah terdengar lagi di dalammu[a]. Tidak seorang perajin pun dalam bidang keahlian apa pun akan ditemukan lagi di dalammu. Bunyi kilangan pun tidak akan pernah terdengar lagi di dalammu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para pemain aulos”; aulos adalah alat musik tiup kuno yang tidak sama persis dengan seruling modern.
    reason: lexical_alternative
  - marker: b
    text: Atau “bunyi batu kilangan”; kata Yunani dapat menunjuk secara lebih khusus pada alat penggiling, tetapi “kilangan” mencakup gambaran kegiatan menggiling.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: bunyi
  rationale: Dalam konteks ini kata tersebut menunjuk pada bunyi yang terdengar, baik dari para pemusik maupun dari kilangan, bukan pada suara tutur.
- source_word: κιθαρῳδῶν
  choice: para pemain kecapi
  rationale: Istilah ini menunjuk pada pemain kithara. 'Pemain kecapi' merupakan padanan Indonesia yang mudah dipahami bagi pemain alat musik petik kuno, tanpa transliterasi yang asing.
- source_word: μουσικῶν
  choice: para pemusik
  rationale: Padanan ini mempertahankan cakupan umum istilah bagi pelaku musik dan terdengar alami dalam daftar tersebut.
- source_word: αὐλητῶν
  choice: para peniup seruling
  rationale: Istilah ini berarti pemain aulos, alat musik tiup kuno. 'Peniup seruling' mudah dipahami, sedangkan catatan kaki menjaga perbedaan historis instrumennya.
- source_word: σαλπιστῶν
  choice: para peniup sangkakala
  rationale: Padanan ini jelas dan sesuai dengan laras Alkitab Indonesia yang bermartabat tanpa menjadi usang.
- source_word: οὐ μὴ ἀκουσθῇ ... ἔτι
  choice: tidak akan pernah terdengar lagi
  rationale: Gabungan οὐ μή dengan subjungtif aoris menyatakan penyangkalan yang sangat tegas, sedangkan ἔτι menandai berakhirnya keadaan sebelumnya.
- source_word: ἐν σοὶ
  choice: di dalammu
  rationale: Padanan ini mempertahankan sapaan orang kedua kepada Babel yang dipersonifikasikan sebagai kota.
- source_word: πᾶς τεχνίτης πάσης τέχνης
  choice: seorang pun perajin dari keahlian apa pun
  rationale: 'Ungkapan ini menyampaikan cakupan menyeluruh dari bahasa Yunani secara alami: tidak ada perajin, apa pun bidang keahliannya.'
- source_word: εὑρεθῇ
  choice: ditemukan
  rationale: Arti dasarnya dipertahankan; bersama penyangkalan tegas dan 'pernah', kata ini menyatakan ketiadaan sepenuhnya.
- source_word: μύλου
  choice: kilangan
  rationale: Kata Yunani dapat menunjuk pada alat penggiling atau kilangan. 'Kilangan' menangkap gambaran kegiatan penggilingan dan bunyinya, sementara kemungkinan yang lebih khusus dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Gambaran penghukuman Babel
  choice: Mempertahankan tiga pernyataan konkret mengenai lenyapnya musik, pekerjaan terampil, dan kegiatan penggilingan secara permanen.
  alternative: Memperlakukan rincian-rincian tersebut sekadar sebagai hiasan atau menguraikan masing-masing sebagai simbol doktrinal tertentu.
  rationale: Pengulangan οὐ μή ... ἔτι menekankan kehancuran yang menyeluruh dan tidak dapat dipulihkan. Terjemahan mempertahankan kekuatan gambaran itu tanpa mengalegorikannya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'tidak akan pernah ... lagi' dipertahankan untuk mencerminkan penegasan dan irama penghakiman dalam teks Yunani. 'Di dalammu' mempertahankan personifikasi langsung terhadap Babel.
