id: REV.18.21
reference: Revelation 18:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἦρεν εἷς ἄγγελος ἰσχυρὸς λίθον ὡς ⸀μύλινον μέγαν, καὶ ἔβαλεν εἰς τὴν θάλασσαν λέγων· Οὕτως ὁρμήματι βληθήσεται Βαβυλὼν ἡ μεγάλη πόλις, καὶ οὐ μὴ εὑρεθῇ ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/021.yaml
  text: And one mighty angel lifted up a stone like a great millstone and threw it into the sea[a], saying, “So will Babylon the great city be thrown down with violence, and it will never be found again.”
translation:
  language: id
  text: Kemudian seorang malaikat yang perkasa mengangkat sebuah batu seperti batu kilangan besar, lalu melemparkannya ke dalam laut sambil berkata, “Demikianlah Babel, kota besar itu, akan dilemparkan dengan dahsyat[a] dan tidak akan pernah ditemukan lagi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “dengan kuat”, “dengan suatu hentakan”, atau “dengan keras”. Kata Yunani ini menggambarkan dorongan atau gerakan yang tiba-tiba dan penuh kekuatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Kemudian
  rationale: Kata penghubung ini melanjutkan rangkaian penglihatan; ‘Kemudian’ lebih alami dalam narasi Indonesia daripada ‘Dan’ tanpa mengubah urutannya.
- source_word: ἦρεν
  choice: mengangkat
  rationale: Bentuk aoris αἴρω menggambarkan malaikat mengambil dan mengangkat batu sebagai persiapan bagi tindakan simbolis.
- source_word: εἷς ἄγγελος ἰσχυρὸς
  choice: seorang malaikat yang perkasa
  rationale: εἷς menampilkan satu sosok malaikat, sedangkan ἰσχυρός menyatakan kekuatan; susunan ini alami dan tetap bernada apokaliptis.
- source_word: λίθον ὡς μύλινον μέγαν
  choice: sebuah batu sebesar batu kilangan besar
  rationale: ὡς mempertahankan unsur perbandingan, bukan menyamakan batu itu secara mutlak dengan batu kilangan. ‘Sebesar’ mengungkapkan perbandingan ukuran yang tersirat oleh gambaran tersebut.
- source_word: ἔβαλεν εἰς τὴν θάλασσαν
  choice: melemparkannya ke dalam laut
  rationale: βάλλω menyatakan tindakan melempar, dan pronomina objek membuat rujukan kepada batu jelas serta alami dalam bahasa Indonesia.
- source_word: Οὕτως
  choice: Demikianlah
  rationale: Menandai bahwa tindakan simbolis tadi menggambarkan cara Babel akan dijatuhkan.
- source_word: ὁρμήματι
  choice: dengan dahsyat
  rationale: Nomina datif ini mengandung gagasan gerakan atau dorongan yang tiba-tiba dan kuat. ‘Dengan dahsyat’ menyampaikan kekuatan penghancurnya sambil membiarkan nuansa geraknya dijelaskan dalam catatan kaki.
- source_word: βληθήσεται
  choice: akan dilemparkan
  rationale: Bentuk pasif mendatang βάλλω menggemakan pelemparan batu sebelumnya. Kata ‘dilemparkan’ mempertahankan gambaran itu tanpa menambahkan ‘jatuh’ atau ‘runtuh’ yang tidak dinyatakan secara eksplisit.
- source_word: Βαβυλὼν ἡ μεγάλη πόλις
  choice: Babel, kota besar itu
  rationale: Mempertahankan struktur aposisi dan gelar apokaliptisnya dalam susunan Indonesia yang alami.
- source_word: οὐ μὴ εὑρεθῇ ἔτι
  choice: tidak akan pernah ditemukan lagi
  rationale: Gabungan οὐ μή dengan bentuk subjungtif merupakan penyangkalan yang sangat tegas; ‘tidak akan pernah ... lagi’ menyampaikan penegasan dan finalitasnya.
theological_decisions:
- issue: Sifat gambaran kehancuran Babel
  choice: Penghakiman diterjemahkan sebagai tindakan yang dahsyat dan final tanpa menentukan apakah Babel bersifat harfiah, simbolis, atau keduanya.
  alternative: Menafsirkan Babel secara khusus sebagai kota Babel harfiah, sistem dunia yang melawan Allah, atau lambang apokaliptis gabungan.
  rationale: Ayat ini sendiri menyajikan tindakan simbolis dan pernyataan penghancuran. Terjemahan mempertahankan gambaran serta finalitasnya tanpa memasukkan skema eskatologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan gambaran apokaliptis yang jelas. Istilah ‘batu kilangan’ dipertahankan sebagai istilah Alkitab yang dikenal; struktur kalimat dibuat alami bagi pembaca umum. Penanda catatan kaki [a] ditempatkan langsung setelah ungkapan yang dijelaskan.
