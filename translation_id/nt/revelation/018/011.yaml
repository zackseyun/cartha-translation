  text: Καὶ οἱ ἔμποροι τῆς γῆς ⸂κλαίουσιν καὶ πενθοῦσιν⸃ ἐπ’ ⸀αὐτήν, ὅτι τὸν γόμον αὐτῶν οὐδεὶς ἀγοράζει οὐκέτι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/011.yaml
  text: And the merchants of the earth weep and mourn over her[a], because no one buys their cargo anymore[b],
translation:
  language: id
  text: Para pedagang di bumi[a] menangis dan berkabung atas dia, sebab tidak seorang pun lagi membeli muatan[b] mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di negeri” atau “di daratan”. Kata Yunani ini dapat berarti bumi, negeri, atau daratan; dalam kitab Wahyu, konteksnya sering menunjukkan lingkup yang luas.
    reason: lexical_alternative
  - marker: b
    text: Atau “barang dagangan”. Kata Yunani ini dapat menunjuk pada muatan kapal atau barang-barang komersial.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔμποροι
  choice: para pedagang
  rationale: Istilah ini menunjuk kepada orang-orang yang menjalankan perdagangan; “para pedagang” merupakan padanan baku dan alami dalam konteks perdagangan barang mewah di Wahyu 18.
- source_word: τῆς γῆς
  choice: di bumi
  rationale: γῆ dapat berarti “bumi” atau “negeri/daratan”. Dalam cakrawala penghakiman apokaliptik kitab Wahyu, “bumi” paling wajar mempertahankan lingkup luas frasa ini.
- source_word: κλαίουσιν καὶ πενθοῦσιν
  choice: menangis dan berkabung
  rationale: 'Kedua verba dipertahankan secara terpisah untuk menjaga penguatan retoris: yang pertama menyatakan tangisan, sedangkan yang kedua menyatakan perkabungan.'
- source_word: ἐπ’ αὐτήν
  choice: karena dia
  rationale: Dengan verba ratapan, frasa ini menyatakan bahwa sosok perempuan yang melambangkan Babel menjadi sasaran atau alasan ratapan. “Karena dia” alami dalam bahasa Indonesia dan tetap mempertahankan rujukan personal tanpa menjelaskan simbol itu lebih jauh.
- source_word: γόμον
  choice: muatan
  rationale: γόμος menunjuk pada muatan kapal atau barang yang diangkut untuk diperdagangkan. “Muatan” tepat dalam konteks perdagangan dan daftar barang pada ayat-ayat berikutnya.
- source_word: οὐδεὶς ἀγοράζει οὐκέτι
  choice: tidak seorang pun lagi membeli
  rationale: Susunan ini secara alami menyampaikan tindakan yang telah berhenti dan mempertahankan penegasan οὐκέτι, “tidak lagi”.
- source_word: αὐτῶν
  choice: mereka
  rationale: Pronomina genitif ini menyatakan kepunyaan dan merujuk kepada para pedagang; dalam bahasa Indonesia hubungan itu dinyatakan secara alami dengan “muatan mereka”.
theological_decisions:
- issue: Rujukan dan personifikasi Babel
  choice: Menggunakan pronomina personal “dia” untuk Babel
  alternative: Menggunakan “kota itu” atau “hal itu”
  rationale: Teks Yunani memakai pronomina feminin karena Babel digambarkan sebagai perempuan sekaligus kota. Bahasa Indonesia tidak membedakan gender pada pronomina, tetapi “dia” tetap menjaga personifikasi tersebut tanpa menetapkan tafsiran mengenai identitas simbolis Babel.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang jelas dan khidmat. Pengulangan dua verba ratapan dipertahankan, sementara personifikasi Babel dijaga melalui pronomina personal “dia”.
