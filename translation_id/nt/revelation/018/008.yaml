id: REV.18.8
reference: Revelation 18:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἐν μιᾷ ἡμέρᾳ ἥξουσιν αἱ πληγαὶ αὐτῆς, θάνατος καὶ πένθος καὶ λιμός, καὶ ἐν πυρὶ κατακαυθήσεται· ὅτι ἰσχυρὸς κύριος ὁ θεὸς ὁ κρίνας αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/008.yaml
  text: 'For this reason, in one day her plagues will come: death and mourning and famine, and she will be burned up with fire; because strong is the Lord God who judged her.'
translation:
  language: id
  text: 'Karena itu, dalam satu hari malapetakanya akan datang: kematian, perkabungan, dan kelaparan. ia akan dibakar habis dengan api, sebab Tuhan Allah yang telah menghakiminya itu kuat.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Karena itu
  rationale: Menyampaikan hubungan sebab-akibat dengan pernyataan sebelumnya secara alami dan tepat.
- source_word: ἐν μιᾷ ἡμέρᾳ
  choice: dalam satu hari
  rationale: Mempertahankan ungkapan waktu sumber tanpa menafsirkan apakah maksudnya harfiah atau kiasan.
- source_word: αἱ πληγαὶ αὐτῆς
  choice: malapetakanya
  rationale: Dalam konteks penghakiman, bentuk tunggal kolektif bahasa Indonesia terdengar alami dan mencakup bencana-bencana yang kemudian dirinci.
- source_word: πένθος
  choice: perkabungan
  rationale: Menunjuk keadaan berkabung akibat kehilangan, bukan sekadar kesedihan batin.
- source_word: ἐν πυρὶ κατακαυθήσεται
  choice: Ia akan dibakar habis dengan api
  rationale: Bentuk pasif mempertahankan susunan sumber, sedangkan 'habis' menyampaikan daya intensif kata kerja κατακαίω.
- source_word: ἰσχυρός
  choice: kuat
  rationale: Padanan langsung yang mempertahankan penegasan tentang kekuatan Allah; tidak diperluas menjadi gelar teologis lain.
- source_word: ὁ κρίνας αὐτήν
  choice: yang telah menghakiminya
  rationale: Partisip aoristus diterjemahkan secara alami sebagai tindakan penghakiman yang dipandang telah ditetapkan atau dilakukan.
theological_decisions:
- issue: Relasi ὅτι dengan klausa sebelumnya
  choice: sebab
  alternative: karena
  rationale: Keduanya menyatakan alasan; 'sebab' dipilih agar alur kalimat tetap lugas dan khidmat tanpa mengubah hubungan logis.
- issue: Daya ἰσχυρός sebagai dasar kepastian hukuman
  choice: Tuhan Allah ... itu kuat
  alternative: Tuhan Allah ... itu Mahakuasa/perkasa
  rationale: '''Kuat'' mengikuti leksem Yunani secara dekat dan menghindari penggantian dengan istilah teknis atau penguatan yang tidak tersurat.'
- issue: Acuan pronomina feminin αὐτήν
  choice: -nya / Ia
  alternative: perempuan itu atau Babel
  rationale: Pronomina dipertahankan agar personifikasi feminin dalam konteks tetap terasa tanpa memasukkan nama yang tidak muncul dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Tanda titik setelah daftar malapetaka dipakai untuk menjaga keterbacaan, sementara hubungan alasan dalam klausa terakhir tetap jelas.
