review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan karena “asap dari tubuhnya yang terbakar” menambahkan unsur “tubuh,” yang tidak ada dalam τῆς πυρώσεως αὐτῆς. Genitif tersebut menyatakan pembakaran atas dirinya, bukan tubuhnya. Selain itu, penanda catatan b harus ditempatkan pada ungkapan percabulan yang dijelaskannya.
  naturalness: Teks revisi memakai Bahasa Indonesia baku modern. “Raja-raja di bumi,” “berbuat cabul,” “hidup bermewah-mewah,” dan “asap pembakarannya” jelas serta mempertahankan register profetis tanpa penambahan penafsiran.
  terminology: “Berbuat cabul” mempertahankan citra seksual πορνεύσαντες tanpa meniadakan kemungkinan fungsi metaforisnya. “Meratapinya” tepat untuk κόψονται dalam idiom perkabungan. “Asap pembakarannya” menerjemahkan πυρώσεως tanpa memasukkan gagasan tubuh atau siksaan.
  issues:
  - severity: high
    issue: “tubuhnya” ditambahkan pada terjemahan τῆς πυρώσεως αὐτῆς.
    rationale: Teks Yunani hanya menyebut “pembakarannya”/“ia terbakar”; tidak menyebut tubuh. Tambahan itu mengubah citra dan melampaui sumber.
  - severity: medium
    issue: Penanda catatan kaki b ditempatkan setelah klausa pembakaran, bukan setelah ungkapan “berbuat cabul”.
    rationale: Isi catatan b menjelaskan metafora “berbuat cabul bersamanya”; penanda harus melekat pada ungkapan tersebut agar jangkar catatan kaki akurat.
  - severity: low
    issue: Keterangan alternatif untuk κόψονται lebih tepat menyebut tindakan perkabungan seperti memukul dada.
    rationale: κόπτομαι dalam konteks ratapan menunjuk pada demonstrasi dukacita; “memukul-mukul dada” menyampaikan citra idiomatis itu lebih alami daripada “memukul-mukul diri karena dia”.
