id: REV.18.9
reference: Revelation 18:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ κλαύσουσιν καὶ κόψονται ἐπ’ αὐτὴν οἱ βασιλεῖς τῆς γῆς οἱ μετ’ αὐτῆς πορνεύσαντες καὶ στρηνιάσαντες, ὅταν βλέπωσιν τὸν καπνὸν τῆς πυρώσεως αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/009.yaml
  text: And the kings of the earth who committed sexual immorality and lived in luxury with her will weep and mourn over her when they see the smoke of her burning[b][a],
translation:
  language: id
  text: Raja-raja di bumi yang telah berbuat cabul dengannya[b] dan hidup bermewah-mewah dengannya akan menangis dan meratapinya[a] ketika mereka melihat asap pembakarannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan memukul-mukul dada”; kata Yunani ini menggambarkan ratapan yang diperagakan.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “berbuat cabul dengannya” kemungkinan merupakan bagian dari kiasan berulang dalam Wahyu tentang persekutuan yang korup dan penyembahan berhala, tetapi tetap memakai citra seksual teks Yunani.
    reason: lexical_alternative
lexical_decisions:
- source_word: κλαύσουσιν
  choice: akan menangis
  rationale: Menyampaikan tangisan dukacita yang terdengar secara alami dalam bahasa Indonesia modern.
- source_word: κόψονται ἐπ’ αὐτὴν
  choice: akan meratapinya
  rationale: Dalam ungkapan ini, verba tersebut menunjuk pada perkabungan yang diperagakan; akhiran -nya menyatakan objek ratapan.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: raja-raja di bumi
  rationale: Ungkapan apokaliptik ini menunjuk kepada para penguasa dunia; 'di bumi' alami dan mempertahankan cakupan global.
- source_word: μετ’ αὐτῆς πορνεύσαντες καὶ στρηνιάσαντες
  choice: yang telah berbuat cabul dan hidup bermewah-mewah bersamanya
  rationale: Relasi 'bersamanya' dipahami berlaku bagi kedua tindakan yang dikoordinasikan, sesuai susunan Yunani, sementara citra seksual dan kemewahan yang memanjakan diri tetap dipertahankan.
- source_word: ὅταν βλέπωσιν
  choice: ketika mereka melihat
  rationale: Mengungkapkan keadaan masa depan yang dimaksud secara wajar dalam narasi nubuat.
- source_word: τὸν καπνὸν τῆς πυρώσεως αὐτῆς
  choice: asap dari tubuhnya yang terbakar
  rationale: Membuat hubungan genitif dan rujukan feminin menjadi jelas secara alami tanpa menambahkan gagasan siksaan yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Citra percabulan Babel
  choice: Mempertahankan bahasa 'berbuat cabul' dalam teks utama.
  alternative: Mengabstraksikannya menjadi 'berbuat tidak setia' atau 'menjalin persekutuan yang rusak'.
  rationale: Dalam Wahyu, citra seksual ini dapat berfungsi secara metaforis bagi persekutuan yang korup dan menyembah berhala, tetapi terjemahan tidak seharusnya meniadakan citra seksual teks Yunani.
- issue: Makna κόψονται
  choice: Menerjemahkan makna idiomatisnya sebagai 'meratapinya'.
  alternative: Menerjemahkan gambaran tindakannya sebagai 'memukul-mukul diri' atau 'memukul dada'.
  rationale: Konteksnya adalah perkabungan; pilihan utama menghindari kesan bahwa fokus ayat adalah tindakan menyakiti diri, sedangkan nuansa tindakan ratapan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. 'Berbuat cabul' mempertahankan ketajaman citra profetis tanpa istilah yang terlalu teknis; 'hidup bermewah-mewah' menyatakan kemewahan yang memanjakan diri. Semua penanda catatan kaki dicantumkan dalam teks utama.
