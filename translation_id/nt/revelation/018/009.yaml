revisions:
- from: Raja-raja di bumi yang telah berbuat cabul dan hidup bermewah-mewah bersamanya akan menangis dan meratapinya[a] ketika mereka melihat asap dari tubuhnya yang terbakar.[b]
  to: Raja-raja di bumi yang telah berbuat cabul dengannya[b] dan hidup bermewah-mewah dengannya akan menangis dan meratapinya[a] ketika mereka melihat asap pembakarannya.
  rationale: Revisi menghapus tambahan yang tidak didukung sumber (“tubuhnya”), menerjemahkan τῆς πυρώσεως αὐτῆς sebagai “pembakarannya,” dan memindahkan penanda b ke frasa yang benar. Pengulangan “dengannya” membuat relasi μετά + genitif jelas bagi kedua verba yang dikoordinasikan, tanpa mengubah makna. Catatan a diselaraskan dengan nuansa ratapan demonstratif dari κόψονται.
