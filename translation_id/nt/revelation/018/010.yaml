id: REV.18.10
reference: Revelation 18:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀπὸ μακρόθεν ἑστηκότες διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, Βαβυλὼν ἡ πόλις ἡ ἰσχυρά, ὅτι μιᾷ ὥρᾳ ἦλθεν ἡ κρίσις σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/010.yaml
  text: standing far off because of the fear of her torment[a], saying, ‘Woe, woe, the great city, Babylon[b], the strong city! For in one hour your judgment has come.’
translation:
  language: id
  text: Mereka berdiri dari jauh karena takut akan siksaan yang dialami Babel itu, sambil berkata, “Celaka, celaka[a], kota besar itu, Babel, kota yang kuat[b]! Sebab dalam satu jam penghakimanmu telah datang.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Aduh, aduh.” Seruan Yunani ini dapat menyatakan ratapan maupun malapetaka; “Celaka, celaka” mempertahankan kekuatan profetis-apokaliptiknya.
    reason: lexical_alternative
  - marker: b
    text: Atau “kota yang perkasa.” Kata Yunani yang dipakai dapat berarti kuat, berkuasa, atau perkasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ μακρόθεν ἑστηκότες
  choice: Mereka berdiri jauh-jauh
  rationale: Gabungan keterangan tempat dan partisip perfektif menggambarkan keadaan mereka yang tetap berdiri pada jarak jauh; bentuk ini alami dan hidup dalam bahasa Indonesia.
- source_word: διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς
  choice: karena takut akan siksaan yang dialaminya
  rationale: διά dengan akusatif menyatakan sebab. βασανισμός berarti siksaan berat; αὐτῆς secara harfiah 'siksaannya', tetapi ungkapan relatif memperjelas bahwa Babel mengalami siksaan itu tanpa menentukan pelakunya.
- source_word: λέγοντες
  choice: sambil berkata
  rationale: Partisip ini menyertai tindakan berdiri dan secara alami memperkenalkan ucapan langsung.
- source_word: Οὐαὶ οὐαί
  choice: Celaka, celaka
  rationale: Seruan ini mengandung ratapan sekaligus ancaman malapetaka; 'celaka' mempertahankan daya profetis-apokaliptiknya dalam bahasa Indonesia modern.
- source_word: ἡ πόλις ἡ μεγάλη
  choice: kota besar itu
  rationale: Frasa artikular menandai kota yang sudah dikenal dalam konteks; 'itu' membantu mempertahankan sifat definitnya secara alami.
- source_word: Βαβυλὼν
  choice: Babel
  rationale: Babel adalah bentuk baku nama kota ini dalam tradisi Alkitab bahasa Indonesia.
- source_word: ἡ πόλις ἡ ἰσχυρά
  choice: kota yang kuat
  rationale: ἰσχυρός menunjuk pada kekuatan atau keperkasaan; 'kuat' merupakan padanan langsung dan wajar.
- source_word: ὅτι μιᾷ ὥρᾳ
  choice: Sebab dalam satu jam
  rationale: ὅτι memperkenalkan alasan ratapan, sedangkan datif waktu menekankan betapa mendadaknya penghakiman itu.
- source_word: ἦλθεν ἡ κρίσις σου
  choice: penghakimanmu telah datang
  rationale: Aoris menyatakan tibanya penghakiman sebagai peristiwa tuntas; 'telah datang' mempertahankan dampaknya yang kini dirasakan dalam ucapan langsung.
theological_decisions:
- issue: Nuansa seruan οὐαὶ
  choice: Celaka, celaka
  alternative: Aduh, aduh
  rationale: '''Celaka'' menjaga ketegangan antara ratapan dan pernyataan hukuman, sedangkan ''aduh'' terutama terdengar sebagai keluhan dan dapat melemahkan daya profetisnya.'
- issue: Makna κρίσις
  choice: penghakiman
  alternative: hukuman
  rationale: κρίσις dapat menunjuk tindakan atau keputusan menghakimi. 'Penghakiman' mempertahankan cakupan itu dan tidak menyempitkannya hanya pada hukuman yang dijatuhkan.
- issue: Aspek ἦλθεν
  choice: telah datang
  alternative: datang
  rationale: Bentuk ini menyampaikan bahwa penghakiman sudah tiba dan akibatnya sedang dihadapi, tanpa menambahkan rincian teologis.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat dengan irama ratapan apokaliptik. Pengulangan 'Celaka, celaka' dipertahankan. Pronomina persona pada 'dialaminya' dan '-mu' mengikuti personifikasi kota sebagai perempuan dalam konteks, meskipun bahasa Indonesia tidak menandai gender.
