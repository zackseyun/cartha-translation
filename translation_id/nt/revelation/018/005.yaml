  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι ἐκολλήθησαν αὐτῆς αἱ ἁμαρτίαι ἄχρι τοῦ οὐρανοῦ, καὶ ἐμνημόνευσεν ὁ θεὸς τὰ ἀδικήματα αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/005.yaml
  text: for her sins have piled up as high as heaven, and God has remembered her wrongdoings.
translation:
  language: id
  text: Sebab dosa-dosanya telah bertumpuk sampai ke surga,[a] dan Allah telah mengingat perbuatan-perbuatan salahnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah menyatu sampai ke surga”; kata kerja Yunani secara harfiah berarti “direkatkan” atau “disatukan” dan di sini menggambarkan dosa yang terkumpul menjadi tumpukan besar.
    reason: lexical_alternative
  - marker: b
    text: 'Dalam konteks ini, “mengingat” mengandung makna yudisial: Allah tidak mengabaikan perbuatan-perbuatan salahnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Menandai alasan bagi perintah pada ayat sebelumnya dan mempertahankan daya kausal teks Yunani.
- source_word: ἐκολλήθησαν
  choice: telah bertumpuk
  rationale: Secara harfiah verba ini berarti direkatkan atau disatukan. Dengan dosa sebagai subjek dan surga sebagai batas, ungkapan ini menggambarkan dosa yang terhimpun menjadi tumpukan menjulang; 'bertumpuk' menyampaikan metafora itu secara alami.
- source_word: αὐτῆς αἱ ἁμαρτίαι
  choice: dosa-dosanya
  rationale: Padanan baku dan langsung yang juga mempertahankan rujukan feminin kepada Babel dalam konteks.
- source_word: ἄχρι τοῦ οὐρανοῦ
  choice: sampai ke surga
  rationale: Mempertahankan batas atau jangkauan vertikal yang dinyatakan ἄχρι dan lebih dekat dengan bentuk Yunani daripada perbandingan 'setinggi surga'.
- source_word: ἐμνημόνευσεν
  choice: telah mengingat
  rationale: Mempertahankan verba 'mengingat' tanpa secara eksplisit menambahkan penghukuman, sekaligus menunjukkan tindakan lampau yang akibat yudisialnya berlaku dalam konteks.
- source_word: ὁ θεός
  choice: Allah
  rationale: Padanan baku bagi sebutan ilahi dalam Alkitab bahasa Indonesia.
- source_word: τὰ ἀδικήματα αὐτῆς
  choice: segala perbuatan jahatnya
  rationale: ἀδικήματα menunjuk pada tindakan salah atau tidak benar. Pilihan ini alami dalam bahasa Indonesia dan membedakannya dari ἁμαρτίαι, tanpa mempersempitnya menjadi kejahatan pidana.
theological_decisions:
- issue: Pembedaan antara ἁμαρτίαι dan ἀδικήματα
  choice: 'Diterjemahkan dengan dua ungkapan berbeda: ''dosa-dosanya'' dan ''segala perbuatan jahatnya''.'
  alternative: Menerjemahkan keduanya sebagai 'dosa' atau 'kesalahan'.
  rationale: Teks Yunani memakai dua istilah yang berkaitan tetapi berbeda. Pembedaan ini mempertahankan kepenuhan retoris teks tanpa memaksakan perbedaan teologis yang terlalu tajam.
- issue: Daya yudisial dari tindakan Allah mengingat
  choice: Mempertahankan 'Allah telah mengingat'.
  alternative: Mengeksplisitkan sebagai 'Allah telah menuntut pertanggungjawaban' atau 'Allah telah membawa ke pengadilan'.
  rationale: Dalam idiom Alkitab, Allah mengingat sering menyiratkan bahwa Ia segera bertindak, khususnya menghakimi dalam konteks ini. Namun, verba Yunani tetap berarti 'mengingat', sehingga terjemahan tidak menyelesaikan ketegangan itu melalui parafrasa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan gambaran vertikal, pembedaan dua istilah moral, dan ungkapan teologis tentang Allah yang mengingat.
