  source_fidelity: 'Terjemahan mengikuti unsur-unsur Yunani dengan tepat: Μετὰ ταῦτα dipertahankan sebagai urutan setelah beberapa hal, ἄλλον ἄγγελον sebagai “seorang malaikat lain,” καταβαίνοντα ἐκ τοῦ οὐρανοῦ sebagai “turun dari surga,” dan ἔχοντα ἐξουσίαν μεγάλην sebagai kepemilikan wewenang besar. “Bumi diterangi oleh kemuliaannya” mempertahankan pasif ἐφωτίσθη dan hubungan sumber/sebab dalam ἐκ τῆς δόξης αὐτοῦ. Pemisahan kalimat tidak mengubah hubungan makna.'
  naturalness: Bahasa Indonesia baku, jelas, dan wajar. “Sesudah semuanya itu” sesuai untuk pembukaan urutan penglihatan yang formal, sedangkan “wewenang yang besar” dan “diterangi oleh kemuliaannya” memiliki register yang tepat bagi kitab Wahyu.
  terminology: “Malaikat,” “surga,” “wewenang,” “bumi,” dan “kemuliaan” digunakan secara konsisten dan tepat. “Wewenang” secara baik membedakan ἐξουσία dari kekuatan fisik belaka. Tidak ada penyisipan kesimpulan tentang keilahian malaikat.
