id: REV.18.1
reference: Revelation 18:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον ἄλλον ἄγγελον καταβαίνοντα ἐκ τοῦ οὐρανοῦ, ἔχοντα ἐξουσίαν μεγάλην, καὶ ἡ γῆ ἐφωτίσθη ἐκ τῆς δόξης αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/001.yaml
  text: After these things I saw another angel coming down out of heaven[a], having great authority[b], and the earth was illuminated by his glory.
translation:
  language: id
  text: Sesudah semuanya itu, aku melihat seorang malaikat lain turun dari surga. Ia memiliki wewenang yang besar, dan bumi diterangi oleh kemuliaannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Sesudah semuanya itu
  rationale: Mempertahankan bentuk jamak ταῦτα dan urutan penglihatan, sekaligus tetap alami dalam bahasa Indonesia.
- source_word: εἶδον
  choice: aku melihat
  rationale: Menerjemahkan aoristus ὁράω secara langsung tanpa menambahkan nuansa yang tidak dinyatakan.
- source_word: ἄλλον ἄγγελον
  choice: seorang malaikat lain
  rationale: Ungkapan alami dalam bahasa Indonesia untuk malaikat lain dalam rangkaian penglihatan.
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: turun dari surga
  rationale: Menyampaikan gerak turun yang berlangsung ketika Yohanes melihatnya; 'dari surga' secara wajar menyatakan asal yang ditandai ἐκ.
- source_word: ἔχοντα ἐξουσίαν μεγάλην
  choice: Ia memiliki wewenang yang besar
  rationale: ἐξουσία terutama menyatakan otoritas, hak, atau kuasa yang diberikan; 'wewenang' membedakannya dari kekuatan belaka.
- source_word: ἡ γῆ
  choice: bumi
  rationale: Gambaran penerangan yang luas mendukung arti kosmis 'bumi', bukan wilayah lokal.
- source_word: ἐφωτίσθη
  choice: diterangi
  rationale: Mempertahankan bentuk pasif dan menggambarkan bumi yang menerima terang.
- source_word: ἐκ τῆς δόξης αὐτοῦ
  choice: oleh kemuliaannya
  rationale: Dalam konstruksi ini ἐκ menunjukkan sumber atau sebab; 'oleh' merupakan ungkapan Indonesia yang alami tanpa menghilangkan gagasan bahwa kemuliaan itu menjadi sumber terang.
theological_decisions:
- issue: Hakikat wewenang dan cahaya kemuliaan malaikat
  choice: Teks menyebut malaikat itu memiliki wewenang besar dan kemuliaannya menerangi bumi, tanpa menyatakan bahwa ia ilahi.
  alternative: Kemuliaan malaikat dapat dipahami secara sangat ditinggikan karena menerangi seluruh bumi.
  rationale: Terjemahan mempertahankan atribusi 'wewenang' dan 'kemuliaan' kepada malaikat sebagaimana dalam bahasa Yunani, tetapi tidak menambahkan identifikasi atau penjelasan teologis yang tidak diberikan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat Yunani yang panjang dibagi menjadi dua kalimat agar jelas bagi pembaca umum, tanpa mengubah hubungan antargagasan. Pronomina 'aku' mengikuti suara narator kitab Wahyu; huruf kecil pada 'kemuliaannya' menghindari penyisipan kesimpulan teologis mengenai identitas malaikat.
