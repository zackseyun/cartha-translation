  terminology: “Linen halus,” “kain ungu,” “sutra,” “perunggu,” dan “pualam” tepat. “Kayu beraroma” secara hati-hati mempertahankan ciri kayu θύϊνον tanpa memaksakan identifikasi botanis; catatan alternatif “kayu tuya” mendukungnya.
