id: REV.18.12
reference: Revelation 18:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: γόμον χρυσοῦ καὶ ἀργύρου καὶ λίθου τιμίου καὶ ⸀μαργαριτῶν καὶ βυσσίνου καὶ ⸀πορφύρας καὶ σιρικοῦ καὶ κοκκίνου, καὶ πᾶν ξύλον θύϊνον καὶ πᾶν σκεῦος ἐλεφάντινον καὶ πᾶν σκεῦος ἐκ ξύλου τιμιωτάτου καὶ χαλκοῦ καὶ σιδήρου καὶ μαρμάρου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/012.yaml
  text: cargo of gold and silver and precious stones and pearls and fine linen and purple cloth and silk and scarlet cloth[a], and every kind of citron wood and every kind of ivory vessel and every kind of vessel made from very precious wood and bronze and iron and marble,
translation:
  language: id
  text: muatan emas, perak, batu-batu berharga, mutiara, linen halus, kain ungu, sutra, kain kirmizi, segala macam kayu beraroma[a], segala macam barang dari gading, segala macam barang dari kayu yang paling berharga, perunggu, besi, dan pualam,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kayu tuya”, sebutan tradisional untuk sejenis kayu mahal yang harum.
    reason: lexical_alternative
lexical_decisions:
- source_word: γόμον
  choice: muatan
  rationale: Istilah ini menunjuk pada muatan atau barang angkutan kapal; bentuk tunggalnya berfungsi secara kolektif dalam daftar perdagangan ini.
- source_word: λίθου τιμίου
  choice: batu-batu berharga
  rationale: Walaupun bentuk Yunani tunggal, bahasa Indonesia secara alami memakai bentuk ulang untuk menyatakan aneka batu mulia dalam daftar barang dagangan.
- source_word: μαργαριτῶν
  choice: mutiara
  rationale: Padanan baku bahasa Indonesia; nomina ini dapat dipahami secara kolektif tanpa pengulangan.
- source_word: βυσσίνου
  choice: linen halus
  rationale: Menunjuk pada kain linen berkualitas tinggi dan mempertahankan nuansa barang mewah.
- source_word: πορφύρας
  choice: kain ungu
  rationale: Kata ini dapat menunjuk pada zat warna, kain, atau pakaian ungu; konteks daftar komoditas mendukung penyebutan kain tanpa menutup sepenuhnya kaitannya dengan warna.
- source_word: σιρικοῦ
  choice: sutra
  rationale: Padanan alami bagi bahan atau barang sutra dalam inventaris perdagangan.
- source_word: κοκκίνου
  choice: kain merah tua
  rationale: Menunjuk pada bahan berwarna kirmizi/merah menyala; 'merah tua' lebih mudah dipahami pembaca umum, sementara 'kain' memperjelas komoditas tekstil.
- source_word: πᾶν ξύλον θύϊνον
  choice: segala macam kayu beraroma
  rationale: Identifikasi spesies θύϊνος tidak sepenuhnya pasti, tetapi kayu mewah yang harum menjadi ciri utamanya; padanan deskriptif menghindari kepastian botanis yang berlebihan.
- source_word: πᾶν σκεῦος ἐλεφάντινον
  choice: segala macam barang dari gading
  rationale: σκεῦος memiliki arti luas, yakni benda, perkakas, atau wadah; 'barang' paling alami dan cukup luas dalam konteks komoditas.
- source_word: πᾶν σκεῦος ἐκ ξύλου τιμιωτάτου
  choice: segala macam barang dari kayu yang sangat berharga
  rationale: Mempertahankan pengulangan struktur serta menyampaikan bentuk superlatif τιμιωτάτου secara alami.
- source_word: χαλκοῦ
  choice: perunggu
  rationale: χαλκός dapat berarti tembaga atau perunggu; perunggu merupakan padanan yang lazim untuk benda-benda logam dalam konteks kuno ini.
- source_word: σιδήρου
  choice: besi
  rationale: Padanan leksikal langsung.
- source_word: μαρμάρου
  choice: pualam
  rationale: Padanan Indonesia yang baku dan bermartabat untuk marmer.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur daftar serta koma penutup dipertahankan karena ayat ini melanjutkan kalimat dari ayat sebelumnya dan berlanjut ke ayat berikutnya. 'Barang' dipilih alih-alih 'bejana' agar keluasan makna σκεῦος tetap terasa secara alami.
