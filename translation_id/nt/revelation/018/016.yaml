  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, ἡ περιβεβλημένη βύσσινον καὶ πορφυροῦν καὶ κόκκινον καὶ ⸀κεχρυσωμένη χρυσίῳ καὶ λίθῳ τιμίῳ καὶ ⸀μαργαρίτῃ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/016.yaml
  text: saying[a], “Woe, woe, the great city, clothed in fine linen and purple and scarlet, and adorned with gold and precious stones and pearls,”
translation:
  language: id
  text: sambil berkata[a], “Celaka, celaka, kota besar itu, yang berpakaian lenan halus, kain ungu, dan kain merah tua, serta berhias emas, batu berharga, dan mutiara,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Aduh, aduh.”
    reason: Alternatif leksikal untuk οὐαὶ οὐαί yang lebih menonjolkan nuansa dukacita; teks utama mempertahankan nada ratapan dan penghakiman profetis.
lexical_decisions:
- source_word: λέγοντες
  choice: sambil berkata
  rationale: Partisipel kini aktif jamak ini mengantar ratapan dan menghubungkannya dengan tindakan para pedagang dalam ayat sebelumnya. Ungkapan ini alami dalam bahasa Indonesia tanpa menambahkan subjek yang tidak dinyatakan di sini.
- source_word: Οὐαὶ οὐαί
  choice: Celaka, celaka
  rationale: Mempertahankan daya ratapan sekaligus nuansa penghukuman profetis. Alternatif “Aduh, aduh” lebih menonjolkan kesedihan dan dicantumkan dalam catatan kaki.
- source_word: ἡ πόλις ἡ μεγάλη
  choice: kota besar itu
  rationale: Susunan berartikel ganda memberi tekanan pada kota tersebut; bentuk Indonesia ini jelas dan alami dalam konteks rujukan kepada Babel.
- source_word: περιβεβλημένη
  choice: berpakaian
  rationale: Partisipel perfektif menggambarkan keadaan kota yang dikenakan pakaian mewah. “Berpakaian” mempertahankan personifikasi kota secara alami.
- source_word: βύσσινον
  choice: lenan halus
  rationale: Menunjuk pada kain lenan bermutu tinggi dan mahal, sehingga unsur kemewahan tetap nyata.
- source_word: πορφυροῦν
  choice: kain ungu
  rationale: Warna ungu melambangkan bahan pakaian mewah; penambahan “kain” membuat deretan bahan pakaian lebih alami dalam bahasa Indonesia.
- source_word: κόκκινον
  choice: kain merah tua
  rationale: Menyampaikan warna merah menyala/tua yang khas bagi κόκκινος tanpa memakai istilah yang kurang umum bagi pembaca modern.
- source_word: κεχρυσωμένη
  choice: berhias
  rationale: Karena verba ini diikuti bersama oleh emas, batu berharga, dan mutiara, “berhias” lebih tepat daripada arti sempit “disepuh” dan tetap menyampaikan kemewahan.
- source_word: χρυσίῳ
  choice: emas
  rationale: Padanan langsung untuk bahan yang digunakan sebagai hiasan.
- source_word: λίθῳ τιμίῳ
  choice: batu-batu berharga
  rationale: Walau bentuk Yunani tunggal, konteks daftar bahan perhiasan memungkinkan makna kolektif; bentuk jamak lebih alami dalam bahasa Indonesia.
- source_word: μαργαρίτῃ
  choice: mutiara-mutiara
  rationale: Bentuk tunggal Yunani berfungsi secara kolektif dalam daftar bahan mewah; bentuk jamak menyampaikan makna ini secara idiomatis.
theological_decisions:
- issue: Nada ratapan atas kejatuhan Babel
  choice: Menerjemahkan οὐαί dengan “Celaka” untuk mempertahankan ratapan dan penghakiman
  alternative: “Aduh” untuk lebih menekankan dukacita
  rationale: Dalam konteks nubuat penghakiman atas Babel, “Celaka” mempertahankan nada profetis-apokaliptis tanpa meniadakan unsur ratapan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Personifikasi kota dipertahankan melalui “berpakaian” dan “berhias”; tanda seru digunakan untuk menampilkan seruan ratapan yang kuat.
