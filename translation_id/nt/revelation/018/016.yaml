    issue: Tanda seru memisahkan “kota besar itu” dari klausa relatif yang menerangkannya.
    rationale: Dalam Yunani, ἡ πόλις ἡ μεγάλη dan περιβεβλημένη ... berada dalam satu rangkaian ujaran. Pemisahan ini menghasilkan fragmen “Kota yang ...” dan mengubah alur sintaksis.
  - severity: low
    issue: Bentuk jamak “batu-batu berharga” dan “mutiara-mutiara” menjauh dari bentuk tunggal sumber.
    rationale: Walaupun jamak kolektif dapat dipahami, bentuk tunggal tanpa pengulangan lebih dekat kepada λίθῳ τιμίῳ dan μαργαρίτῃ serta tetap alami dalam daftar bahan perhiasan.
  - severity: medium
    issue: Catatan kaki menyatakan “sambil meratap,” padahal alternatif yang dimaksud hanya untuk seruan Οὐαὶ οὐαί.
    rationale: λέγοντες berarti “berkata,” bukan “meratap.” Catatan kaki harus menawarkan “Aduh, aduh” sebagai alternatif bagi “Celaka, celaka” tanpa mengubah verba pengantar.
