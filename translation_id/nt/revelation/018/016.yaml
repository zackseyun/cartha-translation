  verdict: revise
  source_fidelity: Teks utama mempertahankan unsur-unsur leksikal pokok dengan baik, tetapi tanda seru setelah “kota besar itu” memutus ujaran Yunani yang masih berlanjut sebagai satu deskripsi kota. Jamak “batu-batu” dan “mutiara-mutiara” juga tidak diperlukan; bentuk tunggal bahasa Indonesia dapat menyatakan daftar bahan perhiasan sebagaimana bentuk tunggal Yunani.
  naturalness: “Kota yang berpakaian ...” setelah tanda seru merupakan fragmen yang kurang mulus dan mengaburkan hubungan relatifnya dengan “kota besar itu.” Susunan “kota besar itu, yang berpakaian ... serta berhias ...” lebih alami sekaligus mempertahankan struktur kalimat yang belum selesai pada akhir ayat.
  terminology: “Lenan halus,” “kain ungu,” “kain merah tua,” “emas,” “batu berharga,” dan “mutiara” sesuai dengan sumber dan register Indonesia baku. “Celaka, celaka” dapat dipertahankan sebagai seruan ratapan-penghakiman. Catatan kaki perlu dibatasi pada alternatif untuk οὐαί, bukan mengubah λέγοντες menjadi “sambil meratap.”
  issues:
