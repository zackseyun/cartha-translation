id: REV.18.6
reference: Revelation 18:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἀπόδοτε αὐτῇ ὡς καὶ αὐτὴ ἀπέδωκεν, καὶ ⸀διπλώσατε ⸀τὰ διπλᾶ κατὰ τὰ ἔργα αὐτῆς· ἐν τῷ ποτηρίῳ ᾧ ἐκέρασεν κεράσατε αὐτῇ διπλοῦν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/006.yaml
  text: Pay her back as she herself has paid back[a], and repay her double according to her works; in the cup that she mixed[b], mix a double portion for her.
translation:
  language: id
  text: Balaslah kepadanya sebagaimana ia sendiri telah membalas, dan berikanlah kepadanya dua kali lipat sesuai dengan perbuatan-perbuatannya.[a] Dalam cawan yang di dalamnya ia telah mencampur minuman, raciklah baginya minuman dengan takaran dua kali lipat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “lipatgandakanlah baginya hal-hal yang berlipat ganda”; ungkapan Yunani ini padat dan kuat secara retoris, serta dapat menekankan pembalasan yang diperberat.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, cawan yang di dalamnya ia telah mencampur atau meracik minuman; gambaran ini kemungkinan menunjuk pada minuman penghukuman yang telah disiapkan.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπόδοτε αὐτῇ
  choice: Balaslah dia
  rationale: Imperatif ini menyatakan pembalasan atau pemberian kembali setimpal; bentuk ini alami dalam bahasa Indonesia dan mempertahankan nada penghukuman.
- source_word: ὡς καὶ αὐτὴ ἀπέδωκεν
  choice: sebagaimana dia sendiri telah membalas
  rationale: Kata 'sendiri' mempertahankan penekanan pada αὐτή, sedangkan 'telah membalas' menunjukkan tindakan terdahulu yang menjadi dasar pembalasan.
- source_word: διπλώσατε τὰ διπλᾶ
  choice: balaslah kepadanya dua kali lipat
  rationale: Ungkapan Yunani bersifat padat dan retoris. Terjemahan ini menyampaikan pembalasan yang digandakan tanpa menghasilkan ungkapan Indonesia yang janggal.
- source_word: κατὰ τὰ ἔργα αὐτῆς
  choice: sesuai dengan perbuatan-perbuatannya
  rationale: Mempertahankan gagasan ukuran pembalasan berdasarkan segala perbuatannya serta nada yudisial teks.
- source_word: ἐν τῷ ποτηρίῳ
  choice: Dalam cawan
  rationale: '''Cawan'' merupakan padanan baku yang mempertahankan citra simbolis kitab Wahyu dan latar profetisnya.'
- source_word: ᾧ ἐκέρασεν
  choice: yang telah diraciknya
  rationale: Kata kerja κεράννυμι menunjuk pada menyiapkan minuman dengan mencampur atau meraciknya; 'meracik' mempertahankan citra itu secara alami.
- source_word: κεράσατε αὐτῇ διπλοῦν
  choice: raciklah baginya dua kali lipat
  rationale: Pengulangan 'raciklah' mempertahankan permainan verbal dari akar Yunani yang sama, sementara 'dua kali lipat' menjaga gambaran takaran yang digandakan.
theological_decisions:
- issue: Sifat perintah untuk pembalasan dua kali lipat
  choice: Mempertahankan gambaran pembalasan yudisial yang digandakan tanpa menentukan bahwa jumlahnya harus dipahami secara matematis harfiah.
  alternative: Menafsirkannya sebagai hukuman kuantitatif yang persis dua kali lipat, atau melunakkannya menjadi keadilan secara umum.
  rationale: Bahasa apokaliptik ini dapat menyatakan intensifikasi retoris sekaligus pembalasan yang terukur. Terjemahan menjaga ketegangan tersebut dan tidak menghapus gambaran 'dua kali lipat'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Imperatif dipertahankan dengan bentuk '-lah'. Pengulangan 'membalas' dan 'meracik' sengaja dijaga untuk mencerminkan repetisi retoris teks Yunani.
