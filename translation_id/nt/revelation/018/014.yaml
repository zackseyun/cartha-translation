id: REV.18.14
reference: Revelation 18:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἡ ὀπώρα ⸂σου τῆς ἐπιθυμίας τῆς ψυχῆς⸃ ἀπῆλθεν ἀπὸ σοῦ, καὶ πάντα τὰ λιπαρὰ καὶ τὰ λαμπρὰ ἀπώλετο ἀπὸ σοῦ, καὶ ⸀οὐκέτι ⸂οὐ μὴ αὐτὰ εὑρήσουσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/014.yaml
  text: And the fruit of your soul’s desire has gone away from you[a], and all the rich and splendid things have perished from you[b], and they will never be found again.
translation:
  language: id
  text: Buah yang didambakan jiwamu[a] telah pergi darimu, dan semua yang mewah dan gemerlap telah lenyap darimu, dan semua itu tidak akan pernah ditemukan lagi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “buah matang yang menjadi dambaan jiwamu.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “mereka tidak akan pernah menemukannya lagi”; bahasa Yunani tidak menyebutkan siapa yang dimaksud dengan “mereka.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὀπώρα
  choice: buah-buahan matang
  rationale: Kata ini menunjuk pada buah, khususnya buah yang telah matang atau buah pada penghujung musim. Bentuk kolektif Indonesia ini sesuai dengan konteks daftar barang dagangan dan tetap mempertahankan gambaran buah.
- source_word: σου τῆς ἐπιθυμίας τῆς ψυχῆς
  choice: yang didambakan jiwamu
  rationale: Ungkapan ini menyampaikan rangkaian genitif Yunani dengan bahasa Indonesia yang wajar, sambil mempertahankan ψυχή sebagai 'jiwa' dan kekuatan hasrat dalam ἐπιθυμία.
- source_word: ἀπῆλθεν ἀπὸ σοῦ
  choice: telah pergi darimu
  rationale: Bentuk ini menyatakan tindakan yang sudah terjadi dengan akibat yang masih berlaku dan mempertahankan unsur pemisahan dalam ἀπό.
- source_word: πάντα τὰ λιπαρὰ
  choice: segala sesuatu yang mewah
  rationale: Dalam konteks kemewahan Babel, λιπαρά menunjuk pada kelimpahan dan kemewahan, bukan hanya makanan berlemak.
- source_word: τὰ λαμπρὰ
  choice: yang gemerlap
  rationale: λαμπρά menggambarkan hal-hal yang berkilau, mencolok, dan megah; 'gemerlap' cocok dengan konteks kemewahan material.
- source_word: ἀπώλετο ἀπὸ σοῦ
  choice: telah lenyap darimu
  rationale: Bentuk intransitif ἀπόλλυμι menyatakan kehilangan atau kebinasaan. 'Lenyap' secara alami mengungkapkan bahwa segala kemewahan itu tidak lagi dimiliki dan tidak dapat dipulihkan.
- source_word: οὐκέτι οὐ μὴ
  choice: tidak akan pernah ... lagi
  rationale: Gabungan penyangkalan ini sangat tegas. Ungkapan Indonesia tersebut menyampaikan finalitasnya tanpa menghasilkan penyangkalan rangkap yang janggal.
- source_word: αὐτὰ εὑρήσουσιν
  choice: semuanya ... ditemukan
  rationale: Kata kerja orang ketiga jamak tidak menyebutkan pelakunya. Bentuk pasif Indonesia menghindari penambahan pelaku tertentu sambil mempertahankan fokus pada lenyapnya barang-barang itu.
theological_decisions:
- issue: Pelaku tersirat dalam εὑρήσουσιν
  choice: 'Diterjemahkan secara pasif: ''semuanya tidak akan pernah ditemukan lagi'''
  alternative: Mereka tidak akan pernah menemukannya lagi
  rationale: Bahasa Yunani memakai orang ketiga jamak tanpa subjek yang dinyatakan dan dapat dipahami secara tak tentu. Bentuk pasif menyampaikan finalitas kehilangan tanpa menentukan siapa yang mencari; catatan kaki mempertahankan bentuk alternatif yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ratapan yang bermartabat. 'Darimu' mempertahankan sapaan orang kedua tunggal kepada Babel. Pengulangan 'darimu' sengaja dipertahankan untuk mencerminkan tekanan retoris teks Yunani.
