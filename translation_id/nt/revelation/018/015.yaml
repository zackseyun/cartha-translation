  naturalness: Kalimat revisi tetap baku dan alami. "Darinya" dan "siksaannya" mengandalkan rujukan Babel yang telah jelas dalam konteks, sedangkan "dari jauh" adalah ungkapan Indonesia yang lazim untuk posisi pengamatan berjarak.
  terminology: '"Pedagang," "barang-barang ini," "siksaan," "menangis," dan "berkabung" tepat bagi ἔμποροι, τούτων, βασανισμός, κλαίοντες, dan πενθοῦντες. Catatan kaki direvisi karena "pedagang semua ini" bukan alternatif yang jelas atau setara bagi konstruksi "pedagang barang-barang ini."'
