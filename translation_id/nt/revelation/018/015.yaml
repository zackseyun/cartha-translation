id: REV.18.15
reference: Revelation 18:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: οἱ ἔμποροι τούτων, οἱ πλουτήσαντες ἀπ’ αὐτῆς, ἀπὸ μακρόθεν στήσονται διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς κλαίοντες καὶ πενθοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/015.yaml
  text: The merchants of these things[a], who became rich from her, will stand far off because of the fear of her torment, weeping and mourning,
translation:
  language: id
  text: Para pedagang barang-barang ini[a], yang menjadi kaya darinya, akan berdiri dari jauh karena takut akan siksaannya, sambil menangis dan berkabung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "para pedagang barang-barang dagangan ini"; frasa ini menunjuk kembali kepada barang-barang mewah yang disebutkan dalam konteks sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔμποροι
  choice: para pedagang
  rationale: Menunjuk kepada orang-orang yang menjalankan perdagangan; 'para pedagang' alami dan tepat dalam konteks ekonomi ini.
- source_word: τούτων
  choice: barang-barang ini
  rationale: Genitif demonstratif ini merujuk kembali kepada daftar komoditas mewah dalam konteks sebelumnya. 'Barang-barang ini' membuat rujukannya jelas tanpa mempersempitnya lebih jauh.
- source_word: πλουτήσαντες
  choice: yang telah menjadi kaya
  rationale: Partisip aoris menunjuk kepada kekayaan yang telah mereka peroleh sebelumnya; bentuk ini mempertahankan gagasan menjadi kaya.
- source_word: ἀπ’ αὐτῆς
  choice: karena perempuan itu
  rationale: ἀπό menandai sumber kekayaan. Dalam bahasa Indonesia, 'karena perempuan itu' menyatakan bahwa dialah sumber atau sarana keuntungan mereka secara alami; 'dari perempuan itu' terasa kurang idiomatis dalam konteks ini.
- source_word: ἀπὸ μακρόθεν
  choice: jauh-jauh
  rationale: Ungkapan ini menggambarkan jarak yang sengaja dipertahankan. 'Jauh-jauh' alami dalam bahasa Indonesia dan menyiratkan keengganan untuk mendekat.
- source_word: στήσονται
  choice: akan berdiri
  rationale: Bentuk futur ini berarti berdiri atau menempatkan diri; 'akan berdiri' mempertahankan gambaran konkret teks.
- source_word: διὰ τὸν φόβον
  choice: karena takut akan
  rationale: διά dengan akusatif menyatakan sebab. Susunan ini lebih alami daripada terjemahan nominal yang kaku.
- source_word: βασανισμοῦ
  choice: siksaan
  rationale: Dalam Wahyu, istilah ini menyatakan penderitaan berat dalam penghukuman. 'Siksaan' mempertahankan intensitasnya tanpa menjabarkan sifat penghukuman melampaui teks.
- source_word: κλαίοντες
  choice: sambil menangis
  rationale: Menunjukkan tindakan menangis yang berlangsung bersamaan dengan berdiri dari jauh.
- source_word: πενθοῦντες
  choice: berkabung
  rationale: Mempertahankan nuansa dukacita atau ratapan dan membedakannya dari tindakan menangis.
theological_decisions:
- issue: Sifat βασανισμός dalam bahasa penghakiman apokaliptik
  choice: Diterjemahkan sebagai 'siksaan' dan tidak diperhalus menjadi kesusahan emosional atau kerugian ekonomi semata.
  alternative: hukuman; penderitaan
  rationale: Konteks langsung membicarakan penghakiman atas Babel, dan pemakaian istilah ini dalam Wahyu menunjukkan penderitaan berat yang bersifat menghukum. Terjemahan mempertahankan bobot penghakiman tanpa menambahkan rincian doktrinal yang tidak dinyatakan ayat ini.
- issue: Rujukan pronomina feminin αὐτῆς
  choice: Dinyatakan sebagai 'perempuan itu' agar personifikasi Babel tetap jelas dalam bahasa Indonesia.
  alternative: dia; Babel
  rationale: Bahasa Indonesia tidak memiliki pronomina feminin gramatikal yang setara dengan αὐτῆς. 'Perempuan itu' mempertahankan personifikasi tanpa mengganti pronomina tersebut langsung dengan nama 'Babel'.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Susunan kalimat mengikuti alur Yunani tetapi diidiomatisasi secukupnya. Pengulangan bunyi pada 'menangis dan berkabung' mempertahankan dua tindakan yang berbeda dalam sumber.
