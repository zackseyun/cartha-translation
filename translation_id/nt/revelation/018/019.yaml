id: REV.18.19
reference: Revelation 18:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἔβαλον χοῦν ἐπὶ τὰς κεφαλὰς αὐτῶν καὶ ⸀ἔκραξαν κλαίοντες καὶ ⸀πενθοῦντες λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, ἐν ᾗ ἐπλούτησαν πάντες οἱ ἔχοντες τὰ πλοῖα ἐν τῇ θαλάσσῃ ἐκ τῆς τιμιότητος αὐτῆς, ὅτι μιᾷ ὥρᾳ ἠρημώθη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/019.yaml
  text: And they threw dust on their heads and cried out[a], weeping and mourning, saying, “Woe, woe, the great city, in which all who had ships on the sea became rich from her wealth[b], because in one hour she has been laid waste.”
translation:
  language: id
  text: Lalu mereka melemparkan debu ke atas kepala mereka dan berseru sambil menangis dan berkabung. Mereka berkata, “Celaka, celaka[a], kota besar itu, yang di dalamnya semua orang yang memiliki kapal di laut menjadi kaya karena kemewahannya[b], sebab dalam satu jam kota itu telah diluluhlantakkan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Aduh, aduh.” Seruan Yunani ini dapat menyatakan ratapan; “Celaka, celaka” mempertahankan juga nuansa penghakiman profetisnya.
    reason: lexical_alternative
  - marker: b
    text: Atau “karena barang-barangnya yang mahal” atau “karena kemegahannya.” Kata Yunani ini dapat menunjuk pada kemahalan, kemegahan, atau sesuatu yang sangat bernilai.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλον χοῦν ἐπὶ τὰς κεφαλὰς αὐτῶν
  choice: mereka menaburkan debu ke atas kepala mereka
  rationale: Mempertahankan gambaran tindakan perkabungan kuno secara jelas dan alami dalam bahasa Indonesia.
- source_word: ἔκραξαν κλαίοντες καὶ πενθοῦντες
  choice: berseru sambil menangis dan berkabung
  rationale: Membedakan seruan keras, tangisan, dan perkabungan sebagai unsur-unsur yang saling berkaitan tetapi tidak identik.
- source_word: Οὐαὶ οὐαί
  choice: Celaka, celaka
  rationale: Mempertahankan nuansa ratapan sekaligus penghakiman profetis dari seruan Yunani.
- source_word: ἐν ᾗ
  choice: Di dalamnya
  rationale: Mengikuti makna lokatif dasar frasa Yunani tanpa menutup kemungkinan bahwa kota itu juga merupakan lingkungan atau sarana kegiatan ekonomi mereka.
- source_word: οἱ ἔχοντες τὰ πλοῖα ἐν τῇ θαλάσσῃ
  choice: semua orang yang mempunyai kapal-kapal di laut
  rationale: Terjemahan dekat yang tidak mempersempit ἔχοντες secara mutlak menjadi kepemilikan legal, meskipun 'mempunyai' merupakan padanan Indonesia yang paling wajar dalam konteks ini.
- source_word: ἐκ τῆς τιμιότητος αὐτῆς
  choice: karena kemewahannya
  rationale: τιμιότης menunjuk pada keadaan yang mahal, bernilai, atau megah; dalam konteks perdagangan, 'kemewahan' menghubungkan nilai barang dan gaya hidup kota dengan keuntungan para pelaut tanpa sekadar mengulang gagasan 'menjadi kaya'.
- source_word: ὅτι μιᾷ ὥρᾳ ἠρημώθη
  choice: Namun, dalam satu jam saja kota itu telah dihancurkan
  rationale: '''Dalam satu jam saja'' menonjolkan kehancuran yang mendadak, sedangkan bentuk pasif perfektif diterjemahkan sebagai keadaan hasil. ''Namun'' menyatakan kontras ratapan yang tersirat dalam konteks; nomina ''kota itu'' memperjelas rujukan feminin Yunani yang tidak dapat dipertahankan secara gramatikal dalam bahasa Indonesia.'
theological_decisions:
- issue: Nuansa seruan Οὐαὶ οὐαί sebagai ratapan dan pengumuman penghakiman
  choice: Celaka, celaka
  alternative: Aduh, aduh
  rationale: '''Celaka'' mempertahankan bobot profetis dan penghakiman, sementara catatan kaki mengakui nuansa ratapan yang juga mungkin.'
- issue: Agen kehancuran dalam bentuk pasif ἠρημώθη
  choice: telah dihancurkan
  alternative: telah menjadi sunyi sepi
  rationale: Bentuk pasif dipertahankan tanpa menyebut agen, sehingga teks tidak secara eksplisit menentukan siapa yang melakukan penghancuran itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan apokaliptis. Pengulangan 'Celaka, celaka' dipertahankan. Satu catatan kaki digunakan untuk menjaga keluasan makna τιμιότης; penandanya muncul dalam teks utama.
