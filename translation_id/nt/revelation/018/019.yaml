revisions:
- from: Lalu mereka menaburkan debu ke atas kepala mereka dan berseru sambil menangis dan berkabung, katanya, “Celaka, celaka, kota besar itu! Di dalamnya semua orang yang mempunyai kapal-kapal di laut menjadi kaya karena kemewahannya[a]. Namun, dalam satu jam saja kota itu telah dihancurkan.”
  to: Lalu mereka melemparkan debu ke atas kepala mereka dan berseru sambil menangis dan berkabung. Mereka berkata, “Celaka, celaka[a], kota besar itu, yang di dalamnya semua orang yang memiliki kapal di laut menjadi kaya karena kemewahannya[b], sebab dalam satu jam kota itu telah diluluhlantakkan.”
  rationale: Revisi mengganti penghubung kontrastif dengan penghubung kausal yang sesuai dengan ὅτι, memperbaiki rujukan subjek jamak dalam pengantar kutipan, dan memilih verba yang lebih dekat dengan ἔβαλον. Bentuk pasif "telah diluluhlantakkan" tetap tidak menentukan agen dan menyampaikan desolasi dalam ἠρημώθη. Catatan kaki ditata ulang agar alternatif bagi οὐαὶ οὐαί dan τιμιότης memiliki jangkar yang jelas.
  reviewer_model: gpt-5.6-terra
