id: REV.18.17
reference: Revelation 18:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι μιᾷ ὥρᾳ ἠρημώθη ὁ τοσοῦτος πλοῦτος. Καὶ πᾶς κυβερνήτης καὶ πᾶς ὁ ἐπὶ τόπον πλέων, καὶ ναῦται καὶ ὅσοι τὴν θάλασσαν ἐργάζονται, ἀπὸ μακρόθεν ἔστησαν
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/017.yaml
  text: for in one hour such great wealth has been laid waste. And every shipmaster, and everyone sailing to a place, and sailors, and as many as work the sea, stood far off
translation:
  language: id
  text: Sebab dalam satu jam saja kekayaan yang begitu besar itu telah dihancurkan. Setiap nakhoda, setiap orang yang berlayar ke suatu tempat[a], para pelaut, dan semua orang yang bekerja di laut berdiri dari kejauhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setiap orang yang berlayar menuju suatu pelabuhan” atau “setiap orang yang berlayar ke mana pun.” Ungkapan Yunani ini agak idiomatis dan mungkin secara luas menunjuk orang-orang yang bepergian melalui laut ke berbagai tujuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Memperkenalkan alasan atau isi ratapan sebelumnya dan menghubungkan ayat ini secara wajar dengan konteks.
- source_word: μιᾷ ὥρᾳ
  choice: dalam satu jam saja
  rationale: Mempertahankan keterangan waktu serta menonjolkan mendadaknya kehancuran; 'saja' mengungkapkan daya tekan yang alami dalam bahasa Indonesia tanpa menentukan apakah durasinya harfiah.
- source_word: ἠρημώθη
  choice: telah dihancurkan
  rationale: Menyampaikan keadaan menjadi rusak dan tandus akibat pembinasaan dalam ungkapan Indonesia yang jelas dan alami.
- source_word: ὁ τοσοῦτος πλοῦτος
  choice: kekayaan yang begitu besar itu
  rationale: Mempertahankan daya intensif dan demonstratif τοσοῦτος serta nada ratapan atas besarnya kekayaan tersebut.
- source_word: πᾶς κυβερνήτης
  choice: setiap nakhoda
  rationale: Dalam konteks kelautan, κυβερνήτης menunjuk orang yang mengemudikan atau memimpin kapal; 'nakhoda' merupakan padanan Indonesia modern yang tepat.
- source_word: πᾶς ὁ ἐπὶ τόπον πλέων
  choice: setiap orang yang berlayar ke suatu tempat
  rationale: Mengikuti ungkapan Yunani yang agak idiomatis tanpa mempersempit kelompok itu menjadi penumpang, pedagang, atau pelaut profesional.
- source_word: ναῦται
  choice: para pelaut
  rationale: Padanan modern dan jelas bagi orang-orang yang bekerja sebagai awak atau pelaut.
- source_word: ὅσοι τὴν θάλασσαν ἐργάζονται
  choice: semua orang yang bekerja di laut
  rationale: Mempertahankan cakupan yang lebih luas daripada pelaut saja, yakni semua yang pekerjaannya berkaitan dengan laut.
- source_word: ἀπὸ μακρόθεν ἔστησαν
  choice: berdiri dari kejauhan
  rationale: 'Mempertahankan gambaran spasial Yunani: mereka mengambil posisi dan tetap terpisah pada jarak jauh.'
theological_decisions:
- issue: Cakupan kelompok-kelompok maritim dalam ratapan atas Babel
  choice: Mempertahankan setiap kelompok sebagai unsur tersendiri dalam daftar
  alternative: Meringkas semuanya sebagai 'semua pelaut' atau menafsirkan kelompok kedua secara khusus sebagai penumpang maupun pedagang
  rationale: Teks Yunani menyusun beberapa kelompok sejajar untuk menggambarkan luasnya dampak ekonomi. Pembedaan ini dipertahankan tanpa menambahkan identitas yang tidak dinyatakan oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur daftar sumber dipertahankan, sedangkan frasa Yunani yang ambigu tentang orang yang berlayar diterjemahkan cukup dekat dengan bentuk sumber dan alternatif idiomatisnya dicatat dalam catatan kaki.
