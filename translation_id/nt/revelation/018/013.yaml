source:
  edition: SBLGNT
  text: καὶ κιννάμωμον ⸂καὶ ἄμωμον⸃ καὶ θυμιάματα καὶ μύρον καὶ λίβανον καὶ οἶνον καὶ ἔλαιον καὶ σεμίδαλιν καὶ σῖτον καὶ ⸂κτήνη καὶ πρόβατα⸃, καὶ ἵππων καὶ ῥεδῶν καὶ σωμάτων, καὶ ψυχὰς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/013.yaml
  text: and cinnamon and spice and incense and perfume and frankincense and wine and olive oil and fine flour and wheat and cattle and sheep[a], and horses and chariots and servants, that is[b], human souls.
translation:
  language: id
  text: juga kayu manis, rempah-rempah[a], dupa, minyak wangi, kemenyan, anggur, minyak zaitun, tepung halus, gandum, ternak, domba, dan kuda, kereta, tubuh-tubuh[b], dan jiwa manusia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: amomum, sejenis tanaman atau rempah aromatik yang mahal.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “tubuh-tubuh”; dalam daftar barang dagangan ini, yang dimaksud ialah manusia yang diperjualbelikan sebagai budak.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κιννάμωμον
  choice: kayu manis
  rationale: Padanan baku dan jelas untuk komoditas aromatik impor ini.
- source_word: ἄμωμον
  choice: rempah-rempah
  rationale: Nama tanaman aromatik yang tepat tidak pasti dan istilah 'amomum' tidak dikenal luas; padanan umum ini mempertahankan sifatnya sebagai komoditas aromatik mahal, dengan alternatif khusus dalam catatan kaki.
- source_word: θυμιάματα
  choice: dupa
  rationale: Dalam daftar perdagangan ini kata tersebut menunjuk pada bahan dupa sebagai komoditas.
- source_word: μύρον
  choice: minyak wangi
  rationale: Menunjuk pada minyak atau salep harum yang mahal; 'minyak wangi' alami dan sesuai konteks kuno.
- source_word: λίβανον
  choice: kemenyan
  rationale: Menunjuk secara khusus pada resin frankincense dan membedakannya dari dupa yang disebut sebelumnya.
- source_word: ἔλαιον
  choice: minyak zaitun
  rationale: Konteks Mediterania menunjuk pada minyak zaitun; penyebutan eksplisit menghindari ambiguitas.
- source_word: σεμίδαλιν
  choice: tepung halus
  rationale: Menunjuk pada tepung bermutu tinggi dan merupakan ungkapan Indonesia yang jelas.
- source_word: σῖτον
  choice: gandum
  rationale: Walaupun dapat berarti biji-bijian, dalam daftar komoditas ini makna khusus 'gandum' paling mungkin.
- source_word: κτήνη
  choice: ternak
  rationale: Kata ini mencakup hewan peliharaan berukuran besar; 'ternak' mempertahankan keluasan maknanya tanpa secara sempit membatasinya pada sapi.
- source_word: πρόβατα
  choice: domba
  rationale: Padanan langsung bagi hewan yang dimaksud.
- source_word: ῥεδῶν
  choice: kereta
  rationale: Menunjuk kendaraan beroda empat; 'kereta' cukup luas untuk mempertahankan ketidakpastian apakah kendaraan itu kereta mewah atau jenis kereta lainnya.
- source_word: σωμάτων
  choice: tubuh-tubuh
  rationale: Menerjemahkan secara harfiah metafora perdagangan budak yang mengejutkan, tanpa diam-diam menggantinya dengan tafsiran 'budak'.
- source_word: ψυχὰς ἀνθρώπων
  choice: nyawa manusia
  rationale: Mempertahankan ungkapan yang membedakan sekaligus mengaitkan tubuh yang diperdagangkan dengan pribadi manusia; 'nyawa' lebih tepat daripada 'jiwa' bila frasa ini menunjuk pada hidup atau diri manusia.
theological_decisions:
- issue: Hubungan σωμάτων dengan ψυχὰς ἀνθρώπων
  choice: tubuh-tubuh, dan nyawa manusia
  alternative: budak, yaitu manusia
  rationale: Susunan Yunani menempatkan kedua unsur dengan καί dan tidak secara eksplisit mengatakan 'yaitu'. Terjemahan mempertahankan koordinasi dan ketegangan retoris teks, sementara catatan menjelaskan konteks perdagangan manusia tanpa meratakan ungkapannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk daftar dipertahankan. 'Tubuh-tubuh' sengaja dipakai meskipun tidak biasa agar gambaran dehumanisasi dalam bahasa Yunani tetap terasa; catatan kaki menjelaskan rujukannya.
