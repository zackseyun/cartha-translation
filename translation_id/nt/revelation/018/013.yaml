  verdict: revise
  source_fidelity: Terjemahan pada umumnya mengikuti daftar komoditas Yunani dengan baik. “Kayu manis,” “dupa,” “minyak wangi,” “kemenyan,” “minyak zaitun,” “tepung halus,” “gandum,” “ternak,” dan “domba” merupakan padanan yang setia. “Kereta” mempertahankan keluasan ῥεδῶν tanpa secara tidak perlu menetapkan jenis kendaraan. Untuk ψυχὰς ἀνθρώπων, “jiwa manusia” lebih dekat dengan istilah dan daya retoris Yunani daripada “nyawa manusia,” yang dalam penggunaan Indonesia lebih mudah dipahami sebagai kehidupan/nyawa yang hilang.
  naturalness: Bahasa daftar ini sudah baku dan jelas. Bentuk “tubuh-tubuh” dapat dipertahankan sebagai pilihan yang disengaja untuk mencerminkan plural harfiah σώματα dan komodifikasi manusia yang mengejutkan dalam teks. Penambahan “dan” sebelum kelompok “kuda, kereta” membuat struktur daftar sedikit lebih mudah diikuti tanpa menambah makna.
  terminology: “Kemenyan” tepat untuk λίβανον, berbeda dari “dupa” bagi θυμιάματα. “Rempah-rempah” merupakan padanan umum yang dapat diterima untuk ἄμωμον; catatan kaki dengan alternatif “amomum” memadai. “Jiwa manusia” mempertahankan ψυχαὶ ἀνθρώπων dan tidak memaksakan pembacaan appositional “yaitu” yang tidak dinyatakan secara eksplisit dalam Yunani.
