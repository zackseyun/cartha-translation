  naturalness: Bahasa umumnya baku dan jelas. ‘Suara lain dari surga yang berkata’ sedikit lebih lancar daripada konstruksi tanpa ‘yang’. Pengulangan ‘supaya kamu tidak’ mempertahankan kesejajaran dua klausa Yunani secara jelas dan tetap alami.
