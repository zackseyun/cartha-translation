id: REV.18.4
reference: Revelation 18:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα ἄλλην φωνὴν ἐκ τοῦ οὐρανοῦ λέγουσαν· ⸀Ἐξέλθατε, ⸂ὁ λαός μου, ἐξ αὐτῆς⸃, ἵνα μὴ συγκοινωνήσητε ταῖς ἁμαρτίαις αὐτῆς, καὶ ἐκ τῶν πληγῶν αὐτῆς ἵνα μὴ λάβητε·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/004.yaml
  text: And I heard another voice from heaven saying[a], “Come out of her, my people, so that you may not share in her sins[b], and so that you may not receive any of her plagues.”
translation:
  language: id
  text: Lalu aku mendengar suara lain dari surga yang berkata, “Keluarlah dari dia, hai umat-Ku, supaya kamu tidak mengambil bagian dalam dosa-dosanya dan supaya kamu tidak menerima satu pun dari tulah-tulahnya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam teks Yunani, kata ganti yang merujuk kepada Babel berbentuk feminin. Bahasa Indonesia tidak membedakan gender pada ‘dia’; penggunaan ‘dia’ di sini mempertahankan personifikasi Babel sebagai sosok, yang dalam kitab ini juga digambarkan sebagai perempuan dan kota.
    reason: cultural_note
lexical_decisions:
- source_word: ἄλλην φωνὴν
  choice: suara lain
  rationale: Menunjukkan suara tambahan yang berbeda dari pembicara sebelumnya, dengan ungkapan Indonesia yang alami.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: dari surga
  rationale: Dalam konteks Wahyu, οὐρανός menunjuk pada ranah surgawi, bukan sekadar langit fisik.
- source_word: Ἐξέλθατε
  choice: Keluarlah
  rationale: Imperatif aoristus jamak ini merupakan seruan langsung agar umat meninggalkan Babel. Bentuk Indonesia ini tidak perlu menentukan sudut pandang ‘datang’ atau ‘pergi’ yang dapat tersirat dalam terjemahan bahasa lain.
- source_word: ὁ λαός μου
  choice: hai umat-Ku
  rationale: Partikel ‘hai’ menyatakan fungsi sapaan secara alami, sedangkan ‘umat-Ku’ mempertahankan nuansa relasi perjanjian.
- source_word: ἐξ αὐτῆς
  choice: dari dia
  rationale: ‘Dia’ mempertahankan personifikasi Babel sebagai sosok, meskipun bahasa Indonesia tidak menandai gender gramatikal.
- source_word: ἵνα μὴ συγκοινωνήσητε ταῖς ἁμαρτίαις αὐτῆς
  choice: supaya kamu tidak mengambil bagian dalam dosa-dosanya
  rationale: ‘Mengambil bagian’ menyampaikan gagasan keterlibatan atau persekutuan dalam perbuatan dosa, tanpa mempersempitnya menjadi sekadar persetujuan.
- source_word: ἐκ τῶν πληγῶν αὐτῆς ἵνα μὴ λάβητε
  choice: dan tidak turut menerima tulah-tulahnya
  rationale: ‘Tulah’ mempertahankan gema penghukuman ilahi dalam Alkitab. ‘Turut menerima’ menyatakan bahwa umat diperingatkan agar tidak mendapat bagian dalam hukuman yang menimpa Babel.
theological_decisions:
- issue: Personifikasi Babel dalam αὐτῆς
  choice: Memakai ‘dia’ dan akhiran ‘-nya’ untuk mempertahankan personifikasi.
  alternative: Memakai ‘kota itu’ atau bentuk netral lain.
  rationale: Teks menggambarkan Babel sekaligus sebagai kota dan sebagai perempuan. Bahasa Indonesia tidak memiliki pronomina feminin, tetapi ‘dia’ tetap mempertahankan personifikasi tanpa menambahkan gender yang tidak dapat ditandai secara alami.
- issue: Hubungan kedua klausa ἵνα μή
  choice: Menyajikannya sebagai dua akibat atau tujuan yang sejajar di bawah ‘supaya’.
  alternative: Menerjemahkan klausa kedua sebagai penjelasan dari klausa pertama.
  rationale: 'Pengulangan ἵνα μή dalam bahasa Yunani mendukung dua peringatan yang sejajar: jangan ikut dalam dosa Babel dan jangan ikut menerima hukumannya.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. ‘Keluarlah’ mempertahankan ketegasan seruan; ‘tulah’ dipilih untuk menjaga hubungan dengan bahasa penghukuman ilahi dalam Alkitab. Sapaan ‘hai umat-Ku’ digunakan agar fungsi vokatif Yunani terdengar jelas tanpa menjadi terlalu arkais.
