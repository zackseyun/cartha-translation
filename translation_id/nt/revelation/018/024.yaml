id: REV.18.24
reference: Revelation 18:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐν αὐτῇ ⸀αἷμα προφητῶν καὶ ἁγίων εὑρέθη καὶ πάντων τῶν ἐσφαγμένων ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/024.yaml
  text: And in her was found the blood of prophets and saints[c][b][a], and of all who have been slaughtered on the earth.
translation:
  language: id
  text: Di dalam dirinya ditemukan darah para nabi dan orang-orang kudus[a], serta darah semua orang yang telah dibantai di bumi.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “umat Allah yang kudus.”
    reason: lexical_alternative
  - marker: b
    text: Atau “semua orang yang telah disembelih di bumi.” Kata Yunani yang dipakai lebih kuat daripada kata umum untuk membunuh dan dapat berarti membantai atau menyembelih.
    reason: lexical_alternative
  - marker: c
    text: Kata “dirinya” merujuk kepada Babel, yang digambarkan sebagai seorang perempuan dalam penglihatan di sekitarnya.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν αὐτῇ
  choice: di dalam dirinya
  rationale: Kata ganti feminin itu merujuk kepada Babel yang digambarkan sebagai perempuan sekaligus kota. Bentuk 'dirinya' mempertahankan personifikasi tersebut.
- source_word: αἷμα
  choice: darah
  rationale: Padanan harfiah dan alami yang dalam konteks ini juga menyiratkan pertanggungjawaban atas penumpahan darah.
- source_word: προφητῶν
  choice: para nabi
  rationale: Padanan baku dan jelas bagi προφῆται.
- source_word: ἁγίων
  choice: orang-orang kudus
  rationale: Dalam Wahyu, istilah ini lazim menunjuk kepada umat Allah yang dikhususkan bagi-Nya. Padanan ini jelas dan tetap mempertahankan istilah tradisional.
- source_word: εὑρέθη
  choice: ditemukan
  rationale: Mempertahankan bentuk pasif serta nuansa penyingkapan atau pembuktian dalam tuduhan penghakiman.
- source_word: πάντων τῶν ἐσφαγμένων
  choice: semua orang yang telah dibantai
  rationale: Kata σφάζω lebih kuat daripada kata umum untuk membunuh dan menggambarkan pembantaian. Bentuk 'telah dibantai' mencerminkan tindakan yang sudah terjadi dengan akibat yang tetap relevan.
- source_word: ἐπὶ τῆς γῆς
  choice: di bumi
  rationale: Dalam cakrawala apokaliptik kitab Wahyu, γῆ di sini paling wajar dipahami sebagai bumi, bukan suatu negeri tertentu.
theological_decisions:
- issue: Rujukan dan cakupan kesalahan Babel
  choice: Teks mempertahankan tuduhan menyeluruh bahwa pada Babel ditemukan darah para nabi, orang-orang kudus, dan semua orang yang telah dibantai di bumi.
  alternative: Klausa terakhir dapat dipahami sebagai bahasa apokaliptik yang hiperbolis atau sebagai pernyataan universal dalam kerangka simbolis penglihatan.
  rationale: Teks Yunani tidak menjelaskan bagaimana simbol itu harus dipetakan secara historis. Karena itu, terjemahan mempertahankan keluasan tuduhan tanpa mempersempitnya.
- issue: Darah sebagai benda yang ditemukan atau metonimia bagi kesalahan menumpahkan darah
  choice: Mengulang kata 'darah' sebelum kelompok terakhir agar hubungan sintaksis dan tuduhannya jelas dalam bahasa Indonesia.
  alternative: 'Kata ''darah'' dapat tidak diulang: ''serta semua orang yang telah dibantai di bumi.'''
  rationale: Dalam bahasa Yunani, genitif pada klausa terakhir tetap bergantung pada αἷμα. Pengulangan 'darah' dalam bahasa Indonesia mencegah kesan bahwa orang-orang itu sendiri ditemukan di dalam Babel, tanpa mengubah isi tuduhan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Personifikasi feminin Babel dipertahankan melalui 'dirinya'. Susunan kalimat dibuat alami, sementara pengulangan 'darah' memperjelas hubungan gramatikal klausa terakhir.
