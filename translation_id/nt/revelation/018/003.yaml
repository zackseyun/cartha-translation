review_pass:
  verdict: revise
  source_fidelity: Teks utama dengan tepat mengikuti bacaan SBLGNT πέπτωκαν, “telah jatuh,” bukan “telah minum.” Hubungan kausal ἐκ dipertahankan dengan “oleh,” dan unsur-unsur berikutnya—raja-raja, para saudagar, kuasa kemewahan, dan menjadi kaya—tetap setia kepada teks Yunani. Jejak audit bahasa Inggris yang menerjemahkan πέπτωκαν sebagai “have drunk” tidak boleh diikuti, karena tidak sesuai dengan bentuk teks sumber yang ditetapkan.
  naturalness: Susunan draft pada umumnya jelas dan bernada baku. Namun, “anggur kemurkaan dari percabulannya” kurang alami dan “dari” cenderung menetapkan hubungan antargenitif sebagai asal-usul. “Anggur murka yang berkaitan dengan percabulannya” lebih wajar dalam bahasa Indonesia modern sambil tidak memutuskan hubungan genitif yang memang dapat dipahami lebih dari satu cara. “Kemewahannya yang melampaui batas” juga lebih idiomatis daripada “kemewahannya yang berlebihan.”
  terminology: “Berbuat cabul,” “saudagar,” “kuasa,” dan “murka” layak bagi register Wahyu dan mempertahankan citra seksual serta ekonomi teks tanpa menggantikannya dengan tafsiran seperti penyembahan berhala. Catatan tekstual untuk πέπωκαν (“telah minum”) relevan; catatan makna metaforis percabulan dan nuansa στρῆνος juga tepat.
  issues:
  - severity: medium
    issue: Frasa “anggur kemurkaan dari percabulannya” secara idiomatis kurang lancar dan “dari” mempersempit relasi genitif Yunani.
    rationale: Rangkaian τοῦ θυμοῦ τῆς πορνείας αὐτῆς memungkinkan lebih dari satu hubungan semantis. Rumusan netral “yang berkaitan dengan” meningkatkan keterbacaan tanpa memaksakan satu analisis.
  - severity: low
    issue: “Kemewahannya yang berlebihan” agak redundan.
    rationale: στρῆνος memang menunjuk kemewahan yang berlebihan atau pemanjaan diri, tetapi “yang melampaui batas” menyampaikan nuansa itu lebih alami.
  revised_text: Sebab semua bangsa telah jatuh oleh anggur murka yang berkaitan dengan percabulannya[a][b]; raja-raja bumi telah berbuat cabul dengannya[c], dan para saudagar bumi menjadi kaya oleh kuasa kemewahannya yang melampaui batas.[d]
