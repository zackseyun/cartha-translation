id: REV.18.3
reference: Revelation 18:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅτι ἐκ τοῦ οἴνου τοῦ θυμοῦ τῆς πορνείας αὐτῆς ⸀πέπτωκαν πάντα τὰ ἔθνη, καὶ οἱ βασιλεῖς τῆς γῆς μετ’ αὐτῆς ἐπόρνευσαν, καὶ οἱ ἔμποροι τῆς γῆς ἐκ τῆς δυνάμεως τοῦ στρήνους αὐτῆς ἐπλούτησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/003.yaml
  text: For all the nations have drunk from the wine of the wrath of her sexual immorality[a], and the kings of the earth committed sexual immorality with her[c][b], and the merchants of the earth grew rich from the power of her luxury.
translation:
  language: id
  text: Sebab semua bangsa telah jatuh oleh anggur murka yang berkaitan dengan percabulannya[a][b]; raja-raja bumi telah berbuat cabul dengannya[c], dan para saudagar bumi menjadi kaya oleh kuasa kemewahannya yang melampaui batas.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah berbunyi “telah minum dari anggur”. Teks Yunani yang dipakai di sini berbunyi “telah jatuh oleh anggur”.
    reason: textual_variant
  - marker: b
    text: Frasa ini juga dapat dipahami sebagai “anggur nafsu yang menyala yang berkaitan dengan percabulannya”. Rangkaian bentuk kepunyaan dalam bahasa Yunani dapat dihubungkan dengan lebih dari satu cara, dan θυμός dapat berarti “murka” atau “nafsu yang menyala”.
    reason: lexical_alternative
  - marker: c
    text: Bahasa percabulan di sini kemungkinan besar berfungsi sebagai metafora untuk persekutuan yang rusak, penyembahan berhala, dan eksploitasi; terjemahan mempertahankan citra seksual bahasa Yunani.
    reason: alternative_reading
  - marker: d
    text: Kata Yunani ini menunjuk pada kemewahan yang angkuh dan pemanjaan diri yang melampaui batas, bukan sekadar kenyamanan atau kelimpahan materi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sebab
  rationale: Menandai alasan bagi pengumuman sebelumnya tentang jatuhnya Babel.
- source_word: ἐκ τοῦ οἴνου
  choice: karena anggur
  rationale: Dengan πέπτωκαν, ἐκ paling wajar menyatakan sumber atau sebab kejatuhan, sambil mempertahankan gambaran anggur.
- source_word: θυμοῦ
  choice: kemurkaan
  rationale: θυμός dapat berarti kemurkaan atau nafsu yang menyala; dalam konteks penghakiman kitab Wahyu, 'kemurkaan' cocok, sementara ambiguitasnya dicatat.
- source_word: πορνείας
  choice: percabulannya
  rationale: Mempertahankan gambaran seksual yang kuat dan dapat mencakup makna metaforis berupa ketidaksetiaan, penyembahan berhala, dan persekutuan yang rusak.
- source_word: πέπτωκαν
  choice: telah jatuh
  rationale: Bentuk yang diberikan dalam teks SBLGNT berasal dari πίπτω, 'jatuh', bukan πέπωκαν dari πίνω, 'minum'. Bentuk perfektum diterjemahkan sebagai keadaan yang dihasilkan oleh tindakan lampau.
- source_word: πάντα τὰ ἔθνη
  choice: semua bangsa
  rationale: Merujuk secara kolektif kepada bangsa-bangsa yang berada di bawah pengaruh Babel.
- source_word: μετ’ αὐτῆς ἐπόρνευσαν
  choice: telah berbuat cabul dengannya
  rationale: Mempertahankan hubungan leksikal dengan πορνεία dan citra seksual teks Yunani tanpa langsung menggantinya dengan tafsiran metaforis.
- source_word: ἔμποροι
  choice: para saudagar
  rationale: Istilah alami dan bermartabat untuk pedagang besar dalam konteks perdagangan barang-barang mewah.
- source_word: ἐκ τῆς δυνάμεως
  choice: oleh kuasa
  rationale: Mempertahankan arti dasar δύναμις sebagai daya atau kuasa yang menghasilkan kekayaan, bukan menafsirkannya hanya sebagai jumlah kekayaan.
- source_word: στρήνους
  choice: kemewahannya yang berlebihan
  rationale: στρῆνος menunjuk pada kemewahan yang angkuh, memanjakan diri, dan melampaui batas, bukan sekadar kenyamanan material.
- source_word: ἐπλούτησαν
  choice: menjadi kaya
  rationale: Ungkapan Indonesia yang alami untuk hasil pengayaan secara komersial.
theological_decisions:
- issue: Apakah πορνεία dan πορνεύω harus diterjemahkan langsung sebagai penyembahan berhala atau persekutuan politik-ekonomi yang rusak
  choice: Mempertahankan bahasa percabulan dalam teks utama
  alternative: penyembahan berhala; ketidaksetiaan rohani; persekutuan yang rusak
  rationale: Kitab Wahyu sengaja memakai citra seksual yang dapat memuat beberapa lapisan makna. Terjemahan tidak membatasi metafora itu pada satu penafsiran teologis.
- issue: Apakah πέπτωκαν harus diselaraskan dengan metafora minum anggur
  choice: Menerjemahkan bentuk teks sumber sebagai 'telah jatuh'
  alternative: telah minum
  rationale: Teks Yunani yang diberikan membaca πέπτωκαν, bentuk dari πίπτω. Meskipun bacaan 'telah minum' menghasilkan metafora yang lebih lazim dan terdapat dalam tradisi tekstual, terjemahan utama mengikuti edisi sumber yang ditentukan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. 'Saudagar' dipilih untuk konteks perdagangan internasional dan barang mewah; 'berbuat cabul' mempertahankan citra tajam teks tanpa memakai istilah klinis. Susunan kalimat dijaga jelas meskipun bacaan 'telah jatuh karena anggur' sengaja mempertahankan ketegangan metaforis dalam teks sumber.
