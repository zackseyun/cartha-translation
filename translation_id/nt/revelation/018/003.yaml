revisions:
- from: Sebab semua bangsa telah jatuh karena anggur kemurkaan dari percabulannya[a][b]; raja-raja bumi telah berbuat cabul dengannya[c], dan para saudagar bumi menjadi kaya oleh kuasa kemewahannya yang berlebihan.[d]
  to: Sebab semua bangsa telah jatuh oleh anggur murka yang berkaitan dengan percabulannya[a][b]; raja-raja bumi telah berbuat cabul dengannya[c], dan para saudagar bumi menjadi kaya oleh kuasa kemewahannya yang melampaui batas.[d]
  rationale: Revisi terbatas pada kelancaran bahasa Indonesia dan pemeliharaan ambiguitas rangkaian genitif. Terjemahan tetap mengikuti πέπτωκαν dalam SBLGNT sebagai “telah jatuh”; bacaan alternatif “telah minum” tetap dicatat, bukan dijadikan teks utama.
