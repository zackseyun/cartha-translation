id: REV.18.7
reference: Revelation 18:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὅσα ἐδόξασεν αὑτὴν καὶ ἐστρηνίασεν, τοσοῦτον δότε αὐτῇ βασανισμὸν καὶ πένθος. ὅτι ἐν τῇ καρδίᾳ αὐτῆς λέγει ὅτι Κάθημαι βασίλισσα, καὶ χήρα οὐκ εἰμί, καὶ πένθος οὐ μὴ ἴδω.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/007.yaml
  text: As much as she glorified herself and lived in luxury[a], give her that much torment and mourning. For she says in her heart, ‘I sit as a queen, and I am not a widow[b], and I will certainly never see mourning.’
translation:
  language: id
  text: Seberapa besar ia memuliakan dirinya dan hidup bermewah-mewah[a], sebesar itu pula berikanlah kepadanya siksaan dan perkabungan. Sebab dalam hatinya ia berkata, “Aku duduk sebagai ratu; aku bukan janda, dan aku sama sekali tidak akan mengalami perkabungan[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hidup dengan memanjakan diri” atau “hidup dalam kenikmatan hawa nafsu.” Kata kerja Yunani ini dapat menunjuk pada kehidupan mewah, berlebihan, dan menuruti keinginan diri.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “sama sekali tidak akan mengalami perkabungan” memakai bentuk penyangkalan Yunani yang sangat tegas dan menyatakan keyakinannya bahwa perkabungan tidak mungkin menimpanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσα ... τοσοῦτον
  choice: Sebanyak ... sebanyak itu pula
  rationale: Mempertahankan struktur korelatif Yunani yang menyatakan pembalasan setimpal, dengan ungkapan yang wajar dalam bahasa Indonesia.
- source_word: ἐδόξασεν αὑτὴν
  choice: ia memuliakan dirinya sendiri
  rationale: Mempertahankan unsur refleksif dan gagasan peninggian diri yang dinyatakan secara eksplisit.
- source_word: ἐστρηνίασεν
  choice: hidup bermewah-mewah
  rationale: Menyampaikan kehidupan mewah dan memanjakan diri tanpa mempersempit makna menjadi sensualitas seksual.
- source_word: δότε αὐτῇ
  choice: berikanlah kepadanya
  rationale: Menerjemahkan imperatif secara langsung dan sesuai dengan nada penghukuman.
- source_word: βασανισμὸν
  choice: siksaan
  rationale: Menyatakan penderitaan berat akibat penghakiman tanpa membatasinya hanya pada penyiksaan fisik.
- source_word: πένθος
  choice: perkabungan
  rationale: Menjaga pengulangan istilah yang menunjuk pada dukacita akibat kehilangan atau penghakiman.
- source_word: ἐν τῇ καρδίᾳ αὐτῆς λέγει
  choice: dalam hatinya ia berkata
  rationale: Mempertahankan idiom alkitabiah tentang keyakinan dan perkataan batin.
- source_word: Κάθημαι βασίλισσα
  choice: Aku duduk sebagai ratu
  rationale: Mempertahankan gambaran posisi kerajaan dan rasa aman yang angkuh tanpa menambahkan kata 'bertakhta' yang tidak eksplisit.
- source_word: χήρα οὐκ εἰμί
  choice: aku bukan janda
  rationale: Terjemahan langsung yang mempertahankan citra perempuan yang merasa tidak akan kehilangan atau ditinggalkan.
- source_word: οὐ μὴ ἴδω
  choice: aku sama sekali tidak akan mengalami
  rationale: Menangkap penyangkalan Yunani yang tegas; 'mengalami' menyampaikan idiom 'melihat perkabungan' secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Personifikasi Babel sebagai perempuan, ratu, dan janda
  choice: Mempertahankan rujukan feminin melalui 'ia', 'ratu', dan 'janda'.
  alternative: Mengubahnya menjadi kota atau sistem ekonomi yang impersonal.
  rationale: Teks Yunani secara konsisten mempersonifikasikan Babel sebagai perempuan; citra ini penting bagi daya sastra dan teologis ayat tersebut.
- issue: Bahasa penghakiman dalam βασανισμός
  choice: Menggunakan 'siksaan'.
  alternative: Penyiksaan; penderitaan.
  rationale: '''Siksaan'' mempertahankan beratnya pembalasan dalam penghakiman tanpa menentukan mekanisme yang tidak dinyatakan oleh teks.'
- issue: Kekuatan penyangkalan οὐ μή
  choice: Menggunakan 'sama sekali tidak akan' dalam teks utama.
  alternative: Tidak akan pernah.
  rationale: Ungkapan ini mempertahankan keyakinan angkuh dan sangat tegas bahwa perkabungan tidak mungkin dialaminya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada agung dan profetis. Struktur pembalasan setimpal serta personifikasi feminin dipertahankan, sementara idiom Yunani yang kurang alami dialihkan secara jelas tanpa menghilangkan penekanannya.
