id: REV.4.11
reference: Revelation 4:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἄξιος εἶ, ὁ κύριος καὶ ὁ θεὸς ⸀ἡμῶν, λαβεῖν τὴν δόξαν καὶ τὴν τιμὴν καὶ τὴν δύναμιν, ὅτι σὺ ἔκτισας ⸀τὰ πάντα, καὶ διὰ τὸ θέλημά σου ἦσαν καὶ ἐκτίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/011.yaml
  text: You are worthy[a], our Lord and God, to receive the glory and the honor and the power, because you created all things[b], and by your will they existed and were created.
translation:
  language: id
  text: Layaklah Engkau[a], ya Tuhan dan Allah kami, menerima kemuliaan, kehormatan, dan kuasa, sebab Engkaulah yang menciptakan segala sesuatu, dan karena kehendak-Mu[b] semuanya ada dan diciptakan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Engkau layak.” Bahasa Yunani menempatkan kata “layak” di awal untuk memberi penekanan.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “oleh kehendak-Mu.” Frasa Yunani ini terutama dapat menyatakan sebab (“karena”), tetapi juga mungkin dipahami dengan nuansa sarana (“oleh”).
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄξιος εἶ
  choice: Layaklah Engkau
  rationale: Menempatkan predikat ‘layak’ di depan mengikuti penekanan urutan kata Yunani, sedangkan partikel -lah memberi nuansa pernyataan pujian yang wajar dan khidmat dalam bahasa Indonesia.
- source_word: ὁ κύριος καὶ ὁ θεὸς ἡμῶν
  choice: ya Tuhan dan Allah kami
  rationale: Rangkaian nomina berartikel ini berfungsi sebagai sapaan langsung dalam konteks penyembahan. ‘Ya’ menandai sapaan secara alami tanpa menambah isi teologis.
- source_word: λαβεῖν
  choice: menerima
  rationale: Infinitif ini menyatakan apa yang layak diterima oleh pihak yang disapa; ‘menerima’ paling sesuai dengan konteks pujian dan penyembahan.
- source_word: τὴν δόξαν καὶ τὴν τιμὴν καὶ τὴν δύναμιν
  choice: kemuliaan, kehormatan, dan kuasa
  rationale: Ketiga unsur dipertahankan secara terpisah. Pengulangan artikel Yunani tidak perlu ditiru karena bahasa Indonesia tidak memiliki artikel definit yang setara, sementara irama tiga serangkai tetap terjaga.
- source_word: ὅτι σὺ ἔκτισας τὰ πάντα
  choice: sebab Engkaulah yang menciptakan segala sesuatu
  rationale: ‘Sebab’ menyatakan alasan bagi kelayakan Allah. Bentuk ‘Engkaulah’ mencerminkan penekanan pada σὺ, dan ‘segala sesuatu’ menyampaikan cakupan menyeluruh τὰ πάντα.
- source_word: διὰ τὸ θέλημά σου
  choice: karena kehendak-Mu
  rationale: διά dengan akusatif terutama menyatakan sebab atau alasan. ‘Karena kehendak-Mu’ mempertahankan nuansa kausal, sementara kemungkinan nuansa sarana dicatat dalam catatan kaki.
- source_word: ἦσαν καὶ ἐκτίσθησαν
  choice: semuanya ada dan diciptakan
  rationale: Kedua verba dipertahankan, tanpa meleburkan keadaan keberadaan dan tindakan penciptaan. ‘Ada’ merupakan padanan ringkas dan alami bagi ἦσαν dalam konteks ini.
theological_decisions:
- issue: Sapaan kepada Dia yang duduk di takhta
  choice: ya Tuhan dan Allah kami
  alternative: Tuhan dan Allah kami
  rationale: Konteks ibadah menunjukkan bahwa gelar tersebut merupakan sapaan langsung. Penambahan ‘ya’ hanya memperjelas fungsi vokatif dalam bahasa Indonesia dan tidak menentukan identitas pembicara atau menambahkan rumusan doktrinal.
- issue: Hubungan kehendak Allah dengan keberadaan dan penciptaan segala sesuatu
  choice: karena kehendak-Mu
  alternative: oleh kehendak-Mu
  rationale: 'Pilihan utama mempertahankan kekuatan kausal yang lazim dari διά dengan akusatif: kehendak Allah menjadi alasan segala sesuatu ada dan diciptakan. Alternatif instrumental tetap mungkin dan dicatat tanpa menyelesaikan ketegangan secara dogmatis.'
- issue: Hubungan antara ἦσαν dan ἐκτίσθησαν
  choice: ada dan diciptakan
  alternative: menjadi ada dan diciptakan
  rationale: Terjemahan mempertahankan dua bentuk verbal yang terdapat dalam teks, meskipun hubungan tepat antara keberadaan dan penciptaan tidak dijelaskan lebih lanjut. Pilihan ini menghindari penyatuan keduanya menjadi satu gagasan metafisik.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Kapitalisasi pronomina ilahi mengikuti konvensi umum penerbitan Alkitab Indonesia. Diksi mempertahankan irama doksologis tanpa menjadi arkais.
