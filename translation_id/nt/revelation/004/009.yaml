  text: καὶ ὅταν ⸀δώσουσιν τὰ ζῷα δόξαν καὶ τιμὴν καὶ εὐχαριστίαν τῷ καθημένῳ ἐπὶ ⸂τῷ θρόνῳ⸃, τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/009.yaml
  text: And whenever the living creatures give glory and honor and thanksgiving to the one seated on the throne[a], to the one who lives forever and ever,
translation:
  language: id
  text: Setiap kali makhluk-makhluk hidup itu memberikan kemuliaan, hormat, dan ucapan syukur kepada Dia yang duduk di atas takhta dan yang hidup selama-lamanya[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “sampai kepada zaman-zaman dari zaman-zaman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: setiap kali
  rationale: Bersama bentuk verba yang berorientasi ke depan, kata penghubung ini menyatakan waktu yang tidak tertentu dan berulang; “setiap kali” menangkap tindakan berulang dalam penglihatan tersebut.
- source_word: δώσουσιν
  choice: memberikan
  rationale: Padanan ini mempertahankan arti biasa δίδωμι tanpa mempersempitnya menjadi “mempersembahkan” atau menafsirkannya sebagai “mengakui”.
- source_word: τὰ ζῷα
  choice: makhluk-makhluk hidup itu
  rationale: Istilah ini menunjuk kepada makhluk di sekitar takhta yang telah diperkenalkan sebelumnya, bukan kepada binatang biasa. Kata “itu” menandai rujukan yang sudah dikenal, sedangkan angka empat tidak ditambahkan karena tidak muncul dalam ayat ini.
- source_word: δόξαν
  choice: kemuliaan
  rationale: Dalam konteks doksologis, “kemuliaan” merupakan padanan langsung yang mempertahankan apa yang diberikan kepada Dia yang bertakhta, bukan sekadar tindakan memuji.
- source_word: τιμήν
  choice: hormat
  rationale: “Hormat” adalah padanan alami dalam bahasa Indonesia dan membentuk rangkaian yang jelas bersama “kemuliaan” dan “ucapan syukur”.
- source_word: εὐχαριστίαν
  choice: ucapan syukur
  rationale: Pilihan ini menyatakan tindakan syukur yang diungkapkan dan mempertahankan bentuk nominal dalam rangkaian tiga unsur.
- source_word: τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: kepada Dia yang duduk di atas takhta
  rationale: Ungkapan ini mempertahankan gambaran partisipial tentang sosok yang bertakhta dalam bentuk yang alami dan bermartabat dalam bahasa Indonesia.
- source_word: τῷ ζῶντι
  choice: yaitu Dia yang hidup
  rationale: “Yaitu” memperjelas bahwa frasa ini menerangkan sosok yang sama, sesuai hubungan aposisional dalam bahasa Yunani, tanpa menambahkan sebutan “Allah” yang tidak terdapat dalam ayat.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: selama-lamanya
  rationale: Ini adalah padanan Indonesia yang alami bagi ungkapan idiomatis tentang keberlangsungan tanpa akhir; bentuk yang lebih harfiah dicatat dalam catatan kaki.
theological_decisions:
- issue: Penyebutan sosok ilahi yang bertakhta tanpa menambahkan identitas yang tidak dinyatakan
  choice: kepada Dia yang duduk di atas takhta, yaitu Dia yang hidup selama-lamanya
  alternative: kepada Allah yang duduk di atas takhta dan hidup selama-lamanya
  rationale: Teks Yunani mengenali sosok tersebut melalui takhta dan kehidupan kekal, tetapi tidak secara eksplisit memakai kata “Allah” dalam ayat ini. Terjemahan mempertahankan struktur itu dan tidak memasukkan penjelasan teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan ayat dibiarkan berakhir dengan koma karena ayat ini merupakan anak kalimat yang berlanjut ke ayat 10. Penanda catatan kaki ditempatkan setelah frasa yang dijelaskannya.
