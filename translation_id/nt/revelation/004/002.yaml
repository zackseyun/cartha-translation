id: REV.4.2
reference: Revelation 4:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸀εὐθέως ἐγενόμην ἐν πνεύματι· καὶ ἰδοὺ θρόνος ἔκειτο ἐν τῷ οὐρανῷ, καὶ ἐπὶ τὸν θρόνον καθήμενος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/002.yaml
  text: Immediately I was in the Spirit[a], and behold, a throne stood in heaven, and one seated on the throne,
translation:
  language: id
  text: Seketika itu juga aku berada dalam Roh[a]; dan lihatlah, sebuah takhta berdiri di surga, dan seorang duduk di atas takhta itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dalam roh.” Ungkapan Yunani ini tidak memakai kata sandang dan dapat merujuk kepada Roh Kudus atau kepada keadaan rohani/penglihatan.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως
  choice: Seketika itu juga
  rationale: Menandai peralihan yang langsung dan mendadak; ungkapan ini alami dalam bahasa Indonesia modern.
- source_word: ἐγενόμην ἐν πνεύματι
  choice: aku dikuasai oleh Roh
  rationale: Mengungkapkan masuknya Yohanes ke dalam keadaan penglihatan profetis dengan bahasa Indonesia yang alami, sambil mempertahankan kemungkinan bahwa Roh Kuduslah pelakunya; ambiguitas frasa Yunani dicatat dalam catatan kaki.
- source_word: ἰδοὺ
  choice: Lihatlah
  rationale: Partikel pengarah perhatian ini dipertahankan untuk membawa pembaca langsung kepada pemandangan apokaliptik.
- source_word: θρόνος ἔκειτο
  choice: sebuah takhta berdiri
  rationale: Takhta baru diperkenalkan, sehingga 'sebuah' wajar; 'berdiri' menyampaikan bahwa takhta itu berada atau terpasang di tempatnya.
- source_word: ἐν τῷ οὐρανῷ
  choice: di surga
  rationale: Konteksnya adalah ranah surgawi, bukan langit atmosferis.
- source_word: ἐπὶ τὸν θρόνον καθήμενος
  choice: ada Dia yang duduk di atas takhta itu
  rationale: Partisip substantival menyebut sosok yang duduk tanpa menamai-Nya. 'Dia' mempertahankan keagungan dan ketidaktersuratan identitas, sedangkan 'ada' melengkapi konstruksi eliptis Yunani secara alami.
theological_decisions:
- issue: Apakah ἐν πνεύματι menunjuk kepada Roh Kudus atau keadaan rohani/penglihatan
  choice: dikuasai oleh Roh
  alternative: berada dalam roh
  rationale: Dalam Wahyu, frasa ini berfungsi sebagai penanda pengalaman penglihatan profetis dan kemungkinan besar melibatkan Roh Kudus. Namun, karena πνεύματι tidak memakai artikel dan dapat menggambarkan keadaan rohani, alternatif tersebut dipertahankan dalam catatan kaki.
- issue: Identitas sosok yang duduk di atas takhta
  choice: Dia yang duduk
  alternative: seseorang yang duduk
  rationale: Teks Yunani tidak menyebut nama atau kata ganti eksplisit, tetapi konteks dan gaya penglihatan memberi sosok itu keagungan. Huruf kapital tidak menambahkan nama, sedangkan catatan keputusan mengakui bentuk Yunani yang tidak menentukan identitas secara leksikal.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kalimat dipecah setelah pengalaman Yohanes agar pemandangan baru yang diperkenalkan oleh ἰδοὺ tampil kuat dan alami.
