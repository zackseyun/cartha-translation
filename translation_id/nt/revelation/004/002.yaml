revisions:
- from: Seketika itu juga aku dikuasai oleh Roh[a]. Lihatlah, sebuah takhta berdiri di surga, dan ada Dia yang duduk di atas takhta itu.
  to: Seketika itu juga aku berada dalam Roh[a]; dan lihatlah, sebuah takhta berdiri di surga, dan seorang duduk di atas takhta itu.
  rationale: Revisi mengganti parafrasa kausatif “dikuasai oleh” dengan padanan yang tidak menambahkan agen dan tetap memungkinkan kedua pembacaan πνεύματι. Sosok di atas takhta dinyatakan secara tak tentu, sesuai dengan partisip substantival tanpa nama atau kata ganti dalam bahasa Yunani. Unsur-unsur lain—kesegeraan, seruan untuk memperhatikan, takhta yang berada di surga, dan rujukan kembali kepada takhta—dipertahankan.
