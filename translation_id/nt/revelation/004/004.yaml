id: REV.4.4
reference: Revelation 4:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ κυκλόθεν τοῦ θρόνου ⸀θρόνοι εἴκοσι τέσσαρες, καὶ ἐπὶ τοὺς ⸀θρόνους εἴκοσι τέσσαρας πρεσβυτέρους καθημένους περιβεβλημένους ⸀ἐν ἱματίοις λευκοῖς, καὶ ἐπὶ τὰς κεφαλὰς αὐτῶν στεφάνους χρυσοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/004.yaml
  text: And around the throne were twenty-four thrones[a], and on the thrones were seated twenty-four elders, clothed in white garments, and on their heads were golden crowns.
translation:
  language: id
  text: Di sekeliling takhta itu ada dua puluh empat takhta, dan di atas takhta-takhta itu duduk dua puluh empat tua-tua yang mengenakan pakaian putih. Di atas kepala mereka ada mahkota-mahkota emas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, karangan bunga kemenangan. Kata Yunani yang dipakai dapat menunjuk mahkota atau karangan yang dianugerahkan sebagai tanda kehormatan atau kemenangan, bukan hanya mahkota kerajaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: κυκλόθεν
  choice: di sekeliling
  rationale: Menunjukkan susunan yang mengitari takhta pusat dan menghasilkan gambaran ruang yang jelas dalam bahasa Indonesia.
- source_word: θρόνοι
  choice: takhta
  rationale: Kata Yunani yang sama dipakai untuk takhta pusat dan kedua puluh empat takhta di sekitarnya; padanan ini mempertahankan kaitan leksikal serta citra kerajaan atau pengadilan.
- source_word: εἴκοσι τέσσαρες
  choice: dua puluh empat
  rationale: Padanan baku bagi bilangan tersebut dalam bahasa Indonesia.
- source_word: ἐπὶ τοὺς θρόνους
  choice: di atas takhta-takhta itu
  rationale: Dalam konteks ini menyatakan tempat orang-orang itu duduk; bentuk ulang sesuai kaidah bahasa Indonesia dan penunjuk 'itu' membuat rujukannya jelas.
- source_word: πρεσβυτέρους
  choice: tua-tua
  rationale: Istilah ini mempertahankan sebutan bagi kelompok surgawi tersebut tanpa sekadar menggambarkan mereka sebagai orang berusia lanjut dan tanpa menentukan identitas mereka lebih jauh.
- source_word: καθημένους
  choice: duduk
  rationale: Menyampaikan keadaan atau posisi mereka secara alami dan ringkas dalam konstruksi bahasa Indonesia.
- source_word: περιβεβλημένους
  choice: yang mengenakan
  rationale: Partisip perfektum menggambarkan mereka dalam keadaan berpakaian; padanan ini alami dan tetap bernada khidmat.
- source_word: ἐν ἱματίοις λευκοῖς
  choice: pakaian putih
  rationale: ἱμάτια berarti pakaian secara umum; 'pakaian' tidak mempersempit maknanya menjadi jubah.
- source_word: στεφάνους
  choice: mahkota
  rationale: Padanan yang paling jelas dalam konteks ruang takhta, sementara kemungkinan nuansa karangan kehormatan atau kemenangan dipertahankan dalam catatan kaki.
- source_word: χρυσοῦς
  choice: emas
  rationale: Bentuk atributif 'mahkota emas' merupakan ungkapan Indonesia yang ringkas dan alami.
theological_decisions:
- issue: Sifat kedua puluh empat θρόνοι yang mengelilingi takhta pusat
  choice: Diterjemahkan 'takhta', bukan 'tempat duduk'.
  alternative: '''Tempat duduk'' dapat dipakai untuk menghindari kesan bahwa para tua-tua memiliki kedaulatan yang setara dengan Dia yang duduk di takhta pusat.'
  rationale: Teks Yunani mengulangi kata θρόνος. Mempertahankan 'takhta' menjaga citra kerajaan atau pengadilan tanpa menyamakan kedudukannya dengan takhta pusat, yang tetap menonjol dalam konteks.
- issue: Identitas kedua puluh empat tua-tua
  choice: Dibiarkan sebagai 'tua-tua' tanpa penjelasan interpretatif.
  alternative: Mereka pernah dipahami sebagai wakil jemaat, makhluk malaikat, atau gabungan wakil Israel dan para rasul.
  rationale: Ayat ini menyebut mereka πρεσβύτεροι tetapi tidak menjelaskan identitas mereka; terjemahan tidak seharusnya menetapkan salah satu tafsiran teologis.
- issue: Nuansa στεφάνους
  choice: Diterjemahkan 'mahkota' dengan catatan mengenai kemungkinan makna karangan kehormatan atau kemenangan.
  alternative: Diterjemahkan langsung sebagai 'karangan bunga kemenangan' atau 'mahkota kemenangan'.
  rationale: Konteks takhta mendukung padanan umum 'mahkota', tetapi kata Yunani itu bukan διάδημα dan dapat menunjuk karangan yang dianugerahkan sebagai tanda kehormatan atau kemenangan; ambiguitas ini perlu dipertahankan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. Susunan kalimat mempertahankan gambaran takhta pusat yang dikelilingi dua puluh empat takhta. Kalimat terakhir dipisahkan agar alurnya mudah dibaca tanpa mengubah hubungan antargagasan.
