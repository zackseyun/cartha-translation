id: REV.4.8
reference: Revelation 4:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ τὰ τέσσαρα ζῷα, ἓν ⸂καθ’ ἓν⸃ ⸀αὐτῶν ⸀ἔχων ἀνὰ πτέρυγας ἕξ, κυκλόθεν καὶ ἔσωθεν γέμουσιν ὀφθαλμῶν· καὶ ἀνάπαυσιν οὐκ ἔχουσιν ἡμέρας καὶ νυκτὸς λέγοντες· Ἅγιος ἅγιος ἅγιος κύριος, ὁ θεός, ὁ παντοκράτωρ, ὁ ἦν καὶ ὁ ὢν καὶ ὁ ἐρχόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/008.yaml
  text: 'And the four living creatures[a], each one of them having six wings, are full of eyes all around and within; and they have no rest day and night, saying: “Holy, holy, holy is the Lord God, the Almighty, who was and who is and who is coming.”'
translation:
  language: id
  text: Keempat makhluk hidup itu, yang masing-masing memiliki enam sayap, penuh mata di sekeliling dan di dalam. Mereka tidak beristirahat siang dan malam, sambil berkata, “Kudus, kudus, kuduslah Tuhan Allah, Yang Mahakuasa, yang dahulu ada, yang ada sekarang, dan yang sedang datang.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, menurut ungkapan yang lebih tradisional, “yang dahulu ada, yang ada sekarang, dan yang akan datang.”
    reason: alternative_reading
lexical_decisions:
- source_word: ζῷα
  choice: makhluk hidup
  rationale: Dalam konteks Wahyu, istilah ini menunjuk kepada makhluk surgawi yang hidup, bukan hewan dalam pengertian umum modern; pilihan ini juga mempertahankan citra penglihatan.
- source_word: ἓν καθ’ ἓν αὐτῶν
  choice: yang masing-masing
  rationale: 'Mengungkapkan daya distributif frasa Yunani secara alami: setiap makhluk secara tersendiri memiliki enam sayap.'
- source_word: ἔχων ἀνὰ πτέρυγας ἕξ
  choice: memiliki enam sayap
  rationale: Menyatakan secara langsung bahwa masing-masing makhluk mempunyai enam sayap tanpa membuat susunan Indonesianya kaku.
- source_word: κυκλόθεν καὶ ἔσωθεν
  choice: di sekeliling dan di bagian dalam
  rationale: Mempertahankan kedua dimensi ruang dalam teks, yakni sekeliling dan bagian dalam, tanpa menentukan lebih jauh letak mata yang memang tidak diperinci.
- source_word: γέμουσιν ὀφθαλμῶν
  choice: penuh dengan mata
  rationale: Merupakan padanan langsung dan hidup bagi konstruksi yang berarti dipenuhi oleh mata.
- source_word: ἀνάπαυσιν οὐκ ἔχουσιν
  choice: tidak pernah berhenti
  rationale: Dalam kaitannya dengan partisip λέγοντες, ungkapan ini secara alami menyampaikan bahwa mereka tidak memperoleh jeda dari kegiatan berkata; unsur keberlangsungannya tetap terjaga.
- source_word: ἡμέρας καὶ νυκτός
  choice: Siang dan malam
  rationale: Padanan Indonesia yang ringkas dan lazim bagi keterangan waktu yang menandakan kegiatan terus-menerus.
- source_word: λέγοντες
  choice: berkata
  rationale: Padanan netral yang tidak menambahkan intensitas seperti berseru atau berteriak yang tidak dinyatakan oleh verba sumber.
- source_word: Ἅγιος ἅγιος ἅγιος
  choice: Kudus, kudus, kuduslah
  rationale: Mempertahankan pengulangan tiga kali yang penting secara retoris dan teologis; partikel -lah menghasilkan seruan pujian yang wajar dalam bahasa Indonesia.
- source_word: κύριος, ὁ θεός
  choice: Tuhan Allah
  rationale: Mempertahankan kedua gelar ilahi dalam bentuk yang baku dan alami dalam bahasa Indonesia.
- source_word: ὁ παντοκράτωρ
  choice: Yang Mahakuasa
  rationale: Padanan baku bagi gelar ilahi yang menunjuk kepada Dia yang memegang segala kuasa atau memerintah atas segala sesuatu.
- source_word: ὁ ἦν καὶ ὁ ὢν καὶ ὁ ἐρχόμενος
  choice: yang dahulu ada, yang sekarang ada, dan yang sedang datang
  rationale: Dua keterangan waktu membantu bahasa Indonesia mengungkapkan perbedaan kala yang tersirat, sedangkan 'sedang datang' mempertahankan bentuk partisip present dan nuansa kedatangan yang berlangsung.
theological_decisions:
- issue: Rumusan waktu ilahi ὁ ἦν καὶ ὁ ὢν καὶ ὁ ἐρχόμενος
  choice: yang dahulu ada, yang sekarang ada, dan yang sedang datang
  alternative: yang dahulu ada, yang sekarang ada, dan yang akan datang
  rationale: Unsur terakhir memakai partisip present, sehingga 'sedang datang' lebih dekat pada aspek teks dan menjaga kesan kedatangan ilahi yang aktif. Padanan tradisional 'yang akan datang' tetap sah secara idiomatis dan dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Susunan kalimat dipecah menjadi dua agar mudah dipahami tanpa menghilangkan hubungan antargagasan. Istilah apokaliptik dan pengulangan liturgis dipertahankan.
