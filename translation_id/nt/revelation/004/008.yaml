revisions:
- from: Keempat makhluk hidup itu, yang masing-masing memiliki enam sayap, penuh dengan mata di sekeliling dan di bagian dalam. Siang dan malam mereka tidak pernah berhenti berkata, “Kudus, kudus, kuduslah Tuhan Allah, Yang Mahakuasa, yang dahulu ada, yang sekarang ada, dan yang sedang datang.[a]”
  to: Keempat makhluk hidup itu, yang masing-masing memiliki enam sayap, penuh mata di sekeliling dan di dalam. Mereka tidak beristirahat siang dan malam, sambil berkata, “Kudus, kudus, kuduslah Tuhan Allah, Yang Mahakuasa, yang dahulu ada, yang ada sekarang, dan yang sedang datang.[a]”
  rationale: Revisi mengganti ungkapan yang membatasi “tidak mempunyai istirahat” menjadi “tidak beristirahat,” sehingga makna sumber dipertahankan tanpa mengartikan ἀνάπαυσις secara sempit sebagai berhenti berbicara. Perbaikan kecil pada frasa ruang meningkatkan kelancaran bahasa. Rumusan waktu ilahi dan alternatif catatan kaki diselaraskan secara idiomatis sambil mempertahankan kontras antara partisipel kini utama dan alternatif tradisional.
