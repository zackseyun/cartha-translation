id: REV.4.6
reference: Revelation 4:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐνώπιον τοῦ θρόνου ὡς θάλασσα ὑαλίνη ὁμοία κρυστάλλῳ. Καὶ ἐν μέσῳ τοῦ θρόνου καὶ κύκλῳ τοῦ θρόνου τέσσαρα ζῷα γέμοντα ὀφθαλμῶν ἔμπροσθεν καὶ ὄπισθεν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/006.yaml
  text: And before the throne was something like a sea of glass[a], like crystal. And in the midst of the throne and around the throne were four living creatures[c][b], full of eyes in front and behind.
translation:
  language: id
  text: Di hadapan takhta itu ada sesuatu seperti lautan kaca[a], seperti kristal. Di tengah takhta dan di sekeliling takhta itu[c] ada empat makhluk hidup[b], penuh dengan mata di depan dan di belakang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “lautan seperti kaca.” Bahasa Yunani menyatakan perbandingan: “sesuatu seperti lautan kaca.”'
    reason: lexical_alternative
  - marker: b
    text: Atau “makhluk-makhluk bernyawa.” Kata Yunani ini tidak menunjuk pada binatang buas yang bermusuhan dalam bagian-bagian selanjutnya di kitab Wahyu.
    reason: lexical_alternative
  - marker: c
    text: Ungkapan “di tengah takhta dan di sekeliling takhta” sulit dibayangkan secara ruang. Terjemahan ini mempertahankan sudut pandang penglihatan dalam teks Yunani tanpa memperjelasnya secara spekulatif.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνώπιον
  choice: di hadapan
  rationale: Ungkapan ruang yang alami dan bermartabat dalam bahasa Indonesia serta mempertahankan hubungan dengan takhta.
- source_word: ὡς
  choice: tampak sesuatu seperti
  rationale: Menandai perbandingan dan sifat penglihatan tersebut, bukan menyatakan bahwa benda itu secara harfiah adalah laut.
- source_word: θάλασσα ὑαλίνη
  choice: lautan kaca
  rationale: Mempertahankan citra yang padat dan lazim dipahami; catatan kaki menyediakan alternatif 'lautan seperti kaca'.
- source_word: ὁμοία κρυστάλλῳ
  choice: menyerupai kristal
  rationale: Menyampaikan perbandingan kedua secara jelas tanpa menentukan apakah yang ditekankan ialah kejernihan atau kecemerlangan.
- source_word: ἐν μέσῳ τοῦ θρόνου καὶ κύκλῳ τοῦ θρόνου
  choice: di tengah-tengah takhta dan di sekeliling takhta itu
  rationale: Mengikuti susunan ruang yang sulit dalam bahasa Yunani dan tidak memaksakan geometri yang lebih mudah.
- source_word: ζῷα
  choice: makhluk hidup
  rationale: Menunjuk pada makhluk bernyawa dalam penglihatan surgawi dan menghindari kesan makhluk buas yang bermusuhan.
- source_word: γέμοντα ὀφθαλμῶν
  choice: penuh dengan mata
  rationale: Padanan langsung dan alami bagi konstruksi partisip dengan pelengkap genetif.
- source_word: ἔμπροσθεν καὶ ὄπισθεν
  choice: di bagian depan dan belakang
  rationale: Ungkapan ruang yang jelas dan wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Pemaknaan ζῷα dalam penglihatan ruang takhta surgawi
  choice: makhluk hidup
  alternative: makhluk bernyawa; binatang
  rationale: Pilihan ini mempertahankan sifat mereka sebagai makhluk hidup di sekitar takhta dan tidak mencampurkannya dengan citra binatang-binatang yang bermusuhan dalam bagian Wahyu selanjutnya.
- issue: Ketegangan ruang dalam ἐν μέσῳ τοῦ θρόνου καὶ κύκλῳ τοῦ θρόνου
  choice: mempertahankan 'di tengah-tengah takhta dan di sekeliling takhta'
  alternative: memperlancar menjadi 'di sekeliling takhta, dekat bagian tengahnya'
  rationale: Teks Yunani menyajikan gambaran ruang yang sulit, mungkin karena sudut pandang penglihatan. Terjemahan tidak menyelesaikan ketegangan itu secara spekulatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada penglihatan yang agung tetapi tetap mudah dipahami. Susunan yang janggal secara ruang sengaja dipertahankan, sedangkan 'tampak sesuatu seperti' membuat fungsi perbandingan ὡς eksplisit dan alami.
