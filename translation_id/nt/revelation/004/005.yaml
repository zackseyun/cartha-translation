id: REV.4.5
reference: Revelation 4:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐκ τοῦ θρόνου ἐκπορεύονται ἀστραπαὶ καὶ φωναὶ καὶ βρονταί· καὶ ἑπτὰ λαμπάδες πυρὸς καιόμεναι ἐνώπιον τοῦ θρόνου, ⸀ἅ εἰσιν ⸀τὰ ἑπτὰ πνεύματα τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/005.yaml
  text: And from the throne come flashes of lightning and sounds and peals of thunder[a]; and before the throne were seven lamps of fire burning[c][b], which are the seven spirits of God.
translation:
  language: id
  text: Dari takhta itu keluar kilat, suara-suara, dan gemuruh guntur[a]. Dan di hadapan takhta itu ada tujuh obor berapi yang menyala[b], yang adalah tujuh roh Allah[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “suara-suara” dapat diterjemahkan “suara-suara dari para makhluk.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “tujuh pelita api yang menyala.”'
    reason: lexical_alternative
  - marker: c
    text: Banyak orang memahami “tujuh roh Allah” sebagai ungkapan simbolis tentang kepenuhan satu Roh Kudus; teks Yunani sendiri berbunyi “tujuh roh.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπορεύονται
  choice: keluar
  rationale: Kata kerja kini dengan ἐκ menggambarkan berbagai gejala yang keluar dari takhta; bentuk kini dipertahankan secara alami dalam bahasa Indonesia.
- source_word: ἀστραπαὶ
  choice: kilat
  rationale: Kata ini menunjuk pada gejala kilat; bahasa Indonesia lazim memakai nomina kolektif tanpa penanda jamak eksplisit.
- source_word: φωναὶ
  choice: suara-suara
  rationale: φωνή dapat berarti suara atau suara manusia. Pilihan ini mempertahankan arti yang lebih luas tanpa menentukan bahwa yang terdengar adalah ujaran.
- source_word: βρονταί
  choice: gemuruh guntur
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan menyampaikan bunyi guntur yang berulang atau bergulung.
- source_word: λαμπάδες πυρὸς
  choice: obor berapi
  rationale: λαμπάς paling lazim menunjuk pada obor, sedangkan genitif πυρός menyatakan citra api. Pilihan ini dekat dengan bentuk Yunani sekaligus alami.
- source_word: καιόμεναι
  choice: menyala
  rationale: Partisip kini menggambarkan ketujuh obor yang terus terbakar; 'menyala' ringkas dan idiomatis.
- source_word: ἐνώπιον τοῦ θρόνου
  choice: di hadapan takhta itu
  rationale: Padanan ruang yang baku dan wajar untuk suasana ruang takhta.
- source_word: ἅ εἰσιν
  choice: ketujuhnya adalah
  rationale: Kata ganti relatif netral jamak merujuk kepada tujuh obor. Penyebutan 'ketujuhnya' memperjelas rujukan dalam bahasa Indonesia tanpa mengubah identifikasi simbolis.
- source_word: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: ketujuh roh Allah
  rationale: Mempertahankan bentuk jamak eksplisit teks Yunani dan tidak mengubahnya menjadi tafsiran 'Roh Allah yang tujuh rangkap'.
theological_decisions:
- issue: Makna τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: Diterjemahkan secara harfiah sebagai 'ketujuh roh Allah'.
  alternative: Roh Allah yang tujuh rangkap; gambaran simbolis tentang kepenuhan satu Roh Kudus.
  rationale: Teks Yunani secara eksplisit memakai bentuk jamak. Terjemahan utama mempertahankan susunan dan ketegangan teologis itu, sedangkan pemahaman simbolis yang umum dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan jelas. Struktur kalimat dipecah menjadi dua agar alami, sementara kala kini pada ἐκπορεύονται dan citra apokaliptik dipertahankan. Semua penanda catatan kaki muncul dalam teks utama.
