  terminology: ‘Takhta’, ‘obor berapi’, dan ‘roh Allah’ sesuai register dan istilah Alkitab bahasa Indonesia. Bentuk ‘tujuh roh Allah’ mempertahankan bentuk plural Yunani tanpa menafsirkan sebagai Roh Kudus yang tujuh rangkap.
