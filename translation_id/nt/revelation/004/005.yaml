  to: Dari takhta itu keluar kilat, suara-suara, dan gemuruh guntur[a]. Dan di hadapan takhta itu ada tujuh obor berapi yang menyala[b], yang adalah tujuh roh Allah[c].
  rationale: Revisi memperjelas jumlah plural ‘tujuh roh Allah’, mengganti catatan kaki yang terlalu membatasi ‘suara’ sebagai suara manusia dengan alternatif yang tidak menambahkan identitas manusia, serta memakai penghubung dan konstruksi relatif yang lebih eksplisit. ‘Ada’ pada klausa kedua diperlukan secara idiomatis dalam bahasa Indonesia dan menyampaikan keberadaan tujuh obor di hadapan takhta.
