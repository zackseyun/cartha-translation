id: REV.4.3
reference: Revelation 4:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ⸂καὶ ὁ καθήμενος⸃ ὅμοιος ὁράσει λίθῳ ἰάσπιδι καὶ σαρδίῳ, καὶ ἶρις κυκλόθεν τοῦ θρόνου ⸂ὅμοιος ὁράσει σμαραγδίνῳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/003.yaml
  text: And the one seated there was in appearance like jasper and sardius stone[b][a], and around the throne was a rainbow in appearance like emerald.
translation:
  language: id
  text: Dia yang duduk di sana tampak seperti batu yaspis dan batu karnelian[a]. Di sekeliling takhta itu ada pelangi[b] yang tampak seperti zamrud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “batu sardis” atau “sardius”, sebutan tradisional untuk batu permata yang di sini diterjemahkan “karnelian”.
    reason: lexical_alternative
  - marker: b
    text: Atau “lingkaran cahaya”; istilah Yunani ini dapat menunjuk pada cahaya yang menyerupai pelangi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καθήμενος
  choice: Dia yang duduk di sana
  rationale: Partisipel substantival menunjuk kepada sosok yang bertakhta. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan keadaan duduk yang sedang berlangsung; 'di sana' disuplai secara idiomatis dari konteks.
- source_word: ὅμοιος ὁράσει
  choice: tampak seperti
  rationale: Datif ὁράσει menyatakan segi penampilan. Terjemahan ini mempertahankan perbandingan dalam penglihatan tanpa menyatakan bahwa sosok itu secara harfiah terdiri dari batu permata.
- source_word: λίθῳ ἰάσπιδι
  choice: batu yaspis
  rationale: Mencerminkan unsur λίθῳ serta memakai nama batu permata yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: σαρδίῳ
  choice: batu karnelian
  rationale: Karnelian adalah padanan modern yang lebih mudah dipahami daripada istilah tradisional 'sardis/sardius' dan tidak sespesifik 'mirah' atau 'rubi'.
- source_word: ἶρις
  choice: pelangi
  rationale: Dalam konteks apokaliptik ini, kata tersebut paling wajar menunjuk pada pelangi atau cahaya menyerupai pelangi yang mengelilingi takhta; kemungkinan 'lingkaran cahaya' dicatat dalam catatan kaki.
- source_word: κυκλόθεν τοῦ θρόνου
  choice: di sekeliling takhta itu
  rationale: Menyampaikan posisi yang mengitari takhta dengan bahasa Indonesia yang jelas dan alami.
- source_word: ὅμοιος ὁράσει σμαραγδίνῳ
  choice: tampak seperti zamrud
  rationale: Mempertahankan keserupaan visual dan tidak menyiratkan bahwa pelangi itu benar-benar terbuat dari zamrud.
theological_decisions:
- issue: Sosok yang bertakhta digambarkan melalui perbandingan, bukan uraian fisik langsung
  choice: Mempertahankan bahasa keserupaan visual melalui 'tampak seperti'
  alternative: Menggambarkan sosok itu sebagai terbuat dari batu permata atau secara eksplisit memancarkan warna batu permata
  rationale: Bahasa Yunani dua kali menyatakan kemiripan dalam penampilan. Terjemahan tidak mengubah perumpamaan penglihatan menjadi pernyataan tentang hakikat atau bahan sosok tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan khidmat. Struktur dibagi menjadi dua kalimat agar gambaran penglihatan mudah dipahami, tanpa menghilangkan hubungan antarklausa dalam teks Yunani.
