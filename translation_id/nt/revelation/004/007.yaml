id: REV.4.7
reference: Revelation 4:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ τὸ ζῷον τὸ πρῶτον ὅμοιον λέοντι, καὶ τὸ δεύτερον ζῷον ὅμοιον μόσχῳ, καὶ τὸ τρίτον ζῷον ⸀ἔχων ⸂τὸ πρόσωπον ὡς⸃ ἀνθρώπου, καὶ τὸ τέταρτον ζῷον ὅμοιον ἀετῷ πετομένῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/007.yaml
  text: And the first living creature was like a lion, and the second living creature like a calf, and the third living creature had a face like a man, and the fourth living creature was like an eagle in flight.
translation:
  language: id
  text: Makhluk hidup yang pertama menyerupai singa, yang kedua menyerupai anak lembu, yang ketiga mempunyai wajah seperti manusia[a], dan yang keempat menyerupai burung rajawali yang sedang terbang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “wajah manusia.” Secara harfiah, bahasa Yunani berbunyi “wajah seperti manusia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ζῷον
  choice: makhluk hidup
  rationale: Ungkapan ini mencerminkan arti luas ζῷον dalam penglihatan ruang takhta dan membedakannya dari θηρίον, yaitu binatang buas yang tampil kemudian dalam Wahyu.
- source_word: ὅμοιον
  choice: menyerupai
  rationale: Kata ini menyatakan kemiripan, bukan kesamaan identitas. 'Menyerupai' alami dalam rangkaian deskripsi ini dan mempertahankan daya bandingnya.
- source_word: λέοντι
  choice: singa
  rationale: Padanan langsung dan wajar bagi nama hewan ini.
- source_word: μόσχῳ
  choice: anak lembu
  rationale: μόσχος biasanya menunjuk kepada lembu yang masih muda. 'Anak lembu' mempertahankan unsur usia tanpa menentukan jenis kelamin atau memasukkan makna kurban.
- source_word: ἔχων
  choice: mempunyai
  rationale: Partisip Yunani dialihkan menjadi verba finit agar kalimat Indonesia mengalir secara alami sambil mempertahankan fungsi deskriptifnya.
- source_word: τὸ πρόσωπον ὡς ἀνθρώπου
  choice: wajah seperti manusia
  rationale: πρόσωπον berarti 'wajah' dan ὡς menandai perbandingan. ἄνθρωπος di sini paling alami dipahami secara umum sebagai manusia, tanpa mengharuskan jenis kelamin laki-laki.
- source_word: ἀετῷ πετομένῳ
  choice: burung rajawali yang sedang terbang
  rationale: ἀετός diterjemahkan 'burung rajawali', sedangkan partisip πετομένῳ menggambarkannya dalam tindakan terbang. Bentuk ini langsung, jelas, dan hidup dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan ἀνθρώπου dalam gambaran makhluk hidup ketiga
  choice: wajah seperti manusia
  alternative: wajah manusia
  rationale: Bentuk Yunani dapat menunjuk kepada manusia secara umum, dan ὡς secara eksplisit menyatakan perbandingan. Terjemahan utama mempertahankan perbandingan itu tanpa membatasi rujukannya kepada laki-laki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'yang pertama ... yang kedua ...' mempertahankan struktur penglihatan, sedangkan verba 'menyerupai' menghindari ungkapan kaku 'adalah seperti'.
