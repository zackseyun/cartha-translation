id: REV.4.1
reference: Revelation 4:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον, καὶ ἰδοὺ θύρα ἠνεῳγμένη ἐν τῷ οὐρανῷ, καὶ ἡ φωνὴ ἡ πρώτη ἣν ἤκουσα ὡς σάλπιγγος λαλούσης μετ’ ἐμοῦ, λέγων· Ἀνάβα ὧδε, καὶ δείξω σοι ἃ δεῖ γενέσθαι. μετὰ ταῦτα
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/001.yaml
  text: After these things I looked[a], and behold, a door standing open in heaven, and the first voice that I had heard, like a trumpet speaking with me, said, “Come up here[c][b], and I will show you what must take place after these things.”
translation:
  language: id
  text: Sesudah semuanya itu aku melihat, dan tampaklah sebuah pintu terbuka di surga. Suara pertama yang kudengar itu—yang terdengar seperti sangkakala dan berbicara kepadaku[a]—berkata, “Naiklah kemari! Aku akan menunjukkan kepadamu apa yang harus terjadi sesudah semuanya itu.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “seperti sangkakala yang berbicara bersamaku.” Dalam bahasa Indonesia, “berbicara kepadaku” lebih alami dalam konteks ini.
    reason: lexical_alternative
  - marker: b
    text: Frasa Yunani yang sama, secara harfiah “sesudah hal-hal ini,” muncul pada awal dan akhir ayat. Ungkapan ini tidak dengan sendirinya menentukan apakah urutan tersebut adalah urutan penglihatan, sastra, atau peristiwa sejarah.
    reason: lexical_and_theological_clarity
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Sesudah semuanya itu
  rationale: Mempertahankan bentuk jamak dan pengulangan frasa Yunani pada awal serta akhir ayat, tanpa menentukan apakah urutannya bersifat sastra, penglihatan, atau sejarah keselamatan.
- source_word: εἶδον, καὶ ἰδοὺ
  choice: 'aku melihat: tampaklah'
  rationale: Menyampaikan tindakan melihat dan penanda perhatian ἰδού secara alami dalam bahasa Indonesia, sekaligus mempertahankan kesan mendadak dalam penglihatan.
- source_word: θύρα ἠνεῳγμένη
  choice: sebuah pintu terbuka
  rationale: Partisipel perfek pasif menunjukkan keadaan yang merupakan hasil tindakan sebelumnya; 'terbuka' secara alami menyatakan keadaan tersebut tanpa memaksakan pelaku yang membukanya.
- source_word: ἐν τῷ οὐρανῷ
  choice: di surga
  rationale: Konteks penglihatan menunjuk pada ranah surgawi, bukan sekadar langit yang terlihat.
- source_word: ἡ φωνὴ ἡ πρώτη ἣν ἤκουσα
  choice: suara yang pertama, yang dahulu kudengar
  rationale: Mempertahankan sebutan 'yang pertama' dan menjelaskan secara wajar bahwa pendengaran itu mendahului peristiwa sekarang; frasa ini kemungkinan mengacu kembali pada Wahyu 1:10.
- source_word: ὡς σάλπιγγος λαλούσης μετ’ ἐμοῦ
  choice: seperti bunyi sangkakala yang berbicara kepadaku
  rationale: Menjaga bentuk perbandingan, bukan penyamaan harfiah. 'Bunyi sangkakala' lebih alami dalam bahasa Indonesia untuk melukiskan kualitas suara, sedangkan 'kepadaku' menjadi ungkapan percakapan yang idiomatis.
- source_word: Ἀνάβα ὧδε
  choice: Naiklah kemari!
  rationale: Imperatif ini mengundang Yohanes naik menuju tempat pembicara; 'kemari' mempertahankan sudut pandang deiktis pembicara.
- source_word: ἃ δεῖ γενέσθαι
  choice: apa yang harus terjadi
  rationale: Menyampaikan unsur keharusan dalam δεῖ tanpa menjelaskan sumber atau corak keharusan itu lebih jauh daripada teks.
theological_decisions:
- issue: Daya temporal dari pengulangan μετὰ ταῦτα
  choice: Kedua kemunculan diterjemahkan sama sebagai 'sesudah semuanya itu'.
  alternative: '''Sesudah itu'' atau ''kemudian'' pada salah satu atau kedua kemunculan.'
  rationale: Pengulangan sumber dipertahankan agar terjemahan tidak menetapkan secara sepihak apakah urutan tersebut semata-mata urutan penglihatan, struktur sastra, atau skema peristiwa akhir zaman.
- issue: Identitas 'suara yang pertama'
  choice: Sebutan itu dipertahankan secara harfiah dalam teks, dengan catatan kemungkinan rujukan ke Wahyu 1:10.
  alternative: Menerjemahkan secara tafsiran sebagai 'suara yang mula-mula kudengar'.
  rationale: Bentuk sumber dapat merujuk kepada suara terdahulu, tetapi teks ayat ini tidak secara eksplisit menyebut identitas pembicaranya; ambiguitas tersebut tidak diselesaikan dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat yang sesuai dengan sastra apokaliptik. 'Tampaklah' mempertahankan daya seru ἰδού tanpa memakai bentuk arkais 'lihatlah'. Tanda pisah membantu memperjelas bahwa perbandingan dengan sangkakala menerangkan suara tersebut.
