  naturalness: Teks revisi memakai Bahasa Indonesia baku yang lebih lancar. Susunan “suara pertama yang kudengar itu ... berkata” lebih jelas, dan “yang terdengar seperti sangkakala dan berbicara kepadaku” menyampaikan gambaran suara tanpa membuat sangkakala secara janggal menjadi pelaku utama dalam bahasa Indonesia.
  terminology: “Surga,” “sangkakala,” “Naiklah kemari,” dan “harus terjadi” sesuai register apokaliptik serta tidak menambahkan penafsiran teologis. Catatan mempertahankan alternatif harfiah untuk μετ’ ἐμοῦ dan menjelaskan pengulangan frasa temporal tanpa menetapkan suatu skema eskatologis.
