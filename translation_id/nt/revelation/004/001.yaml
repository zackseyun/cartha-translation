    rationale: Yunani memang secara harfiah dapat berbunyi “seperti sangkakala yang berbicara denganku,” tetapi dalam Bahasa Indonesia susunan itu janggal. Lebih baik menggambarkan suara itu sebagai terdengar seperti sangkakala sekaligus berbicara kepada Yohanes.
