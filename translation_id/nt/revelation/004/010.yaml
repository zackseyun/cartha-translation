language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: πεσοῦνται οἱ εἴκοσι τέσσαρες πρεσβύτεροι ἐνώπιον τοῦ καθημένου ἐπὶ τοῦ θρόνου, καὶ προσκυνήσουσιν τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων, καὶ βαλοῦσιν τοὺς στεφάνους αὐτῶν ἐνώπιον τοῦ θρόνου, λέγοντες·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/010.yaml
  text: 'the twenty-four elders will fall down before the one seated on the throne[a], and they will worship the one who lives forever and ever, and they will cast their crowns before the throne[b], saying:'
translation:
  language: id
  text: 'Dua puluh empat tua-tua itu akan tersungkur di hadapan Dia yang duduk di atas takhta, dan mereka akan menyembah Dia yang hidup selama-lamanya[a], serta melemparkan mahkota mereka di hadapan takhta[b] sambil berkata:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “ke dalam zaman-zaman segala zaman.”'
    reason: lexical_alternative
  - marker: b
    text: Kata Yunani yang diterjemahkan “mahkota” juga dapat merujuk pada karangan kemenangan yang dianugerahkan sebagai tanda kehormatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεσοῦνται
  choice: akan tersungkur
  rationale: Menyampaikan tindakan jatuh merendahkan diri dalam konteks penyembahan secara alami dan khidmat, tanpa mempersempitnya menjadi istilah teknis tertentu.
- source_word: οἱ εἴκοσι τέσσαρες πρεσβύτεροι
  choice: kedua puluh empat tua-tua
  rationale: “Tua-tua” merupakan padanan Alkitabiah yang lazim dan mudah dipahami untuk para anggota sidang surgawi ini; “presbiter” terlalu teknis.
- source_word: ἐνώπιον
  choice: di hadapan
  rationale: Padanan alami yang mempertahankan makna berada di depan atau dalam hadirat seseorang; digunakan konsisten pada kedua kemunculannya.
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: Dia yang duduk di atas takhta
  rationale: Mempertahankan gelar deskriptif berbentuk partisip tanpa menambahkan identitas yang tidak dinyatakan secara eksplisit dalam ayat ini.
- source_word: προσκυνήσουσιν
  choice: akan menyembah
  rationale: Dalam konteks ilahi di kitab Wahyu, kata ini menyatakan penyembahan, bukan sekadar penghormatan atau gerakan membungkuk.
- source_word: τῷ ζῶντι
  choice: Dia yang hidup
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gelar partisipial yang menekankan kehidupan Allah yang kekal.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: selama-lamanya
  rationale: Padanan idiomatis bahasa Indonesia untuk durasi tanpa akhir; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: βαλοῦσιν
  choice: akan melemparkan
  rationale: Mempertahankan daya gambar tindakan βάλλω, yang lebih kuat daripada sekadar “meletakkan”, namun tetap wajar dalam konteks simbolis ini.
- source_word: τοὺς στεφάνους αὐτῶν
  choice: mahkota mereka
  rationale: “Mahkota” merupakan padanan yang alami dalam latar kerajaan kitab Wahyu, sementara nuansa karangan kemenangan atau kehormatan dijelaskan dalam catatan kaki.
- source_word: λέγοντες
  choice: sambil berkata
  rationale: Menghubungkan partisip ini secara alami dengan rangkaian tindakan sebelumnya dan memperkenalkan ucapan pada ayat berikutnya.
theological_decisions:
- issue: Identitas Dia yang bertakhta dan hidup selama-lamanya
  choice: Mempertahankan sebutan deskriptif “Dia yang duduk di atas takhta” dan “Dia yang hidup selama-lamanya”.
  alternative: Menyebut-Nya secara eksplisit sebagai Allah Bapa.
  rationale: Konteks menunjuk kepada Allah yang bertakhta, tetapi teks Yunani ayat ini menggunakan sebutan deskriptif, bukan identifikasi doktrinal yang lebih khusus. Terjemahan tidak menambahkan penjelasan tersebut ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Susunan kalimat mempertahankan urutan tindakan dalam bahasa Yunani, tetapi dibagi menjadi dua kalimat agar alami. Huruf kapital pada “Dia” dipakai sebagai konvensi penghormatan dalam bahasa Indonesia, tanpa menambahkan identifikasi teologis yang tidak tersurat.
