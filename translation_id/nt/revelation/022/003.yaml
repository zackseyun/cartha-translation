id: REV.22.3
reference: Revelation 22:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ πᾶν κατάθεμα οὐκ ἔσται ἔτι. καὶ ὁ θρόνος τοῦ θεοῦ καὶ τοῦ ἀρνίου ἐν αὐτῇ ἔσται, καὶ οἱ δοῦλοι αὐτοῦ λατρεύσουσιν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/003.yaml
  text: And there will no longer be any curse[a]. And the throne of God and of the Lamb will be in it, and his servants will worship him[d][c][b],
translation:
  language: id
  text: Tidak akan ada lagi kutuk apa pun[a]. Takhta Allah dan Anak Domba akan ada di dalamnya, dan para hamba-Nya[b] akan beribadah kepada-Nya[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sesuatu pun yang terkutuk” atau “barang terkutuk apa pun.”
    reason: lexical_alternative
  - marker: b
    text: Atau “para budak-Nya”; kata Yunani menunjukkan orang-orang yang menjadi milik dan tunduk sepenuhnya kepada tuannya.
    reason: lexical_alternative
  - marker: c
    text: Atau “akan melayani-Nya” atau “akan melakukan pelayanan suci bagi-Nya.”
    reason: lexical_alternative
  - marker: d
    text: 'Teks Yunani memakai bentuk tunggal: “takhta” milik “Allah dan Anak Domba”, lalu “hamba-Nya” dan “kepada-Nya”. Susunan ini mempertahankan pembedaan antara Allah dan Anak Domba sekaligus pemerintahan bersama mereka.'
    reason: theological_tension
lexical_decisions:
- source_word: πᾶν κατάθεμα
  choice: kutuk apa pun
  rationale: Ungkapan ini menyatakan peniadaan secara menyeluruh. “Kutuk apa pun” alami dalam bahasa Indonesia dan tetap membuka kemungkinan bahwa κατάθεμα menunjuk pada kutuk itu sendiri atau sesuatu yang terkena kutuk.
- source_word: οὐκ ἔσται ἔτι
  choice: tidak akan ada lagi
  rationale: Menyampaikan konstruksi eksistensial futurum dan arti ἔτι secara wajar dan tepat.
- source_word: ὁ θρόνος
  choice: takhta
  rationale: Padanan baku yang mempertahankan bentuk tunggal penting dalam teks Yunani.
- source_word: τοῦ θεοῦ καὶ τοῦ ἀρνίου
  choice: Allah dan Anak Domba
  rationale: Kedua pemilik takhta disebut secara eksplisit, sedangkan “Anak Domba” mempertahankan citra khas kitab Wahyu.
- source_word: ἐν αὐτῇ
  choice: di dalamnya
  rationale: Mempertahankan pronomina feminin tunggal yang merujuk kepada kota/Yerusalem baru; bahasa Indonesia tidak menandai gender gramatikal.
- source_word: οἱ δοῦλοι αὐτοῦ
  choice: para hamba-Nya
  rationale: “Hamba” dalam konteks religius Indonesia menyampaikan kepemilikan, ketundukan, dan pelayanan penuh dengan lebih alami daripada “budak”, tanpa menghapus kekuatan dasar δοῦλος; alternatif dijelaskan dalam catatan.
- source_word: λατρεύσουσιν αὐτῷ
  choice: akan beribadah kepada-Nya
  rationale: λατρεύω di sini menunjuk pelayanan keagamaan kepada Allah dalam konteks takhta; “beribadah” menyampaikan nuansa sakral itu, sementara arti “melayani” dicatat sebagai alternatif.
- source_word: αὐτοῦ ... αὐτῷ
  choice: -Nya ... kepada-Nya
  rationale: Bentuk tunggal Yunani dipertahankan, sehingga ketegangan antara Allah dan Anak Domba yang dibedakan dan pemerintahan mereka yang dipersatukan tidak diselesaikan melalui parafrasa.
theological_decisions:
- issue: Satu takhta milik Allah dan Anak Domba, diikuti pronomina tunggal
  choice: Mempertahankan “Takhta” dalam bentuk tunggal serta “-Nya/kepada-Nya” dalam bentuk tunggal
  alternative: Menggunakan bentuk jamak, misalnya “hamba-hamba Mereka akan beribadah kepada Mereka”, atau memparafrasakannya untuk menghindari ketegangan
  rationale: Teks Yunani dengan sengaja menyandingkan pembedaan antara Allah dan Anak Domba dengan satu takhta dan pronomina tunggal. Terjemahan mempertahankan susunan dan ketegangan teologis itu tanpa memasukkan rumusan doktrinal tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat ringkas serta mudah dipahami. Kapitalisasi pronomina ilahi mengikuti kebiasaan terjemahan Alkitab Indonesia dan membantu menandai rujukan tanpa menjelaskan ambiguitas yang asli.
