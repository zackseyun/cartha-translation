    rationale: ἀφέλῃ ἀπὸ τῶν λόγων berarti mengambil/mengurangi dari kata-kata itu. “Mengurangi kata-kata” sudah menyampaikan tindakan tersebut secara idiomatis tanpa unsur tambahan.
  - severity: medium
    issue: Anak kalimat “yang tertulis dalam kitab ini” berpotensi secara tata bahasa Indonesia hanya merujuk kepada “kota suci”.
    rationale: Partisip genitif jamak τῶν γεγραμμένων paling wajar merujuk kepada dua nomina sebelumnya, “pohon kehidupan” dan “kota suci”. Penanda “keduanya” diperlukan untuk menjaga cakupan jamak itu dalam bahasa sasaran.
