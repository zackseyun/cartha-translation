id: REV.22.19
reference: Revelation 22:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ἀφέλῃ ἀπὸ τῶν λόγων τοῦ βιβλίου τῆς προφητείας ταύτης, ⸀ἀφελεῖ ὁ θεὸς τὸ μέρος αὐτοῦ ἀπὸ τοῦ ξύλου τῆς ζωῆς καὶ ἐκ τῆς πόλεως τῆς ἁγίας, τῶν γεγραμμένων ἐν τῷ βιβλίῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/019.yaml
  text: and if anyone takes away from the words of the book of this prophecy[a], God will take away his share from the tree of life and from the holy city, which are written in this book.
translation:
  language: id
  text: Dan jika seseorang mengurangi kata-kata dari kitab nubuat ini, Allah akan mengambil bagiannya dari pohon kehidupan[a] dan dari kota suci, yang keduanya tertulis dalam kitab ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah berbunyi “kitab kehidupan”, bukan “pohon kehidupan”.
    reason: textual_variant
lexical_decisions:
- source_word: ἀφέλῃ
  choice: mengurangi sesuatu
  rationale: Dalam konteks peringatan tentang isi nubuat, frasa ini secara alami menyatakan tindakan menghilangkan sebagian dari teks; bentuk kondisionalnya dipertahankan dengan 'jika'.
- source_word: λόγων
  choice: kata-kata
  rationale: Pilihan langsung yang mempertahankan perhatian ayat pada isi verbal nubuat.
- source_word: βιβλίου
  choice: kitab
  rationale: '''Kitab'' sesuai dengan ragam Alkitab Indonesia, tetap mudah dipahami, dan lebih wajar daripada ''gulungan'' dalam ungkapan ini.'
- source_word: προφητείας
  choice: nubuat
  rationale: Mempertahankan penamaan jenis pesan dan nada khidmat sumber.
- source_word: ἀφελεῖ
  choice: akan mengambil
  rationale: Menyampaikan bentuk futurum dan mempertahankan hubungan timbal balik dengan tindakan mengurangi pada klausa pertama, meski keluwesan bahasa Indonesia menuntut verba yang sedikit berbeda.
- source_word: μέρος
  choice: bagian
  rationale: '''Bagian'' dapat menyatakan jatah atau keikutsertaan seseorang dan merupakan padanan Indonesia yang lugas.'
- source_word: ξύλου τῆς ζωῆς
  choice: pohon kehidupan
  rationale: Sesuai dengan konteks langsung Wahyu 22:2, 14 dan bacaan teks SBLGNT.
- source_word: πόλεως τῆς ἁγίας
  choice: kota suci
  rationale: Padanan alami yang mempertahankan penunjukan apokaliptik sumber.
- source_word: τῶν γεγραμμένων ἐν τῷ βιβλίῳ τούτῳ
  choice: yang tertulis dalam kitab ini
  rationale: Mempertahankan bentuk pasif perfektif dan ambiguitas sintaksis mengenai rujukan frasa relatif tersebut.
theological_decisions:
- issue: Varian tekstual antara 'pohon kehidupan' dan 'kitab kehidupan'
  choice: pohon kehidupan
  alternative: kitab kehidupan
  rationale: Teks SBLGNT yang diberikan berbunyi ξύλου τῆς ζωῆς dan bacaan ini cocok dengan konteks dekat Wahyu 22; varian tradisional yang penting dicatat dalam catatan kaki.
- issue: Rujukan frasa 'yang tertulis dalam kitab ini'
  choice: Mempertahankan susunan yang dapat merujuk pada pohon kehidupan dan kota suci
  alternative: Memperjelasnya sebagai 'segala sesuatu yang tertulis dalam kitab ini'
  rationale: Teks Yunani memiliki konstruksi genitif jamak yang paling dekat dengan kedua hal tersebut; terjemahan tidak seharusnya menutup kemungkinan rujukannya melalui penjelasan tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kitab nubuat ini' mempertahankan bentuk sumber, sedangkan 'mengurangi sesuatu dari kata-kata' dipilih untuk menyampaikan tindakan menghilangkan sebagian tanpa menyiratkan sekadar meringkas.
source_grounding:
  english_pob_role: consult_only
