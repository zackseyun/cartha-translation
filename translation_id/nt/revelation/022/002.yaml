id: REV.22.2
reference: Revelation 22:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ἐν μέσῳ τῆς πλατείας αὐτῆς· καὶ τοῦ ποταμοῦ ἐντεῦθεν καὶ ἐκεῖθεν ξύλον ζωῆς ποιοῦν καρποὺς δώδεκα, κατὰ μῆνα ἕκαστον ⸀ἀποδιδοῦν τὸν καρπὸν αὐτοῦ, καὶ τὰ φύλλα τοῦ ξύλου εἰς θεραπείαν τῶν ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/002.yaml
  text: in the middle of its street[a], and on this side and on that side of the river, was the tree of life, bearing twelve fruits, yielding its fruit each month[c][b]. And the leaves of the tree are for the healing of the nations.
translation:
  language: id
  text: di tengah jalan kota itu[a] dan di sebelah sini serta di sebelah sana sungai itu terdapat pohon kehidupan. Pohon itu menghasilkan dua belas buah[b] dan menghasilkan buahnya setiap bulan.[c] Daun-daun pohon itu untuk penyembuhan bangsa-bangsa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Susunan teks Yunani sangat padat: secara harfiah, “di tengah jalannya, dan di sebelah sini serta di sebelah sana sungai itu.” Hubungan tepat antara jalan, sungai, dan pohon tidak dijelaskan lebih lanjut.'
    reason: syntactical_ambiguity
  - marker: b
    text: Ungkapan “dua belas buah” dapat berarti dua belas macam buah atau satu rangkaian hasil buah yang lengkap dan berlimpah.
    reason: lexical_alternative
  - marker: c
    text: Gambaran ini menggemakan pohon kehidupan dalam Kejadian 2:9 dan pohon-pohon dalam Yehezkiel 47:12.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν μέσῳ
  choice: di tengah
  rationale: Mempertahankan arti lokatif ungkapan Yunani secara wajar dalam bahasa Indonesia.
- source_word: πλατείας αὐτῆς
  choice: jalan utama kota itu
  rationale: πλατεῖα dapat berarti jalan yang lebar atau ruang terbuka kota. 'Jalan utama' sesuai dengan gambaran kota, sedangkan 'kota itu' memperjelas rujukan pronomina feminin αὐτῆς tanpa mengubah acuannya.
- source_word: ἐντεῦθεν καὶ ἐκεῖθεν
  choice: di sebelah sini serta di sebelah sana
  rationale: Terjemahan ini mempertahankan ungkapan ruang distributif yang harfiah dan tidak menyederhanakannya menjadi gambaran geografis yang lebih tegas.
- source_word: ξύλον ζωῆς
  choice: pohon kehidupan
  rationale: Walaupun ξύλον juga dapat berarti kayu, hubungan dengan Kejadian 2 dan pemakaiannya dalam Wahyu mendukung arti 'pohon'. Bentuk definit dipakai karena yang dimaksud ialah pohon kehidupan yang sudah dikenal dalam gambaran Kitab Suci.
- source_word: ποιοῦν καρποὺς δώδεκα
  choice: menghasilkan dua belas buah
  rationale: ποιοῦν dengan καρπούς berarti menghasilkan buah. Terjemahan ini mempertahankan 'dua belas buah' tanpa menambahkan kata 'jenis', yang tidak dinyatakan secara eksplisit dalam teks Yunani.
- source_word: κατὰ μῆνα ἕκαστον
  choice: setiap bulan
  rationale: Ungkapan Indonesia yang ringkas dan alami untuk pembagian waktu yang berulang bulan demi bulan.
- source_word: ἀποδιδοῦν τὸν καρπὸν αὐτοῦ
  choice: memberikan buahnya
  rationale: Mempertahankan nuansa ἀποδίδωμι sebagai memberikan atau mengeluarkan hasil, dengan bahasa yang mudah dipahami.
- source_word: τὰ φύλλα τοῦ ξύλου
  choice: daun-daun pohon itu
  rationale: Bentuk ulang menyampaikan bentuk jamak φύλλα secara alami dalam bahasa Indonesia.
- source_word: εἰς θεραπείαν
  choice: berguna untuk penyembuhan
  rationale: Menyampaikan fungsi atau tujuan yang ditandai εἰς dan mempertahankan θεραπεία sebagai 'penyembuhan', bukan sekadar kesehatan.
- source_word: τῶν ἐθνῶν
  choice: bangsa-bangsa
  rationale: Dalam konteks Wahyu, ἔθνη menunjuk pada berbagai bangsa atau masyarakat secara luas, bukan hanya orang bukan Yahudi sebagai lawan orang Yahudi.
theological_decisions:
- issue: Ketegangan sintaksis mengenai letak pohon terhadap jalan dan sungai
  choice: 'Mempertahankan pohon kehidupan dalam bentuk tunggal dan menerjemahkan urutan keterangan tempat secara dekat: di tengah jalan utama kota itu serta di sebelah sini dan sebelah sana sungai.'
  alternative: Menjadikannya jamak sebagai 'pohon-pohon kehidupan' atau menata ulang kalimat menjadi gambaran geografis yang lebih tegas, seperti 'di kedua tepi sungai'.
  rationale: Teks Yunani menyajikan gambaran apokaliptik yang padat dan secara tata ruang tidak mudah divisualisasikan. Bentuk tunggal ξύλον dihormati, sementara hubungan spasialnya tidak dipaksakan menjadi susunan yang lebih jelas daripada sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat, dengan struktur kalimat yang tetap mudah dipahami. Ungkapan ruang yang ganjil sengaja dipertahankan agar ketegangan gambaran Yunani tidak dihilangkan; kalimat dipecah untuk keterbacaan.
