  to: di tengah jalan kota itu[a] dan di sebelah sini serta di sebelah sana sungai itu terdapat pohon kehidupan. Pohon itu menghasilkan dua belas buah[b] dan menghasilkan buahnya setiap bulan.[c] Daun-daun pohon itu untuk penyembuhan bangsa-bangsa.
