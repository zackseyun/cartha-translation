id: REV.22.6
reference: Revelation 22:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ ⸀εἶπέν μοι· Οὗτοι οἱ λόγοι πιστοὶ καὶ ἀληθινοί, καὶ ⸀ὁ κύριος, ὁ θεὸς τῶν πνευμάτων τῶν προφητῶν, ἀπέστειλεν τὸν ἄγγελον αὐτοῦ δεῖξαι τοῖς δούλοις αὐτοῦ ἃ δεῖ γενέσθαι ἐν τάχει·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/006.yaml
  text: And he said to me[a], “These words are trustworthy and true, and the Lord, the God of the spirits of the prophets[b], sent his angel to show his servants what must happen soon.”
translation:
  language: id
  text: Dan ia berkata kepadaku, “Perkataan ini dapat dipercaya dan benar. Tuhan, Allah atas roh-roh para nabi, telah mengutus malaikat-Nya untuk menunjukkan kepada hamba-hamba-Nya[a] apa yang harus segera terjadi[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “budak-budak-Nya.” Kata Yunani doulos menyatakan orang yang berada di bawah kuasa dan menjadi milik seorang tuan.
    reason: lexical_alternative
  - marker: b
    text: Atau “apa yang harus terjadi dengan cepat.” Frasa Yunani ini dapat menekankan kedekatan waktunya (“segera”) atau cepatnya peristiwa itu berlangsung (“dengan cepat”).
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ εἶπέν μοι
  choice: Lalu ia berkata kepadaku
  rationale: “Lalu” menyampaikan fungsi penghubung καί secara alami dalam alur narasi tanpa menambah penafsiran yang kuat.
- source_word: πιστοὶ καὶ ἀληθινοί
  choice: dapat dipercaya dan benar
  rationale: Ungkapan ini secara alami menyatakan bahwa perkataan tersebut andal sekaligus benar.
- source_word: κύριος
  choice: Tuhan
  rationale: Gelar ilahi κύριος secara tepat dan lazim diterjemahkan “Tuhan” dalam konteks ini.
- source_word: ὁ θεὸς τῶν πνευμάτων τῶν προφητῶν
  choice: Allah dari roh-roh para nabi
  rationale: Bentuk ini mempertahankan susunan genitif Yunani dan tidak mengubahnya menjadi parafrasa tentang pengilhaman atau penguasaan, sehingga hubungan yang dimaksud tetap terbuka.
- source_word: ἄγγελον
  choice: malaikat
  rationale: Dalam konteks penglihatan kitab Wahyu, ἄγγελος menunjuk kepada makhluk surgawi, bukan sekadar utusan manusia.
- source_word: δούλοις
  choice: hamba-hamba-Nya
  rationale: “Hamba” merupakan padanan Indonesia yang alami dan bermartabat bagi orang-orang yang berada di bawah kuasa serta menjadi milik Allah; makna perhambaan yang lebih tegas dijelaskan dalam catatan kaki.
- source_word: δεῖξαι
  choice: untuk menunjukkan
  rationale: Padanan langsung ini sesuai dengan konteks penglihatan dan tidak menambahkan gagasan yang tidak tersurat.
- source_word: ἃ δεῖ γενέσθαι
  choice: apa yang harus terjadi
  rationale: Terjemahan ini alami dalam bahasa Indonesia dan tetap mempertahankan unsur keharusan dalam δεῖ.
- source_word: ἐν τάχει
  choice: segera
  rationale: “Segera” secara ringkas menyampaikan kedekatan waktu, sementara kemungkinan arti bahwa peristiwa itu berlangsung dengan cepat dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Hubungan genitif dalam θεὸς τῶν πνευμάτων τῶν προφητῶν
  choice: Allah dari roh-roh para nabi
  alternative: Allah yang mengilhami para nabi; Allah yang berkuasa atas roh-roh para nabi
  rationale: Terjemahan utama mempertahankan ketaksaan hubungan genitif dan tidak menetapkan apakah frasa itu terutama berbicara tentang sumber pengilhaman, kepemilikan, atau kedaulatan Allah.
- issue: Makna δούλοις bagi umat Allah
  choice: hamba-hamba-Nya
  alternative: budak-budak-Nya
  rationale: “Hamba” lebih alami dalam ragam Indonesia yang bermartabat, sedangkan catatan kaki mempertahankan kemungkinan padanan “budak” yang menonjolkan kepemilikan dan keterikatan penuh.
- issue: Arti ἐν τάχει dalam konteks eskatologis
  choice: segera
  alternative: dengan cepat
  rationale: Konteks menonjolkan kedekatan waktu, tetapi frasa Yunani juga dapat menunjuk pada cepatnya peristiwa berlangsung. Alternatif itu dicatat agar ketegangan eskatologis tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan jelas. Susunan kalimat dibuat alami tanpa menghilangkan struktur teologis penting atau ketaksaan asli.
