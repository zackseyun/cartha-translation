  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Ἰδοὺ ἔρχομαι ταχύ, καὶ ὁ μισθός μου μετ’ ἐμοῦ, ἀποδοῦναι ἑκάστῳ ὡς τὸ ἔργον ⸀ἐστὶν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/012.yaml
  text: Behold[a], I am coming soon, and my reward is with me, to repay each one according to what his work is.
translation:
  language: id
  text: “Lihatlah, Aku segera datang,[a] dan upah-Ku ada bersama-Ku untuk memberi balasan kepada setiap orang sesuai dengan perbuatannya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Aku datang dengan cepat.” Kata Yunani ταχύ dapat menekankan kedekatan waktu (“segera”) atau kecepatan maupun ketiba-tibaan (“dengan cepat”).
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Lihatlah
  rationale: Mempertahankan seruan pengarah perhatian yang khas dalam nubuat dan sastra apokaliptik, dengan bahasa Indonesia modern yang tetap khidmat.
- source_word: ἔρχομαι
  choice: Aku ... datang
  rationale: Bentuk kini Yunani memiliki daya futuristis dalam konteks ini. Susunan dengan adverbia 'segera' menyampaikan kedatangan yang akan terjadi secara alami dalam bahasa Indonesia.
- source_word: ταχύ
  choice: segera
  rationale: Dapat menunjuk pada kedekatan waktu maupun kecepatan atau ketiba-tibaan. 'Segera' secara alami menyampaikan kedekatan waktu; kemungkinan 'dengan cepat' dipertahankan dalam catatan kaki.
- source_word: ὁ μισθός μου
  choice: upah-Ku
  rationale: μισθός berarti upah, imbalan, atau ganjaran. 'Upah' mempertahankan gambaran pemberian yang sepadan dan selaras dengan pemakaian bahasa Alkitab Indonesia, tanpa menentukan apakah hasilnya positif atau negatif.
- source_word: μετ’ ἐμοῦ
  choice: ada bersama-Ku
  rationale: Klausa Yunani tidak menyatakan kopula secara eksplisit. 'Ada bersama-Ku' melengkapinya secara wajar dan mempertahankan penekanan bahwa upah itu menyertai sang pembicara.
- source_word: ἀποδοῦναι
  choice: untuk membalas
  rationale: Infinitif ini menyatakan tujuan dan mengandung gagasan memberikan kembali atau mengganjar sesuai perbuatan. 'Membalas' cukup luas untuk mencakup ganjaran positif maupun negatif.
- source_word: ἑκάστῳ
  choice: setiap orang
  rationale: Menyampaikan makna distributif tunggal dan pertanggungjawaban individual secara idiomatis tanpa membatasi rujukan pada laki-laki.
- source_word: ὡς τὸ ἔργον ἐστὶν αὐτοῦ
  choice: sesuai dengan perbuatannya
  rationale: Menyampaikan tolok ukur pembalasan secara alami. 'Perbuatan' mewakili bentuk nominal tunggal ἔργον, sedangkan akhiran '-nya' mempertahankan rujukan individual.
theological_decisions:
- issue: Representasi gender dalam ἑκάστῳ ... αὐτοῦ
  choice: setiap orang ... perbuatannya
  alternative: masing-masing ... pekerjaannya
  rationale: Bentuk maskulin tunggal Yunani bersifat generik. Bahasa Indonesia tidak menuntut pronomina bergender, sehingga 'setiap orang ... -nya' mempertahankan cakupan universal dan pertanggungjawaban individual tanpa menambah penandaan gender yang tidak alami.
- issue: Hakikat bahasa pembalasan
  choice: upah-Ku ... untuk membalas setiap orang sesuai dengan perbuatannya
  alternative: ganjaran-Ku ... untuk memberikan kepada setiap orang menurut perbuatannya
  rationale: Terjemahan mempertahankan hubungan eksplisit antara kedatangan, upah, dan perbuatan, tanpa menyimpulkan lebih jauh apakah ayat ini membahas dasar keselamatan, jenis-jenis ganjaran, atau penghukuman saja.
- issue: Ambiguitas temporal dan modal ταχύ
  choice: segera datang
  alternative: datang dengan cepat
  rationale: Bacaan utama memilih kedekatan waktu yang paling alami dalam konteks, tetapi catatan kaki mempertahankan kemungkinan bahwa adverbia itu menekankan kecepatan atau ketiba-tibaan kedatangan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan langsung. Huruf kapital pada bentuk persona pertama mengikuti kebiasaan penerbitan Alkitab Indonesia ketika merujuk kepada Kristus. Penempatan penanda catatan sesudah 'datang' mengaitkannya langsung dengan frasa 'segera datang'.
