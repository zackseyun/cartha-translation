id: REV.22.10
reference: Revelation 22:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Καὶ λέγει μοι· Μὴ σφραγίσῃς τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου, ὁ καιρὸς γὰρ ἐγγύς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/010.yaml
  text: And he says to me[a], “Do not seal up the words of the prophecy of this book[c][b], for the time is near.”
translation:
  language: id
  text: Lalu ia berkata kepadaku, “Jangan memeteraikan[a] kata-kata nubuat dari kitab ini,[c] sebab waktunya[b] sudah dekat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Jangan menyegel” atau “Jangan merahasiakan.” Ungkapan ini menggemakan bahasa nubuat tentang apakah suatu pewahyuan ditutup atau dibiarkan terbuka.
    reason: lexical_alternative
  - marker: b
    text: Atau “saat yang ditetapkan.” Kata Yunani καιρός dapat berarti saat yang menentukan atau yang telah ditetapkan.
    reason: lexical_alternative
  - marker: c
    text: Bandingkan Daniel 12:4, tempat nubuat diperintahkan untuk dimeteraikan; di sini perintahnya justru kebalikan.
    reason: cross_reference
lexical_decisions:
- source_word: λέγει μοι
  choice: ia berkata kepadaku
  rationale: Bahasa Indonesia tidak menandai kala lampau dan kini pada bentuk verba. Ungkapan ini alami dalam alur narasi dan tidak menghilangkan daya hidup kala kini naratif Yunani.
- source_word: Μὴ σφραγίσῃς
  choice: Jangan memeteraikan
  rationale: Mempertahankan gambaran meterai dalam konteks pewahyuan, yakni menutup atau menahan isi nubuat agar tidak dibukakan, tanpa menggantinya dalam teks utama dengan tafsiran 'merahasiakan'.
- source_word: τοὺς λόγους
  choice: perkataan-perkataan
  rationale: Mencerminkan bentuk jamak konkret λόγους. Walaupun 'pesan' lebih ringkas, pilihan itu akan mengubah bentuk dan sedikit menafsirkan makna kolektifnya.
- source_word: τῆς προφητείας τοῦ βιβλίου τούτου
  choice: nubuat dalam kitab ini
  rationale: Susunan ini menyampaikan secara alami bahwa perkataan-perkataan tersebut merupakan nubuat yang terdapat dalam kitab ini. Terjemahan harfiah dengan dua frasa 'dari' akan terasa kaku dalam bahasa Indonesia.
- source_word: ὁ καιρὸς
  choice: waktunya
  rationale: Menyampaikan καιρός secara ringkas tanpa memaksakan nuansa 'waktu yang ditetapkan', meskipun nuansa tersebut tetap dicatat sebagai kemungkinan.
- source_word: ἐγγύς ἐστιν
  choice: sudah dekat
  rationale: Ungkapan Indonesia yang alami untuk keadaan bahwa waktunya dekat. Kata 'sudah' menandai keadaan kini, bukan menambahkan jadwal terperinci.
theological_decisions:
- issue: Bahasa kedekatan waktu dalam konteks apokaliptik
  choice: sebab waktunya sudah dekat
  alternative: sebab saat yang ditetapkan itu sudah dekat
  rationale: Terjemahan mempertahankan pernyataan bahwa waktunya dekat tanpa melunakkannya atau menentukan jadwal eskatologis. Kemungkinan bahwa καιρός menunjuk saat penentu atau yang ditetapkan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Memeteraikan' mempertahankan citra kenabian yang penting, sedangkan catatan kaki menjelaskan maknanya bagi pembaca umum. Tanda koma sebelum alasan mengikuti jeda alami dalam kutipan.
