id: REV.22.14
reference: Revelation 22:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Μακάριοι οἱ ⸂πλύνοντες τὰς στολὰς αὐτῶν⸃, ἵνα ἔσται ἡ ἐξουσία αὐτῶν ἐπὶ τὸ ξύλον τῆς ζωῆς καὶ τοῖς πυλῶσιν εἰσέλθωσιν εἰς τὴν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/014.yaml
  text: Blessed are those who wash their robes[c][b][a], so that they may have the right to the tree of life and may enter the city by the gates.
translation:
  language: id
  text: Berbahagialah mereka yang mencuci jubah mereka[a][b], supaya mereka berhak atas pohon kehidupan dan dapat masuk ke dalam kota melalui gerbang-gerbangnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah berbunyi, “Berbahagialah mereka yang melakukan perintah-perintah-Nya,” atau “yang menaati perintah-perintah-Nya,” sebagai ganti “yang mencuci jubah mereka.”
    reason: textual_variant
  - marker: b
    text: Gambaran mencuci jubah menggemakan Wahyu 7:14, tempat jubah-jubah dicuci dan dibuat putih dalam darah Anak Domba.
    reason: cross_reference
lexical_decisions:
- source_word: Μακάριοι
  choice: Berbahagialah
  rationale: Bentuk yang lazim untuk ucapan bahagia dalam Alkitab; mempertahankan bobot ilahi dan eskatologis, bukan sekadar keadaan emosional.
- source_word: πλύνοντες
  choice: yang mencuci
  rationale: Mempertahankan gambaran konkret tindakan mencuci serta nuansa partisipel kini yang mencirikan kelompok tersebut.
- source_word: στολὰς
  choice: jubah
  rationale: Sesuai dengan pakaian panjang dalam penglihatan Wahyu dan mempertahankan kaitan simbolis dengan Wahyu 7:14.
- source_word: ἵνα
  choice: supaya
  rationale: Mengungkapkan hubungan tujuan atau hasil secara alami dalam bahasa Indonesia.
- source_word: ἔσται ἡ ἐξουσία αὐτῶν
  choice: mereka berhak
  rationale: Mengalihkan konstruksi harfiah 'hak mereka akan ada' menjadi ungkapan Indonesia yang alami; ἐξουσία di sini menunjuk pada hak atau kewenangan untuk memperoleh akses.
- source_word: ἐπὶ τὸ ξύλον τῆς ζωῆς
  choice: atas pohon kehidupan
  rationale: Bersama 'berhak', preposisi ἐπί menyatakan objek hak tersebut. Bentuk 'berhak atas' alami dalam bahasa Indonesia dan tidak menyiratkan kekuasaan memerintah pohon itu.
- source_word: καὶ τοῖς πυλῶσιν εἰσέλθωσιν εἰς τὴν πόλιν
  choice: dan dapat masuk ke dalam kota melalui pintu-pintunya
  rationale: Dativus πυλῶσιν menyatakan jalan atau sarana masuk; 'melalui pintu-pintunya' menjelaskan bahwa mereka memasuki kota lewat gerbang-gerbangnya.
theological_decisions:
- issue: Varian teks pada klausa pertama
  choice: 'Mengikuti SBLGNT: ''mereka yang mencuci jubah mereka.'''
  alternative: '''Mereka yang melakukan perintah-perintah-Nya'' atau ''menaati perintah-perintah-Nya.'''
  rationale: Teks sumber yang ditetapkan memuat πλύνοντες τὰς στολὰς αὐτῶν. Bacaan lain yang berpengaruh dalam sejarah penerjemahan dicatat tanpa menggantikan teks utama.
- issue: Hubungan mencuci jubah dengan akses kepada kehidupan
  choice: Mempertahankan hubungan yang dinyatakan ayat tanpa menjelaskan mekanisme teologisnya di dalam teks utama.
  alternative: Menafsirkan tindakan itu secara eksplisit sebagai jasa manusia, atau menambahkan bahwa jubah dicuci dalam darah Anak Domba.
  rationale: Ayat ini menyebut mereka yang mencuci jubah sebagai orang yang berhak atas pohon kehidupan dan dapat memasuki kota. Terjemahan tidak menambahkan penjelasan doktrinal yang tidak dinyatakan langsung, sedangkan gema Wahyu 7:14 dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Berbahagialah' mempertahankan bentuk ucapan bahagia; 'jubah' menjaga citra penglihatan; 'berhak atas' dan 'melalui pintu-pintunya' dipilih demi kejelasan idiomatis tanpa menghilangkan hubungan sintaksis teks Yunani.
