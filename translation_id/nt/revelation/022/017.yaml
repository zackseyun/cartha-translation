    text: Atau “tanpa membayar” atau “sebagai pemberian.”
    reason: lexical_alternative
  - marker: b
    text: Dua seruan pertama, “Datanglah!”, sering dipahami sebagai permohonan agar Tuhan datang; sesudah itu, orang yang haus dan siapa yang mau diundang untuk datang dan mengambil air kehidupan.
    reason: alternative_reading
  revision_rationale: The revision removes unstated pronominal objects from the two articular participles, renders ὁ θέλων idiomatically as "siapa yang mau," and aligns the explanatory note with the verse's explicit image of the water of life. It retains the ambiguity of the first two calls and all key imagery and imperatival force.
