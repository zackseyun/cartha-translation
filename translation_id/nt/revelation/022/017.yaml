revisions:
- from: Roh dan pengantin perempuan berkata, “Datanglah!” Orang yang mendengarnya hendaklah berkata, “Datanglah!” Orang yang haus hendaklah datang, dan orang yang menginginkannya hendaklah mengambil air kehidupan dengan cuma-cuma.[a][b]
  to: Roh dan pengantin perempuan berkata, “Datanglah!” Orang yang mendengar hendaklah berkata, “Datanglah!” Orang yang haus hendaklah datang, dan siapa yang mau hendaklah mengambil air kehidupan dengan cuma-cuma.[a][b]
  rationale: The revision removes unstated pronominal objects from the two articular participles, renders ὁ θέλων idiomatically as "siapa yang mau," and aligns the explanatory note with the verse's explicit image of the water of life. It retains the ambiguity of the first two calls and all key imagery and imperatival force.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:05:14Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the two second-person calls "Datanglah!" without supplying an addressee and then shifts appropriately to third-person imperatives. However, "orang yang menginginkannya" supplies an object (-nya) not expressed by ὁ θέλων; the water is stated explicitly only after λαβέτω.
  naturalness: The register is modern, standard, and suitably dignified. "Siapa yang mau" is a natural generic Indonesian expression for ὁ θέλων and avoids the unnecessary supplied pronoun. "Orang yang mendengar" is preferable to "orang yang mendengarnya," since the Greek participle has no stated object.
  terminology: '"Roh," "pengantin perempuan," and "air kehidupan" are appropriate and preserve the source imagery. "Dengan cuma-cuma" clearly renders δωρεάν. The interpretive footnote should refer to receiving "air kehidupan," rather than broadening it to "kehidupan."'
  issues:
  - severity: medium
    issue: Added object in "orang yang menginginkannya"
    rationale: The pronoun -nya is not present in ὁ θέλων. Although its intended referent is inferable from the following phrase, omitting it better preserves the Greek's compact wording and avoids making the desire's object explicit.
  - severity: low
    issue: Added object in "orang yang mendengarnya"
    rationale: Ὁ ἀκούων is simply "the one who hears"; it does not state an object. "Orang yang mendengar" is natural Indonesian and more formally close to the source.
  - severity: low
    issue: Footnote b expands "air kehidupan" to "kehidupan"
    rationale: The note may explain the invitation without replacing the stated object. Referring to "air kehidupan" retains the verse's image and wording.
  revised_text: Roh dan pengantin perempuan berkata, “Datanglah!” Orang yang mendengar hendaklah berkata, “Datanglah!” Orang yang haus hendaklah datang, dan siapa yang mau hendaklah mengambil air kehidupan dengan cuma-cuma.[a][b]
  revised_footnotes:
