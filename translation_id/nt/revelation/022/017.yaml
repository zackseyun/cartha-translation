id: REV.22.17
reference: Revelation 22:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ τὸ πνεῦμα καὶ ἡ νύμφη λέγουσιν· Ἔρχου· καὶ ὁ ἀκούων εἰπάτω· Ἔρχου· καὶ ὁ διψῶν ἐρχέσθω, ὁ θέλων λαβέτω ὕδωρ ζωῆς δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/017.yaml
  text: And the Spirit and the bride say[a], “Come.” And let the one who hears say, “Come.” And let the one who is thirsty come[c][b]; let the one who desires take the water of life freely.
translation:
  language: id
  text: Roh dan pengantin perempuan berkata, “Datanglah!” Orang yang mendengar hendaklah berkata, “Datanglah!” Orang yang haus hendaklah datang, dan siapa yang mau hendaklah mengambil air kehidupan dengan cuma-cuma.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanpa membayar” atau “sebagai pemberian.”
    reason: lexical_alternative
  - marker: b
    text: Dua seruan pertama, “Datanglah!”, sering dipahami sebagai permohonan agar Tuhan datang; sesudah itu, orang yang haus dan siapa yang mau diundang untuk datang dan mengambil air kehidupan.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: Roh
  rationale: Dalam konteks Wahyu, bentuk berartikel ini paling wajar merujuk kepada Roh Kudus. Huruf kapital menandai rujukan tersebut dalam bahasa Indonesia.
- source_word: ἡ νύμφη
  choice: pengantin perempuan
  rationale: Mempertahankan gambaran simbolis νύμφη tanpa menafsirkannya langsung sebagai jemaat, umat Allah, atau Yerusalem Baru.
- source_word: λέγουσιν
  choice: berkata
  rationale: Bentuk kini Yunani dinyatakan dengan bentuk sederhana yang alami dalam bahasa Indonesia dan tetap memberi kesan seruan yang berlangsung.
- source_word: Ἔρχου
  choice: Datanglah!
  rationale: Imperatif orang kedua tunggal diterjemahkan sebagai seruan langsung; tanda seru menyampaikan daya ajakannya.
- source_word: ὁ ἀκούων
  choice: orang yang mendengarnya
  rationale: Ungkapan partisipial berartikel diterjemahkan secara generik dan alami. Akhiran -nya merujuk pada seruan yang baru diucapkan, bukan pada objek yang ditambahkan secara teologis.
- source_word: εἰπάτω
  choice: hendaklah berkata
  rationale: Imperatif orang ketiga disampaikan dengan 'hendaklah', yang mempertahankan daya perintah atau ajakan secara wajar dan bermartabat.
- source_word: ὁ διψῶν
  choice: orang yang haus
  rationale: Mempertahankan metafora kehausan dan bentuk generik sumber.
- source_word: ἐρχέσθω
  choice: hendaklah datang
  rationale: Menyampaikan imperatif orang ketiga sebagai undangan yang tegas tanpa menambahkan tujuan yang tidak dinyatakan.
- source_word: ὁ θέλων
  choice: orang yang menginginkannya
  rationale: θέλω menyatakan kehendak atau keinginan. Bentuk ini alami dalam bahasa Indonesia; akhiran -nya menunjuk pada air kehidupan yang segera disebutkan.
- source_word: λαβέτω
  choice: hendaklah mengambil
  rationale: '''Mengambil'' mempertahankan citra tindakan dalam λαμβάνω serta kesejajaran imperatif, meskipun ''menerima'' juga mungkin secara makna.'
- source_word: ὕδωρ ζωῆς
  choice: air kehidupan
  rationale: Mencerminkan konstruksi genitif secara langsung dan mempertahankan ungkapan khas Yohanes tanpa menggesernya menjadi 'air hidup'.
- source_word: δωρεάν
  choice: dengan cuma-cuma
  rationale: Menunjukkan bahwa air kehidupan diberikan tanpa bayaran; pilihan ini lebih jelas dalam bahasa Indonesia modern daripada 'dengan bebas'.
theological_decisions:
- issue: Identitas pihak yang disapa dengan “Datanglah!”
  choice: Dua seruan pertama dibiarkan tanpa objek yang dinyatakan, lalu kalimat beralih kepada undangan bagi orang yang haus.
  alternative: Menambahkan 'Tuhan Yesus' sebagai pihak yang disapa, atau memahami semua seruan sebagai undangan kepada manusia.
  rationale: Bahasa Yunani tidak menyebut objek pada dua imperatif orang kedua pertama. Terjemahan mempertahankan keterbukaan dan peralihan gramatikal menuju imperatif orang ketiga.
- issue: Rujukan simbolis “pengantin perempuan”
  choice: Mempertahankan ungkapan simbolis 'pengantin perempuan'.
  alternative: Menggantikannya dengan 'jemaat', 'umat Allah', atau 'Yerusalem Baru'.
  rationale: Gambaran dalam Wahyu memiliki hubungan simbolis yang berlapis; penjabaran di dalam teks utama akan mempersempit maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan serta peralihan dari seruan orang kedua ke imperatif orang ketiga dipertahankan. Semua penanda catatan kaki ditempatkan dalam teks utama.
