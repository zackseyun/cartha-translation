id: REV.22.11
reference: Revelation 22:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: ὁ ἀδικῶν ἀδικησάτω ἔτι, καὶ ὁ ῥυπαρὸς ⸀ῥυπαρευθήτω ἔτι, καὶ ὁ δίκαιος δικαιοσύνην ποιησάτω ἔτι, καὶ ὁ ἅγιος ἁγιασθήτω ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/011.yaml
  text: Let the one who does wrong still do wrong, and the filthy still be made filthy, and the righteous still practice righteousness, and the holy still be made holy.
translation:
  language: id
  text: Biarlah orang yang berbuat salah terus berbuat salah, orang yang cemar terus dibuat cemar[a], orang yang benar terus melakukan kebenaran[b], dan orang yang kudus terus dijadikan kudus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tetap cemar.” Verba Yunaninya berbentuk pasif, tetapi dapat diungkapkan secara lebih idiomatis sebagai keadaan yang berlanjut.
    reason: lexical_alternative
  - marker: b
    text: Atau “terus melakukan keadilan.” Kata Yunani δικαιοσύνη dapat berarti “kebenaran” atau “keadilan” dalam konteks ini.
    reason: lexical_alternative
  - marker: c
    text: Atau “terus dikuduskan.” Verba Yunaninya berarti “dijadikan kudus” atau “dikuduskan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἀδικῶν / ἀδικησάτω
  choice: orang yang berbuat salah / biarlah ... terus berbuat salah
  rationale: Partisipel berartikel menyatakan orang secara umum, sedangkan bentuk imperatif orang ketiga dipertahankan dengan “biarlah”. “Berbuat salah” mempertahankan daya verbal ἀδικέω tanpa mengubahnya menjadi label statis.
- source_word: ἔτι
  choice: terus
  rationale: Adverbia yang diulang ini menyatakan keberlanjutan atau kegigihan. “Terus” alami dalam bahasa Indonesia dan dapat diterapkan pada keempat klausa.
- source_word: ὁ ῥυπαρός / ῥυπαρευθήτω
  choice: orang yang cemar / terus dibuat cemar
  rationale: “Cemar” membawa nuansa kenajisan moral tanpa terbatas pada ketidakbersihan jasmani. Bentuk pasif imperatif Yunani dipertahankan dengan “dibuat cemar”, sehingga pelakunya tetap tidak dinyatakan.
- source_word: ὁ δίκαιος / δικαιοσύνην ποιησάτω
  choice: orang yang benar / terus melakukan kebenaran
  rationale: “Orang yang benar” merupakan ungkapan substantival yang wajar. Kolokasi “melakukan kebenaran” mempertahankan ποιέω dan menggambarkan perilaku aktif, sementara “kebenaran” menjaga cakupan etis δικαιοσύνη.
- source_word: ὁ ἅγιος / ἁγιασθήτω
  choice: orang yang kudus / terus dijadikan kudus
  rationale: Bentuk pasif ἁγιασθήτω dipertahankan secara eksplisit. “Dijadikan kudus” lebih mudah dipahami pembaca umum daripada istilah teknis “dikuduskan”, dengan pelaku tetap tersirat.
theological_decisions:
- issue: Daya imperatif dalam konteks penetapan moral terakhir
  choice: Keempat verba diterjemahkan sebagai imperatif dengan “biarlah”, bukan sebagai ramalan.
  alternative: “Orang yang berbuat salah akan terus berbuat salah ...”
  rationale: Semua bentuk Yunani adalah imperatif orang ketiga. Terjemahan mempertahankan nada retoris dan yudisialnya tanpa menjadikannya indikatif atau secara tersirat menyatakan bahwa kejahatan disetujui.
- issue: Bentuk pasif ῥυπαρευθήτω dan ἁγιασθήτω
  choice: Bentuk pasif dipertahankan sebagai “dibuat cemar” dan “dijadikan kudus”.
  alternative: “Tetap cemar” dan “tetap kudus”.
  rationale: Bentuk pasif Yunani membiarkan pelaku atau penyebabnya tidak dinyatakan. Mempertahankannya menjaga ambiguitas dan ketegangan teologis teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan tegas. Paralelisme empat klausa dipertahankan melalui pengulangan “orang yang” dan “terus”. Bentuk pasif yang agak tajam sengaja dipertahankan karena mencerminkan morfologi Yunani dan menjaga pelaku tetap tersirat.
