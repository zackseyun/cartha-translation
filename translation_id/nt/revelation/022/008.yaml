id: REV.22.8
reference: Revelation 22:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: Κἀγὼ Ἰωάννης ὁ ἀκούων καὶ βλέπων ταῦτα. καὶ ὅτε ἤκουσα καὶ ἔβλεψα, ἔπεσα προσκυνῆσαι ἔμπροσθεν τῶν ποδῶν τοῦ ἀγγέλου τοῦ δεικνύοντός μοι ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/008.yaml
  text: And I[a], John, am the one hearing and seeing these things. And when I heard and saw, I fell down to worship before the feet of the angel who was showing me these things.
translation:
  language: id
  text: Dan aku, Yohanes, adalah orang yang mendengar dan melihat hal-hal ini. Ketika aku mendengar dan melihat hal-hal ini, aku tersungkur untuk menyembah[a] di depan kaki malaikat yang menunjukkan hal-hal ini kepadaku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bersujud di hadapan” atau “memberi hormat kepada”. Kata kerja Yunani ini dapat menunjuk pada tindakan bersujud atau memberi penghormatan; di sini diterjemahkan “menyembah” karena kata itu lazim bermakna demikian dalam kitab Wahyu dan karena teguran yang menyusul.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγὼ Ἰωάννης
  choice: Dan aku, Yohanes
  rationale: Mempertahankan penghubung καί dan penekanan pada subjek orang pertama, sekaligus memakai bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: ὁ ἀκούων καὶ βλέπων ταῦτα
  choice: adalah orang yang mendengar dan melihat semuanya ini
  rationale: Mempertahankan konstruksi partisip substantival dan bentuk kini Yunani dengan ungkapan Indonesia yang alami; 'semuanya ini' merujuk pada berbagai hal yang telah disaksikan.
- source_word: ὅτε ἤκουσα καὶ ἔβλεψα
  choice: Ketika aku mendengar dan melihatnya
  rationale: '''Ketika'' tidak menafsirkan hubungan waktunya secara berlebihan, sedangkan bentuk lampau Yunani dapat dinyatakan secara alami melalui konteks naratif Indonesia.'
- source_word: ἔπεσα προσκυνῆσαι
  choice: aku tersungkur untuk menyembah
  rationale: '''Tersungkur'' mengungkapkan tindakan fisik jatuh merendahkan diri, sementara ''menyembah'' mempertahankan daya religius προσκυνέω dalam konteks Wahyu.'
- source_word: ἔμπροσθεν τῶν ποδῶν τοῦ ἀγγέλου
  choice: di depan kaki malaikat
  rationale: Mempertahankan preposisi ἔμπροσθεν dan penyebutan eksplisit tentang kaki, tanpa menggantinya dengan ungkapan yang lebih idiomatis tetapi kurang dekat dengan bentuk sumber.
- source_word: τοῦ δεικνύοντός μοι ταῦτα
  choice: yang menunjukkan semuanya itu kepadaku
  rationale: Bentuk relatif ini mencerminkan peran malaikat yang sedang atau terus menunjukkan penglihatan tersebut kepada Yohanes.
theological_decisions:
- issue: Makna προσκυνέω yang diarahkan kepada malaikat
  choice: menyembah
  alternative: bersujud di hadapan; memberi hormat
  rationale: Dalam kitab Wahyu kata ini lazim memiliki daya penyembahan. Teguran pada ayat berikutnya memperlihatkan bahwa tindakan Yohanes tidak patut diarahkan kepada malaikat. Terjemahan utama tidak melunakkan ketegangan teologis itu, sedangkan catatan kaki mempertahankan jangkauan leksikalnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Pengulangan 'mendengar dan melihat' dipertahankan karena menonjol dalam sumber. Penanda catatan kaki ditempatkan langsung sesudah kata yang dijelaskan.
