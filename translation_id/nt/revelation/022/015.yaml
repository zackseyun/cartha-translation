review_pass:
  verdict: revise
  source_fidelity: Daftar kategori dan susunan pokoknya mengikuti teks Yunani dengan baik. Namun, untuk πόρνοι, ungkapan “orang-orang yang melakukan percabulan” kurang idiomatis dan “percabulan” dalam pemakaian Indonesia modern dapat mengarah pada makna yang tidak sepenuhnya sejajar dengan kategori seksual umum πόρνοι. Untuk ψεῦδος, “dusta” adalah padanan yang lebih langsung dan lebih wajar dalam kolokasi “mencintai dan melakukan/berbuat.”
  naturalness: “Di luar ada” dan daftar paralelnya jelas serta bernada baku. “Para tukang sihir,” “para pembunuh,” dan “para penyembah berhala” alami. Mengganti frasa mengenai πόρνοι dengan “orang-orang yang tidak bermoral secara seksual” meningkatkan kejelasan modern; mengganti “kepalsuan” dengan “dusta” menghindari kolokasi “melakukan kepalsuan” yang kurang lazim.
  terminology: “Anjing-anjing” patut dipertahankan sebagai citra metaforis tanpa penafsiran khusus dalam teks utama. “Tukang sihir” memadai bagi φάρμακοι dalam konteks Wahyu. “Tidak bermoral secara seksual” menyampaikan keluasan πόρνοι tanpa memakai istilah teknis atau mempersempitnya. “Dusta” dapat mencakup kebohongan maupun yang palsu secara lebih umum dalam konteks daftar ini; catatan kaki mempertahankan alternatif yang lebih eksplisit sebagai nomina tunggal.
  issues:
  - severity: medium
    issue: “Orang-orang yang melakukan percabulan” kurang alami dan berpotensi kurang tepat cakupannya.
    rationale: πόρνοι menunjuk kategori luas orang yang hidup dalam perilaku seksual tidak bermoral. Dalam bahasa Indonesia modern, “percabulan” dapat memiliki asosiasi hukum atau tindakan cabul tertentu, sehingga bukan padanan paling jernih untuk kategori umum ini.
  - severity: low
    issue: “Melakukan kepalsuan” kurang idiomatis.
    rationale: Walaupun “kepalsuan” dapat menyatakan makna luas ψεῦδος, bahasa Indonesia lebih alami memakai “dusta” dalam rangkaian ini. Padanan tersebut juga dekat dengan diksi tradisional Alkitab tanpa menjadi usang.
  revised_text: Di luar ada anjing-anjing[b], para tukang sihir, orang-orang yang tidak bermoral secara seksual, para pembunuh, para penyembah berhala, dan setiap orang yang mencintai dan melakukan dusta.[a]
