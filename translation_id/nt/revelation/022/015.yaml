source:
  edition: SBLGNT
  text: ἔξω οἱ κύνες καὶ οἱ φάρμακοι καὶ οἱ πόρνοι καὶ οἱ φονεῖς καὶ οἱ εἰδωλολάτραι καὶ πᾶς φιλῶν καὶ ποιῶν ψεῦδος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/015.yaml
  text: Outside are the dogs and the sorcerers and the sexually immoral and the murderers and the idolaters[b][a], and everyone who loves and practices falsehood.
translation:
  language: id
  text: Di luar ada anjing-anjing[b], para tukang sihir, orang-orang yang tidak bermoral secara seksual, para pembunuh, para penyembah berhala, dan setiap orang yang mencintai dan melakukan dusta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setiap orang yang mencintai dan melakukan suatu dusta.”
    reason: lexical_alternative
  - marker: b
    text: “Anjing-anjing” kemungkinan besar merupakan kiasan bagi orang-orang yang tersingkir dan dianggap najis secara moral; sebagian penafsir memahaminya secara lebih khusus.
    reason: cultural_note
lexical_decisions:
- source_word: ἔξω
  choice: Di luar ada
  rationale: Keterangan tempat ini ditempatkan di awal untuk mempertahankan penekanan pada keadaan tersingkir dari kota; kata “ada” membuat susunannya alami dalam bahasa Indonesia.
- source_word: κύνες
  choice: anjing-anjing
  rationale: Mempertahankan gambaran konkret dan metaforis teks Yunani tanpa menentukan secara sempit kelompok yang dimaksud.
- source_word: φάρμακοι
  choice: para tukang sihir
  rationale: Dalam konteks Wahyu, istilah ini menunjuk kepada orang yang mempraktikkan sihir atau ilmu gaib; pilihan ini jelas dan wajar bagi pembaca modern.
- source_word: πόρνοι
  choice: orang-orang yang melakukan percabulan
  rationale: Mengungkapkan pelaku perilaku seksual yang tidak bermoral dengan bahasa yang jelas, tanpa membatasinya pada satu bentuk pelanggaran seksual tertentu.
- source_word: φονεῖς
  choice: para pembunuh
  rationale: Padanan langsung bagi kata benda yang menunjuk kepada orang-orang yang melakukan pembunuhan.
- source_word: εἰδωλολάτραι
  choice: para penyembah berhala
  rationale: Padanan yang jelas dan lazim, sekaligus mempertahankan bentuk ringkas daftar keburukan.
- source_word: πᾶς φιλῶν καὶ ποιῶν ψεῦδος
  choice: setiap orang yang mencintai dan melakukan kepalsuan
  rationale: Kedua partisip menggambarkan sikap dan perbuatan yang menjadi ciri seseorang. “Kepalsuan” mencakup dusta dalam perkataan maupun keterikatan yang lebih luas kepada apa yang palsu.
- source_word: ψεῦδος
  choice: kepalsuan
  rationale: Kata benda tunggal ini dapat menyatakan kepalsuan secara umum; padanan tersebut sesuai dengan pasangan verba “mencintai dan melakukan” dan tetap membuka cakupan maknanya.
theological_decisions:
- issue: Apakah “anjing-anjing” harus ditafsirkan dalam teks utama sebagai kelompok tertentu atau dipertahankan sebagai metafora.
  choice: Mempertahankan istilah harfiah “anjing-anjing” dalam teks utama.
  alternative: Orang-orang najis; orang-orang tidak tahu malu; pelacur laki-laki.
  rationale: Teks Yunani memakai gambaran konkret κύνες, sedangkan identitas khusus kelompok yang dilambangkannya diperdebatkan. Mempertahankan metafora menjaga daya retoris teks dan menghindari pemaksaan satu tafsiran.
- issue: Apakah ψεῦδος harus diterjemahkan secara sempit sebagai “suatu dusta” atau secara lebih luas sebagai “kepalsuan”.
  choice: Menerjemahkannya sebagai “kepalsuan”.
  alternative: Suatu dusta; dusta.
  rationale: Ungkapan “mencintai dan melakukan” menunjukkan kecenderungan serta praktik yang menetap, sehingga kategori moral yang lebih luas sesuai; catatan kaki mempertahankan kemungkinan arti yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Pengulangan kategori pelaku dipertahankan agar irama daftar keburukan tetap terasa, sedangkan metafora apokaliptik tidak diparafrasakan secara interpretatif.
