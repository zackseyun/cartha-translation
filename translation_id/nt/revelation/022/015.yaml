revisions:
- from: Di luar ada anjing-anjing[b], para tukang sihir, orang-orang yang melakukan percabulan, para pembunuh, para penyembah berhala, dan setiap orang yang mencintai dan melakukan kepalsuan.[a]
  to: Di luar ada anjing-anjing[b], para tukang sihir, orang-orang yang tidak bermoral secara seksual, para pembunuh, para penyembah berhala, dan setiap orang yang mencintai dan melakukan dusta.[a]
  rationale: Revisi hanya memperbaiki ketepatan dan kelancaran padanan Indonesia. Metafora κύνες, urutan daftar, dan keluasan etis ψεῦδος tetap dipertahankan; tidak ada penafsiran kelompok “anjing-anjing” atau pembatasan khusus atas kategori seksual yang dimasukkan ke teks utama.
