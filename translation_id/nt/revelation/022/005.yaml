id: REV.22.5
reference: Revelation 22:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: SBLGNT
  text: καὶ νὺξ οὐκ ἔσται ⸀ἔτι, καὶ ⸂οὐκ ἔχουσιν χρείαν⸃ ⸀φωτὸς λύχνου καὶ ⸀φῶς ἡλίου, ὅτι κύριος ὁ θεὸς φωτίσει ⸀ἐπ’ αὐτούς, καὶ βασιλεύσουσιν εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/005.yaml
  text: And night will be no more[a], and they will have no need of lamplight or sunlight, because the Lord God will shine on them[b], and they will reign forever and ever.
translation:
  language: id
  text: Malam tidak akan ada lagi, dan mereka tidak memerlukan cahaya pelita ataupun cahaya matahari, sebab Tuhan Allah akan menyinari mereka, dan mereka akan memerintah selama-lamanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ke dalam zaman-zaman dari zaman-zaman,” suatu ungkapan yang menyatakan durasi tanpa akhir.
    reason: lexical_alternative
lexical_decisions:
- source_word: νὺξ
  choice: malam
  rationale: Makna dasarnya adalah malam; bentuk tanpa artikel wajar diterjemahkan sederhana sebagai 'malam'.
- source_word: οὐκ ἔσται ἔτι
  choice: tidak akan ada lagi
  rationale: Ungkapan ini menyatakan bahwa sesuatu tidak akan ada atau terjadi lagi, dan bentuk ini alami serta khidmat dalam bahasa Indonesia.
- source_word: οὐκ ἔχουσιν χρείαν
  choice: mereka tidak memerlukan
  rationale: Walaupun verba Yunani berbentuk kini, konteks penglihatan eskatologis dan verba-verba futur di sekitarnya mendukung makna keadaan mendatang; bahasa Indonesia tidak wajib menandai futur pada setiap klausa.
- source_word: φωτὸς λύχνου
  choice: cahaya pelita
  rationale: Terjemahan ini mempertahankan konstruksi 'cahaya dari pelita' dengan ungkapan Indonesia yang alami dan sesuai dengan latar dunia kuno.
- source_word: φῶς ἡλίου
  choice: cahaya matahari
  rationale: Padanan alami dan tepat untuk terang yang berasal dari matahari, sekaligus sejajar dengan 'cahaya pelita'.
- source_word: κύριος ὁ θεός
  choice: Tuhan Allah
  rationale: Padanan baku, alami, dan bermartabat bagi gelar ilahi ini dalam bahasa Indonesia.
- source_word: φωτίσει ἐπ’ αὐτούς
  choice: akan menyinari mereka
  rationale: Menjaga gambaran arah cahaya yang memancar ke atas mereka dan sesuai dengan konteks sumber-sumber cahaya.
- source_word: βασιλεύσουσιν
  choice: akan memerintah
  rationale: Menyampaikan arti memerintah atau berkuasa sebagai raja tanpa menambahkan pelaku atau wilayah pemerintahan yang tidak disebutkan.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: selama-lamanya
  rationale: Ungkapan Indonesia yang alami untuk idiom Yunani yang menegaskan durasi tanpa akhir.
theological_decisions:
- issue: Rujukan waktu οὐκ ἔχουσιν χρείαν dalam konteks penglihatan masa depan
  choice: mereka tidak memerlukan
  alternative: mereka tidak akan memerlukan
  rationale: Bentuk Yunani adalah kini, tetapi berada di antara verba-verba futur. Bahasa Indonesia memungkinkan bentuk yang tidak bertanda waktu ini tetap dipahami sebagai keadaan masa depan tanpa menghapus nuansa bentuk sumber.
- issue: Makna pemerintahan dalam βασιλεύσουσιν
  choice: akan memerintah
  alternative: akan memerintah sebagai raja-raja
  rationale: Pilihan utama mempertahankan makna verba tanpa secara berlebihan menjadikan metafora kerajaan sebagai nomina atau menambahkan rincian yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan jelas. Paralel 'cahaya pelita ataupun cahaya matahari' dipertahankan, sedangkan ungkapan durasi Yunani diterjemahkan secara idiomatis dan dijelaskan dalam catatan kaki.
